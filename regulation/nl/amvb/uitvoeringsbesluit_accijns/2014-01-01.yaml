  - number: 27a
    text: |-
      Teruggaaf van accijns voor minerale oliën waarvoor op de voet van [artikel 67, eerste lid, van de wet][ref1]
      aanspraak op een vrijstelling zou bestaan, wordt verleend indien uit de administratie van degene die verzoekt om
      teruggaaf van accijns blijkt:

      a. dat de minerale oliën zijn gebruikt of zullen worden gebruikt voor verwarmingsdoeleinden;

      b. op welke plaats het gebruik van de minerale oliën heeft plaatsgevonden of zal plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel67
    url: https://wetten.overheid.nl/BWBR0005360/2014-01-01#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '67'
  - number: '28'
    text: |-
      1 Teruggaaf van accijns voor accijnsgoederen die zijn verloren gegaan wordt verleend indien de goederen tot
      een bedrijfsvoorraad behoren en de belanghebbende onverwijld nadat is geconstateerd dat de accijnsgoederen zijn
      verloren gegaan, daarvan melding doet bij de inspecteur.

      2 De soort, de hoeveelheid en de voor de berekening van de teruggaaf van belang zijnde samenstelling van de
      accijnsgoederen die zijn verloren gegaan, alsmede het tijdstip waarop en de oorzaak waardoor de accijnsgoederen
      verloren zijn gegaan, dienen door de belanghebbende te worden aangetoond.

      3 Teruggaaf wordt uitsluitend verleend indien het verloren gaan van de accijnsgoederen is te wijten aan overmacht
      of ongeval.
    url: https://wetten.overheid.nl/BWBR0005360/2014-01-01#Artikel28
  - number: '29'
    text: |-
      Voor de toepassing van de teruggaaf voor onder ambtelijk toezicht vernietigde accijnsgoederen is
      [artikel 28, eerste en tweede lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005360#Artikel28
    url: https://wetten.overheid.nl/BWBR0005360/2014-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005360
        artikel: '28'
        hoofdstuk: IV
        afdeling: '2'
  - number: '30'
    text: |-
      Teruggaaf van accijns voor accijnsgoederen die zijn gebracht naar een derde land, wordt verleend indien in de
      administratie van degene die verzoekt om teruggaaf van accijns documenten zijn opgenomen die zijn vereist op grond
      van wettelijke bepalingen als bedoeld in [artikel 1:1, eerste en tweede lid, van de Algemene douanewet][ref1],
      waarmee wordt aangetoond dat de accijnsgoederen ten uitvoer zijn aangegeven en het grondgebied van de Unie hebben
      verlaten.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel11
    url: https://wetten.overheid.nl/BWBR0005360/2014-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: 1:1
  - number: '31'
    text: |-
      1 Teruggaaf van accijns voor accijnsgoederen die zijn gebracht binnen een accijnsgoederenplaats die voor dat soort
      accijnsgoed als zodanig is aangewezen, wordt verleend aan de vergunninghouder van de accijnsgoederenplaats waarnaar
      de goederen zijn overgebracht indien uit de administratie blijkt dat de goederen in zijn accijnsgoederenplaats
      zijn opgenomen.

      2 De vergunninghouder van de accijnsgoederenplaats brengt het bedrag waarvoor aanspraak op teruggaaf wordt gemaakt
      in mindering op het bedrag dat hij ingevolge [artikel 53 van de wet][ref1] op aangifte moet voldoen over het
      tijdvak waarin de desbetreffende accijnsgoederen binnen zijn accijnsgoederenplaats zijn gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel53
    url: https://wetten.overheid.nl/BWBR0005360/2014-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '53'
  - number: 31a
    text: |-
      1 Voor de toepassing van de teruggaaf van accijns voor accijnsgoederen die door een ondernemer zijn overgebracht in
      de zin van [artikel 71, eerste lid, onderdeel e, van de wet][ref1], moet belanghebbende:

      a. de accijnsgoederen vervoeren onder dekking van een vereenvoudigd administratief geleidedocument; en

      b. het van de geadresseerde terugontvangen derde exemplaar van het geleidedocument, voorzien van de aantekening
      door de geadresseerde dat de goederen door hem zijn ontvangen, in zijn administratie opnemen.

      2 Naast het in het eerste lid, onderdeel b, bedoelde exemplaar van het geleidedocument is in de administratie van
      belanghebbende een document opgenomen waaruit blijkt dat de betaling van accijns in de lidstaat van bestemming
      heeft plaatsgevonden. Indien in de lidstaat van bestemming geen accijns verschuldigd is, moet vorengenoemd document
      de navolgende gegevens vermelden:

      a. het adres van de ter zake bevoegde fiscale autoriteiten van de lidstaat van bestemming;

      b. de datum van aanvaarding van de aangifte door de ter zake bevoegde fiscale autoriteiten van de lidstaat van
      bestemming alsmede het registratienummer van de aangifte.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel71
    url: https://wetten.overheid.nl/BWBR0005360/2014-01-01#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '71'
  - number: 31b
    text: |-
      Voor de toepassing van de teruggaaf van accijns voor accijnsgoederen die zijn geleverd in de zin van
      [artikel 71, eerste lid, onderdeel f, van de wet][ref1], moet belanghebbende:

      a. in zijn administratie een document opnemen waaruit blijkt dat de betaling van accijns in de lidstaat van
      bestemming heeft plaatsgevonden. Indien in de lidstaat van bestemming geen accijns verschuldigd is, blijkt uit de
      administratie dat de accijnsgoederen in de lidstaat van bestemming zijn afgeleverd;

      b. voorafgaand aan de verzending van de accijnsgoederen bij één enkel, door de lidstaat van bestemming speciaal
      voor afstandsverkopen aangewezen loket en onder de door deze lidstaat vast te stellen voorwaarden, zijn identiteit
      bekend maken en zekerheid stellen voor de betaling van de accijns;

      c. bij de aankomst van de accijnsgoederen de accijns voldoen aan het in onderdeel b bedoelde loket;

      d. een administratie voeren van de leveringen van de accijnsgoederen.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel71
    url: https://wetten.overheid.nl/BWBR0005360/2014-01-01#Artikel31b
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '71'
  - number: 31d
    text: |-
      Het verzoek om teruggaaf, bedoeld in [artikel 71g van de wet][ref1], wordt gedaan uiterlijk drie maanden na afloop
      van het kalenderkwartaal waarin het vloeibaar gemaakt petroleumgas is geleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel71g
    url: https://wetten.overheid.nl/BWBR0005360/2014-01-01#Artikel31d
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: 71g
  - number: 31e
    text: |-
      1 Teruggaaf van accijns als bedoeld in [artikel 71h, eerste lid, van de wet][ref1], wordt slechts verleend indien
      de motorbrandstof wordt gebruikt voor het aandrijven van motorrijtuigen.

      2 Teruggaaf van accijns als bedoeld in het eerste lid, voor motorbrandstof waarvan via een massabalanssysteem als
      bedoeld in artikel 18, eerste lid, van de Richtlijn hernieuwbare energie, blijkt dat deze geheel of gedeeltelijk
      bestaat uit biobrandstof als bedoeld in artikel 2, onderdeel i, van die richtlijn, welke biobrandstof voldoet aan
      duurzaamheidscriteria als bedoeld in artikel 17 van die richtlijn, wordt verleend indien in de administratie van
      degene die verzoekt om teruggaaf van accijns een verklaring is opgenomen van een registeraccountant omtrent de
      juistheid, tijdigheid en volledigheid van de in dit massabalanssysteem opgenomen gegevens.

      3 Een teruggaaf van accijns op grond van de [artikelen 71][ref2] of [71a van de wet][ref3] voor motorbrandstof
      die geheel of gedeeltelijk bestaat uit biobrandstof als bedoeld in artikel 2, onderdeel i, van de Richtlijn
      hernieuwbare energie, welke biobrandstof voldoet aan duurzaamheidscriteria als bedoeld in artikel 17 van die
      richtlijn, wordt verminderd met een eerdere teruggaaf van accijns op grond van [artikel 71h van de wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel71h
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel71
      [ref3]: https://wetten.overheid.nl/BWBR0005251#Artikel71a
      [ref4]: https://wetten.overheid.nl/BWBR0005251#Artikel71h
