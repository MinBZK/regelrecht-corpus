  - number: 21a
    text: |-
      Vrijstelling van accijns ter zake van de uitslag tot verbruik van accijnsgoederen, andere dan voor de voortstuwing
      bestemde minerale olie, die worden gebruikt aan boord van luchtvaartuigen in het verkeer van Nederland naar een
      andere lidstaat wordt verleend indien:

      a. de eigenaar of exploitant van het luchtvaartuig of zijn vertegenwoordiger aan boord van het luchtvaartuig
      verklaart dat de aan hem te leveren accijnsgoederen worden gebruikt voor het in de aanhef bedoelde gebruik;

      b. de verklaring in tweevoud geschiedt met gebruikmaking van een door de vergunninghouder van de
      accijnsgoederenplaats opgesteld bescheid in geval van uitslag uit de accijnsgoederenplaats of met gebruikmaking van
      een door degene die de levering verricht opgesteld bescheid in geval van invoer;

      c. de eigenaar of exploitant van het luchtvaartuig of zijn vertegenwoordiger aan boord van het luchtvaartuig beide
      exemplaren van de verklaring ondertekent; en

      d. een exemplaar op overzichtelijke wijze wordt bewaard bij de administratie van de vergunninghouder van de
      accijnsgoederenplaats in geval van uitslag uit de accijnsgoederenplaats en bij de administratie van degene die
      de aangifte tot plaatsing onder de douaneregeling brengen in het vrije verkeer doet, in geval van invoer. Het
      andere exemplaar wordt op overzichtelijke wijze bewaard bij de administratie van de eigenaar of exploitant van
      het luchtvaartuig.
    url: https://wetten.overheid.nl/BWBR0005360/2014-01-01#Artikel21a
  - number: 21b
    text: |-
      1 De vrijstelling, bedoeld in artikel 66b, eerste en tweede lid, van de wet, wordt verleend indien wordt aangetoond
      dat de accijnsgoederen worden meegevoerd in de persoonlijke bagage van de reizigers, bedoeld in artikel 66b, eerste
      lid, van de wet, dan wel worden geleverd op de in artikel 66b, tweede lid, van de wet bedoelde wijze.

      2 In afwijking van [artikel 2, eerste lid][ref1], geschiedt het aantonen, bedoeld in het eerste lid, aan de hand
      van de bewijzen van vervoer, bedoeld in artikel 66b, derde lid, van de wet.

      3 Onverminderd [artikel 8, tweede lid][ref2], moet de administratie van de vergunninghouder van een
      accijnsgoederenplaats van waaruit de accijnsgoederen worden uitgeslagen in ieder geval bevatten de regelmatige
      aantekening van:

      a. de accijnsgoederen die worden meegevoerd in de persoonlijke bagage van de reizigers, bedoeld in artikel 66b,
      eerste lid, van de wet;

      b. de accijnsgoederen die worden geleverd op de in artikel 66b, tweede lid, van de wet bedoelde wijze;

      c. de bewijzen van vervoer, bedoeld in artikel 66b, derde lid, van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005360#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005360#Artikel8
    url: https://wetten.overheid.nl/BWBR0005360/2014-01-01#Artikel21b
