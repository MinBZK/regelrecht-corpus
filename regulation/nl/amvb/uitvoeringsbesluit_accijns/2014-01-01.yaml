      1 De overbrenging, bedoeld in [artikel 2e, derde lid, van de wet][ref1], van een accijnsgoed vanuit een andere
      lidstaat naar Nederland vindt plaats onder dekking van een vereenvoudigd administratief geleidedocument.

      2 De personen, bedoeld in [artikel 2e, tweede lid, van de wet][ref2], stellen de inspecteur voorafgaand aan de
      verzending van de accijnsgoederen in kennis van de verzending van de goederen en stellen zekerheid voor de accijns
      die zij verschuldigd kunnen worden.

      3 Het eerste en tweede lid zijn niet van toepassing met betrekking tot het vervoer van andere minerale oliën dan
      bedoeld in [artikel 5, vierde lid, van de wet][ref3].


