  - number: '20'
    text: |-
      1 Vrijstelling van accijns als bedoeld in [artikel 19][ref1] wordt voor lichte olie niet verleend.

      2 Vrijstelling van accijns als bedoeld in [artikel 19][ref2] wordt voor halfzware olie en gasolie
      uitsluitend verleend indien die oliën zijn voorzien van herkenningsmiddelen als bedoeld in
      [artikel 1a, derde lid, van de wet][ref3].

      3 Het tweede lid is van overeenkomstige toepassing op producten van GN-code 3824 90 99.


      [ref1]: https://wetten.overheid.nl/BWBR0005360#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0005360#Artikel19
