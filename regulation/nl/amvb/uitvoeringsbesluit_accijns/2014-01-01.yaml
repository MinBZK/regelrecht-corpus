  - number: 6a
    text: |-
      1 Het overbrengen van in Nederland reeds tot verbruik uitgeslagen accijnsgoederen via het grondgebied van een
      andere lidstaat naar een bestemming in Nederland vindt plaats onder dekking van een vereenvoudigd geleidedocument.

      2 De verzender van de in het eerste lid bedoelde accijnsgoederen stelt de inspecteur voorafgaand aan de verzending
      van de accijnsgoederen in kennis van de verzending.

      3 De geadresseerde van de in het eerste lid bedoelde accijnsgoederen stelt de inspecteur in kennis van de ontvangst
      van de goederen.

      4 Het overbrengen van accijnsgoederen die in een andere lidstaat tot verbruik zijn uitgeslagen en waarvan in
      Nederland de accijns niet is geheven via het grondgebied van Nederland naar een bestemming in die andere lidstaat,
      wordt aangetoond met een vereenvoudigd geleidedocument.

      5 [Artikel 34, derde lid, onderdeel a][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005360#Artikel34
    url: https://wetten.overheid.nl/BWBR0005360/2014-01-01#Artikel6a
