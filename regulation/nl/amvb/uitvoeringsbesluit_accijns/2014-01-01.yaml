  - number: 4a
    text: |-
      1 Niettegenstaande [artikel 3d][ref1] vormt in de gevallen, bedoeld in
      [artikel 2a, eerste, tweede en derde lid, van de wet][ref2], het in [artikel 1a, onderdeel g][ref3], bedoelde
      bericht van ontvangst of het in artikel 1a, onderdeel h, bedoelde bericht van uitvoer het bewijs dat een
      overbrenging overeenkomstig [artikel 2b, tweede lid, van de wet][ref4] is geëindigd.

      2 In afwijking van het eerste lid kan, bij gebreke van een bericht van ontvangst of een
      bericht van uitvoer om andere dan de in [artikel 3d][ref5] vermelde redenen, het eindigen
      van de overbrenging van accijnsgoederen onder een accijnsschorsingsregeling in de in
      [artikel 2a, eerste lid, onderdelen a, b, c en e, en derde lid, onderdelen a, b, c en e, van de wet][ref6]
      bedoelde gevallen ook worden aangetoond met een op basis van afdoend bewijs opgestelde aftekening van de bevoegde
      autoriteiten van de lidstaat van bestemming dat de verzonden accijnsgoederen de opgegeven bestemming hebben bereikt
      of, in de in artikel 2a, eerste lid, onderdeel d, en derde lid, onderdeel d, van de wet bedoelde gevallen, met
      een aftekening van de bevoegde autoriteiten van de lidstaat waar het douanekantoor van uitgang is gelegen, ter
      bevestiging dat de accijnsgoederen het grondgebied van de Unie hebben verlaten.

      3 Voor de toepassing van het tweede lid geldt een document dat door de geadresseerde wordt ingediend en dezelfde
      gegevens als het bericht van ontvangst of het bericht van uitvoer bevat, als afdoend bewijs.


