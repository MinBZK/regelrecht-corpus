    text: |-
      1 Indien, in de in de [artikelen 2, dertiende lid][ref1], [3, derde lid][ref2], en [3a, zesde lid][ref3], bedoelde
      gevallen, het in die bepalingen bedoelde bericht van ontvangst bij het eindigen van de overbrenging niet binnen
      de in die bepalingen vastgestelde termijn kan worden ingediend, hetzij omdat het EMCS niet beschikbaar is in
      Nederland, hetzij omdat de in die bepalingen bedoelde geadresseerde het e-AD nog niet heeft ontvangen als gevolg
      van het niet beschikbaar zijn van het EMCS in de lidstaat van verzending, dient de geadresseerde, behoudens
      in naar behoren gerechtvaardigde gevallen, bij de inspecteur een noodbericht van ontvangst als bedoeld in
      [artikel 1a, onderdeel j][ref4], in waarin wordt verklaard dat de overbrenging is geëindigd.

      2 Zodra het EMCS in Nederland weer beschikbaar komt of de in het eerste lid bedoelde geadresseerde het e-AD
      heeft ontvangen, dient de geadresseerde onverwijld een bericht van ontvangst in overeenkomstig onderscheidenlijk
      [artikel 2, dertiende lid][ref5], [3, derde lid][ref6], en [3a, zesde lid][ref7]. De artikelen 2, veertiende lid,
      3, vierde lid, en 3a, zevende lid zijn van overeenkomstige toepassing.


