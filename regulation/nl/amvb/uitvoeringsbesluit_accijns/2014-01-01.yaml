  - number: 9e
    text: |-
      1 Degene aan wie toestemming is verleend om accijnszegels aan te vragen moet per toestemming een zegeladministratie
      voeren.

      2 Indien de toestemming tot het aanvragen van accijnszegels door de inspecteur wordt ingetrokken, moet degene die
      de accijnszegels heeft aangevraagd de bij hem aanwezige voorraden accijnszegels, die nog niet op tabaksproducten
      zijn aangebracht, onverwijld aan de inspecteur zenden.
    url: https://wetten.overheid.nl/BWBR0005360/2014-01-01#Artikel9e
  - number: 9f
    text: |-
      1 In de in [artikel 75, eerste lid, onderdelen c en d, van de wet][ref1] bedoelde gevallen kunnen tabaksproducten
      worden uitgeslagen tot verbruik door een ander dan degene die de accijnszegels heeft aangevraagd.

      2 Degene die de accijnszegels heeft aangevraagd neemt in zijn zegeladministratie alle bescheiden op waaruit blijkt
      dat de accijns ter zake van de in het eerste lid bedoelde uitslag tot verbruik is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel75
