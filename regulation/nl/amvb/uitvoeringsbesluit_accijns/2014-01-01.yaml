  - number: '3'
    text: |-
      1 Het brengen als bedoeld in [artikel 2a, tweede lid, van de wet][ref1] van een accijnsgoed vanuit een
      belastingentrepot of door een in een andere lidstaat gevestigde geregistreerde afzender naar de in artikel 2a,
      tweede lid, onderdelen a tot en met c, van de wet bedoelde bestemmingen, geschiedt onder dekking van een e-AD.

      2 De persoon die de accijnsgoederen vergezelt moet op ieder moment van de overbrenging, bedoeld in het eerste
      lid, aan de inspecteur een gedrukt exemplaar van het e-AD of een ander handelsdocument waarop de ARC duidelijk
      herkenbaar is vermeld kunnen tonen.

      3 Bij ontvangst van de accijnsgoederen op een van de in
      [artikel 2a, tweede lid, onderdelen a tot en met c, van de wet][ref2] bedoelde bestemmingen zendt de geadresseerde,
      behoudens in ten genoegen van de inspecteur naar behoren gerechtvaardigde gevallen, onverwijld en uiterlijk binnen
      vijf werkdagen na het eindigen van de overbrenging overeenkomstig [artikel 2b, tweede lid, van de wet][ref3], een
      bericht van ontvangst.

      4 Indien de gegevens in het bericht van ontvangst niet in orde zijn bevonden, draagt de geadresseerde zorg voor
      aanpassing van de gegevens en dient hij het bericht van ontvangst onverwijld opnieuw in.


