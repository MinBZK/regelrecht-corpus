        artikel: '2'
  - number: '7'
    text: |-
      1 De ontheffing als bedoeld in [artikel 5, derde lid, onderdeel a, van de wet][ref1] vindt uitsluitend toepassing
      indien uit de administratie van degene die de accijnsgoederen vervaardigt uit andere accijnsgoederen blijkt dat
      het accijnsbedrag dat eerstbedoelde accijnsgoederen vertegenwoordigen niet hoger is dan het accijnsbedrag dat de
      accijnsgoederen vertegenwoordigen waaruit zij zijn vervaardigd en dat de accijns voor deze laatstbedoelde goederen
      is betaald.

      2 De ontheffing als bedoeld in [artikel 5, derde lid, onderdeel b, van de wet][ref2] vindt uitsluitend
      toepassing indien degene die de accijnsgoederen vervaardigt in het bezit is van een op grond van
      [artikel 18, eerste lid, onderdeel a][ref3], voor de vervaardiging van de desbetreffende accijnsgoederen verleende
      vergunning.

      3 De ontheffing als bedoeld in [artikel 5, derde lid, onderdeel c, van de wet][ref4] vindt uitsluitend toepassing
      indien de thuis vervaardigde accijnsgoederen worden verbruikt door de vervaardiger, zijn huisgenoten of zijn
      gasten.

      4 De ontheffing, bedoeld in [artikel 5, derde lid, onderdeel d, van de wet][ref5], vindt uitsluitend toepassing
      indien uit de administratie van degene die de minerale oliën vervaardigt of voor commerciële doeleinden voorhanden
      heeft blijkt dat het minerale oliën betreft bedoeld in [artikel 5, derde lid, onderdeel d, van de wet][ref6].


