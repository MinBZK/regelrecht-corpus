  - number: '3'
    text: |-
      Onze Minister van Justitie belast het Centraal Justitieel Incassobureau met het verrichten van de werkzaamheden
      die voortvloeien uit [artikel 36, zesde lid, van het Wetboek van Strafrecht][ref1]: het uitkeren van niet tijdig
      betaalde betalingsverplichtingen van de veroordeelde aan het slachtoffer en het verhaal op de veroordeelde.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel36
    url: https://wetten.overheid.nl/BWBR0027994/2016-08-30#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '36'
  - number: '5'
    text: |-
      1 Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.

      2 [Artikel 1, tweede lid][ref1], vervalt vijf jaar na inwerkingtreding van dit besluit. In het eerste lid vervalt
      het cijfer 1.


      [ref1]: https://wetten.overheid.nl/BWBR0027994#Artikel1
    url: https://wetten.overheid.nl/BWBR0027994/2016-08-30#Artikel5
