preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Justitie van 19 april 2010, nr. 5650324/10/6;


    Gelet op artikel 36f, zesde lid, van het Wetboek van Strafrecht;


    De Raad van State gehoord (advies van 11 juni 2010, nr. W03.10.0501/II);


    Gezien het nader rapport van Onze Minister van Justitie van 15 juli 2010, nr. 5661305/10/6;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0027994/2016-08-30#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Overeenkomstig [artikel 36f, zesde lid, van het Wetboek van Strafrecht][ref1] keert Onze Minister van Justitie het
      resterende bedrag van de maatregel, bedoeld in dat artikellid, uit aan het slachtoffer dat geen rechtspersoon is of
      diens nabestaanden.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel36f
    url: https://wetten.overheid.nl/BWBR0027994/2016-08-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 36f
  - number: '2'
    text: |-
      Ten aanzien van het uit te keren bedrag, bedoeld in [artikel 1, eerste lid][ref1], geldt een maximum van €
      5000. Dit maximum geldt niet in de gevallen, waarin het bedrag wordt uitgekeerd na een veroordeling terzake
      van een van de misdrijven als omschreven in de [artikelen 141][ref2], [239 tot en met 253][ref3], [273f][ref4],
      [287 tot en met 291][ref5], [300 tot en met 303][ref6], [312][ref7] en [317 van het Wetboek van Strafrecht][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0027994#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel141
