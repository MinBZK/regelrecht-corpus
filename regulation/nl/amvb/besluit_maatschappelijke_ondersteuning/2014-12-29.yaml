    Wet arbeidsongeschiktheidsverzekering zelfstandigen, Wet Invoering en financiering Wet werk en inkomen naar
    arbeidsvermogen, de Wet werk en inkomen naar arbeidsvermogen, de Ziektewet, de Wet inburgering nieuwkomers, de Wet
