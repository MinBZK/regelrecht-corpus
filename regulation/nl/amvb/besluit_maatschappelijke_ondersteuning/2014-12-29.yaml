articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. de wet: de [Wet maatschappelijke ondersteuning][ref1];

      b. inkomen:

      1°. indien over het peiljaar een aanslag of navorderingsaanslag inkomstenbelasting is of wordt vastgesteld: het
      inkomensgegeven, bedoeld in [artikel 21, onderdeel e, onder 1°, van de Algemene wet inzake rijksbelastingen][ref2];

      2°. in de overige gevallen: het inkomensgegeven, bedoeld in
      [artikel 21, onderdeel e, onder 2°, van de Algemene wet inzake rijksbelastingen][ref3].

      c. maatschappelijke opvang: maatschappelijk opvang, vrouwenopvang daaronder niet begrepen;

      d. peiljaar: het tweede kalenderjaar voorafgaande aan het jaar waarin aan een persoon maatschappelijke
      ondersteuning is verleend;

      e.

      f. grondslag sparen en beleggen: de grondslag sparen en beleggen, bedoeld in
      [artikel 5.2, eerste lid, van de Wet inkomstenbelasting 2001][ref4];

      g. zorgtoeslag: een tegemoetkoming als bedoeld in
      [artikel 1, eerste lid, onderdeel e, van de Wet op de zorgtoeslag][ref5];

      h.

      i. vermogen: vermogen als bedoeld in [artikel 1.1][ref6].


