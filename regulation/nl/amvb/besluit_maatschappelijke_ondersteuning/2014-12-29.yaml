  - number: '5'
    text: |-
      Als instellingen als bedoeld in [artikel 18, van de wet][ref1] worden aangewezen de instellingen die huishoudelijke
      verzorging verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0020031#Artikel18
