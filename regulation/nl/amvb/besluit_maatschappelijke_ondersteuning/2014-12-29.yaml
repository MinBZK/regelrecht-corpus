  - number: '4.6'
    text: |-
      Het CAK, is bevoegd tot verrekening van vorderingen krachtens de wet van of op een persoon met vorderingen van of
      op deze persoon krachtens deze wet of de [Algemene Wet Bijzondere Ziektekosten][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0020379/2014-12-29#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: '4.7'
    text: |-
      1 De [artikelen 4.1 tot en met 4.6][ref1] zijn niet van toepassing op maatschappelijke opvang en vrouwenopvang.

      2 Indien de gemeenteraad uitvoering heeft gegeven aan [artikel 15, eerste lid, van de wet][ref2], mag
      de hoogte van de eigen bijdrage voor verblijf in een maatschappelijke opvang of vrouwenopvang niet
      zodanig zijn dat de persoon die verblijft in een zodanige opvang, na afdracht van de eigen bijdrage
      van zijn netto inkomen minder overhoudt dan een bedrag dat overeenkomt met het bedrag, vermeld in
      [artikel 23, eerste lid, van de Wet werk en bijstand][ref3] vermeerderd met de standaardpremie, bedoeld in
      [artikel 1, eerste lid, onderdeel g, van de Wet op de zorgtoeslag][ref4], gecorrigeerd met de zorgtoeslag.


      [ref1]: https://wetten.overheid.nl/BWBR0020379#Artikel4.1
      [ref2]: https://wetten.overheid.nl/BWBR0020031#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel23
