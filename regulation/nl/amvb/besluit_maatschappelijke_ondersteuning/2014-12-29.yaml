  - number: 1b
    text: |-
      1 Het college van burgemeester en wethouders houdt bij het verlenen van een opdracht voor het leveren van
      individuele voorzieningen rekening met de mate waarin de aanbieder zorg draagt voor continuïteit in de
      hulpverlening tussen de persoon die aanspraak heeft op de individuele voorziening en de betrokken hulpverlener.

      2 Het college van burgemeester en wethouders neemt in een overeenkomst met betrekking tot het leveren van
      individuele voorzieningen op, dat de aanbieder in overleg treedt met de aanbieder of aanbieders die laatstelijk
      voor hem dan wel na hem in opdracht van het college die individuele voorzieningen hebben verleend dan wel gaan
      verlenen, over de overname van de betrokken hulpverleners.

      3 Het college van burgemeester en wethouders verleent een opdracht voor het leveren van individuele voorzieningen
      ten minste drie maanden voor de ingangsdatum van die opdracht.
    url: https://wetten.overheid.nl/BWBR0020379/2014-12-29#Artikel1b
  - number: '4.1'
    text: |-
      1 Indien de gemeenteraad uitvoering heeft gegeven aan [artikel 15, eerste lid][ref1], of
      [artikel 19, eerste lid, van de wet][ref2], mogen de verschuldigde eigen bijdrage en het aandeel in de kosten van
      maatschappelijke ondersteuning dat bij de toekenning van een financiële tegemoetkoming voor eigen rekening blijft,
      tezamen niet meer bedragen dan

      a. voor de ongehuwde persoon die de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref3], nog niet heeft bereikt € 19,40 per vier weken, met
      dien verstande dat indien zijn bijdrageplichtig inkomen meer bedraagt dan € 22.331 het bedrag van normalisation
      «Invoegen vast wit tussen valutasymbool en bedrag» € 19,40 wordt verhoogd met een dertiende deel van 15% van het
      verschil tussen dat inkomen en € 22.331;

      b. voor de ongehuwde persoon die de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref4], heeft bereikt € 19,40 per vier weken, met dien
      verstande dat indien zijn bijdrageplichtig inkomen meer bedraagt dan € 16.634 het bedrag van € 19,40 wordt verhoogd
      met een dertiende deel van 15% van het verschil tussen dat inkomen en € 16.634;

      c. voor de gehuwde personen indien een van beide de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref5], nog niet heeft bereikt of beiden die leeftijd nog
      niet hebben bereikt € 27,60 per vier weken, met dien verstande dat indien hun gezamenlijke bijdrageplichtig inkomen
      meer bedraagt dan € 27.917 het bedrag van € 27,60 wordt verhoogd met een dertiende deel van 15% van het verschil
      tussen dat gezamenlijke inkomen en € 27.917;

      d. voor de gehuwde personen die beiden de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref6], hebben bereikt € 27,60 per vier weken, met dien
      verstande dat indien hun gezamenlijke bijdrageplichtig inkomen meer bedraagt dan € 23.046 het bedrag van € 27,60
      wordt verhoogd met een dertiende deel van 15% van het verschil tussen dat gezamenlijke inkomen en € 23.046.

      2 De gemeenteraad kan de verschuldigde eigen bijdrage of het aandeel in de kosten van maatschappelijke
      ondersteuning dat bij de toekenning van een financiële tegemoetkoming voor eigen rekening blijft, verlagen door de
      in het eerste lid genoemde bedragen per vier weken of het percentage van 15 te verlagen of de overige in het eerste
      lid genoemde inkomensbedragen in gelijke mate te verhogen.

      3 Bij de toepassing van het eerste lid wordt per kalenderjaar uitgegaan van twaalf perioden van vier weken en een
      periode die, afhankelijk van resterende dagen, vier of vijf weken bedraagt.

      4 De verschuldigde eigen bijdrage en het aandeel in de kosten van maatschappelijke ondersteuning dat bij de
      toekenning van een financiële tegemoetkoming voor eigen rekening blijft, is niet hoger dan de kostprijs van de
      maatschappelijke ondersteuning.

      5 De bijdrage is niet verschuldigd voor een rolstoel.

      6 De bijdrage of het eigen aandeel in de kosten is niet verschuldigd indien de persoon aan wie
      maatschappelijke ondersteuning is verleend of zijn echtgenoot een bijdrage ingevolge de [artikelen 4][ref7] of
      [14 van het Bijdragebesluit zorg][ref8] verschuldigd is.

      7 De persoon aan wie maatschappelijke ondersteuning is verleend, is de eigen bijdrage of het eigen aandeel in de
      kosten niet verschuldigd in de periode, bedoeld in het derde lid, dat deze persoon gedurende meer dan een nacht
      verblijft in een maatschappelijke opvang of een vrouwenopvang.


