  - number: 4.1a
    text: |-
      De persoon aan wie maatschappelijke ondersteuning is verleend, betaalt de eigen bijdrage binnen dertig dagen nadat
      de beschikking is bekend gemaakt, tenzij de beschikking een later tijdstip vermeldt.
    url: https://wetten.overheid.nl/BWBR0020379/2014-12-29#Artikel4.1a
  - number: 4.1b
    text: |-
      1 De eigen bijdrage, bedoeld in [artikel 4.1][ref1], wordt vastgesteld uiterlijk 24 maanden na het tijdstip waarop
      het CAK ervan in kennis is gesteld dat maatschappelijke ondersteuning wordt verleend.

      2 Indien het CAK heeft verzuimd de eigen bijdrage vast te stellen binnen de in het eerste lid bedoelde periode, kan
      op een later tijdstip alsnog de eigen bijdrage worden vastgesteld, met dien verstande dat de ingangsdatum van de
      periode waarover de eigen bijdrage door de persoon aan wie maatschappelijke ondersteuning is verleend, moet worden
      betaald niet kan worden gesteld op een datum die is gelegen meer dan 24 maanden voor de dag waarop het besluit
      waarin de eigen bijdrage wordt vastgesteld, aan die persoon is verzonden.


      [ref1]: https://wetten.overheid.nl/BWBR0020379#Artikel4.1
    url: https://wetten.overheid.nl/BWBR0020379/2014-12-29#Artikel4.1b
    references:
      - id: ref1
        bwb_id: BWBR0020379
        artikel: '4.1'
        hoofdstuk: IV
  - number: '4.2'
    text: |-
      1 Het bijdrageplichtig inkomen, bedoeld in[ artikel 4.1, eerste lid][ref1], bedraagt het inkomen over het
      peiljaar van de ongehuwde persoon aan wie maatschappelijke ondersteuning is verleend, onderscheidenlijk van de
      gehuwde personen tezamen, vermeerderd met 8% van het vermogen van de ongehuwde persoon aan wie maatschappelijke
      ondersteuning is verleend, onderscheidenlijk 8% van de opgetelde vermogens van de persoon aan wie maatschappelijke
      ondersteuning is verleend en zijn echtgenoot.

      2 Inkomen dat in het buitenland wordt belast, dan wel is vrijgesteld van belasting op grond van bepalingen
      van internationaal recht, wordt mede in aanmerking genomen als ware dit aan de Nederlandse belastingwetgeving
      onderworpen.

      3 Op aanvraag van de persoon aan wie maatschappelijke ondersteuning is verleend vindt, in afwijking van het eerste
      lid, een voorlopige vaststelling van het bijdrageplichtig inkomen plaats op grond van het inkomen en het vermogen
      van het lopende jaar, indien redelijkerwijs te verwachten is dat het bijdrageplichtig inkomen in het lopende jaar
      ten minste € 2.540 lager zal zijn dan het bijdrageplichtig inkomen, bedoeld in het eerste lid.

      4 Indien het derde lid is toegepast, vindt na afloop van het jaar definitieve vaststelling van het bijdrageplichtig
      inkomen over dat jaar plaats. Indien daarbij blijkt dat het bijdrageplichtig inkomen in het lopende jaar minder
      dan € 2.540 lager is geweest dan het bijdrageplichtig inkomen, bedoeld in het eerste lid, vindt definitieve
      vaststelling plaats overeenkomstig het eerste lid.

      5 De aanvraag, bedoeld in het derde lid, wordt gedaan uiterlijk drie maanden na afloop van het kalenderjaar waarop
      de aanvraag betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0020379#Artikel4.1
