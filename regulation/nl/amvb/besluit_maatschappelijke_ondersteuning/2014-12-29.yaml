  - number: '4.4'
    text: |-
      1 Indien ten aanzien van de ongehuwde of gehuwde personen aan wie maatschappelijke ondersteuning is
      verleend geen inkomen beschikbaar is, wordt de bijdrage vastgesteld op het bedrag per vier weken, bedoeld in
      [artikel 4.1, eerste lid][ref1].

      2 Indien na de vaststelling van de eigen bijdrage uit een alsnog beschikbaar gekomen inkomen of uit een wijziging
      van een inkomen, blijkt dat de eigen bijdrage tot een te hoog of te laag bedrag is vastgesteld, herziet het CAK de
      eigen bijdrage met inachtneming van het beschikbaar gekomen inkomen dan wel van die wijziging.


      [ref1]: https://wetten.overheid.nl/BWBR0020379#Artikel4.1
    url: https://wetten.overheid.nl/BWBR0020379/2014-12-29#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0020379
        artikel: '4.1'
        hoofdstuk: IV
  - number: 4.4a
    text: |-
      1 De eigen bijdrage wordt herzien uiterlijk 24 maanden na het tijdstip waarop het CAK in kennis is gesteld van de
      omstandigheid die aanleiding geeft tot de wijziging.

      2 De herziene bijdrage wordt voor zover mogelijk verrekend met de eerder vastgestelde bijdrage.

      3 Indien het CAK heeft verzuimd de eigen bijdrage te herzien binnen de in het eerste lid bedoelde periode, kan op
      een later tijdstip alsnog de eigen bijdrage worden herzien, met dien verstande dat de ingangsdatum van de periode
      waarvoor de herziene eigen bijdrage door de persoon aan wie maatschappelijke ondersteuning is verleend, moet worden
      betaald niet kan worden gesteld op een datum die is gelegen meer dan 24 maanden voor de dag waarop het besluit
      waarin de eigen bijdrage is herzien, aan die persoon is verzonden.

      4 Voor zover de bevoegdheid tot herziening van de eigen bijdrage over een periode is vervallen op grond van het
      eerste lid, wordt de over die periode eerder vastgestelde eigen bijdrage van rechtswege definitief.
    url: https://wetten.overheid.nl/BWBR0020379/2014-12-29#Artikel4.4a
  - number: '4.5'
    text: |-
      1 Bij ministeriële regeling worden de bedragen per vier weken, genoemd in [artikel 4.1, eerste lid][ref1], en het
      bedrag, genoemd in [artikel 4.2, derde en vierde lid][ref2] jaarlijks gewijzigd aan de hand van de prijsindex voor
      de gezinsconsumptie.

      2 De berekende bedragen worden naar beneden afgerond op een veelvoud van € 0,2.

      3 Bij de jaarlijkse toepassing van het eerste lid wordt de afronding, bedoeld in het tweede lid, buiten beschouwing
      gelaten.

      4 In afwijking van het eerste lid worden de overige bedragen, genoemd in [artikel 4.1][ref3], jaarlijks
      bij ministeriële regeling gewijzigd aan de hand van de ontwikkelingen van het minimumloon, bedoeld in
      [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref4]. Het tweede en het
      derde lid zijn niet van toepassing.


