  - number: '1.1'
    text: |-
      1 Het vermogen van een persoon aan wie maatschappelijke ondersteuning is verleend respectievelijk van zijn
      echtgenoot, is het verschil tussen zijn vermogengrondslag en de op grond van het vierde en vijfde lid voor hem
      toegepaste verminderingen met dien verstande dat het ten minste nihil bedraagt.

      2 De vermogensgrondslag van een persoon aan wie maatschappelijke ondersteuning is verleend respectievelijk van zijn
      echtgenoot, is zijn grondslag sparen en beleggen, over het peiljaar, of indien op die persoon het tweede lid van de
      [Wet inkomstenbelasting 2001][ref1] van toepassing is, het aan hem over het peiljaar toegerekende gedeelte van de
      toepasselijke gezamenlijke grondslag sparen en beleggen, bedoeld in dat tweede lid.

      3 In afwijking van het tweede lid is de vermogensgrondslag van een persoon aan wie maatschappelijke ondersteuning
      is verleend, bij toepassing jegens hem van [artikel 4.2, derde lid][ref2], de te verwachten grondslag sparen en
      beleggen over het lopende jaar, of indien [artikel 5.2, tweede lid, van de Wet inkomstenbelasting 2001][ref3]
      vermoedelijk op de verzekerde van toepassing zal zijn, het te verwachten aan hem toe te rekenen deel van de
      toepasselijke te verwachten gezamenlijke grondslag sparen en beleggen, bedoeld in artikel 5.2, tweede lid, van de
      Wet inkomstenbelasting 2001.

      4 Op aanvraag wordt voor de persoon aan wie maatschappelijke ondersteuning is verleend
      respectievelijk voor zijn echtgenoot, een vermindering toegepast voor een bedrag ter grootte
      van door hem in het peiljaar of enig eerder jaar ontvangen eenmalige uitkeringen die krachtens
      [artikel 47 van de Algemene wet inkomensafhankelijke regelingen][ref4] zijn aangewezen.

      5 Het deel van het bedrag, bedoeld in het vierde lid, dat de vermogensgrondslag van de de persoon aan wie
      maatschappelijke ondersteuning is verleend respectievelijk van de echtgenoot, overtreft, wordt voor zijn echtgenoot
      als vermindering toegepast.


