  - number: '4.3'
    text: |-
      Voor de toepassing van de [artikelen 4.1][ref1] en [4.2][ref2] wordt een wijziging in de burgerlijke staat van de
      ongehuwde persoon of gehuwde personen en het bereiken van een van belang zijnde leeftijd van een van deze personen
      in aanmerking genomen met ingang van de datum waarop de bijdrage wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020379#Artikel4.1
      [ref2]: https://wetten.overheid.nl/BWBR0020379#Artikel4.2
