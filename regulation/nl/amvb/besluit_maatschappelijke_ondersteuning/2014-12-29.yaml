  - number: '7.1'
    text: |-
      De [artikelen 2.6 tot en met 2.10][ref1], zoals die luidden tot het tijdstip waarop [Hoofdstuk II][ref2] is komen
      te vervallen, blijven van toepassing met betrekking tot uitkeringen die zijn verstrekt op grond van dit besluit.


