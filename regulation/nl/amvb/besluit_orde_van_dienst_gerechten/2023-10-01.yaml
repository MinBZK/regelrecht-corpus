regulatory_layer: AMVB
publication_date: '2016-07-21'
valid_from: '2023-10-01'
bwb_id: BWBR0013132
url: https://wetten.overheid.nl/BWBR0013132/2023-10-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Justitie van 6 november 2001, nr. 5130698/01/6;

    Gelet op artikel 11 van de Wet op de rechterlijke organisatie;

    De Raad van State gehoord (advies van 28 november 2001, nr. W03.01.0583/I);

    Gezien het nader rapport van Onze Minister van Justitie van 5 december 2001, nr. 5136853/01/6;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder «bestuur van een gerecht»: de Hoge Raad, het bestuur van een rechtbank dan wel
      het bestuur van een gerechtshof.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel1
  - number: '2'
    text: |-
      De dagen waarop de gewone zittingen worden gehouden en de tijdstippen waarop de zittingen aanvangen, worden door
      het bestuur van een gerecht vastgesteld bij reglement. Voor burgerlijke zaken die met een dagvaarding worden
      ingeleid, worden in dat reglement de dag en het uur van de rolbehandeling opgenomen.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel2
  - number: '3.1'
    text: |-
      De voorzitter van de meervoudige kamer of degene die zitting heeft in een enkelvoudige kamer kan bepalen dat in
      verband met de omstandigheden in een bepaalde zaak voor de behandeling van die zaak op andere dagen, tijdstippen of
      plaatsen zittingen worden gehouden dan is vastgesteld in het reglement, bedoeld in [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013132#Artikel2
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0013132
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '3.2'
    text: Het bestuur van een gerecht kan bepalen dat voor enig ander doel een buitengewone zitting plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel3
  - number: '4.1'
    text: |-
      De voorzitter van de meervoudige kamer of degene die zitting heeft in een enkelvoudige kamer bepaalt de duur van
      zittingen.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel4
  - number: '4.2'
    text: Het bestuur van een gerecht draagt zorg voor het op tijd aanvangen van de zittingen.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel4
  - number: '5.1'
    text: |-
      Iedere rechterlijke ambtenaar met rechtspraak belast is bevoegd aan de procespartijen, advocaten en gemachtigden
      die optreden in zaken in zijn kamer aanhangig, inlichtingen te vragen naar aanleiding van de processtukken en de
      mondelinge voordrachten.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel5
  - number: '5.2'
    text: |-
      De voorzitter van de meervoudige kamer of degene die zitting heeft in een enkelvoudige kamer is belast met de
      handhaving van de orde tijdens de zittingen.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel5
  - number: '6.1'
    text: |-
      Het bestuur onderscheidenlijk de president van de Hoge Raad stelt vast hoe de voorzitter van een meervoudige kamer,
      bedoeld in de [artikelen 6, tweede lid][ref1], en [75, tweede lid, van de Wet op de rechterlijke organisatie][ref2]
      wordt aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0001830#Artikel75
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0001830
        artikel: '75'
  - number: '6.2'
    text: |-
      De leden van een kamer kunnen zich met instemming van het bestuur onderscheidenlijk de president van de Hoge Raad
      laten vervangen door een andere rechterlijke ambtenaar met rechtspraak belast, tenzij de goede gang van zaken
      binnen het gerecht zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel6
  - number: '6.3'
    text: |-
      Een rechterlijk ambtenaar met rechtspraak belast heeft, indien hij dit wenst, niet langer dan vier
      achtereenvolgende jaren zitting in dezelfde kamer.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel6
  - number: '6.4'
    text: |-
      Het derde lid is niet van toepassing, indien een rechterlijk ambtenaar wordt herplaatst in het kader van een
      reorganisatie als bedoeld in [hoofdstuk 4A van het Besluit rechtspositie rechterlijke ambtenaren][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Hoofdstuk4a
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006530
        hoofdstuk: 4a
  - number: '7.1'
    text: |-
      Het bestuur van een gerecht draagt zorg voor de bewaring van de aan de griffie toegezonden of ter griffie
      neergelegde stukken en geldbedragen.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel7
  - number: '7.2'
    text: |-
      Het bestuur van een gerecht draagt er zorg voor dat binnen een dag aan het openbaar ministerie kennis wordt gegeven
      van de ontvangst van processtukken in strafzaken die ingevolge de wet aan de griffie moeten worden toegezonden of
      ter griffie moeten worden neergelegd.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel7
  - number: '8.1'
    text: De arresten of vonnissen, in strafzaken gewezen, worden binnen het Rijk betekend.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel8
  - number: '8.2'
    text: 'Indien de betekening of tenuitvoerlegging geschiedt binnen het Rijk worden ten uitvoer gelegd en betekend:'
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel8
  - number: 8.2.a
    text: beschikkingen in raadkamer genomen;
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel8
  - number: 8.2.b
    text: bevelen tot voorlopige aanhouding, gevangenhouding, gevangenneming en medebrenging.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel8
  - number: '8.3'
    text: De stukken, bedoeld in het eerste en tweede lid, worden afgegeven aan degenen die met de uitvoering zijn belast.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel8
  - number: '9.1'
    text: |-
      De ambtenaren van het openbaar ministerie kunnen de uitspraken in strafzaken gewezen op hun parket ontvangen, met
      uitzondering van de stukken, bedoeld in [artikel 8][ref1], ten behoeve van de betekening.


      [ref1]: https://wetten.overheid.nl/BWBR0013132#Artikel8
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0013132
        artikel: '8'
        hoofdstuk: '1'
        paragraaf: '4'
  - number: '9.2'
    text: Zo nodig geschiedt de verzending van uitspraken per dienstbrief of op een andere veilige wijze.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel9
  - number: '10.1'
    text: |-
      De griffie is in de zittingsplaatsen, bedoeld in [artikel 21b, eerste en tweede lid, van de wet][ref1] op de
      dagen waarop terechtzittingen worden gehouden ten behoeve van de bij die zittingen betrokken procespartijen en hun
      advocaten en gemachtigden tenminste een kwartier voor de aanvang van een zitting en een kwartier na afloop daarvan
      geopend.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel21b
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: 21b
  - number: '10.2'
    text: |-
      Bij de behandeling van zaken in een zittingsplaats buiten het rechtsgebied, treedt de griffie van het gerecht
      binnen wiens rechtsgebied de zittingsplaats is gelegen op als griffie van het gerecht. De besturen van de betrokken
      gerechten dragen er zorg voor dat de griffie, de griffierwerkzaamheden en de administratie van zaken van het
      gerecht op de betreffende zittingsplaats gescheiden en als zodanig herkenbaar worden uitgevoerd van de griffie,
      de griffierwerkzaamheden en administratie van zaken van het gerecht binnen wiens rechtsgebied de zittingsplaats
      is gelegen.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel10
  - number: '11'
    text: |-
      Naast de bij of krachtens de wet aan de griffier opgedragen taken bestaan griffierswerkzaamheden in ieder geval
      uit:
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel11
  - number: 11.a
    text: het bijwonen van terechtzittingen en verhoren;
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel11
  - number: 11.b
    text: het maken van aantekeningen, en
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel11
  - number: 11.c
    text: het bieden van ondersteuning aan een rechterlijk ambtenaar met rechtspraak belast in al diens ambtsverrichtingen.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel11
  - number: '12.1'
    text: |-
      Indien door feitelijke omstandigheden van tijdelijke aard het niet mogelijk is dat griffierswerkzaamheden worden
      uitgevoerd in een zittingsplaats, kan het bestuur van een gerecht bepalen dat voor de duur van die omstandigheden
      griffierswerkzaamheden elders worden verricht.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel12
  - number: '12.2'
    text: Het besluit wordt gepubliceerd in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel12
  - number: '13.1'
    text: |-
      Het bestuur van een gerecht draagt zorg voor een deugdelijke administratie van de bij het gerecht aanhangige zaken,
      met dien verstande dat deze administratie tenminste voldoet aan de volgende eisen:
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel13
  - number: 13.1.a
    text: de rol maakt deel uit van de administratie en inschrijving ter rolle gebeurt door inschrijving in de administratie;
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel13
  - number: 13.1.b
    text: zaken worden ingeschreven in de volgorde waarin zij worden aangebracht;
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel13
  - number: 13.1.c
    text: aan elke zaak wordt een afzonderlijk nummer toegekend;
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel13
  - number: 13.1.d
    text: |-
      bij elke zaak worden tenminste de namen van de partijen vermeld en, indien van toepassing, van de advocaten of
      gemachtigden; en
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel13
  - number: 13.1.e
    text: |-
      bij elke zaak wordt aantekening gehouden van het verloop van de procedure en van hetgeen verder dienstig wordt
      geacht.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel13
  - number: '13.2'
    text: |-
      In afwijking van het eerste lid, onderdeel a, worden bij de Hoge Raad aanhangig gemaakte zaken ingeschreven in het
      digitale systeem voor gegevensverwerking, bedoeld in [artikel 2 van het Besluit elektronisch procederen][ref1], dat
      deel uit maakt van de administratie van de Hoge Raad.


      [ref1]: https://wetten.overheid.nl/BWBR0044275#Artikel2
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0044275
        artikel: '2'
  - number: '13.3'
    text: |-
      Een kamer kan, met instemming van het bestuur van het gerecht, bij haar aanhangige zaken verwijzen naar een andere
      kamer van gelijk getal.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel13
  - number: '14.1'
    text: |-
      Het bestuur van een rechtbank of gerechtshof geeft voor burgerlijke zaken die met een dagvaarding worden ingeleid
      in het bestuursreglement, bedoeld in [artikel 20, eerste lid, van de Wet op de rechterlijke organisatie][ref1], aan
      in welke zittingsplaats de rolbehandeling plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel20
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '20'
  - number: '14.2'
    text: Het eerste lid is niet van toepassing op zaken die door de kantonrechter worden behandeld.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel14
  - number: '15.1'
    text: |-
      Het bestuur van een rechtbank of een gerechtshof draagt er zorg voor dat tijdig voor elke openbare zitting een
      overzicht van de te behandelen zaken beschikbaar is, onder vermelding van:
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel15
  - number: 15.1.a
    text: de zaken die ter zitting zullen worden behandeld; en
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel15
  - number: 15.1.b
    text: de namen van de behandelende rechterlijke ambtenaren met rechtspraak belast.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel15
  - number: '15.2'
    text: Het in het eerste lid bedoelde overzicht kan ook elektronisch beschikbaar worden gesteld.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel15
  - number: '15.3'
    text: |-
      In afwijking van het eerste lid kan het bestuur ter bescherming van zwaarwegende belangen van anderen, waaronder
      die van partijen, geen of een beperkt overzicht ter beschikking stellen.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel15
  - number: '15.4'
    text: Indien de zaken gereed zijn voor voordracht, gebeurt dit in de volgorde waarin zij op de rol voorkomen.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel15
  - number: '15.5'
    text: |-
      Indien de behandelend rechterlijk ambtenaar met rechtspraak belast dit noodzakelijk acht in verband met de
      spoedeisendheid van een zaak, kan deze zaak worden voorgedragen in afwijking van de volgorde op de rol.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel15
  - number: 15a.1
    text: |-
      Het bestuur van de Hoge Raad draagt er zorg voor dat steeds een overzicht van de bij de Hoge Raad te behandelen
      zaken elektronisch beschikbaar is, onder vermelding van:
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel15a
  - number: 15a.1.a
    text: het zaaknummer; en
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel15a
  - number: 15a.1.b
    text: de stand waarin de procedure zich bevindt.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel15a
  - number: 15a.2
    text: |-
      Het bestuur van de Hoge Raad draagt er tevens zorg voor dat tijdig voor elke openbare zitting een overzicht van de
      te behandelen zaken beschikbaar is waarop de namen staan vermeld van de behandelende rechterlijke ambtenaren met
      rechtspraak belast. Dit overzicht kan elektronisch beschikbaar worden gesteld.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel15a
  - number: 15a.3
    text: |-
      In afwijking van het eerste en tweede lid kan het bestuur ter bescherming van zwaarwegende belangen van anderen,
      waaronder die van partijen, geen of een beperkte vermelding van de te behandelen zaak ter beschikking stellen.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel15a
  - number: '16.1'
    text: 'Een vonnis, arrest of beschikking in burgerlijke zaken wordt uitgesproken door:'
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel16
  - number: 16.1.a
    text: |-
      de voorzitter of een lid van de meervoudige kamer die dit vonnis of arrest heeft gewezen of de beschikking heeft
      gegeven;
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel16
  - number: 16.1.b
    text: het lid van de enkelvoudige kamer dat dit vonnis of arrest heeft gewezen of de beschikking heeft gegeven; of
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel16
  - number: 16.1.c
    text: een andere daartoe aangewezen rechter onderscheidenlijk raadsheer.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel16
  - number: '16.2'
    text: |-
      Een vonnis, arrest of beschikking in strafzaken wordt zo mogelijk uitgesproken door de voorzitter of één der
      rechterlijke ambtenaren met rechtspraak belast die over de zaak hebben geoordeeld.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel16
  - number: '16.3'
    text: |-
      Een uitspraak in bestuursrechtelijke zaken en in belastingzaken wordt zo mogelijk door de voorzitter of één der
      rechterlijke ambtenaren met rechtspraak belast die over de zaak hebben geoordeeld ter zitting meegedeeld.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel16
  - number: '16.4'
    text: |-
      Wanneer een rechterlijk ambtenaar met rechtspraak belast of griffier buiten staat is een uitspraak of een proces-
      verbaal te ondertekenen wordt daarvan in het betreffende stuk melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel16
  - number: '17'
    text: |-
      In strafzaken waarin de stukken ingevolge de wet aan de griffie moeten worden toegezonden of ter griffie ter
      inzage moeten worden neergelegd, worden door het bestuur van een gerecht bij reglement de tijden vastgesteld waarop
      inzage in de stukken kan worden verkregen door de ambtenaren van het openbaar ministerie of van het parket bij de
      Hoge Raad, de verdachten, de raadslieden van de verdachten, de benadeelde partijen in strafzaken en hun advocaten
      en gemachtigden.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel17
  - number: '18'
    text: |-
      Voor andere zaken dan strafzaken waarin recht op inzage van stukken bestaat, worden door het bestuur van een
      gerecht de tijden en de wijze waarop inzage kan plaatsvinden, vastgesteld bij reglement.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel18
  - number: '19.1'
    text: |-
      Indien een verdachte of een raadsman van een verdachte ingevolge de wet bevoegd is kennis te nemen van de
      processtukken wordt hem daartoe de gelegenheid geboden hetzij ter griffie hetzij, indien de verdachte rechtens van
      zijn vrijheid is beroofd, daar waar hij zich bevindt hetzij elders.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel19
  - number: '19.2'
    text: |-
      Indien door feitelijke omstandigheden van tijdelijke aard het niet mogelijk is dat aan – al dan niet rechtens
      van hun vrijheid beroofde – verdachten of hun raadslieden als bedoeld in het eerste lid, ter griffie gelegenheid
      wordt geboden kennis te nemen van processtukken kan het bestuur van een gerecht bepalen dat voor de duur van die
      omstandigheden elders gelegenheid wordt geboden tot kennisneming van processtukken.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel19
  - number: '19.3'
    text: |-
      Ingeval van het eerste en het tweede lid kan de verdachte voorts kennisneming
      worden geboden met behulp van een elektronische voorziening als bedoeld in
      [artikel 1, eerste lid, onderdeel c, van het Besluit digitale stukken Strafvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0038616#Artikel1
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0038616
        artikel: '1'
  - number: '19.4'
    text: Het besluit wordt gepubliceerd in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel19
  - number: '20.1'
    text: 'Indien dat noodzakelijk geacht wordt door:'
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel20
  - number: 20.1.a
    text: de voorzitter van de kamer door wie de zaak wordt behandeld, of
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel20
  - number: 20.1.b
    text: degene die zitting heeft in een enkelvoudige kamer door wie de zaak wordt behandeld,
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel20
  - number: '20.2'
    text: 'De mogelijkheid tot kennisneming wordt aldus geboden:'
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel20
  - number: 20.2.a
    text: van de stukken wordt het origineel dan wel een afschrift voorgelegd;
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel20
  - number: 20.2.b
    text: de betrokkene kan uit de stukken aantekeningen maken;
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel20
  - number: 20.2.c
    text: |-
      aan de verdachte die rechtens van zijn vrijheid is beroofd, worden desgewenst de voor het maken van de
      aantekeningen vereiste middelen ter beschikking gesteld.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel20
  - number: '21.1'
    text: |-
      Aan de raadslieden van verdachten in strafzaken worden zo spoedig als mogelijk is afschriften verstrekt van
      processtukken waarvan de kennisneming wettelijk is toegestaan.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel21
  - number: '21.2'
    text: |-
      Op verzoek van de verdachte of diens raadslieden worden zo spoedig als mogelijk is afschriften van
      processtukken waarvan de kennisneming wettelijk is toegestaan, aan hen verstrekt. Voor meer dan eenmalige
      verstrekking als bedoeld in dit lid kan van de verzoeker een vergoeding worden gevraagd met toepassing van
      [artikel 2, tweede lid, van het Besluit tarieven openbaarheid van bestuur][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005869#Artikel2
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005869
        artikel: '2'
  - number: '21.3'
    text: |-
      De voorgaande leden vinden geen toepassing indien op grond van
      [artikel 32 van het Wetboek van Strafvordering][ref1] is bepaald dat geen afschrift wordt verstrekt. De
      verstrekking van afschrift aan de verdachte kan voorts geschieden met behulp van een elektronische voorziening als
      bedoeld in [artikel 1, eerste lid, onderdeel c, van het Besluit digitale stukken Strafvordering][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0038616#Artikel1
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '32'
      - id: ref2
        bwb_id: BWBR0038616
        artikel: '1'
  - number: 21a.1
    text: |-
      Op verzoek van het slachtoffer of zijn advocaat of gemachtigde worden zo spoedig mogelijk afschriften van
      processtukken waarvan de kennisneming is toegestaan, aan hen verstrekt.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel21a
  - number: 21a.2
    text: |-
      [Artikel 21, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013132#Artikel21
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0013132
        artikel: '21'
        hoofdstuk: '1'
        paragraaf: '6'
  - number: '22.1'
    text: |-
      De ambtenaren van het openbaar ministerie werkzaam bij de arrondissementsparketten en bij het ressortsparket zenden
      een afschrift van een in kracht van gewijsde gegane uitspraak van een rechtbank of gerechtshof in burgerlijke zaken
      en belastingzaken naar de procureur-generaal bij de Hoge Raad, indien deze uitspraak naar hun mening in aanmerking
      komt voor cassatie in het belang der wet.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel22
  - number: '22.2'
    text: De inzending van de afschriften, bedoeld in het eerste lid, wordt met redenen omkleed.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel22
  - number: '23.1'
    text: |-
      De ambtenaren van het openbaar ministerie zenden een afschrift van een in kracht van gewijsde gegane uitspraak
      in strafzaken van een rechtbank of gerechtshof van de plaats van vestiging van hun arrondissementsparket
      onderscheidenlijk ressortsparket, naar de procureur-generaal bij de Hoge Raad, indien deze uitspraak naar hun
      mening onder zijn aandacht moet worden gebracht wegens het algemeen belang of een andere reden.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel23
  - number: '23.2'
    text: De inzending van de afschriften, bedoeld in het eerste lid wordt met redenen omkleed.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel23
  - number: '24'
    text: |-
      De leden van het openbaar ministerie en van het parket bij de Hoge Raad nemen geen deel aan de beraadslagingen in
      de raadkamer over het opmaken van een beschikking, vonnis of arrest.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel24
  - number: '25.1'
    text: De griffier van de Hoge Raad draagt zorg voor de bij de Hoge Raad in behandeling zijnde stukken.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel25
  - number: '25.2'
    text: |-
      Bij afwezigheid van de griffier treedt op de substituut-griffier dan wel, bij afwezigheid van de substituut-
      griffier, een waarnemend griffier, op basis van een volgorde die, na overleg met de president, door de griffier
      is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel25
  - number: '26.1'
    text: |-
      Met uitzondering van de raadsheren in buitengewone dienst, bedoeld in
      [artikel 5a, derde lid, van de Wet rechtspositie rechterlijke ambtenaren][ref1], vormen de in
      [artikel 72, eerste lid, van de Wet op de rechterlijke organisatie][ref2] genoemde rechterlijke ambtenaren met
      rechtspraak belast en de griffier tezamen de gerechtsvergadering van de Hoge Raad.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0001830#Artikel72
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 5a
      - id: ref2
        bwb_id: BWBR0001830
        artikel: '72'
  - number: '26.2'
    text: De president is voorzitter van de gerechtsvergadering.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel26
  - number: '26.3'
    text: |-
      Het bijeenroepen geschiedt door een schriftelijke kennisgeving van de president. Hij doet dit ten minste zeven
      dagen voorafgaand aan de bijeenkomst.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel26
  - number: '26.4'
    text: |-
      De raadsheren in buitengewone dienst, bedoeld in
      [artikel 5a, derde lid, van de Wet rechtspositie rechterlijke ambtenaren][ref1], de bij de Hoge Raad werkzame
      gerechtsauditeurs, substituut-griffier en gerechtsambtenaren en de bij het parket van de Hoge Raad werkzame
      rechterlijke ambtenaren en gerechtsambtenaren kunnen op uitnodiging deelnemen aan de gerechtsvergadering.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel5a
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 5a
  - number: '27.1'
    text: |-
      In de gedingen, bedoeld in [artikel 76 van de Wet op de rechterlijke organisatie][ref1],
      zal een lid van de bij het reglement van inwendige dienst, bedoeld in
      [artikel 75, vierde lid, van de Wet op de rechterlijke organisatie][ref2], aangewezen kamer tot commissaris
      worden benoemd, en wordt tevens de behandeling aan die kamer opgedragen, met uitzondering van de behandeling op de
      openbare terechtzitting.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0001830#Artikel75
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '76'
      - id: ref2
        bwb_id: BWBR0001830
        artikel: '75'
  - number: '27.2'
    text: |-
      De behandeling op de openbare terechtzitting vindt plaats door een andere, eveneens bij het reglement van inwendige
      dienst aangewezen, kamer dan de kamer, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel27
  - number: '28.1'
    text: |-
      De reglementen, genoemd in de [artikelen 2][ref1], [17][ref2] en [18][ref3], worden door het gerechtsbestuur
      vastgesteld nadat de vertegenwoordigers van het openbaar ministerie, de Nederlandse orde van advocaten en de
      Koninklijke Beroepsorganisatie van Gerechtsdeurwaarders in het arrondissement onderscheidenlijk in het ressort
      zijn gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0013132#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013132#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0013132#Artikel18
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0013132
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0013132
        artikel: '17'
        hoofdstuk: '1'
        paragraaf: '6'
      - id: ref3
        bwb_id: BWBR0013132
        artikel: '18'
        hoofdstuk: '1'
        paragraaf: '6'
  - number: '28.2'
    text: De reglementen, bedoeld in het eerste lid, worden gepubliceerd in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel28
  - number: '29'
    text: Het Reglement I wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel29
  - number: '30'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel30
  - number: '31'
    text: 'Dit besluit wordt aangehaald als: Besluit orde van dienst gerechten.'
    url: https://wetten.overheid.nl/BWBR0013132/2023-10-01#Artikel31
