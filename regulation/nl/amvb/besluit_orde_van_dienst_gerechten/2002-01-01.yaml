bwb_id: BWBR0013132
url: https://wetten.overheid.nl/BWBR0013132/2002-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Justitie van 6 november 2001, nr. 5130698/01/6;

    Gelet op artikel 11 van de Wet op de rechterlijke organisatie;

    De Raad van State gehoord (advies van 28 november 2001, nr. W03.01.0583/I);

    Gezien het nader rapport van Onze Minister van Justitie van 5 december 2001, nr. 5136853/01/6;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder «bestuur van een gerecht»: de Hoge Raad, het bestuur van een rechtbank dan wel
      het bestuur van een gerechtshof.
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel1
  - number: '2.1'
    text: |-
      De dagen waarop de gewone zittingen worden gehouden en de tijdstippen waarop de zittingen aanvangen, worden door
      het bestuur van een gerecht vastgesteld bij reglement.
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel2
  - number: '2.2'
    text: Het reglement wordt gepubliceerd in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel2
  - number: '3'
    text: |-
      De voorzitter van de meervoudige kamer of degene die zitting heeft in een enkelvoudige kamer kan bepalen dat in
      verband met de omstandigheden in een bepaalde zaak danwel de organisatie van het gerecht, buitengewone zittingen
      worden gehouden.
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel3
  - number: '4.1'
    text: |-
      De voorzitter van de meervoudige kamer of degene die zitting heeft in een enkelvoudige kamer bepaalt de duur van
      zittingen.
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel4
  - number: '4.2'
    text: Het bestuur van een gerecht draagt zorg voor het op tijd aanvangen van de zittingen.
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel4
  - number: '5'
    text: |-
      De voorzitter van de meervoudige kamer of degene die zitting heeft in een enkelvoudige kamer is belast met
      de handhaving van de orde tijdens de zittingen. Hij is bevoegd aan de procespartijen, advocaten, procureurs,
      gemachtigden en in persoon procederende partijen, die optreden in zaken in zijn kamer aanhangig, inlichtingen te
      vragen naar aanleiding van de processtukken en de mondelinge voordrachten.
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel5
  - number: '6.1'
    text: |-
      De leden van een kamer zijn bevoegd, na kennisgeving aan het bestuur onderscheidenlijk de president van de Hoge
      Raad, zich te laten vervangen door een lid van een andere kamer, tenzij de gang van zaken binnen laatstgenoemde
      kamer zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel6
  - number: '6.2'
    text: |-
      Een rechterlijk ambtenaar met rechtspraak belast heeft, indien hij dit wenst, niet langer dan vier
      achtereenvolgende jaren zitting in dezelfde sector.
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel6
  - number: '7.1'
    text: |-
      Het bestuur van een gerecht draagt zorg voor de bewaring van de aan de griffie toegezonden of ter griffie
      neergelegde stukken en geldbedragen.
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel7
  - number: '7.2'
    text: |-
      Het bestuur van een gerecht draagt er zorg voor dat binnen vierentwintig uur aan het openbaar ministerie kennis
      wordt gegeven van de ontvangst van processtukken in strafzaken die ingevolge de wet aan de griffie moeten worden
      toegezonden of ter griffie moeten worden neergelegd.
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel7
  - number: '8.1'
    text: |-
      Processtukken en, buiten de gevallen bij de wet bepaald, bevelschriften en in raadkamer genomen beschikkingen in
      strafzaken worden verzonden in minuut.
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel8
  - number: '8.2'
    text: 'Onder processtukken worden niet verstaan:'
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel8
  - number: 8.2.a
    text: de vonnissen en arresten gewezen in de openbare terechtzitting;
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel8
  - number: 8.2.b
    text: de processen-verbaal van hetgeen is voorgevallen op de terechtzitting;
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel8
  - number: 8.2.c
    text: de aantekeningen of verklaringen die in krachtens de wet te houden openbare registers worden ingeschreven.
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel8
  - number: '9.1'
    text: De arresten of vonnissen, in strafzaken gewezen, worden binnen het Rijk op de minuut betekend.
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel9
  - number: '9.2'
    text: |-
      Indien de betekening of tenuitvoerlegging geschiedt binnen het Rijk worden op de minuut ten uitvoer gelegd en
      betekend:
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel9
  - number: 9.2.a
    text: beschikkingen in raadkamer genomen;
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel9
  - number: 9.2.b
    text: bevelen tot voorlopige aanhouding, gevangenhouding, gevangenneming en medebrenging.
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel9
  - number: '9.3'
    text: De minuten worden afgegeven aan degenen die met de uitvoering zijn belast.
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel9
  - number: '10.1'
    text: |-
      De ambtenaren van het openbaar ministerie kunnen de minuten van alle uitspraken in strafzaken gewezen op hun parket
      ontvangen, met uitzondering van de stukken ten behoeve van de betekening.
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel10
  - number: '10.2'
    text: |-
      Indien het parket gevestigd is buiten de gemeente waar het gerecht zijn hoofdplaats heeft, geschiedt de verzending
      van uitspraken in minuut per dienstbrief of op een andere veilige wijze.
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel10
  - number: '11'
    text: 'De griffie is in de hoofdplaats, de nevenvestigingsplaats en de nevenzittingsplaats:'
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel11
  - number: 11.a
    text: op de dagen waarop terechtzittingen worden gehouden tenminste een half uur voor de aanvang daarvan geopend;
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel11
  - number: 11.b
    text: op zaterdagen geopend, mits op een dergelijke dag zittingen worden gehouden;
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel11
  - number: 11.c
    text: |-
      op zondagen en dagen die bij of krachtens de [Algemene termijnenwet][ref1] zijn aangemerkt als algemeen erkende
      feestdagen gesloten, tenzij op een dergelijke dag een zitting wordt gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0002448
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002448
  - number: '12'
    text: |-
      Naast de bij of krachtens de wet aan de griffier opgedragen taken bestaan griffierswerkzaamheden in ieder geval
      uit:
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel12
  - number: 12.a
    text: het bijwonen van terechtzittingen en verhoren;
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel12
  - number: 12.b
    text: |-
      het bijwonen van andere dan de onder a genoemde bijeenkomsten, tenzij de voorzitter van de betrokken kamer of
      degene die zitting heeft in een enkelvoudige kamer anders beslist;
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel12
  - number: 12.c
    text: het maken van aantekeningen zoals vereist door de wet of door een rechterlijk ambtenaar met rechtspraak belast, en
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel12
  - number: 12.d
    text: het bieden van ondersteuning aan een rechterlijk ambtenaar met rechtspraak belast in al diens ambtsverrichtingen.
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel12
  - number: '13.1'
    text: |-
      Het bestuur van een gerecht draagt er zorg voor dat een algemene rol wordt gehouden voor burgerlijke zaken waarop
      alle zaken worden ingeschreven:
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel13
  - number: 13.1.a
    text: in de volgorde waarin zij worden aangebracht,
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel13
  - number: 13.1.b
    text: met de namen van de partijen, de advocaten, de gemachtigden en de procureurs,
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel13
  - number: 13.1.c
    text: onder toekenning van een afzonderlijk nummer, en
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel13
  - number: 13.1.d
    text: voorzien van een korte aantekening van al hetgeen in de zaak voorvalt.
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel13
  - number: '13.2'
    text: |-
      Indien binnen de gerechten meerdere kamers zijn gevormd voor de behandeling van burgerlijke zaken, krijgt elke
      kamer een afzonderlijke rol. De zaken worden in dat geval onverwijld aangebracht bij de kamer die daartoe is
      aangewezen in het bestuursreglement, bedoeld in [artikel 19][ref1], en in het geval van de Hoge Raad in het
      reglement, bedoeld in [artikel 75, vierde lid, van de Wet op de rechterlijke organisatie][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013132#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0001830#Artikel75
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0013132
        artikel: '19'
        hoofdstuk: '1'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0001830
        artikel: '75'
  - number: '14.1'
    text: |-
      Het bestuur van een rechtbank of gerechtshof geeft voor burgerlijke zaken die met een dagvaarding worden ingeleid
      en die in een nevenvestigings- of nevenzittingsplaats worden of kunnen worden behandeld, in het bestuursreglement,
      bedoeld in [artikel 19 van de Wet op de rechterlijke organisatie][ref1], aan in welke plaats de rolbehandeling
      plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel19
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '19'
  - number: '14.2'
    text: Het eerste lid is niet van toepassing op zaken die door de kantonrechter worden behandeld.
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel14
  - number: '15.1'
    text: |-
      Het bestuur van een gerecht draagt er zorg voor dat voor elke zitting een uittreksel van de rol beschikbaar is, die
      de zaken vermeldt die moeten worden opgeroepen.
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel15
  - number: '15.2'
    text: Indien de zaken gereed zijn voor voordracht, gebeurt dit in de volgorde waarin zij op de rol voorkomen.
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel15
  - number: '15.3'
    text: |-
      Indien de behandelend rechterlijk ambtenaar met rechtspraak belast dit noodzakelijk acht in verband met de
      spoedeisendheid van een zaak, kan deze zaak worden voorgedragen in afwijking van de volgorde op de rol.
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel15
  - number: '16'
    text: |-
      Indien een zaak niet tijdens een zitting kan worden afgedaan, wordt de behandeling op een andere dag voortgezet,
      waarbij de oorspronkelijke volgorde van de zaken gehandhaafd blijft.
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel16
  - number: '17'
    text: |-
      Indien tegen een bij verstek gewezen vonnis of arrest in verzet wordt gekomen, herneemt de zaak haar oude plaats op
      de rol, tenzij de voorzitter van de meervoudige kamer of degene die zitting heeft in een enkelvoudige kamer een dag
      vaststelt waarop het verzet wordt behandeld.
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel17
  - number: '18'
    text: |-
      Het bestuur van een rechtbank of een gerechtshof draagt er zorg voor dat een afzonderlijke rol wordt gehouden voor
      de zaken die door de voorzieningenrechter in kort geding worden behandeld.
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel18
  - number: '19'
    text: |-
      Het bestuur van een gerecht draagt er zorg voor dat een rol wordt gehouden voor strafzaken waarop
      alle zaken die op de openbare terechtzitting worden behandeld, worden ingeschreven, overeenkomstig de
      [onderdelen van a tot en met d van artikel 13, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013132#Artikel13
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0013132
        artikel: '13'
        hoofdstuk: '1'
        paragraaf: '5'
  - number: '20'
    text: |-
      Het bestuur van een gerechtshof draagt er zorg voor dat een rol wordt gehouden voor belastingzaken waarop alle
      zaken worden ingeschreven, overeenkomstig de [onderdelen a tot en met d van artikel 13, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013132#Artikel13
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0013132
        artikel: '13'
        hoofdstuk: '1'
        paragraaf: '5'
  - number: '21'
    text: |-
      In strafzaken waarin de stukken ingevolge de wet aan de griffie moeten worden toegezonden of ter griffie ter inzage
      moeten worden neergelegd, bepaalt het bestuur van een gerecht de tijden waarop inzage in de stukken kan worden
      verkregen door de rechterlijke ambtenaren met rechtspraak belast, de ambtenaren van het openbaar ministerie of van
      het parket bij de Hoge Raad en de raadslieden van de verdachten.
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel21
  - number: '22'
    text: |-
      Indien een verdachte of een raadsman van een verdachte ingevolge de wet bevoegd is kennis te nemen van de
      processtukken wordt hem daartoe de gelegenheid geboden hetzij ter griffie hetzij, indien de verdachte rechtens van
      zijn vrijheid is beroofd, daar waar hij zich bevindt hetzij elders.
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel22
  - number: '23.1'
    text: 'De mogelijkheid tot kennisneming wordt aldus geboden:'
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel23
  - number: 23.1.a
    text: van de stukken wordt het origineel dan wel een afschrift voorgelegd;
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel23
  - number: 23.1.b
    text: de betrokkene kan uit de stukken aantekeningen maken;
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel23
  - number: 23.1.c
    text: |-
      aan de verdachte die rechtens van zijn vrijheid is beroofd, worden desgewenst de voor het maken van de
      aantekeningen vereiste middelen ter beschikking gesteld.
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel23
  - number: '23.2'
    text: De kennisneming wordt indien noodzakelijk onder toezicht gehouden.
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel23
  - number: '24'
    text: 'Indien noodzakelijk geschiedt de kennisneming onder verantwoordelijkheid van:'
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel24
  - number: 24.a
    text: de rechter-commissaris tijdens het gerechtelijk vooronderzoek;
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel24
  - number: 24.b
    text: leden van het openbaar ministerie tijdens het overige voorbereidend onderzoek;
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel24
  - number: 24.c
    text: |-
      de voorzitter van de kamer dan wel degene die zitting heeft in een enkelvoudige kamer door wie de zaak wordt
      behandeld van het tijdstip af, bedoeld in [artikel 33 van het Wetboek van Strafvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel33
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '33'
  - number: '25'
    text: |-
      Op hun verzoek worden afschriften van processtukken waarvan de kennisneming wettelijk is toegestaan, zo spoedig als
      mogelijk is verstrekt aan de verdachte of diens raadsman, zonder dat daardoor het onderzoek vertraging ondervindt.
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel25
  - number: '26'
    text: |-
      Het nemen van een conclusie op de daarvoor vastgestelde dag door ambtenaren van het openbaar ministerie of de
      procureur-generaal bij de Hoge Raad, kan slechts eenmaal worden uitgesteld.
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel26
  - number: '27.1'
    text: |-
      De leden van het openbaar ministerie en van het parket bij de Hoge Raad nemen geen deel aan de beraadslagingen in
      de raadkamer over het opmaken van een beschikking, vonnis of arrest.
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel27
  - number: '27.2'
    text: |-
      De ambtenaren van het openbaar ministerie en van het parket bij de Hoge Raad zijn bevoegd om in de registers van de
      gerechten hun requisitoiren in te schrijven indien zij dat noodzakelijk achten.
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel27
  - number: '28.1'
    text: |-
      De griffier bij de Hoge Raad is het hoofd van de griffie en draagt zorg voor de boekerij en de bij de Hoge Raad in
      behandeling zijnde stukken.
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel28
  - number: '28.2'
    text: |-
      Bij afwezigheid van de griffier treedt als hoofd van de griffie op een substituut-griffier dan wel, bij afwezigheid
      van een substituutgriffier, een waarnemend griffier, op basis van een volgorde die, na overleg met de president,
      door de griffier is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel28
  - number: '29.1'
    text: |-
      De in [artikel 72, eerste lid, van de Wet op de rechterlijke organisatie][ref1], genoemde rechterlijke ambtenaren
      met rechtspraak belast en de griffier vormen tezamen de gerechtsvergadering van de Hoge Raad.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel72
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '72'
  - number: '29.2'
    text: De president is voorzitter van de gerechtsvergadering.
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel29
  - number: '29.3'
    text: |-
      Het bijeenroepen geschiedt door een schriftelijke kennisgeving van de president. Hij doet dit ten minste zeven
      dagen voorafgaand aan de bijeenkomst.
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel29
  - number: '29.4'
    text: De bij de Hoge Raad werkzame gerechtsambtenaren kunnen op uitnodiging deelnemen aan de gerechtsvergadering.
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel29
  - number: '30.1'
    text: |-
      In de gedingen, bedoeld in [artikel 76 van de Wet op de rechterlijke organisatie][ref1],
      zal een lid van de bij het reglement van inwendige dienst, bedoeld in
      [artikel 75, vierde lid, van de Wet op de rechterlijke organisatie][ref2], aangewezen kamer tot commissaris
      worden benoemd, en wordt tevens de behandeling aan die kamer opgedragen, met uitzondering van de behandeling op de
      openbare terechtzitting.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0001830#Artikel75
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '76'
      - id: ref2
        bwb_id: BWBR0001830
        artikel: '75'
  - number: '30.2'
    text: |-
      De behandeling op de openbare terechtzitting vindt plaats door een andere, eveneens bij het reglement van orde
      aangewezen, kamer dan de kamer, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel30
  - number: '31.1'
    text: |-
      De ambtenaren van het openbaar ministerie werkzaam bij de ressortsparketten en bij de arrondissementsparketten
      zenden een afschrift van een in kracht van gewijsde gegaan vonnis, arrest of uitspraak van een rechtbank of
      gerechtshof in burgerlijke zaken en belastingzaken naar de procureur-generaal bij de Hoge Raad, indien dit naar hun
      mening in aanmerking komt voor cassatie in het belang der wet.
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel31
  - number: '31.2'
    text: De inzending van de afschriften, bedoeld in het eerste lid, wordt met redenen omkleed.
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel31
  - number: '32.1'
    text: |-
      De ambtenaren van het openbaar ministerie zenden een afschrift van een in kracht van gewijsde gegaan vonnis
      of arrest in strafzaken van een rechtbank of gerechtshof waarbij hun arrondissementsparket onderscheidenlijk
      ressortsparket gevestigd is, naar de procureur-generaal bij de Hoge Raad, indien dit naar hun mening onder zijn
      aandacht moet worden gebracht vanwege het algemeen belang of een andere reden.
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel32
  - number: '32.2'
    text: 'De inzending van de afschriften, bedoeld in het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel32
  - number: 32.2.a
    text: wordt met redenen omkleed;
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel32
  - number: 32.2.b
    text: behelst de naam van het gerecht;
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel32
  - number: 32.2.c
    text: behelst de namen van de procespartijen, en
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel32
  - number: 32.2.d
    text: geschiedt maandelijks.
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel32
  - number: '32.3'
    text: |-
      De vonnissen van de rechtbank worden door het hoofd van het arrondissementsparket gezonden aan het hoofd van het
      ressortsparket. Deze zendt de ingekomen stukken tezamen met de vonnissen of arresten van het gerechtshof aan de
      procureur-generaal bij de Hoge Raad.
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel32
  - number: '33.1'
    text: |-
      De president van de Hoge Raad stelt een verzoek om dispensatie of gratie onverwijld in handen van de procureur-
      generaal bij de Hoge Raad.
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel33
  - number: '33.2'
    text: |-
      Over het verzoek, bedoeld in het eerste lid, verschaft de procureur-generaal inlichtingen of brengt hij een
      schriftelijk advies uit, aan de kamer die het verzoek behandelt. Alvorens zijn advies uit te brengen vraagt de
      procureur-generaal inlichtingen aan de bij deze zaak meest betrokken ambtenaar van het openbaar ministerie, wanneer
      hij deze voor de behandeling van het verzoek noodzakelijk acht.
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel33
  - number: '33.3'
    text: |-
      De voorzitter van de kamer, bedoeld in het tweede lid, benoemt een rapporteur. Op basis van diens rapport brengt de
      kamer een met redenen omkleed advies uit aan de regering. Het advies is ondertekend door de voorzitter van de kamer
      en de griffier.
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel33
  - number: '34'
    text: Het Reglement I wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel34
  - number: '35'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel35
  - number: '36'
    text: 'Dit besluit wordt aangehaald als: Besluit orde van dienst gerechten.'
    url: https://wetten.overheid.nl/BWBR0013132/2002-01-01#Artikel36
