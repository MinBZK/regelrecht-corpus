  - number: IV
    text: |-
      De werkzaamheden van het Centraal Fonds voor de Volkshuisvesting, strekkende tot de uitvoering in 2008 van
      het [Besluit Centraal Fonds voor de Volkshuisvesting][ref1], als gewijzigd door dit besluit, en dit besluit,
      die voor de inwerkingtreding van dit besluit zijn verricht, staan gelijk aan werkzaamheden waarop het
      [Besluit Centraal Fonds voor de Volkshuisvesting][ref2], als gewijzigd door dit besluit, en dit besluit van
      toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0004418
      [ref2]: https://wetten.overheid.nl/BWBR0004418
