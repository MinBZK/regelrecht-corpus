articles:
  - number: III
    text: |-
      1 Ten aanzien van het heffingsjaar 2008:

      a. blijft [artikel 7, onderdeel d, van het Besluit Centraal Fonds voor de Volkshuisvesting][ref1] buiten
      toepassing;

      b. bepaalt het Centraal Fonds voor de Volkshuisvesting de hoogte van de bijdrage, bedoeld in
      [artikel 71e, tweede lid, van de Woningwet][ref2], terstond na de inwerkingtreding van dit besluit;

      c. maakt dat fonds de hoogte van de bijdrage binnen drie weken na de bepaling daarvan bekend aan de toegelaten
      instellingen, bedoeld in [artikel 70 van de Woningwet][ref3], en

      d. betalen die toegelaten instellingen die bijdrage binnen drie weken na de bekendmaking daarvan aan dat fonds.

      2 In afwijking van [artikel 12, derde lid, onderdeel a, van het Besluit Centraal Fonds voor de Volkshuisvesting][ref4]
      is ten aanzien van het heffingsjaar 2008 de datum waarop het Centraal Fonds voor de Volkshuisvesting de
      uitvoeringsovereenkomst als bedoeld in [dat besluit][ref5] heeft ontvangen: 15 oktober 2008.


