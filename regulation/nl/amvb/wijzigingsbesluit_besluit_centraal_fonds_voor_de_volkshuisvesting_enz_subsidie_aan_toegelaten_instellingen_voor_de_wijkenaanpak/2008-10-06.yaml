  - number: V
    text: |-
      Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip. Bij koninklijk besluit
      kan een ander tijdstip worden vastgesteld waarop [artikel I, onder B][ref1], voor zover het betreft
      [artikel 2, derde lid][ref2], in werking treedt.


