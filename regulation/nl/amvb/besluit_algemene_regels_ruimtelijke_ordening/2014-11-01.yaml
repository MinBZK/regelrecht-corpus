  - number: 2.4.3
    text: |-
      1 Een bestemmingsplan wijst ten opzichte van het daaraan voorafgaande bestemmingsplan alleen nieuwe bestemmingen in
      een rivierbed aan in het geval er sprake is van:

      a. een zodanige situering van de bestemming dat het veilig en doelmatig gebruik van het oppervlaktewaterlichaam
      gewaarborgd blijft;

      b. geen feitelijke belemmering voor de vergroting van de afvoercapaciteit van de rivier;

      c. een zodanige situering van de bestemming dat de waterstandverhoging of de afname van het bergend vermogen zo
      gering mogelijk is, en

      d. een zodanige situering van de bestemming dat de ecologische toestand van het oppervlaktewaterlichaam niet
      verslechtert.

      2 Bij toepassing van het eerste lid worden resterende waterstandeffecten of afname van het bergend vermogen
      gecompenseerd.

      3 In een bestemmingsplan wordt vastgelegd hoe de effecten op de waterstand en de afname van het bergend vermogen
      worden gecompenseerd.
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.4.3
  - number: 2.4.4
    text: |-
      Onverminderd [artikel 2.4.3][ref1] kan een bestemmingsplan dat betrekking heeft op het stroomvoerend deel van het
      rivierbed ten opzichte van het daaraan voorafgaande bestemmingsplan uitsluitend een wijziging mogelijk maken, voor
      zover daarbij een of meer van de volgende activiteiten worden mogelijk gemaakt:

      a. de aanleg of wijziging van waterstaatkundige kunstwerken;

      b. de verwezenlijking van voorzieningen voor een betere en veilige afwikkeling van de beroeps- of recreatievaart;

      c. de bouw of wijziging van waterkrachtcentrales;

      d. de vestiging of uitbreiding van overslagbedrijven of het realiseren van overslagfaciliteiten, uitsluitend voor
      zover de activiteit gekoppeld is aan het vervoer over de rivier;

      e. de aanleg of wijziging van scheepswerven voor beroeps- of pleziervaartuigen;

      f. de verwezenlijking en het beheer van natuurterreinen;

      g. de uitbreiding of wijziging van bestaande steenfabrieken;

      h. de verwezenlijking van voorzieningen die onlosmakelijk met de waterrecreatie zijn verbonden;

      i. de winning van oppervlaktedelfstoffen;

      j. de verwezenlijking van voorzieningen van groot openbaar belang die niet buiten het rivierbed kunnen worden
      gerealiseerd;

      k. activiteiten van een zwaarwegend bedrijfseconomisch belang voor bestaande grondgebonden agrarische bedrijven die
      niet buiten het rivierbed kunnen worden gerealiseerd;

      l. een functieverandering binnen de bestaande bebouwing;

      m. activiteiten die onderdeel uitmaken van de lijst van maatregelen opgenomen in de Bijlage bij de planologische
      kernbeslissing Ruimte voor de Rivier en waarvan de uitvoering wordt gefinancierd door Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0030378#Artikel2.4.3
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.4.4
    references:
