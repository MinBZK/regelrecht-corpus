  - number: 2.10.1
    text: |-
      1 In deze titel en de daarop berustende bepalingen wordt verstaan onder:

        - *ecologische hoofdstructuur:* stelsel van natuurgebieden van internationaal of nationaal belang dat strekt tot de
      veiligstelling van ecosystemen met de daarbij behorende soorten;
        - *nieuwe bebouwing:* het oprichten van bouwwerken, anders dan het vervangen van bouwwerken door bouwwerken van
      gelijke omvang;
        - *wezenlijke kenmerken en waarden:* aanwezige natuurwaarden en, voor gebieden met een bestemming natuur, tevens
      potentiële natuurwaarden en de daarvoor vereiste bodem- en watercondities, voor zover deze natuurwaarden en
      condities in het licht van de internationale biodiversiteitdoelstellingen relevant zijn.

      2 Deze titel is niet van toepassing op de wateren, genoemd in [bijlage II, onderdeel 1, van het Waterbesluit][ref1],
      het Lauwersmeer, het Veerse meer, het Vuile Gat in het Haringvliet en de zeegeul naar het Haringvliet, genaamd het
      Slijkgat, met uitzondering van de bijbehorende uiterwaarden en de Brabantse, Dordtsche en Sliedrechtse Biesbosch.


      [ref1]: https://wetten.overheid.nl/BWBR0026872
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.10.1
    references:
      - id: ref1
        bwb_id: BWBR0026872
  - number: 2.10.2
    text: |-
      1 Bij provinciale verordening worden de gebieden aangewezen die de ecologische hoofdstructuur vormen. De ligging
      van die gebieden wordt geometrisch vastgelegd.

      2 Geen onderdeel van de ecologische hoofdstructuur vormen de militaire terreinen, aangewezen bij regeling van Onze
      Minister in overeenstemming met Onze Minister van Economische Zaken, Landbouw en Innovatie en Onze Minister van
      Defensie.
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.10.2
  - number: 2.10.3
    text: |-
      1 Bij provinciale verordening worden de wezenlijke kenmerken en waarden van de gebieden, bedoeld in
      [artikel 2.10.2, eerste lid][ref1], aangewezen.

      2 Bij provinciale verordening worden in het belang van de bescherming, instandhouding
      en ontwikkeling van de wezenlijke kenmerken en waarden regels gesteld omtrent de
      inhoud van bestemmingsplannen en omgevingsvergunningen waarbij met toepassing van
      [artikel 2.12, eerste lid, onderdeel a, onder 3°, van de Wet algemene bepalingen omgevingsrecht][ref2] van het
      bestemmingsplan wordt afgeweken. Bij de verordening kunnen in het hiervoor genoemde belang tevens regels worden
      gesteld omtrent de inhoud van omgevingsvergunningen waarbij met toepassing van artikel 2.12, eerste lid, onderdeel
      a, onder 2°, van de Wet algemene bepalingen omgevingsrecht van het bestemmingsplan wordt afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0030378#Artikel2.10.2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2.12
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.10.3
    references:
      - id: ref1
        bwb_id: BWBR0030378
        artikel: 2.10.2
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2.12'
  - number: 2.10.4
    text: |-
      1 Bij provinciale verordening worden regels gesteld die bewerkstelligen dat een bestemmingsplan dat betrekking
      heeft op een gebied behorende tot de ecologische hoofdstructuur en een omgevingsvergunning waarbij met toepassing
      van [artikel 2.12, eerste lid, onderdeel a, onder 3°, van de Wet algemene bepalingen omgevingsrecht][ref1]
      van het bestemmingsplan wordt afgeweken geen activiteiten mogelijk maken ten opzichte van het ten tijde van
      inwerkingtreding van de verordening geldende bestemmingsplan, die per saldo leiden tot een significante aantasting
      van de wezenlijke kenmerken en waarden, of tot een significante vermindering van de oppervlakte van die gebieden,
      of van de samenhang tussen die gebieden, tenzij:

      a. er sprake is van een groot openbaar belang,

      b. er geen reële alternatieven zijn, en

      c. de negatieve effecten op de wezenlijke kenmerken en waarden, oppervlakte en samenhang worden beperkt en de
      overblijvende effecten gelijkwaardig worden gecompenseerd.

      2 De regels, bedoeld in het eerste lid, kunnen tevens betrekking
      hebben op omgevingsvergunningen waarbij met toepassing van
      [artikel 2.12, eerste lid, onderdeel a, onder 2°, van de Wet algemene bepalingen omgevingsrecht][ref2] van het
      bestemmingsplan wordt afgeweken.

      3 Ten aanzien van bestemmingsplannen en omgevingsvergunningen waarbij met toepassing van
      [artikel 2.12, eerste lid, onderdeel a, onder 2° of 3°, van de Wet algemene bepalingen omgevingsrecht][ref3]
      van het bestemmingsplan wordt afgeweken die ten opzichte van het ten tijde van inwerkingtreding van de verordening
      geldende bestemmingsplan nieuwe bebouwing of terreinverharding binnen omheinde militaire terreinen mogelijk maken,
      stelt de verordening uitsluitend de voorwaarde, bedoeld in het eerste lid, onderdeel c.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.12
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2.12
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel2.12
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.10.4
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2.12'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2.12'
      - id: ref3
        bwb_id: BWBR0024779
        artikel: '2.12'
  - number: 2.10.5
    text: |-
      De begrenzing, bedoeld in [artikel 2.10.2, eerste lid][ref1], kan bij provinciale verordening worden gewijzigd:

      a. ten behoeve van een verbetering van de samenhang of een betere planologische inpassing van de ecologische
      hoofdstructuur, voor zover:

      1°. de wezenlijke kenmerken en waarden van de ecologische hoofdstructuur worden behouden, en

      2°. de oppervlakte van de ecologische hoofdstructuur ten minste gelijk blijft;

      b. ten behoeve van een kleinschalige ontwikkeling, voor zover:

      1°. de aantasting van de wezenlijke kenmerken en waarden en de samenhang van de ecologische hoofdstructuur beperkt
      is,

      2°. de ontwikkeling per saldo gepaard gaat met een versterking van de wezenlijke kenmerken en waarden van de
      ecologische hoofdstructuur, of een vergroting van de oppervlakte van de ecologische hoofdstructuur, en

      3°. de oppervlakte van de ecologische hoofdstructuur ten minste gelijk blijft;

      c. ten behoeve van de toepassing van de krachtens [artikel 2.10.4, eerste lid][ref2], gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0030378#Artikel2.10.2
      [ref2]: https://wetten.overheid.nl/BWBR0030378#Artikel2.10.4
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.10.5
