  - number: 2.2.8
    text: |-
      1 Een bestemmingsplan dat betrekking heeft op gronden binnen de begrenzing van het openbaar toegankelijk natuur-
      en recreatiegebied Midden-IJsselmonde bevat ten noorden van de Essendijk bestemmingen die dienstbaar zijn aan
      openluchtrecreatie met natuurwaarden.

      2 Een bestemmingsplan dat betrekking heeft op gronden binnen de begrenzing van het openbaar toegankelijk natuur-
      en recreatiegebied Midden-IJsselmonde bevat ten zuiden van de Essendijk bestemmingen die dienstbaar zijn aan
      hoogwaardige natuur waarbij recreatief medegebruik wordt toegestaan.

      3 Een bestemmingsplan als bedoeld in het eerste en tweede lid kan agrarische activiteiten mogelijk maken, voor
      zover deze een bijdrage leveren aan de functies, genoemd in het eerste, onderscheidenlijk tweede lid.

      4 Een bestemmingsplan als bedoeld in het eerste of tweede lid kan een nevenfunctie bevatten ten behoeve van
      landschappelijke of cultuurhistorische elementen die op het tijdstip van inwerkingtreding van dit besluit in het
      gebied, bedoeld in het eerste of tweede lid, aanwezig zijn.

      5 In afwijking van het eerste en tweede lid kan een bestemmingsplan:

      a. voor gronden waarop op het tijdstip van inwerkingtreding van dit besluit gebouwen rechtmatig aanwezig zijn of
      waarop een gebouw krachtens een verleende omgevingsvergunning voor het bouwen kan worden opgericht dan wel waarvoor
      een aanvraag voor zodanige vergunning is ingediend die kan worden verleend, een zelfde bestemming aanwijzen als die
      welke gold voor het tijdstip van inwerkingtreding van dit besluit;

      b. een dubbelbestemming aanwijzen ten behoeve van leidingen voor telecommunicatie en het transport van gassen,
      vloeistoffen of elektriciteit.

      6 Een bestemmingsplan dat betrekking heeft op gronden binnen de begrenzing van het openbaar toegankelijk natuur-
      en recreatiegebied Schiebroekse en Zuidpolder bevat voor een totale grondoppervlakte van circa 100 hectare een
      bestemming voor natuur en recreatie en stelt met het oog daarop regels omtrent het gebruik van die gronden.

      7 Indien de gronden, bedoeld in het zesde lid, begrepen zijn in meer dan één bestemmingsplan, bedraagt de som
      van het aantal hectaren dat in die bestemmingsplannen gezamenlijk bestemd is voor natuur en recreatie en daaraan
      dienstbare functies circa 100 hectare.

      8 Een bestemmingsplan dat betrekking heeft op gronden binnen de begrenzing van het openbaar toegankelijk natuur- en
      recreatiegebied Schiezone bevat voor een totale grondoppervlakte van circa 50 hectare een bestemming voor natuur en
      recreatie en stelt met het oog daarop regels omtrent het gebruik van die gronden.

      9 Indien de gronden, bedoeld in het achtste lid, begrepen zijn in meer dan één bestemmingsplan, bedraagt de som
      van het aantal hectaren dat in die bestemmingsplannen gezamenlijk bestemd is voor natuur en recreatie en daaraan
      dienstbare functies circa 50 hectare.
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.2.8
  - number: 2.3.1
    text: |-
      1 In deze titel en de daarop berustende bepalingen wordt verstaan onder:

        - *beschermingszone:* beschermingszone als bedoeld in [artikel 1.1 van de Waterwet][ref1], voor zover grenzend aan
      een primaire waterkering;
        - *kustfundament:* gebied waarvan de geometrische plaatsbepaling is vastgelegd in het GML-bestand bij dit besluit
      en is verbeeld op [kaart 2][ref2];
        - *nieuwe bebouwing:* oprichten van bouwwerken, anders dan het vervangen van bouwwerken door bouwwerken van gelijke
      omvang;
        - *primaire waterkering:* primaire waterkering als bedoeld in [artikel 1.1 van de Waterwet][ref3], voor zover
      gelegen op het kustfundament;
        - *stedelijk gebied:* bij bestemmingsplan toegelaten stedenbouwkundig samenstel van bebouwing ten behoeve van
      wonen, dienstverlening, bedrijvigheid, detailhandel en horeca, alsmede de daarbij behorende openbare of sociaal-
      culturele voorzieningen en infrastructuur, met uitzondering van stedelijk groen aan de rand van dat samenstel en
      met uitzondering van lineaire bebouwing langs wegen, waterwegen of dijken.

      2 Deze titel is van toepassing op gronden binnen de begrenzing van het kustfundament.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel1.1
      [ref2]: https://wetten.overheid.nl/BWBR0030378
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.3.1
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '1.1'
      - id: ref2
        bwb_id: BWBR0030378
      - id: ref3
