        artikel: 2.4.3
        hoofdstuk: '2'
  - number: 2.4.5
    text: |-
      1 Onverminderd [artikel 2.4.3][ref1] maakt een bestemmingsplan dat betrekking heeft op het stroomvoerend deel
      van het rivierbed ten opzichte van het daaraan voorafgaande bestemmingsplan geen wijziging mogelijk, die andere
      bestemmingen dan bedoeld in [artikel 2.4.4][ref2], onder j tot en met m, toestaat tenzij daarbij activiteiten
      worden mogelijk gemaakt die per saldo meer ruimte voor de rivier opleveren op een vanuit rivierkundig oogpunt
      bezien zo gunstig mogelijke locatie.

      2 Aan het eerste lid wordt slechts toepassing gegeven voor zover in het bestemmingsplan is vastgelegd welke
      maatregelen die per saldo meer ruimte voor de rivier opleveren worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0030378#Artikel2.4.3
      [ref2]: https://wetten.overheid.nl/BWBR0030378#Artikel2.4.4
