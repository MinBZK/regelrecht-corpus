  - number: 2.6.6
    text: |-
      1 Bij de eerstvolgende herziening van een bestemmingsplan dat betrekking heeft op een inrichting voor activiteiten
      met explosieven wordt voor die gronden de bestemming «Maatschappelijk – Explosieven en munitie» opgenomen en worden
      geen bestemmingen opgenomen die een belemmering kunnen vormen voor de functionele bruikbaarheid van de inrichting.

      2 Bij regeling van Onze Minister worden voor elke inrichting voor activiteiten met explosieven drie
      veiligheidszones aangewezen, aan te duiden als A-zone, B-zone en C-zone, waarbij de A-zone de kleinste afstand tot
      de inrichting voor activiteiten met explosieven heeft en de C-zone de grootste afstand.

      3 In afwijking van het tweede lid kan, afhankelijk van de aard van de opgeslagen munitie, sprake zijn van minder
      dan drie veiligheidszones.
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.6.6
  - number: 2.6.7
    text: |-
      1 Bij de eerstvolgende herziening van een bestemmingsplan dat betrekking heeft op gronden, gelegen binnen
      de veiligheidszonering van een militaire munitieopslagplaats of een civiele inrichting voor activiteiten met
      explosieven wordt de gebiedsaanduiding van de veiligheidszones opgenomen.

      2 Bij de eerstvolgende herziening van een bestemmingsplan dat betrekking heeft op gronden binnen de begrenzing van
      de A-zone worden:

      a. geen bestemmingen opgenomen die het oprichten van kwetsbare of beperkt kwetsbare objecten als bedoeld in
      het [Besluit externe veiligheid inrichtingen][ref1] mogelijk maken, of de aanleg van autowegen, autosnelwegen,
      spoorwegen of druk bevaren waterwegen, parkeerterreinen of recreatieve voorzieningen toestaan, en

      b. geen agrarische bestemmingen opgenomen die niet kunnen worden gerealiseerd zonder een meer dan incidentele
      aanwezigheid van enkele personen.

      3 Bij de eerstvolgende herziening van een bestemmingsplan dat betrekking heeft op gronden binnen begrenzing van de
      B-zone worden geen bestemmingen opgenomen die het oprichten van kwetsbare of beperkt kwetsbare objecten als bedoeld
      in het [Besluit externe veiligheid inrichtingen][ref2] toestaan.

      4 Bij de eerstvolgende herziening van een bestemmingsplan dat betrekking heeft op gronden binnen de begrenzing
      van de C-zone worden geen bestemmingen opgenomen die het oprichten van bouwwerken mogelijk maken met vlies- of
      gordijngevelconstructies of grote glasoppervlakten en waarbinnen zich doorgaans een groot aantal personen bevindt.

      5 Onze Minister, in overeenstemming met Onze Minister van Defensie, kan regels stellen voor de beoordeling van de
      veiligheidssituatie en het risico van activiteiten in de veiligheidszones.


      [ref1]: https://wetten.overheid.nl/BWBR0016767
      [ref2]: https://wetten.overheid.nl/BWBR0016767
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.6.7
    references:
      - id: ref1
        bwb_id: BWBR0016767
      - id: ref2
        bwb_id: BWBR0016767
  - number: 2.6.8
    text: |-
      1 Bij de eerstvolgende herziening van een bestemmingsplan dat betrekking heeft op een zend- en ontvangstinstallatie
      buiten een militair luchtvaartterrein, wordt voor die gronden de bestemming «Maatschappelijk – militaire zend- en
      ontvangstinstallatie» opgenomen en worden geen bestemmingen opgenomen die een belemmering kunnen vormen voor de
      functionele bruikbaarheid van die zend- en ontvangstinstallatie.

      2 Bij de eerstvolgende herziening van een bestemmingsplan dat betrekking heeft op een bouwbeperkingengebied rondom
      een zend- en ontvangstinstallatie buiten een militair luchtvaartterrein, worden geen bestemmingen opgenomen die een
      wijziging bewerkstelligen die het oprichten van bouwwerken hoger dan 22 meter gemeten vanaf het maaiveld mogelijk
      maken.
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.6.8
  - number: 2.6.9
    text: |-
      1 Bij de eerstvolgende herziening van een bestemmingsplan dat betrekking heeft op een radarstation op gronden
      buiten een militair terrein of militair luchtvaartterrein, wordt voor die gronden de bestemming «Maatschappelijk –
      militaire zend- en ontvangstinstallatie» opgenomen en worden geen bestemmingen opgenomen die een belemmering kunnen
      vormen voor de functionele bruikbaarheid van dat radarstation.

      2 Bij de eerstvolgende herziening van een bestemmingsplan dat betrekking heeft op een radarverstoringsgebied voor
      een radarstation, worden geen bestemmingen opgenomen die het oprichten van bouwwerken mogelijk maken die door hun
      hoogte onaanvaardbare gevolgen kunnen hebben voor de werking van de radar.

      3 Bij regeling van Onze Minister, in overeenstemming met Onze Minister van Defensie, worden de maximale bouwhoogten
      binnen de radarverstoringsgebieden, bedoeld in [artikel 2.6.2, negende lid][ref1], vastgesteld.

      4 Bij de voorbereiding van een bestemmingsplan dat betrekking heeft op gronden als bedoeld in het tweede lid,
      waarbij wordt overwogen het oprichten van bouwwerken mogelijk te maken die de maximale hoogte, bedoeld in het
      derde lid, overschrijden, wordt een beoordeling gemaakt van de mate waarin het radarbeeld door die bouwwerken wordt
      verstoord.

      5 Onze Minister in overeenstemming met Onze Minister van Defensie, kan regels stellen met betrekking tot de wijze
      waarop de gevolgen, bedoeld in het vierde lid, bij die beoordeling worden bepaald en beschreven. Die regels kunnen
      mede betreffen de wijze van de totstandkoming van de beoordeling.

      6 Onze Minister van Defensie beoordeelt de toereikendheid van de beoordeling, bedoeld in het vierde lid, en de
      aanvaardbaarheid van de daarin beschreven gevolgen voor de werking van de radar.

      7 De regels, bedoeld in het derde tot en met zesde lid, zijn niet van toepassing op bouwwerken:

      a. die op het tijdstip van inwerkingtreding van dit besluit reeds in het radarverstoringsgebied, bedoeld in het
      derde lid, onder a, aanwezig waren;

      b. waarvoor de bouwvergunning vóór dat tijdstip is verleend, of waarvan de bouw in het op dat tijdstip geldende
      bestemmingsplan is toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0030378#Artikel2.6.2
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.6.9
