  - number: 2.8.7
    text: |-
      1 Een bestemmingsplan dat betrekking heeft op een hoogspanningsverbinding als bedoeld in
      [artikel 2.8.6, eerste of derde lid][ref1], bevat het tracé van die hoogspanningsverbinding en laat het gebruik als
      hoogspanningsverbinding toe.

      2 Een bestemmingsplan wijst geen ander tracé van de hoogspanningsverbinding aan.

      3 In afwijking van het tweede lid kan, na schriftelijk advies van de beheerder van het hoogspanningsnet,
      een ander tracé van de hoogspanningsverbinding worden aangewezen, mits de hoogspanningsverbinding als
      zodanig in het bestemmingsplan wordt gehandhaafd, het bestemmingsplan het gebruik van dat gewijzigde tracé
      als hoogspanningsverbinding toelaat en het tracé aansluit op het tracé van de hoogspanningsverbinding in de
      naastliggende bestemmingsplannen.


      [ref1]: https://wetten.overheid.nl/BWBR0030378#Artikel2.8.6
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.8.7
