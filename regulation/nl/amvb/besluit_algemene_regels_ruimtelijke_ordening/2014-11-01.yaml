  - number: 2.4.7
    text: |-
      Een bestemmingsplan dat betrekking heeft op reservering van een gebied voor de lange termijn bevat geen wijziging
      van de bestemming die ten opzichte van het daaraan voorafgaande bestemmingsplan kan leiden tot grootschalige of
      kapitaalintensieve ontwikkelingen die het treffen van rivierverruimende maatregelen kunnen belemmeren.
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.4.7
  - number: 2.5.1
    text: |-
      In deze titel en de daarop berustende bepalingen wordt verstaan onder:

        - *jachthaven:* haven die naar zijn aard en inrichting bedoeld en geschikt is voor het in hoofdzaak aanleggen of
      aangelegd houden van pleziervaartuigen;
        - *nieuwe bebouwing:* oprichten van bouwwerken, anders dan het vervangen van bouwwerken door bouwwerken van gelijke
      aard, omvang en karakter;
        - *stedelijk gebied:* bij bestemmingsplan toegelaten stedenbouwkundig samenstel van bebouwing ten behoeve van
      wonen, dienstverlening, bedrijvigheid, detailhandel en horeca, alsmede de daarbij behorende openbare of sociaal
      culturele voorzieningen, stedelijk groen en infrastructuur, met uitzondering van lineaire bebouwing langs wegen,
      waterwegen of dijken;
        - *vliegveld:* terrein dat naar zijn aard en inrichting bedoeld en geschikt is voor het doen opstijgen en landen
      van gemotoriseerde burgerluchtvaartuigen, met uitzondering van de daartoe behorende bouwwerken;
        - *waddengebied:* gebied als bedoeld in [artikel 2.5.3, eerste lid][ref1];
        - *Waddenzee:* gebied als bedoeld in [artikel 2.5.3, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030378#Artikel2.5.3
      [ref2]: https://wetten.overheid.nl/BWBR0030378#Artikel2.5.3
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.5.1
