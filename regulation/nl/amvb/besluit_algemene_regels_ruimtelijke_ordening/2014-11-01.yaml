  - number: 2.13.3
    text: |-
      In [bijlage 8][ref1] zijn voor ieder erfgoed van uitzonderlijke universele waarde de kernkwaliteiten in hoofdlijnen
      beschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0030378
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.13.3
