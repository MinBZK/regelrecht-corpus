  - number: '3.1'
    text: |-
      Voor zover een bepaling in dit besluit verplicht tot aanpassing van een geldend bestemmingsplan, stelt de
      gemeenteraad uiterlijk binnen drie jaar na het tijdstip van inwerkingtreding van de desbetreffende bepaling een
      bestemmingsplan vast met inachtneming van dit besluit, tenzij in dit besluit een andere termijn is bepaald.
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel3.1
  - number: '3.2'
    text: |-
      1 Onze Minister in overeenstemming met Onze Minister die het aangaat, kan op aanvraag van burgemeester en
      wethouders of van gedeputeerde staten ontheffing verlenen van de bepalingen van [hoofdstuk 2][ref1], indien
      de verwezenlijking van het gemeentelijk onderscheidenlijk provinciaal ruimtelijk beleid wegens bijzondere
      omstandigheden onevenredig wordt belemmerd in verhouding tot de met die bepalingen te dienen nationale belangen.

      2 Aan de ontheffing kunnen voorschriften worden verbonden indien de betrokken nationale belangen dat met het oog op
      een goede ruimtelijke ordening noodzakelijk maken.


      [ref1]: https://wetten.overheid.nl/BWBR0030378#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0030378
        hoofdstuk: '2'
  - number: '3.3'
    text: |-
      Indien in dit besluit geregelde onderwerpen in het belang van een goede uitvoering van dit besluit nadere regeling
      behoeven, kan deze geschieden bij ministeriële regeling.
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel3.3
  - number: '3.4'
    text: |-
      Indien er sprake is van strijdigheid van het bepaalde bij of krachtens [titel 2.3][ref1], [2.4][ref2] of
      [2.5][ref3] met het bepaalde bij of krachtens [titel 2.6][ref4], geldt het bepaalde bij of krachtens titel 2.6.


