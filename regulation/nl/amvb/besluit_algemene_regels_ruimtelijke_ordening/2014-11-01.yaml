  - number: '3.5'
    text: |-
      1 Provinciale staten stellen een verordening als bedoeld in [artikel 2.3.6][ref1] vast uiterlijk negen maanden na
      het tijdstip van inwerkingtreding van dat artikel.

      2 Provinciale staten stellen een verordening als bedoeld in [titel 2.10][ref2] vast uiterlijk op 30 juni 2013, dan
      wel drie maanden na het tijdstip van inwerkingtreding van titel 2.10, indien deze titel na 30 juni 2013 in werking
      treedt.

      3 Provinciale staten van de provincies waarin de erfgoederen, bedoeld in [artikel 2.13.2][ref3], eerste
      lid, onderdelen a en b, zijn gelegen, stellen een verordening als bedoeld in artikel 2.13.2, tweede lid, en
      [artikel 2.13.4][ref4] vast uiterlijk op 1 januari 2014, dan wel drie maanden na het tijdstip van inwerkingtreding
      van [titel 2.13][ref5], indien deze titel na 1 januari 2014 in werking treedt.

      4 Provinciale staten van de provincies waarin de erfgoederen, bedoeld in
      [artikel 2.13.2, eerste lid, onderdelen c en d][ref6], zijn gelegen, stellen een verordening als bedoeld in
      [artikel 2.13.4][ref7] vast uiterlijk op 1 juli 2013, dan wel drie maanden na het tijdstip van inwerkingtreding van
      [titel 2.13][ref8], indien deze titel na 1 juli 2013 in werking treedt.


