  - number: 2.2.7
    text: |-
      1 Als openbaar toegankelijk natuur- en recreatiegebied Midden-IJsselmonde wordt aangewezen het gebied waarvan de
      geometrische plaatsbepaling is vastgelegd in het GML-bestand bij dit besluit en is verbeeld op [kaart 1][ref1].

      2 Als openbaar toegankelijk natuur- en recreatiegebied Schiebroekse en Zuidpolder wordt aangewezen het gebied
      waarvan de geometrische plaatsbepaling is vastgelegd in het GML-bestand bij dit besluit en is verbeeld op
      [kaart 1][ref2].

      3 Als openbaar toegankelijk natuur- en recreatiegebied Schiezone wordt aangewezen het gebied waarvan de
      geometrische plaatsbepaling is vastgelegd in het GML-bestand bij dit besluit en is verbeeld op [kaart 1][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0030378
