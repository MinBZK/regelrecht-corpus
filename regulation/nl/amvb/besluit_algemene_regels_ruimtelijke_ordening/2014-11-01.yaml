articles:
  - number: '1.1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

        - *bijlage:* bij dit besluit behorende bijlage;
        - *gebouw:* gebouw als bedoeld in [artikel 1, eerste lid, onder c, van de Woningwet][ref1] met inbegrip van
      woonwagens;
        - *geometrische plaatsbepaling:* plaatsbepaling als geregeld bij of krachtens
      [artikel 1.2.5 van het Besluit ruimtelijke ordening][ref2];
        - *GML-bestand bij dit besluit:* elektronisch geografisch databestand dat is opgemaakt in Geography Markup
      Language en is gepubliceerd via www.ruimtelijkeplannen.nl, met kenmerk: a. NL.IMRO.0000.IMam11Barro-3000, of b.
      NL.IMRO.0000.IMam11Barro-3005, of c. NL.IMRO.0000.IMam11Barro-3010, of d. NL.IMRO.0000.IMam11Barro-3015;
        - *kaart:* kaart opgenomen als bijlage bij dit besluit;
        - *wet:* [Wet ruimtelijke ordening][ref3].

      2 In dit besluit en de daarop berustende bepalingen wordt onder bestemmingsplan mede verstaan:

      a. wijzigings- of uitwerkingsplan als bedoeld in [artikel 3.6, eerste lid, onder a of b, van de wet][ref4];

      b. inpassingsplan als bedoeld in [artikel 3.26 van de wet][ref5];

      c. beheersverordening als bedoeld in [artikel 3.38 van de wet][ref6];

      d. projectuitvoeringsbesluit als bedoeld in [artikel 2.10 van de Crisis- en herstelwet][ref7].

      3 In dit besluit en de daarop berustende bepalingen wordt onder toelichting
      bij een bestemmingsplan mede verstaan de ruimtelijke onderbouwing, bedoeld in
      [artikel 2.12, eerste lid, onderdeel a, onder 3°, van de Wet algemene bepalingen omgevingsrecht][ref8].

      4 In dit besluit en de daarop berustende bepalingen wordt onder bestemming mede verstaan regels met het oog op de
      bestemming, tenzij anders is bepaald.

      5 Een omgevingsvergunning waarbij van het bestemmingsplan wordt afgeweken:

      a. met toepassing van
      [artikel 2.12, eerste lid, onderdeel a, onder 2°, van de Wet algemene bepalingen omgevingsrecht][ref9] voor een
      geval als bedoeld in artikel 4, onderdeel 11, van [bijlage II bij het Besluit omgevingsrecht][ref10], of

      b. met toepassing van
      [artikel 2.12, eerste lid, onderdeel a, onder 3°, van de Wet algemene bepalingen omgevingsrecht][ref11],

      voldoet aan dit besluit, tenzij in dit besluit anders is bepaald.


