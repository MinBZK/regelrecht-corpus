        bwb_id: BWBR0030378
  - number: 2.8.5
    text: |-
      1 Een bestemmingsplan dat betrekking heeft op een vestigingsplaats als bedoeld in
      [artikel 2.8.4, eerste lid][ref1], of de daar omheen liggende gronden binnen een straal van 1 kilometer, bevat geen
      wijziging ten opzichte van het ten tijde van inwerkingtreding van deze titel geldende bestemmingsplan die:

      a. nieuwe woningen mogelijk maakt, als gevolg waarvan het aantal bewoners binnen de straal van 1 kilometer meer dan
      5000 personen zal bedragen;

      b. nieuwe kwetsbare objecten mogelijk maakt.

      2 Onder kwetsbaar object als bedoeld in het eerste lid, onderdeel b, wordt verstaan:

      a. gebouwen bestemd voor het verblijf, al dan niet gedurende een gedeelte van de dag, van minderjarigen, ouderen,
      zieken of gehandicapten of gevangenen, zoals:

      1°. ziekenhuizen, bejaardenhuizen en verpleeghuizen;

      2°. gevangenissen;

      3°. scholen, of

      4°. gebouwen of gedeelten daarvan, bestemd voor dagopvang van minderjarigen;

      b. gebouwen waarin doorgaans grote aantallen personen gedurende een groot gedeelte van de dag aanwezig zijn,
      waartoe in ieder geval behoren:

      1°. kantoorgebouwen en hotels met een bruto vloeroppervlak van meer dan 1500 m2 per object, of

      2°. complexen waarin meer dan 5 winkels zijn gevestigd en waarvan het gezamenlijk bruto vloeroppervlak meer dan
      1000 m2 bedraagt en winkels met een totaal bruto vloeroppervlak van meer dan 2000 m2 per winkel, voor zover in die
      complexen of in die winkels een supermarkt, hypermarkt of warenhuis is gevestigd, en

      c. kampeer- en andere recreatieterreinen bestemd voor het verblijf van meer dan 50 personen gedurende meerdere
      aaneengesloten dagen.


      [ref1]: https://wetten.overheid.nl/BWBR0030378#Artikel2.8.4
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.8.5
    references:
      - id: ref1
        bwb_id: BWBR0030378
        artikel: 2.8.4
        hoofdstuk: '2'
  - number: 2.8.6
    text: |-
      1 Als hoogspanningsverbinding worden aangewezen de op de kaarten in [bijlage 5][ref1] aangeduide tracés:

      a. Weiwerd – lijn Eemshaven-Meeden;

      b. Eemshaven – Meeden;

      c. Meeden – Zwolle;

      d. Meeden – Diele (Duitsland);

      e. Eemshaven – Vierverlaten;

      f. Vierverlaten – Zeyerveen – Hoogeveen;

      g. Hoogeveen – Zwolle;

      h. Vierverlaten – Burgum – Ens;

      i. Ens – Zwolle;

      j. Zwolle – Hengelo (O) – Doetinchem – Dodewaard – Maasbracht – Eindhoven – Geertruidenberg – Krimpen a/d IJssel –
      Diemen – Lelystad – Ens – Zwolle;

      k. Hengelo (O) – Gronau (Duitsland);

      l. Beverwijk – Oostzaan – Diemen;

      m. Maasvlakte – Westerlee;

      n. Wateringen – Westerlee;

      o. Wateringen – Zoetermeer;

      p. Bleiswijk – Krimpen a/d IJssel;

      q. Maasvlakte – Crayenstein – Krimpen a/d IJssel;

      r. Borssele – Kreekrak – Geertruidenberg;

      s. Kreekrak – Zandvliet (België);

      t. Maasbracht – Gramme (België);

      u. Maasbracht – Meerhout (België);

      v. Maasbracht – Oberzier (Duitsland);

      w. Maasbracht – Graetheide;

      x. Eemshaven – Noorwegen;

      y. Maasvlakte – Groot-Brittannië.

      2 De tracés, bedoeld in het eerste lid, worden vastgelegd in een GML-bestand bij dit besluit.

      3 Een aansluiting tussen een vestigingsplaats als bedoeld in [artikel 2.8.2, eerste li][ref2]d, en het
      hoogspanningsnet wordt gelijkgesteld met een hoogspanningsverbinding.


      [ref1]: https://wetten.overheid.nl/BWBR0030378
      [ref2]: https://wetten.overheid.nl/BWBR0030378#Artikel2.8.2
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.8.6
