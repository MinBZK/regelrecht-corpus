        artikel: '1'
  - number: 2.7.2
    text: |-
      1 Bij ministeriële regeling worden hoofdwegen of delen daarvan aangewezen waarvoor een bij die regeling vast te
      stellen reserveringsgebied geldt aan een of beide zijden van de hoofdweg ten behoeve van een mogelijke uitbreiding
      daarvan.

      2 De breedte van een reserveringsgebied als bedoeld in het eerste lid, wordt gemeten vanaf de buitenste kantstreep
      en bedraagt ten hoogste:

      a. 34 meter aan weerszijden van de hoofdweg ten behoeve van de mogelijke verbreding per rijrichting met één
      rijstrook;

      b. 38 meter aan weerszijden van de hoofdweg ten behoeve van de mogelijke verbreding per rijrichting met twee
      rijstroken;

      c. 41 meter aan weerszijden van de hoofdweg ten behoeve van de mogelijke verbreding per rijrichting met drie
      rijstroken, of

      d. 45 meter aan weerszijden van de hoofdweg ten behoeve van de mogelijke verbreding per rijrichting met vier
      rijstroken.

      3 Van een reserveringsgebied als bedoeld in het eerste lid, wordt de geometrische plaatsbepaling vastgelegd in een
      GML-bestand bij dit besluit en op kaart verbeeld.
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.7.2
  - number: 2.7.3
    text: |-
      1 Bij ministeriële regeling worden ten behoeve van de mogelijke aanleg van nieuwe hoofdwegen of landelijke
      spoorwegen reserveringsgebieden aangewezen.

      2 Van een reserveringsgebied als bedoeld in het eerste lid, wordt de geometrische plaatsbepaling vastgelegd in een
      GML-bestand bij dit besluit en op kaart verbeeld.
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.7.3
  - number: 2.7.4
    text: |-
      1 Een bestemmingsplan dat betrekking heeft op een reserveringsgebied, aangewezen krachtens
      [artikel 2.7.2, eerste lid][ref1], of [artikel 2.7.3, eerste lid][ref2], bevat geen wijzigingen ten opzichte van
      het op het moment van aanwijzing van dat reserveringsgebied geldende bestemmingsplan, die de volgende activiteiten
      of bestemmingen mogelijk maken:

      a. het bouwen van een bouwwerk waarvoor een omgevingsvergunning als bedoeld in
      [artikel 2.1, eerste lid, onder a, van de Wet algemene bepalingen omgevingsrecht][ref3] is vereist;

      b. stortplaats voor afvalstoffen;

      c. bergingsgebied als bedoeld in [artikel 1.1 van de Waterwet][ref4].

      2 In afwijking van [artikel 1.1, vijfde lid][ref5], kan met een omgevingsvergunning als bedoeld in de onderdelen a
      en b van dat lid, van een bestemmingsplan dat betrekking heeft op een reserveringsgebied worden afgeweken voor een
      termijn van ten hoogste vijf jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0030378#Artikel2.7.2
      [ref2]: https://wetten.overheid.nl/BWBR0030378#Artikel2.7.3
