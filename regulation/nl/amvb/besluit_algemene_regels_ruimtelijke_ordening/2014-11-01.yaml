        bwb_id: BWBR0030378
        artikel: 2.8.2
        hoofdstuk: '2'
  - number: 2.8.4
    text: |-
      1 Als vestigingsplaats voor een kernenergiecentrale worden aangewezen de op de kaarten in [bijlage 5][ref1]
      begrensde gebieden, die zijn gelegen in:

      a. Borssele/Vlissingen (gemeenten Borsele en Vlissingen);

      b. Eemshaven (gemeente Eemsmond);

      c. Maasvlakte I (gemeente Rotterdam).

      2 De gebieden, bedoeld in het eerste lid, worden vastgelegd in een GML-bestand bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0030378
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.8.4
