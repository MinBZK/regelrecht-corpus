  - number: 2.6.1
    text: |-
      In deze titel en de daarop berustende bepalingen wordt verstaan onder:

        - *bouwbeperkingengebied rondom een zend- en ontvangstinstallatie buiten militair luchtvaartterrein:* gebied als
      bedoeld in [artikel 2.6.8, tweede lid][ref1];
        - *geluidzones voor militair luchtvaartterrein:* gebieden als bedoeld in [artikel 2.6.4, tweede lid][ref2];
        - *inrichting voor activiteiten met explosieven:* inrichting als bedoeld in [artikel 2.6.6, eerste lid][ref3];
        - *laagvliegroute voor jachtvliegtuigen en transportvliegtuigen:* gebied als bedoeld in [artikel 2.6.10][ref4];
        - *militair luchtvaartterrein:* gebied als bedoeld in [artikel 2.6.4, eerste lid][ref5];
        - *militair terrein:* gebied als bedoeld in [artikel 2.6.3, eerste lid][ref6];
        - *munitieopslagplaats:* gebied als bedoeld in [artikel 2.6.5, eerste lid][ref7];
        - *obstakelbeheergebied:* gebied als bedoeld in [artikel 2.6.4, vierde lid][ref8];
        - *onveilig gebied:* gebied als bedoeld in [artikel 2.6.3, tweede lid][ref9];
        - *radarstation:* gebied als bedoeld in [artikel 2.6.9, eerste lid][ref10];
        - *radarverstoringsgebied voor een radarstation:* gebied als bedoeld in [artikel 2.6.9, tweede lid][ref11];
        - *zend- en ontvangstinstallatie buiten militair luchtvaartterrein:* gebied als bedoeld in
      [artikel 2.6.8, eerste lid][ref12].


