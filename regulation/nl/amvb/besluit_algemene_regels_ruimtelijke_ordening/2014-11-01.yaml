      1 In deze titel en de daarop berustende bepalingen wordt verstaan onder:

        - *CEMT-klasse:* vaarwegklasse zoals vastgesteld door de Conférence Européenne des Ministres de Transport (CEMT),
      gebaseerd op de afmetingen van standaardschepen en duwstellen;
        - *rijksvaarweg:* voor het openbaar verkeer van schepen openstaand oppervlaktewaterlichaam in beheer bij het Rijk
      als bedoeld in [artikel 3.1 van het Waterbesluit][ref1], uitgezonderd de Noordzee, de Waddenzee, de Westerschelde
      en het IJsselmeer;
        - *vrijwaringszone:* zone aan weerszijden grenzend aan een rijksvaarweg.


      [ref1]: https://wetten.overheid.nl/BWBR0026872#Artikel3.1
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.1.1
    references:
      - id: ref1
        bwb_id: BWBR0026872
        artikel: '3.1'
  - number: 2.1.2
    text: |-
      1 Een vrijwaringszone wordt gemeten vanaf de begrenzingslijn van de rijksvaarweg zoals opgenomen in de legger,
      bedoeld in [artikel 5.1 van de Waterwet][ref1].

      2 De breedte van een vrijwaringszone, gemeten vanaf de begrenzingslijn van de rijksvaarweg, bedraagt:

      a. 10 meter aan weerszijden van een rijksvaarweg van CEMT-klasse II;

      b. 20 meter aan weerszijden van een rijksvaarweg van CEMT-klasse III;

      c. 25 meter aan weerszijden van een rijksvaarweg van CEMT-klasse IV, V of VI;

      d. 40 meter aan weerszijden van een zeehaventoegang;

      e. 50 meter aan weerszijden van een rijksvaarweg binnen een afstand van 300 meter van een vaarwegsplitsing of
      havenuitvaart.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel5.1
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.1.2
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '5.1'
  - number: 2.1.3
    text: |-
      Bij de vaststelling van een bestemmingsplan dat betrekking heeft op gronden binnen de begrenzing van een
      rijksvaarweg of op een vrijwaringszone en dat een wijziging inhoudt ten opzichte van het ten tijde van
      inwerkingtreding van deze titel geldende bestemmingsplan, wordt rekening gehouden met het voorkomen van
      belemmeringen voor:

      a. de doorvaart van de scheepvaart in de breedte, hoogte en diepte;

      b. de zichtlijnen van de bemanning en de op het schip aanwezige navigatieapparatuur voor de scheepvaart;

      c. het contact van de scheepvaart met bedienings- en begeleidingsobjecten;

      d. de toegankelijkheid van de rijksvaarweg voor hulpdiensten, en

      e. het uitvoeren van beheer en onderhoud van de rijksvaarweg.
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.1.3
  - number: 2.2.1
    text: |-
      Als landaanwinningsgebied wordt aangewezen het gebied in de Noordzee aansluitend op het op het tijdstip van
      inwerkingtreding van dit besluit bestaande havengebied, waarvan de geometrische plaatsbepaling is vastgelegd in het
      GML-bestand bij dit besluit en is verbeeld op [kaart 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030378
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0030378
  - number: 2.2.2
    text: |-
      1 Een bestemmingsplan dat betrekking heeft op gronden binnen de begrenzing van het gebied, bedoeld in
      [artikel 2.2.1][ref1], kan de bestemming bedrijventerrein aanwijzen op een zodanige wijze dat in het
      landaanwinningsgebied voor ten hoogste 1000 hectare netto uitgeefbaar haven- en industrieterrein ontstaat.

      2 Indien de gronden binnen de begrenzing van het gebied begrepen zijn in meer dan één bestemmingsplan, bedraagt
      de optelsom van het door deze plannen in het gebied toegewezen aantal hectaren netto uitgeefbaar haven- en
      industrieterrein ten hoogste 1000 hectare.

      3 Voor het netto uitgeefbaar haven- en industrieterrein kunnen geen andere bestemmingen worden toegewezen dan die
      welke deep sea gebonden activiteiten mogelijk maken.

      4 In afwijking van het derde lid kan voor het netto uitgeefbaar haven- en industrieterrein onder bijzondere
      omstandigheden en op basis van een zorgvuldige afweging een andere bestemming worden aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0030378#Artikel2.2.1
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.2.2
    references:
      - id: ref1
        bwb_id: BWBR0030378
        artikel: 2.2.1
        hoofdstuk: '2'
  - number: 2.2.3
    text: |-
      Als gebied voor de compensatie van de effecten van de landaanwinning op open droog duin worden de gronden
      aangewezen waarvan de geometrische plaatsbepaling is vastgelegd in het GML-bestand bij dit besluit en is verbeeld
      op [kaart 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030378
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.2.3
    references:
      - id: ref1
        bwb_id: BWBR0030378
  - number: 2.2.4
    text: |-
      Een bestemmingsplan dat betrekking heeft op gronden binnen de begrenzing van het gebied, bedoeld in
      [artikel 2.2.3][ref1], bevat geen bestemmingen waardoor een belemmering kan ontstaan voor de aanleg of verdere
      ontwikkeling van 100 hectare duincompensatie voor de ontwikkeling van de landaanwinning.


      [ref1]: https://wetten.overheid.nl/BWBR0030378#Artikel2.2.3
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.2.4
