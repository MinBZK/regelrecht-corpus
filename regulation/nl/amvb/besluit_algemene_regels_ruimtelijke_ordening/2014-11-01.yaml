      1 In deze titel en de daarop berustende bepalingen wordt verstaan onder:

        - *rivierbed:* gebied dat begrensd is overeenkomstig [artikel 3.1, tweede lid, van de Waterwet][ref1], en waarvan
      de geometrische plaatsbepaling is vastgelegd in het GML-bestand bij dit besluit en is verbeeld op [kaart 3][ref2];
        - *stroomvoerend deel van het rivierbed:* gebied waarvan de geometrische plaatsbepaling is vastgelegd in het GML-
      bestand bij dit besluit en is verbeeld op [kaart 3][ref3].

      2 Deze titel is van toepassing op gronden binnen de begrenzing van het rivierbed.


