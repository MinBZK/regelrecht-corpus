    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 21 december 2009,
    nr. BJZ2009065777, Directie Bestuurlijke en Juridische Zaken;

    Gelet op de artikelen 3.37, 4.1, vierde lid, 4.3, eerste lid, en 10.8 van de Wet ruimtelijke ordening;

    De Raad van State gehoord (advies van 22 april 2010, W08.090558/IV);

    Gezien het nader rapport van Onze Minister van Infrastructuur en Milieu van 12 augustus 2011, nr. IENM/BSK-
    2011/107439, Hoofddirectie Bestuurlijke en Juridische Zaken;

    Hebben goedgevonden en verstaan:
