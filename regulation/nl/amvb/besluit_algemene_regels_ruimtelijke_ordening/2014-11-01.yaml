        artikel: '1.1'
  - number: 2.3.2
    text: |-
      In een bestemmingsplan dat een wijziging inhoudt ten opzichte van het daaraan voorafgaande bestemmingsplan worden
      geen activiteiten mogelijk gemaakt die een belemmering vormen voor het uitzicht op de vrije horizon vanaf de
      gemiddelde hoogwaterlijn met de blik op zee.
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.3.2
  - number: 2.3.3
    text: |-
      1 Een bestemmingsplan geeft de bestemming «waterkering» aan gronden waarop een primaire waterkering ligt of die de
      functie van primaire waterkering hebben.

      2 Een bestemmingsplan dat betrekking heeft op gronden die deel uitmaken van een beschermingszone duidt die
      gronden aan met de gebiedsaanduiding «vrijwaringszone – duin», indien de primaire waterkering een duin is, de
      gebiedsaanduiding «vrijwaringszone – dijk», indien de primaire waterkering een dijk is en in overige gevallen de
      gebiedsaanduiding «vrijwaringszone – waterstaatswerk».
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.3.3
  - number: 2.3.4
    text: |-
      Met betrekking tot gronden waarop een primaire waterkering ligt of die de functie van primaire waterkering hebben,
      of beschermingszones, kan een bestemmingsplan worden vastgesteld dat een wijziging inhoudt ten opzichte van het
      daaraan voorafgaande bestemmingsplan voor zover bij de verwezenlijking daarvan geen belemmeringen kunnen ontstaan
      voor:

      a. de instandhouding of versterking van het zandige deel van het kustfundament, of

      b. het onderhoud, de veiligheid of mogelijkheden voor versterking van de primaire waterkering.
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.3.4
  - number: 2.3.5
    text: |-
      1 Een bestemmingsplan dat betrekking heeft op gronden buiten het stedelijk gebied maakt ten opzichte van het
      daaraan voorafgaande geldende bestemmingsplan geen nieuwe bebouwing mogelijk.

      2 Het eerste lid is niet van toepassing op:

      a. bouwwerken ten behoeve van tijdelijke of seizoensgebonden activiteiten;

      b. herbouw of verbouw van een bestaand bouwwerk waarbij een eenmalige uitbreiding van het grondoppervlak met ten
      hoogste tien procent is toegestaan, te rekenen vanaf het tijdstip van inwerkingtreding van dit besluit;

      c. bouwwerken voor het openbaar belang voor zover deze bouwwerken niet buiten de gronden, bedoeld in het eerste
      lid, tot stand gebracht kunnen worden. Tot deze bouwwerken behoren in elk geval:

      1°. bouwwerken voor telecommunicatievoorzieningen, opsporing, winning, opslag en transport van olie, gas en water,
      transport van elektriciteit en kleinschalige opwekking van elektriciteit door middel van windturbines;

      2°. bouwwerken voor het operationeel beheer van natuur of van hulpdiensten;

      3°. bouwwerken voor de waterstaatkundige functie van het kustfundament.

      3 Het eerste lid is niet van toepassing voor zover nieuwe bebouwing bijdraagt aan versterking van het zandige deel
      van het kustfundament.
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.3.5
