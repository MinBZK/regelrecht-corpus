      1 Als gebiedsreservering voor de lange termijn voor de Rijntakken worden aangewezen de gebieden waarvan de
      geometrische plaatsbepaling is vastgelegd in het GML-bestand bij dit besluit en is verbeeld op [kaart 3][ref1].

      2 Als gebiedsreservering voor de lange termijn voor de Maas worden aangewezen de gebieden waarvan de geometrische
