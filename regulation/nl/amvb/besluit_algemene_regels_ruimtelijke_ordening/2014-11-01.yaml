        artikel: 2.5.5
        hoofdstuk: '2'
  - number: 2.5.7
    text: |-
      Een bestemmingsplan dat betrekking heeft op de Waddenzee regelt voor de aan die gronden te geven bestemming dat het
      verboden is die gronden in te polderen, te bedijken of in te dijken.
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.5.7
  - number: 2.5.8
    text: |-
      1 Een bestemmingsplan dat betrekking heeft op het waddengebied maakt geen aanleg van een nieuw vliegveld mogelijk.

      2 Een bestemmingsplan dat betrekking heeft op vliegvelden in de gemeenten Texel en Ameland, maakt uitbreiding
      van die vliegvelden slechts mogelijk, voor zover die uitbreiding noodzakelijk is voor het waarborgen van de
      vliegveiligheid.
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.5.8
  - number: 2.5.9
    text: |-
      Een bestemmingsplan dat betrekking heeft op de Waddenzee regelt voor de aan die gronden te geven bestemming dat het
      verboden is booreilanden en andere offshore-installaties te parkeren.
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.5.9
  - number: 2.5.10
    text: |-
      1 Een bestemmingsplan dat betrekking heeft op de Waddenzee of direct aan de Waddenzee grenzende gronden, bevat geen
      bestemmingen die:

      a. aanleg van een nieuwe haven of nieuw bedrijventerrein, of

      b. zeewaartse uitbreiding van een direct aan de Waddenzee grenzende bestaande haven of bestaand bedrijventerrein
      mogelijk maken.

      2 Het eerste lid, onder b, is niet van toepassing op het bestemmingsplan dat de verlegging van de TESO-veerhaven in
      de gemeente Den Helder mogelijk maakt.

      3 Onze Minister of Onze Minister die het aangaat, in overeenstemming met Onze Minister, kan op verzoek van
      burgemeester en wethouders van Harlingen toestemming verlenen om af te wijken van het eerste lid, onderdeel b, voor
      een zeewaartse uitbreiding van de haven van Harlingen indien:

      a. een binnendijkse uitbreiding van die haven redelijkerwijs niet mogelijk is;

      b. een vergunning krachtens de [Natuurbeschermingswet 1998][ref1] voor die uitbreiding kan worden verkregen, en

      c. de uitbreiding afzonderlijk of in combinatie met andere activiteiten geen significante negatieve effecten heeft
      op de landschappelijke of

      d. cultuurhistorische kwaliteiten als bedoeld in [artikel 2.5.2][ref2] op de Waddenzee en het binnendijks gelegen
      gebied.


      [ref1]: https://wetten.overheid.nl/BWBR0009641
      [ref2]: https://wetten.overheid.nl/BWBR0030378#Artikel2.5.2
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.5.10
    references:
      - id: ref1
        bwb_id: BWBR0009641
      - id: ref2
        bwb_id: BWBR0030378
        artikel: 2.5.2
        hoofdstuk: '2'
  - number: 2.5.11
    text: |-
      1 Een bestemmingsplan dat betrekking heeft op de Waddenzee maakt geen nieuwe bebouwing mogelijk.

      2 Het eerste lid is niet van toepassing op:

      a. bouwwerken, voor zover deze noodzakelijk zijn voor de veiligheid van het scheepvaartverkeer in de Waddenzee;

      b. bouwwerken voor alternatieve mosselzaadbronnen;

      c. bouwwerken voor een adequate afwatering van het vasteland;

      d. wadwachtposten, voor zover het een locatie betreft die niet vanaf het vaste land of een Waddeneiland bewaakt
      kan worden.

      3 Het eerste lid is niet van toepassing op het bestemmingsplan, bedoeld in [artikel 2.5.10, tweede lid][ref1], of
      een bestemmingsplan als bedoeld in [artikel 2.5.16, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030378#Artikel2.5.10
      [ref2]: https://wetten.overheid.nl/BWBR0030378#Artikel2.5.16
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.5.11
    references:
      - id: ref1
        bwb_id: BWBR0030378
        artikel: 2.5.10
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0030378
        artikel: 2.5.16
        hoofdstuk: '2'
  - number: 2.5.12
    text: |-
      1 Onverminderd hetgeen elders in dit besluit is bepaald ter zake van bebouwing, stelt een bestemmingsplan dat
      betrekking heeft op het waddengebied, dat het oprichten van nieuwe bebouwing mogelijk maakt:

      a. in het stedelijk gebied: regels die ertoe strekken dat de maximaal toelaatbare bouwhoogten aansluiten bij de
      hoogte van de bestaande bebouwing, en

      b. buiten het stedelijk gebied: regels die ertoe strekken dat de maximaal toelaatbare bouwhoogten alsmede de aard
      of de functie van nieuwe bebouwing passen bij de aard van het omringende landschap.

      2 Een bestemmingsplan voor zover het betrekking heeft op havengerelateerde en stedelijke bebouwing in Den Helder,
      Harlingen, Delfzijl en de Eemshaven kan afwijken van het eerste lid, aanhef, en onder a, met dien verstande dat de
      nieuwe bebouwing blijft binnen de verticale bebouwingscontour.
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.5.12
  - number: 2.5.13
    text: |-
      1 Een bestemmingsplan dat betrekking heeft op de Waddenzee regelt voor de aan die gronden te geven bestemming
      dat nieuwe opsporing of winning van diepe delfstoffen door middel van opsporings- of winningsinstallaties in de
      Waddenzee verboden is.

      2 Een bestemmingsplan dat betrekking heeft op gronden buiten de Waddenzee kan nieuwe opsporing of winning van gas
      onder de Waddenzee mogelijk maken indien:

      a. er wetenschappelijk gezien redelijkerwijs geen twijfel bestaat dat er geen schadelijke gevolgen zijn voor de
      natuur- en landschapswaarden van de Waddenzee, en

      b. de benodigde op te richten bouwwerken, waaronder de tijdelijke plaatsing van boorinstallaties, zorgvuldig
      worden ingepast in het landschap ter bescherming van de unieke openheid daarvan, met behulp van de best beschikbare
      technieken.

      3 Een bestemmingsplan dat betrekking heeft op gronden buiten de Waddenzee kan geen bestemmingen bevatten die
      nieuwe opsporing of winning onder de Waddenzee van andere diepe delfstoffen dan gas toestaan tot het moment waarop
      wetenschappelijk gezien redelijkerwijs geen twijfel bestaat dat er geen schadelijke gevolgen zijn voor de natuur-
      en landschapswaarden van de Waddenzee.
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.5.13
  - number: 2.5.14
    text: Een bestemmingsplan dat betrekking heeft op de Waddenzee maakt geen plaatsing van nieuwe windturbines mogelijk.
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.5.14
  - number: 2.5.15
    text: |-
      Een bestemmingsplan dat betrekking heeft op de Waddenzee regelt voor de aan die gronden te geven bestemming dat het
      verboden is oppervlaktedelfstoffen te winnen met uitzondering van

      a. het winnen van zand ten behoeve van het regulier onderhoud van vaargeulen of ten behoeve van bij of krachtens
      dit besluit toegestane bebouwing in de Waddenzee, en

      b. het winnen van schelpen beneden het peil van NAP –5 meter.
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.5.15
  - number: 2.5.16
    text: |-
      1 Een bestemmingsplan dat betrekking heeft op de Waddenzee of gronden die direct grenzen aan de Waddenzee bevat
      geen bestemmingen die de aanleg van een nieuwe jachthaven toestaan.

      2 Een bestemmingsplan dat betrekking heeft op de Waddenzee bevat geen bestemmingen die zeewaartse uitbreiding van
      bestaande jachthavens toestaan.

      3 Het tweede lid is niet van toepassing op een bestemmingsplan dat betrekking heeft op een bestaande jachthaven
      op een Waddeneiland, voor zover het een beperkte zeewaartse uitbreiding van die haven betreft, die noodzakelijk is
      voor de veiligheid, en voor zover er geen andere passende oplossing mogelijk is.
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.5.16
  - number: 2.5.17
    text: |-
      In afwijking van [artikel 1.1, vijfde lid][ref1], kan voor een geval als bedoeld in artikel 4, onderdeel
      11, van [bijlage II bij het Besluit omgevingsrecht][ref2] met een omgevingsvergunning met toepassing van
      [artikel 2.12, eerste lid, onderdeel a, onder 2°, van de Wet algemene bepalingen omgevingsrecht][ref3] worden
      afgeweken:

      a. van een bestemmingsplan als bedoeld in de [artikelen 2.5.7 tot en met 2.5.16][ref4] ten behoeve van tijdelijke
      bebouwing voor wetenschappelijk onderzoek en monitoring;

      b. van een bestemmingsplan als bedoeld in [artikel 2.5.15][ref5] ten behoeve van een incidentele verdere verdieping
      van een hoofdvaargeul.


      [ref1]: https://wetten.overheid.nl/BWBR0030378#Artikel1.1
