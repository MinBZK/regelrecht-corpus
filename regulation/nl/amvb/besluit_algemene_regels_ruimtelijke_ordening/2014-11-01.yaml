  - number: '1.2'
    text: |-
      Dit besluit is niet van toepassing op:

      a. een omgevingsvergunning als bedoeld in
      [artikel 2.12, eerste lid, onderdeel a, onder 2° of 3°, van de Wet algemene bepalingen omgevingsrecht][ref1]
      die wordt verleend door Onze Minister, Onze Minister wie het aangaat of Onze Minister wie het aangaat in
      overeenstemming met Onze Minister;

      b. een bestemmingsplan, voor zover dat strekt ter uitvoering van een tracébesluit als bedoeld
      in de [Tracéwet][ref2], dan wel ter uitvoering van een wegaanpassingsbesluit als bedoeld in
      [artikel 9, eerste lid, van de Spoedwet wegverbreding][ref3], dan wel een plan als bedoeld in
      [artikel 6, vijfde lid, van die wet][ref4].


