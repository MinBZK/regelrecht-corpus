  - number: 2.14.1
    text: |-
      1 Met betrekking tot gronden gelegen binnen het gebied waarvan de begrenzingen zijn verbeeld op de kaart in bijlage
      9 en waarvan de geometrische plaatsbepaling is vervat in een GML-bestand, wordt geen bestemmingsplan vastgesteld
      dat een wijziging of afwijking inhoudt ten opzichte van het ten tijde van de inwerkingtreding van deze titel
      geldende bestemmingsplan.

      2 Het eerste lid is niet van toepassing op de vaststelling van een bestemmingsplan dat de aanleg van de
      Boerenlandvariant, bedoeld in de mededeling inzake de Overeenkomst voorwaarden aanleg Boerenlandvariant N201
      (Stcrt. 2010, 20211) mogelijk maakt.
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.14.1
  - number: 2.14.2
    text: |-
      In afwijking van [artikel 1.1, vijfde lid][ref1], kan met een omgevingsvergunning waarbij met toepassing van
      [artikel 2.12, tweede lid, van de Wet algemene bepalingen omgevingsrecht][ref2] van het bestemmingsplan wordt
      afgeweken, van een bestemmingsplan dat betrekking heeft op gronden gelegen binnen het gebied, bedoeld in
      [artikel 2.14.1, eerste lid][ref3], worden afgeweken, tot uiterlijk 1 januari 2024.


