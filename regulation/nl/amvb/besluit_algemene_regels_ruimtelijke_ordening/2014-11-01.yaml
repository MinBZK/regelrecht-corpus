        artikel: '1.1'
  - number: 2.11.2
    text: |-
      1 Bij de eerstvolgende herziening van een bestemmingsplan dat betrekking heeft op gronden waarop een primaire
      waterkering ligt of die de functie van primaire waterkering hebben, wordt voor die gronden de bestemming
      «waterkering» opgenomen.

      2 Bij de eerstvolgende herziening van een bestemmingsplan dat betrekking heeft op gronden die deel uitmaken van een
      beschermingszone wordt voor die gronden de gebiedsaanduiding «vrijwaringszone – dijk» opgenomen, indien de primaire
      waterkering een dijk is en wordt voor de overige gevallen de gebiedsaanduiding «vrijwaringszone – waterstaatswerk»
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.11.2
  - number: 2.11.3
    text: |-
      Met betrekking tot gronden waarop een primaire waterkering ligt of die de functie van primaire waterkering hebben,
      of een beschermingszone, kan een bestemmingsplan worden vastgesteld dat een wijziging inhoudt ten opzichte van
      het ten tijde van inwerkingtreding van deze titel geldende bestemmingsplan, voor zover bij de verwezenlijking
      daarvan geen belemmeringen kunnen ontstaan voor het onderhoud, de instandhouding of de versterking van de primaire
      waterkering.
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.11.3
  - number: 2.12.1
    text: |-
      1 In deze titel en de daarop berustende bepalingen wordt verstaan onder:

        - *IJsselmeergebied:* gebied waarvan de geometrische plaatsbepaling is vastgelegd in het GML-bestand bij dit
      besluit en is verbeeld op [kaart 6][ref1];
        - *nieuwe bebouwing:* het oprichten van bouwwerken, anders dan het vervangen van bouwwerken door bouwwerken van
      gelijke omvang.

      2 Deze titel is van toepassing op gronden binnen het IJsselmeergebied.


      [ref1]: https://wetten.overheid.nl/BWBR0030378
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.12.1
    references:
      - id: ref1
        bwb_id: BWBR0030378
  - number: 2.12.2
    text: |-
      1 Een bestemmingsplan bevat geen bestemmingen die ten opzichte van het ten tijde van inwerkingtreding van deze
      titel geldende bestemmingsplan nieuwe bebouwing of landaanwinning mogelijk maken. Indien op het tijdstip van
      inwerkingtreding van deze titel geen bestemmingsplan geldt, maakt een bestemmingsplan geen nieuwe bebouwing of
      landaanwinning mogelijk.

      2 Het eerste lid geldt niet voor nieuwe bebouwing of landaanwinning, die na 22 december 2009 in een bestemmingsplan
      zijn of worden mogelijk gemaakt met een totale oppervlakte per gemeente van ten hoogste:

      a. 350 hectare voor de gemeente Amsterdam, ten behoeve van IJburg tweede fase;

      b. 700 hectare voor de gemeente Almere, waarvan:

      1°. ten hoogste 12 hectare in het Gooimeer ten behoeve van het project Hoogtij en;

      2°. het overige oppervlak in het Markermeer ten behoeve van het project Schaalsprong Almere;

      c. 150 hectare voor de gemeente Lelystad ten behoeve van woondoeleinden, daaraan gerelateerde activiteiten en een
      overslaghaven;

      d. 35 hectare voor de gemeente Harderwijk ten behoeve van het project Waterfront Harderwijk;

      e. 12 hectare voor de gemeente Gaasterlân-Sleat, waarvan:

      1°. 7 hectare ten behoeve van een tijdelijk werkeiland voor de winning van beton- en metselzand, en;

      2°. 5 hectare voor nieuwe bebouwingen en landaanwinningen als bedoeld in onderdeel f;

      f. 5 hectare voor niet in dit lid genoemde gemeenten ten behoeve van:

      1°. natuurontwikkeling;

      2°. andere bestemmingen dan natuurontwikkeling, aansluitend op de bestaande bebouwing.

      3 Het eerste lid is niet van toepassing op overstroombare natuurontwikkeling en projecten van nationaal belang met
      betrekking tot windenergie.

      4 Voor de toepassing van het tweede lid geldt de gemeentelijke indeling op 22 december 2009.
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.12.2
  - number: 2.13.1
    text: |-
      1 In deze titel en de daarop berustende bepalingen wordt verstaan onder:

        - *erfgoed van uitzonderlijke universele waarde:* gebied als bedoeld in [artikel 2.13.2][ref1];
        - *kernkwaliteiten:* essentiële landschappelijke en cultuurhistorische kenmerken van een erfgoed van uitzonderlijke
      universele waarde.

      2 Deze titel is van toepassing op gronden binnen de grenzen van de erfgoederen van uitzonderlijke universele
      waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0030378#Artikel2.13.2
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.13.1
