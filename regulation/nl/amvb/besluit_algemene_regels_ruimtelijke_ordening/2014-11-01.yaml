  - number: 2.6.2
    text: |-
      1 Als militair terrein worden aangewezen de in de ministeriële regeling van Onze Minister in overeenstemming met
      Onze Minister van Defensie, genoemde militaire terreinen waarvan de geometrische plaatsbepaling is vervat in het
      daarachter genoemde GML-bestand bij dit besluit en is verbeeld op de daarachter genoemde kaart.

      2 Als onveilig gebied buiten militair terrein van schietterreinen worden aangewezen de in de ministeriële regeling
      van Onze Minister in overeenstemming met Onze Minister van Defensie, genoemde gebieden waarvan de geometrische
      plaatsbepaling is vervat in het daarachter genoemde GML-bestand bij dit besluit en is verbeeld op de daarachter
      genoemde kaart.

      3 Als militair luchtvaartterrein worden aangewezen de in de ministeriële regeling van Onze Minister in
      overeenstemming met Onze Minister van Defensie, genoemde militaire luchtvaartterreinen waarvan de geometrische
      plaatsbepaling is vervat in het daarachter genoemde GML-bestand bij dit besluit en is verbeeld op de daarachter
      genoemde kaart.

      4 Als geluidzones voor het militaire luchtvaartterrein worden aangewezen de in de ministeriële regeling van
      Onze Minister in overeenstemming met Onze Minister van Defensie, genoemde geluidzones waarvan de geometrische
      plaatsbepaling is vervat in het daarachter genoemde GML-bestand bij dit besluit en is verbeeld op de daarachter
      genoemde kaart.

      5 Als obstakelbeheergebied voor het militaire luchtvaartterrein worden aangewezen de in de ministeriële regeling
      van Onze Minister in overeenstemming met Onze Minister van Defensie, genoemde obstakelbeheergebieden waarvan de
      geometrische plaatsbepaling is vervat in het daarachter genoemde GML-bestand bij dit besluit en is verbeeld op de
      daarachter genoemde kaart.

      6 Als zend- en ontvangstinstallatie buiten militair luchtvaartterrein worden aangewezen de in de
      ministeriële regeling van Onze Minister in overeenstemming met Onze Minister van Defensie, genoemde zend- en
      ontvangstinstallaties waarvan de geometrische plaatsbepaling is vervat in het daarachter genoemde GML-bestand bij
      dit besluit en is verbeeld op de daarachter genoemde kaart.

      7 Als bouwbeperkingengebied rondom een zend- en ontvangstinstallatie buiten militair luchtvaartterrein worden
      aangewezen de in de ministeriële regeling van Onze Minister in overeenstemming met Onze Minister van Defensie,
      genoemde gebieden zend- en ontvangstinstallaties, waarvan de geometrische plaatsbepaling is vervat in het
      daarachter genoemde GML-bestand bij dit besluit en is verbeeld op de daarachter genoemde kaart.

      8 Als radarstations worden aangewezen de in de ministeriële regeling van Onze Minister in overeenstemming met Onze
      Minister van Defensie, genoemde radarstations waarvan de geometrische plaatsbepaling is vervat in het daarachter
      genoemde GML-bestand bij dit besluit en is verbeeld op de daarachter genoemde kaart.

      9 Als radarverstoringsgebieden worden aangewezen de in de ministeriële regeling van Onze Minister in
      overeenstemming met Onze Minister van Defensie, genoemde radarverstoringsgebieden, waarvan de geometrische
      plaatsbepaling is vervat in het daarachter genoemde GML-bestand bij dit besluit en is verbeeld op de daarachter
      genoemde kaart.

      10 De begrenzingen van de laagvliegroutes voor jacht- en transportvliegtuigen zijn opgenomen in de ministeriële
      regeling van Onze Minister in overeenstemming met Onze Minister van Defensie, en vervat in het GML-bestand bij dit
      besluit en verbeeld op de daarachter genoemde kaart.

      11 Als munitieopslagplaats worden aangewezen de in de ministeriële regeling van Onze Minister in overeenstemming
      met Onze Minister van Defensie, genoemde munitieopslagplaatsen waarvan de geometrische plaatsbepaling is vervat in
      het daarachter genoemde GML-bestand bij dit besluit en is verbeeld op de daarachter genoemde kaart.

      12 Als inrichting voor activiteiten met explosieven worden aangewezen de in de ministeriële regeling van Onze
      Minister genoemde inrichtingen waarvan de geometrische plaatsbepaling is vervat in het daarachter genoemde GML-
      bestand bij dit besluit en is verbeeld op de daarachter genoemde kaart.
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.6.2
  - number: 2.6.3
    text: |-
      1 Bij de eerstvolgende herziening van een bestemmingsplan dat betrekking heeft op een militair terrein wordt voor
      die gronden de bestemming «Maatschappelijk – militair terrein» opgenomen en worden geen bestemmingen opgenomen die
      een belemmering kunnen vormen voor de functionele bruikbaarheid van dat terrein.

      2 Bij de eerstvolgende herziening van een bestemmingsplan dat betrekking heeft op een onveilig gebied buiten
      militair terrein, wordt voor die gronden de gebiedsaanduiding «veiligheidszone – onveilig gebied» opgenomen en
      worden geen bestemmingen opgenomen die het gebruik als onveilig gebied belemmeren.
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.6.3
  - number: 2.6.4
    text: |-
      1 Bij de eerstvolgende herziening van een bestemmingsplan dat betrekking heeft op een militair luchtvaartterrein
      wordt voor die gronden de bestemming «Maatschappelijk – militaire luchthaven» opgenomen en worden geen bestemmingen
      opgenomen die een belemmering kunnen vormen voor de functionele bruikbaarheid van dat terrein.

      2 Bij de eerstvolgende herziening van een bestemmingsplan ter zake van gronden gelegen in het beperkingengebied
      van een militair luchtvaartterrein worden de voor het betrokken militaire luchtvaartterrein op grond van de
      [Luchtvaartwet][ref1] en de [Wet geluidhinder][ref2] vastgestelde geluidzones en de beperkingen, bedoeld in het
      vierde en vijfde lid, in acht genomen.

      3 Bij de eerstvolgende herziening van een bestemmingsplan ter zake van gronden gelegen in het beperkingengebied
      van de buitenlandse militaire luchtvaartterreinen Geilenkirchen en Brüggen worden de voor het betrokken militaire
      luchtvaartterrein vastgestelde geluidzone en de beperkingen, bedoeld in het vierde en het vijfde lid, in acht
      genomen.

      4 De maximaal toelaatbare hoogte van objecten in, op of boven de grond in een obstakelbeheergebied is in
      overeenstemming met [artikel 16 van het Besluit militaire luchthavens][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002267
      [ref2]: https://wetten.overheid.nl/BWBR0003227
      [ref3]: https://wetten.overheid.nl/BWBR0025302#Artikel16
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.6.4
    references:
      - id: ref1
        bwb_id: BWBR0002267
      - id: ref2
        bwb_id: BWBR0003227
      - id: ref3
        bwb_id: BWBR0025302
        artikel: '16'
  - number: 2.6.5
    text: |-
      1 Bij de eerstvolgende herziening van een bestemmingsplan dat betrekking heeft op een munitieopslagplaats
      wordt voor die gronden de bestemming «Maatschappelijk – militair munitiedepot» opgenomen, voor zover die
      munitieopslagplaats niet ligt op gronden als bedoeld in de [artikelen 2.6.3][ref1] en [2.6.4][ref2], en
      worden geen bestemmingen opgenomen die een belemmering kunnen vormen voor de functionele bruikbaarheid van de
      munitieopslagplaats.

      2 Bij regeling van Onze Minister in overeenstemming met Onze Minister van Defensie, worden voor elke
      munitieopslagplaats drie veiligheidszones aangewezen, aan te duiden als A-zone, B-zone en C-zone, waarbij de A-zone
      de kleinste afstand tot de munitieopslagplaats heeft en de C-zone de grootste afstand.

      3 In afwijking van het tweede lid kan afhankelijk van de aard van de opgeslagen munitie, sprake zijn van minder dan
      drie veiligheidszones.


      [ref1]: https://wetten.overheid.nl/BWBR0030378#Artikel2.6.3
      [ref2]: https://wetten.overheid.nl/BWBR0030378#Artikel2.6.4
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.6.5
