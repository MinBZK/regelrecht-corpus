  - number: 2.8.1
    text: |-
      In deze afdeling en de daarop berustende bepalingen wordt verstaan onder:

        - *grootschalige elektriciteitsopwekking:* elektriciteitsproductie met een of meer elektriciteitsproductie-
      installaties met een gezamenlijk vermogen van ten minste 500 MW en de daarmee verbonden werken en infrastructuur,
      uitgezonderd elektriciteitsproductie-installaties die elektriciteit opwekken door splijting of versmelting van
      atoomkernen en uitgezonderd elektriciteitsproductie-installaties die elektriciteit opwekken door middel van
      windenergie;
        - *hoogspanningsnet:* net met een spanning van ten minste 220 kV en de daarin aanwezige schakel- en
      transformatorstations en andere hulpmiddelen;
        - *hoogspanningsverbinding:* verbinding met een spanning van ten minste 220 kV en de daarmee verbonden schakel- en
      transformatorstations en andere hulpmiddelen;
        - *kernenergiecentrale:* elektriciteitsproductie-eenheid waar elektriciteit wordt opgewekt met behulp van splijting
      of versmelting van atoomkernen.
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.8.1
  - number: 2.8.2
    text: |-
      1 Als vestigingsplaats voor grootschalige elektriciteitsopwekking worden aangewezen de op de kaarten in
      [bijlage 5][ref1] begrensde gebieden, die zijn gelegen in:

      a. Eemshaven (gemeente Eemsmond);

      b. Burgum (gemeente Tytsjerksteradiel);

      c. Harculo (gemeente Zwolle);

      d. Nijmegen (gemeente Nijmegen);

      e. Utrecht (gemeente Utrecht);

      f. Flevo (gemeente Lelystad);

      g. Velsen (gemeente Velsen);

      h. Hemweg (gemeente Amsterdam);

      i. Diemen (gemeente Diemen);

      j. Maasvlakte I (gemeente Rotterdam);

      k. Galileïstraat (gemeente Rotterdam);

      l. Borssele/Vlissingen (gemeenten Borsele en Vlissingen);

      m. Amer Geertruidenberg (gemeente Geertruidenberg);

      n. Buggenum (gemeente Leudal);

      o. Maasbracht (gemeente Maasgouw);

      p. Moerdijk (gemeente Moerdijk);

      q. Geleen (gemeente Sittard-Geleen);

      r. Delfzijl (gemeente Delfzijl);

      s. Amsterdams Havengebied/Noordzeekanaal (gemeente Amsterdam);

      t. Maasvlakte II (gemeente Rotterdam);

      u. Rijnmond/Rotterdams Havengebied (gemeente Rotterdam);

      v. Terneuzen/Sas van Gent (gemeente Terneuzen).

      2 De gebieden, bedoeld in het eerste lid, worden vastgelegd in een GML-bestand bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0030378
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.8.2
    references:
      - id: ref1
        bwb_id: BWBR0030378
  - number: 2.8.3
    text: |-
      Een bestemmingsplan dat betrekking heeft op een vestigingsplaats als bedoeld in [artikel 2.8.2, eerste lid][ref1]:

      a. laat grootschalige elektriciteitsopwekking toe;

      b. voorziet in de fysieke ruimte daartoe, en

      c. bevat geen hoogtebeperkingen voor installaties voor grootschalige elektriciteitsopwekking.


      [ref1]: https://wetten.overheid.nl/BWBR0030378#Artikel2.8.2
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.8.3
