  - number: 2.11.1
    text: |-
      1 In deze titel en de daarop berustende bepalingen wordt verstaan onder:

        - *beschermingszone:* beschermingszone als bedoeld in [artikel 1.1 van de Waterwet][ref1], voor zover grenzend aan
      een primaire waterkering;
        - *kustfundament:* gebied waarvan de geometrische plaatsbepaling is vastgelegd in het GML-bestand bij dit besluit
      en is verbeeld op [kaart 2][ref2];
        - *primaire waterkering:* primaire waterkering als bedoeld in [artikel 1.1 van de Waterwet][ref3].

      2 Deze titel is van toepassing op gronden buiten het kustfundament.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel1.1
      [ref2]: https://wetten.overheid.nl/BWBR0030378
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Artikel1.1
