  - number: 2.13.2
    text: |-
      1 Als erfgoed van uitzonderlijke universele waarde worden aangewezen:

      a. Nieuwe Hollandse Waterlinie, waarvan de plaats indicatief geometrisch is vastgelegd in het GML-bestand bij dit
      besluit en is verbeeld op [kaart 7][ref1];

      b. Romeinse Limes, waarvan de plaats indicatief geometrisch is vastgelegd in het GML-bestand bij dit besluit en is
      verbeeld op [kaart 7][ref2];

      c. Werelderfgoed De Beemster, waarvan de geometrische plaatsbepaling is vastgelegd in het GML-bestand bij dit
      besluit en is verbeeld op [kaart 7][ref3];

      d. Werelderfgoed De Stelling van Amsterdam, waarvan de geometrische plaatsbepaling is vastgelegd in het GML-bestand
      bij dit besluit en is verbeeld op [kaart 7][ref4].

      2 Bij verordening werken de desbetreffende provinciale staten de begrenzing van de erfgoederen, bedoeld in het
      eerste lid, onderdelen a en b, geometrisch nader uit.

      3 Indien de nadere plaatsbepaling en begrenzing, bedoeld in het tweede lid, niet binnen de termijn, bedoeld in
      [artikel 3.5, derde lid][ref5] zijn vastgesteld, stellen Onze Minister en Onze Minister van Onderwijs, Cultuur en
      Wetenschap de nadere plaatsbepaling en begrenzing bij ministeriële regeling vast.


