  - number: 2.9.1
    text: |-
      In deze titel en de daarop berustende bepalingen wordt verstaan onder:

        - *buisleiding van nationaal belang:* leiding die deel uitmaakt van een landelijk hoofdnetwerk van leidingen,
      niet zijnde een leiding voor het vervoer van stoffen in verband met het opsporen of winnen van delfstoffen, en
      die is bestemd of wordt gebruikt voor het vervoer van: a. aardgas, voor zover die leiding een druk heeft van
      ten minste 40 bar en een diameter heeft van ten minste 45,7 centimeter, of b. gevaarlijke stoffen als bedoeld in
      [artikel 1, eerste lid, van het Besluit externe veiligheid buisleidingen][ref1], anders dan aardgas;
        - *buisleidingenstrook:* strook die dient voor de aanleg van buisleidingen van nationaal belang;
        - *landelijk hoofdnetwerk van leidingen:* provinciegrensoverschrijdend netwerk van leidingen dat is bestemd of
      wordt gebruikt voor vervoer over lange afstand;
        - *voorkeurstracé:* tracé als bedoeld in [artikel 2.9.2, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028265#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0030378#Artikel2.9.2
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.9.1
    references:
      - id: ref1
        bwb_id: BWBR0028265
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0030378
        artikel: 2.9.2
        hoofdstuk: '2'
  - number: 2.9.2
    text: |-
      1 Bij regeling van Onze Minister, in overeenstemming met Onze Minister van Economische Zaken, worden tracés voor
      een buisleidingenstrook aangewezen met aan weerszijden van een tracé een zoekgebied van 250 meter, gemeten vanaf de
      buitenste begrenzing van dat tracé.

      2 De breedte van het voorkeurstracé bedraagt ten hoogste 70 meter, met uitzondering van een voorkeurstracé dat een
      hoofdwater als bedoeld in [artikel 1.1 van het Waterbesluit][ref1] kruist.


      [ref1]: https://wetten.overheid.nl/BWBR0026872#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.9.2
    references:
      - id: ref1
        bwb_id: BWBR0026872
        artikel: '1.1'
  - number: 2.9.3
    text: |-
      De gemeenteraad kan het voorkeurstracé in een bestemmingsplan nader uitwerken, op een wijze dat het tracé voor
      de buisleidingenstrook:

      a. gelegen blijft binnen het zoekgebied, bedoeld in [artikel 2.9.2, eerste lid][ref1];

      b. aansluit op het voorkeurstracé onderscheidenlijk het tracé voor een buisleidingenstrook in de naastliggende
      gemeenten;

      c. een breedte heeft die gelijk is aan de breedte die het voorkeurstracé over het grootste deel van dat tracé
      heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0030378#Artikel2.9.2
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.9.3
    references:
      - id: ref1
        bwb_id: BWBR0030378
        artikel: 2.9.2
        hoofdstuk: '2'
  - number: 2.9.4
    text: |-
      1 Een bestemmingsplan dat betrekking heeft op gronden die zijn gelegen binnen het voorkeurstracé laat, ten opzichte
      van het op het moment van aanwijzing van dat voorkeurstracé geldende bestemmingsplan, geen nieuwe activiteiten toe
      die een belemmering kunnen vormen voor de aanleg van een buisleiding van nationaal belang.

      2 Onder een belemmering als bedoeld in het eerste lid valt in ieder geval:

      a. het bouwen van een bouwwerk, met uitzondering van een bouwwerk dat noodzakelijk is voor de aanleg, het onderhoud
      of de instandhouding van een buisleiding van nationaal belang;

      b. de aanleg van een verharde weg of verhard pad of een spoorweg in de lengterichting van het voorkeurstracé;

      c. de aanleg van een watergang in de lengterichting van het voorkeurstracé;

      d. de aanleg van een waterkering, inclusief de daartoe behorende beschermingszone als bedoeld in
      [artikel 1.1 van de Waterwet][ref1] in de lengterichting van het voorkeurstracé;

      e. de aanleg van een buisleiding, niet zijnde een buisleiding van nationaal belang, of een ondergrondse
      hoogspanningsverbinding of ondergronds leidingstelsel in de lengterichting van het voorkeurstracé;

      f. het bebossen;

      g. het gebruik als stortplaats voor afvalstoffen of permanente opslag van grond, of andere stoffen of goederen.

      3 Indien toepassing wordt gegeven aan [artikel 2.9.3][ref2] dan is het eerste lid van overeenkomstige toepassing op
      de gronden die deel uitmaken van het tracé voor een buisleidingenstrook, bedoeld in artikel 2.9.3.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel1.1
      [ref2]: https://wetten.overheid.nl/BWBR0030378#Artikel2.9.3
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.9.4
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '1.1'
      - id: ref2
        bwb_id: BWBR0030378
        artikel: 2.9.3
        hoofdstuk: '2'
  - number: 2.9.5
    text: |-
      1 Een bestemmingsplan laat de aanleg van een buisleiding van nationaal belang slechts toe binnen de
      gronden die deel uitmaken van het voorkeurstracé onderscheidenlijk het tracé voor een buisleidingenstrook,
      bedoeld in [artikel 2.9.3][ref1], op zodanige wijze dat de belemmeringenstrook, bedoeld in
      [artikel 14, eerste lid, van het Besluit externe veiligheid buisleidingen][ref2], binnen de buisleidingenstrook
      is gelegen.

      2 Het eerste lid is niet van toepassing voor zover het beginpunt dan wel eindpunt van een buisleiding van
      nationaal belang buiten het voorkeurstracé onderscheidenlijk het tracé voor een buisleidingenstrook, bedoeld
      in [artikel 2.9.3][ref3], is gelegen en de buisleiding van nationaal belang een zoveel mogelijk rechtstreekse
      verbinding legt tussen de buisleidingenstrook en dat beginpunt dan wel eindpunt.

      3 Het eerste lid is eveneens niet van toepassing indien de aanleg van een buisleiding van nationaal belang reeds
      wordt toegelaten op grond van een ten tijde van de aanwijzing van het voorkeurstracé geldend bestemmingsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0030378#Artikel2.9.3
      [ref2]: https://wetten.overheid.nl/BWBR0028265#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0030378#Artikel2.9.3
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.9.5
