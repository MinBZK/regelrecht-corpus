  - number: 2.6.10
    text: |-
      Bij de eerstvolgende herziening van een bestemmingsplan dat betrekking heeft op een laagvliegroute voor jacht- en
      transportvliegtuigen worden geen bestemmingen opgenomen die het oprichten van bouwwerken met een hoogte van meer
      dan 40 meter te meten vanaf het maaiveld mogelijk maken.
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.6.10
  - number: 2.7.1
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:

        - *buitenste kantstreep:* markering van de begrenzing van de buitenzijde van de buitenste rijstrook;
        - *hoofdweg:* weg als bedoeld in [artikel 1, eerste lid, van de Tracéwet][ref1];
        - *landelijke spoorweg:* spoorweg als bedoeld in [artikel 1, eerste lid, van de Tracéwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006147#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006147#Artikel1
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.7.1
