        bwb_id: BWBR0030378
  - number: 2.13.4
    text: |-
      1 Bij provinciale verordening worden de kernkwaliteiten uitgewerkt en geobjectiveerd.

      2 Bij provinciale verordening worden in het belang van de instandhouding en versterking
      van de kernkwaliteiten regels gesteld omtrent de inhoud van of de toelichting bij
      bestemmingsplannen en de inhoud van omgevingsvergunningen waarbij met toepassing van
      [artikel 2.12, eerste lid, onderdeel a, onder 3°, van de Wet algemene bepalingen omgevingsrecht][ref1] van het
      bestemmingsplan wordt afgeweken. Bij de verordening kunnen in het hiervoor genoemde belang tevens regels worden
      gesteld omtrent de inhoud van omgevingsvergunningen waarbij met toepassing van artikel 2.12, eerste lid, onderdeel
      a, onder 2°, van de Wet algemene bepalingen omgevingsrecht van het bestemmingsplan wordt afgeweken.

      3 Bij de verordening worden in ieder geval regels gesteld die bewerkstelligen
      dat een bestemmingsplan of omgevingsvergunning waarbij met toepassing van
      [artikel 2.12, eerste lid, onderdeel a, onder 3°, van de Wet algemene bepalingen omgevingsrecht][ref2]
      van het bestemmingsplan wordt afgeweken geen activiteiten mogelijk maakt ten opzichte van het ten tijde van
      inwerkingtreding van de verordening geldende bestemmingsplan die de kernkwaliteiten, bedoeld in het eerste lid,
      aantasten.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.12
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2.12
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.13.4
