        hoofdstuk: '2'
  - number: 2.5.2
    text: |-
      1 Als landschappelijke kwaliteiten van de Waddenzee worden aangemerkt de rust, weidsheid, open horizon en
      natuurlijkheid met inbegrip van de duisternis.

      2 Als cultuurhistorische kwaliteiten van de Waddenzee worden aangemerkt:

      a. de in de bodem aanwezige archeologische waarden, en

      b. de overige voor het gebied kenmerkende cultuurhistorische structuren en elementen, bestaande uit:

      1°. historische scheepswrakken;

      2°. verdronken en onderslibde nederzettingen en ontginningssporen, waaronder de dam Ameland-Holwerd;

      3°. zeedijken en de daaraan verbonden historische sluizen, waaronder het ensemble Afsluitdijk;

      4°. landaanwinningswerken;

      5°. systeem van stuifdijken;

      6°. systeem van historische vaar- en uitwateringsgeulen, en

      7°. kapen.
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.5.2
  - number: 2.5.3
    text: |-
      1 Als waddengebied wordt aangewezen het gebied waarvan de geometrische plaatsbepaling is vastgelegd in het GML-
      bestand bij dit besluit en is verbeeld op [kaart 4][ref1].

      2 Als Waddenzee wordt aangewezen het gebied binnen het waddengebied, waarvan de geometrische plaatsbepaling is
      vastgelegd in het GML-bestand bij dit besluit en is verbeeld op [kaart 4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030378
      [ref2]: https://wetten.overheid.nl/BWBR0030378
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.5.3
    references:
      - id: ref1
        bwb_id: BWBR0030378
      - id: ref2
        bwb_id: BWBR0030378
  - number: 2.5.4
    text: |-
      1 Bij de voorbereiding van een bestemmingsplan dat betrekking heeft op de Waddenzee en dat gebruik of bebouwing
      mogelijk maakt, die afzonderlijk of in combinatie met ander gebruik of andere bebouwing significante gevolgen kan
      hebben voor de landschappelijke of cultuurhistorische kwaliteiten, bedoeld in [artikel 2.5.2][ref1], wordt een
      beoordeling gemaakt van de gevolgen voor die kwaliteiten van het gebied.

      2 De beoordeling kan onderdeel uitmaken van een voor dat bestemmingsplan voorgeschreven milieueffectrapportage of
      van een passende beoordeling als bedoeld in de [Natuurbeschermingswet 1998][ref2].

      3 Het eerste lid is niet van toepassing indien voor het gebruik of de bebouwing waarop dat voorgenomen
      bestemmingsplan betrekking heeft, reeds eerder een beoordeling is gemaakt en voor zover een nieuwe beoordeling
      redelijkerwijs geen nieuwe gegevens en inzichten kan opleveren omtrent de desbetreffende significante gevolgen.


      [ref1]: https://wetten.overheid.nl/BWBR0030378#Artikel2.5.2
      [ref2]: https://wetten.overheid.nl/BWBR0009641
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.5.4
    references:
      - id: ref1
        bwb_id: BWBR0030378
        artikel: 2.5.2
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0009641
  - number: 2.5.5
    text: |-
      1 Een bestemmingsplan dat betrekking heeft op de Waddenzee maakt ten opzichte van het daaraan voorafgaande
      bestemmingsplan geen nieuw gebruik of nieuwe bebouwing dan wel wijziging van bestaand gebruik of bestaande
      bebouwing mogelijk die significante negatieve gevolgen kan hebben voor de landschappelijke of cultuurhistorische
      kwaliteiten, bedoeld in [artikel 2.5.2][ref1].

      2 Als gebruik of bebouwing met significante negatieve gevolgen wordt in ieder geval aangemerkt gebruik dat of
      bebouwing die de landschappelijke of cultuurhistorische kwaliteiten aantast of bedreigt.

      3 Het eerste lid is niet van toepassing indien verzekerd is dat:

      a. sprake is van zwaarwegende redenen van groot openbaar belang, waaronder worden begrepen redenen van sociale
      of economische aard, argumenten die verband houden met de menselijke gezondheid, de openbare veiligheid of
      bereikbaarheid of sprake is van voor het milieu wezenlijk gunstige effecten;

      b. geen reële alternatieven voor handen zijn voor de noodzakelijk geachte activiteiten, en

      c. de optredende schade of andere negatieve effecten zoveel mogelijk worden beperkt.


      [ref1]: https://wetten.overheid.nl/BWBR0030378#Artikel2.5.2
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.5.5
    references:
      - id: ref1
        bwb_id: BWBR0030378
        artikel: 2.5.2
        hoofdstuk: '2'
  - number: 2.5.6
    text: |-
      Op een bestemmingsplan dat betrekking heeft op het waddengebied, dat nieuw gebruik of nieuwe bebouwing dan wel een
      wijziging van bestaand gebruik of bestaande bebouwing mogelijk maakt en daardoor afzonderlijk of in combinatie met
      ander gebruik of andere bebouwing significante gevolgen kan hebben voor de landschappelijke of cultuurhistorische
      kwaliteiten, bedoeld in [artikel 2.5.2][ref1], zijn de artikelen [2.5.4][ref2] en [2.5.5][ref3] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030378#Artikel2.5.2
      [ref2]: https://wetten.overheid.nl/BWBR0030378#Artikel2.5.4
      [ref3]: https://wetten.overheid.nl/BWBR0030378#Artikel2.5.5
    url: https://wetten.overheid.nl/BWBR0030378/2014-11-01#Artikel2.5.6
    references:
