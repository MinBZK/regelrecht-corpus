  - number: '2'
    text: |-
      De bevoegde instantie, bedoeld in de artikelen 3, zesde lid, en 6, eerste lid, van de f-gassenverordening is Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0022857/2010-01-01#Artikel2
  - number: 2a
    text: |-
      De EG-verordening standaardlekcontroles stationaire koelinstallaties en artikel 3, eerste tot en met zesde lid, van
      de f-gassenverordening zijn van overeenkomstige toepassing op mobiele koelsystemen.
    url: https://wetten.overheid.nl/BWBR0022857/2010-01-01#Artikel2a
  - number: '3.1'
    text: 'Het is verboden:'
    url: https://wetten.overheid.nl/BWBR0022857/2010-01-01#Artikel3
  - number: 3.1.a
    text: |-
      te handelen in strijd met de voorschriften, gesteld bij de artikelen 3, eerste, tweede, derde en zesde lid, 4, 5,
      derde lid, en 6, eerste lid, van de f-gassenverordening, en
    url: https://wetten.overheid.nl/BWBR0022857/2010-01-01#Artikel3
  - number: 3.1.b
    text: |-
      te handelen in strijd met de verboden, gesteld bij de artikelen 7, eerste lid, in verbinding met het tweede lid, 8
      en 9, eerste lid, in verbinding met het tweede lid, van de f-gassenverordening.
    url: https://wetten.overheid.nl/BWBR0022857/2010-01-01#Artikel3
  - number: '3.2'
    text: 'Het is verboden:'
    url: https://wetten.overheid.nl/BWBR0022857/2010-01-01#Artikel3
  - number: 3.2.a
    text: |-
      te handelen in strijd met de artikelen 2, eerste tot en met derde lid, 3 en 4 van verordening (EG) nr. 1494/2007
      van de Europese Commissie van 17 december 2007 tot vaststelling, ingevolge Verordening (EG) nr. 842/2006 van het
      Europees Parlement en de Raad, van de vorm van etiketten en aanvullende etiketteringseisen betreffende producten en
      apparatuur die bepaalde gefluoreerde broeikasgassen bevatten (PbEU L 332);
    url: https://wetten.overheid.nl/BWBR0022857/2010-01-01#Artikel3
  - number: 3.2.b
    text: |-
      te handelen in strijd met de artikelen 2 tot en met 7 van de EG-verordening standaardlekcontroles
      brandbeveiligingssystemen;
    url: https://wetten.overheid.nl/BWBR0022857/2010-01-01#Artikel3
  - number: 3.2.c
    text: |-
      te handelen in strijd met de artikelen 2 tot en met 10 van de EG-verordening standaardlekcontroles stationaire
      koelinstallaties;
    url: https://wetten.overheid.nl/BWBR0022857/2010-01-01#Artikel3
  - number: 3.2.d
    text: |-
      te handelen in strijd met artikel 2, eerste lid, van verordening (EG) nr. 306/2008 van de Europese Commissie van
      2 april 2008 tot vaststelling, ingevolge Verordening (EG) nr. 842/2006 van het Europees Parlement en de Raad, van
      minimumeisen en de voorwaarden voor wederzijdse erkenning van de certificering van personeel voor de terugwinning
      van bepaalde oplosmiddelen op basis van gefluoreerde broeikasgassen uit apparatuur (PbEU L 92).
    url: https://wetten.overheid.nl/BWBR0022857/2010-01-01#Artikel3
  - number: '4.1'
    text: |-
      Bij ministeriële regeling worden regels gesteld inzake de examinering en diplomering van personen die werkzaamheden
      aan koelsystemen, stationaire brandbeveiligingssystemen, brandblusapparaten, of hoogspanningsschakelaars
      verrichten.
    url: https://wetten.overheid.nl/BWBR0022857/2010-01-01#Artikel4
  - number: '4.2'
    text: |-
      Bij ministeriële regeling worden regels gesteld inzake de certificering van bedrijven die werkzaamheden aan
      koelsystemen of brandbeveiligingssystemen en brandblusapparaten verrichten.
    url: https://wetten.overheid.nl/BWBR0022857/2010-01-01#Artikel4
  - number: '4.3'
    text: |-
      Bij ministeriële regeling worden regels gesteld inzake de aanwijzing van instellingen die met de examinering en
      diplomering van personen, bedoeld in het eerste lid, of met de certificering van bedrijven, bedoeld in het tweede
      lid, zijn belast.
    url: https://wetten.overheid.nl/BWBR0022857/2010-01-01#Artikel4
  - number: '4.4'
    text: Het is verboden in strijd te handelen met de krachtens het eerste tot en met derde lid te stellen regels.
    url: https://wetten.overheid.nl/BWBR0022857/2010-01-01#Artikel4
  - number: '4.5'
    text: |-
      Bedrijven die de in de artikelen 3 en 4 van de f-gassenverordening genoemde activiteiten verrichten, voldoen aan
      artikel 5, vierde lid, van die verordening.
    url: https://wetten.overheid.nl/BWBR0022857/2010-01-01#Artikel4
