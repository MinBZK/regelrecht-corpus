preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 6 juli 2007, nr.
    DJZ 2007065566, Directie Juridische Zaken, Afdeling Wetgeving, gedaan mede namens de Staatssecretaris van Sociale
    Zaken en Werkgelegenheid en Onze Minister van Volksgezondheid, Welzijn en Sport;

    Gelet op verordening (EG) nr. 842/2006 van het Europees Parlement en de Raad van de Europese Unie van 17 mei
    2006 inzake bepaalde gefluoreerde broeikasgassen (PbEU L 161) en de artikelen 24 en 39, derde lid, van de Wet
    milieugevaarlijke stoffen;

    De Raad van State gehoord (advies van 17 augustus 2007, nr. W08.07.0198/IV);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 26
    oktober 2007, nr. DJZ2007103216, Directie Juridische Zaken, Afdeling Wetgeving, uitgebracht mede namens de
    Staatssecretaris van Sociale Zaken en Werkgelegenheid en Onze Minister van Volksgezondheid, Welzijn en Sport;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0022857/2010-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - *brandblusapparaat:* voor het bestrijden
      van brand bestemd draagbaar of verrijdbaar apparaat, welke door middel van eenvoudige handgreep in werking kan
      worden gesteld en gehouden, en waarvan de constructie zodanig is dat de bestrijding van brand geschiedt door middel
      van een zich in de apparatuur bevindend blusmiddel;
        - *EG-verordening standaardlekcontroles brandbeveiligingssystemen:* verordening (EG) nr. 1497/2007 van de Europese
      Commissie van 18 december 2007 tot vaststelling, ingevolge Verordening (EG) Nr. 842/2006 van het Europees Parlement
      en de Raad, van basisvoorschriften inzake controle op lekkage van stationaire brandbeveiligingssystemen die
      bepaalde gefluoreerde broeikasgassen bevatten (PbEU L 333);
        - *EG-verordening standaardlekcontroles stationaire koelinstallaties:* verordening (EG) nr. 1516/2007 van de
      Europese Commissie van 19 december 2007 tot vaststelling, ingevolge Verordening (EG) nr. 842/2006 van het Europees
      Parlement en de Raad, van basisvoorschriften inzake controle op lekkage van stationaire koel-, klimaatregelings- en
      warmtepompapparatuur die bepaalde gefluoreerde broeikasgassen bevat (PbEU L 335);
        - *f-gassenverordening:* verordening (EG) nr. 842/2006 van het Europees Parlement en de Raad van de Europese unie
      van 17 mei 2006 inzake bepaalde gefluoreerde broeikasgassen (PbEU L 161);
        - *gefluoreerde broeikasgassen:* gefluoreerde broeikasgassen als bedoeld in artikel 2, onder 1, van de f-
      gassenverordening;
        - *hoogspanningsschakelaars:* hoogspanningsschakelaars als bedoeld in artikel 2 van verordening (EG) nr. 305/2008
      van de Europese Commissie van 2 april 2008 tot vaststelling, ingevolge Verordening (EG) nr. 842/2006 van het
      Europees Parlement en de Raad, van minimumeisen en de voorwaarden voor wederzijdse erkenning van de certificering
      van personeel voor de terugwinning van bepaalde gefluoreerde broeikasgassen uit hoogspanningsschakelaars (PbEU
      L 92);
        - *koelsysteem:* drukapparatuur of drukapparaat als bedoeld in
      [artikel 1, onderdeel e, van het Warenwetbesluit drukapparatuur][ref1], waarin zich gefluoreerde broeikasgassen
      bevindt of daartoe bestemd is;
        - *mobiel koelsysteem:* koelsysteem dat – niet hermetisch gesloten is en drie kilogram of meer gefluoreerde
      broeikasgassen bevat, of – hermetisch gesloten is en zes kilogram of meer gefluoreerde broeikasgassen bevat,
      en zich bevindt in of op een spoorvoertuig als bedoeld in [artikel 1, onder e, van de Spoorwegwet][ref2] of een
      voertuig als bedoeld in [artikel 1, eerste lid, onder c of d, van de Wegenverkeerswet 1994][ref3];
        - *stationair brandbeveiligingssysteem:* brandbeveiligingssysteem als bedoeld in artikel 1 van de EG-verordening
      standaardlekcontroles brandbeveiligingssystemen.


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel1
    url: https://wetten.overheid.nl/BWBR0022857/2010-01-01#Artikel1
