  - number: '4'
    text: |-
      Bedrijfsafvalwater dat niet afkomstig is uit een inrichting dat:

      a. bedrijfsafvalstoffen bevat, die door versnijdende of vermalende apparatuur zijn versneden of vermalen of waarvan
      kan worden voorkomen dat ze in het bedrijfsafvalwater terechtkomen,

      b. een gevaarlijke afvalstof is, als bedoeld in artikel 1.1, eerste lid, van de wet, of

      c. stankoverlast veroorzaakt,

      wordt niet in een riolering gebracht.
    url: https://wetten.overheid.nl/BWBR0007854/1996-03-01#Artikel4
  - number: '5'
    text: |-
      [Artikel 4, onder ][ref1], is niet van toepassing met betrekking tot bedrijfsafvalwater ten aanzien waarvan een
      ontheffing geldt krachtens artikel 10.47, eerste lid, van de wet, voor zover daarin toestemming is verleend om
      gevaarlijke afvalstoffen van een daarbij aangegeven aard en samenstelling in een openbaar riool te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0007854#Artikel4
    url: https://wetten.overheid.nl/BWBR0007854/1996-03-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007854
        artikel: '4'
  - number: '6'
    text: |-
      Huishoudelijk afvalwater dat huishoudelijke afvalstoffen bevat, die door versnijdende of vermalende apparatuur zijn
      versneden of vermalen, wordt niet in voorziening voor de inzameling en het transport van afvalwater gebracht.
    url: https://wetten.overheid.nl/BWBR0007854/1996-03-01#Artikel6
  - number: '7'
    text: |-
      1 Bedrijfsafvalwater dat niet afkomstig is uit een inrichting, en huishoudelijk afvalwater worden overigens slechts
      in een openbaar riool gebracht, indien door de samenstelling, eigenschappen of hoeveelheid ervan:

      a. de doelmatige werking niet wordt belemmerd van een openbaar riool, een door een bestuursorgaan beheerd
      zuiveringstechnisch werk, de bij een zodanig openbaar riool of zuiveringstechnisch werk behorende apparatuur,

      b. de verwerking niet wordt belemmerd van slib, verwijderd uit een openbaar riool of een door een bestuursorgaan
      beheerd zuiveringstechnisch werk, en

      c. de nadelige gevolgen voor de kwaliteit van het oppervlaktewater zoveel mogelijk worden beperkt.

      2 Burgemeester en wethouders kunnen nadere eisen stellen met betrekking tot de samenstelling, eigenschappen
      of hoeveelheid van afvalwater dat in een openbaar riool wordt gebracht met het oog op de doelmatige werking,
      bedoeld in het eerste lid, onder *a*, de verwerking, bedoeld in het eerste lid, onder *b* en de kwaliteit van het
      oppervlaktewater, bedoeld in het eerste lid, onder *c*.

      3 Met betrekking tot afvalwater dat wordt gebracht in een andere voorziening voor de inzameling en het transport
      van afvalwater, zijn het eerste en tweede lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0007854/1996-03-01#Artikel7
  - number: '8'
    text: |-
      1 Gedurende één jaar vanaf het tijdstip waarop dit besluit in werking treedt, zijn de voorschriften over
      bedrijfsafvalwater dat niet afkomstig is uit een inrichting, die ten gevolge van dit in werking treden gaan gelden,
      niet van toepassing voor het in een openbaar riool brengen van bedrijfsafvalwater, indien daarvoor onmiddellijk
      voorafgaand aan dat tijdstip voorschriften en beperkingen golden, gesteld bij of krachtens een gemeentelijke
      verordening die regels stelt voor het brengen van afvalwater in de gemeentelijke riolering. De voorschriften of
      beperkingen gesteld bij of krachtens een zodanige verordening blijven gedurende die periode van toepassing.

      2 Voor gevallen waarin onmiddellijk voorafgaand aan het tijdstip waarop dit besluit in werking treedt, een
      vergunning of ontheffing gold krachtens een gemeentelijke verordening als bedoeld in het eerste lid, zijn -
      behoudens eerdere intrekking - de voorschriften over bedrijfsafvalwater die ten gevolge van het in werking treden
      van dit besluit gaan gelden, niet van toepassing gedurende de periode waarvoor die vergunning of ontheffing was
      verleend, maar uiterlijk tot 1 maart 2003. Gedurende die periode blijven een zodanige vergunning of ontheffing
      alsmede bij of krachtens een zodanige verordening gestelde voorschriften of beperkingen en het recht dat
      onmiddellijk voorafgaand aan dat tijdstip ten aanzien daarvan gold van toepassing.
    url: https://wetten.overheid.nl/BWBR0007854/1996-03-01#Artikel8
  - number: '9'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0007854/1996-03-01#Artikel9
  - number: '10'
    text: 'Dit besluit wordt aangehaald als: Besluit lozingsvoorschriften niet-inrichtingen milieubeheer.'
