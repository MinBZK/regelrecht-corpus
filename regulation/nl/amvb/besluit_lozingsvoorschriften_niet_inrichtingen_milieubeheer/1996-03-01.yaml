    Gelet op artikel 11, eerste en tweede lid, van richtlijn nr. 91/271/EEG van 21 mei 1992 van de Raad van de Europese
    Gemeenschappen inzake de behandeling van stedelijk afvalwater (PbEG L 135) en op de artikelen 10.15, derde lid, en
