articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      bedrijfsriolering: voorziening voor de afvoer van bedrijfsafvalwater dat niet afkomstig is uit een inrichting, naar
      een openbaar riool of een andere voorziening voor de inzameling en het transport van afvalwater;

      openbaar riool: gemeentelijke voorziening voor de inzameling en het transport van afvalwater;

      riolering: bedrijfsriolering of voorziening voor de inzameling en het transport van afvalwater;

      wet: [Wet milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0007854/1996-03-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '2'
    text: |-
      Vrijstelling van het verbod, bedoeld in artikel 10.15, eerste lid, van de wet, wordt verleend voor de gevallen
      waarin:

      a. bedrijfsafvalwater dat naar zijn aard overeenkomt met huishoudelijk afvalwater, in het kader van met normaal
      huishoudelijk gebruik vergelijkbaar gebruik in een openbaar riool wordt gebracht, anders dan door middel van een
      straatkolk of inspectieput, onderscheidenlijk

      b. bedrijfsafvalwater, anders dan bedoeld in artikel 10.15, tweede lid, onder *a* en *c*, van de wet, in een andere
      voorziening voor de inzameling en het transport van afvalwater wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0007854/1996-03-01#Artikel2
  - number: '3'
    text: |-
      1 De [artikelen 4][ref1] en [7, eerste en tweede lid][ref2], zijn van toepassing op het brengen van
      bedrijfsafvalwater als bedoeld in artikel 10.15, tweede lid, onder *a* en *c*, van de wet en in artikel 2, onder
      *a*, in een openbaar riool.

      2 De [artikelen 4][ref3], [5][ref4], [7, eerste lid][ref5], zijn van toepassing op het, anders dan vanuit een
      inrichting, brengen van bedrijfsafvalwater, niet zijnde bedrijfsafvalwater als bedoeld in het eerste lid, in een
      openbaar riool.

      3 De [artikelen 4, onder ][ref6], zijn van toepassing op het brengen van bedrijfsafvalwater in een andere
      voorziening voor de inzameling en het transport van afvalwater.

      4 De [artikelen 6][ref7] en [7][ref8] zijn van toepassing op het brengen van huishoudelijk afvalwater in een
      voorziening voor de inzameling en het transport van afvalwater.


