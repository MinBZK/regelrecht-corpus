---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_arbeidsinpassing_en_begeleiding_sociale_werkvoorziening
regulatory_layer: AMVB
publication_date: '2004-10-05'
valid_from: '1998-01-01'
bwb_id: BWBR0008952
url: https://wetten.overheid.nl/BWBR0008952/1998-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid van 8 juli 1997, directie Arbeidsmarkt, nr.
    AM/RAW/97/1421;

    Gelet op de artikel 7, tweede lid, van de Wet sociale werkvoorziening;

    De Raad van State gehoord (advies van 12 augustus 1997, no. W12.97.0414);

    Gezien het nader rapport van Onze Minister van Sociale Zaken en Werkgelegenheid van 1 oktober 1997, directie
    Arbeidsmarkt nr. AM/RAW/97/1946;

    Hebben goed gevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008952/1998-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008952/1998-01-01#Artikel1
  - number: 1.a
    text: |-
      wet: de [Wet sociale werkvoorziening][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008903
    url: https://wetten.overheid.nl/BWBR0008952/1998-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008903
  - number: 1.b
    text: 'indicatie: de beschikking, bedoeld in artikel 11, eerste lid, van de wet;'
    url: https://wetten.overheid.nl/BWBR0008952/1998-01-01#Artikel1
  - number: 1.c
    text: |-
      betrokkene: de persoon die door het gemeentebestuur is geïndiceerd voor toepassing van hoofdstuk 3 van de wet en
      die bij die indicatie te kennen heeft gegeven voor begeleid werken in aanmerking te willen komen;
    url: https://wetten.overheid.nl/BWBR0008952/1998-01-01#Artikel1
  - number: 1.d
    text: |-
      begeleidingsorganisatie: de rechtspersoon, bedoeld in artikel 7, eerste lid, onder *b*, van de wet die zorgdraagt
      voor de arbeidsinpassing van betrokkene of voor de arbeidsinpassing met inbegrip van de begeleiding van betrokkene
      op zijn werkplek gedurende zijn arbeidsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0008952/1998-01-01#Artikel1
  - number: '2'
    text: |-
      Bij ministeriële regeling wordt jaarlijks vastgesteld welk deel van de door het gemeentebestuur op te vullen ruimte
      voor het aangaan van nieuwe dienstbetrekkingen of arbeidsovereenkomsten als bedoeld in de hoofdstukken 2 en 3 van
      de wet, ten minste wordt gebruikt voor het bij voorrang aangaan van arbeidsovereenkomsten, voor zover hiervoor
      betrokkenen beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0008952/1998-01-01#Artikel2
  - number: '3.1'
    text: |-
      Bij het tot stand doen brengen van een arbeidsovereenkomst als bedoeld in hoofdstuk 3 van de wet, draagt het
      gemeentebestuur zorg voor de arbeidsinpassing met inbegrip van de begeleiding van betrokkene op zijn werkplek.
    url: https://wetten.overheid.nl/BWBR0008952/1998-01-01#Artikel3
  - number: '3.2'
    text: |-
      Het gemeentebestuur schakelt bij zijn taak op grond van het eerste lid een begeleidingsorganisatie in. De
      begeleidingsorganisatie wordt ingeschakeld op het moment waarop enige dienstbetrekking of arbeidsovereenkomst
      in het kader van de wet wordt beëindigd anders dan op grond van het door een betrokkene aanvaarden van
      andere arbeid in het kader van de wet. Het gemeentebestuur deelt betrokkene mede op welk moment voor hem een
      begeleidingsorganisatie wordt ingeschakeld.
    url: https://wetten.overheid.nl/BWBR0008952/1998-01-01#Artikel3
  - number: '3.3'
    text: |-
      Bij de arbeidsinpassing wordt rekening gehouden met wensen van betrokkene met betrekking de keuze van de
      begeleidingsorganisatie en de wensen en mogelijkheden van betrokkene met betrekking tot de aard van het werk en van
      de werkgever.
    url: https://wetten.overheid.nl/BWBR0008952/1998-01-01#Artikel3
  - number: '3.4'
    text: |-
      Het gemeentebestuur verstrekt bij het totstandkomen van de arbeidsovereenkomst aan de werkgever van betrokkene uit
      de voor hem beschikbare subsidie een loonkostensubsidie en een subsidie voor de noodzakelijke kosten van aanpassing
      van zijn werkplek en aan de begeleidingsorganisatie een vergoeding voor de kosten van arbeidsinpassing met inbegrip
      van de begeleiding van betrokkene op zijn werkplek.
    url: https://wetten.overheid.nl/BWBR0008952/1998-01-01#Artikel3
  - number: '3.5'
    text: |-
      De zorg van het gemeentebestuur voor het totstandbrengen van een arbeidsovereenkomst als bedoeld in het eerste lid
      vervalt één jaar na het moment, bedoeld in [artikel 3, tweede lid][ref1], tenzij door het gemeentebestuur anders
      wordt beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0008952#Artikel3
    url: https://wetten.overheid.nl/BWBR0008952/1998-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008952
        artikel: '3'
  - number: '4.1'
    text: |-
      In afwijking van [artikel 3, eerste, tweede en derde lid][ref1], kan betrokkene met toestemming van het
      gemeentebestuur zelf voor de arbeidsinpassing zorgdragen.


      [ref1]: https://wetten.overheid.nl/BWBR0008952#Artikel3
    url: https://wetten.overheid.nl/BWBR0008952/1998-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008952
        artikel: '3'
  - number: '4.2'
    text: |-
      Het gemeentebestuur verleent betrokkene in ieder geval de toestemming, bedoeld in het eerste lid, als het niet
      binnen 6 maanden na het moment, bedoeld in [artikel 3, tweede lid][ref1], voor betrokkene een arbeidsovereenkomst
      tot stand heeft gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0008952#Artikel3
    url: https://wetten.overheid.nl/BWBR0008952/1998-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008952
        artikel: '3'
  - number: '4.3'
    text: 'Bij de toepassing van het eerste of tweede lid ziet het gemeentebestuur erop toe dat:'
    url: https://wetten.overheid.nl/BWBR0008952/1998-01-01#Artikel4
  - number: 4.3.a
    text: |-
      betrokkene voor de arbeidsinpassing met inbegrip van de begeleiding op zijn werkplek een begeleidingsorganisatie
      inschakelt;
    url: https://wetten.overheid.nl/BWBR0008952/1998-01-01#Artikel4
  - number: 4.3.b
    text: |-
      het bedrag van de loonkostensubsidie, de subsidie voor de noodzakelijke kosten van aanpassing van zijn werkplek en
      de vergoeding van arbeidsinpassing met inbegrip van de begeleiding op de werkplek van betrokkene niet meer bedraagt
      dan de subsidie die zij voor betrokkene beschikbaar heeft op grond van de arbeidshandicapcategorie van betrokkene;
    url: https://wetten.overheid.nl/BWBR0008952/1998-01-01#Artikel4
  - number: 4.3.c
    text: de indicatie wordt gevolgd;
    url: https://wetten.overheid.nl/BWBR0008952/1998-01-01#Artikel4
  - number: 4.3.d
    text: |-
      de arbeidsovereenkomst door betrokkene wordt aangegaan uiterlijk binnen één jaar na het moment, bedoeld in
      [artikel 3, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008952#Artikel3
    url: https://wetten.overheid.nl/BWBR0008952/1998-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008952
        artikel: '3'
  - number: '5'
    text: |-
      Voor betrokkene met een arbeidsovereenkomst als bedoeld in hoofdstuk 3 van de wet worden gemiddeld niet meer uren
      aan inpassing in de arbeid, met inbegrip van begeleiding op zijn werkplek vergoed dan correspondeert met 15% van
      het aantal door de desbetreffende werknemer voor de werkgever gewerkte uren.
    url: https://wetten.overheid.nl/BWBR0008952/1998-01-01#Artikel5
  - number: '6.1'
    text: 'Het gemeentebestuur ziet erop toe dat een begeleidingsorganisatie:'
    url: https://wetten.overheid.nl/BWBR0008952/1998-01-01#Artikel6
  - number: 6.1.a
    text: haar taken vervult met inachtneming van stand van de wetenschap en die van de arbeids- en organisatiekunde;
    url: https://wetten.overheid.nl/BWBR0008952/1998-01-01#Artikel6
  - number: 6.1.b
    text: |-
      beschikt over voldoende adequaat opgeleide deskundigen die de arbeidsinpassing met inbegrip van de begeleiding op
      de werkplek verzorgen;
    url: https://wetten.overheid.nl/BWBR0008952/1998-01-01#Artikel6
  - number: 6.1.c
    text: de dienstverlening volgens een individueel begeleidingsplan uitvoert;
    url: https://wetten.overheid.nl/BWBR0008952/1998-01-01#Artikel6
  - number: 6.1.d
    text: de dienstverlening regelmatig evalueert;
    url: https://wetten.overheid.nl/BWBR0008952/1998-01-01#Artikel6
  - number: 6.1.e
    text: zorg draagt voor de continuïteit van de dienstverlening;
    url: https://wetten.overheid.nl/BWBR0008952/1998-01-01#Artikel6
  - number: 6.1.f
    text: adequaat klachten behandelt over de dienstverlening;
    url: https://wetten.overheid.nl/BWBR0008952/1998-01-01#Artikel6
  - number: 6.1.g
    text: de arbeid en de arbeidsomstandigheden van betrokkene afstemt op zijn mogelijkheden en beperkingen.
    url: https://wetten.overheid.nl/BWBR0008952/1998-01-01#Artikel6
  - number: '6.2'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de begeleidingsorganisatie,
      het functioneren van de begeleidingsorganisatie en de deskundigen die de arbeidsinpassing en begeleiding bij de
      begeleidingsorganisatie verzorgen.
    url: https://wetten.overheid.nl/BWBR0008952/1998-01-01#Artikel6
  - number: '7'
    text: |-
      Indien betrokkene een arbeidsovereenkomst is aangegaan kan hij het gemeentebestuur gemotiveerd verzoeken een andere
      begeleidingsorganisatie in te schakelen voor begeleiding op zijn werkplek, dan wel het gemeentebestuur gemotiveerd
      verzoeken voor arbeidsinpassing ten behoeve van een andere arbeidsovereenkomst en begeleiding op zijn werkplek zorg
      te dragen. Het gemeentebestuur willigt het verzoek van betrokkene in, tenzij het verzoek kennelijk onredelijk is.
      [Artikel 4, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008952#Artikel4
    url: https://wetten.overheid.nl/BWBR0008952/1998-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008952
        artikel: '4'
  - number: '8.1'
    text: |-
      Artikel 7 van de wet is van toepassing op werknemers die op de dag voorafgaand aan de inwerkingtreding van de wet
      werkzaam waren met toepassing van de artikelen 11 en 12 van de Regeling samenloop arbeidsongeschiktheidsuitkering
      met inkomsten uit arbeid en de Regeling vergoeding persoonlijke ondersteuning gehandicapte werknemers, zoals deze
      regelingen luidden op dat moment, indien de werkgever en de werknemer daarmee binnen twee jaar na inwerkingtreding
      van de wet instemmen. Daarbij wordt [artikel 2][ref1] van dit besluit in acht genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008952#Artikel2
    url: https://wetten.overheid.nl/BWBR0008952/1998-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008952
        artikel: '2'
  - number: '8.2'
    text: De in het eerste lid bedoelde werknemers worden niet overeenkomstig hoofdstuk 5 van de wet geïndiceerd.
    url: https://wetten.overheid.nl/BWBR0008952/1998-01-01#Artikel8
  - number: '8.3'
    text: |-
      Personen die de dag voorafgaand aan de datum van inwerkingtreding van de wet een dienstbetrekking hebben krachtens
      de Wet Sociale Werkvoorziening zoals deze luidde tot die datum en na een aanvraag tot herindicatie als bedoeld
      in [artikel 8, vijfde lid, van het Besluit indicatie sociale werkvoorziening][ref1] voor de arbeid, bedoeld
      in hoofdstuk 3 van de wet, zijn geïndiceerd, komen voor deze arbeid in aanmerking zodra met toepassing van
      de [artikelen 3, met uitzondering van het tweede lid, tweede volzin][ref2], of [4][ref3] van dit besluit een
      arbeidsovereenkomst tot stand is gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0008954#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0008952#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0008952#Artikel4
    url: https://wetten.overheid.nl/BWBR0008952/1998-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008954
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0008952
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0008952
        artikel: '4'
  - number: '8.4'
    text: |-
      Personen die na inwerkingtreding van de wet een dienstbetrekking zijn aangegaan
      krachtens hoofdstuk 2 van de wet en na een herindicatie als bedoeld in
      [artikel 8, eerste of tweede lid, van het Besluit indicatie sociale werkvoorziening][ref1] voor de arbeid,
      bedoeld in hoofdstuk 3 van de wet, zijn geïndiceerd, komen voor deze arbeid in aanmerking zodra met toepassing
      van de [artikelen 3, met uitzondering van het tweede lid, tweede volzin][ref2], of [4][ref3] van dit besluit een
      arbeidsovereenkomst tot stand is gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0008954#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0008952#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0008952#Artikel4
    url: https://wetten.overheid.nl/BWBR0008952/1998-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008954
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0008952
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0008952
        artikel: '4'
  - number: '9'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0008952/1998-01-01#Artikel9
  - number: '10'
    text: 'Dit besluit wordt aangehaald als: Besluit arbeidsinpassing en begeleiding sociale werkvoorziening.'
    url: https://wetten.overheid.nl/BWBR0008952/1998-01-01#Artikel10
