$id: besluit_chloorfluormethanen_in_spuitbussen
regulatory_layer: AMVB
publication_date: '2003-09-16'
valid_from: '1979-04-01'
bwb_id: BWBR0003201
url: https://wetten.overheid.nl/BWBR0003201/1979-04-01
preamble:
  text: |-
    Wij Juliana, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onze Minister van Volksgezondheid en Milieuhygiëne van 23 mei 1978, DGMH/L, nr. 152544, gedaan
    in overeenstemming met Onze Ministers van Economische Zaken en van Landbouw en Visserij;

    Overwegende dat het wenselijk is dat, in verband met de mogelijke vermindering van de ozon in de stratosfeer door
    inwerking van dichloordifluormethaan en trichloorfluormethaan en de nadelige gevolgen daarvan voor de gezondheid
    van de mens, de luchtverontreiniging door gebruik van spuitbussen die deze stoffen bevatten, wordt beperkt, en dat
    als eerste stap daartoe wordt voorgeschreven dat de gebruiker van spuitbussen met het oog op deze effecten wordt
    gewaarschuwd;

    Gelet op de artikelen 13, 15 en 88 van de Wet inzake de luchtverontreiniging (Stb. 1970, 580);

    Gezien het advies van de Raad inzake de luchtverontreiniging van 8 december 1977;

    De Raad van State gehoord (advies van 5 juli 1978, nr. 20);

    Gezien het nader rapport van Onze Minister van Volksgezondheid en Milieuhygiëne van 25 oktober 1978, DGMH/L, nr.
    160121, uitgebracht in overeenstemming met Onze Minister van Economische Zaken en van Landbouw en Visserij;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003201/1979-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt onder spuitbus verstaan een toestel, bestaande uit een van een aftap- of een
      verstuivingsinrichting voorziene drukhouder die een gas of gasmengsel bevat, alsmede een andere stof, bestemd om
      door het gas of gasmengsel uit de drukhouder te worden gedreven.
    url: https://wetten.overheid.nl/BWBR0003201/1979-04-01#Artikel1
  - number: '2'
    text: |-
      Het is verboden een spuitbus die dichloordifluormethaan of trichloofluormethaan bevat, ten verkoop in voorraad
      te hebben, ten verkoop aan te bieden, te verkopen of af te leveren, indien op de bus of, indien de bus in een
      standaardverpakking aan de gebruiker wordt afgeleverd, op die verpakking, niet een waarschuwing is vermeld
      overeenkomstig het in [artikel 3][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0003201#Artikel3
    url: https://wetten.overheid.nl/BWBR0003201/1979-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003201
        artikel: '3'
  - number: '3'
    text: |-
      De waarschuwing, bedoeld in [artikel 2][ref1], dient onuitwisbaar en duidelijk zichtbaar en leesbaar te zijn
      aangebracht en dient te luiden: "Waarschuwing. Bevat een chloorfluormethaan dat schadelijk kan zijn voor het milieu
      en voor de gezondheid van de mens door vermindering van ozon in de stratosfeer."


      [ref1]: https://wetten.overheid.nl/BWBR0003201#Artikel2
    url: https://wetten.overheid.nl/BWBR0003201/1979-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003201
        artikel: '2'
  - number: '4'
    text: |-
      [Artikel 2][ref1] geldt niet voor handelingen die betrekking hebben op spuitbussen

      a. die bestemd zijn voor uitvoer;

      b. waarop [artikel 4, derde lid, van de Wet op de Geneesmiddelenvoorziening][ref2] (*Stb.* 1958, 408) van
      toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0003201#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002290#Artikel4
    url: https://wetten.overheid.nl/BWBR0003201/1979-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003201
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002290
        artikel: '4'
  - number: '5'
    text: |-
      [Artikel 2][ref1] is eerst twee maanden na het in werking treden van dit besluit van toepassing ten aanzien van
      spuitbussen als bedoeld in dat artikel, die bij het in werking treden van dit besluit reeds vervaardigd en hier te
      lande aanwezig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003201#Artikel2
    url: https://wetten.overheid.nl/BWBR0003201/1979-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003201
        artikel: '2'
  - number: '6'
    text: |-
      1 Dit besluit kan worden aangehaald als Besluit chloorfluormethanen in spuitbussen.

      2 Het treedt in werking met ingang van de zesde kalendermaand na de datum van uitgifte van het *Staatsblad* waarin
      het wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0003201/1979-04-01#Artikel6
