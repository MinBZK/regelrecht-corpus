preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onze Ministers voor Algemeene Oorlogvoering van het Koninkrijk, van Algemeene Zaken,
    van Buitenlandsche Zaken, van Justitie, van Binnenlandsche Zaken, van Onderwijs, Kunsten en Wetenschappen,
    van Financiën, van Oorlog, van Marine, van Waterstaat, van Handel, Nijverheid en Scheepvaart, van Landbouw en
    Visscherij, van Sociale Zaken, van Koloniën en van Onze Ministers zonder Portefeuille van 10 December 1943, No.
    2723/G 92 (a);

    Overwegende, dat de veiligheid van den Staat het dringend noodzakelijk maakt, dat in het Rijk in Europa terstond
    met de bevrijding van de vijandelijke bezetting bijzondere gerechten worden ingesteld, ten einde een snelle en
    doeltreffende berechting van zekere gedurende den tijd van den huidigen oorlog begane misdrijven te verzekeren;

    Den Buitengewonen Raad van Advies gehoord;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In het Rijk in Europa worden, naarmate hetzelve van de vijandelijke bezetting wordt bevrijd, door Ons zoo spoedig
      mogelijk Bijzondere Gerechtshoven ingesteld, welker rechtsgebied en plaats van vestiging door Ons wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel1
  - number: '2.1'
    text: |-
      Ieder Bijzonder Gerechtshof wordt samengesteld uit een rechtsgeleerden president en zooveel rechtsgeleerde vice-
      presidenten en rechtsgeleerde en militaire raadsheeren en raadsheeren-plaatsvervangers als voor een goede en snelle
      berechting der aan zijn kennisneming onderworpen zaken noodig zullen blijken te zijn.
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel2
  - number: '2.2'
    text: |-
      Bij ieder Bijzonder Gerechtshof zijn voorts een procureur-fiscaal en een griffier, alsmede zooveel advocaten-
      fiscaal en substituut-griffiers als noodig zullen blijken te zijn.
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel2
  - number: '3.1'
    text: |-
      De presidenten en vice-presidenten der Bijzondere Gerechtshoven, alsmede de rechtsgeleerde raadsheeren
      en raadsheeren-plaatsvervangers worden door Ons op gemeenschappelijke voordracht van Onze Ministers
      van Justitie, van Marine en van Oorlog aangesteld voor den duur der instandhouding van het college, bij
      hetwelk die aanstelling geschiedt. Zij kunnen op voordracht van Onze genoemde Ministers door Ons uit
      hun ambt worden ontzet of ontslagen of in hunne bediening worden geschorst op de gronden, genoemd in de
      [artikelen 46c, tweede en derde lid][ref1], [46d][ref2], [46f][ref3], [46i][ref4], [46j][ref5], [46l][ref6] en
      [46m van de Wet rechtspositie rechterlijke ambtenaren][ref7]; ook kan hun op eigen verzoek ontslag worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46c
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46d
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel46f
      [ref4]: https://wetten.overheid.nl/BWBR0008365#Artikel46i
      [ref5]: https://wetten.overheid.nl/BWBR0008365#Artikel46j
      [ref6]: https://wetten.overheid.nl/BWBR0008365#Artikel46l
      [ref7]: https://wetten.overheid.nl/BWBR0008365#Artikel46m
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46c
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 46d
      - id: ref3
        bwb_id: BWBR0008365
        artikel: 46f
      - id: ref4
        bwb_id: BWBR0008365
        artikel: 46i
      - id: ref5
        bwb_id: BWBR0008365
        artikel: 46j
      - id: ref6
        bwb_id: BWBR0008365
        artikel: 46l
      - id: ref7
        bwb_id: BWBR0008365
        artikel: 46m
  - number: '3.2'
    text: |-
      De militaire leden van en de in het tweede lid van het voorgaande artikel genoemde rechterlijke ambtenaren bij
      de Bijzondere Gerechtshoven worden door Ons op gemeenschappelijke voordracht van Onze Ministers van Justitie, van
      Marine en van Oorlog tot wederopzeggens toe benoemd.
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel3
  - number: '4.1'
    text: |-
      Tot de bedieningen, in [artikel 2][ref1] genoemd, zijn benoembaar Nederlandsche onderdanen, die den vollen ouderdom
      van dertig of, voor zoover de substituut-griffiers betreft, van vijf en twintig, doch nog niet dien van zeventig
      jaren hebben bereikt; bij het bereiken van den vollen ouderdom van zeventig jaren wordt hun door Ons ontslag
      verleend met ingang van de eerstvolgende maand.


      [ref1]: https://wetten.overheid.nl/BWBR0002007#Artikel2
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002007
        artikel: '2'
  - number: '4.2'
    text: |-
      Met uitzondering van de militaire raadsheeren en raadsheeren-plaatsvervangers moeten zij aan eene Rijks-
      of daarmede gelijkgestelde Nederlandsche universiteit hebben verkregen hetzij den graad van doctor in de
      rechtswetenschap, hetzij den graad van doctor in de rechtsgeleerdheid of de hoedanigheid van meester in de
      rechten, mits de laatstbedoelde graad of hoedanigheid verkregen is op grond van het afleggen van een examen in
      het Nederlandsch burgerlijk en handelsrecht, staatsrecht en strafrecht. Zij kunnen tevens een ander ambt bij de
      rechterlijke macht bekleeden of, voor zoover dit de vervulling hunner dienstplichten niet belet, eenig ander ambt
      of beroep uitoefenen.
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel4
  - number: '4.3'
    text: |-
      De militaire raadsheeren en raadsheeren-plaatsvervangers moeten zijn officieren der zee- of landmacht, behoorende
      hetzij tot het beroeps-, hetzij tot het reserve-personeel, onverschillig of zij al dan niet in actieven dienst
      zijn. Zij zullen bij voorkeur worden benoemd uit vlag-, opper- en hoofdofficieren en bij voorkeur een graad of
      hoedanigheid bezitten, als in het voorgaande lid bedoeld. Bij ieder Bijzonder Gerechtshof zal zooveel mogelijk het
      aantal raadsheeren, behoorende tot de zeemacht, gelijk zijn aan dat der raadsheeren, behoorende tot de landmacht.
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel4
  - number: '5.1'
    text: 'In geval van afwezigheid, belet of ontstentenis worden vervangen:'
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel5
  - number: 5.1.1°
    text: |-
      de president van een Bijzonder Gerechtshof door een vice-president of, bij gebreke van dezen, door den oudst
      benoemden rechtsgeleerden raadsheer;
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel5
  - number: 5.1.2°
    text: |-
      een rechtsgeleerde raadsheer, bij gebreke van een anderen rechtsgeleerden raadsheer, door een rechtsgeleerden
      raadsheer-plaatsvervanger;
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel5
  - number: 5.1.3°
    text: |-
      een militaire raadsheer door een anderen militairen raadsheer of een militairen raadsheer-plaatsvervanger, met dien
      verstande, dat zooveel mogelijk een raadsheer, behoorende tot de zeemacht, wordt vervangen door een tot de zeemacht
      behoorenden raadsheer of raadsheer-plaatsvervanger en een raadsheer, behoorende tot de landmacht, door een tot de
      landmacht behoorenden raadsheer of raadsheer-plaatsvervanger;
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel5
  - number: 5.1.4°
    text: |-
      de procureur-fiscaal, bij gebreke van een waarnemend procureur-fiscaal, door een der advocaten-fiscaal - voor
      zoover van Onzentwege niet anders is bepaald, volgens den rang hunner benoeming - en, bij gebreke ook van een
      advocaat-fiscaal, door een waarnemend advocaat-fiscaal of door een door den president aan te wijzen rechtsgeleerden
      raadsheer;
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel5
  - number: 5.1.5°
    text: |-
      de griffier door een substituut-griffier en, bij gebreke van een substituut-griffier, door een waarnemend griffier
      of door een beëedigden klerk ter griffie.
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel5
  - number: '5.2'
    text: |-
      Als waarnemend procureur-fiscaal kan door Ons worden aangewezen een procureur- of advocaat-fiscaal bij een ander
      Bijzonder Gerechtshof, als waarnemend advocaat-fiscaal een substituut-officier van justitie of een officier-
      fiscaal, mits deze den graad of hoedanigheid heeft verkregen als bedoeld in [artikel 4, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002007#Artikel4
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002007
        artikel: '4'
  - number: '5.3'
    text: |-
      Als waarnemend griffier kan door Ons een buitengriffier bij een rechtbank worden aangewezen. De beëedigde klerken
      ter griffie worden op aanbeveling van den griffier door den president tot wederopzeggens benoemd. Zij moeten zijn
      Nederlandsche onderdanen, die den vollen ouderdom van vijf en twintig jaren hebben bereikt. Beeedigde klerken ter
      griffie, die niet een graad of hoedanigheid bezitten, als in het tweede lid van het voorgaande artikel bedoeld,
      zijn niet bevoegd den griffier ter terechtzitting te vervangen.
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel5
  - number: '6.1'
    text: |-
      De presidenten van en de procureurs-fiscaal bij de Bijzondere Gerechtshoven leggen, alvorens in bediening te
      treden, in handen van Ons of van een hiertoe door Ons of van Onzentwege aangewezen bijzonderen gemachtigde den eed
      (belofte) af, bedoeld in [artikel 1g, eerste lid, van de Wet rechtspositie rechterlijke ambtenaren][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel1g
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 1g
  - number: '6.2'
    text: |-
      De overige leden der rechterlijke macht bij de Bijzondere Gerechtshoven leggen dien eed (belofte) af in handen van
      den president van het college, waartoe zij behooren.
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel6
  - number: '7.1'
    text: |-
      De bezoldiging der leden van en rechterlijke ambtenaren bij de Bijzondere Gerechtshoven is gelijk aan die van leden
      van en rechterlijke ambtenaren bij het Gerechtshof te Arnhem in overeenkomstige functie, met dien verstande, dat op
      deze bezoldiging in mindering wordt gebracht twee derde gedeelte van hetgeen, waarop zij uit enigen anderen hoofde
      als bezoldiging, wachtgeld of pensioen ten laste van het Rijk, een provincie of ander openbaar lichaam of wel ten
      laste van een der overzeese gebiedsdelen aanspraak mochten hebben.
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel7
  - number: '7.2'
    text: |-
      Betreft de aanspraak evenwel een bezoldiging, genoten ter zake van een ambt, hetwelk het lid van of de rechterlijke
      ambtenaar bij een Bijzonder Gerechtshof, tijdens zijn werkzaamheid bij zodanig Hof in het geheel niet heeft
      uitgeoefend, dan wordt die bezoldiging voor het geheel in mindering gebracht.
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel7
  - number: '7.3'
    text: |-
      In geen geval wordt een hoger bedrag in mindering gebracht dan twee derde gedeelte of, wanneer het bepaalde in het
      tweede lid van toepassing is, het volle bedrag van de in de aanhef van het eerste lid bedoelde bezoldiging.
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel7
  - number: '7.4'
    text: De raadsheren-plaatsvervangers genieten als zodanig geen bezoldiging.
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel7
  - number: '8.1'
    text: |-
      De leden van en rechterlijke ambtenaren bij de Bijzondere Gerechtshoven hebben hun vast en voortdurend verblijf
      binnen het rechtsgebied van hun college, voor zoover hun niet van Onzentwege een andere verblijfplaats wordt
      aangewezen.
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel8
  - number: '8.2'
    text: |-
      Indien zij zich buiten den tijd hunner vacantiën langer dan acht dagen van hun vast en voortdurend verblijf willen
      verwijderen, hebben zij daartoe verlof noodig: voor zoover den president en den procureur-fiscaal betreft, van
      Onzen Minister van Justitie; voor zoover den advocaten-fiscaal betreft, van den procureur-fiscaal; voor zoover de
      overige leden der rechterlijke macht bij de Bijzondere Gerechtshoven betreft, van den president van het college,
      waartoe zij behooren.
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel8
  - number: '10'
    text: De Bijzondere Gerechtshoven vonnissen met twee rechtsgeleerde leden en één militair lid.
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel10
  - number: '11.1'
    text: Elk Bijzonder Gerechtshof is verdeeld in zooveel kamers als door Ons zal worden bepaald.
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel11
  - number: '11.2'
    text: |-
      De samenstelling en bezetting van, alsmede de verdeeling der werkzaamheden onder de kamers, de dagen der gewone
      zittingen en het uur van den aanvang derzelve worden door den president in overleg met de overige leden van zijn
      college, den procureur-fiscaal en den griffier geregeld en telkens, als hiertoe aanleiding bestaat, herzien.
      Daarbij kan tevens worden bepaald, dat een of meer kamers hetzij uitsluitend, hetzij mede zitting zullen houden op
      een of meer andere plaatsen, gelegen binnen het rechtsgebied van het college, dan waar hetzelve gevestigd is.
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel11
  - number: '11.3'
    text: |-
      Hetgeen is bepaald overeenkomstig het tweede lid wordt vastgesteld bij een reglement. Dit reglement wordt
      bekendgemaakt in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel11
  - number: '12.1'
    text: |-
      Behoudens het bepaalde in het tweede lid van dit artikel nemen de Bijzondere Gerechtshoven, met uitsluiting van
      eenigen anderen rechter, in eersten aanleg en tevens, behoudens het beroep in cassatie, in het laatste ressort
      kennis van de misdrijven, waarop de bepalingen van het [Besluit Buitengewoon Strafrecht][ref1] van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002006
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002006
  - number: '12.2'
    text: |-
      De militaire rechter neemt kennis van de in het slot van het eerste lid bedoelde misdrijven, door militairen
      begaan, tenzij deze misdrijven zijn gepleegd in door den vijand bezet gebied van het Rijk in Europa.
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel12
  - number: '13.1'
    text: |-
      Tegen de sententiën der Bijzondere Gerechtshoven is in de gevallen en volgens de regelen, in het
      [Besluit Buitengewone Rechtspleging][ref1] bepaald, voorziening in cassatie toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0002008
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002008
  - number: '13.2'
    text: |-
      Van den eisch tot cassatie neemt kennis een door Ons in te stellen Bijzondere Raad van Cassatie, welks plaats van
      vestiging door Ons wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel13
  - number: '13.3'
    text: |-
      De Bijzondere Raad van Cassatie neemt bovendien in eersten aanleg en tevens in het laatste ressort kennis van de
      jurisdictiegeschillen:
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel13
  - number: 13.3.1°
    text: tusschen de Bijzondere Gerechtshoven onderling;
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel13
  - number: 13.3.2°
    text: tusschen de Bijzondere Gerechtshoven eenerzijds en eenigen anderen burgerlijken of militairen rechter anderzijds;
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel13
  - number: 13.3.3°
    text: |-
      tusschen den Bijzonderen Raad van Cassatie eenerzijds en eenigen anderen burgerlijken of militairen rechter, de
      Bijzondere Gerechtshoven daaronder begrepen, anderzijds.
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel13
  - number: '14'
    text: |-
      Ten aanzien van de Bijzondere Raad van Cassatie zijn de [artikelen 2][ref1] tot en met [8][ref2] en [11][ref3] van
      overeenkomstige toepassing, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0002007#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002007#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002007#Artikel11
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002007
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002007
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0002007
        artikel: '11'
  - number: 14.1°
    text: |-
      de leden van en rechterlijke ambtenaren bij dien Raad niet tevens een ambt kunnen bekleeden bij een Bijzonder
      Gerechtshof;
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel14
  - number: 14.2°
    text: |-
      de militaire raadsheeren en raadsheeren-plaatsvervangers in dien Raad moeten zijn hetzij vlag- of opperofficieren,
      hetzij hoofdofficieren, die een graad of hoedanigheid hebben als in [artikel 4, tweede lid][ref1], bedoeld;


      [ref1]: https://wetten.overheid.nl/BWBR0002007#Artikel4
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002007
        artikel: '4'
  - number: 14.3°
    text: |-
      bij de toepassing ten deze van [artikel 7][ref1] als maatstaf van bezolding geldt de bezoldiging van leden van en
      rechterlijke ambtenaren bij den Hoogen Raad in overeenkomstige functie;


      [ref1]: https://wetten.overheid.nl/BWBR0002007#Artikel7
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002007
        artikel: '7'
  - number: 14.4°
    text: |-
      de leden van en rechterlijke ambtenaren bij den Bijzonderen Raad van Cassatie hun vast en voortdurend verblijf
      hebben binnen de provincie, waarin de plaats van vestiging van dien Raad is gelegen, voor zoover hun niet van
      Onzentwege een andere verblijfplaats wordt aangewezen.
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel14
  - number: 14a
    text: |-
      Onder afwijking in zoverre van [artikel 14][ref1] juncto [artikel 7][ref2] wordt bepaald, dat bij het in
      [artikel 7][ref3] bedoelde in mindering brengen op de bezoldiging als lid van of rechterlijk ambtenaar bij de
      Bijzondere Raad van Cassatie buiten beschouwing blijven de toelagen, bedoeld in artikel 5*c* van de wet van 18
      December 1947 (*Stb.* H 430), zowel met betrekking tot de hiervoor bedoelde bezoldiging als tot het in mindering
      te brengen bedrag en dat eerst na vorenbedoeld in mindering brengen wordt vastgesteld het bedrag van vorenbedoelde
      toelagen, op hetwelk in elk der beklede betrekkingen aanspraak bestaat. Het tweede lid van voormeld artikel 5*c* is
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002007#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002007#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002007#Artikel7
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0002007
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0002007
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0002007
        artikel: '7'
  - number: '15.1'
    text: |-
      De Bijzondere Raad van Cassatie vonnist met vijf leden, waaronder ten minste één en ten hoogste twee militaire
      leden; indien er twee militaire leden zijn, zal zooveel mogelijk één hunner tot de zeemacht en één tot de landmacht
      behooren.
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel15
  - number: '15.2'
    text: |-
      Wij behouden Ons voor bij den Bijzonderen Raad van Cassatie een of meer bijzondere kamers in te stellen, bestaande
      uit drie leden, waaronder één militair lid.
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel15
  - number: '15.3'
    text: |-
      De rechtsmacht der bijzondere kamers wordt geregeld bij het [Besluit Buitengewone Rechtspleging][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002008
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002008
  - number: '16.1'
    text: |-
      De Bijzondere Raad van Cassatie vernietigt de sententiën der Bijzondere Gerechtshoven op de gronden, genoemd in
      [artikel 77 van de Wet op de rechterlijke organisatie][ref1], met dien verstande, dat:


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel77
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '77'
  - number: 16.1.1°
    text: |-
      met verkeerde toepassing der wet ten deze wordt gelijkgesteld de oplegging van een straf of maatregel, welke niet
      geacht kan worden te beantwoorden aan den ernst van het misdrijf, de omstandigheden, waaronder het is begaan, of
      den persoon of de persoonlijke omstandigheden van den veroordeelde;
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel16
  - number: 16.1.2°
    text: |-
      verzuim der vormen, op straffe van nietigheid voorgeschreven, geen grond tot vernietiging behoeft te geven, indien
      redelijkerwijze moet worden aangenomen, dat de verdachte door het verzuim in zijn belangen niet is geschaad.
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel16
  - number: '16.2'
    text: |-
      Het bepaalde in de [artikelen 78, vijfde en zesde lid][ref1],
      en [83 van de Wet op de rechterlijke organisatie][ref2], de
      [artikelen 420 tot en met 424 van het Wetboek van Burgerlijke Rechtsvordering][ref3] en de [artikelen 440][ref4] en
      [456, eerste lid, van het Wetboek van Strafvordering][ref5] is van overeenkomstige toepassing, met dien verstande,
      dat de Bijzondere Raad van Cassatie, indien een sententie wordt vernietigd ter zake van verzuim in de vormen, die
      op straffe van nietigheid zijn voorgeschreven, de zaak ook kan verwijzen aan het Bijzondere Gerechtshof, dat de
      sententie gewezen heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel78
      [ref2]: https://wetten.overheid.nl/BWBR0001830#Artikel83
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel420
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel440
      [ref5]: https://wetten.overheid.nl/BWBR0001903#Artikel456
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '78'
      - id: ref2
        bwb_id: BWBR0001830
        artikel: '83'
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '420'
      - id: ref4
        bwb_id: BWBR0001903
        artikel: '440'
      - id: ref5
        bwb_id: BWBR0001903
        artikel: '456'
  - number: '17.1'
    text: |-
      Ten aanzien van het openbaar ministerie bij de Bijzondere Gerechtshoven en den Bijzonderen Raad van Cassatie vinden
      de [artikelen 124][ref1] en [127 van de Wet op de rechterlijke organisatie][ref2] overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel124
      [ref2]: https://wetten.overheid.nl/BWBR0001830#Artikel127
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '124'
      - id: ref2
        bwb_id: BWBR0001830
        artikel: '127'
  - number: '17.2'
    text: |-
      De procureur-fiscaal bij den Bijzonderen Raad van Cassatie waakt voor de handhaving en de uitvoering der wetten
      en reglementen bij dien Raad en bij de Bijzondere Gerechtshoven. Hij geeft daartoe de noodige bevelen aan de
      procureurs-fiscaal bij de Bijzondere Gerechtshoven, welke deze verplicht zijn na te komen.
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel17
  - number: '17.3'
    text: |-
      De procureurs-fiscaal bij de Bijzondere Gerechtshoven zijn, ieder binnen zijn ressort, met uitsluiting van eenig
      ander openbaar ministerie, belast met de uitoefening en het beleid der crimineele justitie in zaken, waarvan de
      kennisneming aan die Gerechtshoven behoort, alsmede met de handhaving en uitvoering der wetten en reglementen bij
      het college, waarbij zij zijn aangesteld. De procureurs-generaal bij de Gerechtshoven, verleenen aan de procureurs-
      fiscaal bij de Bijzondere Gerechtshoven alle medewerking, welke deze bij de uitoefening van hun taak behoeven.
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel17
  - number: '18.1'
    text: |-
      Ten aanzien van de Bijzondere Gerechtshoven en van de Bijzondere Raad van Cassatie zijn de
      [artikelen 46c, eerste lid][ref1], [46d][ref2] en [46e van de Wet rechtspositie rechterlijke ambtenaren][ref3], de
      [artikelen 9b][ref4] en [9c van het Besluit rechtspositie rechterlijke ambtenaren][ref5] en de [artikelen 4][ref6],
      [5][ref7], [7][ref8], [12][ref9], [13][ref10] en [74 van de Wet op de rechterlijke organisatie][ref11],
      alsmede de [artikelen 3, tot en met 6][ref12], [7, tweede lid][ref13], [8 tot en met 11][ref14], [19][ref15] en
      [21 tot en met 27 van het Besluit orde van dienst gerechten][ref16] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46c
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46d
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel46e
      [ref4]: https://wetten.overheid.nl/BWBR0006530#Artikel9b
