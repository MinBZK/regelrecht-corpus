  - number: '18.2'
    text: |-
      Alle andere beschikkingen, die de inwendige dienst van deze colleges betreffen, worden, voor zover
      nodig, door het bestuur van de colleges in overleg met de procureur-fiscaal en de griffier getroffen.
      [Artikel 11, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002007#Artikel11
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002007
        artikel: '11'
  - number: '19'
    text: |-
      Op de terechtzittingen van de Bijzondere Gerechtshoven en van de Bijzondere Raad van
      Cassatie dragen de rechterlijke ambtenaren bij die colleges het kostuum bedoeld in
      [artikel 6 van het Kostuum- en titulatuurbesluit rechterlijke organisatie][ref1], althans een zwarte toga en een
      witte bef, en dragen de militaire leden van die colleges hun uniform.


      [ref1]: https://wetten.overheid.nl/BWBR0009255#Artikel6
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0009255
        artikel: '6'
  - number: '20.1'
    text: |-
      Dit besluit, ten aanzien waarvan de bevoegdheid, bedoeld in artikel 9, tweede lid, van het Besluit op den
      bijzonderen staat van beleg, niet kan worden uitgeoefend, treedt in werking op den dag zijner afkondiging.
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel20
  - number: '20.2'
    text: 'Het kan worden aangehaald onder den titel: Besluit op de Bijzondere Gerechtshoven.'
    url: https://wetten.overheid.nl/BWBR0002007/2002-01-01#Artikel20
