  - number: '5'
    text: |-
      1 In een programma worden tenminste opgenomen het doel van de subsidieverstrekking, een aanduiding van
      de in aanmerking komende subsidie-ontvangers en van de subsidiabele kosten, en indien van toepassing: het
      subsidieplafond, het maximale subsidiepercentage, en het maximale subsidiebedrag.

      2 Indien voor een programma een subsidieplafond als bedoeld in
      [artikel 15.13, derde lid, van de Wet milieubeheer][ref1], wordt vastgesteld, wordt
      in dat programma in verband met de besluitvorming over de aanvraag, bedoeld in
      [artikel 15.13, tweede lid, onderdeel d, van de Wet milieubeheer][ref2], bepaald of bij de subsidieverlening:

      a. wordt beslist in de volgorde van de ontvangst van de aanvragen, met dien verstande dat wanneer de aanvrager
      krachtens [artikel 4:5 van de Algemene wet bestuursrecht][ref3] de gelegenheid heeft gehad de aanvraag aan te
      vullen, de dag waarop de aanvraag is aangevuld voor die beslissing als datum van ontvangst van de aanvraag geldt,
      of

      b. aanvragen met betrekking tot soortgelijke activiteiten gelijktijdig worden beoordeeld op basis van hun
      geschiktheid om bij te dragen aan de doelstellingen van het programma.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15.13
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel15.13
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel45
    url: https://wetten.overheid.nl/BWBR0010065/2008-12-23#Artikel5
