  - number: '4'
    text: |-
      Indien Onze Minister subsidie verstrekt op aanvraag van een staat of een volkenrechtelijke organisatie,
      is dit besluit van toepassing, met uitzondering van de [artikelen 10][ref1], [11, tweede lid][ref2],
      [12, zesde lid][ref3], [13][ref4] en [14][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0010065#Artikel10
