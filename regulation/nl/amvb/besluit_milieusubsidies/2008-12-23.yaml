        artikel: '12'
        hoofdstuk: '6'
  - number: '12'
    text: |-
      1 Onze Minister kan op aanvraag per tijdvak van drie maanden een voorschot verlenen. Zonodig worden bij de
      aanvraag, bedoeld in de eerste volzin, de in [artikel 11, tweede lid, onderdeel e][ref1], bedoelde gegevens
      verstrekt. De aanvraag behoeft slechts éénmaal te worden ingediend ten behoeve van het gehele tijdvak waarvoor
      subsidie wordt gevraagd.

      2 Onverminderd het zesde lid, wordt de hoogte van het voorschot bepaald door het subsidiebedrag te delen door het
      aantal gehele maanden waaruit het tijdvak bestaat waarvoor de subsidie wordt verleend, en het resulterende bedrag
      met drie te vermenigvuldigen.

      3 In afwijking van het tweede lid wordt, onverminderd het bepaalde in het zesde lid, de hoogte en de spreiding van
      de voorschotten per tijdvak bepaald aan de hand van de individuele liquiditeitsbehoefte die blijkt uit de ingevolge
      [artikel 11, tweede lid, onderdeel e][ref2], bij de aanvraag verstrekte gegevens of uit een raming als bedoeld
      in [artikel 13, eerste lid, onderdeel d, onder 2°][ref3]. Onze Minister kan zonodig ambtshalve de hoogte en de
      spreiding van de voorschotten per tijdvak bepalen.

      4 Indien uit de rapportage, bedoeld in [artikel 13, eerste lid][ref4], blijkt dat de gemaakte kosten tenminste
      10 procent afwijken van de verleende voorschotten, kunnen de wijze van bevoorschotting en de hoogte van de
      voorschotten ambtshalve of op aanvraag worden aangepast.

      5 De voorschotverlening wordt opgeschort zolang de rapportage, bedoeld in [artikel 13, eerste lid][ref5], in strijd
      met dat artikel niet is ontvangen.

      6 Voorschotten worden steeds uitbetaald voor 100 procent per tijdvak als bedoeld in het eerste of derde lid, totdat
      zij tezamen ten hoogste bedragen:

      a. 80 procent van de verleende subsidie, ingeval de subsidie-ontvanger een onderneming drijft, en

      b. 95 procent van de verleende subsidie, ingeval de subsidie-ontvanger geen onderneming drijft.

      7 In het zesde lid wordt verstaan onder onderneming: onderneming als bedoeld in de
      [Wet op de omzetbelasting 1968][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0010065#Artikel11
