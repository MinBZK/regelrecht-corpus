  - number: '18'
    text: |-
      1 Ingetrokken worden:

      a. het Besluit diverse subsidies milieubeheer;

      b. het Subsidiebesluit maatschappelijke organisaties en milieu;

      c. het Subsidiebesluit milieugerichte technologie, en

      d. het [Subsidiebesluit openbare lichamen milieubeheer][ref1], met uitzondering van:

      1°. de [artikelen 48a tot en met 48r][ref2] en [77][ref3] en de [bijlage B][ref4], die worden ingetrokken met
      ingang van 1 januari 2003, onderscheidenlijk

      2°. de [artikelen 1][ref5], [2][ref6], [2b][ref7], [4 tot en met 4d][ref8], [6 tot en met 6h][ref9],
      [8 tot en met 8d][ref10], [11 tot en met 11d][ref11], [11f tot en met 13][ref12], [15 tot en met 19][ref13],
      [50 tot en met 52][ref14], [55 tot en met 57][ref15], [81a][ref16] en [83][ref17] en de [bijlage A][ref18], de
      [bijlage C][ref19] en de bijlage Lijst industrieterrein in kader sanering industrielawaai, die worden ingetrokken
      met ingang van een bij koninklijk besluit te bepalen tijdstip dat voor verschillende artikelen verschillend kan
      worden vastgesteld.

      2 De besluiten, bedoeld in het eerste lid, onder a tot en met c, zoals ze luidden voor het tijdstip waarop dit
      besluit in werking is getreden, blijven van toepassing op subsidies die voor de inwerkingtreding van dit besluit
      zijn aangevraagd op grond van een dergelijk besluit. De artikelen en bijlagen, genoemd in het eerste lid, onder d,
      zoals deze laatstelijk luidden voor het tijdstip waarop ze worden ingetrokken, blijven van toepassing op subsidies
      die voor dat tijdstip zijn aangevraagd op grond van één van die artikelen.

      3 Het Programma Hergebruik Afvalstoffen 1998 (PH'98), onderdeel van de regeling van de Minister van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 6 maart 1998, nr. DGM/SP 98022985, houdende vaststelling
      voor 1998 van programma‘s en subsidieplafonds Subsidiebesluit milieugerichte technologie (Stcrt. 1998, nr. 50),
      zoals nadien gewijzigd, wordt aangemerkt als een programma in de zin van dit besluit. In afwijking van het eerste
      lid, aanhef en onderdeel c, wordt het Subsidiebesluit milieugerichte technologie gehandhaafd ten behoeve van de
      toepassing van het Programma, bedoeld in de eerste volzin.

      4 Dit besluit is niet van toepassing op subsidies verstrekt krachtens de Subsidieregeling niet-industriële
      restwarmte-infrastructuur.


