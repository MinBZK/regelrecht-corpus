  - number: '6'
    text: >-
      1 Tenzij een programma anders bepaalt, wordt de hoogte van de subsidie bepaald met inachtneming van:


      a. de aanvraag;


      b. de mate waarin de aanvrager een eigen belang heeft bij de resultaten van de activiteit, en


      c. de mate waarin de activiteit bijdraagt aan de doelstellingen opgenomen in het programma.


      2 Bij de bepaling van de hoogte van de subsidie wordt voorts rekening gehouden met subsidies die uit anderen hoofde
      vanwege het Rijk of de Commissie worden of zijn aangevraagd dan wel zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0010065/2008-12-23#Artikel6
  - number: '7'
    text: |-
      Indien het subsidieplafond van een programma is bereikt, waarvoor de in [artikel 5, tweede lid, onderdeel a][ref1],
      bedoelde wijze van verdeling geldt, deelt Onze Minister dit onverwijld in de Staatscourant mee.


      [ref1]: https://wetten.overheid.nl/BWBR0010065#Artikel5
    url: https://wetten.overheid.nl/BWBR0010065/2008-12-23#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0010065
        artikel: '5'
        hoofdstuk: '3'
  - number: '8'
    text: >-
      1 Voor zover voor een programma of een subsidie goedkeuring van de Commissie is vereist op grond van [artikel
      93, derde lid, van het Verdrag tot oprichting van de Europese Gemeenschap](onbekend), wordt het programma niet
      vastgesteld, onderscheidenlijk de beschikking tot subsidieverlening niet gegeven, voordat die goedkeuring is
      verkregen of geacht moet worden te zijn verkregen.


      2 Onze Minister doet in de Staatscourant mededeling van het verlenen van de goedkeuring van de Commissie.
      Indien de Commissie voorschriften aan de goedkeuring verbindt, neemt Onze Minister deze in het programma op,
      onderscheidenlijk verbindt hij deze als verplichtingen aan de beschikking tot subsidieverlening, voor zover zij
      zich daartoe lenen.


      3 Onze Minister draagt er zorg voor dat het programma, onderscheidenlijk een subsidie, in overeenstemming is met de
      regelgeving van de Europese Unie, de jurisprudentie van het Hof van Justitie van de Europese Gemeenschappen en het
      beleid van de Commissie terzake van de verlening van staatssteun.
    url: https://wetten.overheid.nl/BWBR0010065/2008-12-23#Artikel8
  - number: '9'
    text: |-
      Onze Minister dient bij de Commissie na afloop van ieder kalenderjaar een verslag in over de uitvoering in dat jaar
      van ieder goedgekeurd programma en iedere goedgekeurde subsidie als bedoeld in [artikel 8, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010065#Artikel8
    url: https://wetten.overheid.nl/BWBR0010065/2008-12-23#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0010065
        artikel: '8'
        hoofdstuk: '4'
  - number: '10'
    text: |-
      De subsidie-ontvanger is verplicht:

      a. de activiteit uit te voeren overeenkomstig de omschrijving van die activiteit in de beschikking tot
      subsidieverlening, tenzij Onze Minister voorafgaand schriftelijk heeft ingestemd met afwijking daarvan;

      b. te voldoen aan de verplichtingen die door Onze Minister aan de subsidie zijn verbonden. Daarbij kan Onze
      Minister slechts verplichtingen opleggen:

      1°. als bedoeld in [artikel 8, tweede lid, tweede volzin][ref1], of

      2°. die betrekking hebben op de wijze waarop of de middelen waarmee de gesubsidieerde activiteit wordt verricht;

      c. indien hij in verband met de verstrekte subsidie, op zijn beurt subsidie verstrekt aan een derde, de
      [artikelen 2, tweede lid][ref2], en [6, tweede lid][ref3], toe te passen en daaraan de verplichtingen te verbinden,
      die zijn bedoeld in [artikel 8, tweede lid, tweede volzin, in de onderdelen b, aanhef en onder 2°, en f][ref4],
      alsmede, indien van toepassing, aan Onze Minister een verslag te sturen als bedoeld in [artikel 9][ref5];

      d. een administratie te voeren die zodanig is ingericht, dat daaruit te allen tijde op eenvoudige en duidelijke
      wijze de subsidiabele kosten kunnen worden afgelezen;

      e. onverwijld nadat een verzoek tot verlening van surséance van betaling aan of faillietverklaring van hem, dan
      wel een aangifte of vordering daartoe bij de rechtbank is ingediend, daarvan schriftelijk mededeling te doen aan
      Onze Minister;

      f. op verzoek van de Onze Minister medewerking te verlenen aan openbaarmaking van de gegevens en de resultaten van
      de activiteit, met uitzondering van vertrouwelijke bedrijfsgegevens;

      g. alle gevraagde medewerking te verlenen aan een door Onze Minister terzake van de toepassing en de effecten van
      dit besluit ingesteld evaluatie-onderzoek, waarbij Onze Minister die medewerking slechts kan verlangen voor zover
      hij daaraan redelijkerwijs behoefte heeft, en

      h. indien de activiteit geheel is uitgevoerd, niet voor een bepaalde tijd is uitgevoerd, niet zal worden uitgevoerd
      dan wel is stopgezet, daar Onze Minister onmiddellijk van in kennis te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0010065#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0010065#Artikel2
