  - number: '16'
    text: |-
      1 Indien de subsidie strekt tot aanschaf van bepaalde, in een programma aangewezen objecten, of
      tot opdrachtverlening tot het verrichten van, bepaalde, in een programma aangewezen diensten,
      zijn de [ artikelen 10, onderdelen d, e, f, g en h, 11, tweede lid][ref1], [12][ref2], [13][ref3],
      [14, tweede tot en met vijfde lid][ref4], niet van toepassing.

      2 In een geval als bedoeld in het eerste lid:

      a. wordt het voorschot bij de beschikking tot subsidieverlening vastgesteld op het bedrag dat op grond van
      [artikel 12, zesde lid][ref5], ten hoogste kan worden uitbetaald, en

      b. worden bij de aanvraag tot subsidievaststelling een aankoopfactuur en een betalingsbewijs gevoegd.


