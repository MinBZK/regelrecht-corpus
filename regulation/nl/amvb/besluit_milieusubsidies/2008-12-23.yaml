  - number: '15'
    text: |-
      1 Op een aanvraag tot subsidieverlening en op een aanvraag tot verlening van een voorschot beslist Onze Minister:

      a. binnen vier maanden na ontvangst van die aanvraag, indien op de beoordeling van de aanvraag een systeem van
      toepassing is als bedoeld in [artikel 5, tweede lid, onderdeel a][ref1];

      b. binnen vier maanden na de sluitingsdatum voor de indiening van de aanvraag, indien op de beoordeling van de
      aanvraag een systeem van toepassing is als bedoeld in [artikel 5, tweede lid, onderdeel b][ref2].

      2 Op een aanvraag tot subsidievaststelling beslist Onze Minister binnen vier maanden na ontvangst van die aanvraag.

      3 Indien de activiteit niet is uitgevoerd, beslist Onze Minister binnen vier maanden na:

      a. de ontvangst van de mededeling van de subsidie-ontvanger dat de activiteit niet is uitgevoerd, of

      b. de constatering door Onze Minister dat de activiteit niet of niet binnen de daarvoor gestelde termijn is
      uitgevoerd.

      4 Indien een beslissing vanwege de vereiste goedkeuring van de Commissie, bedoeld in [artikel 8, eerste lid][ref3],
      niet kan worden genomen binnen de termijn die is genoemd in het eerste, tweede of derde lid, onderdeel a, stelt
      Onze Minister de aanvrager daarvan in kennis en noemt daarbij een termijn waarbinnen de beslissing wel tegemoet kan
      worden gezien.


      [ref1]: https://wetten.overheid.nl/BWBR0010065#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0010065#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0010065#Artikel8
