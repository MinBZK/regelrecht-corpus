  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 19 augustus 1998,
    nr. MJZ 98079022, Centrale Directie Juridische Zaken, Afdeling Wetgeving;


    Gelet op artikel 15.13, eerste en tweede lid, van de Wet milieubeheer;


    De Raad van State gehoord (advies van 9 oktober 1998, nr. W08.98.0402);


    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van
    2 december 1998, nr. MJZ 98117988, Centrale Directie Juridische Zaken, Afdeling Wetgeving;


    Hebben goedgevonden en verstaan:
