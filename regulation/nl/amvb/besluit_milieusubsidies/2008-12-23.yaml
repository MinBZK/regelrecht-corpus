        artikel: '15.13'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '15.13'
  - number: '2'
    text: >-
      1 In dit besluit en in programma's wordt verstaan onder subsidiabele kosten: kosten die voor subsidiëring in
      aanmerking komen krachtens het betrokken programma dan wel, indien subsidie wordt verstrekt zonder programma,
      krachtens de beschikking tot subsidieverlening onderscheidenlijk de beschikking tot subsidievaststelling.


      2 Bij de bepaling van de subsidiabele kosten wordt een winstopslag ten behoeve van de subsidie-ontvanger buiten
      beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0010065/2008-12-23#Artikel2
  - number: '3'
    text: |-
      1 Op elke subsidie verstrekt krachtens een programma onderscheidenlijk het tweede lid zijn de
      [artikelen 5 tot en met 15][ref1] van toepassing.

      2 Onze Minister kan voor activiteiten op het gebied van het milieubeheer in incidentele gevallen ook subsidie
      verstrekken zonder programma. Van deze bevoegdheid wordt geen mandaat verleend.

      3 Terzake van een subsidie als bedoeld in het tweede lid, wordt in [artikel 6, eerste lid, aanhef][ref2], in plaats
      van «programma» gelezen «beschikking tot subsidieverlening» en wordt in [artikel 6, eerste lid, onderdeel c][ref3],
      in plaats van «het programma» gelezen: de beschikking tot subsidieverlening.


      [ref1]: https://wetten.overheid.nl/BWBR0010065#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0010065#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0010065#Artikel6
