articles:
  - number: '1'
    text: |-
      In dit besluit en in een ministeriële regeling krachtens
      [artikel 15.13, eerste, tweede of derde lid, van de Wet milieubeheer][ref1], wordt verstaan onder:

      a. liquiditeitsbehoefte: behoefte van een subsidie-ontvanger aan liquide middelen ten behoeve van het verrichten
      van de te subsidiëren activiteit, gedurende het tijdvak waarvoor subsidie wordt verleend;

      b. programma: ministeriële regeling krachtens
      [artikel 15.13, eerste, tweede of derde lid, van de Wet milieubeheer][ref2], of onderdeel daarvan;

      c. voorschot: vooruitbetaling door Onze Minister op een verleende subsidie;

      d. Commissie: Commissie van de Europese Gemeenschappen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15.13
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel15.13
    url: https://wetten.overheid.nl/BWBR0010065/2008-12-23#Artikel1
    references:
