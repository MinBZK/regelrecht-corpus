  - number: 14a
    text: |-
      Indien de subsidie-ontvanger een gemeente, een provincie of een regionaal openbaar lichaam op grond van
      [artikel 104 van de Wet gemeenschappelijke regelingen][ref1] is, zijn de [artikelen 10][ref2], [13][ref3] en
      [14][ref4] niet van toepassing.


