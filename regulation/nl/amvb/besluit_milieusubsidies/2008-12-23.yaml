  - number: '17'
    text: |-
      1 Onze Minister kan in een programma of in een beschikking op grond van [artikel 3, tweede lid][ref1],
      voor nader door hem aan te wijzen experimenten subsidie verstrekken en daarbij afwijken van de
      [artikelen 10 tot en met 15][ref2]. Van deze bevoegdheid wordt geen mandaat verleend. Elk experiment geldt voor een
      tevoren door Onze Minister vast te stellen periode.

      2 Onze Minister kan ook na afsluiting van een experiment blijven afwijken van de in het eerste lid genoemde
      artikelen, voor zover het subsidie-ontvangers betreft, die tijdens de duur van het experiment subsidie ontvingen
      met toepassing van het eerste lid en zolang een door hem noodzakelijk geoordeelde wijziging van dit besluit nog
      niet van kracht is geworden en in werking is getreden.

      3 Binnen een jaar na afsluiting van het experiment beslist Onze Minister of een wijziging van dit besluit naar zijn
      oordeel noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0010065#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010065#Artikel10
