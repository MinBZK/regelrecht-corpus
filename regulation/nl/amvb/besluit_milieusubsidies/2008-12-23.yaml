      1 Dit besluit treedt in werking met ingang van 1 januari 1999.


      2 Indien het Staatsblad waarin dit besluit wordt geplaatst wordt uitgegeven op of na 4 december 1998, treedt het
      besluit in werking met ingang van de dag waarop vier weken zijn verstreken sedert de dag van uitgifte van het
      Staatsblad waarin het wordt geplaatst, en werkt het terug tot en met 1 januari 1999.
