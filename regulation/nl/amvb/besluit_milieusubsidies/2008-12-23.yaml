  - number: '13'
    text: |-
      1 Zolang geen aanvraag tot subsidievaststelling als bedoeld in [artikel 14, eerste lid][ref1], is ingediend, dient
      de subsidie-ontvanger tenminste één maal per jaar doch uiterlijk op een door Onze Minister te bepalen tijdstip, in:

      a. een geactualiseerd overzicht van de activiteit waarvoor subsidie is verleend;

      b. een weergave van de stand van zaken tot dusverre, met inbegrip van de gemaakte kosten en de besteding van de
      verleende voorschotten;

      c. indien de gemaakte kosten naar verwachting 10 procent of meer afwijken van de begrotingspost: een toelichting
      daarop, en

      d. voor zover nog voorschotten worden verleend:

      1°. een bijgestelde tijdplanning, of

      2°. een raming van de liquiditeitsbehoefte gedurende het komende jaar.

      2 De indeling en de mate van detaillering van de te verstrekken gegevens, bedoeld in het eerste lid, onderdelen a,
      b en c, moeten in overeenstemming zijn met de aanvraag op basis waarvan subsidie is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0010065#Artikel14
    url: https://wetten.overheid.nl/BWBR0010065/2008-12-23#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0010065
        artikel: '14'
        hoofdstuk: '6'
  - number: '14'
    text: |-
      1 Tenzij de activiteit niet is uitgevoerd, wordt de aanvraag tot subsidievaststelling ingediend binnen de
      navolgende termijn na afloop van de activiteit of het tijdvak waarvoor subsidie is verleend:

      a. tien maanden, ingeval de subsidie-ontvanger een rechtspersoon is, die krachtens publiekrecht is ingesteld;

      b. zes maanden, in andere gevallen dan bedoeld in onderdeel a.

      2 De subsidie-ontvanger voegt bij de aanvraag tot subsidievaststelling:

      a. een verslag omtrent het verloop, de uitvoering en de resultaten van de activiteit, waaruit blijkt dat hij aan de
      verplichtingen heeft voldaan;

      b. een financiële verantwoording;

      c. indien de gemaakte kosten 10 procent of meer afwijken van de begrotingspost: een toelichting daarop, en

      d. indien de subsidie € 50 000 of meer bedraagt: een verklaring van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1].

      3 Indien een beschikking tot subsidieverlening is gegeven, geldt voor de financiële verantwoording, bedoeld in het
      tweede lid, onderdeel b, dat de indeling en mate van detaillering in overeenstemming moeten zijn met de begroting
      op basis waarvan subsidie is verleend.

      4 Indien geen beschikking tot subsidieverlening is gegeven, is [artikel 11, tweede lid, onderdelen b, f en g][ref2],
      van toepassing op de aanvraag van de beschikking tot subsidievaststelling, onverminderd het tweede lid.

      5 Het tweede lid, onderdelen b, c en d, is niet van toepassing op een subsidie waarbij het niet van belang is
      of de subsidiabele kosten met inachtneming waarvan de hoogte van de subsidie is verleend, ook daadwerkelijk zijn
      gerealiseerd.

      6 Indien de activiteit niet is uitgevoerd, kan op aanvraag of ambtshalve een beschikking tot subsidievaststelling
      worden gegeven. Op een dergelijke aanvraag zijn het tweede en derde lid niet van toepassing.

      7 Onze Minister bevestigt de ontvangst van de aanvraag schriftelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
      [ref2]: https://wetten.overheid.nl/BWBR0010065#Artikel11
    url: https://wetten.overheid.nl/BWBR0010065/2008-12-23#Artikel14
