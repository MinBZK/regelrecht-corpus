articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. wet: de [Wet toezicht effectenverkeer 1995][ref1];

      b. uitgevende instelling: een onderneming of instelling te wier laste effecten zijn of worden uitgegeven;

      c. prospectus: een prospectus als bedoeld in [artikel 3, tweede lid, onder ][ref2];

      d. accountant: een accountant als bedoeld in [artikel 393, eerste lid, van boek 2 van het Burgerlijk Wetboek][ref3],
      die niet in dienstbetrekking staat tot de desbetreffende onderneming of instelling;

      e. jaarrekening: de balans en de winst- en verliesrekening met de toelichting;

      f. toezichthoudende autoriteit:

        - Onze Minister of een rechtspersoon waaraan ingevolge [artikel 40 van de wet][ref4] taken en bevoegdheden zijn
      overgedragen voor zover het de taken en bevoegdheden betreft.
        - De Nederlandse Bank N.V., voor zover het de bevoegdheid uit hoofde van [hoofdstuk 4][ref5] betreft tot het
      stellen van regels met betrekking tot de financiële waarborgen, de bedrijfsvoering en informatieverstekking voor
      zover noodzakelijk voor het toezicht op financiële waarborgen.

      g. vast bod: een openbaar bod dat de geboden prijs of ruilverhouding vermeldt, niet zijnde een partieel bod;

      h. partieel bod: een openbaar bod dat de geboden prijs of ruilverhouding vermeldt, strekkende tot verwerving van
      een gedeelte van de door de doelvennootschap uitgegeven effecten;

      i. tenderbod: een openbaar bod waarmee de rechthebbenden van de effecten worden uitgenodigd om deze effecten tegen
      een door de rechthebbenden zelf te noemen tegenprestatie aan de bieder aan te bieden;

      j. doelvennootschap: de instelling te wier laste de effecten waarop het openbaar bod betrekking heeft, zijn
      uitgegeven;

      k. openbare mededeling: een mededeling als bedoeld in [artikel 9a][ref6];

      l. aanmeldingstermijn: de periode gedurende welke de effecten waarop een bod betrekking heeft, kunnen worden
      aangemeld.


