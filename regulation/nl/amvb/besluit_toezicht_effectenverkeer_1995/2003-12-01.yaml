  - number: '6'
    text: |-
      1 Alle nieuwe feiten die zich voordoen of worden geconstateerd tussen het tijdstip van vaststelling van een
      prospectus en het tijdstip waarop de desbetreffende aanbieding bij uitgifte eindigt en die van belang kunnen zijn
      voor de beoordeling van het vermogen, de financiële positie, het resultaat en de vooruitzichten van de uitgevende
      instelling en van de rechten en verplichtingen die aan de effecten zijn verbonden, alsmede onvolledigheden,
      onnauwkeurigheden of onjuistheden in het prospectus, worden vermeld of gecorrigeerd in een document dat ter
      aanvulling van het prospectus algemeen verkrijgbaar wordt gesteld. Dit document wordt vóór het tijdstip waarop het
      algemeen verkrijgbaar wordt gesteld aan de toezichthoudende autoriteit overgelegd en onverwijld bij het prospectus
      gevoegd. Vanaf dat moment maakt het document deel uit van het prospectus.

      2 Indien minder dan twaalf maanden voor het tijdstip waarop een aanbieding bij uitgifte wordt gedaan een prospectus
      algemeen verkrijgbaar is gesteld dat voldeed aan de vereisten van [artikel 2][ref1] onderscheidenlijk [3][ref2],
      kan ter zake van de aanbieding worden volstaan met een document als bedoeld in het eerste lid. Dit document mag
      evenwel slechts algemeen verkrijgbaar worden gesteld tezamen met of onder uitdrukkelijke verwijzing naar het in de
      eerste volzin bedoelde prospectus.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007708#Artikel3
