  - number: '20'
    text: |-
      Een effecteninstelling legt, voor zover op haar van toepassing, de volgende gegevens aan de toezichthoudende
      autoriteit over:

      a. een verklaring omtrent de identiteit en de antecedenten van de personen, bedoeld in [artikel 10][ref1], alsmede
      gegevens en bescheiden op basis waarvan de toezichthouder kan beoordelen of deze personen voldoen aan de in dat
      artikel bedoelde vereisten;

      b. een verklaring omtrent de identiteit van de houders van een gekwalificeerde deelneming in de effecteninstelling,
      alsmede omtrent de omvang van hun deelneming, voor zover deze gegevens de effecteninstelling bekend zijn;

      c. een verklaring van een accountant ten bewijze dat aan de [artikelen 12][ref2] en [13, eerste lid][ref3], is
      voldaan;

      d. een beschrijving van de systemen, bedoeld in [artikel 13, derde lid][ref4];

      e. een beschrijving van de maatregelen, bedoeld in [artikel 14, tweede lid][ref5];

      f. een beschrijving van de regelingen, bedoeld in [artikel 16, eerste lid][ref6];

      g. een beschrijving van de in [artikel 17, eerste lid][ref7], bedoelde administratieve organisatie, interne
      controleprocedures, registratie en systemen;

      h. een beschrijving van de in [artikel 17a][ref8] bedoelde maatregelen;

      i. de gegevens omtrent de effecteninstelling die ingevolge wettelijk voorschrift in het handelsregister moeten
      worden opgenomen;

      j. de algemene voorwaarden die op overeenkomsten met cliënten van toepassing zijn;

      k. een opgave van de naar soort onderscheiden diensten die de effecteninstelling als effectenbemiddelaar of
      vermogensbeheerder aanbiedt of verricht;

      l. een opgave van de naar soort onderscheiden effecten waarop de diensten betrekking hebben;

      m. een opgave van alle andere dan de onder *k* bedoelde beroeps- of bedrijfsmatige werkzaamheden van de
      effecteninstelling, naar soort onderscheiden;

      n. een opgave van de categorie of categorieën personen waaraan onderscheidenlijk waarvoor de effecteninstelling als
      effectenbemiddelaar of vermogensbeheerder diensten aanbiedt of verricht, waarbij onderscheid wordt gemaakt tussen
      personen die beroeps- of bedrijfsmatig handelen of beleggen in effecten en overige personen;

      o. een opgave van de naam en het adres van het hoofdkantoor van iedere andere effecteninstelling namens welke de
      in de aanhef bedoelde effecteninstelling diensten aanbiedt of verricht, alsmede, in voorkomend geval, van de plaats
      waar die andere effecteninstelling is gevestigd;

      p. een beschrijving van de groep waarvan de effecteninstelling deel uitmaakt en van de plaats die zij daarbinnen
      inneemt;

      q. een opgave van de wijze waarop de diensten aan beleggers worden aangeboden; en

      r. andere gegevens en bescheiden die de toezichthouder naar zijn oordeel redelijkerwijs nodig acht in het belang
      van de beoordeling van de vergunningaanvraag.

      s. een programma van werkzaamheden, waarvan de vorm en inhoud voldoet aan door de toezichthouder te stellen regels.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0007708#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0007708#Artikel13
