        artikel: 24a
        hoofdstuk: V
        paragraaf: '1'
  - number: '18'
    text: |-
      1 Het hoofdkantoor van een in Nederland gevestigde effecteninstelling bevindt zich in Nederland. De personen die
      het dagelijks beleid van de effecteninstelling bepalen, verrichten hun werkzaamheden in verband daarmee vanuit
      dit hoofdkantoor.

      2 Het hoofdkantoor van een in een andere staat gevestigde effecteninstelling bevindt zich in die andere staat. De
      personen die het dagelijks beleid van het bijkantoor van de effecteninstelling in Nederland bepalen, verrichten hun
      werkzaamheden in verband daarmee vanuit dat bijkantoor.
    url: https://wetten.overheid.nl/BWBR0007708/2003-12-01#Artikel18
  - number: 18a
    text: |-
      1 Een effecteninstelling behoort niet tot een groep waarbinnen de formele of feitelijke zeggenschapsstructuur in
      zodanige mate ondoorzichtig is dat deze, naar het oordeel van de toezichthoudende autoriteit, een belemmering vormt
      voor het adequaat uitoefenen van toezicht op de effecteninstelling.

      2 Indien een effecteninstelling in een groep is verbonden met een natuurlijke persoon of rechtspersoon op wie,
      onderscheidenlijk waarop, het recht van een staat die geen lid-staat is, van toepassing is, mag het recht van
      die staat, naar het oordeel van de toezichthoudende autoriteit, niet een belemmering vormen voor het adequaat
      uitoefenen van toezicht op de effecteninstelling.
    url: https://wetten.overheid.nl/BWBR0007708/2003-12-01#Artikel18a
  - number: '19'
    text: |-
      De regels, bedoeld in de [artikelen 12][ref1], [13, eerste en vierde lid][ref2], [16, tweede lid][ref3] en
      [17, tweede lid][ref4], kunnen voor onderscheiden groepen effecteninstellingen verschillend zijn.


