  - number: 9q
    text: |-
      1 Indien een vast bod is uitgebracht roept de doelvennootschap, indien deze in Nederland is gevestigd, haar
      aandeelhouders op voor een na de openbare mededeling van de verkrijgbaarstelling van het biedingsbericht en ten
      minste acht dagen voor het einde van de aanmeldingstermijn te houden algemene vergadering van aandeelhouders ter
      bespreking van dat bod.

      2 De doelvennootschap stelt uiterlijk vier dagen voor de in het eerste lid bedoelde vergadering een bericht voor
      haar aandeelhouders verkrijgbaar dat ten minste inhoudt:

      a. een gemotiveerde standpuntbepaling van het bestuur;

      b. de gegevens omtrent het vermogen en de resultaten van de doelvennootschap – met inbegrip van de beschikbare
      gegevens omtrent het lopende boekjaar indien daarvan meer dan een kwartaal is verstreken – welke de aandeelhouders
      behoeven om zich een gefundeerd oordeel over het bod te kunnen vormen;

      c. andere gegevens die in het desbetreffende geval noodzakelijk zijn voor de adequate beoordeling van het bod door
      degene tot wie het bod zich richt;

      voor zover deze gegevens niet reeds zijn opgenomen in een tezamen met de bieder uitgegeven biedingsbericht.

      3 De verkrijgbaarstelling van het in het tweede lid bedoelde bericht wordt onverwijld door de doelvennootschap
      openbaar medegedeeld.

      4 In de in het eerste lid bedoelde vergadering verschaffen het bestuur en de raad van commissarissen alle voor de
      beoordeling van het bod van belang zijnde inlichtingen, tenzij een zwaarwegend belang van de doelvennootschap zich
      daartegen verzet.

      5 Indien voor het einde van de aanmeldingstermijn door een derde een openbaar bod op dezelfde effecten wordt
      uitgebracht, behoeft het bestuur niet opnieuw toepassing te geven aan het in de voorgaande ledenbepaalde, doch kan
      het volstaan met een openbare mededeling van zijn standpunt met betrekking tot het nieuwe bod.
    url: https://wetten.overheid.nl/BWBR0007708/2003-12-01#Artikel9q
  - number: 9r
    text: |-
      Indien een partieel bod of een tenderbod is uitgebracht deelt het bestuur van de doelvennootschap uiterlijk vier
      dagen voor het einde van de aanmeldingstermijn een gemotiveerde standpuntbepaling openbaar mede, voor zover deze
      niet reeds is opgenomen in een tezamen met de bieder uitgegeven biedingsbericht.
    url: https://wetten.overheid.nl/BWBR0007708/2003-12-01#Artikel9r
  - number: 9s
    text: |-
      1 Indien een vast bod of partieel bod uitsluitend of mede strekt tot overneming van effecten in ruil voor door de
      bieder uit te geven effecten tot een gezamenlijke nominale waarde van meer dan een kwart van het voor die uitgifte
      geplaatste kapitaal van de bieder, roept de bieder, indien deze een rechtspersoon is die aandelen uitgeeft en
      in Nederland is gevestigd, zijn aandeelhouders op voor een na de openbare mededeling van de verkrijgbaarstelling
      van het biedingsbericht en ten minste acht dagen voor het einde van de aanmeldingstermijn te houden algemene
      vergadering van aandeelhouders, ter bespreking van het bod.

      2 In de in het eerste lid bedoelde vergadering verschaffen het bestuur en de raad van commissarissen alle voor de
      beoordeling van het bod van belang zijnde inlichtingen, tenzij een zwaarwegend belang van de bieder zich daartegen
      verzet.

      3 Het eerste en tweede lid zijn niet van toepassing wanneer de bieder een nieuwe rechtspersoon is, welke in verband
      met het bod wordt opgericht.
    url: https://wetten.overheid.nl/BWBR0007708/2003-12-01#Artikel9s
  - number: 9t
    text: |-
      1 Indien van een vast bod de prijs of ruilverhouding openbaar wordt medegedeeld, deelt de bieder eventuele
      voorwaarden waarvan hij zijn verplichting tot nakoming van het bod afhankelijk stelt, uiterlijk gelijktijdig met
      het uitbrengen van die mededeling openbaar mede. De verplichting tot nakoming van het bod mag niet afhankelijk
      worden gesteld van een voorwaarde, waarvan de vervulling afhangt van de wil van de bieder.

      2 In afwijking van het eerste lid deelt de bieder, indien hij een of meer van de na te noemen voorwaarden wil
      stellen, deze uiterlijk gelijktijdig met de verkrijgbaarstelling van het biedingsbericht openbaar mede:

      a. de voorwaarde dat ten minste een in het biedingsbericht te bepalen waarde of aantal van de effecten voor het
      einde van de aanmeldingstermijn zal zijn aangemeld;

      b. de voorwaarde dat voor het einde van de aanmeldingstermijn geen openbare mededeling wordt gedaan, waaruit voor
      het eerst blijkt dat een derde een openbaar bod op dezelfde effecten voorbereidt of aankondigt dan wel het recht
      heeft verkregen of de toezegging heeft gedaan tot het nemen van door de doelvennootschap uit te geven effecten;

      c. de voorwaarde dat voor het einde van de aanmeldingstermijn zich geen feiten of omstandigheden voordoen die de
      bieder ten tijde van de openbare mededeling van de prijs of ruilverhouding niet bekend waren of hoefden te zijn en
      die van zodanig essentiële aard zijn dat in redelijkheid niet van de bieder verwacht kan worden dat deze het bod
      gestand doet.

      3 Zodra is komen vast te staan dat een door de bieder gestelde voorwaarde als bedoeld in het eerste lid of in het
      tweede lid, onder b of c, niet wordt vervuld, deelt de bieder dit onverwijld openbaar mede, alsmede zijn beslissing
      of op grond daarvan het bod wordt ingetrokken.

      4 Uiterlijk op de vijfde beursdag na het einde van de aanmeldingstermijn deelt de bieder openbaar mede of hij het
      bod gestand doet dan wel dat nog onzekerheid bestaat over de vervulling van een door hem gestelde voorwaarde, onder
      vermelding van de waarde of aantal van de ingevolge het bod aangemelde effecten en in geval van niet gestanddoening
      de reden daarvan.
    url: https://wetten.overheid.nl/BWBR0007708/2003-12-01#Artikel9t
  - number: 9u
    text: |-
      Indien een partieel bod of een tenderbod is uitgebracht, deelt de bieder uiterlijk op de vijfde beursdag na
      sluiting van de aanmeldingstermijn openbaar mede of hij het bod gestand doet.

      Bij gestanddoening vermeldt de openbare mededeling:

        - in geval van een partieel bod: het getal of percentage van de ingevolge dat bod aangemelde effecten.
      [Artikel 9h, vijfde lid][ref1], is van overeenkomstige toepassing;
        - in geval van een tenderbod: de waarde of het getal van de effecten dat ingevolge dat bod is aangeboden, alsmede
      het getal of percentage van de aanvaarde effecten en de daarvoor bepaalde prijs. Bij niet gestanddoening worden de
      redenen daarvan vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel9h
    url: https://wetten.overheid.nl/BWBR0007708/2003-12-01#Artikel9u
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 9h
        hoofdstuk: III_A
  - number: 9v
    text: |-
      De bieder en de doelvennootschap zenden alle ingevolge dit hoofdstuk door middel van een openbare mededeling
      door hen te publiceren stukken en mededelingen tijdig voor de openbare mededeling aan de toezichthoudende
      autoriteit, met dien verstande dat het biedingsbericht uiterlijk tien beursdagen voor de openbare mededeling van de
      verkrijgbaarstelling ervan aan de toezichthoudende autoriteit wordt gezonden.
    url: https://wetten.overheid.nl/BWBR0007708/2003-12-01#Artikel9v
  - number: '10'
    text: |-
      1 Een ieder die een effecteninstelling krachtens wet, statuten of reglementen vertegenwoordigt dan wel het
      dagelijks beleid van een effecteninstelling bepaalt, dient naar het oordeel van de toezichthoudende autoriteit
      voldoende deskundig te zijn in verband met de bedrijfsvoering van de effecteninstelling.

      2 De betrouwbaarheid van de in het eerste lid bedoelde personen, de personen die het dagelijks beleid van de
      effecteninstelling mede bepalen en de personen die rechtstreeks of middelijk bevoegd zijn de in het eerste lid
      bedoelde personen te benoemen of te ontslaan, dient naar het oordeel van de toezichthoudende autoriteit buiten
      twijfel te staan.
    url: https://wetten.overheid.nl/BWBR0007708/2003-12-01#Artikel10
  - number: '11'
    text: |-
      De houder van een gekwalificeerde deelneming in een effecteninstelling mag naar het oordeel van de toezichthoudende
      autoriteit op grond van die deelneming geen invloed hebben of kunnen hebben die in strijd is met een gezonde,
      prudente of een integere bedrijfsvoering van die instelling.
    url: https://wetten.overheid.nl/BWBR0007708/2003-12-01#Artikel11
  - number: '12'
    text: |-
      Een effecteninstelling beschikt over een minimum bedrag aan eigen vermogen, waarvan de hoogte en de samenstelling
      voldoen aan door de toezichthoudende autoriteit te stellen regels.
    url: https://wetten.overheid.nl/BWBR0007708/2003-12-01#Artikel12
  - number: '13'
    text: |-
      1 Onverminderd [artikel 12][ref1] beschikt een effecteninstelling over een toetsingsvermogen, waarvan de hoogte
      en de samenstelling voldoen aan door de toezichthoudende autoriteit te stellen regels met betrekking tot de
      solvabiliteit van effecteninstellingen.

      2 De regels, bedoeld in het eerste lid, kunnen uitsluitend betrekking hebben op:

      a. het toetsingsvermogen dat dient te worden aangehouden in verhouding tot:

      1°. de naar risicograad gewogen kredietuitzettingen, beleggingen en overige activa;

      2°. de naar risicograad gewogen verplichtingen buiten de balanstelling;

      3°. de rente-, wisselkoers en andere marktrisico's;

      4°. de deelnemingen in andere ondernemingen of instellingen;

      5°. de onder 1°, 2°, 3° of 4° vallende afzonderlijke posten, voor zover zij een bepaald percentage van de eigen
      middelen te boven gaan;

      b. de omvang, al dan niet in verhouding tot het toetsingsvermogen, van:

      1°. de kredietuitzettingen, beleggingen en overige activa;

      2°. de verplichtingen buiten de balanstelling;

      3°. de rente-, wisselkoers- en andere marktrisico's;

      4°. de deelnemingen in andere ondernemingen of instellingen.

      3 Een effecteninstelling die deel uitmaakt van een groep die geen kredietinstelling omvat als bedoeld in artikel
      1, eerste gedachtenstreepje, van [richtlijn nr. 2000/12/EG](32000L0012) van het Europees Parlement en de Raad
      van de Europese Unie van 20 maart 2000 betreffende de toegang tot en de uitoefening van de werkzaamheden van
      kredietinstellingen (PbEG L 126), voert systemen in voor de bewaking en beheersing van de bronnen van het
      eigen vermogen en van het vreemd vermogen van alle andere financiële instellingen, bedoeld in artikel 1, tweede
      gedachtenstreepje, van die richtlijn, binnen de groep.

      4 De toezichthoudende autoriteit kan regels stellen met betrekking tot de in het derde lid bedoelde systemen.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel12
    url: https://wetten.overheid.nl/BWBR0007708/2003-12-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: '12'
        hoofdstuk: IV
  - number: '14'
    text: |-
      1 Het dagelijks beleid van een effecteninstelling wordt door ten minste twee personen bepaald.

      2 Indien een effecteninstelling een natuurlijk persoon is kan de toezichthoudende autoriteit, in afwijking van
      het eerste lid, toestaan dat het dagelijks beleid alleen door die natuurlijke persoon wordt bepaald, mits deze
      naar het oordeel van de toezichthoudende autoriteit adequate maatregelen heeft genomen om anderszins de belangen
      te beschermen van de personen waaraan onderscheidenlijk waarvoor de effecteninstelling als effectenbemiddelaar of
      vermogensbeheerder diensten aanbiedt of verricht. De toezichthoudende autoriteit houdt bij het vaststellen van zijn
      oordeel rekening met de aard en omvang van de werkzaamheden van de effecteninstelling.

      3 Het tweede lid is van overeenkomstige toepassing op rechtspersonen en vennootschappen die door één natuurlijk
      persoon worden geleid.
    url: https://wetten.overheid.nl/BWBR0007708/2003-12-01#Artikel14
  - number: '16'
    text: |-
      1 Een effecteninstelling heeft met betrekking tot de effecten en gelden van cliënten regelingen getroffen om de
      rechten van die cliënten te beschermen en om te voorkomen dat die effecten en, voor zover de effecteninstelling
      geen kredietinstelling of een financiële instelling is waaraan een vergunning als bedoeld in [artikel 6][ref1] of
      [artikel 38 van de Wet toezicht kredietwezen 1992][ref2] onderscheidenlijk een verklaring van ondertoezichtstelling
      als bedoeld in [artikel 45 van die wet][ref3] is verleend, gelden door de effecteninstelling voor eigen rekening
      worden gebruikt.

      2 De toezichthoudende autoriteit kan regels stellen met betrekking tot de in het eerste lid bedoelde regelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0005792#Artikel45
    url: https://wetten.overheid.nl/BWBR0007708/2003-12-01#Artikel16
