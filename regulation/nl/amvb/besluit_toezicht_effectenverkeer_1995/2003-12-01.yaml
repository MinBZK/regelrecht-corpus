  - number: 9d
    text: |-
      1 In geval van een voorgenomen vast bod doet de bieder, in afwijking van het bepaalde in
      [artikel 9b, tweede lid, onderdeel d][ref1], geen openbare mededeling over de prijs of ruilverhouding, bedoeld in
      [artikel 9i, onder b][ref2], alvorens volledig uitvoering te hebben gegeven aan het tweede en derde lid, tenzij
      overeenstemming tussen de bieder en de doelvennootschap is bereikt, of de verwachting gerechtvaardigd is dat
      overeenstemming kan worden bereikt over het bod.

      2 De bieder stelt de doelvennootschap schriftelijk in kennis van zijn voornemen de prijs of ruilverhouding, bedoeld
      in [artikel 9i, onder b][ref3], voor het uit te brengen bod bekend te maken en nodigt de doelvennootschap uit om
      binnen zeven dagen na ontvangst van deze kennisgeving overleg te plegen over het voornemen van de bieder tot het
      doen van een bod, over de in het eerste lid bedoelde prijs of ruilverhouding, over de aan het voorgenomen bod ten
      grondslag liggende motieven en over de voornemens met betrekking tot het in verband daarmee te voeren beleid ten
      aanzien van de doelvennootschap en de met haar verbonden onderneming, alsmede over de wijze van financiering van
      het uit te brengen bod indien dit een prijs vermeldt.

      3 De bieder stelt, indien de doelvennootschap geen gebruik heeft gemaakt van de gelegenheid tot het plegen van
      het in het tweede lid bedoelde overleg of dit overleg niet tot overeenstemming heeft geleid, de doelvennootschap
      schriftelijk in kennis van de prijs of ruilverhouding, bedoeld in [artikel 9i, onder b][ref4], en van de motieven
      welke aan het voorgenomen bod ten grondslag liggen, en van de voornemens met betrekking tot het in verband daarmee
      te voeren beleid ten aanzien van de doelvennootschap en de met haar verbonden onderneming, alsmede van de wijze van
      financiering van het uit te brengen bod, indien dit een prijs vermeldt.

      4 De bieder en de doelvennootschap stellen, indien zij een openbare mededeling doen met betrekking tot het bod, de
      inhoud daarvan schriftelijk ter kennis van de doelvennootschap respectievelijk van de bieder, uiterlijk ten tijde
      van het doen van deze openbare mededeling.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel9b
