        paragraaf: '1'
  - number: 24a
    text: |-
      1 Een effecteninstelling voert een adequaat beleid ter zake van het tegengaan van verstrengeling van tegenstrijdige
      belangen. De effecteninstelling draagt er zorg voor dat dit beleid zijn neerslag vindt in organisatorische en
      administratieve procedures en maatregelen.

      2 De toezichthoudende autoriteit stelt regels vast met betrekking tot de minimumvoorwaarden waaraan het beleid en
      de procedures en maatregelen, bedoeld in het eerste lid, moeten voldoen.
    url: https://wetten.overheid.nl/BWBR0007708/2003-12-01#Artikel24a
  - number: 24b
    text: |-
      1 Een effecteninstelling voert een adequaat beleid dat ertoe strekt dat:

      a. betrokkenheid van de effecteninstelling bij strafbare feiten die het vertrouwen in de effecteninstelling of in
      de financiële markten in het algemeen schaden, wordt voorkomen;

      b. betrokkenheid van de effecteninstelling bij handelingen die anderszins in het maatschappelijk verkeer zodanig
      onaanvaardbaar zijn dat deze het vertrouwen in de effecteninstelling of in de financiële markten in het algemeen
      schaden, wordt voorkomen;

      c. niet wegens haar cliënten het vertrouwen in de effecteninstelling of in de financiële markten in het algemeen
      wordt geschaad.

      2 De effecteninstelling draagt er zorg voor dat het in het eerste lid bedoelde beleid zijn neerslag vindt in
      organisatorische en administratieve procedures en maatregelen.

      3 De toezichthoudende autoriteit stelt regels vast met betrekking tot de voorwaarden waaraan het beleid en de
      procedures en maatregelen, bedoeld in het eerste en tweede lid, ten minste moeten voldoen.
    url: https://wetten.overheid.nl/BWBR0007708/2003-12-01#Artikel24b
  - number: 24c
    text: |-
      De in [artikel 24b, tweede en derde lid][ref1], bedoelde procedures en maatregelen betreffen in ieder geval:

      a. de behandeling en administratieve vastlegging van incidenten die een ernstig gevaar vormen voor een integere
      bedrijfsvoering van de effecteninstelling, voorzover het betreft een gedraging van een personeelslid of van een
      persoon die het dagelijks beleid bepaalt dan wel mede bepaalt van de effecteninstelling, dan wel van een houder
      van een gekwalificeerde deelneming of van een natuurlijke persoon of rechtspersoon die werkzaamheden verricht ten
      behoeve van de effecteninstelling.

      b. de beoordeling, met het oog op de belangen van cliënten of toekomstige cliënten van de effecteninstelling, of de
      betrouwbaarheid van een personeelslid dat zij voornemens is te benoemen in een integriteitsgevoelige functie buiten
      twijfel staat. Onder integriteitsgevoelige functie wordt in dit verband verstaan:

      1º. een leidinggevende functie die is geplaatst direct onder het echelon van de bepalers en medebepalers van het
      dagelijks beleid van de effecteninstelling;

      2º. een functie waaraan overigens een bevoegdheid is verbonden die een wezenlijk risico bevat voor de integere
      bedrijfsvoering van de effecteninstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel24b
    url: https://wetten.overheid.nl/BWBR0007708/2003-12-01#Artikel24c
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 24b
        hoofdstuk: V
        paragraaf: '1'
  - number: 24d
    text: |-
      1 Een effecteninstelling onderzoekt, op verzoek van de toezichthoudende autoriteit, of in haar administratie
      bepaalde personen of instellingen voorkomen die naar het oordeel van Onze Minister, in verband met vermoede
      terroristische activiteiten of daarmee verband houdende activiteiten, de integriteit van de financiële sector
      kunnen schaden.

      2 Een effecteninstelling verstrekt de uitkomst van het in het eerste lid bedoelde onderzoek, binnen een door de
      toezichthoudende autoriteit vast te stellen termijn, aan de toezichthoudende autoriteit.
    url: https://wetten.overheid.nl/BWBR0007708/2003-12-01#Artikel24d
  - number: 24e
    text: |-
      Een effecteninstelling meldt aan de toezichthoudende autoriteit ten behoeve van het toezicht op de naleving van
      het bij en krachtens de [artikelen 24a tot en met 24e][ref1] bepaalde de door de toezichthoudende autoriteit
      noodzakelijk geachte gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel24a
    url: https://wetten.overheid.nl/BWBR0007708/2003-12-01#Artikel24e
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 24a
        hoofdstuk: V
        paragraaf: '1'
  - number: '25'
    text: |-
      1 Een effecteninstelling sluit met iedere cliënt een schriftelijke overeenkomst die de uitsluitende grondslag vormt
      voor de diensten die de effecteninstelling in de uitoefening van haar bedrijf voor de cliënt verricht.

      2 In de overeenkomst zijn ten minste bepaald:

      a. de rechten en verplichtingen van de cliënt en de effecteninstelling uit hoofde van de overeenkomst;

      b. de naar soort onderscheiden diensten die de effecteninstelling in het kader van de overeenkomst voor de cliënt
      zal verrichten;

      c. een specificatie van de eventuele beperkingen met betrekking tot de markten waarop effectentransacties ten
      behoeve van de cliënt zullen worden afgewikkeld;

      d. de naar soort onderscheiden kosten, anders dan de kosten ter zake van een aanbieding van effecten bij uitgifte,
      die aan de cliënt in rekening worden gebracht alsmede de aan die kosten ten grondslag liggende berekening;

      e. de wijze waarop instructies van de cliënt en berichten van de effecteninstelling worden verstrekt en
      geadministreerd;

      f. de wijze waarop gelden of effecten van de cliënt worden verrekend, gedeponeerd en geadministreerd;

      g. de wijze waarop over de rekeningen van de cliënt kan worden beschikt;

      h. de regelingen inzake de aansprakelijkheid van de effecteninstelling onderscheidenlijk de cliënt uit hoofde van
      de overeenkomst;

      i. een verklaring van de cliënt dat hij heeft kennis genomen van de informatie die de effecteninstelling krachtens
      dit besluit aan hem dient te verstrekken en dat hij zich bewust is van de risico’s die aan de belegging zijn
      verbonden;

      j. de regeling van toepasselijk recht en de wijze van beslechting van geschillen; en

      k. de omstandigheden waaronder de overeenkomst tussen de effecteninstelling en de cliënt een einde neemt, de
      omstandigheden waaronder de overeenkomst kan worden ontbonden en de wijze waarop op of na de datum van beëindiging
      nog lopende transacties worden afgewikkeld.

      3 Indien de overeenkomst betrekking heeft op vermogensbeheer is daarin tevens bepaald:

      a. de samenstelling van het beheerde vermogen naar effectensoort en de waarde van het te beheren vermogen ten tijde
      van het sluiten van de overeenkomst;

      b. de doelstellingen van de cliënt ter zake van het vermogensbeheer;

      c. een specificatie van de eventuele kwalitatieve en kwantitatieve beperkingen ten aanzien van de effecten of
      categorieën van effecten waarin mag worden belegd;

      d. de wijze waarop het beheer wordt gevoerd alsmede de betrokkenheid van de cliënt daarbij, daaronder een regeling
      van de machtiging aan de effecteninstelling; en

      e. de frequentie van rapportage aan de cliënt.

      4 De toezichthoudende autoriteit kan nadere regels stellen met betrekking tot de inhoud en het model van de
      overeenkomst, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007708/2003-12-01#Artikel25
  - number: '26'
    text: |-
      De [artikelen 24, aanhef en onder b en c][ref1], en [25][ref2] zijn niet van toepassing voor zover een
      effecteninstelling diensten aanbiedt aan of verricht voor personen die beroeps- of bedrijfsmatig handelen of
      beleggen in effecten.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0007708#Artikel25
    url: https://wetten.overheid.nl/BWBR0007708/2003-12-01#Artikel26
