  - number: '9'
    text: |-
      Een uitgevende instelling maakt zo spoedig mogelijk elk belangrijk nieuw feit betreffende de uitoefening
      van het bedrijf dat niet reeds openbaar is en waarvan een aanzienlijke invloed op de koers van de door die
      instelling uitgegeven effecten kan uitgaan, openbaar. Een afschrift van de openbaarmaking wordt terstond aan de
      toezichthoudende autoriteit overgelegd.
    url: https://wetten.overheid.nl/BWBR0007708/2003-12-01#Artikel9
  - number: 9a
    text: |-
      Waar ingevolge dit hoofdstuk een openbare mededeling is vereist, wordt daaraan voldaan door een mededeling in een
      landelijk verspreid dagblad. Indien onverwijld een openbare mededeling is vereist, wordt daaraan voldaan door een
      mededeling in een persbericht.
    url: https://wetten.overheid.nl/BWBR0007708/2003-12-01#Artikel9a
  - number: 9b
    text: |-
      1 Indien een openbaar bod wordt voorbereid of is aangekondigd, doen de bieder en de doelvennootschap, zodra zich
      een omstandigheid voordoet die ter bevordering van een gerechtvaardigde koersvorming van de door hen uitgegeven
      effecten een openbare mededeling noodzakelijk maakt, onverwijld een zodanige mededeling, ieder voor zover het hem
      of haar aangaat.

      2 Als omstandigheid, als bedoeld in het eerste lid, wordt in ieder geval aangemerkt:

      a. een zodanige stand van besprekingen ter voorbereiding van een openbaar bod, dat de verwachting gerechtvaardigd
      is dat overeenstemming kan worden bereikt;

      b. de verzending door de bieder van de kennisgeving, bedoeld in [artikel 9d, tweede lid][ref1],
      [9e, tweede lid][ref2], of [9f, tweede lid][ref3];

      c. een koersvorming of andere ontwikkeling welke erop kan wijzen dat het voeren van besprekingen over een openbaar
      bod of het eenzijdige voornemen tot het doen van een openbaar bod bekend is bij derden die van deze wetenschap
      gebruik kunnen maken;

      d. in geval van een vast bod, de definitieve vaststelling van de prijs of ruilverhouding, bedoeld in
      [artikel 9i, onder b][ref4];

      e. in geval van een partieel bod, de definitieve vaststelling van het getal of percentage van de effecten tot de
      verkrijging waarvan het bod strekt dan wel van de prijs of ruilverhouding, bedoeld in [artikel 9k, onder b][ref5];

      f. in geval van een tenderbod, de definitieve vaststelling van het getal of percentage van de effecten tot de
      verkrijging waarvan het bod strekt dan wel van de prijs, bedoeld in [artikel 9m, onder i][ref6];

      g. het besluit van de bieder om het openbaar bod, over de voorbereiding waarvan eerder een openbare mededeling is
      gedaan, niet uit te brengen;

      h. het door een doelvennootschap, ten aanzien waarvan eerder een openbare mededeling over de voorbereiding van een
      openbaar bod op haar effecten is gedaan, aan de bieder of aan een derde uitgeven van effecten of verschaffen van
      een recht tot het nemen van door de doelvennootschap uit te geven effecten;

      i. een openbare mededeling door een derde waaruit blijkt dat deze een openbaar bod op dezelfde effecten voorbereidt
      of uitbrengt.

      3 Vanaf het tijdstip waarop een openbare mededeling over het voorbereiden of uitbrengen van een openbaar bod is
      gedaan doen de bieder en de doelvennootschap, ieder met betrekking tot de door henzelf verrichte transacties of
      gesloten overeenkomsten, aan de toezichthoudende autoriteit opgave van de na dat tijdstip verrichte transacties
      in de effecten waarop het bod betrekking heeft, respectievelijk van met betrekking tot die transacties gesloten
      overeenkomsten, onder vermelding van de daarvoor geldende voorwaarden en van de omvang van de bestaande onderlinge
      kapitaaldeelnemingen, zowel direct als indirect. De opgave wordt telkens gedaan onverwijld nadat de betrokken
      transactie of overeenkomst tot stand is gekomen of bekend is geworden. Indien de bieder of de doelvennootschap
      met betrekking tot een door hem verrichte transactie in effecten deze transactie reeds heeft gemeld overeenkomstig
      [artikel 46b, eerste lid, van de wet][ref7], kan een melding van de transactie achterwege blijven.

      4 Het eerste tot en met derde lid zijn van toepassing tot en met de dag waarop een openbare mededeling is gedaan
      over gestanddoening of intrekking van het bod of waarop openbaar is medegedeeld dat een bod dat in voorbereiding
      was, niet zal worden uitgebracht.


