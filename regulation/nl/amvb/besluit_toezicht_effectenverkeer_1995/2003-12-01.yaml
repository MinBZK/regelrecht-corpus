  - number: 9g
    text: |-
      1 De bieder die een openbare mededeling heeft gedaan omtrent een omstandigheid als bedoeld in
      [artikel 9b, tweede lid, onder a of b][ref1], is gehouden binnen dertig dagen na deze mededeling:

      a. een openbaar bod uit te brengen dan wel in geval van een vast bod een openbare mededeling te doen die ten minste
      de prijs of ruilverhouding vermeldt;

      b. een besluit tot het niet-uitbrengen van het bod openbaar mede te delen; of

      c. onder opgave van redenen openbaar mede te delen dat niet binnen dertig dagen een bod of een besluit tot
      het niet-uitbrengen van het bod uitgebracht kan worden of dat geen openbare mededeling omtrent de prijs of
      ruilverhouding als bedoeld onder a kan worden gedaan, onder vermelding van een termijn waarop een besluit ten
      aanzien van het bod of een openbare mededeling omtrent de prijs of ruilverhouding verwacht kan worden.

      2 De bieder deelt zijn bod mede:

      a. in geval van een partieel bod door middel van een biedingsbericht, inhoudende de gegevens, bedoeld in
      [artikel 9k][ref2]. De verkrijgbaarstelling van het biedingsbericht wordt openbaar medegedeeld;

      b. in geval van een tenderbod door middel van een biedingsbericht, inhoudende de gegevens, bedoeld in
      [artikel 9m][ref3]. De verkrijgbaarstelling van het biedingsbericht wordt openbaar medegedeeld.

      3 Binnen zes weken na de openbare mededeling overeenkomstig het eerste lid, onder a, deelt de bieder zijn bod mede
      door middel van een biedingsbericht, inhoudende de gegevens, bedoeld in [artikel 9i][ref4]. De verkrijgbaarstelling
      van het biedingsbericht wordt openbaar medegedeeld.

      4 De toezichthoudende autoriteit kan de in het eerste en derde lid bedoelde termijn, op verzoek van de bieder
      verlengen.


