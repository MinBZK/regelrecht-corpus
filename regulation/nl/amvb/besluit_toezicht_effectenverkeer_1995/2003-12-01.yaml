  - number: 9o
    text: |-
      1 De bieder die een openbaar bod doet, stelt een aanmeldingstermijn.

      2 De aanmeldingstermijn vangt niet eerder aan dan op de eerste beursdag volgend op de openbare mededeling van de
      verkrijgbaarstelling van het biedingsbericht.

      3 De aanmeldingstermijn van een vast bod is, gerekend van de dag waarop de gelegenheid tot aanmelding is
      opengesteld tot en met de dag waarop de gelegenheid tot aanmelding wordt gesloten, niet korter dan twintig dagen
      indien het bod met instemming van de doelvennootschap wordt uitgebracht en niet korter dan dertig dagen indien het
      zonder zodanige instemming wordt uitgebracht.

      4 De aanmeldingstermijn van een partieel bod of van een tenderbod is, te rekenen vanaf de dag waarop de gelegenheid
      tot aanmelding is opengesteld, niet korter dan zeven dagen.

      5 Een verlenging van de aanmeldingstermijn, zodanig dat daardoor de verplichting tot bekendmaking van de al dan
      niet gestanddoening van het bod wordt opgeschort, vindt slechts plaats met inachtneming van de volgende bepalingen:

      a. rechthebbenden van effecten die vóór het einde van de oorspronkelijke termijn hun effecten ingevolge het bod
      hebben aangemeld kunnen tijdens de verlengingsperiode deze aanmelding intrekken;

      b. de verlenging wordt in geval van een vast bod uiterlijk op de derde beursdag en in geval van een partieel bod of
      een tenderbod uiterlijk op de tweede beursdag na het einde van de oorspronkelijke termijn openbaar medegedeeld met
      vermelding van de einddatum van de aldus verlengde termijn;

      c. de bieder deelt onverwijld andere gegevens die in het desbetreffende geval noodzakelijk zijn voor de adequate
      beoordeling van het bod door degene tot wie het bod zich richt, openbaar mede of stelt deze in een aanvullend
      biedingsbericht verkrijgbaar. De verkrijgbaarstelling van het biedingsbericht wordt openbaar medegedeeld.

      6 Na sluiting van de aanmeldingstermijn deelt de bieder iedere aanvaarding van effecten onverwijld openbaar mede
      doch in ieder geval niet later dan het moment van aanvang van de officiële beurshandel op de beursdag volgend op de
      dag van de bedoelde aanvaarding, indien ten tijde van die aanvaarding de aanmeldingstermijn van enig ander openbaar
      bod op dezelfde effecten nog niet is verstreken. Elke hiervoor bedoelde openbare mededeling houdt een opgave in van
      het aantal van de effecten ter zake waarvan de aanbieding op de desbetreffende dag is aanvaard.
    url: https://wetten.overheid.nl/BWBR0007708/2003-12-01#Artikel9o
  - number: 9p
    text: |-
      1 De bieder, de bestuurders en commissarissen van de bieder, indien deze een rechtspersoon is, en de bestuurders en
      commissarissen van de doelvennootschap verstrekken, tegelijk met de openbare mededeling van de verkrijgbaarstelling
      van het biedingsbericht, aan de toezichthoudende autoriteit een opgave van de transacties in effecten in de
      doelvennootschap, welke door hen, hun echtgenoten of geregistreerde partners, hun minderjarige kinderen en
      door rechtspersonen waarin deze personen de zeggenschap hebben, zijn verricht in de zes maanden voorafgaande
      aan de eerste openbare mededeling inzake de prijs of ruilverhouding, bedoeld in [artikel 9i, onder b][ref1],
      inzake de prijs of ruilverhouding, bedoeld in [artikel 9k, onder b][ref2], dan wel inzake de prijs bedoeld in
      [artikel 9m onder i][ref3]. Tevens verstrekken zij indien het bod uitsluitend of mede strekt tot overneming van
      effecten in ruil voor effecten uit te geven door de bieder aan de toezichthoudende autoriteit een opgave van de
      transacties in door de bieder uitgegeven effecten, welke door hen, hun echtgenoten of geregistreerde partners,
      hun minderjarige kinderen en door rechtspersonen waarin deze personen de zeggenschap hebben zijn verricht in
      de zes maanden voorafgaande aan de eerste openbare mededeling inzake de prijs of ruilverhouding bedoeld in
      [artikel 9i onder b][ref4], inzake de prijs of ruilverhouding bedoeld in [artikel 9k, onder b][ref5], dan wel
      inzake de prijs, bedoeld in [artikel 9m, onder i][ref6].

      2 De bieder, de bestuurders en commissarissen van de bieder, indien deze een rechtspersoon is, en de bestuurders
      en commissarissen van de doelvennootschap verstrekken voorts tegelijk met de publicatie van het biedingsbericht,
      aan de toezichthoudende autoriteit een gespecificeerde opgave van het aantal en de soort van de door de
      doelvennootschap uitgegeven effecten welke door hen, hun echtgenoten of geregistreerde partners, hun minderjarige
      kinderen en door rechtspersonen waarin deze personen de zeggenschap hebben, worden gehouden.

      3 Indien een bestuurder of commissaris van de doelvennootschap met betrekking tot een in het eerste lid genoemde
      transactie reeds een melding heeft gedaan overeenkomstig [artikel 46b, derde lid, van de wet][ref7], kan een
      melding als bedoeld in het eerste lid achterwege blijven.


