  - number: '23'
    text: |-
      1 Het eigen vermogen en het toetsingsvermogen van een effecteninstelling voldoen aan de regels, bedoeld in de
      [artikelen 12][ref1] onderscheidenlijk [13, eerste lid][ref2].

      2 Een effecteninstelling brengt aan de toezichthoudende autoriteit verslag uit met betrekking tot het in het eerste
      lid bedoelde voorschrift volgens door de toezichthoudende autoriteit te stellen regels.

      3 Een effecteninstelling die niet voldoet aan het in het eerste lid bedoelde voorschrift brengt haar eigen vermogen
      en haar toetsingsvermogen binnen een door de toezichthoudende autoriteit te stellen termijn in overeenstemming
      met de regels, bedoeld in de [artikelen 12][ref3] onderscheidenlijk [13, eerste lid][ref4], en houdt zich aan door
      de toezichthoudende autoriteit te geven instructies met betrekking tot het verrichten van effectentransacties en
      handelingen die met die effectentransacties verband houden.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0007708#Artikel13
