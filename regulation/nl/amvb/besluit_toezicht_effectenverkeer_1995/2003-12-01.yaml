  - number: '8'
    text: |-
      1 Voor zover dit niet reeds voortvloeit uit [boek 2 van het Burgerlijk Wetboek][ref1] zijn op een uitgevende
      instelling het tweede tot en met vierde lid van toepassing.

      2 Een accountant onderzoekt of de jaarrekening het in [artikel 7, derde lid][ref2], bedoelde inzicht geeft. De
      bevindingen van de accountant worden in een verklaring neergelegd die in haar geheel bij de jaarrekening wordt
      gevoegd.

      3 Indien de halfjaarcijfers door een accountant zijn onderzocht, is het tweede lid van overeenkomstige toepassing.
      Indien dit niet het geval is, wordt hiervan uitdrukkelijk in een verklaring bij de halfjaarcijfers melding gemaakt.

      4 In afwijking van het tweede en derde lid kunnen de jaarrekening en de halfjaarcijfers van een uitgevende
      instelling die haar zetel niet in Nederland heeft, worden onderzocht door een deskundige die ingevolge het recht
      van de staat waar de uitgevende instelling haar zetel heeft, bevoegd is een verklaring af te geven omtrent de
      getrouwheid van deze stukken.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0007708#Artikel7
    url: https://wetten.overheid.nl/BWBR0007708/2003-12-01#Artikel8
