  - number: '22'
    text: |-
      1 Een effecteninstelling meldt aan de toezichthoudende autoriteit iedere voorgenomen wijziging in:

      a. het aantal en de identiteit van de personen, bedoeld in [artikel 10][ref1];

      b. de systemen, bedoeld in [artikel 13, derde lid][ref2];

      c. de maatregelen, bedoeld in [artikel 14, tweede lid][ref3];

      d. de regelingen, bedoeld in [artikel 16, eerste lid][ref4];

      e. de in [artikel 17, eerste lid][ref5], bedoelde administratieve organisatie, interne controleprocedures,
      registratie en systemen;

      f. de maatregelen, bedoeld in [artikel 17a][ref6];

      g. de naam en het adres van het hoofdkantoor van de effecteninstelling, en, indien zij niet in Nederland is
      gevestigd, het adres van het bijkantoor, alsmede, in voorkomend geval, de plaats waar zij is gevestigd; en

      h. de samenstelling en de formele en feitelijke zeggenschapsstructuur van de groep waartoe de effecteninstelling
      behoort.

      2 De melding, bedoeld in het eerste lid, geschiedt onder overlegging van de gegevens, bedoeld in
      [artikel 20, onder ][ref7], alsmede, indien de toezichthoudende autoriteit daarom verzoekt, van andere gegevens
      en bescheiden die de toezichthoudende autoriteit naar zijn oordeel redelijkerwijs nodig acht in het belang van de
      beoordeling van de melding.

      3 Ten aanzien van een voorgenomen wijziging als bedoeld in het eerste lid zijn de
      [artikelen 14 tot en met 18][ref8]*a* van overeenkomstige toepassing.

      4 Een wijziging als bedoeld in het eerste lid wordt niet doorgevoerd indien de toezichthoudende autoriteit het
      voornemen daartoe afwijst binnen zes weken na ontvangst van de melding, bedoeld in het eerste lid, of, indien de
      toezichthoudende autoriteit overeenkomstig het tweede lid om nadere gegevens en bescheiden heeft verzocht, na de
      ontvangst van die informatie.

      5 Indien zich een wijziging van de antecedenten, bedoeld in [artikel 20, onder a][ref9], dan wel van het
      programma van werkzaamheden, bedoeld in [artikel 20, onder s][ref10], voordoet, stelt de effecteninstelling de
      toezichthoudende autoriteit daarvan onverwijld schriftelijk in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0007708#Artikel13
