  - number: 22a
    text: |-
      1 Een effecteninstelling behoort niet tot een groep waarbinnen de formele of feitelijke zeggenschapsstructuur in
      zodanige mate ondoorzichtig is dat deze, naar het oordeel van de toezichthoudende autoriteit, een belemmering vormt
      voor het adequaat uitoefenen van toezicht op de effecteninstelling.

      2 Indien een effecteninstelling in een groep is verbonden met een natuurlijke persoon of een rechtspersoon op
      wie, onderscheidenlijk waarop, het recht van een staat die geen lid-staat is, van toepassing is, mag het recht
      van die staat, naar het oordeel van de toezichthoudende autoriteit, niet een belemmering vormen voor het adequaat
      uitoefenen van toezicht op de effecteninstelling.
    url: https://wetten.overheid.nl/BWBR0007708/2003-12-01#Artikel22a
  - number: 22b
    text: |-
      1 Een ieder die een effecteninstelling krachtens wet, statuten of reglementen vertegenwoordigt dan wel het
      dagelijks beleid van een effecteninstelling bepaalt, dient naar het oordeel van de toezichthoudende autoriteit
      voldoende deskundig te zijn in verband met de bedrijfsvoering van de effecteninstelling.

      2 De betrouwbaarheid van de in het eerste lid bedoelde personen, de personen die het dagelijks beleid van de
      effecteninstelling mede bepalen en de personen die rechtstreeks of middellijk bevoegd zijn de in het eerste lid
      bedoelde personen te benoemen of te ontslaan, dient naar het oordeel van de toezichthoudende autoriteit buiten
      twijfel te staan.
    url: https://wetten.overheid.nl/BWBR0007708/2003-12-01#Artikel22b
  - number: 22c
    text: |-
      1 De accountant, bedoeld in [artikel 11a, tweede lid, van de wet][ref1], verstrekt op grond van het vijfde lid van
      dat artikel aan de toezichthoudende autoriteit zo spoedig mogelijk alle inlichtingen die redelijkerwijs nodig zijn
      ten behoeve van het toezicht op de naleving van de wet over de volgende onderwerpen:

      a. het accountantsverslag aan de directie en de raad van commissarissen;

      b. de *management letter*;

      c. correspondentie tussen de accountant en de effecteninstelling die rechtstreeks betrekking heeft op de
      accountantsverklaring bij de jaarrekening en op de maand- en de kwartaalstaat van de effecteninstelling.

      2 Indien de accountant, bedoeld in het eerste lid, schriftelijk inlichtingen verstrekt aan de toezichthoudende
      autoriteit over de in het voorgaande lid genoemde onderwerpen, zendt hij onverwijld aan de effecteninstelling een
      afschrift van de stukken en van de begeleidende brief.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel11a
    url: https://wetten.overheid.nl/BWBR0007708/2003-12-01#Artikel22c
