  - number: '34'
    text: |-
      1 Een instelling houdt zich aan door de toezichthoudende autoriteit te stellen regels met betrekking tot de in
      [artikel 16, eerste lid][ref1], bedoelde regelingen, met betrekking tot de in [artikel 17, eerste lid][ref2],
      bedoelde administratieve organisatie, interne controleprocedures en registratie en met betrekking tot de in
      [artikel 17a][ref3] bedoelde maatregelen.

      2 De regels, bedoeld in het eerste lid, worden door de toezichthoudende autoriteit na overleg met de Nederlandsche
      Bank gesteld.

      3 Een instelling meldt aan de toezichthoudende autoriteit iedere voorgenomen wijziging in de in het eerste lid
      bedoelde regelingen, administratieve organisatie, interne controleprocedures, registratie en maatregelen, onder
      overlegging van de gegevens, bedoeld in [artikel 20, onder f, g, h onderscheidenlijk i][ref4], alsmede, indien de
      toezichthoudende autoriteit daarom verzoekt, van andere gegevens en bescheiden die de toezichthoudende autoriteit
      naar zijn oordeel redelijkerwijs nodig acht in het belang van de beoordeling van de melding.

      4 Ten aanzien van een voorgenomen wijziging als bedoeld in het derde lid is het eerste lid van overeenkomstige
      toepassing.

      5 Een wijziging als bedoeld in het derde lid wordt niet doorgevoerd indien de toezichthoudende autoriteit het
      voornemen daartoe afwijst binnen zes weken na ontvangst van de melding, bedoeld in het derde lid, of, indien
      de toezichthoudende autoriteit overeenkomstig het derde lid om nadere gegevens en bescheiden heeft verzocht, na
      ontvangst van die informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0007708#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0007708#Artikel17a
      [ref4]: https://wetten.overheid.nl/BWBR0007708#Artikel20
    url: https://wetten.overheid.nl/BWBR0007708/2003-12-01#Artikel34
