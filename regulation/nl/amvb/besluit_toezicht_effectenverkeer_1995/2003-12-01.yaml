        bwb_id: BWBR0007657
        artikel: '17'
  - number: 45a
    text: |-
      Een instelling als bedoeld in [artikel 18a, eerste lid, van de wet][ref1] houdt zich bij haar optreden op de
      effectenmarkten aan door de toezichthoudende autoriteit gestelde regels die ertoe strekken dat de instelling:

      a. interne voorschriften vaststelt inzake het omgaan met koersgevoelige informatie respectievelijk ten aanzien van
      privé beleggingstransacties van bestuurders en personeelsleden;

      b. zich onthoudt van koersmanipulatie en andere misleidende handelingen;

      c. belangenverstrengeling die te maken heeft met effectentransacties voorkomt;

      d. adequate controlemechanismen heeft ten behoeve van de naleving van de in de aanhef bedoelde regels;

      e. zorgdraagt voor het vastleggen van de in dit artikel bedoelde interne voorschriften, controlemechanismen en
      andere in dit kader getroffen voorzieningen in de administratieve organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel18a
    url: https://wetten.overheid.nl/BWBR0007708/2003-12-01#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: 18a
  - number: 45b
    text: |-
      1 Het bedrag van de boete, bedoeld in [artikel 48d, vijfde lid, van de wet][ref1], wordt bepaald op de wijze,
      voorzien in [bijlage B][ref2].

      2 De toezichthouder kan het bedrag van de boete lager stellen dan in de bijlage is bepaald, indien het bedrag van
      de boete in een bepaald geval op grond van bijzondere omstandigheden onevenredig hoog is.


