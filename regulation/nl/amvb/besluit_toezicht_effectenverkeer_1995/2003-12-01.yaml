        artikel: '45'
  - number: '17'
    text: |-
      1 Een effecteninstelling beschikt naar het oordeel van de toezichthoudende autoriteit over een goede
      administratieve organisatie, adequate interne controleprocedures en een deugdelijke registratie van de verrichte
      diensten, alsmede over systemen voor een adequate bewaking en beheersing van het risico met betrekking tot
      haar gehele bedrijf en over systemen om te allen tijde nauwkeurig haar financiële positie te berekenen. Deze
      organisatie, procedures, registratie en systemen moeten de toezichthoudende autoriteit in staat stellen na te gaan
      of de regels inzake de bedrijfsvoering en de financiële waarborgen worden nageleefd.

      2 De toezichthoudende autoriteit kan regels stellen met betrekking tot de in het eerste lid bedoelde
      administratieve organisatie, interne controleprocedures, registratie en systemen.
    url: https://wetten.overheid.nl/BWBR0007708/2003-12-01#Artikel17
  - number: 17a
    text: |-
      Een effecteninstelling beschikt over maatregelen, gericht op het bevorderen en handhaven van een integere
      bedrijfsvoering, die voldoen aan het bepaalde bij en krachtens de [artikelen 24a tot en met 24c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel24a
    url: https://wetten.overheid.nl/BWBR0007708/2003-12-01#Artikel17a
