  - number: 9j
    text: |-
      1 Een partieel bod is gericht tot alle rechthebbenden van de soorten effecten waarop het bod betrekking heeft.

      2 Aan alle rechthebbenden van dezelfde soort effecten wordt hetzelfde bod gedaan.

      3 De bieder heeft het recht het bod in te trekken indien voor het einde van de aanmeldingstermijn door een derde
      een openbaar bod op effecten van een of meer dezelfde soorten wordt uitgebracht of het voornemen daartoe openbaar
      wordt medegedeeld.

      4 De bieder kan zijn verplichting tot gestanddoening van het bod afhankelijk stellen van de aanbieding van een
      bepaald aantal of percentage van de effecten, onverminderd de bevoegdheid van de bieder het bod ook gestand te doen
      indien effecten tot een kleiner aantal of een geringer percentage zijn aangemeld.

      5 De bieder aanvaardt de aangeboden effecten proportioneel met hantering van een systematiek welke voldoet aan door
      de toezichthoudende autoriteit te stellen regels, voor zover de bieder bij aanvaarding van de aangeboden effecten
      direct of indirect meer dan 30% van het geplaatste kapitaal van de doelvennootschap gaat houden dan wel meer
      effecten worden aangeboden dan waarop het bod is gericht.

      6 De bieder treft een regeling met betrekking tot de levering en betaling van aangeboden effecten welke voldoet aan
      door de toezichthoudende autoriteit te stellen regels.

      7 Gedurende een jaar na de openbare mededeling van de verkrijgbaarstelling van het biedingsbericht is het de bieder
      niet toegestaan om effecten in de doelvennootschap te verwerven indien hij daardoor, direct of indirect, meer dan
      30% van het geplaatste kapitaal van de doelvennootschap gaat houden, tenzij:

      a. het partieel bod niet gestand wordt gedaan, of

      b. een derde na de verschijningsdatum een openbaar bod op effecten van dezelfde doelvennootschap uitbrengt, met
      dien verstande dat het verbod van kracht blijft ten aanzien van verwerving ingevolge een partieel bod of een
      tenderbod.
    url: https://wetten.overheid.nl/BWBR0007708/2003-12-01#Artikel9j
  - number: 9k
    text: |-
      Het biedingsbericht met betrekking tot een partieel bod houdt ten minste in:

      a. de naam van de bieder;

      b. het voorstel tot overneming van de effecten volgens een daarbij aan te geven prijs of ruilverhouding;

      c. de mededeling of met de doelvennootschap overleg over het bod is gevoerd en of dit overleg tot overeenstemming
      heeft geleid;

      d. de verklaring dat het bod is gericht tot alle rechthebbenden van de soorten effecten waarop het bod betrekking
      heeft;

      e. de verklaring dat aan alle rechthebbenden van dezelfde soort effecten hetzelfde bod wordt gedaan;

      f. een duidelijke motivering van de aangeboden prijs of ruilverhouding alsmede een mededeling over de wijze van
      financiering door de bieder indien het bod een prijs vermeldt;

      g. het getal of het percentage van iedere soort van de effecten uitgegeven door de doelvennootschap tot de
      verkrijging waarvan het bod strekt, met dien verstande dat na gestanddoening van het bod het gedeelte van het
      geplaatste kapitaal dat direct of indirect door de bieder wordt gehouden niet groter is dan 30%.

      h. de verklaring dat het bod, behoudens het bepaalde onder i, onvoorwaardelijk is en tevens dat het bod
      onherroepelijk is behoudens de bevoegdheid van de bieder om het recht te bedingen het bod in te trekken indien vóór
      het einde van de aanmeldingstermijn door een derde een openbaar bod op effecten van een of meer dezelfde soorten
      wordt uitgebracht of het voornemen daartoe openbaar wordt medegedeeld;

      i. de verklaring dat de bieder zijn verplichting tot gestanddoening afhankelijk stelt van de aanbieding, gedurende
      de aanmeldingstermijn van een bepaald aantal of percentage van de effecten, onverminderd de bevoegdheid van
      de bieder het bod ook gestand te doen indien effecten tot een kleiner aantal of een geringer percentage zijn
      aangemeld;

      j. de verklaring dat, in geval van gestanddoening, aanvaarding van aangeboden effecten – indien een groter aantal
      of een hoger percentage effecten wordt aangeboden dan de bieder gehouden dan wel bevoegd is te aanvaarden – zoveel
      mogelijk proportioneel zal geschieden, met hantering van een systematiek welke voldoet aan door de toezichthoudende
      autoriteit te stellen regels en welke eveneens in het biedingsbericht wordt bekendgemaakt;

      k. de aanmeldingstermijn;

      l. de omvang van de ten tijde van de openbare mededeling van de verkrijgbaarstelling van het biedingsbericht
      bestaande onderlinge kapitaaldeelnemingen, zowel direct als indirect, van de bieder en de doelvennootschap;

      m. een regeling met betrekking tot de levering en betaling van aangeboden effecten, welke regeling voldoet aan door
      de toezichthoudende autoriteit te stellen regels;

      n. de verklaring van de bieder dat na gestanddoening van het bod gedurende een jaar – te rekenen vanaf de dag
      waarop de verkrijgbaarstelling van het biedingsbericht openbaar is medegedeeld – rechtstreeks of middellijk geen
      openbaar bod zal worden uitgebracht, tenzij een derde binnen die periode een openbaar bod op de effecten van
      dezelfde doelvennootschap uitbrengt;

      o. andere gegevens die naar het oordeel van de toezichthoudende autoriteit in het desbetreffende geval noodzakelijk
      zijn voor de adequate beoordeling van het bod door degene tot wie het bod zich richt;

      p. de naam en functie van de natuurlijke personen dan wel de naam en zetel van de rechtspersonen die
      verantwoordelijk zijn voor het biedingsbericht of, in voorkomend geval, voor bepaalde gedeelten daarvan. In dit
      laatste geval worden deze gedeelten vermeld.

      Indien een rechtspersoon verantwoordelijk is voor het biedingsbericht of een gedeelte daarvan, worden tevens naam
      en functie vermeld van de natuurlijke personen die het beleid van deze rechtspersonen bepalen;

      q. een verklaring van de onder p bedoelde verantwoordelijke personen dat, voor zover hun redelijkerwijs bekend
      had kunnen zijn, de gegevens in het biedingsbericht of in het gedeelte waarvoor zij verantwoordelijk zijn, in
      overeenstemming zijn met de werkelijkheid en dat geen gegevens zijn weggelaten waarvan vermelding de strekking van
      het biedingsbericht zou wijzigen.
    url: https://wetten.overheid.nl/BWBR0007708/2003-12-01#Artikel9k
  - number: 9l
    text: |-
      1 Een tenderbod is gericht tot alle rechthebbenden van de soorten effecten waarop het bod betrekking heeft.

      2 Aan alle rechthebbenden van dezelfde soort effecten wordt hetzelfde bod gedaan.

      3 De bieder heeft het recht het bod in te trekken indien voor het einde van de aanmeldingstermijn door een derde
      een openbaar bod op effecten van een of meer dezelfde soorten wordt uitgebracht of het voornemen daartoe openbaar
      wordt medegedeeld.

      4 De bieder doet het bod gestand indien de beoogde verkrijging mogelijk is tegen een door de bieder in het
      biedingsbericht te vermelden prijs per aandeel.

      5 De bieder aanvaardt de effecten proportioneel met hantering van een systematiek welke voldoet aan door de
      toezichthoudende autoriteit te stellen regels, voor zover de bieder bij aanvaarding van de aangeboden effecten
      direct of indirect meer dan 30% van het geplaatste kapitaal van de doelvennootschap gaat houden dan wel meer
      effecten worden aangeboden dan waarop het bod is gericht.

      6 De bieder treft een regeling met betrekking tot de levering en betaling van aangeboden effecten welke voldoet aan
      door de toezichthoudende autoriteit te stellen regels.

      7 De bieder betaalt, bij gestanddoening van enig aanbod voor alle effecten van dezelfde soort dezelfde prijs,
      zijnde de hoogste prijs waartegen een effect van de desbetreffende soort is aangeboden.

      8 Gedurende een jaar na de verschijningsdatum van het biedingsbericht is het de bieder niet toegestaan om
      effecten in de doelvennootschap te verwerven, indien hij daardoor, direct of indirect, meer dan 30 procent van het
      geplaatste kapitaal van de doelvennootschap gaat houden, tenzij:

      a. het bod niet gestand wordt gedaan, of

      b. een derde na de verschijningsdatum een openbaar bod op effecten van dezelfde doelvennootschap uitbrengt, met
      dien verstande dat het verbod van kracht blijft ten aanzien van verwerving ingevolge een tenderbod of partieel bod.
    url: https://wetten.overheid.nl/BWBR0007708/2003-12-01#Artikel9l
  - number: 9m
    text: |-
      Het biedingsbericht met betrekking tot een tenderbod houdt ten minste in:

      a. de naam van de bieder;

      b. de uitnodiging tot het aanbieden van de effecten tegen een door de rechthebbenden van deze effecten te noemen
      prijs in contanten;

      c. de mededeling of met de doelvennootschap overleg over het bod is gevoerd en of dit overleg tot overeenstemming
      heeft geleid;

      d. de verklaring dat het bod is gericht tot alle rechthebbenden van de soorten effecten waarop het bod betrekking
      heeft;

      e. de verklaring dat aan alle rechthebbenden van dezelfde soort effecten hetzelfde bod wordt gedaan;

      f. een duidelijke motivering van het bod;

      g. het aantal of percentage van iedere soort van de effecten uitgegeven door de doelvennootschap waarvan de
      verkrijging wordt beoogd, met dien verstande dat na gestanddoening van het bod het gedeelte van het geplaatste
      kapitaal dat direct of indirect door de bieder wordt gehouden niet groter is dan 30%.

      h. de verklaring dat het tenderbod, behoudens het bepaalde onder i, onvoorwaardelijk is en tevens dat het bod
      onherroepelijk is behoudens de bevoegdheid van de bieder om het recht te bedingen het bod in te trekken indien
      vóór het einde van de aanmeldingstermijn door een derde een openbaar bod op effecten van een of meer van dezelfde
      soorten wordt uitgebracht of het voornemen daartoe openbaar wordt medegedeeld;

      i. de verklaring dat de bieder zich verbindt tot gestanddoening, indien de beoogde verkrijging mogelijk is tegen
      een door de bieder in het biedingsbericht te vermelden prijs per aandeel;

      j. de verklaring dat bij gestanddoening voor alle effecten van dezelfde soort dezelfde prijs zal worden betaald,
      zijnde de hoogste prijs waartegen de desbetreffende soort is aangeboden;

      k. de verklaring dat in geval van aanvaarding van tegen de prijs van aanvaarding aangeboden effecten – indien een
      groter aantal of een hoger percentage effecten zal zijn aangeboden dan de bieder gehouden dan wel bevoegd is te
      aanvaarden – zoveel mogelijk proportioneel zal geschieden met hantering van een systematiek welke voldoet aan door
      de toezichthoudende autoriteit te stellen regels en welke eveneens in het biedingsbericht wordt bekendgemaakt;

      l. de aanmeldingstermijn;

      m. de omvang van de ten tijde van de openbare mededeling van de verkrijgbaarstelling van het biedingsbericht
      bestaande onderlinge kapitaaldeelnemingen zowel direct als indirect, van de bieder en de doelvennootschap;

      n. een regeling met betrekking tot de levering en betaling van aangeboden effecten, welke regeling voldoet aan door
      de toezichthoudende autoriteit te stellen regels;

      o. de verklaring van de bieder dat na gestanddoening van het bod, gedurende een jaar – te rekenen vanaf de dag
      waarop de verkrijgbaarstelling van het biedingsbericht openbaar is medegedeeld – rechtstreeks of middellijk geen
      openbaar bod zal worden uitgebracht, tenzij een derde binnen die periode een openbaar bod op effecten van dezelfde
      doelvennootschap uitbrengt;

      p. andere gegevens die naar het oordeel van de toezichthoudende autoriteit noodzakelijk zijn voor de adequate
      beoordeling van het bod door degene tot wie het bod zich richt;

      q. de naam en functie van de natuurlijke personen dan wel de naam en zetel van de rechtspersonen die
      verantwoordelijk zijn voor het biedingsbericht of, in voorkomend geval, voor bepaalde gedeelten daarvan. In dit
      laatste geval worden deze gedeelten vermeld.

      Indien een rechtspersoon verantwoordelijk is voor het biedingsbericht of een gedeelte daarvan, worden tevens naam
      en functie vermeld van de natuurlijke personen die het beleid van deze rechtspersonen bepalen;

      r. een verklaring van de onder q bedoelde verantwoordelijke personen dat, voor zover hun redelijkerwijs bekend
      had kunnen zijn, de gegevens in het biedingsbericht of in het gedeelte waarvoor zij verantwoordelijk zijn, in
      overeenstemming zijn met de werkelijkheid en dat geen gegevens zijn weggelaten waarvan vermelding de strekking van
      het biedingsbericht zou wijzigen.
    url: https://wetten.overheid.nl/BWBR0007708/2003-12-01#Artikel9m
  - number: 9n
    text: |-
      Indien een vast bod of partieel bod uitsluitend of mede strekt tot overneming van effecten in ruil voor door de
      bieder uitgegeven effecten, houdt het biedingsbericht, onverminderd het verbod van [artikel 3 van de wet][ref1] en
      in aanvulling op de gegevens vereist ingevolge [artikel 9i][ref2] en [9k][ref3], tevens in:

      a. gegevens omtrent het vermogen en de resultaten van de bieder met inbegrip van de beschikbare gegevens over het
      lopende boekjaar, indien daarvan meer dan een kwartaal is verstreken;

      b. een gemotiveerde uiteenzetting omtrent de te verwachten voordelen van het bod en zo mogelijk een mededeling over
      dividendvooruitzichten van de bieder;

      c. eventuele voornemens inzake wijziging van de statuten van de bieder na gestanddoening van het bod;

      d. eventuele voornemens inzake de samenstelling van het bestuur en van de raad van commissarissen van de bieder na
      gestanddoening van het bod;

      e. het totale bedrag der eventuele vergoedingen aan de bestuurders en commissarissen van de bieder die bij
      gestanddoening van het bod zullen aftreden.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel3
