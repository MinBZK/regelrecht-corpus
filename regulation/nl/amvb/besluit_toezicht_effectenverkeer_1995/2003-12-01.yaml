  - number: '38'
    text: |-
      Een instelling die in de uitoefening van haar bedrijf effectentransacties en andere daarmee verband houdende
      handelingen verricht voor rekening van een cliënt, reikt aan die cliënt onverwijld een effectennota uit die voldoet
      aan door de toezichthoudende autoriteit te stellen regels met betrekking tot de gegevens die op de effectennota
      worden vermeld.
    url: https://wetten.overheid.nl/BWBR0007708/2003-12-01#Artikel38
  - number: '39'
    text: |-
      1 Een instelling die in de uitoefening van haar bedrijf vermogensbeheer verricht, stelt regelmatig aan iedere
      cliënt met wie zij een overeenkomst inzake vermogensbeheer heeft gesloten een opgave beschikbaar die een getrouw
      en volledig overzicht geeft van de samenstelling van het door de instelling voor die cliënt beheerde vermogen. Deze
      opgave bevat ten minste de volgende gegevens:

      a. de samenstelling naar effectensoort en de marktwaarde van het onder beheer zijnde vermogen; en

      b. de aan de cliënt in rekening gebrachte onderscheidenlijk te brengen kosten van beheer en overige kosten.

      2 De toezichthoudende autoriteit kan nadere regels stellen met betrekking tot de frequentie en het model van de
      opgave, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007708/2003-12-01#Artikel39
  - number: '40'
    text: |-
      1 Een instelling houdt zich aan door de toezichthoudende autoriteit te stellen regels met betrekking tot door de
      instelling te rapporteren gegevens over door haar verrichte transacties in effecten die zijn toegelaten tot de
      notering aan een effectenbeurs.

      2 Een instelling bewaart alle gegevens die betrekking hebben op haar bedrijfsvoering, waaronder de gegevens
      die betrekking hebben op de transacties, bedoeld in het eerste lid, ten minste vijf jaren op systematische en
      overzichtelijke wijze.
    url: https://wetten.overheid.nl/BWBR0007708/2003-12-01#Artikel40
  - number: '41'
    text: |-
      De regels, bedoeld in de [artikelen 34, eerste lid][ref1], [35, aanhef ][ref2],[ 35a][ref3],
      [36, vierde lid][ref4], [38][ref5] en [40, eerste lid][ref6], en het model, bedoeld in
