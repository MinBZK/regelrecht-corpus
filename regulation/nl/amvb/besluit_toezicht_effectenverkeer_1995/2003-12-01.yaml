    text: |-
      1 In geval van een voorgenomen tenderbod doet de bieder, in afwijking van het bepaalde in
      [artikel 9b, tweede lid, onderdeel d][ref1], geen openbare mededeling over het getal of percentage dan wel de
      prijs, bedoeld in [artikel 9m, onder i][ref2], alvorens volledig uitvoering te hebben gegeven aan het tweede
      en derde lid, tenzij overeenstemming tussen de bieder en de doelvennootschap is bereikt of de verwachting
      gerechtvaardigd is dat overeenstemming kan worden bereikt over het bod.

      2 De bieder stelt de doelvennootschap schriftelijk in kennis van zijn voornemen het getal of percentage dan wel de
      prijs, bedoeld in [artikel 9m, onder i][ref3], bekend te maken en nodigt de doelvennootschap uit om binnen zeven
      dagen na ontvangst van deze kennisgeving overleg te plegen over het voornemen van de bieder tot het doen van een
      bod, over dat getal of percentage dan wel die prijs en over de aan het voorgenomen bod ten grondslag liggende
      motieven.

      3 De bieder stelt, indien de doelvennootschap geen gebruik heeft gemaakt van de gelegenheid tot het plegen van
      het in het tweede lid bedoelde overleg of dit overleg niet tot overeenstemming heeft geleid, de doelvennootschap
      schriftelijk in kennis van het getal of het percentage dan wel de prijs bedoeld in [artikel 9m, onder i][ref4], en
      de motieven welke aan het voorgenomen bod ten grondslag liggen.

      4 De bieder en de doelvennootschap stellen, indien zij een openbare mededeling doen met betrekking tot het bod de
      inhoud daarvan schriftelijk ter kennis van de doelvennootschap respectievelijk de bieder, uiterlijk ten tijde van
      het doen van deze openbare mededeling.


