  - number: 9h
    text: |-
      1 Een vast bod is gericht tot alle rechthebbenden van de uitstaande effecten waarop het bod betrekking heeft,
      behoudens de bevoegdheid van de bieder om daarvan uit te sluiten effecten, die ten tijde van het uitbrengen van het
      bod nog niet waren uitgegeven of waarvan op dat tijdstip de uitgifte nog niet bekend was gemaakt, noch ter kennis
      van de bieder was gebracht.

      2 Aan alle rechthebbenden van dezelfde soort effecten wordt hetzelfde bod gedaan.

      3 De bieder treft een regeling met betrekking tot de levering en betaling van de aangeboden effecten, welke
      regeling voldoet aan door de toezichthoudende autoriteit te stellen regels.

      4 De bieder heeft de bevoegdheid het bod gestand te doen indien effecten tot een geringer bedrag of aantal zijn
      aangemeld, dan het bedrag of aantal van welker aanbieding hij binnen de aanmeldingstermijn zijn verplichting tot
      gestanddoening van het bod afhankelijk stelt.

      5 Indien de bieder het bod gestand doet, betaalt de bieder steeds voor alle ingevolge dat bod aangemelde effecten
      van enige soort waarop dat bod betrekking heeft een vergoeding welke overeenkomt met de hoogste door hem betaalde
      vergoeding in verband met transacties als bedoeld in [artikel 9b, derde lid][ref1], met uitzondering van in
      regelmatig beursverkeer tot stand gekomen transacties.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel9b
    url: https://wetten.overheid.nl/BWBR0007708/2003-12-01#Artikel9h
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 9b
        hoofdstuk: III_A
  - number: 9i
    text: |-
      Het biedingsbericht met betrekking tot een vast bod houdt ten minste in:

      a. de naam van de bieder;

      b. het voorstel tot overneming van effecten volgens een daarbij aan te geven prijs of ruilverhouding;

      c. de mededeling of met de doelvennootschap overleg over het bod is gevoerd en of dit overleg tot overeenstemming
      heeft geleid;

      d. de verklaring dat het bod is gericht tot alle rechthebbenden van de uitstaande effecten van de soorten waarop
      het bod betrekking heeft;

      e. de verklaring dat aan alle rechthebbenden van dezelfde soort effecten hetzelfde bod wordt gedaan;

      f. het aantal effecten van welker aanbieding binnen de aanmeldingstermijn de bieder zijn verplichting tot
      gestanddoening van het bod afhankelijk stelt;

      g. de eventuele verdere voorwaarden van welker vervulling de bieder zijn verplichting tot nakoming van het openbaar
      bod afhankelijk stelt, onverminderd [artikel 9t, eerste en tweede lid][ref1];

      h. een duidelijke motivering van de aangeboden prijs of ruilverhouding alsmede een mededeling over de wijze van
      financiering door de bieder indien het bod een prijs vermeldt;

      i. een regeling met betrekking tot de levering en betaling van aangeboden effecten, welke regeling voldoet aan door
      de toezichthoudende autoriteit te stellen regels.

      j. indien het bod op meer dan één soort effecten betrekking heeft: een duidelijke motivering van een eventueel
      verschil in het bod voor de verschillende soorten;

      k. de aanmeldingstermijn;

      l. voor zover aan de bieder ter beschikking staand: gegevens omtrent het vermogen en de resultaten van de
      doelvennootschap met inbegrip van de beschikbare gegevens omtrent het lopende boekjaar, indien daarvan meer dan een
      kwartaal is verstreken;

      m. eventuele voornemens inzake wijziging van de statuten van de doelvennootschap na gestanddoening van het bod;

      n. de aan het bod ten grondslag liggende motieven en de voornemens met betrekking tot het in verband daarmee te
      voeren beleid ten aanzien van de doelvennootschap en de met haar verbonden onderneming;

      o. eventuele voornemens inzake de samenstelling van het bestuur en van de raad van commissarissen van de
      doelvennootschap na gestanddoening van het bod;

      p. het totale bedrag der eventuele vergoedingen aan de bestuurders en commissarissen van de doelvennootschap die
      bij gestanddoening van het bod zullen aftreden;

      q. de omvang van de ten tijde van de openbare mededeling van de verkrijgbaarstelling van het biedingsbericht
      bestaande onderlinge kapitaaldeelneming – zowel direct als indirect – van de bieder en de doelvennootschap;

      r. indien van toepassing: het feit dat rechthebbenden van effecten van een soort waarop het bod betrekking heeft
      reeds te kennen hebben gegeven voor hun effecten het bod te zullen aanvaarden onder vermelding van het totale
      nominale bedrag van deze effecten;

      s. een mededeling of effecten, uitgegeven door de doelvennootschap, in de drie aan de openbare mededeling van
      de verkrijgbaarstelling van het biedingsbericht voorafgaande jaren door de bieder zijn verworven of krachtens
      in die periode reeds gesloten overeenkomsten of gemaakte afspraken zullen worden verworven, van bestuurders of
      commissarissen van de doelvennootschap of van hun echtgenoten, geregistreerde partners of minderjarige kinderen of
      van rechtspersonen waarin deze personen de zeggenschap hebben onder vermelding van:

      1. hun namen;

      2. de hoeveelheid en de soort van deze effecten alsmede de prijs of ruilverhouding welke voor ieder van deze
      verwervingen heeft gegolden, respectievelijk welke bij ieder van deze overeenkomsten of afspraken is bedongen;

      3. het totaalbedrag dat met deze transacties gemoeid is;

      4. indien, voor zover het effecten betreft waarop het openbaar bod betrekking heeft, de prijs of ruilverhouding
      hoger is dan de ingevolge het openbaar bod geboden prijs of ruilverhouding: de motivering van dit verschil;

      t. een mededeling of effecten, uitgegeven door de doelvennootschap, in de drie aan de publicatie van het
      biedingsbericht voorafgaande jaren door de bieder zijn verworven of krachtens in die periode reeds gesloten
      overeenkomsten of gemaakte afspraken zullen worden verworven, van andere dan de onder s bedoelde natuurlijke
      personen en rechtspersonen, onder vermelding van:

      1. de hoeveelheid en de soorten van deze effecten;

      2. de prijs of ruilverhouding welke heeft gegolden, respectievelijk werd bedongen bij ieder van deze transacties;

      3. het totaalbedrag dat met deze transacties gemoeid is;

      4. indien, voor zover het effecten betreft waarop het openbaar bod betrekking heeft, en waarvan de prijs of
      ruilverhouding hoger is dan de ingevolge het bod geboden prijs of ruilverhouding: de motivering van dit verschil;

      u. soortgelijke mededelingen als bedoeld onder s en t met betrekking tot eventuele transacties, verricht door
      rechtspersonen waarmee de bieder in een groep is verbonden;

      v. andere gegevens die naar het oordeel van de toezichthoudende autoriteit in het desbetreffende geval noodzakelijk
      zijn voor de adequate beoordeling van het bod door degene tot wie het bod zich richt;

      w. een mededeling omtrent de verstrekking van de in [artikel 9p][ref2] voorgeschreven gegevens aan de
      toezichthoudende autoriteit;

      x. een mededeling omtrent de wijze waarop in het kader van het bod aandacht is gegeven aan de belangen van de
      betrokken werknemers;

      y. de naam en functie van de natuurlijke personen, of de naam en zetel van de rechtspersonen, die verantwoordelijk
      zijn voor het biedingsbericht of, in voorkomend geval, voor bepaalde gedeelten daarvan. In dit laatste geval worden
      deze gedeelten vermeld.

      Indien een rechtspersoon verantwoordelijk is voor het biedingsbericht of een gedeelte daarvan, worden tevens naam
      en functie vermeld van de natuurlijke personen die het beleid van deze rechtspersonen bepalen;

      z. een verklaring van de onder y bedoelde verantwoordelijke personen dat, voor zover hun redelijkerwijs bekend
      had kunnen zijn, de gegevens in het biedingsbericht of in het gedeelte waarvoor zij verantwoordelijk zijn, in
      overeenstemming zijn met de werkelijkheid en dat geen gegevens zijn weggelaten waarvan vermelding de strekking van
      het biedingsbericht zou wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel9t
      [ref2]: https://wetten.overheid.nl/BWBR0007708#Artikel9p
