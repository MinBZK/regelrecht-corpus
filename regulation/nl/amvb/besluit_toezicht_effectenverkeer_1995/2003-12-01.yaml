  - number: '2'
    text: |-
      1 Een prospectus bevat de gegevens die, gelet op de aard van de uitgevende instelling en van de aangeboden
      effecten, redelijkerwijs van belang zijn voor de beoordeling van het vermogen, de financiële positie, het resultaat
      en de vooruitzichten van de uitgevende instelling en van de rechten en verplichtingen die aan de effecten verbonden
      zijn.

      2 Een prospectus bevat ten minste de volgende gegevens:

      a. voor aandeelbewijzen, optiebewijzen, warrants, inschrijvingen in aandelenregisters, winst- en
      oprichtersbewijzen, rechten van deelgenootschap, en soortgelijke waardepapieren dan wel rechten: de gegevens,
      bedoeld in de rubrieken 1.1 tot en met 9.2 en 10.1 tot en met 10.20 van de bij dit besluit behorende bijlage;

      b. voor schuldbrieven, inschrijvingen in schuldregisters, en soortgelijke waardepapieren dan wel rechten: de
      gegevens, bedoeld in de rubrieken 1.1 tot en met 9.2 en 11.1 tot en met 11.24 van de bij dit besluit behorende
      bijlage;

      c. voor certificaten van aandelen en soortgelijke waardepapieren: de gegevens, bedoeld in de rubrieken 12.1 tot
      en met 13.7 van de bij dit besluit behorende bijlage alsmede, indien de instelling die de oorspronkelijke effecten
      uitgeeft niet de instelling is die de certificaten uitgeeft, met betrekking tot de onderliggende waarden de
      gegevens als bedoeld in de rubrieken 1.1 tot en met 9.2 en 10.1 tot en met 10.20 van de bij dit besluit behorende
      bijlage;

      d. voor opties en soortgelijke rechten: de gegevens, bedoeld in de rubrieken 14.1 tot en met 20.5 en 21.1 tot en
      met 21.7 van de bij dit besluit behorende bijlage;

      e. voor rechten op overdracht op termijn van goederen: de gegevens, bedoeld in de rubrieken 14.1 tot en met 20.5 en
      22.1 tot en met 22.7 van de bij dit besluit behorende bijlage;

      f. voor recepissen van waarden als hiervoor bedoeld: de gegevens, bedoeld in de rubrieken van de bij dit besluit
      behorende bijlage die van toepassing zijn op de effecten waarvoor de recepissen worden uitgegeven.

      3 Indien de bestaansperiode van de uitgevende instelling korter is dan de tijdsduur, genoemd in de verschillende
      rubrieken waarnaar in het tweede lid wordt verwezen, behoeft de informatie slechts voor de bestaansperiode van de
      uitgevende instelling te worden verstrekt onder opgave van redenen daarvan in het prospectus.

      4 De toezichthoudende autoriteit kan verlangen dat een prospectus in een of meer door hem te bepalen talen wordt
      gesteld indien dit, gelet op de voorgenomen of mogelijke verspreiding van het prospectus, naar het oordeel van de
      toezichthoudende autoriteit noodzakelijk is voor een adequate informatieverschaffing aan de beleggers.

      5 De toezichthoudende autoriteit kan regels stellen met betrekking tot de indeling van het prospectus.
    url: https://wetten.overheid.nl/BWBR0007708/2003-12-01#Artikel2
  - number: '3'
    text: |-
      1 Op een uitgevende instelling die een prospectus algemeen verkrijgbaar stelt is
      [artikel 2, eerste en tweede lid][ref1], niet van toepassing indien het prospectus ten hoogste zes maanden voor het
      tijdstip waarop de aanbieding bij uitgifte wordt gedaan is goedgekeurd door de bevoegde autoriteit, bedoeld in de
      artikelen 20, eerste lid, of 21, tweede lid, van [richtlijn nr. 89/298/EEG](31989L0298) van de Raad van de Europese
      Gemeenschappen van 17 april 1989 tot coördinatie van de eisen gesteld aan de opstelling van, het toezicht op en
      de verspreiding van het prospectus dat moet worden gepubliceerd bij een openbare aanbieding van effecten *(PbEG* L
      124), van een andere lid-staat en:

      a. het prospectus is opgesteld overeenkomstig artikel 8 of 12 van die richtlijn; of

      b. op een of meer onderdelen van het goedgekeurde prospectus door de bevoegde autoriteit van die andere lid-
      staat ontheffing is verleend of afwijking op een of meer onderdelen is toegestaan, mits naar het oordeel van de
      toezichthoudende autoriteit van dezelfde omstandigheden als die welke die ontheffing of afwijking rechtvaardigden,
      eveneens sprake is in Nederland.

      2 De toezichthoudende autoriteit kan verlangen dat bepaalde gegevens, genoemd in de bij dit besluit behorende
      bijlage, aan het prospectus, bedoeld in het eerste lid, worden toegevoegd met het oog op de nadere verschaffing van
      informatie die specifiek voor het aanbod in Nederland van belang is.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel2
