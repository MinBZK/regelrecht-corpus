  - number: '4'
    text: |-
      In advertenties en documenten waarin een aanbieding van effecten in het vooruitzicht wordt gesteld, wordt vermeld
      dat een prospectus openbaar zal worden gemaakt alsmede op welke plaats en op welk tijdstip het prospectus algemeen
      verkrijgbaar zal worden gesteld. Afschriften van de advertenties en de documenten worden vóór het tijdstip waarop
      het prospectus openbaar wordt gemaakt of algemeen verkrijgbaar wordt gesteld aan de toezichthoudende autoriteit
      overgelegd.
    url: https://wetten.overheid.nl/BWBR0007708/2003-12-01#Artikel4
  - number: '5'
    text: |-
      1 Vóór het tijdstip waarop een aanbieding bij uitgifte wordt gedaan, wordt een prospectus aan de toezichthoudende
      autoriteit overgelegd en uiterlijk op dat tijdstip algemeen verkrijgbaar gesteld.

      2 Indien het een prospectus betreft als bedoeld in [artikel 3, eerste lid][ref1], wordt aan de toezichthoudende
      autoriteit gelijktijdig met het overleggen van het prospectus een schriftelijke verklaring van de in dat lid
      bedoelde autoriteit overgelegd waaruit de in dat lid bedoelde goedkeuring blijkt.

      3 Indien op een prospectus [artikel 3, eerste lid, onder ][ref2], van toepassing is, wordt het prospectus niet
      algemeen verkrijgbaar gesteld dan nadat de toezichthoudende autoriteit heeft verklaard dat naar zijn oordeel
      van dezelfde omstandigheden als die welke de in dat onderdeel bedoelde ontheffing of afwijking rechtvaardigden,
      eveneens sprake is in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007708#Artikel3
    url: https://wetten.overheid.nl/BWBR0007708/2003-12-01#Artikel5
