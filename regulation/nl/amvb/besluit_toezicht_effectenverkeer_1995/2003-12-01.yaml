        paragraaf: '1'
  - number: '27'
    text: |-
      1 Een effecteninstelling informeert iedere cliënt over de toepasselijkheid van een garantieregeling op de door haar
      aangeboden diensten, alsmede, indien een garantieregeling van toepassing is, over de inhoud van die regeling.

      2 Een effecteninstelling deelt aan een ieder die een gerechtvaardigd belang heeft op verzoek mede aan welke
      systemen als bedoeld in [artikel 212a van de Faillissementswet][ref1] de effecteninstelling deelneemt.

      3 Een effecteninstelling verstrekt aan een ieder die een gerechtvaardigd belang heeft op verzoek
      informatie over de belangrijkste regels die gelden voor de werking van de systemen bedoeld in
      [artikel 212a van de Faillissementswet][ref2], waaraan de effecteninstelling deelneemt.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel212a
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel212a
    url: https://wetten.overheid.nl/BWBR0007708/2003-12-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: 212a
      - id: ref2
        bwb_id: BWBR0001860
        artikel: 212a
  - number: '28'
    text: |-
      Een effecteninstelling die in de uitoefening van haar bedrijf effectentransacties en andere daarmee verband
      houdende handelingen verricht voor rekening van een cliënt, reikt aan die cliënt onverwijld een effectennota uit
      die voldoet aan door de toezichthoudende autoriteit te stellen regels met betrekking tot de gegevens die op de
      effectennota worden vermeld.
    url: https://wetten.overheid.nl/BWBR0007708/2003-12-01#Artikel28
  - number: '29'
    text: |-
      1 Een effecteninstelling die in de uitoefening van haar bedrijf vermogensbeheer verricht, stelt regelmatig aan
      iedere cliënt met wie zij een overeenkomst inzake vermogensbeheer heeft gesloten een opgave beschikbaar die
      een getrouw en volledig overzicht geeft van de samenstelling van het door de effecteninstelling voor die cliënt
      beheerde vermogen. Deze opgave bevat ten minste de volgende gegevens:

      a. de samenstelling naar effectensoort en de marktwaarde van het onder beheer zijnde vermogen; en

      b. de aan de cliënt in rekening gebrachte onderscheidenlijk te brengen kosten van beheer en overige kosten.

      2 De toezichthoudende autoriteit kan nadere regels stellen met betrekking tot de frequentie en het model van de
      opgave, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007708/2003-12-01#Artikel29
  - number: '30'
    text: |-
      1 Een effecteninstelling houdt zich aan door de toezichthoudende autoriteit te stellen regels met betrekking
      tot door de effecteninstelling te rapporteren gegevens over door haar verrichte transacties in effecten die zijn
      toegelaten tot de notering aan een effectenbeurs.

      2 Een effecteninstelling bewaart alle gegevens die betrekking hebben op haar bedrijfsvoering, waaronder de gegevens
      die betrekking hebben op de transacties, bedoeld in het eerste lid, ten minste vijf jaren op systematische en
      overzichtelijke wijze.
    url: https://wetten.overheid.nl/BWBR0007708/2003-12-01#Artikel30
  - number: '31'
    text: |-
      De regels, bedoeld in de [artikelen 23, tweede lid][ref1], [24, aanhef][ref2], [24a][ref3],
      [24b][ref4], [25, vierde lid][ref5], [28][ref6] en [30, eerste lid][ref7], en het model, bedoeld in
      [artikel 29, tweede lid][ref8], kunnen voor onderscheiden groepen effecteninstellingen verschillend zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0007708#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0007708#Artikel24a
      [ref4]: https://wetten.overheid.nl/BWBR0007708#Artikel24b
      [ref5]: https://wetten.overheid.nl/BWBR0007708#Artikel25
