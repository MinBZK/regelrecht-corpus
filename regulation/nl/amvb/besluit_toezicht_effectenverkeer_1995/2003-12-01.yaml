  - number: '45'
    text: |-
      De toezichthoudende autoriteit kan regels stellen om te voorkomen dat een handeling als bedoeld in
      artikel 16, eerste lid, van de wet van een houder van een verklaring van geen bezwaar als bedoeld in
      [artikel 17, eerste lid, van de wet][ref1] zou leiden of zou kunnen leiden tot een invloed op de betrokken
      effecteninstelling die in strijd is met een gezonde en prudente bedrijfsvoering van die effecteninstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel17
    url: https://wetten.overheid.nl/BWBR0007708/2003-12-01#Artikel45
    references:
