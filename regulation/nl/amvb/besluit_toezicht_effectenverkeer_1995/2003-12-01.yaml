        hoofdstuk: V
        paragraaf: '1'
  - number: 35a
    text: |-
      Op een instelling zijn de [artikelen 24a tot en met 24e][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel24a
    url: https://wetten.overheid.nl/BWBR0007708/2003-12-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 24a
        hoofdstuk: V
        paragraaf: '1'
  - number: '36'
    text: |-
      1 Een instelling sluit met iedere cliënt een schriftelijke overeenkomst die de uitsluitende grondslag vormt voor de
      diensten die de instelling in de uitoefening van haar bedrijf voor de cliënt verricht.

      2 In de overeenkomst zijn ten minste bepaald:

      a. de rechten en verplichtingen van de cliënt en de instelling uit hoofde van de overeenkomst;

      b. de naar soort onderscheiden diensten die de instelling in het kader van de overeenkomst voor de cliënt zal
      verrichten;

      c. een specificatie van de eventuele beperkingen met betrekking tot de markten waarop effectentransacties ten
      behoeve van de cliënt zullen worden afgewikkeld;

      d. de naar soort onderscheiden kosten, anders dan de kosten ter zake van een aanbieding van effecten bij uitgifte,
      die aan de cliënt in rekening worden gebracht alsmede de aan die kosten ten grondslag liggende berekening;

      e. de wijze waarop instructies van de cliënt en berichten van de instelling worden verstrekt en geadministreerd;

      f. de wijze waarop gelden of effecten van de cliënt worden verrekend, gedeponeerd en geadministreerd;

      g. de wijze waarop over de rekeningen van de cliënt kan worden beschikt;

      h. de regelingen inzake de aansprakelijkheid van de instelling onderscheidenlijk de cliënt uit hoofde van de
      overeenkomst;

      i. een verklaring van de cliënt dat hij heeft kennis genomen van de informatie die de instelling krachtens dit
      besluit aan hem dient te verstrekken en dat hij zich bewust is van de risico’s die aan de belegging zijn verbonden;

      j. de regeling van toepasselijk recht en de wijze van beslechting van geschillen; en

      k. de omstandigheden waaronder de overeenkomst tussen de instelling en de cliënt een einde neemt, de omstandigheden
      waaronder de overeenkomst kan worden ontbonden en de wijze waarop op of na de datum van beëindiging nog lopende
      transacties worden afgewikkeld.

      3 Indien de overeenkomst betrekking heeft op vermogensbeheer is daarin tevens bepaald:

      a. de samenstelling van het beheerde vermogen naar effectensoort en de waarde van het te beheren vermogen ten tijde
      van het sluiten van de overeenkomst;

      b. de doelstellingen van de cliënt ter zake van het vermogensbeheer;

      c. een specificatie van de eventuele kwalitatieve en kwantitatieve beperkingen ten aanzien van de effecten of
      categorieën van effecten waarin mag worden belegd;

      d. de wijze waarop het beheer wordt gevoerd alsmede de betrokkenheid van de cliënt daarbij, daaronder een regeling
      van de machtiging aan de instelling; en

      e. de frequentie van rapportage aan de cliënt.

      4 De toezichthoudende autoriteit kan nadere regels stellen met betrekking tot de inhoud en het model van de
      overeenkomst, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007708/2003-12-01#Artikel36
  - number: '37'
    text: |-
      De [artikelen 35, aanhef en onder b en c][ref1], en [36][ref2] zijn niet van toepassing ingeval een instelling
      diensten aanbiedt aan of verricht voor personen die beroeps- of bedrijfsmatig handelen of beleggen in effecten.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0007708#Artikel36
