  - number: '35'
    text: |-
      Onverminderd het bepaalde in de [artikelen 24a][ref1] en [24b][ref2] houdt een instelling zich bij het verrichten
      van haar werkzaamheden aan door de toezichthoudende autoriteit te stellen regels die ertoe strekken dat de
      instelling:

      a. handelt in het belang van haar cliënten en de adequate functionering van de effectenmarkten;

      b. in het belang van haar cliënten kennis neemt van hun financiële positie, ervaring en beleggingsdoelstellingen,
      voor zover dit redelijkerwijs van belang is met het oog op het verrichten van haar diensten;

      c. haar cliënten de gegevens en bescheiden verstrekt die nodig zijn voor de beoordeling van de door haar aangeboden
      diensten en de effecten waarop die diensten betrekking hebben;

      d. ervoor zorgt dat haar cliënten op billijke wijze worden behandeld in het geval dat een belangenconflict
      onvermijdelijk blijkt te zijn;

      e. de bevoegdheden die zij heeft gekregen ten behoeve van de door haar te verrichten diensten, niet gebruikt voor
      andere doeleinden dan die waarvoor zij aan haar zijn verleend; en

      f. een goede interne organisatie en adequate controlemechanismen heeft ten behoeve van de naleving van de in de
      aanhef bedoelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel24a
      [ref2]: https://wetten.overheid.nl/BWBR0007708#Artikel24b
    url: https://wetten.overheid.nl/BWBR0007708/2003-12-01#Artikel35
