  - number: '45'
    text: |-
      De toezichthoudende autoriteit kan regels stellen om te voorkomen dat een handeling als bedoeld in
      artikel 16, eerste lid, van de wet van een houder van een verklaring van geen bezwaar als bedoeld in
      [artikel 17, eerste lid, van de wet][ref1] zou leiden of zou kunnen leiden tot een invloed op de betrokken
      effecteninstelling die in strijd is met een gezonde en prudente bedrijfsvoering van die effecteninstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel17
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: '17'
  - number: 45a
    text: |-
      Een instelling als bedoeld in [artikel 18a, eerste lid, van de wet][ref1] houdt zich bij haar optreden op de
      effectenmarkten aan door de toezichthoudende autoriteit gestelde regels die ertoe strekken dat de instelling:


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel18a
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: 18a
  - number: 45a.a
    text: |-
      interne voorschriften vaststelt inzake het omgaan met koersgevoelige informatie respectievelijk ten aanzien van
      privé beleggingstransacties van bestuurders en personeelsleden;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel45a
  - number: 45a.b
    text: zich onthoudt van koersmanipulatie en andere misleidende handelingen;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel45a
  - number: 45a.c
    text: belangenverstrengeling die te maken heeft met effectentransacties voorkomt;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel45a
  - number: 45a.d
    text: adequate controlemechanismen heeft ten behoeve van de naleving van de in de aanhef bedoelde regels;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel45a
  - number: 45a.e
    text: |-
      zorgdraagt voor het vastleggen van de in dit artikel bedoelde interne voorschriften, controlemechanismen en andere
      in dit kader getroffen voorzieningen in de administratieve organisatie.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel45a
  - number: 45b.1
    text: |-
      Het bedrag van de boete, bedoeld in [artikel 48d, vijfde lid, van de wet][ref1], wordt bepaald op de wijze,
      voorzien in [bijlage B][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel48d
      [ref2]: https://wetten.overheid.nl/BWBR0007708
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel45b
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: 48d
      - id: ref2
        bwb_id: BWBR0007708
  - number: 45b.2
    text: |-
      De toezichthouder kan het bedrag van de boete lager stellen dan in de bijlage is bepaald, indien het bedrag van de
      boete in een bepaald geval op grond van bijzondere omstandigheden onevenredig hoog is.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel45b
  - number: '46'
    text: |-
      Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel46
  - number: '47'
    text: 'Dit besluit wordt aangehaald als: Besluit toezicht effectenverkeer 1995.'
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel47
