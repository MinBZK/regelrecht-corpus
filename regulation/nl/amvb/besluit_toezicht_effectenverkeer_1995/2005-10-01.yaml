  - number: '42'
    text: |-
      De [artikelen 27][ref1], [32][ref2] en [32a][ref3] zijn van overeenkomstige toepassing op een instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0007708#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0007708#Artikel32a
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel42
    references:
