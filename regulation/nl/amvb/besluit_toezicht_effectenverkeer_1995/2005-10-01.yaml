        artikel: '32'
        hoofdstuk: V
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007708
        artikel: 32a
        hoofdstuk: V
        paragraaf: '1'
  - number: '43'
    text: |-
      De [artikelen 35 tot en met 39][ref1] zijn van overeenkomstige toepassing op kredietinstellingen die ingevolge
      [artikel 31][ref2] of [artikel 32 van de Wet toezicht kredietwezen 1992][ref3] in Nederland het bedrijf
      van kredietinstelling mogen uitoefenen, op financiële instellingen die ingevolge [artikel 50][ref4] of
      [artikel 51 van die wet][ref5] werkzaamheden in Nederland mogen uitoefenen en op effecteninstellingen als bedoeld
      in [artikel 7, tweede lid, onder ][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0005792#Artikel32
      [ref4]: https://wetten.overheid.nl/BWBR0005792#Artikel50
      [ref5]: https://wetten.overheid.nl/BWBR0005792#Artikel51
      [ref6]: https://wetten.overheid.nl/BWBR0007657#Artikel7
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel43
