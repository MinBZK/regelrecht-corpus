preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Financiën van 19 juli 1995, nr. BGW 95/1678-M, Generale Thesaurie, Directie
    Binnenlands Geldwezen, Afdeling Effecten, Banken en Monetaire aangelegenheden;

    Gelet op de artikelen 3, tweede lid, onder b en c,5, eerste lid, tweede volzin, 7, vierde lid, 11, eerste lid, en
    17, eerste lid, van de Wet toezicht effectenverkeer 1995;

    De Raad van State gehoord (advies van 31 oktober 1995, No. W06.95.0402);

    Gezien het nader rapport van Onze Minister van Financiën van 5 december 1995, nr. BGW 95/2512-U, Generale
    Thesaurie, Directie Binnenlands Geldwezen, Afdeling Effecten, Banken en Monetaire aangelegenheden;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1
  - number: 1.a
    text: |-
      wet: de [Wet toezicht effectenverkeer 1995][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007657
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007657
  - number: 1.b
    text: 'uitgevende instelling: een ieder die effecten uitgeeft of voornemens is effecten uit te geven;'
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1
  - number: 1.c
    text: |-
      accountant: een accountant als bedoeld in [artikel 393, eerste lid, van boek 2 van het Burgerlijk Wetboek][ref1],
      die niet in dienstbetrekking staat tot de desbetreffende onderneming of instelling;


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 1.d
    text: 'jaarrekening: de balans en de winst- en verliesrekening met de toelichting;'
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1
  - number: 1.e
    text: |-
      toezichthoudende autoriteit: - Onze Minister of een rechtspersoon waaraan ingevolge [artikel 40 van de wet][ref1]
      taken en bevoegdheden zijn overgedragen voor zover het de taken en bevoegdheden betreft.
        - De Nederlandse Bank N.V., voor zover het de bevoegdheid uit hoofde van [hoofdstuk 4][ref2] betreft tot het
      stellen van regels met betrekking tot de financiële waarborgen, de bedrijfsvoering en informatieverstekking voor
      zover noodzakelijk voor het toezicht op financiële waarborgen.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0007708#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: '40'
      - id: ref2
        bwb_id: BWBR0007708
        hoofdstuk: IV
  - number: 1.f
    text: 'vast bod: een openbaar bod dat de geboden prijs of ruilverhouding vermeldt, niet zijnde een partieel bod;'
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1
  - number: 1.g
    text: |-
      partieel bod: een openbaar bod dat de geboden prijs of ruilverhouding vermeldt, strekkende tot verwerving van een
      gedeelte van de door de doelvennootschap uitgegeven effecten;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1
  - number: 1.h
    text: |-
      tenderbod: een openbaar bod waarmee de rechthebbenden van de effecten worden uitgenodigd om deze effecten tegen een
      door de rechthebbenden zelf te noemen tegenprestatie aan de bieder aan te bieden;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1
  - number: 1.i
    text: |-
      doelvennootschap: de instelling te wier laste de effecten waarop het openbaar bod betrekking heeft, zijn
      uitgegeven;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1
  - number: 1.j
    text: |-
      openbare mededeling: een mededeling als bedoeld in [artikel 9a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel9a
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 9a
        hoofdstuk: III_A
  - number: 1.k
    text: |-
      aanmeldingstermijn: de periode gedurende welke de effecten waarop een bod betrekking heeft, kunnen worden
      aangemeld;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1
  - number: 1.l
    text: 'gereglementeerde markt: een markt als bedoeld in artikel 1, punt 13, van de richtlijn beleggingsdiensten;'
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1
  - number: 1.m
    text: |-
      prospectusrichtlijn: [richtlijn nr. 2003/71/EG](32003L0071) van het Europees Parlement en de Raad van de Europese
      Unie van 4 november 2003 betreffende het prospectus dat gepubliceerd moet worden wanneer effecten aan het publiek
      worden aangeboden of tot de handel worden toegelaten en tot wijziging van [richtlijn nr. 2001/34/EG](32001L0034)
      van het Europees Parlement en de Raad van de Europese Unie van 28 mei 2001 betreffende de toelating van effecten
      tot de officiële notering aan een effectenbeurs en de informatie die over deze effecten moet worden gepubliceerd
      (PbEU L 345).
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1
  - number: 1a
    text: 'Voor de toepassing van dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1a
  - number: 1a.a
    text: |-
      aanbieden van effecten aan het publiek: een tot meer dan een persoon gericht voldoende bepaald aanbod tot het
      aangaan van een overeenkomst tot het kopen of anderszins verkrijgen van effecten;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1a
  - number: 1a.b
    text: 'aanbieder: degene die effecten aan het publiek aanbiedt;'
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1a
  - number: 1a.c
    text: |-
      aanbiedingsprogramma: een programma dat de mogelijkheid opent voor het gedurende een daarin bepaalde periode
      doorlopend of periodiek aanbieden van effecten zonder aandelenkarakter of van de effecten, bedoeld in onderdeel e,
      onder 2°, van eenzelfde categorie of klasse;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1a
  - number: 1a.d
    text: 'effect:'
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1a
  - number: 1a.d.1°
    text: |-
      een verhandelbaar aandeel of een ander daarmee gelijk te stellen verhandelbaar waardebewijs of recht, niet zijnde
      een geldmarktinstrument met een looptijd van minder dan twaalf maanden;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1a
  - number: 1a.d.2°
    text: |-
      een verhandelbare obligatie of een ander verhandelbaar schuldinstrument, niet zijnde een geldmarktinstrument met
      een looptijd van minder dan twaalf maanden; of
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1a
  - number: 1a.d.3°
    text: |-
      elk ander door een rechtspersoon, vennootschap of instelling uitgegeven verhandelbaar waardebewijs waarmee een
      onder 1° of 2° bedoeld effect door uitoefening van de daaraan verbonden rechten of door conversie kan worden
      verworven of dat in geld kan worden afgewikkeld, niet zijnde een geldmarktinstrument met een looptijd van minder
      dan twaalf maanden;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1a
  - number: 1a.e
    text: 'effect met een aandelenkarakter:'
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1a
  - number: 1a.e.1°
    text: |-
      door een rechtspersoon, vennootschap of instelling uitgegeven verhandelbaar aandeel of een ander met een aandeel
      gelijk te stellen verhandelbaar waardebewijs of recht; of
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1a
  - number: 1a.e.2°
    text: |-
      elk ander door een rechtspersoon, vennootschap of instelling uitgegeven verhandelbaar waardebewijs waarmee, door
      uitoefening van de aan dit waardebewijs verbonden recht, door conversie of omruiling een ander effect met een
      aandelenkarakter als bedoeld onder 1° kan worden verworven, indien het verhandelbare waardebewijs is uitgegeven
      door de rechtspersoon, vennootschap of instelling, of door een daarmee in een groep verbonden groepsmaatschappij,
      die ook het te verwerven effect met een aandelenkarakter heeft uitgegeven;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1a
  - number: 1a.f
    text: |-
      effect zonder aandelenkarakter: elk effect dat geen effect met een aandelenkarakter is, te onderscheiden in de
      volgende categorieën:
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1a
  - number: 1a.f.1°
    text: |-
      door een rechtspersoon, vennootschap of instelling uitgegeven verhandelbaar waardebewijs, waarmee door uitoefening
      van het daaraan verbonden recht, door conversie of omruiling een ander effect kan worden verworven en dat niet
      is uitgegeven door de rechtspersoon, vennootschap of instelling, of door een daarmee in een groep verbonden
      groepsmaatschappij, die ook het te verwerven effect heeft uitgegeven;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1a
  - number: 1a.f.2°
    text: |-
      door een rechtspersoon, vennootschap of instelling uitgegeven verhandelbaar waardebewijs dat door uitoefening van
      het daaraan verbonden recht, recht geeft op een afwikkeling in geld;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1a
  - number: 1a.f.3°
    text: ieder overig effect dat geen effect met een aandelenkarakter is;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1a
  - number: 1a.g
    text: |-
      groep: groep als bedoeld in [artikel 24b van boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: 1b.1
    text: |-
      De toezichthoudende autoriteit is bevoegd tot goedkeuring van een prospectus indien de uitgevende instelling zetel
      heeft in Nederland en het een aanbieding van effecten aan het publiek of een toelating van effecten tot de handel
      op een gereglementeerde markt betreft:
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1b
  - number: 1b.1.a
    text: in Nederland of in een andere lidstaat van effecten met een aandelenkarakter; of
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1b
  - number: 1b.1.b
    text: |-
      in Nederland van effecten zonder aandelenkarakter als bedoeld in [artikel 1a, onderdeel f, onder 1° en 2°][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel1a
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 1a
        hoofdstuk: Ia
        paragraaf: '1'
  - number: 1b.1.c
    text: |-
      in Nederland of in een andere lidstaat van effecten zonder aandelenkarakter als bedoeld in
      [artikel 1a, onderdeel f, onder 3°][ref1], met een nominale waarde per effect die kleiner is dan € 1.000;


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel1a
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 1a
        hoofdstuk: Ia
        paragraaf: '1'
  - number: 1b.1.d
    text: |-
      in Nederland van effecten zonder aandelenkarakter als bedoeld in [artikel 1a, onderdeel f, onder 3°][ref1], met
      een nominale waarde per effect van ten minste € 1.000.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel1a
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 1a
        hoofdstuk: Ia
        paragraaf: '1'
  - number: 1b.2
    text: |-
      De toezichthoudende autoriteit is tevens bevoegd tot goedkeuring van een prospectus indien het een aanbieding van
      effecten aan het publiek of een toelating van effecten tot de handel op een gereglementeerde markt betreft:
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1b
  - number: 1b.2.a
    text: |-
      van effecten met een aandelenkarakter of effecten zonder aandelenkarakter als bedoeld in
      [artikel 1a, onderdeel f, onder 3°][ref1], met een nominale waarde per effect die kleiner is dan € 1.000:


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel1a
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 1a
        hoofdstuk: Ia
        paragraaf: '1'
  - number: 1b.2.a.1°
    text: in Nederland door een uitgevende instelling met zetel in een staat die geen lidstaat is;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1b
  - number: 1b.2.a.2°
    text: |-
      in Nederland of in een andere lidstaat door een uitgevende instelling met zetel in een staat die geen lidstaat is
      indien bij een eerdere aanbieding van effecten aan het publiek of een toelating van effecten tot de handel op een
      gereglementeerde markt is gekozen voor goedkeuring door de toezichthoudende autoriteit; of,
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1b
  - number: 1b.2.a.3°
    text: |-
      in Nederland of in een andere lidstaat door een uitgevende instelling met zetel in een staat die geen lidstaat
      is, indien bij een eerdere aanbieding van effecten aan het publiek of een toelating van effecten tot de handel op
      een gereglementeerde markt een ander heeft gekozen voor goedkeuring door een toezichthoudende instantie van een
      andere lidstaat en de uitgevende instelling met betrekking tot de aanbieding van effecten aan het publiek of de
      toelating van effecten tot de handel op een gereglementeerde markt kiest voor goedkeuring door de toezichthoudende
      autoriteit;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1b
  - number: 1b.2.b
    text: |-
      van effecten zonder aandelenkarakter als bedoeld in [artikel 1a, onderdeel f, onder 1° en 2°][ref1] of effecten
      zonder aandelenkarakter als bedoeld in [artikel 1a, onderdeel f, onder 3°][ref2], met een nominale waarde per
      effect van ten minste € 1.000 van effecten aan het publiek of een toelating van effecten tot de handel op een
      gereglementeerde markt:


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0007708#Artikel1a
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 1a
        hoofdstuk: Ia
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007708
        artikel: 1a
        hoofdstuk: Ia
        paragraaf: '1'
  - number: 1b.2.b.1°
    text: in een andere lidstaat door een uitgevende instelling met zetel in Nederland;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1b
  - number: 1b.2.b.2°
    text: in Nederland door een uitgevende instelling met zetel in een andere lidstaat; of,
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1b
  - number: 1b.2.b.3°
    text: in Nederland of in een andere lidstaat door een uitgevende instelling met zetel in een staat die geen lidstaat is.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1b
  - number: 1b.3
    text: |-
      Voor zover het eerste lid, aanhef en onderdeel c of d, of het tweede lid betrekking heeft op effecten zonder
      aandelenkarakter waarvan de nominale waarde niet luidt in euro’s, wordt voor de toepassing van de in die bepalingen
      genoemde grensbedragen de nominale waarde van de effecten omgerekend in euro’s, waarbij een omgerekende waarde van
      nagenoeg € 1.000 wordt gelijkgesteld aan € 1.000.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1b
  - number: 1c
    text: |-
      De toezichthoudende autoriteit is tevens bevoegd tot goedkeuring van een prospectus, indien een toezichthoudende
      instantie van een andere lidstaat die bevoegd is om het prospectus goed te keuren de toezichthoudende autoriteit
      heeft verzocht om het prospectus goed te keuren en de toezichthoudende autoriteit daarmee heeft ingestemd.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1c
  - number: 1d.1
    text: |-
      Indien de toezichthoudende autoriteit op grond van [artikel 1b, eerste of tweede lid][ref1], bevoegd is om
      een prospectus goed te keuren, kan zij een toezichthoudende instantie van een andere lidstaat verzoeken een
      besluit omtrent de goedkeuring van het prospectus te nemen. Indien deze instantie daarmee instemt, besluit de
      toezichthoudende autoriteit de aanvraag niet verder te behandelen en doet zij daarvan mededeling aan de aanvrager.
      Vanaf het tijdstip van de mededeling is de toezichthoudende autoriteit niet langer bevoegd om het prospectus goed
      te keuren.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel1b
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1d
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 1b
        hoofdstuk: Ia
        paragraaf: '2'
  - number: 1d.2
    text: |-
      De toezichthoudende autoriteit stelt de aanvrager en Onze Minister binnen drie werkdagen in kennis van een verzoek
      dat zij krachtens het eerste lid heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1d
  - number: 1d.3
    text: |-
      Indien de toezichthoudende instantie van de andere lidstaat heeft ingestemd met het nemen van een besluit omtrent
      de goedkeuring van het prospectus, zendt de toezichthoudende autoriteit de op de aanvraag betrekking hebbende
      documenten onverwijld door naar die instantie.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1d
  - number: 1e.1
    text: |-
      De toezichthoudende autoriteit verleent goedkeuring van het prospectus, bedoeld in [artikel 1k][ref1] of
      [1l][ref2], indien wordt voldaan aan:


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel1k
      [ref2]: https://wetten.overheid.nl/BWBR0007708#Artikel1l
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1e
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 1k
        hoofdstuk: Ia
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0007708
        artikel: 1l
        hoofdstuk: Ia
        paragraaf: '5'
  - number: 1e.1.a
    text: |-
      de [artikelen 1i tot en met 1o][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel1i
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1e
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 1i
        hoofdstuk: Ia
        paragraaf: '5'
  - number: 1e.1.b
    text: de artikelen 3 tot en met 23, 25, 26, met uitzondering van het vijfde lid, en 28 van de prospectusverordening.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1e
  - number: 1e.2
    text: |-
      De toezichthoudende autoriteit kan, indien zij bevoegd is op grond van [artikel 1b][ref1] of [1c][ref2],
      goedkeuring van het prospectus verlenen aan de uitgevende instelling die zijn zetel heeft in een staat die geen
      lidstaat is indien:


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel1b
      [ref2]: https://wetten.overheid.nl/BWBR0007708#Artikel1c
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1e
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 1b
        hoofdstuk: Ia
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007708
        artikel: 1c
        hoofdstuk: Ia
        paragraaf: '2'
  - number: 1e.2.a
    text: die instelling het prospectus heeft opgesteld in overeenstemming met de wetgeving van de staat van haar zetel;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1e
  - number: 1e.2.b
    text: |-
      die instelling het prospectus heeft opgesteld conform door internationale organisaties van effectentoezichthouders
      opgestelde internationale standaarden, met inbegrip van standaarden voor de informatievoorziening; en
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1e
  - number: 1e.2.c
    text: |-
      de doorlopende informatievereisten omtrent het bedrijf van de uitgevende instelling, met inbegrip van informatie
      van financiële aard, gelijkwaardig zijn aan de voorschriften van de prospectusrichtlijn.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1e
  - number: 1f.1
    text: |-
      Indien de toezichthoudende autoriteit een prospectus heeft goedgekeurd, verstrekt zij op aanvraag van de uitgevende
      instelling of van de met het opstellen van het prospectus belaste persoon aan de toezichthoudende instantie van
      iedere andere lidstaat waar de desbetreffende effecten aan het publiek worden aangeboden of waar toelating van
      die effecten tot de handel op een gereglementeerde markt wordt aangevraagd, een verklaring dat het prospectus in
      overeenstemming met de prospectusrichtlijn is opgesteld, alsmede een afschrift van het goedgekeurde prospectus.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1f
  - number: 1f.2
    text: |-
      De toezichthoudende autoriteit verstrekt de verklaring, bedoeld in het eerste lid, en het afschrift van het
      goedgekeurde prospectus binnen drie werkdagen na ontvangst van de aanvraag. Indien de aanvraag wordt gedaan
      voordat goedkeuring is verleend, verstrekt de toezichthoudende autoriteit de verklaring binnen een werkdag nadat de
      goedkeuring is verleend.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1f
  - number: 1f.3
    text: |-
      Indien van toepassing vermeldt de verklaring, bedoeld in het eerste lid, tevens dat de toezichthoudende autoriteit,
      met inachtneming van [artikel 1n, derde en vierde lid][ref1], heeft toegestaan dat bepaalde informatie niet in het
      prospectus behoeft te worden opgenomen alsmede de redenen daarvoor.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel1n
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1f
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 1n
        hoofdstuk: Ia
        paragraaf: '5'
  - number: 1g.1
    text: |-
      De uitgevende instelling, aanbieder of aanvrager van de toelating van effecten tot de handel op een
      gereglementeerde markt die beschikt over een prospectus dat is goedgekeurd door een toezichthoudende instantie van
      een andere lidstaat, kan de desbetreffende effecten in Nederland aan het publiek aanbieden of laten toelaten tot de
      handel op een gereglementeerde markt, indien de toezichthoudende autoriteit van de toezichthoudende instantie van
      die andere lidstaat een verklaring dat het prospectus in overeenstemming met de prospectusrichtlijn is opgesteld en
      een afschrift van het goedgekeurde prospectus heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1g
  - number: 1g.2
    text: |-
      De verklaring, bedoeld in het eerste lid, vermeldt, indien van toepassing, dat artikel 8, tweede of derde lid, van
      de prospectusrichtlijn of de regelgeving van een lidstaat ter implementatie daarvan is toegepast alsmede de redenen
      daarvoor.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1g
  - number: 1h
    text: |-
      De [artikelen 1i tot en met 1n][ref1], [1p][ref2] en [1q][ref3] zijn uitsluitend van toepassing met betrekking
      tot aanbiedingen van effecten aan het publiek en of toelatingen van effecten tot de handel op een gereglementeerde
      markt terzake waarvan de toezichthoudende autoriteit op grond van [artikel 1b][ref4] of [1c][ref5] bevoegd is tot
      de goedkeuring van het prospectus.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel1i
      [ref2]: https://wetten.overheid.nl/BWBR0007708#Artikel1p
      [ref3]: https://wetten.overheid.nl/BWBR0007708#Artikel1q
      [ref4]: https://wetten.overheid.nl/BWBR0007708#Artikel1b
      [ref5]: https://wetten.overheid.nl/BWBR0007708#Artikel1c
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1h
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 1i
        hoofdstuk: Ia
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0007708
        artikel: 1p
        hoofdstuk: Ia
        paragraaf: '6'
      - id: ref3
        bwb_id: BWBR0007708
        artikel: 1q
        hoofdstuk: Ia
        paragraaf: '6'
      - id: ref4
        bwb_id: BWBR0007708
        artikel: 1b
        hoofdstuk: Ia
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0007708
        artikel: 1c
        hoofdstuk: Ia
        paragraaf: '2'
  - number: 1i.1
    text: |-
      Het prospectus bevat alle gegevens die, gelet op de aard van de uitgevende instelling en van de aan het publiek
      aangeboden of tot de handel op de gereglementeerde markt toegelaten effecten, van belang zijn voor het vormen
      van een verantwoord oordeel over het vermogen, de financiële positie, het resultaat en de vooruitzichten van de
      uitgevende instelling en de eventuele garant en de rechten en plichten welke aan deze effecten verbonden zijn,
      waaronder de gegevens, bedoeld in de artikelen 3 tot en met 23 van de prospectusverordening en de bij die artikelen
      behorende bijlagen.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1i
  - number: 1i.2
    text: |-
      De gegevens, bedoeld in het eerste lid, zijn niet met elkaar in strijd of in tegenspraak met andere bij de
      toezichthoudende autoriteit aanwezige informatie omtrent de uitgevende instelling, aanbieder of aanvrager van
      toelating van effecten tot de handel op de gereglementeerde markt en worden gepresenteerd in een vorm die voor een
      redelijk geïnformeerde en zorgvuldig handelende persoon begrijpelijk zijn.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1i
  - number: 1j.1
    text: |-
      De samenvatting beschrijft op beknopte wijze en in bewoordingen die voor een redelijk geïnformeerde en zorgvuldig
      handelende persoon begrijpelijk zijn de belangrijkste kenmerken van en risico’s verbonden aan de uitgevende
      instelling, de eventuele garant en de effecten, in de taal waarin het prospectus oorspronkelijk is gesteld.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1j
  - number: 1j.2
    text: 'De samenvatting bevat de waarschuwing dat:'
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1j
  - number: 1j.2.a
    text: de samenvatting gelezen moet worden als een inleiding op het prospectus;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1j
  - number: 1j.2.b
    text: |-
      een beslissing om in de effecten te beleggen gebaseerd moet zijn op de bestudering van het gehele prospectus door
      degene die in effecten belegt;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1j
  - number: 1j.2.c
    text: |-
      indien een vordering met betrekking tot de informatie in het prospectus bij een rechterlijke instantie aanhangig
      wordt gemaakt, de eiser in de procedure eventueel volgens de nationale wetgeving van de lidstaten de kosten voor de
      vertaling van het prospectus draagt voordat de vordering wordt ingesteld; en
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1j
  - number: 1j.2.d
    text: |-
      degenen die de samenvatting, met inbegrip van een vertaling ervan, hebben ingediend en om een verklaring als
      bedoeld in [artikel 1f, eerste lid][ref1], ervan hebben verzocht, uitsluitend aansprakelijk kunnen worden
      gesteld, indien de samenvatting gelezen in samenhang met de andere delen van het prospectus misleidend, onjuist of
      inconsistent is.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel1f
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1j
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 1f
        hoofdstuk: Ia
        paragraaf: '3'
  - number: 1k.1
    text: 'Het prospectus wordt opgesteld in:'
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1k
  - number: 1k.1.a
    text: |-
      één enkel document dat, naast een samenvatting die voldoet aan [artikel 1j][ref1], ten minste de gegevens bevat,
      bedoeld in het [eerste lid van artikel 1i][ref2]; of


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel1j
      [ref2]: https://wetten.overheid.nl/BWBR0007708#Artikel1i
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1k
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 1j
        hoofdstuk: Ia
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0007708
        artikel: 1i
        hoofdstuk: Ia
        paragraaf: '5'
  - number: 1k.1.b
    text: 'drie afzonderlijke documenten, bestaande uit:'
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1k
  - number: 1k.1.b.1°
    text: een registratiedocument dat gegevens bevat over de uitgevende instelling;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1k
  - number: 1k.1.b.2°
    text: |-
      een verrichtingsnota die gegevens bevat over de effecten die aan het publiek worden aangeboden of waarvoor een
      aanvraag tot toelating tot de handel op een gereglementeerde markt wordt ingediend; en
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1k
  - number: 1k.1.b.3°
    text: |-
      een samenvatting die voldoet aan [artikel 1j][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel1j
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1k
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 1j
        hoofdstuk: Ia
        paragraaf: '5'
  - number: 1k.2
    text: |-
      De uitgevende instelling die in het bezit is van een registratiedocument dat deel uitmaakt van een reeds
      goedgekeurd prospectus, stelt alleen dan een nieuwe verrichtingsnota en een samenvatting op, indien effecten aan
      het publiek worden aangeboden of tot de handel op een gereglementeerde markt worden toegelaten.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1k
  - number: 1k.3
    text: |-
      Indien zich na de goedkeuring van het meest actuele registratiedocument of van enig document ter aanvulling van
      het prospectus overeenkomstig [artikel 3b, eerste lid, van de wet][ref1] een verandering of recente ontwikkeling
      van betekenis heeft voorgedaan die de beoordeling van de aanbieding door degene die in effecten belegt zou
      kunnen beïnvloeden, bevat de verrichtingsnota, bedoeld in het tweede lid, de gegevens die normaliter in het
      registratiedocument worden vermeld. De verrichtingsnota en de samenvatting vormen tezamen met het in het tweede lid
      bedoelde registratiedocument een nieuw prospectus.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel3b
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1k
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: 3b
  - number: 1l.1
    text: |-
      De uitgevende instelling, aanbieder of aanvrager van toelating van effecten tot de handel op een
      gereglementeerde markt kan, indien het de hierna genoemde categorieën effecten betreft, ervoor kiezen om
      het prospectus op te stellen in de vorm van een basisprospectus dat, voorzover van toepassing, de in de
      [artikelen 3b, eerste lid, van de wet][ref1], [1i][ref2] en [1j][ref3] bedoelde informatie bevat betreffende de
      uitgevende instelling en de effecten die aan het publiek worden aangeboden of tot de handel op de gereglementeerde
      markt worden toegelaten:


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel3b
      [ref2]: https://wetten.overheid.nl/BWBR0007708#Artikel1i
      [ref3]: https://wetten.overheid.nl/BWBR0007708#Artikel1j
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1l
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: 3b
      - id: ref2
        bwb_id: BWBR0007708
        artikel: 1i
        hoofdstuk: Ia
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0007708
        artikel: 1j
        hoofdstuk: Ia
        paragraaf: '5'
  - number: 1l.1.a
    text: effecten zonder aandelenkarakter die worden aangeboden of uitgegeven in het kader van een aanbiedingsprogramma;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1l
  - number: 1l.1.b
    text: |-
      effecten zonder aandelenkarakter die doorlopend of periodiek door kredietinstellingen als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1°, van de Wet toezicht kredietwezen 1992][ref1] worden aangeboden of
      uitgegeven; indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1l
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
  - number: 1l.1.b.1°
    text: |-
      de opbrengsten van de aanbieding of toelating van de bedoelde effecten overeenkomstig de nationale wettelijke
      bepalingen worden belegd in activa die afdoende dekking vormen voor de verplichtingen die tot de vervaldag uit de
      bedoelde effecten voortvloeien; en
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1l
  - number: 1l.1.b.2°
    text: |-
      deze opbrengsten bij faillissement van de betrokken kredietinstelling bij voorrang worden gebruikt om het kapitaal
      en de verschuldigde rente terug te betalen, onverminderd het bepaalde in [richtlijn nr. 2001/24/EG](32001L0024) van
      het Europees Parlement en de Raad van de Europese Unie van 4 april 2001 betreffende de sanering en de liquidatie
      van kredietinstellingen (PbEG L 125).
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1l
  - number: 1l.2
    text: |-
      Indien de uitgevende instelling de definitieve voorwaarden van de aanbieding niet in het basisprospectus en evenmin
      in een document ter aanvulling van het prospectus vermeldt, stelt zij deze bij elke aanbieding van effecten aan het
      publiek of toelating van effecten tot de handel op een gereglementeerde markt algemeen verkrijgbaar en deponeert
      zij de definitieve voorwaarden zo spoedig mogelijk bij de toezichthoudende autoriteit, voor zover mogelijk vóór
      de aanvang van de aanbieding van effecten aan het publiek of de toelating van effecten tot de handel op een
      gereglementeerde markt. [Artikel 1n, eerste lid][ref1], is daarbij van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel1n
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1l
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 1n
        hoofdstuk: Ia
        paragraaf: '5'
  - number: 1m.1
    text: |-
      Indien in het prospectus informatie door middel van verwijzing wordt opgenomen, wordt verwezen naar eerder of
      gelijktijdig met het prospectus algemeen verkrijgbaar gestelde documenten die door de toezichthoudende autoriteit,
      of, indien van toepassing, door een bevoegde toezichthoudende instantie van een andere lidstaat, in overeenstemming
      met de prospectusrichtlijn of de titels IV of V van de [richtlijn nr. 2001/34/EG](32001L0034) van het Europees
      Parlement en de Raad van de Europese Unie van 28 mei 2001 betreffende de toelating van effecten tot de officiële
      notering aan een effectenbeurs en de informatie die over deze effecten moet worden gepubliceerd (PbEG L 184), zijn
      goedgekeurd of bij de toezichthoudende autoriteit of de instantie van een andere lidstaat zijn gedeponeerd.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1m
  - number: 1m.2
    text: |-
      De informatie waarnaar in het prospectus wordt verwezen, is de meest recente die de uitgevende instelling algemeen
      verkrijgbaar heeft gesteld.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1m
  - number: 1m.3
    text: In de samenvatting wordt geen informatie door middel van verwijzing opgenomen.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1m
  - number: 1m.4
    text: |-
      Bij opneming van informatie door middel van verwijzing in het prospectus wordt een lijst met de gebruikte
      verwijzingen verstrekt opdat degene die in effecten belegt specifieke gegevens gemakkelijk kan terugvinden.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1m
  - number: 1n.1
    text: |-
      Indien de uitgevende instelling of de aanbieder de definitieve prijs of ruilverhouding waartegen de effecten aan
      het publiek zullen worden aangeboden en het definitieve aantal effecten dat zal worden aangeboden niet in het
      prospectus vermeldt, vermeldt het prospectus de criteria of de voorwaarden aan de hand waarvan deze gegevens zullen
      worden vastgesteld of, in het geval nog geen definitieve prijs is vermeldt, een maximumprijs.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1n
  - number: 1n.2
    text: |-
      De uitgevende instelling of de aanbieder deponeert bij de toezichthoudende autoriteit de gegevens met betrekking
      tot de definitieve prijs waartegen de effecten aan het publiek zullen worden aangeboden en het definitieve aantal
      aan te bieden effecten en stelt deze gegevens algemeen verkrijgbaar overeenkomstig [artikel 1q, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel1q
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1n
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 1q
        hoofdstuk: Ia
        paragraaf: '6'
  - number: 1n.3
    text: |-
      De toezichthoudende autoriteit kan toestaan dat bepaalde informatie waarvan vermelding krachtens dit besluit of de
      prospectusverordening is voorgeschreven niet in het prospectus behoeft te worden vermeld indien:
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1n
  - number: 1n.3.a
    text: openbaarmaking van die informatie in strijd is met het algemeen belang;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1n
  - number: 1n.3.b
    text: |-
      openbaarmaking van die informatie de uitgevende instelling ernstig zou schaden, en het achterwege blijven van
      de vermelding het publiek niet kan misleiden ten aanzien van feiten en omstandigheden die van essentieel belang
      zijn om tot een verantwoord oordeel te kunnen komen over de uitgevende instelling, de aanbieder, aanvrager van de
      toelating van effecten tot de handel op een gereglementeerde markt, of in voorkomend geval de garant of over de
      rechten die verbonden zijn aan de effecten waarop het prospectus betrekking heeft; of
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1n
  - number: 1n.3.c
    text: |-
      dergelijke informatie van minder belang is, uitsluitend voor een specifieke aanbieding van effecten aan het publiek
      of een toelating van effecten tot de handel op een gereglementeerde markt bedoeld is en niet van een zodanige
      aard is dat zij invloed heeft op de beoordeling van de financiële positie en vooruitzichten van de uitgevende
      instelling, de aanbieder, aanvrager van de toelating van effecten tot de handel op een gereglementeerde markt of,
      in voorkomend geval, de garant.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1n
  - number: 1n.4
    text: |-
      In de uitzonderlijke gevallen waarin de ingevolge de artikelen 3 tot en met 22 van de prospectusverordening in
      het prospectus te vermelden gegevens niet aansluiten bij de activiteiten dan wel de rechtsvorm van de uitgevende
      instelling of bij de effecten waarop het prospectus betrekking heeft, neemt de uitgevende instelling, indien zij
      daarover beschikt, gegevens in het prospectus op die gelijkwaardig zijn aan de vereiste gegevens, zonder afbreuk te
      doen aan de adequate informatievoorziening aan beleggers.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1n
  - number: 1o.1
    text: |-
      Een prospectus ten behoeve van het in Nederland aanbieden van effecten aan het publiek of het toelaten van
      effecten tot de handel op een in Nederland gelegen of functionerende gereglementeerde markt ten aanzien waarvan de
      toezichthoudende autoriteit tot goedkeuring bevoegd is, wordt, ongeacht of deze effecten ook in andere lidstaten
      worden aangeboden, opgesteld in de Nederlandse taal of in een taal die in de internationale financiële kringen
      gebruikelijk is.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1o
  - number: 1o.2
    text: |-
      Een prospectus ten behoeve van het in Nederland aanbieden van effecten aan het publiek of het toelaten van
      effecten tot de handel op een in Nederland gelegen of functionerende gereglementeerde markt ten aanzien waarvan een
      toezichthoudende instantie van een andere lidstaat tot goedkeuring bevoegd is, wordt opgesteld in de Nederlandse
      taal of in een taal die in de internationale financiële kringen gebruikelijk is. Indien het prospectus in een
      andere dan de Nederlandse taal is opgesteld, kan de toezichthoudende autoriteit verlangen dat de samenvatting in de
      Nederlandse taal wordt vertaald.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1o
  - number: 1o.3
    text: |-
      Een prospectus ten behoeve van het in een andere lidstaat aanbieden van effecten aan het publiek of het toelaten
      van effecten tot de handel op een in een andere lidstaat gelegen of functionerende gereglementeerde markt ten
      aanzien waarvan de toezichthoudende autoriteit tot goedkeuring bevoegd is, wordt opgesteld in de Nederlandse taal
      of in een taal die in de internationale financiële kringen gebruikelijk is.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1o
  - number: 1o.4
    text: |-
      Een prospectus ten behoeve van het toelaten van effecten zonder aandelenkarakter met een nominale waarde
      per eenheid van ten minste € 50.000 tot de handel op een in een andere lidstaat gelegen of functionerende
      gereglementeerde markt ten aanzien waarvan de toezichthoudende autoriteit tot goedkeuring bevoegd is, of ten
      behoeve van het toelaten van effecten zonder aandelenkarakter met een nominale waarde per eenheid van ten minste
      € 50.000 tot de handel op een in Nederland gelegen of functionerende gereglementeerde markt ten aanzien waarvan de
      toezichthoudende instantie van een andere lidstaat tot goedkeuring bevoegd is, wordt opgesteld in een taal die door
      de toezichthoudende autoriteit en de toezichthoudende instantie van de andere lidstaat worden aanvaard of een taal
      die in de internationale financiële kringen gebruikelijk is.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1o
  - number: 1p.1
    text: |-
      Een uitgevende instelling, aanbieder of aanvrager van de toelating van effecten tot de handel op een
      gereglementeerde markt draagt er zorg voor dat een reclame-uiting die betrekking heeft op het aanbieden van
      effecten aan het publiek of betreffende de toelating van effecten tot de handel op de gereglementeerde markt:
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1p
  - number: 1p.1.a
    text: |-
      vermeldt dat er een prospectus algemeen verkrijgbaar is of wordt gesteld en waar het prospectus kan worden
      verkregen; en
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1p
  - number: 1p.1.b
    text: |-
      als reclame-uiting herkenbaar is en informatie bevat die niet onjuist of misleidend is en in overeenstemming is met
      de informatie die in het prospectus is of wordt opgenomen.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1p
  - number: 1p.2
    text: |-
      Een uitgevende instelling, aanbieder of aanvrager van de toelating van effecten tot de handel op een
      gereglementeerde markt doet geen mondelinge of schriftelijke mededelingen die betrekking hebben op de aanbieding
      van effecten aan het publiek of de toelating van effecten tot de handel op de gereglementeerde markt die niet
      overeenstemmen met de informatie die in het prospectus is vermeld.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1p
  - number: 1p.3
    text: |-
      De uitgevende instelling, aanbieder of aanvrager van toelating van effecten tot de handel op een gereglementeerde
      markt neemt de door hem tot professionele marktpartijen en andere personen gerichte essentiële informatie,
      met inbegrip van in het kader van bijeenkomsten betreffende aanbiedingen van effecten aan het publiek of
      toelatingen van effecten tot de handel op een gereglementeerde markt verstrekte informatie die van belang is
      voor de beoordeling van het vermogen, de financiële positie, het resultaat en de vooruitzichten van de uitgevende
      instelling en de aan de effecten verbonden rechten en plichten, op in het prospectus of, overeenkomstig
      [artikel 3b, eerste lid, van de wet][ref1], in een document ter aanvulling van het prospectus.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel3b
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1p
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: 3b
  - number: 1p.4
    text: |-
      Indien op grond van [artikel 4 van de wet][ref1], of indien van toepassing, op grond van het recht van een andere
      lidstaat, ter zake van een aanbieding van effecten aan het publiek of een toelating van effecten tot de handel op
      een gereglementeerde markt geen prospectus algemeen verkrijgbaar behoeft te worden gesteld, vindt het in het eerste
      tot en met het derde lid bepaalde geen toepassing en wordt de in het derde lid bedoelde informatie verstrekt aan
      diegenen waaraan de aanbieding van effecten aan het publiek is gericht.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel4
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1p
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: '4'
  - number: 1q.1
    text: |-
      Na goedkeuring door de toezichthoudende autoriteit kan het prospectus door de uitgevende instelling, aanbieder of
      aanvrager van de toelating van effecten tot de handel op een gereglementeerde markt, algemeen verkrijgbaar worden
      gesteld. De algemeenverkrijgbaarstelling vindt plaats binnen een redelijke termijn voorafgaand aan en uiterlijk bij
      aanvang van de aanbieding van effecten aan het publiek of de toelating van de betrokken effecten tot de handel op
      de gereglementeerde markt.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1q
  - number: 1q.2
    text: |-
      In geval van een eerste aanbieding aan het publiek of toelating tot de handel op een gereglementeerde markt
      van effecten als bedoeld in [artikel 1a, onderdeel e, onder 1°][ref1], die nog niet tot de handel op een
      gereglementeerde markt zijn toegelaten en die voor de eerste keer tot de handel op een gereglementeerde markt
      zullen worden toegelaten, stelt de aanbieder of aanvrager van de toelating van effecten tot de handel op een
      gereglementeerde het prospectus ten minste zes werkdagen voor het einde van de aanbieding of toelating algemeen
      verkrijgbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel1a
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1q
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 1a
        hoofdstuk: Ia
        paragraaf: '1'
  - number: 1q.3
    text: |-
      De uitgevende instelling, aanbieder of aanvrager van toelating van effecten tot de handel op de gereglementeerde
      markt stelt het prospectus algemeen verkrijgbaar door middel van:
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1q
  - number: 1q.3.a
    text: |-
      publicatie in een landelijk verspreid dagblad in de lidstaat waar de aanbieding van effecten aan het publiek wordt
      gedaan of waar de toelating van effecten tot de handel op de gereglementeerde markt wordt aangevraagd;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1q
  - number: 1q.3.b
    text: |-
      een drukwerk, dat kosteloos kan worden verkregen ten kantore van de houder van de gereglementeerde markt waar
      de effecten tot de handel worden toegelaten, of ten kantore van de uitgevende instelling en ten kantore van de
      effecteninstelling die de effecten plaatst of anderszins werkzaam is bij de totstandkoming van transacties in de
      desbetreffende effecten;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1q
  - number: 1q.3.c
    text: |-
      plaatsing op de website van de uitgevende instelling en, in voorkomend geval, op de website van de
      effecteninstelling die de effecten plaatst of anderszins werkzaam is bij de totstandkoming van transacties in de
      desbetreffende effecten;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1q
  - number: 1q.3.d
    text: |-
      plaatsing op de website van de houder van de gereglementeerde markt waar de toelating van de effecten tot de handel
      werd aangevraagd; of
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1q
  - number: 1q.3.e
    text: plaatsing op de website van de toezichthoudende autoriteit indien deze mogelijkheid wordt geboden.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1q
  - number: 1q.4
    text: |-
      De toezichthoudende autoriteit houdt in het register, bedoeld in [artikel 20a van de wet][ref1], een overzicht
      toegankelijk van alle prospectussen die zij in de voorafgaande twaalf maanden heeft goedgekeurd.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel20a
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1q
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: 20a
  - number: 1q.5
    text: |-
      Indien het prospectus op de wijze, bedoeld in [artikel 1k, eerste lid, onderdeel b][ref1], is opgesteld, kunnen de
      verschillende documenten die het prospectus omvat afzonderlijk algemeen verkrijgbaar worden gesteld op de in het
      derde lid bepaalde wijze. In elk afzonderlijk algemeen verkrijgbaar gesteld document wordt vermeld waar de andere
      delen van het prospectus kunnen worden verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel1k
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1q
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 1k
        hoofdstuk: Ia
        paragraaf: '5'
  - number: 1q.6
    text: |-
      De vorm en inhoud van het algemeen verkrijgbaar gestelde prospectus of de documenten ter aanvulling daarvan
      stemmen steeds geheel overeen met de vorm en inhoud van het prospectus dat door de toezichthoudende autoriteit
      is goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1q
  - number: 1q.7
    text: |-
      Indien het prospectus uitsluitend elektronisch algemeen verkrijgbaar is gesteld, verstrekt de uitgevende
      instelling, aanbieder of aanvrager van de toelating van effecten tot de handel op een gereglementeerde markt of de
      effecteninstelling aan een ieder die daarom verzoekt kosteloos een schriftelijk afschrift van het prospectus.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1q
  - number: 1q.8
    text: |-
      Indien in het prospectus informatie door middel van verwijzing als bedoeld in [artikel 1m][ref1] is opgenomen,
      kunnen de documenten waarnaar wordt verwezen, onverminderd het bepaalde in het eerste tot en met het vijfde lid,
      afzonderlijk algemeen verkrijgbaar worden gesteld. In elk afzonderlijk algemeen verkrijgbaar gesteld document wordt
      vermeld waar de andere delen van het prospectus kunnen worden verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel1m
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1q
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 1m
        hoofdstuk: Ia
        paragraaf: '5'
  - number: 1r.1
    text: |-
      Een prospectus is gedurende twaalf maanden na algemeenverkrijgbaarstelling geldig voor aanbiedingen van effecten
      aan het publiek dan wel voor de toelatingen van effecten tot de handel op een gereglementeerde markt, indien het,
      voorzover van toepassing, wordt aangevuld met de ingevolge [artikel 3b, eerste lid, van de wet][ref1] vereiste
      documenten.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel3b
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1r
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: 3b
  - number: 1r.2
    text: |-
      In geval van een aanbiedingsprogramma is het eerder ingediende basisprospectus geldig gedurende een periode van ten
      hoogste twaalf maanden na algemeenverkrijgbaarstelling.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1r
  - number: 1r.3
    text: |-
      Het basisprospectus is voor de in [artikel 1l, eerste lid, onderdeel b][ref1], bedoelde effecten zonder
      aandelenkarakter geldig vanaf algemeenverkrijgbaarstelling tot het tijdstip waarop de betrokken effecten niet
      langer doorlopend of periodiek worden uitgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel1l
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1r
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 1l
        hoofdstuk: Ia
        paragraaf: '5'
  - number: 1r.4
    text: |-
      Een eerder gedeponeerd registratiedocument als bedoeld in [artikel 1k, eerste lid, onderdeel b, onder 1°][ref1],
      is geldig voor een periode van ten hoogste twaalf maanden na algemeenverkrijgbaarstelling van het
      registratiedocument, indien het overeenkomstig [artikel 3b, eerste lid, van de wet][ref2] is geactualiseerd.
      Het registratiedocument dat vergezeld gaat van de eventueel overeenkomstig [artikel 1k, derde lid][ref3]
      geactualiseerde verrichtingsnota en de samenvatting, wordt als een geldig prospectus beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel1k
      [ref2]: https://wetten.overheid.nl/BWBR0007657#Artikel3b
      [ref3]: https://wetten.overheid.nl/BWBR0007708#Artikel1k
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1r
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 1k
        hoofdstuk: Ia
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0007657
        artikel: 3b
      - id: ref3
        bwb_id: BWBR0007708
        artikel: 1k
        hoofdstuk: Ia
        paragraaf: '5'
  - number: 1s.1
    text: |-
      De samenvatting, bedoeld in [artikel 1j][ref1], en de eventuele vertaling daarvan worden zo nodig
      door de uitgevende instelling aangevuld met de nieuwe in het aanvullende document, bedoeld in
      [artikel 3b, eerste lid, van de wet][ref2] opgenomen informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel1j
      [ref2]: https://wetten.overheid.nl/BWBR0007657#Artikel3b
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1s
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 1j
        hoofdstuk: Ia
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0007657
        artikel: 3b
  - number: 1s.2
    text: |-
      Het document ter aanvulling van het prospectus, bedoeld in [artikel 3b, eerste lid, van de wet][ref1] maakt, na
      goedkeuring door de toezichthoudende autoriteit, deel uit van het prospectus.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel3b
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1s
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: 3b
  - number: 1s.3
    text: |-
      Het document ter aanvulling van het prospectus, bedoeld in [artikel 3b, eerste lid, van de wet][ref1] wordt
      algemeen verkrijgbaar gesteld op de wijze als beschreven in [artikel 1q, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel3b
      [ref2]: https://wetten.overheid.nl/BWBR0007708#Artikel1q
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1s
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: 3b
      - id: ref2
        bwb_id: BWBR0007708
        artikel: 1q
        hoofdstuk: Ia
        paragraaf: '6'
  - number: 1s.4
    text: |-
      Indien ter zake van een aanbieding van effecten aan het publiek een document ter aanvulling van het prospectus,
      als bedoeld in het eerste lid, algemeen verkrijgbaar is gesteld, heeft degene die terzake van deze effecten een
      overeenkomst inzake het kopen of verkrijgen van deze effecten is aangegaan of een aanbod gericht op het aangaan van
      een overeenkomst inzake het kopen of verkrijgen van deze effecten heeft gedaan, het recht om binnen twee werkdagen
      na de publicatie van dat document de overeenkomst te ontbinden of het aanbod te herroepen.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1s
  - number: 1s.5
    text: |-
      Indien ter zake van een toelating van effecten tot de handel op een gereglementeerde markt een document ter
      aanvulling van het prospectus als bedoeld in [artikel 3b, eerste lid, van de wet][ref1], algemeen verkrijgbaar is
      gesteld, komt het in het vierde lid genoemde recht tevens toe aan degene die een overeenkomst inzake het kopen of
      verkrijgen van deze effecten is aangegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel3b
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1s
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: 3b
  - number: 1t
    text: |-
      Dit hoofdstuk is uitsluitend van toepassing op het in of vanuit Nederland aanbieden van effecten waarop
      [artikel 3, vierde lid, van de wet][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel3
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel1t
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: '3'
  - number: '2.1'
    text: |-
      Een prospectus bevat de gegevens die, gelet op de aard van de uitgevende instelling en van de aangeboden effecten,
      redelijkerwijs van belang zijn voor de beoordeling van het vermogen, de financiële positie, het resultaat en de
      vooruitzichten van de uitgevende instelling en van de rechten en verplichtingen die aan de effecten verbonden zijn.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel2
  - number: '2.2'
    text: 'Een prospectus bevat ten minste de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel2
  - number: 2.2.a
    text: |-
      voor aandeelbewijzen, optiebewijzen, warrants, inschrijvingen in aandelenregisters, winst- en oprichtersbewijzen,
      rechten van deelgenootschap, en soortgelijke waardepapieren dan wel rechten: de gegevens, bedoeld in de rubrieken
      1.1 tot en met 9.2 en 10.1 tot en met 10.20 van de bij dit besluit behorende bijlage;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel2
  - number: 2.2.b
    text: |-
      voor schuldbrieven, inschrijvingen in schuldregisters, en soortgelijke waardepapieren dan wel rechten: de gegevens,
      bedoeld in de rubrieken 1.1 tot en met 9.2 en 11.1 tot en met 11.24 van de bij dit besluit behorende bijlage;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel2
  - number: 2.2.c
    text: |-
      voor certificaten van aandelen en soortgelijke waardepapieren: de gegevens, bedoeld in de rubrieken 12.1 tot en
      met 13.7 van de bij dit besluit behorende bijlage alsmede, indien de instelling die de oorspronkelijke effecten
      uitgeeft niet de instelling is die de certificaten uitgeeft, met betrekking tot de onderliggende waarden de
      gegevens als bedoeld in de rubrieken 1.1 tot en met 9.2 en 10.1 tot en met 10.20 van de bij dit besluit behorende
      bijlage;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel2
  - number: 2.2.d
    text: |-
      voor opties en soortgelijke rechten: de gegevens, bedoeld in de rubrieken 14.1 tot en met 20.5 en 21.1 tot en met
      21.7 van de bij dit besluit behorende bijlage;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel2
  - number: 2.2.e
    text: |-
      voor rechten op overdracht op termijn van goederen: de gegevens, bedoeld in de rubrieken 14.1 tot en met 20.5 en
      22.1 tot en met 22.7 van de bij dit besluit behorende bijlage;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel2
  - number: 2.2.f
    text: |-
      voor recepissen van waarden als hiervoor bedoeld: de gegevens, bedoeld in de rubrieken van de bij dit besluit
      behorende bijlage die van toepassing zijn op de effecten waarvoor de recepissen worden uitgegeven.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel2
  - number: '2.3'
    text: |-
      Indien de bestaansperiode van de uitgevende instelling korter is dan de tijdsduur, genoemd in de verschillende
      rubrieken waarnaar in het tweede lid wordt verwezen, behoeft de informatie slechts voor de bestaansperiode van de
      uitgevende instelling te worden verstrekt onder opgave van redenen daarvan in het prospectus.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel2
  - number: '2.4'
    text: |-
      De toezichthoudende autoriteit kan verlangen dat een prospectus in een of meer door hem te bepalen talen wordt
      gesteld indien dit, gelet op de voorgenomen of mogelijke verspreiding van het prospectus, naar het oordeel van de
      toezichthoudende autoriteit noodzakelijk is voor een adequate informatieverschaffing aan de beleggers.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel2
  - number: '2.5'
    text: De toezichthoudende autoriteit kan regels stellen met betrekking tot de indeling van het prospectus.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel2
  - number: '4'
    text: |-
      In advertenties en documenten waarin een aanbieding van effecten in het vooruitzicht wordt gesteld, wordt vermeld
      dat een prospectus openbaar zal worden gemaakt alsmede op welke plaats en op welk tijdstip het prospectus algemeen
      verkrijgbaar zal worden gesteld. Afschriften van de advertenties en de documenten worden vóór het tijdstip waarop
      het prospectus openbaar wordt gemaakt of algemeen verkrijgbaar wordt gesteld aan de toezichthoudende autoriteit
      overgelegd.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel4
  - number: '5'
    text: |-
      Vóór het tijdstip waarop een aanbieding wordt gedaan, wordt een prospectus aan de toezichthoudende autoriteit
      overgelegd en uiterlijk op dat tijdstip algemeen verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel5
  - number: '6.1'
    text: |-
      Alle nieuwe feiten die zich voordoen of worden geconstateerd tussen het tijdstip van vaststelling van een
      prospectus en het tijdstip waarop de desbetreffende aanbieding eindigt en die van belang kunnen zijn voor
      de beoordeling van het vermogen, de financiële positie, het resultaat en de vooruitzichten van de uitgevende
      instelling en van de rechten en verplichtingen die aan de effecten zijn verbonden, alsmede onvolledigheden,
      onnauwkeurigheden of onjuistheden in het prospectus, worden vermeld of gecorrigeerd in een document dat ter
      aanvulling van het prospectus algemeen verkrijgbaar wordt gesteld. Dit document wordt vóór het tijdstip waarop het
      algemeen verkrijgbaar wordt gesteld aan de toezichthoudende autoriteit overgelegd en onverwijld bij het prospectus
      gevoegd. Vanaf dat moment maakt het document deel uit van het prospectus.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel6
  - number: '6.2'
    text: |-
      Indien minder dan twaalf maanden voor het tijdstip waarop een aanbieding wordt gedaan een prospectus algemeen
      verkrijgbaar is gesteld dat voldeed aan de vereisten van [artikel 2][ref1], kan ter zake van de aanbieding worden
      volstaan met een document als bedoeld in het eerste lid. Dit document mag evenwel slechts algemeen verkrijgbaar
      worden gesteld tezamen met of onder uitdrukkelijke verwijzing naar het in de eerste volzin bedoelde prospectus.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel2
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: '2'
        hoofdstuk: II
  - number: 6a.1
    text: |-
      Een uitgevende instelling waarvan effecten als bedoeld in [artikel 1a, onderdeel d][ref1], tot de handel op
      een gereglementeerde markt zijn toegelaten en waarvan het prospectus op grond van [artikel 3 van de wet][ref2]
      door de toezichthoudende autoriteit is goedgekeurd of waarvan het prospectus, indien die effecten na
      inwerkingtreding van dit besluit tot de handel op een gereglementeerde markt zouden zijn toegelaten, op grond van
      [artikel 1b, eerste lid][ref3], door de toezichthoudende autoriteit zou moeten worden goedgekeurd, stelt ten minste
      jaarlijks een document algemeen verkrijgbaar dat voldoet aan het in het tweede lid bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0007657#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0007708#Artikel1b
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 1a
        hoofdstuk: Ia
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007657
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0007708
        artikel: 1b
        hoofdstuk: Ia
        paragraaf: '2'
  - number: 6a.2
    text: 'Het document, bedoeld in het eerste lid, bevat of verwijst naar:'
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel6a
  - number: 6a.2.a
    text: |-
      de informatie die met inachtneming van de vierde richtlijn van het Europees Parlement en de Raad van de Europese
      Unie van 25 juli 1978 op de grondslag van artikel 54, lid 3, sub g, van het verdrag betreffende de jaarrekening
      van bepaalde vennootschapsvormen (PbEG L 222), de zevende richtlijn van het Europees Parlement en de Raad van
      de Europese Unie van 13 juni 1983 op de grondslag van artikel 54, lid 3, sub g van het verdrag betreffende de
      geconsolideerde jaarrekening (PbEG L 193) en de [richtlijn nr. 2001/34/EG](32001L0034) van het Europees Parlement
      en de Raad van de Europese Unie van 28 mei 2001 betreffende de toelating van effecten tot de officiële notering
      aan een effectenbeurs en de informatie die over deze effecten moet worden gepubliceerd (PbEG L 184) en [verordening
      (EG) nr. 1606/2002](32002R1606) van het Europees Parlement en de Raad van de Europese Unie van 19 juli 2002
      betreffende de toepassing van internationale standaarden voor jaarrekeningen (PbEG L 243) is opgesteld en door de
      uitgevende instelling in de twaalf maanden voorafgaand aan de publicatie van de jaarrekening algemeen verkrijgbaar
      is gesteld; en
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel6a
  - number: 6a.2.b
    text: |-
      de overige informatie die door de uitgevende instelling ingevolge wettelijke regelingen inzake het toezicht op
      het effectenverkeer in enige staat in de twaalf maanden voorafgaand aan de publicatie van de jaarrekening algemeen
      verkrijgbaar is gesteld.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel6a
  - number: 6a.3
    text: |-
      Indien de uitgevende instelling informatie door middel van verwijzing in het document, bedoeld in het eerste lid,
      opneemt, wordt aangegeven waar en op welke wijze die informatie kan worden verkregen.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel6a
  - number: 6a.4
    text: |-
      De uitgevende instelling, bedoeld in het eerste lid, deponeert het in het eerste lid bedoelde document bij de
      toezichthoudende autoriteit nadat de jaarrekening is gepubliceerd.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel6a
  - number: 6a.5
    text: |-
      Het eerste tot en met het vierde lid zijn niet van toepassing op uitgevende instellingen waarvan uitsluitend
      effecten zonder aandelenkarakter als bedoeld in [artikel 1a, onderdeel f][ref1], met een nominale waarde per
      eenheid van ten minste € 50.000 zijn aangeboden.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel1a
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 1a
        hoofdstuk: Ia
        paragraaf: '1'
  - number: 6b
    text: |-
      De [artikelen 7 tot en met 9][ref1] zijn uitsluitend van toepassing indien:


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel7
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel6b
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: '7'
        hoofdstuk: III
  - number: 6b.a
    text: |-
      van een uitgevende instelling in of vanuit Nederland uitsluitend effecten als bedoeld in
      [artikel 1 van de wet][ref1] zijn aangeboden, die geen effecten als bedoeld in [artikel 1a, onderdeel d][ref2],
      zijn; of


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007708#Artikel1a
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel6b
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0007708
        artikel: 1a
        hoofdstuk: Ia
        paragraaf: '1'
  - number: 6b.b
    text: |-
      van een uitgevende instelling in of vanuit Nederland uitsluitend effecten zijn aangeboden die niet tot de handel op
      een op grond van [artikel 22 van de wet][ref1] erkende effectenbeurs zijn toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel22
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel6b
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: '22'
  - number: '7.1'
    text: |-
      Voor zover de verplichting tot het opstellen van een jaarrekening en een jaarverslag niet reeds voortvloeit uit
      [boek 2 van het Burgerlijk Wetboek][ref1] zijn op een uitgevende instelling het tweede tot en met twaalfde lid
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: '7.2'
    text: |-
      De uitgevende instelling stelt binnen zes maanden na afloop van ieder boekjaar een jaarrekening en een jaarverslag
      vast. Tevens stelt de uitgevende instelling binnen vier maanden na afloop van de eerste helft van ieder boekjaar de
      halfjaarcijfers vast.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel7
  - number: '7.3'
    text: |-
      De jaarrekening geeft volgens normen die in het maatschappelijk verkeer als aanvaardbaar worden beschouwd een
      zodanig inzicht dat een verantwoord oordeel kan worden gevormd omtrent het vermogen en het resultaat, alsmede,
      voor zover de aard van de jaarrekening dat toelaat, omtrent de solvabiliteit en de liquiditeit van de uitgevende
      instelling. Het jaarverslag geeft een getrouw beeld omtrent de toestand op de balansdatum en de gang van zaken
      gedurende het boekjaar en bevat voorts mededelingen omtrent de verwachte gang van zaken.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel7
  - number: '7.4'
    text: |-
      De halfjaarcijfers bevatten schematisch ten minste gegevens over de netto omzet en het resultaat vóór of na
      belastingen van de uitgevende instelling in de eerste zes maanden van het boekjaar, alsmede een toelichting
      daarop die alle gegevens bevat die redelijkerwijs van belang zijn voor de beoordeling van de ontwikkeling van
      de activiteiten en de resultaten van de uitgevende instelling. Daarbij worden alle bijzondere factoren vermeld
      die invloed hebben gehad op deze activiteiten en op de resultaten over de desbetreffende periode en worden de
      vergelijkbare cijfers van het overeenkomstig tijdvak van het vorige boekjaar gegeven.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel7
  - number: '7.5'
    text: |-
      Het vierde lid is niet van toepassing op een uitgevende instelling waarvan de aandelen zijn toegelaten tot de
      notering aan een in een lidstaat gelegen of werkzame effectenbeurs en die halfjaarcijfers algemeen verkrijgbaar
      stelt, waarvan de opstelling geschiedt overeenkomstig [richtlijn nr. 2001/34/EG](32001L0034) van het Europees
      Parlement en de Raad van de Europese Unie van 28 mei 2001 betreffende de toelating van effecten tot de officiële
      notering aan een effectenbeurs en de informatie die over deze effecten moet worden gepubliceerd (PbEG L 184).
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel7
  - number: '7.6'
    text: |-
      De balans met de toelichting geeft getrouw, duidelijk en stelselmatig de grootte van het vermogen weer, alsmede
      zijn samenstelling in actief- en passiefposten aan het einde van de verslagperiode.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel7
  - number: '7.7'
    text: |-
      De winst- en verliesrekening met de toelichting geeft getrouw, duidelijk en stelselmatig de grootte van het
      resultaat over de verslagperiode weer, alsmede zijn afleiding uit de posten van baten en lasten.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel7
  - number: '7.8'
    text: |-
      De opstelling van de jaarrekening en het jaarverslag geschiedt door een uitgevende instelling met zetel in
      Nederland zoveel mogelijk overeenkomstig [boek 2 van het Burgerlijk Wetboek][ref1]. De opstelling van de
      jaarrekening en het jaarverslag van een uitgevende instelling met zetel in een andere lid-staat geschiedt
      overeenkomstig de voorschriften van de vierde richtlijn van de Raad van de Europese Gemeenschappen op de grondslag
      van artikel 54, lid 3, sub *g*), van het Verdrag betreffende de jaarrekening van bepaalde vennootschapsvormen
      ([richtlijn nr. 78/660/EEG](31978L0660) van 25 juli 1978) (*PbEG* L 222) en van de zevende richtlijn van de
      Raad van de Europese Gemeenschappen op de grondslag van artikel 54, lid 3, sub *g*) van het Verdrag betreffende
      de geconsolideerde jaarrekening ([richtlijn nr. 83/349/EEG](31983L0349) van 13 juni 1983) (*PbEG* L 193). Voor
      de overige uitgevende instellingen geschiedt de opstelling op gelijkwaardige wijze. In de jaarrekening en het
      jaarverslag wordt meegedeeld overeenkomstig welke voorschriften de opstelling is geschied. Voor zover de opstelling
      van de jaarrekening en het jaarverslag niet geschiedt overeenkomstig [boek 2 van het Burgerlijk Wetboek][ref2] dan
      wel overeenkomstig de in dit lid genoemde richtlijnen, kan de toezichthoudende autoriteit in overeenstemming met
      Onze Minister van Justitie regels stellen met betrekking tot het verschaffen van informatie omtrent de gehanteerde
      waarderingsgrondslagen en de omschrijving van de posten in de jaarrekening.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003045
      - id: ref2
        bwb_id: BWBR0003045
  - number: '7.9'
    text: Het achtste lid is van overeenkomstige toepassing op de opstelling van de halfjaarcijfers.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel7
  - number: '7.10'
    text: |-
      Binnen een week na de vaststelling of, indien de jaarrekening goedkeuring behoeft, na de goedkeuring,
      maakt de uitgevende instelling de jaarrekening en gelijktijdig daarmee de accountantsverklaring, bedoeld in
      [artikel 8, tweede lid][ref1], en het jaarverslag openbaar door neerlegging van een volledig in het Nederlands
      opgesteld exemplaar of, indien dit niet is vervaardigd, van een exemplaar in het Frans, Duits of Engels:


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel8
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: '8'
        hoofdstuk: III
  - number: 7.10.a
    text: |-
      ten kantore van het handelsregister van de plaats waar de uitgevende instelling volgens haar statuten haar zetel
      heeft; dan wel
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel7
  - number: 7.10.b
    text: |-
      indien de uitgevende instelling haar zetel niet in Nederland heeft, ten kantore van het handelsregister van
      Amsterdam.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel7
  - number: '7.11'
    text: De openbaarmaking van de halfjaarcijfers geschiedt overeenkomstig het tiende lid.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel7
  - number: '7.12'
    text: |-
      De jaarrekening, de accountantsverklaring, het jaarverslag en de halfjaarcijfers worden gelijktijdig met de
      openbaarmaking aan de toezichthouder overgelegd.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel7
  - number: '8.1'
    text: |-
      Voor zover dit niet reeds voortvloeit uit [boek 2 van het Burgerlijk Wetboek][ref1] zijn op een uitgevende
      instelling het tweede tot en met vierde lid van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: '8.2'
    text: |-
      Een accountant onderzoekt of de jaarrekening het in [artikel 7, derde lid][ref1], bedoelde inzicht geeft. De
      bevindingen van de accountant worden in een verklaring neergelegd die in haar geheel bij de jaarrekening wordt
      gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel7
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: '7'
        hoofdstuk: III
  - number: '8.3'
    text: |-
      Indien de halfjaarcijfers door een accountant zijn onderzocht, is het tweede lid van overeenkomstige toepassing.
      Indien dit niet het geval is, wordt hiervan uitdrukkelijk in een verklaring bij de halfjaarcijfers melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel8
  - number: '8.4'
    text: |-
      In afwijking van het tweede en derde lid kunnen de jaarrekening en de halfjaarcijfers van een uitgevende instelling
      die haar zetel niet in Nederland heeft, worden onderzocht door een deskundige die ingevolge het recht van de staat
      waar de uitgevende instelling haar zetel heeft, bevoegd is een verklaring af te geven omtrent de getrouwheid van
      deze stukken.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel8
  - number: '9'
    text: |-
      Een uitgevende instelling maakt zo spoedig mogelijk elk belangrijk nieuw feit betreffende de uitoefening
      van het bedrijf dat niet reeds openbaar is en waarvan een aanzienlijke invloed op de koers van de door die
      instelling uitgegeven effecten kan uitgaan, openbaar. Een afschrift van de openbaarmaking wordt terstond aan de
      toezichthoudende autoriteit overgelegd.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9
  - number: 9a
    text: |-
      Waar ingevolge dit hoofdstuk een openbare mededeling is vereist, wordt daaraan voldaan door een mededeling in een
      landelijk verspreid dagblad. Indien onverwijld een openbare mededeling is vereist, wordt daaraan voldaan door een
      mededeling in een persbericht.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9a
  - number: 9b.1
    text: |-
      Indien een openbaar bod wordt voorbereid of is aangekondigd, doen de bieder en de doelvennootschap, zodra zich
      een omstandigheid voordoet die ter bevordering van een gerechtvaardigde koersvorming van de door hen uitgegeven
      effecten een openbare mededeling noodzakelijk maakt, onverwijld een zodanige mededeling, ieder voor zover het hem
      of haar aangaat.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9b
  - number: 9b.2
    text: 'Als omstandigheid, als bedoeld in het eerste lid, wordt in ieder geval aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9b
  - number: 9b.2.a
    text: |-
      een zodanige stand van besprekingen ter voorbereiding van een openbaar bod, dat de verwachting gerechtvaardigd is
      dat overeenstemming kan worden bereikt;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9b
  - number: 9b.2.b
    text: |-
      de verzending door de bieder van de kennisgeving, bedoeld in [artikel 9d, tweede lid][ref1],
      [9e, tweede lid][ref2], of [9f, tweede lid][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel9d
      [ref2]: https://wetten.overheid.nl/BWBR0007708#Artikel9e
      [ref3]: https://wetten.overheid.nl/BWBR0007708#Artikel9f
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 9d
        hoofdstuk: III_A
      - id: ref2
        bwb_id: BWBR0007708
        artikel: 9e
        hoofdstuk: III_A
      - id: ref3
        bwb_id: BWBR0007708
        artikel: 9f
        hoofdstuk: III_A
  - number: 9b.2.c
    text: |-
      een koersvorming of andere ontwikkeling welke erop kan wijzen dat het voeren van besprekingen over een openbaar bod
      of het eenzijdige voornemen tot het doen van een openbaar bod bekend is bij derden die van deze wetenschap gebruik
      kunnen maken;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9b
  - number: 9b.2.d
    text: |-
      in geval van een vast bod, de definitieve vaststelling van de prijs of ruilverhouding, bedoeld in
      [artikel 9i, onder b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel9i
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 9i
        hoofdstuk: III_A
  - number: 9b.2.e
    text: |-
      in geval van een partieel bod, de definitieve vaststelling van het getal of percentage van de effecten tot de
      verkrijging waarvan het bod strekt dan wel van de prijs of ruilverhouding, bedoeld in [artikel 9k, onder b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel9k
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 9k
        hoofdstuk: III_A
  - number: 9b.2.f
    text: |-
      in geval van een tenderbod, de definitieve vaststelling van het getal of percentage van de effecten tot de
      verkrijging waarvan het bod strekt dan wel van de prijs, bedoeld in [artikel 9m, onder i][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel9m
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 9m
        hoofdstuk: III_A
  - number: 9b.2.g
    text: |-
      het besluit van de bieder om het openbaar bod, over de voorbereiding waarvan eerder een openbare mededeling is
      gedaan, niet uit te brengen;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9b
  - number: 9b.2.h
    text: |-
      het door een doelvennootschap, ten aanzien waarvan eerder een openbare mededeling over de voorbereiding van een
      openbaar bod op haar effecten is gedaan, aan de bieder of aan een derde uitgeven van effecten of verschaffen van
      een recht tot het nemen van door de doelvennootschap uit te geven effecten;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9b
  - number: 9b.2.i
    text: |-
      een openbare mededeling door een derde waaruit blijkt dat deze een openbaar bod op dezelfde effecten voorbereidt
      of uitbrengt.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9b
  - number: 9b.3
    text: |-
      Vanaf het tijdstip waarop een openbare mededeling over het voorbereiden of uitbrengen van een openbaar bod is
      gedaan doen de bieder en de doelvennootschap, ieder met betrekking tot de door henzelf verrichte transacties of
      gesloten overeenkomsten, aan de toezichthoudende autoriteit opgave van de na dat tijdstip verrichte transacties
      in de effecten waarop het bod betrekking heeft, respectievelijk van met betrekking tot die transacties gesloten
      overeenkomsten, onder vermelding van de daarvoor geldende voorwaarden en van de omvang van de bestaande onderlinge
      kapitaaldeelnemingen, zowel direct als indirect. De opgave wordt telkens gedaan onverwijld nadat de betrokken
      transactie of overeenkomst tot stand is gekomen of bekend is geworden. Indien de bieder of de doelvennootschap
      met betrekking tot een door hem verrichte transactie in effecten deze transactie reeds heeft gemeld overeenkomstig
      [artikel 47a, eerste lid, van de wet][ref1], kan een melding van de transactie achterwege blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel47a
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: 47a
  - number: 9b.4
    text: |-
      Het eerste tot en met derde lid zijn van toepassing tot en met de dag waarop een openbare mededeling is gedaan over
      gestanddoening of intrekking van het bod of waarop openbaar is medegedeeld dat een bod dat in voorbereiding was,
      niet zal worden uitgebracht.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9b
  - number: 9c
    text: |-
      De mededeling, bedoeld in [artikel 9b, eerste lid][ref1], vermeldt voor zover van toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel9b
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9c
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 9b
        hoofdstuk: III_A
  - number: 9c.a
    text: |-
      de omstandigheid, bedoeld in [artikel 9b, tweede lid, onder a][ref1], alsmede de namen van de bieder en de
      doelvennootschap;


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel9b
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9c
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 9b
        hoofdstuk: III_A
  - number: 9c.b
    text: |-
      het verzenden van de kennisgeving, bedoeld in [artikel 9b, tweede lid, onder b][ref1], alsmede de namen van de
      bieder en de doelvennootschap.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel9b
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9c
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 9b
        hoofdstuk: III_A
  - number: 9c.c
    text: |-
      de naam van de bieder of doelvennootschap die bij de koersvorming of andere ontwikkelingen, bedoeld in
      [artikel 9b, tweede lid, onder c][ref1], zijn betrokken, alsmede het feit dat besprekingen over een openbaar bod
      worden gevoerd respectievelijk dat het voornemen bestaat tot het uitbrengen van een openbaar bod.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel9b
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9c
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 9b
        hoofdstuk: III_A
  - number: 9c.d
    text: |-
      de vastgestelde prijs of ruilverhouding, bedoeld in [artikel 9b, tweede lid, onder d][ref1], alsmede de namen
      van de bieder en de doelvennootschap, de op dat moment reeds vastgestelde voorwaarden waarvan de verplichting tot
      nakoming van het bod afhankelijk zal worden gesteld, alsmede een indicatie van de datum van verkrijgbaarstelling
      van het biedingsbericht;


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel9b
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9c
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 9b
        hoofdstuk: III_A
  - number: 9c.e
    text: |-
      het getal of percentage van de effecten tot de verkrijging waarvan het bod strekt dan wel de prijs of
      ruilverhouding, bedoeld in [artikel 9b, tweede lid, onder e][ref1], alsmede de namen van de bieder en de
      doelvennootschap, alsmede een indicatie van de datum van publicatie van het biedingsbericht;


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel9b
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9c
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 9b
        hoofdstuk: III_A
  - number: 9c.f
    text: |-
      het getal of percentage van de effecten tot de verkrijging waarvan het bod strekt dan wel de prijs of
      ruilverhouding, bedoeld in [artikel 9b, tweede lid, onder f][ref1], alsmede de namen van de bieder en de
      doelvennootschap en een indicatie van de datum van publicatie van het biedingsbericht;


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel9b
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9c
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 9b
        hoofdstuk: III_A
  - number: 9c.g
    text: |-
      het besluit tot het niet-uitbrengen van het bod, bedoeld in [artikel 9b, tweede lid, onder g][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel9b
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9c
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 9b
        hoofdstuk: III_A
  - number: 9c.h
    text: |-
      de naam van degene die de in [artikel 9b, tweede lid, onder h][ref1], bedoelde effecten verwerft of eventueel zal
      verwerven, het nominale bedrag daarvan en de prijs of uitgiftekoers, alsmede de motieven voor de in dat lid, onder
      h, bedoelde handeling;


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel9b
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9c
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 9b
        hoofdstuk: III_A
  - number: 9c.i
    text: |-
      een gemotiveerde standpuntbepaling door de doelvennootschap over het door de in
      [artikel 9b, tweede lid, onder i][ref1], bedoelde derde uit te brengen of voor te bereiden bod, of een verklaring
      waarom geen onmiddellijke standpuntbepaling daarover wordt bekendgemaakt, vergezeld van de mededeling wanneer deze
      tegemoet kan worden gezien;


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel9b
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9c
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 9b
        hoofdstuk: III_A
  - number: 9c.j
    text: |-
      de maatregelen van de bieder tot welke het bod, bedoeld in [artikel 9b, tweede lid, onder i][ref1], hem aanleiding
      geeft, hetzij, indien geen onmiddellijke maatregelen worden overwogen, een indicatie omtrent het tijdstip waarop
      een mededeling omtrent te nemen maatregelen kan worden verwacht.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel9b
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9c
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 9b
        hoofdstuk: III_A
  - number: 9d.1
    text: |-
      In geval van een voorgenomen vast bod doet de bieder, in afwijking van het bepaalde in
      [artikel 9b, tweede lid, onderdeel d][ref1], geen openbare mededeling over de prijs of ruilverhouding, bedoeld in
      [artikel 9i, onder b][ref2], alvorens volledig uitvoering te hebben gegeven aan het tweede en derde lid, tenzij
      overeenstemming tussen de bieder en de doelvennootschap is bereikt, of de verwachting gerechtvaardigd is dat
      overeenstemming kan worden bereikt over het bod.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel9b
      [ref2]: https://wetten.overheid.nl/BWBR0007708#Artikel9i
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9d
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 9b
        hoofdstuk: III_A
      - id: ref2
        bwb_id: BWBR0007708
        artikel: 9i
        hoofdstuk: III_A
  - number: 9d.2
    text: |-
      De bieder stelt de doelvennootschap schriftelijk in kennis van zijn voornemen de prijs of ruilverhouding, bedoeld
      in [artikel 9i, onder b][ref1], voor het uit te brengen bod bekend te maken en nodigt de doelvennootschap uit om
      binnen zeven dagen na ontvangst van deze kennisgeving overleg te plegen over het voornemen van de bieder tot het
      doen van een bod, over de in het eerste lid bedoelde prijs of ruilverhouding, over de aan het voorgenomen bod ten
      grondslag liggende motieven en over de voornemens met betrekking tot het in verband daarmee te voeren beleid ten
      aanzien van de doelvennootschap en de met haar verbonden onderneming, alsmede over de wijze van financiering van
      het uit te brengen bod indien dit een prijs vermeldt.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel9i
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9d
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 9i
        hoofdstuk: III_A
  - number: 9d.3
    text: |-
      De bieder stelt, indien de doelvennootschap geen gebruik heeft gemaakt van de gelegenheid tot het plegen van
      het in het tweede lid bedoelde overleg of dit overleg niet tot overeenstemming heeft geleid, de doelvennootschap
      schriftelijk in kennis van de prijs of ruilverhouding, bedoeld in [artikel 9i, onder b][ref1], en van de motieven
      welke aan het voorgenomen bod ten grondslag liggen, en van de voornemens met betrekking tot het in verband daarmee
      te voeren beleid ten aanzien van de doelvennootschap en de met haar verbonden onderneming, alsmede van de wijze van
      financiering van het uit te brengen bod, indien dit een prijs vermeldt.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel9i
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9d
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 9i
        hoofdstuk: III_A
  - number: 9d.4
    text: |-
      De bieder en de doelvennootschap stellen, indien zij een openbare mededeling doen met betrekking tot het bod, de
      inhoud daarvan schriftelijk ter kennis van de doelvennootschap respectievelijk van de bieder, uiterlijk ten tijde
      van het doen van deze openbare mededeling.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9d
  - number: 9e.1
    text: |-
      In geval van een voorgenomen partieel bod doet de bieder, in afwijking van het bepaalde in
      [artikel 9b, tweede lid, onderdeel d][ref1], geen openbare mededeling over het getal of percentage van
      de effecten tot de verwerving waarvan dat bod strekt dan wel de prijs of ruilverhouding, bedoeld in
      [artikel 9k, onder b][ref2], alvorens volledig uitvoering te hebben gegeven aan het tweede en derde lid, tenzij
      overeenstemming tussen de bieder en de doelvennootschap is bereikt of de verwachting gerechtvaardigd is dat
      overeenstemming kan worden bereikt over het bod.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel9b
      [ref2]: https://wetten.overheid.nl/BWBR0007708#Artikel9k
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9e
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 9b
        hoofdstuk: III_A
      - id: ref2
        bwb_id: BWBR0007708
        artikel: 9k
        hoofdstuk: III_A
  - number: 9e.2
    text: |-
      De bieder stelt de doelvennootschap schriftelijk in kennis van zijn voornemen het getal of percentage
      van de effecten tot de verwerving waarvan het bod strekt dan wel de prijs of ruilverhouding, bedoeld in
      [artikel 9k, onder b][ref1], bekend te maken en nodigt de doelvennootschap uit om binnen zeven dagen na ontvangst
      van deze kennisgeving overleg te plegen over het voornemen van de bieder tot het doen van een bod, over dat
      getal of percentage dan wel die prijs of ruilverhouding en over de aan het voorgenomen bod ten grondslag liggende
      motieven.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel9k
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9e
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 9k
        hoofdstuk: III_A
  - number: 9e.3
    text: |-
      De bieder stelt, indien de doelvennootschap geen gebruik heeft gemaakt van de gelegenheid tot het plegen van
      het in het tweede lid bedoelde overleg of dit overleg niet tot overeenstemming heeft geleid, de doelvennootschap
      schriftelijk in kennis van het getal of percentage van de effecten tot de verwerving waarvan het bod strekt dan wel
      de prijs of ruilverhouding, bedoeld in [artikel 9k, onder b][ref1], en van de motieven welke aan het voorgenomen
      bod ten grondslag liggen.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel9k
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9e
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 9k
        hoofdstuk: III_A
  - number: 9e.4
    text: |-
      De bieder en de doelvennootschap stellen, indien zij een openbare mededeling doen met betrekking tot het bod de
      inhoud daarvan schriftelijk ter kennis van de doelvennootschap respectievelijk de bieder, uiterlijk ten tijde van
      het doen van deze openbare mededeling.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9e
  - number: 9f.1
    text: |-
      In geval van een voorgenomen tenderbod doet de bieder, in afwijking van het bepaalde in
      [artikel 9b, tweede lid, onderdeel d][ref1], geen openbare mededeling over het getal of percentage dan wel de
      prijs, bedoeld in [artikel 9m, onder i][ref2], alvorens volledig uitvoering te hebben gegeven aan het tweede
      en derde lid, tenzij overeenstemming tussen de bieder en de doelvennootschap is bereikt of de verwachting
      gerechtvaardigd is dat overeenstemming kan worden bereikt over het bod.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel9b
      [ref2]: https://wetten.overheid.nl/BWBR0007708#Artikel9m
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9f
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 9b
        hoofdstuk: III_A
      - id: ref2
        bwb_id: BWBR0007708
        artikel: 9m
        hoofdstuk: III_A
  - number: 9f.2
    text: |-
      De bieder stelt de doelvennootschap schriftelijk in kennis van zijn voornemen het getal of percentage dan wel de
      prijs, bedoeld in [artikel 9m, onder i][ref1], bekend te maken en nodigt de doelvennootschap uit om binnen zeven
      dagen na ontvangst van deze kennisgeving overleg te plegen over het voornemen van de bieder tot het doen van een
      bod, over dat getal of percentage dan wel die prijs en over de aan het voorgenomen bod ten grondslag liggende
      motieven.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel9m
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9f
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 9m
        hoofdstuk: III_A
  - number: 9f.3
    text: |-
      De bieder stelt, indien de doelvennootschap geen gebruik heeft gemaakt van de gelegenheid tot het plegen van
      het in het tweede lid bedoelde overleg of dit overleg niet tot overeenstemming heeft geleid, de doelvennootschap
      schriftelijk in kennis van het getal of het percentage dan wel de prijs bedoeld in [artikel 9m, onder i][ref1], en
      de motieven welke aan het voorgenomen bod ten grondslag liggen.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel9m
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9f
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 9m
        hoofdstuk: III_A
  - number: 9f.4
    text: |-
      De bieder en de doelvennootschap stellen, indien zij een openbare mededeling doen met betrekking tot het bod de
      inhoud daarvan schriftelijk ter kennis van de doelvennootschap respectievelijk de bieder, uiterlijk ten tijde van
      het doen van deze openbare mededeling.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9f
  - number: 9g.1
    text: |-
      De bieder die een openbare mededeling heeft gedaan omtrent een omstandigheid als bedoeld in
      [artikel 9b, tweede lid, onder a of b][ref1], is gehouden binnen dertig dagen na deze mededeling:


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel9b
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9g
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 9b
        hoofdstuk: III_A
  - number: 9g.1.a
    text: |-
      een openbaar bod uit te brengen dan wel in geval van een vast bod een openbare mededeling te doen die ten minste de
      prijs of ruilverhouding vermeldt;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9g
  - number: 9g.1.b
    text: een besluit tot het niet-uitbrengen van het bod openbaar mede te delen; of
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9g
  - number: 9g.1.c
    text: |-
      onder opgave van redenen openbaar mede te delen dat niet binnen dertig dagen een bod of een besluit tot het niet-
      uitbrengen van het bod uitgebracht kan worden of dat geen openbare mededeling omtrent de prijs of ruilverhouding
      als bedoeld onder a kan worden gedaan, onder vermelding van een termijn waarop een besluit ten aanzien van het bod
      of een openbare mededeling omtrent de prijs of ruilverhouding verwacht kan worden.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9g
  - number: 9g.2
    text: 'De bieder deelt zijn bod mede:'
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9g
  - number: 9g.2.a
    text: |-
      in geval van een partieel bod door middel van een biedingsbericht, inhoudende de gegevens, bedoeld in
      [artikel 9k][ref1]. De verkrijgbaarstelling van het biedingsbericht wordt openbaar medegedeeld;


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel9k
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9g
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 9k
        hoofdstuk: III_A
  - number: 9g.2.b
    text: |-
      in geval van een tenderbod door middel van een biedingsbericht, inhoudende de gegevens, bedoeld in
      [artikel 9m][ref1]. De verkrijgbaarstelling van het biedingsbericht wordt openbaar medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel9m
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9g
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 9m
        hoofdstuk: III_A
  - number: 9g.3
    text: |-
      Binnen zes weken na de openbare mededeling overeenkomstig het eerste lid, onder a, deelt de bieder zijn bod mede
      door middel van een biedingsbericht, inhoudende de gegevens, bedoeld in [artikel 9i][ref1]. De verkrijgbaarstelling
      van het biedingsbericht wordt openbaar medegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel9i
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9g
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 9i
        hoofdstuk: III_A
  - number: 9g.4
    text: |-
      De toezichthoudende autoriteit kan de in het eerste en derde lid bedoelde termijn, op verzoek van de bieder
      verlengen.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9g
  - number: 9h.1
    text: |-
      Een vast bod is gericht tot alle rechthebbenden van de uitstaande effecten waarop het bod betrekking heeft,
      behoudens de bevoegdheid van de bieder om daarvan uit te sluiten effecten, die ten tijde van het uitbrengen van het
      bod nog niet waren uitgegeven of waarvan op dat tijdstip de uitgifte nog niet bekend was gemaakt, noch ter kennis
      van de bieder was gebracht.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9h
  - number: 9h.2
    text: Aan alle rechthebbenden van dezelfde soort effecten wordt hetzelfde bod gedaan.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9h
  - number: 9h.3
    text: |-
      De bieder treft een regeling met betrekking tot de levering en betaling van de aangeboden effecten, welke regeling
      voldoet aan door de toezichthoudende autoriteit te stellen regels.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9h
  - number: 9h.4
    text: |-
      De bieder heeft de bevoegdheid het bod gestand te doen indien effecten tot een geringer bedrag of aantal zijn
      aangemeld, dan het bedrag of aantal van welker aanbieding hij binnen de aanmeldingstermijn zijn verplichting tot
      gestanddoening van het bod afhankelijk stelt.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9h
  - number: 9h.5
    text: |-
      Indien de bieder het bod gestand doet, betaalt de bieder steeds voor alle ingevolge dat bod aangemelde effecten
      van enige soort waarop dat bod betrekking heeft een vergoeding welke overeenkomt met de hoogste door hem betaalde
      vergoeding in verband met transacties als bedoeld in [artikel 9b, derde lid][ref1], met uitzondering van in
      regelmatig beursverkeer tot stand gekomen transacties.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel9b
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9h
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 9b
        hoofdstuk: III_A
  - number: 9i
    text: 'Het biedingsbericht met betrekking tot een vast bod houdt ten minste in:'
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9i
  - number: 9i.a
    text: de naam van de bieder;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9i
  - number: 9i.b
    text: het voorstel tot overneming van effecten volgens een daarbij aan te geven prijs of ruilverhouding;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9i
  - number: 9i.c
    text: |-
      de mededeling of met de doelvennootschap overleg over het bod is gevoerd en of dit overleg tot overeenstemming
      heeft geleid;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9i
  - number: 9i.d
    text: |-
      de verklaring dat het bod is gericht tot alle rechthebbenden van de uitstaande effecten van de soorten waarop het
      bod betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9i
  - number: 9i.e
    text: de verklaring dat aan alle rechthebbenden van dezelfde soort effecten hetzelfde bod wordt gedaan;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9i
  - number: 9i.f
    text: |-
      het aantal effecten van welker aanbieding binnen de aanmeldingstermijn de bieder zijn verplichting tot
      gestanddoening van het bod afhankelijk stelt;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9i
  - number: 9i.g
    text: |-
      de eventuele verdere voorwaarden van welker vervulling de bieder zijn verplichting tot nakoming van het openbaar
      bod afhankelijk stelt, onverminderd [artikel 9t, eerste en tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel9t
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9i
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 9t
        hoofdstuk: III_A
  - number: 9i.h
    text: |-
      een duidelijke motivering van de aangeboden prijs of ruilverhouding alsmede een mededeling over de wijze van
      financiering door de bieder indien het bod een prijs vermeldt;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9i
  - number: 9i.i
    text: |-
      een regeling met betrekking tot de levering en betaling van aangeboden effecten, welke regeling voldoet aan door de
      toezichthoudende autoriteit te stellen regels.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9i
  - number: 9i.j
    text: |-
      indien het bod op meer dan één soort effecten betrekking heeft: een duidelijke motivering van een eventueel
      verschil in het bod voor de verschillende soorten;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9i
  - number: 9i.k
    text: de aanmeldingstermijn;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9i
  - number: 9i.l
    text: |-
      voor zover aan de bieder ter beschikking staand: gegevens omtrent het vermogen en de resultaten van de
      doelvennootschap met inbegrip van de beschikbare gegevens omtrent het lopende boekjaar, indien daarvan meer dan een
      kwartaal is verstreken;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9i
  - number: 9i.m
    text: eventuele voornemens inzake wijziging van de statuten van de doelvennootschap na gestanddoening van het bod;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9i
  - number: 9i.n
    text: |-
      de aan het bod ten grondslag liggende motieven en de voornemens met betrekking tot het in verband daarmee te voeren
      beleid ten aanzien van de doelvennootschap en de met haar verbonden onderneming;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9i
  - number: 9i.o
    text: |-
      eventuele voornemens inzake de samenstelling van het bestuur en van de raad van commissarissen van de
      doelvennootschap na gestanddoening van het bod;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9i
  - number: 9i.p
    text: |-
      het totale bedrag der eventuele vergoedingen aan de bestuurders en commissarissen van de doelvennootschap die bij
      gestanddoening van het bod zullen aftreden;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9i
  - number: 9i.q
    text: |-
      de omvang van de ten tijde van de openbare mededeling van de verkrijgbaarstelling van het biedingsbericht bestaande
      onderlinge kapitaaldeelneming – zowel direct als indirect – van de bieder en de doelvennootschap;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9i
  - number: 9i.r
    text: |-
      indien van toepassing: het feit dat rechthebbenden van effecten van een soort waarop het bod betrekking heeft reeds
      te kennen hebben gegeven voor hun effecten het bod te zullen aanvaarden onder vermelding van het totale nominale
      bedrag van deze effecten;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9i
  - number: 9i.s
    text: |-
      een mededeling of effecten, uitgegeven door de doelvennootschap, in de drie aan de openbare mededeling van de
      verkrijgbaarstelling van het biedingsbericht voorafgaande jaren door de bieder zijn verworven of krachtens in
      die periode reeds gesloten overeenkomsten of gemaakte afspraken zullen worden verworven, van bestuurders of
      commissarissen van de doelvennootschap of van hun echtgenoten, geregistreerde partners of minderjarige kinderen of
      van rechtspersonen waarin deze personen de zeggenschap hebben onder vermelding van:
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9i
  - number: 9i.s.1
    text: hun namen;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9i
  - number: 9i.s.2
    text: |-
      de hoeveelheid en de soort van deze effecten alsmede de prijs of ruilverhouding welke voor ieder van deze
      verwervingen heeft gegolden, respectievelijk welke bij ieder van deze overeenkomsten of afspraken is bedongen;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9i
  - number: 9i.s.3
    text: het totaalbedrag dat met deze transacties gemoeid is;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9i
  - number: 9i.s.4
    text: |-
      indien, voor zover het effecten betreft waarop het openbaar bod betrekking heeft, de prijs of ruilverhouding hoger
      is dan de ingevolge het openbaar bod geboden prijs of ruilverhouding: de motivering van dit verschil;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9i
  - number: 9i.t
    text: |-
      een mededeling of effecten, uitgegeven door de doelvennootschap, in de drie aan de publicatie van het
      biedingsbericht voorafgaande jaren door de bieder zijn verworven of krachtens in die periode reeds gesloten
      overeenkomsten of gemaakte afspraken zullen worden verworven, van andere dan de onder s bedoelde natuurlijke
      personen en rechtspersonen, onder vermelding van:
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9i
  - number: 9i.t.1
    text: de hoeveelheid en de soorten van deze effecten;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9i
  - number: 9i.t.2
    text: de prijs of ruilverhouding welke heeft gegolden, respectievelijk werd bedongen bij ieder van deze transacties;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9i
  - number: 9i.t.3
    text: het totaalbedrag dat met deze transacties gemoeid is;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9i
  - number: 9i.t.4
    text: |-
      indien, voor zover het effecten betreft waarop het openbaar bod betrekking heeft, en waarvan de prijs of
      ruilverhouding hoger is dan de ingevolge het bod geboden prijs of ruilverhouding: de motivering van dit verschil;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9i
  - number: 9i.u
    text: |-
      soortgelijke mededelingen als bedoeld onder s en t met betrekking tot eventuele transacties, verricht door
      rechtspersonen waarmee de bieder in een groep is verbonden;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9i
  - number: 9i.v
    text: |-
      andere gegevens die naar het oordeel van de toezichthoudende autoriteit in het desbetreffende geval noodzakelijk
      zijn voor de adequate beoordeling van het bod door degene tot wie het bod zich richt;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9i
  - number: 9i.w
    text: |-
      een mededeling omtrent de verstrekking van de in [artikel 9p][ref1] voorgeschreven gegevens aan de toezichthoudende
      autoriteit;


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel9p
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9i
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 9p
        hoofdstuk: III_A
  - number: 9i.x
    text: |-
      een mededeling omtrent de wijze waarop in het kader van het bod aandacht is gegeven aan de belangen van de
      betrokken werknemers;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9i
  - number: 9i.y
    text: |-
      de naam en functie van de natuurlijke personen, of de naam en zetel van de rechtspersonen, die verantwoordelijk
      zijn voor het biedingsbericht of, in voorkomend geval, voor bepaalde gedeelten daarvan. In dit laatste geval worden
      deze gedeelten vermeld. Indien een rechtspersoon verantwoordelijk is voor het biedingsbericht of een gedeelte
      daarvan, worden tevens naam en functie vermeld van de natuurlijke personen die het beleid van deze rechtspersonen
      bepalen;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9i
  - number: 9i.z
    text: |-
      een verklaring van de onder y bedoelde verantwoordelijke personen dat, voor zover hun redelijkerwijs bekend
      had kunnen zijn, de gegevens in het biedingsbericht of in het gedeelte waarvoor zij verantwoordelijk zijn, in
      overeenstemming zijn met de werkelijkheid en dat geen gegevens zijn weggelaten waarvan vermelding de strekking van
      het biedingsbericht zou wijzigen.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9i
  - number: 9j.1
    text: Een partieel bod is gericht tot alle rechthebbenden van de soorten effecten waarop het bod betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9j
  - number: 9j.2
    text: Aan alle rechthebbenden van dezelfde soort effecten wordt hetzelfde bod gedaan.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9j
  - number: 9j.3
    text: |-
      De bieder heeft het recht het bod in te trekken indien voor het einde van de aanmeldingstermijn door een derde een
      openbaar bod op effecten van een of meer dezelfde soorten wordt uitgebracht of het voornemen daartoe openbaar wordt
      medegedeeld.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9j
  - number: 9j.4
    text: |-
      De bieder kan zijn verplichting tot gestanddoening van het bod afhankelijk stellen van de aanbieding van een
      bepaald aantal of percentage van de effecten, onverminderd de bevoegdheid van de bieder het bod ook gestand te doen
      indien effecten tot een kleiner aantal of een geringer percentage zijn aangemeld.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9j
  - number: 9j.5
    text: |-
      De bieder aanvaardt de aangeboden effecten proportioneel met hantering van een systematiek welke voldoet aan door
      de toezichthoudende autoriteit te stellen regels, voor zover de bieder bij aanvaarding van de aangeboden effecten
      direct of indirect meer dan 30% van het geplaatste kapitaal van de doelvennootschap gaat houden dan wel meer
      effecten worden aangeboden dan waarop het bod is gericht.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9j
  - number: 9j.6
    text: |-
      De bieder treft een regeling met betrekking tot de levering en betaling van aangeboden effecten welke voldoet aan
      door de toezichthoudende autoriteit te stellen regels.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9j
  - number: 9j.7
    text: |-
      Gedurende een jaar na de openbare mededeling van de verkrijgbaarstelling van het biedingsbericht is het de bieder
      niet toegestaan om effecten in de doelvennootschap te verwerven indien hij daardoor, direct of indirect, meer dan
      30% van het geplaatste kapitaal van de doelvennootschap gaat houden, tenzij:
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9j
  - number: 9j.7.a
    text: het partieel bod niet gestand wordt gedaan, of
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9j
  - number: 9j.7.b
    text: |-
      een derde na de verschijningsdatum een openbaar bod op effecten van dezelfde doelvennootschap uitbrengt, met dien
      verstande dat het verbod van kracht blijft ten aanzien van verwerving ingevolge een partieel bod of een tenderbod.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9j
  - number: 9k
    text: 'Het biedingsbericht met betrekking tot een partieel bod houdt ten minste in:'
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9k
  - number: 9k.a
    text: de naam van de bieder;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9k
  - number: 9k.b
    text: het voorstel tot overneming van de effecten volgens een daarbij aan te geven prijs of ruilverhouding;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9k
  - number: 9k.c
    text: |-
      de mededeling of met de doelvennootschap overleg over het bod is gevoerd en of dit overleg tot overeenstemming
      heeft geleid;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9k
  - number: 9k.d
    text: |-
      de verklaring dat het bod is gericht tot alle rechthebbenden van de soorten effecten waarop het bod betrekking
      heeft;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9k
  - number: 9k.e
    text: de verklaring dat aan alle rechthebbenden van dezelfde soort effecten hetzelfde bod wordt gedaan;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9k
  - number: 9k.f
    text: |-
      een duidelijke motivering van de aangeboden prijs of ruilverhouding alsmede een mededeling over de wijze van
      financiering door de bieder indien het bod een prijs vermeldt;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9k
  - number: 9k.g
    text: |-
      het getal of het percentage van iedere soort van de effecten uitgegeven door de doelvennootschap tot de verkrijging
      waarvan het bod strekt, met dien verstande dat na gestanddoening van het bod het gedeelte van het geplaatste
      kapitaal dat direct of indirect door de bieder wordt gehouden niet groter is dan 30%.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9k
  - number: 9k.h
    text: |-
      de verklaring dat het bod, behoudens het bepaalde onder i, onvoorwaardelijk is en tevens dat het bod onherroepelijk
      is behoudens de bevoegdheid van de bieder om het recht te bedingen het bod in te trekken indien vóór het einde
      van de aanmeldingstermijn door een derde een openbaar bod op effecten van een of meer dezelfde soorten wordt
      uitgebracht of het voornemen daartoe openbaar wordt medegedeeld;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9k
  - number: 9k.i
    text: |-
      de verklaring dat de bieder zijn verplichting tot gestanddoening afhankelijk stelt van de aanbieding, gedurende de
      aanmeldingstermijn van een bepaald aantal of percentage van de effecten, onverminderd de bevoegdheid van de bieder
      het bod ook gestand te doen indien effecten tot een kleiner aantal of een geringer percentage zijn aangemeld;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9k
  - number: 9k.j
    text: |-
      de verklaring dat, in geval van gestanddoening, aanvaarding van aangeboden effecten – indien een groter aantal of
      een hoger percentage effecten wordt aangeboden dan de bieder gehouden dan wel bevoegd is te aanvaarden – zoveel
      mogelijk proportioneel zal geschieden, met hantering van een systematiek welke voldoet aan door de toezichthoudende
      autoriteit te stellen regels en welke eveneens in het biedingsbericht wordt bekendgemaakt;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9k
  - number: 9k.k
    text: de aanmeldingstermijn;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9k
  - number: 9k.l
    text: |-
      de omvang van de ten tijde van de openbare mededeling van de verkrijgbaarstelling van het biedingsbericht bestaande
      onderlinge kapitaaldeelnemingen, zowel direct als indirect, van de bieder en de doelvennootschap;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9k
  - number: 9k.m
    text: |-
      een regeling met betrekking tot de levering en betaling van aangeboden effecten, welke regeling voldoet aan door de
      toezichthoudende autoriteit te stellen regels;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9k
  - number: 9k.n
    text: |-
      de verklaring van de bieder dat na gestanddoening van het bod gedurende een jaar – te rekenen vanaf de dag waarop
      de verkrijgbaarstelling van het biedingsbericht openbaar is medegedeeld – rechtstreeks of middellijk geen openbaar
      bod zal worden uitgebracht, tenzij een derde binnen die periode een openbaar bod op de effecten van dezelfde
      doelvennootschap uitbrengt;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9k
  - number: 9k.o
    text: |-
      andere gegevens die naar het oordeel van de toezichthoudende autoriteit in het desbetreffende geval noodzakelijk
      zijn voor de adequate beoordeling van het bod door degene tot wie het bod zich richt;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9k
  - number: 9k.p
    text: |-
      de naam en functie van de natuurlijke personen dan wel de naam en zetel van de rechtspersonen die verantwoordelijk
      zijn voor het biedingsbericht of, in voorkomend geval, voor bepaalde gedeelten daarvan. In dit laatste geval worden
      deze gedeelten vermeld. Indien een rechtspersoon verantwoordelijk is voor het biedingsbericht of een gedeelte
      daarvan, worden tevens naam en functie vermeld van de natuurlijke personen die het beleid van deze rechtspersonen
      bepalen;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9k
  - number: 9k.q
    text: |-
      een verklaring van de onder p bedoelde verantwoordelijke personen dat, voor zover hun redelijkerwijs bekend
      had kunnen zijn, de gegevens in het biedingsbericht of in het gedeelte waarvoor zij verantwoordelijk zijn, in
      overeenstemming zijn met de werkelijkheid en dat geen gegevens zijn weggelaten waarvan vermelding de strekking van
      het biedingsbericht zou wijzigen.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9k
  - number: 9l.1
    text: Een tenderbod is gericht tot alle rechthebbenden van de soorten effecten waarop het bod betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9l
  - number: 9l.2
    text: Aan alle rechthebbenden van dezelfde soort effecten wordt hetzelfde bod gedaan.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9l
  - number: 9l.3
    text: |-
      De bieder heeft het recht het bod in te trekken indien voor het einde van de aanmeldingstermijn door een derde een
      openbaar bod op effecten van een of meer dezelfde soorten wordt uitgebracht of het voornemen daartoe openbaar wordt
      medegedeeld.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9l
  - number: 9l.4
    text: |-
      De bieder doet het bod gestand indien de beoogde verkrijging mogelijk is tegen een door de bieder in het
      biedingsbericht te vermelden prijs per aandeel.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9l
  - number: 9l.5
    text: |-
      De bieder aanvaardt de effecten proportioneel met hantering van een systematiek welke voldoet aan door de
      toezichthoudende autoriteit te stellen regels, voor zover de bieder bij aanvaarding van de aangeboden effecten
      direct of indirect meer dan 30% van het geplaatste kapitaal van de doelvennootschap gaat houden dan wel meer
      effecten worden aangeboden dan waarop het bod is gericht.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9l
  - number: 9l.6
    text: |-
      De bieder treft een regeling met betrekking tot de levering en betaling van aangeboden effecten welke voldoet aan
      door de toezichthoudende autoriteit te stellen regels.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9l
  - number: 9l.7
    text: |-
      De bieder betaalt, bij gestanddoening van enig aanbod voor alle effecten van dezelfde soort dezelfde prijs, zijnde
      de hoogste prijs waartegen een effect van de desbetreffende soort is aangeboden.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9l
  - number: 9l.8
    text: |-
      Gedurende een jaar na de verschijningsdatum van het biedingsbericht is het de bieder niet toegestaan om effecten in
      de doelvennootschap te verwerven, indien hij daardoor, direct of indirect, meer dan 30 procent van het geplaatste
      kapitaal van de doelvennootschap gaat houden, tenzij:
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9l
  - number: 9l.8.a
    text: het bod niet gestand wordt gedaan, of
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9l
  - number: 9l.8.b
    text: |-
      een derde na de verschijningsdatum een openbaar bod op effecten van dezelfde doelvennootschap uitbrengt, met dien
      verstande dat het verbod van kracht blijft ten aanzien van verwerving ingevolge een tenderbod of partieel bod.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9l
  - number: 9m
    text: 'Het biedingsbericht met betrekking tot een tenderbod houdt ten minste in:'
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9m
  - number: 9m.a
    text: de naam van de bieder;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9m
  - number: 9m.b
    text: |-
      de uitnodiging tot het aanbieden van de effecten tegen een door de rechthebbenden van deze effecten te noemen prijs
      in contanten;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9m
  - number: 9m.c
    text: |-
      de mededeling of met de doelvennootschap overleg over het bod is gevoerd en of dit overleg tot overeenstemming
      heeft geleid;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9m
  - number: 9m.d
    text: |-
      de verklaring dat het bod is gericht tot alle rechthebbenden van de soorten effecten waarop het bod betrekking
      heeft;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9m
  - number: 9m.e
    text: de verklaring dat aan alle rechthebbenden van dezelfde soort effecten hetzelfde bod wordt gedaan;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9m
  - number: 9m.f
    text: een duidelijke motivering van het bod;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9m
  - number: 9m.g
    text: |-
      het aantal of percentage van iedere soort van de effecten uitgegeven door de doelvennootschap waarvan de
      verkrijging wordt beoogd, met dien verstande dat na gestanddoening van het bod het gedeelte van het geplaatste
      kapitaal dat direct of indirect door de bieder wordt gehouden niet groter is dan 30%.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9m
  - number: 9m.h
    text: |-
      de verklaring dat het tenderbod, behoudens het bepaalde onder i, onvoorwaardelijk is en tevens dat het bod
      onherroepelijk is behoudens de bevoegdheid van de bieder om het recht te bedingen het bod in te trekken indien
      vóór het einde van de aanmeldingstermijn door een derde een openbaar bod op effecten van een of meer van dezelfde
      soorten wordt uitgebracht of het voornemen daartoe openbaar wordt medegedeeld;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9m
  - number: 9m.i
    text: |-
      de verklaring dat de bieder zich verbindt tot gestanddoening, indien de beoogde verkrijging mogelijk is tegen een
      door de bieder in het biedingsbericht te vermelden prijs per aandeel;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9m
  - number: 9m.j
    text: |-
      de verklaring dat bij gestanddoening voor alle effecten van dezelfde soort dezelfde prijs zal worden betaald,
      zijnde de hoogste prijs waartegen de desbetreffende soort is aangeboden;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9m
  - number: 9m.k
    text: |-
      de verklaring dat in geval van aanvaarding van tegen de prijs van aanvaarding aangeboden effecten – indien een
      groter aantal of een hoger percentage effecten zal zijn aangeboden dan de bieder gehouden dan wel bevoegd is te
      aanvaarden – zoveel mogelijk proportioneel zal geschieden met hantering van een systematiek welke voldoet aan door
      de toezichthoudende autoriteit te stellen regels en welke eveneens in het biedingsbericht wordt bekendgemaakt;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9m
  - number: 9m.l
    text: de aanmeldingstermijn;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9m
  - number: 9m.m
    text: |-
      de omvang van de ten tijde van de openbare mededeling van de verkrijgbaarstelling van het biedingsbericht bestaande
      onderlinge kapitaaldeelnemingen zowel direct als indirect, van de bieder en de doelvennootschap;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9m
  - number: 9m.n
    text: |-
      een regeling met betrekking tot de levering en betaling van aangeboden effecten, welke regeling voldoet aan door de
      toezichthoudende autoriteit te stellen regels;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9m
  - number: 9m.o
    text: |-
      de verklaring van de bieder dat na gestanddoening van het bod, gedurende een jaar – te rekenen vanaf de dag
      waarop de verkrijgbaarstelling van het biedingsbericht openbaar is medegedeeld – rechtstreeks of middellijk geen
      openbaar bod zal worden uitgebracht, tenzij een derde binnen die periode een openbaar bod op effecten van dezelfde
      doelvennootschap uitbrengt;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9m
  - number: 9m.p
    text: |-
      andere gegevens die naar het oordeel van de toezichthoudende autoriteit noodzakelijk zijn voor de adequate
      beoordeling van het bod door degene tot wie het bod zich richt;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9m
  - number: 9m.q
    text: |-
      de naam en functie van de natuurlijke personen dan wel de naam en zetel van de rechtspersonen die verantwoordelijk
      zijn voor het biedingsbericht of, in voorkomend geval, voor bepaalde gedeelten daarvan. In dit laatste geval worden
      deze gedeelten vermeld.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9m
  - number: 9m
    text: |-
      Indien een rechtspersoon verantwoordelijk is voor het biedingsbericht of een gedeelte daarvan, worden tevens naam
      en functie vermeld van de natuurlijke personen die het beleid van deze rechtspersonen bepalen;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9m
  - number: 9m.r
    text: |-
      een verklaring van de onder q bedoelde verantwoordelijke personen dat, voor zover hun redelijkerwijs bekend
      had kunnen zijn, de gegevens in het biedingsbericht of in het gedeelte waarvoor zij verantwoordelijk zijn, in
      overeenstemming zijn met de werkelijkheid en dat geen gegevens zijn weggelaten waarvan vermelding de strekking van
      het biedingsbericht zou wijzigen.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9m
  - number: 9n
    text: |-
      Indien een vast bod of partieel bod uitsluitend of mede strekt tot overneming van effecten in ruil voor door de
      bieder uitgegeven effecten, houdt het biedingsbericht, onverminderd het verbod van [artikel 3 van de wet][ref1] en
      in aanvulling op de gegevens vereist ingevolge [artikel 9i][ref2] en [9k][ref3], tevens in:


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007708#Artikel9i
      [ref3]: https://wetten.overheid.nl/BWBR0007708#Artikel9k
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9n
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0007708
        artikel: 9i
        hoofdstuk: III_A
      - id: ref3
        bwb_id: BWBR0007708
        artikel: 9k
        hoofdstuk: III_A
  - number: 9n.a
    text: |-
      gegevens omtrent het vermogen en de resultaten van de bieder met inbegrip van de beschikbare gegevens over het
      lopende boekjaar, indien daarvan meer dan een kwartaal is verstreken;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9n
  - number: 9n.b
    text: |-
      een gemotiveerde uiteenzetting omtrent de te verwachten voordelen van het bod en zo mogelijk een mededeling over
      dividendvooruitzichten van de bieder;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9n
  - number: 9n.c
    text: eventuele voornemens inzake wijziging van de statuten van de bieder na gestanddoening van het bod;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9n
  - number: 9n.d
    text: |-
      eventuele voornemens inzake de samenstelling van het bestuur en van de raad van commissarissen van de bieder na
      gestanddoening van het bod;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9n
  - number: 9n.e
    text: |-
      het totale bedrag der eventuele vergoedingen aan de bestuurders en commissarissen van de bieder die bij
      gestanddoening van het bod zullen aftreden.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9n
  - number: 9o.1
    text: De bieder die een openbaar bod doet, stelt een aanmeldingstermijn.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9o
  - number: 9o.2
    text: |-
      De aanmeldingstermijn vangt niet eerder aan dan op de eerste beursdag volgend op de openbare mededeling van de
      verkrijgbaarstelling van het biedingsbericht.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9o
  - number: 9o.3
    text: |-
      De aanmeldingstermijn van een vast bod is, gerekend van de dag waarop de gelegenheid tot aanmelding is opengesteld
      tot en met de dag waarop de gelegenheid tot aanmelding wordt gesloten, niet korter dan twintig dagen indien het bod
      met instemming van de doelvennootschap wordt uitgebracht en niet korter dan dertig dagen indien het zonder zodanige
      instemming wordt uitgebracht.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9o
  - number: 9o.4
    text: |-
      De aanmeldingstermijn van een partieel bod of van een tenderbod is, te rekenen vanaf de dag waarop de gelegenheid
      tot aanmelding is opengesteld, niet korter dan zeven dagen.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9o
  - number: 9o.5
    text: |-
      Een verlenging van de aanmeldingstermijn, zodanig dat daardoor de verplichting tot bekendmaking van de al dan niet
      gestanddoening van het bod wordt opgeschort, vindt slechts plaats met inachtneming van de volgende bepalingen:
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9o
  - number: 9o.5.a
    text: |-
      rechthebbenden van effecten die vóór het einde van de oorspronkelijke termijn hun effecten ingevolge het bod hebben
      aangemeld kunnen tijdens de verlengingsperiode deze aanmelding intrekken;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9o
  - number: 9o.5.b
    text: |-
      de verlenging wordt in geval van een vast bod uiterlijk op de derde beursdag en in geval van een partieel bod of
      een tenderbod uiterlijk op de tweede beursdag na het einde van de oorspronkelijke termijn openbaar medegedeeld met
      vermelding van de einddatum van de aldus verlengde termijn;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9o
  - number: 9o.5.c
    text: |-
      de bieder deelt onverwijld andere gegevens die in het desbetreffende geval noodzakelijk zijn voor de adequate
      beoordeling van het bod door degene tot wie het bod zich richt, openbaar mede of stelt deze in een aanvullend
      biedingsbericht verkrijgbaar. De verkrijgbaarstelling van het biedingsbericht wordt openbaar medegedeeld.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9o
  - number: 9o.6
    text: |-
      Na sluiting van de aanmeldingstermijn deelt de bieder iedere aanvaarding van effecten onverwijld openbaar mede doch
      in ieder geval niet later dan het moment van aanvang van de officiële beurshandel op de beursdag volgend op de dag
      van de bedoelde aanvaarding, indien ten tijde van die aanvaarding de aanmeldingstermijn van enig ander openbaar bod
      op dezelfde effecten nog niet is verstreken. Elke hiervoor bedoelde openbare mededeling houdt een opgave in van het
      aantal van de effecten ter zake waarvan de aanbieding op de desbetreffende dag is aanvaard.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9o
  - number: 9p.1
    text: |-
      De bieder, de bestuurders en commissarissen van de bieder, indien deze een rechtspersoon is, en de bestuurders en
      commissarissen van de doelvennootschap verstrekken, tegelijk met de openbare mededeling van de verkrijgbaarstelling
      van het biedingsbericht, aan de toezichthoudende autoriteit een opgave van de transacties in effecten in de
      doelvennootschap, welke door hen, hun echtgenoten of geregistreerde partners, hun minderjarige kinderen en
      door rechtspersonen waarin deze personen de zeggenschap hebben, zijn verricht in de zes maanden voorafgaande
      aan de eerste openbare mededeling inzake de prijs of ruilverhouding, bedoeld in [artikel 9i, onder b][ref1],
      inzake de prijs of ruilverhouding, bedoeld in [artikel 9k, onder b][ref2], dan wel inzake de prijs bedoeld in
      [artikel 9m onder i][ref3]. Tevens verstrekken zij indien het bod uitsluitend of mede strekt tot overneming van
      effecten in ruil voor effecten uit te geven door de bieder aan de toezichthoudende autoriteit een opgave van de
      transacties in door de bieder uitgegeven effecten, welke door hen, hun echtgenoten of geregistreerde partners,
      hun minderjarige kinderen en door rechtspersonen waarin deze personen de zeggenschap hebben zijn verricht in
      de zes maanden voorafgaande aan de eerste openbare mededeling inzake de prijs of ruilverhouding bedoeld in
      [artikel 9i onder b][ref4], inzake de prijs of ruilverhouding bedoeld in [artikel 9k, onder b][ref5], dan wel
      inzake de prijs, bedoeld in [artikel 9m, onder i][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel9i
      [ref2]: https://wetten.overheid.nl/BWBR0007708#Artikel9k
      [ref3]: https://wetten.overheid.nl/BWBR0007708#Artikel9m
      [ref4]: https://wetten.overheid.nl/BWBR0007708#Artikel9i
      [ref5]: https://wetten.overheid.nl/BWBR0007708#Artikel9k
      [ref6]: https://wetten.overheid.nl/BWBR0007708#Artikel9m
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9p
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 9i
        hoofdstuk: III_A
      - id: ref2
        bwb_id: BWBR0007708
        artikel: 9k
        hoofdstuk: III_A
      - id: ref3
        bwb_id: BWBR0007708
        artikel: 9m
        hoofdstuk: III_A
      - id: ref4
        bwb_id: BWBR0007708
        artikel: 9i
        hoofdstuk: III_A
      - id: ref5
        bwb_id: BWBR0007708
        artikel: 9k
        hoofdstuk: III_A
      - id: ref6
        bwb_id: BWBR0007708
        artikel: 9m
        hoofdstuk: III_A
  - number: 9p.2
    text: |-
      De bieder, de bestuurders en commissarissen van de bieder, indien deze een rechtspersoon is, en de bestuurders
      en commissarissen van de doelvennootschap verstrekken voorts tegelijk met de publicatie van het biedingsbericht,
      aan de toezichthoudende autoriteit een gespecificeerde opgave van het aantal en de soort van de door de
      doelvennootschap uitgegeven effecten welke door hen, hun echtgenoten of geregistreerde partners, hun minderjarige
      kinderen en door rechtspersonen waarin deze personen de zeggenschap hebben, worden gehouden.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9p
  - number: 9p.3
    text: |-
      Indien een bestuurder of commissaris van de doelvennootschap met betrekking tot een in het eerste lid genoemde
      transactie reeds een melding heeft gedaan overeenkomstig [artikel 47a, eerste lid, van de wet][ref1], kan een
      melding als bedoeld in het eerste lid achterwege blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel47a
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9p
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: 47a
  - number: 9q.1
    text: |-
      Indien een vast bod is uitgebracht roept de doelvennootschap, indien deze in Nederland is gevestigd, haar
      aandeelhouders op voor een na de openbare mededeling van de verkrijgbaarstelling van het biedingsbericht en ten
      minste acht dagen voor het einde van de aanmeldingstermijn te houden algemene vergadering van aandeelhouders ter
      bespreking van dat bod.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9q
  - number: 9q.2
    text: |-
      De doelvennootschap stelt uiterlijk vier dagen voor de in het eerste lid bedoelde vergadering een bericht voor haar
      aandeelhouders verkrijgbaar dat ten minste inhoudt:
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9q
  - number: 9q.2.a
    text: een gemotiveerde standpuntbepaling van het bestuur;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9q
  - number: 9q.2.b
    text: |-
      de gegevens omtrent het vermogen en de resultaten van de doelvennootschap – met inbegrip van de beschikbare
      gegevens omtrent het lopende boekjaar indien daarvan meer dan een kwartaal is verstreken – welke de aandeelhouders
      behoeven om zich een gefundeerd oordeel over het bod te kunnen vormen;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9q
  - number: 9q.2.c
    text: |-
      andere gegevens die in het desbetreffende geval noodzakelijk zijn voor de adequate beoordeling van het bod door
      degene tot wie het bod zich richt;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9q
  - number: 9q.3
    text: |-
      De verkrijgbaarstelling van het in het tweede lid bedoelde bericht wordt onverwijld door de doelvennootschap
      openbaar medegedeeld.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9q
  - number: 9q.4
    text: |-
      In de in het eerste lid bedoelde vergadering verschaffen het bestuur en de raad van commissarissen alle voor de
      beoordeling van het bod van belang zijnde inlichtingen, tenzij een zwaarwegend belang van de doelvennootschap zich
      daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9q
  - number: 9q.5
    text: |-
      Indien voor het einde van de aanmeldingstermijn door een derde een openbaar bod op dezelfde effecten wordt
      uitgebracht, behoeft het bestuur niet opnieuw toepassing te geven aan het in de voorgaande ledenbepaalde, doch kan
      het volstaan met een openbare mededeling van zijn standpunt met betrekking tot het nieuwe bod.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9q
  - number: 9r
    text: |-
      Indien een partieel bod of een tenderbod is uitgebracht deelt het bestuur van de doelvennootschap uiterlijk vier
      dagen voor het einde van de aanmeldingstermijn een gemotiveerde standpuntbepaling openbaar mede, voor zover deze
      niet reeds is opgenomen in een tezamen met de bieder uitgegeven biedingsbericht.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9r
  - number: 9s.1
    text: |-
      Indien een vast bod of partieel bod uitsluitend of mede strekt tot overneming van effecten in ruil voor door de
      bieder uit te geven effecten tot een gezamenlijke nominale waarde van meer dan een kwart van het voor die uitgifte
      geplaatste kapitaal van de bieder, roept de bieder, indien deze een rechtspersoon is die aandelen uitgeeft en
      in Nederland is gevestigd, zijn aandeelhouders op voor een na de openbare mededeling van de verkrijgbaarstelling
      van het biedingsbericht en ten minste acht dagen voor het einde van de aanmeldingstermijn te houden algemene
      vergadering van aandeelhouders, ter bespreking van het bod.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9s
  - number: 9s.2
    text: |-
      In de in het eerste lid bedoelde vergadering verschaffen het bestuur en de raad van commissarissen alle voor de
      beoordeling van het bod van belang zijnde inlichtingen, tenzij een zwaarwegend belang van de bieder zich daartegen
      verzet.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9s
  - number: 9s.3
    text: |-
      Het eerste en tweede lid zijn niet van toepassing wanneer de bieder een nieuwe rechtspersoon is, welke in verband
      met het bod wordt opgericht.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9s
  - number: 9t.1
    text: |-
      Indien van een vast bod de prijs of ruilverhouding openbaar wordt medegedeeld, deelt de bieder eventuele
      voorwaarden waarvan hij zijn verplichting tot nakoming van het bod afhankelijk stelt, uiterlijk gelijktijdig met
      het uitbrengen van die mededeling openbaar mede. De verplichting tot nakoming van het bod mag niet afhankelijk
      worden gesteld van een voorwaarde, waarvan de vervulling afhangt van de wil van de bieder.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9t
  - number: 9t.2
    text: |-
      In afwijking van het eerste lid deelt de bieder, indien hij een of meer van de na te noemen voorwaarden wil
      stellen, deze uiterlijk gelijktijdig met de verkrijgbaarstelling van het biedingsbericht openbaar mede:
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9t
  - number: 9t.2.a
    text: |-
      de voorwaarde dat ten minste een in het biedingsbericht te bepalen waarde of aantal van de effecten voor het einde
      van de aanmeldingstermijn zal zijn aangemeld;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9t
  - number: 9t.2.b
    text: |-
      de voorwaarde dat voor het einde van de aanmeldingstermijn geen openbare mededeling wordt gedaan, waaruit voor het
      eerst blijkt dat een derde een openbaar bod op dezelfde effecten voorbereidt of aankondigt dan wel het recht heeft
      verkregen of de toezegging heeft gedaan tot het nemen van door de doelvennootschap uit te geven effecten;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9t
  - number: 9t.2.c
    text: |-
      de voorwaarde dat voor het einde van de aanmeldingstermijn zich geen feiten of omstandigheden voordoen die de
      bieder ten tijde van de openbare mededeling van de prijs of ruilverhouding niet bekend waren of hoefden te zijn en
      die van zodanig essentiële aard zijn dat in redelijkheid niet van de bieder verwacht kan worden dat deze het bod
      gestand doet.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9t
  - number: 9t.3
    text: |-
      Zodra is komen vast te staan dat een door de bieder gestelde voorwaarde als bedoeld in het eerste lid of in het
      tweede lid, onder b of c, niet wordt vervuld, deelt de bieder dit onverwijld openbaar mede, alsmede zijn beslissing
      of op grond daarvan het bod wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9t
  - number: 9t.4
    text: |-
      Uiterlijk op de vijfde beursdag na het einde van de aanmeldingstermijn deelt de bieder openbaar mede of hij het
      bod gestand doet dan wel dat nog onzekerheid bestaat over de vervulling van een door hem gestelde voorwaarde, onder
      vermelding van de waarde of aantal van de ingevolge het bod aangemelde effecten en in geval van niet gestanddoening
      de reden daarvan.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9t
  - number: 9u
    text: |-
      Indien een partieel bod of een tenderbod is uitgebracht, deelt de bieder uiterlijk op de vijfde beursdag na
      sluiting van de aanmeldingstermijn openbaar mede of hij het bod gestand doet. Bij gestanddoening vermeldt de
      openbare mededeling: - in geval van een partieel bod: het getal of percentage van de ingevolge dat bod aangemelde
      effecten. [Artikel 9h, vijfde lid][ref1], is van overeenkomstige toepassing;
        - in geval van een tenderbod: de waarde of het getal van de effecten dat ingevolge dat bod is aangeboden, alsmede
      het getal of percentage van de aanvaarde effecten en de daarvoor bepaalde prijs. Bij niet gestanddoening worden de
      redenen daarvan vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel9h
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9u
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 9h
        hoofdstuk: III_A
  - number: 9v
    text: |-
      De bieder en de doelvennootschap zenden alle ingevolge dit hoofdstuk door middel van een openbare mededeling
      door hen te publiceren stukken en mededelingen tijdig voor de openbare mededeling aan de toezichthoudende
      autoriteit, met dien verstande dat het biedingsbericht uiterlijk tien beursdagen voor de openbare mededeling van de
      verkrijgbaarstelling ervan aan de toezichthoudende autoriteit wordt gezonden.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel9v
  - number: '10.1'
    text: |-
      Een ieder die een effecteninstelling krachtens wet, statuten of reglementen vertegenwoordigt dan wel het dagelijks
      beleid van een effecteninstelling bepaalt, dient naar het oordeel van de toezichthoudende autoriteit voldoende
      deskundig te zijn in verband met de bedrijfsvoering van de effecteninstelling.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel10
  - number: '10.2'
    text: |-
      De betrouwbaarheid van de in het eerste lid bedoelde personen, de personen die het dagelijks beleid van de
      effecteninstelling mede bepalen en de personen die rechtstreeks of middelijk bevoegd zijn de in het eerste lid
      bedoelde personen te benoemen of te ontslaan, dient naar het oordeel van de toezichthoudende autoriteit buiten
      twijfel te staan.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel10
  - number: '11'
    text: |-
      De houder van een gekwalificeerde deelneming in een effecteninstelling mag naar het oordeel van de toezichthoudende
      autoriteit op grond van die deelneming geen invloed hebben of kunnen hebben die in strijd is met een gezonde,
      prudente of een integere bedrijfsvoering van die instelling.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel11
  - number: '12'
    text: |-
      Een effecteninstelling beschikt over een minimum bedrag aan eigen vermogen, waarvan de hoogte en de samenstelling
      voldoen aan door de toezichthoudende autoriteit te stellen regels.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel12
  - number: '13.1'
    text: |-
      Onverminderd [artikel 12][ref1] beschikt een effecteninstelling over een toetsingsvermogen, waarvan de hoogte en de
      samenstelling voldoen aan door de toezichthoudende autoriteit te stellen regels met betrekking tot de solvabiliteit
      van effecteninstellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel12
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: '12'
        hoofdstuk: IV
  - number: '13.2'
    text: 'De regels, bedoeld in het eerste lid, kunnen uitsluitend betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel13
  - number: 13.2.a
    text: 'het toetsingsvermogen dat dient te worden aangehouden in verhouding tot:'
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel13
  - number: 13.2.a.1°
    text: de naar risicograad gewogen kredietuitzettingen, beleggingen en overige activa;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel13
  - number: 13.2.a.2°
    text: de naar risicograad gewogen verplichtingen buiten de balanstelling;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel13
  - number: 13.2.a.3°
    text: de rente-, wisselkoers en andere marktrisico's;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel13
  - number: 13.2.a.4°
    text: de deelnemingen in andere ondernemingen of instellingen;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel13
  - number: 13.2.a.5°
    text: |-
      de onder 1°, 2°, 3° of 4° vallende afzonderlijke posten, voor zover zij een bepaald percentage van de eigen
      middelen te boven gaan;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel13
  - number: 13.2.b
    text: 'de omvang, al dan niet in verhouding tot het toetsingsvermogen, van:'
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel13
  - number: 13.2.b.1°
    text: de kredietuitzettingen, beleggingen en overige activa;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel13
  - number: 13.2.b.2°
    text: de verplichtingen buiten de balanstelling;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel13
  - number: 13.2.b.3°
    text: de rente-, wisselkoers- en andere marktrisico's;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel13
  - number: 13.2.b.4°
    text: de deelnemingen in andere ondernemingen of instellingen.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel13
  - number: '13.3'
    text: |-
      Een effecteninstelling die deel uitmaakt van een groep die geen kredietinstelling omvat als bedoeld in artikel
      1, eerste gedachtenstreepje, van [richtlijn nr. 2000/12/EG](32000L0012) van het Europees Parlement en de Raad
      van de Europese Unie van 20 maart 2000 betreffende de toegang tot en de uitoefening van de werkzaamheden van
      kredietinstellingen (PbEG L 126), voert systemen in voor de bewaking en beheersing van de bronnen van het
      eigen vermogen en van het vreemd vermogen van alle andere financiële instellingen, bedoeld in artikel 1, tweede
      gedachtenstreepje, van die richtlijn, binnen de groep.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel13
  - number: '13.4'
    text: De toezichthoudende autoriteit kan regels stellen met betrekking tot de in het derde lid bedoelde systemen.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel13
  - number: '14.1'
    text: Het dagelijks beleid van een effecteninstelling wordt door ten minste twee personen bepaald.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel14
  - number: '14.2'
    text: |-
      Indien een effecteninstelling een natuurlijk persoon is kan de toezichthoudende autoriteit, in afwijking van het
      eerste lid, toestaan dat het dagelijks beleid alleen door die natuurlijke persoon wordt bepaald, mits deze naar
      het oordeel van de toezichthoudende autoriteit adequate maatregelen heeft genomen om anderszins de belangen te
      beschermen van de personen waaraan onderscheidenlijk waarvoor de effecteninstelling als effectenbemiddelaar of
      vermogensbeheerder diensten aanbiedt of verricht. De toezichthoudende autoriteit houdt bij het vaststellen van zijn
      oordeel rekening met de aard en omvang van de werkzaamheden van de effecteninstelling.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel14
  - number: '14.3'
    text: |-
      Het tweede lid is van overeenkomstige toepassing op rechtspersonen en vennootschappen die door één natuurlijk
      persoon worden geleid.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel14
  - number: '16.1'
    text: |-
      Een effecteninstelling heeft met betrekking tot de effecten en gelden van cliënten regelingen getroffen om de
      rechten van die cliënten te beschermen en om te voorkomen dat die effecten en, voor zover de effecteninstelling
      geen kredietinstelling of een financiële instelling is waaraan een vergunning als bedoeld in [artikel 6][ref1] of
      [artikel 38 van de Wet toezicht kredietwezen 1992][ref2] onderscheidenlijk een verklaring van ondertoezichtstelling
      als bedoeld in [artikel 45 van die wet][ref3] is verleend, gelden door de effecteninstelling voor eigen rekening
      worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0005792#Artikel45
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0005792
        artikel: '38'
      - id: ref3
        bwb_id: BWBR0005792
        artikel: '45'
  - number: '16.2'
    text: De toezichthoudende autoriteit kan regels stellen met betrekking tot de in het eerste lid bedoelde regelingen.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel16
  - number: '17.1'
    text: |-
      Een effecteninstelling beschikt naar het oordeel van de toezichthoudende autoriteit over een goede administratieve
      organisatie, adequate interne controleprocedures en een deugdelijke registratie van de verrichte diensten, alsmede
      over systemen voor een adequate bewaking en beheersing van het risico met betrekking tot haar gehele bedrijf en
      over systemen om te allen tijde nauwkeurig haar financiële positie te berekenen. Deze organisatie, procedures,
      registratie en systemen moeten de toezichthoudende autoriteit in staat stellen na te gaan of de regels inzake de
      bedrijfsvoering en de financiële waarborgen worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel17
  - number: '17.2'
    text: |-
      De toezichthoudende autoriteit kan regels stellen met betrekking tot de in het eerste lid bedoelde administratieve
      organisatie, interne controleprocedures, registratie en systemen.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel17
  - number: 17a
    text: |-
      Een effecteninstelling beschikt over maatregelen, gericht op het bevorderen en handhaven van een integere
      bedrijfsvoering, die voldoen aan het bepaalde bij en krachtens de [artikelen 24a tot en met 24c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel24a
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 24a
        hoofdstuk: V
        paragraaf: '1'
  - number: '18.1'
    text: |-
      Het hoofdkantoor van een in Nederland gevestigde effecteninstelling bevindt zich in Nederland. De personen die
      het dagelijks beleid van de effecteninstelling bepalen, verrichten hun werkzaamheden in verband daarmee vanuit
      dit hoofdkantoor.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel18
  - number: '18.2'
    text: |-
      Het hoofdkantoor van een in een andere staat gevestigde effecteninstelling bevindt zich in die andere staat. De
      personen die het dagelijks beleid van het bijkantoor van de effecteninstelling in Nederland bepalen, verrichten hun
      werkzaamheden in verband daarmee vanuit dat bijkantoor.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel18
  - number: 18a.1
    text: |-
      Een effecteninstelling behoort niet tot een groep waarbinnen de formele of feitelijke zeggenschapsstructuur in
      zodanige mate ondoorzichtig is dat deze, naar het oordeel van de toezichthoudende autoriteit, een belemmering vormt
      voor het adequaat uitoefenen van toezicht op de effecteninstelling.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel18a
  - number: 18a.2
    text: |-
      Indien een effecteninstelling in een groep is verbonden met een natuurlijke persoon of rechtspersoon op wie,
      onderscheidenlijk waarop, het recht van een staat die geen lid-staat is, van toepassing is, mag het recht van
      die staat, naar het oordeel van de toezichthoudende autoriteit, niet een belemmering vormen voor het adequaat
      uitoefenen van toezicht op de effecteninstelling.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel18a
  - number: '19'
    text: |-
      De regels, bedoeld in de [artikelen 12][ref1], [13, eerste en vierde lid][ref2], [16, tweede lid][ref3] en
      [17, tweede lid][ref4], kunnen voor onderscheiden groepen effecteninstellingen verschillend zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0007708#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0007708#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0007708#Artikel17
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: '12'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0007708
        artikel: '13'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0007708
        artikel: '16'
        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0007708
        artikel: '17'
        hoofdstuk: IV
  - number: '20'
    text: |-
      Een effecteninstelling legt, voor zover op haar van toepassing, de volgende gegevens aan de toezichthoudende
      autoriteit over:
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel20
  - number: 20.a
    text: |-
      een verklaring omtrent de identiteit en de antecedenten van de personen, bedoeld in [artikel 10][ref1], alsmede
      gegevens en bescheiden op basis waarvan de toezichthouder kan beoordelen of deze personen voldoen aan de in dat
      artikel bedoelde vereisten;


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel10
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: '10'
        hoofdstuk: IV
  - number: 20.b
    text: |-
      een verklaring omtrent de identiteit van de houders van een gekwalificeerde deelneming in de effecteninstelling,
      alsmede omtrent de omvang van hun deelneming, voor zover deze gegevens de effecteninstelling bekend zijn;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel20
  - number: 20.c
    text: |-
      een verklaring van een accountant ten bewijze dat aan de [artikelen 12][ref1] en [13, eerste lid][ref2], is
      voldaan;


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0007708#Artikel13
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: '12'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0007708
        artikel: '13'
        hoofdstuk: IV
  - number: 20.d
    text: |-
      een beschrijving van de systemen, bedoeld in [artikel 13, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel13
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: '13'
        hoofdstuk: IV
  - number: 20.e
    text: |-
      een beschrijving van de maatregelen, bedoeld in [artikel 14, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel14
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: '14'
        hoofdstuk: IV
  - number: 20.f
    text: |-
      een beschrijving van de regelingen, bedoeld in [artikel 16, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel16
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: '16'
        hoofdstuk: IV
  - number: 20.g
    text: |-
      een beschrijving van de in [artikel 17, eerste lid][ref1], bedoelde administratieve organisatie, interne
      controleprocedures, registratie en systemen;


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel17
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: '17'
        hoofdstuk: IV
  - number: 20.h
    text: |-
      een beschrijving van de in [artikel 17a][ref1] bedoelde maatregelen;


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel17a
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 17a
        hoofdstuk: IV
  - number: 20.i
    text: |-
      de gegevens omtrent de effecteninstelling die ingevolge wettelijk voorschrift in het handelsregister moeten worden
      opgenomen;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel20
  - number: 20.j
    text: de algemene voorwaarden die op overeenkomsten met cliënten van toepassing zijn;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel20
  - number: 20.k
    text: |-
      een opgave van de naar soort onderscheiden diensten die de effecteninstelling als effectenbemiddelaar of
      vermogensbeheerder aanbiedt of verricht;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel20
  - number: 20.l
    text: een opgave van de naar soort onderscheiden effecten waarop de diensten betrekking hebben;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel20
  - number: 20.m
    text: |-
      een opgave van alle andere dan de onder *k* bedoelde beroeps- of bedrijfsmatige werkzaamheden van de
      effecteninstelling, naar soort onderscheiden;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel20
  - number: 20.n
    text: |-
      een opgave van de categorie of categorieën personen waaraan onderscheidenlijk waarvoor de effecteninstelling als
      effectenbemiddelaar of vermogensbeheerder diensten aanbiedt of verricht, waarbij onderscheid wordt gemaakt tussen
      personen die beroeps- of bedrijfsmatig handelen of beleggen in effecten en overige personen;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel20
  - number: 20.o
    text: |-
      een opgave van de naam en het adres van het hoofdkantoor van iedere andere effecteninstelling namens welke de in de
      aanhef bedoelde effecteninstelling diensten aanbiedt of verricht, alsmede, in voorkomend geval, van de plaats waar
      die andere effecteninstelling is gevestigd;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel20
  - number: 20.p
    text: |-
      een beschrijving van de groep waarvan de effecteninstelling deel uitmaakt en van de plaats die zij daarbinnen
      inneemt;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel20
  - number: 20.q
    text: een opgave van de wijze waarop de diensten aan beleggers worden aangeboden; en
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel20
  - number: 20.r
    text: |-
      andere gegevens en bescheiden die de toezichthouder naar zijn oordeel redelijkerwijs nodig acht in het belang van
      de beoordeling van de vergunningaanvraag.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel20
  - number: 20.s
    text: een programma van werkzaamheden, waarvan de vorm en inhoud voldoet aan door de toezichthouder te stellen regels.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel20
  - number: '21'
    text: |-
      De [artikelen 22 tot en met 32][ref1] zijn van toepassing op effecteninstellingen waaraan een vergunning als
      bedoeld in [artikel 7, eerste lid, van de wet][ref2] is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0007657#Artikel7
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: '22'
        hoofdstuk: V
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007657
        artikel: '7'
  - number: '22.1'
    text: 'Een effecteninstelling meldt aan de toezichthoudende autoriteit iedere voorgenomen wijziging in:'
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel22
  - number: 22.1.a
    text: |-
      het aantal en de identiteit van de personen, bedoeld in [artikel 10][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel10
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: '10'
        hoofdstuk: IV
  - number: 22.1.b
    text: |-
      de systemen, bedoeld in [artikel 13, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel13
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: '13'
        hoofdstuk: IV
  - number: 22.1.c
    text: |-
      de maatregelen, bedoeld in [artikel 14, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel14
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: '14'
        hoofdstuk: IV
  - number: 22.1.d
    text: |-
      de regelingen, bedoeld in [artikel 16, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel16
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: '16'
        hoofdstuk: IV
  - number: 22.1.e
    text: |-
      de in [artikel 17, eerste lid][ref1], bedoelde administratieve organisatie, interne controleprocedures, registratie
      en systemen;


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel17
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: '17'
        hoofdstuk: IV
  - number: 22.1.f
    text: |-
      de maatregelen, bedoeld in [artikel 17a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel17a
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 17a
        hoofdstuk: IV
  - number: 22.1.g
    text: |-
      de naam en het adres van het hoofdkantoor van de effecteninstelling, en, indien zij niet in Nederland is gevestigd,
      het adres van het bijkantoor, alsmede, in voorkomend geval, de plaats waar zij is gevestigd; en
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel22
  - number: 22.1.h
    text: |-
      de samenstelling en de formele en feitelijke zeggenschapsstructuur van de groep waartoe de effecteninstelling
      behoort.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel22
  - number: '22.2'
    text: |-
      De melding, bedoeld in het eerste lid, geschiedt onder overlegging van de gegevens, bedoeld in
      [artikel 20, onder ][ref1], alsmede, indien de toezichthoudende autoriteit daarom verzoekt, van andere gegevens
      en bescheiden die de toezichthoudende autoriteit naar zijn oordeel redelijkerwijs nodig acht in het belang van de
      beoordeling van de melding.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel20
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: '20'
        hoofdstuk: IV
  - number: '22.3'
    text: |-
      Ten aanzien van een voorgenomen wijziging als bedoeld in het eerste lid zijn de
      [artikelen 14 tot en met 18][ref1]*a* van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel14
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: '14'
        hoofdstuk: IV
  - number: '22.4'
    text: |-
      Een wijziging als bedoeld in het eerste lid wordt niet doorgevoerd indien de toezichthoudende autoriteit het
      voornemen daartoe afwijst binnen zes weken na ontvangst van de melding, bedoeld in het eerste lid, of, indien de
      toezichthoudende autoriteit overeenkomstig het tweede lid om nadere gegevens en bescheiden heeft verzocht, na de
      ontvangst van die informatie.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel22
  - number: '22.5'
    text: |-
      Indien zich een wijziging van de antecedenten, bedoeld in [artikel 20, onder a][ref1], dan wel van het
      programma van werkzaamheden, bedoeld in [artikel 20, onder s][ref2], voordoet, stelt de effecteninstelling de
      toezichthoudende autoriteit daarvan onverwijld schriftelijk in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0007708#Artikel20
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: '20'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0007708
        artikel: '20'
        hoofdstuk: IV
  - number: 22a.1
    text: |-
      Een effecteninstelling behoort niet tot een groep waarbinnen de formele of feitelijke zeggenschapsstructuur in
      zodanige mate ondoorzichtig is dat deze, naar het oordeel van de toezichthoudende autoriteit, een belemmering vormt
      voor het adequaat uitoefenen van toezicht op de effecteninstelling.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel22a
  - number: 22a.2
    text: |-
      Indien een effecteninstelling in een groep is verbonden met een natuurlijke persoon of een rechtspersoon op wie,
      onderscheidenlijk waarop, het recht van een staat die geen lid-staat is, van toepassing is, mag het recht van
      die staat, naar het oordeel van de toezichthoudende autoriteit, niet een belemmering vormen voor het adequaat
      uitoefenen van toezicht op de effecteninstelling.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel22a
  - number: 22b.1
    text: |-
      Een ieder die een effecteninstelling krachtens wet, statuten of reglementen vertegenwoordigt dan wel het dagelijks
      beleid van een effecteninstelling bepaalt, dient naar het oordeel van de toezichthoudende autoriteit voldoende
      deskundig te zijn in verband met de bedrijfsvoering van de effecteninstelling.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel22b
  - number: 22b.2
    text: |-
      De betrouwbaarheid van de in het eerste lid bedoelde personen, de personen die het dagelijks beleid van de
      effecteninstelling mede bepalen en de personen die rechtstreeks of middellijk bevoegd zijn de in het eerste lid
      bedoelde personen te benoemen of te ontslaan, dient naar het oordeel van de toezichthoudende autoriteit buiten
      twijfel te staan.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel22b
  - number: 22c.1
    text: |-
      De accountant, bedoeld in [artikel 11a, tweede lid, van de wet][ref1], verstrekt op grond van het vijfde lid van
      dat artikel aan de toezichthoudende autoriteit zo spoedig mogelijk alle inlichtingen die redelijkerwijs nodig zijn
      ten behoeve van het toezicht op de naleving van de wet over de volgende onderwerpen:


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel11a
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel22c
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: 11a
  - number: 22c.1.a
    text: het accountantsverslag aan de directie en de raad van commissarissen;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel22c
  - number: 22c.1.b
    text: de *management letter*;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel22c
  - number: 22c.1.c
    text: |-
      correspondentie tussen de accountant en de effecteninstelling die rechtstreeks betrekking heeft op de
      accountantsverklaring bij de jaarrekening en op de maand- en de kwartaalstaat van de effecteninstelling.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel22c
  - number: 22c.2
    text: |-
      Indien de accountant, bedoeld in het eerste lid, schriftelijk inlichtingen verstrekt aan de toezichthoudende
      autoriteit over de in het voorgaande lid genoemde onderwerpen, zendt hij onverwijld aan de effecteninstelling een
      afschrift van de stukken en van de begeleidende brief.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel22c
  - number: '23.1'
    text: |-
      Het eigen vermogen en het toetsingsvermogen van een effecteninstelling voldoen aan de regels, bedoeld in de
      [artikelen 12][ref1] onderscheidenlijk [13, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0007708#Artikel13
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: '12'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0007708
        artikel: '13'
        hoofdstuk: IV
  - number: '23.2'
    text: |-
      Een effecteninstelling brengt aan de toezichthoudende autoriteit verslag uit met betrekking tot het in het eerste
      lid bedoelde voorschrift volgens door de toezichthoudende autoriteit te stellen regels.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel23
  - number: '23.3'
    text: |-
      Een effecteninstelling die niet voldoet aan het in het eerste lid bedoelde voorschrift brengt haar eigen vermogen
      en haar toetsingsvermogen binnen een door de toezichthoudende autoriteit te stellen termijn in overeenstemming
      met de regels, bedoeld in de [artikelen 12][ref1] onderscheidenlijk [13, eerste lid][ref2], en houdt zich aan door
      de toezichthoudende autoriteit te geven instructies met betrekking tot het verrichten van effectentransacties en
      handelingen die met die effectentransacties verband houden.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0007708#Artikel13
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: '12'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0007708
        artikel: '13'
        hoofdstuk: IV
  - number: '24'
    text: |-
      Onverminderd het bepaalde in de [artikelen 24a][ref1] en [24b][ref2] houdt een effecteninstelling zich bij het
      verrichten van haar werkzaamheden aan door de toezichthoudende autoriteit te stellen regels die ertoe strekken dat
      de effecteninstelling:


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel24a
      [ref2]: https://wetten.overheid.nl/BWBR0007708#Artikel24b
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 24a
        hoofdstuk: V
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007708
        artikel: 24b
        hoofdstuk: V
        paragraaf: '1'
  - number: 24.a
    text: handelt in het belang van haar cliënten en de adequate functionering van de effectenmarkten;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel24
  - number: 24.b
    text: |-
      in het belang van haar cliënten kennis neemt van hun financiële positie, ervaring en beleggingsdoelstellingen, voor
      zover dit redelijkerwijs van belang is met het oog op het verrichten van haar diensten;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel24
  - number: 24.c
    text: |-
      haar cliënten de gegevens en bescheiden verstrekt die nodig zijn voor de beoordeling van de door haar aangeboden
      diensten en de effecten waarop die diensten betrekking hebben;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel24
  - number: 24.d
    text: |-
      ervoor zorgt dat haar cliënten op billijke wijze worden behandeld in het geval dat een belangenconflict
      onvermijdelijk blijkt te zijn;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel24
  - number: 24.e
    text: |-
      de bevoegdheden die zij heeft gekregen ten behoeve van de door haar te verrichten diensten, niet gebruikt voor
      andere doeleinden dan die waarvoor zij aan haar zijn verleend; en
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel24
  - number: 24.f
    text: |-
      een goede interne organisatie en adequate controlemechanismen heeft ten behoeve van de naleving van de in de aanhef
      bedoelde regels en ter bevordering van de continuïteit van haar bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel24
  - number: 24a.1
    text: |-
      Een effecteninstelling voert een adequaat beleid ter zake van het tegengaan van verstrengeling van tegenstrijdige
      belangen. De effecteninstelling draagt er zorg voor dat dit beleid zijn neerslag vindt in organisatorische en
      administratieve procedures en maatregelen.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel24a
  - number: 24a.2
    text: |-
      De toezichthoudende autoriteit stelt regels vast met betrekking tot de minimumvoorwaarden waaraan het beleid en de
      procedures en maatregelen, bedoeld in het eerste lid, moeten voldoen.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel24a
  - number: 24b.1
    text: 'Een effecteninstelling voert een adequaat beleid dat ertoe strekt dat:'
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel24b
  - number: 24b.1.a
    text: |-
      betrokkenheid van de effecteninstelling bij strafbare feiten die het vertrouwen in de effecteninstelling of in de
      financiële markten in het algemeen schaden, wordt voorkomen;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel24b
  - number: 24b.1.b
    text: |-
      betrokkenheid van de effecteninstelling bij handelingen die anderszins in het maatschappelijk verkeer zodanig
      onaanvaardbaar zijn dat deze het vertrouwen in de effecteninstelling of in de financiële markten in het algemeen
      schaden, wordt voorkomen;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel24b
  - number: 24b.1.c
    text: |-
      niet wegens haar cliënten het vertrouwen in de effecteninstelling of in de financiële markten in het algemeen wordt
      geschaad.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel24b
  - number: 24b.2
    text: |-
      De effecteninstelling draagt er zorg voor dat het in het eerste lid bedoelde beleid zijn neerslag vindt in
      organisatorische en administratieve procedures en maatregelen.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel24b
  - number: 24b.3
    text: |-
      De toezichthoudende autoriteit stelt regels vast met betrekking tot de voorwaarden waaraan het beleid en de
      procedures en maatregelen, bedoeld in het eerste en tweede lid, ten minste moeten voldoen.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel24b
  - number: 24c
    text: |-
      De in [artikel 24b, tweede en derde lid][ref1], bedoelde procedures en maatregelen betreffen in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel24b
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel24c
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 24b
        hoofdstuk: V
        paragraaf: '1'
  - number: 24c.a
    text: |-
      de behandeling en administratieve vastlegging van incidenten die een ernstig gevaar vormen voor een integere
      bedrijfsvoering van de effecteninstelling, voorzover het betreft een gedraging van een personeelslid of van een
      persoon die het dagelijks beleid bepaalt dan wel mede bepaalt van de effecteninstelling, dan wel van een houder
      van een gekwalificeerde deelneming of van een natuurlijke persoon of rechtspersoon die werkzaamheden verricht ten
      behoeve van de effecteninstelling.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel24c
  - number: 24c.b
    text: |-
      de beoordeling, met het oog op de belangen van cliënten of toekomstige cliënten van de effecteninstelling, of de
      betrouwbaarheid van een personeelslid dat zij voornemens is te benoemen in een integriteitsgevoelige functie buiten
      twijfel staat. Onder integriteitsgevoelige functie wordt in dit verband verstaan:
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel24c
  - number: 24c.b.1º
    text: |-
      een leidinggevende functie die is geplaatst direct onder het echelon van de bepalers en medebepalers van het
      dagelijks beleid van de effecteninstelling;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel24c
  - number: 24c.b.2º
    text: |-
      een functie waaraan overigens een bevoegdheid is verbonden die een wezenlijk risico bevat voor de integere
      bedrijfsvoering van de effecteninstelling.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel24c
  - number: 24d.1
    text: |-
      Een effecteninstelling onderzoekt, op verzoek van de toezichthoudende autoriteit, of in haar administratie bepaalde
      personen of instellingen voorkomen die naar het oordeel van Onze Minister, in verband met vermoede terroristische
      activiteiten of daarmee verband houdende activiteiten, de integriteit van de financiële sector kunnen schaden.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel24d
  - number: 24d.2
    text: |-
      Een effecteninstelling verstrekt de uitkomst van het in het eerste lid bedoelde onderzoek, binnen een door de
      toezichthoudende autoriteit vast te stellen termijn, aan de toezichthoudende autoriteit.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel24d
  - number: 24e
    text: |-
      Een effecteninstelling meldt aan de toezichthoudende autoriteit ten behoeve van het toezicht op de naleving van
      het bij en krachtens de [artikelen 24a tot en met 24e][ref1] bepaalde de door de toezichthoudende autoriteit
      noodzakelijk geachte gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel24a
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel24e
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 24a
        hoofdstuk: V
        paragraaf: '1'
  - number: '25.1'
    text: |-
      Een effecteninstelling sluit met iedere cliënt een schriftelijke overeenkomst die de uitsluitende grondslag vormt
      voor de diensten die de effecteninstelling in de uitoefening van haar bedrijf voor de cliënt verricht.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel25
  - number: '25.2'
    text: 'In de overeenkomst zijn ten minste bepaald:'
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel25
  - number: 25.2.a
    text: de rechten en verplichtingen van de cliënt en de effecteninstelling uit hoofde van de overeenkomst;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel25
  - number: 25.2.b
    text: |-
      de naar soort onderscheiden diensten die de effecteninstelling in het kader van de overeenkomst voor de cliënt
      zal verrichten;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel25
  - number: 25.2.c
    text: |-
      een specificatie van de eventuele beperkingen met betrekking tot de markten waarop effectentransacties ten behoeve
      van de cliënt zullen worden afgewikkeld;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel25
  - number: 25.2.d
    text: |-
      de naar soort onderscheiden kosten, anders dan de kosten ter zake van een aanbieding van effecten bij uitgifte, die
      aan de cliënt in rekening worden gebracht alsmede de aan die kosten ten grondslag liggende berekening;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel25
  - number: 25.2.e
    text: |-
      de wijze waarop instructies van de cliënt en berichten van de effecteninstelling worden verstrekt en
      geadministreerd;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel25
  - number: 25.2.f
    text: de wijze waarop gelden of effecten van de cliënt worden verrekend, gedeponeerd en geadministreerd;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel25
  - number: 25.2.g
    text: de wijze waarop over de rekeningen van de cliënt kan worden beschikt;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel25
  - number: 25.2.h
    text: |-
      de regelingen inzake de aansprakelijkheid van de effecteninstelling onderscheidenlijk de cliënt uit hoofde van
      de overeenkomst;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel25
  - number: 25.2.i
    text: |-
      een verklaring van de cliënt dat hij heeft kennis genomen van de informatie die de effecteninstelling krachtens dit
      besluit aan hem dient te verstrekken en dat hij zich bewust is van de risico’s die aan de belegging zijn verbonden;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel25
  - number: 25.2.j
    text: de regeling van toepasselijk recht en de wijze van beslechting van geschillen; en
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel25
  - number: 25.2.k
    text: |-
      de omstandigheden waaronder de overeenkomst tussen de effecteninstelling en de cliënt een einde neemt, de
      omstandigheden waaronder de overeenkomst kan worden ontbonden en de wijze waarop op of na de datum van beëindiging
      nog lopende transacties worden afgewikkeld.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel25
  - number: '25.3'
    text: 'Indien de overeenkomst betrekking heeft op vermogensbeheer is daarin tevens bepaald:'
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel25
  - number: 25.3.a
    text: |-
      de samenstelling van het beheerde vermogen naar effectensoort en de waarde van het te beheren vermogen ten tijde
      van het sluiten van de overeenkomst;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel25
  - number: 25.3.b
    text: de doelstellingen van de cliënt ter zake van het vermogensbeheer;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel25
  - number: 25.3.c
    text: |-
      een specificatie van de eventuele kwalitatieve en kwantitatieve beperkingen ten aanzien van de effecten of
      categorieën van effecten waarin mag worden belegd;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel25
  - number: 25.3.d
    text: |-
      de wijze waarop het beheer wordt gevoerd alsmede de betrokkenheid van de cliënt daarbij, daaronder een regeling van
      de machtiging aan de effecteninstelling; en
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel25
  - number: 25.3.e
    text: de frequentie van rapportage aan de cliënt.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel25
  - number: '25.4'
    text: |-
      De toezichthoudende autoriteit kan nadere regels stellen met betrekking tot de inhoud en het model van de
      overeenkomst, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel25
  - number: '26'
    text: |-
      De [artikelen 24, aanhef en onder b en c][ref1], en [25][ref2] zijn niet van toepassing voor zover een
      effecteninstelling diensten aanbiedt aan of verricht voor personen die beroeps- of bedrijfsmatig handelen of
      beleggen in effecten.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0007708#Artikel25
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: '24'
        hoofdstuk: V
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007708
        artikel: '25'
        hoofdstuk: V
        paragraaf: '1'
  - number: '27.1'
    text: |-
      Een effecteninstelling informeert iedere cliënt over de toepasselijkheid van een garantieregeling op de door haar
      aangeboden diensten, alsmede, indien een garantieregeling van toepassing is, over de inhoud van die regeling.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel27
  - number: '27.2'
    text: |-
      Een effecteninstelling deelt aan een ieder die een gerechtvaardigd belang heeft op verzoek mede aan welke systemen
      als bedoeld in [artikel 212a van de Faillissementswet][ref1] de effecteninstelling deelneemt.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel212a
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: 212a
  - number: '27.3'
    text: |-
      Een effecteninstelling verstrekt aan een ieder die een gerechtvaardigd belang heeft op verzoek
      informatie over de belangrijkste regels die gelden voor de werking van de systemen bedoeld in
      [artikel 212a van de Faillissementswet][ref1], waaraan de effecteninstelling deelneemt.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel212a
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: 212a
  - number: '28'
    text: |-
      Een effecteninstelling die in de uitoefening van haar bedrijf effectentransacties en andere daarmee verband
      houdende handelingen verricht voor rekening van een cliënt, reikt aan die cliënt onverwijld een effectennota uit
      die voldoet aan door de toezichthoudende autoriteit te stellen regels met betrekking tot de gegevens die op de
      effectennota worden vermeld.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel28
  - number: '29.1'
    text: |-
      Een effecteninstelling die in de uitoefening van haar bedrijf vermogensbeheer verricht, stelt regelmatig aan iedere
      cliënt met wie zij een overeenkomst inzake vermogensbeheer heeft gesloten een opgave beschikbaar die een getrouw en
      volledig overzicht geeft van de samenstelling van het door de effecteninstelling voor die cliënt beheerde vermogen.
      Deze opgave bevat ten minste de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel29
  - number: 29.1.a
    text: de samenstelling naar effectensoort en de marktwaarde van het onder beheer zijnde vermogen; en
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel29
  - number: 29.1.b
    text: de aan de cliënt in rekening gebrachte onderscheidenlijk te brengen kosten van beheer en overige kosten.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel29
  - number: '29.2'
    text: |-
      De toezichthoudende autoriteit kan nadere regels stellen met betrekking tot de frequentie en het model van de
      opgave, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel29
  - number: '30.1'
    text: |-
      Een effecteninstelling houdt zich aan door de toezichthoudende autoriteit te stellen regels met betrekking tot door
      de effecteninstelling te rapporteren gegevens over door haar verrichte transacties in effecten die zijn toegelaten
      tot de notering aan een effectenbeurs.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel30
  - number: '30.2'
    text: |-
      Een effecteninstelling bewaart alle gegevens die betrekking hebben op haar bedrijfsvoering, waaronder de gegevens
      die betrekking hebben op de transacties, bedoeld in het eerste lid, ten minste vijf jaren op systematische en
      overzichtelijke wijze.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel30
  - number: '31'
    text: |-
      De regels, bedoeld in de [artikelen 23, tweede lid][ref1], [24, aanhef][ref2], [24a][ref3],
      [24b][ref4], [25, vierde lid][ref5], [28][ref6] en [30, eerste lid][ref7], en het model, bedoeld in
      [artikel 29, tweede lid][ref8], kunnen voor onderscheiden groepen effecteninstellingen verschillend zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0007708#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0007708#Artikel24a
      [ref4]: https://wetten.overheid.nl/BWBR0007708#Artikel24b
      [ref5]: https://wetten.overheid.nl/BWBR0007708#Artikel25
      [ref6]: https://wetten.overheid.nl/BWBR0007708#Artikel28
      [ref7]: https://wetten.overheid.nl/BWBR0007708#Artikel30
      [ref8]: https://wetten.overheid.nl/BWBR0007708#Artikel29
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: '23'
        hoofdstuk: V
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007708
        artikel: '24'
        hoofdstuk: V
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007708
        artikel: 24a
        hoofdstuk: V
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0007708
        artikel: 24b
        hoofdstuk: V
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0007708
        artikel: '25'
        hoofdstuk: V
        paragraaf: '1'
      - id: ref6
        bwb_id: BWBR0007708
        artikel: '28'
        hoofdstuk: V
        paragraaf: '1'
      - id: ref7
        bwb_id: BWBR0007708
        artikel: '30'
        hoofdstuk: V
        paragraaf: '1'
      - id: ref8
        bwb_id: BWBR0007708
        artikel: '29'
        hoofdstuk: V
        paragraaf: '1'
  - number: '32'
    text: |-
      Een effecteninstelling die niet in Nederland is gevestigd, legt binnen zes maanden na afloop
      van ieder boekjaar een afschrift van een gecontroleerde jaarrekening over dat jaar over aan de
      toezichthoudende autoriteit. Deze jaarrekening is onderzocht door een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1], dan wel door een deskundige die ingevolge
      het recht van de staat waar de effecteninstelling haar zetel heeft, bevoegd is de jaarrekening te onderzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 32a
    text: |-
      Een effecteninstelling verleent geen medewerking aan de uitvoering en afwikkeling van een openbaar bod, indien het
      bod in strijd met [Hoofdstuk IIA van de wet](onbekend) wordt uitgebracht.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel32a
  - number: '33'
    text: |-
      De [artikelen 34 tot en met 42][ref1] zijn van toepassing op kredietinstellingen waaraan een vergunning als bedoeld
      in [artikel 6][ref2] of [artikel 38 van de Wet toezicht kredietwezen 1992][ref3] is verleend en op financiële
      instellingen waaraan een verklaring van ondertoezichtstelling als bedoeld in [artikel 45 van die wet][ref4] is
      verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005792#Artikel38
      [ref4]: https://wetten.overheid.nl/BWBR0007657#Artikel45
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: '34'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005792
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0005792
        artikel: '38'
      - id: ref4
        bwb_id: BWBR0007657
        artikel: '45'
  - number: '34.1'
    text: |-
      Een instelling houdt zich aan door de toezichthoudende autoriteit te stellen regels met betrekking tot de in
      [artikel 16, eerste lid][ref1], bedoelde regelingen, met betrekking tot de in [artikel 17, eerste lid][ref2],
      bedoelde administratieve organisatie, interne controleprocedures en registratie en met betrekking tot de in
      [artikel 17a][ref3] bedoelde maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0007708#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0007708#Artikel17a
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: '16'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0007708
        artikel: '17'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0007708
        artikel: 17a
        hoofdstuk: IV
  - number: '34.2'
    text: |-
      De regels, bedoeld in het eerste lid, worden door de toezichthoudende autoriteit na overleg met de Nederlandsche
      Bank gesteld.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel34
  - number: '34.3'
    text: |-
      Een instelling meldt aan de toezichthoudende autoriteit iedere voorgenomen wijziging in de in het eerste lid
      bedoelde regelingen, administratieve organisatie, interne controleprocedures, registratie en maatregelen, onder
      overlegging van de gegevens, bedoeld in [artikel 20, onder f, g, h onderscheidenlijk i][ref1], alsmede, indien de
      toezichthoudende autoriteit daarom verzoekt, van andere gegevens en bescheiden die de toezichthoudende autoriteit
      naar zijn oordeel redelijkerwijs nodig acht in het belang van de beoordeling van de melding.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel20
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: '20'
        hoofdstuk: IV
  - number: '34.4'
    text: |-
      Ten aanzien van een voorgenomen wijziging als bedoeld in het derde lid is het eerste lid van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel34
  - number: '34.5'
    text: |-
      Een wijziging als bedoeld in het derde lid wordt niet doorgevoerd indien de toezichthoudende autoriteit het
      voornemen daartoe afwijst binnen zes weken na ontvangst van de melding, bedoeld in het derde lid, of, indien
      de toezichthoudende autoriteit overeenkomstig het derde lid om nadere gegevens en bescheiden heeft verzocht, na
      ontvangst van die informatie.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel34
  - number: '35'
    text: |-
      Onverminderd het bepaalde in de [artikelen 24a][ref1] en [24b][ref2] houdt een instelling zich bij het verrichten
      van haar werkzaamheden aan door de toezichthoudende autoriteit te stellen regels die ertoe strekken dat de
      instelling:


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel24a
      [ref2]: https://wetten.overheid.nl/BWBR0007708#Artikel24b
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 24a
        hoofdstuk: V
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007708
        artikel: 24b
        hoofdstuk: V
        paragraaf: '1'
  - number: 35.a
    text: handelt in het belang van haar cliënten en de adequate functionering van de effectenmarkten;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel35
  - number: 35.b
    text: |-
      in het belang van haar cliënten kennis neemt van hun financiële positie, ervaring en beleggingsdoelstellingen, voor
      zover dit redelijkerwijs van belang is met het oog op het verrichten van haar diensten;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel35
  - number: 35.c
    text: |-
      haar cliënten de gegevens en bescheiden verstrekt die nodig zijn voor de beoordeling van de door haar aangeboden
      diensten en de effecten waarop die diensten betrekking hebben;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel35
  - number: 35.d
    text: |-
      ervoor zorgt dat haar cliënten op billijke wijze worden behandeld in het geval dat een belangenconflict
      onvermijdelijk blijkt te zijn;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel35
  - number: 35.e
    text: |-
      de bevoegdheden die zij heeft gekregen ten behoeve van de door haar te verrichten diensten, niet gebruikt voor
      andere doeleinden dan die waarvoor zij aan haar zijn verleend; en
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel35
  - number: 35.f
    text: |-
      een goede interne organisatie en adequate controlemechanismen heeft ten behoeve van de naleving van de in de aanhef
      bedoelde regels.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel35
  - number: 35a
    text: |-
      Op een instelling zijn de [artikelen 24a tot en met 24e][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel24a
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: 24a
        hoofdstuk: V
        paragraaf: '1'
  - number: '36.1'
    text: |-
      Een instelling sluit met iedere cliënt een schriftelijke overeenkomst die de uitsluitende grondslag vormt voor de
      diensten die de instelling in de uitoefening van haar bedrijf voor de cliënt verricht.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel36
  - number: '36.2'
    text: 'In de overeenkomst zijn ten minste bepaald:'
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel36
  - number: 36.2.a
    text: de rechten en verplichtingen van de cliënt en de instelling uit hoofde van de overeenkomst;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel36
  - number: 36.2.b
    text: |-
      de naar soort onderscheiden diensten die de instelling in het kader van de overeenkomst voor de cliënt zal
      verrichten;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel36
  - number: 36.2.c
    text: |-
      een specificatie van de eventuele beperkingen met betrekking tot de markten waarop effectentransacties ten behoeve
      van de cliënt zullen worden afgewikkeld;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel36
  - number: 36.2.d
    text: |-
      de naar soort onderscheiden kosten, anders dan de kosten ter zake van een aanbieding van effecten bij uitgifte, die
      aan de cliënt in rekening worden gebracht alsmede de aan die kosten ten grondslag liggende berekening;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel36
  - number: 36.2.e
    text: de wijze waarop instructies van de cliënt en berichten van de instelling worden verstrekt en geadministreerd;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel36
  - number: 36.2.f
    text: de wijze waarop gelden of effecten van de cliënt worden verrekend, gedeponeerd en geadministreerd;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel36
  - number: 36.2.g
    text: de wijze waarop over de rekeningen van de cliënt kan worden beschikt;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel36
  - number: 36.2.h
    text: |-
      de regelingen inzake de aansprakelijkheid van de instelling onderscheidenlijk de cliënt uit hoofde van de
      overeenkomst;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel36
  - number: 36.2.i
    text: |-
      een verklaring van de cliënt dat hij heeft kennis genomen van de informatie die de instelling krachtens dit besluit
      aan hem dient te verstrekken en dat hij zich bewust is van de risico’s die aan de belegging zijn verbonden;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel36
  - number: 36.2.j
    text: de regeling van toepasselijk recht en de wijze van beslechting van geschillen; en
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel36
  - number: 36.2.k
    text: |-
      de omstandigheden waaronder de overeenkomst tussen de instelling en de cliënt een einde neemt, de omstandigheden
      waaronder de overeenkomst kan worden ontbonden en de wijze waarop op of na de datum van beëindiging nog lopende
      transacties worden afgewikkeld.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel36
  - number: '36.3'
    text: 'Indien de overeenkomst betrekking heeft op vermogensbeheer is daarin tevens bepaald:'
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel36
  - number: 36.3.a
    text: |-
      de samenstelling van het beheerde vermogen naar effectensoort en de waarde van het te beheren vermogen ten tijde
      van het sluiten van de overeenkomst;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel36
  - number: 36.3.b
    text: de doelstellingen van de cliënt ter zake van het vermogensbeheer;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel36
  - number: 36.3.c
    text: |-
      een specificatie van de eventuele kwalitatieve en kwantitatieve beperkingen ten aanzien van de effecten of
      categorieën van effecten waarin mag worden belegd;
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel36
  - number: 36.3.d
    text: |-
      de wijze waarop het beheer wordt gevoerd alsmede de betrokkenheid van de cliënt daarbij, daaronder een regeling van
      de machtiging aan de instelling; en
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel36
  - number: 36.3.e
    text: de frequentie van rapportage aan de cliënt.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel36
  - number: '36.4'
    text: |-
      De toezichthoudende autoriteit kan nadere regels stellen met betrekking tot de inhoud en het model van de
      overeenkomst, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel36
  - number: '37'
    text: |-
      De [artikelen 35, aanhef en onder b en c][ref1], en [36][ref2] zijn niet van toepassing ingeval een instelling
      diensten aanbiedt aan of verricht voor personen die beroeps- of bedrijfsmatig handelen of beleggen in effecten.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0007708#Artikel36
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0007708
        artikel: '35'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007708
        artikel: '36'
        hoofdstuk: V
        paragraaf: '2'
  - number: '38'
    text: |-
      Een instelling die in de uitoefening van haar bedrijf effectentransacties en andere daarmee verband houdende
      handelingen verricht voor rekening van een cliënt, reikt aan die cliënt onverwijld een effectennota uit die voldoet
      aan door de toezichthoudende autoriteit te stellen regels met betrekking tot de gegevens die op de effectennota
      worden vermeld.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel38
  - number: '39.1'
    text: |-
      Een instelling die in de uitoefening van haar bedrijf vermogensbeheer verricht, stelt regelmatig aan iedere cliënt
      met wie zij een overeenkomst inzake vermogensbeheer heeft gesloten een opgave beschikbaar die een getrouw en
      volledig overzicht geeft van de samenstelling van het door de instelling voor die cliënt beheerde vermogen. Deze
      opgave bevat ten minste de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel39
  - number: 39.1.a
    text: de samenstelling naar effectensoort en de marktwaarde van het onder beheer zijnde vermogen; en
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel39
  - number: 39.1.b
    text: de aan de cliënt in rekening gebrachte onderscheidenlijk te brengen kosten van beheer en overige kosten.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel39
  - number: '39.2'
    text: |-
      De toezichthoudende autoriteit kan nadere regels stellen met betrekking tot de frequentie en het model van de
      opgave, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel39
  - number: '40.1'
    text: |-
      Een instelling houdt zich aan door de toezichthoudende autoriteit te stellen regels met betrekking tot door de
      instelling te rapporteren gegevens over door haar verrichte transacties in effecten die zijn toegelaten tot de
      notering aan een effectenbeurs.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel40
  - number: '40.2'
    text: |-
      Een instelling bewaart alle gegevens die betrekking hebben op haar bedrijfsvoering, waaronder de gegevens
      die betrekking hebben op de transacties, bedoeld in het eerste lid, ten minste vijf jaren op systematische en
      overzichtelijke wijze.
    url: https://wetten.overheid.nl/BWBR0007708/2005-10-01#Artikel40
  - number: '41'
    text: |-
      De regels, bedoeld in de [artikelen 34, eerste lid][ref1], [35, aanhef ][ref2],[ 35a][ref3],
      [36, vierde lid][ref4], [38][ref5] en [40, eerste lid][ref6], en het model, bedoeld in
      [artikel 39, tweede lid][ref7], kunnen voor onderscheiden groepen instellingen verschillend zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0007708#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0007708#Artikel35a
      [ref4]: https://wetten.overheid.nl/BWBR0007708#Artikel36
      [ref5]: https://wetten.overheid.nl/BWBR0007708#Artikel38
      [ref6]: https://wetten.overheid.nl/BWBR0007708#Artikel40
      [ref7]: https://wetten.overheid.nl/BWBR0007708#Artikel39
