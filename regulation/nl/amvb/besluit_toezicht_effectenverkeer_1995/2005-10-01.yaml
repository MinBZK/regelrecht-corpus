  - number: '44'
    text: |-
      De regels, bedoeld in de [artikelen 35, aanhef][ref1], [36, vierde lid][ref2], en [38][ref3], en het model,
      bedoeld in [artikel 39, tweede lid][ref4], kunnen voor onderscheiden groepen effecteninstellingen als bedoeld in
      [artikel 43][ref5] verschillend zijn.


