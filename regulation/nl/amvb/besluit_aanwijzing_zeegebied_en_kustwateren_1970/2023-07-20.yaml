  - number: 2a
    text: |-
      De coördinaten in [artikel 2][ref1] zijn uitgedrukt in lengte en breedte volgens het World Geodetic System 84
      (WGS84), in graden en minuten en, in voorkomend geval, in seconden.


      [ref1]: https://wetten.overheid.nl/BWBR0002703#Artikel2
    url: https://wetten.overheid.nl/BWBR0002703/2023-07-20#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0002703
        artikel: '2'
  - number: '3'
    text: |-
      Waar kustwateren in verbinding staan met wateren, bedoeld in artikel 1, vierde lid, onder *d,* van de
      [Visserijwet 1963][ref1], geldt als grens:

      a. waar geen open verbinding is, de waterkering, welke het dichtst gelegen is bij het kustwater;

      b. waar een open verbinding is, de lijn gaande over de uitmonding, met dien verstande dat in de Nieuwe Waterweg als
      grens geldt de lijn gaande van het oostelijk havenhoofd van Maassluis naar het punt met het coördinaat 51°54.649'NB
      04°14.870'OL.


      [ref1]: https://wetten.overheid.nl/BWBR0002416
    url: https://wetten.overheid.nl/BWBR0002703/2023-07-20#Artikel3
    references:
