preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onze Minister van Landbouw en Visserij van 20 maart 1970, No. J 654, Directie Juridische en
    Bedrijfsorganisatorische Zaken;

    Gehoord het Produktschap voor Vis en Visprodukten, het Visserijschap, het Bedrijfschap voor de Groothandel in Vis
    en Aanverwante Bedrijven en de Algemeene Hengelaarsbond;

    Gelet op artikel 1, vierde lid, onder b en c, van de Visserijwet 1963;

    De Raad van State gehoord (advies van 8 april 1970, nr. 23);

    Gezien het nader rapport van Onze voornoemde Minister van 15 april 1970, nr. J 907, Directie Juridische en
    Bedrijfsorganisatorische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002703/2023-07-20#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Als zeegebied, bedoeld in artikel 1, vierde lid, onderdeel *b*, van de [Visserijwet 1963][ref1] worden aangewezen:

      1. de havens van IJmuiden en de toeleidingskanalen naar het Noordzeekanaal tot de meest zeewaarts gelegen
      waterkeringen;

      2. het Uitwateringskanaal te Katwijk tot de meest zeewaarts gelegen waterkering;

      3. de havens van Scheveningen tot de meest zeewaarts gelegen waterkeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0002416
    url: https://wetten.overheid.nl/BWBR0002703/2023-07-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002416
  - number: '2'
    text: |-
      Als kustwater, bedoeld in artikel 1, vierde lid, onder *c,* van de [Visserijwet 1963][ref1], worden aangewezen:

      1. de Waddenzee en het Nederlands gedeelte van de Dollard en de Eems binnen de volgende grenzen:

      a. voor de Westereems: de lijn gaande van de lichttoren van Borkum naar de Emder- of Grote Kaap op Rottumeroog,
      voor zover die lijn over Nederlands gebied loopt;

      b. voor het Schild, de Lauwers, het Friesche Gat, het Pinkegat, het Amelandergat, het Vlie, het Eierlandsche Gat en
      het Texelsche Gat: de basislijn van de territoriale zee van Nederland.

      2. a. de Maasmond;

      b. de Nieuwe Waterweg tot de lijn gaande van het oostelijk havenhoofd van Maassluis naar het punt met het
      coördinaat 51°54.649'NB 04°14.870'OL;

      c. het Calandkanaal met de daaraan direct en indirect gelegen open havens;

      d. het Beerkanaal, voor zover gelegen ten westen van de lijn tussen de coördinaten 51°56.573'NB 04°04.990'OL en
      51°56.358'NB 04°04.760'OL, met de daaraan direct en indirect gelegen open havens;

      e. het Yangtzekanaal met de daaraan direct en indirect gelegen open havens.

      3. Het zeegat van Goeree, landwaarts van een lijn getrokken tussen punt A (51°55'20"NB 03°59'23"OL) en punt B
      (51°50'00"NB 03°50'01"OL) tot de meest zeewaarts gelegen waterkeringen in het zuidwesten begrensd door de lijn
      getrokken vanaf de vuurtoren Westhoofd op Goeree (51°48'50"NB 03°51'55"OL) in noordwestelijke richting (315° r.w.)
      tot punt B.

      4. Het Brouwershavense Gat, landwaarts van een lijn getrokken van punt B tot punt C (51°44'48"NB 03°40'23"OL) tot
      de meest zeewaarts gelegen waterkering, in het noordoosten begrensd door het Zeegat van Goeree en in het zuidwesten
      door de lijn getrokken vanaf de lichtopstand "De Verklikker" op Schouwen-Duiveland (51°43'34"NB 03°42'23"OL) in
      noordwestelijke richting (315° r.w.) tot punt C.

      5. De Oosterschelde, landwaarts van een lijn getrokken van punt C via punt D (51°42'36"NB 03°36'40"OL) naar
      de kerktoren van de Nederlandse Hervormde kerk te Oostkapelle (51°33'59"NB 03°33'07"OL) tot de Grevelingendam,
      Philipsdam en Oesterdam.

      6. De Westerschelde voor zover gelegen ten oosten van de basislijn van de territoriale zee van Nederland.

      7. De aan de onder 1 tot en met 6 bedoelde wateren gelegen open havens en de met die wateren in open gemeenschap
      staande inhammen, kreken, spranken, gaten en killen.


      [ref1]: https://wetten.overheid.nl/BWBR0002416
