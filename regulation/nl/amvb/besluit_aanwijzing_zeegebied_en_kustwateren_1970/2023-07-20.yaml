  - number: '4'
    text: Ons besluit van 21 mei 1964 (*Stb.* 1964, 163) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002703/2023-07-20#Artikel4
  - number: '5'
    text: |-
      Dit besluit treedt in werking op 1 mei 1970. Het kan worden aangehaald als "Besluit aanwijzing zeegebied en
      kustwateren" met vermelding van het jaartal van het *Staatsblad*, waarin het is geplaatst.
    url: https://wetten.overheid.nl/BWBR0002703/2023-07-20#Artikel5
