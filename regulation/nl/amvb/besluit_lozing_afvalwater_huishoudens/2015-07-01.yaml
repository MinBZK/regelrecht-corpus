preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 21 maart
    2006, nr. DJZ2006244854, Directie Juridische Zaken, Afdeling Wetgeving, gedaan mede namens de Staatssecretaris van
    Verkeer en Waterstaat;

    Gelet op richtlijn nr. 2006/11/EG van 15 februari 2006 betreffende de verontreiniging veroorzaakt door bepaalde
    gevaarlijke stoffen die in het aquatisch milieu van de Gemeenschap worden geloosd (PbEU L 64), richtlijn nr. 80/68/
    EEG van de Raad van de Europese Gemeenschappen van 17 december 1979 betreffende de bescherming van het grondwater
    tegen verontreiniging veroorzaakt door de lozing van bepaalde gevaarlijke stoffen (PbEG L 020), richtlijn
    nr. 91/271/EEG van de Raad van de Europese Gemeenschappen van 21 mei 1991 inzake de behandeling van stedelijk
    afvalwater (PbEG L 135), richtlijn nr. 2006/118/EG van het Europees Parlement en de Raad van de Europese Unie
    van 12 december 2006 betreffende de bescherming van het grondwater tegen verontreiniging en achteruitgang van de
    toestand (PbEU L 371) en richtlijn nr. 2000/60/EG van het Europees Parlement en de Raad van de Europese Unie van
    23 oktober 2000 tot vaststelling van een kader voor communautaire maatregelen betreffende het waterbeleid (PbEG L
    327), op de artikelen 10.2, tweede en derde lid, 10.30, derde lid, en 10.32 van de Wet milieubeheer, de artikelen
    6, 15, 17, 65, 67, 92 en 97 van de Wet bodembescherming en op de artikelen 1, derde lid, 2a, eerste en tweede lid,
    2b, eerste en tweede lid, en 2c, tweede lid, van de Wet verontreiniging oppervlaktewateren;

    De Raad van State gehoord (advies van 28 juni 2006, nr. W08.06.0084/V);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, van 13
    november 2007, nr. DJZ2007111899, Directie Juridische Zaken, Afdeling Wetgeving, uitgebracht mede namens de
    Staatssecretaris van Verkeer en Waterstaat;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel1
  - number: 1.1.a
    text: |-
      bevoegd gezag: burgemeester en wethouders van de gemeente waar het lozen plaatsvindt of de beheerder indien het
      lozen betreft als bedoeld in [artikel 6.2 van de Waterwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
  - number: 1.1.b
    text: |-
      gebouw: een bouwwerk als bedoeld in [artikel 1, eerste lid, van de Woningwet][ref1], waaronder mede wordt verstaan
      een woonschip dat uit hoofde van zijn feitelijke bestemming plaatsgebonden is;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '1'
  - number: 1.1.c
    text: 'lozen: het brengen van:'
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel1
  - number: 1.1.c.1°
    text: afvalwater of andere afvalstoffen, verontreinigende of schadelijke stoffen in een oppervlaktewaterlichaam;
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel1
  - number: 1.1.c.2°
    text: afvalwater of overige vloeistoffen op of in de bodem;
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel1
  - number: 1.1.c.3°
    text: afvalwater of andere afvalstoffen in een openbaar hemelwaterstelsel;
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel1
  - number: 1.1.c.4°
    text: afvalwater of andere afvalstoffen in een openbaar ontwateringsstelsel;
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel1
  - number: 1.1.c.5°
    text: afvalwater of andere afvalstoffen in een openbaar vuilwaterriool;
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel1
  - number: 1.1.c.6°
    text: afvalwater of andere afvalstoffen in een andere voorziening voor de inzameling en het transport van afvalwater, of
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel1
  - number: 1.1.c.7°
    text: |-
      afvalwater of andere afvalstoffen met behulp van een werk niet zijnde een voorziening voor de inzameling en het
      transport van afvalwater op een zuiveringtechnisch werk;
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel1
  - number: 1.1.d
    text: |-
      maatwerkvoorschrift: voorschrift als bedoeld in de [artikelen 17, tweede lid][ref1], en
      [65 van de Wet bodembescherming][ref2] en [6.6, tweede lid, van de Waterwet][ref3], inhoudende:


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0003994#Artikel65
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0003994
        artikel: '65'
      - id: ref3
        bwb_id: BWBR0025458
        artikel: '6'
  - number: 1.1.d.1°
    text: een beschikking waarbij het bevoegd gezag aanvullende eisen stelt; dan wel
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel1
  - number: 1.1.d.2°
    text: |-
      een ontheffing waarbij het bevoegd gezag de daarbij aangewezen bepalingen niet van toepassing verklaart al dan niet
      onder het stellen van beperkingen of voorwaarden;
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel1
  - number: 1.1.e
    text: 'Onze Minister: Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;'
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel1
  - number: 1.1.f
    text: |-
      voorziening voor het beheer van afvalwater: openbaar vuilwaterriool, openbaar hemelwaterstelsel, openbaar
      ontwateringsstelsel, andere voorziening voor de inzameling en het transport van afvalwater, zuiveringtechnisch werk
      of zuiveringsvoorziening;
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel1
  - number: 1.1.g
    text: 'vuilwaterriool:'
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel1
  - number: 1.1.g.1°
    text: openbaar vuilwaterriool;
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel1
  - number: 1.1.g.2°
    text: |-
      andere voorziening voor de inzameling en het transport van stedelijk afvalwater, aangesloten op een
      zuiveringsvoorziening, die blijkens een vergunning als bedoeld in [artikel 6.2, tweede lid, van de Waterwet][ref1]
      mede voor het zuiveren van stedelijk afvalwater is bedoeld, of aangesloten op een zuiveringtechnisch werk; of


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
  - number: 1.1.g.3°
    text: |-
      werk, niet zijnde een voorziening voor de inzameling en het transport van afvalwater, aangesloten op een
      zuiveringtechnisch werk;
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel1
  - number: 1.1.h
    text: |-
      woonruimte: ruimte die blijkens haar inrichting bestemd is om als een afzonderlijk geheel te voorzien in
      woongelegenheid en waarvan de delen blijkens de inrichting van die ruimte niet bestemd zijn om afzonderlijk in
      gebruik te worden gegeven;
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel1
  - number: 1.1.i
    text: 'zuiveringsvoorziening: werk voor het zuiveren van afvalwater, dat geen zuiveringtechnisch werk is.'
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel1
  - number: '1.2'
    text: 'In dit besluit en de daarop berustende bepalingen wordt onder een particulier huishouden mede verstaan:'
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel1
  - number: 1.2.a
    text: een woonschip dat uit hoofde van zijn feitelijke bestemming plaatsgebonden is, en
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel1
  - number: 1.2.b
    text: |-
      een voor recreatiedoeleinden bestemde woonruimte die geen onderdeel uitmaakt van een inrichting als bedoeld in
      [artikel 1.1, vierde lid, van de Wet milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
  - number: 1a
    text: |-
      Dit besluit berust mede op de [artikelen 6.2, eerst lid, onderdeel b, en tweede lid, onderdeel b][ref1],
      [6.6][ref2] en [6.7 van de Waterwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0025458
        artikel: '6'
  - number: '2.1'
    text: |-
      Vrijstelling van het verbod, bedoeld in [artikel 10.2, eerste lid, van de Wet milieubeheer][ref1], wordt verleend
      voor het lozen vanuit een particulier huishouden op of in de bodem.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
  - number: '2.2'
    text: |-
      De verboden, bedoeld in [artikel 6.2 van de Waterwet][ref1], gelden niet voor het lozen vanuit een particulier
      huishouden in een oppervlaktewaterlichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
  - number: '2.3'
    text: |-
      Degene die loost vanuit een particulier huishouden, voldoet aan de regels die bij of krachtens dit besluit zijn
      gesteld.
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel2
  - number: '2.4'
    text: 'Dit besluit is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel2
  - number: 2.4.a
    text: het lozen vanuit een inrichting;
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel2
  - number: 2.4.b
    text: 'het in een oppervlaktewaterlichaam:'
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel2
  - number: 2.4.b.1°
    text: in een werk aanbrengen of houden van bouwstoffen;
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel2
  - number: 2.4.b.2°
    text: |-
      aanbrengen, verspreiden of tijdelijk opslaan van grond of baggerspecie alsmede het houden van die aangebrachte of
      tijdelijk opgeslagen grond of baggerspecie;
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel2
  - number: 2.4.c
    text: |-
      het lozen in een oppervlaktewaterlichaam ten gevolge van reinigingswerkzaamheden, conserveringswerkzaamheden
      of andere onderhoudswerkzaamheden aan vaste objecten en sloop-, renovatie- of nieuwbouwwerkzaamheden aan vaste
      objecten als bedoeld in de [artikelen 3.10][ref1] en [3.11 van het Besluit lozen buiten inrichtingen][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0029789#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0029789#Artikel3
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0029789
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0029789
        artikel: '3'
  - number: 2.4.d
    text: |-
      het lozen vanuit een proefbronnering in het kader van een saneringsonderzoek in de zin van de
      [Wet bodembescherming][ref1] en het lozen vanuit een bodemsanering in de zin van de Wet bodembescherming;


      [ref1]: https://wetten.overheid.nl/BWBR0003994
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003994
  - number: 2.4.e
    text: |-
      het lozen buiten een inrichting ten gevolge van een gesloten bodemenergiesysteem als bedoeld in het
      [Activiteitenbesluit milieubeheer][ref1] en het [Besluit lozen buiten inrichtingen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022762
      [ref2]: https://wetten.overheid.nl/BWBR0029789
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0022762
      - id: ref2
        bwb_id: BWBR0029789
  - number: '3.1'
    text: |-
      Lozen op of in de bodem vanuit een particulier huishouden is verboden, indien daarbij stoffen zonder doorsijpeling
      door bodem of ondergrond in het grondwater geraken.
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel3
  - number: '3.2'
    text: |-
      Het bevoegd gezag kan bij maatwerkvoorschrift bepalen dat het eerste lid niet van toepassing is en dat lozen
      in de bodem is toegestaan, indien het belang van de bescherming van het milieu zich gelet op de samenstelling,
      hoeveelheid en eigenschappen van het lozen daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel3
  - number: '3.3'
    text: 'Bij maatwerkvoorschrift als bedoeld in het tweede lid kunnen voorwaarden worden gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel3
  - number: 3.3.a
    text: de samenstelling, eigenschappen of hoeveelheid van het te lozen afvalwater;
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel3
  - number: 3.3.b
    text: de voorafgaand aan het lozen van het afvalwater te treffen maatregelen, en
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel3
  - number: 3.3.c
    text: de plaats van het lozingspunt.
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel3
  - number: '3.4'
    text: |-
      Het eerste lid is niet van toepassing op lozen in de bodem waaraan in een vergunning op grond van
      [artikel 6.4][ref1] of [artikel 6.5, onderdeel b, van de Waterwet][ref2], dan wel een vergunning op grond van een
      verordening van het waterschap voorschriften zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '6'
  - number: '4.1'
    text: |-
      Degene die loost en weet of redelijkerwijs had kunnen weten dat door het lozen nadelige gevolgen voor het milieu
      ontstaan of kunnen ontstaan, die niet of onvoldoende worden voorkomen of beperkt door naleving van de bij of
      krachtens dit besluit gestelde voorschriften, voorkomt die gevolgen of beperkt die voor zover voorkomen niet
      mogelijk is en voor zover dit redelijkerwijs van hem kan worden gevergd.
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel4
  - number: '4.2'
    text: |-
      Onder het voorkomen of beperken van het ontstaan van nadelige gevolgen voor het milieu, bedoeld in het eerste lid,
      wordt verstaan:
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel4
  - number: 4.2.a
    text: het voorkomen dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van bodemverontreiniging;
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel4
  - number: 4.2.b
    text: |-
      het voorkomen dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van verontreiniging van het
      grondwater;
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel4
  - number: 4.2.c
    text: |-
      het voorkomen dan wel voor zover dat niet mogelijk is het zoveel mogelijk beperken van de verontreiniging van een
      oppervlaktewaterlichaam;
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel4
  - number: 4.2.d
    text: de bescherming van de doelmatige werking van de voorzieningen voor het beheer van afvalwater;
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel4
  - number: 4.2.e
    text: het doelmatig beheer van afvalwater.
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel4
  - number: '4.3'
    text: |-
      Het bevoegd gezag kan met betrekking tot de verplichting, bedoeld in het eerste lid, maatwerkvoorschriften
      stellen voor zover het betreffende aspect bij of krachtens dit besluit niet uitputtend is geregeld. Deze
      maatwerkvoorschriften kunnen mede inhouden een verplichting de activiteiten die met het lozen samenhangen te
      beschrijven, alsmede metingen, berekeningen of tellingen te verrichten ter bepaling van de mate waarin het lozen
      nadelige gevolgen voor het milieu veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel4
  - number: '5'
    text: |-
      Indien bij of krachtens dit besluit is bepaald dat een daarbij aangegeven maatregel ter bescherming van het milieu
      moet worden toegepast, kan een andere maatregel worden toegepast, indien het bevoegd gezag heeft beslist dat met
      die maatregel ten minste een gelijkwaardig niveau van bescherming van het milieu wordt bereikt.
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel5
  - number: '6'
    text: |-
      Huishoudelijk afvalwater, afkomstig van het bereiden van voedingsmiddelen en daarmee samenhangende activiteiten,
      dat afvalstoffen bevat, die door versnijdende of vermalende apparatuur zijn versneden of vermalen, wordt niet
      geloosd.
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel6
  - number: '7.1'
    text: |-
      Huishoudelijk afvalwater wordt niet op of in de bodem geloosd, indien de afstand tot het dichtstbijzijnde
      vuilwaterriool of een zuiveringtechnisch werk waarop aansluiting kan plaatsvinden, 40 meter of minder bedraagt.
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel7
  - number: '7.2'
    text: 'Voor de toepassing van het eerste lid wordt de afstand berekend:'
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel7
  - number: 7.2.a
    text: vanaf de kadastrale grens van het perceel waar het huishoudelijk afvalwater vrijkomt; en
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel7
  - number: 7.2.b
    text: langs de kortste lijn waarlangs de afvoerleidingen zonder overwegende bezwaren kunnen worden aangelegd.
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel7
  - number: '7.3'
    text: |-
      In afwijking van het eerste lid kan het bevoegd gezag, indien het belang van de bescherming van de bodem
      zich daartegen niet verzet, op een daartoe strekkende aanvraag bij maatwerkvoorschrift het lozen op of in de
      bodem toestaan voor een door hem vast te stellen termijn, gebaseerd op het nog niet verstreken deel van een
      afschrijvingstermijn van de voor de aanleg van het vuilwaterriool of het zuiveringtechnisch werk reeds bestaande
      zuiveringsvoorziening.
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel7
  - number: '8.1'
    text: Voorafgaand aan het lozen op of in de bodem wordt huishoudelijk afvalwater door een zuiveringsvoorziening geleid.
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel8
  - number: '8.2'
    text: |-
      Bij regeling van Onze Minister worden regels gesteld met betrekking tot de zuiveringsvoorziening, bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel8
  - number: '9.1'
    text: Lozen op of in de bodem vindt plaats door middel van een infiltratievoorziening.
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel9
  - number: '9.2'
    text: |-
      Bij regeling van Onze Minister worden regels gesteld met betrekking tot de infiltratievoorziening, bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel9
  - number: '10.1'
    text: |-
      Huishoudelijk afvalwater wordt niet in een oppervlaktewaterlichaam geloosd, indien de afstand tot het
      dichtstbijzijnde vuilwaterriool of een zuiveringtechnisch werk waarop aansluiting kan plaatsvinden, 40 meter of
      minder bedraagt.
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel10
  - number: '10.2'
    text: 'Voor de toepassing van het eerste lid wordt de afstand berekend:'
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel10
  - number: 10.2.a
    text: vanaf de kadastrale grens van het perceel waar het huishoudelijk afvalwater vrijkomt; en
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel10
  - number: 10.2.b
    text: langs de kortste lijn waarlangs de afvoerleidingen zonder overwegende bezwaren kunnen worden aangelegd.
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel10
  - number: '10.3'
    text: |-
      In afwijking van het eerste lid kan het bevoegd gezag, indien het belang van de bescherming van een
      oppervlaktewaterlichaam zich daartegen niet verzet, op een daartoe strekkende aanvraag bij maatwerkvoorschrift het
      lozen in een oppervlaktewaterlichaam toestaan voor een door hem vast te stellen termijn, gebaseerd op het nog niet
      verstreken deel van een afschrijvingstermijn van de voor de aanleg van het vuilwaterriool of het zuiveringtechnisch
      werk reeds bestaande zuiveringsvoorziening.
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel10
  - number: '11.1'
    text: |-
      Voorafgaand aan het lozen in een oppervlaktewaterlichaam wordt huishoudelijk afvalwater door een
      zuiveringsvoorziening geleid.
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel11
  - number: '11.2'
    text: |-
      Bij regeling van Onze Minister van Verkeer en Waterstaat worden regels gesteld met betrekking tot de
      zuiveringsvoorziening, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel11
  - number: '11.3'
    text: |-
      Het bevoegd gezag kan, bij lozen in een niet aangewezen oppervlaktewaterlichaam als bedoeld in
      [artikel 1.1 van het Activiteitenbesluit milieubeheer][ref1], indien het belang van de bescherming van het milieu
      daartoe noodzaakt in afwijking van de regels bedoeld in het tweede lid bij maatwerkvoorschrift bepalen dat het
      huishoudelijk afvalwater door een aangegeven zuiveringsvoorziening dient te worden geleid.


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel1
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0022762
        artikel: '1'
  - number: '11.4'
    text: |-
      In afwijking van de regels, bedoeld in het tweede lid, kan het bevoegd gezag, indien het belang van de bescherming
      van een oppervlaktewaterlichaam zich daartegen niet verzet, op een daartoe strekkende aanvraag voor een door hem
      vast te stellen termijn bij maatwerkvoorschrift het lozen toestaan:
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel11
  - number: 11.4.a
    text: door middel van een minder vergaande zuiveringsvoorziening; of
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel11
  - number: 11.4.b
    text: zonder een zuiveringsvoorziening.
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel11
  - number: '11.5'
    text: |-
      Een toestemming als bedoeld in het vierde lid, onderdeel b, blijft achterwege, indien niet binnen een afzienbare
      periode alsnog op het vuilwaterriool of een zuiveringtechnisch werk wordt aangesloten.
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel11
  - number: '12'
    text: |-
      Afvalwater afkomstig uit een zwembad waaraan desinfectiemiddelen of andere chemicaliën zijn toegevoegd wordt,
      indien dit mogelijk is, in een openbaar vuilwaterriool geloosd.
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel12
  - number: '13.1'
    text: |-
      Degene die voornemens is huishoudelijk afvalwater vanuit een particulier huishouden op of in de bodem of in een
      oppervlaktewaterlichaam te lozen, meldt dat voornemen ten minste zes weken voorafgaand aan het plaatsen van een
      zuiveringsvoorziening aan het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel13
  - number: '13.2'
    text: 'Een melding als bedoeld in het eerste lid wordt schriftelijk gedaan en omvat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel13
  - number: 13.2.a
    text: de naam en het adres van degene die voornemens is huishoudelijk afvalwater te lozen;
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel13
  - number: 13.2.b
    text: het adres van het gebouw waaruit het lozen zal gaan plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel13
  - number: 13.2.c
    text: |-
      gegevens waaruit kan worden afgeleid hoeveel meter de afstand tot het dichtstbijzijnde vuilwaterriool of het
      zuiveringtechnisch werk bedraagt, en
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel13
  - number: 13.2.d
    text: |-
      gegevens met betrekking tot de zuiveringsvoorziening waardoor het huishoudelijk afvalwater voorafgaand aan het
      lozen wordt geleid.
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel13
  - number: '19.1'
    text: |-
      Een ontheffing als bedoeld in [artikel 5, derde lid, van het Lozingenbesluit bodembescherming][ref1] ten aanzien
      van het lozen vanuit een particulier huishouden, wordt gelijkgesteld met een maatwerkvoorschrift als bedoeld in
      [artikel 7, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0022910#Artikel7
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0009092
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0022910
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '19.2'
    text: |-
      Een nadere eis als bedoeld in [artikel 6, tweede lid, van het Lozingenbesluit Wvo huishoudelijk afvalwater][ref1]
      ten aanzien van het lozen vanuit een particulier huishouden, wordt aangemerkt als een maatwerkvoorschrift als
      bedoeld in [artikel 11, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008512#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0022910#Artikel11
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0008512
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0022910
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '19.3'
    text: |-
      Indien op het tijdstip van de inwerkingtreding van dit besluit het lozen van
      huishoudelijk afvalwater in het oppervlaktewater was toegestaan op grond van
      [artikel 14 van het Lozingenbesluit Wvo huishoudelijk afvalwater][ref1], blijft die toestemming gelden gedurende de
      termijn die volgt uit de toepassing van [dat artikel][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008512#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0008512#Artikel14
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0008512
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0008512
        artikel: '14'
  - number: '20'
    text: |-
      Voor het lozen vanuit een particulier huishouden waarvoor onmiddellijk voorafgaand
      aan het tijdstip van inwerkingtreding van dit besluit een vergunning op grond van
      [artikel 1 van de Wet verontreiniging oppervlaktewateren][ref1] in werking en onherroepelijk was, worden
      de voorschriften van die vergunning aangemerkt als maatwerkvoorschriften op grond van dit besluit, mits de
      voorschriften vallen binnen de bevoegdheid van het bevoegd gezag tot het stellen van maatwerkvoorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel1
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '1'
  - number: '21.1'
    text: |-
      In afwijking van [artikel 7, tweede lid, onderdeel a][ref1], wordt bij lozen van huishoudelijk afvalwater op of in
      de bodem dat voor 1 juli 1990 regelmatig plaatsvond de afstand berekend vanaf het gedeelte van het gebouw dat zich
      het dichtst bij een vuilwaterriool of een zuiveringtechnisch werk bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0022910#Artikel7
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0022910
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '21.2'
    text: |-
      In afwijking van [artikel 10, tweede lid, onderdeel a][ref1], wordt bij lozen van huishoudelijk afvalwater in het
      oppervlaktewater dat voor 1 maart 1997 plaatsvond de afstand berekend vanaf het gedeelte van het gebouw dat zich
      het dichtst bij een vuilwaterriool of een zuiveringtechnisch werk bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0022910#Artikel10
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0022910
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '22'
    text: |-
      Dit besluit treedt in werking met ingang van 1 januari 2008, met uitzondering van [artikel 16][ref1], dat met
      ingang van 1 januari 2009 in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0022910#Artikel16
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0022910
        artikel: '16'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '23'
    text: 'Dit besluit wordt aangehaald als: Besluit lozing afvalwater huishoudens.'
    url: https://wetten.overheid.nl/BWBR0022910/2015-07-01#Artikel23
