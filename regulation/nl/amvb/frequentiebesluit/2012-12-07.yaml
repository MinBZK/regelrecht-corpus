$id: frequentiebesluit
regulatory_layer: AMVB
publication_date: '2013-02-15'
valid_from: '2012-12-07'
bwb_id: BWBR0009997
url: https://wetten.overheid.nl/BWBR0009997/2012-12-07
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 20 mei 1998, nr. HDTP/98/1550/HW, Hoofddirectie
    Telecommunicatie en Post;

    Gelet op richtlijn nr. 97/13/EG van het Europees Parlement en de Raad van de Europese Unie van 10 april 1997
    betreffende een gemeenschappelijk kader voor algemene machtigingen en individuele vergunningen op het gebied van
    telecommunicatiediensten (PbEG L 117/15) en op de artikelen 3.1, 3.3, zevende lid, 3.4, tweede lid, en artikel 3.5,
    derde en vierde lid, van de Telecommunicatiewet;

    De Raad van State gehoord (advies van 19 augustus 1998 no. W09.98.0214);

    Gezien het nader rapport van de Staatssecretaris van Verkeer en Waterstaat van 3 november 1998, nr HDTP/98/3248/HW,
    Hoofddirectie Telecommunicatie en Post;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel1
  - number: 1.a
    text: |-
      wet: [Telecommunicatiewet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009950
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009950
  - number: 1.b
    text: |-
      vergunning: vergunning als bedoeld in [artikel 3.3, eerste lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
  - number: 1.c
    text: |-
      antenneregister: openbaar antenneregister als bedoeld in [artikel 3.14 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
  - number: '2.1'
    text: 'In het frequentieplan worden de frequentiebestemmingen onderverdeeld in de volgende hoofdcategorieën van gebruik:'
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel2
  - number: 2.1.a
    text: zakelijk gebruik;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel2
  - number: 2.1.b
    text: gebruik voor vitale overheidstaken;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel2
  - number: 2.1.c
    text: omroep, bestaande uit de categorieën publieke en commerciële omroep;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel2
  - number: 2.1.d
    text: overig gebruik.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel2
  - number: '2.2'
    text: |-
      In het frequentieplan wordt voor de hoofdcategorieën zakelijk gebruik en overig gebruik, alsmede voor de categorie
      commerciële omroep, per eenheid van frequentieruimte, met in achtneming van het bepaalde in het derde en vierde
      lid, vastgesteld of bij de verlening van een vergunning hetzij de procedure van op volgorde van binnenkomst hetzij
      de procedure van veiling of vergelijkende toets wordt toegepast.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel2
  - number: '2.3'
    text: |-
      De procedure van veiling of vergelijkende toets wordt alleen toegepast terzake van de verdeling van
      frequentieruimte voor de hoofdcategorie zakelijk gebruik en de categorie commerciële omroep. De hiervoor genoemde
      procedures worden niet toegepast indien het redelijkerwijs te verwachten is dat er met betrekking tot de vraag naar
      de frequentieruimte sprake zal zijn van een voldoende aanbod van de frequentieruimte.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel2
  - number: '2.4'
    text: |-
      In de gevallen waarin de veiling of de vergelijkende toets op grond van het derde lid niet wordt toegepast, alsmede
      bij de hoofdcategorie overig gebruik, geschiedt de verlening van de vergunningen op volgorde van binnenkomst van
      de aanvraag.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel2
  - number: 2a
    text: |-
      Ingeval van een procedure voor de verlening van vergunningen als bedoeld in
      [artikel 3.3, vierde lid, van de Telecommunicatiewet][ref1] kan bij ministeriële regeling frequentieruimte voor een
      categorie van aanvragers worden gereserveerd.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
  - number: '3.1'
    text: |-
      De procedure voor het verlenen van een vergunning die door middel van een veiling of een vergelijkende toets
      zal worden verleend, vangt aan op een door Onze Minister te bepalen tijdstip. Hiervan wordt in de Staatscourant
      mededeling gedaan alsmede van het besluit van Onze Minister welke van beide procedures zal worden toegepast.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel3
  - number: '3.2'
    text: |-
      Ten aanzien van het in het eerste lid bedoelde besluit tot vaststelling van de procedure door middel waarvan een
      vergunning voor het gebruik van frequentieruimte zal worden verleend, geldt dat de procedure van vergelijkende
      toets slechts wordt toegepast indien het algemeen maatschappelijk, cultureel of economisch belang dit vordert.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel3
  - number: '3.3'
    text: 'Uiterlijk zeven dagen nadat de mededeling, bedoeld in het eerste lid, is gedaan, maakt Onze Minister bekend:'
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel3
  - number: 3.3.a
    text: |-
      de regels, bedoeld in de [artikelen 4][ref1], [6, eerste lid][ref2] en [8, eerste lid][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0009997#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009997#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0009997#Artikel8
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009997
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009997
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0009997
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 3.3.b
    text: |-
      de regels, bedoeld in [artikel 3.3a, eerste lid, van de wet][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
  - number: 3.3.c
    text: |-
      voor zover dit redelijkerwijs mogelijk is, de vergunning zoals die zal worden verleend en de voorschriften en
      beperkingen die aan die vergunning zullen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel3
  - number: '3.4'
    text: Het tweede lid is niet van toepassing op frequentieruimte die is bestemd voor commerciële omroep.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel3
  - number: '3.5'
    text: |-
      De bekendmaking, bedoeld in het derde lid, onderdeel c, geschiedt hetzij in de Staatscourant, hetzij op een andere
      wijze die door Onze Minister is aangegeven in de mededeling, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel3
  - number: '4'
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de indiening van de aanvraag om een vergunning en omtrent
      de inhoud van de aanvragen en de daarbij te overleggen gegevens. Deze regels kunnen per te verlenen vergunning
      verschillen.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel4
  - number: '5.1'
    text: |-
      Onze Minister stelt eenieder in de gelegenheid om gedurende vier weken zijn zienswijze in te brengen over een
      ontwerp van de regels, bedoeld in [artikel 3, derde lid, onderdelen a en b][ref1], en een ontwerp van het besluit,
      bedoeld in [artikel 3, derde lid, onderdeel c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009997#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009997#Artikel3
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009997
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009997
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '5.2'
    text: |-
      Indien de ontwerpen niet worden geplaatst in de Staatscourant, deelt Onze Minister in de Staatscourant mede op
      welke wijze inzage in de ontwerpen kan worden verkregen.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel5
  - number: '6.1'
    text: |-
      Tot de veiling en de vergelijkende toets worden slechts toegelaten aanvragers die voldoen aan bij ministeriële
      regeling te stellen eisen. Deze eisen kunnen per te verlenen vergunning verschillen.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel6
  - number: '6.2'
    text: 'De in het eerste lid bedoelde eisen kunnen slechts betrekking hebben op de:'
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel6
  - number: 6.2.a
    text: rechtsvorm van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel6
  - number: 6.2.b
    text: financiële positie van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel6
  - number: 6.2.c
    text: kennis en ervaring van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel6
  - number: 6.2.d
    text: technische middelen waarover de aanvrager kan beschikken;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel6
  - number: 6.2.e
    text: hoedanigheid van de aanvrager als commerciële omroep;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel6
  - number: 6.2.f
    text: door de aanvrager te leveren bijdrage aan de overgang van analoge naar digitale techniek.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel6
  - number: '6.3'
    text: |-
      Indien een te verlenen vergunning betrekking heeft op het gebruik van frequentieruimte die is bestemd voor
      commerciële omroep, kunnen de in het eerste lid bedoelde eisen tevens betrekking hebben op het waarborgen van
      democratische, sociale, taalkundige en culturele belangen die een rol spelen bij het gebruik van frequentieruimte,
      waarbij rekening kan worden gehouden met pluralisme in de media.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel6
  - number: 6a.1
    text: |-
      Bij ministeriële regeling kan, in het belang van een evenwichtige verdeling dan wel een doelmatig gebruik van
      frequentieruimte, met betrekking tot categorieën van frequentieruimte de maximale hoeveelheid frequentieruimte
      worden vastgesteld die een aanvrager kan verwerven door middel van een procedure van veiling of vergelijkende
      toets. Daarbij kan rekening worden gehouden met verschillen binnen een of meer categorieën van frequentieruimte.
      Voor categorieën van frequentieruimte of voor procedures voor het verlenen van een vergunning kunnen verschillende
      regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel6a
  - number: 6a.2
    text: |-
      Indien een aanvrager op het tijdstip waarop een aanvraag uiterlijk dient te zijn ontvangen op grond van de
      ministeriële regeling, bedoeld in [artikel 4][ref1], reeds beschikt over een vergunning met betrekking tot
      een categorie van frequentieruimte waarvoor een maximum is vastgesteld dan wel beschikt over de maximale
      hoeveelheid frequentieruimte, brengt Onze Minister deze frequentieruimte in mindering op de maximale hoeveelheid
      frequentieruimte die de aanvrager voor die categorie van frequentieruimte kan verwerven onderscheidenlijk sluit
      Onze Minister de aanvrager volledig uit van deelname aan de veiling of de vergelijkende toets. Bij ministeriële
      regeling kunnen nadere regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009997#Artikel4
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0009997
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 6a.3
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld voor het geval dat een aanvrager na het tijdstip waarop een
      aanvraag uiterlijk dient te zijn ontvangen op grond van de ministeriële regeling, bedoeld in [artikel 4][ref1], een
      vergunning verwerft met betrekking tot een categorie van frequentieruimte waarvoor een maximum is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009997#Artikel4
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0009997
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 6a.4
    text: |-
      Indien een aanvrager deel uitmaakt van een groep waartoe een andere rechtspersoon of vennootschap behoort die een
      vergunning heeft of verwerft met betrekking tot frequentieruimte waarvoor een maximum is vastgesteld, wordt bij de
      toepassing van het bepaalde bij of krachtens het tweede en derde lid ook die vergunning in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel6a
  - number: '8.1'
    text: |-
      Bij ministeriële regeling worden in het kader van de behandeling van een aanvraag om een vergunning regels gesteld
      omtrent de toepassing en uitvoering van de veiling of de vergelijkende toets. Deze regels kunnen per te verlenen
      vergunning verschillen.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel8
  - number: '8.2'
    text: 'In het geval van een veiling hebben de in het eerste lid bedoelde regels in elk geval betrekking op:'
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel8
  - number: 8.2.a
    text: de wijze waarop een bod wordt uitgebracht;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel8
  - number: 8.2.b
    text: de eisen die aan een geldig bod worden gesteld;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel8
  - number: 8.2.c
    text: de zekerheidstelling dat een bod gestand wordt gedaan of kosten en schade kunnen worden verhaald;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel8
  - number: 8.2.d
    text: maatregelen ten behoeve van een ongestoord verloop van de veiling;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel8
  - number: 8.2.e
    text: |-
      de bij veiling toe te passen methode ter vaststelling van het bod waarvan de uitbrenger in aanmerking komt voor
      verlening van de vergunning;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel8
  - number: 8.2.f
    text: |-
      de eisen die gesteld worden met betrekking tot de wijze van betaling en het tijdstip waarop degene aan wie de
      vergunning wordt verleend deze betaling moet hebben verricht;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel8
  - number: 8.2.g
    text: |-
      de gevallen waarin, de termijn waarbinnen en de voorwaarden waaronder er opnieuw wordt geveild zonder dat er sprake
      is van een nieuwe veilingprocedure.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel8
  - number: '8.3'
    text: |-
      In het geval van een vergelijkende toets hebben de in het eerste lid bedoelde regels in elk geval betrekking op de
      criteria waarmee de kwaliteit van de aanvraag of de kwaliteit van de aanvrager wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel8
  - number: '8.4'
    text: |-
      In het geval van een vergelijkende toets met inbegrip van een financieel bod, kunnen de in het eerste lid bedoelde
      regels eveneens betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel8
  - number: 8.4.a
    text: de gevallen waarin een financieel bod wordt uitgebracht alsmede de wijze waarop dat bod wordt uitgebracht;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel8
  - number: 8.4.b
    text: de eisen die aan een geldig financieel bod worden gesteld;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel8
  - number: 8.4.c
    text: de zekerheidstelling dat een financieel bod gestand wordt gedaan of kosten en schade kunnen worden verhaald;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel8
  - number: 8.4.d
    text: |-
      de eisen die gesteld worden met betrekking tot de wijze van betaling van het financieel bod en het tijdstip waarop
      degene aan wie de vergunning wordt verleend deze betaling moet hebben verricht.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel8
  - number: '8.5'
    text: |-
      In het geval van een vergelijkende toets houdt Onze Minister bij het opstellen van de criteria rekening met de
      doelstellingen, bedoeld in [artikel 1.3, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel1
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '1'
  - number: '9.1'
    text: |-
      Onze Minister kan een vergunning die is verleend door middel van een veiling of een vergelijkende toets niet
      verlengen, tenzij het algemeen maatschappelijk, cultureel of economisch belang verlenging naar het oordeel van Onze
      Minister vordert of verlenging naar het oordeel van Onze Minister van belang is voor de bevordering van de overgang
      van analoge naar digitale techniek, mits de aanvraag om verlenginguiterlijk een jaar, doch niet eerder dan twee
      jaar voor het tijdstip waarop de periode waarvoor de vergunning is verleend, is verstreken, is ontvangen door Onze
      Minister. Bij regeling van Onze Minister kan voor nader bepaalde vergunningen een afwijkende periode worden bepaald
      waarbinnen het verzoek tot verlenging moet worden ontvangen.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel9
  - number: '9.2'
    text: |-
      Indien de vergunning betrekking heeft op frequentieruimte bestemd voor de categorie commerciële omroep besluit
      Onze Minister over een verzoek tot verlenging als bedoeld in het eerste lid, niet dan in overeenstemming met Onze
      Minister van Onderwijs, Cultuur en Wetenschap.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel9
  - number: '9.3'
    text: |-
      In het geval een vergunning wordt verlengd kunnen de aan de vergunning verbonden voorschriften en beperkingen
      worden gewijzigd en kunnen nieuwe voorschriften en beperkingen aan de vergunning worden toegevoegd.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel9
  - number: '9.4'
    text: |-
      Bij ministeriële regeling kunnen inzake de verlenging van vergunningen nadere regels worden gesteld. Deze regels
      kunnen per te verlenen vergunning verschillen.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel9
  - number: '10.1'
    text: |-
      In het geval de te verlenen vergunning betrekking heeft op frequentieruimte bestemd voor de categorie commerciële
      omroep en de verlening van de vergunning plaatsvindt door middel van een vergelijkende toets worden de in deze
      paragraaf aan Onze Minister opgedragen taken en toegekende bevoegdheden uitgeoefend, voorzover het niet betreft
      de vaststelling van de frequentieruimte waarvoor de vergunning wordt verleend, door Onze Minister van Onderwijs,
      Cultuur en Wetenschap in overeenstemming met Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel10
  - number: '10.2'
    text: |-
      Onze Minister verleent een vergunning voor het gebruik van frequentieruimte bestemd voor de categorie commerciële
      omroep op voordracht van Onze Minister van Onderwijs, Cultuur en Wetenschap, indien die voordracht tot stand is
      gekomen na uitvoering van de vergelijkende toets.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel10
  - number: '11.1'
    text: |-
      Bij ministeriële regeling kunnen eisen worden gesteld waaraan de aanvrager moet voldoen om in aanmerking te komen
      voor een vergunning. Deze eisen kunnen slechts inhouden dat:
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel11
  - number: 11.1.a
    text: de aanvrager een bepaalde leeftijd heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel11
  - number: 11.1.b
    text: |-
      de aanvrager met goed gevolg een voor het gebruik van de gevraagde frequentieruimte, in samenhang met het doel
      waarvoor die frequentieruimte wordt gebruikt, vereist examen heeft afgelegd;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel11
  - number: 11.1.c
    text: de aanvrager in het bezit is van een certificaat van bediening;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel11
  - number: 11.1.d
    text: de aanvrager een redelijk belang heeft bij het voorgenoemen gebruik van de gevraagde frequentieruimte.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel11
  - number: '11.2'
    text: |-
      Ten aanzien van het verkrijgen van een certificaat van bediening en het examen genoemd in het eerste lid kunnen bij
      ministeriële regeling regels worden gesteld die betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel11
  - number: 11.2.a
    text: het afleggen en het afnemen van het examen;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel11
  - number: 11.2.b
    text: de eisen van het examen;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel11
  - number: 11.2.c
    text: de ontheffing van het examen;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel11
  - number: 11.2.d
    text: de wijze waarop de vergoeding voor een examen dan wel een ontheffing moet worden voldaan;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel11
  - number: 11.2.e
    text: het verkrijgen van een certificaat van bediening.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel11
  - number: '11.3'
    text: |-
      Voor zover de aard, de omvang of het maatschappelijk belang van de vergunning daartoe naar het oordeel van Onze
      Minister aanleiding geeft, kunnen naast de eisen genoemd in het eerste lid bij ministeriële regeling tevens de
      eisen worden gesteld bedoeld in [artikel 6, tweede en derde lid][ref1], en kunnen voorts regels worden gesteld in
      het belang van een evenwichtige verdeling dan wel een doelmatig gebruik van frequentieruimte.


      [ref1]: https://wetten.overheid.nl/BWBR0009997#Artikel6
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009997
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '12'
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de indiening van de aanvraag om een vergunning en omtrent
      de inhoud van de aanvragen en de daarbij te overleggen gegevens. Deze regeling kan per te verlenen vergunning
      verschillen.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel12
  - number: '13.1'
    text: |-
      Een vergunning wordt op aanvraag verlengd, tenzij een doelmatige ordening van het frequentiespectrum zich daartegen
      verzet.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel13
  - number: '13.2'
    text: |-
      Bij verlenging van een vergunning kunnen de aan de vergunning verbonden voorschriften of beperkingen worden
      gewijzigd en kunnen nieuwe voorschriften of beperkingen aan de vergunning worden toegevoegd.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel13
  - number: '13.3'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op een vergunning die op grond van de
      [artikelen 3.7a][ref1] of [3.8 van de wet][ref2] is verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0009950
        artikel: '3'
  - number: '13.4'
    text: |-
      Bij ministeriële regeling kunnen inzake de verlenging van vergunningen nadere regels worden gesteld. Deze regels
      kunnen per te verlenen vergunning verschillen.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel13
  - number: '14'
    text: |-
      Op aanvragen om een vergunning voor het gebruik van frequentieruimte ten behoeve van de uitvoering van
      vitale overheidstaken, van het verzorgen van taken ter uitvoering van de publieke mediaopdracht, bedoeld
      in [artikel 2.1 van de Mediawet 2008][ref1], of ter uitvoering van een wettelijk voorschrift, zijn de
      [artikelen 12][ref2] en [13][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009997#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0009997#Artikel13
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0009997
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0009997
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '15.1'
    text: |-
      In het geval de verlening van een vergunning betrekking heeft op frequentieruimte die is bestemd voor het aanbieden
      van openbare elektronische communicatienetwerken of openbare elektronische communicatiediensten beslist Onze
      Minister op een aanvraag om verlening van de vergunning binnen 6 weken na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel15
  - number: '15.2'
    text: |-
      Indien de duur van de procedure van veiling of vergelijkende toets tot gevolg heeft dat niet binnen de in het
      eerste lid bedoelde termijn kan worden beslist, stelt Onze Minister de aanvrager daarvan in kennis en geeft daarbij
      een termijn waarbinnen zal worden beslist, welke termijn niet langer is dan 32 weken na afloop van de in het eerste
      lid genoemde termijn.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel15
  - number: '15.3'
    text: |-
      Van de termijnen, genoemd in het eerste en tweede lid, kan worden afgeweken indien op grond van het Internationale
      Telecommunicatieverdrag internationale frequentie- en satellietcoördinatie daartoe nopen.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel15
  - number: 15a.1
    text: 'Onze Minister publiceert in de Staatscourant een besluit als bedoeld in:'
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel15a
  - number: 15a.1.a
    text: |-
      [artikel 3.7a, eerste lid, van de wet][ref1] houdende dat de houder van een vergunning wordt verplicht om die
      vergunning geheel of gedeeltelijk over te dragen,


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
  - number: 15a.1.b
    text: |-
      [artikel 3.7a, tweede lid, van de wet][ref1] houdende dat Onze Minister de procedure tot overdracht ter hand neemt.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
  - number: 15a.2
    text: |-
      Uiterlijk zeven dagen nadat het besluit, bedoeld in het eerste lid, onder a of b, is gepubliceerd, maakt Onze
      Minister bekend:
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel15a
  - number: 15a.2.a
    text: |-
      de termijn, bedoeld in [artikel 3.7a, eerste lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
  - number: 15a.2.b
    text: |-
      de periode, bedoeld in [artikel 3.7a, vijfde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
  - number: 15b
    text: 'Bij ministeriële regeling worden regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel15b
  - number: 15b.a
    text: de indiening van de aanvraag om toestemming of overdracht,
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel15b
  - number: 15b.b
    text: de eisen die ter verkrijging van toestemming of ter overdracht van de vergunning worden gesteld aan de aanvrager,
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel15b
  - number: 15b.c
    text: de inhoud van de aanvraag en de daarbij te overleggen gegevens.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel15b
  - number: 15c.1
    text: |-
      Tot een procedure ter verkrijging van toestemming en een procedure tot overdracht als bedoeld in
      [artikel 3.7a, eerste en tweede lid, van de wet][ref1] worden slechts toegelaten aanvragers die voldoen aan bij
      ministeriële regeling te stellen eisen. Deze eisen kunnen per vergunning verschillen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel15c
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
  - number: 15c.2
    text: 'De in het eerste lid bedoelde eisen kunnen slechts betrekking hebben op de:'
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel15c
  - number: 15c.2.a
    text: rechtsvorm van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel15c
  - number: 15c.2.b
    text: financiële positie van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel15c
  - number: 15c.2.c
    text: kennis en ervaring van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel15c
  - number: 15c.2.d
    text: technische middelen waarover de aanvrager kan beschikken;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel15c
  - number: 15c.2.e
    text: hoedanigheid van de aanvrager als commerciële omroep;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel15c
  - number: 15c.2.f
    text: door de aanvrager te leveren bijdrage aan de overgang van analoge naar digitale techniek.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel15c
  - number: 15c.3
    text: |-
      [Artikel 6, derde lid][ref1], is van overeenkomstige toepassing op de in het eerste lid bedoelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0009997#Artikel6
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel15c
    references:
      - id: ref1
        bwb_id: BWBR0009997
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 15c.4
    text: |-
      Voor zover de aard, de omvang of het maatschappelijk belang van de vergunning daartoe naar het oordeel van Onze
      Minister aanleiding geeft, kunnen naast de eisen genoemd in het tweede en derde lid bij ministeriële regeling
      tevens regels worden gesteld in het belang van een evenwichtige verdeling dan wel een doelmatig gebruik van
      frequentieruimte.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel15c
  - number: 15c.5
    text: 'Toestemming wordt in ieder geval geweigerd indien:'
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel15c
  - number: 15c.5.a
    text: de aanvrager de latende vergunninghouder is,
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel15c
  - number: 15c.5.b
    text: |-
      de aanvrager op de latende vergunninghouder of de latende vergunninghouder op de aanvrager zodanige zeggenschap of
      feitelijke invloed heeft dat deze in belangrijke mate het beleid van de aanvrager of de latende vergunninghouder
      kan bepalen of aanmerkelijke invloed heeft op de inhoud van dat beleid, of
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel15c
  - number: 15c.5.c
    text: |-
      een natuurlijke persoon of groep van natuurlijke personen direct of indirect een zodanige zeggenschap of feitelijke
      invloed heeft in zowel de aanvrager als de latende vergunninghouder dat deze in belangrijke mate het beleid van
      beiden kan bepalen of aanmerkelijke invloed heeft op de inhoud van het beleid van beiden.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel15c
  - number: 15d.1
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de wijze waarop de procedure ter verkrijging van
      toestemming en de procedure om te bepalen aan welke natuurlijke of rechtspersoon de vergunning wordt overgedragen
      plaatsvindt. Deze regeling kan per vergunning verschillen.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel15d
  - number: 15d.2
    text: 'De in het eerste lid bedoelde regels hebben in elk geval betrekking op:'
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel15d
  - number: 15d.2.a
    text: de door de aanvrager en de latende vergunninghouder in acht te nemen geheimhouding;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel15d
  - number: 15d.2.b
    text: de wijze waarop een prijs voor de vergunning wordt geboden;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel15d
  - number: 15d.2.c
    text: de wijze om te bepalen wie de hoogste prijs heeft geboden;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel15d
  - number: 15d.2.d
    text: de eisen die aan een geldig bod worden gesteld;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel15d
  - number: 15d.2.e
    text: |-
      de zekerheidstelling dat een bij of krachtens [artikel 3.3a, van de wet][ref1] opgelegde financiële verplichting
      gestand wordt gedaan;


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel15d
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
  - number: 15d.2.f
    text: de maatregelen ten behoeve van een ongestoord verloop van de in het eerste lid bedoelde procedure;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel15d
  - number: 15d.2.g
    text: |-
      de door de vergunninghouder toe te passen methode ter vaststelling van het bod waarvan de uitbrenger in aanmerking
      komt voor verlening van de vergunning;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel15d
  - number: 15d.2.h
    text: |-
      de eisen die worden gesteld met betrekking tot de wijze van betaling van de in onderdeel e bedoelde financiële
      verplichtingen, en het tijdstip waarop degene aan wie de vergunning wordt overgedragen deze betaling moet hebben
      verricht.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel15d
  - number: '16.1'
    text: 'De aan een vergunning te verbinden voorschriften en beperkingen kunnen slechts betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel16
  - number: 16.1.a
    text: het doelmatig gebruik van de toegewezen frequentieruimte;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel16
  - number: 16.1.b
    text: |-
      de aard van de radiozendapparaten en de daarbij behorende antenne-inrichtingen alsmede het vermogen waarmee mag
      worden uitgezonden;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel16
  - number: 16.1.c
    text: bescheiden die de vergunninghouder ter beschikking moet houden;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel16
  - number: 16.1.d
    text: |-
      verplichtingen die voortvloeien uit de toezeggingen die de vergunninghouder in het kader van een veiling of een
      vergelijkende toets heeft gedaan, ook indien slechts één aanvrager aan de bij of krachtens de wet gestelde eisen
      voldoet;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel16
  - number: 16.1.e
    text: |-
      het veroorzaken van belemmeringen in radiozend- of ontvangapparaten of in elektrische of elektronische inrichtingen
      door het gewenste signaal van een radiozendapparaat;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel16
  - number: 16.1.f
    text: |-
      het waarborgen van de in [artikel 6, derde lid][ref1], bedoelde belangen;


      [ref1]: https://wetten.overheid.nl/BWBR0009997#Artikel6
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009997
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 16.1.g
    text: |-
      de diensten die moeten worden aangeboden, het soort elektronisch communicatienetwerk dat moet worden aangeboden of
      de technologie die moet worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel16
  - number: 16.1.h
    text: |-
      de naleving van verdragen of besluiten van een volkenrechtelijke organisatie aangaande het gebruik van
      frequentieruimte;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel16
  - number: 16.1.i
    text: |-
      de identificatie van het zendapparaat door middel van een daartoe bij de vergunningverlening toe te kennen
      combinatie van letters of cijfers.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel16
  - number: '16.2'
    text: |-
      De in het eerste lid, onderdeel a, bedoelde voorschriften en beperkingen kunnen onder meer betrekking hebben op
      de termijn waarop en het geografisch gebied waarbinnen de in het eerste lid, onderdeel g, bedoelde diensten moeten
      worden aangeboden.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel16
  - number: '16.3'
    text: |-
      Indien samenwerking tussen vergunninghouders noodzakelijk is om gewijzigde of nieuw toegekende frequentieruimte in
      gebruik te kunnen nemen met behoud van continuïteit van dienstverlening, kunnen de in het eerste lid, onderdeel a,
      bedoelde voorschriften en beperkingen onder meer bestaan uit een verplichting voor deze vergunninghouders om binnen
      een bepaalde termijn een overeenkomst te sluiten over deze samenwerking.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel16
  - number: '16.4'
    text: |-
      Onze Minister kan op verzoek van een van de houders van een vergunning bedoeld in het derde lid of uit eigen
      beweging, voorschriften geven met betrekking tot de wijze waarop de overeenkomst tot stand moet komen. De
      vergunninghouders houden zich aan de door Onze Minister gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel16
  - number: '16.5'
    text: |-
      Indien op een of meer onderdelen van de overeenkomst bedoeld in het derde lid geen overeenstemming van alle bij dat
      onderdeel of die onderdelen betrokken vergunninghouders dreigt te worden bereikt, kan Onze Minister op verzoek of
      uit eigen beweging een dwingende aanwijzing geven. De vergunninghouders zijn bij het sluiten van de overeenkomst
      gebonden aan de aanwijzing.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel16
  - number: '17'
    text: |-
      Onze Minister kan een vergunning en de daaraan verbonden voorschriften en beperkingen gedurende de looptijd van de
      vergunning slechts wijzigen:
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel17
  - number: 17.a
    text: op verzoek van de vergunninghouder;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel17
  - number: 17.b
    text: indien de naleving van een internationale overeenkomst aangaande het gebruik van frequentieruimte dit vordert;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel17
  - number: 17.c
    text: |-
      in de gevallen bedoeld in [artikel 3.7, derde lid, van de wet][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
  - number: 17.d
    text: |-
      indien door het gebruik van de vergunning ontoelaatbare belemmeringen worden veroorzaakt in radiozend- of
      ontvangapparaten of in elektrische of elektronische inrichtingen.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel17
  - number: '18'
    text: |-
      Bij ministeriële regeling kunnen ter zake van het gebruik van frequentieruimte waarvoor geen vergunning is vereist,
      regels worden gesteld inzake:
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel18
  - number: 18.a
    text: de doelmatigheid van het gebruik;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel18
  - number: 18.b
    text: |-
      de aard van de radiozendapparaten en de daarbij behorende antenne-inrichtingen alsmede het vermogen waarmee mag
      worden uitgezonden;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel18
  - number: 18.c
    text: het door de gebruiker beschikbaar houden van bescheiden;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel18
  - number: 18.d
    text: |-
      het veroorzaken van belemmeringen in radiozend- of ontvangapparaten of in elektrische of elektronische inrichtingen
      door het gewenste signaal van een radiozendapparaat;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel18
  - number: 18.e
    text: |-
      de naleving van verdragen of besluiten van een volkenrechtelijke organisatie aangaande het gebruik van
      frequentieruimte.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel18
  - number: '19'
    text: |-
      De aanwijzing van categorieën radiozendapparaten, bedoeld in [artikel 3.4, eerste lid, onder a, van de wet][ref1],
      kan uitsluitend geschieden voor zover het radiozendapparaten betreft, die geen of vrijwel geen storing of
      belemmering veroorzaken in elektrische of elektronische apparaten, die geen radiozendapparaten zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
  - number: '20.1'
    text: |-
      Bij ministeriële regeling kunnen eisen worden gesteld waaraan een natuurlijke persoon moet voldoen voor het gebruik
      van de frequentieruimte, bedoeld in [artikel 3.4, eerste lid, aanhef en onder c, van de wet][ref1]. Deze eisen
      kunnen slechts inhouden dat:


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
  - number: 20.1.a
    text: de gebruiker een bepaalde leeftijd heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel20
  - number: 20.1.b
    text: |-
      de gebruiker met goed gevolg een voor het gebruik van de gevraagde frequentieruimte, in samenhang met het doel
      waarvoor die frequentieruimte wordt gebruikt, vereist examen heeft afgelegd, of
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel20
  - number: 20.1.c
    text: de gebruiker in het bezit is van een certificaat van bediening.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel20
  - number: '20.2'
    text: |-
      [Artikel 11, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009997#Artikel11
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0009997
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '20.3'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld voor het gebruik door rechtspersonen van frequentieruimte,
      bedoeld in [artikel 3.4, eerste lid, aanhef en onder c, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
  - number: '20.4'
    text: Voor de toepassing van dit artikel wordt een personenvennootschap gelijk gesteld met een rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel20
  - number: 20a.1
    text: |-
      Degene die voornemens is frequentieruimte als bedoeld in
      [artikel 3.4, eerste lid, aanhef en onder c, van de wet][ref1], te gebruiken, doet hiervan melding aan Onze
      Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
  - number: 20a.2
    text: |-
      Onze Minister registreert het in de melding bedoelde frequentiegebruik tenzij niet wordt voldaan aan bij
      ministeriële regeling te stellen regels.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel20a
  - number: 20a.3
    text: |-
      De frequentieruimte, bedoeld in [artikel 3.4, eerste lid, aanhef en onder c, van de wet][ref1], wordt slechts
      gebruikt indien het gebruik is geregistreerd overeenkomstig het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
  - number: 20a.4
    text: |-
      Met het oog op de identificatie van het radiozendapparaat kent Onze Minister in bij ministeriële regeling te
      bepalen gevallen aan degene die de melding heeft gedaan een combinatie van letters of cijfers toe.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel20a
  - number: 20a.5
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld ter zake van de melding, de registratie en de
      toekenning van de combinatie van letters of cijfers.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel20a
  - number: 20b.1
    text: 'In het antenneregister worden gegevens opgenomen van:'
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel20b
  - number: 20b.1.a)
    text: |-
      antennes die zijn geplaatst op een vaste locatie met het doel met een zendvermogen van meer dan 10 dB watt
      Effective Radiated Power (ERP) uit te gaan zenden;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel20b
  - number: 20b.1.b)
    text: |-
      antennes die zijn geplaatst op een vaste locatie en die tot een netwerk behoren, indien meer dan de helft van het
      aantal antennes van het netwerk een zendvermogen van meer dan 10 dB watt ERP heeft.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel20b
  - number: 20b.1.c)
    text: antennes van radiozendamateurs die zijn geregistreerd als gebruiker van frequentieruimte.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel20b
  - number: 20b.2
    text: |-
      Van het eerste lid zijn uitgezonderd de gegevens van antennes in gebruik bij overheidsorganen die een taak
      uitoefenen op het terrein van politie, justitie of veiligheid.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel20b
  - number: 20c.1
    text: |-
      In het antenneregister worden voor de antennes, bedoeld in [artikel 20b, eerste lid, onder a en b][ref1] de
      volgende gegevens opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0009997#Artikel20b
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel20c
    references:
      - id: ref1
        bwb_id: BWBR0009997
        artikel: 20b
        hoofdstuk: 4a
  - number: 20c.1.a)
    text: de toepassing van de antenne;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel20c
  - number: 20c.1.b)
    text: de hoogte gemeten vanaf het maaiveld tot het geometrische midden van de antenne;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel20c
  - number: 20c.1.c)
    text: de frequentie van de gebruikte toepassing;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel20c
  - number: 20c.1.d)
    text: de hoofdstraalrichting van de antenne;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel20c
  - number: 20c.1.e)
    text: het zendvermogen van de antenne in de hoofdstraalrichting aangeduid in dB watt ERP;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel20c
  - number: 20c.1.f)
    text: de datum van ingebruikname van de antenne en
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel20c
  - number: 20c.1.g)
    text: |-
      de locatie van de antenne-installatie, met een nauwkeurigheid van 15 meter, aangeduid met toepassing van het World
      Geodetic System 1984.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel20c
  - number: 20c.2
    text: |-
      De gegevens, bedoeld in het eerste lid, worden aan Onze Minister verstrekt door de diegene die de frequentie
      gebruikt of wil gebruiken.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel20c
  - number: 20d.1
    text: |-
      In het antenneregister worden voor de antennes, bedoeld in [artikel 20b, eerste lid, onder c][ref1], de volgende
      gegevens opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0009997#Artikel20b
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel20d
    references:
      - id: ref1
        bwb_id: BWBR0009997
        artikel: 20b
        hoofdstuk: 4a
  - number: 20d.1.a
    text: |-
      de locatie van de antenne-installatie, met een nauwkeurigheid van 15 meter, aangeduid met toepassing van het World
      Geodetic System 1984 en
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel20d
  - number: 20d.1.b
    text: het type registratie
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel20d
  - number: 20d.2
    text: |-
      De gegevens, bedoeld in het eerste lid, worden aan Onze Minister verstrekt door de radiozendamateur die zich voor
      het gebruik van frequentieruimte heeft geregistreerd.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel20d
  - number: 20d.3
    text: |-
      Onze Minister kan gegevens die door radiozendamateurs worden verstrekt in het kader van de registratie opnemen in
      het antenneregister.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel20d
  - number: 20e
    text: 'Bij ministeriële regeling kunnenregels worden gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel20e
  - number: 20e.a)
    text: de inrichting van het antenneregister,
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel20e
  - number: 20e.b)
    text: het tijdstip waarop de gegevens worden aangeleverd,
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel20e
  - number: 20e.c)
    text: de wijze waarop en de vorm waarin de gegevens aangeleverd worden en
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel20e
  - number: 20e.d)
    text: de wijze waarop van de gegevens kennis wordt genomen.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel20e
  - number: '21.1'
    text: |-
      In dit artikel wordt verstaan onder de inwerkingtredingsdatum: de datum waarop het Besluit van 8 maart 2005,
      houdende enkele technische wijzigingen van het Frequentiebesluit en het Besluit beveiliging gegevens aftappen
      telecommunicatie, alsmede een wijziging van het Besluit medegebruik omroepzendernetwerken teneinde het regime van
      medegebruik uit te breiden tot aanbieders van antenne-opstelpunten die bestemd zijn voor omroep in werking treedt.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel21
  - number: '21.2'
    text: |-
      Dit besluit, zoals dat luidde voor de inwerkingtredingsdatum, blijft, met uitzondering van [artikel 19][ref1], van
      toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0009997#Artikel19
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0009997
        artikel: '19'
        hoofdstuk: '4'
  - number: 21.2.a
    text: vergunningen die zijn verleend voor de inwerkingtredingsdatum;
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel21
  - number: 21.2.b
    text: veiling- of vergelijkende toetsprocedures die zijn aangevangen voor de inwerkingtredingsdatum, en
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel21
  - number: 21.2.c
    text: |-
      vergunningen die op of na de inwerkingtredingsdatum zijn verleend door middel van een veiling- of vergelijkende
      toetsprocedure die is aangevangen voor de inwerkingtredingsdatum.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel21
  - number: '21.3'
    text: |-
      [Artikel 17][ref1] is van toepassing op de in het eerste lid bedoelde vergunningen.


      [ref1]: https://wetten.overheid.nl/BWBR0009997#Artikel17
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0009997
        artikel: '17'
        hoofdstuk: '3'
  - number: '21.4'
    text: |-
      [Artikel 9][ref1] zoals dat luidde voor 25 februari 2011, blijft van toepassing op aanvragen om verlenging die zijn
      ingediend voor het tijdstip van inwerkingtreding van dat besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0009997#Artikel9
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0009997
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '23'
    text: |-
      Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende
      artikelen of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel23
  - number: '24'
    text: 'Dit besluit wordt aangehaald als: Frequentiebesluit.'
    url: https://wetten.overheid.nl/BWBR0009997/2012-12-07#Artikel24
