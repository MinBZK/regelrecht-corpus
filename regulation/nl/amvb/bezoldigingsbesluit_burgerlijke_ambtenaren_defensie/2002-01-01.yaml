preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Defensie van 1 februari 1993, nr. PAV2210/93002671;

    Gelet op de artikelen 125 en 134, eerste lid, van de Ambtenarenwet 1929;

    De Raad van State gehoord (advies van 29 maart 1993, nr. WO7.93.0069);

    Gezien het nader rapport van Onze Minister van Defensie van 16 juni 1993, nr. PAV2210/93008949;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Ambtenaar in de zin van dit besluit is degene die bij het Ministerie van Defensie in burgerlijke openbare dienst
      is aangesteld.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel1
  - number: '1.2'
    text: 'Dit besluit is niet van toepassing op de ambtenaar, wiens bezoldiging is geregeld:'
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel1
  - number: 1.2.a
    text: bij de wet;
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel1
  - number: 1.2.b
    text: bij een algemene maatregel van bestuur tot regeling van de bezoldiging van
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel1
  - number: 1.2.b.1
    text: de ambtenaren van de buitenlandse dienst;
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel1
  - number: 1.2.b.2
    text: leden van raden, besturen en commissies;
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel1
  - number: 1.2.c
    text: |-
      krachtens [artikel 20 van het Burgerlijk ambtenarenreglement defensie][ref1] of een daarmee overeenkomende bepaling
      van gelijke strekking;


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel20
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '20'
  - number: 1.2.d
    text: |-
      krachtens [artikel 21 van het Burgerlijk ambtenarenreglement defensie][ref1] of een daarmee overeenkomende bepaling
      van gelijke strekking.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel21
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '21'
  - number: '1.3'
    text: |-
      Dit besluit is niet van toepassing op de ambtenaar die is aangesteld in de functie van tandarts en die
      hoofdzakelijk is belast met de curatieve tandheelkundige zorg, met uitzondering van
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel1
  - number: 1.3.a
    text: |-
      artikel 3, voor zover betrekking hebbend op de toelage, bedoeld in [artikel 19][ref1] en het bedrag, bedoeld in
      [artikel 22, tweede lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0006038#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0006038#Artikel22
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006038
        artikel: '19'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0006038
        artikel: '22'
        hoofdstuk: '5'
  - number: 1.3.b
    text: de artikelen 9*a*, 11, 19, 21, 21*a*, 22, 23, 24 en 30*a*;
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel1
  - number: 1.3.c
    text: |-
      artikel 26, derde en vierde lid, voor zover betrekking hebbend op de eindejaarsuitkering, de vakantie-uitkering en
      de [artikelen 11][ref1], [19][ref2] en [24][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0006038#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0006038#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0006038#Artikel24
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006038
        artikel: '11'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0006038
        artikel: '19'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0006038
        artikel: '24'
        hoofdstuk: '6'
  - number: 1.3.d
    text: |-
      artikel 27, derde lid, voor zover betrekking hebbend op [artikel 21][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006038#Artikel21
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006038
        artikel: '21'
        hoofdstuk: '4'
  - number: '1.4'
    text: |-
      Bij algemene maatregel van bestuur kunnen andere dan in het tweede lid bedoelde ambtenaren of groepen van
      ambtenaren worden uitgezonderd van de toepassing van dit besluit.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel1
  - number: '2'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel2
  - number: 2.a
    text: |-
      salaris het bedrag, dat met inachtneming van de bepalingen van dit besluit voor de ambtenaar is vastgesteld aan de
      hand van [bijlage B][ref1] van dit besluit;


      [ref1]: https://wetten.overheid.nl/BWBR0006038
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006038
  - number: 2.b
    text: salaris per uur 1/165 deel van het salaris bij een volledige werktijd;
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel2
  - number: 2.c
    text: |-
      salarisschaal een als zodanig in de [bijlage B][ref1] van dit besluit vermelde reeks van genummerde salarissen;


      [ref1]: https://wetten.overheid.nl/BWBR0006038
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006038
  - number: 2.d
    text: |-
      salarisnummer een aanduiding, bestaande uit een getal of uit een letter en een getal, dat in een salarisschaal voor
      een salaris is vermeld;
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel2
  - number: 2.e
    text: |-
      maximumsalaris het hoogste bedrag van een salarisschaal, waarvan het salarisnummer uitsluitend uit een getal
      bestaat;
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel2
  - number: 2.f
    text: |-
      bezoldiging de som van het salaris en de toelagen waarop de ambtenaar ingevolge [Hoofdstuk 4][ref1] gewijzigd: van
      dit besluit aanspraak heeft;


      [ref1]: https://wetten.overheid.nl/BWBR0006038#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006038
        hoofdstuk: '4'
  - number: 2.g
    text: volledige werktijd een werktijd welke gemiddeld achtendertig werkuren per week omvat;
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel2
  - number: 2.h
    text: |-
      functie het samenstel van werkzaamheden door de ambtenaar te verrichten krachtens en overeenkomstig hetgeen hem
      door het daartoe bevoegde gezag is opgedragen;
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel2
  - number: 2.i
    text: Onze Minister Onze Minister van Defensie;
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel2
  - number: 2.j
    text: bevoegd gezag de bij koninklijk besluit of bij ministeriële regeling als zodanig aangewezen autoriteit.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel2
  - number: '3.1'
    text: Het salaris, de toelagen en de vergoedingen voor extra diensten worden maandelijks betaald.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel3
  - number: '3.2'
    text: |-
      Wanneer het salaris, een toelage als bedoeld in de [artikelen 12a][ref1], [13][ref2], [14][ref3], [17][ref4],
      [18][ref5], [19][ref6] en [20][ref7] of een bedrag, genoemd in [artikel 22, tweede lid][ref8], moet worden berekend
      over een gedeelte van een kalendermaand, wordt het bedrag per dag vastgesteld door een maandbedrag te delen door
      het aantal dagen van de desbetreffende kalendermaand.


      [ref1]: https://wetten.overheid.nl/BWBR0006038#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0006038#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0006038#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0006038#Artikel17
      [ref5]: https://wetten.overheid.nl/BWBR0006038#Artikel18
      [ref6]: https://wetten.overheid.nl/BWBR0006038#Artikel19
      [ref7]: https://wetten.overheid.nl/BWBR0006038#Artikel20
      [ref8]: https://wetten.overheid.nl/BWBR0006038#Artikel22
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006038
        artikel: 12a
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0006038
        artikel: '13'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0006038
        artikel: '14'
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0006038
        artikel: '17'
        hoofdstuk: '4'
      - id: ref5
        bwb_id: BWBR0006038
        artikel: '18'
        hoofdstuk: '4'
      - id: ref6
        bwb_id: BWBR0006038
        artikel: '19'
        hoofdstuk: '4'
      - id: ref7
        bwb_id: BWBR0006038
        artikel: '20'
        hoofdstuk: '4'
      - id: ref8
        bwb_id: BWBR0006038
        artikel: '22'
        hoofdstuk: '5'
  - number: '3.3'
    text: |-
      Van het bepaalde in het eerste en tweede lid kan worden afgeweken, ingeval daartoe naar het oordeel van het tot het
      vaststellen van het salaris bevoegde gezag op grond van bijzondere omstandigheden aanleiding bestaat.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel3
  - number: 3a
    text: |-
      Betalingen op grond van dit besluit of op grond van andere regelingen inzake beloningen van de ambtenaar,
      waarop vóór 1 januari 2001 aanspraak is ontstaan maar die in 2001 worden uitbetaald en waarover loonheffing is
      verschuldigd, worden verhoogd met 1,9%.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel3a
  - number: 3b
    text: |-
      Voor de berekening van het pensioen gevend inkomen worden aanspraken op grond van dit besluit of op grond van
      andere regelingen inzake beloningen van de ambtenaar, vermenigvuldigd met een factor 1/1,019 met inachtneming van
      een maximale vermindering van het pensioen gevend inkomen van f 145,26.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel3b
  - number: '5.1'
    text: Voor de ambtenaar geldt een salarisschaal.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel5
  - number: '5.2'
    text: |-
      De salarisschaal welke voor de ambtenaar geldt wordt, tenzij zijn wijze van functioneren zich nog daartegen
      verzet, bepaald met inachtneming van de zwaarte van zijn functie en van bijzondere regelingen, als bedoeld in
      [artikel 18 van het Burgerlijk ambtenarenreglement defensie][ref1] of in bepalingen van dezelfde strekking in een
      soortgelijke regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel18
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '18'
  - number: '5.3'
    text: |-
      De zwaarte van de functie wordt bepaald binnen de in de [bijlage B][ref1] van dit besluit aangegeven
      indelingsstructuur, met inachtneming van het door Onze Minister vastgestelde normeringsstelsel.


      [ref1]: https://wetten.overheid.nl/BWBR0006038
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006038
  - number: '5.4'
    text: |-
      Indien de ambtenaar bij wijze van waarneming tijdelijk een andere functie uitoefent, blijft de voordien voor hem
      geldende salarisschaal van toepassing.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel5
  - number: '5.5'
    text: |-
      Anders dan bij wijze van disciplinaire straf als bedoeld in het [Burgerlijk ambtenarenreglement defensie][ref1] of
      in een soortgelijke regeling kan zonder voorafgaand ontslag voor een ambtenaar geen salarisschaal gaan gelden met
      een lager maximumsalaris dan dat van de reeds voor hem geldende salarisschaal.


      [ref1]: https://wetten.overheid.nl/BWBR0006040
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006040
  - number: '5.6'
    text: 'Het vorige lid is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel5
  - number: 5.6.a
    text: |-
      bij de bepaling van de salarisschaal, bedoeld in het tweede lid, tevens is bepaald dat de functie van de ambtenaar
      een tijdelijk karakter heeft en de salarisschaal in verband daarmee slechts tijdelijk zal gelden;
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel5
  - number: 5.6.b
    text: |-
      de ambtenaar in verband met ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte wordt herplaatst in een
      andere functie.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel5
  - number: '6.1'
    text: |-
      De ambtenaar die bedenkingen heeft tegen de uitkomst van de bepaling van de zwaarte van zijn functie bedoeld in
      [artikel 5, derde lid][ref1], kan bij het voor de toepassing van [artikel 5, tweede lid][ref2], bevoegde gezag een
      aanvraag indienen om die waarderingsuitkomst opnieuw in overweging te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0006038#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006038#Artikel5
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006038
        artikel: '5'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0006038
        artikel: '5'
        hoofdstuk: '2'
  - number: '6.2'
    text: |-
      Indien de toepassing van het bepaalde in [artikel 5, tweede lid][ref1], berust bij Ons, worden Wij vertegenwoordigd
      door Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0006038#Artikel5
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006038
        artikel: '5'
        hoofdstuk: '2'
  - number: '6.3'
    text: Onze Minister stelt regels betreffende de behandeling van verzoeken als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel6
  - number: '6.4'
    text: |-
      Het in het eerste lid bepaalde is niet van toepassing indien voor de ambtenaar een bijzondere regeling geldt
      als bedoeld in [artikel 18 van het Burgerlijk ambtenarenreglement defensie][ref1] of in bepalingen van dezelfde
      strekking in een soortgelijke regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel18
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '18'
  - number: '7.1'
    text: |-
      Bij aanstelling wordt aan de in [artikel 5][ref1] bedoelde ambtenaar het salaris toegekend, dat:


      [ref1]: https://wetten.overheid.nl/BWBR0006038#Artikel5
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006038
        artikel: '5'
        hoofdstuk: '2'
  - number: 7.1.a
    text: wanneer hij 22 jaar of ouder is, in de voor hem geldende salarisschaal is vermeld achter het salarisnummer 0;
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel7
  - number: 7.1.b
    text: |-
      wanneer hij jonger dan 22 jaar is, in de voor hem geldende salarisschaal is vermeld achter het salarisnummer,
      bestaande uit [de letter J][ref1] en het getal, dat overeenkomt met zijn leeftijd. Indien het salarisnummer niet
      voorkomt, wordt de ambtenaar het laagste salaris in de schaal toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0006038#Artikel7
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006038
        artikel: '7'
        hoofdstuk: '2'
  - number: '7.2'
    text: |-
      Van het bepaalde in het eerste lid kan worden afgeweken door het toekennen van een hoger salaris, ingeval daartoe
      naar het oordeel van het bevoegde gezag aanleiding bestaat.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel7
  - number: 7a
    text: |-
      Voor de ambtenaar, voor wie op 31 maart 1998 reeds een salaris gold dat was vermeld in één der salarisschalen 1 en
      2 van de [bijlage B][ref1] achter het salarisnummer J18 tot en met 0, zoals deze luidden op bedoelde dag, geldt,
      in afwijking van [artikel 7, eerste lid][ref2], de hieronder vermelde salarisschaal zolang voor die ambtenaar het
      salarisnummer mede uit de[letter J][ref3] bestaat:








                  Schaal 1


                  Schaal 2






                  0


                  f 2 721,–


                  f 2 781,–




                  J21


                  f 2 449,–


                  f 2 503,–




                  J20


                  f 2 177,–


                  f 2 225,–




                  J19


                  f 1 905,–


                  f 1 947,–


      [ref1]: https://wetten.overheid.nl/BWBR0006038
      [ref2]: https://wetten.overheid.nl/BWBR0006038#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0006038#Artikel7a
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0006038
      - id: ref2
        bwb_id: BWBR0006038
        artikel: '7'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0006038
        artikel: 7a
        hoofdstuk: '2'
  - number: '8.1'
    text: |-
      Het salaris van de ambtenaar wordt verhoogd tot het in de schaal naasthogere bedrag, indien hij naar het oordeel
      van het bevoegde gezag zijn functie naar behoren vervult.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel8
  - number: '8.2'
    text: |-
      Het salaris van de ambtenaar kan worden verhoogd tot een in de schaal hoger vermeld bedrag, indien hij naar het
      oordeel van het bevoegde gezag zijn functie zeer goed of uitstekend verricht.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel8
  - number: '8.3'
    text: |-
      Vervult de ambtenaar zijn functie naar het oordeel van het bevoegde gezag niet naar behoren, dan blijft
      salarisverhoging achterwege.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel8
  - number: '8.4'
    text: 'De in het eerste en tweede lid bedoelde salarisverhoging wordt toegekend:'
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel8
  - number: 8.4.a
    text: |-
      wanneer de ambtenaar 22 jaar of ouder is en het maximumsalaris van de voor hem geldende salarisschaal nog niet
      heeft bereikt, voor de eerste maal met ingang van de eerste dag van de maand, waarin sinds zijn aanstelling een
      jaar is verstreken en nadien telkens na één jaar;
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel8
  - number: 8.4.b
    text: wanneer de ambtenaar jonger dan 22 jaar is, met ingang van de eerste dag van de maand, waarop zijn verjaardag valt.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel8
  - number: '8.5'
    text: |-
      Het tijdstip waarop ingevolge het vierde lid, onder *a*, een salarisverhoging wordt toegekend kan worden vervroegd
      indien daartoe naar het oordeel van het bevoegde gezag aanleiding bestaat.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel8
  - number: '8.6'
    text: |-
      Indien de in het vierde lid, onder *a*, bedoelde ambtenaar reeds voor zijn 22e verjaardag was aangesteld, wordt,
      onverlet het in het vijfde lid bepaalde, de salarisverhoging toegekend met ingang van de eerste dag van de maand
      waarin zijn verjaardag valt.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel8
  - number: '9.1'
    text: |-
      Het salaris van de ambtenaar met een onvolledige werktijd wordt vastgesteld op een evenredig deel van het salaris
      bij een volledige werktijd.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel9
  - number: '9.2'
    text: |-
      Het salaris van de ambtenaar die is aangesteld op grond van artikel 7, tweede lid, onder *f*., van
      het [Burgerlijk ambtenarenreglement defensie][ref1], wordt, met inachtneming van het bepaalde in
      [artikel 5, tweede lid][ref2], vastgesteld op een bedrag per uur dat daadwerkelijk dienst wordt verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0006040
      [ref2]: https://wetten.overheid.nl/BWBR0006038#Artikel5
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006040
      - id: ref2
        bwb_id: BWBR0006038
        artikel: '5'
        hoofdstuk: '2'
  - number: '9.3'
    text: |-
      Een teruggebrachte werktijd als bedoeld in [artikel 30c van het Burgerlijk ambtenarenreglement defensie][ref1] of
      een daarmee overeenkomende bepaling in een ander rechtspositiereglement is geen onvolledige werktijd in de zin van
      het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel30c
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 30c
  - number: 9a.1
    text: |-
      Het salaris van de ambtenaar bedoeld in [artikel 1, derde lid][ref1], wordt vastgesteld aan de hand van de soort en
      het aantal tandheelkundige verrichtingen op de in het tweede tot en met het zesde lid aangegeven wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0006038#Artikel1
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0006038
        artikel: '1'
        hoofdstuk: '1'
  - number: 9a.2
    text: |-
      Iedere tandheelkundige verrichting wordt gewaardeerd op een bij ministeriële regeling vast te stellen aantal
      punten.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel9a
  - number: 9a.3
    text: |-
      Het maandsalaris wordt bepaald op basis van een daginkomen dat bij ministeriële regeling wordt vastgesteld aan de
      hand van het door de tandarts behaalde gemiddelde aantal punten per dag.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel9a
  - number: 9a.4
    text: |-
      Bij ministeriële regeling kunnen voorwaarden worden gesteld aan het gemiddelde aantal punten per dag, dat ten
      minste door de tandarts behaald moet worden.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel9a
  - number: 9a.5
    text: |-
      Bij ministeriële regeling wordt het gemiddelde aantal punten per dag vastgesteld, dat ten hoogste in aanmerking kan
      worden genomen voor de vaststelling van het salaris.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel9a
  - number: 9a.6
    text: |-
      Bij ministeriële regeling wordt bepaald op welke wijze het salaris wordt vastgesteld over de tijd gedurende welke
      de tandarts door een oorzaak buiten zijn schuld verhinderd is zijn werkzaamheden te verrichten, dan wel vakantie of
      verlof geniet.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel9a
  - number: '10'
    text: |-
      In bijzondere gevallen kan een regeling worden getroffen, waarbij van de overige bepalingen van dit hoofdstuk kan
      worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel10
  - number: '11.1'
    text: |-
      Het bevoegd gezag kan aan de ambtenaar die zich bijzonder heeft onderscheiden door optreden of gedragingen dan
      wel door buitengewone toewijding of bijzondere loffelijke dienstverrichtingen, één of meer van de onderstaande
      beloningen toekennen:
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel11
  - number: 11.1.a
    text: geschenk;
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel11
  - number: 11.1.b
    text: geldelijke beloning;
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel11
  - number: 11.1.c
    text: functioneringsgratificatie.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel11
  - number: '11.2'
    text: |-
      De totale waarde van één of meer van de beloningen, bedoeld in het eerste lid, bedraagt maximaal 20% van het
      tot een jaarbedrag herleide salaris in de maand van de toekenning. Bij de berekening van de totale waarde van de
      beloningen wordt geen rekening gehouden met de verschuldigde loonheffing en inhoudingen, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel11
  - number: '11.3'
    text: |-
      De in voorkomend geval over één of meer van de beloningen verschuldigde loonheffing en inhoudingen, bedoeld in
      paragraaf 5 van de [Wet financiële voorzieningen privatisering ABP][ref1], komen voor rekening van Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0007211
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007211
  - number: '12.1'
    text: |-
      De ambtenaar heeft naar bij ministeriële regeling te stellen regels aanspraak op een gratificatie bij
      ambtsjubileum.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel12
  - number: '12.2'
    text: |-
      De ambtenaar heeft naar bij ministeriële regeling te stellen regels aanspraak op een proportionele
      diensttijdgratificatie, welke wordt afgeleid van de gratificatie, bedoeld in het eerste lid, indien hij wordt
      ontslagen met toepassing van één van de volgende artikelen uit het [Burgerlijk ambtenarenreglement defensie][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0006040
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006040
  - number: 12.2.a
    text: artikel 114;
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel12
  - number: 12.2.b
    text: artikel 116;
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel12
  - number: 12.2.c
    text: artikel 119;
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel12
  - number: 12.2.d
    text: artikel 121, eerste lid, onder f of h.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel12
  - number: '12.3'
    text: |-
      Aan de nabestaanden van de ambtenaar, bedoeld in [artikel 127 van het Burgerlijk ambtenarenreglement defensie][ref1],
      wordt naar bij ministeriële regeling te stellen regels een proportionele diensttijdgratificatie bij overlijden
      toegekend, welke wordt afgeleid van de gratificatie, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel127
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '127'
  - number: 12a.1
    text: |-
      Het bevoegd gezag kan aan de ambtenaar die het voor hem geldende maximumsalaris heeft bereikt een
      functioneringstoelage toekennen, indien de wijze van functioneren van de ambtenaar daartoe naar het oordeel van het
      bevoegd gezag aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel12a
  - number: 12a.2
    text: De functioneringstoelage wordt toegekend voor een periode van tenminste één jaar.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel12a
  - number: 12a.3
    text: De functioneringstoelage bedraagt ten hoogste 10 procent van het voor de ambtenaar geldende salaris.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel12a
  - number: '13.1'
    text: |-
      Aan de ambtenaar, die bij wijze van waarneming tijdelijk een functie uitoefent, welke bij toepassing van
      [artikel 5, tweede en derde lid][ref1], zou leiden tot een salarisschaal met een hoger maximumsalaris, kan voor de
      duur van die waarneming een toelage worden toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0006038#Artikel5
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006038
        artikel: '5'
        hoofdstuk: '2'
  - number: '13.2'
    text: |-
      De toelage wordt, tenzij bijzondere omstandigheden aanwezig zijn, slechts toegekend wanneer de waarneming ten
      minste een tijdvak van dertig dagen heeft geduurd.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel13
  - number: '13.3'
    text: |-
      Bij volledige waarneming van de functie bedoeld in het eerste lid is het bedrag van de toelage gelijk aan het
      verschil tussen het salaris dat de ambtenaar geniet en het salaris dat hij zou genieten, wanneer de salarisschaal
      met een hoger maximumsalaris met ingang van de dag waarop de waarneming is begonnen voor hem zou hebben gegolden.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel13
  - number: '13.4'
    text: Onze Minister stelt voor de toepassing van dit artikel nadere regels vast.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel13
  - number: '14.1'
    text: |-
      Indien het salaris minder is dan het maandbedrag van het minimumloon, dat krachtens de [artikelen 7][ref1], 8 en
      [14 van de Wet minimumloon en minimumvakantiebijslag][ref2] geldt voor werknemers van dezelfde leeftijd als de
      ambtenaar, wordt aan hem een toelage toegekend ten bedrage van het verschil.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel14
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '14'
  - number: '14.2'
    text: |-
      Voor de ambtenaar met een onvolledige werktijd, wordt het voor werknemers van dezelfde leeftijd geldende
      minimumloon geacht te zijn vastgesteld op een evenredig deel van het minimumloon bij een volledige werktijd.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel14
  - number: '15.1'
    text: |-
      Aan de ambtenaar, die anders dan bij wijze van overwerk, regelmatig of vrij regelmatig arbeid verricht op andere
      tijden dan op de dagen maandag tot en met vrijdag tussen 8.00 en 18.00 uur, wordt een toelage toegekend.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel15
  - number: '15.2'
    text: 'De toelage bedraagt per gewerkt uur een percentage van het voor de ambtenaar geldende salaris per uur en wel:'
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel15
  - number: 15.2.a
    text: 20% voor de uren op maandag tot en met vrijdag tussen 6.00 en 8.00 uur en tussen 18.00 en 22.00 uur;
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel15
  - number: 15.2.b
    text: 40% voor de uren op maandag tot en met vrijdag tussen 0.00 en 6.00 uur en tussen 22.00 en 24.00 uur;
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel15
  - number: 15.2.c
    text: 45% voor de uren op zaterdag;
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel15
  - number: 15.2.d
    text: 70% voor de uren op zondag;
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel15
  - number: 15.2.e
    text: |-
      100% voor de uren op de feestdagen genoemd in
      [artikel 31g, tweede lid, van het Burgerlijk ambtenarenreglement defensie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel31g
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 31g
  - number: '15.3'
    text: |-
      Voor de in het tweede lid onder *a* genoemde morgen- en avonduren wordt de toelage slechts toegekend, indien de
      arbeid is aangevangen vóór 7.00 uur, respectievelijk is beëindigd na 19.00 uur.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel15
  - number: '15.4'
    text: |-
      In afwijking van het bepaalde in het eerste en het tweede lid ontvangt de ambtenaar met ingang van de maand waarin
      hij de leeftijd van 55 jaar bereikt een vaste toelage, mits hij op dat moment gedurende ten minste 5 jaar zonder
      wezenlijke onderbreking een toelage als bedoeld in het eerste lid heeft genoten.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel15
  - number: '15.5'
    text: |-
      De toelage genoemd in het vierde lid wordt vastgesteld op het bedrag dat de ambtenaar over de twaalf
      kalendermaanden voorafgaande aan de maand waarin hij de leeftijd van 55 jaar bereikt gemiddeld per maand aan
      toelage als bedoeld in het eerste lid heeft genoten en wordt aangepast aan algemene salariswijzigingen.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel15
  - number: '15.6'
    text: |-
      Voor de toepassing van het vierde lid wordt onder wezenlijke onderbreking verstaan een onderbreking van langer dan
      twee maanden.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel15
  - number: '15.7'
    text: |-
      In bijzondere gevallen kan een regeling worden getroffen, welke het bepaalde in dit artikel aanvult of daarvan
      afwijkt.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel15
  - number: '16.1'
    text: |-
      Aan de ambtenaar die krachtens een rooster als bedoeld in
      [artikel 30b, eerste lid, van het Burgerlijk ambtenarenreglement defensie][ref1] of in bepalingen van dezelfde
      strekking in een soortgelijke regeling, anders dan bij wijze van overwerk regelmatig of vrij regelmatig arbeid
      verricht op andere tijden dan op de dagen van maandag tot en met vrijdag tussen 8.00 uur en 18.00 uur wordt voor
      het in opdracht van het bevoegde gezag verrichten van arbeid op uren die afwijken van het vastgestelde rooster een
      toelage toegekend, voor zover met die uren het totaal van het per werkperiode vastgestelde aantal arbeidsuren niet
      wordt overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel30b
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 30b
  - number: '16.2'
    text: |-
      Op de in het eerste lid bedoelde toelage bestaat geen aanspraak indien tussen het geven van de opdracht en het
      verrichten van de arbeid meer dan 72 uren zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel16
  - number: '16.3'
    text: |-
      De toelage bedraagt voor elk vol uur waarop in afwijking van het rooster arbeid is verricht 40% van het voor de
      ambtenaar geldende salaris per uur, met dien verstande dat dit percentage wordt berekend over ten hoogste het
      salaris per uur, dat is afgeleid van het salaris behorende bij salarisnummer 10 van salarisschaal 7.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel16
  - number: '17.1'
    text: |-
      Aan de ambtenaar wiens bezoldiging als gevolg van het buiten zijn toedoen beëindigen of verminderen van een toelage
      als bedoeld in [artikel 15][ref1], een blijvende verlaging ondergaat, welke tenminste 3% bedraagt van de som van
      het salaris en een toelage als bedoeld in [artikel 20][ref2], wordt een aflopende toelage toegekend, mits hij
      eerstgenoemde toelage direct voorafgaande aan het tijdstip van vorenbedoelde beëindiging of vermindering ervan
      gedurende tenminste 2 jaren zonder wezenlijke onderbreking heeft genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0006038#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0006038#Artikel20
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006038
        artikel: '15'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0006038
        artikel: '20'
        hoofdstuk: '4'
  - number: '17.2'
    text: |-
      Voor de toepassing van het eerste lid wordt onder wezenlijke onderbreking verstaan een onderbreking van langer dan
      2 maanden.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel17
  - number: '17.3'
    text: Onze Minister stelt voor de toepassing van dit artikel nadere regels vast.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel17
  - number: '18.1'
    text: |-
      Aan de ambtenaar die buiten de werktijden die voor hem gelden krachtens een rooster als bedoeld in
      [artikel 30b, eerste lid, van het Burgerlijk ambtenarenreglement defensie][ref1] of in bepalingen van dezelfde
      strekking in een soortgelijke regeling, ingevolge een schriftelijke aanwijzing van het bevoegde gezag zich
      regelmatig of vrij regelmatig bereikbaar en beschikbaar moet houden teneinde bij oproep arbeid te gaan verrichten,
      wordt een toelage toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel30b
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 30b
  - number: '18.2'
    text: |-
      De toelage bedraagt per uur bereikbaarheid en beschikbaarheid een percentage van het voor de ambtenaar geldende
      salaris per uur en wel:
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel18
  - number: 18.2.a
    text: 5% voor de uren op maandag tot en met vrijdag;
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel18
  - number: 18.2.b
    text: |-
      10% voor de uren op zaterdag en zondag en op de feestdagen genoemd in
      [artikel 30b, eerste lid, van het Burgerlijk ambtenarenreglement defensie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel30b
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 30b
  - number: '18.3'
    text: |-
      De op basis van het tweede lid berekende toelage wordt verhoogd met 100% over de uren waarop aan de opgedragen
      bereikbaarheid en beschikbaarheid een extra plaatsgebondenheid op of rond de plaats van tewerkstelling is
      verbonden.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel18
  - number: '18.4'
    text: |-
      In bijzondere gevallen kan een regeling worden getroffen welke het bepaalde in dit artikel aanvult of daarvan
      afwijkt.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel18
  - number: '19.1'
    text: Aan de ambtenaar kan om redenen van werving of behoud een toelage voor de duur van één jaar worden toegekend.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel19
  - number: '19.2'
    text: |-
      Indien naar het oordeel van het bevoegde gezag sprake is van bijzondere omstandigheden kan de toelage voor een
      bepaalde duur langer dan één jaar worden toegekend.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel19
  - number: '20'
    text: |-
      In uitzonderlijke gevallen kan aan de ambtenaar of aan een groep ambtenaren een toelage worden toegekend op andere
      gronden dan die vermeld in de [artikelen 12a tot en met 19][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006038#Artikel13
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0006038
        artikel: '13'
        hoofdstuk: '4'
  - number: 20a
    text: |-
      Bij toekenning van een aanspraak op een beloning, als bedoeld in [artikel 11][ref1], een functioneringstoelage, als
      bedoeld in [artikel 12a][ref2], een wervings- en behoudtoelage, als bedoeld in [artikel 19][ref3], of een wervings-
      en behoudpremie, als bedoeld in [artikel 24][ref4], bedraagt de totale waarde van die aanspraken, gerekend over de
      voorafgaande 12 maanden, maximaal 30% van het tot een jaarbedrag herleide salaris in de maand van de toekenning.


      [ref1]: https://wetten.overheid.nl/BWBR0006038#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0006038#Artikel12a
      [ref3]: https://wetten.overheid.nl/BWBR0006038#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0006038#Artikel24
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0006038
        artikel: '11'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0006038
        artikel: 12a
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0006038
        artikel: '19'
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0006038
        artikel: '24'
        hoofdstuk: '6'
  - number: '21'
    text: |-
      Een krachtens [artikel 12a][ref1], 19 of 20 toegekende toelage wordt ingetrokken, indien de gronden, waarop de
      toelage werd toegekend, niet meer aanwezig zijn, tenzij het bevoegde gezag van oordeel is, dat er omstandigheden
      zijn om de toelage geheel of gedeeltelijk te handhaven.


      [ref1]: https://wetten.overheid.nl/BWBR0006038#Artikel12a
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0006038
        artikel: 12a
        hoofdstuk: '3'
  - number: 21a.1
    text: |-
      De ambtenaar, die aanspraak heeft op salaris volgens [bijlage B][ref1] van dit besluit respectievelijk de gewezen
      ambtenaar, die aanspraak had op salaris volgens [bijlage B][ref2] van dit besluit en in het genot is van wachtgeld
      als bedoeld in [artikel 22 van het Werkloosheidsbesluit defensiepersoneel][ref3] of uitkering op grond van het
      [Besluit uitkering wegens functioneel leeftijdsontslag burgerlijke ambtenaren defensie][ref4], heeft aanspraak
      op een eindejaarsuitkering ten bedrage van 0,6% van het door hem genoten salaris respectievelijk het door hem
      genoten wachtgeld of de door hem genoten uitkering na toepassing van de bij of krachtens die besluiten geldende
      vermindering wegens inkomsten uit of in verband met arbeid of bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0006038
      [ref2]: https://wetten.overheid.nl/BWBR0006038
      [ref3]: https://wetten.overheid.nl/BWBR0008113#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0006041
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0006038
      - id: ref2
        bwb_id: BWBR0006038
      - id: ref3
        bwb_id: BWBR0008113
        artikel: '22'
      - id: ref4
        bwb_id: BWBR0006041
  - number: 21a.2
    text: |-
      Indien op het genoten salaris van de ambtenaar een uitkering op grond van de [Ziektewet][ref1] of de
      [Wet op de arbeidsongeschiktheidsverzekering][ref2] in mindering is gebracht, wordt voor de toepassing van het
      eerste lid het genoten salaris in acht genomen, zoals dit zou zijn genoten, indien geen sprake zou zijn geweest van
      recht op een uitkering op grond van de [Ziektewet][ref3] of de [Wet op de arbeidsongeschiktheidsverzekering][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0002524
      [ref3]: https://wetten.overheid.nl/BWBR0001888
      [ref4]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0002524
      - id: ref3
        bwb_id: BWBR0001888
      - id: ref4
        bwb_id: BWBR0002524
  - number: 21a.3
    text: |-
      Indien voor de ambtenaar op grond van [artikel 23, tweede lid, van het Burgerlijk ambtenarenreglement defensie][ref1]
      het feitelijk genot van de bezoldiging is teruggebracht tot het bedrag van het op de ambtenaar te verhalen gedeelte
      van de pensioenbijdrage, wordt hij voor de toepassing van het eerste en tweede lid geacht geen salaris te genieten.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel23
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '23'
  - number: 21a.4
    text: De eindejaarsuitkering wordt eenmaal per kalenderjaar en over dat kalenderjaar in de maand december betaald.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel21a
  - number: 21a.5
    text: |-
      Bij ontslag van de ambtenaar vindt betaling plaats over het tijdvak gelegen tussen het einde van de laatst
      verstreken periode waarover de eindejaarsuitkering is betaald en de datum van het ontslag.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel21a
  - number: '22.1'
    text: De ambtenaar heeft recht op een vakantie-uitkering ten bedrage van 8% van de door hem genoten bezoldiging.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel22
  - number: '22.2'
    text: |-
      Voor de ambtenaar die 22 jaar of ouder is bedraagt de vakantie-uitkering tenminste f 279,39 met dien verstande dat
      dit bedrag bij een onvolledige werktijd of bij genot van slechts een gedeelte van de bezoldiging, op andere gronden
      dan vermeld in het vierde lid, naar evenredigheid wordt verminderd.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel22
  - number: '22.3'
    text: |-
      Voor de ambtenaar die jonger is dan 22 jaar bedraagt de vakantie-uitkering ten minste het in het tweede lid
      genoemde bedrag verminderd met 10% voor elk leeftijdsjaar of gedeelte van een leeftijdsjaar dat hij jonger is dan
      22 jaar, met een maximumaftrek van 30%, met dien verstande dat het bedrag waarop hij alsdan aanspraak heeft bij een
      onvolledige werktijd of bij genot van slechts een gedeelte van de bezoldiging, op andere gronden dan vermeld in het
      vierde lid, naar evenredigheid wordt verminderd.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel22
  - number: '22.4'
    text: |-
      Wanneer de ambtenaar op grond van de [artikelen 22 tot en met 29][ref1] of van
      [artikel 59 van het Burgerlijk ambtenarenreglement defensie][ref2] of op grond van bepalingen van dezelfde
      strekking in een soortgelijke regeling slechts een gedeelte van zijn bezoldiging geniet, wordt hij voor de
      toepassing van het eerste lid geacht in het genot van zijn volle bezoldiging te zijn, met dien verstande dat
      wanneer het feitelijke genot van de bezoldiging is teruggebracht tot het bedrag van het op de ambtenaar te verhalen
      gedeelte van de pensioenbijdrage, hij voor toepassing van het eerste lid wordt geacht geen bezoldiging te genieten.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0006040#Artikel59
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0006040
        artikel: '59'
  - number: '23.1'
    text: |-
      De vakantie-uitkering wordt eenmaal per jaar betaald over de periode van 12 maanden, die is aangevangen met de
      maand juni van het voorafgaande kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel23
  - number: '23.2'
    text: |-
      Bij ontslag van de ambtenaar vindt betaling plaats over het tijdvak, gelegen tussen het einde van de laatste
      verstreken periode waarover de vakantie-uitkering is betaald en de datum van het ontslag.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel23
  - number: '24.1'
    text: Aan de ambtenaar kan om redenen van werving of behoud een uitkering worden toegekend.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel24
  - number: '24.2'
    text: |-
      De in het eerste lid bedoelde uitkering wordt toegekend aan het eind van een tijdvak dat tevoren is vastgesteld
      door het tot het toekennen van de uitkering bevoegde gezag, dat aan het toekennen nadere voorwaarden kan verbinden.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel24
  - number: '24.3'
    text: |-
      Aan de ambtenaar die niet heeft kunnen voldoen aan de in het tweede lid bedoelde voorwaarden door een naar het
      oordeel van het bevoegde gezag niet aan hemzelf te wijten oorzaak, kan de uitkering gedeeltelijk worden toegekend.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel24
  - number: '25.1'
    text: |-
      Aan de ambtenaar, voor wie een salarisschaal geldt met een lager maximumsalaris dan dat van schaal 11 en die in
      opdracht van het bevoegde gezag overwerk verricht, wordt behoudens het bepaalde in het derde lid een vergoeding
      toegekend.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel25
  - number: '25.2'
    text: |-
      Onder overwerk wordt verstaan arbeid buiten de werktijden geldende voor de ambtenaar krachtens een rooster als
      bedoeld in [artikel 30b, eerste lid, van het Burgerlijk ambtenarenreglement defensie][ref1] of in bepalingen
      van dezelfde strekking in een soortgelijke regeling, voor zover daardoor het per werkperiode vastgestelde aantal
      arbeidsuren wordt overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel30b
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 30b
  - number: '25.3'
    text: |-
      Voor overwerk dat gedurende korter dan een half uur aansluitend aan de dagelijkse werktijd wordt verricht, wordt
      geen vergoeding toegekend.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel25
  - number: '25.4'
    text: 'De werkperiode bedoeld in het tweede lid wordt gesteld op:'
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel25
  - number: 25.4.a
    text: één dag, indien aanvang en einde van de werktijd in de regel niet aan wisselingen onderhevig zijn;
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel25
  - number: 25.4.b
    text: |-
      een tijdvak van ten minste zeven dagen, indien de tijdstippen van aanvang en einde van de werktijd volgens een
      tevoren vastgesteld rooster wisselen.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel25
  - number: '25.5'
    text: 'De vergoeding voor overwerk bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel25
  - number: 25.5.a
    text: verlof, gelijk aan het aantal uren overschrijding van het per werkperiode vastgestelde aantal arbeidsuren, en
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel25
  - number: 25.5.b
    text: |-
      een bedrag in geld, dat voor elk uur van die overschrijding een percentage van het voor de ambtenaar geldende
      salaris per uur bedraagt.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel25
  - number: '25.6'
    text: |-
      De vergoeding in verlof wordt zo spoedig mogelijk toegekend, doch in de regel niet later dan in de kalendermaand
      volgende op die, waarin de overschrijding plaats had, waarbij zoveel mogelijk rekening wordt gehouden met de wensen
      van de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel25
  - number: '25.7'
    text: |-
      Indien naar het oordeel van het bevoegde gezag het dienstbelang zich verzet tegen het toekennen van verlof, wordt
      in plaats van verlof voor ieder uur een bedrag in geld toegekend gelijk aan het voor de ambtenaar geldende salaris
      per uur.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel25
  - number: '25.8'
    text: 'Indien de werkperiode één dag omvat, bedraagt het in het vijfde lid, onder *b*, bedoelde percentage:'
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel25
  - number: 25.8.a
    text: |-
      behoudens het gestelde [onder ][ref1] en [][ref2], het getal, vermeld in de onderstaande tabel:


      [ref1]: https://wetten.overheid.nl/BWBR0006038#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0006038#Artikel25
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0006038
        artikel: '25'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0006038
        artikel: '25'
        hoofdstuk: '7'
  - number: 25.8.b
    text: |-
      50, indien gedurende langer dan twee uur overwerk is verricht, voor zover het overwerk betreft, dat na de eerste
      twee uur is verricht op maandag, dinsdag, woensdag, donderdag of vrijdag tussen 6.00 en 20.00 uur, behoudens het
      gestelde [onder ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006038#Artikel25
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0006038
        artikel: '25'
        hoofdstuk: '7'
  - number: 25.8.c
    text: |-
      100, indien het overwerk is verricht op een der feestdagen, genoemd in
      [artikel 31g, tweede lid, van het Burgerlijk ambtenarenreglement defensie][ref1] dan wel op de daarop volgende dag
      tussen 0.00 en 6.00 uur.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel31g
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: 31g
  - number: '25.9'
    text: |-
      Indien de werkperiode een tijdvak van tenminste zeven dagen omvat, bedraagt het in het vijfde lid, onder *b*
      bedoelde percentage:
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel25
  - number: 25.9.a
    text: |-
      50, behoudens het gestelde [onder ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006038#Artikel25
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0006038
        artikel: '25'
        hoofdstuk: '7'
  - number: 25.9.b
    text: |-
      100, indien het overwerk is verricht op zondag, op maandag tussen 0.00 en 6.00 uur, op een der feestdagen, genoemd
      in [artikel 31g, tweede lid, van het Burgerlijk ambtenarenreglement defensie][ref1], dan wel op de dag, volgende op
      de laatstgenoemde dag tussen 0.00 en 6.00 uur.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel30
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '30'
  - number: '25.10'
    text: |-
      Voor het vaststellen van de duur van de overschrijding gelden de uren waarop krachtens het vijfde lid onder *a*,
      of krachtens het [Burgerlijk ambtenarenreglement defensie][ref1] dan wel een overeenkomstige regeling vakantie of
      verlof is genoten, als uren waarop is gewerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0006040
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0006040
  - number: '25.11'
    text: |-
      Aan ambtenaren voor wie verschillende salarisschalen gelden, die ingevolge een opdracht als bedoeld in het eerste
      lid gelijke werkzaamheden verrichten kan, in afwijking van het in dit artikel bepaalde, naar billijkheid een voor
      alle betrokken ambtenaren gelijke vergoeding worden toegekend.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel25
  - number: '25.12'
    text: |-
      In bijzondere gevallen kan een regeling worden getroffen, welke het bepaalde in dit artikel aanvult of daarvan
      afwijkt.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel25
  - number: '26.1'
    text: Het bepalen van de salarisschaal van de ambtenaar geschiedt door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel26
  - number: '26.2'
    text: |-
      In afwijking van het eerste lid geschiedt het bepalen van de salarisschaal bij koninklijk besluit, op voordracht
      van Onze Minister, indien het maximumsalaris van die schaal gelijk is aan of hoger is dan het maximumsalaris van
      schaal 15 van [bijlage B][ref1] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0006038
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0006038
  - number: '26.3'
    text: |-
      Het toekennen van het salaris, de eindejaarsuitkering, de vakantieuitkering, een beloning als bedoeld
      in [artikel 11][ref1], een gratificatie als bedoeld in [artikel 12][ref2], een toelage als bedoeld in
      [de artikelen 12a tot en met 19][ref3], de uitkering, bedoeld in [artikel 24][ref4], en een vergoeding voor extra
      diensten als bedoeld in [artikel 25][ref5] geschiedt door Onze Minister, dan wel door het bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0006038#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0006038#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0006038#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0006038#Artikel24
      [ref5]: https://wetten.overheid.nl/BWBR0006038#Artikel25
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0006038
        artikel: '11'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0006038
        artikel: '12'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0006038
        artikel: '13'
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0006038
        artikel: '24'
        hoofdstuk: '6'
      - id: ref5
        bwb_id: BWBR0006038
        artikel: '25'
        hoofdstuk: '7'
  - number: '26.4'
    text: |-
      Bij algemene maatregel van bestuur kunnen bepalingen worden vastgesteld die afwijken van het bepaalde in dit
      artikel.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel26
  - number: '27.1'
    text: |-
      Het vaststellen van een regeling als bedoeld in de [artikelen 10][ref1], [15 zevende lid][ref2],
      [18 vierde lid][ref3] en [25 twaalfde lid][ref4], geschiedt door Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0006038#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0006038#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0006038#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0006038#Artikel25
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0006038
        artikel: '10'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0006038
        artikel: '15'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0006038
        artikel: '18'
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0006038
        artikel: '25'
        hoofdstuk: '7'
  - number: '27.2'
    text: |-
      Het toekennen van een toelage als bedoeld in [artikel 20][ref1] geschiedt bij koninklijk besluit op
      gemeenschappelijke voordracht van Onze Minister-President en Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0006038#Artikel20
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0006038
        artikel: '20'
        hoofdstuk: '4'
  - number: '27.3'
    text: |-
      Het intrekken ingevolge artikel 21 van een toelage als bedoeld in de[ artikelen 12a][ref1], [19][ref2] en
      [20][ref3] geschiedt door het gezag dat bevoegd is deze toelage toe te kennen.


      [ref1]: https://wetten.overheid.nl/BWBR0006038#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0006038#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0006038#Artikel20
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0006038
        artikel: 12a
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0006038
        artikel: '19'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0006038
        artikel: '20'
        hoofdstuk: '4'
  - number: '28'
    text: |-
      Voor gevallen, waarin dit besluit niet of niet naar billijkheid voorziet, wordt bij koninklijk besluit een
      bijzondere regeling getroffen op gemeenschappelijke voordracht van Onze Minister-President en Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006038/2002-01-01#Artikel28
  - number: '29'
    text: |-
      De aanspraken, welke een ambtenaar aan één van [de onder ][ref1][t][ref2]/m *e* opgesomde regelingen op het
