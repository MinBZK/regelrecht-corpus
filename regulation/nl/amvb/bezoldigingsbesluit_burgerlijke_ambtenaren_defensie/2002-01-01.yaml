  - number: 29a
    text: |-
      Een verhoging van het salaris als gevolg van de toevoeging van nieuwe maximumbedragen in de
      salarisschalen 1 tot en met 7 per 1 januari 2001 leidt, in voorkomend geval, niet tot een
      verlaging van een toelage als bedoeld in [artikel 19][ref1] of 20, of van de toelagen ingevolge
      de[Overgangsregeling bezoldigingsbesluit burgerlijke rijksambtenaren 1984][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006038#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0003631
