  - number: '30'
    text: |-
      Voor zover op grond van de bepalingen van dit besluit nadere regels moeten worden gegeven gelden na de
      inwerkingtreding van dit besluit ten aanzien van de ambtenaar als genoemd in [artikel 1][ref1] van dit besluit de
      op basis van de overeenkomstige bepalingen van het [Bezoldigingsbesluit burgerlijke rijksambtenaren 1984][ref2]
      vastgestelde regels 1) als nadere regels berustende op dit besluit voor zover zij daarmede niet in strijd zijn.
      Zij blijven gedurende één jaar na het in werking treden van dit besluit van toepassing op de in [artikel 1][ref3]
      genoemde ambtenaar tenzij Onze Minister anders bepaalt.


      [ref1]: https://wetten.overheid.nl/BWBR0006038#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003630
