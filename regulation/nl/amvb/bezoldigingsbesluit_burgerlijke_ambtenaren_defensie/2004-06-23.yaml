  - number: '15'
    text: |-
      1 Aan de ambtenaar, die anders dan bij wijze van overwerk, regelmatig of vrij regelmatig arbeid verricht op andere
      tijden dan op de dagen maandag tot en met vrijdag tussen 8.00 en 18.00 uur, wordt een toelage toegekend.

      2 De toelage bedraagt per gewerkt uur een percentage van het voor de ambtenaar geldende salaris per uur en wel:

      a. 20% voor de uren op maandag tot en met vrijdag tussen 6.00 en 8.00 uur en tussen 18.00 en 22.00 uur;

      b. 40% voor de uren op maandag tot en met vrijdag tussen 0.00 en 6.00 uur en tussen 22.00 en 24.00 uur;

      c. 45% voor de uren op zaterdag;

      d. 70% voor de uren op zondag;

      e. 100% voor de uren op de feestdagen genoemd in
      [artikel 31g, tweede lid, van het Burgerlijk ambtenarenreglement defensie][ref1];

      met dien verstande dat genoemde percentages worden berekend over ten hoogste het salaris per uur, dat is afgeleid
      van het salaris behorende bij het maximumsalaris van salarisschaal 7.

      3 Voor de in het tweede lid onder *a* genoemde morgen- en avonduren wordt de toelage slechts toegekend, indien de
      arbeid is aangevangen vóór 7.00 uur, respectievelijk is beëindigd na 19.00 uur.

      4 In afwijking van het bepaalde in het eerste en het tweede lid ontvangt de ambtenaar met ingang van de maand
      waarin hij de leeftijd van 55 jaar bereikt een vaste toelage, mits hij op dat moment gedurende ten minste 5 jaar
      zonder wezenlijke onderbreking een toelage als bedoeld in het eerste lid heeft genoten.

      5 De toelage genoemd in het vierde lid wordt vastgesteld op het bedrag dat de ambtenaar over de twaalf
      kalendermaanden voorafgaande aan de maand waarin hij de leeftijd van 55 jaar bereikt gemiddeld per maand aan
      toelage als bedoeld in het eerste lid heeft genoten en wordt aangepast aan algemene salariswijzigingen.

      6 Voor de toepassing van het vierde lid wordt onder wezenlijke onderbreking verstaan een onderbreking van langer
      dan twee maanden.

      7 In bijzondere gevallen kan een regeling worden getroffen, welke het bepaalde in dit artikel aanvult of daarvan
      afwijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel31g
