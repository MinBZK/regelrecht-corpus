        artikel: '127'
  - number: 12a
    text: |-
      1 Het bevoegd gezag kan aan de ambtenaar die het voor hem geldende maximumsalaris heeft bereikt een
      functioneringstoelage toekennen, indien de wijze van functioneren van de ambtenaar daartoe naar het oordeel van het
      bevoegd gezag aanleiding geeft.

      2 De functioneringstoelage wordt toegekend voor een periode van tenminste één jaar.

      3 De functioneringstoelage bedraagt ten hoogste 10 procent van het voor de ambtenaar geldende salaris.
    url: https://wetten.overheid.nl/BWBR0006038/2004-06-23#Artikel12a
  - number: '13'
    text: |-
      1 Aan de ambtenaar, die bij wijze van waarneming tijdelijk een functie uitoefent, welke bij toepassing van
      [artikel 5, tweede en derde lid][ref1], zou leiden tot een salarisschaal met een hoger maximumsalaris, kan voor de
      duur van die waarneming een toelage worden toegekend.

      2 De toelage wordt, tenzij bijzondere omstandigheden aanwezig zijn, slechts toegekend wanneer de waarneming ten
      minste een tijdvak van dertig dagen heeft geduurd.

      3 Bij volledige waarneming van de functie bedoeld in het eerste lid is het bedrag van de toelage gelijk aan het
      verschil tussen het salaris dat de ambtenaar geniet en het salaris dat hij zou genieten, wanneer de salarisschaal
      met een hoger maximumsalaris met ingang van de dag waarop de waarneming is begonnen voor hem zou hebben gegolden.

      4 Onze Minister stelt voor de toepassing van dit artikel nadere regels vast.


      [ref1]: https://wetten.overheid.nl/BWBR0006038#Artikel5
    url: https://wetten.overheid.nl/BWBR0006038/2004-06-23#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006038
        artikel: '5'
        hoofdstuk: '2'
  - number: '14'
    text: |-
      1 Indien het salaris minder is dan het maandbedrag van het minimumloon, dat krachtens de [artikelen 7][ref1], 8
      en [14 van de Wet minimumloon en minimumvakantiebijslag][ref2] geldt voor werknemers van dezelfde leeftijd als de
      ambtenaar, wordt aan hem een toelage toegekend ten bedrage van het verschil.

      2 Voor de ambtenaar met een onvolledige werktijd, wordt het voor werknemers van dezelfde leeftijd geldende
      minimumloon geacht te zijn vastgesteld op een evenredig deel van het minimumloon bij een volledige werktijd.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel14
