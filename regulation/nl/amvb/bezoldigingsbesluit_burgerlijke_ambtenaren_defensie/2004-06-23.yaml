  - number: '26'
    text: |-
      1 Het bepalen van de salarisschaal van de ambtenaar geschiedt door Onze Minister.

      2 In afwijking van het eerste lid geschiedt het bepalen van de salarisschaal bij koninklijk besluit, op voordracht
      van Onze Minister, indien het maximumsalaris van die schaal gelijk is aan of hoger is dan het maximumsalaris van
      schaal 15 van [bijlage B][ref1] van dit besluit.

      3 Het toekennen van het salaris, de eindejaarsuitkering, de vakantieuitkering, een beloning als bedoeld
      in [artikel 11][ref2], een gratificatie als bedoeld in [artikel 12][ref3], een toelage als bedoeld in
      [de artikelen 12a tot en met 19][ref4], de uitkering, bedoeld in [artikel 24][ref5], en een vergoeding voor extra
      diensten als bedoeld in [artikel 25][ref6] en een vervangingstoelage als bedoeld in [artikel 29a][ref7] geschiedt
      door Onze Minister, dan wel door het bevoegd gezag.

      4 Bij algemene maatregel van bestuur kunnen bepalingen worden vastgesteld die afwijken van het bepaalde in dit
      artikel.


