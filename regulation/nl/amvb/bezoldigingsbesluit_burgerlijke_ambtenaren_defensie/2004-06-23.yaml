        bwb_id: BWBR0006040
        artikel: 30b
  - number: '17'
    text: |-
      1 Aan de ambtenaar wiens bezoldiging als gevolg van het buiten zijn toedoen beëindigen of verminderen van een
      toelage als bedoeld in [artikel 15][ref1], een blijvende verlaging ondergaat, welke tenminste 3% bedraagt van de
      som van het salaris en een toelage als bedoeld in [artikel 20][ref2], wordt een aflopende toelage toegekend, mits
      hij eerstgenoemde toelage direct voorafgaande aan het tijdstip van vorenbedoelde beëindiging of vermindering ervan
      gedurende tenminste 2 jaren zonder wezenlijke onderbreking heeft genoten.

      2 Voor de toepassing van het eerste lid wordt onder wezenlijke onderbreking verstaan een onderbreking van langer
      dan 2 maanden.

      3 Onze Minister stelt voor de toepassing van dit artikel nadere regels vast.


      [ref1]: https://wetten.overheid.nl/BWBR0006038#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0006038#Artikel20
