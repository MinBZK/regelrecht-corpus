  - number: '7'
    text: |-
      1 Bij aanstelling wordt aan de in [artikel 5][ref1] bedoelde ambtenaar het salaris toegekend, dat:

      a. wanneer hij 22 jaar of ouder is, in de voor hem geldende salarisschaal is vermeld achter het salarisnummer 0;

      b. wanneer hij jonger dan 22 jaar is, in de voor hem geldende salarisschaal is vermeld achter het salarisnummer,
      bestaande uit [de letter J][ref2] en het getal, dat overeenkomt met zijn leeftijd. Indien het salarisnummer niet
      voorkomt, wordt de ambtenaar het laagste salaris in de schaal toegekend.

      2 Van het bepaalde in het eerste lid kan worden afgeweken door het toekennen van een hoger salaris, ingeval daartoe
      naar het oordeel van het bevoegde gezag aanleiding bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0006038#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006038#Artikel7
