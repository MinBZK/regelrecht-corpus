    text: |-
      1 De vakantie-uitkering wordt eenmaal per jaar betaald over de periode van 12 maanden, die is aangevangen met de
      maand juni van het voorafgaande kalenderjaar.

      2 Bij ontslag van de ambtenaar vindt betaling plaats over het tijdvak, gelegen tussen het einde van de laatste
      verstreken periode waarover de vakantie-uitkering is betaald en de datum van het ontslag.
    url: https://wetten.overheid.nl/BWBR0006038/2004-06-23#Artikel23
  - number: '24'
    text: |-
      1 Aan de ambtenaar kan om redenen van werving of behoud een uitkering worden toegekend.

      2 De in het eerste lid bedoelde uitkering wordt toegekend aan het eind van een tijdvak dat tevoren is vastgesteld
      door het tot het toekennen van de uitkering bevoegde gezag, dat aan het toekennen nadere voorwaarden kan verbinden.

      3 Aan de ambtenaar die niet heeft kunnen voldoen aan de in het tweede lid bedoelde voorwaarden door een naar het
      oordeel van het bevoegde gezag niet aan hemzelf te wijten oorzaak, kan de uitkering gedeeltelijk worden toegekend.
    url: https://wetten.overheid.nl/BWBR0006038/2004-06-23#Artikel24
  - number: '25'
    text: |-
      1 Aan de ambtenaar, voor wie een salarisschaal geldt met een lager maximumsalaris dan dat van schaal 11 en die in
      opdracht van het bevoegde gezag overwerk verricht, wordt behoudens het bepaalde in het derde lid een vergoeding
      toegekend.

      2 Onder overwerk wordt verstaan arbeid buiten de werktijden geldende voor de ambtenaar krachtens een rooster
      als bedoeld in [artikel 30b, eerste lid, van het Burgerlijk ambtenarenreglement defensie][ref1] of in bepalingen
      van dezelfde strekking in een soortgelijke regeling, voor zover daardoor het per werkperiode vastgestelde aantal
      arbeidsuren wordt overschreden.

      3 Voor overwerk dat gedurende korter dan een half uur aansluitend aan de dagelijkse werktijd wordt verricht, wordt
      geen vergoeding toegekend.

      4 De werkperiode bedoeld in het tweede lid wordt gesteld op:

      a. één dag, indien aanvang en einde van de werktijd in de regel niet aan wisselingen onderhevig zijn;

      b. een tijdvak van ten minste zeven dagen, indien de tijdstippen van aanvang en einde van de werktijd volgens een
      tevoren vastgesteld rooster wisselen.

      5 De vergoeding voor overwerk bestaat uit:

      a. verlof, gelijk aan het aantal uren overschrijding van het per werkperiode vastgestelde aantal arbeidsuren, en

      b. een bedrag in geld, dat voor elk uur van die overschrijding een percentage van het voor de ambtenaar geldende
      salaris per uur bedraagt.

      6 De vergoeding in verlof wordt zo spoedig mogelijk toegekend, doch in de regel niet later dan in de kalendermaand
      volgende op die, waarin de overschrijding plaats had, waarbij zoveel mogelijk rekening wordt gehouden met de wensen
      van de ambtenaar.

      7 Indien naar het oordeel van het bevoegde gezag het dienstbelang zich verzet tegen het toekennen van verlof, wordt
      in plaats van verlof voor ieder uur een bedrag in geld toegekend gelijk aan het voor de ambtenaar geldende salaris
      per uur.

      8 Indien de werkperiode één dag omvat, bedraagt het in het vijfde lid, onder *b*, bedoelde percentage:

      a. behoudens het gestelde [onder ][ref2] en [][ref3], het getal, vermeld in de onderstaande tabel:

      b. 50, indien gedurende langer dan twee uur overwerk is verricht, voor zover het overwerk betreft, dat na de eerste
      twee uur is verricht op maandag, dinsdag, woensdag, donderdag of vrijdag tussen 6.00 en 20.00 uur, behoudens het
      gestelde [onder ][ref4];

      c. 100, indien het overwerk is verricht op een der feestdagen, genoemd in
      [artikel 31g, tweede lid, van het Burgerlijk ambtenarenreglement defensie][ref5] dan wel op de daarop volgende dag
      tussen 0.00 en 6.00 uur.

      9 Indien de werkperiode een tijdvak van tenminste zeven dagen omvat, bedraagt het in het vijfde lid, onder *b*
      bedoelde percentage:

      a. 50, behoudens het gestelde [onder ][ref6];

      b. 100, indien het overwerk is verricht op zondag, op maandag tussen 0.00 en 6.00 uur, op een der feestdagen,
      genoemd in [artikel 31g, tweede lid, van het Burgerlijk ambtenarenreglement defensie][ref7], dan wel op de dag,
      volgende op de laatstgenoemde dag tussen 0.00 en 6.00 uur.

      10 Voor het vaststellen van de duur van de overschrijding gelden de uren waarop krachtens het vijfde lid onder *a*,
      of krachtens het [Burgerlijk ambtenarenreglement defensie][ref8] dan wel een overeenkomstige regeling vakantie of
      verlof is genoten, als uren waarop is gewerkt.

      11 Aan ambtenaren voor wie verschillende salarisschalen gelden, die ingevolge een opdracht als bedoeld in het
      eerste lid gelijke werkzaamheden verrichten kan, in afwijking van het in dit artikel bepaalde, naar billijkheid een
      voor alle betrokken ambtenaren gelijke vergoeding worden toegekend.

      12 In bijzondere gevallen kan een regeling worden getroffen, welke het bepaalde in dit artikel aanvult of daarvan
      afwijkt.


