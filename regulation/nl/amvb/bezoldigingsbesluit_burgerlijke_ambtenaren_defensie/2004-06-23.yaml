  - number: '18'
    text: |-
      1 Aan de ambtenaar die buiten de werktijden die voor hem gelden krachtens een rooster als bedoeld in
      [artikel 30b, eerste lid, van het Burgerlijk ambtenarenreglement defensie][ref1] of in bepalingen van dezelfde
      strekking in een soortgelijke regeling, ingevolge een schriftelijke aanwijzing van het bevoegde gezag zich
      regelmatig of vrij regelmatig bereikbaar en beschikbaar moet houden teneinde bij oproep arbeid te gaan verrichten,
      wordt een toelage toegekend.

      2 De toelage bedraagt per uur bereikbaarheid en beschikbaarheid een percentage van het voor de ambtenaar geldende
      salaris per uur en wel:

      a. 5% voor de uren op maandag tot en met vrijdag;

      b. 10% voor de uren op zaterdag en zondag en op de feestdagen genoemd in
      [artikel 30b, eerste lid, van het Burgerlijk ambtenarenreglement defensie][ref2];

      met dien verstande dat genoemde percentages worden berekend over ten hoogste het salaris per uur, dat is afgeleid
      van het salaris behorende bij het maximumsalaris van salarisschaal 7.

      3 De op basis van het tweede lid berekende toelage wordt verhoogd met 100% over de uren waarop aan de opgedragen
      bereikbaarheid en beschikbaarheid een extra plaatsgebondenheid op of rond de plaats van tewerkstelling is
      verbonden.

      4 In bijzondere gevallen kan een regeling worden getroffen welke het bepaalde in dit artikel aanvult of daarvan
      afwijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel30b
      [ref2]: https://wetten.overheid.nl/BWBR0006040#Artikel30b
