  - number: '2'
    text: |-
      In dit besluit wordt verstaan onder:

      a. salaris

      het bedrag, dat met inachtneming van de bepalingen van dit besluit voor de ambtenaar is vastgesteld aan de hand van
      [bijlage B][ref1] van dit besluit;

      b. salaris per uur

      1/165 deel van het salaris bij een volledige werktijd;

      c. salarisschaal

      een als zodanig in de [bijlage B][ref2] van dit besluit vermelde reeks van genummerde salarissen;

      d. salarisnummer

      een aanduiding, bestaande uit een getal of uit een letter en een getal, dat in een salarisschaal voor een salaris
      is vermeld;

      e. maximumsalaris

      het hoogste bedrag van een salarisschaal, waarvan het salarisnummer uitsluitend uit een getal bestaat;

      f. bezoldiging

      de som van het salaris en de toelagen waarop de ambtenaar ingevolge [Hoofdstuk 4][ref3] gewijzigd: van dit besluit
      aanspraak heeft;

      g. volledige werktijd

      een werktijd welke gemiddeld achtendertig werkuren per week omvat;

      h. functie

      het samenstel van werkzaamheden door de ambtenaar te verrichten krachtens en overeenkomstig hetgeen hem door het
      daartoe bevoegde gezag is opgedragen;

      i. Onze Minister

      Onze Minister van Defensie;

      j. bevoegd gezag

      de bij koninklijk besluit of bij ministeriële regeling als zodanig aangewezen autoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0006038
      [ref2]: https://wetten.overheid.nl/BWBR0006038
