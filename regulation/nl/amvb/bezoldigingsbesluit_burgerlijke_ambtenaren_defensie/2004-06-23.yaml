    text: |-
      1 Ambtenaar in de zin van dit besluit is degene die bij het Ministerie van Defensie in burgerlijke openbare dienst
      is aangesteld.

      2 Dit besluit is niet van toepassing op de ambtenaar, wiens bezoldiging is geregeld:

      a. bij de wet;

      b. bij een algemene maatregel van bestuur tot regeling van de bezoldiging van

      1. de ambtenaren van de buitenlandse dienst;

      2. leden van raden, besturen en commissies;

      c. krachtens [artikel 20 van het Burgerlijk ambtenarenreglement defensie][ref1] of een daarmee overeenkomende
      bepaling van gelijke strekking;

      d. krachtens [artikel 21 van het Burgerlijk ambtenarenreglement defensie][ref2] of een daarmee overeenkomende
      bepaling van gelijke strekking.

      3 Dit besluit is niet van toepassing op de ambtenaar die is aangesteld in de functie van tandarts en die
      hoofdzakelijk is belast met de curatieve tandheelkundige zorg, met uitzondering van

      a. artikel 3, voor zover betrekking hebbend op de toelage, bedoeld in [artikel 19][ref3] en het bedrag, bedoeld in
      [artikel 22, tweede lid][ref4];

      b. de artikelen 9*a*, 11, 19, 21, 21*a*, 22, 23, 24 en 30*a*;

      c. artikel 26, derde en vierde lid, voor zover betrekking hebbend op de eindejaarsuitkering, de vakantie-uitkering
      en de [artikelen 11][ref5], [19][ref6] en [24][ref7];

      d. artikel 27, derde lid, voor zover betrekking hebbend op [artikel 21][ref8].

      4 Bij algemene maatregel van bestuur kunnen andere dan in het tweede lid bedoelde ambtenaren of groepen van
      ambtenaren worden uitgezonderd van de toepassing van dit besluit.


