      1 Aan de ambtenaar kan om redenen van werving of behoud een toelage voor de duur van één jaar worden toegekend.

      2 Indien naar het oordeel van het bevoegde gezag sprake is van bijzondere omstandigheden kan de toelage voor een
      bepaalde duur langer dan één jaar worden toegekend.
