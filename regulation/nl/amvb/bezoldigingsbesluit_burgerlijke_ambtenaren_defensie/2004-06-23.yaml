    text: |-
      1 De ambtenaar, die aanspraak heeft op salaris volgens [bijlage B][ref1] van dit besluit respectievelijk de gewezen
      ambtenaar, die aanspraak had op salaris volgens [bijlage B][ref2] van dit besluit en in het genot is van wachtgeld
      als bedoeld in [artikel 22 van het Werkloosheidsbesluit defensiepersoneel][ref3] of uitkering op grond van het
      [Besluit uitkering wegens functioneel leeftijdsontslag burgerlijke ambtenaren defensie][ref4], heeft aanspraak
      op een eindejaarsuitkering ten bedrage van 0,8% van het door hem genoten salaris respectievelijk het door hem
      genoten wachtgeld of de door hem genoten uitkering na toepassing van de bij of krachtens die besluiten geldende
      vermindering wegens inkomsten uit of in verband met arbeid of bedrijf.

      2 Indien op het genoten salaris van de ambtenaar een uitkering op grond van de [Ziektewet][ref5] of de
      [Wet op de arbeidsongeschiktheidsverzekering][ref6] in mindering is gebracht, wordt voor de toepassing van het
      eerste lid het genoten salaris in acht genomen, zoals dit zou zijn genoten, indien geen sprake zou zijn geweest van
      recht op een uitkering op grond van de [Ziektewet][ref7] of de [Wet op de arbeidsongeschiktheidsverzekering][ref8].

      3 Indien voor de ambtenaar op grond van
      [artikel 23, tweede lid, van het Burgerlijk ambtenarenreglement defensie][ref9] het feitelijk genot van de
      bezoldiging is teruggebracht tot het bedrag van het op de ambtenaar te verhalen gedeelte van de pensioenbijdrage,
      wordt hij voor de toepassing van het eerste en tweede lid geacht geen salaris te genieten.

      4 De eindejaarsuitkering wordt eenmaal per kalenderjaar en over dat kalenderjaar in de maand december betaald.

      5 Bij ontslag van de ambtenaar vindt betaling plaats over het tijdvak gelegen tussen het einde van de laatst
      verstreken periode waarover de eindejaarsuitkering is betaald en de datum van het ontslag.


