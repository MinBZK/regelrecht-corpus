  - number: 9a
    text: |-
      1 Het salaris van de ambtenaar bedoeld in [artikel 1, derde lid][ref1], wordt vastgesteld aan de hand van de soort
      en het aantal tandheelkundige verrichtingen.

      2 Bij ministeriële regeling worden nadere regels gesteld omtrent de vaststelling van het salaris.


      [ref1]: https://wetten.overheid.nl/BWBR0006038#Artikel1
