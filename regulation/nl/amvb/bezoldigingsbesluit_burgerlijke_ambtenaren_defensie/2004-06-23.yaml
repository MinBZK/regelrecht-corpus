  - number: '11'
    text: |-
      1 Het bevoegd gezag kan aan de ambtenaar die zich bijzonder heeft onderscheiden door optreden of gedragingen dan
      wel door buitengewone toewijding of bijzondere loffelijke dienstverrichtingen, één of meer van de onderstaande
      beloningen toekennen:

      a. geschenk;

      b. geldelijke beloning;

      c. functioneringsgratificatie.

      2 De totale waarde van één of meer van de beloningen, bedoeld in het eerste lid, bedraagt maximaal 20% van het
      tot een jaarbedrag herleide salaris in de maand van de toekenning. Bij de berekening van de totale waarde van de
      beloningen wordt geen rekening gehouden met de verschuldigde loonheffing en inhoudingen, bedoeld in het derde lid.

      3 De in voorkomend geval over één of meer van de beloningen verschuldigde loonheffing en inhoudingen, bedoeld in
      paragraaf 5 van de [Wet financiële voorzieningen privatisering ABP][ref1], komen voor rekening van Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0007211
    url: https://wetten.overheid.nl/BWBR0006038/2004-06-23#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007211
  - number: '12'
    text: |-
      1 De ambtenaar heeft naar bij ministeriële regeling te stellen regels aanspraak op een gratificatie bij
      ambtsjubileum.

      2 De ambtenaar heeft naar bij ministeriële regeling te stellen regels aanspraak op een proportionele
      diensttijdgratificatie, welke wordt afgeleid van de gratificatie, bedoeld in het eerste lid, indien hij wordt
      ontslagen met toepassing van één van de volgende artikelen uit het [Burgerlijk ambtenarenreglement defensie][ref1]:

      a. artikel 114;

      b. artikel 116;

      c. artikel 119;

      d. artikel 121, eerste lid, onder f of h.

      3 Aan de nabestaanden van de ambtenaar, bedoeld in
      [artikel 127 van het Burgerlijk ambtenarenreglement defensie][ref2], wordt naar bij ministeriële regeling te
      stellen regels een proportionele diensttijdgratificatie bij overlijden toegekend, welke wordt afgeleid van de
      gratificatie, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006040
      [ref2]: https://wetten.overheid.nl/BWBR0006040#Artikel127
