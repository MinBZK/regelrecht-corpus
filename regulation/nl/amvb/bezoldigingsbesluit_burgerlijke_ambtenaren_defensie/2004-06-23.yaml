  - number: '6'
    text: |-
      1 De ambtenaar die bedenkingen heeft tegen de uitkomst van de bepaling van de zwaarte van zijn functie bedoeld in
      [artikel 5, derde lid][ref1], kan bij het voor de toepassing van [artikel 5, tweede lid][ref2], bevoegde gezag een
      aanvraag indienen om die waarderingsuitkomst opnieuw in overweging te nemen.

      2 Indien de toepassing van het bepaalde in [artikel 5, tweede lid][ref3], berust bij Ons, worden Wij
      vertegenwoordigd door Onze Minister.

      3 Onze Minister stelt regels betreffende de behandeling van verzoeken als bedoeld in het eerste lid.

      4 Het in het eerste lid bepaalde is niet van toepassing indien voor de ambtenaar een bijzondere regeling geldt
      als bedoeld in [artikel 18 van het Burgerlijk ambtenarenreglement defensie][ref4] of in bepalingen van dezelfde
      strekking in een soortgelijke regeling.


