  - number: '28'
    text: |-
      Voor gevallen, waarin dit besluit niet of niet naar billijkheid voorziet, wordt bij koninklijk besluit een
      bijzondere regeling getroffen op gemeenschappelijke voordracht van Onze Minister-President en Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006038/2004-06-23#Artikel28
  - number: '29'
    text: |-
      De aanspraken, welke een ambtenaar aan één van [de onder ][ref1][t][ref2]/m *e* opgesomde regelingen op het
      tijdstip van inwerkingtreding van dit besluit kan ontlenen, blijven conform het bepaalde in die regelingen van
      kracht:

      a. [Overgangsregeling bezoldigingsbesluit burgerlijke rijksambtenaren 1984][ref3];

      b. koninklijk besluit van 1 augustus 1984, houdende verlaging van beginsalarissen van burgerlijke rijksambtenaren
      (*Stb.* 1984, 371);

      c. koninklijk besluit van 14 december 1988, tot wijziging van het
      [Bezoldigingsbesluit burgerlijke rijksambtenaren 1984][ref4] en enkele andere besluiten in verband met
      differentiatie in beloning op grond van individueel functioneren ( *Stb.* 1988, 652);

      d. koninklijk besluit van 22 juli 1985, houdende wijziging van het
      [Bezoldigingsbesluit burgerlijke rijksambtenaren 1984][ref5] en vaststelling van een bijbehorende overgangsregeling
      (*Stb.* 1985, 454).


