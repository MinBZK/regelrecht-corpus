  - number: '10'
    text: |-
      In bijzondere gevallen kan een regeling worden getroffen, waarbij van de overige bepalingen van dit hoofdstuk kan
      worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0006038/2004-06-23#Artikel10
  - number: 10a
    text: |-
      1 Bij de ambtenaar die ingevolge [artikel 109, eerste lid][ref1], dan wel ingevolge
      [artikel 109, tweede lid, onderdeel a of b, van het Burgerlijk ambtenarenreglement defensie][ref2] is geschorst,
      wordt voor de duur van die schorsing eenderde gedeelte ingehouden van de bezoldiging, tenzij het bevoegde gezag
      bepaalt dat geen inhouding zal plaatsvinden.

      2 In geval een schorsing als bedoeld in het eerste lid, langer duurt dan zes weken, kan het bevoegde gezag bepalen
      dat gedurende die verdere duur van die schorsing een verdere inhouding plaatsvindt tot het volle bedrag der
      bezoldiging. Bij de afweging omtrent de hoogte van de inhouding wordt de financiële positie van de ambtenaar in de
      beschouwing betrokken.

      3 Bij de ambtenaar die ingevolge
      [artikel 109, tweede lid, onderdeel c, van het Burgerlijk ambtenarenreglement defensie][ref3] is geschorst, vindt
      geen inhouding van bezoldiging plaats.

      4 De ingehouden bezoldiging kan alsnog geheel of gedeeltelijk aan
      de ambtenaar worden uitbetaald, indien een schorsing als bedoeld in
      [artikel 109, tweede lid, onderdeel a of b, van het Burgerlijk ambtenarenreglement defensie][ref4] niet wordt
      gevolgd door een veroordeling tot een onvoorwaardelijke vrijheidsstraf, een vrijheidsbenemende maatregel, ontslag
      op grond van [artikel 121, eerste lid, onderdeel e, van het Burgerlijk ambtenarenreglement defensie][ref5] of een
      onvoorwaardelijk ontslag bij wijze van straf. Op de aldus uit te keren bezoldiging worden in mindering gebracht
      de inkomsten, welke de ambtenaar sedert de schorsing heeft genoten uit arbeid, die hij als gevolg van de schorsing
      heeft kunnen verrichten, tenzij zulks, naar het oordeel van het bevoegde gezag, onredelijk of onbillijk is.

      5 In geval van schorsing tijdens ziekte van de ambtenaar wordt onder bezoldiging verstaan, hetgeen daaronder wordt
      verstaan voor de toepassing van het [hoofdstuk 6 van het Burgerlijk ambtenarenreglement defensie][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel109
