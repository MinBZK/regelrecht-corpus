  - number: 29a
    text: |-
      1 Voor de ambtenaar die op 30 juni 2003 aanspraak heeft op een toelage op grond van de
      [Toelageregeling afschaffing tariefbeloning Defensie][ref1], wordt die aanspraak met ingang van 1 juli 2003 omgezet
      in een vervangingstoelage.

      2 Het bedrag van de vervangingstoelage is op 1 juli 2003 gelijk aan het bedrag van de toelage waarop de ambtenaar
      op 30 juni 2003 aanspraak heeft op grond van de [Toelageregeling afschaffing tariefbeloning Defensie][ref2].

      3 Voor zover de toelage op grond van de [Toelageregeling afschaffing tariefbeloning Defensie][ref3] op 30 juni
      2003 deel uitmaakt van de bezoldiging onderscheidenlijk de grondslag voor de vakantie-uitkering onderscheidenlijk
      het pensioengevend inkomen, maakt de vervangingstoelage vanaf 1 juli 2003 op overeenkomstige wijze deel uit van de
      bezoldiging onderscheidenlijk de grondslag voor de vakantie-uitkering onderscheidenlijk het pensioengevend inkomen.

      4 Voor zover de toelage op grond van de [Toelageregeling afschaffing tariefbeloning Defensie][ref4] vóór 30 juni
      2003 wordt aangepast met het percentage van een algemene salarismaatregel, wordt de vervangingstoelage vanaf 1 juli
      2003 op overeenkomstige wijze aangepast met het percentage van een algemene salarismaatregel.


