    text: |-
      1 Het salaris, de toelagen en de vergoedingen voor extra diensten worden maandelijks betaald.

      2 Wanneer het salaris, een toelage als bedoeld in de [artikelen 12a][ref1], [13][ref2], [14][ref3], [17][ref4],
      [18][ref5], [19][ref6] en [20][ref7] of een bedrag, genoemd in [artikel 22, tweede lid][ref8], moet worden berekend
      over een gedeelte van een kalendermaand, wordt het bedrag per dag vastgesteld door een maandbedrag te delen door
      het aantal dagen van de desbetreffende kalendermaand.

      3 Van het bepaalde in het eerste en tweede lid kan worden afgeweken, ingeval daartoe naar het oordeel van het tot
      het vaststellen van het salaris bevoegde gezag op grond van bijzondere omstandigheden aanleiding bestaat.


