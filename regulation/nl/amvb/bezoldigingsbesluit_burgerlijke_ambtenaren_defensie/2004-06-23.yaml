    text: |-
      1 De ambtenaar heeft recht op een vakantie-uitkering ten bedrage van 8% van de door hem genoten bezoldiging.

      2 Voor de ambtenaar die 22 jaar of ouder is bedraagt de vakantie-uitkering tenminste € 137,12 per maand met dien
      verstande dat dit bedrag bij een onvolledige werktijd of bij genot van slechts een gedeelte van de bezoldiging, op
      andere gronden dan vermeld in het vierde lid, naar evenredigheid wordt verminderd.

      3 Voor de ambtenaar die jonger is dan 22 jaar bedraagt de vakantie-uitkering ten minste het in het tweede lid
      genoemde bedrag verminderd met 10% voor elk leeftijdsjaar of gedeelte van een leeftijdsjaar dat hij jonger is dan
      22 jaar, met een maximumaftrek van 30%, met dien verstande dat het bedrag waarop hij alsdan aanspraak heeft bij een
      onvolledige werktijd of bij genot van slechts een gedeelte van de bezoldiging, op andere gronden dan vermeld in het
      vierde lid, naar evenredigheid wordt verminderd.

      4 Wanneer de ambtenaar op grond van de [artikelen 22 tot en met 29][ref1] of van
      [artikel 59 van het Burgerlijk ambtenarenreglement defensie][ref2] of op grond van bepalingen van dezelfde
      strekking in een soortgelijke regeling slechts een gedeelte van zijn bezoldiging geniet, wordt hij voor de
      toepassing van het eerste lid geacht in het genot van zijn volle bezoldiging te zijn, met dien verstande dat
      wanneer het feitelijke genot van de bezoldiging is teruggebracht tot het bedrag van het op de ambtenaar te verhalen
      gedeelte van de pensioenbijdrage, hij voor toepassing van het eerste lid wordt geacht geen bezoldiging te genieten.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0006040#Artikel59
