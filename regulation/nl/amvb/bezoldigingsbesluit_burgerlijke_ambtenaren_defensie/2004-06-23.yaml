  - number: 3b
    text: |-
      Voor de berekening van het pensioen gevend inkomen worden aanspraken op grond van dit besluit of op grond van
      andere regelingen inzake beloningen van de ambtenaar, vermenigvuldigd met een factor 1/1,019 met inachtneming van
      een maximale vermindering van het pensioen gevend inkomen van € 65,92.
    url: https://wetten.overheid.nl/BWBR0006038/2004-06-23#Artikel3b
  - number: '5'
    text: |-
      1 Voor de ambtenaar geldt een salarisschaal.

      2 De salarisschaal welke voor de ambtenaar geldt wordt, tenzij zijn wijze van functioneren zich nog daartegen
      verzet, bepaald met inachtneming van de zwaarte van zijn functie en van bijzondere regelingen, als bedoeld in
      [artikel 18 van het Burgerlijk ambtenarenreglement defensie][ref1] of in bepalingen van dezelfde strekking in een
      soortgelijke regeling.

      3 De zwaarte van de functie wordt bepaald binnen de in de [bijlage B][ref2] van dit besluit aangegeven
      indelingsstructuur, met inachtneming van het door Onze Minister vastgestelde normeringsstelsel.

      4 Indien de ambtenaar bij wijze van waarneming tijdelijk een andere functie uitoefent, blijft de voordien voor hem
      geldende salarisschaal van toepassing.

      5 Anders dan bij wijze van disciplinaire straf als bedoeld in het [Burgerlijk ambtenarenreglement defensie][ref3]
      of in een soortgelijke regeling kan zonder voorafgaand ontslag voor een ambtenaar geen salarisschaal gaan gelden
      met een lager maximumsalaris dan dat van de reeds voor hem geldende salarisschaal.

      6 Het vorige lid is niet van toepassing indien:

      a. bij de bepaling van de salarisschaal, bedoeld in het tweede lid, tevens is bepaald dat de functie van de
      ambtenaar een tijdelijk karakter heeft en de salarisschaal in verband daarmee slechts tijdelijk zal gelden;

      b. de ambtenaar in verband met ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte wordt herplaatst in
      een andere functie.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0006038
      [ref3]: https://wetten.overheid.nl/BWBR0006040
