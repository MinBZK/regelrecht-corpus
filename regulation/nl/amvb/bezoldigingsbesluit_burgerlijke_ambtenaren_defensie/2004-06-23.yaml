  - number: '8'
    text: |-
      1 Het salaris van de ambtenaar wordt verhoogd tot het in de schaal naasthogere bedrag, indien hij naar het oordeel
      van het bevoegde gezag zijn functie naar behoren vervult.

      2 Het salaris van de ambtenaar kan worden verhoogd tot een in de schaal hoger vermeld bedrag, indien hij naar het
      oordeel van het bevoegde gezag zijn functie zeer goed of uitstekend verricht.

      3 Vervult de ambtenaar zijn functie naar het oordeel van het bevoegde gezag niet naar behoren, dan blijft
      salarisverhoging achterwege.

      4 De in het eerste en tweede lid bedoelde salarisverhoging wordt toegekend:

      a. wanneer de ambtenaar 22 jaar of ouder is en het maximumsalaris van de voor hem geldende salarisschaal nog niet
      heeft bereikt, voor de eerste maal met ingang van de eerste dag van de maand, waarin sinds zijn aanstelling een
      jaar is verstreken en nadien telkens na één jaar;

      b. wanneer de ambtenaar jonger dan 22 jaar is, met ingang van de eerste dag van de maand, waarop zijn verjaardag
      valt.

      5 Het tijdstip waarop ingevolge het vierde lid, onder *a*, een salarisverhoging wordt toegekend kan worden
      vervroegd indien daartoe naar het oordeel van het bevoegde gezag aanleiding bestaat.

      6 Indien de in het vierde lid, onder *a*, bedoelde ambtenaar reeds voor zijn 22e verjaardag was aangesteld, wordt,
      onverlet het in het vijfde lid bepaalde, de salarisverhoging toegekend met ingang van de eerste dag van de maand
      waarin zijn verjaardag valt.
    url: https://wetten.overheid.nl/BWBR0006038/2004-06-23#Artikel8
  - number: '9'
    text: |-
      1 Het salaris van de ambtenaar met een onvolledige werktijd wordt vastgesteld op een evenredig deel van het salaris
      bij een volledige werktijd.

      2 Het salaris van de ambtenaar die is aangesteld op grond van artikel 7, tweede lid, onder *f*.,
      van het [Burgerlijk ambtenarenreglement defensie][ref1], wordt, met inachtneming van het bepaalde in
      [artikel 5, tweede lid][ref2], vastgesteld op een bedrag per uur dat daadwerkelijk dienst wordt verricht.

      3 Een teruggebrachte werktijd als bedoeld in [artikel 30c van het Burgerlijk ambtenarenreglement defensie][ref3] of
      een daarmee overeenkomende bepaling in een ander rechtspositiereglement is geen onvolledige werktijd in de zin van
      het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006040
      [ref2]: https://wetten.overheid.nl/BWBR0006038#Artikel5
