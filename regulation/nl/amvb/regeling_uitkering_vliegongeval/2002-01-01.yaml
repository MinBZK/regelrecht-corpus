$id: regeling_uitkering_vliegongeval
regulatory_layer: AMVB
publication_date: '2017-04-11'
valid_from: '2002-01-01'
bwb_id: BWBR0002355
url: https://wetten.overheid.nl/BWBR0002355/2002-01-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onze Minister van Defensie van 13 maart 1961, Directie Militair Personeel, Afdeling Pensioenen
    en Wachtgelden, nr. P. 109.826/1-B;

    De Raad van State gehoord (advies van 24 mei 1961, no. 11);

    Gezien het nader rapport van Onze voornoemde Minister van 15 juni 1961, Directie Militair Personeel, Afd.
    Pensioenen en Wachtgelden, nr. P. 109.826/1-F;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002355/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Aan de nagelaten betrekkingen van degene die als militair, krachtens een door of namens de Minister van Defensie
      verstrekte opdracht, anders dan als passagier, dienst aan boord van een vliegtuig verrichtte voor de Koninklijke
      marine, de Koninklijke landmacht of de Koninklijke luchtmacht en die ten gevolge van een vliegongeval met dat
      vliegtuig tijdens het verrichten van die dienst is overleden, wordt gezamenlijk een uitkering ineens verleend.
    url: https://wetten.overheid.nl/BWBR0002355/2002-01-01#Artikel1
  - number: '3'
    text: |-
      Aan degene, die als militair, krachtens een door of namens de Minister van Defensie verstrekte opdracht, anders dan
      als passagier, dienst aan boord van een vliegtuig verrichtte voor de Koninklijke marine, de Koninklijke landmacht
      of de Koninklijke luchtmacht en die ten gevolge van een vliegongeval met dat vliegtuig tijdens het verrichten van
      die dienst blijvend invalide is geworden, wordt een uitkering ineens verleend.
    url: https://wetten.overheid.nl/BWBR0002355/2002-01-01#Artikel3
  - number: '5.1'
    text: |-
      Onder dienst aan boord van een vliegtuig in de zin van de [artikelen 1][ref1] en [3][ref2] wordt verstaan het, na
      het tijdstip van in werking treden dezer regeling, waar ook ter wereld, tijdens een vlucht dienst doen aan boord
      van een vliegtuig.


      [ref1]: https://wetten.overheid.nl/BWBR0002355#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002355#Artikel3
    url: https://wetten.overheid.nl/BWBR0002355/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002355
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002355
        artikel: '3'
  - number: '5.2'
    text: |-
      De vlucht, bedoeld in het vorige lid en in [artikel 6][ref1], wordt geacht:


      [ref1]: https://wetten.overheid.nl/BWBR0002355#Artikel6
    url: https://wetten.overheid.nl/BWBR0002355/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002355
        artikel: '6'
  - number: 5.2.a
    text: |-
      aan te vangen op het ogenblik, waarop de betrokkene, met het doel om te vliegen zich begeeft naar het vliegtuig
      en dit zo dicht is genaderd, dat hem ten gevolge van een gebeuren met dat vliegtuig, een vliegongeval zou kunnen
      overkomen;
    url: https://wetten.overheid.nl/BWBR0002355/2002-01-01#Artikel5
  - number: 5.2.b
    text: |-
      te eindigen onmiddellijk na het ogenblik, waarop de betrokkene, na het verlaten van het vliegtuig op het
      aardoppervlak teruggekeerd, redelijkerwijze kan worden geacht zich in veiligheid te bevinden.
    url: https://wetten.overheid.nl/BWBR0002355/2002-01-01#Artikel5
  - number: '6'
    text: |-
      Onder vliegongeval in de zin van deze regeling wordt verstaan een tijdens de vlucht rechtstreeks met het vliegtuig
      in verband staande plotselinge inwerking van uitwendig geweld op het lichaam, waaronder begrepen verstikking, het
      onvrijwillig inademen van vergiftigende gassen en dampen, verdrinking, uitputting en de gevolgen van rechtmatige
      verdediging, alsmede zodanige andere feiten als de Minister van Defensie in voorkomende gevallen daaronder begrepen
      oordeelt.
    url: https://wetten.overheid.nl/BWBR0002355/2002-01-01#Artikel6
  - number: '7.1'
    text: |-
      Onder nagelaten betrekkingen in de zin van [artikel 1][ref1] worden voor een gehuwde verstaan de weduwe of
      weduwnaar en de minderjarige kinderen en pleegkinderen en worden voor een ongehuwde verstaan de minderjarige
      kinderen en pleegkinderen, alsmede, indien de overledene een regelmatige bijdrage leverde in hun noodzakelijk
      levensonderhoud, de meerderjarige kinderen en pleegkinderen, ouders, grootouders en schoonouders.


      [ref1]: https://wetten.overheid.nl/BWBR0002355#Artikel1
    url: https://wetten.overheid.nl/BWBR0002355/2002-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002355
        artikel: '1'
  - number: '7.2'
    text: |-
      Indien de overledene een weduwe of weduwnaar, minderjarige kinderen dan wel minderjarige pleegkinderen heeft
      nagelaten, worden uitsluitend zij als nagelaten betrekkingen aangemerkt.
    url: https://wetten.overheid.nl/BWBR0002355/2002-01-01#Artikel7
  - number: '8.1'
    text: |-
      Met inachtneming van [artikel 1, derde en vierde lid van het Algemeen militair ambtenarenreglement][ref1] wordt in
      dit besluit onder nagelaten betrekking in de zin van [artikel 1][ref2] mede verstaan:


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002355#Artikel1
    url: https://wetten.overheid.nl/BWBR0002355/2002-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003482
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002355
        artikel: '1'
  - number: 8.1.1°
    text: de achtergebleven geregistreerde partner;
    url: https://wetten.overheid.nl/BWBR0002355/2002-01-01#Artikel8
  - number: 8.1.2°
    text: |-
      de achtergebleven partner die door de militair als partner is aangemeld bij de Stichting Pensioenfonds ABP en door
      het bestuur van dat fonds als zodanig is aangemerkt.
    url: https://wetten.overheid.nl/BWBR0002355/2002-01-01#Artikel8
  - number: '8.2'
    text: |-
      Onder nagelaten betrekkingen in de zin van [artikel 1][ref1] worden voorts mede verstaan zij, voor wie de
      getroffene, naar het oordeel van de Minister van Defensie, als kostwinner was aan te merken.


      [ref1]: https://wetten.overheid.nl/BWBR0002355#Artikel1
    url: https://wetten.overheid.nl/BWBR0002355/2002-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002355
        artikel: '1'
  - number: '9'
    text: |-
      De uitkering ineens, bedoeld in [artikel 1][ref1], bedraagt indien de overledene:


      [ref1]: https://wetten.overheid.nl/BWBR0002355#Artikel1
    url: https://wetten.overheid.nl/BWBR0002355/2002-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002355
        artikel: '1'
  - number: 9.1e
    text: |-
      in het genot was van een vliegtoelage bedoeld in de artikelen 2 en 3 van de Regeling vliegtoelagen zeemacht
      1986 dan wel de artikelen 47 of 48 van de Regeling inkomsten militairen land- en luchtmacht 1969, dan wel de
      ministeriële regeling ter uitvoering van [artikel 16, eerste lid, onder ][ref1] voor zover die regeling de
      (garantie)vliegtoelage betreft


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel16
    url: https://wetten.overheid.nl/BWBR0002355/2002-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: '16'
  - number: 9.2e
    text: gehuwd was, dan wel ongehuwd was en minderjarige kinderen en pleegkinderen heeft nagelaten;
    url: https://wetten.overheid.nl/BWBR0002355/2002-01-01#Artikel9
  - number: 9.3e
    text: militair was met een stand of rang
    url: https://wetten.overheid.nl/BWBR0002355/2002-01-01#Artikel9
  - number: 9.3e.a
    text: beneden die van luitenant ter zee der 3e klasse, dan wel die van tweede luitenant, € 10 000;
    url: https://wetten.overheid.nl/BWBR0002355/2002-01-01#Artikel9
  - number: 9.3e.b
    text: |-
      van luitenant ter zee der 3e klasse dan wel van tweede-luitenant of hoger, doch beneden die van luitenant ter zee
      der 1e klasse dan wel die van majoor, € 15 000;
    url: https://wetten.overheid.nl/BWBR0002355/2002-01-01#Artikel9
  - number: 9.3e.c
    text: van luitenant ter zee der 1e klasse dan wel van majoor of hoger, € 20 000.
    url: https://wetten.overheid.nl/BWBR0002355/2002-01-01#Artikel9
  - number: '10'
    text: |-
      De uitkering ineens, bedoeld in [artikel 1][ref1], bedraagt indien de overledene:


      [ref1]: https://wetten.overheid.nl/BWBR0002355#Artikel1
    url: https://wetten.overheid.nl/BWBR0002355/2002-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002355
        artikel: '1'
  - number: 10.1e
    text: |-
      niet in het genot was van een vliegtoelage bedoeld in de artikelen 2 en 3 van de Regeling vliegtoelagen zeemacht
      1986 dan wel de artikelen 47 of 48 van de Regeling inkomsten militairen land- en luchtmacht 1969, dan wel de
      ministeriële regeling ter uitvoering van [artikel 16, eerste lid, onder ][ref1] voor zover die regeling de
      (garantie)vliegtoelage betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0007816#Artikel16
    url: https://wetten.overheid.nl/BWBR0002355/2002-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007816
        artikel: '16'
  - number: 10.2e
    text: gehuwd was, dan wel ongehuwd was en minderjarige kinderen en pleegkinderen heeft nagelaten;
    url: https://wetten.overheid.nl/BWBR0002355/2002-01-01#Artikel10
  - number: 10.3e
    text: militair was met een stand of rang
    url: https://wetten.overheid.nl/BWBR0002355/2002-01-01#Artikel10
  - number: 10.3e.a
    text: beneden die van luitenant ter zee der 3e klasse dan wel die van tweede-luitenant, € 25 000;
    url: https://wetten.overheid.nl/BWBR0002355/2002-01-01#Artikel10
  - number: 10.3e.b
    text: |-
      van luitenant ter zee der 3e klasse dan wel van tweede-luitenant of hoger, doch beneden die van luitenant ter zee
      der 1e klasse dan wel die van majoor, € 37 500;
    url: https://wetten.overheid.nl/BWBR0002355/2002-01-01#Artikel10
  - number: 10.3e.c
    text: van luitenant ter zee der 1e klasse dan wel van majoor of hoger, € 50 000.
    url: https://wetten.overheid.nl/BWBR0002355/2002-01-01#Artikel10
  - number: '11'
    text: |-
      Behoudens het bepaalde in [artikel 12][ref1], bedraagt de uitkering ineens indien de overledene:


      [ref1]: https://wetten.overheid.nl/BWBR0002355#Artikel12
    url: https://wetten.overheid.nl/BWBR0002355/2002-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002355
        artikel: '12'
  - number: 11.1e
    text: |-
      ongehuwd was en meerderjarige kinderen en pleegkinderen, ouders, grootouders en schoonouders heeft nagelaten, die
      worden aangemerkt als nagelaten betrekkingen in de zin van [artikel 7, eerste lid][ref1], dan wel indien betrokkene
      voor andere nagelaten betrekkingen krachtens [artikel 8][ref2] wordt aangemerkt als kostwinner;


      [ref1]: https://wetten.overheid.nl/BWBR0002355#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002355#Artikel8
    url: https://wetten.overheid.nl/BWBR0002355/2002-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002355
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0002355
        artikel: '8'
  - number: 11.2e
    text: militair was met een stand of rang
    url: https://wetten.overheid.nl/BWBR0002355/2002-01-01#Artikel11
  - number: 11.2e.a
    text: beneden die van luitenant ter zee der 3e klasse dan wel die van tweede-luitenant, € 25 000;
    url: https://wetten.overheid.nl/BWBR0002355/2002-01-01#Artikel11
  - number: 11.2e.b
    text: |-
      van luitenant ter zee der 3e klasse dan wel tweede-luitenant of hoger, doch beneden die van luitenant ter zee der
      1e klasse dan wel die van majoor, € 37 500;
    url: https://wetten.overheid.nl/BWBR0002355/2002-01-01#Artikel11
  - number: 11.2e.c
    text: van luitenant ter zee der 1e klasse dan wel van majoor of hoger, € 50 000;
    url: https://wetten.overheid.nl/BWBR0002355/2002-01-01#Artikel11
  - number: '12.1'
    text: |-
      Indien de som van de uitkeringen, toekomende aan de nagelaten betrekkingen, bedoeld in [artikel 11][ref1], zou
      overschrijden het bedrag bedoeld in dat artikel, ondergaat elke uitkering een evenredige vermindering.


      [ref1]: https://wetten.overheid.nl/BWBR0002355#Artikel11
    url: https://wetten.overheid.nl/BWBR0002355/2002-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002355
        artikel: '11'
  - number: '12.2'
    text: |-
      De toekenning van een uitkering ineens terzake van blijvende invaliditeit doet de aanspraak op een uitkering
      terzake van overlijden te niet gaan, tenzij het overlijden plaats vindt binnen twee jaar na het tijdstip, waarop
      het vliegongeval plaats vond, in welk geval het bedrag van de uitkering of de som der uitkeringen toekomende aan de
      nagelaten betrekkingen wordt verminderd met het bedrag der verleende uitkering.
    url: https://wetten.overheid.nl/BWBR0002355/2002-01-01#Artikel12
  - number: '13'
    text: |-
      De uitkering ineens, bedoeld in [artikel 3][ref1], is ingeval van blijvende algehele invaliditeit gelijk aan de in
      overeenkomstige gevallen bij overlijden uit te keren bedragen, genoemd in de [artikelen 9][ref2] en [10][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002355#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002355#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0002355#Artikel10
    url: https://wetten.overheid.nl/BWBR0002355/2002-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002355
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002355
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0002355
        artikel: '10'
  - number: '14'
    text: |-
      De uitkering ineens, bedoeld in [artikel 3][ref1], is in het geval van blijvende gedeeltelijke invaliditeit
      gelijk aan dat gedeelte van de in overeenkomstige gevallen bij overlijden uit te keren bedragen, genoemd in de
      [artikelen 9][ref2] en [10][ref3], als wordt uitgedrukt door het percentage van die invaliditeit. Het percentage
      wordt zo spoedig mogelijk, doch uiterlijk twee jaar na het tijdstip, waarop het vliegongeval plaats vond,
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002355#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002355#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0002355#Artikel10
    url: https://wetten.overheid.nl/BWBR0002355/2002-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002355
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002355
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0002355
        artikel: '10'
  - number: '15'
    text: Deze regeling is niet van kracht ten aanzien van vliegongevallen als gevolg van feitelijke oorlogsomstandigheden.
    url: https://wetten.overheid.nl/BWBR0002355/2002-01-01#Artikel15
  - number: '16'
    text: Dit besluit kan worden aangehaald als "Regeling uitkering vliegongeval".
    url: https://wetten.overheid.nl/BWBR0002355/2002-01-01#Artikel16
