  - number: '27'
    text: >-
      1 Het hoofd van de diensteenheid stelt de medezeggenschapscommissie in de gelegenheid binnen een redelijke termijn
      advies uit te brengen over een voorgenomen maatregel met betrekking tot:


      a. de wijze waarop de arbeids- en dienstvoorwaarden bij de diensteenheid worden toegepast;


      b. de wijze waarop het algemeen personeelsbeleid bij de diensteenheid wordt uitgevoerd;


      c. aangelegenheden op het gebied van de veiligheid, de gezondheid en het welzijn in verband met de arbeid bij de
      diensteenheid;


      d. aangelegenheden met betrekking tot het woon- en leefklimaat bij de diensteenheid;


      e. de organisatie en werkwijze binnen de diensteenheid;


      f. de technische en economische dienstuitvoering bij de diensteenheid.


      2 De medezeggenschapscommissie kan geen advies uitbrengen over:


      a. voorgenomen maatregelen voor zover die strekken tot het verzekeren van de personele vulling, de beschikbaarheid,
      de inzetbaarheid en het ongestoorde functioneren van de krijgsmacht;


      b. aangelegenheden waarvan de behandeling is voorbehouden aan het overleg met een commissie van georganiseerd
      overleg, behoudens voor zover het de gevolgen daarvan betreft voor de werkzaamheden van de bij de diensteenheid
      werkzame werknemers.


      3 Het advies wordt op een zodanig tijdstip gevraagd dat het van wezenlijke invloed kan zijn op de voorgenomen
      maatregel. Daarbij worden de beweegredenen voor de maatregel en de te verwachten gevolgen aangegeven.


      4 Voor de commissie advies uitbrengt over een voorgenomen maatregel moet de betrokken aangelegenheid ten minste
      eenmaal in een overlegvergadering zijn behandeld.


      5 Bij het overleg over een voorgenomen maatregel als bedoeld in het eerste lid, is, als de maatregel
      uitsluitend gevolgen kan hebben voor militaire ambtenaren of voor ambtenaren, de opvatting van de leden van de
      medezeggenschapscommissie die tot de desbetreffende categorie personeel behoren, bepalend voor het uit te brengen
      advies.
    url: https://wetten.overheid.nl/BWBR0010617/1999-08-27#Artikel27
  - number: '28'
    text: >-
      1 Het hoofd van de diensteenheid kan een beslissing nemen over voorgenomen maatregelen voordat daarover het
      overleg is voltooid of daarover door de medezeggenschapscommissie is geadviseerd, als de taakuitvoering van de
      diensteenheid of de bijzondere situatie waarin de diensteenheid verkeert dit dringend noodzakelijk maakt. Het hoofd
      van de diensteenheid maakt zo snel mogelijk de redenen voor zijn beslissing bekend.


      2 Bij deze beslissing kan de medezeggenschapscommissie achteraf van haar bevoegdheden gebruik maken.
    url: https://wetten.overheid.nl/BWBR0010617/1999-08-27#Artikel28
  - number: '29'
    text: |-
      1 Als het hoofd van de diensteenheid bevoegd is de in [artikel 27, eerste lid][ref1], genoemde maatregel te
      treffen, deelt hij de medezeggenschapscommissie binnen vier weken nadat de commissie het advies heeft uitgebracht
      schriftelijk en gemotiveerd mee of hij zich met het advies kan verenigen.

      2 Als het hoofd van de diensteenheid niet bevoegd is de in [artikel 27, eerste lid][ref2], genoemde maatregel te
      treffen, zendt hij het advies van de medezeggenschapscommissie zo spoedig mogelijk aan het bevoegde gezag. Binnen
      zes weken nadat het advies door de commissie is uitgebracht, deelt het hoofd van de diensteenheid schriftelijk en
      gemotiveerd mee of het bevoegde gezag zich met het advies kan verenigen.

      3 Binnen vier weken nadat het hoofd van de diensteenheid heeft meegedeeld dat hij of het bevoegd gezag zich niet
      met het advies van de medezeggenschapscommissie kan verenigen, vindt tussen het hoofd van de diensteenheid en de
      medezeggenschapscommissie hernieuwd overleg plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0010617#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0010617#Artikel27
    url: https://wetten.overheid.nl/BWBR0010617/1999-08-27#Artikel29
