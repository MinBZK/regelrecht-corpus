  - number: '38'
    text: |-
      1 Uiterlijk een jaar na inwerkingtreding van dit besluit dient voor diensteenheden waarvoor krachtens dit besluit
      een verplichting tot het instellen van een medezeggenschapscommissie ontstaat, een medezeggenschapscommissie
      te zijn ingesteld. De bestaande dienstcommissies en onderdeelsoverlegorganen houden op te bestaan op de datum
      waarop door Onze Minister voor de diensteenheid of mede voor de diensteenheid waarvoor een dienstcommissie of
      een onderdeeloverlegorgaan is ingesteld, een medezeggenschapscommissie is ingesteld, doch uiterlijk een jaar na
      inwerkingtreding van dit besluit.

      2 Voor zover er bij diensteenheden nog dienstcommissies en onderdeelsoverlegorganen bestaan,
      blijft [hoofdstuk 11 van het Burgerlijk ambtenarenreglement defensie][ref1] onderscheidenlijk
      [artikel 127 Algemeen militair ambtenarenreglement][ref2] van kracht, tot uiterlijk een jaar na inwerkingtreding
      van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Hoofdstuk11
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Artikel127
