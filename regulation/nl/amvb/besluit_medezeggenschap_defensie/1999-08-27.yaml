  - number: '5'
    text: |-
      1 Onze Minister stelt na overleg met de betrokken commissie van georganiseerd overleg buitengewone
      gemeenschappelijke medezeggenschapscommissies in voor het overleg over een reorganisatie waarbij meerdere
      diensteenheden zijn betrokken.

      2 Onze Minister stelt na overleg met de betrokken commissie van georganiseerd overleg bij een groep van
      schepen, een groep van schepen in combinatie met de ondersteunende wal-organisatie, een inrichting der zeemacht,
      op een kazerne, op een vliegbasis, op een kantorencomplex of op een overeenkomstig complex, buitengewone
      gemeenschappelijke medezeggenschapscommissies in voor het overleg over aangelegenheden als bedoeld in
      [artikel 27, eerste lid][ref1], die betrekking hebben op personeel van verschillende diensteenheden dat op dezelfde
      locatie werkt of woont.

      3 [Artikel 4][ref2], met uitzondering van het eerste lid, is van overeenkomstige toepassing op de buitengewone
      gemeenschappelijke medezeggenschapscommissie.

      4 Gemeenschappelijke medezeggenschapscommissies zijn niet bevoegd ten aanzien van door buitengewone
      gemeenschappelijke medezeggenschapscommissies te behandelen onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0010617#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0010617#Artikel4
