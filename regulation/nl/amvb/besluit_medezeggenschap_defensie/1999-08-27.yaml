  - number: '31'
    text: |-
      1 Als over een voorgenomen maatregel als bedoeld in [artikel 27, eerste lid, onder a, b, c of d][ref1], naar
      aanleiding van het hernieuwd overleg niet alsnog overeenstemming wordt bereikt, legt het hoofd van de diensteenheid
      onverwijld het advies van de medezeggenschapscommissie en alle op de zaak betrekking hebbende stukken voor aan het
      college voor geschillen.

      2 Als over een voorgenomen maatregel als bedoeld in [artikel 27, eerste lid, onder e en f][ref2], naar aanleiding
      van het hernieuwd overleg niet alsnog overeenstemming wordt bereikt, legt het hoofd van de diensteenheid onverwijld
      het advies van de medezeggenschapscommissie en alle op de zaak betrekking hebbende stukken voor aan de bevelhebber.

      3 Tenzij de bevelhebber met het advies van de medezeggenschapscommissie instemt, neemt hij geen beslissing over een
      geschil als bedoeld in het vorige lid voordat hij advies heeft ingewonnen van het college voor geschillen. Hij legt
      daartoe zo snel mogelijk het advies van de medezeggenschapscommissie en alle op de zaak betrekking hebbende stukken
      voor aan het college voor geschillen.

      4 De bevelhebber neemt binnen vier weken nadat hij advies van het college voor geschillen heeft ontvangen een
      beslissing.


      [ref1]: https://wetten.overheid.nl/BWBR0010617#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0010617#Artikel27
