  - number: '32'
    text: >-
      1 De medezeggenschapscommissie bevordert zo veel mogelijk het werkoverleg bij de diensteenheid.


      2 De medezeggenschapscommissie bevordert zoveel mogelijk de naleving van de voorschriften op het gebied van de
      arbeidsvoorwaarden en van de veiligheid, de gezondheid en het welzijn in verband met de arbeid van de bij de
      diensteenheid werkzame werknemers.


      3 De medezeggenschapscommissie waakt tegen discriminatie bij de diensteenheid, bevordert de gelijke behandeling van
      mannen en vrouwen bij de diensteenheid en bevordert de inschakeling van gehandicapte en allochtone werknemers bij
      de diensteenheid.
    url: https://wetten.overheid.nl/BWBR0010617/1999-08-27#Artikel32
  - number: '33'
    text: >-
      1 Er is een college voor geschillen dat bestaat uit drie leden en drie plaatsvervangend leden. Onze Minister
      benoemt de leden voor een periode van vier jaar. De leden worden door Onze Minister ontslagen. Eén lid en
      een plaatsvervangend lid worden op voordracht van de gezamenlijke bevelhebbers benoemd en één lid en een
      plaatsvervangend lid op voordracht van de centrales. Het derde lid, dat tevens voorzitter is, en plaatsvervangend
      lid worden benoemd door Onze Minister, gehoord de overige twee leden.


      2 De voorzitter, de leden en de plaatsvervangend leden maken geen deel uit van het ministerie en zijn niet werkzaam
      onder de verantwoordelijkheid van Onze Minister.


      3 Het college voor geschillen regelt zijn werkwijze binnen het kader van de hem op grond van dit hoofdstuk
      opgedragen taak en brengt jaarlijks aan Onze Minister verslag uit van zijn werkzaamheden in het afgelopen
      kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0010617/1999-08-27#Artikel33
  - number: '34'
    text: >-
      1 Geschillen waarover het college voor geschillen op grond van dit besluit advies uitbrengt aan de bevelhebber,
      worden zo snel mogelijk aan het college voorgelegd.


      2 Het college voor geschillen kan een bemiddelingsvoorstel doen aan de bevelhebber.


      3 Als het college voor geschillen geen bemiddelingsvoorstel doet of als een bemiddelingsvoorstel geen instemming
      van de bij het geschil betrokken partijen krijgt, adviseert het college voor geschillen de bevelhebber over de
      vraag of het hoofd van de diensteenheid of het bevoegd gezag heeft gehandeld in strijd met dit besluit of met het
      reglement en of hij de bij de zaak betrokken belangen in redelijkheid heeft afgewogen.


      4 Het college voor geschillen kan alle inlichtingen en gegevens inwinnen die het college voor geschillen voor het
      opstellen van het advies nodig acht.


      5 Het college voor geschillen kan, al dan niet op verzoek, alle personen horen waarvan het college voor geschillen
      dat voor het opstellen van het advies nodig acht.


      6 Het college voor geschillen brengt binnen vier weken nadat het om advies is gevraagd, advies uit.
    url: https://wetten.overheid.nl/BWBR0010617/1999-08-27#Artikel34
  - number: '35'
    text: |-
      1 Als het hoofd van de diensteenheid en de medezeggenschapcommissie van mening verschillen over de interpretatie
      van dit besluit of van het reglement, legt het hoofd van de diensteenheid binnen vier weken nadat de commissie haar
      interpretatie schriftelijk aan hem heeft voorgelegd, dit geschil met toelichting van de wederzijdse standpunten
      voor aan de bevelhebber.

      2 De bevelhebber neemt geen beslissing inzake een geschil over de interpretatie van dit besluit of het reglement
      voordat hij advies van het college voor geschillen heeft ingewonnen.

      3 Als het hoofd van de diensteenheid tevens de bevelhebber is, vraagt hij binnen vier weken nadat de commissie haar
      interpretatie schriftelijk aan hem heeft voorgelegd advies aan het college voor geschillen.

      4 Een geschil op grond van dit artikel schorst niet de uitvoering van een maatregel ter zake waarvan een beroep is
      gedaan op [artikel 2][ref1], [artikel 22, tweede lid][ref2], [artikel 27, tweede lid][ref3], [artikel 28][ref4] of
      [artikel 30, tweede lid][ref5].


