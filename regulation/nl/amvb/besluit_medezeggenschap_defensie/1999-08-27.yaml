  - number: '2'
    text: |-
      Het bij of krachtens dit besluit bepaalde is niet van toepassing:

      a. tijdens buitengewone omstandigheden en in de gevallen, genoemd in
      [artikel 71 van het Wetboek van Militair Strafrecht][ref1];

      b. bij de uitoefening van bij of krachtens wet opgedragen taken voor zover de toepassing van dit besluit een goede
      taakuitoefening belemmert;

      c. in door Onze Minister te bepalen gevallen waarin onderdelen van de krijgsmacht worden ingezet;

      d. tijdens oefeningen;

      e. op werknemers die werkzaam zijn bij een niet of niet uitsluitend onder Nederlands gezag staand onderdeel van de
      krijgsmacht gevestigd in het buitenland;

      f. inzake aangelegenheden die rechtstreeks betrekking hebben op de omstandigheden, bedoeld onder a, b, c en d.


      [ref1]: https://wetten.overheid.nl/BWBR0001869#Artikel71
