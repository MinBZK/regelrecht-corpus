        artikel: '27'
        hoofdstuk: '5'
  - number: '30'
    text: |-
      1 Een voorgenomen maatregel als bedoeld in [artikel 27, eerste lid][ref1], wordt niet uitgevoerd als uit het
      advies van de medezeggenschapscommissie en uit de mededeling van het hoofd van de diensteenheid, bedoeld in
      [artikel 29, eerste of tweede lid][ref2], blijkt dat over de voorgenomen maatregel geen overeenstemming is bereikt.

      2 In het geval er geen overeenstemming wordt bereikt over een voorgenomen maatregel als bedoeld in
      [artikel 27, eerste lid, onder e of f][ref3], kan het hoofd van de diensteenheid, in afwachting van de beslissing
      van de bevelhebber in de geschillenprocedure, die maatregel toch uitvoeren als door het niet uitvoeren van de
      maatregel het functioneren van de diensteenheid ernstig wordt belemmerd. Het hoofd van de diensteenheid deelt zijn
      beslissing schriftelijk en gemotiveerd mee aan de medezeggenschapscommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0010617#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0010617#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0010617#Artikel27
