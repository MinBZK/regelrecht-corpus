  - number: '6'
    text: |-
      1 De medezeggenschapscommissie kan als dat voor de vervulling van haar taak noodzakelijk is werkgroepen instellen.
      Een werkgroep kan geen rechten of bevoegdheden van de medezeggenschapscommissie uitoefenen.

      2 De medezeggenschapscommissie legt haar voornemen om een werkgroep in te stellen schriftelijk voor aan het hoofd
      van de diensteenheid met vermelding van de taak, de samenstelling en de werkwijze van de in te stellen werkgroep.
      Bij bezwaar van het hoofd van de diensteenheid wordt binnen vier weken door de bevelhebber beslist nadat hij advies
      van het college voor geschillen heeft ontvangen.

      3 In een werkgroep kunnen naast leden van de medezeggenschapscommissie ook andere bij de diensteenheid werkzame
      werknemers zitting hebben. Het voorzitterschap berust bij een lid van de medezeggenschapscommissie.

      4 De leden van een werkgroep worden in de gelegenheid gesteld om tijdens de normale werktijd te vergaderen,
      tenzij naar het oordeel van het hoofd van de diensteenheid de belangen van de dienst zich daartegen redelijkerwijs
      verzetten.

      5 De leden van een werkgroep worden in de gelegenheid gesteld om gedurende ten hoogste drie dagen per jaar,
      in werktijd en met behoud van bezoldiging, scholing en vorming te ontvangen die gericht is op de taak van de
      werkgroep, tenzij naar het oordeel van het hoofd van de diensteenheid de belangen van de dienst zich daartegen
      redelijkerwijs verzetten.

      6 De door een lid van een werkgroep gemaakte noodzakelijke reis- en verblijfskosten voor het
      deelnemen aan vergaderingen en scholings- en vormingsactiviteiten worden vergoed overeenkomstig het
      [Besluit dienstreizen defensiepersoneel][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007956
    url: https://wetten.overheid.nl/BWBR0010617/1999-08-27#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007956
  - number: '7'
    text: |-
      1 De leden van een medezeggenschapscommissie worden door de bij de diensteenheid werkzame werknemers uit hun midden
      gekozen. Werknemers zijn kiesgerechtigd als zij op het moment van de verkiezingen ten minste zes maanden bij het
      Ministerie van Defensie werkzaam zijn. Werknemers zijn verkiesbaar als zij op het moment van de verkiezingen ten
      minste een jaar bij het Ministerie van Defensie werkzaam zijn.

      2 Het aantal leden van de medezeggenschapscommissie bedraagt bij een diensteenheid:

      a. met minder dan 100 werknemers ten minste 3 en ten hoogste 7 leden;

      b. met 100 tot 500 werknemers ten minste 5 en ten hoogste 11 leden;

      c. met 500 tot 2000 werknemers ten minste 9 en ten hoogste 13 leden;

      d. met 2000 of meer werknemers ten minste 13 en ten hoogste 19 leden.

      3 In het reglement, bedoeld in [artikel 14][ref1], wordt binnen de in het vorige lid genoemde grenzen het aantal
      leden van de medezeggenschapscommissie vastgesteld.

      4 Het hoofd van de diensteenheid en in voorkomend geval de door deze tot het voeren van overleg met
      de medezeggenschapscommissie bevoegd verklaarde functionaris, zijn niet verkiesbaar tot lid van de
      medezeggenschapscommissie.

      5 Tijdens de zittingsperiode van de medezeggenschapscommissie wordt het aantal leden van de commissie niet
      gewijzigd.

      6 Het aantal zetels van de medezeggenschapscommissie dat werknemers die in opleiding zijn bij een diensteenheid
      kunnen bekleden, bedraagt niet meer dan de helft van het totaal aantal zetels van die medezeggenschapscommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0010617#Artikel14
    url: https://wetten.overheid.nl/BWBR0010617/1999-08-27#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0010617
        artikel: '14'
        hoofdstuk: '3'
  - number: '8'
    text: >-
      1 De bevelhebber bepaalt na overleg met de betrokken commissie van georganiseerd overleg de verkiezingsdata.


      2 De leden van een medezeggenschapscommissie worden gekozen bij geheime schriftelijke stemming en door middel van
      stembiljetten waarop kandidatenlijsten zijn vermeld.


      3 Voor het uitbrengen van een geldige stem kan de werknemer slechts één stem uitbrengen op één van de op het
      stembiljet vermelde kandidaten.


      4 De werknemer kan zijn stem bij schriftelijke volmacht uitbrengen.


      5 Een werknemer kan gelijktijdig met het uitbrengen van zijn eigen stem voor ten hoogste twee andere
      kiesgerechtigden bij schriftelijke volmacht stemmen.
    url: https://wetten.overheid.nl/BWBR0010617/1999-08-27#Artikel8
  - number: '9'
    text: >-
      1 Een kandidatenlijst kan worden ingediend door:


      a. een centrale;


      b. een derde deel of meer van de bij de diensteenheid werkzame werknemers die geen lid zijn van een bij een
      centrale aangesloten vereniging van ambtenaren, met dien verstande dat met dertig handtekeningen kan worden
      volstaan.


      2 Een werknemer kan slechts op één kandidatenlijst plaatsnemen of door zijn handtekening één kandidatenlijst mee
      indienen.


      3 Een centrale kan een kandidatenlijst met burgerkandidaten en een kandidatenlijst met militaire kandidaten
      indienen.


      4 Centrales kunnen een gecombineerde kandidatenlijst indienen. Als een gecombineerde kandidatenlijst is ingediend,
      kunnen de betrokken centrales niet alsnog een afzonderlijke kandidatenlijst indienen.
    url: https://wetten.overheid.nl/BWBR0010617/1999-08-27#Artikel9
  - number: '10'
    text: >-
      1 De medezeggenschapscommissie kiest uit haar leden een voorzitter en een secretaris.


      2 De medezeggenschapscommissie maakt de namen en functies van haar leden bekend aan alle bij de diensteenheid
      werkzame werknemers en aan degenen die kandidatenlijsten hebben ingediend.
    url: https://wetten.overheid.nl/BWBR0010617/1999-08-27#Artikel10
  - number: '11'
    text: >-
      1 De leden van de medezeggenschapscommissie treden om de vier jaar gelijktijdig af.


      2 In afwijking van het eerste lid kan in het instellingsbesluit worden bepaald dat de leden van de
      medezeggenschapscommissie om de twee jaar gelijktijdig aftreden.


      3 Als een lid van de medezeggenschapscommissie niet meer werkzaam is bij de diensteenheid eindigt van rechtswege
      zijn lidmaatschap van de medezeggenschapscommissie.


      4 De leden van een medezeggenschapscommissie kunnen te allen tijde ontslag nemen.
    url: https://wetten.overheid.nl/BWBR0010617/1999-08-27#Artikel11
  - number: '12'
    text: >-
      1 Een vacature die ontstaat tijdens de zittingsduur van de medezeggenschapscommissie wordt vervuld door de
      eerstvolgende niet gekozen kandidaat van de lijst waarop het vertrekkende lid stond.


      2 Een tussentijdse vacature blijft onvervuld als op een kandidatenlijst geen kandidaten meer aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0010617/1999-08-27#Artikel12
  - number: '13'
    text: >-
      1 De bevelhebber kan op verzoek van het hoofd van de diensteenheid of van de medezeggenschapscommissie een lid
      van de commissie voor bepaalde tijd uitsluiten van deelname aan de werkzaamheden van de commissie. Het hoofd van
      de diensteenheid kan alleen om uitsluiting verzoeken als het gedrag van het lid het overleg ernstig belemmert. De
      medezeggenschapscommissie kan alleen om uitsluiting verzoeken als het gedrag van het lid de werkzaamheden van de
      commissie ernstig belemmert. Het lid wordt door de verzoeker vooraf in de gelegenheid gesteld zijn oordeel over het
      verzoek te geven.


      2 Op het verzoek wordt door de bevelhebber beslist binnen vier weken nadat advies van het college voor geschillen
      is ontvangen en het lid, het hoofd van de diensteenheid en de medezeggenschapscommissie in de gelegenheid zijn
      gesteld hun oordeel over dat advies te geven.


      3 Het lid kan zich door een raadsman laten bijstaan.
    url: https://wetten.overheid.nl/BWBR0010617/1999-08-27#Artikel13
  - number: '14'
    text: >-
      1 De medezeggenschapscommissie maakt een reglement waarin de onderwerpen worden geregeld die bij of krachtens dit
      besluit ter regeling aan de medezeggenschapscommissie zijn opgedragen of overgelaten. In het reglement worden in
      ieder geval de werkwijze van de medezeggenschapscommissie en de gang van zaken bij verkiezingen geregeld. In de
      periode dat nog geen reglement van kracht is, geldt een door Onze Minister vastgesteld voorbeeldreglement.


      2 Het reglement of een wijziging daarvan bevat geen bepalingen die in strijd zijn met dit besluit of die een goede
      toepassing van dit besluit in de weg staan.


      3 Voordat de medezeggenschapscommissie het reglement of een wijziging daarvan vaststelt, wordt het hoofd van de
      diensteenheid in de gelegenheid gesteld zijn standpunt daarover kenbaar te maken.


      4 Nadat de medezeggenschapscommissie het reglement of een wijziging daarvan heeft vastgesteld, wordt het reglement
      ter kennisgeving voorgelegd aan het hoofd van de diensteenheid en aan de bevelhebber.
    url: https://wetten.overheid.nl/BWBR0010617/1999-08-27#Artikel14
  - number: '15'
    text: >-
      1 De medezeggenschapscommissie kan voor de behandeling van een bepaald onderwerp één of meer deskundigen uitnodigen
      een vergadering bij te wonen.


      2 De medezeggenschapscommissie stelt aan de uitgenodigde deskundige tijdig de agenda van de vergadering en
      benodigde stukken ter hand.


      3 Een deskundige kan worden uitgenodigd schriftelijk advies uit te brengen.


      4 De medezeggenschapscommissie vraagt vooraf toestemming aan het hoofd van de diensteenheid als aan het uitnodigen
      van een deskundige kosten zijn verbonden. Bij bezwaar van het hoofd van de diensteenheid wordt door de bevelhebber
      beslist binnen vier weken nadat advies van het college voor geschillen is ontvangen.
    url: https://wetten.overheid.nl/BWBR0010617/1999-08-27#Artikel15
  - number: '16'
    text: >-
      De medezeggenschapscommissie stelt aan het einde van ieder zittingsjaar een verslag van werkzaamheden op dat aan de
      bij de diensteenheid werkzame werknemers beschikbaar wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0010617/1999-08-27#Artikel16
  - number: '17'
    text: |-
      1 De medezeggenschapscommissie vergadert zoveel mogelijk tijdens normale werktijd.

      2 De leden van de medezeggenschapscommissie worden in de gelegenheid gesteld een door de commissie in
      overeenstemming met het hoofd van de diensteenheid te bepalen aantal uren per jaar te besteden aan activiteiten
      voor vergaderingen van de commissie. Voor de voorzitter en de secretaris bedraagt het aantal uren ten minste 100
      per jaar. Voor de overige leden bedraagt het aantal uren ten minste 60 per jaar.

      3 De leden van de medezeggenschapscommissie worden in de gelegenheid gesteld een door de commissie in
      overeenstemming met het hoofd van de diensteenheid te bepalen aantal dagen per jaar, in werktijd en met behoud van
      bezoldiging, scholing en vorming te ontvangen. Dit aantal dagen bedraagt ten hoogste 5 per jaar.

      4 De door een lid van de commissie gemaakte noodzakelijke reis- en verblijfskosten voor het deelnemen aan
      vergaderingen van de commissie, aan overlegvergaderingen en aan scholings- en vormingsactiviteiten worden vergoed
      overeenkomstig het [Besluit dienstreizen defensiepersoneel][ref1].

      5 Als de commissie en het hoofd van de diensteenheid niet tot overeenstemming komen over het aantal uren of dagen
      bedoeld in het tweede en derde lid, wordt door de bevelhebber beslist binnen vier weken nadat advies van het
      college voor geschillen is ontvangen.

      6 De secretaris van de commissie verstrekt ieder half jaar aan het hoofd van de diensteenheid een opgave van de
      scholings- en vormingsactiviteiten waar de leden van de medezeggenschapscommissie in het komende half jaar aan
      willen deelnemen. Bij bezwaar van het hoofd van de diensteenheid wordt door de bevelhebber beslist binnen vier
      weken nadat advies van het college voor geschillen is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0007956
    url: https://wetten.overheid.nl/BWBR0010617/1999-08-27#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0007956
  - number: '18'
    text: >-
      1 Het hoofd van de diensteenheid staat het gebruik toe van de voorzieningen waarover hij als zodanig beschikt en
      die de medezeggenschapscommissie voor de vervulling van zijn taak redelijkerwijs nodig heeft. Bij bezwaar van het
      hoofd van de diensteenheid tegen het gebruik van een bepaalde voorziening wordt door de bevelhebber beslist binnen
      vier weken nadat advies van het college voor geschillen is ontvangen.


      2 Het hoofd van de diensteenheid stelt de medezeggenschapscommissie in staat de bij de diensteenheid werkzame
      werknemers te raadplegen en stelt deze werknemers in de gelegenheid hieraan hun medewerking te verlenen, voor zover
      dat redelijkerwijs noodzakelijk is voor de vervulling van de taak van de medezeggenschapscommissie.
    url: https://wetten.overheid.nl/BWBR0010617/1999-08-27#Artikel18
  - number: '19'
    text: >-
      De medezeggenschapscommissie heeft voor het benaderen van een persoon voor raadpleging of beraad toestemming
      nodig van het hoofd van de diensteenheid als de persoon daarbij de beschikking zou krijgen over gegevens met een
      vertrouwelijk karakter. Als het hoofd van de diensteenheid toestemming verleent, wordt de betrokken persoon gewezen
      op de voor hem geldende geheimhoudingsverplichting. Bij bezwaar van het hoofd van de diensteenheid wordt door de
      bevelhebber beslist binnen vier weken nadat advies van het college voor geschillen is ingewonnen
    url: https://wetten.overheid.nl/BWBR0010617/1999-08-27#Artikel19
  - number: '20'
    text: >-
      Onze Minister draagt er zorg voor dat werknemers die op een kandidatenlijst staan of hebben gestaan, die lid zijn
      of lid zijn geweest van een medezeggenschapscommissie of van een werkgroep, of die op andere wijze betrokken zijn
      of betrokken zijn geweest bij medezeggenschap, niet uit hoofde van hun kandidaatstelling, hun lidmaatschap of hun
      betrokkenheid worden benadeeld in hun positie als werknemer.
    url: https://wetten.overheid.nl/BWBR0010617/1999-08-27#Artikel20
  - number: '21'
    text: >-
      1 Het hoofd van de diensteenheid of de door deze bevoegd verklaarde functionaris pleegt het overleg met de
      medezeggenschapscommissie in de overlegvergadering en is tevens voorzitter van deze vergadering.


      2 De voorzitter van de overlegvergadering kan zich tijdens de overlegvergaderingen laten bijstaan door één of meer
      daartoe aangewezen functionarissen.


      3 Het hoofd van de diensteenheid en de medezeggenschapscommissie kunnen voor de behandeling van een bepaald
      onderwerp één of meer deskundigen uitnodigen een vergadering bij te wonen.


      4 Het hoofd van de diensteenheid en de medezeggenschapscommissie komen voor overleg bijeen binnen twee weken nadat
      het hoofd van de diensteenheid of de commissie daarom onder opgave van redenen heeft verzocht.
    url: https://wetten.overheid.nl/BWBR0010617/1999-08-27#Artikel21
  - number: '22'
    text: >-
      1 In de overlegvergadering worden met uitzondering van individuele personeelszaken aangelegenheden aan de orde
      gesteld die de diensteenheid betreffen en waarvan het hoofd van de diensteenheid of de medezeggenschapscommissie
      behandeling wenselijk acht of waarover volgens dit besluit overleg moet plaatsvinden.


      2 De vaststelling van de taken van het ministerie en delen daarvan, het beleid ten aanzien van die taken en de
      uitvoering van die taken zijn geen onderwerp van overleg, behoudens voor zover het de gevolgen daarvan betreft voor
      de werkzaamheden van de werknemers.


      3 Ten minste tweemaal per jaar wordt in een overlegvergadering de algemene gang van zaken bij de diensteenheid
      besproken.
    url: https://wetten.overheid.nl/BWBR0010617/1999-08-27#Artikel22
  - number: '23'
    text: >-
      1 Het hoofd van de diensteenheid en de medezeggenschapscommissie maken gezamenlijk afspraken over de
      overlegvergadering. Deze afspraken hebben onder meer betrekking op:


      a. het aantal overlegvergaderingen per jaar, waarbij wordt uitgegaan van ten minste 4 vergaderingen;


      b. de wijze van bijeenroepen van overlegvergaderingen;


      c. de werkzaamheden en de vervulling van het secretariaat van de overlegvergadering;


      d. het opstellen van de agenda van de overlegvergadering en het bekendmaken daarvan aan de bij de diensteenheid
      werkzame werknemers;


      e. de verslaggeving van de overlegvergaderingen en de wijze waarop van het besprokene aan de bij de diensteenheid
      werkzame werknemers verslag wordt gedaan;


      f. het aantal deelnemers dat aanwezig moet zijn bij een overlegvergadering;


      g. het schorsen van de vergadering voor afzonderlijk beraad over een bepaald punt.


      2 Voor zover er in de overlegvergadering verschillende standpunten zijn ingenomen, moeten deze uit de
      verslaglegging van de vergadering duidelijk blijken.


      3 Als geen overeenstemming wordt bereikt over deze afspraken wordt door de bevelhebber beslist binnen vier weken
      nadat advies van het college voor geschillen is ontvangen.
    url: https://wetten.overheid.nl/BWBR0010617/1999-08-27#Artikel23
  - number: '24'
    text: >-
      De bevelhebber kan bepalen dat de verslagen van de overlegvergaderingen in afschrift naar hem of naar de door hem
      aan te wijzen functionarissen worden gezonden.
    url: https://wetten.overheid.nl/BWBR0010617/1999-08-27#Artikel24
  - number: '25'
    text: |-
      1 De medezeggenschapscommissie kan het hoofd van de diensteenheid schriftelijk voorstellen doen ten aanzien van
      de onderwerpen, bedoeld in [artikel 22, eerste lid][ref1], voor zover het hoofd van de diensteenheid bevoegd is
      daarover maatregelen te treffen.

      2 Het hoofd van de diensteenheid beslist over een voorstel als bedoeld in het eerste lid nadat daarover ten minste
      éénmaal overleg is gepleegd met de medezeggenschapscommissie. Na het overleg deelt het hoofd van de diensteenheid
      zo spoedig mogelijk schriftelijk en gemotiveerd aan de commissie mee of en in hoeverre hij overeenkomstig het
      voorstel zal beslissen.


      [ref1]: https://wetten.overheid.nl/BWBR0010617#Artikel22
    url: https://wetten.overheid.nl/BWBR0010617/1999-08-27#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0010617
        artikel: '22'
        hoofdstuk: '4'
  - number: '26'
    text: |-
      1 Het hoofd van de diensteenheid verstrekt, desgevraagd schriftelijk, tijdig alle inlichtingen en gegevens aan de
      medezeggenschapscommissie die zij voor het vervullen van haar taak redelijkerwijs nodig heeft. Bij bezwaar van het
      hoofd van de diensteenheid tegen het verstrekken van bepaalde inlichtingen en gegevens wordt binnen vier weken door
      de bevelhebber beslist nadat advies van het college voor geschillen is ingewonnen.

      2 Het hoofd van de diensteenheid verstrekt mede ten behoeve van het in [artikel 22, derde lid][ref1], bedoelde
      overleg ten minste tweemaal per jaar schriftelijk algemene gegevens over het functioneren van de diensteenheid in
      het verstreken tijdvak en het verwachte functioneren in het komende tijdvak. Het hoofd van de diensteenheid doet
      in dit kader mededeling over maatregelen die hij in voorbereiding heeft betreffende de aangelegenheden, bedoeld
      in [artikel 27, eerste lid][ref2]. Daarbij worden afspraken gemaakt over het tijdstip waarop en op welke wijze de
      medezeggenschapscommissie in de besluitvorming wordt betrokken.

      3 Het hoofd van de diensteenheid verstrekt bij het begin van de zittingsperiode van de medezeggenschapscommissie
      schriftelijk algemene gegevens over de organisatie van de diensteenheid, over de leiding van de diensteenheid en
      over de wijze van functioneren van de diensteenheid aan de medezeggenschapscommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0010617#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0010617#Artikel27
    url: https://wetten.overheid.nl/BWBR0010617/1999-08-27#Artikel26
