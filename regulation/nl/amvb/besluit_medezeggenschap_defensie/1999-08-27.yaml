  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van de Staatssecretaris van Defensie van 4 maart 1999, nr. P/99001296;


    Gelet op artikel 125, eerste lid, van de Ambtenarenwet en artikel 12 van de Militaire ambtenarenwet 1931;


    De Raad van State gehoord (advies van 21 mei 1999, nr. W07.99.001048);


    Gezien het nader rapport van de Staatssecretaris van Defensie van 7 juli 1999, nr. P/99003490;


    Hebben goed gevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0010617/1999-08-27#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:

      a. *Onze Minister:*

      Onze Minister van Defensie;

      b. *secretaris-generaal:*

      de secretaris-generaal van het Ministerie van Defensie;

      c. *werknemer:*

      de militaire ambtenaar, bedoeld in
      [artikel 1, eerste lid, onder c, van het Algemeen militair ambtenarenreglement][ref1], en de ambtenaar, bedoeld in
      [artikel 1 van het Burgerlijk ambtenarenreglement defensie][ref2];

      d. *krijgsmachtdeel:*

      de Koninklijke marine, de Koninklijke landmacht, de Koninklijke luchtmacht, de Koninklijke marechaussee, het
      defensie interservice commando en de centrale organisatie van het ministerie;

      e. *bevelhebber:*

      de bevelhebber der Zeestrijdkrachten, de bevelhebber der Landstrijdkrachten, de bevelhebber der
      Luchtstrijdkrachten, de commandant van het wapen der Koninklijke marechaussee, de commandant van het defensie
      interservice commando en, ten aanzien van de centrale organisatie van het ministerie, de secretaris-generaal;

      f. *diensteenheid:*

      een schip, een groep van vliegtuigen, een inrichting der zeemacht, een bataljon of eenheid van overeenkomstig
      niveau, een eenheid of groep eenheden bij het korps mariniers ter grootte van een bataljon of van een
      overeenkomstig niveau, een vliegbasis of een overeenkomstig onderdeel, een district of een eenheid van een
      overeenkomstig niveau dan wel een met een eigen taak bedeeld administratief of organisatorisch zelfstandig
      onderdeel van het Ministerie van Defensie;

      g. *commissie van georganiseerd overleg:*

      de commissie, bedoeld in [artikel 2][ref3] dan wel
      [artikel 27, van het Besluit georganiseerd overleg sector Defensie][ref4];

      h. *college voor geschillen:*

      het college, bedoeld in [artikel 33][ref5], van dit besluit;

      i. *centrale:*

      een centrale van verenigingen van ambtenaren als bedoeld in
      [artikel 4 van het Besluit georganiseerd overleg sector Defensie][ref6].

      2 Voor de toepassing van dit besluit zijn werknemers die hun werkzaamheden bij meer dan één diensteenheid
      verrichten werkzaam bij de diensteenheid waar zij in overwegende mate hun werkzaamheden verrichten.


