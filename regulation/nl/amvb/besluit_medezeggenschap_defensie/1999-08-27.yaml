  - number: '3'
    text: >-
      Onze Minister stelt na overleg met de betrokken commissie van georganiseerd overleg bij diensteenheden
      medezeggenschapscommissies in.
    url: https://wetten.overheid.nl/BWBR0010617/1999-08-27#Artikel3
  - number: '4'
    text: |-
      1 Onze Minister stelt na overleg met de betrokken commissie van georganiseerd overleg bij door hem aan te wijzen
      organisatiedelen gemeenschappelijke medezeggenschapscommissies in als dat bevorderlijk is voor een goede werking
      van de medezeggenschap.

      2 In het instellingsbesluit wordt bepaald voor welke diensteenheden en voor welke periode de gemeenschappelijke
      medezeggenschapscommissie wordt ingesteld en welke functionaris het overleg met de gemeenschappelijke
      medezeggenschapscommissie voorzit.

      3 De betrokken medezeggenschapscommissies worden vooraf in de gelegenheid gesteld advies uit te brengen over het
      instellen van een gemeenschappelijke medezeggenschapscommissie.

      4 De leden van een gemeenschappelijke medezeggenschapscommissie worden gekozen door de betrokken
      medezeggenschapscommissies uit hun leden. In het instellingsbesluit wordt het aantal leden dat uit elke
      medezeggenschapscommissie kan worden gekozen, bepaald. Voor ieder lid kan een plaatsvervanger worden gekozen die
      gelijke rechten en plichten heeft als het lid dat hij vervangt.

      5 Het instellingsbesluit bevat bepalingen die voorzien in een goede vertegenwoordiging van de verschillende groepen
      werknemers in de gemeenschappelijke medezeggenschapscommissie. Vertegenwoordigers van diensteenheden waarvoor geen
      medezeggenschapscommissie is ingesteld kunnen deel uitmaken van een gemeenschappelijke medezeggenschapscommissie.
      In het instellingsbesluit wordt hun aantal en de wijze van hun verkiezing bepaald.

      6 Het lidmaatschap van een lid of plaatsvervangend lid van een gemeenschappelijke medezeggenschapscommissie
      eindigt van rechtswege als zijn lidmaatschap van de medezeggenschapscommissie eindigt. Het lidmaatschap van de
      vertegenwoordiger, bedoeld in het vijfde lid, eindigt als hij niet langer bij de betrokken diensteenheid werkzaam
      is.

      7 De gemeenschappelijke medezeggenschapscommissie behandelt uitsluitend aangelegenheden die van gemeenschappelijk
      belang zijn voor alle of voor een meerderheid van de diensteenheden waarvoor zij is ingesteld.

      8 De bevelhebber van het krijgsmachtdeel waaruit het merendeel van de leden van de gemeenschappelijke
      medezeggenschapscommissie afkomstig is, wordt als bevelhebber aangemerkt.

      9 De [artikelen 6][ref1], [10][ref2], [13][ref3], [14][ref4], [15][ref5], [16][ref6],
      [17, eerste, tweede, vierde en vijfde lid][ref7], [18][ref8], [19][ref9] en [20][ref10] en de
      [hoofdstukken 4 tot en met 6][ref11] zijn van overeenkomstige toepassing op de gemeenschappelijke
      medezeggenschapcommissie. Op de vertegenwoordigers, bedoeld in het vijfde lid, is [artikel 17, derde lid][ref12],
      van overeenkomstige toepassing.


