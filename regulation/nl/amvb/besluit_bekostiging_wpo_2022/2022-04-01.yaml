      1 Aan een basisschool met een afdeling voor internationaal georiënteerd basisonderwijs als bedoeld in
      [artikel 85a van de wet][ref1] wordt extra bekostiging toegekend indien op de teldatum ten minste elf leerlingen
      onderwijs volgen bij deze afdeling.

      2 De extra bekostiging, bedoeld in het eerste lid, bestaat uit een bedrag per afdeling en een bedrag per leerling
      die onderwijs volgt bij deze afdeling. Deze bedragen worden bij ministeriële regeling vastgesteld.


