  - number: '10'
    text: |-
      1 De directeur van de school waar een leerling staat ingeschreven, schrijft de leerling, indien deze de school
      verlaat, uit met ingang van de dag waarop de leerling de school voor het laatst heeft bezocht. De directeur
      schrijft de leerling die wordt uitgeschreven na de school op de laatste schooldag van het schooljaar te hebben
      bezocht, uit met ingang van 31 juli van dat schooljaar.

      2 Indien de directeur van een school op wiens school de leerling stond ingeschreven binnen vier weken na de dag
      waarop de leerling de school voor het laatst heeft bezocht uit het register onderwijsdeelnemers, bedoeld in de
      [Wet register onderwijsdeelnemers][ref1], een melding ontvangt van de inschrijving van de leerling op een andere
      school of een school of instelling voor ander onderwijs, wijzigt de directeur de datum van uitschrijving, bedoeld
      in het eerste lid, alsnog in de datum van de dag voorafgaande aan de inschrijving op die andere school of die
      school of instelling voor ander onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0042012
    url: https://wetten.overheid.nl/BWBR0046159/2022-04-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0042012
  - number: '11'
    text: |-
      1 De directeur van een school draagt er zorg voor dat een overzichtelijke leerlingenadministratie beschikbaar is
      van:

      a. de inschrijving, de uitschrijving en het verzuim van de leerlingen op de school;

      b. de gegevens van de leerlingen en hun ouders die noodzakelijk zijn voor de berekening van de bekostiging; en

      c. indien het een speciale school voor basisonderwijs betreft, de verklaring bedoeld in
      [artikel 40, achtste lid, van de wet][ref1].

      2 Indien de school bestaat uit een hoofdvestiging en een of meer nevenvestigingen wordt in de
      leerlingenadministratie een onderverdeling gemaakt naar leerlingen van de hoofdvestiging en leerlingen van elk van
      de nevenvestigingen.

      3 De directeur zorgt dat de leerlingenadministratie op de hoofdvestiging beschikbaar is.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld over de wijze waarop de leerlingenadministratie
      wordt ingericht.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel40
    url: https://wetten.overheid.nl/BWBR0046159/2022-04-01#Artikel11
