  - number: '16'
    text: |-
      1 Aan het bevoegd gezag van een of meer basisscholen wordt maandelijks extra bekostiging voor de groei van het
      aantal leerlingen toegekend indien de uitkomst van de formule X – Y groter dan of gelijk is aan Z.

      2 De factoren X, Y en Z, bedoeld in het eerste lid, worden als volgt berekend:

      X = de som van de aantallen leerlingen op de eerste dag van de maand van alle onder dat bevoegd gezag ressorterende
      basisscholen;

      Y= de som van de aantallen leerlingen op de teldatum van alle onder dat bevoegd gezag ressorterende basisscholen;

      Z = 4% van het aantal leerlingen, bedoeld bij factor Y.

      3 De onder het bevoegd gezag ressorterende bassischolen, bedoeld in het tweede lid, zijn gedurende de eerste zeven
      maanden van het kalenderjaar de basisscholen die op 1 augustus van het voorafgaande kalenderjaar onder het bevoegd
      gezag ressorteerden en gedurende de laatste vijf maanden van het kalenderjaar de basisscholen die op 1 augustus van
      dat kalenderjaar onder het bevoegd gezag ressorteerden.

      4 Indien sprake is van een school die met ingang van 1 augustus van het jaar voorafgaand aan het kalenderjaar
      of met ingang van 1 augustus van het kalenderjaar is ontstaan uit een samenvoeging als bedoeld in
      [artikel 117 van de wet][ref1], wordt bij de berekening van de factoren Y en Z, bedoeld in het tweede lid,
      uitgegaan van het aantal leerlingen van alle bij die samenvoeging betrokken scholen op 1 februari van het
      voorafgaande kalenderjaar.

      5 Onverminderd [artikel 118, tweede lid, van de wet][ref2], worden bij de berekening van de factoren X, Y en Z,
      bedoeld in het tweede lid, voor de maanden augustus en september van het kalenderjaar waarin een school wordt
      geopend de aantallen leerlingen op dergelijke scholen die niet op basis van [artikel 84a van de wet][ref3] voor
      bekostiging in aanmerking zijn gebracht buiten beschouwing gelaten.

      6 Bij de berekening van de factoren Y en Z, bedoeld in het tweede lid, worden de aantallen leerlingen van scholen
      die op basis van [artikel 84a van de wet][ref4] voor bekostiging in aanmerking zijn gebracht op de teldata, bedoeld
      in [artikel 118, tweede lid, van de wet][ref5], buiten beschouwing gelaten.

      7 De aanspraak op de extra bekostiging, bedoeld in het eerste lid, ontstaat met ingang van de maand waarin de
      telling van factor X, bedoeld in het tweede lid, heeft plaatsgevonden en vervalt na afloop van diezelfde maand.

      8 De extra bekostiging, bedoeld in het eerste lid, wordt berekend door het verschil tussen factor X en factor Y te
      vermenigvuldigen met een bedrag per leerling dat bij ministeriële regeling wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel117
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel118
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel84a
      [ref4]: https://wetten.overheid.nl/BWBR0003420#Artikel84a
      [ref5]: https://wetten.overheid.nl/BWBR0003420#Artikel118
