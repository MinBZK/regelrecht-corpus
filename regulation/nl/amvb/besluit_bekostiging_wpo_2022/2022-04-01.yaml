  - number: '25'
    text: |-
      1 In geval van voortijdige beëindiging van een samenwerkingsovereenkomst wordt voor elk kalenderjaar, of gedeelte
      daarvan, dat een bijzondere school dan wel een openbare school op grond van de samenwerkingsovereenkomst, bedoeld
      in [artikel 143, derde lid, van de wet][ref1], in stand werd gehouden, door het Rijk een bedrag ingehouden op de
      bekostiging van de school.

      2 Het bedrag, bedoeld in het eerste lid, is de som van de bekostiging, bedoeld in [artikel 14][ref2], in elk van
      die kalenderjaren of gedeelten daarvan. Indien de school niet het gehele kalenderjaar werd bekostigd, wordt daarbij
      de bekostiging, bedoeld in artikel 14 berekend naar rato van het aantal maanden dat de school in dat kalenderjaar
      op grond van de samenwerkingsovereenkomst in stand werd gehouden.

      3 Voor elk kalenderjaar, of gedeelte daarvan, dat een bijzondere dan wel een openbare nevenvestiging op grond van
      de samenwerkingsovereenkomst, bedoeld in [artikel 143, derde lid, van de wet][ref3], in stand werd gehouden, wordt
      door het Rijk een bedrag ingehouden op de bekostiging van de nevenvestiging.

      4 Het bedrag, bedoeld in het derde lid, is de bekostiging, bedoeld in [artikel 17][ref4], in elk van die
      kalenderjaren, of gedeelten daarvan. Indien de nevenvestiging niet het gehele kalenderjaar werd bekostigd, wordt
      daarbij de bekostiging, bedoeld in artikel 17 berekend naar rato van het aantal maanden dat de nevenvestiging in
      dat kalenderjaar op grond van de samenwerkingsovereenkomst in stand werd gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel143
      [ref2]: https://wetten.overheid.nl/BWBR0046159#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel143
      [ref4]: https://wetten.overheid.nl/BWBR0046159#Artikel17
