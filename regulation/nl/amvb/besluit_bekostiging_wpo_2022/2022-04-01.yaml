    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister voor Basis- en Voortgezet Onderwijs en Media van 30 september 2021,
    nr. WJZ/29123337 (12545), directie Wetgeving en Juridische Zaken;

    Gelet op de artikelen 18a, zestiende lid, 69, derde lid, 116, vierde en achtste lid, 117, derde lid, 135, 143,
    vijfde lid, 149, tweede lid, 152, derde lid, 163, eerste lid, 165, eerste en derde lid, 166, tweede lid, 167,
    tweede lid, 178, 192, tweede lid, en 193 van de Wet op het primair onderwijs, de artikelen 141, eerste en derde
    lid, 142, tweede lid, 143, tweede lid, en 158 van de Wet op de expertisecentra, artikel 2.2.1, eerste lid, van de
    Wet educatie en beroepsonderwijs, artikel 8, vierde lid, van de Wet register onderwijsdeelnemers en de artikelen
    2.47, negentiende lid, 2.86, tweede lid, en 8.9a, tweede lid, van de Wet voortgezet onderwijs 2020;

    De Afdeling advisering van de Raad van State gehoord (advies van 3 november 2021, nr. W05.21.0296/I);

    Gezien het nader rapport van Onze Minister voor Basis- en Voortgezet Onderwijs en Media van 7 december 2021,
    nr. WJZ/30169573 (12545), directie Wetgeving en Juridische Zaken;

    Hebben goedgevonden en verstaan:
