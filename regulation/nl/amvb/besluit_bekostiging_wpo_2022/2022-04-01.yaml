  - number: '9'
    text: |-
      1 De directeur van een school schrijft een leerling slechts in na een beslissing van het bevoegd gezag
      tot toelating van de leerling, of indien de leerling tijdelijk op de school wordt geplaatst op grond van
      [artikel 40, zevende lid, van de wet][ref1].

      2 De directeur schrijft de leerling in met ingang van de dag waarop de leerling de school voor het eerst bezoekt.

      3 In afwijking van het tweede lid, schrijft de directeur de leerling die de school voor het eerst bezoekt op
      de eerste schooldag van het schooljaar, in met ingang van 1 augustus van dat schooljaar, tenzij de leerling op
      1 augustus de leeftijd van vier jaar nog niet heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel40
