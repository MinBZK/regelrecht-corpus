  - number: '17'
    text: |-
      1 Indien een basisschool bestaat uit een hoofdvestiging en een of meer nevenvestigingen, wordt de bekostiging
      vermeerderd met:

      a. een vast bedrag per nevenvestiging; en

      b. 60% van het verschil tussen:

      1°. de som van de extra bekostiging voor kleine scholen, bedoeld in [artikel 14, tweede lid][ref1], die de
      hoofdvestiging en de nevenvestigingen als zelfstandige scholen tezamen zouden ontvangen; en

      2°. de extra bekostiging voor kleine scholen, bedoeld in [artikel 14, tweede lid][ref2], die de basisschool
      ontvangt.

      2 Indien een speciale school voor basisonderwijs bestaat uit een hoofdvestiging en een of meer nevenvestigingen,
      wordt de bekostiging vermeerderd met een vast bedrag per nevenvestiging.

      3 De bedragen per nevenvestiging, bedoeld in het eerste lid, onderdeel a, en het tweede lid, worden bij
      ministeriële regeling vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0046159#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0046159#Artikel14
