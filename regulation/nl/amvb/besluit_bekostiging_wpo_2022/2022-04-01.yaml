  - number: '2'
    text: |-
      1 Het bevoegd gezag van een school die door Onze Minister voor bekostiging in aanmerking is gebracht, zendt Onze
      Minister uiterlijk 12 weken voor de datum van ingang van de bekostiging de benodigde gegevens voor de vaststelling
      van de bekostiging.

      2 Bij ministeriële regeling worden de gegevens, bedoeld in het eerste lid vastgesteld en kunnen hierover
      voorschriften worden gesteld.
    url: https://wetten.overheid.nl/BWBR0046159/2022-04-01#Artikel2
  - number: '3'
    text: |-
      1 Bij de mededeling van het bevoegd gezag dat sprake is van een uitzonderingssituatie als bedoeld in
      [artikel 139, vierde lid, van de wet][ref1] worden de volgende gegevens overgelegd:

      a. naam, adres en het door Onze Minister toegekende administratienummer van de desbetreffende school;

      b. het telefoonnummer van het bevoegd gezag;

      c. het feitelijk aantal leerlingen op de hoofdvestiging van de desbetreffende school, op 1 oktober van het
      schooljaar waarin de mededeling wordt gedaan, verhoogd met 3%;

      d. het door Onze Minister toegekende administratienummer van de school van dezelfde richting, dan wel indien het
      openbaar onderwijs betreft van de school met openbaar onderwijs, waarvan de hoofdvestiging het dichtst bij de
      hoofdvestiging van de desbetreffende school is gelegen;

      e. een plattegrond met een schaalverdeling waarop de hoofdvestiging van de desbetreffende school en de
      hoofdvestiging van de dichtstbijzijnde andere school, bedoeld in onderdeel d, zijn aangegeven; en

      f. de afstand, hemelsbreed gemeten, tussen de hoofdvestiging van de desbetreffende school en de hoofdvestiging van
      de dichtstbij gelegen andere school, bedoeld in onderdeel d.

      2 Bij de mededeling van het bevoegd gezag dat sprake is van een uitzonderingssituatie als bedoeld in
      [artikel 139, vijfde lid, van de wet][ref2] worden de volgende gegevens overgelegd:

      a. de in het eerste lid, onderdelen a en b, genoemde gegevens;

      b. het door Onze Minister toegekende administratienummer van de school met openbaar onderwijs, waarvan de
      hoofdvestiging het dichtst bij de hoofdvestiging van de desbetreffende school is gelegen;

      c. een plattegrond met een schaalverdeling waarop zijn aangegeven:

      1°. de hoofdvestiging van de desbetreffende school en de hoofdvestiging van de dichtstbij gelegen andere school,
      bedoeld in onderdeel b; en

      2°. de kortste route over de weg tussen de hoofdvestiging van de desbetreffende school en de hoofdvestiging van de
      in onderdeel b bedoelde andere school,

      d. de afstand in tienden van kilometers van de in onderdeel c, onder 2°, bedoelde route; en

      e. informatie waaruit blijkt dat aan het volgen van openbaar onderwijs behoefte bestaat.

      3 Bij de mededeling van het bevoegd gezag dat sprake is van een uitzonderingssituatie als bedoeld in
      [artikel 143, eerste lid, van de wet][ref3] worden de volgende gegevens overgelegd:

      a. de in het eerste lid, onderdelen a en b, genoemde gegevens,

      b. het feitelijk aantal leerlingen van de desbetreffende school, daaronder begrepen leerlingen van een
      nevenvestiging, op 1 oktober van het schooljaar waarin de mededeling wordt gedaan, verhoogd met 3%,

      c. naam, adres en het door Onze Minister toegekende administratienummer van de overige scholen van het bevoegd
      gezag,

      d. het feitelijk aantal leerlingen, daaronder begrepen leerlingen van een nevenvestiging, van de overige scholen
      van het bevoegd gezag op 1 oktober van het schooljaar waarin de mededeling wordt gedaan, verhoogd met 3%,

      e. de voor de scholen van het bevoegd gezag geldende opheffingsnorm.

      4 Bij de mededeling van het bevoegd gezag dat sprake is van een uitzonderingssituatie als bedoeld in
      [artikel 143, tweede lid, van de wet][ref4] worden de volgende gegevens overgelegd:

      a. de in het eerste lid, onderdelen a en b, en derde lid, onderdelen b tot en met d, genoemde gegevens, en

      b. de per school van het bevoegd gezag geldende opheffingsnorm.

      5 Bij de mededeling van het bevoegd gezag dat sprake is van een uitzonderingssituatie als bedoeld in
      [artikel 143, derde juncto eerste lid, van de wet][ref5], worden de volgende gegevens overgelegd:

      a. de in het eerste lid, onderdelen a en b, en derde lid, onderdelen b tot en met e, genoemde gegevens,

      b. een afschrift van de samenwerkingsovereenkomst, bedoeld in [artikel 143, derde lid, van de wet][ref6], die het
      bevoegd gezag het eerst heeft gesloten, en

      c. informatie waaruit blijkt dat aan de voorwaarden, bedoeld in
      [artikel 143, derde lid, onderdelen a en b, van de wet][ref7], is voldaan.

      6 Bij de mededeling van het bevoegd gezag dat sprake is van een uitzonderingssituatie als bedoeld in
      [artikel 143, derde juncto tweede lid, van de wet][ref8], worden de volgende gegevens overgelegd:

      a. de in het eerste lid, onderdelen a en b, derde lid, onderdelen b tot en met d, vierde lid, onderdeel b, en
      vijfde lid, onderdelen b tot en met d, genoemde gegevens,

      b. het door Onze Minister toegekende administratienummer van de school van dezelfde richting, dan wel indien
      het openbaar onderwijs betreft, de school met openbaar onderwijs, waarvan de hoofdvestiging het dichtst bij de
      hoofdvestiging van de desbetreffende school is gelegen;

      c. een plattegrond met een schaalverdeling waarop de hoofdvestiging van de desbetreffende school en de
      hoofdvestiging van de dichtstbij gelegen andere school, bedoeld in onderdeel b, zijn aangegeven; en

      d. de afstand, hemelsbreed gemeten, tussen de hoofdvestiging van de desbetreffende school en de hoofdvestiging van
      de dichtstbij gelegen andere school, bedoeld in onderdeel b.


