  - number: '18'
    text: |-
      1 Aan een basisschool wordt extra bekostiging toegekend voor de bestrijding van onderwijsachterstanden die bestaat
      uit een bedrag per eenheid achterstandsscore.

      2 Het Centraal bureau voor de statistiek berekent jaarlijks de achterstandsscore van elke basisschool op basis van
      de onderwijsscores van de leerlingen die op de teldatum zijn ingeschreven op een basisschool.

      3 De achterstandsscore van een basisschool is de uitkomst van de formule A − B en wordt als volgt berekend:

      A = som van de uitkomsten van de formule C – D voor alle leerlingen van de basisschool die behoren tot de 15% van
      alle leerlingen van alle basisscholen met de laagste onderwijsscore, waarbij:

      C = landelijk gemiddelde onderwijsscore van alle leerlingen van alle basisscholen;

      D = onderwijsscore van de leerling;

      B = E x F x (C – G) waarbij:

      E = aantal leerlingen van de basisschool;

      F = 12%;

      G = landelijk gemiddelde onderwijsscore van alle leerlingen van alle basisscholen die behoren tot de 15% van alle
      leerlingen van alle basisscholen met de laagste onderwijsscore.

      4 De achterstandsscore, bedoeld in het tweede lid, wordt rekenkundig afgerond op twee decimalen. Indien de
      achterstandsscore negatief is, wordt deze gelijkgesteld aan nul.

      5 Het Centraal bureau voor de statistiek verstrekt jaarlijks aan Onze Minister de achterstandsscores van de
      basisscholen, berekend op grond van het tweede lid, in voorkomend geval uitgesplitst naar hoofdvestiging en
      nevenvestiging, en maakt deze zo spoedig mogelijk openbaar.

      6 Indien een basisschool bestaat uit een hoofdvestiging en een of meer nevenvestigingen, bestaat de
      achterstandsscore van de basisschool uit de som van de rekenkundig afgeronde achterstandsscores die de
      afzonderlijke vestigingen zouden hebben, indien zij zelfstandige basisscholen zouden zijn.

      7 In geval van samenvoeging van scholen is [artikel 118, derde lid, van de wet][ref1] van overeenkomstige
      toepassing bij de bepaling van de leerlingen die op de teldatum zijn ingeschreven op de basisschool.

      8 In geval van verzelfstandiging van een vestiging wordt de achterstandsscore van het overblijvende deel van
      de basisschool, bedoeld in [artikel 84a van de wet][ref2] verminderd met de achterstandsscore van de nieuwe
      basisschool die op grond van artikel 84a van de wet voor bekostiging in aanmerking is gebracht. Indien de uitkomst
      negatief is, wordt deze gelijkgesteld aan nul.

      9 Bij de toepassing van dit artikel blijven scholen als bedoeld in [artikel 193 van de wet][ref3] en de leerlingen
      van die scholen buiten beschouwing.

      10 Voor een speciale school voor basisonderwijs waar op de teldatum leerlingen met een niet-Nederlandse culturele
      achtergrond staan ingeschreven, wordt voor de bestrijding van onderwijsachterstanden per leerling met een niet-
      Nederlandse culturele achtergrond extra bekostiging toegekend die bestaat uit een bedrag per leerling.

      11 De bedragen, bedoeld in het eerste en het tiende lid, worden bij ministeriële regeling vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel118
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel84a
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel193
