  - number: '4'
    text: |-
      1 Het bevoegd gezag van een bijzondere school is aangesloten bij een organisatie van bevoegde gezagen, die zich
      borg stelt voor terugbetaling van teveel ontvangen bedragen aan Onze Minister.

      2 De organisatie, bedoeld in het eerste lid, is rechtspersoon met volledige rechtsbevoegdheid en is erkend door
      Onze Minister.

      3 De erkenning, bedoeld in het eerste lid, geschiedt op verzoek van het bestuur van de organisatie. Het verzoek
      bevat in ieder geval de volgende gegevens:

      a. een opgave van elk bevoegd gezag waarvoor borg wordt gesteld;

      b. voor elke school de gemeente waar de school is of, indien de school bestaat uit een hoofdvestiging en een of
      meer nevenvestigingen, de gemeente of gemeenten waar de hoofdvestiging en de nevenvestiging of nevenvestigingen
      zijn gelegen;

      c. de plaats of plaatsen binnen die gemeente of gemeenten;

      d. de naam van de rechtspersoon onder wiens bestuur de school staat.

      4 Het bestuur van de organisatie, bedoeld in het eerste lid, stelt Onze Minister binnen twee weken op de hoogte van
      wijzigingen in de gegevens, bedoeld in het derde lid. Deze wijzigingen ontheffen de organisatie niet van de voor
      het lopende jaar aangegane borgstelling voor een aangesloten bevoegd gezag.

      5 Onze Minister beslist binnen acht weken na ontvangst van het verzoek tot erkenning.
    url: https://wetten.overheid.nl/BWBR0046159/2022-04-01#Artikel4
  - number: '5'
    text: |-
      1 Onze Minister kan op verzoek van het bevoegd gezag van een nieuwe school eenmalig een deel van de bekostiging,
      bedoeld in [artikel 116 van de wet][ref1], toekennen vanaf 1 juni voorafgaand aan het schooljaar waarin de
      bekostiging een aanvang neemt.

      2 Bij ministeriële regeling kunnen voorschriften worden gesteld over de wijze waarop de bekostiging wordt
      vastgesteld en verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel116
    url: https://wetten.overheid.nl/BWBR0046159/2022-04-01#Artikel5
