  - number: '21'
    text: |-
      Er is sprake van een samenvoeging als bedoeld in [artikel 117, eerste of tweede lid, van de wet][ref1] indien:

      a. de institutionele fusie, bedoeld in [artikel 64a van de wet][ref2], die heeft geleid tot de samenvoeging binnen
      vier weken na de fusiedatum van 1 augustus door het bevoegd gezag bij onze Minister is gemeld;

      b. alle scholen die onderdeel uitmaken van de fusie op het moment van deze fusie meer dan acht schooljaren
      bekostigd worden; en

      c. minimaal 25% van de leerlingen die op 1 februari direct voorafgaande aan de fusie als bekostigde leerling
      stonden ingeschreven op een bij de fusie opgeheven school en op 1 augustus direct volgend op de opheffing als
      bekostigde leerling ingeschreven staan op respectievelijk een basisschool ingeval het een opheffing van één of meer
      basisscholen betreft of een speciale school voor basisonderwijs ingeval het een opheffing van één of meer speciale
      scholen voor basisonderwijs betreft, zijn doorgestroomd naar de fusieschool en daar op de fusiedatum als bekostigde
      leerling staan ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel117
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel64a
