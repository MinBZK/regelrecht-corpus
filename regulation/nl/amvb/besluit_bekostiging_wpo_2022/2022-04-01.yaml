        artikel: '116'
  - number: '6'
    text: |-
      1 Onze Minister kan op verzoek van het bevoegd gezag van een nieuwe school een voorschot
      verstrekken in afwachting van de vaststelling van de bekostiging voor de periode, bedoeld in
      [artikel 118, tweede lid, onderdeel a, van de wet][ref1].

      2 Bij het verzoek, bedoeld in het eerste lid, meldt het bevoegd gezag uiterlijk op 1 juli voorafgaande aan het
      schooljaar waarin de bekostiging van een nieuwe school begint, het vermoedelijk aantal leerlingen op 1 oktober
      volgend op de datum van ingang van de bekostiging.

      3 Onze Minister kan op verzoek van het bevoegd gezag van een nieuwe school een voorschot
      verstrekken in afwachting van de vaststelling van de bekostiging voor de periode, bedoeld in
      [artikel 118, tweede lid, onderdeel b, van de wet][ref2], op grond van het aantal leerlingen op 1 oktober volgende
      op de opening van de nieuwe school.

      4 Het voorschot, bedoeld in het eerste lid, bestaat uit:

      a. de bekostiging, bedoeld in [artikel 116, tweede lid, van de wet][ref3], berekend overeenkomstig dit besluit, met
      dien verstande dat wordt gerekend met het aantal leerlingen, bedoeld in het tweede lid; en

      b. de bekostiging, bedoeld in [artikel 116, vierde lid, onderdeel a, van de wet][ref4], berekend overeenkomstig dit
      besluit, met dien verstande dat wordt gerekend met het aantal leerlingen, bedoeld in het tweede lid.

      5 Het voorschot, bedoeld in het derde lid, bestaat uit:

      a. de bekostiging, bedoeld in [artikel 116, tweede lid, van de wet][ref5], berekend overeenkomstig dit besluit, met
      dien verstande dat wordt gerekend met het aantal leerlingen, bedoeld in het derde lid; en

      b. de bekostiging, bedoeld in [artikel 116, vierde lid, onderdeel a, van de wet][ref6], berekend overeenkomstig dit
      besluit, met dien verstande dat wordt gerekend met het aantal leerlingen, bedoeld in het derde lid.

      6 Op de betaling van het verleende voorschot is [artikel 116, zesde lid, van de wet][ref7] van overeenkomstige
      toepassing.

      7 Onze Minister is bevoegd tot verrekening van verstrekte voorschotten met de betalingen die voortvloeien uit de
      vaststelling van de onderscheiden onderdelen van de bekostiging.

      8 Indien Onze Minister een voorschot verleent in gevallen waarin de bekostiging niet tijdig kan worden vastgesteld
      door omstandigheden die niet aan het bevoegd gezag van een school zijn toe te rekenen, zijn het zesde en het
      zevende lid van overeenkomstige toepassing.


