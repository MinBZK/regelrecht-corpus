articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

        - *achterstandsscore:* overeenkomstig [artikel 18][ref1] berekende score van een basisschool, niet zijnde een
      school als bedoeld in [artikel 193 van de wet][ref2], voor de toekenning van aanvullende bekostiging voor de
      bestrijding van onderwijsachterstanden.
        - *accountant:* accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref3];
        - *basisschool:* basisschool als bedoeld in [artikel 1 van de wet][ref4];
        - *bevoegd gezag:* voor wat betreft: a. een openbare school: 1°. het college van burgemeester en wethouders,
      voor zover de raad niet anders bepaalt, en, indien de raad dit besluit, met inachtneming van door hem te
      stellen regels; 2°. het krachtens de desbetreffende gemeenschappelijke regeling bevoegde orgaan; 3° de openbare
      rechtspersoon, bedoeld in [artikel 47 van de wet][ref5]; dan wel 4°. de stichting, bedoeld in [artikel 17][ref6] of
      [48 van de wet][ref7]; b. een bijzondere school: de rechtspersoon, bedoeld in [artikel 55 van de wet][ref8]; c. een
      samenwerkingsschool: de stichting, bedoeld in [artikel 17d][ref9];
        - *bijzondere school:* bijzondere school als bedoeld in [artikel 1 van de wet][ref10];
        - *centrale dienst:* centrale dienst als bedoeld in [artikel 68 van de wet][ref11];
        - *extra bekostiging:* bekostiging als bedoeld in [artikel 116, vierde lid, van de wet][ref12];
        - *leerling:* leerling die op grond van [artikel 39 van de wet][ref13] tot een school is toegelaten;
        - *leerling met een niet-Nederlandse culturele achtergrond:* leerling: a. die behoort tot de Molukse
      bevolkingsgroep, b. van wie ten minste een van de ouders of voogden afkomstig is uit Griekenland, Italië,
      het voormalige Joegoslavië, Kaapverdië, Marokko, Portugal, Spanje, Tunesië of Turkije, c. van wie ten minste
      een van de ouders of voogden afkomstig is uit Suriname of een van de Caribische delen van het Koninkrijk,
      d. van wie ten minste een van de ouders of voogden als vreemdeling rechtmatig verblijf heeft als bedoeld in
      [artikel 8, onderdeel c of d, van de Vreemdelingenwet 2000][ref14], e. van wie ten minste een van de ouders of
      voogden afkomstig is uit een ander niet-Engelstalig land buiten Europa, echter met uitzondering van Indonesië;
        - *nevenvestiging:* nevenvestiging als bedoeld in [artikel 85 van de wet][ref15];
        - *Onze Minister:* Onze Minister voor Basis- en Voortgezet Onderwijs en Media;
        - *onderwijsscore:* verwachte score van een leerling van een basisschool, niet zijnde een school als bedoeld in
      [artikel 193 van de wet][ref16], die op basis van statistische gegevens door het Centraal bureau voor de statistiek
      wordt bepaald;
        - *openbare school:* openbare school als bedoeld in [artikel 1 van de wet][ref17];
        - *ouders:* ouders, voogden en verzorgers;
        - *samenwerkingsverband:* samenwerkingsverband als bedoeld in [artikel 1 van de wet][ref18];
        - *school:* basisschool of een speciale school voor basisonderwijs, tenzij anders is bepaald;
        - *schooljaar:* tijdvak van 1 augustus tot en met 31 juli daaropvolgend;
        - *speciale school voor basisonderwijs:* speciale school voor basisonderwijs als bedoeld in
      [artikel 1 van de wet][ref19];
        - *teldatum:* de datum, bedoeld in [artikel 118 van de wet][ref20];
        - *wet:* [Wet op het primair onderwijs][ref21].


