  - number: '22'
    text: |-
      1 Voor de toepassing van [artikel 116, achtste lid, van de wet][ref1] wordt een bedrag per leerling
      in mindering gebracht op de bekostiging van het overblijvende deel van de basisschool, als bedoeld in
      [artikel 84a van de wet][ref2], met dien verstande dat wordt gerekend met het aantal leerlingen dat op de teldata
      voorafgaand aan de verzelfstandiging als daadwerkelijk schoolgaand stond ingeschreven op het deel van de school dat
      verzelfstandigd is.

      2 De vermindering, bedoeld in het eerste lid wordt zowel berekend voor het kalenderjaar waarin de verzelfstandiging
      heeft plaatsgevonden als voor het kalenderjaar na de verzelfstandiging.

      3 Bij ministeriële regeling wordt jaarlijks het bedrag, bedoeld in het eerste lid, vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel116
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel84a
