  - number: '8'
    text: |-
      1 Onze Minister stelt jaarlijks een overzicht vast van de hem ter beschikking staande gegevens over het aantal
      leerlingen op de teldatum dat bij de vaststelling van de bekostiging, bedoeld in [artikel 13, eerste lid][ref1], in
      aanmerking wordt genomen.

      2 Het overzicht wordt uiterlijk acht weken na de teldatum toegezonden aan het bevoegd gezag. Indien toepassing is
      gegeven aan [artikel 7, derde lid][ref2], wordt het overzicht uiterlijk vier weken na afloop van de daar bedoelde
      verlengde termijn toegezonden aan het bevoegd gezag.

      3 Het overzicht is voor basisscholen in ieder geval onderverdeeld in leerlingen als bedoeld in de
      [artikelen 15][ref3] en [19][ref4] en overige leerlingen.

      4 Het overzicht is voor speciale scholen voor basisonderwijs onderverdeeld in leerlingen met een niet-Nederlandse
      culturele achtergrond en overige leerlingen.

      5 Indien de school bestaat uit een hoofdvestiging en een of meer nevenvestigingen, wordt het overzicht tevens
      onderverdeeld in de leerlingen van de hoofdvestiging en de leerlingen van elk van de nevenvestigingen.


      [ref1]: https://wetten.overheid.nl/BWBR0046159#Artikel13
