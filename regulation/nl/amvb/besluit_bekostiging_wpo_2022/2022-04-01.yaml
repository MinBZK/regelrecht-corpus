  - number: '14'
    text: |-
      1 Een basisschool die op de teldatum minder dan 150 leerlingen heeft, ontvangt extra bekostiging.

      2 De extra bekostiging, bedoeld in het eerste lid, bestaat uit het verschil tussen een startbedrag en een
      verminderingsbedrag vermenigvuldigd met het aantal leerlingen van de basisschool op de teldatum. Het startbedrag en
      het verminderingsbedrag worden bij ministeriële regeling vastgesteld.

      3 Indien de totale bekostiging berekend op grond van [artikel 116, tweede lid, van de wet][ref1] vermeerderd met
      de bekostiging, bedoeld in het eerste lid en [artikel 18][ref2], voor een basisschool minder bedraagt dan het
      basisbedrag, ontvangt de basisschool het verschil als extra bekostiging.

      4 Het basisbedrag, bedoeld in het derde lid, wordt bij ministeriële regeling vastgesteld en is gebaseerd op een
      minimale schoolgrootte van 23 leerlingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel116
      [ref2]: https://wetten.overheid.nl/BWBR0046159#Artikel18
