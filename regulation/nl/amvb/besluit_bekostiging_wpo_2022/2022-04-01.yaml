  - number: '19'
    text: |-
      1 Voor een basisschool waar op de teldatum leerlingen met een niet-Nederlandse culturele achtergrond, met
      uitzondering van leerlingen van wie ten minste een van de ouders of voogden afkomstig is uit Suriname of een van
      de Caribische delen van het Koninkrijk, staan ingeschreven, wordt extra bekostiging toegekend voor het Nederlands
      onderwijs aan anderstaligen.

      2 De extra bekostiging bestaat uit een bedrag per school en een bedrag per leerling. De bedragen worden bij
      ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0046159/2022-04-01#Artikel19
  - number: '20'
    text: |-
      1 Het samenwerkingsverband neemt in het ondersteuningsplan een datum op wanneer wordt vastgesteld
      of sprake is van een meer dan gemiddelde toename van het aantal ingeschreven leerlingen, bedoeld in
      [artikel 18a, achtste lid, onderdeel g, van de wet][ref1]. Deze vaststelling vindt in ieder geval plaats in de
      periode tussen 1 februari en 1 juni.

      2 Indien een meer dan gemiddelde toename, bedoeld in het eerste lid, wordt vastgesteld, draagt het
      samenwerkingsverband voor het aantal leerlingen dat na 1 februari toelaatbaar is verklaard tot speciale scholen
      voor basisonderwijs of tot het speciaal onderwijs per leerling een bedrag over aan de school waar de leerling is
      ingeschreven.

      3 Het bedrag, bedoeld in het tweede lid, is afhankelijk van de in de toelaatbaarheidsverklaring opgenomen
      ondersteuningsbehoefte van de leerling en wordt bij ministeriële regeling vastgesteld.

      4 De overdracht, bedoeld in het tweede lid, heeft betrekking op het kalenderjaar dat volgt op de teldatum.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel18a
