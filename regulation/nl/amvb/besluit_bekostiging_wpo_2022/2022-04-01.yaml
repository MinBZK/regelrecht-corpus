  - number: '7'
    text: |-
      1 Voor de toepassing van de [wet][ref1] en dit besluit worden de leerlingen meegeteld die:

      a. op de teldatum als werkelijk schoolgaand op de school staan ingeschreven; of

      b. op de teldatum op grond van artikel 4.1 van het Inrichtingsbesluit WPO tijdelijk buiten de school waar zij staan
      ingeschreven zijn geplaatst.

      2 Onze Minister neemt voor het bepalen van het aantal leerlingen op de teldatum en het aantal
      leerlingen op de eerste dag van de maand, bedoeld in [artikel 16][ref2], de leerlingen in
      aanmerking van wie het persoonsgebonden nummer tezamen met de basisgegevens, bedoeld in
      [artikel 8, eerste lid, onderdeel b, van de Wet register onderwijsdeelnemers][ref3] binnen
      vier weken na die dag zijn opgenomen in het register onderwijsdeelnemers overeenkomstig
      [artikel 14 van de Wet register onderwijsdeelnemers][ref4].

      3 De termijn, bedoeld in het tweede lid, kan worden verlengd. Bij ministeriële regeling worden regels gesteld over
      de verlenging.

      4 Een leerling kan op de teldatum, respectievelijk op elke eerste dag van de maand, bedoeld in het tweede lid,
      slechts op één school voor de bekostiging meetellen.


