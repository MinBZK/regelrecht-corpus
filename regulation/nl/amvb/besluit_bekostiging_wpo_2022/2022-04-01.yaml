  - number: '13'
    text: |-
      1 Onze Minister stelt jaarlijks uiterlijk op 1 januari de bekostiging, bedoeld in de
      [artikelen 116, tweede lid en vierde lid, onderdelen a, b en d][ref1], en [121 van de wet][ref2], vast voor zover
      deze mede gebaseerd is op het aantal leerlingen op de teldatum.

      2 Onze Minister stelt de extra bekostiging voor groei, bedoeld in [artikel 16][ref3] vast binnen 14 weken na de
      voor de desbetreffende bekostiging relevante teldatum.

      3 Onze Minister kan de bekostiging, bedoeld in het eerste en tweede lid, wijzigen vanwege loonontwikkelingen of
      andere al dan niet uit de rijksbegroting voortvloeiende maatregelen.

      4 Het bedrag per school, bedoeld in [artikel 116, tweede lid, van de wet][ref4], bedraagt voor basisscholen met op
      de teldatum minder dan 100 leerlingen respectievelijk 100 leerlingen of meer een bij ministeriële regeling vast te
      stellen bedrag.

      5 Het bedrag per school, bedoeld in [artikel 116, tweede lid, van de wet][ref5] bedraagt voor speciale scholen voor
      basisonderwijs met op de teldatum minder dan 100 leerlingen of 100 leerlingen of meer een bij ministeriële regeling
      vast te stellen bedrag.


