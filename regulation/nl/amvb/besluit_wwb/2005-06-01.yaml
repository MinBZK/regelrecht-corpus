  - number: '2'
    text: |-
      Het bedrag van het werkdeel wordt berekend aan de hand van de volgende formule:

      W = (KW : TKW) x TBW

      waarbij:

      a. W het werkdeel voor de gemeente is;

      b. Kw het gemeentelijke werkbudget 2003 is;

      c. TKw het totaal is van de gemeentelijke werkbudgetten 2003 van alle gemeenten;

      d. TBW het totale bedrag is dat beschikbaar is voor de werkdelen.
    url: https://wetten.overheid.nl/BWBR0015709/2005-06-01#Artikel2
  - number: '3'
    text: |-
      1 Indien in een kalenderjaar het werkdeel niet volledig is besteed aan voorzieningen als bedoeld in
      [artikel 7, eerste lid, onderdeel a, van de wet][ref1], kan het college het niet bestede deel tot maximaal 75% van
      het voor dat jaar toegekende budget toevoegen aan het werkdeel voor het daaropvolgende kalenderjaar.

      2 Indien in een kalenderjaar meer dan het werkdeel is besteed aan voorzieningen als bedoeld in
      [artikel 7, eerste lid, onderdeel a, van de wet][ref2], kan het college het meer bestede bedrag tot maximaal 75%
      van het voor dat jaar toegekende budget ten laste brengen van het werkdeel voor het daaropvolgende kalenderjaar.

      3 Het percentage van de uitkering dat op grond van [artikel 70, tweede lid, van de wet][ref3] wordt teruggevorderd,
      bedraagt 100%. Indien volledige terugvordering naar het oordeel van Onze Minister tot een onbillijkheid van
      overwegende aard leidt, stelt Onze Minister de terugvordering op een lager percentage vast.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel7
