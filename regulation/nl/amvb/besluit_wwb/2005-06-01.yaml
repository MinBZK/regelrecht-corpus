  - number: '4'
    text: |-
      1 Het bedrag van het inkomensdeel wordt verschillend berekend voor gemeenten met:

      a. 40 000 of minder inwoners;

      b. meer dan 40 000 en minder dan 60 000 inwoners;

      c. 60 000 of meer inwoners.

      2 Voor de vaststelling van het aantal inwoners, bedoeld in het eerste lid, geldt als peildatum 1 januari 2004.

      3 Het aantal inwoners wordt ontleend aan de statistiek «Demografische kerncijfers per gemeente» van het Centraal
      Bureau voor de Statistiek.
    url: https://wetten.overheid.nl/BWBR0015709/2005-06-01#Artikel4
  - number: '5'
    text: |-
      Voor gemeenten met 40 000 of minder inwoners wordt het bedrag van het inkomensdeel berekend aan de hand van de
      volgende formule:

      I = (K64 : TK6440 000) x TB6440 000 + (K65 : TK65) x TB65

      waarbij:

      a. I het inkomensdeel voor de gemeente is;

      b. K64 de gemeentelijke bijstandslasten 2002 voor personen jonger dan 65 jaar zijn;

      c. TK6440 000 het totaal is van de gemeentelijke bijstandslasten 2002 voor personen jonger dan 65 jaar van
      gemeenten met 40 000 of minder inwoners;

      d. TB6440 000 het deel is van het totale bedrag dat beschikbaar is voor de inkomensdelen voor gemeenten met 40 000
      inwoners of minder, bestemd voor personen jonger dan 65 jaar;

      e. K65 de gemeentelijke bijstandslasten 2002 voor personen van 65 jaar of ouder zijn;

      f. TK65 het totaal is van de gemeentelijke bijstandslasten 2002 voor personen van 65 jaar of ouder;

      g. TB65 het deel is van het totale bedrag dat beschikbaar is voor de inkomensdelen, bestemd voor personen van 65
      jaar of ouder.
    url: https://wetten.overheid.nl/BWBR0015709/2005-06-01#Artikel5
  - number: '6'
    text: |-
      Voor gemeenten met meer dan 40 000 en minder dan 60 000 inwoners wordt het bedrag van de uitkering berekend aan de
      hand van de volgende formule:

      I = {[(1 – M) x (K64 : TK6440 000-60 000) + M x (0,27 x (K64 : TK6440 000-60 000) + 0,73 x (O : OT40 000-60 000))]
      x TB6440 000-60 000 x C} + (K65 : TK65) x TB65

      waarbij:

      a. I het inkomensdeel voor de gemeente is;

      b. M het aantal inwoners van de gemeente per 1 januari 2004 is, verminderd met 40 000 en vervolgens gedeeld door
      20 000;

      c. K64 de gemeentelijke bijstandslasten 2002 voor personen jonger dan 65 jaar zijn;

      d. TK6440 000-60 000 het totaal is van de gemeentelijke bijstandslasten 2002 voor personen jonger dan 65 jaar van
      gemeenten met meer dan 40 000 en minder dan 60 000 inwoners;

      e. TB6440 000-60 000 het deel is van het totale bedrag dat beschikbaar is voor de inkomensdelen voor gemeenten met
      meer dan 40 000 en minder dan 60 000 inwoners, bestemd voor personen jonger dan 65 jaar;

      f. O de objectief vastgestelde gemeentelijke bijstandskosten voor personen jonger dan 65 jaar zijn;

      g. OT40 000-60 000 het totaal is van de objectief vastgestelde gemeentelijke bijstandskosten voor personen jonger
      dan 65 jaar van gemeenten met meer dan 40 000 en minder dan 60 000 inwoners;

      h. C de correctiefactor is die wordt berekend aan de hand van de formule die is opgenomen in [bijlage 2][ref1] bij
      dit besluit;

      i. K65 de gemeentelijke bijstandslasten 2002 voor personen van 65 jaar of ouder zijn;

      j. TK65 het totaal is van de gemeentelijke bijstandslasten 2002 voor personen van 65 jaar of ouder;

      k. TB65 het deel is van het totale bedrag dat beschikbaar is voor de inkomensdelen, bestemd voor personen van 65
      jaar of ouder.


      [ref1]: https://wetten.overheid.nl/BWBR0015709
    url: https://wetten.overheid.nl/BWBR0015709/2005-06-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0015709
  - number: '7'
    text: |-
      Voor gemeenten met 60 000 of meer inwoners wordt het bedrag van de uitkering berekend aan de hand van de volgende
      formule:

      I = [0,27 x (K64 : TK6460 000) x TB6460 000 + 0,73 x (O : OT60 000) x TB6460 000] + (K65 : TK65) x TB65

      waarbij:

      a. I het inkomensdeel voor de gemeente is;

      b. K64 de gemeentelijke bijstandslasten 2002 voor personen jonger dan 65 jaar zijn;

      c. TK6460 000 het totaal is van de gemeentelijke bijstandslasten 2002 voor personen jonger dan 65 jaar van
      gemeenten met 60 000 of meer inwoners;

      d. TB6460 000 het deel is van het totale bedrag dat beschikbaar is voor de inkomensdelen voor gemeenten met 60 000
      inwoners of meer, bestemd voor personen jonger dan 65 jaar;

      e. O de objectief vastgestelde gemeentelijke uitkeringskosten bijstandskosten voor personen jonger dan 65 jaar
      zijn;

      f. OT60 000 het totaal is van de objectief vastgestelde gemeentelijke bijstandskosten voor personen jonger dan 65
      jaar van gemeenten met 60 000 of meer inwoners;

      g. K65 de gemeentelijke bijstandslasten 2002 voor personen van 65 jaar of ouder zijn;

      h. TK65 het totaal is van de gemeentelijke bijstandslasten 2002 voor personen van 65 jaar of ouder;

      i. TB65 het deel is van het totale bedrag dat beschikbaar is voor de inkomensdelen, bestemd voor personen van 65
      jaar of ouder.
    url: https://wetten.overheid.nl/BWBR0015709/2005-06-01#Artikel7
  - number: '8'
    text: |-
      1 Aan de hand van het verdeelmodel dat is opgenomen in [bijlage 2][ref1] bij dit besluit:

      a. worden de objectief vastgestelde gemeentelijke bijstandskosten voor personen jonger dan 65 jaar vastgesteld;

      b. wordt het totale bedrag dat beschikbaar is voor de inkomensdelen voor alle gemeenten, bestemd voor personen
      jonger dan 65 jaar, verdeeld over de delen TB6440.000, TB6440.000-60.000 en TB6460.000.

      2 Het totale bedrag dat beschikbaar is voor de inkomensdelen van de gemeenten betreft: TB6440 000 + TB6440 000-
      60 000 + TB6460 000 + TB65.


      [ref1]: https://wetten.overheid.nl/BWBR0015709
    url: https://wetten.overheid.nl/BWBR0015709/2005-06-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0015709
  - number: '9'
    text: |-
      De toetsingscommissie bestaat uit een voorzitter en twee leden. Onze Minister benoemt de voorzitter en de leden,
      alsmede twee plaatsvervangende leden, die tevens door hem kunnen worden geschorst en ontslagen.
    url: https://wetten.overheid.nl/BWBR0015709/2005-06-01#Artikel9
  - number: '10'
    text: |-
      1 Een verzoek om een aanvullende uitkering omvat:

      a. een verklaring voor het feit dat de door het college gemaakte kosten hoger zijn dan het daarvoor verstrekte
      inkomensdeel;

      b. een overzicht van de maatregelen die het college heeft genomen dan wel in de toekomst zal nemen om een situatie
      als bedoeld in onderdeel a te voorkomen, en

      c. een toelichting op het bedrag waarom wordt verzocht.

      2 Een aanvullende uitkering wordt slechts toegekend voorzover:

      a. voldaan is aan de gestelde vormvoorschriften;

      b. de gemaakte kosten de toegekende uitkering inkomensdeel met minimaal tien procent overstijgen;

      c. de uitkomst van de beoordeling van het effect van de arbeidsmarkt en van het gevoerde gemeentelijk beleid en de
      uitvoering daarvan daartoe aanleiding geeft.

      3 De toetsingscommissie beoordeelt of een verzoek voldoet aan de in het eerste en tweede lid genoemde voorwaarden
      en adviseert Onze Minister. Indien de toetsingscommissie van oordeel is dat een gemeente in aanmerking komt voor
      een aanvullende uitkering, dan is de hoogte van deze uitkering gelijk aan het verschil tussen de werkelijke netto
      bijstandsuitkeringslasten en 110% van de toegekende uitkering inkomensdeel.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot dit artikel, waarbij voor
      gemeenten tot maximaal 40 000 inwoners een afwijkende invulling kan worden gegeven van het tweede lid, onderdeel c.
    url: https://wetten.overheid.nl/BWBR0015709/2005-06-01#Artikel10
  - number: '11'
    text: |-
      1 Voor de verlening van bijstand aan belanghebbenden zonder adres als bedoeld in
      [artikel 1 van de Wet gemeentelijke basisadministratie persoonsgegevens][ref1] worden aangewezen de gemeenten
      opgenomen in de [bijlage onder A van het Besluit specifieke uitkeringen maatschappelijke opvang, vrouwenopvang en
      verslavingsbeleid](onbekend).

      2 De bijstand, bedoeld in het eerste lid, wordt verleend door het college van de gemeente waar de belanghebbende
      zich op het moment van zijn aanvraag bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel1
