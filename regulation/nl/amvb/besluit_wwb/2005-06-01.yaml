preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 3 september 2003, Directie
    Bijstand en Gemeentelijk Activeringsbeleid, nr. B&GA/WWB/03/70145;

    Gelet op de artikelen 40, eerste lid, 69, tweede en derde lid, 70, tweede en derde lid, 73, derde lid, en 74, derde
    lid, van de Wet werk en bijstand;

    De Raad van State gehoord (advies van 18 september 2003, nr. W12.03.0371/IV);

    Gezien het nader rapport van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 9 oktober 2003, Directie
    Werk en Bijstand, nr. W&B/WWB/03/76805;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0015709/2005-06-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. wet: [Wet werk en bijstand][ref1];

      b. Wet inschakeling werkzoekenden: de [Wet inschakeling werkzoekenden][ref2] zoals deze luidde op de dag
      voorafgaand aan de inwerkingtreding van de [wet][ref3];

      c. Besluit in- en doorstroombanen: het [Besluit in- en doorstroombanen][ref4] zoals dit luidde op de dag
      voorafgaand aan de inwerkingtreding van de [wet][ref5];

      d. Algemene bijstandswet: de [Algemene bijstandswet][ref6] zoals deze luidde op de dag voorafgaand aan de
      inwerkingtreding van de [wet][ref7];

      e. Wet financiering Abw, IOAW en IOAZ: de [Wet financiering Abw, IOAW en IOAZ][ref8] zoals deze luidde op de dag
      voorafgaand aan de inwerkingtreding van de [wet][ref9];

      f. werkdeel: de uitkering, bedoeld in [artikel 69, eerste lid, onderdeel a, van de wet][ref10];

      g. inkomensdeel: de uitkering, bedoeld in [artikel 69, eerste lid, onderdeel b, van de wet][ref11];

      h. gemeentelijke werkbudget 2003: het aan de hand van het model dat is opgenomen in
      [bijlage 1][ref12] bij dit besluit bepaalde aandeel van de gemeente in de totale subsidie die
      in het jaar 2003 op grond van [artikel 18 van de Wet inschakeling werkzoekenden][ref13] en
      [artikel 13, eerste tot en met derde lid, van het Besluit in- en doorstroombanen][ref14] beschikbaar was;

      i. gemeentelijke bijstandslasten 2002 voor personen jonger dan 65 jaar: de volgens de opgave, bedoeld in
      [artikel 130, vierde lid, van de Algemene bijstandswet][ref15], in het jaar 2002 ten laste van een gemeente
      gebleven kosten, bedoeld in [artikel 3, eerste lid, onderdeel a, van de Wet financiering Abw, IOAW en IOAZ][ref16],
      verminderd met de kosten van bijstand die is verleend met toepassing van
      [artikel 30, tweede lid, van de Algemene bijstandswet][ref17] en verminderd met de kosten van bijstand die
      is verleend met toepassing van [artikel 63, tweede lid, van de Algemene bijstandswet][ref18], en vervolgens
      vermenigvuldigd met het aantal huishoudens waarvan de referentiepersoon tot de leeftijdscategorie van 15 tot en met
      64 jaar behoort, in de gemeente op 1 januari 2004, gedeeld door het aantal dergelijke huishoudens in de gemeente op
      1 januari 2002;

      j. gemeentelijke bijstandslasten 2002 voor personen van 65 jaar of ouder: de volgens de opgave, bedoeld in
      [artikel 130, vierde lid, van de Algemene bijstandswet][ref19], in het jaar 2002 ten laste van een gemeente
      gebleven kosten, bedoeld in [artikel 3, eerste lid, onderdeel a, van de Wet financiering Abw, IOAW en IOAZ][ref20],
      van bijstand die is verleend met toepassing van [artikel 30, tweede lid, van de Algemene bijstandswet][ref21].


