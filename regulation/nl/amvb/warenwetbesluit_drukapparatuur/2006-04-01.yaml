  - number: 12c
    text: |-
      1 Bij ministeriële regeling wordt in verband met de veiligheid en gezondheid van personen en het milieu
      drukapparatuur aangewezen die overeenkomstig dit artikel wordt herkeurd.

      2 De drukapparatuur, bedoeld in het eerste lid, wordt herkeurd en gaat vergezeld van een verklaring van herkeuring.

      3 De verklaring van herkeuring, bedoeld in het tweede lid, wordt, met inachtneming van de termijn, bedoeld in
      [artikel 12b, elfde lid, onder a][ref1], onderscheidenlijk de termijn, bedoeld in het negende lid, onder a, onder
      overlegging van de gegevens en bescheiden, vermeld in het vierde lid, schriftelijk aangevraagd bij een aangewezen
      keuringsinstelling of een aangewezen keuringsdienst van gebruikers.

      4 De aanvraag, bedoeld in het derde lid, omvat, voorzover van toepassing:

      a. naam en adres van de gebruiker en de plaats waar de drukapparatuur staat opgesteld;

      b. de verklaring van ingebruikneming, de verklaring van intredekeuring en ingebruikneming en de verklaring van
      herkeuring, afgegeven na een voorgaande herkeuring, met inbegrip van de bij de keuringen behorende rapporten, en
      het aantekenblad, bedoeld in [artikel 12e, eerste lid][ref2].

      c. de documentatie van de apparatuur die is afgegeven tot 29 mei 2002 op grond van de wettelijke voorschriften die
      van toepassing waren vóór 29 november 1999;

      d. naar het oordeel van de instelling of dienst, bedoeld in het derde lid, aanvullende documentatie.

      5 [Artikel 12b, vijfde lid][ref3], is van overeenkomstige toepassing.

      6 De instelling of dienst, bedoeld in het derde lid, die de herkeuring, bedoeld in het tweede lid, uitvoert,
      verricht, voorzover van toepassing, de volgende onderzoeken:

      a. de controle van de inwendige toestand van de drukapparatuur, zo nodig aangevuld met ander passend onderzoek;

      b. voor drukapparatuur die niet inwendig is te inspecteren, passend onderzoek;

      c. de controle van de uitwendige toestand van de drukapparatuur.

      7 Bij ministeriële regeling kunnen ten aanzien van de onderzoeken, bedoeld in het zesde lid, nadere regels worden
      gesteld en kan worden bepaald dat de onderzoeken door de gebruiker van de drukapparatuur wordt uitgevoerd onder
      toezicht van de instelling, bedoeld in het derde lid, met inachtneming van de bij die regeling gestelde regels.

      8 De instelling of dienst, bedoeld in het derde lid, stelt een rapport op van de herkeuring, bedoeld in het tweede
      lid, en stelt een exemplaar van dit rapport beschikbaar aan de gebruiker. In dit rapport kunnen voorwaarden worden
      gesteld waaraan wordt voldaan alvorens een verklaring van herkeuring wordt afgegeven.

      9 Door de instelling of dienst, bedoeld in het derde lid, wordt een verklaring van herkeuring afgegeven indien is
      gebleken dat tegen het verdere gebruik van de drukapparatuur voor de geldende termijn geen bezwaar bestaat.

      In deze verklaring:

      a. wordt de geldigheidstermijn vermeld;

      b. kunnen gebruiksvoorwaarden worden gesteld.

      10 De verklaring van herkeuring kan betrekking hebben op één of meer drukapparaten.

      11 De gebruiker draagt er zorg voor dat de herkeuring, bedoeld in het tweede lid, veilig kan worden uitgevoerd.

      12 Bij Ministeriële regeling kunnen met betrekking tot bepaalde drukapparatuur als bedoeld in het eerste lid regels
      worden gesteld die afwijken of strekken ter aanvulling van dit artikel of onderdelen daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel12b
      [ref2]: https://wetten.overheid.nl/BWBR0010586#Artikel12e
      [ref3]: https://wetten.overheid.nl/BWBR0010586#Artikel12b
