  - number: '16'
    text: |-
      1 De CE-markering bestaat uit de letters CE overeenkomstig het model in bijlage VI bij de richtlijn, gevolgd
      door het identificatienummer van de aangewezen aangemelde keuringsinstelling die betrokken is geweest bij de
      produktiecontrolefase.

      2 De CE-markering en de gegevens, bedoeld in punt 3.3 van bijlage I bij de richtlijn, wordt overeenkomstig
      dit punt zichtbaar, goed leesbaar en onuitwisbaar aangebracht op drukapparatuur of samenstellen als bedoeld in
      [artikel 7][ref1], onderscheidenlijk [artikel 8][ref2], wanneer deze zijn voltooid, of zich in een staat bevinden
      die het mogelijk maakt de eindcontrole, bedoeld in punt 3.2 van bijlage I bij de richtlijn, te verrichten.

      3 Op elk van de afzonderlijke drukapparaten waaruit een samenstel bestaat behoeft niet een CE-markering te worden
      aangebracht. De afzonderlijke drukapparaten die reeds een CE-markering hebben wanneer zij in het samenstel worden
      opgenomen, behouden die markering.

      4 Op drukapparatuur en samenstellen worden geen markeringen aangebracht die derden kunnen misleiden omtrent de
      betekenis of grafische vorm van de CE-markering. Andere markeringen mogen worden aangebracht op voorwaarde dat de
      zichtbaarheid en leesbaarheid van de CE-markering er niet door worden verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0010586#Artikel8
    url: https://wetten.overheid.nl/BWBR0010586/2006-04-01#Artikel16
