  - number: '7'
    text: >-
      De volgende drukapparatuur voldoet aan de essentiële veiligheidseisen, genoemd in bijlage I bij de richtlijn. Het
      betreft:


      a. drukvaten, met uitzondering van de onder c bedoelde, voor gassen, vloeibare gassen, onder druk opgeloste gassen,
      dampen en vloeistoffen waarvan de dampdruk bij de maximaal toelaatbare temperatuur meer dan 0,5 bar hoger is dan de
      normale atmosferische druk (1013 mbar), binnen de volgende grenzen:


      1°. voor stoffen, ingedeeld in groep 1, wanneer het volume groter is dan 1L en het product van*PS*en *V* groter is
      dan 25 bar.L, of wanneer de druk *PS* groter is dan 200 bar;


      2°. voor stoffen, ingedeeld in groep 2, wanneer het volume groter is dan 1L en het product van *PS* en *V* groter
      is dan 50 bar.L, of wanneer de druk *PS* groter is dan 1000 bar, alsmede alle draagbare brandblussers en flessen
      voor ademhalingstoestellen;


      b. drukvaten, met uitzondering van de onder c bedoelde, voor vloeistoffen waarvan de dampdruk bij de maximaal
      toelaatbare temperatuur 0,5 bar of minder boven de normale atmosferische druk (1013 mbar) ligt, binnen de volgende
      grenzen:


      1°. voor stoffen, ingedeeld in groep 1, wanneer het volume groter is dan 1L en het product van *PS* en *V* groter
      is dan 200 bar.L of, wanneer de druk *PS* hoger is dan 500 bar;


      2°. voor stoffen, ingedeeld in groep 2, wanneer de druk *PS*meer is dan 10 bar en het product van *PS* en *V*
      groter is dan 10 000 bar.L, of wanneer de druk*PS*meer dan 1000 bar is;


      c. brandstofgestookte of anderszins verwarmde drukapparatuur waarbij gevaar voor oververhitting bestaat, bestemd
      voor de productie van stoom of oververhit water met een temperatuur hoger dan 110°C met een volume van meer dan 2L,
      alsmede alle snelkookpannen;


      d. installatieleidingen bestemd voor gassen, vloeibare gassen, onder druk opgeloste gassen, dampen en vloeistoffen
      waarvan de dampdruk bij de maximaal toelaatbare temperatuur meer dan 0,5 bar hoger is dan de normale atmosferische
      druk (1013 mbar), binnen de volgende grenzen:


      1°. voor stoffen, ingedeeld in groep 1, met een DN groter dan 25;


      2°. voor stoffen, ingedeeld in groep 2, met een DN groter dan 32 en een product van *PS* en DN groter dan 1000 bar;


      e. installatieleidingen bestemd voor vloeistoffen waarvan de dampdruk bij de maximaal toelaatbare temperatuur 0,5
      bar of minder boven de normale atmosferische druk (1013 mbar) ligt binnen de volgende grenzen:


      1°. voor stoffen, ingedeeld in groep 1, met een DN groter dan 25 en een product van *PS* en DN groter dan 2000 bar;


      2°. voor stoffen, ingedeeld in groep 2, met een *PS* groter dan 10 bar en een DN groter dan 200 en een product van
      *PS* en DN groter dan 5000 bar;


      f. veiligheidsappendages en onder druk staande appendages, bestemd voor drukapparatuur als bedoeld onder a tot en
      met e.
    url: https://wetten.overheid.nl/BWBR0010586/2006-04-01#Artikel7
  - number: '8'
    text: |-
      1 De volgende samenstellen, waarin ten minste één drukapparaat als bedoeld in [artikel 7][ref1] is opgenomen,
      voldoen aan de essentiële veiligheidseisen, genoemd in bijlage I bij de richtlijn.Het betreft:

      a. samenstellen voor de productie van stoom en oververhit water met een temperatuur hoger dan 110 °C waarin ten
      minste één brandstofgestookt of anderszins verwarmd drukapparaat waarbij gevaar voor oververhitting bestaat, is
      opgenomen;

      b. andere dan onder punt a. bedoelde samenstellen, wanneer deze door de fabrikant bestemd zijn om als samenstellen
      in de handel gebracht en in gebruik genomen te worden.

      2 In afwijking van het eerste lid, voldoen manueel met vaste brandstoffen gestookte samenstellen voor de productie
      van warm water waarvan de watertemperatuur ten hoogste 110 °C en het product van *PS* en *V* meer bedraagt dan
      50 bar.L en waarin ten minste één drukapparaat als bedoeld in [artikel 7][ref2] is opgenomen, aan de essentiële
      veiligheidseisen, genoemd in de punten 2.10, 2.11, 3.4, 5a) en 5d) van bijlage I bij de richtlijn.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing op druksystemen, waarin ten minste één drukapparaat
      als bedoeld in [artikel 7][ref3] is opgenomen, met uitzondering van het aanbrengen van de CE-markering, bedoeld
      in [artikel 16][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel7
