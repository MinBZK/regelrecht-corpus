  - number: '14'
    text: |-
      1 Van voorgenomen wijzigingen in drukapparatuur of samenstellen of het type hiervan waarvoor een verklaring van
      EG-typeonderzoek of EG-ontwerponderzoek is afgegeven of van voorgenomen wijzigingen in een kwaliteitssysteem
      waarvoor een goedkeuring is verleend overeenkomstig bijlage III bij de richtlijn, wordt de aangewezen aangemelde
      keuringsinstelling die in het bezit is van de technische documentatie van de drukapparatuur of samenstellen,
      onverwijld in kennis gesteld.

      2 De keuringsinstelling, bedoeld in het eerste lid, beoordeelt de wijzigingen en deelt schriftelijk mee of de
      verklaring van EG-typeonderzoek of EG-ontwerponderzoek onderscheidenlijk het goedgekeurde kwaliteitssysteem voor
      de te wijzigen drukapparatuur of samenstellen of het te wijzigen type hiervan geldig is of aanvullingen behoeft dan
      wel dat het kwaliteitssysteem opnieuw moet worden beoordeeld.

      3 Indien de keuringsinstelling, bedoeld in het eerste lid, van oordeel is dat de wijzigingen van invloed kunnen
      zijn op de overeenstemming met de in bijlage I bij de richtlijn opgenomen essentiële veiligheidseisen, wordt de
      gewijzigde drukapparatuur of samenstellen of het gewijzigde type hiervan aan een aanvullend EG-typeonderzoek of
      EG-ontwerponderzoek, onderscheidenlijk wordt het kwaliteitssysteem aan een aanvullende beoordeling, bedoeld in
      bijlage III bij de richtlijn, onderworpen. Bij goedkeuring van het EG-typeonderzoek of het EG-ontwerponderzoek
      wordt een aanvulling op de oorspronkelijke verklaring afgegeven. Een aanvullende beoordeling van het gewijzigde
      kwaliteitssysteem wordt vastgelegd in een rapport. Bij goedkeuring van het gewijzigde kwaliteitssysteem wordt een
      aanvulling op de oorspronkelijke goedkeuring afgegeven.

      4 Dit artikel is, met inachtneming van [artikel 12a, tweede lid][ref1], van overeenkomstige toepassing op
      druksystemen.


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel12a
