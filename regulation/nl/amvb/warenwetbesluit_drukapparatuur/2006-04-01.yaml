articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. wet: [Warenwet][ref1];

      b. richtlijn: [richtlijn nr.97/23/EG](31997L0023) van het Europees Parlement en de Raad van de Europese Unie van 29
      mei 1997 (PbEG L 181) inzake de onderlinge aanpassing van de wetgevingen der lidstaten betreffende drukapparatuur;

      c.

      d. Europese Economische Ruimte: het grondgebied waarop de Overeenkomst betreffende de Europese Economische Ruimte
      van toepassing is;

      e. drukapparatuur of drukapparaten: drukvaten, installatieleidingen, veiligheidsappendages en onder druk staande
      appendages, alsmede, voor zover van toepassing, de elementen die bevestigd zijn aan onder druk staande delen;

      f. drukvat: een omhulling, bestaande uit één of meer ruimten, die is ontworpen en vervaardigd voor stoffen onder
      druk, met inbegrip van de rechtstreeks daarmee verbonden delen tot aan de voorziening voor de aansluiting met
      andere apparatuur;

      g. installatieleidingen: onderdelen van een leidingstelsel die voor de verplaatsing van stoffen dienen, wanneer zij
      zijn verbonden om in een ander onder druk staand systeem te worden geïntegreerd, met name bestaande uit een pijp of
      een pijpenstelsel, buizen, fittingen, expansieverbindingen en slangen of eventueel andere onder druk staande delen
      alsmede warmtewisselaars bestaande uit pijpen voor het koelen of verhitten van lucht;

      h. veiligheidsappendages: voorzieningen voor de beveiliging van drukapparatuur tegen overschrijding van de
      toegestane grenzen, die bestaan uit:

      1°. voorzieningen voor de rechtstreekse drukbegrenzing, en

      2°. begrenzingsvoorzieningen die corrigerende organen in werking stellen of zorgen voor vergrendeling of voor
      vergrendeling en blokkering;

      i. onder druk staande appendages: voorzieningen met een operationele functie waarvan de omhulling onder druk staat;

      j. samenstellen: verschillende drukapparaten die een fabrikant tot een geïntegreerd en functioneel geheel heeft
      geassembleerd;

      k. druksysteem: een stelsel van verschillende drukapparaten of samenstellen die onder de verantwoordelijkheid van
      de gebruiker op zijn bedrijfsterrein tot een geïntegreerd en functioneel geheel is geassembleerd;

      l. druk: de druk gerelateerd aan de atmosferische druk, zijnde de overdruk, waarbij een vacuüm of onderdruk met een
      negatieve waarde wordt aangeduid;

      m. maximaal toelaatbare druk (*PS*): de door de fabrikant aangegeven maximale druk waarvoor de apparatuur
      is ontworpen. Deze druk wordt bepaald op een door de fabrikant aangegeven plaats waar de beveiligings- of
      veiligheidsinrichtingen zijn aangesloten of de bovenzijde van de apparatuur, of, indien dat niet passend is, een
      andere door hem aangegeven plaats;

      n. maximaal of minimaal toelaatbare temperatuur (*TS*): de maximaal of minimaal door de fabrikant opgegeven
      temperatuur waarvoor de apparatuur is ontworpen;

      o. volume (*V*): het inwendige volume van een ruimte met inbegrip van het volume van tubulures tot de eerste
      aansluiting en met uitsluiting van de inhoud van het volume van permanente inwendige onderdelen;

      p. nominale maat (DN): getalsaanduiding voor afmeting, gebruikt voor alle onderdelen van een leidingstelsel,
      behalve voor onderdelen die met de uitwendige middellijn of met de maat van de schroefdraad wordt aangeduid. De
      getalsaanduiding betreft een gemakkelijk rond getal voor verwijzingsdoeleinden, dat slechts in oppervlakkig verband
      staat tot de fabricagematen. De nominale maat wordt aangegeven met DN, gevolgd door een getal;

      q. stoffen: gassen, vloeistoffen en dampen in zuivere fase en mengsels daarvan, die een suspensie van vaste stoffen
      kunnen bevatten;

      r. permanente verbindingen: verbindingen die alleen met destructieve methoden losgemaakt kunnen worden;

      s. Europese materiaalgoedkeuring: technisch document, waarin bij het ontbreken van een geharmoniseerde norm
      de kenmerken van bij herhaalde toepassing bestemde materialen voor de fabricage van drukapparatuur worden
      gedefinieerd;

      t. aangewezen keuringsinstelling: een krachtens [artikel 7a van de wet][ref2] aangewezen keuringsinstelling;

      u. aangewezen aangemelde keuringsinstelling en aangewezen aangemelde onafhankelijke instelling: een krachtens
      [artikel 7a van de wet][ref3] in het kader van de richtlijn aangewezen en bij de Commissie van de Europese
      Gemeenschappen aangemelde keuringsinstelling of onafhankelijke instelling, dan wel een door een andere staat die
      partij is bij de Overeenkomst betreffende de Europese Economische Ruimte in het kader van de richtlijn aangewezen
      en bij de Commissie van de Europese Gemeenschappen aangemelde keuringsinstantie of onafhankelijke instelling;

      v. aangewezen keuringsdienst van gebruikers: een krachtens [artikel 7a van de wet][ref4] aangewezen keuringsdienst;

      w. aangewezen aangemelde keuringsdienst van gebruikers: een krachtens [artikel 7a van de wet][ref5] in het kader
      van de richtlijn aangewezen en bij de Commissie van de Europese Gemeenschappen aangemelde keuringsdienst dan
      wel, indien deze aanwijzing heeft plaatsgevonden, een door een andere lidstaat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte bij de Commissie van de Europese Gemeenschappen in het kader van de
      richtlijn aangewezen en aangemelde keuringsdienst van gebruikers.


