  - number: 12e
    text: |-
      1 De verklaring van ingebruikneming, bedoeld in [artikel 12b, tweede lid][ref1], en de verklaring van
      intredekeuring en ingebruikneming, bedoeld in [artikel 12d, tweede lid][ref2], gaan vergezeld van een aantekenblad.

      2 Op een aantekenblad worden de bevindingen van elke verrichting aan de drukapparatuur vermeld, met, indien van
      toepassing, verwijzing naar verklaringen en bijbehorende rapporten, totdat de drukapparatuur is afgekeurd hetzij
      onklaar is gemaakt hetzij anderszins kennelijk niet meer voor gebruik is bestemd.

      3 Uitsluitend de betrokken aangewezen keuringsinstelling of de aangewezen keuringsdienst van gebruikers is bevoegd
      op het aantekenblad aantekeningen te maken.


