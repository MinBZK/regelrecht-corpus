        artikel: '8'
        hoofdstuk: II
  - number: '17'
    text: >-
      1 Drukapparatuur en samenstellen die zijn voorzien van de CE-markering en vergezeld gaan van de EG-verklaring van
      overeenstemming worden vermoed te voldoen aan dit besluit, voor zover de voorschriften betrekking hebben op het
      ontwerp, de fabricage en de beoordeling van de overeenstemming.


      2 Druksystemen die vergezeld gaan van de verklaring van overeenstemming worden vermoed te voldoen aan dit
      besluit, voor zover de voorschriften betrekking hebben op het ontwerp, de fabricage en de beoordeling van de
      overeenstemming.
    url: https://wetten.overheid.nl/BWBR0010586/2006-04-01#Artikel17
  - number: '18'
    text: >-
      1 De Europese materiaalgoedkeuring wordt op verzoek van één of meer materiaal- of drukapparatuurfabrikanten
      verleend door een hiertoe aangewezen aangemelde keuringsinstelling.


      2 De voor de fabricage van drukapparatuur gebruikte materialen die voldoen aan de Europese materiaalgoedkeuringen
      waarvan de referenties door de Commissie van de Europese Gemeenschappen zijn gepubliceerd in het Publicatieblad
      van de Europese Gemeenschappen, worden geacht te voldoen aan de daarop van toepassing zijnde essentiële
      veiligheidseisen, bedoeld in bijlage I bij de richtlijn.
    url: https://wetten.overheid.nl/BWBR0010586/2006-04-01#Artikel18
  - number: 18a
    text: >-
      Met uitzondering van de verklaring van EG-typeonderzoek, de verklaring van EG-ontwerponderzoek, de EG-verklaring
      van overeenstemming en de goedkeuring van het kwaliteitssysteem als bedoeld in bijlage III bij de richtlijn, kunnen
      bij ministeriële regeling ten aanzien van de inhoud en geldigheidsduur van verklaringen en goedkeuringen nadere
      regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0010586/2006-04-01#Artikel18a
  - number: '19'
    text: |-
      1 De aangewezen aangemelde keuringsinstelling of aangewezen keuringsinstelling trekt een door haar afgegeven
      verklaring van EG-typeonderzoek, onderscheidenlijk typeonderzoek of EG-ontwerponderzoek, onderscheidenlijk
      ontwerponderzoek of een verleende goedkeuring van het kwaliteitssysteem als bedoeld in bijlage III bij de
      richtlijn, onderscheidenlijk [artikel 12a, tweede lid][ref1], in, indien de essentiële veiligheidseisen of de
      voorgeschreven gebruiksomstandigheden, bedoeld in bijlage I bij de richtlijn, zodanig zijn gewijzigd dat het type,
      het ontwerp of het kwaliteitssysteem niet meer voldoet aan de gewijzigde eisen op het tijdstip waarop deze volgens
      de richtlijn van toepassing zijn.

      2 De aangewezen aangemelde keuringsinstelling trekt een door haar verleende Europese materiaalgoedkeuring in,
      indien naar haar oordeel deze goedkeuring niet verleend had mogen worden of indien de materiaalsoort onder een
      geharmoniseerde norm valt.

      3 Een aangewezen keuringsinstelling of aangewezen keuringsdienst van gebruikers trekt een door haar afgegeven
      verklaring van ingebruikneming, een verklaring van herkeuring, of een verklaring van intredekeuring en
      ingebruikneming in, indien de drukapparatuur niet meer voldoet aan de eisen, bedoeld in [artikel 12b][ref2],
      onderscheidenlijk [artikel 12c][ref3], onderscheidenlijk [artikel 12d][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel12a
