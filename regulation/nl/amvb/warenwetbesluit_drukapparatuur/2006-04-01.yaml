  - number: '13'
    text: |-
      1 Gedurende tien jaar na de vervaardiging van drukapparatuur of samenstellen of indien deze in een serie zijn
      vervaardigd, na de vervaardiging van de laatste drukapparatuur of samenstellen, bewaart de fabrikant overeenkomstig
      bijlage III bij de richtlijn, voor zover van toepassing, de technische documentatie, een afschrift van de EG-
      verklaring van overeenstemming, een afschrift van de verklaring van EG-typeonderzoek of EG-ontwerponderzoek
      inclusief de aanvullingen daarop, alsmede de gegevens, bedoeld in punt 5 van module D, onderscheidenlijk punt 6 van
      module D1, onderscheidenlijk punt 5 van module E, onderscheidenlijk punt 6 van module E1, onderscheidenlijk punt 5
      van module H van bijlage III bij de richtlijn.

      2 Indien de fabrikant niet in de Europese Economische Ruimte is gevestigd is het eerste lid van toepassing op
      degene die de drukapparatuur of samenstellen in de Europese Economische Ruimte in de handel brengt.

      3 Zolang het druksysteem, bedoeld in [artikel 8, derde lid][ref1], in werking is of in werking kan worden gesteld,
      bewaart de gebruiker, voor zover van toepassing, de technische documentatie, de verklaring van overeenstemming,
      de verklaring van typeonderzoek of ontwerponderzoek inclusief de aanvullingen daarop, alsmede de overeenkomstige
      gegevens als bedoeld in punt 5 van module D, onderscheidenlijk punt 6 van module D1, onderscheidenlijk punt 5
      van module E, onderscheidenlijk punt 6 van module E1, onderscheidenlijk punt 5 van module H van bijlage III bij
      de richtlijn.

      4 Zolang de drukapparatuur, samenstellen of druksystemen in werking zijn of in werking kunnen worden
      gesteld bewaart de gebruiker, voor zover van toepassing, de EG-verklaring van overeenstemming, de
      gebruiksaanwijzing, bedoeld in bijlage I, punt 3.4, bij de richtlijn, de verklaring van ingebruikneming,
      bedoeld in [artikel 12b, tweede lid][ref2], de voorlopige verklaring van ingebruikneming, bedoeld in
      [artikel 12b, twaalfde lid][ref3], de verklaringen van herkeuring, bedoeld in [artikel 12c, tweede lid][ref4],
      het aantekenblad, bedoeld in [artikel 12e, eerste lid][ref5], de verklaring van intredekeuring en ingebruikneming,
      bedoeld in [artikel 12d, tweede lid][ref6], het vervaardigingsbewijs, bedoeld in [artikel 39, vierde lid][ref7] en
      de bij beoordelingen en keuringen behorende rapporten.


