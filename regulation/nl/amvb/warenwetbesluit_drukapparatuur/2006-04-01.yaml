  - number: '3'
    text: |-
      1 Dit besluit is van toepassing op het ontwerp, de fabricage, de overeenstemmingsbeoordeling, de ingebruikneming en
      het gebruik van drukapparatuur, samenstellen en druksystemen waarvan de maximaal toelaatbare druk (*PS*) meer dan
      0,5 bar bedraagt.

      2 Dit besluit en de daarop berustende bepalingen zijn eveneens van toepassing op drukapparatuur, samenstellen en
      druksystemen indien deze onroerend zijn.

      3 De [artikelen 12b][ref1], [12c][ref2], [12d][ref3] en [14a][ref4] zijn niet van toepassing ten aanzien van
      draagbare brandblussers als bedoeld in [artikel 1 van het Besluit draagbare blustoestellen 1997][ref5] en op
      snelkookpannen als bedoeld in bijlage II, tabel 5, bij de richtlijn.


