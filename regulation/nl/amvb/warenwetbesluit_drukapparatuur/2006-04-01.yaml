  - number: '21'
    text: >-
      Een aangewezen aangemelde onafhankelijke instelling is belast met de taken, bedoeld in de punten 3.1.2 en 3.1.3 van
      bijlage I bij de richtlijn.
    url: https://wetten.overheid.nl/BWBR0010586/2006-04-01#Artikel21
  - number: '22'
    text: |-
      1 Een aangewezen keuringsdienst van gebruikers en een aangewezen aangemelde keuringsdienst van gebruikers
      werkt uitsluitend voor de groep waarvan hij deel uitmaakt, welke groep een gemeenschappelijk veiligheidsbeleid
      hanteert ten aanzien van de technische specificaties voor ontwerp, fabricage, controle, onderhoud en gebruik van
      drukapparatuur, samenstellen en druksystemen.

      2 Een aangewezen aangemelde keuringsdienst van gebruikers is belast met de toepassing van de procedures voor
      de beoordeling van de overeenstemming, bedoeld in de [artikelen 11][ref1] en [12][ref2], en hanteert hierbij de
      modules A1, C1, F of G, bedoeld in bijlage III bij de richtlijn,

      3 Een aangewezen keuringsdienst van gebruikers is belast met de volgende taken voorzover hiervoor aangewezen:

      a. de toepassing van de procedures voor de beoordeling van de overeenstemming, bedoeld in [artikel 12a][ref3], en
      hanteert hierbij de modules A1, C1, F of G, bedoeld in bijlage III bij de richtlijn,

      b. de keuring voor ingebruikneming, bedoeld in [artikel 12b][ref4];

      c. de herkeuring, bedoeld in [artikel 12c][ref5];

      d. de intredekeuring, bedoeld in [artikel 12d][ref6];

      e. de beoordelingen en de onderzoeken, bedoeld in [artikel 14][ref7], voorzover deze betrekking hebben op
      druksystemen;

      f. de beoordelingen en de onderzoeken, bedoeld in [artikel 14a][ref8].

      4 Drukapparatuur en samenstellen waarvan de overeenstemming is beoordeeld door een aangewezen aangemelde
      keuringsdienst van gebruikers en druksystemen waarvan de overeenstemming is beoordeeld door een aangewezen
      keuringsdienst van gebruikers, dragen geen CE-markering en worden uitsluitend gebruikt in vestigingen die behoren
      tot de groep waarvan de betreffende keuringsdienst deel uitmaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel11
