        artikel: 12a
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0010586
        artikel: 12a
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0002108
      - id: ref4
        bwb_id: BWBR0003245
  - number: 39a
    text: |-
      1 De [artikelen 12b][ref1] en [23a][ref2] zijn niet van toepassing op drukapparatuur, samenstellen en druksystemen
      die reeds in gebruik zijn gesteld op de dag van inwerkingtreding van het besluit tot wijziging van het Besluit
      drukapparatuur houdende regels inzake de samenbouw van druksystemen en de ingebruikneming van drukapparatuur,
      samenstellen en druksystemen en tot wijziging van enige andere besluiten (Stb. 2001, 339) en die voldoen aan de
      wettelijke voorschriften ten aanzien van de ingebruikneming zoals die luidden op de dag voor inwerkingtreding van
      voornoemd besluit tot het tijdstip waarop deze apparatuur na montage wordt opgesteld en geïnstalleerd op een nieuwe
      plaats van opstelling.

      2 Voor de toepassing van dit besluit wordt een vergunning voor het in werking brengen van stoomtoestellen of
      damptoestellen op grond van de [Stoomwet][ref3] onderscheidenlijk een verklaring voor het in werking brengen van
      toestellen onder druk in het kader van de toepassing van de [Wet Milieubeheer][ref4] aangemerkt als een verklaring
      van ingebruikneming als bedoeld in [artikel 12b, tweede lid][ref5], tot het tijdstip waarop de apparatuur na
      montage wordt opgesteld en geïnstalleerd op een nieuwe plaats van opstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel12b
      [ref2]: https://wetten.overheid.nl/BWBR0010586#Artikel23a
      [ref3]: https://wetten.overheid.nl/BWBR0002108
