  - number: 39b
    text: |-
      1 [Artikel 12c][ref1] is niet van toepassing op drukapparatuur die reeds in gebruik is gesteld voor de dag van
      inwerkingtreding van het besluit tot wijziging van het Warenwetbesluit drukapparatuur houdende regels inzake het
      gebruik van drukapparatuur, samenstellen en druksystemen en enige andere algemene maatregelen van bestuur (Stb.
      2004, 387) en die voldoet aan de wettelijke voorschriften ten aanzien van het gebruik zoals die luidden op de dag
      voor inwerkingtreding van voornoemd besluit tot het tijdstip waarop deze apparatuur een eerstvolgende herkeuring
      ingevolge voornoemde wettelijke voorschriften had moeten ondergaan.

      2 [Artikel 12c][ref2] is niet van toepassing op drukapparatuur die reeds in gebruik is gesteld op de dag van
      inwerkingtreding van het besluit, bedoeld in het eerste lid, en waarvoor geen herkeuring ingevolge de wettelijke
      voorschriften, bedoeld in het eerste lid, is vereist.

      3 Bij ministeriele regeling kunnen, in afwijking van het tweede lid, om veiligheidstechnische redenen nadere regels
      worden gesteld.

      4 Een aanvraag om een herkeuring van drukapparatuur op grond van een wettelijk voorschrift, gedaan voor het
      tijdstip van inwerkingtreding van het besluit, bedoeld in het eerste lid, waarbij over het resultaat van de
      herkeuring op dat tijdstip nog niet is beslist, wordt vanaf dat tijdstip beschouwd als een aanvraag om een
      verklaring van herkeuring als bedoeld in [artikel 12c, derde lid][ref3].

      5 Voor de toepassing van [artikel 12c, zesde lid][ref4], wordt rekening gehouden met de onderzoeken ingevolge de
      wettelijke voorschriften ten aanzien van het gebruik zoals die luidden op de dag voor de inwerkingtreding van het
      besluit, bedoeld in het eerste lid.


