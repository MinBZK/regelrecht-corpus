  - number: '4'
    text: >-
      1 Het is verboden drukapparatuur, samenstellen en druksystemen te verhandelen, in bedrijf te stellen of te
      gebruiken, die niet voldoen aan de vervaardigingsvoorschriften gesteld bij of krachtens dit besluit.


      2 Het is verboden drukapparatuur, samenstellen en druksystemen te verhandelen of te gebruiken anders dan met
      inachtneming van de voorschriften bij of krachtens dit besluit gesteld met betrekking tot de aanduiding en het
      bezigen van vermeldingen.


      3 Het is verboden drukapparatuur, samenstellen en druksystemen te verhandelen of te gebruiken, indien de bij of
      krachtens dit besluit voorgeschreven beoordelings- en keuringsprocedures niet in acht zijn genomen.


      4 Het is verboden drukapparatuur, samenstellen en druksystemen te gebruiken anders dan met inachtneming van de
      voorschriften bij of krachtens dit besluit gesteld met betrekking tot het voorhanden zijn van documenten.
    url: https://wetten.overheid.nl/BWBR0010586/2006-04-01#Artikel4
  - number: '5'
    text: >-
      Drukapparatuur, samenstellen en druksystemen zijn zodanig ontworpen en vervaardigd, hebben zodanige eigenschappen
      en zijn van zodanige vermeldingen voorzien dat zij geen gevaar opleveren voor de veiligheid of gezondheid van de
      mens of voor de veiligheid van zaken, wanneer zij op passende wijze worden geïnstalleerd en onderhouden en worden
      gebruikt voor het doel waarvoor zij zijn bestemd.
    url: https://wetten.overheid.nl/BWBR0010586/2006-04-01#Artikel5
  - number: '6'
    text: |-
      1 De drukapparatuur en samenstellen, bedoeld in [artikel 7][ref1], onderscheidenlijk [artikel 8][ref2], worden
      overeenkomstig bijlage II bij de richtlijn naar toenemend risico in categorieën ingedeeld. Indien drukapparatuur
      uit verschillende ruimten bestaat, wordt het ingedeeld in de hoogste van de verschillende categorieën van de
      afzonderlijke ruimten. Wanneer een ruimte verschillende stoffen bevat, vindt de indeling plaats op grond van de
      stof die in de hoogste categorie valt.

      2 Met het oog op de categorie-indeling, bedoeld in het eerste lid, worden stoffen ingedeeld in:

      a. groep 1: gevaarlijke stoffen, dat wil zeggen stoffen of preparaten, die op grond van de
      [Wet milieugevaarlijke stoffen][ref3] moeten worden ingedeeld in de categorie ontplofbaar, zeer licht ontvlambaar,
      licht ontvlambaar, ontvlambaar, zeer vergiftig, vergiftig of oxyderend;

      b. groep 2: overige stoffen.

      3 Het eerste en tweede lid ten aanzien van samenstellen, zijn van overeenkomstige toepassing op druksystemen.


