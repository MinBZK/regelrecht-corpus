  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van de Staatssecretaris van Sociale Zaken en Werkgelegenheid, J.F. Hoogervorst van 5 maart 1999,
    directie Arbeidsomstandigheden, nr. ARBO/APM/99/9253, gedaan in overeenstemming met Onze Ministers van Economische
    Zaken, Verkeer en Waterstaat, Volksgezondheid, Welzijn en Sport, Volkshuisvesting, Ruimtelijke Ordening en
    Milieubeheer en de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties;


    Gelet op richtlijn nr. 97/23/EG van het Europees Parlement en de Raad van de Europese Unie van 29 mei 1997 inzake
    de onderlinge aanpassing van de wetgevingen der lidstaten betreffende drukapparatuur (PbEG L 181);


    Gelet op de artikelen 1, eerste lid, aanhef, en onderdelen a en b, 2, 3, eerste en tweede lid, 5, 6, 12, derde lid,
    en 25a van de Wet op de gevaarlijke werktuigen, artikel 17, eerste lid, van de Brandweerwet 1985, artikel 9, eerste
    lid, onder a, van de Mijnwet 1903, artikel 26, eerste lid, onder b, van de Mijnwet continentaal plat, artikel 8.40
    van de Wet milieubeheer, en de artikelen 2, 3, 4, 6, 21, aanhef en onderdeel c, van de Stoomwet;


    De Raad van State gehoord (advies van 6 mei 1999, no. W12.99.0108/IV);


    Gezien het nader rapport van de Staatssecretaris van Sociale Zaken en Werkgelegenheid, J.F. Hoogervorst van 30 juni
    1999, directie Arbeidsomstandigheden, nr. ARBO/APM/99/26935, uitgebracht in overeenstemming met Onze Ministers van
