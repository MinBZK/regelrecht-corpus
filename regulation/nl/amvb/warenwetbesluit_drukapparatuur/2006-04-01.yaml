  - number: 14a
    text: |-
      1 Op voorgenomen wijzigingen of reparaties, met uitzondering van het reguliere technische onderhoud, aan
      drukapparatuur, bedoeld in [artikel 12c, eerste lid][ref1], is bijlage I, met uitzondering van punt 3.3, bij de
      richtlijn van overeenkomstige toepassing, tenzij dit redelijkerwijs niet mogelijk is.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de wijze waarop de wijzigingen
      en reparaties worden uitgevoerd.

      3 Van voorgenomen wijzigingen of reparaties aan drukapparatuur, bedoeld in het eerste lid, wordt een aangewezen
      keuringsinstelling of een aangewezen keuringsdienst van gebruikers door de gebruiker onverwijld in kennis gesteld.

      4 De instelling of dienst, bedoeld in het derde lid, verricht de noodzakelijke onderzoeken aan het ontwerp
      en de constructie van de voorgenomen wijziging of reparatie waarbij, voorzover van toepassing, rekening wordt
      gehouden met eerder uitgevoerd onderzoek en verricht tijdens de uitvoering van de wijziging of reparatie passende
      onderzoeken en proeven.

      5 Bij ministeriële regeling kunnen ten aanzien van de onderzoeken en proeven, bedoeld in het vierde lid, nadere
      regels worden gesteld en kan worden bepaald dat de onderzoeken en proeven ten behoeve van een reparatie of een
      constructieve wijziging door de gebruiker worden uitgevoerd onder toezicht van de instelling, bedoeld in het derde
      lid, met inachtneming van de bij die regeling gestelde regels.

      6 Indien de wijzigingen of reparaties aan de drukapparatuur, bedoeld in het eerste lid, van invloed zijn op de
      wijze van gebruik, de uitrusting of de opstelling, beoordeelt de instelling of dienst, bedoeld in het derde lid, de
      integratie en beveiliging.

      7 Met betrekking tot de gewijzigde of gerepareerde apparatuur worden door de instelling of dienst, bedoeld in het
      derde lid, zo nodig, de onderzoeken, bedoeld in [artikel 12b, zesde lid][ref2], uitgevoerd.

      8 Met betrekking tot voorgenomen wijzigingen aan drukapparatuur dat in gebruik is en voor de voorgenomen wijziging
      niet valt onder de drukapparatuur, bedoeld in [artikel 12c, eerste lid][ref3], maar na de voorgenomen wijziging
      daar wel onder valt, is het eerste tot en met het zevende lid van overeenkomstige toepassing, alsmede worden
      door de dienst of instelling, bedoeld in het derde lid, of de gebruiker, bedoeld in het vijfde lid, zo nodig, de
      onderzoeken, bedoeld in [artikel 12c, zesde lid][ref4], uitgevoerd.

      9 De instelling of dienst, bedoeld in het derde lid, stelt een rapport op van de beoordelingen, bedoeld in het
      vierde en zesde lid, van het toezicht, bedoeld in het vierde en vijfde lid, en van de onderzoeken, bedoeld in het
      zevende en achtste lid, en stelt een exemplaar van dit rapport beschikbaar aan de gebruiker.

      10 Indien is gebleken dat tegen het verder gebruik van de drukapparatuur geen bezwaar bestaat, wordt door de
      instelling of dienst, bedoeld in het derde lid, voorzover van toepassing,

      a. een aanvulling op de verklaring van ingebruikneming of de verklaring van intredekeuring en ingebruikneming
      gegeven, of

      b. een verklaring van ingebruikneming afgegeven indien het achtste lid van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel12c
      [ref2]: https://wetten.overheid.nl/BWBR0010586#Artikel12b
      [ref3]: https://wetten.overheid.nl/BWBR0010586#Artikel12c
      [ref4]: https://wetten.overheid.nl/BWBR0010586#Artikel12c
