  - number: 19a
    text: >-
      1 Als aangewezen keuringsinstelling, aangewezen aangemelde keuringsinstelling of aangewezen aangemelde
      onafhankelijke instelling kan worden aangewezen een instelling die:


      a. rechtspersoonlijkheid heeft;


      b. haar zetel of een vestiging in Nederland heeft;


      c. onafhankelijk is van degenen die bij het resultaat van de uitvoering van de taken waarvoor zij is aangewezen
      belang hebben;


      d. beschikt over voldoende deskundigheid en outillage om de uitvoering van de taken waarvoor zij is aangewezen,
      naar behoren te kunnen vervullen;


      e. beschikt over een behoorlijke administratie waarin de gegevens die samenhangen met en betrekking hebben op
      de uitvoering van haar taken, op een systematische wijze zijn vastgelegd. Aan de hand van deze gegevens zijn
      de gekeurde drukapparatuur, samenstellen en druksystemen, alsmede de onderzochte kwaliteitssystemen afdoende te
      identificeren;


      f. naar behoren functioneert.


      2 Als aangewezen keuringsdienst van gebruikers of als aangewezen aangemelde keuringsdienst van gebruikers kan
      worden aangewezen een keuringsdienst die voldoet aan de voorschriften, genoemd in het eerste lid onder b tot en
      met f.


      3 In aanvulling op het eerste lid komen voor een aanwijzing als aangewezen aangemelde keuringsinstelling of als
      aangewezen aangemelde onafhankelijke instelling slechts in aanmerking instellingen die ten minste voldoen aan de in
      bijlage IV van de richtlijn neergelegde voorwaarden.


      4 In aanvulling op het tweede lid komen voor een aanwijzing als aangewezen aangemelde keuringsdienst van gebruikers
      slechts in aanmerking keuringsdiensten die ten minste voldoen aan de in bijlage V van de richtlijn neergelegde
      voorwaarden en handelen overeenkomstig het gemeenschappelijk veiligheidsbeleid van de groep waartoe zij behoren.


      5 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het eerste en tweede lid.


      6 Een keuringsdienst van gebruikers die deel uitmaakt van een mijnbouwonderneming wordt aangewezen door Onze
      Minister in overeenstemming met Onze Minister van Economische Zaken.
    url: https://wetten.overheid.nl/BWBR0010586/2006-04-01#Artikel19a
  - number: '20'
    text: |-
      1 Een aangewezen aangemelde keuringsinstelling is belast met de volgende taken, voorzover hiervoor aangewezen:

      a. de toepassing van de procedures voor de beoordeling van de overeenstemming, bedoeld in de [artikelen 11][ref1]
      en [12][ref2];

      b. de Europese materiaalgoedkeuring, bedoeld in [artikel 18][ref3];

      c. de beoordelingen en de onderzoeken, bedoeld in [artikel 14][ref4].

      2 Een aangewezen keuringsinstelling is belast met de volgende taken, voorzover hiervoor aangewezen:

      a. de toepassing van de procedures voor de beoordeling van de overeenstemming, bedoeld in [artikel 12a][ref5];

      b. de keuring voor ingebruikneming, bedoeld in [artikel 12b][ref6];

      c. de herkeuring, bedoeld in [artikel 12c][ref7];

      d. de intredekeuring, bedoeld in [artikel 12d][ref8];

      e. de beoordelingen en de onderzoeken, bedoeld in [artikel 14][ref9], voorzover deze betrekking hebben op
      druksystemen;

      f. de beoordelingen en de onderzoeken, bedoeld in [artikel 14a][ref10].


