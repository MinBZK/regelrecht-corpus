  - number: 12d
    text: |-
      1 Dit artikel is van toepassing op drukapparatuur, die voor 29 mei 2002 is vervaardigd overeenkomstig de
      wettelijke voorschriften van één van de staten, met uitzondering van Nederland, die partij zijn bij de Overeenkomst
      betreffende de Europese Economische Ruimte en voor genoemde datum niet in overeenstemming is gebracht met de
      richtlijn en die op grond van [artikel 12c, eerste lid][ref1], is aangewezen.

      2 Alvorens de drukapparatuur, bedoeld in het eerste lid, in gebruik wordt genomen, wordt zij aan een intredekeuring
      onderworpen en gaat vergezeld van een verklaring van intredekeuring en ingebruikneming.

      3 De verklaring, bedoeld in het tweede lid, wordt, onder overlegging van de gegevens en bescheiden, vermeld in
      het vierde lid, schriftelijk door de gebruiker aangevraagd bij een aangewezen keuringsinstelling of een aangewezen
      keuringsdienst van gebruikers.

      4 De aanvraag, bedoeld in het derde lid, omvat voorzover van toepassing:

      a. naam en adres van de gebruiker en het adres van de plaats van opstelling van de drukapparatuur;

      b. de documenten omtrent het ontwerp, de vervaardiging en het toegestane gebruik van de drukapparatuur;

      c. de afgegeven verklaringen met bijbehorende rapporten met betrekking tot de drukapparatuur van
      keuringsinstellingen.

      5 [Artikel 12b, vijfde lid][ref2], is van overeenkomstige toepassing.

      6 De instelling of dienst, bedoeld in het derde lid, die de keuring uitvoert, verricht, voorzover van toepassing,
      de volgende onderzoeken:

      a. een beoordeling van het ontwerp naar het beoogde gebruiksdoel van de drukapparatuur;

      b. een beoordeling van de documenten die betrekking hebben op de vervaardiging van de drukapparatuur;

      c. een beoordeling van de integratie en beveiliging van de drukapparatuur;

      d. de onderzoeken, bedoeld in [artikel 12b, zesde lid][ref3];

      e. de onderzoeken, bedoeld in [artikel 12c, zesde lid][ref4].

      7 Met een goedkeuring van een beoordeling als bedoeld in het zesde lid, onder a en b, wordt gelijkgesteld een
      bewijs van goedkeuring afgegeven door een onafhankelijke instelling in een andere staat die partij is bij de
      Overeenkomst inzake de Europese Economische Ruimte, welk bewijs is afgegeven op basis van onderzoeken die aan ten
      minste gelijkwaardige eisen voldoen.

      8 Bij ministeriële regeling kunnen ten aanzien van de onderzoeken, bedoeld in het zesde lid, onder a en b, nadere
      regels worden gesteld.

      9 De instelling of dienst, bedoeld in het derde lid, stelt een rapport op van de intredekeuring, bedoeld in het
      tweede lid, en stelt een exemplaar van dit rapport beschikbaar aan de gebruiker. In dit rapport kunnen voorwaarden
      worden gesteld waaraan wordt voldaan alvorens een verklaring van intredekeuring en ingebruikneming wordt afgegeven.

      10 Door de instelling of dienst, bedoeld in het derde lid, wordt een verklaring als bedoeld in het tweede lid
      afgegeven, indien is gebleken dat tegen het in gebruik nemen van de drukapparatuur, bedoeld in het eerste lid, geen
      bezwaar bestaat.

      In deze verklaring:

      a. wordt de termijn vermeld waarbinnen de drukapparatuur uiterlijk aan een herkeuring als bedoeld in
      [artikel 12c][ref5] wordt onderworpen;

      b. kunnen gebruiksvoorwaarden worden gesteld.

      11 De verklaring, bedoeld in het tweede lid, kan betrekking hebben op één of meer drukapparaten.

      12 De gebruiker draagt er zorg voor dat de keuring, bedoeld in het tweede lid, veilig kan worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel12c
      [ref2]: https://wetten.overheid.nl/BWBR0010586#Artikel12b
