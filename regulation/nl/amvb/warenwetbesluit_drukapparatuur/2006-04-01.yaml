  - number: 22a
    text: |-
      De in [artikel 1, onder t, u, v en w][ref1], bedoelde instellingen of keuringsdiensten verstrekken jaarlijks aan
      Onze Minister een afschrift van de polis van de afgesloten verzekering tegen wettelijke aansprakelijkheid tegen
      alle risico's die voortvloeien uit de uitoefening van de taken waarvoor zij zijn aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel1
    url: https://wetten.overheid.nl/BWBR0010586/2006-04-01#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0010586
        artikel: '1'
        hoofdstuk: '1'
  - number: 22b
    text: |-
      1 Indien een wijziging plaatsvindt in de gegevens op grond waarvan de keuringsinstelling, de onafhankelijke
      instelling of de keuringsdienst van gebruikers is aangewezen, doet de instelling of dienst hiervan terstond
      mededeling aan Onze Minister.

      2 Indien een instelling of dienst voornemens is een of meer van de taken waarvoor zij is aangewezen, te beëindigen,
      doet zij hiervan terstond mededeling aan Onze Minister en de certificaathouders. In dat geval worden door de
      instelling of dienst de gegevens, bedoeld in [artikel 19a, eerste lid, onder e][ref1], overgedragen aan Onze
      Minister dan wel, na toestemming van Onze Minister en de certificaathouders, een andere instelling of dienst die
      voor dezelfde taken is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel19a
    url: https://wetten.overheid.nl/BWBR0010586/2006-04-01#Artikel22b
    references:
      - id: ref1
        bwb_id: BWBR0010586
        artikel: 19a
        hoofdstuk: IV
  - number: 22c
    text: |-
      1 Een aanvraag om aanwijzing gaat vergezeld van het bewijs dat is voldaan aan de criteria, bedoeld in
      [artikel 19a, eerste of tweede lid][ref1], dan wel in geval van [artikel 19a, derde of vierde lid][ref2], tevens
      van bewijs dat is voldaan aan de voorwaarden, bedoeld in het derde of vierde lid, dan wel van een verklaring
      waaruit de bereidheid blijkt om voor eigen rekening een onderzoek naar het voldoen aan deze criteria dan wel
      voorwaarden te ondergaan.

      2 Een aanwijzing kan worden geweigerd, dan wel worden gewijzigd of ingetrokken, indien niet of niet volledig
      is voldaan aan de bij de wet of bij of krachtens dit besluit gestelde voorschriften. Een aanwijzing kan worden
      ingetrokken indien de keuringsinstelling, onafhankelijke instelling of keuringsdienst gedurende een aaneengesloten
      periode van twee jaar geen werkzaamheden, waarvoor zij is aangewezen, heeft uitgevoerd.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel19a
      [ref2]: https://wetten.overheid.nl/BWBR0010586#Artikel19a
