  - number: 12a
    text: |-
      1 Druksystemen als bedoeld in [artikel 8, derde lid][ref1], worden, alvorens zij in gebruik worden genomen,
      onderworpen aan een procedure voor de beoordeling van overeenstemming overeenkomstig dit artikel en gaan vergezeld
      van een verklaring van overeenstemming. Op deze verklaring is bijlage VII bij de richtlijn van overeenkomstige
      toepassing.

      2 Voor de beoordeling van overeenstemming van druksystemen is [artikel 12, tweede en derde lid][ref2], van
      overeenkomstige toepassing. Voor de in bijlage III bij de richtlijn vermelde begrippen «fabrikant of zijn de in de
      Gemeenschap gevestigde gemachtigde» onderscheidenlijk «fabrikant» wordt gelezen: gebruiker, voor «EG-typeonderzoek»
      wordt gelezen: typeonderzoek, voor «EG-ontwerponderzoek» wordt gelezen: ontwerponderzoek, voor« aangemelde
      instantie» wordt gelezen: aangewezen keuringsinstelling of aangewezen keuringsdienst van gebruikers, voor «EG-
      verklaring van overeenstemming» wordt gelezen: verklaring van overeenstemming en voor «drukapparatuur» wordt
      gelezen: druksysteem.

      3 Met de onderzoeken in het kader van de beoordeling van overeenstemming, bedoeld in de [artikelen 11][ref3] en
      [12][ref4], wordt bij de toepassing van het tweede lid rekening gehouden.

      4 [Artikel 11, zesde lid][ref5], is van toepassing.


