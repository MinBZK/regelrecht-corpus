  - number: '9'
    text: |-
      1 Drukapparatuur, samenstellen of druksystemen met kenmerkende waarden beneden of gelijk aan de grenzen, bedoeld in
      [artikel 7][ref1], onderscheidenlijk [artikel 8][ref2], worden ontworpen en vervaardigd overeenkomstig de gebruiken
      van goed vakmanschap, om een veilig gebruik te waarborgen.

      2 De drukapparatuur of samenstellen, bedoeld in het eerste lid, gaan vergezeld van een toereikende
      gebruiksaanwijzing en markeringen, waarmee de fabrikant of diens in de Europese Economische Ruimte gevestigde
      gemachtigde kan worden geïdentificeerd. Op deze drukapparatuur en samenstellen wordt de CE-markering, bedoeld in
      [artikel 16][ref3], niet aangebracht.

      3 De druksystemen, bedoeld in het eerste lid, gaan vergezeld van een toereikende gebruiksaanwijzing en zijn
      voorzien van markeringen, waarmee de gebruiker onder wiens verantwoordelijkheid het druksysteem is ontworpen en
      vervaardigd, kan worden geïdentificeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel7
