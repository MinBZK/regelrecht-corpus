  - number: '10'
    text: >-
      Drukapparatuur en samenstellen die voldoen aan de door Onze Minister aangewezen geharmoniseerde normen worden in
      zoverre vermoed te voldoen aan de essentiële veiligheidseisen, bedoeld in bijlage I bij de richtlijn.
    url: https://wetten.overheid.nl/BWBR0010586/2006-04-01#Artikel10
  - number: '11'
    text: |-
      1 Drukapparatuur als bedoeld in [artikel 7][ref1] wordt door de fabrikant onderworpen aan een procedure voor
      de beoordeling van overeenstemming overeenkomstig dit artikel en is voorzien van de CE-markering, bedoeld in
      [artikel 16][ref2], en gaat vergezeld van de EG-verklaring van overeenstemming, bedoeld in bijlage VII bij de
      richtlijn, die de in deze bijlage genoemde gegevens bevat.

      2 De overeenkomstig bijlage III bij de richtlijn naar keuze van de fabrikant te volgen procedure voor
      de beoordeling van de overeenstemming van drukapparatuur wordt bepaald door de categorie, bedoeld in
      [artikel 6][ref3], waarin het drukapparaat is ingedeeld. De fabrikant kan, voor zover dat mogelijk is, een
      procedure volgen die bestemd is voor een hogere categorie.

      3 De CE-markering, bedoeld in het eerste lid, wordt, met inachtneming van [artikel 16][ref4], door de fabrikant
      uitsluitend aangebracht nadat toepassing is gegeven aan het tweede lid.

      4 Ten aanzien van kwaliteitsborgingsprocedures overeenkomstig bijlage III bij de richtlijn, voor drukapparatuur
      als bedoeld in [artikel 7, onderdeel a, onderdeel b ten eerste, en onderdeel c][ref5], en die op grond van
      [artikel 6][ref6] is ingedeeld in de categorieën III of IV, neemt de aangewezen aangemelde keuringsinstelling
      bij een onaangekondigd bezoek een monster van de drukapparatuur uit de fabricage- of opslagplaatsen om de
      eindcontrole, bedoeld in punt 3.2.2 van bijlage I bij de richtlijn, te verrichten. Daartoe stelt de fabrikant
      de aangewezen aangemelde keuringsinstelling in kennis van het beoogde productieschema. De aangewezen aangemelde
      keuringsinstelling legt in het eerste productiejaar ten minste twee bezoeken af. De frequentie van latere bezoeken
      wordt door de aangewezen aangemelde keuringsinstelling bepaald op basis van de criteria, genoemd in punt 4.4. van
      de desbetreffende procedures, bedoeld in bijlage III bij de richtlijn.

      5 De fabrikant stelt de aangewezen aangemelde keuringsinstelling in kennis van het beoogde
      productieschema, indien sprake is van een eenmalige productie van vaten en drukapparatuur als bedoeld in
      [artikel 7, eerste lid, onder c][ref7], en die op grond van [artikel 6][ref8] zijn ingedeeld in categorie III
      en die overeenkomstig module H als bedoeld in bijlage III bij de richtlijn worden geproduceerd en de aangewezen
      aangemelde keuringsinstelling de eindcontrole, bedoeld in punt 3.2.2 van bijlage I bij de richtlijn, verricht.

      6 De dossiers en de briefwisseling met betrekking tot de procedures voor de beoordeling van de overeenstemming
      worden gesteld in de Nederlandse taal of in een door de betrokken aangewezen aangemelde keuringsinstelling
      aanvaarde taal.


