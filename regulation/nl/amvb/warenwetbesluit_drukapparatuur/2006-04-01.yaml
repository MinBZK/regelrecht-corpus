  - number: 12b
    text: |-
      1 Bij ministeriële regeling wordt drukapparatuur aangewezen die overeenkomstig dit artikel wordt gekeurd.

      2 De drukapparatuur, bedoeld in het eerste lid, wordt, wanneer die wordt opgesteld en geïnstalleerd, gekeurd voor
      de eerste ingebruikneming alsmede na elke montage op een nieuwe plaats van opstelling en gaat vergezeld van een
      verklaring van ingebruikneming.

      3 De verklaring van ingebruikneming, bedoeld in het tweede lid, wordt onder overlegging van de gegevens en
      bescheiden, vermeld in het vierde lid, schriftelijk aangevraagd bij een aangewezen keuringsinstelling of een
      aangewezen keuringsdienst van gebruikers.

      4 De aanvraag, bedoeld in het derde lid, omvat, voorzover van toepassing:

      a. naam en adres van de gebruiker en de plaats waar de drukapparatuur staat opgesteld;

      b. de gebruiksaanwijzing, bedoeld in bijlage I, punt 3.4, bij de richtlijn, met inbegrip van de EG-
      verklaring van overeenstemming of de verklaring van overeenstemming en het aantekenblad, bedoeld in
      [artikel 12e, eerste lid][ref1];

      c. het vervaardigingsbewijs en het rapport, bedoeld in [artikel 39, vierde lid][ref2].

      5 De bescheiden, bedoeld in het vierde lid, onder b en c, kunnen met instemming van de instelling of dienst,
      bedoeld in het derde lid, in afwijking van het derde lid, beschikbaar worden gehouden op het moment van de keuring.

      6 De instelling of dienst, bedoeld in het derde lid, die de keuring, bedoeld in het tweede lid, uitvoert, verricht,
      voorzover van toepassing, de volgende onderzoeken:

      a. de verificatie van de drukapparatuur aan de hand van de gebruiksaanwijzing en markeringen;

      b. de controle van de uitwendige toestand van de drukapparatuur;

      c. de controle van de werking van de veiligheidsappendages en onder druk staande appendages;

      d. de controle van de opstelling van de drukapparatuur.

      7 Bij ministeriële regeling kunnen ten aanzien van de onderzoeken, bedoeld in het zesde lid, nadere regels worden
      gesteld.

      8 Bij de toepassing van het tweede en zesde lid wordt rekening gehouden met de onderzoeken in het kader van de
      beoordeling van overeenstemming, bedoeld in de [artikelen 11][ref3], [12][ref4] en [12a][ref5].

      9 Indien een afzonderlijk drukvat of afzonderlijke installatieleiding met inbegrip van de daarbij behorende
      veiligheidsappendages en onder druk staande appendages, wordt gekoppeld aan een bestaand drukvat of bestaande
      installatieleiding, kan de keuring voor ingebruikneming, bedoeld in het tweede lid, worden betrokken op
      het afzonderlijk drukvat of de afzonderlijke installatieleiding, met inbegrip van de daarbij behorende
      veiligheidsappendages en onder druk staande appendages.

      10 De instelling of dienst, bedoeld in het derde lid, stelt een rapport op van de keuring, bedoeld in het tweede
      lid en stelt een exemplaar van dit rapport beschikbaar aan de gebruiker. In dit rapport kunnen voorwaarden worden
      gesteld waaraan wordt voldaan alvorens een verklaring van ingebruikneming wordt afgegeven.

      11 Door de instelling of dienst, bedoeld in het derde lid, wordt een verklaring van ingebruikneming afgegeven
      indien is gebleken dat tegen het in gebruik nemen van de drukapparatuur, bedoeld in het tweede lid, geen bezwaar
      bestaat.

      In deze verklaring:

      a. wordt de termijn vermeld waarbinnen de drukapparatuur uiterlijk aan een herkeuring als bedoeld in
      [artikel 12c][ref6] wordt onderworpen;

      b. kunnen gebruiksvoorwaarden worden gesteld.

      12 Door de instelling of dienst, bedoeld in het derde lid, kan een voorlopige verklaring van ingebruikneming worden
      afgegeven, wanneer ten aanzien van de drukapparatuur, bedoeld in het tweede lid, nog niet aan alle verplichtingen
      ingevolge dit artikel is voldaan, doch hiervan vooralsnog geen extra gevaar is te duchten.

      13 Een voorlopige verklaring van ingebruikneming als bedoeld in het twaalfde lid wordt slechts verleend voor
      beperkte duur en wordt in ieder geval ingetrokken wanneer de redenen van afgifte daarvan zijn vervallen.

      14 Een voorlopige verklaring van ingebruikneming als bedoeld in het twaalfde lid vervalt indien binnen een in
      deze verklaring gestelde termijn de door de betrokken instelling of dienst nodig geachte en nader omschreven
      voorzieningen niet zijn getroffen.

      15 De verklaring van ingebruikneming en de voorlopige verklaring van ingebruikneming kunnen betrekking hebben op
      één of meer drukapparaten.

      16 De gebruiker draagt er zorg voor dat de keuring, bedoeld in het tweede lid, veilig kan worden uitgevoerd.

      17 Dit artikel is niet van toepassing indien een verklaring als bedoeld in [artikel 12d, tweede lid][ref7], is
      afgegeven, tot het tijdstip waarop de betreffende apparatuur na montage wordt opgesteld en geïnstalleerd op een
      nieuwe plaats van opstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel12e
