  - number: '2'
    text: |-
      In afwijking van [artikel 1, onder e en j][ref1], wordt onder drukapparatuur, onderscheidenlijk samenstellen, niet
      verstaan:

      a. transportleidingen met een pijp of een geheel van pijpen voor het vervoer van of naar een installatie
      te land of ter zee, vanaf en met inbegrip van de laatste afsluiter binnen de grenzen van de installatie,
      inclusief alle bijbehorende apparatuur die speciaal voor de transportleiding is ontworpen, met uitzondering van
      standaarddrukapparatuur zoals in reduceerstations en compressorstations;

      b. netten voor de aanvoer, distributie en de afvoer van water en de bijbehorende apparaten alsmede leidingen voor
      aandrijfwater, zoals sluispoorten, drukleidingen en drukschachten voor waterkrachtinstallaties en bijbehorende
      specifieke appendages;

      c. apparatuur die valt onder het [Warenwetbesluit drukvaten van eenvoudige vorm][ref2];

      d. aërosolen die vallen onder het [Warenwetbesluit drukverpakkingen][ref3];

      e. apparatuur voor de werking van voertuigen als bedoeld in:

      1°. [Richtlijn nr. 70/156/EEG](31970L0156) van de Raad van de Europese Gemeenschappen van 6 februari 1970 inzake
      de onderlinge aanpassing van de wetgevingen van de Lidstaten betreffende de goedkeuring van motor-voertuigen en
      aanhangwagens daarvan (PbEG L 42);

      2°. [Richtlijn nr. 74/150/EEG](31974L0150) van de Raad van de Europese Gemeen-schappen van 4 maart 1974 inzake
      de onderlinge aanpassing van de wetgevingen van de Lidstaten betreffende de goedkeuring van landbouw- of
      bosbouwtrekkers op wielen (PbEG L 84);

      3°. [Richtlijn nr. 2002/24/EG](32002L0024): [richtlijn nr. 2002/24/EG](32002L0024) van het Europees Parlement en
      de Raad van de Europese Unie van 18 maart 2002 (PbEG L 124) betreffende de goedkeuring van twee- of driewielige
      motorvoertuigen en de intrekking van [richtlijn nr. 92/61/EEG](31992L0061) van de Raad;

      f. apparatuur die ten hoogste valt onder categorie I, bedoeld in artikel 9 van de richtlijn, en die tevens onder
      één of meerdere van de volgende besluiten valt:

      1°. [Besluit gastoestellen][ref4];

      2°. [Warenwetbesluit explosieveilig materieel][ref5];

      3°. [Warenwetbesluit liften][ref6];

      4°. [Besluit medische hulpmiddelen][ref7];

      5°. [Warenwetbesluit elektrotechnische producten][ref8];

      6°. [Warenwetbesluit machines][ref9];

      g. apparatuur als bedoeld in artikel 223, eerste lid, onderdeel b, van het Verdrag tot oprichting van de Europese
      Gemeenschap;

      h. speciaal voor nucleair gebruik ontworpen apparatuur die bij defecten de verspreiding van radioactiviteit kan
      veroorzaken;

      i. putregelingsapparatuur voor de exploratie en winning van aardolie, aardgas of geothermische energie of voor de
      ondergrondse opslag om de druk van de put te behouden of te regelen;

      j. apparatuur die uit kasten en mechanismen bestaat waarvan de afmetingen, de materiaalkeuze en de
      fabricagevoorschriften voornamelijk berusten op de criteria sterkte, stijfheid en stabiliteit bij statische
      en dynamische bedrijfsbelastingen of op andere functioneringseigenschappen waarvoor de druk geen wezenlijke
      ontwerpfactor is;

      k. hoogovens, met inbegrip van de ovenkoeling, windverhitters, stofafzuigers en gaswassers voor afvoergassen en
      koepelovens voor directe reductie, met inbegrip van de ovenkoeling, gasconvertors en pannen voor het smelten,
      hersmelten, ontgassen en gieten van staal en non-ferrometalen;

      l. omhullingen voor elektrische hoogspanningsapparatuur;

      m. mantels onder druk rond de onderdelen van transmissiesystemen;

      n. schepen, raketten, luchtvaartuigen en mobiele offshore-eenheden en apparatuur die uitdrukkelijk bedoeld is voor
      installatie op dergelijke machines of de voortbeweging daarvan;

      o. drukapparatuur met een flexibele buitenwand;

      p. flessen of blikjes voor koolzuurhoudende dranken, bestemd voor eindconsumptie;

      q. vaten voor vervoer of distributie van dranken waarin het product van de maximaal toelaatbare druk (*PS*) en
      volume (*V*) ten hoogste 500 bar.L en de maximaal toelaatbare druk (*PS*) 7 bar bedraagt;

      r. apparatuur die valt onder de ADR-overeenkomst, de IMDG-code, het RID- of het ICAO-verdrag;

      s. radiatoren en buizen in systemen voor warmwaterverwarming;

      t. vaten voor vloeistoffen, waarin de gasdruk boven de vloeistof ten hoogste 0,5 bar bedraagt;

      u. inlaat- en uitlaatgeluiddempers.


