  - number: '12'
    text: |-
      1 Samenstellen als bedoeld in [artikel 8][ref1], worden door de fabrikant, onderworpen aan een procedure voor
      de beoordeling van overeenstemming overeenkomstig dit artikel en zijn voorzien van de CE-markering, bedoeld in
      [artikel 16][ref2], en gaan vergezeld van de EG-verklaring van overeenstemming, bedoeld in bijlage VII bij de
      richtlijn, die de in deze bijlage genoemde gegevens bevat.

      2 De overeenkomstig bijlage III bij de richtlijn te volgen procedure voor de beoordeling van de overeenstemming van
      samenstellen omvat:

      a. de beoordeling van de overeenstemming van elk van de drukapparaten, bedoeld in [artikel 7][ref3], waaruit dat
      samenstel bestaat wanneer die niet reeds aan een afzonderlijke procedure voor de beoordeling van overeenstemming
      onderworpen zijn geweest en geen aparte CE-markering hebben gekregen. De procedure voor de beoordeling van de
      overeenstemming wordt bepaald door de categorie, bedoeld in [artikel 6][ref4], waarin elk van die drukapparaten
      is ingedeeld;

      b. de beoordeling van de integratie van de verschillende onderdelen van het samenstel overeenkomstig de punten 2.3,
      2.8 en 2.9 van bijlage I bij de richtlijn. De procedure voor de beoordeling van de overeenstemming wordt bepaald
      door de categorie, bedoeld in [artikel 6][ref5], waarin het drukapparaat met het hoogste risico is ingedeeld,
      waarbij veiligheidsappendages niet in aanmerking worden genomen, en

      c. de beoordeling van de beveiliging van het samenstel tegen overschrijding van de toelaatbare grenzen, bedoeld
      in de punten 2.10 en 3.2.3 van bijlage I bij de richtlijn. De procedure voor de beoordeling van de overeenstemming
      wordt bepaald door de categorie, bedoeld in [artikel 6][ref6], waarin het te beveiligen drukapparaat met het
      hoogste risico is ingedeeld.

      3 Indien een afzonderlijk samenstel wordt gekoppeld aan een ander samenstel of druksysteem, kan de beoordeling
      van de overeenstemming ten aanzien van de integratie, bedoeld in het tweede lid, onderdeel b, en de beveiliging,
      bedoeld in het tweede lid, onderdeel c, worden betrokken op het desbetreffende afzonderlijke samenstel.

      4 De CE-markering, bedoeld in het eerste lid, wordt, met inachtneming van [artikel 16][ref7], door de fabrikant
      uitsluitend aangebracht nadat toepassing is gegeven aan het tweede lid.

      5 [Artikel 11, zesde lid][ref8], is van toepassing.


