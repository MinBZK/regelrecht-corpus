  - number: '23'
    text: >-
      Drukapparatuur, samenstellen en druksystemen gaan vergezeld van een gebruiksaanwijzing, bestemd voor de gebruiker,
      met alle voor de veiligheid van belang zijnde informatie als bedoeld in punt 3.4 van bijlage I bij de richtlijn.
    url: https://wetten.overheid.nl/BWBR0010586/2006-04-01#Artikel23
  - number: 23a
    text: >-
      1 De opstelling van een drukapparaat of samenstel voorzien van een CE-markering en een druksysteem moet zodanig
      zijn dat het toegankelijk en bereikbaar is voor het gebruik en het uitvoeren van onderhoud, onderzoek, inspectie,
      reparatie en keuringen. Zij zijn voorzien van een zodanige ondersteuning dat de veiligheid niet in gevaar wordt
      gebracht.


      2 Bij ministeriële regeling kunnen ter uitvoering van het eerste lid nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0010586/2006-04-01#Artikel23a
  - number: '24'
    text: >-
      1 Degene die drukapparatuur, samenstellen of druksystemen voorhanden heeft, aflevert, tentoonstelt of gebruikt
      zorgt ervoor dat die in goede staat van onderhoud verkeren.


      2 Degene die drukapparatuur, samenstellen of druksystemen gebruikt of doet gebruiken, zorgt ervoor dat die
      drukapparatuur, samenstellen of druksystemen overeenkomstig hun bestemming worden gebruikt.


      3 Het eerste en tweede lid zijn niet van toepassing voor zover drukapparatuur, samenstellen of druksystemen hetzij
      zijn afgekeurd hetzij onklaar zijn gemaakt hetzij anderszins kennelijk niet meer voor gebruik zijn bestemd.
    url: https://wetten.overheid.nl/BWBR0010586/2006-04-01#Artikel24
  - number: '25'
    text: |-
      [Artikel 4, eerste tot en met derde lid][ref1], is niet van toepassing op het tentoonstellen en demonstreren
      op (jaar-)beurzen, exposities en bij demonstraties van drukapparatuur, samenstellen of druksystemen die niet
      in overeenstemming zijn met dit besluit, mits op een zichtbaar bord duidelijk is aangegeven dat zij niet in
      overeenstemming zijn met dit besluit en niet te koop zijn voordat zij door de fabrikant of zijn in de Europese
      Economische Ruimte gevestigde gemachtigde in overeenstemming zijn gebracht met dit besluit. Bij demonstraties
      worden alle nodige veiligheidsmaatregelen genomen om de bescherming van de mens te waarborgen.


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel4
    url: https://wetten.overheid.nl/BWBR0010586/2006-04-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0010586
        artikel: '4'
        hoofdstuk: '1'
  - number: '29'
    text: >-
      De informatie, bedoeld in de punten 3.3 en 3.4 van bijlage I bij de richtlijn, wordt verstrekt in de Nederlandse
      taal indien de drukapparatuur of samenstellen ter beschikking worden gesteld aan de eindgebruiker in Nederland.
    url: https://wetten.overheid.nl/BWBR0010586/2006-04-01#Artikel29
  - number: '39'
    text: |-
      1 Dit besluit is, wat de eisen ten aanzien van de vervaardiging betreft, niet van toepassing op drukapparatuur
      en samenstellen die voldoen aan de wettelijke voorschriften ten aanzien van de vervaardiging zoals die luidden op
      de dag voor de inwerkingtreding van dit besluit en voor 29 mei 2002 in de handel zijn gebracht en voor of na deze
      laatste datum in bedrijf zijn of worden gesteld voorzover zij niet alsnog in overeenstemming zijn gebracht met dit
      besluit met betrekking tot de eisen ten aanzien van de vervaardiging.

      2 Met betrekking tot drukapparatuur en samenstellen als bedoeld in het eerste lid waarop dit besluit niet wordt
      toegepast en waarop ingevolge één of meer andere wettelijke regelingen de CE-markering wordt aangebracht, worden
      op de bij die drukapparatuur en samenstellen gevoegde documenten, handleidingen of gebruiksaanwijzingen de in het
      Publicatieblad van de Europese Gemeenschappen bekendgemaakte referenties van de aan die wettelijke regelingen ten
      grondslag liggende richtlijnen vermeld.

      3 [Artikel 12a][ref1] is niet van toepassing op druksystemen die voldoen aan de wettelijke voorschriften ten
      aanzien van vervaardiging zoals die luidden op de dag voor de inwerkingtreding van het besluit tot wijziging
      van het Besluit drukapparatuur houdende regels inzake de samenbouw van druksystemen en de ingebruikneming
      van drukapparatuur, samenstellen en druksystemen en tot wijziging van enige andere besluiten (Stb. 2001, 339)
      en voor 29 mei 2002 in bedrijf zijn gesteld voorzover zij niet alsnog in overeenstemming zijn gebracht met
      [artikel 12a][ref2].

      4 Van de apparatuur, bedoeld in het eerste lid, welke voor het eerst of opnieuw in gebruik wordt genomen,
      wordt vóór de ingebruikneming ervan, voorzover van toepassing, de integratie en beveiliging beoordeeld door een
      aangewezen keuringsinstelling of aangewezen keuringsdienst van gebruikers. Deze beoordeling vindt uitsluitend
      plaats voor apparatuur die is voorzien van een vervaardigingsbewijs. Van de beoordeling wordt door de instelling of
      dienst een rapport opgesteld en een exemplaar van dit rapport wordt beschikbaar gesteld aan de gebruiker.

      5 Voor de toepassing van het vierde lid worden een bewijs van onderzoek en beproeving en een verklaring
      over de vervaardiging en eerste persproef, afgegeven in het kader van de toepassing van de [Stoomwet][ref3],
      onderscheidenlijk de [Wet Milieubeheer][ref4], aangemerkt als geldige vervaardigingbewijzen.


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0010586#Artikel12a
      [ref3]: https://wetten.overheid.nl/BWBR0002108
      [ref4]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0010586/2006-04-01#Artikel39
    references:
