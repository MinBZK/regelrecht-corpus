  - number: '3'
    text: |-
      Dit besluit is van toepassing op het ontwerp, de fabricage, de overeenstemmingsbeoordeling en de ingebruikneming
      van drukapparatuur, samenstellen en druksystemen waarvan de maximaal toelaatbare druk (*PS*) meer dan 0,5 bar
      bedraagt.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel3
  - number: '4.1'
    text: |-
      Het is verboden drukapparatuur, samenstellen en druksystemen te verhandelen, in bedrijf te stellen of te gebruiken,
      die niet voldoen aan de vervaardigingsvoorschriften gesteld bij of krachtens dit besluit.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel4
  - number: '4.2'
    text: |-
      Het is verboden drukapparatuur, samenstellen en druksystemen te verhandelen of te gebruiken anders dan met
      inachtneming van de voorschriften bij of krachtens dit besluit gesteld met betrekking tot de aanduiding en het
      bezigen van vermeldingen.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel4
  - number: '4.3'
    text: |-
      Het is verboden drukapparatuur, samenstellen en druksystemen te verhandelen of te gebruiken, indien de bij of
      krachtens dit besluit voorgeschreven beoordelings- en keuringsprocedures niet in acht zijn genomen.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel4
  - number: '4.4'
    text: |-
      Het is verboden drukapparatuur, samenstellen en druksystemen te gebruiken anders dan met inachtneming van de
      voorschriften bij of krachtens dit besluit gesteld met betrekking tot het voorhanden zijn van documenten.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel4
  - number: '5'
    text: |-
      Drukapparatuur, samenstellen en druksystemen zijn zodanig ontworpen en vervaardigd, hebben zodanige eigenschappen
      en zijn van zodanige vermeldingen voorzien dat zij geen gevaar opleveren voor de veiligheid of gezondheid van de
      mens of voor de veiligheid van zaken, wanneer zij op passende wijze worden geïnstalleerd en onderhouden en worden
      gebruikt voor het doel waarvoor zij zijn bestemd.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel5
  - number: '6.1'
    text: |-
      De drukapparatuur en samenstellen, bedoeld in [artikel 7][ref1], onderscheidenlijk [artikel 8][ref2], worden
      overeenkomstig bijlage II bij de richtlijn naar toenemend risico in categorieën ingedeeld. Indien drukapparatuur
      uit verschillende ruimten bestaat, wordt het ingedeeld in de hoogste van de verschillende categorieën van de
      afzonderlijke ruimten. Wanneer een ruimte verschillende stoffen bevat, vindt de indeling plaats op grond van de
      stof die in de hoogste categorie valt.


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0010586#Artikel8
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0010586
        artikel: '7'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0010586
        artikel: '8'
        hoofdstuk: II
  - number: '6.2'
    text: 'Met het oog op de categorie-indeling, bedoeld in het eerste lid, worden stoffen ingedeeld in:'
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel6
  - number: 6.2.a
    text: |-
      groep 1: gevaarlijke stoffen, dat wil zeggen stoffen of preparaten, die op grond van de
      [Wet milieugevaarlijke stoffen][ref1] moeten worden ingedeeld in de categorie ontplofbaar, zeer licht ontvlambaar,
      licht ontvlambaar, ontvlambaar, zeer vergiftig, vergiftig of oxyderend;


      [ref1]: https://wetten.overheid.nl/BWBR0003892
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003892
  - number: 6.2.b
    text: 'groep 2: overige stoffen.'
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel6
  - number: '6.3'
    text: Het eerste en tweede lid ten aanzien van samenstellen, zijn van overeenkomstige toepassing op druksystemen.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel6
  - number: '7'
    text: |-
      De volgende drukapparatuur voldoet aan de essentiële veiligheidseisen, genoemd in bijlage I bij de richtlijn. Het
      betreft:
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel7
  - number: 7.a
    text: |-
      drukvaten, met uitzondering van de onder c bedoelde, voor gassen, vloeibare gassen, onder druk opgeloste gassen,
      dampen en vloeistoffen waarbij de dampdruk bij de maximaal toelaatbare temperatuur hoger is dan 0,5 bar bij de
      normale atmosferische druk (1013 mbar) binnen de volgende grenzen:
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel7
  - number: 7.a.1°
    text: |-
      voor stoffen, ingedeeld in groep 1, wanneer het volume groter is dan 1L en het product van*PS*en *V* groter is dan
      25 bar.L, of wanneer de druk *PS* groter is dan 200 bar;
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel7
  - number: 7.a.2°
    text: |-
      voor stoffen, ingedeeld in groep 2, wanneer het volume groter is dan 1L en het product van *PS* en *V* groter is
      dan 50 bar.L, of wanneer de druk *PS* groter is dan 1000 bar, alsmede alle draagbare brandblussers en flessen voor
      ademhalingstoestellen;
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel7
  - number: 7.b
    text: |-
      drukvaten, met uitzondering van de onder c bedoelde, voor vloeistoffen waarvan de dampdruk bij de maximaal
      toelaatbare temperatuur 0,5 bar of minder is bij de normale atmosferische druk (1013 mbar), binnen de volgende
      grenzen:
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel7
  - number: 7.b.1°
    text: |-
      voor stoffen, ingedeeld in groep 1, wanneer het volume groter is dan 1L en het product van *PS* en *V* groter is
      dan 200 bar.L of, wanneer de druk *PS* hoger is dan 500 bar;
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel7
  - number: 7.b.2°
    text: |-
      voor stoffen, ingedeeld in groep 2, wanneer de druk *PS*meer is dan 10 bar en het product van *PS* en *V* groter is
      dan 10 000 bar.L, of wanneer de druk*PS*meer dan 1000 bar is;
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel7
  - number: 7.c
    text: |-
      brandstofgestookte of anderszins verwarmde drukapparatuur waarbij gevaar voor oververhitting bestaat, bestemd voor
      de productie van stoom of oververhit water met een temperatuur hoger dan 110°C met een volume van meer dan 2L,
      alsmede alle snelkookpannen;
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel7
  - number: 7.d
    text: |-
      installatieleidingen bestemd voor gassen, vloeibare gassen, onder druk opgeloste gassen, dampen en vloeistoffen
      waarvan de dampdruk bij de maximaal toelaatbare temperatuur hoger is dan 0,5 bar bij de normale atmosferische druk
      (1013 mbar) binnen de volgende grenzen:
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel7
  - number: 7.d.1°
    text: voor stoffen, ingedeeld in groep 1, met een DN groter dan 25;
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel7
  - number: 7.d.2°
    text: voor stoffen, ingedeeld in groep 2, met een DN groter dan 32 en een product van *PS* en DN groter dan 1000 bar;
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel7
  - number: 7.e
    text: |-
      installatieleidingen bestemd voor vloeistoffen waarvan de dampdruk bij de maximaal toelaatbare temperatuur 0,5 bar
      of minder is bij de normale atmosferische druk (1013 mbar) binnen de volgende grenzen:
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel7
  - number: 7.e.1°
    text: voor stoffen, ingedeeld in groep 1, met een DN groter dan 25 en een product van *PS* en DN groter dan 2000 bar;
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel7
  - number: 7.e.2°
    text: |-
      voor stoffen, ingedeeld in groep 2, met een *PS* groter dan 10 bar en een DN groter dan 200 en een product van *PS*
      en DN groter dan 5000 bar;
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel7
  - number: 7.f
    text: |-
      veiligheidsappendages en onder druk staande appendages, bestemd voor drukapparatuur als bedoeld onder a tot en
      met e.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel7
  - number: '8.1'
    text: |-
      De volgende samenstellen, waarin ten minste één drukapparaat als bedoeld in [artikel 7][ref1] is opgenomen, voldoen
      aan de essentiële veiligheidseisen, genoemd in bijlage 1 bij de richtlijn.Het betreft:


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel7
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0010586
        artikel: '7'
        hoofdstuk: II
  - number: 8.1.a
    text: |-
      samenstellen voor de productie van stoom en oververhit water met een temperatuur hoger dan 110 °C waarin ten minste
      één brandstofgestookt of anderszins verwarmd drukapparaat waarbij gevaar voor oververhitting bestaat, is opgenomen;
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel8
  - number: 8.1.b
    text: |-
      andere dan onder punt a. bedoelde samenstellen, wanneer deze door de fabrikant bestemd zijn om als samenstellen in
      de handel gebracht en in gebruik genomen te worden.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel8
  - number: '8.2'
    text: |-
      In afwijking van het eerste lid, voldoen manueel met vaste brandstoffen gestookte samenstellen voor de productie
      van warm water waarvan de watertemperatuur ten hoogste 110 °C en het product van *PS* en *V* meer bedraagt dan
      50 bar.L en waarin ten minste één drukapparaat als bedoeld in [artikel 7][ref1] is opgenomen, aan de essentiële
      veiligheidseisen, genoemd in de punten 2.10, 2.11, 3.4, 5a) en 5d) van bijlage 1 bij de richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel7
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0010586
        artikel: '7'
        hoofdstuk: II
  - number: '8.3'
    text: |-
      Druksystemen, waarin ten minste één drukapparaat als bedoeld in [artikel 7][ref1] is opgenomen, voldoen op
      overeenkomstige wijze aan de essentiële veiligheidseisen, genoemd in bijlage I bij de richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel7
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0010586
        artikel: '7'
        hoofdstuk: II
  - number: '9.1'
    text: |-
      Drukapparatuur, samenstellen of druksystemen met kenmerkende waarden beneden of gelijk aan de grenzen, bedoeld in
      [artikel 7][ref1], onderscheidenlijk [artikel 8][ref2], worden ontworpen en vervaardigd overeenkomstig de gebruiken
      van goed vakmanschap, om een veilig gebruik te waarborgen.


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0010586#Artikel8
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0010586
        artikel: '7'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0010586
        artikel: '8'
        hoofdstuk: II
  - number: '9.2'
    text: |-
      De drukapparatuur of samenstellen, bedoeld in het eerste lid, gaan vergezeld van een toereikende gebruiksaanwijzing
      en markeringen, waarmee de fabrikant of diens in de Europese Economische Ruimte gevestigde gemachtigde kan worden
      geïdentificeerd. Op deze drukapparatuur en samenstellen wordt de CE-markering, bedoeld in [artikel 16][ref1], niet
      aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel16
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0010586
        artikel: '16'
        hoofdstuk: III
  - number: '9.3'
    text: De druksystemen, bedoeld in het eerste lid, gaan vergezeld van een toereikende gebruiksaanwijzing.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel9
  - number: '10'
    text: |-
      Drukapparatuur en samenstellen die voldoen aan de door Onze Minister aangewezen geharmoniseerde normen worden in
      zoverre vermoed te voldoen aan de essentiële veiligheidseisen, bedoeld in bijlage I bij de richtlijn.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel10
  - number: '11.1'
    text: |-
      Drukapparatuur als bedoeld in [artikel 7][ref1], wordt door de fabrikant, onderworpen aan een procedure voor
      de beoordeling van overeenstemming overeenkomstig dit artikel en is voorzien van de CE-markering, bedoeld in
      [artikel 16][ref2], en gaat vergezeld van de EG-verklaring van overeenstemming, bedoeld in bijlage VII bij de
      richtlijn, die de in deze bijlage genoemde gegevens bevat.


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0010586#Artikel16
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0010586
        artikel: '7'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0010586
        artikel: '16'
        hoofdstuk: III
  - number: '11.2'
    text: |-
      De overeenkomstig bijlage III bij de richtlijn naar keuze van de fabrikant te volgen procedure voor de beoordeling
      van de overeenstemming van drukapparatuur wordt bepaald door de categorie, bedoeld in [artikel 6][ref1], waarin het
      drukapparaat is ingedeeld. De fabrikant kan, voor zover dat mogelijk is, een procedure volgen die bestemd is voor
      een hogere categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel6
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0010586
        artikel: '6'
        hoofdstuk: II
  - number: '11.3'
    text: |-
      De CE-markering, bedoeld in het eerste lid, wordt, met inachtneming van [artikel 16][ref1], door de fabrikant
      uitsluitend aangebracht nadat toepassing is gegeven aan het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel16
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0010586
        artikel: '16'
        hoofdstuk: III
  - number: '11.4'
    text: |-
      Ten aanzien van kwaliteitsborgingsprocedures overeenkomstig bijlage III bij de richtlijn, voor drukapparatuur als
      bedoeld in [artikel 7, eerste lid, onder a, b, ten eerste en c][ref1], en die op grond van [artikel 6][ref2] is
      ingedeeld in de categorieën III of IV, neemt de aangewezen aangemelde keuringsinstelling bij een onaangekondigd
      bezoek een monster van de drukapparatuur uit de fabricage- of opslagplaatsen om de eindcontrole, bedoeld in
      punt 3.2.2 van bijlage I bij de richtlijn, te verrichten. Daartoe stelt de fabrikant de aangewezen aangemelde
      keuringsinstelling in kennis van het beoogde productieschema. De aangewezen aangemelde keuringsinstelling legt in
      het eerste productiejaar ten minste twee bezoeken af. De frequentie van latere bezoeken wordt door de aangewezen
      aangemelde keuringsinstelling bepaald op basis van de criteria, genoemd in punt 4.4. van de desbetreffende
      procedures, bedoeld in bijlage III bij de richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0010586#Artikel6
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0010586
        artikel: '7'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0010586
        artikel: '6'
        hoofdstuk: II
  - number: '11.5'
    text: |-
      De fabrikant stelt de aangewezen aangemelde keuringsinstelling in kennis van het beoogde
      productieschema, indien sprake is van een eenmalige productie van vaten en drukapparatuur als bedoeld in
      [artikel 7, eerste lid, onder c][ref1], en die op grond van [artikel 6][ref2] zijn ingedeeld in categorie III
      en die overeenkomstig module H als bedoeld in bijlage III bij de richtlijn worden geproduceerd en de aangewezen
      aangemelde keuringsinstelling de eindcontrole, bedoeld in punt 3.2.2 van bijlage I bij de richtlijn, verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0010586#Artikel6
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0010586
        artikel: '7'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0010586
        artikel: '6'
        hoofdstuk: II
  - number: '11.6'
    text: |-
      De dossiers en de briefwisseling met betrekking tot de procedures voor de beoordeling van de overeenstemming worden
      gesteld in de Nederlandse taal of in een door de betrokken aangewezen aangemelde keuringsinstelling aanvaarde taal.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel11
  - number: '12.1'
    text: |-
      Samenstellen als bedoeld in [artikel 8][ref1], worden door de fabrikant, onderworpen aan een procedure voor
      de beoordeling van overeenstemming overeenkomstig dit artikel en zijn voorzien van de CE-markering, bedoeld in
      [artikel 16][ref2], en gaan vergezeld van de EG-verklaring van overeenstemming, bedoeld in bijlage VII bij de
      richtlijn, die de in deze bijlage genoemde gegevens bevat.


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0010586#Artikel16
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0010586
        artikel: '8'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0010586
        artikel: '16'
        hoofdstuk: III
  - number: '12.2'
    text: |-
      De overeenkomstig bijlage III bij de richtlijn te volgen procedure voor de beoordeling van de overeenstemming van
      samenstellen omvat:
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel12
  - number: 12.2.a
    text: |-
      de beoordeling van de overeenstemming van elk van de drukapparatuur, bedoeld in [artikel 7][ref1], waaruit dat
      samenstel bestaat wanneer die niet reeds aan een afzonderlijke procedure voor de beoordeling van overeenstemming
      onderworpen zijn geweest en geen aparte CE-markering hebben gekregen. De procedure voor de beoordeling van de
      overeenstemming wordt bepaald door de categorie, bedoeld in [artikel 6][ref2], waarin elk van die drukapparaten
      is ingedeeld;


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0010586#Artikel6
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0010586
        artikel: '7'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0010586
        artikel: '6'
        hoofdstuk: II
  - number: 12.2.b
    text: |-
      de beoordeling van de integratie van de verschillende onderdelen van het samenstel overeenkomstig de punten 2.3,
      2.8 en 2.9 van bijlage I bij de richtlijn. De procedure voor de beoordeling van de overeenstemming wordt bepaald
      door de categorie, bedoeld in [artikel 6][ref1], waarin het drukapparaat met het hoogste risico is ingedeeld,
      waarbij veiligheidsappendages niet in aanmerking worden genomen, en


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel6
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0010586
        artikel: '6'
        hoofdstuk: II
  - number: 12.2.c
    text: |-
      de beoordeling van de beveiliging van het samenstel tegen overschrijding van de toelaatbare grenzen, bedoeld in de
      punten 2.10 en 3.2.3 van bijlage I bij de richtlijn. De procedure voor de beoordeling van de overeenstemming wordt
      bepaald door de categorie, bedoeld in [artikel 6][ref1], waarin het te beveiligen drukapparaat met het hoogste
      risico is ingedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel6
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0010586
        artikel: '6'
        hoofdstuk: II
  - number: '12.3'
    text: |-
      De CE-markering, bedoeld in het eerste lid, wordt, met inachtneming van [artikel 16][ref1], door de fabrikant
      uitsluitend aangebracht nadat toepassing is gegeven aan het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel16
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0010586
        artikel: '16'
        hoofdstuk: III
  - number: '12.4'
    text: |-
      [Artikel 11, zesde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel11
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0010586
        artikel: '11'
        hoofdstuk: III
  - number: 12a.1
    text: |-
      Druksystemen als bedoeld in [artikel 8, derde lid][ref1], worden, alvorens zij in gebruik worden genomen,
      onderworpen aan een procedure voor de beoordeling van overeenstemming overeenkomstig dit artikel en gaan vergezeld
      van een verklaring van overeenstemming. Op deze verklaring is bijlage VII bij de richtlijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel8
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0010586
        artikel: '8'
        hoofdstuk: II
  - number: 12a.2
    text: |-
      Voor de beoordeling van overeenstemming van druksystemen is [artikel 12, tweede lid][ref1], van overeenkomstige
      toepassing. Voor de in bijlage III bij de richtlijn vermelde begrippen «fabrikant of zijn de in de Gemeenschap
      gevestigde gemachtigde» onderscheidenlijk «fabrikant» wordt gelezen: gebruiker, voor «EG-typeonderzoek» wordt
      gelezen: 'typeonderzoek, voor «EG-ontwerponderzoek» wordt gelezen: ontwerponderzoek, voor« aangemelde instantie»'
      wordt gelezen: aangewezen keuringsinstelling of aangewezen keuringsdienst van gebruikers, voor «EG-verklaring van
      overeenstemming» wordt gelezen: verklaring van overeenstemming en voor «drukapparatuur» wordt gelezen: druksysteem.


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel12
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0010586
        artikel: '12'
        hoofdstuk: III
  - number: 12a.3
    text: |-
      Met de onderzoeken in het kader van de beoordeling van overeenstemming, bedoeld in de [artikelen 11][ref1] en
      [12][ref2], wordt bij de toepassing van het tweede lid rekening gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0010586#Artikel12
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0010586
        artikel: '11'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0010586
        artikel: '12'
        hoofdstuk: III
  - number: 12a.4
    text: |-
      [Artikel 11, zesde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel11
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0010586
        artikel: '11'
        hoofdstuk: III
  - number: 12b.1
    text: |-
      Bij ministeriële regeling worden drukapparatuur, samenstellen en druksystemen aangewezen die overeenkomstig dit
      artikel worden gekeurd.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel12b
  - number: 12b.2
    text: |-
      De drukapparatuur, samenstellen en druksystemen, bedoeld in het eerste lid, worden, wanneer die worden opgesteld en
      geïnstalleerd, gekeurd voor de eerste ingebruikneming alsmede na elke montage op een nieuwe locatie of een nieuwe
      plek en gaan vergezeld van een verklaring van ingebruikneming.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel12b
  - number: 12b.3
    text: |-
      De verklaring van ingebruikneming, bedoeld in het tweede lid, wordt onder overlegging van de in het vierde lid
      vermelde gegevens en bescheiden, schriftelijk aangevraagd bij een aangewezen keuringsinstelling of een aangewezen
      keuringsdienst van gebruikers.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel12b
  - number: 12b.4
    text: 'De in het derde lid bedoelde aanvraag omvat, voor zover van toepassing:'
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel12b
  - number: 12b.4.a
    text: |-
      naam en adres van de gebruiker en de plaats waar de drukapparatuur, het samenstel of het druksysteem staat
      opgesteld;
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel12b
  - number: 12b.4.b
    text: |-
      de gebruiksaanwijzing, bedoeld in bijlage I, punt 3.4, bij de richtlijn, met inbegrip van de EG-verklaring van
      overeenstemming of de verklaring van overeenstemming.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel12b
  - number: 12b.4.c
    text: |-
      de documentatie van de apparatuur, bedoeld in [artikel 39, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel39
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0010586
        artikel: '39'
        hoofdstuk: VIII
  - number: 12b.5
    text: |-
      De aangewezen keuringsinstelling of de aangewezen keuringsdienst van gebruikers die de keuring, bedoeld in
      het tweede lid, uitvoert, verricht passend onderzoek teneinde na te gaan of de drukapparatuur, samenstellen of
      druksystemen voldoen aan de eisen van dit besluit. Voor zover van toepassing omvat dit onderzoek:
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel12b
  - number: 12b.5.a
    text: |-
      de verificatie van de drukapparatuur, samenstellen en druksystemen aan de hand van de gebruiksaanwijzing en
      markeringen;
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel12b
  - number: 12b.5.b
    text: de controle van de uitwendige toestand van drukapparatuur, samenstellen en druksystemen;
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel12b
  - number: 12b.5.c
    text: de controle van de werking van de veiligheidsappendages en onder druk staande appendages;
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel12b
  - number: 12b.5.d
    text: de controle van de opstelling van drukapparatuur, samenstellen en druksystemen.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel12b
  - number: 12b.6
    text: |-
      Bij ministeriële regeling kunnen ten aanzien van het passend onderzoek als bedoeld in het vijfde lid nadere regels
      worden gesteld.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel12b
  - number: 12b.7
    text: |-
      Bij de toepassing van het tweede en vijfde lid wordt rekening gehouden met de onderzoeken in het kader van de
      beoordeling van overeenstemming, bedoeld in de [artikelen 11][ref1], [12][ref2] en [12a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0010586#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0010586#Artikel12a
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0010586
        artikel: '11'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0010586
        artikel: '12'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0010586
        artikel: 12a
        hoofdstuk: III
  - number: 12b.8
    text: De instelling of dienst, bedoeld in het derde lid, stelt een rapport op van de keuring, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel12b
  - number: 12b.9
    text: |-
      Door de instelling of dienst, bedoeld in het derde lid, wordt een verklaring van ingebruikneming afgegeven indien
      is gebleken dat tegen het in gebruik nemen van drukapparatuur, samenstellen of druksystemen geen bezwaar bestaat.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel12b
  - number: 12b.10
    text: |-
      Door de instelling of dienst, bedoeld in het derde lid, kan een voorlopige verklaring van ingebruikneming worden
      afgegeven, wanneer ten aanzien van drukapparatuur, samenstellen of druksystemen nog niet aan alle verplichtingen
      ingevolge dit artikel is voldaan, doch hiervan vooralsnog geen extra gevaar is te duchten.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel12b
  - number: 12b.11
    text: |-
      Een voorlopige verklaring van ingebruikneming als bedoeld in het tiende lid wordt slechts verleend voor beperkte
      duur en wordt in ieder geval ingetrokken wanneer de redenen waarom deze is afgegeven, zijn vervallen.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel12b
  - number: 12b.12
    text: |-
      Een voorlopige verklaring van ingebruikneming als bedoeld in het tiende lid vervalt indien binnen een in
      deze verklaring gestelde termijn de door de betrokken instelling of dienst nodig geachte en nader omschreven
      voorzieningen niet zijn getroffen.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel12b
  - number: '13.1'
    text: |-
      Gedurende tien jaar na de vervaardiging van drukapparatuur of samenstellen of indien deze in een serie zijn
      vervaardigd, na de vervaardiging van de laatste drukapparatuur of samenstellen, bewaart de fabrikant overeenkomstig
      bijlage III bij de richtlijn, voor zover van toepassing, de technische documentatie, een afschrift van de EG-
      verklaring van overeenstemming, een afschrift van de verklaring van EG-typeonderzoek of EG-ontwerponderzoek
      inclusief de aanvullingen daarop, alsmede de gegevens, bedoeld in punt 5 van module D, onderscheidenlijk punt 6 van
      module D1, onderscheidenlijk punt 5 van module E, onderscheidenlijk punt 6 van module E1, onderscheidenlijk punt 5
      van module H van bijlage III bij de richtlijn.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel13
  - number: '13.2'
    text: |-
      Indien de fabrikant niet in de Europese Economische Ruimte is gevestigd is het eerste lid van toepassing op degene
      die de drukapparatuur of samenstellen in de Europese Economische Ruimte in de handel brengt.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel13
  - number: '13.3'
    text: |-
      Zolang het druksysteem, bedoeld in [artikel 8, derde lid][ref1], in werking is of in werking kan worden gesteld,
      bewaart de gebruiker, voor zover van toepassing, de technische documentatie, de verklaring van overeenstemming,
      de verklaring van typeonderzoek of ontwerponderzoek inclusief de aanvullingen daarop, alsmede de overeenkomstige
      gegevens als bedoeld in punt 5 van module D, onderscheidenlijk punt 6 van module D1, onderscheidenlijk punt 5
      van module E, onderscheidenlijk punt 6 van module E1, onderscheidenlijk punt 5 van module H van bijlage III bij
      de richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel8
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0010586
        artikel: '8'
        hoofdstuk: II
  - number: '13.4'
    text: |-
      Zolang de drukapparatuur, samenstellen of druksystemen in werking zijn of in werking kunnen worden
      gesteld bewaart de gebruiker, voor zover van toepassing, de EG-verklaring van overeenstemming, de
      gebruiksaanwijzing, bedoeld in bijlage I, punt 3.4, bij de richtlijn, de verklaring van ingebruikneming,
      bedoeld in [artikel 12b, tweede lid][ref1], en de voorlopige verklaring van ingebruikneming, bedoeld in
      [artikel 12b, tiende lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel12b
      [ref2]: https://wetten.overheid.nl/BWBR0010586#Artikel12b
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0010586
        artikel: 12b
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0010586
        artikel: 12b
        hoofdstuk: III
  - number: '14.1'
    text: |-
      Van voorgenomen wijzigingen in drukapparatuur of samenstellen of het type hiervan waarvoor een verklaring van
      EG-typeonderzoek of EG-ontwerponderzoek is afgegeven of van voorgenomen wijzigingen in een kwaliteitssysteem
      waarvoor een goedkeuring is verleend overeenkomstig bijlage III bij de richtlijn, wordt de aangewezen aangemelde
      keuringsinstelling die deze verklaring of goedkeuring heeft afgegeven onderscheidenlijk heeft verleend onverwijld
      in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel14
  - number: '14.2'
    text: |-
      De aangewezen aangemelde keuringsinstelling, bedoeld in het eerste lid, beoordeelt de wijzigingen en deelt
      schriftelijk mee of een verklaring van EG-typeonderzoek of EG-ontwerponderzoek onderscheidenlijk een goedgekeurd
      kwaliteitssysteem voor de gewijzigde drukapparatuur of samenstellen of het gewijzigde type hiervan geldig is of
      aanvullingen behoeft dan wel dat het kwaliteitssysteem opnieuw moet worden beoordeeld.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel14
  - number: '14.3'
    text: |-
      Indien de aangewezen aangemelde keuringsinstelling, bedoeld in het eerste lid, van oordeel is dat de wijzigingen
      van invloed kunnen zijn op de overeenstemming met de in bijlage I bij de richtlijn opgenomen essentiële
      veiligheidseisen, wordt de gewijzigde drukapparatuur of samenstellen of het gewijzigde type hiervan aan het EG-
      typeonderzoek of EG-ontwerponderzoek onderscheidenlijk aan de beoordeling van het kwaliteitssysteem, bedoeld in
      bijlage III bij de richtlijn, onderworpen. Bij goedkeuring van het EG-typeonderzoek of het EG-ontwerponderzoek
      wordt een aanvulling op de oorspronkelijke verklaring afgegeven.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel14
  - number: '14.4'
    text: |-
      Van voorgenomen wijzigingen in druksystemen of het type hiervan waarvoor een verklaring van typeonderzoek of
      ontwerponderzoek is afgegeven of van voorgenomen wijzigingen in een kwaliteitssysteem waarvoor een goedkeuring
      is verleend overeenkomstig bijlage III bij de richtlijn op grond van [artikel 12a, tweede lid][ref1], wordt de
      aangewezen aangemelde keuringsinstelling die deze verklaring of goedkeuring heeft afgegeven onderscheidenlijk heeft
      verleend onverwijld in kennis gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel12a
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0010586
        artikel: 12a
        hoofdstuk: III
  - number: '14.5'
    text: |-
      De aangewezen aangemelde keuringsinstelling, bedoeld in het vierde lid, beoordeelt de wijzigingen en deelt
      schriftelijk mee of een verklaring van typeonderzoek of ontwerp-onderzoek onderscheidenlijk een goedgekeurd
      kwaliteitssysteem voor het gewijzigde druksysteem of het gewijzigde type hiervan geldig is of aanvullingen behoeft
      dan wel dat het kwaliteitssysteem opnieuw moet worden beoordeeld.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel14
  - number: '14.6'
    text: |-
      Indien de aangewezen aangemelde keuringsinstelling, bedoeld in het vierde lid, van oordeel is dat de wijzigingen
      van invloed kunnen zijn op de overeenstemming met de in bijlage I bij de richtlijn opgenomen essentiële
      veiligheidseisen, wordt het gewijzigde druksysteem of het gewijzigde type hiervan aan het typeonderzoek of
      ontwerp-onderzoek onderscheidenlijk de beoordeling van het kwaliteitssysteem overeenkomstig bijlage III bij de
      richtlijn op grond van [artikel 12a, tweede lid][ref1], onderworpen. Bij goedkeuring van het typeonderzoek of het
      ontwerponderzoek wordt een aanvulling op de oorspronkelijke verklaring afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel12a
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0010586
        artikel: 12a
        hoofdstuk: III
  - number: '16.1'
    text: |-
      De CE-markering bestaat uit de letters CE overeenkomstig het model in bijlage VI bij de richtlijn, gevolgd
      door het identificatienummer van de aangewezen aangemelde keuringsinstelling die betrokken is geweest bij de
      produktiecontrolefase.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel16
  - number: '16.2'
    text: |-
      De CE-markering en de gegevens, bedoeld in punt 3.3 van bijlage I bij de richtlijn, wordt overeenkomstig dit
      punt zichtbaar, goed leesbaar en onuitwisbaar aangebracht op drukapparatuur of samenstellen als bedoeld in
      [artikel 7][ref1], onderscheidenlijk [artikel 8][ref2], wanneer deze zijn voltooid, of zich in een staat bevinden
      die het mogelijk maakt de eindcontrole, bedoeld in punt 3.2 van bijlage I bij de richtlijn, te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0010586#Artikel8
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0010586
        artikel: '7'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0010586
        artikel: '8'
        hoofdstuk: II
  - number: '16.3'
    text: |-
      Op elk van de afzonderlijke drukapparaten waaruit een samenstel bestaat behoeft niet een CE-markering te worden
      aangebracht. De afzonderlijke drukapparaten die reeds een CE-markering hebben wanneer zij in het samenstel worden
      opgenomen, behouden die markering.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel16
  - number: '16.4'
    text: |-
      Op drukapparatuur en samenstellen worden geen markeringen aangebracht die derden kunnen misleiden omtrent de
      betekenis of grafische vorm van de CE-markering. Andere markeringen mogen worden aangebracht op voorwaarde dat de
      zichtbaarheid en leesbaarheid van de CE-markering er niet door worden verminderd.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel16
  - number: '17.1'
    text: |-
      Drukapparatuur en samenstellen die zijn voorzien van de CE-markering en vergezeld gaan van de EG-verklaring van
      overeenstemming worden vermoed te voldoen aan dit besluit, voor zover de voorschriften betrekking hebben op het
      ontwerp, de fabricage en de beoordeling van de overeenstemming.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel17
  - number: '17.2'
    text: |-
      Druksystemen die vergezeld gaan van de verklaring van overeenstemming worden vermoed te voldoen aan dit
      besluit, voor zover de voorschriften betrekking hebben op het ontwerp, de fabricage en de beoordeling van de
      overeenstemming.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel17
  - number: '18.1'
    text: |-
      De Europese materiaalgoedkeuring wordt op verzoek van één of meer materiaal- of drukapparatuurfabrikanten verleend
      door een hiertoe aangewezen aangemelde keuringsinstelling.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel18
  - number: '18.2'
    text: |-
      De voor de fabricage van drukapparatuur gebruikte materialen die voldoen aan de Europese materiaalgoedkeuringen
      waarvan de referenties door de Commissie van de Europese Gemeenschappen zijn gepubliceerd in het Publicatieblad
      van de Europese Gemeenschappen, worden geacht te voldoen aan de daarop van toepassing zijnde essentiële
      veiligheidseisen, bedoeld in bijlage I bij de richtlijn.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel18
  - number: 18a
    text: |-
      Met uitzondering van de verklaring van EG-typeonderzoek, de verklaring van EG-ontwerponderzoek, de EG-verklaring
      van overeenstemming en de goedkeuring van het kwaliteitssysteem als bedoeld in bijlage III bij de richtlijn, kunnen
      bij ministeriële regeling ten aanzien van de inhoud en geldigheidsduur van verklaringen en goedkeuringen nadere
      regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel18a
  - number: '19.1'
    text: |-
      De aangewezen keuringsinstelling of aangewezen aangemelde keuringsinstelling trekt een door haar afgegeven
      verklaring van EG-typeonderzoek, onderscheidenlijk typeonderzoek of EG-ontwerponderzoek, onderscheidenlijk
      ontwerponderzoek of een verleende goedkeuring van het kwaliteitssysteem als bedoeld in bijlage III bij de
      richtlijn, onderscheidenlijk [artikel 12a, tweede lid][ref1], in, indien de essentiële veiligheidseisen of de
      voorgeschreven gebruiksomstandigheden, bedoeld in bijlage I bij de richtlijn, zodanig zijn gewijzigd dat het type
      onderscheidenlijk het kwaliteitssysteem niet voldoet aan de gewijzigde eisen op het tijdstip waarop deze volgens de
      richtlijn van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel12a
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0010586
        artikel: 12a
        hoofdstuk: III
  - number: '19.2'
    text: |-
      De aangewezen aangemelde keuringsinstelling trekt een door haar verleende Europese materiaalgoedkeuring in,
      indien naar haar oordeel deze goedkeuring niet verleend had mogen worden of indien de materiaalsoort onder een
      geharmoniseerde norm valt.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel19
  - number: 19a.1
    text: |-
      Als aangewezen keuringsinstelling, aangewezen aangemelde keuringsinstelling of aangewezen aangemelde onafhankelijke
      instelling kan worden aangewezen een instelling die:
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel19a
  - number: 19a.1.a
    text: rechtspersoonlijkheid heeft;
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel19a
  - number: 19a.1.b
    text: haar zetel of een vestiging in Nederland heeft;
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel19a
  - number: 19a.1.c
    text: |-
      onafhankelijk is van degenen die bij het resultaat van de uitvoering van de taken waarvoor zij is aangewezen belang
      hebben;
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel19a
  - number: 19a.1.d
    text: |-
      beschikt over voldoende deskundigheid en outillage om de uitvoering van de taken waarvoor zij is aangewezen, naar
      behoren te kunnen vervullen;
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel19a
  - number: 19a.1.e
    text: |-
      beschikt over een behoorlijke administratie waarin de gegevens die samenhangen met en betrekking hebben op de
      uitvoering van haar taken, op een systematische wijze zijn vastgelegd. Aan de hand van deze gegevens zijn de
      gekeurde drukapparatuur, samenstellen en druksystemen, alsmede de onderzochte kwaliteitssystemen afdoende te
      identificeren;
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel19a
  - number: 19a.1.f
    text: naar behoren functioneert.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel19a
  - number: 19a.2
    text: |-
      Als aangewezen keuringsdienst van gebruikers of als aangewezen aangemelde keuringsdienst van gebruikers kan worden
      aangewezen een keuringsdienst die voldoet aan de voorschriften, genoemd in het eerste lid onder b tot en met f.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel19a
  - number: 19a.3
    text: |-
      In aanvulling op het eerste lid komen voor een aanwijzing als aangewezen aangemelde keuringsinstelling of als
      aangewezen aangemelde onafhankelijke instelling slechts in aanmerking instellingen die ten minste voldoen aan de in
      bijlage IV van de richtlijn neergelegde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel19a
  - number: 19a.4
    text: |-
      In aanvulling op het tweede lid komen voor een aanwijzing als aangewezen aangemelde keuringsdienst van gebruikers
      slechts in aanmerking keuringsdiensten die ten minste voldoen aan de in bijlage V van de richtlijn neergelegde
      voorwaarden en handelen overeenkomstig het gemeenschappelijk veiligheidsbeleid van de groep waartoe zij behoren.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel19a
  - number: 19a.5
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel19a
  - number: 19a.6
    text: |-
      Een keuringsdienst van gebruikers die deel uitmaakt van een mijnbouwonderneming wordt aangewezen door Onze Minister
      in overeenstemming met Onze Minister van Economische Zaken.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel19a
  - number: '20.1'
    text: 'Een aangewezen aangemelde keuringsinstelling is belast met de volgende taken, voorzover hiervoor aangewezen:'
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel20
  - number: 20.1.a
    text: |-
      de toepassing van de procedures voor de beoordeling van de overeenstemming, bedoeld in de [artikelen 11][ref1]
      en [12][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0010586#Artikel12
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0010586
        artikel: '11'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0010586
        artikel: '12'
        hoofdstuk: III
  - number: 20.1.b
    text: |-
      de Europese materiaalgoedkeuring, bedoeld in [artikel 18][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel18
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0010586
        artikel: '18'
        hoofdstuk: III
  - number: '20.2'
    text: 'Een aangewezen keuringsinstelling is belast met de volgende taken, voorzover hiervoor aangewezen:'
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel20
  - number: 20.2.a
    text: |-
      de toepassing van de procedures voor de beoordeling van de overeenstemming, bedoeld in [artikel 12a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel12a
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0010586
        artikel: 12a
        hoofdstuk: III
  - number: 20.2.b
    text: |-
      de keuring voor ingebruikneming, bedoeld in [artikel 12b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel12b
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0010586
        artikel: 12b
        hoofdstuk: III
  - number: '21'
    text: |-
      Een aangewezen aangemelde onafhankelijke instelling is belast met de taken, bedoeld in de punten 3.1.2 en 3.1.3 van
      bijlage I bij de richtlijn.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel21
  - number: '22.1'
    text: |-
      Een aangewezen keuringsdienst van gebruikers en een aangewezen aangemelde keuringsdienst van gebruikers werkt
      uitsluitend voor de groep waarvan hij deel uitmaakt, welke groep een gemeenschappelijk veiligheidsbeleid
      hanteert ten aanzien van de technische specificaties voor ontwerp, fabricage, controle, onderhoud en gebruik van
      drukapparatuur, samenstellen en druksystemen.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel22
  - number: '22.2'
    text: |-
      Een aangewezen aangemelde keuringsdienst van gebruikers is belast met de toepassing van de procedures voor de
      beoordeling van de overeenstemming, bedoeld in de [artikelen 11][ref1] en [12][ref2], en hanteert hierbij de
      modules A1, C1, F of G, bedoeld in bijlage III bij de richtlijn,


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0010586#Artikel12
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0010586
        artikel: '11'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0010586
        artikel: '12'
        hoofdstuk: III
  - number: '22.3'
    text: 'Een aangewezen keuringsdienst van gebruikers is belast met de volgende taken voorzover hiervoor aangewezen:'
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel22
  - number: 22.3.a
    text: |-
      de toepassing van de procedures voor de beoordeling van de overeenstemming, bedoeld in [artikel 12a][ref1], en
      hanteert hierbij de modules A1, C1, F of G, bedoeld in bijlage III bij de richtlijn,


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel12a
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0010586
        artikel: 12a
        hoofdstuk: III
  - number: 22.3.b
    text: |-
      de keuring voor ingebruikneming, bedoeld in [artikel 12b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel12b
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0010586
        artikel: 12b
        hoofdstuk: III
  - number: '22.4'
    text: |-
      Drukapparatuur en samenstellen waarvan de overeenstemming is beoordeeld door een aangewezen aangemelde
      keuringsdienst van gebruikers en druksystemen waarvan de overeenstemming is beoordeeld door een aangewezen
      keuringsdienst van gebruikers, dragen geen CE-markering en worden uitsluitend gebruikt in vestigingen die behoren
      tot de groep waarvan de betreffende keuringsdienst deel uitmaakt.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel22
  - number: 22a
    text: |-
      De in [artikel 1, onder t, u, v en w][ref1], bedoelde instellingen of keuringsdiensten verstrekken jaarlijks aan
      Onze Minister een afschrift van de polis van de afgesloten verzekering tegen wettelijke aansprakelijkheid tegen
      alle risico's die voortvloeien uit de uitoefening van de taken waarvoor zij zijn aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel1
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0010586
        artikel: '1'
        hoofdstuk: '1'
  - number: 22b.1
    text: |-
      Indien een wijziging plaatsvindt in de gegevens op grond waarvan de keuringsinstelling, de onafhankelijke
      instelling of de keuringsdienst van gebruikers is aangewezen, doet de instelling of dienst hiervan terstond
      mededeling aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel22b
  - number: 22b.2
    text: |-
      Indien een instelling of dienst voornemens is een of meer van de taken waarvoor zij is aangewezen, te beëindigen,
      doet zij hiervan terstond mededeling aan Onze Minister en de certificaathouders. In dat geval worden door de
      instelling of dienst de gegevens, bedoeld in [artikel 19a, eerste lid, onder e][ref1], overgedragen aan Onze
      Minister dan wel, na toestemming van Onze Minister en de certificaathouders, een andere instelling of dienst die
      voor dezelfde taken is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel19a
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel22b
    references:
      - id: ref1
        bwb_id: BWBR0010586
        artikel: 19a
        hoofdstuk: IV
  - number: 22c.1
    text: |-
      Een aanvraag om aanwijzing gaat vergezeld van het bewijs dat is voldaan aan de criteria, bedoeld in
      [artikel 19a, eerste of tweede lid][ref1], dan wel in geval van [artikel 19a, derde of vierde lid][ref2], tevens
      van bewijs dat is voldaan aan de voorwaarden, bedoeld in het derde of vierde lid, dan wel van een verklaring
      waaruit de bereidheid blijkt om voor eigen rekening een onderzoek naar het voldoen aan deze criteria dan wel
      voorwaarden te ondergaan.


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel19a
      [ref2]: https://wetten.overheid.nl/BWBR0010586#Artikel19a
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel22c
    references:
      - id: ref1
        bwb_id: BWBR0010586
        artikel: 19a
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0010586
        artikel: 19a
        hoofdstuk: IV
  - number: 22c.2
    text: |-
      Een aanwijzing kan worden geweigerd, dan wel worden gewijzigd of ingetrokken, indien niet of niet volledig is
      voldaan aan de bij de wet of bij of krachtens dit besluit gestelde voorschriften. Een aanwijzing kan worden
      ingetrokken indien de keuringsinstelling, onafhankelijke instelling of keuringsdienst gedurende een aaneengesloten
      periode van twee jaar geen werkzaamheden, waarvoor zij is aangewezen, heeft uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel22c
  - number: 22c.3
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel22c
  - number: '23'
    text: |-
      Drukapparatuur, samenstellen en druksystemen gaan vergezeld van een gebruiksaanwijzing, bestemd voor de gebruiker,
      met alle voor de veiligheid van belang zijnde informatie als bedoeld in punt 3.4 van bijlage I bij de richtlijn.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel23
  - number: 23a.1
    text: |-
      De opstelling van een drukapparaat of samenstel voorzien van een CE-markering en een druksysteem moet zodanig
      zijn dat het toegankelijk en bereikbaar is voor het gebruik en het uitvoeren van onderhoud, onderzoek, inspectie,
      reparatie en keuringen. Zij zijn voorzien van een zodanige ondersteuning dat de veiligheid niet in gevaar wordt
      gebracht.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel23a
  - number: 23a.2
    text: Bij ministeriële regeling kunnen ter uitvoering van het eerste lid nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel23a
  - number: '24.1'
    text: |-
      Degene die drukapparatuur, samenstellen of druksystemen voorhanden heeft, aflevert, tentoonstelt of gebruikt zorgt
      ervoor dat die in goede staat van onderhoud verkeren.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel24
  - number: '24.2'
    text: |-
      Degene die drukapparatuur, samenstellen of druksystemen gebruikt of doet gebruiken, zorgt ervoor dat die
      drukapparatuur, samenstellen of druksystemen overeenkomstig hun bestemming worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel24
  - number: '24.3'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing voor zover drukapparatuur, samenstellen of druksystemen hetzij
      zijn afgekeurd hetzij onklaar zijn gemaakt hetzij anderszins kennelijk niet meer voor gebruik zijn bestemd.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel24
  - number: '25'
    text: |-
      [Artikel 4, eerste tot en met derde lid][ref1], is niet van toepassing op het tentoonstellen en demonstreren
      op (jaar-)beurzen, exposities en bij demonstraties van drukapparatuur, samenstellen of druksystemen die niet
      in overeenstemming zijn met dit besluit, mits op een zichtbaar bord duidelijk is aangegeven dat zij niet in
      overeenstemming zijn met dit besluit en niet te koop zijn voordat zij door de fabrikant of zijn in de Europese
      Economische Ruimte gevestigde gemachtigde in overeenstemming zijn gebracht met dit besluit. Bij demonstraties
      worden alle nodige veiligheidsmaatregelen genomen om de bescherming van de mens te waarborgen.


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel4
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0010586
        artikel: '4'
        hoofdstuk: '1'
  - number: '29'
    text: |-
      De informatie, bedoeld in de punten 3.3 en 3.4 van bijlage I bij de richtlijn, wordt verstrekt in de Nederlandse
      taal indien de drukapparatuur of samenstellen ter beschikking worden gesteld aan de eindgebruiker in Nederland.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel29
  - number: '39.1'
    text: |-
      Dit besluit is niet van toepassing op drukapparatuur en samenstellen die voldoen aan de wettelijke voorschriften
      zoals die luiden op de dag voor de inwerkingtreding van dit besluit, voor 29 mei 2002 in de handel zijn gebracht
      en voor of na deze laatste datum in bedrijf zijn of worden gesteld voor zover zij niet alsnog in overeenstemming
      worden gebracht met de bepalingen van dit besluit.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel39
  - number: '39.2'
    text: |-
      Met betrekking tot drukapparatuur en samenstellen als bedoeld in het eerste lid waarop dit besluit niet wordt
      toegepast en waarop ingevolge één of meer andere wettelijke regelingen de CE-markering wordt aangebracht, worden
      op de bij die drukapparatuur en samenstellen gevoegde documenten, handleidingen of gebruiksaanwijzingen de in het
      Publicatieblad van de Europese Gemeenschappen bekendgemaakte referenties van de aan die wettelijke regelingen ten
      grondslag liggende richtlijnen vermeld.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel39
  - number: '40.1'
    text: |-
      Een wijziging van een van de bijlagen van de richtlijn waarnaar in dit besluit wordt verwezen, treedt voor de
      toepassing van de bij of krachtens dit besluit gestelde regels in werking met ingang van de dag waarop aan de
      betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel40
  - number: '40.2'
    text: |-
      Een wijziging van de richtlijnen, bedoeld in [artikel 2, onder e][ref1], treedt voor de toepassing van
      [artikel 2][ref2] in werking met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet
      zijn gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0010586#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0010586#Artikel2
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0010586
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0010586
        artikel: '2'
        hoofdstuk: '1'
  - number: '41'
    text: Dit besluit treedt in werking met ingang van 29 november 1999.
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel41
  - number: '42'
    text: 'Dit besluit wordt aangehaald als: Warenwetbesluit drukapparatuur.'
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel42
