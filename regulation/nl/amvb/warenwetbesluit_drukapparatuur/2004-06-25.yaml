preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Sociale Zaken en Werkgelegenheid, J.F. Hoogervorst van 5 maart 1999,
    directie Arbeidsomstandigheden, nr. ARBO/APM/99/9253, gedaan in overeenstemming met Onze Ministers van Economische
    Zaken, Verkeer en Waterstaat, Volksgezondheid, Welzijn en Sport, Volkshuisvesting, Ruimtelijke Ordening en
    Milieubeheer en de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties;

    Gelet op richtlijn nr. 97/23/EG van het Europees Parlement en de Raad van de Europese Unie van 29 mei 1997 inzake
    de onderlinge aanpassing van de wetgevingen der lidstaten betreffende drukapparatuur (PbEG L 181);

    Gelet op de artikelen 1, eerste lid, aanhef, en onderdelen a en b, 2, 3, eerste en tweede lid, 5, 6, 12, derde lid,
    en 25a van de Wet op de gevaarlijke werktuigen, artikel 17, eerste lid, van de Brandweerwet 1985, artikel 9, eerste
    lid, onder a, van de Mijnwet 1903, artikel 26, eerste lid, onder b, van de Mijnwet continentaal plat, artikel 8.40
    van de Wet milieubeheer, en de artikelen 2, 3, 4, 6, 21, aanhef en onderdeel c, van de Stoomwet;

    De Raad van State gehoord (advies van 6 mei 1999, no. W12.99.0108/IV);

    Gezien het nader rapport van de Staatssecretaris van Sociale Zaken en Werkgelegenheid, J.F. Hoogervorst van 30 juni
    1999, directie Arbeidsomstandigheden, nr. ARBO/APM/99/26935, uitgebracht in overeenstemming met Onze Ministers van
    Economische Zaken, Verkeer en Waterstaat, Volksgezondheid Welzijn en Sport, Volkshuisvesting Ruimtelijke Ordening
    en Milieubeheer en de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel1
  - number: 1.a
    text: |-
      wet: [Warenwet][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0001969
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001969
  - number: 1.b
    text: |-
      richtlijn: [richtlijn nr.97/23/EG](31997L0023) van het Europees Parlement en de Raad van de Europese Unie van 29
      mei 1997 (PbEG L 181) inzake de onderlinge aanpassing van de wetgevingen der lidstaten betreffende drukapparatuur;
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel1
  - number: 1.d
    text: |-
      Europese Economische Ruimte: het grondgebied waarop de Overeenkomst betreffende de Europese Economische Ruimte van
      toepassing is;
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel1
  - number: 1.e
    text: |-
      drukapparatuur of drukapparaten: drukvaten, installatieleidingen, veiligheidsappendages en onder druk staande
      appendages, alsmede, voor zover van toepassing, de elementen die bevestigd zijn aan onder druk staande delen;
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel1
  - number: 1.f
    text: |-
      drukvat: een omhulling, bestaande uit één of meer ruimten, die is ontworpen en vervaardigd voor stoffen onder druk,
      met inbegrip van de rechtstreeks daarmee verbonden delen tot aan de voorziening voor de aansluiting met andere
      apparatuur;
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel1
  - number: 1.g
    text: |-
      installatieleidingen: onderdelen van een leidingstelsel die voor de verplaatsing van stoffen dienen, wanneer zij
      zijn verbonden om in een ander onder druk staand systeem te worden geïntegreerd, met name bestaande uit een pijp of
      een pijpenstelsel, buizen, fittingen, expansieverbindingen en slangen of eventueel andere onder druk staande delen
      alsmede warmtewisselaars bestaande uit pijpen voor het koelen of verhitten van lucht;
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel1
  - number: 1.h
    text: |-
      veiligheidsappendages: voorzieningen voor de beveiliging van drukapparatuur tegen overschrijding van de toegestane
      grenzen, die bestaan uit:
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel1
  - number: 1.h.1°
    text: voorzieningen voor de rechtstreekse drukbegrenzing, en
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel1
  - number: 1.h.2°
    text: |-
      begrenzingsvoorzieningen die corrigerende organen in werking stellen of zorgen voor vergrendeling of voor
      vergrendeling en blokkering;
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel1
  - number: 1.i
    text: 'onder druk staande appendages: voorzieningen met een operationele functie waarvan de omhulling onder druk staat;'
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel1
  - number: 1.j
    text: |-
      samenstellen: verschillende drukapparaten die een fabrikant tot een geïntegreerd en functioneel geheel heeft
      geassembleerd;
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel1
  - number: 1.k
    text: |-
      druksysteem: een stelsel van verschillende drukapparaten of samenstellen die onder de verantwoordelijkheid van de
      gebruiker op zijn bedrijfsterrein tot een geïntegreerd en functioneel geheel is geassembleerd;
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel1
  - number: 1.l
    text: |-
      druk: de druk gerelateerd aan de atmosferische druk, zijnde de overdruk, waarbij een vacuüm of onderdruk met een
      negatieve waarde wordt aangeduid;
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel1
  - number: 1.m
    text: |-
      maximaal toelaatbare druk (*PS*): de door de fabrikant aangegeven maximale druk waarvoor de apparatuur
      is ontworpen. Deze druk wordt bepaald op een door de fabrikant aangegeven plaats waar de beveiligings- of
      veiligheidsinrichtingen zijn aangesloten of de bovenzijde van de apparatuur, of, indien dat niet passend is, een
      andere door hem aangegeven plaats;
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel1
  - number: 1.n
    text: |-
      maximaal of minimaal toelaatbare temperatuur (*TS*): de maximaal of minimaal door de fabrikant opgegeven
      temperatuur waarvoor de apparatuur is ontworpen;
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel1
  - number: 1.o
    text: |-
      volume (*V*): het inwendige volume van een ruimte met inbegrip van het volume van tubulures tot de eerste
      aansluiting en met uitsluiting van de inhoud van het volume van permanente inwendige onderdelen;
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel1
  - number: 1.p
    text: |-
      nominale maat (DN): getalsaanduiding voor afmeting, gebruikt voor alle onderdelen van een leidingstelsel,
      behalve voor onderdelen die met de uitwendige middellijn of met de maat van de schroefdraad wordt aangeduid. De
      getalsaanduiding betreft een gemakkelijk rond getal voor verwijzingsdoeleinden, dat slechts in oppervlakkig verband
      staat tot de fabricagematen. De nominale maat wordt aangegeven met DN, gevolgd door een getal;
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel1
  - number: 1.q
    text: |-
      stoffen: gassen, vloeistoffen en dampen in zuivere fase en mengsels daarvan, die een suspensie van vaste stoffen
      kunnen bevatten;
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel1
  - number: 1.r
    text: 'permanente verbindingen: verbindingen die alleen met destructieve methoden losgemaakt kunnen worden;'
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel1
  - number: 1.s
    text: |-
      Europese materiaalgoedkeuring: technisch document, waarin bij het ontbreken van een geharmoniseerde norm
      de kenmerken van bij herhaalde toepassing bestemde materialen voor de fabricage van drukapparatuur worden
      gedefinieerd;
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel1
  - number: 1.t
    text: |-
      aangewezen keuringsinstelling: een krachtens [artikel 7a van de wet][ref1] aangewezen keuringsinstelling;


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel7a
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: 7a
  - number: 1.u
    text: |-
      aangewezen aangemelde keuringsinstelling en aangewezen aangemelde onafhankelijke instelling: een krachtens
      [artikel 7a van de wet][ref1] in het kader van de richtlijn aangewezen en bij de Commissie van de Europese
      Gemeenschappen aangemelde keuringsinstelling of onafhankelijke instelling, dan wel een door een andere staat die
      partij is bij de Overeenkomst betreffende de Europese Economische Ruimte in het kader van de richtlijn aangewezen
      en bij de Commissie van de Europese Gemeenschappen aangemelde keuringsinstantie of onafhankelijke instelling;


