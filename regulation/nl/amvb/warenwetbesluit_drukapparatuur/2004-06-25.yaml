    text: |-
      speciaal voor nucleair gebruik ontworpen apparatuur die bij defecten de verspreiding van radioactiviteit kan
      veroorzaken;
    url: https://wetten.overheid.nl/BWBR0010586/2004-06-25#Artikel2
  - number: 2.i
    text: |-
