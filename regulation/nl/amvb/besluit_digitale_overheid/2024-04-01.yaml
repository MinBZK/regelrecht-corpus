  - number: '4'
    text: |-
      Onze Minister verwerkt voor de inrichting, beschikbaarstelling, instandhouding, werking, beveiliging en
      betrouwbaarheid van MijnOverheid de volgende persoonsgegevens:
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel4
  - number: 4.a
    text: |-
      over bezoekers van MijnOverheid: gegevens over de herkomst en kenmerken van het netwerkverkeer en de kenmerken van
      de gebruikte software en hardware van de bezoeker van MijnOverheid die relevant zijn voor de adequate werking en
      beveiliging van de voorziening;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel4
  - number: 4.b
    text: 'over gebruikers van MijnOverheid:'
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel4
  - number: 4.b.1°
    text: |-
      de naam en de noodzakelijke gegevens om deze correct weer te geven, de geboortedatum, de datum van overlijden,
      de nationaliteit, gegevens om te bepalen of een natuurlijk persoon kwalificeert als gebruiker van MijnOverheid
      waarvoor de Berichtenbox beschikbaar moet kunnen zijn, en het adres;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel4
  - number: 4.b.2°
    text: het burgerservicenummer of versleutelde vorm daarvan ter identificatie van de gebruiker van MijnOverheid;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel4
  - number: 4.b.3°
    text: |-
      de accountgegevens, waaronder gegevens over het aanmaken en wijzigen van het MijnOverheid-account, het e-mailadres
      of ander kanaal waarop de gebruiker van MijnOverheid notificaties ontvangt, en gegevens over de verificatie
      daarvan, de schermnaam, en de door de gebruiker van MijnOverheid geselecteerde afnemer of afnemers van MijnOverheid
      ten aanzien van wie de gebruiker van MijnOverheid in de berichtenvoorkeuren van MijnOverheid kenbaar heeft gemaakt
      dat hij langs elektronische weg voldoende bereikbaar is voor het ontvangen van elektronische berichten in de
      Berichtenbox, meta-gegevens die horen bij berichten of zaaksgegevens, en overige gegevens of wijzigingen daarvan
      die bij het account horen;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel4
  - number: 4.b.4°
    text: |-
      de gebruiksgegevens, waaronder gegevens over de navigatie en handelingen van de gebruiker van MijnOverheid in de
      voorziening, inclusief het opvragen, tonen of wijzigen van gegevens of het falen van functies, gegevens over de
      verzending van notificaties en het eventueel falen daarvan, inloghistorie en overige gegevens met betrekking op het
      soort, tijdstip en kenmerken van het gebruik;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel4
  - number: 4.b.5°
    text: |-
      gegevens die relevant zijn voor de adequate werking van de voorziening, waaronder sessie-cookies, gegevens over de
      herkomst en kenmerken van het netwerkverkeer en de kenmerken van de gebruikte software en hardware;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel4
  - number: 4.b.6°
    text: |-
      gegevens noodzakelijk voor de ondersteuning bij het veilige en betrouwbare gebruik van MijnOverheid, waaronder
      het burgerservicenummer, gegevens in het bericht van de afnemer of in een andere functionaliteit van MijnOverheid
      die de afnemer afneemt en gegevens die worden verwerkt bij de ondersteuning van de gebruiker, zoals de relevante
      BRP-gegevens en gegevens met betrekking tot het soort apparaat waarmee op elektronische wijze gecommuniceerd kan
      worden;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel4
  - number: 4.b.7°
    text: |-
      gegevens noodzakelijk voor de dienst Algemene bekendmakingen, mededelingen en kennisgevingen, waaronder het
      burgerservicenummer, de geboortedatum, het actuele adres van de gebruiker en het e-mailadres;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel4
  - number: 4.b.8°
    text: |-
      gegevens noodzakelijk voor de dienst Persoonlijke gegevens, waaronder de gegevens genoemd onder 1°, het
      burgerservicenummer en overige gegevens waarin inzage kan worden verleend via deze dienst;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel4
  - number: 4.c
    text: 'over de vertegenwoordigde in MijnOverheid en de gemachtigde in MijnOverheid:'
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel4
  - number: 4.c.1°
    text: |-
      de naam en de geboortedatum van de vertegenwoordigde in MijnOverheid en de noodzakelijke gegevens om deze correct
      weer te geven aan de gemachtigde in MijnOverheid;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel4
  - number: 4.c.2°
    text: het burgerservicenummer van de vertegenwoordigde in MijnOverheid;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel4
  - number: 4.c.3°
    text: |-
      de gebruiksgegevens, waaronder gegevens over de verzending van notificaties en het eventueel falen
      daarvan, gegevens over de handelingen van de gemachtigde in MijnOverheid ten aanzien van de gegevens van de
      vertegenwoordigde in MijnOverheid, waaronder begrepen het wijzigen van gegevens, inclusief gegevens over het falen
      van functies, en overige gegevens met betrekking tot het soort, tijdstip en kenmerken van het gebruik;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel4
  - number: 4.c.4°
    text: wijzigingen van meta-gegevens van het bericht of de berichten waarop de machtiging betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel4
  - number: 4.c.5°
    text: |-
      gegevens noodzakelijk voor de ondersteuning bij het veilige en betrouwbare gebruik van MijnOverheid, waaronder het
      burgerservicenummer, gegevens in het bericht van de afnemer of in een andere functionaliteit van MijnOverheid die
      de afnemer afneemt en gegevens die worden verwerkt bij de ondersteuning van de gebruiker.
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel4
  - number: 4.d
    text: |-
      over afnemers van MijnOverheid: administratieve gegevens noodzakelijk in verband met het gebruik door de afnemer
      van MijnOverheid, waaronder, indien van toepassing, de naam van de bevoegde bestuurder van de rechtspersoon die
      gebruik maakt van MijnOverheid en de naam, de functie, het e-mailadres en het telefoonnummer van contactpersonen
      bij de betreffende afnemer.
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel4
  - number: '5'
    text: |-
      Onze Minister verwerkt voor de inrichting, beschikbaarstelling, instandhouding, werking, beveiliging en
      betrouwbaarheid van het BSN-Koppelregister de volgende persoonsgegevens:
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel5
  - number: 5.a
    text: |-
      over de gebruiker van een toegelaten privaat of publiek identificatiemiddel, erkend bedrijfs- of organisatiemiddel
      of machtiging die elektronische diensten wil afnemen:
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel5
  - number: 5.a.1°
    text: de naam en de noodzakelijke gegevens om deze correct weer te geven, de geboortedatum en de datum van overlijden;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel5
  - number: 5.a.2°
    text: |-
      het burgerservicenummer of een versleutelde of afgeleide vorm daarvan ter identificatie van de gebruiker van
      een toegelaten privaat of publiek identificatiemiddel, bedrijfs- of organisatiemiddel of machtiging of het uniek
      identificerend nummer of een afgeleide vorm daarvan ingeval van authenticatie buiten Nederland en binnen de EU;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel5
  - number: 5.a.3°
    text: |-
      de datum van totstandkoming en het niet langer gebruiken van de koppeling tussen het toegelaten private of publieke
      identificatiemiddel, bedrijfs- of organisatiemiddel of machtiging en de afgeleide vorm van het burgerservicenummer
      of het uniek identificerend nummer ter identificatie van de gebruiker;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel5
  - number: 5.a.4°
    text: statusgegevens van de aan de gebruiker gekoppelde middelen;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel5
  - number: 5.b
    text: |-
      over afnemers van het BSN-Koppelregister: administratieve gegevens noodzakelijk in verband met het gebruik van
      het BSN-Koppelregister, waaronder, indien van toepassing, de naam van de bevoegde bestuurder van de rechtspersoon
      die gebruik maakt van het BSN-koppelregister en de naam, de functie, het e-mailadres en het telefoonnummer van
      contactpersonen bij de betreffende afnemer.
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel5
  - number: 5a
    text: |-
      Onze Minister verwerkt voor de inrichting, beschikbaarstelling, instandhouding, werking en betrouwbaarheid van de
      routeringsvoorziening de volgende persoonsgegevens over:
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel5a
  - number: 5a.a
    text: |-
      de gebruiker van een toegelaten publiek of privaat identificatiemiddel of erkend bedrijfs- of organisatiemiddel,
      die dit middel wil gebruiken in het kader van elektronische dienstverlening:
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel5a
  - number: 5a.a.1°
    text: |-
      de voornaam, achternaam, geboortedatum, geboortenaam, geboorteplaats, actueel adres en geslacht, in voorkomend
      geval in versleutelde vorm;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel5a
  - number: 5a.a.2°
    text: |-
      een nummer dat ter identificatie van een persoon kan worden gebruikt of tot een persoon kan worden herleid,
      waaronder het burgerservicenummer of een versleutelde of afgeleide vorm daarvan en het afgeleide uniek
      identificerend nummer in geval van authenticatie buiten Nederland en binnen de EU;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel5a
  - number: 5a.a.3°
    text: |-
      de gebruiksgegevens, waaronder het IP-adres en de kenmerken van de gebruikte software en hardware van het apparaat
      waarmee de gebruiker is ingelogd, handelingen van de gebruiker, het door de gebruiker gebruikte identificatiemiddel
      en betrouwbaarheidsniveau, de website van de organisatie waar de gebruiker een middel aanvraagt of vanuit welke de
      gebruiker inlogt, sessiegegevens, waaronder cookies, en overige gegevens met betrekking tot het soort en tijdstip,
      kenmerken van het gebruik waaronder gegevens over toegang tot medische diensten waar mogelijk in versleutelde vorm;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel5a
  - number: 5a.b
    text: |-
      de vertegenwoordigde in het geval van machtiging: een nummer dat ter identificatie van de vertegenwoordigde
      kan worden gebruikt of tot de vertegenwoordigde kan worden herleid, waaronder het burgerservicenummer of een
      versleutelde of afgeleide vorm daarvan;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel5a
  - number: 5a.c
    text: |-
      afnemers van de routeringsvoorziening: administratieve gegevens noodzakelijk in verband met het gebruik door de
      afnemer van de routeringsvoorziening, waaronder, indien van toepassing, de naam van de bevoegde bestuurder van
      de rechtspersoon die gebruik maakt van de routeringsvoorziening en de naam, de functie, het e-mailadres en het
      telefoonnummer van contactpersonen bij de betreffende afnemer.
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel5a
  - number: 5d.1
    text: |-
      Onze Minister verwerkt voor de inrichting, beschikbaarstelling, instandhouding, werking en beveiliging van de
      eIDAS-voorziening de volgende persoonsgegevens over de gebruiker van een toegelaten of erkend identificatiemiddel
      die dit middel wil gebruiken in het kader van elektronische dienstverlening:
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel5d
  - number: 5d.1.a
    text: naam en de noodzakelijke gegevens om deze correct weer te geven;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel5d
  - number: 5d.1.b
    text: geboortedatum;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel5d
  - number: 5d.1.c
    text: uniek identificerend nummer of een afgeleide vorm daarvan;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel5d
  - number: 5d.1.d
    text: |-
      de gebruiksgegevens, waaronder het IP-adres en de kenmerken van de gebruikte software en hardware van het apparaat
      waarmee de gebruiker van een toegelaten of erkend identificatiemiddel is ingelogd, handelingen van de gebruiker,
      het door de gebruiker gekozen betrouwbaarheidsniveau, de website vanuit welke de gebruiker inlogt, sessiegegevens,
      waaronder cookies, en overige gegevens met betrekking tot het soort en tijdstip, kenmerken van het gebruik
      waaronder gegevens over toegang tot medische diensten waar mogelijk in versleutelde vorm;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel5d
  - number: 5d.1.e
    text: |-
      gegevens die relevant zijn voor de adequate werking van de voorziening, waaronder in ieder geval de EU-landkeuze
      van de gebruiker en de status van de koppeling tussen het burgerservicenummer en het uniek identificerend nummer;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel5d
  - number: 5d.1.f
    text: burgerservicenummer of een versleutelde of afgeleide vorm daarvan.
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel5d
  - number: 5d.2
    text: 'Indien geen zekerheid omtrent uniciteit kan worden verkregen, verwerkt Onze Minister tevens de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel5d
  - number: 5d.2.a
    text: geboortenaam en de noodzakelijke gegevens om deze correct weer te geven;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel5d
  - number: 5d.2.b
    text: geboorteplaats;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel5d
  - number: 5d.2.c
    text: geslacht;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel5d
  - number: 5d.2.d
    text: adres.
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel5d
  - number: 5e
    text: |-
      De gegevens als bedoeld in de [artikelen 2][ref1], [3][ref2] en [5 tot en met 5d][ref3] worden niet gebruikt voor
      andere doeleinden dan de goede werking van identificatiemiddelen en de goede en veilige toegang met die middelen of
      via machtiging tot elektronische dienstverlening.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037987#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0037987#Artikel5
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel5e
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0037987
        artikel: '3'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0037987
        artikel: '5'
        hoofdstuk: '2'
  - number: 5f
    text: |-
      Onze Minister kan de volgende gegevens verwerken, indien dit noodzakelijk is voor het waarborgen van de veilige
      toegang tot en de werking van de elektronische dienstverlening en het voorkomen van misbruik of oneigenlijk gebruik
      van de toegang tot elektronische dienstverlening:
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel5f
  - number: 5f.a
    text: |-
      de gegevens, bedoeld in de [artikelen 2 tot en met 5d][ref1], die verwerkt worden voor de inrichting,
      beschikbaarstelling, instandhouding, werking, beveiliging en betrouwbaarheid van de voorzieningen van de generieke
      digitale infrastructuur;


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel2
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel5f
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '2'
        hoofdstuk: '2'
  - number: 5f.b
    text: |-
      de gegevens en inlichtingen, bedoeld in [artikel 19 van de wet][ref1], die verstrekt worden door de
      bestuursorganen en aangewezen organisaties, aanbieders van een toegelaten identificatiemiddel en op grond van
      [artikel 11 van de wet][ref2] erkende middelenuitgevers en diensten;


      [ref1]: https://wetten.overheid.nl/BWBR0048156#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0048156#Artikel11
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel5f
    references:
      - id: ref1
        bwb_id: BWBR0048156
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0048156
        artikel: '11'
  - number: 5f.c
    text: |-
      de uit onderzoek voortgekomen persoonsgegevens, met inbegrip van openbaar toegankelijke persoonsgegevens en
      persoonsgegevens die door derden aan Onze Minister verstrekt zijn.
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel5f
  - number: '6.1'
    text: 'Onze Minister verstrekt aan de afnemers van DigiD, aan de eIDAS-voorziening en aan een routeringsvoorziening:'
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel6
  - number: 6.1.a
    text: |-
      het burgerservicenummer, of een versleutelde of afgeleide vorm daarvan ter identificatie van de gebruiker van
      DigiD, ten behoeve van de vaststelling van de identiteit van de gebruiker van DigiD;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel6
  - number: 6.1.b
    text: het door de gebruiker van DigiD gekozen betrouwbaarheidsniveau en het IP-adres;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel6
  - number: 6.1.c
    text: |-
      de naam en de noodzakelijke gegevens om deze correct weer te geven, het uniek identificerend nummer ingeval van
      authenticatie buiten Nederland en de geboortedatum van de gebruiker van DigiD ten behoeve van de elektronische
      identificatie ter zake van grensoverschrijdende elektronische dienstverlening binnen de Europese Unie welke
      plaatsvindt door tussenkomst van de eIDAS-voorziening.
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel6
  - number: '6.2'
    text: |-
      Onze minister verstrekt aan erkende diensten als bedoeld in [artikel 9, tweede lid][ref1], of
      [artikel 11, tweede lid, van de wet][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0048156#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0048156#Artikel11
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0048156
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0048156
        artikel: '11'
  - number: 6.2.a
    text: |-
      het burgerservicenummer, of een versleutelde vorm daarvan ter identificatie van de gebruiker van DigiD, ten
      behoeve van het bewijs en de verificatie van de identiteit van een gebruiker van DigiD bij een aanvraag voor
      een identificatiemiddel als bedoeld in paragraaf 2.1. van de bijlage bij [Uitvoeringsverordening (EU) 2015/1502]
      (33402R2015);
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel6
  - number: 6.2.b
    text: het door de gebruiker van DigiD gekozen betrouwbaarheidsniveau en het IP-adres.
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel6
  - number: '7'
    text: 'Onze Minister verstrekt op verzoek van afnemers van DigiD Machtigen:'
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel7
  - number: 7.a
    text: een bewijs van geldigheid van een specifieke machtigingsregistratie voor diensten van de betreffende afnemer;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel7
  - number: 7.b
    text: |-
      een overzicht van alle machtigingsaanvragen en machtigingsregistraties die voor diensten van de betreffende afnemer
      zijn afgegeven.
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel7
  - number: 7a
    text: 'Onze Minister verstrekt:'
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel7a
  - number: 7a.a
    text: |-
      op verzoek van afnemers van de bevoegdheidsverklaringsdienst aan die afnemers een verklaring over de bevoegdheid
      van een beoogd vertegenwoordiger om te handelen namens een beoogd vertegenwoordigde of een bericht zonder deze
      informatie, wanneer een bevoegdheid om te handelen namens de beoogd vertegenwoordigde niet is vastgesteld;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel7a
  - number: 7a.b
    text: 'aan de gezagsmodule uit de bevoegdheidsverklaringsdienst ter verkrijging van een gezagsverklaring:'
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel7a
  - number: 7a.b.1
    text: het burgerservicenummer van de beoogd vertegenwoordiger en de beoogd vertegenwoordigde; en
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel7a
  - number: 7a.b.2
    text: de dienst en de naam van de dienstaanbieder waar de beoogd vertegenwoordiger gebruik van wil maken.
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel7a
  - number: 7b
    text: 'Onze Minister verstrekt uit de gezagsmodule:'
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel7b
  - number: 7b.a
    text: |-
      aan de bevoegdheidsverklaringsdienst, indien sprake is van een ouderlijk gezagsrelatie tussen de beoogd
      vertegenwoordiger en de beoogd vertegenwoordigde:
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel7b
  - number: 7b.a.1
    text: het burgerservicenummer van de beoogd vertegenwoordiger en de beoogd vertegenwoordigde; en
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel7b
  - number: 7b.a.2
    text: |-
      een bevestiging van het bestaan van een ouderlijk gezagsrelatie tussen de beoogd vertegenwoordiger en de beoogd
      vertegenwoordigde;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel7b
  - number: 7b.b
    text: 'op verzoek van een afnemer van de gezagsmodule aan die afnemer:'
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel7b
  - number: 7b.b.1
    text: |-
      een overzicht van de burgerservicenummers van de personen met ouderlijk gezag over de persoon waarop het verzoek
      ziet;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel7b
  - number: 7b.b.2
    text: |-
      een overzicht van de burgerservicenummers van de personen waarover de persoon waarop het verzoek ziet ouderlijk
      gezag heeft; of
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel7b
  - number: 7b.b.3
    text: |-
      indien sprake is van een ouderlijk gezagsrelatie tussen de personen waarop het verzoek ziet, een bevestiging
      van het bestaan van die ouderlijk gezagsrelatie en het soort ouderlijk gezag onder vermelding van de
      burgerservicenummers van die personen.
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel7b
  - number: '8'
    text: 'Onze Minister verstrekt aan een afnemer van MijnOverheid:'
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel8
  - number: 8.a
    text: |-
      het burgerservicenummer, waar van toepassing de status van de toepasselijke berichtenvoorkeur van de gebruiker
      van MijnOverheid, voorafgaand aan het aanleveren en ter bevestiging van het afleveren van berichten en gegevens,
      of het falen daarvan, ten behoeve van de werking van de diensten van MijnOverheid, en op verzoek van een afnemer
      informatie over het openen van een bericht door de gebruiker van MijnOverheid, teneinde de gebruiker te attenderen
      op een eerder aan hem gezonden bericht;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel8
  - number: 8.b
    text: |-
      op verzoek van een afnemer die de Berichtenbox van MijnOverheid als verplicht kanaal voor elektronisch
      berichtenverkeer heeft aangewezen, informatie of een gebruiker van een MijnOverheid-account waarop de
      uitvoering van die taak betrekking heeft, zijn account wel of niet in gebruik heeft genomen en het bijbehorende
      burgerservicenummer;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel8
  - number: 8.c
    text: |-
      op verzoek van een afnemer, informatie of voor een gebruiker van MijnOverheid een emailadres of
      ander kanaal is verwerkt waarop die gebruiker van MijnOverheid notificaties ontvangt als bedoeld in
      [artikel 4, onderdeel b, subonderdeel 3°][ref1], en het bijbehorende burgerservicenummer;


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel4
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '4'
        hoofdstuk: '2'
  - number: 8.c
    text: op verzoek van een afnemer inlichtingen die benodigd zijn om aflevering van een bericht te kunnen bevestigen;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel8
  - number: 8.d
    text: |-
      op verzoek van een afnemer, gegevens over het ontvangen door een gebruiker van een notificatie over een bericht
      waarop het verzoek ziet of het eventueel falen daarvan, de bijbehorende datum en de tijd en het bijbehorende
      burgerservicenummer.
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel8
  - number: '9'
    text: 'Onze Minister verstrekt uit het BSN-koppelregister:'
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel9
  - number: 9.a
    text: |-
      het burgerservicenummer in versleutelde of afgeleide vorm van de gebruiker van een toegelaten privaat of publiek
      identificatiemiddel of een erkend bedrijfs- of organisatiemiddel die dit nummer wil gebruiken in het kader van
      elektronische dienstverlening door bestuursorganen of aangewezen organisaties aan de routeringsvoorziening, DigiD,
      de erkende authenticatiedienst, of de erkende machtigingsdienst;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel9
  - number: 9.b
    text: het uniek identificerend nummer in afgeleide vorm aan de eIDAS-voorziening.
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel9
  - number: 9a
    text: |-
      Onze Minister verstrekt de voornaam, achternaam, geboortedatum, het burgerservicenummer, een afgeleide vorm van
      het uniek identificerend nummer in geval van authenticatie buiten Nederland, geboortenaam, geboorteplaats, actueel
      adres en geslacht en het gebruikte betrouwbaarheidsniveau van de gebruiker van een toegelaten privaat of publiek
      identificatiemiddel die dit middel gebruikt in het kader van elektronische dienstverlening door bestuursorganen
      of aangewezen organisaties, en het burgerservicenummer van de vertegenwoordigde zo mogelijk in versleutelde of
      afgeleide vorm aan de bedoelde bestuursorganen of aangewezen organisaties.
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel9a
  - number: 9d
    text: 'Onze Minister verstrekt uit de eIDAS-voorziening:'
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel9d
  - number: 9d.a
    text: |-
      aan het BSN-Koppelregister van de gebruiker van een toegelaten of erkend identificatiemiddel die dit middel wil
      gebruiken in het kader van elektronische dienstverlening het burgerservicenummer en de afgeleide vorm hiervan, en
      aan een routeringsvoorziening in de zin van [artikel 1 van de wet][ref1] het burgerservicenummer in versleutelde
      vorm en het uniek identificerend nummer in afgeleide vorm;


      [ref1]: https://wetten.overheid.nl/BWBR0048156#Artikel1
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel9d
    references:
      - id: ref1
        bwb_id: BWBR0048156
        artikel: '1'
  - number: 9d.b
    text: |-
      aan een routeringsvoorziening ten behoeve van bestuursorganen of aangewezen organisaties: de naam en de
      noodzakelijke gegevens om deze correct weer te geven, geboortedatum, geboorteplaats, adres en geslacht in
      versleutelde vorm van de gebruiker van een toegelaten of erkend identificatiemiddel die dit middel wil gebruiken in
      het kader van elektronische dienstverlening;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel9d
  - number: 9d.c
    text: |-
      bij grensoverschrijdende authenticatie het uniek identificerend nummer en indien beschikbaar het
      burgerservicenummer aan het BSN-Koppelregister en een afgeleide vorm daarvan aan bestuursorganen of aangewezen
      organisaties in het kader van elektronische dienstverlening.
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel9d
  - number: 9d.d
    text: |-
      bij grensoverschrijdende authenticatie het van het burgerservicenummer afgeleide uniek identificerend nummer, de
      naam en de noodzakelijke gegevens om deze correct weer te geven, geboortedatum, geboorteplaats, adres en geslacht
      aan de betreffende andere lidstaat.
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel9d
  - number: '10'
    text: |-
      Onverminderd het bepaalde in de [artikelen 6 tot en met 9d][ref1], verstrekt Onze Minister geen gegevens over een
      bezoeker of gebruiker van de in de [artikelen 2 tot en met 5d][ref2] genoemde voorzieningen en middelen of de uit
      onderzoek voortgekomen gegevens, bedoeld in [artikel 5f, onderdeel c][ref3], aan anderen dan de bezoeker of de
      gebruiker zelf zonder voorafgaande toestemming van de bezoeker of de gebruiker, tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0037987#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0037987#Artikel5f
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '6'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0037987
        artikel: '2'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0037987
        artikel: 5f
        hoofdstuk: '2'
  - number: 10.a
    text: |-
      het een verstrekking betreft aan een overheidsorgaan of rechtspersoon met een wettelijke taak die noodzakelijk is
      voor de borging van de beveiliging en betrouwbaarheid van de betreffende voorziening, of
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel10
  - number: 10.b
    text: hij daartoe gerechtigd is op grond van een wettelijke bepaling.
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel10
  - number: '11.1'
    text: |-
      De gegevens over bezoekers van DigiD, bedoeld in [artikel 2, onderdelen a en b][ref1], worden maximaal 18 maanden
      bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel2
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '2'
        hoofdstuk: '2'
  - number: '11.2'
    text: |-
      De naam en de noodzakelijke gegevens om deze correct weer te geven, de geboortedatum, de datum van overlijden, de
      nationaliteit, gegevens om het ingezetenschap of niet-ingezetenschap in de basisregistratie personen vast te kunnen
      stellen en het adres, bedoeld in [artikel 2, onderdeel c, onder 1°][ref1], worden maximaal 6 weken bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel2
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '2'
        hoofdstuk: '2'
  - number: '11.3'
    text: |-
      De gebruiksgegevens, bedoeld in [artikel 2, onderdeel c, onder 4°][ref1], worden maximaal 5 jaar bewaard, met dien
      verstande dat de sessiegegevens slechts worden bewaard tot het moment van uitloggen door de gebruiker.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel2
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '2'
        hoofdstuk: '2'
  - number: '11.4'
    text: |-
      Een nummer dat ter identificatie van een persoon kan worden gebruikt als bedoeld in
      [artikel 2, onderdeel c, onder 2°][ref1], wordt bewaard:


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel2
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '2'
        hoofdstuk: '2'
  - number: 11.4.a
    text: gedurende het aanvraagproces maximaal 18 maanden, of;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel11
  - number: 11.4.b
    text: zo lang het bijbehorende DigiD geldig is, en zodra dat niet meer het geval is maximaal 5 jaar.
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel11
  - number: '11.5'
    text: |-
      De accountgegevens, bedoeld in [artikel 2, onderdeel c, onder 3°][ref1], die nodig zijn voor het actuele
      gebruik van DigiD, zoals het actuele en historische mobiele of vaste telefoonnummer en e-mailadres, de actuele
      gebruikersnaam, het actuele wachtwoord, het account-ID, de status van het account, de gekozen documentsoort
      voor elektronische identificatie en het soort apparaat waarmee op elektronische wijze gecommuniceerd kan worden
      met het Nederlands paspoort, de Nederlandse identiteitskaart of het Nederlands rijbewijs, de status van het
      identificatiemiddel worden bewaard zo lang het bijbehorende DigiD geldig is, en zodra dat niet meer het geval is
      maximaal 5 jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel2
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '2'
        hoofdstuk: '2'
  - number: '11.6'
    text: |-
      De overige accountgegevens, bedoeld in [artikel 2, onderdeel c, onder 3°][ref1], worden maximaal 18 maanden
      bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel2
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '2'
        hoofdstuk: '2'
  - number: '11.7'
    text: |-
      De gegevens die relevant zijn voor de adequate werking van de voorziening, bedoeld in
      [artikel 2, onderdeel c, onder 5°][ref1], worden bewaard zo lang de gebruiker van DigiD is ingelogd.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel2
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '2'
        hoofdstuk: '2'
  - number: '11.8'
    text: |-
      De gegevens noodzakelijk voor de ondersteuning van de gebruiker en de administratie van DigiD, bedoeld in
      [artikel 2, onderdeel c, onder 6°][ref1], worden bewaard voor de duur van de ondersteuning en daarna maximaal
      18 maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel2
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '2'
        hoofdstuk: '2'
  - number: '11.9'
    text: |-
      De gegevens afkomstig van de chip van het Nederlands paspoort, het Nederlandse identiteitsbewijs of het Nederlandse
      rijbewijs, bedoeld in [artikel 2, onderdeel c, onder 7° en 8°][ref1], worden bewaard zolang de sessie duurt.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel2
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '2'
        hoofdstuk: '2'
  - number: '11.10'
    text: |-
      De eIDAS gegevens, bedoeld in [artikel 2, onderdeel c, onder 9°][ref1], worden maximaal 2 jaar bewaard, met
      uitzondering van uniek identificerende nummers, burgerservicenummers en de versleutelde vormen daarvan, welke
      maximaal vijf jaar worden bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel2
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '2'
        hoofdstuk: '2'
  - number: '11.11'
    text: |-
      De gegevens over afnemers van DigiD, bedoeld in [artikel 2, onderdeel d][ref1], worden bewaard voor de duur van het
      gebruik door de afnemer van DigiD, en daarna maximaal vijf jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel2
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '2'
        hoofdstuk: '2'
  - number: '11.12'
    text: |-
      Een reservekopie van alle in dit artikel genoemde gegevens wordt maximaal vier maanden bewaard nadat de
      bewaartermijnen bedoeld in de andere leden van dit artikel zijn verlopen.
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel11
  - number: '12.1'
    text: |-
      De gegevens over bezoekers van DigiD Machtigen, bedoeld in [artikel 3, onderdeel a][ref1], worden maximaal 18
      maanden bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel3
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '3'
        hoofdstuk: '2'
  - number: '12.2'
    text: |-
      De naam en de noodzakelijke gegevens om deze correct weer te geven, de reden voor de opschorting
      van de persoonslijst in de basisregistratie personen, het adres en de geboortedatum, bedoeld in
      [artikel 3, onderdeel b, onder 1°][ref1], worden maximaal 6 weken bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel3
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '3'
        hoofdstuk: '2'
  - number: '12.3'
    text: |-
      De gebruiksgegevens, bedoeld in [artikel 3, onderdeel b, onder 4° en 5°][ref1], worden maximaal 5 jaar bewaard,
      met dien verstande dat de sessiegegevens slechts worden bewaard tot het moment van uitloggen door de gebruiker van
      DigiD Machtigen.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel3
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '3'
        hoofdstuk: '2'
  - number: '12.4'
    text: |-
      Het burgerservicenummer of het door de Kamer van Koophandel, genoemd in
      [artikel 2 van de Wet op de Kamer van Koophandel][ref1], uniek toegekende nummer aan een onderneming die
      in Nederland is gevestigd en toebehoort aan een natuurlijke persoon wordt bewaard zo lang de bijbehorende
      machtigingsaanvraag dan wel machtigingsregistratie niet is beëindigd, en zodra die wel is beëindigd maximaal
      5 jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0034331#Artikel2
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0034331
        artikel: '2'
  - number: '12.5'
    text: |-
      De gebruikersgegevens, bedoeld in [artikel 3, onderdeel b, onder 3°][ref1], worden bewaard zo lang
      machtigingsaanvraag dan wel machtigingsregistratie niet is beëindigd en zodra die wel is beëindigd maximaal 5 jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel3
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '3'
        hoofdstuk: '2'
  - number: '12.6'
    text: |-
      De gegevens noodzakelijk voor de ondersteuning van de gebruiker, bedoeld in
      [artikel 3, onderdeel b, onder 6°][ref1], worden bewaard voor de duur van de ondersteuning en daarna maximaal
      18 maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel3
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '3'
        hoofdstuk: '2'
  - number: '12.7'
    text: |-
      De gegevens over afnemers van DigiD Machtigen, bedoeld in [artikel 3, onderdeel c][ref1], worden bewaard voor de
      duur van het gebruik door de afnemer van DigiD Machtigen, en daarna maximaal vijf jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel3
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '3'
        hoofdstuk: '2'
  - number: '12.8'
    text: Een reservekopie van alle in dit artikel genoemde gegevens wordt maximaal vier maanden bewaard.
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel12
  - number: 12a.1
    text: |-
      De gegevens bedoeld in [artikel 3a][ref1] worden niet langer bewaard dan de duur van de sessie.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel3a
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: 3a
        hoofdstuk: '2'
  - number: 12a.2
    text: |-
      In afwijking van het eerste lid worden de gebruiksgegevens, bedoeld in [artikel 3a, onderdeel a, onder 3][ref1],
      maximaal 5 jaar bewaard, met uitzondering van de sessiegegevens, die slechts worden bewaard tot het moment van
      uitloggen door de gebruiker.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel3a
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: 3a
        hoofdstuk: '2'
  - number: 12a.3
    text: |-
      In afwijking van het eerste lid worden de gegevens over afnemers, bedoeld in [artikel 3a, onderdeel c][ref1],
      bewaard voor de duur van het gebruik door de afnemer, en daarna maximaal vijf jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel3a
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: 3a
        hoofdstuk: '2'
  - number: 12b.1
    text: |-
      De gegevens bedoeld in [artikel 3b][ref1] worden niet langer bewaard dan de duur van de sessie.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel3b
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: 3b
        hoofdstuk: '2'
  - number: 12b.2
    text: |-
      In afwijking van het eerste lid worden de gebruiksgegevens, bedoeld in
      [artikel 3b, eerste lid, onderdeel a, onder 3][ref1], maximaal 5 jaar bewaard, met uitzondering van de
      sessiegegevens, die slechts worden bewaard tot het moment van uitloggen door de gebruiker.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel3b
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: 3b
        hoofdstuk: '2'
  - number: 12b.3
    text: |-
      In afwijking van het eerste lid worden de gegevens over afnemers, bedoeld in
      [artikel 3b, tweede lid, onderdeel c][ref1], bewaard voor de duur van het gebruik door de afnemer, en daarna
      maximaal vijf jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel3b
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: 3b
        hoofdstuk: '2'
  - number: '13.1'
    text: |-
      De gegevens over bezoekers van MijnOverheid, bedoeld in [artikel 4, onderdeel a][ref1], worden maximaal 18 maanden
      bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel4
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '4'
        hoofdstuk: '2'
  - number: '13.2'
    text: |-
      De gegevens over gebruikers van MijnOverheid, bedoeld in [artikel 4, onderdeel b, onder 4° en 5°][ref1], worden
      maximaal 5 jaar bewaard, met dien verstande dat sessie cookies slechts worden bewaard tot het moment van uitloggen.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel4
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '4'
        hoofdstuk: '2'
  - number: '13.3'
    text: |-
      De gegevens over een gebruiker van MijnOverheid en zijn MijnOverheid-account, bedoeld in
      [artikel 4, onderdeel b, onder 1°, 2° en 3°][ref1], worden bewaard zolang het bijbehorende MijnOverheid-account
      bestaat, en zodra het account is opgeheven, maximaal 1 jaar, met uitzondering van gegevens om te bepalen of een
      natuurlijk persoon kwalificeert als gebruiker van MijnOverheid waarvoor de Berichtenbox beschikbaar moet kunnen
      zijn, die bewaard blijven voor de duur van het aanmaak- of controleproces.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel4
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '4'
        hoofdstuk: '2'
  - number: '13.4'
    text: |-
      De gegevens noodzakelijk voor de ondersteuning van de gebruiker, bedoeld in
      [artikel 4, onderdeel b, onder 6°][ref1], worden bewaard voor de duur van de ondersteuning en daarna maximaal
      18 maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel4
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '4'
        hoofdstuk: '2'
  - number: '13.5'
    text: |-
      De gegevens over een gebruiker van MijnOverheid en zijn MijnOverheid-account, bedoeld in
      [artikel 4, onderdeel b, onder 7° en 8°][ref1], worden bewaard zolang het bijbehorende MijnOverheid-account
      bestaat en zodra het account is opgeheven maximaal 1 jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel4
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '4'
        hoofdstuk: '2'
  - number: '13.6'
    text: |-
      De bewaartermijn van de gegevens over de vertegenwoordigde en de vertegenwoordiger, bedoeld in
      [artikel 4, onderdeel c][ref1], is als volgt:


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel4
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '4'
        hoofdstuk: '2'
  - number: 13.6.a
    text: de gegevens, bedoeld onder 1° en 2°, blijven bewaard tot het moment van uitloggen;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel13
  - number: 13.6.b
    text: de gegevens, bedoeld onder 3°, blijven maximaal 5 jaar bewaard;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel13
  - number: 13.6.c
    text: |-
      de gegevens, bedoeld onder 4°, blijven bewaard zo lang het MijnOverheid-account bestaat, en zodra dat account is
      opgeheven, maximaal 1 jaar;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel13
  - number: 13.6.d
    text: |-
      de gegevens, bedoeld onder 5°, blijven bewaard zo lang het MijnOverheid-account bestaat, en zodra dat account is
      opgeheven maximaal 1 jaar.
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel13
  - number: '13.7'
    text: |-
      Voor de gegevens, bedoeld in [artikel 4][ref1], die zijn betrokken bij of relevant zijn voor het onderzoek naar een
      incident waarbij integriteit, vertrouwelijkheid of beschikbaarheid van het systeem in het geding is, wordt de in
      het eerste, derde en vierde, en vijfde lid, onderdeel c, genoemde bewaartermijn van 18 maanden of 1 jaar verlengd
      tot 36 maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel4
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '4'
        hoofdstuk: '2'
  - number: '13.8'
    text: |-
      De gegevens over afnemers van MijnOverheid, bedoeld in [artikel 4, onderdeel d][ref1], worden bewaard voor de duur
      van het gebruik door de afnemer van MijnOverheid, en daarna maximaal vijf jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel4
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '4'
        hoofdstuk: '2'
  - number: '13.9'
    text: Een reservekopie van alle in dit artikel genoemde gegevens wordt maximaal vier maanden bewaard.
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel13
  - number: '14'
    text: |-
      De bewaartermijn van de gegevens, bedoeld in [artikel 5][ref1], is als volgt:


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel5
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '5'
        hoofdstuk: '2'
  - number: 14.a
    text: |-
      de naam en de noodzakelijke gegevens om deze correct weer te geven, de geboortedatum, de datum van overlijden, het
      uniek identificerend nummer en het burgerservicenummer en de versleutelde vorm daarvan worden niet langer bewaard
      dan nodig is om de gegevens op juistheid te controleren;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel14
  - number: 14.b
    text: |-
      het burgerservicenummer in afgeleide vorm en het uniek identificerend nummer in afgeleide
      vorm ingeval van authenticatie buiten Nederland en binnen de EU, en de gegevens, bedoeld in
      [artikel 5, onderdeel a, onder 3° en 4°][ref1], worden bewaard zo lang als de koppeling tussen het toegelaten
      private of publieke identificatiemiddel of erkende bedrijfs- of organisatiemiddel bestaat en zodra dat niet meer
      het geval is, maximaal 5 jaar;


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel5
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '5'
        hoofdstuk: '2'
  - number: 14.c
    text: |-
      de gegevens over afnemers van de BSN-Koppelregister, bedoeld in artikel 5, onderdeel b, worden bewaard voor de duur
      van het gebruik van het BSN-Koppelregister en daarna maximaal vijf jaar.
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel14
  - number: 14a
    text: |-
      De bewaartermijn van de gegevens, bedoeld in [artikel 5a][ref1], is als volgt:


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel5a
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: 5a
        hoofdstuk: '2'
  - number: 14a.a
    text: |-
      de gegevens, bedoeld in [artikel 5a, onderdeel a, onder 1°][ref1], worden bewaard zolang de gebruiker het
      identificatiemiddel gebruikt;


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel5a
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: 5a
        hoofdstuk: '2'
  - number: 14a.b
    text: |-
      een nummer dat ter identificatie kan worden gebruikt als bedoeld in
      [artikel 5a, onderdeel a, onder 2°, of onderdeel b][ref1], wordt maximaal 18 maanden na afloop van het
      authenticatieproces bewaard;


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel5a
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: 5a
        hoofdstuk: '2'
  - number: 14a.c
    text: |-
      de gebruiksgegevens, bedoeld in [artikel 5a, onderdeel a, onder 3°][ref1], worden maximaal vijf jaar bewaard, met
      dien verstande dat de sessiegegevens slechts worden bewaard tot het moment van uitloggen door de gebruiker;


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel5a
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: 5a
        hoofdstuk: '2'
  - number: 14a.d
    text: |-
      de gegevens over afnemers van de routeringsvoorziening, bedoeld in [artikel 5a, onderdeel c][ref1], worden bewaard
      voor de duur van het gebruik ervan door de routeringsvoorziening en daarna maximaal vijf jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel5a
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: 5a
        hoofdstuk: '2'
  - number: 14d.1
    text: |-
      De gegevens, bedoeld in [artikel 5d, eerste lid, onderdelen a en b, en tweede lid][ref1], worden bewaard zolang de
      gebruiker het identificatiemiddel gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel5d
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel14d
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: 5d
        hoofdstuk: '2'
  - number: 14d.2
    text: |-
      Een nummer dat ter identificatie kan worden gebruikt bedoeld in [artikel 5d, eerste lid, onderdelen c en f][ref1],
      worden maximaal 5 jaar bewaard na het laatste gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel5d
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel14d
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: 5d
        hoofdstuk: '2'
  - number: 14d.3
    text: |-
      De gebruiksgegevens, bedoeld in [artikel 5d, eerste lid, onderdelen d en e][ref1], worden maximaal 5 jaar bewaard
      na het laatste gebruik, met dien verstande dat de sessiegegevens slechts worden bewaard tot het moment van
      uitloggen door de gebruiker.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel5d
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel14d
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: 5d
        hoofdstuk: '2'
  - number: 14e
    text: |-
      De bewaartermijn van de gegevens, bedoeld in [artikel 5f, onderdeel c][ref1], is maximaal 5 jaar na afloop van de
      in de [artikelen 11 tot en met 14d][ref2] genoemde bewaartermijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel5f
      [ref2]: https://wetten.overheid.nl/BWBR0037987#Artikel11
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel14e
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: 5f
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0037987
        artikel: '11'
        hoofdstuk: '4'
  - number: '15'
    text: Na het verstrijken van de bewaartermijn worden de gegevens zo spoedig mogelijk vernietigd.
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel15
  - number: 15a
    text: |-
      Teneinde de te verwerken persoonsgegevens te beveiligen en deze te beschermen tegen ongeoorloofde of onrechtmatige
      verwerking en opzettelijk verlies, vernietiging of beschadiging, neemt de in de [artikelen 2 tot en met 15][ref1]
      bedoelde verwerker passende technische, organisatorische en personele maatregelen, waaronder inzake de juiste
      en veilige bediening en gebruik van informatiesystemen, de toegang tot en de beschikbaarheid en integriteit van
      informatiesystemen en het herkennen en herstellen van beveiligingsinbreuken.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel2
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '2'
        hoofdstuk: '2'
  - number: '25'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst en werkt terug tot en met 1 november 2015.
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel25
  - number: '26'
    text: 'Dit besluit wordt aangehaald als: Besluit digitale overheid.'
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel26
