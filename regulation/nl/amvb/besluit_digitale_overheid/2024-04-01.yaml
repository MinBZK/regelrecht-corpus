preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties van 18 januari 2016, nr. 2016-
    0000023784 DCB/CZW/SB;

    Gelet op artikel X, derde lid, van de Wet elektronisch berichtenverkeer Belastingdienst;

    De Afdeling advisering van de Raad van State gehoord (advies van 8 april 2016, nr. No.W04.160008/I);

    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties van 10 mei 2016 nr. 2016-
    0000267641 BZK/CZW/SB;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder: - *afnemer van de bevoegdheidsverklaringsdienst:* een bestuursorgaan
      dat of een aangewezen organisatie die in het kader van elektronische dienstverlening gebruik maakt van de
      bevoegdheidsverklaringsdienst;
        - *afnemer van de gezagsmodule:* een bestuursorgaan dat of aangewezen organisatie die bij de gezagsmodule een
      verzoek indient om een gezagsverklaring;
        - *afnemer van DigiD en DigiD Machtigen:* een bestuursorgaan dat of aangewezen organisatie die in het kader van
      elektronische dienstverlening gebruik maakt van DigiD respectievelijk DigiD Machtigen;
        - *afnemer van de routeringsvoorziening:* een bestuursorgaan dat of aangewezen organisatie die toegang wil
      verlenen tot elektronische diensten door middel van een toegelaten of erkend identificatiemiddel of door middel
      van machtiging;
        - *afnemer van MijnOverheid:* een bestuursorgaan dat of aangewezen organisatie die bij de uitoefening van zijn taak
      of bevoegdheid gebruik maakt van MijnOverheid;
        - *beschikbaarheid:* de mate waarin een informatiesysteem in bedrijf en toegankelijk is op het moment dat een
      organisatie het nodig heeft;
        - *bevoegdheidsverklaring:* een verklaring als bedoeld in [artikel 7a][ref1];
        - *bevoegdheidsverklaringsdienst:* de door Onze Minister beheerde voorziening die aan afnemers van de
      bevoegdheidsverklaringsdienst een bevoegdheidsverklaring afgeeft over de vertegenwoordigingsbevoegdheid van een
      beoogd vertegenwoordiger;
        - *bezoeker van MijnOverheid, DigiD of DigiD Machtigen:* degene die MijnOverheid, DigiD of DigiD Machtigen bezoekt,
      maar niet inlogt of van wie de elektronische aanvraagprocedure voor een DigiD niet is voltooid;
        - *BSN-Koppelregister:* de voorziening, bedoeld in [artikel 5, eerste lid, onder d, van de wet][ref2];
        - *burgerservicenummer:* het nummer, bedoeld in
      [artikel 1, onderdeel b, van de Wet algemene bepalingen burgerservicenummer][ref3];
        - *DigiD:* de voorziening, bedoeld in [artikel 5, eerste lid, onderdeel a, van de wet][ref4];
        - *DigiD Machtigen:* de voorziening voor elektronische registratie van machtigingen die bereikbaar is via het
      webadres machtigen.digid.nl;
        - *eIDAS-voorziening:* de voorziening, bedoeld in [artikel 5, tweede lid, van de wet][ref5];
        - *gebruiker van een bedrijfs- en organisatiemiddel:* een onderneming of rechtspersoon als bedoeld
      in [artikel 5][ref6] onderscheidenlijk [6 van de Handelsregisterwet 2007][ref7] of een op grond van
      [artikel 8, aanhef en onderdeel a, van die wet][ref8] aangewezen rechtspersoon, of een natuurlijke persoon die deze
      onderneming of rechtspersoon vertegenwoordigt, die een erkend bedrijfs- en organisatiemiddel heeft aangevraagd of
      de aanvraagprocedure voor dat middel heeft voltooid;
        - *gebruiker van DigiD:* een natuurlijk persoon die is ingeschreven in de basisregistratie personen, in het bezit
      is van een burgerservicenummer en van wie de elektronische aanvraagprocedure voor een DigiD is voltooid;
        - *gebruiker van DigiD Machtigen:* de vertegenwoordiger, de vertegenwoordigde of een natuurlijke persoon of
      rechtspersoon, die gebruik maakt van de voorziening DigiD Machtigen;
        - *gebruiker van MijnOverheid:* een natuurlijk persoon die is ingeschreven in de basisregistratie personen, in het
      bezit is van een burgerservicenummer, en voor wie een MijnOverheid-account beschikbaar is;
        - *gemachtigde in MijnOverheid:* een gebruiker van MijnOverheid of een rechtspersoon, die met een in DigiD
      Machtigen geregistreerde machtiging in MijnOverheid bepaalde berichten van de vertegenwoordigde in kan zien;
        - *informatiebeveiliging/informatieveiligheid:* het proces van vaststellen van de vereiste betrouwbaarheid van
      informatieverwerking en informatiesystemen in termen van vertrouwelijkheid, beschikbaarheid en integriteit alsmede
      het treffen, onderhouden en controleren van een samenhangend pakket van bijbehorende maatregelen, gericht op de
      toegang tot elektronische dienstverlening;
        - *informatiesysteem:* het geheel van gegevensverzamelingen, de daarbij behorende personen, procedures, processen
      en programmatuur alsmede de getroffen voorzieningen voor opslag, verwerking en communicatie ten behoeve van
      elektronische dienstverlening, waaronder de mobiele applicaties als onderdeel van elektronische dienstverlening;
        - *integriteit/betrouwbaarheid:* de mate waarin een organisatie zich voor zijn bedrijfs- en bestuursprocessen kan
      verlaten op zijn informatievoorziening;
        - *gezagsmodule:* de door Onze Minister beheerde module die een gezagsverklaring genereert en verstrekt;
        - *gezagsverklaring:* een verklaring als bedoeld in [artikel 7b][ref9];
        - *MijnOverheid:* de voorziening die bereikbaar is via het webadres mijn.overheid.nl voor de dienst voor
      elektronisch berichtenverkeer de Berichtenbox, en de diensten voor informatieverschaffing Lopende Zaken,
      Persoonlijke gegevens en Algemene bekendmakingen, mededelingen en kennisgevingen;
        - *MijnOverheid-account:* het domein van een gebruiker van MijnOverheid op MijnOverheid;
        - *notificatie:* een attendering die met een e-mailbericht of via een ander kanaal aan de gebruiker van DigiD,
      DigiD Machtigen of MijnOverheid wordt verstuurd, teneinde hem te informeren over een bericht of wijziging;
        - *Onze Minister:* Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;
        - *overheidsorgaan:* overheidsorgaan als bedoeld in
      [artikel 1, onderdeel c, van de Wet algemene bepalingen burgerservicenummer][ref10];
        - *persoonsgegevens:* hetgeen daaronder wordt verstaan in artikel 4 onder 1 van de Algemene verordening
      gegevensbescherming;
        - *risicomanagement:* het inzichtelijk en systematisch inventariseren, beoordelen en – door het treffen van
      maatregelen – beheersbaar maken van risico’s en kansen op een zodanige wijze dat verantwoording kan worden afgelegd
      over de gemaakte keuzes;
        - *routeringsvoorziening:* de voorziening, bedoeld in [artikel 5, eerste lid, onder c, van de wet][ref11];
        - *Uitvoeringsverordening (EU) 2015/1502:* [Uitvoeringsverordening (EU) 2015/1502](33402R2015) van de Commissie
      van 8 september 2015 tot vaststelling van minimale technische specificaties en procedures betreffende het
      betrouwbaarheidsniveau voor elektronische identificatiemiddelen overeenkomstig artikel 8, derde lid, van
      [Verordening (EU) nr. 910/2014](32014R0910) van het Europees Parlement en de Raad betreffende elektronische
      identificatie en vertrouwensdiensten voor elektronische transacties in de interne markt (PbEU 2015, L235);
        - *vertegenwoordigde:* een natuurlijk persoon of rechtspersoon die zich ter behartiging van zijn belangen in
      het elektronisch verkeer met bestuursorganen en aangewezen organisaties laat vertegenwoordigen door een andere
      natuurlijke persoon of rechtspersoon;
        - *vertegenwoordigde in MijnOverheid:* een natuurlijk persoon die, met een in DigiD Machtigen geregistreerde
      machtiging, een gemachtigde in MijnOverheid toegang verleent tot zijn berichten voor zover deze vallen binnen de
      reikwijdte van de machtiging;
        - *vertrouwelijkheid:* de mate waarin de toegang tot en de kennisname van een informatiesysteem en de informatie
      daarin is beperkt tot een gedefinieerde groep van gerechtigden;
        - *wet:* de [Wet digitale overheid][ref12];
        - *vertegenwoordiger:* de natuurlijke persoon of rechtspersoon die een andere natuurlijke persoon vertegenwoordigt
      bij elektronische dienstverlening door een bestuursorgaan of aangewezen organisatie.


