  - number: '2'
    text: |-
      Onze Minister verwerkt voor de inrichting, beschikbaarstelling, instandhouding, werking, beveiliging en
      betrouwbaarheid van DigiD de volgende persoonsgegevens:
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel2
  - number: 2.a
    text: |-
      over bezoekers van DigiD: gegevens over herkomst en kenmerken van het netwerkverkeer en de kenmerken van de
      gebruikte software en hardware van de bezoeker van DigiD die relevant zijn voor de adequate werking en beveiliging
      van de voorziening;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel2
  - number: 2.b
    text: |-
      over bezoekers van DigiD die een aanvraagprocedure zijn gestart, maar niet hebben voltooid, tevens het
      burgerservicenummer en de datum en tijd van de aanvraag en de reden waarom de aanvraag niet is gelukt;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel2
  - number: 2.c
    text: 'over gebruikers van DigiD:'
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel2
  - number: 2.c.1°
    text: |-
      de naam en de noodzakelijke gegevens om deze correct weer te geven, de geboortedatum, de datum van overlijden, de
      nationaliteit, gegevens om het ingezetenschap of niet-ingezetenschap in de basisregistratie personen vast te kunnen
      stellen en het adres;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel2
  - number: 2.c.2°
    text: |-
      een nummer dat ter identificatie van een persoon kan worden gebruikt, waaronder het burgerservicenummer of
      een versleutelde of afgeleide vorm daarvan ter identificatie van de gebruiker van DigiD, het nummer van een
      Nederlandse paspoort of van een Nederlandse ,identiteitskaart gegevens met betrekking tot het paspoort of de
      identiteitskaart, zoals de geldigheidsdata, en gegevens met betrekking tot het rijbewijs, zoals het documentnummer
      en de geldigheidsdata;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel2
  - number: 2.c.3°
    text: |-
      de accountgegevens, waaronder het mobiele of vaste telefoonnummer, de gekozen documentsoort voor elektronische
      identificatie, het soort apparaat waarmee op elektronische wijze gecommuniceerd kan worden met het Nederlands
      paspoort, de Nederlandse identiteitskaart of het Nederlands rijbewijs, de status en het betrouwbaarheidsniveau van
      het identificatiemiddel, het e-mailadres, de gebruikersnaam, een afgeleide vorm van het wachtwoord, een afgeleide
      vorm van de pincode, en overige gegevens die bij het account horen;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel2
  - number: 2.c.4°
    text: |-
      de gebruiksgegevens, waaronder het IP-adres en de kenmerken van de gebruikte software en hardware van het
      apparaat waarmee de gebruiker van DigiD is ingelogd, handelingen van de gebruiker, het door de gebruiker van DigiD
      gekozen betrouwbaarheidsniveau, de website van de instelling waar de gebruiker van DigiD een DigiD aanvraagt of
      vanuit welke de gebruiker van DigiD met DigiD inlogt, sessiegegevens, waaronder cookies, en overige gegevens met
      betrekking tot het soort en tijdstip, kenmerken van het gebruik, waaronder gegevens over toegang tot medische
      diensten waar mogelijk in versleutelde vorm;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel2
  - number: 2.c.5°
    text: |-
      gegevens die relevant zijn voor de adequate werking van de voorziening, waaronder in ieder geval de kenmerken van
      de door de gebruiker van DigiD gebruikte software en hardware.
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel2
  - number: 2.c.6°
    text: |-
      gegevens noodzakelijk voor de ondersteuning van de gebruiker of de administratie van DigiD, waaronder het
      burgerservicenummer en andere gegevens die worden verwerkt bij de ondersteuning van de gebruiker van DigiD.
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel2
  - number: 2.c.7°
    text: |-
      gegevens afkomstig van de chip van het Nederlandse paspoort of de Nederlandse identiteitskaart waarmee de gebruiker
      van DigiD heeft ingelogd ter authenticatie: - documentcode van het paspoort of de identiteitskaart;
        - uitgevende staat of organisatie van het paspoort of de identiteitskaart;
        - naam van de houder;
        - documentnummer van het paspoort of de identiteitskaart;
        - nationaliteit van de houder;
        - geboortedatum van de houder;
        - geslacht van de houder;
        - geldigheidsdata van het paspoort of de identiteitskaart;
        - burgerservicenummer.
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel2
  - number: 2.c.8°
    text: |-
      gegevens afkomstig van de chip van het Nederlandse rijbewijs waarmee de gebruiker van DigiD heeft ingelogd ter
      authenticatie: '- documentcode van het rijbewijs;'
        - documentnummer van het rijbewijs.
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel2
  - number: 2.c.9°
    text: |-
      gegevens genoemd in [artikel 5d][ref1] die noodzakelijk zijn voor de elektronische identificatie ter zake van
      grensoverschrijdende elektronische dienstverlening binnen de Europese Unie welke plaatsvindt door tussenkomst van
      de eIDAS-voorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel5d
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: 5d
        hoofdstuk: '2'
  - number: 2.d
    text: |-
      over afnemers van DigiD: administratieve gegevens noodzakelijk in verband met het gebruik door de afnemer van
      DigiD, waaronder de naam van de bevoegde bestuurder van de rechtspersoon die gebruik maakt van DigiD en de naam, de
      functie, het e-mailadres en het telefoonnummer van contactpersonen bij de betreffende afnemer.
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel2
  - number: '3'
    text: |-
      Onze Minister verwerkt voor de inrichting, beschikbaarstelling, instandhouding, werking, beveiliging en
      betrouwbaarheid van DigiD Machtigen de volgende persoonsgegevens:
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel3
  - number: 3.a
    text: |-
      over bezoekers van DigiD Machtigen: gegevens over herkomst en kenmerken van het netwerkverkeer en de kenmerken van
      de gebruikte software en hardware van de bezoeker van DigiD Machtigen die relevant zijn voor de adequate werking en
      beveiliging van de voorziening;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel3
  - number: 3.b
    text: 'over gebruikers van DigiD Machtigen:'
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel3
  - number: 3.b.1°
    text: |-
      de naam en de noodzakelijke gegevens om deze correct weer te geven, de reden voor de opschorting van de
      persoonslijst in de basisregistratie personen, het adres en van de vertegenwoordigde tevens de geboortedatum;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel3
  - number: 3.b.2°
    text: |-
      het burgerservicenummer of een versleutelde of afgeleide vorm daarvan ter identificatie van de gebruiker van DigiD
      Machtigen of het door de Kamer van Koophandel, bedoeld in [artikel 2 van de Wet op de Kamer van Koophandel][ref1],
      uniek toegekende nummer aan rechtspersoon of een onderneming die in Nederland is gevestigd en toebehoort aan een
      natuurlijke persoon, alsmede de authenticatieverklaring indien beschikbaar;


      [ref1]: https://wetten.overheid.nl/BWBR0034331#Artikel2
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0034331
        artikel: '2'
  - number: 3.b.3°
    text: gebruikersgegevens betreffende de machtigingsrelaties, inclusief de aanvragen daarvan, en profielgegevens;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel3
  - number: 3.b.4°
    text: |-
      de gebruiksgegevens, waaronder gegevens over het IP-adres en de kenmerken van de gebruikte software en hardware van
      het apparaat waarmee de gebruiker van DigiD Machtigen is ingelogd op de website van DigiD Machtigen, handelingen
      van de gebruiker van DigiD Machtigen (inloggen, aanvragen, intrekken en activeren), de betrokken dienst, en de
      afnemer van DigiD Machtigen waarvoor de gebruiker van DigiD Machtigen is gemachtigd, alsmede het tijdstip waarop
      dit gebeurt, sessiegegevens, waaronder cookies, en overige gegevens met betrekking tot het soort en tijdstip,
      kenmerken van het gebruik, waaronder gegevens over toegang tot medische diensten waar mogelijk in versleutelde
      vorm;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel3
  - number: 3.b.5°
    text: |-
      gegevens die relevant zijn voor de adequate werking van de voorziening waaronder de kenmerken van de gebruikte
      software en hardware door de gebruiker van DigiD Machtigen;
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel3
  - number: 3.b.6°
    text: |-
      gegevens noodzakelijk voor de ondersteuning van de gebruiker, waaronder het burgerservicenummer,
      notificatiegegevens waaronder het voorkeurskanaal, en andere gegevens die worden verwerkt bij de ondersteuning van
      de gebruiker van DigiD Machtigen.
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel3
  - number: 3.c
    text: |-
      over afnemers van DigiD Machtigen: administratieve gegevens noodzakelijk in verband met het gebruik door de afnemer
      van DigiD Machtigen, waaronder de naam van de bevoegde bestuurder van de rechtspersoon die gebruik maakt van DigiD
      Machtigen en de naam, de functie, het e-mailadres en het telefoonnummer van contactpersonen bij de betreffende
      afnemer.
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel3
  - number: 3a
    text: |-
      Onze Minister verwerkt voor de inrichting, beschikbaarstelling, instandhouding, werking, beveiliging en
      betrouwbaarheid van de bevoegdheidsverklaringsdienst de volgende persoonsgegevens over:
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel3a
  - number: 3a.a
    text: 'de beoogd vertegenwoordiger waarvoor een bevoegdheidsverklaring wordt gevraagd:'
    url: https://wetten.overheid.nl/BWBR0037987/2024-04-01#Artikel3a
