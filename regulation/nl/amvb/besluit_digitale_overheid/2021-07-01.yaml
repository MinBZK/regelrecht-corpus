    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties van 18 januari 2016, nr. 2016-
    0000023784 DCB/CZW/SB;

    Gelet op artikel X, derde lid, van de Wet elektronisch berichtenverkeer Belastingdienst;

    De Afdeling advisering van de Raad van State gehoord (advies van 8 april 2016, nr. No.W04.160008/I);

    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties van 10 mei 2016 nr. 2016-
    0000267641 BZK/CZW/SB;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder: - *afnemer van DigiD en DigiD Machtigen:* een overheidsorgaan dat, of een
      rechtspersoon met een wettelijke taak, niet zijnde een overheidsorgaan, die bij de uitoefening van zijn taak of
      bevoegdheid een dienst aanbiedt voor elektronisch verkeer tussen hem en gebruikers van DigiD respectievelijk DigiD
      Machtigen en daarbij gebruik maakt van DigiD respectievelijk DigiD Machtigen;
        - *afnemer van MijnOverheid:* een overheidsorgaan dat, of een rechtspersoon met een wettelijke taak, niet zijnde
      een overheidsorgaan, die bij de uitoefening van zijn taak of bevoegdheid gebruik maakt van MijnOverheid;
        - *authenticatie:* een elektronisch proces voor de verificatie en bevestiging van de identiteit van een natuurlijke
      persoon of rechtspersoon of van de oorsprong en integriteit van gegevens;
        - *bezoeker van MijnOverheid, DigiD of DigiD Machtigen:* degene die MijnOverheid, DigiD of DigiD Machtigen bezoekt,
      maar niet inlogt of van wie de elektronische aanvraagprocedure voor een DigiD niet is voltooid;
        - *BSN-Koppelregister:* de voorziening die een relatie legt tussen een uniek identificerend kenmerk op een privaat
      authenticatiemiddel en het burgerservicenummer van de houder;
        - *burgerservicenummer:* het nummer, bedoeld in
      [artikel 1, onderdeel b, van de Wet algemene bepalingen burgerservicenummer][ref1];
        - *DigiD:* de voorziening voor uitgifte van elektronische authenticatiemiddelen en voor elektronische authenticatie
      die bereikbaar is via het webadres www.digid.nl;
        - *DigiD Machtigen:* de voorziening voor elektronische registratie van machtigingen die bereikbaar is via het
      webadres machtigen.digid.nl;
        - *gebruiker van DigiD:* een natuurlijk persoon die is ingeschreven in de basisregistratie personen, in het bezit
      is van een burgerservicenummer en van wie de elektronische aanvraagprocedure voor een DigiD is voltooid;
        - *gebruiker van DigiD Machtigen:* de gemachtigde, de vertegenwoordigde of een natuurlijke persoon of
      rechtspersoon, die gebruik maakt van de voorziening DigiD Machtigen;
        - *gebruiker van MijnOverheid:* een natuurlijk persoon die is ingeschreven in de basisregistratie personen, in het
      bezit is van een burgerservicenummer, en voor wie een MijnOverheid-account beschikbaar is;
        - *gemachtigde:* een gebruiker van DigiD Machtigen die namens de vertegenwoordigde bepaalde (rechts)handelingen
      kan verrichten;
        - *gemachtigde in MijnOverheid:* een gebruiker van MijnOverheid of een rechtspersoon, die met een in DigiD
      Machtigen geregistreerde machtiging in MijnOverheid bepaalde berichten van de vertegenwoordigde in kan zien;
        - *MijnOverheid:* de voorziening die bereikbaar is via het webadres mijn.overheid.nl voor de dienst voor
      elektronisch berichtenverkeer de Berichtenbox, en de diensten voor informatieverschaffing Lopende Zaken,
      Persoonlijke gegevens en Algemene bekendmakingen, mededelingen en kennisgevingen;
        - *MijnOverheid-account:* het domein van een gebruiker van MijnOverheid op MijnOverheid;
        - *notificatie:* een attendering die met een e-mailbericht of via een ander kanaal aan de gebruiker van
      MijnOverheid wordt verstuurd nadat een bericht in de Berichtenbox is geplaatst of een wijziging in Lopende Zaken
      heeft plaatsgevonden;
        - *Onze Minister:* Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;
        - *overheidsorgaan:* overheidsorgaan als bedoeld in
      [artikel 1, onderdeel c, van de Wet algemene bepalingen burgerservicenummer][ref2];
        - *persoonsgegevens:* hetgeen daaronder wordt verstaan in artikel 4 onder 1 van de Algemene verordening
      gegevensbescherming;
        - *vertegenwoordigde:* een natuurlijk persoon die zich ter behartiging van zijn belangen in het verkeer met
      afnemers van DigiD Machtigen laat vertegenwoordigen door een gemachtigde;
        - *vertegenwoordigde in MijnOverheid:* een natuurlijk persoon die, met een in DigiD Machtigen geregistreerde
      machtiging, een gemachtigde in MijnOverheid toegang verleent tot zijn berichten voor zover deze vallen binnen de
      reikwijdte van de machtiging.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel1
