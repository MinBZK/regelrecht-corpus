  - number: '2'
    text: |-
      Onze Minister verwerkt voor de inrichting, beschikbaarstelling, instandhouding, werking, beveiliging en
      betrouwbaarheid van DigiD de volgende persoonsgegevens:
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel2
  - number: 2.a
    text: |-
      over bezoekers van DigiD: gegevens over herkomst en kenmerken van het netwerkverkeer en de kenmerken van de
      gebruikte software en hardware van de bezoeker van DigiD die relevant zijn voor de adequate werking en beveiliging
      van de voorziening;
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel2
  - number: 2.b
    text: |-
      over bezoekers van DigiD die een aanvraagprocedure zijn gestart, maar niet hebben voltooid, tevens het
      burgerservicenummer en de datum en tijd van de aanvraag en de reden waarom de aanvraag niet is gelukt;
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel2
  - number: 2.c
    text: 'over gebruikers van DigiD:'
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel2
  - number: 2.c.1°
    text: |-
      de naam en de noodzakelijke gegevens om deze correct weer te geven, de geboortedatum, de datum van overlijden, de
      nationaliteit, gegevens om het ingezetenschap of niet-ingezetenschap in de basisregistratie personen vast te kunnen
      stellen en het adres;
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel2
  - number: 2.c.2°
    text: |-
      een nummer dat ter identificatie van een persoon kan worden gebruikt, waaronder het burgerservicenummer, het nummer
      van een Nederlandse paspoort of van een Nederlandse ,identiteitskaart en gegevens met betrekking tot het paspoort
      of de identiteitskaart, zoals de geldigheidsdata;
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel2
  - number: 2.c.3°
    text: |-
      de accountgegevens, waaronder het mobiele telefoonnummer, het e-mailadres, de gebruikersnaam, het versleutelde
      wachtwoord, en overige gegevens die bij het account horen;
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel2
  - number: 2.c.4°
    text: |-
      de gebruiksgegevens, waaronder het IP-adres en de kenmerken van de gebruikte software en hardware van het apparaat
      waarmee de gebruiker van DigiD is ingelogd, handelingen van de gebruiker, het door de gebruiker van DigiD gekozen
      authenticatieniveau, de website van de instelling waar de gebruiker van DigiD een DigiD aanvraagt of vanuit welke
      de gebruiker van DigiD met DigiD inlogt, sessiegegevens, waaronder cookies, en overige gegevens met betrekking tot
      het soort en tijdstip, kenmerken van het gebruik;
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel2
  - number: 2.c.5°
    text: |-
      gegevens die relevant zijn voor de adequate werking van de voorziening, waaronder in ieder geval de kenmerken van
      de door de gebruiker van DigiD gebruikte software en hardware.
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel2
  - number: 2.c.6°
    text: |-
      gegevens noodzakelijk voor de ondersteuning van de gebruiker, waaronder het burgerservicenummer en andere gegevens
      die worden verwerkt bij de ondersteuning van de gebruiker van DigiD.
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel2
  - number: '3'
    text: |-
      Onze Minister verwerkt voor de inrichting, beschikbaarstelling, instandhouding, werking, beveiliging en
      betrouwbaarheid van DigiD Machtigen de volgende persoonsgegevens:
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel3
  - number: 3.a
    text: |-
      over bezoekers van DigiD Machtigen: gegevens over herkomst en kenmerken van het netwerkverkeer en de kenmerken van
      de gebruikte software en hardware van de bezoeker van DigiD Machtigen die relevant zijn voor de adequate werking en
      beveiliging van de voorziening;
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel3
  - number: 3.b
    text: 'over gebruikers van DigiD Machtigen:'
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel3
  - number: 3.b.1°
    text: |-
      de naam en de noodzakelijke gegevens om deze correct weer te geven, de datum van overlijden, het adres en van de
      vertegenwoordigde tevens de geboortedatum;
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel3
  - number: 3.b.2°
    text: het burgerservicenummer;
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel3
  - number: 3.b.3°
    text: gebruikersgegevens betreffende de machtigingsrelaties, inclusief de aanvragen daarvan, en profielgegevens;
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel3
  - number: 3.b.4°
    text: |-
      de gebruiksgegevens, waaronder gegevens over het IP-adres en de kenmerken van de gebruikte software en hardware van
      het apparaat waarmee de gebruiker van DigiD Machtigen is ingelogd op de website van DigiD Machtigen, handelingen
      van de gebruiker van DigiD Machtigen (inloggen, aanvragen, intrekken en activeren), de afnemer van DigiD Machtigen
      waarvoor de gebruiker van DigiD Machtigen is gemachtigd, alsmede het tijdstip waarop dit gebeurt, sessiegegevens,
      waaronder cookies, en overige gegevens met betrekking tot het soort en tijdstip, kenmerken van het gebruik;
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel3
  - number: 3.b.5°
    text: |-
      gegevens die relevant zijn voor de adequate werking van de voorziening waaronder de kenmerken van de gebruikte
      software en hardware door de gebruiker van DigiD Machtigen;
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel3
  - number: 3.b.6°
    text: |-
      gegevens noodzakelijk voor de ondersteuning van de gebruiker, waaronder het burgerservicenummer en andere gegevens
      die worden verwerkt bij de ondersteuning van de gebruiker van DigiD Machtigen.
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel3
  - number: '4'
    text: |-
      Onze Minister verwerkt voor de inrichting, beschikbaarstelling, instandhouding, werking, beveiliging en
      betrouwbaarheid van MijnOverheid de volgende persoonsgegevens:
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel4
  - number: 4.a
    text: |-
      over bezoekers van MijnOverheid: gegevens over de herkomst en kenmerken van het netwerkverkeer en de kenmerken van
      de gebruikte software en hardware van de bezoeker van MijnOverheid die relevant zijn voor de adequate werking en
      beveiliging van de voorziening;
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel4
  - number: 4.b
    text: 'over gebruikers van MijnOverheid:'
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel4
  - number: 4.b.1°
    text: |-
      de naam en de noodzakelijke gegevens om deze correct weer te geven, de geboortedatum, de datum van overlijden,
      de nationaliteit, gegevens om te bepalen of een natuurlijk persoon kwalificeert als gebruiker van MijnOverheid
      waarvoor de Berichtenbox beschikbaar moet kunnen zijn, en het adres;
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel4
  - number: 4.b.2°
    text: het burgerservicenummer,
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel4
  - number: 4.b.3°
    text: |-
      de accountgegevens, waaronder gegevens over het aanmaken en wijzigen van het MijnOverheid-account, het e-mailadres
      of ander kanaal waarop de gebruiker van MijnOverheid notificaties ontvangt, en gegevens over de verificatie
      daarvan, de schermnaam, en de door de gebruiker van MijnOverheid geselecteerde afnemer of afnemers van MijnOverheid
      ten aanzien van wie de gebruiker van MijnOverheid in de berichtenvoorkeuren van MijnOverheid kenbaar heeft
      gemaakt dat hij langs elektronische weg voldoende bereikbaar is voor het ontvangen van elektronische berichten
      in de Berichtenbox, meta-gegevens die horen bij berichten of zaaksgegevens, inloghistorie, en overige gegevens of
      wijzigingen daarvan die bij het account horen;
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel4
  - number: 4.b.4°
    text: |-
      de gebruiksgegevens, waaronder gegevens over de navigatie en handelingen van de gebruiker van MijnOverheid in
      de voorziening, inclusief het opvragen, tonen of wijzigen van gegevens of het falen van functies, gegevens over
      de verzending van notificaties en het eventueel falen daarvan, en overige gegevens met betrekking op het soort,
      tijdstip en kenmerken van het gebruik;
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel4
  - number: 4.b.5°
    text: |-
      gegevens die relevant zijn voor de adequate werking van de voorziening, waaronder sessie-cookies, gegevens over de
      herkomst en kenmerken van het netwerkverkeer en de kenmerken van de gebruikte software en hardware;
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel4
  - number: 4.b.6°
    text: |-
      gegevens noodzakelijk voor de ondersteuning van de gebruiker van MijnOverheid, waaronder het burgerservicenummer en
      andere gegevens die worden verwerkt bij de ondersteuning van de gebruiker;
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel4
  - number: 4.b.7°
    text: |-
      gegevens noodzakelijk voor de dienst Algemene bekendmakingen, mededelingen en kennisgevingen, waaronder het
      burgerservicenummer, de geboortedatum, het actuele adres van de gebruiker en het e-mailadres;
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel4
  - number: 4.c
    text: 'over de vertegenwoordigde in MijnOverheid en de gemachtigde in MijnOverheid:'
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel4
  - number: 4.c.1°
    text: |-
      de naam en de geboortedatum van de vertegenwoordigde in MijnOverheid en de noodzakelijke gegevens om deze correct
      weer te geven aan de gemachtigde in MijnOverheid;
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel4
  - number: 4.c.2°
    text: het burgerservicenummer van de vertegenwoordigde in MijnOverheid;
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel4
  - number: 4.c.3°
    text: |-
      de gebruiksgegevens, waaronder gegevens over de verzending van notificaties en het eventueel falen
      daarvan, gegevens over de handelingen van de gemachtigde in MijnOverheid ten aanzien van de gegevens van de
      vertegenwoordigde in MijnOverheid, waaronder begrepen het wijzigen van gegevens, inclusief gegevens over het falen
      van functies, en overige gegevens met betrekking tot het soort, tijdstip en kenmerken van het gebruik;
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel4
  - number: 4.c.4°
    text: wijzigingen van meta-gegevens van het bericht of de berichten waarop de machtiging betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel4
  - number: '5'
    text: |-
      Onze Minister verwerkt voor de inrichting, beschikbaarstelling, instandhouding, werking, beveiliging en
      betrouwbaarheid van het BSN-Koppelregister de volgende persoonsgegevens over de gebruiker van een privaat
      authenticatiemiddel, die dit middel wil gebruiken voor de afname van diensten van overheidsorganen en natuurlijke
      en rechtspersonen, niet zijnde overheidsorganen, die gerechtigd zijn het burgerservicenummer te gebruiken:
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel5
  - number: 5.a
    text: de naam en de noodzakelijke gegevens om deze correct weer te geven, de geboortedatum en de datum van overlijden;
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel5
  - number: 5.b
    text: het burgerservicenummer;
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel5
  - number: 5.c
    text: het uniek identificerende kenmerk op het private authenticatiemiddel;
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel5
  - number: 5.d
    text: |-
      de datum van registratie en eventuele deregistratie van de koppeling tussen het private authenticatiemiddel en
      het burgerservicenummer;
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel5
  - number: 5.e
    text: het tijdstip van inloggen bij de publieke dienstverlener.
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel5
  - number: '6'
    text: 'Onze Minister verstrekt aan de afnemers van DigiD:'
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel6
  - number: 6.a
    text: het burgerservicenummer ten behoeve van de vaststelling van de identiteit van de gebruiker van DigiD;
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel6
  - number: 6.b
    text: het door de gebruiker van DigiD gekozen authenticatieniveau en het IP-adres.
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel6
  - number: '7'
    text: 'Onze Minister verstrekt op verzoek van afnemers van DigiD Machtigen:'
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel7
  - number: 7.a
    text: een bewijs van geldigheid van een specifieke machtigingsregistratie voor diensten van de betreffende afnemer;
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel7
  - number: 7.b
    text: |-
      een overzicht van alle machtigingsaanvragen en machtigingsregistraties die voor diensten van de betreffende afnemer
      zijn afgegeven.
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel7
  - number: '8'
    text: 'Onze Minister verstrekt aan een afnemer van MijnOverheid:'
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel8
  - number: 8.a
    text: |-
      het burgerservicenummer en, waar van toepassing, de status van de toepasselijke berichtenvoorkeur van de gebruiker
      van MijnOverheid, voorafgaand aan het aanleveren en ter bevestiging van het afleveren van berichten en gegevens, of
      het falen daarvan, ten behoeve van de werking van de diensten van MijnOverheid;
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel8
  - number: 8.b
    text: |-
      op verzoek van een afnemer die de Berichtenbox van MijnOverheid als verplicht kanaal voor elektronisch
      berichtenverkeer heeft aangewezen, informatie of een gebruiker van een MijnOverheid-account waarop de
      uitvoering van die taak betrekking heeft, zijn account wel of niet in gebruik heeft genomen en het bijbehorende
      burgerservicenummer.
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel8
  - number: '9'
    text: |-
      Onze Minister verstrekt het burgerservicenummer van de gebruiker van een privaat authenticatiemiddel, die dit
      middel wil gebruiken voor de afname van diensten door overheidsorganen en natuurlijke en rechtspersonen, niet
      zijnde overheidsorganen, die gerechtigd zijn het burgerservicenummer te gebruiken in versleutelde vorm aan de
      bedoelde overheidsorganen en natuurlijke en rechtspersonen, niet zijnde overheidsorganen of degenen die namens
      hen optreden.
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel9
  - number: '10'
    text: |-
      Onverminderd het bepaalde in de [artikelen 6 tot en met 9][ref1], verstrekt Onze Minister geen gegevens over een
      bezoeker of gebruiker van DigiD, DigiD Machtigen of MijnOverheid aan anderen dan de bezoeker of de gebruiker zelf
      zonder voorafgaande toestemming van de bezoeker of de gebruiker, tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel6
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '6'
        hoofdstuk: '3'
  - number: 10.a
    text: |-
      het een verstrekking betreft aan een overheidsorgaan of rechtspersoon met een wettelijke taak die noodzakelijk is
      voor de borging van de beveiliging en betrouwbaarheid van de betreffende voorziening, of
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel10
  - number: 10.b
    text: hij daartoe gerechtigd is op grond van een wettelijke bepaling.
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel10
  - number: '11.1'
    text: |-
      De gegevens over bezoekers van DigiD, bedoeld in [artikel 2, onderdelen a en b][ref1], worden maximaal 18 maanden
      bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel2
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '2'
        hoofdstuk: '2'
  - number: '11.2'
    text: |-
      De naam en de noodzakelijke gegevens om deze correct weer te geven, de geboortedatum, de datum van overlijden, de
      nationaliteit, gegevens om het ingezetenschap of niet-ingezetenschap in de basisregistratie personen vast te kunnen
      stellen en het adres, bedoeld in [artikel 2, onderdeel c, onder 1°][ref1], worden maximaal 6 weken bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel2
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '2'
        hoofdstuk: '2'
  - number: '11.3'
    text: |-
      De gebruiksgegevens, bedoeld in [artikel 2, onderdeel c, onder 4°][ref1], worden maximaal 5 jaar bewaard, met dien
      verstande dat de sessiegegevens slechts worden bewaard tot het moment van uitloggen door de gebruiker.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel2
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '2'
        hoofdstuk: '2'
  - number: '11.4'
    text: |-
      Een nummer dat ter identificatie van een persoon kan worden gebruikt als bedoeld in
      [artikel 2, onderdeel c, onder 2°][ref1], wordt bewaard:


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel2
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '2'
        hoofdstuk: '2'
  - number: 11.4.a
    text: gedurende het aanvraagproces maximaal 18 maanden, of;
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel11
  - number: 11.4.b
    text: zo lang het bijbehorende DigiD geldig is, en zodra dat niet meer het geval is maximaal 5 jaar.
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel11
  - number: '11.5'
    text: |-
      De accountgegevens, bedoeld in [artikel 2, onderdeel c, onder 3°][ref1], die nodig zijn voor het actuele gebruik
      van DigiD, zoals het actuele mobiele telefoonnummer en e-mailadres, de actuele gebruikersnaam, het actuele
      wachtwoord, het account-ID en de status van het account worden bewaard zo lang het bijbehorende DigiD geldig is, en
      zodra dat niet meer het geval is maximaal 5 jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel2
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '2'
        hoofdstuk: '2'
  - number: '11.6'
    text: |-
      De overige accountgegevens, bedoeld in [artikel 2, onderdeel c, onder 3°][ref1], worden maximaal 18 maanden
      bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel2
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '2'
        hoofdstuk: '2'
  - number: '11.7'
    text: |-
      De gegevens die relevant zijn voor de adequate werking van de voorziening, bedoeld in
      [artikel 2, onderdeel c, onder 5°][ref1], worden bewaard zo lang de gebruiker van DigiD is ingelogd.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel2
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '2'
        hoofdstuk: '2'
  - number: '11.8'
    text: |-
      De gegevens noodzakelijk voor de ondersteuning van de gebruiker, bedoeld in
      [artikel 2, onderdeel c, onder 6°][ref1], worden bewaard voor de duur van de ondersteuning en daarna maximaal
      18 maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel2
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '2'
        hoofdstuk: '2'
  - number: '12.1'
    text: |-
      De gegevens over bezoekers van DigiD Machtigen, bedoeld in [artikel 3, onderdeel a][ref1], worden maximaal 18
      maanden bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel3
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '3'
        hoofdstuk: '2'
  - number: '12.2'
    text: |-
      De naam en de noodzakelijke gegevens om deze correct weer te geven, de datum van overlijden, het adres en de
      geboortedatum, bedoeld in [artikel 3, onderdeel b, onder 1°][ref1], worden maximaal 6 weken bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel3
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '3'
        hoofdstuk: '2'
  - number: '12.3'
    text: |-
      De gebruiksgegevens, bedoeld in [artikel 3, onderdeel b, onder 4° en 5°][ref1], worden maximaal 5 jaar bewaard,
      met dien verstande dat de sessiegegevens slechts worden bewaard tot het moment van uitloggen door de gebruiker van
      DigiD Machtigen.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel3
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '3'
        hoofdstuk: '2'
  - number: '12.4'
    text: |-
      Het burgerservicenummer wordt bewaard zo lang de bijbehorende machtigingsaanvraag dan wel machtigingsregistratie
      niet is beëindigd, en zodra die wel is beëindigd maximaal 5 jaar.
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel12
  - number: '12.5'
    text: |-
      De gebruikersgegevens, bedoeld in [artikel 3, onderdeel b, onder 3°][ref1], worden bewaard zo lang
      machtigingsaanvraag dan wel machtigingsregistratie niet is beëindigd en zodra die wel is beëindigd maximaal 5 jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel3
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '3'
        hoofdstuk: '2'
  - number: '12.6'
    text: |-
      De gegevens noodzakelijk voor de ondersteuning van de gebruiker, bedoeld in
      [artikel 3, onderdeel b, onder 6°][ref1], worden bewaard voor de duur van de ondersteuning en daarna maximaal
      18 maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel3
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '3'
        hoofdstuk: '2'
  - number: '13.1'
    text: |-
      De gegevens over bezoekers van MijnOverheid, bedoeld in [artikel 4, onderdeel a][ref1], worden maximaal 18 maanden
      bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel4
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '4'
        hoofdstuk: '2'
  - number: '13.2'
    text: |-
      De gegevens over gebruikers van MijnOverheid, bedoeld in [artikel 4, onderdeel b, onder 4° en 5°][ref1], worden
      maximaal 5 jaar bewaard, met dien verstande dat sessie cookies slechts worden bewaard tot het moment van uitloggen.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel4
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '4'
        hoofdstuk: '2'
  - number: '13.3'
    text: |-
      De gegevens over een gebruiker van MijnOverheid en zijn MijnOverheid-account, bedoeld in
      [artikel 4, onderdeel b, onder 1°, 2° en 3°][ref1], worden bewaard zolang het bijbehorende MijnOverheid-
      account bestaat, en zodra het account is opgeheven, maximaal 1 jaar, met uitzondering van de nationaliteit,
      de geboortedatum, de datum van overlijden en gegevens om te bepalen of een natuurlijk persoon kwalificeert als
      gebruiker van MijnOverheid waarvoor de Berichtenbox beschikbaar moet kunnen zijn, die bewaard blijven voor de duur
      van het aanmaak- of controleproces.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel4
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '4'
        hoofdstuk: '2'
  - number: '13.4'
    text: |-
      De gegevens noodzakelijk voor de ondersteuning van de gebruiker, bedoeld in
      [artikel 4, onderdeel b, onder 6°][ref1], worden bewaard voor de duur van de ondersteuning en daarna maximaal
      18 maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel4
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '4'
        hoofdstuk: '2'
  - number: '13.5'
    text: |-
      De gegevens over een gebruiker van MijnOverheid en zijn MijnOverheid-account, bedoeld in
      [artikel 4, onderdeel b, onder 7°][ref1], worden bewaard zolang het bijbehorende MijnOverheid-account bestaat en
      zodra het account is opgeheven maximaal 1 jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel4
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '4'
        hoofdstuk: '2'
  - number: '13.6'
    text: |-
      De bewaartermijn van de gegevens over de vertegenwoordigde en de gemachtigde, bedoeld in
      [artikel 4, onderdeel c][ref1], is als volgt:


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel4
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '4'
        hoofdstuk: '2'
  - number: 13.6.a
    text: de gegevens, bedoeld onder 1° en 2°, blijven bewaard tot het moment van uitloggen;
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel13
  - number: 13.6.b
    text: de gegevens, bedoeld onder 3°, blijven maximaal 5 jaar bewaard;
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel13
  - number: 13.6.c
    text: |-
      de gegevens, bedoeld onder 4°, blijven bewaard zo lang het MijnOverheid-account bestaat, en zodra dat account is
      opgeheven, maximaal 1 jaar.
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel13
  - number: '13.7'
    text: |-
      Voor de gegevens, bedoeld in [artikel 4][ref1], die zijn betrokken bij of relevant zijn voor het onderzoek naar een
      incident waarbij integriteit, vertrouwelijkheid of beschikbaarheid van het systeem in het geding is, wordt de in
      het eerste, derde en vierde, en vijfde lid, onderdeel c, genoemde bewaartermijn van 18 maanden of 1 jaar verlengd
      tot 36 maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel4
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '4'
        hoofdstuk: '2'
  - number: '14'
    text: |-
      De bewaartermijn van de gegevens, bedoeld in [artikel 5][ref1], is als volgt:


      [ref1]: https://wetten.overheid.nl/BWBR0037987#Artikel5
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0037987
        artikel: '5'
        hoofdstuk: '2'
  - number: 14.a
    text: |-
      naam, geboortedatum en datum van overlijden worden niet langer bewaard dan nodig is om de gegevens op juistheid
      te controleren;
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel14
  - number: 14.b
    text: het burgerservicenummer wordt maximaal 18 maanden na registratie van de koppeling bewaard;
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel14
  - number: 14.c
    text: |-
      het uniek identificerende kenmerk op het private authenticatiemiddel wordt maximaal 18 maanden na de registratie
      van de koppeling bewaard;
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel14
  - number: 14.d
    text: de datum van registratie en eventuele deregistratie van de koppeling wordt maximaal 18 maanden bewaard;
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel14
  - number: 14.e
    text: het tijdstip van inloggen bij de publieke dienstverlener wordt maximaal 18 maanden bewaard.
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel14
  - number: '15'
    text: Na het verstrijken van de bewaartermijn worden de gegevens zo spoedig mogelijk vernietigd.
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel15
  - number: '16'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst en werkt terug tot en met 1 november 2015.
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel16
  - number: '17'
    text: 'Dit besluit wordt aangehaald als: Besluit verwerking persoonsgegevens generieke digitale infrastructuur.'
    url: https://wetten.overheid.nl/BWBR0037987/2021-07-01#Artikel17
