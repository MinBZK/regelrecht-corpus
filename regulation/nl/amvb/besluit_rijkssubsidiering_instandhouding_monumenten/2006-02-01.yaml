---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_rijkssubsidiering_instandhouding_monumenten
regulatory_layer: AMVB
publication_date: '2010-10-07'
valid_from: '2006-02-01'
bwb_id: BWBR0019439
url: https://wetten.overheid.nl/BWBR0019439/2006-02-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Onderwijs, Cultuur en Wetenschap, M. C. van der Laan, van 23 februari
    2005, nr. WJZ/2005/4471 (8138), directie Wetgeving en Juridische Zaken;

    Gelet op artikel 34 van de Monumentenwet 1988;

    De Raad van State gehoord (advies van 31 maart 2005, nr. W05.05.0049/III);

    Gezien het nader rapport van de Staatssecretaris van Onderwijs, Cultuur en Wetenschap, M. C. van der Laan, van 13
    januari 2006, nr. WJZ/2006/294 (8138), directie Wetgeving en Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel1
  - number: 1.1.a
    text: |-
      wet: [Monumentenwet 1988][ref1],

      [ref1]: https://wetten.overheid.nl/BWBR0004471
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004471
  - number: 1.1.b
    text: |-
      eigenaar: natuurlijke persoon of rechtspersoon die het recht van eigendom of een ander zakelijk recht heeft op een
      beschermd monument,
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel1
  - number: 1.1.c
    text: |-
      subsidiabele kosten: kosten die naar het oordeel van Onze minister noodzakelijk zijn om een beschermd monument in
      stand te houden,
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel1
  - number: 1.1.d
    text: |-
      instandhoudingsplan: instandhoudingsplan als bedoeld in [artikel 12][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0019439#Artikel12
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0019439
        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 1.1.e
    text: 'drempelbedrag: bedrag aan subsidie waaronder geen subsidie wordt verstrekt,'
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel1
  - number: 1.1.f
    text: |-
      bouwkundig inspectierapport: rapport met betrekking tot een beschermd monument dat de technische staat van dat
      monument beschrijft, en dat is opgesteld door een ter zake deskundige instantie,
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel1
  - number: 1.1.g
    text: |-
      woonhuizen: beschermde monumenten die in oorsprong primair zijn vervaardigd voor bewoning of die oorspronkelijk
      een andere functie dan bewoning hadden maar die thans primair voor bewoning in gebruik zijn, met dien verstande
      dat kerkgebouwen, kastelen, buitenplaatsen, landhuizen, gebouwen van liefdadigheid, molens en gemalen niet als
      woonhuizen worden aangemerkt,
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel1
  - number: 1.1.h
    text: |-
      boerderijen zonder agrarische functie: beschermde monumenten die in oorsprong primair zijn vervaardigd ten behoeve
      van het agrarisch bedrijf maar die dat thans niet meer als primaire functie hebben,
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel1
  - number: 1.1.i
    text: |-
      boerderijen met een agrarische functie: beschermde monumenten met een agrarische functie, zoals blijkend
      uit het overzicht van de gegevens zoals geregistreerd in het kader van de landbouwtelling, bedoeld in
      [artikel 24 van de Landbouwwet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel24
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002252
        artikel: '24'
  - number: 1.1.j
    text: |-
      aangewezen organisaties voor monumentenbehoud: organisaties als bedoeld in [artikel 37][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0019439#Artikel37
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0019439
        artikel: '37'
        hoofdstuk: '4'
  - number: 1.1.k
    text: |-
      complex: samenstel van beschermde monumenten dat wordt gekenmerkt door hun onderlinge samenhang die mede bepalend
      is voor hun monumentale waarde, en dat als complex is ingeschreven in de ingevolge de [wet][ref1] vastgestelde
      registers.


      [ref1]: https://wetten.overheid.nl/BWBR0004471
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004471
  - number: '1.2'
    text: |-
      Voor de toepassing van dit besluit wordt een eigenaar van een beschermd monument aangemerkt als een eigenaar die
      geen recht op fiscale aftrek van onderhoudskosten heeft, indien sprake is van:
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel1
  - number: 1.2.a
    text: |-
      een lichaam dat niet behoort tot de belastingplichtigen, bedoeld in de [artikelen 2][ref1] en
      [3 van de Wet op de vennootschapsbelasting 1969][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002672#Artikel3
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002672
        artikel: '3'
  - number: 1.2.b
    text: |-
      een lichaam dat is vrijgesteld van belasting op grond van
      [artikel 5, eerste lid, onderdeel a, van de Wet op de vennootschapsbelasting 1969][ref1] waarop
      [art 10.9 van de Wet inkomstenbelasting 2001][ref2] niet van toepassing is,


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel10
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '10'
  - number: 1.2.c
    text: |-
      een lichaam dat is vrijgesteld van belasting op grond van
      [artikel 5, eerste lid, onderdeel d, van de Wet op de vennootschapsbelasting 1969][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel5
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '5'
  - number: 1.2.d
    text: |-
      een lichaam dat is vrijgesteld van belasting op grond van
      [artikel 6 van de Wet op de vennootschapsbelasting 1969][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel6
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '6'
  - number: 1.2.e
    text: |-
      een natuurlijk persoon, niet zijnde ondernemer of genieter van belastbaar resultaat uit overige
      werkzaamheden, die geen recht heeft op aftrek van uitgaven voor monumentenpanden in de zin van
      [artikel 6.31 van de Wet inkomstenbelasting 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '6'
  - number: '1.3'
    text: |-
      Voor de toepassing van dit besluit wordt onderscheid gemaakt in categorieën van beschermde monumenten. De
      onderscheiden categorieën van beschermde monumenten zijn:
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel1
  - number: 1.3.a
    text: woonhuizen en boerderijen zonder agrarische functie,
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel1
  - number: 1.3.b
    text: kerkgebouwen,
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel1
  - number: 1.3.c
    text: kastelen, buitenplaatsen en landhuizen,
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel1
  - number: 1.3.d
    text: molens en gemalen, en
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel1
  - number: 1.3.e
    text: overige beschermde monumenten.
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel1
  - number: '2.1'
    text: |-
      Onze minister draagt er zorg voor dat eigenaren van woonhuizen en boerderijen zonder agrarische functie een
      lening kunnen verkrijgen ter financiering van de kosten van de instandhouding van het beschermd monument, met dien
      verstande dat:
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel2
  - number: 2.1.a
    text: de lening wordt verstrekt met als zekerheid het recht van hypotheek op het beschermd monument,
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel2
  - number: 2.1.b
    text: |-
      de fiscaal aftrekbare onderhoudskosten zoals die door de Belastingdienst worden gehanteerd, als grondslag dienen
      voor het bepalen van de hoogte van de lening,
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel2
  - number: 2.1.c
    text: |-
      het maximumbedrag per lening en de voorwaarden waaronder de lening wordt verstrekt, worden bekendgemaakt in de
      Staatscourant,
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel2
  - number: 2.1.d
    text: |-
      voor een eigenaar die recht op fiscale aftrek van onderhoudskosten heeft, de lening maximaal 70% van de
      vastgestelde fiscaal aftrekbare onderhoudskosten bedraagt, en
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel2
  - number: 2.1.e
    text: |-
      voor een eigenaar die geen recht op fiscale aftrek van onderhoudskosten kan genieten, de lening maximaal 100% van
      de voor de hoogte van de lening door de Belastingdienst fictief vastgestelde fiscaal aftrekbare onderhoudskosten
      bedraagt.
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel2
  - number: '2.2'
    text: |-
      Aangewezen organisaties voor monumentenbehoud en provincies, gemeenten, waterschappen en openbare lichamen die zijn
      ingesteld met toepassing van de [Wet gemeenschappelijke regelingen][ref1], komen niet in aanmerking voor een lening
      als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: '3.1'
    text: |-
      Onze minister kan voor een periode van zes kalenderjaren aan de eigenaar van een beschermd monument subsidie
      verstrekken ten behoeve van de instandhouding van een beschermd monument. Het te verstrekken subsidiebedrag bestaat
      uit zes gelijke bedragen.
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel3
  - number: '3.2'
    text: Bij ministeriële regeling worden nadere voorschriften gegeven omtrent de subsidiabele kosten.
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel3
  - number: '4'
    text: 'Voor subsidie op grond van dit hoofdstuk komen in aanmerking:'
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel4
  - number: 4.a
    text: eigenaren van andere beschermde monumenten dan woonhuizen en dan boerderijen zonder agrarische functie,
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel4
  - number: 4.b
    text: aangewezen organisaties voor monumentenbehoud,
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel4
  - number: 4.c
    text: |-
      provincies, gemeenten, waterschappen en openbare lichamen die zijn ingesteld met toepassing van de
      [Wet gemeenschappelijke regelingen][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: 4.d
    text: |-
      eigenaren van woonhuizen en boerderijen zonder agrarische functie als bedoeld in [artikel 7, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019439#Artikel7
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0019439
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '5'
    text: |-
      Onze minister kan met betrekking tot ieder kalenderjaar subsidieplafonds vaststellen voor subsidieverlening ten
      behoeve van beschermde monumenten als bedoeld in [artikel 6, eerste onderscheidenlijk tweede lid][ref1], alsmede
      voor categorieën van beschermde monumenten waarvoor subsidie kan worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0019439#Artikel6
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0019439
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '6.1'
    text: |-
      Bij ministeriële regeling kan een maximumbedrag aan subsidiabele kosten worden vastgesteld waarover per beschermd
      monument subsidie kan worden verstrekt, voor:
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel6
  - number: 6.1.a
    text: woonhuizen en boerderijen zonder agrarische functie,
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel6
  - number: 6.1.b
    text: kerkgebouwen,
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel6
  - number: 6.1.c
    text: kastelen en landhuizen,
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel6
  - number: 6.1.d
    text: molens en gemalen, en
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel6
  - number: 6.1.e
    text: overige beschermde monumenten.
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel6
  - number: '6.2'
    text: |-
      Indien de subsidiabele kosten van een beschermd monument € 700.000,– of meer bedragen over een periode van zes
      jaar, is het eerste lid niet van toepassing en bedraagt het maximumbedrag aan subsidiabele kosten waarover per
      beschermd monument subsidie kan worden verstrekt, € 1 miljoen over de periode waarop het instandhoudingsplan
      betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel6
  - number: '7.1'
    text: |-
      Op alle beschermde monumenten die deel uitmaken van een beschermd complex, is het subsidiepercentage van toepassing
      dat geldt voor de categorie waaronder het complex is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel7
  - number: '7.2'
    text: |-
      Eigenaren van woonhuizen en boerderijen zonder agrarische functie die deel uitmaken van een complex, komen in
      aanmerking voor subsidie. In dat geval is [artikel 2, eerste lid][ref1], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019439#Artikel2
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0019439
        artikel: '2'
        hoofdstuk: '2'
  - number: '7.3'
    text: |-
      Op een kerkgebouw dat deel uitmaakt van een complex is het subsidiepercentage van toepassing dat betrekking heeft
      op kerkgebouwen.
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel7
  - number: '7.4'
    text: |-
      Het eerste en het tweede lid zijn niet van toepassing op complexen die als zodanig tot de categorie woonhuizen en
      boerderijen zonder agrarische functie behoren.
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel7
  - number: '8'
    text: |-
      Subsidie wordt slechts verleend voorzover deze noodzakelijk is voor de instandhouding van het beschermd monument en
      voorzover de werkzaamheden ter uitvoering van het instandhoudingsplan naar het oordeel van Onze minister sober en
      doelmatig zijn.
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel8
  - number: '9.1'
    text: |-
      Onverminderd [artikel 4:35 van de Algemene wet bestuursrecht][ref1] wordt de subsidie in ieder geval niet
      verstrekt:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 9.1.a
    text: voorzover in de subsidiabele kosten subsidie is verstrekt op grond van een andere rijkssubsidieregeling,
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel9
  - number: 9.1.b
    text: |-
      voorzover bij schade de subsidiabele kosten op grond van een verzekering worden gedekt dan wel voorzover de
      subsidiabele kosten op grond van de [Wet op de omzetbelasting][ref1] op verschuldigde belasting in aftrek kunnen
      worden gebracht dan wel anderszins niet ten laste van de aanvrager komen,


      [ref1]: https://wetten.overheid.nl/BWBR0002629
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002629
  - number: 9.1.c
    text: voorzover met de werkzaamheden is begonnen voordat Onze minister de subsidie heeft verleend, of
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel9
  - number: 9.1.d
    text: ten behoeve van de instandhouding van archeologische monumenten.
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel9
  - number: '9.2'
    text: |-
      Dit besluit is niet van toepassing voorzover subsidie kan worden verstrekt op grond van een rijkssubsidieregeling
      voor historische buitenplaatsen als bedoeld in het [Besluit rijkssubsidiëring historische buitenplaatsen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006058
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006058
  - number: '10.1'
    text: Subsidie wordt per beschermd monument op aanvraag verleend.
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel10
  - number: '10.2'
    text: |-
      De aanvraag kan van 1 april tot 1 september voorafgaand aan het eerste kalenderjaar waarop het instandhoudingsplan
      betrekking heeft, worden ingediend. Aanvragen die zijn ingediend vóór 1 april of na 1 september, worden niet in
      behandeling genomen.
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel10
  - number: '10.3'
    text: |-
      Per beschermd monument kan slechts eenmaal voor een periode waarop een instandhoudingsplan betrekking heeft
      subsidie worden verleend.
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel10
  - number: '11.1'
    text: De subsidieaanvraag wordt ingediend op een door Onze minister vastgesteld formulier.
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel11
  - number: '11.2'
    text: 'De subsidieaanvraag gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel11
  - number: 11.2.a
    text: |-
      een instandhoudingsplan per beschermd monument of een gecombineerd instandhoudingsplan als bedoeld in
      [artikel 38][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0019439#Artikel38
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0019439
        artikel: '38'
        hoofdstuk: '4'
  - number: 11.2.b
    text: |-
      een bouwkundig inspectierapport per beschermd monument dat is opgesteld niet eerder dan twee jaren voorafgaande aan
      het eerste jaar waarop de aanvraag betrekking heeft, en
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel11
  - number: 11.2.c
    text: andere in het formulier aangegeven bescheiden.
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel11
  - number: '12.1'
    text: |-
      Het instandhoudingsplan omvat een overzicht van de aard en omvang van de voorgenomen werkzaamheden alsmede een
      omschrijving van de daarmee beoogde resultaten. Het instandhoudingsplan omvat tevens een meerjarenplan en een
      meerjarenbegroting. In het meerjarenplan wordt aangegeven in welk jaar de onderscheiden werkzaamheden plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel12
  - number: '12.2'
    text: Het instandhoudingsplan heeft betrekking op zes kalenderjaren.
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel12
  - number: '12.3'
    text: Onze minister kan modellen vaststellen voor het instandhoudingsplan.
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel12
  - number: '13'
    text: |-
      Onze minister verdeelt de beschikbare bedragen voor subsidieverlening ten behoeve van beschermde monumenten als
      bedoeld in [artikel 6, eerste onderscheidenlijk tweede lid][ref1], in de volgorde van ontvangst van de aanvragen,
      met dien verstande dat wanneer de aanvrager krachtens [artikel 4:5 van de Algemene wet bestuursrecht][ref2] de
      gelegenheid heeft gehad de subsidieaanvraag aan te vullen, de dag waarop de aanvullende informatie is ontvangen met
      betrekking tot de verdeling als datum van ontvangst geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0019439#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0019439
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '14'
    text: |-
      Subsidie wordt slechts verleend indien de financiële dekking van het gedeelte van de subsidiabele kosten van
      de voorgenomen werkzaamheden dat niet door subsidie kan worden gedekt, naar genoegen van Onze minister zeker is
      gesteld.
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel14
  - number: '15.1'
    text: |-
      Een subsidie ten laste van een begroting die nog niet is vastgesteld, wordt verleend onder de voorwaarde, bedoeld
      in [artikel 4:34, eerste lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '15.2'
    text: |-
      In geval van het niet vervullen van de voorwaarde, bedoeld in
      [artikel 4:34, eerste lid, van de Algemene wet bestuursrecht][ref1], worden de op grond van dit besluit verleende
      subsidiebedragen verlaagd tot het bedrag van de subsidie dat na de vaststelling of goedkeuring van de begroting ter
      beschikking staat, een en ander naar rato van het aantal subsidieaanvragers aan wie subsidie is verleend en van de
      hoogte van de verleende subsidiebedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '16.1'
    text: Onze minister beslist binnen dertien weken op de subsidieaanvraag.
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel16
  - number: '16.2'
    text: |-
      Onze minister deelt de beschikking, bedoeld in het eerste lid, dan wel een beschikking tot wijziging of intrekking
      van die beschikking mee aan burgemeester en wethouders van de gemeente waar het beschermd monument is gelegen, en
      aan gedeputeerde staten van de provincie waar het beschermd monument is gelegen.
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel16
  - number: '17'
    text: |-
      Onze minister draagt er zorg voor dat de aanvrager aan wie subsidie is verleend, in aanmerking komt voor een
      rekening-courantfaciliteit.
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel17
  - number: '18'
    text: |-
      De subsidie voor eigenaren van andere beschermde monumenten dan woonhuizen en boerderijen zonder agrarische
      functie die recht op fiscale aftrek van onderhoudskosten hebben, niet zijnde eigenaren als bedoeld in de
      [artikelen 20][ref1] en [21][ref2], bedraagt het volgende percentage van de subsidiabele kosten:


      [ref1]: https://wetten.overheid.nl/BWBR0019439#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0019439#Artikel21
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0019439
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0019439
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 18.a
    text: 'bij kerkgebouwen: 55%,'
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel18
  - number: 18.b
    text: 'bij kastelen, buitenplaatsen en landhuizen: 50%,'
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel18
  - number: 18.c
    text: 'bij molens en gemalen: 50%, en'
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel18
  - number: 18.d
    text: 'bij overige beschermde monumenten: 40%.'
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel18
  - number: '19'
    text: |-
      De subsidie voor eigenaren van andere beschermde monumenten dan woonhuizen en boerderijen zonder agrarische
      functie die geen recht op fiscale aftrek van onderhoudskosten hebben, niet zijnde eigenaren als bedoeld in de
      [artikelen 20][ref1] en [21][ref2], bedraagt het volgende percentage van de subsidiabele kosten:


      [ref1]: https://wetten.overheid.nl/BWBR0019439#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0019439#Artikel21
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0019439
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0019439
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 19.a
    text: 'bij kerkgebouwen: 65%,'
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel19
  - number: 19.b
    text: 'bij kastelen, buitenplaatsen en landhuizen: 60%,'
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel19
  - number: 19.c
    text: 'bij molens en gemalen: 60%, en'
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel19
  - number: 19.d
    text: 'bij overige beschermde monumenten: 50%.'
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel19
  - number: '20'
    text: |-
      Voor aangewezen organisaties voor monumentenbehoud bedraagt de subsidie het volgende percentage van de subsidiabele
      kosten:
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel20
  - number: 20.a
    text: 'bij woonhuizen en boerderijen zonder agrarische functie: 25%,'
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel20
  - number: 20.b
    text: 'bij kerkgebouwen: 65%,'
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel20
  - number: 20.c
    text: 'bij kastelen, buitenplaatsen en landhuizen: 60%,'
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel20
  - number: 20.d
    text: 'bij molens en gemalen: 60%, en'
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel20
  - number: 20.e
    text: 'bij overige beschermde monumenten: 50%.'
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel20
  - number: '21'
    text: |-
      Voor provincies, gemeenten, waterschappen en openbare lichamen die zijn ingesteld met toepassing van de
      [Wet gemeenschappelijke regelingen][ref1], bedraagt de subsidie 30% van de subsidiabele kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: '22'
    text: |-
      Subsidies worden niet verstrekt indien het bedrag dat overeenkomstig de bepalingen van dit besluit zou worden
      verstrekt, lager is dan € 1.200.
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel22
  - number: '23'
    text: 'Onze minister kan de eigenaar verplichten:'
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel23
  - number: 23.a
    text: mee te werken aan een onderzoek naar de bouwgeschiedenis van het beschermd monument,
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel23
  - number: 23.b
    text: |-
      de aanbesteding en de gunning van de werkzaamheden waarvoor subsidie is verleend, op een door Onze minister te
      bepalen wijze te doen plaatsvinden,
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel23
  - number: 23.c
    text: Onze minister tussentijds te rapporteren over de voortgang van werkzaamheden, of
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel23
  - number: 23.d
    text: |-
      binnen drie maanden na afloop van de periode waarover subsidie is verleend, een door een architect gewaarmerkt
      volledig stel revisietekeningen aan de Rijksdienst voor de Monumentenzorg te zenden.
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel23
  - number: '24'
    text: |-
      De eigenaar doet zo spoedig mogelijk schriftelijk mededeling aan Onze minister indien er zich omstandigheden
      voordoen die van invloed kunnen zijn op de subsidieverstrekking, onder overlegging van de relevante stukken.
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel24
  - number: '25'
    text: 'Onze minister kan de eigenaar verplichten:'
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel25
  - number: 25.a
    text: voor de duur van de werkzaamheden waarvoor subsidie is verleend, een Casco-All-Risks verzekering af te sluiten, of
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel25
  - number: 25.b
    text: |-
      vanaf de aanvang van de werkzaamheden waarvoor subsidie is verleend, op zijn kosten het beschermd monument te
      verzekeren dan wel verzekerd te houden tegen brand-, storm- en bliksemschade en na afloop van de werkzaamheden
      daartegen verzekerd te houden.
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel25
  - number: '26'
    text: |-
      Onze minister kan de eigenaar verplichten het beschermd monument te voorzien van een of meer installaties ter
      voorkoming van brand of blikseminslag ter bescherming van de monumentale waarde van het monument.
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel26
  - number: '27'
    text: |-
      Onze minister kan de eigenaar verplichten om overleg te voeren met de Rijksdienst voor de Monumentenzorg alvorens
      met de werkzaamheden ter uitvoering van het instandhoudingsplan wordt gestart indien de monumentale waarde van het
      beschermd monument daartoe aanleiding vormt.
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel27
  - number: '28'
    text: |-
      Onze minister kan de eigenaar verplichten om de werkzaamheden onder nader door hem te stellen voorwaarden te doen
      begeleiden indien voor de uitvoering van het instandhoudingsplan specifieke kennis is vereist.
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel28
  - number: '29'
    text: |-
      De eigenaar is verplicht na afloop van de werkzaamheden waarvoor subsidie is verleend, het beschermd monument te
      bewaren en te onderhouden in de staat waarin het door de werkzaamheden waarvoor subsidie is verleend, is gebracht.
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel29
  - number: '30.1'
    text: |-
      Onze minister kan na de verlening van de subsidie over de uitgevoerde werkzaamheden een voortgangsrapportage van de
      subsidieontvanger verlangen die bestaat uit een overzicht van de werkelijk uitgevoerde werkzaamheden ten opzichte
      van de volgens het instandhoudingsplan voorgenomen werkzaamheden en de gedane uitgaven.
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel30
  - number: '30.2'
    text: Onze minister bepaalt de wijze waarop de voortgangsrapportage geschiedt.
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel30
  - number: '31'
    text: |-
      Onze minister kan de eigenaar die geen recht op fiscale aftrek van onderhoudskosten heeft, verplichten een
      verklaring van de Belastingdienst waarbij is vastgesteld dat geen aftrek mogelijk is, te overleggen.
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel31
  - number: '32.1'
    text: |-
      Uiterlijk op 31 maart na afloop van het laatste kalenderjaar waarover de subsidie is verleend, dient de
      subsidieontvanger een aanvraag tot vaststelling van de subsidie in bij Onze minister. De aanvraag gaat vergezeld
      van de desbetreffende originele rekeningen en betalingsbewijzen.
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel32
  - number: '32.2'
    text: |-
      Indien rekeningen en betalingsbewijzen betrekking hebben op kosten van personeel dat in loondienst is bij de
      eigenaar, gaat de aanvraag tot vaststelling tevens vergezeld van een verklaring van een registeraccountant of
      een accountant-administratieconsulent waaruit blijkt hoeveel uren door dat personeel is besteed aan subsidiabele
      werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel32
  - number: '32.3'
    text: Onze minister beslist binnen dertien weken op de aanvraag tot vaststelling van de subsidie.
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel32
  - number: '32.4'
    text: |-
      Een afschrift van de beschikking tot vaststelling van de subsidie zendt Onze minister aan burgemeester en
      wethouders van de gemeente waar het beschermd monument is gelegen, en aan gedeputeerde staten van de provincie waar
      het beschermd monument is gelegen.
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel32
  - number: '33.1'
    text: |-
      In afwijking van [artikel 32, eerste lid, tweede volzin][ref1], gaat de aanvraag tot vaststelling van
      aangewezen organisaties voor monumentenbehoud indien het subsidiebedrag meer bedraagt dan € 60.000,–, vergezeld
      van een mededeling dat de subsidie rechtmatig is besteed, afgegeven door een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019439#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0019439
        artikel: '32'
        hoofdstuk: '3'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '33.2'
    text: De minister kan nadere voorschriften opleggen in verband met de inrichting van die mededeling.
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel33
  - number: '33.3'
    text: |-
      Bij de aanwijzing van de accountant bedingt de aangewezen organisatie voor monumentenbehoud dat aan de accountant
      die door Onze minister is belast met het onderzoek van de ministeriële jaarrekening, op diens verzoek:
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel33
  - number: 33.3.a
    text: inzage wordt geboden in de controlerapporten en de controledossiers van de accountant,
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel33
  - number: 33.3.b
    text: |-
      gelegenheid wordt gegeven om uit het controlerapport en controledossier voldoende controle-informatie te verzamelen
      die noodzakelijk is voor het eigen oordeel over de verrichte werkzaamheden van de accountant, en
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel33
  - number: 33.3.c
    text: kopieën worden verstrekt van de controlerapporten en controledossiers of delen daarvan.
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel33
  - number: '33.4'
    text: |-
      De minister kan een controleprotocol opstellen voor het onderzoek door de accountant. De subsidieontvanger bedingt
      bij de accountant dat deze zijn onderzoek inricht overeenkomstig het controleprotocol.
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel33
  - number: '33.5'
    text: |-
      Elke aangewezen organisatie voor monumentenbehoud verschaft toegang aan de accountant die door Onze minister is
      belast met het onderzoek van de ministeriële jaarrekening, met het oog op het verrichten van dat onderzoek.
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel33
  - number: '34'
    text: |-
      Onverminderd [artikel 4:46 van de Algemene wet bestuursrecht][ref1] kan de subsidie in ieder geval lager dan de
      verlening worden vastgesteld indien werkzaamheden waarvoor subsidie is verleend, zijn verricht in strijd met het
      bij of krachtens de wet bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '35.1'
    text: |-
      Indien de subsidieontvanger de eigendom van een beschermd monument overdraagt aan een andere eigenaar, dient de
      subsidieontvanger binnen drie maanden na de eigendomsoverdracht een aanvraag tot vaststelling van de subsidie in
      bij Onze minister. De [artikelen 32][ref1], [33][ref2] en [34][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019439#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0019439#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0019439#Artikel34
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0019439
        artikel: '32'
        hoofdstuk: '3'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0019439
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '6'
      - id: ref3
        bwb_id: BWBR0019439
        artikel: '34'
        hoofdstuk: '3'
        paragraaf: '6'
  - number: '35.2'
    text: |-
      Na de vaststelling, bedoeld in het eerste lid, kan Onze minister op verzoek van de eigenaar aan wie de eigendom
      is overgedragen, aan die eigenaar subsidie verstrekken ten behoeve van de afronding van het instandhoudingsplan.
      [Artikel 13][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019439#Artikel13
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0019439
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '36.1'
    text: |-
      Nadat subsidie is verleend, kan Onze minister aan de eigenaar op basis van door de eigenaar ingediende overzichten
      van gemaakte kosten, die vergezeld gaan van de desbetreffende originele rekeningen en in voorkomend geval
      betalingsbewijzen, jaarlijks voorschotten verstrekken tot ten hoogste een zesde gedeelte van het totaal verleende
      subsidiebedrag. [Artikel 32, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019439#Artikel32
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0019439
        artikel: '32'
        hoofdstuk: '3'
        paragraaf: '6'
  - number: '36.2'
    text: |-
      Onze minister keert de voorschotten uit voorzover de rekeningen werkzaamheden betreffen die in overeenstemming zijn
      met het instandhoudingsplan.
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel36
  - number: '37.1'
    text: |-
      Onze minister wijst op aanvraag organisaties die zich de instandhouding van monumenten ten doel stellen, aan als
      een organisatie voor monumentenbehoud indien:
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel37
  - number: 37.1.a
    text: |-
      de organisatie een privaatrechtelijke rechtspersoon is die zonder winstoogmerk in hoofdzaak het in stand houden van
      beschermde monumenten ten doel heeft,
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel37
  - number: 37.1.b
    text: de organisatie ten minste 20 beschermde monumenten in eigendom heeft, en
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel37
  - number: 37.1.c
    text: de organisatie naar het oordeel van Onze minister beschikt over voldoende professionele deskundigheid.
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel37
  - number: '37.2'
    text: |-
      Onze minister kan de aanwijzing intrekken indien een organisatie niet meer voldoet aan een van de in het eerste lid
      bedoelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel37
  - number: '38.1'
    text: |-
      In afwijking van [artikel 12][ref1] kan een aangewezen organisatie voor monumentenbehoud instandhoudingsplannen
      samenvoegen tot een gecombineerd instandhoudingsplan dat betrekking heeft op meerdere beschermde monumenten. In
      dat plan wordt per beschermd monument de aard en omvang van de voorgenomen werkzaamheden over de periode waarop
      het plan betrekking heeft, aangegeven. Het gecombineerde instandhoudingsplan omvat geen meerjarenplan als bedoeld
      in [artikel 12][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019439#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0019439#Artikel12
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0019439
        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019439
        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '38.2'
    text: |-
      Een aangewezen organisatie voor monumentenbehoud kan de subsidie aanwenden voor uitvoering van werkzaamheden aan
      alle monumenten waar het instandhoudingsplan betrekking op heeft met dien verstande dat deze werkzaamheden strekken
      tot uitvoering van het instandhoudingsplan en dat ten minste 50% van het maximumbedrag aan subsidiabele kosten als
      bedoeld in [artikel 6][ref1], per beschermd monument wordt besteed.


      [ref1]: https://wetten.overheid.nl/BWBR0019439#Artikel6
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0019439
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '39.1'
    text: |-
      Subsidie, verleend op grond van het [Besluit rijkssubsidiëring restauratie monumenten 1997][ref1], wordt
      afgehandeld overeenkomstig dat besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0008615
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0008615
  - number: '39.2'
    text: |-
      De rechten en verplichtingen, die op het tijdstip van de inwerkingtreding van dit besluit krachtens een beschikking
      op grond van het [Besluit rijkssubsidiëring restauratie monumenten 1997][ref1] gelden, blijven gelden voorzover
      bij of krachtens dit besluit niet anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0008615
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0008615
  - number: '40.1'
    text: |-
      Subsidie, verleend op grond van [hoofdstuk III van het Besluit rijkssubsidiëring onderhoud monumenten][ref1],
      wordt afgehandeld overeenkomstig [dat besluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004654#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0004654
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0004654
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004654
  - number: '40.2'
    text: |-
      De rechten en verplichtingen, die op het tijdstip van de inwerkingtreding van dit besluit krachtens een beschikking
      op grond van het [Besluit rijkssubsidiëring onderhoud monumenten][ref1] gelden, blijven gelden voorzover bij of
      krachtens dit besluit niet anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0004654
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0004654
  - number: '41.1'
    text: |-
      Onze minister wijst bij ministeriële regeling de beschermde monumenten aan waarop, en de kalenderjaren waarin,
      eigenaren van beschermde monumenten in aanmerking komen voor subsidie.
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel41
  - number: '41.2'
    text: |-
      Voorzover dit besluit op grond van het eerste lid nog niet van toepassing is, blijft het
      [Besluit rijkssubsidiëring onderhoud monumenten][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004654
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0004654
  - number: '41.3'
    text: |-
      De eigenaar van een beschermd monument waarop dit besluit van toepassing is, komt in aanmerking voor subsidie met
      ingang van 1 januari van het eerste jaar waarop het instandhoudingsplan van toepassing is.
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel41
  - number: '41.4'
    text: |-
      Aanvragen op grond van de [artikelen 8][ref1] en [9 van het Besluit rijkssubsidiëring onderhoud monumenten][ref2]
      blijven mogelijk tot 1 april van het eerste jaar waarop de eigenaar van een beschermd monument in aanmerking komt
      voor subsidie, en worden afgehandeld overeenkomstig het [Besluit rijkssubsidiëring onderhoud monumenten][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004654#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004654#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0004654
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0004654
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0004654
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0004654
  - number: '42.1'
    text: |-
      Ten laste van de budgetten die zijn vastgesteld op grond van het
      [Besluit rijkssubsidiëring restauratie monumenten 1997][ref1], kunnen tot 1 oktober 2006 aanvragen op grond van
      [dat besluit][ref2] worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0008615
      [ref2]: https://wetten.overheid.nl/BWBR0008615
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0008615
      - id: ref2
        bwb_id: BWBR0008615
  - number: '42.2'
    text: |-
      Aanvragen als bedoeld in het eerste lid, kunnen met inachtneming van
      [artikel 15 van het Besluit rijkssubsidiëring restauratie monumenten 1997][ref1] tot 1 januari 2007 aan Onze
      minister worden doorgezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0008615#Artikel15
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0008615
        artikel: '15'
  - number: '42.3'
    text: |-
      Budgetten als bedoeld in het eerste lid ten laste waarvan geen subsidie is verleend na toepassing van het eerste en
      tweede lid, zijn beschikbaar ten behoeve van de toepassing van dit besluit.
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel42
  - number: '42.4'
    text: |-
      Aanvragen als bedoeld in het eerste lid, worden afgehandeld overeenkomstig het
      [Besluit rijkssubsidiëring restauratie monumenten 1997][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008615
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0008615
  - number: '43.1'
    text: |-
      In dit artikel wordt verstaan onder restauratie: het verrichten van die werkzaamheden, de normale instandhouding te
      boven gaand, die voor het herstel van een beschermd monument noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel43
  - number: '43.2'
    text: |-
      Onverminderd [artikel 3, eerste lid][ref1], kan Onze minister aan een eigenaar als bedoeld in [artikel 4][ref2]
      subsidie verstrekken in de kosten ten behoeve van de restauratie van een beschermd monument voorzover de
      begrotingswetgever daartoe middelen ter beschikking heeft gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0019439#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0019439#Artikel4
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0019439
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0019439
        artikel: '4'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '43.3'
    text: Subsidie als bedoeld in dit artikel wordt per beschermd monument op aanvraag verleend.
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel43
  - number: '43.4'
    text: |-
      De gefaseerde inwerkingtreding, bedoeld in [artikel 41][ref1], geldt niet voor subsidieverlening op grond van dit
      artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0019439#Artikel41
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0019439
        artikel: '41'
        hoofdstuk: '5'
  - number: '43.5'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld met betrekking tot het verstrekken van subsidie op grond van
      dit artikel.
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel43
  - number: '45'
    text: |-
      Het [Besluit rijkssubsidiëring restauratie monumenten 1997][ref1],
      het [Besluit rijkssubsidiëring onderhoud monumenten][ref2] en het
      [Besluit buitenwerkingstelling restauratie-behoefteraming][ref3] worden ingetrokken met inachtneming van
      [hoofdstuk 5][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0008615
      [ref2]: https://wetten.overheid.nl/BWBR0004654
      [ref3]: https://wetten.overheid.nl/BWBR0017165
      [ref4]: https://wetten.overheid.nl/BWBR0019439#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0008615
      - id: ref2
        bwb_id: BWBR0004654
      - id: ref3
        bwb_id: BWBR0017165
      - id: ref4
        bwb_id: BWBR0019439
        hoofdstuk: '5'
  - number: '46'
    text: |-
      Onze minister zendt binnen 7 jaar na de inwerkingtreding van dit besluit aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van dit besluit in de praktijk.
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel46
  - number: '47'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel47
  - number: '48'
    text: 'Dit besluit wordt aangehaald als: Besluit rijkssubsidiëring instandhouding monumenten.'
    url: https://wetten.overheid.nl/BWBR0019439/2006-02-01#Artikel48
