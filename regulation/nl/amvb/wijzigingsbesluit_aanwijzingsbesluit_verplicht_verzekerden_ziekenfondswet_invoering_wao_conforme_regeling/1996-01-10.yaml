preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Volksgezondheid, Welzijn en Sport van 29 november 1995, VMP/VVU-954051,
    gedaan mede namens Onze Minister van Binnenlandse Zaken;


    Gelet op artikel 3, eerste lid, onderdeel b, van de Ziekenfondswet;


    De Raad van State gehoord (advies van 14 december 1995, nummer W13.95.0659);


    Gezien het nader rapport van Onze Minister van Volksgezondheid, Welzijn en Sport van 15 december 1995 VMP/VVU-
    954468, uitgebracht mede namens Onze Minister van Binnenlandse Zaken;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0007755/1996-01-10#ArtikelAanhef
articles:
  - number: III
    text: |-
      Gedurende het tijdvak van 1 januari 1995 tot en met 31 december 1995 wordt voor de toepassing van artikel
      4 van het Aanwijzingsbesluit verplicht-verzekerden [Ziekenfondswet][ref1], zoals dat artikel luidde in
      dat tijdvak, tevens in beschouwing genomen de inhoudingen op het loon, bedoeld in paragraaf 5 van de
      [Wet financiële voorzieningen privatisering ABP][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002460
      [ref2]: https://wetten.overheid.nl/BWBR0007211
    url: https://wetten.overheid.nl/BWBR0007755/1996-01-10#ArtikelIII
    references:
      - id: ref1
        bwb_id: BWBR0002460
      - id: ref2
        bwb_id: BWBR0007211
  - number: IV
    text: |-
      Dit besluit treedt in werking met ingang van 1 januari 1996. [Artikel III][ref1] werkt terug tot en met 1 januari
      1995. Indien het *Staatsblad* waarin dit besluit wordt geplaatst, wordt uitgegeven na 31 december 1995, treedt het
      in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin het wordt geplaatst, en werkt
      het terug tot en met 1 januari 1996.


      [ref1]: https://wetten.overheid.nl/BWBR0007755#ArtikelIII
    url: https://wetten.overheid.nl/BWBR0007755/1996-01-10#ArtikelIV
