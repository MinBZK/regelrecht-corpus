---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: landbouwkwaliteitsbesluit_scharreleieren
regulatory_layer: AMVB
publication_date: '2002-11-07'
valid_from: '1999-11-26'
bwb_id: BWBR0003200
url: https://wetten.overheid.nl/BWBR0003200/1999-11-26
preamble:
  text: |-
    Wij Juliana, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onze Minister van Landbouw en Visserij en de Staatssecretaris van Economische Zaken (Th. M.
    Hazekamp) van 18 mei 1978 (Directie Juridische en Bedrijfsorganisatorische Zaken, nr. J 1717);

    Gehoord het Landbouwschap, het Produktschap voor Pluimvee en Eieren, het Bedrijfschap voor de Groothandel in
    Eieren, het Bedrijfschap voor de Detailhandel in Melk en Melk- en Zuivelprodukten, de Consumentenbond, het
    Konsumenten Kontakt, de Nederlandse Vereniging tot Bescherming van Dieren en de Belangengroep "Rechten voor al
    wat leeft";

    Overwegende dat, ter bevordering van de afzet, regelen moeten worden gesteld met betrekking tot de aanduiding en
    produktiewijze van scharreleieren;

    Gelet op de artikelen 2, 3, 6, 7, 8, 9 en 12, eerste lid, van de Landbouwkwaliteitswet (Stb. 1971, 371);

    De Raad van State gehoord (advies van 19 juli 1978, nr. 18);

    Gezien het nader rapport van Onze Minister van Landbouw en Visserij en de Staatssecretaris van Economische Zaken
    (Th. M. Hazekamp) van 6 oktober 1978 (Directie Juridische en Bedrijfsorganisatorische Zaken, nr. J 2740);

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003200/1999-11-26#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en daarop berustende bepalingen wordt verstaan onder: "wet": [Landbouwkwaliteitswet][ref1]
      (*Stb.* 1971, 371); "eieren": kippeëieren in de schaal; "verhandelen": bedrijfsmatig voorhanden hebben,
      te koop aanbieden, verkopen of afleveren; EEG-verordening: [verordening (EEG) nr. 1274/91](31991R1274)
      van de Commissie van de Europese Gemeenschappen van 15 mei 1991 houdende bepalingen ter toepassing van de
      [Verordening (EEG) nr. 1907/90](31990R1907) van de Raad betreffende bepaalde handelsnormen voor eieren (*PbEG*
      L 121); produktschap: Produktschap voor Pluimvee en Eieren. in- of uitvoer: in- of uitvoer als bedoeld in
      [artikel 1, eerste lid, van de In- en uitvoerwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002755
      [ref2]: https://wetten.overheid.nl/BWBR0002376#Artikel1
    url: https://wetten.overheid.nl/BWBR0003200/1999-11-26#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002755
      - id: ref2
        bwb_id: BWBR0002376
        artikel: '1'
  - number: '2.1'
    text: |-
      Op kleine verpakkingen met eieren van klasse A mag, ter aanduiding van de produktiemethode, een van de volgende
      vermeldingen worden aangebracht:
    url: https://wetten.overheid.nl/BWBR0003200/1999-11-26#Artikel2
  - number: 2.1.a
    text: eieren van hennen met vrije uitloop-extensief systeem;
    url: https://wetten.overheid.nl/BWBR0003200/1999-11-26#Artikel2
  - number: 2.1.b
    text: eieren van hennen met vrije uitloop;
    url: https://wetten.overheid.nl/BWBR0003200/1999-11-26#Artikel2
  - number: 2.1.c
    text: scharreleieren;
    url: https://wetten.overheid.nl/BWBR0003200/1999-11-26#Artikel2
  - number: 2.1.d
    text: eieren van in volières gehouden hennen,
    url: https://wetten.overheid.nl/BWBR0003200/1999-11-26#Artikel2
  - number: '2.2'
    text: 'Het is, bij het verhandelen van eieren, verboden op of bij eieren dan wel op of bij de verpakking ervan:'
    url: https://wetten.overheid.nl/BWBR0003200/1999-11-26#Artikel2
  - number: 2.2.a
    text: |-
      de vermeldingen als bedoeld in het eerste lid aan te brengen of te bezigen, tenzij met betrekking tot deze eieren
      is voldaan aan het bij of krachtens de [artikelen 3][ref1] en [4][ref2] van dit besluit bepaalde;


      [ref1]: https://wetten.overheid.nl/BWBR0003200#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003200#Artikel4
    url: https://wetten.overheid.nl/BWBR0003200/1999-11-26#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003200
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0003200
        artikel: '4'
  - number: 2.2.b
    text: |-
      andere dan de in het eerste lid bedoelde vermeldingen ter aanduiding van de produktiemethode van eieren aan te
      brengen of te bezigen, met uitzondering van de vermelding, genoemd in artikel 18, eerste lid, onderdeel *e*, van de
      EEG-verordening, of afbeeldingen aan te brengen of te bezigen die misleidend zijn of kunnen zijn met betrekking tot
      de produktiemethode.
    url: https://wetten.overheid.nl/BWBR0003200/1999-11-26#Artikel2
  - number: '2.3'
    text: |-
      Het verbod van het tweede lid, onderdeel *a*, geldt niet voor uit een andere lid-staat van de Europese Unie
      ingevoerde eieren die geproduceerd zijn op bedrijven die voldoen aan de in bijlage II bij de EEG-verordening
      vermelde minimumvoorwaarden.
    url: https://wetten.overheid.nl/BWBR0003200/1999-11-26#Artikel2
  - number: '2.4'
    text: |-
      Dit artikel is niet van toepassing op goederen die op regelmatige wijze zijn aangebracht en aangegeven of op
      regelmatige wijze zijn aangebracht onder geleide van een document voor communautair douanevervoer en die nog niet
      zijn vrijgegeven voor een van de douaneregelingen als bedoeld in artikel 4, onderdeel 16, onder a, d of f, van
      [verordening (EEG) nr. 2913/92](31992R2913) van de Raad van de Europese Gemeenschappen van 12 oktober 1992 tot
      vaststelling van het communautair douanewetboek (PbEG L 302).
    url: https://wetten.overheid.nl/BWBR0003200/1999-11-26#Artikel2
  - number: '3.1'
    text: |-
      Onze Minister stelt voor eieren, als bedoeld in [artikel 2, eerste lid][ref1], regelen met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0003200#Artikel2
    url: https://wetten.overheid.nl/BWBR0003200/1999-11-26#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003200
        artikel: '2'
  - number: 3.1.a
    text: de hoedanigheid, de sortering, de verzorging, de verpakking en de aanduiding;
    url: https://wetten.overheid.nl/BWBR0003200/1999-11-26#Artikel3
  - number: 3.1.b
    text: de inrichting en het gebruik van de ruimte bestemd voor de kippen, die deze eieren voortbrengen;
    url: https://wetten.overheid.nl/BWBR0003200/1999-11-26#Artikel3
  - number: 3.1.c
    text: de voeding, drenking en verzorging van de kippen, die deze eieren voortbrengen;
    url: https://wetten.overheid.nl/BWBR0003200/1999-11-26#Artikel3
  - number: 3.1.d
    text: de kippen die deze eieren voortbrengen.
    url: https://wetten.overheid.nl/BWBR0003200/1999-11-26#Artikel3
  - number: '3.2'
    text: |-
      De in het eerste lid bedoelde regelen kunnen verschillen naar gelang van de soort, de oorsprong, de herkomst en de
      geografische bestemming van de in [artikel 2, eerste lid][ref1], bedoelde eieren.


      [ref1]: https://wetten.overheid.nl/BWBR0003200#Artikel2
    url: https://wetten.overheid.nl/BWBR0003200/1999-11-26#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003200
        artikel: '2'
  - number: 3a.1
    text: |-
      Onze Minister kan bepalen dat de in [artikel 3, eerste lid][ref1], bedoelde regelen bij verordening worden gesteld
      door het bestuur van het produktschap.


      [ref1]: https://wetten.overheid.nl/BWBR0003200#Artikel3
    url: https://wetten.overheid.nl/BWBR0003200/1999-11-26#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0003200
        artikel: '3'
  - number: 3a.2
    text: |-
      Onze Minister kan bepalen dat krachtens verordening, als bedoeld in het eerste lid, genomen besluiten de
      goedkeuring behoeven van een door hem aangewezen autoriteit.
    url: https://wetten.overheid.nl/BWBR0003200/1999-11-26#Artikel3a
  - number: '4.1'
    text: |-
      Onze Minister kan bepalen dat met betrekking tot eieren, als bedoeld in [artikel 2, eerste lid][ref1], een keuring,
      als bedoeld in artikel 7 van de wet, plaatsvindt volgens door hem te stellen regelen.


      [ref1]: https://wetten.overheid.nl/BWBR0003200#Artikel2
    url: https://wetten.overheid.nl/BWBR0003200/1999-11-26#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003200
        artikel: '2'
  - number: '4.2'
    text: |-
      Onze Minister kan voor eieren, als bedoeld in [artikel 2, eerste lid][ref1], merken, tekenen en bewijsstukken, als
      bedoeld in artikel 7 van de wet, vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0003200#Artikel2
    url: https://wetten.overheid.nl/BWBR0003200/1999-11-26#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003200
        artikel: '2'
  - number: '4.3'
    text: |-
      Onze Minister kan regelen stellen inzake de gebruikmaking van de in het tweede lid bedoelde merken, tekenen of
      bewijsstukken.
    url: https://wetten.overheid.nl/BWBR0003200/1999-11-26#Artikel4
  - number: '4.4'
    text: |-
      Onze Minister kan regelen stellen betreffende het vervaardigen, voorhanden en in voorraad hebben, zomede het
      afleveren en gebruiken van de in het tweede lid bedoelde merken, tekenen en bewijsstukken, en van de clichés,
      stempels en andere werktuigen tot het vervaardigen of aanbrengen van die merken, tekenen en bewijsstukken.
    url: https://wetten.overheid.nl/BWBR0003200/1999-11-26#Artikel4
  - number: '5.1'
    text: |-
      Het is verboden de in [artikel 4][ref1] bedoelde merken, tekenen en bewijsstukken te bezigen in strijd met het bij
      of krachtens dit besluit bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0003200#Artikel4
    url: https://wetten.overheid.nl/BWBR0003200/1999-11-26#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003200
        artikel: '4'
  - number: '5.2'
    text: |-
      Het is verboden voor eieren dan wel de verpakking ervan aanduidingen te bezigen welke sterk gelijken op de in
      [artikel 4][ref1] bedoelde merken, tekenen en bewijsstukken.


      [ref1]: https://wetten.overheid.nl/BWBR0003200#Artikel4
    url: https://wetten.overheid.nl/BWBR0003200/1999-11-26#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003200
        artikel: '4'
  - number: '6'
    text: |-
      De Stichting Controlebureau voor Pluimvee, Eieren en Eiprodukten is ten aanzien van de in
      [artikel 2, eerste lid][ref1], bedoelde eieren: - belast met het toezicht op de naleving door de bij haar
      aangeslotenen van de bij of krachtens dit besluit gestelde regelen;
        - belast met de keuring als bedoeld in [artikel 4, eerste lid][ref2];
        - bevoegd tot het uitreiken van de in [artikel 4][ref3] bedoelde merken, tekenen en bewijsstukken.


      [ref1]: https://wetten.overheid.nl/BWBR0003200#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003200#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0003200#Artikel4
    url: https://wetten.overheid.nl/BWBR0003200/1999-11-26#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003200
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003200
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0003200
        artikel: '4'
  - number: 6a
    text: |-
      Producenten van eieren als bedoeld in [artikel 2, eerste lid][ref1], alsmede pakstations waar in Nederland
      geproduceerde eieren als bedoeld in [artikel 2, eerste lid][ref2], worden gesorteerd of verpakt, dienen aangesloten
      te zijn bij die in [artikel 6][ref3] genoemde controle-instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0003200#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003200#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003200#Artikel6
    url: https://wetten.overheid.nl/BWBR0003200/1999-11-26#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0003200
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003200
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0003200
        artikel: '6'
  - number: '7.1'
    text: |-
      De voorzitter van de in [artikel 6][ref1] genoemde instelling wordt door Onze Minister telkens voor ten hoogste
      vier jaar benoemd. Hij is terstond wederbenoembaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003200#Artikel6
    url: https://wetten.overheid.nl/BWBR0003200/1999-11-26#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003200
        artikel: '6'
  - number: '7.2'
    text: |-
      Het bestuur van de in [artikel 6][ref1] genoemde instelling doet aan Onze Minister een voordracht voor de
      benoeming.


      [ref1]: https://wetten.overheid.nl/BWBR0003200#Artikel6
    url: https://wetten.overheid.nl/BWBR0003200/1999-11-26#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003200
        artikel: '6'
  - number: '7.3'
    text: De voorzitter mag niet rechtstreeks betrokken zijn bij de produktie van of handel in eieren.
    url: https://wetten.overheid.nl/BWBR0003200/1999-11-26#Artikel7
  - number: '8'
    text: |-
      Onze Minister kan in overeenstemming met Onze Minister van Financiën plaatsen aanwijzen, waarop ten in- of uitvoer
      bestemde eieren, als bedoeld in dit besluit, moeten worden aangeboden ten invoer, onderscheidenlijk ten uitvoer.
    url: https://wetten.overheid.nl/BWBR0003200/1999-11-26#Artikel8
  - number: '9.1'
    text: Onze Minister kan vrijstelling en, op aanvraag, ontheffing verlenen van het bij of krachtens dit besluit bepaalde.
    url: https://wetten.overheid.nl/BWBR0003200/1999-11-26#Artikel9
  - number: '9.2'
    text: |-
      Onze Minister kan bepalen dat een vrijstelling of een ontheffing als bedoeld in het eerste lid door het
      produktschap wordt verleend. Hij kan voorts bepalen dat een besluit, waarbij een zodanige vrijstelling of
      ontheffing wordt verleend, de goedkeuring behoeft van een door hem aangewezen autoriteit.
    url: https://wetten.overheid.nl/BWBR0003200/1999-11-26#Artikel9
  - number: '10'
    text: Dit besluit kan worden aangehaald als "Landbouwkwaliteitsbesluit scharreleieren".
    url: https://wetten.overheid.nl/BWBR0003200/1999-11-26#Artikel10
