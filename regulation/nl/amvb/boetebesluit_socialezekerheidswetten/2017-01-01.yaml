    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. *ANW:* [Algemene nabestaandenwet][ref1];

      b. *AOW:* [ Algemene Ouderdomswet][ref2];

      c. *AKW:* [Algemene Kinderbijslagwet][ref3];

      d. *IOAW:* [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref4];

      e. *IOAZ:* [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref5];

      f. *IOW:* [Wet inkomensvoorziening oudere werklozen][ref6];

      g. *RW:* [Remigratiewet][ref7];

      h. *TW:* [Toeslagenwet][ref8];

      i. *WAO:* [Wet op de arbeidsongeschiktheidsverzekering][ref9];

      j. *WAZ:* [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref10];

      k. *WW:* [Werkloosheidswet][ref11];

      l. *ZW:* [ Ziektewet][ref12];

      m. *Wajong:* [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref13];

      n. *Wet WIA:* [Wet werk en inkomen naar arbeidsvermogen][ref14];

      o. *Wet SUWI:* [Wet structuur uitvoeringsorganisatie werk en inkomen][ref15];

      p. *benadelingsbedrag:* hetgeen hieronder wordt verstaan in de artikelen, genoemd in onderdeel r;

      q. *bestuurlijke boete:* de bestuurlijke boete, bedoeld in de [artikelen 27a van de WW][ref16],
      [21, van de IOW][ref17], [45a van de ZW][ref18], [29a van de WAO][ref19], [48 van de WAZ][ref20],
      [2:69][ref21] en [3:40 van de Wajong][ref22], [14a van de TW][ref23], [17c van de AOW][ref24],
      [39 van de ANW][ref25], [17a van de AKW][ref26], [3:16 eerste lid, onderdeel o][ref27], en
      [3:27, eerste lid, onderdeel m, van de Wet arbeid en zorg][ref28], [91van de Wet WIA][ref29],
      [20a van de IOAW][ref30], [20a van de IOAZ][ref31], en [18a][ref32] en [47g van de Participatiewet][ref33] en
      [6b van de RW][ref34];

      r. *inlichtingenverplichting:* de verplichting, bedoeld in de [artikelen 25 van de WW][ref35],
      [12, eerste lid, van de IOW][ref36], [31, eerste lid][ref37], en [49 van de ZW][ref38], [80 van de WAO][ref39],
      [70 van de WAZ][ref40], [2:7, eerste en zevende lid][ref41], en [3:74 van de Wajong][ref42],
      [12 van de TW][ref43], [49 van de AOW][ref44], [35 van de ANW][ref45], [15 van de AKW][ref46],
      [3:16, eerste lid, onderdeel g][ref47], en [3:27, eerste lid, onderdeel f, van de Wet arbeid en zorg][ref48],
      [27 van de Wet WIA][ref49], [13, eerste lid, van de IOAW][ref50], [13, eerste lid, van de IOAZ][ref51],
      [17, eerste lid, van de Participatiewet][ref52], [5a van de RW][ref53], en
      [30c, tweede en derde lid, van de Wet SUWI][ref54];

      s. *waarschuwing:* de waarschuwing, bedoeld in de artikelen, genoemd in onderdeel q;

      t. *werkgever:* de werkgever in de zin van de [ZW][ref55];

      u. *werkgeversboete ZW/WAO:* de bestuurlijke boete, bedoeld in de [artikelen 38, derde lid][ref56],
      [38a, achtste lid][ref57], en [63c van de ZW][ref58] en [artikel 71a, derde en vierde lid, van de WAO][ref59] zoals
      dit artikel luidde voor 1 april 2002.


