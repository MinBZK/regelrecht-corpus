  - number: 2a
    text: |-
      1 Bij de bepaling van de hoogte van de bestuurlijke boete wordt de mate waarin de gedraging aan de betrokkene
      kan worden verweten beoordeeld naar de omstandigheden waarin betrokkene verkeerde op het moment dat hij de
      inlichtingenverplichting had moeten nakomen.

      2 Bij de beoordeling van de mate waarin de gedraging aan de betrokkene kan worden verweten, leiden in ieder geval
      de volgende criteria tot verminderde verwijtbaarheid:

      a. de betrokkene verkeerde in onvoorziene en ongewenste omstandigheden, die niet tot het normale levenspatroon
      behoren en die hem weliswaar niet in de feitelijke onmogelijkheid brachten om aan de inlichtingenverplichting te
      voldoen, maar die emotioneel zo ontwrichtend waren dat hem niet volledig valt toe te rekenen dat de inlichtingen
      niet tijdig of volledig zijn verstrekt;

      b. de betrokkene verkeerde in een zodanige geestelijke toestand dat hem de overtreding niet volledig valt aan te
      rekenen;

      c. de betrokkene heeft wel inlichtingen verstrekt, die echter onjuist of onvolledig waren, of heeft anderszins
      een wijziging van omstandigheden niet onverwijld gemeld, maar uit eigen beweging alsnog de juiste inlichtingen
      verstrekt voordat de overtreding is geconstateerd, tenzij de betrokkene deze inlichtingen heeft verstrekt in het
      kader van toezicht op de naleving van een inlichtingenverplichting;

      d. de overtreding van de inlichtingenverplichting of de hoogte van het benadelingsbedrag is mede te wijten aan het
      bestuursorgaan dat bevoegd is de bestuurlijke boete op te leggen, of

      e. er is sprake van een samenloop van omstandigheden die elk op zich niet, maar in hun onderlinge samenhang
      beschouwd wel leiden tot verminderde verwijtbaarheid.

      3 Bij de beoordeling van de mate waarin de gedraging aan de betrokkene kan worden verweten, kunnen de volgende
      criteria leiden tot grove schuld:

      a. de betrokkene heeft bij herhaling geen of onjuiste informatie verstrekt, terwijl ten aanzien van deze
      overtredingen ten minste sprake is geweest van een normale verwijtbaarheid, of

      b. er is sprake van een samenloop van omstandigheden die elk op zich normale verwijtbaarheid opleveren, maar in hun
      onderlinge samenhang beschouwd wel leiden tot grove schuld.

      4 Bij de beoordeling van de mate waarin de gedraging aan de betrokkene kan worden verweten, kunnen de volgende
      criteria leiden tot opzet:

      a. betrokkene heeft al dan niet in het kader van een handhavingsonderzoek, zelf aangegeven en toegegeven dat hij
      de inlichtingenverplichting niet is nagekomen om te voorkomen dat hij een lagere uitkering zou ontvangen of de
      uitkering zou verliezen;

      b. het verzwijgen van werkzaamheden of uitbreiding van de werkzaamheden en daarmee gemoeide inkomsten, of

      c. het verzwijgen van de gezinssamenstelling, de inkomsten van de gezinsleden of het bezit van vermogen of goederen
      van waarde.
    url: https://wetten.overheid.nl/BWBR0011708/2017-01-01#Artikel2a
  - number: 2aa
    text: |-
      1 Het bestuursorgaan kan afzien van een bestuurlijk boete en volstaan met het geven van een schriftelijke
      waarschuwing indien:

      a. de overtreding van de inlichtingenverplichting niet heeft geleid tot een benadelingsbedrag of het
      benadelingsbedrag niet hoger is dan € 150,–, of

      b. de betrokkene wel inlichtingen heeft verstrekt, die echter onjuist of onvolledig waren, of heeft anderszins een
      wijziging van omstandigheden niet onverwijld gemeld, maar uit eigen beweging alsnog binnen een redelijke termijn de
      juiste inlichtingen verstrekt voordat de overtreding is geconstateerd, tenzij de betrokkene deze inlichtingen heeft
      verstrekt in het kader van toezicht op de naleving van een inlichtingenverplichting.

      2 Een redelijke termijn als bedoeld in het eerste lid, onderdeel b, is niet langer dan 60 dagen nadat de
      inlichtingen hadden behoren te worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0011708/2017-01-01#Artikel2aa
  - number: 2b
    text: |-
      1 De verplichtingen, bedoeld in de [artikelen 38, eerste lid en tweede lid, eerste zin][ref1],
      [38a, tweede, derde, vijfde en zesde lid][ref2], en [38b, tweede en derde lid, van de ZW][ref3] zijn niet
      behoorlijk nagekomen indien:

      a. de aangifte van de ongeschiktheid tot werken of de hersteldmelding niet tijdig is gedaan, of

      b. de datum van de eerste dag van ongeschiktheid tot werken, van de laatste werkdag of herstel onjuist is
      opgegeven.

      2 De verplichting, bedoeld in [artikel 63c, van de ZW][ref4], is niet nagekomen indien de werkgever de melding dat
      hij zich met betrekking tot de begeleiding van zijn zieke werknemers niet meer laat bijstaan door een persoon als
      bedoeld in dat artikel, niet binnen 7 kalenderdagen heeft gedaan.

      3 De verplichting, bedoeld in [artikel 38a, zevende lid, van de ZW][ref5] is niet behoorlijk nagekomen indien de
      werkgever de melding niet binnen 7 kalenderdagen heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel38
