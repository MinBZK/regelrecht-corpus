  - number: '2'
    text: |-
      1 Indien als gevolg van overtreding van de inlichtingenverplichting sprake is van een benadelingsbedrag, worden bij
      de vaststelling van de hoogte van de bestuurlijke boete de uitgangspunten in het tweede tot en met het tiende lid
      in acht genomen.

      2 Indien de inlichtingenverplichting opzettelijk is overtreden, wordt de bestuurlijke boete vastgesteld op
      100 procent van het benadelingsbedrag.

      3 Indien sprake is van grove schuld ten aanzien van de overtreding van de inlichtingenverplichting, wordt de
      bestuurlijke boete vastgesteld op 75 procent van het benadelingsbedrag.

      4 Indien geen sprake is van opzet of grove schuld ten aanzien van de overtreding van de inlichtingenverplichting,
      wordt de bestuurlijke boete vastgesteld op 50 procent van het benadelingsbedrag.

      5 Indien sprake is van verminderde verwijtbaarheid ten aanzien van de overtreding van de inlichtingenverplichting,
      wordt de bestuurlijke boete vastgesteld op 25 procent van het benadelingsbedrag.

      6 Bij recidive worden de percentages, genoemd in het tweede tot en met het vijfde lid, toegepast op het
      benadelingsbedrag vermenigvuldigd met 150 procent van dit bedrag.

      7 Indien het benadelingsbedrag, of het benadelingsbedrag bij toepassing van het zesde
      lid, hoger is dan 100/75 vermenigvuldigd met het bedrag van de derde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1], wordt in afwijking van het vierde en vijfde lid, de
      bestuurlijke boete:

      a. indien geen sprake is van opzet of grove schuld ten aanzien van de overtreding van de inlichtingenverplichting,
      vastgesteld op 50/75 vermenigvuldigd met het bedrag van de derde categorie;

      b. indien sprake is van verminderde verwijtbaarheid ten aanzien van de overtreding van de inlichtingenverplichting,
      vastgesteld op 25/75 vermenigvuldigd met het bedrag van de derde categorie.

      8 De percentages, genoemd in het tweede tot en met zesde lid, en de factoren, genoemd in het zevende lid,
      onderdelen a en b, worden zo nodig verlaagd voor de vaststelling van een evenredige bestuurlijke boete.

      9 Het bestuursorgaan dient de aanwezigheid van opzet of grove schuld te stellen en te bewijzen. Het bestuursorgaan
      kan zich voor het bewijs baseren op door hem gestelde, en door betrokkene niet of niet voldoende weerlegde
      vermoedens die gebaseerd zijn op feiten.

      10 De stelplicht en bewijslast van feiten en omstandigheden die aanleiding kunnen geven voor verlaging van de
      bestuurlijke boete rust op betrokkene. Indien het bestuursorgaan op de hoogte is van bijzondere omstandigheden,
      wordt bij het opleggen van de bestuurlijke boete daarmee rekening gehouden.

      11 Indien een overtreding van de inlichtingenverplichting niet heeft geleid tot een benadelingsbedrag, en niet
      volstaan wordt met het geven van een schriftelijke waarschuwing, wordt als uitgangspunt een bestuurlijke boete van
      € 150 vastgesteld, tenzij een afwijkend bedrag noodzakelijk is voor de vaststelling van een evenredige boete.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
