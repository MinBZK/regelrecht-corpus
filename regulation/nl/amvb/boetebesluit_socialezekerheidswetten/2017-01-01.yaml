    text: |-
      1 Het Besluit tarieven administratieve boeten Abw, Ioaw en Ioaz wordt ingetrokken.

      2
    url: https://wetten.overheid.nl/BWBR0011708/2017-01-01#Artikel4
  - number: '5'
    text: |-
      1 Het Besluit tarieven administratieve boeten Abw, Ioaw en Ioaz, het Boetebesluit Tica, het Boetebesluit AOW, het
      Boetebesluit Anw en het Boetebesluit AKW, zoals die luidden op de dag voorafgaande aan de dag van inwerkingtreding
      van dit besluit, blijven van toepassing op de niet of niet behoorlijke nakoming van de inlichtingenverplichting die
      voorafgaat aan de dag van inwerkingtreding van dit besluit.

      2 Indien voor de niet of niet behoorlijke nakoming van de inlichtingenverplichting die vooraf gaat aan
      de dag van inwerkingtreding van dit besluit, op grond van dit besluit een lagere bestuurlijke boete zou
      moeten worden opgelegd dan op grond van het Besluit tarieven administratieve boeten Abw, Ioaw en Ioaz, de
      [artikelen 7 tot en met 10 van het Uitvoeringsbesluit WIK][ref1], het Boetebesluit Tica, het Boetebesluit AOW, het
      Boetebesluit Anw of het Boetebesluit AKW, wordt, in afwijking van het eerste lid, dit besluit toegepast.

      3 Het Boetebesluit socialezekerheidswetten, zoals dat luidde voor 1 juli 2007, blijft van toepassing op de niet
      of niet behoorlijke nakoming van de inlichtingenverplichting die voorafgaat aan die datum, tenzij de beschikking
      waarbij de boete wordt opgelegd wordt genomen op of na die datum en sindsdien een gunstiger boete geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0009674#Artikel7
    url: https://wetten.overheid.nl/BWBR0011708/2017-01-01#Artikel5
