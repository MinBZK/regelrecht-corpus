  - number: 2c
    text: |-
      1 De hoogte van de bestuurlijke boete, bedoeld in de [artikelen 38, derde lid][ref1], [38a, achtste lid][ref2], en
      [63c van de ZW][ref3] bedraagt:

      a. € 70, indien de aangifte van de ongeschiktheid tot werken, de aangifte van de laatste werkdag, de
      hersteldmelding respectievelijk de melding zich niet meer te laten bijstaan door een persoon als bedoeld in
      [artikel 63c van de ZW][ref4], of de melding, bedoeld in [artikel 38a, zevende lid, van de ZW][ref5], minder dan 7
      kalenderdagen te laat is gedaan;

      b. € 230, indien de aangifte van de ongeschiktheid tot werken, de aangifte van de laatste werkdag, de
      hersteldmelding respectievelijk de melding zich niet meer te laten bijstaan door een persoon als bedoeld
      in [artikel 63c van de ZW][ref6], of de melding, bedoeld in [artikel 38a, zevende lid, van de ZW][ref7], 7
      kalenderdagen of meer doch minder dan 28 kalenderdagen te laat is gedaan;

      c. € 455, indien de aangifte van de ongeschiktheid tot werken, de aangifte van de laatste werkdag, de
      hersteldmelding respectievelijk de melding zich niet meer te laten bijstaan door een persoon als bedoeld
      in [artikel 63c van de ZW][ref8], of de melding, bedoeld in [artikel 38a, zevende lid, van de ZW][ref9], 28
      kalenderdagen of meer te laat is gedaan;

      d. € 455, indien de aangifte van de ongeschiktheid tot werken, de datum van de laatste werkdag, de datum van
      herstel respectievelijk de datum sedert wanneer de werkgever zich niet meer laat bijstaan door een persoon als
      bedoeld in [artikel 63c van de ZW][ref10], of de melding, bedoeld in [artikel 38a, zevende lid, van de ZW][ref11],
      onjuist is opgegeven.

      2 De bestuurlijke boete wegens het niet nakomen van de verplichtingen, bedoeld in de
      [artikelen 38, eerste lid en tweede lid, eerste zin][ref12], [38a, vijfde en zesde lid][ref13], en
      [63c van de ZW][ref14] bedraagt € 455.


