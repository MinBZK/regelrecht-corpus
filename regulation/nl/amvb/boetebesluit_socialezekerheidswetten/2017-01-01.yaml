  - number: 2d
    text: |-
      1 Indien de werkgever de verplichtingen, bedoeld in [artikel 71a, eerste, tweede of derde lid, van de WAO][ref1],
      zoals dat artikel luidde voor 1 april 2002, niet of niet behoorlijk nakomt ten aanzien van de werknemer of de in
      dat artikel bedoelde verzekerde wiens eerste dag van ongeschiktheid tot het verrichten van arbeid is gelegen voor
      die datum, is artikel 4 van het Besluit boete ZW/WAO werkgevers 2002, zoals dat luidde voor inwerkingtreding van
      dit besluit, van toepassing.

      2 Indien de werkgever de verplichting, bedoeld in [artikel 71a, vierde lid, van de WAO][ref2], zoals dat artikel
      luidde voor 1 april 2002, niet nakomt ten aanzien van de werknemer of de in dat artikel bedoelde verzekerde wiens
      eerste dag van ongeschiktheid tot het verrichten van arbeid is gelegen voor die datum, is artikel 5 van het Besluit
      boete ZW/WAO werkgevers 2002, zoals dat luidde voor inwerkingtreding van dit besluit, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
