    Op de voordracht van de Staatssecretaris van Sociale Zaken en Werkgelegenheid, J.F. Hoogervorst, gedaan mede
    namens Onze Minister van Sociale Zaken en Werkgelegenheid, van 4 juli 2000, Directie Sociale Verzekeringen, Nr.
