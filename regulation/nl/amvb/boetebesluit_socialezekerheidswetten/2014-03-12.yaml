  - number: 2b.1.a
    text: de aangifte van de ongeschiktheid tot werken of de hersteldmelding niet tijdig is gedaan, of
    url: https://wetten.overheid.nl/BWBR0011708/2014-03-12#Artikel2b
  - number: 2b.1.b
    text: de datum van de eerste dag van ongeschiktheid tot werken, van de laatste werkdag of herstel onjuist is opgegeven.
    url: https://wetten.overheid.nl/BWBR0011708/2014-03-12#Artikel2b
  - number: 2b.2
    text: |-
      De verplichting, bedoeld in [artikel 63c, van de ZW][ref1], is niet nagekomen indien de werkgever de melding dat
      hij zich met betrekking tot de begeleiding van zijn zieke werknemers niet meer laat bijstaan door een persoon als
      bedoeld in dat artikel, niet binnen 7 kalenderdagen heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel63c
    url: https://wetten.overheid.nl/BWBR0011708/2014-03-12#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: 63c
  - number: 2b.3
    text: |-
      De verplichting, bedoeld in [artikel 38a, zevende lid, van de ZW][ref1] is niet behoorlijk nagekomen indien de
      werkgever de melding niet binnen 7 kalenderdagen heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel38a
    url: https://wetten.overheid.nl/BWBR0011708/2014-03-12#Artikel2b
