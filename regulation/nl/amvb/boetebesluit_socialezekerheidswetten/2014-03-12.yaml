  - number: '2.1'
    text: |-
      De bestuurlijke boete wordt vastgesteld op de hoogte van het benadelingsbedrag, en bij recidive van overtreding van
      de inlichtingenverplichting op 150 procent van het benadelingsbedrag, met dien verstande dat zij op ten minste €
      150 wordt vastgesteld. Bij verminderde verwijtbaarheid wordt de bestuurlijke boete verlaagd.
    url: https://wetten.overheid.nl/BWBR0011708/2014-03-12#Artikel2
  - number: '2.2'
    text: De bestuurlijke boete wordt naar boven afgerond op een veelvoud van € 10.
    url: https://wetten.overheid.nl/BWBR0011708/2014-03-12#Artikel2
  - number: '2.3'
    text: |-
      Indien het niet of niet behoorlijk nakomen van de inlichtingenverplichting niet heeft geleid tot een
      benadelingsbedrag en niet volstaan wordt met het geven van een schriftelijke waarschuwing, wordt de bestuurlijke
      boete vastgesteld op €150. Bij verminderde verwijtbaarheid wordt de bestuurlijke boete verlaagd.
    url: https://wetten.overheid.nl/BWBR0011708/2014-03-12#Artikel2
  - number: 2a.1
    text: |-
      Bij de bepaling van de hoogte van de bestuurlijke boete wordt de mate waarin de gedraging aan de betrokkene
      kan worden verweten beoordeeld naar de omstandigheden waarin betrokkene verkeerde op het moment dat hij de
      inlichtingenverplichting had moeten nakomen.
    url: https://wetten.overheid.nl/BWBR0011708/2014-03-12#Artikel2a
  - number: 2a.2
    text: |-
      Bij de beoordeling van de mate waarin de gedraging aan de betrokkene kan worden verweten, leiden in ieder geval de
      volgende criteria tot verminderde verwijtbaarheid:
    url: https://wetten.overheid.nl/BWBR0011708/2014-03-12#Artikel2a
  - number: 2a.2.a
    text: |-
      de betrokkene verkeerde in onvoorziene en ongewenste omstandigheden, die niet tot het normale levenspatroon behoren
      en die hem weliswaar niet in de feitelijke onmogelijkheid brachten om aan de inlichtingenverplichting te voldoen,
      maar die emotioneel zo ontwrichtend waren dat hem niet volledig valt toe te rekenen dat de inlichtingen niet tijdig
      of volledig zijn verstrekt;
    url: https://wetten.overheid.nl/BWBR0011708/2014-03-12#Artikel2a
  - number: 2a.2.b
    text: |-
      de betrokkene verkeerde in een zodanige geestelijke toestand dat hem de overtreding niet volledig valt aan te
      rekenen, of
    url: https://wetten.overheid.nl/BWBR0011708/2014-03-12#Artikel2a
  - number: 2a.2.c
    text: |-
      de betrokkene heeft wel inlichtingen verstrekt, die echter onjuist of onvolledig waren, of heeft anderszins
      een wijziging van omstandigheden niet onverwijld gemeld, maar uit eigen beweging alsnog de juiste inlichtingen
      verstrekt voordat de overtreding is geconstateerd, tenzij de betrokkene deze inlichtingen heeft verstrekt in het
      kader van toezicht op de naleving van een inlichtingenverplichting.
    url: https://wetten.overheid.nl/BWBR0011708/2014-03-12#Artikel2a
  - number: 2b.1
    text: |-
      De verplichtingen, bedoeld in de [artikelen 38, eerste lid en tweede lid, eerste zin][ref1],
      [38a, tweede, derde, vijfde en zesde lid][ref2], en [38b, tweede en derde lid, van de ZW][ref3] zijn niet
      behoorlijk nagekomen indien:


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel38a
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel38b
    url: https://wetten.overheid.nl/BWBR0011708/2014-03-12#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '38'
