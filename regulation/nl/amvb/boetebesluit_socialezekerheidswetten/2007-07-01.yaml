  - number: 2b
    text: |-
      1 De hoogte van de boete, bedoeld in de [artikelen 38, vierde lid][ref1], [38a, zesde lid][ref2], en
      [63, negende lid, van de ZW][ref3] bedraagt:

      a. € 70, indien de aangifte van de laatste werkdag, de hersteldmelding respectievelijk de melding zich niet meer te
      laten bijstaan door een deskundige persoon of een arbodienst minder dan 7 kalenderdagen te laat is gedaan;

      b. € 230, indien de aangifte van de laatste werkdag, de hersteldmelding respectievelijk de melding zich niet
      meer te laten bijstaan door een deskundige persoon of een arbodienst 7 kalenderdagen of meer doch minder dan 28
      kalenderdagen te laat is gedaan;

      c. € 455, indien de aangifte van de laatste werkdag, de hersteldmelding respectievelijk de melding zich niet meer
      te laten bijstaan door een deskundige persoon of een arbodienst 28 kalenderdagen of meer te laat is gedaan;

      d. € 455, indien de datum van de laatste werkdag, de datum van herstel respectievelijk de datum sedert wanneer de
      werkgever zich niet meer laat bijstaan door een deskundige persoon of een arbodienst onjuist is opgegeven.

      2 De boete wegens het niet nakomen van de verplichtingen, bedoeld in [artikel 38, tweede of derde lid][ref4],
      [38a, vijfde lid][ref5], of [63, negende lid, van de ZW][ref6], bedraagt € 455.


