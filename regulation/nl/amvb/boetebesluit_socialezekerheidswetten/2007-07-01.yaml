  - number: '3'
    text: |-
      1 Indien de ernst van de gedraging, de mate waarin de belanghebbende de gedraging verweten kan worden of de
      omstandigheden waarin hij verkeert daartoe aanleiding geven, wordt de boete, die is berekend met toepassing van
      [artikel 2][ref1], verhoogd of verlaagd. Van het opleggen van een boete wordt in elk geval afgezien, indien elke
      vorm van verwijtbaarheid ontbreekt.

      2 Indien de ernst van de gedraging, de mate waarin de werkgever de gedraging verweten kan
      worden of de omstandigheden waarin de werkgever verkeert daartoe aanleiding geven, wordt de
      werkgeversboete ZW/WAO, bedoeld in de [artikelen 2a][ref2], [2b, eerste lid, onderdelen a en b][ref3],
      of [2c van dit besluit][ref4], verhoogd of verlaagd en wordt de werkgeversboete ZW/WAO, bedoeld in
      [artikel 2b, eerste lid, onderdelen c en d, en tweede lid, van dit besluit][ref5] verlaagd. Van het opleggen van
      een werkgeversboete ZW/WAO wordt in elk geval afgezien, indien elke vorm van verwijtbaarheid ontbreekt.


