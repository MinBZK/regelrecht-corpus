preamble:
  text: |-
    Op de voordracht van de Staatssecretaris van Sociale Zaken en Werkgelegenheid, J.F. Hoogervorst, gedaan mede
    namens Onze Minister van Sociale Zaken en Werkgelegenheid, van 4 juli 2000, Directie Sociale Verzekeringen, Nr.
    SV/UB/00/42726;

    Gelet op de artikelen 14a, zevende lid, van de Algemene bijstandswet, 17, zevende lid, van de Wet
    inkomensvoorziening kunstenaars, 20a, zevende lid, van de Wet inkomensvoorziening oudere en gedeeltelijk
    arbeidsongeschikte werkloze werknemers, 20a, zevende lid, van de Wet inkomensvoorziening oudere en gedeeltelijk
    arbeidsongeschikte gewezen zelfstandigen, 27a, zevende lid, van de Werkloosheidswet, 45a, zevende lid, van de
    Ziektewet, 29a, zevende lid, van de Wet op de arbeidsongeschiktheidsverzekering, 48, zevende lid van de Wet
    arbeidsongeschiktheidsverzekering zelfstandigen, 40, zevende lid, van de Wet arbeidsongeschiktheidsvoorziening
    jonggehandicapten, 14a, zevende lid, van de Toeslagenwet, 17c, zevende lid, van de Algemene Ouderdomswet, 39,
    zevende lid, van de Algemene nabestaandenwet, 17a, zevende lid, van de Algemene Kinderbijslagwet, artikel 46,
    zevende lid, van de Wet op de (re)integratie arbeidsgehandicapten;

    De Raad van State gehoord (advies van 11 augustus 2000, nr. W12.00.0269/IV);

    Gezien het nader rapport van Onze Minister van Sociale Zaken en Werkgelegenheid uitgebracht mede namens de
    Staatssecretaris van Sociale Zaken en Werkgelegenheid, J. F. Hoogervorst, van 11 oktober 2000, Directie Sociale
    Verzekeringen, Nr. SV/UB/00/64581;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0011708/2007-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. Abw: de [Algemene bijstandswet][ref1];

      b.

      c. IOAW: de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2];

      d. IOAZ: de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3];

      e. WW: de [Werkloosheidswet][ref4];

      f. ZW: de [Ziektewet][ref5];

      g. WAO: de [Wet op de arbeidsongeschiktheidsverzekering][ref6];

      h. WAZ: de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref7];

      i. WAJONG: de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref8];

      j. Wet WIA: [Wet werk en inkomen naar arbeidsvermogen][ref9];

      k. TW: de [Toeslagenwet][ref10];

      l. AOW: de [Algemene Ouderdomswet][ref11];

      m. ANW: de [Algemene nabestaandenwet][ref12];

      n. AKW: de [Algemene Kinderbijslagwet][ref13];

      o. Wet SUWI: de [Wet structuur uitvoeringsorganisatie werk en inkomen][ref14];

      p. boete: de boete, bedoeld in de [artikelen 14a, eerste lid, van de Abw][ref15],
      [20a, eerste lid, van de IOAW][ref16], [20a, eerste lid, van de IOAZ][ref17], [27a, eerste lid, van de WW][ref18],
      [45a, eerste lid, van de ZW][ref19], [29a, eerste lid, van de WAO][ref20], [48, eerste lid, van de WAZ][ref21],
      [40, eerste lid, van de WAJONG][ref22], [14a, eerste lid, van de TW][ref23], [17c, eerste lid, van de AOW][ref24],
      [39, eerste lid, van de ANW][ref25], [17a, eerste lid, van de AKW][ref26], [3:16, eerste lid, onderdeel o][ref27],
      en [3:27, eerste lid, onderdeel m, van de Wet arbeid en zorg][ref28] en [91, eerste lid, van de Wet WIA][ref29];

      q. werkgeversboete ZW/WAO: de boete, bedoeld in de [artikelen 38, vierde lid][ref30], [38a, zesde lid][ref31],
      en [63, negende lid, van de ZW][ref32] en [artikel 71a, derde en vierde lid, van de WAO][ref33] zoals dit artikel
      luidde voor 1 april 2002;

      r. inlichtingenverplichting: de verplichting, bedoeld in de [artikelen 13, eerste lid, van de IOAW][ref34],
      [13, eerste lid, van de IOAZ][ref35], [25 van de WW][ref36], [31, eerste lid][ref37], en [49 van de ZW][ref38],
      [80 van de WAO][ref39], [70 van de WAZ][ref40], [62 van de WAJONG][ref41], [12 van de TW][ref42],
      [49 van de AOW][ref43], [35 van de ANW][ref44], [15 van de AKW][ref45], [3:16, eerste lid, onderdeel g][ref46],
      en [3:27, eerste lid, onderdeel f, van de Wet arbeid en zorg][ref47], [27 van de Wet WIA][ref48], en
      [28, tweede lid][ref49], en[ 29, eerste lid, van de Wet SUWI][ref50];

      s. benadelingsbedrag:

      1° het bruto bedrag dat als gevolg van het niet of niet behoorlijk nakomen van een inlichtingenverplichting ten
      onrechte is verleend als uitkering of reïntegratie-instrument op grond van een in onderdeel r genoemde wet;

      2° de kosten van een als gevolg van het niet of niet behoorlijk nakomen van een inlichtingenverplichting ten
      onrechte opgedragen werkzaamheid op grond van [artikel 130 van de WW][ref51];

      t. werkgever: de werkgever in de zin van de [ZW][ref52];

      u. arbodienst: een arbodienst als bedoeld in de [Arbeidsomstandighedenwet][ref53];

      v. deskundige persoon: een deskundige persoon als bedoeld in
      [artikel 14, eerste lid, van de Arbeidsomstandighedenwet][ref54] die belast is met de taken, bedoeld in
      [artikel 14, eerste lid, onderdeel b, van die wet][ref55].


