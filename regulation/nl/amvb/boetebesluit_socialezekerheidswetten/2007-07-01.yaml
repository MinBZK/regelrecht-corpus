  - number: '2'
    text: |-
      1 De boete wordt vastgesteld op 10% van het benadelingsbedrag, met dien verstande dat zij op ten minste € 52 wordt
      vastgesteld.

      2 De boete wordt naar boven afgerond op een veelvoud van € 10.

      3 Indien het niet of niet behoorlijk nakomen van de inlichtingenverplichting niet heeft geleid tot een
      benadelingsbedrag en niet volstaan wordt met het geven van een schriftelijke waarschuwing, wordt de boete
      vastgesteld op € 52.
    url: https://wetten.overheid.nl/BWBR0011708/2007-07-01#Artikel2
  - number: 2a
    text: |-
      1 De verplichtingen, bedoeld in de [artikelen 38, tweede en derde lid][ref1], en [38a, vijfde lid, van de ZW][ref2]
      zijn niet behoorlijk nagekomen indien:

      a. de aangifte op de laatste werkdag of de hersteldmelding niet tijdig is gedaan, of

      b. de datum van de laatste werkdag of herstel onjuist is opgegeven.

      2 De verplichting, bedoeld in [artikel 63, negende lid, van de ZW][ref3], is niet nagekomen indien de werkgever de
      melding dat hij zich met betrekking tot de begeleiding van zijn zieke werknemers niet meer laat bijstaan door een
      deskundige persoon of een arbodienst, niet binnen 7 kalenderdagen heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel38a
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel63
    url: https://wetten.overheid.nl/BWBR0011708/2007-07-01#Artikel2a
