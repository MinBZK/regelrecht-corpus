      respectievelijk de melding zich niet meer te laten bijstaan door een bedrijfsarts, of de melding, bedoeld in
      [artikel 38a, zesde lid, van de ZW][ref1], 28 kalenderdagen of meer te laat is gedaan;


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel38a
    url: https://wetten.overheid.nl/BWBR0011708/2011-01-01#Artikel2b
