      melding, bedoeld in [artikel 38a, zesde lid, van de ZW][ref1], onjuist is opgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel38a
    url: https://wetten.overheid.nl/BWBR0011708/2011-01-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: 38a
  - number: 2b.2
    text: |-
      De bestuurlijke boete wegens het niet nakomen van de verplichtingen, bedoeld in de
      [artikelen 38, eerste lid en tweede lid, eerste zin][ref1], [38a, vijfde en zesde lid][ref2], en
      [63c van de ZW][ref3] bedraagt € 455.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel38a
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel63c
    url: https://wetten.overheid.nl/BWBR0011708/2011-01-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '38'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: 38a
      - id: ref3
        bwb_id: BWBR0001888
        artikel: 63c
  - number: 2c.1
    text: |-
      Indien de werkgever de verplichtingen, bedoeld in [artikel 71a, eerste, tweede of derde lid, van de WAO][ref1],
      zoals dat artikel luidde voor 1 april 2002, niet of niet behoorlijk nakomt ten aanzien van de werknemer of de in
      dat artikel bedoelde verzekerde wiens eerste dag van ongeschiktheid tot het verrichten van arbeid is gelegen voor
      die datum, is artikel 4 van het Besluit boete ZW/WAO werkgevers 2002, zoals dat luidde voor inwerkingtreding van
      dit besluit, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
    url: https://wetten.overheid.nl/BWBR0011708/2011-01-01#Artikel2c
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 71a
  - number: 2c.2
    text: |-
      Indien de werkgever de verplichting, bedoeld in [artikel 71a, vierde lid, van de WAO][ref1], zoals dat artikel
      luidde voor 1 april 2002, niet nakomt ten aanzien van de werknemer of de in dat artikel bedoelde verzekerde wiens
      eerste dag van ongeschiktheid tot het verrichten van arbeid is gelegen voor die datum, is artikel 5 van het Besluit
      boete ZW/WAO werkgevers 2002, zoals dat luidde voor inwerkingtreding van dit besluit, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
    url: https://wetten.overheid.nl/BWBR0011708/2011-01-01#Artikel2c
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 71a
  - number: '4.1'
    text: Het Besluit tarieven administratieve boeten Abw, Ioaw en Ioaz wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0011708/2011-01-01#Artikel4
  - number: '5.1'
    text: |-
      Het Besluit tarieven administratieve boeten Abw, Ioaw en Ioaz, het Boetebesluit Tica, het Boetebesluit AOW, het
      Boetebesluit Anw en het Boetebesluit AKW, zoals die luidden op de dag voorafgaande aan de dag van inwerkingtreding
      van dit besluit, blijven van toepassing op de niet of niet behoorlijke nakoming van de inlichtingenverplichting die
      voorafgaat aan de dag van inwerkingtreding van dit besluit.
    url: https://wetten.overheid.nl/BWBR0011708/2011-01-01#Artikel5
  - number: '5.2'
    text: |-
      Indien voor de niet of niet behoorlijke nakoming van de inlichtingenverplichting die vooraf gaat aan
      de dag van inwerkingtreding van dit besluit, op grond van dit besluit een lagere bestuurlijke boete zou
      moeten worden opgelegd dan op grond van het Besluit tarieven administratieve boeten Abw, Ioaw en Ioaz, de
      [artikelen 7 tot en met 10 van het Uitvoeringsbesluit WIK][ref1], het Boetebesluit Tica, het Boetebesluit AOW, het
      Boetebesluit Anw of het Boetebesluit AKW, wordt, in afwijking van het eerste lid, dit besluit toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0009674#Artikel7
    url: https://wetten.overheid.nl/BWBR0011708/2011-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009674
        artikel: '7'
  - number: '5.3'
    text: |-
      Het Boetebesluit socialezekerheidswetten, zoals dat luidde voor 1 juli 2007, blijft van toepassing op de niet
      of niet behoorlijke nakoming van de inlichtingenverplichting die voorafgaat aan die datum, tenzij de beschikking
      waarbij de boete wordt opgelegd wordt genomen op of na die datum en sindsdien een gunstiger boete geldt.
    url: https://wetten.overheid.nl/BWBR0011708/2011-01-01#Artikel5
  - number: '6'
    text: |-
      [Artikel 1][ref1], zoals dat luidde op de dag voorafgaand aan de dag waarop op grond van
      [artikel 2.10 van de Wet Invoering en financiering Wet werk en inkomen naar arbeidsvermogen][ref2] de
      [Wet REA][ref3] werd ingetrokken, blijft van toepassing op bestuurlijke boeten, verplichtingen, subsidies en
      voorzieningen die tot de dag dat de [Wet REA][ref4] werd ingetrokken, onderscheidenlijk zijn opgelegd, golden of
      zijn toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0011708#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0019058#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0009565
      [ref4]: https://wetten.overheid.nl/BWBR0009565
    url: https://wetten.overheid.nl/BWBR0011708/2011-01-01#Artikel6
