  - number: '7'
    text: Dit besluit treedt in werking met ingang van 1 februari 2001.
    url: https://wetten.overheid.nl/BWBR0011708/2011-01-01#Artikel7
  - number: '8'
    text: 'Dit besluit wordt aangehaald als: Boetebesluit socialezekerheidswetten.'
