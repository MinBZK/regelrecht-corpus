  - number: 1.s
    text: 'benadelingsbedrag:'
    url: https://wetten.overheid.nl/BWBR0011708/2011-01-01#Artikel1
  - number: 1.s.1
    text: |-
      het bruto bedrag dat als gevolg van het niet of niet behoorlijk nakomen van een inlichtingenverplichting ten
      onrechte is verleend als uitkering of reïntegratie-instrument op grond van een in onderdeel r genoemde wet;
    url: https://wetten.overheid.nl/BWBR0011708/2011-01-01#Artikel1
  - number: 1.s.2
    text: |-
      de kosten van een als gevolg van het niet of niet behoorlijk nakomen van een inlichtingenverplichting ten onrechte
      opgedragen werkzaamheid op grond van [artikel 130 van de WW][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel130
    url: https://wetten.overheid.nl/BWBR0011708/2011-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '130'
  - number: 1.t
    text: |-
      werkgever: de werkgever in de zin van de [ZW][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0011708/2011-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: 1.u
    text: |-
      bedrijfsarts: een bedrijfsarts als bedoeld in [artikel 14, eerste lid, van de Arbeidsomstandighedenwet][ref1] die
      belast is met de taken, bedoeld in artikel 14, eerste lid, onderdeel b, van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
    url: https://wetten.overheid.nl/BWBR0011708/2011-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '14'
  - number: '2.1'
    text: |-
      De bestuurlijke boete wordt vastgesteld op 10% van het benadelingsbedrag, met dien verstande dat zij op ten minste
      € 52 wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011708/2011-01-01#Artikel2
  - number: '2.2'
    text: De bestuurlijke boete wordt naar boven afgerond op een veelvoud van € 10.
    url: https://wetten.overheid.nl/BWBR0011708/2011-01-01#Artikel2
  - number: '2.3'
    text: |-
      Indien het niet of niet behoorlijk nakomen van de inlichtingenverplichting niet heeft geleid tot een
      benadelingsbedrag en niet volstaan wordt met het geven van een schriftelijke waarschuwing, wordt de bestuurlijke
      boete vastgesteld op € 52.
    url: https://wetten.overheid.nl/BWBR0011708/2011-01-01#Artikel2
  - number: 2a.1
    text: |-
      De verplichtingen, bedoeld in de [artikelen 38, eerste lid en tweede lid, eerste zin][ref1], en
      [38a, vijfde lid, van de ZW][ref2] zijn niet behoorlijk nagekomen indien:


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel38a
    url: https://wetten.overheid.nl/BWBR0011708/2011-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '38'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: 38a
  - number: 2a.1.a
    text: de aangifte van de ongeschiktheid tot werken of de hersteldmelding niet tijdig is gedaan, of
    url: https://wetten.overheid.nl/BWBR0011708/2011-01-01#Artikel2a
  - number: 2a.1.b
    text: de datum van de eerste dag van ongeschiktheid tot werken, van de laatste werkdag of herstel onjuist is opgegeven.
    url: https://wetten.overheid.nl/BWBR0011708/2011-01-01#Artikel2a
  - number: 2a.2
    text: |-
      De verplichting, bedoeld in [artikel 63c, van de ZW][ref1], is niet nagekomen indien de werkgever de melding dat
      hij zich met betrekking tot de begeleiding van zijn zieke werknemers niet meer laat bijstaan door een bedrijfsarts,
      niet binnen 7 kalenderdagen heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel63c
    url: https://wetten.overheid.nl/BWBR0011708/2011-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: 63c
  - number: 2a.3
    text: |-
      De verplichting, bedoeld in [artikel 38a, zesde lid, van de ZW][ref1] is niet behoorlijk nagekomen indien de
      werkgever de melding niet binnen 7 kalenderdagen heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel38a
    url: https://wetten.overheid.nl/BWBR0011708/2011-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: 38a
  - number: 2b.1
    text: |-
      De hoogte van de bestuurlijke boete, bedoeld in de [artikelen 38, derde lid][ref1], [38a, zevende lid][ref2], en
      [63c van de ZW][ref3] bedraagt:


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel38a
      [ref3]: https://wetten.overheid.nl/BWBR0001888#Artikel63c
    url: https://wetten.overheid.nl/BWBR0011708/2011-01-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '38'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: 38a
      - id: ref3
        bwb_id: BWBR0001888
        artikel: 63c
  - number: 2b.1.a
    text: |-
      € 70, indien de aangifte van de ongeschiktheid tot werken, de aangifte van de laatste werkdag, de hersteldmelding
      respectievelijk de melding zich niet meer te laten bijstaan door een bedrijfsarts, of de melding, bedoeld in
      [artikel 38a, zesde lid, van de ZW][ref1], minder dan 7 kalenderdagen te laat is gedaan;


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel38a
    url: https://wetten.overheid.nl/BWBR0011708/2011-01-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: 38a
  - number: 2b.1.b
    text: |-
      € 230, indien de aangifte van de ongeschiktheid tot werken, de aangifte van de laatste werkdag, de hersteldmelding
      respectievelijk de melding zich niet meer te laten bijstaan door een bedrijfsarts, of de melding, bedoeld in
      [artikel 38a, zesde lid, van de ZW][ref1], 7 kalenderdagen of meer doch minder dan 28 kalenderdagen te laat is
      gedaan;


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel38a
    url: https://wetten.overheid.nl/BWBR0011708/2011-01-01#Artikel2b
    references:
