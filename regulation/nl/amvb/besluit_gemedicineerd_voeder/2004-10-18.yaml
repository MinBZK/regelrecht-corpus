  - number: '3'
    text: |-
      Het is verboden halffabrikaten met medicinale werking te bereiden, voorhanden of in voorraad te hebben, te
      verpakken, te etiketteren, te vervoeren of af te leveren anders dan met inachtneming van de bij of krachtens de
      [artikelen 4][ref1], [6, tweede lid][ref2], [8, derde lid][ref3], [13][ref4], [14][ref5], [15][ref6] en [16][ref7]
      gestelde regels.


