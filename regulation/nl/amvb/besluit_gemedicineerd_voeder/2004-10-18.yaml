  - number: '4'
    text: >-
      1 Degene die halffabrikaten met medicinale werking bereidt, voorhanden of in voorraad heeft, beschikt over een
      vergunning voor het bereiden van gemedicineerd voeder als bedoeld in artikel 33 van de wet.


      2 Degene die halffabrikaten met medicinale werking bereidt, doet overeenkomstig bij ministeriële regeling gestelde
      regels, opgave aan het produktschap van de halffabrikaten met medicinale werking die door hem worden bereid.


      3 De in het tweede lid bedoelde regels hebben in elk geval betrekking op de bij de opgave te vermelden gegevens en
      de frequentie waarin de opgave geschiedt.
    url: https://wetten.overheid.nl/BWBR0006109/2004-10-18#Artikel4
  - number: '5'
    text: |-
      Het is verboden gemedicineerd voeder te bereiden, voorhanden of in voorraad te hebben, te verpakken, te
      etiketteren, te vervoeren, af te leveren, of te vervoederen anders dan overeenkomstig de bij of krachtens de
      [artikelen 6, eerste lid][ref1], [7][ref2], [8, eerste en tweede lid][ref3], [11][ref4], [12][ref5], [14][ref6],
      [15][ref7], [16][ref8] en [17][ref9] gestelde regels.


