preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van de Staatssecretaris van Landbouw, Natuurbeheer en Visserij van 26 april 1993, No. J. 936649,
    Directie Juridische en Bedrijfsorganisatorische Zaken, gedaan in overeenstemming met de Staatssecretaris van
    Welzijn, Volksgezondheid en Cultuur en na overleg met Onze Minister van Sociale Zaken en Werkgelegenheid;


    Gelet op richtlijn nr. 90/167/EEG van de Raad van de Europese Gemeenschappen van 26 maart 1990 tot vaststelling
    van de voorwaarden voor de bereiding, het in de handel brengen en het gebruik van diervoeders met medicinale
    werking (PbEG L 92) en op de artikelen 42, eerste lid, onderdelen a, b, d en f, tweede lid, en 49 van de
    Diergeneesmiddelenwet;


    Gezien het advies van het Landbouwschap, het Produktschap voor Veevoeder, het Produktschap voor Vee en Vlees, het
    Produktschap voor Pluimvee en Eieren, de Vereniging van Fabrikanten en Groothandelaren in Veterinaire Produkten
    (Fagrovet), de Vereniging van Fabrikanten en Importeurs van Diergeneesmiddelen in Nederland (Fidin) en de
    Vereniging van Nederlandse Fabrikanten van Veevoedertoevoegingen (Nefato);


    De Raad van State gehoord (advies van 28 juni 1993, nr. W11.93.0262);


    Gezien het nader rapport van Onze Minister van Landbouw, Natuurbeheer en Visserij van 20 juli 1993, No. J. 9311057,
    Directie Juridische en Bedrijfsorganisatorische Zaken, uitgebracht in overeenstemming met de Staatssecretaris van
    Welzijn, Volksgezondheid en Cultuur en na overleg met Onze Minister van Sociale Zaken en Werkgelegenheid;


    Hebben goedgevonden en verstaan:
