    text: Het Landbouwkwaliteitsbesluit Gemedicineerd Voeder wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006109/2004-10-18#Artikel21
  - number: '22'
    text: >-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0006109/2004-10-18#Artikel22
  - number: '23'
    text: 'Dit besluit kan worden aangehaald als: Besluit gemedicineerd voeder.'
    url: https://wetten.overheid.nl/BWBR0006109/2004-10-18#Artikel23
