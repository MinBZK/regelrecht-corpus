  - number: '6'
    text: >-
      1 Gemedicineerd voeder wordt slechts bereid met één voormengsel met medicinale werking of met één halffabrikaat met
      medicinale werking.


      2 Een halffabrikaat met medicinale werking wordt slechts bereid met één voormengsel met medicinale en op zodanige
      wijze dat het daarin verwerkte voormengsel met medicinale werking zijn werkzaamheid heeft behouden.
    url: https://wetten.overheid.nl/BWBR0006109/2004-10-18#Artikel6
  - number: '7'
    text: |-
      1 Gemedicineerd voeder wordt zodanig bereid, dat het daarin gebruikte diervoeder en het daarin verwerkte
      voormengsel met medicinale werking of halffabrikaat met medicinale werking met inachtneming van dienaangaande
      gestelde nadere regels zijn vermengd tot een homogeen en stabiel produkt.

      2 Gemedicineerd voeder wordt zodanig bereid dat het daarin verwerkte voormengsel met medicinale werking of
      halffabrikaat met medicinale werking zijn werkzaamheid heeft behouden en dat:

      a. ongewenste wisselwerking tussen de daarin verwerkte diergeneesmiddelen, toevoegingsmiddelen en diervoeders is
      uitgesloten,

      b. het gemedicineerde voeder gedurende het in [artikel 11, tweede lid][ref1], voorgeschreven tijdvak houdbaar is,
      en

      c. het voor de bereiding van het gemedicineerde diervoeder te gebruiken diervoeder niet dezelfde antibiotica
      of dezelfde coccidiostatica bevat als die welke in het daarvan verwerkte voormengsel met medicinale werking als
      actieve stof zijn gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0006109#Artikel11
    url: https://wetten.overheid.nl/BWBR0006109/2004-10-18#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006109
        artikel: '11'
  - number: '8'
    text: >-
      1 Degene die gemedicineerd voeder voorhanden of in voorraad heeft, bewaart dit voeder met inachtneming van
      dienaangaande gestelde nadere regels op zodanige wijze dat aan de eigenschappen en de samenstelling daarvan geen
      afbreuk wordt gedaan.


      2 De in het eerste lid bedoelde regels kunnen tevens betrekking op het voorhanden en in voorraad hebben van voeders
      op een bedrijfseenheid waar gewoonlijk bedrijfsmatig dieren worden gehouden.


      3 Degene die een halffabrikaat met medicinale werking voorhanden of in voorraad heeft, bewaart dit halffabrikaat op
      zodanige wijze dat aan de eigenschappen en de samenstelling daarvan geen afbreuk wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0006109/2004-10-18#Artikel8
  - number: '9'
    text: >-
      Het is een dierenarts verboden gemedicineerd voeder voor te schrijven:


      a. dat is bereid met een diergeneesmiddel dat niet is geregistreerd of met een voormengsel met medicinale werking
      dat niet is geregistreerd, dan wel dat één of meer diergeneesmiddelen bevat waarvan verwerking tot een zodanig
      voormengsel niet is toegestaan;


      b. anders dan met inachtneming van de bij de registratie van het daarin verwerkte dan wel te verwerken
      diergeneesmiddel gegeven voorschriften;


      c. in een hoeveelheid die groter is dan ingevolge de door hem gestelde diagnose nodig is voor de behandeling;


      d. dat als werkzame stof hetzelfde antibioticum of coccidiostaticum bevat als een toevoegingsmiddel dat is verwerkt
      in het diervoeder dat de houder van de dieren waarvoor de hulp van de dierenarts is ingeroepen, vervoedert aan
      deze dieren.
    url: https://wetten.overheid.nl/BWBR0006109/2004-10-18#Artikel9
  - number: '10'
    text: >-
      1 Het is een dierenarts verboden een recept af te geven voor de aflevering van gemedicineerd voeder:


      a. dat niet voldoet aan bij ministeriële regeling gestelde regels met betrekking tot het model van het recept en de
      daarop te vermelden gegevens;


      b. zonder voorafgaande diagnose met betrekking tot de dieren waarvoor het gemedicineerd voeder is bestemd, en


      c. voor een behandelingsduur van langer dan drie maanden.


      2 Bij ministeriële regeling worden nadere regels gesteld met betrekking tot het in het eerste lid bedoelde recept,
      welke in elk geval betrekking hebben op het aantal afschriften van het recept en de bewaring daarvan alsmede op de
      geldigheidsduur van het recept.
    url: https://wetten.overheid.nl/BWBR0006109/2004-10-18#Artikel10
  - number: '11'
    text: >-
      1 Aan de houder van dieren waarvan de voortbrengselen bestemd zijn voor menselijke consumptie, wordt geen
      gemedicineerd voeder afgeleverd in een grotere hoeveelheid dan is voorgeschreven in het recept dat voor de
      behandeling van de betrokken dieren is afgegeven.


      2 Onverminderd het eerste lid wordt geen grotere hoeveelheid gemedicineerd voeder afgeleverd dan de voor één maand
      voor de in het recept aangewezen dieren benodigde hoeveelheid.
    url: https://wetten.overheid.nl/BWBR0006109/2004-10-18#Artikel11
  - number: '12'
    text: >-
      Bij het afleveren van gemedicineerd voeder:


      a. komen op, aan of bij de verpakking dan wel, indien los gestort, op het bij de desbetreffende partij behorend
      begeleidend document, de aanduidingen of vermeldingen voor, die bij de registratie van het zich daarin bevindende
      diergeneesmiddel of voormengsel met medicinale werking ingevolge de wet zijn voorgeschreven, alsmede de woorden
      "gemedicineerd voeder";


      b. zijn voorts alle andere aanduidingen of vermeldingen aangebracht, onderscheidenlijk bijgevoegd, welke ingevolge
      dienaangaande gestelde regels zijn voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0006109/2004-10-18#Artikel12
  - number: '13'
    text: >-
      Bij het afleveren van een halffabrikaat met medicinale werking komen op, aan of bij de verpakking dan wel, indien
      los gestort, op het bij de desbetreffende partij behorende begeleidend document, de aanduidingen of vermeldingen
      voor, die bij de registratie van het zich daarin bevindende voormengsel met medicinale werking ingevolge de wet
      zijn voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0006109/2004-10-18#Artikel13
  - number: '14'
    text: >-
      Indien een halffabrikaat met medicinale werking of gemedicineerd voeder wordt verpakt, in verpakking in voorraad
      of voorhanden wordt gehouden, wordt vervoerd of afgeleverd, is de verpakking van dat halffabrikaat met medicinale
      werking of gemedicineerd voeder:


      a. van een zodanige aard en kwaliteit dat zij tegen elke normale behandeling bestand is, dat niets van de inhoud
      kan ontsnappen en dat samenstelling en zuiverheid van het zich daarin bevindende halffabrikaat of gemedicineerd
      voeder gedurende de houdbaarheidstermijn onder de voorgeschreven of aanbevolen bewaaromstandigheden gewaarborgd
      blijven;


      b. zodanig gesloten dat de sluiting of de verzegeling bij het openen wordt verbroken en de verpakking niet opnieuw
      kan worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0006109/2004-10-18#Artikel14
  - number: '15'
    text: >-
      1 Alle ingevolge dit besluit voorgeschreven aanduidingen of vermeldingen worden gesteld in de Nederlandse taal of,
      ingeval het halffabrikaat met medicinale werking of gemedicineerd voeder bestemd is voor uitvoer, in de taal van
      het land van bestemming, in goed leesbaar en onuitwisbaar schrift.


      2 Andere dan de bij of krachtens dit besluit voorgeschreven aanduidingen of vermeldingen komen op, aan of bij
      de verpakking of op het bij de desbetreffende partij behorend begeleidend document slechts voor, voor zover zij
      niet met de voorgeschreven aanduidingen of vermeldingen in strijd zijn en voor zover zij niet misleidend zijn ten
      aanzien van aard, samenstelling, eigenschappen en toepassingswijze van het halffabrikaat of gemedicineerd voeder.
    url: https://wetten.overheid.nl/BWBR0006109/2004-10-18#Artikel15
  - number: '16'
    text: >-
      Vervoer van een halffabrikaat met medicinale werking of gemedicineerd voeder in bulk, geschiedt in zodanige
      gereinigde transportmiddelen of containers dat ongewenste wisselwerking met of besmetting van een later daarmee te
      vervoeren halffabrikaat met medicinale werking of gemedicineerd voeder wordt vermeden.
    url: https://wetten.overheid.nl/BWBR0006109/2004-10-18#Artikel16
  - number: '17'
    text: |-
      Gemedicineerd voeder wordt door degene die bedrijfsmatig dieren houdt slechts aan de dieren vervoederd, indien hij
      in het bezit is van een bewijsstuk waaruit blijkt dat het gemedicineerd voeder afkomstig is van een houder van een
      in artikel 33 van de wet bedoelde vergunning, dan wel van een in [artikel 18, eerste lid, onderdeel ][ref1], van
      dit besluit bedoelde verklaring of een afschrift daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0006109#Artikel18
    url: https://wetten.overheid.nl/BWBR0006109/2004-10-18#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006109
        artikel: '18'
  - number: '18'
    text: >-
      Het is toegestaan een gemedicineerd voeder, waarin een niet in Nederland geregistreerd voormengsel met medicinale
      werking is verwerkt, uit één der Lid-Staten van de Europese Gemeenschappen of uit een staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte (*Trb.* 1992, 132) in te voeren en dit voeder voorhanden of
      in voorraad te hebben, indien:


      a. het in dat gemedicineerd voeder verwerkte voormengsel met medicinale werking dezelfde werkzame stoffen bevat als
      een in Nederland geregistreerd voormengsel met medicinale werking en een soortgelijke kwalitatieve en kwantitatieve
      samenstelling bezit als dat voormengsel;


      b. het gemedicineerde voeder in een in de aanhef van dit artikel bedoelde staat is bereid overeenkomstig de
      voorschriften van [richtlijn nr. 90/167/EEG](31990L0167), en


      c. de zending vergezeld gaat van een volledig en naar waarheid ingevulde verklaring als bedoeld in artikel 10,
      derde lid, van [richtlijn nr. 90/167/EEG](31990L0167).
    url: https://wetten.overheid.nl/BWBR0006109/2004-10-18#Artikel18
  - number: '19'
    text: |-
      Het is verboden gemedicineerd voeder uit te voeren naar andere dan de in [artikel 18, eerste lid][ref1], bedoelde
      landen indien de etikettering van het betrokken gemedicineerd voeder niet voldoet aan dienaangaande gestelde
      regels.


      [ref1]: https://wetten.overheid.nl/BWBR0006109#Artikel18
    url: https://wetten.overheid.nl/BWBR0006109/2004-10-18#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006109
        artikel: '18'
  - number: '20'
    text: |-
      Het bestuur van het produktschap stelt bij verordening regels onderscheidenlijk nadere regels als bedoeld in de
      [artikelen 7, eerste lid][ref1], [8, eerste lid][ref2], [12, onderdeel ][ref3], en [19][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0006109#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006109#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0006109#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0006109#Artikel19
    url: https://wetten.overheid.nl/BWBR0006109/2004-10-18#Artikel20
