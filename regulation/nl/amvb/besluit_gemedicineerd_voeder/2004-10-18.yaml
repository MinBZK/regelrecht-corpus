articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. wet: [Diergeneesmiddelenwet][ref1];

      b. [richtlijn nr. 90/167/EEG](31990L0167): [richtlijn nr. 90/167/EEG](31990L0167) van de Raad van de Europese
      Gemeenschappen van 26 maart 1990, tot vaststelling van de voorwaarden voor de bereiding, het in de handel brengen
      en het gebruik van diervoeders met medicinale werking (*PbEG* L 92);

      c. produktschap: Produktschap voor Veevoeder;

      d. toevoegingsmiddel: stof of preparaat niet zijnde een voormengsel met medicinale werking, dat stoffen bevat, die
      wanneer zij worden verwerkt in diervoeders, invloed kunnen uitoefenen op de eigenschappen van de diervoeders of op
      de dierlijke produktie;

      e. voormengsel met medicinale werking: mengsel van één of meer diergeneesmiddelen al dan niet toevoegingsmiddelen,
      met stoffen die dragers vormen, bestemd om te worden verwerkt bij de bereiding van gemedicineerd voeder, welk
      mengsel als zodanig is geregistreerd, dan wel uitsluitend diergeneesmiddelen bevat waarvan bij de registratie
      verwerking tot een zodanig voormengsel is toegestaan en de bereiding daarvan is geschied overeenkomstig de bij die
      registratie gegeven voorschriften;

      f. halffabrikaat met medicinale werking: voormengsel met medicinale werking met één of meer veevoedergrondstoffen,
      dat als zodanig is bestemd voor rechtstreekse verwerking in diervoeder.

      2 Een wijziging van één of meer onderdelen van [richtlijn nr. 90/167/EEG](31990L0167) treedt voor de toepassing van
      de artikelen in dit besluit waarin naar die onderdelen wordt verwezen, in werking met ingang van de dag waarop aan
      de betrokken wijzigingsrichtlijn uiterlijk uitvoering moet zijn gegeven.

      3 Onze Minister doet mededeling in de *Staatscourant* van een wijziging als bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003818
