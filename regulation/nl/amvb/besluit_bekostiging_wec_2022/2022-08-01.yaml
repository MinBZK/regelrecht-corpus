  - number: '6'
    text: |-
      1 Voor de toepassing van [de wet][ref1] en dit besluit worden de leerlingen meegeteld die:

      a. op de teldatum als werkelijk schoolgaand op de school staan ingeschreven, of

      b. op de teldatum op grond van [artikel 12 van het Onderwijskundig besluit WEC][ref2] tijdelijk buiten de school
      waar zij staan ingeschreven zijn geplaatst.

      2 Onze Minister neemt voor het bepalen van het aantal leerlingen op de teldatum de leerlingen
      in aanmerking van wie het persoonsgebonden nummer tezamen met de basisgegevens, bedoeld in
      [artikel 8, eerste lid, onderdeel b, van de Wet register onderwijsdeelnemers][ref3] binnen
      vier weken na die dag zijn opgenomen in het register onderwijsdeelnemers overeenkomstig
      [artikel 14 van de Wet register onderwijsdeelnemers][ref4].

      3 De termijn van vier weken, bedoeld in het tweede lid, kan bij ministeriële regeling verlengd worden.

      4 Een leerling kan op de teldatum slechts op één school voor de bekostiging meetellen.


      [ref1]: https://wetten.overheid.nl/BWBR0003549
