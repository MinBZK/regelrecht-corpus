    text: |-
      1 Schattingen welke ingevolge dit hoofdstuk dienen plaats te vinden, geschieden door een commissie van drie
      deskundigen van wie er een wordt benoemd door de Onderwijsraad, een door het college van burgemeester en wethouders
      en een door het bevoegd gezag.

      2 De commissie beslist bij meerderheid van stemmen. Indien geen meerderheid wordt verkregen, wordt de waarde
      bepaald op het gemiddelde van de drie schattingsopgaven.

      3 Een afschrift van de beslissing wordt aan het gemeentebestuur en het bevoegd gezag verstrekt.

      4 De kosten van de schattingen komen ten laste van de gemeente.
    url: https://wetten.overheid.nl/BWBR0046160/2022-08-01#Artikel21
  - number: '22'
    text: |-
      De vergoedingen, bedoeld in de paragrafen 2 en 3 van dit hoofdstuk, zijn niet langer verschuldigd wanneer de
      gemeente de eigendom van het terrein en gebouw verkrijgt of wanneer het terrein en gebouw niet meer voor het
      speciaal onderwijs of het voortgezet speciaal onderwijs, bedoeld in [artikel 2 van de wet][ref1], wordt gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
