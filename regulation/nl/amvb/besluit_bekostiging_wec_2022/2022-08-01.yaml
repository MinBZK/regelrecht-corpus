    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister voor Basis- en Voortgezet Onderwijs en Media, van 30 september 2021,
    nr. WJZ/29119624 (12546), directie Wetgeving en Juridische Zaken;

    Gelet op de artikelen 14c, elfde lid, 14f, tiende lid, 18, derde lid, 45, vijfde lid, 70, derde lid, 88,
    eerste lid, 113, zesde lid, 114, vierde lid, 115, tweede lid, 116, zesde lid, 145, vijfde lid, en 171, tweede
    lid, van de Wet op de expertisecentra, artikel 7.1.1.2, eerste lid, onderdeel a, van de Jeugdwet, artikel 11,
    eerste lid, onderdeel f, van de Wet op de omzetbelasting 1968 en artikel 73, vijfde lid, van de Wet structuur
    uitvoeringsorganisatie werk en inkomen;

    De Afdeling advisering van de Raad van State gehoord (advies van 3 november 2021, nr. W05.21.0295/I);

    Gezien het nader rapport van Onze Minister voor Basis- en Voortgezet Onderwijs en Media van 7 december 2021,
    nr. WJZ/30170096 (12546), directie Wetgeving en Juridische Zaken;

    Hebben goedgevonden en verstaan:
