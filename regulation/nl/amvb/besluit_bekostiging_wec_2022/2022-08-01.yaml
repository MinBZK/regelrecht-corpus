  - number: '16'
    text: |-
      1 De aanspraak op extra bekostiging voor installatieonderhoud en elektriciteitsverbruik van een brancardlift
      ontstaat met ingang van de maand na de melding aan Onze Minister van de ingebruikneming daarvan en eindigt met
      ingang van de maand volgend op de maand waarin de brancardlift buiten gebruik wordt gesteld.

      2 Bij de melding, bedoeld in het eerste lid, wordt een bewijsstuk van de kenmerken van de lift verstrekt.

      3 Binnen acht weken na de buitengebruikstelling, bedoeld in het eerste lid, wordt dit aan Onze Minister gemeld.

      4 De extra bekostiging bestaat uit een bedrag per brancardlift. Het bedrag wordt bij ministeriële regeling
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0046160/2022-08-01#Artikel16
  - number: '17'
    text: |-
      Er is sprake van een samenvoeging als bedoeld in [artikel 115, eerste lid, van de wet][ref1] indien:

      a. de institutionele fusie, bedoeld in [artikel 66a van de wet][ref2], die heeft geleid tot de samenvoeging binnen
      vier weken na de fusiedatum van 1 augustus door het bevoegd gezag bij onze Minister is gemeld;

      b. alle scholen die onderdeel uitmaken van de fusie op het moment van deze fusie meer dan acht schooljaren
      bekostigd worden; en

      c. minimaal 25% van de leerlingen die op 1 februari direct voorafgaande aan de fusie als bekostigde leerling
      stonden ingeschreven op een bij de fusie opgeheven school voor speciaal onderwijs, school voor voortgezet
      speciaal onderwijs of het speciaal onderwijs dan wel voortgezet speciaal onderwijs aan een school voor speciaal
      en voortgezet speciaal onderwijs en die op 1 augustus direct volgend op de opheffing als bekostigde leerling
      ingeschreven staan aan dezelfde soort onderwijs, zijn doorgestroomd naar de fusieschool en staan daar op de
      fusiedatum als bekostigde leerling ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel115
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel66a
