  - number: '28'
    text: |-
      1 Indien het bevoegd gezag, bedoeld in [artikel 27][ref1], eigenaar is van het gebouw en terrein, en het
      gebouw en terrein niet meer voor het speciaal onderwijs, het voortgezet speciaal onderwijs of het speciaal
      en voortgezet speciaal onderwijs als bedoeld in [artikel 2 van de wet][ref2] worden gebruikt, dan wel het
      gebouw en terrein na 1 september 1987 zijn of worden vervreemd, betaalt het bevoegd gezag voor elk jaar dat
      de gemeente met betrekking tot het gebouw en terrein een vergoeding heeft verstrekt, doch voor ten hoogste
      40 jaren, aan de gemeente 1/40 deel van de waarde van het gebouw en terrein in het economisch verkeer,
      met dien verstande dat het college van burgemeester en wethouders kan besluiten in verband met eigen
      investeringen van het bevoegd gezag een lagere waarde vast te stellen. Indien toepassing is gegeven aan
      __REF002___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      ____________________________________ (Stb. 1998, 228), wordt de gemeente geacht gedurende 40 jaren een vergoeding
      met betrekking tot het gebouw en terrein te hebben verstrekt.

      2 In afwijking van het eerste lid, kan het bevoegd gezag de eigendom van het gebouw overdragen aan de gemeente.


