  - number: '27'
    text: |-
      1 Voor de gebouwen en terreinen waarvoor voor 1 januari 1989 vergoeding werd genoten op grond van artikel 184
      van het Besluit buitengewoon onderwijs 1967, betaalt de gemeente jaarlijks aan het bevoegd gezag een vergoeding
      gelijk aan het bedrag dat voor huur van de gebouwen en terreinen, met inbegrip van de inrichting, het meubilair
      en het onderwijsleerpakket, redelijk is te achten, verminderd met de kosten van instandhouding van het gebouw. De
      vergoeding bedraagt niet meer dan het bedrag dat een redelijke vergoeding oplevert voor een overeenkomstige school,
      bestemd voor hetzelfde aantal leerlingen, die in normale omstandigheden verkeert. De vergoeding wordt in overleg
      tussen burgemeester en wethouders en het bevoegd gezag vastgesteld. Indien voor gebouw en terrein, met inbegrip van
      de inrichting, het meubilair en het onderwijsleerpakket, een vergoeding uit de openbare kassen is of wordt genoten,
      wordt de vergoeding dienovereenkomstig verminderd.

      2 Aan het bevoegd gezag van een school, niet zijnde een instelling, waarvoor de in het eerste lid bedoelde
      vergoeding wordt betaald, verstrekt het Rijk jaarlijks een bedrag ter bestrijding van de kosten van de school
      waarvoor de in het eerste lid bedoelde vergoeding niet is bestemd. De [artikelen 12][ref1], [15][ref2] en
      [16][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0046160#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0046160#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0046160#Artikel16
