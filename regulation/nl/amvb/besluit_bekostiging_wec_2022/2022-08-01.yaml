        artikel: '2'
  - number: '23'
    text: |-
      1 Voor de terreinen en gebouwen die eigendom zijn van het bevoegd gezag van een bijzondere school en op 1 januari
      1921 in gebruik of in aanbouw waren, betaalt de gemeente jaarlijks aan het desbetreffende bevoegd gezag een
      vergoeding, berekend over de waarde van de terreinen, gebouwen en het meubilair zoals deze ingevolge de Lager-
      onderwijswet 1920 is geschat.

      2 In afwijking van het eerste lid wordt voor gebouwen die niet uitsluitend zijn bestemd voor speciaal
      onderwijs, voortgezet speciaal onderwijs of speciaal en voortgezet speciaal onderwijs als bedoeld in
      [artikel 2 van de wet][ref1], de vergoeding berekend over 80% van het voor het desbetreffende gebouw ingevolge de
      Lager-onderwijswet 1920 geschatte bedrag.

      3 De vergoeding, bedoeld in het tweede lid, wordt op gelijke wijze uitbetaald aan een bevoegd gezag dat na
      1 januari 1921 de eigendom van terreinen en gebouwen van een bijzondere school die op 1 januari 1921 in gebruik of
      in aanbouw waren, heeft verkregen of verkrijgt.

      4 Voor de toepassing van dit artikel worden onder gebouwen in aanbouw verstaan de gebouwen van een bijzondere
      school waarvan de ontwerpen voor 1 januari 1921 overeenkomstig artikel 1 van het koninklijk besluit van 25 juni
      1912 (Stb. 193) bij het rijksschooltoezicht werden ingediend en die voor 1 juli 1923 zijn voltooid.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0046160/2022-08-01#Artikel23
