  - number: '26'
    text: |-
      1 Wanneer de gebouwen en terreinen, bedoeld in [artikel 23][ref1], anders dan ingevolge
      [artikel 58 van de wet][ref2] worden vervreemd, of zodra voor die gebouwen en terreinen overeenkomstig
      [artikel 108 van de wet][ref3] is vastgesteld dat zij blijvend niet meer voor het onderwijs aan de school worden
      gebruikt, betaalt het bevoegd gezag van een bijzondere school aan de gemeente terug het bedrag dat de gemeente
      aan uitbreiding, verbouwing of vernieuwing van het gebouw en terrein op grond van de bepalingen van de Lager-
      onderwijswet 1920 of de Overgangswet ISOVSO zoals luidend op 31 december 1996 heeft uitgegeven, verminderd,
      behoudens voor zover het betreft door de gemeente bekostigde grond, met 2% voor wat betreft de uitbreiding en met
      5% voor wat betreft de verbouwing of de vernieuwing, voor elk vol jaar dat is verstreken vanaf het tijdstip waarop
      de uitgaven zijn gedaan. De terugbetaling kan in termijnen plaatsvinden.

      2 Het bevoegd gezag van een bijzondere school betaalt aan de gemeente terug het bedrag dat de gemeente aan
      uitbreiding, algehele aanpassing, partiële aanpassing, ingrijpend onderhoud of energiebesparende maatregelen op
      grond van de bepalingen van de Interimwet op het speciaal onderwijs en het voortgezet speciaal onderwijs zoals
      die luidde op 31 december 1996 heeft uitgegeven, verminderd, behoudens voor zover het betreft door de gemeente
      bekostigde grond, met de ten behoeve van een voorziening als de onderhavige voor de desbetreffende school door het
      Rijk aan de gemeente verstrekte vergoedingen. De terugbetaling kan in termijnen plaatsvinden.

      3 Het bevoegd gezag van een bijzondere school betaalt aan de gemeente het
      bedrag terug dat de gemeente heeft uitgegeven aan de voorzieningen, bedoeld in
      [artikel 90, eerste lid, onderdelen a, onder 2°, en b, van de wet][ref4], verminderd met de uit de
      gemeentebegroting blijkende afschrijving op het moment van de in het eerste lid bedoelde vaststelling van de
      buitengebruikstelling, behoudens voor zover het betreft door de gemeente bekostigde grond, voor elk vol jaar dat is
      verstreken sedert het tijdstip waarop de uitgaven plaats hadden. De terugbetaling kan in termijnen plaatsvinden.

      4 Binnen vier weken na de vervreemding of nadat de buitengebruikstelling overeenkomstig
      [artikel 108 van de wet][ref5] is vastgesteld, draagt het bevoegd gezag van een bijzondere school de roerende
      zaken, behoudens die welke het bevoegd gezag uit eigen middelen heeft aangeschaft, aan de gemeente in eigendom
      over.

      5 Indien het bevoegd gezag in de onmogelijkheid verkeert het gebouw en terrein tegen een zodanige prijs te verkopen
      of op andere wijze daaruit zodanige inkomsten te verwerven, dat uit de opbrengst het verschuldigde bedrag kan
      worden terugbetaald, kan het bevoegd gezag aan zijn verplichtingen voldoen door overdracht van het gebouw en
      terrein aan de gemeente, dan wel door betaling aan de gemeente van een door gedeputeerde staten vast te stellen
      vergoeding.


