  - number: '14'
    text: |-
      1 Voor een school met leerlingen met een niet-Nederlandse culturele achtergrond op de teldatum wordt voor de
      bestrijding van onderwijsachterstanden extra bekostiging toegekend.

      2 De extra bekostiging bestaat uit een bedrag per leerling met een niet-Nederlandse culturele achtergrond dat bij
      ministeriële regeling wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0046160/2022-08-01#Artikel14
  - number: '15'
    text: |-
      1 Een school voor onderwijs als bedoeld in [artikel 2, tweede lid, onderdelen f, j of n, van de wet][ref1] kan
      aanspraak maken op extra bekostiging voor een schoolbad.

      2 De aanspraak op extra bekostiging voor de uitgaven voor een schoolbad ontstaat met ingang van de maand na de
      melding aan Onze Minister van de ingebruikneming daarvan.

      3 Bij de melding, bedoeld in het tweede lid, worden de volgende gegevens verstrekt:

      a. gegevens over het soort bad;

      b. de afmetingen van het bad in m3 maximale waterinhoud;

      c. gegevens over het type bodem;

      d. een bewijsstuk van de kenmerken van het bad.

      4 Wijzigingen van de gegevens, bedoeld in het derde lid worden binnen acht weken doorgegeven aan Onze Minister.

      5 De extra bekostiging bestaat uit een bedrag per bad en een bedrag per m3 waterinhoud. Bij een beweegbare bodem
      wordt de extra bekostiging verhoogd met een bedrag voor de beweegbare bodem.

      6 De bedragen voor een schoolbad worden bij ministeriële regeling vastgesteld.

      7 Onze Minister stelt binnen acht weken na de melding van ingebruikneming, bedoeld in het eerste lid, de
      bekostiging voor dat jaar vast.

      8 De aanspraak op de extra bekostiging eindigt met ingang van de maand volgend op de maand waarin het schoolbad
      buiten gebruik wordt gesteld.

      9 De buitengebruikstelling, bedoeld in het achtste lid, wordt binnen acht weken aan Onze Minister gemeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0046160/2022-08-01#Artikel15
