  - number: '13'
    text: |-
      1 Onze Minister stelt jaarlijks uiterlijk op 1 januari de bekostiging, bedoeld in de
      [artikelen 114, tweede en vierde lid][ref1], en [119 van de wet][ref2] vast voor zover deze mede gebaseerd is op
      het aantal leerlingen op de teldatum.

      2 Onze Minister kan de bekostiging, bedoeld in het eerste lid, wijzigen vanwege loonontwikkelingen of andere al dan
      niet uit de rijksbegroting voortvloeiende maatregelen.

      3 Het bedrag per school, bedoeld in [artikel 114, tweede lid, van de wet][ref3] bedraagt voor scholen voor speciaal
      onderwijs met op de teldatum minder dan 50 leerlingen respectievelijk 50 leerlingen of meer een bij ministeriële
      regeling vast te stellen bedrag.

      4 Het bedrag per school, bedoeld in [artikel 114, tweede lid, van de wet][ref4] bedraagt voor scholen voor
      voortgezet speciaal onderwijs met op de teldatum minder dan 50 leerlingen respectievelijk 50 leerlingen of meer een
      bij ministeriële regeling vast te stellen bedrag.

      5 Voor een school voor speciaal en voortgezet speciaal onderwijs zijn zowel het derde als het vierde lid van
      toepassing, voor zover de school onderwijs verzorgt aan leerlingen op zowel het deel van de school voor speciaal
      onderwijs als op de afdeling voor voortgezet speciaal onderwijs.

      6 Een school die geen leerlingen heeft, komt niet voor bekostiging in aanmerking.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel114
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel119
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel114
