  - number: '20'
    text: |-
      1 Onverminderd de bevoegdheid van de Inspectie van het onderwijs op grond van de
      [Wet op het onderwijstoezicht][ref1] kan Onze Minister een onderzoek instellen of doen instellen naar de
      jaarverslaggeving, naar de gegevens die noodzakelijk zijn voor de vaststelling van de bekostiging, naar de
      rechtmatigheid van de bestedingen en naar de doelmatigheid van het beheer van de school.

      2 Onze Minister kan correcties aanbrengen op de bekostiging, indien uit het onderzoek, bedoeld in het eerste lid,
      blijkt dat de bekostiging voor een school onjuist is vastgesteld.

      3 Onze Minister doet het bevoegd gezag schriftelijk mededeling van een besluit tot het aanbrengen van een correctie
      op de bekostiging.

      4 Indien uit de jaarverslaggeving, bedoeld in [artikel 141, eerste lid, van de wet][ref2], uit de verklaring van
      de accountant, bedoeld in [artikel 141, vierde lid, van de wet][ref3] of uit een onderzoek als bedoeld in het
      eerste lid blijkt dat de bekostiging voor een school onrechtmatig is besteed of ondoelmatig is aangewend, kan Onze
      Minister bepalen dat de daarmee gemoeide bedragen in mindering worden gebracht op de bekostiging, onverminderd
      [artikel 4:49 van de Algemene wet bestuursrecht][ref4].

      5 De correctie, bedoeld in het tweede lid, wordt, indien de correctie strekt tot verhoging van de bekostiging,
      binnen acht weken na de mededeling, bedoeld het derde lid, door Onze Minister betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0013800
