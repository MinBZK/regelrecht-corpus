articles:
  - number: '1'
    text: |-
      In dit besluit wordt, in alfabetische volgorde, verstaan onder:

        - *accountant:* accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1];
        - *bevoegd gezag:* bevoegd gezag als bedoeld in [artikel 1 van de wet][ref2];
        - *bijzondere school:* bijzondere school als bedoeld in [artikel 1 van de wet][ref3];
        - *brancardlift:* lift binnen een school, geschikt voor het vervoer van personen naar een andere etage door middel
      van een brancard;
        - *centrale dienst:* centrale dienst als bedoeld in [artikel 1 van de wet][ref4];
        - *commissie:* de commissie, bedoeld in [artikel 41, tweede lid, van de wet][ref5];
        - *extra bekostiging:* bekostiging als bedoeld in [artikel 114, vierde lid, van de wet][ref6];
        - *instelling:* instelling als bedoeld in [artikel 1 van de wet][ref7];
        - *leerling:* tenzij anders is bepaald een leerling: a. die door een samenwerkingsverband als bedoeld in
      [artikel 1 van de Wet op het primair onderwijs][ref8] of [artikel 1.1 van de Wet voortgezet onderwijs 2020][ref9]
      toelaatbaar is verklaard tot het speciaal onderwijs respectievelijk het voortgezet speciaal onderwijs, b. van een
      inrichting, accommodatie of residentiële instelling als bedoeld in [artikel 71c van de wet][ref10] waarmee het
      bevoegd gezag een overeenkomst als bedoeld in genoemd artikel van [de wet][ref11] heeft gesloten;
        - *leerling met een niet-Nederlandse culturele achtergrond:* leerling: a. die behoort tot de Molukse
      bevolkingsgroep; b. van wie ten minste een van de ouders of voogden afkomstig is uit Griekenland, Italië,
      het voormalige Joegoslavië, Kaapverdië, Marokko, Portugal, Spanje, Tunesië of Turkije; c. van wie ten minste
      een van de ouders of voogden afkomstig is uit Suriname of een van de Caribische delen van het Koninkrijk;
      d. van wie ten minste een van de ouders of voogden als vreemdeling rechtmatig verblijf heeft als bedoeld in
      [artikel 8, onder c of d, van de Vreemdelingenwet 2000][ref12]; e. van wie ten minste een van de ouders of voogden
      afkomstig is uit een ander niet-Engelstalig land buiten Europa, echter met uitzondering van Indonesië.
        - *nevenvestiging:* nevenvestiging als bedoeld in [artikel 76a][ref13] of [76b van de wet][ref14];
        - *Onze Minister:* Onze Minister voor Basis- en Voortgezet Onderwijs en Media;
        - *openbare school:* openbare school als bedoel in [artikel 1 van de wet][ref15];
        - *ouders:* ouders, voogden en verzorgers;
        - *school:* school als bedoeld in [artikel 1 van de wet][ref16];
        - *schoolbad:* bad voor watergewenning of hydrotherapie in gebruik bij en door een of meer scholen;
        - *schooljaar:* tijdvak van 1 augustus tot en met 31 juli daaropvolgend;
        - *teldatum:* de datum, bedoeld in [artikel 116 van de wet][ref17];
        - *wet:* [Wet op de expertisecentra][ref18].


