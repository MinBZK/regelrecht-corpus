  - number: '11'
    text: |-
      1 De gegevens, bedoeld in [artikel 10][ref1], worden in ieder geval gedurende vijf jaar nadat de desbetreffende
      leerling van de school is uitgeschreven in de leerlingenadministratie bewaard.

      2 De gegevens, bedoeld in [artikel 10, onderdelen b, c en d][ref2], worden binnen acht weken na het verstrijken van
      de termijn, bedoeld in het eerste lid, vernietigd.


      [ref1]: https://wetten.overheid.nl/BWBR0046160#Artikel10
