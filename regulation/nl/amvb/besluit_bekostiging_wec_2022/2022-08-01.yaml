  - number: '29'
    text: |-
      1 Onze Minister verstrekt per boekjaar subsidie aan de rechtspersoon, bedoeld in
      [artikel 171, eerste lid, van de wet][ref1], voor het geven van godsdienstonderwijs of levensbeschouwelijk
      vormingsonderwijs.

      2 Bij ministeriële regeling worden regels gesteld over de verstrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel171
    url: https://wetten.overheid.nl/BWBR0046160/2022-08-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '171'
  - number: '30'
    text: |-
      1 Het subsidiebedrag dat wordt verstrekt aan de rechtspersoon, bedoeld in
      [artikel 171, eerste lid, van de wet][ref1], bestaat uit een bedrag dat is bestemd voor personeelskosten voor de
      leraren die het godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs verzorgen en een bedrag dat is bestemd
      voor overige kosten.

      2 Het bedrag dat is bestemd voor personeelskosten kan met maximaal 2% per jaar stijgen ten opzichte van het meest
      recent vastgestelde subsidiebedrag dat is bestemd voor personeelskosten.

      3 Het tweede lid vervalt met ingang van 31 december 2025.

      4 Voor het berekenen van de hoogte van het subsidiebedrag wordt uitgegaan van ten hoogste veertig uren per
      schooljaar door leerlingen te ontvangen godsdienstonderwijs of levensbeschouwelijk vormingsonderwijs.

      5 Bij het besluit tot verlening van de subsidie verleent Onze Minister voorschotten. Onze Minister stelt bij
      beschikking het betaalritme vast.

      6 Het bedrag dat ten hoogste wordt verstrekt aan de rechtspersoon, bedoeld in
      [artikel 171, eerste lid, van de wet][ref2], is het bedrag dat op de begroting van het Ministerie van
      Onderwijs, Cultuur en Wetenschap beschikbaar is voor het geven van godsdienstonderwijs of levensbeschouwelijk
      vormingsonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel171
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel171
    url: https://wetten.overheid.nl/BWBR0046160/2022-08-01#Artikel30
