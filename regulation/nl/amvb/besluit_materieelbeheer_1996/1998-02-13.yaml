---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.5.2/schema.json
$id: besluit_materieelbeheer_1996
regulatory_layer: AMVB
publication_date: '2002-08-20'
valid_from: '1998-02-13'
bwb_id: BWBR0007803
url: https://wetten.overheid.nl/BWBR0007803/1998-02-13
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Financiën van 18 september 1995, nr. B95-186U, Directoraat-Generaal van de
    Rijksbegroting, Directie Begrotingszaken, en de Centrale Directie Wetgeving, Juridische en Bestuurlijke Zaken;

    Gelet op artikel 32, aanhef en onder d, van de Comptabiliteitswet;

    Gezien het advies van de Algemene Rekenkamer van 12 juni 1995, nr. 625R;

    De Raad van State gehoord (advies van 1 december 1995, nr. W06.95.0504);

    Gezien het nader rapport van Onze Minister van Financiën van 20 december 1995, nr. B95-425U, Directoraat-Generaal
    van de Rijksbegroting, Directie Begrotingszaken, en de Centrale Directie Wetgeving, Juridische en Bestuurlijke
    Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0007803/1998-02-13#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007803/1998-02-13#Artikel1
  - number: 1.1.a
    text: |-
      niet-geldelijke zaken: zaken, niet zijnde geld of geldswaardige papieren, die benodigd zijn voor het functioneren
      van de rijksdienst, dan wel die door het Rijk in bewaring zijn genomen.
    url: https://wetten.overheid.nl/BWBR0007803/1998-02-13#Artikel1
  - number: 1.1.b
    text: |-
      materieelbeheer: de zorg voor niet-geldelijke zaken vanaf het moment van ontvangst tot aan het moment van
      afstoting.
    url: https://wetten.overheid.nl/BWBR0007803/1998-02-13#Artikel1
  - number: 1.1.c
    text: |-
      centrale-voorraadbeheerder: een aangewezen persoon als bedoeld in
      [artikel 19, vierde lid, van de Comptabiliteitswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel19
    url: https://wetten.overheid.nl/BWBR0007803/1998-02-13#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '19'
  - number: 1.1.d
    text: 'centrale voorraad: een voorraad roerende niet-geldelijke zaken beheerd door een centrale-voorraadbeheerder.'
    url: https://wetten.overheid.nl/BWBR0007803/1998-02-13#Artikel1
  - number: 1.1.e
    text: |-
      risicobeheer: de zorg voor het beperken van de risico's van schade voor het Rijk en van aansprakelijkheidsstelling
      van het Rijk die voort kunnen vloeien uit het materieelbeheer;
    url: https://wetten.overheid.nl/BWBR0007803/1998-02-13#Artikel1
  - number: 1.1.f
    text: 'Onze ministers: Onze betrokken ministers, ieder voor zover het hem aangaat.'
    url: https://wetten.overheid.nl/BWBR0007803/1998-02-13#Artikel1
  - number: '1.2'
    text: Dit besluit is niet van toepassing op de archieven van het Rijk.
    url: https://wetten.overheid.nl/BWBR0007803/1998-02-13#Artikel1
  - number: '2'
    text: |-
      Ten behoeve van een rechtmatig en doelmatig materieelbeheer leggen Onze ministers met inachtneming van
      de bepalingen van dit besluit de beschrijving van de administratieve organisatie met betrekking tot het
      materieelbeheer vast en dragen zorg voor de toepassing van de in die administratieve organisatie vastgelegde
      procedures. Daarbij wordt rekening gehouden met het toepassen van een voldoende functiescheiding.
    url: https://wetten.overheid.nl/BWBR0007803/1998-02-13#Artikel2
  - number: '3.1'
    text: |-
      Centrale voorraden die benodigd zijn voor het functioneren van de rijksdienst, dienen zodanig te worden aangehouden
      dat de continuïteit van de bedrijfsvoering voldoende gewaarborgd is en geen ondoelmatige voorraden ontstaan.
    url: https://wetten.overheid.nl/BWBR0007803/1998-02-13#Artikel3
  - number: '3.2'
    text: Centrale voorraden worden zodanig beheerd dat kwaliteits- en kwantiteitsverlies zoveel mogelijk worden voorkomen.
    url: https://wetten.overheid.nl/BWBR0007803/1998-02-13#Artikel3
  - number: '4.1'
    text: Van centrale voorraden wordt een voorraadadministratie bijgehouden.
    url: https://wetten.overheid.nl/BWBR0007803/1998-02-13#Artikel4
  - number: '4.2'
    text: 'Aan een voorraadadministratie moeten in elk geval kunnen worden ontleend:'
    url: https://wetten.overheid.nl/BWBR0007803/1998-02-13#Artikel4
  - number: 4.2.a
    text: de aard van de in voorraad gehouden zaken in een bij elke zaak passende eenheid;
    url: https://wetten.overheid.nl/BWBR0007803/1998-02-13#Artikel4
  - number: 4.2.b
    text: de aanwezige hoeveelheden, alsmede de voorraadmutaties;
    url: https://wetten.overheid.nl/BWBR0007803/1998-02-13#Artikel4
  - number: 4.2.c
    text: de aanschafprijzen;
    url: https://wetten.overheid.nl/BWBR0007803/1998-02-13#Artikel4
  - number: 4.2.d
    text: de leveranciers;
    url: https://wetten.overheid.nl/BWBR0007803/1998-02-13#Artikel4
  - number: 4.2.e
    text: per afnemer (een organisatie-onderdeel of een derde) de hoeveelheid die van elke zaak is geleverd;
    url: https://wetten.overheid.nl/BWBR0007803/1998-02-13#Artikel4
  - number: 4.2.f
    text: de locatie waar de voorraad wordt aangehouden;
    url: https://wetten.overheid.nl/BWBR0007803/1998-02-13#Artikel4
  - number: 4.2.g
    text: de namen van de centrale-voorraadbeheerders en van de beschikkende functionarissen.
    url: https://wetten.overheid.nl/BWBR0007803/1998-02-13#Artikel4
  - number: '4.3'
    text: |-
      Afgifte van zaken uit een centrale voorraad kan slechts geschieden door de betrokken centrale-voorraadbeheerder in
      opdracht van daartoe bevoegde functionarissen.
    url: https://wetten.overheid.nl/BWBR0007803/1998-02-13#Artikel4
  - number: '4.4'
    text: |-
      Ten minste eenmaal per jaar wordt door middel van een fysieke aanwezigheidscontrole nagegaan of een centrale
      voorraad in overeenstemming is met de bijgehouden voorraadadministratie. Van de resultaten van die controle wordt
      een proces-verbaal opgemaakt.
    url: https://wetten.overheid.nl/BWBR0007803/1998-02-13#Artikel4
  - number: '4.5'
    text: |-
      Na afloop van elk jaar legt een centrale-voorraadbeheerder verantwoording af over het door hem in het voorafgaande
      jaar gevoerde voorraadbeheer overeenkomstig de door Onze betrokken minister vastgestelde procedure.
    url: https://wetten.overheid.nl/BWBR0007803/1998-02-13#Artikel4
  - number: '4.6'
    text: |-
      In afwijking van het vijfde lid wordt de procedure tot het afleggen van verantwoording door een centrale-
      voorraadbeheerder bij een hoog college van staat en bij het Kabinet van de Koning niet vastgesteld door Onze
      Minister van Binnenlandse Zaken, maar door de op grond van [artikel 19, vijfde lid, van de Comptabiliteitswet][ref1]
      tot aanwijzing van een centrale-voorraadbeheerder bevoegde functionaris.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel19
    url: https://wetten.overheid.nl/BWBR0007803/1998-02-13#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '19'
  - number: '5'
    text: |-
      De [artikelen 3][ref1] en [4][ref2] zijn met betrekking tot centrale voorraden:


      [ref1]: https://wetten.overheid.nl/BWBR0007803#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007803#Artikel4
    url: https://wetten.overheid.nl/BWBR0007803/1998-02-13#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007803
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0007803
        artikel: '4'
  - number: 5.a
    text: |-
      die worden beheerd door de Dienst der Domeinen op grond van het [Besluit beheer overtollige rijksgoederen][ref1],
      of


      [ref1]: https://wetten.overheid.nl/BWBR0003117
    url: https://wetten.overheid.nl/BWBR0007803/1998-02-13#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003117
  - number: 5.b
    text: die door het Rijk in bewaring zijn genomen,
    url: https://wetten.overheid.nl/BWBR0007803/1998-02-13#Artikel5
  - number: '6.1'
    text: |-
      Van bepaalde door Onze ministers aan te wijzen roerende zaken wordt, zodra deze binnen een dienstonderdeel in
      gebruik zijn gesteld, geadministreerd de plaats waar deze zich dienen te bevinden en wie daarover het dagelijks
      beheer voert of wie daarvan dagelijks gebruik maken. Onze ministers kunnen bepalen dat ook andere gegevens omtrent
      deze zaken worden geadministreerd.
    url: https://wetten.overheid.nl/BWBR0007803/1998-02-13#Artikel6
  - number: '6.2'
    text: |-
      Van de zaken, bedoeld in het eerste lid, wordt op niet vooraf aangekondigde momenten de daadwerkelijke aanwezigheid
      gecontroleerd. De resultaten hiervan worden in een proces-verbaal vastgelegd.
    url: https://wetten.overheid.nl/BWBR0007803/1998-02-13#Artikel6
  - number: '7.1'
    text: |-
      Van bepaalde door Onze ministers aan te wijzen roerende zaken worden, zodra deze in gebruik zijn gesteld, het
      onderhoud en de storingen geadministreerd.
    url: https://wetten.overheid.nl/BWBR0007803/1998-02-13#Artikel7
  - number: '7.2'
    text: |-
      Van bepaalde door Onze ministers vast te stellen roerende zaken met een investeringskarakter worden de jaarlijkse
      en cumulatieve afschrijvingen geadministreerd.
    url: https://wetten.overheid.nl/BWBR0007803/1998-02-13#Artikel7
  - number: '8.1'
    text: Onze ministers zijn belast met een doelmatig risicobeheer.
    url: https://wetten.overheid.nl/BWBR0007803/1998-02-13#Artikel8
  - number: '8.2'
    text: 'Onze ministers houden gegevens bij:'
    url: https://wetten.overheid.nl/BWBR0007803/1998-02-13#Artikel8
  - number: 8.2.a
    text: met betrekking tot voorgevallen schaden en aansprakelijkheidsstellingen;
    url: https://wetten.overheid.nl/BWBR0007803/1998-02-13#Artikel8
  - number: 8.2.b
    text: die van belang kunnen zijn ter beperking van schade en aansprakelijkheidsstelling in de toekomst.
    url: https://wetten.overheid.nl/BWBR0007803/1998-02-13#Artikel8
  - number: '8.3'
    text: De in het tweede lid bedoelde gegevens worden op verzoek van Onze Minister van Financiën aan hem overgelegd.
    url: https://wetten.overheid.nl/BWBR0007803/1998-02-13#Artikel8
  - number: '8.4'
    text: De risico's van schade voor het Rijk en van aansprakelijkheidsstelling van het Rijk worden niet verzekerd.
    url: https://wetten.overheid.nl/BWBR0007803/1998-02-13#Artikel8
  - number: '8.5'
    text: |-
      Na schriftelijke toestemming van Onze Minister van Financiën kan in bepaalde gevallen van het vierde lid worden
      afgeweken.
    url: https://wetten.overheid.nl/BWBR0007803/1998-02-13#Artikel8
  - number: '8.6'
    text: |-
      In bepaalde gevallen kan in overleg tussen Onze ministers en Onze Minister van Financiën worden besloten, dat
      de afwikkeling van een schade of een aansprakelijkheidsstelling namens het Rijk door Onze Minister van Financiën
      geschiedt.
    url: https://wetten.overheid.nl/BWBR0007803/1998-02-13#Artikel8
  - number: '9'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het materieelbeheer.
    url: https://wetten.overheid.nl/BWBR0007803/1998-02-13#Artikel9
  - number: '10'
    text: |-
      Onze ministers gaan na of op het moment van inwerkingtreding van dit besluit verzekeringen zijn gesloten in
      strijd met [artikel 8, vierde en vijfde lid][ref1], en treffen zo nodig maatregelen tot beëindiging van deze
      verzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0007803#Artikel8
    url: https://wetten.overheid.nl/BWBR0007803/1998-02-13#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007803
        artikel: '8'
  - number: '11.1'
    text: Dit besluit treedt in werking met ingang van 1 januari 1996.
    url: https://wetten.overheid.nl/BWBR0007803/1998-02-13#Artikel11
  - number: '11.2'
    text: 'Dit besluit wordt aangehaald onder de titel: "Besluit materieelbeheer 1996".'
    url: https://wetten.overheid.nl/BWBR0007803/1998-02-13#Artikel11
