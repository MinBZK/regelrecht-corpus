    text: |-
      Onverminderd de [artikelen 9][ref1], [10][ref2] en [11][ref3], bedragen de kosten, bedoeld in
      [artikel 434a van het Wetboek van Burgerlijke Rechtsvordering][ref4], voor de ambtshandeling, bedoeld in
      [artikel 2, onder b, d tot en met o, q tot en met w, en onder y][ref5] die geen doorgang vindt, de helft van het
      bedrag, vastgesteld bij of krachtens het desbetreffende onderdeel van [artikel 2][ref6], indien:


