        artikel: '6'
        paragraaf: '1'
  - number: '5'
    text: |-
      Indien de gerechtsdeurwaarder met betrekking tot dezelfde roerende zaken de ambtshandelingen, bedoeld in
      [artikel 2, onder m en n][ref1], verricht, worden de kosten van de ambtshandeling, vastgesteld in artikel 2, onder
      m, verminderd met € 20,35.


      [ref1]: https://wetten.overheid.nl/BWBR0012638#Artikel2
    url: https://wetten.overheid.nl/BWBR0012638/2021-01-01#Artikel5
    references:
