        artikel: '2'
        paragraaf: '1'
  - number: 6.b
    text: |-
      bedoeld in [artikel 2, onder m, o, q, v en w][ref1], verhoogd met € 72,61.


      [ref1]: https://wetten.overheid.nl/BWBR0012638#Artikel2
    url: https://wetten.overheid.nl/BWBR0012638/2021-01-01#Artikel6
    references:
