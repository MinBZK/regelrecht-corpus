  - number: 4.1.a
    text: de gerechtsdeurwaarder ter plaatse van de uitvoering van de desbetreffende ambtshandeling is aangetreden, en
    url: https://wetten.overheid.nl/BWBR0012638/2021-01-01#Artikel4
  - number: 4.1.b
    text: |-
      de ambtshandeling geen doorgang heeft gevonden omdat de schuldenaar vrijwillig de uit de executoriale titel
      blijkende verplichting tot de prestatie nakomt die met die ambtshandeling zou worden afgedwongen, of omdat zijn
      gehele of gedeeltelijke prestatie leidt tot beeïndiging van de tenuitvoerlegging van de executoriale titel.
    url: https://wetten.overheid.nl/BWBR0012638/2021-01-01#Artikel4
  - number: '4.2'
    text: |-
      [Artikel 6][ref1] is van overeenkomstige toepassing, met dien verstande dat de kosten worden verhoogd met de helft
      van het desbetreffende bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0012638#Artikel6
    url: https://wetten.overheid.nl/BWBR0012638/2021-01-01#Artikel4
    references:
