        bwb_id: BWBR0012638
        artikel: '2'
        paragraaf: '1'
  - number: '6'
    text: |-
      Indien de gerechtsdeurwaarder zich op grond van een wettelijk voorschrift voor de goede verrichting van de
      ambtshandeling laat bijstaan door een of meer getuigen, worden de kosten van de ambtshandeling:
    url: https://wetten.overheid.nl/BWBR0012638/2021-01-01#Artikel6
  - number: 6.a
    text: |-
      bedoeld in [artikel 2, onder e, f, g, en n][ref1], verhoogd met € 20,73;


      [ref1]: https://wetten.overheid.nl/BWBR0012638#Artikel2
    url: https://wetten.overheid.nl/BWBR0012638/2021-01-01#Artikel6
    references:
