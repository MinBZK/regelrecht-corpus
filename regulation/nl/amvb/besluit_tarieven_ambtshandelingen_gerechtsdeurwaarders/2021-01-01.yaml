        artikel: '2'
        paragraaf: '1'
  - number: '7'
    text: 'Indien uit het exploot blijkt dat de uitvoering ter plaatse van de ambtshandeling:'
    url: https://wetten.overheid.nl/BWBR0012638/2021-01-01#Artikel7
  - number: 7.a
    text: |-
      bedoeld in [artikel 2, onder e, f, g, h, n en y][ref1], langer dan anderhalf uur heeft geduurd, of


      [ref1]: https://wetten.overheid.nl/BWBR0012638#Artikel2
    url: https://wetten.overheid.nl/BWBR0012638/2021-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0012638
        artikel: '2'
        paragraaf: '1'
  - number: 7.b
    text: |-
      bedoeld in [artikel 2, onder m, q, r, t, v en w][ref1], langer dan drie uur heeft geduurd, worden de kosten
      verhoogd met € 20,35 voor iedere 15 minuten dat de uitvoering ter plaatse van de ambtshandeling langer dan
      anderhalf uur, respectievelijk drie uur heeft geduurd, en worden de kosten, vastgesteld bij of krachtens
      [artikel 6][ref2], verhoogd met € 12,07 voor iedere 15 minuten dat de bijstand door de getuige daarbij langer dan
      anderhalf uur, respectievelijk drie uur heeft geduurd.


      [ref1]: https://wetten.overheid.nl/BWBR0012638#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012638#Artikel6
    url: https://wetten.overheid.nl/BWBR0012638/2021-01-01#Artikel7
