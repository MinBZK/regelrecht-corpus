preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Justitie van 23 mei 2001, nr. 5099743/01/6;

    Gelet op de artikelen 2, tweede lid, en 21 van de Gerechtsdeurwaarderswet, en de artikelen 57, vijfde lid, 57a,
    derde lid, en 434a van het Wetboek van Burgerlijke Rechtsvordering;

    De Raad van State gehoord (advies van 21 juni 2001, nr. W03.01.0251);

    Gezien het nader rapport van de Staatssecretaris van Justitie van 2 juli 2001, nr. 5105381/01/6;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0012638/2021-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De schuldenaarstarieven, vastgesteld bij of krachtens dit besluit dienen mede tot dekking van de rechtstreeks
      met de ambtshandeling samenhangende voorbereidende, uitvoerende en afrondende werkzaamheden die voor een goede
      verrichting van die ambtshandeling noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0012638/2021-01-01#Artikel1
  - number: '2'
    text: |-
      1 Onverminderd de [artikelen 5 tot en met 11][ref1] en [14][ref2], bedragen de kosten, bedoeld in de
      [artikelen 240][ref3] en [434a van het Wetboek van Burgerlijke Rechtsvordering][ref4], voor het exploot
      van: 'a. oproeping in een vorderingsprocedure: € 83,38; b. betekening van een titel: € 80,24; c. betekening'
      van een verzoekschrift met oproeping om in rechte te verschijnen of van een aanzegging, anders dan bedoeld
      in dit artikel: € 65,96; d. betekening, anders dan bedoeld in dit artikel: € 70,59; e. beslag op roerende
      zaken, niet zijnde registergoederen, anders dan bedoeld in een van de volgende onderdelen, of van nadere
      aanduiding van de in beslag genomen roerende zaken: € 109,66; f. beslag op roerende zaken, niet zijnde
      registergoederen, die zich bevinden op een zodanige plaats dat voor de toegang daartoe de medewerking
      van een derde nodig is: € 147,27; g. beslag op rechten aan toonder of order, op effecten op naam of op
