  - number: '8.1'
    text: |-
      Voor de toepassing van [artikel 434a van het Wetboek van Burgerlijke Rechtsvordering][ref1], worden de kosten
      verhoogd met € 25,67 indien:


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel434a
    url: https://wetten.overheid.nl/BWBR0012638/2021-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 434a
  - number: 8.1.a
    text: |-
      het exploot, nadat betekening aan de laatstelijk aan de opdrachtgever bekendgeworden woon- of verblijfplaats van de
      schuldenaar eens of meermalen niet mogelijk is gebleken, op een volgend adres wordt betekend, en
    url: https://wetten.overheid.nl/BWBR0012638/2021-01-01#Artikel8
  - number: 8.1.b
    text: |-
      de gerechtsdeurwaarder aan de voet van het exploot de data vermeldt waarop dat adres is geverifieerd aan de hand
      van gegevens uit de basisregistratie personen of het Handelsregister, en waarop betekening aan dat adres niet
      mogelijk is gebleken.
    url: https://wetten.overheid.nl/BWBR0012638/2021-01-01#Artikel8
  - number: '8.2'
    text: |-
      Voor de toepassing van [artikel 434a van het Wetboek van Burgerlijke Rechtsvordering][ref1], worden de kosten van
      het exploot, bedoeld in [artikel 2, onder e en w][ref2], verhoogd met € 51,67 onderscheidenlijk € 101,05, indien
      de gerechtsdeurwaarder:


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel434a
      [ref2]: https://wetten.overheid.nl/BWBR0012638#Artikel2
    url: https://wetten.overheid.nl/BWBR0012638/2021-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 434a
      - id: ref2
        bwb_id: BWBR0012638
        artikel: '2'
        paragraaf: '1'
  - number: 8.2.a
    text: |-
      de desbetreffende ambtshandeling heeft verricht nadat een of meer eerdere pogingen daartoe geen doorgang vonden
      wegens afwezigheid van de schuldenaar of een persoon die hem kan vertegenwoordigen op de plaats van het beslag,
      onderscheidenlijk de afwezigheid van de schuldenaar op de voorziene plaats van tenuitvoerlegging van de lijfsdwang;
    url: https://wetten.overheid.nl/BWBR0012638/2021-01-01#Artikel8
  - number: 8.2.b
    text: |-
      voorafgaand aan de eerdere poging of pogingen de schuldenaar schriftelijk over het tijdstip en doel van zijn komst
      heeft bericht, en
    url: https://wetten.overheid.nl/BWBR0012638/2021-01-01#Artikel8
  - number: 8.2.c
    text: in het exploot de feiten, bedoeld in de onderdelen a en b, heeft gerelateerd.
    url: https://wetten.overheid.nl/BWBR0012638/2021-01-01#Artikel8
  - number: '9.1'
    text: 'De kosten worden verhoogd met de door de gerechtsdeurwaarder gedane verschotten, voor zover:'
    url: https://wetten.overheid.nl/BWBR0012638/2021-01-01#Artikel9
  - number: 9.1.a
    text: |-
      het doen en het beloop van de verschotten voor de goede verrichting van de ambtshandeling noodzakelijk waren en aan
      de voet van het exploot afzonderlijk zijn vermeld;
    url: https://wetten.overheid.nl/BWBR0012638/2021-01-01#Artikel9
  - number: 9.1.b
    text: |-
      de verschotten niet eerder zijn betrokken in de berekening van de proceskosten of de bepaling van de kosten van
      tenuitvoerlegging, en
    url: https://wetten.overheid.nl/BWBR0012638/2021-01-01#Artikel9
  - number: 9.1.c
    text: |-
      indien het betreft kosten waarvan de hoogte niet bij wettelijk voorschrift is vastgesteld, het tweede en derde lid
      in acht zijn genomen.
    url: https://wetten.overheid.nl/BWBR0012638/2021-01-01#Artikel9
  - number: '9.2'
    text: |-
      De gerechtsdeurwaarder verklaart in het exploot dat het doen en het beloop van de verschotten voor de goede
      verrichting van de ambtshandeling noodzakelijk waren en dat hij geen rechtstreeks of middellijk belang heeft in de
      onderneming of derde die de kosten factureerde.
    url: https://wetten.overheid.nl/BWBR0012638/2021-01-01#Artikel9
  - number: '9.3'
    text: |-
      De gerechtsdeurwaarder hecht een afschrift van de factuur van de verschotten aan het exploot. Indien de
      factuur later wordt ontvangen, wordt deze uiterlijk op de vijftiende dag na de maand waarin de desbetreffende
      levering of de dienst is verricht in afschrift aan het exploot gehecht en aan de schuldenaar toegezonden. De
      gerechtsdeurwaarder maakt van de toezending aantekening aan de voet van het exploot en voorziet de aantekening van
      een dag- en handtekening.
    url: https://wetten.overheid.nl/BWBR0012638/2021-01-01#Artikel9
  - number: '10'
    text: |-
      De kosten worden verhoogd met een percentage dat overeenkomt met het percentage, bedoeld in
      [artikel 9, eerste lid, van de Wet op de Omzetbelasting 1968][ref1], indien de opdrachtgever de hem in rekening
      gebrachte omzetbelasting niet op grond van genoemde wet kan verrekenen en zulks nadrukkelijk verklaart, en de
      gerechtsdeurwaarder aan de voet van het exploot verklaart dat de kosten in verband daarmee zijn verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0002629#Artikel9
    url: https://wetten.overheid.nl/BWBR0012638/2021-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002629
        artikel: '9'
  - number: '11'
    text: |-
      [Deze paragraaf][ref1] blijft buiten toepassing ten aanzien van:


      [ref1]: https://wetten.overheid.nl/BWBR0012638#Paragraaf1
    url: https://wetten.overheid.nl/BWBR0012638/2021-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0012638
        paragraaf: '1'
  - number: 11.a
    text: |-
      de ambtshandeling waartoe de opdrachtgever in de gegeven omstandigheden, waaronder zijn belangen, die van
      de schuldenaar en hetgeen in het maatschappelijk verkeer gebruikelijk is, naar het oordeel van de rechter in
      redelijkheid niet had kunnen besluiten;
    url: https://wetten.overheid.nl/BWBR0012638/2021-01-01#Artikel11
  - number: 11.b
    text: het exploot waarbij een gebrek in een eerder exploot is hersteld, en
    url: https://wetten.overheid.nl/BWBR0012638/2021-01-01#Artikel11
  - number: 11.c
    text: |-
      het exploot waarmee de geëxecuteerde op grond van
      [artikel 431a van het Wetboek van Burgerlijke Rechtsvordering][ref1] in kennis wordt gesteld dat de bevoegdheid tot
      tenuitvoerlegging van een executoriale titel op een ander is overgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel431a
    url: https://wetten.overheid.nl/BWBR0012638/2021-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 431a
  - number: '12.1'
    text: |-
      De gerechtsdeurwaarder vraagt de opdrachtgever bij wijze van voorschot geen hoger bedrag dan het bedrag dat
      op grond van [paragraaf 1][ref1], met uitzondering van de [artikelen 4][ref2] en [11, onder a][ref3], wordt
      vastgesteld. De verhogingen, bedoeld in de [artikelen 6][ref4], [7][ref5] en [9][ref6], worden gebaseerd op de
      kosten die naar zijn oordeel voor de goede verrichting van de ambtshandeling noodzakelijk zullen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0012638#Paragraaf1
      [ref2]: https://wetten.overheid.nl/BWBR0012638#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0012638#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0012638#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0012638#Artikel7
      [ref6]: https://wetten.overheid.nl/BWBR0012638#Artikel9
    url: https://wetten.overheid.nl/BWBR0012638/2021-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0012638
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0012638
        artikel: '4'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0012638
        artikel: '11'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0012638
        artikel: '6'
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0012638
        artikel: '7'
        paragraaf: '1'
      - id: ref6
        bwb_id: BWBR0012638
        artikel: '9'
        paragraaf: '1'
  - number: '12.2'
    text: |-
      Voor andere ambtshandelingen dan die bedoeld in de [artikelen 2][ref1] en [3][ref2] kan de gerechtsdeurwaarder bij
      wijze van voorschot een redelijk bedrag vragen.


      [ref1]: https://wetten.overheid.nl/BWBR0012638#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012638#Artikel3
    url: https://wetten.overheid.nl/BWBR0012638/2021-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0012638
        artikel: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0012638
        artikel: '3'
        paragraaf: '1'
  - number: '13'
    text: |-
      Indien aan de opdrachtgever een toevoeging als bedoeld in [artikel 24 van de Wet op de Rechtsbijstand][ref1]
      is verleend, vraagt de gerechtsdeurwaarder de opdrachtgever bij wijze van voorschot geen bedrag dat hoger is
      dan het bedrag dat op grond van de [artikelen 9][ref2] en [10][ref3] wordt vastgesteld. Het bedrag, bedoeld
      in [artikel 9][ref4], wordt gebaseerd op de kosten die naar zijn oordeel voor de goede verrichting van de
      ambtshandeling noodzakelijk zullen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0006368#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0012638#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0012638#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0012638#Artikel9
    url: https://wetten.overheid.nl/BWBR0012638/2021-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006368
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0012638
        artikel: '9'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0012638
        artikel: '10'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0012638
        artikel: '9'
        paragraaf: '1'
  - number: '14.1'
    text: |-
      De bedragen, vastgesteld in de [artikelen 2 tot en met 8][ref1], gelden tot en met 31 december 2002 en worden
      jaarlijks met ingang van 1 januari door Onze Minister gewijzigd met een percentage dat overeenkomt met 0,6 x (A –
      B) + (0,4 x C), waarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0012638#Artikel2
    url: https://wetten.overheid.nl/BWBR0012638/2021-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0012638
        artikel: '2'
        paragraaf: '1'
  - number: 14.1.a
    text: |-
      A gelijk is aan het procentuele verschil tussen het indexcijfer van de CAO-lonen per uur, inclusief bijzondere
      beloningen van het jaargemiddelde van het jaar t-2 en het daaraan voorafgaande jaargemiddelde, zoals die door het
      Centraal Bureau voor de Statistiek zijn bekendgemaakt;
    url: https://wetten.overheid.nl/BWBR0012638/2021-01-01#Artikel14
  - number: 14.1.b
    text: |-
      B gelijk is aan de percentuele volumemutatie van de toegevoegde waarde (bruto, basisprijzen) per arbeidsjaar van
      het jaar t-2, zoals dat door het Centraal Bureau voor de Statistiek is bekendgemaakt;
    url: https://wetten.overheid.nl/BWBR0012638/2021-01-01#Artikel14
  - number: 14.1.c
    text: |-
      C gelijk is aan het procentuele verschil tussen de consumentenprijsindexcijfers voor alle huishoudens op de meest
      recente tijdsbasis van het jaargemiddelde van het jaar t-2 en het daaraan voorafgaande jaargemiddelde, zoals die
      door het Centraal Bureau voor de Statistiek zijn bekendgemaakt, en
    url: https://wetten.overheid.nl/BWBR0012638/2021-01-01#Artikel14
  - number: 14.1.d
    text: onder t-2 wordt verstaan het tweede jaar voorafgaand aan het jaar waarin de gewijzigde bedragen zullen gelden.
    url: https://wetten.overheid.nl/BWBR0012638/2021-01-01#Artikel14
  - number: '14.2'
    text: |-
      De tarieven die golden voor 1 januari van ieder jaar, blijven van toepassing met betrekking tot de vergoeding van
      ambtshandelingen die voor 1 januari van dat jaar zijn verricht.
    url: https://wetten.overheid.nl/BWBR0012638/2021-01-01#Artikel14
  - number: '15'
    text: Het Deurwaardersreglement wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0012638/2021-01-01#Artikel15
  - number: '17'
    text: |-
      Dit besluit berust op de [artikelen 240][ref1]en [434a van het Wetboek van Burgerlijke Rechtsvordering][ref2], en
      de [artikelen 2][ref3] en [21 van de Gerechtsdeurwaarderswet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel240
      [ref2]: https://wetten.overheid.nl/BWBR0001827
      [ref3]: https://wetten.overheid.nl/BWBR0012197#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0012197#Artikel21
    url: https://wetten.overheid.nl/BWBR0012638/2021-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '240'
      - id: ref2
        bwb_id: BWBR0001827
      - id: ref3
        bwb_id: BWBR0012197
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0012197
        artikel: '21'
  - number: '18'
    text: |-
      Dit besluit, treedt in werking op het tijdstip waarop de [artikelen 2][ref1], [21][ref2] en
      [89 van de Gerechtsdeurwaarderswet][ref3] in werking treden, met uitzondering van [artikel 14][ref4], dat in
      werking treedt met ingang van het tijdstip waarop artikel 31, onderdeel L, van hoofdstuk 5 van het bij koninklijke
      boodschap van 20 juni 2001 ingediende voorstel van wet tot aanpassing van de wetgeving aan de herziening van het
      procesrecht voor burgerlijke zaken, in het bijzonder de wijze van procederen in eerste aanleg (Kamerstukken II
      2000/2001, 27 824, nrs. 1–3), nadat het tot wet is verheven, in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012197#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0012197#Artikel89
      [ref4]: https://wetten.overheid.nl/BWBR0012638#Artikel14
    url: https://wetten.overheid.nl/BWBR0012638/2021-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0012197
        artikel: '21'
      - id: ref3
        bwb_id: BWBR0012197
        artikel: '89'
      - id: ref4
        bwb_id: BWBR0012638
        artikel: '14'
        paragraaf: '3'
  - number: '19'
    text: 'Dit besluit wordt aangehaald als: Besluit tarieven ambtshandelingen gerechtsdeurwaarders.'
    url: https://wetten.overheid.nl/BWBR0012638/2021-01-01#Artikel19
