preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 6 februari 1989, DGVgz/VVP/L,
    nr.684128, gedaan in overeenstemming met de Staatssecretaris van Economische Zaken, A. J.Evenhuis, en Onze Minister
    van Landbouw en Visserij;

    Overwegende, dat de keuze in stoffen welke eet- en drinkwaren een zoete smaak kunnen geven, dan wel suiker kunnen
    vervangen, aanzienlijk is toegenomen en ook nog verder zal toenemen;

    Overwegende, dat is gebleken dat de eindverbruiker naast de traditioneel gezoete eet- en drinkwaren een keuze wil
    kunnen maken uit eet- en drinkwaren welke met zoetstoffen zijn gezoet;

    Overwegende, dat het belang van de volksgezondheid en de goede voorlichting omtrent waren vereist dat er regels
    worden gesteld omtrent het gebruik van zoetstoffen en de aanduiding van met zoetstoffen gezoete eet- en drinkwaren;

    Gelet op de artikelen 1, vierde lid, 4, eerste lid, onderdeel a, 6, onderdeel a, 8, onderdelen a, b en c, 12 en 14
    van de Warenwet (Stb. 1988, 360) en op artikel II, eerste lid, van de Wijzigingswet 1988 Warenwet (Stb. 358), jo.
    de artikelen 14 en 16 van de Warenwet (Stb. 1935, 793);

    De Adviescommissie Warenwet gehoord (adviezen van 9 oktober 1986, nr. 13 622/115, en van 14 juni 1989, nr. 14 088/
    (15)15);

    De Raad van State gehoord (advies van 20 juni 1989, No.W13.89 0079);

    Gezien het nader rapport van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 13 november 1989, VVP/
    L-685467, uitgebracht in overeenstemming met Onze Ministers van Economische Zaken en van Landbouw en Visserij;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004652/2007-02-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. *zoetstoffen:* levensmiddelenadditieven die bestemd en geschikt zijn om aan levensmiddelen een zoete smaak te
      geven of om gebruikt te worden als tafelzoetstoffen;

      b. *zonder toegevoegde suikers:* waaraan geen mono- of disacchariden of een wegens zijn zoetkracht gebruikte eet-
      of drinkwaar is toegevoegd;

      c. *met verlaagde energiewaarde:* met een energie-hoeveelheid waarvan de energievermindering in vergelijking met de
      oorspronkelijke eet- of drinkwaar ten minste 30% bedraagt;

      d. *suikers:* een of meer der waren, bedoeld in het Warenbesluit suikers.

      2 In afwijking van het bepaalde in het eerste lid, onderdeel *a*, worden onder zoetstoffen niet verstaan eet- of
      drinkwaren die vanwege de zoete smaak zouden kunnen worden gebezigd als zodanig, of als ingrediënt van andere eet-
      of drinkwaren, ten einde aan die waren (mede) een zoete smaak te geven.
    url: https://wetten.overheid.nl/BWBR0004652/2007-02-01#Artikel1
  - number: '2'
    text: |-
      1 Het is verboden zoetstoffen welke niet voldoen aan de in of krachtens dit besluit gestelde eisen, te verhandelen
      of in eet- of drinkwaren te verwerken.

      2 Het is verboden zoetstoffen te verhandelen anders dan met inachtneming van de voorschriften in of krachtens dit
      besluit gesteld met betrekking tot het bezigen van hun aanduiding of vermeldingen.

      3 Het is verboden met gebruikmaking van in dit besluit aangegeven aanduidingen andere waren te verhandelen dan
      zoetstoffen waaraan die aanduiding is voorbehouden.

      4 Het is verboden eet- of drinkwaren te verhandelen die voor wat betreft de verwerking van zoetstoffen in die eet-
      of drinkwaren, niet voldoen aan de eisen in of krachtens dit besluit gesteld.

      5 Het is verboden met zoetstoffen bereide eet- of drink-waren te verhandelen anders dan met inachtneming van
      de voorschriften in of krachtens dit besluit gesteld met betrekking tot het bezigen van hun aanduiding of
      vermeldingen.
    url: https://wetten.overheid.nl/BWBR0004652/2007-02-01#Artikel2
  - number: '3'
    text: |-
      1 Als zoetstof zijn uitsluitend toegelaten de stoffen die zijn opgenomen in de bijlage.

      2 Zoetstoffen moeten voldoen aan de volgende algemene zuiverheidseisen:

      a. het gehalte aan arsenicum mag ten hoogste 3 mg per kg bedragen;

      b. het gehalte aan lood mag ten hoogste 10 mg per kg bedragen;

      c. het gehalte aan cadmium mag ten hoogste 10 mg per kg bedragen;

      d. het gehalte aan nikkel in de in onderdeel B van de bijlage opgenomen polyolen mag ten hoogste 20 mg per kg
      bedragen.

      3 Onze Minister kan nadere regels vaststellen met betrekking tot de zuiverheid van de in de bijlage opgenomen
      zoetstoffen.

      4 De verpakking van vloeibare intensieve zoetstoffen bestemd voor de aflevering aan de eindverbruiker, moet
      geschikt zijn om een dosering volgens de gebruiksaanwijzing op doelmatige wijze mogelijk te maken.
    url: https://wetten.overheid.nl/BWBR0004652/2007-02-01#Artikel3
  - number: '4'
    text: |-
      1 Onze Minister kan in overeenstemming met Onze Minister van Landbouw, Natuurbeheer en Visserij categorieën eet-
      en drinkwaren aanwijzen waarin zoetstoffen aanwezig mogen zijn onderscheidenlijk waaraan zoetstoffen mogen worden
      toegevoegd, en de desbetreffende ten hoogste toegelaten hoeveelheden daarvan vaststellen.

      2 Zoetstoffen mogen niet in andere dan de krachtens het eerste lid aangewezen eet- of drinkwaren aanwezig zijn, en
      daarin uitsluitend aanwezig zijn voor zover die waren tengevolge van het gebruik van zoetstoffen:

      a. een verlaagde energiewaarde bezitten;

      b. zonder cariogeen effect zijn;

      c. zonder toegevoegde suikers zijn en een verlengde houdbaarheid hebben verkregen door de vervanging van suikers
      door zoetstof; of

      d. een dieetvoedingsmiddel zijn.

      3 Zoetstoffen worden niet toegevoegd aan eet- en drinkwaren bestemd voor zuigelingen, peuters of kleuters.
    url: https://wetten.overheid.nl/BWBR0004652/2007-02-01#Artikel4
  - number: '6'
    text: |-
      1 De in de bijlage voor de desbetreffende zoetstof aangegeven aanduiding mag uitsluitend en moet worden gebezigd
      voor de zoetstof waaraan die aanduiding is voorbehouden.

      2 Indien zoetstof zich bevindt in een verpakking die bestemd of geschikt is om aan de eindverbruiker te worden
      afgeleverd, moet deze de vermelding "tafelzoetstof op basis van ..." bevatten, gevolgd door de in het eerste lid
      bedoelde aanduiding of aanduidingen van de terzake gebruikte zoetstoffen.

      3 Indien aspartaam ingrediënt van een eet- of drinkwaar is, wordt de vermelding «bevat een bron van fenylalanine»
      gebezigd.

      4 Bij tafelzoetstoffen, bedoeld in het tweede lid, worden de volgende vermeldingen gebezigd:

      a. "overmatig gebruik kan een laxerend effect hebben", voor zover de waar polyolen bevat;

      b. "bevat een bron van fenylalanine", voor zover de waar aspartaam of het zout van aspartaam en acesulfaam bevat.

      5 Indien het gehalte aan polyolen in eet- of drinkwaar, niet zijnde tafelzoetstoffen, meer is dan 10%, wordt de
      vermelding "overmatig gebruik kan een laxerend effect hebben" gebezigd.

      6 Onze Minister kan nadere regels vaststellen met betrekking tot bij de verhandeling te bezigen vermeldingen,
      teneinde een juist en veilig gebruik van de desbetreffende zoetstof mogelijk te maken.

      7 In een winkel, op een markt of in enige andere voor het publiek toegankelijke verkoopplaats moeten voor
      zoetstoffen, indien zij zich niet bevinden in een verpakking bestemd of geschikt om met de inhoud aan de
      eindverbruiker te worden afgeleverd, of niet zijn verpakt,

      de in het eerste lid bedoelde aanduiding en de in het tweede lid bedoelde vermelding voor de koper duidelijk
      zichtbaar en gemakkelijk leesbaar zijn aangebracht op of in de onmiddellijke nabijheid van de waar.
    url: https://wetten.overheid.nl/BWBR0004652/2007-02-01#Artikel6
  - number: '8'
    text: |-
      De in [artikel 4, eerste lid, van het Warenwetbesluit Etikettering van levensmiddelen][ref1] bedoelde aanduiding,
      onderscheidenlijk de in de desbetreffende wettelijke regeling voorgeschreven aanduiding voor een eet- of drinkwaar
      waarvan suikers doorgaans ingrediënt zijn, onderscheidenlijk moeten zijn, mag, tevens worden gebezigd voor bedoelde
      eet- of drinkwaar waarin die suikers geheel of gedeeltelijk zijn vervangen door zoetstoffen, tenzij ten aanzien
      van de uit een zodanige vervanging voortvloeiende aanduiding uitdrukkelijk anders is bepaald in de desbetreffende
      wettelijke regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0005310#Artikel4
    url: https://wetten.overheid.nl/BWBR0004652/2007-02-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005310
        artikel: '4'
  - number: '9'
    text: |-
      1 Op de verpakking van eet- of drinkwaren waarin een of meer zoetstoffen aanwezig zijn wordt de
      vermelding «met zoetstoffen» gebezigd, waarbij deze vermelding samen met de aanduiding, bedoeld in
      [artikel 4 van het Warenwetbesluit Etikettering van levensmiddelen][ref1], wordt aangebracht.

      2 Op de verpakking van eet- of drinkwaren die zowel toegevoegde suiker(s) als een of meer zoetstoffen bevatten,
      wordt de vermelding «met suiker(s) en zoetstof(fen)» gebezigd, welke samen met de aanduiding, bedoeld in
      [artikel 4 van het Warenwetbesluit Etikettering van levensmiddelen][ref2], wordt aangebracht.

      3 In een winkel, op een markt of in enige andere voor het publiek toegankelijke verkoopplaats moeten voor met
      zoetstoffen bereide eet- of drinkwaren die zich niet bevinden in een verpakking die bestemd of geschikt is om met
      de inhoud aan de eindverbruiker te worden afgeleverd of niet zijn verpakt, de aanduiding bedoeld in het eerste en
      tweede lid, voor de koper duidelijk zichtbaar en gemakkelijk leesbaar zijn aangebracht op of in de onmiddellijke
      nabijheid van de waar.


      [ref1]: https://wetten.overheid.nl/BWBR0005310#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005310#Artikel4
    url: https://wetten.overheid.nl/BWBR0004652/2007-02-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005310
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005310
        artikel: '4'
  - number: '10'
    text: |-
      1 Voor eet- of drinkwaren waarvan suikers een ingrediënt zijn moet, indien van die eet- of drinkwaar tevens
      zoetstof ingrediënt is, een vermelding worden gebezigd aangevende het suikergehalte van de waar.

      2 Onder suikergehalte bedoeld in het eerste lid, wordt verstaan het met behulp van een refractometer bepaalde
      percentage opgeloste droge stof, uitgedrukt als suiker.
    url: https://wetten.overheid.nl/BWBR0004652/2007-02-01#Artikel10
  - number: '11'
    text: |-
      1 Als methoden van onderzoek welke bij uitsluiting beslissend zijn voor de vaststelling of met betrekking tot
      de desbetreffende zoetstof al dan niet is voldaan aan de bij of krachtens dit besluit gestelde regels, worden
      aangewezen chromatografische en andere scheidingsmethoden, alsmede detectiemethoden.

      2 Onze Minister kan omtrent de in het eerste lid bedoelde methoden nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0004652/2007-02-01#Artikel11
  - number: '17'
    text: |-
      1 De [artikelen 2 tot en met 5][ref1] en [8 tot en met 10][ref2] zijn niet van toepassing op waren waarvoor
      krachtens artikel 9, eerste lid, Algemeen Besluit (Warenwet) toestemming is verleend voor het bezigen van een der
      in dat artikellid bedoelde aanduidingen, met inachtneming van het volgende:

      a. Voor zover in de desbetreffende koninklijke besluiten geen termijn is gesteld waarvoor een dergelijke
      toestemming is verleend, is het bij of krachtens dit besluit gestelde op de desbetreffende waren van toepassing met
      ingang van het vierde jaar na de datum van inwerkingtreding.

      b. Voor zover in de desbetreffende koninklijke besluiten een termijn is genoemd waarvoor een dergelijke toestemming
      is verleend, welke afloopt binnen drie maanden na de datum van inwerkingtreding van dit besluit, wordt die termijn
      verlengd met drie maanden.

      c. Voor zover in de desbetreffende koninklijke besluiten een termijn is genoemd waarvoor een dergelijke toestemming
      is verleend, welke afloopt vanaf drie maanden na de datum van inwerkingtreding van dit besluit, is het bij of
      krachtens dit besluit gestelde op de desbetreffende waren van toepassing met ingang van de datum waarop de in het
      desbetreffende koninklijk besluit genoemde termijn is verstreken.

      d. In afwijking van het bepaalde in de onderdelen a, b of *c*, blijven koninklijke besluiten waarbij toestemming
      is verleend voor het gemengd gebruik van suiker(s) en zoetstof(fen), van kracht totdat zij worden ingetrokken.
      Koninklijke besluiten waarvan de in het desbetreffende besluit gestelde termijn waarvoor toestemming is verleend,
      afloopt voordat de in de eerste volzin bedoelde intrekking heeft plaats gevonden, blijven van kracht totdat zij bij
      koninklijk besluit worden ingetrokken.

      2 Totdat de in het eerste lid bedoelde termijn in de desbetreffende gevallen is verstreken, onderscheidenlijk
      totdat de desbetreffende koninklijke besluiten zijn ingetrokken, blijft, in afwijking van het bepaalde in
      [artikel 12][ref3], artikel 3quater van het Algemeen Besluit (Warenwet) van toepassing op de desbetreffende waren.

      3 De [artikelen 2 tot en met 5][ref4] en [8 tot en met 10][ref5] zijn tevens niet van toepassing op
      kauwpreparaten, andere dan van tabak, tot het tijdstip waarop bedoelde waren zijn aangewezen krachtens
      [artikel 4, tweede lid][ref6], als waren bij de bereiding waarvan zoetstoffen mogen worden gebezigd.


