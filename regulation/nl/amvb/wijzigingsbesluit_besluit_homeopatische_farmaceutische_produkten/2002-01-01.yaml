articles:
  - number: III
    text: |-
      1 Op homeopatische farmaceutische produkten als bedoeld in
      [artikel 4, eerste lid, van het Besluit homeopatische farmaceutische produkten][ref1], welke zijn bereid in
      overeenstemming met genoemd besluit zoals dat luidde onmiddellijk vóór de datum van inwerkingtreding bedoeld in
      [artikel IV, eerste lid][ref2], van dit besluit, is tot vier jaar na die datum:

      a. van toepassing het [Besluit homeopatische farmaceutische produkten][ref3], zoals dat tot eerstgenoemde datum
      luidde; en

      b. niet van toepassing artikel 3, vijfde lid, van de wet.

      2 Homeopatische farmaceutische produkten, andere dan bedoeld in het eerste lid, welke zijn bereid in
      overeenstemming met het [Besluit homeopatische farmaceutische produkten][ref4] zoals dat luidde onmiddellijk vóór
      de datum van inwerkingtreding als bedoeld in [artikel IV, eerste lid][ref5], van dit besluit, worden in het eerste
      jaar na bedoelde datum aangemeld bij het College ter beoordeling van geneesmiddelen. De aanmelding wordt door
      dat college op een lijst van aangemelde homeopatische farmaceutische produkten geplaatst, indien uit de bij de
      aanmelding overgelegde gegevens ten minste blijkt dat de te vermelden indicatie met betrekking tot het aangemelde
      homeopatisch farmaceutisch produkt in een doorgaans door de beroepsgroep van homeopatische artsen gehanteerd
      handboek voor de homeopatische geneeskunde is opgenomen.

      3 Voor zover homeopatische farmaceutische produkten zijn opgenomen op de in het tweede lid bedoelde
      lijst, mogen zij worden afgeleverd gedurende ten hoogste vier jaren na afloop van het jaar waarin
      zij zijn aangemeld. Op zodanige homeopatische farmaceutische produkten is van toepassing het
      [Besluit homeopatische farmaceutische produkten][ref6] zoals dat luidde onmiddellijk vóór de datum van
      inwerkingtreding als bedoeld in [artikel IV, eerste lid][ref7], van dit besluit.

      4 Voor zover vanaf het tweede jaar na de in het tweede lid bedoelde datum homeopatische farmaceutische produkten,
      andere dan bedoeld in het eerste lid, bij het College ter beoordeling van geneesmiddelen worden aangemeld in
      de zin van het tweede lid, is het tweede en derde lid van overeenkomstige toepassing, met dien verstande dat
      zodanige, op de lijst van aangemelde homeopatische farmaceutische produkten geplaatste homeopatische farmaceutische
      produkten mogen worden afgeleverd tot ten hoogste het vijfde jaar na de datum van inwerkingtreding bedoeld in
      [artikel IV, eerste lid][ref8], van dit besluit.

      5 Voor de behandeling van een aanmelding als bedoeld in het vierde lid is door de aanmelder een vergoeding
      verschuldigd volgens een door Onze Minister vastgesteld tarief. De vergoeding bedraagt ten hoogste € 226,89.


