  - number: IV
    text: |-
      1 Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin het
      wordt geplaatst.

      2 In afwijking van het eerste lid treedt het in [artikel I, onderdeel D][ref1], opgenomen artikel 6 in werking op
      een bij koninklijk besluit te bepalen tijdstip.

      3 De tekst van het [Besluit homeopatische farmaceutische produkten][ref2] wordt in het *Staatsblad* geplaatst.


