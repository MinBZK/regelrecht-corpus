preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volksgezondheid, Welzijn en Sport van 29 juni 1995, GMV/G 952674;

    Gelet op

      - Richtlijn 92/73/EEG van de Raad van de Europese Gemeenschappen van 22 september 1992 tot uitbreiding van
    het toepassingsgebied van de Richtlijnen 65/65/EEG en 75/319/EEG betreffende de aanpassing van de wettelijke
    en bestuursrechtelijke bepalingen inzake geneesmiddelen en tot vaststelling van aanvullende bepalingen voor
    homeopatische geneesmiddelen (PbEG L 297);

      - artikel 14, vijfde lid, van Richtlijn 93/39/EEG van de Raad van de Europese Gemeenschappen van 14 juni 1993 tot
    wijziging van de Richtlijnen 65/65/EEG, 75/318/EEG en 75/319/EEG inzake geneesmiddelen (PbEG L 214); en

      - de artikelen 1, derde lid, 3, zevende lid, en 26, onder f, van de Wet op de Geneesmiddelenvoorziening;

    Gezien het advies van de Geneesmiddelencommissie (advies van 11 juli 1994, nr Geco 4795);

    De Raad van State gehoord (advies van 15 augustus 1995, no. W13.95.0340);

    Gezien het nader rapport van voornoemde Minister van 6 december 1995, GMV/G 954527;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0007721/2002-01-01#ArtikelAanhef
articles:
  - number: III.1
    text: |-
      Op homeopatische farmaceutische produkten als bedoeld in
      [artikel 4, eerste lid, van het Besluit homeopatische farmaceutische produkten][ref1], welke zijn bereid in
      overeenstemming met genoemd besluit zoals dat luidde onmiddellijk vóór de datum van inwerkingtreding bedoeld in
      [artikel IV, eerste lid][ref2], van dit besluit, is tot vier jaar na die datum:


      [ref1]: https://wetten.overheid.nl/BWBR0005371#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007721#ArtikelIV
    url: https://wetten.overheid.nl/BWBR0007721/2002-01-01#ArtikelIII
    references:
      - id: ref1
        bwb_id: BWBR0005371
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0007721
        artikel: IV
  - number: III.1.a
    text: |-
      van toepassing het [Besluit homeopatische farmaceutische produkten][ref1], zoals dat tot eerstgenoemde datum
      luidde; en


      [ref1]: https://wetten.overheid.nl/BWBR0005371
    url: https://wetten.overheid.nl/BWBR0007721/2002-01-01#ArtikelIII
    references:
      - id: ref1
        bwb_id: BWBR0005371
  - number: III.1.b
    text: niet van toepassing artikel 3, vijfde lid, van de wet.
    url: https://wetten.overheid.nl/BWBR0007721/2002-01-01#ArtikelIII
  - number: III.2
    text: |-
      Homeopatische farmaceutische produkten, andere dan bedoeld in het eerste lid, welke zijn bereid in overeenstemming
      met het [Besluit homeopatische farmaceutische produkten][ref1] zoals dat luidde onmiddellijk vóór de datum van
      inwerkingtreding als bedoeld in [artikel IV, eerste lid][ref2], van dit besluit, worden in het eerste jaar na
      bedoelde datum aangemeld bij het College ter beoordeling van geneesmiddelen. De aanmelding wordt door dat college
      op een lijst van aangemelde homeopatische farmaceutische produkten geplaatst, indien uit de bij de aanmelding
      overgelegde gegevens ten minste blijkt dat de te vermelden indicatie met betrekking tot het aangemelde homeopatisch
      farmaceutisch produkt in een doorgaans door de beroepsgroep van homeopatische artsen gehanteerd handboek voor de
      homeopatische geneeskunde is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005371
      [ref2]: https://wetten.overheid.nl/BWBR0007721#ArtikelIV
    url: https://wetten.overheid.nl/BWBR0007721/2002-01-01#ArtikelIII
    references:
      - id: ref1
        bwb_id: BWBR0005371
      - id: ref2
        bwb_id: BWBR0007721
        artikel: IV
  - number: III.3
    text: |-
      Voor zover homeopatische farmaceutische produkten zijn opgenomen op de in het tweede lid bedoelde lijst, mogen zij
      worden afgeleverd gedurende ten hoogste vier jaren na afloop van het jaar waarin zij zijn aangemeld. Op zodanige
      homeopatische farmaceutische produkten is van toepassing het [Besluit homeopatische farmaceutische produkten][ref1]
      zoals dat luidde onmiddellijk vóór de datum van inwerkingtreding als bedoeld in [artikel IV, eerste lid][ref2], van
      dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005371
      [ref2]: https://wetten.overheid.nl/BWBR0007721#ArtikelIV
    url: https://wetten.overheid.nl/BWBR0007721/2002-01-01#ArtikelIII
    references:
      - id: ref1
        bwb_id: BWBR0005371
      - id: ref2
        bwb_id: BWBR0007721
        artikel: IV
  - number: III.4
    text: |-
      Voor zover vanaf het tweede jaar na de in het tweede lid bedoelde datum homeopatische farmaceutische produkten,
      andere dan bedoeld in het eerste lid, bij het College ter beoordeling van geneesmiddelen worden aangemeld in
      de zin van het tweede lid, is het tweede en derde lid van overeenkomstige toepassing, met dien verstande dat
      zodanige, op de lijst van aangemelde homeopatische farmaceutische produkten geplaatste homeopatische farmaceutische
      produkten mogen worden afgeleverd tot ten hoogste het vijfde jaar na de datum van inwerkingtreding bedoeld in
      [artikel IV, eerste lid][ref1], van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0007721#ArtikelIV
    url: https://wetten.overheid.nl/BWBR0007721/2002-01-01#ArtikelIII
    references:
      - id: ref1
        bwb_id: BWBR0007721
        artikel: IV
  - number: III.5
    text: |-
      Voor de behandeling van een aanmelding als bedoeld in het vierde lid is door de aanmelder een vergoeding
      verschuldigd volgens een door Onze Minister vastgesteld tarief. De vergoeding bedraagt ten hoogste € 226,89.
    url: https://wetten.overheid.nl/BWBR0007721/2002-01-01#ArtikelIII
  - number: IV.1
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0007721/2002-01-01#ArtikelIV
  - number: IV.2
    text: |-
      In afwijking van het eerste lid treedt het in [artikel I, onderdeel D][ref1], opgenomen artikel 6 in werking op een
      bij koninklijk besluit te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0007721#ArtikelI
    url: https://wetten.overheid.nl/BWBR0007721/2002-01-01#ArtikelIV
    references:
      - id: ref1
        bwb_id: BWBR0007721
        artikel: I
  - number: IV.3
    text: |-
      De tekst van het [Besluit homeopatische farmaceutische produkten][ref1] wordt in het *Staatsblad* geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0005371
    url: https://wetten.overheid.nl/BWBR0007721/2002-01-01#ArtikelIV
    references:
