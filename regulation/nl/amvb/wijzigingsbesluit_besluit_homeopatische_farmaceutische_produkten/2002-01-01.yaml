  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volksgezondheid, Welzijn en Sport van 29 juni 1995, GMV/G 952674;

    Gelet op

      - Richtlijn 92/73/EEG van de Raad van de Europese Gemeenschappen van 22 september 1992 tot uitbreiding van
    het toepassingsgebied van de Richtlijnen 65/65/EEG en 75/319/EEG betreffende de aanpassing van de wettelijke
    en bestuursrechtelijke bepalingen inzake geneesmiddelen en tot vaststelling van aanvullende bepalingen voor
    homeopatische geneesmiddelen (PbEG L 297);

      - artikel 14, vijfde lid, van Richtlijn 93/39/EEG van de Raad van de Europese Gemeenschappen van 14 juni 1993 tot
    wijziging van de Richtlijnen 65/65/EEG, 75/318/EEG en 75/319/EEG inzake geneesmiddelen (PbEG L 214); en

      - de artikelen 1, derde lid, 3, zevende lid, en 26, onder f, van de Wet op de Geneesmiddelenvoorziening;

    Gezien het advies van de Geneesmiddelencommissie (advies van 11 juli 1994, nr Geco 4795);

    De Raad van State gehoord (advies van 15 augustus 1995, no. W13.95.0340);

    Gezien het nader rapport van voornoemde Minister van 6 december 1995, GMV/G 954527;

    Hebben goedgevonden en verstaan:
