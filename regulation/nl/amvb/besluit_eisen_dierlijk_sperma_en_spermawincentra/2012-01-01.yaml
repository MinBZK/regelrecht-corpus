        artikel: '10'
      - id: ref3
        bwb_id: BWBR0005662
        artikel: '11'
  - number: '18.1'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat degenen die paardensperma verhandelen of vervoeren dienen te
      beschikken over:
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel18
  - number: 18.1.a
    text: |-
      een administratie die de tracering van contacten met een paardenspermawincentrum, inseminatoren, dierenartsen,
      vervoerders, handelaren en gebruikers van het sperma inzichtelijk maakt, en
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel18
  - number: 18.1.b
    text: een calamiteitenplan.
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel18
  - number: '18.2'
    text: 'Bij ministeriële regeling kunnen regels gesteld worden met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel18
  - number: 18.2.a
    text: het mengen van paardensperma afkomstig van verschillende hengsten;
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel18
  - number: 18.2.b
    text: het bewerken en opslaan van paardensperma;
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel18
  - number: 18.2.c
    text: de identificatie en registratie van het paardensperma;
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel18
  - number: 18.2.d
    text: het ter beschikking stellen van nader te bepalen monsters van sperma aan een daarbij aan te wijzen instelling;
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel18
  - number: 18.2.e
    text: de in het eerste lid genoemde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel18
  - number: '24.1'
    text: |-
      Onze Minister kan voor een periode van ten hoogste drie jaar na inwerkingtreding van [artikel 3][ref1] ontheffing
      verlenen van de erkenningseis, bedoeld in [artikel 3, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010619#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010619#Artikel3
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0010619
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0010619
        artikel: '3'
        paragraaf: '2'
  - number: '24.2'
    text: |-
      Runderspermawincentra worden, onder de voorwaarde dat zij binnen twee maanden na inwerkingtreding van
      [artikel 9][ref1] een daartoe strekkende volledige aanvraag hebben ingediend, voor de duur van zes maanden na
      inwerkingtreding van dat artikel voorlopig erkend als spermawincentrum of tot zoveel eerder als op die aanvraag
      onherroepelijk zal zijn besloten.


      [ref1]: https://wetten.overheid.nl/BWBR0010619#Artikel9
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0010619
        artikel: '9'
        paragraaf: '3'
  - number: '25'
    text: |-
      Een wijziging van een of meer onderdelen van [richtlijn 90/429/EEG](31990L0429) en van [richtlijn 88/407/EEG]
      (31988L0407) gaat voor de toepassing van de artikelen van dit besluit, waarin naar die onderdelen wordt verwezen,
      gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij
      ministerieel besluit, dat in de Staatscourant wordt bekend gemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel25
  - number: '26'
    text: |-
      Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel26
  - number: '27'
    text: 'Dit besluit wordt aangehaald als: Besluit eisen dierlijk sperma en spermawincentra.'
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel27
