        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0010619
        artikel: '13'
        paragraaf: '3'
  - number: '12'
    text: |-
      Het rundersperma is overeenkomstig het bepaalde bij of krachtens de [artikelen 9][ref1] en [10][ref2] op een
      runderspermawincentrum gewonnen, bewerkt en opgeslagen of het is, voor zover het rundersperma betreft dat is
      gewonnen in een buiten Nederland gevestigd spermawincentrum, overeenkomstig de krachtens [artikelen 10][ref3] en
      [11 van de wet][ref4] gestelde regels binnen Nederland gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0010619#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0010619#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0005662#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0005662#Artikel11
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0010619
        artikel: '9'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0010619
        artikel: '10'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0005662
        artikel: '10'
      - id: ref4
        bwb_id: BWBR0005662
        artikel: '11'
  - number: '13.1'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat degenen die rundersperma verhandelen of vervoeren dienen te
      beschikken over:
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel13
  - number: 13.1.a
    text: |-
      een administratie die de tracering van contacten met een runderspermawincentrum, inseminatoren, dierenartsen,
      vervoerders en gebruikers van het sperma inzichtelijk maakt, en
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel13
  - number: 13.1.b
    text: een calamiteitenplan.
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel13
  - number: '13.2'
    text: 'Bij ministeriële regeling kunnen regels gesteld worden met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel13
  - number: 13.2.a
    text: het mengen van rundersperma afkomstig van verschillende stieren;
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel13
  - number: 13.2.b
    text: het bewerken en opslaan van rundersperma;
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel13
  - number: 13.2.c
    text: de identificatie en registratie van het rundersperma;
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel13
  - number: 13.2.d
    text: het ter beschikking stellen van nader te bepalen monsters van sperma aan een daarbij aan te wijzen instelling;
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel13
  - number: 13.2.e
    text: de in het eerste lid genoemde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel13
  - number: '14.1'
    text: |-
      Het is verboden paardensperma te winnen, tenzij is voldaan aan het bepaalde bij of krachtens [artikel 15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010619#Artikel15
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0010619
        artikel: '15'
        paragraaf: '4'
  - number: '15.1'
    text: Winning van paardensperma geschiedt uitsluitend in een paardenspermawincentrum.
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel15
  - number: '15.2'
    text: 'Bij ministeriële regeling kunnen regels gesteld worden die betrekking hebben op onder meer:'
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel15
  - number: 15.2.a
    text: de identificatie en registratie van op het paardenspermawincentrum aanwezig paardensperma;
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel15
  - number: 15.2.b
    text: de inrichting;
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel15
  - number: 15.2.c
    text: de administratie en
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel15
  - number: 15.2.d
    text: de bedrijfsvoering van het spermawincentrum;
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel15
  - number: '15.3'
    text: 'Bij ministeriële regeling kan worden bepaald dat een paardenspermawincentrum dient te beschikken over:'
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel15
  - number: 15.3.a
    text: |-
      een administratie die de tracering van contacten tussen het paardenspermawincentrum met inseminatoren,
      dierenartsen, vervoerders, handelaren en gebruikers van het sperma inzichtelijk maakt, en
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel15
  - number: 15.3.b
    text: een calamiteitenplan.
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel15
  - number: '15.4'
    text: 'Bij ministeriële regeling kunnen regels gesteld worden met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel15
  - number: 15.4.a
    text: het mengen van paardensperma afkomstig van verschillende hengsten;
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel15
  - number: 15.4.b
    text: het winnen, bewerken en opslaan van paardensperma;
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel15
  - number: 15.4.c
    text: |-
      het ter beschikking stellen van nader te bepalen monsters van op het paardenspermawincentrum aanwezige paarden en
      van op het paardenspermawincentrum aanwezig sperma aan een daarbij aan te wijzen instelling;
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel15
  - number: 15.4.d
    text: het doorgeven van mutaties in het paardenbestand aan de in onderdeel c bedoelde instelling;
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel15
  - number: 15.4.e
    text: de in het derde lid genoemde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel15
  - number: '16'
    text: |-
      Het is verboden paardensperma te vervoeren of te verhandelen, tenzij is voldaan aan het bepaalde bij of krachtens
      de [artikelen 17][ref1] en [18][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010619#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0010619#Artikel18
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0010619
        artikel: '17'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0010619
        artikel: '18'
        paragraaf: '4'
  - number: '17'
    text: |-
      Het paardensperma is overeenkomstig het bepaalde bij of krachtens [artikel 15][ref1] op een paardenspermawincentrum
      gewonnen, bewerkt en opgeslagen of het is, voor zover het paardensperma betreft dat is gewonnen in een buiten
      Nederland gevestigd spermawincentrum, overeenkomstig de krachtens [artikelen 10][ref2] en [11 van de wet][ref3]
      gestelde regels binnen Nederland gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0010619#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0005662#Artikel11
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel17
    references:
      - id: ref1
