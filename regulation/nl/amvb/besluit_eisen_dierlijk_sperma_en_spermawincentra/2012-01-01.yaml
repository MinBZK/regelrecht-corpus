      De erkenning, bedoeld in het eerste lid, wordt uitsluitend verleend indien het runderspermawincentrum voldoet aan
      Bijlage A, de overige relevante bepalingen van [richtlijn 88/407/EEG](31988L0407) en de ter uitvoering van deze
      richtlijn krachtens het derde lid gestelde regels alsmede indien de op het runderspermawincentrum aanwezige stieren
      voldoen aan bijlage B van [richtlijn 88/407/EEG](31988L0407).
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel9
  - number: '9.3'
    text: |-
      Bij ministeriële regeling kunnen ter uitvoering van [richtlijn 88/407/EEG](31988L0407) nadere regels gesteld worden
      met betrekking tot onder meer:
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel9
  - number: 9.3.a
    text: de identificatie en registratie van op het runderspermawincentrum aanwezig rundersperma;
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel9
  - number: 9.3.b
    text: de inrichting;
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel9
  - number: 9.3.c
    text: de administratie, en
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel9
  - number: 9.3.d
    text: de bedrijfsvoering van het spermawincentrum.
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel9
  - number: '9.4'
    text: Aan een erkend runderspermawincentrum wordt in verband met de erkenning een registratienummer toegekend.
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel9
  - number: '9.5'
    text: |-
      Onze Minister kan de erkenning, bedoeld in het eerste lid, intrekken of schorsen indien niet wordt voldaan aan de
      regels, bedoeld in het tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel9
  - number: '9.6'
    text: Een aanvraag tot erkenning wordt ingediend bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel9
  - number: '9.7'
    text: Bij ministeriële regeling kunnen nadere regels gesteld worden omtrent het indienen van een aanvraag.
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel9
  - number: '10.1'
    text: 'Bij ministeriële regeling kan worden bepaald dat een runderspermawincentrum dient te beschikken over:'
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel10
  - number: 10.1.a
    text: |-
      een administratie die de tracering van contacten tussen het runderspermawincentrum met inseminatoren, dierenartsen,
      vervoerders, handelaren en gebruikers van het sperma inzichtelijk maakt, en
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel10
  - number: 10.1.b
    text: een calamiteitenplan.
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel10
  - number: '10.2'
    text: 'Bij ministeriële regeling kunnen regels gesteld worden met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel10
  - number: 10.2.a
    text: het mengen van rundersperma afkomstig van verschillende stieren;
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel10
  - number: 10.2.b
    text: het winnen, bewerken en opslaan van rundersperma;
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel10
  - number: 10.2.c
    text: |-
      het ter beschikking stellen van nader te bepalen monsters van op het runderspermawincentrum aanwezige stieren en
      van op het runderspermawincentrum aanwezig sperma aan een daarbij aan te wijzen instelling;
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel10
  - number: 10.2.d
    text: het doorgeven van mutaties in het stierenbestand aan de in onderdeel c bedoelde instelling;
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel10
  - number: 10.2.e
    text: de in het eerste lid genoemde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel10
  - number: '11'
    text: |-
      Het is verboden rundersperma te vervoeren of te verhandelen, tenzij is voldaan aan het bepaalde bij of krachtens de
      [artikelen 12][ref1] en [13][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010619#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0010619#Artikel13
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel11
