preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Landbouw, Natuurbeheer en Visserij van 21 december 1998, nr.
    TRCJZ/1998/2743, Directie Juridische Zaken;

    Gelet op de artikelen 3, 4, 6, 7, 96 en 108 van de Gezondheids- en welzijnswet voor dieren;

    De Raad van State gehoord (advies van 30 maart 1999, nr. W11.98.0599/V);

    Gezien het nader rapport van de Staatssecretaris van Landbouw, Natuurbeheer en Visserij van 7 juli 1999, nr.
    TRCJZ/1999/4541, Directie Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel1
  - number: 1.a
    text: |-
      wet: de [Gezondheids- en welzijnswet voor dieren][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005662
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005662
  - number: 1.b
    text: 'beer: geslachtsrijp varken van het mannelijk geslacht dat kennelijk bestemd is voor de fokkerij;'
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel1
  - number: 1.c
    text: 'stier: geslachtsrijp rund van het mannelijk geslacht dat kennelijk bestemd is voor de fokkerij;'
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel1
  - number: 1.d
    text: 'varkenssperma: onbewerkt, bewerkt of verdund ejaculaat van een als landbouwhuisdier gehouden varken;'
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel1
  - number: 1.e
    text: 'rundersperma: onbewerkt, bewerkt of verdund ejaculaat van een als landbouwhuisdier gehouden rund;'
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel1
  - number: 1.f
    text: 'paardensperma: onbewerkt, bewerkt of verdund ejaculaat van een als huisdier gehouden paard;'
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel1
  - number: 1.g
    text: 'sperma van schapen of geiten: onbewerkt, bewerkt of verdund ejaculaat van een als huisdier gehouden schaap of geit;'
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel1
  - number: 1.h
    text: |-
      verhandelen: bedrijfsmatig voorhanden of in voorraad hebben, afleveren, te koop aanbieden, kopen of vervreemden,
      daaronder niet begrepen het brengen in Nederland en het anders dan in doorvoer buiten Nederland brengen;
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel1
  - number: 1.i
    text: 'varkensspermawincentrum: inrichting waar beren worden gehouden en varkenssperma wordt gewonnen of bewerkt;'
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel1
  - number: 1.j
    text: 'runderspermawincentrum: inrichting waar stieren worden gehouden en rundersperma wordt gewonnen of bewerkt;'
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel1
  - number: 1.k
    text: 'paardenspermawincentrum: inrichting waar paarden worden gehouden en sperma van paarden wordt gewonnen of bewerkt;'
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel1
  - number: 1.l
    text: |-
      spermawincentrum voor schapen of geiten: inrichting waar schapen of geiten worden gehouden en sperma van schapen of
      geiten wordt gewonnen of bewerkt;
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel1
  - number: 1.m
    text: |-
      vestiging: op één plaats gelegen bedrijf of deel van een bedrijf, bestaande uit de aldaar gelegen aangrenzende
      percelen grond, gebouwen of afgescheiden gedeelten daarvan dat, naar feitelijke omstandigheden beoordeeld, als
      functionele eenheid voor het houden van varkens, runderen, paarden, schapen of geiten in gebruik of daartoe bestemd
      is;
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel1
  - number: 1.n
    text: |-
      [richtlijn 90/429/EEG](31990L0429): [Richtlijn nr. 90/429/EEG](31990L0429) van de Raad van de Europese
      Gemeenschappen van 26 juni 1990 tot vaststelling van de veterinairrechtelijke voorschriften van toepassing op het
      intracommunautaire handelsverkeer in sperma van varkens en de invoer daarvan (PbEG L 224):
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel1
  - number: 1.o
    text: |-
      [richtlijn 88/407/EEG](31988L0407): [Richtlijn nr. 88/407/EEG](31988L0407) van de Raad van 14 juni 1988 tot
      vaststelling van de veterinairrechtelijke voorschriften van toepassing op het intracommunautaire handelsverkeer in
      sperma van runderen en de invoer daarvan (PbEG L 194).
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel1
  - number: 1a
    text: |-
      Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1], is
      [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref2] niet van toepassing op de aanvraag tot erkenning als
      bedoeld in de [artikelen 3][ref3] en [9][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
      [ref3]: https://wetten.overheid.nl/BWBR0010619#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0010619#Artikel9
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
      - id: ref3
        bwb_id: BWBR0010619
        artikel: '3'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0010619
        artikel: '9'
        paragraaf: '3'
  - number: '2.1'
    text: |-
      Het is verboden varkenssperma te winnen, tenzij is voldaan aan het bepaalde bij of krachtens de [artikelen 3][ref1]
      en [4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010619#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010619#Artikel4
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0010619
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0010619
        artikel: '4'
        paragraaf: '2'
  - number: '2.2'
    text: |-
      Het eerste lid is niet van toepassing op het winnen van varkenssperma op een vestiging ten behoeve van kunstmatige
      inseminatie van de op deze vestiging aanwezige varkens.
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel2
  - number: '3.1'
    text: Winning van varkenssperma geschiedt uitsluitend in een door Onze Minister erkend varkensspermawincentrum.
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel3
  - number: '3.2'
    text: |-
      De erkenning, bedoeld in het eerste lid, wordt uitsluitend verleend indien het varkensspermawincentrum voldoet aan
      Bijlage A, de overige relevante bepalingen van [richtlijn 90/429/EEG](31990L0429) en de ter uitvoering van deze
      richtlijn krachtens het derde lid gestelde regels alsmede indien de op het varkensspermawincentrum aanwezige beren
      voldoen aan bijlage B van [richtlijn 90/429/EEG](31990L0429).
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel3
  - number: '3.3'
    text: |-
      Bij ministeriële regeling kunnen ter uitvoering van [richtlijn 90/429/EEG](31990L0429) nadere regels gesteld worden
      met betrekking tot onder meer:
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel3
  - number: 3.3.a
    text: de individuele identificatie en registratie van op het spermawincentrum aanwezige beren;
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel3
  - number: 3.3.b
    text: de identificatie en registratie van op het varkensspermawincentrum aanwezig varkenssperma;
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel3
  - number: 3.3.c
    text: de inrichting;
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel3
  - number: 3.3.d
    text: de administratie, en
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel3
  - number: 3.3.e
    text: de bedrijfsvoering van het spermawincentrum.
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel3
  - number: '3.4'
    text: Aan een erkend varkensspermawincentrum wordt in verband met de erkenning een registratienummer toegekend.
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel3
  - number: '3.5'
    text: |-
      Onze Minister kan de erkenning, bedoeld in het eerste lid, intrekken of schorsen indien niet wordt voldaan aan de
      regels, bedoeld in het tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel3
  - number: '3.6'
    text: Een aanvraag tot erkenning wordt ingediend bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel3
  - number: '3.7'
    text: Bij ministeriële regeling kunnen nadere regels gesteld worden omtrent het indienen van een aanvraag.
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel3
  - number: '4.1'
    text: 'Een varkensspermawincentrum dient te beschikken over:'
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel4
  - number: 4.1.a
    text: |-
      een administratie die de tracering van contacten tussen het varkensspermawincentrum met inseminatoren,
      dierenartsen, vervoerders, handelaren en gebruikers van het sperma inzichtelijk maakt, en
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel4
  - number: 4.1.b
    text: een calamiteitenplan.
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel4
  - number: '4.2'
    text: 'Bij ministeriële regeling kunnen regels gesteld worden met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel4
  - number: 4.2.a
    text: het mengen van varkenssperma afkomstig van verschillende beren;
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel4
  - number: 4.2.b
    text: het winnen, bewerken en opslaan van varkenssperma;
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel4
  - number: 4.2.c
    text: |-
      het ter beschikking stellen van nader te bepalen monsters van op het varkensspermawincentrum aanwezige beren en van
      op het varkensspermawincentrum aanwezig sperma aan een daarbij aan te wijzen instelling;
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel4
  - number: 4.2.d
    text: het doorgeven van mutaties in het berenbestand aan de in onderdeel c bedoelde instelling;
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel4
  - number: 4.2.e
    text: de in het eerste lid genoemde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel4
  - number: '5'
    text: |-
      Het is verboden varkenssperma te vervoeren of te verhandelen, tenzij is voldaan aan het bepaalde bij of krachtens
      de [artikelen 6][ref1] en [7][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010619#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0010619#Artikel7
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0010619
        artikel: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0010619
        artikel: '7'
        paragraaf: '2'
  - number: '6'
    text: |-
      Het varkenssperma is overeenkomstig het bepaalde bij of krachtens de [artikelen 3][ref1] en [4][ref2] op een
      varkensspermawincentrum gewonnen, bewerkt en opgeslagen of het is, voor zover het varkenssperma betreft dat is
      gewonnen in een buiten Nederland gevestigd spermawincentrum, overeenkomstig de krachtens [artikelen 10][ref3] en
      [11 van de wet][ref4] gestelde regels binnen Nederland gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0010619#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010619#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005662#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0005662#Artikel11
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0010619
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0010619
        artikel: '4'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005662
        artikel: '10'
      - id: ref4
        bwb_id: BWBR0005662
        artikel: '11'
  - number: '7.1'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat degenen die varkenssperma vervoeren of verhandelen dienen te
      beschikken over:
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel7
  - number: 7.1.a
    text: |-
      een administratie die de tracering van contacten met een varkensspermawincentrum, inseminatoren, dierenartsen,
      vervoerders, handelaren en gebruikers van het sperma inzichtelijk maakt, en
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel7
  - number: 7.1.b
    text: een calamiteitenplan.
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel7
  - number: '7.2'
    text: 'Bij ministeriële regeling kunnen regels gesteld worden met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel7
  - number: 7.2.a
    text: het mengen van varkenssperma afkomstig van verschillende beren;
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel7
  - number: 7.2.b
    text: het bewerken en opslaan van varkenssperma;
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel7
  - number: 7.2.c
    text: de identificatie en registratie van het varkenssperma;
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel7
  - number: 7.2.d
    text: het ter beschikking stellen van nader te bepalen monsters van sperma aan een daarbij aan te wijzen instelling;
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel7
  - number: 7.2.e
    text: de in het eerste lid genoemde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel7
  - number: '8.1'
    text: |-
      Het is verboden rundersperma te winnen, tenzij is voldaan aan het bepaalde bij of krachtens de [artikelen 9][ref1]
      en [10][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010619#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0010619#Artikel10
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0010619
        artikel: '9'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0010619
        artikel: '10'
        paragraaf: '3'
  - number: '8.2'
    text: |-
      Het eerste lid is niet van toepassing op het winnen van rundersperma op een vestiging ten behoeve van kunstmatige
      inseminatie van de op deze vestiging aanwezige runderen.
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel8
  - number: '9.1'
    text: Winning van rundersperma geschiedt uitsluitend in een door Onze Minister erkend runderspermawincentrum.
    url: https://wetten.overheid.nl/BWBR0010619/2012-01-01#Artikel9
