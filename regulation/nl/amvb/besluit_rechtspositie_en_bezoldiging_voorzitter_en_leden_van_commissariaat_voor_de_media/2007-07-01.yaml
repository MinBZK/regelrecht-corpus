preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Welzijn, Volksgezondheid en Cultuur van 29 mei 1989, MLB/J/OP/U-140 I;

    Gelet op artikel 10, vijfde lid en artikel 124, vijfde lid van de Mediawet (Stb. 1987, 249); artikel 125 van de
    Ambtenarenwet 1929 (Stb. 1929, 530);

    De Raad van State gehoord (advies van 29 augustus 1989, no. W13.89.0307);

    Gezien het nader rapport van Onze Minister van Welzijn, Volksgezondheid en Cultuur van 18 oktober 1989, MLB/J/OP-
    927 I;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004641/2007-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Het college van commissarissen van het Commissariaat voor de Media alsmede het bestuur van het Stimuleringsfonds
      voor de pers stellen een rechtspositieregeling ten behoeve van het personeel vast, die gelijkwaardig is aan de op
      de Rijksambtenaren van toepassing zijnde regelingen, voor zover daarvan niet in dit besluit wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0004641/2007-07-01#Artikel1
  - number: '2'
    text: |-
      Het college van commissarissen van het Commissariaat voor de Media en het bestuur van het Stimuleringsfonds
      voor de pers benoemen en ontslaan het personeel van respectievelijk het Commissariaat voor de Media en het
      Stimuleringsfonds voor de pers.
    url: https://wetten.overheid.nl/BWBR0004641/2007-07-01#Artikel2
  - number: '3.1'
    text: |-
      De leden van het Commissariaat voor de Media worden bezoldigd volgens het hoogste salarisnummer behorende bij
      schaal 17 als vermeld in [bijlage B van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1], op basis
      van een volledige werkweek.


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0004641/2007-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: '3.2'
    text: |-
      Bij ministeriële regeling wordt, na overleg met de leden van het Commissariaat, de gemiddelde arbeidsduur per
      week over de periode van een jaar, tot ten hoogste 36 uur per week, vastgesteld. Indien de gemiddelde arbeidsduur
      op minder dan een volledige werkweek wordt vastgesteld, wordt de bezoldiging, bedoeld in het eerste lid, naar
      evenredigheid vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004641/2007-07-01#Artikel3
  - number: '3.3'
    text: |-
      De bezoldiging van de leden wordt in maandelijkse termijnen betaald en wordt niet langer uitbetaald dan tot en met
      de dag van hun overlijden.
    url: https://wetten.overheid.nl/BWBR0004641/2007-07-01#Artikel3
  - number: '3.4'
    text: |-
      De leden van het Commissariaat hebben recht op een vakantie-uitkering overeenkomstig de [artikelen 21][ref1] en
      [22 van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0003630#Artikel22
    url: https://wetten.overheid.nl/BWBR0004641/2007-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0003630
        artikel: '22'
  - number: '3.5'
    text: |-
      De leden van het Commissariaat ontvangen een tegemoetkoming in de ziektekosten overeenkomstig het
      [Besluit tegemoetkoming ziektekosten rijkspersoneel][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006855
    url: https://wetten.overheid.nl/BWBR0004641/2007-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006855
  - number: '3.6'
    text: |-
      De leden van het Commissariaat hebben recht op een vergoeding voor reis- en verblijfkosten overeenkomstig het
      [Reisbesluit binnenland][ref1] en het [Reisbesluit buitenland][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005889
      [ref2]: https://wetten.overheid.nl/BWBR0006842
    url: https://wetten.overheid.nl/BWBR0004641/2007-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005889
      - id: ref2
        bwb_id: BWBR0006842
  - number: '3.7'
    text: |-
      De leden van het Commissariaat ontvangen een representatievergoeding overeenkomstig het
      [Besluit vergoeding representatiekosten rijkspersoneel][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006102
    url: https://wetten.overheid.nl/BWBR0004641/2007-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006102
  - number: '3.8'
    text: |-
      Het Commissariaat regelt de overige vergoedingen van kosten van de leden die verband houden met de uitoefening
      van hun functie. Deze regels behoeven de goedkeuring van Onze Minister van Onderwijs, Cultuur en Wetenschap.
      Goedkeuring kan slechts worden onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0004641/2007-07-01#Artikel3
  - number: '4.1'
    text: |-
      In geval van arbeidsongeschiktheid wegens ziekte ontvangen de leden van het Commissariaat voor de Media volledige
      doorbetaling van hun bezoldiging tot aan het tijdstip van toekenning van een invaliditeitspensioen op grond van het
      Pensioenreglement van de Stichting Pensioenfonds Abp, met dien verstande dat de doorbetaling in ieder geval eindigt
      op de dag waarop de benoemingstermijn eindigt.
    url: https://wetten.overheid.nl/BWBR0004641/2007-07-01#Artikel4
  - number: '4.2'
    text: |-
      Aanspraken op uitkeringen in verband met arbeidsongeschiktheid wegens ziekte op grond van enige sociale
      verzekeringswet worden in mindering gebracht op de doorbetaling van de bezoldiging.
    url: https://wetten.overheid.nl/BWBR0004641/2007-07-01#Artikel4
  - number: 4a.1
    text: |-
      Indien een lid van het Commissariaat na ommekomst van de benoemingstermijn niet wordt herbenoemd, heeft hij
      aanspraak op een uitkering overeenkomstig de volgende leden.
    url: https://wetten.overheid.nl/BWBR0004641/2007-07-01#Artikel4a
  - number: 4a.2
    text: |-
      De uitkering, bedoeld in het eerste lid, wordt toegekend voor een periode gelijk aan het tijdvak waarin betrokkene
      zonder onderbreking als lid van het Commissariaat heeft gefungeerd, met dien verstande dat de uitkering in ieder
      geval eindigt met ingang van de dag waarop betrokkene de leeftijd van 65 jaar heeft bereikt of met ingang van de
      dag volgende op die waarop betrokkene is overleden.
    url: https://wetten.overheid.nl/BWBR0004641/2007-07-01#Artikel4a
  - number: 4a.3
    text: |-
      De uitkering, bedoeld in het eerste lid, wordt niet toegekend indien betrokkene op eigen verzoek niet als lid van
      het Commissariaat wordt herbenoemd of herbenoeming weigert.
    url: https://wetten.overheid.nl/BWBR0004641/2007-07-01#Artikel4a
  - number: 4a.4
    text: |-
      De uitkering, bedoeld in het eerste lid, bedraagt gedurende het eerste jaar 80% en vervolgens 70% van de
      laatstelijk als lid van het Commissariaat genoten bruto bezoldiging, vermeerderd met de vakantie-uitkering.
    url: https://wetten.overheid.nl/BWBR0004641/2007-07-01#Artikel4a
  - number: 4a.5
    text: |-
      Indien in de bezoldiging van het rijkspersoneel een wijziging wordt aangebracht, wordt de in het vierde lid
      bedoelde laatstelijk genoten bezoldiging voor de toepassing van dat lid met ingang van het tijdstip van ingang van
      de bezoldigingswijziging overeenkomstig aangepast.
    url: https://wetten.overheid.nl/BWBR0004641/2007-07-01#Artikel4a
  - number: 4a.6
    text: |-
      Inkomsten uit of in verband met arbeid of bedrijf die niet reeds werden genoten tijdens de uitoefening van de
      functie, worden met de uitkering verrekend. Deze verrekening geschiedt aldus dat de uitkering wordt verminderd
      met het bedrag waarmee de uitkering, vermeerderd met die inkomsten, de laatstelijk genoten bruto-bezoldiging en de
      vakantie-uitkering, waarvan de uitkering is afgeleid, met een bij ministeriële regeling vast te stellen percentage
      of meer overschrijdt.
    url: https://wetten.overheid.nl/BWBR0004641/2007-07-01#Artikel4a
  - number: 4b
    text: |-
      Het Commissariaat voor de Media is belast met de uitvoering van de [artikelen 3 tot en met 4a][ref1]. De daaruit
      voortvloeiende kosten van bezoldiging, uitkeringen en vergoedingen komen ten laste van het Commissariaat.


      [ref1]: https://wetten.overheid.nl/BWBR0004641#Artikel3
    url: https://wetten.overheid.nl/BWBR0004641/2007-07-01#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0004641
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '5.1'
    text: |-
      Het is de leden van het Commissariaat voor de Media bij de uitoefening van hun functie verboden vergoedingen,
      beloningen, giften of beloften van derden te vorderen, te verzoeken of aan te nemen.
    url: https://wetten.overheid.nl/BWBR0004641/2007-07-01#Artikel5
  - number: '5.2'
    text: |-
      De leden van het Commissariaat melden terstond aan Onze Minister van Onderwijs, Cultuur en Wetenschap de
      nevenfuncties die zij vervullen bij de aanvang van de uitoefening van hun functie of die zij tijdens de uitoefening
      van hun functie aanvaarden of beëindigen. Zij doen desgevraagd aan genoemde minister schriftelijk opgave van de aan
      die nevenfuncties verbonden beloningen.
    url: https://wetten.overheid.nl/BWBR0004641/2007-07-01#Artikel5
  - number: '6'
    text: 'Voor het personeel afkomstig van het bureau van de Regeringscommissaris voor de Omroep geldt aanvullend:'
    url: https://wetten.overheid.nl/BWBR0004641/2007-07-01#Artikel6
  - number: '6.1'
    text: |-
      Het aantal vakantiedagen plus de zogenaamde vergrijzingsdagen, waarop zij op 31 december 1987 recht hadden, wordt
      ongewijzigd gehandhaafd met dien verstande dat dit aantal dagen nimmer minder zal zijn dan dat waarop ingevolge het
      [Algemeen Rijksambtenarenreglement][ref1] aanspraak bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0001950
    url: https://wetten.overheid.nl/BWBR0004641/2007-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001950
  - number: '6.2'
    text: |-
      Degenen die op 31 december 1987 arbeidsongeschikt waren behouden hun rechten op doorbetaling van salaris bij ziekte
      op grond van de voor hen op dat moment geldende regeling.
    url: https://wetten.overheid.nl/BWBR0004641/2007-07-01#Artikel6
  - number: '6.3'
    text: |-
      Degenen die op 31 december 1987 op grond van de dan geldende studiekostenregeling een studie volgden, houden hun
      rechten op vergoeding op grond van die regeling en uitsluitend voor de reeds aangevangen studie.
    url: https://wetten.overheid.nl/BWBR0004641/2007-07-01#Artikel6
  - number: '7'
    text: |-
      Diensttijd doorgebracht bij het bureau van de Regeringscommissaris voor de Omroep en de Nederlandse Omroep
      Stichting, wordt beschouwd als diensttijd doorgebracht bij het Commissariaat voor de Media voor degenen, die direct
      aansluitend op hun dienstverband bij het bureau van de Regeringscommissaris voor de Omroep en de Nederlandse Omroep
      Stichting in dienst treden bij het Commissariaat voor de Media.
    url: https://wetten.overheid.nl/BWBR0004641/2007-07-01#Artikel7
  - number: '8.1'
    text: |-
      Voor de salariëring is van toepassing het [Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0004641/2007-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: '8.2'
    text: |-
      De inschaling in de salaristabel als bedoeld in
      [bijlage B van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1] geschiedt zodanig dat:


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0004641/2007-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: 8.2.a
    text: |-
      degene die met behoud van functie en/of schaal overgaat en die bovendien werd bezoldigd volgens dit besluit,
      hetzelfde salarisnummer behoudt;
    url: https://wetten.overheid.nl/BWBR0004641/2007-07-01#Artikel8
  - number: 8.2.b
    text: |-
      degene die met behoud van functie en/of schaal overgaat het salarisnummer krijgt behorende bij het bruto salaris
      dat het dichtst bij en niet lager dan zijn laatstverdiende bruto salaris ligt;
    url: https://wetten.overheid.nl/BWBR0004641/2007-07-01#Artikel8
  - number: 8.2.c
    text: |-
      voor degene die een andere functie en schaal krijgt, zijn laatstverdiende bruto salaris de ondergrens voor
      herinschaling vormt.
    url: https://wetten.overheid.nl/BWBR0004641/2007-07-01#Artikel8
  - number: '8.3'
    text: |-
      Schriftelijke toezeggingen met betrekking tot de inschaling en bevordering, welke door of namens het bevoegd gezag
      voor de overgang zijn gedaan, worden gehonoreerd.
    url: https://wetten.overheid.nl/BWBR0004641/2007-07-01#Artikel8
  - number: '8.4'
    text: |-
      Indien bij het in het eerste lid bedoelde salarisnummer een hoger bedrag hoort dan het maximum van de salarisschaal
      waarop betrokkene wordt ingeschaald, wordt het verschil tussen die twee salarisnummers in de vorm van een
      persoonsgebonden toelage uitgekeerd.
    url: https://wetten.overheid.nl/BWBR0004641/2007-07-01#Artikel8
  - number: '9.1'
    text: |-
      De leden van het bestuur van het Stimuleringsfonds worden bezoldigd volgens het hoogste salarisnummer behorende bij
      schaal 17 als vermeld in [bijlage B van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1], op basis
      van een volledige werkweek.


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0004641/2007-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: '9.2'
    text: |-
      Bij ministeriële regeling wordt, na overleg met de leden van het bestuur van het Stimuleringsfonds, de gemiddelde
      arbeidsduur over de periode van een jaar, tot ten hoogste 36 uur per week, vastgesteld. Indien de gemiddelde
      arbeidsduur op minder dan een volledige werkweek wordt vastgesteld, wordt de bezoldiging, bedoeld in het eerste
      lid, naar evenredigheid vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004641/2007-07-01#Artikel9
  - number: '9.3'
    text: |-
      De bezoldiging van de leden van het bestuur wordt in maandelijkse termijnen betaald en wordt niet langer uitbetaald
      dan tot en met de dag van hun overlijden.
    url: https://wetten.overheid.nl/BWBR0004641/2007-07-01#Artikel9
  - number: '9.4'
    text: |-
      De leden van het bestuur van het Stimuleringsfonds hebben recht op een vakantie-uitkering overeenkomstig de
      [artikelen 21][ref1] en [22 van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0003630#Artikel22
    url: https://wetten.overheid.nl/BWBR0004641/2007-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0003630
        artikel: '22'
  - number: '9.5'
    text: |-
      De leden van het bestuur van het Stimuleringsfonds hebben recht op een vergoeding voor reis- en verblijfkosten
      overeenkomstig het [Reisbesluit binnenland][ref1] en het [Reisbesluit buitenland][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005889
      [ref2]: https://wetten.overheid.nl/BWBR0006842
    url: https://wetten.overheid.nl/BWBR0004641/2007-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005889
      - id: ref2
        bwb_id: BWBR0006842
  - number: '9.6'
    text: |-
      De leden van het bestuur van het Stimuleringsfonds ontvangen een representatievergoeding overeenkomstig het
      [Besluit vergoeding representatiekosten rijkspersoneel][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006102
    url: https://wetten.overheid.nl/BWBR0004641/2007-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006102
  - number: '9.7'
    text: |-
      Het Stimuleringsfonds regelt de overige vergoedingen van de leden van het bestuur voor kosten die verband houden
      met de uitoefening van hun functie. Deze regels behoeven de goedkeuring van Onze Minister van Onderwijs, Cultuur en
      Wetenschap. Goedkeuring kan slechts worden onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0004641/2007-07-01#Artikel9
  - number: '10'
    text: |-
      Het Stimuleringsfonds voor de pers is belast met de uitvoering van [artikel 9][ref1]. De daaruit voortvloeiende
      kosten van bezoldiging, uitkeringen en vergoedingen komen ten laste van het Stimuleringsfonds.


      [ref1]: https://wetten.overheid.nl/BWBR0004641#Artikel9
    url: https://wetten.overheid.nl/BWBR0004641/2007-07-01#Artikel10
    references:
      - id: ref1
