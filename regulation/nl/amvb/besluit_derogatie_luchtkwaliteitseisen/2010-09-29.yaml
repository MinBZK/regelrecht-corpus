    text: |-
      Voor de in [artikel 2][ref1] aangewezen zones en agglomeraties is het tijdstip, bedoeld in voorschrift 2.1a van
      [bijlage 2 van de wet][ref2]: 1 januari 2015.


      [ref1]: https://wetten.overheid.nl/BWBR0026308#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003245
