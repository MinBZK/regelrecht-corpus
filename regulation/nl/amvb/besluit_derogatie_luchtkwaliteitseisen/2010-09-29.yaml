  - number: '2'
    text: |-
      Als de zones en agglomeraties, bedoeld in voorschrift 2.1a, onder b, van [bijlage 2 van de wet][ref1], worden
      aangewezen de krachtens [artikel 5.22, eerste lid, van de wet][ref2], aangewezen zones en agglomeraties.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel5
