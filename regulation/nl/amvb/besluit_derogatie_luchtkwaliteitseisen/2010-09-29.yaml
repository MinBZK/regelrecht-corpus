  - number: '3.2'
    text: |-
      In afwijking van het eerste lid is het daar bedoelde tijdstip voor de agglomeratie Heerlen/Kerkrade: 1 januari
      2013.
    url: https://wetten.overheid.nl/BWBR0026308/2010-09-29#Artikel3
  - number: '4.1'
    text: |-
      Als de zones en agglomeraties, bedoeld in voorschrift 4.2, onder a, van [bijlage 2 van de wet][ref1], worden
      aangewezen de krachtens [artikel 5.22, eerste lid, van de wet][ref2], aangewezen zone midden en de agglomeraties
      Amsterdam/Haarlem, Rotterdam/Dordrecht en Utrecht.


