$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_vervoer_gevaarlijke_stoffen_door_de_lucht
regulatory_layer: AMVB
publication_date: '2023-06-12'
valid_from: '2023-06-13'
bwb_id: BWBR0013514
url: https://wetten.overheid.nl/BWBR0013514/2023-06-13
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 6 juni 2001, nr. DGRLD/DLB/01.421019, Directoraat-
    Generaal Rijksluchtvaartdienst, gedaan mede namens Onze Minister van Defensie;

    Gelet op de artikelen 6.51, 6.52, 6.53, 6.55, tweede en derde lid, van de Wet luchtvaart en op artikel 28, vijfde
    lid, van de Wet Raad voor de Transportveiligheid;

    De Raad van State gehoord (advies van 16 juli 2001, nr. W09.01.0264/V);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 7 maart 2002, nr. DGL/02.421024,
    Directoraat-Generaal Luchtvaart, uitgebracht mede namens Onze Minister van Defensie;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0013514/2023-06-13#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - afzender: natuurlijke persoon of een
      rechtspersoon, die gevaarlijke stoffen, in eigendom aan hem toebehorend of afkomstig uit eigen onderneming, aan kan
      bieden voor vervoer door de lucht;
        - Annex 18: ingevolge een mededeling van Onze Minister van Infrastructuur en Waterstaat gepubliceerd
      in de Staatscourant van kracht zijnde versie van de op grond van de artikelen 37, 54 en 90 van het op 7
      december 1944 te Chicago gesloten Verdrag inzake de Burgerluchtvaart (Trb. 1973, 109) door de Internationale
      Burgerluchtvaartorganisatie vastgestelde Annex 18 (The Safe Transport of Dangerous Goods by Air), zoals ter inzage
      gelegd op de bij die mededeling aangegeven locatie;
        - expediteur-luchtvrachtagent: natuurlijke persoon of een rechtspersoon die gevaarlijke stoffen door de lucht kan
      doen vervoeren;
        - grondafhandelaar: natuurlijke persoon of een rechtspersoon die namens de houder van een luchtvaartuig de
      acceptatie of het laden en lossen van gevaarlijke stoffen kan verrichten;
        - logistieke dienstverlener: natuurlijke persoon of rechtspersoon die gevaarlijke stoffen die hij contractueel voor
      derden in opslag heeft namens de eigenaar verzendklaar kan maken en als afzender kan aanbieden voor vervoer door
      de lucht;
        - Technische Voorschriften: ingevolge een mededeling van Onze Minister van Infrastructuur en Waterstaat
      gepubliceerd in de Staatscourant van kracht zijnde versie van de bij Annex 18 behorende «Technical Instructions for
      the Safe Transport of Dangerous Goods by Air», Doc 9284, inclusief het Supplement, zoals ter inzage gelegd op de
      bij die mededeling aangegeven locatie;
        - wet: [Wet luchtvaart][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555
    url: https://wetten.overheid.nl/BWBR0013514/2023-06-13#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005555
  - number: '2'
    text: |-
      Als gevaarlijke stoffen, bedoeld in [artikel 6.51, eerste lid, van de wet][ref1] worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel6
    url: https://wetten.overheid.nl/BWBR0013514/2023-06-13#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '6'
  - number: 2.1°
    text: ontplofbare stoffen en voorwerpen;
    url: https://wetten.overheid.nl/BWBR0013514/2023-06-13#Artikel2
  - number: 2.2°
    text: samengeperste, vloeibaar gemaakte of onder druk opgeloste gassen;
    url: https://wetten.overheid.nl/BWBR0013514/2023-06-13#Artikel2
  - number: 2.3°
    text: brandbare vloeistoffen;
    url: https://wetten.overheid.nl/BWBR0013514/2023-06-13#Artikel2
  - number: 2.4°
    text: |-
      brandbare vaste stoffen, voor zelfontbranding vatbare stoffen en stoffen, die bij aanraking met water brandbare
      gassen ontwikkelen;
    url: https://wetten.overheid.nl/BWBR0013514/2023-06-13#Artikel2
  - number: 2.5°
    text: stoffen die de verbranding bevorderen en organische peroxiden;
    url: https://wetten.overheid.nl/BWBR0013514/2023-06-13#Artikel2
  - number: 2.6°
    text: giftige of infectueuze stoffen;
    url: https://wetten.overheid.nl/BWBR0013514/2023-06-13#Artikel2
  - number: 2.7°
    text: radioactieve stoffen;
    url: https://wetten.overheid.nl/BWBR0013514/2023-06-13#Artikel2
  - number: 2.8°
    text: bijtende stoffen;
    url: https://wetten.overheid.nl/BWBR0013514/2023-06-13#Artikel2
  - number: 2.9°
    text: |-
      andere stoffen of voorwerpen, die bij vervoer door de lucht gevaar kunnen opleveren voor de gezondheid, de
      veiligheid of het milieu; zoals vastgelegd en geclassificeerd in de Technische Voorschriften.
    url: https://wetten.overheid.nl/BWBR0013514/2023-06-13#Artikel2
  - number: '3.1'
    text: |-
      Het in [artikel 6.51, eerste lid, van de wet][ref1] bedoelde verbod geldt niet voor de daar bedoelde handelingen
      ten aanzien van de in [artikel 2][ref2] aangewezen gevaarlijke stoffen, voorzover daarbij Annex 18 en de Technische
      Voorschriften in acht worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0013514#Artikel2
    url: https://wetten.overheid.nl/BWBR0013514/2023-06-13#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0013514
        artikel: '2'
        paragraaf: '1'
  - number: '3.2'
    text: |-
      Onze Minister van Defensie kan bepaalde gedeelten van Annex 18 en de Technische Voorschriften aanwijzen, welke in
      afwijking van het eerste lid, niet door de krijgsmacht of de krijgsmacht van een buitenlandse mogendheid in acht
      behoeven te worden genomen. Onze Minister van Defensie kan daarbij bepalen dat in dat geval door de krijgsmacht
      of de krijgsmacht van een buitenlandse mogendheid internationale militaire voorschriften in acht dienen te worden
      genomen.
    url: https://wetten.overheid.nl/BWBR0013514/2023-06-13#Artikel3
  - number: '4'
    text: |-
      Bij regeling van Onze Minister van Infrastructuur en Waterstaat respectievelijk van Onze Minister van Defensie
      kunnen regels worden gesteld ten aanzien van de constructie, inrichting en uitrusting van luchtvaartuigen waarmee
      gevaarlijke stoffen worden vervoerd.
    url: https://wetten.overheid.nl/BWBR0013514/2023-06-13#Artikel4
  - number: '5'
    text: |-
      Bij regeling van Onze Minister van Infrastructuur en Waterstaat respectievelijk van Onze Minister van Defensie
      kunnen in verband met de veiligheid of het milieu regels worden gesteld met betrekking tot de constructie,
      inrichting en uitrusting van inrichtingen, voertuigen of werktuigen met behulp waarvan gevaarlijke stoffen op een
      luchthaven worden geladen of gelost.
    url: https://wetten.overheid.nl/BWBR0013514/2023-06-13#Artikel5
  - number: '6'
    text: |-
      Bij regeling van Onze Minister van Infrastructuur en Waterstaat respectievelijk van Onze Minister van Defensie
      kunnen regels worden gesteld met betrekking tot de keuring van de inrichtingen, voertuigen en werktuigen bedoeld
      in [artikel 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013514#Artikel5
    url: https://wetten.overheid.nl/BWBR0013514/2023-06-13#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013514
        artikel: '5'
        paragraaf: '2'
  - number: '7'
    text: |-
      Bij regeling van Onze Minister van Infrastructuur en Waterstaat respectievelijk van Onze Minister van Defensie
      kunnen in het belang van de veiligheid of het milieu regels worden gesteld over het opstellen van een risico-
      inventarisatie met betrekking tot het vervoeren, laden of lossen van daartoe aangewezen gevaarlijke stoffen.
    url: https://wetten.overheid.nl/BWBR0013514/2023-06-13#Artikel7
  - number: '8'
    text: |-
      Onze Minister van Infrastructuur en Waterstaat respectievelijk Onze Minister van Defensie kan in het belang van
      de veiligheid of het milieu luchtroutes aanwijzen waarlangs daartoe aangewezen gevaarlijke stoffen vervoerd dienen
      te worden.
    url: https://wetten.overheid.nl/BWBR0013514/2023-06-13#Artikel8
  - number: '9.1'
    text: 'Onze Minister van Infrastructuur en Waterstaat kan de navolgende erkenningen verlenen:'
    url: https://wetten.overheid.nl/BWBR0013514/2023-06-13#Artikel9
  - number: 9.1.1°
    text: |-
      een A-erkenning: een erkenning voor een afzender, zijnde een natuurlijke persoon of een rechtspersoon, welke de
      bevoegdheid geeft om gevaarlijke stoffen, in eigendom aan hem toebehorend of afkomstig uit eigen onderneming, aan
      te bieden voor vervoer door de lucht;
    url: https://wetten.overheid.nl/BWBR0013514/2023-06-13#Artikel9
  - number: 9.1.2°
    text: |-
      een B-erkenning: een erkenning voor een expediteur-luchtvrachtagent, zijnde een natuurlijke persoon of een
      rechtspersoon, welke de bevoegdheid geeft om gevaarlijke stoffen door de lucht te doen vervoeren;
    url: https://wetten.overheid.nl/BWBR0013514/2023-06-13#Artikel9
  - number: 9.1.3°
    text: |-
      een C-erkenning: een erkenning voor een grondafhandelaar, zijnde een natuurlijke persoon of een rechtspersoon,
      welke de bevoegdheid geeft om namens de houder van een luchtvaartuig de acceptatie of het laden en lossen van
      gevaarlijke stoffen te verrichten;
    url: https://wetten.overheid.nl/BWBR0013514/2023-06-13#Artikel9
  - number: 9.1.4°
    text: |-
      een D-erkenning: een erkenning voor een logistieke dienstverlener, zijnde een natuurlijke persoon of een
      rechtspersoon, welke de bevoegdheid geeft om gevaarlijke stoffen welke hij contractueel voor derden in opslag
      heeft, namens de eigenaar verzendklaar te maken en als afzender aan te bieden voor vervoer door de lucht;
    url: https://wetten.overheid.nl/BWBR0013514/2023-06-13#Artikel9
  - number: 9.1.5°
    text: |-
      een E-erkenning: een erkenning voor een in het vervoer door de lucht gespecialiseerde organisatie met
      rechtspersoonlijkheid welke de bevoegdheid geeft om in opdracht van derden op te treden als afzender en verpakker
      van gevaarlijke stoffen alsook om de binnenverpakkingen van zendingen te herverpakken en af te vullen.
    url: https://wetten.overheid.nl/BWBR0013514/2023-06-13#Artikel9
  - number: '9.2'
    text: Een erkenning wordt verleend voor onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0013514/2023-06-13#Artikel9
  - number: '9.3'
    text: |-
      Om in aanmerking te kunnen komen voor de verlening van een erkenning voldoet de aanvrager aan de bij regeling
      van Onze Minister van Infrastructuur en Waterstaat vastgestelde eisen die voor de verschillende erkenningen
      verschillend kunnen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0013514/2023-06-13#Artikel9
  - number: 9a.1
    text: |-
      Op verzoek van een logistiek dienstverlener zet Onze Minister van Infrastructuur en Waterstaat een aan die
      dienstverlener afgegeven E-erkenning om naar een D-erkenning.
    url: https://wetten.overheid.nl/BWBR0013514/2023-06-13#Artikel9a
  - number: 9a.2
    text: |-
      Een verzoek als bedoeld in het eerste lid kan tot 1 juli 2023 worden ingediend bij Onze Minister van Infrastructuur
      en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0013514/2023-06-13#Artikel9a
  - number: 9a.3
    text: |-
      Met ingang van 1 juli 2023 wordt een D-erkenning aangevraagd overeenkomstig de krachtens het derde lid van
      [artikel 9][ref1] vastgestelde regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0013514#Artikel9
    url: https://wetten.overheid.nl/BWBR0013514/2023-06-13#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0013514
        artikel: '9'
        paragraaf: '4'
  - number: '12'
    text: |-
      Dit besluit treedt in werking op het tijdstip waarop
