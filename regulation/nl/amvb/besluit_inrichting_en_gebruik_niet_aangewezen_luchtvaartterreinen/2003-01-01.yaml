  - number: '7'
    text: |-
      1 De aanleg, inrichting en uitrusting van een helihaven moet, ter beoordeling door Onze Minister zodanig zijn
      dat hefschroefvliegtuigen daarvan een veilig gebruik kunnen maken. Hiertoe dienen desgevraagd gegevens te worden
      overgelegd.

      2 Er moeten ten genoegen van Onze Minister voorzieningen worden getroffen dat de in- en uitvliegsectoren zodanig
      zullen zijn dat hefschroefvliegtuigen veilig kunnen landen op en opstijgen van de helihaven.

      3 Voor de beoordeling als bedoeld in het eerste lid moeten in ieder geval de volgende gegevens worden overgelegd:

      a. de lengte over alles van het grootste hefschroefvliegtuig dat van de helihaven gebruik gaat maken;

      b. de reden/redenen waarom de helihaven nodig wordt geacht en het beoogde gebruik dat ervan zal worden gemaakt;

      c. de gemeente waarin de helihaven is gelegen;

      d. de afmetingen van het terrein of van het platform dat als helihaven zal worden aangelegd;

      e. een duidelijke kaart waaruit de geografische ligging en de aard inclusief hoogtegegevens van de omgeving van het
      betrokken terrein of platform duidelijk blijft;

      f. een verklaring van geen bezwaar van de eigenaar of zakelijk gerechtigde van het betrokken terrein of platform;

      g. een verklaring van geen bezwaar van de burgemeester van de gemeente waarin het betrokken terrein of het platform
      is gelegen.

      4 Het gestelde in het derde lid onder *c* en *g* is niet van toepassing op een helihaven op installaties en
      bouwwerken als bedoeld in [artikel 6, tweede lid, onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004417#Artikel6
