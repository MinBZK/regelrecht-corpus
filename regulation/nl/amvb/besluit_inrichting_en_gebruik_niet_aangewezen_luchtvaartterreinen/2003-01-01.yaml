  - number: '9'
    text: |-
      De verbodsbepalingen van [artikel 14, eerste lid, onder ][ref1], zijn niet van toepassing in geval van het doen
      opstijgen en het doen landen van een niet als luchtvaartterrein aangewezen terrein, met kabelballonnen indien aan
      de in dit artikel gestelde voorschriften wordt voldaan:

      1. van de eigenaar of zakelijk gerechtigde van het ballonterrein moet toestemming zijn verkregen.

      2. door de burgemeester van de gemeente waarin het ballonterrein is gelegen, moet in verband met de openbare orde
      en veiligheid, een verklaring van geen bezwaar zijn verleend.

      3. een ballonterrein moet verder zijn gelegen dan 4 kilometer van de grens van een ingevolge de
      [Luchtvaartwet][ref2] aangewezen niet gecontroleerd luchtvaartterrein.

      4. een ballonterrein moet zijn gelegen buiten een luchtvaartterreinverkeersgebied (ATZ).

      5. indien het ballonterrein is gelegen binnen een plaatselijk verkeersleidingsgebied moet vooraf toestemming zijn
      verkregen van de plaatselijke verkeersleidingsdienst van het betrokken luchtvaartterrein en het ballonterrein
      verder zijn gelegen dan 5 kilometer van de grens van het betrokken luchtvaartterrein. De kabelballon mag daarbij
      niet hoger stijgen dan 50 m boven de grond of het water;

      indien het oplaten zal plaats vinden op een zaterdag, zondag of erkende feestdag, moet deze toestemming voor wat
      een plaatselijk verkeersleidingsgebied rond een militair luchtvaartterrein betreft, op de daaraan voorafgaande
      werkdag vóór 16.45 uur zijn verkregen.

      6. voor een ballon gevuld met een onbrandbaar gas, moet het ballonterrein over een gebied met een middellijn gelijk
      aan ten minste tweemaal de grootste lengte van de ballon met de grondverankering als middelpunt vrij zijn van
      publiek en hindernissen.

      7. voor een ballon gevuld met een brandbaar gas, moet het ballonterrein, als bedoeld in het zesde lid zodanig zijn
      afgescheiden, dat het publiek de ballon en de eventueel benodigde gasvulapparatuur nergens dichter dan tot op 40
      meter kan benaderen; op het ballonterrein moeten voldoende en deugdelijke brandblusmiddelen (doch ten minste één
      of twee verrijdbare blustoestellen met een vulling van 50 respectievelijk 25 kg bluspoeder) alsmede voldoende en
      deskundig personeel voor de bediening van deze blusmiddelen, aanwezig zijn.

      8. tijdens het opstijgen en landen van de kabelballon mogen, met inachtneming van het gestelde in het zesde
      lid, binnen een gebied met de grondverankering als middelpunt en een middellijn gelijk aan tenminste driemaal
      de grootste lengte van de ballon geen hindernissen aanwezig zijn met een grotere hoogte dan 4 meter boven het
      aardoppervlak.

      9. tijdens het in de lucht houden van de kabelballon mogen geen hindernissen steken door een denkbeeldig vlak dat
      vanaf het gebied bedoeld in het achtste lid en aanvangend op een hoogte van 4 meter, oploopt met een helling van
      1:1 (hoogte:afstand), tot een afstand van 100 meter.

      10. het doen opstijgen en in de lucht houden mag slechts geschieden bij een horizontaal zicht van ten minste 1,5
      kilometer en een verticale afstand van de ballon tot het wolkendek van ten minste 150 meter, terwijl de windsterkte
      niet meer mag bedragen dan 10 meter per seconde.

      11. aan boord van de kabelballon mogen zich geen personen bevinden.

      12. de kabelballon mag niet hoger stijgen dan 100 meter boven de grond, behoudens het gestelde in het vijfde lid.

      13. op het ballonterrein, als bedoeld in het zesde of het zevende lid mag slechts één kabelballon tegelijkertijd
      worden opgelaten.

      14. de kabelballon moet op deugdelijke wijze zijn verankerd en zijn voorzien van een inrichting om het gas bij
      onverhoopt losraken van de kabelballon van de grondverankering op snelle wijze te kunnen laten ontsnappen.

      15. gedurende de tijd dat de kabelballon op of boven het ballonterrein aanwezig is, moet de eigenaar of houder van
      de kabelballon zorg dragen voor een permanente bewaking van de kabelballon en bijbehorende gasvulapparatuur, door
      ten minste één deskundig persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002267
