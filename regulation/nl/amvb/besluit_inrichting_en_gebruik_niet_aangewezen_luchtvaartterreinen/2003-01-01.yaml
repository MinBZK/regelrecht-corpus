      1 De verbodsbepaling van [artikel 14, eerste lid onder ][ref1] is niet van toepassing in geval van het landen of
      doen landen op een niet als luchtvaartterrein aangewezen terrein met een vrije ballon, met dien verstande dat de
      landing niet mag geschieden binnen aaneengesloten bebouwing met inbegrip van industrie- en havengebieden en/of op
      een weg.

      2 Het landen moet zodanig geschieden dat daarbij geen personen, dieren of zaken op de grond in gevaar worden
      gebracht.


