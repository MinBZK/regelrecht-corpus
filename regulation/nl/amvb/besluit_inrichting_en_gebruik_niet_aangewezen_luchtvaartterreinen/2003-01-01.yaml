  - number: '1'
    text: |-
      Voor het bij deze regeling bepaalde zijn de volgende begripsbepalingen van toepassing:

      1. a.

      b. Plaatselijke verkeersleidingsdienst: een verkeersleiding belast met het geven van verkeersleiding aan
      luchtvaartterreinverkeer;

      c. Plaatselijk verkeersleidingsgebied: een verkeersleidingsgebied, dat zich verticaal uitstrekt vanaf het
      aardoppervlak tot aan een vastgestelde bovengrens.

      Voorts wordt in deze regeling verstaan onder:

      2. a. Beheerder:

        - voor wat betreft een helihaven: de natuurlijke persoon of rechtspersoon die een helihaven in stand houdt;
        - voor wat betreft een zweefvliegterrein: de natuurlijke persoon of rechtspersoon die een zweefvliegterrein in
      stand houdt;
        - voor wat betreft een terrein voor ultra lichte vliegtuigen: de natuurlijke persoon of rechtspersoon die een
      terrein voor ultra lichte vliegtuigen in stand houdt.

      b. In- en uitvliegsector:

        - voor wat betreft hefschroefvliegtuigen en landbouwhefschroefvliegtuigen: een ten behoeve van de eindnadering tot
      standvlucht dan wel de start van een hefschroefvliegtuig bepaald gebied.
        - voor wat betreft landbouwvleugelvliegtuigen: een ten behoeve van de eindnadering, dan wel de start van een
      landbouwvleugelvliegtuig bepaald gebied.
        - voor wat betreft motorzweefvliegtuigen: een ten behoeve van de eindnadering dan wel de start van een
      motorzweefvliegtuig bepaald gebied;
        - voor wat betreft ultra lichte vliegtuigen: een ten behoeve van de eindnadering dan wel de start van een ultra
      licht vliegtuig bepaald gebied.

      3. Met betrekking tot hefschroefvliegtuigen:

      a. Een heliterrein: een terrein dat geschikt is om, tijdelijk en uitzonderlijk, te worden gebruikt door
      hefschroefvliegtuigen.

      b. Een helihaven: een terrein dat permanent is ingericht en uitgerust en geschikt is om te worden gebruikt door
      hefschroefvliegtuigen, dan wel een platform, dat is aangelegd op een bouwwerk, constructie of vaartuig en dat
      permanent is ingericht en uitgerust om te worden gebruikt door hefschroefvliegtuigen.

      c. Gebruik van hefschroefvliegtuigen: het van een helihaven of heliterrein opstijgen of daarop landen van
      hefschroefvliegtuigen, alsmede alle andere bewegingen van zodanig vliegtuig en handelingen op de helihaven of het
      heliterrein die daarmee direct verband houden.

      d. Een landingsplaats: een gedeelte van een helihaven of een heliterrein, dat bestemd is voor het opstijgen en
      landen van hefschroefvliegtuigen.

      e. Lengte over alles (LOA): de totale lengte van een hefschroefvliegtuig inclusief de rotorvelden.

      4. Met betrekking tot ballonnen:

      a. Een vrije ballon: een ballon, waar zich één of meer personen aan boord bevindt.

      b. Een kabelballon: een ballon die tijdens het in de lucht houden permanent is bevestigd aan het aardoppervlak.

      c. Een ballonterrein: het voor een ballonopstijging geschikt terrein.

      5. Met betrekking tot landbouwluchtvaart:

      a. Een landbouwvliegtuig: een ingevolge de [Luchtvaartwet][ref1] voor het uitvoeren van landbouwwerkzaamheden
      geschikt vleugelvliegtuig dan wel hefschroefvliegtuig.

      b. Exploitant: de natuurlijke persoon of rechtspersoon die een landbouwvliegtuig gebruikt.

      6. Met betrekking tot zweefvliegtuigen en motorzweefvliegtuigen:

      a. Een zweefvliegterrein: een terrein dat ingericht, uitgerust en geschikt is om te worden gebruikt door
      zweefvliegtuigen en/of motorzweefvliegtuigen.

      b. Gebruik van zweefvliegtuigen en motorzweefvliegtuigen: het van een zweefvliegterrein opstijgen of daarop landen
      van zweefvliegtuigen en/of motorzweefvliegtuigen, alsmede alle andere bewegingen van zodanige vliegtuigen en
      handelingen op het zweefvliegterrein die daarmee direct verband houden.

      c. Een startterrein: een gedeelte van een zweefvliegterrein bestemd voor het opstijgen van zweefvliegtuigen door
      middel van een lier.

      d. Een lierbaan: een gedeelte van een zweefvliegterrein bestemd voor het uitleggen van de lierkabel.

      e. Een landingsterrein: een gedeelte van het zweefvliegterrein bestemd voor het landen van zweefvliegtuigen en/
      of motorzweefvliegtuigen.

      f. Invliegsector: een ten behoeve van de eindnadering van een zweefvliegtuig bepaald gebied.

      g. Een strook: een gedeelte van het landingsterrein, waarin een baan voor motorzweefvliegtuigen is gelegen.

      h. Een baan: een gedeelte van het landingsterrein bestemd voor het opstijgen en/of landen van
      motorzweefvliegtuigen.

      7.Met betrekking tot ultra lichte vliegtuigen:

      a. een ultra licht vliegtuig of ulv: een vleugelvliegtuig:

      1° met een toegelaten totaalmassa van ten hoogste 390 kg;

      2° met een vleugelbelasting van ten hoogste 25 kg per vierkante meter bij een toegelaten totaalmassa van ten
      hoogste 390 kg;

      3° met een brandstofcapaciteit van ten hoogste 50 liter;

      4° ontworpen voor niet meer dan twee inzittenden.

      b. een ulv-terrein: een terrein bestemd voor het opstijgen en landen van ulv's.

      c. het circuitgebied: het gebied rond een ulv-terrein waarin een luchtverkeerscircuit is gelegen.

      d. het luchtverkeerscircuit: de voorgeschreven vliegbaan voor ulv's, die moet worden gevolgd in de nabijheid van
      een ulv-terrein.

      e. een strook: een gedeelte van het ulv-terrein waarin een baan voor ulv's is gelegen.

      f. een baan: een gedeelte van het ulv-terrein bestemd voor het opstijgen en landen van ulv's.


