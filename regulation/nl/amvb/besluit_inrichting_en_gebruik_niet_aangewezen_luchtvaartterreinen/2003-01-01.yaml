  - number: '5'
    text: |-
      1 Het gebruik van een hefschroefvliegtuig moet zodanig geschieden, dat te allen tijde een veilige nood- of
      voorzorgslanding kan worden uitgevoerd, zonder dat daarbij personen of zaken op de grond of op het water in gevaar
      worden gebracht.

      2 De eigenaar of houder van het hefschroefvliegtuig, is verplicht ten minste 24 uur voor de dag dat het heliterrein
      zal worden gebruikt dit voornemen schriftelijk aan Onze Minister en de korpschef van het Korps landelijke
      politiediensten, kenbaar te maken.

      3 In de in het tweede lid bedoelde brief moet ten minste worden vermeld:

      a. fabrikaat en type van het te gebruiken hefschroefvliegtuig;

      b. datum/data en het vermoedelijke tijdstip waarop het heliterrein zal worden gebruikt;

      c. de reden/redenen waarom het heliterrein zal worden gebruikt;

      d. de gemeente waarin het betrokken heliterrein is gelegen, alsmede door middel van een kaart of een plattegrond,
      de geografische ligging van het terrein in die gemeente.

      4 Bij dringende noodzaak, zulks ter beoordeling van Onze Minister kan van de in het tweede lid bedoelde termijn
      worden afgeweken. In dat geval dient de melding per telexbericht te worden gedaan, met dien verstande, dat in
      plaats van de in het derde lid onder *d* bedoelde kaart of platte grond, de lokatie van het terrein in geografische
      coördinaten in het telexbericht kan worden aangegeven.

      5 Van de eigenaar of zakelijk gerechtigde van het terrein moet voor het gebruik van dat terrein als heliterrein,
      toestemming zijn verkregen.

      6 Door de burgemeester van de gemeente waarin het terrein is gelegen moet, voordat het terrein als heliterrein
      wordt gebruikt, in verband met de openbare orde en veiligheid een verklaring van geen bezwaar zijn verleend.

      7 Vóór aanvang van de vlucht naar het heliterrein moet de gezagvoerder zich ervan vergewissen dat een verklaring
      van geen bezwaar van de burgemeester van de gemeente waarin het terrein is gelegen en van de eigenaar of zakelijk
      gerechtigde van het terrein, alsmede een afschrift van de in het tweede of vierde lid bedoelde brief of melding ter
      inzage aanwezig is.
    url: https://wetten.overheid.nl/BWBR0004417/2003-01-01#Artikel5
  - number: '6'
    text: |-
      1 De verbodsbepaling, bedoeld in [artikel 14, eerste lid, onder c, van de Luchtvaartwet](onbekend) is niet van
      toepassing in geval een helihaven wordt of is ingericht op een mijnbouwinstallatie als bedoeld in [artikel 1,
      onderdeel o, van de Mijnbouwwet](onbekend) voor zover hiervoor bij of krachtens die wet regels zijn gesteld.

      2 Met inachtneming van het gestelde in [artikel 7][ref1] en 8, is de verbodsbepaling bedoeld in
      [artikel 14, eerste lid onder ][ref2] niet van toepassing in geval een terrein of een platform als helihaven wordt
      ingericht:

      a. bestemd ten behoeve van medische doeleinden bij of op een ziekenhuis;

      b. installaties of bouwwerken, hecht verbonden met of verankerd op de zeebodem welke zijn gelegen binnen de
      territoriale wateren;

      c. bij of op gebouwen op een terrein, dat niet toegankelijk is voor publiek en de helihaven bestemd is voor vervoer
      ten eigen behoeve of ten behoeve van eigen bedrijf.


