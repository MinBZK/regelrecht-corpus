    text: |-
      De verbodsbepalingen bedoeld in [artikel 14, eerste lid van de Luchtvaartwet][ref1] zijn niet van toepassing in
      geval van het opstijgen en doen opstijgen van en het landen en doen landen op niet als luchtvaartterrein aangewezen
      terreinen met landbouwvliegtuigen met een maximaal toegestane startmassa van 6000 kg of minder en het inrichten van
      dergelijke terreinen, indien aan de in dit hoofdstuk gegeven voorschriften wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel14
