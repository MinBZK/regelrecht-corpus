  - number: '13'
    text: |-
      1 Van de eigenaar of zakelijk gerechtigde van het terrein, dat door landbouwvleugelvliegtuigen zal worden gebruikt,
      moet toestemming zijn verkregen.

      2 Door de burgemeester van de gemeente waarin het terrein is gelegen, moet in verband met de openbare orde en
      veiligheid, een verklaring van geen bezwaar zijn verleend.

      3 Het terrein moet zijn gelegen buiten een luchtvaartterreinverkeersgebied (ATZ).

      4 Ten behoeve van het landen en opstijgen met landbouwvleugelvliegtuigen op het terrein moet een strook beschikbaar
      zijn met een lengte ten minste gelijk aan de startlengte als vermeld in het Aanhangsel voor bijzondere doeleinden
      landbouwwerkzaamheden, behorende bij het vlieghandboek van het betreffende luchtvaartuig.

      5 De breedte van de strook moet ten minste tweemaal de spanwijdte bedragen van het landbouwvleugelvliegtuig dat
      gebruik maakt van de strook, doch niet minder dan 30 meter.

      6 In de strook moet de bodemgesteldheid, voor wat betreft de vlakheid en de draagkracht, dusdanig zijn dat een
      landbouwvleugelvliegtuig, op een veilige wijze kan starten en landen binnen de in het bij dat luchtvaartuig
      behorende vlieghandboek gestelde gebruiksbeperkingen.

      7 In het midden, binnen de grenzen van de strook moet een baan aanwezig zijn met een lengte gelijk aan die van de
      strook en een breedte van ten minste twee maal de spoorbreedte van het te gebruiken landbouwvleugelvliegtuig. Op
      deze baan mogen geen hindernissen aanwezig zijn en mag de gewashoogte niet meer dan 15 centimeter bedragen.

      8 In de strook mogen geen hindernissen aanwezig zijn. De gewashoogte in de strook mag hoger zijn dan 15
      centimeter, voorzover deze geen gevaar oplevert voor een veilige vluchtuitvoering en de vleugels van het
      landbouwvleugelvliegtuig of de daaraan bevestigde voorzieningen ruim vrij blijven van die gewassen.

      9 In de in- en uitvliegsectoren van de strook mogen geen hindernissen steken door een denkbeeldig vlak, dat met de
      korte zijde van de strook als basis, oploopt onder een hoek van 1:20 (hoogte:afstand) over een afstand gelijk aan
      de startlengte als genoemd in het vierde lid.

      10 Ter weerszijden van de strook en de in- en uitvliegsectoren mogen geen hindernissen steken door een denkbeeldig
      vlak dat met de lange zijde van de strook als basis oploopt onder een hoek van 1:5 (hoogte:afstand) tot een afstand
      van 75 meter uit de hartlijn van de strook.

      11 De snijlijnen van de in het negende en tiende lid genoemde vlakken bepalen de divergentie van het vlak, genoemd
      in het negende lid.

      12 In het geval er zich in de in het negende en tiende lid genoemde vlakken een weg of een spoorweg bevindt moet
      met een hindernishoogte van 4,5 meter en respectievelijk 5,5 meter boven die weg of spoorweg rekening worden
      gehouden.

      13 De exploitant moet zodanig maatregelen nemen, dat tijdens het gebruik van het terrein zich geen personen of
      dieren op het terrein kunnen bevinden.

      14 Tijdens het innemen van brandstof moeten in de directe nabijheid van het luchtvaartuig brandblusmiddelen
      aanwezig zijn, bestaande uit ten minste één draagbaar blustoestel met een vulling van tenminste 9 kg bluspoeder.

      15 Bij het gebruik van het terrein moet nabij de strook de windrichting zijn aangegeven door middel van een
      windzak, een vlag of een ander gelijkwaardig middel.

      16 De exploitant is verplicht ten minste éénmaal per kalenderjaar het voornemen dat een terrein met één of meer
      landbouwvleugelvliegtuigen zal worden gebruikt, schriftelijk te melden aan Onze Minister en de korpschef van het
      Korps landelijke politiediensten, met dien verstande dat deze melding in ieder geval 24 uur voor de dag dat dit
      terrein voor de eerste maal zal worden gebruikt, moet zijn gedaan.

      17 Bij dringende noodzaak kan Onze Minister de termijn van 24 uur als bedoeld in het vorige lid verkorten.

      18 In de in het zestiende lid bedoelde brief moet ten minste worden vermeld, dan wel in afschrift worden
      bijgevoegd:

      a. fabrikaat en type van het (de) te gebruiken landbouwvleugelvliegtuig(en) en een afschrift van het bij het
      vlieghandboek behorende aanhangsel voor bijzondere doeleinden landbouwwerkzaamheden;

      b. de tijdvakken waarin het terrein zal worden gebruikt;

      c. afmetingen van de strook en de hierin gelegen baan;

      d. de verklaring van geen bezwaar van de gemeente waarin het betrokken terrein is gelegen alsmede door middel van
      een kaart of plattegrond de geografische ligging van het terrein in die gemeente;

      e. de verklaring van geen bezwaar van de eigenaar of zakelijk gerechtigde van het betrokken terrein.

      19 Voordat van het terrein gebruik mag worden gemaakt is de exploitant verplicht zich ervan te vergewissen, dat
      het betrokken terrein tenminste voldoet aan de in deze titel gestelde voorschriften. Hij dient er tevens voor
      zorg te dragen dat de gezagvoerder(s) van het (de) landbouwvleugelvliegtuig(en) wordt (worden) ingelicht over de
      terreinomstandigheden en de hindernissituatie in de directe omgeving van het terrein.

      20 Ten tijde van het daadwerkelijke gebruik van het terrein moet de exploitant er voor zorg dragen, dat de
      verklaringen van geen bezwaar als bedoeld in het achttiende lid, alsmede het bewijs dat de in het zestiende lid
      bedoelde brief is verzonden, bij het terrein ter inzage aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0004417/2003-01-01#Artikel13
  - number: '14'
    text: |-
      1 Het gestelde in
      [artikel 13, eerste tot en met het derde lid, alsmede het twaalfde tot en met het twintigste lid][ref1] is van
      overeenkomstige toepassing op landbouwhefschroefvliegtuigen.

      2 Ten behoeve van het landen en opstijgen met een landbouwhefschroefvliegtuig moet het terrein over een oppervlakte
      van ten minste 25 * 35 meter vrij zijn van hindernissen en mogen zich bij het gebruik op het terrein geen personen
      of dieren bevinden.

      3 In de in- en uitvliegsectoren van het terrein mogen geen hindernissen steken door een denkbeeldig vlak dat met
      de korte zijde van het terrein als basis oploopt onder een hoek van 1:8 (hoogte:afstand) tot een afstand van 300
      meter.

      4 Ter weerszijden van de lange zijden van het terrein en van de in- en uitvliegsectoren mogen geen hindernissen
      steken door een denkbeeldig vlak dat vanaf de lange zijden van het terrein oploopt onder een hoek van 1:2
      (hoogte:afstand) tot een afstand van 75 meter.

      5 De snijlijnen van de in het vierde en vijfde lid genoemde vlakken bepalen de divergentie van het vlak, genoemd in
      het vierde lid.


