  - number: '10'
    text: |-
      De verbodsbepaling van [artikel 14, eerste lid onder ][ref1] is niet van toepassing in geval van het opstijgen
      of doen opstijgen van een niet als luchtvaartterrein aangewezen terrein, met een vrije ballon, indien aan de in
      [dit artikel][ref2] gestelde voorschriften wordt voldaan:

      1. van de eigenaar of zakelijk gerechtigde van het ballonterrein moet toestemming zijn verkregen.

      2. door de burgemeester van de gemeente waarin het ballonterrein is gelegen moet in verband met de openbare orde en
      veiligheid, een verklaring van geen bezwaar zijn verleend.

      3. het ballonterrein moet zijn gelegen buiten een luchtvaartterreinverkeersgebied (ATZ).

      4. indien het ballonterrein is gelegen binnen 4 kilometer van de grens van een ingevolge de [Luchtvaartwet][ref3]
      aangewezen niet gecontroleerd luchtvaartterrein, moet de opstijging vooraf worden gecoördineerd met de havenmeester
      van het betrokken luchtvaartterrein.

      5. indien het ballonterrein is gelegen binnen een plaatselijk verkeersleidingsgebied, moet vooraf toestemming
      zijn verkregen van de plaatselijke verkeersleidingsdienst; indien de opstijging zal plaats vinden op een zaterdag,
      zondag of erkende feestdag, moet deze toestemming voor wat betreft een plaatselijk verkeersleidingsgebied, rond een
      militair luchtvaartterrein op een daaraan voorafgaande werkdag vóór 16.45 uur zijn verkregen.

      6. de hindernissituatie rond het ballonterrein moet zodanig zijn, dat in de richting van de opstijging eventuele
      hindernissen door de vrije ballon met een hoogteverschil van ten minste 15 meter kunnen worden overvaren.

      7. het ballonterrein moet, met inachtneming van het gestelde in het tiende lid zodanig zijn afgescheiden, dat
      toeschouwers een heteluchtballon(nen) nergens dichter kunnen naderen, dat tot op ten minste 10 meter van de mand
      en de uitgelegde ballon en tot op ten minste 40 meter van een gasballon en de benodigde gasvulapparatuur, indien de
      vulling uit een brandbaar gas bestaat.

      8. binnen de afscheiding, als bedoeld in het zevende lid mogen geen andere personen verblijven dan de opvarenden
      en de personen die werkzaamheden hebben te verrichten die aan de opstijging zijn verbonden, zij moeten als zodanig
      duidelijk herkenbaar zijn.

      9. ingeval van een opstijging van een vrije ballon met een vulling bestaande uit brandbaar gas mag op het
      ballonterrein niet worden gerookt noch mogen daar vuurverwekkende voorwerpen of middelen aanwezig zijn;

      ten behoeve van de personen als bedoeld in het achtste lid moeten in dit geval borden zijn geplaatst met het
      duidelijk leesbare opschrift: "Open Vuur en Roken Verboden", tevens moeten dan op het ballonterrein voldoende
      en deugdelijke brandblusmiddelen, doch ten minste één of twee verrijdbare blustoestellen met een vulling van 50
      respectievelijk 25 kg bluspoeder, alsmede voldoende en deskundig personeel voor de bediening van deze blusmiddelen
      aanwezig zijn.

      10. de plaats van opstijging op het ballonterrein, moet, met inachtneming van het gestelde in het zevende lid
      zodanig worden gekozen, dat zich over de eerste 50 meter van de projectie van de vermoedelijke richting van de
      opstijging en in een strook met een breedte van 10 meter ter weerszijden van deze projectie, geen publiek bevindt.

      11. een opstijging van een vrije ballon die door middel van een kabel tijdelijk is bevestigd aan het aardoppervlak
      mag alleen worden uitgevoerd bij windsnelheden van minder dan 3 meter/seconden, de vrije ballon mag daarbij niet
      hoger stijgen dan 50 meter boven het aardoppervlak.

      12. indien het ballonterrein door meer dan vijf vrije ballonnen zal worden gebruikt, dient dit voornemen
      schriftelijk te worden gemeld aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel14
