  - number: '8'
    text: |-
      1 Het bepaalde in [artikel 3, vijfde tot en met negende lid][ref1], is van overeenkomstige toepassing op het
      gebruik van een helihaven, als bedoeld in [artikel 6, tweede lid, onder a en c][ref2].

      2 [Artikel 3, zesde en zevende lid][ref3] is van overeenkomstige toepassing op installaties of bouwwerken, hecht
      verbonden met of verankerd op de zeebodem, welke zijn gelegen binnen de territoriale wateren.

      3 De beheerder van een helihaven moet zorg dragen dat:

      a. van de helihaven een veilig gebruik kan worden gemaakt;

      b. maatregelen worden genomen voor een behoorlijk toezicht op de veiligheid en goede orde op de helihaven tijdens
      het gebruik van hefschroefvliegtuigen;

      c. het gebruik van hefschroefvliegtuigen op de helihaven, met uitzondering van een zich op een mijnbouwinstallatie
      als bedoeld in [artikel 1, onderdeel o, van de Mijnbouwwet](onbekend) bevindende helihaven, in een register wordt
      vastgelegd. In dit register moeten ten minste de navolgende gegevens worden vermeld:

        - het nationaliteits- en inschrijvingskenmerk alsmede het type hefschroefvliegtuig;
        - datum en tijdstip van aankomst;
        - luchtvaartterrein, helihaven of heliterrein waarvan het hefschroefvliegtuig het laatst is vertrokken;
        - datum en tijdstip van vertrek;
        - het luchtvaarterrein, helihaven of heliterrein van bestemming.

      Elk kwartaal dient een kopie hiervan, onder vermelding van eventuele bijzonderheden te worden gezonden aan Onze
      Minister;

      d. passagiers onder geleide van daartoe bevoegd personeel naar en van het hefschroefvliegtuig worden geleid;

      e. de ten behoeve van het gebruik van hefschroefvliegtuigen op de helihaven voorgeschreven uitrusting in
      bedrijfszekere toestand verkeert en het in te zetten personeel op die helihaven voor haar taak berekend is.

      4 Op of in de onmiddellijke nabijheid van een helihaven op een platform moeten voldoende en deugdelijke reddings-
      en brandblusmiddelen aanwezig zijn voor het redden van mensenlevens en de bestrijding van vliegtuigbranden
      alsmede voldoende en ter zake kundig personeel voor de bediening van deze middelen, zulks ter beoordeling van Onze
      Minister.

      5 Alvorens een helihaven door een hefschroefvliegtuig mag worden gebruikt, moet toestemming zijn verkregen van de
      beheerder van de helihaven.


