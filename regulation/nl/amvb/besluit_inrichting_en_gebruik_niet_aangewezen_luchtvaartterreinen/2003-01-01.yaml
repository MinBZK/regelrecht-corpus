  - number: '16'
    text: |-
      1 Voor het verkrijgen van toestemming voor de aanleg, inrichting en uitrusting van een zweefvliegterrein, moet een
      daartoe strekkend verzoek worden ingediend bij Onze Minister. Hierbij moeten tenminste de volgende gegevens worden
      overgelegd;

      a. een overzichtstekening schaal 1:2500 waarop is aangegeven:

      1°. de grens van het zweefvliegterrein;

      2°. de lierbanen, opstelplaats(en) van de lier, startterrein(en), opstelplaats(en) en landingsterrein(en) van de
      zweefvliegtuigen, baan/banen voor motorzweefvliegtuig(en), alsmede het voor het publiek toegankelijk gedeelte van
      het zweefvliegterrein;

      3°. de hindernishoogten rond het zweefvliegterrein in gebieden zoals aangegeven in het tweede lid onder *h*, *i*,
      *j*, *k*, *l*, *o*, *p*, en *q*;

      4°. de plaats en afmetingen van opstallen in gebruik door de beheerder;

      5°. de in- en uitvliegsectoren van de motorzweefvliegtuig(en);

      b. het type te gebruiken motorzweefvliegtuig(en);

      c. een verklaring van geen bezwaar van de eigenaar of zakelijk gerechtigde van het zweefvliegterrein;

      d. een verklaring van geen bezwaar van de burgemeester van de gemeente waarin het betrokken zweefvliegterrein is
      gelegen.

      2 Het zweefvliegterrein moet in ieder geval aan de volgende voorschriften voldoen:

      a. voor het opstijgen van zweefvliegtuigen moet een terrein beschikbaar zijn met een lengte ten minste gelijk aan
      de lengte van de lierkabel en een breedte van ten minste 150 meter, vrij van hindernissen en oneffenheden welke
      gevaar kunnen opleveren bij een afgebroken start of noodlanding;

      b. de opstelplaats van de lier moet op een afstand van ten minste 25 meter van de grens van het zweefvliegterrein
      zijn gelegen;

      c. de lierkabel moet op de lierbaan in een rechte lijn kunnen worden uitgereden;

      d. het startterrein moet een lengte van ten minste 150 meter en een breedte van ten minste 50 meter hebben;

      e. een opstelplaats voor zweefvliegtuigen moet terzijde van het startterrein zijn gelegen;

      f. het landingsterrein moet een lengte van ten minste 75 meter en indien gelijktijdig met meerdere zweefvliegtuigen
      moet kunnen worden geland, per zweefvliegtuig een breedte van ten minste 30 meter hebben en welke niet zijn
      gesitueerd ter plaatse van lierbaan, startterrein en opstelplaatsen. Het landingsterrein moet zijn gemarkeerd met
      voor dit doel geschikte markeringen;

      g. de terreingedeelten als genoemd [onder ][ref1] en *f* moeten voldoende vlak zijn om beschadigingen aan de
      zweefvliegtuigen te voorkomen, terwijl de gewashoogte maximaal 15 centimeter mag bedragen;

      h. in de invliegsector van het landingsterrein mogen geen hindernissen steken door een denkbeeldig vlak dat met de
      breedte van het landingsterrein als basis, oploopt met een helling van 1:20 (hoogte:afstand), en aansluit op het
      horizontale vlak als bedoeld onder *k*;

      i. ter weerszijden van het landingsterrein mogen geen hindernissen steken door een denkbeeldig vlak dat met de
      lengte van het landingsterrein als basis, oploopt met een helling van 1:2 (hoogte:afstand) en aansluit op het
      horizontale vlak als bedoeld onder *k*;

      j. de snijlijnen van de in *h* en *i* genoemde vlakken bepalen de divergentie van het vlak genoemd onder *h*;

      k. binnen een gebied met een straal van 1200 meter vanuit de vastgestelde geografische positie van het
      zweefvliegterrein mogen behoudens toestemming van Onze Minister, geen hindernissen steken door een denkbeeldig
      horizontaal vlak op een hoogte van 30 meter boven het hoogst gelegen grondvlak binnen het zweefvliegterrein;

      l. in het geval een openbare weg of spoorweg in de nabijheid van de invliegsector(en) van het zweefvliegterrein
      aanwezig is, dan moet ter bepaling van de ligging van het landingsterrein met een hindernishoogte van 4,5 meter
      respectievelijk 5,5 meter boven die weg of spoorweg, rekening worden gehouden;

      m. de windrichting moet op een van alle zijden zichtbare plaats zijn aangegeven door middel van een windzak of
      een vlag;

      n. voor het landen en opstijgen van motorzweefvliegtuigen moet een baan beschikbaar zijn met een lengte van 300
      meter en een breedte van 50 meter en voorzien van een voor dit doel geschikte markering welke afwijkt van die als
      genoemd in *f*. Deze baan moet zijn gelegen in een strook van 600 meter lengte en 60 meter breedte waarbij de korte
      zijde van de baan op een afstand van tenminste 30 meter van het begin van de strook moet zijn gesitueerd;

      o. in de in- en uitvliegsectoren van het landingsterrein dat wordt gebruikt door motorzweefvliegtuigen, mogen geen
      hindernissen steken door een denkbeeldig vlak dat met de korte zijde van de onder *n* genoemde strook als basis,
      oploopt met een helling van 1:20 (hoogte:afstand) tot een afstand van 600 meter;

      p. ter weerszijden van de strook en de in- en uitvliegsectoren mogen geen hindernissen steken door een denkbeeldig
      vlak dat vanaf de lange zijde van de strook oploopt met een helling van 1:5 (hoogte:afstand) tot een afstand van
      150 meter;

      q. de snijlijnen van de onder *o* en *p* genoemde vlakken, bepalen de divergentie van het vlak onder *o*.


      [ref1]: https://wetten.overheid.nl/BWBR0004417#Artikel16
    url: https://wetten.overheid.nl/BWBR0004417/2003-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004417
        artikel: '16'
        hoofdstuk: V
  - number: '17'
    text: |-
      1 De beheerder moet zorgdragen dat:

      a. van het zweefvliegterrein een veilig gebruik kan worden gemaakt;

      b. maatregelen worden getroffen voor een behoorlijk toezicht op de veiligheid en goede orde op het
      zweefvliegterrein.

      2 De beheerder is verplicht Onze Minister in te lichten omtrent onregelmatigheden in het gebruik van het terrein.

      3 De beheerder draagt zorg dat starts en landingen van motorzweefvliegtuigen in een register worden bijgehouden.
      Elk kwartaal dient een kopie hiervan, onder vermelding van eventuele bijzonderheden, te worden gezonden aan Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0004417/2003-01-01#Artikel17
  - number: '18'
    text: |-
      De verbodsbepalingen bedoeld in [artikel 14, eerste lid onder ][ref1] zijn niet van toepassing in geval van
      het opstijgen en doen opstijgen en het landen en doen landen van, respectievelijk op een zweefvliegterrein met
      zweefvliegtuigen en motorzweefvliegtuigen indien aan de in dit hoofdstuk gegeven voorschriften wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel14
    url: https://wetten.overheid.nl/BWBR0004417/2003-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '14'
  - number: '19'
    text: |-
      1 Gedurende het opstijgen en landen mogen zich op de terreingedeelten als genoemd in
      [artikel 16 tweede lid, onder c, d, f en onder n][ref1] geen onbevoegde personen bevinden;

      2 Het opstijgen en doen opstijgen van zweefvliegtuigen door middel van een lier mag slechts geschieden indien
      de vallende lierkabel niet buiten de begrenzing van het zweefvliegterrein kan vallen en geen letsel zal kunnen
      veroorzaken aan personen;

      3 Gelijktijdig opstijgen of doen opstijgen van meerdere zweefvliegtuigen en/of motorzweefvliegtuigen is niet
      toegestaan;

      4 Gelijktijdig landen van zweefvliegtuigen en motorzweefvliegtuigen alsmede van meerdere motorzweefvliegtuigen op
      de in [artikel 16, tweede lid onder f respectievelijk onder n][ref2] genoemde baan is niet toegestaan;

      5 Tijdens het gebruik van motorzweefvliegtuigen moeten op of nabij de baan voor motorzweefvliegtuigen
      brandblusmiddelen, bestaande uit ten minste een draagbaar blustoestel met een vulling van tenminste 9 kg bluspoeder
      aanwezig zijn;

      6 Indien een zweefvliegterrein is gelegen binnen een plaatselijk verkeersleidingsgebied moet voor het gebruik van
      dat zweefvliegterrein vooraf toestemming zijn verkregen van de plaatselijke verkeersleidingsdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0004417#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0004417#Artikel16
    url: https://wetten.overheid.nl/BWBR0004417/2003-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004417
        artikel: '16'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004417
        artikel: '16'
        hoofdstuk: V
  - number: '20'
    text: |-
      De verbodsbepaling bedoeld in [artikel 14, eerste lid onder ][ref1] is niet van toepassing in geval van het landen
      van een zweefvliegtuig op een niet als luchtvaartterrein aangewezen terrein, met dien verstande dat de landing niet
      mag geschieden binnen aaneengesloten bebouwing met inbegrip van industrie- en havengebieden en/of op een weg.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel14
    url: https://wetten.overheid.nl/BWBR0004417/2003-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '14'
  - number: 20a
    text: |-
      1 [Artikel 14, eerste lid, aanhef en onder ][ref1] is niet van toepassing in geval een terrein wordt ingericht als
      ulv-terrein, nadat Onze Minister vergunning daartoe heeft verleend.

      2 Onze Minister houdt bij de beoordeling van de vergunningaanvraag rekening met vliegveiligheid, mogelijke
      geluidhinder, natuurwaarden, en recreatieve en economische aspecten.

      3 Onze Minister kan aan de vergunning voorschriften en beperkingen verbinden.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel14
    url: https://wetten.overheid.nl/BWBR0004417/2003-01-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '14'
  - number: 20b
    text: |-
      1 Voor het verkrijgen van vergunning als bedoeld in [artikel 20a][ref1] wordt een daartoe strekkende aanvraag
      ingediend bij Onze Minister.

      2 De aanvrager verschaft in ieder geval de volgende gegevens en bescheiden:

      a. een overzichtstekening schaal 1:2000 dan wel 1:2500, voorzien van een coördinatenstelsel volgens de
      Rijksdriehoeksmeting, waarop is aangegeven:

      1° de grens van het ulv-terrein en de kadastrale aanduiding daarvan;

      2° de ligging en afmetingen van de baan en hindernisvrije strook;

      3° de hindernishoogten rond het ulv-terrein;

      4° de plaats en afmetingen van opstallen in gebruik door de beheerder;

      5° de in- en uitvliegsectoren van ulv's;

      b. een plan op hoofdlijnen voor de aanleg en het gebruik van het ulv-terrein, waarin tenminste wordt beschreven:

      1° het maximum aantal te gebruiken ulv's, uitgesplitst in éénzitters en tweezitters;

      2° het maximum aantal vliegbewegingen met ulv's dat jaarlijks te verwachten is, uitgesplitst in:

        - vliegbewegingen met éénzitters en tweezitters;
        - werkdagen en weekend- en feestdagen;

      3° het procentuele aandeel van circuitvluchten op het totaal aantal vliegbewegingen met ulv's;

      4° een beschrijving van de ontwikkeling op lange termijn van het aantal te gebruiken ulv's, het aantal
      vliegbewegingen en het aantal circuitvluchten;

      c. ontwerp-maatregelen van orde en veiligheid waarin in ieder geval wordt beschreven:

      1° de openingstijden op werkdagen, weekenddagen en feestdagen en eventuele andere maatregelen ter beperking van
      geluidhinder voor omwonenden van het ulv-terrein en circuitgebied;

      2° de disciplinaire maatregelen die genomen kunnen worden indien de andere maatregelen, bedoeld onder 1°, worden
      overtreden;

      d. indien van toepassing de statuten van de rechtspersoon, waarin gebruikers zich verenigen.

      3 Alvorens te beslissen op de aanvraag, stelt Onze Minister

      a. het college van burgemeester en wethouders van de gemeente, waarin het terrein is gelegen, alsmede

      b. het college van burgemeester en wethouders van de gemeenten, waarboven in- en uitvliegsectoren zijn gelegen,
      in de gelegenheid binnen een door hem te bepalen termijn hun zienswijze naar voren te brengen, tenzij deze reeds
      blijkt uit de gegevens en bescheiden, die bij de aanvraag zijn overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004417#Artikel20a
    url: https://wetten.overheid.nl/BWBR0004417/2003-01-01#Artikel20b
    references:
      - id: ref1
        bwb_id: BWBR0004417
        artikel: 20a
        hoofdstuk: VA
  - number: 20c
    text: |-
      Het ulv-terrein voldoet in ieder geval aan de volgende voorschriften:

      a. voor het landen en opstijgen is een baan beschikbaar met een lengte van tenminste 200 meter en een breedte van
      tenminste 30 meter;

      b. de baan ligt in een hindernisvrije strook van tenminste 300 bij 30 meter, waarbij de korte zijde van de baan op
      een afstand van 50 meter van het begin van de strook is gesitueerd, terwijl de breedte van het terrein zodanig is,
      dat buiten de hindernisvrije strook met ulv's kan worden getaxied en dat deze kunnen worden geparkeerd, gemonteerd
      en gedemonteerd;

      c. de gewaslengte op de baan is ten hoogste 15 centimeter;

      d. in de in- en uitvliegsectoren van het ulv-terrein steken geen hindernissen door een denkbeeldig vlak, dat met
      de korte zijde van de hindernisvrije strook als basis oploopt met een helling van 1 : 20 (hoogte : afstand) en een
      divergentie van 10% tot op een afstand van 600 meter;

      e. ter weerszijden van het ulv-terrein steken geen hindernissen door een denkbeeldig vlak dat met de lange zijden
      van de hindernisvrije strook als basis oploopt met een helling van 1 : 5 (hoogte : afstand) tot een afstand van
      150 meter;

      f. de vlakken gelegen ter weerszijden van de in- en uitvliegsectoren genoemd onder *d*, sluiten aan op de
      overeenkomstige hoogten van deze in- en uitvliegsectoren en de vlakken genoemd onder *e*;

      g. de markering van de baan en de uitvoering en de plaatsing van de seinen ter aanduiding van de landingsrichting
      en van de ligging van het circuitgebied alsmede de windzak zijn geplaatst overeenkomstig het bij of krachtens
      [artikel 123 van de Regeling Toezicht Luchtvaart][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0002309#Artikel123
    url: https://wetten.overheid.nl/BWBR0004417/2003-01-01#Artikel20c
    references:
      - id: ref1
        bwb_id: BWBR0002309
        artikel: '123'
  - number: 20d
    text: |-
      1 In het circuitgebied is de som van de lengte van het startbeen en de lengte van het daaropvolgende dwarswindbeen
      tenminste 1500 meter, waarbij de lengte van het startbeen niet korter dan 800 meter is en die van het
      daaropvolgende dwarswindbeen niet korter dan 500 meter.

      2 Een circuitgebied is niet gelegen:

      a. binnen de plaatselijke luchtverkeersleidingsgebieden Schiphol, Rotterdam, Eelde en Maastricht, tenzij daarvoor
      vergunning is gegeven door de instantie die verantwoordelijk is voor de luchtverkeersbeveiliging;

      b. binnen de plaatselijke luchtverkeersleidingsgebieden De Kooy en Valkenburg, tenzij daarvoor vergunning is
      gegeven door de Bevelhebber der Zeestrijdkrachten;

      c. binnen de plaatselijke luchtverkeersleidingsgebieden Deelen, Eindhoven, Gilzsse-Rijen, Leeuwarden, De Peel,
      Soesterberg, Twenthe, Volkel en Woensdrecht, tenzij daarvoor vergunning is gegeven door de Bevelhebber der
      Luchtstrijdkrachten;

      d. binnen een afstand van vier kilometer van het luchtvaartterrein-referentiepunt van een luchtvaartterrein waar
      geen plaatselijke verkeersleidingsdienst is, tenzij van dat luchtvaartterrein wordt opgestegen of daarop wordt
      geland met ulv's en de ulv-baan op dit luchtvaartterrein is gelegen;

      e. binnen een afstand van drie kilometer van een helihaven, tenzij daarvoor vergunning is gegeven door Onze
      Minister en het gebruik tevoren is gecoördineerd met de beheerder van de helihaven;

      f. binnen een afstand van drie kilometer van een zweefvliegterrein, tenzij daarvoor vergunning is gegeven door Onze
      Minister, gehoord de beheerder van het zweefvliegterrein;

      g. binnen een afstand van vijf kilometer van een militaire laagvliegroute, tenzij daarvoor vergunning is gegeven
      door de daartoe bevoegde autoriteit;

      h. binnen een burger- of militair laagvlieggebied zoals aangegeven in de luchtvaartgids, tenzij daarvoor vergunning
      is gegeven door de daartoe bevoegde autoriteit;

      i. in een der vogelconcentratiegebieden zoals aangegeven in de luchtvaartgids.
    url: https://wetten.overheid.nl/BWBR0004417/2003-01-01#Artikel20d
  - number: 20e
    text: |-
      1 Een circuitgebied mag niet zijn gelegen:

      a. binnen een afstand van 100 meter van een woning of een ander geluidsgevoelig gebouw;

      b. binnen een afstand van 500 meter van aaneengesloten woningen of andere geluidsgevoelige objecten, een
      kampeerterrein, een bungalowpark of een doorgaans drukbezocht recreatiegebied; en

      c. binnen 1500 meter van de grens van een gebied, bedoeld in [artikel 1.2, tweede lid, onderdeel ][ref1].

      2 Binnen een circuitgebied mogen slechts bij wijze van uitzondering een beperkt aantal woningen en andere
      geluidsgevoelige objecten gelegen zijn op een afstand van ten hoogste 200 meter van de grens van het circuitgebied.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1.2
    url: https://wetten.overheid.nl/BWBR0004417/2003-01-01#Artikel20e
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1.2'
  - number: 20f
    text: |-
      1 De beheerder zorgt dat:

      a. van het ulv-terrein een veilig gebruik kan worden gemaakt;

      b. maatregelen worden getroffen voor een behoorlijk toezicht op de veiligheid en goede orde op het ulv-terrein,
      waaronder het vaststellen van het aantal ulv's dat tegelijkertijd van het circuitgebied gebruik mag maken.

      2 De beheerder is verplicht terstond Onze Minister in te lichten omtrent onregelmatigheden in het gebruik van het
      ulv-terrein.

      3 De beheerder zorgt dat het gebruik van ulv's in een register wordt bijgehouden. In dit register worden de
      navolgende gegevens vermeld:

        - het inschrijvingskenmerk alsmede het type ulv;
        - datum en tijdstip van aankomst en vertrek;
        - ulv-terrein van bestemming en vertrek.

      Elk kwartaal wordt een afschrift hiervan, onder vermelding van eventuele bijzonderheden, gezonden aan het college
      van burgemeester en wethouders van de gemeente, waarin het terrein is gelegen, en aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004417/2003-01-01#Artikel20f
  - number: 20g
    text: |-
      1 Klachten met betrekking tot het gebruik van het ulv-terrein kunnen worden ingediend bij Onze Minister.

      2 Onze Minister geeft nadere regels voor de klachtprocedure.

      3 Onze Minister kan, indien de inhoud van klachten daartoe aanleiding geeft, de beheerder gehoord, de aan de
      vergunning voor het betrokken ulv-terrein verbonden voorschriften of beperkingen wijzigen.
    url: https://wetten.overheid.nl/BWBR0004417/2003-01-01#Artikel20g
  - number: 20h
    text: |-
      Onze Minister kan de vergunning schorsen of intrekken, indien het desbetreffende ulv-terrein wordt gebruikt in
      strijd met de aan de vergunning verbonden voorschriften of beperkingen dan wel indien het ulv-terrein niet of niet
      meer voldoet aan de bepalingen van dit besluit.
    url: https://wetten.overheid.nl/BWBR0004417/2003-01-01#Artikel20h
  - number: 20i
    text: |-
      Artikel 14, eerste lid, aanhef en onder *a* en *b*, van de [Luchtvaartwet][ref1], zijn ten aanzien van ulv's
      niet van toepassing in geval van opstijgen van of landen op een ulv-terrein, indien aan de bij of krachtens dit
      hoofdstuk gegeven voorschriften wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002267
    url: https://wetten.overheid.nl/BWBR0004417/2003-01-01#Artikel20i
    references:
      - id: ref1
        bwb_id: BWBR0002267
  - number: '21'
    text: |-
      Ons besluit van 14 december 1976 *Staatsblad* 1976, 716 houdende regelen inzake het met luchvaartuigen opstijgen en
      landen op niet als luchtvaartterrein aangewezen terreinen, wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004417/2003-01-01#Artikel21
  - number: '22'
    text: Dit besluit treedt in werking twee maanden na het verschijnen van het *Staatsblad* waarin het is opgenomen.
    url: https://wetten.overheid.nl/BWBR0004417/2003-01-01#Artikel22
  - number: '23'
    text: Dit besluit kan worden aangehaald als "Besluit inrichting en gebruik niet aangewezen luchtvaartterreinen".
    url: https://wetten.overheid.nl/BWBR0004417/2003-01-01#Artikel23
