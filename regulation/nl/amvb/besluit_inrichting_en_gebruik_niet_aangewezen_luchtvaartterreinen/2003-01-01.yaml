  - number: '4'
    text: |-
      1 Indien meer dan twee maal per dag op hetzelfde heliterrein wordt geland en daarvan wordt opgestegen, zijn de
      volgende eisen ten aanzien van het heliterrein van toepassing.

      a. De afmetingen van het heliterrein moeten ten minste als volgt zijn:

      1°. lengte: 3 maal de lengte over alles van het te gebruiken hefschroefvliegtuig;

      2°. breedte: 2 maal de lengte over alles van het te gebruiken hefschroefvliegtuig.

      b. De lange zijde van het terrein dient bij voorkeur parallel te liggen aan de hartlijn van de in- en
      uitvliegsector en bij voorkeur zijn gelegen in de overheersende windrichting.

      c. In de in- en uitvliegsectoren van het heliterrein mogen geen hindernissen (inclusief publiek) steken
      door een denkbeeldig vlak, dat met de korte zijde van dit terrein als basis, oploopt onder een hoek van 1:8
      (hoogte:afstand), tot een afstand van 300 meter, gemeten vanaf de landingsplaats.

      d. Ter weerszijden van de lange zijde van het heliterrein en van de in- en uitvliegsectoren mogen geen hindernissen
      steken door een denkbeeldig vlak dat vanaf de lange zijden van dit terrein oploopt onder een hoek van 1:2
      (hoogte:afstand), tot een afstand van 75 meter.

      e. De snijlijnen van [de onder ][ref1] en [][ref2] genoemde vlakken bepalen de divergentie van het vlak
      [onder ][ref3].

      f. Bij het gebruik van een heliterrein moet in de nabijheid ervan de windrichting worden aangegeven door middel van
      een windzak, een vlag of een ander gelijkwaardig middel. Het heliterrein moet worden gemarkeerd door middel van een
      hoofdletter H, in de kleur wit met de afmetingen circa 3 meter hoog, circa 1,80 meter breed en een lijndikte van
      circa 0,40 meter en waarvan de dwarsbalk loodrecht op de preferentie in- en uitvliegsectoren is gelegen.

      g. Voordat van het heliterrein gebruik mag worden gemaakt is de eigenaar of houder van het hefschroefvliegtuig,
      dat wordt gebruikt verplicht zich ervan te vergewissen, dat het betrokken terrein ten minste voldoet aan het
      gestelde in dit lid onder *a* t/m *e*. Hij dient er tevens voor zorg te dragen dat de gezagvoerder van het
      hefschroefvliegtuig wordt ingelicht over de terreinomstandigheden en de hindernissituatie in de directe omgeving
      van het heliterrein.

      2 Het gestelde in het eerste lid onder *c, d* en *e* geldt niet ten aanzien van het gebruik van een meermotorig
      hefschroefvliegtuig, mits een zodanige gewicht/vermogensverhouding wordt gekozen, dat onder de heersende
      weersomstandigheden bij uitval van een motor, een veilige noodlanding kan worden uitgevoerd op het heliterrein, dan
      wel de vlucht op een veilige hoogte kan worden voortgezet.

      3 a. Voor het uitvoeren van niet meer dan twee landingen en opstijgingen per dag op en van hetzelfde heliterrein
      moet dit heliterrein ten minste zodanige afmetingen hebben, dat daarin een denkbeeldige cirkel kan worden
      beschreven met een diameter van anderhalf maal de lengte over alles van het betrokken hefschroefvliegtuig, terwijl
      de hindernissituatie in de directe omgeving van het heliterrein zodanig moet zijn, dat een veilige landing en
      opstijging kan worden uitgevoerd.

      b. In de onmiddellijke omgeving van het heliterrein moeten in dat geval voldoende geschikte terreinen aanwezig zijn
      voor het uitvoeren van een nood- of voorzorgslanding bij een plotseling optredende storing van een motor.

      c. Alvorens op een zodanig heliterrein te landen moet de gezagvoerder de omgeving van het heliterrein hebben
      verkend en zich op de hoogte hebben gesteld van de terreinomstandigheden en de hindernissituatie.


