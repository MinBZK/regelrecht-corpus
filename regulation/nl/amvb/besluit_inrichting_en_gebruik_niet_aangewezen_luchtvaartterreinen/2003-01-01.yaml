  - number: '2'
    text: |-
      1 De verbodsbepalingen bedoeld in [artikel 14, eerste lid onder ][ref1] zijn niet van toepassing in geval van het
      opstijgen of doen opstijgen van en het landen of doen landen op niet als luchtvaartterrein aangewezen terreinen,
      met militaire hefschroefvliegtuigen, in gebruik bij de Nederlandse dan wel bondgenootschappelijke krijgsmacht, en
      met hefschroefvliegtuigen in gebruik bij het Korps landelijke politiediensten, alsmede hefschroefvliegtuigen welke
      worden gebruikt ten behoeve van spoedeisende hulpverlening.

      2 De verbodsbepalingen bedoeld in [artikel 14, eerste lid onder ][ref2] zijn niet van toepassing in geval van
      het opstijgen of doen opstijgen van en het landen of doen landen op een helihaven of een heliterrein, met in het
      Nederlands Luchtvaartuigregister ingeschreven burgerhefschroefvliegtuigen, indien aan de in [dit hoofdstuk][ref3]
      gegeven voorschriften wordt voldaan.

      3 De verbodsbepalingen in [artikel 14, eerste lid, onder a en b, van de Luchtvaartwet](onbekend) zijn niet van
      toepassing op het landen of opstijgen van een helihaven, geplaatst op een mijnbouwinstallatie als bedoeld in
      [artikel 1, onderdeel o, van de Mijnbouwwet](onbekend) voor zover hiervoor bij of krachtens die wet regels zijn
      gesteld.


