  - number: '3'
    text: |-
      1 Een heliterrein moet zijn gelegen buiten een luchtvaartterreinverkeersgebied (ATZ).

      2 Een heliterrein moet verder zijn gelegen dan 50 meter van aaneengesloten woonbebouwing, met inachtneming van het
      gestelde in [artikel 4, eerste lid onder c, d en e][ref1].

      3 Een heliterrein moet verder zijn gelegen dan 50 meter van een openbare weg, tenzij deze weg door de bevoegde
      autoriteiten is afgezet.

      4 Een heliterrein moet zodanig zijn gelegen dat het landen en opstijgen kan geschieden, zonder dat daarbij behoeft
      te worden gevlogen boven gebieden met aaneengesloten bebouwing of kunstwerken, met inbegrip van industrie- en
      havengebieden, tenzij gebruik wordt gemaakt van een meermotorig hefschroefvliegtuig indien kan worden voldaan aan
      het gestelde in [artikel 4, tweede lid][ref2], ten aanzien van de gewicht/vermogensverhouding.

      5 Het heliterrein moet vrij zijn van hindernissen en zodanig afgezet dat het bij gebruik vrij van publiek is.

      6 Het innemen van brandstof op het heliterrein is slechts toegestaan met stilstaande rotor en zonder dat zich
      passagiers aan boord bevinden. Tijdens het tanken moeten in de nabijheid van het hefschroefvliegtuig blusmiddelen
      aanwezig zijn, bestaande uit ten minste een draagbaar blustoestel met een vulling van 9 kg bluspoeder.

      7 Indien met draaiende rotor passagiers in- en uit moeten stappen moeten deze onder geleide van daartoe getraind
      personeel naar en van het hefschroefvliegtuig worden geleid.

      8 Indien een heliterrein is gelegen binnen 4 kilometer van een ingevolge de [Luchtvaartwet][ref3] aangewezen
      niet gecontroleerde luchtvaartterrein, moet het gebruik van dat heliterrein vooraf worden gecoördineerd met de
      havenmeester van het betreffende luchtvaartterrein.

      9 Indien een heliterrein is gelegen binnen een plaatselijk verkeersleidingsgebied moet voor het gebruik van dat
      heliterrein vooraf toestemming zijn verkregen van de plaatselijke verkeersleidingsdienst.


