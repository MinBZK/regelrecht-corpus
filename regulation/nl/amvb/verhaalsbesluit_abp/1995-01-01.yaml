  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Binnenlandse Zaken van 1 juni 1994, nr. AB94/U830, directoraat-generaal
    Management en Personeelsbeleid, directie Arbeidszaken Overheid, afdeling Uitkeringen en Pensioenen;


    Gelet op artikel 10, eerste en vierde lid, van de Wet financiële voorzieningen privatisering ABP;


    De Raad van State gehoord (advies van 20 juni 1994, No. W094.0329.);


    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken van 4 augustus 1994, nr. AB94/1066, directoraat-
    generaal Management en Personeelsbeleid, directie Arbeidszaken Overheid, afdeling Uitkeringen en Pensioenen;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006869/1995-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. wet: de [Wet financiële voorzieningen privatisering ABP][ref1];

      b. Abp-wet: de [Algemene burgerlijke pensioenwet](onbekend);

      c. verhaal: het pensioenbijdrageverhaal, bedoeld in [artikel 10](onbekend) van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0007211
    url: https://wetten.overheid.nl/BWBR0006869/1995-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007211
  - number: '2'
    text: >-
      Van een deelnemer die slechts een gedeelte van zijn ambtelijk inkomen geniet omdat hij wegens ziekte verhinderd
      is om dienst te verrichten, wordt het overeenkomstig [artikel 10](onbekend) van de wet berekende verhaal naar
      evenredigheid verminderd.
    url: https://wetten.overheid.nl/BWBR0006869/1995-01-01#Artikel2
  - number: '3'
    text: |-
      1 Geen verhaal vindt plaats gedurende de tijd die krachtens [artikel F 2, eerste lid, derde lid, onderdeel a, of
      vierde lid, van de Abp-wet](onbekend) niet meetelt bij de pensioenberekening.

      2 Gedurende de tijd die krachtens [artikel F 2, eerste of tweede lid, van de Abp-wet](onbekend) meetelt bij de
      pensioenberekening en waarin de deelnemer uitsluitend in zijn persoonlijk belang is ontheven van de uitoefening
      van zijn betrekking, is het verhaal gelijk aan de pensioenbijdrage die de betrokken werkgever voor hem verschuldigd
      is. Dit lid is niet van toepassing indien de ontheffing is verleend voor ten hoogste veertien aaneengesloten
      kalenderdagen.

      3 Tenzij bij de ontheffing anders is bepaald, is gedurende de tijd waarin de deelnemer uitsluitend in zijn
      persoonlijk belang gedeeltelijk van de uitoefening van zijn betrekking is ontheven en [artikel C 1, derde lid,
      van de Abp-wet](onbekend) toepassing vindt, het tweede lid van overeenkomstige toepassing voor zover het betreft
      de gedeelten van de verschuldigde pensioenbijdrage en van het verschuldigde verhaal die kunnen worden geacht
      betrekking te hebben op de tijd waarvoor de ontheffing geldt.

      4 Ten aanzien van een deelnemer die ouderschapsverlof geniet, vindt verhaal plaats overeenkomstig [artikel 10]
      (onbekend) van de wet.

      5 Gedurende de tijd die meetelt bij de pensioenberekening en waarin de deelnemer niet uitsluitend in zijn
      persoonlijk belang dan wel voor ten hoogste veertien aaneengesloten kalenderdagen uitsluitend in zijn persoonlijk
      belang is ontheven van de uitoefening van zijn betrekking, wordt het verhaal berekend overeenkomstig [artikel 10]
      (onbekend) van de wet dan wel [artikel 2][ref1] van dit besluit, met dien verstande dat de betrokken werkgever ter
      zake van dat verhaal nadere voorwaarden kan stellen bij de bedoelde ontheffing.


      [ref1]: https://wetten.overheid.nl/BWBR0006869#Artikel2
    url: https://wetten.overheid.nl/BWBR0006869/1995-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006869
        artikel: '2'
  - number: '4'
    text: |-
      [Artikel 3, tweede lid, eerste volzin en derde lid][ref1], zijn van overeenkomstige toepassing op of ten aanzien
      van de tijd waarover de deelnemer geen of slechts gedeeltelijk ambtelijk inkomen geniet wegens schorsing of omdat
      hij zonder daartoe verkregen verlof zijn betrekking niet uitoefent.


      [ref1]: https://wetten.overheid.nl/BWBR0006869#Artikel3
    url: https://wetten.overheid.nl/BWBR0006869/1995-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006869
        artikel: '3'
  - number: '5'
    text: >-
      1 De deelnemer die minder wachtgeld geniet dan het door hem verschuldigde verhaal bedraagt, wordt door de werkgever
      die het wachtgeld uitbetaalt tijdig geïnformeerd omtrent de inhoud en de strekking van [artikel D 4, zesde lid, van
      de Abp-wet](onbekend).


      2 De deelnemer ten aanzien van wie de werkgever het verschuldigde verhaal niet of niet volledig op zijn salaris
      kan inhouden, voldoet de dientengevolge op hem rustende schuld maandelijks. De werkgever kan met de deelnemer een
      afwijkende betalingsregeling treffen.


      3 Zodra vaststaat dat bij de pensioenberekening niet meetelt:


      a. de tijd, bedoeld in [artikel F 2, tweede lid, van de Abp-wet](onbekend), wegens het gemaakte voorbehoud, dan wel


      b. de tijd, bedoeld in [artikel F 2, derde lid, onderdeel ](onbekend), omdat de gestelde voorwaarde is vervuld,
      dan wel


      c. de tijd, bedoeld in [artikel F 2, vijfde lid, van de Abp-wet](onbekend), omdat het daar genoemde pensioen is
      toegekend,


      gaat de ter zake van het verhaal over die tijd bestaande schuld teniet en worden de over die tijd door de deelnemer
      betaalde bedragen door de werkgever gerestitueerd aan de deelnemer of zijn rechtverkrijgenden.


      4 Het pensioenbijdrageverhaal, genoemd in [artikel 10](onbekend), van de wet wordt over nabetalingen aan een
      ontslagen deelnemer, waarover pensioenbijdrage is verschuldigd, op een zelfde wijze berekend als het verhaal over
      de laatste uitbetalingstermijn voor het ontslag.
    url: https://wetten.overheid.nl/BWBR0006869/1995-01-01#Artikel5
  - number: '6'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van dit besluit.
    url: https://wetten.overheid.nl/BWBR0006869/1995-01-01#Artikel6
  - number: '7'
    text: >-
      1 Het Verhaalsbesluit Algemene burgerlijke pensioenwet wordt ingetrokken.


      2 Bedragen die op het tijdstip van inwerkingtreding van dit besluit door een deelnemer verschuldigd zijn ingevolge
      artikel 8 van het besluit, bedoeld in het eerste lid, zijn met ingang van dat tijdstip verschuldigd krachtens dit
      besluit.
    url: https://wetten.overheid.nl/BWBR0006869/1995-01-01#Artikel7
  - number: '8'
    text: |-
      Dit besluit treedt in werking met ingang van de dag waarop
      [paragraaf 2 van de Wet financiële voorzieningen privatisering ABP][ref1] in werking treedt.


