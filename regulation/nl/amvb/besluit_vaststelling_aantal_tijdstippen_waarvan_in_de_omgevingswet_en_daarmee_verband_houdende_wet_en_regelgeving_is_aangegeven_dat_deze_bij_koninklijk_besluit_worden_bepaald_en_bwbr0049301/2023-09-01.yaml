preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister voor Volkshuisvesting en Ruimtelijke Ordening van 5 juli 2023, nr. 2023-
    0000385226;

    Gelet op de artikelen 22.4, 22.5, eerste en tweede lid, 22.6, derde lid, 22.15, 22.16, eerste en tweede lid, en
    22.17 van de Omgevingswet, de artikelen 4.9, eerste lid, en 5.3 van de Invoeringswet Omgevingswet, de artikelen
    8.2.2 en 8.2.11 van het Invoeringsbesluit Omgevingswet en artikel XIV, vijfde lid, van het Aanvullingsbesluit bodem
    Omgevingswet;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0049301/2023-09-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Het tijdstip, bedoeld in de [artikelen 22.4][ref1], [22.5, eerste en tweede lid][ref2], [22.6, derde lid][ref3],
      [22.16, eerste en tweede lid][ref4], en [22.17 van de Omgevingswet][ref5] en de [artikelen 8.2.2][ref6] en
      [8.2.11 van het Invoeringsbesluit Omgevingswet][ref7], wordt bepaald op 1 januari 2032.

      2 Het tijdstip, bedoeld in [artikel 22.15 van de Omgevingswet][ref8], wordt bepaald op 1 januari 2026.

      3 Het tijdstip, bedoeld in [artikel 4.9, eerste lid, van de Invoeringswet Omgevingswet][ref9], wordt bepaald op
      1 januari 2027.

      4 Het tijdstip, bedoeld in [artikel XVI, vijfde lid, van het Aanvullingsbesluit bodem Omgevingswet][ref10], wordt
      bepaald op 1 januari 2032.


