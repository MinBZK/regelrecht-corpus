  - number: 5.3.a
    text: |-
      In de in het eerste lid, onder *a*, genoemde EG-verklaring van overeenstemming wordt voor wat betreft het onderwerp
      overeenstemming:
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel5
  - number: 5.3.a.a
    text: 'indien de verklaring betrekking heeft op machines waarvoor:'
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel5
  - number: 5.3.a.a.1
    text: de in het tweede lid, onder *a*, ten eerste, bedoelde procedure is gevolgd, dan wel
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel5
  - number: 5.3.a.a.2
    text: |-
      de in het tweede lid, onder *a*, ten tweede, onderdelen *a* en *b*, bedoelde procedures zijn gevolgd, uitsluitend
      vermeld dat overeenstemming bestaat met de fundamentele eisen, opgenomen in bijlage I van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel5
  - number: 5.3.a.b
    text: 'indien de verklaring betrekking heeft op machines waarvoor:'
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel5
  - number: 5.3.a.b.1
    text: de in het tweede lid, onder *a*, ten tweede, onderdeel *c*, bedoelde procedure is gevolgd, dan wel,
