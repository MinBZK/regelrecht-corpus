  - number: 5.3.b.b
    text: 'indien de verklaring betrekking heeft op veiligheidscomponenten waarvoor:'
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel5
  - number: 5.3.b.b.1
    text: de in het tweede lid, onder *b*, ten tweede, onderdeel *c*, bedoelde procedure is gevolgd, dan wel,
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel5
  - number: 5.3.b.b.2
    text: |-
      de in het tweede lid, onder *b*, ten derde, bedoelde procedure is gevolgd, de overeenstemming vermeld met het type
      waarvoor een EG-type-onderzoekverklaring is verkregen.
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel5
  - number: 5.4.a
    text: 'Voor wat betreft machines waarvoor:'
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel5
  - number: 5.4.a.1
    text: |-
      de in het tweede lid, onder *a*, ten tweede, onderdeel *a*, bedoelde procedure is gevolgd, zijn punt 5, eerste
      volzin, en punt 7 van bijlage VI van de richtlijn van overeenkomstige toepassing;
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel5
  - number: 5.4.a.2
    text: |-
      de in het tweede lid, onder *a*, ten tweede, onderdeel *b*, bedoelde procedure is gevolgd, zijn de punten 5, 6 en 7
      van bijlage VI van de richtlijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel5
  - number: 5.4.a.b
    text: 'Voor wat betreft veiligheidscomponenten waarvoor:'
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel5
  - number: 5.4.a.b.1
    text: |-
      de in het eerste lid, onder *b*, ten tweede, onderdeel *a*, bedoelde procedure is gevolgd, zijn punt 5, eerste
      volzin, en punt 7 van bijlage VI van de richtlijn van overeenkomstige toepassing;
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel5
  - number: 5.4.a.b.2
    text: |-
      de in het tweede lid, onder *b*, ten tweede, onderdeel *b*, bedoelde procedure is gevolgd, zijn de punten 5, 6 en 7
      van bijlage VI van de richtlijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel5
  - number: 5.5.a
    text: |-
      Indien de in Nederland gevestigde fabrikant, diens in Nederland gevestigde gemachtigde, of, indien zij geen van
      beide in Nederland zijn gevestigd, degene die de machines of veiligheidscomponenten in Nederland in de handel
      brengt, voornemens is aan het model van een machine of veiligheidscomponent, of aan te vervaardigen en in de handel
      te brengen machines of veiligheidscomponenten, waarvoor een verklaring van typeonderzoek is afgegeven, wijzigingen
      aan te brengen, stelt hij de aangewezen aangemelde instelling die de verklaring van typeonderzoek heeft afgegeven
      hiervan onverwijld in kennis.
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel5
  - number: 5.5.b
    text: |-
      De aangewezen aangemelde instelling, bedoeld in onderdeel a, beoordeelt de wijzigingen en deelt de in onderdeel a
      bedoelde persoon mede of de typeonderzoekverklaring voor het aldus gewijzigde model of de gewijzigde machines of
      veiligheidscomponenten geldig is.
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel5
  - number: 5.5.c
    text: |-
      Indien de aangewezen aangemelde instelling, bedoeld in onderdeel a, van oordeel is dat de verklaring van EG-
      typeonderzoek voor de gewijzigde machine of veiligheidscomponent niet geldig is, moet deze machine of die
      veiligheidscomponent aan een EG-typeonderzoek worden onderworpen.
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel5
  - number: 5a.1
    text: |-
      De verplichtingen van [artikel 5][ref1] rusten tevens op degene die machines, machineonderdelen of
      veiligheidscomponenten van verschillende herkomst assembleert of die machines of veiligheidscomponenten voor eigen
      gebruik vervaardigt.


      [ref1]: https://wetten.overheid.nl/BWBR0005577#Artikel5
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0005577
        artikel: '5'
        hoofdstuk: '3'
  - number: 5a.2
    text: |-
      De verplichtingen van [artikel 5][ref1] gelden niet voor degenen die een verwisselbaar uitrustingsstuk als bedoeld
      in [artikel 1, onderdeel a, sub 2°][ref2] op een machine of een trekker aansluiten, mits de elementen compatibel
      zijn, en alle delen waaruit de machine na de aansluiting bestaat voorzien zijn van de CE-markering en vergezeld
      gaan van de EG-verklaring van overeenstemming.


      [ref1]: https://wetten.overheid.nl/BWBR0005577#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005577#Artikel1
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0005577
        artikel: '5'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0005577
        artikel: '1'
        hoofdstuk: '1'
  - number: 5a.3
    text: |-
      [Artikel 5, eerste lid, onder a][ref1], is niet van toepassing op machines die volgens de in bijlage II, onderdeel
      B, van de richtlijn bedoelde verklaring van de in de Europese Economische Ruimte gevestigde fabrikant of diens
      gemachtigde of, indien zij geen van beide in de Europese Economische Ruimte zijn gevestigd, degene die de machines
      in de Europese Economische Ruimte in de handel brengt, bestemd zijn om - te worden ingebouwd in een machine, of
        - met andere machines te worden samengebouwd tot één machine, en op de samenstellingen dit besluit van toepassing
      is, tenzij de machines waarop de verklaring betrekking heeft, zelfstandig kunnen werken.


      [ref1]: https://wetten.overheid.nl/BWBR0005577#Artikel5
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0005577
        artikel: '5'
        hoofdstuk: '3'
  - number: '6.1'
    text: |-
      De in [artikel 5, eerste lid][ref1], bedoelde aanduiding wordt duidelijk leesbaar en onuitwisbaar op de machine
      aangebracht, overeenkomstig de bijlagen I, punt 1.7.3, en III van de richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005577#Artikel5
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005577
        artikel: '5'
        hoofdstuk: '3'
  - number: '6.2'
    text: |-
      Ten aanzien van machines mogen geen vermeldingen, vaststellingen of aanduidingen worden gebezigd, welke met de in
      [artikel 5, eerste lid][ref1], bedoelde aanduiding kunnen worden verward. Op de machines mogen andere markeringen
      worden aangebracht op voorwaarde dat de zichtbaarheid en de leesbaarheid van de CE-markering niet worden
      verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0005577#Artikel5
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005577
        artikel: '5'
        hoofdstuk: '3'
  - number: 6a
    text: |-
      Een EG-typeonderzoekverklaring wordt door de aangewezen aangemelde instelling die haar heeft afgegeven ingetrokken
      indien de fundamentele eisen van bijlage I van de richtlijn zodanig zijn gewijzigd dat het model niet aan de
      gewijzigde eisen voldoet.
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel6a
  - number: 6b.1
    text: |-
      Degene die een machine of een veiligheidscomponent verhandelt of gebruikt zorgt er voor dat de machine of de
      veiligheidscomponent in goede staat van onderhoud verkeert.
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel6b
  - number: 6b.2
    text: |-
      Het eerste lid is niet van toepassing op degene die een machine of een veiligheidscomponent voorhanden heeft die
      hetzij is afgekeurd, hetzij onklaar gemaakt, hetzij anderszins kennelijk niet meer voor gebruik bestemd is.
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel6b
  - number: 6c
    text: |-
      Artikel 2, eerste tot en met derde lid, is niet van toepassing op het tentoonstellen en demonstreren op
      (jaar)beurzen, exposities en bij demonstraties van machines of veiligheidscomponenten die niet in overeenstemming
      zijn met dit besluit, mits op een zichtbaar bord duidelijk is aangegeven dat zij niet in overeenstemming zijn
      met dit besluit en niet te koop zijn voordat zij door de fabrikant of zijn in de Europese Economische Ruimte
      gevestigde gevolmachtigde in overeenstemming zijn gebracht met dit besluit. Bij demonstraties zijn alle passende
      veiligheidsmaatregelen genomen om de bescherming van de mens te waarborgen.
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel6c
  - number: 6d.1
    text: |-
      Een hijskraan met een bedrijfslast die gelijk is aan of hoger is dan twee ton wordt ten minste eenmaal per 12
      maanden gekeurd. In aanvulling daarop wordt een mobiele kraan of torenkraan, die behoort tot een bij ministeriële
      regeling omschreven categorie, ten hoogste 24 maanden na de eerste ingebruikneming en vervolgens telkens na verloop
      van ten hoogste vierentwintig maanden gekeurd.
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel6d
  - number: 6d.2
    text: |-
      De periodieke keuring, bedoeld in het eerste lid, vindt ten hoogste een maand na het verstrijken van de genoemde
      periode plaats indien degene die de keuring uitvoert dit uit oogpunt van bedrijfsvoering noodzakelijk acht.
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel6d
  - number: 6d.3
    text: |-
      De keuring bedoeld in het eerste lid, eerste zin, wordt uitgevoerd door een deskundige natuurlijke persoon,
      rechtspersoon of instelling. In afwijking daarvan wordt de keuring bedoeld in het eerste lid, tweede zin, van een
      mobiele kraan of torenkraan uitgevoerd door een aangewezen instelling.
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel6d
  - number: 6e.1
    text: |-
      De aangewezen instelling geeft op aanvraag een certificaat van goedkeuring af aan de aanvrager indien zij heeft
      vastgesteld dat de hijskraan voldoet aan de bij ministeriële regeling vastgestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel6e
  - number: 6e.2
    text: |-
      Een certificaat kan worden geweigerd of onder voorschriften worden afgegeven, worden verlengd dan wel geschorst of
      ingetrokken, indien is gebleken dat niet of niet volledig is voldaan aan bij of krachtens de wet met betrekking tot
      het certificaat gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel6e
  - number: 6f.1
    text: |-
      In de nabijheid van een hijskraan als bedoeld in [artikel 6d, eerste lid][ref1], bevindt zich een kraanboek. In
      dit boek zijn in ieder geval de resultaten van de op grond van [artikel 6d][ref2] uitgevoerde keuringen op adequate
      wijze vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005577#Artikel6d
      [ref2]: https://wetten.overheid.nl/BWBR0005577#Artikel6d
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel6f
    references:
      - id: ref1
        bwb_id: BWBR0005577
        artikel: 6d
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0005577
        artikel: 6d
        hoofdstuk: '4'
  - number: 6f.2
    text: |-
      Op het certificaat van goedkeuring wordt de datum van keuring vermeld, alsmede gegevens betreffende de
      identificatie van de hijskraan. Het certificaat van goedkeuring of een afschrift daarvan bevindt zich in de
      nabijheid van de hijskraan.
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel6f
  - number: 6f.3
    text: |-
      Het kraanboek en het certificaat van goedkeuring of een afschrift daarvan worden desgevraagd getoond aan een
      ambtenaar als bedoeld in [artikel 25 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel25
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel6f
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: '25'
  - number: 6g.1
    text: 'Als aangewezen instelling of aangewezen aangemelde instelling kan worden aangewezen een instelling die:'
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel6g
  - number: 6g.1.a
    text: rechtspersoonlijkheid heeft;
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel6g
  - number: 6g.1.b
    text: haar zetel of een vestiging in Nederland heeft;
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel6g
  - number: 6g.1.c
    text: |-
      onafhankelijk is van degenen die bij het resultaat van de uitvoering van de taken waarvoor zij is aangewezen belang
      hebben;
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel6g
  - number: 6g.1.d
    text: |-
      beschikt over voldoende deskundigheid en outillage om de uitvoering van de taken waarvoor zij is aangewezen, naar
      behoren te kunnen vervullen;
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel6g
  - number: 6g.1.e
    text: |-
      beschikt over een behoorlijke administratie waarin de gegevens die samenhangen met en betrekking hebben op de
      uitvoering van haar taken, op een systematische wijze zijn vastgelegd. Aan de hand van deze gegevens zijn de
      gekeurde of gecertificeerde machines afdoende te identificeren;
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel6g
  - number: 6g.1.f
    text: naar behoren functioneert.
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel6g
  - number: 6g.2
    text: |-
      In aanvulling op het eerste lid komen voor een aanwijzing als aangewezen aangemelde instelling slechts in
      aanmerking instellingen die ten minste voldoen aan de in bijlage VII van de richtlijn neergelegde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel6g
  - number: 6g.3
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel6g
  - number: 6h
    text: |-
      De instelling verstrekt jaarlijks aan Onze Minister een afschrift van de polis van de afgesloten verzekering tegen
      wettelijke aansprakelijkheid tegen alle risico's die voortvloeien uit de uitoefening van de taken waarvoor zij
      is aangewezen.
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel6h
  - number: 6i.1
    text: |-
      Indien een wijziging plaatsvindt in de gegevens op grond waarvan de instelling is aangewezen, doet de instelling
      hiervan terstond mededeling aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel6i
  - number: 6i.2
    text: |-
      Indien een instelling voornemens is een of meer van de taken waarvoor zij is aangewezen, te beëindigen, doet
      de instelling hiervan terstond mededeling aan Onze Minister en de certificaathouders. In dat geval worden door
      de instelling de gegevens, bedoeld in artikel 6g, eerste lid, onder e, overgedragen aan Onze Minister dan wel,
      na toestemming van Onze Minister en de certificaathouders, een andere instelling die voor dezelfde taken is
      aangewezen.
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel6i
  - number: 6j.1
    text: |-
      Een aanvraag om aanwijzing gaat vergezeld van het bewijs dat is voldaan aan de criteria, bedoeld in artikel 6g,
      eerste lid, dan wel in geval van artikel 6g, tweede lid, tevens van bewijs dat is voldaan aan de voorwaarden,
      bedoeld in dat lid, dan wel van een verklaring waaruit de bereidheid blijkt om voor eigen rekening een onderzoek
      naar het voldoen aan deze criteria dan wel voorwaarden te ondergaan.
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel6j
  - number: 6j.2
    text: |-
      Een aanwijzing kan worden geweigerd, dan wel worden gewijzigd of ingetrokken, indien niet of niet volledig is
      voldaan aan de bij de wet of bij of krachtens dit besluit gestelde voorschriften. Een aanwijzing kan worden
      ingetrokken indien de instelling gedurende een aaneengesloten periode van twee jaar geen werkzaamheden, waarvoor
      zij is aangewezen, heeft uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel6j
  - number: 6j.3
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel6j
  - number: 6k.1
    text: |-
      Onverminderd het tweede tot en met vijfde lid zijn op machines waarop het [Besluit machines][ref1] van toepassing
      was, die voor 17 maart 1993 in de handel zijn gebracht en in gebruik genomen, de [artikelen 3][ref2] en [5][ref3]
      niet van toepassing voor zover zij niet alsnog in overeenstemming met [artikel 3][ref4] worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005884
      [ref2]: https://wetten.overheid.nl/BWBR0005577#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0005577#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005577#Artikel3
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel6k
    references:
      - id: ref1
        bwb_id: BWBR0005884
      - id: ref2
        bwb_id: BWBR0005577
        artikel: '3'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0005577
        artikel: '5'
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0005577
        artikel: '3'
        hoofdstuk: '2'
  - number: 6k.2
    text: |-
      Op de machines ten aanzien waarvan op 31 december 1992 het Besluit acetyleenontwikkelaars, het Veiligheidsbesluit
      gevaarlijke werktuigen, het Dorsgarniturenbesluit dan wel het Besluit verplaatsbare transporteurs van toepassing
      is en die vóór 1 januari 1995 in overeenstemming met de bepalingen van die algemene maatregelen van bestuur zijn
      vervaardigd en in gebruik genomen, zijn de [artikelen 3][ref1] en [5][ref2] niet van toepassing, voor zover zij
      niet alsnog in overeenstemming met [artikel 3][ref3] worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005577#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005577#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005577#Artikel3
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel6k
    references:
      - id: ref1
        bwb_id: BWBR0005577
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005577
        artikel: '5'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0005577
        artikel: '3'
        hoofdstuk: '2'
  - number: 6k.3
    text: |-
      Op de machines en veiligheidscomponenten ten aanzien waarvan op 31 december 1992 het Besluit gemotoriseerde
      transportwerktuigen van toepassing was en die vóór 1 januari 1996 in overeenstemming met de bepalingen van dat
      besluit zijn vervaardigd en in gebruik genomen, zijn de [artikelen 3][ref1] en [5][ref2] niet van toepassing, voor
      zover zij niet alsnog in overeenstemming met [artikel 3][ref3] worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005577#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005577#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005577#Artikel3
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel6k
    references:
      - id: ref1
        bwb_id: BWBR0005577
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005577
        artikel: '5'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0005577
        artikel: '3'
        hoofdstuk: '2'
  - number: 6k.4
    text: |-
      Op de machines en veiligheidscomponenten ten aanzien waarvan op 14 juni 1993 het Besluit kantel- en
      valbeveiligingen bouwmachines van toepassing was en die vóór 1 januari 1997 in overeenstemming met de bepalingen
      van dat besluit zijn vervaardigd en in gebruik genomen, zijn de [artikelen 3][ref1] en [5][ref2] niet van
      toepassing, voor zover zij niet alsnog in overeenstemming met [artikel 3][ref3] worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005577#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005577#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005577#Artikel3
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel6k
    references:
      - id: ref1
        bwb_id: BWBR0005577
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005577
        artikel: '5'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0005577
        artikel: '3'
        hoofdstuk: '2'
  - number: 6k.5
    text: |-
      De [artikelen 3][ref1] en [5][ref2] zijn niet van toepassing op machines voor het heffen of verplaatsen van
      mensen en op veiligheidscomponenten waarop het [Besluit machines][ref3] van toepassing was en die voldoen aan de
      wettelijke voorschriften zoals die luidden op 16 maart 1993 en die voor 1 januari 1997 in de handel zijn gebracht
      en in gebruik genomen, voor zover zij niet alsnog in overeenstemming met [artikel 3][ref4] worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005577#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005577#Artikel5
