preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 13 december 1991, VVP/P-
    U 692408, gedaan in overeenstemming met Onze Minister van Economische Zaken en Onze Minister van Sociale Zaken
    en Werkgelegenheid;

    Overwegende, dat het, gelet op richtlijn 89/392/EEG van de Raad van de Europese Gemeenschappen van 14 juni 1989,
    inzake de onderlinge aanpassing van de wetgevingen van de lid-staten betreffende machines (PbEG L 183) en richtlijn
    91/368/EEG van de Raad van de Europese Gemeenschappen van 20 juni 1991 tot wijziging van richtlijn 89/392/EEG (PbEG
    L 198), noodzakelijk is regels te stellen ten aanzien van de veiligheid van machines;

    Gelet op de artikelen 4, eerste lid, onderdeel a, 8, onderdelen a, b en c, 11, 12, 13 en 14 van de Warenwet (Stb.
    1988, 360);

    Gezien het advies van de Adviescommissie Warenwet van 18 september 1991, nr 14403/(41)5;

    De Raad van State gehoord (advies van 14 april 1992, nr. W13.92.0006);

    Gezien het nader rapport van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 12 juni 1992, VVP/P
    921207, uitgebracht in overeenstemming met Onze Minister van Economische Zaken en Onze Minister van Sociale Zaken
    en Werkgelegenheid;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel1
  - number: 1.1.a
    text: 'machine:'
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel1
  - number: 1.1.a.1°
    text: |-
      een samenstel van onderling verbonden onderdelen of organen waarvan er ten minste één kan bewegen, alsmede in
      voorkomend geval van aandrijfmechanismen, bedienings- en vermogensschakelingen en dergelijke, die in hun samenhang
      bestemd zijn voor een bepaalde toepassing, onder meer de verwerking, bewerking, verplaatsing en verpakking
      van een materiaal, alsmede een combinatie van dergelijke samenstellingen welke bestemd zijn om in samenhang te
      functioneren;
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel1
  - number: 1.1.a.2°
    text: |-
      een verwisselbaar uitrustingsstuk waardoor de functie van de machine, bedoeld onder 1°, wordt gewijzigd, en dat op
      de markt is gebracht om door de bediener zelf aan een machine of een aantal verschillende machines, dan wel aan een
      trekker te worden gekoppeld, voor zover dit uitrustingsstuk geen vervangingsonderdeel of verwisselbaar gereedschap,
      dat al of niet tot de uitrusting van de machine behoort, is;
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel1
  - number: 1.1.a.3°
    text: elke combinatie van de onder 1° en 2° genoemde machines.
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel1
  - number: 1.1.b
    text: |-
      veiligheidscomponent: een component, voor zover die geen verwisselbaar uitrustingsstuk is, die binnen de Europese
      Economische Ruimte afzonderlijk op de markt wordt gebracht om bij gebruik een veiligheidsfunctie te vervullen en
      die bij een gebrekkige of slechte werking een gevaar vormt voor de veiligheid of de gezondheid van de blootgestelde
      personen;
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel1
  - number: 1.1.c
    text: |-
      aangewezen aangemelde instelling: een krachtens [artikel 7a van de wet][ref1] in het kader van de richtlijn
      aangewezen en bij de Commissie van de Europese Gemeenschappen aangemelde instelling, dan wel een door een andere
      staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte in het kader van de richtlijn
      aangewezen en bij bij de Commissie van de Europese Gemeenschappen aangemelde instelling;


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel7a
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: 7a
  - number: 1.1.d
    text: |-
      aangewezen instelling: een krachtens [artikel 7a van de wet][ref1] aangewezen instelling;


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel7a
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: 7a
  - number: 1.1.e
    text: |-
      Europese Economische Ruimte: het grondgebied waarop de Overeenkomst betreffende de Europese Economische Ruimte van
      toepassing is;
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel1
  - number: 1.1.f
    text: |-
      richtlijn: [richtlijn nr. 98/37/EG](31998L0037) van het Europees Parlement en de Raad van de Europese Unie van 22
      juni 1998 inzake de onderlinge aanpassing van de wetgevingen van de lidstaten betreffende machines (PbEG L 207);
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel1
  - number: 1.1.g
    text: |-
      hijskraan: een hijswerktuig, dat is ingericht en bestemd voor het verplaatsen van vrijhangende lasten door middel
      van een mechanische aandrijving;
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel1
  - number: 1.1.h
    text: |-
      wet: [Warenwet][ref1].

      [ref1]: https://wetten.overheid.nl/BWBR0001969
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001969
  - number: '1.2'
    text: 'Dit besluit is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel1
  - number: 1.2.1°
    text: machines en veiligheidscomponenten, waarvan de risico's hoofdzakelijk van elektrische oorsprong zijn;
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel1
  - number: 1.2.2°
    text: |-
      andere, door Onze Minister aan te wijzen machines en veiligheidscomponenten, welke de richtlijn uitzondert van
      haar werkingssfeer.
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel1
  - number: '2.1'
    text: |-
      Het is verboden machines of veiligheidscomponenten die niet voldoen aan de vervaardigingsvoorschriften gesteld bij
      of krachtens dit besluit te verhandelen of te gebruiken.
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel2
  - number: '2.2'
    text: |-
      Het is verboden machines of veiligheidscomponenten te verhandelen of te gebruiken anders dan met inachtneming
      van de voorschriften bij of krachtens dit besluit gesteld met betrekking tot de aanduiding en het bezigen van
      vermeldingen.
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel2
  - number: '2.3'
    text: |-
      Het is verboden machines of veiligheidscomponenten te verhandelen of te gebruiken, indien de bij of krachtens
      dit besluit voorgeschreven ten aanzien van die machine of veiligheidscomponent van toepassing zijnde
      overeenstemmingsbeoordelings- of keuringsprocedures niet in acht zijn genomen.
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel2
  - number: '2.4'
    text: |-
      Het is verboden machines of veiligheidscomponenten te gebruiken anders dan met inachtneming van de voorschriften
      bij of krachtens dit besluit gesteld met betrekking tot het voorhanden zijn van documenten.
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel2
  - number: '3'
    text: |-
      Machines en veiligheidscomponenten zijn zodanig ontworpen, samengesteld en vervaardigd, hebben zodanige
      eigenschappen en zijn van zodanige vermeldingen voorzien, dat zij bij gebruik overeenkomstig hun bestemming geen
      gevaar opleveren voor de veiligheid of gezondheid van de mens of voor de veiligheid van zaken, wanneer zij op
      passende wijze zijn geïnstalleerd en onderhouden. Zij voldoen aan de in bijlage I van de richtlijn opgenomen
      fundamentele eisen.
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel3
  - number: '4.1'
    text: |-
      Machines die voldoen aan de door Onze Minister aangewezen normen, en die met inachtneming van de procedures,
      genoemd in [artikel 5][ref1], voorzien zijn van de in bijlage III van de richtlijn bedoelde aanduiding houdende
      de CE-markering en vergezeld gaan van de in bijlage II, punt A, van de richtlijn bedoelde EG-verklaring van
      overeenstemming, bestaande uit de in die bijlage aangegeven onderdelen voor zover deze van toepassing zijn, worden
      vermoed te voldoen aan het in [artikel 3, tweede volzin][ref2], bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0005577#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005577#Artikel3
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel4
