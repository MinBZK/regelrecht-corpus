        hoofdstuk: '4'
  - number: '7.1'
    text: |-
      Een wijziging van een van de bijlagen van de richtlijn waarnaar in dit besluit wordt verwezen, treedt voor de
      toepassing van de bij of krachtens dit besluit gestelde regels in werking met ingang van de dag waarop aan de
      betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel7
  - number: '7.2'
    text: |-
      De vaststelling of wijziging van een specifieke communautaire richtlijn als bedoeld in artikel 1, vierde lid,
      van de richtlijn wordt door Onze Minister bekendgemaakt in de Nederlandse Staatscourant. Hij vermeldt daarbij
      met ingang van welke datum deze richtlijn of de wijziging daarvan moet worden toegepast met betrekking tot welke
      machines of veiligheidscomponenten.
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel7
  - number: '8'
    text: 'Dit besluit kan worden aangehaald als: Warenwetbesluit machines.'
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel8
  - number: '9'
    text: |-
      Dit besluit treedt in werking met ingang van 1 januari 1993, met dien verstande dat machines, met uitzondering
      van machines waarop het [Besluit machines][ref1] van toepassing was, die voor de datum van inwerkingtreding voor
      het eerst zijn verhandeld en die voldoen aan de van toepassing zijnde regelgeving zoals die luidde direct voor de
      inwerkingtreding van dit besluit, nog tot 31 december 1994 mogen worden verhandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005884
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel9
