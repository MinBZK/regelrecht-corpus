  - number: 6k.6
    text: |-
      Met betrekking tot de machines en veiligheidscomponenten, bedoeld in de voorgaande leden, waarop dit besluit niet
      wordt toegepast en waarop krachtens een of meer andere wettelijke regelingen de CE-markering wordt aangebracht,
      worden op de bij die machines en veiligheidscomponenten gevoegde documenten, handleidingen of gebruiksaanwijzingen
      de in het *Publicatieblad van de Europese Gemeenschappen* bekendgemaakte referenties van de aan die wettelijke
      regelingen ten grondslag liggende richtlijnen vermeld.
    url: https://wetten.overheid.nl/BWBR0005577/2003-09-01#Artikel6k
  - number: 6l
    text: |-
      Instellingen die op het tijdstip waarop artikel II, eerste, derde en vierde lid, van de
      __REF000___________________________________________________________________________________________________________
      __________________________________________________________________________________________________________ (Stb.
      557) in werking treedt, door Onze Minister krachtens [artikel 20 van de Arbeidsomstandighedenwet 1998][ref2]
      zijn aangewezen om de keuringen, bedoeld in [artikel 6d][ref3], uit te voeren, worden aangemerkt als aangewezen
      instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0012951
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0005577#Artikel6d
