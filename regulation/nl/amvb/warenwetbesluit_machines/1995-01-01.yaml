  - number: '6'
    text: |-
      1 De in [artikel 5, eerste lid][ref1], bedoelde aanduiding moet duidelijk leesbaar en onuitwisbaar op de machine
      zijn aangebracht.

      2 Ten aanzien van machines mogen geen vermeldingen, vaststellingen of aanduidingen worden gebezigd, welke met de in
      [artikel 5, eerste lid][ref2], bedoelde aanduiding kunnen worden verward.


      [ref1]: https://wetten.overheid.nl/BWBR0005577#Artikel5
