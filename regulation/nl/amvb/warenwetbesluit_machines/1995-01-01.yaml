  - number: '5'
    text: |-
      1 a. Machines zijn voorzien van de in bijlage III van de richtlijn bedoelde aanduiding, houdende de CE-markering,
      en gaan vergezeld van de in bijlage II, punt A, van de richtlijn bedoelde EG-verklaring van overeenstemming;

      b. veiligheidscomponenten gaan vergezeld van de in bijlage II, punt C, van de richtlijn bedoelde EG-verklaring
      van overeenstemming,

      2 a. De in het eerste lid, onder *a*, bedoelde aanduiding mag uitsluitend worden gebezigd:

      1e. voor machines welke niet genoemd worden in bijlage IV, punt A, van de richtlijn, indien de in de Gemeenschap
      gevestigde fabrikant, diens in de Gemeenschap gevestigde gemachtigde of, indien zij geen van beide binnen de
      Gemeenschap zijn gevestigd, de importeur die de machines binnen de Gemeenschap brengt, de in bijlage V van de
      richtlijn onder punt 3, onderdelen *a* en *b*, bedoelde documenten heeft samengesteld met inachtneming van het
      onder punt 4 van laatstgenoemde bijlage bepaalde;

      2e. voor machines welke genoemd worden in bijlage IV, punt A, en waarvan de vervaardiging plaatsvindt met
      inachtneming van de in [artikel 4][ref1] bedoelde normen, indien een van de onder 1e genoemde personen;

      a. het in bijlage Vl, onder punt 2, tweede gedachtenstreepje, van de richtlijn genoemde technische
      constructiedossier heeft samengesteld en ter bewaring heeft doen toekomen aan een door Onze Minister in
      overeenstemming met de Minister van Sociale Zaken en Werkgelegenheid daartoe aangewezen instantie en daarvan
      bericht van ontvangst van deze instantie heeft verkregen, hetzij;

      b. het in bijlage VI, onder punt 2, tweede gedachtenstreepje, van de richtlijn genoemde technische
      constructiedossier heeft samengesteld en doen toekomen aan een door Onze Minister in overeenstemming met Onze
      Minister van Sociale Zaken en Werkgelegenheid daartoe aangewezen instantie en deze instantie een schriftelijke
      verklaring heeft afgegeven, inhoudende dat volgens voornoemd dossier de in [artikel 4][ref2] bedoelde normen juist
      zijn toegepast en voor het overige het dossier in overeenstemming is met het dienaangaande in bijlage VI, onder
      punt 2, tweede gedachtenstreepje, van de richtlijn bepaalde, hetzij;

      c. een EG-type-onderzoekverklaring zoals bedoeld in bijlage VI van de richtlijn heeft verkregen van een door Onze
      Minister in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid daartoe aangewezen instantie;

      3e. voor machines welke zijn genoemd in bijlage IV, punt *a*, van de richtlijn en waarvan de vervaardiging niet
      of slechts ten dele plaatsvindt met inachtneming van de in [artikel 4][ref3] bedoelde normen dan wel bij de
      vervaardiging waarvan dergelijke normen weliswaar in acht worden genomen maar op het moment van vervaardiging
      van de machines deze normen niet alle van toepassing zijnde fundamentele eisen, opgenomen in bijlage I van de
      richtlijn, betreffen, indien een van de onder *a* genoemde personen een EG-type-onderzoekverklaring zoals bedoeld
      in bijlage VI van de richtlijn heeft verkregen van een door Onze Minister in overeenstemming met Onze Minister van
      Sociale Zaken en Werkgelegenheid aangewezen instantie.

      b. De in het eerste lid, onder *b*, bedoelde EG-verklaring van overeenstemming mag uitsluitend worden gebezigd:

      1e. voor veiligheidscomponenten welke niet genoemd worden in bijlage IV, punt B, van de richtlijn, indien de in
      de Gemeenschap gevestigde fabrikant, diens in de Gemeenschap gevestigde gemachtigde of, indien zij geen van beide
      binnen de Gemeenschap zijn gevestigd, de importeur die de machines binnen de Gemeenschap brengt, de in bijlage V
      van de richtlijn onder punt 3, onderdelen *a* en *b*, bedoelde documenten heeft samengesteld met inachtneming van
      het onder punt 4 van laatstgenoemde bijlage bepaalde;

      2e. voor veiligheidscomponenten welke genoemd worden in bijlage IV, punt B, van de richtlijn en waarvan de
      vervaardiging plaatsvindt met inachtneming van de in [artikel 4][ref4] bedoelde normen, indien een van de onder 1e
      genoemde personen:

      a. het in bijlage VI, onder punt 2, tweede gedachtenstreepje, van de richtlijn genoemde technische
      constructiedossier heeft samengesteld en ter bewaring heeft doen toekomen aan een door Onze Minister in
      overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid daartoe aangewezen instantie en daarvan
      bericht van ontvangst van deze instantie heeft verkregen, hetzij;

      b. het in bijlage VI, onder punt 2, tweede gedachtenstreepje, van de richtlijn genoemde technische
      constructiedossier heeft samengesteld en doen toekomen aan een door Onze Minister in overeenstemming met Onze
      Minister van Sociale Zaken en Werkgelegenheid daartoe aangewezen instantie en deze instantie een schriftelijke
      verklaring heeft afgegeven, inhoudende dat volgens voornoemd dossier de in [artikel 4][ref5] bedoelde normen juist
      zijn toegepast en voor het overige het dossier in overeenstemming is met het dienaangaande in bijlage VI, onder
      punt 2, tweede gedachtenstreepje, van de richtlijn bepaalde, hetzij;

      c. een EG-type-onderzoekverklaring zoals bedoeld in bijlage VI van de richtlijn heeft verkregen van een door Onze
      Minister in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid daartoe aangewezen instantie,
      waarbij deze instantie is nagegaan of de veiligheidscomponent de veiligheidsfuncties kan vervullen die door de
      fabrikant zijn opgegeven;

      3e. voor veiligheidscomponenten welke zijn genoemd in bijlage IV, punt B, van de richtlijn en waarvan de
      vervaardiging niet of slechts ten dele plaatsvindt met inachtneming van de in [artikel 4][ref6] bedoelde normen
      dan wel bij de vervaardiging waarvan dergelijke normen weliswaar in acht worden genomen maar op het moment van
      vervaardiging van de veiligheidscomponenten deze normen niet alle van toepassing zijnde fundamentele eisen,
      opgenomen in bijlage I van de richtlijn, betreffen, indien een van de onder *a* genoemde personen een EG-type-
      onderzoekverklaring zoals bedoeld in bijlage VI van de richtlijn heeft verkregen van een door Onze Minister in
      overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid aangewezen instantie.

      3 Voor een aanwijzing als bedoeld in het tweede lid, onder *b*, de punten 1 tot en met 3, en *c*, komen slechts in
      aanmerking instanties die voldoen aan de in bijlage VII van de richtlijn neergelegde voorwaarden. Onze Minister kan
      in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid nadere voorwaarden stellen.

      4 Als aangegeven instanties, bedoeld in het tweede lid, onder *b*, de punten 1 tot en met 3, en *c*, worden
      aangemerkt instanties die in het kader van de richtlijn door andere Lid-Staten van de Gemeenschap dan wel door de
      overige staten die partij zijn bij de overeenkomst betreffende de Europese Economische Ruimte, bij de Commissie
      van de Europese Gemeenschappen zijn aangemeld en waarvan de namen door de Commissie zijn gepubliceerd in het
      *Publicatieblad van de Europese Gemeenschappen*.

      5 a. In de in het eerste lid, onder *a*, genoemde EG-verklaring van overeenstemming wordt voor wat betreft het
      onderwerp overeenstemming:

      a. indien de verklaring betrekking heeft op machines waarvoor:

      1. de in het tweede lid, onder *a*, ten eerste, bedoelde procedure is gevolgd, dan wel

      2. de in het tweede lid, onder *a*, ten tweede, onderdelen *a* en *b*, bedoelde procedures zijn gevolgd,
      uitsluitend vermeld dat overeenstemming bestaat met de fundamentele eisen, opgenomen in bijlage I van de richtlijn.

      b. indien de verklaring betrekking heeft op machines waarvoor:

      1. de in het tweede lid, onder *a*, ten tweede, onderdeel *c*, bedoelde procedure is gevolgd, dan wel,

      2. de in het tweede lid, onder *a*, ten derde, bedoelde procedure is gevolgd, de overeenstemming vermeld met het
      type waarvoor een EG-type-onderzoekverklaring is verkregen.

      b. In de in het eerste lid, onder *b*, genoemde EG-verklaring van overeenstemming wordt voor wat betreft het
      onderwerp overeenstemming:

      a. indien de verklaring betrekking heeft op veiligheidscomponenten waarvoor:

      1. de in het tweede lid, onder *b*, ten eerste, bedoelde procedure is gevolgd, dan wel

      2. de in het tweede lid, onder *b*, ten tweede, onderdelen *a* en *b*, bedoelde procedures zijn gevolgd,
      uitsluitend dat overeenstemming bestaat met de fundamentele eisen, opgenomen in bijlage I van de richtlijn.

      b. indien de verklaring betrekking heeft op veiligheidscomponenten waarvoor:

      1. de in het tweede lid, onder *b*, ten tweede, onderdeel *c*, bedoelde procedure is gevolgd, dan wel,

      2. de in het tweede lid, onder *b*, ten derde, bedoelde procedure is gevolgd, de overeenstemming vermeld met het
      type waarvoor een EG-type-onderzoekverklaring is verkregen.

      6 a. Voor wat betreft machines waarvoor:

      1. de in het tweede lid, onder *a*, ten tweede, onderdeel *a*, bedoelde procedure is gevolgd, zijn punt 5, eerste
      volzin, en punt 7 van bijlage VI van de richtlijn van overeenkomstige toepassing;

      2. de in het tweede lid, onder *a*, ten tweede, onderdeel *b*, bedoelde procedure is gevolgd, zijn de punten 5, 6
      en 7 van bijlage VI van de richtlijn van overeenkomstige toepassing.

      b. Voor wat betreft veiligheidscomponenten waarvoor:

      1. de in het eerste lid, onder *b*, ten tweede, onderdeel *a*, bedoelde procedure is gevolgd, zijn punt 5, eerste
      volzin, en punt 7 van bijlage VI van de richtlijn van overeenkomstige toepassing;

      2. de in het tweede lid, onder *b*, ten tweede, onderdeel *b*, bedoelde procedure is gevolgd, zijn de punten 5, 6
      en 7 van bijlage VI van de richtlijn van overeenkomstige toepassing.


