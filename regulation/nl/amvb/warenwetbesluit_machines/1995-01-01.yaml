preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 13 december 1991, VVP/P-
    U 692408, gedaan in overeenstemming met Onze Minister van Economische Zaken en Onze Minister van Sociale Zaken
    en Werkgelegenheid;

    Overwegende, dat het, gelet op richtlijn 89/392/EEG van de Raad van de Europese Gemeenschappen van 14 juni 1989,
    inzake de onderlinge aanpassing van de wetgevingen van de lid-staten betreffende machines (PbEG L 183) en richtlijn
    91/368/EEG van de Raad van de Europese Gemeenschappen van 20 juni 1991 tot wijziging van richtlijn 89/392/EEG (PbEG
    L 198), noodzakelijk is regels te stellen ten aanzien van de veiligheid van machines;

    Gelet op de artikelen 4, eerste lid, onderdeel a, 8, onderdelen a, b en c, 11, 12, 13 en 14 van de Warenwet (Stb.
    1988, 360);

    Gezien het advies van de Adviescommissie Warenwet van 18 september 1991, nr 14403/(41)5;

    De Raad van State gehoord (advies van 14 april 1992, nr. W13.92.0006);

    Gezien het nader rapport van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 12 juni 1992, VVP/P
    921207, uitgebracht in overeenstemming met Onze Minister van Economische Zaken en Onze Minister van Sociale Zaken
    en Werkgelegenheid;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005577/1995-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit wordt verstaan onder:

      a. machine:

      1°. een samenstel van onderling verbonden onderdelen of organen waarvan er ten minste één kan bewegen, alsmede in
      voorkomend geval van aandrijfmechanismen, bedienings- en vermogensschakelingen en dergelijke, die in hun samenhang
      bestemd zijn voor onder meer de verwerking, bewerking, verplaatsing en verpakking van een materiaal, alsmede een
      combinatie van dergelijke samenstellingen welke bestemd zijn om in samenhang te functioneren;

      2°. een verwisselbaar uitrustingsstuk waardoor de functie van de machine, bedoeld onder 1°, wordt gewijzigd, en dat
      op de markt is gebracht om door de bediener zelf aan een machine of een aantal verschillende machines, dan wel aan
      een trekker te worden gekoppeld, voor zover dit uitrustingsstuk geen vervangingsonderdeel of werktuig is;

      3°. elke combinatie van de onder 1° en 2° genoemde machines.

      b. veiligheidscomponent: een component, voor zover die geen verwisselbaar uitrustingsstuk is, die door de fabrikant
      of zijn in de Gemeenschap gevestigde gemachtigde afzonderlijk op de markt wordt gebracht om bij gebruik een
      veiligheidsfunctie te vervullen en die bij een gebrekkige of slechte werking een gevaar vormt voor de veiligheid of
      de gezondheid van de blootgestelde personen;

      c. richtlijn: [richtlijn nr. 89/382/EEG](31989L0382) van de Raad van de Europese Gemeenschappen van 14 juni 1989
      inzake de onderlinge aanpassing van de wetgevingen van de lid-staten betreffende machines (*PbEG* L 183);

      d. de Gemeenschap: het grondgebied waarop het Verdrag tot oprichting van de Europese Gemeenschappen van toepassing
      is.

      2 Dit besluit is niet van toepassing op:

      1°. machines en veiligheidscomponenten, bestemd voor uitsluitend beroepsmatige toepassing;

      2°. machines en veiligheidscomponenten, waarvan de risico's hoofdzakelijk van elektrische oorsprong zijn;

      3°. andere, door Onze Minister in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid aan te
      wijzen machines, welke de richtlijn uitzondert van haar werkingssfeer.
    url: https://wetten.overheid.nl/BWBR0005577/1995-01-01#Artikel1
  - number: '2'
    text: |-
      1 Het is verboden machines of veiligheidscomponenten te verhandelen, die niet voldoen aan de eisen, gesteld bij of
      krachtens dit besluit.

      2 Het is verboden machines of veiligheidscomponenten te verhandelen anders dan met inachtneming van de
      voorschriften bij of krachtens dit besluit gesteld met betrekking tot de aanduiding en het bezigen van
      vermeldingen.
    url: https://wetten.overheid.nl/BWBR0005577/1995-01-01#Artikel2
  - number: '3'
    text: |-
      Machines en veiligheidscomponenten dienen zodanig te zijn samengesteld en zodanige eigenschappen te hebben alsmede
      van zodanige vermeldingen te zijn voorzien, dat zij bij gebruik overeenkomstig hun bestemming geen gevaar opleveren
      voor de veiligheid van personen, huisdieren en goederen. Zij dienen daartoe te voldoen aan de in bijlage 1 van de
      richtlijn opgenomen eisen.
    url: https://wetten.overheid.nl/BWBR0005577/1995-01-01#Artikel3
  - number: '4'
    text: |-
      1 Machines die voldoen aan de door Onze Minister in overeenstemming met Onze Minister van Sociale Zaken en
      Werkgelegenheid aangewezen normen, en die met inachtneming van de procedures, genoemd in [artikel 5][ref1],
      voorzien zijn van de in bijlage III van de richtlijn bedoelde aanduiding houdende de CE-markering en vergezeld
      gaan van de in bijlage II, punt A, van de richtlijn bedoelde EG-verklaring van overeenstemming, worden vermoed te
      voldoen aan het in [artikel 3, tweede volzin][ref2], bepaalde.

      2 Veiligheidscomponenten die voldoen aan de door Onze Minister in overeenstemming met Onze Minister van
      Sociale Zaken en Werkgelegenheid aangewezen normen, en die met inachtneming van de procedures, genoemd in
      [artikel 5][ref3], vergezeld gaan van de in bijlage II, punt C, van de richtlijn bedoelde EG-verklaring van
      overeenstemming, worden vermoed te voldoen aan het in [artikel 3, tweede volzin][ref4], bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0005577#Artikel5
