  - number: '7'
    text: |-
      Indien één van de bijlagen van de richtlijn, waarnaar in dit besluit wordt verwezen, wordt gewijzigd, dan wel
      indien een specifieke communautaire richtlijn als bedoeld in artikel I, vierde lid, van de richtlijn wordt
      vastgesteld of gewijzigd, maakt Onze Minister dit bekend in de *Nederlandse Staatscourant*; hij vermeldt
      daarbij met ingang van welke datum de wijziging moet worden toegepast met betrekking tot welke machines of
      veiligheidscomponenten.
    url: https://wetten.overheid.nl/BWBR0005577/1995-01-01#Artikel7
  - number: '8'
    text: 'Dit besluit kan worden aangehaald als: Warenwetbesluit machines.'
    url: https://wetten.overheid.nl/BWBR0005577/1995-01-01#Artikel8
  - number: '9'
    text: |-
      Dit besluit treedt in werking met ingang van 1 januari 1993, met dien verstande dat machines die voor de datum van
      inwerkingtreding voor het eerst zijn verhandeld en die voldoen aan de van toepassing zijnde regelgeving zoals die
      luidde direct voor de inwerkingtreding van dit besluit, nog tot 31 december 1994 mogen worden verhandeld.
    url: https://wetten.overheid.nl/BWBR0005577/1995-01-01#Artikel9
