        bwb_id: BWBR0001969
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0001969
        artikel: '30'
  - number: '3.1'
    text: |-
      De fabrikant of diens gemachtigde draagt er zorg voor dat machines zodanig zijn ontworpen, samengesteld en
      vervaardigd, zodanige eigenschappen hebben en van zodanige vermeldingen zijn voorzien, dat zij geen gevaar
      opleveren voor de veiligheid of gezondheid van de mens en, in voorkomend geval, huisdieren of de veiligheid van
      zaken, wanneer zij op passende wijze zijn geïnstalleerd en onderhouden en overeenkomstig hun bestemming of in
      redelijkerwijs voorzienbare omstandigheden worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel3
  - number: '3.2'
    text: |-
      Indien op grond van de richtlijn van toepassing, draagt de fabrikant of diens gemachtigde er tevens zorg voor
      dat machines zodanig zijn ontworpen, samengesteld en vervaardigd, zodanige eigenschappen hebben en van zodanige
      vermeldingen zijn voorzien, dat zij geen gevaar opleveren voor het milieu, indien zij op passende wijze zijn
      geïnstalleerd en onderhouden en overeenkomstig hun bestemming of in redelijkerwijs voorzienbare omstandigheden
      worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel3
  - number: 3a.1
    text: 'De fabrikant of diens gemachtigde:'
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel3a
  - number: 3a.1.a
    text: zorgt dat de machine voldoet aan de essentiële veiligheids- en gezondheidseisen;
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel3a
  - number: 3a.1.b
    text: zorgt dat het technisch dossier beschikbaar is en voldoet aan bijlage VII, onder A, bij de richtlijn;
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel3a
  - number: 3a.1.c
    text: verstrekt de noodzakelijke informatie, waaronder in ieder geval de gebruiksaanwijzing;
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel3a
  - number: 3a.1.d
    text: |-
      stelt de EG-verklaring van overeenstemming op die voldoet aan bijlage II, deel 1, onder A, bij de richtlijn en
      zorgt dat deze de machine vergezelt;
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel3a
  - number: 3a.1.e
    text: |-
      brengt de CE-markering, bedoeld in [artikel 6][ref1], op de machine aan, alvorens een machine in de handel te
      brengen of in bedrijf te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005577#Artikel6
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0005577
        artikel: '6'
        hoofdstuk: '3'
  - number: 3a.2
    text: |-
      De fabrikant of diens gemachtigde beschikt over of heeft toegang tot de middelen die nodig zijn om zich ervan te
      vergewissen dat de machine voldoet aan de essentiële veiligheids- en gezondheidseisen.
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel3a
  - number: 3a.3
    text: |-
      Indien op machines naast dit besluit ook andere besluiten, die voorzien in het aanbrengen van de CE-markering, van
      toepassing zijn, wordt door deze markering aangegeven dat de machines ook aan die andere besluiten voldoen.
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel3a
  - number: 3a.4
    text: |-
      Indien de fabrikant of diens gemachtigde op grond van de in het derde lid bedoelde andere besluiten gedurende
      een overgangsperiode de toe te passen regeling kan kiezen, wordt door de CE-markering uitsluitend aangegeven
      dat de machine in overeenstemming is met de bepalingen van de door de fabrikant of diens gemachtigde toegepaste
      regelingen.
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel3a
  - number: 3a.5
    text: |-
      De verwijzingen naar de toegepaste regelingen, zoals in het Publicatieblad van de Europese Unie bekendgemaakt,
      worden in de EG-verklaring van overeenstemming vermeld.
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel3a
  - number: 3b.1
    text: |-
      De fabrikant of diens gemachtigde vergewist zich, alvorens een niet voltooide machine in de handel te brengen,
      ervan dat:
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel3b
  - number: 3b.1.a
    text: de technische documenten, zoals beschreven in bijlage VII, onder B, bij de richtlijn, worden opgesteld;
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel3b
  - number: 3b.1.b
    text: de montagehandleiding, zoals beschreven in bijlage VI bij de richtlijn, wordt opgesteld;
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel3b
  - number: 3b.1.c
    text: de inbouwverklaring, zoals beschreven in bijlage II, deel 1, onder B, bij de richtlijn, wordt opgesteld.
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel3b
  - number: 3b.2
    text: |-
      De fabrikant of diens gemachtigde voegt de montagehandleiding en de inbouwverklaring bij de niet voltooide
      machine totdat de inbouw is geschied, en zorgt dat deze vervolgens deel uitmaken van het technische dossier van de
      voltooide machine.
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel3b
  - number: 3c
    text: |-
      De CE-markering wordt niet aangebracht op machines, waarop dit besluit niet van toepassing is, tenzij de CE-
      markering op grond van een ander besluit mag worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel3c
  - number: '4'
    text: |-
      Machines die voldoen aan de door Onze Minister die het aangaat aangewezen normen, en die met inachtneming van de
      procedures, genoemd in [artikel 5][ref1], voorzien zijn van de in bijlage III van de richtlijn bedoelde aanduiding
      houdende de CE-markering en vergezeld gaan van de in bijlage II, punt A, van de richtlijn bedoelde EG-verklaring
      van overeenstemming, bestaande uit de in die bijlage aangegeven onderdelen voor zover deze van toepassing zijn,
      worden vermoed te voldoen aan de essentiële veiligheids- en gezondheidseisen.


      [ref1]: https://wetten.overheid.nl/BWBR0005577#Artikel5
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005577
        artikel: '5'
        hoofdstuk: '3'
  - number: '5.1'
    text: 'De CE-markering wordt uitsluitend op de machine aangebracht, indien de fabrikant of diens gemachtigde:'
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel5
  - number: 5.1.a
    text: |-
      voor machines die niet worden genoemd in bijlage IV bij de richtlijn, de procedure, bedoeld in bijlage VIII bij de
      richtlijn, toepast;
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel5
  - number: 5.1.b
    text: |-
      voor machines die worden genoemd in bijlage IV bij de richtlijn en die zijn vervaardigd met inachtneming van de
      normen, bedoeld in [artikel 4][ref1], indien deze normen alle van toepassing zijnde essentiële veiligheids- en
      gezondheidseisen betreffen:


      [ref1]: https://wetten.overheid.nl/BWBR0005577#Artikel4
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005577
        artikel: '4'
        hoofdstuk: '2'
  - number: 5.1.b.1°
    text: de procedure, bedoeld in bijlage VIII bij de richtlijn, toepast;
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel5
  - number: 5.1.b.2°
    text: |-
      de procedure, bedoeld in bijlage IX bij de richtlijn, toepast en de maatregelen, bedoeld in bijlage VIII, punt 3,
      bij de richtlijn, neemt; of
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel5
  - number: 5.1.b.3°
    text: de procedure, bedoeld in bijlage X bij de richtlijn, toepast;
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel5
  - number: 5.1.c
    text: |-
      voor machines die worden genoemd in bijlage IV bij de richtlijn en die niet of slechts ten dele zijn vervaardigd
      met inachtneming van de normen, bedoeld in [artikel 4][ref1], of die zijn vervaardigd met inachtneming van
      dergelijke normen terwijl op het moment van vervaardiging van de machines deze normen niet alle van toepassing
      zijnde essentiële veiligheids- en gezondheidseisen betreffen:


      [ref1]: https://wetten.overheid.nl/BWBR0005577#Artikel4
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005577
        artikel: '4'
        hoofdstuk: '2'
  - number: 5.1.c.1°
    text: |-
      de procedure, bedoeld in bijlage IX bij de richtlijn, toepast en de maatregelen, bedoeld in bijlage VIII, punt 3,
      bij de richtlijn, neemt; of
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel5
  - number: 5.1.c.2°
    text: de procedure, bedoeld in bijlage X bij de richtlijn, toepast.
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel5
  - number: '5.2'
    text: |-
      De kosten verbonden aan het afgeven van een verklaring van EG- typeonderzoek of van een goedkeuring van het
      kwaliteitborgingssysteem zijn voor rekening van de fabrikant.
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel5
  - number: '5.6'
    text: |-
      De kosten verbonden aan het afgeven van een verklaring van EG-typeonderzoek of van een goedkeuring van het
      kwaliteitborgingssysteem zijn voor rekening van de fabrikant.
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel5
  - number: 5a.1
    text: |-
      De fabrikant of diens gemachtigde die voornemens is aan het model van de machine of aan te vervaardigen en in de
      handel te brengen machines, waarvoor door een aangewezen aangemelde instelling een verklaring van EG-typeonderzoek
      is afgegeven, wijzigingen aan te brengen, stelt deze instelling hiervan onverwijld in kennis.
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel5a
  - number: 5a.2
    text: |-
      De aangewezen aangemelde instelling beoordeelt de wijzigingen en bevestigt de geldigheid van de bestaande
      verklaring van EG-typeonderzoek of stelt een nieuwe verklaring op als de overeenstemming met de essentiële
      veiligheids- en gezondheidseisen of met de gebruiksvoorwaarden van het type door de wijzigingen in het geding kan
      komen. [Artikel 5, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005577#Artikel5
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0005577
        artikel: '5'
        hoofdstuk: '3'
  - number: '6.1'
    text: |-
      De in [artikel 5][ref1] bedoelde aanduiding wordt duidelijk leesbaar en onuitwisbaar op de machine aangebracht,
      overeenkomstig de bijlagen I, punt 1.7.3, en III van de richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005577#Artikel5
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005577
        artikel: '5'
        hoofdstuk: '3'
  - number: '6.2'
    text: |-
      Ten aanzien van machines mogen geen vermeldingen, vaststellingen of aanduidingen worden gebezigd, welke met de
      in [artikel 5][ref1] bedoelde aanduiding kunnen worden verward. Op de machines mogen andere markeringen worden
      aangebracht op voorwaarde dat de zichtbaarheid en de leesbaarheid van de CE-markering niet worden verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0005577#Artikel5
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005577
        artikel: '5'
        hoofdstuk: '3'
  - number: 6a.1
    text: |-
      Indien een aangewezen aangemelde instelling vaststelt dat de fabrikant niet of niet langer aan de
      toepasselijke eisen van dit besluit voldoet of dat geen verklaring van EG-typeonderzoek of goedkeuring van het
      kwaliteitsborgingssysteem verleend had mogen worden, schort zij de verleende verklaring of goedkeuring op, dan
      wel trekt zij deze in of verbindt zij daar beperkingen aan, tenzij de naleving van de eisen is gewaarborgd door de
      toepassing van passende corrigerende maatregelen van de fabrikant.
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6a
  - number: 6a.2
    text: |-
      Indien de verklaring of goedkeuring wordt opgeschort, beperkt of ingetrokken of indien het nodig kan zijn dat Onze
      Minister die het aangaat maatregelen neemt, stelt de aangewezen aangemelde instelling Onze Minister die het aangaat
      daarvan onverwijld in kennis.
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6a
  - number: 6c
    text: |-
      [Artikel 2, eerste tot en met vierde lid][ref1], is niet van toepassing op het tentoonstellen en demonstreren op
      (jaar)beurzen, exposities en bij demonstraties van machines of niet voltooide machines die niet in overeenstemming
      zijn met dit besluit, mits op een zichtbaar bord duidelijk is aangegeven dat zij niet in overeenstemming zijn
      met dit besluit en niet te koop zijn voordat zij door de fabrikant of zijn in de Europese Economische Ruimte
      gevestigde gevolmachtigde in overeenstemming zijn gebracht met dit besluit. Bij demonstraties zijn alle passende
      veiligheidsmaatregelen genomen om de bescherming van de mens te waarborgen.


      [ref1]: https://wetten.overheid.nl/BWBR0005577#Artikel2
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6c
    references:
      - id: ref1
        bwb_id: BWBR0005577
        artikel: '2'
        hoofdstuk: '1'
  - number: 6d.1
    text: |-
      Een hijskraan met een bedrijfslast die gelijk is aan of hoger is dan twee ton wordt ten minste eenmaal per 12
      maanden gekeurd. In aanvulling daarop wordt een mobiele kraan of torenkraan, die behoort tot een bij ministeriële
      regeling omschreven categorie, ten hoogste 24 maanden na de eerste ingebruikneming en vervolgens telkens na verloop
      van ten hoogste vierentwintig maanden gekeurd. Bij ministeriële regeling kan worden bepaald dat een aangewezen
      instelling kan verlangen dat een mobiele of torenkraan in geval van door haar geconstateerde ernstige gebreken,
      na een kortere termijn dan de termijnen, genoemd in de eerste en tweede volzin, wordt onderzocht op de staat van
      veiligheid.
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6d
  - number: 6d.2
    text: |-
      De periodieke keuring, bedoeld in het eerste lid, vindt ten hoogste een maand na het verstrijken van de genoemde
      periode plaats indien degene die de keuring uitvoert dit uit oogpunt van bedrijfsvoering noodzakelijk acht.
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6d
  - number: 6d.3
    text: |-
      De keuring bedoeld in het eerste lid, eerste zin, wordt uitgevoerd door een deskundige natuurlijke persoon,
      rechtspersoon of instelling. In afwijking daarvan wordt de keuring bedoeld in het eerste lid, tweede zin, van een
      mobiele kraan of torenkraan uitgevoerd door een aangewezen instelling.
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6d
  - number: 6d.4
    text: |-
      De certificaathouder verstrekt de deskundige, Onze Minister of, indien Onze Minister een aangewezen instelling
      heeft aangewezen, deze instelling, desgevraagd kosteloos alle informatie die nodig is voor de uitvoering van het
      bepaalde bij of krachtens dit artikel.
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6d
  - number: 6e.1
    text: |-
      De deskundige, bedoeld in [artikel 6d, derde lid, eerste zin][ref1], Onze Minister of, indien Onze Minister een
      aangewezen instelling heeft aangewezen, deze instelling, geeft op verzoek een certificaat van goedkeuring af
      wanneer hij respectievelijk zij heeft vastgesteld dat de hijskraan, bedoeld in [artikel 6d][ref2], voldoet aan de
      bij of krachtens dit besluit gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0005577#Artikel6d
      [ref2]: https://wetten.overheid.nl/BWBR0005577#Artikel6d
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6e
    references:
      - id: ref1
        bwb_id: BWBR0005577
        artikel: 6d
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0005577
        artikel: 6d
        hoofdstuk: '4'
  - number: 6e.2
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de indiening van het verzoek,
      bedoeld in het eerste lid, en de afhandeling van het verzoek.
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6e
  - number: 6e.3
    text: |-
      De kosten van het afgeven van een certificaat van goedkeuring zijn voor rekening van de verzoeker tot afgifte van
      het certificaat.
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6e
  - number: 6ea.1
    text: |-
      De afgifte van een certificaat van goedkeuring, als bedoeld in [artikel 6e][ref1], wordt geweigerd indien de
      verzoeker niet heeft voldaan aan de bij of krachtens dit besluit met betrekking tot het certificaat gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0005577#Artikel6e
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6ea
    references:
      - id: ref1
        bwb_id: BWBR0005577
        artikel: 6e
        hoofdstuk: '4'
  - number: 6ea.2
    text: |-
      Een certificaat van goedkeuring kan worden geschorst, ten nadele van de certificaathouder worden gewijzigd of
      ingetrokken:
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6ea
  - number: 6ea.2.a
    text: |-
      op grond van feiten of omstandigheden waarvan de deskundige, bedoeld in [artikel 6d, derde lid, eerste zin][ref1],
      Onze Minister of, indien Onze Minister een aangewezen instelling heeft aangewezen, deze instelling, bij het afgeven
      van het certificaat redelijkerwijs niet op de hoogte kon zijn en op grond waarvan hij respectievelijk zij het
      certificaat niet of alleen met voorschriften, bedoeld in [artikel 7a, vierde lid, van de wet][ref2], zou hebben
      gegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0005577#Artikel6d
      [ref2]: https://wetten.overheid.nl/BWBR0001969#Artikel7a
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6ea
    references:
      - id: ref1
        bwb_id: BWBR0005577
        artikel: 6d
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0001969
        artikel: 7a
  - number: 6ea.2.b
    text: |-
      op grond van door de certificaathouder verstrekte onjuiste inlichtingen over feiten en omstandigheden, mits de
      onjuistheid daarvan aan de houder bekend was of kon zijn;
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6ea
  - number: 6ea.2.c
    text: |-
      indien de certificaathouder niet meer voldoet aan de bij of krachtens dit besluit met betrekking tot het
      certificaat gestelde eisen of zijn wettelijke verplichtingen niet meer naar behoren nakomt; of
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6ea
  - number: 6ea.2.d
    text: |-
      indien de certificaathouder met zijn werkzaamheden, voor zover die door het certificaat worden gereguleerd, of door
      de wijze waarop hij die werkzaamheden verricht, ernstig gevaar veroorzaakt of kan veroorzaken voor personen.
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6ea
  - number: 6f.1
    text: |-
      In de nabijheid van een hijskraan als bedoeld in [artikel 6d, eerste lid][ref1], bevindt zich een kraanboek. In
      dit boek zijn in ieder geval de resultaten van de op grond van [artikel 6d][ref2] uitgevoerde keuringen op adequate
      wijze vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005577#Artikel6d
      [ref2]: https://wetten.overheid.nl/BWBR0005577#Artikel6d
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6f
    references:
      - id: ref1
        bwb_id: BWBR0005577
        artikel: 6d
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0005577
        artikel: 6d
        hoofdstuk: '4'
  - number: 6f.2
    text: |-
      Op het certificaat van goedkeuring wordt de datum van keuring vermeld, alsmede gegevens betreffende de
      identificatie van de hijskraan. Het certificaat van goedkeuring of een afschrift daarvan bevindt zich in de
      nabijheid van de hijskraan.
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6f
  - number: 6f.3
    text: |-
      Het kraanboek en het certificaat van goedkeuring of een afschrift daarvan worden desgevraagd getoond aan een
      ambtenaar als bedoeld in [artikel 25 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel25
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6f
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: '25'
  - number: 6fa.1
    text: |-
      Hijs- en hefwerktuigen voor beroepsmatig personenvervoer worden na elke montage op een nieuwe arbeidsplaats en
      vervolgens telkens na verloop van ten hoogste zes maanden, op de arbeidsplaats door een aangewezen instelling
      gekeurd.
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6fa
  - number: 6fa.2
    text: |-
      Hijs- en hefwerktuigen voor beroepsmatig personenvervoer worden voor de ingebruikneming na elke herstelling of
      wijziging op de arbeidsplaats door een aangewezen instelling gekeurd.
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6fa
  - number: 6fa.3
    text: |-
      Bij de keuringen wordt getoetst of voldaan is aan de voor het desbetreffende hijs- en hefwerktuig geldende
      vervaardigingsvoorschriften, bedoeld in [artikel 3][ref1]. Indien uit de keuring blijkt dat wordt voldaan aan de
      voor het desbetreffende hijs- of hefwerktuig geldende vervaardigingsvoorschriften, bedoeld in [artikel 3][ref2],
      geeft de aangewezen instelling een certificaat van goedkeuring af. Op dit certificaat wordt tevens de
      herkeuringstermijn aangegeven. Het certificaat van goedkeuring of een afschrift daarvan bevindt zich in de
      nabijheid van het desbetreffende hijs- of hefwerktuig.


      [ref1]: https://wetten.overheid.nl/BWBR0005577#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005577#Artikel3
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6fa
    references:
      - id: ref1
        bwb_id: BWBR0005577
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005577
        artikel: '3'
        hoofdstuk: '2'
  - number: 6fa.4
    text: |-
      Als blijk van goedkeuring brengt de aangewezen instelling op een duidelijke zichtbare plaats op het desbetreffende
      hijs- of hefwerktuig een kenmerk aan waarop tevens de herkeuringstermijn, welke volgt uit het eerste lid, wordt
      aangegeven.
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6fa
  - number: 6fa.5
    text: |-
      In de nabijheid van het hijs- of hefwerktuig voor beroepsmatig personenvervoer bevindt zich het hijs- en
      hefwerktuigboek. In dit boek zijn in ieder geval de resultaten van de uitgevoerde keuringen op adequate wijze
      vermeld.
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6fa
  - number: 6g.1
    text: 'Als aangewezen instelling of aangewezen aangemelde instelling kan worden aangewezen de instelling die:'
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6g
  - number: 6g.1.a
    text: rechtspersoonlijkheid heeft;
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6g
  - number: 6g.1.b
    text: onafhankelijk is;
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6g
  - number: 6g.1.c
    text: |-
      beschikt over de deskundigheid en outillage die nodig zijn om de uitvoering van de taken waarvoor zij aangewezen
      wil worden, naar behoren te kunnen vervullen;
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6g
  - number: 6g.1.d
    text: |-
      beschikt over een registratiesysteem waarin de gegevens die samenhangen met en betrekking hebben op de uitvoering
      van de taken waarvoor zij aangewezen wil worden, naar behoren vastgelegd kunnen worden. Aan de hand van deze
      gegevens zijn de gekeurde en gecertificeerde machines afdoende te identificeren;
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6g
  - number: 6g.1.e
    text: |-
      verzekerd is tegen wettelijke aansprakelijkheid voor de risico's die voortvloeien uit de uitoefening van de taken
      waarvoor zij aangewezen wil worden;
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6g
  - number: 6g.1.f
    text: |-
      een overeenkomst heeft gesloten met de in voorkomend geval aanwezige beheerstichting die de krachtens dit besluit
      geregelde certificatieschema’s beheert; en
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6g
  - number: 6g.1.g
    text: naar behoren functioneert.
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6g
  - number: 6g.2
    text: |-
      In aanvulling op het eerste lid komt voor aanwijzing als aangewezen aangemelde instelling slechts in aanmerking de
      instelling die ten minste voldoet aan de in bijlage VII bij de richtlijn neergelegde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6g
  - number: 6g.3
    text: Bij ministeriële regeling worden nadere regels gesteld met betrekking tot het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6g
  - number: 6h.1
    text: |-
      De instelling, bedoeld in [artikel 6g][ref1], dient de aanvraag tot aanwijzing in bij Onze Minister van Sociale
      Zaken en Werkgelegenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0005577#Artikel6g
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6h
    references:
      - id: ref1
        bwb_id: BWBR0005577
        artikel: 6g
        hoofdstuk: '5'
  - number: 6h.2
    text: |-
      De instelling doet de aanvraag vergezellen van een beoordeling door de Stichting Raad voor Accreditatie te Utrecht,
      waaruit blijkt dat zij voldoet aan de criteria, genoemd in [artikel 6g, eerste lid][ref1], en, in geval van artikel
      6g, tweede lid, van een bewijs dat is voldaan aan de voorwaarden, genoemd in dat lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005577#Artikel6g
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6h
    references:
      - id: ref1
        bwb_id: BWBR0005577
        artikel: 6g
        hoofdstuk: '5'
  - number: 6h.3
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de indiening van de aanvraag, de
      beoordeling, het bewijs, bedoeld in het tweede lid, en de afhandeling van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6h
  - number: 6h.4
    text: |-
      De kosten van de beoordeling en het bewijs, bedoeld in het tweede lid, zijn voor rekening van de aanvragende
      instelling.
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6h
  - number: 6i.1
    text: 'Een aanwijzing als aangewezen instelling of aangewezen aangemelde instelling wordt geweigerd indien:'
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6i
  - number: 6i.1.a
    text: |-
      de aanvragende instelling niet heeft voldaan aan het bepaalde bij of krachtens de [artikelen 6g][ref1] of
      [6h][ref2]; of


      [ref1]: https://wetten.overheid.nl/BWBR0005577#Artikel6g
      [ref2]: https://wetten.overheid.nl/BWBR0005577#Artikel6h
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6i
    references:
      - id: ref1
        bwb_id: BWBR0005577
        artikel: 6g
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0005577
        artikel: 6h
        hoofdstuk: '5'
  - number: 6i.1.b
    text: |-
      ten hoogste twaalf maanden voorafgaand aan de datum van indiening van de aanvraag, sprake was van een weigering
      om de aanvragende instelling aan te wijzen als aangewezen instelling of aangewezen aangemelde instelling dan wel
      van een intrekking van een aanwijzing en de weigering of intrekking is geschied op grond van aan de aanvragende
      instelling toe te rekenen feiten of omstandigheden.
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6i
  - number: 6i.2
    text: |-
      De aanvraag wordt in het geval, bedoeld in het eerste lid, onder b, eerst in behandeling genomen nadat twaalf
      maanden, te rekenen vanaf de dag direct na de datum van de weigering respectievelijk van de intrekking, zijn
      verstreken.
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6i
  - number: 6i.3
    text: |-
      Een aanwijzing kan worden geschorst, ten nadele van de aangewezen instelling of aangemelde aangewezen instelling
      worden gewijzigd of ingetrokken:
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6i
  - number: 6i.3.a
    text: |-
      op grond van feiten of omstandigheden waarvan Onze Minister van Sociale Zaken en Werkgelegenheid bij de aanwijzing
      redelijkerwijs niet op de hoogte kon zijn en op grond waarvan hij de aanwijzing niet of alleen met voorschriften,
      bedoeld in [artikel 7a, vierde lid, van de wet][ref1] zou hebben gegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel7a
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6i
    references:
      - id: ref1
        bwb_id: BWBR0001969
        artikel: 7a
  - number: 6i.3.b
    text: |-
      op grond van door de aangewezen instelling of aangewezen aangemelde instelling verstrekte onjuiste inlichtingen
      over feiten of omstandigheden, mits de onjuistheid daarvan aan de instelling bekend was of kon zijn;
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6i
  - number: 6i.3.c
    text: |-
      indien de aangewezen instelling of aangewezen aangemelde instelling niet meer voldoet aan het bij of krachtens
      [artikel 6g][ref1] bepaalde;


      [ref1]: https://wetten.overheid.nl/BWBR0005577#Artikel6g
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6i
    references:
      - id: ref1
        bwb_id: BWBR0005577
        artikel: 6g
        hoofdstuk: '5'
  - number: 6i.3.d
    text: |-
      indien de aangewezen instelling of aangewezen aangemelde instelling gedurende een aaneengesloten periode van twee
      jaren geen werkzaamheden waarvoor zij is aangewezen, heeft uitgevoerd; of
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6i
  - number: 6i.3.e
    text: |-
      indien de aangewezen instelling of aangewezen aangemelde instelling haar wettelijke verplichtingen niet meer naar
      behoren nakomt of de taken waarvoor zij is aangewezen, niet meer naar behoren uitvoert.
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6i
  - number: 6j.1
    text: |-
      Tijdens de looptijd van de aanwijzing stelt Onze Minister van Sociale Zaken en Werkgelegenheid periodiek vast of
      de instelling:
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6j
  - number: 6j.1.a
    text: |-
      nog voldoet aan het bepaalde bij of krachtens [artikel 6g][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0005577#Artikel6g
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6j
    references:
      - id: ref1
        bwb_id: BWBR0005577
        artikel: 6g
        hoofdstuk: '5'
  - number: 6j.1.b
    text: haar wettelijke verplichtingen naar behoren nakomt en de taken waarvoor zij is aangewezen, naar behoren uitvoert.
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6j
  - number: 6j.2
    text: |-
      Ten behoeve van de periodieke vaststelling laat Onze Minister van Sociale Zaken en Werkgelegenheid de Stichting
      Raad voor Accreditatie te Utrecht een beoordeling ter zake doen.
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6j
  - number: 6j.3
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de periodieke vaststelling en
      de beoordeling.
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6j
  - number: 6j.4
    text: De kosten van de beoordeling zijn voor rekening van de aangewezen instelling en aangewezen aangemelde instelling.
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6j
  - number: 6ja.1
    text: |-
      De aangewezen instelling en aangewezen aangemelde instelling verstrekken de Stichting Raad voor Accreditatie
      te Utrecht desgevraagd kosteloos alle informatie die deze nodig heeft bij de uitvoering van het bepaalde bij of
      krachtens [artikel 6j][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005577#Artikel6j
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6ja
    references:
      - id: ref1
        bwb_id: BWBR0005577
        artikel: 6j
        hoofdstuk: '5'
  - number: 6ja.2
    text: |-
      Bij ministeriele regeling worden nadere regels gesteld betreffende het kosteloos verstrekken van gegevens en
      inlichtingen door een aangewezen instelling of aangewezen aangemelde instelling aan Onze Minister van Sociale Zaken
      en Werkgelegenheid of de toezichthouder respectievelijk door Onze Minister van Sociale Zaken en Werkgelegenheid of
      de toezichthouder aan de in het eerste lid genoemde Stichting Raad voor Accreditatie, een aangewezen instelling of
      een aangewezen aangemelde instelling, die zijn verkregen door de uitvoering of het toezicht op de naleving van het
      bepaalde bij of krachtens de wet, welke noodzakelijk zijn voor de uitvoering van hun wettelijke taken.
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6ja
  - number: 6l
    text: |-
      Instellingen die op het tijdstip waarop artikel II, eerste, derde en vierde lid, van de
      __REF000___________________________________________________________________________________________________________
      __________________________________________________________________________________________________________
      (Stb. 557) in werking treedt, door Onze Minister krachtens [artikel 20 van de Arbeidsomstandighedenwet][ref2]
      zijn aangewezen om de keuringen, bedoeld in [artikel 6d][ref3], uit te voeren, worden aangemerkt als aangewezen
      instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0012951
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0005577#Artikel6d
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel6l
    references:
      - id: ref1
        bwb_id: BWBR0012951
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '20'
      - id: ref3
        bwb_id: BWBR0005577
        artikel: 6d
        hoofdstuk: '4'
  - number: '7'
    text: |-
      Een wijziging van een van de bijlagen van de richtlijn waarnaar in dit besluit wordt verwezen, treedt voor de
      toepassing van de bij of krachtens dit besluit gestelde regels in werking met ingang van de dag waarop aan de
      betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel7
  - number: 7a
    text: |-
      Een certificaat van goedkeuring, afgegeven op grond van de wet, en geldend op dag, voorafgaand aan de datum van
      inwerkingtreding van het besluit van 7 september 2009, Stb. 395 wordt geacht te zijn afgegeven met inachtneming van
      de bij of krachtens dit besluit gestelde bepalingen, zoals die luiden met ingang van de datum van inwerkingtreding
      van evengenoemd besluit, onverminderd het bepaalde bij of krachtens de [artikelen 6d][ref1] en [6ea][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005577#Artikel6d
      [ref2]: https://wetten.overheid.nl/BWBR0005577#Artikel6ea
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0005577
        artikel: 6d
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0005577
        artikel: 6ea
        hoofdstuk: '4'
  - number: 7b.1
    text: |-
      De aanwijzing als aangewezen instelling en aangewezen aangemelde instelling op verzoek, afgegeven op grond van de
      wet, en geldend op de dag, voorafgaand aan de datum van inwerkingtreding van het besluit van 7 september 2009, Stb.
      395 worden geacht te zijn gegeven met inachtneming van de bij of krachtens dit besluit gestelde bepalingen, zoals
      die luiden met ingang van de datum van evengenoemd besluit.
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel7b
  - number: 7b.2
    text: |-
      Onverminderd het derde en zesde lid, vervalt de aanwijzing, bedoeld in het eerste lid, van rechtswege vierentwintig
      maanden na de datum van inwerkingtreding van de voor het werkveld waarop de betrokken instelling werkzaam is,
      geldende ministeriële regeling, bedoeld in [artikel 6g, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005577#Artikel6g
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0005577
        artikel: 6g
        hoofdstuk: '5'
  - number: 7b.3
    text: |-
      De aanwijzing, bedoeld in het eerste lid, met een vervaldatum, gelegen voor de in het tweede lid bedoelde
      vervaldatum, vervalt van rechtswege op de oorspronkelijke vervaldatum, tenzij de betrokken instelling binnen
      vijf maanden na de datum van inwerkingtreding van de voor het werkveld waarop de instelling werkzaam is, geldende
      ministeriële regeling, bedoeld in [artikel 6g, derde lid][ref1], en voorafgaand aan de oorspronkelijke vervaldatum
      een verzoek tot beoordeling ten behoeve van een hernieuwde aanwijzing heeft ingediend bij de Stichting Raad
      voor Accreditatie te Utrecht. Alsdan blijft de aanwijzing van kracht tot uiterlijk de in het tweede lid bedoelde
      vervaldatum van rechtswege.


      [ref1]: https://wetten.overheid.nl/BWBR0005577#Artikel6g
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0005577
        artikel: 6g
        hoofdstuk: '5'
  - number: 7b.4
    text: |-
      De instelling waarvan de aanwijzing op grond van het bepaalde in het tweede of derde lid vervalt, kan Onze Minister
      van Sociale Zaken en Werkgelegenheid vragen om hernieuwde aanwijzing met inachtneming van de bij of krachtens dit
      besluit gestelde bepalingen, zoals die luiden met ingang van de datum van inwerkingtreding van het besluit van
      7 september 2009, Stb. 395.
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel7b
  - number: 7b.5
    text: |-
      In afwijking van [artikel 6h, vierde lid][ref1], zijn de aan de beoordeling door de in het derde lid genoemde
      Stichting Raad voor Accreditatie verbonden kosten voor rekening van Onze Minister van Sociale Zaken en
      Werkgelegenheid, indien de instelling, bedoeld in het eerste lid, een verzoek tot beoordeling ten behoeve van
      een hernieuwde aanwijzing heeft ingediend bij voornoemde Stichting Raad voor Accreditatie binnen vijf maanden na
      de datum van inwerkingtreding van de voor het werkveld waarop de instelling werkzaam is, geldende ministeriële
      regeling, bedoeld in [artikel 6g, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005577#Artikel6h
      [ref2]: https://wetten.overheid.nl/BWBR0005577#Artikel6g
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0005577
        artikel: 6h
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0005577
        artikel: 6g
        hoofdstuk: '5'
  - number: 7b.6
    text: |-
      Indien Onze Minister van Sociale Zaken en Werkgelegenheid op een aanvraag tot hernieuwde aanwijzing beslist op
      een tijdstip, gelegen voor de in het tweede lid bedoelde vervaldatum van rechtswege, vervalt de oorspronkelijke
      aanwijzing met ingang van de datum van inwerkingtreding van de hernieuwde aanwijzing.
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel7b
  - number: '8'
    text: 'Dit besluit kan worden aangehaald als: Warenwetbesluit machines.'
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel8
  - number: '9'
    text: |-
      Dit besluit treedt in werking met ingang van 1 januari 1993, met dien verstande dat machines, met uitzondering
      van machines waarop het [Besluit machines][ref1] van toepassing was, die voor de datum van inwerkingtreding voor
      het eerst zijn verhandeld en die voldoen aan de van toepassing zijnde regelgeving zoals die luidde direct voor de
      inwerkingtreding van dit besluit, nog tot 31 december 1994 mogen worden verhandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005884
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005884
