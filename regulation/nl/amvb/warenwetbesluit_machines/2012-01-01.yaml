preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 13 december 1991, VVP/P-
    U 692408, gedaan in overeenstemming met Onze Minister van Economische Zaken en Onze Minister van Sociale Zaken
    en Werkgelegenheid;

    Overwegende, dat het, gelet op richtlijn 89/392/EEG van de Raad van de Europese Gemeenschappen van 14 juni 1989,
    inzake de onderlinge aanpassing van de wetgevingen van de lid-staten betreffende machines (PbEG L 183) en richtlijn
    91/368/EEG van de Raad van de Europese Gemeenschappen van 20 juni 1991 tot wijziging van richtlijn 89/392/EEG (PbEG
    L 198), noodzakelijk is regels te stellen ten aanzien van de veiligheid van machines;

    Gelet op de artikelen 4, eerste lid, onderdeel a, 8, onderdelen a, b en c, 11, 12, 13 en 14 van de Warenwet (Stb.
    1988, 360);

    Gezien het advies van de Adviescommissie Warenwet van 18 september 1991, nr 14403/(41)5;

    De Raad van State gehoord (advies van 14 april 1992, nr. W13.92.0006);

    Gezien het nader rapport van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 12 juni 1992, VVP/P
    921207, uitgebracht in overeenstemming met Onze Minister van Economische Zaken en Onze Minister van Sociale Zaken
    en Werkgelegenheid;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - aangewezen aangemelde instelling:
      krachtens [artikel 7a van de wet][ref1] in het kader van de richtlijn aangewezen en bij de Commissie van de
      Europese Gemeenschappen aangemelde instelling, dan wel een door een andere staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte, in het kader van de richtlijn aangewezen en bij de Commissie van de
      Europese Gemeenschappen aangemelde instelling;
        - aangewezen instelling: krachtens [artikel 7a van de wet][ref2] aangewezen instelling;
        - drager: een deel van een hijs- en hefwerktuig voor beroepsmatig personenvervoer, waarop personen of goederen zich
      bevinden om naar boven of beneden te worden gebracht;
        - essentiële gezondheids- en veiligheidseisen: bepalingen betreffende het ontwerp en de bouw van machines om te
      zorgen voor een hoog niveau van de veiligheid of gezondheid van de mens en, in voorkomend geval, van huisdieren
      en de veiligheid van zaken en, indien van toepassing, de bescherming van het milieu, als bedoeld in bijlage I bij
      de richtlijn;
        - essentiële gezondheids- en veiligheidseisen voor de bescherming van het milieu: bepalingen betreffende het
      ontwerp en de bouw van machines als bedoeld in afdeling 2.4 van bijlage I bij Richtlijn 2006/42/EG;
        - Europese Economische Ruimte: grondgebied waarop de Overeenkomst betreffende de Europese Economische Ruimte van
      toepassing is;
        - fabrikant: natuurlijke persoon of rechtspersoon die een machine of niet voltooide machine, ontwerpt of
      produceert, voor eigen gebruik of ten einde haar onder zijn eigen naam of merk in de handel te brengen of, bij
      gebreke aan een dergelijke persoon, de natuurlijke of rechtspersoon die een machine of niet voltooide machine in de
      handel brengt of in bedrijf stelt;
        - gemachtigde: in de Europese Economische Ruimte gevestigde natuurlijke persoon of rechtspersoon die schriftelijk
      door de fabrikant is gemachtigd om namens hem alle of een deel van de in dit besluit bedoelde verplichtingen te
      vervullen;
        - hijs- en hefwerktuig voor beroepsmatig personenvervoer: een tijdelijk opgestelde machine die bepaalde
      stopplaatsen bedient, met behulp van een drager die ten opzichte van het horizontale vlak meer dan 15 graden
      hellend geleid beweegt of op een andere manier een vaste baan volgt, en bestemd is voor het vervoer van: a.
      werknemers of daarmee gelijkgestelde personen; b. werknemers of daarmee gelijkgestelde personen en goederen; c.
      alleen goederen indien de drager toegankelijk is, dat wil zeggen een persoon de drager zonder probleem kan betreden
      en de drager is uitgerust met bedieningsapparatuur in de drager of binnen bereik van een persoon in de drager;
        - hijs- of hefgereedschappen: stroppen en hun onderdelen of niet vast met de hijs- of hefmachine verbonden
      onderdelen of uitrustingsstukken voor het hijsen of heffen van een last, dat tussen de machine en de last of
      op de last zelf wordt aangebracht, dan wel bestemd is om een integrerend deel van de last uit te maken, en dat
      afzonderlijk in de handel wordt gebracht;
        - hijskraan: hijswerktuig, dat is ingericht en bestemd voor het verplaatsen van vrij-hangende lasten door middel
      van mechanische aandrijving;
        - inbedrijfstelling: eerste gebruik in de Europese Economische Ruimte van een machine overeenkomstig het
      gebruiksdoel;
        - in de handel brengen: voor het eerst tegen vergoeding of gratis in de Europese Economische Ruimte ter beschikking
      stellen van een machine of een niet voltooide machine met het oog op de distributie of het gebruik ervan;
        - kettingen, kabels en banden: kettingen, kabels en banden die zijn ontworpen en geproduceerd voor hijs- of
      hefdoeleinden als onderdeel van hijs- of hefmachines of van hijs- of hefgereedschap;
        - machine: a. samenstel, voorzien van of bestemd om te worden voorzien van een aandrijfsysteem, maar niet op basis
      van rechtstreeks gebruikte menselijke of dierlijke spierkracht, van onderling verbonden onderdelen of componenten
      waarvan er ten minste één kan bewegen, en die samengevoegd worden voor een bepaalde toepassing; b. samenstel als
      bedoeld onder a, waarvan slechts de componenten voor de montage op de plaats van gebruik of voor de aansluiting
      op kracht- of aandrijfbronnen ontbreken; c. samenstel als bedoeld onder a of b, dat gereed is voor montage en dat
      in de desbetreffende staat alleen kan functioneren na montage op een vervoermiddel of montage in een gebouw of
      bouwwerk; d. samenstellen van machines als bedoeld onder a, b of c, of niet voltooide machines die om tot hetzelfde
      resultaat te komen zodanig zijn opgesteld en worden bestuurd dat zij als één geheel functioneren; e. samenstel van
      onderling verbonden onderdelen of componenten waarvan er ten minste één kan bewegen en die in hun samenhang bestemd
      zijn voor het heffen van lasten en die uitsluitend rechtstreeks aangedreven worden door menselijke spierkracht;
      f. verwisselbaar uitrustingsstuk; g. veiligheidscomponent; h. hijs- en hefgereedschappen; i. kettingen, kabels
      en banden; j. verwijderbare mechanische overbrengingsinrichting; k. machine als bedoeld onder a tot en met j, die
      onroerend is; l. hijskraan die onroerend is;
        - niet voltooide machine: a. samenstel, zoals een aandrijfsysteem, dat bijna een machine vormt, maar dat niet
      zelfstandig een bepaalde toepassing kan realiseren, en slechts bedoeld is om te worden ingebouwd in of te worden
      samengebouwd met een of meer machines of andere niet voltooide machines of uitrusting, tot een machine; b. niet
      voltooide machine als bedoeld onder a, die onroerend is;
        - richtlijn: richtlijn nr. 2006/42/EG van het Europees Parlement en de Raad van de Europese Unie van 17 mei 2006
      betreffende machines en tot wijziging van richtlijn 95/16/EG (PbEU L 157);
        - veiligheidscomponent: 'component die is opgenomen in bijlage V bij de richtlijn of een component: a. die een'
      veiligheidsfunctie vervult; b. die afzonderlijk in de handel wordt gebracht; c. waarvan het niet of verkeerd
      functioneren de veiligheid van personen in gevaar brengt, en d. die niet nodig is voor de werking van de machine of
      die door gewone componenten kan worden vervangen om de machine te doen werken;
        - verwijderbare mechanische overbrengingsinrichting: a. verwijderbaar onderdeel dat is bestemd voor
      krachtoverbrenging van een aandrijfmachine of trekker naar de eerste vaste aslager van de aangedreven machine; b.
      een onderdeel als bedoeld onder a, inclusief de afscherming, indien dit onderdeel met de afscherming in de handel
      wordt gebracht;
        - verwisselbaar uitrustingsstuk: een inrichting die na inbedrijfstelling van een machine of trekker door de
      bediener zelf hieraan wordt gekoppeld om deze een andere of bijkomende functie te geven, voor zover deze inrichting
      geen gereedschap is;
        - wet: de [Warenwet][ref3];
        - wijziging: een wijziging van een hijs- en hefwerktuig voor beroepsmatig personenvervoer, anders dan de
      wijzigingen in de vorm van uitbreidingen of varianten van het hijs- en hefwerktuig, waarvoor de afgegeven EG-
      verklaring van overeenstemming geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0001969#Artikel7a
      [ref3]: https://wetten.overheid.nl/BWBR0001969
