  - number: '2.1'
    text: |-
      Het is verboden machines en niet voltooide machines die niet voldoen aan de vervaardigingsvoorschriften bij of
      krachtens dit besluit gesteld in de handel te brengen of in bedrijf te stellen.
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel2
  - number: '2.2'
    text: |-
      Het is verboden machines in de handel te brengen of in bedrijf te stellen anders dan met inachtneming van
      de voorschriften bij of krachtens dit besluit gesteld met betrekking tot de aanduiding en het bezigen van
      vermeldingen.
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel2
  - number: '2.3'
    text: |-
      Het is verboden machines en niet voltooide machines in de handel te brengen of in bedrijf te stellen anders dan
      met inachtneming van de voorschriften bij of krachtens dit besluit gesteld met betrekking tot het voorhanden zijn
      van documenten.
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel2
  - number: '2.4'
    text: |-
      Het is verboden machines en niet voltooide machines in de handel te brengen of in bedrijf te stellen, indien de
      bij of krachtens dit besluit voorgeschreven overeenstemmings-, beoordelings- of keuringsprocedures niet in acht
      zijn genomen.
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel2
  - number: '2.5'
    text: |-
      Het is verboden hijskranen en hijs- en hefwerktuigen voor beroepsmatig personenvervoer te verhandelen of te
      gebruiken, indien de bij of krachtens dit besluit voorgeschreven keuringsprocedures niet in acht zijn genomen.
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel2
  - number: '2.6'
    text: |-
      Het is verboden hijskranen en hijs- en hefwerktuigen voor beroepsmatig personenvervoer te verhandelen of te
      gebruiken anders dan met inachtneming van de voorschriften bij of krachtens dit besluit gesteld met betrekking tot
      het voorhanden zijn van documenten.
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel2
  - number: 2a
    text: |-
      Besluiten bedoeld in de [artikelen 21, eerste en tweede lid][ref1], en [30 van de wet][ref2] die betrekking
      hebben op machines worden onverwijld door Onze Minister van Sociale Zaken en Werkgelegenheid bekendgemaakt in de
      Staatscourant dan wel op andere passende wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0001969#Artikel30
    url: https://wetten.overheid.nl/BWBR0005577/2012-01-01#Artikel2a
    references:
