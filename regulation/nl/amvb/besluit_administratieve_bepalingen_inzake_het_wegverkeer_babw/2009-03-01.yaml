  - number: '60'
    text: |-
      1 Onze Minister kan voor een wegvak in beheer bij het Rijk in het kader van een experiment een tijdelijk
      verkeersbesluit nemen voor toepassing van een variabele maximumsnelheid voor de duur van ten hoogste twee jaar.

      2 Met een experiment wordt beoogd inzicht te verkrijgen in:

      a. de verkeerskundige effecten;

      b. de effecten op de geluidbelasting en luchtkwaliteit;

      c. de effecten voor de verkeersveiligheid, en

      d. de effecten op de naleving van de maximumsnelheid;

      bij toepassing van een variabele maximumsnelheid of bij het aanpassen van de maximumsnelheid aan de omstandigheden,
      bedoeld in [artikel 60c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004826#Artikel60c
    url: https://wetten.overheid.nl/BWBR0004826/2009-03-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0004826
        artikel: 60c
        hoofdstuk: VII
  - number: 60a
    text: |-
      1 Het experimentverkeersbesluit bevat in elk geval:

      a. de duur van het experiment;

      b. de wegvakken waarop het besluit van toepassing is;

      c. tenminste één maximumsnelheid voor elk wegvak;

      d. de werkwijze bij evaluatie van de effecten, bedoeld in [artikel 60, tweede lid][ref1].

      2 Onze Minister wijst de wegvakken, bedoeld in het eerste lid, onder b, aan na overleg met Onze Minister van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer.

      3 Voor een wegvak kan slechts eenmaal een experimentverkeersbesluit worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004826#Artikel60
    url: https://wetten.overheid.nl/BWBR0004826/2009-03-01#Artikel60a
    references:
      - id: ref1
        bwb_id: BWBR0004826
        artikel: '60'
        hoofdstuk: VII
  - number: 60b
    text: |-
      1 Onze Minister kan bij het nemen, wijzigen of intrekken van een experimentverkeersbesluit afwijken van:

      a. de [artikelen 81][ref1], [87d, tweede lid][ref2], [87f][ref3], [87g][ref4], [98][ref5], [99][ref6], [100][ref7],
      [100a][ref8] en [100b van de Wet geluidhinder][ref9];

      b. de [artikelen 24][ref10], [25][ref11] en [27][ref12] van dit besluit;

      c. [hoofdstuk II, paragraaf 4 van de Uitvoeringsvoorschriften BABW inzake verkeerstekens][ref13].

      2 [Artikel 20 van de wet][ref14] is bij het nemen van een experimentverkeersbesluit niet van toepassing.


