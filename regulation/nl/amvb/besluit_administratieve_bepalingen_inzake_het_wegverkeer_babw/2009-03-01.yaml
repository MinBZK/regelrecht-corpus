  - number: '9'
    text: |-
      1 Boven de verkeersborden A1, C1, C6 tot en met C22, E1, E3, E9, G5 en G7 van
      [bijlage 1, behorende bij het RVV 1990][ref1], kan het woord «zone» worden aangebracht. Hieraan kan een aanduiding
      van het gebied van de zone worden toegevoegd.

      2 Als boven een verkeersbord het woord «zone» is aangebracht zonder aanduiding van het gebied van de zone, wordt op
      in aanmerking komende plaatsen bij de zonegrens een bord geplaatst waarmee het einde van de zone wordt aangeduid.

      3 Aan bord E10 van [bijlage 1 bij het RVV 1990][ref2] kan een aanduiding van het gebied van de zone worden
      toegevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004825
      [ref2]: https://wetten.overheid.nl/BWBR0004825
    url: https://wetten.overheid.nl/BWBR0004826/2009-03-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004825
      - id: ref2
        bwb_id: BWBR0004825
  - number: '10'
    text: |-
      1 Onze Minister geeft voorschriften over de toepassing van de borden A1, A4, E12, G1, G3 en G5 van [bijlage I,
      behorende bij het RVV 1990](onbekend), alsmede over de zonale toepassing van verkeersborden.

      2 Over de toepassing van de overige verkeerstekens kan Onze Minister voorschriften geven.

      3 De in het eerste en tweede lid bedoelde voorschriften hebben betrekking op:

      a. wat betreft verkeersborden de gevallen waarin deze mogen worden toegepast en de eisen waaraan wegen of
      weggedeelten bij de toepassing van verkeersborden ten minste dienen te voldoen;

      b. wat betreft verkeerslichten de gevallen waarin deze mogen worden toegepast en de eisen waaraan
      verkeerslichtenregelingen ten minste dienen te voldoen;

      c. wat betreft verkeerstekens op het wegdek de gevallen waarin deze mogen worden toegepast.
    url: https://wetten.overheid.nl/BWBR0004826/2009-03-01#Artikel10
  - number: '11'
    text: |-
      1 Onze Minister kan voorschriften geven over de toepassing van onderborden.

      2 De in het eerste lid bedoelde voorschriften hebben betrekking op de gevallen waarin onderborden mogen worden
      toegepast.
    url: https://wetten.overheid.nl/BWBR0004826/2009-03-01#Artikel11
  - number: '12'
    text: |-
      De plaatsing of verwijdering van de hierna genoemde verkeerstekens moet geschieden krachtens een verkeersbesluit:

      a. de borden die zijn opgenomen in de[ hoofdstukken A tot en met G van bijlage 1, behorende bij het RVV 1990]
      (onbekend), uitgezonderd de borden C22 en E9, alsmede de borden E4, E12 en E13 tenzij onder deze verkeersborden een
      onderbord als bedoeld in [artikel 8, tweede lid, onderdeel d][ref1], wordt aangebracht, dan wel toepassing wordt
      gegeven aan [artikel 8, derde lid][ref2]; .

      b. de volgende verkeerstekens op het wegdek:

      I. doorgetrokken strepen;

      II. de aanduiding van fietsstroken;

      III. de aanduiding van busstroken en busbanen;

      IV. voetgangersoversteekplaatsen;

      V. gele doorgetrokken strepen;

      VI. gele onderbroken strepen;

      VII. haaietanden.


      [ref1]: https://wetten.overheid.nl/BWBR0004826#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004826#Artikel8
    url: https://wetten.overheid.nl/BWBR0004826/2009-03-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004826
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004826
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
  - number: '13'
    text: |-
      In het verkeersbesluit tot plaatsing van borden die de snelheid, het parkeren of geslotenverklaringen betreffen
      alsmede van bord G7 kan worden bepaald, dat de door deze borden aangeduide geboden of verboden gelden in een
      bepaald gebied.
    url: https://wetten.overheid.nl/BWBR0004826/2009-03-01#Artikel13
  - number: '14'
    text: |-
      Indien onder de in deze paragraaf genoemde verkeersborden onderborden worden geplaatst als bedoeld in
      [artikel 8, tweede lid][ref1], of toepassing wordt gegeven aan [artikel 8, derde lid][ref2], wordt zulks in het
      betrokken verkeersbesluit tot uitdrukking gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0004826#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004826#Artikel8
    url: https://wetten.overheid.nl/BWBR0004826/2009-03-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004826
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004826
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
  - number: '15'
    text: |-
      In het verkeersbesluit tot plaatsing van bord A1, voorzover dit aanduidt dat een maximumsnelheid van 30 km/h of 60
      km/h geldt, bord B3, B4, B5 of B6 op een 30 km/h- of 60 km/h weg of in een 30 km/h- of 60 km/hzone, en bord G5
      van [bijlage 1, behorende bij het RVV 1990][ref1], wordt aangegeven op welke wijze wordt voldaan aan de krachtens
      [artikel 14 van de wet][ref2] gestelde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0004825
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel14
    url: https://wetten.overheid.nl/BWBR0004826/2009-03-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004825
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '14'
  - number: '16'
    text: |-
      Geen verkeersbesluit behoeft te worden genomen indien het betrokken verkeersteken wordt geplaatst of verwijderd
      ter nadere aanduiding dat een verkeersregel van toepassing is dan wel dat een ander verkeersteken dat een gebod of
      verbod inhoudt is geplaatst.
    url: https://wetten.overheid.nl/BWBR0004826/2009-03-01#Artikel16
  - number: '18'
    text: In het verkeersbesluit worden de aard en de omvang van de maatregelen aangegeven.
    url: https://wetten.overheid.nl/BWBR0004826/2009-03-01#Artikel18
  - number: '19'
    text: |-
      Geen verkeersbesluit behoeft te worden genomen, indien de betrokken maatregel strekt tot ondersteuning van een
      verkeersregel of een aldaar geplaatst verkeersteken dat een gebod of verbod inhoudt.
    url: https://wetten.overheid.nl/BWBR0004826/2009-03-01#Artikel19
  - number: '21'
    text: |-
      De motivering van het verkeersbesluit vermeldt in ieder geval welke doelstelling of doelstellingen met het
      verkeersbesluit worden beoogd. Daarbij wordt aangegeven welke van de in [artikel 2, eerste en tweede lid][ref1],
      van de wet genoemde belangen ten grondslag liggen aan het verkeersbesluit. Indien tevens andere van de in
      [artikel 2, eerste en tweede lid][ref2], van de wet genoemde belangen in het geding zijn, wordt voorts aangegeven
      op welke wijze de belangen tegen elkaar zijn afgewogen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel2
    url: https://wetten.overheid.nl/BWBR0004826/2009-03-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '2'
  - number: '23'
    text: |-
      Het openbaar lichaam dat het beheer heeft over de weg of, indien geen openbaar lichaam het beheer heeft, de
      eigenaar van de weg wordt met betrekking tot verkeersbesluiten gehoord.
    url: https://wetten.overheid.nl/BWBR0004826/2009-03-01#Artikel23
  - number: '24'
    text: |-
      Verkeersbesluiten worden genomen na overleg met:

      a. de korpschef van het betrokken regionale politiekorps,

      b. de korpschef van het Korps landelijke politiediensten, indien de taak ten aanzien van het verkeer mede wordt
      vervuld door dat politiekorps, en

      c. de commandant van de Koninklijke marechaussee, indien de taak ten aanzien van het verkeer mede wordt vervuld op
      een luchtvaartterrein als bedoeld in [artikel 6, eerste lid, onder ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel6
    url: https://wetten.overheid.nl/BWBR0004826/2009-03-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '6'
  - number: '25'
    text: |-
      1 Verkeersbesluiten als gevolg waarvan het verkeer op wegen anders dan die waarop het verkeersbesluit betrekking
      heeft rechtstreeks en ingrijpend wordt beïnvloed, worden genomen na overleg met het ten aanzien van die andere
      wegen bevoegd gezag.

      2 Verkeersbesluiten worden genomen na overleg met de betrokken spoorwegbeheerder, indien het besluit maatregelen
      betreft nabij een overweg als bedoeld in [artikel 1, onderdeel aab, van het RVV 1990][ref1] , waardoor het verkeer
      over die overweg wordt beïnvloed.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel1
    url: https://wetten.overheid.nl/BWBR0004826/2009-03-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '1'
  - number: '26'
    text: |-
      Van de bekendmaking van verkeersbesluiten wordt mededeling gedaan in één of meer plaatselijke dag- of weekbladen.
      In de mededeling worden in ieder geval de weg waarop het verkeersbesluit betrekking heeft, alsmede de te plaatsen
      of te verwijderen verkeerstekens dan wel de te treffen maatregelen ter regeling van het verkeer vermeld.
    url: https://wetten.overheid.nl/BWBR0004826/2009-03-01#Artikel26
  - number: '27'
    text: |-
      Verkeersbesluiten als bedoeld in [artikel 15, tweede lid][ref1], van de wet treden in werking met ingang van de
      dag, nadat een termijn van zes weken na de dag waarop het besluit is bekend gemaakt, is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel15
    url: https://wetten.overheid.nl/BWBR0004826/2009-03-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '15'
  - number: '29'
    text: |-
      De kosten, voortvloeiende uit de plaatsing van bord E6 van [bijlage I, behorende bij het RVV 1990](onbekend),
      kunnen worden verhaald op degene of degenen ten behoeve van wie het bord is geplaatst.
    url: https://wetten.overheid.nl/BWBR0004826/2009-03-01#Artikel29
  - number: '33'
    text: |-
      Indien in, op, boven of langs een weg activiteiten worden ondernomen welke niet behoren tot het normale
      verkeersgebruik van die weg en het bevoegd gezag het noodzakelijk acht verkeerstekens te plaatsen of te verwijderen
      in verband met die activiteiten, kan het bevoegd gezag de kosten die het voor de plaatsing, het onderhoud of de
      verwijdering heeft gemaakt ten laste brengen van degene die deze activiteiten uitvoert.
    url: https://wetten.overheid.nl/BWBR0004826/2009-03-01#Artikel33
  - number: '34'
    text: |-
      Door het bevoegd gezag dan wel door het openbaar lichaam, dat het beheer heeft over een weg of, indien geen
      openbaar lichaam het beheer heeft, door de eigenaar van de weg kunnen in de hierna genoemde omstandigheden en
      voor de duur van die omstandigheden verkeerstekens als bedoeld in [artikel 12][ref1], worden geplaatst alsmede
      maatregelen als bedoeld in [artikel 15, tweede lid][ref2], van de wet, worden uitgevoerd:

      a. ingeval van de uitvoering van werken, opdooi, de doorweekte toestand van een weg of weggedeelte, dreigend gevaar
      of andere dringende omstandigheid van voorbijgaande aard;

      b. ingeval van een door het wegverkeer veroorzaakte ernstige aantasting van voorbijgaande aard van de in
      [het tweede lid, onder ][ref3] van de wet genoemde belangen.


      [ref1]: https://wetten.overheid.nl/BWBR0004826#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel2
    url: https://wetten.overheid.nl/BWBR0004826/2009-03-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0004826
        artikel: '12'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '15'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '2'
  - number: '35'
    text: |-
      De plaatsing van verkeerstekens en het uitvoeren van maatregelen, bedoeld in [artikel 34][ref1], kunnen geschieden
      zonder een daaraan ten grondslag liggend verkeersbesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0004826#Artikel34
    url: https://wetten.overheid.nl/BWBR0004826/2009-03-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0004826
        artikel: '34'
        hoofdstuk: II
        paragraaf: '8'
  - number: '36'
    text: |-
      Van het voornemen tot tijdelijke plaatsing van verkeerstekens en tot het tijdelijk uitvoeren van maatregelen of,
      indien hiertoe reeds is overgegaan, van dat feit wordt zo spoedig mogelijk kennis gegeven aan het bevoegd gezag dat
      de tijdelijke plaatsing of de tijdelijke maatregel ongedaan kan maken. De kennisgeving kan achterwege blijven voor
      zover dit gezag dit heeft bepaald.
    url: https://wetten.overheid.nl/BWBR0004826/2009-03-01#Artikel36
  - number: '37'
    text: |-
      In afwijking van [artikel 35][ref1] geschieden de tijdelijke plaatsing en de tijdelijke maatregel krachtens een
      verkeersbesluit indien de omstandigheden die tot de tijdelijke plaatsing of tot de tijdelijke maatregel leiden van
      langere duur zijn dan vier maanden dan wel zich regelmatig voordoen.


      [ref1]: https://wetten.overheid.nl/BWBR0004826#Artikel35
    url: https://wetten.overheid.nl/BWBR0004826/2009-03-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0004826
        artikel: '35'
        hoofdstuk: II
        paragraaf: '8'
  - number: '38'
    text: |-
      De met verkeersregeling belaste ambtenaren, aangesteld voor de uitvoering van de politietaak en de buitengewone
      opsporingsambtenaren van de Inspectie Verkeer en Waterstaat, kunnen ten behoeve van verkeerscontroles en, indien
      in onvoorziene omstandigheden de afwikkeling van het verkeer zulks noodzakelijk maakt, voor ten hoogste drie
      uren verkeerstekens plaatsen en maatregelen uitvoeren zonder dat kennisgeving aan het bevoegd gezag behoeft te
      geschieden. Geschiedt de plaatsing of maatregel voor langere tijd, dan is [artikel 36][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004826#Artikel36
    url: https://wetten.overheid.nl/BWBR0004826/2009-03-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0004826
        artikel: '36'
        hoofdstuk: II
        paragraaf: '8'
  - number: '39'
    text: |-
      Indien de toestand van een waterkerende dijk waarop een weg is gelegen zulks vordert, heeft de onderhoudsplichtige
      van de dijk de bevoegdheid tot het tijdelijk plaatsen van verkeerstekens die een gebod of verbod inhouden alsmede
      tot het tijdelijk uitvoeren van maatregelen.
    url: https://wetten.overheid.nl/BWBR0004826/2009-03-01#Artikel39
  - number: '40'
    text: |-
      Door of namens de onderhoudsplichtige van de dijk wordt onverwijld aan Onze commissaris in de provincie en aan
      het openbaar lichaam, dat het beheer heeft over de weg of, indien geen openbaar lichaam het beheer heeft, aan de
      eigenaar van de weg kennis gegeven van het voornemen tot tijdelijke plaatsing en tot het tijdelijk uitvoeren van
      maatregelen bedoeld in [artikel 39][ref1] of, indien hiertoe reeds is overgegaan, van dat feit. Onze commissaris in
      de provincie kan de tijdelijke plaatsing of de tijdelijke maatregel ongedaan maken.


      [ref1]: https://wetten.overheid.nl/BWBR0004826#Artikel39
    url: https://wetten.overheid.nl/BWBR0004826/2009-03-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0004826
        artikel: '39'
        hoofdstuk: II
        paragraaf: '8'
  - number: '41'
    text: |-
      Tot het ongedaan maken van de tijdelijke plaatsing van verkeerstekens of het tijdelijk uitvoeren van maatregelen
      als bedoeld in de [artikelen 36][ref1] en [40][ref2] kan worden overgegaan indien:

      a. de omstandigheden als bedoeld in [artikel 34][ref3] zich niet of niet langer voordoen of

      b. deze omstandigheden de plaatsing of de maatregel niet kunnen rechtvaardigen.


      [ref1]: https://wetten.overheid.nl/BWBR0004826#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0004826#Artikel40
      [ref3]: https://wetten.overheid.nl/BWBR0004826#Artikel34
    url: https://wetten.overheid.nl/BWBR0004826/2009-03-01#Artikel41
    references:
      - id: ref1
