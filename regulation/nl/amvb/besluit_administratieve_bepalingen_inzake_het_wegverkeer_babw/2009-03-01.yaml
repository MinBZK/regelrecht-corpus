  - number: 1a
    text: |-
      Het is aan anderen dan degenen die daartoe krachtens dit besluit bevoegd zijn verboden op, langs of boven de wegen
      verkeerstekens aan te brengen, te doen aanbrengen, aangebracht te houden of te verwijderen dan wel de zichtbaarheid
      van verkeerstekens weg te nemen.
    url: https://wetten.overheid.nl/BWBR0004826/2009-03-01#Artikel1a
  - number: '2'
    text: |-
      Het is verboden voorwerpen, inrichtingen of borden, van welke aard ook, die het verkeer in verwarring zouden kunnen
      brengen op, langs of boven de wegen aan te brengen, te doen aanbrengen, of aangebracht te houden.
    url: https://wetten.overheid.nl/BWBR0004826/2009-03-01#Artikel2
  - number: '3'
    text: |-
      Verkeerstekens zijn:

      a. verkeersborden;

      b. verkeerslichten en

      c. verkeerstekens op het wegdek.
    url: https://wetten.overheid.nl/BWBR0004826/2009-03-01#Artikel3
  - number: '4'
    text: |-
      1 De verkeersborden die een gebod, een verbod of een adviessnelheid betreffen zijn vastgesteld in [bijlage I]
      (onbekend), behorende bij het [RVV 1990, hoofdstukken A tot en met H](onbekend).

      2 De verkeersborden die een gevaar aanduiden zijn vastgesteld in [bijlage I](onbekend), behorende bij het [RVV
      1990, hoofdstuk J](onbekend).

      3 De verkeersborden die overige informatie van belang voor de weggebruikers bevatten moeten voor zover in [bijlage
      I](onbekend), behorende bij het [RVV 1990, hoofdstukken K](onbekend) en [L](onbekend), niet een bepaald model is
      voorgeschreven, bestaan uit een rechthoekig bord, waarop de letters, cijfers of symbolen in een blauw veld zijn
      geplaatst. Onze Minister kan veranderingen toestaan.
    url: https://wetten.overheid.nl/BWBR0004826/2009-03-01#Artikel4
  - number: '5'
    text: |-
      De verkeerslichten zijn de lichten genoemd in de [artikelen 68 tot en met 75 van het RVV 1990][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel68
    url: https://wetten.overheid.nl/BWBR0004826/2009-03-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '68'
  - number: '6'
    text: |-
      1 De verkeerstekens op het wegdek die een gebod of verbod betreffen zijn de verkeerstekens
      genoemd in [artikel 10, tweede lid][ref1], [artikel 23, eerste lid, onderdeel e en g][ref2],
      [artikel 24, eerste lid, onderdeel e][ref3], [artikel 25, eerste lid][ref4], [artikel 46, eerste lid][ref5],
      [artikel 49, tweede lid][ref6] en de [artikelen 76 tot en met 81 van het RVV 1990][ref7].

      2 Andere verkeerstekens op het wegdek kunnen worden aangebracht ter geleiding van het verkeer, ter herinnering aan
      de ter plaatse geldende maximumsnelheid en ter aanduiding van andere omstandigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel10
