        artikel: '40'
        hoofdstuk: II
        paragraaf: '8'
      - id: ref3
        bwb_id: BWBR0004826
        artikel: '34'
        hoofdstuk: II
        paragraaf: '8'
  - number: '48'
    text: |-
      Bij de vaststelling van de grenzen van de bebouwde kom of kommen als bedoeld in [artikel 20a][ref1] van de wet,
      zijn de [artikelen 23][ref2] en [24][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel20a
      [ref2]: https://wetten.overheid.nl/BWBR0004826#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0004826#Artikel24
