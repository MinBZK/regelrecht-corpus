  - number: 60g
    text: |-
      In afwijking van [artikel 27][ref1] treedt een besluit als bedoeld in [artikel 60][ref2] of
      [60f, eerste lid][ref3], in werking met ingang van de dag, nadat een termijn van twee weken na de dag waarop het
      besluit is bekendgemaakt, is verstreken.


