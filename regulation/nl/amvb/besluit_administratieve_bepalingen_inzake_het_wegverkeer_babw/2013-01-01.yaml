---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_administratieve_bepalingen_inzake_het_wegverkeer_babw
regulatory_layer: AMVB
publication_date: '2025-10-10'
valid_from: '2013-01-01'
bwb_id: BWBR0004826
url: https://wetten.overheid.nl/BWBR0004826/2013-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 12 mei 1989, nr. RW 26148, Hoofddirectie van de
    Waterstaat, Hoofdafdeling Bestuurlijke en Juridische Zaken;

    Gelet op de Wegenverkeerswet (Stb. 1935, 554);

    De Raad van State gehoord (advies van 5 december 1989, nr. W09.89.0261);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 16 juli 1990, nr. RW 65900, Hoofddirectie
    van de Waterstaat, Hoofdafdeling Bestuurlijke en Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel1
  - number: 1.a
    text: |-
      *begeleidingsvoertuig:* bedrijfsauto als bedoeld in [artikel 1.1, van de Regeling voertuigen][ref1],
      met een toegestane maximummassa van niet meer dan 3500 kg dat is
      bestemd voor de begeleiding van exceptionele transporten als bedoeld in
      [artikel 1, onderdeel c, van het Besluit ontheffingverlening Dienst Wegverkeer exceptionele transporten][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0025798#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0018680#Artikel1
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0025798
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0018680
        artikel: '1'
  - number: 1.b
    text: |-
      *verkeersregelaar met in het kader van zijn beroep verkeersregelende taken:* verkeersregelaar, niet zijnde
      transportbegeleider of verkeersregelaar die tot taak heeft eenvoudige verkeersregelende werkzaamheden te verrichten
      bij evenementen, die uit hoofde van zijn beroep verkeersregelende werkzaamheden verricht;
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel1
  - number: 1.c
    text: |-
      *bevoegd gezag:* gezag als bedoeld in [artikel 18, eerste lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel18
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '18'
  - number: 1.d
    text: |-
      *gezichtsveldverbeterende voorziening:* voorziening als bedoeld in
      [artikel 5.3.45, zesde en elfde lid, van de Regeling voertuigen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025798#Artikel5
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0025798
        artikel: '5'
  - number: 1.e
    text: |-
      *wegvak:* gedeelte van een weg tussen twee zijwegen of – indien geen zijweg aanwezig is – tussen twee punten waarop
      een verkeersmaatregel betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel1
  - number: 1.f
    text: |-
      *experiment:* experiment als bedoeld in [artikel 186 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel186
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '186'
  - number: 1.g
    text: |-
      *experimentverkeersbesluit:* verkeersbesluit als bedoeld in [artikel 60][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004826#Artikel60
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004826
        artikel: '60'
        hoofdstuk: VII
  - number: 1.h
    text: |-
      *transportbegeleider:* verkeersregelaar die optreedt ter begeleiding van een exceptioneel transport als bedoeld in
      [artikel 1, onderdeel c, van het Besluit ontheffingverlening Dienst Wegverkeer exceptionele transporten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018680#Artikel1
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018680
        artikel: '1'
  - number: 1.i
    text: |-
      *verkeersregelaar:* persoon behorend tot de ingevolge [artikel 12, eerste lid, van de wet][ref1], aangewezen
      categorie, niet zijnde een persoon als bedoeld in [artikel 82, eerste lid, onderdeel d][ref2], of artikel 82, derde
      lid, van het RVV 1990;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0004825#Artikel82
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0004825
        artikel: '82'
  - number: 1.j
    text: |-
      *wet:* [Wegenverkeerswet 1994][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: 1a
    text: |-
      Het is aan anderen dan degenen die daartoe krachtens dit besluit bevoegd zijn verboden op, langs of boven de wegen
      verkeerstekens aan te brengen, te doen aanbrengen, aangebracht te houden of te verwijderen dan wel de zichtbaarheid
      van verkeerstekens weg te nemen.
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel1a
  - number: '2'
    text: |-
      Het is verboden voorwerpen, inrichtingen of borden, van welke aard ook, die het verkeer in verwarring zouden kunnen
      brengen op, langs of boven de wegen aan te brengen, te doen aanbrengen, of aangebracht te houden.
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel2
  - number: '3'
    text: 'Verkeerstekens zijn:'
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel3
  - number: 3.a
    text: verkeersborden;
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel3
  - number: 3.b
    text: verkeerslichten en
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel3
  - number: 3.c
    text: verkeerstekens op het wegdek.
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel3
  - number: '4.1'
    text: |-
      De verkeersborden die een gebod, een verbod of een adviessnelheid betreffen zijn vastgesteld in [bijlage I]
      (onbekend), behorende bij het [RVV 1990, hoofdstukken A tot en met H](onbekend).
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel4
  - number: '4.2'
    text: |-
      De verkeersborden die een gevaar aanduiden zijn vastgesteld in [bijlage I](onbekend), behorende bij het [RVV 1990,
      hoofdstuk J](onbekend).
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel4
  - number: '4.3'
    text: |-
      De verkeersborden die overige informatie van belang voor de weggebruikers bevatten moeten voor zover in [bijlage
      I](onbekend), behorende bij het [RVV 1990, hoofdstukken K](onbekend) en [L](onbekend), niet een bepaald model is
      voorgeschreven, bestaan uit een rechthoekig bord, waarop de letters, cijfers of symbolen in een blauw veld zijn
      geplaatst. Onze Minister kan veranderingen toestaan.
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel4
  - number: 4a.1
    text: |-
      Grafische elementen van verschillende kleuren in de verkeersborden, bedoeld in
      [bijlage I, behorende bij het RVV 1990][ref1], kunnen worden gescheiden door een contrasterende bies.


      [ref1]: https://wetten.overheid.nl/BWBR0004825
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0004825
  - number: 4a.2
    text: |-
      De rode verkeersborden, bedoeld in [bijlage I, behorende bij het RVV 1990][ref1], kunnen aan de omtrek worden
      voorzien van een witte bies.


      [ref1]: https://wetten.overheid.nl/BWBR0004825
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0004825
  - number: '5'
    text: |-
      De verkeerslichten zijn de lichten genoemd in de [artikelen 68 tot en met 75 van het RVV 1990][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel68
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '68'
  - number: '6.1'
    text: |-
      De verkeerstekens op het wegdek die een gebod of verbod betreffen zijn de verkeerstekens
      genoemd in [artikel 10, tweede lid][ref1], [artikel 23, eerste lid, onderdeel e en g][ref2],
      [artikel 24, eerste lid, onderdeel e][ref3], [artikel 25, eerste lid][ref4], [artikel 46, eerste lid][ref5],
      [artikel 49, tweede lid][ref6] en de [artikelen 76 tot en met 81 van het RVV 1990][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0004825#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0004825#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0004825#Artikel25
      [ref5]: https://wetten.overheid.nl/BWBR0004825#Artikel46
      [ref6]: https://wetten.overheid.nl/BWBR0004825#Artikel49
      [ref7]: https://wetten.overheid.nl/BWBR0004825#Artikel76
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0004825
        artikel: '23'
      - id: ref3
        bwb_id: BWBR0004825
        artikel: '24'
      - id: ref4
        bwb_id: BWBR0004825
        artikel: '25'
      - id: ref5
        bwb_id: BWBR0004825
        artikel: '46'
      - id: ref6
        bwb_id: BWBR0004825
        artikel: '49'
      - id: ref7
        bwb_id: BWBR0004825
        artikel: '76'
  - number: '6.2'
    text: |-
      Andere verkeerstekens op het wegdek kunnen worden aangebracht ter geleiding van het verkeer, ter herinnering aan de
      ter plaatse geldende maximumsnelheid en ter aanduiding van andere omstandigheden.
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel6
  - number: '7'
    text: Andere verkeerstekens dan de in dit hoofdstuk genoemde worden niet geplaatst.
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel7
  - number: '8.1'
    text: Onder verkeersborden kunnen onderborden worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel8
  - number: '8.2'
    text: 'Deze onderborden kunnen:'
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel8
  - number: 8.2.a
    text: een nadere uitleg van de op de verkeersborden voorkomende aanduiding inhouden;
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel8
  - number: 8.2.b
    text: |-
      bij verkeersborden die een gebod of verbod aanduiden, een beperking van de werkingssfeer van die verkeersborden
      inhouden;
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel8
  - number: 8.2.c
    text: |-
      bij bord C7 van [bijlage I, behorende bij het RVV 1990][ref1], de aanduiding inhouden dat de uit dit verkeersbord
      voortvloeiende beperking niet geldt voor motorvoertuigen die zijn voorzien van een gezichtsveldverbeterende
      voorziening;


      [ref1]: https://wetten.overheid.nl/BWBR0004825
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004825
  - number: 8.2.d
    text: |-
      bij de verkeersborden E4 tot en met E8 en E10 tot en met E13 van [bijlage 1, behorende bij het RVV 1990][ref1],
      betrekking hebben op


      [ref1]: https://wetten.overheid.nl/BWBR0004825
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004825
  - number: 8.2.d.1°
    text: |-
      de voertuigcategorie of groep voertuigen waarvoor de parkeergelegenheid is bestemd en, voor zover het betreft bord
      E6, tevens op de aanduiding dat de parkeergelegenheid is gereserveerd voor een bepaald voertuig;
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel8
  - number: 8.2.d.2°
    text: de wijze waarop of het doel waarmee het parkeren dient te geschieden;
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel8
  - number: 8.2.d.3°
    text: de dagen of uren waarop het parkeren is verboden of
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel8
  - number: 8.2.d.4°
    text: |-
      de dagen of uren waarop een beperking als bedoeld in 1° en 2° geldt en, voor zover: - het verkeersbord E6 betreft,
      de dagen of uren waarop het in het [tweede lid van artikel 26 van het RVV 1990][ref1] bedoelde gebruik van de
      parkeerschijf van toepassing is, en
        - het verkeersbord E10 betreft, de dagen of uren waarop het in het
      [tweede lid van artikel 25 van het RVV 1990][ref2] bedoelde gebruik van de parkeerschijf van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0004825#Artikel25
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0004825
        artikel: '25'
  - number: 8.2.e
    text: |-
      bij de verkeersborden G7, G9, G11 en G12a van [bijlage 1, behorende bij het RVV 1990][ref1], een aanduiding
      inhouden dat de uit het verkeersbord voortvloeiende geboden of verboden niet gelden voor het verkeersgebruik als op
      het onderbord is aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0004825
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004825
  - number: '8.3'
    text: |-
      De in het tweede lid, onderdeel d, onder 1° en 2°, bedoelde aanduidingen kunnen in plaats van op een onderbord, ook
      op het verkeersbord worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel8
  - number: '9.1'
    text: |-
      Boven de verkeersborden A1, C1, C6 tot en met C22a, E1, E3, E9, G5 en G7 van
      [bijlage 1, behorende bij het RVV 1990][ref1], kan het woord «zone» worden aangebracht. Hieraan kan een aanduiding
      van het gebied van de zone worden toegevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004825
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004825
  - number: '9.2'
    text: |-
      Als boven een verkeersbord het woord «zone» is aangebracht zonder aanduiding van het gebied van de zone, wordt op
      in aanmerking komende plaatsen bij de zonegrens een bord geplaatst waarmee het einde van de zone wordt aangeduid.
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel9
  - number: '9.3'
    text: |-
      Aan bord E10 van [bijlage 1 bij het RVV 1990][ref1] kan een aanduiding van het gebied van de zone worden
      toegevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004825
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004825
  - number: '12'
    text: 'De plaatsing of verwijdering van de hierna genoemde verkeerstekens moet geschieden krachtens een verkeersbesluit:'
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel12
  - number: 12.a
    text: 'de volgende borden:'
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel12
  - number: 12.a.I
    text: |-
      de borden die zijn opgenomen in de hoofdstukken A tot en met G van [bijlage 1, behorende bij het RVV 1990][ref1],
      uitgezonderd de borden C22 en E9, alsmede de borden E4, E12 en E13 tenzij onder deze verkeersborden een onderbord
      als bedoeld in artikel 8, tweede lid, onderdeel d, wordt aangebracht, dan wel toepassing wordt gegeven aan artikel
      8, derde lid;


      [ref1]: https://wetten.overheid.nl/BWBR0004825
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004825
  - number: 12.a.II
    text: |-
      bord L3 van [bijlage 1, behorende bij het RVV 1990][ref1], voor zover het een bushalte betreft;


      [ref1]: https://wetten.overheid.nl/BWBR0004825
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004825
  - number: 12.b
    text: 'de volgende verkeerstekens op het wegdek:'
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel12
  - number: 12.b.I
    text: doorgetrokken strepen;
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel12
  - number: 12.b.II
    text: de aanduiding van fietsstroken;
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel12
  - number: 12.b.III
    text: de aanduiding van busstroken en busbanen;
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel12
  - number: 12.b.IV
    text: voetgangersoversteekplaatsen;
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel12
  - number: 12.b.V
    text: gele doorgetrokken strepen;
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel12
  - number: 12.b.VI
    text: gele onderbroken strepen;
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel12
  - number: 12.b.VII
    text: haaietanden.
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel12
  - number: '13'
    text: |-
      In het verkeersbesluit tot plaatsing van borden die de snelheid, het parkeren of geslotenverklaringen betreffen
      alsmede van bord G7 kan worden bepaald, dat de door deze borden aangeduide geboden of verboden gelden in een
      bepaald gebied.
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel13
  - number: '14'
    text: |-
      Indien onder de in deze paragraaf genoemde verkeersborden onderborden worden geplaatst als bedoeld in
      [artikel 8, tweede lid][ref1], of toepassing wordt gegeven aan [artikel 8, derde lid][ref2], wordt zulks in het
      betrokken verkeersbesluit tot uitdrukking gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0004826#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004826#Artikel8
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004826
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004826
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
  - number: '15'
    text: |-
      In het verkeersbesluit tot plaatsing van bord A1, voorzover dit aanduidt dat een maximumsnelheid van 30 km/h of 60
      km/h geldt, bord B3, B4, B5 of B6 op een 30 km/h- of 60 km/h weg of in een 30 km/h- of 60 km/hzone, en bord G5
      van [bijlage 1, behorende bij het RVV 1990][ref1], wordt aangegeven op welke wijze wordt voldaan aan de krachtens
      [artikel 14 van de wet][ref2] gestelde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0004825
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel14
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004825
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '14'
  - number: '16'
    text: |-
      Geen verkeersbesluit behoeft te worden genomen indien het betrokken verkeersteken wordt geplaatst of verwijderd
      ter nadere aanduiding dat een verkeersregel van toepassing is dan wel dat een ander verkeersteken dat een gebod of
      verbod inhoudt is geplaatst.
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel16
  - number: '18'
    text: In het verkeersbesluit worden de aard en de omvang van de maatregelen aangegeven.
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel18
  - number: '19'
    text: |-
      Geen verkeersbesluit behoeft te worden genomen, indien de betrokken maatregel strekt tot ondersteuning van een
      verkeersregel of een aldaar geplaatst verkeersteken dat een gebod of verbod inhoudt.
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel19
  - number: '21'
    text: |-
      De motivering van het verkeersbesluit vermeldt in ieder geval welke doelstelling of doelstellingen met het
      verkeersbesluit worden beoogd. Daarbij wordt aangegeven welke van de in [artikel 2, eerste en tweede lid][ref1],
      van de wet genoemde belangen ten grondslag liggen aan het verkeersbesluit. Indien tevens andere van de in
      [artikel 2, eerste en tweede lid][ref2], van de wet genoemde belangen in het geding zijn, wordt voorts aangegeven
      op welke wijze de belangen tegen elkaar zijn afgewogen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel2
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '2'
  - number: '23'
    text: |-
      Het openbaar lichaam dat het beheer heeft over de weg of, indien geen openbaar lichaam het beheer heeft, de
      eigenaar van de weg wordt met betrekking tot verkeersbesluiten gehoord.
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel23
  - number: '24'
    text: 'Verkeersbesluiten worden genomen na overleg met:'
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel24
  - number: 24.a
    text: de korpschef,
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel24
  - number: 24.b
    text: |-
      de commandant van de Koninklijke marechaussee, indien de taak ten aanzien van het verkeer mede wordt vervuld op een
      luchtvaartterrein als bedoeld in [artikel 4, eerste lid, onder c, van de Politiewet 2012][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel4
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '4'
  - number: '25.1'
    text: |-
      Verkeersbesluiten als gevolg waarvan het verkeer op wegen anders dan die waarop het verkeersbesluit betrekking
      heeft rechtstreeks en ingrijpend wordt beïnvloed, worden genomen na overleg met het ten aanzien van die andere
      wegen bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel25
  - number: '25.2'
    text: |-
      Verkeersbesluiten worden genomen na overleg met de betrokken spoorwegbeheerder, indien het besluit maatregelen
      betreft nabij een overweg als bedoeld in [artikel 1, onderdeel aab, van het RVV 1990][ref1] , waardoor het verkeer
      over die overweg wordt beïnvloed.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel1
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '1'
  - number: '26'
    text: De bekendmaking van verkeersbesluiten geschiedt door plaatsing van het besluit in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel26
  - number: '27'
    text: |-
      Verkeersbesluiten als bedoeld in [artikel 15, tweede lid][ref1], van de wet treden in werking met ingang van de
      dag, nadat een termijn van zes weken na de dag waarop het besluit is bekend gemaakt, is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel15
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '15'
  - number: '29'
    text: |-
      De kosten, voortvloeiende uit de plaatsing van bord E6 van [bijlage I, behorende bij het RVV 1990](onbekend),
      kunnen worden verhaald op degene of degenen ten behoeve van wie het bord is geplaatst.
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel29
  - number: '33'
    text: |-
      Indien in, op, boven of langs een weg activiteiten worden ondernomen welke niet behoren tot het normale
      verkeersgebruik van die weg en het bevoegd gezag het noodzakelijk acht verkeerstekens te plaatsen of te verwijderen
      in verband met die activiteiten, kan het bevoegd gezag de kosten die het voor de plaatsing, het onderhoud of de
      verwijdering heeft gemaakt ten laste brengen van degene die deze activiteiten uitvoert.
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel33
  - number: '34'
    text: |-
      Door het bevoegd gezag dan wel door het openbaar lichaam, dat het beheer heeft over een weg of, indien geen
      openbaar lichaam het beheer heeft, door de eigenaar van de weg kunnen in de hierna genoemde omstandigheden en
      voor de duur van die omstandigheden verkeerstekens als bedoeld in [artikel 12][ref1], worden geplaatst alsmede
      maatregelen als bedoeld in [artikel 15, tweede lid][ref2], van de wet, worden uitgevoerd:


      [ref1]: https://wetten.overheid.nl/BWBR0004826#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel15
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0004826
        artikel: '12'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '15'
  - number: 34.a
    text: |-
      ingeval van de uitvoering van werken, opdooi, de doorweekte toestand van een weg of weggedeelte, dreigend gevaar of
      andere dringende omstandigheid van voorbijgaande aard;
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel34
  - number: 34.b
    text: |-
      ingeval van een door het wegverkeer veroorzaakte ernstige aantasting van voorbijgaande aard van de in
      [het tweede lid, onder ][ref1] van de wet genoemde belangen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel2
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '2'
  - number: '35'
    text: |-
      De plaatsing van verkeerstekens en het uitvoeren van maatregelen, bedoeld in [artikel 34][ref1], kunnen geschieden
      zonder een daaraan ten grondslag liggend verkeersbesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0004826#Artikel34
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0004826
        artikel: '34'
        hoofdstuk: II
        paragraaf: '8'
  - number: '36'
    text: |-
      Van het voornemen tot tijdelijke plaatsing van verkeerstekens en tot het tijdelijk uitvoeren van maatregelen of,
      indien hiertoe reeds is overgegaan, van dat feit wordt zo spoedig mogelijk kennis gegeven aan het bevoegd gezag dat
      de tijdelijke plaatsing of de tijdelijke maatregel ongedaan kan maken. De kennisgeving kan achterwege blijven voor
      zover dit gezag dit heeft bepaald.
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel36
  - number: '37'
    text: |-
      In afwijking van [artikel 35][ref1] geschieden de tijdelijke plaatsing en de tijdelijke maatregel krachtens een
      verkeersbesluit indien de omstandigheden die tot de tijdelijke plaatsing of tot de tijdelijke maatregel leiden van
      langere duur zijn dan vier maanden dan wel zich regelmatig voordoen.


      [ref1]: https://wetten.overheid.nl/BWBR0004826#Artikel35
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0004826
        artikel: '35'
        hoofdstuk: II
        paragraaf: '8'
  - number: '38'
    text: |-
      De met verkeersregeling belaste ambtenaren van politie die zijn aangesteld voor de uitvoering van de politietaak,
      en de buitengewone opsporingsambtenaren van de Inspectie Verkeer en Waterstaat, kunnen ten behoeve van
      verkeerscontroles en, indien in onvoorziene omstandigheden de afwikkeling van het verkeer zulks noodzakelijk maakt,
      voor ten hoogste drie uren verkeerstekens plaatsen en maatregelen uitvoeren zonder dat kennisgeving aan het bevoegd
      gezag behoeft te geschieden. Geschiedt de plaatsing of maatregel voor langere tijd, dan is [artikel 36][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004826#Artikel36
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0004826
        artikel: '36'
        hoofdstuk: II
        paragraaf: '8'
  - number: '39'
    text: |-
      Indien de toestand van een waterkerende dijk waarop een weg is gelegen zulks vordert, heeft de onderhoudsplichtige
      van de dijk de bevoegdheid tot het tijdelijk plaatsen van verkeerstekens die een gebod of verbod inhouden alsmede
      tot het tijdelijk uitvoeren van maatregelen.
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel39
  - number: '40'
    text: |-
      Door of namens de onderhoudsplichtige van de dijk wordt onverwijld aan Onze commissaris in de provincie en aan
      het openbaar lichaam, dat het beheer heeft over de weg of, indien geen openbaar lichaam het beheer heeft, aan de
      eigenaar van de weg kennis gegeven van het voornemen tot tijdelijke plaatsing en tot het tijdelijk uitvoeren van
      maatregelen bedoeld in [artikel 39][ref1] of, indien hiertoe reeds is overgegaan, van dat feit. Onze commissaris in
      de provincie kan de tijdelijke plaatsing of de tijdelijke maatregel ongedaan maken.


      [ref1]: https://wetten.overheid.nl/BWBR0004826#Artikel39
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0004826
        artikel: '39'
        hoofdstuk: II
        paragraaf: '8'
  - number: '41'
    text: |-
      Tot het ongedaan maken van de tijdelijke plaatsing van verkeerstekens of het tijdelijk uitvoeren van maatregelen
      als bedoeld in de [artikelen 36][ref1] en [40][ref2] kan worden overgegaan indien:


      [ref1]: https://wetten.overheid.nl/BWBR0004826#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0004826#Artikel40
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0004826
        artikel: '36'
        hoofdstuk: II
        paragraaf: '8'
      - id: ref2
        bwb_id: BWBR0004826
        artikel: '40'
        hoofdstuk: II
        paragraaf: '8'
  - number: 41.a
    text: |-
      de omstandigheden als bedoeld in [artikel 34][ref1] zich niet of niet langer voordoen of


      [ref1]: https://wetten.overheid.nl/BWBR0004826#Artikel34
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0004826
        artikel: '34'
        hoofdstuk: II
        paragraaf: '8'
  - number: 41.b
    text: deze omstandigheden de plaatsing of de maatregel niet kunnen rechtvaardigen.
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel41
  - number: '48'
    text: |-
      Bij de vaststelling van de grenzen van de bebouwde kom of kommen als bedoeld in [artikel 20a][ref1] van de wet,
      zijn de [artikelen 23][ref2] en [24][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel20a
      [ref2]: https://wetten.overheid.nl/BWBR0004826#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0004826#Artikel24
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 20a
      - id: ref2
        bwb_id: BWBR0004826
        artikel: '23'
        hoofdstuk: II
        paragraaf: '6'
      - id: ref3
        bwb_id: BWBR0004826
        artikel: '24'
        hoofdstuk: II
        paragraaf: '6'
  - number: '49.1'
    text: |-
      Aan een gehandicapte kan, overeenkomstig de bij ministeriële regeling gestelde criteria, door het college van
      burgemeester en wethouders waar hij als ingezetene is ingeschreven in de basisadministratie persoonsgegevens, een
      gehandicaptenparkeerkaart worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel49
  - number: '49.2'
    text: |-
      Aan het bestuur van een instelling die is toegelaten op grond van
      [artikel 5, eerste lid, van de Wet toelating zorginstellingen][ref1] en die zorg verleent als bedoeld in
      [artikel 6 van de Algemene Wet Bijzondere Ziektekosten][ref2] kan, overeenkomstig de bij ministeriële regeling
      gestelde criteria, door het college van burgemeester en wethouders van de gemeente waar de instelling is gevestigd,
      een gehandicaptenparkeerkaart worden verstrekt ten behoeve van het vervoer van gehandicapten die in de betrokken
      instelling verblijven.


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0018906
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '6'
  - number: '49.3'
    text: |-
      Aan een gehandicapte die niet als ingezetene is ingeschreven in de basisadministratie persoonsgegevens van
      een gemeente kan, overeenkomstig de bij ministeriële regeling gestelde criteria, door Onze Minister een
      gehandicaptenparkeerkaart worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel49
  - number: '50'
    text: |-
      De houder van een gehandicaptenparkeerkaart laat van de kaart geen gebruik maken indien het parkeren niet
      rechtstreeks verband houdt met het vervoer van hemzelf, dan wel van het vervoer van gehandicapten die verblijven in
      de instelling waaraan de kaart is verstrekt.
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel50
  - number: '51.1'
    text: |-
      Behoudens het tweede en het derde lid is een gehandicaptenparkeerkaart geldig voor de duur van vijf
      achtereenvolgende jaren, gerekend vanaf de dag van afgifte.
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel51
  - number: '51.2'
    text: |-
      Indien redelijke grond bestaat voor de verwachting dat de termijn gedurende welke de gehandicapte in aanmerking
      komt voor een gehandicaptenparkeerkaart, korter zal zijn dan vijf jaren, beperkt het gezag dat bevoegd is tot de
      afgifte van gehandicaptenparkeerkaarten, de geldigheidsduur tot die termijn.
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel51
  - number: '51.3'
    text: |-
      Indien een gehandicaptenparkeerkaart wordt afgegeven aan een aanvrager die tijdelijk in Nederland verblijft,
      beperkt het gezag dat bevoegd is tot de afgifte van gehandicaptenparkeerkaarten, de geldigheidsduur van de kaart
      tot de termijn van verblijf van de aanvrager in Nederland.
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel51
  - number: '52.1'
    text: |-
      Het tot de afgifte van gehandicaptenparkeerkaarten bevoegde gezag geeft voor gehandicaptenparkeerkaarten die
      versleten of geheel of ten dele onleesbaar zijn, dan wel verloren zijn geraakt of teniet zijn gegaan, een duplicaat
      af.
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel52
  - number: '52.2'
    text: |-
      Indien de gehandicaptenparkeerkaart is versleten of geheel of ten dele onleesbaar is geworden, wordt een duplicaat
      slechts uitgereikt tegen inlevering van de versleten of geheel of ten dele onleesbare kaart.
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel52
  - number: '52.3'
    text: |-
      Indien de gehandicaptenparkeerkaart verloren is geraakt of teniet is gegaan, wordt een duplicaat slechts uitgereikt
      tegen overlegging van een door de aanvrager ondertekende verklaring, dat de kaart verloren is geraakt of teniet
      is gegaan. In de verklaring dienen de omstandigheden waaronder de kaart verloren geraakt of teniet gegaan is, te
      worden omschreven.
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel52
  - number: '53.1'
    text: 'Een gehandicaptenparkeerkaart verliest zijn geldigheid:'
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel53
  - number: 53.1.a
    text: door het verstrijken van de geldigheidsduur;
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel53
  - number: 53.1.b
    text: door afgifte van een nieuwe gehandicaptenparkeerkaart of een duplicaat gehandicaptenparkeerkaart;
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel53
  - number: 53.1.c
    text: door het onbevoegd daarin aanbrengen van wijzigingen;
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel53
  - number: 53.1.d
    text: door het overlijden van de houder;
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel53
  - number: 53.1.e
    text: door ongeldigverklaring.
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel53
  - number: '53.2'
    text: |-
      Het gezag dat de gehandicaptenparkeerkaart heeft afgegeven, verklaart de kaart ongeldig indien deze is afgegeven op
      grond van door de aanvrager verschafte onjuiste gegevens en de kaart niet zou zijn afgegeven indien de onjuistheid
      van die gegevens ten tijde van de aanvraag bekend zou zijn geweest.
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel53
  - number: '53.3'
    text: |-
      Het gezag dat de gehandicaptenparkeerkaart heeft afgegeven, kan de kaart ongeldig verklaren indien de houder van de
      kaart gebruik laat maken in strijd met [artikel 50][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004826#Artikel50
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0004826
        artikel: '50'
        hoofdstuk: IV
  - number: '54'
    text: |-
      Indien een gehandicaptenparkeerkaart zijn geldigheid heeft verloren, levert de gehandicapte aan wie de kaart is
      verstrekt of, indien deze is overleden, degene die de kaart onder zich heeft, de kaart zo spoedig mogelijk in bij
      het gezag dat de kaart heeft verstrekt.
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel54
  - number: '55.1'
    text: 'Bij ministeriële regeling worden voorschriften vastgesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel55
  - number: 55.1.a
    text: de bestelling van gehandicaptenparkeerkaarten;
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel55
  - number: 55.1.b
    text: de afgifte van gehandicaptenparkeerkaarten;
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel55
  - number: 55.1.c
    text: de wijze waarop een gehandicaptenparkeerkaart in een voertuig moet worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel55
  - number: '55.2'
    text: Het model van de gehandicaptenparkeerkaart wordt vastgesteld bij ministeriële regeling.
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel55
  - number: '56.1'
    text: 'Verkeersregelaars worden aangesteld door:'
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel56
  - number: 56.1.a
    text: Onze Minister, indien het gaat om
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel56
  - number: 56.1.a.1°
    text: transportbegeleiders, of
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel56
  - number: 56.1.a.2°
    text: |-
      verkeersregelaars met in het kader van het beroep verkeersregelende taken, voor zover deze taken in meerdere
      provincies op het grondgebied van meerdere niet aangrenzende gemeenten worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel56
  - number: 56.1.b
    text: de burgemeester van de gemeente waar de werkzaamheden worden verricht, in de overige gevallen.
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel56
  - number: '56.2'
    text: |-
      Verkeersregelaars met in het kader van het beroep verkeersregelende taken worden uitsluitend als zodanig aangesteld
      indien deze taken naar het oordeel van het tot aanstelling bevoegd gezag:
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel56
  - number: 56.2.a
    text: als hun hoofdwerkzaamheden worden beschouwd, of
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel56
  - number: 56.2.b
    text: geacht worden nauw verband te houden met de uitoefening van hun hoofdwerkzaamheden.
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel56
  - number: '56.3'
    text: |-
      Het in het eerste lid genoemde bestuursorgaan kan de door hem afgegeven aanstelling in de bij ministeriële regeling
      aangegeven gevallen intrekken.
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel56
  - number: '56.4'
    text: |-
      Verkeersbrigadiers als bedoeld in [artikel 82, derde lid, van het RVV 1990][ref1], worden aangesteld door de
      burgemeester.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel82
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '82'
  - number: '57'
    text: |-
      Op verkeersregelaars, personen als bedoeld in [artikel 82, eerste lid, onderdeel d, van het RVV 1990][ref1] en op
      verkeersbrigadiers wordt toezicht gehouden door de politie.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel82
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '82'
  - number: '58'
    text: 'Bij ministeriële regeling worden voorschriften vastgesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel58
  - number: 58.a
    text: |-
      de aanstelling, de verlenging van de aanstelling van verkeersregelaars, alsmede de aanstelling van
      verkeersbrigadiers;
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel58
  - number: 58.b
    text: het toezicht op verkeersregelaars en verkeersbrigadiers;
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel58
  - number: 58.c
    text: de opleiding van verkeersbrigadiers;
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel58
  - number: 58.d
    text: de opleiding en examinering van verkeersregelaars;
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel58
  - number: 58.e
    text: de plaatsen waar en de tijdstippen waarop verkeersregelaars en verkeersbrigadiers hun taken mogen uitoefenen;
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel58
  - number: 58.f
    text: de uitoefening van de bevoegdheden van verkeersregelaars en verkeersbrigadiers;
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel58
  - number: 58.g
    text: de aanstellingspas;
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel58
  - number: 58.h
    text: de gevallen waarin de aanstelling kan worden ingetrokken;
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel58
  - number: 58.i
    text: |-
      de uitrusting van verkeersregelaars en verkeersbrigadiers, alsmede de begeleidingsvoertuigen en de hulpmiddelen die
      daarin aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel58
  - number: 58a.1
    text: |-
      Transportbegeleiders maken tijdens de uitoefening van hun werkzaamheden gebruik van een begeleidingsvoertuig dat
      voldoet aan de in de ministeriële regeling, bedoeld in [artikel 58, onderdeel i][ref1], opgenomen eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0004826#Artikel58
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel58a
    references:
      - id: ref1
        bwb_id: BWBR0004826
        artikel: '58'
        hoofdstuk: V
  - number: 58a.2
    text: |-
      Verkeersregelaars dragen tijdens de uitoefening van hun werkzaamheden de kleding voorgeschreven in de ministeriële
      regeling, bedoeld in [artikel 58, onderdeel i][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004826#Artikel58
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel58a
    references:
      - id: ref1
        bwb_id: BWBR0004826
        artikel: '58'
        hoofdstuk: V
  - number: 58a.3
    text: |-
      Verkeersregelaars die krachtens de wet moeten beschikken over een aanstellingspas zijn verplicht dit document op
      eerste vordering van de in [artikel 159, eerste lid, onderdeel a, van de wet][ref1] genoemde personen ter inzage af
      te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel159
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel58a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '159'
  - number: 58a.4
    text: |-
      Aanwijzingen als bedoeld in [artikel 82, eerste lid, van het RVV 1990][ref1], worden voor zover het betreft
      verkeersregelaars niet zijnde weginspecteurs in dienst van Rijkswaterstaat, niet gegeven vanaf een motorrijtuig
      of, voorzover het betreft verkeersregelaars niet zijnde transportbegeleiders of weginspecteurs in dienst van
      Rijkswaterstaat, vanuit een motorrijtuig.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel82
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel58a
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '82'
  - number: 58a.5
    text: |-
      Onverminderd het vierde lid, geven transportbegeleiders of weginspecteurs in dienst van Rijkswaterstaat vanuit
      een motorrijtuig geen aanwijzingen als bedoeld in [artikel 82, eerste lid, van het RVV 1990][ref1], op wegen onder
      beheer van het Rijk of op kruispunten gelegen op andere wegen.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel82
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel58a
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '82'
  - number: '59'
    text: |-
      Overtreding van de [artikelen 1a][ref1], [2][ref2], [54][ref3] en
      [58a, eerste lid en derde tot en met vijfde lid][ref4] is een strafbaar feit.


      [ref1]: https://wetten.overheid.nl/BWBR0004826#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0004826#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0004826#Artikel54
      [ref4]: https://wetten.overheid.nl/BWBR0004826#Artikel58a
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0004826
        artikel: 1a
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0004826
        artikel: '2'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0004826
        artikel: '54'
        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0004826
        artikel: 58a
        hoofdstuk: V
  - number: '60.1'
    text: |-
      Onze Minister kan voor een wegvak in beheer bij het Rijk in het kader van een experiment een tijdelijk
      verkeersbesluit nemen voor toepassing van een variabele maximumsnelheid voor de duur van ten hoogste twee jaar.
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel60
  - number: '60.2'
    text: 'Met een experiment wordt beoogd inzicht te verkrijgen in:'
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel60
  - number: 60.2.a
    text: de verkeerskundige effecten;
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel60
  - number: 60.2.b
    text: de effecten op de geluidbelasting en luchtkwaliteit;
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel60
  - number: 60.2.c
    text: de effecten op de verkeersveiligheid, en
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel60
  - number: 60.2.d
    text: de effecten op de naleving van de maximumsnelheid;
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel60
  - number: 60a.1
    text: 'Het experimentverkeersbesluit bevat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel60a
  - number: 60a.1.a
    text: de duur van het experiment;
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel60a
  - number: 60a.1.b
    text: het wegvak of de wegvakken waarop het besluit van toepassing is;
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel60a
  - number: 60a.1.c
    text: ten minste één maximumsnelheid voor elk wegvak;
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel60a
  - number: 60a.1.d
    text: |-
      de werkwijze bij evaluatie van de effecten, bedoeld in [artikel 60, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004826#Artikel60
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel60a
    references:
      - id: ref1
        bwb_id: BWBR0004826
        artikel: '60'
        hoofdstuk: VII
  - number: 60a.2
    text: Voor een wegvak kan slechts eenmaal een experimentverkeersbesluit worden genomen.
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel60a
  - number: 60b.1
    text: 'Onze Minister kan bij het nemen, wijzigen of intrekken van een experimentverkeersbesluit afwijken van:'
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel60b
  - number: 60b.1.a
    text: |-
      de [artikelen 24][ref1], [25][ref2] en [27][ref3] van dit besluit;


      [ref1]: https://wetten.overheid.nl/BWBR0004826#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0004826#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0004826#Artikel27
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel60b
    references:
      - id: ref1
        bwb_id: BWBR0004826
        artikel: '24'
        hoofdstuk: II
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0004826
        artikel: '25'
        hoofdstuk: II
        paragraaf: '6'
      - id: ref3
        bwb_id: BWBR0004826
        artikel: '27'
        hoofdstuk: II
        paragraaf: '6'
  - number: 60b.1.b
    text: |-
      [hoofdstuk II, paragraaf 4 van de Uitvoeringsvoorschriften BABW inzake verkeerstekens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009104#Paragraaf4
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel60b
    references:
      - id: ref1
        bwb_id: BWBR0009104
        paragraaf: '4'
  - number: 60b.2
    text: |-
      [Artikel 20 van de wet][ref1] is bij het nemen van een experimentverkeersbesluit niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel20
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel60b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '20'
  - number: 60c.1
    text: |-
      Onze Minister kan tijdens de duur van het experiment de maximumsnelheid voor een wegvak of één of meer rijstroken
      binnen dat wegvak op verschillende tijdstippen van de dag aanpassen aan de omstandigheden.
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel60c
  - number: 60c.2
    text: |-
      Tot de omstandigheden die aanleiding kunnen vormen voor een aanpassing als bedoeld in het eerste lid, behoren in
      elk geval:
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel60c
  - number: 60c.2.a
    text: doorstroming van het verkeer;
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel60c
  - number: 60c.2.b
    text: weersomstandigheden;
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel60c
  - number: 60c.2.c
    text: onverwachte incidenten;
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel60c
  - number: 60c.2.d
    text: verkeersintensiteit.
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel60c
  - number: 60c.3
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld over de toepassing van het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel60c
  - number: 60d
    text: |-
      Onze Minister kan met het oog op het experiment de borden, bedoeld in [artikel 12][ref1], plaatsen of verwijderen
      tijdens de duur van het experiment.


      [ref1]: https://wetten.overheid.nl/BWBR0004826#Artikel12
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel60d
    references:
      - id: ref1
        bwb_id: BWBR0004826
        artikel: '12'
        hoofdstuk: II
        paragraaf: '4'
  - number: 60e.1
    text: |-
      Het experimentverkeersbesluit vervalt na afloop van de duur, bedoeld in [artikel 60a, eerste lid, onder a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004826#Artikel60a
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel60e
    references:
      - id: ref1
        bwb_id: BWBR0004826
        artikel: 60a
        hoofdstuk: VII
  - number: 60e.2
    text: |-
      Het verkeersbesluit zoals dat luidde tot het tijdstip waarop het experimentverkeersbesluit van kracht werd,
      herleeft met ingang van de datum waarop het experimentverkeersbesluit vervalt of wordt ingetrokken, tenzij een
      verkeersbesluit als bedoeld in [artikel 15, eerste lid, van de wet][ref1] met ingang van die datum in werking
      treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel15
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel60e
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '15'
  - number: 60f.1
    text: |-
      In bijzondere omstandigheden kan Onze Minister tijdens het experiment het experimentverkeersbesluit wijzigen of
      intrekken.
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel60f
  - number: 60f.2
    text: |-
      Onze Minister kan de duur van een experiment verlengen tot het moment dat een verkeersbesluit als bedoeld in
      [artikel 15, eerste lid, van de wet][ref1] in werking treedt indien:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel15
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel60f
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '15'
  - number: 60f.2.a
    text: |-
      Onze Minister het ontwerp van een verkeersbesluit als bedoeld in [artikel 15, eerste lid, van de wet][ref1] ter
      inzage heeft gelegd, en


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel15
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel60f
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '15'
  - number: 60f.2.b
    text: |-
      redelijkerwijze kan worden verwacht dat het verkeersbesluit niet in werking zal zijn getreden op het moment dat het
      experimentverkeersbesluit vervalt,
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel60f
  - number: 60g
    text: |-
      In afwijking van [artikel 27][ref1] treedt een experimentverkeersbesluit of een besluit tot wijziging of tot
      intrekking van een experimentverkeersbesluit in werking met ingang van de dag, nadat een termijn van twee weken na
      de dag waarop het besluit is bekendgemaakt, is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0004826#Artikel27
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel60g
    references:
      - id: ref1
        bwb_id: BWBR0004826
        artikel: '27'
        hoofdstuk: II
        paragraaf: '6'
  - number: '65'
    text: |-
      De artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel65
  - number: '66'
    text: Dit besluit kan worden aangehaald als "Besluit administratieve bepalingen inzake het wegverkeer" of als "BABW".
    url: https://wetten.overheid.nl/BWBR0004826/2013-01-01#Artikel66
