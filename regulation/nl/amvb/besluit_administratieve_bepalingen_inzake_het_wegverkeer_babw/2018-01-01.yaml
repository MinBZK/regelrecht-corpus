  - number: '44'
    text: |-
      1 Het bestuursorgaan dat tot een verkeersonderzoek of een spitsmijdenproject besluit is de verantwoordelijke voor
      de verwerking van de persoonsgegevens die gebruikt worden voor het verkeersonderzoek of het spitsmijdenproject.

      2 De verantwoordelijke draagt ervoor zorg dat een verkeersonderzoek of een spitsmijdenproject ten minste tien
      dagen voor de start van het gebruik van een technisch hulpmiddel op de weg wordt aangekondigd in ten minste een
      persbericht in een door de verantwoordelijke te selecteren landelijk of regionaal nieuwsblad.

      3 Het bevoegd gezag kan ten behoeve van een verkeersonderzoek of een spitsmijdenproject kentekengegevens verwerken
      met behulp van een technisch hulpmiddel.

      4 De verwerking van kentekengegevens met behulp van een technisch hulpmiddel ten behoeve van een spitsmijdenproject
      is slechts toegestaan als er sprake is van:

      a. groot onderhoud of renovatiewerkzaamheden;

      b. werkzaamheden tijdens aanleg of uitbreiding van infrastructuur, of

      c. concrete voorbereiding van de feitelijke werkzaamheden beschreven onder a of b.

      5 Gedurende de zomervakanties worden geen kentekengegevens geregistreerd ten behoeve van spitsmijdenprojecten.
    url: https://wetten.overheid.nl/BWBR0004826/2018-01-01#Artikel44
  - number: '45'
    text: |-
      1 De verantwoordelijke draagt ervoor zorg dat kentekenhouders:

      a) na de in [artikel 44, tweede lid][ref1], genoemde aankondiging van een verkeersonderzoek binnen vier weken na
      de verwerking van persoonsgegevens met een technisch hulpmiddel schriftelijk worden uitgenodigd tot deelname aan
      het onderzoek;

      b) na de in [artikel 44, tweede lid][ref2], genoemde aankondiging van een spitsmijdenproject binnen twaalf weken
      na de verwerking van persoonsgegevens met een technisch hulpmiddel schriftelijk worden uitgenodigd tot deelname aan
      het project.

      2 De in het eerste lid, onder a en b, genoemde termijnen worden verlengd met de duur van binnen die termijn
      begonnen schoolvakanties.

      3 Indien een in het eerste lid genoemde termijn, na verlenging met toepassing van het tweede lid, wordt
      overschreden, dan worden de desbetreffende persoonsgegevens, onverminderd de gevallen als bedoeld in
      [artikel 47][ref3], direct vernietigd.


      [ref1]: https://wetten.overheid.nl/BWBR0004826#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0004826#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0004826#Artikel47
    url: https://wetten.overheid.nl/BWBR0004826/2018-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0004826
        artikel: '44'
        hoofdstuk: IIb
      - id: ref2
        bwb_id: BWBR0004826
        artikel: '44'
        hoofdstuk: IIb
      - id: ref3
        bwb_id: BWBR0004826
        artikel: '47'
        hoofdstuk: IIb
  - number: '46'
    text: |-
      1 De verantwoordelijke verstrekt kentekengegevens die voortkomen uit een verkeersonderzoek of een
      spitsmijdenproject niet dan na een daartoe strekkend verzoek, behoudens in het geval genoemd onder a, aan:

      a. de bewerker met wie een bewerkersovereenkomst is afgesloten, voor zover die overeenkomst in de verstrekking van
      gegevens voorziet;

      b. de kentekenhouder voor zover het gegevens betreft die op hem betrekking hebben;

      c. een verzekeraar als bedoeld in [artikel 1:1, van de Wet op het financieel toezicht][ref1], indien deze
      verzekeraar aannemelijk maakt dat deze gegevens noodzakelijk zijn voor het behartigen van de belangen van de bij
      hem verzekerde, voor zover het gaat om de kentekengegevens van deze verzekerde en nadat deze verzekerde daarvoor
      toestemming heeft verleend;

      d. een advocaat indien deze aannemelijk maakt dat deze gegevens noodzakelijk zijn voor het behartigen van de
      belangen van zijn cliënt en voor zover het gaat om de kentekengegevens van zijn cliënt nadat deze cliënt daarvoor
      toestemming heeft verleend.

      2 Een verzoek om verstrekking van gegevens wordt schriftelijk ingediend door degene, bedoeld in het eerste lid,
      onder b tot en met d, die de gegevens wenst te ontvangen.

      3 Bij het verstrekken van persoonsgegevens worden gegevens van andere personen geanonimiseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel11
    url: https://wetten.overheid.nl/BWBR0004826/2018-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 1:1
  - number: '47'
    text: |-
      Kentekengegevens die zijn verkregen met behulp van een technisch hulpmiddel worden:

      a. bij een verkeersonderzoek waarbij individuele deelname van de kentekenhouder niet nodig is, direct
      geanonimiseerd of gepseudonimiseerd;

      b. indien bij de selectie van kentekengegevens voor de uitnodiging voor een verkeersonderzoek of een
      spitsmijdenproject blijkt dat de kentekenhouder niet voldoende frequent op het betreffende wegvak wordt
      gesignaleerd voor een uitnodiging direct vernietigd;

      c. indien bij de selectie van kentekengegevens voor de uitnodiging voor spitsmijdenproject blijkt dat de
      kentekenhouder eerder heeft aangegeven niet benaderd te willen worden voor deze projecten direct vernietigd;

      d. indien de kentekenhouder laat blijken niet te willen deelnemen aan het verkeersonderzoek of het
      spitsmijdenproject direct nadat hij dit kenbaar heeft gemaakt vernietigd;

      e. indien de kentekenhouder binnen drie weken na daartoe schriftelijk te zijn uitgenodigd niet reageert op een
      uitnodiging tot deelname aan een verkeersonderzoek of spitsmijdenproject na het verstrijken van die periode direct
      vernietigd;

      f. indien de kentekenhouder heeft ingestemd met deelname aan het verkeersonderzoek of het spitsmijdenproject, niet
      langer bewaard dan vier weken na beëindiging van het verkeersonderzoek of spitsmijdenproject en uiterlijk aan het
      einde van die termijn geanonimiseerd of vernietigd.
    url: https://wetten.overheid.nl/BWBR0004826/2018-01-01#Artikel47
  - number: '48'
    text: |-
      Bij de vaststelling van de grenzen van de bebouwde kom of kommen als bedoeld in [artikel 20a][ref1] van de wet,
      zijn de [artikelen 23][ref2] en [24][ref3] van overeenkomstige toepassing.


