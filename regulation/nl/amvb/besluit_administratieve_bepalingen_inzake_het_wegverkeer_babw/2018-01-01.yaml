      - id: ref2
        bwb_id: BWBR0004825
  - number: '12'
    text: |-
      De plaatsing of verwijdering van de hierna genoemde verkeerstekens moet geschieden krachtens een verkeersbesluit:

      a. de volgende borden:

      I de borden die zijn opgenomen in de hoofdstukken A tot en met G van [bijlage 1, behorende bij het RVV 1990][ref1],
      uitgezonderd de borden C22 en E9, alsmede de borden E4, E12 en E13 tenzij onder deze verkeersborden een onderbord
      als bedoeld in artikel 8, tweede lid, onderdeel d, wordt aangebracht, dan wel toepassing wordt gegeven aan artikel
      8, derde lid;

      II bord L3 van [bijlage 1, behorende bij het RVV 1990][ref2], voor zover het een bushalte betreft;

      b. de volgende verkeerstekens op het wegdek:

      I. doorgetrokken strepen;

      II. de aanduiding van fietsstroken;

      III. de aanduiding van busstroken en busbanen;

      IV. voetgangersoversteekplaatsen;

      V. gele doorgetrokken strepen;

      VI. gele onderbroken strepen;

      VII. haaietanden.


      [ref1]: https://wetten.overheid.nl/BWBR0004825
      [ref2]: https://wetten.overheid.nl/BWBR0004825
    url: https://wetten.overheid.nl/BWBR0004826/2018-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004825
      - id: ref2
        bwb_id: BWBR0004825
  - number: '13'
    text: |-
      In het verkeersbesluit tot plaatsing van borden die de snelheid, het parkeren of geslotenverklaringen betreffen
      alsmede van bord G7 kan worden bepaald, dat de door deze borden aangeduide geboden of verboden gelden in een
      bepaald gebied.
    url: https://wetten.overheid.nl/BWBR0004826/2018-01-01#Artikel13
  - number: '14'
    text: |-
      Indien onder de in deze paragraaf genoemde verkeersborden onderborden worden geplaatst als bedoeld in
      [artikel 8, tweede lid][ref1], of toepassing wordt gegeven aan [artikel 8, derde lid][ref2], wordt zulks in het
      betrokken verkeersbesluit tot uitdrukking gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0004826#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004826#Artikel8
    url: https://wetten.overheid.nl/BWBR0004826/2018-01-01#Artikel14
