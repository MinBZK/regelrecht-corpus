        hoofdstuk: II
        paragraaf: '2'
  - number: '15'
    text: |-
      In het verkeersbesluit tot plaatsing van bord A1, voorzover dit aanduidt dat een maximumsnelheid van 30 km/h of 60
      km/h geldt, bord B3, B4, B5 of B6 op een 30 km/h- of 60 km/h weg of in een 30 km/h- of 60 km/hzone, en bord G5
      van [bijlage 1, behorende bij het RVV 1990][ref1], wordt aangegeven op welke wijze wordt voldaan aan de krachtens
      [artikel 14 van de wet][ref2] gestelde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0004825
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel14
    url: https://wetten.overheid.nl/BWBR0004826/2018-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004825
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '14'
  - number: '16'
    text: |-
      Geen verkeersbesluit behoeft te worden genomen indien het betrokken verkeersteken wordt geplaatst of verwijderd
      ter nadere aanduiding dat een verkeersregel van toepassing is dan wel dat een ander verkeersteken dat een gebod of
      verbod inhoudt is geplaatst.
    url: https://wetten.overheid.nl/BWBR0004826/2018-01-01#Artikel16
  - number: '18'
    text: In het verkeersbesluit worden de aard en de omvang van de maatregelen aangegeven.
    url: https://wetten.overheid.nl/BWBR0004826/2018-01-01#Artikel18
  - number: '19'
    text: |-
      Geen verkeersbesluit behoeft te worden genomen, indien de betrokken maatregel strekt tot ondersteuning van een
      verkeersregel of een aldaar geplaatst verkeersteken dat een gebod of verbod inhoudt.
    url: https://wetten.overheid.nl/BWBR0004826/2018-01-01#Artikel19
  - number: '21'
    text: |-
      De motivering van het verkeersbesluit vermeldt in ieder geval welke doelstelling of doelstellingen met het
      verkeersbesluit worden beoogd. Daarbij wordt aangegeven welke van de in [artikel 2, eerste en tweede lid][ref1],
      van de wet genoemde belangen ten grondslag liggen aan het verkeersbesluit. Indien tevens andere van de in
      [artikel 2, eerste en tweede lid][ref2], van de wet genoemde belangen in het geding zijn, wordt voorts aangegeven
      op welke wijze de belangen tegen elkaar zijn afgewogen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel2
    url: https://wetten.overheid.nl/BWBR0004826/2018-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '2'
  - number: '23'
    text: |-
      Het openbaar lichaam dat het beheer heeft over de weg of, indien geen openbaar lichaam het beheer heeft, de
      eigenaar van de weg wordt met betrekking tot verkeersbesluiten gehoord.
    url: https://wetten.overheid.nl/BWBR0004826/2018-01-01#Artikel23
  - number: '24'
    text: |-
      Verkeersbesluiten worden genomen na overleg met:

      a. de korpschef,

      b. de commandant van de Koninklijke marechaussee, indien de taak ten aanzien van het verkeer mede wordt vervuld op
      een luchtvaartterrein als bedoeld in [artikel 4, eerste lid, onder c, van de Politiewet 2012][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel4
    url: https://wetten.overheid.nl/BWBR0004826/2018-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '4'
  - number: '25'
    text: |-
      1 Verkeersbesluiten als gevolg waarvan het verkeer op wegen anders dan die waarop het verkeersbesluit betrekking
      heeft rechtstreeks en ingrijpend wordt beïnvloed, worden genomen na overleg met het ten aanzien van die andere
      wegen bevoegd gezag.

      2 Verkeersbesluiten worden genomen na overleg met de betrokken spoorwegbeheerder, indien het besluit maatregelen
      betreft nabij een overweg als bedoeld in [artikel 1, onderdeel aab, van het RVV 1990][ref1] , waardoor het verkeer
      over die overweg wordt beïnvloed.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel1
    url: https://wetten.overheid.nl/BWBR0004826/2018-01-01#Artikel25
    references:
