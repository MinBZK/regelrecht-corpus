        artikel: '54'
        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0004826
        artikel: 58a
        hoofdstuk: V
  - number: '60'
    text: |-
      1 Onze Minister kan voor een wegvak in beheer bij het Rijk in het kader van een experiment een tijdelijk
      verkeersbesluit nemen voor toepassing van een variabele maximumsnelheid voor de duur van ten hoogste twee jaar.

      2 Met een experiment wordt beoogd inzicht te verkrijgen in:

      a. de verkeerskundige effecten;

      b. de effecten op de geluidbelasting en luchtkwaliteit;

      c. de effecten op de verkeersveiligheid, en

      d. de effecten op de naleving van de maximumsnelheid;

      bij toepassing van een variabele maximumsnelheid of bij het aanpassen van de maximumsnelheid aan de omstandigheden,
      bedoeld in [artikel 60c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004826#Artikel60c
    url: https://wetten.overheid.nl/BWBR0004826/2018-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0004826
        artikel: 60c
        hoofdstuk: VII
  - number: 60a
    text: |-
      1 Het experimentverkeersbesluit bevat in elk geval:

      a. de duur van het experiment;

      b. het wegvak of de wegvakken waarop het besluit van toepassing is;

      c. ten minste één maximumsnelheid voor elk wegvak;

      d. de werkwijze bij evaluatie van de effecten, bedoeld in [artikel 60, tweede lid][ref1].

      2 Voor een wegvak kan slechts eenmaal een experimentverkeersbesluit worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004826#Artikel60
    url: https://wetten.overheid.nl/BWBR0004826/2018-01-01#Artikel60a
    references:
      - id: ref1
        bwb_id: BWBR0004826
        artikel: '60'
        hoofdstuk: VII
  - number: 60b
    text: |-
      1 Onze Minister kan bij het nemen, wijzigen of intrekken van een experimentverkeersbesluit afwijken van:

      a. de [artikelen 24][ref1], [25][ref2] en [27][ref3] van dit besluit;

      b. [hoofdstuk II, paragraaf 4 van de Uitvoeringsvoorschriften BABW inzake verkeerstekens][ref4].

      2 [Artikel 20 van de wet][ref5] is bij het nemen van een experimentverkeersbesluit niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004826#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0004826#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0004826#Artikel27
      [ref4]: https://wetten.overheid.nl/BWBR0009104#Paragraaf4
      [ref5]: https://wetten.overheid.nl/BWBR0006622#Artikel20
    url: https://wetten.overheid.nl/BWBR0004826/2018-01-01#Artikel60b
    references:
      - id: ref1
        bwb_id: BWBR0004826
        artikel: '24'
        hoofdstuk: II
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0004826
        artikel: '25'
        hoofdstuk: II
        paragraaf: '6'
      - id: ref3
        bwb_id: BWBR0004826
        artikel: '27'
        hoofdstuk: II
        paragraaf: '6'
      - id: ref4
        bwb_id: BWBR0009104
        paragraaf: '4'
      - id: ref5
        bwb_id: BWBR0006622
        artikel: '20'
  - number: 60c
    text: |-
      1 Onze Minister kan tijdens de duur van het experiment de maximumsnelheid voor een wegvak of één of meer rijstroken
      binnen dat wegvak op verschillende tijdstippen van de dag aanpassen aan de omstandigheden.

      2 Tot de omstandigheden die aanleiding kunnen vormen voor een aanpassing als bedoeld in het eerste lid, behoren in
      elk geval:

      a. doorstroming van het verkeer;

      b. weersomstandigheden;

      c. onverwachte incidenten;

      d. verkeersintensiteit.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld over de toepassing van het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0004826/2018-01-01#Artikel60c
  - number: 60d
    text: |-
      Onze Minister kan met het oog op het experiment de borden, bedoeld in [artikel 12][ref1], plaatsen of verwijderen
      tijdens de duur van het experiment.


      [ref1]: https://wetten.overheid.nl/BWBR0004826#Artikel12
    url: https://wetten.overheid.nl/BWBR0004826/2018-01-01#Artikel60d
    references:
      - id: ref1
        bwb_id: BWBR0004826
        artikel: '12'
        hoofdstuk: II
        paragraaf: '4'
  - number: 60e
    text: |-
      1 Het experimentverkeersbesluit vervalt na afloop van de duur, bedoeld in [artikel 60a, eerste lid, onder a][ref1].

      2 Het verkeersbesluit zoals dat luidde tot het tijdstip waarop het experimentverkeersbesluit van kracht werd,
      herleeft met ingang van de datum waarop het experimentverkeersbesluit vervalt of wordt ingetrokken, tenzij een
      verkeersbesluit als bedoeld in [artikel 15, eerste lid, van de wet][ref2] met ingang van die datum in werking
      treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0004826#Artikel60a
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel15
    url: https://wetten.overheid.nl/BWBR0004826/2018-01-01#Artikel60e
    references:
      - id: ref1
        bwb_id: BWBR0004826
        artikel: 60a
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '15'
  - number: 60f
    text: |-
      1 In bijzondere omstandigheden kan Onze Minister tijdens het experiment het experimentverkeersbesluit wijzigen
      of intrekken.

      2 Onze Minister kan de duur van een experiment verlengen tot het moment dat een verkeersbesluit als bedoeld in
      [artikel 15, eerste lid, van de wet][ref1] in werking treedt indien:

      a. Onze Minister het ontwerp van een verkeersbesluit als bedoeld in [artikel 15, eerste lid, van de wet][ref2] ter
      inzage heeft gelegd, en

      b. redelijkerwijze kan worden verwacht dat het verkeersbesluit niet in werking zal zijn getreden op het moment dat
      het experimentverkeersbesluit vervalt,

      met dien verstande dat de totale duur niet de termijn van twee jaar, genoemd in [artikel 60, eerste lid][ref3],
      overschrijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0004826#Artikel60
    url: https://wetten.overheid.nl/BWBR0004826/2018-01-01#Artikel60f
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '15'
      - id: ref3
        bwb_id: BWBR0004826
        artikel: '60'
        hoofdstuk: VII
  - number: 60g
    text: |-
      In afwijking van [artikel 27][ref1] treedt een experimentverkeersbesluit of een besluit tot wijziging of tot
      intrekking van een experimentverkeersbesluit in werking met ingang van de dag, nadat een termijn van twee weken na
      de dag waarop het besluit is bekendgemaakt, is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0004826#Artikel27
    url: https://wetten.overheid.nl/BWBR0004826/2018-01-01#Artikel60g
    references:
      - id: ref1
        bwb_id: BWBR0004826
        artikel: '27'
        hoofdstuk: II
        paragraaf: '6'
  - number: '65'
    text: |-
      De artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0004826/2018-01-01#Artikel65
  - number: '66'
    text: Dit besluit kan worden aangehaald als "Besluit administratieve bepalingen inzake het wegverkeer" of als "BABW".
    url: https://wetten.overheid.nl/BWBR0004826/2018-01-01#Artikel66
