  - number: '49'
    text: |-
      1 Aan een gehandicapte kan, overeenkomstig de bij ministeriële regeling gestelde criteria, door het college
      van burgemeester en wethouders van de gemeente waar hij als ingezetene met een adres is ingeschreven in de
      basisregistratie personen, een gehandicaptenparkeerkaart worden verstrekt.

      2 Aan het bestuur van een instelling die is toegelaten op grond van
      [artikel 5, eerste lid, van de Wet toelating zorginstellingen][ref1] en die zorg verleent als bedoeld in
      [artikel 3.1.1 van de Wet langdurige zorg][ref2] kan, overeenkomstig de bij ministeriële regeling gestelde
      criteria, door het college van burgemeester en wethouders van de gemeente waar de instelling is gevestigd, een
      gehandicaptenparkeerkaart worden verstrekt ten behoeve van het vervoer van gehandicapten die in de betrokken
      instelling verblijven.

      3 Aan een gehandicapte die niet als ingezetene is ingeschreven in de basisregistratie personen kan, overeenkomstig
      de bij ministeriële regeling gestelde criteria, door het CBR een gehandicaptenparkeerkaart worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0035917#Artikel3.1.1
    url: https://wetten.overheid.nl/BWBR0004826/2018-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0018906
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0035917
        artikel: 3.1.1
  - number: '50'
    text: |-
      De houder van een gehandicaptenparkeerkaart laat van de kaart geen gebruik maken indien het parkeren niet
      rechtstreeks verband houdt met het vervoer van hemzelf, dan wel van het vervoer van gehandicapten die verblijven in
      de instelling waaraan de kaart is verstrekt.
    url: https://wetten.overheid.nl/BWBR0004826/2018-01-01#Artikel50
  - number: '51'
    text: |-
      1 Behoudens het tweede en het derde lid is een gehandicaptenparkeerkaart geldig voor de duur van vijf
      achtereenvolgende jaren, gerekend vanaf de dag van afgifte.

      2 Indien redelijke grond bestaat voor de verwachting dat de termijn gedurende welke de gehandicapte in aanmerking
      komt voor een gehandicaptenparkeerkaart, korter zal zijn dan vijf jaren, beperkt het gezag dat bevoegd is tot de
      afgifte van gehandicaptenparkeerkaarten, de geldigheidsduur tot die termijn.

      3 Indien een gehandicaptenparkeerkaart wordt afgegeven aan een aanvrager die tijdelijk in Nederland verblijft,
      beperkt het gezag dat bevoegd is tot de afgifte van gehandicaptenparkeerkaarten, de geldigheidsduur van de kaart
      tot de termijn van verblijf van de aanvrager in Nederland.
    url: https://wetten.overheid.nl/BWBR0004826/2018-01-01#Artikel51
  - number: '52'
    text: |-
      1 Het tot de afgifte van gehandicaptenparkeerkaarten bevoegde gezag geeft voor gehandicaptenparkeerkaarten die
      versleten of geheel of ten dele onleesbaar zijn, dan wel verloren zijn geraakt of teniet zijn gegaan, een duplicaat
      af.

      2 Indien de gehandicaptenparkeerkaart is versleten of geheel of ten dele onleesbaar is geworden, wordt een
      duplicaat slechts uitgereikt tegen inlevering van de versleten of geheel of ten dele onleesbare kaart.

      3 Indien de gehandicaptenparkeerkaart verloren is geraakt of teniet is gegaan, wordt een duplicaat slechts
      uitgereikt tegen overlegging van een door de aanvrager ondertekende verklaring, dat de kaart verloren is geraakt
      of teniet is gegaan. In de verklaring dienen de omstandigheden waaronder de kaart verloren geraakt of teniet gegaan
      is, te worden omschreven.
    url: https://wetten.overheid.nl/BWBR0004826/2018-01-01#Artikel52
  - number: '53'
    text: |-
      1 Een gehandicaptenparkeerkaart verliest zijn geldigheid:

      a. door het verstrijken van de geldigheidsduur;

      b. door afgifte van een nieuwe gehandicaptenparkeerkaart of een duplicaat gehandicaptenparkeerkaart;

      c. door het onbevoegd daarin aanbrengen van wijzigingen;

      d. door het overlijden van de houder;

      e. door ongeldigverklaring.

      2 Het gezag dat de gehandicaptenparkeerkaart heeft afgegeven, verklaart de kaart ongeldig indien deze is afgegeven
      op grond van door de aanvrager verschafte onjuiste gegevens en de kaart niet zou zijn afgegeven indien de
      onjuistheid van die gegevens ten tijde van de aanvraag bekend zou zijn geweest.

      3 Het gezag dat de gehandicaptenparkeerkaart heeft afgegeven, kan de kaart ongeldig verklaren indien de houder van
      de kaart gebruik laat maken in strijd met [artikel 50][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004826#Artikel50
    url: https://wetten.overheid.nl/BWBR0004826/2018-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0004826
        artikel: '50'
        hoofdstuk: IV
  - number: '54'
    text: |-
      Indien een gehandicaptenparkeerkaart zijn geldigheid heeft verloren, levert de gehandicapte aan wie de kaart is
      verstrekt of, indien deze is overleden, degene die de kaart onder zich heeft, de kaart zo spoedig mogelijk in bij
      het gezag dat de kaart heeft verstrekt.
    url: https://wetten.overheid.nl/BWBR0004826/2018-01-01#Artikel54
  - number: '55'
    text: |-
      1 Bij ministeriële regeling worden voorschriften vastgesteld omtrent:

      a. de bestelling van gehandicaptenparkeerkaarten;

      b. de afgifte van gehandicaptenparkeerkaarten;

      c. de wijze waarop een gehandicaptenparkeerkaart in een voertuig moet worden aangebracht.

      2 Het model van de gehandicaptenparkeerkaart wordt vastgesteld bij ministeriële regeling.
    url: https://wetten.overheid.nl/BWBR0004826/2018-01-01#Artikel55
  - number: '56'
    text: |-
      1 Verkeersregelaars worden aangesteld door:

      a. Onze Minister, indien het gaat om

      1°. transportbegeleiders, of

      2°. verkeersregelaars met in het kader van het beroep verkeersregelende taken, voor zover deze taken in meerdere
      provincies op het grondgebied van meerdere niet aangrenzende gemeenten worden uitgevoerd.

      b. de burgemeester van de gemeente waar de werkzaamheden worden verricht, in de overige gevallen.

      2 Verkeersregelaars met in het kader van het beroep verkeersregelende taken worden uitsluitend als zodanig
      aangesteld indien deze taken naar het oordeel van het tot aanstelling bevoegd gezag:

      a. als hun hoofdwerkzaamheden worden beschouwd, of

      b. geacht worden nauw verband te houden met de uitoefening van hun hoofdwerkzaamheden.

      3 Het in het eerste lid genoemde bestuursorgaan kan de door hem afgegeven aanstelling in de bij ministeriële
      regeling aangegeven gevallen intrekken.

      4 Verkeersbrigadiers als bedoeld in [artikel 82, derde lid, van het RVV 1990][ref1], worden aangesteld door de
      burgemeester.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel82
    url: https://wetten.overheid.nl/BWBR0004826/2018-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '82'
  - number: '57'
    text: |-
      Op verkeersregelaars, personen als bedoeld in [artikel 82, eerste lid, onderdeel d, van het RVV 1990][ref1] en op
      verkeersbrigadiers wordt toezicht gehouden door de politie.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel82
    url: https://wetten.overheid.nl/BWBR0004826/2018-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '82'
  - number: '58'
    text: |-
      Bij ministeriële regeling worden voorschriften vastgesteld omtrent:

      a. de aanstelling, de verlenging van de aanstelling van verkeersregelaars, alsmede de aanstelling van
      verkeersbrigadiers;

      b. het toezicht op verkeersregelaars en verkeersbrigadiers;

      c. de opleiding van verkeersbrigadiers;

      d. de opleiding en examinering van verkeersregelaars;

      e. de plaatsen waar en de tijdstippen waarop verkeersregelaars en verkeersbrigadiers hun taken mogen uitoefenen;

      f. de uitoefening van de bevoegdheden van verkeersregelaars en verkeersbrigadiers;

      g. de aanstellingspas;

      h. de gevallen waarin de aanstelling kan worden ingetrokken;

      i. de uitrusting van verkeersregelaars en verkeersbrigadiers, alsmede de begeleidingsvoertuigen en de hulpmiddelen
      die daarin aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0004826/2018-01-01#Artikel58
  - number: 58a
    text: |-
      1 Transportbegeleiders maken tijdens de uitoefening van hun werkzaamheden gebruik van een begeleidingsvoertuig dat
      voldoet aan de in de ministeriële regeling, bedoeld in [artikel 58, onderdeel i][ref1], opgenomen eisen.

      2 Verkeersregelaars dragen tijdens de uitoefening van hun werkzaamheden de kleding voorgeschreven in de
      ministeriële regeling, bedoeld in [artikel 58, onderdeel i][ref2].

      3 Verkeersregelaars die krachtens de wet moeten beschikken over een aanstellingspas zijn verplicht dit document op
      eerste vordering van de in [artikel 159, eerste lid, onderdeel a, van de wet][ref3] genoemde personen ter inzage af
      te geven.

      4 Aanwijzingen als bedoeld in [artikel 82, eerste lid, van het RVV 1990][ref4], worden voor zover het betreft
      verkeersregelaars niet zijnde weginspecteurs in dienst van Rijkswaterstaat, niet gegeven vanaf een motorrijtuig
      of, voorzover het betreft verkeersregelaars niet zijnde transportbegeleiders of weginspecteurs in dienst van
      Rijkswaterstaat, vanuit een motorrijtuig.

      5 Onverminderd het vierde lid, geven transportbegeleiders of weginspecteurs in dienst van Rijkswaterstaat vanuit
      een motorrijtuig geen aanwijzingen als bedoeld in [artikel 82, eerste lid, van het RVV 1990][ref5], op wegen onder
      beheer van het Rijk of op kruispunten gelegen op andere wegen.


      [ref1]: https://wetten.overheid.nl/BWBR0004826#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0004826#Artikel58
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel159
      [ref4]: https://wetten.overheid.nl/BWBR0004825#Artikel82
      [ref5]: https://wetten.overheid.nl/BWBR0004825#Artikel82
    url: https://wetten.overheid.nl/BWBR0004826/2018-01-01#Artikel58a
    references:
      - id: ref1
        bwb_id: BWBR0004826
        artikel: '58'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004826
        artikel: '58'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '159'
      - id: ref4
        bwb_id: BWBR0004825
        artikel: '82'
      - id: ref5
        bwb_id: BWBR0004825
        artikel: '82'
  - number: '59'
    text: |-
      Overtreding van de [artikelen 1a][ref1], [2][ref2], [54][ref3] en
      [58a, eerste lid en derde tot en met vijfde lid][ref4] is een strafbaar feit.


      [ref1]: https://wetten.overheid.nl/BWBR0004826#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0004826#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0004826#Artikel54
      [ref4]: https://wetten.overheid.nl/BWBR0004826#Artikel58a
    url: https://wetten.overheid.nl/BWBR0004826/2018-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0004826
        artikel: 1a
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0004826
        artikel: '2'
        hoofdstuk: I
      - id: ref3
