bwb_id: BWBR0009069
url: https://wetten.overheid.nl/BWBR0009069/1998-10-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Economische Zaken van 25 juli 1997, nr. 97047372 WJA/W;

    Gelet op de artikelen 6, 9, 10, 11, 13, 16 en 18 van de IJkwet;

    De Raad van State gehoord (advies van 12 augustus 1997, nr. W10.97.0499);

    Gezien het nader rapport van Onze Minister van Economische Zaken van 26 november 1997, nr. 97070623 WJA/W;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Maten, gewichten, meet- en weegwerktuigen moeten behoren tot een van [de navolgende onder][ref1] A-E onderscheiden
      categorieën:


      [ref1]: https://wetten.overheid.nl/BWBR0009069#Artikel1
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009069
        artikel: '1'
        paragraaf: '1'
  - number: 1.A
    text: 'Lengtematen:'
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel1
  - number: 1.A.a
    text: de lengtematen van 0,5, 1, 1,5, 2, 3, 4, 5 of een geheel veelvoud van 5 meter;
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel1
  - number: 1.A.a.1
    text: de meetsjablonen voor flessen met een inhoudsaanduiding;
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel1
  - number: 1.A.b
    text: |-
      andere lengtematen dan de onder a en a.1 genoemde, voor zover deze aantoonbare voordelen hebben ten opzichte van
      die maten, dan wel bestemd zijn voor doeleinden, waarvoor die maten niet toereikend zijn.
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel1
  - number: 1.B
    text: 'Inhoudsmaten:'
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel1
  - number: 1.B.a
    text: de cilindrische maten van 0,01, 0,02, 0,05, 0,1, 0,2, 0,5, 1, 2, 5, 10, 20 en 50 liter;
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel1
  - number: 1.B.b
    text: de glazen maten van 2000, 1000, 500, 250, 100, 50, 25, 10 en 5 milliliter;
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel1
  - number: 1.B.c
    text: de drinkglazen, bekers, kruiken, flessen, karaffen en het vaatwerk, voorzien van een inhoudsaanduiding;
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel1
  - number: 1.B.d
    text: |-
      andere inhoudsmaten dan de onder a-c genoemde, voor zover deze aantoonbare voordelen hebben ten opzichte van die
      maten, dan wel bestemd zijn voor doeleinden, waarvoor die maten niet toereikend zijn.
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel1
  - number: 1.C
    text: 'Gewichten:'
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel1
  - number: 1.C.a
    text: de gewichten voor gewone weging van 50, 25, 20, 10, 5, 2 en 1 kilogram, 500, 200, 100, 50, 20, 10, 5, 2 en 1 gram;
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel1
  - number: 1.C.b
    text: |-
      de gewichten voor fijne weging van 25, 20, 10, 5, 2 en 1 kilogram, 500, 200, 100, 50, 20, 10, 5, 2 en 1 gram, 1000,
      500, 200, 100, 50, 20, 10, 5, 2 en 1 milligram;
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel1
  - number: 1.C.c
    text: |-
      andere gewichten dan de onder a en b genoemde, voor zover deze aantoonbare voordelen hebben ten opzichte van die
      gewichten, dan wel bestemd zijn voor doeleinden, waarvoor die gewichten niet toereikend zijn.
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel1
  - number: 1.D
    text: 'Meetwerktuigen:'
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel1
  - number: 1.D.a
    text: de meetwerktuigen voor lengtemeting;
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel1
  - number: 1.D.b
    text: de taxameters;
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel1
  - number: 1.D.c
    text: de meetwerktuigen voor oppervlaktemeting;
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel1
  - number: 1.D.d
    text: de melkmeetemmers van 30 en 20 liter, niet voorzien van een aftap- of afloopinrichting;
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel1
  - number: 1.D.e
    text: de gasmeters;
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel1
  - number: 1.D.f
    text: 'andere meetwerktuigen voor volumemeting dan onder d en e bedoeld, een en ander met uitzondering van:'
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel1
  - number: 1.D.f.1°
    text: |-
      de meetwerktuigen voor meting van de lengte van personen, in hoofdzaak bestaande uit een voetstuk, een geleidebalk
      met schaalverdeling en een langs die balk verplaatsbaar schuifstuk (militiematen);
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel1
  - number: 1.D.f.2°
    text: |-
      de meetwerktuigen voor meting van de diepgang van schepen, in hoofdzaak bestaande uit een glazen buis met
      schaalverdeling, bevestigd aan een inrichting met twee, door doken bepaalde vaste punten, met behulp waarvan de
      afstanden tussen een in de buis ontstane waterspiegel en elk van die twee punten kunnen worden gemeten (toestel
      voor meting van de diepgang van schepen);
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel1
  - number: 1.D.f.3°
    text: |-
      de meetwerktuigen voor volumemeting van vloeistoffen, in hoofdzaak bestaande uit een maatglas met schaalverdeling
      en een aan het benedeneinde van dat glas verbonden kraan (kraanmaten);
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel1
  - number: 1.D.f.4°
    text: |-
      de meetwerktuigen voor volumemeting van vloeistoffen, wat betreft het voor de meting bestemde gedeelte in hoofdzaak
      bestaande uit een in twee gelijke delen verdeelde holle plug en een daarbij behorend huis met vul- en aftapopening
      (meetkranen);
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel1
  - number: 1.D.f.5°
    text: de meetwerktuigen voor volumemeting van een verbruikte of geleverde hoeveelheid water (watermeters);
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel1
  - number: 1.D.f.6°
    text: |-
      de gasmeters, wat betreft het gedeelte dat bestemd is voor de meting van het doorgestroomde gasvolume in hoofdzaak
      bestaande uit een gedeeltelijk in een vloeistof wentelende trommel dan wel uit een of meer in een vloeistof
      gedompelde en zich bewegende meetklokken (natte gasmeters);
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel1
  - number: 1.D.g
    text: de meetwerktuigen voor directe massameting.
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel1
  - number: 1.E
    text: 'Weegwerktuigen:'
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel1
  - number: 1.E.a
    text: de niet-automatische weegwerktuigen;
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel1
  - number: 1.E.b
    text: de automatische weegwerktuigen.
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel1
  - number: 1a.1
    text: |-
      Het bepaalde in de [artikelen 2 tot en met 23][ref1] geldt niet ten aanzien van:


      [ref1]: https://wetten.overheid.nl/BWBR0009069#Artikel2
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0009069
        artikel: '2'
        paragraaf: '1'
  - number: 1a.1.a
    text: |-
      de meetwerktuigen, bedoeld in [artikel 1, onder D, onder 1° tot en met 6°][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009069#Artikel1
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0009069
        artikel: '1'
        paragraaf: '1'
  - number: 1a.1.b
    text: de niet-automatische weegwerktuigen.
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel1a
  - number: 1a.2
    text: |-
      Het ten aanzien van meetinstrumenten bepaalde in de [artikelen 2 tot en met 23][ref1] geldt uitsluitend ten aanzien
      van de kilowattuurmeters, aangewezen in [artikel 2 van het Besluit kilowattuurmeters][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009069#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009068#Artikel2
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0009069
        artikel: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009068
        artikel: '2'
  - number: 1b
    text: |-
      Ten aanzien van de in [artikel 1, onder hoofd A., onder a.1][ref1], aangewezen maten geldt
      [artikel 6, zevende lid, onder b, van de IJkwet][ref2] niet.


      [ref1]: https://wetten.overheid.nl/BWBR0009069#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009082#Artikel6
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0009069
        artikel: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009082
        artikel: '6'
  - number: '2.1'
    text: |-
      De maten, gewichten, meet- en weegwerktuigen en meetinstrumenten moeten zodanig zijn ingericht, dat zij geen
      aanleiding tot misleiding of misvatting kunnen geven. Zij moeten een doelmatige vorm hebben, uit voor het doel
      geschikte grondstoffen van goede hoedanigheid zijn vervaardigd, aan de eis van goed werk voldoen en in goede staat
      van onderhoud verkeren; zij moeten zodanig zijn samengesteld, dat ijkmerken en afkeuringsmerken gemakkelijk kunnen
      worden aangebracht en niet zonder beschadiging kunnen worden verwijderd.
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel2
  - number: '2.2'
    text: |-
      Onze Minister stelt ter uitvoering van het eerste lid nadere bepalingen vast, waarbij de in [artikel 1][ref1]
      onderscheiden maten, gewichten, meet- en weegwerktuigen en de meetinstrumenten zo nodig nader worden omschreven;
      hij stelt voorts eisen vast ten aanzien van de meet- en weegeigenschappen en kan nadere voorschriften geven, welke
      voor een doelmatig gebruik van de maten, gewichten, meet- en weegwerktuigen en meetinstrumenten bevorderlijk zijn,
      alsmede omtrent het aanbrengen van ijkmerken.


      [ref1]: https://wetten.overheid.nl/BWBR0009069#Artikel1
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009069
        artikel: '1'
        paragraaf: '1'
  - number: '2.3'
    text: |-
      De maten, gewichten, meet- en weegwerktuigen en meetinstrumenten mogen geen aanduidingen van andere dan de bij
      of krachtens [artikel 1 van de IJkwet][ref1] erkende meeteenheden dragen; de aanduiding van decimale veelvouden
      en delen van de erkende meeteenheden op vorenbedoelde voorwerpen moet overeenstemmen met het bij of krachtens
      [artikel 4 van de IJkwet][ref2] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0009082#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009082#Artikel4
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009082
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0009082
        artikel: '4'
  - number: '2.4'
    text: |-
      De maat- en gewichtsaanduidingen die op de maten, gewichten, meet- en weegwerktuigen en meetinstrumenten voorkomen,
      bestaan hetzij uit een getal, gevolgd door de naam of de aanduiding van een erkende meeteenheid of van zijn
      decimale veelvoud of deel, vastgesteld bij of krachtens de [artikelen 1 en 4 van de IJkwet][ref1], hetzij uit
      een getal, gevolgd door het bij of krachtens die artikelen voor de betrokken erkende meeteenheid of zijn decimale
      veelvoud of deel vastgestelde symbool, dan wel uit een getal alleen.


      [ref1]: https://wetten.overheid.nl/BWBR0009082#Artikel1
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009082
        artikel: '1'
  - number: '2.5'
    text: |-
      Onze Minister kan in afwijking van het derde lid bepalen dat in door hem aangewezen gevallen en met inachtneming
      van door hem gestelde regelen voorwerpen als in het derde lid bedoeld behalve de in dat lid bedoelde aanduidingen
      ook aanduidingen van andere dan de erkende meeteenheden mogen dragen.
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel2
  - number: '3.1'
    text: |-
      Maten, gewichten, meet- en weegwerktuigen en meetinstrumenten, welke wegens hun samenstelling of in verband met
      het doel, waarvoor zij zijn bestemd, enigerlei beperking in hun gebruik of in de wijze van meten of wegen vereisen,
      moeten een opschrift dragen, waaruit van die beperkte bestemming blijkt, behoudens voor zover Onze Minister anders
      bepaalt.
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel3
  - number: '3.2'
    text: Onze Minister is bevoegd dienaangaande nadere voorschriften te geven.
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel3
  - number: '4'
    text: |-
      Alle bij of krachtens de [IJkwet][ref1] voorgeschreven aanduidingen en opschriften op maten, gewichten, meet- en
      weegwerktuigen en meetinstrumenten moeten duidelijk, ondubbelzinnig en duurzaam zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009082
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009082
  - number: '5.1'
    text: |-
      Maten, gewichten, meet- en weegwerktuigen en meetinstrumenten mogen uitsluitend worden gebruikt voor metingen en
      wegingen overeenkomstig hun bestemming.
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel5
  - number: '5.2'
    text: |-
      Drinkglazen, bekers, kruiken, flessen, karaffen en vaatwerk, waarop een inhoudsaanduiding voorkomt - met
      uitzondering van flessen als bedoeld in het derde lid - mogen uitsluitend worden gebruikt als hulpmiddel voor het
      verstrekken van hetgeen zij bevatten.
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel5
  - number: '5.3'
    text: |-
      Een fles, voorzien van een inhoudsaanduiding en van het EEG-teken, bedoeld in
      [artikel 1 van het Besluit EEG-tapmaatflessen][ref1], mag uitsluitend worden gebruikt:


      [ref1]: https://wetten.overheid.nl/BWBR0003205#Artikel1
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003205
        artikel: '1'
  - number: 5.3.a
    text: |-
        - te zamen met een meetsjabloon, die blijkens zijn bestemming bij die fles past - ter bepaling van de hoeveelheid
      vloeistof, die in die fles wordt afgeleverd;
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel5
  - number: 5.3.b
    text: |-
        - anders dan met een meetsjabloon als bedoeld [onder a][ref1] - als hulpmiddel voor het verstrekken van hetgeen die
      fles bevat.


      [ref1]: https://wetten.overheid.nl/BWBR0009069#Artikel5
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009069
        artikel: '5'
        paragraaf: '2'
  - number: '5.4'
    text: |-
      Een meetsjabloon als bedoeld in [artikel 1, onder][ref1] hoofd A., [onder a][ref2].[1][ref3], mag uitsluitend
      worden gebruikt ter bepaling van de hoeveelheid vloeistof in een fles als bedoeld in het derde lid, waarbij die
      meetsjabloon blijkens zijn bestemming past.


      [ref1]: https://wetten.overheid.nl/BWBR0009069#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009069#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0009069#Artikel5
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009069
        artikel: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009069
        artikel: '5'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0009069
        artikel: '5'
        paragraaf: '2'
  - number: '5.5'
    text: |-
      Voor weging van edele metalen, parels, edelgesteenten of munten moet worden gebruik gemaakt van gewichten voor
      fijne weging en weegwerktuigen voor fijne of speciale weging.
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel5
  - number: '5.6'
    text: 'Weegwerktuigen voor grove weging mogen uitsluitend worden gebruikt:'
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel5
  - number: 5.6.a
    text: voor het bepalen in postkantoren van de vervoerkosten van postpakketten;
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel5
  - number: 5.6.b
    text: |-
      voor het bepalen, op terreinen van ondernemingen tot exploitatie van middelen van openbaar vervoer, van de
      vervoerkosten van goederen;
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel5
  - number: 5.6.c
    text: |-
      voor het wegen in mortelfabrieken van asfaltbeton, betonmortel, metselspecie en soortgelijke produkten, alsmede
      voor het in die fabrieken bij de vervaardiging van die produkten wegen van de materialen, waaruit die produkten
      worden samengesteld;
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel5
  - number: 5.6.d
    text: voor het wegen van afvalstoffen en van zand, grind en aarde.
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel5
  - number: '5.7'
    text: |-
      Onder afvalstoffen wordt verstaan: alle stoffen, preparaten of andere produkten waarvan de houder - met het oog op
      de verwijdering daarvan - zich ontdoet, voornemens is zich te ontdoen of zich moet ontdoen.
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel5
  - number: '5.8'
    text: |-
      Een taxameter mag uitsluitend worden gebruikt in de taxi waarin hij zich bevond toen hij werd gekeurd, dan wel
      werd herkeurd.
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel5
  - number: '6.1'
    text: |-
      Metingen of wegingen met een meet- of weegwerktuig of meetinstrument, waarbij de wijze van opstelling van belang is
      voor de nauwkeurigheid van de meting of weging, mogen slechts worden verricht, indien het meet- of weegwerktuig of
      meetinstrument volgens aanwijzing van een daartoe aanwezige inrichting op de juiste wijze is opgesteld.
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel6
  - number: '6.2'
    text: |-
      Meet- en weegwerktuigen als bedoeld in het eerste lid, aanwezig op plaatsen van verkoop aan particulieren van
      goederen, die bij de maat of het gewicht worden verkocht, moeten volgens aanwijzing van de daartoe aanwezige
      inrichting juist zijn opgesteld.
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel6
  - number: '6.3'
    text: |-
      Weegwerktuigen moeten, alvorens daarmede gewogen wordt, onbelast in de juiste evenwichtsstand worden gebracht,
      indien de evenwichtsstand van het onbelaste weegwerktuig van belang is voor de juistheid van het weegresultaat.
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel6
  - number: '6.4'
    text: |-
      Weegwerktuigen, aanwezig op plaatsen, bedoeld in het tweede lid, moeten onbelast in de juiste evenwichtsstand
      verkeren.
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel6
  - number: '6.5'
    text: |-
      Meet- en weegwerktuigen, aanwezig op plaatsen, bedoeld in het tweede lid, moeten zodanig zijn opgesteld, dat de
      koper de aanwijzing van het betrokken meet- of weegwerktuig onbelemmerd kan waarnemen.
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel6
  - number: '7'
    text: |-
      Van keuring zijn vrijgesteld de onder hoofd B, [letter c, van artikel 1][ref1] genoemde inhoudsmaten.


      [ref1]: https://wetten.overheid.nl/BWBR0009069#Artikel1
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009069
        artikel: '1'
        paragraaf: '1'
  - number: '8'
    text: |-
      Justeer- en correctie-inrichtingen worden niet gebruikt om andere dan zo dicht mogelijk bij nul liggende waarden
      van aanwijzingsfouten te verwezenlijken.
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel8
  - number: '9.1'
    text: |-
      Alle in [artikel 1][ref1] vermelde voorwerpen, met uitzondering van de taxameters, vermeld onder
      hoofd D, [onderdeel b][ref2], van dat artikel, zijn vrijgesteld van de herkeuring, bedoeld in
      [artikel 11, vierde lid, onder a, van de IJkwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009069#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009069#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0009082#Artikel11
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009069
        artikel: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009069
        artikel: '9'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0009082
        artikel: '11'
  - number: '9.2'
    text: |-
      De herkeuring van taxameters geschiedt telkens in aaneensluitende tijdvakken van één jaar, te rekenen vanaf de
      datum van goedkeuring van de taxameter bij de keuring.
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel9
  - number: '12'
    text: |-
      Voorwerpen, welke ter voldoening aan het bepaalde in [artikel 11, vierde lid, onder a, van de IJkwet][ref1] ter
      herkeuring worden aangeboden, moeten, om te worden goedgekeurd, in zodanige toestand verkeren, dat mag worden
      verwacht, dat zij aan de in of krachtens dit Reglement gestelde eisen tot de volgende herkeuring kunnen voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0009082#Artikel11
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009082
        artikel: '11'
  - number: '14.1'
    text: |-
      Bij het onderzoek van maten geldt, voor zover niet door Onze Minister anders is bepaald, als maatstaf hun afmeting
      of volume bij 20°C.
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel14
  - number: '14.2'
    text: Bij het onderzoek van gewichten geldt hun massa, bepaald op de grondslag van een volumieke massa van 8000 kg/m3.
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel14
  - number: '14.3'
    text: |-
      Bij het onderzoek van meet- en weegwerktuigen geldt, voor zover niet door Onze Minister anders is bepaald, als
      maatstaf hun aanwijzing van gemeten of gewogen hoeveelheid in het temperatuurgebied, waarin zij bestemd zijn om te
      worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel14
  - number: '15'
    text: |-
      De ter herkeuring aangeboden gewichten worden bij die herkeuring gejusteerd, mits dit kan geschieden door in een
      daarvoor bestemde opening in het gewicht een voor dat gewicht geschikt materiaal toe te voegen of materiaal dat
      zich in die opening bevindt, weg te nemen en mits de massa niet meer afwijkt van die, welke het gewicht behoort
      te bezitten, dan 1/100 van deze massa bij de gewichten van 100 gram en daarboven en 1/50 van deze massa bij de
      gewichten van 50 gram en daarbeneden.
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel15
  - number: '16.1'
    text: |-
      Degene die een aanvrage tot toelating van een model van een meet- of weegwerktuig of meetinstrument indient, is
      verplicht de ijkinstelling in de gelegenheid te stellen zoveel exemplaren van een naar het model vervaardigd meet-
      of weegwerktuig of meetinstrument te onderzoeken als de ijkinstelling voor een deugdelijk toelatingsonderzoek nodig
      oordeelt.
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel16
  - number: '16.2'
    text: |-
      In geval van toelating van het model moet de aanvrager daarvan voorts een door de ijkinstelling te bepalen aantal
      van de bij de aanvrage tot toelating overgelegde tekeningen en beschrijvingen kosteloos ter beschikking van de
      ijkinstelling stellen.
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel16
  - number: '18.1'
    text: |-
      Het model van het, uit twee delen bestaande ijkmerk, bedoeld in [artikel 13, eerste lid, van de IJkwet][ref1], is:


      [ref1]: https://wetten.overheid.nl/BWBR0009082#Artikel13
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0009082
        artikel: '13'
  - number: 18.1.a
    text: |-
      voor zover het betreft het eerste deel, het kenmerk van de ijkinstelling of de ijkbevoegde die de keuring of de
      herkeuring heeft verricht;
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel18
  - number: 18.1.b
    text: voor zover het betreft het tweede deel, het merk van goedkeuring.
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel18
  - number: '18.2'
    text: |-
      Het kenmerk, bedoeld in het eerste lid, onder a, is een in een kader gevat vierkant, onderverdeeld in 16 gelijke
      vierkanten, waarin merkingen zijn aangebracht. Dit kenmerk is:
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel18
  - number: 18.2.a
    text: voor zover het betreft de ijkinstelling, het teken dat is weergegeven in bijlage I bij dit besluit;
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel18
  - number: 18.2.b
    text: |-
      voor zover het betreft een ijkbevoegde, het voor hem ingevolge [artikel 26b, derde lid, van de IJkwet][ref1]
      vastgestelde teken.


      [ref1]: https://wetten.overheid.nl/BWBR0009082#Artikel26b
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0009082
        artikel: 26b
  - number: '18.3'
    text: |-
      Het merk van goedkeuring, zowel bij de keuring als bij de herkeuring te bezigen, bestaat uit de laatste twee
      cijfers van het jaartal van het lopende jaar, gevat in een kader van de vorm die is weergegeven in bijlage II bij
      dit besluit.
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel18
  - number: '20.1'
    text: |-
      Het model van de afkeuringsmerken, bedoeld in de [artikelen 13][ref1], derde lid, [16][ref2], tweede lid, en
      [29c van de IJkwet][ref3] is een gelijkzijdige driehoek waarin is opgenomen het vierkant dat behoort tot het
      kenmerk van de ijkinstelling of de ijkbevoegde die het afkeuringsmerk aanbrengt.


      [ref1]: https://wetten.overheid.nl/BWBR0009082#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0009082#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0009082#Artikel29c
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0009082
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0009082
        artikel: '16'
      - id: ref3
        bwb_id: BWBR0009082
        artikel: 29c
  - number: '20.2'
    text: |-
      Ten aanzien van het in het eerste lid bedoelde kenmerk is [artikel 18, tweede lid][ref1], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009069#Artikel18
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0009069
        artikel: '18'
        paragraaf: '4'
  - number: '22.1'
    text: |-
      Op milligramgewichten van 20, 10, 5, 2 en 1 milligram, die bij de keuring of de herkeuring zijn goedgekeurd, worden
      wegens hun afmetingen geen ijkmerken aangebracht; ten aanzien van die voorwerpen wordt het aanbrengen van ijkmerken
      vervangen door de afgifte van een gewaarmerkte verklaring.
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel22
  - number: '22.2'
    text: |-
      Op andere milligramgewichten dan die in het eerste lid bedoeld wordt wegens hun afmetingen in geval van goedkeuring
      bij de keuring slechts het deel van het ijkmerk, bedoeld in [artikel 18, eerste lid, onder a][ref1], aangebracht en
      worden in geval van goedkeuring bij de herkeuring geen ijkmerken aangebracht; ten aanzien van die voorwerpen wordt
      het aanbrengen van het tweede deel van het ijkmerk bij de keuring en het aanbrengen van ijkmerken bij de herkeuring
      vervangen door de afgifte van een gewaarmerkte verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0009069#Artikel18
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0009069
        artikel: '18'
        paragraaf: '4'
  - number: '22.3'
    text: |-
      Op andere gewichten dan die, bedoeld in het eerste en tweede lid, wordt wegens hun afmetingen in geval van
      goedkeuring bij de herkeuring alleen het deel van het ijkmerk, bedoeld in [artikel 18, eerste lid, onder b][ref1],
      aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0009069#Artikel18
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0009069
        artikel: '18'
        paragraaf: '4'
  - number: '23.1'
    text: |-
      De gewaarmerkte verklaring, bedoeld in [artikel 22, eerste en tweede lid][ref1], wordt gesteld op een enveloppe,
      waarin de milligramgewichten aan de aanbieder worden teruggegeven, nadat die enveloppe met het merk van
      goedkeuring, bedoeld in [artikel 18, eerste lid, onder b][ref2], is verzegeld.


      [ref1]: https://wetten.overheid.nl/BWBR0009069#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0009069#Artikel18
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0009069
        artikel: '22'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0009069
        artikel: '18'
        paragraaf: '4'
  - number: '23.2'
    text: 'In die gewaarmerkte verklaring worden vermeld:'
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel23
  - number: 23.2.a
    text: het aantal en de soort van de gewichten;
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel23
  - number: 23.2.b
    text: de naam en de woonplaats van de eigenaar;
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel23
  - number: 23.2.c
    text: de naam van de ijkinstelling of de ijkbevoegde die de keuring of de herkeuring heeft verricht;
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel23
  - number: 23.2.d
    text: de datum waarop de herkeuring is geschied.
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel23
  - number: '24'
    text: |-
      Na de inwerkingtreding van dit besluit berusten de krachtens het IJkreglement (Stb. 1989, 116) vastgestelde regels
      en andere besluiten op dit besluit.
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel24
  - number: '25'
    text: Het IJkreglement (Stb. 1989, 116) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel25
  - number: '26'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel26
  - number: '27'
    text: 'Dit besluit wordt aangehaald als: IJkreglement.'
    url: https://wetten.overheid.nl/BWBR0009069/1998-10-01#Artikel27
