preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volksgezondheid, Welzijn en Sport van 7 februari 2013, VGP/3153658, gedaan
    in overeenstemming met Onze Minister van Economische Zaken;

    Gelet op:

    De Afdeling advisering van de Raad van State gehoord (advies van 6 maart 2013, No. W13.13.0031/III);

    Gezien het nader rapport van Onze Minister van Volksgezondheid, Welzijn en Sport van 22 maart 2013, VGP/3159537,
    uitgebracht in overeenstemming met Onze Minister van Economische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - *claim inzake ziekterisicobeperking:*
      een claim inzake ziekterisicobeperking als bedoeld in artikel 2, zesde lid, van [verordening (EG) 1924/2006]
      (32006R1924);
        - *datum van minimale houdbaarheid:* de datum van minimale houdbaarheid van een levensmiddel, bedoeld in artikel 2,
      tweede lid, onder r, van verordening (EU) 1169/2011;
        - *grote cateraars:* grote cateraars, bedoeld in artikel 2, tweede lid, onder d, van verordening (EU) 1169/2011;
        - *partij:* een verzameling verkoopeenheden van een levensmiddel die onder vrijwel identieke omstandigheden is
      geproduceerd, vervaardigd of verpakt;
        - *uiterste consumptiedatum:* de uiterste consumptiedatum, bedoeld in artikel 24 van verordening (EU) 1169/2011;
        - *verordening (EG) 178/2002:* [Verordening (EG) nr. 178/2002](32002R0178) van het Europees Parlement en de Raad
      van 28 januari 2002 tot vaststelling van de algemene beginselen en voorschriften van de levensmiddelenwetgeving,
      tot oprichting van de Europese Autoriteit voor voedselveiligheid en tot vaststelling van procedures voor
      voedselveiligheidsaangelegenheden (PbEG 2002, L 31);
        - *verordening (EG) 1224/2009:* [Verordening (EG) nr. 1224/2009](32009R1224) van de Raad van 20 november 2009
      tot vaststelling van een communautaire controleregeling die de naleving van de regels van het gemeenschappelijk
      visserijbeleid moet garanderen, tot wijziging van [Verordeningen (EG) nr. 847/96](31996R0847), [(EG) nr. 2371/2002]
      (32002R2371), [(EG) nr. 811/2004](32004R0811), [(EG) nr. 768/2005](32005R0768), [(EG) nr. 2115/2005](32005R2115),
      [(EG) nr. 2166/2005](32005R2166), [(EG) nr. 388/2006](32006R0388), [(EG) nr. 509/2007](32007R0509), [(EG)
      nr. 676/2007](32007R0676), [(EG) nr. 1098/2007](32007R1098), [(EG) nr. 1300/2008](32008R1300), [(EG) nr. 1342/2008]
      (32008R1342) en tot intrekking van Verordeningen [(EEG) nr. 2847/93](31993R2847), [(EG) nr. 1627/94](31994R1627) en
      [(EG) nr. 1966/2006](32006R1966) (PbEU 2009, L 343);
        - *verordening (EG) 1924/2006:* Verordening (EG) nr. 1924/2006 van het Europees Parlement en de Raad van
      20 december 2006 inzake voedings- en gezondheidsclaims voor levensmiddelen (PbEU 2006, L 404, en 2007, L 12);
        - *verordening (EU) 1379/2013:* [Verordening (EU) nr. 1379/2013](32013R1379) van het Europees Parlement en de Raad
      van 11 december 2013 houdende een gemeenschappelijke marktordening voor visserijproducten en aquacultuurproducten,
      tot wijziging van [Verordeningen (EG) nr. 1184/2006](32006R1184) en [(EG) nr. 1224/2009](32009R1224) van de Raad en
      tot intrekking van [Verordening (EG) nr. 104/2000](32000R0104) van de Raad (PbEU 2013, L 354);
        - *verordening (EU) 2019/787:* [Verordening (EU) 2019/787](32687R2019) van het Europees Parlement en de Raad van
      17 april 2019 betreffende de definitie, omschrijving, presentatie en etikettering van gedistilleerde dranken, het
      gebruik van de namen van gedistilleerde dranken in de presentatie en etikettering van andere levensmiddelen en de
      bescherming van geografische aanduidingen van gedistilleerde dranken, het gebruik van ethylalcohol en distillaten
      uit landbouwproducten in alcoholhoudende dranken, en tot intrekking van [Verordening (EG) nr. 110/2008](32008R0110)
      (PbEU 2019, L 130);
        - *verordening (EU) 609/2013:* Verordening (EU) nr. 609/2013 van het Europees Parlement en de Raad van 12 juni 2013
      inzake voor zuigelingen en peuters bedoelde levensmiddelen, voeding voor medisch gebruik en de dagelijkse voeding
      volledig vervangende producten voor gewichtsbeheersing, en tot intrekking van Richtlijn 92/52/EEG van de Raad,
      Richtlijnen 96/8/EG, 1999/21/EG, 2006/125/EG en 2006/141/EG van de Commissie, Richtlijn 2009/39/EG van het Europees
      Parlement en de Raad en de Verordeningen (EG) nr. 41/2009 en (EG) nr. 953/2009 van de Commissie (PbEU 2013, L 181);
        - *verordening (EU) 1169/2011:* Verordening (EU) nr. 1169/2011 van het Europees Parlement en de Raad van 25 oktober
      2011 betreffende de verstrekking van voedselinformatie aan consumenten, tot wijziging van Verordeningen (EG)
      nr. 1924/2006 en (EG) nr. 1925/2006 van het Europees Parlement en de Raad en tot intrekking van [Richtlijn
      87/250/EEG](31987L0250) van de Commissie, [Richtlijn 90/496/EEG](31990L0496) van de Raad, [Richtlijn 1999/10/
      EG](31999L0010) van de Commissie, [Richtlijn 2000/13/EG](32000L0013) van het Europees Parlement en de
      Raad, [Richtlijnen 2002/67/EG](32002L0067) en [2008/5/EG](32008L0005) van de Commissie, en Verordening (EG)
      nr. [608/2004](32508L2004) van de Commissie (PbEU 2011, L 304);
        - *verpakt levensmiddel:* de verkoopeenheid die niet bestemd is als zodanig aan de eindverbruiker of aan grote
      cateraars te worden afgeleverd, en bestaat uit een levensmiddel en haar verpakking of recipiënt;
        - *voedselkeuzelogo:* een logo dat het voor consumenten eenvoudiger maakt levensmiddelen te kiezen die ten opzichte
      van vergelijkbare levensmiddelen in een productcategorie gezonder zijn wat betreft energie, de gehaltes aan vet,
      toegevoegd suiker, voedingsvezel, zout, groenten, fruit, peulvruchten of eiwit;
        - *voorverpakking:* het verpakkingsmateriaal waarin een voorverpakt levensmiddel als bedoeld in artikel 2, tweede
      lid, onder e, van verordening (EU) 1169/2011, is verpakt.
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel1
  - number: '2.1'
    text: |-
