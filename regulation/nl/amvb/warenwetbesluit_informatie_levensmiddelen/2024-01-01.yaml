  - number: '2.3'
    text: |-
      Het is verboden ten aanzien van levensmiddelen te handelen in strijd met artikel 16 van [verordening (EG) 178/2002]
      (32002R0178).
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel2
  - number: '2.4'
    text: |-
      Het is verboden te handelen in strijd met de bij of krachtens de artikelen 3, 4, derde en vijfde lid, 5, 6, eerste
      en tweede lid, 7, 8, eerste lid, 9, 10, eerste, tweede en derde lid, 12 en 14, van [verordening (EG) 1924/2006]
      (32006R1924) gestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel2
  - number: '2.5'
    text: |-
      Het is verboden te handelen in strijd met de bij artikel 6, eerste, tweede en derde lid, artikel 7, eerste en
      tweede lid en derde lid, onderdelen d en e, artikel 9, artikel 10, eerste, tweede, derde, vijfde, zesde en zevende
      lid, artikel 11, artikel 12, artikel 13, eerste lid, derde lid, eerste, tweede en derde alinea, vierde, vijfde,
      zesde en zevende lid, artikel 14, eerste lid, artikel 15, artikel 17 en artikel 21, tweede en derde lid, en de
      krachtens artikel 20, onderdelen b en c, van [verordening (EU) 2019/787](32687R2019) vastgestelde bepalingen.
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel2
  - number: '2.6'
    text: |-
      Het is verboden te handelen in strijd met de bij of krachtens de artikelen 6, 7, 8, tweede tot en met achtste lid,
      9, 10, eerste lid, 12, 13, eerste tot en met vijfde lid, 14, eerste en tweede lid, 15, eerste lid, 16, eerste en
      tweede lid, 17, 18, eerste tot en met vierde lid, 21, eerste lid, 22, 23, eerste en tweede lid, 24, 25, 26, eerste,
      tweede, derde en achtste lid, 27, 28, tweede lid, 30, eerste tot en met derde lid, 32, 33, eerste, tweede, vierde
      en vijfde lid, 34, 35, eerste en zesde lid, 36, 37, 44, eerste lid, onder a, en 54, tweede lid, van verordening
      (EU) 1169/2011, gestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel2
  - number: '2.7'
    text: |-
      Het is verboden te handelen in strijd met de artikelen 35, eerste, tweede en derde lid, 37, tweede lid, 38, eerste
      lid, en 39, eerste, derde en vierde lid, van [verordening (EU) 1379/2013](32013R1379).
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel2
  - number: '3'
    text: |-
      Voor de verplichte voedselinformatie en de vermeldingen op de etikettering, bedoeld in artikel 15, tweede lid, van
      verordening (EU) 1169/2011, wordt gebruik gemaakt van in ieder geval de Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel3
  - number: '4.1'
    text: |-
      Een levensmiddel wordt slechts in de handel gebracht indien het vergezeld gaat van een vermelding die het mogelijk
      maakt de partij waartoe dat levensmiddel behoort te identificeren. Deze vermelding wordt voorafgegaan door de
      letter «L», behalve in het geval waarin zij duidelijk van de overige vermeldingen op het etiket te onderscheiden
      is.
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel4
  - number: '4.2'
    text: |-
      In afwijking van het eerste lid mag de vermelding betreffende een partij van voorverpakt consumptie-ijs worden
      aangebracht op de verzamelverpakking van individuele porties van die waar.
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel4
  - number: '4.3'
    text: 'De in het eerste lid bedoelde vermeldingen worden aangebracht:'
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel4
  - number: 4.3.a
    text: op de voorverpakking of op een daaraan gehecht etiket; of
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel4
  - number: 4.3.b
    text: op de verpakking of de recipiënt, of bij gebreke daarvan op de desbetreffende handelsdocumenten.
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel4
  - number: '4.4'
    text: 'De in het eerste en tweede lid bedoelde vermeldingen worden vastgesteld en aangebracht door:'
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel4
  - number: 4.4.a
    text: de producent;
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel4
  - number: 4.4.b
    text: de fabrikant;
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel4
  - number: 4.4.c
    text: de verpakker; of
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel4
  - number: 4.4.d
    text: de eerste in de Europese Unie gevestigde verkoper;
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel4
  - number: '5'
    text: |-
      [Artikel 4][ref1] is niet van toepassing:


      [ref1]: https://wetten.overheid.nl/BWBR0033323#Artikel4
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0033323
        artikel: '4'
  - number: 5.a
    text: |-
      indien de datum van minimale houdbaarheid of de uiterste consumptiedatum in de etikettering voorkomt, op voorwaarde
      dat de vermelding van deze datum duidelijk en in de juiste volgorde ten minste de dag en de maand omvat;
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel5
  - number: 5.b
    text: 'op landbouwproducten die vanuit de bedrijfszone:'
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel5
  - number: 5.b.1
    text: aan opslag-, behandelings- of verpakkingsbedrijven worden verhandeld of afgeleverd;
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel5
  - number: 5.b.2
    text: naar producentenorganisaties worden overgebracht; of
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel5
  - number: 5.b.3
    text: voor onmiddellijke opneming in een operationeel bereidings- of verwerkingsysteem worden opgehaald;
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel5
  - number: 5.c
    text: |-
      wanneer de levensmiddelen die op de plaats van verkoop aan de eindverbruiker niet zijn voorverpakt, aldaar op
      verzoek van de koper worden verpakt of voor onmiddellijke verkoop worden voorverpakt;
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel5
  - number: 5.d
    text: |-
      op verpakkingen of recipiënten van levensmiddelen waarvan de grootste zijde een oppervlakte heeft van minder dan
      10 cm2.
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel5
  - number: '6.1'
    text: |-
      De vermelding «doorstraald» of «behandeld met ioniserende straling», genoemd in bijlage VI, deel A, onderdeel 3,
      van verordening (EU) 1169/2011 wordt aangebracht:
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel6
  - number: 6.1.a
    text: 'bij verpakte of voorverpakte producten: op het etiket;'
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel6
  - number: 6.1.b
    text: |-
      bij onverpakte producten: samen met de benaming van de waar op een affiche of een bord boven of naast de houder
      waarin het levensmiddel zich bevindt.
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel6
  - number: '6.2'
    text: |-
      Indien een doorstraald product als ingrediënt van een levensmiddel wordt gebruikt, wordt de in het eerste lid
      bedoelde vermelding van de doorstraling:
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel6
  - number: 6.2.a
    text: toegevoegd aan de benaming van dat ingrediënt in de lijst van ingrediënten van dat levensmiddel; of
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel6
  - number: 6.2.b
    text: |-
      bij onverpakte producten: samen met de benaming van de waar vermeld op een affiche of een bord boven of naast de
      houder waarin het levensmiddel zich bevindt.
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel6
  - number: '6.3'
    text: |-
      In alle gevallen wordt de doorstraling vermeld in de documenten die de doorstraalde levensmiddelen vergezellen of
      daarop betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel6
  - number: '7.1'
    text: 'Bij verpakte levensmiddelen zijn de volgende vermeldingen verplicht:'
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel7
  - number: 7.1.a
    text: de benaming, bedoeld in artikel 9, eerste lid, onder a, van verordening (EU) 1169/2011; en
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel7
  - number: 7.1.b
    text: |-
      de vermelding, bedoeld in [artikel 4, eerste lid][ref1], inzake de vermelding die het mogelijk maakt de partij te
      identificeren waartoe een levensmiddel behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0033323#Artikel4
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0033323
        artikel: '4'
  - number: '7.2'
    text: 'De in het eerste lid bedoelde vermeldingen zijn aangebracht:'
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel7
  - number: 7.2.a
    text: op de verpakking of de recipiënt; of, indien dat niet mogelijk is
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel7
  - number: 7.2.b
    text: op het handelsdocument dat het desbetreffende levensmiddel vergezelt.
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel7
  - number: '8.1'
    text: |-
      Bij onverpakte levensmiddelen is vermelding van de benaming, bedoeld in artikel 9, eerste lid, onder a, van
      verordening (EU) 1169/2011, verplicht.
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel8
  - number: '8.2'
    text: 'De in het eerste lid bedoelde vermelding:'
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel8
  - number: 8.2.a
    text: 'is duidelijk zichtbaar voor het publiek aangebracht:'
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel8
  - number: 8.2.a.1
    text: op het voorwerp waarin of waarop het betrokken levensmiddel zich bevindt; of
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel8
  - number: 8.2.a.2
    text: op een boven het onder 1° bedoelde voorwerp geplaatst(e) bord of kaart; of
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel8
  - number: 8.2.b
    text: |-
      wordt in de onmiddellijke omgeving van het levensmiddel op een andere duidelijke wijze ter kennis van het publiek
      gebracht.
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel8
  - number: '9'
    text: |-
      In afwijking van de artikelen 9, eerste lid, en 10, eerste lid, van verordening (EU) 1169/2011, behoeven op glazen
      flessen die bestemd zijn om opnieuw te worden gebruikt en waarin melk of melkproducten zijn verpakt, slechts te
      worden vermeld:
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel9
  - number: 9.a
    text: de datum van minimale houdbaarheid onderscheidenlijk de uiterste consumptiedatum; en
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel9
  - number: 9.b
    text: |-
      de naam of handelsnaam en het adres van de exploitant van het desbetreffende levensmiddelenbedrijf, bedoeld in
      artikel 9, eerste lid, onder h, van verordening (EU) 1169/2011.
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel9
  - number: 9a
    text: |-
      Kleine hoeveelheden rechtstreeks vanaf vissersvaartuigen aan de consumenten verkochte producten hoeven niet te
      voldoen aan de eisen gesteld in artikel 35, eerste lid, van [verordening (EU) 1379/2013](32013R1379), mits die
      hoeveelheden niet hoger zijn dan de waarde, bedoeld in artikel 58, achtste lid, van [verordening (EG) 1224/2009]
      (32009R1224).
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel9a
  - number: '10'
    text: 'Bij regeling van Onze Minister kunnen worden vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel10
  - number: 10.a
    text: |-
      maatregelen als bedoeld in artikel 35, derde lid, van verordening (EU) 1169/2011, inzake het vergemakkelijken van
      het toezicht op het gebruik van extra uitdrukkings- en presentatievormen van de voedingswaardevermelding;
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel10
  - number: 10.b
    text: |-
      bijkomende verplichte vermeldingen voor specifieke typen of categorieën levensmiddelen als bedoeld in artikel 39,
      eerste lid, van verordening (EU) 1169/2011, die gerechtvaardigd zijn om ten minste een van de volgende redenen:
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel10
  - number: 10.b.1
    text: bescherming van de volksgezondheid;
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel10
  - number: 10.b.2
    text: bescherming van de consument;
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel10
  - number: 10.b.3
    text: preventie van fraude;
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel10
  - number: 10.b.4
    text: bescherming van aanduidingen van herkomst en oorsprong, en de preventie van oneerlijke concurrentie;
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel10
  - number: 10.c
    text: maatregelen als bedoeld in artikel 42 van verordening (EU) 1169/2011;
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel10
  - number: 10.d
    text: |-
      maatregelen als bedoeld in artikel 43 van verordening (EU) 1169/2011, met betrekking tot de vrijwillige vermelding
      van referentie-innames voor specifieke bevolkingsgroepen;
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel10
  - number: 10.e
    text: |-
      maatregelen als bedoeld in artikel 44, tweede lid, van verordening (EU) 1169/2011, betreffende de middelen waarmee
      de in artikel 44, eerste lid, van verordening (EU) 1169/2011, bedoelde vermeldingen of elementen van vermeldingen
      beschikbaar moeten worden gesteld en, waar nodig, de daarvoor gebruikte uitdrukkings- of presentatievorm;
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel10
  - number: 10.f
    text: |-
      maatregelen als bedoeld in bijlage VI, deel B, punt 3, van verordening (EU) 1169/2011, inzake het alleen in
      Nederland in de handel brengen van gehakt vlees dat niet voldoet aan de in bijlage VI, deel B, punt 1, van
      verordening (EU) 1169/2011, vastgestelde criteria.
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel10
  - number: '11.1'
    text: |-
      Onverminderd [verordening (EG) 1924/2006](32006R1924) mag bij de verhandeling van een levensmiddel een bij
      ministeriële regeling aangewezen voedselkeuzelogo worden gebezigd.
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel11
  - number: '11.2'
    text: 'Een logo als bedoeld in het eerste lid, wordt niet gebezigd bij:'
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel11
  - number: 11.2.a
    text: alcoholhoudende dranken;
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel11
  - number: 11.2.b
    text: |-
      volledige zuigelingenvoeding, opvolgzuigelingenvoeding, bewerkte levensmiddelen op basis van granen, babyvoeding,
      voeding voor medisch gebruik en de dagelijkse voeding volledig vervangende producten voor gewichtsbeheersing als
      bedoeld in [verordening (EU) 609/2013](32013R0609); en
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel11
  - number: 11.2.c
    text: |-
      voedingssupplementen als bedoeld in het [Warenwetbesluit voedingssupplementen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014814
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0014814
  - number: '11.3'
    text: Bij ministeriële regeling kunnen regels voor het gebruik van een voedselkeuzelogo worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0033323/2024-01-01#Artikel11
  - number: '13'
