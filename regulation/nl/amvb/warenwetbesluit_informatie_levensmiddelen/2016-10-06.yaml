  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volksgezondheid, Welzijn en Sport van 7 februari 2013, VGP/3153658, gedaan
    in overeenstemming met Onze Minister van Economische Zaken;

    Gelet op:

    De Afdeling advisering van de Raad van State gehoord (advies van 6 maart 2013, No. W13.13.0031/III);

    Gezien het nader rapport van Onze Minister van Volksgezondheid, Welzijn en Sport van 22 maart 2013, VGP/3159537,
    uitgebracht in overeenstemming met Onze Minister van Economische Zaken;

    Hebben goedgevonden en verstaan:
