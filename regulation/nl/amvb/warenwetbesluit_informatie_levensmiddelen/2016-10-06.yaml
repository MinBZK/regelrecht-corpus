        artikel: '11'
  - number: '13'
    text: |-
      De Nederlandse Voedsel- en Warenautoriteit is de bevoegde autoriteit, bedoeld in:

      a. [verordening (EG) 1924/2006](32006R1924);

      b. artikel 22, eerste lid, van [verordening (EG) 110/2008](32008R0110).
    url: https://wetten.overheid.nl/BWBR0033323/2016-10-06#Artikel13
