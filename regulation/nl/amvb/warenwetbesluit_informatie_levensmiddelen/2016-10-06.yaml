articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

        - *claim inzake ziekterisicobeperking:* een claim inzake ziekterisicobeperking als bedoeld in artikel 2, zesde lid,
      van [verordening (EG) 1924/2006](32006R1924);
        - *datum van minimale houdbaarheid:* de datum van minimale houdbaarheid van een levensmiddel, bedoeld in artikel 2,
      tweede lid, onder r, van verordening (EU) 1169/2011;
        - *grote cateraars:* grote cateraars, bedoeld in artikel 2, tweede lid, onder d, van verordening (EU) 1169/2011;
        - *partij:* een verzameling verkoopeenheden van een levensmiddel die onder vrijwel identieke omstandigheden is
      geproduceerd, vervaardigd of verpakt;
        - *uiterste consumptiedatum:* de uiterste consumptiedatum, bedoeld in artikel 24 van verordening (EU) 1169/2011;
        - *verordening (EG) 178/2002:* [Verordening (EG) nr. 178/2002](32002R0178) van het Europees Parlement en de Raad
      van 28 januari 2002 tot vaststelling van de algemene beginselen en voorschriften van de levensmiddelenwetgeving,
      tot oprichting van de Europese Autoriteit voor voedselveiligheid en tot vaststelling van procedures voor
      voedselveiligheidsaangelegenheden (PbEG 2002, L 31);
        - *verordening (EG) 1924/2006:* Verordening (EG) nr. 1924/2006 van het Europees Parlement en de Raad van 20
      december 2006 inzake voedings- en gezondheidsclaims voor levensmiddelen (PbEU 2006, L 404, en 2007, L 12);
        - *verordening (EG) 110/2008:* Verordening (EG) nr. 110/2008 van het Europees Parlement en de Raad van 15 januari
      2008 betreffende de definitie, de aanduiding, de presentatie, de etikettering en de bescherming van de geografische
      aanduidingen van gedistilleerde dranken en tot intrekking van Verordening (EG) nr. 1576/89 van de Raad (PbEU 2008,
      L 39);
        - *verordening (EU) 609/2013:* Verordening (EU) nr. 609/2013 van het Europees Parlement en de Raad van 12 juni 2013
      inzake voor zuigelingen en peuters bedoelde levensmiddelen, voeding voor medisch gebruik en de dagelijkse voeding
      volledig vervangende producten voor gewichtsbeheersing, en tot intrekking van Richtlijn 92/52/EEG van de Raad,
      Richtlijnen 96/8/EG, 1999/21/EG, 2006/125/EG en 2006/141/EG van de Commissie, Richtlijn 2009/39/EG van het Europees
      Parlement en de Raad en de Verordeningen (EG) nr. 41/2009 en (EG) nr. 953/2009 van de Commissie (PbEU 2013, L 181);
        - *verordening (EU) 1169/2011:* Verordening (EU) nr. 1169/2011 van het Europees Parlement en de Raad van 25 oktober
      2011 betreffende de verstrekking van voedselinformatie aan consumenten, tot wijziging van Verordeningen (EG) nr.
      1924/2006 en (EG) nr. 1925/2006 van het Europees Parlement en de Raad en tot intrekking van [Richtlijn 87/250/EEG]
      (31987L0250) van de Commissie, [Richtlijn 90/496/EEG](31990L0496) van de Raad, [Richtlijn 1999/10/EG](31999L0010)
      van de Commissie, [Richtlijn 2000/13/EG](32000L0013) van het Europees Parlement en de Raad, [Richtlijnen 2002/67/
      EG](32002L0067) en [2008/5/EG](32008L0005) van de Commissie, en Verordening (EG) nr. [608/2004](32508L2004) van de
      Commissie (PbEU 2011, L 304);
        - *verpakt levensmiddel:* de verkoopeenheid die niet bestemd is als zodanig aan de eindverbruiker of aan grote
      cateraars te worden afgeleverd, en bestaat uit een levensmiddel en haar verpakking of recipiënt;
        - *voedselkeuzelogo:* een logo dat het voor consumenten eenvoudiger maakt levensmiddelen te kiezen die ten opzichte
      van vergelijkbare levensmiddelen in een productcategorie gezonder zijn wat betreft energie of de gehaltes aan
      verzadigd vet, transvet, toegevoegd suiker, voedingsvezel of zout;
        - *voorverpakking:* het verpakkingsmateriaal waarin een voorverpakt levensmiddel als bedoeld in artikel 2, tweede
      lid, onder e, van verordening (EU) 1169/2011, is verpakt.
