  - number: '3'
    text: |-
      Voor de verplichte voedselinformatie en de vermeldingen op de etikettering, bedoeld in artikel 15, tweede lid, van
      verordening (EU) 1169/2011, wordt gebruik gemaakt van in ieder geval de Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0033323/2016-10-06#Artikel3
  - number: '4'
    text: |-
      1 Een levensmiddel wordt slechts in de handel gebracht indien het vergezeld gaat van een vermelding die het
      mogelijk maakt de partij waartoe dat levensmiddel behoort te identificeren. Deze vermelding wordt voorafgegaan door
      de letter «L», behalve in het geval waarin zij duidelijk van de overige vermeldingen op het etiket te onderscheiden
      is.

      2 In afwijking van het eerste lid mag de vermelding betreffende een partij van voorverpakt consumptie-ijs worden
      aangebracht op de verzamelverpakking van individuele porties van die waar.

      3 De in het eerste lid bedoelde vermeldingen worden aangebracht:

      a. op de voorverpakking of op een daaraan gehecht etiket; of

      b. op de verpakking of de recipiënt, of bij gebreke daarvan op de desbetreffende handelsdocumenten.

      4 De in het eerste en tweede lid bedoelde vermeldingen worden vastgesteld en aangebracht door:

      a. de producent;

      b. de fabrikant;

      c. de verpakker; of

      d. de eerste in de Europese Unie gevestigde verkoper;

      van het betrokken levensmiddel.
    url: https://wetten.overheid.nl/BWBR0033323/2016-10-06#Artikel4
  - number: '5'
    text: |-
      [Artikel 4][ref1] is niet van toepassing:

      a. indien de datum van minimale houdbaarheid of de uiterste consumptiedatum in de etikettering voorkomt, op
      voorwaarde dat de vermelding van deze datum duidelijk en in de juiste volgorde ten minste de dag en de maand omvat;

      b. op landbouwproducten die vanuit de bedrijfszone:

      1° aan opslag-, behandelings- of verpakkingsbedrijven worden verhandeld of afgeleverd;

      2° naar producentenorganisaties worden overgebracht; of

      3° voor onmiddellijke opneming in een operationeel bereidings- of verwerkingsysteem worden opgehaald;

      c. wanneer de levensmiddelen die op de plaats van verkoop aan de eindverbruiker niet zijn voorverpakt, aldaar op
      verzoek van de koper worden verpakt of voor onmiddellijke verkoop worden voorverpakt;

      d. op verpakkingen of recipiënten van levensmiddelen waarvan de grootste zijde een oppervlakte heeft van minder dan
      10 cm2.


      [ref1]: https://wetten.overheid.nl/BWBR0033323#Artikel4
    url: https://wetten.overheid.nl/BWBR0033323/2016-10-06#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0033323
        artikel: '4'
  - number: '6'
    text: |-
      1 De vermelding «doorstraald» of «behandeld met ioniserende straling», genoemd in bijlage VI, deel A, onderdeel 3,
      van verordening (EU) 1169/2011 wordt aangebracht:

      a. bij verpakte of voorverpakte producten: op het etiket;

      b. bij onverpakte producten: samen met de benaming van de waar op een affiche of een bord boven of naast de houder
      waarin het levensmiddel zich bevindt.

      2 Indien een doorstraald product als ingrediënt van een levensmiddel wordt gebruikt, wordt de in het eerste lid
      bedoelde vermelding van de doorstraling:

      a. toegevoegd aan de benaming van dat ingrediënt in de lijst van ingrediënten van dat levensmiddel; of

      b. bij onverpakte producten: samen met de benaming van de waar vermeld op een affiche of een bord boven of naast de
      houder waarin het levensmiddel zich bevindt.

      3 In alle gevallen wordt de doorstraling vermeld in de documenten die de doorstraalde levensmiddelen vergezellen of
      daarop betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0033323/2016-10-06#Artikel6
  - number: '7'
    text: |-
      1 Bij verpakte levensmiddelen zijn de volgende vermeldingen verplicht:

      a. de benaming, bedoeld in artikel 9, eerste lid, onder a, van verordening (EU) 1169/2011; en

      b. de vermelding, bedoeld in [artikel 4, eerste lid][ref1], inzake de vermelding die het mogelijk maakt de partij
      te identificeren waartoe een levensmiddel behoort.

      2 De in het eerste lid bedoelde vermeldingen zijn aangebracht:

      a. op de verpakking of de recipiënt; of, indien dat niet mogelijk is

      b. op het handelsdocument dat het desbetreffende levensmiddel vergezelt.


      [ref1]: https://wetten.overheid.nl/BWBR0033323#Artikel4
    url: https://wetten.overheid.nl/BWBR0033323/2016-10-06#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0033323
        artikel: '4'
  - number: '8'
    text: |-
      1 Bij onverpakte levensmiddelen is vermelding van de benaming, bedoeld in artikel 9, eerste lid, onder a, van
      verordening (EU) 1169/2011, verplicht.

      2 De in het eerste lid bedoelde vermelding:

      a. is duidelijk zichtbaar voor het publiek aangebracht:

      1° op het voorwerp waarin of waarop het betrokken levensmiddel zich bevindt; of

      2° op een boven het onder 1° bedoelde voorwerp geplaatst(e) bord of kaart; of

      b. wordt in de onmiddellijke omgeving van het levensmiddel op een andere duidelijke wijze ter kennis van het
      publiek gebracht.
    url: https://wetten.overheid.nl/BWBR0033323/2016-10-06#Artikel8
  - number: '9'
    text: |-
      In afwijking van de artikelen 9, eerste lid, en 10, eerste lid, van verordening (EU) 1169/2011, behoeven op glazen
      flessen die bestemd zijn om opnieuw te worden gebruikt en waarin melk of melkproducten zijn verpakt, slechts te
      worden vermeld:

      a. de datum van minimale houdbaarheid onderscheidenlijk de uiterste consumptiedatum; en

      b. de naam of handelsnaam en het adres van de exploitant van het desbetreffende levensmiddelenbedrijf, bedoeld in
      artikel 9, eerste lid, onder h, van verordening (EU) 1169/2011.
    url: https://wetten.overheid.nl/BWBR0033323/2016-10-06#Artikel9
  - number: '10'
    text: |-
      Bij regeling van Onze Minister kunnen worden vastgesteld:

      a. maatregelen als bedoeld in artikel 35, derde lid, van verordening (EU) 1169/2011, inzake het vergemakkelijken
      van het toezicht op het gebruik van extra uitdrukkings- en presentatievormen van de voedingswaardevermelding;

      b. bijkomende verplichte vermeldingen voor specifieke typen of categorieën levensmiddelen als bedoeld in artikel
      39, eerste lid, van verordening (EU) 1169/2011, die gerechtvaardigd zijn om ten minste een van de volgende redenen:

      1° bescherming van de volksgezondheid;

      2° bescherming van de consument;

      3° preventie van fraude;

      4° bescherming van aanduidingen van herkomst en oorsprong, en de preventie van oneerlijke concurrentie;

      c. maatregelen als bedoeld in artikel 42 van verordening (EU) 1169/2011;

      d. maatregelen als bedoeld in artikel 43 van verordening (EU) 1169/2011, met betrekking tot de vrijwillige
      vermelding van referentie-innames voor specifieke bevolkingsgroepen;

      e. maatregelen als bedoeld in artikel 44, tweede lid, van verordening (EU) 1169/2011, betreffende de middelen
      waarmee de in artikel 44, eerste lid, van verordening (EU) 1169/2011, bedoelde vermeldingen of elementen
      van vermeldingen beschikbaar moeten worden gesteld en, waar nodig, de daarvoor gebruikte uitdrukkings- of
      presentatievorm;

      f. maatregelen als bedoeld in bijlage VI, deel B, punt 3, van verordening (EU) 1169/2011, inzake het alleen
      in Nederland in de handel brengen van gehakt vlees dat niet voldoet aan de in bijlage VI, deel B, punt 1, van
      verordening (EU) 1169/2011, vastgestelde criteria.
    url: https://wetten.overheid.nl/BWBR0033323/2016-10-06#Artikel10
  - number: '11'
    text: |-
      1 Onverminderd [verordening (EG) 1924/2006](32006R1924) mag bij de verhandeling van een levensmiddel een door
      representatieve organisaties van producenten en verhandelaren ontwikkeld voedselkeuzelogo worden gebezigd, onder de
      volgende voorwaarden:

      a. het logo wordt niet gebezigd bij:

      1° alcoholhoudende dranken;

      2° volledige zuigelingenvoeding, opvolgzuigelingenvoeding, bewerkte levensmiddelen op basis van granen,
      babyvoeding, voeding voor medisch gebruik en de dagelijkse voeding volledig vervangende producten voor
      gewichtsbeheersing als bedoeld in verordening (EU) 609/2013; en

      3° voedingssupplementen als bedoeld in het [Warenwetbesluit voedingssupplementen][ref1];

      b. het logo is begrijpelijk voor de consument;

      c. de regels voor het gebruik van het logo zijn:

      1° in lijn met de door de Gezondheidsraad vastgestelde richtlijnen Goede Voeding;

      2° tot stand gekomen met inachtneming van de laatste wetenschappelijke inzichten ter zake;

      3° getoetst door een onafhankelijke wetenschappelijke commissie; en

      4° in ieder geval gesteld in de Nederlandse taal en voor een ieder te raadplegen op internet; en

      d. het voedselkeuzelogo en de regels voor het gebruik ervan zijn goedgekeurd door Onze Minister.

      2 Een verzoek tot goedkeuring van een voedselkeuzelogo en van de regels voor het gebruik ervan, wordt ingediend bij
      Onze Minister. De goedkeuring wordt verleend indien voldaan is aan de in dit artikel ter zake gestelde voorwaarden.
      De goedkeuring kan voor bepaalde tijd worden verleend.

      3 Onze Minister kan een in het tweede lid bedoelde goedkeuring intrekken indien het voedselkeuzelogo of de regels
      voor het gebruik ervan niet meer voldoen aan de in het tweede lid bedoelde voorwaarden.

      4 Onze Minister maakt een in het tweede en derde lid bedoeld besluit bekend in de Staatscourant.

      5 Bij regeling van Onze Minister kunnen nadere regels worden gesteld inzake het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0014814
    url: https://wetten.overheid.nl/BWBR0033323/2016-10-06#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0014814
  - number: '12'
    text: |-
      [Artikel 11][ref1] is niet van toepassing op het verhandelen van een levensmiddel ten aanzien waarvan een
      voedselkeuzelogo is gebezigd dat niet door toedoen van Nederland overeenkomstig [verordening (EG) 1924/2006]
      (32006R1924) is toegelaten, en dat rechtmatig is bereid of in de handel is gebracht in een andere lidstaat van de
      Europese Unie.


      [ref1]: https://wetten.overheid.nl/BWBR0033323#Artikel11
    url: https://wetten.overheid.nl/BWBR0033323/2016-10-06#Artikel12
