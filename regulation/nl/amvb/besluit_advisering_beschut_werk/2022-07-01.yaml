        artikel: 10b
  - number: '3'
    text: |-
      1 In het kader van de werkzaamheden, bedoeld in [artikel 2, eerste lid][ref1], verricht het Uitvoeringsinstituut
      werknemersverzekeringen onderzoek naar de vraag of de persoon met arbeidsvermogen bij het verrichten van
      werkzaamheden is aangewezen op:

      a. een of meer technische of organisatorische aanpassingen die niet binnen redelijke grenzen door een werkgever
      kunnen worden gerealiseerd;

      b. permanent toezicht of intensieve begeleiding die niet binnen redelijke grenzen door een werkgever kan worden
      aangeboden.

      2 Uitsluitend indien uit het onderzoek blijkt dat ten minste een van de vragen, genoemd in het eerste lid,
      onderdelen a of b, bevestigend wordt beantwoord, adviseert het Uitvoeringsinstituut werknemersverzekeringen aan
      het college om vast te stellen dat de persoon uitsluitend in een beschutte omgeving onder aangepaste omstandigheden
      mogelijkheden tot arbeidsparticipatie heeft.

      3 Het Uitvoeringsinstituut werknemersverzekeringen beantwoordt de vragen, genoemd in het eerste lid, onderdelen a
      en b, zonder onderzoek als bedoeld in het eerste lid beiden ontkennend:

      a. indien het advies is aangevraagd ten aanzien van een persoon die geïndiceerd is als bedoeld
      in de [Wet sociale werkvoorziening][ref2] of een nog geldende indicatiebeschikking heeft op
      grond van [artikel 11 van die wet][ref3], en ten aanzien van wie het Uitvoeringsinstituut
      werknemersverzekeringen heeft geadviseerd dat hij in staat is tot begeleid werken als bedoeld in
      [artikel 4, derde lid, van het Besluit uitvoering sociale werkvoorziening en begeleid werken][ref4], zoals die
      artikelen luidden voor de datum van inwerkingtreding van [artikel II van de Invoeringswet Participatiewet][ref5];

      b. indien het advies is aangevraagd door een persoon als bedoeld in
      [artikel 10b, derde lid, van de Participatiewet][ref6], en het Uitvoeringsinstituut werknemersverzekeringen in
      de twaalf maanden voorafgaand aan het verzoek ten aanzien van die persoon een advies heeft gegeven als bedoeld in
      artikel 10b, tweede of derde lid, van de Participatiewet.

      4 Het Uitvoeringsinstituut werknemersverzekeringen beantwoordt tenminste een van de vragen, genoemd in het eerste
      lid, onderdelen a en b, zonder onderzoek als bedoeld in het eerste lid bevestigend, indien het een advies betreft
      ten aanzien van een persoon die geïndiceerd is als bedoeld in de [Wet sociale werkvoorziening][ref7] of een
      nog geldende indicatiebeschikking heeft op grond van [artikel 11 van die wet][ref8] en ten aanzien van wie het
      Uitvoeringsinstituut werknemersverzekeringen heeft geadviseerd dat hij niet in staat is tot begeleid werken als
      bedoeld in [artikel 4, derde lid, van het Besluit uitvoering sociale werkvoorziening en begeleid werken][ref9],
      zoals die artikelen luidden voor de datum van inwerkingtreding van
      [artikel II van de Invoeringswet Participatiewet][ref10].

      5 In afwijking van het derde lid, onderdeel a, en het vierde lid, verricht het Uitvoeringsinstituut
      werknemersverzekeringen een onderzoek als bedoeld in het eerste lid wanneer de aanvrager vermeldt dat er sprake
      is van nieuw gebleken feiten of veranderde omstandigheden ten opzichte van de indicatiebeschikking, bedoeld in het
      derde lid, onderdeel a, en het vierde lid.

      6 In afwijking van het derde lid, onderdeel b, verricht het Uitvoeringsinstituut werknemersverzekeringen een
      onderzoek als bedoeld in het eerste lid wanneer de aanvrager die binnen twaalf maanden een nieuwe aanvraag indient,
      vermeldt dat er sprake is van nieuw gebleken feiten of veranderde omstandigheden ten opzichte van het eerdere
      advies van het Uitvoeringsinstituut werknemersverzekeringen, bedoeld in het derde lid, onderdeel b.

      7 Het Uitvoeringsinstituut werknemersverzekeringen kan bij de werkzaamheden, bedoeld in
      [artikel 10b, tweede en derde lid, van de Participatiewet][ref11], gebruik maken van de gegevens
      met betrekking tot iemands arbeidsvermogen die het in de twee jaar voorafgaand aan de aanvraag
      van het advies ten aanzien van een persoon heeft verkregen bij een onderzoek als bedoeld in
      [artikel 2:5, eerste lid, van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref12].
      Bij toepassing van het vijfde lid kan het Uitvoeringsinstituut werknemersverzekeringen gebruik
      maken van de gegevens die ten aanzien van die persoon zijn verkregen bij het onderzoek, bedoeld in
      [artikel 3, eerste lid, van het Besluit uitvoering sociale werkvoorziening en begeleid werken][ref13], zoals dat
      artikel luidde voor de datum van inwerkingtreding van [artikel II van de Invoeringswet Participatiewet][ref14].

      8 Het Uitvoeringsinstituut werknemersverzekeringen kan ten behoeve van de werkzaamheden, bedoeld in
      [artikel 10b, tweede en derde lid, van de Participatiewet][ref15] de hiervoor noodzakelijke gegevens opvragen bij
      scholen, begeleidende organisaties en werkgevers. Bij ministeriële regeling wordt geregeld wat onder noodzakelijke
      gegevens wordt verstaan.


