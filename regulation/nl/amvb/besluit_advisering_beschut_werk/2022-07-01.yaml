articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      - *college:* het college van burgemeester en wethouders, bedoeld in
      [artikel 40, eerste lid, van de Participatiewet][ref1];
      - *Uitvoeringsinstituut werknemersverzekeringen:* Het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
