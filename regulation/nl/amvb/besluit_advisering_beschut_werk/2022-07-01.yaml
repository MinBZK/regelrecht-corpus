    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 17 oktober 2014, nr. 2014-
