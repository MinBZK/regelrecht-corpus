  - number: '2'
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen verricht de werkzaamheden, bedoeld in
      [artikel 10b, tweede en derde lid, van de Participatiewet][ref1], en adviseert het college hierover binnen
      acht weken nadat het hiertoe van het college of van de persoon, bedoeld in artikel 10b, derde lid, van de
      Participatiewet, een verzoek heeft ontvangen.

      2 Bij ministeriële regeling kunnen regels worden gesteld voor de vergoeding van de kosten van de werkzaamheden,
      bedoeld in het eerste lid, door het college aan het Uitvoeringsinstituut werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel10b
    url: https://wetten.overheid.nl/BWBR0035947/2022-07-01#Artikel2
    references:
