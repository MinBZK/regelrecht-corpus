  - number: 1a
    text: |-
      Dit besluit berust mede op [artikel 73a van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel73a
    url: https://wetten.overheid.nl/BWBR0035947/2022-07-01#Artikel1a
