  - number: '15'
    text: |-
      1 De subsidie die een subsidie-ontvanger ontvangt wordt bepaald door:

      a. met elkaar te vermenigvuldigen:

      1°. het aantal kWh dat in elk kalenderjaar voor subsidie in aanmerking komt en waarvoor garanties van oorsprong
      zijn verstrekt die aantonen dat de producent met zijn productie-installatie voor hernieuwbare elektriciteit in het
      betreffende kalenderjaar een hoeveelheid hernieuwbare elektriciteit heeft geproduceerd en op een elektriciteitsnet
      heeft ingevoed, met

      2°. het voor het betreffende kalenderjaar op basis van [artikel 14][ref1] geldende gecorrigeerde basisbedrag, en

      b. de overeenkomstig onderdeel a berekende bedragen voor ieder kalenderjaar van de periode waarover subsidie wordt
      verstrekt bij elkaar op te tellen.

      2 Het aantal kWh dat jaarlijks voor subsidie in aanmerking komt bedraagt ten hoogste het in de beschikking
      tot subsidieverlening vastgestelde maximum aantal kWh dat per jaar kan verschillen en dat gebaseerd is op
      het vermogen van de installatie en het aantal vollasturen. Bij ministeriële regeling kan voor een categorie
      productie-installaties worden bepaald dat indien in een jaar minder kWh is geproduceerd dan het aantal kWh dat
      het betreffende jaar voor subsidie in aanmerking komt, het verschil in kWh bij het aantal kWh dat het volgende
      jaar voor subsidie in aanmerking komt wordt opgeteld. Bij ministeriële regeling kan een maximum, dat per jaar kan
      verschillen, worden gesteld aan het aantal kWh dat opgeteld wordt bij het aantal kWh dat het volgende jaar voor
      subsidie in aanmerking komt.

      3 Bij ministeriële regeling kan ten behoeve van de berekening van het maximum aantal kWh, bedoeld in het tweede
      lid, voor een categorie van productie-installaties een maximum aantal vollasturen worden bepaald.

      4 Indien een subsidie-ontvanger hernieuwbare elektriciteit opwekt met een bij ministeriële regeling aangewezen
      productie-installatie, wordt bij de toepassing van het eerste lid, onderdeel a, ten eerste, opgeteld het aantal kWh
      dat in elk kalenderjaar voor subsidie in aanmerking komt en waarvoor garanties van oorsprong voor niet-netlevering,
      bedoeld in [artikel 1 van de Regeling garanties van oorsprong voor duurzame elektriciteit][ref2] zijn verstrekt
      die aantonen dat de producent met zijn productie-installatie in het betreffende kalenderjaar een hoeveelheid
      hernieuwbare elektriciteit heeft geproduceerd en op een installatie, met uitzondering van de productie-installatie,
      heeft ingevoed.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0016021#Artikel1
