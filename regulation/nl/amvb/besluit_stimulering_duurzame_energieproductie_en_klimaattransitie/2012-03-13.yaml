  - number: '62'
    text: |-
      1 De subsidie-ontvanger realiseert en exploiteert de productie-installatie overeenkomstig het plan zoals ingediend
      bij de aanvraag om subsidie.

      2 De verplichting bedoeld in het eerste lid, geldt tot aan de dag waarop de subsidie wordt vastgesteld.

      3 Onze Minister kan voor het vertragen, het essentieel wijzigen of het stopzetten van de realisatie of
      exploitatie van de productie-installatie in afwijking van het plan op voorafgaand verzoek van de subsidie-
      ontvanger schriftelijk ontheffing verlenen van de verplichting, bedoeld in het eerste lid. Aan de ontheffing
      kunnen voorwaarden worden verbonden. Een ontheffing wordt niet verleend voor zover dit zou inhouden dat de
      subsidie-ontvanger de productie-installatie later in gebruik neemt dan een jaar na de dag waarop krachtens
      [artikel 61, eerste lid][ref1], de productie-installatie in gebruik dient te zijn genomen.

      4 Bij ministeriële regeling kunnen nadere verplichtingen voor de subsidie-ontvanger worden opgelegd, die kunnen
      verschillen per categorie van productie-installaties.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel61
    url: https://wetten.overheid.nl/BWBR0022735/2012-03-13#Artikel62
