  - number: '7'
    text: |-
      Bij ministeriële regeling wordt bepaald over welke periode voor een categorie productie-installaties
      subsidie wordt verstrekt. Deze periode kan verschillen voor verschillende categorieën productie-
      installaties of verschillende wijzen van verdeling van het beschikbare bedrag. Indien een categorie
      productie-installaties bij ministeriële regeling is aangewezen als een categorie productie-installaties
      als bedoeld in de [artikelen 15, tweede lid, tweede volzin][ref1], [23, tweede lid, tweede volzin][ref2],
      [32, tweede lid, tweede volzin][ref3], [40 tweede lid, tweede volzin][ref4], [48, tweede lid, tweede volzin][ref5],
      of [55, tweede lid, tweede volzin][ref6], kan Onze Minister op verzoek van de subsidie-ontvanger de periode
      waarover subsidie wordt verstrekt met maximaal een jaar verlengen om het ongebruikte aantal kWh, Nm3
      aardgasequivalent of GJ dat voor subsidie in aanmerking komt, te produceren.


