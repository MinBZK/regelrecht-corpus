      1 Bij de aanvraag tot subsidieverlening wordt door de producent een tenderbedrag per GJ opgegeven. Bij een
      gebundelde aanvraag is het door de producent opgegeven tenderbedrag van toepassing op alle aanvragen die deel
      uitmaken van de gebundelde aanvraag.

      2 Bij regeling van Onze Minister, na overleg met Onze Minister van Financiën, wordt per categorie productie-
      installaties een maximum tenderbedrag per GJ voor hernieuwbare warmte of hernieuwbare warmte en hernieuwbare
      elektriciteit bepaald.

      3 Het maximum tenderbedrag bedraagt maximaal de gemiddelde kosten per GJ voor het produceren van hernieuwbare
      warmte of hernieuwbare warmte en hernieuwbare elektriciteit per categorie van productie-installaties.
