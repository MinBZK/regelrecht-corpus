  - number: '57'
    text: |-
      1 Onze Minister beslist op een aanvraag:

      a. om een subsidie voor de productie van hernieuwbare elektriciteit, hernieuwbaar gas of hernieuwbare warmte die
      wordt verdeeld op volgorde van binnenkomst, binnen dertien weken na ontvangst van de aanvraag;

      b. om een subsidie voor hernieuwbare elektriciteit, hernieuwbaar gas of hernieuwbare warmte die wordt verdeeld op
      volgorde van rangschikking, binnen dertien weken na de laatste dag van de bij ministeriële regeling vastgestelde
      periode.

      2 De in het eerste lid genoemde perioden kunnen éénmaal met ten hoogste dertien weken worden verlengd.

      3 Indien een gebundelde aanvraag niet leidt tot subsidieverlening door Onze Minister, kan een gebundelde aanvraag
      worden behandeld als één aanvraag.

      4 Indien Onze Minister aan de aanvrager van een gebundelde aanvraag subsidie verstrekt, verstrekt Onze Minister per
      productie-installatie die onderdeel is van de gebundelde aanvraag een beschikking tot subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0022735/2012-03-13#Artikel57
  - number: '58'
    text: |-
      1 Ingeval van verdeling op volgorde van binnenkomst, verdeelt Onze Minister het beschikbare bedrag in de
      volgorde van ontvangst van de aanvragen, met dien verstande dat indien een aanvrager niet heeft voldaan
      aan enig wettelijk voorschrift voor het in behandeling nemen van de aanvraag en met toepassing van
      [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft gehad de aanvraag aan te vullen, de dag
      waarop de aanvraag voldoet aan de wettelijke voorschriften als datum van ontvangst geldt.

      2 Indien honorering van alle aanvragen die op één dag zijn ontvangen ertoe zou leiden dat het beschikbare
      subsidieplafond zou worden overschreden, worden steeds de aanvragen om subsidie met het laagste basisbedrag in
      één decimaal omgerekend naar euro per GJ geacht eerder te zijn ontvangen. Indien honorering van alle aanvragen
      om subsidie met hetzelfde basisbedrag in één decimaal die op één dag zijn ontvangen ertoe zou leiden dat het
      beschikbare subsidieplafond zou worden overschreden, stelt Onze Minister de volgorde van ontvangst van deze
      aanvragen vast door middel van loting.

      3 Bij ministeriële regeling wordt voor de omrekening van Nm3 aardgasequivalent naar GJ een omrekenfactor
      vastgesteld.

      4 Aanvragen die worden ontvangen op werkdagen na 17.00 uur of andere dagen, worden aangemerkt als ontvangen op de
      eerstvolgende werkdag.

      5 Bij de toepassing van het tweede lid:

      a. wordt bij de vergelijking van de basisbedragen het basisbedrag van een productie-installatie voor de productie
      van hernieuwbare elektriciteit met behulp van windenergie gedeeld door 1,25;

      b. wordt een gebundelde aanvraag behandeld als één aanvraag, waarbij als basisbedrag geldt het basisbedrag van de
      aanvraag met het hoogste basisbedrag van de bundel;

      c. worden bij de loting alle op de betreffende dag ontvangen aanvragen met hetzelfde basisbedrag in één decimaal
      betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel45
