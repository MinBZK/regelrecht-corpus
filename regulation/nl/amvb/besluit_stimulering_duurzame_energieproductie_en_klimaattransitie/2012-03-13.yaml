  - number: '68'
    text: |-
      1 Onze Minister verstrekt de in [artikel 67, eerste, tweede en derde lid][ref1], bedoelde voorschotten in
      maandelijkse bedragen, tenzij bij ministeriële regeling is bepaald dat voor een bepaalde categorie productie-
      installaties het voorschot in een jaarlijks bedrag wordt verstrekt. De som van de maandelijkse bedragen of van het
      jaarlijkse bedrag bedraagt niet meer dan 80% van het product van:

      a. het aantal kWh, GJ of Nm3 aardgasequivalent dat volgens de beschikking tot subsidieverlening in het kalenderjaar
      waarop het voorschot betrekking heeft voor subsidie in aanmerking komt, en

      b. het basisbedrag dan wel het tenderbedrag verminderd met de op grond van de [artikelen 14, zesde lid][ref2],
      [31, vijfde lid][ref3], of [47, vijfde lid][ref4], dan wel de [artikelen 22, zesde lid][ref5],
      [39, vijfde lid][ref6], of [54, vijfde lid][ref7],vastgestelde correcties.

      2 Indien de som van de maandelijkse bedragen of van het jaarlijkse bedrag die in een kalenderjaar zijn verstrekt
      minder dan wel meer bedraagt dan de hoogte van het voorschot dat na afloop van het kalenderjaar wordt vastgesteld,
      kan Onze Minister dit verrekenen met de nog te verstrekken maandelijkse of jaarlijkse bedragen.

      3 Bij ministeriële regeling worden regels gesteld over de berekening van de maandelijkse bedragen en van het
      jaarlijkse bedrag.


