  - number: '48'
    text: |-
      1 De subsidie die een subsidie-ontvanger ontvangt wordt bepaald door:

      a. met elkaar te vermenigvuldigen:

      1°. het aantal GJ dat in elk kalenderjaar voor subsidie in aanmerking komt en waarvoor garanties van oorsprong
      aantonen dat de producent met zijn productie-installatie voor hernieuwbare warmte en hernieuwbare elektriciteit
      in het betreffende kalenderjaar een hoeveelheid hernieuwbare warmte heeft geproduceerd die nuttig is gebruikt en
      hernieuwbare elektriciteit heeft geproduceerd en op een elektriciteitsnet heeft ingevoed, met

      2°. het voor het betreffende kalenderjaar op basis van [artikel 47][ref1] geldende gecorrigeerde basisbedrag, en

      b. de overeenkomstig onderdeel a berekende bedragen voor ieder kalenderjaar van de periode waarover subsidie wordt
      verstrekt bij elkaar op te tellen.

      2 Het aantal GJ dat jaarlijks voor subsidie in aanmerking komt bedraagt ten hoogste het in de beschikking tot
      subsidieverlening vastgestelde maximum aantal GJ dat per jaar kan verschillen en dat gebaseerd is op het vermogen
      van de installatie en het aantal vollasturen. Bij ministeriële regeling kan voor een categorie productie-
      installaties worden bepaald dat indien in een jaar minder GJ is geproduceerd dan het aantal GJ dat het betreffende
      jaar voor subsidie in aanmerking komt, het verschil in GJ bij het aantal GJ dat het volgende jaar voor subsidie
      in aanmerking komt wordt opgeteld. Bij ministeriële regeling kan een maximum, dat per jaar kan verschillen, worden
      gesteld aan het aantal GJ dat opgeteld wordt bij het aantal GJ dat het volgende jaar voor subsidie in aanmerking
      komt.

      3 Bij ministeriële regeling kan ten behoeve van de berekening van het maximum aantal GJ, bedoeld in het tweede lid,
      voor een categorie van productie-installaties een maximum aantal vollasturen worden bepaald.

      4 Indien een subsidie-ontvanger uitsluitend hernieuwbare warmte produceert wordt voor de berekening van de subsidie
      in afwijking van het eerste lid, onderdeel a, ten eerste, genomen het aantal GJ dat in elk kalenderjaar voor
      subsidie in aanmerking komt en waarvoor de producent kan aantonen dat hij met zijn productie-installatie voor
      hernieuwbare warmte in het betreffende kalenderjaar een hoeveelheid hernieuwbare warmte heeft geproduceerd die
      nuttig is gebruikt.

      5 Indien een subsidie-ontvanger hernieuwbare warmte en hernieuwbare elektriciteit produceert
      met een bij ministeriële regeling aangewezen productie-installatie, wordt bij de toepassing van
      het eerste lid, onderdeel a, ten eerste, opgeteld het aantal GJ dat in elk kalenderjaar voor
      subsidie in aanmerking komt en waarvoor garanties van oorsprong voor niet-netlevering, bedoeld in
      [artikel 1 van de Regeling garanties van oorsprong voor duurzame elektriciteit][ref2] zijn verstrekt die aantonen
      dat de producent met zijn productie-installatie in het betreffende kalenderjaar een hoeveelheid hernieuwbare
      elektriciteit heeft geproduceerd en op de eigen installatie heeft ingevoed.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0016021#Artikel1
