  - number: '6'
    text: |-
      1 De periode waarover subsidie wordt verstrekt vangt aan op de door de subsidie-ontvanger in de aanvraag aangegeven
      datum, met dien verstande dat de periode waarover subsidie wordt verstrekt niet later aanvangt dan binnen de op
      grond van [artikel 61, eerste lid][ref1], vastgestelde termijn waarbinnen de productie-installatie in gebruik moet
      worden genomen.

      2 Onze Minister kan op verzoek van de subsidie-ontvanger voorafgaand aan de periode waarover subsidie wordt
      verstrekt, het tijdstip van aanvang van de periode waarover subsidie wordt verstrekt maximaal driemaal
      wijzigen met dien verstande dat dit tijdstip niet later wordt vastgesteld dan binnen de op grond van
      [artikel 61, eerste lid][ref2], vastgestelde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0022735#Artikel61
