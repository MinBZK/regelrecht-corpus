  - number: '2'
    text: |-
      1 Onze Minister kan op aanvraag subsidie verstrekken voor:

      a. de productie van hernieuwbare elektriciteit aan een producent van hernieuwbare elektriciteit om gedurende een
      bepaalde periode het verschil tussen de gemiddelde kostprijs van deze hernieuwbare elektriciteit en de relevante
      gemiddelde marktprijs van elektriciteit geheel of gedeeltelijk te compenseren;

      b. de productie van hernieuwbaar gas aan een producent van hernieuwbaar gas om gedurende een bepaalde periode het
      verschil tussen de gemiddelde kostprijs van dit hernieuwbaar gas en de relevante gemiddelde marktprijs van gas
      geheel of gedeeltelijk te compenseren;

      c. de productie van hernieuwbare warmte aan een producent van hernieuwbare warmte om gedurende een bepaalde periode
      het verschil tussen de gemiddelde kostprijs van deze hernieuwbare warmte en de relevante gemiddelde marktprijs van
      warmte geheel of gedeeltelijk te compenseren.

      2 Bij ministeriële regeling wordt, na overleg met Onze Minister van Financiën, per categorie productie-installaties
      een afzonderlijk subsidieplafond of voor meerdere categorieën tezamen één subsidieplafond vastgesteld voor het
      verlenen van subsidies voor de productie van hernieuwbare elektriciteit, hernieuwbaar gas of hernieuwbare warmte.

      3 Bij ministeriële regeling wordt de wijze van verdeling van een subsidieplafond bepaald.

      4 Bij ministeriële regeling kunnen perioden worden vastgesteld waarbinnen de aanvragen ontvangen moeten zijn.
    url: https://wetten.overheid.nl/BWBR0022735/2012-03-13#Artikel2
  - number: '3'
    text: |-
      1 Geen subsidie als bedoeld in [artikel 2, eerste lid,][ref1] wordt verstrekt indien voor dezelfde productie-
      installatie reeds op grond van [artikel 72m van de Elektriciteitswet 1998][ref2] subsidie van meer dan € 0,00 is
      verstrekt, tenzij:

      a. het een productie-installatie betreft die behoort een bij ministeriële regeling aangewezen categorie productie-
      installaties en waarvan voor het eerst geproduceerde hernieuwbare warmte nuttig zal worden gebruikt;

      b. de productie-installatie ingrijpend wordt uitgebreid in capaciteit of geheel wordt vervangen;

      c. het een productie-installatie betreft die ingrijpend wordt gerenoveerd en behoort tot een bij ministeriële
      regeling aangewezen categorie te renoveren productie-installaties;

      d. het een productie-installatie betreft die behoort tot een bij ministeriële regeling aangewezen categorie
      productie-installaties waarmee hernieuwbare elektriciteit hernieuwbaar gas, hernieuwbare warmte of hernieuwbare
      warmte en hernieuwbare elektriciteit wordt geproduceerd door middel van biomassa;

      e. er op de datum van de aanvraag van subsidie op grond van dit besluit geen voorschotten op grond van
      [artikel 72w van de Elektriciteitswet 1998][ref3] zoals dat luidde op 31 december 2006 zijn verstrekt en de periode
      waarover op grond van [artikel 72m van de Elektriciteitswet 1998][ref4] zoals dat luidde op 31 december 2006
      subsidie is verstrekt, is aangevangen op 31 december 2007.

      2 Geen subsidie als bedoeld in [artikel 2, eerste lid,][ref5] wordt verstrekt indien voor dezelfde productie-
      installatie reeds op grond van [artikel 2 van de Subsidieregeling opwekken duurzame elektriciteit in
      vergistingsinstallaties](onbekend), tenzij:

      a. het een productie-installatie betreft die behoort tot een bij ministeriële regeling aangewezen categorie
      productie-installaties waarmee hernieuwbare elektriciteit hernieuwbaar gas, hernieuwbare warmte of hernieuwbare
      warmte en hernieuwbare elektriciteit wordt geproduceerd door middel van biomassa;

      b. de productie-installatie ingrijpend wordt uitgebreid in capaciteit of geheel wordt vervangen;

      c. het een productie-installatie betreft die ingrijpend wordt gerenoveerd en behoort tot een bij ministeriële
      regeling aangewezen categorie te renoveren productie-installaties;

      d. het een productie-installatie betreft die behoort een bij ministeriële regeling aangewezen categorie productie-
      installaties en waarvan voor het eerst geproduceerde hernieuwbare warmte nuttig zal worden gebruikt.

      3 Geen subsidie als bedoeld in [artikel 2, eerste lid,][ref6] wordt verstrekt indien voor dezelfde productie-
      installatie reeds op grond van dit besluit subsidie is verstrekt, tenzij:

      a. het een productie-installatie betreft die behoort tot een bij ministeriële regeling aangewezen categorie
      productie-installaties waarmee hernieuwbare elektriciteit hernieuwbaar gas, hernieuwbare warmte of hernieuwbare
      warmte en hernieuwbare elektriciteit wordt geproduceerd door middel van biomassa;

      b. de productie-installatie ingrijpend wordt uitgebreid in capaciteit of geheel wordt vervangen;

      c. het een productie-installatie betreft die ingrijpend wordt gerenoveerd en behoort tot een bij ministeriële
      regeling aangewezen categorie te renoveren productie-installaties;

      d. het een productie-installatie betreft waarvoor reeds eerder subsidie op grond van dit besluit is verstrekt voor
      een of meer periodes van een bij ministeriële regeling te bepalen duur;

      e. de productie-installatie niet in gebruik is genomen, er tenminste vijf jaren zijn verstreken na de datum van de
      beschikking tot subsidieverlening en die beschikking door Onze Minister is ingetrokken.

      4 Geen subsidie als bedoeld in [artikel 2, eerste lid,][ref7] wordt verstrekt indien de productie-installatie
      in gebruik is genomen voor de datum waarop de subsidie is aangevraagd en waarvoor geen subsidie op grond
      van [artikel 72m van de Elektriciteitswet 1998][ref8], [artikel 2 van de Subsidieregeling opwekken duurzame
      elektriciteit in vergistingsinstallaties](onbekend) of dit besluit is verstrekt, tenzij:

      a. de productie-installatie ingrijpend wordt uitgebreid in capaciteit of geheel wordt vervangen;

      b. het een productie-installatie betreft die behoort tot een bij ministeriële regeling aangewezen categorie
      productie-installaties en die ingrijpend wordt gerenoveerd;

      c. het een bestaande productie-installatie betreft die behoort tot een bij ministeriële regeling aangewezen
      categorie productie-installaties en die voor het eerst gebruik zal maken van hernieuwbare energiebronnen;

      d. het een bestaande productie-installatie voor de productie van hernieuwbare warmte en hernieuwbare elektriciteit
      betreft die behoort tot een bij ministeriële regeling aangewezen categorie productie-installaties en die voor het
      eerst de warmte nuttig zal gebruiken.

      5 Geen subsidie als bedoeld in [artikel 2, eerste lid,][ref9] wordt verstrekt indien een productie-installatie
      geheel of gedeeltelijk bestaat uit gebruikte materialen, tenzij het een productie-installatie betreft die behoort
      tot een bij ministeriële regeling aangewezen categorie productie-installaties.

      6 Bij ministeriële regeling kunnen regels worden gesteld over de toepassing van het tweede tot en met het vijfde
      lid en het zevende lid.

      7 Geen subsidie als bedoeld in [artikel 2, eerste lid,][ref10] wordt verstrekt indien de productie-installatie
      hernieuwbare elektriciteit of hernieuwbare warmte opwekt uit een hernieuwbare energiebron die geheel of
      gedeeltelijk bestaat uit hernieuwbaar gas dat afkomstig is uit een of meerdere productie-installaties waaraan op
      grond van dit besluit subsidie is verstrekt.


