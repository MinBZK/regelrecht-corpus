  - number: '46'
    text: |-
      Het basisbedrag, bedoeld in [artikel 44][ref1], en de basisenergieprijs, bedoeld in [artikel 45][ref2], die gelden
      op het moment van aanvraag van de subsidie, gelden gedurende de gehele periode waarover subsidie wordt verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0022735#Artikel45
    url: https://wetten.overheid.nl/BWBR0022735/2012-03-13#Artikel46
