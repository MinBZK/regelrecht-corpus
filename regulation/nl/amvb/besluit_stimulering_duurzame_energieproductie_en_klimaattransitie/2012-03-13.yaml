  - number: 24a
    text: |-
      1 Onze Minister kan op aanvraag aan een producent van hernieuwbare elektriciteit geproduceerd door een productie-
      installatie voor de productie van hernieuwbare elektriciteit met behulp van windenergie op zee, aan wie een
      subsidie als bedoeld in [artikel 2, eerste lid, onderdeel a][ref1], is verstrekt, subsidie verstrekken voor de
      bijzondere en risicovolle inzet van innovatieve windmolens.

      2 Bij ministeriële regeling worden nadere regels gesteld over de verstrekking van deze subsidie, waarbij in ieder
      geval regels worden gesteld over de productie-installaties waarvoor deze subsidie wordt verstrekt, de vorm van de
      subsidie, de aanvraag van een subsidie en de besluitvorming daarover, het bedrag van de subsidie dan wel de wijze
      waarop dit bedrag wordt bepaald, de vaststelling van de subsidie en de betaling van de subsidie en het verlenen
      van voorschotten.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel2
    url: https://wetten.overheid.nl/BWBR0022735/2012-03-13#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0022735
        artikel: '2'
        paragraaf: '2'
  - number: '25'
    text: |-
      Aan de producent van hernieuwbaar gas dat is geproduceerd door een bij regeling van Onze Minister aan te wijzen
      categorie productie-installaties voor hernieuwbaar gas, kan subsidie worden verleend.
    url: https://wetten.overheid.nl/BWBR0022735/2012-03-13#Artikel25
  - number: '26'
    text: |-
      De bepalingen in deze paragraaf gelden indien ingevolge [artikel 2, derde lid][ref1], wordt gekozen voor verdeling
      op volgorde van binnenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel2
    url: https://wetten.overheid.nl/BWBR0022735/2012-03-13#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0022735
        artikel: '2'
        paragraaf: '2'
  - number: '28'
    text: |-
      1 Bij regeling van Onze Minister, na overleg met Onze Minister van Financiën, wordt per categorie productie-
      installaties een basisbedrag per Nm3 aardgasequivalent of GJ vastgesteld voor de subsidie voor de productie van
      hernieuwbaar gas.

      2 Het basisbedrag bedraagt ten hoogste de gemiddelde kosten per Nm3 aardgasequivalent of GJ voor het produceren van
      hernieuwbaar gas per categorie van productie-installaties.

      3 Voor de Nm3 aardgasequivalent of GJ die voor subsidie in aanmerking komen kunnen verschillende basisbedragen
      gelden die zijn gerelateerd aan:

      a. de hoeveelheid geproduceerde Nm3 aardgasequivalent of GJ die voor subsidie in aanmerking komt;

      b. het aantal vollasturen van de productie-installatie;

      c. het rendement van de productie-installatie.
    url: https://wetten.overheid.nl/BWBR0022735/2012-03-13#Artikel28
  - number: '29'
    text: |-
      1 Bij regeling van Onze Minister, na overleg met Onze Minister van Financiën, wordt ten behoeve van de correctie
      van het basisbedrag, bedoeld in [artikel 31][ref1] en de vaststelling van het bedrag dat de subsidie ten hoogste
      bedraagt, bedoeld in [artikel 33][ref2], een basisenergieprijs per Nm3 aardgasequivalent of GJ vastgesteld die kan
      verschillen per categorie productie-installaties.

      2 De hoogte van de basisenergieprijs bedraagt tweederde van de lange termijn gasprijs voor de betreffende
      toepassing van het gas.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0022735#Artikel33
    url: https://wetten.overheid.nl/BWBR0022735/2012-03-13#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0022735
        artikel: '31'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0022735
        artikel: '33'
        paragraaf: '4'
  - number: '30'
    text: |-
      Het basisbedrag, bedoeld in [artikel 28][ref1], en de basisenergieprijs, bedoeld in [artikel 29][ref2], die gelden
      op het moment van aanvraag van de subsidie, gelden gedurende de gehele periode waarover subsidie wordt verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0022735#Artikel29
    url: https://wetten.overheid.nl/BWBR0022735/2012-03-13#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0022735
        artikel: '28'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0022735
        artikel: '29'
        paragraaf: '4'
  - number: '31'
    text: |-
      1 Voor elke subsidie-ontvanger geldt dat het basisbedrag in elk kalenderjaar van de periode waarover subsidie wordt
      verstrekt wordt gecorrigeerd met:

      a. de energieprijs of, indien de energieprijs lager is dan de in [artikel 29][ref1] bedoelde basisenergieprijs, de
      in artikel 29 bedoelde basisenergieprijs;

      b. andere bij ministeriële regeling vast te stellen correcties die een substantiële invloed hebben op het verschil
      tussen de gemiddelde kostprijs van de hernieuwbaar gas en de relevante gemiddelde marktprijs van gas en die
      voortvloeien uit maatregelen van de overheid.

      2 De energieprijs, bedoeld in het eerste lid, onderdeel a, bedraagt de gemiddelde waarde voor gas voor de
      betreffende toepassing van het gas.

      3 In de beschikking tot subsidieverlening kan Onze Minister bepalen dat, in aanvulling op het eerste lid, het
      basisbedrag wordt gecorrigeerd met een bedrag per Nm3 aardgasequivalent of GJ in verband met opbrengsten die
      voor de subsidie-ontvanger voortvloeien uit het systeem van verhandelbare broeikasgasemissierechten, bedoeld in
      [titel 16.2 van de Wet milieubeheer][ref2].

      4 Bij ministeriële regeling worden jaarlijks voor 1 april de in het eerste en derde lid bedoelde correcties
      vastgesteld, die kunnen verschillen per categorie productie-installaties.

      5 Ten behoeve van de voorschotverlening worden bij ministeriële regeling jaarlijks voor 1 november de in het
      eerste en derde lid bedoelde correcties voor het volgende kalenderjaar vastgesteld, die kunnen verschillen per
      categorie productie-installaties, waarbij voor de energieprijs de gemiddelde waarde in de periode 1 oktober tot en
      met 30 september voorafgaand aan het kalenderjaar wordt gehanteerd. Indien na 1 november bij ministeriële regeling
      een andere categorie productie-installaties wordt aangewezen waarvoor subsidie kan worden aangevraagd, worden de
      in het eerste en derde lid bedoelde correcties ten behoeve van de voorschotverlening voor die categorie productie-
      installaties bij die ministeriële regeling vastgesteld.

      6 Indien een productie-installatie geheel of gedeeltelijk bestaat uit gebruikte materialen, kan Onze Minister
      in de beschikking tot subsidieverlening een correctie op het ingevolge het eerste lid geldende subsidiebedrag
      vaststellen.

      7 Indien een productie-installatie ingrijpend wordt gerenoveerd, kan Onze Minister in de beschikking tot
      subsidieverlening een correctie op het ingevolge het eerste lid geldende subsidiebedrag vaststellen.

      8 Indien het ingevolge het eerste, derde, zesde of zevende lid geldende bedrag negatief is, bedraagt het bedrag
      nul.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0022735/2012-03-13#Artikel31
    references:
