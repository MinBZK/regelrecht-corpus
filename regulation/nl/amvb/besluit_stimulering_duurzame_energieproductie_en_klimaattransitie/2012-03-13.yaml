  - number: '60'
    text: |-
      1 Onze Minister rangschikt de aanvragen waarop niet met toepassing van het [artikel 59][ref1] afwijzend wordt
      beslist zodanig dat een aanvraag hoger wordt gerangschikt indien:

      a. voor hernieuwbare elektriciteit, hernieuwbaar gas of hernieuwbare warmte het tenderbedrag per kWh, Nm3
      aardgasequivalent of GJ lager is;

      b. er meer sprake is van technologische- of brandstofinnovatie;

      c. voor de productie van hernieuwbare elektriciteit, hernieuwbaar gas of hernieuwbare warmte sprake is van meer
      netto broeikasgas-reductie ten opzichte van de productie van energie uit niet-hernieuwbare bronnen.

      2 Voor de rangschikking kunnen bij ministeriële regeling regels worden vastgesteld met betrekking tot:

      a. wegingsfactoren voor de criteria, bedoeld in het eerste lid;

      b. de toepassing van de criteria, bedoeld in het eerste lid.

      3 Onze Minister verdeelt het beschikbare bedrag in de volgorde van rangschikking van de aanvragen.

      4 Indien honorering van alle aanvragen die gelijk zijn gerangschikt ertoe zou leiden dat het beschikbare
      subsidieplafond zou worden overschreden, stelt Onze Minister de onderlinge rangschikking van deze aanvragen vast
      door middel van loting.

      5 Een gebundelde aanvraag wordt voor de toepassing van dit artikel behandeld als één aanvraag.

      6 Ten behoeve van de rangschikking van aanvragen om subsidie voor een productie-installatie voor de productie van
      hernieuwbare elektriciteit met behulp van windenergie op zee kan Onze Minister het door de producent opgegeven
      tenderbedrag met een bij ministeriële regeling vastgesteld bedrag verminderen, dat gerelateerd is aan de afstand
      van een productie-installatie tot de kust.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel59
    url: https://wetten.overheid.nl/BWBR0022735/2012-03-13#Artikel60
