      elektriciteit die niet op een elektriciteitsnet wordt ingevoed dan geldt voor het aantal kWh dat niet op een
      elektriciteitsnet is ingevoed bij de toepassing van het derde lid en de artikelen 21, tweede lid, 22, eerste
      lid, onderdeel a, en tweede lid, en 24 de basiselektriciteitsprijs of elektriciteitsprijs voor niet op een
      elektriciteitsnet ingevoede elektriciteit.


