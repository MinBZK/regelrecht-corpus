      De subsidie bedraagt ten hoogste het verschil tussen het basisbedrag, bedoeld in [artikel 28][ref1], en de
      basisenergieprijs, bedoeld in [artikel 29][ref2], vermenigvuldigd met het in de beschikking tot subsidieverlening
      voor de gehele periode waarover subsidie wordt verstrekt bepaald maximum aantal Nm3 aardgasequivalent of GJ.


