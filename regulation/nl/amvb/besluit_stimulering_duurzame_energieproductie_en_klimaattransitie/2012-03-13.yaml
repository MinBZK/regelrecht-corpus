  - number: 55a
    text: |-
      De subsidie bedraagt ten hoogste het verschil tussen het tenderbedrag, bedoeld in [artikel 51][ref1], en de
      basisenergieprijs, bedoeld in [artikel 52][ref2], vermenigvuldigd met het in de beschikking tot subsidieverlening
      voor de gehele periode waarover subsidie wordt verstrekt bepaald maximum aantal GJ.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0022735#Artikel52
