  - number: '5'
    text: |-
      Indien sprake is van een situatie als bedoeld in
      [artikel 3, eerste lid, onderdeel b, derde lid, onderdeel b of vierde lid, onderdeel a][ref1], komt uitsluitend
      hernieuwbare elektriciteit, hernieuwbaar gas en hernieuwbare warmte die als gevolg van deze uitbreiding extra is
      geproduceerd voor subsidie in aanmerking.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel3
