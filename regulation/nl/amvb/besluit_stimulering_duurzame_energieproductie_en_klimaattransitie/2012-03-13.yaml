  - number: '56'
    text: |-
      1 Een aanvraag om subsidieverlening wordt ingediend met gebruikmaking van een formulier, overeenkomstig het model
      dat bij ministeriële regeling is vastgesteld. Onze Minister kan bij ministeriële regeling een of meer categorieën
      productie-installaties aanwijzen waarvoor een gebundelde aanvraag kan worden ingediend. Bij ministeriële regeling
      kan voor een categorie productie-installaties worden bepaald dat per openstellingsperiode of per kalenderjaar per
      adres waarop een productie-installatie is of wordt geplaatst maximaal één aanvraag kan worden ingediend.

      2 Indien dit op het formulier is vermeld, gaat een aanvraag vergezeld van:

      a. een omschrijving van iedere productie-installatie waarvoor subsidie wordt aangevraagd;

      b. een onderbouwde opgave van de hoeveelheid op te wekken en in te voeden kWh, GJ of Nm3 per kalenderjaar gedurende
      de periode waarover subsidie wordt verstrekt van iedere productie-installatie;

      c. de voor de productie-installatie verleende vergunningen krachtens de
      [Wet algemene bepalingen omgevingsrecht][ref1], de [Wet beheer rijkswaterstaatswerken][ref2],
      [hoofdstuk 6, paragraaf 6, van het Waterbesluit][ref3] of de [Mijnbouwwet][ref4];

      d. een plan voor het in gebruik nemen en exploiteren van iedere productie-installatie;

      e. een financiële onderbouwing van iedere productie-installatie waarvoor subsidie wordt aangevraagd;

      f. indien de subsidie-aanvrager een samenwerkingsverband is, een overzicht van de deelnemers aan het
      samenwerkingsverband;

      g. overige op het formulier aangegeven bescheiden.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld over de gegevens die op grond van lid 2, onderdelen
      a tot en met g, overgelegd moeten worden.


      [ref1]: https://wetten.overheid.nl/BWBR0024779
      [ref2]: https://wetten.overheid.nl/BWBR0008331
      [ref3]: https://wetten.overheid.nl/BWBR0026872#Paragraaf6
      [ref4]: https://wetten.overheid.nl/BWBR0014168
