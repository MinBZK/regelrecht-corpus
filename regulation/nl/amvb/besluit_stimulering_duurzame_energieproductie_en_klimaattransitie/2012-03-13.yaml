  - number: '75'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0022735/2012-03-13#Artikel75
  - number: '76'
    text: 'Dit besluit wordt aangehaald als: Besluit stimulering duurzame energieproductie.'
    url: https://wetten.overheid.nl/BWBR0022735/2012-03-13#Artikel76
