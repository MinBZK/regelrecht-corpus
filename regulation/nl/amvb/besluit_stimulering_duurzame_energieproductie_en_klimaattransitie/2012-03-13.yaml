        artikel: '12'
        paragraaf: '3'
  - number: '14'
    text: |-
      1 Voor elke subsidie-ontvanger geldt dat het basisbedrag in elk kalenderjaar van de periode waarover subsidie wordt
      verstrekt wordt gecorrigeerd met:

      a. de elektriciteitsprijs of, indien de elektriciteitsprijs lager is dan de in [artikel 12][ref1] bedoelde
      basiselektriciteitsprijs, de in [artikel 12][ref2] bedoelde basiselektriciteitsprijs;

      b. de waarde van garanties van oorsprong;

      c. andere bij ministeriële regeling vast te stellen correcties die een substantiële invloed hebben op het
      verschil tussen de gemiddelde kostprijs van hernieuwbare elektriciteit en de relevante gemiddelde marktprijs van
      elektriciteit en die voortvloeien uit maatregelen van de overheid.

      2 De elektriciteitsprijs, bedoeld in het eerste lid, onderdeel a, bedraagt de gemiddelde waarde voor elektriciteit,
      verminderd met de profielkosten van elektriciteitslevering aan het net en de onbalanskosten.

      3 Indien elektriciteit wordt opgewekt uit wind, wordt het bedrag, bedoeld in het eerste lid vermenigvuldigd met de
      factor 1,25.

      4 In de beschikking tot subsidieverlening kan Onze Minister bepalen dat, in aanvulling op het eerste
      lid, het basisbedrag wordt gecorrigeerd met een bedrag per kWh in verband met de opbrengsten die voor de
      subsidie-ontvanger voortvloeien uit het systeem van verhandelbare broeikasgasemissierechten, bedoeld in
      [titel 16.2 van de Wet milieubeheer][ref3].

      5 Bij ministeriële regeling worden jaarlijks voor 1 april de in het eerste en vierde lid bedoelde correcties en
      de in het tweede lid bedoelde profielkosten van elektriciteitslevering aan het net en onbalanskosten voor het
      voorgaande kalenderjaar vastgesteld, die kunnen verschillen per categorie productie-installaties en binnen een
      categorie productie-installaties indien op grond van [artikel 12][ref4] verschillende basiselektriciteitsprijzen
      voor een categorie productie-installaties zijn vastgesteld.

      6 Ten behoeve van de voorschotverlening worden bij ministeriële regeling jaarlijks voor 1 november de in het eerste
      en vierde lid bedoelde correcties voor het volgende kalenderjaar vastgesteld, die kunnen verschillen per categorie
      productie-installaties en binnen een categorie productie-installaties indien op grond van [artikel 12][ref5]
      verschillende basiselektriciteitsprijzen voor een categorie productie-installaties zijn vastgesteld en waarbij voor
      de elektriciteitsprijs de gemiddelde waarde in de periode 1 oktober tot en met 30 september voorafgaand aan het
      kalenderjaar wordt gehanteerd en voor de profielkosten van elektriciteitslevering aan het net en onbalanskosten de
      waarden die op grond van het vierde lid zijn vastgesteld. Indien na 1 november bij ministeriële regeling een andere
      categorie productie-installaties wordt aangewezen waarvoor subsidie kan worden aangevraagd, worden de in het eerste
      en vierde lid bedoelde correcties ten behoeve van de voorschotverlening voor die categorie productie-installaties
      bij die ministeriële regeling vastgesteld.

      7 Indien een productie-installatie geheel of gedeeltelijk bestaat uit gebruikte materialen, kan Onze Minister in de
      beschikking tot subsidieverlening een correctie op het ingevolge het eerste lid geldende bedrag vaststellen.

      8 Indien een productie-installatie ingrijpend wordt gerenoveerd, kan Onze Minister in de beschikking tot
      subsidieverlening een correctie op het ingevolge het eerste lid geldende bedrag vaststellen.

      9 Indien het ingevolge het eerste, vierde, zevende of achtste lid geldende bedrag negatief is, bedraagt het bedrag
      nul.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel12
