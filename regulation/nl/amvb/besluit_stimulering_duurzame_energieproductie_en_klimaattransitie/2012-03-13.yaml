      - id: ref1
        bwb_id: BWBR0022735
        artikel: '61'
        paragraaf: '7'
  - number: '63'
    text: |-
      1 In de beschikking tot subsidieverlening kan aan de subsidie-ontvanger de verplichting tot het indienen van ten
      hoogste één maal per kalenderjaar van een tussentijds voortgangsverslag worden opgelegd dat betrekking heeft op:

      a. de duurzaamheid van biomassa waarmee hernieuwbare elektriciteit, hernieuwbaar gas of hernieuwbare warmte wordt
      opgewekt;

      b. monitorgegevens over de bouw, productie, uitval en onderhoud van de productie-installatie.

      2 Bij ministeriële regeling worden nadere regels gesteld over het tussentijds voortgangsverslag.
    url: https://wetten.overheid.nl/BWBR0022735/2012-03-13#Artikel63
  - number: '64'
    text: |-
      De subsidie-ontvanger doet onverwijld mededeling aan Onze Minister van de indiening bij de rechtbank van een
      verzoek tot het op hem van toepassing verklaren van de schuldsaneringsregeling natuurlijke personen, tot verlening
      van surséance van betaling aan hem of tot faillietverklaring van hem.
    url: https://wetten.overheid.nl/BWBR0022735/2012-03-13#Artikel64
  - number: '65'
    text: |-
      De subsidie-ontvanger verstrekt desgevraagd aan Onze Minister alle bescheiden, gegevens of inlichtingen die nodig
      zijn voor een beslissing omtrent de subsidie.
    url: https://wetten.overheid.nl/BWBR0022735/2012-03-13#Artikel65
  - number: '66'
    text: |-
      1 Voor een subsidie waarvoor een beschikking tot subsidieverlening geldt, verstrekt Onze Minister ambtshalve
      maximaal één maal per jaar een voorschot.

      2 Onze Minister verstrekt het eerste voorschot aan een subsidie-ontvanger die hernieuwbare elektriciteit opwekt en
      aan een subsidie-ontvanger die hernieuwbare elektriciteit en hernieuwbare warmte produceert niet eerder dan nadat de
      subsidie-ontvanger een rekening, bedoeld in [artikel 1, eerste lid, onder y, van de Elektriciteitswet 1998][ref1],
      bij de garantiebeheerinstantie heeft geopend.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel1
    url: https://wetten.overheid.nl/BWBR0022735/2012-03-13#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '1'
  - number: '67'
    text: |-
      1 Een voorschot aan een subsidie-ontvanger die hernieuwbare elektriciteit produceert bedraagt het product van:

      a. het in de beschikking tot subsidieverlening per kalenderjaar vastgestelde maximum aantal kWh, en

      b. het basisbedrag dan wel het tenderbedrag verminderd met de op grond van [artikel 14, zesde lid][ref1], dan wel
      [artikel 22, zesde lid][ref2], vastgestelde correcties,

      met dien verstande dat in het daaropvolgende kalenderjaar de hoogte van het voorschot wordt vastgesteld op basis
      van het in het voorgaande kalenderjaar feitelijk geproduceerde en voor subsidie in aanmerking komend aantal kWh en
      het gecorrigeerde bedrag, bedoeld in [artikel 14, vijfde lid][ref3], dan wel [artikel 22, vijfde lid][ref4].

      2 Een voorschot aan een subsidie-ontvanger die hernieuwbaar gas produceert bedraagt het product van:

      a. het in de beschikking tot subsidieverlening per kalenderjaar vastgestelde maximum aantal Nm3 aardgasequivalent
      of GJ, en

      b. het basisbedrag dan wel het tenderbedrag verminderd met de op grond van [artikel 31, vijfde lid][ref5], dan wel
      [artikel 39, vijfde lid][ref6], vastgestelde correcties,

      met dien verstande dat in het daaropvolgende kalenderjaar de hoogte van het voorschot wordt vastgesteld op basis
      van het in het voorgaande kalenderjaar feitelijk geproduceerde en voor subsidie in aanmerking komend aantal
      Nm3 aardgasequivalent of GJ en het gecorrigeerde bedrag, bedoeld in [artikel 31, vierde lid][ref7], dan wel
      [artikel 39, vierde lid][ref8].

      3 Een voorschot aan een subsidie-ontvanger die hernieuwbare warmte of hernieuwbare warmte en hernieuwbare
      elektriciteit produceert bedraagt het product van:

      a. het in de beschikking tot subsidieverlening per kalenderjaar vastgestelde maximum aantal GJ en

      b. het basisbedrag dan wel het tenderbedrag verminderd met de op grond van [artikel 47, vijfde lid][ref9], dan wel
      [artikel 54, vijfde lid][ref10], vastgestelde correcties,

      met dien verstande dat in het daaropvolgende kalenderjaar de hoogte van het voorschot wordt vastgesteld op basis
      van het in het voorgaande kalenderjaar feitelijk geproduceerde en voor subsidie in aanmerking komend aantal GJ en
      het gecorrigeerde bedrag, bedoeld in [artikel 47, vierde lid][ref11], dan wel [artikel 54, vierde lid][ref12].

      4 Onze Minister verstrekt per jaar slechts een voorschot tot ten hoogste in de beschikking tot subsidieverlening
      vastgestelde maximum aantal kWh, GJ of Nm3 aardgasequivalent.

      5 Indien de meetgegevens niet beschikbaar zijn in het kalenderjaar, bedoeld in het eerste en derde lid, wordt in
      afwijking van het eerste en derde lid het voorschot uiterlijk vastgesteld in het eerstvolgende kalenderjaar nadat
      de meetgegevens beschikbaar zijn.


