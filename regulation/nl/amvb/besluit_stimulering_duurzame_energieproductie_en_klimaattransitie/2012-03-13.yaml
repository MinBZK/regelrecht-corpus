  - number: '43'
    text: |-
      De bepalingen in deze paragraaf gelden indien ingevolge [artikel 2, derde lid][ref1], wordt gekozen voor verdeling
      op volgorde van binnenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel2
    url: https://wetten.overheid.nl/BWBR0022735/2012-03-13#Artikel43
