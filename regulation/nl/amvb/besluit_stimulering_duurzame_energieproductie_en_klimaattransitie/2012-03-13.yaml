        artikel: '29'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0003245
  - number: '32'
    text: |-
      1 De subsidie die een subsidie-ontvanger ontvangt wordt bepaald door:

      a. met elkaar te vermenigvuldigen:

      1°. het aantal Nm3 aardgasequivalent of GJ dat in elk kalenderjaar voor subsidie in aanmerking komt die een
      producent van hernieuwbaar gas in dat kalenderjaar heeft geproduceerd en op een gasnet heeft ingevoed, met

      2°. het voor het betreffende kalenderjaar op basis van [artikel 31][ref1] geldende gecorrigeerde basisbedrag, en

      b. de overeenkomstig onderdeel a berekende bedragen voor ieder kalenderjaar van de periode waarover subsidie wordt
      verstrekt bij elkaar op te tellen.

      2 Het aantal Nm3 aardgasequivalent of GJ dat jaarlijks voor subsidie in aanmerking komt bedraagt ten hoogste het
      in de beschikking tot subsidieverlening vastgestelde maximum aantal Nm3 aardgasequivalent of GJ dat per jaar kan
      verschillen en dat gebaseerd is op het vermogen van de installatie en het aantal vollasturen. Bij ministeriële
      regeling kan voor een categorie productie-installaties worden bepaald dat indien in een jaar minder Nm3
      aardgasequivalent of GJ is geproduceerd dan het aantal Nm3 aardgasequivalent of GJ dat het betreffende jaar voor
      subsidie in aanmerking komt, het verschil in Nm3 aardgasequivalent of GJ bij het aantal Nm3 aardgasequivalent of GJ
      dat het volgende jaar voor subsidie in aanmerking komt wordt opgeteld. Bij ministeriële regeling kan een maximum,
      dat per jaar kan verschillen, worden gesteld aan het aantal Nm3 aardgasequivalent of GJ dat opgeteld wordt bij het
      aantal Nm3 aardgasequivalent of GJ dat het volgende jaar voor subsidie in aanmerking komt.

      3 Bij ministeriële regeling kan ten behoeve van de berekening van het maximum aantal Nm3 aardgasequivalent of GJ,
      bedoeld in het tweede lid, per categorie productie-installaties een maximum aantal vollasturen worden bepaald.

      4 Bij ministeriële regeling kan voor een categorie productie-installaties worden bepaald dat bij de toepassing van
      het eerste lid, onderdeel a, ten eerste, wordt opgeteld het aantal Nm3 aardgasequivalent dat in elk kalenderjaar
      voor subsidie in aanmerking komt die een producent van hernieuwbaar gas in dat kalenderjaar heeft geproduceerd en
      op een gasnet heeft laten invoeden.

      5 Bij ministeriële regeling kan voor een categorie productie-installaties worden bepaald dat voor de berekening
      van de subsidie in afwijking van het eerste lid, onderdeel a, ten eerste, wordt genomen het aantal GJ dat in elk
      kalenderjaar voor subsidie in aanmerking komt en waarvoor de producent kan aantonen dat de producent met zijn
      productie-installatie voor hernieuwbaar gas in het betreffende kalenderjaar een hoeveelheid hernieuwbaar gas heeft
      geproduceerd:

      a. waarmee hernieuwbare warmte is geproduceerd die nuttig is gebruikt of

      b. waarmee hernieuwbare warmte die nuttig is gebruikt en hernieuwbare elektriciteit is geproduceerd,
      waarvoor garanties van oorsprong zijn verstrekt die aantonen dat een hoeveelheid hernieuwbare elektriciteit
      is geproduceerd en op een elektriciteitsnet is ingevoed of een hoeveelheid hernieuwbare warmte is
      geproduceerd en nuttig is gebruikt, of waarvoor garanties van oorsprong voor niet-netlevering, bedoeld in
      [artikel 1 van de Regeling garanties van oorsprong voor duurzame elektriciteit][ref2], zijn verstrekt die
      aantonen dat in het betreffende kalenderjaar een hoeveelheid hernieuwbare elektriciteit is geproduceerd en op een
      installatie, met uitzondering van de productie-installatie, is ingevoed.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0016021#Artikel1
    url: https://wetten.overheid.nl/BWBR0022735/2012-03-13#Artikel32
