articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. hernieuwbare energiebronnen: wind, zonne-energie, aardwarmte, omgevingswarmte, osmose, golfenergie,
      getijdenenergie, waterkracht, biomassa, stortgas, rioolwaterzuiveringsgas en biogas;

      b. biomassa: de biologisch afbreekbare fractie van producten, afvalstoffen en residuen van de landbouw – met
      inbegrip van plantaardige en dierlijke stoffen –, de bosbouw, de visserij- en aquacultuursector en aanverwante
      bedrijfstakken, alsmede de biologisch afbreekbare fractie van industrieel en huishoudelijk afval;

      c. hernieuwbare elektriciteit: elektriciteit, opgewekt in een productie-installatie die uitsluitend gebruik maakt
      van hernieuwbare energiebronnen, alsmede elektriciteit die is opgewekt met hernieuwbare energiebronnen in een
      hybride productie-installatie die ook met conventionele energiebronnen werkt, met inbegrip van elektriciteit die
      is opgewekt met hernieuwbare energiebronnen en die wordt gebruikt voor accumulatiesystemen, en met uitzondering van
      elektriciteit die afkomstig is van accumulatiesystemen;

      d. gas: gas als bedoeld in [artikel 1, eerste lid, onderdeel b, van de Gaswet][ref1];

      e. hernieuwbaar gas: gas, opgewekt in een productie-installatie die uitsluitend gebruik maakt van hernieuwbare
      energiebronnen, alsmede gas, opgewekt met hernieuwbare energiebronnen in een hybride productie-installatie die ook
      fossiele energiebronnen gebruikt;

      f. één Nm3 aardgasequivalent: de hoeveelheid gas met een verbrandingswaarde die overeenkomt met één Nm3 aardgas van
      standaard Groningen kwaliteit onder normaalcondities;

      g. hernieuwbare warmte: warmte, opgewekt in een productie-installatie die uitsluitend gebruik maakt van
      hernieuwbare energiebronnen, alsmede warmte, opgewekt met hernieuwbare energiebronnen in een hybride productie-
      installatie waarin ook andere energiebronnen worden gebruikt, met uitzondering van warmte die afkomstig is van
      accumulatiesystemen;

      h. productie-installatie: een samenstel van voorzieningen waarmee hernieuwbare elektriciteit, hernieuwbaar gas
      of hernieuwbare warmte wordt geproduceerd, dan wel broeikasgas wordt verminderd, waarbij onder een samenstel van
      voorzieningen wordt verstaan alle aanwezige middelen die onderling met elkaar zijn verbonden voor de productie van
      hernieuwbare elektriciteit, hernieuwbaar gas of hernieuwbare warmte dan wel vermindering van broeikasgas;

      i. producent: een ieder die een productie-installatie in stand houdt;

      j. elektriciteitsnet: een net als bedoeld in
      [artikel 1, eerste lid, onderdeel i, van de Elektriciteitswet 1998][ref2] en een elektriciteitsnet dat
      is gelegen binnen de Nederlandse exclusieve economische zone dat is verbonden met een net als bedoeld in
      [artikel 1, eerste lid, onderdeel i, van de Elektriciteitswet 1998][ref3];

      k. gasnet: een net als bedoeld in [artikel 1, eerste lid, onderdeel d, van de Gaswet][ref4];

      l. garantie van oorsprong: een garantie van oorsprong voor als bedoeld in
      [artikel 1, onderdeel x, van de Elektriciteitswet 1998][ref5];

      m. gebundelde aanvraag: de bundeling van maximaal 250 aanvragen om subsidieverlening vallend binnen één
      subsidieplafond in één aanvraag om subsidieverlening;

      n. productie-installatie voor de productie van hernieuwbare elektriciteit met behulp van
      windenergie op zee: een productie-installatie die is opgericht op een afstand van meer dan één
      kilometer zeewaarts van de laagwaterlijn, bedoeld in de [artikelen 1, tweede lid][ref6], en
      [2, eerste lid, van de Wet grenzen Nederlandse territoriale zee][ref7] en die niet is gelegen binnen een
      gemeentelijke grens, waarmee hernieuwbare elektriciteit wordt geproduceerd met behulp van windenergie;

      o. fase: de bij ministeriële regeling vastgestelde periode waarbinnen de aanvragen ontvangen moeten zijn. Voor
      iedere fase geldt een andere openstellingsdatum;

      p. MEP: de subsidie verstrekt ten behoeve van de productie van duurzame elektriciteit, klimaatneutrale
      elektriciteit of elektriciteit die is opgewekt door middel van warmtekrachtkoppeling op grond van
      [artikel 72m van de Elektriciteitswet 1998][ref8];

      q. OV-MEP: de Subsidieregeling opwekken duurzame elektriciteit in vergistingsinstallaties;

      r. richtlijn hernieuwbare energie: richtlijn nr. 2009/28/EG van het Europees Parlement en de Raad van 23 april
      2009 ter bevordering van het gebruik van energie uit hernieuwbare bronnen en houdende wijziging en intrekking van
      Richtlijn 2001/77/EG en Richtlijn 2003/30/EG (PbEU 2009, L 140);

      s. samenwerkingsverband: een geen rechtspersoonlijkheid bezittend verband, bestaande uit ten minste twee niet in
      een groep verbonden deelnemers, dat is opgericht ten behoeve van de uitvoering van activiteiten, niet zijnde een
      vennootschap;

      t. innovatiekavel: kavel als bedoeld in [artikel 1 van de Wet windenergie op zee][ref9], dat bestemd is voor de
      productie van hernieuwbare elektriciteit door middel van windenergie op zee met de bijzondere en risicovolle inzet
      van een innovatieve productie-installatie;

      u. broeikasgas: koolstofdioxide en andere gascomponenten van zowel menselijke als natuurlijke oorsprong die
      warmtestraling van de aarde en de wolken naar de atmosfeer absorberen of terugkaatsen en daarmee bijdragen aan
      opwarming van de aarde gecorrigeerd naar koolstofdioxide-equivalenten;

      v. primair product: meetbare eenheid die de productie-installatie ter vermindering van broeikasgas produceert die
      daarbij een bron van opbrengsten is voor de producent;

      w. rangschikkingsbedrag: bedrag bestaande uit het verschil tussen, afhankelijk van de aanvraag, het fasebedrag
      of basisbedrag en, afhankelijk van de categorie productie-installaties, de langetermijnenergieprijs of
      basisenergieprijs dan wel het langetermijnbroeikasgasbedrag of basisbroeikasgasbedrag;

      x. subsidiabele productie: de meetbare prestatie waarvoor aan de subsidie-ontvanger subsidie wordt verstrekt;

      y. vermindering van broeikasgas: vermindering van broeikasgas in de atmosfeer door middel van de afvang en opslag,
      afvang en hergebruik dan wel vermindering of vermijding van de uitstoot van broeikasgas.

      2 Bij ministeriële regeling kunnen andere hernieuwbare energiebronnen dan genoemd in het eerste lid, onderdeel a,
      worden aangewezen.

      3 Bij ministeriële regeling wordt bepaald wat onder nuttig gebruik van hernieuwbare warmte wordt verstaan.

      4 Voor de toepassing van dit besluit en de daarop berustende bepalingen wordt gelijkgesteld met één kWh de
      hoeveelheid elektrische energie die overeenkomt met 0,102359965 Nm3aardgasequivalent of 0,0036 GJ.


