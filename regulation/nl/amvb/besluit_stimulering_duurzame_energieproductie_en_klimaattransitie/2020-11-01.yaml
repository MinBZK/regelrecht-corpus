  - number: '28'
    text: |-
      1 Bij regeling van Onze Minister, na overleg met Onze Minister van Financiën, wordt per categorie productie-
      installaties een basisbedrag per kWh vastgesteld voor de subsidie voor de productie van hernieuwbaar gas.

      2 Het basisbedrag bedraagt ten hoogste de gemiddelde kosten per kWh voor het produceren van hernieuwbaar gas per
      categorie van productie-installaties.

      3 Voor de kWh die voor subsidie in aanmerking komen kunnen verschillende basisbedragen gelden die zijn gerelateerd
      aan:

      a. de hoeveelheid geproduceerde kWh die voor subsidie in aanmerking komt;

      b. het aantal vollasturen van de productie-installatie;

      c. het rendement van de productie-installatie.
    url: https://wetten.overheid.nl/BWBR0022735/2020-11-01#Artikel28
  - number: '29'
    text: |-
      1 Bij regeling van Onze Minister, na overleg met Onze Minister van Financiën, wordt ten behoeve van de correctie
      van het fasebedrag of basisbedrag, bedoeld in [artikel 31][ref1] en de vaststelling van het bedrag dat de subsidie
      ten hoogste bedraagt, bedoeld in [artikel 33][ref2], een basisenergieprijs per kWh vastgesteld die kan verschillen
      per categorie productie-installaties.

      2 De hoogte van de basisenergieprijs bedraagt tweederde van de lange termijn gasprijs voor de betreffende
      toepassing van het gas.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0022735#Artikel33
