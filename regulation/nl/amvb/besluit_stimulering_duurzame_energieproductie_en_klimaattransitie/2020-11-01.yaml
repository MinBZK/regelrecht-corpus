  - number: '6'
    text: |-
      1 De periode waarover subsidie wordt verstrekt vangt aan op de door de subsidie-ontvanger in de aanvraag aangegeven
      datum, met dien verstande dat de periode waarover subsidie wordt verstrekt niet later aanvangt dan binnen de op
      grond van [artikel 61, eerste lid][ref1], vastgestelde termijn waarbinnen de productie-installatie, in voorkomend
      geval na uitbreiding of renovatie, in gebruik moet worden genomen.

      2 Onze Minister kan op verzoek van de subsidie-ontvanger het tijdstip van aanvang van de periode waarover subsidie
      wordt verstrekt maximaal driemaal wijzigen met dien verstande dat dit verzoek niet later wordt ingediend dan de
      datum van ingebruikname van de productie-installatie, en dat dit tijdstip niet later wordt vastgesteld, dan binnen
      de op grond van [artikel 61, eerste lid][ref2], vastgestelde termijn.

      3 Onze Minister kan op verzoek van de subsidie-ontvanger, voor een project voor de productie van hernieuwbare
      elektriciteit met een nominaal vermogen gelijk aan of groter dan 100 MW en die behoort tot een bij ministeriële
      regeling aangewezen categorie productie-installaties, bepalen dat het tijdstip van aanvang van de periode waarover
      subsidie wordt verstrekt voor maximaal vijf gedeelten van de beschikking tot subsidieverlening verschilt. Tussen de
      startdata zit een periode van tenminste twee maanden.


