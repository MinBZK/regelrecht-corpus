    text: |-
      1 Het door de producent opgegeven tenderbedrag, bedoeld in [artikel 36][ref1], geldt gedurende de gehele periode
      waarover subsidie wordt verstrekt.

      2 De basisenergieprijs, bedoeld in [artikel 37][ref2], die geldt op het moment van aanvraag van de subsidie, geldt
      gedurende de gehele periode waarover subsidie wordt verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0022735#Artikel37
