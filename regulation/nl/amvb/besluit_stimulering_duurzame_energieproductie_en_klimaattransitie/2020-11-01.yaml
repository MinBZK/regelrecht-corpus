  - number: 55f
    text: |-
      1 Bij regeling van Onze Minister, na overleg met Onze Minister van Financiën, wordt per categorie productie-
      installaties een basisbedrag per 1000 kg broeikasgas vastgesteld voor de subsidie voor de vermindering van
      broeikasgas.

      2 Het basisbedrag bedraagt ten hoogste de gemiddelde kosten per 1000 kg verminderde broeikasgas per categorie van
      productie-installaties.

      3 Voor de subsidiabele productie kunnen verschillende basisbedragen gelden die zijn gerelateerd aan:

      a. de hoeveelheid verminderde kg broeikasgas in Nederland;

      b. het aantal vollasturen van de productie-installatie;

      c. het rendement van de productie-installatie.
    url: https://wetten.overheid.nl/BWBR0022735/2020-11-01#Artikel55f
  - number: 55g
    text: |-
      1 Bij regeling van Onze Minister, na overleg met Onze Minister van Financiën, wordt ten behoeve van de correctie
      van het fasebedrag of basisbedrag, bedoeld in [artikel 55i][ref1] en de vaststelling van het bedrag dat de subsidie
      ten hoogste bedraagt, bedoeld in [artikel 55k][ref2], een basisbroeikasgasbedrag per 1000kg broeikasgas vastgesteld
      dat kan verschillen per categorie productie-installaties.

      2 Voor het basisbroeikasgasbedrag kunnen de marktprijs van het primaire product dat de productie-installatie
      produceert of de opbrengsten of vermeden kosten die voor de subsidie-ontvanger voortvloeien uit het systeem
      van verhandelbare broeikasgasemissierechten, bedoeld in [titel 16.2 van de Wet milieubeheer][ref3] afzonderlijk
      vastgesteld worden.

      3 De hoogte van het basisbroeikasgasbedrag bedraagt tweederde van het langetermijnbroeikasgasbedrag voor de van
      toepassing zijnde categorie productie-installaties.


