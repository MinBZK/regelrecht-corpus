  - number: '44'
    text: |-
      1 Bij regeling van Onze Minister, na overleg met Onze Minister van Financiën, wordt per categorie productie-
      installaties een basisbedrag per kWh vastgesteld voor de subsidie voor de productie van hernieuwbare warmte of
      hernieuwbare warmte en hernieuwbare elektriciteit.

      2 Het basisbedrag bedraagt ten hoogste de gemiddelde kosten per kWh voor het produceren van hernieuwbare warmte of
      hernieuwbare warmte en hernieuwbare elektriciteit per categorie productie-installaties.

      3 Voor de kWh die voor subsidie in aanmerking komen kunnen verschillende basisbedragen gelden die zijn gerelateerd
      aan:

      a. de hoeveelheid geproduceerde kWh die voor subsidie in aanmerking komt;

      b. het aantal vollasturen van de productie-installatie;

      c. het rendement van de productie-installatie.
    url: https://wetten.overheid.nl/BWBR0022735/2020-11-01#Artikel44
  - number: '45'
    text: |-
      1 Bij regeling van Onze Minister, na overleg met Onze Minister van Financiën, wordt ten behoeve van de correctie
      van het fasebedrag of basisbedrag, bedoeld in [artikel 44][ref1] en de vaststelling van het bedrag dat de subsidie
      ten hoogste bedraagt, bedoeld in [artikel 49][ref2], een basisenergieprijs per kWh vastgesteld die kan verschillen
      per categorie productie-installaties of per soort toepassing van de energie.

      2 Binnen een categorie productie-installaties kunnen verschillende basisenergieprijzen gelden die gerelateerd zijn
      aan de hoeveelheid geproduceerde kWh die voor subsidie in aanmerking komt.

      3 Indien op grond van het eerste lid aparte basisprijzen per kWh worden vastgesteld per soort toepassing van
      energie geldt voor het aantal kWh met een soort toepassing bij de toepassing van de [artikelen 46][ref3],
      [47, eerste lid, onderdeel a, en tweede lid][ref4], en [49][ref5] de basisenergieprijs of energieprijs voor de
      betreffende soort toepassing.


