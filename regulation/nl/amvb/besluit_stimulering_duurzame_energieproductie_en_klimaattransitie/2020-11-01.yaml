  - number: '68'
    text: |-
      1 Onze Minister verstrekt de in [artikel 67, eerste, tweede, derde en vierde lid][ref1], bedoelde voorschotten
      in maandelijkse bedragen, tenzij bij ministeriële regeling is bepaald dat voor een bepaalde categorie productie-
      installaties het voorschot in een jaarlijks bedrag wordt verstrekt. De som van de maandelijkse bedragen of van het
      jaarlijkse bedrag bedraagt niet meer dan 80% van het product van:

      a. het in de beschikking tot subsidieverlening per kalenderjaar vastgestelde maximum aantal kWh
      dan wel maximum aantal kg broeikasgas, waar op verzoek van de producent, het aantal kWh, bedoeld in
      [artikel 15, derde of vierde lid][ref2], [23, derde of vierde lid][ref3], [32, derde of vierde lid][ref4],
      [40, derde of vierde lid][ref5], [48, derde of vierde lid][ref6], of [55, derde of vierde lid][ref7],
      respectievelijk het aantal kg broeikasgas, bedoeld in [artikel 55j, derde of vierde lid][ref8], of
      [55q, derde of vierde lid][ref9], bij opgeteld kan worden; en

      b. het basisbedrag dan wel het tenderbedrag verminderd met de op grond van de [artikelen 14, vijfde lid][ref10],
      [31, vijfde lid][ref11], of [47, vijfde lid][ref12], of [artikel 55i, vierde lid][ref13], dan wel
      de [artikelen 22, vijfde lid][ref14], [39, vijfde lid][ref15], of [54, vijfde lid][ref16], of
      [55p, vierde lid][ref17], vastgestelde correcties.

      2 Indien de som van de maandelijkse bedragen of van het jaarlijkse bedrag die in een kalenderjaar zijn verstrekt
      minder dan wel meer bedraagt dan de hoogte van het voorschot dat na afloop van het kalenderjaar wordt vastgesteld,
      kan Onze Minister dit verrekenen met de nog te verstrekken maandelijkse of jaarlijkse bedragen.

      3 Bij ministeriële regeling worden regels gesteld over de berekening van de maandelijkse bedragen en van het
      jaarlijkse bedrag, bedoeld in het eerste lid, en kunnen regels worden gesteld over de wijze waarop de voorschotten
      worden verrekend, als bedoeld in het tweede lid.


