    text: |-
      Het fasebedrag, bedoeld in [artikel 55e][ref1], of het basisbedrag, bedoeld in [artikel 55f][ref2], en het
      basisbroeikasgasbedrag, bedoeld in [artikel 55g][ref3], die gelden op het moment van aanvraag van de subsidie,
