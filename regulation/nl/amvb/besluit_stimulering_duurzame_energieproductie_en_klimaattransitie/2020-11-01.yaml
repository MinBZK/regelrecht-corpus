  - number: '56'
    text: |-
      1 Een aanvraag om subsidieverlening wordt ingediend met gebruikmaking van een middel, dat door Onze Minister
      beschikbaar wordt gesteld.

      2 Bij ministeriële regeling kunnen een of meer categorieën productie-installaties worden aangewezen waarvoor een
      gebundelde aanvraag kan worden ingediend.

      3 Bij ministeriële regeling kan voor een categorie productie-installaties worden bepaald dat per
      openstellingsperiode of per kalenderjaar per adres waarop een productie-installatie is of wordt geplaatst maximaal
      één aanvraag kan worden ingediend.

      4 Een aanvraag tot subsidieverlening bevat gegevens over:

      a. de subsidie-aanvrager, waaronder naam, adres en rekeningnummer;

      b. voor zover de subsidie-aanvrager een samenwerkingsverband is, een overzicht van de deelnemers aan het
      samenwerkingsverband;

      c. de categorie productie-installatie waarvoor subsidie wordt aangevraagd;

      d. de locatie waar de productie-installatie wordt geplaatst;

      e. de hoeveelheid op te wekken en in te voeden kWh, dan wel in Nederland te verminderen kg broeikasgas, van iedere
      productie-installatie per kalenderjaar gedurende de periode waarover subsidie wordt verstrekt;

      f. het tijdschema betreffende de ingebruikname van de productie-installatie.

      5 Bij ministeriële regeling kan voor categorieën productie-installaties worden bepaald dat aan het vierde lid,
      onderdeel d, niet behoeft te zijn voldaan, in welk geval bij die regeling aanvullende voorwaarden kunnen worden
      gesteld aan de documenten die krachtens het vierde lid bij een subsidieaanvraag moeten worden gevoegd.

      6 Bij ministeriële regeling kan worden bepaald dat een haalbaarheidsstudie of de vergunningen die vereist zijn voor
      de realisatie van de productie-installatie bij een aanvraag worden gevoegd. Daarbij kan onderscheid worden gemaakt
      naar categorie productie-installatie, op te wekken vermogen of aan te vragen subsidiebedrag en kunnen eisen worden
      gesteld waaraan de haalbaarheidsstudie moet voldoen.

      7 Bij ministeriële regeling kunnen indien dit noodzakelijk is voor de beoordeling van de aanvraag andere gegevens
      die een aanvraag bevat of andere bescheiden die bij een aanvraag moeten worden gevoegd, worden vastgesteld.
      Daarbij kan onderscheid worden gemaakt naar categorie productie-installatie, op te wekken vermogen of aan te vragen
      subsidiebedrag.
    url: https://wetten.overheid.nl/BWBR0022735/2020-11-01#Artikel56
  - number: '57'
    text: |-
      1 Onze Minister beslist op een aanvraag:

      a. om een subsidie voor de productie van hernieuwbare elektriciteit, hernieuwbaar gas of hernieuwbare warmte
      dan wel de vermindering van broeikasgas die wordt verdeeld op volgorde van binnenkomst, binnen dertien weken na
      ontvangst van de aanvraag;

      b. om een subsidie voor hernieuwbare elektriciteit, hernieuwbaar gas of hernieuwbare warmte dan wel de vermindering
      van broeikasgas die wordt verdeeld op volgorde van rangschikking, binnen dertien weken na de laatste dag van de bij
      ministeriële regeling vastgestelde periode.

      2 De in het eerste lid genoemde perioden kunnen éénmaal met ten hoogste dertien weken worden verlengd.

      3 Indien een gebundelde aanvraag niet leidt tot subsidieverlening door Onze Minister, kan een gebundelde aanvraag
      worden behandeld als één aanvraag.

      4 Indien Onze Minister aan de aanvrager van een gebundelde aanvraag subsidie verstrekt, verstrekt Onze Minister per
      productie-installatie die onderdeel is van de gebundelde aanvraag een beschikking tot subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0022735/2020-11-01#Artikel57
  - number: '58'
    text: |-
      1 Ingeval van verdeling op volgorde van binnenkomst, verdeelt Onze Minister het beschikbare bedrag in de
      volgorde van ontvangst van de aanvragen, met dien verstande dat indien een aanvrager niet heeft voldaan
      aan enig wettelijk voorschrift voor het in behandeling nemen van de aanvraag en met toepassing van
      [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft gehad de aanvraag aan te vullen, voor
      de toepassing van dit artikel, de dag waarop de aanvraag voldoet aan de wettelijke voorschriften als datum van
      ontvangst geldt.

      2 Indien honorering van alle aanvragen die op één dag zijn ontvangen ertoe zou leiden dat het beschikbare
      subsidieplafond, of de maximale productie in kWh, of de maximale vermindering van broeikasgas in kg zou worden
      overschreden, worden steeds de aanvragen om subsidie met het laagste rangschikkingsbedrag, uitgedrukt in euro
      per 1000 kg vermindering van broeikasgas geacht eerder te zijn ontvangen. Indien honorering van alle aanvragen om
      subsidie met het laagste rangschikkingsbedrag, uitgedrukt in euro per 1000 kg vermindering van broeikasgas die op
      één dag zijn ontvangen ertoe zou leiden dat het beschikbare subsidieplafond, of de maximale productie in kWh of de
      maximale vermindering van broeikasgas in kg zou worden overschreden, stelt Onze Minister de volgorde van ontvangst
      van deze aanvragen vast door middel van loting.

      3 Aanvragen die worden ontvangen op werkdagen na 17.00 uur of andere dagen, worden aangemerkt als ontvangen op de
      eerstvolgende werkdag.

      4 Bij de toepassing van het tweede lid:

      a. wordt een gebundelde aanvraag behandeld als één aanvraag, waarbij als rangschikkingsbedrag geldt het
      rangschikkingsbedrag van de aanvraag met het hoogste rangschikkingsbedrag van de bundel;

      b. worden bij de loting alle op de desbetreffende dag ontvangen aanvragen met hetzelfde rangschikkingsbedrag
      betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel45
    url: https://wetten.overheid.nl/BWBR0022735/2020-11-01#Artikel58
