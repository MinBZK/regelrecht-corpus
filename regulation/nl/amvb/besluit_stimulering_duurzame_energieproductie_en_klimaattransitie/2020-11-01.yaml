  - number: '51'
    text: |-
      1 Bij de aanvraag tot subsidieverlening wordt door de producent een tenderbedrag per kWh opgegeven. Bij een
      gebundelde aanvraag is het door de producent opgegeven tenderbedrag van toepassing op alle aanvragen die deel
      uitmaken van de gebundelde aanvraag.

      2 Bij regeling van Onze Minister, na overleg met Onze Minister van Financiën, wordt per categorie productie-
      installaties een maximum tenderbedrag per kWh voor hernieuwbare warmte of hernieuwbare warmte en hernieuwbare
      elektriciteit bepaald.

      3 Het maximum tenderbedrag bedraagt maximaal de gemiddelde kosten per kWh voor het produceren van hernieuwbare
      warmte of hernieuwbare warmte en hernieuwbare elektriciteit per categorie van productie-installaties.
    url: https://wetten.overheid.nl/BWBR0022735/2020-11-01#Artikel51
  - number: '52'
    text: |-
      1 Bij regeling van Onze Minister, na overleg met Onze Minister van Financiën, wordt ten behoeve van de correctie
      van het tenderbedrag, bedoeld in [artikel 54][ref1], en de vaststelling van het bedrag dat de subsidie ten hoogste
      bedraagt, bedoeld in [artikel 55a][ref2], een basisenergieprijs per kWh vastgesteld die kan verschillen per
      categorie productie-installaties of per soort toepassing van de warmte.

      2 Binnen een categorie productie-installaties kunnen verschillende basisenergieprijzen gelden die gerelateerd zijn
      aan de hoeveelheid geproduceerde kWh die voor subsidie in aanmerking komt.

      3 Indien op grond van het eerste lid aparte basisprijzen per kWh worden vastgesteld per soort toepassing
      van warmte geldt voor het aantal kWh met een soort toepassing bij de toepassing van de [artikelen 53][ref3],
      [54, eerste lid, onderdeel a, en tweede lid][ref4], en [55a][ref5] de basisenergieprijs of energieprijs voor de
      betreffende soort toepassing.


