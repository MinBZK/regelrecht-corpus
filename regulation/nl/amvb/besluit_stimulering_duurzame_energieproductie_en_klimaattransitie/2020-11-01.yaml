  - number: '2'
    text: |-
      1 Onze Minister kan onverminderd [artikel 24a][ref1] op aanvraag subsidie verstrekken voor:

      a. de productie van hernieuwbare elektriciteit aan een producent van hernieuwbare elektriciteit om gedurende een
      bepaalde periode het verschil tussen de gemiddelde kostprijs van deze hernieuwbare elektriciteit en de relevante
      gemiddelde marktprijs van elektriciteit geheel of gedeeltelijk te compenseren;

      b. de productie van hernieuwbaar gas aan een producent van hernieuwbaar gas om gedurende een bepaalde periode het
      verschil tussen de gemiddelde kostprijs van dit hernieuwbaar gas en de relevante gemiddelde marktprijs van gas
      geheel of gedeeltelijk te compenseren;

      c. de productie van hernieuwbare warmte aan een producent van hernieuwbare warmte om gedurende een bepaalde periode
      het verschil tussen de gemiddelde kostprijs van deze hernieuwbare warmte en de relevante gemiddelde marktprijs van
      warmte geheel of gedeeltelijk te compenseren;

      d. de vermindering van broeikasgas aan een producent die een productie-installatie voor de vermindering van
      broeikasgas in stand houdt, om gedurende een bepaalde periode het verschil tussen de gemiddelde kostprijs van
      deze vermindering van broeikasgas en de gemiddelde kostprijs van uitstoot van broeikasgas geheel of gedeeltelijk
      te compenseren.

      2 Bij ministeriële regeling wordt, na overleg met Onze Minister van Financiën, per categorie productie-installaties
      een afzonderlijk subsidieplafond of voor meerdere categorieën tezamen één subsidieplafond vastgesteld voor
      het verlenen van subsidies voor de productie van hernieuwbare elektriciteit, hernieuwbaar gas of hernieuwbare
      warmte, dan wel de vermindering van broeikasgas.

      3 Bij ministeriële regeling wordt de wijze van verdeling van een subsidieplafond bepaald.

      4 Bij ministeriële regeling kunnen perioden worden vastgesteld waarbinnen de aanvragen ontvangen moeten zijn.

      5 Bij ministeriële regeling kan per categorie productie-installaties een afzonderlijke maximale productie in kWh
      dan wel maximale vermindering van broeikasgas in kg, of voor meerdere categorieën tezamen, één maximale productie
      in kWh dan wel maximale vermindering van broeikasgas in kg worden vastgesteld die jaarlijks voor subsidie in
      aanmerking komt.

      6 Bij ministeriële regeling kan voor de productie van hernieuwbare elektriciteit met behulp van windenergie op zee
      per locatie een afzonderlijke maximale productie in kWh, of voor meerdere locaties tezamen, één maximale productie
      in kWh worden vastgesteld die jaarlijks voor subsidie in aanmerking komt.

      7 Bij ministeriële regeling kunnen onder meer voor de wijze van rangschikking van aanvragen, de wijze van
      vergelijking van verschillende productie-installaties ten behoeve van de rangschikking of de berekening van de
      subsidiabele productie omrekenfactoren worden vastgesteld:

      a. voor andere broeikasgassen dan koolstofdioxide naar koolstofdioxide-equivalenten;

      b. van kWh naar kg broeikasgas;

      c. naar de productie van duurzame energie of vermindering van broeikasgas in Nederland;

      d. voor andere eenheden die van invloed zijn op de berekening van de vermindering van broeikasgas.

      8 De vaststelling van de omrekenfactoren, bedoeld in het zevende lid, kan verschillen per categorie productie-
      installaties.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel24a
