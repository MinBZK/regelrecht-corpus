      __REF029___________________________________________________________________________________________________________
      _, [68, eerste en derde lid][ref31] en [73][ref32].

      2 Bij subsidies voor de productie van hernieuwbare elektriciteit met behulp van windenergie, kunnen de
      basiselektriciteitsprijs, bedoeld in de [artikelen 12, eerste lid][ref33], en [20, eerste lid][ref34], en het
      bedrag, bedoeld in de [artikelen 14, eerste lid][ref35], en [22, eerste lid][ref36], worden vermenigvuldigd met
      de factor 1,25, indien dit voor een categorie productie-installaties bij ministeriële regeling is bepaald. Deze
      categorie productie-installaties wordt in dat geval niet aangewezen als productie-installatie als bedoeld in
      [artikel 15, derde en vierde lid][ref37].

      3 Op aanvragen om subsidie die in de periode tussen 1 januari 2015 en 1 november 2020 zijn ingediend, op subsidies
      die in de periode tussen 1 januari 2015 en 1 juli 2020 zijn verleend en op subsidies die in de periode tussen
      1 januari 2015 en 1 november 2020 zijn vastgesteld blijft het recht van toepassing zoals dat luidde onmiddellijk
      vóór 1 november 2020.


