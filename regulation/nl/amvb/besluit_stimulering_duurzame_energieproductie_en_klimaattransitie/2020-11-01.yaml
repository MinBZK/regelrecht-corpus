  - number: '3'
    text: |-
      1 Geen subsidie als bedoeld in [artikel 2, eerste lid][ref1], wordt verstrekt indien voor dezelfde productie-
      installatie reeds op grond van de MEP of de OV-MEP subsidie van meer dan € 0,00 is verstrekt, tenzij:

      a. het een productie-installatie betreft waarmee hernieuwbare elektriciteit, hernieuwbaar gas, hernieuwbare warmte
      of hernieuwbare warmte en hernieuwbare elektriciteit wordt geproduceerd door middel van biomassa en die behoort tot
      een bij ministeriële regeling aangewezen categorie productie-installaties;

      b. de productie-installatie ingrijpend wordt uitgebreid in capaciteit of geheel wordt vervangen;

      c. het een productie-installatie betreft die ingrijpend wordt gerenoveerd en die behoort tot een bij ministeriële
      regeling aangewezen categorie te renoveren productie-installaties;

      d. het een productie-installatie betreft waarvan voor het eerst geproduceerde hernieuwbare warmte nuttig zal worden
      gebruikt en die behoort tot een bij ministeriële regeling aangewezen categorie productie-installaties.

      2 Geen subsidie als bedoeld in [artikel 2, eerste lid][ref2], wordt verstrekt indien voor dezelfde productie-
      installatie reeds op grond van dit besluit subsidie is verstrekt, tenzij:

      a. het een productie-installatie betreft waarmee hernieuwbare elektriciteit, hernieuwbaar gas, hernieuwbare warmte
      of hernieuwbare warmte en hernieuwbare elektriciteit wordt geproduceerd door middel van biomassa en die behoort tot
      een bij ministeriële regeling aangewezen categorie productie-installaties;

      b. de productie-installatie ingrijpend wordt uitgebreid in capaciteit of geheel wordt vervangen;

      c. het een productie-installatie betreft die ingrijpend wordt gerenoveerd en die behoort tot een bij ministeriële
      regeling aangewezen categorie te renoveren productie-installaties;

      d. de productie-installatie niet in gebruik is genomen, er tenminste drie jaren zijn verstreken na de datum van de
      beschikking tot subsidieverlening en die beschikking door Onze Minister is ingetrokken.

      3 Geen subsidie als bedoeld in [artikel 2, eerste lid][ref3], wordt verstrekt indien de productie-installatie in
      gebruik is genomen voor de datum waarop de subsidie is aangevraagd en waarvoor geen subsidie op grond van de MEP,
      de OV-MEP of dit besluit is verstrekt, tenzij:

      a. het een bestaande productie-installatie betreft die voor het eerst gebruik zal maken van hernieuwbare
      energiebronnen of die voor het eerst dient ter vermindering van broeikasgas en die behoort tot een bij ministeriële
      regeling aangewezen categorie productie-installaties;

      b. de productie-installatie ingrijpend wordt uitgebreid in capaciteit of geheel wordt vervangen;

      c. het een productie-installatie betreft die ingrijpend wordt gerenoveerd en die behoort tot een bij ministeriële
      regeling aangewezen categorie te renoveren productie-installaties;

      d. het een bestaande productie-installatie voor de productie van hernieuwbare warmte en hernieuwbare elektriciteit
      betreft die voor het eerst de warmte nuttig zal gebruiken en die behoort tot een bij ministeriële regeling
      aangewezen categorie productie-installaties.

      4 Geen subsidie als bedoeld in [artikel 2, eerste lid][ref4], wordt verstrekt indien een productie-installatie
      geheel of gedeeltelijk bestaat uit gebruikte materialen, tenzij het een productie-installatie betreft die behoort
      tot een bij ministeriële regeling aangewezen categorie productie-installaties.

      5 Geen subsidie als bedoeld in [artikel 2, eerste lid][ref5], wordt verstrekt indien de productie-installatie
      hernieuwbare elektriciteit of hernieuwbare warmte opwekt uit een hernieuwbare energiebron die geheel of
      gedeeltelijk bestaat uit hernieuwbaar gas dat afkomstig is uit een of meerdere productie-installaties waaraan op
      grond van dit besluit subsidie is verstrekt.

      6 Bij ministeriële regeling kunnen regels worden gesteld over de toepassing van het tweede tot en met het vijfde
      lid.


