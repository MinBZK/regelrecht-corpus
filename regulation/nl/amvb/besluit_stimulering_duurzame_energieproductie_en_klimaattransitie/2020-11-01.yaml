    text: |-
      1 Op aanvragen om subsidie die vóór 1 januari 2015 zijn ingediend, op subsidies die vóór 1 januari
      2015 zijn verleend en op subsidies die vóór 1 januari 2015 zijn vastgesteld blijft het recht
      van toepassing zoals dat luidde onmiddellijk vóór dat tijdstip, met uitzondering het bepaalde in
      de [artikelen 1, vierde lid][ref1], [6, tweede lid][ref2], [7][ref3], [14, vijfde lid][ref4],
      [15, tweede, derde en vierde lid][ref5], [22, vijfde lid][ref6], [23, tweede, derde en vierde lid][ref7],
      [28, eerste, tweede lid en derde lid, aanhef en onderdeel a][ref8], [29, eerste lid][ref9],
      [31, derde en vijfde lid][ref10], [32, eerste, tweede, derde, vierde, zesde en zevende lid][ref11],
      [33][ref12], [36, eerste, tweede en derde lid][ref13], [37, eerste lid][ref14],
      [39, derde en vijfde lid][ref15], [40, eerste, tweede, derde, vierde, zesde en zevende lid][ref16], [41][ref17],
