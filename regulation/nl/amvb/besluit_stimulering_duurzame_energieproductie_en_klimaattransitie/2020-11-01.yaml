      [48, eerste lid, onderdeel a, onder 1°, tweede, derde, vierde, vijfde, zesde en zevende lid][ref20], [49][ref21],
      [51, eerste, tweede en derde lid][ref22], [52, eerste, tweede en derde lid][ref23], [54, derde en vijfde lid][ref24],
      [55, eerste lid, onderdeel a, onder 1°, tweede, derde, vierde, vijfde, zesde en zevende lid][ref25],
