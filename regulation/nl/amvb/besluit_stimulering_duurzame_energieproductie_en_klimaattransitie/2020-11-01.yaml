  - number: '36'
    text: |-
      1 Bij de aanvraag tot subsidieverlening wordt door de producent een tenderbedrag per kWh opgegeven. Bij een
      gebundelde aanvraag is het door de producent opgegeven tenderbedrag van toepassing op alle aanvragen die deel
      uitmaken van de gebundelde aanvraag.

      2 Bij regeling van Onze Minister, na overleg met Onze Minister van Financiën, wordt per categorie productie-
      installaties een maximum tenderbedrag per kWh voor hernieuwbaar gas bepaald.

      3 Het maximum tenderbedrag bedraagt maximaal de gemiddelde kosten per kWh voor het produceren van hernieuwbaar gas
      per categorie productie-installaties voor hernieuwbaar gas.
    url: https://wetten.overheid.nl/BWBR0022735/2020-11-01#Artikel36
  - number: '37'
    text: |-
      1 Bij regeling van Onze Minister, na overleg met Onze Minister van Financiën, wordt ten behoeve van de correctie
      van het tenderbedrag, bedoeld in [artikel 39][ref1], en de vaststelling van het bedrag dat de subsidie ten hoogste
      bedraagt, bedoeld in [artikel 41][ref2], een basisenergieprijs per kWh vastgesteld die kan verschillen voor
      verschillende categorieën productie-installaties.

      2 De hoogte van de basisenergieprijs bedraagt tweederde van de lange termijn gasprijs.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0022735#Artikel41
