  - number: 63b
    text: |-
      1 In de beschikking tot subsidieverlening kan aan de subsidieontvanger de verplichting worden opgelegd een
      verklaring te overleggen over de opbrengsten en vermeden kosten die voor de subsidie-ontvanger voortvloeien uit het
      systeem van verhandelbare broeikasgasemissierechten, bedoeld in [titel 16.2 van de Wet milieubeheer][ref1].

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld over de verklaring, bedoeld in het eerste lid.


