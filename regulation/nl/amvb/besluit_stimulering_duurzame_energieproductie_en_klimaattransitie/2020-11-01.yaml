        paragraaf: '2'
  - number: 5a
    text: |-
      Indien sprake is van een situatie als bedoeld in [artikel 3, tweede lid, onderdeel a][ref1], en er daardoor voor
      dezelfde periode, of gedeeltelijk voor dezelfde periode, twee of meer beschikkingen zijn afgegeven voor dezelfde
      productie-installatie en dezelfde soort hernieuwbare energie of dezelfde vorm van vermindering van broeikasgas,
      wordt in een kalenderjaar de hernieuwbare elektriciteit, het hernieuwbare gas of de hernieuwbare warmte dan wel
      de vermindering van broeikasgas die onder een later afgegeven beschikking extra wordt geproduceerd respectievelijk
      is verminderd, subsidiabel indien de subsidiabele productie van de eerder afgegeven beschikking of beschikkingen
      volledig is benut.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel3
