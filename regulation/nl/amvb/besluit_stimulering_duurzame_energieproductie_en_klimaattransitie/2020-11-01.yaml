  - number: '69'
    text: |-
      Onze Minister verstrekt geen voorschot, indien de subsidie-ontvanger niet heeft voldaan aan ingevolge de
      subsidieverlening voor hem geldende verplichtingen, indien hij failliet is verklaard of aan hem surséance van
      betaling is verleend of ten aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing is
      verklaard, dan wel een verzoek daartoe bij de rechtbank is ingediend.
    url: https://wetten.overheid.nl/BWBR0022735/2020-11-01#Artikel69
  - number: '70'
    text: |-
      1 De subsidie-ontvanger dient zijn aanvraag om subsidievaststelling in binnen zes maanden na het tijdstip waarop
      periode waarover subsidie wordt verstrekt, bepaald in de beschikking tot subsidieverlening, is verstreken.

      2 De aanvraag wordt ingediend met gebruikmaking van een middel dat door Onze Minister beschikbaar wordt gesteld.

      3 De aanvraag gaat vergezeld van de door Onze Minister aangegeven bescheiden.
    url: https://wetten.overheid.nl/BWBR0022735/2020-11-01#Artikel70
  - number: '71'
    text: |-
      1 Onze Minister geeft de beschikking tot subsidievaststelling binnen dertien weken na ontvangst van de aanvraag
      daartoe dan wel nadat de voor het indienen ervan geldende termijn is verstreken.

      2 Indien de correcties bedoeld in [artikel 14, vierde lid][ref1], [artikel 22, vierde lid][ref2],
      [artikel 31, vierde lid][ref3], [artikel 39, vierde lid][ref4], [artikel 47, vierde lid][ref5],
      [artikel 54, vierde lid][ref6], [artikel 55i, derde lid][ref7], of [artikel 55p, derde lid][ref8], voor het laatste
      jaar waarin de subsidiabele productie heeft plaatsgevonden nog niet zijn vastgesteld op het moment dat de aanvraag
      bedoeld in [artikel 70, eerste lid][ref9], is ingediend, wordt de termijn, bedoeld in het eerste lid, opgeschort
      tot de dag nadat de desbetreffende correcties zijn vastgesteld.


