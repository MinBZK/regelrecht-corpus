      1 Bij ministeriële regeling wordt bepaald over welke periode voor een categorie productie-installaties
      subsidie wordt verstrekt. Deze periode kan verschillen voor verschillende categorieën productie-installaties of
      verschillende wijzen van verdeling van het beschikbare bedrag.

      2 Indien een categorie productie-installaties bij ministeriële regeling is aangewezen als een categorie productie-
      installaties als bedoeld in de [artikelen 15, derde lid][ref1], [23, derde lid][ref2], [32, derde lid][ref3],
      [40, derde lid][ref4], [48, derde lid][ref5], [55, derde lid][ref6], [55j, derde lid][ref7], of
      [55q, derde lid][ref8], kan Onze Minister op verzoek van de subsidie-ontvanger de periode waarover subsidie wordt
      verstrekt met ten hoogste een jaar verlengen om het ongebruikte aantal kWh of kg broeikasgas dat voor subsidie in
      aanmerking komt, te produceren onderscheidenlijk te verminderen.


