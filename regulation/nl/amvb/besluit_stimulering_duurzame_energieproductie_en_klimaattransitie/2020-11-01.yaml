    text: |-
      1 Onze Minister kan reeds ontvangen of genoten overheidssteun dan wel in de toekomst te ontvangen of te genieten
      overheidssteun die er toe leidt dat de totale aan de producent verleende overheidssteun meer bedraagt dan is
      toegestaan ingevolge voor de Staat geldende verplichtingen krachtens een verdrag, in mindering brengen op de
      subsidie bedoeld in [artikel 2, eerste lid][ref1].

      2 De beschikking tot verlenen van een subsidie voor een productie-installatie voor de productie van hernieuwbare
      elektriciteit of hernieuwbare elektriciteit en hernieuwbare warmte met een nominaal vermogen gelijk aan of groter
      dan 250 MW, dan wel voor een productie-installatie voor de vermindering van broeikasgas:

      a. kan worden verleend onder de opschortende voorwaarde dat goedkeuring wordt verkregen van de Europese Commissie
      in het kader van staatssteun;

      b. kan worden gewijzigd ter verkrijging van de goedkeuring van de Europese Commissie in het kader van staatssteun.


