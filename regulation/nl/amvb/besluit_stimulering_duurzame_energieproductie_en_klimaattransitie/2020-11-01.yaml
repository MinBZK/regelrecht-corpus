  - number: 55i
    text: |-
      1 Voor elke subsidie-ontvanger geldt dat het fasebedrag of basisbedrag in elk kalenderjaar van de periode waarover
      subsidie wordt verstrekt wordt gecorrigeerd met:

      a. de prijs van het primaire product dat door de productie-installatie wordt geproduceerd;

      b. de opbrengsten of vermeden kosten die voor de subsidie-ontvanger voortvloeien uit het systeem van verhandelbare
      broeikasgasemissierechten, bedoeld in [titel 16.2 van de Wet milieubeheer][ref1];

      c. andere bij ministeriële regeling vast te stellen correcties die een substantiële invloed hebben op het verschil
      tussen de gemiddelde kostprijs van de vermindering broeikasgas en de relevante gemiddelde marktprijs van de
      vermindering van broeikasgas en die voortvloeien uit maatregelen van de overheid.

      2 Indien de som van de in het eerste lid, onderdelen a en b, bedoelde correcties lager is dan het in
      [artikel 55g, eerste lid][ref2], bedoelde basisbroeikasgasbedrag, dan geldt het in dat artikellid bedoelde
      basisbroeikasgasbedrag.

      3 Bij ministeriële regeling worden jaarlijks voor 1 april de in het eerste lid bedoelde correcties vastgesteld, die
      kunnen verschillen per categorie productie-installaties.

      4 Ten behoeve van de voorschotverlening worden bij ministeriële regeling jaarlijks voor 1 november de in het eerste
      lid bedoelde correcties voor het volgende kalenderjaar vastgesteld, die kunnen verschillen per categorie productie-
      installaties, en waarbij voor de kostprijs van de vermindering van broeikasgas de gemiddelde waarde in de periode
      1 september tot en met 31 augustus, of in een bij ministeriële regeling te bepalen periode, voorafgaand aan het
      kalenderjaar wordt gehanteerd. Indien na 1 november bij ministeriële regeling een andere categorie productie-
      installaties wordt aangewezen waarvoor subsidie kan worden aangevraagd, worden de in het eerste lid bedoelde
      correcties ten behoeve van de voorschotverlening voor die categorie productie-installaties bij die ministeriële
      regeling vastgesteld.

      5 Indien een productie-installatie geheel of gedeeltelijk bestaat uit gebruikte materialen, kan Onze Minister
      in de beschikking tot subsidieverlening een correctie op het ingevolge het eerste lid geldende subsidiebedrag
      vaststellen.

      6 Indien een productie-installatie ingrijpend wordt gerenoveerd, kan Onze Minister in de beschikking tot
      subsidieverlening een correctie op het ingevolge het eerste lid geldende subsidiebedrag vaststellen.

      7 Indien het ingevolge het eerste, vijfde of zesde lid geldende bedrag negatief is, bedraagt het bedrag nul.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
      [ref2]: https://wetten.overheid.nl/BWBR0022735#Artikel55g
