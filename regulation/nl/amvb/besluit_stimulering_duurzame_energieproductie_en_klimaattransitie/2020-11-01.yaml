        artikel: '11'
        paragraaf: '3'
  - number: '11'
    text: |-
      1 Bij regeling van Onze Minister, na overleg met Onze Minister van Financiën, wordt per categorie productie-
      installaties een basisbedrag per kWh vastgesteld voor de subsidie voor de productie van hernieuwbare elektriciteit.

      2 Het basisbedrag bedraagt ten hoogste de gemiddelde kosten per kWh voor het produceren van hernieuwbare
      elektriciteit per categorie productie-installaties.

      3 Voor de kWh die voor subsidie in aanmerking komen kunnen verschillende basisbedragen gelden die zijn gerelateerd
      aan:

      a. de hoeveelheid geproduceerde kWh die voor subsidie in aanmerking komt;

      b. het aantal vollasturen van de productie-installatie;

      c. het rendement van de productie-installatie.
    url: https://wetten.overheid.nl/BWBR0022735/2020-11-01#Artikel11
  - number: '12'
    text: |-
      1 Bij regeling van Onze Minister, na overleg met Onze Minister van Financiën, wordt ten behoeve van de correctie
      van het fasebedrag of basisbedrag, bedoeld in [artikel 14][ref1] en de vaststelling van het bedrag dat de
      subsidie ten hoogste bedraagt, bedoeld in [artikel 16][ref2], een basiselektriciteitsprijs per kWh vastgesteld
      die kan verschillen per categorie productie-installaties. Bij regeling van Onze Minister kan een aparte
      basiselektriciteitsprijs per kWh worden vastgesteld voor elektriciteit die niet op een elektriciteitsnet wordt
      ingevoed.

      2 Binnen een categorie productie-installaties kunnen verschillende basiselektriciteitsprijzen gelden die
      gerelateerd zijn aan de hoeveelheid geproduceerde kWh die voor subsidie in aanmerking komt.

      3 De hoogte van de basiselektriciteitsprijs bedraagt tweederde van de lange termijn elektriciteitsprijs.

      4 Indien op grond van het eerste lid een aparte basiselektriciteitsprijs per kWh wordt vastgesteld voor
      elektriciteit die niet op een elektriciteitsnet wordt ingevoed dan geldt voor het aantal kWh dat niet
      op een elektriciteitsnet is ingevoed bij de toepassing van het derde lid en de [artikelen 13][ref3],
      [14, eerste lid, onderdeel a, en tweede lid][ref4], en [16][ref5] de basiselektriciteitsprijs of
      elektriciteitsprijs voor niet op een elektriciteitsnet ingevoede elektriciteit.


