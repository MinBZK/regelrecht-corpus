      Het fasebedrag, bedoeld in [artikel 27][ref1], of het basisbedrag, bedoeld in [artikel 28][ref2], en de
      basisenergieprijs, bedoeld in [artikel 29][ref3], die gelden op het moment van aanvraag van de subsidie, gelden
      gedurende de gehele periode waarover subsidie wordt verstrekt.


