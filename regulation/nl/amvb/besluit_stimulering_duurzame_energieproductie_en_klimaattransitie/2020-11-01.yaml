  - number: '63'
    text: |-
      1 In de beschikking tot subsidieverlening kan aan de subsidie-ontvanger de verplichting tot het indienen van ten
      hoogste één maal per kalenderjaar van een tussentijds voortgangsverslag worden opgelegd dat betrekking heeft op:

      a. de duurzaamheid van biomassa waarmee hernieuwbare elektriciteit, hernieuwbaar gas of hernieuwbare warmte wordt
      opgewekt;

      b. monitorgegevens over de bouw, productie, uitval en onderhoud van de productie-installatie.

      2 Bij ministeriële regeling worden nadere regels gesteld over het tussentijds voortgangsverslag.
    url: https://wetten.overheid.nl/BWBR0022735/2020-11-01#Artikel63
  - number: 63a
    text: |-
      1 In de beschikking tot subsidieverlening kan aan de subsidie-ontvanger de verplichting worden opgelegd
      een private conformiteitsbeoordelingsverklaring te overleggen in verband met de gemiddelde reductie van
      broeikasgassen door het gebruik van biomassa bij energietoepassingen en de volledigheid van de vereiste, krachtens
      [artikel 11a.2 van de Wet milieubeheer][ref1] afgegeven conformiteitsbeoordelingsverklaringen.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld over de private
      conformiteitsbeoordelingsverklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel11a.2
