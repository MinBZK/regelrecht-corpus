    text: |-
      1 Onze Minister verdeelt het subsidieplafond, bedoeld in [artikel 24b, eerste lid][ref1], op basis van
      rangschikking.

      2 Bij ministeriële regeling worden criteria voor rangschikking van de aanvragen vastgesteld.

      3 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot wegingsfactoren voor de criteria,
      bedoeld in het tweede lid.


