  - number: '61'
    text: |-
      1 De subsidie-ontvanger neemt de productie-installatie zo spoedig mogelijk na de datum van de beschikking tot
      subsidieverlening in gebruik. Bij ministeriële regeling wordt de periode vastgesteld waarbinnen de subsidie-
      ontvanger de productie-installatie in gebruik moet nemen. Deze periode kan per categorie productie-installaties
      verschillen.

      2 Een subsidie-ontvanger mag, behoudens ontheffing van Onze Minister, tot de datum van ingebruikname van een
      productie-installatie een beschikking tot subsidieverlening niet overdragen aan een derde.

      3 Bij ministeriële regeling kan worden bepaald dat de beschikking tot subsidieverlening wordt verleend onder de
      opschortende voorwaarde dat:

      a. de subsidie-ontvanger verplicht is mee te werken aan het sluiten van een uitvoeringsovereenkomst als bedoeld in
      [artikel 4:36, tweede lid, van de Algemene wet bestuursrecht][ref1], of

      b. een bankgarantie wordt afgegeven tot zekerheid voor de nakoming van de in de uitvoeringsovereenkomst opgenomen
      verplichtingen.

      Bij ministeriële regeling kunnen nadere regels over de uitvoeringsovereenkomst worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel436
    url: https://wetten.overheid.nl/BWBR0022735/2020-11-01#Artikel61
