  - number: '5'
    text: |-
      Indien sprake is van een situatie als bedoeld in
      [artikel 3, eerste lid, onderdeel b, tweede lid, onderdeel b of derde lid, onderdeel b][ref1], komt uitsluitend
      hernieuwbare elektriciteit, hernieuwbaar gas en hernieuwbare warmte, dan wel de vermindering van broeikasgas die
      als gevolg van deze uitbreiding extra is geproduceerd respectievelijk is gerealiseerd voor subsidie in aanmerking.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel3
