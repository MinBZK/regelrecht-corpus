        bwb_id: BWBR0009755
        artikel: '1'
  - number: '67'
    text: |-
      1 Een voorschot aan een subsidie-ontvanger die hernieuwbare elektriciteit produceert bedraagt het product van:

      a. het in de beschikking tot subsidieverlening per kalenderjaar vastgestelde maximum aantal kWh, waar
      op verzoek van de producent het aantal kWh, bedoeld in [artikel 15, derde of vierde lid][ref1], of
      [23, derde of vierde lid][ref2], bij opgeteld kan worden, en

      b. het fasebedrag of basisbedrag dan wel het tenderbedrag verminderd met de op grond van
      [artikel 14, vijfde lid][ref3], dan wel [artikel 22, vijfde lid][ref4], vastgestelde correcties,

      met dien verstande dat in het daaropvolgende kalenderjaar de hoogte van het voorschot wordt vastgesteld op basis
      van het in het voorgaande kalenderjaar feitelijk geproduceerde en voor subsidie in aanmerking komend aantal kWh en
      het gecorrigeerde bedrag, bedoeld in [artikel 14, vierde lid][ref5], dan wel [artikel 22, vierde lid][ref6].

      2 Een voorschot aan een subsidie-ontvanger die hernieuwbaar gas produceert bedraagt het product van:

      a. het in de beschikking tot subsidieverlening per kalenderjaar vastgestelde maximum aantal kWh, waar
      op verzoek van de producent het aantal kWh, bedoeld in [artikel 32, derde of vierde lid][ref7], of
      [40, derde of vierde lid][ref8], bij opgeteld kan worden, en

      b. het fasebedrag of basisbedrag dan wel het tenderbedrag verminderd met de op grond van
      [artikel 31, vijfde lid][ref9], dan wel [artikel 39, vijfde lid][ref10], vastgestelde correcties,

      met dien verstande dat in het daaropvolgende kalenderjaar de hoogte van het voorschot wordt vastgesteld op basis
      van het in het voorgaande kalenderjaar feitelijk geproduceerde en voor subsidie in aanmerking komend aantal kWh en
      het gecorrigeerde bedrag, bedoeld in [artikel 31, vierde lid][ref11], dan wel [artikel 39, vierde lid][ref12].

      3 Een voorschot aan een subsidie-ontvanger die hernieuwbare warmte of hernieuwbare warmte en hernieuwbare
      elektriciteit produceert bedraagt het product van:

      a. het in de beschikking tot subsidieverlening per kalenderjaar vastgestelde maximum aantal kWh, waar
      op verzoek van de producent het aantal kWh, bedoeld in [artikel 48, derde of vierde lid][ref13], of
      [55, derde of vierde lid][ref14], bij opgeteld kan worden, en

      b. het fasebedrag of basisbedrag dan wel het tenderbedrag verminderd met de op grond van
      [artikel 47, vijfde lid][ref15], dan wel [artikel 54, vijfde lid][ref16], vastgestelde correcties,

      met dien verstande dat in het daaropvolgende kalenderjaar de hoogte van het voorschot wordt vastgesteld op basis
      van het in het voorgaande kalenderjaar feitelijk geproduceerde en voor subsidie in aanmerking komend aantal kWh en
      het gecorrigeerde bedrag, bedoeld in [artikel 47, vierde lid][ref17], dan wel [artikel 54, vierde lid][ref18].

      4 Een voorschot aan een subsidie-ontvanger die broeikasgas vermindert bedraagt het product van:

      a. het in de beschikking tot subsidieverlening per kalenderjaar vastgestelde maximum aantal kg broeikasgas, waar
      op verzoek van de producent het aantal kg broeikasgas, bedoeld in [artikel 55j, derde of vierde lid][ref19], of
      [55q, derde of vierde lid][ref20], bij opgeteld kan worden; en

      b. het fasebedrag of basisbedrag dan wel het tenderbedrag verminderd met de op grond van
      [artikel 55i, vierde lid][ref21], dan wel [artikel 55p, vierde lid][ref22], vastgestelde correcties,

      met dien verstande dat in het daaropvolgende kalenderjaar de hoogte van het voorschot wordt vastgesteld op
      basis van het in het voorgaande kalenderjaar feitelijk geproduceerde en voor subsidie in aanmerking komend
      aantal kg broeikasgas en het gecorrigeerde bedrag, bedoeld in [artikel 55i, derde lid][ref23], dan wel
      [artikel 55p, derde lid][ref24].

      5 Onze Minister verstrekt per jaar slechts een voorschot tot ten hoogste in de beschikking tot subsidieverlening
      per kalenderjaar vastgestelde maximum aantal kWh dan wel kg broeikasgas waar op verzoek van de producent,
      het aantal kWh, bedoeld in [artikel 15, derde of vierde lid][ref25], [23, derde of vierde lid][ref26],
      [32, derde of vierde lid][ref27], [40, derde of vierde lid][ref28], [48, derde of vierde lid][ref29], of
      [55, derde of vierde lid][ref30], dan wel kg broeikasgas als bedoeld in [artikel 55j, derde of vierde lid][ref31]
      of [artikel 55q, derde of vierde lid][ref32], bij opgeteld kan worden.

      6 Indien de meetgegevens niet beschikbaar zijn in het kalenderjaar, bedoeld in het eerste en derde lid, wordt in
      afwijking van het eerste en derde lid het voorschot uiterlijk vastgesteld in het eerstvolgende kalenderjaar nadat
      de meetgegevens beschikbaar zijn.


