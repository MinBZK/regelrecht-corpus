  - number: '59'
    text: |-
      1 Onze Minister beslist in ieder geval afwijzend op een aanvraag indien:

      a. de aanvraag niet voldoet aan dit besluit en de daarop berustende bepalingen;

      b. hij het onaannemelijk acht dat de productie-installatie binnen vier jaar of binnen de bij of krachtens
      [artikel 61, eerste lid][ref1], vastgestelde termijn in gebruik wordt genomen;

      c. hij het onaannemelijk acht dat de realisatie van de productie-installatie:

      1°. uitvoerbaar is;

      2°. technisch haalbaar is;

      3°. financieel haalbaar is;

      4°. economisch haalbaar is;

      d. indien van toepassing één of meer vergunningen als bedoeld in [artikel 56, zesde lid][ref2], niet zijn verleend.

      2 Bij ministeriële regeling kan voor een categorie productie-installaties worden bepaald dat Onze Minister
      afwijzend beslist op een aanvraag indien geen toestemming van de eigenaar van de beoogde locatie is verkregen voor
      het plaatsen van de productie-installatie.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld over de afwijzingsgronden, bedoeld in het eerste
      lid.

      4 Bij ministeriële regeling kan worden bepaald dat Onze Minister in ieder geval afwijzend beslist op een aanvraag
      waarbij het tenderbedrag dusdanig hoog is dat de toekenning ervan bij de rangschikking op tenderbedrag leidt tot
      een overschrijding van het subsidieplafond.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0022735#Artikel56
