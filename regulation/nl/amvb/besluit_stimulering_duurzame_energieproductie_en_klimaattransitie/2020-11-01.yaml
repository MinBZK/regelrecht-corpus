  - number: 55e
    text: |-
      1 Bij regeling van Onze Minister, na overleg met Onze Minister van Financiën, wordt per fase een fasebedrag per
      1000 kg broeikasgasvermindering vastgesteld voor de subsidie voor de vermindering van broeikasgas.

      2 Voor de subsidie voor de vermindering van broeikasgas geldt het fasebedrag per 1000 kg broeikasgasvermindering
      dat is vastgesteld voor de fase waarin de subsidie-aanvrager zijn aanvraag indient, tenzij dat fasebedrag
      hoger is dan het basisbedrag vastgesteld voor de desbetreffende categorie productie-installaties, bedoeld in
      [artikel 55f][ref1], in welk geval dit basisbedrag geldt.

      3 Bij regeling van Onze Minister kan voor een categorie productie-installaties een fasebedrag worden vastgesteld
      dat afwijkt van het fasebedrag vastgesteld op grond van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel55f
    url: https://wetten.overheid.nl/BWBR0022735/2020-11-01#Artikel55e
