  - number: 55j
    text: |-
      1 De subsidie die een subsidie-ontvanger ontvangt wordt bepaald door:

      a. met elkaar te vermenigvuldigen:

      1°. het aantal kg verminderde broeikasgas dat in elk kalenderjaar voor subsidie in aanmerking komt, met

      2°. het voor het desbetreffende kalenderjaar op basis van [artikel 55i][ref1] geldende gecorrigeerde fasebedrag of
      basisbedrag; en

      b. de overeenkomstig onderdeel a berekende bedragen voor ieder kalenderjaar van de periode waarover subsidie wordt
      verstrekt bij elkaar op te tellen.

      2 Het aantal kg verminderde broeikasgas dat jaarlijks voor subsidie in aanmerking komt bedraagt ten hoogste het in
      de beschikking tot subsidieverlening vastgestelde maximum aantal kg broeikasgas dat per jaar kan verschillen en dat
      gebaseerd is op de capaciteit, het rendement en het aantal vollasturen van de installatie.

      3 Bij ministeriële regeling kan voor een categorie productie-installaties worden bepaald dat indien in een jaar
      minder kg broeikasgas is verminderd dan het aantal kg dat het desbetreffende jaar voor subsidie in aanmerking komt,
      het verschil in kg bij het aantal kg dat het volgende jaar voor subsidie in aanmerking komt wordt opgeteld. Bij
      ministeriële regeling kan een maximum, dat per jaar kan verschillen, worden gesteld aan het aantal kg broeikasgas
      dat opgeteld wordt bij het aantal kg broeikasgas dat het volgende jaar voor subsidie in aanmerking komt.

      4 Bij ministeriële regeling kan voor een categorie productie-installaties worden bepaald dat indien in een jaar
      meer kg broeikasgas is verminderd of uit vorige jaren is overgebracht dan het aantal kg verminderde broeikasgas
      dat het desbetreffende jaar voor subsidie in aanmerking komt, waarbij het verschil in kg broeikasgas dat in een
      vorig jaar minder is verminderd ingevolge het derde lid reeds is opgeteld, het verschil in kg bij het aantal kg
      verminderde broeikasgas van het volgende jaar wordt opgeteld. Bij ministeriële regeling kan een maximum, dat per
      jaar kan verschillen, worden gesteld aan het aantal verminderde kg broeikasgas dat opgeteld wordt bij het aantal kg
      broeikasgas dat het volgende jaar voor subsidie in aanmerking komt.

      5 Bij ministeriële regeling kan ten behoeve van de berekening van het maximum aantal kg broeikasgas, bedoeld in het
      tweede lid, per categorie productie-installaties een maximum aantal vollasturen worden bepaald.

      6 Bij ministeriële regeling kunnen regels worden gesteld over de wijze waarop het aantal kg verminderde broeikasgas
      moet worden vastgesteld of berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel55i
