    text: |-
      Onze Minister publiceert zo snel mogelijk na 1 januari 2016, en vervolgens telkens na vijf jaar, een verslag over
      de doeltreffendheid en de effecten van dit besluit in de praktijk.
    url: https://wetten.overheid.nl/BWBR0022735/2020-11-01#Artikel72
  - number: '73'
    text: |-
      Voor een productie-installatie voor de productie van hernieuwbaar gas waarvoor subsidie is verstrekt
      op basis van een aanvraag om subsidie die is ingediend in 2011 wordt bij de toepassing van het
      [artikel 32, eerste lid, onderdeel a][ref1], ten eerste, of [artikel 40, eerste lid, onderdeel a][ref2], ten
      eerste, opgeteld het aantal kWh dat in elk kalenderjaar voor subsidie in aanmerking komt die een producent van
      hernieuwbaar gas in dat kalenderjaar heeft geproduceerd en op een gasnet heeft laten invoeden.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel32
