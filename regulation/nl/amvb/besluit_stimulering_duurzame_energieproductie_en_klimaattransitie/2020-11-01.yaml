    text: |-
      1 Aan de producent van hernieuwbare elektriciteit die is geproduceerd door een bij regeling van Onze Minister aan
      te wijzen categorie productie-installaties voor hernieuwbare elektriciteit, kan subsidie worden verleend.

      2 Bij ministeriële regeling kan worden bepaald dat de subsidieverstrekking voor een categorie productie-
      installaties wordt beperkt tot producenten die zijn aangesloten op een elektriciteitsnet via een aansluiting met
      een totale maximale doorlaatwaarde van meer dan 3*80 A.
