        paragraaf: '6'
  - number: '60'
    text: |-
      1 Onze Minister rangschikt de aanvragen waarop niet met toepassing van [artikel 59][ref1] afwijzend wordt beslist
      zodanig dat een aanvraag hoger wordt gerangschikt indien:

      a. voor hernieuwbare elektriciteit, hernieuwbaar gas of hernieuwbare warmte het tenderbedrag per kWh lager is;

      b. voor hernieuwbare elektriciteit, hernieuwbaar gas, hernieuwbare warmte of vermindering van broeikasgas het
      tenderbedrag per kg vermindering broeikasgas lager is;

      c. voor hernieuwbare elektriciteit, hernieuwbaar gas, hernieuwbare warmte of vermindering van broeikasgas het
      verschil tussen tenderbedrag en langetermijnenergieprijs of langetermijnbroeikasgasbedrag lager is.

      2 Voor de rangschikking kunnen bij ministeriële regeling regels worden vastgesteld met betrekking tot:

      a. de uitwerking van de criteria, bedoeld in het eerste lid;

      b. wegingsfactoren voor de criteria, bedoeld in het eerste lid;

      c. de toepassing van de criteria, bedoeld in het eerste lid.

      3 Onze Minister verdeelt het beschikbare bedrag in de volgorde van rangschikking van de aanvragen.

      4 Indien honorering van alle aanvragen die gelijk zijn gerangschikt ertoe zou leiden dat het beschikbare
      subsidieplafond of het aantal producenten, bedoeld in het zevende lid, zou worden overschreden, stelt Onze Minister
      de onderlinge rangschikking van deze aanvragen vast door middel van loting.

      5 Een gebundelde aanvraag wordt voor de toepassing van dit artikel behandeld als één aanvraag.

      6 Ten behoeve van de rangschikking van aanvragen om subsidie voor een productie-installatie voor de productie van
      hernieuwbare elektriciteit met behulp van windenergie op zee kan Onze Minister het door de producent opgegeven
      tenderbedrag met een bij ministeriële regeling vastgesteld bedrag verminderen, dat gerelateerd is aan de afstand
      van een productie-installatie tot de kust.

      7 Bij ministeriële regeling kan voor een categorie productie-installaties het aantal producenten waaraan subsidie
      wordt verleend, worden beperkt.


