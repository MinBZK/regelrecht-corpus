  - number: '62'
    text: |-
      1 De subsidie-ontvanger realiseert en exploiteert de productie-installatie overeenkomstig de gegevens zoals
      ingediend bij de aanvraag om subsidie.

      2 De verplichting bedoeld in het eerste lid, geldt tot aan de dag waarop de subsidie wordt vastgesteld.

      3 Onze Minister kan voor het vertragen, het essentieel wijzigen of het stopzetten van de realisatie of exploitatie
      van de productie-installatie in afwijking van de gegevens zoals ingediend bij de aanvraag om subsidie op
      voorafgaand verzoek van de subsidie-ontvanger schriftelijk ontheffing verlenen van de verplichting, bedoeld in het
      eerste lid. Aan de ontheffing kunnen voorwaarden worden verbonden. Een ontheffing wordt niet verleend voor zover
      dit zou inhouden dat de subsidie-ontvanger de productie-installatie later in gebruik neemt dan een jaar na de dag
      waarop krachtens [artikel 61, eerste lid][ref1], de productie-installatie in gebruik dient te zijn genomen.

      4 Bij ministeriële regeling kunnen nadere verplichtingen voor de subsidie-ontvanger worden opgelegd, die kunnen
      verschillen per categorie van productie-installaties.

      5 Bij ministeriële regeling kunnen nadere verplichtingen voor de subsidie-ontvanger worden opgelegd in het geval
      dat:

      a. de subsidie-aanvrager een samenwerkingsverband is;

      b. een subsidie-aanvrager, krachtens [artikel 56, vijfde lid][ref2], niet hoeft te voldoen aan artikel 56, vierde
      lid, onderdeel d.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0022735#Artikel56
