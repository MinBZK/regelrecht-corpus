    text: |-
      1 Bij de aanvraag tot subsidieverlening wordt door de producent een tenderbedrag per kWh opgegeven. Bij een
      gebundelde aanvraag is het door de producent opgegeven tenderbedrag van toepassing op alle aanvragen die deel
      uitmaken van de gebundelde aanvraag.

      2 Bij regeling van Onze Minister, na overleg met Onze Minister van Financiën, wordt per categorie productie-
      installaties een maximum tenderbedrag per kWh voor hernieuwbare elektriciteit bepaald.

      3 Het maximum tenderbedrag bedraagt maximaal de gemiddelde kosten per kWh voor het produceren van hernieuwbare
      elektriciteit per categorie van productie-installaties.

      4 Indien de subsidie voor de productie van hernieuwbare elektriciteit met behulp van windenergie op zee per locatie
      wordt verstrekt, wordt bij de aanvraag tot subsidieverlening door de producent voor elke locatie afzonderlijk een
      tenderbedrag als bedoeld in het eerste lid opgegeven. De gecombineerde aanvraag voor twee of meerdere locaties
      wordt behandeld als één aanvraag.
    url: https://wetten.overheid.nl/BWBR0022735/2020-11-01#Artikel19
  - number: '20'
    text: |-
      1 Bij regeling van Onze Minister, na overleg met Onze Minister van Financiën, wordt ten behoeve van de correctie
      van het tenderbedrag, bedoeld in [artikel 22][ref1], en de vaststelling van bedrag dat de subsidie ten hoogste
      bedraagt, bedoeld in [artikel 24][ref2], een basiselektriciteitsprijs per kWh vastgesteld die kan verschillen per
      categorie productie-installaties. Bij regeling van Onze Minister kan een aparte basiselektriciteitsprijs per kWh
      worden vastgesteld voor elektriciteit die niet op een elektriciteitsnet wordt ingevoed.

      2 Binnen een categorie productie-installaties kunnen verschillende basiselektriciteitsprijzen gelden die
      gerelateerd zijn aan de hoeveelheid geproduceerde kWh die voor subsidie in aanmerking komt.

      3 De hoogte van de basiselektriciteitsprijs bedraagt tweederde van de lange termijn elektriciteitsprijs.

      4 Indien op grond van het eerste lid een aparte basiselektriciteitsprijs per kWh worden vastgesteld voor
      elektriciteit die niet op een elektriciteitsnet wordt ingevoed dan geldt voor het aantal kWh dat niet op een
      elektriciteitsnet is ingevoed bij de toepassing van het derde lid en de [artikelen 21, tweede lid][ref3],
      [22, eerste lid, onderdeel a, en tweede lid][ref4], en [24][ref5] de basiselektriciteitsprijs of
      elektriciteitsprijs voor niet op een elektriciteitsnet ingevoede elektriciteit.


