  - number: '31'
    text: |-
      1 Voor elke subsidie-ontvanger geldt dat het fasebedrag of basisbedrag in elk kalenderjaar van de periode waarover
      subsidie wordt verstrekt wordt gecorrigeerd met:

      a. de energieprijs of, indien de energieprijs lager is dan de in [artikel 29][ref1] bedoelde basisenergieprijs, de
      in artikel 29 bedoelde basisenergieprijs;

      b. de waarde van de garanties van oorsprong;

      c. andere bij ministeriële regeling vast te stellen correcties die een substantiële invloed hebben op het verschil
      tussen de gemiddelde kostprijs van de hernieuwbaar gas en de relevante gemiddelde marktprijs van gas en die
      voortvloeien uit maatregelen van de overheid.

      2 De energieprijs, bedoeld in het eerste lid, onderdeel a, bedraagt de gemiddelde waarde voor gas voor de
      betreffende toepassing van het gas.

      3 In de beschikking tot subsidieverlening kan Onze Minister bepalen dat, in aanvulling op het eerste lid,
      het fasebedrag of basisbedrag wordt gecorrigeerd met een bedrag per kWh in verband met opbrengsten die voor
      de subsidie-ontvanger voortvloeien uit het systeem van verhandelbare broeikasgasemissierechten, bedoeld in
      [titel 16.2 van de Wet milieubeheer][ref2].

      4 Bij ministeriële regeling worden jaarlijks voor 1 april de in het eerste en derde lid bedoelde correcties
      vastgesteld, die kunnen verschillen per categorie productie-installaties.

      5 Ten behoeve van de voorschotverlening worden bij ministeriële regeling jaarlijks voor 1 november de in het eerste
      en derde lid bedoelde correcties voor het volgende kalenderjaar vastgesteld, die kunnen verschillen per categorie
      productie-installaties, en waarbij voor de elektriciteitsprijs de gemiddelde waarde in de periode 1 september
      tot en met 31 augustus, of in een bij ministeriele regeling te bepalen periode, voorafgaand aan het kalenderjaar
      wordt gehanteerd. Indien na 1 november bij ministeriële regeling een andere categorie productie-installaties wordt
      aangewezen waarvoor subsidie kan worden aangevraagd, worden de in het eerste en derde lid bedoelde correcties
      ten behoeve van de voorschotverlening voor die categorie productie-installaties bij die ministeriële regeling
      vastgesteld.

      6 Indien een productie-installatie geheel of gedeeltelijk bestaat uit gebruikte materialen, kan Onze Minister
      in de beschikking tot subsidieverlening een correctie op het ingevolge het eerste lid geldende subsidiebedrag
      vaststellen.

      7 Indien een productie-installatie ingrijpend wordt gerenoveerd, kan Onze Minister in de beschikking tot
      subsidieverlening een correctie op het ingevolge het eerste lid geldende subsidiebedrag vaststellen.

      8 Indien het ingevolge het eerste, derde, zesde of zevende lid geldende bedrag negatief is, bedraagt het bedrag
      nul.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel29
