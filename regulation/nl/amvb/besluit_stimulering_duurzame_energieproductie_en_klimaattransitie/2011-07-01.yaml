        bwb_id: BWBR0022735
        artikel: '42'
        paragraaf: '5'
  - number: '51'
    text: |-
      Bij ministeriële regeling wordt, na overleg met Onze Minister van Financiën, per categorie productie-installaties
      een afzonderlijk subsidieplafond of voor meerdere categorieën tezamen één subsidieplafond vastgesteld voor het
      verlenen van subsidies voor de productie van elektriciteit opgewekt door middel van warmtekrachtkoppeling.
    url: https://wetten.overheid.nl/BWBR0022735/2011-07-01#Artikel51
  - number: '52'
    text: |-
      1 Bij regeling van Onze Minister, na overleg met Onze Minister van Financiën, worden per categorie productie-
      installaties jaarlijks voor 1 november voorafgaand aan een kalenderjaar maximum bedragen per kWh waarvoor
      certificaten voor elektriciteit opgewekt door middel van warmtekrachtkoppeling zijn verstrekt, vastgesteld.

      2 Het maximum bedrag per kWh bedraagt ten hoogste het verschil in de gemiddelde productiekosten van warmte en
      elektriciteit door middel van warmtekrachtkoppeling en de gemiddelde marktprijzen van warmte en elektriciteit.

      3 Voor de kWh die voor subsidie in aanmerking komen, kunnen verschillende bedragen gelden die zijn gerelateerd aan
      het aantal vollasturen van de productie-installatie.

      4 Bij de aanvraag tot subsidieverlening wordt door de producent een percentage opgegeven waarmee de maximum
      bedragen per kWh in de beschikking tot subsidieverlening gekort zal worden. Bij een gebundelde aanvraag is het door
      de producent opgegeven percentage van toepassing op alle aanvragen die deel uitmaken van de gebundelde aanvraag.
    url: https://wetten.overheid.nl/BWBR0022735/2011-07-01#Artikel52
  - number: '53'
    text: |-
      1 De maximum bedragen, bedoeld in [artikel 52, eerste lid][ref1], die gelden op de eerste dag van elk kalenderjaar,
      gelden voor dat kalenderjaar.

      2 Het percentage, bedoeld in [artikel 52, vierde lid][ref2], geldt gedurende de gehele periode waarover subsidie
      wordt verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0022735#Artikel52
    url: https://wetten.overheid.nl/BWBR0022735/2011-07-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0022735
        artikel: '52'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0022735
        artikel: '52'
        paragraaf: '5'
  - number: '54'
    text: |-
      1 De subsidie bedraagt de som van de bedragen die in elk jaar van de periode waarover subsidie wordt verstrekt
      worden vastgesteld door het voor dat jaar geldende subsidiebedrag, bedoeld in [artikel 52, eerste lid][ref1], te
      korten met het percentage, bedoeld in [artikel 52, vierde lid][ref2], en de uitkomst hiervan te vermenigvuldigen
      met het aantal kWh dat voor subsidie in aanmerking komt en waarvoor certificaten zijn verstrekt die aantonen
      dat de producent met zijn productie-installatie een hoeveelheid elektriciteit heeft geproduceerd door middel
      van warmtekrachtkoppeling en deze op een elektriciteitsnet of een Nederlandse installatie heeft ingevoed en die
      betrekking hebben op het desbetreffende jaar.

      2 Jaarlijks wordt subsidie verstrekt tot een bij de beschikking tot subsidieverlening bepaald maximum aantal kWh.

      3 Bij ministeriële regeling kan ten behoeve van de berekening van het maximum aantal kWh, bedoeld in het tweede
      lid, per categorie productie-installaties een maximum aantal vollasturen worden bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0022735#Artikel52
    url: https://wetten.overheid.nl/BWBR0022735/2011-07-01#Artikel54
