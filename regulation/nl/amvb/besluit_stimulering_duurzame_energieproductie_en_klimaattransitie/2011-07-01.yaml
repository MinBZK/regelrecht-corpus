  - number: '32'
    text: |-
      1 De subsidie die een subsidie-ontvanger ontvangt wordt bepaald door:

      a. met elkaar te vermenigvuldigen:

      1°. het aantal Nm3 aardgasequivalent dat in elk kalenderjaar voor subsidie in aanmerking komt die een producent van
      hernieuwbaar gas in dat kalenderjaar heeft geproduceerd en op een gasnet heeft ingevoed of heeft laten invoeden,
      met

      2°. het voor het betreffende kalenderjaar op basis van [artikel 31][ref1] geldende gecorrigeerde basisbedrag, en

      b. de overeenkomstig onderdeel a berekende bedragen voor ieder kalenderjaar van de periode waarover subsidie wordt
      verstrekt bij elkaar op te tellen.

      2 Het aantal Nm3 aardgasequivalent dat jaarlijks voor subsidie in aanmerking komt bedraagt ten hoogste het in de
      beschikking tot subsidieverlening vastgestelde maximum aantal Nm3 aardgasequivalent dat per jaar kan verschillen en
      dat gebaseerd is op het vermogen van de installatie en het aantal vollasturen.

      3 Bij ministeriële regeling kan ten behoeve van de berekening van het maximum aantal Nm3 aardgasequivalent, bedoeld
      in het tweede lid, per categorie productie-installaties een maximum aantal vollasturen worden bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel31
