      hernieuwbaar gas.

      2 Het basisbedrag bedraagt ten hoogste de gemiddelde kosten per Nm3 aardgasequivalent voor het produceren van
      hernieuwbaar gas per categorie van productie-installaties.

      3 Voor de Nm3 aardgasequivalent die voor subsidie in aanmerking komen kunnen verschillende basisbedragen gelden die
      zijn gerelateerd aan:

      a. de hoeveelheid geproduceerde Nm3 aardgasequivalent die voor subsidie in aanmerking komt;

      b. het aantal vollasturen van de productie-installatie;

      c. het rendement van de productie-installatie.
    url: https://wetten.overheid.nl/BWBR0022735/2011-07-01#Artikel28
  - number: '29'
    text: |-
      1 Bij regeling van Onze Minister, na overleg met Onze Minister van Financiën, wordt ten behoeve van de correctie
      van het basisbedrag, bedoeld in [artikel 31][ref1] en de vaststelling van het bedrag dat de subsidie ten
      hoogste bedraagt, bedoeld in [artikel 33][ref2], een basisgasprijs per Nm3 aardgasequivalent vastgesteld die kan
      verschillen per categorie productie-installaties.

      2 De hoogte van de basisgasprijs bedraagt tweederde van de lange termijn gasprijs.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0022735#Artikel33
    url: https://wetten.overheid.nl/BWBR0022735/2011-07-01#Artikel29
