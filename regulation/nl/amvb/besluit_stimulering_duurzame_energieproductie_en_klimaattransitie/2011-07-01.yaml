      die elektriciteit produceren door middel van warmtekrachtkoppeling worden aangewezen waarvoor subsidie kan worden
      verleend.

      2 Indien voor een categorie productie-installaties die elektriciteit opwekt door middel van warmtekrachtkoppeling
      subsidie wordt verleend, wordt bij ministeriële regeling de wijze van verdeling van de subsidie bepaald.
