  - number: '62'
    text: |-
      1 De subsidie-ontvanger realiseert en exploiteert de productie-installatie overeenkomstig het plan zoals ingediend
      bij de aanvraag om subsidie.

      2 De verplichting bedoeld in het eerste lid, geldt tot aan de dag waarop de subsidie wordt vastgesteld.

      3 Onze Minister kan voor het vertragen, het essentieel wijzigen of het stopzetten van de realisatie of exploitatie
      van de productie-installatie in afwijking van het plan op voorafgaand verzoek van de subsidie-ontvanger
      schriftelijk ontheffing verlenen van de verplichting, bedoeld in het eerste lid. Aan de ontheffing kunnen
      voorwaarden worden verbonden.

      4 Bij ministeriële regeling kunnen nadere verplichtingen voor de subsidie-ontvanger worden opgelegd, die kunnen
      verschillen per categorie van productie-installaties.
    url: https://wetten.overheid.nl/BWBR0022735/2011-07-01#Artikel62
  - number: '63'
    text: |-
      1 In de beschikking tot subsidieverlening kan aan de subsidie-ontvanger de verplichting tot het indienen van ten
      hoogste één maal per kalenderjaar van een tussentijds voortgangsverslag worden opgelegd dat betrekking heeft op:

      a. de duurzaamheid van biomassa waarmee hernieuwbare elektriciteit, hernieuwbaar gas en elektriciteit opgewekt door
      middel van warmtekrachtkoppeling wordt opgewekt;

      b. monitorgegevens over de bouw, productie, uitval en onderhoud van de productie-installatie.

      2 Bij ministeriële regeling worden nadere regels gesteld over het tussentijds voortgangsverslag.
    url: https://wetten.overheid.nl/BWBR0022735/2011-07-01#Artikel63
  - number: '64'
    text: |-
      De subsidie-ontvanger doet onverwijld mededeling aan Onze Minister van de indiening bij de rechtbank van een
      verzoek tot het op hem van toepassing verklaren van de schuldsaneringsregeling natuurlijke personen, tot verlening
      van surséance van betaling aan hem of tot faillietverklaring van hem.
    url: https://wetten.overheid.nl/BWBR0022735/2011-07-01#Artikel64
  - number: '65'
    text: |-
      De subsidie-ontvanger verstrekt desgevraagd aan Onze Minister alle bescheiden, gegevens of inlichtingen die nodig
      zijn voor een beslissing omtrent de subsidie.
    url: https://wetten.overheid.nl/BWBR0022735/2011-07-01#Artikel65
  - number: '66'
    text: |-
      1 Voor een subsidie waarvoor een beschikking tot subsidieverlening geldt, verstrekt Onze Minister ambtshalve
      maximaal één maal per jaar een voorschot.

      2 Onze Minister verstrekt het eerste voorschot aan een subsidie-ontvanger die hernieuwbare elektriciteit opwekt en
      aan een subsidie-ontvanger die elektriciteit door middel van warmtekrachtkoppeling opwekt niet eerder dan nadat de
      subsidie-ontvanger een rekening, bedoeld in [artikel 1, eerste lid, onder y, van de Elektriciteitswet 1998][ref1],
      bij de garantiebeheerinstantie heeft geopend.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel1
    url: https://wetten.overheid.nl/BWBR0022735/2011-07-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '1'
  - number: '67'
    text: |-
      1 Een voorschot aan een subsidie-ontvanger die hernieuwbare elektriciteit produceert bedraagt het product van:

      a. het in de beschikking tot subsidieverlening per kalenderjaar vastgestelde maximum aantal kWh, en

      b. het basisbedrag dan wel het tenderbedrag verminderd met de op grond van [artikel 14, vierde lid][ref1], dan wel
      [artikel 22, vierde lid][ref2], vastgestelde correcties,

      met dien verstande dat in het daaropvolgende kalenderjaar de hoogte van het voorschot wordt vastgesteld op basis
      van het in het voorgaande kalenderjaar feitelijk geproduceerde en voor subsidie in aanmerking komend aantal kWh en
      het gecorrigeerde bedrag, bedoeld in [artikel 14, derde lid][ref3], dan wel [artikel 22, derde lid][ref4].

      2 Een voorschot aan een subsidie-ontvanger die hernieuwbaar gas produceert bedraagt het product van:

      a. het in de beschikking tot subsidieverlening per kalenderjaar vastgestelde maximum aantal Nm3 aardgasequivalent,
      en

      b. het basisbedrag dan wel het tenderbedrag verminderd met de op grond van [artikel 31, vierde lid][ref5], dan wel
      [artikel 39, vierde lid][ref6], vastgestelde correcties,

      met dien verstande dat in het daaropvolgende kalenderjaar de hoogte van het voorschot wordt vastgesteld op
      basis van het in het voorgaande kalenderjaar feitelijk geproduceerde en voor subsidie in aanmerking komend
      aantal Nm3 aardgasequivalent en het gecorrigeerde bedrag, bedoeld in [artikel 31, derde lid][ref7], dan wel
      [artikel 39, derde lid][ref8].

      3 Een voorschot aan een subsidie-ontvanger die elektriciteit opwekt door middel van warmtekrachtkoppeling bedraagt
      het product van:

      a. het in de beschikking tot subsidieverlening per kalenderjaar vastgestelde maximum aantal kWh, en

      b. de op grond van [artikel 45, eerste lid][ref9], vastgestelde subsidiebedragen verminderd met de op
      grond van [artikel 47, eerste en tweede lid][ref10], vastgestelde correcties dan wel de op grond van
      [artikel 52, eerste lid][ref11], vastgestelde maximum bedragen verminderd met het percentage bedoeld in
      [artikel 52, tweede lid][ref12].

      4 Onze Minister verstrekt per jaar slechts een voorschot tot ten hoogste in de beschikking tot subsidieverlening
      vastgestelde maximum aantal kWh of Nm3 aardgasequivalent.

      5 Indien de meetgegevens niet beschikbaar zijn in het kalenderjaar, bedoeld in het eerste en derde lid, wordt in
      afwijking van het eerste en derde lid het voorschot uiterlijk vastgesteld in het eerstvolgende kalenderjaar nadat
      de meetgegevens beschikbaar zijn.


