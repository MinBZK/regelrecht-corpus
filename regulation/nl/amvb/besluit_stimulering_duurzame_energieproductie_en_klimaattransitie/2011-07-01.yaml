      met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer en Onze Minister van Landbouw, Natuur
      en Voedselkwaliteit, aan te wijzen categorie productie-installaties voor hernieuwbaar gas, kan subsidie worden
      verleend.

      2 Indien voor de productie van hernieuwbaar gas door een bepaalde categorie productie-installaties subsidie wordt
      verleend, wordt bij ministeriële regeling de wijze van verdeling van de subsidie bepaald.
