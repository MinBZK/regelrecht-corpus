  - number: '18'
    text: |-
      Bij ministeriële regeling wordt, na overleg met Onze Minister van Financiën, per categorie productie-installaties
      een afzonderlijk subsidieplafond of voor meerdere categorieën tezamen één subsidieplafond vastgesteld voor het
      verlenen van subsidies voor de productie van hernieuwbare elektriciteit.
    url: https://wetten.overheid.nl/BWBR0022735/2011-07-01#Artikel18
  - number: '19'
    text: |-
      1 Bij de aanvraag tot subsidieverlening wordt door de producent een tenderbedrag per kWh opgegeven. Bij een
      gebundelde aanvraag is het door de producent opgegeven tenderbedrag van toepassing op alle aanvragen die deel
      uitmaken van de gebundelde aanvraag.

      2 Bij regeling van Onze Minister, na overleg met Onze Minister van Financiën, wordt per categorie productie-
      installaties een maximum tenderbedrag per kWh voor hernieuwbare elektriciteit bepaald.

      3 Het maximum tenderbedrag bedraagt maximaal de gemiddelde kosten per kWh voor het produceren van hernieuwbare
      elektriciteit per categorie van productie-installaties.
    url: https://wetten.overheid.nl/BWBR0022735/2011-07-01#Artikel19
  - number: '20'
    text: |-
      1 Bij regeling van Onze Minister, na overleg met Onze Minister van Financiën, wordt ten behoeve van de correctie
      van het tenderbedrag, bedoeld in [artikel 22][ref1], en de vaststelling van bedrag dat de subsidie ten hoogste
      bedraagt, bedoeld in [artikel 24][ref2], een basiselektriciteitsprijs per kWh vastgesteld die kan verschillen per
      categorie productie-installaties.

      2 Binnen een categorie productie-installaties kunnen verschillende basiselektriciteitsprijzen gelden die
      gerelateerd zijn aan de hoeveelheid geproduceerde kWh die voor subsidie in aanmerking komt.

      3 De hoogte van de basiselektriciteitsprijs bedraagt tweederde van de lange termijn elektriciteitsprijs. Indien
      hernieuwbare elektriciteit wordt opgewekt uit wind, wordt de basiselektriciteitsprijs vermenigvuldigd met de factor
      1,25.


