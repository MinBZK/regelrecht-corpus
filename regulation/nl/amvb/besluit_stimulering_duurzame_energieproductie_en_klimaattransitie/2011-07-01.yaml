  - number: '68'
    text: |-
      1 Onze Minister verstrekt de in [artikel 67, eerste en tweede lid][ref1], bedoelde voorschotten in maandelijkse
      bedragen, tenzij bij ministeriële regeling is bepaald dat voor een bepaalde categorie productie-installaties het
      voorschot in een jaarlijks bedrag wordt verstrekt. De som van de maandelijkse bedragen of van het jaarlijkse bedrag
      bedraagt niet meer dan 80% van het product van:

      a. het aantal kWh of Nm3 aardgasequivalent dat volgens de beschikking tot subsidieverlening in het kalenderjaar
      waarop het voorschot betrekking heeft voor subsidie in aanmerking komt, en

      b. het basisbedrag dan wel het tenderbedrag verminderd met de op grond van [artikel 14, vierde lid][ref2] of
      [artikel 31, vierde lid][ref3], dan wel [artikel 22, vierde lid][ref4], of [artikel 39, vierde lid][ref5],
      vastgestelde correcties.

      2 Indien de som van de maandelijkse bedragen of van het jaarlijkse bedrag die in een kalenderjaar zijn verstrekt
      minder dan wel meer bedraagt dan de hoogte van het voorschot dat na afloop van het kalenderjaar wordt vastgesteld,
      kan Onze Minister dit verrekenen met de nog te verstrekken maandelijkse of jaarlijkse bedragen.

      3 Onze Minister verstrekt het in [artikel 67, derde lid][ref6], bedoelde voorschot in maandelijkse bedragen met
      dien verstande dat de som van de maandelijkse bedragen niet meer bedraagt dan 80% van dat voorschot.

      4 Bij ministeriële regeling worden regels gesteld over de berekening van de maandelijkse bedragen en van het
      jaarlijkse bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel67
