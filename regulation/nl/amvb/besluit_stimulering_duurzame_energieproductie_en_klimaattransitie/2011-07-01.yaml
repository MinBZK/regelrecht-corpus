  - number: '36'
    text: |-
      1 Bij de aanvraag tot subsidieverlening wordt door de producent een tenderbedrag per Nm3 aardgasequivalent
      opgegeven. Bij een gebundelde aanvraag is het door de producent opgegeven tenderbedrag van toepassing op alle
      aanvragen die deel uitmaken van de gebundelde aanvraag.

      2 Bij regeling van Onze Minister, na overleg met Onze Minister van Financiën, wordt per categorie productie-
      installaties een maximum tenderbedrag per Nm3 aardgasequivalent voor hernieuwbaar gas bepaald.

      3 Het maximum tenderbedrag bedraagt maximaal de gemiddelde kosten per Nm3 aardgasequivalent voor het produceren van
      hernieuwbaar gas per categorie productie-installaties voor hernieuwbaar gas.
    url: https://wetten.overheid.nl/BWBR0022735/2011-07-01#Artikel36
