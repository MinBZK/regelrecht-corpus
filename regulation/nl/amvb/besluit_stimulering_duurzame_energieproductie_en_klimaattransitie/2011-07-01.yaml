  - number: '30'
    text: |-
      Het basisbedrag, bedoeld in [artikel 28][ref1], en de basisgasprijs, bedoeld in [artikel 29][ref2], die gelden op
      het moment van aanvraag van de subsidie, gelden gedurende de gehele periode waarover subsidie wordt verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0022735#Artikel29
