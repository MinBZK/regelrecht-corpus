  - number: 24a
    text: |-
      1 Onze Minister kan op aanvraag aan een producent van hernieuwbare elektriciteit geproduceerd door een productie-
      installatie voor de productie van hernieuwbare elektriciteit met behulp van windenergie op zee, aan wie een
      subsidie als bedoeld in [artikel 2, onderdeel a][ref1], is verstrekt, subsidie verstrekken voor de bijzondere en
      risicovolle inzet van innovatieve windmolens.

      2 Bij ministeriële regeling worden nadere regels gesteld over de verstrekking van deze subsidie, waarbij in ieder
      geval regels worden gesteld over de productie-installaties waarvoor deze subsidie wordt verstrekt, de vorm van de
      subsidie, de aanvraag van een subsidie en de besluitvorming daarover, het bedrag van de subsidie dan wel de wijze
      waarop dit bedrag wordt bepaald, de vaststelling van de subsidie en de betaling van de subsidie en het verlenen
      van voorschotten.


