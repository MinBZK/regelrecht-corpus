      hoogste bedraagt, bedoeld in [artikel 41][ref2], een basisgasprijs per Nm3 aardgasequivalent vastgesteld die kan
      verschillen voor verschillende categorieën productie-installaties.

      2 De hoogte van de basisgasprijs bedraagt tweederde van de lange termijn gasprijs.


