        bwb_id: BWBR0022735
        artikel: '3'
        paragraaf: '2'
  - number: '6'
    text: |-
      1 De periode waarover subsidie wordt verstrekt vangt aan op het door de subsidie-ontvanger in zijn aanvraag
      aangegeven en in de beschikking tot subsidieverlening overgenomen tijdstip, met dien verstande dat de
      periode waarover subsidie wordt verstrekt niet later aanvangt dan binnen een bij ministeriële regeling vast
      te stellen termijn na de datum van de beschikking tot subsidieverlening. Indien Onze Minister op grond van
      [artikel 62, derde lid][ref1], ontheffing aan de subsidie-ontvanger heeft verleend voor het vertragen van het
      projectplan, vangt de periode waarover subsidie wordt verstrekt aan op de in de ontheffing opgenomen datum.

      2 Onze Minister kan op verzoek van de subsidie-ontvanger voorafgaand aan de periode waarover subsidie wordt
      verstrekt, het tijdstip van aanvang van de periode waarover subsidie wordt verstrekt maximaal driemaal wijzigen
      met dien verstande dat dit tijdstip niet later wordt vastgesteld dan een jaar na het oorspronkelijke tijdstip van
      aanvang.

      3 In afwijking van het eerste lid kan bij ministeriële regeling worden bepaald dat de datum van aanvang van
      de periode waarover de subsidie wordt verstrekt wordt bepaald door de datum waarop de subsidie-ontvanger
      de productie-installatie daadwerkelijk in gebruik neemt, mits deze datum valt binnen de op grond van
      [artikel 61, eerste lid][ref2], bij ministeriële regeling bepaalde periode. Indien de productie-installatie niet
      binnen de op grond van artikel 61, eerste lid, bij ministeriële regeling bepaalde periode in gebruik wordt genomen
      is de dag na afloop van deze periode de datum van aanvang van de periode waarover subsidie wordt verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0022735#Artikel61
    url: https://wetten.overheid.nl/BWBR0022735/2011-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0022735
        artikel: '62'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0022735
        artikel: '61'
        paragraaf: '7'
  - number: '7'
    text: |-
      Bij ministeriële regeling wordt bepaald over welke periode voor een categorie productie-installaties subsidie wordt
      verstrekt. Deze periode kan verschillen voor verschillende categorieën productie-installaties of verschillende
      wijzen van verdeling van het beschikbare bedrag.
    url: https://wetten.overheid.nl/BWBR0022735/2011-07-01#Artikel7
  - number: '8'
    text: |-
      1 Aan de producent van hernieuwbare elektriciteit die is geproduceerd door een bij regeling van Onze Minister, na
      overleg met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer en Onze Minister van Landbouw,
      Natuur en Voedselkwaliteit, aan te wijzen categorie productie-installaties voor hernieuwbare elektriciteit, kan
      subsidie worden verleend.

      2 Indien voor de productie van hernieuwbare elektriciteit door een bepaalde categorie productie-installaties
      subsidie wordt verleend, wordt bij ministeriële regeling de wijze van verdeling van het beschikbare bedrag bepaald.
    url: https://wetten.overheid.nl/BWBR0022735/2011-07-01#Artikel8
  - number: '9'
    text: |-
      De bepalingen in deze paragraaf gelden indien ingevolge [artikel 8, tweede lid][ref1], wordt gekozen voor verdeling
      op volgorde van binnenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel8
    url: https://wetten.overheid.nl/BWBR0022735/2011-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0022735
        artikel: '8'
        paragraaf: '3'
  - number: '10'
    text: |-
      1 Bij ministeriële regeling wordt, na overleg met Onze Minister van Financiën, per categorie productie-installaties
      een afzonderlijk subsidieplafond of voor meerdere categorieën tezamen één subsidieplafond vastgesteld voor het
      verlenen van subsidies voor de productie van hernieuwbare elektriciteit.

      2 Bij ministeriële regeling kunnen perioden worden vastgesteld waarbinnen de aanvragen ontvangen moeten zijn.
    url: https://wetten.overheid.nl/BWBR0022735/2011-07-01#Artikel10
  - number: '11'
    text: |-
      1 Bij regeling van Onze Minister, na overleg met Onze Minister van Financiën, wordt per categorie productie-
      installaties een basisbedrag per kWh vastgesteld voor de subsidie voor de productie van hernieuwbare elektriciteit.

      2 Het basisbedrag bedraagt ten hoogste de gemiddelde kosten per kWh voor het produceren van hernieuwbare
      elektriciteit per categorie productie-installaties.

      3 Voor de kWh die voor subsidie in aanmerking komen kunnen verschillende basisbedragen gelden die zijn gerelateerd
      aan:

      a. de hoeveelheid geproduceerde kWh die voor subsidie in aanmerking komt;

      b. het aantal vollasturen van de productie-installatie;

      c. het rendement van de productie-installatie.
    url: https://wetten.overheid.nl/BWBR0022735/2011-07-01#Artikel11
  - number: '12'
    text: |-
      1 Bij regeling van Onze Minister, na overleg met Onze Minister van Financiën, wordt ten behoeve van de correctie
      van het basisbedrag, bedoeld in [artikel 14][ref1] en de vaststelling van het bedrag dat de subsidie ten hoogste
      bedraagt, bedoeld in [artikel 16][ref2], een basiselektriciteitsprijs per kWh vastgesteld die kan verschillen per
      categorie productie-installaties.

      2 Binnen een categorie productie-installaties kunnen verschillende basiselektriciteitsprijzen gelden die
      gerelateerd zijn aan de hoeveelheid geproduceerde kWh die voor subsidie in aanmerking komt.

      3 De hoogte van de basiselektriciteitsprijs bedraagt tweederde van de lange termijn elektriciteitsprijs. Indien
      hernieuwbare elektriciteit wordt opgewekt uit wind, wordt de basiselektriciteitsprijs vermenigvuldigd met de factor
      1,25.


