  - number: '4'
    text: |-
      Onze Minister kan reeds ontvangen of genoten overheidssteun dan wel in de toekomst te ontvangen of te genieten
      overheidssteun die er toe leidt dat de totale aan de producent verleende overheidssteun meer bedraagt dan is
      toegestaan ingevolge voor de Staat geldende verplichtingen krachtens een verdrag, in mindering brengen op de
      subsidie bedoeld in [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel2
    url: https://wetten.overheid.nl/BWBR0022735/2011-07-01#Artikel4
