  - number: '13'
    text: |-
      Het basisbedrag, bedoeld in [artikel 11][ref1], en de basiselektriciteitsprijs, bedoeld in [artikel 12][ref2],
      die gelden op het moment van aanvraag van de subsidie, gelden gedurende de gehele periode waarover subsidie wordt
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0022735#Artikel12
    url: https://wetten.overheid.nl/BWBR0022735/2011-07-01#Artikel13
