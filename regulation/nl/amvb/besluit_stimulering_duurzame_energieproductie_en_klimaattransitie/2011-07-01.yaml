  - number: '69'
    text: |-
      Onze Minister verstrekt geen voorschot, indien de subsidie-ontvanger niet heeft voldaan aan ingevolge de
      subsidieverlening voor hem geldende verplichtingen, indien hij failliet is verklaard of aan hem surséance van
      betaling is verleend of ten aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing is
      verklaard, dan wel een verzoek daartoe bij de rechtbank is ingediend.
    url: https://wetten.overheid.nl/BWBR0022735/2011-07-01#Artikel69
  - number: '70'
    text: |-
      1 De subsidie-ontvanger dient zijn aanvraag om subsidievaststelling in binnen zes maanden na het tijdstip waarop
      periode waarover subsidie wordt verstrekt, bepaald in de beschikking tot subsidieverlening, is verstreken.

      2 De aanvraag wordt ingediend met gebruikmaking van een formulier, overeenkomstig het model dat bij ministeriële
      regeling is vastgesteld.

      3 De aanvraag gaat, overeenkomstig in het formulier is vermeld, vergezeld van de in het formulier aangegeven
      bescheiden.
    url: https://wetten.overheid.nl/BWBR0022735/2011-07-01#Artikel70
  - number: '71'
    text: |-
      Onze Minister geeft de beschikking tot subsidievaststelling binnen dertien weken na ontvangst van de aanvraag
      daartoe dan wel nadat de voor het indienen ervan geldende termijn is verstreken.
    url: https://wetten.overheid.nl/BWBR0022735/2011-07-01#Artikel71
  - number: '72'
    text: |-
      Onze Minister publiceert binnen vier jaar na de inwerkingtreding van dit besluit een verslag over de
      doeltreffendheid en de effecten van dit besluit.
    url: https://wetten.overheid.nl/BWBR0022735/2011-07-01#Artikel72
  - number: '75'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0022735/2011-07-01#Artikel75
  - number: '76'
    text: 'Dit besluit wordt aangehaald als: Besluit stimulering duurzame energieproductie.'
    url: https://wetten.overheid.nl/BWBR0022735/2011-07-01#Artikel76
