  - number: '45'
    text: |-
      1 Bij regeling van Onze Minister, na overleg met Onze Minister van Financiën, worden per categorie van productie-
      installaties jaarlijks voor 1 november voorafgaand aan een kalenderjaar subsidiebedragen per kWh waarvoor
      certificaten voor elektriciteit opgewekt door middel van warmtekrachtkoppeling zijn verstrekt, vastgesteld.

      2 Het subsidiebedrag bedraagt ten hoogste het verschil in de gemiddelde productiekosten van warmte en elektriciteit
      opgewekt door middel van warmtekrachtkoppeling en de gemiddelde marktprijzen van warmte en elektriciteit.

      3 Voor de kWh die voor subsidie in aanmerking komen, kunnen verschillende bedragen gelden die zijn gerelateerd aan
      het aantal vollasturen van de productie-installatie.
    url: https://wetten.overheid.nl/BWBR0022735/2011-07-01#Artikel45
