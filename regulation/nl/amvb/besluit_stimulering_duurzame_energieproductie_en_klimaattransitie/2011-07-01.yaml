        artikel: '59'
        paragraaf: '6'
  - number: '61'
    text: |-
      1 De subsidie-ontvanger neemt de productie-installatie zo spoedig mogelijk na de datum van de beschikking tot
      subsidieverlening in gebruik. Bij ministeriële regeling wordt de periode vastgesteld waarbinnen de subsidie-
      ontvanger de productie-installatie in gebruik moet nemen. Deze periode kan per categorie productie-installaties
      verschillen.

      2 Een subsidie-ontvanger mag, behoudens ontheffing van Onze Minister, tot de datum van ingebruikname van een
      productie-installatie een beschikking tot subsidieverlening niet overdragen aan een derde.

      3 Bij ministeriële regeling kan worden bepaald dat de beschikking tot subsidieverlening wordt verleend onder
      de opschortende voorwaarde dat de subsidie-ontvanger verplicht is mee te werken aan het sluiten van een
      uitvoeringsovereenkomst als bedoeld in [artikel 4:36, tweede lid, van de Algemene wet bestuursrecht][ref1]. Bij
      ministeriële regeling kunnen nadere eisen aan de uitvoeringsovereenkomst worden gesteld.

      4 Indien [artikel 3, eerste lid, onderdeel e][ref2], van toepassing is, verzoekt de subsidie-ontvanger binnen vier
      weken na de datum van de beschikking tot subsidieverlening Onze Minister de beschikking tot subsidieverlening op
      grond van [artikel 72m van de Elektriciteitswet 1998][ref3] zoals [dat artikel][ref4] luidde op 31 december 2006,
      in te trekken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel436
      [ref2]: https://wetten.overheid.nl/BWBR0022735#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel72m
      [ref4]: https://wetten.overheid.nl/BWBR0009755#Artikel72m
