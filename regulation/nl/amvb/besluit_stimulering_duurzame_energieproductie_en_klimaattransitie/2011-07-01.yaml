  - number: '55'
    text: |-
      1 Bij ministeriële regeling wordt een bedrag per kWh vastgesteld waarop de subsidie ten hoogste kan worden
      vastgesteld.

      2 Het bedrag, bedoeld in het eerste lid, dat geldt op het moment van aanvraag van de subsidie, geldt gedurende de
      gehele periode waarover subsidie wordt verstrekt.

      3 De subsidie bedraagt ten hoogste het bedrag, bedoeld in het eerste lid, gekort met het percentage, bedoeld in
      [artikel 52, vierde lid][ref1], vermenigvuldigd met het aantal in de beschikking tot subsidieverlening bepaald
      maximum kWh.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel52
    url: https://wetten.overheid.nl/BWBR0022735/2011-07-01#Artikel55
