      - id: ref3
        bwb_id: BWBR0026872
        paragraaf: '6'
  - number: '57'
    text: |-
      1 Onze Minister beslist op een aanvraag:

      a. om een subsidie voor de productie van hernieuwbare elektriciteit, hernieuwbaar gas of elektriciteit opgewekt
      door middel van warmtekrachtkoppeling die wordt verdeeld op volgorde van binnenkomst, binnen dertien weken na
      ontvangst van de aanvraag;

      b. om een subsidie voor hernieuwbare elektriciteit, hernieuwbaar gas of elektriciteit opgewekt door middel van
      warmtekrachtkoppeling die wordt verdeeld op volgorde van rangschikking, binnen dertien weken na de laatste dag van
      de bij ministeriële regeling vastgestelde periode.

      2 De in het eerste lid genoemde perioden kunnen éénmaal met ten hoogste dertien weken worden verlengd.

      3 Indien een gebundelde aanvraag niet leidt tot subsidieverlening door Onze Minister, kan een gebundelde aanvraag
      worden behandeld als één aanvraag.

      4 Indien Onze Minister aan de aanvrager van een gebundelde aanvraag subsidie verstrekt, verstrekt Onze Minister per
      productie-installatie die onderdeel is van de gebundelde aanvraag een beschikking tot subsidieverlening.
    url: https://wetten.overheid.nl/BWBR0022735/2011-07-01#Artikel57
  - number: '58'
    text: |-
      1 Ingeval van verdeling op volgorde van binnenkomst, verdeelt Onze Minister het beschikbare bedrag in de
      volgorde van ontvangst van de aanvragen, met dien verstande dat indien een aanvrager niet heeft voldaan
      aan enig wettelijk voorschrift voor het in behandeling nemen van de aanvraag en met toepassing van
      [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft gehad de aanvraag aan te vullen, de dag
      waarop de aanvraag voldoet aan de wettelijke voorschriften als datum van ontvangst geldt.

      2 Indien honorering van alle aanvragen die op één dag zijn ontvangen ertoe zou leiden dat het beschikbare
      subsidieplafond zou worden overschreden, stelt Onze Minister de volgorde van ontvangst van deze aanvragen vast door
      middel van loting.

      3 Aanvragen die worden ontvangen op werkdagen na 17.00 uur of andere dagen, worden aangemerkt als ontvangen op de
      eerstvolgende werkdag.

      4 In geval van loting wordt een gebundelde aanvraag behandeld als één aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel45
    url: https://wetten.overheid.nl/BWBR0022735/2011-07-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:5
  - number: '59'
    text: |-
      1 Onze Minister beslist in ieder geval afwijzend op een aanvraag indien:

      a. de aanvraag niet voldoet aan dit besluit en de daarop berustende bepalingen;

      b. hij het onaannemelijk acht dat de productie-installatie binnen vier jaar of binnen de bij of krachtens
      [artikel 61, eerste lid][ref1], vastgestelde termijn in gebruik wordt genomen;

      c. onvoldoende vertrouwen bestaat in de economische haalbaarheid van de productie-installatie.

      2 Bij ministeriële regeling kan voor een categorie productie-installaties worden bepaald dat Onze Minister
      afwijzend beslist op een aanvraag indien op het moment van indienen van de aanvraag geen toestemming van de
      eigenaar van de beoogde locatie is verkregen voor het plaatsen van de productie-installatie.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel61
    url: https://wetten.overheid.nl/BWBR0022735/2011-07-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0022735
        artikel: '61'
        paragraaf: '7'
  - number: '60'
    text: |-
      1 Onze Minister rangschikt de aanvragen waarop niet met toepassing van het [artikel 59][ref1] afwijzend wordt
      beslist zodanig dat een aanvraag hoger wordt gerangschikt indien:

      a. het tenderbedrag per kWh of per Nm3 lager is;

      b. het kortingspercentage hoger is;

      c. er meer sprake is van technologische- of brandstofinnovatie;

      d. voor de productie van hernieuwbare elektriciteit en hernieuwbaar gas sprake is van meer netto broeikasgas-
      reductie ten opzichte van de productie van energie uit niet-hernieuwbare bronnen;

      e. voor elektriciteit opgewekt door middel van warmtekrachtkoppeling meer sprake is van het vermijden van negatieve
      externe effecten door het verminderen van emissies van kooldioxide.

      2 Voor de rangschikking kunnen bij ministeriële regeling regels worden vastgesteld met betrekking tot:

      a. wegingsfactoren voor de criteria, bedoeld in het eerste lid;

      b. de toepassing van de criteria, bedoeld in het eerste lid.

      3 Onze Minister verdeelt het beschikbare bedrag in de volgorde van rangschikking van de aanvragen.

      4 Indien honorering van alle aanvragen die gelijk zijn gerangschikt ertoe zou leiden dat het beschikbare
      subsidieplafond zou worden overschreden, stelt Onze Minister de onderlinge rangschikking van deze aanvragen vast
      door middel van loting.

      5 Een gebundelde aanvraag wordt voor de toepassing van dit artikel behandeld als één aanvraag.

      6 Ten behoeve van de rangschikking van aanvragen om subsidie voor een productie-installatie voor de productie van
      hernieuwbare elektriciteit met behulp van windenergie op zee kan Onze Minister het door de producent opgegeven
      tenderbedrag met een bij ministeriële regeling vastgesteld bedrag verminderen, dat gerelateerd is aan de afstand
      van een productie-installatie tot de kust.


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel59
    url: https://wetten.overheid.nl/BWBR0022735/2011-07-01#Artikel60
