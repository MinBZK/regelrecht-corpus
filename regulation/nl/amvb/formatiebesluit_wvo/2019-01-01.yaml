  - number: '8.2'
    text: |-
      De uitkomsten van deze vermenigvuldiging en de som van de bedragen voor de onderscheiden personeelscategorieën
      worden uitgedrukt in een bedrag dat rekenkundig wordt afgerond op twee decimalen.
    url: https://wetten.overheid.nl/BWBR0005446/2019-01-01#Artikel8
  - number: '8.3'
    text: |-
      Naast de bekostiging, bedoeld in het eerste en tweede lid, wordt voor het praktijkonderwijs en het
      leerwegondersteunend onderwijs per geïndiceerde leerling een bedrag beschikbaar gesteld voor extra ondersteuning.
      Dit ondersteuningsbedrag is tot stand gekomen door het verschil te berekenen tussen de ratio leraar/leerling
      van 1/8,87, vermenigvuldigd met de gemiddelde personeelslast en de ratio leraar/leerling van 1/17,14, bedoeld
      in [artikel 3][ref1], eveneens vermenigvuldigd met de gemiddelde personeelslast. Het ondersteuningsbedrag wordt
      jaarlijks bij ministeriële regeling vastgesteld. De bekostiging op schoolniveau wordt berekend door het aantal
      op de teldatum ingeschreven leerlingen praktijkonderwijs en leerwegondersteunend onderwijs van de school of
      scholengemeenschap te vermenigvuldigen met de bij ministeriële regeling vast te stellen ondersteuningsbedragen
      per leerling. Bij de jaarlijkse vaststelling van deze ondersteuningsbedragen wordt rekening gehouden met het
      beschikbare budget van het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0005446#Artikel3
    url: https://wetten.overheid.nl/BWBR0005446/2019-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005446
        artikel: '3'
        hoofdstuk: II
  - number: '10'
    text: |-
      Onze Minister bepaalt de wijze waarop de hoofdstukken I tot en met III, alsmede [artikel 85 van de wet][ref1]
      toepassing vinden ten behoeve van een cursus, verbonden aan een school of scholengemeenschap, in verband met de
      aard, inhoud, omvang of duur van de cursus.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel85
    url: https://wetten.overheid.nl/BWBR0005446/2019-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '85'
  - number: '11'
    text: |-
      Ten behoeve van een school of scholengemeenschap met een bijzondere inrichting van het onderwijs kan Onze Minister
      op verzoek van het bevoegd gezag toestaan dat wordt afgeweken van de hoofdstukken I en II. Onze Minister besluit
      binnen zes maanden na ontvangst van een aanvraag. Indien de beschikking niet binnen zes maanden kan worden gegeven,
      stelt Onze Minister de aanvrager daarvan in kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel
      tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0005446/2019-01-01#Artikel11
  - number: '12'
    text: |-
      Op een bij koninklijk besluit te bepalen tijdstip vervallen in [artikel 2][ref1] het tweede en derde lid en de
      aanduiding van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005446#Artikel2
