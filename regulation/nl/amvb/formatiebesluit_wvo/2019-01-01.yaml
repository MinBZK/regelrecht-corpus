articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder: - **directie:** in [artikel 84, eerste lid, onderdeel a, van de wet][ref1]
      genoemde personeel;
        - **formatieplaats:** betrekking met de omvang van een volledige weektaak;
        - **leerwegondersteunend onderwijs:** onderwijs, bedoeld in [artikel 10e van de wet][ref2];
        - **Onze Minister:** Onze Minister van Onderwijs, Cultuur en Wetenschap;
        - **personeelscategorie:** in [artikel 84 van de wet][ref3] genoemde onderscheiden personeelscategorieën;
        - **ratio:** aantal formatieplaatsen van een bepaalde personeelscategorie per aantal leerlingen als bedoeld in
      [artikel 84, tweede lid, van de wet][ref4];
        - **samenwerkingsverband:** samenwerkingsverband als bedoeld in [artikel 1 van de wet][ref5];
        - **school:** school voor voortgezet onderwijs;
        - **scholengemeenschap:** scholengemeenschap bestaande uit twee of meer scholen;
        - **schooljaar:** tijdvak van 1 augustus van enig kalenderjaar tot en met 31 juli daaraanvolgend;
        - **schoolsoortgroep 1:** scholen voor middelbaar algemeen voortgezet onderwijs, scholen voor voorbereidend
      beroepsonderwijs, scholen voor praktijkonderwijs en scholengemeenschappen bestaande uit ten minste twee van deze
      schoolsoorten, inclusief het leerwegondersteunend onderwijs;
        - **schoolsoortgroep 2:** scholen voor voorbereidend wetenschappelijk onderwijs, hoger algemeen voortgezet
      onderwijs en scholengemeenschappen bestaande uit een combinatie van deze scholen;
        - **schoolsoortgroep 3:** scholengemeenschappen bestaande uit scholen voor hoger algemeen voortgezet onderwijs en
      scholen voor middelbaar algemeen voortgezet onderwijs, al dan niet in combinatie met scholen voor voorbereidend
      wetenschappelijk onderwijs, inclusief het leerwegondersteunend onderwijs;
        - **schoolsoortgroep 4:** scholengemeenschappen bestaande uit scholen voor hoger algemeen voortgezet onderwijs,
      scholen voor middelbaar algemeen voortgezet onderwijs en scholen voor voorbereidend beroepsonderwijs, al dan
      niet in combinatie met scholen voor praktijkonderwijs of scholen voor voorbereidend wetenschappelijk onderwijs,
      inclusief het leerwegondersteunend onderwijs, en **wet:** [Wet op het voortgezet onderwijs][ref6].


