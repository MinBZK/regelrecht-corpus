  - number: '13'
    text: |-
      [Paragraaf 4 en paragraaf 7 van en de bijlage bij de Regeling bekostiging, rechtspositie en samenvoeging
      leerwegondersteunend onderwijs en praktijkonderwijs](onbekend) zoals luidend op 31 juli 2003 blijven van
      toepassing op de daarin bedoelde samenvoegingen en omzettingen in afdelingen voor leerwegondersteunend onderwijs en
      praktijkonderwijs die uiterlijk op 1 augustus 2002 hebben plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0005446/2019-01-01#Artikel13
