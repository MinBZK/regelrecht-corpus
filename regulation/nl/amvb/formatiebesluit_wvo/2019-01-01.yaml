    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Onderwijs en Wetenschappen van 6 december 1991, nr. 91070609/3198,
    centrale directie Wetgeving en Juridische Zaken, gedaan mede namens Onze Minister van Landbouw, Natuurbeheer en
    Visserij;

    Gelet op de artikelen 77, derde lid, 84, 84a, tweede lid, en 98a, eerste lid, van de Wet op het voortgezet
    onderwijs (Stb. 1986, 552);

    Gehoord de Onderwijsraad (advies van 16 juli 1991, nr. OR 91000177 S);

    De Raad van State gehoord (advies van 6 februari 1992, nr. W05.91.0696);

    Gezien het nader rapport van de Staatssecretaris van Onderwijs en Wetenschappen, van 10 maart 1992, nr.
    92013845/3198, centrale directie Wetgeving en Juridische Zaken, uitgebracht mede namens Onze Minister van Landbouw,
    Natuurbeheer en Visserij;

    Hebben goedgevonden en verstaan:
