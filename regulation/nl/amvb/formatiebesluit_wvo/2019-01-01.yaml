      de leerlingen die reeds met goed gevolg eindexamen aan een school voor voorbereidend wetenschappelijk onderwijs,
      voor hoger algemeen voortgezet onderwijs, voor middelbaar algemeen voortgezet onderwijs of voor voorbereidend
      beroepsonderwijs hebben afgelegd en zich voorbereiden op het opnieuw afleggen van het eindexamen aan een
      gelijksoortige school, met dien verstande dat het afleggen van het eindexamen in een bepaalde leerweg aan een
      school voor voorbereidend beroepsonderwijs door een leerling die reeds met goed gevolg het eindexamen heeft
      afgelegd van een andere leerweg van het voorbereidend beroepsonderwijs niet worden aangemerkt als het opnieuw
      afleggen van het eindexamen aan een gelijksoortige school,
