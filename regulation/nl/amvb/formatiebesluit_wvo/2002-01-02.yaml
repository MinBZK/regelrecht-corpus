        hoofdstuk: II
  - number: '7.2'
    text: |-
      De uitkomst van de in [artikel 6, tweede lid][ref1], genoemde formule wordt uitgedrukt in een getal dat wordt
      afgerond op twee decimalen, waarbij de tweede decimaal indien de derde decimaal 5 of meer bedraagt naar boven wordt
      afgerond en indien deze minder dan 5 bedraagt naar beneden wordt afgerond.


      [ref1]: https://wetten.overheid.nl/BWBR0005446#Artikel6
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005446
        artikel: '6'
        hoofdstuk: II
  - number: '8.1'
    text: |-
      De vergoeding in verband met de kosten van het personeel wordt bepaald door het met toepassing van
      [de artikelen 2 tot en met 7][ref1] berekende aantal formatieplaatsen voor de onderscheiden personeelscategorieën
      te vermenigvuldigen met de desbetreffende gemiddelde personeelslast en de uitkomsten bij elkaar op te tellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005446#Artikel2
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005446
        artikel: '2'
        hoofdstuk: II
  - number: '8.2'
    text: |-
      De uitkomsten van deze vermenigvuldiging en de som van de bedragen voor de onderscheiden personeelscategorieën
      worden uitgedrukt in een bedrag dat wordt afgerond op twee decimalen, waarbij de tweede decimaal indien de derde
      decimaal 5 of meer bedraagt naar boven wordt afgerond en indien deze minder dan 5 bedraagt naar beneden wordt
      afgerond.
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel8
  - number: '9'
    text: |-
      De bevoegde gezagsorganen van scholen en van scholengemeenschappen zijn aangesloten bij de rechtspersoon, bedoeld
      in [artikel 98a van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel98a
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 98a
  - number: '10'
    text: |-
      Onze Minister bepaalt de wijze waarop de hoofdstukken I tot en met III, alsmede [artikel 85 van de wet][ref1]
      toepassing vinden ten behoeve van een cursus, verbonden aan een school of scholengemeenschap, in verband met de
      aard, inhoud, omvang of duur van de cursus.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel85
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '85'
  - number: '11'
    text: |-
      Ten behoeve van een school of scholengemeenschap met een bijzondere inrichting van het onderwijs kan Onze Minister
      op verzoek van het bevoegd gezag goedkeuren dat wordt afgeweken van de hoofdstukken I en II. Onze Minister beslist
      binnen zes maanden na ontvangst van een aanvraag. Indien de beschikking niet binnen zes maanden kan worden gegeven,
      stelt Onze Minister de aanvrager daarvan in kennis en noemt hij daarbij een termijn waarbinnen de beschikking wel
      tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel11
  - number: '12'
    text: |-
      In [deel II][ref1] van dit besluit wordt verstaan onder: wet: [deel II van de Wet op het voortgezet onderwijs]
      (onbekend); Onze Minister: Onze Minister van Onderwijs, Cultuur en Wetenschappen; school: een school voor
      voortgezet speciaal onderwijs als bedoeld in [artikel 125 van de wet][ref2], tenzij het tegendeel blijkt; bevoegd
      gezag: 'wat betreft a. een openbare school of instelling: het college van burgemeester en wethouders, voor zover'
      de raad niet anders bepaalt, en, indien de raad dit wenselijk oordeelt, met inachtneming van door hem te stellen
      regelen, dan wel het krachtens een gemeenschappelijke regeling bevoegde orgaan; b. een bijzondere school of
      instelling: 'de rechtspersoon, bedoeld in artikel 175 van de wet; schooljaar: het tijdvak van 1 augustus tot en met'
      31 juli daaropvolgend; teldatum: een van de data, bedoeld in artikel 234 van de wet; schoolsoort: soort school als
      bedoeld in artikel 131, van de wet, verdeeld als aangegeven in artikel 125, tweede lid, van de wet; leerling met
      een niet-Nederlandse culturele achtergrond: leerling: a. die behoort tot de Molukse bevolkingsgroep; b. van wie ten
      minste een van de ouders of voogden afkomstig is uit Griekenland, Italië, het voormalige Joegoslavië, Kaapverdië,
      Marokko, Portugal, Spanje, Tunesië of Turkije; c. van wie ten minste een van de ouders of voogden afkomstig is uit
      Suriname, de Nederlandse Antillen of Aruba; d. van wie ten minste een van de ouders of voogden door Onze Minister
      van Justitie als vluchteling is toegelaten op grond van artikel 15 van de Vreemdelingenwet (*Stb.* 1965, 40); e.
      van wie ten minste een van de ouders of voogden afkomstig is uit een ander niet-Engelstalig land buiten Europa,
      echter met uitzondering van Indonesië; vakonderwijs: onderwijs dat gegeven wordt door een leraar die uitsluitend is
      benoemd voor het geven van bepaalde onderwijsactiviteiten of vakken; groepsonderwijs: onderwijs dat gegeven wordt
      door een leraar die niet is benoemd voor het geven van vakonderwijs; ambulante begeleiding: de begeleiding door een
      aan een school verbonden leraar van een of meer leerlingen in het voortgezet onderwijs die zonder deze begeleiding
      zou onderscheidenlijk zouden zijn aangewezen op het onderwijs dat de school verzorgt, alsmede de ondersteuning
      van een school voor voortgezet onderwijs bij de opvang van zodanige leerlingen door een leraar, orthopedagoog,
      psycholoog of logopedist van de school; formatiebudget: het formatiebudget, bedoeld in artikel 235, eerste lid, van
      de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005446#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel125
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel12
    references:
