    text: 'Bij de vaststelling van het aantal leerlingen worden niet meegeteld:'
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel6
  - number: 6.4.a
    text: |-
      de leerlingen die reeds met goed gevolg eindexamen aan een school voor voorbereidend wetenschappelijk onderwijs,
      voor hoger algemeen voortgezet onderwijs of voor middelbaar algemeen voortgezet onderwijs hebben afgelegd en zich
      voorbereiden op het opnieuw afleggen van het eindexamen aan een gelijksoortige school, en
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel6
  - number: 6.4.b
    text: |-
      de leerlingen die deelnemen aan het onderwijs in het kader van contractactiviteiten als bedoeld in
      [artikel 20, derde lid][ref1], van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005446#Artikel20
