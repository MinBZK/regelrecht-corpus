  - number: 19.1.a
    text: het aantal leerlingen op 16 januari van het schooljaar, en
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel19
  - number: 19.1.b
    text: |-
      het aantal leerlingen op 1 oktober van het schooljaar onderscheidenlijk het aantal leerlingen op de teldatum die op
      grond van [artikel 234, tweede lid, van de wet][ref1] van toepassing is,


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel234
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '234'
  - number: '19.2'
    text: |-
      Aanspraak op verhoging van de formatie ingevolge het eerste lid, ontstaat met ingang van 1 augustus van het daarop
      volgende schooljaar.
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel19
  - number: '20.1'
    text: |-
      Tenzij Onze Minister anders beslist, wordt ten behoeve van een nieuwe school acht weken voor de opening van de
      school 1 formatieplaats voor de directeur en, afhankelijk van het aantal te verwachten leerlingen, bedoeld bij de
      factor B in [artikel 17, tweede lid][ref1], formatie voor de overige leden van de commissie van onderzoek, bedoeld
      in artikel 161, tweede lid, van de wet, voor een psychologisch assistent en voor een administratief medewerker
      toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0005446#Artikel17
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005446
        artikel: '17'
        hoofdstuk: II
  - number: '20.2'
    text: De formatieplaats voor de directeur, bedoeld in het eerste lid, wordt uitgedrukt in 265 formatierekeneenheden.
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel20
  - number: '21.1'
    text: |-
      De formatie van een school ten behoeve van de ambulante begeleiding wordt berekend aan de hand van de formule H =J
      * K.
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel21
  - number: '21.2'
    text: |-
      In de formule, bedoeld in het eerste lid, is: H het aantal minuten per week, afgerond op een
      veelvoud van 60 minuten; J het aantal leerlingen op de teldatum voor wie de school ingevolge
      [artikel 48 van het Inrichtingsbesluit W.V.O.][ref1] aanspraak kan maken op ambulante begeleiding; K het aantal
      minuten per week per ambulant begeleide leerling, bedoeld in [artikel 26][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005946#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0005446#Artikel26
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005946
        artikel: '48'
      - id: ref2
        bwb_id: BWBR0005446
        artikel: '26'
        hoofdstuk: III
  - number: '22'
    text: |-
