  - number: '6.3'
    text: |-
      In het tweede lid zijn Lt-1 en Lt-2 de aantallen leerlingen van de school of scholengemeenschap die als werkelijk
      schoolgaand als bedoeld in [artikel 7, eerste en tweede lid, van het Bekostigingsbesluit W.V.O.][ref1] waren
      ingeschreven op 1 oktober van het eerste schooljaar onderscheidenlijk op 1 oktober van het tweede schooljaar
      voorafgaand aan het schooljaar waarvoor de in artikel 85 van de wet bedoelde vergoeding wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005672#Artikel7
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel6
