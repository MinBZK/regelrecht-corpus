  - number: '18.3'
    text: |-
      Aanspraak op verhoging van de formatie ingevolge het eerste en tweede lid, ontstaat met ingang van 1 januari van
      het schooljaar.
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel18
  - number: '19.1'
    text: |-
      De formatie, bedoeld in de [artikelen 17][ref1], [21][ref2], [23][ref3] en [34][ref4], wordt opnieuw berekend
      indien het verschil tussen


      [ref1]: https://wetten.overheid.nl/BWBR0005446#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0005446#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0005446#Artikel23
      [ref4]: https://wetten.overheid.nl/BWBR0005446#Artikel34
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel19
