  - number: '6.5'
    text: |-
      Bij de toepassing van het eerste lid juncto [artikel 3, eerste en vierde lid][ref1], wordt uitgegaan van een aantal
      van ten minste 200 leerlingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005446#Artikel3
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005446
        artikel: '3'
        hoofdstuk: II
  - number: '6.6'
    text: |-
      Onze Minister kan in verband met de aanvang of beëindiging van de bekostiging van een school, van een
      scholengemeenschap of van een afdeling voor voorbereidend beroepsonderwijs of individueel voorbereidend
      beroepsonderwijs, afwijken van het eerste tot en met vijfde lid.
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel6
  - number: '7.1'
    text: |-
      Ten behoeve van de berekening van de aantallen formatieplaatsen volgens [de artikelen 2 tot en met 6][ref1] worden:


      [ref1]: https://wetten.overheid.nl/BWBR0005446#Artikel2
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005446
        artikel: '2'
        hoofdstuk: II
  - number: 7.1.a
    text: |-
      de aan de hand van [artikel 3][ref1] berekende aantallen formatieplaatsen,


      [ref1]: https://wetten.overheid.nl/BWBR0005446#Artikel3
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005446
        artikel: '3'
        hoofdstuk: II
  - number: 7.1.b
    text: |-
      de som van de krachtens de [artikelen 2][ref1] en [3, eerste en derde lid][ref2], berekende aantallen
      formatieplaatsen,


      [ref1]: https://wetten.overheid.nl/BWBR0005446#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005446#Artikel3
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005446
        artikel: '2'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005446
        artikel: '3'
        hoofdstuk: II
  - number: 7.1.c
    text: |-
      de uitkomst van de in [artikel 4][ref1] bedoelde vermenigvuldigingen, en


      [ref1]: https://wetten.overheid.nl/BWBR0005446#Artikel4
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005446
        artikel: '4'
        hoofdstuk: II
  - number: 7.1.d
    text: |-
      de uitkomst van de berekening volgens [artikel 6, tweede lid][ref1], uitgedrukt in een getal dat wordt afgerond op
      vier decimalen, waarbij de vierde decimaal indien de vijfde decimaal 5 of meer bedraagt naar boven wordt afgerond
      en indien deze minder dan 5 bedraagt naar beneden wordt afgerond.


      [ref1]: https://wetten.overheid.nl/BWBR0005446#Artikel6
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel7
    references:
      - id: ref1
