  - number: '3.1'
    text: |-
      Het in [artikel 84, tweede lid, onderdeel ][ref1], bedoelde leerlingafhankelijke aantal formatieplaatsen wordt,
      onverminderd [artikel 6, tweede lid][ref2], berekend door de desbetreffende ratio te vermenigvuldigen met het
      aantal leerlingen van de school of scholengemeenschap. Een ratio is een breuk die de normatieve relatie weergeeft
      tussen enerzijds een formatieplaats van een bepaalde personeelscategorie en anderzijds een aantal leerlingen.


