      onderwijspersoneel (Stb. 1985, 110).
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel36
  - number: '36.4'
    text: |-
      Bij het opnemen van andere functies in de formatie van de school dan genoemd in de tabel in het derde lid, zijn
      het eerste en tweede lid van overeenkomstige toepassing met dien verstande dat de tabel in artikel I-P78 van het
      [Rechtspositiebesluit onderwijspersoneel][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0003771
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0003771
  - number: '36.5'
    text: |-
      Het totale verbruik van formatierekeneenheden van de school wordt berekend door de som te bepalen van het verbruik
      van formatierekeneenheden per functie die in de formatie is opgenomen en de uitkomst daarvan af te ronden.
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel36
  - number: '37'
    text: |-
      Wijziging in de besteding van de formatie voor personeelsbeleid, kwaliteitsverbetering en innovatie mag niet leiden
      tot kosten van uitkeringen krachtens het [Besluit Werkloosheid onderwijs- en onderzoekpersoneel][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006445
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0006445
  - number: '38'
    text: |-
      Indien het verbruik van het aantal formatierekeneenheden in een maand afwijkt van het aantal formatierekeneenheden,
      dat op grond van het formatiebudget beschikbaar is voor de school, kan een bevoegd gezag het te weinig of te veel
      verbruikte aantal formatierekeneenheden van die maand besteden onderscheidenlijk minder besteden in een of meer
      andere maanden van het schooljaar.
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel38
  - number: '39.1'
    text: |-
      Het bevoegd gezag van een school kan telkens voor de periode van een schooljaar van het beschikbare formatiebudget
      formatierekeneenheden overdragen aan een andere school, een instelling als bedoeld in de Wet op de expertisecentra,
      een school voor speciaal onderwijs, voor voortgezet speciaal onderwijs of voor speciaal en voortgezet speciaal
      onderwijs als bedoeld in de Wet op de expertisecentra, een basisschool of een speciale school voor basisonderwijs
      van hetzelfde bevoegd gezag of van een ander bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel39
  - number: '39.2'
    text: |-
      Indien overdracht van formatierekeneenheden als bedoeld in het eerste lid plaatsvindt, delen het bevoegd gezag van
      de overdragende school en dat van de ontvangende school of de ontvangende instelling als bedoeld in het eerste lid
      deze overdracht en het aantal formatierekeneenheden dat het betreft voor 15 mei voorafgaand aan het desbetreffende
      schooljaar mee aan Onze Minister. Het bevoegd gezag kan voor 1 oktober van een schooljaar een nadere beslissing als
      bedoeld in het eerste lid nemen en voor die datum aan Onze Minister meedelen hoeveel formatierekeneenheden worden
      overgedragen.
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel39
  - number: '39.3'
    text: |-
      Indien het bevoegd gezag van een school ingevolge artikel 18 op 1 januari van een schooljaar aanspraak kan maken
      op verhoging van de formatie, kan het bevoegd gezag in afwijking van het eerste lid voor de periode van 1 januari
      tot en met 31 juli van het desbetreffende schooljaar de toename in formatierekeneenheden overdragen aan een andere
      school, een instelling als bedoeld in het eerste lid, een een school voor speciaal onderwijs, voor voortgezet
      speciaal onderwijs of voor speciaal en voortgezet speciaal onderwijs, een basisschool, een speciale school voor
      basisonderwijs of een school voor voortgezet onderwijs van hetzelfde bevoegd gezag of van een ander bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel39
  - number: '39.4'
    text: |-
      Indien overdracht van formatierekeneenheden als bedoeld in het derde lid plaatsvindt, delen het bevoegd gezag van
      de overdragende school en dat van de ontvangende school of de ontvangende instelling als bedoeld in het eerste
      lid deze overdracht en het aantal formatierekeneenheden dat het betreft voor 1 november van het desbetreffende
      schooljaar mee aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel39
  - number: '39.5'
    text: |-
      Overdracht van formatierekeneenheden mag niet leiden tot kosten van ontslaguitkeringen krachtens het Besluit
      Werkloosheid onderwijs- en onderzoekpersoneel.
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel39
  - number: '40.1'
    text: |-
      Het bevoegd gezag van een school kan telkens voor de periode van een schooljaar beslissen minder
      formatierekeneenheden te besteden dan voor die school mogelijk zou zijn op grond van het beschikbare
      formatiebudget, tot ten hoogste:
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel40
  - number: 40.1.a
    text: |-
      10% van het voor de school beschikbare formatiebudget daaronder niet begrepen de formatie voor
      personeelsbeleid, kwaliteitsverbetering en innovatie en het aantal formatierekeneenheden dat nodig is
      voor de bekostiging van de vervanging van het personeel dat gebruik maakt van het verlof op grond van
      [artikel I-C41, zevende lid, van het Rechtspositiebesluit onderwijspersoneel][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003771#ArtikelI
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0003771
        artikel: I
  - number: 40.1.b
    text: de formatie voor personeelsbeleid, kwaliteitsverbetering en innovatie, en
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel40
  - number: 40.1.c
    text: |-
      het aantal formatierekeneenheden dat nodig is voor het betalen van vergoedingen aan een school voor voortgezet
      onderwijs voor de inzet van personeel, en
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel40
  - number: 40.1.d
    text: |-
      het aantal formatierekeneenheden dat nodig is voor de bekostiging van de
      vervanging van het personeel dat gebruik maakt van het verlof op grond van
      [artikel I-C41, zevende lid, van het Rechtspositiebesluit onderwijspersoneel][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003771#ArtikelI
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0003771
        artikel: I
  - number: '40.2'
    text: |-
      Het verzilveren van formatierekeneenheden, bedoeld in het eerste lid, onderdeel *c*, mag niet leiden tot kosten van
      ontslaguitkeringen krachtens het [Besluit Werkloosheid onderwijs- en onderzoekpersoneel][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006445
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0006445
  - number: '40.3'
    text: |-
      Het bevoegd gezag neemt een besluit als bedoeld in het eerste lid voor 15 mei voorafgaande aan het desbetreffende
      schooljaar en deelt dit voor die datum mee aan Onze Minister. Bij die mededeling wordt tevens vermeld, hoeveel
      formatierekeneenheden het betreft. Het bevoegd gezag kan voor 1 oktober van een schooljaar een nader besluit als
      bedoeld in het eerste lid nemen en voor die datum aan Onze Minister meedelen hoeveel formatierekeneenheden worden
      verzilverd, met dien verstande dat dit nader besluit niet kan inhouden dat in totaal minder formatierekeneenheden
      worden verzilverd dan overeenkomstig de eerste en tweede volzin is medegedeeld aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel40
  - number: '40.4'
    text: |-
      Indien het bevoegd gezag van een school ingevolge artikel 18 op 1 januari van een schooljaar aanspraak kan maken
      op verhoging van de formatie, kan het bevoegd gezag besluiten de toename in formatierekeneenheden niet te besteden,
      tot ten hoogste het aantal formatierekeneenheden dat wordt verkregen door de toename te vermenigvuldigen met
      het percentage dat resulteerde in de mededeling bedoeld in het tweede lid daaronder niet begrepen de formatie
      genoemd in het eerste lid, eerste volzin, onderdeel *b*, en de uitkomst daarvan af te ronden. In dat geval keert
      Onze Minister aan het bevoegd gezag van de school een bedrag uit dat overeenkomt met de geldswaarde van deze niet
      verbruikte formatierekeneenheden.
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel40
  - number: '40.5'
    text: |-
      Het bevoegd gezag neemt een besluit als bedoeld in het vierde lid voor 1 november van het desbetreffende schooljaar
      en deelt dit besluit en het aantal formatierekeneenheden dat het betreft voor die datum mee aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel40
  - number: '40.6'
    text: |-
      De geldswaarde van de formatierekeneenheden voor speciale doeleinden die zijn verzilverd, wordt besteed aan de
      speciale doeleinden waarvoor die rekeneenheden waren bestemd.
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel40
  - number: '41'
    text: In afwijking van artikel 20, geldt voor het schooljaar 1992-1993 een percentage van 2,6%.
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel41
  - number: '42'
    text: 'In afwijking van artikel 20 geldt:'
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel42
  - number: 42.a
    text: voor het schooljaar 1993-1994 een percentage van 0,644%, en
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel42
  - number: 42.b
    text: voor het schooljaar 1994-1995 een percentage van 1,085%.
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel42
  - number: '43'
    text: |-
      Ten aanzien van het schooljaar 1992-1993 is de termijnstelling, bedoeld in [artikel 26, vierde lid][ref1], niet
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005446#Artikel26
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0005446
        artikel: '26'
        hoofdstuk: III
  - number: '44'
    text: |-
      In afwijking van de [artikelen 25, vierde lid][ref1], en [26, vierde lid][ref2], doen de bevoegde gezagsorganen
      voor het schooljaar 1993-1994 de mededelingen als bedoeld in die artikelleden voor 1 april 1994.


      [ref1]: https://wetten.overheid.nl/BWBR0005446#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0005446#Artikel26
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0005446
        artikel: '25'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0005446
        artikel: '26'
        hoofdstuk: III
  - number: '45'
    text: 'In afwijking van artikel 22, geldt:'
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel45
  - number: 45.a
    text: |-
      voor het schooljaar 1994-1995 een percentage van 1,2%, met dien verstande dat na de afronding op grond van artikel
      22, de uitkomst van deze berekening wordt verminderd met de uitkomst van de berekening op grond van artikel 20
      juncto artikel 26
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel45
  - number: 45.b
    text: voor het schooljaar 1995-1996 een percentage van 1,7%, en
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel45
  - number: 45.c
    text: voor het schooljaar 1996-1997 een percentage van 2,2%.
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel45
  - number: '47'
    text: 'Dit besluit wordt aangehaald als: Formatiebesluit W.V.O.'
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel47
