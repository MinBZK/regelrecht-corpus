  - number: '23.1'
    text: |-
      De formatie van een school met betrekking tot het onderwijsondersteunend personeel wordt per categorie, genoemd
      in [artikel 22, eerste lid][ref1], berekend aan de hand van de formule I' = B * P, afgerond op een veelvoud
      van 15 minuten. De omvang van de gehele formatie van een school met betrekking tot het onderwijsondersteunend
      personeel, genoemd in [artikel 22, eerste lid][ref2], wordt berekend aan de hand van de formule I = de som van de
      afzonderlijke I'.


      [ref1]: https://wetten.overheid.nl/BWBR0005446#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0005446#Artikel22
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005446
        artikel: '22'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005446
        artikel: '22'
        hoofdstuk: II
  - number: '23.2'
    text: |-
      In de formules, bedoeld in het eerste lid, is: I de formatie van de school ten behoeve van het
      onderwijsondersteunend personeel, genoemd in [artikel 22, eerste lid][ref1]; I' de formatie per categorie
      onderwijsondersteunend personeel, genoemd in [artikel 22, eerste lid][ref2], uitgedrukt in minuten en per school
      afgerond op een veelvoud van 15 minuten; B het aantal leerlingen op de teldatum; P het aantal minuten per week
      dat per categorie onderwijsondersteunend personeel voor de desbetreffende schoolsoort per leerling is aangegeven
      in [artikel 27][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005446#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0005446#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0005446#Artikel27
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005446
        artikel: '22'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005446
        artikel: '22'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0005446
        artikel: '27'
        hoofdstuk: III
  - number: '23.3'
    text: |-
      Bij de berekening van de formatie, bedoeld in het eerste lid, kan het aantal minuten voor de categorie conciërge
      van het onderwijsondersteunend personeel voor een school niet meer bedragen dan 3600.
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel23
