  - number: '6.1'
    text: |-
      Het in [artikel 3, eerste lid][ref1], bedoelde aantal leerlingen is het aantal leerlingen van de school of
      scholengemeenschap dat als werkelijk schoolgaand als bedoeld in [artikel 7, eerste en tweede lid, van het
      Bekostigingsbesluit W.V.O.](onbekend) was ingeschreven op 1 oktober van het schooljaar voorafgaand aan het
      schooljaar waarvoor de in artikel 85 van de wet bedoelde vergoeding wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005446#Artikel3
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel6
