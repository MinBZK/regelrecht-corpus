articles:
  - number: '1.1'
    text: |-
      In [deel I][ref1] van dit besluit wordt verstaan onder: Onze Minister: Onze Minister van Onderwijs, Cultuur
      en Wetenschappen, en wat het landbouwonderwijs betreft Onze Minister van Landbouw, Natuurbeheer en Visserij;
      wet: [deel I van de Wet op het voortgezet onderwijs](onbekend); school: een school voor voorbereidend
      wetenschappelijk onderwijs, een school voor hoger algemeen voortgezet onderwijs, een school voor middelbaar
      algemeen voortgezet onderwijs of een school voor voorbereidend beroepsonderwijs; scholengemeenschap: een
      scholengemeenschap bestaande uit twee of meer scholen; schooljaar: het tijdvak van 1 augustus tot en met 31 juli
      daaropvolgend; personeelscategorie: de in artikel 84 van de wet genoemde onderscheiden personeelscategorieën;
      directie: 'het in artikel 84, eerste lid, onderdeel , van de wet genoemde personeel; ratio: de ratio, bedoeld in'
      [artikel 3, eerste lid][ref2]; gemiddelde personeelslast: de gemiddelde personeelslast, bedoeld in artikel 85,
      eerste lid, van de wet; formatieplaats: een betrekking met de omvang van een volledige weektaak.


      [ref1]: https://wetten.overheid.nl/BWBR0005446#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005446#Artikel3
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel1
