        artikel: '6'
        hoofdstuk: II
  - number: '14'
    text: |-
      De formatie voor de vervulling van reguliere taken van de school, bedoeld in
      [artikel 13, eerste lid onderdeel ][ref1], bestaat uit:


      [ref1]: https://wetten.overheid.nl/BWBR0005446#Artikel13
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005446
        artikel: '13'
        hoofdstuk: I
  - number: 14.a
    text: de normatieve formatie,
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel14
  - number: 14.b
    text: een opslag in verband met formatieve fricties,
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel14
  - number: 14.c
    text: een opslag vanwege herbezetting in verband met arbeidsduurverkorting, en
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel14
  - number: 14.d
    text: een opslag vanwege herbezetting in verband met toepassing regeling bevordering arbeidsparticipatie ouderen.
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel14
  - number: '15'
    text: |-
      De normatieve formatie van de school, bedoeld in [artikel 14, onderdeel ][ref1], omvat de formatie voor het
      onderwijzend personeel en de schoolleiding, en de formatie voor het onderwijsondersteunend personeel.


      [ref1]: https://wetten.overheid.nl/BWBR0005446#Artikel14
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005446
        artikel: '14'
        hoofdstuk: I
  - number: '16'
    text: 'Indien in dit besluit sprake is van:'
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel16
  - number: 16.a
    text: |-
      afronding van een getal, worden de decimalen verwaarloosd indien het eerste cijfer achter de komma kleiner is dan
      5, en worden de decimalen verwaarloosd en het getal verhoogd met 1 indien het eerste cijfer achter de komma gelijk
      is aan of groter is dan 5;
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel16
  - number: 16.b
    text: afronding naar boven van een getal, worden de decimalen verwaarloosd en wordt het getal verhoogd met 1;
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel16
  - number: 16.c
    text: |-
      afronding op een veelvoud van een aantal minuten, vindt afronding naar beneden plaats indien bij het quotiënt van
      de uitkomst van de formule of formules en dat aantal minuten het eerste cijfer achter de komma kleiner is dan 5 en
      vindt afronding naar boven plaats indien bij dat quotiënt het eerste cijfer achter de komma gelijk is aan of groter
      is dan 5.
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel16
  - number: '17.1'
    text: |-
      De formatie van een school met betrekking tot het onderwijzend personeel met inbegrip van de schoolleiding wordt
      berekend aan de hand van de formule A = B * D + B * E + G.
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel17
  - number: '17.2'
    text: |-
      In de formules, genoemd in dit artikel en in artikel 25, vierde lid, is: A de formatie, uitgedrukt in minuten en
      afgerond op een veelvoud van 480 minuten; B het aantal leerlingen op de teldatum; D het aantal minuten groeps-
      of vakonderwijs per week aan een school dat voor de desbetreffende schoolsoort per leerling is aangegeven
      in [artikel 24][ref1]; E het aantal minuten vakonderwijs per week dat voor de desbetreffende schoolsoort per
      leerling is aangegeven in [artikel 24][ref2]; F het aantal minuten per week dat ten behoeve van leerlingen met
      een niet-Nederlandse culturele achtergrond op de teldatum wordt vastgesteld aan de hand van [artikel 34][ref3];
      G het aantal minuten per week dat, uitgaande van het aantal formatieplaatsen, ten behoeve van de schoolleiding
      wordt vastgesteld aan de hand van [artikel 25, tweede lid][ref4], waarbij G niet groter kan zijn dan 3600; het
      aantal formatieplaatsen, bedoeld in de vorige zinsnede, is de uitkomst van de formule (B x D + B x E + F + H +
      I) : 2400, naar boven afgerond; H het aantal minuten per week dat ten behoeve van ambulante begeleiding wordt
      vastgesteld aan de hand van [artikel 21][ref5] juncto [artikel 26][ref6]; I de som van de formatie, bedoeld in
      [artikel 23, eerste lid][ref7], ten behoeve van het onderwijsondersteunend personeel;


