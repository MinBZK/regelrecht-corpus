    text: |-
      Voor de toepassing van het bepaalde bij of krachtens de wet voor de vaststelling van het beleid met betrekking tot
      de formatie van de verschillende categorieën personeel en het bepalen van de formatie, functies en taken van het
      personeel, wordt in geval van een scholengemeenschap onder het personeel van de school verstaan het personeel van
      de scholengemeenschap.
