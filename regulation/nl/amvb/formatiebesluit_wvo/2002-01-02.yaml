  - number: '13.1'
    text: 'Het formatiebudget waarop het bevoegd gezag van een school per schooljaar aanspraak heeft, bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel13
  - number: 13.1.a
    text: |-
      de formatie voor de vervulling van reguliere taken van de school, bedoeld in artikel 233, eerste lid onderdeel a,
      van de wet,
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel13
  - number: 13.1.b
    text: |-
      in voorkomende gevallen formatie voor speciale doeleinden, bedoeld in artikel 233, eerste lid onderdeel b, van
      de wet,
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel13
  - number: 13.1.c
    text: |-
      in voorkomende gevallen de verhoging van de formatie als gevolg van het opnieuw berekenen van de formatie bij een
      bepaalde toename van het aantal leerlingen, overeenkomstig de [artikel 18][ref1] en 19,


      [ref1]: https://wetten.overheid.nl/BWBR0005446#Artikel18
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005446
        artikel: '18'
        hoofdstuk: II
  - number: 13.1.d
    text: in voorkomende gevallen aanvullende formatie als bedoeld in artikel 233, derde of vierde lid, van de wet.
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel13
  - number: '13.2'
    text: |-
      De omvang van het formatiebudget is gelijk aan de som van de aantallen formatierekeneenheden zoals voor de school
      berekend op grond van [de artikelen 14 tot en met 35][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005446#Artikel6
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel13
