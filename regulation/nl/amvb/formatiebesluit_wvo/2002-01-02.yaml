  - number: '28'
    text: |-
      De opslag in verband met rechtspositionele aanspraken van personeel bij vermindering van de formatie bedraagt voor
      de school 18 formatierekeneenheden.
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel28
  - number: '29.1'
    text: |-
      De aantallen formatierekeneenheden voor het onderwijzend personeel en schoolleiding en de aantallen
      formatierekeneenheden voor speciale doeleinden, berekend op grond van [artikel 35, eerste lid][ref1], worden
      verhoogd met 8,11% vanwege herbezetting in verband met arbeidsduurverkorting.


      [ref1]: https://wetten.overheid.nl/BWBR0005446#Artikel35
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005446
        artikel: '35'
        hoofdstuk: VI
  - number: '29.2'
    text: |-
      De aantallen formatierekeneenheden voor onderwijsondersteunend personeel, berekend op grond van
      [artikel 35, tweede lid][ref1], worden verhoogd met 5,68% vanwege herbezetting in verband met
      arbeidsduurverkorting.


      [ref1]: https://wetten.overheid.nl/BWBR0005446#Artikel35
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005446
        artikel: '35'
        hoofdstuk: VI
  - number: '29.3'
    text: |-
      Het aantal formatierekeneenheden, berekend op grond van [artikel 35][ref1] en verhoogd op grond van het eerste
      en het tweede lid, wordt tevens verhoogd met het aantal formatierekeneenheden dat behoort bij het gedeelte van de
      betrekkingsomvang dat kan worden herbezet in verband met toepassing van de regeling bevordering arbeidsparticipatie
      ouderen, bedoeld in [hoofdstuk I-V van het Rechtspositiebesluit onderwijspersoneel](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0005446#Artikel35
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005446
        artikel: '35'
        hoofdstuk: VI
  - number: '29.4'
    text: |-
      De uitkomst van het aantal formatierekeneenheden, berekend op grond van het eerste, het tweede en het derde lid,
      wordt telkens afgerond.
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel29
  - number: '30.1'
    text: |-
      In verband met uitbreiding van de arbeidsduurverkorting wordt een verhoging van de aantallen formatierekeneenheden
      berekend en vastgesteld met inachtneming van de volgende leden.
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel30
  - number: '30.2'
    text: 'De percentages, genoemd in artikel 29, eerste en tweede lid, worden verhoogd met:'
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel30
  - number: 30.2.a
    text: 'wat betreft het onderwijzend personeel en de schoolleiding: 1,69%, en'
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel30
  - number: 30.2.b
    text: 'wat betreft het onderwijsondersteunend personeel: 1,05%.'
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel30
  - number: '30.3'
    text: |-
      De aantallen formatierekeneenheden worden verhoogd met 60% van het aantal formatierekeneenheden dat overeenkomt met
      de verhogingen, genoemd in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel30
  - number: '30.4'
    text: |-
      Onverminderd het derde lid, heeft het bevoegd gezag op een daartoe strekkende aanvraag aanspraak op een verhoging
      met ten hoogste 40% van het aantal formatierekeneenheden dat overeenkomt met de verhogingen, genoemd in het tweede
      lid, voor zover het bevoegd gezag voor het desbetreffende aantal formatierekeneenheden ten minste tot en met 31
      juli van het lopende schooljaar dan wel, indien het onderwijsgevend personeel betreft en de benoeming ingaat op of
      na 1 maart van het lopende schooljaar, ten minste tot en met de laatste dag voor de zomervakantie personeel benoemt
      dat ten minste een maand in het genot is van een ten laste van de begroting van het Ministerie van Onderwijs,
      Cultuur en Wetenschappen komende werkloosheidsuitkering of herplaatsingswachtgeld, en dat nog ten minste een half
      jaar recht op een dergelijke uitkering of wachtgeld zou hebben. De in de eerste volzin bedoelde aanvraag wordt
      ingediend uiterlijk op 31 juli van het lopende schooljaar.
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel30
  - number: 30.4a
    text: |-
      De in het vierde lid bedoelde aanspraak bestaat eveneens indien het bevoegd gezag door herbezetting van het
      desbetreffende aantal formatierekeneenheden een ontslag voorkomt in het geval waarin zich een negatieve mutatie
      van de formatieve ontwikkeling voordoet die groter is dan de omvang van het natuurlijk verloop. Voorwaarden voor de
      toepassing van de eerste volzin zijn dat:
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel30
  - number: 30.4a.a
    text: |-
      het ontslag volledig en onvermijdelijk voortvloeit uit de daling van het aantal formatierekeneenheden, verminderd
      met de daling wegens natuurlijk verloop en andere ontslagen,
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel30
  - number: 30.4a.b
    text: |-
      het bevoegd gezag verklaart dat de betrokkene bij vrijkomende formatieruimte wordt geplaatst in het in artikel
      I-P76, tweede lid, onderdeel *a*, van het [Rechtspositiebesluit onderwijspersoneel][ref1] bedoelde deel van de
      formatie,


      [ref1]: https://wetten.overheid.nl/BWBR0003771
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0003771
  - number: 30.4a.c
    text: |-
      het bevoegd gezag verklaart over te gaan tot melding aan het Regionaal Bestuur voor de Arbeidsvoorziening, bedoeld
      in artikel 8, eerste lid, van de Arbeidsvoorzieningswet, van elke gehele of gedeeltelijke formatieplaats die in
      de loop van het schooljaar bij de school of scholen van het bevoegd gezag beschikbaar komt en voor de vervulling
      waarvan bemiddeling door het Regionaal Bestuur voor de Arbeidsvoorziening wenselijk is. en
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel30
  - number: '30.5'
    text: |-
      Onze Minister kan, voor zover de begrotingswetgever daartoe de middelen ter beschikking heeft gesteld, van de
      voorwaarde, bedoeld in het vierde lid, ontheffing verlenen indien:
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel30
  - number: 30.5.a.1°
    text: |-
      het desbetreffende aantal formatierekeneenheden dat het bevoegd gezag kan herbezetten, overeenkomt met 4 uren of
      minder,
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel30
  - number: 30.5.a.2°
    text: |-
      geen werkloosheidsuitkering of herplaatsingswachtgeld als bedoeld in het vierde lid, wordt genoten door een
      personeelslid van het bevoegd gezag, en
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel30
  - number: 30.5.a.3°
    text: |-
      het bevoegd gezag geen beslissing neemt als bedoeld in artikel 40, eerste lid, voor het laagste tarief, genoemd in
      de in artikel 235, derde lid, van de wet bedoelde ministeriële regeling, of
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel30
  - number: 30.5.b
    text: |-
      voor het met het desbetreffende aantal formatierekeneenheden dat het bevoegd gezag kan herbezetten overeenkomende
      aantal uren geen personeelslid in het werkgebied van een Regionaal Bestuur voor de Arbeidsvoorziening kan worden
      benoemd dat in het genot is van een werkloosheidsuitkering of herplaatsingswachtgeld als bedoeld in het vierde
      lid, of
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel30
  - number: 30.5.c
    text: |-
      de benoeming van het personeelslid niet in overeenstemming is met de godsdienstige of levensbeschouwelijke
      overtuiging die aan de school ten grondslag ligt.
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel30
  - number: '30.6'
    text: |-
      Onze Minister stelt, op voordracht van de daarvoor in aanmerking komende vakorganisaties van overheids- en
      onderwijspersoneel en organisaties van gemeente- en schoolbesturen, een commissie in, die hem adviseert omtrent
      een aanvraag van het bevoegd gezag tot toepassing van het vijfde lid. De commissie bestaat uit vier leden. Het
      bevoegd gezag dient de in de eerste volzin bedoelde aanvraag in tussen 15 juli van het voorafgaande schooljaar en
      15 augustus daaropvolgend.
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel30
  - number: '30.7'
    text: |-
      Onze Minister besluit binnen zes weken na ontvangst van een aanvraag van het bevoegd gezag, dan wel binnen twee
      weken na ontvangst van het advies van de commissie, bedoeld in het zesde lid. Indien de beschikking niet binnen de
      in de eerste volzin genoemde termijnen kan worden gegeven, stelt Onze Minister het bevoegd gezag daarvan in kennis
      en noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel30
  - number: '30.8'
    text: Artikel 29, derde lid, is van toepassing.
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel30
  - number: '33.1'
    text: |-
      De formatie voor personeelsbeleid, kwaliteitsverbetering en innovatie wordt vastgesteld door de som van de
      aantallen formatierekeneenheden berekend op grond van de [artikelen 17][ref1] en [34][ref2] te vermenigvuldigen
      met 2,3%.


      [ref1]: https://wetten.overheid.nl/BWBR0005446#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0005446#Artikel34
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005446
        artikel: '17'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005446
        artikel: '34'
        hoofdstuk: V
  - number: '33.2'
    text: De uitkomst van de berekening op grond van het eerste lid wordt vervolgens afgerond.
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel33
  - number: '33.3'
    text: |-
      [De artikelen 18][ref1] en [19][ref2] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005446#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0005446#Artikel19
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005446
        artikel: '18'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005446
        artikel: '19'
        hoofdstuk: II
  - number: '34'
    text: |-
      Voor de bestrijding van onderwijsachterstanden wordt voor leerlingen met een niet-Nederlandse culturele achtergrond
      een aantal minuten formatie berekend aan de hand van het schema:






                  Aantal leerlingen met een niet-Nederlandse culturele achtergrond


                  aantal minuten per week




                  1 tot en met 4


                  0






                  5


                  84




                  en vervolgens voor elke leerling boven het aantal van 5, 84 minuten per week
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel34
  - number: '35.1'
    text: |-
      Voor de omrekening in formatierekeneenheden van de formatie voor onderwijzend personeel en schoolleiding en de
      formatie voor speciale doeleinden, wordt het aantal minuten formatie gedeeld door 2400 en wordt de uitkomst daarvan
      vermenigvuldigd met 200.
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel35
  - number: '35.2'
    text: |-
      Voor de omrekening in formatierekeneenheden van de formatie voor onderwijsondersteunend personeel wordt het aantal
      minuten formatie gedeeld door 2400 en wordt de uitkomst daarvan vermenigvuldigd met het getal, behorend bij de
      desbetreffende categorie, opgenomen in de tabel in [artikel 36, derde lid, onderdeel ][ref1]. In afwijking van
      het bepaalde in de vorige volzin is voor de administratief medewerker met een functie, waarbij de maximumschaal 3
      behoort alsmede voor de klassenassistent met een functie, waarbij de maximumschaal 3 behoort, het getal 144.


      [ref1]: https://wetten.overheid.nl/BWBR0005446#Artikel36
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005446
        artikel: '36'
        hoofdstuk: VII
  - number: '35.3'
    text: |-
      De uitkomst van de som van het aantal formatierekeneenheden, berekend op grond van het eerste en tweede lid wordt
      telkens afgerond.
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel35
  - number: '36.1'
    text: |-
      Bij het opnemen van functies in de formatie van de school, wordt voor de functies die zijn opgenomen in de
      tabel in het derde lid, op basis van de bij de onderscheiden functies behorende maximumschaal het aantal
      formatierekeneenheden verbruikt dat is aangegeven in die tabel.
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel36
  - number: '36.2'
    text: |-
      Indien een functie waarvan de omvang kleiner is dan die van een normbetrekking, wordt opgenomen in de formatie van
      de school, wordt het aantal formatierekeneenheden, bedoeld in het eerste lid, naar evenredigheid verminderd en op
      rekenkundige wijze afgerond op 2 decimalen.
    url: https://wetten.overheid.nl/BWBR0005446/2002-01-02#Artikel36
  - number: '36.3'
    text: |-
      Verbruikstabel functies schoolleiding, onderwijsgevend en onderwijsondersteunend personeel







