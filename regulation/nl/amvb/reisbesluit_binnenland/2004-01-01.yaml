$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: reisbesluit_binnenland
regulatory_layer: AMVB
publication_date: '2017-03-28'
valid_from: '2004-01-01'
bwb_id: BWBR0005889
url: https://wetten.overheid.nl/BWBR0005889/2004-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken van 13 november 1992, nr. AB92/U1199, directoraat-
    generaal Management en Personeelsbeleid, directie Arbeidsvoorwaarden, afdeling Arbeidsvoorwaarden Rijkspersoneel;

    Gelet op de artikelen 125, eerste lid, en 134, eerste lid, van de Ambtenarenwet 1929;

    De Raad van State gehoord (advies van 2 februari 1993, nr. W04.92.0561);

    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken van 26 februari 1993, nr. AB93/140, directoraat-
    generaal Management en Personeelsbeleid, directie Arbeidsvoorwaarden, afdeling Arbeidsvoorwaarden Rijkspersoneel;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005889/2004-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Naar de regels bij of krachtens dit besluit wordt vergoeding verleend van reis- en verblijfkosten in verband met
      dienstreizen binnen Nederland.
    url: https://wetten.overheid.nl/BWBR0005889/2004-01-01#Artikel1
  - number: '1.2'
    text: |-
      Dienstreizen, die in Nederland zijn begonnen en waarbij het reisgedeelte buiten Nederland beperkt is of waarbij de
      grensoverschrijding niet noodzakelijkerwijs leidt tot uitgaven voor maaltijden of overnachting in het buitenland,
      worden voor de toepassing van dit besluit aangemerkt als dienstreizen binnen Nederland.
    url: https://wetten.overheid.nl/BWBR0005889/2004-01-01#Artikel1
  - number: '1.3'
    text: |-
      Indien van derden een vergoeding wordt ontvangen voor de in het eerste lid bedoelde kosten, wordt deze in mindering
      gebracht op de vergoeding waarop ingevolge dit besluit aanspraak bestaat.
    url: https://wetten.overheid.nl/BWBR0005889/2004-01-01#Artikel1
  - number: '2'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005889/2004-01-01#Artikel2
  - number: 2.a
    text: 'Onze Minister: het hoofd van het betrokken ministerie;'
    url: https://wetten.overheid.nl/BWBR0005889/2004-01-01#Artikel2
  - number: 2.b
    text: 'betrokkene:'
    url: https://wetten.overheid.nl/BWBR0005889/2004-01-01#Artikel2
  - number: 2.b.1e
    text: |-
      degene die op basis van het [Algemeen Rijksambtenarenreglement][ref1], [Ambtenarenreglement Staten-Generaal][ref2]
      of [Reglement Dienst Buitenlandse Zaken][ref3] in burgerlijke rijksdienst werkzaam is;


      [ref1]: https://wetten.overheid.nl/BWBR0001950
      [ref2]: https://wetten.overheid.nl/BWBR0003229
      [ref3]: https://wetten.overheid.nl/BWBR0004052
    url: https://wetten.overheid.nl/BWBR0005889/2004-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001950
      - id: ref2
        bwb_id: BWBR0003229
      - id: ref3
        bwb_id: BWBR0004052
  - number: 2.b.2e
    text: |-
      hij, die op verzoek of met goedvinden van het bevoegde gezag zich ten behoeve van het rijk met enige
      dienstverrichting belast;
    url: https://wetten.overheid.nl/BWBR0005889/2004-01-01#Artikel2
  - number: 2.c
    text: |-
      standplaats: de gemeente of het met name bekende afzonderlijk liggend deel van de gemeente, waar de plaats van
      tewerkstelling van de betrokkene is gelegen;
    url: https://wetten.overheid.nl/BWBR0005889/2004-01-01#Artikel2
  - number: 2.d
    text: 'plaats van tewerkstelling:'
    url: https://wetten.overheid.nl/BWBR0005889/2004-01-01#Artikel2
  - number: 2.d.1e
    text: |-
      het gebouw, gebouwencomplex, terrein of vaartuig waar of van waaruit de betrokkene naar het oordeel van het
      bevoegde gezag gewoonlijk zijn werkzaamheden verricht;
    url: https://wetten.overheid.nl/BWBR0005889/2004-01-01#Artikel2
  - number: 2.d.2e
    text: 'voor de betrokkene bedoeld onder *b* ten tweede: zijn woning;'
    url: https://wetten.overheid.nl/BWBR0005889/2004-01-01#Artikel2
  - number: 2.e
    text: |-
      dienstreis: een naar het oordeel van het bevoegde gezag noodzakelijke verplaatsing van een betrokkene tot het
      verrichten van dienst buiten de plaats van tewerkstelling, alsmede het hiermee verband houdende verblijf buiten
      deze plaats.
    url: https://wetten.overheid.nl/BWBR0005889/2004-01-01#Artikel2
  - number: '3'
    text: |-
      Voor de toepassing van dit besluit worden, behoudens voor de toepassing van [artikel 18a][ref1], met Onze Minister
      gelijkgesteld: de voorzitters van elk der beide Kamers der Staten-Generaal, de vice-president van de Raad van
      State, het College van de Algemene Rekenkamer, de Nationale ombudsman en de directeur van het Kabinet der Koningin.


      [ref1]: https://wetten.overheid.nl/BWBR0005889#Artikel18a
    url: https://wetten.overheid.nl/BWBR0005889/2004-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005889
        artikel: 18a
        hoofdstuk: IV
  - number: '4.1'
    text: |-
      Indien en zodra is te voorzien dat de betrokkene tijdelijk, voor een periode van ten minste vier weken, gedurende
      meer dan de helft van de voor hem gebruikelijke werkdagen zijn werkzaamheden in of vanuit één bepaalde plaats
      buiten zijn standplaats, of binnen zijn standplaats voor zover de reisbestemming op één of meer kilometer
      van de plaats van tewerkstelling ligt, moet gaan verrichten, heeft hij, in afwijking van het bepaalde in de
      [artikelen 6 tot en met 13][ref1] van dit besluit, voor het afleggen van het traject tussen zijn woning en de
      plaats van de tijdelijke tewerkstelling alsmede voor eventuele pensionkosten die hij vanwege die tijdelijke
      tewerkstelling maakt, aanspraak op een vergoeding voor reis- en pensionkosten op de voet van de bepalingen van of
      krachtens het [Verplaatsingskostenbesluit 1989][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005889#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0004630
    url: https://wetten.overheid.nl/BWBR0005889/2004-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005889
        artikel: '6'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0004630
  - number: '4.2'
    text: |-
      In afwijking van het bepaalde in het eerste lid kan in de gevallen waarin het bevoegde gezag van oordeel
      is dat daartoe aanleiding bestaat voor het afleggen van het traject tussen de woning en de plaats van de
      tijdelijke tewerkstelling vergoeding voor reiskosten worden verleend volgens het bepaalde bij of krachtens de
      [artikelen 6 tot en met 12][ref1] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005889#Artikel6
    url: https://wetten.overheid.nl/BWBR0005889/2004-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005889
        artikel: '6'
        hoofdstuk: II
  - number: '5.1'
    text: |-
      Voor de vergoeding van reis- en verblijfkosten geldt dat de plaats van tewerkstelling het beginpunt en het eindpunt
      is van de dienstreis.
    url: https://wetten.overheid.nl/BWBR0005889/2004-01-01#Artikel5
  - number: '5.2'
    text: |-
      In afwijking van het bepaalde in het eerste lid kan de woning van de betrokkene of een andere plaats als beginpunt
      respectievelijk eindpunt van de dienstreis worden aangemerkt, tenzij op de heenreis onderscheidenlijk de terugreis
      de plaats van tewerkstelling wordt bezocht.
    url: https://wetten.overheid.nl/BWBR0005889/2004-01-01#Artikel5
  - number: '6.1'
    text: |-
      Wegens reiskosten per openbaar vervoer worden vergoed de kosten van het openbaar vervoer die in verband met de
      dienstreis blijkens overgelegde bewijsstukken zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0005889/2004-01-01#Artikel6
  - number: '6.2'
    text: |-
      De betrokkene die tijdens een dienstreis gebruik maakt van vervoer per trein, is gerechtigd om voor rijksrekening
      in de eerste klasse te reizen.
    url: https://wetten.overheid.nl/BWBR0005889/2004-01-01#Artikel6
  - number: '6.3'
    text: |-
      Indien de betrokkene voor de dienstreis gebruik maakt van een niet van rijkswege verstrekt abonnement wordt, in
      afwijking van het bepaalde in het eerste lid, voor vergoeding wegens reiskosten uitgegaan van de kosten zonder
      gebruikmaking van het abonnement. De vergoeding wordt aan de betrokkene toegekend voor zover daarmee, de voor
      hem ten laste blijvende kosten niet worden overschreden. Voor het bepalen van de voor de betrokkene ten laste
      blijvende kosten wordt rekening gehouden met: - eventuele tegemoetkomingen die krachtens de bepalingen van het
      [Verplaatsingskostenbesluit 1989][ref1] voor het dagelijks reizen tussen de woning en de plaats van tewerkstelling
      over de periode van geldigheid van het abonnement aan betrokkene zijn verstrekt;
        - eventuele reeds aan betrokkene verstrekte reiskostenvergoedingen voor andere dienstreizen, waarbij gebruik is
      gemaakt van het abonnement.


      [ref1]: https://wetten.overheid.nl/BWBR0004630
    url: https://wetten.overheid.nl/BWBR0005889/2004-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004630
  - number: '7'
    text: |-
      Indien de dienstreis naar het oordeel van het bevoegde gezag niet of niet op doelmatige wijze per openbaar vervoer
      kan worden ondernomen, kan het bevoegde gezag aan de betrokkene toestemming verlenen voor de dienstreis gebruik te
      maken van een eigen motorvoertuig of bromfiets, in welk geval hem een vergoeding wordt verleend volgens door Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties te stellen regels.
    url: https://wetten.overheid.nl/BWBR0005889/2004-01-01#Artikel7
  - number: '8'
    text: |-
      Indien de dienstreis op doelmatige wijze per openbaar vervoer kan worden ondernomen, kan het bevoegde gezag in
      bijzondere gevallen de betrokkene toestemming geven voor de dienstreis gebruik te maken van een eigen motorvoertuig
      of bromfiets, in welk geval aan de betrokkene een vergoeding wordt verleend volgens door Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties te stellen regels.
    url: https://wetten.overheid.nl/BWBR0005889/2004-01-01#Artikel8
  - number: '9'
    text: |-
      Indien voor de dienstreis gebruik wordt gemaakt van een eigen fiets wordt hiervoor een vergoeding verleend volgens
      door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties te stellen regels.
    url: https://wetten.overheid.nl/BWBR0005889/2004-01-01#Artikel9
  - number: '10'
    text: |-
      Indien naar het oordeel van het bevoegde gezag het dienstbelang er mee is gebaat dat tijdens een dienstreis naast
      openbaar vervoer tevens gebruik wordt gemaakt van een taxi, worden de aan dat taxigebruik verbonden kosten volledig
      vergoed.
    url: https://wetten.overheid.nl/BWBR0005889/2004-01-01#Artikel10
  - number: '11'
    text: |-
      Indien naar het oordeel van het bevoegde gezag het gebruik van een eigen motorvoertuig of bromfiets voor het
      vervoer tussen de woning en de plaats van tewerkstelling noodzakelijk is voor het op doelmatige wijze uitvoeren van
      een op die dag voorkomende dienstreis, kan daarvoor per kilometer een vergoeding worden verleend tot ten hoogste de
      kilometervergoeding die geldt voor de dienstreis met dat vervoermiddel.
    url: https://wetten.overheid.nl/BWBR0005889/2004-01-01#Artikel11
  - number: '12.1'
    text: |-
      Onze Minister kan, in afwijking van het bepaalde in de [artikelen 6 tot en met 8][ref1], regels stellen krachtens
      welke voor een betrokkene een tegemoetkoming in reiskosten en andere kosten die rechtstreeks verband houden met het
      carpoolen wordt verstrekt, indien de betrokkene voor het ondernemen van de dienstreis:


      [ref1]: https://wetten.overheid.nl/BWBR0005889#Artikel6
    url: https://wetten.overheid.nl/BWBR0005889/2004-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005889
        artikel: '6'
        hoofdstuk: II
  - number: 12.1.a
    text: gebruik maakt van een eigen motorvoertuig te zamen met één of meer anderen of
    url: https://wetten.overheid.nl/BWBR0005889/2004-01-01#Artikel12
  - number: 12.1.b
    text: meerijdt in een motorvoertuig van een ander.
    url: https://wetten.overheid.nl/BWBR0005889/2004-01-01#Artikel12
  - number: '12.2'
    text: |-
      De tegemoetkoming in reiskosten bedoeld in het eerste lid bedraagt ten hoogste het bedrag vastgesteld krachtens
      [artikel 15b, eerste lid, onderdeel b, van de Wet op de loonbelasting 1964][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel15b
    url: https://wetten.overheid.nl/BWBR0005889/2004-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 15b
  - number: '13.1'
    text: |-
      De in verband met een dienstreis noodzakelijk gemaakte kosten voor maaltijden en logies en voor kleine uitgaven
      overdag en ’s avonds worden vergoed volgens door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties te
      stellen regels.
    url: https://wetten.overheid.nl/BWBR0005889/2004-01-01#Artikel13
  - number: '13.2'
    text: |-
      Geen aanspraak op vergoeding wegens verblijfkosten bestaat voor een dienstreis korter dan vier uur en voor
      een dienstreis binnen de standplaats voor zover de reisbestemming op minder dan 1 kilometer van de plaats van
      tewerkstelling ligt.
    url: https://wetten.overheid.nl/BWBR0005889/2004-01-01#Artikel13
  - number: '13.3'
    text: |-
      Aan de betrokkene die tijdens de dienstreis overnachting van overheidswege ontvangt en daarvoor betaling
      verschuldigd is, wordt een vergoeding verleend volgens de door Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties te stellen regels. In geval van de verstrekking van overheidswege geen gebruik is gemaakt,
      bestaat geen aanspraak op vergoeding.
    url: https://wetten.overheid.nl/BWBR0005889/2004-01-01#Artikel13
  - number: '13.4'
    text: |-
      Geen aanspraak op vergoeding voor maaltijden bestaat indien tijdens een dienstreis de gelegenheid bestaat al dan
      niet tegen betaling maaltijden van overheidswege te ontvangen, tenzij de betrokkene aannemelijk maakt dat hij
      daarvan geen gebruik heeft kunnen maken.
    url: https://wetten.overheid.nl/BWBR0005889/2004-01-01#Artikel13
  - number: '13.5'
    text: |-
      Indien veelvuldig dienstreizen moeten worden gemaakt, kan het bevoegde gezag een lagere vergoeding wegens
      verblijfkosten vaststellen dan de vergoeding die wordt vastgesteld volgens de in het eerste lid te stellen regels.
    url: https://wetten.overheid.nl/BWBR0005889/2004-01-01#Artikel13
  - number: '13.6'
    text: |-
      In dit artikel worden onder overnachting van overheidswege en maaltijden van overheidswege verstaan: overnachting
      en maaltijden verstrekt vanwege of voor rekening van het Rijk, een ander Nederlands publiekrechtelijk lichaam of
      semi-publiekrechtelijk lichaam, een door het Rijk gesubsidieerde instelling, dan wel vanwege of voor rekening van
      een buitenlandse mogendheid of een internationale organisatie.
    url: https://wetten.overheid.nl/BWBR0005889/2004-01-01#Artikel13
  - number: '14.1'
    text: |-
      Ter vervanging van de in dit besluit bedoelde vergoedingen, kan het bevoegde gezag voor de gemaakte reiskosten en
      voor de verblijfkosten, zowel afzonderlijk als tezamen, met inachtneming van het bepaalde in de volgende leden,
      vaste reissommen vaststellen in een bedrag per maand of per kwartaal.
    url: https://wetten.overheid.nl/BWBR0005889/2004-01-01#Artikel14
  - number: '14.2'
    text: |-
      Bij de berekening van het bedrag wordt gelet op de veelvuldigheid en de duur der reizen en de daarmee samenhangende
      gemiddelde verblijfkosten die de dienstuitoefening van de betrokkene in de regel vereist. De vaste reissom bedraagt
      niet meer dan de vergoeding die hij vervangt.
    url: https://wetten.overheid.nl/BWBR0005889/2004-01-01#Artikel14
  - number: '14.3'
    text: |-
      Een vaste reissom wordt in ieder geval herzien zodra wijziging van betekenis optreedt in de omstandigheden die tot
      het toekennen van die reissom hebben geleid. De betrokkene is verplicht van die wijziging aan het bevoegde gezag
      mededeling te doen.
    url: https://wetten.overheid.nl/BWBR0005889/2004-01-01#Artikel14
  - number: '15.1'
    text: |-
      Het declareren van de reis- en verblijfkosten geschiedt op een door het bevoegde gezag voorgeschreven wijze, onder
      overlegging van de vereiste bewijsstukken.
    url: https://wetten.overheid.nl/BWBR0005889/2004-01-01#Artikel15
  - number: '15.2'
    text: |-
      De aanspraak op een vergoeding vervalt, indien de betrokkene de declaratie niet indient binnen drie maanden na de
      maand waarop de declaratie betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0005889/2004-01-01#Artikel15
  - number: '16'
    text: |-
      Onze Minister kan, voor zover nodig in individuele gevallen en ten aanzien van een door hem aan te wijzen groep
      van betrokkenen, in afwijking van de bij of krachtens dit besluit gestelde regels besluiten, indien bijzondere
      omstandigheden daartoe aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0005889/2004-01-01#Artikel16
  - number: '17'
    text: |-
      Over de wijzigingen van de vergoedingen voor reis- en verblijfkosten krachtens dit besluit wordt overleg gevoerd
      met de centrales van overheidspersoneel in de Sectorcommissie overleg rijkspersoneel voor zover een lid de behoefte
      daaraan aan de voorzitter heeft kenbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0005889/2004-01-01#Artikel17
  - number: '18'
    text: |-
      Aan de vice-president van de Raad van State, het College van de Algemene Rekenkamer, de Nationale ombudsman,
      de directeur van het Kabinet der Koningin, alsmede aan personen die genoemde ambten waarnemen of de dragers van
      genoemde ambten vervangen, wordt voor hun binnenlandse dienstreizen vergoeding verleend tot de bedragen, die
      volgens hun opgaven met inachtneming van gepaste zuinigheid in totaal, onderscheidenlijk voor reiskosten en voor
      verblijfkosten, zijn uitgegeven, in voorkomende gevallen daaronder begrepen de uitgaven van en ten behoeve van de
      reizigers die hen vergezellen.
    url: https://wetten.overheid.nl/BWBR0005889/2004-01-01#Artikel18
  - number: 18a
    text: |-
      Van de bevoegdheid tot het stellen van regels met een sterk technisch karakter krachtens dit besluit, kunnen Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties en Onze Minister mandaat verlenen.
    url: https://wetten.overheid.nl/BWBR0005889/2004-01-01#Artikel18a
  - number: '20'
    text: Dit besluit treedt in werking met ingang van 1 april 1993.
    url: https://wetten.overheid.nl/BWBR0005889/2004-01-01#Artikel20
  - number: '21'
    text: 'Dit besluit kan worden aangehaald als: Reisbesluit binnenland.'
    url: https://wetten.overheid.nl/BWBR0005889/2004-01-01#Artikel21
