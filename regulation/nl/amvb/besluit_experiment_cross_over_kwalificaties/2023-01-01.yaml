  - number: '2.1'
    text: |-
      Het doel van het experiment is te onderzoeken of er behoefte is aan cross-over kwalificaties en de daarop
      gebaseerde opleidingen en of de in dit besluit neergelegde procedure om deze tot stand te brengen, doelmatig is.
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel2
  - number: '2.2'
    text: Het experiment duurt van 1 augustus 2017 tot en met 31 juli 2025.
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel2
  - number: '3'
    text: |-
      Het doel van cross-over kwalificaties is dat er opleidingen kunnen komen die zijn toegesneden op nieuwe beroepen
      die op het snijvlak van twee of meer opleidingsdomeinen liggen, opdat snel kan worden tegemoet gekomen aan de vraag
      van het bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel3
  - number: '4.1'
    text: |-
      In verband met het experiment wordt de cross-over kwalificatie in afwijking van
      [artikel 7.2.4, tweede, derde, vierde en zesde lid, van de wet][ref1] vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: '4.2'
    text: |-
      Onder de kwalificaties, genoemd in de [artikelen 6.4.1, tweede lid][ref1], [7.1.3][ref2] en
      [7.4.2, tweede lid, van de wet][ref3], vallen ook cross-over kwalificaties.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '7'
  - number: '4.3'
    text: |-
      De prijsfactor van een experimentele opleiding wordt vastgesteld in afwijking van
      [artikel 2.2.3, vierde lid, van het Uitvoeringsbesluit WEB][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010646#Artikel2
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0010646
        artikel: '2'
  - number: '5'
    text: |-
      Om een cross-over kwalificatie tot stand te brengen en een experimentele opleiding te geven die daarop is
      gebaseerd, is toestemming van Onze minister vereist.
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel5
  - number: '6.1'
    text: De cross-over kwalificatie is opgebouwd uit delen van bestaande kwalificaties uit twee of meer opleidingsdomeinen.
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel6
  - number: '6.2'
    text: |-
      De cross-over kwalificatie bevat het geheel van bekwaamheden die een gediplomeerde van de daarop gebaseerde
      experimentele opleiding kwalificeren voor het functioneren in een beroep of een groep van samenhangende beroepen.
      De cross-over kwalificatie kent inhoudelijke samenhang.
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel6
  - number: '6.3'
    text: |-
      De cross-over kwalificatie is niet noodzakelijk indien voor een beroep een opleiding kan worden vormgegeven op
      basis van een bestaande kwalificatie of cross-over kwalificatie, al dan niet in combinatie met keuzedelen.
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel6
  - number: '6.4'
    text: De cross-over kwalificatie heeft arbeidsmarktrelevantie.
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel6
  - number: '7.1'
    text: |-
      De experimentele opleiding is een opleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onder b tot en met d, van de wet][ref1], die wordt aangeboden in de beroepsopleidende
      leerweg of de beroepsbegeleidende leerweg.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: '7.2'
    text: |-
      De experimentele opleiding is niet tegelijkertijd betrokken bij een experiment in de zin
      van het [Besluit experimenten doorlopende leerlijnen vmbo-mbo 2014–2022][ref1] of het
      [Besluit experiment beroepsopleiding gecombineerde leerwegen bol-bbl][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0033984
      [ref2]: https://wetten.overheid.nl/BWBR0036631
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0033984
      - id: ref2
        bwb_id: BWBR0036631
  - number: '7.3'
    text: |-
      De keuzedelen die bij een experimentele opleiding worden aangeboden, vallen niet samen met een of meer onderdelen
      van de cross-over kwalificatie.
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel7
  - number: '8.1'
    text: De instelling heeft een samenwerkingsovereenkomst afgesloten met een of meer bedrijven.
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel8
  - number: '8.2'
    text: Een instelling neemt met maximaal 10 experimentele opleidingen deel aan het experiment.
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel8
  - number: '8.3'
    text: |-
      De instelling voorziet in een terugvaloptie, waardoor studenten tussentijds kunnen uitstromen naar een andere
      verwante opleiding.
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel8
  - number: '8.4'
    text: |-
      Aan de instelling die de aanvraag indient, mag binnen een bij de aanvraag betrokken opleidingsdomein
      niet een waarschuwing zijn gegeven als bedoeld in [artikel 6.1.5][ref1], [6.1.5b, tweede lid][ref2], en
      [6.2.3.b, tweede lid, van de wet][ref3] of een besluit zijn genomen als bedoeld in de [artikelen 6.1.4][ref4] en
      [6.1.5b, eerste lid][ref5], [6.2.2][ref6] en [6.2.3b, eerste lid, van de wet][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref6]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref7]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel8
    references:
      - id: ref1
