  - number: '9'
    text: |-
      Ten behoeve van de aanvraag van een cross-over kwalificatie en de daarop gebaseerde experimentele opleiding wordt
      bij ministeriële regeling een model vastgesteld, alsmede een toetsingskader.
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel9
  - number: '10.1'
    text: |-
      Over de experimentele opleidingen verstrekt het bevoegd gezag, voorafgaand aan de inschrijvingen, zodanige
      informatie dat de studenten zich goed kunnen voorbereiden op de gestelde eisen en zich tijdig een goed oordeel
      kunnen vormen over de inhoud en de inrichting van het te volgen onderwijs en de examens, alsmede de voor deze
      studenten geldende terugvalopties. Deze informatie ziet ten minste op:
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel10
  - number: 10.1.a
    text: de instelling,
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel10
  - number: 10.1.b
    text: het aanbod van beroepsopleidingen en experimentele opleidingen,
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel10
  - number: 10.1.c
    text: het arbeidsmarktperspectief na beëindiging van de desbetreffende opleidingen,
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel10
  - number: 10.1.d
    text: de inhoud en de inrichting van het te volgen onderwijs,
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel10
  - number: 10.1.e
    text: de examinering,
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel10
  - number: 10.1.f
    text: de vooropleidingseisen, en
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel10
  - number: 10.1.g
    text: de kwaliteit van de verschillende opleidingen waaronder het oordeel van de inspectie ter zake,
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel10
  - number: '10.2'
    text: |-
      Het bevoegd gezag verstrekt desgevraagd aan Onze Minister informatie over de experimentele opleidingen die de
      instelling verzorgt en verleent medewerking aan de monitoring en evaluatie van het experiment.
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel10
  - number: '11.1'
    text: |-
      Een instelling die een experimentele opleiding wil verzorgen, dient bij Onze Minister een aanvraag in voor het tot
      stand brengen van een cross-over kwalificatie.
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel11
  - number: '11.2'
    text: |-
      Een instelling die een experimentele opleiding wil verzorgen op basis van een reeds bestaande cross-over
      kwalificatie, dient bij Onze Minister een aanvraag in voor het verzorgen van de experimentele opleiding.
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel11
  - number: '11.3'
    text: |-
      Onderdeel van de aanvraag van een bekostigde instelling is een verzoek om de op de cross-over kwalificatie
      gebaseerde experimentele opleiding voor bekostiging in aanmerking te brengen.
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel11
  - number: '11.4'
    text: |-
      Onderdeel van de aanvraag van een niet-bekostigde instelling is een verzoek om aan de met goed gevolg afgelegde
      examens of onderdelen van examens van een experimentele opleiding, een diploma of certificaat te verbinden, als
      bedoeld in [artikel 1.4.1 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
  - number: '12.1'
    text: |-
      De aanvraag, bedoeld in [artikel 11, eerste lid][ref1], bevat de volgende informatie:


      [ref1]: https://wetten.overheid.nl/BWBR0038333#Artikel11
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0038333
        artikel: '11'
        hoofdstuk: '2'
  - number: 12.1.a
    text: 'een beschrijving van de cross-over kwalificatie, waarbij wordt vermeld:'
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel12
  - number: 12.1.a.1°
    text: de naam van de cross-over kwalificatie en de daaruit voortvloeiende naam van de opleiding;
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel12
  - number: 12.1.a.2°
    text: op welke opleidingsdomeinen de cross-over kwalificatie betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel12
  - number: 12.1.a.3°
    text: uit welke bestaande kwalificaties en daarbinnen uit welke delen de cross-over kwalificatie wordt samengesteld;
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel12
  - number: 12.1.a.4°
    text: op welke leerweg of leerwegen de cross-over kwalificatie is gericht;
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel12
  - number: 12.1.a.5°
    text: |-
      op welke soort opleiding, als bedoeld in [artikel 7.2.2, eerste lid, onderdeel b tot en met d, van de wet][ref1],
      de cross-over kwalificatie is gericht;


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 12.1.a.6°
    text: op welk beroep of groep van beroepen de cross-over kwalificatie is gericht;
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel12
  - number: 12.1.b
    text: welke keuzedelen bij de cross-over kwalificatie behoren;
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel12
  - number: 12.1.c
    text: een toelichting op de arbeidsmarktrelevantie van het beroep waarop de cross-over kwalificatie is gericht;
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel12
  - number: 12.1.d
    text: |-
      een samenwerkingsovereenkomst met één of meer bedrijven, waaruit blijkt dat in de regio behoefte is aan de cross-
      over kwalificatie;
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel12
  - number: 12.1.e
    text: de terugvalopties voor de student die voortijdig uitstroomt uit de experimentele opleiding;
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel12
  - number: 12.1.f
    text: |-
      een inschatting van het aantal cohorten en het aantal studenten dat de instelling verwacht in te schrijven per
      cohort.
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel12
  - number: '12.2'
    text: |-
      Ten behoeve van de eindtoets geeft de instelling informatie over de uitwerking van de cross-over kwalificatie,
      conform het model en toetsingskader als bedoeld in [artikel 9][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0038333#Artikel9
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0038333
        artikel: '9'
        hoofdstuk: '1'
  - number: '12.3'
    text: |-
      De aanvraag, bedoeld in [artikel 11, tweede lid][ref1], bevat de informatie, bedoeld in het eerste lid, onder a,
      ten eerste en ten vierde, en onder b tot en met f.


      [ref1]: https://wetten.overheid.nl/BWBR0038333#Artikel11
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0038333
        artikel: '11'
        hoofdstuk: '2'
  - number: '13.1'
    text: |-
      Een aanvraag kan worden ingediend uiterlijk op 15 september van het studiejaar voorafgaand aan het studiejaar
      waarin de instelling de experimentele opleiding beoogt te starten, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel13
  - number: 13.1.a
    text: een aanvraag voor het aanbieden van een vierjarige opleiding uiterlijk op 15 september 2020 wordt ingediend;
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel13
  - number: 13.1.b
    text: een aanvraag voor het aanbieden van een driejarige opleiding uiterlijk op 15 september 2021 wordt ingediend; en
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel13
  - number: 13.1.c
    text: een aanvraag voor het aanbieden van een tweejarige opleiding uiterlijk op 15 september 2022 wordt ingediend.
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel13
  - number: '13.2'
    text: |-
      De informatie, bedoeld in het [eerste lid van artikel 12][ref1], wordt verstrekt bij de aanvraag. De informatie,
      bedoeld in het tweede lid van artikel 12, wordt verstrekt uiterlijk 9 weken nadat Onze minister heeft laten weten
      dat de in het eerste lid bedoelde informatie voldoende is.


      [ref1]: https://wetten.overheid.nl/BWBR0038333#Artikel12
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0038333
        artikel: '12'
        hoofdstuk: '2'
  - number: '14.1'
    text: |-
      De beoordeling van de aanvraag is gesplitst in een ingangstoets en een eindtoets. De ingangstoets wordt gebaseerd
      op de vereisten van de [artikelen 6 tot en met 8][ref1], de eisen die rechtstreeks voortvloeien uit de [wet][ref2]
      en de informatie, bedoeld in het eerste lid dan wel het [derde lid van artikel 12][ref3]. Indien de ingangstoets
      ten aanzien van een aanvraag, bedoeld in [artikel 11, eerste lid][ref4], positief is beoordeeld, verstrekt de
      indiener de informatie, bedoeld in het tweede lid van artikel 12, ten behoeve van de eindtoets.


      [ref1]: https://wetten.overheid.nl/BWBR0038333#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007625
      [ref3]: https://wetten.overheid.nl/BWBR0038333#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0038333#Artikel11
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0038333
        artikel: '6'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0007625
      - id: ref3
        bwb_id: BWBR0038333
        artikel: '12'
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0038333
        artikel: '11'
        hoofdstuk: '2'
  - number: '14.2'
    text: |-
      De Samenwerkingsorganisatie beroepsonderwijs bedrijfsleven brengt over de ingediende aanvragen advies uit aan Onze
      minister, zowel ten behoeve van de ingangstoets als van de eindtoets.
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel14
  - number: '15.1'
    text: |-
      Op een aanvraag die is ingediend conform de [artikelen 11 tot en met 13][ref1], beslist Onze Minister positief
      indien de instelling heeft aangetoond dat zij voldoet aan de vereisten van de [artikelen 6 tot en met 8][ref2]
      en – voor zover het een niet-bekostigde instelling betreft – tevens aan de voorwaarden gesteld in
      [artikel 1.4.1, eerste lid, van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0038333#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0038333#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0038333
        artikel: '11'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0038333
        artikel: '6'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '1'
  - number: '15.2'
    text: |-
      Indien Onze minister de aanvraag afwijst op grond van de ingangstoets, wordt de desbetreffende
      beschikking afgegeven binnen negen weken nadat de informatie, bedoeld in het eerste lid dan wel het
      [derde lid van artikel 12][ref1], is verstrekt of nadat de termijn voor het geven van deze informatie ongebruikt
      is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0038333#Artikel12
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0038333
        artikel: '12'
        hoofdstuk: '2'
  - number: '15.3'
    text: |-
      Indien het vorige lid niet van toepassing is, geeft Onze Minister een beschikking af uiterlijk op 1 april,
      voorafgaand aan het studiejaar waarop de gewenste cross-over kwalificatie betrekking heeft. Deze beslistermijn kan
      met vijf weken worden verlengd.
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel15
  - number: '15.4'
    text: 'Indien Onze minister de aanvraag toewijst, wordt in de desbetreffende beschikking vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel15
  - number: 15.4.a
    text: |-
      de cross-over kwalificatie, waarin staat beschreven wat een gediplomeerde van de experimentele opleiding moet
      kennen en kunnen als hij met het diploma start op de arbeidsmarkt;
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel15
  - number: 15.4.b
    text: het laatste studiejaar dat studenten mogen worden ingeschreven;
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel15
  - number: 15.4.c
    text: |-
      indien het een aanvraag van een bekostigde instelling betreft, dat de desbetreffende experimentele opleiding wordt
      bekostigd, alsmede de prijsfactor van de opleiding;
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel15
  - number: 15.4.d
    text: |-
      indien het een aanvraag van een niet-bekostigde instelling betreft, dat aan de op de cross-over
      kwalificatie gebaseerde experimentele opleiding een diploma of certificaat is verbonden als bedoeld in
      [artikel 7.4.6 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: '16'
    text: |-
      Indien ten aanzien van de experimentele opleiding een waarschuwing is gegeven als bedoeld in [artikel 6.1.5][ref1],
      [artikel 6.1.5b, tweede lid][ref2] of [artikel 6.2.3.b, tweede lid, van de wet][ref3] of indien is gebleken dat de
      instelling de voorschriften van dit besluit niet naar behoren naleeft, kan Onze Minister bepalen dat de instelling
      geen nieuwe cohorten studenten meer mag inschrijven aan de experimentele opleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel6
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '6'
  - number: '17'
    text: |-
      Onze minister registreert een op grond van dit Besluit vastgestelde cross-over kwalificatie in de Registratie
      instellingen en opleidingen, waarbij de volgende gegevens worden vermeld:
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel17
  - number: '17.1'
    text: de naam en de code van de cross-over kwalificatie,
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel17
  - number: '17.2'
    text: voor zover het een bekostigde instelling betreft, de prijsfactor.
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel17
  - number: '18.1'
    text: Onze minister evalueert het experiment in 2021.
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel18
  - number: '18.2'
    text: 'Onze minister evalueert het experiment op basis van ten minste de volgende criteria:'
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel18
  - number: 18.2.a
    text: de behoefte aan cross-over kwalificaties bij het bedrijfsleven, bij studenten en bij instellingen;
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel18
  - number: 18.2.b
    text: |-
      de wijze waarop de cross-over kwalificaties tot stand komen, waaronder de doelmatigheid van de procedure, mede in
      relatie tot de administratieve lasten.
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel18
  - number: '19'
    text: Dit besluit treedt in werking met ingang van 1 augustus 2016 en vervalt met ingang van 1 augustus 2025.
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel19
  - number: '20'
    text: 'Dit besluit wordt aangehaald als: Besluit experiment cross-over kwalificaties.'
    url: https://wetten.overheid.nl/BWBR0038333/2023-01-01#Artikel20
