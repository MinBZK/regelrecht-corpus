articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder: - *bestaande kwalificatie:* kwalificatie als bedoeld in
      [artikel 7.1.3 van de wet][ref1];
        - *bekostigde instelling:* instelling als bedoeld in [artikel 1.1.1 van de wet][ref2], die uit ’s Rijks kas wordt
      bekostigd;
        - *cohort:* tijdvak lopend van het eerste jaar van een opleiding tot en met het laatste jaar, uitgaande van de
      studieduur als bedoeld in [artikel 7.2.4a van de wet][ref3];
        - *cross-over kwalificatie:* een kwalificatie die niet bij een opleidingsdomein behoort, maar waarin delen van
      kwalificaties uit twee of meer opleidingsdomeinen worden samengevoegd tot een nieuwe, domeinoverschrijdende
      kwalificatie;
        - *eindtoets:* uiteindelijke beoordeling van de aanvraag, als bedoeld in [artikel 14, eerste lid][ref4];
        - *experiment:* tijdelijke mogelijkheid om een cross-over kwalificatie tot stand te brengen en op basis daarvan een
      experimentele opleiding te verzorgen;
        - *experimentele opleiding:* opleiding waaraan een cross-over kwalificatie ten grondslag ligt;
        - *ingangstoets:* eerste beoordeling van de aanvraag, als bedoeld in [artikel 14, eerste lid][ref5];
        - *instelling:* instelling als bedoeld in [artikel 1.1.1][ref6] of [artikel 1.4.1 van de wet][ref7];
        - *niet-bekostigde instelling:* instelling als bedoeld in [artikel 1.4.1 van de wet][ref8],
        - *Onze Minister:* Onze Minister van Onderwijs, Cultuur en Wetenschap;
        - *opleiding:* beroepsopleiding als bedoeld in [artikel 7.1.2, tweede lid, van de wet][ref9], waaronder ook een
      experimentele opleiding;
        - *wet:* [Wet educatie en beroepsonderwijs][ref10] (WEB).


