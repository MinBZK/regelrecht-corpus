    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Onderwijs, Cultuur en Wetenschappen van 7 mei 1996, nr. 96012349/1343,
    directie Wetgeving en Juridische Zaken;

    Gelet op de artikelen 7, onderdeel c, 21, onderdeel c, en 70 van de Wet tegemoetkoming studiekosten, op de
    artikelen 7, onderdeel c, 9, eerste lid, onderdeel j, 12, lid 3b en vierde lid, 106, 117a, derde lid, 123, eerste
    lid, en 130 van de Wet op de studiefinanciering, alsmede op de artikelen 4 en 5 van de Les- en cursusgeldwet;

    De Raad van State gehoord (advies van 3 juni 1996, nr. W05.96.0191);

    Gezien het nader rapport van Onze Minister van Onderwijs, Cultuur en Wetenschappen van 24 juni 1996, nr.
    96015517/1343, directie Wetgeving en Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008149/2001-06-27#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder de wet: de Wet tegemoetkoming studiekosten.'
    url: https://wetten.overheid.nl/BWBR0008149/2001-06-27#Artikel1
  - number: '2'
    text: |-
      1 Naast degenen die reeds op grond van [artikel 7, onderdeel ][ref1], van de wet voor het terrein van de
      tegemoetkoming in de studiekosten op grond van hoofdstuk II van de wet met Nederlanders worden gelijkgesteld,
      worden voor het terrein van de tegemoetkoming in de studiekosten op grond van dat hoofdstuk met Nederlanders
      gelijkgesteld:

      a. de aanvrager, bedoeld in [artikel 8][ref2] van de wet, aan wie het ingevolge artikel 10, eerste lid, onderdelen
      a en b, en tweede lid, van de Vreemdelingenwet is toegestaan voor onbepaalde tijd in Nederland te verblijven, en

      b. de aanvrager, bedoeld in [artikel 8][ref3] van de wet, aan wie het ingevolge artikel 9 van de Vreemdelingenwet
      is toegestaan in Nederland te verblijven en die op de laatste dag van het studiejaar ten minste 3 jaren
      onafgebroken in Nederland woonachtig is.

      2 De termijn van 3 jaren, genoemd in het eerste lid, onderdeel *b*, geldt niet indien de aanvrager, bedoeld in
      [artikel 8][ref4] van de wet, Nederlander is geweest, in Nederland is geboren en tevens in totaal 15 jaren in
      Nederland heeft gewoond.


      [ref1]: https://wetten.overheid.nl/BWBR0008149#Artikel7
