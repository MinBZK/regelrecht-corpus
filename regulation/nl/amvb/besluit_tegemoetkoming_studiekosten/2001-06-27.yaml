  - number: '3'
    text: |-
      [Artikel 3 van het Besluit studiefinanciering 2000](onbekend) is van overeenkomstige toepassing op een studerende,
      bedoeld in hoofdstuk III van de wet. Indien ten behoeve van een studerende een tegemoetkoming in de studiekosten op
      grond van hoofdstuk II van de wet is verstrekt, voldoet de studerende ook zelf aan de nationaliteitseis, bedoeld in
      artikel 21, aanhef en onderdeel c, van de wet.
    url: https://wetten.overheid.nl/BWBR0008149/2001-06-27#Artikel3
  - number: '4'
    text: |-
      1 [Artikel 16, eerste lid van het Besluit studiefinanciering 2000](onbekend) is van overeenkomstige toepassing op
      de verplichting, bedoeld in artikel 70 van de wet.

      2 [Artikel 16, tweede lid, van het Besluit studiefinanciering 2000](onbekend) is van overeenkomstige toepassing op
      de verplichting, bedoeld in artikel 1a, zevende lid, van de wet.
    url: https://wetten.overheid.nl/BWBR0008149/2001-06-27#Artikel4
  - number: '7'
    text: |-
      Degenen die op 31 juli 1996 op grond van de Regeling tegemoetkoming studiekosten TS 17- zoals vastgesteld op grond
      van [artikel 121 van de Wet op het voortgezet onderwijs][ref1], op grond van het Besluit studietoelagen WVO en
      op grond van [artikel 7 van de Experimentenwet onderwijs][ref2], een tegemoetkoming in de studiekosten ontvingen,
      voldoen aan de nationaliteitseis, bedoeld in [artikel 7, aanhef en onderdeel ][ref3], van de wet.


