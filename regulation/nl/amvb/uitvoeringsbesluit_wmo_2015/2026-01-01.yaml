  - number: 3.2.1
    text: |-
      Het vermogen van een persoon is zijn vermogensgrondslag, bedoeld in het tweede of derde lid, waarvan op aanvraag
      van de persoon wordt afgetrokken het bedrag ter grootte van door de persoon in het peiljaar of enig eerder jaar
      ontvangen eenmalige uitkeringen die bij ministeriële regeling van Onze Minister of Onze Minister van Financiën
      krachtens [artikel 47 van de Algemene wet inkomensafhankelijke regelingen][ref1] zijn aangewezen, met dien
      verstande dat het vermogen ten minste nihil bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel47
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '47'
  - number: 3.2.2
    text: |-
      De vermogensgrondslag van een persoon is zijn rendementsgrondslag aan het begin van het peiljaar voor
      zover die rendementsgrondslag meer bedraagt dan het voor dat jaar van toepassing zijnde bedrag in
      [artikel 9.4, eerste lid, onderdeel c, van de Wet inkomstenbelasting 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel9
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '9'
  - number: 3.2.3
    text: |-
      In afwijking van het tweede lid is de vermogensgrondslag van een persoon in geval [artikel 3.14, tweede lid][ref1],
      of [artikel 3.16][ref2] van toepassing is, de te verwachten rendementsgrondslag over het lopende
      jaar voor zover die rendementsgrondslag meer bedraagt dan het van toepassing zijnde bedrag in
      [artikel 9.4, eerste lid, onderdeel c, van de Wet inkomstenbelasting 2001][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0035733#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035733#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel9
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.2
