  - number: '3.17'
    text: |-
      1 Indien ten aanzien van de ongehuwde cliënt of de gehuwde cliënt en diens echtgenoot geen voor de vaststelling van
      de bijdrage benodigde gegevens inzake het inkomen en de rendementsgrondslag beschikbaar zijn, wordt:

      a. de bijdrage, bedoeld in [artikel 3.11, eerste lid][ref1], vastgesteld op € 0 per maand;

      b. de bijdrage, bedoeld in [artikel 3.12, eerste en tweede lid][ref2], vastgesteld op het minimumbedrag, genoemd in
      artikel 3.12, derde lid.

      2 Indien na de vaststelling van de bijdrage uit alsnog beschikbaar gekomen gegevens inzake het inkomen of de
      rendementsgrondslag, of uit een wijziging van deze gegevens, blijkt dat de bijdrage op een te hoog of te laag
      bedrag is vastgesteld, herziet het CAK de bijdrage met inachtneming van de beschikbaar gekomen gegevens dan wel van
      die wijziging.


      [ref1]: https://wetten.overheid.nl/BWBR0035733#Artikel3.11
      [ref2]: https://wetten.overheid.nl/BWBR0035733#Artikel3.12
