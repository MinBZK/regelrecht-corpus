  - number: 4.1.5
    text: |-
      Indien de mogelijkheid tot registratie in het kwaliteitsregister jeugd, bedoeld in
      [artikel 1.1 van het Besluit Jeugdwet][ref1], wordt uitgebreid naar nieuwe categorieën van beoefenaren
      van beroepen in het jeugddomein, bedoeld in het eerdergenoemde artikel, kan gedurende een termijn
      van vijf jaar en drie maanden vanaf het tijdstip van aanvang van die termijn in afwijking van
      [artikel 5.4.2, eerste lid, aanhef en onder c, van het Besluit Jeugdwet][ref2] een tot die categorie behorende
      beroepsbeoefenaar in het kwaliteitsregister jeugd zijn ingeschreven indien:

      a. die beroepsbeoefenaar op het tijdstip waarop de termijn aanvangt werkzaam is voor Veilig Thuis in een functie
      waarvoor scholing is vereist op het niveau van een hogere beroepsopleiding;

      b. de aan de registratie van de beroepsbeoefenaar ten grondslag liggende aanvraag is ingediend binnen drie maanden
      na het tijdstip waarop de termijn is aangevangen;

      c. de beroepsbeoefenaar deelneemt aan een scholingstraject dat erop gericht is uiterlijk bij de eerste
      herregistratie de scholing op het niveau van hoger beroepsonderwijs te voltooien, en

      d. de registerstichting bij de uitvoering van [artikel 5.4.4 Besluit Jeugdwet][ref3] ervoor zorg draagt dat voor
      een ieder kenbaar is dat de registratie van de beroepsbeoefenaar valt onder de werking van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0035779#Artikel1.1
      [ref2]: https://wetten.overheid.nl/BWBR0035779#Artikel5.4.2
      [ref3]: https://wetten.overheid.nl/BWBR0035779#Artikel5.4.4
