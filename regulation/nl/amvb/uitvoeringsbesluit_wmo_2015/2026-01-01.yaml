  - number: '3.11'
    text: |-
      1 De bijdrage, bedoeld in [artikel 3.1, derde lid][ref1], bedraagt per maand een twaalfde gedeelte van het
      bijdrageplichtig inkomen, berekend volgens [artikel 3.13][ref2], voor:

      a. de ongehuwde cliënt die in een instelling voor beschermd wonen verblijft of een persoonsgebonden budget voor
      beschermd wonen is verleend;

      b. de gehuwde cliënten tezamen die beiden in een instelling voor beschermd wonen verblijven dan wel dat daarvoor
      een persoonsgebonden budget is verleend;

      c. de gehuwde cliënt wiens echtgenoot een bijdrage ingevolge [artikel 3.3.2.1 van het Besluit langdurige zorg][ref3]
      verschuldigd is.

      2 De bijdrage, bedoeld in het eerste lid, bedraagt niet meer dan € 3.061,80 per maand.

      3 In het geval, bedoeld in het eerste lid, onderdeel c, zijn de cliënt en zijn echtgenoot tezamen slechts eenmaal
      de bijdrage, berekend overeenkomstig het eerste en tweede lid, verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0035733#Artikel3.1
      [ref2]: https://wetten.overheid.nl/BWBR0035733#Artikel3.13
      [ref3]: https://wetten.overheid.nl/BWBR0035948#Artikel3.3.2.1
