  - number: 2.1.1.a
    text: |-
      na rechtmatig in Nederland verblijf te hebben gehad in de zin van
      [artikel 8, onderdelen a tot en met e, of l, van de Vreemdelingenwet 2000][ref1] en voor de beëindiging van dit
      verblijf een aanvraag heeft ingediend tot het verlenen van een verblijfsvergunning;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel2.1
    references:
