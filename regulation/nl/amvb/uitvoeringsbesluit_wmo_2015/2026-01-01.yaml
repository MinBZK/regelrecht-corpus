  - number: '3.8'
    text: |-
      1 [Artikel 2.1.4a, vierde lid, van de wet][ref1] is niet van toepassing op een voorziening voor vervoer voor zover
      de gemeente bij verordening de hoogte van de bijdrage vaststelt.

      2 Bij de verordening, bedoeld in [artikel 2.1.4, vierde lid, onderdeel b][ref2], en
      [artikel 2.1.4a, vijfde lid, onderdeel b, van de wet][ref3], kan voor onderscheidenlijk de categorieën de ongehuwde
      cliënt die de pensioengerechtigde leeftijd nog niet heeft bereikt, de ongehuwde cliënt die de pensioengerechtigde
      leeftijd heeft bereikt of de gehuwde cliënt die de pensioengerechtigde leeftijd heeft bereikt, de bijdrage op nihil
      worden gesteld indien het bijdrageplichtig inkomen van de ongehuwde cliënt of een gezamenlijk bijdrageplichtig
      inkomen van de gehuwde cliënt en zijn echtgenoot, lager is dan het per categorie vastgesteld bijdrageplichtig
      inkomen.

      3 De bijdrage is niet verschuldigd:

      a. indien de cliënt of de echtgenoot van de cliënt een bijdrage als bedoeld in [artikel 3.11][ref4] of [3.12][ref5]
      dan wel een bijdrage ingevolge de [artikelen 3.3.2.1][ref6] of [3.3.2.2 van het Besluit langdurige zorg][ref7]
      verschuldigd is;

      b. indien de cliënt of zijn echtgenoot gedurende twee of meer nachten aaneengesloten in de maand in een instelling
      voor opvang verblijft;

      c. indien het college, na advies van een instelling voor algemeen maatschappelijk werk, de Raad voor de
      Kinderbescherming of Veilig Thuis, van oordeel is dat de verschuldigdheid van de bijdrage kan leiden tot
      mishandeling, verwaarlozing of ernstige schade voor de opvoeding en ontwikkeling van een minderjarige door de
      ouder, bedoeld in [artikel 1.1 van de Jeugdwet][ref8];

      d. voor een rolstoel;

      e. voor een cliënt die de leeftijd van achttien jaar nog niet heeft bereikt, met uitzondering van een
      woningaanpassing voor zover bij verordening op grond van [artikel 2.1.5 van de wet][ref9] een ander de bijdrage
      verschuldigd is;

      f. door de gehuwde cliënt of de gehuwde cliënten tezamen, waarvan ten minste een van beiden de pensioengerechtigde
      leeftijd nog niet heeft bereikt;

      g. indien het college van oordeel is dat er voor de vast te stellen bijdrage onvoldoende betalingscapaciteit
      aanwezig is bij de cliënt;

      h. indien het college van oordeel is dat de verschuldigdheid van de bijdrage nadelige gevolgen heeft voor de
      doelstellingen van een integrale dienstverlening of persoonsgerichte aanpak van een cliënt die gericht is op het
      zich kunnen handhaven in de samenleving, het zo lang mogelijk in de eigen leefomgeving blijven of de veiligheid en
      leefbaarheid in de gemeente;

      i. voor de maanden april en mei van het kalenderjaar 2020, tenzij het betreft de bijdrage voor een
      maatwerkvoorziening of persoonsgebonden budget voor beschermd wonen of opvang.

      4 Het college geeft onmiddellijk voor het toepassen van het derde lid, onderdelen c, g en h, bij het CAK aan over
      hoeveel maanden geen bijdrage verschuldigd is. De ingangsdatum van de maand waarover geen bijdrage verschuldigd
      is, wordt niet gesteld op een datum die is gelegen meer dan zesendertig maanden voorafgaand aan de dag waarop
      het oordeel van het college aan het CAK kenbaar is gemaakt. Een herziening van de periode waarover geen bijdrage
      verschuldigd is heeft geen betrekking op de perioden die liggen voor de ingangsdatum van de eerste maand waarover
      geen bijdrage is verschuldigd.

      5 Indien een cliënt een bijdrage niet verschuldigd is op grond van [artikel 3.5, zevende lid][ref10] of
      [3.6, vierde en vijfde lid, wordt het derde lid, onderdeel a][ref11], toegepast alsof de cliënt wel die bijdrage
      verschuldigd is.

      6 Het derde lid is van overeenkomstige toepassing op degenen die op grond van [artikel 2.1.5][ref12] de bijdrage
      verschuldigd zijn voor een woningaanpassing voor minderjarige cliënten.

      7 Bij ministeriële regeling kunnen regels worden gesteld over de wijze waarop de betalingscapaciteit, bedoeld in
      het derde lid, onderdeel g, door het college wordt beoordeeld.


