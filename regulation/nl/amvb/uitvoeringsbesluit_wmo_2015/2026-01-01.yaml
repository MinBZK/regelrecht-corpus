  - number: 4.1.3
    text: |-
      1 Indien toepassing is gegeven aan [artikel 5.2.1, eerste lid, van het Besluit Jeugdwet][ref1] draagt
      Veilig Thuis er zorg voor dat de taken, bedoeld in [artikel 4.1.1, tweede en derde lid, van de wet][ref2],
      worden uitgevoerd door of onder verantwoordelijkheid van een geregistreerde professional als bedoeld in
      [artikel 1.1. van het Besluit Jeugdwet][ref3]. Veilig Thuis deelt de taken toe met inachtneming van de specifieke
      kennis en vaardigheden van de geregistreerde professional.

      2 In afwijking van het eerste lid kan Veilig Thuis anderen dan geregistreerde professionals met de uitvoering
      van een of meer taken, bedoeld in [artikel 4.1.1, tweede en derde lid, van de wet][ref4], belasten indien het
      aannemelijk kan maken dat de kwaliteit van de uit te voeren taak daardoor niet nadelig wordt beïnvloed. Veilig
      Thuis belast anderen met die taken indien dit noodzakelijk is voor de kwaliteit van de uit te voeren taak.

      3 Veilig Thuis draagt er zorg voor dat geregistreerde professionals hun taken kunnen verrichten met inachtneming
      van de voor hen geldende professionele standaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0035779#Artikel5.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0035362#Artikel4.1.1
