  - number: 3.2a
    text: |-
      De vermogensinkomensbijtelling bedraagt 4% van het vermogen van de ongehuwde cliënt, dan wel de opgetelde vermogens
      van de gehuwde cliënten.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.2a
  - number: '3.3'
    text: |-
      1 De cliënt betaalt:

      a. de bijdrage, bedoeld in [artikel 3.1, tweede lid][ref1], uiterlijk in de maand volgend op de maand waarover de
      bijdrage verschuldigd is, tenzij de verschuldigdheid van een bijdrage betrekking heeft op een maand die voorafgaand
      is aan de maand waarin het besluit, waarmee een herziening is vastgesteld als bedoeld in [artikel 3.6][ref2], aan
      de cliënt is verzonden;

      b. ingeval de verschuldigdheid de bijdrage, bedoeld in [artikel 3.1, tweede lid][ref3], betrekking heeft op een
      maand die voorafgaand is aan de maand waarin het besluit, waarmee een herziening is vastgesteld als bedoeld in
      artikel 3.6, aan de cliënt is verzonden, uiterlijk in de maand volgend op de maand waarin het besluit waarmee een
      herziening is vastgesteld als bedoeld in [artikel 3.6][ref4], aan de cliënt is verzonden;

      c. de bijdrage, bedoeld in [artikel 3.1, derde en vierde lid][ref5], binnen dertig dagen nadat het CAK of de
      instantie als bedoeld in [artikel 2.1.4b, tweede lid, van de wet][ref6], het besluit bekend heeft gemaakt waarbij
      vastgesteld is of en in welke omvang de cliënt een bijdrage verschuldigd is.

      Het CAK kan een afwijkende termijn vaststellen.

      2 Het CAK is bevoegd tot verrekening van vorderingen krachtens de wet van of op de cliënt met vorderingen van
      of op de cliënt krachtens de [Wet langdurige zorg][ref7], de [Wet maatschappelijke ondersteuning][ref8] en de
      [Algemene Wet Bijzondere Ziektekosten][ref9].

      3 Het gemeentebestuur of een andere instantie als bedoeld in [artikel 2.1.4b, tweede lid, van de wet][ref10]
      is bevoegd tot verrekening van vorderingen krachtens de wet van of op een cliënt met vorderingen van of op deze
      cliënt krachtens de [Wet maatschappelijke ondersteuning][ref11] of de [Participatiewet][ref12]. De eerste volzin
      is niet van toepassing op de bijdrage voor opvang voor personen die de thuissituatie hebben verlaten in verband met
      risico’s voor hun veiligheid als gevolg van huiselijk geweld.

      4 Het CAK of een andere bij verordening aangewezen instantie, ingeval het de bijdrage, bedoeld in
      [artikel 3.1, vierde lid][ref13], betreft, maakt, indien van toepassing, voor de vaststelling van de bijdrage,
      bedoeld in artikel 3.1, tweede lid, voor zover [artikel 3.8][ref14], [3.9, tweede en vierde lid][ref15], of
      [3.14, tweede of vierde lid][ref16], is toegepast, en de bijdrage, bedoeld in artikel 3.1, derde en vierde lid,
      gebruik van:

      a. het inkomensgegeven, bedoeld in [artikel 21, onderdeel e, van de Algemene wet inzake rijksbelastingen][ref17]
      en van andere door de inspecteur, bedoeld in
      [artikel 2, derde lid, onderdeel b, van de Algemene wet inzake rijksbelastingen][ref18], verstrekte gegevens;

      b. gegevens van het college over de verstrekte aangewezen algemene voorziening, bedoeld in
      [artikel 2.1.4a, derde lid][ref19], de maatwerkvoorziening of het verleende persoonsgebonden budget.


