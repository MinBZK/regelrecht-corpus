  - number: '3.12'
    text: |-
      1 In afwijking van [artikel 3.11][ref1] bedraagt een bijdrage per maand een twaalfde gedeelte van 10% van het
      bijdrageplichtig inkomen, berekend volgens [artikel 3.14][ref2], voor:

      a. de ongehuwde cliënt gedurende de eerste vier maanden van verblijf in een instelling voor beschermd wonen of
      waarover een persoonsgebonden budget is verleend voor beschermd wonen;

      b. de gehuwde cliënten tezamen, zolang niet ten aanzien van elk van hen een periode van vier maanden als bedoeld in
      onderdeel a, is verstreken, tezamen;

      c. de ongehuwde cliënt die moet of gehuwde cliënten tezamen die moeten voorzien in de kosten van onderhoud van
      eigen, aangehuwde of pleegkinderen, mits voor die kinderen op grond van de [Algemene Kinderbijslagwet][ref3]
      recht op een uitkering bestaat of aan die kinderen, voor zover ze de leeftijd van 27 jaar nog niet hebben bereikt,
      studiefinanciering is toegekend krachtens de [Wet studiefinanciering 2000][ref4];

      d. de ongehuwde cliënt of de gehuwde cliënten tezamen indien het college het waarschijnlijk acht dat het verblijf
      in de instelling voor beschermd wonen of waarover een persoonsgebonden budget is verleend voor beschermd wonen voor
      de ongehuwde cliënt, voor beide of voor een van beide gehuwde cliënten binnen vier maanden kan worden beëindigd en
      terugkeer naar de maatschappij mogelijk is en zal worden bewerkstelligd.

      2 De bijdrage bedraagt voorts per maand een twaalfde gedeelte van 10% van het bijdrageplichtig inkomen, berekend
      volgens [artikel 3.14][ref5], voor:

      a. de gehuwde cliënt die in een instelling voor beschermd wonen verblijft of een persoonsgebonden budget voor
      beschermd wonen is verleend en wiens echtgenoot geen maatwerkvoorziening of persoonsgebonden budget ontvangt;

      b. de gehuwde cliënten tezamen van wie één in een instelling voor beschermd wonen verblijft of een persoonsgebonden
      budget voor beschermd wonen is verleend en wiens echtgenoot een persoonsgebonden budget of een andere
      maatwerkvoorziening ontvangt;

      c. de gehuwde cliënt die in een instelling voor beschermd wonen verblijft of een persoonsgebonden
      budget voor beschermd wonen is verleend en wiens echtgenoot zorg ontvangt als bedoeld in
      [artikel 3.1.1, eerste lid, van de Wet langdurige zorg][ref6], voor zover het zorg met verblijf in een instelling,
      een volledig pakket thuis, een modulair pakket thuis of een persoonsgebonden budget betreft, met dien verstande dat
      de cliënt en zijn echtgenoot tezamen de bijdrage slechts eenmaal verschuldigd zijn.

      3 De bijdrage voor beschermd wonen, bedoeld in het eerste en tweede lid, bedraagt ten minste € 212,60 en niet meer
      dan € 1.115,80 per maand.

      4 De onderdelen a en b van het eerste lid zijn niet van toepassing indien:

      a. het een cliënt betreft van wie het recht op verblijf en de daarbij behorende medisch noodzakelijke geneeskundige
      zorg in verband met een psychische stoornis krachtens zijn zorgverzekering is geëindigd omdat de krachtens de
      Zorgverzekeringswet geldende maximumduur voor die zorg is bereikt, of

      b. het verblijf aanvangt binnen vier maanden na beëindiging van een verblijf in een instelling voor beschermd wonen
      of persoonsgebonden budget voor beschermd wonen waarvoor de ongehuwde cliënt of de gehuwde cliënten tezamen een
      bijdrage als bedoeld in [artikel 3.11][ref7] verschuldigd was of waren, of

      c. het verblijf aanvangt of het persoonsgebonden budget voor beschermd wonen wordt verleend binnen vier maanden
      na beëindiging van een verblijf in een instelling waarvoor de ongehuwde cliënt of de gehuwde cliënten tezamen een
      bijdrage als bedoeld in [artikel 3.3.2.1 van het Besluit langdurige zorg][ref8] verschuldigd was of waren.

      5 Voor de berekening van de periode van vier maanden, bedoeld in het vierde lid, worden perioden van verblijf
      op grond van de Wet langdurige zorg, instellingen voor beschermd wonen of perioden waarover een persoonsgebonden
      budget voor beschermd wonen is verleend, samengeteld, tenzij tussen twee zodanige perioden meer dan zestig dagen
      zijn verlopen. De eerste volzin is niet van toepassing op cliënten die maximaal twee weken per twee maanden in een
      instelling voor beschermd wonen verblijven of een persoonsgebonden budget voor beschermd wonen is verleend.

      6 Uit eigen beweging door het CAK of op aanvraag van de cliënt is de bijdrage niet verschuldigd indien de cliënt
      die in een instelling verblijft of een persoonsgebonden budget ontvangt voor beschermd wonen:

      a. een inkomen heeft dat gelijk is aan of lager is dan de in
      [artikel 23, eerste en tweede lid, van de Participatiewet][ref9], genoemde normbedragen, die gelden voor de cliënt
      of diens echtgenoot in de daarbij genoemde burgerlijke staat, waarbij die normbedragen opgehoogd worden met de voor
      de cliënt op grond van het derde lid vastgestelde minimale eigen bijdrage; of

      b. op grond van [artikel 13, tweede lid, onderdeel a, van de Participatiewet][ref10] geen uitkering ontvangt.

      7 De aanvraag, bedoeld in het zesde lid, wordt gedaan uiterlijk vier maanden na afloop van het kalenderjaar
      waarop de aanvraag betrekking heeft of uiterlijk vier maanden na de datum waarop de bijdrage op basis van het
      bijdrageplichtig inkomen wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0035733#Artikel3.11
