      1 Voor de toepassing van de wet wordt met een Nederlander gelijkgesteld de vreemdeling die:

      a. na rechtmatig in Nederland verblijf te hebben gehad in de zin van
      [artikel 8, onderdelen a tot en met e, of l, van de Vreemdelingenwet 2000][ref1] en voor de beëindiging van dit
      verblijf een aanvraag heeft ingediend tot het verlenen van een verblijfsvergunning;

      b. binnen de termijn, genoemd in [artikel 69, eerste lid, van de Vreemdelingenwet 2000][ref2], of,
      buiten die termijn, in geval [artikel 6:11 van de Algemene wet bestuursrecht][ref3] toepassing heeft
      gevonden, bezwaar heeft gemaakt of beroep heeft ingesteld tegen intrekking van de toelating in de zin van
      [artikel 8, onderdelen a tot en met e, of l, van de Vreemdelingenwet 2000][ref4], na rechtmatig in Nederland
      verblijf te hebben gehad; of

      c. in afwachting is van de beslissing op een aanvraag tot het verlenen van een verblijfsvergunning regulier voor
      bepaalde tijd, bedoeld in [artikel 14 van de Vreemdelingenwet 2000][ref5], onder een beperking verband houdend met
      tijdelijke humanitaire gronden, omdat de vreemdeling zonder verblijfstitel slachtoffer is geworden van huiselijk
      geweld of slachtoffer is of dreigt te worden van eergerelateerd geweld en op grond daarvan rechtmatig verblijf
      heeft in de zin van [artikel 8, onderdeel f, van de Vreemdelingenwet 2000][ref6].

      2 De gelijkstelling, bedoeld in het eerste lid, eindigt zodra:

      a. onherroepelijk op de aanvraag, het bezwaar of het beroep is beslist;

      b. de uitzetting van de vreemdeling is gelast, tenzij die uitzetting ingevolge de [Vreemdelingenwet 2000][ref7] of
      op grond van een rechterlijke beslissing achterwege dient te blijven; of

      c. het rechtmatig verblijf, onverminderd de onderdelen a en b, op grond van
      [artikel 8, onderdeel f, van de Vreemdelingenwet 2000][ref8] is geëindigd.


