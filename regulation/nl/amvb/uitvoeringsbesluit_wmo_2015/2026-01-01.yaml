  - number: '5.1'
    text: |-
      1 Het college neemt in een overeenkomst met betrekking tot het leveren van maatwerkvoorzieningen op, dat de
      aanbieder in overleg treedt met de aanbieder of aanbieders die in opdracht van het college laatstelijk voor hem
      dan wel na hem die maatwerkvoorzieningen hebben verleend dan wel gaan verlenen, over de overname van de betrokken
      hulpverleners.

      2 Het college verleent een opdracht voor het leveren van maatwerkvoorzieningen ten minste drie maanden voor de
      ingangsdatum van die opdracht.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel5.1
  - number: '5.2'
    text: |-
      1 Teneinde te komen tot de afspraken, bedoeld in [artikel 5.4.1, tweede lid, van de wet][ref1], nodigt het college,
      zo veel als mogelijk in samenwerking met andere colleges in de regio, de in die regio werkzame zorgverzekeraars
      periodiek uit voor overleg.

      2 Indien het college en de zorgverzekeraars gezamenlijk oordelen dat dit met het oog op het
      maken van goede afspraken wenselijk is, nodigt het college ook andere in de regio op de in
      [artikel 5.4.1, tweede lid, van de wet][ref2] genoemde terreinen werkzame organisaties en instanties uit voor
      overleg. Artikel 5.4.1, eerste, tweede en vierde lid, van de wet is op deze organisaties en instanties van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel5.4.1
      [ref2]: https://wetten.overheid.nl/BWBR0035362#Artikel5.4.1
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel5.2
