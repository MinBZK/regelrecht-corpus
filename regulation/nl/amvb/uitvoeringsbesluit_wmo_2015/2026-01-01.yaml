  - number: 4a.1.3
    text: |-
      1 Het UWV kan, in afwijking van de [artikelen 4a.1.1][ref1] en [4a.1.2][ref2], zonder aanvraag ambtshalve
      noodzakelijke tolkdiensten toekennen aan:

      a. instellingen als bedoeld in [artikel 3a.1.1, tweede lid, van de wet][ref3]; of

      b. een persoon, bedoeld in [artikel 3a.1.1, tweede lid, van de wet][ref4]:

      1°. in spoedeisende gevallen;

      2°. indien de onverkorte toepassing van [artikel 4a.1.1][ref5] leidt tot onbillijkheden van overwegende aard.

      2 De ambtshalve toekenning bedoeld in het eerste lid kan ook betrekking hebben op vreemdelingen als bedoeld in
      [artikel 1 van de Vreemdelingenwet 2000][ref6].


