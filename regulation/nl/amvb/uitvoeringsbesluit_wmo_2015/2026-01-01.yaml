      2 De termijnen, bedoeld in de [artikelen 4.1.4][ref3] en [4.1.5][ref4], kunnen bij besluit van Onze Ministers
      worden gewijzigd, indien het in het belang van de continuïteit van de werktoedeling noodzakelijk is.

      3 De besluiten, bedoeld in het eerste en tweede lid, worden bekend gemaakt in de Staatscourant.


