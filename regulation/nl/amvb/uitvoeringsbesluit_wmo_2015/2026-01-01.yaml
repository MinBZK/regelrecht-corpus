  - number: '3.6'
    text: |-
      1 De bijdrage wordt zo spoedig mogelijk herzien na het tijdstip waarop het CAK of een andere instantie als bedoeld
      in [artikel 2.1.4b, tweede lid, van de wet][ref1] in kennis is gesteld van de omstandigheid die aanleiding geeft
      tot de wijziging.

      2 De bijdrage is verschuldigd of wordt gerestitueerd over ten hoogste 36 maanden voor de maand waarin het besluit,
      waarmee de bijdrage is herzien, aan de cliënt is verzonden.

      3 De herziene bijdrage wordt voor zover mogelijk verrekend met de eerder vastgestelde bijdrage.

      4 De termijn van 36 maanden als bedoeld in het tweede lid, waarover een eigen bijdrage verschuldigd is, kan worden
      verkort naar 12 maanden indien het CAK van oordeel is dat het verzuim om de bijdrage te herzien voorafgaand aan de
      laatstgenoemde termijn:

      a. het gevolg is van een ernstige tekortkoming of ernstige vertraging in de gegevensuitwisseling of verwerking
      daarvan die noodzakelijk is voor het herzien van de bijdrage; en

      b. de tekortkoming of vertraging, bedoeld onder a, niet aan de cliënt te wijten is.

      5 Uit eigen beweging of op aanvraag van de cliënt kan, bij het voordoen van de situatie, bedoeld in het vierde lid,
      het CAK de termijn inkorten tot maximaal een maand of besluiten dat de bijdrage niet verschuldigd is in bijzondere
      of voor de cliënt verzwarende omstandigheden.

      6 In afwijking van het tweede lid, kan het CAK uit eigen beweging of op aanvraag van de cliënt, een eigen bijdrage
      herzien en restitueren over meer dan 36 maanden, indien het CAK van oordeel is dat het verzuim om de bijdrage te
      herzien:

      a. het gevolg is van een ernstige tekortkoming of vertraging in de vaststelling van de gegevens, de
      gegevensuitwisseling of de verwerking daarvan die noodzakelijk zijn voor het herzien van de bijdrage; en

      b. de tekortkoming of vertraging, bedoeld onder a, niet aan de verzekerde te wijten is.

      7 De aanvraag, bedoeld in het zesde lid, wordt gedaan uiterlijk 5 jaar na het bekend worden bij de cliënt van een
      omstandigheid die aanleiding geeft tot herziening van de bijdrage.

      8 Onverminderd het zesde lid, wordt voor zover de bevoegdheid tot herziening van de bijdrage over een maand is
      vervallen op grond van het tweede, vierde of vijfde lid, de over die periode eerder vastgestelde bijdrage van
      rechtswege definitief.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2.1.4b
