  - number: '3.19'
    text: |-
      1 Bij de berekening van de bijdrage wordt afwezigheid uit de instelling voor beschermd wonen, anders dan in verband
      met beëindiging van de levering of het beëindigen van het persoonsgebonden budget, buiten beschouwing gelaten.

      2 Over een gedeelte van een maand is de bijdrage gelijk aan het vastgestelde bedrag per maand, vermenigvuldigd met
      twaalf maal het aantal dagen waarover de bijdrage binnen die maand verschuldigd is en gedeeld door 365.

      3 Van de voor gehuwde cliënten gezamenlijk berekende bijdrage is ieder van de echtgenoten een gedeelte verschuldigd
      naar rato van ieders aandeel in het inkomen.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.19
  - number: '3.20'
    text: |-
      1 De hoogte van de bijdrage, bedoeld in [artikel 3.1, vierde lid][ref1], is zodanig dat de cliënt na afdracht van
      de bijdrage, van zijn bijdrageplichtig inkomen, bedoeld in [artikel 3.9, eerste lid][ref2], omgerekend naar een
      maand, een bedrag overhoudt dat overeenkomt met het zak- en kleedgeld, vermeerderd met de standaardpremie, bedoeld
      in [artikel 1, eerste lid, onderdeel g, van de Wet op de zorgtoeslag][ref3] en gecorrigeerd met de zorgtoeslag.

      2 De bijdrage, bedoeld in het eerste lid, is niet verschuldigd indien de cliënt of zijn echtgenoot gedurende twee
      of meer nachten aaneengesloten een maand in een instelling voor beschermd wonen verblijft.


      [ref1]: https://wetten.overheid.nl/BWBR0035733#Artikel3.1
      [ref2]: https://wetten.overheid.nl/BWBR0035733#Artikel3.9
