  - number: '3.2'
    text: |-
      1 Het vermogen van een persoon is zijn vermogensgrondslag, bedoeld in het tweede of derde lid, waarvan op aanvraag
      van de persoon wordt afgetrokken het bedrag ter grootte van door de persoon in het peiljaar of enig eerder jaar
      ontvangen eenmalige uitkeringen die bij ministeriële regeling van Onze Minister of Onze Minister van Financiën
      krachtens [artikel 47 van de Algemene wet inkomensafhankelijke regelingen][ref1] zijn aangewezen, met dien
      verstande dat het vermogen ten minste nihil bedraagt.

      2 De vermogensgrondslag van een persoon is zijn rendementsgrondslag aan het begin van het peiljaar
      voor zover die rendementsgrondslag meer bedraagt dan het voor dat jaar van toepassing zijnde bedrag in
      [artikel 9.4, eerste lid, onderdeel c, van de Wet inkomstenbelasting 2001][ref2].

      3 In afwijking van het tweede lid is de vermogensgrondslag van een persoon in geval
      [artikel 3.14, tweede lid][ref3], of [artikel 3.16][ref4] van toepassing is, de te verwachten rendementsgrondslag
      over het lopende jaar voor zover die rendementsgrondslag meer bedraagt dan het van toepassing zijnde bedrag in
      [artikel 9.4, eerste lid, onderdeel c, van de Wet inkomstenbelasting 2001][ref5].

      4 Het deel van het bedrag, bedoeld in het eerste lid, dat de vermogensgrondslag van de persoon overtreft, wordt
      voor zijn echtgenoot als vermindering toegepast.

      5 Bij ministeriële regeling kan een periode worden vastgesteld gedurende welke het bedrag van een uitkering als
      bedoeld in het eerste lid, kan worden afgetrokken, welke periode kan verschillen per uitkering.


