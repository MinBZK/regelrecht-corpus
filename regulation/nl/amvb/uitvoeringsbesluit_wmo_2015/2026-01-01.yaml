  - number: '3.10'
    text: |-
      1 Indien ten aanzien van de ongehuwde cliënt of de gehuwde cliënt en diens echtgenoot geen voor de vaststelling
      van de bijdrage benodigde gegevens inzake het inkomen en de rendementsgrondslag beschikbaar zijn, wordt de bijdrage
      vastgesteld op het bedrag, bedoeld in [artikel 2.1.4, derde lid][ref1], of [2.1.4a, vierde lid, van de wet][ref2],
      of, indien een verordening als bedoeld in [artikel 3.8, tweede lid][ref3], geldt, wordt de bijdrage op nihil
      gesteld.

      2 Indien na de vaststelling van de bijdrage uit alsnog beschikbaar gekomen gegevens inzake het inkomen of
      de rendementsgrondslag, of uit een wijziging van deze gegevens, blijkt dat de bijdrage op onjuist bedrag is
      vastgesteld, herziet het CAK de bijdrage met inachtneming van de beschikbaar gekomen gegevens dan wel van die
      wijziging.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2.1.4
