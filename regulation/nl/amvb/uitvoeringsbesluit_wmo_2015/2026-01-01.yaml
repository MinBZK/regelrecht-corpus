articles:
  - number: '1.1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

        - *belasting:* 1°. indien over het peiljaar een aanslag of navorderingsaanslag
      inkomstenbelasting is of wordt vastgesteld: de over dat jaar verschuldigde inkomstenbelasting,
      bedoeld in [artikel 2.7 van de Wet inkomstenbelasting 2001][ref1], vermeerderd
      met de over dat jaar verschuldigde premie voor de volksverzekeringen, bedoeld in
      [artikel 9 van de Wet financiering sociale verzekeringen][ref2]; 2°. in de overige gevallen: het inkomensgegeven,
      bedoeld in [artikel 21, onderdeel e, onder 2°, van de Algemene wet inzake rijksbelastingen][ref3];
        - *bijdrage:* bijdrage in de kosten van een maatwerkvoorziening of een persoonsgebonden budget;
        - *grondslag sparen en beleggen:* grondslag sparen en beleggen, bedoeld in
      [artikel 5.2, eerste lid, van de Wet inkomstenbelasting 2001][ref4];
        - *inkomen:* 1°. indien over het peiljaar een aanslag of navorderingsaanslag
      inkomstenbelasting is of wordt vastgesteld: het inkomensgegeven, bedoeld in
      [artikel 21, onderdeel e, onder 1°, van de Algemene wet inzake rijksbelastingen][ref5];
      2°. in de overige gevallen: het inkomensgegeven, bedoeld in
      [artikel 21, onderdeel e, onder 2°, van de Algemene wet inzake rijksbelastingen][ref6];
        - *peiljaar:* tweede kalenderjaar voorafgaande aan het kalenderjaar waarvoor een bijdrage wordt vastgesteld;
        - *pensioengerechtigde leeftijd:* de pensioengerechtigde leeftijd als bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref7];
        - *rendementsgrondslag :* rendementsgrondslag, bedoeld in
      [artikel 5.3, eerste lid, van de Wet inkomstenbelasting 2001][ref8];
        - *standaardpremie:* het bedrag als bedoeld in
      [artikel 1, eerste lid, onderdeel g, van de Wet op de zorgtoeslag][ref9];
        - *vermogen:* vermogen als bedoeld in [artikel 3.2][ref10];
        - *vermogensinkomensbijtelling:* bijtelling van het vermogen als bedoeld in [artikel 3.2a][ref11];
        - *wet:* [Wet maatschappelijke ondersteuning 2015][ref12];
        - *zak- en kleedgeld:* bedrag als bedoeld in [artikel 23, eerste lid, van de Participatiewet][ref13];
        - *zorgtoeslag:* tegemoetkoming als bedoeld in [artikel 1 van de Wet op de zorgtoeslag][ref14];
        - *zorgverzekering:* verzekering als bedoeld in [artikel 1, onderdeel d, van de Zorgverzekeringswet][ref15].


