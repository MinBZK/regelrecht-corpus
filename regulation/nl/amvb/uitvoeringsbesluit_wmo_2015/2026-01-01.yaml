  - number: '5.4'
    text: |-
      1 Bij verordening als bedoeld in [artikel 2.6.6, eerste lid, van de wet][ref1] wordt aandacht besteed aan de wijze
      waarop tariefdifferentiatie wordt bevorderd en wordt geregeld dat de prijs voor een dienst ten minste is gebaseerd
      op de volgende kostprijselementen:

      a. de kosten van de beroepskracht;

      b. redelijke overheadkosten;

      c. kosten voor niet productieve uren van de beroepskrachten als gevolg van verlof, ziekte, scholing, werkoverleg;

      d. reis en opleidingskosten;

      e. indexering van de prijs voor het leveren van een dienst; en

      f. overige kosten als gevolg van door de gemeente gestelde verplichtingen voor aanbieders waaronder
      rapportageverplichtingen en administratieve verplichtingen.

      2 Bij ministeriële regeling kunnen regels worden gesteld over de indexering, bedoeld in het eerste lid, onderdeel
      e.

      3 Het eerste lid geldt voor een subsidie slechts voor zover zij wordt verstrekt voor het daadwerkelijk verrichten
      van diensten voor cliënten en met de subsidie wordt beoogd de te subsidiëren diensten volledig te bekostigen.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2.6.6
