  - number: 4.1.7
    text: |-
      1 Veilig Thuis start binnen vijf dagen na ontvangst van een melding, nadat is vastgesteld dat onderzoek moet
      plaatsvinden, het onderzoek naar kindermishandeling of huiselijk geweld.

      2 Veilig Thuis oordeelt zo spoedig mogelijk, doch uiterlijk binnen tien weken na de vaststelling, bedoeld in het
      eerste lid, of, en zo ja, tot welke stappen een onderzoek aanleiding geeft.

      3 Bij regeling van Onze Minister en Onze Minister van Veiligheid en Justitie kunnen nadere regels worden gesteld
      over de wijze van besluitvorming door Veilig Thuis.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.1.7
  - number: 4.1.8
    text: |-
      1 In dit artikel wordt onder betrokkene verstaan degene die advies vraagt, degene die een melding doet, degene op
      wie een melding betrekking heeft of degene aan wie om informatie wordt verzocht in het kader van een onderzoek naar
      aanleiding van een melding.

      2 Veilig Thuis verschaft aan iedere betrokkene bij het eerste contact informatie over:

      a. de procedure met betrekking tot een advies, melding of onderzoek;

      b. met inachtneming van de [artikelen 4.2.12][ref1], [5.1.6][ref2] en [5.3.1 van de wet][ref3]:

      1°. de verwerking van persoonsgegevens; en

      2°. het recht op inzage in of afschrift van de hem betreffende bescheiden; en

      c. de wijze van behandeling van klachten.

      3 Veilig Thuis verstrekt geen inlichtingen over de herkomst van persoonsgegevens die het naar aanleiding van een
      melding heeft verkregen indien:

      a. een persoon die in een beroepsmatige, hulpverlenende of pedagogische relatie tot het slachtoffer of het
      vermoedelijke slachtoffer of zijn huiselijke kring staat, de persoonsgegevens naar aanleiding van een melding heeft
      verstrekt en het verstrekken van die inlichtingen:

      1°. een bedreiging vormt of kan vormen voor het slachtoffer of het vermoedelijke slachtoffer of zijn huiselijke
      kring;

      2°. een bedreiging vormt of kan vormen voor de persoon, bedoeld onder a, of medewerkers van die persoon, of

      3°. leidt of kan leiden tot een ernstige verstoring van de vertrouwensrelatie met de huiselijke kring waartoe het
      slachtoffer of het vermoedelijke slachtoffer behoort;

      b. het andere personen betreft dan die bedoeld onder a, behoudens voor zover zij daarvoor toestemming hebben
      gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel4.2.12
      [ref2]: https://wetten.overheid.nl/BWBR0035362#Artikel5.1.6
      [ref3]: https://wetten.overheid.nl/BWBR0035362#Artikel5.3.1
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.1.8
