  - number: '3.5'
    text: |-
      1 De bijdrage, bedoeld in [artikel 3.1, tweede lid][ref1], wordt zo spoedig mogelijk vastgesteld door het CAK
      nadat de gegevens, bedoeld in [artikel 3.3, vierde lid, onderdelen a of b][ref2], voor zover het inkomensgegevens
      of een kennisgeving betreft met de dag dat een bij verordening aangewezen algemene voorziening, bedoeld in
      [artikel 2.1.4, derde lid][ref3], of een maatwerkvoorziening is verstrekt of een persoonsgebonden budget is
      verleend, door het CAK zijn ontvangen.

      2 De bijdrage, bedoeld in [artikel 3.1, derde lid][ref4], wordt zo spoedig mogelijk vastgesteld nadat de
      gegevens, bedoeld in [artikel 3.3, vierde lid, onderdelen a en b][ref5], voor zover het de inkomensgegevens en
      een kennisgeving met de dag dat een maatwerkvoorziening is verstrekt of een persoonsgebonden budget is verleend
      betreft, door het CAK zijn ontvangen.

      3 De bijdrage, bedoeld in [artikel 3.1, vierde lid][ref6], wordt zo spoedig mogelijk vastgesteld nadat de
      gegevens, bedoeld in [artikel 3.3, vierde lid, onderdelen a en b][ref7], voor zover het de inkomensgegevens en
      een kennisgeving met de dag dat een maatwerkvoorziening is verstrekt of een persoonsgebonden budget is verleend
      betreft, door de instantie, bedoeld in [artikel 2.1.4b, tweede lid, van de wet][ref8], zijn ontvangen.

      4 De bijdrage, bedoeld in het eerste lid, is verschuldigd met ingang van de maand na het ingangstijdstip dat
      het CAK van het college bij kennisgeving heeft ontvangen of, indien dat tijdstip op de eerste dag van de maand
      valt, met ingang van de maand waarin het ingangstijdstip valt dat het CAK van het college bij kennisgeving heeft
      ontvangen, doch ten hoogste over de 12 maanden die voorafgaan aan de maand waarin het besluit, waarmee de bijdrage
      is vastgesteld, aan de cliënt is verzonden.

      5 De bijdrage, bedoeld in het tweede lid, is verschuldigd met ingang van de maand waarin de maatwerkvoorziening is
      verstrekt of waarin het persoonsgebonden budget is verleend doch ten hoogste over de 12 maanden die voorafgaan aan
      de maand waarin het besluit, waarmee de bijdrage is vastgesteld, aan de cliënt is verzonden.

      6 De bijdrage, bedoeld in het derde lid, is verschuldigd met ingang van de maand dat de instantie, bedoeld in
      [artikel 2.1.4b, tweede lid, van de we][ref9]t van het college heeft ontvangen waarin de maatwerkvoorziening is
      verstrekt of waarin het persoonsgebonden budget is verleend doch ten hoogste over de 12 maanden die voorafgaan aan
      de maand waarin het besluit, waarmee de bijdrage is vastgesteld, aan de cliënt is verzonden.

      7 Uit eigen beweging door het CAK of op aanvraag van de cliënt kan, in afwijking van het vierde en vijfde lid,
      de termijn waarover de bijdrage is verschuldigd worden ingekort tot maximaal een maand of worden besloten dat de
      bijdrage niet verschuldigd is, indien het CAK van oordeel is dat het verzuim om de bijdrage op te leggen:

      a. het gevolg is van een ernstige tekortkoming of vertraging in de gegevensuitwisseling of verwerking daarvan die
      noodzakelijk is voor het vaststellen van de bijdrage;

      b. de tekortkoming of vertraging, bedoeld onder a, niet aan de cliënt te wijten is; en

      c. zich bijzondere of verzwarende omstandigheden voordoen voor de cliënt.


