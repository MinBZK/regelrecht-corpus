  - number: 4.2.1
    text: |-
      In deze paragraaf wordt onder «personen die bij een melding aan Veilig Thuis betrokken zijn» verstaan jeugdigen,
      ouders of pleegouders die een melding doen, op wie een melding betrekking heeft of aan wie in het kader van een
      onderzoek naar aanleiding van een melding informatie wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.2.1
  - number: 4.2.2
    text: |-
      De informatie die Veilig Thuis aan personen die bij een melding aan Veilig Thuis betrokken zijn, verstrekt over
      de mogelijkheid gebruik te maken van de diensten van een vertrouwenspersoon, bestaat in ieder geval uit informatie
      over:

      a. de onafhankelijke rol van de vertrouwenspersoon;

      b. de aard van de ondersteuning door een vertrouwenspersoon;

      c. de vertrouwelijkheid van die ondersteuning;

      d. het feit dat de ondersteuning kosteloos is, en

      e. de bereikbaarheid en beschikbaarheid van de vertrouwenspersoon.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.2.2
  - number: 4.2.3
    text: |-
      De vertrouwenspersoon behoeft geen toestemming van derden om met personen die bij een melding aan Veilig Thuis
      betrokken zijn, te spreken.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.2.3
  - number: 4.2.4
    text: |-
      Veilig Thuis verschaft aan de vertrouwenspersoon de faciliteiten die deze voor een juiste uitoefening van zijn taak
      nodig heeft.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.2.4
  - number: 4.2.5
    text: |-
      De vertrouwenspersoon heeft vrije toegang tot de gebouwen waar Veilig Thuis zijn werkzaamheden uitoefent, een en
      ander voor zover dit voor een juiste uitoefening van zijn taak nodig is.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.2.5
  - number: 4.2.6
    text: |-
      Onverminderd het bij of krachtens de wet bepaalde verschaft Veilig Thuis aan de vertrouwenspersoon alle
      inlichtingen en toont hem alle bescheiden die deze voor een juiste uitoefening van zijn taak nodig heeft.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.2.6
  - number: 4.3.1
    text: |-
      1 De structurele verstrekking van gegevens, bedoeld in [artikel 4.2.12, eerste lid, van de wet][ref1], vindt plaats
      op elektronische wijze aan het Centraal Bureau voor de Statistiek.

      2 Onze Minister, Onze Minister van Veiligheid en Justitie en het college vragen geen gegevens uit ten behoeve van
      de doelen, bedoeld in [artikel 4.2.12, eerste lid van de wet][ref2], indien zij of het Centraal Bureau voor de
      Statistiek reeds over deze gegevens beschikken en deze gegevens gebruikt kunnen worden ten behoeve van deze doelen.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel4.2.12
      [ref2]: https://wetten.overheid.nl/BWBR0035362#Artikel4.2.12
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.3.1
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: 4.2.12
      - id: ref2
        bwb_id: BWBR0035362
        artikel: 4.2.12
  - number: 4.3.2
    text: |-
      1 De structurele verstrekking van gegevens, bedoeld in [][ref1]

      [artikel 4.2.12, eerste lid, van de wet][ref2], betreft:

      a. het aantal gegeven adviezen, uitgesplitst naar kindermishandeling en de aard van het huiselijk geweld;

      b. het aantal ontvangen meldingen uitgesplitst naar huiselijk geweld enerzijds en kindermishandeling anderzijds,
      inclusief het burgerservicenummer, de geboortedatum en het geslacht van degene over wie een melding is gedaan;

      c. het aantal verrichte onderzoeken uitgesplitst naar huiselijk geweld enerzijds en kindermishandeling anderzijds,
      inclusief de burgerservicenummers van degenen over wie een melding is gedaan;

      d. de hoedanigheid van de persoon die contact opnam met het advies- en meldpunt huiselijk geweld en
      kindermishandeling;

      e. de datum van de melding;

      f. de datum van de start van het onderzoek;

      g. de datum van afronding van het onderzoek;

      h. de uitkomst van de verrichte onderzoeken met inbegrip van, indien van toepassing, de aard van het geweld of de
      mishandeling; en

      i. het vervolgtraject na afronding van het onderzoek.

      2 Een incidentele verstrekking van gegevens uit hoofde van [artikel 4.2.12, eerste lid, van de wet][ref3] betreft
      geen persoonsgegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel4.2.12
      [ref2]: https://wetten.overheid.nl/BWBR0035362#Artikel4.2.12
      [ref3]: https://wetten.overheid.nl/BWBR0035362#Artikel4.2.12
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.3.2
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: 4.2.12
      - id: ref2
        bwb_id: BWBR0035362
        artikel: 4.2.12
      - id: ref3
        bwb_id: BWBR0035362
        artikel: 4.2.12
  - number: 4.3.3
    text: |-
      1 Bij regeling van Onze Minister en Onze Minister van Veiligheid en Justitie wordt voor het verstrekken van de
      gegevens, bedoeld in [artikel 4.2.12, eerste lid, van de wet][ref1], bepaald:

      a. welke gegevens worden verstrekt alsmede, voor zover nodig, een nadere omschrijving van deze gegevens;

      b. de wijze waarop de gegevens worden verstrekt;

      c. de tijdvakken waarop de gegevens die worden verstrekt betrekking hebben;

      d. de termijnen waarbinnen of de tijdstippen waarop de gegevens worden verstrekt.

      2 Bij de regeling, bedoeld in het eerste lid, wordt een informatieprotocol vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel4.2.12
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.3.3
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: 4.2.12
  - number: 4a.1.1
    text: |-
      1 Een ingezetene als bedoeld in [artikel 3a.1.1, eerste lid, van de wet][ref1], heeft, na aanvraag bij het
      UWV, recht op vergoeding van een bij ministeriële regeling vastgesteld aantal uren aan tolkdiensten over bij
      ministeriële regeling vast te stellen perioden.

      2 In afwijking van het ten hoogste beschikbare aantal uren, bedoeld in het eerste lid, kunnen meer uren door
      het UWV worden toegekend voor tolkdiensten bij activiteiten die in het belang zijn voor de deelname aan het
      maatschappelijke verkeer, indien:

      a. de ingezetene, bedoeld in het eerste lid, een onderbouwde aanvraag indient bij het UWV voor ondersteuning; en

      b. naar het oordeel van het UWV het aangevraagde aantal aanvullende uren in redelijke verhouding staat tot de
      bijdrage aan de mogelijkheden van de ingezetene, bedoeld in het eerste lid, tot deelname aan het maatschappelijk
      verkeer.

      3 De vergoeding, bedoeld in het eerste en tweede lid, wordt toegekend indien de ingezetene een
      verklaring heeft van de huisarts of behandeld medisch specialist, waaruit blijkt dat deze ingezetene
      op deze tolkdiensten is aangewezen. Deze verklaring wordt eenmalig gevraagd, tenzij het UWV op grond
      van [artikel 73a van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2] deze al heeft
      verkregen voor de uitvoering van aan het UWV opgedragen taken. Bij de uitvoering van dit artikel is het
      UWV bevoegd de verklaring te gebruiken, die het UWV heeft verkregen voor de uitvoering van aanspraken
      op tolkvoorzieningen op grond van de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref3],
      de [Wet werk en inkomen naar arbeidsvermogen][ref4], de [Wet overige OCW-subsidies][ref5] en de
      [Participatiewet][ref6].

      4 Het aantal toegekende uren, bedoeld in het eerste lid, kan verschillen per tolkvoorziening, waaronder
      tolkdiensten met behulp van telecommunicatiemiddelen, of per te onderscheiden doelgroep, waarbij in ieder geval
      wordt onderscheiden diegenen die zowel een auditieve als een visuele beperking hebben.

      5 De op grond van het tweede lid toegekende uren worden verrekend met de resterende uren waarop de ingezetene,
      bedoeld in het eerste lid, reeds recht heeft op grond van dat lid.

      6 Bij ministeriële regeling kunnen regels gesteld worden over:

      a. de gegevens die bij een aanvraag moeten worden ingediend;

      b. de declaratie van een vergoeding voor tolkvoorzieningen per tolkvoorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel3a.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel73a
