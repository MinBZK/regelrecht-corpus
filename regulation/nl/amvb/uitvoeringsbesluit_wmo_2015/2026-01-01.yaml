  - number: 4.1.2
    text: |-
      1 Het college draagt er zorg voor dat ten behoeve van Veilig Thuis voldoende deskundigheid beschikbaar is op het
      gebied van huiselijk geweld en kindermishandeling. Hiervoor is in ieder geval een arts met deskundigheid op het
      gebied van kindermishandeling beschikbaar.

      2 Het college waarborgt de onafhankelijke uitvoering van de taak van Veilig Thuis, bedoeld in
      [artikel 4.1.1, tweede lid, onderdeel b, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel4.1.1
