  - number: '3.7'
    text: |-
      1 Bij ministeriële regeling worden de bedragen, genoemd in de [3.9, tweede en vierde lid][ref1],
      [3.11, tweede lid][ref2], [3.12, derde lid][ref3], en [artikel 3.14, tweede en vierde lid][ref4], jaarlijks
      gewijzigd aan de hand van de prijsindex voor de gezinsconsumptie. De berekende bedragen worden naar beneden
      afgerond op een veelvoud van € 0,2. Bij de jaarlijkse toepassing van dit lid wordt de afronding buiten beschouwing
      gelaten.

      2 Bij ministeriële regeling als bedoeld in het eerste lid, worden de bedragen voor de toepassing van de
      [artikelen 3.9, tweede en vierde lid][ref5], [3.13, eerste lid, onderdeel b, tweede en vierde lid][ref6],
      [3.14, tweede en vierde lid][ref7], en [3.16][ref8] afzonderlijk vastgesteld voor zowel het peiljaar als het
      lopende kalenderjaar.


