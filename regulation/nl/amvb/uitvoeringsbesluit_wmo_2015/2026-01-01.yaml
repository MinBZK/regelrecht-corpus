  - number: 4a.1.2
    text: |-
      Het UWV kan tolkdiensten toekennen aan instellingen voor activiteiten die zich mede richten op auditief beperkte
      personen, indien:

      a. die instelling geen winstoogmerk heeft;

      b. de instelling gemotiveerd aantoont één of meerdere activiteiten te organiseren waarbij personen met een
      auditieve beperking ook tot de doelgroep behoren; en

      c. de tolkdiensten passender door middel van een toekenning aan een instelling kunnen worden vergoed dan per
      ingezetene op grond van [artikel 4a.1.1, eerste of tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035733#Artikel4a.1.1
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4a.1.2
