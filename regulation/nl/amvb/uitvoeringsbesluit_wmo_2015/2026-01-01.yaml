      maand die voorafgaand is aan de maand waarin het besluit, waarmee een herziening is vastgesteld als bedoeld in
      artikel 3.6, aan de cliënt is verzonden, uiterlijk in de maand volgend op de maand waarin het besluit waarmee een
      herziening is vastgesteld als bedoeld in [artikel 3.6][ref2], aan de cliënt is verzonden;


