  - number: '3.18'
    text: |-
      1 De hoogte van de bijdrage wordt jaarlijks opnieuw berekend voor de periode van de eerste dag van januari tot en
      met de eenendertigste dag van de daaropvolgende maand december.

      2 In afwijking van [artikel 3.17, eerste lid][ref1], geldt, indien het inkomen bij de jaarlijkse herziening
      nog moet worden vastgesteld, als bijdrage, de bijdrage die over de laatste maand in het vorige kalenderjaar
      verschuldigd was.


      [ref1]: https://wetten.overheid.nl/BWBR0035733#Artikel3.17
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.18
