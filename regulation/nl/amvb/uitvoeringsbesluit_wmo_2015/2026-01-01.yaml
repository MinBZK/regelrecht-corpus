  - number: 3.10b
    text: |-
      1 Het college ziet toe op het niet overschrijden van de kostprijs van een hulpmiddel of woningaanpassing, bedoeld
      in [artikel 2.1.4a, zesde lid, van de wet][ref1], aan de hand van de totale kostprijs.

      2 Indien het college het CAK in kennis stelt van de totale kostprijs, bedoeld in het eerste lid, ziet het CAK voor
      het college toe op het niet overschrijden van die kostprijs.

      3 Bij het bepalen of de kostprijs niet wordt overschreden, wordt door het CAK, in afwijking van
      [artikel 3.8, tweede en vierde lid][ref2], het bedrag, bedoeld in [artikel 2.1.4 derde lid][ref3], of
      [2.1.4a, vierde lid van de wet][ref4], elke maand in mindering gebracht op de kostprijs.

      4 Het CAK gaat bij een samenloop van meerdere voorzieningen voor een cliënt uit van de kostprijs van één door
      het college aangewezen voorziening. Het college geeft aan bij welke voorziening het CAK toeziet op het niet
      overschrijden van de kostprijs, bedoeld in het eerste lid.

      5 Indien de totale kostprijs wordt bereikt geeft het CAK daarvan onmiddellijk kennis aan het college.

      6 Het CAK staakt de inning van de bijdrage nadat het college om staking van de inning heeft verzocht. Als de
      resterende totale kostprijs lager is dan de verschuldigde bijdrage per maand wordt die bijdrage niet geïnd.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2.1.4a
