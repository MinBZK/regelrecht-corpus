      1 Dit hoofdstuk is van toepassing op bijdragen als bedoeld in de [artikelen 2.1.4, derde lid][ref1],
      [2.1.4a, eerste lid][ref2],[ 2.1.5][ref3], en [8.4, tweede lid, van de wet][ref4].

      2 [Paragraaf 2][ref5] is, tenzij[ paragraaf 3][ref6] of [4][ref7] van toepassing is, van toepassing op
      bijdragen voor aangewezen algemene voorzieningen, bedoeld in [artikel 2.1.4, derde lid van de wet][ref8],
      maatwerkvoorzieningen en persoonsgebonden budgetten.

      3 [Paragraaf 3][ref9] is van toepassing op bijdragen:

      1°. voor een maatwerkvoorziening of persoonsgebonden budget voor beschermd wonen; en

      2°. krachtens [artikel 8.4, tweede lid, van de wet][ref10].

      4 [Paragraaf 4][ref11] is van toepassing op bijdragen voor een maatwerkvoorziening of persoonsgebonden budget voor
      opvang.

      5 Dit hoofdstuk berust mede op de [artikelen 2.1.4, vierde lid][ref12],
      [2.1.4a, derde, vierde, vijfde en zevende lid][ref13], en [2.1.4b, derde lid, van de wet][ref14].


