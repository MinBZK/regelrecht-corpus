        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0035362
        artikel: '2'
  - number: 3.3.2
    text: |-
      Het CAK is bevoegd tot verrekening van vorderingen krachtens de wet van of op de cliënt met vorderingen van
      of op de cliënt krachtens de [Wet langdurige zorg][ref1], de [Wet maatschappelijke ondersteuning][ref2] en de
      [Algemene Wet Bijzondere Ziektekosten][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0035917
      [ref2]: https://wetten.overheid.nl/BWBR0020031
      [ref3]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0035917
      - id: ref2
        bwb_id: BWBR0020031
      - id: ref3
        bwb_id: BWBR0002614
  - number: 3.3.3
    text: |-
      Het gemeentebestuur of een andere instantie als bedoeld in [artikel 2.1.4b, tweede lid, van de wet][ref1] is
      bevoegd tot verrekening van vorderingen krachtens de wet van of op een cliënt met vorderingen van of op deze cliënt
      krachtens de [Wet maatschappelijke ondersteuning][ref2] of de [Participatiewet][ref3]. De eerste volzin is niet van
      toepassing op de bijdrage voor opvang voor personen die de thuissituatie hebben verlaten in verband met risico’s
      voor hun veiligheid als gevolg van huiselijk geweld.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020031
      [ref3]: https://wetten.overheid.nl/BWBR0015703
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020031
      - id: ref3
        bwb_id: BWBR0015703
  - number: 3.3.4
    text: |-
      Het CAK of een andere bij verordening aangewezen instantie, ingeval het de bijdrage, bedoeld in
      [artikel 3.1, vierde lid][ref1], betreft, maakt, indien van toepassing, voor de vaststelling van de bijdrage,
      bedoeld in artikel 3.1, tweede lid, voor zover [artikel 3.8][ref2], [3.9, tweede en vierde lid][ref3], of
      [3.14, tweede of vierde lid][ref4], is toegepast, en de bijdrage, bedoeld in artikel 3.1, derde en vierde lid,
      gebruik van:


      [ref1]: https://wetten.overheid.nl/BWBR0035733#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035733#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0035733#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0035733#Artikel3
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0035733
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0035733
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0035733
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0035733
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.3.4.a
    text: |-
      het inkomensgegeven, bedoeld in [artikel 21, onderdeel e, van de Algemene wet inzake rijksbelastingen][ref1]
      en van andere door de inspecteur, bedoeld in
      [artikel 2, derde lid, onderdeel b, van de Algemene wet inzake rijksbelastingen][ref2], verstrekte gegevens;


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel2
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '2'
  - number: 3.3.4.b
    text: |-
      gegevens van het college over de verstrekte aangewezen algemene voorziening, bedoeld in
      [artikel 2.1.4a, derde lid][ref1], de maatwerkvoorziening of het verleende persoonsgebonden budget.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '2'
  - number: 3.4.1
    text: |-
      Een wijziging in de burgerlijke staat van de cliënt en het bereiken van een voor de toepassing van dit besluit
      van belang zijnde leeftijd door de cliënt of zijn echtgenoot wordt in aanmerking genomen met ingang van de
      datum waarop de bijdrage wordt vastgesteld, met dien verstande dat bij de jaarlijkse herberekening, bedoeld in
      [artikel 3.18][ref1], een cliënt als pensioengerechtigde wordt beschouwd indien hij uiterlijk op 31 januari van het
      kalenderjaar waarop de herberekening betrekking heeft, de pensioengerechtigde leeftijd heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0035733#Artikel3
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0035733
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.4.2
    text: |-
      Een omstandigheid aangaande de cliënt of zijn echtgenoot die voor de toepassing van dit besluit van belang is
      wordt in aanmerking genomen met ingang van de maand na het ingangstijdstip dat het CAK in kennis is gesteld van
      deze omstandigheid of, indien dat tijdstip op de eerste dag van de maand valt, met ingang van de maand waarin het
      ingangstijdstip valt dat het CAK in kennis is gesteld van deze omstandigheid.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.4
  - number: 3.4.3
    text: De cliënt meldt aan het CAK wijzigingen als bedoeld in het eerste of tweede lid.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.4
  - number: 3.5.1
    text: |-
      De bijdrage, bedoeld in [artikel 3.1, tweede lid][ref1], wordt zo spoedig mogelijk vastgesteld door het CAK
      nadat de gegevens, bedoeld in [artikel 3.3, vierde lid, onderdelen a of b][ref2], voor zover het inkomensgegevens
      of een kennisgeving betreft met de dag dat een bij verordening aangewezen algemene voorziening, bedoeld in
      [artikel 2.1.4, derde lid][ref3], of een maatwerkvoorziening is verstrekt of een persoonsgebonden budget is
      verleend, door het CAK zijn ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0035733#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035733#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0035362#Artikel2
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0035733
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0035733
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0035362
        artikel: '2'
  - number: 3.5.2
    text: |-
      De bijdrage, bedoeld in [artikel 3.1, derde lid][ref1], wordt zo spoedig mogelijk vastgesteld nadat de gegevens,
      bedoeld in [artikel 3.3, vierde lid, onderdelen a en b][ref2], voor zover het de inkomensgegevens en een
      kennisgeving met de dag dat een maatwerkvoorziening is verstrekt of een persoonsgebonden budget is verleend
      betreft, door het CAK zijn ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0035733#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035733#Artikel3
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0035733
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0035733
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.5.3
    text: |-
      De bijdrage, bedoeld in [artikel 3.1, vierde lid][ref1], wordt zo spoedig mogelijk vastgesteld nadat de
      gegevens, bedoeld in [artikel 3.3, vierde lid, onderdelen a en b][ref2], voor zover het de inkomensgegevens en
      een kennisgeving met de dag dat een maatwerkvoorziening is verstrekt of een persoonsgebonden budget is verleend
      betreft, door de instantie, bedoeld in [artikel 2.1.4b, tweede lid, van de wet][ref3], zijn ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0035733#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035733#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0035362#Artikel2
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0035733
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0035733
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0035362
        artikel: '2'
  - number: 3.5.4
    text: |-
      De bijdrage, bedoeld in het eerste lid, is verschuldigd met ingang van de maand na het ingangstijdstip dat het CAK
      van het college bij kennisgeving heeft ontvangen of, indien dat tijdstip op de eerste dag van de maand valt, met
      ingang van de maand waarin het ingangstijdstip valt dat het CAK van het college bij kennisgeving heeft ontvangen,
      doch ten hoogste over de 12 maanden die voorafgaan aan de maand waarin het besluit, waarmee de bijdrage is
      vastgesteld, aan de cliënt is verzonden.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.5
  - number: 3.5.5
    text: |-
      De bijdrage, bedoeld in het tweede lid, is verschuldigd met ingang van de maand waarin de maatwerkvoorziening is
      verstrekt of waarin het persoonsgebonden budget is verleend doch ten hoogste over de 12 maanden die voorafgaan aan
      de maand waarin het besluit, waarmee de bijdrage is vastgesteld, aan de cliënt is verzonden.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.5
  - number: 3.5.6
    text: |-
      De bijdrage, bedoeld in het derde lid, is verschuldigd met ingang van de maand dat de instantie, bedoeld in
      [artikel 2.1.4b, tweede lid, van de we][ref1]t van het college heeft ontvangen waarin de maatwerkvoorziening is
      verstrekt of waarin het persoonsgebonden budget is verleend doch ten hoogste over de 12 maanden die voorafgaan aan
      de maand waarin het besluit, waarmee de bijdrage is vastgesteld, aan de cliënt is verzonden.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '2'
  - number: 3.5.7
    text: |-
      Uit eigen beweging door het CAK of op aanvraag van de cliënt kan, in afwijking van het vierde en vijfde lid, de
      termijn waarover de bijdrage is verschuldigd worden ingekort tot maximaal een maand of worden besloten dat de
      bijdrage niet verschuldigd is, indien het CAK van oordeel is dat het verzuim om de bijdrage op te leggen:
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.5
  - number: 3.5.7.a
    text: |-
      het gevolg is van een ernstige tekortkoming of vertraging in de gegevensuitwisseling of verwerking daarvan die
      noodzakelijk is voor het vaststellen van de bijdrage;
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.5
  - number: 3.5.7.b
    text: de tekortkoming of vertraging, bedoeld onder a, niet aan de cliënt te wijten is; en
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.5
  - number: 3.5.7.c
    text: zich bijzondere of verzwarende omstandigheden voordoen voor de cliënt.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.5
  - number: 3.6.1
    text: |-
      De bijdrage wordt zo spoedig mogelijk herzien na het tijdstip waarop het CAK of een andere instantie als bedoeld in
      [artikel 2.1.4b, tweede lid, van de wet][ref1] in kennis is gesteld van de omstandigheid die aanleiding geeft tot
      de wijziging.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '2'
  - number: 3.6.2
    text: |-
      De bijdrage is verschuldigd of wordt gerestitueerd over ten hoogste 36 maanden voor de maand waarin het besluit,
      waarmee de bijdrage is herzien, aan de cliënt is verzonden.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.6
  - number: 3.6.3
    text: De herziene bijdrage wordt voor zover mogelijk verrekend met de eerder vastgestelde bijdrage.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.6
  - number: 3.6.4
    text: |-
      De termijn van 36 maanden als bedoeld in het tweede lid, waarover een eigen bijdrage verschuldigd is, kan worden
      verkort naar 12 maanden indien het CAK van oordeel is dat het verzuim om de bijdrage te herzien voorafgaand aan de
      laatstgenoemde termijn:
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.6
  - number: 3.6.4.a
    text: |-
      het gevolg is van een ernstige tekortkoming of ernstige vertraging in de gegevensuitwisseling of verwerking daarvan
      die noodzakelijk is voor het herzien van de bijdrage; en
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.6
  - number: 3.6.4.b
    text: de tekortkoming of vertraging, bedoeld onder a, niet aan de cliënt te wijten is.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.6
  - number: 3.6.5
    text: |-
      Uit eigen beweging of op aanvraag van de cliënt kan, bij het voordoen van de situatie, bedoeld in het vierde lid,
      het CAK de termijn inkorten tot maximaal een maand of besluiten dat de bijdrage niet verschuldigd is in bijzondere
      of voor de cliënt verzwarende omstandigheden.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.6
  - number: 3.6.6
    text: |-
      In afwijking van het tweede lid, kan het CAK uit eigen beweging of op aanvraag van de cliënt, een eigen bijdrage
      herzien en restitueren over meer dan 36 maanden, indien het CAK van oordeel is dat het verzuim om de bijdrage te
      herzien:
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.6
  - number: 3.6.6.a
    text: |-
      het gevolg is van een ernstige tekortkoming of vertraging in de vaststelling van de gegevens, de
      gegevensuitwisseling of de verwerking daarvan die noodzakelijk zijn voor het herzien van de bijdrage; en
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.6
  - number: 3.6.6.b
    text: de tekortkoming of vertraging, bedoeld onder a, niet aan de verzekerde te wijten is.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.6
  - number: 3.6.7
    text: |-
      De aanvraag, bedoeld in het zesde lid, wordt gedaan uiterlijk 5 jaar na het bekend worden bij de cliënt van een
      omstandigheid die aanleiding geeft tot herziening van de bijdrage.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.6
  - number: 3.6.8
    text: |-
      Onverminderd het zesde lid, wordt voor zover de bevoegdheid tot herziening van de bijdrage over een maand is
      vervallen op grond van het tweede, vierde of vijfde lid, de over die periode eerder vastgestelde bijdrage van
      rechtswege definitief.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.6
  - number: 3.7.1
    text: |-
      Bij ministeriële regeling worden de bedragen, genoemd in de [3.9, tweede en vierde lid][ref1],
      [3.11, tweede lid][ref2], [3.12, derde lid][ref3], en [artikel 3.14, tweede en vierde lid][ref4], jaarlijks
      gewijzigd aan de hand van de prijsindex voor de gezinsconsumptie. De berekende bedragen worden naar beneden
      afgerond op een veelvoud van € 0,2. Bij de jaarlijkse toepassing van dit lid wordt de afronding buiten beschouwing
      gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0035733#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035733#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0035733#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0035733#Artikel3
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0035733
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0035733
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0035733
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0035733
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.7.2
    text: |-
      Bij ministeriële regeling als bedoeld in het eerste lid, worden de bedragen voor de toepassing van de
      [artikelen 3.9, tweede en vierde lid][ref1], [3.13, eerste lid, onderdeel b, tweede en vierde lid][ref2],
      [3.14, tweede en vierde lid][ref3], en [3.16][ref4] afzonderlijk vastgesteld voor zowel het peiljaar als het
      lopende kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0035733#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035733#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0035733#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0035733#Artikel3
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0035733
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0035733
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0035733
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0035733
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.8.1
    text: |-
      [Artikel 2.1.4a, vierde lid, van de wet][ref1] is niet van toepassing op een voorziening voor vervoer voor zover de
      gemeente bij verordening de hoogte van de bijdrage vaststelt.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '2'
  - number: 3.8.2
    text: |-
      Bij de verordening, bedoeld in [artikel 2.1.4, vierde lid, onderdeel b][ref1], en
      [artikel 2.1.4a, vijfde lid, onderdeel b, van de wet][ref2], kan voor onderscheidenlijk de categorieën de ongehuwde
      cliënt die de pensioengerechtigde leeftijd nog niet heeft bereikt, de ongehuwde cliënt die de pensioengerechtigde
      leeftijd heeft bereikt of de gehuwde cliënt die de pensioengerechtigde leeftijd heeft bereikt, de bijdrage op nihil
      worden gesteld indien het bijdrageplichtig inkomen van de ongehuwde cliënt of een gezamenlijk bijdrageplichtig
      inkomen van de gehuwde cliënt en zijn echtgenoot, lager is dan het per categorie vastgesteld bijdrageplichtig
      inkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0035362#Artikel2
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0035362
        artikel: '2'
  - number: 3.8.3
    text: 'De bijdrage is niet verschuldigd:'
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.8
  - number: 3.8.3.a
    text: |-
      indien de cliënt of de echtgenoot van de cliënt een bijdrage als bedoeld in [artikel 3.11][ref1] of [3.12][ref2]
      dan wel een bijdrage ingevolge de [artikelen 3.3.2.1][ref3] of [3.3.2.2 van het Besluit langdurige zorg][ref4]
      verschuldigd is;


      [ref1]: https://wetten.overheid.nl/BWBR0035733#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035733#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0035948#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0035948#Artikel3
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0035733
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0035733
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0035948
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0035948
        artikel: '3'
  - number: 3.8.3.b
    text: |-
      indien de cliënt of zijn echtgenoot gedurende twee of meer nachten aaneengesloten in de maand in een instelling
      voor opvang verblijft;
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.8
  - number: 3.8.3.c
    text: |-
      indien het college, na advies van een instelling voor algemeen maatschappelijk werk, de Raad voor de
      Kinderbescherming of Veilig Thuis, van oordeel is dat de verschuldigdheid van de bijdrage kan leiden tot
      mishandeling, verwaarlozing of ernstige schade voor de opvoeding en ontwikkeling van een minderjarige door de
      ouder, bedoeld in [artikel 1.1 van de Jeugdwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
  - number: 3.8.3.d
    text: voor een rolstoel;
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.8
  - number: 3.8.3.e
    text: |-
      voor een cliënt die de leeftijd van achttien jaar nog niet heeft bereikt, met uitzondering van een woningaanpassing
      voor zover bij verordening op grond van [artikel 2.1.5 van de wet][ref1] een ander de bijdrage verschuldigd is;


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '2'
  - number: 3.8.3.f
    text: |-
      door de gehuwde cliënt of de gehuwde cliënten tezamen, waarvan ten minste een van beiden de pensioengerechtigde
      leeftijd nog niet heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.8
  - number: 3.8.3.g
    text: |-
      indien het college van oordeel is dat er voor de vast te stellen bijdrage onvoldoende betalingscapaciteit aanwezig
      is bij de cliënt;
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.8
  - number: 3.8.3.h
    text: |-
      indien het college van oordeel is dat de verschuldigdheid van de bijdrage nadelige gevolgen heeft voor de
      doelstellingen van een integrale dienstverlening of persoonsgerichte aanpak van een cliënt die gericht is op het
      zich kunnen handhaven in de samenleving, het zo lang mogelijk in de eigen leefomgeving blijven of de veiligheid en
      leefbaarheid in de gemeente;
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.8
  - number: 3.8.3.i
    text: |-
      voor de maanden april en mei van het kalenderjaar 2020, tenzij het betreft de bijdrage voor een maatwerkvoorziening
      of persoonsgebonden budget voor beschermd wonen of opvang.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.8
  - number: 3.8.4
    text: |-
      Het college geeft onmiddellijk voor het toepassen van het derde lid, onderdelen c, g en h, bij het CAK aan over
      hoeveel maanden geen bijdrage verschuldigd is. De ingangsdatum van de maand waarover geen bijdrage verschuldigd
      is, wordt niet gesteld op een datum die is gelegen meer dan zesendertig maanden voorafgaand aan de dag waarop
      het oordeel van het college aan het CAK kenbaar is gemaakt. Een herziening van de periode waarover geen bijdrage
      verschuldigd is heeft geen betrekking op de perioden die liggen voor de ingangsdatum van de eerste maand waarover
      geen bijdrage is verschuldigd.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.8
  - number: 3.8.5
    text: |-
      Indien een cliënt een bijdrage niet verschuldigd is op grond van [artikel 3.5, zevende lid][ref1] of
      [3.6, vierde en vijfde lid, wordt het derde lid, onderdeel a][ref2], toegepast alsof de cliënt wel die bijdrage
      verschuldigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0035733#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035733#Artikel3
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0035733
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0035733
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3.8.6
    text: |-
      Het derde lid is van overeenkomstige toepassing op degenen die op grond van [artikel 2.1.5][ref1] de bijdrage
      verschuldigd zijn voor een woningaanpassing voor minderjarige cliënten.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '2'
  - number: 3.8.7
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de wijze waarop de betalingscapaciteit, bedoeld in het
      derde lid, onderdeel g, door het college wordt beoordeeld.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.8
  - number: 3.9.1
    text: |-
      Het bijdrageplichtig inkomen, bedoeld in [artikel 3.8, tweede lid][ref1] bedraagt het inkomen over het
      peiljaar van de ongehuwde cliënt, onderscheidenlijk van de gehuwde cliënten tezamen, vermeerderd met de
      vermogensinkomensbijtelling.


      [ref1]: https://wetten.overheid.nl/BWBR0035733#Artikel3
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0035733
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3.9.2
    text: |-
      Op aanvraag van de cliënt stelt het CAK voor de berekening van de verlaagde bijdrage, bedoeld in
      [artikel 3.8, tweede lid, onderdeel a][ref1], in afwijking van het eerste lid, het bijdrageplichtig inkomen
      voorlopig vast op basis van het redelijkerwijs gedurende het lopende kalenderjaar te verwachten inkomen,
      vermeerderd met de vermogensinkomensbijtelling van het verwachte vermogen in het lopende jaar, indien het
      bijdrageplichtig inkomen in het lopende jaar ten minste € 3.293,60 lager zal zijn dan het bijdrageplichtig inkomen,
      bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0035733#Artikel3
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0035733
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3.9.3
    text: |-
      De aanvraag, bedoeld in het tweede lid, wordt gedaan uiterlijk vier maanden na afloop van het kalenderjaar waarop
      de aanvraag betrekking heeft of uiterlijk vier maanden na de datum waarop de bijdrage, bedoeld in het eerste lid,
      wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.9
  - number: 3.9.4
    text: |-
      Indien het tweede lid is toegepast, vindt na afloop van het jaar en na ontvangst van definitieve inkomens- en
      vermogensgegevens definitieve vaststelling plaats. Indien daarbij blijkt dat het bijdrageplichtig inkomen in het
      lopende jaar minder dan € 3.293,60 lager is geweest dan het bijdrageplichtig inkomen, bedoeld in het eerste lid,
      vindt definitieve vaststelling plaats overeenkomstig het eerste lid.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.9
  - number: 3.9.5
    text: |-
      Inkomen dat in het buitenland wordt belast, dan wel is vrijgesteld van belasting op grond van bepalingen van
      internationaal recht, wordt mede in aanmerking genomen als ware dit aan de Nederlandse belastingwetgeving
      onderworpen. Op aanvraag van de cliënt wordt daarop de in het buitenland verschuldigde belasting in mindering
      gebracht.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.9
  - number: 3.10.1
    text: |-
      Indien ten aanzien van de ongehuwde cliënt of de gehuwde cliënt en diens echtgenoot geen voor de vaststelling van
      de bijdrage benodigde gegevens inzake het inkomen en de rendementsgrondslag beschikbaar zijn, wordt de bijdrage
      vastgesteld op het bedrag, bedoeld in [artikel 2.1.4, derde lid][ref1], of [2.1.4a, vierde lid, van de wet][ref2],
      of, indien een verordening als bedoeld in [artikel 3.8, tweede lid][ref3], geldt, wordt de bijdrage op nihil
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0035362#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0035733#Artikel3
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0035362
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0035733
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3.10.2
    text: |-
      Indien na de vaststelling van de bijdrage uit alsnog beschikbaar gekomen gegevens inzake het inkomen of de
      rendementsgrondslag, of uit een wijziging van deze gegevens, blijkt dat de bijdrage op onjuist bedrag is
      vastgesteld, herziet het CAK de bijdrage met inachtneming van de beschikbaar gekomen gegevens dan wel van die
      wijziging.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.10
  - number: 3.10a
    text: |-
      Over een gedeelte van de maand is de bijdrage, bedoeld in [artikel 3.1, tweede lid][ref1], gelijk aan het volledige
      bedrag, bedoeld in [artikel 2.1.4, derde lid][ref2], of [2.1.4a, vierde lid, van de wet][ref3] of een lager bedrag
      dat de gemeente op grond van [artikel 3.8][ref4] heeft vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0035733#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035362#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0035362#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0035733#Artikel3
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.10a
    references:
      - id: ref1
        bwb_id: BWBR0035733
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0035362
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0035362
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0035733
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 3.10b.1
    text: |-
      Het college ziet toe op het niet overschrijden van de kostprijs van een hulpmiddel of woningaanpassing, bedoeld in
      [artikel 2.1.4a, zesde lid, van de wet][ref1], aan de hand van de totale kostprijs.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.10b
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '2'
  - number: 3.10b.2
    text: |-
      Indien het college het CAK in kennis stelt van de totale kostprijs, bedoeld in het eerste lid, ziet het CAK voor
      het college toe op het niet overschrijden van die kostprijs.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.10b
  - number: 3.10b.3
    text: |-
      Bij het bepalen of de kostprijs niet wordt overschreden, wordt door het CAK, in afwijking van
      [artikel 3.8, tweede en vierde lid][ref1], het bedrag, bedoeld in [artikel 2.1.4 derde lid][ref2], of
      [2.1.4a, vierde lid van de wet][ref3], elke maand in mindering gebracht op de kostprijs.


      [ref1]: https://wetten.overheid.nl/BWBR0035733#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035362#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0035362#Artikel2
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.10b
    references:
      - id: ref1
        bwb_id: BWBR0035733
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0035362
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0035362
        artikel: '2'
  - number: 3.10b.4
    text: |-
      Het CAK gaat bij een samenloop van meerdere voorzieningen voor een cliënt uit van de kostprijs van één door
      het college aangewezen voorziening. Het college geeft aan bij welke voorziening het CAK toeziet op het niet
      overschrijden van de kostprijs, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.10b
  - number: 3.10b.5
    text: Indien de totale kostprijs wordt bereikt geeft het CAK daarvan onmiddellijk kennis aan het college.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.10b
  - number: 3.10b.6
    text: |-
      Het CAK staakt de inning van de bijdrage nadat het college om staking van de inning heeft verzocht. Als de
      resterende totale kostprijs lager is dan de verschuldigde bijdrage per maand wordt die bijdrage niet geïnd.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.10b
  - number: 3.11.1
    text: |-
      De bijdrage, bedoeld in [artikel 3.1, derde lid][ref1], bedraagt per maand een twaalfde gedeelte van het
      bijdrageplichtig inkomen, berekend volgens [artikel 3.13][ref2], voor:


      [ref1]: https://wetten.overheid.nl/BWBR0035733#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035733#Artikel3
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0035733
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0035733
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.11.1.a
    text: |-
      de ongehuwde cliënt die in een instelling voor beschermd wonen verblijft of een persoonsgebonden budget voor
      beschermd wonen is verleend;
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.11
  - number: 3.11.1.b
    text: |-
      de gehuwde cliënten tezamen die beiden in een instelling voor beschermd wonen verblijven dan wel dat daarvoor een
      persoonsgebonden budget is verleend;
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.11
  - number: 3.11.1.c
    text: |-
      de gehuwde cliënt wiens echtgenoot een bijdrage ingevolge [artikel 3.3.2.1 van het Besluit langdurige zorg][ref1]
      verschuldigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0035948#Artikel3
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0035948
        artikel: '3'
  - number: 3.11.2
    text: De bijdrage, bedoeld in het eerste lid, bedraagt niet meer dan € 3.061,80 per maand.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.11
  - number: 3.11.3
    text: |-
      In het geval, bedoeld in het eerste lid, onderdeel c, zijn de cliënt en zijn echtgenoot tezamen slechts eenmaal de
      bijdrage, berekend overeenkomstig het eerste en tweede lid, verschuldigd.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.11
  - number: 3.12.1
    text: |-
      In afwijking van [artikel 3.11][ref1] bedraagt een bijdrage per maand een twaalfde gedeelte van 10% van het
      bijdrageplichtig inkomen, berekend volgens [artikel 3.14][ref2], voor:


      [ref1]: https://wetten.overheid.nl/BWBR0035733#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035733#Artikel3
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0035733
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0035733
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.12.1.a
    text: |-
      de ongehuwde cliënt gedurende de eerste vier maanden van verblijf in een instelling voor beschermd wonen of
      waarover een persoonsgebonden budget is verleend voor beschermd wonen;
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.12
  - number: 3.12.1.b
    text: |-
      de gehuwde cliënten tezamen, zolang niet ten aanzien van elk van hen een periode van vier maanden als bedoeld in
      onderdeel a, is verstreken, tezamen;
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.12
  - number: 3.12.1.c
    text: |-
      de ongehuwde cliënt die moet of gehuwde cliënten tezamen die moeten voorzien in de kosten van onderhoud van
      eigen, aangehuwde of pleegkinderen, mits voor die kinderen op grond van de [Algemene Kinderbijslagwet][ref1]
      recht op een uitkering bestaat of aan die kinderen, voor zover ze de leeftijd van 27 jaar nog niet hebben bereikt,
      studiefinanciering is toegekend krachtens de [Wet studiefinanciering 2000][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002368
      [ref2]: https://wetten.overheid.nl/BWBR0011453
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0002368
      - id: ref2
        bwb_id: BWBR0011453
  - number: 3.12.1.d
    text: |-
      de ongehuwde cliënt of de gehuwde cliënten tezamen indien het college het waarschijnlijk acht dat het verblijf in
      de instelling voor beschermd wonen of waarover een persoonsgebonden budget is verleend voor beschermd wonen voor
      de ongehuwde cliënt, voor beide of voor een van beide gehuwde cliënten binnen vier maanden kan worden beëindigd en
      terugkeer naar de maatschappij mogelijk is en zal worden bewerkstelligd.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.12
  - number: 3.12.2
    text: |-
      De bijdrage bedraagt voorts per maand een twaalfde gedeelte van 10% van het bijdrageplichtig inkomen, berekend
      volgens [artikel 3.14][ref1], voor:


      [ref1]: https://wetten.overheid.nl/BWBR0035733#Artikel3
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0035733
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.12.2.a
    text: |-
      de gehuwde cliënt die in een instelling voor beschermd wonen verblijft of een persoonsgebonden budget voor
      beschermd wonen is verleend en wiens echtgenoot geen maatwerkvoorziening of persoonsgebonden budget ontvangt;
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.12
  - number: 3.12.2.b
    text: |-
      de gehuwde cliënten tezamen van wie één in een instelling voor beschermd wonen verblijft of een persoonsgebonden
      budget voor beschermd wonen is verleend en wiens echtgenoot een persoonsgebonden budget of een andere
      maatwerkvoorziening ontvangt;
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.12
  - number: 3.12.2.c
    text: |-
      de gehuwde cliënt die in een instelling voor beschermd wonen verblijft of een persoonsgebonden
      budget voor beschermd wonen is verleend en wiens echtgenoot zorg ontvangt als bedoeld in
      [artikel 3.1.1, eerste lid, van de Wet langdurige zorg][ref1], voor zover het zorg met verblijf in een instelling,
      een volledig pakket thuis, een modulair pakket thuis of een persoonsgebonden budget betreft, met dien verstande dat
      de cliënt en zijn echtgenoot tezamen de bijdrage slechts eenmaal verschuldigd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel3
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0035917
        artikel: '3'
  - number: 3.12.3
    text: |-
      De bijdrage voor beschermd wonen, bedoeld in het eerste en tweede lid, bedraagt ten minste € 212,60 en niet meer
      dan € 1.115,80 per maand.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.12
  - number: 3.12.4
    text: 'De onderdelen a en b van het eerste lid zijn niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.12
  - number: 3.12.4.a
    text: |-
      het een cliënt betreft van wie het recht op verblijf en de daarbij behorende medisch noodzakelijke geneeskundige
      zorg in verband met een psychische stoornis krachtens zijn zorgverzekering is geëindigd omdat de krachtens de
      Zorgverzekeringswet geldende maximumduur voor die zorg is bereikt, of
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.12
  - number: 3.12.4.b
    text: |-
      het verblijf aanvangt binnen vier maanden na beëindiging van een verblijf in een instelling voor beschermd wonen
      of persoonsgebonden budget voor beschermd wonen waarvoor de ongehuwde cliënt of de gehuwde cliënten tezamen een
      bijdrage als bedoeld in [artikel 3.11][ref1] verschuldigd was of waren, of


      [ref1]: https://wetten.overheid.nl/BWBR0035733#Artikel3
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0035733
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.12.4.c
    text: |-
      het verblijf aanvangt of het persoonsgebonden budget voor beschermd wonen wordt verleend binnen vier maanden na
      beëindiging van een verblijf in een instelling waarvoor de ongehuwde cliënt of de gehuwde cliënten tezamen een
      bijdrage als bedoeld in [artikel 3.3.2.1 van het Besluit langdurige zorg][ref1] verschuldigd was of waren.


      [ref1]: https://wetten.overheid.nl/BWBR0035948#Artikel3
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0035948
        artikel: '3'
  - number: 3.12.5
    text: |-
      Voor de berekening van de periode van vier maanden, bedoeld in het vierde lid, worden perioden van verblijf op
      grond van de Wet langdurige zorg, instellingen voor beschermd wonen of perioden waarover een persoonsgebonden
      budget voor beschermd wonen is verleend, samengeteld, tenzij tussen twee zodanige perioden meer dan zestig dagen
      zijn verlopen. De eerste volzin is niet van toepassing op cliënten die maximaal twee weken per twee maanden in een
      instelling voor beschermd wonen verblijven of een persoonsgebonden budget voor beschermd wonen is verleend.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.12
  - number: 3.12.6
    text: |-
      Uit eigen beweging door het CAK of op aanvraag van de cliënt is de bijdrage niet verschuldigd indien de cliënt die
      in een instelling verblijft of een persoonsgebonden budget ontvangt voor beschermd wonen:
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.12
  - number: 3.12.6.a
    text: |-
      een inkomen heeft dat gelijk is aan of lager is dan de in
      [artikel 23, eerste en tweede lid, van de Participatiewet][ref1], genoemde normbedragen, die gelden voor de cliënt
      of diens echtgenoot in de daarbij genoemde burgerlijke staat, waarbij die normbedragen opgehoogd worden met de voor
      de cliënt op grond van het derde lid vastgestelde minimale eigen bijdrage; of


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel23
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '23'
  - number: 3.12.6.b
    text: |-
      op grond van [artikel 13, tweede lid, onderdeel a, van de Participatiewet][ref1] geen uitkering ontvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel13
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '13'
  - number: 3.12.7
    text: |-
      De aanvraag, bedoeld in het zesde lid, wordt gedaan uiterlijk vier maanden na afloop van het kalenderjaar
      waarop de aanvraag betrekking heeft of uiterlijk vier maanden na de datum waarop de bijdrage op basis van het
      bijdrageplichtig inkomen wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.12
  - number: 3.13.1
    text: |-
      Het bijdrageplichtig inkomen, bedoeld in [artikel 3.11, eerste lid][ref1], wordt als volgt berekend:


      [ref1]: https://wetten.overheid.nl/BWBR0035733#Artikel3
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0035733
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.13.1.a
    text: |-
      het inkomen over het peiljaar van de ongehuwde cliënt onderscheidenlijk de gehuwde cliënten tezamen wordt
      verminderd met de door die cliënt onderscheidenlijk die cliënten verschuldigde of ingehouden belasting;
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.13
  - number: 3.13.1.b
    text: 'op het met toepassing van onderdeel a berekende bedrag worden in mindering gebracht:'
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.13
  - number: 3.13.1.b.1°
    text: |-
      15% van de netto-opbrengst van in het voorafgaande kalenderjaar verrichte arbeid, van een loon- of
      salarisdoorbetaling wegens ziekte of van een uitkering op grond van de [Ziektewet][ref1] dan wel, indien dit
      onbekend of niet beschikbaar is, 15% van de redelijkerwijs te verwachten netto-opbrengst van in het lopende
      kalenderjaar verrichte arbeid, van een loon- of salarisdoorbetaling wegens ziekte of van een uitkering op grond van
      de Ziektewet;


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: 3.13.1.b.2°
    text: |-
      het in het peiljaar geldende zak- en kleedgeld, premies voor een zorgverzekering gecorrigeerd voor de zorgtoeslag,
      een aftrekpost die verschillend kan zijn voor een cliënt die de pensioengerechtigde leeftijd heeft bereikt en
      een cliënt die die leeftijd nog niet heeft bereikt of extra vrijlatingen, een en ander volgens bij ministeriële
      regeling te bepalen regels;
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.13
  - number: 3.13.1.b.3°
    text: |-
      op aanvraag van de cliënt, de in het peiljaar geldende uitkering op grond van
      [artikel 14 van de Wet uitkeringen vervolgingsslachtoffers 1940–1945][ref1] of op grond van
      [artikel 20 van de Wet uitkeringen burger-oorlogsslachtoffers 1940–1945][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002844#Artikel20
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0002844
        artikel: '20'
  - number: 3.13.1.c
    text: het met toepassing van onderdeel b berekende bedrag wordt vermeerderd met de vermogensinkomensbijtelling.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.13
  - number: 3.13.2
    text: |-
      Op aanvraag van de cliënt stelt het CAK, in afwijking van het eerste lid, onderdelen a en c, het bijdrageplichtig
      inkomen voorlopig vast op basis van het redelijkerwijs gedurende het lopende kalenderjaar te verwachten inkomen,
      de vermogensinkomensbijtelling over het te verwachten vermogen, en de over dat kalenderjaar te verwachten
      belasting indien toepassing van het eerste lid, onderdelen a en c, ertoe zou leiden dat na afdracht van de
      bijdrage maandelijks gemiddeld minder over zou blijven dan het zak- en kleedgeld, zoals dat geldt in het lopende
      kalenderjaar, alsmede een bedrag in verband met de standaardpremie, vermeerderd met de inkomensafhankelijke premie
      [Zorgverzekeringswet][ref1], bedoeld in [artikel 43, eerste lid, van de Zorgverzekeringswet][ref2], en verminderd
      met de zorgtoeslag, zoals deze bedragen gelden in het lopende kalenderjaar. Het aldus berekende bijdrageplichtig
      inkomen wordt, om de per maand verschuldigde bijdrage vast te stellen, gedeeld door twaalf.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel43
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0018450
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '43'
  - number: 3.13.3
    text: |-
      De aanvraag, bedoeld in het tweede lid, wordt gedaan uiterlijk vier maanden na afloop van het kalenderjaar
      waarop de aanvraag betrekking heeft of uiterlijk vier maanden na de datum waarop de bijdrage op basis van het
      bijdrageplichtig inkomen, bedoeld in het eerste lid, wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.13
  - number: 3.13.4
    text: |-
      Indien het tweede lid is toegepast, vindt na afloop van het jaar en na ontvangst van definitieve inkomens- en
      vermogensgegevens de definitieve vaststelling plaats. Indien daaruit blijkt dat niet voldaan is aan het tweede lid,
      vindt definitieve vaststelling plaats met toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.13
  - number: 3.13.5
    text: |-
      Inkomen dat buiten Nederland wordt belast, dan wel is vrijgesteld van belasting op grond van bepalingen van
      internationaal recht, wordt mede in aanmerking genomen als ware dit aan de Nederlandse belastingwetgeving
      onderworpen. Op aanvraag van de cliënt wordt daarop de in het buitenland verschuldigde belasting in mindering
      gebracht.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.13
  - number: 3.14.1
    text: |-
      Voor de berekening van de bijdrage, bedoeld in [artikel 3.12, eerste en tweede lid][ref1], bestaat het
      bijdrageplichtig inkomen uit het inkomen over het peiljaar van de ongehuwde cliënt, onderscheidenlijk van de
      gehuwde cliënten tezamen, vermeerderd met de vermogensinkomensbijtelling.


      [ref1]: https://wetten.overheid.nl/BWBR0035733#Artikel3
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0035733
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.14.2
    text: |-
      Op aanvraag van de cliënt stelt het CAK, in afwijking van het eerste lid, het bijdrageplichtig inkomen voorlopig
      vast op grond van het inkomen en het vermogen van het lopende jaar, indien redelijkerwijs te verwachten is dat het
      bijdrageplichtig inkomen in het lopende jaar ten minste € 3.293,60 lager zal zijn dan het bijdrageplichtig inkomen,
      bedoeld in het eerste lid, dan wel indien de verzekerde algemene bijstand op grond van de [Participatiewet][ref1]
      ontvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0015703
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0015703
  - number: 3.14.3
    text: |-
      De aanvraag, bedoeld in het tweede lid, wordt gedaan uiterlijk vier maanden na afloop van het kalenderjaar waarop
      de aanvraag betrekking heeft of uiterlijk vier maanden na de datum waarop de bijdrage, bedoeld in het eerste lid,
      wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.14
  - number: 3.14.4
    text: |-
      Indien het tweede lid is toegepast, vindt na afloop van het jaar en na ontvangst van de definitieve inkomens- en
      vermogensgegevens definitieve vaststelling plaats. Indien daarbij blijkt dat het bijdrageplichtig inkomen over het
      lopende jaar minder dan € 3.293,60 lager is geweest dan het bijdrageplichtig inkomen, bedoeld in het eerste lid,
      vindt definitieve vaststelling plaats overeenkomstig het eerste lid.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.14
  - number: 3.14.5
    text: |-
      Inkomen dat buiten Nederland wordt belast, dan wel is vrijgesteld van belasting op grond van bepalingen van
      internationaal recht, wordt mede in aanmerking genomen als ware dit aan de Nederlandse belastingwetgeving
      onderworpen. Op aanvraag van de cliënt wordt daarop de in het buitenland verschuldigde belasting in mindering
      gebracht.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.14
  - number: '3.16'
    text: |-
      Indien [artikel 3.13, tweede lid][ref1], van toepassing is, worden, in afwijking van artikel 3.13, eerste lid,
      onderdeel b, onder 2˚, twaalf maal het in het lopende kalenderjaar geldende bedrag voor zak- en kleedgeld, de
      in het lopende kalenderjaar te betalen premies voor een zorgverzekering gecorrigeerd voor de zorgtoeslag en,
      indien van toepassing, de algemene korting voor wie de pensioensgerechtigde leeftijd nog niet heeft bereikt
      onderscheidenlijk de algemene korting voor wie de pensioengerechtigde leeftijd heeft bereikt, alsmede extra
      vrijlatingen als bedoeld in artikel 3.13, eerste lid, onderdeel b, onder 2°, in mindering gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0035733#Artikel3
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.16
    references:
      - id: ref1
        bwb_id: BWBR0035733
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.17.1
    text: |-
      Indien ten aanzien van de ongehuwde cliënt of de gehuwde cliënt en diens echtgenoot geen voor de vaststelling van
      de bijdrage benodigde gegevens inzake het inkomen en de rendementsgrondslag beschikbaar zijn, wordt:
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.17
  - number: 3.17.1.a
    text: |-
      de bijdrage, bedoeld in [artikel 3.11, eerste lid][ref1], vastgesteld op € 0 per maand;


      [ref1]: https://wetten.overheid.nl/BWBR0035733#Artikel3
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0035733
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.17.1.b
    text: |-
      de bijdrage, bedoeld in [artikel 3.12, eerste en tweede lid][ref1], vastgesteld op het minimumbedrag, genoemd in
      artikel 3.12, derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0035733#Artikel3
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0035733
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.17.2
    text: |-
      Indien na de vaststelling van de bijdrage uit alsnog beschikbaar gekomen gegevens inzake het inkomen of de
      rendementsgrondslag, of uit een wijziging van deze gegevens, blijkt dat de bijdrage op een te hoog of te laag
      bedrag is vastgesteld, herziet het CAK de bijdrage met inachtneming van de beschikbaar gekomen gegevens dan wel van
      die wijziging.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.17
  - number: 3.18.1
    text: |-
      De hoogte van de bijdrage wordt jaarlijks opnieuw berekend voor de periode van de eerste dag van januari tot en met
      de eenendertigste dag van de daaropvolgende maand december.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.18
  - number: 3.18.2
    text: |-
      In afwijking van [artikel 3.17, eerste lid][ref1], geldt, indien het inkomen bij de jaarlijkse herziening nog moet
      worden vastgesteld, als bijdrage, de bijdrage die over de laatste maand in het vorige kalenderjaar verschuldigd
      was.


      [ref1]: https://wetten.overheid.nl/BWBR0035733#Artikel3
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.18
    references:
      - id: ref1
        bwb_id: BWBR0035733
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 3.19.1
    text: |-
      Bij de berekening van de bijdrage wordt afwezigheid uit de instelling voor beschermd wonen, anders dan in verband
      met beëindiging van de levering of het beëindigen van het persoonsgebonden budget, buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.19
  - number: 3.19.2
    text: |-
      Over een gedeelte van een maand is de bijdrage gelijk aan het vastgestelde bedrag per maand, vermenigvuldigd met
      twaalf maal het aantal dagen waarover de bijdrage binnen die maand verschuldigd is en gedeeld door 365.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.19
  - number: 3.19.3
    text: |-
      Van de voor gehuwde cliënten gezamenlijk berekende bijdrage is ieder van de echtgenoten een gedeelte verschuldigd
      naar rato van ieders aandeel in het inkomen.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.19
  - number: 3.20.1
    text: |-
      De hoogte van de bijdrage, bedoeld in [artikel 3.1, vierde lid][ref1], is zodanig dat de cliënt na afdracht van de
      bijdrage, van zijn bijdrageplichtig inkomen, bedoeld in [artikel 3.9, eerste lid][ref2], omgerekend naar een maand,
      een bedrag overhoudt dat overeenkomt met het zak- en kleedgeld, vermeerderd met de standaardpremie, bedoeld in
      [artikel 1, eerste lid, onderdeel g, van de Wet op de zorgtoeslag][ref3] en gecorrigeerd met de zorgtoeslag.


      [ref1]: https://wetten.overheid.nl/BWBR0035733#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035733#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0018451#Artikel1
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.20
    references:
      - id: ref1
        bwb_id: BWBR0035733
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0035733
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0018451
        artikel: '1'
  - number: 3.20.2
    text: |-
      De bijdrage, bedoeld in het eerste lid, is niet verschuldigd indien de cliënt of zijn echtgenoot gedurende twee of
      meer nachten aaneengesloten een maand in een instelling voor beschermd wonen verblijft.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.20
  - number: 4.1.1.1
    text: Het college draagt er zorg voor dat Veilig Thuis herkenbaar en toegankelijk is.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.1.1
  - number: 4.1.1.2
    text: 'Ter uitvoering van het eerste lid draagt het college er in ieder geval zorg voor dat:'
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.1.1
  - number: 4.1.1.2.a
    text: |-
      Veilig Thuis te allen tijde bereikbaar en beschikbaar is in situaties waar onmiddellijke uitvoering van taken als
      bedoeld in [artikel 4.1.1, tweede en derde lid, van de wet][ref1], geboden is; en


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel4
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.1.1
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '4'
  - number: 4.1.1.2.b
    text: aangesloten is op een landelijk telefoonnummer dat kosteloos bereikbaar is.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.1.1
  - number: 4.1.1.3
    text: |-
      Veilig Thuis legt de wijze waarop het de taken, bedoeld in [artikel 4.1.1, tweede en derde lid, van de wet][ref1],
      uitvoert, schriftelijk vast. Daarbij wordt in ieder geval aangegeven op welke wijze:


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel4
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.1.1
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '4'
  - number: 4.1.1.3.a
    text: |-
      wordt gewaarborgd dat persoonsgegevens, waaronder bijzondere categorieën van persoonsgegevens en
      persoonsgegevens van strafrechtelijke aard als bedoeld in [paragraaf 3.1][ref1] onderscheidenlijk
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref2], die door Veilig Thuis worden
      verwerkt, slechts worden verwerkt voor het doel waarvoor deze zijn verzameld of voor zover het verwerken met dat
      doel verenigbaar is, alsmede hoe daarop wordt toegezien, en


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.1
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.1.1
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: 4.1.1.3.b
    text: |-
      uitvoering wordt gegeven aan [artikel 4.1.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035733#Artikel4
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.1.1
    references:
      - id: ref1
        bwb_id: BWBR0035733
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.1.2.1
    text: |-
      Het college draagt er zorg voor dat ten behoeve van Veilig Thuis voldoende deskundigheid beschikbaar is op het
      gebied van huiselijk geweld en kindermishandeling. Hiervoor is in ieder geval een arts met deskundigheid op het
      gebied van kindermishandeling beschikbaar.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.1.2
  - number: 4.1.2.2
    text: |-
      Het college waarborgt de onafhankelijke uitvoering van de taak van Veilig Thuis, bedoeld in
      [artikel 4.1.1, tweede lid, onderdeel b, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel4
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.1.2
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '4'
  - number: 4.1.3.1
    text: |-
      Indien toepassing is gegeven aan [artikel 5.2.1, eerste lid, van het Besluit Jeugdwet][ref1] draagt
      Veilig Thuis er zorg voor dat de taken, bedoeld in [artikel 4.1.1, tweede en derde lid, van de wet][ref2],
      worden uitgevoerd door of onder verantwoordelijkheid van een geregistreerde professional als bedoeld in
      [artikel 1.1. van het Besluit Jeugdwet][ref3]. Veilig Thuis deelt de taken toe met inachtneming van de specifieke
      kennis en vaardigheden van de geregistreerde professional.


      [ref1]: https://wetten.overheid.nl/BWBR0035779#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0035362#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0035779#Artikel1
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.1.3
    references:
      - id: ref1
        bwb_id: BWBR0035779
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0035362
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0035779
        artikel: '1'
  - number: 4.1.3.2
    text: |-
      In afwijking van het eerste lid kan Veilig Thuis anderen dan geregistreerde professionals met de uitvoering van een
      of meer taken, bedoeld in [artikel 4.1.1, tweede en derde lid, van de wet][ref1], belasten indien het aannemelijk
      kan maken dat de kwaliteit van de uit te voeren taak daardoor niet nadelig wordt beïnvloed. Veilig Thuis belast
      anderen met die taken indien dit noodzakelijk is voor de kwaliteit van de uit te voeren taak.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel4
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.1.3
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '4'
  - number: 4.1.3.3
    text: |-
      Veilig Thuis draagt er zorg voor dat geregistreerde professionals hun taken kunnen verrichten met inachtneming van
      de voor hen geldende professionele standaarden.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.1.3
  - number: 4.1.4
    text: |-
      Indien de mogelijkheid tot registratie in het kwaliteitsregister jeugd, bedoeld in
      [artikel 1.1 van het Besluit Jeugdwet][ref1], wordt uitgebreid naar nieuwe categorieën van beoefenaren van beroepen
      in het jeugddomein, bedoeld in het eerdergenoemde artikel, blijft [artikel 4.1.3][ref2] gedurende een termijn van
      een jaar buiten toepassing op werktoedelingen waarvan het college voor zover het betreft de toeleiding naar, de
      advisering over, de bepaling en het inzetten van de aangewezen voorziening, Veilig Thuis aannemelijk kan maken dat
      die toedeling plaatsvindt aan een niet tot die categorie behorende beroepsbeoefenaar, indien die beroepsbeoefenaar
      reeds bij de aanvang van die periode binnen de betreffende organisatie werkzaam was.


      [ref1]: https://wetten.overheid.nl/BWBR0035779#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0035733#Artikel4
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.1.4
    references:
      - id: ref1
        bwb_id: BWBR0035779
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0035733
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.1.5
    text: |-
      Indien de mogelijkheid tot registratie in het kwaliteitsregister jeugd, bedoeld in
      [artikel 1.1 van het Besluit Jeugdwet][ref1], wordt uitgebreid naar nieuwe categorieën van beoefenaren
      van beroepen in het jeugddomein, bedoeld in het eerdergenoemde artikel, kan gedurende een termijn
      van vijf jaar en drie maanden vanaf het tijdstip van aanvang van die termijn in afwijking van
      [artikel 5.4.2, eerste lid, aanhef en onder c, van het Besluit Jeugdwet][ref2] een tot die categorie behorende
      beroepsbeoefenaar in het kwaliteitsregister jeugd zijn ingeschreven indien:


      [ref1]: https://wetten.overheid.nl/BWBR0035779#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0035779#Artikel5
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.1.5
    references:
      - id: ref1
        bwb_id: BWBR0035779
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0035779
        artikel: '5'
  - number: 4.1.5.a
    text: |-
      die beroepsbeoefenaar op het tijdstip waarop de termijn aanvangt werkzaam is voor Veilig Thuis in een functie
      waarvoor scholing is vereist op het niveau van een hogere beroepsopleiding;
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.1.5
  - number: 4.1.5.b
    text: |-
      de aan de registratie van de beroepsbeoefenaar ten grondslag liggende aanvraag is ingediend binnen drie maanden na
      het tijdstip waarop de termijn is aangevangen;
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.1.5
  - number: 4.1.5.c
    text: |-
      de beroepsbeoefenaar deelneemt aan een scholingstraject dat erop gericht is uiterlijk bij de eerste herregistratie
      de scholing op het niveau van hoger beroepsonderwijs te voltooien, en
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.1.5
  - number: 4.1.5.d
    text: |-
      de registerstichting bij de uitvoering van [artikel 5.4.4 Besluit Jeugdwet][ref1] ervoor zorg draagt dat voor een
      ieder kenbaar is dat de registratie van de beroepsbeoefenaar valt onder de werking van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0035779#Artikel5
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.1.5
    references:
      - id: ref1
        bwb_id: BWBR0035779
        artikel: '5'
  - number: 4.1.6.1
    text: |-
      De aanvang van de termijnen, bedoeld in de [artikelen 4.1.4][ref1] en[ 4.1.5][ref2], wordt bij besluit van Onze
      Ministers vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0035733#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0035733#Artikel4
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.1.6
    references:
      - id: ref1
        bwb_id: BWBR0035733
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0035733
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.1.6.2
    text: |-
      De termijnen, bedoeld in de [artikelen 4.1.4][ref1] en [4.1.5][ref2], kunnen bij besluit van Onze Ministers worden
      gewijzigd, indien het in het belang van de continuïteit van de werktoedeling noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0035733#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0035733#Artikel4
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.1.6
    references:
      - id: ref1
        bwb_id: BWBR0035733
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0035733
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.1.6.3
    text: De besluiten, bedoeld in het eerste en tweede lid, worden bekend gemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.1.6
  - number: 4.1.7.1
    text: |-
      Veilig Thuis start binnen vijf dagen na ontvangst van een melding, nadat is vastgesteld dat onderzoek moet
      plaatsvinden, het onderzoek naar kindermishandeling of huiselijk geweld.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.1.7
  - number: 4.1.7.2
    text: |-
      Veilig Thuis oordeelt zo spoedig mogelijk, doch uiterlijk binnen tien weken na de vaststelling, bedoeld in het
      eerste lid, of, en zo ja, tot welke stappen een onderzoek aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.1.7
  - number: 4.1.7.3
    text: |-
      Bij regeling van Onze Minister en Onze Minister van Veiligheid en Justitie kunnen nadere regels worden gesteld over
      de wijze van besluitvorming door Veilig Thuis.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.1.7
  - number: 4.1.8.1
    text: |-
      In dit artikel wordt onder betrokkene verstaan degene die advies vraagt, degene die een melding doet, degene op
      wie een melding betrekking heeft of degene aan wie om informatie wordt verzocht in het kader van een onderzoek naar
      aanleiding van een melding.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.1.8
  - number: 4.1.8.2
    text: 'Veilig Thuis verschaft aan iedere betrokkene bij het eerste contact informatie over:'
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.1.8
  - number: 4.1.8.2.a
    text: de procedure met betrekking tot een advies, melding of onderzoek;
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.1.8
  - number: 4.1.8.2.b
    text: |-
      met inachtneming van de [artikelen 4.2.12][ref1], [5.1.6][ref2] en [5.3.1 van de wet][ref3]:


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0035362#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0035362#Artikel5
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.1.8
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0035362
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0035362
        artikel: '5'
  - number: 4.1.8.2.b.1°
    text: de verwerking van persoonsgegevens; en
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.1.8
  - number: 4.1.8.2.b.2°
    text: het recht op inzage in of afschrift van de hem betreffende bescheiden; en
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.1.8
  - number: 4.1.8.2.c
    text: de wijze van behandeling van klachten.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.1.8
  - number: 4.1.8.3
    text: |-
      Veilig Thuis verstrekt geen inlichtingen over de herkomst van persoonsgegevens die het naar aanleiding van een
      melding heeft verkregen indien:
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.1.8
  - number: 4.1.8.3.a
    text: |-
      een persoon die in een beroepsmatige, hulpverlenende of pedagogische relatie tot het slachtoffer of het
      vermoedelijke slachtoffer of zijn huiselijke kring staat, de persoonsgegevens naar aanleiding van een melding heeft
      verstrekt en het verstrekken van die inlichtingen:
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.1.8
  - number: 4.1.8.3.a.1°
    text: een bedreiging vormt of kan vormen voor het slachtoffer of het vermoedelijke slachtoffer of zijn huiselijke kring;
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.1.8
  - number: 4.1.8.3.a.2°
    text: een bedreiging vormt of kan vormen voor de persoon, bedoeld onder a, of medewerkers van die persoon, of
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.1.8
  - number: 4.1.8.3.a.3°
    text: |-
      leidt of kan leiden tot een ernstige verstoring van de vertrouwensrelatie met de huiselijke kring waartoe het
      slachtoffer of het vermoedelijke slachtoffer behoort;
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.1.8
  - number: 4.1.8.3.b
    text: het andere personen betreft dan die bedoeld onder a, behoudens voor zover zij daarvoor toestemming hebben gegeven.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.1.8
  - number: 4.2.1
    text: |-
      In deze paragraaf wordt onder «personen die bij een melding aan Veilig Thuis betrokken zijn» verstaan jeugdigen,
      ouders of pleegouders die een melding doen, op wie een melding betrekking heeft of aan wie in het kader van een
      onderzoek naar aanleiding van een melding informatie wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.2.1
  - number: 4.2.2
    text: |-
      De informatie die Veilig Thuis aan personen die bij een melding aan Veilig Thuis betrokken zijn, verstrekt over
      de mogelijkheid gebruik te maken van de diensten van een vertrouwenspersoon, bestaat in ieder geval uit informatie
      over:
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.2.2
  - number: 4.2.2.a
    text: de onafhankelijke rol van de vertrouwenspersoon;
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.2.2
  - number: 4.2.2.b
    text: de aard van de ondersteuning door een vertrouwenspersoon;
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.2.2
  - number: 4.2.2.c
    text: de vertrouwelijkheid van die ondersteuning;
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.2.2
  - number: 4.2.2.d
    text: het feit dat de ondersteuning kosteloos is, en
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.2.2
  - number: 4.2.2.e
    text: de bereikbaarheid en beschikbaarheid van de vertrouwenspersoon.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.2.2
  - number: 4.2.3
    text: |-
      De vertrouwenspersoon behoeft geen toestemming van derden om met personen die bij een melding aan Veilig Thuis
      betrokken zijn, te spreken.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.2.3
  - number: 4.2.4
    text: |-
      Veilig Thuis verschaft aan de vertrouwenspersoon de faciliteiten die deze voor een juiste uitoefening van zijn taak
      nodig heeft.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.2.4
  - number: 4.2.5
    text: |-
      De vertrouwenspersoon heeft vrije toegang tot de gebouwen waar Veilig Thuis zijn werkzaamheden uitoefent, een en
      ander voor zover dit voor een juiste uitoefening van zijn taak nodig is.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.2.5
  - number: 4.2.6
    text: |-
      Onverminderd het bij of krachtens de wet bepaalde verschaft Veilig Thuis aan de vertrouwenspersoon alle
      inlichtingen en toont hem alle bescheiden die deze voor een juiste uitoefening van zijn taak nodig heeft.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.2.6
  - number: 4.3.1.1
    text: |-
      De structurele verstrekking van gegevens, bedoeld in [artikel 4.2.12, eerste lid, van de wet][ref1], vindt plaats
      op elektronische wijze aan het Centraal Bureau voor de Statistiek.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel4
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.3.1
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '4'
  - number: 4.3.1.2
    text: |-
      Onze Minister, Onze Minister van Veiligheid en Justitie en het college vragen geen gegevens uit ten behoeve van
      de doelen, bedoeld in [artikel 4.2.12, eerste lid van de wet][ref1], indien zij of het Centraal Bureau voor de
      Statistiek reeds over deze gegevens beschikken en deze gegevens gebruikt kunnen worden ten behoeve van deze doelen.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel4
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.3.1
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '4'
  - number: 4.3.2.1
    text: |-
      De structurele verstrekking van gegevens, bedoeld in [][ref1] [artikel 4.2.12, eerste lid, van de wet][ref2],
      betreft:


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0035362#Artikel4
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.3.2
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0035362
        artikel: '4'
  - number: 4.3.2.1.a
    text: het aantal gegeven adviezen, uitgesplitst naar kindermishandeling en de aard van het huiselijk geweld;
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.3.2
  - number: 4.3.2.1.b
    text: |-
      het aantal ontvangen meldingen uitgesplitst naar huiselijk geweld enerzijds en kindermishandeling anderzijds,
      inclusief het burgerservicenummer, de geboortedatum en het geslacht van degene over wie een melding is gedaan;
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.3.2
  - number: 4.3.2.1.c
    text: |-
      het aantal verrichte onderzoeken uitgesplitst naar huiselijk geweld enerzijds en kindermishandeling anderzijds,
      inclusief de burgerservicenummers van degenen over wie een melding is gedaan;
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.3.2
  - number: 4.3.2.1.d
    text: |-
      de hoedanigheid van de persoon die contact opnam met het advies- en meldpunt huiselijk geweld en
      kindermishandeling;
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.3.2
  - number: 4.3.2.1.e
    text: de datum van de melding;
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.3.2
  - number: 4.3.2.1.f
    text: de datum van de start van het onderzoek;
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.3.2
  - number: 4.3.2.1.g
    text: de datum van afronding van het onderzoek;
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.3.2
  - number: 4.3.2.1.h
    text: |-
      de uitkomst van de verrichte onderzoeken met inbegrip van, indien van toepassing, de aard van het geweld of de
      mishandeling; en
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.3.2
  - number: 4.3.2.1.i
    text: het vervolgtraject na afronding van het onderzoek.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.3.2
  - number: 4.3.2.2
    text: |-
      Een incidentele verstrekking van gegevens uit hoofde van [artikel 4.2.12, eerste lid, van de wet][ref1] betreft
      geen persoonsgegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel4
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.3.2
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '4'
  - number: 4.3.3.1
    text: |-
      Bij regeling van Onze Minister en Onze Minister van Veiligheid en Justitie wordt voor het verstrekken van de
      gegevens, bedoeld in [artikel 4.2.12, eerste lid, van de wet][ref1], bepaald:


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel4
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.3.3
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '4'
  - number: 4.3.3.1.a
    text: welke gegevens worden verstrekt alsmede, voor zover nodig, een nadere omschrijving van deze gegevens;
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.3.3
  - number: 4.3.3.1.b
    text: de wijze waarop de gegevens worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.3.3
  - number: 4.3.3.1.c
    text: de tijdvakken waarop de gegevens die worden verstrekt betrekking hebben;
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.3.3
  - number: 4.3.3.1.d
    text: de termijnen waarbinnen of de tijdstippen waarop de gegevens worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.3.3
  - number: 4.3.3.2
    text: Bij de regeling, bedoeld in het eerste lid, wordt een informatieprotocol vastgesteld.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4.3.3
  - number: 4a.1.1.1
    text: |-
      Een ingezetene als bedoeld in [artikel 3a.1.1, eerste lid, van de wet][ref1], heeft, na aanvraag bij het UWV, recht
      op vergoeding van een bij ministeriële regeling vastgesteld aantal uren aan tolkdiensten over bij ministeriële
      regeling vast te stellen perioden.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel3a
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4a.1.1
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: 3a
  - number: 4a.1.1.2
    text: |-
      In afwijking van het ten hoogste beschikbare aantal uren, bedoeld in het eerste lid, kunnen meer uren door
      het UWV worden toegekend voor tolkdiensten bij activiteiten die in het belang zijn voor de deelname aan het
      maatschappelijke verkeer, indien:
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4a.1.1
  - number: 4a.1.1.2.a
    text: de ingezetene, bedoeld in het eerste lid, een onderbouwde aanvraag indient bij het UWV voor ondersteuning; en
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4a.1.1
  - number: 4a.1.1.2.b
    text: |-
      naar het oordeel van het UWV het aangevraagde aantal aanvullende uren in redelijke verhouding staat tot de bijdrage
      aan de mogelijkheden van de ingezetene, bedoeld in het eerste lid, tot deelname aan het maatschappelijk verkeer.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4a.1.1
  - number: 4a.1.1.3
    text: |-
      De vergoeding, bedoeld in het eerste en tweede lid, wordt toegekend indien de ingezetene een verklaring
      heeft van de huisarts of behandeld medisch specialist, waaruit blijkt dat deze ingezetene op deze
      tolkdiensten is aangewezen. Deze verklaring wordt eenmalig gevraagd, tenzij het UWV op grond van
      [artikel 73a van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] deze al heeft verkregen
      voor de uitvoering van aan het UWV opgedragen taken. Bij de uitvoering van dit artikel is het UWV
      bevoegd de verklaring te gebruiken, die het UWV heeft verkregen voor de uitvoering van aanspraken op
      tolkvoorzieningen op grond van de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref2],
      de [Wet werk en inkomen naar arbeidsvermogen][ref3], de [Wet overige OCW-subsidies][ref4] en de
      [Participatiewet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel73a
      [ref2]: https://wetten.overheid.nl/BWBR0008657
      [ref3]: https://wetten.overheid.nl/BWBR0019057
      [ref4]: https://wetten.overheid.nl/BWBR0009458
      [ref5]: https://wetten.overheid.nl/BWBR0015703
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4a.1.1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 73a
      - id: ref2
        bwb_id: BWBR0008657
      - id: ref3
        bwb_id: BWBR0019057
      - id: ref4
        bwb_id: BWBR0009458
      - id: ref5
        bwb_id: BWBR0015703
  - number: 4a.1.1.4
    text: |-
      Het aantal toegekende uren, bedoeld in het eerste lid, kan verschillen per tolkvoorziening, waaronder tolkdiensten
      met behulp van telecommunicatiemiddelen, of per te onderscheiden doelgroep, waarbij in ieder geval wordt
      onderscheiden diegenen die zowel een auditieve als een visuele beperking hebben.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4a.1.1
  - number: 4a.1.1.5
    text: |-
      De op grond van het tweede lid toegekende uren worden verrekend met de resterende uren waarop de ingezetene,
      bedoeld in het eerste lid, reeds recht heeft op grond van dat lid.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4a.1.1
  - number: 4a.1.1.6
    text: 'Bij ministeriële regeling kunnen regels gesteld worden over:'
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4a.1.1
  - number: 4a.1.1.6.a
    text: de gegevens die bij een aanvraag moeten worden ingediend;
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4a.1.1
  - number: 4a.1.1.6.b
    text: de declaratie van een vergoeding voor tolkvoorzieningen per tolkvoorziening.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4a.1.1
  - number: 4a.1.2
    text: |-
      Het UWV kan tolkdiensten toekennen aan instellingen voor activiteiten die zich mede richten op auditief beperkte
      personen, indien:
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4a.1.2
  - number: 4a.1.2.a
    text: die instelling geen winstoogmerk heeft;
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4a.1.2
  - number: 4a.1.2.b
    text: |-
      de instelling gemotiveerd aantoont één of meerdere activiteiten te organiseren waarbij personen met een auditieve
      beperking ook tot de doelgroep behoren; en
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4a.1.2
  - number: 4a.1.2.c
    text: |-
      de tolkdiensten passender door middel van een toekenning aan een instelling kunnen worden vergoed dan per
      ingezetene op grond van [artikel 4a.1.1, eerste of tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035733#Artikel4a
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4a.1.2
    references:
      - id: ref1
        bwb_id: BWBR0035733
        artikel: 4a
        hoofdstuk: 4a
        paragraaf: '1'
  - number: 4a.1.3.1
    text: |-
      Het UWV kan, in afwijking van de [artikelen 4a.1.1][ref1] en [4a.1.2][ref2], zonder aanvraag ambtshalve
      noodzakelijke tolkdiensten toekennen aan:


      [ref1]: https://wetten.overheid.nl/BWBR0035733#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0035733#Artikel4a
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4a.1.3
    references:
      - id: ref1
        bwb_id: BWBR0035733
        artikel: 4a
        hoofdstuk: 4a
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0035733
        artikel: 4a
        hoofdstuk: 4a
        paragraaf: '1'
  - number: 4a.1.3.1.a
    text: |-
      instellingen als bedoeld in [artikel 3a.1.1, tweede lid, van de wet][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel3a
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4a.1.3
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: 3a
  - number: 4a.1.3.1.b
    text: |-
      een persoon, bedoeld in [artikel 3a.1.1, tweede lid, van de wet][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel3a
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4a.1.3
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: 3a
  - number: 4a.1.3.1.b.1°
    text: in spoedeisende gevallen;
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4a.1.3
  - number: 4a.1.3.1.b.2°
    text: |-
      indien de onverkorte toepassing van [artikel 4a.1.1][ref1] leidt tot onbillijkheden van overwegende aard.


      [ref1]: https://wetten.overheid.nl/BWBR0035733#Artikel4a
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4a.1.3
    references:
      - id: ref1
        bwb_id: BWBR0035733
        artikel: 4a
        hoofdstuk: 4a
        paragraaf: '1'
  - number: 4a.1.3.2
    text: |-
      De ambtshalve toekenning bedoeld in het eerste lid kan ook betrekking hebben op vreemdelingen als bedoeld in
      [artikel 1 van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel1
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4a.1.3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '1'
  - number: 4a.2.1
    text: |-
      Tolkendiensten van tolken komen alleen voor vergoeding in aanmerking op grond van
      [artikel 3a.1.1 van de wet][ref1], als de tolken ingeschreven staan in het openbaar register van de Stichting
      Register Tolken Gebarentaal en Schrijftolken.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel3a
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel4a.2.1
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: 3a
  - number: 5.1.1
    text: |-
      Het college neemt in een overeenkomst met betrekking tot het leveren van maatwerkvoorzieningen op, dat de
      aanbieder in overleg treedt met de aanbieder of aanbieders die in opdracht van het college laatstelijk voor hem
      dan wel na hem die maatwerkvoorzieningen hebben verleend dan wel gaan verlenen, over de overname van de betrokken
      hulpverleners.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel5.1
  - number: 5.1.2
    text: |-
      Het college verleent een opdracht voor het leveren van maatwerkvoorzieningen ten minste drie maanden voor de
      ingangsdatum van die opdracht.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel5.1
  - number: 5.2.1
    text: |-
      Teneinde te komen tot de afspraken, bedoeld in [artikel 5.4.1, tweede lid, van de wet][ref1], nodigt het college,
      zo veel als mogelijk in samenwerking met andere colleges in de regio, de in die regio werkzame zorgverzekeraars
      periodiek uit voor overleg.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel5
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '5'
  - number: 5.2.2
    text: |-
      Indien het college en de zorgverzekeraars gezamenlijk oordelen dat dit met het oog op het maken van goede afspraken
      wenselijk is, nodigt het college ook andere in de regio op de in [artikel 5.4.1, tweede lid, van de wet][ref1]
      genoemde terreinen werkzame organisaties en instanties uit voor overleg. Artikel 5.4.1, eerste, tweede en vierde
      lid, van de wet is op deze organisaties en instanties van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel5
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '5'
  - number: '5.3'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de uitvoering van de taak, bedoeld
      in [artikel 2.6.2, eerste lid, van de wet][ref1] door de Sociale verzekeringsbank, genoemd in
      [artikel 3 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel3
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '3'
  - number: 5.4.1
    text: |-
      Bij verordening als bedoeld in [artikel 2.6.6, eerste lid, van de wet][ref1] wordt aandacht besteed aan de wijze
      waarop tariefdifferentiatie wordt bevorderd en wordt geregeld dat de prijs voor een dienst ten minste is gebaseerd
      op de volgende kostprijselementen:


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '2'
  - number: 5.4.1.a
    text: de kosten van de beroepskracht;
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel5.4
  - number: 5.4.1.b
    text: redelijke overheadkosten;
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel5.4
  - number: 5.4.1.c
    text: kosten voor niet productieve uren van de beroepskrachten als gevolg van verlof, ziekte, scholing, werkoverleg;
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel5.4
  - number: 5.4.1.d
    text: reis en opleidingskosten;
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel5.4
  - number: 5.4.1.e
    text: indexering van de prijs voor het leveren van een dienst; en
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel5.4
  - number: 5.4.1.f
    text: |-
      overige kosten als gevolg van door de gemeente gestelde verplichtingen voor aanbieders waaronder
      rapportageverplichtingen en administratieve verplichtingen.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel5.4
  - number: 5.4.2
    text: Bij ministeriële regeling kunnen regels worden gesteld over de indexering, bedoeld in het eerste lid, onderdeel e.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel5.4
  - number: 5.4.3
    text: |-
      Het eerste lid geldt voor een subsidie slechts voor zover zij wordt verstrekt voor het daadwerkelijk verrichten van
      diensten voor cliënten en met de subsidie wordt beoogd de te subsidiëren diensten volledig te bekostigen.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel5.4
  - number: '7.1'
    text: |-
      Na inwerkingtreding van de [wet][ref1] berust het
      [Besluit aanwijzing registraties gezamenlijke huishouding 1998][ref2] op
      [artikel 1.1.2, vijfde lid, van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0035362
      [ref2]: https://wetten.overheid.nl/BWBR0009280
      [ref3]: https://wetten.overheid.nl/BWBR0035362#Artikel1
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0035362
      - id: ref2
        bwb_id: BWBR0009280
      - id: ref3
        bwb_id: BWBR0035362
        artikel: '1'
  - number: '7.2'
    text: |-
      Na inwerkingtreding van de [wet][ref1] berust het
      [Besluit verplichte meldcode huiselijk geweld en kindermishandeling][ref2] op
      [artikel 3.3, derde lid, van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0035362
      [ref2]: https://wetten.overheid.nl/BWBR0033723
      [ref3]: https://wetten.overheid.nl/BWBR0035362#Artikel3
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0035362
      - id: ref2
        bwb_id: BWBR0033723
      - id: ref3
        bwb_id: BWBR0035362
        artikel: '3'
  - number: '8.1'
    text: |-
      De artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel8.1
  - number: '8.2'
    text: 'Dit besluit wordt aangehaald als: Uitvoeringsbesluit Wmo 2015.'
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel8.2
