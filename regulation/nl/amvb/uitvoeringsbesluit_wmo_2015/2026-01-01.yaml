  - number: 4.1.1
    text: |-
      1 Het college draagt er zorg voor dat Veilig Thuis herkenbaar en toegankelijk is.

      2 Ter uitvoering van het eerste lid draagt het college er in ieder geval zorg voor dat:

      a. Veilig Thuis te allen tijde bereikbaar en beschikbaar is in situaties waar onmiddellijke uitvoering van taken
      als bedoeld in [artikel 4.1.1, tweede en derde lid, van de wet][ref1], geboden is; en

      b. aangesloten is op een landelijk telefoonnummer dat kosteloos bereikbaar is.

      3 Veilig Thuis legt de wijze waarop het de taken, bedoeld in [artikel 4.1.1, tweede en derde lid, van de wet][ref2],
      uitvoert, schriftelijk vast. Daarbij wordt in ieder geval aangegeven op welke wijze:

      a. wordt gewaarborgd dat persoonsgegevens, waaronder bijzondere categorieën van persoonsgegevens en
      persoonsgegevens van strafrechtelijke aard als bedoeld in [paragraaf 3.1][ref3] onderscheidenlijk
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref4], die door Veilig Thuis worden
      verwerkt, slechts worden verwerkt voor het doel waarvoor deze zijn verzameld of voor zover het verwerken met dat
      doel verenigbaar is, alsmede hoe daarop wordt toegezien, en

      b. uitvoering wordt gegeven aan [artikel 4.1.2][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel4.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0035362#Artikel4.1.1
      [ref3]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.1
      [ref4]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
      [ref5]: https://wetten.overheid.nl/BWBR0035733#Artikel4.1.2
