  - number: 3.2.4
    text: |-
      Het deel van het bedrag, bedoeld in het eerste lid, dat de vermogensgrondslag van de persoon overtreft, wordt voor
      zijn echtgenoot als vermindering toegepast.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.2
  - number: 3.2.5
    text: |-
      Bij ministeriële regeling kan een periode worden vastgesteld gedurende welke het bedrag van een uitkering als
      bedoeld in het eerste lid, kan worden afgetrokken, welke periode kan verschillen per uitkering.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.2
  - number: 3.2a
    text: |-
      De vermogensinkomensbijtelling bedraagt 4% van het vermogen van de ongehuwde cliënt, dan wel de opgetelde vermogens
      van de gehuwde cliënten.
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.2a
  - number: 3.3.1
    text: 'De cliënt betaalt:'
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.3
  - number: 3.3.1.a
    text: |-
      de bijdrage, bedoeld in [artikel 3.1, tweede lid][ref1], uiterlijk in de maand volgend op de maand waarover de
      bijdrage verschuldigd is, tenzij de verschuldigdheid van een bijdrage betrekking heeft op een maand die voorafgaand
      is aan de maand waarin het besluit, waarmee een herziening is vastgesteld als bedoeld in [artikel 3.6][ref2], aan
      de cliënt is verzonden;


      [ref1]: https://wetten.overheid.nl/BWBR0035733#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035733#Artikel3
    url: https://wetten.overheid.nl/BWBR0035733/2026-01-01#Artikel3.3
