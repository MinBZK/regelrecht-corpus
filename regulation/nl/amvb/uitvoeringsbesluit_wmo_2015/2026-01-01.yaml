  - number: '3.13'
    text: |-
      1 Het bijdrageplichtig inkomen, bedoeld in [artikel 3.11, eerste lid][ref1], wordt als volgt berekend:

      a. het inkomen over het peiljaar van de ongehuwde cliënt onderscheidenlijk de gehuwde cliënten tezamen wordt
      verminderd met de door die cliënt onderscheidenlijk die cliënten verschuldigde of ingehouden belasting;

      b. op het met toepassing van onderdeel a berekende bedrag worden in mindering gebracht:

      1°. 15% van de netto-opbrengst van in het voorafgaande kalenderjaar verrichte arbeid, van een loon- of
      salarisdoorbetaling wegens ziekte of van een uitkering op grond van de [Ziektewet][ref2] dan wel, indien dit
      onbekend of niet beschikbaar is, 15% van de redelijkerwijs te verwachten netto-opbrengst van in het lopende
      kalenderjaar verrichte arbeid, van een loon- of salarisdoorbetaling wegens ziekte of van een uitkering op grond van
      de Ziektewet;

      2°. het in het peiljaar geldende zak- en kleedgeld, premies voor een zorgverzekering gecorrigeerd voor de
      zorgtoeslag, een aftrekpost die verschillend kan zijn voor een cliënt die de pensioengerechtigde leeftijd heeft
      bereikt en een cliënt die die leeftijd nog niet heeft bereikt of extra vrijlatingen, een en ander volgens bij
      ministeriële regeling te bepalen regels;

      3°. op aanvraag van de cliënt, de in het peiljaar geldende uitkering op grond van
      [artikel 14 van de Wet uitkeringen vervolgingsslachtoffers 1940–1945][ref3] of op grond van
      [artikel 20 van de Wet uitkeringen burger-oorlogsslachtoffers 1940–1945][ref4];

      c. het met toepassing van onderdeel b berekende bedrag wordt vermeerderd met de vermogensinkomensbijtelling.

      2 Op aanvraag van de cliënt stelt het CAK, in afwijking van het eerste lid, onderdelen a en c, het bijdrageplichtig
      inkomen voorlopig vast op basis van het redelijkerwijs gedurende het lopende kalenderjaar te verwachten inkomen,
      de vermogensinkomensbijtelling over het te verwachten vermogen, en de over dat kalenderjaar te verwachten
      belasting indien toepassing van het eerste lid, onderdelen a en c, ertoe zou leiden dat na afdracht van de
      bijdrage maandelijks gemiddeld minder over zou blijven dan het zak- en kleedgeld, zoals dat geldt in het lopende
      kalenderjaar, alsmede een bedrag in verband met de standaardpremie, vermeerderd met de inkomensafhankelijke premie
      [Zorgverzekeringswet][ref5], bedoeld in [artikel 43, eerste lid, van de Zorgverzekeringswet][ref6], en verminderd
      met de zorgtoeslag, zoals deze bedragen gelden in het lopende kalenderjaar. Het aldus berekende bijdrageplichtig
      inkomen wordt, om de per maand verschuldigde bijdrage vast te stellen, gedeeld door twaalf.

      3 De aanvraag, bedoeld in het tweede lid, wordt gedaan uiterlijk vier maanden na afloop van het kalenderjaar
      waarop de aanvraag betrekking heeft of uiterlijk vier maanden na de datum waarop de bijdrage op basis van het
      bijdrageplichtig inkomen, bedoeld in het eerste lid, wordt vastgesteld.

      4 Indien het tweede lid is toegepast, vindt na afloop van het jaar en na ontvangst van definitieve inkomens- en
      vermogensgegevens de definitieve vaststelling plaats. Indien daaruit blijkt dat niet voldaan is aan het tweede lid,
      vindt definitieve vaststelling plaats met toepassing van het eerste lid.

      5 Inkomen dat buiten Nederland wordt belast, dan wel is vrijgesteld van belasting op grond van bepalingen
      van internationaal recht, wordt mede in aanmerking genomen als ware dit aan de Nederlandse belastingwetgeving
      onderworpen. Op aanvraag van de cliënt wordt daarop de in het buitenland verschuldigde belasting in mindering
      gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0035733#Artikel3.11
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0002844#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0002844#Artikel20
      [ref5]: https://wetten.overheid.nl/BWBR0018450
      [ref6]: https://wetten.overheid.nl/BWBR0018450#Artikel43
