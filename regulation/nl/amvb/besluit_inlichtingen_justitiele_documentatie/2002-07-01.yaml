  - number: '9'
    text: |-
      Indien op grond van het bepaalde in [artikel 4][ref1] of 5 inlichtingen uit de algemene documentatieregisters
      worden gevraagd en het College van procureurs-generaal bevindt, dat de persoon op wie het verzoek om inlichtingen
      betrekking heeft, wordt verdacht van een strafbaar feit, dat zou kunnen leiden tot een strafrechtelijke beslissing,
      die bij de beoordeling van de te verstrekken inlichtingen in aanmerking zou worden genomen,

      is het College van procureurs-generaal, indien het daartoe bepaaldelijk termen vindt, bevoegd aan degene, die
      het verzoek om inlichtingen heeft gedaan, mede te delen, dat nog een strafzaak hangende is. Van die mededeling
      wordt een afschrift gezonden aan de personen omtrent wie de inlichtingen worden gevraagd, behoudens indien de
      inlichtingen worden gevraagd in verband met een te verlenen Koninklijke onderscheiding.


      [ref1]: https://wetten.overheid.nl/BWBR0002292#Artikel4
