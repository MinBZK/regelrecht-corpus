        artikel: '31'
  - number: 9c
    text: >-
      Het College van procureurs-generaal is bevoegd bepaalde gegevens uit de algemene documentatieregisters te
      verstrekken aan:


      a. het hoofd van het Meldpunt Ongebruikelijke Transacties voor zover noodzakelijk om te kunnen beoordelen of de
      ongebruikelijke transacties van belang zijn voor de voorkoming en opsporing van misdrijven;


      b. Onze Minister van Justitie voor zover noodzakelijk voor het verwerken van deze gegevens in het Cliënt-
      Volgsysteem Jeugdcriminaliteit.
