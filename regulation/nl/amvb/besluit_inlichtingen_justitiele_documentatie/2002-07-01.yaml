preamble:
  text: >-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.


    Op de voordracht van Onze Minister van Justitie van 13 augustus 1958, Stafafdeling Wetgeving, nr. 275/658, gedaan
    mede namens Onze Minister van Binnenlandse Zaken, Bezitsvorming en Publiekrechtelijke Bdrijfsorganisatie;


    Gelet op de artikelen 13 en 35 van de Wet op de justitiële documentatie en op de verklaringen omtrent het gedrag;


    De Raad van State gehoord (advies van 26 augustus 1958, nr. 24);


    Gezien het nader rapport van Onze voornoemde Minister van 19 september 1958, nr. 308/658;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002292/2002-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van het bij of krachtens dit besluit bepaalde wordt verstaan onder

      algemene documentatieregisters: de door de justitiële documentatiedienst beheerde registers als bedoeld in
      [artikel 5 van het Besluit registratie justitiële gegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002293#Artikel5
    url: https://wetten.overheid.nl/BWBR0002292/2002-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002293
        artikel: '5'
  - number: '2'
    text: |-
      Het College van procureurs-generaal is bevoegd inlichtingen te verstrekken over de gegevens, uit de algemene
      documentatieregisters, aan:

      a. de personen, die dit nodig hebben in verband met de hun toekomende bevoegdheid tot het nemen van beslissingen
      over de benoeming en het ontslag van personeel bij:

      de regionale politiekorpsen;

      het Korps landelijke politiediensten

      de Koninklijke Marechaussee;

      de Binnenlandse Veiligheidsdienst;

      de Buitenlandse Inlichtingendienst;

      de Nederlandse buitenlandse dienst;

      de Militaire Inlichtingendienst;

      de rijksbelastingdienst;

      de Economische Controledienst;

      de Algemene Inspectiedienst van het Departement van Landbouw, Visserij en Voedselvoorziening;

      de buitengewone opsporingsambtenaren van de divisie Vervoer van de Inspectie Verkeer en Waterstaat;

      b. de Commissarissen der Koningin ten behoeve van het dienen van advies inzake de benoeming van burgemeesters;

      c. de beheerder van de afdeling van de justitiële documentatiedienst ten departemente van Justitie, ter doorzending
      aan de procureurs-generaal in Suriname en de Nederlandse Antillen, in verband met de uitzending of plaatsing van
      personeel te belasten of mede te belasten met zaken der justitie of der politie in Suriname en de Nederlandse
      Antillen;

      d. de wetenschappelijk adviseur, verbonden aan de Hoofdafdeling Individueel Maatschappelijk Werk en Maatschappelijk
      Opbouwwerk van het Ministerie van Maatschappelijk Werk in verband met zijn werkzaamheden met betrekking tot de zorg
      van onmaatschappelijke gezinnen;

      e. de contactambtenaren bedoeld in [artikel 58 van de Wet op de economische delicten][ref1], ten behoeve van de hun
      als zodanig opgedragen werkzaamheden;

      f. de directeur van het Landelijk selectie- en opleidingsinstituut politie, ten behoeve van het onderzoek naar de
      antecedenten van personen in verband met hun sollicitatie naar een dienstbetrekking bij een politiekorps;

      g. de personen belast met het opmaken van een aanbeveling voor de vervulling van het ambt van Nationale ombudsman
      of substituut-ombudsman, ten behoeve van het opmaken van zodanige aanbeveling;

      h. Onze Minister van Justitie ten behoeve van het onderzoek naar de antecedenten van personen die in aanmerking
      willen komen voor een functie bij de rechterlijke macht of het openbaar ministerie, of voor een andere
      rechtsprekende functie of voor een benoeming tot gerechtsdeurwaarder;

      i. de voorzitter van de door Onze Minister van Justitie ingestelde commissies die belast zijn met de selectie van
      personen die in aanmerking willen komen voor een functie bij de rechterlijke macht of het openbaar ministerie, of
      voor een andere rechtsprekende functie ten behoeve van het onderzoek naar de antecedenten van die personen;

      j. de voorzitters van de kamers van toezicht ten behoeve van het onderzoek naar de antecedenten van personen die in
      aanmerking willen komen voor een benoeming tot notaris;

      k. de directeur van een inrichting als bedoeld in artikel 6 van de Beginselenwet gevangeniswezen, de directeur
      van een inrichting als bedoeld in [artikel 37][ref2] alsmede de directeur van een voorziening als bedoeld in
      [artikel 65 van de Wet op de jeugdhulpverlening][ref3] ten behoeve van het nemen van beslissingen inzake hetzij
      de aanstelling of het ontslag van personeel, hetzij de toelating tot de inrichting van personen, die niet
      worden ingesloten in de inrichting respectievelijk voorziening voor zover dat noodzakelijk is voor de orde of de
      veiligheid van de inrichting of voorziening;

      l. Onze Minister van Justitie ten behoeve van hetzij het onderzoek naar de antecedenten van personen die in
      aanmerking willen komen voor een leidinggevende positie bij een particuliere beveiligingsorganisatie, hetzij door
      hem te benoemen buitengewone opsporingsambtenaren, hetzij de uitvoering van de [Wet wapens en munitie][ref4], de
      [Jachtwet][ref5] en het Besluit toezicht handel te water;

      m. het College van procureurs-generaal ten behoeve van door hem te benoemen buitengewoon opsporingsambtenaren;

      n. de korpschef van een regionaal politiekorps ten behoeve van de uitvoering van de Wet wapens en munitie en de
      [Jachtwet][ref6];

      o. Onze Minister van Justitie en de burgemeester voor zover dit in het kader van de beoordeling van een verzoek tot
      het verkrijgen van het Nederlanderschap op grond van de [Rijkswet op het Nederlanderschap][ref7] noodzakelijk is;

      p. de directeur van de Immigratie- en Naturalisatiedienst en de korpschef van een regionaal politiekorps
      alsmede de voorzitter van de Adviescommissie voor vreemdelingenzaken ten behoeve van de uitvoering van de
      [Vreemdelingenwet 2000][ref8];

      q. de directeur van het Nederlands Centraal Instituut voor Giraal Effectenverkeer B.V. ten behoeve van het
      onderzoek naar de antecedenten van personen die in aanmerking willen komen voor een dienstbetrekking bij deze
      rechtspersoon of bij het Nederlands Interprofessioneel Effectencentrum NIEC B.V. of die reeds een dienstbetrekking
      bij een van deze rechtspersonen vervullen, maar in aanmerking willen komen voor een andere dienstbetrekking bij een
      van deze rechtspersonen alsmede ten behoeve van het onderzoek naar de antecedenten van personen die bij de hiervoor
      genoemde rechtspersonen werkzaamheden gaan verrichten gedurende een zodanig lange periode dat hun positie kan
      worden gelijkgesteld met die van werknemers in dienstverband;

      r. de President van De Nederlandsche Bank N.V. ten behoeve van het onderzoek naar de antecedenten van personen die
      in aanmerking willen komen voor een dienstbetrekking bij deze rechtspersoon of bij de Europese Centrale Bank of die
      reeds een dienstbetrekking bij deze rechtspersoon of de Europese Centrale Bank vervullen, maar in aanmerking willen
      komen voor een andere dienstbetrekking bij die rechtspersoon of Europese Centrale Bank, alsmede ten behoeve van het
      onderzoek naar de antecedenten van personen die bij die rechtspersoon werkzaamheden gaan verrichten gedurende een
      zodanig lange periode dat hun positie kan worden gelijkgesteld met die van werknemers in dienstverband;

      s. de President van De Nederlandsche Bank N.V. ten behoeve van het onderzoek naar de antecedenten van personen
      die naar aanleiding van een overeenkomst met De Nederlandsche Bank N.V. worden belast met het vervoeren van
      bankbiljetten, munten of halffabrikaten die worden gebruikt voor de vervaardiging van bankbiljetten of munten;

      t. de voorzitter van de Stichting Toezicht Effectenverkeer ten behoeve van het onderzoek naar de antecedenten
      van personen die in aanmerking willen komen voor een dienstbetrekking bij deze stichting of die reeds een
      dienstbetrekking bij deze stichting vervullen, maar in aanmerking willen komen voor een andere dienstbetrekking
      bij die stichting, alsmede ten behoeve van het onderzoek naar de antecedenten van personen die bij deze stichting
      werkzaamheden gaan verrichten gedurende een zodanig lange periode dat hun positie kan worden gelijkgesteld met die
      van werknemers in dienstverband;

      u. het hoofd van de divisie Recherche van het Korps landelijke politiediensten ten behoeve van het controleren
      van de juistheid van de gegevens uit de politieregisters, die op grond van een verzoek om rechtshulp door de
      autoriteiten van een vreemde staat, als bedoeld in [artikel 552h van het Wetboek van Strafvordering][ref9], al dan
      niet namens de officier van justitie worden verstrekt;

      v. het hoofd van de divisie Recherche van het Korps landelijke politiediensten, of in geval van rechtstreekse
      verstrekking de korpschef of de commandant van de Koninklijke marechaussee ten behoeve van het controleren
      van de juistheid van de gegevens uit de politieregisters, die zonder daartoe strekkend verzoek op grond van
      [artikel 13 van het Besluit politieregisters][ref10] aan politie-autoriteiten in een ander land worden verstrekt;

      w. Onze Minister van Justitie met het oog op de afgifte van een verklaring van geen bezwaar in verband met de
      oprichting van een naamloze of besloten vennootschap.


