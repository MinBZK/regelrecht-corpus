        artikel: '4'
  - number: '7'
    text: |-
      1 Voor zover de bij of krachtens dit artikel aangewezen wetten en de daarop berustende bepalingen gevolg verbinden
      aan afdoeningen wegens misdrijven of bepaalde overtredingen is het College van procureurs-generaal bevoegd aan de
      personen of colleges, die ten aanzien van bepaalde personen belast zijn met het nemen van bestuursbesluiten ter
      uitvoering van die wetten dan wel belast zijn met het beslissen in beroep terzake van zodanige besluiten,

      uit de algemene documentatieregisters inlichtingen te verstrekken over de daarin opgenomen beslissingen waaraan in
      de betrokken wet gevolg is verbonden.

      2 Indien de betrokken wetten niet anders bepalen, worden van misdrijven de gegevens verstrekt, vermeld in
      [artikel 5][ref1] van dit besluit en worden voorts verstrekt gegevens terzake van overtredingen van de betrokken
      wet, doch slechts indien sinds het onherroepelijk worden van de veroordeling niet meer dan acht jaren zijn
      verlopen.

      3 De voorgaande leden zijn van toepassing op:

      a. de [Drank- en Horecawet][ref2];

      b. de [Wet op de weerkorpsen en de particuliere beveiligingsorganisaties][ref3];

      c. de [Wet op de Dierenbescherming][ref4];

      d. de [Wegenverkeerswet 1994][ref5];

      e. de [Wet explosieven voor civiel gebruik][ref6];

      f. de [Wet op de kansspelen][ref7];

      en voorts op de door Onze Minister van Justitie aan te wijzen andere voorschriften.

      4 Indien in een algemene plaatselijke verordening in het kader van de beoordeling van de aanvraag om een vergunning
      voor het bedrijfsmatig geven van gelegenheid tot het verrichten van seksuele handelingen met een derde tegen
      betaling gevolg wordt verbonden aan bepaalde onherroepelijke afdoeningen, is het eerste lid van overeenkomstige
      toepassing.


