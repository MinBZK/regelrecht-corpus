  - number: '8'
    text: |-
      1 De in de [artikelen 2][ref1] tot en met [7][ref2] en [9c][ref3] genoemde personen kunnen onder hen ressorterende
      ambtenaren machtigen tot het aanvragen der gegevens. In dat geval wordt de machtiging in de aanvrage vermeld.

      2 Voor zover de in de [artikelen 2][ref4], [5][ref5] en [7][ref6] genoemde personen betrekking hebben op een
      burgemeester, is deze tevens bevoegd de korpschef in wiens regio de gemeente is gelegen, te machtigen tot het
      aanvragen van de gegevens.

      3 Het verzoek om inlichtingen wordt gericht tot het College van procureurs-generaal hetzij rechtstreeks, hetzij,
      in de door Onze Minister van Justitie aangewezen gevallen, door tussenkomst van een door die Minister aangewezen
      ambtenaar.


