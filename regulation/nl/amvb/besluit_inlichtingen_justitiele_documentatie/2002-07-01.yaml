  - number: '3'
    text: >-
      1 Het College van procureurs-generaal is bevoegd inlichtingen te verstrekken over de gegevens, uit de algemene
      documentatieregisters, aan


      het hoofd van de Binnenlandse Veiligheidsdienst,


      het hoofd van de Militaire Inlichtingendienst,


      indien en voor zover deze gegevens in het belang van de taakvervulling van de betrokken dienst nodig zijn en
      het verzoek personen betreft, aan wie, in de zin van het Rubriceringsvoorschrift, tot hoger dan confidentieel
      geclassificeerde gegevens, materialen of andere objecten toegang zal worden verleend. Bij het indienen van het
      verzoek wordt omschreven welke gegevens voor het beoogde doel nodig zijn. In zeer bijzondere gevallen kan het
      College van procureurs-generaal buitendien gegevens verstrekken, nadat hem persoonlijk de noodzaak daartoe door het
      hoofd van de dienst of diens plaatsvervanger, onder overlegging van alle betrekkelijke gegevens, is aangetoond.


      2 Het College van procureurs-generaal is bevoegd inlichtingen te verstrekken uit de algemene documentatieregisters
      aan het bevoegd gezag van noodwachten en noodwachtstaven, voor zover dit gezag deze nodig heeft met het oog op de
      bevoegdheid tot het nemen van beslissingen over de bestemming, de inlijving en het ontslag van noodwachtplichtigen
      en ander noodwachtpersoneel, indien en voorzover de betrokken personen in aanraking kunnen komen met zaken, waarvan
      de geheimhouding naar het oordeel van het bevoegd gezag en van het College van procureurs-generaal in het algemeen
      belang geboden is; bij het verzoek wordt de functie van betrokkene en de aard van de door hem te verrichten
      werkzaamheden vermeld.


      3 Alvorens een verzoek om inlichtingen als bedoeld in de vorige leden wordt gedaan, gaat het hoofd van de dienst,
      onderscheidenlijk het bevoegd gezag, na of de benodigde gegevens buiten zijn tussenkomst kunnen worden verkregen op
      enige wijze voorzien in dit besluit, dan wel in een andere bij of krachtens de wet gegeven regeling.
    url: https://wetten.overheid.nl/BWBR0002292/2002-07-01#Artikel3
  - number: '4'
    text: >-
      Het College van procureurs-generaal is bevoegd aan


      a. Onze Minister van Justitie ten behoeve van hetzij het geven van advies aan vreemde mogendheden over te verlenen
      visa, hetzij het verstrekken van inlichtingen over aspirant-emigranten;


      b. de beheerder van de afdeling van de justitiële documentatiedienst bij het Ministerie van Justitie ten behoeve
      van de beoordeling van verzoeken tot toelating voor de vestiging in de Nederlandse Antillen en Aruba uit de
      algemene documentatieregisters inlichtingen te verstrekken over de gegevens, die vermeld stonden op de uit de
      strafregisters verwijderde strafbladen.
    url: https://wetten.overheid.nl/BWBR0002292/2002-07-01#Artikel4
  - number: '5'
    text: |-
      1 Het College van procureurs-generaal is bevoegd aan de burgemeesters, voorzover zij buiten het geval waarin het
      verzoek om inlichtingen omtrent een bepaald persoon verband houdt met het vervullen van een bepaalde werkzaamheid
      gehouden zijn andere bestuursorganen te dienen van bericht en raad uit de algemene documentatieregisters
      inlichtingen te verstrekken over de gegevens, die vermeld stonden op uit de strafregisters verwijderde strafbladen
      met dien verstande, dat, indien sedert het onherroepelijk worden van de veroordeling meer dan acht jaren zijn
      verlopen, slechts inlichtingen worden verstrekt, indien het ondergaan van gevangenisstraf onvoorwaardelijk is
      opgelegd of - na een voorwaardelijke veroordeling - alsnog is bevolen.

      2 Geen gegevens worden verstrekt, indien sedert de verwijdering van het laatstelijk inzake de betrokkene opgemaakte
      strafblad acht jaren zijn verlopen.

      3 Aan de burgemeester en de commissaris van de Koning worden in het kader van hun adviserende taak, bedoeld in
      het [Reglement op de Orde van de Nederlandse Leeuw en de Orde van Oranje-Nassau][ref1], de inlichtingen verstrekt,
      genoemd in [artikel 4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007391
      [ref2]: https://wetten.overheid.nl/BWBR0002292#Artikel4
    url: https://wetten.overheid.nl/BWBR0002292/2002-07-01#Artikel5
