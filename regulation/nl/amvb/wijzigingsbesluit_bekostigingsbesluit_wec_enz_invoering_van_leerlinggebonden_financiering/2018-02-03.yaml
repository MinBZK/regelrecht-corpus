  - number: XVI
    text: |-
      1 In afwijking van [artikel 77a, tweede lid, van de Wet op het voortgezet onderwijs][ref1] wordt indien op de
      school een leerling wordt ingeschreven voor wie een leerlinggebonden budget beschikbaar is, dat leerlinggebonden
      budget gerekend vanaf de in [artikel 77a, tweede lid][ref2], bedoelde datum, aan het bevoegd gezag van die school
      toegekend met ingang van 1 augustus volgend op die inschrijving.

      2 In afwijking van [artikel 8a van het Bekostigingsbesluit W.V.O.][ref3] wordt de vergoeding in verband met een
      leerling met leerlinggebonden budget voor de schooljaren 2003–2004 en 2004–2005, en 2005–2006 vastgesteld op
      het bedrag dat het verschil bedraagt tussen de in [artikel 8a van genoemd besluit][ref4] voor de desbetreffende
      onderwijssoort vermelde bedrag en het in genoemd artikel voor de desbetreffende onderwijssoort vermelde verplicht
      her te besteden bedrag.

      3 Het verplicht her te besteden bedrag, bedoeld in het tweede lid, wordt in de vorm van een aantal
      formatierekeneenheden en een geldbedrag ten behoeve van de materiële instandhouding volgens onderstaande tabel
      toegekend aan de school als bedoeld in de [Wet op de expertisecentra][ref5] waarbinnen onderwijs wordt gegeven van
      de soort waarvoor de leerling toelaatbaar is verklaard:











