        artikel: VIII
  - number: XVIII
    text: |-
      1 De ingevolge dit besluit gewijzigde artikelen van het [Bekostigingsbesluit WEC][ref1], het
      [Formatiebesluit WEC][ref2], het [Onderwijskundig besluit WEC][ref3], het [Bekostigingsbesluit WPO][ref4], het
      [Formatiebesluit WPO][ref5] en het [Bekostigingsbesluit W.V.O.][ref6], zoals die artikelen luidden op de dag voor
      de inwerkingtreding van dit besluit, blijven van toepassing op de tijdvakken waarvoor zij gelding hadden.

      2 Op geschillen met betrekking tot de ingevolge dit besluit gewijzigde artikelen van het
      [Bekostigingsbesluit WEC][ref7], het [Formatiebesluit WEC][ref8], het [Onderwijskundig besluit WEC][ref9], het
      [Bekostigingsbesluit WPO][ref10], het [Formatiebesluit WPO][ref11] en het [Bekostigingsbesluit W.V.O.][ref12],
      zoals die artikelen luidden op de dag voor inwerkingtreding van dit besluit, op die datum in bezwaar of beroep
      aanhangig zijn of na die datum binnen de bezwaar- of beroepstermijn aanhangig zijn gemaakt, blijven de op die datum
      geldende regelingen van toepassing. De eerste volzin is van overeenkomstige toepassing op de bevoegdheid tot het
      intrekken en vervangen van besluiten die tot de aldaar bedoelde geschillen hebben geleid.


