  - number: XVII
    text: |-
      Indien een school op 31 juli 2003 leerlingen ontvangt uit een residentiële instelling en de school
      om diezelfde reden met ingang van 1 augustus 2003 daarvoor formatie krijgt toegekend, op grond van
      [artikel 117, achtste lid, van de Wet op de expertisecentra][ref1] wordt het aantal leerlingen dat bepalend is voor
      de toekenning van die formatie, in mindering gebracht op het aantal leerlingen, bedoeld in [artikel VIII][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel117
      [ref2]: https://wetten.overheid.nl/BWBR0014754#ArtikelVIII
    url: https://wetten.overheid.nl/BWBR0014754/2018-02-03#ArtikelXVII
