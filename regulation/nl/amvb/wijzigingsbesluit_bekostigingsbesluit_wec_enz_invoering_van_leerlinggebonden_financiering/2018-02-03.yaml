  - number: XV
    text: |-
      1 In afwijking van [artikel 70a van de Wet op het primair onderwijs][ref1] en
      [artikel 16 van het Formatiebesluit WPO][ref2] wordt de omvang van het leerlinggebonden budget voor de schooljaren
      2003–2004 en 2004–2005 vastgesteld op het aantal formatierekeneenheden dat het verschil bedraagt tussen de in
      [artikel 16 van genoemd besluit][ref3] voor de desbetreffende onderwijssoort vermelde aantal formatierekeneenheden
      van het leerlinggebonden budget en het in genoemd artikel voor de desbetreffende onderwijssoort vermelde aantal
      formatierekeneenheden dat verplicht moet worden herbesteed.

      2 Het aantal verplicht her te besteden formatierekeneenheden maakt, onverminderd
      __REF000___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      ____________________________________________________________ (Stb. 2002, 631), deel uit van de formatie, bedoeld
      in [artikel IX][ref5] en [X][ref6], van de school, bedoeld in de [Wet op de expertisecentra][ref7], van de soort
      waarvoor de leerling toelaatbaar is verklaard en die is gelegen in het gebied van het regionaal expertisecentrum
      waarin ook de school, bedoeld in de [Wet op het primair onderwijs][ref8] is gelegen en die de ambulante begeleiding
      verzorgt. Het bevoegd gezag van de school waarbij de leerling is ingeschreven, meldt Onze minister van Onderwijs,
      Cultuur en Wetenschappen, welke school, bedoeld in de [Wet op de expertisecentra][ref9] de ambulante begeleiding
      van de leerling verzorgt.


