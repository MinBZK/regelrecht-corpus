preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van de Staatssecretaris van Onderwijs, Cultuur en Wetenschappen, drs. K. Y. I. J. Adelmund, van 19
    april 2002, nr. WJZ/2002/15493 (2599), directie Wetgeving en Juridische Zaken; gedaan mede namens Onze Minister van
    Landbouw, Natuurbeheer en Visserij,


    Gelet op de artikelen 24, 70, 117 en 120, van de Wet op de expertisecentra, artikel 70a van de Wet op het primair
    onderwijs, artikel 77a van de Wet op het voortgezet onderwijs en artikel XV van de Wet van 28 november 2002
    houdende wijziging van de Wet op de expertisecentra, de Wet op het primair onderwijs en de Wet op het voortgezet
    onderwijs in verband met de invoering van een leerlinggebonden budget en de vorming van regionale expertisecentra
    (Stb. 2002, 631);


    De Raad van State gehoord (advies van 4 juli 2002, nr. W05.02.0181/III);


    Gezien het nader rapport van Onze Minister van Onderwijs, Cultuur en Wetenschappen, van 20 februari 2003, nr.
    WJZ/2003/3992 (2599), directie Wetgeving en Juridische Zaken, uitgebracht mede namens de Staatssecretaris van
    Landbouw, Natuurbeheer en Visserij;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0014754/2018-02-03#ArtikelAanhef
articles:
  - number: VII
    text: |-
      Voor de toepassing van [artikel 56a van het Bekostigingsbesluit WEC][ref1] wordt voor de schooljaren 2003–2004 en
      2004–2005 het aantal geïndiceerde leerlingen vastgesteld op de helft van de som van het aantal leerlingen dat op 1
      oktober 2002 is ingeschreven bij de aan het regionaal expertisecentrum deelnemende scholen en het aantal door die
      scholen ambulant begeleide leerlingen op die datum.


      [ref1]: https://wetten.overheid.nl/BWBR0004259#Artikel56a
    url: https://wetten.overheid.nl/BWBR0014754/2018-02-03#ArtikelVII
    references:
      - id: ref1
        bwb_id: BWBR0004259
        artikel: 56a
  - number: VIII
    text: |-
      Voor de berekening van de formatie en de berekening van de vergoeding voor de materiële instandhouding
      van scholen voor speciaal onderwijs, voortgezet speciaal onderwijs en speciaal en voortgezet
      speciaal onderwijs, niet zijnde instellingen, worden de leerlingen die met inachtneming van
      __REF000___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      _______________________________________________________________ op de school zijn ingeschreven, aangemerkt als
      leerlingen die toelaatbaar zijn verklaard tot een van de onderwijssoorten die door de school worden verzorgd dan
      wel tot het cluster waartoe de school behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0014350#ArtikelV
    url: https://wetten.overheid.nl/BWBR0014754/2018-02-03#ArtikelVIII
    references:
      - id: ref1
        bwb_id: BWBR0014350
        artikel: V
  - number: IX
    text: >-
      De formatie voor een school voor speciaal onderwijs, een school voor voortgezet speciaal onderwijs en een school
      voor speciaal en voortgezetspeciaal onderwijs, niet zijnde een instelling, voor het schooljaar 2003–2004, wordt ten
      minste vastgesteld op de omvang van de formatie die de school zou ontvangen op basis van de regelingen zoals die
      op de school van toepassing waren op 31 juli 2003 en gebaseerd op het leerlingenaantal dat daarvoor van toepassing
      was.
    url: https://wetten.overheid.nl/BWBR0014754/2018-02-03#ArtikelIX
  - number: X
    text: >-
      1 Het totaal van de formatie ambulante begeleiding voor de schooljaren 2003–2004 en 2004–2005 wordt vastgesteld op
      de omvang van die formatie zoals die voor de school gold op 1 augustus 2003 vermeerderd met de formatie op grond
      van de Regeling aanvullende formatie (v)so rechtstreekse instromers zoals die voor de school op genoemde datum
      gold.


      2 Ten behoeve van de berekening van de omvang van de formatie ten behoeve van preventieve ambulante begeleiding
      voor het schooljaar 2005–2006 wordt op de teldatum 1 oktober 2003 het aantal leerlingen geteld dat op basis van de
      Regeling aanvullende formatie (v)so rechtstreekse instromers in aanmerking komt voor ambulante begeleiding en wordt
      op 1 oktober 2004 vastgesteld voor hoeveel van die leerlingen een leerlinggebonden budget beschikbaar is.
    url: https://wetten.overheid.nl/BWBR0014754/2018-02-03#ArtikelX
  - number: XII
    text: |-
      Voor de onderwijssoorten, bedoeld in [artikel 2, vierde lid onder d, van de Wet op de expertisecentra][ref1]
      worden voor de periode 1 januari 2004 tot 1 januari 2007 nieuwe programma's van eisen vastgesteld, die voor al die
      onderwijssoorten gelijk zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003549#Artikel2
    url: https://wetten.overheid.nl/BWBR0014754/2018-02-03#ArtikelXII
    references:
      - id: ref1
        bwb_id: BWBR0003549
        artikel: '2'
  - number: XIII
    text: |-
      [Artikel 8 van het Formatiebesluit WEC][ref1] blijft buiten toepassing in het schooljaar 2003–2004.


      [ref1]: https://wetten.overheid.nl/BWBR0005442#Artikel8
    url: https://wetten.overheid.nl/BWBR0014754/2018-02-03#ArtikelXIII
    references:
      - id: ref1
        bwb_id: BWBR0005442
        artikel: '8'
  - number: XIV
    text: |-
      1 In afwijking van [artikel 70a van de Wet op het primair onderwijs][ref1] en
      [artikel 17 van het Bekostigingsbesluit WPO][ref2] wordt de vergoeding in verband met een leerling met een
      leerlinggebonden budget voor de schooljaren 2003–2004 en 2004–2005 vastgesteld op het bedrag dat het verschil is
      tussen de in [artikel 17 van genoemd besluit][ref3] voor de desbetreffende onderwijssoort vermelde bedrag en het in
      genoemd artikel voor de desbetreffende onderwijssoort vermelde verplicht her te besteden bedrag.

      2 Het verplicht her te besteden bedrag wordt, onverminderd
      __REF000___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      _____________________________________________________________________________, toegerekend aan de school,
      bedoeld in de [Wet op de expertisecentra][ref5], van de soort waarvoor de leerling toelaatbaar is verklaard
      en die is gelegen in het gebied van het regionaal expertisecentrum waarin ook de school, bedoeld in de
      [Wet op het primair onderwijs][ref6] is gelegen en die de ambulante begeleiding verzorgt. Het bevoegd gezag van
      de school waarbij de leerling is ingeschreven, meldt Onze minister van Onderwijs, Cultuur en Wetenschappen, welke
      school, bedoeld in de [Wet op de expertisecentra][ref7] de ambulante begeleiding van de leerling verzorgt.


