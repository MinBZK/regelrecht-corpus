  - number: '27'
    text: >-
      Dit besluit treedt in werking op de dag na de datum van uitgifte van het *Staatsblad* waarin het is geplaatst en
      werkt zonodig terug tot en met 1 januari 1994. De werking van dit besluit eindigt op 31 december 1998 doch kan
      bij algemene maatregel van bestuur voor een periode van 5 jaar worden verlengd. Dit besluit is van toepassing op
      opsporingen en ruimingen, dan wel, naar het oordeel van Onze Ministers, op zich zelf staande onderdelen daarvan,
      waarvan de werkzaamheden op of na 1 januari 1994 in uitvoering zijn genomen.
