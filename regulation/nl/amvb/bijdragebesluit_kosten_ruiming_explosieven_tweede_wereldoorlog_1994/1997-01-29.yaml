    overeenstemming met Onze Minister van Binnenlandse Zaken en de Staatssecretaris van Defensie.


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006236/1997-01-29#ArtikelAanhef
articles:
  - number: '1'
    text: >-
      Dit besluit verstaat onder:


      a. explosieven: bommen en gevechtsladingen; geleide en ballistische projectielen; munitie voor artillerie,
      mortieren en klein-kaliberwapens; alle mijnen, torpedo's en dieptebommen; vernielingsladingen; al dan niet
      pyrotechnische vuurwerken; bundelrekken, moederbommen en dispensers; inrichtingen in werking gesteld door patronen
      en stuwstoffen; elektrische ontstekingsrichtingen;


      b. opsporing: onderzoeken van een bepaald gebied in verband met de vermoede aanwezigheid van explosieven met
      inbegrip van de ruiming van deze explosieven;


      c. ruiming: benaderen, veiligstellen, afvoeren of vernietigen van een explosief dat in een bepaald gebied is
      aangetroffen;


      d. bestuursorgaan: het gemeentebestuur, en bij opsporingen of ruimingen in gebieden die niet gemeentelijk zijn
      ingedeeld, de bevoegde burgerlijke autoriteit ter plaatse;


      e. werkplan: het werkplan van het bestuursorgaan;


      f. Onze Minister: Onze Minister van Financiën;


      g. Onze Ministers: Onze Ministers van Financiën, van Binnenlandse Zaken en van Defensie;


      h. deskundigen: door het Ministerie van Defensie als zodanig aangewezen personeel;


      i. bebouwde kom: de bebouwde kom van de gemeente zoals deze op basis van luchtfoto's is bepaald door de
      Topografische Dienst Nederland van het Ministerie van Defensie voor de vaststelling van de bebouwingsgegevens voor
      de berekening van de algemene uitkering uit het Gemeentefonds;


      j. infrastructuur: het geheel van auto-, spoor-, straat-, waterwegen, havens, vliegvelden, elektrische installaties
      enz;


      k. kwetsbare infrastructuur: dat deel van de infrastructuur waaraan als gevolg van detonatie van een vermoedelijk
      aanwezig dan wel aanwezig explosief zodanige schade kan worden aangericht dat er grote risico's ontstaan voor de
      bevolking;


      l. begroting: hoofdstuk IX B (Financiën) van de Rijksbegroting.
    url: https://wetten.overheid.nl/BWBR0006236/1997-01-29#Artikel1
  - number: '2'
    text: >-
      1 De kosten van werkzaamheden die verband houden met opsporing of ruiming van explosieven afkomstig uit de Tweede
      Wereldoorlog, komen voor rekening van het bestuursorgaan, met dien verstande dat voor een aantal kostensoorten van
      rijkswege in bepaalde gevallen een bijdrage kan worden toegekend.


      2 Een bijdrage, zoals bedoeld in het eerste lid, wordt verminderd dan wel niet toegekend indien het bestuursorgaan
      op andere wijze voor de kosten vergoeding heeft verkregen of de kosten, naar het oordeel van Onze Minister, door
      schuld of nalatigheid van het bestuursorgaan zijn veroorzaakt of vergroot.
    url: https://wetten.overheid.nl/BWBR0006236/1997-01-29#Artikel2
  - number: '3'
    text: >-
      1 Voor een bijdrage in de door het bestuursorgaan gemaakte kosten voor het opsporen of ruimen van explosieven
      afkomstig uit de Tweede Wereldoorlog, komen uitsluitend die opsporingen of ruimingen in aanmerking waarbij,
      naar het oordeel van Onze Ministers, de vermoede aanwezigheid dan wel aanwezigheid van deze explosieven en
      grote risico's voor de bevolking met zich brengt en de kosten redelijkerwijs niet geheel voor rekening van het
      bestuursorgaan kunnen blijven.


      2 De wijze waarop aan de opsporingswerkzaamheden uitvoering wordt gegeven dient, naar het oordeel van Onze
      Ministers, noodzakelijk te zijn in verband met het toekomstige gebruik van de grond.


      3 De bijdrage wordt toegekend voorzover de op de begroting toegestane ruimte voor het aangaan van verplichtingen
      niet wordt overschreden.


      4 Bij het vaststellen van de bijdrage wordt rekening gehouden met een eigen bijdrage van het bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0006236/1997-01-29#Artikel3
  - number: '4'
    text: >-
      Bij een opsporing kunnen de volgende kostensoorten voor een bijdrage in aanmerking komen:


      a. kosten van vooronderzoek in verband met de vermoede aanwezigheid van explosieven afkomstig uit de Tweede
      Wereldoorlog;


      b. kosten van opsporingswerkzaamheden;


      c. kosten van grondwerkzaamheden;


      d. kosten van preventieve maatregelen ter voorkoming van schade;


      e. kosten die gemaakt zijn in verband met het treffen van noodzakelijke spoedvoorzieningen.
    url: https://wetten.overheid.nl/BWBR0006236/1997-01-29#Artikel4
  - number: '5'
    text: |-
      Bij een ruiming kunnen de in [artikel 4 onder ][ref1] genoemde kostensoorten voor een bijdrage in aanmerking komen.


      [ref1]: https://wetten.overheid.nl/BWBR0006236#Artikel4
    url: https://wetten.overheid.nl/BWBR0006236/1997-01-29#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006236
        artikel: '4'
        paragraaf: '4'
  - number: '6'
    text: |-
      De kosten van de verzekering van het risico dat verbonden is aan het opsporen of ruimen van de explosieven zoals
      bedoeld in [artikel 3][ref1] van dit besluit, kunnen voor een bijdrage in aanmerking komen tenzij van rijkswege ter
      zake een collectieve verzekering is afgesloten of het risico door het Rijk is overgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006236#Artikel3
    url: https://wetten.overheid.nl/BWBR0006236/1997-01-29#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006236
        artikel: '3'
        paragraaf: '3'
  - number: '7'
    text: >-
      In geval van calamiteit kunnen, op verzoek van het bestuursorgaan, ook andere dan de in dit besluit vermelde
      kostensoorten voor een bijdrage in aanmerking komen, indien deze, naar het oordeel van Onze Ministers,
      redelijkerwijs niet of slechts gedeeltelijk voor rekening van het bestuursorgaan kunnen blijven.
    url: https://wetten.overheid.nl/BWBR0006236/1997-01-29#Artikel7
  - number: '8'
    text: |-
      Van grote risico's voor de bevolking als bedoeld in [artikel 3, eerste lid][ref1], is sprake indien:

      in geval van opsporing:

      a. het explosief zich vermoedelijk bevindt binnen de grens van de bebouwde kom van de gemeente gerekend naar
      de situatie op 1 januari 1994 dan wel de afstand van de vermoede inslagplaats van het explosief tot de grens
      van die bebouwde kom door de deskundigen kleiner wordt geacht dan de straal van de schervengevarenzone van het
      desbetreffende explosief en zich binnen de schervengevarenzone, gerekend naar de situatie per 1 januari 1994
      bebouwing bevindt dan wel een kwetsbare infrastructuur, en bovendien binnen een door deskundigen vastgestelde
      straal van de vermoede vindplaats van het explosief zodanige (grond) werkzaamheden worden verricht dat detonatie
      door deskundigen een reëel risico wordt geacht;

      b. zich in een gebied dat vrij toegankelijk is voor personen en waar reeds op 1 januari 1994 aantoonbaar sprake
      was van een intensief (recreatief) gebruik, op geringe diepte explosieven bevinden, terwijl het redelijkerwijs niet
      mogelijk is om beschermende maatregelen te treffen zoals het plaatsen van hekken en verbodsborden;

      c. er aantoonbaar sprake is van een ernstige verontreiniging van het grond- of oppervlaktewater als gevolg van
      de vermoede aanwezigheid van explosieven, terwijl het redelijkerwijs niet mogelijk is beschermende maatregelen te
      treffen zoals isolatie van het desbetreffende gebied;

      in geval van ruiming:

      d. het explosief aangetroffen is binnen de grens van de bebouwde kom van de gemeente dan wel de afstand tot de
      grens van die bebouwde kom kleiner is dan de straal van de schervengevarenzone van het desbetreffende explosief
      terwijl zich binnen de schervengevarenzone bebouwing bevindt;

      e. het explosief aangetroffen is in een gebied dat vrij toegankelijk is voor personen en waar aantoonbaar sprake
      is van een intensief (recreatief) gebruik, tenzij het redelijkerwijs mogelijk is om beschermende maatregelen te
      treffen zoals het plaatsen van hekken en verbodsborden;

      f. binnen de straal van de schervengevarenzone van het aangetroffen explosief sprake is van een kwetsbare
      infrastructuur.


      [ref1]: https://wetten.overheid.nl/BWBR0006236#Artikel3
    url: https://wetten.overheid.nl/BWBR0006236/1997-01-29#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006236
        artikel: '3'
        paragraaf: '3'
  - number: '9'
    text: |-
      Aan het bepaalde in [artikel 3, tweede lid][ref1], wordt voldaan als het bestuursorgaan, naar het oordeel van Onze
      Ministers, in voldoende mate kan aantonen dat:

      a. opsporingswerkzaamheden met behulp van dieptedetectie-apparatuur noodzakelijk zijn omdat binnen een door
      deskundigen vastgestelde straal van de vermoede vindplaats van het explosief, zodanige (grond) werkzaamheden worden
      verricht dat detonatie door deskundigen niet ondenkbaar wordt geacht;

      b. opsporingswerkzaamheden met behulp van oppervlaktedetectie-apparatuur noodzakelijk zijn omdat binnen een gebied
      waar de aanwezigheid van explosieven wordt vermoed eenvoudige verhardingen worden aangelegd of niet diepliggende
      leidingenstelsels en rioleringen.


      [ref1]: https://wetten.overheid.nl/BWBR0006236#Artikel3
    url: https://wetten.overheid.nl/BWBR0006236/1997-01-29#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006236
        artikel: '3'
        paragraaf: '3'
  - number: '10'
    text: |-
      Van het bepaalde in [artikel 9][ref1] kan worden afgeweken indien in een gebied sprake is van een zodanig ernstige
      verontreiniging van het grond- of oppervlaktewater als gevolg van de vermoede aanwezigheid van explosieven dat er
      grote risico's voor de bevolking ontstaan, terwijl het niet mogelijk is afdoende beheersingsmaatregelen te treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0006236#Artikel9
    url: https://wetten.overheid.nl/BWBR0006236/1997-01-29#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006236
        artikel: '9'
        paragraaf: '6'
  - number: '11'
    text: |-
      1 De overeenkomstig dit besluit voor een bijdrage in aanmerking komende kosten worden, onverminderd het
      bepaalde in de paragrafen 2 en 3, vergoed tot ten hoogste 90 %, voorzover de op grond van [paragraaf 5][ref1] in
      aanmerking komende kosten van een opsporing of ruiming uitgaan boven de ten laste van het bestuursorgaan blijvende
      drempelbijdrage.

      2 De in het eerste lid bedoelde drempelbijdrage wordt per opsporing of ruiming dan wel, naar het oordeel van Onze
      Ministers, op zich zelf staande onderdelen daarvan, bepaald door het aantal inwoners per 1 januari van het jaar
      voorafgaand aan het jaar waarin de werkzaamheden in uitvoering zijn genomen te vermenigvuldigen met f 5 tot een
      maximum van f 100.000.

      3 Indien het grondgebied van het bestuursorgaan op 1 januari van het jaar waarin de werkzaamheden in uitvoering
      zijn genomen gewijzigd is, wordt het in het tweede lid bedoelde aantal inwoners gesteld op het aantal inwoners op 1
      januari van dat jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0006236#Paragraaf5
    url: https://wetten.overheid.nl/BWBR0006236/1997-01-29#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006236
        paragraaf: '5'
  - number: '12'
    text: |-
      Indien het bestuursorgaan verkeert of door de toepassing van [artikel 11][ref1] zou komen te verkeren in
      omstandigheden zoals bedoeld in [artikel 12 van de Financiële-verhoudingswet][ref2], kan Onze Minister van
      Financiën in overeenstemming met Onze Minister van Binnenlandse Zaken, gelet op het advies van de Inspectie
      Financiën Lagere Overheden, op verzoek van burgemeester en wethouders het gemeentelijk aandeel in de voor een
      bijdrage in aanmerking komende kosten verlagen.


      [ref1]: https://wetten.overheid.nl/BWBR0006236#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0008290#Artikel12
    url: https://wetten.overheid.nl/BWBR0006236/1997-01-29#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006236
        artikel: '11'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0008290
        artikel: '12'
  - number: '13'
    text: >-
      1 Om in aanmerking te kunnen komen voor een bijdrage moet het bestuursorgaan een opsporing of ruiming vóór het
      aanvangstijdstip van de werkzaamheden schriftelijk melden bij Onze Minister alsmede een werkplan indienen.


      2 In de aanmelding van een opsporing dient ten minste te worden opgenomen:


      a. de reden van de opsporing;


      b. de uitkomsten van het vooronderzoek;


      c. de vermoede aard van het explosief;


      d. de straal van de schervengevarenzone;


      e. het gebied waarbinnen bepaalde (grond) werkzaamheden tot detonatie zouden kunnen leiden;


      f. de ligging van het vermoede explosief ten opzichte van de bebouwde kom en ten opzichte van de bebouwing of een
      kwetsbare infrastructuur in die bebouwde kom, uitgaande van de situatie op 1 januari 1994;


      g. de voorziene risico's voor de bevolking waaronder eventuele milieu-aspecten;


      h. de mogelijkheden om al dan niet beschermende maatregelen te treffen;


      i. een positief advies van het Explosieven Opruimings Commando van het Ministerie van Defensie;


      j. een situatietekening en een plattegrond van de gemeente.


      3 In de aanmelding van een ruiming dient ten minste te worden opgenomen:


      a. de aard van het explosief;


      b. de straal van de schervengevarenzone;


      c. de ligging van het explosief;


      d. de voorziene risico's voor de bevolking;


      e. de mogelijkheden om al dan niet beschermende maatregelen te treffen;


      f. een situatietekening en een plattegrond van de gemeente.


      4 In het werkplan dient ten minste te worden opgenomen:


      a. de werkzaamheden die verricht moeten worden als gevolg van de opsporing of ruiming van explosieven;


      b. bij een opsporing: de voorgestelde opsporingsmethode in relatie tot het (toekomstig) gebruik van de grond;


      c. de te treffen preventieve maatregelen ter voorkoming van schade;


      d. een gespecificeerde kostenraming;


      e. het tijdstip waarop met de werkzaamheden wordt begonnen.
    url: https://wetten.overheid.nl/BWBR0006236/1997-01-29#Artikel13
  - number: '14'
    text: |-
      1 De verplichtingenruimte, zoals bedoeld in [artikel 3, derde lid][ref1], wordt door Onze Minister onderverdeeld
      naar opsporingen en ruimingen.

      2 Indien de verplichtingenruimte voor opsporingen niet toereikend is worden de bijdragen voor opsporingen toegekend
      naar rato van het beschikbare bedrag.

      3 Indien de verplichtingenruimte voor ruimingen niet toereikend is worden de bijdragen voor ruimingen toegekend
      naar volgorde van aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0006236#Artikel3
    url: https://wetten.overheid.nl/BWBR0006236/1997-01-29#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006236
        artikel: '3'
        paragraaf: '3'
  - number: '15'
    text: >-
      1 Een verzoek tot toekenning van een bijdrage in de kosten van een opsporing wordt slechts in behandeling genomen
      als dit verzoek vóór 1 oktober van het aan het begrotingsjaar voorafgaande jaar schriftelijk bij Onze Minister
      is ingediend.


      2 Een verzoek tot toekenning van een bijdrage in de kosten van een ruiming dient uiterlijk binnen acht weken na
      afloop van de ruimingswerkzaamheden bij Onze Minister te zijn ingediend.


      3 Onze Ministers beslissen binnen acht weken na ontvangst van het verzoek. Indien de begrotingswet voor het in
      het eerste lid bedoelde begrotingsjaar nog niet is goedgekeurd wordt het besluit verzonden binnen vier weken na de
      publikatie van de begrotingswet in het *Staatsblad*.
    url: https://wetten.overheid.nl/BWBR0006236/1997-01-29#Artikel15
  - number: '16'
    text: >-
      1 Zo spoedig mogelijk doch uiterlijk op 31 december van het jaar volgend op het jaar waarin de werkzaamheden zijn
      beëindigd, dient het bestuursorgaan de declaratie, voorzien van bewijsstukken, in bij Onze Minister.


      2 Alle reeds gemaakte en nog te maken kosten worden in de declaratie opgenomen. Kosten waarvan de hoogte nog niet
      is vast te stellen worden geraamd.


      3 Voor kosten die na de in het eerste lid genoemde termijn worden gedeclareerd, wordt geen bijdrage gegeven.
    url: https://wetten.overheid.nl/BWBR0006236/1997-01-29#Artikel16
  - number: '17'
    text: >-
      1 Het bestuursorgaan dient bij de declaratie een verklaring af te leggen dat de in rekening gebrachte kosten
      onderworpen zijn aan de gebruikelijke controles en dat de werkzaamheden zijn verricht op de meest doelmatige wijze
      en op de voor het Rijk minst kostbare wijze.


      2 Indien de door het bestuursorgaan gedane uitgaven een bedrag van f 200.000 te boven gaan, dienen de uitgaven
      afzonderlijk tot uitdrukking te komen in de gemeenterekening opdat de accountantscontrole op de rekening tevens
      deze uitgaven omvat.
    url: https://wetten.overheid.nl/BWBR0006236/1997-01-29#Artikel17
  - number: '18'
    text: >-
      1 De bijdrage wordt pas definitief vastgesteld nadat de door het bestuursorgaan gemaakte kosten ten genoege van
      Onze Minister zijn aangetoond.


      2 Alvorens tot vaststelling van de bijdrage over te gaan kan Onze Minister een nader onderzoek doen instellen naar
      de noodzakelijkheid, de rechtmatigheid en de doelmatigheid van de gedeclareerde kosten.
    url: https://wetten.overheid.nl/BWBR0006236/1997-01-29#Artikel18
  - number: '19'
    text: >-
      1 Indien de werkelijke kosten van een opsporing of ruiming lager zijn dan de door het bestuursorgaan geraamde
      kosten, wordt de bijdrage definitief vastgesteld aan de hand van de werkelijke kosten.


      2 Indien de werkelijke kosten van een opsporing of ruiming hoger zijn dan de geraamde kosten wordt de bijdrage
      definitief vastgesteld aan de hand van de geraamde kosten.
    url: https://wetten.overheid.nl/BWBR0006236/1997-01-29#Artikel19
  - number: '20'
    text: |-
      1 Indien [artikel 19, tweede lid][ref1] van toepassing is, kan het bestuursorgaan binnen 6 weken na beëindiging van
      de werkzaamheden bij Onze Minister een verzoek indienen voor een aanvullende bijdrage.

      2 Indien het verzoek als bedoeld in het eerste lid, betrekking heeft op een opsporing is
      [artikel 14, tweede lid][ref2], van overeenkomstige toepassing.

      3 Bij het vaststellen van de betalingsvolgorde voor een aanvullende bijdrage zal, in geval van opsporing,
      in afwijking van het gestelde in [artikel 22, eerste lid][ref3], worden uitgegaan van het tijdstip waarop de
      opsporingswerkzaamheden zijn beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0006236#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0006236#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0006236#Artikel22
    url: https://wetten.overheid.nl/BWBR0006236/1997-01-29#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0006236
        artikel: '19'
        paragraaf: '11'
      - id: ref2
        bwb_id: BWBR0006236
        artikel: '14'
        paragraaf: '8'
      - id: ref3
        bwb_id: BWBR0006236
        artikel: '22'
        paragraaf: '12'
  - number: '21'
    text: |-
      De kasruimte voor de ruimingen wordt gelijkgesteld aan de op grond van [artikel 14, eerste lid][ref1], vastgestelde
      verplichtingenruimte voor de ruimingen. Onbesteed gebleven bedragen worden op 1 oktober van het begrotingsjaar
      toegevoegd aan de kasruimte voor de opsporingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006236#Artikel14
    url: https://wetten.overheid.nl/BWBR0006236/1997-01-29#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0006236
        artikel: '14'
        paragraaf: '8'
  - number: '22'
    text: >-
      1 De toegekende bijdragen in de kosten van een opsporing worden betaalbaar gesteld in de volgorde van het tijdstip
      waarop de opsporingswerkzaamheden in uitvoering zijn genomen.


      2 De toegekende bijdragen in de kosten van een ruiming worden betaalbaar gesteld in de volgorde van het tijdstip
      waarop de declaratie door Onze Minister is ontvangen.
    url: https://wetten.overheid.nl/BWBR0006236/1997-01-29#Artikel22
  - number: '23'
    text: >-
      In afwachting van de definitieve vaststelling van een bijdrage kan een voorlopige bijdrage betaalbaar worden
      gesteld. De voorlopige declaratie moet voorzien zijn van de nodige bewijsstukken.
    url: https://wetten.overheid.nl/BWBR0006236/1997-01-29#Artikel23
  - number: '24'
    text: >-
      Bij een overschrijding van de bij begrotingswet toegestane ruimte voor het doen van uitgaven, worden de bijdragen,
      met inachtneming van het gestelde in artikel 21, op een nader door Onze Minister te bepalen tijdstip uitbetaald.
    url: https://wetten.overheid.nl/BWBR0006236/1997-01-29#Artikel24
  - number: '25'
    text: |-
      Opsporingen en ruimingen die vóór 1 januari 1994 in uitvoering zijn genomen, worden mede betrokken bij de
      vaststelling van de betalingsvolgorde zoals genoemd in [artikel 22][ref1], voorzover de desbetreffende bijdragen
      bij de inwerkingtreding van dit besluit nog niet tot uitbetaling zijn gekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006236#Artikel22
    url: https://wetten.overheid.nl/BWBR0006236/1997-01-29#Artikel25
