  - number: '26'
    text: |-
      Bij de toepassing van [artikel 12][ref1] worden opsporingen en ruimingen dan wel, naar het oordeel van Onze
      Ministers, op zich zelf staande onderdelen daarvan, die vóór 1 januari 1994 in uitvoering zijn genomen, mede bij de
      beoordeling betrokken.


