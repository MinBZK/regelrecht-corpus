    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van de Staatssecretaris van Financiën van 16 juli 1993, nr. fip 93/337, in overeenstemming met
    Onze Minister van Binnenlandse Zaken en de Staatssecretaris van Defensie;


