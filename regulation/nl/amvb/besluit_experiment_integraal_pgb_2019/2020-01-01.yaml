      De krachtens [artikel 6.1 van de Wet maatschappelijke ondersteuning 2015][ref1] door het college aangewezen
      personen zijn belast met het houden van toezicht op de naleving van het bepaalde bij of krachtens dit besluit.
      Artikel 6.1, tweede en derde lid, van de Wet maatschappelijke ondersteuning 2015 is van overeenkomstige toepassing.


