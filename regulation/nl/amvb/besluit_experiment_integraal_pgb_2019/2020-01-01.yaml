        artikel: '1'
  - number: '2'
    text: |-
      1 Met dit experiment wordt beoogd inzicht te krijgen in de gevolgen en mogelijkheden van het integraal budget ten
      aanzien van:

      a. het flexibel gebruik van een integraal budget en de doelmatigheid van het integraal budget;

      b. het op elkaar aansluiten van de verscheidene diensten waarvan de deelnemer gebruik maakt en de kwaliteit van
      die diensten;

      c. de tevredenheid van de deelnemers, betrokken bestuursorganen en zorgverzekeraars;

      d. de omvang van de administratieve lasten van deelnemers in verhouding tot de afzonderlijke rechten en aanspraken,
      bedoeld in [artikel 3, eerste lid][ref1];

      e. de beoogde effecten op de kwaliteit van leven van zowel de deelnemer als van zijn sociaal netwerk.

      2 Met dit experiment wordt informatie verzameld over de gevolgen voor de kwaliteit van de door deelnemers afgenomen
      diensten, de gevolgen voor de zelfredzaamheid van de deelnemers, de budgettaire en juridische mogelijkheden en
      belemmeringen alsmede het toezicht en de handhaving bij het vormgeven van een integraal pakket aan diensten dat in
      de plaats treedt van de afzonderlijke aanspraken of rechten op die diensten.


      [ref1]: https://wetten.overheid.nl/BWBR0042404#Artikel3
    url: https://wetten.overheid.nl/BWBR0042404/2020-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0042404
        artikel: '3'
  - number: '3'
    text: |-
      1 Een verzekerde die tevens ingezetene is van de gemeente kan zich bij het college melden voor deelname aan het
      experiment. Een verzekerde kan slechts deelnemen aan het experiment zolang de verzekerde ten minste twee van de
      volgende rechten of aanspraken heeft:

      a. een persoonsgebonden budget als bedoeld in [artikel 1.1.1 van de Wet langdurige zorg][ref1];

      b. een persoonsgebonden budget als bedoeld in [artikel 1.1.1 van de Wet maatschappelijke ondersteuning 2015][ref2];

      c. een persoonsgebonden budget als bedoeld in [artikel 8.1.1 van de Jeugdwet][ref3]; of

      d. een Zvw-pgb.

      2 De aanspraken van de deelnemer op grond van het experiment treden gedurende de periode van het experiment in
      de plaats van zijn rechten en aanspraken, bedoeld in het eerste lid, over die periode. Onverminderd het derde en
      vierde lid en de [artikelen 6, tweede en vierde lid][ref4], [7, zesde lid][ref5], en [10][ref6], zijn de artikelen
      van de [Jeugdwet][ref7], de [Wet maatschappelijke ondersteuning 2015][ref8] en de [Zorgverzekeringswet][ref9]
      gedurende het experiment niet van toepassing op de betrokken diensten die de deelnemer uit het integraal budget
      bekostigt.

      3 Het bepaalde bij en krachtens de [Jeugdwet][ref10], de [Wet maatschappelijke ondersteuning 2015][ref11]
      en de [Zorgverzekeringswet][ref12] blijft van toepassing op de vaststelling van een gewijzigde behoefte
      van de deelnemer aan jeugdhulp, maatschappelijke ondersteuning, onderscheidenlijk zorg als bedoeld in
      [artikel 13a van de Zorgverzekeringswet][ref13]. De aanpassing van het bedrag van een deelbudget, geschiedt op de
      wijze waarop het bedrag van een aanspraak of recht als bedoeld in het eerste lid wordt herzien op grond van de in
      dat lid genoemde wetten.

      4 Het bij en krachtens de [Wet maatschappelijke ondersteuning 2015][ref14] en de [Jeugdwet][ref15]
      bepaalde over de kwaliteit van de door de deelnemers betrokken diensten, bedoeld in
      [artikel 5, derde lid, onderdeel b, onderscheidenlijk c][ref16], alsmede over het toezicht op die kwaliteit,
      blijft van toepassing op vorenbedoelde met het integraal budget bekostigde diensten, met dien verstande dat de
      [artikelen 4.1.2][ref17] en [4.1.3 van de Jeugdwet][ref18] buiten toepassing blijven.

      5 Het college treedt met de verzekerde die zich heeft gemeld voor deelname aan het experiment in overleg over de
      toegang tot het experiment. Indien de verzekerde in aanmerking komt voor deelname aan het experiment treedt het
      college in overleg met de verzekerde over het opstellen van een integraal pgb-plan en een ondersteuningsplan.

      6 Bij ministeriële regeling wordt per gemeente het aantal deelnemers bepaald dat ten hoogste aan het experiment kan
      deelnemen. Deze aantallen bedragen tezamen niet meer dan 500. De gemeente kan een lager maximumaantal vaststellen.
      Een lager maximum wordt bekend gemaakt in het gemeenteblad.

      7 Bij ministeriële regeling kunnen nadere regels worden gesteld over de wijze waarop zorgkantoren, zorgverzekeraars
      en gemeenten samenwerken om de met het experiment beoogde doelen te bereiken en de voorwaarden waaronder een
      verzekerde kan deelnemen aan het experiment. Deze voorwaarden kunnen per gemeente verschillen.

      8 Indien de deelname van een verzekerde aan het experiment wordt beëindigd, draagt het college zo nodig zorg voor
      een zorgvuldige begeleiding van de betrokkene ten behoeve van het verkrijgen van zorg, ondersteuning of jeugdhulp
      op grond van de in [artikel 3, eerste lid][ref19], genoemde wetten.


