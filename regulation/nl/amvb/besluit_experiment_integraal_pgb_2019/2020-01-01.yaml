    text: |-
      1 Een deelbudget voor een aanspraak of recht als bedoeld in [artikel 3, eerste lid, onderdeel a of d][ref1], wordt
      uitsluitend toegevoegd aan het integraal budget als het zorgkantoor, onderscheidenlijk de zorgverzekeraar, van de
      deelnemer hier schriftelijk mee heeft ingestemd.

      2 Indien de verzekerde onder meer aanspraak heeft op een deelbudget voor een aanspraak of recht als bedoeld in
      [artikel 3, eerste lid, onderdeel a of d][ref2], of een zodanig deelbudget onderdeel uitmaakt van het integraal
      budget dan wel de verzekerde aangeeft daar behoefte aan te hebben, neemt ook het zorgkantoor, onderscheidenlijk
      de zorgverzekeraar, van de verzekerde deel aan de overleggen, bedoeld in de artikelen 3, vijfde lid, en
      [5, eerste lid][ref3].

      3 Het zorgkantoor of de zorgverzekeraar van de deelnemer dat, onderscheidenlijk die, zich overeenkomstig het
      eerste lid schriftelijk bereid heeft verklaard tot het beschikbaar stellen van een deelbudget, verleent het college
      de medewerking die redelijkerwijs kan worden verlangd voor de uitvoering van het experiment ten aanzien van de
      betrokken deelnemer.


      [ref1]: https://wetten.overheid.nl/BWBR0042404#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0042404#Artikel3
