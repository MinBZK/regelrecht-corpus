articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

        - *college:* college van burgemeester en wethouders van de gemeente;
        - *deelbudget:* budget dat door of vanwege het zorgkantoor, het college of de zorgverzekeraar ter beschikking
      wordt gesteld voor het betrekken van zorg als bedoeld in [artikel 1.1.1 van de Wet langdurige zorg][ref1],
      maatschappelijke ondersteuning als bedoeld in [artikel 1.1.1 van de Wet maatschappelijke ondersteuning 2015][ref2],
      jeugdhulp als bedoeld in [artikel 1.1 van de Jeugdwet][ref3], onderscheidenlijk zorg als bedoeld in
      [artikel 13a van de Zorgverzekeringswet][ref4], en dat wordt toegevoegd aan het integraal budget;
        - *deelnemer:* verzekerde die toegang heeft gekregen tot het experiment;
        - *experiment:* experiment als bedoeld in [artikel 10.1.2, tweede lid, van de Wet langdurige zorg][ref5] in de
      gemeente, dat wordt uitgevoerd krachtens dit besluit;
        - *gegevens over gezondheid:* gegevens over gezondheid als bedoeld in artikel 4, onderdeel 15, van de Algemene
      verordening gegevensbescherming;
        - *gemeente:* gemeente Alphen aan den Rijn, Dalfsen, Den Haag, Leiden, Meppel, Nieuwegein, Roermond of Rotterdam;
        - *integraal budget:* aan de deelnemer verstrekte subsidie ten behoeve van de in het ondersteuningsplan bedoelde
      diensten;
        - *integraal pgb-plan:* integraal pgb-plan als bedoeld in [artikel 5, tweede lid][ref6];
        - *ondersteuningsplan:* ondersteuningsplan als bedoeld in [artikel 5, eerste lid][ref7];
        - *Zvw-pgb:* Zvw-pgb als bedoeld in [artikel 1, onderdeel k, van de Zorgverzekeringswet][ref8].


