  - number: '7'
    text: |-
      1 Het college stort de deelbudgetten voor maatschappelijke ondersteuning als bedoeld in
      [artikel 1.1.1 van de Wet maatschappelijke ondersteuning 2015][ref1] en jeugdhulp als bedoeld in
      [artikel 8.1.1 van de Jeugdwet][ref2], bij de Sociale verzekeringsbank.

      2 De zorgverzekeraar van de deelnemer stort voor die deelnemer het deelbudget ten behoeve van zorg als bedoeld in
      [artikel 13a van de Zorgverzekeringswet][ref3] bij de Sociale verzekeringsbank.

      3 De Sociale verzekeringsbank voert namens het college de betalingen ten laste van het verstrekte integraal budget
      en het hiermee verbonden budgetbeheer uit.

      4 De Sociale verzekeringsbank verricht uitsluitend betalingen overeenkomstig het ondersteuningsplan van de
      deelnemer.

      5 Bij ministeriële regeling worden nadere regels gesteld over het budgetbeheer, de betalingen en het staken van
      betalingen uit het integraal budget door de Sociale verzekeringsbank, het declareren ten laste van het integraal
      budget en de overeenkomst die de deelnemer sluit met de derde van wie hij diensten ontvangt en die daarvoor
      betaling ontvangt uit het integraal budget.

      6 De bepalingen over de bijdrage in de kosten, bedoeld in de [artikelen 3.2.5 van de Wet langdurige zorg][ref4]
      en [2.1.4a][ref5] en [2.1.4b van de Wet maatschappelijke ondersteuning 2015][ref6], zijn van overeenkomstige
      toepassing op de deelbudgetten, bedoeld in [artikel 3, eerste lid, onderdelen a en b][ref7], die door het college,
      onderscheidenlijk het zorgkantoor van de deelnemer, zijn toebedeeld ten behoeve van het integraal budget.


