  - number: '5'
    text: |-
      1 Het college stelt voor een deelnemer een ondersteuningsplan vast waarin wordt bepaald aan welke diensten het
      integraal budget kan worden besteed. Het ondersteuningsplan is afgestemd op de situatie van de deelnemer en diens
      behoefte aan diensten. Het college kan het ondersteuningsplan wijzigen naar aanleiding van een wijziging in het
      integraal budget of op verzoek van de deelnemer. Het college voert hierover overleg met de deelnemer.

      2 Alvorens een ondersteuningsplan wordt vastgesteld, biedt het college de deelnemer gelegenheid om een integraal
      pgb-plan in te dienen waarin hij aangeeft aan welke diensten hij behoefte heeft en wat de voorgenomen besteding
      is van het budget. Het college houdt bij het opstellen van het ondersteuningsplan rekening met het integraal
      pgb-plan en stelt ten behoeve van de totstandkoming van deze plannen cliëntondersteuning als bedoeld in
      [artikel 1.1.1 van de Wet maatschappelijke ondersteuning 2015][ref1] beschikbaar.

      3 Het ondersteuningsplan kan ten behoeve van het integraal pakket, bedoeld in
      [artikel 10.1.2, tweede lid, van de Wet langdurige zorg][ref2], de volgende diensten bevatten:

      a. zorg als bedoeld in
      [artikel 3.1.1, eerste lid, onderdelen a, onder 2°, b, f of g, van de Wet langdurige zorg][ref3];

      b. diensten, hulpmiddelen, woningaanpassingen als bedoeld in
      [artikel 1.1.1 van de Wet maatschappelijke ondersteuning 2015 ][ref4]en andere maatregelen die tot een
      maatwerkvoorziening van het college als bedoeld in dat artikel kunnen behoren;

      c. jeugdhulp als bedoeld in [artikel 1.1 van de Jeugdwet][ref5] die kan behoren tot een individuele voorziening van
      het college als bedoeld in [artikel 8.1.1 van die wet][ref6]; en

      d. zorg als bedoeld in [artikel 13a van de Zorgverzekeringswet][ref7].

      4 Bij het opstellen van het ondersteuningsplan wordt rekening gehouden met de gezamenlijke vraag naar diensten van
      deelnemers die tot hetzelfde huishouden dan wel dezelfde leefeenheid behoren, indien deze deelnemers daarom, met
      hun toestemming onderling afgestemd, verzoeken.

      5 [Hoofdstuk 8 van de Wet langdurige zorg][ref8] is niet van toepassing op met het integraal budget bekostigde
      zorg.


