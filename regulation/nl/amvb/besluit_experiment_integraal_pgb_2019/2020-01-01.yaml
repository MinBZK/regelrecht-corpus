  - number: '8'
    text: |-
      1 Het college, de Sociale verzekeringsbank, een derde aan wie ten laste van een integraal budget betalingen worden
      gedaan, het zorgkantoor en de zorgverzekeraar van de deelnemer zijn bevoegd tot het verwerken van persoonsgegevens
      van die deelnemer, waaronder gegevens betreffende gezondheid, voor zover dat noodzakelijk is voor de uitvoering van
      het experiment.

      2 De Sociale verzekeringsbank, een derde aan wie ten laste van een integraal budget betalingen worden gedaan,
      het zorgkantoor en de zorgverzekeraar van de deelnemer zijn bevoegd uit eigen beweging en desgevraagd verplicht
      kosteloos aan het college persoonsgegevens van die deelnemer, waaronder gegevens betreffende gezondheid, te
      verstrekken voor zover dat noodzakelijk is voor de uitvoering van het experiment.

      3 Het college en een derde aan wie ten laste van een integraal budget betalingen worden gedaan zijn bevoegd
      uit eigen beweging en desgevraagd verplicht kosteloos aan de Sociale verzekeringsbank persoonsgegevens
      van de deelnemer, waaronder gegevens betreffende gezondheid, te verstrekken voor zover dat noodzakelijk is
      voor de uitvoering van de taken, bedoeld bij of krachtens het bepaalde in [artikel 7][ref1], van de Sociale
      verzekeringsbank.

      4 Indien een deelbudget voor een aanspraak als bedoeld in [artikel 3, eerste lid, onderdeel a of d][ref2],
      onderdeel uitmaakt van het integraal budget, is het college bevoegd uit eigen beweging en desgevraagd verplicht
      kosteloos aan het zorgkantoor, onderscheidenlijk de zorgverzekeraar, van de deelnemer persoonsgegevens van die
      deelnemer, waaronder gegevens betreffende gezondheid, te verstrekken voor zover dat noodzakelijk is voor de
      uitvoering van het experiment.

      5 Onze Minister is bevoegd tot het verwerken van persoonsgegevens van de deelnemer, waaronder gegevens betreffende
      gezondheid, voor zover dat noodzakelijk is voor de evaluatie van het experiment.

      6 Het college, de Sociale verzekeringsbank, een derde aan wie ten laste van een integraal budget betalingen worden
      gedaan, het zorgkantoor en de zorgverzekeraar van de deelnemer zijn bevoegd uit eigen beweging en desgevraagd
      verplicht kosteloos aan Onze Minister persoonsgegevens van die deelnemer, waaronder gegevens betreffende
      gezondheid, te verstrekken voor zover dat noodzakelijk is voor de evaluatie van het experiment.


