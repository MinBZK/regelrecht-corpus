  - number: '9'
    text: |-
      1 Onze Minister zendt drie maanden voor het einde van de geldingsduur van dit besluit aan de Staten-Generaal een
      verslag over de doeltreffendheid, overeenkomstig de doelen, bedoeld in [artikel 2][ref1], en de effecten van het
      experiment in de praktijk, alsmede een standpunt inzake de voortzetting van dit besluit, anders dan als experiment.

      2 Het experiment wordt aan de hand van de volgende aspecten geëvalueerd:

      a. de effecten van de invoering van het integraal budget voor deelnemers op het gebied van zelfredzaamheid, de door
      de deelnemer ervaren kwaliteit van dienstverlening en de maatschappelijke kosten en baten;

      b. het op elkaar en op de behoefte van de deelnemer aansluiten van de verschillende diensten die de deelnemer
      betrekt en het aansluiten van de betrokken diensten van deelnemers in een gezamenlijk huishouden of leefeenheid;

      c. de effecten op de kwaliteit van leven van zowel de deelnemer als van zijn sociaal netwerk;

      d. administratieve en bestuurlijke lasten;

      e. toezicht en handhaving;

      f. de kosten per deelnemer die worden veroorzaakt door het experiment;

      g. tevredenheid van deelnemers, betrokken bestuursorganen en zorgverzekeraars;

      h. budgettaire en juridische belemmeringen bij het vormgeven van een integrale aanspraak op diensten.


      [ref1]: https://wetten.overheid.nl/BWBR0042404#Artikel2
