  - number: '6'
    text: |-
      1 Het college besluit tot verlening van het integraal budget aan de deelnemer. Het verleende integraal budget is
      gelijk aan de som van de deelbudgetten. In het besluit wordt omschreven welke deelbudgetten zijn gebundeld tot het
      integraal budget.

      2 De [artikelen 2.4.1 tot en met 2.4.3 van de Wet maatschappelijke ondersteuning 2015][ref1] zijn van toepassing,
      met dien verstande dat voor «persoonsgebonden budget» en «beslissing als bedoeld in [artikel 2.3.5][ref2] of
      [2.3.6][ref3]» wordt gelezen «integraal budget» en voor «[artikel 2.3.10, onderdeel a][ref4],» wordt gelezen
      «[artikel 4:48, eerste lid, onderdeel c, van de Algemene wet bestuursrecht][ref5]».

      3 Het college stelt het integraal budget ambtshalve vast binnen 22 weken na afloop van de periode waarvoor het
      is verleend. Het integraal budget wordt vastgesteld op basis van de werkelijk gemaakte kosten voor de in het
      ondersteuningsplan opgenomen diensten en bedraagt ten hoogste de som van de deelbudgetten. Indien het integraal
      budget wordt vastgesteld op een bedrag dat lager is dan de som van de deelbudgetten wordt het verschil tussen
      het bedrag van het vastgestelde budget en de som van de deelbudgetten naar rato van de beschikbaar gestelde
      deelbudgetten terugbetaald aan degenen die de deelbudgetten hebben gestort.

      4 Voor de vaststelling van een vereveningsbijdrage op grond van [artikel 34 van de Zorgverzekeringswet][ref6] wordt
      het verschil tussen het door de zorgverzekeraar van de deelnemer ter beschikking gestelde deelbudget en het aan
      de zorgverzekeraar terugbetaalde bedrag, bedoeld in het derde lid, aangemerkt als gerealiseerde kosten voor het
      cluster «variabele zorgkosten», bedoeld in [artikel 1, onderdeel h, van het Besluit zorgverzekering][ref7].

      5 Het college voert een administratie waaruit in ieder geval blijkt uit welke deelbudgetten het integraal budget
      van een deelnemer is opgebouwd, wat het bedrag van het integraal budget is en welk deel van dit bedrag reeds is
      gebruikt. Het zorgkantoor of de zorgverzekeraar van de deelnemer heeft inzage in de administratie met betrekking
      tot die deelnemer, indien ten behoeve van die deelnemer een deelbudget ter beschikking is gesteld voor het
      betrekken van zorg als bedoeld in [artikel 1.1.1 van de Wet langdurige zorg][ref8], onderscheidenlijk voor het
      betrekken van zorg als bedoeld in [artikel 13a van de Zorgverzekeringswet][ref9].


