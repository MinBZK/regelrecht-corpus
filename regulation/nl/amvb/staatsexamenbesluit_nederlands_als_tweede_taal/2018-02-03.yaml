  - number: '2'
    text: |-
      1 Dit besluit regelt het staatsexamen Nederlands als tweede taal. Het examen kent twee programma's: programma I en
      programma II.

      2 Programma I omvat een onderzoek naar de beheersing van de Nederlandse taal met het oog op het volgen
      van opleidingen of de uitoefening van functies op het niveau van een vakopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdeel c, van de Wet educatie en beroepsonderwijs][ref1] door hen voor wie het
      Nederlands niet de moedertaal is en die ten minste het niveau van het primair onderwijs hebben bereikt.

      3 Programma II omvat een onderzoek naar de beheersing van de Nederlandse taal met het oog op het volgen van
      opleidingen in het hoger onderwijs en de uitoefening van hogere functies door hen voor wie het Nederlands niet
      de moedertaal is en die wat betreft vooropleiding of werkervaring functioneren op ten minste het niveau van het
      middenkader.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.2
    url: https://wetten.overheid.nl/BWBR0006192/2018-02-03#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: 7.2.2
  - number: '4'
    text: |-
      1 Het College voor toetsen en examens stelt degenen die zulks wensen in de gelegenheid het examen of een of meer
      onderdelen daarvan af te leggen.

      2 Het examen wordt afgenomen volgens programma I onderscheidenlijk programma II.

      3 Een examen bestaat uit de examenonderdelen lezen, schrijven, luisteren en spreken in de Nederlandse taal.

      4 Een kandidaat die niet een volledig examen wenst af te leggen, kiest aan welk examenonderdeel of aan welke
      examenonderdelen van welk programma hij wenst deel te nemen.
    url: https://wetten.overheid.nl/BWBR0006192/2018-02-03#Artikel4
  - number: '5'
    text: |-
      1 Voor deelneming aan een volledig examen van programma I of II is een bedrag verschuldigd van € 180. Voor
      deelneming aan een examenonderdeel van programma I of II is per onderdeel een bedrag verschuldigd van € 45.

      2 De in het eerste lid bedoelde bedragen kunnen bij regeling van Onze Minister worden gewijzigd voor zover de
      consumentenprijsindex daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0006192/2018-02-03#Artikel5
  - number: '6'
    text: |-
      1 Indien een kandidaat zich ten aanzien van enig examenonderdeel aan enige onregelmatigheid schuldig maakt of
      heeft gemaakt kan het College voor toetsen en examens op voorstel van de examenleider het desbetreffende onderdeel
      ongeldig verklaren en de kandidaat op die grond het certificaat onthouden dan wel bepalen dat het certificaat eerst
      kan worden uitgereikt na een hernieuwd examen in door het College voor toetsen en examens aan te wijzen onderdelen
      en op een door het college te bepalen wijze.

      2 De examenleider doet zijn voorstel zo spoedig mogelijk nadat de onregelmatigheid aan hem bekend is geworden.
      Indien de onregelmatigheid eerst wordt ontdekt na afloop van het examen, kan het College voor toetsen en examens de
      kandidaat het desbetreffende certificaat onthouden.

      3 Het College voor toetsen en examens hoort de examenleider en de kandidaat alvorens een beslissing als bedoeld in
      het eerste of tweede lid te nemen en wijst bij haar beslissing op het bepaalde in het vierde lid. Het College voor
      toetsen en examens maakt haar beslissing zo mogelijk mondeling en in elk geval schriftelijk aan de kandidaat en in
      afschrift aan de inspectie bekend.

      4 De kandidaat kan tegen een besluit als bedoeld in dit artikel bezwaar maken bij het College voor toetsen
      en examens. De termijn voor het indienen van een bezwaarschrift bedraagt vijf dagen nadat het besluit aan de
      kandidaat is bekendgemaakt op de voorgeschreven wijze. Het College beslist binnen twee weken na ontvangst van het
      bezwaarschrift, tenzij het college deze termijn heeft verlengd met ten hoogste twee weken. Het College voor toetsen
      en examens stelt bij zijn beslissing zo nodig vast op welke wijze de kandidaat alsnog in de gelegenheid zal worden
      gesteld het examen geheel of gedeeltelijk af te leggen. Het College voor toetsen en examens deelt zijn beslissing
      mee aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0006192/2018-02-03#Artikel6
  - number: '7'
    text: Het examen strekt zich uit over de examenstof, omschreven in het examenprogramma.
    url: https://wetten.overheid.nl/BWBR0006192/2018-02-03#Artikel7
  - number: '8'
    text: |-
      Het examenprogramma omvat per programma en per examenonderdeel:

      a. een omschrijving van de examenstof, en

      b. de wijze waarop de beoordeling tot stand komt.
    url: https://wetten.overheid.nl/BWBR0006192/2018-02-03#Artikel8
  - number: '9'
    text: |-
      1 Het examen wordt onder verantwoordelijkheid van het College voor toetsen en examens afgenomen op een of meer door
      het College voor toetsen en examens aan te wijzen plaatsen.

      2 Voor elke plaats waar het examen wordt afgenomen, wijst het College voor toetsen en examens een examenleider en
      een voldoende aantal toezichthouders aan.
    url: https://wetten.overheid.nl/BWBR0006192/2018-02-03#Artikel9
  - number: '10'
    text: |-
      1 Het College voor toetsen en examens stelt uiterlijk één jaar voor aanvang van de examens het examenprogramma, de
      aanmeldingsprocedure en, indien het aantal beschikbare plaatsen beperkt is, het aantal kandidaten dat ten hoogste
      tot het examen kan worden toegelaten, vast en doet daarvan mededeling in de Staatscourant en, aan de inspectie en
      aan Onze Minister.

      2 Uiterlijk vier maanden voor aanvang van een examenjaar stelt het College voor toetsen en examens het
      examenreglement vast en doet daarvan mededeling in de Staatscourant en, aan de inspectie en aan Onze Minister. Het
      examenreglement omvat tenminste:

      a. de wijze waarop de examenonderdelen worden afgenomen alsmede de duur daarvan,

      b. de hulpmiddelen die mogen worden gebruikt bij het maken van de opgaven, en

      c. regels omtrent vaststelling en bekendmaking van de resultaten en de uitslag.

      3 Het College voor toetsen en examens maakt de plaatsen en tijdstippen waarop de examenonderdelen worden afgenomen
      tijdig voor aanvang van het examen aan de kandidaten bekend.
    url: https://wetten.overheid.nl/BWBR0006192/2018-02-03#Artikel10
  - number: '11'
    text: Het examen wordt ten minste twee maal per jaar afgenomen.
    url: https://wetten.overheid.nl/BWBR0006192/2018-02-03#Artikel11
  - number: '12'
    text: |-
      1 Het werk van de kandidaten wordt door of namens het College voor toetsen en examens beoordeeld. Het College voor
      toetsen en examens wijst daartoe twee beoordelaars aan die onafhankelijk van elkaar het werk beoordelen.

      2 Na de beoordeling, bedoeld in het eerste lid, kan het College voor toetsen en examens het werk aan een derde
      beoordelaar voorleggen, volgens voorschriften van het College voor toetsen en examens.
    url: https://wetten.overheid.nl/BWBR0006192/2018-02-03#Artikel12
  - number: '13'
    text: |-
      1 Indien een kandidaat om een geldige reden, ter beoordeling van het College voor toetsen en examens, verhinderd is
      bij een of meer examenonderdelen aanwezig te zijn, wordt hem de gelegenheid gegeven die examenonderdelen alsnog af
      te leggen op een door het College voor toetsen en examens na overleg met de kandidaat te bepalen moment.

      2 In het geval, bedoeld in het eerste lid, is niet opnieuw examengeld verschuldigd.
    url: https://wetten.overheid.nl/BWBR0006192/2018-02-03#Artikel13
  - number: '14'
    text: |-
      1 Het resultaat van elk examenonderdeel wordt uitgedrukt in "voldoende" dan wel "onvoldoende".

      2 Het College voor toetsen en examens stelt voor elk examenonderdeel het resultaat vast.
    url: https://wetten.overheid.nl/BWBR0006192/2018-02-03#Artikel14
  - number: '15'
    text: |-
      De kandidaat is geslaagd voor een examen indien voor alle examenonderdelen van een programma het resultaat
      voldoende is.
    url: https://wetten.overheid.nl/BWBR0006192/2018-02-03#Artikel15
  - number: '16'
    text: |-
      1 Aan de kandidaat die is geslaagd voor een examen, wordt een diploma uitgereikt.

      2 Aan de kandidaat die voor een of meer examenonderdelen een voldoende resultaat heeft behaald, wordt een
      certificaat uitgereikt. Op het certificaat wordt ten minste vermeld het examenonderdeel waarvoor het certificaat
      is verleend.

      3 Een diploma, als bedoeld in het eerste lid, wordt tevens uitgereikt aan degene die certificaten overlegt van alle
      examenonderdelen, bedoeld in [artikel 4, derde lid][ref1].

      4 Het College voor toetsen en examens stelt modellen van de diploma's en de certificaten voor programma I
      onderscheidenlijk programma II vast.

      5 Duplicaten van diploma's en certificaten worden niet uitgereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0006192#Artikel4
    url: https://wetten.overheid.nl/BWBR0006192/2018-02-03#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006192
        artikel: '4'
        hoofdstuk: I
  - number: '17'
    text: |-
      1 Het College voor toetsen en examens bewaart het examenwerk gedurende zes maanden na afloop van het examen ter
      kennisneming voor de kandidaat.

      2 Na afloop van de zes maanden kan het werk worden vernietigd.

      3 Het College voor toetsen en examens verstrekt de examenresultaten van de inburgeringsplichtige, bedoeld
      in [artikel 1, eerste lid, onderdeel b, van de Wet inburgering][ref1], en de inburgeraar, bedoeld in
      [artikel 1, eerste lid, onderdeel r, van het Besluit brede doeluitkering sociaal, integratie en veiligheid][ref2]
      of [artikel 1, onderdeel h, van de Regeling vrijwillige inburgering niet-G31 2007][ref3], aan de
      Informatie Beheer Groep ten behoeve van opname in het Informatiesysteem Inburgering, bedoeld in
      [artikel 47 van de Wet inburgering][ref4].

      4 Het College voor toetsen en examens kan, met goedvinden van de kandidaat, de examenresultaten aan derden bekend
      maken.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0018238#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0020646#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0020611#Artikel47
    url: https://wetten.overheid.nl/BWBR0006192/2018-02-03#Artikel17
    references:
