  - number: '18'
    text: |-
      In gevallen waarin dit besluit niet voorziet en waaromtrent een onmiddellijke beslissing noodzakelijk is, beslist
      het College voor toetsen en examens. Het College voor toetsen en examens deelt haar beslissing zo spoedig mogelijk
      mede aan de betrokken examenleiders en aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0006192/2018-02-03#Artikel18
  - number: '19'
    text: |-
      Indien een of meer examenonderdelen of het gehele examen naar het oordeel van de inspectie niet op de
      voorgeschreven wijze zijn afgelegd dan wel kunnen worden afgelegd, dan wel indien het afnemen van een
      examenonderdeel of het examen niet op behoorlijke wijze is geschied en het College voor toetsen en examens niet of
      niet naar behoren voorzieningen treft, beslist de inspectie hoe alsdan moet worden gehandeld.
    url: https://wetten.overheid.nl/BWBR0006192/2018-02-03#Artikel19
  - number: '20'
    text: |-
      Het College voor toetsen en examens kan toestaan dat een gehandicapte kandidaat het examen geheel of gedeeltelijk
      aflegt op een wijze die is aangepast aan de mogelijkheden van die kandidaat. In dat geval bepaalt het College
      voor toetsen en examens na overleg met de inspectie de wijze waarop het examen zal worden afgelegd, zodanig dat
      de eisen die bij het examen aan de kandidaat worden gesteld, zoveel mogelijk gelijk zijn aan die voor de andere
      kandidaten. Het College voor toetsen en examens doet hiervan zo spoedig mogelijk mededeling aan de kandidaat en aan
      de inspectie.
    url: https://wetten.overheid.nl/BWBR0006192/2018-02-03#Artikel20
  - number: '21'
    text: |-
      1 Ten behoeve van de toetsontwikkeling is het College voor toetsen en examens gerechtigd de gegevens te verzamelen
      van kandidaten omtrent:

      a. nationaliteit,

      b. vooropleiding, en

      c. leeftijd.

      2 Het College voor toetsen en examens kan ten behoeve van de toetsontwikkeling de kandidaat verzoeken om meer
      gegevens dan die bedoeld in het eerste lid. Het College voor toetsen en examens deelt de kandidaat mede dat hij
      niet verplicht is deze gegevens te verstrekken.

      3 De gegevens, bedoeld in het eerste en tweede lid, worden bewaard op een niet op de persoon herleidbare wijze. De
      gegevens kunnen langer worden bewaard dan het examenwerk, bedoeld in [artikel 17][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006192#Artikel17
    url: https://wetten.overheid.nl/BWBR0006192/2018-02-03#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0006192
        artikel: '17'
        hoofdstuk: VI
  - number: '22'
    text: |-
      Een ieder die betrokken is bij de uitvoering van dit besluit en daarbij de beschikking krijgt over gegevens waarvan
      hij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden, en voor wie niet reeds uit hoofde van
      ambt, beroep of wettelijk voorschrift ter zake van die gegevens een geheimhoudingsplicht geldt, is verplicht tot
      geheimhouding daarvan, behoudens voor zover enig wettelijk voorschrift hem tot bekendmaking verplicht of uit zijn
      taak bij de uitvoering van dit besluit noodzaak tot bekendmaking voortvloeit.
    url: https://wetten.overheid.nl/BWBR0006192/2018-02-03#Artikel22
  - number: '23'
    text: |-
      Certificaten, voor 1 januari 1994 toegekend door de Tijdelijke voorbereidingscommissie Staatsexamens Nederlands
      als tweede taal, ingesteld bij besluit van Onze Minister van 12 maart 1992 (*Uitleg OenW-Regelingen* 1992, nr.
      8) worden aangemerkt als certificaten, verkregen op grond van dit besluit. Degene die certificaten overlegt van
      alle examenonderdelen, behorend tot een programma, als geëxamineerd door de Tijdelijke voorbereidingscommissie
      Staatsexamens Nederlands als tweede taal, ontvangt een diploma als bedoeld in [artikel 16, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006192#Artikel16
    url: https://wetten.overheid.nl/BWBR0006192/2018-02-03#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0006192
        artikel: '16'
        hoofdstuk: V
  - number: '25'
    text: |-
      Dit besluit treedt in werking met ingang van de eerste dag na de datum van uitgifte van het *Staatsblad* waarin het
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0006192/2018-02-03#Artikel25
  - number: '26'
    text: 'Dit besluit wordt aangehaald als: Staatsexamenbesluit Nederlands als tweede taal.'
    url: https://wetten.overheid.nl/BWBR0006192/2018-02-03#Artikel26
