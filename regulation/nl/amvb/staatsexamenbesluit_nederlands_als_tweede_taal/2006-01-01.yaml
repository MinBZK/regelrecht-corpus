    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Onderwijs en Wetenschappen van 25 mei 1993, nr. 93030035/3245, directie
    Wetgeving en Juridische Zaken;

    Gelet op artikel 60, tweede lid, van de Wet op het voortgezet onderwijs;

    Gezien het advies van de Onderwijsraad (advies van 11 januari 1993, nr. OR 92000270/S);

    De Raad van State gehoord (advies van 31 augustus 1993, nr. W05.93.0327);

    Gezien het nader rapport van Onze Minister van Onderwijs en Wetenschappen van 7 oktober 1993, nr. 9307 1358/3245,
    directie Wetgeving en Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder: "Onze Minister": Onze Minister van Onderwijs, Cultuur en Wetenschap,
      "wet": de [Wet op het voortgezet onderwijs][ref1], "Informatie Beheer Groep": de Informatie Beheer Groep,
      genoemd in de [Wet verzelfstandiging Informatiseringsbank][ref2], "inspectie": de inspectie, bedoeld in
      [artikel 113 van de wet][ref3], "examen": het staatsexamen Nederlands als tweede taal, "examenjaar": het tijdvak
      dat aanvangt op 1 januari van een jaar en eindigt op 31 december van dat jaar, "examenonderdeel": een onderdeel
      van het examen als bedoeld in [artikel 4, derde lid][ref4], "examenprogramma": het examenprogramma, bedoeld in
      [artikel 8][ref5], "examenreglement": het examenreglement, bedoeld in [artikel 10, tweede lid][ref6], "commissie":
      de staatsexamencommissie, bedoeld in [artikel 3][ref7], "examenleider": degene die door de commissie is belast met
      de leiding bij het afnemen van het examen, "diploma": het diploma Nederlands als tweede taal, "certificaat": een
      certificaat als bedoeld in [artikel 16, tweede lid][ref8], "kandidaat": degene die aan een of meer examenonderdelen
      deelneemt.


