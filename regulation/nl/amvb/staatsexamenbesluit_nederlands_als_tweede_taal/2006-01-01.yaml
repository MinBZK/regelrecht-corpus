  - number: '2.1'
    text: |-
      Dit besluit regelt het staatsexamen Nederlands als tweede taal. Het examen kent twee programma's: programma I en
      programma II.
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel2
  - number: '2.2'
    text: |-
      Programma I omvat een onderzoek naar de beheersing van de Nederlandse taal met het oog op het volgen
      van opleidingen of de uitoefening van functies op het niveau van een vakopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdeel c, van de Wet educatie en beroepsonderwijs][ref1] door hen voor wie het
      Nederlands niet de moedertaal is en die ten minste het niveau van het primair onderwijs hebben bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: '2.3'
    text: |-
      Programma II omvat een onderzoek naar de beheersing van de Nederlandse taal met het oog op het volgen van
      opleidingen in het hoger onderwijs en de uitoefening van hogere functies door hen voor wie het Nederlands niet
      de moedertaal is en die wat betreft vooropleiding of werkervaring functioneren op ten minste het niveau van het
      middenkader.
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel2
  - number: '3.1'
    text: |-
      De Informatie Beheer Groep na overleg met Onze Minister benoemt de voorzitter, de secretaris en de overige leden
      van de staatsexamencommissie Nederlands als tweede taal voor een door hem te bepalen termijn.
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel3
  - number: '3.2'
    text: 'Het lidmaatschap eindigt:'
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel3
  - number: 3.2.a
    text: door het verstrijken van de termijn waarvoor de benoeming is geschied, of
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel3
  - number: 3.2.b
    text: door ontslag, al dan niet op eigen verzoek.
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel3
  - number: '3.3'
    text: 'De commissie heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel3
  - number: 3.3.a
    text: het vaststellen van het examenprogramma en het examenreglement,
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel3
  - number: 3.3.b
    text: het vaststellen van de examenopgaven en de daarbij behorende beoordelingsnormen,
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel3
  - number: 3.3.c
    text: het doen uitoefenen van de functies van examenleider en toezichthouder,
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel3
  - number: 3.3.d
    text: het opstellen van voorschriften voor de wijze van beoordeling van het examenwerk,
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel3
  - number: 3.3.e
    text: het uitoefenen of doen uitoefenen van de functie van beoordelaar,
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel3
  - number: 3.3.f
    text: de zorg voor het goede verloop van de examens, en
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel3
  - number: 3.3.g
    text: het uitreiken of doen uitreiken van diploma's en certificaten.
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel3
  - number: '3.4'
    text: |-
      Bij ministeriële regeling worden voorschriften gegeven voor de vergoeding van de kosten van de voorzitter, de
      secretaris en de overige leden van de commissie, de examenleiders, toezichthouders en beoordelaars, tot ten hoogste
      een bij die regeling te bepalen bedrag.
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel3
  - number: '4.1'
    text: |-
      De commissie stelt degenen die zulks wensen in de gelegenheid het examen of een of meer onderdelen daarvan af te
      leggen.
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel4
  - number: '4.2'
    text: Het examen wordt afgenomen volgens programma I onderscheidenlijk programma II.
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel4
  - number: '4.3'
    text: Een examen bestaat uit de examenonderdelen lezen, schrijven, luisteren en spreken in de Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel4
  - number: '4.4'
    text: |-
      Een kandidaat die niet een volledig examen wenst af te leggen, kiest aan welk examenonderdeel of aan welke
      examenonderdelen van welk programma hij wenst deel te nemen.
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel4
  - number: '5'
    text: |-
      Voor deelneming aan een volledig examen van programma I of II is een bedrag verschuldigd van € 90. Voor deelneming
      aan een examenonderdeel van programma I of II is per onderdeel een bedrag verschuldigd van € 22,50.
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel5
  - number: '6.1'
    text: |-
      Indien een kandidaat zich ten aanzien van enig examenonderdeel aan enige onregelmatigheid schuldig maakt of heeft
      gemaakt kan de commissie op voorstel van de examenleider het desbetreffende onderdeel ongeldig verklaren en de
      kandidaat op die grond het certificaat onthouden dan wel bepalen dat het certificaat eerst kan worden uitgereikt na
      een hernieuwd examen in door de commissie aan te wijzen onderdelen en op een door haar te bepalen wijze.
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel6
  - number: '6.2'
    text: |-
      De examenleider doet zijn voorstel zo spoedig mogelijk nadat de onregelmatigheid aan hem bekend is geworden. Indien
      de onregelmatigheid eerst wordt ontdekt na aloop van het examen, kan de commissie de kandidaat het desbetreffende
      certificaat onthouden.
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel6
  - number: '6.3'
    text: |-
      De commissie hoort de examenleider en de kandidaat alvorens een beslissing als bedoeld in het eerste of tweede
      lid te nemen en wijst bij haar beslissing op het bepaalde in het vierde lid. De commissie maakt haar beslissing zo
      mogelijk mondeling en in elk geval schriftelijk aan de kandidaat en in afschrift aan de inspectie bekend.
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel6
  - number: '6.4'
    text: |-
      De kandidaat kan tegen een beslissing van de staatsexamencommissie in beroep gaan bij de door de Informatie Beheer
      Groep in te stellen commissie van beroep. Van de commissie van beroep mogen leden van de staatsexamencommissie geen
      deel uitmaken. Het beroep wordt binnen drie dagen nadat de beslissing schriftelijk ter kennis van de kandidaat is
      gebracht, schriftelijk bij de commissie van beroep ingesteld. De commissie van beroep stelt een onderzoek in en
      beslist binnen twee weken op het beroep tenzij zij de termijn met redenen omkleed heeft verlengd met ten hoogste
      twee weken. De commissie van beroep stelt bij haar beslissing zo nodig vast op welke wijze de kandidaat alsnog
      in de gelegenheid zal worden gesteld het examen geheel of gedeeltelijk af te leggen of opnieuw af te leggen. De
      commissie van beroep deelt haar beslissing schriftelijk mede aan de kandidaat en aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel6
  - number: '7'
    text: Het examen strekt zich uit over de examenstof, omschreven in het examenprogramma.
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel7
  - number: '8.1'
    text: 'Het examenprogramma omvat per programma en per examenonderdeel:'
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel8
  - number: 8.1.a
    text: een omschrijving van de examenstof, en
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel8
  - number: 8.1.b
    text: de wijze waarop de beoordeling tot stand komt.
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel8
  - number: '8.2'
    text: Onze Minister kan algemene aanwijzingen geven omtrent de inhoud van het examenprogramma.
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel8
  - number: '9.1'
    text: |-
      Het examen wordt onder verantwoordelijkheid van de commissie afgenomen op een of meer door de commissie aan te
      wijzen plaatsen.
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel9
  - number: '9.2'
    text: |-
      Voor elke plaats waar het examen wordt afgenomen, wijst de commissie een examenleider en een voldoende aantal
      toezichthouders aan.
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel9
  - number: '10.1'
    text: |-
      De commissie stelt uiterlijk één jaar voor aanvang van de examens het examenprogramma, de aanmeldingsprocedure en,
      indien het aantal beschikbare plaatsen beperkt is, het aantal kandidaten dat ten hoogste tot het examen kan worden
      toegelaten, vast en doet daarvan mededeling in de Staatscourant en, aan de inspectie en aan de Informatie Beheer
      Groep.
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel10
  - number: '10.2'
    text: |-
      Uiterlijk vier maanden voor aanvang van een examenjaar stelt de commissie het examenreglement vast en doet daarvan
      mededeling in de Staatscourant en, aan de inspectie en aan de Informatie Beheer Groep. Het examenreglement omvat
      tenminste:
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel10
  - number: 10.2.a
    text: de wijze waarop de examenonderdelen worden afgenomen alsmede de duur daarvan,
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel10
  - number: 10.2.b
    text: de hulpmiddelen die mogen worden gebruikt bij het maken van de opgaven, en
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel10
  - number: 10.2.c
    text: regels omtrent vaststelling en bekendmaking van de resultaten en de uitslag.
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel10
  - number: '10.3'
    text: |-
      De commissie maakt de plaatsen en tijdstippen waarop de examenonderdelen worden afgenomen tijdig voor aanvang van
      het examen aan de kandidaten bekend.
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel10
  - number: '11'
    text: Het examen wordt ten minste twee maal per jaar afgenomen.
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel11
  - number: '12.1'
    text: |-
      Het werk van de kandidaten wordt door of namens de commissie beoordeeld. De commissie wijst daartoe twee
      beoordelaars aan die onafhankelijk van elkaar het werk beoordelen.
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel12
  - number: '12.2'
    text: |-
      Na de beoordeling, bedoeld in het eerste lid, kan de commissie het werk aan een derde beoordelaar voorleggen,
      volgens voorschriften van de commissie.
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel12
  - number: '13.1'
    text: |-
      Indien een kandidaat om een geldige reden, ter beoordeling van de commissie, verhinderd is bij een of meer
      examenonderdelen aanwezig te zijn, wordt hem de gelegenheid gegeven die examenonderdelen alsnog af te leggen op een
      door de commissie na overleg met de kandidaat te bepalen moment.
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel13
  - number: '13.2'
    text: In het geval, bedoeld in het eerste lid, is niet opnieuw examengeld verschuldigd.
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel13
  - number: '14.1'
    text: Het resultaat van elk examenonderdeel wordt uitgedrukt in "voldoende" dan wel "onvoldoende".
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel14
  - number: '14.2'
    text: De commissie stelt voor elk examenonderdeel het resultaat vast.
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel14
  - number: '15.1'
    text: De commissie stelt de uitslag van het examen vast.
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel15
  - number: '15.2'
    text: |-
      De kandidaat is geslaagd voor een examen indien voor alle examenonderdelen van een programma het resultaat
      voldoende is.
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel15
  - number: '16.1'
    text: Aan de kandidaat die is geslaagd voor een examen, wordt een diploma uitgereikt.
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel16
  - number: '16.2'
    text: |-
      Aan de kandidaat die voor een of meer examenonderdelen een voldoende resultaat heeft behaald, wordt een certificaat
      uitgereikt. Op het certificaat wordt ten minste vermeld het examenonderdeel waarvoor het certificaat is verleend.
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel16
  - number: '16.3'
    text: |-
      Een diploma, als bedoeld in het eerste lid, wordt tevens uitgereikt aan degene die certificaten overlegt van alle
      examenonderdelen, bedoeld in [artikel 4, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006192#Artikel4
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006192
        artikel: '4'
        hoofdstuk: I
  - number: '16.4'
    text: |-
      De commissie stelt modellen van de diploma's en de certificaten voor programma I onderscheidenlijk programma II
      vast.
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel16
  - number: '16.5'
    text: Duplicaten van diploma's en certificaten worden niet uitgereikt.
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel16
  - number: '17.1'
    text: |-
      De commissie bewaart het examenwerk gedurende zes maanden na afloop van het examen ter kennisneming voor de
      kandidaat.
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel17
  - number: '17.2'
    text: Na afloop van de zes maanden kan het werk worden vernietigd.
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel17
  - number: '17.3'
    text: De commissie kan, met goedvinden van de kandidaat, de examenresultaten aan derden bekend maken.
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel17
  - number: '18'
    text: |-
      In gevallen waarin dit besluit niet voorziet en waaromtrent een onmiddellijke beslissing noodzakelijk is, beslist
      de commissie. De commissie deelt haar beslissing zo spoedig mogelijk mede aan de betrokken examenleiders en aan
      de inspectie.
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel18
  - number: '19'
    text: |-
      Indien een of meer examenonderdelen of het gehele examen naar het oordeel van de inspectie niet op de
      voorgeschreven wijze zijn afgelegd dan wel kunnen worden afgelegd, dan wel indien het afnemen van een
      examenonderdeel of het examen niet op behoorlijke wijze is geschied en de commissie niet of niet naar behoren
      voorzieningen treft, beslist de inspectie hoe alsdan moet worden gehandeld.
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel19
  - number: '20'
    text: |-
      De commissie kan toestaan dat een gehandicapte kandidaat het examen geheel of gedeeltelijk aflegt op een wijze die
      is aangepast aan de mogelijkheden van die kandidaat. In dat geval bepaalt de commissie na overleg met de inspectie
      de wijze waarop het examen zal worden afgelegd, zodanig dat de eisen die bij het examen aan de kandidaat worden
      gesteld, zoveel mogelijk gelijk zijn aan die voor de andere kandidaten. De commissie doet hiervan zo spoedig
      mogelijk mededeling aan de kandidaat en aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel20
  - number: '21.1'
    text: 'Ten behoeve van de toetsontwikkeling is de commissie gerechtigd de gegevens te verzamelen van kandidaten omtrent:'
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel21
  - number: 21.1.a
    text: nationaliteit,
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel21
  - number: 21.1.b
    text: vooropleiding, en
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel21
  - number: 21.1.c
    text: leeftijd.
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel21
  - number: '21.2'
    text: |-
      De commissie kan ten behoeve van de toetsontwikkeling de kandidaat verzoeken om meer gegevens dan die bedoeld in
      het eerste lid. De commissie deelt de kandidaat mede dat hij niet verplicht is deze gegevens te verstrekken.
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel21
  - number: '21.3'
    text: |-
      De gegevens, bedoeld in het eerste en tweede lid, worden bewaard op een niet op de persoon herleidbare wijze. De
      gegevens kunnen langer worden bewaard dan het examenwerk, bedoeld in [artikel 17][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006192#Artikel17
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0006192
        artikel: '17'
        hoofdstuk: VI
  - number: '22'
    text: |-
      Een ieder die betrokken is bij de uitvoering van dit besluit en daarbij de beschikking krijgt over gegevens waarvan
      hij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden, en voor wie niet reeds uit hoofde van
      ambt, beroep of wettelijk voorschrift ter zake van die gegevens een geheimhoudingsplicht geldt, is verplicht tot
      geheimhouding daarvan, behoudens voor zover enig wettelijk voorschrift hem tot bekendmaking verplicht of uit zijn
      taak bij de uitvoering van dit besluit noodzaak tot bekendmaking voortvloeit.
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel22
  - number: '23'
    text: |-
      Certificaten, voor 1 januari 1994 toegekend door de Tijdelijke voorbereidingscommissie Staatsexamens Nederlands
      als tweede taal, ingesteld bij besluit van Onze Minister van 12 maart 1992 (*Uitleg OenW-Regelingen* 1992, nr.
      8) worden aangemerkt als certificaten, verkregen op grond van dit besluit. Degene die certificaten overlegt van
      alle examenonderdelen, behorend tot een programma, als geëxamineerd door de Tijdelijke voorbereidingscommissie
      Staatsexamens Nederlands als tweede taal, ontvangt een diploma als bedoeld in [artikel 16, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006192#Artikel16
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0006192
        artikel: '16'
        hoofdstuk: V
  - number: '24'
    text: |-
      Bij ministeriële regeling kunnen in afwijking van dit besluit regels worden gegeven omtrent de examens en
      examenonderdelen die worden afgenomen voor 1 januari 1994.
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel24
  - number: '25'
    text: |-
      Dit besluit treedt in werking met ingang van de eerste dag na de datum van uitgifte van het *Staatsblad* waarin het
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel25
  - number: '26'
    text: 'Dit besluit wordt aangehaald als: Staatsexamenbesluit Nederlands als tweede taal.'
    url: https://wetten.overheid.nl/BWBR0006192/2006-01-01#Artikel26
