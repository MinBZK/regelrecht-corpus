  - number: '10'
    text: |-
      1 In afwijking van [artikel 6, eerste lid, onderdelen a en c][ref1], vindt op aanvraag van de verzekerde een
      voorlopige vaststelling van het bijdrageplichtig inkomen plaats op basis van het redelijkerwijs gedurende het
      lopende kalenderjaar te verwachten inkomen, het te verwachten vermogen, en de over dat kalenderjaar te verwachten
      belasting indien toepassing van artikel 6, eerste lid, onderdelen a en c, ertoe zou leiden dat na afdracht
      van de bijdrage maandelijks gemiddeld minder over zou blijven dan het van toepassing zijnde bedrag, vermeld in
      [artikel 23, eerste lid, van de Wet werk en bijstand][ref2], zoals dat geldt in het lopende kalenderjaar, alsmede
      een bedrag in verband met de standaardpremie gecorrigeerd met de zorgtoeslag. Het aldus berekende bijdrageplichtig
      inkomen wordt, om de per maand verschuldigde bijdrage vast te stellen, gedeeld door twaalf.

      2 De aanvraag, bedoeld in het eerste lid, wordt gedaan uiterlijk drie maanden na afloop van het kalenderjaar waarop
      de aanvraag betrekking heeft.

      3 Indien het eerste lid is toegepast, vindt na afloop van het jaar definitieve vaststelling plaats. Indien
      daaruit blijkt dat niet voldaan is aan het eerste lid, vindt definitieve vaststelling plaats met toepassing van
      [artikel 6][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008253#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0008253#Artikel6
