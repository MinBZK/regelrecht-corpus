  - number: 1a
    text: |-
      1 Het vermogen van een verzekerde is het verschil tussen zijn vermogensgrondslag en de op grond van het vierde tot
      en met het zesde lid voor hem toegepaste verminderingen met dien verstande dat het ten minste nihil bedraagt.

      2 De vermogensgrondslag van een verzekerde is zijn grondslag sparen en beleggen, over het peiljaar, of indien over
      het peiljaar [artikel 5.2, tweede lid, van de Wet inkomstenbelasting 2001][ref1] op de verzekerde van toepassing
      is, het aan hem toegerekende gedeelte van de toepasselijke gezamenlijke grondslag sparen en beleggen, bedoeld in
      dat lid.

      3 In afwijking van het tweede lid is de vermogensgrondslag van een verzekerde bij toepassing
      jegens hem van [artikel 8][ref2], [artikel 10, eerste lid][ref3], [artikel 15, derde lid][ref4], of
      [artikel 16e, derde lid][ref5], de te verwachten grondslag sparen en beleggen over het lopende jaar, of indien
      [artikel 5.2, tweede lid, van de Wet inkomstenbelasting 2001][ref6] vermoedelijk op de verzekerde van toepassing
      zal zijn, het te verwachten aan hem toe te rekenen deel van de toepasselijke te verwachten gezamenlijke grondslag
      sparen en beleggen, bedoeld in artikel 5.2, tweede lid, van de Wet inkomstenbelasting 2001.

      4 Op aanvraag wordt voor de verzekerde een vermindering toegepast voor een bedrag ter grootte
      van door hem in het peiljaar of enig eerder jaar ontvangen eenmalige uitkeringen die krachtens
      [artikel 47 van de Algemene wet inkomensafhankelijke regelingen][ref7] zijn aangewezen.

      5 Het deel van het bedrag, bedoeld in het vierde lid, dat de vermogensgrondslag van de verzekerde overtreft, wordt
      voor zijn echtgenoot als vermindering toegepast.

      6 Er wordt voor de toepassing van [artikel 6, eerste lid, onderdeel c][ref8], en [artikel 15, eerste lid][ref9],
      een vermindering van € 10.000 toegepast voor de verzekerde die de pensioengerechtigde leeftijd nog niet heeft
      bereikt, en van € 10.000 voor zijn echtgenoot die:

      a. de pensioengerechtigde leeftijd heeft bereikt;

      b. de pensioengerechtigde leeftijd heeft bereikt en geen bijdrage als bedoeld in [artikel 4, eerste lid][ref10], of
      [artikel 14, eerste lid][ref11], verschuldigd is.


