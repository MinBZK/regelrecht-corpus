  - number: 16d
    text: |-
      1 De bijdrage voor de zorg, bedoeld in de [artikelen 4][ref1], [5][ref2] en [6 van het Besluit][ref3], bedraagt
      € 14 per uur of per dagdeel van maximaal vier uur, indien de zorg, bedoeld in [artikel 6][ref4], wordt verleend in
      groepsverband. Indien er sprake is van zorgverlening, niet zijnde zorg in groepsverband, gedurende een deel van een
      uur, wordt de bijdrage naar evenredigheid berekend.

      2 De bijdrage, bedoeld in het eerste lid, bedraagt niet meer dan:

      a. voor de ongehuwde verzekerde die de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref5], nog niet heeft bereikt € 19 per vier weken, met dien
      verstande dat indien zijn bijdrageplichtig inkomen meer bedraagt dan € 2.3295 het bedrag van € 19 wordt verhoogd
      met een dertiende deel van 15% van het verschil tussen dat inkomen en € 23.295;

      b. voor de ongehuwde verzekerde die de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref6], heeft bereikt € 19 per vier weken, met dien verstande
      dat indien zijn bijdrageplichtig inkomen meer bedraagt dan € 16.456 het bedrag van € 19 wordt verhoogd met een
      dertiende deel van 15% van het verschil tussen dat inkomen en € 16.456;

      c. voor de gehuwde verzekerden indien een van beiden de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref7], nog niet heeft bereikt of beiden die leeftijd nog
      niet hebben bereikt € 27,20 per vier weken, met dien verstande dat indien hun gezamenlijke bijdrageplichtig inkomen
      meer bedraagt dan € 29.174 het bedrag van € 27,20 wordt verhoogd met een dertiende deel van 15% van het verschil
      tussen dat gezamenlijke inkomen en € 29.174;

      d. voor de gehuwde verzekerden die beiden de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref8], hebben bereikt € 27,20 per vier weken, met dien
      verstande dat indien hun gezamenlijke bijdrageplichtig inkomen meer bedraagt dan € 22.957 het bedrag van € 27,20
      wordt verhoogd met een dertiende deel van 15% van het verschil tussen dat gezamenlijke inkomen en € 22.957.

      3 Bij de toepassing van het tweede lid wordt per kalenderjaar uitgegaan van twaalf perioden van vier weken en een
      periode die, afhankelijk van resterende dagen, vier of vijf weken bedraagt.

      4 Op het op grond van het eerste en tweede lid vastgestelde bedrag worden de eigen bijdrage die voor
      maatschappelijke ondersteuning verschuldigd is ingevolge de [Wet maatschappelijke ondersteuning][ref9] en het
      aandeel in de kosten van maatschappelijke ondersteuning dat bij de toekenning van een financiële tegemoetkoming
      ingevolge die wet voor eigen rekening komt, in mindering gebracht.

      5 Op de met toepassing van het eerste, tweede en vierde lid vastgestelde bijdrage wordt een korting van 33%
      toegepast.

      6 De bijdrage is niet verschuldigd:

      a. indien de verzekerde of zijn echtgenoot, een bijdrage ingevolge de [artikelen 4][ref10] of [14][ref11]
      verschuldigd is;

      b. in die gevallen dat de zorgverzekeraar, op advies van een instelling voor algemeen maatschappelijk werk of de
      Raad voor de kinderbescherming, van oordeel is dat het verschuldigd zijn van de bijdrage ertoe leidt dat de zorg
      niet wordt verstrekt en dit mishandeling, verwaarlozing of ernstige schade voor de opvoeding of ontwikkeling van
      een minderjarige verzekerde tot gevolg heeft;

      c. voor advies, instructie en voorlichting door een aan een instelling verbonden gespecialiseerde verpleegkundige;

      d. door de verzekerde die in de periode, bedoeld in het derde lid, meer dan een
      nacht verblijft in een maatschappelijke opvang of vrouwenopvang als bedoeld in
      [artikel 1, eerste lid, onderdelen c of d, van de Wet maatschappelijke ondersteuning][ref12].


