  - number: '7'
    text: |-
      1 Indien ten aanzien van de ongehuwde of gehuwde verzekerden geen inkomen beschikbaar is, wordt de bijdrage
      vastgesteld op het minimumbedrag, bedoeld in [artikel 14, eerste lid][ref1].

      2 Indien na de vaststelling van de eigen bijdrage uit een alsnog beschikbaar gekomen inkomen of uit een wijziging
      van een inkomen blijkt dat de eigen bijdrage op een te hoog of te laag bedrag is vastgesteld, herziet het CAK de
      eigen bijdrage met inachtneming van het beschikbaar gekomen inkomen dan wel van die wijziging.


      [ref1]: https://wetten.overheid.nl/BWBR0008253#Artikel14
