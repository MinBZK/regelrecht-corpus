  - number: '11'
    text: |-
      1 De hoogte van de bijdrage wordt jaarlijks opnieuw berekend voor de periode van de eerste dag van januari tot en
      met de eenendertigste dag van de daaropvolgende maand december.

      2 In afwijking van [artikel 7, eerste lid][ref1], geldt, indien het inkomen bij de jaarlijkse herziening nog
      moet worden vastgesteld, als eigen bijdrage, de bijdrage die over de laatste maand in het vorige kalenderjaar
      verschuldigd was.


      [ref1]: https://wetten.overheid.nl/BWBR0008253#Artikel7
