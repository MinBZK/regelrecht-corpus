  - number: '15'
    text: |-
      1 Voor de toepassing van [artikel 14][ref1] bestaat het bijdrageplichtige inkomen uit het inkomen over het peiljaar
      van de ongehuwde verzekerde, onderscheidenlijk van de gehuwde verzekerden tezamen, vermeerderd met 8% van het
      vermogen van de ongehuwde verzekerde, onderscheidenlijk 8% van de opgetelde vermogens van de gehuwde verzekerden.

      2 De [artikelen 4, derde en vierde lid][ref2], [7][ref3], [11][ref4] en [11a][ref5] zijn van toepassing en
      [artikel 8][ref6] is van overeenkomstige toepassing.

      3 Op aanvraag van de verzekerde vindt, in afwijking van het eerste lid, een voorlopige vaststelling van
      het bijdrageplichtig inkomen plaats op grond van het inkomen en het vermogen van het lopende jaar, indien
      redelijkerwijs te verwachten is dat het bijdrageplichtig inkomen in het lopende jaar ten minste € 2.500 lager
      zal zijn dan het bijdrageplichtig inkomen, bedoeld in het eerste lid, dan wel algemene bijstand ingevolge de
      [Wet werk en bijstand][ref7] betreft.

      4 De aanvraag, bedoeld in het derde lid, wordt gedaan uiterlijk drie maanden na afloop van het kalenderjaar waarop
      de aanvraag betrekking heeft.

      5 Indien het derde lid is toegepast, vindt na afloop van het jaar definitieve vaststelling plaats. Indien
      daarbij blijkt dat het bijdrageplichtig inkomen in het lopende jaar minder dan € 2.500 lager is geweest dan het
      bijdrageplichtig inkomen, bedoeld in het eerste lid, vindt definitieve vaststelling plaats overeenkomstig het
      eerste lid.


