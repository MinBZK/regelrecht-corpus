  - number: '3'
    text: |-
      1 De verzekerde is de bijdrage, bedoeld in [artikel 2][ref1], verschuldigd aan het CAK.

      2 De verzekerde betaalt de eigen bijdrage binnen dertig dagen nadat de beschikking is bekend gemaakt, tenzij de
      beschikking een later tijdstip vermeldt.


      [ref1]: https://wetten.overheid.nl/BWBR0008253#Artikel2
    url: https://wetten.overheid.nl/BWBR0008253/2014-01-01#Artikel3
