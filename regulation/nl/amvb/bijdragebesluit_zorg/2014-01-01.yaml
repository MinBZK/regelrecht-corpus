  - number: 11a
    text: |-
      1 De eigen bijdrage wordt herzien uiterlijk 24 maanden na het tijdstip waarop het CAK in kennis is gesteld van de
      omstandigheid die aanleiding geeft tot de wijziging.

      2 De herziene bijdrage wordt voor zover mogelijk verrekend met de eerder vastgestelde bijdrage.

      3 Indien het CAK heeft verzuimd de eigen bijdrage te herzien binnen de in het eerste lid bedoelde periode, kan op
      een later tijdstip alsnog de eigen bijdrage worden herzien, met dien verstande dat de ingangsdatum van de periode
      waarvoor de herziene eigen bijdrage door de verzekerde moet worden betaald niet kan worden gesteld op een datum
      die is gelegen meer dan 24 maanden voor de dag waarop het besluit waarin de eigen bijdrage is herzien, aan de
      verzekerde is verzonden.

      4 Voor zover de bevoegdheid tot herziening van de eigen bijdrage over een periode is vervallen op grond van het
      eerste lid, wordt de over die periode eerder vastgestelde eigen bijdrage van rechtswege definitief.
    url: https://wetten.overheid.nl/BWBR0008253/2014-01-01#Artikel11a
