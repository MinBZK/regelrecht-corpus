    text: |-
      1 In afwijking van [artikel 4][ref1] bedraagt de bijdrage 12,5% van het bijdrageplichtig inkomen met een minimum
      van € 156 en een maximum van € 819,40 per maand voor:

      a. de gehuwde verzekerde wiens echtgenoot niet verblijft in een instelling;

      b. de ongehuwde verzekerde gedurende de eerste zes maanden van verblijf in een instelling;

      c. de gehuwde verzekerden die beiden in een instelling verblijven, zolang niet ten aanzien van elk van hen een
      periode van zes maanden is verstreken, tezamen;

      d. de ongehuwde verzekerde die moet of gehuwde verzekerden tezamen die moeten voorzien in de kosten van onderhoud
      van eigen, aangehuwde of pleegkinderen, mits voor die kinderen op grond van de [Algemene Kinderbijslagwet][ref2]
      recht op een uitkering bestaat of aan die kinderen, voor zover ze de leeftijd van 27 jaar nog niet hebben bereikt,
      studiefinanciering is toegekend krachtens de [Wet studiefinanciering 2000][ref3];

      e. de ongehuwde verzekerde of de gehuwde verzekerden tezamen indien de zorgverzekeraar het waarschijnlijk acht
      dat het verblijf in de instelling voor de ongehuwde verzekerde, voor beide of voor een van de beide gehuwde
      verzekerden binnen een half jaar kan worden beëindigd en terugkeer naar de maatschappij mogelijk is en zal worden
      bewerkstelligd;

      f. de ongehuwde verzekerde en de gehuwde verzekerde, ten aanzien van wie [artikel 14 van het Besluit][ref4]
      toepassing vindt;

      g. de gehuwde verzekerden tezamen, indien [artikel 14 van het Besluit][ref5] ten aanzien van beiden toepassing
      vindt dan wel indien [artikel 14 van het Besluit][ref6] toepassing vindt ten aanzien van een van hen en de ander in
      een instelling verblijft.

      2 De onderdelen b en c van het eerste lid zijn niet van toepassing indien het verblijf aanvangt binnen zes maanden
      na beëindiging van een verblijf in een instelling waarvoor de ongehuwde verzekerde of de gehuwde verzekerden
      tezamen een bijdrage als bedoeld in [artikel 4][ref7] verschuldigd was of waren.

      3 Voor de berekening van de periode van zes maanden worden perioden van verblijf in instellingen samengeteld,
      tenzij tussen twee zodanige perioden meer dan zestig dagen zijn verlopen. De eerste volzin is niet van toepassing
      op verzekerden die maximaal twee weken per twee maanden in een instelling verblijven.

      4 Op aanvraag van de verzekerde is de bijdrage niet verschuldigd indien hij een uitkering als bedoeld in
      [artikel 23, eerste lid, van de Wet werk en bijstand][ref8] ontvangt.


