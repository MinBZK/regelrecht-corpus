  - number: '8'
    text: |-
      1 Voor de berekening van het bijdrageplichtig inkomen over het jaar waarin een verzekerde of zijn echtgenoot voor
      het eerst inkomen geniet wordt, in afwijking van [artikel 6, eerste lid][ref1], uitgegaan van het inkomen dat de
      verzekerde of zijn echtgenoot over het desbetreffende kalenderjaar naar verwachting zal genieten alsmede van het te
      verwachten vermogen van dat kalenderjaar, verminderd met de naar verwachting over dat kalenderjaar verschuldigde of
      ingehouden belasting.

      2 Voor de berekening van het bijdrageplichtig inkomen over het jaar volgende op het jaar waarin een verzekerde
      of zijn echtgenoot voor het eerst inkomen geniet wordt, in afwijking van [artikel 6, eerste lid][ref2], uitgegaan
      van het inkomen dat de verzekerde of zijn echtgenoot over het dan lopende kalenderjaar naar verwachting zal
      genieten alsmede van het te verwachten vermogen van dat kalenderjaar, verminderd met de naar verwachting over dat
      kalenderjaar verschuldigde of ingehouden belasting.

      3 Voor de berekening van het bijdrageplichtig inkomen over het tweede jaar volgend op het jaar waarin
      een verzekerde of zijn echtgenoot voor het eerst inkomen geniet, wordt niet van het bedrag, bedoeld in
      [artikel 6, eerste lid, onderdeel a][ref3], uitgegaan, maar wordt uitgegaan van de in het tweede lid bedoelde
      bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0008253#Artikel6
