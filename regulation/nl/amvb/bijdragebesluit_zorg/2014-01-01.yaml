  - number: '20'
    text: |-
      Voor de berekening van enige in dit besluit genoemde periode worden zodanige perioden, voorafgaande aan de
      inwerkingtreding van dit besluit, mede in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0008253/2014-01-01#Artikel20
  - number: '22'
    text: |-
      In geval van [artikel 3, eerste lid][ref1], en [artikel 16b, eerste lid][ref2], is het CAK bevoegd tot verrekening
      van vorderingen krachtens de wet van of op de verzekerde met vorderingen van of op de verzekerde krachtens deze wet
      of de [Wet maatschappelijke ondersteuning][ref3].


