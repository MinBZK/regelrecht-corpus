  - number: '23'
    text: |-
      Het CAK maakt voor de vaststelling van de bijdrage, bedoeld in de [artikelen 4][ref1],
      [14][ref2] en [16d][ref3], gebruik van het inkomensgegeven, bedoeld in
      [artikel 21, onderdeel e, van de Algemene wet inzake de rijksbelastingen][ref4] en van andere door de inspecteur,
      bedoeld in [artikel 2, derde lid, onderdeel b, van de Algemene wet inzake rijksbelastingen][ref5], verstrekte
      gegevens.


