  - number: 16f
    text: |-
      1 Indien ten aanzien van de ongehuwde of gehuwde verzekerden geen inkomen beschikbaar is, wordt de bijdrage
      vastgesteld op het bedrag per vier weken, genoemd in [artikel 16d][ref1], tweede lid.

      2 Indien na de vaststelling van de eigen bijdrage uit een alsnog beschikbaar gekomen inkomen of uit een wijziging
      van een inkomen, blijkt dat de eigen bijdrage tot een te hoog of te laag bedrag is vastgesteld, herziet het CAK de
      eigen bijdrage met inachtneming van het beschikbaar gekomen inkomen dan wel van die wijziging.


      [ref1]: https://wetten.overheid.nl/BWBR0008253#Artikel16d
    url: https://wetten.overheid.nl/BWBR0008253/2014-01-01#Artikel16f
    references:
      - id: ref1
        bwb_id: BWBR0008253
        artikel: 16d
        hoofdstuk: III
        paragraaf: '2'
  - number: 16g
    text: |-
      Op bijdragen ingevolge deze paragraaf is [artikel 11a][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008253#Artikel11a
    url: https://wetten.overheid.nl/BWBR0008253/2014-01-01#Artikel16g
    references:
      - id: ref1
        bwb_id: BWBR0008253
        artikel: 11a
        hoofdstuk: II
        paragraaf: '2'
  - number: '19'
    text: |-
      1 Bij ministeriële regeling worden de bedragen, genoemd in de [artikelen 4, tweede lid][ref1],
      [14, eerste lid][ref2], [15, derde en vijfde lid][ref3], [16d, eerste en tweede lid][ref4], voor zover het betreft
      de in dat lid genoemde bedragen per vier weken, en [16e, derde en vijfde lid][ref5], jaarlijks gewijzigd aan de
      hand van de prijsindex voor de gezinsconsumptie.

      2 Bij ministeriële regeling wordt het bedrag, genoemd in [artikel 1a, zesde lid][ref6], jaarlijks gewijzigd aan
      de hand van het indexcijfer waarmee het bedrag, genoemd in [artikel 5.5 van de Wet inkomstenbelasting 2001][ref7],
      jaarlijks wordt gewijzigd.

      3 De berekende bedragen worden naar beneden afgerond op een veelvoud van € 0,2.

      4 Bij de jaarlijkse toepassing van het eerste lid wordt de afronding, bedoeld in het tweede lid, buiten beschouwing
      gelaten.

      5 In afwijking van het eerste lid worden de overige bedragen, genoemd in [artikel 16d][ref8], jaarlijks
      bij ministeriële regeling gewijzigd aan de hand van de ontwikkelingen van het minimumloon, bedoeld in
      [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref9]. Het tweede en het
      derde lid zijn niet van toepassing.


