  - number: 16e
    text: |-
      1 Het bijdrageplichtig inkomen, bedoeld in [artikel 16d, tweede lid][ref1], bedraagt het inkomen over het peiljaar
      van de ongehuwde verzekerde, onderscheidenlijk van de gehuwde verzekerden tezamen, vermeerderd met 8% van het
      vermogen van de ongehuwde verzekerde, onderscheidenlijk 8% van de opgetelde vermogens van de gehuwde verzekerden.

      2 Inkomen dat in het buitenland wordt belast, dan wel is vrijgesteld van belasting op grond van bepalingen
      van internationaal recht, wordt mede in aanmerking genomen als ware dit aan de Nederlandse belastingwetgeving
      onderworpen.

      3 Op aanvraag van de verzekerde vindt, in afwijking van het eerste lid, een voorlopige vaststelling van
      het bijdrageplichtig inkomen plaats op grond van het inkomen en het vermogen van het lopende jaar, indien
      redelijkerwijs te verwachten is dat het bijdrageplichtig inkomen in het lopende jaar ten minste € 2.500 lager zal
      zijn dan het bijdrageplichtig inkomen, bedoeld in het eerste lid.

      4 De aanvraag, bedoeld in het derde lid, wordt gedaan uiterlijk drie maanden na afloop van het kalenderjaar waarop
      de aanvraag betrekking heeft.

      5 Indien het derde lid is toegepast, vindt na afloop van het jaar definitieve vaststelling van het bijdrageplichtig
      inkomen over dat jaar plaats. Indien daarbij blijkt dat het bijdrageplichtig inkomen in het lopende jaar minder
      dan € 2.500 lager is geweest dan het bijdrageplichtig inkomen, bedoeld in het eerste lid, vindt definitieve
      vaststelling plaats overeenkomstig het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008253#Artikel16d
