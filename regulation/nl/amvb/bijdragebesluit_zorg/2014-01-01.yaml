  - number: '4'
    text: |-
      1 De bijdrage bedraagt per maand voor de ongehuwde verzekerde die gedurende het etmaal in een instelling verblijft
      en voor de gehuwde verzekerden die beiden gedurende het etmaal in een instelling verblijven tezamen, een twaalfde
      gedeelte van het bijdrageplichtig inkomen.

      2 De bijdrage, bedoeld in het eerste lid, bedraagt niet meer dan € 2.248,60 per maand.

      3 Over een gedeelte van een maand is de bijdrage gelijk aan het vastgestelde bedrag per maand, vermenigvuldigd met
      twaalf maal het aantal dagen waarover de bijdrage binnen die maand verschuldigd is en gedeeld door 365.

      4 Van de voor gehuwde verzekerden gezamenlijk berekende bijdrage is ieder van de echtgenoten een gedeelte
      verschuldigd naar rato van ieders aandeel in het inkomen.
    url: https://wetten.overheid.nl/BWBR0008253/2014-01-01#Artikel4
  - number: '6'
    text: |-
      1 Het bijdrageplichtig inkomen wordt als volgt berekend:

      a. het inkomen over het peiljaar van de ongehuwde verzekerde onderscheidenlijk de gehuwde verzekerden tezamen wordt
      verminderd met de door die verzekerde onderscheidenlijk die verzekerden verschuldigde of ingehouden belasting;

      b. op het met toepassing van onderdeel a berekende bedrag worden in mindering gebracht:

      1°. 15% van de redelijkerwijs te verwachten netto-opbrengst van in het lopende kalenderjaar verrichte arbeid, van
      een loon- of salarisdoorbetaling wegens ziekte of van een uitkering ingevolge de [Ziektewet][ref1];

      2°. zak- en kleedgeld, premies voor een zorgverzekering gecorrigeerd voor de zorgtoeslag, een
      aftrekpost die verschillend kan zijn voor een verzekerde die de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref2] heeft bereikt en een verzekerde die die leeftijd nog
      niet heeft bereikt of extra vrijlatingen, een en ander volgens bij ministeriële regeling te bepalen regels;

      3°. op aanvraag van de verzekerde, de uitkering op grond van
      [artikel 14 van de Wet uitkeringen vervolgingsslachtoffers 1940–1945][ref3] of de uitkering op grond van
      [artikel 20 van de Wet uitkeringen burger-oorlogsslachtoffers 1940–1945][ref4];

      c. het met toepassing van onderdeel b berekende bedrag wordt vermeerderd met 8% van het vermogen van de ongehuwde
      verzekerde, onderscheidenlijk 8% van de opgetelde vermogens van de gehuwde verzekerden.

      2 Inkomen dat in het buitenland wordt belast, dan wel is vrijgesteld van belasting op grond van bepalingen
      van internationaal recht, wordt mede in aanmerking genomen als ware dit aan de Nederlandse belastingwetgeving
      onderworpen. Op aanvraag van de verzekerde wordt daarop de in het buitenland verschuldigde belasting in mindering
      gebracht.

      3 De verzekerde meldt aan het CAK wijzigingen als bedoeld in [artikel 2, derde lid][ref5].


