preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Volksgezondheid, Welzijn en Sport van 12 juli 1996, VPZ/VU-961475,
    gedaan mede namens Onze Minister van Justitie en in overeenstemming met de Staatssecretaris van Sociale Zaken en
    Werkgelegenheid;

    Gelet op artikel 6, derde lid, van de Algemene Wet Bijzondere Ziektekosten, artikel 6a van de Wet
    persoonsregistraties en artikel 15 van de Overgangswet verzorgingshuizen;

    De Raad van State gehoord (advies van 16 augustus 1996, No. W13.96.0305);

    Gezien het nader rapport van de Staatssecretaris van Volksgezondheid, Welzijn en Sport van 25 september 1996, VPZ/
    VU-962243, uitgebracht mede namens Onze Minister van Justitie en in overeenstemming met de Staatssecretaris van
    Sociale Zaken en Werkgelegenheid;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008253/2014-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. de wet: de [Algemene Wet Bijzondere Ziektekosten][ref1];

      b. Besluit: [Besluit zorgaanspraken AWBZ][ref2];

      c. instelling: een instelling als bedoeld in de [artikelen 9][ref3], [13][ref4] en
      [14 van het Besluit zorgaanspraken AWBZ][ref5];

      d. dag: een kalenderdag;

      e. peiljaar: het tweede kalenderjaar voorafgaande aan het jaar waarin de verzekerde zijn aanspraak op zorg tot
      gelding brengt;

      f. inkomen:

      1°. indien over het peiljaar een aanslag of navorderingsaanslag inkomstenbelasting is of wordt vastgesteld: het
      inkomensgegeven, bedoeld in [artikel 21, onderdeel e, onder 1°, van de Algemene wet inzake rijksbelastingen][ref6];

      2°. in de overige gevallen: het inkomensgegeven, bedoeld in
      [artikel 21, onderdeel e, onder 2°, van de Algemene wet inzake rijksbelastingen][ref7];

      g. belasting:

      1°. indien over het peiljaar een aanslag of navorderingsaanslag inkomstenbelasting is of wordt vastgesteld: de
      over dat jaar verschuldigde inkomstenbelasting, bedoeld in [artikel 2.7 van de Wet inkomstenbelasting 2001][ref8],
      vermeerderd met de over dat jaar verschuldigde premie voor de volksverzekeringen, bedoeld in
      [artikel 9 van de Wet financiering sociale verzekeringen][ref9];

      2°. in de overige gevallen: de in dat jaar ingehouden loonbelasting, bedoeld in
      [artikel 20 van de Wet op de loonbelasting 1964][ref10], vermeerderd met de in dat jaar ingehouden premie voor de
      volksverzekeringen bedoeld in [artikel 9 van de Wet financiering sociale verzekeringen][ref11];

      h. grondslag sparen en beleggen: de grondslag sparen en beleggen, bedoeld in
      [artikel 5.2, eerste lid, van de Wet inkomstenbelasting 2001][ref12];

      i. zorgverzekering: een verzekering als bedoeld in [artikel 1, onderdeel d, van de Zorgverzekeringswet][ref13];

      j. zorgtoeslag: een tegemoetkoming als bedoeld in
      [artikel 1, eerste lid, onderdeel e, van de Wet op de zorgtoeslag][ref14];

      k. standaardpremie: het bedrag, bedoeld in
      [artikel 1, eerste lid, onderdeel g, van de Wet op de zorgtoeslag][ref15];

      l. vermogen: vermogen als bedoeld in [artikel 1a][ref16].


