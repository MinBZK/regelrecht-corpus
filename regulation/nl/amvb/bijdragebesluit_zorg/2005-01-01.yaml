  - number: '14'
    text: |-
      1 In afwijking van [artikel 4][ref1] bedraagt de bijdrage 12,5% van het bijdrageplichtig inkomen met een minimum
      van € 132,60 en een maximum van € 696,60 per maand voor:

      a. de gehuwde verzekerde wiens echtgenoot niet verblijft in een instelling;

      b. de ongehuwde verzekerde gedurende de eerste zes maanden van verblijf in een instelling;

      c. de gehuwde verzekerden die beiden in een instelling verblijven, zolang niet ten aanzien van elk van hen een
      periode van zes maanden of de periode, bedoeld in [artikel 17, eerste lid][ref2], is verstreken, tezamen;

      d. de ongehuwde verzekerde die moet of gehuwde verzekerden tezamen die moeten voorzien in de kosten van
      onderhoud van eigen, aangehuwde of pleegkinderen, mits voor die kinderen op grond van de [artikelen 7][ref3]
      en [26 van de Algemene Kinderbijslagwet][ref4] recht op een uitkering bestaat of aan die kinderen, voor
      zover ze de leeftijd van 27 jaar nog niet hebben bereikt, studiefinanciering is toegekend krachtens de
      [Wet studiefinanciering 2000][ref5];

      e. de ongehuwde verzekerde of de gehuwde verzekerden tezamen indien het uitvoeringsorgaan het waarschijnlijk
      acht dat het verblijf in de instelling voor de ongehuwde verzekerde, voor beide of voor een van de beide gehuwde
      verzekerden kan worden beëindigd en terugkeer naar de maatschappij mogelijk is en zal worden bewerkstelligd.

      2 De onderdelen b en c van het eerste lid zijn niet van toepassing indien het verblijf aanvangt binnen zes maanden
      na beëindiging van een verblijf in een instelling waarvoor de ongehuwde verzekerde of de gehuwde verzekerden
      tezamen een bijdrage als bedoeld in [artikel 4][ref6] verschuldigd was of waren.

      3 Voor de berekening van de periode van zes maanden worden perioden van verblijf in instellingen samengeteld,
      tenzij tussen twee zodanige perioden meer dan zestig dagen zijn verlopen. Voor deze berekening telt verblijf in
      instellingen waarvan de kosten niet ten laste van het Algemeen Fonds Bijzondere Ziektekosten komen, mee. De eerste
      volzin is niet van toepassing op verzekerden die maximaal twee weken per twee maanden in een instelling verblijven.


      [ref1]: https://wetten.overheid.nl/BWBR0008253#Artikel4
