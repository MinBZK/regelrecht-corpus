    text: |-
      1 De verzekerde van 18 jaren of ouder draagt bij in de kosten van de zorg, verleend door een instelling.

      2 Voor de toepassing van het eerste lid wordt afwezigheid uit de instelling, anders dan in verband met beëindiging
      van de zorgverlening, buiten beschouwing gelaten.

      3 Een wijziging in de burgerlijke staat van de verzekerde en het bereiken van een voor de toepassing van dit
      besluit van belang zijnde leeftijd door de verzekerde of zijn echtgenoot wordt in aanmerking genomen met ingang van
      de datum waarop die wijziging plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0008253/2005-01-01#Artikel2
  - number: '3'
    text: |-
      1 De verzekerde is de bijdrage, bedoeld in [artikel 2][ref1], verschuldigd aan het uitvoeringsorgaan.

      2 Indien aan een verzekerde zorg wordt verleend met toepassing van [artikel 6, vierde lid, van de wet][ref2], is
      hij de bijdrage, in afwijking van het eerste lid verschuldigd aan Onze Minister van Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0008253#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0008253/2005-01-01#Artikel3
