  - number: 16f
    text: |-
      1 Voor de zorg, bedoeld in [artikel 8, tweede tot en met vierde lid van het Besluit][ref1], wordt de bijdrage bij
      ministeriële regeling geregeld.

      2 Bij ministeriële regeling kan worden bepaald aan wie de bijdrage verschuldigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0014149#Artikel8
