  - number: '7'
    text: |-
      1 De jaarlijkse herziening, bedoeld in [artikel 5][ref1], geschiedt met toepassing van [artikel 6][ref2], met dien
      verstande dat het bedrag dat ingevolge [het eerste lid, onderdeel a, van artikel 6][ref3] is vastgesteld, slechts
      geïndexeerd wordt.

      2 De indexering, bedoeld in het eerste lid, geschiedt met toepassing van het indexpercentage.


