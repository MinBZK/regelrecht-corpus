  - number: '17'
    text: |-
      1 Voor verblijf in een instelling is gedurende het eerste jaar geen bijdrage verschuldigd indien de verzekerde
      in verband met een psychiatrische aandoening tevens in die instelling zorg als bedoeld in de [artikelen 7][ref1]
      of [8 van het Besluit][ref2] ontvangt. Voor de berekening van de periode van een jaar worden perioden van verblijf
      in een instelling als bedoeld in de [artikelen 9][ref3], [13][ref4] of [14 van het Besluit][ref5] samengeteld.

      2 Het eerste lid is niet van toepassing indien de verzekerde in de zes maanden voorafgaande aan het in dat lid
      bedoelde verblijf een bijdrage ingevolge de [artikelen 4][ref6] of [14][ref7] verschuldigd was wegens verblijf in
      een instelling als bedoeld in de [artikelen 9][ref8], [13][ref9] of [14 van het Besluit][ref10].


