  - number: '24'
    text: |-
      1 Voor de ongehuwde of gehuwde verzekerde of de gehuwde verzekerden tezamen die op 31 december 2002 in een
      instelling verblijft of verblijven en de bijdrage, bedoeld in [artikel 14][ref1], verschuldigd is of zijn, geldt
      zo lang hij of zij aan de voorwaarden voor die bijdragen voldoet of voldoen of [artikel 10][ref2] toepassing
      vindt doch uiterlijk tot 1 januari 2007, de bijdrage die op 31 december 2002 verschuldigd was, met dien verstande
      dat het verschuldigde bedrag met ingang van 1 januari 2003 jaarlijks wordt gewijzigd met toepassing van het
      indexpercentage, bedoeld in [artikel 1, onderdeel h][ref3].

      2 Voor de ongehuwde verzekerde of de gehuwde verzekerden tezamen die op 31 december 2004 in een instelling
      verblijft of verblijven en de bijdrage, bedoeld in [artikel 4][ref4], verschuldigd is of zijn, geldt zo lang
      hij of zij aan de voorwaarden voor die bijdragen voldoet of voldoen of [artikel 10][ref5] toepassing vindt doch
      uiterlijk tot 1 januari 2007, de bijdrage die op 31 december 2004 verschuldigd was, met dien verstande dat het
      verschuldigde bedrag met ingang van 1 januari 2006 wordt gewijzigd met toepassing van het indexpercentage, bedoeld
      in [artikel 1, onderdeel h][ref6].


