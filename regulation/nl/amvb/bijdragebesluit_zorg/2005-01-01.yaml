        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '6'
  - number: '4'
    text: |-
      1 Met inachtneming van het tweede en het derde lid, bedraagt de bijdrage voor:

      a. de ongehuwde verzekerde die gedurende het etmaal in een instelling verblijft: € 1 728 per maand;

      b. de gehuwde verzekerden die beiden gedurende het etmaal in een instelling verblijven, tezamen: € 1 728 per maand.

      2 De bijdrage bedraagt niet meer dan negentig procent van dertig maal het op grond van de
      [Wet tarieven gezondheidszorg][ref1] goedgekeurde of vastgestelde tarief per dag.

      3 De bijdrage wordt indien het bijdrageplichtig inkomen, gedeeld door twaalf, minder bedraagt dan het ingevolge het
      eerste en tweede lid verschuldigde bedrag, op aanvraag verlaagd tot 8,5% van het bijdrageplichtig inkomen.

      4 Over een gedeelte van een maand is de bijdrage gelijk aan het vastgestelde bedrag per maand, vermenigvuldigd met
      twaalf maal het aantal dagen waarover de bijdrage binnen die maand verschuldigd is en gedeeld door 365.

      5 Van de voor gehuwde verzekerden gezamenlijk berekende bijdrage is ieder van de echtgenoten een gedeelte
      verschuldigd naar rato van ieders aandeel in het bijdrageplichtig inkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003356
    url: https://wetten.overheid.nl/BWBR0008253/2005-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003356
  - number: '5'
    text: |-
      De hoogte van de bijdrage wordt jaarlijks opnieuw berekend voor de periode van de eerste dag van januari tot en met
      de eenendertigste dag van de daaropvolgende maand december.
    url: https://wetten.overheid.nl/BWBR0008253/2005-01-01#Artikel5
  - number: '6'
    text: |-
      1 Het bijdrageplichtig inkomen wordt als volgt berekend:

      a. het inkomen over het peiljaar van de ongehuwde verzekerde onderscheidenlijk de gehuwde verzekerden tezamen wordt
      verminderd met de door die verzekerde onderscheidenlijk die verzekerden verschuldigde of ingehouden belasting;

      b. op het met toepassing van onderdeel a berekende bedrag worden in mindering gebracht:

      1°. 15% van de redelijkerwijs te verwachten netto-opbrengst van in het lopende kalenderjaar verrichte arbeid, van
      een loon- of salarisdoorbetaling wegens ziekte of van een uitkering ingevolge de [Ziektewet][ref1];

      2°. zak- en kleedgeld, premies voor een ziektekostenverzekering, een jonggehandicaptenkorting, een ouderenkorting
      of extra vrijlatingen, een en ander volgens bij ministeriële regeling te bepalen regels.

      2 Inkomen dat in het buitenland wordt belast, dan wel is vrijgesteld van belasting op grond van bepalingen
      van internationaal recht, wordt mede in aanmerking genomen als ware dit aan de Nederlandse belastingwetgeving
      onderworpen.

      3 De verzekerde meldt aan het uitvoeringsorgaan wijzigingen als bedoeld in het eerste lid, onderdeel b,
      subonderdeel 1, wijziging van zijn ziektekostenverzekering die voor het vaststellen van zijn eigen bijdrage
      relevant is dan wel wijzigingen als bedoeld in [artikel 2, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0008253#Artikel2
    url: https://wetten.overheid.nl/BWBR0008253/2005-01-01#Artikel6
