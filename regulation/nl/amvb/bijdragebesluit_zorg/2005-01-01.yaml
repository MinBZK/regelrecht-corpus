  - number: 16b
    text: |-
      Tenzij anders bepaald, is de verzekerde de bijdrage, bedoeld in [artikel 16][ref1] verschuldigd aan het
      uitvoeringsorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0008253#Artikel16a
    url: https://wetten.overheid.nl/BWBR0008253/2005-01-01#Artikel16b
    references:
      - id: ref1
