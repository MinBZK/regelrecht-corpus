        artikel: 16a
        hoofdstuk: III
        paragraaf: '1'
  - number: 16d
    text: |-
      1 De bijdrage voor de zorg, bedoeld in de [artikelen 3 tot en met 7 van het Besluit][ref1], bedraagt € 11,80 per
      uur. Indien er sprake is van zorgverlening gedurende een deel van een uur, wordt de bijdrage naar evenredigheid
      berekend.

      2 De verzekerde is per vier weken aan bijdragen als bedoeld in het eerste lid niet meer verschuldigd dan
      eendertiende van 15% van het bijdrageplichtig inkomen, verminderd met € 142,20, met dien verstande dat hij ten
      minste € 16,20 en ten hoogste € 536,80 is verschuldigd.

      3 De bijdrage is niet verschuldigd:

      a. indien de verzekerde of een persoon uit de leefeenheid waartoe de verzekerde behoort, een bijdrage ingevolge
      de[artikelen 4][ref2] of [14][ref3] verschuldigd is;

      b. in die gevallen dat het uitvoeringsorgaan, op advies van een instelling voor algemeen maatschappelijk werk of
      de Raad voor de kinderbescherming, van oordeel is dat het verschuldigd zijn van de bijdrage ertoe leidt dat de zorg
      niet wordt verstrekt en dit mishandeling, verwaarlozing of ernstige schade voor de opvoeding of ontwikkeling van
      een minderjarige verzekerde tot gevolg heeft;

      c. voor advies, instructie en voorlichting door een aan een instelling verbonden gespecialiseerde verpleegkundige.


      [ref1]: https://wetten.overheid.nl/BWBR0014149#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008253#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0008253#Artikel14
    url: https://wetten.overheid.nl/BWBR0008253/2005-01-01#Artikel16d
