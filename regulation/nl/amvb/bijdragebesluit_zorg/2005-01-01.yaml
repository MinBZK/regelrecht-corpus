  - number: '16'
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder bijdrageplichtig inkomen: het inkomen
      van een verzekerde die niet behoort tot een leefeenheid, het inkomen van een meerderjarige ongehuwde verzekerde
      die deel uitmaakt van een leefeenheid dan wel het inkomen van de gehuwde verzekerden die deel uitmaken van een
      leefeenheid tezamen.
    url: https://wetten.overheid.nl/BWBR0008253/2005-01-01#Artikel16
  - number: 16a
    text: |-
      1 De verzekerde van 18 jaar of ouder draagt bij in de kosten van de zorg, bedoeld in de
      [artikelen 3 tot en met 7 van het Besluit][ref1], voor zover voor die zorg niet reeds op grond van de
      [artikelen 4][ref2] of [14][ref3] een bijdrage is verschuldigd.

      2 De verzekerde draagt bij in de kosten van de zorg, bedoeld in
      [artikel 8, tweede tot en met vierde lid van het Besluit][ref4].

      3 De bijdrageplicht, bedoeld in het eerste lid, geldt ook gedurende perioden van onderbreking van zorg anders dan
      in verband met beëindiging van de zorgverlening.


      [ref1]: https://wetten.overheid.nl/BWBR0014149#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008253#Artikel4
