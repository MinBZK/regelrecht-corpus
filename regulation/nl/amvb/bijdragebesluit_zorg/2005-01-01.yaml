  - number: '8'
    text: |-
      1 Voor de berekening van het bijdrageplichtig inkomen over het jaar waarin een verzekerde of zijn echtgenoot
      voor het eerst inkomen geniet, wordt niet van het bedrag, bedoeld in [artikel 6, eerste lid, onderdeel a][ref1],
      uitgegaan, maar wordt uitgegaan van het inkomen dat de verzekerde of zijn echtgenoot over het desbetreffende
      kalenderjaar naar verwachting zal genieten, verminderd met de naar verwachting over dat kalenderjaar verschuldigde
      of ingehouden belasting.

      2 Voor de berekening van het bijdrageplichtig inkomen over het jaar volgende op het jaar waarin een
      verzekerde of zijn echtgenoot voor het eerst inkomen geniet, wordt niet van het bedrag, bedoeld in
      [artikel 6, eerste lid, onderdeel a][ref2], uitgegaan, maar wordt uitgegaan van het inkomen dat de verzekerde of
      zijn echtgenoot over het lopende kalenderjaar naar verwachting zal genieten, verminderd met de naar verwachting
      over dat kalenderjaar verschuldigde of ingehouden belasting.

      3 Voor de berekening van het bijdrageplichtig inkomen over het tweede jaar volgend op het jaar waarin een
      verzekerde of zijn echtgenoot voor het eerst inkomen geniet, wordt niet uitgegaan van het bedrag, bedoeld in
      [artikel 6, eerste lid, onderdeel a][ref3], maar wordt uitgegaan van de in het tweede lid bedoelde bedragen.

      4 Op de vaststelling van het bijdrageplichtig inkomen over het derde jaar volgend op het jaar waarin een verzekerde
      of zijn echtgenoot voor het eerst inkomen geniet, is [artikel 6][ref4] van toepassing en blijft [artikel 7][ref5]
      buiten beschouwing.


