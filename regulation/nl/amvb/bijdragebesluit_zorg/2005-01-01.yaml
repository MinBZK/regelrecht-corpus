  - number: '20'
    text: |-
      Voor de berekening van enige in dit besluit genoemde periode worden zodanige perioden, voorafgaande aan de
      inwerkingtreding van dit besluit, mede in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0008253/2005-01-01#Artikel20
  - number: '21'
    text: |-
      Het uitvoeringsorgaan of, ingeval [artikel 6, vierde lid][ref1], van de wet van toepassing is, Onze Minister
      van Justitie verlaagt ambtshalve de voor de verzekerde vastgestelde bijdrage indien in verband met structurele
      wijzigingen in het niveau van uitkeringen in het kader van regelingen inzake de sociale zekerheid zonder zodanige
      wijziging na afdracht van de bijdrage maandelijks voor persoonlijke uitgaven gemiddeld minder zou overblijven dan
      het van toepassing zijnde bedrag, vermeld in [artikel 23 van de Wet werk en bijstand][ref2], zoals dat geldt in het
      lopende kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0008253#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel23
