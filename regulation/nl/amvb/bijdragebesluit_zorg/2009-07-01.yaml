  - number: '19'
    text: |-
      1 Bij ministeriële regeling worden de bedragen, genoemd in de [artikelen 4, eerste lid][ref1], [14][ref2] en
      [16d][ref3], voor zover het betreft de bedragen van € 16,60 en € 23,80, jaarlijks gewijzigd aan de hand van de
      prijsindex voor de gezinsconsumptie.

      2 De berekende bedragen worden naar beneden afgerond op een veelvoud van € 0,2.

      3 Bij de jaarlijkse toepassing van het eerste lid wordt de afronding, bedoeld in het tweede lid, buiten beschouwing
      gelaten.

      4 In afwijking van het eerste lid worden de overige bedragen, genoemd in [artikel 16d][ref4], jaarlijks
      bij ministeriële regeling gewijzigd aan de hand van de ontwikkelingen van het minimumloon, bedoeld in
      [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref5]. Het tweede en het
      derde lid zijn niet van toepassing.


