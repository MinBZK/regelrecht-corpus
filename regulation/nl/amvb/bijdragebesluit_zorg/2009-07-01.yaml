  - number: 16d
    text: |-
      1 De bijdrage voor de zorg, bedoeld in de [artikelen 4][ref1] en [5 van het Besluit][ref2], bedraagt € 12,60 per
      uur. Indien er sprake is van zorgverlening gedurende een deel van een uur, wordt de bijdrage naar evenredigheid
      berekend.

      2 De bijdrage, bedoeld in het eerste lid, bedraagt niet meer dan:

      a. voor de ongehuwde verzekerde jonger dan 65 jaar € 17,20 per vier weken, met dien verstande dat indien zijn
      inkomen meer bedraagt dan € 21 703 het bedrag van € 17, 20 wordt verhoogd met een dertiende deel van 15% van het
      verschil tussen zijn inkomen en € 21 703;

      b. voor de ongehuwde verzekerde van 65 jaar of ouder € 17,20 per vier weken, met dien verstande dat indien zijn
      inkomen meer bedraagt dan € 14 812 het bedrag van € 17,20 wordt verhoogd met een dertiende deel van 15% van het
      verschil tussen zijn inkomen en € 14 812;

      c. voor de gehuwde verzekerden indien een van beiden jonger is dan 65 jaar of beiden jonger zijn dan 65 jaar €
      24,60 per vier weken, met dien verstande dat indien hun gezamenlijke inkomen meer bedraagt dan € 26 535 het bedrag
      van € 24,60 wordt verhoogd met een dertiende deel van 15% van het verschil tussen hun gezamenlijke inkomen en
      € 26 535;

      d. voor de gehuwde verzekerden die beiden 65 jaar of ouder zijn € 24,60 per vier weken, met dien verstande dat
      indien hun gezamenlijke inkomen meer bedraagt dan € 20 431 het bedrag van € 24,60 wordt verhoogd met een dertiende
      deel van 15% van het verschil tussen hun gezamenlijke inkomen en € 20 431.

      3 Bij de toepassing van het tweede lid wordt per kalenderjaar uitgegaan van twaalf perioden van vier weken en een
      periode die, afhankelijk van resterende dagen, vier of vijf weken bedraagt.

      4 Op het op grond van het eerste en tweede lid vastgestelde bedrag worden de eigen bijdrage die voor
      maatschappelijke ondersteuning verschuldigd is ingevolge de [Wet maatschappelijke ondersteuning][ref3] en het
      aandeel in de kosten van maatschappelijke ondersteuning dat bij de toekenning van een financiële tegemoetkoming
      ingevolge [die wet][ref4] voor eigen rekening komt, in mindering gebracht.

      5 Op de met toepassing van het eerste, tweede en vierde lid vastgestelde bijdrage wordt een korting van 33%
      toegepast.

      6 De bijdrage is niet verschuldigd:

      a. indien de verzekerde of zijn echtgenoot, een bijdrage ingevolge de [artikelen 4][ref5] of [14][ref6]
      verschuldigd is;

      b. in die gevallen dat de zorgverzekeraar, op advies van een instelling voor algemeen maatschappelijk werk of de
      Raad voor de kinderbescherming, van oordeel is dat het verschuldigd zijn van de bijdrage ertoe leidt dat de zorg
      niet wordt verstrekt en dit mishandeling, verwaarlozing of ernstige schade voor de opvoeding of ontwikkeling van
      een minderjarige verzekerde tot gevolg heeft;

      c. voor advies, instructie en voorlichting door een aan een instelling verbonden gespecialiseerde verpleegkundige.


      [ref1]: https://wetten.overheid.nl/BWBR0014149#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0014149#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0020031
      [ref4]: https://wetten.overheid.nl/BWBR0020031
      [ref5]: https://wetten.overheid.nl/BWBR0008253#Artikel4
      [ref6]: https://wetten.overheid.nl/BWBR0008253#Artikel14
