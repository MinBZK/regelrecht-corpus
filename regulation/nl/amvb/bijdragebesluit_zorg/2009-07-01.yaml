  - number: '4'
    text: |-
      1 Met inachtneming van het tweede en het derde lid, bedraagt de bijdrage voor:

      a. de ongehuwde verzekerde die gedurende het etmaal in een instelling verblijft: € 1 838,60 per maand;

      b. de gehuwde verzekerden die beiden gedurende het etmaal in een instelling verblijven, tezamen: € 1 838,60 per
      maand.

      2 De bijdrage bedraagt niet meer dan negentig procent van dertig maal het op grond van de
      [Wet marktordening gezondheidszorg][ref1] vastgestelde tarief per dag.

      3 De bijdrage wordt indien het bijdrageplichtig inkomen, gedeeld door twaalf, minder bedraagt dan het ingevolge het
      eerste en tweede lid verschuldigde bedrag, op aanvraag verlaagd tot 8,5% van het bijdrageplichtig inkomen.

      4 Over een gedeelte van een maand is de bijdrage gelijk aan het vastgestelde bedrag per maand, vermenigvuldigd met
      twaalf maal het aantal dagen waarover de bijdrage binnen die maand verschuldigd is en gedeeld door 365.

      5 Van de voor gehuwde verzekerden gezamenlijk berekende bijdrage is ieder van de echtgenoten een gedeelte
      verschuldigd naar rato van ieders aandeel in het bijdrageplichtig inkomen.

      6 De met toepassing van het eerste tot en met het vijfde lid vastgestelde bijdrage wordt verlaagd met:

      a. 16% voor een ongehuwde verzekerde jonger dan 65 jaar, voor gehuwde verzekerden die beiden jonger zijn dan 65
      jaar en voor gehuwde verzekerden indien een van beiden jonger is dan 65 jaar;

      b. 8% voor de overige verzekerden.


      [ref1]: https://wetten.overheid.nl/BWBR0020078
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel4
