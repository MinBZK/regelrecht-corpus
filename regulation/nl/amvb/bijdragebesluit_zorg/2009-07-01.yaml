  - number: 16e
    text: |-
      1 Voor de vaststelling van het bijdrageplichtig inkomen, bedoeld in [artikel 16d, tweede lid][ref1],
      wordt uitgegaan van het inkomen over het peiljaar van de ongehuwde verzekerde onderscheidenlijk van
      de gehuwde verzekerden tezamen , doch zonder de correctie voor buitengewone uitgaven, bedoeld in
      [artikel 1, tweede lid][ref2].

      2 Inkomen dat in het buitenland wordt belast, dan wel is vrijgesteld van belasting op grond van bepalingen
      van internationaal recht, wordt mede in aanmerking genomen als ware dit aan de Nederlandse belastingwetgeving
      onderworpen.

      3 In afwijking van het eerste lid vindt op aanvraag van de verzekerde een voorlopige vaststelling van het
      bijdrageplichtig inkomen plaats, indien redelijkerwijs te verwachten is dat het inkomen in het lopende jaar ten
      minste € 1816 lager zal zijn dan het inkomen, bedoeld in het eerste lid.

      4 Indien het derde lid is toegepast, vindt na afloop van het jaar definitieve vaststelling van het bijdrageplichtig
      inkomen over dat jaar plaats. Indien daarbij blijkt dat het bijdrageplichtig inkomen minder dan € 1816 lager is
      geweest dan het inkomen, bedoeld in het eerste lid, vindt definitieve vaststelling plaats overeenkomstig het eerste
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008253#Artikel16d
      [ref2]: https://wetten.overheid.nl/BWBR0008253#Artikel1
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel16e
