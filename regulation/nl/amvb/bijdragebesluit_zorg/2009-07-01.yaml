  - number: '15'
    text: |-
      1 Voor de toepassing van [artikel 14][ref1] is het bijdrageplichtig inkomen gelijk aan het inkomen over het
      peiljaar van de ongehuwde verzekerde onderscheidenlijk van de gehuwde verzekerden tezamen, doch zonder de correctie
      voor buitengewone uitgaven, bedoeld in [artikel 1, tweede lid][ref2].

      2 De [artikelen 4, vierde en vijfde lid][ref3], [5][ref4] en [12][ref5] zijn van toepassing en de
      [artikelen 4, zesde lid][ref6], en [8][ref7] zijn van overeenkomstige toepassing.

      3 In afwijking van het eerste lid vindt op aanvraag van de verzekerde een voorlopige vaststelling van het
      bijdrageplichtig inkomen plaats op basis van het redelijkerwijs gedurende het lopende kalenderjaar te verwachten
      inkomen, indien het inkomen in dat jaar ten minste € 1816 lager is dan het inkomen over het peiljaar dan wel
      algemene bijstand ingevolge de [Wet werk en bijstand][ref8] betreft.

      4 Indien het derde lid is toegepast, vindt na afloop van het jaar definitieve vaststelling plaats. Indien daaruit
      blijkt dat het bijdrageplichtig inkomen minder dan € 1816 lager is geweest dan het inkomen, bedoeld in het eerste
      lid, vindt definitieve vaststelling plaats overeenkomstig het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008253#Artikel14
