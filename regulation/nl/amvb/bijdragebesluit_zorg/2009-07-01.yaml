  - number: '24'
    text: |-
      1 Voor de ongehuwde of gehuwde verzekerde of de gehuwde verzekerden tezamen die op 31 december 2002
      in een instelling verblijft of verblijven en de bijdrage, bedoeld in [artikel 14][ref1], verschuldigd
      is of zijn, geldt zo lang hij of zij aan de voorwaarden voor die bijdragen voldoet of voldoen of
      [artikel 10][ref2] toepassing vindt doch uiterlijk tot 1 januari 2008, de bijdrage die op 31 december
      2002 verschuldigd was, met dien verstande dat het verschuldigde bedrag met ingang van 1 januari
      2003 jaarlijks wordt gewijzigd met toepassing van het percentage waarmee het minimumloon, bedoeld in
      [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref3], op 1
      juli van het jaar volgend op het peiljaar, is gewijzigd ten opzichte van het minimumloon, bedoeld in
      [artikel 8, eerste lid, onderdeel a, van die wet][ref4], op 1 juli van het peiljaar.

      2 Voor de ongehuwde verzekerde of de gehuwde verzekerden tezamen die op 31 december 2004 in een instelling
      verblijft of verblijven en de bijdrage, bedoeld in [artikel 4][ref5], verschuldigd is of zijn, geldt zo lang hij of
      zij aan de voorwaarden voor die bijdragen voldoet of voldoen of [artikel 10][ref6] toepassing vindt doch uiterlijk
      tot 1 januari 2008, de bijdrage die op 31 december 2004 verschuldigd was, met dien verstande dat het verschuldigde
      bedrag met ingang van 1 januari 2006 wordt gewijzigd met toepassing van het percentage bedoeld in het eerste lid.


