  - number: '5'
    text: >-
      De hoogte van de bijdrage wordt jaarlijks opnieuw berekend voor de periode van de eerste dag van januari tot en met
      de eenendertigste dag van de daaropvolgende maand december.
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel5
  - number: '6'
    text: |-
      1 Het bijdrageplichtig inkomen wordt als volgt berekend:

      a. het inkomen over het peiljaar van de ongehuwde verzekerde onderscheidenlijk de gehuwde verzekerden tezamen wordt
      verminderd met de door die verzekerde onderscheidenlijk die verzekerden verschuldigde of ingehouden belasting;

      b. op het met toepassing van onderdeel a berekende bedrag worden in mindering gebracht:

      1°. 15% van de redelijkerwijs te verwachten netto-opbrengst van in het lopende kalenderjaar verrichte arbeid, van
      een loon- of salarisdoorbetaling wegens ziekte of van een uitkering ingevolge de [Ziektewet][ref1];

      2°. zak- en kleedgeld, premies voor een ziektekostenverzekering, een jonggehandicaptenkorting, een ouderenkorting
      of extra vrijlatingen, een en ander volgens bij ministeriële regeling te bepalen regels;

      3°. op aanvraag van de verzekerde, de uitkering op grond van
      [artikel 14 van de Wet uitkeringen vervolgingsslachtoffers 1940–1945][ref2] of de uitkering op grond van
      [artikel 20 van de Wet uitkeringen burger-oorlogsslachtoffers 1940–1945][ref3].

      2 Inkomen dat in het buitenland wordt belast, dan wel is vrijgesteld van belasting op grond van bepalingen
      van internationaal recht, wordt mede in aanmerking genomen als ware dit aan de Nederlandse belastingwetgeving
      onderworpen.

      3 De verzekerde meldt aan de zorgverzekeraar wijzigingen als bedoeld in het eerste lid, onderdeel b, subonderdeel
      1, en wijzigingen als bedoeld in [artikel 2, derde lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0001888
