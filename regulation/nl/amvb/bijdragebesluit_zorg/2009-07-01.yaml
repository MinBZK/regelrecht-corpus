  - number: '27'
    text: Dit besluit treedt in werking met ingang van een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel27
  - number: '28'
    text: 'Dit besluit wordt aangehaald als: Bijdragebesluit zorg.'
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel28
