      1 De verzekerde van 18 jaren of ouder draagt bij in de kosten van de zorg, verleend door een instelling.

      2 Voor de toepassing van het eerste lid wordt afwezigheid uit de instelling, anders dan in verband met beëindiging
      van de zorgverlening, buiten beschouwing gelaten.

      3 Een wijziging in de burgerlijke staat van de verzekerde en het bereiken van een voor de toepassing van dit
      besluit van belang zijnde leeftijd door de verzekerde of zijn echtgenoot wordt in aanmerking genomen met ingang
      van de datum waarop de bijdrage wordt vastgesteld, met dien verstande dat bij de jaarlijkse herziening, bedoeld
      in [artikel 5][ref1] of [15, derde lid][ref2], een verzekerde als 65 jaar wordt beschouwd indien hij uiterlijk op
      31 januari van het kalenderjaar waarop de herziening betrekking heeft, de leeftijd van 65 jaar heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0008253#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0008253#Artikel15
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel2
