  - number: 16a
    text: |-
      1 De verzekerde van 18 jaar of ouder draagt bij in de kosten van de zorg, bedoeld in de [artikelen 4][ref1] en
      [5 van het Besluit][ref2], voor zover voor die zorg niet reeds op grond van de [artikelen 4][ref3] of [14][ref4]
      een bijdrage is verschuldigd.

      2 De bijdrageplicht, bedoeld in het eerste lid, geldt ook gedurende perioden van onderbreking van zorg anders dan
      in verband met beëindiging van de zorgverlening.

      3 De eigen bijdrage, bedoeld in het eerste lid, wordt niet opgelegd voor zover:

      a. binnen twee jaar na aanvang van de zorg voor de te betalen eigen bijdrage geen beschikking dan wel voorlopige
      beschikking tot vaststelling van deze bijdrage is verzonden;

      b. binnen een jaar nadat de zorgaanbieder de naam, het adres en de woonplaats alsmede het aantal zorguren heeft
      aangeleverd bij het centraal administratiekantoor, het centraal administratiekantoor de naam, het adres en de
      woonplaats niet heeft teruggevonden in de gemeentelijke basisadministratie.


      [ref1]: https://wetten.overheid.nl/BWBR0014149#Artikel4
