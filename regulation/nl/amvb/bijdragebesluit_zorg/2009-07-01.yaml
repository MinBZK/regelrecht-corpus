    text: |-
      1 De verzekerde is de bijdrage, bedoeld in [artikel 2][ref1], verschuldigd aan het centraal administratiekantoor.

      2 Indien aan een verzekerde zorg wordt verleend met toepassing van [artikel 6, vijfde lid, van de wet][ref2], is
      hij de bijdrage, in afwijking van het eerste lid verschuldigd aan Onze Minister van Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0008253#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel6
