preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Volksgezondheid, Welzijn en Sport van 12 juli 1996, VPZ/VU-961475,
    gedaan mede namens Onze Minister van Justitie en in overeenstemming met de Staatssecretaris van Sociale Zaken en
    Werkgelegenheid;

    Gelet op artikel 6, derde lid, van de Algemene Wet Bijzondere Ziektekosten, artikel 6a van de Wet
    persoonsregistraties en artikel 15 van de Overgangswet verzorgingshuizen;

    De Raad van State gehoord (advies van 16 augustus 1996, No. W13.96.0305);

    Gezien het nader rapport van de Staatssecretaris van Volksgezondheid, Welzijn en Sport van 25 september 1996, VPZ/
    VU-962243, uitgebracht mede namens Onze Minister van Justitie en in overeenstemming met de Staatssecretaris van
    Sociale Zaken en Werkgelegenheid;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel1
  - number: 1.1.a
    text: |-
      de wet: de [Algemene Wet Bijzondere Ziektekosten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: 1.1.b
    text: |-
      Besluit: [Besluit zorgaanspraken AWBZ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014149
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014149
  - number: 1.1.c
    text: |-
      instelling: een instelling als bedoeld in de [artikelen 9][ref1], [13][ref2] en
      [14 van het Besluit zorgaanspraken AWBZ][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0014149#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0014149#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0014149#Artikel14
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014149
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0014149
        artikel: '13'
      - id: ref3
        bwb_id: BWBR0014149
        artikel: '14'
  - number: 1.1.d
    text: 'dag: een kalenderdag;'
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel1
  - number: 1.1.e
    text: |-
      peiljaar: het tweede kalenderjaar voorafgaande aan het jaar waarin de verzekerde zijn aanspraak op zorg tot gelding
      brengt;
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel1
  - number: 1.1.f
    text: 'inkomen:'
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel1
  - number: 1.1.f.1°
    text: |-
      indien over het peiljaar een aanslag inkomstenbelasting is of wordt vastgesteld: het inkomensgegeven, bedoeld
      in [artikel 21, onderdeel e, onder 1°, van de Algemene wet inzake rijksbelastingen][ref1], vermeerderd met de
      correctie voor buitengewone uitgaven, bedoeld in het tweede lid;


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel21
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '21'
  - number: 1.1.f.2°
    text: |-
      in de overige gevallen: het inkomensgegeven, bedoeld in
      [artikel 21, onderdeel e, onder 2°, van de Algemene wet inzake rijksbelastingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel21
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '21'
  - number: 1.1.g
    text: 'belasting:'
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel1
  - number: 1.1.g.1°
    text: |-
      indien over het peiljaar een aanslag inkomstenbelasting is of wordt vastgesteld: de over dat jaar
      verschuldigde inkomstenbelasting, bedoeld in [artikel 2.7 van de Wet inkomstenbelasting 2001][ref1],
      vermeerderd met de over dat jaar verschuldigde premie voor de volksverzekeringen, bedoeld in
      [artikel 9 van de Wet financiering sociale verzekeringen][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel9
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '9'
  - number: 1.1.g.2°
    text: |-
      in de overige gevallen: de in dat jaar ingehouden loonbelasting, bedoeld in
      [artikel 20 van de Wet op de loonbelasting 1964][ref1], vermeerderd met de in dat jaar ingehouden premie voor de
      volksverzekeringen bedoeld in [artikel 9 van de Wet financiering sociale verzekeringen][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel9
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '9'
  - number: 1.1.h
    text: |-
      centraal administratiekantoor: het centraal administratiekantoor, bedoeld in
      [artikel 1, onderdeel b, van het Administratiebesluit Bijzondere Ziektekostenverzekering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003585#Artikel1
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003585
        artikel: '1'
  - number: 1.1.j
    text: |-
      ziektekostenverzekering: een overeenkomst met betrekking tot de verzekering van geneeskundige zorg of de kosten
      daarvan.
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel1
  - number: '1.2'
    text: |-
      Voor de toepassing van het eerste lid, onderdeel f, subonderdeel 1°, wordt de correctie voor buitengewone
      uitgaven gesteld op de buitengewone uitgaven, bedoeld in [afdeling 6.5 van de Wet inkomstenbelasting 2001][ref1],
      vermenigvuldigd met (1 minus het voor het peiljaar geldende gecombineerde heffingspercentage, bedoeld in
      [artikel 8.1, onderdeel c, van de Wet inkomstenbelasting 2001][ref2]).


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Afdeling6.5
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011353
        afdeling: '6.5'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '8'
  - number: '2.1'
    text: De verzekerde van 18 jaren of ouder draagt bij in de kosten van de zorg, verleend door een instelling.
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel2
  - number: '2.2'
    text: |-
      Voor de toepassing van het eerste lid wordt afwezigheid uit de instelling, anders dan in verband met beëindiging
      van de zorgverlening, buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel2
  - number: '2.3'
    text: |-
      Een wijziging in de burgerlijke staat van de verzekerde en het bereiken van een voor de toepassing van dit besluit
      van belang zijnde leeftijd door de verzekerde of zijn echtgenoot wordt in aanmerking genomen met ingang van
      de datum waarop de bijdrage wordt vastgesteld, met dien verstande dat bij de jaarlijkse herziening, bedoeld in
      [artikel 5][ref1] of [15, derde lid][ref2], een verzekerde als 65 jaar wordt beschouwd indien hij uiterlijk op
      31 januari van het kalenderjaar waarop de herziening betrekking heeft, de leeftijd van 65 jaar heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0008253#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0008253#Artikel15
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0008253
        artikel: '5'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008253
        artikel: '15'
        hoofdstuk: II
        paragraaf: '3'
  - number: '3.1'
    text: |-
      De verzekerde is de bijdrage, bedoeld in [artikel 2][ref1], verschuldigd aan het centraal administratiekantoor.


      [ref1]: https://wetten.overheid.nl/BWBR0008253#Artikel2
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008253
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: '3.2'
    text: |-
      Indien aan een verzekerde zorg wordt verleend met toepassing van [artikel 6, vijfde lid, van de wet][ref1], is hij
      de bijdrage, in afwijking van het eerste lid verschuldigd aan Onze Minister van Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
  - number: '4.1'
    text: 'Met inachtneming van het tweede en het derde lid, bedraagt de bijdrage voor:'
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel4
  - number: 4.1.a
    text: 'de ongehuwde verzekerde die gedurende het etmaal in een instelling verblijft: € 1 838,60 per maand;'
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel4
  - number: 4.1.b
    text: 'de gehuwde verzekerden die beiden gedurende het etmaal in een instelling verblijven, tezamen: € 1 838,60 per maand.'
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel4
  - number: '4.2'
    text: |-
      De bijdrage bedraagt niet meer dan negentig procent van dertig maal het op grond van de
      [Wet marktordening gezondheidszorg][ref1] vastgestelde tarief per dag.


      [ref1]: https://wetten.overheid.nl/BWBR0020078
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020078
  - number: '4.3'
    text: |-
      De bijdrage wordt indien het bijdrageplichtig inkomen, gedeeld door twaalf, minder bedraagt dan het ingevolge het
      eerste en tweede lid verschuldigde bedrag, op aanvraag verlaagd tot 8,5% van het bijdrageplichtig inkomen.
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel4
  - number: '4.4'
    text: |-
      Over een gedeelte van een maand is de bijdrage gelijk aan het vastgestelde bedrag per maand, vermenigvuldigd met
      twaalf maal het aantal dagen waarover de bijdrage binnen die maand verschuldigd is en gedeeld door 365.
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel4
  - number: '4.5'
    text: |-
      Van de voor gehuwde verzekerden gezamenlijk berekende bijdrage is ieder van de echtgenoten een gedeelte
      verschuldigd naar rato van ieders aandeel in het bijdrageplichtig inkomen.
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel4
  - number: '4.6'
    text: 'De met toepassing van het eerste tot en met het vijfde lid vastgestelde bijdrage wordt verlaagd met:'
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel4
  - number: 4.6.a
    text: |-
      16% voor een ongehuwde verzekerde jonger dan 65 jaar, voor gehuwde verzekerden die beiden jonger zijn dan 65 jaar
      en voor gehuwde verzekerden indien een van beiden jonger is dan 65 jaar;
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel4
  - number: 4.6.b
    text: 8% voor de overige verzekerden.
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel4
  - number: '5'
    text: |-
      De hoogte van de bijdrage wordt jaarlijks opnieuw berekend voor de periode van de eerste dag van januari tot en met
      de eenendertigste dag van de daaropvolgende maand december.
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel5
  - number: '6.1'
    text: 'Het bijdrageplichtig inkomen wordt als volgt berekend:'
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel6
  - number: 6.1.a
    text: |-
      het inkomen over het peiljaar van de ongehuwde verzekerde onderscheidenlijk de gehuwde verzekerden tezamen wordt
      verminderd met de door die verzekerde onderscheidenlijk die verzekerden verschuldigde of ingehouden belasting;
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel6
  - number: 6.1.b
    text: 'op het met toepassing van onderdeel a berekende bedrag worden in mindering gebracht:'
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel6
  - number: 6.1.b.1°
    text: |-
      15% van de redelijkerwijs te verwachten netto-opbrengst van in het lopende kalenderjaar verrichte arbeid, van een
      loon- of salarisdoorbetaling wegens ziekte of van een uitkering ingevolge de [Ziektewet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001888
  - number: 6.1.b.2°
    text: |-
      zak- en kleedgeld, premies voor een ziektekostenverzekering, een jonggehandicaptenkorting, een ouderenkorting of
      extra vrijlatingen, een en ander volgens bij ministeriële regeling te bepalen regels;
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel6
  - number: 6.1.b.3°
    text: |-
      op aanvraag van de verzekerde, de uitkering op grond van
      [artikel 14 van de Wet uitkeringen vervolgingsslachtoffers 1940–1945][ref1] of de uitkering op grond van
      [artikel 20 van de Wet uitkeringen burger-oorlogsslachtoffers 1940–1945][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0003664#Artikel20
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0003664
        artikel: '20'
  - number: '6.2'
    text: |-
      Inkomen dat in het buitenland wordt belast, dan wel is vrijgesteld van belasting op grond van bepalingen van
      internationaal recht, wordt mede in aanmerking genomen als ware dit aan de Nederlandse belastingwetgeving
      onderworpen.
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel6
  - number: '6.3'
    text: |-
      De verzekerde meldt aan de zorgverzekeraar wijzigingen als bedoeld in het eerste lid, onderdeel b, subonderdeel 1,
      en wijzigingen als bedoeld in [artikel 2, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008253#Artikel2
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008253
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: '7'
    text: |-
      De jaarlijkse herziening, bedoeld in [artikel 5][ref1], geschiedt met toepassing van [artikel 6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008253#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0008253#Artikel6
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008253
        artikel: '5'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008253
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
  - number: '8.1'
    text: |-
      Voor de berekening van het bijdrageplichtig inkomen over het jaar waarin een verzekerde of zijn echtgenoot voor het
      eerst inkomen geniet, wordt niet van het bedrag, bedoeld in [artikel 6, eerste lid, onderdeel a][ref1], uitgegaan,
      maar wordt uitgegaan van het inkomen dat de verzekerde of zijn echtgenoot over het desbetreffende kalenderjaar
      naar verwachting zal genieten, verminderd met de naar verwachting over dat kalenderjaar verschuldigde of ingehouden
      belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0008253#Artikel6
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008253
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
  - number: '8.2'
    text: |-
      Voor de berekening van het bijdrageplichtig inkomen over het jaar volgende op het jaar waarin een
      verzekerde of zijn echtgenoot voor het eerst inkomen geniet, wordt niet van het bedrag, bedoeld in
      [artikel 6, eerste lid, onderdeel a][ref1], uitgegaan, maar wordt uitgegaan van het inkomen dat de verzekerde of
      zijn echtgenoot over het lopende kalenderjaar naar verwachting zal genieten, verminderd met de naar verwachting
      over dat kalenderjaar verschuldigde of ingehouden belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0008253#Artikel6
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008253
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
  - number: '9.1'
    text: |-
      Indien [artikel 8, eerste of tweede lid][ref1], of [artikel 10, eerste lid][ref2], van toepassing is, worden,
      in afwijking van [artikel 6, eerste lid, onderdeel b, subonderdeel 2][ref3], twaalf maal het bedrag, vermeld
      in [artikel 23, eerste lid, van de Wet werk en bijstand][ref4] en de bedragen in verband met de in het lopende
      kalenderjaar te betalen premies voor een ziektekostenverzekering en, indien van toepassing, de in het lopende
      jaar geldende jonggehandicaptenkorting onderscheidenlijk ouderenkorting alsmede extra vrijlatingen als bedoeld in
      [artikel 6, eerste lid, onderdeel b, subonderdeel 2][ref5], in mindering gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0008253#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0008253#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0008253#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0015703#Artikel23
      [ref5]: https://wetten.overheid.nl/BWBR0008253#Artikel6
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008253
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008253
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0008253
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0015703
        artikel: '23'
      - id: ref5
        bwb_id: BWBR0008253
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
  - number: '9.2'
    text: |-
      Indien [artikel 8, eerste lid][ref1], van toepassing is en de werkzaamheden in de loop van het kalenderjaar
      aanvangen, worden de bedragen, bedoeld in [artikel 6, eerste lid, onderdeel b][ref2], naar rato van het deel van
      het kalenderjaar waarover de inkomsten worden verworven, in mindering gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0008253#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0008253#Artikel6
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008253
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008253
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
  - number: '10.1'
    text: |-
      In afwijking van [artikel 6, eerste lid, onderdeel a][ref1], vindt op aanvraag van de verzekerde een
      voorlopige vaststelling van het bijdrageplichtig inkomen plaats op basis van het redelijkerwijs gedurende
      het lopende kalenderjaar te verwachten inkomen en de over dat kalenderjaar te verwachten belasting
      indien toepassing van [artikel 6, eerste lid, onderdeel a][ref2], ertoe zou leiden dat na afdracht van de
      bijdrage maandelijks gemiddeld minder over zou blijven dan het van toepassing zijnde bedrag, vermeld in
      [artikel 23, eerste lid, van de Wet werk en bijstand][ref3], zoals dat geldt in het lopende kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0008253#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008253#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel23
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008253
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008253
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0015703
        artikel: '23'
  - number: '10.2'
    text: |-
      Indien het eerste lid is toegepast, vindt na afloop van het jaar definitieve vaststelling plaats. Indien
      daaruit blijkt dat niet voldaan is aan het eerste lid, vindt definitieve vaststelling plaats met toepassing van
      [artikel 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008253#Artikel6
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008253
        artikel: '6'
        hoofdstuk: II
        paragraaf: '2'
  - number: '12'
    text: |-
      Op een aanvraag als bedoeld in de [artikelen 10, eerste lid][ref1], en [15, derde lid][ref2], wordt beslist door
      het centraal administratiekantoor.


      [ref1]: https://wetten.overheid.nl/BWBR0008253#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0008253#Artikel15
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008253
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008253
        artikel: '15'
        hoofdstuk: II
        paragraaf: '3'
  - number: '14.1'
    text: |-
      In afwijking van [artikel 4][ref1] bedraagt de bijdrage 12,5% van het bijdrageplichtig inkomen met een minimum van
      € 141,20 en een maximum van € 741,20 per maand voor:


      [ref1]: https://wetten.overheid.nl/BWBR0008253#Artikel4
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008253
        artikel: '4'
        hoofdstuk: II
        paragraaf: '2'
  - number: 14.1.a
    text: de gehuwde verzekerde wiens echtgenoot niet verblijft in een instelling;
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel14
  - number: 14.1.b
    text: de ongehuwde verzekerde gedurende de eerste zes maanden van verblijf in een instelling;
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel14
  - number: 14.1.c
    text: |-
      de gehuwde verzekerden die beiden in een instelling verblijven, zolang niet ten aanzien van elk van hen een periode
      van zes maanden of de periode, bedoeld in [artikel 17, eerste lid][ref1], is verstreken, tezamen;


      [ref1]: https://wetten.overheid.nl/BWBR0008253#Artikel17
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008253
        artikel: '17'
        hoofdstuk: IV
  - number: 14.1.d
    text: |-
      de ongehuwde verzekerde die moet of gehuwde verzekerden tezamen die moeten voorzien in de kosten van
      onderhoud van eigen, aangehuwde of pleegkinderen, mits voor die kinderen op grond van de [artikelen 7][ref1]
      en [26 van de Algemene Kinderbijslagwet][ref2] recht op een uitkering bestaat of aan die kinderen, voor
      zover ze de leeftijd van 27 jaar nog niet hebben bereikt, studiefinanciering is toegekend krachtens de
      [Wet studiefinanciering 2000][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002368#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0011453
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0002368
        artikel: '26'
      - id: ref3
        bwb_id: BWBR0011453
  - number: 14.1.e
    text: |-
      de ongehuwde verzekerde of de gehuwde verzekerden tezamen indien de zorgverzekeraar het waarschijnlijk acht dat het
      verblijf in de instelling voor de ongehuwde verzekerde, voor beide of voor een van de beide gehuwde verzekerden kan
      worden beëindigd en terugkeer naar de maatschappij mogelijk is en zal worden bewerkstelligd;
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel14
  - number: 14.1.f
    text: |-
      de ongehuwde verzekerde en de gehuwde verzekerde, ten aanzien van wie [artikel 14 van het Besluit][ref1] toepassing
      vindt;


      [ref1]: https://wetten.overheid.nl/BWBR0014149#Artikel14
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0014149
        artikel: '14'
  - number: 14.1.g
    text: |-
      de gehuwde verzekerden tezamen, indien [artikel 14 van het Besluit][ref1] ten aanzien van beiden toepassing vindt
      dan wel indien [artikel 14 van het Besluit][ref2] toepassing vindt ten aanzien van een van hen en de ander in een
      instelling verblijft.


      [ref1]: https://wetten.overheid.nl/BWBR0014149#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0014149#Artikel14
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0014149
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0014149
        artikel: '14'
  - number: '14.2'
    text: |-
      De onderdelen b en c van het eerste lid zijn niet van toepassing indien het verblijf aanvangt binnen zes maanden na
      beëindiging van een verblijf in een instelling waarvoor de ongehuwde verzekerde of de gehuwde verzekerden tezamen
      een bijdrage als bedoeld in [artikel 4][ref1] verschuldigd was of waren.


      [ref1]: https://wetten.overheid.nl/BWBR0008253#Artikel4
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008253
        artikel: '4'
        hoofdstuk: II
        paragraaf: '2'
  - number: '14.3'
    text: |-
      Voor de berekening van de periode van zes maanden worden perioden van verblijf in instellingen samengeteld,
      tenzij tussen twee zodanige perioden meer dan zestig dagen zijn verlopen. Voor deze berekening telt verblijf in
      instellingen waarvan de kosten niet ten laste van het Algemeen Fonds Bijzondere Ziektekosten komen, mee. De eerste
      volzin is niet van toepassing op verzekerden die maximaal twee weken per twee maanden in een instelling verblijven.
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel14
  - number: '15.1'
    text: |-
      Voor de toepassing van [artikel 14][ref1] is het bijdrageplichtig inkomen gelijk aan het inkomen over het peiljaar
      van de ongehuwde verzekerde onderscheidenlijk van de gehuwde verzekerden tezamen, doch zonder de correctie voor
      buitengewone uitgaven, bedoeld in [artikel 1, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008253#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0008253#Artikel1
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0008253
        artikel: '14'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0008253
        artikel: '1'
        hoofdstuk: I
  - number: '15.2'
    text: |-
      De [artikelen 4, vierde en vijfde lid][ref1], [5][ref2] en [12][ref3] zijn van toepassing en de
      [artikelen 4, zesde lid][ref4], en [8][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008253#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008253#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0008253#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0008253#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0008253#Artikel8
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0008253
        artikel: '4'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008253
        artikel: '5'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0008253
        artikel: '12'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0008253
        artikel: '4'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0008253
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
  - number: '15.3'
    text: |-
      In afwijking van het eerste lid vindt op aanvraag van de verzekerde een voorlopige vaststelling van het
      bijdrageplichtig inkomen plaats op basis van het redelijkerwijs gedurende het lopende kalenderjaar te verwachten
      inkomen, indien het inkomen in dat jaar ten minste € 1816 lager is dan het inkomen over het peiljaar dan wel
      algemene bijstand ingevolge de [Wet werk en bijstand][ref1] betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0015703
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0015703
  - number: '15.4'
    text: |-
      Indien het derde lid is toegepast, vindt na afloop van het jaar definitieve vaststelling plaats. Indien daaruit
      blijkt dat het bijdrageplichtig inkomen minder dan € 1816 lager is geweest dan het inkomen, bedoeld in het eerste
      lid, vindt definitieve vaststelling plaats overeenkomstig het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel15
  - number: 16a.1
    text: |-
      De verzekerde van 18 jaar of ouder draagt bij in de kosten van de zorg, bedoeld in de [artikelen 4][ref1] en
      [5 van het Besluit][ref2], voor zover voor die zorg niet reeds op grond van de [artikelen 4][ref3] of [14][ref4]
      een bijdrage is verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0014149#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0014149#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0008253#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0008253#Artikel14
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0014149
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0014149
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0008253
        artikel: '4'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0008253
        artikel: '14'
        hoofdstuk: II
        paragraaf: '3'
  - number: 16a.2
    text: |-
      De bijdrageplicht, bedoeld in het eerste lid, geldt ook gedurende perioden van onderbreking van zorg anders dan in
      verband met beëindiging van de zorgverlening.
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel16a
  - number: 16a.3
    text: 'De eigen bijdrage, bedoeld in het eerste lid, wordt niet opgelegd voor zover:'
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel16a
  - number: 16a.3.a
    text: |-
      binnen twee jaar na aanvang van de zorg voor de te betalen eigen bijdrage geen beschikking dan wel voorlopige
      beschikking tot vaststelling van deze bijdrage is verzonden;
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel16a
  - number: 16a.3.b
    text: |-
      binnen een jaar nadat de zorgaanbieder de naam, het adres en de woonplaats alsmede het aantal zorguren heeft
      aangeleverd bij het centraal administratiekantoor, het centraal administratiekantoor de naam, het adres en de
      woonplaats niet heeft teruggevonden in de gemeentelijke basisadministratie.
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel16a
  - number: 16b
    text: |-
      De verzekerde is de bijdrage, bedoeld in [artikel 16a][ref1], verschuldigd aan het centraal administratiekantoor.


      [ref1]: https://wetten.overheid.nl/BWBR0008253#Artikel16a
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel16b
    references:
      - id: ref1
        bwb_id: BWBR0008253
        artikel: 16a
        hoofdstuk: III
        paragraaf: '1'
  - number: 16d.1
    text: |-
      De bijdrage voor de zorg, bedoeld in de [artikelen 4][ref1] en [5 van het Besluit][ref2], bedraagt € 12,60 per
      uur. Indien er sprake is van zorgverlening gedurende een deel van een uur, wordt de bijdrage naar evenredigheid
      berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0014149#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0014149#Artikel5
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel16d
    references:
      - id: ref1
        bwb_id: BWBR0014149
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0014149
        artikel: '5'
  - number: 16d.2
    text: 'De bijdrage, bedoeld in het eerste lid, bedraagt niet meer dan:'
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel16d
  - number: 16d.2.a
    text: |-
      voor de ongehuwde verzekerde jonger dan 65 jaar € 17,20 per vier weken, met dien verstande dat indien zijn inkomen
      meer bedraagt dan € 21 703 het bedrag van € 17, 20 wordt verhoogd met een dertiende deel van 15% van het verschil
      tussen zijn inkomen en € 21 703;
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel16d
  - number: 16d.2.b
    text: |-
      voor de ongehuwde verzekerde van 65 jaar of ouder € 17,20 per vier weken, met dien verstande dat indien zijn
      inkomen meer bedraagt dan € 14 812 het bedrag van € 17,20 wordt verhoogd met een dertiende deel van 15% van het
      verschil tussen zijn inkomen en € 14 812;
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel16d
  - number: 16d.2.c
    text: |-
      voor de gehuwde verzekerden indien een van beiden jonger is dan 65 jaar of beiden jonger zijn dan 65 jaar € 24,60
      per vier weken, met dien verstande dat indien hun gezamenlijke inkomen meer bedraagt dan € 26 535 het bedrag van €
      24,60 wordt verhoogd met een dertiende deel van 15% van het verschil tussen hun gezamenlijke inkomen en € 26 535;
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel16d
  - number: 16d.2.d
    text: |-
      voor de gehuwde verzekerden die beiden 65 jaar of ouder zijn € 24,60 per vier weken, met dien verstande dat indien
      hun gezamenlijke inkomen meer bedraagt dan € 20 431 het bedrag van € 24,60 wordt verhoogd met een dertiende deel
      van 15% van het verschil tussen hun gezamenlijke inkomen en € 20 431.
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel16d
  - number: 16d.3
    text: |-
      Bij de toepassing van het tweede lid wordt per kalenderjaar uitgegaan van twaalf perioden van vier weken en een
      periode die, afhankelijk van resterende dagen, vier of vijf weken bedraagt.
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel16d
  - number: 16d.4
    text: |-
      Op het op grond van het eerste en tweede lid vastgestelde bedrag worden de eigen bijdrage die voor maatschappelijke
      ondersteuning verschuldigd is ingevolge de [Wet maatschappelijke ondersteuning][ref1] en het aandeel in de
      kosten van maatschappelijke ondersteuning dat bij de toekenning van een financiële tegemoetkoming ingevolge
      [die wet][ref2] voor eigen rekening komt, in mindering gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0020031
      [ref2]: https://wetten.overheid.nl/BWBR0020031
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel16d
    references:
      - id: ref1
        bwb_id: BWBR0020031
      - id: ref2
        bwb_id: BWBR0020031
  - number: 16d.5
    text: |-
      Op de met toepassing van het eerste, tweede en vierde lid vastgestelde bijdrage wordt een korting van 33%
      toegepast.
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel16d
  - number: 16d.6
    text: 'De bijdrage is niet verschuldigd:'
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel16d
  - number: 16d.6.a
    text: |-
      indien de verzekerde of zijn echtgenoot, een bijdrage ingevolge de [artikelen 4][ref1] of [14][ref2] verschuldigd
      is;


      [ref1]: https://wetten.overheid.nl/BWBR0008253#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008253#Artikel14
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel16d
    references:
      - id: ref1
        bwb_id: BWBR0008253
        artikel: '4'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008253
        artikel: '14'
        hoofdstuk: II
        paragraaf: '3'
  - number: 16d.6.b
    text: |-
      in die gevallen dat de zorgverzekeraar, op advies van een instelling voor algemeen maatschappelijk werk of de Raad
      voor de kinderbescherming, van oordeel is dat het verschuldigd zijn van de bijdrage ertoe leidt dat de zorg niet
      wordt verstrekt en dit mishandeling, verwaarlozing of ernstige schade voor de opvoeding of ontwikkeling van een
      minderjarige verzekerde tot gevolg heeft;
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel16d
  - number: 16d.6.c
    text: voor advies, instructie en voorlichting door een aan een instelling verbonden gespecialiseerde verpleegkundige.
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel16d
  - number: 16e.1
    text: |-
      Voor de vaststelling van het bijdrageplichtig inkomen, bedoeld in [artikel 16d, tweede lid][ref1], wordt uitgegaan
      van het inkomen over het peiljaar van de ongehuwde verzekerde onderscheidenlijk van de gehuwde verzekerden
      tezamen , doch zonder de correctie voor buitengewone uitgaven, bedoeld in [artikel 1, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008253#Artikel16d
      [ref2]: https://wetten.overheid.nl/BWBR0008253#Artikel1
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel16e
    references:
      - id: ref1
        bwb_id: BWBR0008253
        artikel: 16d
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008253
        artikel: '1'
        hoofdstuk: I
  - number: 16e.2
    text: |-
      Inkomen dat in het buitenland wordt belast, dan wel is vrijgesteld van belasting op grond van bepalingen van
      internationaal recht, wordt mede in aanmerking genomen als ware dit aan de Nederlandse belastingwetgeving
      onderworpen.
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel16e
  - number: 16e.3
    text: |-
      In afwijking van het eerste lid vindt op aanvraag van de verzekerde een voorlopige vaststelling van het
      bijdrageplichtig inkomen plaats, indien redelijkerwijs te verwachten is dat het inkomen in het lopende jaar ten
      minste € 1816 lager zal zijn dan het inkomen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel16e
  - number: 16e.4
    text: |-
      Indien het derde lid is toegepast, vindt na afloop van het jaar definitieve vaststelling van het bijdrageplichtig
      inkomen over dat jaar plaats. Indien daarbij blijkt dat het bijdrageplichtig inkomen minder dan € 1816 lager is
      geweest dan het inkomen, bedoeld in het eerste lid, vindt definitieve vaststelling plaats overeenkomstig het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel16e
  - number: '19.1'
    text: |-
      Bij ministeriële regeling worden de bedragen, genoemd in de [artikelen 4, eerste lid][ref1], [14][ref2] en
      [16d][ref3], voor zover het betreft de bedragen van € 16,60 en € 23,80, jaarlijks gewijzigd aan de hand van de
      prijsindex voor de gezinsconsumptie.


      [ref1]: https://wetten.overheid.nl/BWBR0008253#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008253#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0008253#Artikel16d
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0008253
        artikel: '4'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008253
        artikel: '14'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0008253
        artikel: 16d
        hoofdstuk: III
        paragraaf: '2'
  - number: '19.2'
    text: De berekende bedragen worden naar beneden afgerond op een veelvoud van € 0,2.
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel19
  - number: '19.3'
    text: |-
      Bij de jaarlijkse toepassing van het eerste lid wordt de afronding, bedoeld in het tweede lid, buiten beschouwing
      gelaten.
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel19
  - number: '19.4'
    text: |-
      In afwijking van het eerste lid worden de overige bedragen, genoemd in [artikel 16d][ref1], jaarlijks
      bij ministeriële regeling gewijzigd aan de hand van de ontwikkelingen van het minimumloon, bedoeld in
      [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref2]. Het tweede en het
      derde lid zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008253#Artikel16d
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0008253
        artikel: 16d
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '8'
  - number: '20'
    text: |-
      Voor de berekening van enige in dit besluit genoemde periode worden zodanige perioden, voorafgaande aan de
      inwerkingtreding van dit besluit, mede in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel20
  - number: '21'
    text: |-
      Het centraal administratiekantoor verlaagt ambtshalve de voor de verzekerde vastgestelde bijdrage
      indien in verband met structurele wijzigingen in het niveau van uitkeringen in het kader van regelingen
      inzake de sociale zekerheid zonder zodanige wijziging na afdracht van de bijdrage maandelijks voor
      persoonlijke uitgaven gemiddeld minder zou overblijven dan het van toepassing zijnde bedrag, vermeld in
      [artikel 23, eerste lid, van de Wet werk en bijstand][ref1], zoals dat geldt in het lopende kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel23
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '23'
  - number: '24.1'
    text: |-
      Voor de ongehuwde of gehuwde verzekerde of de gehuwde verzekerden tezamen die op 31 december 2002 in
      een instelling verblijft of verblijven en de bijdrage, bedoeld in [artikel 14][ref1], verschuldigd
      is of zijn, geldt zo lang hij of zij aan de voorwaarden voor die bijdragen voldoet of voldoen of
      [artikel 10][ref2] toepassing vindt doch uiterlijk tot 1 januari 2008, de bijdrage die op 31 december
      2002 verschuldigd was, met dien verstande dat het verschuldigde bedrag met ingang van 1 januari
      2003 jaarlijks wordt gewijzigd met toepassing van het percentage waarmee het minimumloon, bedoeld in
      [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref3], op 1
      juli van het jaar volgend op het peiljaar, is gewijzigd ten opzichte van het minimumloon, bedoeld in
      [artikel 8, eerste lid, onderdeel a, van die wet][ref4], op 1 juli van het peiljaar.


      [ref1]: https://wetten.overheid.nl/BWBR0008253#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0008253#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0008253/2009-07-01#Artikel24
