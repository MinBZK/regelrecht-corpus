  - number: '24.2'
    text: |-
      Voor de ongehuwde verzekerde of de gehuwde verzekerden tezamen die op 31 december 2004 in een instelling verblijft
      of verblijven en de bijdrage, bedoeld in [artikel 4][ref1], verschuldigd is of zijn, geldt zo lang hij of zij aan
      de voorwaarden voor die bijdragen voldoet of voldoen of [artikel 10][ref2] toepassing vindt doch uiterlijk tot
      1 januari 2007, de bijdrage die op 31 december 2004 verschuldigd was, met dien verstande dat het verschuldigde
      bedrag met ingang van 1 januari 2006 wordt gewijzigd met toepassing van het indexpercentage, bedoeld in
      [artikel 1, onderdeel h][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008253#Artikel4
