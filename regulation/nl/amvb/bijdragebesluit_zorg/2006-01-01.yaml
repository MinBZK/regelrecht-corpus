        artikel: '23'
  - number: '24.1'
    text: |-
      Voor de ongehuwde of gehuwde verzekerde of de gehuwde verzekerden tezamen die op 31 december 2002 in een instelling
      verblijft of verblijven en de bijdrage, bedoeld in [artikel 14][ref1], verschuldigd is of zijn, geldt zo lang
      hij of zij aan de voorwaarden voor die bijdragen voldoet of voldoen of [artikel 10][ref2] toepassing vindt
      doch uiterlijk tot 1 januari 2007, de bijdrage die op 31 december 2002 verschuldigd was, met dien verstande
      dat het verschuldigde bedrag met ingang van 1 januari 2003 jaarlijks wordt gewijzigd met toepassing van het
      indexpercentage, bedoeld in [artikel 1, onderdeel h][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008253#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0008253#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0008253#Artikel1
