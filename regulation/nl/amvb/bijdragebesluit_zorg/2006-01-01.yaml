        hoofdstuk: III
        paragraaf: '2'
  - number: '19.2'
    text: De berekende bedragen worden naar beneden afgerond op een veelvoud van € 0,2.
    url: https://wetten.overheid.nl/BWBR0008253/2006-01-01#Artikel19
  - number: '19.3'
    text: |-
      Bij de jaarlijkse toepassing van het eerste lid wordt de afronding, bedoeld in het tweede lid, buiten beschouwing
      gelaten.
    url: https://wetten.overheid.nl/BWBR0008253/2006-01-01#Artikel19
  - number: '20'
    text: |-
      Voor de berekening van enige in dit besluit genoemde periode worden zodanige perioden, voorafgaande aan de
      inwerkingtreding van dit besluit, mede in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0008253/2006-01-01#Artikel20
  - number: '21'
    text: |-
      De zorgverzekeraar of, ingeval [artikel 6, vijfde lid, van de wet][ref1] van toepassing is, Onze Minister van
      Justitie verlaagt ambtshalve de voor de verzekerde vastgestelde bijdrage indien in verband met structurele
      wijzigingen in het niveau van uitkeringen in het kader van regelingen inzake de sociale zekerheid zonder zodanige
      wijziging na afdracht van de bijdrage maandelijks voor persoonlijke uitgaven gemiddeld minder zou overblijven dan
      het van toepassing zijnde bedrag, vermeld in [artikel 23, eerste lid, van de Wet werk en bijstand][ref2], zoals dat
      geldt in het lopende kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel23
    url: https://wetten.overheid.nl/BWBR0008253/2006-01-01#Artikel21
    references:
