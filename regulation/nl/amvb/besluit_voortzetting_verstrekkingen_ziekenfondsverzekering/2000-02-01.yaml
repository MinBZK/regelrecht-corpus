articles:
  - number: '1'
    text: |-
      1 Indien een verzekering krachtens de [Ziekenfondswet][ref1] is beëindigd anders dan wegens royement worden de
      volgende verstrekkingen, zo zij op grond van die verzekering waren aangevangen maar nog niet voltooid, alsnog
      voortgezet:

      a. medisch-specialistische zorg, bedoeld in [artikel 8, eerste lid, onder a en c, van de Ziekenfondswet][ref2], ten
      hoogste voor de duur van de aan de verzekerde hiervoor afgegeven verwijs- of herhalingskaarten

      b. kaakorthopedische hulp tot het einde van de kalendermaand volgende op die waarin de verzekering is geëindigd;

      c. kraamzorg tot en met de tiende dag na de bevalling.

      2 Indien een verzekering krachtens de [Ziekenfondswet][ref3] is beëindigd, vindt alsnog de levering plaats van een
      nieuwe of overgezette tandheelkundige prothese, zijnde een plaat-, overkappings-, opbouw- of frameprothese, alsmede
      van kronen of bruggen, indien hiervoor nog ten tijde van de verzekering toestemming was verleend en de levering
      plaatsvindt binnen twee maanden na het einde van de verzekering, tenzij het ziekenfonds een langere termijn
      vaststelt, welke niet langer mag zijn dan één jaar. Onder levering is mede begrepen het aanbrengen of de plaatsing
      van de prothetische voorzieningen.


