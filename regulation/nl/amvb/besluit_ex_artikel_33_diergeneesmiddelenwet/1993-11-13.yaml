    text: |-
      Het bestuur van het Produktschap voor Veevoeder stelt ten aanzien van gemedicineerd voeder bij verordening eisen
      als bedoeld in [artikel 23 van de Diergeneesmiddelenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel23
    url: https://wetten.overheid.nl/BWBR0006103/1993-11-13#Artikel1
