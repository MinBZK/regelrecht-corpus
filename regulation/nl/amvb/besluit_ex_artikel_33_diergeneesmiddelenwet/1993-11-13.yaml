preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Landbouw, Natuurbeheer en Visserij van 26 april 1993, No. J. 936650,
    Directie Juridische en Bedrijfsorganisatorische Zaken;

    Gelet op richtlijn No. 90/167/EEG van de Raad van de Europese Gemeenschappen van 26 maart 1990, tot vaststelling
    van de voorwaarden voor de bereiding, het in de handel brengen en het gebruik van diervoeders met medicinale
    werking (Pb EG L 92) en op artikel 33, tweede en derde lid, van de Diergeneesmiddelenwet;

    Gezien het advies van het Produktschap voor Veevoeder, de Koninklijke Nederlandse Maatschappij voor
    Diergeneeskunde, de Vereniging van Fabrikanten en Importeurs van Diergeneesmiddelen in Nederland (Fidin), de
    Vereniging van Nederlandse Fabrikanten van Veevoedertoevoegingen (Nefato), de Vereniging van Fabrikanten en
    Groothandelen in Veterinaire Produkten (Fagrovet);

    De Raad van State gehoord (advies van 16 juni 1993, No. W11.93.0256);

    Gezien het nader rapport van Onze Minister van Landbouw, Natuurbeheer en Visserij van 15 juli 1993, No. J. 9311056,
    Directie Juridische en Bedrijfsorganisatorische Zaken;

    Hebben goedgevonden en verstaan:
