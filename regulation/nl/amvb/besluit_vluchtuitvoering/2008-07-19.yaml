preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Verkeer en Waterstaat van 4 mei 2006, nr. HDJZ/LUV-2006-623,
    Hoofddirectie Juridische Zaken, gedaan in overeenstemming met de Staatssecretaris van Defensie en de Minister van
    Justitie;

    Gelet op de artikelen 1.2, tweede lid, 4.1, tweede en derde lid, 4.2, eerste en vijfde lid, en 4.6, eerste lid, van
    de Wet luchtvaart;

    De Raad van State gehoord (advies van 22 juni 2006, nr. W09.06.0152/V);

    Gezien het nader rapport van de Staatssecretaris van Verkeer en Waterstaat, uitgebracht in overeenstemming met de
    Staatssecretaris van Defensie en de Minister van Justitie van 6 juli 2006, nr. HDJZ/LUV-2006-1004, Hoofddirectie
    Juridische Zaken; uitgebracht in overeenstemming met de Staatssecretaris van Defensie en de Minister van Justitie;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0020111/2008-07-19#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      *EG-verordening 3922/91*: verordening (EEG) nr. 3922/91 van de Raad van de Europese Gemeenschappen van 16 december
      1991 inzake de harmonisatie van technische voorschriften en administratieve procedures op het gebied van de
      burgerluchtvaart (PbEG L 373);

      *helikopter:* gemotoriseerd luchtvaartuig met rotorbladen, zwaarder dan lucht, dat hoofdzakelijk in de lucht
      gehouden kan worden door aërodynamische reactiekrachten op zijn rotorbladen;

      *JAR-OPS 3:* sectie 1 van het technisch voorschrift, vastgesteld door de Joint Aviation Authorities, betreffende
      uitvoering van een vlucht door een helikopter;

      *luchtschip:* luchtvaartuig, lichter dan lucht, dat is voorzien van een voortstuwingsinrichting en een
      besturingsinrichting;

      *luchtwerk:* een vlucht met een vliegtuig of helikopter waarbij dit of deze gebruikt wordt voor speciale diensten
      zoals bijvoorbeeld landbouw, fotografie, film, onderzoek, observatie en patrouille, reddingsoperaties of reclame;

      *vliegtuig:* gemotoriseerd luchtvaartuig met vaste vleugels, zwaarder dan lucht, dat hoofdzakelijk in de lucht
      gehouden kan worden door aërodynamische reactiekrachten op zijn vleugels;

      *vrije ballon:* luchtvaartuig, lichter dan lucht, niet voorzien van een voortstuwingsinstallatie en ingericht om
      ten minste één persoon te vervoeren;

      *wet:* [Wet luchtvaart][ref1].

      2 De bij of krachtens dit besluit vastgestelde bepalingen zijn van toepassing op burgerluchtvaartuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555
    url: https://wetten.overheid.nl/BWBR0020111/2008-07-19#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005555
  - number: '2'
    text: |-
      1 Onze Minister van Verkeer en Waterstaat geeft op aanvraag een AOC af indien wordt voldaan aan:

      a. voor vluchten met een vliegtuig: bijlage III bij EG-verordening 3922/91;

      b. voor vluchten met een helikopter: JAR-OPS 3.

      2 Onze Minister van Verkeer en Waterstaat maakt de tekst van JAR-OPS 3 bekend middels een mededeling in de
      Staatscourant waarin is aangegeven waar de tekst ter inzage is gelegd. Van een wijziging in de tekst wordt eveneens
      mededeling gedaan in de Staatscourant.

      3 Bij ministeriële regeling kunnen ten aanzien van de gegevens, die bij een aanvraag om afgifte of wijziging dan
      wel het instandhouden van een AOC dienen te worden verstrekt, regels worden gesteld.

      4 Een AOC wordt afgegeven voor onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0020111/2008-07-19#Artikel2
  - number: '4'
    text: |-
      1 De uitvoering van een vlucht, krachtens een AOC afgegeven op grond van [artikel 2, eerste lid][ref1], voldoet aan
      de regels, bedoeld in het desbetreffende onderdeel van dat lid.

      2 Onverminderd het eerste lid, kunnen bij ministeriële regeling regels worden gesteld met betrekking tot de
      uitvoering van een vlucht als bedoeld in [artikel 2, eerste lid][ref2], in verband met de veiligheid van de
      vluchtuitvoering en de beveiliging van de burgerluchtvaart.


      [ref1]: https://wetten.overheid.nl/BWBR0020111#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020111#Artikel2
    url: https://wetten.overheid.nl/BWBR0020111/2008-07-19#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020111
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020111
        artikel: '2'
  - number: '5'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de vergoedingen, die verschuldigd zijn
      voor de kosten van de behandeling van een aanvraag om afgifte van een AOC, een wijziging dan wel het instandhouden
      daarvan.
    url: https://wetten.overheid.nl/BWBR0020111/2008-07-19#Artikel5
  - number: '6'
    text: |-
      1 Het in [artikel 4.1 van de wet][ref1] bedoelde verbod om zonder AOC vluchten tegen vergoeding uit te voeren,
      geldt niet voor:

      a. vluchten met een luchtschip;

      b. luchtwerk;

      c. vluchten met een vrije ballon.

      2 Bij ministeriële regeling kunnen regels worden gesteld over de uitvoering van vluchten als bedoeld in het eerste
      lid.

      3 Voor zover krachtens het tweede lid regels zijn gesteld, worden vluchten als bedoeld in het eerste lid uitgevoerd
      met inachtneming van die regels.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel4.1
    url: https://wetten.overheid.nl/BWBR0020111/2008-07-19#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '4.1'
  - number: '7'
    text: |-
      1 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de uitvoering van een vlucht niet door
      een luchtvaartmaatschappij dan wel niet tegen vergoeding.

      2 Een vlucht als bedoeld in het eerste lid wordt uitgevoerd met inachtneming van de ministeriële regeling, bedoeld
      in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0020111/2008-07-19#Artikel7
  - number: '8'
    text: |-
      Handelen in strijd met de [artikelen 4][ref1], [6, derde lid][ref2], en [7, tweede lid][ref3], is een strafbaar
      feit.


      [ref1]: https://wetten.overheid.nl/BWBR0020111#Artikel4
