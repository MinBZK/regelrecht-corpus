        bwb_id: BWBR0020111
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0020111
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0020111
        artikel: '7'
  - number: '10'
    text: |-
      Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende
      artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020111/2015-07-01#Artikel10
  - number: '11'
    text: 'Dit besluit wordt aangehaald als: Besluit vluchtuitvoering.'
    url: https://wetten.overheid.nl/BWBR0020111/2015-07-01#Artikel11
