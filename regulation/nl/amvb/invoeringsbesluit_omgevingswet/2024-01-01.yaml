      maakt ook de volgende bijlage deel uit:
    url: https://wetten.overheid.nl/BWBR0044923/2024-01-01#Artikel7.1d
  - number: 7.1e
    text: |-
      Van het tijdelijke deel van het omgevingsplan, bedoeld in artikel 22.1, aanhef en onder c, van de gemeente Roermond
      maakt ook de volgende bijlage deel uit:
    url: https://wetten.overheid.nl/BWBR0044923/2024-01-01#Artikel7.1e
  - number: 7.1f
    text: |-
