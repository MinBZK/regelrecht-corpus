      - id: ref2
        bwb_id: BWBR0044923
        artikel: '6.1'
        hoofdstuk: '6'
  - number: '9.2'
    text: >-
      Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende
      hoofdstukken, artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0044923/2024-01-01#Artikel9.2
  - number: '9.3'
    text: 'Dit besluit wordt aangehaald als: Invoeringsbesluit Omgevingswet.'
    url: https://wetten.overheid.nl/BWBR0044923/2024-01-01#Artikel9.3
  - number: '9.4'
    text: |-
      1 Na de inwerkingtreding van:

      a. de [hoofdstukken 1 tot en met 4][ref1] van dit besluit;

      b. [hoofdstuk 1 van het Aanvullingsbesluit geluid Omgevingswet][ref2];

      c. [hoofdstuk 1 van het Aanvullingsbesluit bodem Omgevingswet][ref3];

      d. de [artikelen I][ref4], [II][ref5] en [III van het Aanvullingsbesluit natuur Omgevingswet][ref6]; en

      e. [hoofdstuk 1 van het Aanvullingsbesluit grondeigendom Omgevingswet][ref7];

      kan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties de nummering van een of meer
      hoofdstukken, afdelingen, paragrafen en artikelen van het [Besluit activiteiten leefomgeving][ref8],
      het [Besluit bouwwerken leefomgeving][ref9], het [Besluit kwaliteit leefomgeving][ref10] en het
      [Omgevingsbesluit][ref11] opnieuw vaststellen.

      2 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties brengt in het
      [Besluit activiteiten leefomgeving][ref12], het [Besluit bouwwerken leefomgeving][ref13], het
      [Besluit kwaliteit leefomgeving][ref14] en het [Omgevingsbesluit][ref15] in de overige hoofdstukken respectievelijk
      de overige artikelen van de besluiten, genoemd in het eerste lid, onder a tot en met e, met de nieuwe nummering
      in overeenstemming:

      a. als toepassing is gegeven aan het eerste lid: de aanhaling van de hoofdstukken, afdelingen, paragrafen en
      artikelen van het [Besluit activiteiten leefomgeving][ref16], het [Besluit bouwwerken leefomgeving][ref17], het
      [Besluit kwaliteit leefomgeving][ref18] en het [Omgevingsbesluit][ref19];

      b. als toepassing is gegeven aan [artikel 5.5, eerste lid, van de Invoeringswet Omgevingswet][ref20]: de aanhaling
      van de hoofdstukken, afdelingen, paragrafen en artikelen van de [Omgevingswet][ref21].

      3 Als toepassing is gegeven aan:

      a. het eerste en tweede lid: wordt de vernummerde tekst van het [Besluit activiteiten leefomgeving][ref22],
      het [Besluit bouwwerken leefomgeving][ref23], het [Besluit kwaliteit leefomgeving][ref24] en het
      [Omgevingsbesluit][ref25] in het Staatsblad geplaatst;

      b. het tweede lid: wordt de vernummerde tekst van de overige hoofdstukken respectievelijk de overige artikelen van
      de besluiten, genoemd in het eerste lid, onder a tot en met e, in het Staatsblad geplaatst.


