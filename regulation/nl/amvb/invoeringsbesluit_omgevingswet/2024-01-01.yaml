    text: |-
      1 Dit artikel is van toepassing op besluiten waarmee toestemming wordt verleend voor het treffen van een andere
      maatregel van gelijkwaardig niveau op grond van het:

      a. [Activiteitenbesluit milieubeheer][ref1];

      b. [Besluit genetisch gemodificeerde organismen milieubeheer 2013][ref2];

      c. [Besluit lozing afvalwater huishoudens][ref3];

      d. [Besluit lozen buiten inrichtingen][ref4]; of

      e. [Waterbesluit][ref5].

      2 Als voor de inwerkingtreding van de [Omgevingswet][ref6] een aanvraag om een besluit is ingediend, waarmee
      toestemming wordt verleend voor het treffen van een andere maatregel van gelijkwaardig niveau, blijft het oude
      recht van toepassing tot het besluit onherroepelijk wordt.

      3 Een besluit waarbij is bepaald dat met een andere maatregel dan de voorgeschreven maatregel ten minste een
      gelijkwaardig niveau van bescherming wordt bereikt en dat onherroepelijk is, geldt als een toestemming als bedoeld
      in [artikel 4.7, eerste lid, van de Omgevingswet][ref7].


