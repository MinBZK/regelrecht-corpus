      onherroepelijk is, geldt als een besluit tot het stellen van maatwerkvoorschriften als bedoeld in
      [artikel 4.5 van de Omgevingswet][ref2], voor zover die ontheffing gaat over een onderwerp waarvoor het bevoegd
      gezag maatwerkvoorschriften kan stellen als bedoeld in dat artikel.


