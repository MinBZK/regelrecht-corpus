        bwb_id: BWBR0037885
  - number: 8.2.6
    text: |-
      1 Het oude recht blijft van toepassing op een verzoek om schadevergoeding dat wordt
      ingediend binnen vijf jaar na de inwerkingtreding van de [Omgevingswet][ref1], als voor de
      inwerkingtreding van die wet schade is veroorzaakt door een onherroepelijk besluit als bedoeld in
      [artikel 5, eerste lid, van het Besluit externe veiligheid buisleidingen][ref2].

      2 Als voor de inwerkingtreding van de [Omgevingswet][ref3]:

      a. een aanvraag om een besluit als bedoeld in het eerste lid is ingediend,

      b. een ontwerp van een ambtshalve te nemen besluit als bedoeld in het eerste lid ter inzage is gelegd, of

      c. voor een ambtshalve te nemen besluit als bedoeld in het eerste lid toepassing is gegeven aan
      [artikel 4:8 van de Algemene wet bestuursrecht][ref4] of een ambtshalve te nemen besluit is bekendgemaakt, en
      het besluit onherroepelijk wordt na de inwerkingtreding van de [Omgevingswet][ref5], blijft het oude recht van
      toepassing op een verzoek om schadevergoeding, veroorzaakt door dat besluit, als dat is ingediend binnen vijf jaar
      nadat het besluit is vastgesteld.

      3 Het oude recht blijft van toepassing op het verzoek om schadevergoeding tot het besluit op dat verzoek
      onherroepelijk wordt en, bij toewijzing van het verzoek, de toegewezen schadevergoeding volledig is betaald.

      4 [Afdeling 4.1 van de Invoeringswet Omgevingswet][ref6] is in die gevallen niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037885
