      1 Als een veiligheidscontour als bedoeld in [artikel 14 van het Besluit externe veiligheid inrichtingen][ref1]
      is vastgelegd in een onherroepelijk besluit, geldt dat besluit als deel van het omgevingsplan als bedoeld in
      [artikel 4.6, eerste lid, van de Invoeringswet Omgevingswet][ref2].

      2 De beoordelingsregels, bedoeld in [artikel 10 van het Besluit externe veiligheid inrichtingen][ref3], zoals
      dat artikel luidde voor de inwerkingtreding van de [Omgevingswet][ref4], blijven op een veiligheidscontour van
      toepassing tot:

      a. het omgevingsplan onherroepelijk voorziet in een risicogebied externe veiligheid; of

      b. het bevoegd gezag besluit om de veiligheidscontour niet als risicogebied externe veiligheid vast te leggen in
      het omgevingsplan.


