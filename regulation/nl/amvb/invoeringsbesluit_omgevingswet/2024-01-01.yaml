        bwb_id: BWBR0037885
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '4'
  - number: 8.1.1.4
    text: |-
      Een aanvraag om een ontheffing of vergunning voor een activiteit die voor de inwerkingtreding van de
      [Omgevingswet][ref1] is ingediend, en als op die activiteit na de inwerkingtreding van die wet een verbodsbepaling
      als bedoeld in [artikel 4.4, eerste lid, van de Omgevingswet][ref2] van toepassing is, geldt als een melding van
      die activiteit als bedoeld in dat lid. [Artikel 4.3 van de Invoeringswet Omgevingswet][ref3] is in dat geval niet
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037885
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0043660#Artikel4
    url: https://wetten.overheid.nl/BWBR0044923/2024-01-01#Artikel8.1.1
    references:
      - id: ref1
        bwb_id: BWBR0037885
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0043660
        artikel: '4'
  - number: 8.1.2.1
    text: |-
      Het oude recht blijft van toepassing op het verstrekken van gegevens, bedoeld
      in de [artikelen 3.16n, tweede lid][ref1], [3.68, eerste lid][ref2], en
      [3.73, eerste lid, van het Activiteitenbesluit milieubeheer][ref3], over het kalenderjaar dat voorafgaat aan de
      inwerkingtreding van de [Omgevingswet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0022762#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0044923/2024-01-01#Artikel8.1.2
    references:
