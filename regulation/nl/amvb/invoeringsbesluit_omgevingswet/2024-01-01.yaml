        paragraaf: 5.1.4
  - number: 8.2.4.3
    text: |-
      Als voor de inwerkingtreding van de [Omgevingswet][ref1] een aanvraag om een instemming voor een activiteit als
      bedoeld in [artikel 5a][ref2] of [8a van het Besluit algemene regels milieu mijnbouw][ref3] is ingediend, blijft
      het oude recht van toepassing totdat het besluit onherroepelijk wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0037885
      [ref2]: https://wetten.overheid.nl/BWBR0023771#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0023771#Artikel8a
    url: https://wetten.overheid.nl/BWBR0044923/2024-01-01#Artikel8.2.4
    references:
