    text: |-
      Voorschriften, beperkingen of voorwaarden als bedoeld in
      [artikel 5b van het Besluit algemene regels milieu mijnbouw][ref1] die voor de inwerkingtreding van de
      [Omgevingswet][ref2] aan een instemming zijn verbonden, gelden als vergunningvoorschriften als bedoeld in
      [paragraaf 5.1.4 van de Omgevingswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0023771#Artikel5b
      [ref2]: https://wetten.overheid.nl/BWBR0037885
      [ref3]: https://wetten.overheid.nl/BWBR0037885#Paragraaf5.1.4
