      1 Dit artikel is van toepassing op meldingen en kennisgevingen van een activiteit op grond van:

      a. het [Activiteitenbesluit milieubeheer][ref1];

      b. het [Besluit algemene regels milieu mijnbouw][ref2];

      c. het [Besluit externe veiligheid buisleidingen][ref3];

      d. het [Besluit lozing afvalwater huishoudens][ref4];

      e. het [Besluit lozen buiten inrichtingen][ref5];

      f. het [Besluit mobiel breken bouw- en sloopafval][ref6];

      g. het [Besluit ontgrondingen in rijkswateren][ref7];

      h. het [Besluit risico’s zware ongevallen 2015][ref8];

      i. het [Bouwbesluit 2012][ref9];

      j. het [Mijnbouwbesluit][ref10];

      k. het [Waterbesluit][ref11];

      l. de [Wet hygiëne en veiligheid badinrichtingen en zwemgelegenheden][ref12].

      2 Een melding of kennisgeving van een activiteit die voor de inwerkingtreding van de [Omgevingswet][ref13]
      is gedaan, en als op die activiteit na de inwerkingtreding van die wet een verbodsbepaling als bedoeld in
      [artikel 4.4, eerste lid, van de Omgevingswet][ref14] van toepassing is, geldt als een melding van die activiteit
      als bedoeld in dat lid.

      3 Een melding of kennisgeving van een activiteit die voor de inwerkingtreding van de [Omgevingswet][ref15]
      is gedaan, en als voor die activiteit na de inwerkingtreding van die wet op grond van
      [artikel 4.3, eerste lid, van de Omgevingswet][ref16] een andere informatieverplichting dan een melding geldt,
      geldt als een verstrekking van gegevens en bescheiden over die activiteit.

      4 Een aanvraag om een ontheffing of vergunning voor een activiteit die voor de inwerkingtreding van de
      [Omgevingswet][ref17] is ingediend, en als op die activiteit na de inwerkingtreding van die wet een verbodsbepaling
      als bedoeld in [artikel 4.4, eerste lid, van de Omgevingswet][ref18] van toepassing is, geldt als een melding van
      die activiteit als bedoeld in dat lid. [Artikel 4.3 van de Invoeringswet Omgevingswet][ref19] is in dat geval niet
      van toepassing.


