      [artikel 3.2 van het Besluit kwaliteit leefomgeving][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002660#Artikel10b
      [ref2]: https://wetten.overheid.nl/BWBR0041313#Artikel3
    url: https://wetten.overheid.nl/BWBR0044923/2024-01-01#Artikel8.3.3
