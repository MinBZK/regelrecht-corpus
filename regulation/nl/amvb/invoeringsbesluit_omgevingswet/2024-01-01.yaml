  - number: 8.2.11
    text: |-
      Een verordening als bedoeld in [artikel 2.2b, eerste lid, van het Besluit omgevingsrecht][ref1] die van kracht is,
      blijft tot een bij koninklijk besluit te bepalen tijdstip gelden.


