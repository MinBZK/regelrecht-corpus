      het [Besluit bouwwerken leefomgeving][ref2], het [Besluit kwaliteit leefomgeving][ref3] en het
      [Omgevingsbesluit][ref4] in de overige hoofdstukken respectievelijk de overige artikelen van de besluiten, genoemd
      in het eerste lid, onder a tot en met e, met de nieuwe nummering in overeenstemming:


