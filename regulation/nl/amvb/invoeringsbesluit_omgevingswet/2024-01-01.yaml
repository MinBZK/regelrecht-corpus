      van 1 januari van het eerste kalenderjaar na het kalenderjaar waarin het [Besluit activiteiten leefomgeving][ref2]
      in werking is getreden. Tot dat tijdstip blijft [titel 12.3 van de Wet milieubeheer][ref3], zoals deze luidde voor
      de inwerkingtreding van de [Omgevingswet][ref4], en de regels die bij of krachtenarts deze titel zijn gesteld van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0041330#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0041330
      [ref3]: https://wetten.overheid.nl/BWBR0003245
