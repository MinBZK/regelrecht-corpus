  - number: 8.1.1.3
    text: |-
      Een melding of kennisgeving van een activiteit die voor de inwerkingtreding van de [Omgevingswet][ref1]
      is gedaan, en als voor die activiteit na de inwerkingtreding van die wet op grond van
      [artikel 4.3, eerste lid, van de Omgevingswet][ref2] een andere informatieverplichting dan een melding geldt, geldt
      als een verstrekking van gegevens en bescheiden over die activiteit.


      [ref1]: https://wetten.overheid.nl/BWBR0037885
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel4
    url: https://wetten.overheid.nl/BWBR0044923/2024-01-01#Artikel8.1.1
    references:
