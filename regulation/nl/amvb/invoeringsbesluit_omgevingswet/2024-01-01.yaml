      1 Een instemming voor een activiteit als bedoeld in de [artikelen 5a][ref1] en
      [8a van het Besluit algemene regels milieu mijnbouw][ref2] die onherroepelijk is, geldt als een omgevingsvergunning
      voor die activiteit als bedoeld in [artikel 3.321 van het Besluit activiteiten leefomgeving][ref3].

      2 Voorschriften, beperkingen of voorwaarden als bedoeld in
      [artikel 5b van het Besluit algemene regels milieu mijnbouw][ref4] die voor de inwerkingtreding van de
      [Omgevingswet][ref5] aan een instemming zijn verbonden, gelden als vergunningvoorschriften als bedoeld in
      [paragraaf 5.1.4 van de Omgevingswet][ref6].

      3 Als voor de inwerkingtreding van de [Omgevingswet][ref7] een aanvraag om een instemming voor een activiteit als
      bedoeld in [artikel 5a][ref8] of [8a van het Besluit algemene regels milieu mijnbouw][ref9] is ingediend, blijft
      het oude recht van toepassing totdat het besluit onherroepelijk wordt.


