    text: |-
      1 Dit artikel is van toepassing op activiteiten waarvoor uitzonderingen zijn opgenomen of voorwaarden zijn gesteld
      voor de toepassing van een bepaling:

      a. op grond van het [Activiteitenbesluit milieubeheer][ref1];

      b. op grond van het [Besluit externe veiligheid buisleidingen][ref2];

      c. in het [Besluit hygiëne en veiligheid badinrichtingen en zwemgelegenheden][ref3]; of

      d. in het [Besluit lozen buiten inrichtingen][ref4].

      2 Als op een activiteit voor de inwerkingtreding van de [Omgevingswet][ref5] een bepaling niet van toepassing is,
      omdat die activiteit valt onder een uitzondering op die bepaling, blijft die uitzondering, zoals die luidde voor de
      inwerkingtreding van de Omgevingswet, nog twee kalenderjaren na de inwerkingtreding van die wet op die activiteit
      van toepassing, mits die activiteit naar aard en omvang niet verschilt van de activiteit zoals die werd verricht
      voor de inwerkingtreding van de Omgevingswet.

      3 Als op een activiteit voor de inwerkingtreding van de [Omgevingswet][ref6] een bepaling niet van toepassing is,
      omdat de aan die activiteit gestelde voorwaarde niet van toepassing is, blijft die voorwaarde, zoals die luidde
      voor de inwerkingtreding van de Omgevingswet, nog twee kalenderjaren na de inwerkingtreding van die wet van
      toepassing als een aan die activiteit gestelde voorwaarde.

      4 Het tweede en derde lid zijn alleen van toepassing op die activiteiten die in
      [hoofdstuk 3 van het Besluit activiteiten leefomgeving][ref7] zijn aangewezen.


