    text: |-
      1 Als voor de inwerkingtreding van [afdeling 13.3 van het Omgevingsbesluit][ref1] een overtreding van een bij
      of krachtens het [Besluit risico’s zware ongevallen 2015][ref2] gestelde verplichting heeft plaatsgevonden, is
      aangevangen of het gevaar voor een dergelijke overtreding klaarblijkelijk dreigde, en voor de inwerkingtreding van
      die afdeling een bestuurlijke sanctie is opgelegd voor die overtreding of dreigende overtreding, blijft het oude
      recht op die bestuurlijke sanctie van toepassing tot het tijdstip waarop:

      a. de beschikking onherroepelijk is geworden en volledig is uitgevoerd of ten uitvoer is gelegd;

      b. de beschikking is ingetrokken of is komen te vervallen; of

      c. als de beschikking gaat om de oplegging van een last onder dwangsom:

      1°. de last volledig is uitgevoerd;

      2°. de dwangsom volledig is verbeurd en betaald; of

      3°. de last is opgeheven.

      2 Als voor de inwerkingtreding van [afdeling 13.3 van het Omgevingsbesluit][ref3] een bestuurlijke boete als
      bedoeld in [artikel 17, tweede lid, van het Besluit risico’s zware ongevallen 2015][ref4] is opgelegd, blijft het
      oude recht van toepassing tot het tijdstip waarop de beschikking onherroepelijk is geworden of is ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0041278#Afdeling13.3
      [ref2]: https://wetten.overheid.nl/BWBR0036791
