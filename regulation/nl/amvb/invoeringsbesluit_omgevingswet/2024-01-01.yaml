    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister voor Milieu en Wonen van 20 februari 2020, nr. 2020-0000071964, Constitutionele
    Zaken en Wetgeving, gedaan mede namens Onze Minister van Defensie, Onze Minister van Economische Zaken en Klimaat,
    Onze Minister van Infrastructuur en Waterstaat, Onze Minister van Justitie en Veiligheid, Onze Minister van
    Landbouw, Natuur en Voedselkwaliteit, Onze Minister van Onderwijs, Cultuur en Wetenschap, Onze Minister van Sociale
    Zaken en Werkgelegenheid en Onze Minister van Volksgezondheid, Welzijn en Sport;

    Gelet op de bio-verordening, de grondwaterrichtlijn, de kaderrichtlijn afvalstoffen, de kaderrichtlijn water,
    de mer-richtlijn, de nec-richtlijn, de nitraatrichtlijn, de richtlijn autowrakken, de richtlijn duurzaam gebruik
