        artikel: 5a
      - id: ref3
        bwb_id: BWBR0023771
        artikel: 8a
  - number: 8.2.5.1
    text: |-
      Voor de toepassing van [artikel 2.2, tweede lid, onder d, van het Besluit Erfgoedwet archeologie][ref1] wordt
      onder gemeentelijk monument respectievelijk voorbeschermd gemeentelijk monument ook verstaan een monument of
      archeologisch monument dat voor de inwerkingtreding van de [Omgevingswet][ref2] op grond van een gemeentelijke
      verordening is aangewezen respectievelijk waarop, voordat het is aangewezen, die verordening van overeenkomstige
      toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0037866#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0044923/2024-01-01#Artikel8.2.5
    references:
      - id: ref1
        bwb_id: BWBR0037866
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0037885
  - number: 8.2.5.2
    text: 'Het eerste lid is van toepassing:'
    url: https://wetten.overheid.nl/BWBR0044923/2024-01-01#Artikel8.2.5
  - number: 8.2.5.2.a
    text: |-
      als het gaat om een aangewezen monument of archeologisch monument: zolang in het omgevingsplan daaraan nog niet de
      functie-aanduiding gemeentelijk monument is gegeven; en
    url: https://wetten.overheid.nl/BWBR0044923/2024-01-01#Artikel8.2.5
  - number: 8.2.5.2.b
    text: |-
      als het gaat om een monument of archeologisch monument waarop voordat het is aangewezen de verordening van
      overeenkomstige toepassing is: zolang in het omgevingsplan daaraan nog niet de functie-aanduiding gemeentelijk
      monument is gegeven of het omgevingsplan nog geen voorbeschermingsregel bevat vanwege het voornemen om die functie-
      aanduiding te geven.
    url: https://wetten.overheid.nl/BWBR0044923/2024-01-01#Artikel8.2.5
  - number: 8.2.6.1
    text: |-
      Het oude recht blijft van toepassing op een verzoek om schadevergoeding dat wordt
      ingediend binnen vijf jaar na de inwerkingtreding van de [Omgevingswet][ref1], als voor de
      inwerkingtreding van die wet schade is veroorzaakt door een onherroepelijk besluit als bedoeld in
      [artikel 5, eerste lid, van het Besluit externe veiligheid buisleidingen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037885
      [ref2]: https://wetten.overheid.nl/BWBR0028265#Artikel5
    url: https://wetten.overheid.nl/BWBR0044923/2024-01-01#Artikel8.2.6
    references:
      - id: ref1
        bwb_id: BWBR0037885
      - id: ref2
        bwb_id: BWBR0028265
        artikel: '5'
  - number: 8.2.6.2
    text: |-
      Als voor de inwerkingtreding van de [Omgevingswet][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0044923/2024-01-01#Artikel8.2.6
    references:
      - id: ref1
        bwb_id: BWBR0037885
  - number: 8.2.6.2.a
    text: een aanvraag om een besluit als bedoeld in het eerste lid is ingediend,
    url: https://wetten.overheid.nl/BWBR0044923/2024-01-01#Artikel8.2.6
  - number: 8.2.6.2.b
    text: een ontwerp van een ambtshalve te nemen besluit als bedoeld in het eerste lid ter inzage is gelegd, of
    url: https://wetten.overheid.nl/BWBR0044923/2024-01-01#Artikel8.2.6
  - number: 8.2.6.2.c
    text: |-
      voor een ambtshalve te nemen besluit als bedoeld in het eerste lid toepassing is gegeven aan
      [artikel 4:8 van de Algemene wet bestuursrecht][ref1] of een ambtshalve te nemen besluit is bekendgemaakt, en
      het besluit onherroepelijk wordt na de inwerkingtreding van de [Omgevingswet][ref2], blijft het oude recht van
      toepassing op een verzoek om schadevergoeding, veroorzaakt door dat besluit, als dat is ingediend binnen vijf jaar
      nadat het besluit is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0044923/2024-01-01#Artikel8.2.6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0037885
  - number: 8.2.6.3
    text: |-
      Het oude recht blijft van toepassing op het verzoek om schadevergoeding tot het besluit op dat verzoek
      onherroepelijk wordt en, bij toewijzing van het verzoek, de toegewezen schadevergoeding volledig is betaald.
    url: https://wetten.overheid.nl/BWBR0044923/2024-01-01#Artikel8.2.6
  - number: 8.2.6.4
    text: |-
      [Afdeling 4.1 van de Invoeringswet Omgevingswet][ref1] is in die gevallen niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0043660#Afdeling4.1
    url: https://wetten.overheid.nl/BWBR0044923/2024-01-01#Artikel8.2.6
    references:
      - id: ref1
        bwb_id: BWBR0043660
        afdeling: '4.1'
  - number: 8.2.7.1
    text: |-
      Als een veiligheidscontour als bedoeld in [artikel 14 van het Besluit externe veiligheid inrichtingen][ref1]
      is vastgelegd in een onherroepelijk besluit, geldt dat besluit als deel van het omgevingsplan als bedoeld in
      [artikel 4.6, eerste lid, van de Invoeringswet Omgevingswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0043660#Artikel4
    url: https://wetten.overheid.nl/BWBR0044923/2024-01-01#Artikel8.2.7
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0043660
        artikel: '4'
  - number: 8.2.7.2
    text: |-
      De beoordelingsregels, bedoeld in [artikel 10 van het Besluit externe veiligheid inrichtingen][ref1], zoals
      dat artikel luidde voor de inwerkingtreding van de [Omgevingswet][ref2], blijven op een veiligheidscontour van
      toepassing tot:


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0044923/2024-01-01#Artikel8.2.7
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0037885
  - number: 8.2.7.2.a
    text: het omgevingsplan onherroepelijk voorziet in een risicogebied externe veiligheid; of
    url: https://wetten.overheid.nl/BWBR0044923/2024-01-01#Artikel8.2.7
  - number: 8.2.7.2.b
    text: |-
      het bevoegd gezag besluit om de veiligheidscontour niet als risicogebied externe veiligheid vast te leggen in het
      omgevingsplan.
    url: https://wetten.overheid.nl/BWBR0044923/2024-01-01#Artikel8.2.7
  - number: 8.2.8.1
    text: |-
      Als voor de inwerkingtreding van de [Omgevingswet][ref1] voor een
      beschikking als bedoeld in de [artikelen 12, eerste lid][ref2], en
      [37, eerste lid, van het Besluit hygiëne en veiligheid badinrichtingen en zwemgelegenheden][ref3]
      toepassing is gegeven aan [artikel 4:8 van de Algemene wet bestuursrecht][ref4] of de beschikking
      is bekendgemaakt, blijft het oude recht toepassing tot de beschikking onherroepelijk wordt.
      [Artikel 4.5 van de Invoeringswet Omgevingswet][ref5] is in dat geval niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037885
      [ref2]: https://wetten.overheid.nl/BWBR0003716#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0003716#Artikel37
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0043660#Artikel4
    url: https://wetten.overheid.nl/BWBR0044923/2024-01-01#Artikel8.2.8
    references:
