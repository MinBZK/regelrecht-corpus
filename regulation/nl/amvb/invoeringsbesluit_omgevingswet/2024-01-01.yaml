      krachtens het [Besluit risico’s zware ongevallen 2015][ref2] gestelde verplichting heeft plaatsgevonden, is
      aangevangen of het gevaar voor een dergelijke overtreding klaarblijkelijk dreigde, en voor de inwerkingtreding van
      die afdeling een bestuurlijke sanctie is opgelegd voor die overtreding of dreigende overtreding, blijft het oude
      recht op die bestuurlijke sanctie van toepassing tot het tijdstip waarop:


