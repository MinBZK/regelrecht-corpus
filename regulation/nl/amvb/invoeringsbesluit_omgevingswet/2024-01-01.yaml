  - number: 8.1.5
    text: |-
      1 Dit artikel is van toepassing op besluiten tot het stellen van maatwerkvoorschriften of nadere voorschriften, het
      opleggen van nadere voorwaarden of het nemen van maatregelen op grond van:

      a. het [Activiteitenbesluit milieubeheer][ref1];

      b. het [Besluit algemene regels milieu mijnbouw][ref2];

      c. het [Besluit externe veiligheid buisleidingen][ref3];

      d. het [Besluit hygiëne en veiligheid badinrichtingen en zwemgelegenheden][ref4];

      e. het [Besluit lozing afvalwater huishoudens][ref5];

      f. het [Besluit lozen buiten inrichtingen][ref6];

      g. het [Bouwbesluit 2012][ref7];

      h. het [Vuurwerkbesluit][ref8];

      i. het [Waterbesluit][ref9]; of

      j. de [Wet hygiëne en veiligheid badinrichtingen en zwemgelegenheden][ref10].

      2 Als voor de inwerkingtreding van de [Omgevingswet][ref11] een aanvraag om een besluit tot het stellen van
      maatwerkvoorschriften is ingediend, blijft het oude recht van toepassing tot het besluit onherroepelijk wordt.

      3 Als voor de inwerkingtreding van de [Omgevingswet][ref12] een ontwerp van een besluit tot het stellen van
      maatwerkvoorschriften of het opleggen van nadere voorwaarden ter inzage is gelegd op de voorbereiding waarvan
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref13] van toepassing is, blijft het oude recht van toepassing tot
      het besluit onherroepelijk wordt.

      4 Als voor de inwerkingtreding van de [Omgevingswet][ref14] voor een besluit tot het stellen van
      maatwerkvoorschriften of nadere voorschriften, het opleggen van nadere voorwaarden of het nemen van maatregelen,
      toepassing is gegeven aan [artikel 4:8 van de Algemene wet bestuursrecht][ref15] of het besluit is bekendgemaakt,
      blijft het oude recht van toepassing tot het besluit onherroepelijk wordt.

      5 Een besluit tot het stellen van maatwerkvoorschriften of nadere voorschriften, het opleggen van nadere
      voorwaarden, of het nemen van maatregelen dat onherroepelijk is, geldt als:

      a. een besluit tot het stellen van maatwerkvoorschriften als bedoeld in [artikel 4.5 van de Omgevingswet][ref16],
      voor zover die voorschriften of nadere voorwaarden gaan over een onderwerp waarvoor het bevoegd gezag
      maatwerkvoorschriften kan stellen als bedoeld in dat artikel; of

      b. een besluit tot het verbinden van voorschriften aan een omgevingsvergunning als op grond van
      [artikel 4.5, derde lid, van de Omgevingswet][ref17] is bepaald dat een maatwerkvoorschrift niet kan worden gesteld
      omdat over een onderwerp een voorschrift aan een omgevingsvergunning kan worden verbonden.

      6 Als sprake is van een omgevingsvergunning van rechtswege als bedoeld in
      [artikel 4.14 van de Invoeringswet Omgevingswet][ref18] en voor die activiteit voor de inwerkingtreding
      van de [Omgevingswet][ref19] een besluit tot het stellen van maatwerkvoorschriften onherroepelijk
      is, geldt dat besluit als het verbinden van voorschriften aan die omgevingsvergunning als krachtens
      [artikel 4.5, derde lid, van de Omgevingswet][ref20] is bepaald dat een maatwerkvoorschrift niet kan worden gesteld
      als over het onderwerp een voorschrift aan een omgevingsvergunning kan worden verbonden.


