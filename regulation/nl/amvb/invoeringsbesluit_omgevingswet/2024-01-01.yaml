        artikel: '4'
  - number: 8.2.8.2
    text: |-
      Een beschikking als bedoeld in de [artikelen 12, eerste lid][ref1], en
      [37, eerste lid, van het Besluit hygiëne en veiligheid badinrichtingen en zwemgelegenheden][ref2]
      die onherroepelijk is, geldt als een besluit tot het stellen van maatwerkvoorschriften als bedoeld in
      [artikel 4.5 van de Omgevingswet][ref3], voor zover die beschikking gaat over een onderwerp waarvoor het bevoegd
      gezag maatwerkvoorschriften kan stellen als bedoeld in dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0003716#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0003716#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0037885#Artikel4
