      1 Het oude recht blijft van toepassing op het verstrekken van gegevens,
      bedoeld in de [artikelen 3.16n, tweede lid][ref1], [3.68, eerste lid][ref2], en
      [3.73, eerste lid, van het Activiteitenbesluit milieubeheer][ref3], over het kalenderjaar dat voorafgaat aan de
      inwerkingtreding van de [Omgevingswet][ref4].

      2 Het oude recht blijft van toepassing op het verstrekken van gegevens, bedoeld in
      [artikel 6.11d van het Waterbesluit][ref5], over het kalenderjaar dat voorafgaat aan het kalenderjaar waarin de
      [Omgevingswet][ref6] in werking treedt.

      3 Het oude recht blijft van toepassing op het verstrekken van gegevens, bedoeld in
      [artikel 3a.8 van het Besluit lozen buiten inrichtingen][ref7], over het kalenderjaar dat voorafgaat aan het
      kalenderjaar waarin de [Omgevingswet][ref8] in werking treedt.


