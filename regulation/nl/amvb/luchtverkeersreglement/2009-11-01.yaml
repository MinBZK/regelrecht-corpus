  - number: '2'
    text: |-
      Voor zover de LVNL beslissingen neemt ingevolge de bij of krachtens dit besluit verleende bevoegdheden die mede
      betrekking hebben op het militaire luchtverkeer handelt zij in overeenstemming met Onze Minister van Defensie.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel2
  - number: '3.1'
    text: |-
      Onze Minister stelt voor elk luchtverkeersdienstverleningsgebied de luchtverkeersdienstverleningsklasse vast met
      inachtneming van de volgende indeling:
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel3
  - number: 3.1.a
    text: |-
      klasse A: uitsluitend IFR-vluchten zijn toegestaan; aan alle vluchten worden luchtverkeersleidingsdiensten
      verleend; alle vluchten worden onderling gesepareerd;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel3
  - number: 3.1.b
    text: |-
      klasse B: zowel IFR- als VFR-vluchten zijn toegestaan; aan alle vluchten worden luchtverkeersleidingsdiensten
      verleend; alle vluchten worden onderling gesepareerd;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel3
  - number: 3.1.c
    text: |-
      klasse C: zowel IFR- als VFR-vluchten zijn toegestaan; aan alle vluchten worden luchtverkeersleidingsdiensten
      verleend; IFR-vluchten worden gesepareerd van andere IFR-vluchten en van VFR-vluchten; VFR-vluchten worden
      gesepareerd van IFR-vluchten en ontvangen luchtverkeersinformatie betreffende andere VFR-vluchten;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel3
  - number: 3.1.d
    text: |-
      klasse D: zowel IFR- als VFR-vluchten zijn toegestaan; aan alle vluchten worden luchtverkeersleidingsdiensten
      verleend, IFR-vluchten worden gesepareerd van andere IFR-vluchten en ontvangen luchtverkeersinformatie betreffende
      VFR-vluchten; VFR-vluchten ontvangen luchtverkeersinformatie betreffende andere vluchten;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel3
  - number: 3.1.e
    text: |-
      klasse E: zowel IFR- als VFR-vluchten zijn toegestaan; aan IFR-vluchten worden luchtverkeersleidingsdiensten
      verleend; IFR-vluchten worden gesepareerd van andere IFR-vluchten; alle vluchten ontvangen voor zover uitvoerbaar
      luchtverkeersinformatie;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel3
  - number: 3.1.f
    text: |-
      klasse F: zowel IFR- als VFR-vluchten zijn toegestaan; deelnemende IFR-vluchten ontvangen vlucht-advisering en alle
      vluchten ontvangen op verzoek vluchtinformatie;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel3
  - number: 3.1.g
    text: 'klasse G: IFR- en VFR-vluchten zijn toegestaan en ontvangen op verzoek vluchtinformatie.'
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel3
  - number: '3.2'
    text: Onze Minister kan nadere regels geven met betrekking tot de luchtverkeersdienstverleningsklassen.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel3
  - number: '4.1'
    text: 'Luchtverkeersleidingsdiensten worden verleend aan de volgende vluchten:'
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel4
  - number: 4.1.a
    text: alle IFR-vluchten in luchtverkeersdienstverleningsgebieden klasse A, B, C, D en E;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel4
  - number: 4.1.b
    text: alle VFR-vluchten in luchtverkeersdienstverleningsgebieden klasse B, C en D;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel4
  - number: 4.1.c
    text: alle bijzondere VFR-vluchten;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel4
  - number: 4.1.d
    text: het luchthavenverkeer van een gecontroleerde luchthaven.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel4
  - number: '4.2'
    text: |-
      Het eerste lid, onder b, geldt niet voor VFR-vluchten met luchtvaartuigen in luchtverkeersdienstverleningsgebied
      klasse C, indien bij regeling van Onze Minister in het belang van de veiligheid van het luchtverkeer daarvoor
      regels worden gegeven.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel4
  - number: '4.3'
    text: 'Klaringen voorzien in separatie tussen:'
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel4
  - number: 4.3.a
    text: alle vluchten in klasse A en B gebieden;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel4
  - number: 4.3.b
    text: IFR-vluchten in klasse C, D en E gebieden;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel4
  - number: 4.3.c
    text: IFR- en VFR-vluchten in klasse C gebieden;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel4
  - number: 4.3.d
    text: IFR-vluchten en bijzondere VFR-vluchten;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel4
  - number: 4.3.e
    text: bijzondere VFR-vluchten onderling.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel4
  - number: '5.1'
    text: 'Vluchtinformatie wordt verstrekt aan alle luchtvaartuigen indien:'
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel5
  - number: 5.1.a
    text: aan deze luchtvaartuigen luchtverkeersleidingsdiensten worden verleend;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel5
  - number: 5.1.b
    text: deze luchtvaartuigen anderszins bekend zijn bij de betrokken verlener van luchtverkeersdiensten, of;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel5
  - number: 5.1.c
    text: deze informatie van invloed kan zijn op de vluchtuitvoering.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel5
  - number: '5.2'
    text: 'Vluchtinformatie omvat:'
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel5
  - number: 5.2.a
    text: |-
      inlichtingen verstrekt door een meteorologische dienst betreffende het optreden of verwachte optreden van bepaalde
      weersverschijnselen langs de vliegroute, die de veiligheid van de vluchtuitvoering kunnen beïnvloeden;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel5
  - number: 5.2.b
    text: inlichtingen over wijziging in de bruikbaarheid van navigatie-hulpmiddelen;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel5
  - number: 5.2.c
    text: |-
      inlichtingen over wijzigingen in de staat waarin luchthavens en bijbehorende faciliteiten verkeren, met inbegrip
      van de staat waarin het landingsterrein en de platforms zich bevinden ten gevolge van de aanwezigheid van sneeuw,
      ijs of water;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel5
  - number: 5.2.d
    text: andere beschikbare gegevens die de veiligheid van de vlucht kunnen beïnvloeden;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel5
  - number: 5.2.e
    text: gemelde of verwachte weersomstandigheden op luchthavens van aankomst en vertrek en op uitwijkhavens;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel5
  - number: 5.2.f
    text: mogelijk botsingsgevaar voor vluchten in de klasse C, D, E, F en G gebieden.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel5
  - number: '5.3'
    text: |-
      Vluchtinformatie aan VFR-vluchten omvat, naast de in het tweede lid, onderdeel *a* tot en met *d* bedoelde gegevens
      voor zover beschikbaar, inlichtingen omtrent ander luchtverkeer en mogelijke instrumentweersomstandigheden langs
      de vliegroute.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel5
  - number: '6'
    text: 'Alarmering wordt verzorgd:'
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel6
  - number: 6.a
    text: voor alle vluchten waaraan luchtverkeersleidingsdiensten worden verleend;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel6
  - number: 6.b
    text: |-
      voorzover uitvoerbaar voor andere vluchten waarvoor een vliegplan is ingediend of die anderszins bekend zijn bij de
      betrokken verleners van luchtverkeersdiensten;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel6
  - number: 6.c
    text: |-
      voor elk luchtvaartuig waarvan bekend is of verondersteld wordt dat het is onderworpen aan wederrechtelijke
      inmenging.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel6
  - number: '7.1'
    text: 'Onze Minister wijst in het vluchtinformatiegebied Amsterdam aan:'
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel7
  - number: 7.1.a
    text: algemene luchtverkeersleidingsgebieden;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel7
  - number: 7.1.b
    text: plaatselijke luchtverkeersleidingsgebieden;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel7
  - number: 7.1.c
    text: gecontroleerde luchthavens.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel7
  - number: '7.2'
    text: |-
      Onze Minister bepaalt, door welke verleners van luchtverkeersdiensten, in welke gebieden binnen het
      vluchtinformatiegebied Amsterdam en op welke gecontroleerde luchthaventerreinen luchtverkeersdiensten worden
      verleend.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel7
  - number: '8'
    text: |-
      Onze Minister kan ter bescherming van het luchtverkeer ten opzichte van bepaalde soorten luchtverkeer of van
      bijzondere luchtverkeersactiviteiten, delen van het vluchtinformatiegebied Amsterdam aanwijzen als bijzondere
      luchtverkeersgebieden; aan deze aanwijzingen kunnen regels worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel8
  - number: '9'
    text: 'Onze Minister kan regels geven voor:'
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel9
  - number: 9.a
    text: de wijze waarop luchtverkeersdiensten worden verleend;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel9
  - number: 9.b
    text: de luchtvaarttelecommunicatie;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel9
  - number: 9.c
    text: het tijdens de vlucht verstrekken van gegevens en luchtvaartinlichtingen.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel9
  - number: '10.1'
    text: |-
      Onze Minister stelt in het vluchtinformatiegebied Amsterdam luchtverkeersroutes en -procedures vast, waaronder mede
      zijn begrepen: naderings-, vertrek- en wachtprocedures, alsmede luchtverkeerspatronen voor luchthavenverkeer.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel10
  - number: '10.2'
    text: |-
      De gezagvoerder voert een vlucht uit volgens de bij regeling van Onze Minister vastgestelde luchtverkeersroutes
      en luchtverkeersprocedures alsmede luchtverkeerspatronen voor luchthavenverkeer tenzij door een verlener van
      luchtverkeersleidingsdiensten een anders luidende opdracht is gegeven.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel10
  - number: '11.1'
    text: |-
      Een luchtvaartuig wordt zowel op het landingsterrein en de platforms als tijdens de vlucht gebruikt in
      overeenstemming met de algemene vliegvoorschriften.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel11
  - number: '11.2'
    text: |-
      Een luchtvaartuig wordt in het luchtruim gebruikt in overeenstemming met de zichtvliegvoorschriften of de
      instrumentvliegvoorschriften.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel11
  - number: '12'
    text: Onze Minister geeft regels met betrekking tot het gebruik van de hoogtemeter en het bepalen van kruishoogtes.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel12
  - number: '13.1'
    text: Het is verboden voorwerpen of stoffen te verwijderen tijdens de vlucht.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel13
  - number: '13.2'
    text: 'Het eerste lid geldt niet ingeval van verwijderen van:'
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel13
  - number: 13.2.a
    text: los fijn zand;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel13
  - number: 13.2.b
    text: water;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel13
  - number: 13.2.c
    text: stoffen ter bevordering of ter bescherming van het milieu dan wel de land-, tuin- of bosbouw;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel13
  - number: 13.2.d
    text: |-
      voorwerpen waarvan de massa niet meer is dan 200 gram per voorwerp, overeenkomstig door Onze Minister te stellen
      regels;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel13
  - number: 13.2.e
    text: voorwerpen en stoffen voor militaire doeleinden of uit militaire luchtvaartuigen;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel13
  - number: 13.2.f
    text: voorwerpen die verband houden met opsporings- en reddingsakties;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel13
  - number: 13.2.g
    text: voorwerpen en stoffen voor politiedoeleinden.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel13
  - number: '13.3'
    text: |-
      Bij regeling van Onze Minister kan vrijstelling worden verleend van het in het eerste lid gestelde verbod. Een
      vrijstelling kan onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel13
  - number: '13.4'
    text: |-
      Onze Minister kan ontheffing verlenen van het in het eerste lid gestelde verbod. Een ontheffing kan onder
      beperkingen worden verleend. Aan een ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel13
  - number: '13.5'
    text: Het is verboden te handelen in strijd met voorschriften als bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel13
  - number: '14.1'
    text: Het is verboden luchtvaartuigen of andere voorwerpen tijdens de vlucht te slepen.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel14
  - number: '14.2'
    text: 'Het eerste lid geldt, overeenkomstig door Onze Minister te stellen regels, niet voor de volgende vluchten:'
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel14
  - number: 14.2.a
    text: vluchten waarbij een zweefvliegtuig wordt gesleept;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel14
  - number: 14.2.b
    text: vluchten waarbij een sleepnet wordt gesleept;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel14
  - number: 14.2.c
    text: vluchten waarbij voor militaire doeleinden wordt gesleept.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel14
  - number: '14.3'
    text: |-
      Bij regeling van Onze Minister kan vrijstelling worden verleend van het in het eerste lid gestelde verbod. Een
      vrijstelling kan onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel14
  - number: '14.4'
    text: |-
      Onze Minister kan ontheffing verlenen van het in het eerste lid gestelde verbod. Een ontheffing kan onder
      beperkingen worden verleend. Aan een ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel14
  - number: '14.5'
    text: Het is verboden te handelen in strijd met voorschriften als bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel14
  - number: '16.1'
    text: |-
      Het is verboden een vlucht uit te voeren, waarbij met opzet bewegingen worden uitgevoerd die een plotselinge
      verandering in de stand, een abnormale stand of een abnormale verandering in de snelheid van het luchtvaartuig
      meebrengen.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel16
  - number: '16.2'
    text: 'Het eerste lid geldt niet voor:'
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel16
  - number: 16.2.a
    text: |-
      vluchten met militaire luchtvaartuigen, indien de gezagvoerder de door Onze Minister van Defensie vastgestelde
      regels nakomt;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel16
  - number: 16.2.b
    text: |-
      vluchten onder zichtweersomstandigheden indien de gezagvoerder van het luchtvaartuig verscherpte waakzaamheid
      betracht met het doel botsingsgevaar tijdig te kunnen onderkennen en de voorgeschreven maatregelen tot het
      vermijden van botsingen tijdig te kunnen nemen en indien:
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel16
  - number: 16.2.b.1
    text: |-
      op een zodanige horizontale of verticale afstand van gebieden met aaneengesloten bebouwing of mensenverzameling
      wordt gevlogen dat bij het uitvoeren van de in het eerste lid bedoelde vlucht personen of zaken op het
      aardoppervlak niet in gevaar kunnen worden gebracht;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel16
  - number: 16.2.b.2
    text: |-
      het luchtvaartuig niet een voorwerp of ander luchtvaartuig in de lucht sleept of geen valschermspringers naar het
      afspringpunt brengt.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel16
  - number: '17.1'
    text: Het is verboden een ander luchtvaartuig zo dicht te naderen dat gevaar voor botsing ontstaat.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel17
  - number: '17.2'
    text: |-
      Het is verboden in gesloten verband vluchten uit te voeren, tenzij dienaangaande vooraf een regeling is
      getroffen tussen de gezagvoerders onderling en - bij gecontroleerde vluchten - met de betrokken verlener van
      luchtverkeersleidingsdiensten.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel17
  - number: '18.1'
    text: |-
      Een gezagvoerder neemt de beste maatregelen om een botsing te voorkomen, daarbij inbegrepen de manoeuvres om een
      botsing te vermijden gebaseerd op een RA.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel18
  - number: '18.2'
    text: |-
      Onverminderd het eerste lid, volgt een gezagvoerder van een luchtvaartuig dat voorzien is van ACAS, een RA direct
      op, zelfs indien deze afwijkt van een klaring van de betrokken verlener van luchtverkeersleidingsdiensten.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel18
  - number: '18.3'
    text: De gezagvoerder van een luchtvaartuig dat voorrang heeft, behoudt zijn koers en snelheid.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel18
  - number: '18.4'
    text: |-
      Het is verboden, indien ingevolge de [artikelen 19 tot en met 26][ref1] voor een ander luchtvaartuig wordt
      uitgeweken, boven, onder of vóór dat luchtvaartuig langs te gaan, tenzij daarbij op ruime afstand wordt gebleven en
      er voor het andere luchtvaartuig geen gevolgen merkbaar zijn van luchtwervelingen veroorzaakt door het uitwijkende
      luchtvaartuig.


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel19
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '19'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '2'
  - number: '18.5'
    text: |-
      Een gezagvoerder die, gevolg gevend aan een RA, afwijkt van een klaring, meldt dit terstond aan de betrokken
      verlener van luchtverkeersleidingsdiensten.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel18
  - number: '18.6'
    text: |-
      Indien de gezagvoerder een melding als bedoeld in het derde lid heeft gedaan, geeft de luchtverkeersleider aan dat
      luchtvaartuig geen opdrachten die tegenstrijdig zijn aan de RA.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel18
  - number: '18.7'
    text: |-
      Na de afwijking van de klaring als gevolg van de RA wordt de vlucht zo spoedig mogelijk hervat overeenkomstig
      de oorspronkelijk verkregen klaring of overeenkomstig een nieuwe klaring verkregen van de betrokken verlener van
      luchtverkeersleidingsdiensten.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel18
  - number: '19'
    text: |-
      Wanneer twee luchtvaartuigen elkaar recht vooruit of bijna recht vooruit naderen en gevaar voor botsing bestaat,
      verlegt elk van deze luchtvaartuigen zijn koers naar rechts.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel19
  - number: '20.1'
    text: |-
      Indien twee luchtvaartuigen van dezelfde categorie op dezelfde of bijna dezelfde hoogte koersen volgen die elkaar
      kruisen, wordt voorrang verleend door het luchtvaartuig dat het andere luchtvaartuig rechts van zich heeft.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel20
  - number: '20.2'
    text: 'Voorts gelden de volgende voorrangsregels:'
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel20
  - number: 20.2.a
    text: vliegtuigen en helikopters verlenen voorrang aan luchtschepen, zweeftoestellen en vrije ballonnen;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel20
  - number: 20.2.b
    text: luchtschepen verlenen voorrang aan zweeftoestellen en vrije ballonnen;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel20
  - number: 20.2.c
    text: zweeftoestellen verlenen voorrang aan vrije ballonnen;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel20
  - number: 20.2.d
    text: |-
      vliegtuigen, helikopters en luchtschepen verlenen voorrang aan luchtvaartuigen waarvan wordt gezien dat zij een
      ander luchtvaartuig of voorwerp slepen;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel20
  - number: 20.2.e
    text: |-
      luchtvaartuigen, bedoeld in [artikel 1a][ref1], modelraketten en overige luchtvaartuigen die niet zijn gedefinieerd
      in [artikel 1][ref2] verlenen voorrang aan vliegtuigen, helikopters, vrije ballonnen en luchtschepen.


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0005775#Artikel1
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: 1a
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0005775
        artikel: '1'
        hoofdstuk: I
  - number: '20.3'
    text: Het eerste lid geldt niet voor een luchtvaartuig dat het luchtverkeerscircuit volgt.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel20
  - number: '21'
    text: |-
      Een luchtvaartuig, dat een ander luchtvaartuig inhaalt, wijkt - onverschillig of eerstgenoemde stijgt, daalt of
      zich horizontaal voortbeweegt - uit door zijn koers naar rechts te verleggen. Geen daarop volgende veranderingen
      van de positie van de beide luchtvaartuigen ten opzichte van elkaar ontslaat het inhalende luchtvaartuig van deze
      verplichting, totdat het zich op ruime afstand voorbij het andere luchtvaartuig bevindt.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel21
  - number: '22'
    text: |-
      Een luchtvaartuig dat zich in de lucht bevindt of zich voortbeweegt op de grond of op het water, verleent voorrang
      aan een luchtvaartuig dat bezig is te landen of zich bevindt in de laatste naderingsfase voor de landing.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel22
  - number: '23.1'
    text: |-
      Wanneer twee of meer luchtvaartuigen tegelijkertijd een luchthaven naderen om te landen, verleent een zich hoger
      bevindend luchtvaartuig voorrang aan een zich lager bevindend luchtvaartuig, met dien verstande, dat het zich
      lager bevindende luchtvaartuig deze bepalingen niet benut door een ander luchtvaartuig, dat zich in de laatste
      naderingsfase voor de landing bevindt, in te halen of daar voorlangs te gaan.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel23
  - number: '23.2'
    text: In afwijking van het eerste lid verlenen vliegtuigen voorrang aan zweefvliegtuigen.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel23
  - number: '24'
    text: Een luchtvaartuig verleent voorrang aan een ander luchtvaartuig dat genoodzaakt is te landen.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel24
  - number: '25.1'
    text: |-
      Een luchtvaartuig dat taxiet op het landingsterrein of de platforms verleent voorrang aan een luchtvaartuig dat
      start dan wel op het punt staat te starten.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel25
  - number: '25.2'
    text: |-
      Wanneer gevaar voor botsing bestaat tussen twee taxiënde luchtvaartuigen op het landingsterrein of platforms zijn
      de volgende voorschriften van toepassing:
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel25
  - number: 25.2.a
    text: |-
      indien twee luchtvaartuigen elkaar recht vooruit of bijna recht vooruit naderen, stoppen beide luchtvaartuigen of
      wijken deze zodanig naar rechts uit dat zij vrij van elkaar kunnen passeren;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel25
  - number: 25.2.b
    text: |-
      indien twee luchtvaartuigen routes volgen die elkaar kruisen, wordt voorrang verleend door het luchtvaartuig dat
      het andere luchtvaartuig rechts van zich heeft;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel25
  - number: 25.2.c
    text: een luchtvaartuig dat een ander luchtvaartuig inhaalt houdt daarbij ruime afstand tot het andere luchtvaartuig.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel25
  - number: '26.1'
    text: |-
      Een luchtvaartuig, dat taxiet op het landingsterrein houdt stil en wacht bij alle baanwachtposities tenzij het
      toestemming om door te taxiën heeft gekregen van de plaatselijke verlener van luchtverkeersleidingsdiensten.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel26
  - number: '26.2'
    text: |-
      Een luchtvaartuig, dat taxiet op het landingsterrein houdt stil en wacht bij alle brandende stoplichten en vervolgt
      zijn weg als:
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel26
  - number: 26.2.a
    text: het toestemming heeft gekregen van de plaatselijke verlener van luchtverkeersleidingsdiensten, en;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel26
  - number: 26.2.b
    text: de stoplichten gedoofd zijn en de betreffende rijbaan-hartlijnlichten zijn ontstoken.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel26
  - number: '26.3'
    text: |-
      Alvorens met een luchtvaartuig te taxiën op het landingsterrein van een gecontroleerde luchthaven, zonder
      de bedoeling een vlucht uit te voeren, wordt toestemming verkregen van de plaatselijke verlener van
      luchtverkeersleidingsdiensten en wordt voldaan aan opdrachten van die verlener van luchtverkeersleidingsdiensten.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel26
  - number: '26.4'
    text: |-
      Wanneer tijdens het taxiën is afgeweken van de verkregen toestemming wordt de plaatselijke verlener van
      luchtverkeersleidingsdiensten daarvan zo spoedig mogelijk ingelicht onder vermelding van de redenen daarvoor en van
      de afwijkingen van de toestemming.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel26
  - number: '27.1'
    text: 'Op of in de nabijheid van een luchthaven wordt:'
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel27
  - number: 27.1.a
    text: bijzonder acht gegeven op het verkeer, teneinde een botsing te vermijden;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel27
  - number: 27.1.b
    text: het door luchtvaartuigen gevormd luchtverkeerscircuit gevolgd dan wel vermeden;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel27
  - number: 27.1.c
    text: |-
      op zodanige wijze in het onder b bedoelde luchtverkeerscircuit ingevoegd, dat luchtvaartuigen die dit
      luchtverkeerscircuit volgen niet gehinderd;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel27
  - number: 27.1.d
    text: |-
      tijdens het aanvliegen voor een landing en na het opstijgen elke bocht naar links gemaakt, tenzij een anders
      luidende aanwijzing is gegeven;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel27
  - number: 27.1.e
    text: |-
      tegen de wind in geland en opgestegen, tenzij een andere richting de voorkeur verdient met het oog op de
      veiligheid, de baanligging of om luchtverkeerstechnische redenen.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel27
  - number: '27.2'
    text: |-
      Het eerste lid onder b, d en e geldt niet, indien in het belang van de veiligheid van het luchtverkeer bij
      regeling van Onze Minister nadere regels zijn gegeven voor het verkeer op of in de nabijheid van één of meerdere
      luchthavens.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel27
  - number: '27.3'
    text: |-
      Onze Minister kan ontheffing verlenen van het eerste lid, onder b, aan gezagvoerders die deelnemen aan bijzondere
      luchtverkeersactiviteiten in de nabijheid van een ongecontroleerde luchthaven. Een ontheffing kan onder beperkingen
      worden verleend. Aan een ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel27
  - number: '27.4'
    text: Het is verboden in strijd met voorschriften als bedoeld in het derde lid te handelen.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel27
  - number: '28.1'
    text: |-
      Onze Minister geeft regels met betrekking tot de periode waarin en de omstandigheden waaronder de volgende door een
      luchtvaartuig gevoerde lichten worden getoond:
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel28
  - number: 28.1.a
    text: navigatielichten;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel28
  - number: 28.1.b
    text: anti-botsingslichten;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel28
  - number: 28.1.c
    text: lichten die de afmetingen van het luchtvaartuig aangeven;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel28
  - number: 28.1.d
    text: lichten die aangeven dat een voortstuwingsinrichting van het luchtvaartuig in werking is dan wel wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel28
  - number: '28.2'
    text: |-
      Het is verboden andere dan de in het eerste lid bedoelde lichten te voeren, indien deze kunnen worden aangezien
      voor de krachtens dat lid vastgestelde lichten.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel28
  - number: '28.3'
    text: |-
      Het is verboden andere dan de in het eerste lid bedoelde lichten te tonen indien deze verblinding kunnen
      veroorzaken voor leden van het stuurhutpersoneel van het betrokken luchtvaartuig of van andere luchtvaartuigen, dan
      wel op een luchthaven voor bestuurders van voertuigen of grondpersoneel.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel28
  - number: '29'
    text: 'Het is verboden aan het luchtverkeer deel te nemen onder nagebootste blindvliegomstandigheden tenzij:'
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel29
  - number: '29.1'
    text: het luchtvaartuig is voorzien van een dubbele besturing en;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel29
  - number: '29.2'
    text: |-
      een persoon die bevoegd is dat luchtvaartuig te besturen een bestuurdersplaats inneemt teneinde de besturing
      onmiddellijk te kunnen overnemen; deze persoon beschikt over voldoende uitzicht naar voren en naar beide zijden
      van het luchtvaartuig of staat rechtstreeks in verbinding met een lid van het stuurhutpersoneel, dat een zodanige
      plaats inneemt, dat zijn uitzicht het uitzicht van deze persoon voldoende aanvult.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel29
  - number: '30'
    text: |-
      Een luchtvaartuig op het water voldoet aan de voorschriften ter voorkoming van botsing die ter plaatse gelden voor
      vaartuigen.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel30
  - number: '31.1'
    text: 'Behalve voor een gecontroleerde vlucht wordt tevens een vliegplan ingediend voor de aanvang van:'
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel31
  - number: 31.1.a
    text: elke IFR-vlucht binnen een luchtverkeersdienstverleningsgebied met klasse F of G;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel31
  - number: 31.1.b
    text: |-
      elke vlucht in gebieden of langs routes waar Onze Minister dat heeft voorgeschreven met het doel om het verstrekken
      van vluchtinformatie, de alarmering of de opsporing en redding te vergemakkelijken;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel31
  - number: 31.1.c
    text: |-
      elke VFR-vlucht in gebieden of langs routes, waar Onze Minister dat heeft voorgeschreven met het doel
      coördinatie met betrokken militaire eenheden of met verleners van luchtverkeersdiensten in aangrenzende staten te
      vergemakkelijken, om zodoende een mogelijke noodzaak tot onderschepping voor identificatie-doeleinden te voorkomen;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel31
  - number: 31.1.d
    text: elke internationale VFR-vlucht.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel31
  - number: '31.2'
    text: |-
      Onze Minister kan vrijstelling of ontheffing verlenen van de verplichting als bedoeld in het eerste lid, onderdeel
      d.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel31
  - number: '31.3'
    text: |-
      Een vliegplan kan worden ingediend voor een VFR-vlucht, waarvoor geen vliegplan is vereist, indien de gezagvoerder
      zulks wenst met het doel eventuele opsporing en redding te vergemakkelijken.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel31
  - number: '31.4'
    text: 'Onze Minister kan regels geven met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel31
  - number: 31.4.a
    text: de gegevens die het vliegplan bevat;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel31
  - number: 31.4.b
    text: de wijze van indienen, wijzigen, annuleren en afsluiten van een vliegplan.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel31
  - number: '32.1'
    text: |-
      Elke wijziging van het ingediende vliegplan wordt zo spoedig mogelijk gemeld aan de betrokken verlener van
      luchtverkeersdiensten, indien het is ingediend voor:
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel32
  - number: 32.1.a
    text: een IFR-vlucht, of;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel32
  - number: 32.1.b
    text: een gecontroleerde VFR-vlucht.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel32
  - number: '32.2'
    text: |-
      Een wijziging van het vliegplan dat is ingediend voor een niet-gecontroleerde VFR-vlucht, wordt zo spoedig mogelijk
      gemeld aan de betrokken verlener van luchtverkeersdiensten, indien deze betrekking heeft op gegevens die van belang
      zijn voor de alarmering.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel32
  - number: '32.3'
    text: |-
      Een wijziging van het voor een gecontroleerde vlucht geldend vliegplan wordt niet uitgevoerd, alvorens daartoe een
      klaring is verkregen van de betrokken verlener van luchtverkeersleidingsdiensten.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel32
  - number: '32.4'
    text: |-
      Wanneer tijdens een gecontroleerde vlucht is afgeweken van het geldend vliegplan wordt de betrokken verlener van
      luchtverkeersleidingsdiensten daarvan zo spoedig mogelijk ingelicht onder vermelding van de redenen daarvoor en van
      de afwijkingen van het geldend vliegplan.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel32
  - number: '32.5'
    text: 'De meldingsplicht, als bedoeld in het vierde lid, geldt niet voor zover:'
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel32
  - number: 32.5.a
    text: de afwijking van de gemiddelde ware luchtsnelheid minder bedraagt dan vijf procent;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel32
  - number: 32.5.b
    text: |-
      de afwijking van de geschatte tijd voor het volgende meldingspunt of voor de luchthaven van bestemming, minder
      bedraagt dan drie minuten.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel32
  - number: '33.1'
    text: |-
      Bij regeling van Onze Minister worden in verband met de veiligheid van het luchtverkeer de seinen vastgesteld die
      worden gegeven aan luchtvaartuigen, met de betekenis daarvan. Deze seinen worden alleen voor het aangegeven doel
      gebruikt en andere seinen worden niet gebruikt.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel33
  - number: '33.2'
    text: |-
      De waarnemer of ontvanger van een sein als bedoeld in het eerste lid, geeft hieraan gevolg overeenkomstig de
      betekenis die er aan is gegeven in de regeling, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel33
  - number: '33.3'
    text: |-
      De seiner geeft handmatige seinen aan een luchtvaartuig op een luchthaven op een heldere en precieze wijze,
      overeenkomstig de regeling, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel33
  - number: '34.1'
    text: |-
      Voor het vermelden van tijdstippen met betrekking tot vluchten wordt Gecoördineerde Wereldtijd gebruikt, uitgedrukt
      in uren en minuten van het etmaal, beginnend te middernacht.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel34
  - number: '34.2'
    text: |-
      Voor de aanvang van een gecontroleerde vlucht en telkens gedurende de vlucht, wanneer de noodzaak daartoe blijkt,
      stelt de gezagvoerder zich op de hoogte van de juiste tijd.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel34
  - number: '35.1'
    text: |-
      Een gecontroleerde vlucht wordt uitgevoerd in overeenstemming met het geldend vliegplan en met inachtneming van het
      bepaalde in de volgende leden met betrekking tot het volgen van de vliegplanroute.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel35
  - number: '35.2'
    text: |-
      Tenzij een afwijkende klaring is verstrekt door de betrokken verlener van luchtverkeersleidingsdiensten, wordt
      tijdens een gecontroleerde vlucht - voor zover uitvoerbaar - als volgt gevlogen:
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel35
  - number: 35.2.a
    text: bij het volgen van een vastgestelde luchtverkeersroute, langs de hartlijn bepaald voor die route, of;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel35
  - number: 35.2.b
    text: bij het volgen van een andere route, direct tussen de navigatiestations of punten waardoor die route wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel35
  - number: '35.3'
    text: |-
      Onverminderd het tweede lid, wordt - tijdens een vlucht langs een gedeelte van een luchtverkeersroute dat is
      bepaald door rondomstralende radiobakens werkend op zeer hoge frequenties - voor de primaire navigatie omgeschakeld
      van het achterliggende naar het voorliggend baken boven het omschakelpunt, indien dat is vastgesteld, of zo dicht
      erbij als operationeel uitvoerbaar is.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel35
  - number: '35.4'
    text: |-
      Bij afwijking van het tweede lid wordt daarvan zo spoedig mogelijk melding gedaan aan de betrokken verlener van
      luchtverkeersleidingsdiensten en wordt - behoudens andersluidende klaring - een zodanige koerswijziging uitgevoerd,
      dat het luchtvaartuig zo spoedig mogelijk weer terugkeert op de te volgen route.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel35
  - number: '36.1'
    text: |-
      Tijdens een gecontroleerde vlucht wordt zo spoedig mogelijk aan de betrokken verlener van
      luchtverkeersleidingsdiensten gemeld de tijd en de vlieghoogte waarop een verplicht meldingspunt is gepasseerd, te
      zamen met alle verder vereiste inlichtingen, tenzij de betrokken verlener van luchtverkeersleidingsdiensten anders
      bepaalt. Op gelijke wijze vinden positiemeldingen plaats met betrekking tot die punten die de betrokken verlener
      van luchtverkeersleidingsdiensten opgeeft.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel36
  - number: '36.2'
    text: |-
      Indien geen verplichte meldingspunten zijn vastgesteld, vinden positiemeldingen plaats telkens na het verstrijken
      van een tijdsverloop dat bij ministeriële regeling is vastgesteld, dan wel is opgegeven door de betrokken verlener
      van luchtverkeersleidingsdiensten.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel36
  - number: '36.3'
    text: |-
      Bij ministeriële regeling kunnen verplichte meldingspunten worden vastgesteld, alsmede omschakelpunten en het
      tijdsverloop telkens na het verstrijken waarvan positiemeldingen moeten plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel36
  - number: '37'
    text: |-
      Bij beëindiging van een gecontroleerde vlucht, hetzij door landing, dan wel bij voortzetting daarvan als niet
      gecontroleerde vlucht, wordt de betrokken verlener van luchtverkeersleidingsdiensten daarvan zo spoedig mogelijk in
      kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel37
  - number: '38.1'
    text: |-
      Tijdens het uitvoeren van een gecontroleerde vlucht wordt voortdurend op de aangewezen radiofrequentie
      geluisterd en zonodig een tweezijdige radioverbinding tot stand gebracht met de betrokken verlener van
      luchtverkeersleidingsdiensten.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel38
  - number: '38.2'
    text: Onze Minister kan nadere regels stellen ten aanzien van het in het eerste lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel38
  - number: '38.3'
    text: |-
      Het eerste lid geldt niet, indien in het belang van de veiligheid van het luchtverkeer bij regeling van Onze
      Minister daarvan afwijkende regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel38
  - number: '38.4'
    text: |-
      Bij regeling van Onze Minister kan vrijstelling worden verleend van het in het eerste lid bepaalde. Een
      vrijstelling kan onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel38
  - number: '38.5'
    text: |-
      Onze Minister kan ontheffing verlenen van het in het eerste lid bepaalde. Een ontheffing kan onder beperkingen
      worden verleend. Aan een ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel38
  - number: '38.6'
    text: Het is verboden te handelen in strijd met voorschriften als bedoeld in het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel38
  - number: '39.1'
    text: |-
      Indien het bepaalde in [artikel 38][ref1] niet kan worden nagekomen door storing in de radioverbinding, wordt
      gehandeld overeenkomstig door Onze Minister ter zake gegeven regels voor de luchtvaarttelecommunicatie.


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel38
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '38'
        hoofdstuk: III
        paragraaf: '6'
        afdeling: '2'
  - number: '39.2'
    text: |-
      Indien de in het eerste lid bedoelde handelingen niet leiden tot herstel van de radioverbinding, wordt de vlucht
      voortgezet met inachtneming van de door Onze Minister vastgestelde regels.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel39
  - number: '40'
    text: |-
      Onze Minister geeft regels met betrekking tot de bediening van de boordapparatuur voor het beantwoorden van
      ondervragingen door radargrondstations.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel40
  - number: '41.1'
    text: |-
      De gezagvoerder van een burgerluchtvaartuig dat wordt onderschept door een militair luchtvaartuig of een
      luchtvaartuig dat wordt gebruikt voor politie- of douanediensten:
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel41
  - number: 41.1.a
    text: |-
      volgt de door het onderscheppende luchtvaartuig gegeven opdracht op waarbij aan de krachtens [artikel 33][ref1]
      vastgestelde visuele seinen betekenis en uitvoering wordt gegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel33
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '33'
        hoofdstuk: III
        paragraaf: '4'
        afdeling: '2'
  - number: 41.1.b
    text: stelt zo mogelijk de betrokken verlener van luchtverkeersdiensten in kennis van de onderschepping;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel41
  - number: 41.1.c
    text: |-
      brengt zo mogelijk een radioverbinding tot stand met het onderscheppende luchtvaartuig of met de eenheid die de
      onderschepping leidt, door het uitzenden van een algemene oproep op de noodfrequentie 121.500 MHz onder vermelding
      van de identiteit van het onderschepte luchtvaartuig en de aard van de vlucht;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel41
  - number: 41.1.d
    text: |-
      herhaalt, indien geen radioverbinding tot stand is gekomen, de in onderdeel c bedoelde oproep op de noodfrequentie
      243.000 MHz, voor zover uitvoerbaar;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel41
  - number: 41.1.e
    text: |-
      maakt gebruik van de krachtens [artikel 33][ref1] vastgestelde seinen, indien de omstandigheden dit noodzakelijk
      maken;


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel33
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '33'
        hoofdstuk: III
        paragraaf: '4'
        afdeling: '2'
  - number: 41.1.f
    text: |-
      stelt de transponder in op mode A code 7700, tenzij door de betrokken verlener van luchtverkeersdiensten anders
      wordt opgedragen.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel41
  - number: '41.2'
    text: |-
      De gezagvoerder van het onderschepte luchtvaartuig dat per radio een opdracht ontvangt, uit welke bron dan ook, die
      afwijkt van de opdracht door middel van seinen of de radio gegeven door het onderscheppende luchtvaartuig, vraagt
      onmiddellijk om opheldering aan het onderscheppende luchtvaartuig terwijl het voortgaat met het voldoen aan de
      opdracht van het onderscheppende luchtvaartuig.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel41
  - number: '41.3'
    text: |-
      Bij regeling kan Onze Minister regels geven met betrekking tot het onderscheppen van burgerluchtvaartuigen door
      militaire luchtvaartuigen of luchtvaartuigen die worden gebruikt voor politie- of douanediensten.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel41
  - number: '41.4'
    text: Bij regeling kan Onze Minister nadere regels geven met betrekking tot het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel41
  - number: 41a.1
    text: |-
      De gezagvoerder van een luchtvaartuig dat onderworpen is aan wederrechtelijke inmenging tracht de betrokken
      verlener van luchtverkeersdiensten hiervan op de hoogte te stellen. Daarbij worden omstandigheden gemeld die voor
      de betrokken verlener van luchtverkeersdiensten van belang kunnen zijn voor het uitoefenen van haar taak.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel41a
  - number: 41a.2
    text: |-
      Wanneer het niet mogelijk is de verlener van luchtverkeersdiensten te informeren als bedoeld in het eerste lid en
      het luchtvaartuig moet afwijken van de koers en vlieghoogte waarvoor een klaring was verkregen:
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel41a
  - number: 41a.2.a
    text: |-
      probeert de gezagvoerder de koers en vlieghoogte aan te houden waarvoor een klaring was verkregen, tot de verlener
      van luchtverkeersdiensten is geïnformeerd of het luchtvaartuig in een gebied met radardekking vliegt, tenzij
      omstandigheden aan boord dit onmogelijk maken,
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel41a
  - number: 41a.2.b
    text: |-
      probeert de gezagvoerder waarschuwingen te geven op de VHF noodfrequentie of andere geschikte frequenties, en zo
      of via de transponders of gegevensverbindingen informatie te verstrekken over afwijkingen van koers en vlieghoogte,
      tenzij omstandigheden aan boord dit onmogelijk maken,
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel41a
  - number: 41a.2.c
    text: |-
      volgt de gezagvoerder de regionale aanvullende procedures voor onvoorziene gebeurtenissen of, wanneer deze er niet
      zijn, zet de gezagvoerder de vlucht zodanig voort dat het vliegtuig bij een IFR-vlucht 150 m (500 voet) van de
      kruishoogte afwijkt in een gebied waar een verticale separatie van minimaal 300 m (1000 voet) geldt, of 300 m (1000
      voet) van de kruishoogte afwijkt in een gebied waar een verticale separatie van minimaal 600 m (2000 voet) geldt.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel41a
  - number: '42.1'
    text: |-
      Het is verboden een VFR-vlucht uit te voeren onder zodanige weersomstandigheden dat het vliegzicht en de afstand
      van het luchtvaartuig tot de wolken kleiner is dan de in de volgende tabel genoemde waarden.








                    Hoogteband


                    Klasse luchtruim


                    Vliegzicht


                    Afstand tot de wolken






                    Op en boven vliegniveau 100


                    A B C D E F G


                    8 km


                    1500 m horizontaal
                    300 m (1000 voet) verticaal




                    Beneden vliegniveau 100 en boven 900 m (3000 voet) boven gemiddeld zeeniveau, of boven 300 m (1000
      voet) boven terreinhoogte als dit hoger is


                    A B C D E F G


                    5 km


                    1500 m horizontaal
                    300 m (1000 voet) verticaal




                    Op en beneden 900 m (3000 voet) boven gemiddeld zeeniveau, of 300 m (1000 voet) boven terreinhoogte


                    A B C D E


                    5 km


                    1500 m horizontaal
                    300 m (1000 voet) verticaal




                    F G


                    5 km


                    Vrij van wolken en met zicht op grond of water
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel42
  - number: '42.2'
    text: 'Het eerste lid geldt niet indien:'
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel42
  - number: 42.2.a
    text: |-
      een klaring is verkregen van de betrokken verlener van luchtverkeersleidingsdiensten voor het uitvoeren van een
      bijzondere VFR-vlucht;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel42
  - number: 42.2.b
    text: bij ministeriële regeling andere waarden zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel42
  - number: '43.1'
    text: |-
      Het is verboden tijdens een VFR-vlucht te starten van of te landen op een luchthaven in een plaatselijk
      luchtverkeersleidingsgebied, of het luchthavenverkeersgebied of het luchtverkeerscircuit in te vliegen, indien:
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel43
  - number: 43.1.a
    text: de wolkenbasis lager is dan 450 m (1500 voet), of
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel43
  - number: 43.1.b
    text: het grondzicht minder is dan 5 km.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel43
  - number: '43.2'
    text: 'Het eerste lid geldt niet indien:'
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel43
  - number: 43.2.a
    text: een klaring is verkregen van de betrokken verlener van luchtverkeersleidingsdiensten;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel43
  - number: 43.2.b
    text: |-
      bij regeling van Onze Minister in het belang van de veiligheid van het luchtverkeer andere waarden zijn
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel43
  - number: '44.1'
    text: 'Het is verboden, ongeacht de weersomstandigheden, een VFR-vlucht uit te voeren:'
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel44
  - number: 44.1.a
    text: |-
      buiten de daglichtperiode, zoals gepubliceerd in de in [artikel 60, onder a ][ref1], bedoelde luchtvaartgids;


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel60
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '60'
        hoofdstuk: V
  - number: 44.1.b
    text: in luchtverkeersdienstverleningsgebieden met klasse A;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel44
  - number: 44.1.c
    text: met een ware luchtsnelheid groter dan de plaatselijke voortplantingssnelheid van het geluid.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel44
  - number: '44.2'
    text: Onze Minister kan nadere regels stellen ten aanzien van het in het eerste lid onder *a*, bepaalde.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel44
  - number: '44.3'
    text: Het eerste lid, onderdelen a en b, geldt niet indien bij ministeriële regeling anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel44
  - number: '44.4'
    text: |-
      Bij regeling van Onze Minister en Onze Minister van Defensie kunnen vrijstellingen worden verleend van het in het
      eerste lid gestelde verbod. Een vrijstelling kan onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel44
  - number: '44.5'
    text: |-
      Onze Minister en Onze Minister van Defensie kunnen ontheffingen verlenen van het in het eerste lid gestelde verbod.
      Een ontheffing kan onder beperkingen worden verleend. Aan een ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel44
  - number: '44.6'
    text: Het is verboden te handelen in strijd met voorschriften als bedoeld in het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel44
  - number: '44.7'
    text: |-
      De maximum toegestane aangewezen luchtsnelheid in de luchtverkeersdienstverleningsgebieden met klasse C tot en met
      G beneden vliegniveau 100 bedraagt 470 km/uur (250 knopen).
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel44
  - number: '44.8'
    text: Het zevende lid geldt niet indien bij ministeriële regeling andere waarden zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel44
  - number: 44a.1
    text: |-
      In het belang van de veiligheid van het luchtverkeer worden bij regeling van Onze Minister regels gegeven inzake
      de navigatie- en telecommunicatie-installaties waarmee een luchtvaartuig voor het uitvoeren van een VFR-vlucht is
      uitgerust en de eisen waar die installaties aan voldoen.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel44a
  - number: 44a.2
    text: Onze Minister kan ontheffing verlenen van de krachtens het eerste lid gegeven regels.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel44a
  - number: 44a.3
    text: Een ontheffing kan onder beperkingen worden verleend. Aan een ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel44a
  - number: 44a.4
    text: Het is verboden te handelen in strijd met voorschriften als bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel44a
  - number: '45.1'
    text: |-
      Met uitzondering van het gestelde in het tweede lid is het - tenzij noodzakelijk om op te stijgen van of te landen
      op een luchthaven, naderings- en vertrekprocedures alsmede luchtverkeerspatronen uit te voeren - verboden een VFR-
      vlucht uit te voeren beneden de volgende minimum vlieghoogtes:
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel45
  - number: 45.1.a
    text: |-
      boven gebieden met aaneengesloten bebouwing, industrie- en havengebieden daaronder begrepen, dan wel boven
      mensenverzamelingen: tenminste 300 m (1000 voet) boven de hoogste hindernis, gelegen binnen een afstand van 600 m
      van het luchtvaartuig;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel45
  - number: 45.1.b
    text: |-
      elders dan onder a aangegeven: tenminste 150 m (500 voet) boven de grond of het water, of wel zoveel hoger als door
      Onze Minister is bepaald.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel45
  - number: '45.2'
    text: 'Het eerste lid geldt niet, onder nader door Onze Minister te stellen regels, voor de volgende vluchten:'
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel45
  - number: 45.2.a
    text: vluchten waarbij een sleep wordt aangehaakt of afgeworpen boven een luchthaven;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel45
  - number: 45.2.b
    text: |-
      vluchten waarbij stoffen ter bevordering of ter bescherming van het milieu dan wel de land-, tuin- of bosbouw, te
      bestemder plaatse worden uitgeworpen;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel45
  - number: 45.2.c
    text: |-
      vluchten waarbij naderingsprocedures buiten luchthavens beoefend worden boven nader door Onze Minister aan te
      wijzen gebieden;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel45
  - number: 45.2.d
    text: vluchten met zweefvliegtuigen boven nader door Onze Minister aan te wijzen strand- en duingebieden.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel45
  - number: '45.3'
    text: Het eerste lid onder b geldt niet boven nader door Onze Minister aan te wijzen routes en gebieden.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel45
  - number: '45.4'
    text: |-
      Bij regeling van Onze Minister en Onze Minister van Defensie kunnen vrijstellingen worden verleend van het in het
      eerste lid gestelde verbod. Een vrijstelling kan onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel45
  - number: '45.5'
    text: |-
      Onze Minister en Onze Minister van Defensie kunnen ontheffingen verlenen van het in het eerste lid gestelde verbod.
      Een ontheffing kan onder beperkingen worden verleend. Aan een ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel45
  - number: '45.6'
    text: Het is verboden te handelen in strijd met voorschriften als bedoeld in het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel45
  - number: '46'
    text: |-
      Onverminderd het gestelde in [artikel 11][ref1] wordt een VFR-vlucht uitgevoerd in overeenstemming met de algemene
      vliegvoorschriften voor gecontroleerde vluchten wanneer de vlucht:


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel11
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '11'
        hoofdstuk: III
        afdeling: '1'
  - number: 46.a
    text: wordt uitgevoerd binnen de luchtverkeersdienstverleningsgebieden met klasse B, C en D;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel46
  - number: 46.b
    text: deel uitmaakt van het terreinverkeer van een gecontroleerde luchthaven, of;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel46
  - number: 46.c
    text: wordt uitgevoerd als een bijzondere VFR-vlucht.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel46
  - number: '47.1'
    text: |-
      Wanneer tijdens een gecontroleerde VFR-vlucht blijkt, dat voortzetting daarvan onder zichtweersomstandigheden
      volgens het geldend vliegplan niet uitvoerbaar is, wordt gehandeld overeenkomstig het bepaalde in één van de
      volgende leden van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel47
  - number: '47.2'
    text: |-
      In de omstandigheden, als bedoeld in het eerste lid, wordt, behoudens het bepaalde in de volgende leden van dit
      artikel, een herziening van de klaring gevraagd, waardoor het alsnog mogelijk wordt om:
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel47
  - number: 47.2.a
    text: |-
      de vlucht in zichtweersomstandigheden voort te zetten naar de luchthaven van bestemming of een luchthaven waarnaar
      wordt uitgeweken, of;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel47
  - number: 47.2.b
    text: |-
      het betreffende luchtverkeersleidingsgebied, waarin eveneens worden luchtverkeersleidingsdiensten aan VFR-vluchten
      verleend, te verlaten.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel47
  - number: '47.3'
    text: |-
      Indien een klaring, als bedoeld in het tweede lid, niet kan verkregen, wordt de vlucht voortgezet onder
      zichtweersomstandigheden en wordt de betrokken verlener van luchtverkeersleidingsdiensten ingelicht
      omtrent de actie, die wordt ondernomen ten einde het luchtverkeersleidingsgebied, waarin eveneens worden
      luchtverkeersleidingsdiensten aan VFR-vluchten verleend, te verlaten dan wel een landing uit te voeren op de
      dichtstbijzijnde daarvoor geschikte luchthaven.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel47
  - number: '47.4'
    text: |-
      Wanneer een gecontroleerde VFR-vlucht, als bedoeld in het eerste lid, wordt uitgevoerd binnen een plaatselijk
      luchtverkeersleidingsgebied, kan toestemming worden verzocht om de vlucht te mogen voortzetten als bijzondere VFR-
      vlucht.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel47
  - number: '47.5'
    text: |-
      Indien de gezagvoerder van een gecontroleerde VFR-vlucht, als bedoeld in het eerste lid, daartoe bevoegd is, kan
      hij verzoeken om de vlucht te mogen voortzetten in overeenstemming met de instrumentvliegvoorschriften.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel47
  - number: '48'
    text: |-
      Bij het uitvoeren van een VFR-vlucht in gebieden of langs routes, als bedoeld in
      [artikel 31, eerste lid, onder b of c][ref1] wordt, onderscheidenlijk worden:


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel31
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '31'
        hoofdstuk: III
        paragraaf: '3'
        afdeling: '2'
  - number: 48.a
    text: |-
      voortdurend geluisterd op de desbetreffende radiofrequentie van de betrokken luchtverkeersdienst die
      vluchtinformatie verstrekt;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel48
  - number: 48.b
    text: desgevraagd positiemeldingen aan die dienst verstrekt;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel48
  - number: 48.c
    text: zonodig tweezijdige radioverbinding tot stand gebracht met de betrokken luchtverkeersdienst.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel48
  - number: '49.1'
    text: |-
      In het belang van de veiligheid van het luchtverkeer worden bij regeling van Onze Minister regels gegeven inzake
      de navigatie- en telecommunicatie-installaties waarmee een luchtvaartuig voor het uitvoeren van een IFR-vlucht is
      uitgerust en de eisen waar die installaties aan voldoen.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel49
  - number: '49.2'
    text: Onze Minister kan ontheffing verlenen van de krachtens het eerste lid gegeven regels.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel49
  - number: '49.3'
    text: |-
      Ontheffing kan slechts verleend worden indien de navigatie- en telecommunicatieuitrusting van het luchtvaartuig ten
      minste gelijkwaardige mogelijkheden biedt voor de vluchtuitvoering.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel49
  - number: '49.4'
    text: Een ontheffing kan onder beperkingen worden verleend. Aan een ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel49
  - number: '49.5'
    text: Het is verboden te handelen in strijd met voorschriften als bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel49
  - number: '50.1'
    text: |-
      De maximum toegestane aangewezen luchtsnelheid in de luchtverkeersdienstverleningsgebieden met klasse D tot en met
      G beneden vliegniveau 100 bedraagt 470 km/uur (250 knopen).
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel50
  - number: '50.2'
    text: Het eerste lid geldt niet indien bij ministeriële regeling andere waarden zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel50
  - number: '51.1'
    text: |-
      Met uitzondering van het gestelde in het tweede lid is het - tenzij noodzakelijk om op te stijgen van of te landen
      op een luchthaven, naderings- en vertrekprocedures alsmede luchtverkeerspatronen uit te voeren - verboden een IFR-
      vlucht uit te voeren beneden de volgende minimum vlieghoogtes:
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel51
  - number: 51.1.a
    text: |-
      boven bergachtige gebieden: tenminste 600 m (2000 voet) boven de hoogste hindernis, gelegen binnen 8 km van de
      gegiste positie van het luchtvaartuig;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel51
  - number: 51.1.b
    text: |-
      elders dan onder a. is aangegeven: tenminste 300 m (1000 voet) boven de hoogste hindernis gelegen binnen 8 km van
      de gegiste positie van het luchtvaartuig.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel51
  - number: '51.2'
    text: |-
      Bij regeling van Onze Minister kan met inachtneming van luchtverkeerstechnische aspecten vrijstelling worden
      verleend van het in het eerste lid gestelde verbod. Een vrijstelling kan onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel51
  - number: '51.3'
    text: |-
      Onze Minister kan met inachtneming van luchtverkeerstechnische aspecten ontheffing verlenen van het in het eerste
      lid gestelde verbod. Een ontheffing kan onder beperkingen worden verleend. Aan een ontheffing kunnen voorschriften
      worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel51
  - number: '51.4'
    text: Het is verboden te handelen in strijd met voorschriften als bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel51
  - number: '53.1'
    text: |-
      Het is verboden af te zien van de IFR-vluchtuitvoering, tenzij zich tijdens een IFR-vlucht zichtweersomstandigheden
      voordoen, en het te voorzien is en in de bedoeling ligt dat de vlucht voor geruime tijd zal worden voortgezet in
      ononderbroken zichtweersomstandigheden.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel53
  - number: '53.2'
    text: |-
      Indien onder de in het eerste lid genoemde omstandigheden wordt besloten de vlucht verder als VFR-vlucht uit te
      voeren, wordt uitdrukkelijk aan de betrokken verlener van luchtverkeersleidingsdiensten gemeld, dat wordt afgezien
      van de IFR-vluchtuitvoering, onder vermelding van de daartoe strekkende wijzigingen op het geldende vliegplan.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel53
  - number: '54'
    text: |-
      Onverminderd het gestelde in [artikel 11][ref1] wordt een IFR-vlucht uitgevoerd in overeenstemming met
      de algemene vliegvoorschriften voor gecontroleerde vluchten, wanneer de vlucht wordt uitgevoerd in een
      luchtverkeersdienstverleningsgebied klasse A tot en met E.


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel11
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '11'
        hoofdstuk: III
        afdeling: '1'
  - number: '55'
    text: |-
      Bij het uitvoeren van een IFR-vlucht in luchtverkeersdienstverleningsgebieden F en G en in gebieden of langs routes
      als bedoeld in [artikel 31, eerste lid, onder b of c][ref1] moet:


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel31
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '31'
        hoofdstuk: III
        paragraaf: '3'
        afdeling: '2'
  - number: 55.a
    text: |-
      voortdurend worden geluisterd op de desbetreffende radiofrequentie van de betrokken verlener van
      luchtverkeersdiensten, die vluchtinformatie verstrekt;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel55
  - number: 55.b
    text: zonodig tweezijdige radioverbinding tot stand worden gebracht met die dienst, en;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel55
  - number: 55.c
    text: |-
      positiemeldingen worden verstrekt overeenkomstig het in [artikel 36][ref1] bepaalde voor gecontroleerde vluchten.


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel36
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '36'
        hoofdstuk: III
        paragraaf: '6'
        afdeling: '2'
  - number: '56'
    text: |-
      Onze Minister kan nadere regels stellen ten aanzien van vluchten waarbij door de aard van het luchtvaartuig of
      het doel van de vlucht niet kan worden voldaan aan bij of krachtens [hoofdstuk III][ref1] van dit besluit gestelde
      regels.


      [ref1]: https://wetten.overheid.nl/BWBR0005775#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0005775
        hoofdstuk: III
  - number: '57'
    text: |-
      De ankerkabel van een zich in de lucht bevindende kabelballon, of van een aan een kabel verankerd luchtschip,
      wordt - buiten de in [artikel 28, eerste lid][ref1], genoemde periode - voorzien van de bij ministeriële regeling
      vastgestelde dagkenmerken.


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel28
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '28'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '2'
  - number: '58'
    text: |-
      Op een landingsterrein verleent een voetganger of bestuurder van een voertuig vrije doorgang aan een luchtvaartuig
      en geeft gevolg aan een aanwijzing gegeven door de exploitant en op een gecontroleerde luchthaven door de
      plaatselijke verlener van luchtverkeersleidingsdiensten.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel58
  - number: '60'
    text: |-
      Ten behoeve van de vluchtvoorbereiding en de vluchtuitvoering verstrekt de LVNL vóór de vlucht de volgende
      luchtvaartinlichtingen:
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel60
  - number: 60.a
    text: 'een geïntegreerd pakket luchtvaartinlichtingen bestaande uit de volgende publikaties:'
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel60
  - number: 60.a.1
    text: een luchtvaartgids;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel60
  - number: 60.a.2
    text: wijzigingslijsten op de luchtvaartgids;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel60
  - number: 60.a.3
    text: aanvullingslijsten op de luchtvaartgids;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel60
  - number: 60.a.4
    text: berichten aan luchtvarenden;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel60
  - number: 60.a.5
    text: circulaires voor de luchtvaart;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel60
  - number: 60.a.6
    text: mededelingen aan Nederlandse luchtvarenden en eigenaren van luchtvaartuigen;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel60
  - number: 60.b
    text: luchtvaartkaarten;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel60
  - number: 60.c
    text: luchtvaartmeteorologische inlichtingen.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel60
  - number: '61'
    text: |-
      Bij regeling van Onze Minister worden regels gesteld met betrekking tot luchtvaartinlichtingen. Deze regels
      betreffen ten minste:
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel61
  - number: 61.a
    text: de gegevens die luchtvaartinlichtingen bevatten;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel61
  - number: 61.b
    text: de wijze van verstrekking;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel61
  - number: 61.c
    text: de plaatsen waar en de perioden gedurende welke luchtvaartinlichtingen worden verstrekt, en
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel61
  - number: 61.d
    text: de instanties en personen aan wie luchtvaartinlichtingen worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel61
  - number: '62'
    text: |-
      Abonnementen op de luchtvaartpublicaties en luchtvaartkaarten worden verstrekt tegen vergoeding van de kosten welke
      jaarlijks door de LVNL worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel62
  - number: '63'
    text: |-
      Het handelen in strijd met het bepaalde in of krachtens de [artikelen 1a][ref1], [10, tweede lid][ref2],
      [11][ref3], [13, eerste, en vijfde lid][ref4], [14, eerste en vijfde lid][ref5], [16, eerste lid][ref6],
      [17][ref7], [18][ref8], [19][ref9], [20, eerste en tweede lid][ref10], [21][ref11], [22][ref12], [23][ref13],
      [24][ref14], [25][ref15], [26][ref16], [27, eerste en vierde lid][ref17], [28][ref18], [29][ref19], [30][ref20],
      [31, eerste lid][ref21], [32, eerste tot en met vierde lid][ref22], [33, tweede en derde lid][ref23],
      [34][ref24], [35][ref25], [36][ref26], [37][ref27], [38, eerste en zesde lid][ref28], [39][ref29],
      [41, eerste en tweede lid][ref30], [41a][ref31], [42, eerste lid][ref32], [43, eerste lid][ref33],
      [44, eerste, zesde en zevende lid][ref34], [44a, vierde lid][ref35], [45, eerste en zesde lid][ref36], [46][ref37],
      [47, eerste, tweede en derde lid][ref38], [48][ref39], [49, vijfde lid][ref40], [50, eerste lid][ref41],
      [51, eerste en vierde lid][ref42], [53][ref43], [54][ref44], [55][ref45], [57][ref46] en [58][ref47] is een
      strafbaar feit.


