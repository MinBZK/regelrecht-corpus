    text: Van krachtens dit besluit gegeven ontheffingen wordt mededeling gedaan in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel64
  - number: '64.2'
    text: |-
      De LVNL doet mededeling aan luchtvarenden van deze en overige krachtens dit besluit gegeven bepalingen door middel
      van de daartoe bestemde luchtvaartpublikaties als bedoeld in [artikel 60, onder ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel60
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '60'
        hoofdstuk: V
  - number: '65'
    text: Het Luchtverkeersreglement-1980 (*Stb.* 786) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel65
  - number: '66'
    text: |-
      Dit besluit treedt in werking op het tijdstip waarop de [Wet Luchtverkeer][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0005555
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0005555
  - number: '67'
    text: 'Dit besluit kan worden aangehaald als: Luchtverkeersreglement.'
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel67
