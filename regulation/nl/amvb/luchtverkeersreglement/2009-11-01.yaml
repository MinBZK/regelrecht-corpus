  - number: 1a.3
    text: |-
      Bij regeling van Onze Minister worden regels gesteld ten aanzien van de deelname aan het luchtverkeer met een
      luchtvaartuig als genoemd in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel1a
