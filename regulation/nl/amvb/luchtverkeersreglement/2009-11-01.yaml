preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 17 juli 1992, nr. JBZ/L 92.007482,
    Rijksluchtvaartdienst, gedaan mede namens Onze Minister van Defensie;

    Overwegende dat het in verband met het tot stand komen van de Wet Luchtverkeer (Stb. 1992, 368) noodzakelijk is de
    regels met betrekking tot het luchtverkeer aan te passen en opnieuw vast te stellen;

    Gelet op de artikelen 7, 13 en 14 van de Wet Luchtverkeer;

    De Raad van State gehoord (advies van 1 december 1992, nr. W09.92.0347);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat, mede namens Onze Minister van Defensie van 11
    december 1992, nr. JBZ/L92.013025, Rijksluchtvaartdienst;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - *ACAS: Airborne Collision Avoidance
      System*, een systeem aan boord van een luchtvaartuig, werkend met signalen van transponders en onafhankelijk van
      installaties op de grond, dat de gezagvoerder advies geeft over mogelijk conflicterende luchtvaartuigen die zijn
      uitgerust met een transponder;
        - alarmering: een dienstverlening met het doel de betrokken instanties te waarschuwen aangaande luchtvaartuigen die
      hulp behoeven in de vorm van opsporing en redding en deze instanties bij te staan voor zover dat vereist is;
        - algemeen luchtverkeersleidingsgebied: een luchtverkeersleidingsgebied dat zich in opwaartse richting uitstrekt
      vanaf een vastgestelde grens boven het aardoppervlak;
        - baanwachtpositie: een gemarkeerde positie waar voertuigen en taxiënde luchtvaartuigen verplicht zijn te stoppen
      met als doel een baan, een hindernisbeperkend vlak of een ILS/MLS-kritisch of -gevoelig gebied te beschermen;
        - bijzondere VFR-vlucht: een VFR-vlucht, die overeenkomstig een klaring van een verlener van
      luchtverkeersleidingsdiensten wordt uitgevoerd binnen een plaatselijk luchtverkeersleidingsgebied, onder
      weersomstandigheden die slechter zijn dan zichtweersomstandigheden;
        - daglichtperiode: het gedeelte van het etmaal tussen vijftien minuten voor zonsopgang en vijftien minuten na
      zonsondergang zoals geldt voor de positie 52°00' N en 05°00' O op zeeniveau;
        - gecontroleerde luchthaven: een luchthaven waar luchtverkeersleiding wordt gegeven aan luchthavenverkeer;
        - gecontroleerde vlucht: een vlucht waarvoor een klaring is vereist;
        - geldend vliegplan: het ingediende vliegplan met inbegrip van eventuele wijzigingen veroorzaakt door daarop
      verstrekte klaringen;
        - grondzicht: het zicht op een luchthaven, zoals bepaald door een bevoegde waarnemer of met daartoe bestemde
      apparatuur;
        - helikopter: gemotoriseerd luchtvaartuig met rotorbladen, zwaarder dan lucht, dat hoofdzakelijk in de lucht kan
      worden gehouden door aërodynamische reactiekrachten op zijn rotorbladen;
        - IFR-vlucht: een vlucht waarop, naast de in [hoofdstuk III, afdeling 2][ref1], vastgestelde algemene
      vliegvoorschriften, tevens de in [afdeling 4][ref2] vastgestelde instrumentvliegvoorschriften van toepassing zijn;
        - inhalen: een ander luchtvaartuig van achteren naderen uit een richting, die een hoek maakt van minder dan 70° met
      het vlak van symmetrie van dit luchtvaartuig;
        - instrumentnaderingsprocedure: een serie van vooraf bepaalde manoeuvres met behulp van navigatie-installaties
      waarbij precies beschreven bescherming wordt geboden tegen obstakels vanaf een vastgestelde positie waar de
      nadering begint of vanaf het begin van een gedefinieerde aankomstroute, naar een punt waarvandaan de landing kan
      worden afgerond en daarna, wanneer een landing niet is afgerond, naar een positie waar obstakelvrije ruimte wordt
      geboden aan luchtvaartuigen in een wachtprocedure of kruisvlucht;
        - instrumentweersomstandigheden: weersomstandigheden, die zijn uitgedrukt in termen van zicht, afstand tot wolken
      en wolkenbasis en die minder zijn dan de voorgeschreven minimum waarden voor zichtweersomstandigheden;
        - kruishoogte: een vlieghoogte, die tijdens een aanzienlijk deel van een vlucht wordt gehandhaafd;
        - landingsterrein: het gedeelte van een luchthaven, met uitzondering van platforms, dat bestemd is voor het
      opstijgen, het landen en het taxiën van luchtvaartuigen;
        - luchtschip: luchtvaartuig, lichter dan lucht, dat is voorzien van een voortstuwingsinrichting en een
      besturingsinrichting;
        - luchthavenverkeer: alle verkeer op het landingsterrein en alle luchtvaartuigen die zich bevinden in het
      luchtverkeerscircuit van de betrokken luchthaven dan wel dit circuit binnen vliegen of verlaten;
        - luchtverkeersadvisering: adviezen die binnen het luchtverkeersdienstverleningsgebied klasse F worden gegeven
      met het doel, voor zover uitvoerbaar, separatie te verzekeren tussen vluchten die worden uitgevoerd volgens IFR-
      vliegplan;
        - luchtverkeerscircuit: de voorgeschreven vliegbaan voor luchtvaartuigen, die moet worden gevolgd in de nabijheid
      van een luchthaven;
        - luchtverkeersdienstverleningsgebieden: delen van het luchtruim met vastgestelde begrenzingen, waarvoor is
      vastgesteld welke soorten vluchten erin mogen worden uitgevoerd en welke soorten luchtverkeersdiensten er worden
      verleend, alsmede welke regels gelden voor de vluchtuitvoering;
        - luchtverkeersinformatie: informatie verstrekt door een verlener van luchtverkeersdiensten met het doel
      bestuurders opmerkzaam te maken op ander, bekend of waargenomen, luchtverkeer dat mogelijkerwijs in de nabijheid
      van hun positie of voorgenomen vliegroute verkeert, alsmede bestuurders behulpzaam te zijn bij het vermijden van
      botsingen;
        - luchtverkeersleidingsgebied: een luchtverkeersdienstverleningsgebied waarbinnen luchtverkeersleidingsdiensten
      worden verleend aan IFR-vluchten, en aan VFR-vluchten in overeenstemming met de geldende luchtruim classificatie;
        - luchtverkeersontwijkadvies: een door een verlener van luchtverkeersdiensten verstrekt advies tot het uitvoeren
      van bepaalde manoeuvres, met het doel bestuurders behulpzaam te zijn bij het vermijden van botsingen;
        - luchtverkeersroute: een bepaalde route, vastgesteld om de verkeersstroom te kanaliseren, waar dat nodig is voor
      het verlenen van luchtverkeersdiensten;
        - meldingspunt: de geografisch bepaalde plaats, ten opzichte waarvan de positie van een luchtvaartuig kan worden
      gemeld;
        - MLA: MLA als bedoeld in [artikel 1 van het Besluit luchtvaartuigen 2008][ref3];
        - modelraket: modelraket als bedoeld in [artikel 1 van de Regeling modelraketten][ref4];
        - motorzweefvliegtuig: vliegtuig dat bij uitgeschakelde motor de eigenschappen heeft van een zweefvliegtuig;
        - naderingsluchtverkeersleidingsgebied: een algemeen luchtverkeersleidingsgebied, dat doorgaans is ingesteld bij
      het kruispunt van luchtverkeersroutes gelegen in de nabijheid van één of meer luchthavens;
        - omschakelpunt: het punt waar een luchtvaartuig tijdens een vlucht langs een gedeelte van een luchtverkeersroute,
      dat is bepaald met betrekking tot rondomstralende radiobakens werkend op zeer hoge frequenties, verwacht wordt -
      voor de primaire navigatie - om te schakelen van het baken achter het luchtvaartuig naar het volgende baken vóór
      het luchtvaartuig;
        - Onze Minister: Onze Minister van Verkeer en Waterstaat voor wat het burgerluchtverkeer en de algemene
      verkeersveiligheid in de lucht betreft en Onze Minister van Defensie voor wat het militaire luchtverkeer betreft;
        - plaatselijk luchtverkeersleidingsgebied: een luchtverkeersleidingsgebied, dat zich verticaal uitstrekt vanaf het
      aardoppervlak tot aan een vastgestelde bovengrens;
        - platform: een gedeelte van een luchthaven, dat bestemd is voor het opstellen van luchtvaartuigen, met het doel
      passagiers te laten in- of uitstappen, post of vracht te laden of te lossen, brandstof in te nemen, te parkeren of
      onderhoudswerkzaamheden te verrichten;
        - *RA: Resolution Advisory*, een door ACAS aan de gezagvoerder gegeven advies om zodanig te manoeuvreren dat een
      botsing wordt voorkomen;
        - schermvliegtuig: zweeftoestel zonder starre hoofdstructuur dat kan worden gedragen en slechts gestart en geland
      kan worden door gebruik te maken van de benen van de bestuurder;
        - schermzweeftoestel: ongemotoriseerd schermvliegtuig;
        - taxiën: het op eigen kracht voortbewegen van een luchtvaartuig op een luchthaven, met uitzondering van de
      start en landing, maar met inbegrip van het voortbewegen van een helikopter boven een luchthaven binnen een
      hoogteband waar grond-effect wordt ondervonden en met een snelheid die vergelijkbaar is met die van andere taxiënde
      luchtvaartuigen;
        - TMG: motorzweefvliegtuig met een integraal gemonteerde niet intrekbare motor en een niet intrekbare propeller,
      dat in staat is om op eigen kracht op te stijgen en te klimmen (Touring Motor Glider);
        - *transponder*: een radarbeantwoordingssysteem met informatie over de identiteit en eventueel de hoogte van het
      luchtvaartuig;
        - uitwijkhaven: een luchthaven waarheen een vlucht kan worden vervolgd indien moet worden afgezien van landing op
      de luchthaven van bestemming;
        - VFR-vlucht: een vlucht waarop, naast de in [hoofdstuk III, afdeling 2][ref5], vastgestelde algemene
      vliegvoorschriften, tevens de in [afdeling 3][ref6] vastgestelde zichtvliegvoorschriften van toepassing zijn;
        - vlieghoogte: 'de hoogte van een zich in de lucht bevindend luchtvaartuig uitgedrukt in: 1. hoogte boven het'
      aardoppervlak 2. hoogte boven gemiddeld zeeniveau of 3. vliegniveau;
        - vliegniveau: een vlak van constante atmosferische druk in relatie tot het referentiedrukvlak van 1013.2
      hectopascals, dat van soortgelijke vlakken is gescheiden door bepaalde drukintervallen;
        - vliegtuig: gemotoriseerd luchtvaartuig met vaste vleugels, zwaarder dan lucht, dat hoofdzakelijk in de lucht
      gehouden kan worden door aërodynamische reactiekrachten op zijn vleugels;
        - vliegzicht: het zicht recht vooruit waargenomen vanuit de stuurhut van een luchtvaartuig tijdens de vlucht;
        - vluchtinformatiegebied: een luchtruimte met vastgestelde begrenzingen, waarbinnen inlichtingen tijdens de vlucht
      worden verstrekt en alarmering wordt verzorgd;
        - vluchtinformatieverstrekking: een dienstverlening met het doel inlichtingen te geven tijdens de vlucht ten
      behoeve van een veilige en doelmatige vluchtuitvoering;
        - vrije ballon: luchtvaartuig, lichter dan lucht, dat niet voorzien is van een voortstuwingsinrichting en is
      ingericht en bestemd om ten minste één persoon te vervoeren;
        - wolkenbasis: de hoogte boven grond of water van de basis van de laagste wolkenlaag beneden 6000 meter (20 000
      voet) die meer dan de helft van de hemel bedekt;
        - zeilvliegtuig: zweeftoestel met een starre hoofdstructuur, dat kan worden gedragen en slechts gestart en geland
      kan worden door gebruik te maken van de benen van de bestuurder;
        - zichtweersomstandigheden: weersomstandigheden, die zijn uitgedrukt in termen van zicht, afstand tot wolken en
      wolkenbasis, die gelijk zijn aan - of beter dan - voorgeschreven minimum waarden;
        - zweeftoestel: luchtvaartuig, niet zijnde TMG, zwaarder dan lucht, dat hoofdzakelijk in de lucht kan worden
      gehouden door aërodynamische reactiekrachten en waarvan de vrije vlucht niet afhankelijk is van een motor;
        - zweefvliegtuig: zweeftoestel met een vaste vleugel.


