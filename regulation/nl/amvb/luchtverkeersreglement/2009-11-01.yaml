  - number: 1a.1.a
    text: |-
      kabelvlieger, zijnde een toestel, zwaarder dan lucht en niet voorzien van een voortstuwingsinrichting, dat door
      middel van (een) ankerkabel(s) of lijn(en) is verbonden met het aardoppervlak;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel1a
  - number: 1a.1.b
    text: |-
      kleine kabelballon, zijnde een onbemande ballon, die door middel van een ankerkabel of lijn is verbonden met het
      aardoppervlak en die op zeeniveau in de internationale-standaard-atmosfeer in geheel gevulde toestand een diameter
      van ten hoogste 2 meter of een inhoud van ten hoogste 4 kubieke meter heeft, dan wel een samenstel van ballonnen
      waarvan de gezamenlijke diameter of inhoud deze waarde niet te boven gaat;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel1a
  - number: 1a.1.c
    text: |-
      licht onbemand luchtvaartuig, niet zijnde een modelluchtvaartuig of onbemande vrije ballon, zijnde een
      luchtvaartuig waarvan de totale startmassa niet meer dan 150 kilogram bedraagt en de maximale snelheid lager is dan
      129,64 km/u (70 knopen);
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel1a
  - number: 1a.1.d
    text: |-
      modelluchtvaartuig, zijnde een luchtvaartuig van geringe afmeting, niet in staat een mens te dragen, waarvan de
      totale startmassa niet meer dan 25 kilogram bedraagt;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel1a
  - number: 1a.1.e
    text: onbemande vrije ballon, zijnde een vrije ballon die niet is ingericht of bestemd om personen te vervoeren;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel1a
  - number: 1a.1.f
    text: |-
      valscherm, zijnde een scherm dat dient om de daalsnelheid van een persoon zodanig te beperken dat deze veilig het
      aardoppervlak kan bereiken;
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel1a
  - number: 1a.1.g
    text: |-
      valschermzweeftoestel, zijnde een toestel, zwaarder dan lucht en niet voorzien van een voortstuwingsinrichting, in
      de vorm van een scherm met één of twee harnassen, dat in de lucht wordt gebracht en voortbewogen met een voer- of
      vaartuig waarmee het dan is verbonden met één of meer lijnen.
    url: https://wetten.overheid.nl/BWBR0005775/2009-11-01#Artikel1a
  - number: 1a.2
    text: |-
      In afwijking van het eerste lid, is [artikel 5.3 van de Wet luchtvaart][ref1] van toepassing op de luchtvaartuigen,
      genoemd in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
