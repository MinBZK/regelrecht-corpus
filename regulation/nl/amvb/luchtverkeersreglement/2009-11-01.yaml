    text: |-
      De [titels 5.1][ref1] en [5.2 van de Wet luchtvaart][ref2] en dit besluit, met uitzondering van het tweede en derde
      lid en de [artikelen 20][ref3] en [63][ref4], zijn niet van toepassing op de volgende luchtvaartuigen:


