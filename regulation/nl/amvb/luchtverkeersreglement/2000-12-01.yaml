        artikel: '60'
        hoofdstuk: V
  - number: '65'
    text: Het Luchtverkeersreglement-1980 (*Stb.* 786) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel65
  - number: '66'
    text: |-
      Dit besluit treedt in werking op het tijdstip waarop de [Wet Luchtverkeer][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0005555
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0005555
  - number: '67'
    text: 'Dit besluit kan worden aangehaald als: Luchtverkeersreglement.'
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel67
