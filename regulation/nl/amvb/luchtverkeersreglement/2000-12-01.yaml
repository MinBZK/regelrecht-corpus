  - number: '2'
    text: >-
      Voor zover de LVNL beslissingen neemt ingevolge de bij of krachtens dit besluit verleende bevoegdheden die mede
      betrekking hebben op het militaire luchtverkeer handelt zij in overeenstemming met Onze Minister van Defensie.
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel2
  - number: '3'
    text: >-
      1 Onze Minister stelt voor elk luchtverkeersdienstverleningsgebied de luchtverkeersdienstverleningsklasse vast met
      inachtneming van de volgende indeling:


      a. klasse A: uitsluitend IFR-vluchten zijn toegestaan; aan alle vluchten wordt luchtverkeersleiding verstrekt; alle
      vluchten worden onderling gesepareerd;


      b. klasse B: zowel IFR- als VFR-vluchten zijn toegestaan; aan alle vluchten wordt luchtverkeersleiding verstrekt;
      alle vluchten worden onderling gesepareerd;


      c. klasse C: zowel IFR- als VFR-vluchten zijn toegestaan; aan alle vluchten wordt luchtverkeersleiding verstrekt;
      IFR-vluchten worden gesepareerd van andere IFR-vluchten en van VFR-vluchten; VFR-vluchten worden gesepareerd van
      IFR-vluchten en ontvangen luchtverkeersinformatie betreffende andere VFR-vluchten;


      d. klasse D: zowel IFR- als VFR-vluchten zijn toegestaan; aan alle vluchten wordt luchtverkeersleiding verstrekt,
      IFR-vluchten worden gesepareerd van andere IFR-vluchten en ontvangen luchtverkeersinformatie betreffende VFR-
      vluchten; VFR-vluchten ontvangen luchtverkeersinformatie betreffende andere vluchten;


      e. klasse E: zowel IFR- als VFR-vluchten zijn toegestaan; aan IFR-vluchten wordt luchtverkeersleiding verstrekt;
      IFR-vluchten worden gesepareerd van andere IFR-vluchten; alle vluchten ontvangen voor zover uitvoerbaar
      luchtverkeersinformatie;


      f. klasse F: zowel IFR- als VFR-vluchten zijn toegestaan; deelnemende IFR-vluchten ontvangen vlucht-advisering en
      alle vluchten ontvangen op verzoek vluchtinformatie;


      g. klasse G: IFR- en VFR-vluchten zijn toegestaan en ontvangen op verzoek vluchtinformatie.


      2 Onze Minister kan nadere regels geven met betrekking tot de luchtverkeersdienstverleningsklassen.
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel3
  - number: '4'
    text: >-
      1 Luchtverkeersleiding wordt gegeven aan de volgende vluchten:


      a. alle IFR-vluchten in luchtverkeersdienstverleningsgebieden klasse A, B, C, D en E;


      b. alle VFR-vluchten in luchtverkeersdienstverleningsgebieden klasse B, C en D;


      c. alle bijzondere VFR-vluchten;


      d. het luchtvaartterreinverkeer van een gecontroleerd luchtvaartterrein.


      2 Luchtverkeersleiding is te onderscheiden in:


      a. algemene luchtverkeersleiding ten behoeve van gecontroleerde vluchten in algemene luchtverkeersleidingsgebieden;


      b. naderingsluchtverkeersleiding ten behoeve van naderend en vertrekkend luchtverkeer van en naar
      luchtvaartterreinen;


      c. plaatselijke luchtverkeersleiding ten behoeve van luchtvaartterreinverkeer.


      3 Klaringen voorzien in separatie tussen:


      a. alle vluchten in klasse A en B gebieden;


      b. IFR-vluchten in klasse C, D en E gebieden;


      c. IFR- en VFR-vluchten in klasse C gebieden;


      d. IFR-vluchten en bijzondere VFR-vluchten;


      e. bijzondere VFR-vluchten onderling indien voorgeschreven door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel4
  - number: '5'
    text: >-
      1 Vluchtinformatie wordt verstrekt aan alle luchtvaartuigen indien:


      a. aan deze luchtvaartuigen luchtverkeersleiding wordt verstrekt;


      b. deze luchtvaartuigen anderszins bekend zijn bij de betrokken luchtverkeersdienst, of;


      c. deze informatie van invloed kan zijn op de vluchtuitvoering.


      2 Vluchtinformatie omvat:


      a. inlichtingen verstrekt door een meteorologische dienst betreffende het optreden of verwachte optreden van
      bepaalde weersverschijnselen langs de vliegroute, die de veiligheid van de vluchtuitvoering kunnen beïnvloeden;


      b. inlichtingen over wijziging in de bruikbaarheid van navigatie-hulpmiddelen;


      c. inlichtingen over wijzigingen in de staat waarin luchtvaartterreinen en bijbehorende faciliteiten verkeren, met
      inbegrip van de staat waarin het landingsterrein en de platforms zich bevinden ten gevolge van de aanwezigheid van
      sneeuw, ijs of water;


      d. andere beschikbare gegevens die de veiligheid van de vlucht kunnen beïnvloeden;


      e. gemelde of verwachte weersomstandigheden op luchtvaartterreinen van aankomst en vertrek en op uitwijkhavens;


      f. mogelijk botsingsgevaar voor vluchten in de klasse C, D, E, F en G gebieden.


      3 Vluchtinformatie aan VFR-vluchten omvat, naast de in het tweede lid, onderdeel *a* tot en met *d* bedoelde
      gegevens voor zover beschikbaar, inlichtingen omtrent ander luchtverkeer en mogelijke instrumentweersomstandigheden
      langs de vliegroute.
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel5
  - number: '6'
    text: >-
      Alarmering wordt verzorgd:


      a. voor alle vluchten waaraan luchtverkeersleiding wordt gegeven;


      b. voorzover uitvoerbaar voor andere vluchten waarvoor een vliegplan is ingediend of die anderszins bekend zijn bij
      de betrokken luchtverkeersdiensten;


      c. voor elk luchtvaartuig waarvan bekend is of verondersteld wordt dat het is onderworpen aan wederrechtelijke
      inmenging.
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel6
  - number: '7'
    text: >-
      1 Onze Minister wijst in het vluchtinformatiegebied Amsterdam aan:


      a. algemene luchtverkeersleidingsgebieden;


      b. plaatselijke luchtverkeersleidingsgebieden;


      c. gecontroleerde luchtvaartterreinen.


      2 Onze Minister bepaalt, door welke luchtverkeersdiensten, in welke gebieden binnen het vluchtinformatiegebied
      Amsterdam en op welke gecontroleerde luchtvaartterreinen luchtverkeersdienstverlening wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel7
  - number: '8'
    text: >-
      Onze Minister kan ter bescherming van het luchtverkeer ten opzichte van bepaalde soorten luchtverkeer of van
      bijzondere luchtverkeersactiviteiten, delen van het vluchtinformatiegebied Amsterdam aanwijzen als bijzondere
      luchtverkeersgebieden; aan deze aanwijzingen kunnen regels worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel8
  - number: '9'
    text: >-
      Onze Minister kan regels geven voor:


      a. de wijze waarop luchtverkeersdienstverlening wordt gegeven;


      b. de luchtvaarttelecommunicatie;


      c. het tijdens de vlucht verstrekken van gegevens en luchtvaartinlichtingen.
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel9
  - number: '10'
    text: >-
      Onze Minister stelt in het vluchtinformatiegebied Amsterdam luchtverkeersroutes en -procedures vast,
      waaronder mede zijn begrepen: naderings-, vertrek- en wachtprocedures, alsmede luchtverkeerspatronen voor
      luchtvaartterreinverkeer.
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel10
  - number: '11'
    text: >-
      1 Het gebruik van een luchtvaartuig, zowel op het landingsterrein en de platforms als tijdens de vlucht, moet
      geschieden in overeenstemming met de algemene vliegvoorschriften.


      2 Voorts moet de uitvoering van de vlucht van een luchtvaartuig dat zich in de lucht bevindt, geschieden in
      overeenstemming met de zichtvliegvoorschriften, of de instrumentvliegvoorschriften.
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel11
  - number: '12'
    text: Onze Minister geeft regels met betrekking tot het gebruik van de hoogtemeter en het bepalen van kruishoogtes.
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel12
  - number: '13'
    text: >-
      1 Het is verboden voorwerpen of stoffen te verwijderen tijdens de vlucht.


      2 Het eerste lid geldt niet ingeval van verwijderen van:


      a. los fijn zand;


      b. water;


      c. stoffen ter bevordering of ter bescherming van het milieu dan wel de land-, tuin- of bosbouw;


      d. voorwerpen waarvan de massa niet meer is dan 200 gram per voorwerp, overeenkomstig door Onze Minister te stellen
      regels;


      e. voorwerpen en stoffen voor militaire doeleinden of uit militaire luchtvaartuigen;


      f. voorwerpen die verband houden met opsporings- en reddingsakties;


      g. voorwerpen en stoffen voor politiedoeleinden.


      3 De LVNL kan vrijstelling of ontheffing verlenen van het in het eerste lid gestelde verbod.


      4 Vrijstellingen en ontheffingen kunnen onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel13
  - number: '14'
    text: >-
      1 Het is verboden luchtvaartuigen of andere voorwerpen tijdens de vlucht te slepen.


      2 Het eerste lid geldt, overeenkomstig door Onze Minister te stellen regels, niet voor de volgende vluchten:


      a. vluchten waarbij een zweefvliegtuig wordt gesleept;


      b. vluchten waarbij een sleepnet wordt gesleept;


      c. vluchten waarbij voor militaire doeleinden wordt gesleept.


      3 De LVNL kan vrijstelling of ontheffing verlenen van het in het eerste lid gestelde verbod; vrijstellingen en
      ontheffingen kunnen onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel14
  - number: '15'
    text: >-
      1 Het is verboden, behalve in geval van nood, valschermsprongen uit te voeren vanuit een zich in het luchtruim
      bevindend luchtvaartuig.


      2 Het eerste lid geldt niet indien de valschermsprongen worden uitgevoerd overeenkomstig de door Onze Minister te
      stellen regels die de bescherming van het luchtverkeer en van personen en zaken op de grond ten doel hebben.


      3 De LVNL kan vrijstelling of ontheffing verlenen van het in het eerste lid gestelde verbod.


      4 Onze Minister van Defensie kan indien in militair verband gesprongen wordt, vrijstelling of ontheffing verlenen
      van het in het eerste lid gestelde verbod.


      5 Vrijstellingen en ontheffingen kunnen onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel15
  - number: '16'
    text: >-
      1 Het is verboden een vlucht uit te voeren, waarbij met opzet bewegingen worden uitgevoerd die een plotselinge
      verandering in de stand, een abnormale stand of een abnormale verandering in de snelheid van het luchtvaartuig
      meebrengen.


      2 Het eerste lid geldt niet voor:


      a. vluchten met militaire luchtvaartuigen, indien de gezagvoerder de door Onze Minister van Defensie vastgestelde
      regels nakomt;


      b. vluchten onder zichtweersomstandigheden indien de gezagvoerder van het luchtvaartuig verscherpte waakzaamheid
      betracht met het doel botsingsgevaar tijdig te kunnen onderkennen en de voorgeschreven maatregelen tot het
      vermijden van botsingen tijdig te kunnen nemen en indien:


      1. op een zodanige horizontale of verticale afstand van gebieden met aaneengesloten bebouwing of mensenverzameling
      wordt gevlogen dat bij het uitvoeren van de in het eerste lid bedoelde vlucht personen of zaken op het
      aardoppervlak niet in gevaar kunnen worden gebracht;


      2. het luchtvaartuig niet een voorwerp of ander luchtvaartuig in de lucht sleept of geen valschermspringers naar
      het afspringpunt brengt.
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel16
  - number: '17'
    text: >-
      1 Het is verboden een ander luchtvaartuig zo dicht te naderen dat gevaar voor botsing ontstaat.


      2 Het is verboden in gesloten verband vluchten uit te voeren, tenzij dienaangaande vooraf een regeling is getroffen
      tussen de gezagvoerders onderling en - bij gecontroleerde vluchten - met de betrokken luchtverkeersleidingsdienst.
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel17
  - number: '18'
    text: |-
      1 Onverminderd de verantwoordelijkheid van een gezagvoerder om die maatregelen te nemen die een botsing kunnen
      voorkomen, behoudt een luchtvaartuig, waarvoor moet worden uitgeweken, zijn oorspronkelijke koers en snelheid.

      2 Het is verboden, indien ingevolge de [artikelen 19 tot en met 26][ref1] voor een ander luchtvaartuig wordt
      uitgeweken, boven, onder of vóór dat luchtvaartuig langs te gaan, tenzij daarbij op ruime afstand wordt gebleven en
      er voor het andere luchtvaartuig geen gevolgen merkbaar zijn van luchtwervelingen veroorzaakt door het uitwijkende
      luchtvaartuig.

      3 Een gezagvoerder die, gevolg gevend aan een RA, afwijkt van een klaring, meldt dit terstond aan de betrokken
      luchtverkeersleidingsdienst.

      4 Indien de gezagvoerder een melding als bedoeld in het derde lid heeft gedaan, geeft de luchtverkeersleider aan
      dat luchtvaartuig geen opdrachten die tegenstrijdig zijn aan de RA.

      5 Na de afwijking van de klaring als gevolg van de RA wordt de vlucht zo spoedig mogelijk hervat overeenkomstig
      de oorspronkelijk verkregen klaring of overeenkomstig een nieuwe klaring verkregen van de betrokken
      luchtverkeersleidingsdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel19
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '19'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '2'
  - number: '19'
    text: >-
      Wanneer twee luchtvaartuigen elkaar recht vooruit of bijna recht vooruit naderen en gevaar voor botsing bestaat,
      moet elk van deze luchtvaartuigen zijn koers naar rechts verleggen.
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel19
  - number: '20'
    text: |-
      1 Wanneer twee luchtvaartuigen op dezelfde of op bijna dezelfde hoogte koersen volgen, die elkaar kruisen, moet het
      luchtvaartuig dat het andere rechts van zich heeft, voor dit laatste uitwijken.

      2 Voorts moeten:

      a. vliegtuigen uitwijken voor luchtschepen, zweefvliegtuigen en ballons;

      b. luchtschepen uitwijken voor zweefvliegtuigen en ballons;

      c. zweefvliegtuigen uitwijken voor ballons;

      d. vliegtuigen en luchtschepen uitwijken voor luchtvaartuigen waarvan wordt gezien dat zij een ander luchtvaartuig
      of voorwerp slepen.

      3 Het eerste lid geldt niet voor een luchtvaartuig dat het in [artikel 27][ref1] bedoelde luchtverkeerscircuit
      volgt.


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel27
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '27'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '2'
  - number: '21'
    text: >-
      Een luchtvaartuig, dat een ander luchtvaartuig inhaalt, moet - onverschillig of eerstgenoemde stijgt, daalt of zich
      horizontaal voortbeweegt - uitwijken door zijn koers naar rechts te verleggen. Geen daarop volgende veranderingen
      van de positie van de beide luchtvaartuigen ten opzichte van elkaar ontslaat het inhalende luchtvaartuig van deze
      verplichting, totdat het zich op ruime afstand voorbij het andere luchtvaartuig bevindt.
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel21
  - number: '22'
    text: >-
      Een luchtvaartuig dat zich in de lucht bevindt of zich voortbeweegt op de grond of op het water, moet uitwijken
      voor een luchtvaartuig dat bezig is te landen of zich bevindt in de laatste naderingsfase voor de landing.
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel22
  - number: '23'
    text: >-
      1 Wanneer twee of meer luchtvaartuigen tegelijkertijd een luchtvaartterrein naderen om te landen, moet een zich
      hoger bevindend luchtvaartuig uitwijken voor een zich lager bevindend luchtvaartuig, met dien verstande, dat het
      zich lager bevindende luchtvaartuig deze bepalingen niet mag benutten door een ander luchtvaartuig, dat zich in de
      laatste naderingsfase voor de landing bevindt, in te halen of daar voorlangs te gaan.


      2 In afwijking van het eerste lid dienen vliegtuigen uit te wijken voor zweefvliegtuigen.
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel23
  - number: '24'
    text: Een luchtvaartuig moet uitwijken voor een ander luchtvaartuig dat genoodzaakt is te landen.
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel24
  - number: '25'
    text: >-
      1 Een luchtvaartuig dat taxiet op het landingsterrein of de platforms moet uitwijken voor een luchtvaartuig dat
      start dan wel op het punt staat te starten.


      2 Wanneer gevaar voor botsing bestaat tussen twee taxiënde luchtvaartuigen op het landingsterrein of platforms zijn
      de volgende voorschriften van toepassing:


      a. wanneer twee luchtvaartuigen elkaar recht vooruit of bijna recht vooruit naderen moeten beide luchtvaartuigen
      stoppen of, waar mogelijk, zodanig naar rechts uitwijken dat zij vrij van elkaar kunnen passeren;


      b. wanneer twee luchtvaartuigen routes volgen die elkaar kruisen, moet het luchtvaartuig dat het andere rechts van
      zich heeft dit laatste voor laten gaan;


      c. een luchtvaartuig dat een ander luchtvaartuig inhaalt moet daarbij ruime afstand houden tot het andere
      luchtvaartuig.
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel25
  - number: '26'
    text: >-
      1 Een luchtvaartuig, dat taxiet op het landingsterrein moet stilhouden en wachten bij alle wachtposities tenzij het
      toestemming om door te taxiën heeft gekregen van de plaatselijke luchtverkeersleidingsdienst.


      2 Een luchtvaartuig, dat taxiet op het landingsterrein moet stilhouden en wachten bij alle brandende stoplichten en
      mag zijn weg vervolgen als:


      a. het toestemming heeft gekregen van de plaatselijke luchtverkeersleidingsdienst, en;


      b. de stoplichten gedoofd zijn en de betreffende rijbaan-hartlijnlichten zijn ontstoken.


      3 Alvorens met een luchtvaartuig te taxiën op het landingsterrein van een gecontroleerd luchtvaartterrein,
      zonder de bedoeling een vlucht uit te voeren, moet toestemming worden verkregen van de plaatselijke
      luchtverkeersleidingsdienst en moet aan opdrachten van die luchtverkeersleidingsdienst worden voldaan.


      4 Wanneer tijdens het taxiën is afgeweken van de verkregen toestemming moet de plaatselijke
      luchtverkeersleidingsdienst daarvan zo spoedig mogelijk worden ingelicht onder vermelding van de redenen daarvoor
      en van de afwijkingen van de toestemming.
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel26
  - number: '27'
    text: |-
      1 Op of in de nabijheid van een luchtvaartterrein moet:

      a. bijzonder acht worden gegeven op het verkeer, teneinde een botsing te vermijden;

      b. het door luchtvaartuigen gevormd luchtverkeerscircuit worden gevolgd dan wel worden vermeden;

      c. op zodanige wijze in [het onder ][ref1] bedoelde luchtverkeerscircuit worden ingevoegd, dat luchtvaartuigen die
      dit luchtverkeerscircuit volgen niet worden gehinderd;

      d. tijdens het aanvliegen voor een landing en na het opstijgen elke bocht naar links worden gemaakt, tenzij een
      anders luidende aanwijzing is gegeven;

      e. tegen de wind in worden geland en opgestegen, tenzij een andere richting de voorkeur verdient met het oog op de
      veiligheid, de baanligging of om luchtverkeerstechnische redenen.

      2 Het eerste lid onder *b*, *d* en *e* geldt niet, indien bij ministeriële regeling nadere regels zijn gegeven voor
      het verkeer op of in de nabijheid van één of meerdere luchtvaartterreinen.

      3 De LVNL kan ontheffing verlenen van het gestelde in het eerste lid onder *b* aan gezagvoerders die deelnemen aan
      bijzondere luchtverkeersactiviteiten in de nabijheid van een ongecontroleerd luchtvaartterrein; ontheffingen kunnen
      onder beperkingen worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel27
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '27'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '2'
  - number: '28'
    text: >-
      1 Onze Minister geeft regels met betrekking tot de periode waarin en de omstandigheden waaronder de volgende door
      een luchtvaartuig gevoerde lichten moeten worden getoond:


      a. navigatielichten;


      b. anti-botsingslichten;


      c. lichten die dienen om de afmetingen van het luchtvaartuig aan te geven;


      d. lichten die dienen om aan te geven dat een voortstuwingsinrichting van het luchtvaartuig in werking is dan wel
      wordt gesteld.


      2 Het is verboden andere dan de in het eerste lid bedoelde lichten te voeren, indien deze kunnen worden aangezien
      voor de krachtens dat lid vastgestelde lichten.


      3 Het is verboden andere dan de in het eerste lid bedoelde lichten te tonen indien deze verblinding kunnen
      veroorzaken voor leden van het stuurhutpersoneel van het betrokken luchtvaartuig of van andere luchtvaartuigen, dan
      wel op een luchtvaartterrein voor bestuurders van voertuigen of grondpersoneel.
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel28
  - number: '29'
    text: >-
      Het is verboden aan het luchtverkeer deel te nemen onder nagebootste blindvliegomstandigheden tenzij:


      1. het luchtvaartuig is voorzien van een dubbele besturing en;


      2. een persoon die bevoegd is dat luchtvaartuig te besturen een bestuurdersplaats inneemt teneinde de besturing
      onmiddellijk te kunnen overnemen; deze persoon moet beschikken over voldoende uitzicht naar voren en naar beide
      zijden van het luchtvaartuig of moet rechtstreeks in verbinding staan met een lid van het stuurhutpersoneel, dat
      een zodanige plaats inneemt, dat zijn uitzicht het uitzicht van deze persoon voldoende aanvult.
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel29
  - number: '30'
    text: >-
      Een luchtvaartuig op het water moet voldoen aan de voorschriften ter voorkoming van botsing die ter plaatse gelden
      voor vaartuigen.
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel30
  - number: '31'
    text: >-
      1 Behalve voor een gecontroleerde vlucht moet tevens een vliegplan worden ingediend voor de aanvang van:


      a. elke IFR-vlucht binnen een luchtverkeersdienstverleningsgebied met klasse F of G;


      b. elke vlucht in gebieden of langs routes waar Onze Minister dat heeft voorgeschreven met het doel om het
      verstrekken van vluchtinformatie, de alarmering of de opsporing en redding te vergemakkelijken;


      c. elke VFR-vlucht in gebieden of langs routes, waar Onze Minister dat heeft voorgeschreven met het
      doel coördinatie met betrokken militaire eenheden of met luchtverkeersdiensten in aangrenzende staten te
      vergemakkelijken, om zodoende een mogelijke noodzaak tot onderschepping voor identificatie-doeleinden te voorkomen;


      d. elke internationale VFR-vlucht.


      2 Onze Minister kan vrijstelling of ontheffing verlenen van de verplichting als bedoeld in het tweede lid, onder
      *d*.


      3 Een vliegplan kan worden ingediend voor een VFR-vlucht, waarvoor geen vliegplan is vereist, indien de
      gezagvoerder zulks wenst met het doel eventuele opsporing en redding te vergemakkelijken.


      4 Onze Minister kan regels geven met betrekking tot:


      a. de gegevens die het vliegplan moet bevatten;


      b. de wijze van indienen, wijzigen en afsluiten van een vliegplan.
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel31
  - number: '32'
    text: >-
      1 Elke wijziging van het ingediende vliegplan moet zo spoedig mogelijk worden gemeld aan de betrokken
      luchtverkeersdienst, indien het is ingediend voor:


      a. een IFR-vlucht, of;


      b. een gecontroleerde VFR-vlucht.


      2 Een wijziging van het vliegplan dat is ingediend voor een niet-gecontroleerde VFR-vlucht, moet zo spoedig
      mogelijk worden gemeld aan de betrokken luchtverkeersdienst, indien deze betrekking heeft op gegevens die van
      belang zijn voor de alarmering.


      3 Een wijziging van het voor een gecontroleerde vlucht geldend vliegplan mag niet worden uitgevoerd, alvorens
      daartoe een klaring is verkregen van de betrokken luchtverkeersleidingsdienst.


      4 Wanneer tijdens een gecontroleerde vlucht is afgeweken van het geldend vliegplan moet de betrokken
      luchtverkeersleidingsdienst daarvan zo spoedig mogelijk worden ingelicht onder vermelding van de redenen daarvoor
      en van de afwijkingen van het geldend vliegplan.


      5 De meldingsplicht, als bedoeld in het vierde lid, geldt niet voor zover:


      a. de afwijking van de gemiddelde snelheid minder bedraagt dan vijf procent;


      b. de afwijking van de geschatte tijd voor het volgende meldingspunt of voor het luchtvaartterrein van bestemming,
      minder bedraagt dan drie minuten.
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel32
  - number: '33'
    text: >-
      1 Het is verboden andere dan de bij ministeriële regeling aangewezen seinen te gebruiken.


      2 Bij het waarnemen of ontvangen van enig sein, als bedoeld in het eerste lid, moet worden gehandeld overeenkomstig
      de bij ministeriële regeling vastgestelde betekenis van het sein.
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel33
  - number: '34'
    text: >-
      1 Voor het vermelden van tijdstippen met betrekking tot vluchten moet Gecoördineerde Wereldtijd worden gebruikt,
      uitgedrukt in uren en minuten van het etmaal, beginnend te middernacht.


      2 Voor de aanvang van een gecontroleerde vlucht en telkens gedurende de vlucht, wanneer de noodzaak daartoe blijkt,
      moet de gezagvoerder zich op de hoogte stellen van de juiste tijd.
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel34
  - number: '35'
    text: >-
      1 Een gecontroleerde vlucht moet worden uitgevoerd in overeenstemming met het geldend vliegplan en met inachtneming
      van het bepaalde in de volgende leden met betrekking tot het volgen van de vliegplanroute.


      2 Tenzij een afwijkende klaring is verstrekt door de betrokken luchtverkeersleidingsdienst, moet tijdens een
      gecontroleerde vlucht - voor zover uitvoerbaar - als volgt worden gevlogen:


      a. bij het volgen van een vastgestelde luchtverkeersroute, langs de hartlijn bepaald voor die route, of;


      b. bij het volgen van een andere route, direct tussen de navigatiestations of punten waardoor die route wordt
      bepaald.


      3 Onverminderd het gestelde in het tweede lid, moet - tijdens een vlucht langs een gedeelte van een
      luchtverkeersroute dat is bepaald met betrekking tot ongerichte radiobakens werkend op zeer hoge frequenties
      - voor de primaire navigatie worden omgeschakeld van het achterliggende naar het voorliggend baken boven het
      omschakelpunt, indien dat is vastgesteld, of zo dicht erbij als operationeel uitvoerbaar is.


      4 Bij afwijking van het gestelde in het tweede lid moet daarvan zo spoedig mogelijk melding worden gedaan aan de
      betrokken luchtverkeersleidingsdienst en moet - behoudens andersluidende klaring - een zodanige koerswijziging
      worden uitgevoerd, dat het luchtvaartuig zo spoedig mogelijk weer terugkeert op de te volgen route.
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel35
  - number: '36'
    text: >-
      1 Tijdens een gecontroleerde vlucht moet zo spoedig mogelijk aan de betrokken luchtverkeersleidingsdienst worden
      gemeld de tijd en de vlieghoogte waarop een verplicht meldingspunt is gepasseerd, te zamen met alle verder
      vereiste inlichtingen, tenzij de betrokken luchtverkeersleidingsdienst anders bepaalt. Op gelijke wijze moeten
      positiemeldingen plaatsvinden met betrekking tot die punten die de betrokken luchtverkeersleidingsdienst opgeeft.


      2 Indien geen verplichte meldingspunten zijn vastgesteld, moeten positiemeldingen plaatsvinden telkens na het
      verstrijken van een tijdsverloop dat bij ministeriële regeling is vastgesteld, dan wel is opgegeven door de
      betrokken luchtverkeersleidingsdienst.


      3 Bij ministeriële regeling kunnen verplichte meldingspunten worden vastgesteld, alsmede omschakelpunten en het
      tijdsverloop telkens na het verstrijken waarvan positiemeldingen moeten plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel36
  - number: '37'
    text: >-
      Bij beëindiging van een gecontroleerde vlucht, hetzij door landing, dan wel bij voortzetting daarvan als niet
      gecontroleerde vlucht, moet de betrokken luchtverkeersleidingsdienst daarvan zo spoedig mogelijk in kennis worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel37
  - number: '38'
    text: >-
      1 Tijdens het uitvoeren van vluchten, binnen de luchtverkeersdienstverleningsgebieden met klasse A, B, C, en D en
      van IFR-vluchten binnen het luchtverkeersdienstverleningsgebied met klasse E, moet voortdurend op de aangewezen
      radiofrequentie worden geluisterd en zonodig een tweezijdige radioverbinding tot stand worden gebracht met de
      betrokken luchtverkeersleidingsdienst.


      2 Onze Minister kan nadere regels stellen ten aanzien van het in het eerste lid bepaalde.


      3 De LVNL kan vrijstelling of ontheffing verlenen van het in het eerste lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel38
  - number: '39'
    text: |-
      1 Indien het bepaalde in [artikel 38][ref1] niet kan worden nagekomen door storing in de radioverbinding, moet
      worden gehandeld overeenkomstig door Onze Minister ter zake gegeven regels voor de luchtvaarttelecommunicatie.

      2 Indien de in het eerste lid bedoelde handelingen niet leiden tot herstel van de radioverbinding, moet de vlucht
      worden voortgezet met inachtneming van de door Onze Minister vastgestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel38
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '38'
        hoofdstuk: III
        paragraaf: '6'
        afdeling: '2'
  - number: '40'
    text: >-
      Onze Minister geeft regels met betrekking tot de bediening van de boordapparatuur voor het beantwoorden van
      ondervragingen door radargrondstations.
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel40
  - number: '41'
    text: |-
      1 Wanneer een burgerluchtvaartuig wordt onderschept door een ander luchtvaartuig moet het onderschepte
      luchtvaartuig:

      a. de door het onderscheppende luchtvaartuig gegeven opdrachten opvolgen, waarbij aan visuele seinen betekenis en
      uitvoering moet worden gegeven als krachtens [artikel 33][ref1] is vastgesteld;

      b. indien mogelijk de betrokken luchtverkeersdienst daarvan in kennis stellen;

      c. zo mogelijk radioverbinding tot stand brengen met het onderscheppende luchtvaartuig dan wel met de eenheid
      die de onderschepping leidt, door het uitzenden van een algemene oproep op de noodfrequentie 121 500 MHz onder
      vermelding van de identiteit van het onderschepte luchtvaartuig en de aard van de vlucht; voorts, indien geen
      radioverbinding tot stand is gekomen, deze oproep herhalen op de noodfrequentie 243 000 MHz, indien dat uitvoerbaar
      is;

      d. wanneer radioverbinding met het onderscheppende luchtvaartuig tot stand is gebracht maar communicatie in
      een gemeenschappelijke taal niet mogelijk is, pogingen ondernemen om essentiële informatie en bevestiging van
      opdrachten over te brengen door gebruikmaking van de radioseinen die daartoe krachtens [artikel 33][ref2] zijn
      vastgesteld;

      e. indien uitgerust met apparatuur voor het beantwoorden van ondervragingen door radarstations, Mode A code 7700
      instellen, tenzij door de betrokken luchtverkeersdienst anders wordt opgedragen.

      2 Indien door het onderschepte luchtvaartuig, uit welke bron dan ook, per radio opdrachten worden ontvangen die
      afwijken van de door het onderscheppende luchtvaartuig door middel van visuele seinen of radio gegeven opdrachten,
      moet onmiddellijk opheldering worden gevraagd, terwijl intussen de door het onderscheppende luchtvaartuig gegeven
      opdrachten moeten worden uitgevoerd.

      3 Onze Minister van Defensie geeft, in overleg met Onze Minister van Verkeer en Waterstaat, regels met betrekking
      tot het onderscheppen van burgerluchtvaartuigen door militaire luchtvaartuigen; deze regels zijn eveneens van
      toepassing op luchtvaartuigen die worden gebruikt voor politie- of douanediensten.

      4 Onze Minister kan nadere regels geven met betrekking tot het bepaalde in het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0005775#Artikel33
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '33'
        hoofdstuk: III
        paragraaf: '4'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005775
        artikel: '33'
        hoofdstuk: III
        paragraaf: '4'
        afdeling: '2'
  - number: '42'
    text: |-
      1 Het is verboden een VFR-vlucht uit te voeren onder zodanige weersomstandigheden dat het vliegzicht en de afstand
      van het luchtvaartuig tot de wolken kleiner is dan de in de volgende tabel genoemde waarden.











                    Luchtverkeersdienstverle-ningsgebied met klasse


                    B


                    CDE


                    FG




                    boven


                    op of beneden









                    900 m (3000 voet) boven gemiddeld zeeniveau of 300m (1000 voet) boven terreinhoogte als dit hoger is.




                    Afstand van het luchtvaartuig tot de wolken


                    vrij van wolken


                    1500 m horizontaal 300 m (1000 voet) vertikaal


                    vrij van wolken met zicht op grond of water




                    vliegzicht


                    8 km op en boven vliegniveau 100


                    5 km





                    5 km beneden vliegniveau 100







      2 Het eerste lid geldt niet indien:

      a. een klaring is verkregen van de betrokken luchtverkeersleidingsdienst voor het uitvoeren van een bijzondere
      VFR-vlucht;

      b. bij ministeriële regeling andere waarden zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel42
  - number: '43'
    text: >-
      1 Het is verboden, tijdens een VFR-vlucht, te landen op of op te stijgen van een luchtvaartterrein dat is gelegen
      in een plaatselijk luchtverkeersleidingsgebied dan wel het plaatselijk luchtverkeersleidingsgebied binnen te
      vliegen, indien:


      a. de wolkenbasis lager is dan 450 m (1500 voet), of


      b. het grondzicht minder is dan 5 km.


      2 Het eerste lid geldt niet indien bij ministeriële regeling andere waarden zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel43
  - number: '44'
    text: |-
      1 Het is verboden, ongeacht de weersomstandigheden, een VFR-vlucht uit te voeren:

      a. buiten de daglichtperiode, zoals gepubliceerd in de in [artikel 60, onder ][ref1], bedoelde luchtvaartgids;

      b. in luchtverkeersdienstverleningsgebieden met klasse A;

      c. met een snelheid groter dan de plaatselijke voortplantingssnelheid van het geluid.

      2 Onze Minister kan nadere regels stellen ten aanzien van het in het eerste lid onder *a*, bepaalde.

      3 Het eerste lid onder *b*, geldt niet indien bij ministeriële regeling anders is bepaald.

      4 De LVNL kan vrijstelling of ontheffing verlenen van het in het eerste lid bepaalde.

      5 Onze Minister van Defensie kan vrijstelling of ontheffing verlenen van het in het eerste lid bepaalde.

      6 Vrijstellingen en ontheffingen kunnen onder beperkingen worden verleend.

      7 De maximum toegestane vliegsnelheid in de luchtverkeersdienstverleningsgebieden met klasse C tot en met G beneden
      vliegniveau 100 bedraagt 470 km/uur (250 knopen).

      8 Het zevende lid geldt niet indien bij ministeriële regeling andere waarden zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel60
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '60'
        hoofdstuk: V
  - number: 44a
    text: >-
      1 Bij ministeriële regeling worden regels gegeven inzake de navigatie- en telecommunicatie-installaties waarmee een
      luchtvaartuig voor het uitvoeren van een VFR-vlucht is uitgerust en de eisen waar die installaties aan voldoen.


      2 Onze Minister kan ontheffing verlenen van de krachtens het eerste lid gegeven regels.


      3 Ontheffing kan slechts verleend worden indien de navigatie- en telecommunicatieuitrusting van het luchtvaartuig
      ten minste gelijkwaardige mogelijkheden biedt voor de vluchtuitvoering.


      4 Ontheffingen kunnen onder beperkingen worden verleend.


      5 Aan ontheffingen kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel44a
  - number: '45'
    text: |-
      1 Met uitzondering van het gestelde in het tweede lid is het - tenzij noodzakelijk om op te stijgen van of te
      landen op een luchtvaartterrein, naderings- en vertrekprocedures alsmede luchtverkeerspatronen uit te voeren -
      verboden een VFR-vlucht uit te voeren beneden de volgende minimum vlieghoogtes:

      a. boven gebieden met aaneengesloten bebouwing, industrie- en havengebieden daaronder begrepen, dan wel boven
      mensenverzamelingen: tenminste 300 m (1000 voet) boven de hoogste hindernis, gelegen binnen een afstand van 600 m
      van het luchtvaartuig;

      b. elders dan [onder ][ref1] aangegeven: tenminste 150 m (500 voet) boven de grond of het water, of wel zoveel
      hoger als door Onze Minister is bepaald.

      2 Het eerste lid onder *b* geldt niet, onder nader door Onze Minister te stellen regels, voor de volgende vluchten:

      a. vluchten waarbij een sleep wordt aangehaakt of afgeworpen boven een luchtvaartterrein;

      b. vluchten waarbij stoffen ter bevordering of ter bescherming van het milieu dan wel de land-, tuin- of bosbouw,
      te bestemder plaatse worden uitgeworpen;

      c. vluchten waarbij naderingsprocedures buiten luchtvaartterreinen beoefend worden boven nader door Onze Minister
      aan te wijzen gebieden;

      d. vluchten met zweefvliegtuigen boven nader door Onze Minister aan te wijzen strand- en duingebieden.

      3 Het eerste lid onder *b* geldt niet boven nader door Onze Minister aan te wijzen routes en gebieden.

      4 De LVNL kan vrijstelling of ontheffing verlenen van het in het eerste lid gestelde verbod.

      5 Onze Minister van Defensie kan vrijstelling of ontheffing geven van het in het eerste lid gestelde verbod.

      6 Vrijstellingen en ontheffingen kunnen onder beperkingen worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel45
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '45'
        hoofdstuk: III
        paragraaf: '1'
        afdeling: '3'
  - number: '46'
    text: |-
      Onverminderd het gestelde in [artikel 11][ref1] moet een VFR-vlucht worden uitgevoerd in overeenstemming met de
      algemene vliegvoorschriften voor gecontroleerde vluchten wanneer de vlucht:

      a. wordt uitgevoerd binnen de luchtverkeersdienstverleningsgebieden met klasse B, C en D;

      b. deel uitmaakt van het terreinverkeer van een gecontroleerd luchtvaartterrein, of;

      c. wordt uitgevoerd als een bijzondere VFR-vlucht.


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel11
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '11'
        hoofdstuk: III
        afdeling: '1'
  - number: '47'
    text: |-
      1 Wanneer tijdens een gecontroleerde VFR-vlucht blijkt, dat voortzetting daarvan onder zichtweersomstandigheden
      volgens het geldend vliegplan niet uitvoerbaar is, moet worden gehandeld overeenkomstig het bepaalde in één van de
      [volgende leden van dit artikel][ref1].

      2 In de omstandigheden, als bedoeld in het eerste lid, moet, behoudens het bepaalde in de
      [volgende leden van dit artikel][ref2], een herziening van de klaring worden gevraagd, waardoor het alsnog mogelijk
      wordt om:

      a. de vlucht in zichtweersomstandigheden voort te zetten naar het luchtvaartterrein van bestemming of een
      luchtvaartterrein waarnaar wordt uitgeweken, of;

      b. het betreffende luchtverkeersleidingsgebied, waarin eveneens luchtverkeersleiding aan VFR-vluchten wordt
      gegeven, te verlaten.

      3 Indien een klaring, als bedoeld in het tweede lid, niet kan worden verkregen, moet de vlucht worden voortgezet
      onder zichtweersomstandigheden en moet de betrokken luchtverkeersleidingsdienst worden ingelicht omtrent de actie,
      die wordt ondernomen ten einde het luchtverkeersleidingsgebied, waarin eveneens luchtverkeersleiding aan VFR-
      vluchten wordt gegeven, te verlaten dan wel een landing uit te voeren op het dichtstbijzijnde daarvoor geschikte
      luchtvaartterrein.

      4 Wanneer een gecontroleerde VFR-vlucht, als bedoeld in het eerste lid, wordt uitgevoerd binnen een plaatselijk
      luchtverkeersleidingsgebied, kan toestemming worden verzocht om de vlucht te mogen voortzetten als bijzondere VFR-
      vlucht.

      5 Indien de gezagvoerder van een gecontroleerde VFR-vlucht, als bedoeld in het eerste lid, daartoe bevoegd is, kan
      hij verzoeken om de vlucht te mogen voortzetten in overeenstemming met de instrumentvliegvoorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0005775#Artikel47
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '47'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0005775
        artikel: '47'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '3'
  - number: '48'
    text: |-
      Bij het uitvoeren van een VFR-vlucht in gebieden of langs routes, als bedoeld in
      [artikel 31, tweede lid, onder ][ref1] moet:

      a. voortdurend worden geluisterd op de desbetreffende radiofrequentie van de betrokken luchtverkeersdienst die
      vluchtinformatie verstrekt;

      b. desgevraagd positiemeldingen aan die dienst worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel31
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '31'
        hoofdstuk: III
        paragraaf: '3'
        afdeling: '2'
  - number: '49'
    text: >-
      1 Bij ministeriële regeling worden regels gegeven inzake de navigatie- en telecommunicatie-installaties waarmee een
      luchtvaartuig voor het uitvoeren van een IFR-vlucht is uitgerust en de eisen waar die installaties aan voldoen.


      2 Onze Minister kan ontheffing verlenen van de krachtens het eerste lid gegeven regels.


      3 Ontheffing kan slechts verleend worden indien de navigatie- en telecommunicatieuitrusting van het luchtvaartuig
      ten minste gelijkwaardige mogelijkheden biedt voor de vluchtuitvoering.


      4 Ontheffingen kunnen onder beperkingen worden verleend.


      5 Aan ontheffingen kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel49
  - number: '50'
    text: >-
      1 De maximum toegestane vliegsnelheid in de luchtverkeersdienstverleningsgebieden met klasse D tot en met G beneden
      vliegniveau 100 bedraagt 470 km/uur (250 knopen).


      2 Het eerste lid geldt niet indien bij ministeriële regeling andere waarden zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel50
  - number: '51'
    text: |-
      1 Met uitzondering van het gestelde in het tweede lid is het - tenzij noodzakelijk om op te stijgen van of te
      landen op een luchtvaartterrein, naderings- en vertrekprocedures alsmede luchtverkeerspatronen uit te voeren -
      verboden een IFR-vlucht uit te voeren beneden de volgende minimum vlieghoogtes:

      a. boven bergachtige gebieden: tenminste 600 m (2000 voet) boven de hoogste hindernis, gelegen binnen 8 km van de
      gegiste positie van het luchtvaartuig;

      b. elders dan [onder ][ref1]. is aangegeven: tenminste 300 m (1000 voet) boven de hoogste hindernis gelegen binnen
      8 km van de gegiste positie van het luchtvaartuig.

      2 Onze Minister kan met inachtneming van luchtverkeerstechnische aspecten vrijstelling of ontheffing geven van het
      in het eerste lid gestelde verbod; vrijstellingen en ontheffingen kunnen onder beperkingen worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel51
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '51'
        hoofdstuk: III
        paragraaf: '1'
        afdeling: '4'
  - number: '52'
    text: >-
      Tijdens een IFR-vlucht moet de nadering worden uitgevoerd in overeenstemming met een bij ministeriële regeling
      vastgestelde instrumentnaderingsprocedure.
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel52
  - number: '53'
    text: >-
      1 Het is verboden af te zien van de IFR-vluchtuitvoering, tenzij zich tijdens een IFR-vlucht
      zichtweersomstandigheden voordoen, en het te voorzien is en in de bedoeling ligt dat de vlucht voor geruime tijd
      zal worden voortgezet in ononderbroken zichtweersomstandigheden.


      2 Indien onder de in het eerste lid genoemde omstandigheden wordt besloten de vlucht verder als VFR-vlucht uit te
      voeren, moet uitdrukkelijk aan de betrokken luchtverkeersleidingsdienst worden gemeld, dat wordt afgezien van de
      IFR-vluchtuitvoering, onder vermelding van de daartoe strekkende wijzigingen op het geldende vliegplan.
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel53
  - number: '54'
    text: |-
      Onverminderd het gestelde in [artikel 11][ref1] moet een IFR-vlucht worden uitgevoerd in overeenstemming
      met de algemene vliegvoorschriften voor gecontroleerde vluchten, wanneer de vlucht wordt uitgevoerd in een
      luchtverkeersdienstverleningsgebied klasse A tot en met E.


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel11
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '11'
        hoofdstuk: III
        afdeling: '1'
  - number: '55'
    text: |-
      Bij het uitvoeren van een IFR-vlucht in luchtverkeersdienstverleningsgebieden F en G en in gebieden of langs routes
      als bedoeld in [artikel 31, eerste lid, onder ][ref1] moet:

      a. voortdurend worden geluisterd op de desbetreffende radiofrequentie van de betrokken luchtverkeersdienst, die
      vluchtinformatie verstrekt;

      b. zonodig tweezijdige radioverbinding tot stand worden gebracht met die dienst, en;

      c. positiemeldingen worden verstrekt overeenkomstig het in [artikel 36][ref2] bepaalde voor gecontroleerde
      vluchten.


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0005775#Artikel36
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '31'
        hoofdstuk: III
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005775
        artikel: '36'
        hoofdstuk: III
        paragraaf: '6'
        afdeling: '2'
  - number: '56'
    text: |-
      Onze Minister kan nadere regels stellen ten aanzien van vluchten waarbij door de aard van het luchtvaartuig of
      het doel van de vlucht niet kan worden voldaan aan bij of krachtens [hoofdstuk III][ref1] van dit besluit gestelde
      regels.


      [ref1]: https://wetten.overheid.nl/BWBR0005775#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0005775
        hoofdstuk: III
  - number: '57'
    text: |-
      De ankerkabel van een zich in de lucht bevindende kabelballon, of van een aan een kabel verankerd luchtschip, moet
      - buiten de in [artikel 28, eerste lid][ref1], genoemde periode - zijn voorzien van de bij ministeriële regeling
      vastgestelde dagkenmerken.


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel28
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '28'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '2'
  - number: '58'
    text: >-
      Op een landingsterrein moet een voetganger of een bestuurder van een voertuig:


      a. vrije doorgang verlenen aan een luchtvaartuig;


      b. gevolg geven aan een aanwijzing gegeven door de exploitant en - op een gecontroleerd luchtvaartterrein - door de
      plaatselijke luchtverkeersleidingsdienst.
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel58
  - number: '59'
    text: >-
      1 Het is verboden toestellen die geen luchtvaartuigen zijn in het luchtruim te gebruiken.


      2 Het eerste lid geldt niet, overeenkomstig door Onze Minister te stellen regels, voor de volgende toestellen:


      a. modelvliegtuigen;


      b. zeilvliegtuigen;


      c. valschermzweeftoestellen;


      d. kabelvliegers;


      e. kleine ballons.


      3 De LVNL kan vrijstelling of ontheffing verlenen van het in het eerste lid gestelde verbod.


      4 Onze Minister van Defensie kan vrijstelling of ontheffing verlenen van het in het eerste lid gestelde verbod.


      5 Vrijstellingen en ontheffingen kunnen onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel59
  - number: '60'
    text: >-
      Ten behoeve van de vluchtvoorbereiding en de vluchtuitvoering verstrekt de LVNL vóór de vlucht de volgende
      luchtvaartinlichtingen:


      a. een geïntegreerd pakket luchtvaartinlichtingen bestaande uit de volgende publikaties:


      1. een luchtvaartgids;


      2. wijzigingslijsten op de luchtvaartgids;


      3. aanvullingslijsten op de luchtvaartgids;


      4. berichten aan luchtvarenden;


      5. circulaires voor de luchtvaart;


      6. mededelingen aan Nederlandse luchtvarenden en eigenaren van luchtvaartuigen;


      b. luchtvaartkaarten;


      c. luchtvaartmeteorologische inlichtingen.
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel60
  - number: '61'
    text: >-
      Met betrekking tot luchtvaartinlichtingen stelt Onze Minister van Verkeer en Waterstaat regels betreffende:


      a. de gegevens welke zij dienen te bevatten;


      b. de wijze van verstrekking;


      c. de plaatsen waar en de perioden gedurende welke zij dienen te worden verstrekt;


      d. de instanties en personen waaraan zij dienen te worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel61
  - number: '62'
    text: >-
      Abonnementen op de luchtvaartpublicaties en luchtvaartkaarten worden verstrekt tegen vergoeding van de kosten welke
      jaarlijks door de LVNL worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel62
  - number: '63'
    text: |-
