preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 17 juli 1992, nr. JBZ/L 92.007482,
    Rijksluchtvaartdienst, gedaan mede namens Onze Minister van Defensie;


    Overwegende dat het in verband met het tot stand komen van de Wet Luchtverkeer (Stb. 1992, 368) noodzakelijk is de
    regels met betrekking tot het luchtverkeer aan te passen en opnieuw vast te stellen;


    Gelet op de artikelen 7, 13 en 14 van de Wet Luchtverkeer;


    De Raad van State gehoord (advies van 1 december 1992, nr. W09.92.0347);


    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat, mede namens Onze Minister van Defensie van 11
    december 1992, nr. JBZ/L92.013025, Rijksluchtvaartdienst;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. *ACAS: Airborne Collision Avoidance System*, een systeem aan boord van een luchtvaartuig, werkend met signalen
      van transponders en onafhankelijk van installaties op de grond, dat de gezagvoerder advies geeft over mogelijk
      conflicterende luchtvaartuigen die zijn uitgerust met een transponder;

      b. alarmering: een dienstverlening met het doel de betrokken instanties te waarschuwen aangaande luchtvaartuigen
      die hulp behoeven in de vorm van opsporing en redding en deze instanties bij te staan voor zover dat vereist is;

      c. algemeen luchtverkeersleidingsgebied: een luchtverkeersleidingsgebied dat zich in opwaartse richting uitstrekt
      vanaf een vastgestelde grens boven het aardoppervlak;

      d. bijzondere VFR-vlucht: een VFR-vlucht, die overeenkomstig een klaring van een luchtverkeersleidingsdienst wordt
      uitgevoerd binnen een plaatselijk luchtverkeersleidingsgebied, onder weersomstandigheden die slechter zijn dan
      zichtweersomstandigheden;

      e. daglichtperiode: het gedeelte van het etmaal tussen vijftien minuten voor zonsopgang en vijftien minuten na
      zonsondergang zoals geldt voor de positie 52°00' N en 05°00' O op zeeniveau;

      f. gecontroleerd luchtvaartterrein: een luchtvaartterrein, waar luchtverkeersleiding wordt gegeven aan
      luchtvaartterreinverkeer;

      g. gecontroleerde vlucht: een vlucht waarvoor een klaring is vereist;

      h. geldend vliegplan: het ingediende vliegplan met inbegrip van eventuele wijzigingen veroorzaakt door daarop
      verstrekte klaringen;

      i. grondzicht: het zicht op een luchtvaartterrein, zoals bepaald door een bevoegde waarnemer of met daartoe
      bestemde apparatuur;

      j. IFR-vlucht: een vlucht waarop, naast de in [hoofdstuk III][ref1], afdeling 2, vastgestelde algemene
      vliegvoorschriften, tevens de in [afdeling 4][ref2] vastgestelde instrumentvliegvoorschriften van toepassing zijn;

      k. inhalen: een ander luchtvaartuig van achteren naderen uit een richting, die een hoek maakt van minder dan 70°
      met het vlak van symmetrie van dit luchtvaartuig;

      l. instrumentweersomstandigheden: weersomstandigheden, die zijn uitgedrukt in termen van zicht, afstand tot wolken
      en wolkenbasis en die minder zijn dan de voorgeschreven minimum waarden voor zichtweersomstandigheden;

      m. kruishoogte: een vlieghoogte, die tijdens een aanzienlijk deel van een vlucht wordt gehandhaafd;

      n. landingsterrein: het gedeelte van een luchtvaartterrein, met uitzondering van platforms, dat bestemd is voor het
      opstijgen, het landen en het taxiën van luchtvaartuigen;

      o. luchtvaartterreinverkeer: alle verkeer op het landingsterrein en alle luchtvaartuigen die zich bevinden in het
      luchtverkeerscircuit van het betrokken luchtvaartterrein dan wel dit circuit binnen vliegen of verlaten;

      p. luchtverkeersadvisering: adviezen die binnen het luchtverkeersdienstverleningsgebied klasse F worden gegeven
      met het doel, voor zover uitvoerbaar, separatie te verzekeren tussen vluchten die worden uitgevoerd volgens IFR-
      vliegplan;

      q. luchtverkeerscircuit: de voorgeschreven vliegbaan voor luchtvaartuigen, die moet worden gevolgd in de nabijheid
      van een luchtvaartterrein;

      r. luchtverkeersdienst: één of meer van de diensten, die zijn belast met het uitoefenen van de
      luchtverkeersdienstverlening, zijnde: luchtverkeersleidingsdiensten (luchtverkeersleidingscentrum, naderings- of
      plaatselijke luchtverkeersleidingsdienst), vluchtinformatiecentrum en luchtverkeersmeldingspost;

      s. luchtverkeersdienstverleningsgebieden: delen van het luchtruim met vastgestelde begrenzingen, waarvoor is
      vastgesteld welke soorten vluchten erin mogen worden uitgevoerd en welke soorten luchtverkeersdienstverlening er
      worden verstrekt, alsmede welke regels gelden voor de vluchtuitvoering;

      t. luchtverkeersinformatie: informatie verstrekt door een luchtverkeersdienst met het doel bestuurders opmerkzaam
      te maken op ander, bekend of waargenomen, luchtverkeer dat mogelijkerwijs in de nabijheid van hun positie of
      voorgenomen vliegroute verkeert, alsmede bestuurders behulpzaam te zijn bij het vermijden van botsingen;

      u. luchtverkeersleidingsgebied: een luchtverkeersdienstverleningsgebied waarbinnen luchtverkeersleiding wordt
      gegeven aan IFR-vluchten, en aan VFR-vluchten in overeenstemming met de geldende luchtruim classificatie;

      v. luchtverkeersontwijkadvies: een door een luchtverkeersdienst verstrekt advies tot het uitvoeren van bepaalde
      manoeuvres, met het doel bestuurders behulpzaam te zijn bij het vermijden van botsingen;

      w. luchtverkeersroute: een bepaalde route, vastgesteld om de verkeersstroom te kanaliseren, waar dat nodig is voor
      de verzorging van de luchtverkeersdienstverlening;

      x. meldingspunt: de geografisch bepaalde plaats, ten opzichte waarvan de positie van een luchtvaartuig kan worden
      gemeld;

      y. naderingsluchtverkeersleidingsgebied: een algemeen luchtverkeersleidingsgebied, dat doorgaans is ingesteld bij
      het kruispunt van luchtverkeersroutes gelegen in de nabijheid van één of meer luchtvaartterreinen;

      z. omschakelpunt: het punt waar een luchtvaartuig tijdens een vlucht langs een gedeelte van een luchtverkeersroute,
      dat is bepaald met betrekking tot alzijdig gerichte radiobakens werkend op zeer hoge frequenties, verwacht wordt
      - voor de primaire navigatie - om te schakelen van het baken achter het luchtvaartuig naar het volgende baken vóór
      het luchtvaartuig;

      aa. Onze Minister: Onze Minister van Verkeer en Waterstaat voor wat het burgerluchtverkeer en de algemene
      verkeersveiligheid in de lucht betreft en Onze Minister van Defensie voor wat het militaire luchtverkeer betreft;

      ab. plaatselijk luchtverkeersleidingsgebied: een luchtverkeersleidingsgebied, dat zich verticaal uitstrekt vanaf
      het aardoppervlak tot aan een vastgestelde bovengrens;

      ac. platform: een gedeelte van een luchtvaartterrein, dat bestemd is voor het opstellen van luchtvaartuigen, met
      het doel passagiers te laten in- of uitstappen, post of vracht te laden of te lossen, brandstof in te nemen, te
      parkeren of onderhoudswerkzaamheden te verrichten;

      ad. *RA: Resolution Advisory*, een door ACAS aan de gezagvoerder gegeven advies om zodanig te manoeuvreren dat een
      botsing wordt voorkomen;

      ae. *transponder*: een radarbeantwoordingssysteem met informatie over de identiteit en eventueel de hoogte van
      het luchtvaartuig;

      af. taxiën: het op eigen kracht voortbewegen van een luchtvaartuig op een luchtvaartterrein, met uitzondering van
      de start en landing, maar met inbegrip van het voortbewegen van een hefschroefvliegtuig boven een luchtvaartterrein
      binnen een hoogteband waar grond-effect wordt ondervonden en met een snelheid die vergelijkbaar is met die van
      andere taxiënde luchtvaartuigen;

      ag. uitwijkhaven: een luchtvaartterrein waarheen een vlucht kan worden vervolgd indien moet worden afgezien van
      landing op het luchtvaartterrein van bestemming;

      ah. VFR-vlucht: een vlucht waarop, naast de in [hoofdstuk III][ref3], afdeling 2, vastgestelde algemene
      vliegvoorschriften, tevens de in [afdeling 3][ref4] vastgestelde zichtvliegvoorschriften van toepassing zijn;

      ai. vlieghoogte: de hoogte van een zich in de lucht bevindend luchtvaartuig uitgedrukt in:

      1. hoogte boven het aardoppervlak

      2. hoogte boven gemiddeld zeeniveau of

      3. vliegniveau;

      aj. vliegniveau: een vlak van constante atmosferische druk in relatie tot het referentiedrukvlak van 1013.2
      hectopascals, dat van soortgelijke vlakken is gescheiden door bepaalde drukintervallen;

      ak. vliegtuig: luchtvaartuig zwaarder dan lucht en voorzien van een voortstuwingsinrichting;

      al. vliegzicht: het zicht recht vooruit waargenomen vanuit de stuurhut van een luchtvaartuig tijdens de vlucht;

      am. vluchtinformatiegebied: een luchtruimte met vastgestelde begrenzingen, waarbinnen inlichtingen tijdens de
      vlucht worden verstrekt en alarmering wordt verzorgd;

      an. vluchtinformatieverstrekking: een dienstverlening met het doel inlichtingen te geven tijdens de vlucht ten
      behoeve van een veilige en doelmatige vluchtuitvoering;

      ao. wachtpositie: een gemarkeerde positie waar taxiënde luchtvaartuigen en voertuigen verplicht kunnen worden stil
      te houden met als doel de landingsbaan vrij te houden;

      ap. wolkenbasis: de hoogte boven grond of water van de basis van de laagste wolkenlaag beneden 6000 meter (20 000
      voet) die meer dan de helft van de hemel bedekt;

      aq. zichtweersomstandigheden: weersomstandigheden, die zijn uitgedrukt in termen van zicht, afstand tot wolken en
      wolkenbasis, die gelijk zijn aan - of beter dan - voorgeschreven minimum waarden.


      [ref1]: https://wetten.overheid.nl/BWBR0005775#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0005775#HoofdstukIII
      [ref3]: https://wetten.overheid.nl/BWBR0005775#HoofdstukIII
      [ref4]: https://wetten.overheid.nl/BWBR0005775#HoofdstukIII
