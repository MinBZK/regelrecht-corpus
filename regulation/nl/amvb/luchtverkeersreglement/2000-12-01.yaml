    text: |-
      1 Van krachtens dit besluit gegeven ontheffingen wordt mededeling gedaan in de *Staatscourant*.

      2 De LVNL doet mededeling aan luchtvarenden van deze en overige krachtens dit besluit gegeven bepalingen door
      middel van de daartoe bestemde luchtvaartpublikaties als bedoeld in [artikel 60, onder ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel60
    url: https://wetten.overheid.nl/BWBR0005775/2000-12-01#Artikel64
