  - number: 158a
    text: |-
      1 Voor het aanvragen van een ontheffing van het in [artikel 14, eerste lid, van de Luchtvaartwet][ref1] vervatte
      verbod, moet tenminste 21 dagen voor de eerste dag waarop het terrein zal worden gebruikt een daartoe strekkend
      verzoekschrift worden ingediend bij Onze Minister.

      2 Bij het verzoekschrift moeten worden overlegd:

      1. een verzoek tot ontheffing;

      2. fabrikaat en type van het te gebruiken luchtvaartuig;

      3. datum/data waarop het terrein zal worden gebruikt;

      4. de reden/redenen waarom dit terrein zal worden gebruikt;

      5. de gemeente en de plaats waarin het betrokken terrein is gelegen;

      6. de afmetingen van het terrein;

      7. een duidelijke kaart waaruit de geografische ligging en de aard van de omgeving van het betrokken terrein
      duidelijk blijkt;

      8. een verklaring van geen bezwaar afgegeven door de burgemeester van de gemeente waarin het betrokken terrein
      is gelegen;

      9. een verklaring van geen bezwaar van de eigenaar danwel de zakelijk gerechtigde van het betrokken terrein;

      10. een schriftelijke verklaring van de aanvrager dat het beoogde terrein aan de gestelde criteria voor een veilig
      gebruik voldoet.

      3 Indien de ontheffing voor drie dagen of minder wordt aangevraagd, is het gestelde in het tweede lid van dit
      artikel van toepassing met dien verstande dat de verklaringen als bedoeld onder 8 en 9 tijdens het daadwerkelijke
      gebruik van het terrein ter inzage aanwezig moeten zijn.

      4 Voor het aanvragen van een ontheffing van het in [artikel 14, eerste lid, van de Luchtvaartwet][ref2] vervatte
      verbod ten behoeve van het opstijgen met een vrije bemande ballon geldt in afwijking van het gestelde in het eerste
      lid, een termijn van 14 dagen.

      5 De betaling van de krachtens artikel 159 vastgestelde vergoeding dient op de in artikel 160 aangegeven wijze te
      geschieden tenminste 21 dagen voor de eerste datum waarvoor de ontheffing wordt aangevraagd, met uitzondering van
      een aanvraag als bedoeld in het vierde lid, ten aanzien waarvan voor de betaling de termijn op 14 dagen is gesteld.

      6 Voor het aanvragen van een ontheffing van het in [artikel 31, eerste lid onder ][ref3] vervatte verbod, moet
      tenminste 21 dagen voor het begin van de periode waarvoor de aanvrage geldt een daartoe strekkend verzoekschrift
      worden ingediend bij Onze Minister. Het gestelde in het vijfde lid is van overeenkomstige toepassing.

      7 Voor het aanvragen van een ontheffing van het in [artikel 33, eerste lid onder ][ref4] vervatte verbod, moet
      tenminste 21 dagen voor het begin van de periode waarvoor de aanvrage geldt, een daartoe strekkend verzoekschrift
      worden ingediend bij Onze Minister. Het gestelde in het vijfde lid is van overeenkomstige toepassing.

      8 Artikel 158, derde lid, is van overeenkomstige toepassing.


