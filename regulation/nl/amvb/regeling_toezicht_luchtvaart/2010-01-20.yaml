  - number: '158'
    text: |-
      1 Voor het verkrijgen van toestemming tot het houden van een luchtvaartvertoning of luchtvaartwedstrijd, als
      bedoeld in [artikel 17 van de Luchtvaartwet][ref1], moet ten minste drie weken voor de dag van de vertoning of van
      de wedstrijd een daartoe strekkend verzoekschrift worden ingediend bij Onze Minister.

      Hierbij moet zijn gevoegd:

      a. een omschrijving van de vertoning of van de wedstrijd met aanduiding van het (de) te gebruiken terrein(en) en
      van de te volgen route, alsmede met vermelding in hoeverre kunstvluchten zullen plaatshebben;

      b. een verzoek om ontheffing van de verbodsbepaling van [artikel 14, lid 1, van de Luchtvaartwet][ref2], indien een
      terrein, niet zijnde luchtvaartterrein, zal worden gebruikt.

      c. een schriftelijke verklaring of verklaringen, dat tegen de te houden vertoning of wedstrijd geen bezwaar
      bestaat, welke in het geval van een vertoning dient(en) te worden afgegeven door de burgemeester(s) van de
      gemeente(n) waar deze zal worden gehouden en, in geval van een wedstrijd, door de burgemeester(s) van de
      gemeente(n) waar deze eindigt.

      2 Door Onze Minister kunnen nadere regelen worden gegeven, waaraan voldaan moet worden ter verkrijging en gebruik
      van een toestemming als bedoeld in [artikel 17 eerste lid van de Luchtvaartwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel17
