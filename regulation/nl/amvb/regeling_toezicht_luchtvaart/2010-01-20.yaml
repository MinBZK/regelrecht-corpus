  text: >-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.


    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 14 november 1958, no. Jur/15760,
    Rijksluchtvaartdienst;


    Gelet op de artikelen 4, tweede lid, onder a, 5, tweede lid, 7, eerste lid, 8, tweede lid, onder a, 9, eerste lid,
    62, derde lid, 76, eerste lid, onder a, c en f en tweede lid, onder b en c en 80, tweede lid, van de Luchtvaartwet
    (Stb. 1958, 47);


    De Raad van State gehoord (advies van 16 december 1958, no. 36);


    Gezien het nader rapport van Onze voornoemde Minister van 16 januari 1959, no. Jur/10290, Rijksluchtvaartdienst;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002309/2010-01-20#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 De begripsbepalingen, gegeven in de [Luchtvaartwet][ref1], zijn ook van toepassing op deze regeling.

      2 Voorts wordt in deze regeling verstaan onder:

      a. baan: een al dan niet verhard gedeelte van het landingsterrein, uitsluitend bestemd voor het opstijgen en/of het
      landen van luchtvaartuigen;

      b.

      c. blindvliegen, onderscheidenlijk wolkenvliegen: het besturen van een vliegtuig, onderscheidenlijk een
      zweefvliegtuig, uitsluitend met behulp van instrumenten, zonder visuele oriëntatie buiten het vliegtuig,
      onderscheidenlijk het zweefvliegtuig;

      d. bij nacht: op enig tussen zonsondergang en zonsopgang gelegen tijdstip;

      e.

      f. drempel: het begin van het voor het landen bestemde gedeelte van een verharde baan;

      g. eerste bestuurder: een lid van het stuurhutpersoneel, dat de leiding heeft bij de besturing van het
      luchtvaartuig;

      h. geregeld luchtvervoer: een reeks van verkeersvluchten, waaraan het publiek kan deelnemen en welke worden
      uitgevoerd ten behoeve van het verkeer tussen twee of meer plaatsen, hetzij in overeenstemming met een
      gepubliceerde dienstregeling, hetzij met een zodanige regelmaat of frequentie, dat zij een duidelijk herkenbare
      systematische reeks vormen;

      i. IFR-vlucht: een vlucht, ten aanzien waarvan tevens de instrumentvliegvoorschriften van toepassing zijn;

      j. instrumentenbaan: een baan, welke is uitgerust met elektronische hulpmiddelen ten dienste van het opstijgen of
      landen van luchtvaartuigen;

      k. instrumentweersomstandigheden: weersomstandigheden, die uitgedrukt in termen van zicht, afstand tot wolken en
      wolkenbasis, minder zijn dan de voorgeschreven minimum waarden voor zichtweersomstandigheden;

      l. kunstvlucht: een vlucht, waarbij met opzet bewegingen worden uitgevoerd, welke een plotselinge verandering in de
      stand, een abnormale stand of een abnormale verandering in de snelheid van het luchtvaartuig medebrengen;

      m. lid van het boordpersoneel: een lid van het stuurhutpersoneel en ieder ander, die aan boord van een
      luchtvaartuig ten behoeve van de inzittenden of de lading werkzaamheden heeft te verrichten;

      n. navigatieplan: het plan voor een veilige uitvoering van de vlucht dat ontleend is aan overwegingen van
      vliegtuigprestaties, operationele beperkingen en de verwachte omstandigheden, betrekking hebbende op de te vliegen
      route en de aan te vliegen luchtvaartterreinen;

      o. oefenvlucht: een solovlucht voor het verkrijgen dan wel behouden van vliegvaardigheid;

      p. overlandvlucht: een vlucht, waarbij een vliegtuig dan wel een zweefvliegtuig zich in rechte lijn gemeten verder
      dan 28 km, onderscheidenlijk 5 km van de grens van het terrein waarvan werd opgestegen, verwijdert;

      q. platform: een gedeelte van een luchtvaartterrein dat bestemd is voor het opstellen van luchtvaartuigen, met
      het doel passagiers te laten in- of uitstappen, post of vracht te laden of te lossen, brandstof in te nemen, te
      parkeren of onderhoudswerkzaamheden te verrichten;

      r. rondvlucht: een verkeersvlucht, welke aanvangt en eindigt op hetzelfde terrein en welke een tijdsduur heeft van
      ten hoogste 60 minuten;

      s. rijbaan: een al dan niet verhard gedeelte van het landingsterrein, bestemd voor het zich op de grond
      voortbewegen van luchtvaartuigen;

      t. strook: een gedeelte van het landingsterrein, waarin een baan is gelegen;

      u. tweede bestuurder: een lid van het stuurhutpersoneel, dat een luchtvaartuig bestuurt, anders dan als eerste
      bestuurder of als leerling;

      v. VFR-vlucht: een vlucht, ten aanzien waarvan tevens de zichtvliegvoorschriften van toepassing zijn;

      w. maximale startmassa: de massa die een luchtvaartuig mag hebben wanneer het zich van het aardoppervlak verheft;

      x. lid-staat: staat, lid van de Europese Gemeenschappen;

      ij. [verordening (EEG) 3922/91](31991R3922): verordening (EEG) van de Raad van de Europese Gemeenschappen
      van 16 december 1991 inzake de harmonisatie van technische en administratieve procedures op het gebied van de
      burgerluchtvaart ( *PbEG* L 373);

      z. JAA: Joint Aviation Authorities;

      aa. JAR: Joint Aviation Requirements;

      ab. JAR-145: regeling inzake erkenning van onderhoudsbedrijven, opgesteld door de JAA.

      3 Voor het bij deze regeling bepaalde zijn eveneens van toepassing de begripsbepalingen voor
      luchtverkeersdienstverlening, luchtverkeersdienst, verkeersleiding, verkeersleidingsdienst,
      luchtvaartterreinverkeer, gecontroleerd luchtvaartterrein, zichtweersomstandigheden,
      vlucht, vliegtijd, zonsondergang, zonsopgang, landingsterrein en taxiën als omschreven in
      [artikel 1 van het Luchtverkeersreglement][ref2]-1980 (*Stb.* 786).


