  - number: '2'
    text: >-
      De bepalingen van deze regeling gelden niet ten aanzien van militaire luchtvaartuigen, de leden van
      het boordpersoneel, passagiers en lading van deze luchtvaartuigen alsmede ten aanzien van militaire
      luchtvaartterreinen.
    url: https://wetten.overheid.nl/BWBR0002309/2010-01-20#Artikel2
