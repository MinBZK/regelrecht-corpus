---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_toezicht_luchtvaart
regulatory_layer: AMVB
publication_date: '2016-03-30'
valid_from: '2016-07-01'
bwb_id: BWBR0002309
url: https://wetten.overheid.nl/BWBR0002309/2016-07-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 14 november 1958, no. Jur/15760,
    Rijksluchtvaartdienst;

    Gelet op de artikelen 4, tweede lid, onder a, 5, tweede lid, 7, eerste lid, 8, tweede lid, onder a, 9, eerste lid,
    62, derde lid, 76, eerste lid, onder a, c en f en tweede lid, onder b en c en 80, tweede lid, van de Luchtvaartwet
    (Stb. 1958, 47);

    De Raad van State gehoord (advies van 16 december 1958, no. 36);

    Gezien het nader rapport van Onze voornoemde Minister van 16 januari 1959, no. Jur/10290, Rijksluchtvaartdienst;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002309/2016-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      De begripsbepalingen, gegeven in de [Luchtvaartwet][ref1], zijn ook van toepassing op deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0002267
    url: https://wetten.overheid.nl/BWBR0002309/2016-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002267
  - number: '1.2'
    text: 'Voorts wordt in deze regeling verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002309/2016-07-01#Artikel1
  - number: 1.2.a
    text: |-
      baan: een al dan niet verhard gedeelte van het landingsterrein, uitsluitend bestemd voor het opstijgen en/of het
      landen van luchtvaartuigen;
    url: https://wetten.overheid.nl/BWBR0002309/2016-07-01#Artikel1
  - number: 1.2.c
    text: |-
      blindvliegen, onderscheidenlijk wolkenvliegen: het besturen van een vliegtuig, onderscheidenlijk een
      zweefvliegtuig, uitsluitend met behulp van instrumenten, zonder visuele oriëntatie buiten het vliegtuig,
      onderscheidenlijk het zweefvliegtuig;
    url: https://wetten.overheid.nl/BWBR0002309/2016-07-01#Artikel1
  - number: 1.2.d
    text: 'bij nacht: op enig tussen zonsondergang en zonsopgang gelegen tijdstip;'
    url: https://wetten.overheid.nl/BWBR0002309/2016-07-01#Artikel1
  - number: 1.2.f
    text: 'drempel: het begin van het voor het landen bestemde gedeelte van een verharde baan;'
    url: https://wetten.overheid.nl/BWBR0002309/2016-07-01#Artikel1
  - number: 1.2.g
    text: 'eerste bestuurder: een lid van het stuurhutpersoneel, dat de leiding heeft bij de besturing van het luchtvaartuig;'
    url: https://wetten.overheid.nl/BWBR0002309/2016-07-01#Artikel1
  - number: 1.2.h
    text: |-
      geregeld luchtvervoer: een reeks van verkeersvluchten, waaraan het publiek kan deelnemen en welke worden uitgevoerd
      ten behoeve van het verkeer tussen twee of meer plaatsen, hetzij in overeenstemming met een gepubliceerde
      dienstregeling, hetzij met een zodanige regelmaat of frequentie, dat zij een duidelijk herkenbare systematische
      reeks vormen;
    url: https://wetten.overheid.nl/BWBR0002309/2016-07-01#Artikel1
  - number: 1.2.i
    text: 'IFR-vlucht: een vlucht, ten aanzien waarvan tevens de instrumentvliegvoorschriften van toepassing zijn;'
    url: https://wetten.overheid.nl/BWBR0002309/2016-07-01#Artikel1
  - number: 1.2.j
    text: |-
      instrumentenbaan: een baan, welke is uitgerust met elektronische hulpmiddelen ten dienste van het opstijgen of
      landen van luchtvaartuigen;
    url: https://wetten.overheid.nl/BWBR0002309/2016-07-01#Artikel1
  - number: 1.2.k
    text: |-
      instrumentweersomstandigheden: weersomstandigheden, die uitgedrukt in termen van zicht, afstand tot wolken en
      wolkenbasis, minder zijn dan de voorgeschreven minimum waarden voor zichtweersomstandigheden;
    url: https://wetten.overheid.nl/BWBR0002309/2016-07-01#Artikel1
  - number: 1.2.l
    text: |-
      kunstvlucht: een vlucht, waarbij met opzet bewegingen worden uitgevoerd, welke een plotselinge verandering in de
      stand, een abnormale stand of een abnormale verandering in de snelheid van het luchtvaartuig medebrengen;
    url: https://wetten.overheid.nl/BWBR0002309/2016-07-01#Artikel1
  - number: 1.2.m
    text: |-
      lid van het boordpersoneel: een lid van het stuurhutpersoneel en ieder ander, die aan boord van een luchtvaartuig
      ten behoeve van de inzittenden of de lading werkzaamheden heeft te verrichten;
    url: https://wetten.overheid.nl/BWBR0002309/2016-07-01#Artikel1
  - number: 1.2.n
    text: |-
      navigatieplan: het plan voor een veilige uitvoering van de vlucht dat ontleend is aan overwegingen van
      vliegtuigprestaties, operationele beperkingen en de verwachte omstandigheden, betrekking hebbende op de te vliegen
      route en de aan te vliegen luchtvaartterreinen;
    url: https://wetten.overheid.nl/BWBR0002309/2016-07-01#Artikel1
  - number: 1.2.o
    text: 'oefenvlucht: een solovlucht voor het verkrijgen dan wel behouden van vliegvaardigheid;'
    url: https://wetten.overheid.nl/BWBR0002309/2016-07-01#Artikel1
  - number: 1.2.p
    text: |-
      overlandvlucht: een vlucht, waarbij een vliegtuig dan wel een zweefvliegtuig zich in rechte lijn gemeten verder dan
      28 km, onderscheidenlijk 5 km van de grens van het terrein waarvan werd opgestegen, verwijdert;
    url: https://wetten.overheid.nl/BWBR0002309/2016-07-01#Artikel1
  - number: 1.2.q
    text: |-
      platform: een gedeelte van een luchtvaartterrein dat bestemd is voor het opstellen van luchtvaartuigen, met
      het doel passagiers te laten in- of uitstappen, post of vracht te laden of te lossen, brandstof in te nemen, te
      parkeren of onderhoudswerkzaamheden te verrichten;
    url: https://wetten.overheid.nl/BWBR0002309/2016-07-01#Artikel1
  - number: 1.2.r
    text: |-
      rondvlucht: een verkeersvlucht, welke aanvangt en eindigt op hetzelfde terrein en welke een tijdsduur heeft van ten
      hoogste 60 minuten;
    url: https://wetten.overheid.nl/BWBR0002309/2016-07-01#Artikel1
  - number: 1.2.s
    text: |-
      rijbaan: een al dan niet verhard gedeelte van het landingsterrein, bestemd voor het zich op de grond voortbewegen
      van luchtvaartuigen;
    url: https://wetten.overheid.nl/BWBR0002309/2016-07-01#Artikel1
  - number: 1.2.t
    text: 'strook: een gedeelte van het landingsterrein, waarin een baan is gelegen;'
    url: https://wetten.overheid.nl/BWBR0002309/2016-07-01#Artikel1
  - number: 1.2.u
    text: |-
      tweede bestuurder: een lid van het stuurhutpersoneel, dat een luchtvaartuig bestuurt, anders dan als eerste
      bestuurder of als leerling;
    url: https://wetten.overheid.nl/BWBR0002309/2016-07-01#Artikel1
  - number: 1.2.v
    text: 'VFR-vlucht: een vlucht, ten aanzien waarvan tevens de zichtvliegvoorschriften van toepassing zijn;'
    url: https://wetten.overheid.nl/BWBR0002309/2016-07-01#Artikel1
  - number: 1.2.w
    text: 'maximale startmassa: de massa die een luchtvaartuig mag hebben wanneer het zich van het aardoppervlak verheft;'
    url: https://wetten.overheid.nl/BWBR0002309/2016-07-01#Artikel1
  - number: 1.2.x
    text: 'lid-staat: staat, lid van de Europese Gemeenschappen;'
    url: https://wetten.overheid.nl/BWBR0002309/2016-07-01#Artikel1
  - number: 1.2.ij
    text: |-
      [verordening (EEG) 3922/91](31991R3922): verordening (EEG) van de Raad van de Europese Gemeenschappen van
      16 december 1991 inzake de harmonisatie van technische en administratieve procedures op het gebied van de
      burgerluchtvaart ( *PbEG* L 373);
    url: https://wetten.overheid.nl/BWBR0002309/2016-07-01#Artikel1
  - number: 1.2.z
    text: 'JAA: Joint Aviation Authorities;'
    url: https://wetten.overheid.nl/BWBR0002309/2016-07-01#Artikel1
  - number: 1.2.aa
    text: 'JAR: Joint Aviation Requirements;'
    url: https://wetten.overheid.nl/BWBR0002309/2016-07-01#Artikel1
  - number: 1.2.ab
    text: 'JAR-145: regeling inzake erkenning van onderhoudsbedrijven, opgesteld door de JAA.'
    url: https://wetten.overheid.nl/BWBR0002309/2016-07-01#Artikel1
  - number: '1.3'
    text: |-
      Voor het bij deze regeling bepaalde zijn eveneens van toepassing de begripsbepalingen voor
      luchtverkeersdienstverlening, luchtverkeersdienst, verkeersleiding, verkeersleidingsdienst,
      luchtvaartterreinverkeer, gecontroleerd luchtvaartterrein, zichtweersomstandigheden, vlucht, vliegtijd,
      zonsondergang, zonsopgang, landingsterrein en taxiën als omschreven in uitvoeringsverordening (EU) nr. 923/2012
      van de Commissie van 26 september 2012 tot vaststelling van gemeenschappelijke luchtverkeersregels en operationele
      bepalingen betreffende luchtvaartnavigatiediensten en -procedures en tot wijziging van uitvoeringsverordening (EU)
      nr. 1035/2011 en verordeningen (EG) nr. 1265/2007, (EG) 1794/2006, (EG) nr. 730/2006, (EG) nr. 1033/2006 en (EU)
      nr. 255/2010 (PbEU 2012, L281) en het [Besluit luchtverkeer 2014](onbekend)-1980 (*Stb.* 786).
    url: https://wetten.overheid.nl/BWBR0002309/2016-07-01#Artikel1
  - number: '2'
    text: |-
      De bepalingen van deze regeling gelden niet ten aanzien van militaire luchtvaartuigen, de leden van
      het boordpersoneel, passagiers en lading van deze luchtvaartuigen alsmede ten aanzien van militaire
      luchtvaartterreinen.
    url: https://wetten.overheid.nl/BWBR0002309/2016-07-01#Artikel2
  - number: '96.4'
    text: Een passagier is verplicht de tijdens de vlucht door of namens de gezagvoerder gegeven aanwijzingen op te volgen.
    url: https://wetten.overheid.nl/BWBR0002309/2016-07-01#Artikel96
  - number: '158.1'
    text: |-
      Voor het verkrijgen van toestemming tot het houden van een luchtvaartvertoning of luchtvaartwedstrijd, als bedoeld
      in [artikel 17 van de Luchtvaartwet][ref1], moet ten minste drie weken voor de dag van de vertoning of van de
      wedstrijd een daartoe strekkend verzoekschrift worden ingediend bij Onze Minister. Hierbij moet zijn gevoegd:


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel17
    url: https://wetten.overheid.nl/BWBR0002309/2016-07-01#Artikel158
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '17'
  - number: 158.1.a
    text: |-
      een omschrijving van de vertoning of van de wedstrijd met aanduiding van het (de) te gebruiken terrein(en) en van
      de te volgen route, alsmede met vermelding in hoeverre kunstvluchten zullen plaatshebben;
    url: https://wetten.overheid.nl/BWBR0002309/2016-07-01#Artikel158
  - number: 158.1.b
    text: |-
      een verzoek om een ontheffing van de verbodsbepaling van [artikel 8.1a, eerste lid, Wet luchtvaart][ref1], indien
      een terrein, niet zijnde een luchthaven, zal worden gebruikt;


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0002309/2016-07-01#Artikel158
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
  - number: 158.1.c
    text: |-
      een schriftelijke verklaring van de burgemeester van elke gemeente waar de vertoning of de wedstrijd zal worden
      gehouden, dat daartegen geen bezwaar bestaat.
    url: https://wetten.overheid.nl/BWBR0002309/2016-07-01#Artikel158
  - number: '158.2'
    text: |-
      Door Onze Minister kunnen nadere regelen worden gegeven, waaraan voldaan moet worden ter verkrijging en gebruik van
      een toestemming als bedoeld in [artikel 17 eerste lid van de Luchtvaartwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel17
    url: https://wetten.overheid.nl/BWBR0002309/2016-07-01#Artikel158
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '17'
  - number: '159.1'
    text: |-
      Onze Minister wijst de werkzaamheden en dienstverleningen, verbonden aan de toepassing van de bepalingen van
      de [Luchtvaartwet][ref1] en zijn uitvoeringsmaatregelen, aan, voor het verrichten waarvan een vergoeding van de
      daarmee voor de overheid verband houdende kosten verschuldigd is door belanghebbende en stelt de verschuldigde
      vergoeding vast.


      [ref1]: https://wetten.overheid.nl/BWBR0002267
    url: https://wetten.overheid.nl/BWBR0002309/2016-07-01#Artikel159
    references:
      - id: ref1
        bwb_id: BWBR0002267
  - number: '159.2'
    text: |-
      Voor een keuring onderscheidenlijk een herkeuring is een vergoeding verschuldigd, welke wordt berekend naar een
      door de arts als bedoeld in artikel 32, tweede lid, onderscheidenlijk de herkeuringscommissie als bedoeld in
      artikel 33 vastgesteld tarief. Dit tarief behoeft de instemming van Onze Minister. Indien uit de uitslag van
      de herkeuring blijkt, dat de aanvrager terecht tegen de uitslag van de keuring in beroep is gegaan, zal hem het
      voor de herkeuring gestorte bedrag worden terugbetaald. Voor de keuring als bedoeld in artikel 27, eerste lid is
      geen vergoeding verschuldigd. Voor een geldigverklaring van een reeds met gunstige uitslag ondergane militaire
      vliegmedische keuring of een keuring ondergaan als lid van het stuurhutpersoneel van een burgerlijk vliegtuig in
      een Staat, welke is aangesloten bij de Internationale Burgerluchtvaart Organisatie, is een vergoeding verschuldigd,
      welke wordt berekend naar een door de bovenbedoelde arts vastgesteld tarief. Dit tarief behoeft de instemming van
      Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002309/2016-07-01#Artikel159
  - number: '160.1'
    text: |-
      De beslissing op een aanvraag voor de toepassing van een of meer van de in het eerste lid van het vorige artikel
      bedoelde bepalingen wordt in het algemeen niet genomen, indien niet is gebleken dat de verschuldigde vergoeding
      is betaald.
    url: https://wetten.overheid.nl/BWBR0002309/2016-07-01#Artikel160
  - number: '160.2'
    text: Onze Minister stelt de wijze van betaling van de verschuldigde vergoedingen vast.
    url: https://wetten.overheid.nl/BWBR0002309/2016-07-01#Artikel160
  - number: '160.3'
    text: |-
      Wanneer na de betaling van de verschuldigde vergoeding degene, die een aanvraag als bedoeld in het eerste lid van
      dit artikel heeft ingediend, verzoekt die aanvraag als niet ingediend te beschouwen, kan hem op zijn verzoek een
      nader door Onze Minister in elk geval afzonderlijk te bepalen bedrag worden terugbetaald.
    url: https://wetten.overheid.nl/BWBR0002309/2016-07-01#Artikel160
  - number: '160.4'
    text: |-
      Indien de verlenging van de termijn van geldigheid van een ontheffing binnen twee weken voor de datum van afloop
      van geldigheid is aangevraagd, is de vergoeding niet opnieuw verschuldigd.
    url: https://wetten.overheid.nl/BWBR0002309/2016-07-01#Artikel160
  - number: '166'
    text: |-
      Overtreding van [artikel 96, vierde lid][ref1], is een strafbaar feit als bedoeld in
      [artikel 62, derde lid, van de Luchtvaartwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002309#Artikel96
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel62
    url: https://wetten.overheid.nl/BWBR0002309/2016-07-01#Artikel166
    references:
      - id: ref1
        bwb_id: BWBR0002309
        artikel: '96'
        hoofdstuk: V
        afdeling: I
      - id: ref2
        bwb_id: BWBR0002267
        artikel: '62'
  - number: '167'
    text: |-
      De vóór de inwerkingtreding van dit besluit door Onze Minister afgegeven bewijzen van inschrijving, van
      luchtwaardigheid, van geschiktheid, van gelijkstelling en van deugdelijkheid treden in de plaats van de
      overeenkomstige in dit besluit vermelde bewijzen. Voor bewijzen, waarvan het model afwijkt van de bedoelde
      overeenkomstige bewijzen, geschiedt dit slechts voor de duur van ten hoogste zes maanden. In deze periode worden
      de bewijzen van afwijkend model door Onze Minister vervangen door overeenkomstige in dit besluit vermelde bewijzen
      zonder dat daarbij enige kosten in rekening worden gebracht.
    url: https://wetten.overheid.nl/BWBR0002309/2016-07-01#Artikel167
  - number: '168'
    text: Deze regeling kan worden aangehaald onder de titel "Regeling Toezicht Luchtvaart" of "R.T.L.".
    url: https://wetten.overheid.nl/BWBR0002309/2016-07-01#Artikel168
  - number: '169'
    text: Het Koninklijk besluit van 6 december 1928, *Stb.* 454 (Regeling Toezicht Luchtvaart), wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002309/2016-07-01#Artikel169
  - number: '170'
    text: |-
      Dit besluit treedt in werking op het tijdstip, waarop de [Luchtvaartwet][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0002267
    url: https://wetten.overheid.nl/BWBR0002309/2016-07-01#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0002267
