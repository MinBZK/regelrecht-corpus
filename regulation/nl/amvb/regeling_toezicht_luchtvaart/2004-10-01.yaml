---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_toezicht_luchtvaart
regulatory_layer: AMVB
publication_date: '2016-03-30'
valid_from: '2004-10-01'
bwb_id: BWBR0002309
url: https://wetten.overheid.nl/BWBR0002309/2004-10-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 14 november 1958, no. Jur/15760,
    Rijksluchtvaartdienst;

    Gelet op de artikelen 4, tweede lid, onder a, 5, tweede lid, 7, eerste lid, 8, tweede lid, onder a, 9, eerste lid,
    62, derde lid, 76, eerste lid, onder a, c en f en tweede lid, onder b en c en 80, tweede lid, van de Luchtvaartwet
    (Stb. 1958, 47);

    De Raad van State gehoord (advies van 16 december 1958, no. 36);

    Gezien het nader rapport van Onze voornoemde Minister van 16 januari 1959, no. Jur/10290, Rijksluchtvaartdienst;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      De begripsbepalingen, gegeven in de [Luchtvaartwet][ref1], zijn ook van toepassing op deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0002267
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002267
  - number: '1.2'
    text: 'Voorts wordt in deze regeling verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel1
  - number: 1.2.a
    text: |-
      baan: een al dan niet verhard gedeelte van het landingsterrein, uitsluitend bestemd voor het opstijgen en/of het
      landen van luchtvaartuigen;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel1
  - number: 1.2.c
    text: |-
      blindvliegen, onderscheidenlijk wolkenvliegen: het besturen van een vliegtuig, onderscheidenlijk een
      zweefvliegtuig, uitsluitend met behulp van instrumenten, zonder visuele oriëntatie buiten het vliegtuig,
      onderscheidenlijk het zweefvliegtuig;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel1
  - number: 1.2.d
    text: 'bij nacht: op enig tussen zonsondergang en zonsopgang gelegen tijdstip;'
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel1
  - number: 1.2.f
    text: 'drempel: het begin van het voor het landen bestemde gedeelte van een verharde baan;'
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel1
  - number: 1.2.g
    text: 'eerste bestuurder: een lid van het stuurhutpersoneel, dat de leiding heeft bij de besturing van het luchtvaartuig;'
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel1
  - number: 1.2.h
    text: |-
      geregeld luchtvervoer: een reeks van verkeersvluchten, waaraan het publiek kan deelnemen en welke worden uitgevoerd
      ten behoeve van het verkeer tussen twee of meer plaatsen, hetzij in overeenstemming met een gepubliceerde
      dienstregeling, hetzij met een zodanige regelmaat of frequentie, dat zij een duidelijk herkenbare systematische
      reeks vormen;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel1
  - number: 1.2.i
    text: 'IFR-vlucht: een vlucht, ten aanzien waarvan tevens de instrumentvliegvoorschriften van toepassing zijn;'
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel1
  - number: 1.2.j
    text: |-
      instrumentenbaan: een baan, welke is uitgerust met elektronische hulpmiddelen ten dienste van het opstijgen of
      landen van luchtvaartuigen;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel1
  - number: 1.2.k
    text: |-
      instrumentweersomstandigheden: weersomstandigheden, die uitgedrukt in termen van zicht, afstand tot wolken en
      wolkenbasis, minder zijn dan de voorgeschreven minimum waarden voor zichtweersomstandigheden;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel1
  - number: 1.2.l
    text: |-
      kunstvlucht: een vlucht, waarbij met opzet bewegingen worden uitgevoerd, welke een plotselinge verandering in de
      stand, een abnormale stand of een abnormale verandering in de snelheid van het luchtvaartuig medebrengen;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel1
  - number: 1.2.m
    text: |-
      lid van het boordpersoneel: een lid van het stuurhutpersoneel en ieder ander, die aan boord van een luchtvaartuig
      ten behoeve van de inzittenden of de lading werkzaamheden heeft te verrichten;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel1
  - number: 1.2.n
    text: |-
      navigatieplan: het plan voor een veilige uitvoering van de vlucht dat ontleend is aan overwegingen van
      vliegtuigprestaties, operationele beperkingen en de verwachte omstandigheden, betrekking hebbende op de te vliegen
      route en de aan te vliegen luchtvaartterreinen;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel1
  - number: 1.2.o
    text: 'oefenvlucht: een solovlucht voor het verkrijgen dan wel behouden van vliegvaardigheid;'
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel1
  - number: 1.2.p
    text: |-
      overlandvlucht: een vlucht, waarbij een vliegtuig dan wel een zweefvliegtuig zich in rechte lijn gemeten verder dan
      28 km, onderscheidenlijk 5 km van de grens van het terrein waarvan werd opgestegen, verwijdert;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel1
  - number: 1.2.q
    text: |-
      platform: een gedeelte van een luchtvaartterrein dat bestemd is voor het opstellen van luchtvaartuigen, met
      het doel passagiers te laten in- of uitstappen, post of vracht te laden of te lossen, brandstof in te nemen, te
      parkeren of onderhoudswerkzaamheden te verrichten;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel1
  - number: 1.2.r
    text: |-
      rondvlucht: een verkeersvlucht, welke aanvangt en eindigt op hetzelfde terrein en welke een tijdsduur heeft van ten
      hoogste 60 minuten;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel1
  - number: 1.2.s
    text: |-
      rijbaan: een al dan niet verhard gedeelte van het landingsterrein, bestemd voor het zich op de grond voortbewegen
      van luchtvaartuigen;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel1
  - number: 1.2.t
    text: 'strook: een gedeelte van het landingsterrein, waarin een baan is gelegen;'
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel1
  - number: 1.2.u
    text: |-
      tweede bestuurder: een lid van het stuurhutpersoneel, dat een luchtvaartuig bestuurt, anders dan als eerste
      bestuurder of als leerling;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel1
  - number: 1.2.v
    text: 'VFR-vlucht: een vlucht, ten aanzien waarvan tevens de zichtvliegvoorschriften van toepassing zijn;'
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel1
  - number: 1.2.w
    text: 'maximale startmassa: de massa die een luchtvaartuig mag hebben wanneer het zich van het aardoppervlak verheft;'
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel1
  - number: 1.2.x
    text: 'lid-staat: staat, lid van de Europese Gemeenschappen;'
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel1
  - number: 1.2.ij
    text: |-
      [verordening (EEG) 3922/91](31991R3922): verordening (EEG) van de Raad van de Europese Gemeenschappen van
      16 december 1991 inzake de harmonisatie van technische en administratieve procedures op het gebied van de
      burgerluchtvaart ( *PbEG* L 373);
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel1
  - number: 1.2.z
    text: 'JAA: Joint Aviation Authorities;'
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel1
  - number: 1.2.aa
    text: 'JAR: Joint Aviation Requirements;'
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel1
  - number: 1.2.ab
    text: 'JAR-145: regeling inzake erkenning van onderhoudsbedrijven, opgesteld door de JAA.'
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel1
  - number: '1.3'
    text: |-
      Voor het bij deze regeling bepaalde zijn eveneens van toepassing de begripsbepalingen voor
      luchtverkeersdienstverlening, luchtverkeersdienst, verkeersleiding, verkeersleidingsdienst,
      luchtvaartterreinverkeer, gecontroleerd luchtvaartterrein, zichtweersomstandigheden,
      vlucht, vliegtijd, zonsondergang, zonsopgang, landingsterrein en taxiën als omschreven in
      [artikel 1 van het Luchtverkeersreglement][ref1]-1980 (*Stb.* 786).


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel1
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '1'
  - number: '2'
    text: |-
      De bepalingen van deze regeling gelden niet ten aanzien van militaire luchtvaartuigen, de leden van
      het boordpersoneel, passagiers en lading van deze luchtvaartuigen alsmede ten aanzien van militaire
      luchtvaartterreinen.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel2
  - number: '94'
    text: 'De bij of krachtens dit hoofdstuk vastgestelde bepalingen zijn van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel94
  - number: 94.a
    text: |-
      Nederlandse luchtvaartuigen waar zij zich ook bevinden, voor zover deze bepalingen niet in strijd zijn met de
      wetgeving van het gebied waar het luchtvaartuig zich bevindt;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel94
  - number: 94.b
    text: buitenlandse luchtvaartuigen binnen Nederland, waar dit uitdrukkelijk is voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel94
  - number: '95.1'
    text: |-
      Indien het stuurhutpersoneel van een luchtvaartuig uit meer dan één lid bestaat, moet de houder een bestuurder,
      die bevoegd is aan boord van dit luchtvaartuig dienst te doen als eerste bestuurder, aanwijzen als gezagvoerder.
      Hij moet hiervan vóór de aanvang van elke vlucht aantekening stellen dan wel doen stellen in het journaal als
      bedoeld in artikel 101. Wijzigingen in de gezagvoering tijdens de vlucht moeten eveneens in het journaal worden
      aangetekend.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel95
  - number: '95.2'
    text: |-
      Houder in de zin van dit artikel is hij, die recht van gebruik heeft van een luchtvaartuig anders dan ingevolge een
      hem in dienstverband verstrekte opdracht.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel95
  - number: '95.3'
    text: |-
      Het is verboden zich tijdens de vlucht als lid van het stuurhutpersoneel aan boord van een luchtvaartuig te
      bevinden, indien niet aan het bepaalde in het eerste lid is voldaan.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel95
  - number: '96.1'
    text: |-
      De gezagvoerder is gedurende de vlucht van het luchtvaartuig verantwoordelijk voor de vluchtuitvoering en voor de
      veiligheid van het luchtvaartuig en de inzittenden daarvan.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel96
  - number: '96.2'
    text: |-
      Hij is bevoegd de nodige maatregelen te nemen ter waarborging van de veiligheid van de vlucht, alsmede tot het
      nemen van alle redelijke maatregelen, vrijheidsbeperking daaronder begrepen, ter verzekering van de orde en
      discipline aan boord en om hem in staat te stellen personen die de orde aan boord verstoren of de veiligheid van de
      vlucht in gevaar brengen aan de bevoegde autoriteiten over te dragen.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel96
  - number: '96.3'
    text: De gezagvoerder moet zorg dragen dat
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel96
  - number: 96.3.a
    text: |-
      tijdens de start en de landing ieder lid van het stuurhutpersoneel, dat betrokken is bij de bediening van een
      luchtvaartuig, zich op zijn post in de stuurhut bevindt;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel96
  - number: 96.3.b
    text: |-
      tijdens de start en de landing alle inzittenden het (de) voor hen bestemde veiligheidstuig (veiligheidsgordel)
      hebben omgegord;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel96
  - number: 96.3.c
    text: |-
      tijdens de vlucht ieder lid van het stuurhutpersoneel, dat betrokken is bij de bediening van een luchtvaartuig,
      zich op zijn post in de stuurhut bevindt, behalve wanneer zijn afwezigheid noodzakelijk is in verband met de
      uitvoering van taken ten behoeve van de vluchtuitvoering of voor persoonlijke verzorging.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel96
  - number: 96.3.d
    text: |-
      zij, die zich tijdens de vlucht op een bestuurderszitplaats of op een zitplaats voor de boordwerktuigkundige
      bevinden, het (de) voor die zitplaats bestemde veiligheidstuig (veiligheidsgordel) hebben omgegord;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel96
  - number: 96.3.e
    text: |-
      indien zulks op grond van bijzondere omstandigheden als turbulentie of noodtoestand gedurende een vlucht
      noodzakelijk wordt geacht, alle door de eigenaar of houder in desbetreffende instructies aangewezen personen van
      het boordpersoneel het (de) voor hen bestemde veiligheidstuig (-gordel) hebben omgegord.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel96
  - number: '96.4'
    text: Een passagier is verplicht de tijdens de vlucht door of namens de gezagvoerder gegeven aanwijzingen op te volgen.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel96
  - number: '96.5'
    text: |-
      In een noodtoestand tijdens de vlucht is de gezagvoerder verplicht ervoor te zorgen, dat de passagiers worden
      ingelicht hoe te handelen.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel96
  - number: '96.6'
    text: |-
      Het bepaalde in het derde lid, onder *b*, geldt niet, indien en voor zover door Onze Minister ontheffing is
      verleend.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel96
  - number: '97.1'
    text: |-
      Het is verboden in een luchtvaartuig personen te vervoeren of te doen vervoeren , die kennelijk gevaarlijk zijn
      voor de veiligheid of gezondheid van de overige inzittenden, tenzij zodanige personen onder toezicht staan van
      deskundige begeleiders en de voor de veiligheid en de gezondheid vereiste voorzorgen in acht worden genomen.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel97
  - number: '97.2'
    text: |-
      Wanneer in een luchtvaartuig personen als bedoeld in het eerste lid worden vervoerd is de houder of de eigenaar van
      het luchtvaartuig verplicht er zorg voor te dragen, dat zulks voor de aanvang van de vlucht op duidelijke wijze ter
      kennis van de gezagvoerder wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel97
  - number: '98.1'
    text: |-
      De gezagvoerder van een luchtvaartuig is verplicht ervoor te zorgen dat bij elke vlucht het volgende wordt
      meegevoerd:
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel98
  - number: 98.1.a
    text: |-
      het bewijs van inschrijving als bedoeld in [artikel 5 van de Luchtvaartwet][ref1], behoudens in gevallen als
      bedoeld in [artikel 4, tweede lid onder ][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel4
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: '4'
  - number: 98.1.b
    text: |-
      het bewijs van luchtwaardigheid of van gelijkstelling als bedoeld in [artikel 7 van de Luchtvaartwet][ref1],
      behoudens in gevallen als bedoeld in [artikel 4, tweede lid onder ][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel4
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: '4'
  - number: 98.1.c
    text: |-
      de op het luchtvaartuig betrekking hebbende gebruiksbeperkingen, gebruiksaanwijzingen en gebruiksgegevens in een
      vorm die de instemming heeft van Onze Minister of in de vorm van een vlieghandboek dat de instemming heeft van
      Onze Minister;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel98
  - number: 98.1.d
    text: |-
      het bewijs van bevoegdheid of van gelijkstelling als bedoeld in [artikel 9 van de Luchtvaartwet][ref1] van ieder
      lid van het stuurhutpersoneel van het luchtvaartuig;


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel9
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '9'
  - number: 98.1.e
    text: het journaal als bedoeld in het tweede lid;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel98
  - number: 98.1.f
    text: |-
      indien het luchtvaartuig is voorzien van (een) radio-elektrische zendinrichting(en) zoals bedoeld in artikel
      3*ter*, eerste lid, van de Telegraaf- en Telefoonwet 1904 (*Stb.*nr. 7) zoals sedertdien gewijzigd: een bewijs van
      zendmachtiging, waarop is vermeld dat degene op wiens naam het luchtvaartuig is ingeschreven in het bezit is van de
      machtiging voor de aanleg, het aanwezig hebben en gebruik van die inrichting(en).
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel98
  - number: '98.2'
    text: |-
      De gezagvoerder van een luchtvaartuig is verplicht een journaal te houden of te doen houden door een lid van het
      stuurhutpersoneel, waarin bijzonderheden omtrent elke vlucht met het luchtvaartuig moeten worden opgenomen. Ten
      aanzien van een Nederlands luchtvaartuig geschiedt dit tijdens of dadelijk na afloop van elke vlucht in daartoe
      bestemde boeken of op daartoe bestemde formulieren, met de modellen waarvan Onze Minister heeft ingestemd, en met
      inachtneming van de door Onze Minister te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel98
  - number: '98.3'
    text: 'De gezagvoerder van een luchtvaartuig is verplicht ervoor te zorgen, dat bij elke internationale verkeersvlucht:'
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel98
  - number: 98.3.a
    text: |-
      wordt medegevoerd een exemplaar van de laatste voor het betrokken luchtvaartuig opgestelde onderhoudsverklaring als
      bedoeld in artikel 88, vierde lid onder a;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel98
  - number: 98.3.b
    text: |-
      waarbij het luchtvaartuig lading vervoert, in het luchtvaartuig een manifest en waar nodig een gespecificeerde
      verklaring omtrent die lading aanwezig is.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel98
  - number: '98.4'
    text: |-
      Door Onze Minister kunnen nadere aanwijzingen omtrent de vorm en inhoud van de in het derde lid onder *b*
      voorgeschreven documenten worden gegeven.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel98
  - number: '99'
    text: |-
      De gezagvoerder of de houder van een luchtvaartuig is verplicht Onze Minister, zo nodig door tussenkomst van
      de politie of de Koninklijke marechaussee, zo spoedig mogelijk in kennis te stellen of te doen stellen van enig
      ongeval met het luchtvaartuig, dat verwonding of dood van een of meer personen dan wel belangrijke schade aan het
      luchtvaartuig of aan eigendommen van derden tengevolge heeft gehad.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel99
  - number: '101.1'
    text: |-
      De gezagvoerder is verplicht om tijdens de vlucht waargenomen omstandigheden, welke gevaar voor de
      luchtvaart opleveren, zo spoedig mogelijk te melden of te doen melden aan de daarvoor in aanmerking komende
      luchtvaartautoriteiten. Deze meldingen moeten die gegevens inhouden, welke van belang kunnen zijn voor de
      veiligheid van andere luchtvaartuigen.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel101
  - number: '101.2'
    text: |-
      Indien een noodtoestand enig lid van het boordpersoneel noopt tot handelingen, die inbreuk maken op plaatselijke
      voorschriften en regelingen, is de gezagvoerder verplicht de daarvoor aangewezen autoriteiten van de Staat, binnen
      welks gebied het voorval plaats heeft, hiervan onverwijld op de hoogte te stellen. De gezagvoerder is verplicht zo
      spoedig mogelijk een rapport betreffende het voorval over te leggen aan de bedoelde autoriteiten, indien deze zulks
      verzoeken. In dat geval moet de gezagvoerder eveneens een rapport overleggen aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel101
  - number: '101.3'
    text: |-
      In geval van wederrechtelijke inmenging in de vluchtuitvoering is de gezagvoerder verplicht hiervan onverwijld bij
      Onze Minister een rapport in te dienen.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel101
  - number: '102.1'
    text: |-
      Met het toezicht op de naleving van de bij of krachtens dit hoofdstuk gestelde voorschriften zijn tijdens de
      vluchtvoorbereiding, de vlucht en de vluchtafhandeling belast de bij besluit van Onze Minister aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel102
  - number: '102.2'
    text: |-
      Bij ministeriële regeling worden nadere voorschriften gegeven voor het aan boord van het luchtvaartuig toelaten
      van toezichthouders.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel102
  - number: 102a
    text: |-
      De uitvoering van vluchten mag slechts geschieden met inachtneming van de op het betrokken luchtvaartuig betrekking
      hebbende gebruiksbeperkingen.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel102a
  - number: 102b
    text: |-
      In bijzondere gevallen kan, onder voorwaarden als voor elk geval afzonderlijk te bepalen, afwijking van de bij of
      krachtens dit Hoofdstuk gestelde regelen door Onze Minister worden toegestaan.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel102b
  - number: '103'
    text: |-
      De artikelen 104 t/m 111 van deze afdeling gelden uitsluitend ten aanzien van verkeersvluchten, met uitzondering
      van rondvluchten. De voorschriften, gegeven in afdeling I van dit Hoofdstuk, zijn onverminderd van toepassing.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel103
  - number: '104.1'
    text: |-
      Onverminderd het bepaalde in [artikel 16 van de Luchtvaartwet][ref1] is de luchtvaartmaatschappij verplicht aan te
      tonen, dat het luchtvervoer op veilige wijze zal worden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel16
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '16'
  - number: '104.2'
    text: |-
      Indien aan het gestelde in het eerste lid is voldaan, zal door Onze Minister een vergunning tot vluchtuitvoering
      worden afgegeven.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel104
  - number: '104.3'
    text: |-
      De uitvoering van vluchten waartoe een vergunning als bedoeld in [artikel 16 van de Luchtvaartwet][ref1] is
      vereist, mag slechts geschieden krachtens de in het vorige lid genoemde vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel16
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '16'
  - number: '104.5'
    text: Door Onze Minister worden regelen gesteld met betrekking tot de uitvoering van het in dit artikel gestelde.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel104
  - number: '105'
    text: |-
      Door Onze Minister worden regelen gesteld ten aanzien van de voorbereiding en uitvoering van vluchten met
      inbegrip van regelen voor de instrumenten, uitrustingsstukken en installaties, welke naar gelang het type van het
      luchtvaartuig, de aard van de vlucht, en de omstandigheden, waaronder de vlucht wordt uitgevoerd, aan boord van het
      luchtvaartuig aanwezig en voor het gebruik gereed moeten zijn.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel105
  - number: '106'
    text: |-
      De leden van het stuurhutpersoneel, die werkzaamheden verrichten welke nodig zijn voor het uitvoeren van de vlucht,
      moeten voortdurend gebruik maken van ademhalingszuurstof, wanneer zij in de omstandigheden verkeren, waarvoor
      krachtens de ingevolge artikel 105 gestelde regelen voor hen ademhalingszuurstof aan boord aanwezig moet zijn.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel106
  - number: '107'
    text: |-
      De gezagvoerder moet zorg dragen dat voor zover dit mogelijk is, gevolg wordt gegeven aan verzoeken van de
      meteorologische dienst om op aangegeven tijden of posities de tijdens de vlucht waargenomen meteorologische
      omstandigheden te rapporteren.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel107
  - number: '108.1'
    text: |-
      Door Onze Minister kunnen nadere regelen worden gesteld ten aanzien van de samenstelling en bevoegdheden van het
      stuurhutpersoneel.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel108
  - number: '108.2'
    text: Door Onze Minister worden nadere regelen gesteld ten aanzien van de aanwijzing als gezagvoerder.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel108
  - number: '108.3'
    text: |-
      Het is verboden een vlucht aan te vangen of te doen aanvangen, indien niet is voldaan aan het bepaalde krachtens
      dit artikel.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel108
  - number: '109'
    text: |-
      De luchtvaartmaatschappij is verplicht ten genoegen van Onze Minister het vereiste minimum aantal leden
      kajuitpersoneel vast te stellen voor ieder type luchtvaartuig, gebaseerd op de capaciteit of het aantal te
      vervoeren passagiers, opdat in geval van een noodlanding een veilige en vlugge evacuatie kan plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel109
  - number: '110'
    text: Door Onze Minister worden nadere regelen gesteld ten aanzien van de geoefendheid van het kajuitpersoneel.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel110
  - number: '112'
    text: |-
      De gezagvoerder moet zorg dragen dat aan het einde van de vlucht alle bekende en vermoede gebreken van het
      luchtvaartuig aan de luchtvaartmaatschappij worden gerapporteerd.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel112
  - number: '113'
    text: 'De luchtvaartmaatschappij is verplicht:'
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel113
  - number: 113.a
    text: |-
      te voorzien in een organisatie met geoefend personeel alsmede werkplaatsen, uitrusting en installaties voor het in
      een luchtwaardige toestand houden van haar in gebruik zijnde luchtvaartuigen;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel113
  - number: 113.b
    text: |-
      te waarborgen, dat het onderhoud, de revisies, de herstellingen en de wijzigingen aan haar luchtvaartuigen worden
      uitgevoerd op de wijze als in of krachtens het bepaalde in Hoofdstuk IV en in de onderhoudshandleiding als bedoeld
      onder *c* is voorgeschreven;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel113
  - number: 113.c
    text: |-
      een handleiding voor het onderhoud van haar in gebruik zijnde luchtvaartuigen, in deze regeling verder aangeduid
      met onderhoudshandleiding, samen te stellen en ieder lid van het personeel, dat met dit onderhoud is belast,
      met de inhoud van de voor dat lid van belang zijnde delen van de onderhoudshandleiding in kennis te stellen.
      Alle aanvullingen en wijzigingen van de onderhoudshandleiding moeten schriftelijk bekend worden gemaakt aan
      de desbetreffende leden van het personeel. De onderhoudshandleiding moet ten minste de volgende gegevens of
      instructies bevatten:
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel113
  - number: 113.c.1°
    text: |-
      de gang van zaken bij het bedrijfsgereed maken en bij het onderhoud, de revisie en de herstelling van
      luchtvaartuigen;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel113
  - number: 113.c.2°
    text: de frequentie van deze werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel113
  - number: 113.c.3°
    text: de taakomschrijving van het bij deze werkzaamheden betrokken personeel;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel113
  - number: 113.c.4°
    text: de bij deze werkzaamheden toegepaste werkwijzen, alsmede de aanwijzingen als bedoeld in artikel 88, tweede lid;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel113
  - number: 113.c.5°
    text: |-
      de wijze, waarop een onderhoudsverklaring tot stand komt, de omstandigheden, waaronder deze verklaring ongeldig
      wordt en een vermelding, welk personeel deze verklaring mag tekenen;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel113
  - number: 113.d
    text: |-
      er voor te zorgen, dat het met het onderhoud belaste personeel wordt onderricht met betrekking tot de gebezigde
      onderhoudsmethoden, in het bijzonder indien nieuwe luchtvaartuigen dan wel nieuwe of ongewone uitrusting in gebruik
      worden dan wel wordt genomen.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel113
  - number: '114'
    text: |-
      Door Onze Minister worden regelen gesteld ten aanzien van de voorbereiding en uitvoering van rondvluchten
      met inbegrip van regelen voor de instrumenten, uitrustingsstukken en installaties, welke naar gelang het type
      luchtvaartuig, de aard van de rondvlucht en de omstandigheden, waaronder de rondvlucht wordt uitgevoerd, aan boord
      van het luchtvaartuig aanwezig en voor het gebruik gereed moeten zijn.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel114
  - number: '115'
    text: |-
      De voorschriften van deze afdeling gelden uitsluitend ten aanzien van niet-verkeersvluchten. De voorschriften,
      gegeven in Afdeling I van dit Hoofdstuk, zijn onverminderd van toepassing.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel115
  - number: '116'
    text: |-
      Door Onze Minister worden regelen gesteld ten aanzien van de voorbereiding en uitvoering van de vluchten,
      met inbegrip van regelen voor de instrumenten, uitrustingsstukken en installaties, welke naar gelang het type
      luchtvaartuig, de aard van de vlucht en de omstandigheden, waaronder de vlucht wordt uitgevoerd, aan boord van het
      luchtvaartuig aanwezig en voor het gebruik gereed moeten zijn.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel116
  - number: 116a
    text: |-
      Tijdens een vlucht met een vliegtuig, waarvan de maximale startmassa meer dan 5700 kg bedraagt, moet het
      stuurhutpersoneel ten minste zowel een eerste als een tweede bestuurder omvatten.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel116a
  - number: 116b
    text: |-
      Bij vervoer met een luchtvaartuig, waarvan de massa tenminste 2 ton bedraagt, ten behoeve van eigen bedrijf,
      waarvoor krachtens [artikel 16][ref1] ontheffing is verleend van de in [artikel 16 van de Luchtvaartwet][ref2]
      vervatte verplichting, moeten de door Onze Minister te geven voorschriften of beperkingen in acht worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel16d
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel16
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel116b
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 16d
      - id: ref2
        bwb_id: BWBR0002267
        artikel: '16'
  - number: '117'
    text: |-
      De opstijging van zweefvliegtuigen en van motorzweefvliegtuigen met uitgeschakelde voortstuwingsinstallatie
      mag slechts geschieden met behulp van middelen, welke voldoen aan de door Onze Minister te stellen technische
      voorschriften. Lieren moeten zijn voorzien van een geldig bewijs van deugdelijkheid als bedoeld in artikel 92,
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel117
  - number: 117a
    text: |-
      Bij kunstvluchten en bij wolkenvluchten moet iedere inzittende van een zweef- of motorzweefvliegtuig voorzien zijn
      van een in goede staat verkerend valscherm.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel117a
  - number: '119.1'
    text: |-
      De aanleg van een luchtvaartterrein moet ter beoordeling door Onze Minister zodanig zijn, dat luchtvaartuigen
      daarvan een veilig gebruik kunnen maken. Hiertoe dienen desgevraagd gegevens te worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel119
  - number: '119.2'
    text: |-
      Er moet ten genoegen van Onze Minister voorzieningen worden getroffen dat de aan- en uitvliegroutes zodanig zullen
      zijn dat luchtvaartuigen veilig kunnen landen op en opstijgen van het luchtvaartterrein.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel119
  - number: '120.1'
    text: Door Onze Minister wordt de lengte van een (de) baan (banen) op een luchtvaartterrein vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel120
  - number: '120.2'
    text: |-
      De minimale breedte van een baan en van een daarbij behorende rijbaan bedraagt bij een lengte van een verharde
      baan van:








                    baanbreedte


                    rijbaanbreedte




                    a. 900 m of meer


                    45 m


                    23 m




                    b. 700 m tot 900 m


                    30 m


                    15 m
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel120
  - number: '120.3'
    text: |-
      Op verzoek van de exploitant kan in bijzondere gevallen door Onze Minister voor de baan en/of rijbaan een breedte
      worden toegestaan, welke kleiner is dan aangegeven in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel120
  - number: '120.4'
    text: |-
      De breedte van een onverharde baan en de breedte van een daarbij behorende rijbaan bedragen respectievelijk
      minimaal 25 m en 10 m.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel120
  - number: '121.1'
    text: |-
      Een baan moet in een strook in de vorm van een rechthoek zijn aangelegd en wel zo, dat de lengteassen van de baan
      en de strook samenvallen dan wel evenwijdig zijn.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel121
  - number: '121.2'
    text: |-
      De afstand van elk einde van de baan tot de daarbij dichtstbijzijnde korte zijde van de strook, waarin de baan is
      gelegen, moet ten minste 60 meter bedragen.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel121
  - number: '121.3'
    text: |-
      De afstand tussen de lengteas van een onverharde baan en de lange zijde van een strook mag niet minder dan 75 meter
      bedragen.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel121
  - number: '121.4'
    text: |-
      De afstand tussen de lengteas van een verharde baan en de lange zijde van de strook mag niet minder dan 150 meter
      bedragen; ingeval van een instrumentenbaan mag deze afstand niet minder dan 200 meter bedragen.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel121
  - number: '122.1'
    text: Een gedeelte of gedeelten van een luchtvaartterrein wordt/worden bestemd tot platform.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel122
  - number: '122.2'
    text: De inrichting en de regels voor het gebruik van platforms behoeven de instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel122
  - number: '122.3'
    text: |-
      Onze Minister onthoudt de instemming, bedoeld in het tweede lid, indien de regels voor het gebruik van het platform
      de orde en veiligheid op het platform naar zijn oordeel onvoldoende waarborgen.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel122
  - number: '122.4'
    text: |-
      Parkeer- en manoeuvreertekens moeten worden gegeven door middel van de krachtens
      [artikel 39 van het Luchtverkeersreglement][ref1]-1980 vastgestelde seinen, tenzij Onze Minister heeft ingestemd
      met een afwijkende wijze van seinen.


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel39
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '39'
  - number: '123.1'
    text: 'De exploitant moet zorg dragen, dat op het luchtvaartterrein:'
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel123
  - number: 123.1.a
    text: de richting van de wind duidelijk wordt aangegeven door een windzak of andere daartoe goedgekeurde middelen;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel123
  - number: 123.1.b
    text: |-
      de krachtens het [Luchtverkeersreglement][ref1] vastgestelde grondtekens aanwezig zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0005775
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0005775
  - number: 123.1.c
    text: een seinvierkant is ingericht;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel123
  - number: 123.1.d
    text: |-
      de grens van het landingsterrein door merkbakens wordt aangeduid, tenzij voor het landen en opstijgen uitsluitend
      van een verharde baan wordt gebruik gemaakt;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel123
  - number: 123.1.e
    text: |-
      bij de drempel van een verharde baan een getal van twee cijfers is aangebracht; dit getal geeft aan de magnetische
      richting van de lengteas van de baan, afgerond naar het dichtstbijzijnde tiental graden en - gezien vanuit de
      richting bij het landen - naar rechts gemeten van het magnetische noorden af;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel123
  - number: 123.1.f
    text: op de verharde baan en de verharde rijbanen een markering is aangebracht.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel123
  - number: '123.2'
    text: |-
      Ten aanzien van de grondtekens, het seinvierkant, de cijfers, de dagkenmerken en kleuren als bedoeld in het eerste
      lid worden door Onze Minister nadere voorschriften vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel123
  - number: '124'
    text: |-
      De exploitant moet zorg dragen, dat hindernissen, welke gevaar voor luchtvaartuigen opleveren dan wel kunnen
      opleveren en welke zich bevinden op het luchtvaartterrein:
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel124
  - number: 124.a
    text: worden verwijderd; of, indien zulks niet wel mogelijk is,
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel124
  - number: 124.b
    text: worden aangeduid door vlaggen, tekens of kleuren overeenkomstig de door Onze Minister vastgestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel124
  - number: '125.1'
    text: |-
      De exploitant van een luchtvaartterrein, dat gedurende de nacht of tijdens instrument-weersomstandigheden kan
      worden gebruikt, moet zorg dragen dat:
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel125
  - number: 125.1.a
    text: |-
      indien geen verharde banen op het luchtvaartterrein zijn aangelegd, lichten zijn geplaatst ter aanduiding van de
      grens van het landingsterrein of van een gedeelte hiervan; indien wel verharde banen op het luchtvaartterrein zijn
      aangelegd, lichten zijn geplaatst ter aanduiding van de verharde baan en de daarbij behorende verharde rijbanen;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel125
  - number: 125.1.b
    text: een naderingsverlichting is aangebracht ter vergemakkelijking van het landen zowel bij goed als bij slecht zicht;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel125
  - number: 125.1.c
    text: een krachtinstallatie aanwezig is voor elektrische energievoorziening in noodgevallen.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel125
  - number: '125.2'
    text: |-
      Ten aanzien van de in het eerste lid bedoelde verlichting en lichten kunnen door Onze Minister nadere voorschriften
      worden vastgesteld en kunnen aanwijzingen worden gegeven.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel125
  - number: '126'
    text: |-
      De exploitant is verplicht lichten te plaatsen ter aanduiding van de hindernissen als bedoeld in artikel 124,
      overeenkomstig de door Onze Minister vastgestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel126
  - number: '127'
    text: |-
      De exploitant is op verzoek van Onze Minister verplicht te gedogen, dat op het luchtvaartterrein elektronische,
      meteorologische en eventueel andere hulpmiddelen ten behoeve van de aan Onze Minister en het Koninklijk
      Nederlands Meteorologisch Instituut met betrekking tot de luchtverkeersbeveiliging en de luchtvaartmeteorologische
      dienstverlening opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel127
  - number: '128.1'
    text: 'De exploitant moet zorg dragen, dat op het luchtvaartterrein:'
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel128
  - number: 128.1.a
    text: voldoende middelen aanwezig zijn voor het op verantwoorde wijze verlenen van eerste hulp bij ongevallen;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel128
  - number: 128.1.b
    text: |-
      ten minste een persoon aanwezig is, die in staat is tot het verlenen van eerste hulp bij ongevallen en die in het
      bezit is van een bewijs waaruit blijkt, dat hij met het verlenen van eerste hulp vertrouwd is. Door Onze Minister
      kan worden vastgesteld, welke bewijzen hiervoor in aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel128
  - number: '128.2'
    text: |-
      Voor zover een voor het openbaar luchtverkeer aangewezen luchtvaartterrein ingevolge de beschikking tot aanwijzing
      mede voor het internationale luchtverkeer is bestemd, moet de exploitant zorg dragen, dat op het luchtvaartterrein
      een gezondheidsorganisatie functioneert, welke doorlopend beantwoordt aan hetgeen nodig is om ziekten te voorkomen
      en welke in elk geval de medewerking van een arts verzekert, zo dikwijls diens aanwezigheid nodig kan zijn voor een
      ingevolge een internationale overeenkomst of een wettelijk voorschrift te verrichten geneeskundig onderzoek.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel128
  - number: '129.1'
    text: |-
      De exploitant moet zorg dragen dat op het luchtvaartterrein voldoende materieel en middelen, alsmede voldoende
      deskundig en bedreven personeel aanwezig is of kan zijn voor
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel129
  - number: 129.1.a
    text: het redden van mensenlevens;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel129
  - number: 129.1.b
    text: het voorkomen, beperken en bestrijden van brand;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel129
  - number: '129.2'
    text: |-
      Het in het eerste lid bedoelde materieel moet te allen tijde in bedrijfszekere toestand verkeren en het personeel
      moet regelmatig worden geoefend.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel129
  - number: '129.3'
    text: |-
      De exploitant is verplicht maatregelen te nemen dat het personeel met het materieel te allen tijde zal uitrukken
      bij ongevallen met luchtvaartuigen op of in de onmiddellijke omgeving van het luchtvaartterrein dan wel bij brand,
      of gevaar voor brand op het luchtvaartterrein waarbij luchtvaartuigen zijn of kunnen worden betrokken.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel129
  - number: '129.4'
    text: |-
      De exploitant moet zorg dragen dat een regeling is vastgesteld waarin het geheel van de te nemen maatregelen is
      opgenomen voor een doelmatige bestrijding van ongevallen, als bedoeld in het eerste lid alsmede van rampen welke
      zich op het luchtvaartterrein kunnen voordoen.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel129
  - number: '129.5'
    text: Door Onze Minister kunnen nadere voorschriften worden vastgesteld ten aanzien van het in de vorige leden bepaalde.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel129
  - number: '130.1'
    text: De exploitant moet zorg dragen, dat van het luchtvaartterrein een veilig gebruik kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel130
  - number: '130.2'
    text: 'De exploitant moet zorg dragen, dat:'
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel130
  - number: 130.2.a
    text: |-
      de in artikel 123 bedoelde grondtekens, cijfers, dagkenmerken, kleuren en het seinvierkant, alsmede de in artikel
      124 bedoelde aanduiding van hindernissen in goede staat worden onderhouden;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel130
  - number: 130.2.b
    text: de in de artikelen 125 en 126 bedoelde verlichting, lichten en inrichtingen in goede staat worden onderhouden;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel130
  - number: 130.2.c
    text: de in artikel 127 bedoelde hulpmiddelen op de juiste wijze kunnen worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel130
  - number: '130.3'
    text: |-
      Door Onze Minister kunnen aanwijzingen worden gegeven aan de exploitant in verband met de in de vorige leden
      gestelde bepalingen.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel130
  - number: '131'
    text: |-
      De exploitant moet zorg dragen, dat driemaandelijks een verslag over de toestand van het luchtvaartterrein aan Onze
      Minister wordt aangeboden.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel131
  - number: '132.1'
    text: |-
      Onze Minister kan regels stellen ten aanzien van de orde en de veiligheid op het luchtvaartterrein. De regels
      hebben in ieder geval betrekking op:
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel132
  - number: 132.1.a
    text: de aanleg,
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel132
  - number: 132.1.b
    text: de inrichting,
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel132
  - number: 132.1.c
    text: de uitrusting, en
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel132
  - number: 132.1.d
    text: het veilig gebruik.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel132
  - number: '132.2'
    text: |-
      Onze Minister kan regels stellen inzake een veiligheidsmanagementsysteem, waarmee de exploitant van het
      luchtvaartterrein aantoont dat deze aan de regels, bedoeld in het eerste lid, voldoet.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel132
  - number: '132.3'
    text: |-
      Indien naar het oordeel van Onze Minister het veiligheidsmanagementsysteem voldoet aan de door Onze Minister
      gestelde regels, geeft Onze Minister een certificaat af. Bij ministeriële regeling worden nadere regels gesteld
      inzake de certificering.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel132
  - number: 132a
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld inzake het verrichten van grondafhandelingsdiensten op het
      luchtvaartterrein.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel132a
  - number: '133.1'
    text: |-
      De exploitant is verplicht maatregelen te nemen voor een behoorlijk toezicht op de veiligheid en de goede orde op
      het luchtvaartterrein.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel133
  - number: '133.2'
    text: |-
      Het in het vorige lid bedoelde toezicht omvat niet de luchtverkeersdienstverlening, tenzij enige van deze taken
      krachtens [artikel 11, tweede lid, van het Luchtverkeersreglement][ref1] aan de exploitant zijn opgedragen;


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel11
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '11'
  - number: '133.3'
    text: |-
      Terzake van de uitvoering van het in het eerste lid bedoelde toezicht en de in het tweede lid bedoelde opdracht kan
      Onze Minister nadere voorschriften geven.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel133
  - number: 133a
    text: |-
      Op een gecontroleerd luchtvaartterrein moet een regeling worden getroffen tussen de exploitant en de plaatselijke
      verkeersleidingsdienst met betrekking tot het luchtvaartterreinverkeer op het landingsterrein, uitgezonderd
      luchtvaartuigen en met betrekking tot het verkeer van luchtvaartuigen naar, van en op de platforms. Deze regeling
      behoeft de instemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel133a
  - number: '134.1'
    text: De exploitant benoemt een in zijn dienst staand persoon tot havenmeester.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel134
  - number: '134.2'
    text: |-
      De keuze van de te benoemen havenmeester behoeft de instemming van Onze Minister. Onze Minister onthoudt de
      instemming, indien de te benoemen persoon naar zijn oordeel ongeschikt is voor de functie van havenmeester.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel134
  - number: '134.3'
    text: De havenmeester mag niet in enig dienstverband staan tot een ander dan de exploitant.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel134
  - number: '134.4'
    text: De havenmeester verricht zijn taak onverminderd de verantwoordelijkheid van de exploitant.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel134
  - number: '134.5'
    text: De functie van havenmeester mag verenigd worden met die van exploitant.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel134
  - number: '135'
    text: |-
      De havenmeester is belast met de dagelijkse uitvoering van het toezicht op het luchtvaartterrein en in het
      bijzonder met het toezicht op de veiligheid en de goede orde daarop.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel135
  - number: '136.1'
    text: |-
      De havenmeester van een gecontroleerd luchtvaartterrein deelt de plaatselijke verkeersleidingsdienst steeds tijdig
      mede welk gedeelte van het landingsterrein gebruikt kan worden voor het verkeer met luchtvaartuigen.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel136
  - number: '136.2'
    text: Dit gedeelte van het landingsterrein wordt aangeduid als het in gebruik zijnde deel van het landingsterrein.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel136
  - number: '136.3'
    text: |-
      De plaatselijke verkeersleidingsdienst bepaalt op grond van verkeerstechnische overwegingen welk gedeelte van
      het in gebruik zijnde deel van het landingsterrein daadwerkelijk wordt bestemd voor het landen en opstijgen van
      luchtvaartuigen en daarmede verband houdende bewegingen.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel136
  - number: '137'
    text: |-
      De havenmeester moet zorg dragen, dat bij nacht of tijdens instrument-weersomstandigheden (IMC) de verlichting
      en de lichten, bedoeld in de artikelen 125 en 126, tijdig en voor zover nodig worden ontstoken en blijven branden
      zolang zulks voor de veiligheid van het luchtverkeer nodig wordt geacht.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel137
  - number: '138'
    text: 'De havenmeester moet zorg dragen, dat:'
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel138
  - number: 138.a
    text: in het seinvierkant steeds de benodigde tekens worden geplaatst;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel138
  - number: 138.b
    text: |-
      in geval van windstilte de op het luchtvaartterrein aanwezige landings-T wordt vastgezet in de richting waarin
      moet worden geland en opgestegen; onder windstilte wordt verstaan wind met een snelheid van ten hoogste 2,5 m per
      seconde.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel138
  - number: '139.1'
    text: |-
      De havenmeester moet zorg dragen, dat het in gebruik zijnde deel van het landingsterrein niet onveilig wordt
      gemaakt door enig roerend goed.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel139
  - number: '139.2'
    text: |-
      Indien zich op het landingsterrein roerend goed bevindt, hetwelk gevaar voor luchtvaartuigen kan opleveren, moet
      dit roerend goed door de zorg van de havenmeester worden aangeduid overeenkomstig de in de artikelen 124 en 126
      voor hindernissen vastgestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel139
  - number: '139.3'
    text: |-
      Indien een gedeelte van het landingsterrein niet geschikt is voor het gebruik door luchtvaartuigen moet
      dat gedeelte door de zorg van de havenmeester worden aangeduid door dagkenmerken en, indien het betreft een
      luchtvaartterrein als bedoeld in artikel 125, tevens door lichten. Ten aanzien van deze dagkenmerken en lichten
      kunnen door Onze Minister voorschriften worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel139
  - number: '140.1'
    text: De havenmeester moet ervoor zorgen, dat een platform niet onveilig wordt gemaakt door enig roerend goed.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel140
  - number: '140.2'
    text: |-
      Indien op een platform zich roerend goed bevindt, hetwelk naar het oordeel van Onze Minister gevaar voor
      luchtvaartuigen kan opleveren, moet dit roerend goed door de zorg van de havenmeester worden aangeduid
      overeenkomstig de in de artikelen 124 en 126 voor hindernissen vastgestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel140
  - number: '141.1'
    text: |-
      De havenmeester is verplicht om, indien het landingsterrein door enigerlei omstandigheid gevaarlijk is geworden of
      zal worden voor luchtvaartuigen, daarvan zo spoedig mogelijk, onder vermelding van de bijzonderheden dienaangaande
      kennis te geven aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel141
  - number: '141.2'
    text: |-
      Gelijke mededeling als bedoeld in het vorige lid moet worden gegeven, indien door enigerlei omstandigheid één of
      meer van de in de artikelen 123, 124, 125 en 126 bedoelde tekens, cijfers, dagkenmerken, kleuren, verlichting,
      lichten en inrichtingen niet meer aan de ter zake geldende voorschriften voldoen, of indien daarin wijziging zal
      worden gebracht.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel141
  - number: '141.3'
    text: |-
      Wanneer de omstandigheid welke aanleiding heeft gegeven tot de mededeling, onderscheidenlijk bedoeld in het eerste
      en tweede lid, heeft opgehouden te bestaan of zal ophouden te bestaan, moet de havenmeester daarvan eveneens zo
      spoedig mogelijk aan Onze Minister kennis geven.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel141
  - number: '142.1'
    text: |-
      De havenmeester moet een register aanleggen en nauwkeurig bijhouden, waarin gegevens worden bijgehouden omtrent elk
      luchtvaartuig dat op het luchtvaartterrein landt of daarvan opstijgt en het daarmee gepleegde vervoer.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel142
  - number: '142.2'
    text: 'De havenmeester dient van niet-verkeersvluchten de volgende gegevens bij te houden:'
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel142
  - number: 142.2.a
    text: |-
      het nationaliteits- en inschrijvingskenmerk als mede het type luchtvaartuig, tevens inhoudende de inrichting van
      het vliegtuig en de naam van de eigenaar c.q. houder;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel142
  - number: 142.2.b
    text: de naam van de gezagvoerder van het luchtvaartuig;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel142
  - number: 142.2.c
    text: het luchtvaartterrein, waarvan het luchtvaartuig het laatst is vertrokken, alsmede het tijdstip van aankomst;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel142
  - number: 142.2.d
    text: het luchtvaartterrein van bestemming, alsmede het tijdstip van vertrek;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel142
  - number: 142.2.e
    text: de aard van de vlucht, alsmede het aantal inzittenden;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel142
  - number: 142.2.f
    text: de baan- en circuitrichting.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel142
  - number: '142.3'
    text: |-
      De havenmeester dient van verkeersvluchten dezelfde gegevens bij te houden als van niet-verkeersvluchten, met
      uitzondering van het onder lid 2 *b* en *e* gestelde, doch dient daarentegen van verkeersvluchten de volgende
      additionele gegevens bij te houden:
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel142
  - number: 142.3.a
    text: het vluchtnummer;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel142
  - number: 142.3.b
    text: |-
      de herkomst c.q. bestemming van de vervoerde passagiers, zowel voor passagiers met bestemming resp. herkomst
      Nederland als voor overstappende passagiers en doorgaande passagiers;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel142
  - number: 142.3.c
    text: |-
      de herkomst c.q. bestemming van de vervoerde vracht en post, zowel voor vracht en post met bestemming resp.
      herkomst Nederland als voor vracht en post met overslag.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel142
  - number: '142.4'
    text: De gegevens van het register dienen ten minste 2 jaar te worden bewaard.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel142
  - number: '142.5'
    text: |-
      Door Onze Minister kunnen regels worden gesteld ten aanzien van de inrichting van het register. Op verzoek dient de
      havenmeester het register voor instemming aan te bieden aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel142
  - number: '142.6'
    text: |-
      De havenmeester dient de onder lid 3 genoemde gegevens op een door Onze Minister vast te stellen wijze op te sturen
      aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel142
  - number: '142.7'
    text: Vanwege het karakter van de gegevens aangeduid onder lid 3 zullen deze gegevens vertrouwelijk worden behandeld.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel142
  - number: '142.8'
    text: |-
      Onverminderd het in het voorgaande bepaalde moet de havenmeester desgevraagd aan door Onze Minister aan te wijzen
      ambtenaren van het Ministerie van Verkeer en Waterstaat en aan ambtenaren van het Korps landelijke politiediensten
      inzage verlenen.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel142
  - number: '142.9'
    text: |-
      De havenmeester van het luchtvaartterrein dient in bijzondere gevallen door Onze Minister nader te bepalen gegevens
      in het register bij te houden.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel142
  - number: '143'
    text: |-
      De havenmeester moet zorg dragen, dat op de daarvoor geëigende en duidelijk waarneembare plaats ter inzage aanwezig
      zijn:
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel143
  - number: 143.a
    text: |-
      de vastgestelde tarieven voor het gebruik, dat door luchtvaartuigen wordt gemaakt van het betreffende
      luchtvaartterrein en van de zich daarop bevindende opstallen;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel143
  - number: 143.b
    text: |-
      een lijst betreffende eventueel te heffen kosten voor het gebruik van de verschillende inrichtingen, de
      herstellingen aan luchtvaartuigen en al hetgeen daarmede samenhangt.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel143
  - number: '144'
    text: |-
      Het bij of krachtens de artikelen 121, 122, 123, 124, 125, 126, 128, tweede lid, 129, 134, derde lid, en 138,
      onder *b*, bepaalde is niet van toepassing, indien en voor zover daarvan door Onze Minister geheel of gedeeltelijk
      ontheffing is verleend.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel144
  - number: '158.1'
    text: |-
      Voor het verkrijgen van toestemming tot het houden van een luchtvaartvertoning of luchtvaartwedstrijd, als bedoeld
      in [artikel 17 van de Luchtvaartwet][ref1], moet ten minste drie weken voor de dag van de vertoning of van de
      wedstrijd een daartoe strekkend verzoekschrift worden ingediend bij Onze Minister. Hierbij moet zijn gevoegd:


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel17
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel158
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '17'
  - number: 158.1.a
    text: |-
      een omschrijving van de vertoning of van de wedstrijd met aanduiding van het (de) te gebruiken terrein(en) en van
      de te volgen route, alsmede met vermelding in hoeverre kunstvluchten zullen plaatshebben;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel158
  - number: 158.1.b
    text: |-
      een verzoek om ontheffing van de verbodsbepaling van [artikel 14, lid 1, van de Luchtvaartwet][ref1], indien een
      terrein, niet zijnde luchtvaartterrein, zal worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel14
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel158
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '14'
  - number: 158.1.c
    text: |-
      een schriftelijke verklaring of verklaringen, dat tegen de te houden vertoning of wedstrijd geen bezwaar bestaat,
      welke in het geval van een vertoning dient(en) te worden afgegeven door de burgemeester(s) van de gemeente(n)
      waar deze zal worden gehouden en, in geval van een wedstrijd, door de burgemeester(s) van de gemeente(n) waar deze
      eindigt.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel158
  - number: '158.2'
    text: |-
      Door Onze Minister kunnen nadere regelen worden gegeven, waaraan voldaan moet worden ter verkrijging en gebruik van
      een toestemming als bedoeld in [artikel 17 eerste lid van de Luchtvaartwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel17
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel158
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '17'
  - number: 158a.1
    text: |-
      Voor het aanvragen van een ontheffing van het in [artikel 14, eerste lid, van de Luchtvaartwet][ref1] vervatte
      verbod, moet tenminste 21 dagen voor de eerste dag waarop het terrein zal worden gebruikt een daartoe strekkend
      verzoekschrift worden ingediend bij Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel14
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel158a
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '14'
  - number: 158a.2
    text: 'Bij het verzoekschrift moeten worden overlegd:'
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel158a
  - number: 158a.2.1
    text: een verzoek tot ontheffing;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel158a
  - number: 158a.2.2
    text: fabrikaat en type van het te gebruiken luchtvaartuig;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel158a
  - number: 158a.2.3
    text: datum/data waarop het terrein zal worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel158a
  - number: 158a.2.4
    text: de reden/redenen waarom dit terrein zal worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel158a
  - number: 158a.2.5
    text: de gemeente en de plaats waarin het betrokken terrein is gelegen;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel158a
  - number: 158a.2.6
    text: de afmetingen van het terrein;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel158a
  - number: 158a.2.7
    text: |-
      een duidelijke kaart waaruit de geografische ligging en de aard van de omgeving van het betrokken terrein duidelijk
      blijkt;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel158a
  - number: 158a.2.8
    text: |-
      een verklaring van geen bezwaar afgegeven door de burgemeester van de gemeente waarin het betrokken terrein is
      gelegen;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel158a
  - number: 158a.2.9
    text: een verklaring van geen bezwaar van de eigenaar danwel de zakelijk gerechtigde van het betrokken terrein;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel158a
  - number: 158a.2.10
    text: |-
      een schriftelijke verklaring van de aanvrager dat het beoogde terrein aan de gestelde criteria voor een veilig
      gebruik voldoet.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel158a
  - number: 158a.3
    text: |-
      Indien de ontheffing voor drie dagen of minder wordt aangevraagd, is het gestelde in het tweede lid van dit artikel
      van toepassing met dien verstande dat de verklaringen als bedoeld onder 8 en 9 tijdens het daadwerkelijke gebruik
      van het terrein ter inzage aanwezig moeten zijn.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel158a
  - number: 158a.4
    text: |-
      Voor het aanvragen van een ontheffing van het in [artikel 14, eerste lid, van de Luchtvaartwet][ref1] vervatte
      verbod ten behoeve van het opstijgen met een vrije bemande ballon geldt in afwijking van het gestelde in het eerste
      lid, een termijn van 14 dagen.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel14
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel158a
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '14'
  - number: 158a.5
    text: |-
      De betaling van de krachtens artikel 159 vastgestelde vergoeding dient op de in artikel 160 aangegeven wijze te
      geschieden tenminste 21 dagen voor de eerste datum waarvoor de ontheffing wordt aangevraagd, met uitzondering van
      een aanvraag als bedoeld in het vierde lid, ten aanzien waarvan voor de betaling de termijn op 14 dagen is gesteld.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel158a
  - number: 158a.6
    text: |-
      Voor het aanvragen van een ontheffing van het in [artikel 31, eerste lid onder ][ref1] vervatte verbod, moet
      tenminste 21 dagen voor het begin van de periode waarvoor de aanvrage geldt een daartoe strekkend verzoekschrift
      worden ingediend bij Onze Minister. Het gestelde in het vijfde lid is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel31
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel158a
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '31'
  - number: 158a.7
    text: |-
      Voor het aanvragen van een ontheffing van het in [artikel 33, eerste lid onder ][ref1] vervatte verbod, moet
      tenminste 21 dagen voor het begin van de periode waarvoor de aanvrage geldt, een daartoe strekkend verzoekschrift
      worden ingediend bij Onze Minister. Het gestelde in het vijfde lid is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel33
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel158a
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '33'
  - number: 158a.8
    text: Artikel 158, derde lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel158a
  - number: '159.1'
    text: |-
      Onze Minister wijst de werkzaamheden en dienstverleningen, verbonden aan de toepassing van de bepalingen van
      de [Luchtvaartwet][ref1] en zijn uitvoeringsmaatregelen, aan, voor het verrichten waarvan een vergoeding van de
      daarmee voor de overheid verband houdende kosten verschuldigd is door belanghebbende en stelt de verschuldigde
      vergoeding vast.


      [ref1]: https://wetten.overheid.nl/BWBR0002267
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel159
    references:
      - id: ref1
        bwb_id: BWBR0002267
  - number: '159.2'
    text: |-
      Voor een keuring onderscheidenlijk een herkeuring is een vergoeding verschuldigd, welke wordt berekend naar een
      door de arts als bedoeld in artikel 32, tweede lid, onderscheidenlijk de herkeuringscommissie als bedoeld in
      artikel 33 vastgesteld tarief. Dit tarief behoeft de instemming van Onze Minister. Indien uit de uitslag van
      de herkeuring blijkt, dat de aanvrager terecht tegen de uitslag van de keuring in beroep is gegaan, zal hem het
      voor de herkeuring gestorte bedrag worden terugbetaald. Voor de keuring als bedoeld in artikel 27, eerste lid is
      geen vergoeding verschuldigd. Voor een geldigverklaring van een reeds met gunstige uitslag ondergane militaire
      vliegmedische keuring of een keuring ondergaan als lid van het stuurhutpersoneel van een burgerlijk vliegtuig in
      een Staat, welke is aangesloten bij de Internationale Burgerluchtvaart Organisatie, is een vergoeding verschuldigd,
      welke wordt berekend naar een door de bovenbedoelde arts vastgesteld tarief. Dit tarief behoeft de instemming van
      Onze Minister.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel159
  - number: '160.1'
    text: |-
      De beslissing op een aanvraag voor de toepassing van een of meer van de in het eerste lid van het vorige artikel
      bedoelde bepalingen wordt in het algemeen niet genomen, indien niet is gebleken dat de verschuldigde vergoeding
      is betaald.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel160
  - number: '160.2'
    text: Onze Minister stelt de wijze van betaling van de verschuldigde vergoedingen vast.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel160
  - number: '160.3'
    text: |-
      Wanneer na de betaling van de verschuldigde vergoeding degene, die een aanvraag als bedoeld in het eerste lid van
      dit artikel heeft ingediend, verzoekt die aanvraag als niet ingediend te beschouwen, kan hem op zijn verzoek een
      nader door Onze Minister in elk geval afzonderlijk te bepalen bedrag worden terugbetaald.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel160
  - number: '160.4'
    text: |-
      Indien de verlenging van de termijn van geldigheid van een ontheffing binnen twee weken voor de datum van afloop
      van geldigheid is aangevraagd, is de vergoeding niet opnieuw verschuldigd.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel160
  - number: '166.1'
    text: |-
      Overtreding van de artikelen 8, eerste lid, tweede volzin, 9, vierde lid, 10, tweede en derde lid, 11, 21, 21*a*,
      27, derde en zesde lid, tweede volzin, 28, vierde en zesde lid, 43, 50, tweede volzin, 77, eerste lid, 80, derde
      lid, 81, derde lid, 82, tweede lid, 83, tweede en derde lid, 88, tweede lid, onder *a*, derde, vierde en vijfde
      lid, 92, zesde lid, 95, eerste en derde lid, 96, derde, vierde en vijfde lid, 97, 98, 99, 101, 102, tweede lid,
      102*a*, 104, derde lid, 106, 107, 108, derde lid, 109, 112, 113, 116*a*, 117, tweede volzin, 117*a*, 123, eerste
      lid, 124, aanhef en onder *a*, 125, eerste lid, 126, 127, 128, 129, eerste, tweede, derde en vierde lid, 130,
      eerste en tweede lid, 131, 133, eerste en tweede lid, 136, 137, 138, 139, 140, 141, 142, en 143, is een strafbaar
      feit als bedoeld in [artikel 62, derde lid, van de Luchtvaartwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel62
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel166
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '62'
  - number: '166.2'
    text: 'Een overtreding van:'
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel166
  - number: 166.2.a
    text: |-
      artikel 85, vierde lid, voor zover het betreft het niet voldoen aan de van overeenkomstige toepassing zijnde
      artikelen 80, derde lid, 81, derde lid, 82, tweede lid, en 83, tweede en derde lid;
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel166
  - number: 166.2.b
    text: |-
      artikel 89, eerste lid, voor zover het betreft het niet voldoen aan het van overeenkomstige toepassing
      zijnde artikel 88, derde lid, onder *a* en *b*, en vijfde lid, is een strafbaar feit als bedoeld in
      [artikel 62, derde lid, van de Luchtvaartwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel62
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel166
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '62'
  - number: '166.3'
    text: |-
      Overtreding van een aanwijzing, regel of voorschrift gegeven krachtens de artikelen 76, eerste lid, 77, tweede
      lid, 87, derde lid, 88, tweede lid, onder *a* en *b*, 93*a*, 105, 105*a*, 109*a*, 110, 114, 116, 116*b*, 117, 123,
      tweede lid, 124 aanhef en onder *b*, 125, tweede lid, 126, 129, vijfde lid, 130, derde lid, artikel 132, eerste
      lid, 132*a*, 133, derde lid, 139, derde lid, is, voor zover die overtreding uitdrukkelijk als strafbaar feit is
      aangemerkt, een strafbaar feit als bedoeld in [artikel 62, derde lid, van de Luchtvaartwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel62
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel166
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '62'
  - number: '166.4'
    text: |-
      Een overtreding van een regel gegeven krachtens artikel 88, zesde lid, voor zover het betreft het
      niet voldoen aan het van overeenkomstige toepassing zijnde artikel 77, tweede lid, is, voor zover
      die overtreding uitdrukkelijk als strafbaar feit is aangemerkt, een strafbaar feit als bedoeld in
      [artikel 62, derde lid, van de Luchtvaartwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel62
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel166
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '62'
  - number: '167'
    text: |-
      De vóór de inwerkingtreding van dit besluit door Onze Minister afgegeven bewijzen van inschrijving, van
      luchtwaardigheid, van geschiktheid, van gelijkstelling en van deugdelijkheid treden in de plaats van de
      overeenkomstige in dit besluit vermelde bewijzen. Voor bewijzen, waarvan het model afwijkt van de bedoelde
      overeenkomstige bewijzen, geschiedt dit slechts voor de duur van ten hoogste zes maanden. In deze periode worden
      de bewijzen van afwijkend model door Onze Minister vervangen door overeenkomstige in dit besluit vermelde bewijzen
      zonder dat daarbij enige kosten in rekening worden gebracht.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel167
  - number: '168'
    text: Deze regeling kan worden aangehaald onder de titel "Regeling Toezicht Luchtvaart" of "R.T.L.".
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel168
  - number: '169'
    text: Het Koninklijk besluit van 6 december 1928, *Stb.* 454 (Regeling Toezicht Luchtvaart), wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel169
  - number: '170'
    text: |-
      Dit besluit treedt in werking op het tijdstip, waarop de [Luchtvaartwet][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0002267
    url: https://wetten.overheid.nl/BWBR0002309/2004-10-01#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0002267
