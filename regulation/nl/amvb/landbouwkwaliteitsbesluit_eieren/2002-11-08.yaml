preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Landbouw, Natuurbeheer en Visserij van 17 april 2002, TRCJZ/2002/4853,
    Directie Juridische Zaken, gedaan mede namens Onze Minister van Economische Zaken;

    Gelet op verordening (EG) nr. 5/2001 van de Raad van de Europese Unie van 19 december 2000 houdende wijziging van
    verordening (EEG) nr. 1907/90 van de Raad van de Europese Gemeenschappen van 26 juni 1990 betreffende bepaalde
    handelsnormen voor eieren (PbEG L2);

    Gelet op verordening (EG) nr. 1651/2001 van de Commissie van de Europese Gemeenschappen van 14 augustus 2001
    tot wijziging van verordening (EEG) nr. 1274/91 van de Commissie van de Europese Gemeenschappen van 15 mei 1991
    houdende bepalingen ter toepassing van verordening (EEG) nr. 1907/90 van de Raad van de Europese Gemeenschappen
    betreffende bepaalde handelsnormen voor eieren (PbEG L 220);

    Gelet op de artikelen 2, 3, 4, 6, 8, 9, en 12, eerste lid, van de Landbouwkwaliteitswet;

    De Raad van State gehoord (advies van 24 mei 2002, nummer W11.02.0173/V);

    Gezien het nader rapport van de Minister van Landbouw, Natuurbeheer en Visserij van 24 juli 2002, TRCJZ/2002/7120,
    uitgebracht mede namens Onze Minister van Economische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0013953/2002-11-08#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Minister van Landbouw, Natuurbeheer en Visserij;

      b. wet: [Landbouwkwaliteitswet][ref1];

      c. legkip: legrijpe kip van de soort Gallus gallus die wordt gehouden voor de productie van andere eieren dan
      broedeieren;

      d. Stichting CPE: Stichting Controlebureau voor Pluimvee, Eieren en Eiproducten te Barneveld;

      e. [verordening nr. 1907/90](31990R1907): [verordening (EEG) nr. 1907/90](31990R1907) van de Raad van de Europese
      Gemeenschappen van 26 juni 1990 betreffende bepaalde handelsnormen voor eieren (PbEG L 173), laatstelijk gewijzigd
      bij [verordening (EG) nr. 5/2001](32001R0005) (PbEG L2);

      f. [verordening nr. 1274/91](31991R1274): [verordening (EEG) nr. 1274/91](31991R1274) van de Commissie van de
      Europese Gemeenschappen van 15 mei 1991 houdende bepalingen ter toepassing van [verordening (EEG) nr. 1907/90]
      (31990R1907) van de Raad betreffende bepaalde handelsnormen voor eieren (PbEG L 121), laatstelijk gewijzigd bij
      [verordening (EG) nr. 1651/2001](32001R1651) (PbEG L 220).

      2 Als bevoegde instantie als bedoeld in artikel 5, derde lid, van [verordening nr. 1907/90](31990R1907) en artikel
      4 van [verordening nr. 1274/91](31991R1274) wordt in dit besluit en de daarop rustende bepalingen aangewezen: Onze
      Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0002755
    url: https://wetten.overheid.nl/BWBR0013953/2002-11-08#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002755
  - number: '2'
    text: |-
      Het is verboden om eieren te verhandelen die niet voldoen aan [verordening nr. 1907/90](31990R1907) en [verordening
      nr. 1274/91](31991R1274).
    url: https://wetten.overheid.nl/BWBR0013953/2002-11-08#Artikel2
  - number: '3'
    text: |-
      Onze Minister stelt regels omtrent:

      a. het verlenen van een vergunning, bedoeld in artikel 5, derde lid, van [verordening nr. 1907/90](31990R1907)
      aan pakstations;

      b. de registratie van verzamelaars en pakstations, bedoeld in artikel 5, derde lid, van [verordening nr. 1907/90]
      (31990R1907) en in artikel 4 van [verordening nr. 1274/91](31991R1274).
    url: https://wetten.overheid.nl/BWBR0013953/2002-11-08#Artikel3
  - number: '4'
    text: |-
      Onze Minister stelt:

      a. een officieel kenteken vast voor de vermelding op banderollen en etiketten op grote verpakkingen als bedoeld in
      artikel 21, tweede lid, van [verordening nr. 1274/91](31991R1274);

      b. een model vast voor de banderollen en etiketten op grote verpakkingen als bedoeld in artikel 21, tweede lid, van
      [verordening nr. 1274/91](31991R1274).
    url: https://wetten.overheid.nl/BWBR0013953/2002-11-08#Artikel4
  - number: '5'
    text: |-
      1 Met het oog op de uitvoering van de [artikelen 3][ref1] en [4][ref2] kan medewerking worden gevorderd door Onze
      Minister van het bestuur van het Productschap Pluimvee en Eieren.

      2 De in het eerste lid bedoelde medewerking kan slechts bestaan uit het bij verordening stellen van de regels
      omtrent het verlenen van de vergunning en de registratie als bedoeld in [artikel 3][ref3], en het vaststellen van
      een officieel kenteken en een model als bedoeld in [artikel 4][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0013953#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013953#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0013953#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0013953#Artikel4
    url: https://wetten.overheid.nl/BWBR0013953/2002-11-08#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0013953
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013953
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0013953
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0013953
        artikel: '4'
  - number: '6'
    text: |-
      1 De Stichting CPE is belast met het toezicht op de naleving van de bij haar aangeslotenen van het bij of krachtens
      dit besluit bepaalde.

      2 De voorzitter van de Stichting CPE wordt door Onze Minister telkens voor ten hoogste vier jaar benoemd en is
      terstond wederbenoembaar.

      3 Het bestuur van de Stichting CPE doet aan Onze Minister een voordracht voor de benoeming.
    url: https://wetten.overheid.nl/BWBR0013953/2002-11-08#Artikel6
  - number: '7'
    text: |-
      Producenten en pakstations als bedoeld in [verordening nr. 1907/90](31990R1907) dienen aangesloten te zijn bij de
      in [artikel 6][ref1] genoemde controle-instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0013953#Artikel6
    url: https://wetten.overheid.nl/BWBR0013953/2002-11-08#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0013953
        artikel: '6'
  - number: '8'
    text: |-
      Het is toegestaan de voor de hennen toegankelijke uitloop in de open lucht te gebruiken als grasland als bedoeld in
      bijlage III van [verordening (EG) nr. 1274/91](31991R1274).
    url: https://wetten.overheid.nl/BWBR0013953/2002-11-08#Artikel8
  - number: '9'
    text: |-
      Onze Minister kan in overeenstemming met Onze Minister van Financiën plaatsen aanwijzen, waarop ten in- of uitvoer
      bestemde eieren moeten worden aangeboden ten invoer, onderscheidenlijk ten uitvoer.
    url: https://wetten.overheid.nl/BWBR0013953/2002-11-08#Artikel9
  - number: '10'
    text: |-
      Het [Landbouwkwaliteitsbesluit scharreleieren][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0003200
    url: https://wetten.overheid.nl/BWBR0013953/2002-11-08#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003200
  - number: '11'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0013953/2002-11-08#Artikel11
  - number: '12'
    text: 'Dit besluit wordt aangehaald als: Landbouwkwaliteitsbesluit eieren.'
    url: https://wetten.overheid.nl/BWBR0013953/2002-11-08#Artikel12
