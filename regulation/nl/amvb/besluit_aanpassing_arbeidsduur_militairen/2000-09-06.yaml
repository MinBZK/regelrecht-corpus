---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.5.2/schema.json
$id: besluit_aanpassing_arbeidsduur_militairen
regulatory_layer: AMVB
publication_date: '2000-09-05'
valid_from: '2000-09-06'
bwb_id: BWBR0011531
url: https://wetten.overheid.nl/BWBR0011531/2000-09-06
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Defensie mede namens de Staatssecretaris van Sociale Zaken en
    Werkgelegenheid, A. E. Verstand-Bogaert, van 10 mei 2000, nr. P/2000001073;

    Gelet op artikel 2, tweede lid, van de Wet aanpassing arbeidsduur;

    De Raad van State gehoord (advies van 23 juni 2000, no. W07.00.0192/II);

    Gezien het nader rapport van de Staatssecretaris van Defensie, uitgebracht mede namens de Staatssecretaris van
    Sociale Zaken en Werkgelegenheid, A. E. Verstand-Bogaert, van 14 juli 2000, nr. FP/2000004445;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0011531/2000-09-06#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0011531/2000-09-06#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Defensie;'
    url: https://wetten.overheid.nl/BWBR0011531/2000-09-06#Artikel1
  - number: 1.b
    text: |-
      militair: militair in werkelijke dienst, als bedoeld in [artikel 1 van de Militaire ambtenarenwet 1931][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001952#Artikel1
    url: https://wetten.overheid.nl/BWBR0011531/2000-09-06#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001952
        artikel: '1'
  - number: '2.1'
    text: |-
      De militair kan Onze Minister verzoeken om aanpassing van zijn arbeidsduur, indien hij tenminste een jaar
      voorafgaand aan het beoogde tijdstip van ingang van die aanpassing in werkelijke dienst is.
    url: https://wetten.overheid.nl/BWBR0011531/2000-09-06#Artikel2
  - number: '2.2'
    text: |-
      Aanpassing van de arbeidsduur heeft bij vermindering van de arbeidsduur plaats door het verlenen van buitengewoon
      verlof zonder behoud van militaire inkomsten in verband met deeltijdarbeid.
    url: https://wetten.overheid.nl/BWBR0011531/2000-09-06#Artikel2
  - number: '2.3'
    text: |-
      Aanpassing van de arbeidsduur heeft bij vermeerdering van de arbeidsduur plaats door het beëindigen van het
      buitengewoon verlof, als bedoeld in het tweede lid, of het aanpassen daarvan.
    url: https://wetten.overheid.nl/BWBR0011531/2000-09-06#Artikel2
  - number: '3.1'
    text: |-
      Onze Minister kan een verzoek om aanpassing van de arbeidsduur afwijzen of een verleend buitengewoon verlof,
      als bedoeld in [artikel 2, tweede en derde lid][ref1], tijdelijk opschorten, als naar zijn oordeel zwaarwegende
      dienstbelangen dat vereisen.


      [ref1]: https://wetten.overheid.nl/BWBR0011531#Artikel2
    url: https://wetten.overheid.nl/BWBR0011531/2000-09-06#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011531
        artikel: '2'
  - number: '3.2'
    text: |-
      Onverminderd hetgeen is bepaald in [artikel 2, achtste lid, van de Wet aanpassing arbeidsduur][ref1] is van een
      zwaarwegend dienstbelang in ieder geval sprake bij varen, vliegen, oefenen, alsmede de daadwerkelijke inzet van de
      krijgsmacht, de voorbereiding daarop en voltijdse opleidingen in verband met het functioneren van de krijgsmacht.


      [ref1]: https://wetten.overheid.nl/BWBR0011173#Artikel2
    url: https://wetten.overheid.nl/BWBR0011531/2000-09-06#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011173
        artikel: '2'
  - number: '3.3'
    text: |-
      Onze Minister kan het buitengewoon verlof, als bedoeld in [artikel 2, tweede lid][ref1], in geval van buitengewone
      omstandigheden beëindigen.


      [ref1]: https://wetten.overheid.nl/BWBR0011531#Artikel2
    url: https://wetten.overheid.nl/BWBR0011531/2000-09-06#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011531
        artikel: '2'
  - number: '4'
    text: |-
      De [artikelen 2, derde en vierde lid, alsmede het zesde tot en met twaalfde lid][ref1], en
      [3 van de Wet aanpassing arbeidsduur][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011173#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011173#Artikel3
    url: https://wetten.overheid.nl/BWBR0011531/2000-09-06#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011173
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0011173
        artikel: '3'
  - number: '5.1'
    text: De Regeling deeltijdverlof wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0011531/2000-09-06#Artikel5
  - number: '5.2'
    text: |-
      Buitengewoon verlof in verband met deeltijdarbeid dat op het moment van inwerkingtreding van dit besluit is
      verleend op basis van de Regeling deeltijdverlof wordt geacht te zijn gebaseerd op dit besluit.
    url: https://wetten.overheid.nl/BWBR0011531/2000-09-06#Artikel5
  - number: '6'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0011531/2000-09-06#Artikel6
  - number: '7'
    text: 'Dit besluit wordt aangehaald als: Besluit aanpassing arbeidsduur militairen.'
    url: https://wetten.overheid.nl/BWBR0011531/2000-09-06#Artikel7
