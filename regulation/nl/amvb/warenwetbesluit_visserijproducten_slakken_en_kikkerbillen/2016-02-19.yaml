$id: warenwetbesluit_visserijproducten_slakken_en_kikkerbillen
regulatory_layer: AMVB
publication_date: '2023-10-30'
valid_from: '2016-02-19'
bwb_id: BWBR0007216
url: https://wetten.overheid.nl/BWBR0007216/2016-02-19
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volksgezondheid, Welzijn en Sport van 3 oktober 1994 nr. DGVgz/VVP/L 942046,
    gedaan in overeenstemming met Onze Minister van Economische Zaken en Onze Minister van Landbouw, Natuurbeheer en
    Visserij;

    Gelet op de Richtlijn nr. 91/493/EEG van de Raad van de Europese Gemeenschappen van 22 juli 1991 tot vaststelling
    van gezondheidsvoorschriften voor de produktie en het in de handel brengen van visserijproducten (PbEG L 268);

    op de Richtlijn nr. 91/492/EEG van de Raad van de Europese Gemeenschappen van 15 juli 1991 tot vaststelling van
    gezondheidsvoorschriften voor de produktie en het in de handel brengen van levende tweekleppige weekdieren ( PbEG
    L 268);

    op de Beschikking nr. M (85) 4 van het Comité van Ministers van 26 september 1985 tot invoering van een sanitaire
    regeling voor het intra-Benelux-verkeer voor ingevoerde garnalen of voedingswaren waarin garnalen zijn verwerkt;

    op artikel II, eerste lid, van de Wijzigingswet 1988 Warenwet jo. de artikelen 14 en 16 van de Warenwet (Stb. 1935,
    793);

    alsmede op artikel 1, vierde en vijfde lid, 4, eerste lid, 5, eerste lid, onder a en b, en zesde lid, 6, onder a en
    d, 8, onder b en c, 9, onder b, 12, 13 en 14 van de Warenwet;

    Gezien het advies van de Adviescommissie Warenwet (14 775/(19/4/6)5);

    De Raad van State gehoord (advies van 20 december 1994, nr. W13.94 0611);

    Gezien het nader rapport van Onze Minister van Volksgezondheid, Welzijn en Sport van 19 januari 1995 nr. DGVgz/
    VVP/L 9569, uitgebracht in overeenstemming met Onze Minister van Economische Zaken en Onze Minister van Landbouw,
    Natuurbeheer en Visserij;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0007216/2016-02-19#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007216/2016-02-19#Artikel1
  - number: 1.a
    text: |-
      **visserijproducten**: alle zee- of zoetwaterdieren of delen daarvan, kuit en hom daaronder begrepen, met
      uitzondering van in het water levende zoogdieren en kikkers;
    url: https://wetten.overheid.nl/BWBR0007216/2016-02-19#Artikel1
  - number: 1.b
    text: |-
      **aquacultuurprodukten**: alle visserijproducten die onder door de mens gecontroleerde omstandigheden uit eieren
      worden voortgebracht en opgekweekt totdat ze als eetwaar in de handel worden gebracht. Zee- en zoetwatervis
      of zee- en zoetwaterschaaldieren die in het juveniele stadium in hun natuurlijke milieu zijn gevangen en zijn
      opgekweekt tot ze de gewenste maat hebben bereikt om voor menselijke consumptie te worden afgezet, worden eveneens
      als aquacultuur-produkten beschouwd. Vis en schaaldieren van voor de handel geschikte maat, die zijn gevangen
      in hun natuurlijke milieu en levend zijn gehouden om op een later tijdstip te worden verkocht, worden niet als
      aquacultuurprodukten beschouwd als zij in visvijvers alleen in leven worden gehouden en niet wordt getracht om hun
      maat of gewicht te doen toenemen.
    url: https://wetten.overheid.nl/BWBR0007216/2016-02-19#Artikel1
  - number: 1.c
    text: '**tweekleppige weekdieren**: plaatkieuwige weekdieren (Lamellibranchiata), zoals oesters, mosselen en kokkels;'
    url: https://wetten.overheid.nl/BWBR0007216/2016-02-19#Artikel1
  - number: 1.d
    text: |-
      **inrichting**: iedere ruimte waar visserijproducten worden bewerkt, verwerkt, gekoeld, ingevroren, verpakt
      of opgeslagen, met uitzondering van vissersvaartuigen, afslagen, groothandelsmarkten, zuiveringscentra en
      verzendingscentra;
    url: https://wetten.overheid.nl/BWBR0007216/2016-02-19#Artikel1
  - number: 1.e
    text: |-
      **afslag**: een gebouw waar visserijproducten hoofdzakelijk worden geveild en uitsluitend worden gesorteerd,
      uitgestald of opgeslagen en in het groot worden verhandeld;
    url: https://wetten.overheid.nl/BWBR0007216/2016-02-19#Artikel1
  - number: 1.f
    text: |-
      **groothandelsmarkt**: een markt waar visserijproducten uitsluitend worden gesorteerd, uitgestald of opgeslagen en
      in het groot worden verhandeld;
    url: https://wetten.overheid.nl/BWBR0007216/2016-02-19#Artikel1
  - number: 1.g
    text: |-
      **zuiveringscentrum**: een centrum dat over waterbekkens beschikt die worden voorzien met van nature schoon
      zeewater of met door middel van een geschikte behandeling schoon gemaakt zeewater, waarin levende tweekleppige
      weekdieren worden gehouden gedurende de tijd die nodig is om de microbiologische contaminanten te elimineren, zodat
      ze geschikt worden voor menselijke consumptie;
    url: https://wetten.overheid.nl/BWBR0007216/2016-02-19#Artikel1
  - number: 1.h
    text: |-
      **verzendingscentrum**: iedere, op het land gevestigde of drijvende installatie, die is bedoeld voor ontvangst,
      verwatering, wassen, reiniging, sortering en verpakking van levende tweekleppige weekdieren die geschikt zijn voor
      menselijke consumptie;
    url: https://wetten.overheid.nl/BWBR0007216/2016-02-19#Artikel1
  - number: 1.i
    text: |-
      **richtlijn visserijproducten**: [Richtlijn nr. 91/493/EEG](31991L0493) van de Raad van de Europese Gemeenschappen
      van 22 juli 1991 tot vaststelling van gezondheidsvoorschriften voor de produktie en het in de handel brengen van
      visserijproducten;
    url: https://wetten.overheid.nl/BWBR0007216/2016-02-19#Artikel1
  - number: 1.j
    text: |-
      **richtlijn tweekleppige weekdieren**: [Richtlijn nr. 91/492/EEG](31991L0492) van de Raad van de Europese
      Gemeenschappen van 15 juli 1991 tot vaststelling van gezondheidsvoorschriften voor de produktie en het in de handel
      brengen van levende tweekleppige weekdieren;
    url: https://wetten.overheid.nl/BWBR0007216/2016-02-19#Artikel1
  - number: 1.k
    text: |-
      **beschikking garnalen**: Beschikking nr. M (85) 4 van het Comité van Ministers van 26 september 1985 tot invoering
      van een sanitaire regeling voor het intra-Benelux-verkeer voor ingevoerde garnalen of voedingswaren waarin garnalen
      zijn verwerkt;
    url: https://wetten.overheid.nl/BWBR0007216/2016-02-19#Artikel1
  - number: 1.l
    text: |-
      **derde land**: een land dat niet behoort tot de Europese Unie en dat ook geen partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte;
    url: https://wetten.overheid.nl/BWBR0007216/2016-02-19#Artikel1
  - number: 1.m
    text: '**binnen Nederlands grondgebied brengen**: het vanuit een derde land binnen Nederlands grondgebied brengen;'
    url: https://wetten.overheid.nl/BWBR0007216/2016-02-19#Artikel1
  - number: 1.n
    text: |-
      **richtlijn 92/118/EEG**: [richtlijn nr. 92/118/EEG](31992L0118) van de Raad van 17 december 1992 tot vaststelling
      van de veterinairrechtelijke en de gezondheidsvoorschriften voor het handelsverkeer en de invoer in de Gemeenschap
      van producten waarvoor ten aanzien van deze voorschriften geen specifieke communautaire regelgeving geldt als
      bedoeld in bijlage A, hoofdstuk l, van [Richtlijn 89/662/EEG](31989L0662), en wat ziekteverwekkers betreft, van
      [Richtlijn 90/425/EEG](31990L0425) (PbEG L 62);
    url: https://wetten.overheid.nl/BWBR0007216/2016-02-19#Artikel1
  - number: 1.o
    text: |-
      **slakken**: terrestrische buikpotigen van de soorten Helis pomatia Linneus, Helix aspersa Muller en Helix lucorum,
      en de tot de Achatinidae behorende soorten;
    url: https://wetten.overheid.nl/BWBR0007216/2016-02-19#Artikel1
  - number: 1.p
    text: |-
      **kikkerbillen**: het achterste gedeelte van tot de soorten van het genus Rana sp. (familie Ranidae) behorende
      dieren, transversaal doorgesneden achter de voorste ledematen, gestript en gevild, vers, bevroren of verwerkt;
    url: https://wetten.overheid.nl/BWBR0007216/2016-02-19#Artikel1
  - number: 1.q
    text: |-
      **verordening (EU) 1379/2013**: Verordening (EU) nr. 1379/2013 van het Europees Parlement en de Raad van 11
      december 2013 houdende een gemeenschappelijke marktordening voor visserijproducten en aquacultuurproducten, tot
      wijziging van Verordeningen (EG) nr. 1184/2006 en (EG) nr. 1224/2009 van de Raad en tot intrekking van Verordening
      (EG) nr. 104/2000 van de Raad (PbEU 2013, L 354);
    url: https://wetten.overheid.nl/BWBR0007216/2016-02-19#Artikel1
  - number: 1.r
    text: |-
      **verordening (EG) 1224/2009**: Verordening (EG) nr. 1224/2009 van de Raad van 20 november 2009 tot vaststelling
      van een communautaire controleregeling die de naleving van de regels van het gemeenschappelijk visserijbeleid
      moet garanderen, tot wijziging van Verordeningen (EG) nr. 847/96, (EG) nr. 2371/2002, (EG) nr. 811/2004, (EG) nr.
      768/2005, (EG) nr. 2115/2005, (EG) nr. 2166/2005, (EG) nr. 388/2006, (EG) nr. 509/2007, (EG) nr. 676/2007, (EG) nr.
      1098/2007, (EG) nr. 1300/2008, (EG) nr. 1342/2008 en tot intrekking van Verordeningen (EEG) nr. 2847/93, (EG) nr.
      1627/94 en (EG) nr. 1966/2006 (PbEU 2009, L 343).
    url: https://wetten.overheid.nl/BWBR0007216/2016-02-19#Artikel1
  - number: '2.1'
    text: |-
      Het is verboden visserijproducten, slakken en kikkerbillen die niet voldoen aan de krachtens dit besluit gestelde
      voorschriften met betrekking tot hun samenstelling, te behandelen, te bewerken, te bereiden, te verwerken of te
      verhandelen.
    url: https://wetten.overheid.nl/BWBR0007216/2016-02-19#Artikel2
  - number: '2.2'
    text: |-
      Het is verboden visserijproducten, slakken en kikkerbillen te behandelen, te bewerken, te bereiden, te verwerken,
      te bewaren, te vervoeren of te verpakken, anders dan met inachtneming van de daaromtrent bij of krachtens dit
      besluit gestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0007216/2016-02-19#Artikel2
  - number: '2.3'
    text: |-
      Het is verboden visserijproducten, slakken en kikkerbillen te verhandelen, met betrekking tot welke in afwijking
      van de krachtens dit besluit gestelde voorschriften is gehandeld.
    url: https://wetten.overheid.nl/BWBR0007216/2016-02-19#Artikel2
  - number: '2.4'
    text: |-
      Het is verboden visserijproducten, slakken en kikkerbillen te verhandelen, anders dan in een verpakking die voldoet
      aan de daaromtrent krachtens dit besluit gestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0007216/2016-02-19#Artikel2
  - number: '2.5'
    text: |-
      Het is verboden visserijproducten, slakken en kikkerbillen te verhandelen, anders dan met inachtneming van de
      krachtens dit besluit gestelde voorschriften met betrekking tot het bezigen van vermeldingen.
    url: https://wetten.overheid.nl/BWBR0007216/2016-02-19#Artikel2
  - number: '2.6'
    text: |-
      Het is verboden met gebruikmaking van de bij dit besluit aangegeven aanduidingen, andere waren te verhandelen dan
      die waaraan die aanduidingen in dit besluit zijn voorbehouden.
    url: https://wetten.overheid.nl/BWBR0007216/2016-02-19#Artikel2
  - number: '2.7'
    text: |-
      Het is verboden visserijproducten, slakken en kikkerbillen te behandelen, te bewerken, te bereiden, te verwerken,
      te bewaren of te verpakken in inrichtingen die niet overeenkomstig de krachtens dit besluit gestelde voorschriften
      zijn erkend.
    url: https://wetten.overheid.nl/BWBR0007216/2016-02-19#Artikel2
  - number: '2.8'
    text: |-
      Het is verboden levende tweekleppige weekdieren te behandelen of te bewerken in zuiveringscentra die niet
      overeenkomstig de krachtens dit besluit gestelde voorschriften zijn erkend.
    url: https://wetten.overheid.nl/BWBR0007216/2016-02-19#Artikel2
  - number: '2.9'
    text: |-
      Het is verboden levende tweekleppige weekdieren te behandelen, te bewerken of te verpakken in verzendingscentra die
      niet overeenkomstig de krachtens dit besluit gestelde voorschriften zijn erkend.
    url: https://wetten.overheid.nl/BWBR0007216/2016-02-19#Artikel2
  - number: '2.10'
    text: |-
      Het is verboden visserijproducten, slakken en kikkerbillen binnen Nederlands grondgebied te brengen anders dan met
      inachtneming van de bij of krachtens dit besluit gestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0007216/2016-02-19#Artikel2
  - number: '2.11'
    text: |-
      Het is verboden te handelen in strijd met artikel 34, eerste lid, 35, eerste, tweede en derde lid, artikel 37,
      tweede lid, artikel 38, eerste lid, of artikel 39, eerste, derde en vierde lid, van verordening (EU) 1379/2013.
    url: https://wetten.overheid.nl/BWBR0007216/2016-02-19#Artikel2
  - number: '7.1'
    text: |-
      Als methoden van onderzoek welke bij uitsluiting beslissend zijn voor de vaststelling of met betrekking tot de bij
      dit besluit bedoelde waren al dan niet is voldaan aan de krachtens dit besluit gestelde regels, worden aangewezen
      microbiologische en biochemische onderzoekmethoden, fysisch-chemische scheidings- en detectiemethoden alsmede
      organoleptische onderzoekmethoden.
    url: https://wetten.overheid.nl/BWBR0007216/2016-02-19#Artikel7
  - number: '7.2'
    text: Onze Minister kan nadere regels stellen met betrekking tot de in het eerste lid bedoelde methoden.
    url: https://wetten.overheid.nl/BWBR0007216/2016-02-19#Artikel7
  - number: '8.1'
    text: De aanduiding "kaviaar" mag uitsluitend worden gebezigd voor kuit van steurachtige vissen (chrondrosteï).
    url: https://wetten.overheid.nl/BWBR0007216/2016-02-19#Artikel8
  - number: '8.2'
    text: |-
      Uitsluitend in de maanden mei tot en met september mag de aanduiding "nieuwe haring", "Hollandse nieuwe" of
      "nieuwe maatjes" worden gebezigd voor haring welke is gevangen in de genoemde maanden van het jaar waarin zij wordt
      verhandeld.
    url: https://wetten.overheid.nl/BWBR0007216/2016-02-19#Artikel8
  - number: '9'
    text: |-
      Kleine hoeveelheden rechtstreeks vanaf vissersvaartuigen aan de consumenten verkochte producten hoeven niet te
      voldoen aan de eisen gesteld in artikel 35, eerste lid, van verordening (EU) 1379/2013, mits die hoeveelheden niet
      hoger zijn dan de waarde, bedoeld in artikel 58, achtste lid van verordening (EG) 1224/2009.
    url: https://wetten.overheid.nl/BWBR0007216/2016-02-19#Artikel9
  - number: 9a
    text: |-
      Bij ministeriële regeling wordt de lijst van handelsbenamingen, bedoeld in artikel 37, eerste lid, van verordening
      (EU) 1379/2013, vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007216/2016-02-19#Artikel9a
  - number: '10'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0007216/2016-02-19#Artikel10
  - number: '11'
    text: 'Dit besluit wordt aangehaald als: Warenwetbesluit Visserijproducten, slakken en kikkerbillen.'
    url: https://wetten.overheid.nl/BWBR0007216/2016-02-19#Artikel11
