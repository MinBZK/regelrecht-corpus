---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: landbouwkwaliteitsbesluit_rauwe_melk_en_zuivelbereiding
regulatory_layer: AMVB
publication_date: '2005-12-13'
valid_from: '1999-11-26'
bwb_id: BWBR0006414
url: https://wetten.overheid.nl/BWBR0006414/1999-11-26
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Landbouw, Natuurbeheer en Visserij van 4 oktober 1993, nr. J.9310374,
    Directie Juridische en Bedrijfsorganisatorische Zaken, gedaan mede namens de Staatssecretaris van Welzijn,
    Volksgezondheid en Cultuur en Onze Minister van Economische Zaken;

    Gelet op richtlijn nr.92/46/EEG van de Raad van de Europese Gemeenschappen van 16 juni 1992 tot vaststelling van
    gezondheidsvoorschriften voor de produktie en het in de handel brengen van rauwe melk, warmtebehandelde melk en
    produkten op basis van melk (PbEG L 268) en richtlijn nr.92/47/EEG van de Raad van de Europese Gemeenschappen van
    16 juni 1992 houdende vaststelling van de voorschriften voor het toestaan van tijdelijke en beperkte afwijkingen
    op de specifieke communautaire gezondheidsvoorschriften voor de produktie en het in de handel brengen van melk
    en produkten op basis van melk (PbEG L 268) en de artikelen 2, 3, 4, 8, 9, 11, 12 eerste lid, en 19 van de
    Landbouwkwaliteitswet;

    Gezien het advies van:

    -. het Produktschap voor Zuivel van 27 augustus 1993,

    -. het Centraal Orgaan voor Kwaliteitsaangelegenheden in de Zuivel (COKZ) van 24 augustus 1993,

    -. de Koninklijke Nederlandse Zuivelbond FNZ van 25 augustus 1993,

    -. de Vereeniging voor Zuivelindustrie en Melkhygiëne (VVZM) van 25 augustus 1993,

    -. het Gemeenschappelijk Zuivelsekretariaat (GEMZU) van 25 augustus 1993;

    De Raad van State gehoord (advies van 22 december 1993, nr. W11.93.0713);

    Gezien het nader rapport van de Staatssecretaris van Landbouw, Natuurbeheer en Visserij van 3 januari 1994, nr. J.
    9320972, uitgebracht mede namens de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur en Onze Minister van
    Economische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006414/1999-11-26#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006414/1999-11-26#Artikel1
  - number: 1.1.a
    text: |-
      [richtlijn 92/46/EEG](31992L0046): [richtlijn nr.92/46/EEG](31992L0046) van de Raad van de Europese Gemeenschappen
      van 16 juni 1992 tot vaststelling van gezondheidsvoorschriften voor de produktie en het in de handel brengen van
      rauwe melk, warmtebehandelde melk en produkten op basis van melk (*PbEG* L 268);
    url: https://wetten.overheid.nl/BWBR0006414/1999-11-26#Artikel1
  - number: 1.1.b
    text: |-
      [richtlijn 92/47/EEG](31992L0047): [richtlijn nr.92/47/EEG](31992L0047) van de Raad van de Europese Gemeenschappen
      van 16 juni 1992 houdende vaststelling van de voorschriften voor het toestaan van tijdelijke en beperkte
      afwijkingen op de specifieke communautaire gezondheidsvoorschriften voor de produktie en het in de handel brengen
      van melk en produkten op basis van melk (*PbEG* L 268);
    url: https://wetten.overheid.nl/BWBR0006414/1999-11-26#Artikel1
  - number: 1.1.c
    text: |-
      wet: [Landbouwkwaliteitswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002755
    url: https://wetten.overheid.nl/BWBR0006414/1999-11-26#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002755
  - number: 1.1.d
    text: 'Onze Minister: Onze Minister van Landbouw, Natuurbeheer en Visserij;'
    url: https://wetten.overheid.nl/BWBR0006414/1999-11-26#Artikel1
  - number: 1.1.e
    text: 'produktschap: Produktschap voor Zuivel;'
    url: https://wetten.overheid.nl/BWBR0006414/1999-11-26#Artikel1
  - number: 1.1.f
    text: |-
      rauwe melk: melk die is afgescheiden door de melkklier van één of meer koeien, ooien, geiten of buffelkoeien en die
      niet verwarmd is tot boven de 40°C en die evenmin een behandeling met een gelijkwaardig effect heeft ondergaan;
    url: https://wetten.overheid.nl/BWBR0006414/1999-11-26#Artikel1
  - number: 1.1.g
    text: |-
      warmtebehandelde consumptiemelk: hetzij voor verkoop aan een eindverbruiker of aan instellingen bestemde
      consumptiemelk die is verkregen door een warmtebehandeling en die wordt aangeboden gepasteuriseerde melk,
      Ultra High Temperature (UHT) melk, gesteriliseerde melk of hooggepasteuriseerde melk, hetzij door pasteurisatie
      behandelde melk voor bulkverkoop op verzoek van de individuele consument;
    url: https://wetten.overheid.nl/BWBR0006414/1999-11-26#Artikel1
  - number: 1.1.h
    text: |-
      produkten op basis van melk: - voor menselijke consumptie bestemde zuivelprodukten, dat wil zeggen produkten die
      uitsluitend zijn verkregen uit melk, met dien verstande dat stoffen die voor de bereiding ervan noodzakelijk zijn,
      mogen worden toegevoegd, mits deze stoffen niet worden gebruikt voor de volledige of gedeeltelijke vervanging van
      één van de bestanddelen van de melk; en
        - voor menselijke consumptie bestemde samengestelde zuivelprodukten, dat wil zeggen produkten waarvan geen enkel
      element in de plaats komt van een melkbestanddeel of bedoeld is om daarvoor in de plaats te komen en waarvan
      de melk of een zuivelprodukt een essentieel bestanddeel is, hetzij door de hoeveelheid, hetzij omdat het effect
      kenmerkend is voor deze produkten;
    url: https://wetten.overheid.nl/BWBR0006414/1999-11-26#Artikel1
  - number: 1.1.i
    text: |-
      warmtebehandeling: elke behandeling door verhitting die, onmiddellijk na de toepassing ervan, een negatieve reactie
      bij de fosfatasetest tot gevolg heeft;
    url: https://wetten.overheid.nl/BWBR0006414/1999-11-26#Artikel1
  - number: 1.1.j
    text: 'produktiebedrijf: een bedrijf met een of meer koeien, ooien, geiten of buffelkoeien voor de melkproduktie;'
    url: https://wetten.overheid.nl/BWBR0006414/1999-11-26#Artikel1
  - number: 1.1.k
    text: 'COKZ: Stichting Centraal Orgaan voor Kwaliteitsaangelegenheden in de Zuivel;'
    url: https://wetten.overheid.nl/BWBR0006414/1999-11-26#Artikel1
  - number: 1.1.l
    text: |-
      in de handel brengen: het in het bezit hebben of uitstallen met het oog op verkoop, het te koop aanbieden, het
      verkopen, het leveren of het op enige andere wijze overdragen, met uitzondering van de detailverkoop;
    url: https://wetten.overheid.nl/BWBR0006414/1999-11-26#Artikel1
  - number: 1.1.m
    text: |-
      inrichting: melkbehandelings- of melkverwerkingsinrichting, centraal melkdepot of centrum voor standaardisering,
      zoals omschreven in artikel 2 van [richtlijn 92/46/EEG](31992L0046);
    url: https://wetten.overheid.nl/BWBR0006414/1999-11-26#Artikel1
  - number: 1.1.n
    text: |-
      aangesloten inrichting: inrichting welke ingevolge een op grond van de wet vastgesteld landbouwkwaliteitsbesluit is
      aangesloten bij het COKZ.
    url: https://wetten.overheid.nl/BWBR0006414/1999-11-26#Artikel1
  - number: '1.2'
    text: |-
      Dit besluit, met uitzondering van het bepaalde omtrent uitbetaling naar gelang van de kwaliteit, is niet van
      toepassing op het bedrijfsmatig produceren en ontvangen van rauwe melk voorzover: - de rauwe melk rechtstreeks aan
      de consument wordt verkocht;
        - de produkten op basis van melk die op het produktiebedrijf zijn bereid met rauwe melk rechtstreeks aan de
      consument worden verkocht;
        - de rauwe melk of daaruit te bereiden produkten niet bestemd zijn voor menselijke consumptie.
    url: https://wetten.overheid.nl/BWBR0006414/1999-11-26#Artikel1
  - number: '2.1'
    text: |-
      Het is verboden rauwe melk bedrijfsmatig te produceren anders dan met inachtneming van de daaromtrent bij of
      krachtens dit besluit gestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0006414/1999-11-26#Artikel2
  - number: '2.2'
    text: |-
      Het is verboden warmtebehandelde consumptiemelk en produkten op basis van melk te bereiden anders dan met
      inachtneming van de daaromtrent bij of krachtens dit besluit gestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0006414/1999-11-26#Artikel2
  - number: '2.3'
    text: |-
      Het is verboden rauwe melk, warmtebehandelde consumptiemelk en produkten op basis van melk binnen het grondgebied
      van de Europese Unie in de handel te brengen, anders dan met inachtneming van de daaromtrent bij of krachtens dit
      besluit gestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0006414/1999-11-26#Artikel2
  - number: '3.1'
    text: |-
      Onze Minister kan voor rauwe melk, warmtebehandelde consumptiemelk en produkten op basis van melk regels stellen
      met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0006414/1999-11-26#Artikel3
  - number: 3.1.a
    text: |-
      de hoedanigheid, de oorsprong, de sortering, de verzorging, de verpakking, de vorm, de afwerking, de aanduiding, de
      maat en het gewicht, alsmede voor zover het rauwe melk betreft de betaling naar gelang van de kwaliteit;
    url: https://wetten.overheid.nl/BWBR0006414/1999-11-26#Artikel3
  - number: 3.1.b
    text: |-
      de inrichting en het gebruik van bedrijfsgebouwen en vervoermiddelen, het gebruik en verbruik van grondstoffen,
      hulpstoffen en toevoegingen, de be- of verwerkingswijze, het gebruik van machines, werktuigen en gereedschappen, en
      de hoedanigheid en het gebruik van verpakkingsmiddelen;
    url: https://wetten.overheid.nl/BWBR0006414/1999-11-26#Artikel3
  - number: 3.1.c
    text: |-
      de verplichting voor bepaalde aangesloten inrichtingen tot betaling aan het COKZ van toegepaste kortingen en van
      andere geldsommen in verband met de kwaliteit van rauwe melk, alsmede de verplichting van het COKZ tot betaling aan
      bepaalde bij haar aangesloten inrichtingen van toeslagen in verband met de kwaliteit van rauwe melk.
    url: https://wetten.overheid.nl/BWBR0006414/1999-11-26#Artikel3
  - number: '3.2'
    text: |-
      De in het eerste lid bedoelde regels kunnen verschillen naar gelang van oorsprong, gebruiksdoel of geografische
      bestemming van het produkt.
    url: https://wetten.overheid.nl/BWBR0006414/1999-11-26#Artikel3
  - number: '4.1'
    text: |-
      Onze Minister kan bepalen, dat de in [artikel 3, eerste lid][ref1], bedoelde regels omvang door het bestuur van het
      produktschap bij verordening worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006414#Artikel3
    url: https://wetten.overheid.nl/BWBR0006414/1999-11-26#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006414
        artikel: '3'
  - number: '4.2'
    text: |-
      Onze Minister kan bepalen dat krachtens een verordening als bedoeld in het eerste lid, genomen besluiten de
      goedkeuring behoeven van een door hem aangewezen autoriteit.
    url: https://wetten.overheid.nl/BWBR0006414/1999-11-26#Artikel4
  - number: '5.1'
    text: Inrichtingen dienen in het bezit te zijn van een erkenning.
    url: https://wetten.overheid.nl/BWBR0006414/1999-11-26#Artikel5
  - number: '5.2'
    text: |-
      Een erkenning wordt uitsluitend aan een inrichting verstrekt, indien voldaan is aan door Onze Minister vast te
      stellen nadere regels.
    url: https://wetten.overheid.nl/BWBR0006414/1999-11-26#Artikel5
  - number: '6.1'
    text: |-
      Het bedrijfsmatig produceren van rauwe melk is uitsluitend toegestaan aan aangeslotenen bij de in [artikel 7][ref1]
      genoemde controle-instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0006414#Artikel7
    url: https://wetten.overheid.nl/BWBR0006414/1999-11-26#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006414
        artikel: '7'
  - number: '6.2'
    text: |-
      Inrichtingen die bedrijfsmatig rauwe melk ontvangen dienen te zijn aangesloten bij de in [artikel 7][ref1] genoemde
      controle-instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0006414#Artikel7
    url: https://wetten.overheid.nl/BWBR0006414/1999-11-26#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006414
        artikel: '7'
  - number: '6.3'
    text: |-
      Het bepaalde in het eerste lid is niet van toepassing indien de rauwe melk rechtstreeks aan een aangesloten
      inrichting geleverd wordt.
    url: https://wetten.overheid.nl/BWBR0006414/1999-11-26#Artikel6
  - number: '7.1'
    text: 'De Stichting Centraal Orgaan voor Kwaliteitsaangelegenheden in de Zuivel te Leusden is:'
    url: https://wetten.overheid.nl/BWBR0006414/1999-11-26#Artikel7
  - number: 7.1.a
    text: |-
      belast met het toezicht op de naleving door de bij haar aangeslotenen van de bij of krachtens dit besluit gestelde
      regels;
    url: https://wetten.overheid.nl/BWBR0006414/1999-11-26#Artikel7
  - number: 7.1.b
    text: |-
      belast met de in [artikel 5][ref1] bedoelde erkenning van de bij haar aangesloten inrichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006414#Artikel5
    url: https://wetten.overheid.nl/BWBR0006414/1999-11-26#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006414
        artikel: '5'
  - number: '7.2'
    text: |-
      Indien bij of krachtens dit besluit regels worden gesteld inzake de betaling naar gelang van de kwaliteit van de
      rauwe melk is het COKZ met de uitvoering belast.
    url: https://wetten.overheid.nl/BWBR0006414/1999-11-26#Artikel7
  - number: '8'
    text: |-
      De voorzitter van de in [artikel 7][ref1] genoemde controle-instelling heeft geen belang bij de produktie van
      rauwe melk en de bereiding van of de handel in rauwe melk, warmtebehandelde consumptiemelk en produkten op basis
      van melk.


      [ref1]: https://wetten.overheid.nl/BWBR0006414#Artikel7
    url: https://wetten.overheid.nl/BWBR0006414/1999-11-26#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006414
        artikel: '7'
  - number: '9.1'
    text: |-
      Onze Minister kan van het bij of krachtens dit besluit bepaalde vrijstelling en op aanvraag ontheffing verlenen
      voorzover dit ingevolge de artikelen 8, 9 en 11 van [richtlijn 92/46/EEG](31992L0046) en de artikelen 2 en 3
      van [richtlijn 92/47/EEG](31992L0047) is toegestaan, en deze bevoegdheid ingevolge het tweede lid niet aan het
      produktschap toekomt.
    url: https://wetten.overheid.nl/BWBR0006414/1999-11-26#Artikel9
  - number: '9.2'
    text: |-
      Indien Onze Minister uitvoering geeft aan [artikel 4, eerste lid][ref1], is het produktschap bevoegd vrijstelling
      en, op aanvraag, ontheffing als bedoeld in het eerste lid te verlenen van de door het produktschap gestelde nadere
      regels.


      [ref1]: https://wetten.overheid.nl/BWBR0006414#Artikel4
    url: https://wetten.overheid.nl/BWBR0006414/1999-11-26#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006414
        artikel: '4'
  - number: '9.3'
    text: |-
      Onze Minister kan bepalen dat een besluit waarbij een vrijstelling of ontheffing als bedoeld in het tweede lid
      wordt verleend de goedkeuring behoeft van een door hem aangewezen autoriteit.
    url: https://wetten.overheid.nl/BWBR0006414/1999-11-26#Artikel9
  - number: '10'
    text: |-
      Onze Minister oefent de hem in voorgaande artikelen toegekende bevoegdheden uit in overeenstemming met Onze
      Minister van Welzijn, Volksgezondheid en Cultuur, voor zover het daarbij de volksgezondheid betreft.
    url: https://wetten.overheid.nl/BWBR0006414/1999-11-26#Artikel10
  - number: '11'
    text: |-
      Een wijziging van de artikelen 2, 8, 9 en 11 van [richtlijn 92/46/EEG](31992L0046) of de artikelen 2 en
      3 van [richtlijn 92/47/EEG](31992L0047) treedt voor de toepassing van de [artikelen 1, onder ][ref1], en
      [artikel 9, eerste lid][ref2], in werking met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn
      uiterlijk uitvoering moet zijn gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006414#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006414#Artikel9
    url: https://wetten.overheid.nl/BWBR0006414/1999-11-26#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006414
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006414
        artikel: '9'
  - number: '12.1'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0006414/1999-11-26#Artikel12
  - number: '12.2'
    text: |-
      [Artikel 5, tweede lid][ref1], werkt terug tot en met 1 oktober 1993.


      [ref1]: https://wetten.overheid.nl/BWBR0006414#Artikel5
    url: https://wetten.overheid.nl/BWBR0006414/1999-11-26#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006414
        artikel: '5'
  - number: '12.3'
    text: |-
      [Artikel 9][ref1] werkt terug tot en met 1 april 1993.


      [ref1]: https://wetten.overheid.nl/BWBR0006414#Artikel9
    url: https://wetten.overheid.nl/BWBR0006414/1999-11-26#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006414
        artikel: '9'
  - number: '13'
    text: Dit besluit wordt aangehaald als "Landbouwkwaliteitsbesluit rauwe melk en zuivelbereiding".
    url: https://wetten.overheid.nl/BWBR0006414/1999-11-26#Artikel13
