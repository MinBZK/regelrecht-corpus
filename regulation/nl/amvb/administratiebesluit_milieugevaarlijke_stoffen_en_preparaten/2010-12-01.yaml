  url: https://wetten.overheid.nl/BWBR0004321/2010-12-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. de wet: de [Wet milieubeheer][ref1];

      b. vervaardigen: produceren van een stof of preparaat met het oogmerk deze, al dan niet verwerkt in een (ander)
      preparaat dan wel verwerkt of omgezet in een produkt, aan een ander ter beschikking te stellen;

      c. administratieplichtige: ieder die beroepshalve stoffen of preparaten vervaardigt of in Nederland invoert.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0004321/2010-12-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 1a
    text: |-
      De administratieplichtige houdt een administratie bij van de hoeveelheden van de stoffen of preparaten die hij
      heeft vervaardigd, in Nederland ingevoerd of aan een ander ter beschikking gesteld.
    url: https://wetten.overheid.nl/BWBR0004321/2010-12-01#Artikel1a
  - number: '2'
    text: |-
      1 De administratieplichtige administreert met betrekking tot stoffen en preparaten die hij heeft vervaardigd, in
      Nederland ingevoerd of aan een ander ter beschikking gesteld de chemische namen en de gewichtspercentages van de
      belangrijkste daarin aanwezige stoffen tot in totaal 95 gewichtsprocenten van het preparaat, alsmede, voor zover
      hij daarover beschikt of redelijkerwijs kan beschikken, de chemische namen van de stoffen die de resterende 5
      gewichtsprocenten van een preparaat vormen.

      2 Het eerste lid is niet van toepassing, indien degene die aan de administratieplichtige een preparaat of een
      of meer bestanddelen van een door de administratieplichtige vervaardigd preparaat ter beschikking heeft gesteld,
      de gegevens met betrekking tot de samenstelling daarvan niet heeft verstrekt in verband met de bescherming van
      bedrijfsgeheimen:

      a. ingeval de administratieplichtige een preparaat in een hoeveelheid kleiner dan 1000 kg per jaar vervaardigt, in
      Nederland invoert of aan een ander ter beschikking stelt, of

      b. ingeval de administratieplichtige een preparaat in een hoeveelheid van 1000 kg of meer per jaar vervaardigt,
      in Nederland invoert of aan een ander ter beschikking stelt, en de administratieplichtige aantoont dat de gegevens
      met betrekking tot de samenstelling van het preparaat onderscheidenlijk van de bestanddelen daarvan, met vermelding
      van de chemische naam volgens de nomenclatuur van de International Union of Pure and Applied Chemistry of met
      vermelding van het nummer waaronder deze bestanddelen in het register van de Chemical Abstracts Service of van
      de European inventory of existing commercial chemical substances (*PbEG* 1990 C 146A) zijn opgenomen, reeds zijn
      verstrekt aan Onze Minister of deze gegevens reeds ingevolge dit besluit worden geadministreerd.

      3 Indien de bestanddelen van het preparaat behoren tot een categorie, genoemd in bijlage I van de EG-verordening
      indeling, etikettering en verpakking van stoffen en mengsels, dient de administratieplichtige ten aanzien van
      wie het tweede lid van toepassing is, de bij het preparaat behorende benaming van het gevaar of de gevaren,
      het bijbehorende symbool of de symbolen en de verwijzing naar de bijzondere aan het gebruik van het preparaat
      verbonden gevaren, bedoeld in de EG-verordening indeling, etikettering en verpakking van stoffen en mengsels, te
      administreren.
    url: https://wetten.overheid.nl/BWBR0004321/2010-12-01#Artikel2
  - number: '3'
    text: |-
      1 De administratieplichtige dient de gegevens, bedoeld in de [artikelen 1a][ref1] en [2][ref2], op zodanige wijze
      te administreren dat hij deze over de periode gedurende welke de bewaarplicht ingevolge het derde lid, geldt,
      indien Onze Minister daarom verzoekt, binnen vier weken schriftelijk kan overleggen, gespecificeerd per stof
      onderscheidenlijk preparaat, per afnemer en per kalenderjaar.

      2 De administratieplichtige kan, in afwijking van het eerste lid, voor stoffen, al dan niet verwerkt in een
      preparaat, die zijn bestemd voor particuliere huishoudens of voor afnemers in het buitenland volstaan met een
      zodanige wijze van administreren van gegevens dat hij op verzoek van Onze Minister binnen vier weken schriftelijk
      opgave kan doen van de totale hoeveelheid die hij van een stof in een kalenderjaar aan elk van de genoemde
      categorieën van gebruikers ter beschikking heeft gesteld.

      3 De administratieplichtige dient de gegevens, bedoeld in het eerste, onderscheidenlijk het tweede lid, te bewaren
      gedurende ten minste 10 jaren vanaf het tijdstip waarop hij die gegevens krijgt.

      4 Indien toepassing wordt gegeven aan het tweede lid, dient de administratieplichtige tevens de namen en adressen
      van de afnemers van de stoffen en preparaten, bestemd voor de desbetreffende categorie van gebruikers, gedurende
      één jaar overeenkomstig het in het eerste lid bepaalde te bewaren.

      5 Met betrekking tot preparaten, ten aanzien waarvan [artikel 2, tweede lid][ref3], van toepassing is, dient
      de administratieplichtige tevens te bewaren de namen en adressen van de leveranciers over de jaren waarvoor de
      bewaarplicht ingevolge het derde lid geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0004321#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0004321#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0004321#Artikel2
