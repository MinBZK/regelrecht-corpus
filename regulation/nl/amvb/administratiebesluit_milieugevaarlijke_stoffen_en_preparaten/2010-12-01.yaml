  - number: '4'
    text: |-
      Van de administratieplicht zijn uitgezonderd:

      a. stoffen en preparaten die in Nederland worden ingevoerd en die niet in het vrije verkeer worden gebracht, tenzij
      zij binnen Nederlands grondgebied worden verwerkt of omgezet;

      b. stoffen die in de procesinstallatie waarin zij ontstaan, worden omgezet in andere stoffen zonder dat daarbij
      tussentijdse opslag plaatsvindt;

      c. gewasbeschermingsmiddelen of biociden die zijn toegelaten of vrijgesteld op grond van de
      [Wet gewasbeschermingsmiddelen en biociden][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021670
    url: https://wetten.overheid.nl/BWBR0004321/2010-12-01#Artikel4
    references:
