        bwb_id: BWBR0021670
  - number: 4a
    text: |-
      Dit besluit berust op [artikel 9.2.1.4 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9.2.1.4
