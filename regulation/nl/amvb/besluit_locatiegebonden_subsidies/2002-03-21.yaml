preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 16 juni
    1993, nr. MJZ16693021, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Gelet op artikel 81 van de Woningwet;

    Gezien het advies van de Rijksplanologische Commissie van 24 juli 1992;

    Gezien het advies van de Raad voor de Volkshuisvesting van 8 december 1992, nr. 201;

    Gezien het advies van de Raad van Advies voor de Ruimtelijke Ordening van 9 december 1992;

    De Raad van State gehoord (advies van 9 november 1993, nr. W08.93.0373);

    Gezien het nader rapport van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 25
    januari 1994, nr. MJZ25194026, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel1
  - number: 1.a
    text: |-
      regionaal openbaar lichaam: regionaal openbaar lichaam als bedoeld in de [Kaderwet bestuur in verandering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006620
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006620
  - number: 1.b
    text: 'algemeen bestuur: algemeen bestuur van een regionaal openbaar lichaam;'
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel1
  - number: 1.c
    text: |-
      budgethoudende bestuursorgaan: bestuursorgaan dat ten laste van een op voet van dit besluit toegekend budget
      subsidie kan verstrekken, en dat is het algemeen bestuur of provinciale staten;
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel1
  - number: 1.d
    text: |-
      bebouwde kom: aaneengesloten bebouwing als opgenomen in de door het Centraal Bureau voor de Statistiek ontwikkelde
      woonplaatsindeling 1971;
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel1
  - number: 1.e
    text: |-
      ontwikkelen van bouwlocaties: op bepaalde plaatsen in onderlinge samenhang bouwen van woningen en andere gebouwen,
      saneren van de bodem en aanleggen van voorzieningen op het terrein van verkeer en vervoer;
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel1
  - number: 1.f
    text: 'budgetbeherende provincie: provincie die financiële middelen op voet van dit besluit ontvangt;'
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel1
  - number: 1.g
    text: 'ontvanger: regionaal openbaar lichaam of budgetbeherende provincie;'
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel1
  - number: 1.h
    text: |-
      uitvoeringscontract: overeenkomst waarin Onze Minister, zowel in de hoedanigheid van bestuursorgaan als in die
      van vertegenwoordiger van de Staat der Nederlanden, een regionaal openbaar lichaam en de provincie waarin het
      grondgebied van dat openbaar lichaam gelegen is, zich jegens elkaar hebben verbonden tot de daarin neergelegde
      wijze van ontwikkeling van bouwlocaties op dat grondgebied;
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel1
  - number: 1.i
    text: |-
      ontwikkelingscontract: overeenkomst waarin Onze Minister, zowel in de hoedanigheid van bestuursorgaan als in die
      van vertegenwoordiger van de Staat der Nederlanden, en een budgetbeherende provincie zich jegens elkaar hebben
      verbonden tot de daarin neergelegde uitkomsten van het provinciale beleid inzake de ontwikkeling van bouwlocaties;
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel1
  - number: 1.j
    text: 'bouwgemeente: gemeente die een bouwlocatie op haar grondgebied ontwikkelt;'
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel1
  - number: 1.k
    text: |-
      rente: rendement op staatsobligaties met een resterende looptijd van drie tot vijf jaar, als bekendgemaakt door het
      Centraal Bureau voor de Statistiek, of, indien dat rendement niet door het Centraal Bureau voor de Statistiek wordt
      bekendgemaakt, het door De Nederlandsche Bank N.V. aangenomen rendement op zodanige staatsobligaties.
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel1
  - number: '2.1'
    text: |-
      Provinciale staten besteden de financiële middelen, verstrekt aan een budgetbeherende provincie, uitsluitend
      aan verstrekking van subsidie voor de ontwikkeling van bouwlocaties aan de in die provincie gelegen
      samenwerkingsgebieden als bedoeld in [artikel 2 van de Wet gemeenschappelijke regelingen][ref1], genoemd in
      [bijlage I bij dit besluit][ref2], of aan in die samenwerkingsgebieden gelegen bouwgemeenten, genoemd in die
      bijlage. Voorafgaand aan de subsidievaststelling wordt geen beschikking tot subsidieverlening gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006425
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0006425
  - number: '2.2'
    text: |-
      Bij ministeriële regeling kunnen namen van bouwgemeenten worden toegevoegd aan [bijlage I bij dit besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006425
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006425
  - number: '5.1'
    text: 'Een uitvoeringscontract omvat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel5
  - number: 5.1.a
    text: de gedurende de contractperiode op het grondgebied van het regionaal openbaar lichaam te ontwikkelen bouwlocaties;
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel5
  - number: 5.1.b
    text: |-
      het tijdstip waarop de contractperiode begint en het tijdstip waarop deze eindigt, welk laatstbedoelde tijdstip
      samenvalt met het tijdstip waarop ingevolge de aanhef van [artikel 27, eerste lid][ref1], uiterlijk kan worden
      besloten een budget in te trekken of ten nadele van de ontvanger te wijzigen;


      [ref1]: https://wetten.overheid.nl/BWBR0006425#Artikel27
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006425
        artikel: '27'
        hoofdstuk: III
        paragraaf: '4'
  - number: 5.1.c
    text: |-
      een verdeling van de contractperiode in drie tijdvakken, waarbij per tijdvak het aantal aan de woningvoorraad toe
      te voegen woningen wordt aangegeven, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel5
  - number: 5.1.c.1°
    text: het tweede tijdvak begint op 1 januari van een jaar;
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel5
  - number: 5.1.c.2°
    text: |-
      het derde tijdvak begint op het tijdstip, bedoeld in onderdeel *d*, en dat als aantal in dat tijdvak aan de
      woningvoorraad toe te voegen woningen nul wordt aangegeven, en
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel5
  - number: 5.1.c.3°
    text: |-
      zowel het eerste als het tweede tijdvak ten minste twee vijfde deel uitmaakt van de contractperiode zonder inbegrip
      van het derde tijdvak;
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel5
  - number: 5.1.d
    text: het beoogde tijdstip van voltooiing van de ontwikkeling van de bouwlocaties;
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel5
  - number: 5.1.e
    text: |-
      de wijze van afstemming in een tijdvak als bedoeld in onderdeel *c* tussen de bouw van woningen en andere gebouwen,
      de sanering van de bodem en de aanleg van voorzieningen op het terrein van verkeer en vervoer;
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel5
  - number: 5.1.f
    text: het totale aantal ten minste aan de woningvoorraad toe te voegen woningen;
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel5
  - number: 5.1.g
    text: |-
      de gehanteerde rente, waarvoor wordt uit gegaan van de gemiddelde rente over de vijf kalenderjaren die direct
      voorafgaan aan het tijdstip van ondertekening van het uitvoeringscontract, en
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel5
  - number: 5.1.h
    text: |-
      hetgeen ingevolge de [artikelen 13][ref1], [17, eerste lid, eerste en derde volzin][ref2], en
      [25, eerste lid, derde volzin][ref3], daarin dient te worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006425#Artikel13d
      [ref2]: https://wetten.overheid.nl/BWBR0006425#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0006425#Artikel25
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006425
        artikel: 13d
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0006425
        artikel: '17'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0006425
        artikel: '25'
        hoofdstuk: III
        paragraaf: '3'
  - number: '5.2'
    text: |-
      Een uitvoeringscontract voor een regionaal openbaar lichaam waarvan de gemeente Amsterdam, Rotterdam, 's-Gravenhage
      of Utrecht deel uitmaakt, omvat voorts in elk geval het aantal ten minste aan de woningvoorraad toe te voegen
      woningen voor iedere te ontwikkelen bouwlocatie binnen de bebouwde kom van de betrokken genoemde gemeente, waarop
      bedrijfsterreinen gelegen zijn die niet meer als zodanig in gebruik zijn. Een uitvoeringscontract voor een ander
      regionaal openbaar lichaam omvat voorts in elk geval het aantal aan de woningvoorraad toe te voegen woningen voor
      iedere te ontwikkelen bouwlocatie buiten de bebouwde kom.
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel5
  - number: '6.1'
    text: |-
      Een uitvoeringscontract omvat voorts in elk geval het totale aantal woningen waarmee en het aantal woningen in
      de sociale-bouwsector waarmee door de regionale openbare lichamen waarvan de gemeente Amsterdam, Rotterdam, 's-
      Gravenhage of Utrecht deel uitmaakt de woningvoorraad wordt uitgebreid door het ontwikkelen van in dat contract
      aan te geven nieuwe bouwlocaties, of waarmee door de andere regionale openbare lichamen de woningvoorraad wordt
      uitgebreid door het ontwikkelen van bouwlocaties buiten de bebouwde kom. Het in de eerste volzin bedoelde aantal
      woningen in de sociale-bouwsector is ten hoogste gelijk aan 30 procent van het totale aantal woningen waarmee de
      woningvoorraad wordt uitgebreid door het ontwikkelen van bouwlocaties als bedoeld in die volzin.
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel6
  - number: '6.2'
    text: |-
      Indien het aantal woningen in de marktsector waarmee door de in het eerste lid eerstgenoemde regionale openbare
      lichamen de woningvoorraad wordt uitgebreid door het ontwikkelen van in het uitvoeringscontract aan te geven
      bouwlocaties in en aan de stad, of waarmee door de andere regionale openbare lichamen de woningvoorraad wordt
      uitgebreid door het ontwikkelen van bouwlocaties binnen de bebouwde kom, hoger is dan 50 procent van het totale
      aantal woningen waarmee de woningvoorraad wordt uitgebreid door het ontwikkelen van die bouwlocaties, kan, in
      afwijking van het eerste lid, tweede volzin, het aandeel van de woningen in de sociale-bouwsector in het in de
      eerste volzin van dat lid bedoelde totale aantal woningen dienovereenkomstig hoger zijn dan 30 procent.
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel6
  - number: '6.3'
    text: 'Voor de toepassing van dit artikel:'
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel6
  - number: 6.3.a
    text: |-
      wordt de uitbreiding van de woningvoorraad, of van een deel daarvan, berekend door het aantal in het kader van de
      ontwikkeling van bouwlocaties daaraan toe te voegen woningen te verminderen met het aantal in dat kader daaraan te
      onttrekken woningen;
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel6
  - number: 6.3.b
    text: 'wordt onder woningen in de sociale-bouwsector verstaan:'
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel6
  - number: 6.3.b.1°
    text: |-
      de in het kader van de ontwikkeling van bouwlocaties aan de woningvoorraad toe te voegen woningen waarvan de
      geraamde kosten van het verkrijgen in eigendom niet hoger zijn dan € 91.800 en
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel6
  - number: 6.3.b.2°
    text: |-
      de op het tijdstip waarop de contractperiode begint bestaande woningen die door een gemeente of toegelaten
      instelling worden verhuurd, en de op dat tijdstip bestaande woningen die door de eigenaar worden bewoond en met
      betrekking tot welke op dat tijdstip een besluit van overheidswege tot verstrekking van, aan die eigenaar als
      begunstigde ten goede komende, subsidie ten behoeve van het verkrijgen in eigendom daarvan van toepassing is en
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel6
  - number: 6.3.c
    text: 'wordt onder woningen in de marktsector verstaan:'
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel6
  - number: 6.3.c.1°
    text: |-
      de in het kader van de ontwikkeling van bouwlocaties aan de woningvoorraad toe te voegen woningen waarvan de
      geraamde kosten van het verkrijgen in eigendom hoger zijn dan € 91.800 en
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel6
  - number: 6.3.c.2°
    text: |-
      de op het tijdstip waarop de contractperiode begint bestaande woningen die niet begrepen zijn onder de in onderdeel
      *b*, onder 2°, bedoelde woningen.
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel6
  - number: '6.4'
    text: |-
      De bedragen, genoemd in het derde lid, onderdelen *b*, onder 1°, en *c*, onder 1°, kunnen bij ministeriële
      regeling met ingang van 1 januari van enig kalenderjaar worden gewijzigd, indien daartoe aanleiding bestaat
      wegens wijziging van de prijzen in verband met het bouwen van woningen. De voor enig kalenderjaar geldende
      bedragen zijn van toepassing op de woningen voor de bouw waarvan in dat jaar een vergunning als bedoeld in
      [artikel 40, eerste lid, van de Woningwet][ref1] wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel40
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '40'
  - number: 6a
    text: 'Een ontwikkelingscontract omvat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel6a
  - number: 6a.a
    text: |-
      het tijdstip waarop de contractperiode begint en het tijdstip waarop deze eindigt, welk laatstbedoelde tijdstip
      samenvalt met het tijdstip waarop ingevolge de aanhef van [artikel 27, eerste lid][ref1], uiterlijk kan worden
      besloten een budget in te trekken of ten nadele van de ontvanger te wijzigen;


      [ref1]: https://wetten.overheid.nl/BWBR0006425#Artikel27
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0006425
        artikel: '27'
        hoofdstuk: III
        paragraaf: '4'
  - number: 6a.b
    text: |-
      een verdeling van de contractperiode in drie tijdvakken, waarbij per tijdvak het aantal woningen wordt aangegeven
      dat aan de woningvoorraad wordt toegevoegd op grond van het ontwikkelingscontract, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel6a
  - number: 6a.b.1°
    text: het tweede tijdvak begint op 1 januari van een jaar;
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel6a
  - number: 6a.b.2°
    text: |-
      het derde tijdvak begint op het tijdstip, bedoeld in onderdeel *c*, en dat als aantal in dat tijdvak aan de
      woningvoorraad toe te voegen woningen nul wordt aangegeven, en
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel6a
  - number: 6a.b.3°
    text: |-
      zowel het eerste als het tweede tijdvak ten minste twee vijfde deel uitmaakt van de contractperiode zonder inbegrip
      van het derde tijdvak;
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel6a
  - number: 6a.c
    text: het beoogde tijdstip van voltooiing van de ontwikkeling van de bouwlocaties;
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel6a
  - number: 6a.d
    text: |-
      het aantal binnen de bebouwde kom en het aantal buiten de bebouwde kom aan de woningvoorraad toe te voegen woningen
      op grond van het ontwikkelingscontract, alsmede de wijzigingen in die aantallen als gevolg van daartoe strekkende
      afspraken tussen de betrokken budgetbeherende provincie en één of meer andere budgetbeherende provincies;
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel6a
  - number: 6a.e
    text: het totale aantal ten minste aan de woningvoorraad toe te voegen woningen;
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel6a
  - number: 6a.f
    text: |-
      de gehanteerde rente, waarvoor wordt uit gegaan van de gemiddelde rente over de vijf kalenderjaren die direct
      voorafgaan aan het tijdstip van ondertekening van het ontwikkelingscontract, en
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel6a
  - number: 6a.g
    text: |-
      hetgeen ingevolge de [artikelen 13][ref1], [17, eerste lid, eerste en derde volzin][ref2], en
      [25, eerste lid, derde volzin][ref3], daarin dient te worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006425#Artikel13d
      [ref2]: https://wetten.overheid.nl/BWBR0006425#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0006425#Artikel25
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0006425
        artikel: 13d
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0006425
        artikel: '17'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0006425
        artikel: '25'
        hoofdstuk: III
        paragraaf: '3'
  - number: 13b.1
    text: |-
      Onze Minister kan gedurende de contractperiode een budget verhogen, indien een wijziging van het rijksbeleid
      inzake de volkshuisvesting of de ruimtelijke ordening, die strekt tot een intensivering van de taakstelling voor de
      woningbouw, dit naar zijn oordeel noodzakelijk maakt.
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel13b
  - number: 13b.2
    text: 'Een budget kan slechts worden verhoogd, indien de ontvanger:'
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel13b
  - number: 13b.2.a
    text: |-
      aan Onze Minister op de wijze, bedoeld in het derde lid, gegevens verstrekt ten behoeve van de berekening van een
      zodanige verhoging, welke gegevens beperkt blijven tot die woningen en bouwlocaties, welke niet bij de berekening
      van het budget voor die ontvanger betrokken zijn, en
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel13b
  - number: 13b.2.b
    text: |-
      ten genoegen van Onze Minister aannemelijk maakt dat met de voornemens tot ontwikkeling van bouwlocaties die
      blijken uit de in onderdeel *a* bedoelde gegevens, wordt voldaan aan het vierde lid.
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel13b
  - number: 13b.3
    text: |-
      Ten behoeve van de berekening van de verhoging van het budget verstrekt de ontvanger aan Onze Minister met
      gebruikmaking van een door hem vast te stellen formulier:
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel13b
  - number: 13b.3.a
    text: |-
      het aantal door de ontvanger geprojecteerde woningen dat aan de woningvoorraad wordt toegevoegd op grond van het
      uitvoeringscontract of het ontwikkelingscontract, waarbij het aantal binnen de bebouwde kom en het aantal buiten de
      bebouwde kom aan de woningvoorraad toe te voegen woningen afzonderlijk wordt aangegeven;
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel13b
  - number: 13b.3.b
    text: |-
      de uit een oogpunt van ruimtelijke ordening door de ontvanger beoogde ontwikkeling van bouwlocaties, voorzover deze
      buiten de bebouwde kom gelegen zijn;
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel13b
  - number: 13b.3.c
    text: |-
      de financiële gegevens met betrekking tot de te ontwikkelen bouwlocaties, voorzover deze buiten de bebouwde kom
      gelegen zijn, en
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel13b
  - number: 13b.3.d
    text: |-
      de gegevens inzake de door de ontvanger beoogde mate van dichtheid van de woningbouw op de te ontwikkelen
      bouwlocaties, voorzover deze buiten de bebouwde kom gelegen zijn.
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel13b
  - number: 13b.4
    text: |-
      Onze Minister berekent geen verhoogd budget voor een ander regionaal openbaar lichaam dan een regionaal openbaar
      lichaam waarvan de gemeente Amsterdam, Rotterdam, 's-Gravenhage of Utrecht deel uitmaakt, indien het algemeen
      bestuur niet ten genoegen van Onze Minister aannemelijk heeft gemaakt dat met de beoogde ontwikkeling van
      bouwlocaties:
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel13b
  - number: 13b.4.a
    text: |-
      de behoeften van de inwoners van dat openbaar lichaam op het gebied van wonen, werken en verzorging overwegend
      binnen dat openbaar lichaam zullen worden vervuld;
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel13b
  - number: 13b.4.b
    text: |-
      zo veel mogelijk voorrang wordt gegeven aan het bouwen van nieuwe woningen in of zo dicht mogelijk bij bestaand
      stedelijk gebied;
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel13b
  - number: 13b.4.c
    text: wordt gestreefd naar verscheidenheid in het aanbod van woningen naar in elk geval prijs en grootte en
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel13b
  - number: 13b.4.d
    text: |-
      een bijdrage wordt geleverd aan het behoud van open ruimten tussen het bebouwde grondgebied van dat openbaar
      lichaam en dat van de aangrenzende gemeenten.
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel13b
  - number: 13c.1
    text: |-
      De verhoging wordt berekend aan de hand van het reeds aan de ontvanger toegekende budget, overeenkomstig het
      daarover bij of krachtens dit besluit bepaalde, zoals dit luidde ten tijde van de toekenning van het budget.
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel13c
  - number: 13c.2
    text: |-
      De budgetbeherende provincies komen overeen, hoe het verhoogde budget over de provincies wordt verdeeld. Zij delen
      de overeengekomen verdeling mee aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel13c
  - number: 13d
    text: |-
      Bij verhoging van het budget voor een ontvanger worden van het betrokken uitvoeringscontract of
      ontwikkelingscontract de bepalingen inzake de aantallen te bouwen woningen en de te ontwikkelen bouwlocaties
      dienovereenkomstig gewijzigd.
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel13d
  - number: '14'
    text: |-
      Onze Minister kent een ingevolge [artikel 13b][ref1] tot stand gekomen verhoging van een budget aan de betrokken
      ontvanger toe.


      [ref1]: https://wetten.overheid.nl/BWBR0006425#Artikel13b
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006425
        artikel: 13b
        hoofdstuk: II
  - number: '17.1'
    text: |-
      Onze Minister betaalt een toegekend budget voor de ontwikkeling van bouwlocaties uit als jaarlijkse bijdrage in een
      reeks van jaarbedragen, waarvan het aantal en de hoogte in het uitvoeringscontract of ontwikkelingscontract worden
      opgenomen. Buiten de gevallen, bedoeld in de [artikelen 18][ref1] en [25, eerste lid, tweede volzin][ref2], worden
      de jaarbedragen slechts gewijzigd in overeenstemming tussen Onze Minister en het budgethoudende bestuursorgaan. De
      wijzigingen worden in het uitvoeringscontract of ontwikkelingscontract opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006425#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0006425#Artikel25
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006425
        artikel: '18'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006425
        artikel: '25'
        hoofdstuk: III
        paragraaf: '3'
  - number: '17.2'
    text: |-
      Bij de toepassing van het eerste lid houdt Onze Minister op een door hem te bepalen wijze rekening met de
      bedragen die als gevolg van toepassing van [artikel 18][ref1], [20, tweede of vijfde lid][ref2], [21][ref3],
      [23, tweede of vijfde lid][ref4], [24][ref5] of [25][ref6], of als gevolg van een onherroepelijk geworden besluit
      tot intrekking of wijziging als bedoeld in [artikel 23, zesde lid][ref7], of [27][ref8] kunnen worden verrekend
      of teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0006425#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0006425#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0006425#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0006425#Artikel23
      [ref5]: https://wetten.overheid.nl/BWBR0006425#Artikel24
      [ref6]: https://wetten.overheid.nl/BWBR0006425#Artikel25
      [ref7]: https://wetten.overheid.nl/BWBR0006425#Artikel23
      [ref8]: https://wetten.overheid.nl/BWBR0006425#Artikel27
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006425
        artikel: '18'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006425
        artikel: '20'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0006425
        artikel: '21'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0006425
        artikel: '23'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0006425
        artikel: '24'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref6
        bwb_id: BWBR0006425
        artikel: '25'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref7
        bwb_id: BWBR0006425
        artikel: '23'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref8
        bwb_id: BWBR0006425
        artikel: '27'
        hoofdstuk: III
        paragraaf: '4'
  - number: '17.3'
    text: |-
      Het eerste jaarbedrag van een budget wordt uitbetaald in het eerste kalenderjaar van de contractperiode. De
      volgende jaarbedragen worden telkens voor 1 juli van aaneengesloten daaropvolgende kalenderjaren uitbetaald.
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel17
  - number: '18.1'
    text: |-
      De nog uit te betalen jaarbedragen worden jaarlijks verhoogd of verlaagd met het percentage waarmee het
      prijsindexcijfer «Bruto investeringen door bedrijven in woningen (a)», of bij vervanging van dit prijsindexcijfer,
      het prijsindexcijfer dat hiervoor in de plaats treedt, blijkens de gegevens in het Centraal Economisch Plan van
      het Centraal Planbureau over het volgende jaar stijgt respectievelijk daalt. De verhogingen of verlagingen vinden
      steeds op 31 december plaats.
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel18
  - number: '18.2'
    text: |-
      Onze Minister kan alle eerstvolgend uit te betalen jaarbedragen met een voor al die jaarbedragen gelijk percentage
      wijzigen, indien de mate van beschikbaarheid van kasmiddelen daar naar zijn oordeel aanleiding toe geeft.
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel18
  - number: 18a
    text: |-
      Provinciale staten brengen een verordening tot stand, op voet waarvan zij subsidie als bedoeld in
      [artikel 2, eerste lid][ref1], verstrekken en die in elk geval omvat:


      [ref1]: https://wetten.overheid.nl/BWBR0006425#Artikel2
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0006425
        artikel: '2'
        hoofdstuk: I
  - number: 18a.a
    text: regels inzake de wijze van aanvragen van die subsidie;
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel18a
  - number: 18a.b
    text: de bij de aanvraag over te leggen gegevens en bescheiden;
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel18a
  - number: 18a.c
    text: de termijnen voor de beslissing omtrent de aanvraag;
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel18a
  - number: 18a.d
    text: de gronden om die subsidie niet te verstrekken;
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel18a
  - number: 18a.e
    text: |-
      de verplichtingen die gelden ingevolge [artikel 18][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006425#Artikel18b
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0006425
        artikel: 18b
        hoofdstuk: III
        paragraaf: 1a
  - number: 18a.f
    text: de overige verplichtingen die gelden bij het verstrekken van die subsidie;
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel18a
  - number: 18a.g
    text: regels inzake de berekening van het bedrag van die subsidie;
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel18a
  - number: 18a.h
    text: |-
      de termijnen voor en de wijze van uitbrengen van het verslag, bedoeld in [artikel 18][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006425#Artikel18b
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0006425
        artikel: 18b
        hoofdstuk: III
        paragraaf: 1a
  - number: 18a.i
    text: de termijnen voor en de wijze van melden van de voltooiing van de ontwikkeling van de bouwlocaties en
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel18a
  - number: 18a.j
    text: de wijze en het tijdstip of de tijdstippen van uitbetalen van die subsidie.
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel18a
  - number: 18b.1
    text: |-
      Bij het verstrekken van subsidie als bedoeld in [artikel 2, eerste lid][ref1], gelden de verplichtingen dat:


      [ref1]: https://wetten.overheid.nl/BWBR0006425#Artikel2
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0006425
        artikel: '2'
        hoofdstuk: I
  - number: 18b.1.a
    text: die subsidie uitsluitend wordt ingezet ter bestrijding van de grondkosten bij de ontwikkeling van bouwlocaties;
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel18b
  - number: 18b.1.b
    text: |-
      ten hoogste 30 procent van het aantal woningen waarmee de woningvoorraad, conform het ontwikkelingscontract, wordt
      uitgebreid door het ontwikkelen van bouwlocaties buiten de bebouwde kom, behoort tot de woningen in de sociale-
      bouwsector, en
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel18b
  - number: 18b.1.c
    text: |-
      aan provinciale staten jaarlijks een verslag wordt uitgebracht over de voortgang van de ontwikkeling van de
      bouwlocaties waarvoor die subsidie wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel18b
  - number: 18b.2
    text: |-
      Indien het aantal woningen in de marktsector waarmee de woningvoorraad wordt uitgebreid door het ontwikkelen van
      bouwlocaties binnen de bebouwde kom op grond van het ontwikkelingscontract, hoger is dan 50 procent van het totale
      aantal woningen waarmee de woningvoorraad op die wijze wordt uitgebreid, kan, in afwijking van het eerste lid,
      aanhef en onderdeel *b*, het aandeel van de woningen in de sociale-bouwsector in het in genoemd onderdeel bedoelde
      aantal woningen dienovereenkomstig hoger zijn dan 30 procent.
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel18b
  - number: 18b.3
    text: |-
      Voor de toepassing van het eerste lid, onderdeel *b*, en het tweede lid wordt de in die bepalingen
      bedoelde uitbreiding van de woningvoorraad op een gelijke wijze berekend als neergelegd in
      [artikel 6, derde lid, onderdeel ][ref1], en wordt onder woningen in de sociale-bouwsector en woningen in de
      marktsector hetzelfde verstaan als hetgeen daaronder in [artikel 6, derde lid, onderdelen ][ref2], wordt verstaan.
      [Artikel 6, vierde lid, tweede volzin][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006425#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0006425#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0006425#Artikel6
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0006425
        artikel: '6'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0006425
        artikel: '6'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0006425
        artikel: '6'
        hoofdstuk: I
  - number: '19'
    text: |-
      Het budgethoudende bestuursorgaan brengt jaarlijks voor 1 april, voor het eerst in het tweede kalenderjaar
      van de contractperiode, op een formulier volgens het model in [bijlage II bij dit besluit][ref1], aan Onze
      Minister verslag uit over de voortgang van de ontwikkeling van de in het betrokken uitvoeringscontract
      genoemde bouwlocaties, respectievelijk van de bouwlocaties, genoemd in dan wel ter uitvoering van het
      ontwikkelingscontract. In afwijking in zoverre van de eerste volzin wordt, indien in het eindrapport, bedoeld in
      [artikel 26, eerste lid][ref2], niet is gemeld dat de ontwikkeling van de bouwlocaties op het grondgebied van de
      ontvanger is voltooid, het in die volzin bedoelde verslag over het laatste kalenderjaar van de contractperiode
      uitgebracht binnen vier weken na die voltooiing.


      [ref1]: https://wetten.overheid.nl/BWBR0006425
      [ref2]: https://wetten.overheid.nl/BWBR0006425#Artikel26
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006425
      - id: ref2
        bwb_id: BWBR0006425
        artikel: '26'
        hoofdstuk: III
        paragraaf: '3'
  - number: '20.1'
    text: |-
      Onze Minister bevestigt binnen vier weken de ontvangst van het verslag, bedoeld in
      [artikel 19, eerste volzin][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006425#Artikel19
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0006425
        artikel: '19'
        hoofdstuk: III
        paragraaf: '2'
  - number: '20.2'
    text: |-
      Indien het verslag niet tijdig of naar het oordeel van Onze Minister onvolledig is uitgebracht, geeft hij daarvan
      kennis aan het budgethoudende bestuursorgaan in de ontvangstbevestiging, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel20
  - number: '20.3'
    text: |-
      Onze Minister stelt bij de in het tweede lid bedoelde kennisgeving een termijn van ten hoogste acht weken binnen
      welke het verslag alsnog moet worden uitgebracht of aangevuld.
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel20
  - number: '20.4'
    text: Door een kennisgeving als bedoeld in het tweede lid wordt de uitbetaling van het budget opgeschort.
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel20
  - number: '20.5'
    text: |-
      De opschorting wordt opgeheven op het tijdstip waarop naar het oordeel van Onze Minister blijkt dat het
      budgethoudende bestuursorgaan het verslag alsnog heeft uitgebracht of aangevuld. De door de opschorting niet
      uitbetaalde jaarbedragen worden terstond na de opheffing van de opschorting uitbetaald, of zo spoedig als daarvoor
      kasmiddelen beschikbaar zijn, doch uiterlijk zes maanden na die opheffing.
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel20
  - number: '22.1'
    text: |-
      Het budgethoudende bestuursorgaan brengt binnen dertien weken na het verloop van het eerste van de drie tijdvakken,
      bedoeld in [artikel 5, eerste lid, onderdeel ][ref1], of [6 ][ref2], op een formulier volgens het model in bijlage
      III A bij dit besluit, aan Onze Minister een tussenrapport uit over de voortgang van de ontwikkeling van de in het
      betrokken uitvoeringscontract genoemde bouwlocaties, respectievelijk van de bouwlocaties genoemd in dan wel ter
      uitvoering van het ontwikkelingscontract.


      [ref1]: https://wetten.overheid.nl/BWBR0006425#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006425#Artikel6
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006425
        artikel: '5'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0006425
        artikel: '6'
        hoofdstuk: I
  - number: '22.2'
    text: 'Van het tussenrapport maken deel uit:'
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel22
  - number: 22.2.a
    text: |-
      een vergelijking tussen de rente, bedoeld in [artikel 5, eerste lid, onderdeel ][ref1], of [6][ref2], en de rente
      over het eerste van de drie tijdvakken, bedoeld in [artikel 5, eerste lid, onderdeel ][ref3], respectievelijk
      [6][ref4] voor welke laatstbedoelde rente wordt uit gegaan van de gemiddelde rente over de vijf kalenderjaren die
      direct voorafgaan aan het begin van het tweede van die drie tijdvakken, en


      [ref1]: https://wetten.overheid.nl/BWBR0006425#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006425#Artikel6a
      [ref3]: https://wetten.overheid.nl/BWBR0006425#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0006425#Artikel6a
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006425
        artikel: '5'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0006425
        artikel: 6a
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0006425
        artikel: '5'
        hoofdstuk: I
      - id: ref4
        bwb_id: BWBR0006425
        artikel: 6a
        hoofdstuk: I
  - number: 22.2.b
    text: |-
      een uiteenzetting over het beleid dat door het budgethoudende bestuursorgaan is gevoerd ten aanzien van het
      tegengaan van misbruik en oneigenlijk gebruik van ingevolge dit besluit verstrekte subsidie.
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel22
  - number: '22.3'
    text: |-
      Het tussenrapport gaat vergezeld van een verklaring omtrent de getrouwheid van dat rapport, omtrent de getrouwe
      naleving van de gestelde voorwaarden en omtrent de getrouwe naleving van het uitvoeringscontract of het
      ontwikkelingscontract, voor zover de inhoud daarvan uitvoering geeft aan de [artikelen 5][ref1] en [6][ref2],
      respectievelijk aan [artikel 6][ref3], welke verklaring wordt afgegeven door een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref4]. De verklaring wordt opgesteld met
      inachtneming van de bijlagen IV A en IV B bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0006425#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006425#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0006425#Artikel6a
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006425
        artikel: '5'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0006425
        artikel: '6'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0006425
        artikel: 6a
        hoofdstuk: I
      - id: ref4
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '22.4'
    text: |-
      De verklaring, bedoeld in het derde lid, gaat vergezeld van het rapport van bevindingen, bedoeld in punt 3 van het
      onderdeel, getiteld «Richtlijnen», van bijlage IV A bij dit besluit.
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel22
  - number: '23.1'
    text: |-
      Onze Minister bevestigt binnen vier weken de ontvangst van het tussenrapport, bedoeld in
      [artikel 22, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006425#Artikel22
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0006425
        artikel: '22'
        hoofdstuk: III
        paragraaf: '3'
  - number: '23.2'
    text: |-
      Indien het tussenrapport niet tijdig of naar het oordeel van Onze Minister onvolledig is uitgebracht, geeft hij
      daarvan kennis aan het budgethoudende bestuursorgaan in de ontvangstbevestiging, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel23
  - number: '23.3'
    text: |-
      Onze Minister stelt bij de in het tweede lid bedoelde kennisgeving een termijn van ten hoogste acht weken binnen
      welke het tussenrapport alsnog moet worden uitgebracht of aangevuld.
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel23
  - number: '23.4'
    text: Door een kennisgeving als bedoeld in het tweede lid wordt de uitbetaling van het budget opgeschort.
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel23
  - number: '23.5'
    text: |-
      De opschorting wordt opgeheven op het tijdstip waarop naar het oordeel van Onze Minister blijkt dat het
      budgethoudende bestuursorgaan het tussenrapport alsnog heeft uitgebracht of aangevuld, tenzij Onze Minister
      van oordeel is dat toepassing zou moeten worden gegeven aan [artikel 24, eerste lid][ref1], in welk geval op
      de opheffing van de opschorting het tweede lid van dat artikel van toepassing is. De door de opschorting niet
      uitbetaalde jaarbedragen worden terstond na de opheffing van de opschorting uitbetaald, of zo spoedig als daarvoor
      kasmiddelen beschikbaar zijn, doch uiterlijk zes maanden na die opheffing.


      [ref1]: https://wetten.overheid.nl/BWBR0006425#Artikel24
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0006425
        artikel: '24'
        hoofdstuk: III
        paragraaf: '3'
  - number: '23.6'
    text: |-
      Indien het budgethoudende bestuursorgaan een jaar na het verloop van de termijn, genoemd in
      [artikel 22, eerste lid][ref1], het tussenrapport niet heeft uitgebracht of aangevuld, kan Onze Minister het
      besluit tot toekenning van het budget intrekken of ten nadele van de ontvanger wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0006425#Artikel22
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0006425
        artikel: '22'
        hoofdstuk: III
        paragraaf: '3'
  - number: '24.1'
    text: |-
      Indien uit het tussenrapport, bedoeld in [artikel 22, eerste lid][ref1], naar het oordeel van Onze Minister blijkt
      dat het aantal woningen, bedoeld in [artikel 5, eerste lid, onderdeel ][ref2], of [6][ref3], aanhef, niet aan de
      woningvoorraad is toegevoegd, kan Onze Minister de uitbetaling van het budget opschorten.


      [ref1]: https://wetten.overheid.nl/BWBR0006425#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0006425#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0006425#Artikel6a
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0006425
        artikel: '22'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006425
        artikel: '5'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0006425
        artikel: 6a
        hoofdstuk: I
  - number: '24.2'
    text: |-
      De opschorting wordt opgeheven op het tijdstip waarop naar het oordeel van Onze Minister blijkt dat het
      budgethoudende bestuursorgaan alsnog aan het in het eerste lid bedoelde onderdeel van het betrokken contract
      voldoet. De door de opschorting niet uitbetaalde jaarbedragen worden terstond na de opheffing van de opschorting
      uitbetaald, of zo spoedig als daarvoor kasmiddelen beschikbaar zijn, doch uiterlijk zes maanden na die opheffing.
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel24
  - number: '25.1'
    text: |-
      Het budget wordt als gevolg van een vergelijking als bedoeld in [artikel 22, tweede lid, onderdeel ][ref1],
      verhoogd of verlaagd, indien de gemiddelde rente over het eerste van de drie tijdvakken, bedoeld in
      [artikel 5, eerste lid, onderdeel ][ref2], of[ 6][ref3], aanhef, meer dan één procentpunt afwijkt van de rente,
      bedoeld in [artikel 5, eerste lid, onderdeel g][ref4], respectievelijk [6][ref5]. Bij een zodanige verhoging of
      verlaging wordt het aantal of de hoogte van de jaarbedragen, bedoeld in [artikel 17, eerste lid][ref6], gewijzigd.
      De wijzigingen worden in het uitvoeringscontract of ontwikkelingscontract opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006425#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0006425#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0006425#Artikel6a
      [ref4]: https://wetten.overheid.nl/BWBR0006425#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0006425#Artikel6a
      [ref6]: https://wetten.overheid.nl/BWBR0006425#Artikel17
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0006425
        artikel: '22'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006425
        artikel: '5'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0006425
        artikel: 6a
        hoofdstuk: I
      - id: ref4
        bwb_id: BWBR0006425
        artikel: '5'
        hoofdstuk: I
      - id: ref5
        bwb_id: BWBR0006425
        artikel: 6a
        hoofdstuk: I
      - id: ref6
        bwb_id: BWBR0006425
        artikel: '17'
        hoofdstuk: III
        paragraaf: '1'
  - number: '25.2'
    text: |-
      Voor elk vol procentpunt dat de afwijking, bedoeld in het eerste lid, bedraagt, bedraagt de verhoging of
      verlaging, bedoeld in dat lid, 1,56 procent van de som van de ingevolge [artikel 17, eerste lid][ref1], in het
      uitvoeringscontract of ontwikkelingscontract opgenomen jaarbedragen voor het tweede van de drie tijdvakken, bedoeld
      in [artikel 5, eerste lid, onderdeel ][ref2], of [6][ref3], aanhef. Het in de eerste volzin genoemde percentage
      kan bij ministeriële regeling worden gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0006425#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0006425#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0006425#Artikel6a
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0006425
        artikel: '17'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006425
        artikel: '5'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0006425
        artikel: 6a
        hoofdstuk: I
  - number: '26.1'
    text: |-
      Het budgethoudende bestuursorgaan brengt binnen dertien weken na het tijdstip waarop ingevolge het
      uitvoeringscontract of het ontwikkelingscontract de ontwikkeling van de bouwlocaties op het grondgebied van de
      ontvanger dient te zijn voltooid, op een formulier volgens het model in bijlage III B bij dit besluit, aan Onze
      Minister een eindrapport uit over die voltooiing.
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel26
  - number: '26.2'
    text: |-
      [Artikel 22, tweede lid, aanhef en onderdeel ][ref1] juncto bijlagen IV A en IV B bij dit besluit, en vierde lid,
      is van overeenkomstige toepassing, indien in het eindrapport, bedoeld in het eerste lid, de voltooiing van de
      ontwikkeling van de bouwlocaties op het grondgebied van de ontvanger wordt gemeld.


      [ref1]: https://wetten.overheid.nl/BWBR0006425#Artikel22
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0006425
        artikel: '22'
        hoofdstuk: III
        paragraaf: '3'
  - number: '26.3'
    text: |-
      [Artikel 23][ref1] is van overeenkomstige toepassing, met dien verstande dat van het vijfde lid, eerste volzin, de
      zinsnede die begint met ", tenzij Onze Minister" en die eindigt met "van toepassing is" niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0006425#Artikel23
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0006425
        artikel: '23'
        hoofdstuk: III
        paragraaf: '3'
  - number: '27.1'
    text: |-
      Onze Minister kan, uiterlijk zes maanden na de ontvangst van het volledige in [artikel 26, eerste lid][ref1],
      bedoelde eindrapport, een besluit tot toekenning van een budget intrekken of ten nadele van de ontvanger wijzigen,
      indien uit dat rapport, of uit de uitgebrachte eindrapporten gezamenlijk naar zijn oordeel blijkt dat:


      [ref1]: https://wetten.overheid.nl/BWBR0006425#Artikel26
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0006425
        artikel: '26'
        hoofdstuk: III
        paragraaf: '3'
  - number: 27.1.a
    text: |-
      een regionaal openbaar lichaam zich niet heeft gehouden aan één of meer van de onderdelen van het
      uitvoeringscontract, bedoeld in de [artikelen 5, eerste lid, onderdelen ][ref1], en [6, eerste lid][ref2], aan
      [artikel 6, tweede lid][ref3], en het algemeen bestuur in het eindrapport niet ten genoegen van Onze Minister
      aannemelijk heeft gemaakt dat dat openbaar lichaam zich alsnog aan die bepalingen zal houden;


      [ref1]: https://wetten.overheid.nl/BWBR0006425#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006425#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0006425#Artikel6
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0006425
        artikel: '5'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0006425
        artikel: '6'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0006425
        artikel: '6'
        hoofdstuk: I
  - number: 27.1.b
    text: |-
      in een regionaal openbaar lichaam waarvan Amsterdam, Rotterdam, 's-Gravenhage of Utrecht deel uitmaakt, de
      toeslag, bedoeld in [artikel 8, tweede lid, tweede volzin][ref1], zoals die luidde op 31 december 1999, niet of
      niet volledig is besteed aan het ontwikkelen van bouwlocaties in de gemeenten Amsterdam, Rotterdam, 's-Gravenhage
      of Utrecht op laatstelijk voor 1 januari 1990 in gebruik zijnde bedrijfsterreinen, tenzij die gemeente van die
      besteding heeft afgezien ten gunste van een andere bouwgemeente die van het betrokken regionaal openbaar lichaam
      deel uitmaakt en die toeslag heeft besteed aan het ontwikkelen van bouwlocaties met laatstelijk voor 1 januari 1990
      in gebruik zijnde bedrijfsterreinen.


      [ref1]: https://wetten.overheid.nl/BWBR0006425#Artikel8
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0006425
        artikel: '8'
        hoofdstuk: I
        afdeling: '2'
  - number: 27.1.c
    text: |-
      een budgetbeherende provincie zich niet heeft gehouden aan [artikel 2, eerste lid][ref1], aan het onderdeel van het
      ontwikkelingscontract, bedoeld in [artikel 6][ref2], of aan [artikel 18][ref3], of niet de hand heeft gehouden aan
      de naleving van [artikel 18][ref4], en provinciale staten in het eindrapport niet ten genoegen van Onze Minister
      aannemelijk hebben gemaakt dat die provincie zich alsnog aan die bepalingen zal houden respectievelijk aan die
      naleving de hand zal houden, of


      [ref1]: https://wetten.overheid.nl/BWBR0006425#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006425#Artikel6a
      [ref3]: https://wetten.overheid.nl/BWBR0006425#Artikel18a
      [ref4]: https://wetten.overheid.nl/BWBR0006425#Artikel18b
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0006425
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0006425
        artikel: 6a
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0006425
        artikel: 18a
        hoofdstuk: III
        paragraaf: 1a
      - id: ref4
        bwb_id: BWBR0006425
        artikel: 18b
        hoofdstuk: III
        paragraaf: 1a
  - number: 27.1.d
    text: |-
      een budgetbeherende provincie die zich heeft gehouden aan [artikel 6][ref1], binnen de bebouwde kom minder woningen
      aan de woningvoorraad heeft toegevoegd dan het ingevolge [artikel 6][ref2], in het ontwikkelingscontract opgenomen
      aantal binnen de bebouwde kom daaraan toe te voegen woningen, en het door de budgetbeherende provincies gezamenlijk
      binnen de bebouwde kom daaraan toegevoegde woningen lager is dan het aantal door die provincies gezamenlijk in het
      kader van de ontwikkeling van bouwlocaties binnen de bebouwde kom aan de woningvoorraad toe te voegen woningen.


      [ref1]: https://wetten.overheid.nl/BWBR0006425#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0006425#Artikel6a
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0006425
        artikel: 6a
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0006425
        artikel: 6a
        hoofdstuk: I
  - number: '27.2'
    text: |-
      Onze Minister kan een besluit tot toekenning van een budget voorts intrekken of ten nadele van de ontvanger
      wijzigen, indien de gegevens op grond waarvan het budget is toegekend zodanig onjuist blijken te zijn, dat, waren
      de juiste gegevens bekend geweest, een ander besluit zou zijn genomen.
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel27
  - number: 27a.1
    text: |-
      Onze Minister stelt de hoogte van het in te trekken of op het budget in mindering te brengen bedrag vast, waarbij
      hij ten aanzien van de budgetbeherende provincies het tweede tot en met vierde lid in acht neemt.
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel27a
  - number: 27a.2
    text: 'Het ingevolge het eerste lid vast te stellen bedrag wordt berekend:'
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel27a
  - number: 27a.2.a
    text: |-
      indien niet is voldaan aan het onderdeel van het ontwikkelingscontract, bedoeld in [artikel 6][ref1] en


      [ref1]: https://wetten.overheid.nl/BWBR0006425#Artikel6a
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0006425
        artikel: 6a
        hoofdstuk: I
  - number: 27a.2.a.1°
    text: |-
      dit uitsluitend is terug te voeren op het in onvoldoende mate buiten de bebouwde kom aan de woningvoorraad
      toevoegen van woningen: volgens de formule (q . r) en het vierde lid;
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel27a
  - number: 27a.2.a.2°
    text: |-
      dit uitsluitend is terug te voeren op het in onvoldoende mate binnen de bebouwde kom aan de woningvoorraad
      toevoegen van woningen: volgens de formule (p . € 1 361,34) - (q . r) en het vierde lid, en
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel27a
  - number: 27a.2.a.3°
    text: |-
      dit op de beide situaties, bedoeld onder 1° en 2°, is terug te voeren: volgens de formule (p . € 1 361,34) + (q .
      r) en het vierde lid, of
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel27a
  - number: 27a.2.b
    text: |-
      indien [artikel 27, eerste lid, onderdeel d][ref1], van toepassing is: volgens de formule \(s . € 1 361,34) . (p/
      pg)\ - (t . r) en het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006425#Artikel27
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0006425
        artikel: '27'
        hoofdstuk: III
        paragraaf: '4'
  - number: 27a.3
    text: 'In de formules, genoemd in het tweede lid en dit lid, stelt voor:'
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel27a
  - number: '27a.3.p:'
    text: |-
      het verschil tussen het aantal volgens het ontwikkelingscontract binnen de bebouwde kom aan de woningvoorraad toe
      te voegen woningen in de betrokken provincie en het aantal feitelijk op grond van dat ontwikkelingscontract binnen
      de bebouwde kom daaraan toegevoegde woningen in die provincie;
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel27a
  - number: '27a.3.q:'
    text: |-
      het verschil tussen het aantal volgens het ontwikkelingscontract buiten de bebouwde kom aan de woningvoorraad toe
      te voegen woningen in de betrokken provincie en het aantal feitelijk op grond van dat ontwikkelingscontract buiten
      de bebouwde kom daaraan toegevoegde woningen in die provincie, welk verschil voor de toepassing van het eerste lid,
      onderdeel *a*, onder 1°, niet hoger wordt gesteld dan het verschil tussen het aantal, bedoeld in [artikel 6][ref1],
      en het aantal feitelijk op grond van dat ontwikkelingscontract aan de woningvoorraad toegevoegde woningen in die
      provincie;


      [ref1]: https://wetten.overheid.nl/BWBR0006425#Artikel6a
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0006425
        artikel: 6a
        hoofdstuk: I
  - number: '27a.3.r:'
    text: |-
      het aan de budgetbeherende provincies gezamenlijk toegekende budget, berekend overeenkomstig het bepaalde bij of
      krachtens dit besluit, zoals dit luidde op 31 december 1999, verminderd met het bedrag dat wordt verkregen door het
      aantal door die provincies gezamenlijk in het kader van de ontwikkeling van bouwlocaties binnen de bebouwde kom aan
      de woningvoorraad toe te voegen woningen te vermenigvuldigen met € 1 361,34, en vervolgens gedeeld door het aantal
      volgens de ontwikkelingscontracten gezamenlijk buiten de bebouwde kom aan de woningvoorraad toe te voegen woningen
      in de budgetbeherende provincies gezamenlijk;
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel27a
  - number: '27a.3.s:'
    text: |-
      het verschil tussen het aantal door de budgetbeherende provincies gezamenlijk in het kader van de ontwikkeling
      van bouwlocaties binnen de bebouwde kom aan de woningvoorraad toe te voegen woningen, en het aantal feitelijk op
      grond van het ontwikkelingscontract binnen de bebouwde kom aan de woningvoorraad toegevoegde aantal woningen in de
      budgetbeherende provincies gezamenlijk;
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel27a
  - number: '27a.3.pg:'
    text: |-
      het verschil tussen het aantal volgens de betrokken ontwikkelingscontracten gezamenlijk binnen de bebouwde kom aan
      de woningvoorraad toe te voegen woningen in de betrokken provincies gezamenlijk en het aantal feitelijk binnen de
      bebouwde kom daaraan toegevoegde woningen in die provincies, en
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel27a
  - number: '27a.3.t:'
    text: de uitkomst van de berekening van de factor q, dan wel, indien die lager is, de uitkomst van de formule (s . p/pg).
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel27a
  - number: 27a.4
    text: |-
      Een volgens het tweede en derde lid berekend bedrag wordt verhoogd of verlaagd met het percentage waarmee, door de
      toepassingen van de [artikelen 18][ref1] en [25][ref2] tot het tijdstip van de intrekking of wijziging, bedoeld in
      [artikel 27, eerste lid][ref3], de betrokken jaarbedragen hoger of lager zijn komen te liggen dan de oorspronkelijk
      in het ontwikkelingscontract opgenomen jaarbedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0006425#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0006425#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0006425#Artikel27
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0006425
        artikel: '18'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006425
        artikel: '25'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0006425
        artikel: '27'
        hoofdstuk: III
        paragraaf: '4'
  - number: '28.1'
    text: |-
      Indien in het eindrapport, bedoeld in [artikel 26, eerste lid][ref1], niet is gemeld dat de ontwikkeling
      van de bouwlocaties op het grondgebied van de ontvanger is voltooid, meldt het budgethoudende bestuursorgaan
      die voltooiing aan Onze Minister binnen vier weken na die voltooiing, op een formulier volgens het model in
      [bijlage III B bij dit besluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006425#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0006425
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0006425
        artikel: '26'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006425
  - number: '28.2'
    text: |-
      [Artikel 22, tweede lid, aanhef en onderdeel ][ref1] juncto [bijlagen IV A][ref2] en [IV B bij dit besluit][ref3],
      en vierde lid, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006425#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0006425
      [ref3]: https://wetten.overheid.nl/BWBR0006425
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0006425
        artikel: '22'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006425
      - id: ref3
        bwb_id: BWBR0006425
  - number: '28.3'
    text: |-
      [Artikel 23][ref1] is van overeenkomstige toepassing, met dien verstande dat van het vijfde lid, eerste volzin, de
      zinsnede die begint met ", tenzij Onze Minister" en die eindigt met "van toepassing is" niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0006425#Artikel23
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0006425
        artikel: '23'
        hoofdstuk: III
        paragraaf: '3'
  - number: '28.4'
    text: |-
      [Artikel 27, eerste lid][ref1], is van overeenkomstige toepassing, met dien verstande dat van onderdeel a de
      zinsnede die begint met ", en het algemeen bestuur" en die eindigt met "zal houden", en van onderdeel *c* de
      zinsnede die begint met "en provinciale staten" en die eindigt met "de hand zal houden," niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0006425#Artikel27
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0006425
        artikel: '27'
        hoofdstuk: III
        paragraaf: '4'
  - number: '29.1'
    text: |-
      Onze Minister kan van dit besluit of de daarop berustende bepalingen afwijken of afwijking daarvan toestaan ten
      behoeve van experimenten die naar zijn oordeel in het belang van de volkshuisvesting zijn.
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel29
  - number: '29.2'
    text: |-
      Onze Minister kan bepalen dat een afwijking als bedoeld in het eerste lid van kracht blijft in gevallen dat
      het experiment is afgesloten, hij dat experiment als zodanig geslaagd beschouwt, dat dit naar zijn oordeel tot
      wijziging van dit besluit zou moeten leiden, en die wijziging nog niet van kracht is geworden en in werking is
      getreden.
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel29
  - number: '32'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel32
  - number: '33'
    text: 'Dit besluit wordt aangehaald als: Besluit locatiegebonden subsidies.'
    url: https://wetten.overheid.nl/BWBR0006425/2002-03-21#Artikel33
