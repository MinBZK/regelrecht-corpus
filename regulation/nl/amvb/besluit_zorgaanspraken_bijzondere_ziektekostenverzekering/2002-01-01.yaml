  - number: '4'
    text: >-
      1 Dieetadvisering omvat voorlichting met een medisch doel over voeding en eetgewoonten door een instelling.


      2 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de inhoud, omvang en voorwaarden
      voor het verkrijgen van de zorg, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005283/2002-01-01#Artikel4
  - number: '9'
    text: |-
      1 Opneming en verder verblijf in een ziekenhuis, niet zijnde een psychiatrisch ziekenhuis als bedoeld in
      [artikel 20][ref1] of een psychiatrische afdeling van een algemeen of academisch ziekenhuis als bedoeld in
      [artikel 20][ref2], omvat onderzoek en behandeling van genees-, heel- en verloskundige aard door specialisten
      alsmede de daarmee verband houdende verpleging en verblijf in een ziekenhuis.

      2 Transplantatie van weefsel en organen is slechts begrepen in de zorg, omschreven in het eerste lid, voor zover
      deze door Onze Minister is aangewezen.

      3 Aanspraak op opneming en verder verblijf bestaat slechts voor zover deze een ononderbroken periode van 365
      verpleegdagen in één of meer ziekenhuizen te boven gaat. Een onderbreking van niet langer dan 30 dagen geldt
      niet als onderbreking, doch deze dagen gelden voor de berekening van de 365 dagen evenmin als verpleegdagen.
      Indien genoemde periode is verstreken en binnen 30 dagen opnieuw opname nodig is, is er evenmin sprake van een
      onderbreking.

      4 Een verzekerde die voor rekening van de bijzondere ziektekostenverzekering verblijft in een sanatorium voor
      tuberculosepatiënten en vanuit dit sanatorium wordt overgeplaatst naar een ziekenhuis met een andere bestemming,
      heeft, zolang zijn verblijf in laatstbedoeld ziekenhuis een periode van 365 dagen niet overschrijdt, geen aanspraak
      op opneming en verder verblijf in dat ziekenhuis.

      5 Een verzekerde die voor rekening van de bijzondere ziektekostenverzekering verblijft in een psychiatrisch
      ziekenhuis of een psychiatrische afdeling van een algemeen of academisch ziekenhuis als bedoeld in
      [artikel 20][ref3], en vanuit zodanig ziekenhuis wordt overgeplaatst naar een ziekenhuis met een andere bestemming
      onderscheidenlijk naar een andere afdeling van dat algemeen of academisch ziekenhuis, heeft geen aanspraak op
      opneming en verder verblijf in dat ziekenhuis, zolang zijn verblijf in dat ziekenhuis dan wel op die andere
      afdeling een periode van 365 dagen niet overschrijdt.

      6 Onze Minister bepaalt in welke gevallen een verzekerde op opneming en verder verblijf in een ziekenhuis is
      aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0005283#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0005283#Artikel20a
      [ref3]: https://wetten.overheid.nl/BWBR0005283#Artikel20
