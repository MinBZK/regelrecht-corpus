preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 10 september 1991, DGVGZ/VMP-
    419 257, gedaan in overeenstemming met de Staatssecretaris van Sociale Zaken en Werkgelegenheid;


    Gelet op de artikelen 6, eerste en derde lid, 7, tweede, derde en vierde lid, 8, tweede lid, 10, eerste lid, 11,
    14, eerste lid, 16, eerste lid, 17, achtste lid, 45, vierde lid, en 77 van de Algemene Wet Bijzondere Ziektekosten
    (Stb. 1990, 176), artikel 8 van de Ziekenfondswet (Stb. 1986, 347) en artikel 2, tweede lid, van de Wet op de
    toegang tot ziektekostenverzekeringen (Stb. 1986, 123);


    Gezien de adviezen van de Ziekenfondsraad (adviezen van 24 augustus 1989, nr. 449, 27 september 1990, SGZ/19 438,
    GGZ/18 969, 25 april 1991, SGZ/8443, 27 juni 1991, SGZ/680, 22 augustus 1991, SGZ/14 511, SGZ/14 609, SGZ/14 610,
    GGZ/15 933), 23 augustus 1991, SGZ/15 403, 26 september 1991, ERK/9956, GGZ/17 290 en 24 oktober 1991, SEA/19 483
    en het advies van het Kontaktorgaan Landelijke Organisaties van Ziektekostenverzekeraars (advies van 12 juli 1991,
    V/330/91/WJW/EW);


    De Raad van State gehoord (advies van 30 oktober 1991, no. W13.91 0493);


    Gezien het nader rapport van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 20 november 1991, VMP-
    91404, uitgebracht in overeenstemming met de Staatssecretaris van Sociale Zaken en Werkgelegenheid;


    Hebben goedgevonden en verstaan:
