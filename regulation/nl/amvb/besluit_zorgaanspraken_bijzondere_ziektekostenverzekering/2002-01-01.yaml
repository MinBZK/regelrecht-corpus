    text: |-
      1 Onderzoek naar aangeboren stofwisselingsziekten omvat zodanig onderzoek voor daarvoor in aanmerking komende, door
      Onze Minister aan te wijzen groepen van verzekerden. Onze Minister stelt regelen met betrekking tot de inhoud en
      omvang van de in [de eerste volzin][ref1] bedoelde zorg.

      2 Het onderzoek geschiedt onder verantwoordelijkheid van een door Onze Minister aangewezen ent-administratie op een
      door Onze Minister aan te geven wijze.


