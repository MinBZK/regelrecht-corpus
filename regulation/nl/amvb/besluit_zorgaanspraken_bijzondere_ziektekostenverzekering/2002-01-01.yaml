    text: |-
      1 Zorg aan ouder en kind omvat door een instelling te leveren begeleiding, voorlichting en andere zorg tijdens
      de zwangerschap en gedurende de eerste levensjaren van het kind, waaronder begrepen periodiek systematisch
      onderzoek naar de gezondheidstoestand van het kind, doch met uitzondering van kraamzorg als omschreven in
      [artikel 17 van het Verstrekkingenbesluit ziekenfondsverzekering][ref1].

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de inhoud, omvang en voorwaarden
      voor het verkrijgen van de zorg, bedoeld in het eerste lid.


