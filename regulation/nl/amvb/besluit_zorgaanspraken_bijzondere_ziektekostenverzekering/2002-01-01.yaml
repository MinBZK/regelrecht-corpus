  - number: '11'
    text: >-
      1 Zorg te verlenen door Het Dorp van de Stichting Exploitatie Het Dorp te Arnhem omvat verzorging, verpleging,
      begeleiding of behandeling in verband met een ernstige lichamelijke handicap, al dan niet gepaard gaande met
      verblijf gedurende het etmaal.


      2 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de voorwaarden waaronder aanspraak
      bestaat op de zorg, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005283/2002-01-01#Artikel11
  - number: '12'
    text: >-
      1 Zorg te verlenen door een gezinsvervangend tehuis voor lichamelijk gehandicapten omvat begeleiding of verzorging
      gericht op bevordering van de integratie van de lichamelijk gehandicapte in de samenleving, al dan niet gepaard
      gaande met verblijf gedurende het etmaal.


      2 Op het verblijf, bedoeld in het eerste lid, bestaat aanspraak indien de verzekerde:


      a. gedurende ten minste vier dagdelen per week buiten het gezinsvervangend tehuis betaalde of onbetaalde arbeid
      verricht, een dagopleiding volgt of een dagverblijf voor gehandicapten bezoekt;


      b. door oorzaken buiten zijn persoon gelegen geen arbeid verricht, geen opleiding volgt of geen dagverblijf
      bezoekt, maar in staat kan worden geacht op korte termijn, doch uiterlijk binnen twee jaren, tot een zodanige
      dagbesteding te geraken en daartoe bereid is;


      c. de leeftijd van 40 jaren heeft bereikt en bij het bereiken daarvan in een gezinsvervangend tehuis verbleef
      en door het deelnemen aan een regeling voor vervroegde uittreding uit het arbeidsproces, het bereiken van de
      pensioengerechtigde leeftijd dan wel andere oorzaken in zijn persoon gelegen, buiten het gezinsvervangend tehuis
      geen arbeid verricht, geen opleiding volgt of geen dagverblijf bezoekt en voorafgaande aan het verder verblijf
      gedurende een aaneengesloten periode van ten minste vijf jaren zodanige dagbesteding heeft gehad.


      3 Op het verblijf, bedoeld in het eerste lid, bestaat geen aanspraak indien de verzekerde in belangrijke mate
      aangewezen is op verpleging.


      4 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de voorwaarden waaronder aanspraak
      bestaat op de zorg, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005283/2002-01-01#Artikel12
  - number: '13'
    text: >-
      1 Zorg te verlenen door een dagverblijf voor lichamelijk gehandicapten omvat onderzoek, behandeling, begeleiding
      of verzorging, gericht op bevordering of behoud van de zelfstandigheid van de lichamelijk gehandicapte in de
      maatschappij, al dan niet gepaard gaande met verblijf gedurende de dag of een deel daarvan.


      2 Indien de zorg, bedoeld in het eerste lid, gepaard gaat met verblijf gedurende de dag, omvat de zorg tevens het
      door het dagverblijf georganiseerde of geadviseerde openbare vervoer naar en van het dagverblijf.


      3 Aanspraak op de zorg, bedoeld in het eerste lid, bestaat indien de verzekerde primair een lichamelijke handicap
      heeft van een betrekkelijk statisch karakter en niet of nog niet aan onderwijs- of arbeidsvoorzieningen kan
      deelnemen of deze voorzieningen voor hem niet zijn aangewezen en wordt aangenomen dat hij een zodanige mate van
      sociale redzaamheid kan bereiken of heeft bereikt dat verblijf en integratie in de samenleving in beginsel mogelijk
      zijn.


      4 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de voorwaarden waaronder aanspraak
      bestaat op de zorg, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005283/2002-01-01#Artikel13
  - number: '14'
    text: >-
      1 Zorg te verlenen door een verpleeginrichting omvat verzorging, verpleging, begeleiding of behandeling, in verband
      met een lichamelijke of psychogeriatrische aandoening, al dan niet gepaard gaande met verblijf gedurende het etmaal
      of een deel daarvan.


      2 De zorg, bedoeld in het eerste lid, omvat tevens consultatie van een verpleeghuisarts op aanvraag van een arts
      ten behoeve van een niet in de inrichting verblijvende verzekerde.


      3 Indien de zorg, bedoeld in het eerste lid, gepaard gaat met verblijf gedurende de dag, omvat de behandeling
      tevens het door de verpleeginrichting georganiseerde vervoer.


      4 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de voorwaarden waaronder aanspraak
      bestaat op de zorg, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005283/2002-01-01#Artikel14
  - number: '15'
    text: >-
      Zorg te verlenen door een instelling voor thuiszorg omvat:


      a. verpleging, verzorging, begeleiding of voorlichting in verband met ziekte, herstel, invaliditeit of ouderdom;


      b. hulp van huishoudelijke, persoonlijke of begeleidende aard in verband met ziekte, herstel, invaliditeit,
      ouderdom, overlijden of een psychosociaal probleem, die of dat leidt of dreigt te leiden tot het disfunctioneren
      van de verzorging van het huishouden van de verzekerde dan wel van de leefeenheid waartoe de verzekerde behoort;


      c. het in bruikleen verstrekken van verpleegartikelen gedurende een termijn van ten hoogste zesentwintig weken.
    url: https://wetten.overheid.nl/BWBR0005283/2002-01-01#Artikel15
  - number: '16'
    text: >-
      1 Zorg te verlenen door een verzorgingshuis omvat verzorging, verpleging of begeleiding in verband met
      lichamelijke, psychogeriatrische of psychosociale problemen als gevolg van ouderdom, al dan niet gepaard gaande met
      verblijf gedurende het etmaal of een deel daarvan.


      2 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de voorwaarden waaronder aanspraak
      bestaat op de zorg, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005283/2002-01-01#Artikel16
  - number: '17'
    text: >-
      De echtgenoot van een persoon die op grond van een indicatiebesluit ingevolge het Zorgindicatiebesluit duurzaam in
      een verzorgingshuis verblijft, heeft eveneens aanspraak op verblijf gedurende het etmaal in dat verzorgingshuis.
    url: https://wetten.overheid.nl/BWBR0005283/2002-01-01#Artikel17
  - number: '19'
    text: |-
      1 Revalidatie omvat onderzoek, behandeling en advisering van specialistische, paramedische,
      gedragswetenschappelijke en revalidatie-technische aard, te verlenen door een aan een instelling voor revalidatie
      verbonden multidisciplinair team van deskundigen, staande onder leiding van een specialist, gepaard gaande met
      verzorging en verpleging en verblijf gedurende het etmaal in die instelling.

      2 Op revalidatie bestaat slechts aanspraak:

      a. indien deze hulp voor de verzekerde als meest doeltreffend is aangewezen ter voorkoming, vermindering of
      overwinning van een handicap die het gevolg is van stoornissen of beperkingen in het bewegingsvermogen,

      b. indien de verzekerde met die hulp in staat is een mate van zelfstandigheid te bereiken of te behouden die,
      gegeven diens beperkingen, redelijkerwijs mogelijk is,

      c. indien daarmee spoedig betere resultaten te verwachten zijn dan revalidatie zonder verblijf in een instelling
      voor revalidatie, en

      d. voor zover deze een ononderbroken periode van 365 verpleegdagen in één of meer instellingen voor revalidatie te
      boven gaat.

      3 De tweede en derde volzin van [artikel 9, derde lid][ref1], zijn voor de berekening van de periode, bedoeld in
      het tweede lid, onder *d*, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005283#Artikel9
    url: https://wetten.overheid.nl/BWBR0005283/2002-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005283
        artikel: '9'
        paragraaf: '2'
  - number: '20'
    text: >-
      1 Psychiatrische zorg te verlenen door een psychiatrisch ziekenhuis omvat:


      a. onderzoek, advisering en voorlichting, behandeling, begeleiding, verpleging of verzorging gericht op herstel
      of voorkomen van verergering van een psychiatrische stoornis, al dan niet gepaard gaande met verblijf gedurende
      het etmaal,


      b. met een pleeggezin overeengekomen verpleging in dat gezin,


      c. begeleiding en verblijf gedurende het etmaal gericht op terugkeer in de samenleving, of


      d. behandeling en verblijf gedurende het etmaal gericht op herstel van een verstoring in het dagelijks functioneren
      als gevolg van psychosociale problemen.


      2 Op de zorg, bedoeld in het eerste lid, onder c, bestaat aanspraak gedurende twee jaren, indien te verwachten
      is dat de verzekerde na afloop van die termijn zelfstandig kan wonen dan wel kan verblijven in een regionale
      instelling voor beschermd wonen. Het verblijf kan tweemaal met zesentwintig weken worden verlengd.


      3 Op de zorg, bedoeld in het eerste lid, onder d, bestaat aanspraak gedurende twaalf weken, indien te verwachten is
      dat een ambulante behandeling voor de verzekerde niet of nog niet toereikend is. Op de zorg bestaat geen aanspraak,
      indien na beëindiging van een eerder verblijf nog geen zesentwintig weken zijn verstreken.


      4 Bij ministeriële regeling kunnen regelen worden gesteld met betrekking tot de voorwaarden voor het tot gelding
      brengen van de aanspraak op de zorg, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005283/2002-01-01#Artikel20
  - number: 20a
    text: |-
      1 Zorg te verlenen door een psychiatrische afdeling van een algemeen of academisch ziekenhuis omvat de zorg,
      bedoeld in [artikel 20, eerste lid, onder a en b][ref1].

      2 Indien de zorg, bedoeld in het eerste lid, gepaard gaat met verblijf, bestaat aanspraak gedurende dertien weken,
      indien te verwachten is dat die termijn voor de verzekerde voldoende is. Het verblijf kan eenmaal met dertien weken
      worden verlengd.

      3 Bij ministeriële regeling kunnen regelen worden gesteld met betrekking tot de voorwaarden voor het tot gelding
      brengen van de aanspraak op de zorg, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005283#Artikel20
    url: https://wetten.overheid.nl/BWBR0005283/2002-01-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0005283
        artikel: '20'
        paragraaf: '5'
  - number: 20b
    text: >-
      1 Zorg te verlenen door of vanwege een regionale instelling voor ambulante geestelijke gezondheidszorg omvat
      ambulante psychosociale advisering en voorlichting, behandeling of begeleiding gericht op herstel of voorkomen van
      verergering van een verstoring in het psychosociaal functioneren.


      2 Bij ministeriële regeling kunnen regelen worden gesteld met betrekking tot de voorwaarden voor het tot gelding
      brengen van de aanspraak op de zorg, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005283/2002-01-01#Artikel20b
  - number: 20c
    text: >-
      1 Zorg te verlenen door of vanwege een regionale instelling voor beschermd wonen omvat begeleiding gericht op het
      opbouwen en onderhouden van sociale relaties, het zich eigen maken van een dagritme of het aanleren en toepassen
      van vaardigheden, al dan niet gepaard gaande met verblijf gedurende het etmaal.


      2 De aanspraak op de zorg, bedoeld in het eerste lid, bestaat indien de verzekerde ten gevolge van een
      psychiatrische stoornis beperkt is in zijn sociaal en zelfstandig functioneren.


      3 Bij ministeriële regeling kunnen regelen worden gesteld met betrekking tot de voorwaarden voor het tot gelding
      brengen van de aanspraak op de zorg, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005283/2002-01-01#Artikel20c
  - number: 20d
    text: >-
      1 Niet-klinische psychiatrische zorg te verlenen door een psychiater of zenuwarts omvat onderzoek of behandeling,
      naar omvang bepaald door hetgeen in de kring der beroepsgenoten gebruikelijk is, op verwijzing door de huisarts
      van verzekerde.


      2 Bij ministeriële regeling kunnen regelen worden gesteld met betrekking tot de voorwaarden voor het tot gelding
      brengen van de aanspraak op de zorg, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005283/2002-01-01#Artikel20d
  - number: 20e
    text: >-
      1 Zorg te verlenen door een psychiatrische polikliniek omvat onderzoek of, gedurende maximaal twee uren per dag,
      behandeling.


      2 Bij ministeriële regeling kunnen regelen worden gesteld met betrekking tot de voorwaarden voor het tot gelding
      brengen van de aanspraak op de zorg, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005283/2002-01-01#Artikel20e
  - number: 20f
    text: >-
      1 Psychiatrische deeltijdbehandeling te verlenen door een instelling voor psychiatrische deeltijdbehandeling omvat
      onderzoek, behandeling, begeleiding of verzorging, gedurende ten minste vier aaneengesloten uren en ten hoogste
      acht uren per dag.


      2 Bij ministeriële regeling kunnen regelen worden gesteld met betrekking tot de voorwaarden voor het tot gelding
      brengen van de aanspraak op de zorg, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005283/2002-01-01#Artikel20f
  - number: 20g
    text: |-
      1 Indien de zorg, bedoeld in [artikel 20d][ref1] onderscheidenlijk [artikel 20e][ref2], psychotherapeutische
      behandeling betreft, bestaat aanspraak op ten hoogste negentig zittingen van ten hoogste vijfenveertig minuten
      per zitting bij individuele psychotherapie, van ten hoogste negentig minuten per zitting bij partner-relatie
      psychotherapie en van ten hoogste honderdtwintig minuten per zitting bij gezins- en groepspsychotherapie.

      2 Op de zorg, bedoeld in het eerste lid, bestaat geen aanspraak, indien na beëindiging van een voorafgaande
      psychotherapeutische behandeling in verband met het bereiken van het aantal zittingen, bedoeld in het eerste lid,
      nog geen tweeënvijftig weken zijn verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005283#Artikel20d
      [ref2]: https://wetten.overheid.nl/BWBR0005283#Artikel20e
    url: https://wetten.overheid.nl/BWBR0005283/2002-01-01#Artikel20g
