  - number: '3'
    text: |-
      1 Voor zover gepaard gaande met verblijf gedurende het etmaal omvat de zorg, bedoeld in [de artikelen 9][ref1],
      [11][ref2], [14][ref3], [19][ref4], [20][ref5] en [23][ref6], tevens:

      a. tandheelkundige hulp;

      b. farmaceutische hulp;

      c. hulpmiddelen, noodzakelijk in verband met de in de instelling gegeven behandeling en verpleging;

      d. kleding, verband houdende met het karakter en de doelstelling van de instelling;

      e. het individueel gebruik van een rolstoel.

      2 De zorg, omschreven in [artikel 20a][ref7], voor zover gepaard gaande met verblijf gedurende het etmaal, omvat de
      zorg, bedoeld in het eerste lid, onder b tot en met e.

      3 De zorg, bedoeld in het eerste lid, aanhef, en het tweede lid omvat niet het verkrijgen van onderwijs, kleedgeld
      en zakgeld.

      4 Onze Minister kan regelen stellen met betrekking tot de omvang van en de voorwaarden voor het verkrijgen van de
      zorg, bedoeld in het eerste lid, onder a tot en met e.


