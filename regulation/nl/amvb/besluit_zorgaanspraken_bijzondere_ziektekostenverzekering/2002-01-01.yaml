      1 Zorg te verlenen door een sociaal pedagogische dienst omvat ambulante begeleiding van verstandelijk
      gehandicapten gericht op het ontwikkelen en behouden van vaardigheden, het bevorderen van de sociale redzaamheid en
      zelfstandigheid of het bevorderen van de maatschappelijke participatie en integratie.


      2 Bij ministeriële regeling kunnen nadere regelen worden gesteld met betrekking tot de omvang van en de voorwaarden
      voor het tot gelding brengen van de aanspraak op de zorg, bedoeld in het eerste lid.
