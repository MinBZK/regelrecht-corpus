  - number: '21'
    text: |-
      1 Zorg te verlenen door een instelling voor visueel gehandicapten omvat onderzoek, begeleiding of behandeling
      gericht op bevordering of behoud van de zelfstandigheid van de visueel gehandicapte, al dan niet gepaard gaande met
      verblijf gedurende het etmaal of een deel daarvan.

      2 De zorg, bedoeld in het eerste lid, omvat niet onderwijs en onderwijsbegeleiding, scholing of omscholing in het
      kader van beroepsonderwijs, geneeskundige en paramedische hulp, vervoer of voorzieningen waarvoor ingevolge de
      [Wet voorzieningen gehandicapten][ref1] het gemeentebestuur zorg dient te dragen.

      3 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de voorwaarden waaronder aanspraak
      bestaat op de zorg, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006169
    url: https://wetten.overheid.nl/BWBR0005283/2002-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0006169
  - number: '22'
    text: |-
      1 Zorg te verlenen door een instelling voor auditief of communicatief gehandicapten omvat begeleiding of
      behandeling, al dan niet gepaard gaande met verblijf gedurende het etmaal of een deel daarvan.

      2 Indien de zorg, bedoeld in het eerste lid, gepaard gaat met verblijf gedurende de dag, omvat de zorg tevens het
      door de instelling georganiseerde vervoer over een redelijke afstand naar en van de instelling.

      3 Aanspraak op de zorg, bedoeld in het eerste lid, bestaat slechts indien de verzekerde lijdt aan een
      gehoorstoornis onderscheidenlijk een spraak- of taalstoornis als gevolg van een medische oorzaak en de zorg gericht
      is op het bereiken van:

      a. een geneeskundig doel;

      b. het zo goed mogelijk kunnen ontvangen van onderwijs dan wel scholing;

      c. bevordering en behoud van de zelfstandigheid; of

      d. bespoediging van de revalidatie.

      4 De zorg, bedoeld in het eerste lid, omvat niet onderwijs en onderwijsbegeleiding, scholing of omscholing in
      het kader van beroepsonderwijs of voorzieningen waarvoor ingevolge de [Wet voorzieningen gehandicapten][ref1] het
      gemeentebestuur zorg dient te dragen.

      5 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de voorwaarden waaronder aanspraak
      bestaat op de zorg, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006169
    url: https://wetten.overheid.nl/BWBR0005283/2002-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006169
  - number: 22a
    text: >-
      1 Zorg te verlenen door een gezinsvervangend tehuis voor visueel, auditief of communicatief gehandicapten omvat
      begeleiding gericht op bevordering van de integratie van de visueel, auditief of communicatief gehandicapte in de
      samenleving, al dan niet gepaard gaande met verblijf gedurende het etmaal.


      2 Op het verblijf, bedoeld in het eerste lid, bestaat aanspraak indien de verzekerde:


      a. gedurende ten minste vier dagdelen per week buiten het gezinsvervangend tehuis betaalde arbeid verricht, een
      dagopleiding volgt of een dagverblijf voor gehandicapten bezoekt,


      b. door oorzaken buiten zijn persoon gelegen, geen arbeid verricht, geen opleiding volgt of geen dagverblijf
      bezoekt, doch in staat kan worden geacht tot een zodanige dagbesteding te geraken, of


      c. de leeftijd van 40 jaren heeft bereikten  en bij het bereiken daarvan in een gezinsvervangend tehuis verbleef
      en door het deelnemen aan een regeling voor vervroegde uittreding uit het arbeidsproces, het bereiken van de
      pensioengerechtigde leeftijd dan wel andere oorzaken in zijn persoon gelegen, buiten het gezinsvervangend tehuis
      geen arbeid verricht, geen opleiding volgt of geen dagverblijf bezoekt en voorafgaande aan het verder verblijf
      gedurende een aaneengesloten periode van ten minste vijf jaren zodanige dagbesteding heeft gehad.


      3 Op het verblijf, bedoeld in het eerste lid, bestaat geen aanspraak indien de verzekerde in belangrijke mate
      aangewezen is op verpleging.


      4 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de voorwaarden waaronder aanspraak
      bestaat op de zorg, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005283/2002-01-01#Artikel22a
  - number: '23'
    text: >-
      1 Zorg voor verstandelijk gehandicapten te verlenen door een instelling voor verstandelijk gehandicapten omvat:


      a. onderzoek, behandeling, begeleiding, verpleging of verzorging gericht op het ontwikkelen en behouden van
      vaardigheden, het bevorderen van de sociale redzaamheid en de zelfstandigheid of de bevordering van de integratie
      van de verstandelijk gehandicapte in de samenleving, al dan niet gepaard gaande met verblijf gedurende het etmaal
      of een deel daarvan, of


      b. met een pleeggezin overeengekomen verpleging in dat gezin.


      2 Bij ministeriële regeling kunnen nadere regelen worden gesteld met betrekking tot de omvang van en de voorwaarden
      voor het tot gelding brengen van de aanspraak op de zorg, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005283/2002-01-01#Artikel23
  - number: '24'
    text: >-
      1 Zorg te verlenen door een dagverblijf voor verstandelijk gehandicapten omvat onderzoek, behandeling, begeleiding,
      of verzorging, gericht op de bevordering van de zelfstandigheid of de integratie van de verstandelijk gehandicapte
      in de samenleving, al dan niet gepaard gaande met verblijf gedurende de dag of een deel daarvan,


      2 Indien de zorg, bedoeld in het eerste lid, gepaard gaat met verblijf gedurende de dag, omvat de zorg tevens het
      door het dagverblijf georganiseerde vervoer of geadviseerd openbare vervoer naar en van het dagverblijf.


      3 De aanspraak op zorg, bedoeld in het eerste lid, bestaat indien de verzekerde primair een verstandelijke handicap
      heeft van een betrekkelijk statisch karakter en niet of nog niet aan onderwijs- of arbeidsvoorzieningen kan
      deelnemen.


      4 Bij ministeriële regeling kunnen nadere regelen worden gesteld met betrekking tot de omvang van en de voorwaarden
      voor het tot gelding brengen van de aanspraak op de zorg, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005283/2002-01-01#Artikel24
