  - number: '28'
    text: >-
      1 Vaccinaties omvatten de vaccinaties, opgenomen in een door Onze Minister vast te stellen vaccinatieprogramma,
      waarin wordt aangegeven welke groepen van verzekerden voor toediening van de benoemde vaccins in aanmerking komen
      alsmede hoe de uitvoering van dat programma plaatsvindt.


      2 De uitvoering van de vaccinaties geschiedt onder verantwoordelijkheid van een door Onze Minister aangewezen ent-
      administratie.
    url: https://wetten.overheid.nl/BWBR0005283/2002-01-01#Artikel28
  - number: '33'
    text: |-
      1 Ten aanzien van de verzekerde die als gezinslid van een militair met toestemming van Onze Minister van Defensie
      in het buitenland verblijft bij de aldaar geplaatste militair en voor wie de militair ingevolge artikel 22, eerste
      lid, van de Regeling gezondheidszorg aanspraak heeft op verlening van geneeskundige verstrekkingen door de militair
      geneeskundige dienst van de Nederlandse krijgsmacht, treedt deze aanspraak voor zover de Regeling gezondheidszorg
      op hem van toepassing is, in de plaats van de aanspraken op zorg ingevolge dit besluit.

      2 Onze Minister en Onze Minister van Defensie stellen regelen vast inzake een jaarlijkse uitkering door het College
      zorgverzekeringen aan Onze Minister van Defensie ten laste van het Algemeen Fonds Bijzondere Ziektekosten in
      verband met het vervallen van aanspraken op grond van het bepaalde in [artikel 7, eerste en tweede lid][ref1], van
      de wet.

      3 Onze Minister en Onze Minister van Defensie kunnen nadere regelen vaststellen met betrekking tot de uitvoering
      van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005283#Artikel7
    url: https://wetten.overheid.nl/BWBR0005283/2002-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005283
        artikel: '7'
        paragraaf: '2'
  - number: '34'
    text: |-
      1 Aan een verzekerde wordt een uitkering gedaan ter zake van de kosten van zorg, omschreven in dit besluit,
      indien die zorg anders dan op de in [artikel 10][ref1] van de wet omschreven wijze is verkregen als gevolg van de
      navolgende omstandigheden:

      a. tijdelijk verblijf hier te lande buiten het werkgebied van het uitvoeringsorgaan;

      b. wonen in het buitenland;

      c. tijdelijk verblijf in het buitenland wegens uitoefening van bedrijf of beroep of wegens door het College
      zorgverzekeringen aan te geven redenen;

      d. niet ingeschreven zijn bij een uitvoeringsorgaan;

      e. in spoedeisende gevallen waarin uitstel redelijkerwijs niet kon worden gedoogd.

      2 In de omstandigheid, bedoeld in het eerste lid, onder *a*, bestaat aanspraak op een uitkering, mits de zorg
      is verleend door instellingen of personen, die in de verblijfplaats van de verzekerde of naaste omgeving daarvan
      praktijk uitoefenen of gevestigd zijn en ter zake van die zorg een overeenkomst met een uitvoeringsorgaan hebben
      gesloten.

      3 In de omstandigheden, bedoeld in het eerste lid, onder *b* en *c*, bestaat aanspraak op een uitkering tot een
      door het College zorgverzekeringen vast te stellen bedrag voor zorg, verleend in het land waar de verzekerde woont
      of verblijft, voor zover de verlening van de zorg redelijkerwijs niet kon worden uitgesteld tot na de terugkeer
      in Nederland.

      4 In de omstandigheden, bedoeld in het eerste lid, onder *d* en *e*, bestaat aanspraak op een uitkering, mits de
      zorg is verleend in Nederland. Het College zorgverzekeringen kan nadere voorwaarden stellen voor het verkrijgen
      van de uitkering in de omstandigheid, bedoeld in het eerste lid, onder *d*. Het College zorgverzekeringen kan
      bepalen dat premies, betaald ten behoeve van een overeenkomst met betrekking tot de verzekering van in dit besluit
      omschreven zorg of de kosten daarvan, in de omstandigheid, bedoeld in het eerste lid, onder *d*, gelden als kosten
      van zodanige zorg.

      5 In de omstandigheden, bedoeld in het eerste lid, onder *a, d* en *e* is de uitkering gelijk aan de kosten van
      de zorg indien deze is verleend door een instelling of persoon die ter zake van die zorg een overeenkomst met enig
      uitvoeringsorgaan heeft gesloten. Indien de zorg door een ander is verleend, is de uitkering gelijk aan de kosten
      van de zorg, voor zover deze de kosten van zodanige zorg, verleend door een persoon of instelling waarmee het
      uivoeringsorgaan een overenkomst heeft gesloten, niet te boven gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005283#Artikel10
    url: https://wetten.overheid.nl/BWBR0005283/2002-01-01#Artikel34
