articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. de wet: de [Algemene Wet Bijzondere Ziektekosten][ref1];

      b. leefeenheid: een eenheid bestaande uit gehuwde verzekerden die al dan niet te zamen met een of meer ongehuwde
      minderjarige verzekerden duurzaam een huishouden voeren dan wel uit een meerderjarige ongehuwde verzekerde die met
      een of meer ongehuwde minderjarige verzekerden duurzaam een huishouden voert.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0005283/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: '2'
    text: |-
      1 De verzekerden hebben aanspraak op de zorg, omschreven in de[artikelen 3][ref1], [4][ref2], [9][ref3] 11 tot en
      met 16 en 19 tot en met 28, behoudens voor zover het zorg betreft die kan worden bekostigd op grond van een andere
      wettelijke regeling.

      2 Op de zorg, omschreven bij dit besluit, bestaat geen aanspraak, voor zover deze objectief voorzienbaar
      samenhangt met een onderzoek in een ziekenhuis dat of behandeling in een ziekenhuis die niet behoort tot de in
      [artikel 9, eerste lid][ref4], omschreven zorg.

      3 Onze Minister kan, indien het onverwijld treffen van zodanige maatregel noodzakelijk is met het oog op de
      beheersing van de kostenontwikkeling, medisch-ethische implicaties van nieuwe ontwikkelingen of het belang van
      de verzekerden, voor een periode van zes maanden, welke door hem éénmaal met zes maanden kan worden verlengd, de
      inhoud en omvang van de aanspraak op in dit besluit omschreven zorg beperken of nader omschrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0005283#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005283#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005283#Artikel9
