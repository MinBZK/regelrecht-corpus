  - number: '3'
    text: |-
      De verantwoordelijke draagt zorg voor de autorisaties van de ambtenaren van politie die onder zijn beheer vallen
      voor de verwerking van politiegegevens met het oog op de uitvoering van de dagelijkse politietaak, bedoeld in
      [artikel 8, eerste lid, van de wet][ref1]. Voor deze verwerking kunnen slechts worden geautoriseerd de ambtenaren
      van politie die zijn belast met taken of werkzaamheden op het gebied van de coördinatie van het informatieproces
      ter ondersteuning van een goede uitvoering van die taak.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel8
    url: https://wetten.overheid.nl/BWBR0026117/2013-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '8'
  - number: '4'
    text: |-
      Onverminderd [artikel 2:13, eerste lid, van het Besluit politiegegevens][ref1] kan de verantwoordelijke het
      ter beschikking stellen van politiegegevens over toezicht aan ambtenaren van politie die onder een andere
      verantwoordelijke ressorteren, weigeren of aan beperkende voorwaarden onderwerpen, indien dit noodzakelijk is voor
      een goede uitvoering van de taak, bedoeld in [artikel 3 van de Wet op de bijzondere opsporingsdiensten][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0023086#Artikel213
      [ref2]: https://wetten.overheid.nl/BWBR0019919#Artikel3
    url: https://wetten.overheid.nl/BWBR0026117/2013-01-01#Artikel4
    references:
