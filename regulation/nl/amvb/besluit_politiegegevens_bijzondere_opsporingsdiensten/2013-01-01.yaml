        bwb_id: BWBR0023086
        artikel: 2:13
      - id: ref2
        bwb_id: BWBR0019919
        artikel: '3'
  - number: '5'
    text: |-
      Onverminderd [artikel 2:12 van het Besluit politiegegevens][ref1] kan de bevoegde functionaris politiegegevens
      over toezicht voorzien van de code vertrouwelijke verwerking, op zodanige wijze dat de overeenkomende gegevens
      gedeeltelijk zichtbaar zijn en de andere gerelateerde gegevens zichtbaar zijn na instemming van de daartoe bevoegde
      functionaris.


      [ref1]: https://wetten.overheid.nl/BWBR0023086#Artikel212
    url: https://wetten.overheid.nl/BWBR0026117/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0023086
        artikel: 2:12
  - number: '6'
    text: |-
      1 Politiegegevens over de naleving of uitvoering van wetgeving op een bepaald beleidsterrein, die overeenkomstig
      de [artikelen 8][ref1], [9][ref2] en [13 van de wet][ref3] door een ambtenaar van politie worden verwerkt ter
      uitvoering van de taak, bedoeld in [artikel 3 van de Wet op de bijzondere opsporingsdiensten][ref4], kunnen
      worden verstrekt aan een bestuursorgaan dat of aan personen die bij of krachtens wetgeving is of zijn belast
      met het houden van toezicht op de naleving dan wel de uitvoering van wetgeving op het beleidsterrein van de
      verantwoordelijke, voorzover dat noodzakelijk is voor een goede uitvoering van zijn of hun taak.

      2 De verstrekking van politiegegevens overeenkomstig het eerste lid vindt, voorzover die gegevens worden verwerkt
      overeenkomstig [artikel 9 van de wet][ref5], uitsluitend plaats na instemming van de bevoegde functionaris.

      3 In bijzondere gevallen kunnen politiegegevens als bedoeld in het eerste lid, die door een ambtenaar van politie
      worden verwerkt ter uitvoering van de taak, bedoeld in het eerste lid, na instemming van de officier van justitie
      worden verstrekt aan een bestuursorgaan dat of aan personen die bij of krachtens wetgeving is of zijn belast met
      het houden van toezicht op de naleving dan wel de uitvoering van wetgeving op het beleidsterrein van een andere
      verantwoordelijke, voorzover dat noodzakelijk is voor een goede uitvoering van zijn of hun taak.


