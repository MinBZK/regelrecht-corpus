    text: |-
      1 Onverminderd [artikel 46, eerste lid, van de wet][ref1] is het bij [die wet][ref2] bepaalde
      met betrekking tot de verwerking van politiegegevens van overeenkomstige toepassing op de
      verwerking van persoonsgegevens door de bijzondere opsporingsdiensten, met uitzondering
      van [artikel 10, eerste lid, de onderdelen b en c, derde lid en vierde lid][ref3],
      [artikel 16, eerste lid, onderdeel d][ref4], en de [artikelen 37 tot en met 45][ref5].

      2 Onverminderd [artikel 46, eerste lid, van de wet][ref6] is het in het [Besluit politiegegevens][ref7]
      bepaalde met betrekking tot de verwerking van politiegegevens van overeenkomstige
      toepassing op de verwerking van persoonsgegevens door de bijzondere opsporingsdiensten,
      met uitzondering van de [artikelen 2:4][ref8], [2:5, tweede lid][ref9], [2:7][ref10],
      [2:13, tweede lid][ref11], [3:2][ref12], [4:1, eerste lid, onderdeel b, en tweede lid][ref13],
      [4:2, eerste lid, de onderdelen a, c, d, e, f, i, j, k, o, q en y][ref14], en
      [6:6 van het Besluit politiegegevens][ref15].


