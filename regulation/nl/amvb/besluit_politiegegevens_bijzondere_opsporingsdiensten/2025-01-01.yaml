  - number: '2'
    text: |-
      1 Onverminderd [artikel 46, eerste lid, van de wet][ref1] is het bij die [wet][ref2] bepaalde met betrekking tot
      de verwerking van politiegegevens van overeenkomstige toepassing op de verwerking van persoonsgegevens door de
      bijzondere opsporingsdiensten, met uitzondering van de artikelen:

      a. [10, eerste lid, de onderdelen b en c, derde lid en vierde lid][ref3],
      [artikel 16, eerste lid, onderdeel b][ref4], en [37 tot en met 45][ref5], voor de verwerking door de
      verwerkingsverantwoordelijken, bedoeld in [artikel 1, onderdeel c, punten 1 tot en met 3][ref6];

      b. [10, eerste lid, onderdeel c, en vierde lid][ref7], [artikel 16, eerste lid, onderdeel b][ref8],
      en [37 tot en met 45][ref9], voor de verwerking door de verwerkingsverantwoordelijke, bedoeld in
      [artikel 1, onderdeel c, punt 4][ref10].

      2 Onverminderd [artikel 46, eerste lid, van de wet][ref11] is het in het [Besluit politiegegevens][ref12]
      bepaalde met betrekking tot de verwerking van politiegegevens van overeenkomstige toepassing op de verwerking van
      persoonsgegevens door de bijzondere opsporingsdiensten, met uitzondering van de artikelen:

      a. [2:4][ref13], [2:5, tweede lid][ref14], [2:7][ref15], [2:13, tweede lid][ref16],
      [3:2][ref17], [4:1, eerste lid, onderdeel b, en tweede lid][ref18],
      [4:2, eerste lid, de onderdelen a, c, d, e, f, i, j, k, q en y][ref19], en
      [6:6 van het Besluit politiegegevens][ref20] voor de verwerking door de verwerkingsverantwoordelijken, bedoeld in
      [artikel 1, onderdeel c, punten 1 tot en met 3][ref21];

      b. [2:5, tweede lid][ref22], [2:7][ref23], [2:13, tweede lid][ref24],
      [4:1, eerste lid, onderdeel b, en tweede lid][ref25],
      [4:2, eerste lid, de onderdelen c, d, e, f, j, k, q en y][ref26], en [6:6 van het Besluit politiegegevens][ref27]
      voor de verwerking door de verwerkingsverantwoordelijken, bedoeld in [artikel 1, onderdeel c, punt 4][ref28].


