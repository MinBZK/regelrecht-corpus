  - number: '3.1'
    text: |-
      De verantwoordelijke draagt zorg voor de autorisaties van de ambtenaren van politie die onder zijn beheer vallen
      voor de verwerking van politiegegevens met het oog op de uitvoering van de dagelijkse politietaak, bedoeld in
      [artikel 8, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel8
    url: https://wetten.overheid.nl/BWBR0026117/2025-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '8'
  - number: '3.2'
    text: |-
      De verwerkingsverantwoordelijke kan voor specifieke vormen van de verwerking van politiegegevens een beroep doen op
      een persoon die onder zijn beheer valt en die geen opsporingsambtenaar is.
    url: https://wetten.overheid.nl/BWBR0026117/2025-01-01#Artikel3
  - number: '3.3'
    text: |-
      In de autorisatie worden vastgelegd het onderwerp en de duur van de verwerking, de aard en het doel van de
      verwerking, het soort persoonsgegevens en de categorieën van betrokkenen.
    url: https://wetten.overheid.nl/BWBR0026117/2025-01-01#Artikel3
  - number: '4'
    text: |-
      Onverminderd [artikel 2:13, eerste lid, van het Besluit politiegegevens][ref1] kan de verantwoordelijke het
      ter beschikking stellen van politiegegevens over toezicht aan ambtenaren van politie die onder een andere
      verantwoordelijke ressorteren, weigeren of aan beperkende voorwaarden onderwerpen, indien dit noodzakelijk is voor
      een goede uitvoering van de taak, bedoeld in [artikel 3 van de Wet op de bijzondere opsporingsdiensten][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0023086#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019919#Artikel3
    url: https://wetten.overheid.nl/BWBR0026117/2025-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0023086
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0019919
        artikel: '3'
  - number: '5'
    text: |-
      Onverminderd [artikel 2:12 van het Besluit politiegegevens][ref1] kan de bevoegde functionaris politiegegevens
      over toezicht voorzien van de code vertrouwelijke verwerking, op zodanige wijze dat de overeenkomende gegevens
      gedeeltelijk zichtbaar zijn en de andere gerelateerde gegevens zichtbaar zijn na instemming van de daartoe bevoegde
      functionaris.


      [ref1]: https://wetten.overheid.nl/BWBR0023086#Artikel2
    url: https://wetten.overheid.nl/BWBR0026117/2025-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0023086
        artikel: '2'
  - number: '6.1'
    text: |-
      Politiegegevens over de naleving of uitvoering van wetgeving op een bepaald beleidsterrein, die overeenkomstig
      de [artikelen 8][ref1], [9][ref2] en [13 van de wet][ref3] door een ambtenaar van politie worden verwerkt ter
      uitvoering van de taak, bedoeld in [artikel 3 van de Wet op de bijzondere opsporingsdiensten][ref4], kunnen voor
      zover dat noodzakelijk is voor een goede uitvoering van zijn of hun taak worden verstrekt aan:


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0022463#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0019919#Artikel3
    url: https://wetten.overheid.nl/BWBR0026117/2025-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0022463
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0022463
        artikel: '13'
      - id: ref4
        bwb_id: BWBR0019919
        artikel: '3'
  - number: 6.1.a
    text: |-
      een bestuursorgaan dat of aan personen die bij of krachtens wetgeving is of zijn belast met het houden van toezicht
      op de naleving van wetgeving op dat bepaalde beleidsterrein, en
    url: https://wetten.overheid.nl/BWBR0026117/2025-01-01#Artikel6
  - number: 6.1.b
    text: |-
      een bestuursorgaan dat of aan personen die bij of krachtens wetgeving is of zijn belast met het houden van toezicht
      op de naleving dan wel de uitvoering van wetgeving op het beleidsterrein van de verwerkingsverantwoordelijke.
    url: https://wetten.overheid.nl/BWBR0026117/2025-01-01#Artikel6
  - number: '6.2'
    text: |-
      De verstrekking van politiegegevens overeenkomstig het eerste lid vindt, voorzover die gegevens worden verwerkt
      overeenkomstig [artikel 9 van de wet][ref1], uitsluitend plaats na instemming van de bevoegde functionaris.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel9
    url: https://wetten.overheid.nl/BWBR0026117/2025-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0022463
        artikel: '9'
  - number: '6.3'
    text: |-
      In bijzondere gevallen kunnen politiegegevens als bedoeld in het eerste lid, die door een ambtenaar van politie
      worden verwerkt ter uitvoering van de taak, bedoeld in het eerste lid, na instemming van de officier van justitie
      worden verstrekt aan een bestuursorgaan dat of aan personen die bij of krachtens wetgeving is of zijn belast met
      het houden van toezicht op de naleving dan wel de uitvoering van wetgeving op het beleidsterrein van een andere
      verwerkingsverantwoordelijke, voorzover dat noodzakelijk is voor een goede uitvoering van zijn of hun taak.
    url: https://wetten.overheid.nl/BWBR0026117/2025-01-01#Artikel6
  - number: '8'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0026117/2025-01-01#Artikel8
  - number: '9'
    text: 'Dit besluit wordt aangehaald als: Besluit politiegegevens bijzondere opsporingsdiensten.'
    url: https://wetten.overheid.nl/BWBR0026117/2025-01-01#Artikel9
