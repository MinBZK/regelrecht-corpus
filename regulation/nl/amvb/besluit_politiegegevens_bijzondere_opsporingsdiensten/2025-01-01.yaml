        bwb_id: BWBR0019919
        artikel: '2'
  - number: 1.c
    text: '*verwerkingsverantwoordelijke:* dit is bij:'
    url: https://wetten.overheid.nl/BWBR0026117/2025-01-01#Artikel1
  - number: 1.c.1
    text: 'de Belastingdienst/Fiscale Inlichtingen- en Opsporingsdienst: Onze Minister van Financiën;'
    url: https://wetten.overheid.nl/BWBR0026117/2025-01-01#Artikel1
  - number: 1.c.2
    text: |-
      de Inlichtingen- en Opsporingsdienst van de Inspectie Leefomgeving en Transport: Onze Minister van Infrastructuur
      en Waterstaat;
    url: https://wetten.overheid.nl/BWBR0026117/2025-01-01#Artikel1
  - number: 1.c.3
    text: |-
      de Inlichtingen- en Opsporingsdienst van de Nederlandse Voedsel- en Warenautoriteit: Onze Minister van Landbouw,
      Natuur en Voedselkwaliteit;
    url: https://wetten.overheid.nl/BWBR0026117/2025-01-01#Artikel1
  - number: 1.c.4
    text: 'de Directie Opsporing van de Nederlandse Arbeidsinspectie: Onze Minister van Sociale Zaken en Werkgelegenheid;'
    url: https://wetten.overheid.nl/BWBR0026117/2025-01-01#Artikel1
  - number: 1.d
    text: |-
      *ambtenaar van politie:* de ambtenaar, bedoeld in [artikel 1, onderdeel k, van de wet][ref1];


