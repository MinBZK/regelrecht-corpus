preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Justitie, gedaan mede namens Onze Ministers van Binnenlandse Zaken en
    Koninkrijksrelaties, van Defensie, van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, van Landbouw, Natuur
    en Voedselkwaliteit en de Staatssecretarissen van Financiën en van Sociale Zaken en Werkgelegenheid, van 14 april
    2009, nr. 5596761/09/6;

    Gelet op de artikelen 6, zesde lid, 11, derde lid, 15, tweede lid, 18, eerste lid, en 46, eerste lid, van de Wet
    politiegegevens;

    De Raad van State gehoord (advies van 27 mei 2009, nr. W03.09.0132/II);

    Gezien het nader rapport van Onze Minister van Justitie, mede namens Onze Ministers van Binnenlandse Zaken en
    Koninkrijksrelaties, van Defensie, van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, van Landbouw, Natuur
    en Voedselkwaliteit en de Staatssecretarissen van Financiën en van Sociale Zaken en Werkgelegenheid, van 1 juli
    2009, nr. 5606412/09/6;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0026117/2025-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. *wet:* [Wet politiegegevens][ref1];

      b. *bijzondere opsporingsdienst:* een van de diensten bedoeld in
      [artikel 2 van de Wet op de bijzondere opsporingsdiensten][ref2];

      c. *verwerkingsverantwoordelijke:* dit is bij:

      1° de Belastingdienst/Fiscale Inlichtingen- en Opsporingsdienst: Onze Minister van Financiën;

      2° de Inlichtingen- en Opsporingsdienst van de Inspectie Leefomgeving en Transport: Onze Minister van
      Infrastructuur en Waterstaat;

      3° de Inlichtingen- en Opsporingsdienst van de Nederlandse Voedsel- en Warenautoriteit: Onze Minister van Landbouw,
      Natuur en Voedselkwaliteit;

      4° de Directie Opsporing van de Nederlandse Arbeidsinspectie: Onze Minister van Sociale Zaken en Werkgelegenheid;

      d. *ambtenaar van politie:* de ambtenaar, bedoeld in [artikel 1, onderdeel k, van de wet][ref3];

      e. *bevoegde functionaris:* functionaris, bedoeld in
      [artikel 2:10, eerste lid, van het Besluit politiegegevens][ref4];

      f. *politiegegevens over toezicht:* politiegegevens die betrekking hebben op het toezicht op de naleving van
      wetgeving of de uitvoering van wettelijke voorschriften.


