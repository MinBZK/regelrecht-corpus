---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: octrooigemachtigden_reglement
regulatory_layer: AMVB
publication_date: '1995-02-16'
valid_from: '1998-12-01'
bwb_id: BWBR0001975
url: https://wetten.overheid.nl/BWBR0001975/1998-12-01
articles:
  - number: '1.1'
    text: |-
      Als gemachtigde kunnen, behoudens het bepaalde in het tweede lid van dit artikel, voor de Octrooiraad alleen
      optreden:
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel1
  - number: 1.1.a
    text: |-
      zij, die zijn ingeschreven in het in [artikel 3][ref1] bedoelde register;


      [ref1]: https://wetten.overheid.nl/BWBR0001975#Artikel3
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001975
        artikel: '3'
  - number: 1.1.b
    text: zij, die als advocaat zijn ingeschreven bij een der rechterlijke colleges hier te lande.
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel1
  - number: '1.2'
    text: |-
      In bijzondere gevallen kan de Voorzitter van de Octrooiraad ook aan andere personen toestaan als gemachtigde op te
      treden, mits zij van zulk optreden niet hun beroep maken.
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel1
  - number: '2'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel2
  - number: 2.a
    text: |-
      octrooigemachtigde: een ieder, die is ingeschreven in het in [artikel 3][ref1] bedoelde register;


      [ref1]: https://wetten.overheid.nl/BWBR0001975#Artikel3
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001975
        artikel: '3'
  - number: 2.b
    text: |-
      richtlijn: [richtlijn (EEG) nr. 89/48](31989L0048) van de Raad van de Europese Gemeenschappen van 21 december 1988
      betreffende een algemeen stelsel van erkenning van hoger-onderwijsdiploma’s waarmee beroepsopleidingen van ten
      minste drie jaar worden afgesloten (*PbEG* L 19), voor zover van toepassing, met inachtneming van het bepaalde in
      de Overeenkomst betreffende de Europese Economische Ruimte.
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel2
  - number: '3.1'
    text: |-
      Bij de Octrooiraad wordt een register van octrooigemachtigden gehouden. De Voorzitter van de Octrooiraad stelt de
      inrichting van dit register vast, doet de inschrijvingen en doorhalingen daarin verrichten en maakt deze openbaar.
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel3
  - number: '3.2'
    text: |-
      In het register kunnen slechts worden ingeschreven meerderjarigen, van wie kan worden aangenomen, dat zij kantoor
      zullen houden binnen het Koninkrijk, en die niet onder curatele zijn gesteld, noch ontzet zijn uit het recht om als
      gemachtigde voor de Octrooiraad op te treden.
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel3
  - number: '3.3'
    text: |-
      Degene, die in het register wenst te worden ingeschreven, dient daartoe een schriftelijk verzoek in bij de
      Voorzitter van de Octrooiraad.
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel3
  - number: '3.4'
    text: 'Bij het verzoek om inschrijving dient de verzoeker over te leggen:'
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel3
  - number: 3.4.a
    text: |-
      het bewijs, dat hij met goed gevolg het in [artikel 4][ref1] bedoelde examen heeft afgelegd en een bewijs
      dat hij gedurende ten minste drie jaren in Nederland octrooiaanvragen heeft behandeld ten kantore van een
      octrooigemachtigde, die niet was geschorst in de uitoefening van het recht om als gemachtigde voor de Octrooiraad
      op te treden, of


      [ref1]: https://wetten.overheid.nl/BWBR0001975#Artikel4
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001975
        artikel: '4'
  - number: 3.4.b
    text: |-
      het bewijs dat hij met goed gevolg de in [artikel 4][ref1], bedoelde proeve van bekwaamheid heeft afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001975#Artikel4a
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001975
        artikel: 4a
  - number: '3.5'
    text: |-
      Voor degene, die gedurende ten minste drie jaren bij de Octrooiraad belast is geweest met de voorbereiding van
      de behandeling van octrooiaanvragen, is de termijn, bedoeld in het vierde lid, onder *a* één jaar. Degene, die
      technisch plaatsvervangend lid van de Octrooiraad is geweest, is daarnaast vrijgesteld van het afleggen van het
      gedeelte van het in [artikel 4][ref1] bedoelde examen dat ertoe strekt te doen blijken dat hij de voorschriften
      van de in het tweede lid van dat artikel bedoelde wetgevingen en regelingen praktisch weet toe te passen. Degene,
      die technisch gewoon lid van de Octrooiraad is geweest, is vrijgesteld van overlegging van de in het vierde lid
      bedoelde bewijzen.


      [ref1]: https://wetten.overheid.nl/BWBR0001975#Artikel4
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001975
        artikel: '4'
  - number: '3.6'
    text: |-
      Van de inschrijving in het register stelt de Voorzitter van de Octrooiraad de betrokkene en de Secretaris van de
      Orde van Octrooigemachtigden schriftelijk in kennis.
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel3
  - number: '4.1'
    text: |-
      Op tijdstippen, door de Minister van Economische Zaken te bepalen, wordt door een door die Minister te benoemen
      commissie, bestaande uit leden van de Octrooiraad, een of meer octrooigemachtigden en zo nodig een of meer andere
      technische en rechtsgeleerde deskundigen, een examen afgenomen.
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel4
  - number: '4.2'
    text: |-
      Om dit examen met goed gevolg af te leggen, moet hij, die zich daaraan onderwerpt, daarbij doen blijken, dat hij de
      nodige kennis bezit van de Nederlandse en de voornaamste vreemde wetgevingen en van de voornaamste internationale
      regelingen betreffende de industriële eigendom, de voorschriften dier wetgevingen en regelingen praktisch weet
      toe te passen en bekend is met de beginselen van het Nederlands burgerlijk en handelsrecht, voor zover deze kennis
      nodig is voor een goed begrip van de Nederlandse wetgeving betreffende de industriële eigendom.
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel4
  - number: '4.3'
    text: 'Om aan dit examen te kunnen deelnemen moet de kandidaat een der volgende bescheiden aan de commissie doen toekomen:'
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel4
  - number: 4.3.a
    text: |-
      het getuigschrift van met goed gevolg afgelegd doctoraal examen in de faculteit der wis- en natuurkunde aan een
      Rijksuniversiteit of daarmede wettelijk gelijkgestelde inrichting;
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel4
  - number: 4.3.b
    text: het diploma van ingenieur, verworven aan een Nederlandse technische hogeschool of landbouwhogeschool;
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel4
  - number: 4.3.c
    text: |-
      het brevet hogere technische bekwaamheid (H.T.B.) voor officieren van de Koninklijke Landmacht en de Koninklijke
      Luchtmacht, bedoeld in de beschikking van de Minister van Oorlog van 23 juni 1952 (*L.O.* 1952, no. 189.L-LM), dat
      is toegekend na het volgen van een cursus hogere militair-technische vorming als bedoeld in de beschikkingen van
      genoemde Minister van 14 maart 1955 (*L.O.* 1955, no. 55085 L-code no. 78/35) en van 30 juli 1955 ( *Lu.O.* 55512 -
      code no. 78/50);
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel4
  - number: 4.3.d
    text: |-
      het bewijs, dat hij, na met goed gevolg hetzij de volledige opleiding tot beroepsofficier bij een technisch wapen
      of dienstvak aan de Koninklijke Militaire Academie hetzij de volledige opleiding tot beroeps-zeeofficier of tot
      beroepsofficier van een der technische diensten bij het Koninklijk Instituut voor de Marine te hebben doorlopen,
      ten minste gedurende vijf jaren als beroepsofficier belast is geweest met werkzaamheden van technische aard;
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel4
  - number: 4.3.e
    text: |-
      een getuigschrift of diploma van een buitenlandse universitaire instelling of hogeschool, indien dit door de
      commissie met een der onder *a* of *b* bedoelde bescheiden is gelijkgesteld;
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel4
  - number: 4.3.f
    text: het bewijs dat hij technisch plaatsvervangend lid van de Octrooiraad is of geweest is.
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel4
  - number: '4.4'
    text: |-
      De commissie kan in afwijking van het derde lid personen tot het examen toelaten, die naar het oordeel zowel van
      de commissie als van de Raad van Toezicht voor de Octrooigemachtigden bijzondere bekwaamheden bezitten, verkregen
      door langjarige werkzaamheden ten kantore van een octrooigemachtigde, welke hen geschikt maken voor het optreden
      als octrooigemachtigde.
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel4
  - number: '4.5'
    text: |-
      De werkzaamheden der commissie, het tijdstip, waarop belanghebbenden zich tot het afleggen van het examen bij de
      voorzitter der commissie moeten hebben aangemeld, de plaats, waar het examen zal worden afgenomen, en het voor de
      deelneming aan het examen te storten bedrag worden geregeld door de in het eerste lid genoemde Minister; deze doet
      van een en ander openbare mededeling.
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel4
  - number: 4a.1
    text: |-
      Op tijdstippen, door de Minister van Economische Zaken te bepalen, wordt door de in [artikel 4, eerste lid][ref1],
      bedoelde commissie een proeve van bekwaamheid afgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0001975#Artikel4
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0001975
        artikel: '4'
  - number: 4a.2
    text: 'Om aan deze proeve van bekwaamheid te kunnen deelnemen moet de kandidaat aan de commissie overleggen:'
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel4a
  - number: 4a.2.a
    text: |-
      een diploma als bedoeld in artikel 1, onder *a*, van de richtlijn, die door een andere Lid-Staat van de Europese
      Gemeenschappen dan Nederland dan wel een andere Staat die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte is voorgeschreven om op het grondgebied van die Staat als gemachtigde in octrooizaken op te
      treden en dat in een Lid-Staat of een andere Staat die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte is behaald, dan wel
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel4a
  - number: 4a.2.b
    text: |-
      een bewijs dat hij het optreden als gemachtigde in octrooizaken gedurende twee jaar tijdens de voorafgaande tien
      jaren voltijds heeft uitgeoefend in een andere Lid-Staat van de Europese Gemeenschappen dan Nederland dan wel een
      andere Staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte en in het bezit is van
      een of meer opleidingstitels als bedoeld in artikel 3, onder *b*, van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel4a
  - number: 4a.3
    text: |-
      Als bewijs dat door de betrokken kandidaat aan het bepaalde in het tweede lid wordt voldaan, aanvaardt de commissie
      de attesten en documenten die met het oog daarop door de bevoegde autoriteit van de in dat lid bedoelde andere
      Staat worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel4a
  - number: 4a.4
    text: |-
      Om de proeve van bekwaamheid met goed gevolg af te leggen, moet hij, die zich daaraan onderwerpt, daarbij doen
      blijken, dat hij de nodige kennis bezit van de Nederlandse wetgeving en de voornaamste internationale regelingen
      betreffende de industriële eigendom, de voorschriften van die wetgeving en die regelingen praktisch weet toe te
      passen en bekend is met de beginselen van het Nederlands burgerlijk en handelsrecht, voor zover deze kennis nodig
      is voor een goed begrip van de Nederlandse wetgeving betreffende de industriële eigendom, met dien verstande dat
      geen kennis wordt getoetst waarover de betrokkene blijkens de door hem overgelegde diploma's, bewijsstukken of
      opleidingstitels als bedoeld in het tweede lid reeds beschikt.
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel4a
  - number: 4a.5
    text: |-
      [Artikel 4, vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001975#Artikel4
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0001975
        artikel: '4'
  - number: '5.1'
    text: |-
      De Voorzitter van de Octrooiraad zendt onverwijld een afschrift van het in [artikel 3, derde lid][ref1], bedoelde
      verzoek, alsmede van de daarbij gevoegde stukken aan de in [artikel 15][ref2] bedoelde Raad van Toezicht.


      [ref1]: https://wetten.overheid.nl/BWBR0001975#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0001975#Artikel15
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001975
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0001975
        artikel: '15'
  - number: '5.2'
    text: |-
      De inschrijving geschiedt niet, indien de Raad van Toezicht zich tegen de inschrijving verzet. Het verzet moet
      worden gedaan binnen een maand na indiening van het verzoek tot inschrijving, of binnen vier maanden na deze
      indiening, indien de Raad van Toezicht binnen eerstbedoelde termijn aan de Voorzitter van de Octrooiraad bericht
      zich nader over het verzoek te willen beraden.
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel5
  - number: '5.3'
    text: Het verzet geschiedt door toezending van een met redenen omklede beslissing aan de Voorzitter van de Octrooiraad.
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel5
  - number: '5.4'
    text: |-
      Nadat van de Raad van Toezicht bericht is ontvangen, dat geen bezwaar bestaat tegen de inschrijving of, bij gebreke
      daarvan, nadat de ingevolge het tweede lid geldende termijn is verstreken zonder dat een bericht van verzet is
      ontvangen, vindt de inschrijving zo spoedig mogelijk plaats.
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel5
  - number: '6.1'
    text: 'Het verzet wordt alleen gedaan op een der na te noemen gronden:'
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel6
  - number: 6.1.a
    text: |-
      dat de verzoeker niet voldoet aan de in [artikel 3, tweede lid][ref1], bedoelde vereisten of niet de ingevolge
      [artikel 3, vierde en vijfde lid][ref2], vereiste bewijzen heeft overgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0001975#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0001975#Artikel3
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001975
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0001975
        artikel: '3'
  - number: 6.1.b
    text: dat gegronde vrees bestaat, dat de inschrijving de eer van de stand van de octrooigemachtigden zal schaden.
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel6
  - number: '6.2'
    text: |-
      De Raad van Toezicht neemt de beslissing tot verzet niet dan na verhoor of behoorlijke oproeping van de verzoeker.
      Hij kan getuigen en deskundigen horen. De verzoeker kan zich doen bijstaan of vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel6
  - number: '6.3'
    text: |-
      De Raad van Toezicht zendt de verzoeker onverwijld een afschrift in tweevoud van zijn beslissing tot verzet en van
      een bericht als in [artikel 5, tweede lid][ref1], bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0001975#Artikel5
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001975
        artikel: '5'
  - number: '7.1'
    text: |-
      De verzoeker kan gedurende een maand na de dag van verzending van de brief, waarbij hem een afschrift van de
      beslissing tot verzet is gezonden, in beroep komen bij de in [artikel 19][ref1] bedoelde Raad van Beroep. De
      [artikelen 6, tweede lid][ref2], en [19, derde lid][ref3], zijn op dit beroep van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001975#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0001975#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0001975#Artikel19
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001975
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0001975
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0001975
        artikel: '19'
  - number: '7.2'
    text: |-
      De Raad van Beroep zendt van zijn beslissing onverwijld een afschrift aan de verzoeker, de Raad van Toezicht en de
      Voorzitter van de Octrooiraad.
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel7
  - number: '7.3'
    text: Indien het beroep gegrond wordt verklaard, geschiedt de inschrijving zo spoedig mogelijk.
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel7
  - number: '8'
    text: |-
      Alvorens tot inschrijving in het register van octrooigemachtigden wordt overgegaan, legt de verzoeker in handen
      van de Octrooiraad de volgende eed of belofte af: "Ik zweer (Ik beloof), dat ik het beroep van octrooigemachtigde
      nauwgezet zal vervullen met inachtneming van de daarop betrekking hebbende wettelijke voorschriften, dat ik de
      mij in die hoedanigheid toevertrouwde belangen met ijver en eerlijkheid zal behartigen en dat ik geheimhouding
      zal bewaren omtrent alle aangelegenheden, die mij in mijn hoedanigheid van octrooigemachtigde ter kennis komen en
      waarvan ik het vertrouwelijk karakter ken of redelijkerwijs moet vermoeden. Zo waarlijk helpe mij God almachtig
      (Dat beloof ik)".
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel8
  - number: '9'
    text: |-
      Indien een advocaat als gemachtigde voor de Octrooiraad wenst op te treden, kan de Voorzitter van de Octrooiraad,
      alvorens hem als zodanig toe te laten, inzage vorderen van de geviseerde akte van zijn beëdiging als advocaat.
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel9
  - number: '10.1'
    text: 'De Voorzitter van de Octrooiraad doet de inschrijving in het register van octrooigemachtigden doorhalen:'
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel10
  - number: 10.1.a
    text: op verzoek van de ingeschrevene;
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel10
  - number: 10.1.b
    text: na overlijden van de ingeschrevene;
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel10
  - number: 10.1.c
    text: |-
      nadat een beslissing van de Raad van Toezicht, dat de ingeschrevene niet binnen het Koninkrijk kantoor
      houdt, onherroepelijk is geworden; op deze beslissing is [artikel 11, derde, vierde en vijfde lid][ref1], van
      overeenkomstige toepassing;


      [ref1]: https://wetten.overheid.nl/BWBR0001975#Artikel11
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001975
        artikel: '11'
  - number: 10.1.d
    text: |-
      nadat een beslissing tot ontzetting van de ingeschrevene uit het recht om als gemachtigde voor de Octrooiraad op te
      treden, onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel10
  - number: '10.2'
    text: |-
      Binnen acht dagen na de doorhaling van de inschrijving geeft de Voorzitter van de Octrooiraad hiervan schriftelijk
      kennis aan de Secretaris van de Orde van Octrooigemachtigden en, indien mogelijk, aan de betrokkene.
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel10
  - number: '11.1'
    text: |-
      Octrooigemachtigden, die in staat van faillissement zijn verklaard, ten aanzien van wie de schuldsaneringsregeling
      natuurlijke personen van toepassing is verklaard, of die onder curatele zijn gesteld, zijn gedurende het
      faillissement, het van toepassing zijn van de schuldsaneringsregeling natuurlijke personen of de curatele van
      rechtswege geschorst in de uitoefening van het recht als gemachtigde voor de Octrooiraad op te treden. Van de
      aanvang en het einde van de schorsing wordt aantekening gedaan in het register van octrooigemachtigden.
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel11
  - number: '11.2'
    text: De Raad van Toezicht kan op verzoek van de curator de in het eerste lid bedoelde schorsing opheffen.
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel11
  - number: '11.3'
    text: |-
      Hij beslist niet op het verzoek dan na verhoor of behoorlijke oproeping van de curator en de betrokkene. Hij kan
      getuigen en deskundigen horen. De curator en de betrokkene kunnen zich doen bijstaan of vertegenwoordigen. De
      beslissing is met redenen omkleed.
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel11
  - number: '11.4'
    text: |-
      De Raad van Toezicht zendt van zijn beslissing onverwijld een afschrift aan de curator, de betrokkene en de
      Voorzitter van de Octrooiraad.
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel11
  - number: '11.5'
    text: |-
      Van de in het vierde lid bedoelde beslissing kan de curator of de betrokkene binnen een maand na de dag van
      verzending van de brief, waarbij deze hem ter kennis is gebracht, in beroep komen bij de in [artikel 19][ref1]
      bedoelde Raad van Beroep. Het derde en vierde lid, alsmede [artikel 19, derde lid][ref2], zijn op dit beroep van
      overeenkomstige toepassing, met dien verstande, dat tevens een afschrift van de beslissing in beroep aan de Raad
      van Toezicht wordt gezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0001975#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0001975#Artikel19
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001975
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0001975
        artikel: '19'
  - number: '12.1'
    text: |-
      Elke octrooigemachtigde is verplicht ten aanzien van hem gedane opdrachten, uit de Octrooiwet 1910, *Staatsblad*
      no. 313, voortvloeiende, op behoorlijke wijze aantekening te houden en over het algemeen de hem toevertrouwde zaken
      zo te beheren, dat deze desnoods dadelijk door een plaatsvervanger of opvolger kunnen worden overgenomen.
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel12
  - number: '12.2'
    text: |-
      Ingeval een octrooigemachtigde niet in staat is de hem in die hoedanigheid toevertrouwde belangen te behartigen,
      dan wel overleden is, wijst de Voorzitter van de Raad van Toezicht, indien niet reeds in de vervanging is voorzien,
      een octrooigemachtigde aan, die verplicht is, zolang de Voorzitter dit nodig oordeelt, de maatregelen te nemen, die
      onder de gegeven omstandigheden geboden zijn.
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel12
  - number: '13.1'
    text: |-
      Er zal zijn een Orde van Octrooigemachtigden, die alle octrooigemachtigden omvat. Deze Orde bezit
      rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel13
  - number: '13.2'
    text: Deze Orde stelt een huishoudelijk reglement vast, dat de goedkeuring van de Minister van Economische Zaken behoeft.
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel13
  - number: '13.3'
    text: |-
      De leden der Orde zijn als zodanig een contributie verschuldigd. Het in het tweede lid bedoelde reglement stelt
      regelen omtrent het bedrag dier contributie en omtrent de termijn, waarbinnen deze moet worden voldaan.
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel13
  - number: '14.1'
    text: |-
      Het bestuur der Orde bestaat uit ten hoogste negen leden, welke uit en door de Orde gekozen worden. De leden treden
      om de twee jaren af en zijn terstond herkiesbaar.
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel14
  - number: '14.2'
    text: |-
      De verkiezing van het bestuur wordt geregeld bij het in [artikel 13, tweede lid][ref1], bedoelde huishoudelijk
      reglement.


      [ref1]: https://wetten.overheid.nl/BWBR0001975#Artikel13
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001975
        artikel: '13'
  - number: '14.3'
    text: De voorzitter van het bestuur vertegenwoordigt de Orde in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel14
  - number: '15.1'
    text: |-
      Er is een Raad van Toezicht voor de Octrooigemachtigden. Deze bestaat uit vijf leden en vijf plaatsvervangende
      leden, die worden gekozen door de Orde uit de leden van de Orde.
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel15
  - number: '15.2'
    text: De Raad van Toezicht kiest uit zijn midden een voorzitter en een secretaris.
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel15
  - number: '15.3'
    text: |-
      De leden en de plaatsvervangende leden van de Raad van Toezicht treden om de twee jaren af. Zij zijn terstond
      herkiesbaar.
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel15
  - number: '15.4'
    text: |-
      De wijze van hun verkiezing wordt geregeld in het in [artikel 13, tweede lid][ref1], bedoelde huishoudelijk
      reglement.


      [ref1]: https://wetten.overheid.nl/BWBR0001975#Artikel13
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0001975
        artikel: '13'
  - number: '15.5'
    text: |-
      De leden en de plaatsvervangende leden van de Raad van Toezicht kunnen zich verschonen en kunnen worden
      gewraakt, indien er te hunnen aanzien feiten of omstandigheden bestaan, waardoor in het algemeen de rechterlijke
      onpartijdigheid schade zou kunnen lijden. De artikelen 512-523 van het [Wetboek van Strafvordering][ref1] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: '16.1'
    text: |-
      De Raad van Toezicht is belast met de zorg voor de eer van de stand der octrooigemachtigden; hij houdt toezicht op
      de wijze, waarop de octrooigemachtigden hun beroep uitoefenen, neemt kennis van klachten en treedt onder meer op,
      ingeval een octrooigemachtigde zich in strijd met zijn plicht of op onwaardige wijze gedraagt.
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel16
  - number: '16.2'
    text: |-
      Onwaardig gedrag in de zin van het eerste lid kan onder meer zijn het in octrooiaangelegenheden samenwerken met of
      in dienst nemen van een persoon:
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel16
  - number: 16.2.a
    text: |-
      van wie bekend is, dat hem de inschrijving in het register van octrooigemachtigden op grond van
      [artikel 6, eerste lid, onder ][ref1], is geweigerd;


      [ref1]: https://wetten.overheid.nl/BWBR0001975#Artikel6
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001975
        artikel: '6'
  - number: 16.2.b
    text: die ontzet is uit het recht om als gemachtigde voor de Octrooiraad op te treden;
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel16
  - number: 16.2.c
    text: |-
      die, hoewel onbevoegd om als gemachtigde voor de Octrooiraad op te treden, er zijn gewoonte van maakt in Nederland
      opdrachten tot behandeling van octrooiaangelegenheden uit te lokken of advies omtrent dergelijke aangelegenheden
      te geven.
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel16
  - number: '17'
    text: |-
      Indien het de Raad van Toezicht voor de Octrooigemachtigden bekend is, dat een advocaat zich bij de behandeling van
      octrooiaangelegenheden in strijd met zijn plicht of op onwaardige wijze gedraagt of heeft gedragen, stelt hij de
      raad van toezicht, aan welks toezicht de advocaat is onderworpen, hiervan op de hoogte.
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel17
  - number: '18.1'
    text: |-
      De Raad van Toezicht neemt een tegen een octrooigemachtigde gerezen bezwaar in behandeling hetzij op een bij die
      raad ingediende schriftelijke klacht, hetzij ambtshalve.
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel18
  - number: '18.2'
    text: |-
      De Raad van Toezicht kan aan de octrooigemachtigde, naar gelang van omstandigheden, een der volgende straffen
      opleggen:
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel18
  - number: 18.2.a
    text: waarschuwing;
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel18
  - number: 18.2.b
    text: berisping;
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel18
  - number: 18.2.c
    text: |-
      schorsing in de uitoefening van het recht om als gemachtigde voor de Octrooiraad op te treden voor de tijd van ten
      hoogste vijf jaren;
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel18
  - number: 18.2.d
    text: ontzetting uit het recht om als gemachtigde voor de Octrooiraad op te treden.
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel18
  - number: '18.3'
    text: |-
      De Raad van Toezicht beslist niet, dan na verhoor of behoorlijke oproeping van de betrokken octrooigemachtigde.
      Indien de klager de wens daartoe te kennen geeft, hoort de Raad ook de klager. Desgewenst hoort de Raad getuigen of
      deskundigen. De octrooigemachtigde en de klager kunnen zich doen bijstaan of vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel18
  - number: '18.4'
    text: |-
      Bij de bepaling der straffen wordt rekening gehouden met de omstandigheid, of de schuldige al dan niet de door zijn
      vergrijp veroorzaakte schade heeft vergoed.
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel18
  - number: '18.5'
    text: De beslissing is met redenen omkleed.
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel18
  - number: '18.6'
    text: |-
      De Raad van Toezicht zendt van zijn beslissing onverwijld een afschrift aan de betrokken octrooigemachtigde en,
      in voorkomend geval, aan de klager, alsmede, indien bij de beslissing een straf is opgelegd, aan de Voorzitter van
      de Octrooiraad.
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel18
  - number: '18.7'
    text: |-
      Indien de opgelegde straf bestaat in schorsing of ontzetting, wordt daarvan, zodra de daartoe strekkende beslissing
      onherroepelijk is geworden, door de Voorzitter van de Octrooiraad openbare kennisgeving gedaan. Van de aanvang en
      het einde van een schorsing wordt door hem aantekening gedaan in het register van octrooigemachtigden.
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel18
  - number: '19.1'
    text: |-
      Van een beslissing van de Raad van Toezicht, als bedoeld in [artikel 18][ref1], kan de betrokken octrooigemachtigde
      en, in voorkomend geval, de klager gedurende een maand na de dag van verzending van de brief, waarbij hem een
      afschrift van die beslissing is gezonden, in beroep komen bij de Raad van Beroep inzake het Toezicht op de
      Octrooigemachtigden.


      [ref1]: https://wetten.overheid.nl/BWBR0001975#Artikel18
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0001975
        artikel: '18'
  - number: '19.2'
    text: |-
      De Raad van Beroep bestaat uit drie leden en drie plaatsvervangende leden. De Voorzitter van de Octrooiraad is
      voorzitter van de Raad van Beroep; zijn plaatsvervanger wordt door de Koningin uit de overige rechtsgeleerde
      leden van de Octrooiraad benoemd. Een der andere leden van de Raad van Beroep en zijn plaatsvervanger worden
      door de Koningin benoemd uit de leden van de Arrondissements-rechtbank of het Gerechtshof te 's-Gravenhage
      of van de Hoge Raad. Het derde lid en zijn plaatsvervanger worden door en uit de Orde van Octrooigemachtigden
      gekozen; zij treden om de twee jaar af en zijn terstond herkiesbaar; hun verkiezing wordt geregeld bij het in
      [artikel 13, tweede lid][ref1], bedoelde huishoudelijk reglement; het [vijfde lid van artikel 15][ref2] is op hen
      van toepassing. Aan de Raad van Beroep wordt toegevoegd een secretaris, die door de Minister van Economische Zaken
      wordt benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0001975#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0001975#Artikel15
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0001975
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0001975
        artikel: '15'
  - number: '19.3'
    text: |-
      Het beroep wordt ingesteld door het indienen van een met redenen omkleed beroepschrift in tweevoud, vergezeld van
      de beslissing waartegen het beroep is gericht. De Secretaris van de Raad van Beroep zendt een der exemplaren van
      het beroepschrift aan de Raad van Toezicht.
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel19
  - number: '19.4'
    text: |-
      [Artikel 18][ref1] is van overeenkomstige toepassing met dien verstande, dat van elke genomen beslissing eveneens
      onverwijld een afschrift wordt gezonden aan de Raad van Toezicht.


      [ref1]: https://wetten.overheid.nl/BWBR0001975#Artikel18
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0001975
        artikel: '18'
  - number: '20.1'
    text: |-
      Van een beslissing van de Raad van Toezicht als bedoeld in artikel 18 en van een beslissing van de Raad van Beroep
      als bedoeld in [artikel 19][ref1] kan herziening worden gevraagd, indien ernstig vermoeden bestaat, dat op grond
      van enige omstandigheid, waarvan bij het nemen der beslissing niet is gebleken, een andere beslissing zou zijn
      genomen, indien die omstandigheid bekend zou zijn geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0001975#Artikel19
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0001975
        artikel: '19'
  - number: '20.2'
    text: |-
      De herziening geschiedt door de Raad van Beroep op verzoek van degene, tegen wie de beslissing is genomen. Zij kan
      niet tot verzwaring der straf leiden.
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel20
  - number: '21.1'
    text: |-
      Van een beslissing tot oplegging van de in [artikel 18, tweede lid, onder ][ref1], bedoelde straf kan na vijf
      jaren, nadat de beslissing onherroepelijk is geworden, wijziging worden gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0001975#Artikel18
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0001975
        artikel: '18'
  - number: '21.2'
    text: |-
      [Artikel 20, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001975#Artikel20
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0001975
        artikel: '20'
  - number: '22'
    text: Dit reglement kan worden aangehaald onder de titel van "Octrooigemachtigden-reglement".
    url: https://wetten.overheid.nl/BWBR0001975/1998-12-01#Artikel22
