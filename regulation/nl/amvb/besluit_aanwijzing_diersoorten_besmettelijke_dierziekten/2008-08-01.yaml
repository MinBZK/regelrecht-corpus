preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Landbouw, Natuurbeheer en Visserij van 4 oktober 1993, No. J. 9315353,
    Directie Juridische en Bedrijfsorganisatorische Zaken;

    Gelet op Richtlijn nr. 85/511/EEG van de Raad van de Europese Gemeenschappen van 18 november 1985 tot vaststelling
    van gemeenschappelijke maatregelen ter bestrijding van mond- en klauwzeer (PbEG L 315), Richtlijn nr. 92/40/EEG
    van de Raad van de Europese Gemeenschappen van 19 mei 1992 tot vaststelling van communautaire maatregelen voor de
    bestrijding van aviaire influenza (PbEG L 167), Richtlijn nr. 92/66/EEG van de Raad van de Europese Gemeenschappen
    van 14 juli 1992 tot vaststelling van communautaire maatregelen voor de bestrijding van de ziekte van Newcastle
    (PbEG L 260), Richtlijn nr. 92/119/EEG van de Raad van de Europese Gemeenschappen van 17 december 1992 tot
    vaststelling van algemene communautaire maatregelen voor de bestrijding van bepaalde dierziekten en van specifieke
    maatregelen ten aanzien van vesiculaire varkensziekte (PbEG 1993, L 62), Richtlijn nr. 92/117/EEG van de Raad van
    de Europese Gemeenschappen van 17 december 1992 inzake maatregelen voor de bescherming tegen bepaalde zoönoses en
    bepaalde zoönoseverwekkers bij dieren en in produkten van dierlijke oorsprong teneinde door voedsel overgedragen
    infecties en vergiftigingen te voorkomen (PbEG 1993, L 62), Richtlijn nr. 93/53/EEG van de Raad van de Europese
    Gemeenschappen van 24 juni 1993 tot vaststelling van minimale communautaire maatregelen voor de bestrijding van
    bepaalde visziekten (PbEG L 175), Richtlijn nr. 90/425/EEG van de Europese Gemeenschappen van 26 juni 1990 inzake
    veterinaire en zoötechnische controles in het intracommunautaire handelsverkeer in bepaalde levende dieren en
    produkten in het vooruitzicht van de totstandbrenging van de interne markt (PbEG L 224) en Richtlijn nr. 92/65/
    EEG van de Raad van de Europese Gemeenschappen van 13 juli 1992 tot vaststelling van de veterinairrechtelijke
    voorschriften voor het handelsverkeer en de invoer in de Gemeenschap van dieren, sperma, eicellen en embryo’s
    waarvoor ten aanzien van de veterinairrechtelijke voorschriften geen specifieke communautaire regelgeving als
    bedoeld in bijlage A, onder I, van Richtlijn nr. 90/425/EEG geldt (PbEG L 268);

    Gelet op de artikelen 15, eerste lid, onderdeel e, en 85, tweede lid, van de Gezondheids- en welzijnswet voor
    dieren;

    Gezien het advies van de Raad voor dierenaangelegenheden, het Landbouwschap, het Produktschap voor Pluimvee en
    Eieren, het Produktschap voor Vis en Visprodukten en het Bedrijfschap voor de Pluimveehandel en -industrie;

    De Raad van State gehoord (advies van 30 november 1993, No. W11.93.0661.);

    Gezien het nader rapport van de Staatssecretaris van Landbouw, Natuurbeheer en Visserij van 1 februari 1994, No. J.
    9320678, Directie Juridische en Bedrijfsorganisatorische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006450/2008-08-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder wet: [Gezondheids- en welzijnswet voor dieren][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005662
    url: https://wetten.overheid.nl/BWBR0006450/2008-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005662
  - number: '2'
    text: |-
      Als soorten van dieren bedoeld in [artikel 15, eerste lid, onderdeel e, van de wet][ref1] worden aangewezen alle:


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel15
    url: https://wetten.overheid.nl/BWBR0006450/2008-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '15'
  - number: 2.a
    text: diersoorten behorend tot de klasse zoogdieren,
    url: https://wetten.overheid.nl/BWBR0006450/2008-08-01#Artikel2
  - number: 2.b
    text: diersoorten behorend tot de klasse vogels,
    url: https://wetten.overheid.nl/BWBR0006450/2008-08-01#Artikel2
  - number: 2.c
    text: |-
      vissen behorend tot de superklasse Agnatha en tot de klassen Chondrichthyes en Osteichthyes, weekdieren van het
      phylum Mollusca en schaaldieren van het subphylum Crustacea.
    url: https://wetten.overheid.nl/BWBR0006450/2008-08-01#Artikel2
  - number: '3'
    text: |-
      Afdeling 2 van hoofdstuk VIII van de wet is van overeenkomstige toepassing op maatregelen als bedoeld in afdeling 3
      van hoofdstuk II van de wet ter voorkoming en bestrijding van ingevolge artikel 15, eerste lid, aanhef, van de wet
      aangewezen besmettelijke dierziekten bij in [artikel 2][ref1] aangewezen diersoorten.


      [ref1]: https://wetten.overheid.nl/BWBR0006450#Artikel2
    url: https://wetten.overheid.nl/BWBR0006450/2008-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006450
        artikel: '2'
  - number: '4'
    text: 'Dit besluit wordt aangehaald als: Besluit aanwijzing diersoorten besmettelijke dierziekten.'
    url: https://wetten.overheid.nl/BWBR0006450/2008-08-01#Artikel4
  - number: '5'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0006450/2008-08-01#Artikel5
