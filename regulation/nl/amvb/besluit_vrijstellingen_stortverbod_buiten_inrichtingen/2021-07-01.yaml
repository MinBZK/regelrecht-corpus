$id: besluit_vrijstellingen_stortverbod_buiten_inrichtingen
regulatory_layer: AMVB
publication_date: '2020-10-28'
valid_from: '2021-07-01'
bwb_id: BWBR0009093
url: https://wetten.overheid.nl/BWBR0009093/2021-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 4 november 1997,
    nr. MJZ97566858, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Gelet op artikel 10.2, tweede lid, van de Wet milieubeheer;

    De Raad van State gehoord (advies van 26 november 1997, nr. W08.97.0709);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 4
    december 1997, nr. MJZ97580602, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Hebben goedgevonden en verstaan
  url: https://wetten.overheid.nl/BWBR0009093/2021-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: avi-bodemas: de bodemas die resteert na
      verbranding in een inrichting die uitsluitend of in hoofdzaak is bestemd voor het verbranden van huishoudelijke
      afvalstoffen en bedrijfsafvalstoffen in een roosteroven of een wervelbedoven; avi-vliegas: de vliegas die resteert
      na verbranding in een inrichting die uitsluitend of in hoofdzaak is bestemd voor het verbranden van huishoudelijke
      afvalstoffen en bedrijfsafvalstoffen in een roosteroven of een wervelbedoven; bouw- en sloopafval: steenachtige
      bedrijfsafvalstoffen afkomstig van het bouwen of slopen van bouwwerken.
    url: https://wetten.overheid.nl/BWBR0009093/2021-07-01#Artikel1
  - number: '1.2'
    text: |-
      Onze Minister kan bij een ministeriële regeling krachtens het eerste lid bepalen dat, indien in daarbij aangegeven
      gevallen de voor de indeling in een klasse bepalende waarden in een daarbij aan te geven geringe mate worden
      overschreden, die overschrijdingen bij die indeling buiten beschouwing worden gelaten.
    url: https://wetten.overheid.nl/BWBR0009093/2021-07-01#Artikel1
  - number: '2.1'
    text: |-
      Als categorie van gevallen als bedoeld in [artikel 10.2, tweede lid, van de Wet milieubeheer][ref1], wordt
      aangegeven: het zich van afvalstoffen ontdoen door deze - al dan niet in verpakking buiten een inrichting op of in
      de bodem te brengen indien:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0009093/2021-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
  - number: 2.1.a
    text: |-
      daaromtrent regels gelden, die zijn gesteld bij of krachtens het [Activiteitenbesluit milieubeheer][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022762
    url: https://wetten.overheid.nl/BWBR0009093/2021-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0022762
  - number: 2.1.b
    text: |-
      sprake is van het toepassen van bouwstoffen, grond of baggerspecie als bedoeld in het
      [Besluit bodemkwaliteit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0009093/2021-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0022929
  - number: 2.1.c
    text: |-
      dit geschiedt overeenkomstig het [Besluit bodemkwaliteit][ref1] in een werk waarin avi-bodemas wordt gebruikt als
      bouwstof, indien deze:


      [ref1]: https://wetten.overheid.nl/BWBR0022929
    url: https://wetten.overheid.nl/BWBR0009093/2021-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0022929
  - number: 2.1.c.1
    text: |-
      niet als IBC-bouwstof als bedoeld in [artikel 1 van het Besluit bodemkwaliteit][ref1] moet worden aangemerkt,


      [ref1]: https://wetten.overheid.nl/BWBR0022929#Artikel1
    url: https://wetten.overheid.nl/BWBR0009093/2021-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0022929
        artikel: '1'
  - number: 2.1.c.2
    text: niet meer dan 5,5% onverbrand materiaal bevat,
    url: https://wetten.overheid.nl/BWBR0009093/2021-07-01#Artikel2
  - number: 2.1.c.3
    text: niet is vermengd met avi-vliegas, en
    url: https://wetten.overheid.nl/BWBR0009093/2021-07-01#Artikel2
  - number: 2.1.c.4
    text: |-
      ten minste zes weken opgeslagen is voor het gebruik in een werk
      tenzij de avi-bodemas eerder is gebruikt in een werk als bedoeld in
      [artikel 1, eerste lid, onder a, van het Bouwstoffenbesluit bodem- en oppervlaktewaterenbescherming][ref1], of in
      een werk als bedoeld in [artikel 1, eerste lid van het Besluit bodemkwaliteit][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0022929#Artikel1
    url: https://wetten.overheid.nl/BWBR0009093/2021-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007667
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0022929
        artikel: '1'
  - number: 2.1.d
    text: het betreft plantenresten die zijn aangewezen bij regeling van Onze Minister, in de daarbij aangegeven gevallen;
    url: https://wetten.overheid.nl/BWBR0009093/2021-07-01#Artikel2
  - number: 2.1.e
    text: |-
      het betreft meststoffen waarvan het gebruik is toegestaan op grond van het [Besluit gebruik meststoffen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009066
    url: https://wetten.overheid.nl/BWBR0009093/2021-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009066
  - number: '2.2'
    text: |-
      Het eerste lid, onder a, is niet van toepassing met betrekking tot de in dat lid aangegeven handelingen met
      gevaarlijke afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0009093/2021-07-01#Artikel2
  - number: '2.3'
    text: |-
      Het eerste lid, onder a, is evenmin van toepassing met betrekking tot de in dat lid
      bedoelde handelingen met afvalstoffen, behorende tot een categorie waarvoor het in
      [artikel 1, eerste lid, van het Besluit stortplaatsen en stortverboden afvalstoffen][ref1] gestelde verbod geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0009094#Artikel1
    url: https://wetten.overheid.nl/BWBR0009093/2021-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009094
        artikel: '1'
  - number: '2.4'
    text: |-
      Het eerste lid, onder b, is niet van toepassing op bouw- en sloopafval dat niet is verwerkt tot granulaat of dat
      niet uitsluitend bestaat uit natuursteen of beton.
    url: https://wetten.overheid.nl/BWBR0009093/2021-07-01#Artikel2
  - number: '5'
    text: |-
      Na inwerkingtreding van dit besluit: a. berusten de krachtens het Besluit vrijstellingen stortverbod buiten
      inrichtingen (Stb. 1993, 616) vastgestelde regels en andere besluiten op dit besluit; b. worden de met toepassing
      van het Besluit vrijstellingen stortverbod buiten inrichtingen (Stb. 1993, 616) vastgestelde regels en andere
      besluiten gelijkaangemerkt als regels, onderscheidenlijk besluiten, vastgesteld met toepassing van dit besluit.
    url: https://wetten.overheid.nl/BWBR0009093/2021-07-01#Artikel5
  - number: '6'
    text: Het Besluit vrijstellingen stortverbod buiten inrichtingen (Stb. 1993, 616) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009093/2021-07-01#Artikel6
  - number: '7'
    text: |-
      Dit besluit treedt in werking met ingang van de datum waarop vier weken zijn verstreken sedert de datum van
      uitgifte van het Staatsblad waarin het wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0009093/2021-07-01#Artikel7
  - number: '8'
    text: 'Dit besluit wordt aangehaald als: Besluit vrijstellingen stortverbod buiten inrichtingen.'
    url: https://wetten.overheid.nl/BWBR0009093/2021-07-01#Artikel8
