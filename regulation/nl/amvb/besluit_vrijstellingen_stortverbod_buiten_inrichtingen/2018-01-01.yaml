  - number: '5'
    text: |-
      Na inwerkingtreding van dit besluit:

      a. berusten de krachtens het Besluit vrijstellingen stortverbod buiten inrichtingen (Stb. 1993, 616) vastgestelde
      regels en andere besluiten op dit besluit;

      b. worden de met toepassing van het Besluit vrijstellingen stortverbod buiten inrichtingen (Stb. 1993, 616)
      vastgestelde regels en andere besluiten gelijkaangemerkt als regels, onderscheidenlijk besluiten, vastgesteld met
      toepassing van dit besluit.
    url: https://wetten.overheid.nl/BWBR0009093/2018-01-01#Artikel5
  - number: '6'
    text: Het Besluit vrijstellingen stortverbod buiten inrichtingen (Stb. 1993, 616) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009093/2018-01-01#Artikel6
  - number: '7'
    text: |-
      Dit besluit treedt in werking met ingang van de datum waarop vier weken zijn verstreken sedert de datum van
      uitgifte van het Staatsblad waarin het wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0009093/2018-01-01#Artikel7
  - number: '8'
    text: 'Dit besluit wordt aangehaald als: Besluit vrijstellingen stortverbod buiten inrichtingen.'
