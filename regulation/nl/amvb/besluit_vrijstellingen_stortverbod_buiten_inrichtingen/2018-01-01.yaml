articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      avi-bodemas: de bodemas die resteert na verbranding in een inrichting die uitsluitend of in hoofdzaak is
      bestemd voor het verbranden van huishoudelijke afvalstoffen en bedrijfsafvalstoffen in een roosteroven of een
      wervelbedoven;

      avi-vliegas: de vliegas die resteert na verbranding in een inrichting die uitsluitend of in hoofdzaak is
      bestemd voor het verbranden van huishoudelijke afvalstoffen en bedrijfsafvalstoffen in een roosteroven of een
      wervelbedoven;

      bouw- en sloopafval: steenachtige bedrijfsafvalstoffen afkomstig van het bouwen of slopen van bouwwerken.

      2 Onze Minister kan bij een ministeriële regeling krachtens het eerste lid bepalen dat, indien in daarbij
      aangegeven gevallen de voor de indeling in een klasse bepalende waarden in een daarbij aan te geven geringe mate
      worden overschreden, die overschrijdingen bij die indeling buiten beschouwing worden gelaten.
    url: https://wetten.overheid.nl/BWBR0009093/2018-01-01#Artikel1
  - number: '2'
    text: |-
      1 Als categorie van gevallen als bedoeld in [artikel 10.2, tweede lid, van de Wet milieubeheer][ref1], wordt
      aangegeven: het zich van afvalstoffen ontdoen door deze - al dan niet in verpakking buiten een inrichting op of in
      de bodem te brengen indien:

      a. daaromtrent regels gelden, die zijn gesteld bij of krachtens het [Activiteitenbesluit milieubeheer][ref2];

      b. sprake is van het toepassen van bouwstoffen, grond of baggerspecie als bedoeld in het
      [Besluit bodemkwaliteit][ref3];

      c. dit geschiedt overeenkomstig het [Besluit bodemkwaliteit][ref4] in een werk waarin avi-bodemas wordt gebruikt
      als bouwstof, indien deze:

      1. niet meer dan 5,5% onverbrand materiaal bevat,

      2. niet is vermengd met avi-vliegas, en

      3. ten minste zes weken opgeslagen is voor het gebruik in een werk
      tenzij de avi-bodemas eerder is gebruikt in een werk als bedoeld in
      [artikel 1, eerste lid, onder a, van het Bouwstoffenbesluit bodem- en oppervlaktewaterenbescherming][ref5], of in
      een werk als bedoeld in [artikel 1, eerste lid van het Besluit bodemkwaliteit][ref6];

      d. het betreft plantenresten die zijn aangewezen bij regeling van Onze Minister, in de daarbij aangegeven gevallen;

      e. het betreft meststoffen waarvan het gebruik is toegestaan op grond van het [Besluit gebruik meststoffen][ref7].

      2 Het eerste lid, onder a, is niet van toepassing met betrekking tot de in dat lid aangegeven handelingen met
      gevaarlijke afvalstoffen.

      3 Het eerste lid, onder a, is evenmin van toepassing met betrekking tot de in dat lid
      bedoelde handelingen met afvalstoffen, behorende tot een categorie waarvoor het in
      [artikel 1, eerste lid, van het Besluit stortplaatsen en stortverboden afvalstoffen][ref8] gestelde verbod geldt.

      4 Het eerste lid, onder b, is niet van toepassing op bouw- en sloopafval dat niet is verwerkt tot granulaat of dat
      niet uitsluitend bestaat uit natuursteen of beton.


