  - number: 1.c
    text: |-
      besluit tot voorlopige aanwijzing: een besluit als bedoeld in [artikel 6 van de wet][ref1], alsmede een besluit als
      bedoeld in [artikel 9a, eerste lid][ref2], in samenhang met [artikel 6 van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003391#Artikel9a
      [ref3]: https://wetten.overheid.nl/BWBR0003391#Artikel6
    url: https://wetten.overheid.nl/BWBR0003720/2008-07-01#Artikel1
