      - id: ref3
        bwb_id: BWBR0003391
        artikel: '6'
  - number: '2.1'
    text: 'Het besluit tot aanwijzing of voorlopige aanwijzing vermeldt ten aanzien van de aangewezen gronden:'
    url: https://wetten.overheid.nl/BWBR0003720/2008-07-01#Artikel2
  - number: 2.1.a
    text: |-
      de kadastrale aanduidingen, bestaande uit achtereenvolgens de naam der kadastrale gemeente, de aanduiding der
      sectie en het perceelnummer van de in de aanwijzing opgenomen percelen in numerieke volgorde geplaatst;
    url: https://wetten.overheid.nl/BWBR0003720/2008-07-01#Artikel2
  - number: 2.1.b
    text: |-
      de grootte volgens de registers van het kadaster van elk der in de aanwijzing opgenomen percelen en indien een
      gedeelte van een perceel in de aanwijzing is opgenomen, de grootte van dat gedeelte;
    url: https://wetten.overheid.nl/BWBR0003720/2008-07-01#Artikel2
  - number: 2.1.c
    text: |-
      de namen volgens de registers van het kadaster van de eigenaren van de in de aanwijzing opgenomen percelen en
      perceelsgedeelten en van de rechthebbenden op de daarop rustende zakelijke rechten;
    url: https://wetten.overheid.nl/BWBR0003720/2008-07-01#Artikel2
  - number: '2.2'
    text: |-
      Het besluit tot aanwijzing of voorlopige aanwijzing vermeldt tevens ten aanzien van elk tot de aangewezen gronden
      behorend perceel of perceelsgedeelte de planologische grondslag op basis waarvan het besluit is genomen, alsmede
      voor zover nodig de geldingsduur.
    url: https://wetten.overheid.nl/BWBR0003720/2008-07-01#Artikel2
  - number: '2.3'
    text: |-
      Het besluit vermeldt voorts of, en zo ja, wanneer en op welke grondslag het perceel eerder was aangewezen alsmede
      het tijdstip waarop het bevoegd gezag de vorige aanwijzing heeft doen vervallen.
    url: https://wetten.overheid.nl/BWBR0003720/2008-07-01#Artikel2
  - number: '3.1'
    text: |-
      Het kadastraal overzicht, bedoeld in [artikel 3, derde lid, van de wet][ref1] wordt ingericht met inachtneming van
      de volgende voorschriften:


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel3
    url: https://wetten.overheid.nl/BWBR0003720/2008-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '3'
  - number: 3.1.a
    text: |-
      de kaart wordt vervaardigd op een schaal van tenminste 1 op 2500, waarop de kadastrale indeling van het gebied
      waarin zich aangewezen gronden bevinden is aangegeven;
    url: https://wetten.overheid.nl/BWBR0003720/2008-07-01#Artikel3
  - number: 3.1.b
    text: de aangewezen gronden worden met een duidelijke ononderbroken lijn of arcering op de kaart aangegeven;
    url: https://wetten.overheid.nl/BWBR0003720/2008-07-01#Artikel3
  - number: 3.1.c
    text: uit de kaart moet de kadastrale sectie-indeling blijken door middel van een onderbroken lijn;
    url: https://wetten.overheid.nl/BWBR0003720/2008-07-01#Artikel3
  - number: 3.1.d
    text: uit de kaart moet de aansluiting van de aangewezen gronden aan het daaromheen gelegen gebied blijken;
    url: https://wetten.overheid.nl/BWBR0003720/2008-07-01#Artikel3
  - number: 3.1.e
    text: |-
      op de kaart wordt aangegeven een noordpijl, alsmede de naam van de gemeente en in geval van afwijking tevens de
      naam van de kadastrale gemeente.
    url: https://wetten.overheid.nl/BWBR0003720/2008-07-01#Artikel3
  - number: '3.2'
    text: |-
      De kaart moet op duidelijke en overzichtelijke wijze worden uitgevoerd, teneinde voor een ieder toegankelijk te
      zijn. Hij moet voorts van duurzaam materiaal vervaardigd worden en goed vermenigvuldigbaar zijn.
    url: https://wetten.overheid.nl/BWBR0003720/2008-07-01#Artikel3
  - number: '4.1'
    text: |-
      De mededeling, bedoeld in [artikel 7, tweede lid, van de wet][ref1] aan de in het besluit tot aanwijzing of
      voorlopige aanwijzing vermelde eigenaren en beperkt gerechtigden, gaat vergezeld van een afschrift van het besluit
      dan wel een uittreksel daaruit met de voor de geadresseerde eigenaar of beperkt gerechtigde van belang zijnde
      gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel7
    url: https://wetten.overheid.nl/BWBR0003720/2008-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '7'
  - number: '4.2'
    text: |-
      De mededeling van het besluit tot aanwijzing door provinciale staten of Onze Minister en de kennisgeving van het
      besluit tot voorlopige aanwijzing door gedeputeerde staten vermeldt tevens:
    url: https://wetten.overheid.nl/BWBR0003720/2008-07-01#Artikel4
  - number: 4.2.a
    text: of het betrokken perceel reeds is aangewezen door een ander bevoegd gezag;
    url: https://wetten.overheid.nl/BWBR0003720/2008-07-01#Artikel4
  - number: 4.2.b
    text: |-
      het rechtsgevolg van het besluit voor een reeds bestaande aanwijzing of voorlopige aanwijzing van het betrokken
      perceel;
    url: https://wetten.overheid.nl/BWBR0003720/2008-07-01#Artikel4
  - number: 4.2.c
    text: |-
      indien een opgave als bedoeld in [artikel 11, eerste lid, van de wet][ref1], is gedaan, op welke wijze
      gedeputeerde staten onderscheidenlijk Onze Minister invulling geven aan de indeplaatstreding, bedoeld in
      [artikel 9a, vijfde onderscheidenlijk zesde lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0003391#Artikel9a
    url: https://wetten.overheid.nl/BWBR0003720/2008-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0003391
        artikel: 9a
  - number: '7'
    text: |-
      Alle schriftelijke mededelingen of kennisgevingen aan of van de verkoper, in de wet voorzien, worden gedaan bij
      aangetekende brief of tegen bericht van ontvangst.
    url: https://wetten.overheid.nl/BWBR0003720/2008-07-01#Artikel7
  - number: '8.1'
    text: |-
      Gedeputeerde Staten zenden aan burgemeester en wethouders afschrift van een verzoek om ontheffing, als bedoeld in
      artikel 14 van de wet.
    url: https://wetten.overheid.nl/BWBR0003720/2008-07-01#Artikel8
  - number: '8.2'
    text: |-
      Gedeputeerde Staten zenden aan burgemeester en wethouders terstond bericht indien tegen een door hen op grond
      van de wet genomen besluit bij hen een bezwaarschrift is ingediend, dan wel bij de rechtbank of bij de Afdeling
      bestuursrechtspraak van de Raad van State - in hoger beroep - een beroepschrift. Van de desbetreffende uitspraak
      zenden zij burgemeester en wethouders eveneens terstond bericht.
    url: https://wetten.overheid.nl/BWBR0003720/2008-07-01#Artikel8
  - number: '9.1'
    text: |-
      Burgemeester en wethouders, gedeputeerde staten of Onze Minister zenden aan de verkoper afschrift van een verzoek
      aan de rechtbank, als bedoeld in [artikel 16, eerste lid][ref1], en [artikel 17, eerste lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0003391#Artikel17
    url: https://wetten.overheid.nl/BWBR0003720/2008-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0003391
        artikel: '17'
  - number: '9.2'
    text: |-
      Indien de verkoper met toepassing van [artikel 17, tweede lid, van de wet][ref1] de rechtbank verzoekt om een
      oordeel over de prijs te geven, zendt hij tegelijkertijd een afschrift van zijn verzoek aan burgemeester en
      wethouders, gedeputeerde staten of Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel17
    url: https://wetten.overheid.nl/BWBR0003720/2008-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '17'
  - number: '9.3'
    text: |-
      Indien burgemeester en wethouders, gedeputeerde staten of Onze Minister ingevolge
      [artikel 17, derde lid, van de wet][ref1] de verkoper berichten dat de gemeente, de provincie of de Staat alsnog
      van de aankoop afziet, zenden zij tegelijkertijd een afschrift van dat bericht aan de rechtbank.


      [ref1]: https://wetten.overheid.nl/BWBR0003391#Artikel17
    url: https://wetten.overheid.nl/BWBR0003720/2008-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003391
        artikel: '17'
  - number: '10'
    text: |-
      De toezending van een exemplaar van het advies, bedoeld in artikel 16, vierde lid, van de wet aan ieder van beide
      partijen geschiedt onder dezelfde dagtekening als de nederlegging daarvan ter griffie van de rechtbank.
    url: https://wetten.overheid.nl/BWBR0003720/2008-07-01#Artikel10
  - number: '11.1'
    text: |-
      Dit besluit treedt in werking tegelijk met de [Wet voorkeursrecht gemeenten][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003391
    url: https://wetten.overheid.nl/BWBR0003720/2008-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003391
  - number: '11.2'
    text: Het kan worden aangehaald als "Besluit voorkeursrecht gemeenten".
    url: https://wetten.overheid.nl/BWBR0003720/2008-07-01#Artikel11
