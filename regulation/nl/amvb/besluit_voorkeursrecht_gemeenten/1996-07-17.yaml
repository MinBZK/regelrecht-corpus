  - number: '2'
    text: |-
      1 Het raadsbesluit en het voorstel van burgemeester en wethouders vermelden ten aanzien van de aangewezen gronden:

      a. de kadastrale aanduidingen, bestaande uit achtereenvolgens de naam der kadastrale gemeente, de aanduiding der
      sectie en het perceelnummer van de in de aanwijzing opgenomen percelen in numerieke volgorde geplaatst;

      b. de grootte volgens de registers van het kadaster van elk der in de aanwijzing opgenomen percelen en indien een
      gedeelte van een perceel in de aanwijzing is opgenomen, de grootte van dat gedeelte;

      c. de namen volgens de registers van het kadaster van de eigenaren van de in de aanwijzing opgenomen percelen en
      perceelsgedeelten en van de rechthebbenden op de daarop rustende zakelijke rechten;

      een en ander bestaande op een in het raadsbesluit of het voorstel van burgemeester en wethouders aangegeven
      tijdstip.

      2 Het raadsbesluit en het voorstel van burgemeester en wethouders vermelden tevens ten aanzien van elk tot de
      aangewezen gronden behorend perceel of perceelsgedeelte de planologische grondslag waarop het besluit of het
      voorstel berust, alsmede voor zover nodig de geldingsduur.

      3 Het raadsbesluit en het voorstel van burgemeester en wethouders vermelden voorts of, en zo ja, wanneer en
      op welke grondslag het perceel eerder was aangewezen alsmede het tijdstip waarop het bevoegd gezag de vorige
      aanwijzing heeft doen vervallen.
    url: https://wetten.overheid.nl/BWBR0003720/1996-07-17#Artikel2
  - number: '3'
    text: |-
      1 De kadastrale kaart bedoeld in [artikel 2, derde lid][ref1], van de wet wordt ingericht met inachtneming van de
      volgende voorschriften:

      a. de kaart wordt vervaardigd op een schaal van tenminste 1 op 2500, waarop de kadastrale indeling van het gebied
      waarin zich aangewezen gronden bevinden is aangegeven;

      b. de aangewezen gronden worden met een duidelijke ononderbroken lijn of arcering op de kaart aangegeven;

      c. uit de kaart moet de kadastrale sectie-indeling blijken door middel van een onderbroken lijn;

      d. uit de kaart moet de aansluiting van de aangewezen gronden aan het daaromheen gelegen gebied blijken;

      e. op de kaart wordt aangegeven een noordpijl, alsmede de naam van de gemeente en in geval van afwijking tevens de
      naam van de kadastrale gemeente.

      2 De kaart moet op duidelijke en overzichtelijke wijze worden uitgevoerd, teneinde voor een ieder toegankelijk te
      zijn. Hij moet voorts van duurzaam materiaal vervaardigd worden en goed vermenigvuldigbaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003720#Artikel2
