articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. de wet: de [Wet voorkeursrecht gemeenten][ref1];

      b. een raadsbesluit: een besluit als bedoeld in [artikel 2, eerste lid][ref2], of
      [artikel 8, eerste lid van de wet][ref3];

      c. een voorstel van burgemeester en wethouders: een voorstel als bedoeld in [artikel 6, eerste lid][ref4], of
      [artikel 8][ref5];

      d. verkoper: verkoper als bedoeld in [artikel 1 van de wet][ref6].


