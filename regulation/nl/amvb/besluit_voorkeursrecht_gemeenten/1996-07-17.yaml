        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003720
        hoofdstuk: IV
  - number: '5'
    text: |-
      1 Burgemeester en wethouders houden een registratie van de in hun gemeente ingevolge de wet aangewezen gronden.

      2 De registratie bevat de gegevens per perceel of perceelsgedeelte, die nodig zijn voor het verkrijgen van een goed
      inzicht in een gevestigd voorkeursrecht.

      3 De registratie en het raadsbesluit of het voorstel van burgemeester en wethouders met de daarbij behorende
      stukken kunnen gedurende werkuren en ten minste drie aaneengesloten uren per week buiten de werkuren ter
      gemeentesecretarie kosteloos door een ieder worden geraadpleegd.

      4 Burgemeester en wethouders verstrekken desverzocht aan een ieder de gegevens uit de registratie, bedoeld in
      het eerste lid. Zij kunnen de kosten daarvan aan verzoeker in rekening brengen. Desgevraagd verstrekken zij deze
      gegevens terstond.
    url: https://wetten.overheid.nl/BWBR0003720/1996-07-17#Artikel5
  - number: '7'
    text: |-
      Alle schriftelijke mededelingen of kennisgevingen aan of van de verkoper, in de wet voorzien, worden gedaan bij
      aangetekende brief of tegen bericht van ontvangst.
    url: https://wetten.overheid.nl/BWBR0003720/1996-07-17#Artikel7
  - number: '8'
    text: |-
      1 Gedeputeerde Staten zenden aan burgemeester en wethouders afschrift van een verzoek om ontheffing, als bedoeld in
      artikel 14 van de wet.

      2 Gedeputeerde Staten zenden aan burgemeester en wethouders terstond bericht indien tegen een door hen op grond
      van de wet genomen besluit bij hen een bezwaarschrift is ingediend, dan wel bij de rechtbank of bij de Afdeling
      bestuursrechtspraak van de Raad van State - in hoger beroep - een beroepschrift. Van de desbetreffende uitspraak
      zenden zij burgemeester en wethouders eveneens terstond bericht.
    url: https://wetten.overheid.nl/BWBR0003720/1996-07-17#Artikel8
  - number: '9'
    text: |-
      1 Burgemeester en wethouders zenden aan de verkoper afschrift van een verzoek aan de rechtbank, als bedoeld in
      artikel 16, eerste lid, en artikel 17, eerste lid, van de wet.

      2 Indien de verkoper met toepassing van artikel 17, tweede lid, van de wet de rechtbank verzoekt om een oordeel
      over de prijs te geven, zendt hij tegelijkertijd een afschrift van zijn verzoek aan burgemeester en wethouders.

      3 Indien burgemeester en wethouders ingevolge artikel 17, derde lid, van de wet de verkoper berichten dat de
      gemeente alsnog van de aankoop afziet, zenden zij tegelijkertijd een afschrift van dat bericht aan de rechtbank.
    url: https://wetten.overheid.nl/BWBR0003720/1996-07-17#Artikel9
  - number: '10'
    text: |-
      De toezending van een exemplaar van het advies, bedoeld in artikel 16, vierde lid, van de wet aan ieder van beide
      partijen geschiedt onder dezelfde dagtekening als de nederlegging daarvan ter griffie van de rechtbank.
    url: https://wetten.overheid.nl/BWBR0003720/1996-07-17#Artikel10
  - number: '11'
    text: |-
      1 Dit besluit treedt in werking tegelijk met de [Wet voorkeursrecht gemeenten][ref1].

      2 Het kan worden aangehaald als "Besluit voorkeursrecht gemeenten".


