  - number: '4'
    text: |-
      De kennisgeving overeenkomstig [artikel 4, tweede lid][ref1], van de wet aan de in het raadsbesluit of het voorstel
      van burgemeester en wethouders vermelde eigenaren en beperkt gerechtigden, gaat vergezeld van een afschrift van het
      raadsbesluit onderscheidenlijk het voorstel van burgemeester en wethouders dan wel een uittreksel daaruit met de
      voor de geadresseerde eigenaar of beperkt gerechtigde van belang zijnde gegevens en van een mededeling omtrent het
      bestaan en het doel van de registratie, bedoeld in [hoofdstuk IV][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003720#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003720#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0003720/1996-07-17#Artikel4
