    text: Dit besluit treedt in werking met ingang van 1 januari 2015.
    url: https://wetten.overheid.nl/BWBR0035560/2023-01-21#Artikel16
  - number: '17'
    text: 'Dit besluit wordt aangehaald als: Warenwetbesluit hoeveelheden voorverpakkingen.'
    url: https://wetten.overheid.nl/BWBR0035560/2023-01-21#Artikel17
