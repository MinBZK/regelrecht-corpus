  - number: '9'
    text: |-
      De termijn gedurende welke de in bijlage I, punt 4, vijfde alinea, van [Richtlijn 76/211/EEG](31976L0211), bedoelde
      documenten ter beschikking van de met het toezicht op de naleving van dit besluit belaste ambtenaren of personen
      worden gehouden, bedraagt ten minste één jaar.
    url: https://wetten.overheid.nl/BWBR0035560/2023-01-21#Artikel9
  - number: '11'
    text: |-
      Indien op een voorverpakking geen ℮-teken is aangebracht bevat de voorverpakking in elk geval de hoeveelheid van de
      waar die op de verpakking wordt aangegeven.
    url: https://wetten.overheid.nl/BWBR0035560/2023-01-21#Artikel11
  - number: '12'
    text: |-
      1 Gedistilleerde drank dat in een voorverpakking binnen het in punt 1 van de bijlage bij [Richtlijn 2007/45/EG]
      (32007L0045) vermelde interval voor gedistilleerde drank is verpakt, wordt uitsluitend in de handel gebracht indien
      het is voorverpakt in de in punt 1 van die bijlage voor gedistilleerde dranken vermelde nominale hoeveelheden.

      2 Het eerste lid is niet van toepassing op voorverpakte gedistilleerde drank die in belastingvrije winkels wordt
      verkocht voor consumptie buiten de Europese Unie.

      3 Bij twee of meer individuele voorverpakkingen van gedistilleerde drank die samen een meervoudige verpakking
      vormen, zijn de in punt 1 van de bijlage bij [Richtlijn 2007/45/EG](32007L0045) opgenomen hoeveelheden van
      toepassing op elke individuele voorverpakking.

      4 Indien een voorverpakking van gedistilleerde drank bestaat uit twee of meer individuele verpakkingen die niet
      voor individuele verkoop zijn bestemd, zijn de in punt 1 van de bijlage bij [Richtlijn 2007/45/EG](32007L0045)
      opgenomen nominale hoeveelheden van toepassing op de voorverpakking.
    url: https://wetten.overheid.nl/BWBR0035560/2023-01-21#Artikel12
  - number: '15'
    text: |-
      Het [Hoeveelheidsaanduidingenbesluit (Warenwet)][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0003310
