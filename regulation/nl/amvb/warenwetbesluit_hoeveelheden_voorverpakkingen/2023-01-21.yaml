preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volksgezondheid, Welzijn en Sport van 24 juni 2014, kenmerk 382626-122055-
    VGP, gedaan in overeenstemming met Onze Minister van Economische Zaken;

    Gelet op:

    De Afdeling advisering van de Raad van State gehoord (advies van 9 juli 2014, No.W13.14.0216/III);

    Gezien het nader rapport van Onze Minister van Volksgezondheid, Welzijn en Sport van 6 augustus 2014, 645331-
    123909-VGP, uitgebracht in overeenstemming met Onze Minister van Economische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0035560/2023-01-21#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

        - *bedrijfscontrolesysteem:* de wijze waarop bedrijfscontroles als bedoeld in bijlage I, punt 4, vijfde alinea, van
      [Richtlijn 76/211/EEG](31976L0211), worden uitgeoefend;
        - *derde land:* een staat, die geen lidstaat van de Europese Unie is, geen partij is bij een tot een douane-unie
      strekkend Verdrag, dan wel een staat die geen partij is bij een tot een vrijhandelszone strekkend Verdrag dat
      Nederland bindt;
        - *℮-teken:* het teken bedoeld in bijlage I, punt 3.3, van [Richtlijn 76/211/EEG](31976L0211);
        - *metrologische instantie:* de door de Minister van Volksgezondheid, Welzijn en Sport aangewezen rechtspersoon;
        - *gedistilleerde drank*: drank als bedoeld in artikel 2 van [verordening (EU) 2019/787](32687R2019) van het
      Europees Parlement en de Raad van 17 april 2019 betreffende de definitie, omschrijving, presentatie en etikettering
      van gedistilleerde dranken, het gebruik van de namen van gedistilleerde dranken in de presentatie en etikettering
      van andere levensmiddelen en de bescherming van geografische aanduidingen van gedistilleerde dranken, het
      gebruik van ethylalcohol en distillaten uit landbouwproducten in alcoholhoudende dranken, en tot intrekking van
      [Verordening (EG) nr. 110/2008](32008R0110) (PbEU 2019, L 130);
        - *in de handel brengen:* voor het eerst tegen vergoeding of gratis in Nederland, een andere lidstaat van de
      Europese Unie, of in een staat, niet zijnde een lidstaat van de Europese Unie, die partij is bij een tot de douane-
      unie strekkend Verdrag, dan wel een staat die partij is bij een tot een vrijhandelszone strekken Verdrag dat
      Nederland bindt een voorverpakking met daarop een ℮-teken of gedistilleerde drank ter beschikking te stellen met
      het oog op distributie ervan;
        - *importeur:* degene die in de uitoefening van een bedrijf dat in Nederland is gevestigd voorverpakkingen met
      daarop een ℮-teken in de handel brengt of beoogt te brengen die afkomstig zijn uit een derde land;
        - *Richtlijn 2007/45/EG:* [Richtlijn 2007/45/EG](32007L0045) van het Europees Parlement en de Raad van 5 september
      2007 tot vaststelling van regels betreffende nominale hoeveelheden voor voorverpakte producten, tot intrekking van
      de [Richtlijnen 75/106/EEG](31975L0106) en [80/232/EEG](31980L0232) van de Raad en tot wijziging van [Richtlijn
      76/211/EEG](31976L0211) van de Raad (PbEU 2007, L 247);
        - *Richtlijn 76/211/EEG:* [Richtlijn 76/211/EEG](31976L0211) van de Raad van 20 januari 1976 betreffende de
      onderlinge aanpassing van de wetgevingen der Lid-Staten inzake het voorverpakken naar gewicht of volume van
      bepaalde producten in voorverpakkingen (PbEG 1976, L 46);
        - *voorverpakking:* het geheel van een product en de individuele verpakking waarin het is voorverpakt, waarbij
      voldaan is aan artikel 2, tweede lid, van [Richtlijn 76/211/EEG](31976L0211);
        - *vulbedrijf:* degene die in de uitoefening van een bedrijf dat in Nederland is gevestigd voorverpakkingen met
      daarop een ℮-teken afvult.

      2 Dit besluit is van toepassing op voorverpakkingen als bedoeld in artikel 1 van [Richtlijn 76/211/EEG]
      (31976L0211).
    url: https://wetten.overheid.nl/BWBR0035560/2023-01-21#Artikel1
  - number: '2'
    text: |-
      1 Het is verboden voorverpakkingen in de handel te brengen anders dan met inachtneming van de bij dit besluit
      gestelde voorschriften.

      2 Het is verboden gedistilleerde drank in een voorverpakking in de handel te brengen anders dan met inachtneming
      van [artikel 12][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035560#Artikel12
    url: https://wetten.overheid.nl/BWBR0035560/2023-01-21#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0035560
        artikel: '12'
        paragraaf: '4'
  - number: '3'
    text: |-
      Het in de handel brengen van voorverpakkingen met daarop het ℮-teken geschiedt met inachtneming van de bij de
      artikelen 3, eerste lid, en 4, eerste tot en met derde lid, van [Richtlijn 76/211/EEG](31976L0211) gestelde
      voorschriften.
    url: https://wetten.overheid.nl/BWBR0035560/2023-01-21#Artikel3
  - number: '4'
    text: |-
      Een geregeld meetinstrument als bedoeld in de [Metrologiewet][ref1] is een wettig meetmiddel als bedoeld in
      bijlage I, punt 4, tweede alinea, van [Richtlijn 76/211/EEG](31976L0211).


      [ref1]: https://wetten.overheid.nl/BWBR0019517
    url: https://wetten.overheid.nl/BWBR0035560/2023-01-21#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0019517
  - number: '5'
    text: |-
      1 Indien een vulbedrijf niet de werkelijke inhoud van elke voorverpakking met daarop een ℮-teken meet, beschikt het
      vulbedrijf over een door Onze Minister erkend bedrijfscontrolesysteem.

      2 Onze Minister verleent de erkenning van een bedrijfscontrolesysteem indien de controle door het vulbedrijf
      dusdanig geschiedt dat de waarde van de inhoud van de voorverpakking met daarop een ℮-teken gegarandeerd is.

      3 Onze Minister geeft voorafgaande aan een definitieve erkenning van een bedrijfscontrolesysteem van een vulbedrijf
      een voorlopige erkenning.

      4 Voordat Onze Minister overgaat tot een voorlopige of definitieve erkenning van een bedrijfscontrolesysteem wordt
      de metrologische instantie gehoord.

      5 De voorlopige erkenning voor de betrokkene van een bedrijfscontrolesysteem vervalt van rechtswege na een periode
      van zes maanden, of, indien dit eerder is, met ingang van de inwerkingtreding van een besluit tot verlening of tot
      weigering van een definitieve erkenning van een bedrijfscontrolesysteem.
    url: https://wetten.overheid.nl/BWBR0035560/2023-01-21#Artikel5
  - number: '6'
    text: |-
      1 Indien de importeur niet de werkelijke inhoud van elke voorverpakking met daarop een ℮-teken meet, beschikt de
      importeur over een door Onze Minister erkend bedrijfscontrolesysteem dan wel een verklaring waaruit blijkt dat de
      werkelijke inhoud van voorverpakkingen met daarop het ℮-teken is gegarandeerd.

      2 Een verklaring als bedoeld in het eerste lid wordt afgegeven als voldaan is aan bijlage I, punt 4, zesde alinea,
      van [Richtlijn 76/211/EEG](31976L0211). Voordat de verklaring wordt afgegeven wordt de metrologische instantie
      gehoord.

      3 Indien een importeur gebruik maakt van een bedrijfscontrolesysteem is
      [artikel 5, tweede tot en met vijfde lid][ref1], van overeenkomstige toepassing op de erkenning van het
      bedrijfscontrolesysteem.


      [ref1]: https://wetten.overheid.nl/BWBR0035560#Artikel5
    url: https://wetten.overheid.nl/BWBR0035560/2023-01-21#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0035560
        artikel: '5'
        paragraaf: '2'
  - number: '7'
    text: |-
      1 De aanvrager is aan Onze Minister een retributie verschuldigd voor elke ingediende aanvraag voor en afgifte van
      een voorlopige of definitieve erkenning van een bedrijfscontrolesysteem en voor de aanvraag voor en de afgifte van
      een verklaring als bedoeld in [artikel 6][ref1].

      2 Onze Minister stelt ter uitvoering van het eerste lid nadere regels. Deze regels hebben in elk geval betrekking
      op de hoogte van de retributies voor de voorlopige of definitieve erkenning van een bedrijfscontrolesysteem en de
      afgifte van een verklaring als bedoeld in [artikel 6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0035560#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0035560#Artikel6
    url: https://wetten.overheid.nl/BWBR0035560/2023-01-21#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0035560
        artikel: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0035560
        artikel: '6'
        paragraaf: '2'
  - number: '8'
    text: |-
      De voorlopige of definitieve erkenning van een bedrijfscontrolesysteem, of een verklaring als bedoeld in
      [artikel 6][ref1], kan door Onze Minister worden ingetrokken indien:

      a. het betrokken vulbedrijf of de importeur geen medewerking verleent aan ambtenaren of personen in dienst van een
      privaatrechtelijke rechtspersoon die op grond van [artikel 25][ref2] onderscheidenlijk [25a van de Warenwet][ref3]
      zijn belast met het toezicht op de naleving van dit besluit;

      b. bij een onderzoek van een partij voorverpakkingen met daarop een ℮-teken door ambtenaren of personen
      in dienst van een privaatrechtelijke rechtspersoon die op grond van [artikel 25][ref4] onderscheidenlijk
      [25a van de Warenwet][ref5] zijn belast met het toezicht op de naleving van dit besluit, is vastgesteld dat het
      toegepaste bedrijfscontrolesysteem onvoldoende zekerheid biedt voor de naleving van dit besluit; of

      c. het vulbedrijf of de importeur een voorverpakking met daarop een ℮-teken verhandelt ten aanzien waarvan niet is
      voldaan aan dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0035560#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0001969#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0001969#Artikel25a
      [ref4]: https://wetten.overheid.nl/BWBR0001969#Artikel25
      [ref5]: https://wetten.overheid.nl/BWBR0001969#Artikel25a
    url: https://wetten.overheid.nl/BWBR0035560/2023-01-21#Artikel8
