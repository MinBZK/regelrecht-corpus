---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_rendementseisen_cv_ketels
regulatory_layer: AMVB
publication_date: '2017-09-07'
valid_from: '2017-01-01'
bwb_id: BWBR0005828
url: https://wetten.overheid.nl/BWBR0005828/2017-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Economische Zaken van 5 oktober 1992, nr. 92075619 WJA/W, gedaan in
    overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

    Gelet op de richtlijn nr. 92/42/EEG van de Raad van de Europese Gemeenschappen van 21 mei 1992 betreffende de
    rendementseisen voor nieuwe olie- en gasgestookte centrale-verwarmingsketels (PbEG L 167) en op de artikelen 2, 6
    en 21 van de Wet energiebesparing toestellen (Stb. 1986, 59);

    De Raad van State gehoord (advies van 22 december 1992, nr. W10.92 0473);

    Gezien het nader rapport van Onze Minister van Economische Zaken van 30 december 1992, nr. 92101769 WJA/W,
    uitgebracht in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder: *ketel:* het geheel van een ketellichaam en een brander van een uitsluitend
      met vloeibare of gasvormige brandstoffen gestookt en voor verwarming van een of meer ruimten bestemd toestel, dat
      de verbrandingswarmte op water overbrengt, met een nominaal vermogen van niet minder dan 4 kW en niet meer dan 400
      kW; *onderdeel:*
    url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#Artikel1
  - number: 1.a
    text: een ketellichaam waarop een brander behoort te worden gemonteerd dan wel
    url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#Artikel1
  - number: 1.b
    text: een brander die op een ketellichaam behoort te worden gemonteerd,
    url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#Artikel1
  - number: '2'
    text: 'Dit besluit is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#Artikel2
  - number: 2.a
    text: |-
      ketels die moeten worden gestookt met brandstoffen waarvan de eigenschappen aanzienlijk afwijken van normaal in de
      handel verkrijgbare oliën of gassen, zoals industriële restgassen en biogas;
    url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#Artikel2
  - number: 2.b
    text: |-
      ketels die zijn ontworpen om hoofdzakelijk de ruimte waarin zij zijn geïnstalleerd te verwarmen en die als
      nevenfunctie tevens warm water leveren voor verwarming van een of meer andere ruimten of voor gebruik als tapwater;
    url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#Artikel2
  - number: 2.c
    text: ketels die niet in serie geproduceerd worden;
    url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#Artikel2
  - number: 2.d
    text: ketels die reeds eerder geïnstalleerd en gebruikt zijn;
    url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#Artikel2
  - number: 2.e
    text: onderdelen van ketels als bedoeld onder *a, b, c* en *d*.
    url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#Artikel2
  - number: '3.1'
    text: |-
      Het is verboden ketels of onderdelen ten verkoop voorhanden te hebben, ten verkoop aan te bieden, te verkopen, te
      verhuren of te installeren die:
    url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#Artikel3
  - number: 3.1.a
    text: |-
      niet voldoen aan de in [artikel 4][ref1] gestelde eisen;


      [ref1]: https://wetten.overheid.nl/BWBR0005828#Artikel4
    url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005828
        artikel: '4'
  - number: 3.1.b
    text: |-
      niet overeenkomstig [artikel 6][ref1] zijn voorzien van de CE-markering;


      [ref1]: https://wetten.overheid.nl/BWBR0005828#Artikel6
    url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005828
        artikel: '6'
  - number: 3.1.c
    text: |-
      anders dan met inachtneming van [artikel 7][ref1] zijn voorzien van een of meer merktekens als in dat artikel
      bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005828#Artikel7
    url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005828
        artikel: '7'
  - number: '3.2'
    text: |-
      Het is verboden op een ketel of een onderdeel een markering aan te brengen waarvan de betekenis of vormgeving met
      die van de CE-markering zou kunnen worden verward.
    url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#Artikel3
  - number: '3.3'
    text: |-
      Het is verboden op een ketel of een onderdeel een merkteken aan te brengen dat met een merkteken als bedoeld in
      [artikel 7][ref1] kan worden verward.


      [ref1]: https://wetten.overheid.nl/BWBR0005828#Artikel7
    url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005828
        artikel: '7'
  - number: '3.4'
    text: |-
      Het eerste, tweede en derde lid zijn niet van toepassing op ketels of onderdelen die kennelijk bestemd zijn om
      buiten de gebieden waarop de Overeenkomst betreffende de Europese Economische Ruimte van toepassing is in de handel
      te worden gebracht.
    url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#Artikel3
  - number: '4.1'
    text: |-
      Ketels moeten voldoen aan de in de onderstaande tabel per soort ketel weergegeven eisen inzake waterzijdig
      rendement:
    url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#Artikel4
  - number: 4.1.a
    text: bij werking op nominaal vermogen en
    url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#Artikel4
  - number: 4.1.b
    text: |-
      bij werking in een deellast van 30 % waarbij de temperatuur, bedoeld in de tabel, afhankelijk van het soort ketel
      varieert.
    url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#Artikel4
  - number: '4.2'
    text: |-
      Indien een ketel bestemd is voor zowel het verwarmen van een of meer ruimten als het leveren van warm tapwater,
      hebben de rendementseisen, bedoeld in het eerste lid, alleen betrekking op de functie van ruimteverwarming.
    url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#Artikel4
  - number: '5'
    text: |-
      Ketels worden in elk geval vermoed aan de in [artikel 4, eerste lid][ref1], bedoelde rendementseisen te voldoen,
      indien zij in overeenstemming zijn met:


      [ref1]: https://wetten.overheid.nl/BWBR0005828#Artikel4
    url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005828
        artikel: '4'
  - number: 5.a
    text: |-
      de ter uitvoering van artikel 5, tweede lid, van de richtlijn opgestelde geharmoniseerde normen, waarvan de
      referentienummers in het *Publikatieblad van de Europese Gemeenschappen* zijn bekendgemaakt;
    url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#Artikel5
  - number: 5.b
    text: |-
      de normen waarin de onder *a* bedoelde geharmoniseerde normen in Nederland zijn omgezet en waarvan de
      referentienummers door Onze Minister in de *Nederlandse Staatscourant* zijn bekendgemaakt;
    url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#Artikel5
  - number: 5.c
    text: |-
      de normen waarin de onder *a* bedoelde geharmoniseerde normen in een andere lid-staat van de Europese Unie of een
      andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte zijn omgezet en waarvan
      de referentienummers in die staat zijn bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#Artikel5
  - number: '6.1'
    text: |-
      Ketels dienen, ten blijke van het voldoen aan de voorschriften van dit besluit, te zijn voorzien van de CE-
      markering en vergezeld te gaan van de EG-conformiteitsverklaring.
    url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#Artikel6
  - number: '6.2'
    text: 'De CE-markering en de EG-conformiteitsverklaring mogen uitsluitend worden aangebracht onderscheidenlijk bijgevoegd:'
    url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#Artikel6
  - number: 6.2.a
    text: |-
      indien het desbetreffende type blijkens een verklaring van EG-type-onderzoek overeenkomstig de in bijlage III van
      de richtlijn beschreven procedure is goedgekeurd,
    url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#Artikel6
  - number: 6.2.b
    text: |-
      zolang de vervaardiging van de desbetreffende ketels geschiedt met inachtneming van een van de drie in bijlage IV
      van de richtlijn beschreven procedures en
    url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#Artikel6
  - number: 6.2.c
    text: |-
      zolang wordt voldaan aan de verplichtingen die in het kader van de onder *a* en *b* bedoelde procedures rusten op
      de fabrikant, diens in de gebieden waarop de Overeenkomst betreffende de Europese Economische Ruimte van toepassing
      is gevestigde gemachtigde dan wel de persoon die met het in de handel brengen van de desbetreffende ketels in die
      gebieden is belast.
    url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#Artikel6
  - number: '6.3'
    text: |-
      Voor de beoordeling van het voldoen aan de voorschriften van dit besluit van ketels waarop het
      [Warenwetbesluit gastoestellen][ref1] (Stb. 1992, 124) van toepassing is, zijn in afwijking van het tweede lid,
      onder a en b, de in de bij dat besluit behorende [bijlage III][ref2], onder A en B, beschreven procedures van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005384
      [ref2]: https://wetten.overheid.nl/BWBR0005384
    url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005384
      - id: ref2
        bwb_id: BWBR0005384
  - number: '6.4'
    text: |-
      Onderdelen dienen te zijn voorzien van de CE-markering en vergezeld te gaan van de EG-conformiteitsverklaring,
      waarin de parameters worden aangegeven waarmee, na assemblage, de desbetreffende ketels kunnen voldoen aan de
      rendementseisen, bedoeld in [artikel 4, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005828#Artikel4
    url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005828
        artikel: '4'
  - number: '6.5'
    text: |-
      De CE-markering moet zichtbaar, gemakkelijk leesbaar en onuitwisbaar op de ketels en de onderdelen zijn aangebracht
      en, indien van toepassing, gevolgd worden door het in bijlage IV, module D, onder 1, en module E, onder 1, van de
      richtlijn bedoelde identificatienummer. Op ketels en onderdelen mogen slechts andere markeringen worden aangebracht
      indien daardoor de zichtbaarheid en leesbaarheid van de CE-markering niet worden verminderd.
    url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#Artikel6
  - number: '7.1'
    text: |-
      Ketels mogen slechts zijn voorzien van het in de onderstaande tabel aangegeven aantal merktekens als bedoeld in
      bijlage I, onder 2, van de richtlijn, indien:
    url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#Artikel7
  - number: 7.1.a
    text: |-
      met toepassing van de in [artikel 6, tweede lid, onder a][ref1], bedoelde procedure wordt vastgesteld dat het
      desbetreffende type ketel voldoet aan de in de tabel bij dat aantal merktekens weergegeven eisen inzake waterzijdig
      rendement:


      [ref1]: https://wetten.overheid.nl/BWBR0005828#Artikel6
    url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005828
        artikel: '6'
  - number: 7.1.a.1°
    text: bij werking op nominaal vermogen en
    url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#Artikel7
  - number: 7.1.a.2°
    text: |-
      bij werking in een deellast van 30 % en een gemiddelde bedrijfstemperatuur die gelijk is aan of hoger is dan 50
      °C en
    url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#Artikel7
  - number: 7.1.b
    text: |-
      zolang de in [artikel 6, tweede lid onder b][ref1], bedoelde procedure mede wordt toegepast ten aanzien van het
      voldoen aan de onder *a* bedoelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0005828#Artikel6
    url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005828
        artikel: '6'
  - number: '7.2'
    text: |-
      De [artikelen 4, tweede lid][ref1], en [6, derde lid][ref2], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005828#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005828#Artikel6
    url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005828
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005828
        artikel: '6'
  - number: '8.1'
    text: 'Onze Minister wijst de instellingen aan die bevoegd zijn:'
    url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#Artikel8
  - number: 8.1.a
    text: |-
      het in [artikel 6, tweede lid, onder a][ref1], bedoelde EG-type-onderzoek te verrichten;


      [ref1]: https://wetten.overheid.nl/BWBR0005828#Artikel6
    url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005828
        artikel: '6'
  - number: 8.1.b
    text: |-
      tot het verrichten van controles en beoordelingen zoals omschreven in de in [artikel 6, tweede lid, onder b][ref1],
      bedoelde procedures.


      [ref1]: https://wetten.overheid.nl/BWBR0005828#Artikel6
    url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005828
        artikel: '6'
  - number: '8.2'
    text: |-
      Voor een aanwijzing als bedoeld in het eerste lid komen in aanmerking instellingen die ten minste voldoen aan de
      in bijlage V van de richtlijn vastgestelde voorwaarden. Instellingen die voldoen aan de geharmoniseerde normen,
      bedoeld in artikel 8, tweede lid, van de richtlijn, worden geacht aan deze voorwaarden te voldoen.
    url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#Artikel8
  - number: '8.3'
    text: 'Onze Minister trekt een aanwijzing als bedoeld in het eerste lid in ieder geval in, indien de betrokken instelling:'
    url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#Artikel8
  - number: 8.3.a
    text: niet langer voldoet aan de in het tweede lid bedoelde voorwaarden;
    url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#Artikel8
  - number: 8.3.b
    text: |-
      niet voldoet aan de in het kader van de in [artikel 6, tweede lid][ref1], bedoelde procedures op haar rustende
      verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005828#Artikel6
    url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005828
        artikel: '6'
  - number: '8.4'
    text: |-
      Als instellingen als bedoeld in het eerste lid worden mede aangemerkt instellingen die in het kader van de
      richtlijn door andere lid-staten van de Europese Unie of een andere staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte bij de Europese Commissie zijn aangemeld en waarvan de namen door de
      Commissie zijn gepubliceerd in het *Publikatieblad van de Europese Gemeenschappen*.
    url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#Artikel8
  - number: '9'
    text: |-
      Voor zover in dit besluit wordt verwezen naar de richtlijn of naar een bijlage daarvan, treedt voor de toepassing
      van de desbetreffende bepaling een wijziging van de richtlijn of van een bijlage daarvan in werking met ingang van
      de dag, waarop aan die wijziging uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#Artikel9
  - number: '10.1'
    text: |-
      [Artikel 3, eerste lid, onderdelen a en b][ref1], is tot 1 januari 1998 niet van toepassing ten aanzien van ketels
      en onderdelen:


      [ref1]: https://wetten.overheid.nl/BWBR0005828#Artikel3
    url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005828
        artikel: '3'
  - number: 10.1.a
    text: |-
      die voldoen aan de op 21 mei 1992 in Nederland geldende voorschriften en aan de op die datum geldende keuringseisen
      voor centrale-verwarmingstoestellen, vastgesteld door de Koninklijke Vereniging van Gasfabrikanten in Nederland
      (KE 28);
    url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#Artikel10
  - number: 10.1.b
    text: |-
      die kennelijk bestemd zijn om in een andere lid-staten van de Europese Unie of een andere staat die partij is bij
      de Overeenkomst betreffende de Europese Economische Ruimte in de handel te worden gebracht en die voldoen aan de op
      21 mei 1992 in die Lid-Staat geldende voorschriften.
    url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#Artikel10
  - number: '10.2'
    text: |-
      Met betrekking tot ketels en onderdelen als bedoeld in het eerste lid, waarop
      [artikel 3, eerste lid, onderdelen a en b][ref1], van dit besluit niet wordt toegepast en waarop ingevolge
      een of meer andere wettelijke regelingen de CE-markering wordt aangebracht, worden op de bij die ketels en
      onderdelen gevoegde documenten, handleidingen of gebruiksaanwijzingen de in het *Publikatieblad van de Europese
      Gemeenschappen* bekendgemaakte referenties van de aan die wettelijke regelingen ten grondslag liggende richtlijnen
      vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005828#Artikel3
    url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005828
        artikel: '3'
  - number: '11'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin het wordt
      geplaatst, met uitzondering van [artikel 3][ref1] dat in werking treedt met ingang van 1 januari 1994.


      [ref1]: https://wetten.overheid.nl/BWBR0005828#Artikel3
    url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005828
        artikel: '3'
  - number: '12'
    text: 'Dit besluit wordt aangehaald als: Besluit rendementseisen cv-ketels.'
    url: https://wetten.overheid.nl/BWBR0005828/2017-01-01#Artikel12
