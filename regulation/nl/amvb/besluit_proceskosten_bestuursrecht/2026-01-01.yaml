    text: |-
      Een veroordeling in de kosten als bedoeld in [artikel 8:75][ref1] onderscheidenlijk een vergoeding van de kosten
      als bedoeld in [artikel 7:15, tweede lid][ref2], of [7:28, tweede lid, van de Algemene wet bestuursrecht][ref3] kan
      uitsluitend betrekking hebben op:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0006358/2026-01-01#Artikel1
