        artikel: '7'
  - number: 1.a
    text: kosten van door een derde beroepsmatig verleende rechtsbijstand,
    url: https://wetten.overheid.nl/BWBR0006358/2026-01-01#Artikel1
  - number: 1.b
    text: |-
      kosten van een getuige of deskundige die door een partij of een belanghebbende is meegebracht of opgeroepen, dan
      wel van een deskundige die aan een partij verslag heeft uitgebracht,
    url: https://wetten.overheid.nl/BWBR0006358/2026-01-01#Artikel1
  - number: 1.c
    text: kosten van een tolk die door een partij of een belanghebbende is meegebracht of opgeroepen,
    url: https://wetten.overheid.nl/BWBR0006358/2026-01-01#Artikel1
  - number: 1.d
    text: reis- en verblijfkosten van een partij of een belanghebbende,
    url: https://wetten.overheid.nl/BWBR0006358/2026-01-01#Artikel1
  - number: 1.e
    text: verletkosten van een partij of een belanghebbende,
    url: https://wetten.overheid.nl/BWBR0006358/2026-01-01#Artikel1
  - number: 1.f
    text: |-
      kosten van uittreksels uit de openbare registers, telegrammen, internationale telexen, internationale telefaxen en
      internationale telefoongesprekken, en
    url: https://wetten.overheid.nl/BWBR0006358/2026-01-01#Artikel1
  - number: 1.g
    text: |-
      kosten van het als gemachtigde optreden van een arts in zaken waarin enig wettelijk voorschrift verplicht tot
      tussenkomst van een gemachtigde die arts is.
    url: https://wetten.overheid.nl/BWBR0006358/2026-01-01#Artikel1
  - number: '2.1'
    text: |-
      Het bedrag van de kosten wordt bij de uitspraak, onderscheidenlijk de beslissing op het bezwaar of het
      administratief beroep als volgt vastgesteld:
    url: https://wetten.overheid.nl/BWBR0006358/2026-01-01#Artikel2
  - number: 2.1.a
    text: |-
      ten aanzien van de kosten, bedoeld in [artikel 1, onderdeel a][ref1]: overeenkomstig het in de bijlage opgenomen
      tarief;


      [ref1]: https://wetten.overheid.nl/BWBR0006358#Artikel1
    url: https://wetten.overheid.nl/BWBR0006358/2026-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006358
        artikel: '1'
  - number: 2.1.b
    text: |-
      ten aanzien van de kosten, bedoeld in [artikel 1, onderdeel b][ref1]: op de vergoeding die ingevolge
      [artikel 8:36, tweede lid, van de Algemene wet bestuursrecht][ref2] is verschuldigd; indien de kosten zijn gemaakt
      in bezwaar of administratief beroep wordt deze vergoeding vastgesteld met overeenkomstige toepassing van het
      bepaalde bij en krachtens de [Wet tarieven in strafzaken][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0006358#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002406
