  - number: '2.2'
    text: |-
      Indien een partij of een belanghebbende gedeeltelijk in het gelijk is gesteld, kan het op grond van het eerste
      lid vastgestelde bedrag worden verminderd. Het op grond van het eerste lid vastgestelde bedrag kan eveneens worden
      verminderd indien het beroep bij de bestuursrechter is ingetrokken omdat gedeeltelijk aan de indiener van het
      beroepschrift is tegemoetgekomen.
    url: https://wetten.overheid.nl/BWBR0006358/2026-01-01#Artikel2
  - number: '2.3'
    text: In bijzondere omstandigheden kan van het eerste lid worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0006358/2026-01-01#Artikel2
  - number: '3.1'
    text: |-
      Samenhangende zaken worden voor de toepassing van [artikel 2, eerste lid, onder a][ref1], beschouwd als één zaak.


      [ref1]: https://wetten.overheid.nl/BWBR0006358#Artikel2
    url: https://wetten.overheid.nl/BWBR0006358/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006358
        artikel: '2'
  - number: '3.2'
    text: |-
      Samenhangende zaken zijn: door een of meer belanghebbenden gemaakte bezwaren of ingestelde beroepen, die door het
      bestuursorgaan of de bestuursrechter gelijktijdig of nagenoeg gelijktijdig zijn behandeld, waarin rechtsbijstand
      als bedoeld in [artikel 1, onder a][ref1], is verleend door dezelfde persoon dan wel door een of meer personen die
      deel uitmaken van hetzelfde samenwerkingsverband en van wie de werkzaamheden in elk van de zaken nagenoeg identiek
      konden zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0006358#Artikel1
    url: https://wetten.overheid.nl/BWBR0006358/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006358
        artikel: '1'
