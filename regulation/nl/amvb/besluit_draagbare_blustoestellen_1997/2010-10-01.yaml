---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_draagbare_blustoestellen_1997
regulatory_layer: AMVB
publication_date: '2016-09-09'
valid_from: '2010-10-01'
bwb_id: BWBR0009334
url: https://wetten.overheid.nl/BWBR0009334/2010-10-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken, directoraat-generaal voor Openbare Orde en Veiligheid,
    directie Brandweer en Rampenbestrijding, van 1 september 1997, nr. EB97/1121;

    Gelet op artikel 17, eerste lid, van de Brandweerwet 1985;

    De Raad van State gehoord (advies van 27 oktober 1997, nr. W04.97.0579);

    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken, directoraat-generaal voor Openbare Orde en
    Veiligheid, directie Brandweer en Rampenbestrijding, van 12 januari 1998, nr. EB97/2134;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;'
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel1
  - number: 1.b
    text: 'bewijs: bewijs van typekeuring;'
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel1
  - number: 1.c
    text: 'houder: houder van een bewijs;'
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel1
  - number: 1.d
    text: |-
      draagbaar blustoestel: een tot het bestrijden van brand bestemd voorwerp dat door middel van eenvoudige handgrepen
      in werking wordt gesteld en gehouden, waarvan de inrichting zodanig is dat de bestrijding van brand geschiedt door
      middel van een zich in het blustoestel bevindende vulling en waarvan de massa gebruiksklaar niet meer bedraagt dan
      20 kg;
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel1
  - number: 1.e
    text: |-
      vulling: de voor een draagbaar blustoestel bestemde blusstof en de stof of de stoffen, bestemd tot uitdrijving van
      de blusstof uit het draagbare blustoestel;
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel1
  - number: 1.f
    text: |-
      onafhankelijk keuringsinstituut: een instituut tot wiens normale takenpakket het keuren van draagbare
      blustoestellen behoort en dat voldoet aan de criteria, genoemd in onderdeel 1 van bijlage IV van de [richtlijn
      nr. 97/23/EG](31997L0023) van de Raad van de Europese Unie van 29 mei 1997 inzake de onderlinge aanpassing van de
      wetgevingen der lidstaten betreffende drukapparatuur (PbEG L 181);
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel1
  - number: 1.g
    text: |-
      NEN-EN 3-7+ A1: Draagbare blustoestellen, Deel 7, Eigenschappen, prestatie-eisen en beproevingsmethoden, uitgegeven
      door het Nederlands Normalisatie-Instituut zoals dit luidde in augustus 2007;
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel1
  - number: 1.h
    text: |-
      NPR-CEN/TR 14922: Draagbare blustoestellen – Model laboratorium – Rapport in overeenkomst met NEN-EN 3-7+A1,
      uitgegeven door het Nederlands Normalisatie-instituut, zoals dit luidde in januari 2006;
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel1
  - number: 1.i
    text: |-
      NEN 2033: Draagbare blustoestellen voor brandklasse D, uitgegeven door het Nederlands Normalisatie-Instituut, zoals
      dit luidde in januari 2006.
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel1
  - number: '2'
    text: |-
      Het is verboden draagbare blustoestellen met bijbehorende vullingen die niet behoren tot een type, waarvoor
      Onze Minister een bewijs heeft verleend, met het oog op gebruik in Nederland te vervaardigen, in te voeren of te
      verhandelen.
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel2
  - number: 2a
    text: |-
      Het verbod, bedoeld in [artikel 2][ref1], geldt niet voor draagbare blustoestellen voor zover deze bestemd zijn
      voor plaatsing aan boord van schepen waarop [richtlijn nr. 96/98/EG](31996L0098) van de Raad van de Europese Unie
      van 20 december 1996 inzake uitrusting van zeeschepen (PbEG 1997, L 46) van toepassing is en zijn voorzien van het
      merk van overeenstemming, weergegeven in bijlage D van die richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009334#Artikel2
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0009334
        artikel: '2'
        paragraaf: '2'
  - number: '3'
    text: |-
      Voor elk type draagbaar blustoestel met bijbehorende vulling is een afzonderlijk bewijs vereist. Het type wordt
      bepaald door de soort vulling en de wijze, waarop het draagbare blustoestel in werking wordt gesteld en gehouden.
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel3
  - number: '4.1'
    text: |-
      In afwijking van [artikel 2][ref1] is het toegestaan met een machtiging van Onze Minister draagbare blustoestellen
      met bijbehorende vullingen in te voeren, indien de draagbare blustoestellen uitsluitend:


      [ref1]: https://wetten.overheid.nl/BWBR0009334#Artikel2
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009334
        artikel: '2'
        paragraaf: '2'
  - number: 4.1.a
    text: zijn bestemd voor experimentele doeleinden,
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel4
  - number: 4.1.b
    text: zijn bestemd voor exposities,
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel4
  - number: 4.1.c
    text: zijn bestemd voor gebruik als monster bij een ingevolge dit besluit te verrichten keuring, of
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel4
  - number: 4.1.d
    text: |-
      tijdelijk in Nederland verblijven zonder dat het oogmerk aanwezig is deze met het oog op gebruik in Nederland te
      verhandelen.
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel4
  - number: '4.2'
    text: 'Bij de aanvraag voor een machtiging worden overgelegd:'
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel4
  - number: 4.2.a
    text: een aanduiding van het type draagbare blustoestel met bijbehorende vulling;
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel4
  - number: 4.2.b
    text: het adres van de fabrikant van het draagbare blustoestel en van de fabrikant van de vulling;
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel4
  - number: 4.2.c
    text: een vermelding van de reden van invoer.
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel4
  - number: '4.3'
    text: Onze Minister beslist binnen twee weken na de ontvangst van de aanvraag over de afgifte van een machtiging.
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel4
  - number: '5'
    text: |-
      De invoer van draagbare blustoestellen met bijbehorende vullingen kan geschieden langs alle plaatsen waar de
      aangifte tot plaatsing onder de douaneregeling in het vrije verkeer brengen, bedoeld in artikel 4, zestiende lid,
      onder a, van de [verordening (EEG) nr. 2913/92](31992R2913) van de Raad van de Europese Gemeenschappen van 12
      oktober 1992 tot vaststelling van het Communautair douanewetboek (PbEG L 302), mag worden gedaan.
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel5
  - number: '6.1'
    text: 'Bij de aanvraag voor een bewijs worden de volgende bescheiden overgelegd:'
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel6
  - number: 6.1.a
    text: |-
      een gewaarmerkt afschrift van de inschrijving van de indiener van de aanvraag in het handelsregister van de kamer
      van koophandel en fabrieken in Nederland dan wel in het handelsregister of in een daarmee vergelijkbaar register
      van zijn land van herkomst, dat niet ouder is dan drie maanden voor dagtekening van de aanvraag;
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel6
  - number: 6.1.b
    text: een technische beschrijving van het draagbare blustoestel;
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel6
  - number: 6.1.c
    text: |-
      een door een onafhankelijk keuringsinstituut gewaarmerkte constructietekening van het draagbare blustoestel en de
      onderdelen daarvan die niet groter is dan A3-formaat;
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel6
  - number: 6.1.d
    text: een fabriekscertificaat van de vulling;
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel6
  - number: 6.1.e
    text: |-
      een ontwerp-etiket of een ontwerp-transfer dat ingericht is overeenkomstig en de gegevens bevat, genoemd in de NEN-
      EN 3-7+A1, dan wel ingericht is op gelijkwaardige wijze en gegevens van gelijke aard bevat;
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel6
  - number: 6.1.f
    text: 'een rapport van een onafhankelijk keuringsinstituut:'
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel6
  - number: 6.1.f.1°
    text: |-
      dat totstandgekomen is overeenkomstig de procedure zoals omschreven is in de NPR-CEN/TR 14922 dan wel een daaraan
      gelijkwaardige procedure;
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel6
  - number: 6.1.f.2°
    text: |-
      dat opgesteld is overeenkomstig het model zoals opgenomen is in de NPR-CEN/TR 14922 dan wel een model van gelijke
      aard;
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel6
  - number: 6.1.f.3°
    text: |-
      waaruit blijkt dat het draagbare blustoestel voldoet aan de eisen inzake veiligheid en deugdelijkheid, genoemd in
      de NEN-EN 3-7+A1, dan wel een mate van veiligheid en deugdelijkheid biedt die ten minste gelijk is aan de mate van
      veiligheid en deugdelijkheid die beoogd is met de NEN-EN 3-7+A1, en
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel6
  - number: 6.1.f.4°
    text: |-
      waaruit blijkt dat het draagbare blustoestel voor brandklasse D tevens voldoen aan de eisen in de NEN 2033 dan wel
      aan eisen die ten minste gelijkwaardig zijn aan de eisen van de NEN 2033.
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel6
  - number: '6.2'
    text: |-
      Een draagbaar blustoestel biedt in ieder geval een mate van veiligheid en deugdelijkheid die ten minste gelijk is
      aan de mate van veiligheid en deugdelijkheid die beoogd is met de NEN-EN 3-7+A1 zoals bedoeld in het eerste lid,
      onderdeel f, onder 3°, indien het draagbare blustoestel:
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel6
  - number: 6.2.a
    text: |-
      voldoet aan de eisen van de NEN-EN 3.7+A1 met uitzondering van de technische eisen 4.5, 6.1 en 6.3 van de NEN-EN 3-
      7+A1, of
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel6
  - number: 6.2.b
    text: |-
      een kleinere vulling heeft dan in eis 6.4.2 of eis 6.4.3 van de NEN-EN 3-7+A1, maar wel aan de minimum eis van 5A
      of 21B en de overige eisen van de NEN-EN 3-7+A1voldoet, of
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel6
  - number: 6.2.c
    text: |-
      een vulling heeft die ligt tussen de in eis 6.4.2 of eis 6.4.3 van de NEN-EN 3-7+A1 genoemde waarden en voldoet
      aan de overige eisen van de NEN-EN 3-7+A1. Voor dit blustoestel geldt in dat geval de waarde van de naastliggende
      kleinere vulhoeveelheid.
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel6
  - number: '6.3'
    text: |-
      Een aerosol blustoestel dat voldoet aan richtlijn nr. 75/324/EEG van de Raad van de Europese Gemeenschappen van
      20 mei 1975 betreffende de onderlinge aanpassing van de wetgevingen van de lidstaten inzake aërosols (PbEG L 147)
      biedt in ieder geval een mate van veiligheid en deugdelijkheid die ten minste gelijk is aan de mate van veiligheid
      en deugdelijkheid die beoogd is met de NEN-EN 3-7+A1 zoals bedoeld in het eerste lid, onderdeel f, onder 3°, indien
      het aerosol blustoestel:
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel6
  - number: 6.3.a
    text: voldoet aan de eisen van de NEN-EN 3-7+A1, met uitzondering van de eisen 4.6, 8 en 14 van de NEN-EN 3-7+A1, of
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel6
  - number: 6.3.b
    text: |-
      een kleinere vulling heeft dan in eis 6.4.2 of eis 6.4.3 van de NEN-EN 3-7+A1, maar wel aan de minimum eis van 5A
      of 21B en de overige eisen van de NEN-EN 3-7+A1 voldoet.
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel6
  - number: '6.4'
    text: De bescheiden, bedoeld in het eerste lid, onder b tot en met f, worden in tweevoud overgelegd.
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel6
  - number: '6.5'
    text: |-
      Bij de aanvraag wordt aan het Rijk een bedrag van € 828,00 betaald. Dit bedrag wordt jaarlijks op 1 maart
      geïndexeerd conform de door het Centraal bureau voor de statistiek bekendgemaakte afgeleide consumentenprijsindex
      van het voorgaande jaar.
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel6
  - number: '7.1'
    text: Onze Minister beslist binnen acht weken na de ontvangst van de aanvraag over de afgifte van een bewijs.
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel7
  - number: '7.2'
    text: Onze Minister kan de termijn, bedoeld in het eerste lid, eenmaal met ten hoogste acht weken verlengen.
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel7
  - number: '7.3'
    text: Onze Minister doet van de afgifte van een bewijs mededeling in de Nederlandse Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel7
  - number: '8.1'
    text: Onze Minister verleent het bewijs voor vijf jaar.
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel8
  - number: '8.2'
    text: 'Het bewijs omvat:'
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel8
  - number: 8.2.a
    text: |-
      een etiket of een transfer dat voorzien is van het rijkskeurmerk, bedoeld in de bij dit besluit behorende bijlage,
      en bestemd is om te worden aangebracht op het draagbare blustoestel;
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel8
  - number: 8.2.b
    text: |-
      een door Onze Minister gewaarmerkt exemplaar van de technische beschrijving en de constructietekening van het
      draagbare blustoestel en de onderdelen daarvan en van het fabriekscertificaat van de vulling.
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel8
  - number: '8.3'
    text: |-
      De houder bewaart de bescheiden, bedoeld in het tweede lid, in ongeschonden staat. Hij is gehouden deze op eerste
      aanwijzing van Onze Minister te tonen.
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel8
  - number: '9.1'
    text: Op aanvraag van de houder wijzigt Onze Minister een bewijs.
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel9
  - number: '9.2'
    text: |-
      [De artikelen 6, eerste lid, onder b tot en met f, vierde en vijfde lid][ref1], [7, eerste lid][ref2], en
      [8, derde lid][ref3], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009334#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0009334#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0009334#Artikel8
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009334
        artikel: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009334
        artikel: '7'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0009334
        artikel: '8'
        paragraaf: '2'
  - number: '9.3'
    text: |-
      Het bewijs, bedoeld in het eerste lid, omvat een door Onze Minister gewaarmerkt exemplaar van de bij de
      wijzigingsaanvraag overgelegde technische beschrijving en constructietekening van het gewijzigde onderdeel of de
      gewijzigde onderdelen van het draagbare blustoestel.
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel9
  - number: '9.4'
    text: Onze Minister doet van de wijziging van een bewijs mededeling in de Nederlandse Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel9
  - number: '10.1'
    text: |-
      Op aanvraag van de houder schrijft Onze Minister een bewijs over op naam van een derde, die schriftelijk de wens te
      kennen heeft gegeven houder te willen worden.
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel10
  - number: '10.2'
    text: Onze Minister schrijft het bewijs binnen acht weken over.
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel10
  - number: '10.3'
    text: Onze Minister doet van de overschrijving mededeling in de Nederlandse Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel10
  - number: '11'
    text: |-
      De wijziging, bedoeld in [artikel 9][ref1], en de overschrijving, bedoeld in [artikel 10][ref2], brengen geen
      verandering in de termijn waarvoor het bewijs is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0009334#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0009334#Artikel10
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009334
        artikel: '9'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009334
        artikel: '10'
        paragraaf: '2'
  - number: '12.1'
    text: 'Onze Minister kan het bewijs van de houder intrekken, indien:'
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel12
  - number: 12.1.a
    text: |-
      de houder niet overeenkomstig het bewijs draagbare blustoestellen met bijbehorende vullingen met het oog op gebruik
      in Nederland vervaardigt, invoert of verhandelt;
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel12
  - number: 12.1.b
    text: |-
      de houder niet voldoet aan [artikel 8, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009334#Artikel8
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009334
        artikel: '8'
        paragraaf: '2'
  - number: '12.2'
    text: Onze Minister doet van de intrekking mededeling in de Nederlandse Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel12
  - number: '13'
    text: |-
      Als strafbare feiten, bedoeld in [artikel 64, derde lid, van de Wet veiligheidsregio’s][ref1], worden aangemerkt:


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel64
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '64'
  - number: 13.a
    text: |-
      het zonder bewijs met het oog op gebruik in Nederland vervaardigen, invoeren of verhandelen van draagbare
      blustoestellen met bijbehorende vullingen;
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel13
  - number: 13.b
    text: |-
      het zonder machtiging als bedoeld in [artikel 4, eerste lid][ref1], invoeren van draagbare blustoestellen met
      bijbehorende vullingen;


      [ref1]: https://wetten.overheid.nl/BWBR0009334#Artikel4
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009334
        artikel: '4'
        paragraaf: '2'
  - number: 13.c
    text: |-
      het met het oog op gebruik in Nederland vervaardigen, invoeren of verhandelen van draagbare
      blustoestellen met bijbehorende vullingen die niet zijn voorzien van de opschriften, bedoeld in
      [artikel 8, tweede lid, onder a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009334#Artikel8
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel13
    references:
      - id: ref1
