  - number: '14'
    text: |-
      De bewijzen die zijn afgegeven vóór de datum van inwerkingtreding van dit besluit blijven geldig gedurende de
      termijn waarvoor zij zijn verleend.
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel14
  - number: '15'
    text: Het Besluit draagbare blustoestellen wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009334/2010-10-01#Artikel15
  - number: 15a
    text: |-
      Dit besluit berust op [artikel 30, eerste lid, van de Wet veiligheidsregio’s][ref1].


