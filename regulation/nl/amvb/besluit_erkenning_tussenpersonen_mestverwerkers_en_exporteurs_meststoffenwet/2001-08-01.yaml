        paragraaf: '2'
  - number: '30.1'
    text: |-
      Onze Minister kan voor het jaar 2002 een voorlopige erkenning verlenen aan een tussenpersoon, een mestverwerker,
      een exporteur of een producent.
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel30
  - number: '30.2'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de voorwaarden waaronder een voorlopige
      erkenning wordt verleend.
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel30
  - number: '31'
    text: 'Dit besluit wordt aangehaald als: Besluit erkenning tussenpersonen, mestverwerkers en exporteurs Meststoffenwet.'
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel31
  - number: '32'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel32
