---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_erkenning_tussenpersonen_mestverwerkers_en_exporteurs_meststoffenwet
regulatory_layer: AMVB
publication_date: '2004-09-28'
valid_from: '2001-08-01'
bwb_id: BWBR0012713
url: https://wetten.overheid.nl/BWBR0012713/2001-08-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Landbouw, Natuurbeheer en Visserij van 23 maart 2001, no. TRCJZ/2001/3681,
    Directie Juridische Zaken, gedaan in overeenstemming met Onze Minister van Volkshuisvesting Ruimtelijke Ordening
    en Milieubeheer;

    Gelet op artikel 7, eerste lid, van de Meststoffenwet, voor zover het betreft artikel 21, tweede en derde lid,
    gelet op artikel 58ae, tweede lid, van de Meststoffenwet, voor zover het betreft de artikelen 1, 25 en 26, gelet
    op artikel 58ae, derde lid, van de Meststoffenwet voor zover het betreft de artikelen 1 tot en met 4, 6 tot en met
    10, 12 tot en met 15, 24, 27 tot en met 30, gelet op artikel 58ae, vierde lid, van de Meststoffenwet voor zover het
    betreft de artikelen 1, 3, 4, 16 tot en met 23, 27 en 28, gelet op artikel 58ae, vijfde lid, van de Meststoffenwet
    voor zover het betreft de artikelen 1, 3, 4, 15, 24, 27 en 28, gelet op artikel 58aka, derde lid, voor zover het
    betreft de artikelen 1 tot en met 5, 9 tot en met 11, 15 tot en met 17, 20 tot en met 24, 27, 28 en 30, en gelet op
    artikel 61, eerste lid, van de Meststoffenwet voor zover het betreft artikel 1, tweede lid;

    De Raad van State gehoord (advies van 21 juni 2001, no. W11.01.0169/V);

    Gezien het nader rapport van Onze Minister van Landbouw, Natuurbeheer en Visserij van 17 juli 2001, No.
    TRCJZ/2001/10201, Directie Juridische Zaken, uitgebracht mede in overeenstemming met Onze Minister van
    Volkshuisvesting Ruimtelijke Ordening en Milieubeheer;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop rustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel1
  - number: 1.1.a
    text: |-
      wet: [Meststoffenwet][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: 1.1.b
    text: |-
      afzet buiten Nederland: feitelijke aflevering buiten het Nederlands grondgebied, met uitzondering van aflevering
      naar in de grensgebieden gelegen landbouwgrond die tot het bedrijf van een producent behoort ingevolge de krachtens
      [artikel 1a, tweede lid, onderdeel a, van de wet][ref1] gestelde regels, waarbij de dierlijke meststoffen na
      aflevering niet wederom op het Nederlands grondgebied worden gebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel1a
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 1a
  - number: 1.1.c
    text: |-
      samengestelde meststoffen: samengestelde meststoffen die fosfor en stikstof dan wel ten minste één van deze
      elementen en kalium bevatten en die voldoen aan de eisen gesteld in [richtlijn nr. 76/116/EEG](31976L0116) van de
      Raad van de Europese Unie van 18 december 1975 betreffende de onderlinge aanpassing van wetgevingen van de Lid-
      Staten inzake meststoffen (PbEG 1976, L 24);
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel1
  - number: 1.1.d
    text: |-
      onomkeerbaar verwerken: onomkeerbaar verwerken tot producten die niet als dierlijke meststoffen of overige
      organische meststoffen kunnen worden aangemerkt of die kunnen worden aangemerkt als samengestelde meststoffen;
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel1
  - number: 1.1.e
    text: |-
      richtlijn: [richtlijn 92/118/EEG](31992L0118) van de Raad van 17 december 1992 tot vaststelling van de
      veterinairrechtelijke en de gezondheidsvoorschriften voor het handelsverkeer en de invoer in de Gemeenschap van
      producten waarvoor ten aanzien van deze voorschriften geen specifieke communautaire regelgeving gelden als bedoeld
      in Bijlage A, hoofdstuk I, van [Richtlijn 89/662/EEG](31989L0662), en, wat ziekteverwekkers betreft, van [Richtlijn
      90/425/EEG](31990L0425);
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel1
  - number: 1.1.f
    text: |-
      satellietvolgapparatuur: apparatuur die periodiek de positie bepaalt van een transportmiddel en voor de overdracht
      van gegevens betreffende de positie van het transportmiddel gebruik maakt van communicatie via een satelliet
      waarbij die gegevens automatisch worden vastgelegd;
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel1
  - number: 1.1.g
    text: |-
      uittreksel: uittreksel van de inschrijving van de onderneming in het handelsregister, bedoeld in
      [artikel 2 van de Handelsregisterwet 1996][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007893#Artikel2
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007893
        artikel: '2'
  - number: 1.1.h
    text: |-
      buitenlandse tussenpersoon: tussenpersoon die is gevestigd in een andere lidstaat van de Europese Unie of in een
      staat die partij is bij de Overeenkomst inzake de Europese Economische Ruimte;
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel1
  - number: 1.1.i
    text: |-
      buitenlandse mestverwerker: mestverwerker die is gevestigd in een andere lidstaat van de Europese Unie of in een
      staat die partij is bij de Overeenkomst inzake de Europese Economische Ruimte;
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel1
  - number: 1.1.j
    text: |-
      buitenlandse exporteur: exporteur die is gevestigd in een andere lidstaat van de Europese Unie of in een staat die
      partij is bij de Overeenkomst inzake de Europese Economische Ruimte;
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel1
  - number: 1.1.k
    text: |-
      verordening: [Verordening (EEG) nr. 259/93](31993R0259) van de Raad van 1 februari 1993 betreffende toezicht en
      controle op de overbrenging van afvalstoffen binnen, naar en uit de Europese Gemeenschap (PBEG L 30).
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel1
  - number: '1.2'
    text: |-
      Voor de toepassing van [artikel 58ae][ref1] en dit besluit wordt onder «het rechtstreeks afzetten van dierlijke
      meststoffen buiten Nederland» mede verstaan: de afzet van dierlijke meststoffen buiten Nederland door een
      daartoe door de mestverwerker, exporteur of producent gemachtigde transporteur waarbij de mestverwerker,
      exporteur of producent het vervoer van de dierlijke meststoffen heeft verzekerd door middel van een of meer
      vervoersovereenkomsten met de transporteur.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58ae
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58ae
  - number: '1.3'
    text: |-
      Voor de toepassing van dit besluit wordt de hoeveelheid stikstof en de hoeveelheid fosfaat in een hoeveelheid
      dierlijke meststoffen die is uitgedrukt in kilogrammen, bepaald op basis van het gewicht en op basis van de
      forfaitaire normen zoals opgenomen in de bijlage bij dit besluit.
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel1
  - number: '2'
    text: |-
      Onze Minister kan, als naar zijn oordeel is voldaan aan de voorwaarden gesteld in dit hoofdstuk en in
      [hoofdstuk 3][ref1], een erkenning verlenen aan:


      [ref1]: https://wetten.overheid.nl/BWBR0012713#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0012713
        hoofdstuk: '3'
  - number: 2.a
    text: |-
      een tussenpersoon, voor de toepassing van de [artikelen 58ac, onderdeel a, onder 3°][ref1],
      [58ad, onderdeel a, onder 3°][ref2], [58ah, onderdeel a, onder 3°][ref3], en
      [58ai, onderdeel a, onder 3, van de wet][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58ac
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel58ad
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel58ah
      [ref4]: https://wetten.overheid.nl/BWBR0004054#Artikel58ai
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58ac
      - id: ref2
        bwb_id: BWBR0004054
        artikel: 58ad
      - id: ref3
        bwb_id: BWBR0004054
        artikel: 58ah
      - id: ref4
        bwb_id: BWBR0004054
        artikel: 58ai
  - number: 2.b
    text: |-
      een mestverwerker, exporteur of producent voor de toepassing van [artikel 58ae van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58ae
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58ae
  - number: '3'
    text: |-
      Bij de verlening van een erkenning aan een tussenpersoon en bij de verlening van een erkenning aan
      een mestverwerker of aan een exporteur van onbewerkte, ingedikte of gedroogde pluimveemest wordt de
      hoeveelheid dierlijke meststoffen, bedoeld in [artikel 58aka, eerste lid][ref1], onderscheidenlijk
      [artikel 58al van de wet][ref2], vastgesteld tot de aanvoer waarvan de tussenpersoon, de mestverwerker of de
      exporteur zich na verlening van de erkenning bij mestafzetovereenkomst ten hoogste mag verplichten.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58aka
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel58al
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58aka
      - id: ref2
        bwb_id: BWBR0004054
        artikel: 58al
  - number: '4'
    text: |-
      Bij de verlening van een erkenning aan een erkende producent wordt de hoeveelheid dierlijke meststoffen vastgesteld
      waarop [artikel 58ae, eerste lid, onderdeel c, van de wet ][ref1] in een kalenderjaar ten hoogste van toepassing
      is.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58ae
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58ae
  - number: '5'
    text: 'De voorwaarden voor de erkenning van een tussenpersoon zijn:'
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel5
  - number: 5.a
    text: |-
      de tussenpersoon heeft vóór de aanvraag om erkenning een of meer mestafzetovereenkomsten gesloten op grond waarvan
      de hoeveelheid dierlijke meststoffen waarvoor de erkenning wordt aangevraagd in het desbetreffende jaar kan worden
      afgevoerd naar een bedrijf, een erkende mestverwerker of een erkende exporteur;
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel5
  - number: 5.b
    text: |-
      de onderneming van de tussenpersoon is financieel gezond zoals blijkt uit de winst- en verliesrekening van de
      onderneming of gegevens over de solvabiliteit en liquiditeit van de onderneming, en
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel5
  - number: 5.c
    text: |-
      de tussenpersoon heeft in een zekerheid als bedoeld in [artikel 9][ref1] van voldoende omvang voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0012713#Artikel9
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012713
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: '6.1'
    text: 'De voorwaarden voor de erkenning van een mestverwerker zijn:'
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel6
  - number: 6.1.a
    text: |-
      de mestverwerker past een methode van bewerking of verwerking toe leidend tot een product waarvoor zowel voor
      de hoeveelheid stikstof als voor de hoeveelheid fosfaat in dat product reële mogelijkheden voor de afzet buiten
      Nederland bestaan of past een methode van onomkeerbare verwerking toe leidend tot een product waarvoor zowel voor
      de hoeveelheid stikstof als voor de hoeveelheid fosfaat in dat product reële mogelijkheden bestaan voor de afzet
      binnen of buiten Nederland;
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel6
  - number: 6.1.b
    text: |-
      de bewerkings- of verwerkingsinstallatie van de mestverwerker heeft de capaciteit om de hoeveelheid dierlijke
      meststoffen waarvoor een erkenning wordt aangevraagd te bewerken of verwerken;
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel6
  - number: 6.1.c
    text: |-
      de bewerkings- of verwerkingsinstallatie is geregistreerd overeenkomstig artikel 4, tweede lid, onderdeel c, van de
      richtlijn door Onze Minister;
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel6
  - number: 6.1.d
    text: ten aanzien van de bewerkings- of verwerkingsinstallatie is een milieuvergunning afgegeven;
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel6
  - number: 6.1.e
    text: |-
      de onderneming van de mestverwerker is financieel gezond zoals blijkt uit de winst- en verliesrekening van de
      onderneming of uit gegevens over de solvabiliteit en liquiditeit van de onderneming;
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel6
  - number: 6.1.f
    text: |-
      de mestverwerker heeft inzicht verschaft in de wijze waarop hij voornemens is de bewerkte of verwerkte dierlijke
      meststoffen buiten Nederland af te zetten dan wel te doen afzetten, en
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel6
  - number: 6.1.g
    text: |-
      de mestverwerker heeft in een zekerheid als bedoeld in [artikel 9][ref1] van voldoende omvang voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0012713#Artikel9
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0012713
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: '6.2'
    text: |-
      De onderdelen c en f van het eerste lid zijn niet van toepassing indien de dierlijke meststoffen waarvoor een
      erkenning wordt aangevraagd onomkeerbaar worden verwerkt.
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel6
  - number: '6.3'
    text: |-
      In afwijking van het eerste lid, aanhef en onderdelen c en d, geldt ten aanzien van een buitenlandse mestverwerker
      de voorwaarde dat het hem ingevolge de in het land van vestiging geldende wettelijke regelingen is toegestaan de
      bewerking- of verwerkingsinstallatie in bedrijf te hebben.
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel6
  - number: '6.4'
    text: |-
      De mestverwerker heeft uiterlijk op het moment van de indiening van de aanvraag voor ten minste de helft van de
      hoeveelheid dierlijke meststoffen waarvoor een erkenning wordt aangevraagd, daarbij buiten beschouwing gelaten de
      hoeveelheid dierlijke meststoffen die onomkeerbaar wordt verwerkt, een of meer overeenkomsten betreffende de afname
      van die hoeveelheid afgesloten met afnemers gevestigd buiten Nederland. Voorzover de dierlijke meststoffen na
      bewerking of verwerking buiten Nederland worden afgezet door een erkende exporteur, kunnen deze overeenkomsten door
      de exporteur zijn afgesloten.
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel6
  - number: '7.1'
    text: 'De voorwaarden voor de erkenning van een exporteur zijn:'
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel7
  - number: 7.1.a
    text: |-
      indien de exporteur voornemens is een hoeveelheid dierlijke meststoffen in de vorm van onbewerkte, ingedikte of
      gedroogde pluimveemest buiten Nederland af te zetten, beschikt hij over reële mogelijkheden voor de afzet buiten
      Nederland van zowel de hoeveelheid stikstof als de hoeveelheid fosfaat in de dierlijke meststoffen waarvoor hij een
      erkenning aanvraagt;
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel7
  - number: 7.1.b
    text: |-
      de onderneming van de exporteur is financieel gezond zoals blijkt uit de winst- en verliesrekening van de
      onderneming of gegevens over de solvabiliteit en liquiditeit van de onderneming;
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel7
  - number: 7.1.c
    text: |-
      de exporteur heeft inzicht verschaft in de wijze waarop hij voornemens is de dierlijke meststoffen buiten Nederland
      af te zetten dan wel te doen afzetten, en
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel7
  - number: 7.1.d
    text: |-
      de exporteur heeft in een zekerheid als bedoeld in [artikel 9][ref1] van voldoende omvang voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0012713#Artikel9
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0012713
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: '7.2'
    text: |-
      De exporteur van dierlijke meststoffen in de vorm van onbewerkte, ingedikte of gedroogde pluimveemest heeft
      uiterlijk op het moment van de indiening van de aanvraag voor ten minste de helft van de hoeveelheid dierlijke
      meststoffen waarvoor een erkenning wordt aangevraagd een of meer overeenkomsten betreffende de afname van die
      hoeveelheid afgesloten met afnemers gevestigd buiten Nederland.
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel7
  - number: '8.1'
    text: |-
      De voorwaarden voor de erkenning van een producent zijn de voorwaarden genoemd in
      [artikel 6, eerste lid, met uitzondering van de onderdelen d en g van dat lid][ref1], en het tweede tot en met
      vierde lid, met dien verstande dat voor «mestverwerker» telkens wordt gelezen «producent».


      [ref1]: https://wetten.overheid.nl/BWBR0012713#Artikel6
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0012713
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '8.2'
    text: |-
      Tevens geldt als voorwaarde dat ten aanzien van het bedrijf van de producent een milieuvergunning is afgegeven die
      mede betrekking heeft op de bewerkings- of verwerkingsinstallatie van de producent.
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel8
  - number: '9.1'
    text: |-
      De tussenpersoon, onderscheidenlijk mestverwerker of exporteur voorziet in een zekerheid die hij
      ingeval hij na de erkenningverlening niet in staat is om de onderscheiden verplichtingen, bedoeld in de
      [artikelen 16, eerste lid][ref1], in samenhang met [artikel 5, onderdeel a][ref2], [17, eerste lid][ref3],
      [18][ref4] en [19, eerste en tweede lid][ref5], na te komen, aanspreekt teneinde alsnog aan de verplichtingen te
      voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0012713#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0012713#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0012713#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0012713#Artikel18
      [ref5]: https://wetten.overheid.nl/BWBR0012713#Artikel19
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0012713
        artikel: '16'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0012713
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0012713
        artikel: '17'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0012713
        artikel: '18'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0012713
        artikel: '19'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '9.2'
    text: |-
      De zekerheid, bedoeld in het eerste lid, wordt geboden door aansluiting bij een waarborgfonds of door een van de
      volgende, gelijkwaardige vormen van zekerheid:
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel9
  - number: 9.2.a
    text: een waarborgsom;
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel9
  - number: 9.2.b
    text: |-
      een borgtocht in de zin van [titel 14 van boek 7 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005290
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005290
  - number: 9.2.c
    text: een verzekeringsovereenkomst;
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel9
  - number: 9.2.d
    text: |-
      een of meerdere met andere ondernemingen gesloten overeenkomsten op grond waarvan dierlijke meststoffen
      onomkeerbaar op die ondernemingen kunnen worden verwerkt;
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel9
  - number: 9.2.e
    text: |-
      een of meerdere met bedrijven gesloten mestafzetovereenkomsten op grond waarvan dierlijke meststoffen naar die
      bedrijven kunnen worden afgevoerd, of
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel9
  - number: 9.2.f
    text: een combinatie van de in de onderdelen a tot en met e genoemde vormen van zekerheid.
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel9
  - number: '9.3'
    text: |-
      Overeenkomsten als bedoeld in onderdeel d van het tweede lid worden slechts als zekerheid in aanmerking genomen
      indien de verwerkingscapaciteit van de andere ondernemingen toereikend is voor de verwerking van de hoeveelheid
      dierlijke meststoffen die zij verplicht zijn aan te voeren op grond van mestafzetovereenkomsten en van de
      hoeveelheid dierlijke meststoffen die zij verplicht zijn aan te voeren op grond van de overeenkomsten als bedoeld
      in onderdeel d van het tweede lid.
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel9
  - number: '9.4'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld over de gevallen waarin de zekerheid wordt aangesproken,
      over de vereiste omvang van de zekerheid en de andere voorwaarden waaraan deze moet voldoen.
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel9
  - number: '10'
    text: |-
      Een aanvraag om een erkenning wordt ingediend bij het Bureau Heffingen met gebruikmaking van een door de minister
      voorgeschreven aanvraagformulier.
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel10
  - number: '11.1'
    text: |-
      Een tussenpersoon legt bij de aanvraag over de mestafzetovereenkomsten, bedoeld in [artikel 5, onderdeel a][ref1],
      een uittreksel, alsmede gegevens met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0012713#Artikel5
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0012713
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 11.1.a
    text: |-
      de winst- en verliesrekening en indien deze negatief is gegevens over de solvabiliteit en liquiditeit van de
      onderneming, en
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel11
  - number: 11.1.b
    text: |-
      de zekerheid, bedoeld in [artikel 9][ref1], waarin door de tussenpersoon is voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0012713#Artikel9
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0012713
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: '11.2'
    text: In afwijking van het eerste lid behoeft een buitenlandse tussenpersoon het uittreksel niet over te leggen.
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel11
  - number: '12.1'
    text: |-
      Een mestverwerker legt bij de aanvraag over een bewijsstuk betreffende de registratie, bedoeld
      in [artikel 6, eerste lid, onderdeel c][ref1], een afschrift van de milieuvergunning, bedoeld
      in [artikel 6, eerste lid, onderdeel d][ref2], een afschrift van de overeenkomsten, bedoeld in
      [artikel 6, vierde lid][ref3], een uittreksel, alsmede gegevens met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0012713#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0012713#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0012713#Artikel6
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0012713
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0012713
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0012713
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 12.1.a
    text: de bedrijfsmiddelen waarover de mestverwerker de beschikking heeft;
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel12
  - number: 12.1.b
    text: de capaciteit van de bewerkings- of verwerkingsinstallatie;
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel12
  - number: 12.1.c
    text: de wijze waarop de dierlijke meststoffen worden bewerkt of verwerkt;
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel12
  - number: 12.1.d
    text: |-
      de hoeveelheid en de aard van de dierlijke meststoffen waarop [artikel 58ae van de wet][ref1] van toepassing is die
      hij voornemens is te bewerken of verwerken;


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58ae
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58ae
  - number: 12.1.e
    text: |-
      de afzetmogelijkheden voor de hoeveelheid dierlijke meststoffen na bewerking of verwerking waarvoor de
      mestverwerker een erkenning aanvraagt;
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel12
  - number: 12.1.f
    text: de wijze waarop hij voornemens is de bewerkte of verwerkte dierlijke meststoffen te vervoeren of te doen vervoeren;
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel12
  - number: 12.1.g
    text: |-
      de winst- en verliesrekening en indien deze negatief is gegevens over de solvabiliteit en liquiditeit van de
      onderneming, en
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel12
  - number: 12.1.h
    text: |-
      de zekerheid, bedoeld in [artikel 9][ref1], waarin door de mestverwerker is voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0012713#Artikel9
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0012713
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: '12.2'
    text: |-
      In afwijking van het eerste lid behoeft een buitenlandse mestverwerker niet het bewijsstuk betreffende de
      registratie, het afschrift van de milieuvergunning en het uittreksel over te leggen. De buitenlandse mestverwerker
      toont aan dat het hem ingevolge de in het land van vestiging geldende regelgeving is toegestaan om de bewerkings-
      of verwerkingsinstallatie in bedrijf te hebben en om de na bewerking of verwerking ontstane producten in dit land
      af te zetten.
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel12
  - number: '13.1'
    text: |-
      Een exporteur legt bij de aanvraag over een afschrift van de overeenkomsten, bedoeld in
      [artikel 7, tweede lid][ref1], een uittreksel, alsmede gegevens met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0012713#Artikel7
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0012713
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 13.1.a
    text: |-
      de bedrijfsmiddelen, daaronder begrepen de transportmiddelen en de vervoerscapaciteit daarvan, waarover de
      exporteur de beschikking heeft;
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel13
  - number: 13.1.b
    text: |-
      de hoeveelheid en de aard van de dierlijke meststoffen waarop [artikel 58ae van de wet][ref1] van toepassing is die
      hij voornemens is aan te voeren en de onderneming of het bedrijf waarvan deze meststoffen worden aangevoerd;


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58ae
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58ae
  - number: 13.1.c
    text: |-
      de afzetmogelijkheden voor de hoeveelheid onbewerkte, ingedikte of gedroogde pluimveemest waarvoor hij een
      erkenning aanvraagt;
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel13
  - number: 13.1.d
    text: de wijze waarop hij voornemens is de dierlijke meststoffen te vervoeren of te doen vervoeren;
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel13
  - number: 13.1.e
    text: |-
      de winst- en verliesrekening en indien deze negatief is gegevens over de solvabiliteit en liquiditeit van de
      onderneming, en
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel13
  - number: 13.1.f
    text: |-
      de zekerheid, bedoeld in [artikel 9][ref1], waarin door de exporteur is voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0012713#Artikel9
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0012713
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: '13.2'
    text: In afwijking van het eerste lid behoeft een buitenlandse exporteur het uittreksel niet over te leggen.
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel13
  - number: '14'
    text: |-
      Een producent legt bij de aanvraag over de gegevens, bedoeld in [artikel 12, eerste lid][ref1], met uitzondering
      van het uittreksel en de gegevens met betrekking tot de zekerheid, bedoeld in [artikel 9][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012713#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0012713#Artikel9
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0012713
        artikel: '12'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0012713
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: '15.1'
    text: |-
      De hoeveelheid dierlijke meststoffen, bedoeld in [artikel 3][ref1] dan wel in [artikel 4][ref2], die bij de
      erkenning van een mestverwerker of van een producent wordt vastgesteld, is afhankelijk van de mate waarin de
      mestverwerker of de producent naar het oordeel van Onze Minister aannemelijk heeft gemaakt dat:


      [ref1]: https://wetten.overheid.nl/BWBR0012713#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0012713#Artikel4
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0012713
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0012713
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 15.1.a
    text: |-
      zowel de hoeveelheid stikstof als de hoeveelheid fosfaat in de te bewerken of verwerken dierlijke meststoffen
      in de vorm van dierlijke meststoffen buiten Nederland kunnen worden afgezet of in de vorm van de na onomkeerbare
      verwerking ontstane producten binnen of buiten Nederland kunnen worden afgezet;
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel15
  - number: 15.1.b
    text: |-
      de capaciteit van de bewerkings- of verwerkingsinstallatie van de mestverwerker of de producent toereikend is voor
      de bewerking of verwerking van de hoeveelheid dierlijke meststoffen waarvoor een erkenning is aangevraagd, en
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel15
  - number: 15.1.c
    text: |-
      de dierlijke meststoffen kunnen worden bewerkt of verwerkt op basis van de voor de installatie van de mestverwerker
      of voor het bedrijf van de producent verleende milieuvergunning.
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel15
  - number: '15.2'
    text: |-
      De hoeveelheid dierlijke meststoffen, bedoeld in [artikel 3][ref1], die bij de erkenning van een exporteur wordt
      vastgesteld, is afhankelijk van de mate waarin de exporteur naar het oordeel van Onze Minister aannemelijk heeft
      gemaakt dat zowel de hoeveelheid stikstof als de hoeveelheid fosfaat in de dierlijke meststoffen in de vorm van
      onbewerkte, ingedikte of gedroogde pluimveemest, kunnen worden afgezet buiten Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0012713#Artikel3
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0012713
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '16.1'
    text: |-
      De erkende tussenpersoon voldoet steeds aan de voorwaarden bedoeld in [artikel 5][ref1], de erkende mestverwerker
      voldoet steeds aan de voorwaarden, bedoeld in [artikel 6, eerste tot en met derde lid][ref2], de erkende exporteur
      voldoet steeds aan de voorwaarden, bedoeld in [artikel 7, eerste lid][ref3], en de erkende producent voldoet steeds
      aan de voorwaarden, bedoeld in de [artikelen 6, eerste lid, met uitzondering van de onderdelen d en g][ref4] van
      dat lid, en tweede tot en met derde lid, en 8, tweede lid, in samenhang met [artikel 8, eerste lid][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0012713#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0012713#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0012713#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0012713#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0012713#Artikel8
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0012713
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0012713
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0012713
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0012713
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0012713
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: '16.2'
    text: |-
      De erkende tussenpersoon, de erkende mestverwerker, de erkende exporteur en de erkende producent melden aan het
      begin van elk kwartaal de wijzigingen die in het kwartaal daaraan voorafgaand hebben plaatsgevonden in de gegevens
      die door hem aan het Bureau Heffingen ingevolge de [artikelen 11][ref1], [12][ref2], [13][ref3] of [14][ref4] zijn
      verstrekt, aan dat bureau op een door Onze Minister voorgeschreven formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0012713#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0012713#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0012713#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0012713#Artikel14
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0012713
        artikel: '11'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0012713
        artikel: '12'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0012713
        artikel: '13'
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0012713
        artikel: '14'
        hoofdstuk: '3'
  - number: '16.3'
    text: |-
      De erkende tussenpersoon handelt niet in strijd met [artikel 58aka, eerste lid, van de wet][ref1] en de erkende
      mestverwerker of erkende exporteur van dierlijke meststoffen in de vorm van onbewerkte, ingedikte of gedroogde
      pluimveemest handelt niet in strijd met [artikel 58al van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58aka
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel58al
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58aka
      - id: ref2
        bwb_id: BWBR0004054
        artikel: 58al
  - number: '16.4'
    text: |-
      Ten aanzien van het bedrijf van de producent worden de regulerende heffingen, bedoeld in
      [artikel 22 van de wet][ref1], geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel22
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '22'
  - number: '17.1'
    text: |-
      De erkende tussenpersoon voert de hoeveelheid dierlijke meststoffen die hij verplicht is aan te voeren op grond van
      een mestafzetovereenkomst daadwerkelijk aan op zijn onderneming, of laat deze afnemen, indien deze meststoffen ter
      levering worden aangeboden.
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel17
  - number: '17.2'
    text: |-
      Elk kalenderjaar voert de erkende tussenpersoon ten minste 80% van de totale in de mestafzetovereenkomsten met een
      erkende mestverwerker of een erkende exporteur overeengekomen hoeveelheid dierlijke meststoffen daadwerkelijk af
      naar de mestverwerker of de exporteur, of laat deze naar de mestverwerker of de exporteur afvoeren. De resterende
      hoeveelheid wordt afgevoerd vóór 1 februari van het daarop volgende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel17
  - number: '18.1'
    text: |-
      De erkende mestverwerker of erkende exporteur voert de hoeveelheid dierlijke meststoffen die hij verplicht is aan
      te voeren op grond van een mestafzetovereenkomst daadwerkelijk aan op zijn onderneming, indien deze meststoffen ter
      levering worden aangeboden.
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel18
  - number: '18.2'
    text: |-
      Elk kalenderjaar voert de erkende mestverwerker, erkende exporteur of erkende producent ten minste 75% van de
      hoeveelheid dierlijke meststoffen die is vastgesteld bij de verlening van de erkenning aan de mestverwerker,
      exporteur of producent, daadwerkelijk af, voor zover deze hoeveelheid aan de mestverwerker of de exporteur is
      afgeleverd of door de erkende producent is geproduceerd. De resterende hoeveelheid wordt afgevoerd vóór 1 april van
      het daarop volgende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel18
  - number: '18.3'
    text: |-
      De erkende mestverwerker of erkende producent bewerkt of verwerkt de dierlijke meststoffen overeenkomstig de
      methode van bewerking of verwerking, bedoeld in [artikel 6, eerste lid, onderdeel a][ref1], en zet de hoeveelheid
      dierlijke meststoffen afhankelijk van die methode af in de vorm van dierlijke meststoffen, van overige organische
      meststoffen, van producten die niet zijn aan te merken als dierlijke meststoffen of overige organische meststoffen
      of die zijn aan te merken als samengestelde meststoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0012713#Artikel6
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0012713
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '19.1'
    text: |-
      De erkende mestverwerker zet de dierlijke meststoffen die op zijn onderneming zijn aangevoerd op grond van een
      mestafzetovereenkomst na bewerking of verwerking, uitgezonderd de dierlijke meststoffen die onomkeerbaar zijn
      verwerkt, rechtstreeks of door tussenkomst van een erkende exporteur buiten Nederland af.
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel19
  - number: '19.2'
    text: |-
      De erkende exporteur zet de dierlijke meststoffen die op zijn onderneming zijn aangevoerd op grond van een
      mestafzetovereenkomst of heeft aangevoerd van de onderneming van een erkende mestverwerker rechtstreeks buiten
      Nederland af.
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel19
  - number: '19.3'
    text: |-
      De erkende mestverwerker, erkende exporteur of erkende producent doet ten minste twee werkdagen vóór de afzet
      buiten Nederland van een vracht al dan niet bewerkte of verwerkte dierlijke meststoffen, die ingevolge het eerste
      lid, het tweede lid of [artikel 58ae, eerste lid, aanhef en onderdeel c, van de wet][ref1] buiten Nederland moet
      worden afgezet, uitgezonderd een vracht bewerkte of verwerkte dierlijke meststoffen met een droge-stofgehalte van
      ten minste 86%, daarvan op een door de Onze Minister voorgeschreven formulier schriftelijk mededeling of op een
      andere bij ministeriële regeling bepaalde wijze. Bij ministeriële regeling worden nadere regels gesteld over de
      wijze waarop de mededeling wordt gedaan, over de gegevens die de mededeling ten minste bevat en de functionaris aan
      wie de mededeling wordt gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58ae
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58ae
  - number: '19.4'
    text: |-
      Het vervoer van een vracht dierlijke meststoffen, die ingevolge het eerste lid, het tweede lid of
      [artikel 58ae, eerste lid, aanhef en onderdeel c, van de wet][ref1] buiten Nederland moet worden afgezet,
      uitgezonderd het vervoer van een vracht dierlijke meststoffen met een droge-stofgehalte van ten minste 86%,
      geschiedt met een transportmiddel dat is uitgerust met satellietvolgapparatuur.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58ae
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58ae
  - number: '19.5'
    text: |-
      Met behulp van satellietvolgapparatuur worden gegevens betreffende het vervoer van de vracht dierlijke meststoffen
      vastgelegd. De erkende mestverwerker, de erkende exporteur of de erkende producent die het vervoer uitvoert,
      bewaart deze gegevens gedurende 5 jaren op zijn onderneming dan wel bedrijf en legt deze gegevens in voorkomend
      geval op verzoek van de Algemene Inspectiedienst over aan deze dienst. Bij ministeriële regeling kunnen nadere
      regels worden gesteld omtrent de eisen waaraan de satellietvolgapparatuur moet voldoen, de gegevens die moeten
      worden vastgelegd en de wijze waarop die gegevens moeten worden vastgelegd en bewaard.
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel19
  - number: '19.6'
    text: |-
      Bij de afzet van dierlijke meststoffen buiten Nederland moet zijn voldaan aan de voorschriften van de richtlijn en
      de verordening.
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel19
  - number: '20'
    text: |-
      De erkende tussenpersoon, erkende mestverwerker, erkende exporteur en erkende producent dienen jaarlijks vóór 1
      september bij het Bureau Heffingen, met gebruikmaking van een door Onze Minister vastgesteld formulier, een rapport
      in van een registeraccountant of een accountant-administratieconsulent bevattende de bevindingen ten aanzien van de
      afzet van de dierlijke meststoffen, bedoeld in de [artikelen 17][ref1], [18][ref2] en [19][ref3], die is opgesteld
      overeenkomstig een bij ministeriële regeling vastgesteld protocol. Indien de erkende tussenpersoon dierlijke
      meststoffen laat afnemen of laat afvoeren, als bedoeld in [artikel 17, eerste en tweede lid][ref4], vermeldt de
      registeraccountant of de accountant-administratieconsulent in de verklaring zijn bevindingen daarover.


      [ref1]: https://wetten.overheid.nl/BWBR0012713#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0012713#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0012713#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0012713#Artikel17
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0012713
        artikel: '17'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0012713
        artikel: '18'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0012713
        artikel: '19'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0012713
        artikel: '17'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '21.1'
    text: |-
      De erkende tussenpersoon, erkende mestverwerker, erkende exporteur of erkende producent
      toont voor de toepassing van de [artikelen 17][ref1], [18][ref2] en [19][ref3] de aanvoer
      en de afvoer van dierlijke meststoffen, respectievelijk overige organische meststoffen, aan
      door een afleveringsbewijs als bedoeld in [artikel 7, eerste lid][ref4], respectievelijk
      [13, eerste lid, van het Besluit administratieve verplichtingen Meststoffenwet][ref5], dat naar waarheid en
      volledig is ingevuld en tijdig is ingezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0012713#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0012713#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0012713#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0009000#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0009000#Artikel13
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0012713
        artikel: '17'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0012713
        artikel: '18'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0012713
        artikel: '19'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0009000
        artikel: '7'
      - id: ref5
        bwb_id: BWBR0009000
        artikel: '13'
  - number: '21.2'
    text: |-
      Indien de erkende tussenpersoon dierlijke meststoffen laat afnemen of laat afvoeren als bedoeld in
      [artikel 17, eerste en tweede lid][ref1], houdt hij een administratie bij waaruit blijkt dat hij aan de
      verplichtingen, bedoeld in [artikel 17, eerste en tweede lid][ref2], heeft voldaan en hij bewaart deze
      administratie gedurende 5 jaren op zijn onderneming.


      [ref1]: https://wetten.overheid.nl/BWBR0012713#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0012713#Artikel17
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0012713
        artikel: '17'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0012713
        artikel: '17'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '21.3'
    text: |-
      De erkende mestverwerker, respectievelijk erkende producent houdt gedurende het kalenderjaar een administratie bij
      van de hoeveelheid, uitgedrukt in kilogrammen, van zijn onderneming, respectievelijk bedrijf afgevoerde producten
      die niet zijn aan te merken als dierlijke meststoffen of overige organische meststoffen onder vermelding van de
      naam, het adres en de woonplaats van de afnemer van die producten en de datum van aflevering, en bewaart deze
      administratie gedurende 5 jaren op zijn onderneming, respectievelijk zijn bedrijf.
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel21
  - number: '22'
    text: |-
      Bij ministeriële regeling wordt bepaald op welke wijze de hoeveelheid stikstof wordt vastgesteld in de dierlijke
      meststoffen en overige organische meststoffen die de erkende tussenpersoon op grond van een mestafzetovereenkomst
      afvoert naar een erkende mestverwerker of een erkende exporteur en die de erkende mestverwerker en de erkende
      exporteur op grond van een mestafzetovereenkomst aanvoeren op hun onderneming en afvoeren van hun onderneming
      ingevolge [artikel 19, eerste of tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012713#Artikel19
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0012713
        artikel: '19'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '23.1'
    text: |-
      De erkende tussenpersoon dient jaarlijks vóór 1 september, met gebruikmaking van een door Onze Minister
      vastgesteld formulier, een afzetplan in waarin hij de hoeveelheid dierlijke meststoffen vermeldt waarvoor hij
      voor het komende kalenderjaar een vaststelling als bedoeldin [artikel 3][ref1] wenst en legt daarbij een of
      meer mestafzetovereenkomsten over op grond waarvan deze hoeveelheid dierlijke meststoffen in dat jaar kan worden
      afgevoerd naar een bedrijf, een erkende mestverwerker of een erkende exporteur. Het afzetplan wordt aangemerkt als
      een aanvraag om erkenning als bedoeld in [artikel 58aka, tweede lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012713#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel58aka
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0012713
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004054
        artikel: 58aka
  - number: '23.2'
    text: |-
      De erkende mestverwerker, erkende exporteur en erkende producent dient jaarlijks vóór 1 september bij het Bureau
      Heffingen, met gebruikmaking van een door Onze Minister vastgesteld formulier, een afzetplan in waarin hij de
      hoeveelheid dierlijke meststoffen vermeldt waarvoor hij voor het komende kalenderjaar een vaststelling als bedoeld
      in [artikel 3][ref1], dan wel in [artikel 4][ref2], wenst en waarin ten aanzien van die hoeveelheid aannemelijk
      is gemaakt dat er in dat jaar mogelijkheden zijn voor de afzet buiten Nederland, dan wel, voor zover de dierlijke
      meststoffen onomkeerbaar worden verwerkt voor de afzet binnen of buiten Nederland. Ten aanzien van de erkende
      mestverwerker en de erkende producent is [artikel 6, vierde lid][ref3], van overeenkomstige toepassing. Ten aanzien
      van de erkende exporteur is [artikel 7, tweede lid][ref4], van overeenkomstige toepassing, met dien verstande dat
      de overeenkomst uiterlijk moet zijn afgesloten op het moment van de indiening van het afzetplan.


      [ref1]: https://wetten.overheid.nl/BWBR0012713#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0012713#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0012713#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0012713#Artikel7
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0012713
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0012713
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0012713
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0012713
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '23.3'
    text: |-
      Indien de hoeveelheid dierlijke meststoffen waarvoor de erkende tussenpersoon, de erkende mestverwerker of
      de erkende exporteur voor het komende kalenderjaar een vaststelling wenst, een grotere hoeveelheid is dan de
      hoeveelheid die bij zijn erkenning is vastgesteld, dan wel dan de hoeveelheid die voor het lopende kalenderjaar
      is vastgesteld, legt hij bij het afzetplan gegevens over betreffende de aanvullende zekerheid waarin door hem is
      voorzien.
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel23
  - number: '23.4'
    text: |-
      Bij het afzetplan voegt de erkende tussenpersoon, de erkende mestverwerker, de erkende exporteur of de erkende
      producent een verklaring dat nog steeds wordt voldaan aan de voorwaarden uit [hoofdstuk 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012713#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0012713
        hoofdstuk: '2'
  - number: '24.1'
    text: |-
      Ter verkrijging van een vaststelling van een grotere hoeveelheid dierlijke meststoffen dan de hoeveelheid die
      is vastgesteld bij de verlening van de erkenning als bedoeld in [artikel 3][ref1] dan wel in [artikel 4][ref2],
      dient de erkende tussenpersoon, erkende mestverwerker, erkende exporteur of erkende producent met gebruikmaking
      van een door Onze Minister vastgesteld formulier daartoe bij Bureau Heffingen een aanvraag in en legt daarbij over
      aanvullende gegevens betreffende de afzetmogelijkheden voor de aanvullende hoeveelheid dierlijke meststoffen en de
      aanvullende zekerheid waarin door hem is voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0012713#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0012713#Artikel4
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0012713
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0012713
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '24.2'
    text: |-
      Bij de bepaling van de aanvullende hoeveelheid dierlijke meststoffen is [artikel 15][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012713#Artikel15
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0012713
        artikel: '15'
        hoofdstuk: '4'
  - number: '24.3'
    text: |-
      De erkende tussenpersoon heeft voor de aanvullende hoeveelheid, bedoeld in het eerste lid, een of meer
      mestafzetovereenkomsten afgesloten met een bedrijf, een erkende mestverwerker of een erkende exporteur en legt deze
      overeenkomsten over tezamen met de gegevens, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel24
  - number: '24.4'
    text: |-
      De erkende mestverwerker, erkende exporteur of erkende producent heeft voor de aanvullende hoeveelheid dierlijke
      meststoffen, bedoeld in het eerste lid, daarbij in voorkomend geval buiten beschouwing gelaten de hoeveelheid
      dierlijke meststoffen die onomkeerbaar wordt verwerkt, een of meer overeenkomsten betreffende de afname van die
      hoeveelheid afgesloten met afnemers gevestigd buiten Nederland en legt een afschrift van deze overeenkomsten over
      tezamen met de gegevens, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel24
  - number: '24.5'
    text: |-
      De aanvullende hoeveelheid dierlijke meststoffen voor de erkende mestverwerker, erkende exporteur of erkende
      producent wordt alleen door Onze Minister vastgesteld indien de mestverwerker, exporteur, of producent bij
      de aanvraag voor die aanvullende hoeveelheid een of meer overeenkomsten betreffende de afname van dierlijke
      meststoffen met afnemers gevestigd buiten Nederland overlegt voor de hoeveelheid dierlijke meststoffen
      ten aanzien waarvan geen afschrift van een overeenkomst als bedoeld in de [artikelen 6, vierde lid][ref1],
      of [7, tweede lid][ref2], is overgelegd bij de indiening van de aanvraag, bedoeld in [artikel 10][ref3], of
      in voorkomend geval het afzetplan, bedoeld in [artikel 23][ref4], voorzover er geen sprake is van onomkeerbare
      verwerking.


      [ref1]: https://wetten.overheid.nl/BWBR0012713#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0012713#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0012713#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0012713#Artikel23
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0012713
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0012713
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0012713
        artikel: '10'
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0012713
        artikel: '23'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: '25'
    text: |-
      Voor de toepassing van [artikel 58ae][ref1] is vereist dat ten minste 80% van de hoeveelheid dierlijke meststoffen
      die door een producent op grond van een mestafzetovereenkomst aan een erkende mestverwerker of erkende exporteur
      daadwerkelijk moet worden afgeleverd zonder tussenopslag wordt afgeleverd in het kalenderjaar waarop de
      overeenkomst betrekking heeft. De resterende hoeveelheid wordt zonder tussenopslag afgeleverd vóór 1 februari van
      het daarop volgende kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58ae
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58ae
  - number: '26'
    text: |-
      Voor de toepassing van [artikel 58ae, eerste lid, onderdeel c, van de wet][ref1] is vereist dat de
      erkende producent de hoeveelheid dierlijke meststoffen, bedoeld in [artikel 4][ref2], afzet overeenkomstig
      [artikel 18, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel58ae
      [ref2]: https://wetten.overheid.nl/BWBR0012713#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0012713#Artikel18
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: 58ae
      - id: ref2
        bwb_id: BWBR0012713
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0012713
        artikel: '18'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '27.1'
    text: |-
      Indien een erkende tussenpersoon, een erkende exporteur, een erkende producent, of een erkende mestverwerker niet
      voldoet aan de voor erkenning gestelde voorwaarden opgenomen in [hoofdstuk 2][ref1] en [3][ref2] of niet voldoet
      aan de verplichtingen opgenomen in [hoofdstuk 5][ref3] kan Onze Minister:


      [ref1]: https://wetten.overheid.nl/BWBR0012713#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0012713#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0012713#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0012713
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0012713
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0012713
        hoofdstuk: '5'
  - number: 27.1.a
    text: de erkenning of de daaraan verbonden voorschriften wijzigen;
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel27
  - number: 27.1.b
    text: nadere voorschriften aan de erkenning verbinden;
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel27
  - number: 27.1.c
    text: de erkenning voor een bepaalde periode schorsen;
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel27
  - number: 27.1.d
    text: de erkenning intrekken.
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel27
  - number: '27.2'
    text: |-
      De maatregelen, bedoeld in het eerste lid, onderdelen a en b, kunnen worden gepubliceerd en de maatregelen, bedoeld
      in het eerste lid, onderdelen c en d, worden gepubliceerd.
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel27
  - number: '28.1'
    text: |-
      Aan een tussenpersoon, een mestverwerker, een producent of een exporteur, wiens erkenning is ingetrokken, wordt met
      betrekking tot het kalenderjaar volgend op de intrekking geen nieuwe erkenning verleend.
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel28
  - number: '28.2'
    text: |-
      Er wordt evenmin een erkenning verleend aan een tussenpersoon, een mestverwerker, een exporteur of een producent,
      die participeert in een onderneming of een bedrijf waarin natuurlijke personen participeren die participeerden
      in een bedrijf of onderneming waarvan de erkenning in het kalenderjaar voorafgaand aan de aanvraag om erkenning
      is ingetrokken.
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel28
  - number: '29'
    text: |-
      Bij ministeriële regeling kunnen van de in de [artikelen 6][ref1], [12][ref2] en [19, eerste lid][ref3], afwijkende
      voorwaarden worden gesteld voor het geval de na bewerking of verwerking ontstane dierlijke meststoffen of overige
      organische meststoffen niet rechtstreeks door de mestverwerker of de producent of door tussenkomst van een erkende
      exporteur worden afgezet buiten Nederland, maar de meststoffen eerst na verdere bewerking of verwerking of ander
      gebruik buiten Nederland worden afgezet.


      [ref1]: https://wetten.overheid.nl/BWBR0012713#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0012713#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0012713#Artikel19
    url: https://wetten.overheid.nl/BWBR0012713/2001-08-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0012713
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
