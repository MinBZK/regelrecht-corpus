        artikel: '53'
  - number: '3'
    text: |-
      1 De vergunninghouder doet, indien hij voorziet of behoort te voorzien dat hij niet langer in staat zal zijn
      om zijn plicht tot levering van gas aan zijn kleinverbruikers na te komen of indien hij surseance van betaling
      heeft aangevraagd dan wel te zijnen aanzien faillissement is aangevraagd, daarvan onverwijld mededeling aan de
      netbeheerder van het landelijk gastransportnet en aan Onze Minister.

      2 Indien een netbeheerder, niet zijnde de netbeheerder van het landelijk gastransportnet, uit de hem ter
      beschikking staande gegevens redenen heeft om te vermoeden, dat de continuïteit van de levering door een
      vergunninghouder in gevaar komt, meldt hij dat zo spoedig mogelijk aan de netbeheerder van het landelijk
      gastransportnet en aan Onze Minister.

      3 De vergunninghouder dan wel, indien aan deze surseance van betaling is verleend onderscheidenlijk deze failliet
      is verklaard, de bewindvoerder en vergunninghouder tezamen, onderscheidenlijk de curator, plegen op verzoek
      van Onze Minister overleg met hem en met de netbeheerder van het landelijk gastransportnet met het oog op zijn
      leveringsplicht en de toepassing van dit artikel.

      4 Een beschikking treedt ten hoogste twintig werkdagen na de dag, waarop die beschikking is genomen, in werking.
      De vergunninghouder dan wel de bewindvoerder en vergunninghouder tezamen onderscheidenlijk de curator geeft daarvan
      onverwijld bericht aan de kleinverbruikers aan wie hij gas levert.

      5 Tot en met tien werkdagen na het tijdstip waarop een beschikking is genomen, of indien dat korter is, tot het
      tijdstip waarop een beschikking in werking is getreden, is ingetrokken of tot het tijdstip waarop Onze Minister
      besluit het zesde lid toe te passen:

      a. zijn de kleinverbruikers van de betrokken vergunninghouder niet bevoegd hun verbintenis op te schorten, en voert
      een netbeheerder geen leverancierswisseling op verzoek van die kleinverbruikers uit;

      b. draagt de vergunninghouder dan wel de bewindvoerder en vergunninghouder tezamen, onderscheidenlijk
      de curator het bestand aan kleinverbruikers die gedurende de in aanhef bedoelde periode een
      verbintenis met de vergunninghouder hebben en dat in ieder geval de gegevens, bedoeld in
      [artikel 3, tweede lid, onderdeel b, van het Besluit vergunning levering gas aan kleinverbruikers][ref1] omvat,
      zo spoedig mogelijk over aan één of meer andere vergunninghouders, die de levering van gas aan de betrokken
      kleinverbruikers voortzetten;

      c. staat de netbeheerder van het landelijk gastransportnet, voor zover dat redelijkerwijs noodzakelijk is om te
      waarborgen dat gedurende de in de aanhef bedoelde periode de levering van gas kan worden voortgezet, op verzoek
      van de vergunninghouder dan wel de bewindvoerder en de vergunninghouder tezamen onderscheidenlijk de curator garant
      voor de betaling van de inkoop van gas ten behoeve van de levering van gas aan kleinverbruikers in die periode.

      6 Indien op de elfde werkdag na het tijdstip waarop een beschikking is genomen deze beschikking niet inwerking is
      getreden of niet is ingetrokken, of indien dat korter is, het tijdstip waarop Onze Minister besluit dit lid toe
      te passen:

      a. draagt de vergunninghouder dan wel de bewindvoerder en vergunninghouder tezamen,
      onderscheidenlijk de curator op de in de aanhef bedoelde dag het bestand aan kleinverbruikers die
      nog een verbintenis met de vergunninghouder hebben en dat in ieder geval de gegevens, bedoeld in
      [artikel 3, tweede lid, onderdeel b, van het Besluit vergunning levering gas aan kleinverbruikers][ref2] omvat,
      over aan de netbeheerder van het landelijk gastransportnet;

      b. draagt de netbeheerder van het landelijk gastransportnet er zorg voor dat de levering van gas aan
      kleinverbruikers, die gedurende de periode tussen de in aanhef bedoelde dag en het tijdstip van inwerkingtreding
      van de beschikking nog een overeenkomst met de betrokken vergunninghouder hebben, wordt voortgezet door een andere
      vergunninghouder waarbij hij de gegevens, bedoeld in onderdeel a, van de betreffende kleinverbruikers overdraagt
      aan de betrokken vergunninghouders en geeft hij daartoe aanwijzingen aan de netbeheerders. Daartoe coördineert
      hij de verdeling van die kleinverbruikers over de andere vergunninghouders en geeft daartoe aanwijzingen aan de
      netbeheerders. Netbeheerders verstrekken aan de netbeheerder van het landelijk gastransportnet de gegevens, die
      deze nodig heeft voor uitvoering van deze taak. De verdeling geschiedt naar evenredigheid van het totale aantal
      kleinverbruikers dat de andere vergunninghouders reeds beleveren, tenzij Onze Minister tot een andere wijze van
      verdeling besluit;

      c. zet de aldus aangewezen vergunninghouder met een overeenkomst voor onbepaalde tijd en verder onder zijn
      voorwaarden de levering van gas aan de aan hem toegewezen kleinverbruikers vanaf de datum van toedeling voort;

      d. zijn de kleinverbruikers van de betrokken vergunninghouder tot de datum van toedeling aan de aangewezen
      leverancier niet bevoegd hun verbintenis op te schorten, en voert een netbeheerder geen leverancierswisseling op
      verzoek van die kleinverbruikers uit;

      e. staat de netbeheerder van het landelijk gastransportnet, voor zover dat redelijkerwijs noodzakelijk is om te
      waarborgen dat gedurende de periode tussen de in de aanhef bedoelde dag en het tijdstip van inwerkingtreding van de
      beschikking de levering van gas kan worden voortgezet, op verzoek van de vergunninghouder dan wel de bewindvoerder
      en de vergunninghouder tezamen onderscheidenlijk de curator garant voor de betaling van de inkoop van gas ten
      behoeve van de levering van gas ten behoeve van kleinverbruikers die in deze periode nog een overeenkomst met
      de betrokken vergunninghouder hebben indien de vergunninghouder dan wel de bewindvoerder en de vergunninghouder
      tezamen onderscheidenlijk de curator bij het verzoek aantoont dat de bestaande kredietruimte onvoldoende is om te
      waarborgen dat gedurende deze periode de levering van gas kan worden voortgezet;

      f. staat de netbeheerder van het landelijk gastransportnet, voor zover dat redelijkerwijs noodzakelijk is om te
      waarborgen dat gedurende de periode tussen de in de aanhef bedoelde dag en het tijdstip van inwerkingtreding van
      de beschikking en ten hoogste de daaropvolgende twee maanden de levering van gas kan worden voortgezet, op verzoek
      van een vergunninghouder aan wie op grond van onderdeel b kleinverbruikers zijn toegedeeld garant voor de betaling
      van de inkoop van gas ten behoeve van de levering van gas aan de toebedeelde kleinverbruikers in die periode indien
      de vergunninghouder bij het verzoek aantoont dat de bestaande kredietruimte onvoldoende is om te waarborgen dat
      gedurende deze periode en in de daaropvolgende twee maanden de levering van gas aan de toegedeelde kleinverbruikers
      kan worden voortgezet.

      7 De netbeheerder van het landelijk gastransportnet brengt aan alle vergunninghouders, naar evenredigheid van
      het aantal kleinverbruikers dat zij beleveren, een deel van de te zijnen laste blijvende kosten, gemaakt ter
      uitvoering van zijn taak bedoeld in het vijfde lid, onderdeel c en zesde lid, onderdelen e en f, in het geval
      dat de vergunninghouder de verplichtingen uit de garantstelling niet nakomt vanwege surseance van betaling of
      faillissement, in rekening. Elke vergunninghouder berekent het desbetreffende bedrag door aan de kleinverbruikers
      die hij gas levert, waarbij elke kleinverbruiker een gelijk bedrag in rekening wordt gebracht.

      8 Indien ondanks de toepassing van dit artikel de vergunninghouder gedurende de periode, bedoeld in onderdeel c van
      het vijfde lid, onvoldoende gas krijgt toegeleverd voor de levering aan de kleinverbruikers, stelt de netbeheerder
      van het landelijk gastransportnet in die periode naar vermogen gas ter beschikking aan de vergunninghouder. Met
      betrekking tot de met deze verplichting verband houdende, te zijnen laste blijvende kosten is het zevende lid van
      overeenkomstige toepassing.


