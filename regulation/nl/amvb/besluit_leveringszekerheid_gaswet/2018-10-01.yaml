        artikel: '47'
  - number: '2'
    text: |-
      1 De netbeheerder van het landelijk gastransportnet zorgt voor alle voorzieningen op het gebied van gasinkoop,
      flexibiliteitsdiensten en gastransport op het landelijke gastransportnet, nodig om vergunninghouders in staat te
      stellen de pieklevering te verzorgen voor alle kleinverbruikers in Nederland. Deze voorzieningen moeten volstaan om
      pieklevering te kunnen verzorgen op een dag met een gemiddelde effectieve etmaal temperatuur in De Bilt van – 17 °C
      (graden Celsius).

      2 De netbeheerder van het landelijk gastransportnet stelt ter uitvoering van zijn in het eerste lid genoemde taak
      gas beschikbaar aan vergunninghouders op de punten waar een verbinding bestaat tussen het landelijk gastransportnet
      en de netwerken van de netbeheerders, niet zijnde de netbeheerder van het landelijk gastransportnet.

      3 De netbeheerder van het landelijk gastransportnet stelt de totale omvang vast van de voorzieningen nodig voor de
      pieklevering voor alle kleinverbruikers en stelt deze ter beschikking naar rato van het kleinverbruikersbestand van
      de vergunninghouders. De landelijke netbeheerder brengt de voorzieningen voor pieklevering dienovereenkomstig in
      rekening aan vergunninghouders, tenzij anders overeengekomen.

      4 De netbeheerder van het landelijk gastransportnet hanteert een tariefstelling voor de pieklevering gebaseerd op
      de tarieven van de in lid 1 genoemde componenten. De tarieven van deze componenten zijn gebaseerd op ontwikkelingen
      in de relevante Europese markt.

      5 De netbeheerder, niet zijnde de netbeheerder van het landelijk gastransportnet, verstrekt aan de netbeheerder
      van het landelijk gastransportnet de informatie die nodig is om per vergunninghouder de benodigde omvang van de
      voorzieningen, bedoeld in het tweede lid, te bepalen.

      6 Indien de netbeheerder van het landelijk gastransportnet voor de uitvoering van de taak, bedoeld in het eerste
      lid, een openbare inkoopprocedure volgt, doet de in [artikel 53 van de wet][ref1] genoemde rechtspersoon een aanbod
      onder redelijke voorwaarden en tegen marktconforme tarieven.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel53
    url: https://wetten.overheid.nl/BWBR0016605/2018-10-01#Artikel2
    references:
