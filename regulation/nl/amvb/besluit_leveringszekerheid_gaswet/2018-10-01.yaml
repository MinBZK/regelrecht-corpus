articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. wet: de [Gaswet][ref1];

      b. kleinverbruiker: in [artikel 43, eerste lid, van de wet][ref2] bedoelde afnemer;

      c. leveringsvergunning: vergunning, bedoeld in [artikel 43, eerste lid, van de wet][ref3];

      d. vergunninghouder: houder van een leveringsvergunning;

      e. gemiddelde effectieve etmaaltemperatuur: gemiddelde luchttemperatuur te De Bilt (T) in een etmaal, gecorrigeerd
      voor de gemiddelde windsnelheid op hetzelfde station (V) in dezelfde periode uitgedrukt in meters per seconde,
      volgens de formule: Teff = T – (V/1,5);

      f. pieklevering: het deel van de feitelijke aflevering van gas in een uur aan kleinverbruikers dat de hoeveelheid
      te boven gaat zoals die maximaal in een uur aan deze kleinverbruikers zou worden geleverd op een dag met een
      gemiddelde effectieve etmaal temperatuur in De Bilt van – 9 °C (graden Celsius);

      g. beschikking: een beschikking tot intrekking van een leveringsvergunning.


