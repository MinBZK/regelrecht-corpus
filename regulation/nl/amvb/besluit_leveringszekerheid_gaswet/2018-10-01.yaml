    text: |-
      Deze regeling berust op de [artikelen 10a, vierde lid][ref1], en [47, tweede lid, van de Gaswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel47
