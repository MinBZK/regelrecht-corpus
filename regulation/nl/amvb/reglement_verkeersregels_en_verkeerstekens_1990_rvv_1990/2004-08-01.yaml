  - number: '98'
    text: |-
      Tot 1 januari 2000 blijven de borden 37 en 38 van bijlage II, van het op 1 november 1991 ingetrokken Reglement
      verkeersregels en verkeerstekens (*Stb.* 1966, 181), van kracht. De in het [Voertuigreglement][ref1] vervatte
      bepalingen die betrekking hebben op onverharde wegen gelden tot deze datum ook ten aanzien van door deze borden
      aangeduide wegen.


      [ref1]: https://wetten.overheid.nl/BWBR0006746
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel98
