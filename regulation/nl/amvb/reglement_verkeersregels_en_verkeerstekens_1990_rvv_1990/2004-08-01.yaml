  - number: '120'
    text: |-
      De artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel120
  - number: '121'
    text: Dit besluit kan worden aangehaald als "Reglement verkeersregels en verkeerstekens 1990" of als "RVV 1990".
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel121
