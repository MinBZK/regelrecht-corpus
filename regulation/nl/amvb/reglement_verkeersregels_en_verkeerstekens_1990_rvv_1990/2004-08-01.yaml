  - number: 1a
    text: |-
      Onder de vermelding in dit besluit van een EG-richtlijn wordt verstaan hetgeen daaronder wordt
      begrepen in [artikel 1.1a van het Voertuigreglement][ref1], met inbegrip van de ingevolge
      [artikel 1.7, eerste lid, van het Voertuigreglement][ref2] bekendgemaakte wijzigingen.
      [Artikel 1.7, tweede lid, van het Voertuigreglement][ref3] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel1.1a
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel1.7
      [ref3]: https://wetten.overheid.nl/BWBR0006746#Artikel1.7
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel1a
