        paragraaf: '17'
      - id: ref4
        bwb_id: BWBR0004825
        artikel: '62'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0004825
      - id: ref6
        bwb_id: BWBR0004825
        artikel: '25'
