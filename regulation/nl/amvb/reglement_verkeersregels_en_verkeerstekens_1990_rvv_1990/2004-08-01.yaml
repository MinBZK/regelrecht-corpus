        artikel: '1.7'
  - number: '2'
    text: |-
      1 De regels van dit besluit betreffende voetgangers zijn mede van toepassing op bestuurders van een
      gehandicaptenvoertuig, indien zij van een voetpad of trottoir gebruik maken of van het ene naar het andere voetpad
      of trottoir oversteken.

      2 De regels van dit besluit betreffende voetgangers zijn voorts mede van toepassing op personen die te voet een
      motorfiets, bromfiets of fiets aan de hand meevoeren, alsmede op personen die zich verplaatsen met behulp van
      voorwerpen, niet zijnde voertuigen.

      3 De regels van dit besluit betreffende wagens zijn mede van toepassing op door voetgangers gevormde kolonnes,
      optochten en uitvaartstoeten voor zover deze de rijbaan volgen.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel2
  - number: 2a
    text: |-
      De regels van dit besluit betreffende motorvoertuigen en bestuurders en passagiers van motorvoertuigen zijn, in
      plaats van de regels betreffende bromfietsen, bromfietsers en passagiers van bromfietsen, mede van toepassing op
      brommobielen en bestuurders en passagiers van brommobielen.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel2a
  - number: 2b
    text: |-
      De regels van dit besluit betreffende fietsen en fietsers zijn, in plaats van de regels betreffende bromfietsen en
      bromfietsers, mede van toepassing op snorfietsen en snorfietsers, tenzij anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel2b
  - number: '3'
    text: |-
      1 Bestuurders zijn verplicht zoveel mogelijk rechts te houden.

      2 Fietsers mogen met zijn tweeën naast elkaar rijden. Dit geldt niet voor snorfietsers.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel3
  - number: '4'
    text: |-
      1 Voetgangers gebruiken het trottoir of het voetpad.

      2 Zij gebruiken het fietspad of het fiets/bromfietspad indien trottoir en voetpad ontbreken.

      3 Zij gebruiken de berm of de uiterste zijde van de rijbaan, indien ook een fietspad of een fiets/bromfietspad
      ontbreekt.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel4
  - number: '5'
    text: |-
      1 Fietsers gebruiken het verplichte fietspad of het fiets/bromfietspad.

      2 Zij gebruiken de rijbaan indien een verplicht fietspad of een fiets/bromfietspad ontbreekt.

      3 Zij mogen het onverplichte fietspad gebruiken. Snorfietsers mogen het onverplichte fietspad slechts gebruiken met
      uitgeschakelde motor.

      4 Bestuurders van fietsen op meer dan twee wielen en fietsen met aanhangwagen, die met inbegrip van de lading
      breder zijn dan 0,75 meter, mogen de rijbaan gebruiken.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel5
  - number: '6'
    text: |-
      1 Bromfietsers gebruiken het fiets/bromfietspad.

      2 Zij gebruiken de rijbaan indien een fiets/bromfietspad ontbreekt.

      3 Bestuurders van bromfietsen op meer dan twee wielen en bromfietsen met aanhangwagen, die met inbegrip van de
      lading breder zijn dan 0,75 meter, mogen de rijbaan gebruiken.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel6
  - number: '7'
    text: |-
      Bestuurders van een gehandicaptenvoertuig gebruiken het trottoir, het voetpad, het fietspad, het fiets/bromfietspad
      of de rijbaan.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel7
  - number: '8'
    text: |-
      1 Ruiters gebruiken het ruiterpad.

      2 Zij gebruiken de berm of de rijbaan indien een ruiterpad ontbreekt.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel8
  - number: '9'
    text: Voetgangers mogen de rijbaan gebruiken, indien zij een kolonne, een optocht of een uitvaartstoet vormen.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel9
  - number: '10'
    text: |-
      1 Andere bestuurders dan die genoemd in de [artikelen 5 tot en met 8][ref1] gebruiken de rijbaan. Zij mogen
      voor het parkeren van hun voertuig tevens andere weggedeelten gebruiken, behalve het trottoir, het voetpad, het
      fietspad, het fiets/bromfietspad of het ruiterpad.

      2 Andere bestuurders dan fietsers en bestuurders van een gehandicaptenvoertuig mogen fietsstroken met doorgetrokken
      strepen niet gebruiken.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel5
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
  - number: '11'
    text: |-
      1 Inhalen geschiedt links.

      2 Bestuurders die links voorgesorteerd hebben en te kennen hebben gegeven dat zij naar links willen afslaan, worden
      rechts ingehaald.

      3 Fietsers dienen elkaar links in te halen; zij mogen andere bestuurders rechts inhalen.

      4 Bestuurders die zich rechts van een blokmarkering bevinden mogen bestuurders die zich links van deze markering
      bevinden rechts inhalen.

      5 Bestuurders mogen trams rechts inhalen.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel11
  - number: '12'
    text: Het is verboden een voertuig vlak voor of op een voetgangersoversteekplaats in te halen.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel12
  - number: '13'
    text: |-
      1 Bij fileverkeer behoeft, indien de rijbaan is verdeeld in rijstroken in dezelfde richting, niet de meest rechts
      gelegen rijstrook te worden gevolgd.

      2 Files mogen aan de rechterzijde worden ingehaald.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel13
  - number: '14'
    text: Bestuurders mogen een kruispunt niet blokkeren.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel14
  - number: '15'
    text: |-
      1 Op kruispunten verlenen bestuurders voorrang aan voor hen van rechts komende bestuurders.

      2 Op deze regel gelden de volgende uitzonderingen:

      a. bestuurders op een onverharde weg verlenen voorrang aan bestuurders op een verharde weg;

      b. bestuurders verlenen voorrang aan bestuurders van een tram.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel15
  - number: 15a
    text: |-
      1 Weggebruikers mogen een overweg opgaan, indien zij direct kunnen doorgaan en de overweg geheel kunnen vrijmaken.

      2 Bij overwegen laten weggebruikers een railvoertuig voorgaan en laten daarbij de overweg geheel vrij.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel15a
  - number: '16'
    text: Weggebruikers mogen militaire kolonnes niet doorsnijden.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel16
  - number: '17'
    text: |-
      1 Bestuurders die willen afslaan, mogen voorsorteren door:

      a. indien zij naar rechts willen afslaan tijdig zoveel mogelijk aan de rechterzijde te gaan rijden;

      b. indien zij naar links willen afslaan tijdig zoveel mogelijk tegen de wegas te rijden of bij rijbanen bestemd
      voor bestuurders in één richting daarop zoveel mogelijk links te houden.

      2 Bestuurders moeten alvorens af te slaan een teken met hun richtingaanwijzer of met hun arm geven.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel17
  - number: '18'
    text: |-
      1 Bestuurders die afslaan, moeten het verkeer dat hen op dezelfde weg tegemoet komt of dat op dezelfde weg zich
      naast dan wel links of rechts dicht achter hen bevindt, voor laten gaan.

      2 Bestuurders die naar links afslaan, moeten tegemoetkomende bestuurders die op hetzelfde kruispunt naar rechts
      afslaan voor laten gaan.

      3 Het eerste en het tweede lid gelden niet voor bestuurders van een tram.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel18
  - number: '19'
    text: |-
      De bestuurder moet in staat zijn zijn voertuig tot stilstand te brengen binnen de afstand waarover hij de weg kan
      overzien en waarover deze vrij is.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel19
  - number: '20'
    text: |-
      Binnen de bebouwde kom gelden de volgende maximumsnelheden:

      a. voor motorvoertuigen 50 km per uur;

      b. voor bromfietsen en gehandicaptenvoertuigen, uitgerust met een motor, 30 km per uur.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel20
  - number: '21'
    text: |-
      Buiten de bebouwde kom gelden de volgende maximumsnelheden:

      a. voor motorvoertuigen op autosnelwegen 120 km per uur, op autowegen 100 km per uur en op andere wegen 80 km per
      uur;

      b. voor bromfietsen en gehandicaptenvoertuigen, uitgerust met een motor, 40 km per uur.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel21
  - number: '22'
    text: |-
      Voor zover niet ingevolge andere artikelen een lagere maximumsnelheid geldt, gelden voor de volgende voertuigen de
      volgende bijzondere maximumsnelheden:

      a. voor vrachtauto's, autobussen en motorvoertuigen met aanhangwagen 80 km per uur;

      b. voor landbouwtrekkers en motorvoertuigen met beperkte snelheid, als bedoeld in
      [artikel 1.1 van het Voertuigreglement][ref1], 25 km per uur;

      c. voor brommobielen 45 km per uur;

      d. voor snorfietsers 25 km per uur.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006746
        artikel: '1.1'
  - number: '23'
    text: |-
      1 De bestuurder mag zijn voertuig niet laten stilstaan:

      a. op een kruispunt of een overweg;

      b. op een fietsstrook of op de rijbaan langs een fietsstrook;

      c. op een oversteekplaats of binnen een afstand van vijf meter daarvan;

      d. in een tunnel;

      e. bij een bord bushalte ter hoogte van de geblokte markering dan wel, ingeval die markering niet is aangebracht,
      op een afstand van minder dan 12 meter van het bord;

      f. op de rijbaan langs een busstrook en

      g. langs een gele doorgetrokken streep.

      2 Onderdeel *e* van het eerste lid geldt niet voor het onmiddellijk laten in- en uitstappen van passagiers.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel23
  - number: '24'
    text: |-
      1 De bestuurder mag zijn voertuig niet parkeren:

      a. bij een kruispunt op een afstand van minder dan vijf meter daarvan;

      b. voor een inrit of een uitrit;

      c. buiten de bebouwde kom op de rijbaan van een voorrangsweg;

      d. op een parkeergelegenheid:

      1°. voor zover zijn voertuig niet behoort tot de op het bord of op het onderbord aangegeven voertuigcategorie of
      groep voertuigen;

      2°. op een andere wijze dan op het bord of op het onderbord is aangegeven;

      3°. op dagen of uren waarop dit blijkens het onderbord is verboden;

      e. langs een gele onderbroken streep;

      f. op een gelegenheid bestemd voor het onmiddellijk laden en lossen van goederen;

      g. op een parkeerplaats voor vergunninghouders, aangeduid door verkeersbord E9 van [bijlage I][ref1], indien voor
      zijn voertuig geen vergunning tot parkeren op die plaats is verleend.

      2 Indien onder de verkeersborden E4 tot en met E8, E12 en E13 van [bijlage 1][ref2], op een onderbord dagen of
      uren zijn vermeld, gelden de uit het bord of onderbord voortvloeiende geboden of verboden slechts gedurende de
      aangegeven dagen of uren.

      3 De bestuurder mag zijn voertuig niet dubbel parkeren.

      4 Indien een parkeergelegenheid, aangeduid met een van de verkeersborden E 4 tot en met E 13 van [bijlage 1][ref3],
      is voorzien van parkeervakken, mag slechts in die vakken worden geparkeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0004825
      [ref2]: https://wetten.overheid.nl/BWBR0004825
      [ref3]: https://wetten.overheid.nl/BWBR0004825
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004825
      - id: ref2
        bwb_id: BWBR0004825
      - id: ref3
        bwb_id: BWBR0004825
  - number: '25'
    text: |-
      1 Het is verboden in een parkeerschijf-zone te parkeren, behalve op parkeerplaatsen die als zodanig zijn aangeduid
      of aangegeven of plaatsen die zijn voorzien van een blauwe streep.

      2 Op plaatsen die zijn voorzien van een blauwe streep, is het parkeren van een motorvoertuig op meer dan twee
      wielen slechts toegestaan, indien het motorvoertuig overeenkomstig het door Onze Minister bepaalde is voorzien van
      een duidelijk zichtbare parkeerschijf, waarop het tijdstip staat aangegeven waarop met parkeren is begonnen en de
      toegestane parkeerduur niet is verstreken.

      3 Indien op een onderbord dagen of uren zijn vermeld, geldt het tweede lid slechts gedurende die dagen of uren.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel25
  - number: '26'
    text: |-
      Op een gehandicaptenparkeerplaats mag slechts worden geparkeerd:

      a. een gehandicaptenvoertuig;

      b. een motorvoertuig op meer dan twee wielen waarin een geldige gehandicaptenparkeerkaart duidelijk zichtbaar is
      aangebracht of

      c. indien de gehandicaptenparkeerplaats is gereserveerd voor een bepaald voertuig, dat voertuig.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel26
  - number: '27'
    text: |-
      Fietsen en bromfietsen worden geplaatst op het trottoir, op het voetpad of in de berm dan wel op andere door het
      bevoegde gezag aangewezen plaatsen.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel27
  - number: '28'
    text: Bestuurders mogen slechts geluidssignalen en knippersignalen geven ter afwending van dreigend gevaar.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel28
  - number: '29'
    text: |-
      1 Bestuurders van motorvoertuigen ten dienste van politie en brandweer, ziekenauto’s en motorvoertuigen van andere
      door Onze Minister aangewezen hulpverleningsdiensten voeren blauw zwaai- of knipperlicht en een twee- of drietonige
      hoorn om kenbaar te maken dat zij een dringende taak vervullen.

      2 Bij ministeriële regeling worden voorschriften vastgesteld betreffende het blauwe zwaai- of knipperlicht en de
      meertonige hoorn.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel29
  - number: '30'
    text: |-
      1 Bestuurders van motorvoertuigen, die voor nader aan te geven werkzaamheden worden gebruikt, voeren onder nader
      aan te geven omstandigheden tijdens deze werkzaamheden geel zwaai- of knipperlicht. De in artikel 29 genoemde
      bestuurders mogen in die gevallen in plaats van geel zwaai- of knipperlicht, blauw zwaai- of knipperlicht voeren.

      2 Bij ministeriële regeling worden voorschriften vastgesteld betreffende het gele zwaai- of knipperlicht en de
      werkzaamheden en omstandigheden waarbij deze signalen worden gevoerd.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel30
  - number: '31'
    text: Signalen mogen niet worden gegeven in andere gevallen of op andere wijze dan in deze paragraaf is toegestaan.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel31
  - number: '32'
    text: |-
      1 Bestuurders van een motorvoertuig, bromfietsers, snorfietsers en bestuurders van een gehandicaptenvoertuig moeten
      bij dag, indien het zicht ernstig wordt belemmerd, en bij nacht dimlicht voeren.

      2 Het voeren van groot licht in plaats van dimlicht is toegestaan behoudens in de volgende gevallen:

      a. bij dag;

      b. bij het tegenkomen van een andere weggebruiker en

      c. bij het op korte afstand volgen van een ander voertuig.

      3 Achterlicht en de verlichting van de achterkentekenplaat moeten steeds gelijktijdig met groot licht, dimlicht,
      stadslicht of mistlicht branden.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel32
  - number: '33'
    text: |-
      Gekoppelde aanhangwagens moeten bij dag, indien het zicht ernstig wordt belemmerd, en bij nacht achterlicht,
      verlichting van de achterkentekenplaat en het in het [Voertuigreglement][ref1] voorgeschreven stadslicht voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0006746
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0006746
  - number: '34'
    text: |-
      1 Bij mist, sneeuwval of regen, die het zicht ernstig belemmert, mogen bestuurders van een motorvoertuig en van een
      gehandicaptenvoertuig mistlicht aan de voorzijde voeren.

      2 Bij mist of sneeuwval, die het zicht beperkt tot een afstand van minder dan 50 meter mag mistachterlicht worden
      gevoerd.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel34
  - number: '35'
    text: |-
      Fietsers en bestuurders van een wagen moeten bij dag, indien het zicht ernstig wordt belemmerd, en bij nacht voor-
      en achterlicht voeren.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel35
  - number: '36'
    text: |-
      Ruiters en geleiders van rij- of trekdieren en vee moeten bij dag, indien het zicht ernstig wordt belemmerd, en bij
      nacht een lantaarn meevoeren die naar voren wit of geel licht en naar achteren rood licht moet stralen.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel36
  - number: '37'
    text: |-
      Door voetgangers gevormde kolonnes en optochten moeten buiten de bebouwde kom bij dag, indien het zicht ernstig
      wordt belemmerd, en bij nacht aan de linker voorzijde een naar alle zijden wit of geel licht uitstralende lantaarn
      en aan de linker achterzijde een naar alle zijden rood licht uitstralende lantaarn meevoeren.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel37
  - number: '38'
    text: |-
      Bestuurders van een motorvoertuig op meer dan twee wielen, die buiten de bebouwde kom stilstaan op de rijbaan en
      op langs autosnelwegen en autowegen gelegen parkeerstroken, parkeerhavens, vluchtstroken en vluchthavens moeten bij
      dag, indien het zicht ernstig wordt belemmerd, en bij nacht stadslicht en achterlicht voeren.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel38
  - number: '39'
    text: |-
      Stilstaande aanhangwagens moeten buiten de bebouwde kom op de rijbaan en op langs autosnelwegen en autowegen
      gelegen parkeerstroken, parkeerhavens, vluchtstroken en vluchthavens bij dag, indien het zicht ernstig wordt
      belemmerd, en bij nacht achterlicht en het in het [Voertuigreglement][ref1] voorgeschreven stadslicht voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0006746
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0006746
  - number: '40'
    text: |-
      Stilstaande wagens moeten buiten de bebouwde kom op de rijbaan bij dag, indien het zicht ernstig wordt belemmerd,
      en bij nacht voor- en achterlicht voeren.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel40
  - number: '41'
    text: |-
      Bestuurders van een motorvoertuig mogen tegelijk met dimlicht of mistlicht aan de voorzijde bermlicht, richtlicht
      of markeringslichten voeren.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel41
  - number: '42'
    text: |-
      1 Het gebruik van de autosnelweg is slechts toegestaan voor bestuurders van een motorvoertuig waarmee met een
      snelheid van ten minste 60 km per uur mag en kan worden gereden.

      2 Het gebruik van de autoweg is slechts toegestaan voor bestuurders van een motorvoertuig waarmee met een snelheid
      van ten minste 50 km per uur mag en kan worden gereden.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel42
  - number: '43'
    text: |-
      1 Het is de bestuurders verboden op een autosnelweg of autoweg hun voertuig te keren of achteruit te rijden.

      2 Het is de bestuurders voorts verboden op de rijbaan van een autosnelweg of autoweg hun voertuig te laten
      stilstaan.

      3 Behoudens in noodgevallen is het de weggebruikers verboden op een autosnelweg of autoweg gebruik te maken van de
      vluchtstrook, de vluchthaven of de berm.

      4 Op een autosnelweg is het bestuurders van een samenstel van voertuigen met een totale lengte van meer dan 7 meter
      en van een vrachtauto verboden op een rijbaan met drie of meer rijstroken enig andere dan de twee meest rechts
      gelegen rijstroken te gebruiken. Het verbod geldt niet voor het geval zij moeten voorsorteren.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel43
  - number: '44'
    text: Voetgangers mogen wegen gelegen binnen een erf over de volle breedte gebruiken.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel44
  - number: '45'
    text: Bestuurders mogen binnen een erf niet sneller rijden dan stapvoets.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel45
  - number: '46'
    text: |-
      1 Het is bestuurders van een motorvoertuig verboden binnen een erf te parkeren anders dan op parkeerplaatsen die
      als zodanig zijn aangeduid of aangegeven.

      2 Indien het erf tevens is aangeduid als parkeerschijf-zone, is ten aanzien van het parkeren van voertuigen
      [artikel 25][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel25
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '25'
        hoofdstuk: II
        paragraaf: '10'
  - number: '47'
    text: |-
      Het is bestuurders van een motorvoertuig en bromfietsers die de rijbaan volgen toegestaan vlak voor of op rotondes
      anders dan aan de rechterzijde van de rijbaan te rijden.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel47
  - number: '48'
    text: Het is bestuurders toegestaan vlak voor of op rotondes rechts in te halen.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel48
  - number: '49'
    text: |-
      1 Bestuurders moeten blinden, voorzien van een witte stok met één of meer rode ringen, en overigens alle personen
      die zich moeilijk voortbewegen, voor laten gaan.

      2 Bestuurders moeten voetgangers en bestuurders van een gehandicaptenvoertuig, die op een
      voetgangersoversteekplaats oversteken of kennelijk op het punt staan zulks te doen, voor laten gaan.

      3 Het tweede lid geldt niet voor bestuurders van een motorvoertuig dat behoort tot een militaire kolonne.

      4 Het tweede lid geldt evenmin, indien voor de voetgangers en de bestuurders van een gehandicaptenvoertuig een rood
      voetgangerslicht of een geel knipperlicht als bedoeld in [artikel 74, tweede lid][ref1], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel74
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '74'
        hoofdstuk: III
        paragraaf: '3'
  - number: '50'
    text: Weggebruikers moeten bestuurders van een voorrangsvoertuig voor laten gaan.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel50
  - number: '51'
    text: |-
      1 Het is verboden rij- of trekdieren of vee zonder toezicht op de weg los te laten lopen.

      2 Het eerste lid geldt niet ten aanzien van wegen die door het bevoegde gezag zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel51
  - number: '52'
    text: |-
      Bestuurders die een stilstaande tram of autobus willen voorbijrijden aan de zijde waar passagiers in- en
      uitstappen, moeten aan hen daartoe gelegenheid geven.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel52
  - number: '53'
    text: |-
      Het is bestuurders van een motorvoertuig verboden een ander motorvoertuig te slepen, indien de afstand van de
      achterzijde van het trekkende voertuig tot de voorzijde van het gesleepte voertuig meer dan vijf meter bedraagt.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel53
  - number: '54'
    text: |-
      Bestuurders die een bijzondere manoeuvre uitvoeren, zoals wegrijden, achteruitrijden, uit een uitrit de weg
      oprijden, van een weg een inrit oprijden, keren, van de invoegstrook de doorgaande rijbaan oprijden, van de
      doorgaande rijbaan de uitrijstrook oprijden en van rijstrook wisselen, moeten het overige verkeer voor laten gaan.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel54
  - number: '55'
    text: |-
      Bestuurders van een motorvoertuig respectievelijk bromfietsers moeten een teken met hun richtingaanwijzer geven
      respectievelijk een teken met hun richtingaanwijzer of met hun arm geven, indien zij willen wegrijden, andere
      bestuurders van een motorvoertuig willen inhalen, de doorgaande rijbaan willen oprijden en verlaten en indien zij
      van rijstrook willen wisselen alsmede bij alle andere belangrijke zijdelingse verplaatsingen.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel55
  - number: '56'
    text: |-
      1 Binnen de bebouwde kom moeten bestuurders aan bestuurders van een autobus de gelegenheid geven van een bushalte
      weg te rijden, wanneer de bestuurder van die autobus door het geven van een teken met zijn richtingaanwijzer zijn
      voornemen om weg te rijden kenbaar maakt.

      2 Het eerste lid geldt niet voor bestuurders van een motorvoertuig dat behoort tot een militaire kolonne.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel56
  - number: '57'
    text: |-
      Bestuurders van een motorvoertuig, bromfietsers en snorfietsers mogen met hun voertuig geen onnodig geluid
      veroorzaken.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel57
  - number: '58'
    text: |-
      1 Stilstaande motorvoertuigen op meer dan twee wielen en aanhangwagens moeten worden aangeduid door een
      gevarendriehoek, indien het voertuig een obstakel vormt dat door naderende bestuurders niet tijdig als zodanig kan
      worden opgemerkt.

      2 De gevarendriehoek moet goed zichtbaar op de weg worden geplaatst op een afstand van ongeveer 30 meter van het
      voertuig en in de richting van het verkeer waarvoor het voertuig gevaar oplevert.

      3 Het eerste lid geldt niet wanneer knipperend waarschuwingslicht wordt gevoerd.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel58
  - number: '59'
    text: |-
      1 Bestuurders van een motorvoertuig of bromfiets en de naast hen gezeten passagiers moeten gebruik maken van
      de voor hen beschikbare autogordel. Naast de bestuurder gezeten passagiers jonger dan 12 jaren die korter zijn
      dan 1.50 meter moeten gebruik maken van een voor hen geschikt kinderbeveiligingssysteem dat is voorzien van een
      goedkeuringsmerk als bedoeld in [artikel 22, vierde lid, van de wet][ref1].

      2 Andere dan de in het eerste lid bedoelde passagiers moeten eveneens gebruik maken van de voor hen beschikbare
      autogordel. Indien deze passagiers jonger zijn dan twaalf jaren en korter zijn dan 1.50 meter, moeten zij gebruik
      maken van een voor hen geschikt kinderbeveiligingssysteem als bedoeld in het eerste lid, indien dit aanwezig is.
      Indien een dergelijk kinderbeveiligingssysteem niet aanwezig is, moeten passagiers van 3 tot 12 jaren die korter
      zijn dan 1.50 meter gebruik maken van de voor hen beschikbare autogordel. Passagiers van 0 tot 3 jaren behoeven
      alsdan geen beveiligingsmiddel te gebruiken.

      3 Bestuurders en passagiers die korter zijn dan 1.50 meter en die gebruik moeten maken van de autogordel mogen een
      driepuntsgordel gebruiken als heupgordel.

      4 Het is bestuurders verboden passagiers jonger dan twaalf jaren te vervoeren op een andere wijze dan in dit
      artikel is voorgeschreven.

      5 Het eerste lid geldt niet voor bestuurders tijdens het vervoer van passagiers tegen vergoeding in de zin van de
      [Wet personenvervoer 2000][ref2].

      6 Het eerste en het tweede lid gelden niet voor personen woonachtig in het buitenland die overeenkomstig de
      aldaar geldende wettelijke voorschriften van de verplichting tot het gebruik maken van een beveiligingsmiddel zijn
      vrijgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0011470
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0011470
  - number: '60'
    text: |-
      1 De bestuurder en de passagiers van bromfietsen, motorfietsen en driewielige motorvoertuigen moeten een goed
      passende helm dragen, die door middel van een sluiting op deugdelijke wijze op het hoofd is bevestigd en die is
      voorzien van een goedkeuringsmerk als bedoeld in [artikel 22, vierde lid, van de wet][ref1].

      2 Het eerste lid geldt niet voor:

      a. de bestuurder en de passagiers van een snorfiets;

      b. de bestuurder en de achter hem zittende passagier van een brombakfiets;

      c. de bestuurder of de passagier van een door de Dienst Wegverkeer aangewezen type bromfiets, niet zijnde
      een brommobiel, of motorfiets van wie de zitplaats beschermd wordt door een veiligheidscel en voorzien is van
      autogordels. Bij de aanwijzing kan onderscheid gemaakt worden tussen de bestuurder en de passagiers ten aanzien
      van de gelding van het eerste lid. Bij ministeriële regeling worden regels gesteld betreffende de eisen waaraan een
      type bromfiets of motorfiets moet voldoen om te kunnen worden aangewezen. Deze regels zien in elk geval op de eisen
      die gesteld worden aan de veiligheidscel en de autogordels;

      d. de bestuurder en de passagiers van een brommobiel met een gesloten carrosserie;

      e. de bestuurder of de passagiers van een brommobiel zonder gesloten carrosserie of een driewielig
      motorvoertuig, van wie de zitplaats in deze brommobiel of dat motorvoertuig is voorzien van bevestigingspunten
      voor autogordels overeenkomstig het bepaalde in [richtlijn 97/24/EG](31997L0024), zoals deze gold op de
      datum waarop het voertuig in gebruik is genomen, en van autogordels die voorzien zijn van een krachtens
      [artikel 5.2.47, zesde lid, van het Voertuigreglement][ref2] vastgesteld goedkeuringsmerk.

      3 Het is bestuurders verboden passagiers beneden de twaalf jaren te vervoeren op een andere wijze dan in dit
      artikel is voorgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel5.2.47
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0006746
        artikel: 5.2.47
  - number: '61'
    text: |-
      Fietsers en bromfietsers mogen slechts kinderen beneden acht jaren vervoeren indien zij zijn gezeten op een
      doelmatige en veilige zitplaats met voldoende steun voor rug, handen en voeten.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel61
  - number: 61a
    text: |-
      Het is degene die een motorvoertuig, bromfiets of invalidenvoertuig bestuurt verboden tijdens het rijden een
      mobiele telefoon vast te houden.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel61a
  - number: '62'
    text: Weggebruikers zijn verplicht gevolg te geven aan de verkeerstekens die een gebod of verbod inhouden.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel62
  - number: '63'
    text: Verkeerstekens gaan boven verkeersregels, voor zover deze regels onverenigbaar zijn met deze tekens.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel63
  - number: 63a
    text: |-
      Verkeerstekens die een maximumsnelheid aanduiden gaan niet boven de in de [artikelen 20, onderdeel b][ref1],
      [21, onderdeel b][ref2], en [22][ref3], vastgestelde maximumsnelheden en de ingevolge een ministeriële regeling
      krachtens [artikel 86a][ref4] geldende maximumsnelheid, en de in [artikel 45][ref5] aangegeven snelheid, voor zover
      deze tekens een hogere maximumsnelheid aanduiden.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0004825#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0004825#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0004825#Artikel86a
      [ref5]: https://wetten.overheid.nl/BWBR0004825#Artikel45
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel63a
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '20'
        hoofdstuk: II
        paragraaf: '8'
      - id: ref2
        bwb_id: BWBR0004825
        artikel: '21'
        hoofdstuk: II
        paragraaf: '8'
      - id: ref3
        bwb_id: BWBR0004825
        artikel: '22'
        hoofdstuk: II
        paragraaf: '8'
      - id: ref4
        bwb_id: BWBR0004825
        artikel: 86a
        hoofdstuk: VA
      - id: ref5
        bwb_id: BWBR0004825
        artikel: '45'
        hoofdstuk: II
        paragraaf: '17'
  - number: '64'
    text: Verkeerslichten gaan boven verkeerstekens die de voorrang regelen.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel64
  - number: '65'
    text: |-
      1 Ingeval een weg is verdeeld in rijstroken, kan de toepassing van een verkeersbord worden beperkt tot één of meer
      rijstroken.

      2 De verkeersborden E1, E2 en E3 van [bijlage I][ref1] gelden slechts voor de zijde van de weg alwaar zij zijn
      geplaatst.

      3 Het parkeren van een voertuig en het plaatsen van een fiets en van een bromfiets is echter toegestaan op de
      daartoe bestemde weggedeelten.


      [ref1]: https://wetten.overheid.nl/BWBR0004825
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0004825
  - number: '66'
    text: |-
      1 Indien boven een verkeersbord het woord «zone» is aangebracht en een aanduiding van het gebied van de zone is
      toegevoegd, geldt het verkeersbord in het aldus aangeduide gebied.

      2 Indien boven een verkeersbord het woord «zone» is aangebracht zonder aanduiding van het gebied van de zone,
      geldt het verkeersbord in een gebied dat wordt begrensd door het verkeersbord en een of meer in samenhang met dat
      verkeersbord geplaatste borden waarmee het einde van de zone wordt aangeduid.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing, als bord E 10 van [bijlage 1][ref1] is geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0004825
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0004825
  - number: '67'
    text: |-
      1 Onder verkeersborden aangebrachte onderborden kunnen inhouden:

      a. een nadere uitleg van het verkeersbord;

      b. ingeval op een onderbord uitsluitend symbolen voorkomen: het verkeersbord geldt slechts voor de aldus aangeduide
      weggebruikers of het aldus aangeduide verkeersgedrag;

      c. ingeval op een onderbord het woord "uitgezonderd" in combinatie met symbolen voorkomt: het verkeersbord geldt
      niet voor de aldus aangeduide weggebruikers of het aldus aangeduide verkeersgedrag.

      2 Indien het beoogde verkeersgedrag wordt aangegeven door middel van teksten of tekens al dan niet in combinatie
      met symbolen, blijkt het beoogde verkeersgedrag uit het onderbord.

      3 Symbolen op onderborden hebben dezelfde betekenis als die welke in [bijlage 1][ref1] zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004825
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0004825
  - number: '68'
    text: |-
      1 Bij driekleurige verkeerslichten betekent:

      a. groen licht: doorgaan;

      b. geel licht: stop; voor bestuurders die het teken zo dicht genaderd zijn dat stoppen redelijkerwijs niet meer
      mogelijk is: doorgaan;

      c. rood licht: stop.

      2 Indien in een driekleurig verkeerslicht of in een daaraan toegevoegd éénkleurig verkeerslicht een verlichte pijl
      zichtbaar is, geldt het licht uitsluitend voor de door de pijl aangegeven richting.

      3 Indien een verlichte afbeelding van een fiets zichtbaar is, geldt het licht voor fietsers, bromfietsers op een
      fiets/bromfietspad en bestuurders van een gehandicaptenvoertuig.

      4 Bestuurders van een motorvoertuig dat behoort tot een militaire kolonne die het verkeerslicht bij groen licht is
      begonnen te passeren, mogen blijven doorgaan ook nadat een andere kleur licht zichtbaar is geworden.

      5 Indien onder of bij een driekleurig verkeerslicht een bord is geplaatst met de tekst «Rechtsaf voor
      (brom)fietsers vrij» respectievelijk« Rechtsaf voor fietsers vrij» gelden het gele en het rode licht niet voor
      rechts afslaande fietsers, bromfietsers en bestuurders van een gehandicaptenvoertuig respectievelijk voor fietsers
      en bestuurders van een gehandicaptenvoertuig.

      6 Zij dienen alsdan het overige verkeer ter plaatse voor te laten gaan.

      7 Ingeval een weg is verdeeld in rijstroken met verkeer in dezelfde richting, kan de toepassing van een
      verkeerslicht worden beperkt tot één van deze rijstroken. In dat geval heeft het verkeerslicht slechts betrekking
      op het verkeer op de aangeduide rijstrook.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel68
  - number: '69'
    text: |-
      1 Bij tweekleurige verkeerslichten betekent:

      a. geel licht: stop; voor bestuurders die het licht zo dicht genaderd zijn dat stoppen redelijkerwijs niet meer
      mogelijk is: doorgaan;

      b. rood licht: stop.

      2 Het tweede tot en met zevende lid van [artikel 68][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel68
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '68'
        hoofdstuk: III
        paragraaf: '3'
  - number: '70'
    text: |-
      1 Bij tram/buslichten betekent:

      a. wit licht of wit knipperlicht: doorgaan;

      b. geel licht: stop; voor bestuurders die het licht zo dicht genaderd zijn dat stoppen redelijkerwijs niet meer
      mogelijk is: doorgaan;

      c. rood licht: stop.

      2 Het witte licht en het witte knipperlicht gelden slechts voor de aangegeven richtingen.

      3 De tram/buslichten gelden voor bestuurders van een tram en van een lijnbus, die de richting volgen waarop het
      licht betrekking heeft.

      4 De tram/buslichten gelden tevens voor bestuurders van een autobus, niet zijnde een lijnbus, die een busbaan of
      een busstrook gebruiken waarop het licht betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel70
  - number: '71'
    text: |-
      Bij overweglichten betekent:

      a. wit knipperlicht: er nadert geen trein;

      b. rood knipperlicht: stop.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel71
  - number: '72'
    text: 'Bij bruglichten betekent rood licht of rood knipperlicht: stop.'
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel72
  - number: '73'
    text: |-
      Bij rijstrooklichten betekent:

      a. groene pijl of maximumsnelheid, aangeduid door bord A3 van [bijlage I][ref1]: de rijstrook mag worden gebruikt;

      b. rood kruis: de rijstrook mag niet worden gebruikt;

      c. witte pijl: voorwaarschuwing rood kruis;

      d. het woord «BUS»: de rijstrook mag slechts gebruikt worden door bestuurders van een lijnbus en bestuurders van
      een autobus;

      e. het woord «LIJNBUS»: de rijstrook mag slechts worden gebruikt door bestuurders van een lijnbus.


      [ref1]: https://wetten.overheid.nl/BWBR0004825
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0004825
  - number: '74'
    text: |-
      1 Bij voetgangerslichten betekent:

      a. groen licht: voetgangers mogen oversteken;

      b. groen knipperend licht: voetgangers mogen oversteken; het rode licht verschijnt spoedig;

      c. rood licht: voetgangers mogen niet meer beginnen over te steken; reeds overstekende voetgangers moeten zo snel
      mogelijk doorlopen.

      2 Indien het rode licht is vervangen door een geel knipperlicht als bedoeld in [artikel 75][ref1], mogen
      voetgangers oversteken, mits zij het overige verkeer ter plaatse voor laten gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel75
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '75'
        hoofdstuk: III
        paragraaf: '3'
  - number: '75'
    text: 'Geel knipperlicht betekent: gevaarlijk punt; voorzichtigheid geboden.'
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel75
  - number: '76'
    text: |-
      Een doorgetrokken streep heeft de volgende betekenis:

      a. indien de streep zich bevindt tussen rijstroken dan wel op paden, met verkeer in beide richtingen: bestuurders
      mogen de streep niet naar links overschrijden en zich niet links van de streep bevinden, tenzij aan de rechter
      zijde van de doorgetrokken streep een onderbroken streep is aangebracht;

      b. indien de streep zich bevindt tussen rijstroken dan wel op paden, voor verkeer in één richting: bestuurders
      mogen de streep niet overschrijden, tenzij tussen de bestuurder en de doorgetrokken streep een onderbroken streep
      is aangebracht;

      c. indien de streep zich bevindt tussen naast de spitsstrook gelegen rijstroken en spitsstroken: de bestuurders
      mogen de doorgetrokken streep overschrijden.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel76
  - number: '77'
    text: Bestuurders mogen verdrijvingsvlakken niet gebruiken.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel77
  - number: '78'
    text: |-
      Bestuurders van een motorvoertuig en bromfietsers die de rijbaan volgen zijn verplicht op een kruispunt de richting
      te volgen die de voorsorteerstrook waarop zij zich bevinden aangeeft.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel78
  - number: '79'
    text: |-
      Bestuurders moeten voor een voor hen bestemde stopstreep stoppen, indien stoppen op grond van dit besluit is
      verplicht.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel79
  - number: '80'
    text: |-
      Haaietanden hebben de volgende betekenis: de bestuurders moeten voorrang verlenen aan bestuurders op de kruisende
      weg.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel80
  - number: '81'
    text: |-
      Busbanen en busstroken waarop het woord «BUS» is aangebracht mogen slechts worden gebruikt door bestuurders van
      een lijnbus en bestuurders van een autobus. Busbanen en busstroken waarop het woord «LIJNBUS» is aangebracht mogen
      slechts worden gebruikt door bestuurders van een lijnbus.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel81
  - number: '82'
    text: |-
      1 Weggebruikers zijn verplicht de aanwijzingen op te volgen die mondeling of door middel van gebaren worden gegeven
      door:

      a. de daartoe bevoegde en als zodanig kenbare ambtenaren,

      b. de militairen van de Koninklijke Marechaussee voor zover niet behorend tot de in onderdeel a bedoelde ambtenaren
      en

      c. de daartoe bevoegde en als zodanig kenbare verkeersregelaars.

      2 Bij het geven van aanwijzingen door middel van gebaren worden, voor zover mogelijk, de in bijlage II vastgestelde
      aanwijzingen gegeven.

      3 Bestuurders zijn tevens verplicht de in [bijlage II, onderdeel 8][ref1], vastgestelde aanwijzing om te stoppen op
      te volgen die wordt gegeven door daartoe bevoegde en als zodanig kenbare verkeersbrigadiers.

      4 Weggebruikers zijn voorts verplicht te stoppen indien hen door een begeleider van een railvoertuig een stopteken
      volgens model F10 van [bijlage 1][ref2], een rode vlag of een rode lamp wordt getoond.


      [ref1]: https://wetten.overheid.nl/BWBR0004825
      [ref2]: https://wetten.overheid.nl/BWBR0004825
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0004825
      - id: ref2
        bwb_id: BWBR0004825
  - number: '83'
    text: |-
      Weggebruikers zijn voorts verplicht te stoppen indien hen een stopteken wordt getoond dat bestaat uit een rode lamp
      dan wel uit een aan een politievoertuig aangebrachte transparant, waarin de woorden "stop" of "stop politie" in
      rode letters tegen donkere achtergrond worden verlicht.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel83
  - number: '84'
    text: Aanwijzingen gaan boven verkeerstekens en verkeersregels.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel84
  - number: '85'
    text: |-
      1 Op bestuurders van een motorvoertuig op meer dan twee wielen waarin op de door Onze Minister voorgeschreven
      wijze een geldige en behoorlijk leesbare gehandicaptenparkeerkaart is aangebracht, zijn [artikel 25][ref1] en,
      indien niet langer wordt geparkeerd dan drie uren, de [artikelen 24, eerste lid, onderdeel e][ref2], [46][ref3] en
      [62][ref4], voor zover het betreft bord E1 van [bijlage 1][ref5], niet van toepassing.

      2 Op bestuurders van gehandicaptenvoertuigen, zijn [artikel 25][ref6] en, indien niet langer wordt geparkeerd dan
      drie uren, de [artikelen 24, eerste lid, onderdeel e][ref7], en [62][ref8], voor zover het betreft bord E1 van
      [bijlage 1][ref9], niet van toepassing.

      3 In de gevallen, waarin niet langer dan drie uren mag worden geparkeerd, moet het motorvoertuig overeenkomstig
      het bij ministeriële regeling bepaalde zijn voorzien van een duidelijk zichtbare parkeerschijf waarop het tijdstip
      staat aangegeven waarop met parkeren is begonnen.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0004825#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0004825#Artikel46
      [ref4]: https://wetten.overheid.nl/BWBR0004825#Artikel62
      [ref5]: https://wetten.overheid.nl/BWBR0004825
      [ref6]: https://wetten.overheid.nl/BWBR0004825#Artikel25
      [ref7]: https://wetten.overheid.nl/BWBR0004825#Artikel24
      [ref8]: https://wetten.overheid.nl/BWBR0004825#Artikel62
      [ref9]: https://wetten.overheid.nl/BWBR0004825
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '25'
        hoofdstuk: II
