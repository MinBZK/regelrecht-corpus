        artikel: '149'
  - number: '91'
    text: |-
      Bestuurders van een voorrangsvoertuig mogen afwijken van de voorschriften van dit besluit voor zover de uitoefening
      van hun taak dit vereist.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel91
  - number: '92'
    text: |-
      1 Overtreding van de [artikelen 3 tot en met 12][ref1], [14 tot en met 27][ref2], [31 tot en met 43][ref3],
      [45][ref4], [46][ref5], [49 tot en met 61a][ref6], [62][ref7], met uitzondering van verkeersbord C22 van
      [bijlage 1][ref8], [68, zesde lid][ref9], [74, tweede lid][ref10], [82][ref11], [83][ref12] en [86b][ref13] is een
      strafbaar feit.

      2 Bij de veroordeling van de bestuurder van een motorvoertuig, een bromfietser of een snorfietser wegens een
      overtreding als bedoeld in het eerste lid kan hem de bevoegdheid om motorvoertuigen, bromfietsen en snorfietsen te
      besturen voor ten hoogste twee jaren worden ontzegd.


