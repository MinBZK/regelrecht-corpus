preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 12 mei 1989, nr. RW 26148, Hoofddirectie van de
    Waterstaat, Hoofdafdeling Bestuurlijke en Juridische Zaken;

    Gelet op artikel 2 en 34 van de Wegenverkeerswet (Stb. 1935, 554);

    Gelet op het op 8 november 1968 te Wenen tot stand gekomen Verdrag inzake het wegverkeer (Trb. 1974, 35), het op 8
    november 1968 te Wenen tot stand gekomen Verdrag inzake verkeerstekens (Trb. 1974, 36), de op 1 mei 1971 te Genève
    tot stand gekomen Europese Overeenkomst tot aanvulling van het Verdrag inzake het wegverkeer dat op 8 november
    1968 te Wenen voor ondertekening werd opengesteld (Trb. 1974, 37), de op 1 mei 1971 te Genève tot stand gekomen
    Europese Overeenkomst tot aanvulling van het Verdrag inzake verkeerstekens dat op 8 november 1968 te Wenen voor
    ondertekening werd opengesteld (Trb. 1974, 38) en het op 1 maart 1973 te Genève tot stand gekomen Protocol inzake
    tekens op het wegdek, aanvulling op de Europese Overeenkomst tot aanvulling van het Verdrag inzake verkeerstekens
    dat op 8 november 1968 te Wenen voor ondertekening werd opengesteld (Trb. 1975, 114);

    De Raad van State gehoord (advies van 2 maart 1990, nr. W09.89.0262);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 16 juli 1990, nr. RW65898, Hoofddirectie
    van de Waterstaat, Hoofdafdeling Bestuurlijke en Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. aanhangwagens: voertuigen die door een voertuig worden voortbewogen of kennelijk bestemd zijn om aldus te worden
      voortbewogen, alsmede opleggers;

      b. autobus: motorvoertuig, ingericht voor het vervoer van meer dan acht personen, de bestuurder daaronder niet
      begrepen;

      c. autosnelweg: weg, aangeduid door bord G1 van [bijlage I][ref1]; langs autosnelwegen gelegen parkeerplaatsen,
      tankstations en bushalteplaatsen maken geen deel van de autosnelweg uit;

      d. autoweg: weg, aangeduid door bord G3 van [bijlage I][ref2]; langs autowegen gelegen parkeerplaatsen,
      tankstations en bushalteplaatsen maken geen deel van de autoweg uit;

      e. bestemmingsverkeer: bestuurders wier reisdoel één of meer bepaalde percelen betreft die zijn gelegen aan
      of in de directe nabijheid van een weg met een door verkeerstekens aangegeven geslotenverklaring voor bepaalde
      categorieën bestuurders en die slechts via deze weg zijn te bereiken alsmede bestuurders van lijnbussen;

      f. bestuurder van een motorvoertuig:

      1. hij die het motorvoertuig bestuurt of

      2. voor zover het betreft een motorvoertuig voor het besturen waarvan een rijbewijs B, C, D of E is vereist
      en dat is voorzien van een dubbele bediening, hij die rijonderricht geeft of toezicht houdt in het kader van
      een vanwege de overheid ingesteld onderzoek naar de rijvaardigheid, niet zijnde een onderzoek als bedoeld in
      [artikel 131, eerste lid, van de wet][ref3];

      g. bestuurders: alle weggebruikers behalve voetgangers;

      h. bevoegd gezag: gezag als bedoeld in [artikel 18, eerste lid, van de wet][ref4];

      ha. brombakfiets: bromfiets op drie symmetrisch geplaatste wielen, met twee voorwielen met een diameter van meer
      dan 0,60 m, uitsluitend ingericht voor het vervoer van de bestuurder en van goederen en eventueel van een achter de
      bestuurder gezeten passagier;

      i. bromfiets: voertuig op twee of drie wielen, met een door de constructie bepaalde maximumsnelheid van
      niet meer dan 45 km per uur, uitgerust met een verbrandingsmotor met een cylinderinhoud van ten hoogste
      50 cm3 of met een elektromotor, en niet zijnde een gehandicaptenvoertuig; voertuigen die op de krachtens
      [artikel 5.6.1, tweede lid, van het Voertuigreglement][ref5] vastgestelde wijze zijn voorzien van één of twee
      in dat artikel bedoelde gele platen of gele vlakken, worden voor de toepassing van dit besluit gelijkgesteld met
      bromfietsen; onder bromfietsen worden mede verstaan vierwielige voertuigen:

      a. met een ledige massa van minder dan 350 kg, de massa van de batterijen in elektrische voertuigen niet
      inbegrepen,

      b. met een door de constructie bepaalde maximumsnelheid van niet meer dan 45 km per uur en

      c. uitgerust met een verbrandingsmotor met elektrische ontsteking met een cylinderinhoud van ten hoogste 50 cm3 of
      uitgerust met een ander type motor met een netto maximum vermogen van ten hoogste 4 kW;

      ia. brommobiel: bromfiets op meer dan twee wielen, die is voorzien van een carrosserie;

      j. busbaan: rijbaan waarop het woord «BUS» of «LIJNBUS» is aangebracht;

      k. busstrook: door doorgetrokken of onderbroken strepen gemarkeerd gedeelte van de rijbaan waarop het woord «BUS»
      of «LIJNBUS» is aangebracht;

      l. dag: de periode tussen zonsopgang en zonsondergang;

      m. doorgaande rijbaan: rijbaan zonder de invoeg- en uitrijstroken;

      ma. driewielig motorvoertuig: driewielig motorrijtuig als bedoeld in
      __REF000___________________________________________________________________________________________________________
      _;

      n. fietsstrook: door doorgetrokken of onderbroken strepen gemarkeerd gedeelte van de rijbaan waarop afbeeldingen
      van een fiets zijn aangebracht;

      o. geslotenverklaring: verbod de betrokken weg in te rijden of in te gaan alsmede de betrokken weg te gebruiken;

      p. haaietanden: voorrangsdriehoeken op het wegdek;

      q.

      r. gehandicaptenvoertuig: voertuig dat is ingericht voor het vervoer van een gehandicapte, niet breder is dan
      1,10 meter en niet is uitgerust met een motor, dan wel is uitgerust met een motor waarvan de door de constructie
      bepaalde maximumsnelheid niet meer dan 45 km per uur bedraagt, en geen bromfiets is;

      s. invoegstrook: door een blokmarkering van de doorgaande rijbaan afgescheiden weggedeelte dat is bestemd voor
      bestuurders die de doorgaande rijbaan oprijden;

      t. kruispunt: kruising of splitsing van wegen;

      u.

      v. lijnbus: motorvoertuig, gebezigd voor het verrichten van openbaar vervoer in de zin van de
      [Wet personenvervoer 2000][ref7];

      w.

      x. militaire kolonne: een aantal zich achter elkaar bevindende militaire dan wel bij een onderdeel van de
      rampenbestrijdingsorganisatie in gebruik zijnde motorvoertuigen, onder één commandant, die de door Onze Minister in
      overeenstemming met Onze Minister van Defensie vastgestelde herkenningstekens voeren;

      y. motorfiets: motorvoertuig op twee wielen al dan niet met zijspan- of aanhangwagen;

      z. motorvoertuigen: alle gemotoriseerde voertuigen behalve bromfietsen en gehandicaptenvoertuigen, bestemd om
      anders dan langs rails te worden voortbewogen;

      aa. nacht: de periode tussen zonsondergang en zonsopgang;

      aab. overweg: kruising van een weg en een railweg die wordt aangeduid door middel van bord J12 of J13 van
      [bijlage 1][ref8];

      ab. parkeerhaven of parkeerstrook: langs de rijbaan gelegen verharding die is bestemd voor stilstaande of
      geparkeerde voertuigen;

      ac. parkeren: het laten stilstaan van een voertuig anders dan gedurende de tijd die nodig is voor en gebruikt wordt
      tot het onmiddellijk in- of uitstappen van passagiers of voor het onmiddellijk laden of lossen van goederen;

      ad. rijbaan: elk voor rijdende voertuigen bestemd weggedeelte met uitzondering van de fietspaden en de fiets/
      bromfietspaden;

      ae. rijstrook: door doorgetrokken of onderbroken strepen gemarkeerd gedeelte van de rijbaan van zodanige breedte
      dat bestuurders van motorvoertuigen op meer dan twee wielen daarvan gebruik kunnen maken;

      af. snorfiets: bromfiets die blijkens een daarop aangebracht merk als bedoeld in
      [artikel 5.6.1, eerste lid, van het Voertuigreglement][ref9] is geconstrueerd voor een
      maximumsnelheid die niet meer bedraagt dan 25 km per uur; voertuigen, die op de krachtens
      [artikel 5.6.1, tweede lid, van het Voertuigreglement][ref10] vastgestelde wijze zijn voorzien van één of twee in
      dat artikel bedoelde oranje platen of oranje vlakken worden voor de toepassing van dit besluit gelijkgesteld met
      snorfietsen;

      afa. spitsstrook: de vluchtstrook die als rijstrook is aangewezen blijkens bord C23-01 van [bijlage 1][ref11];

      ag. uitrijstrook: door een blokmarkering van de doorgaande rijbaan afgescheiden weggedeelte dat is bestemd voor
      bestuurders die de doorgaande rijbaan verlaten;

      ah. veiligheidscel: onderdeel van de constructie van een bromfiets, een motorfiets of een driewielig motorvoertuig
      dat de bestuurder of passagiers beschermt tegen hoofdletsel;

      ai. verdrijvingsvlak: gedeelte van de rijbaan waarop schuine strepen zijn aangebracht;

      aj. verkeer: alle weggebruikers;

      ak. vluchthaven of vluchtstrook: door een doorgetrokken streep van de rijbaan van de autosnelweg of autoweg
      afgescheiden weggedeelte, dat bestemd is voor gebruik in noodgevallen, behoudens voor de duur van openstelling
      als spitsstrook;

      al. voertuigen: fietsen, bromfietsen, gehandicaptenvoertuigen, motorvoertuigen, trams en wagens;

      am. voorrang verlenen: het de betrokken bestuurders in staat stellen ongehinderd hun weg te vervolgen;

      an. voorrangsvoertuig: motorvoertuig dat de optische en geluidssignalen voert als bedoeld in artikel 29;

      ao. vrachtauto: motorvoertuig, niet ingericht voor het vervoer van personen, waarvan de toegestane maximum massa
      meer bedraagt dan 3500 kg;

      ap. weggebruikers: voetgangers, fietsers, bromfietsers, bestuurders van een gehandicaptenvoertuig, van een
      motorvoertuig of van een tram, ruiters, geleiders van rij- of trekdieren of vee en bestuurders van een bespannen of
      onbespannen wagen;

      aq. wet: [Wegenverkeerswet 1994][ref12].


