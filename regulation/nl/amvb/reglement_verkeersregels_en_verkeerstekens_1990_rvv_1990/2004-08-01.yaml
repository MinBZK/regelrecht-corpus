  - number: '86'
    text: |-
      Met een gehandicaptenparkeerkaart worden gelijkgesteld de door het daartoe bevoegde gezag buiten Nederland
      afgegeven parkeerkaarten voor gehandicapten, voor zover deze bij ministeriële regeling zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel86
  - number: 86a
    text: |-
      1 In geval van een ernstige verstoring van de olie-aanvoer kan bij regeling van Onze Minister worden bepaald dat op
      autosnelwegen en op autowegen, in afwijking van [artikel 21, aanhef en onder a][ref1], voor motorvoertuigen, niet
      zijnde vrachtauto's, autobussen of motorvoertuigen met aanhangwagen, een maximumsnelheid geldt van 90 km per uur.

      2 Onze Minister stelt de regeling, als bedoeld in het eerste lid, vast in overeenstemming met Onze Ministers van
      Justitie en van Economische Zaken.

      3 De regeling, als bedoeld in het eerste lid, vervalt uiterlijk met ingang van de eerste dag van de vijfde
      kalendermaand na het tijdstip van inwerkingtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel21
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel86a
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '21'
        hoofdstuk: II
        paragraaf: '8'
  - number: 86b
    text: |-
      Het is bestuurders van motorvoertuigen, niet zijnde vrachtauto's, autobussen of motorvoertuigen met aanhangwagen,
      verboden de ingevolge [artikel 86a][ref1] bepaalde maximumsnelheid te overschrijden.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel86a
    url: https://wetten.overheid.nl/BWBR0004825/2004-08-01#Artikel86b
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: 86a
        hoofdstuk: VA
  - number: '87'
    text: |-
      Door het bevoegd gezag kan ontheffing worden verleend van de [artikelen 3, eerste lid][ref1], [4][ref2],
      [5, eerste en tweede lid][ref3], [6, eerste, tweede en derde lid][ref4], [8][ref5], [10][ref6],
      [23, eerste lid][ref7], [24][ref8], [25][ref9], [26][ref10], [42][ref11], [43][ref12], [46][ref13], [53][ref14],
      alsmede [artikel 62][ref15] voor zover het betreft de verkeerstekens C1, C2, C4, C6 tot en met C21, D2, D4 tot en
      met D7, E1 tot en met E3, F7 en de verkeerstekens genoemd in de [artikelen 73][ref16], [76][ref17], [77][ref18],
      [78][ref19], [81][ref20] en [98][ref21].


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004825#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0004825#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0004825#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0004825#Artikel8
      [ref6]: https://wetten.overheid.nl/BWBR0004825#Artikel10
      [ref7]: https://wetten.overheid.nl/BWBR0004825#Artikel23
      [ref8]: https://wetten.overheid.nl/BWBR0004825#Artikel24
      [ref9]: https://wetten.overheid.nl/BWBR0004825#Artikel25
      [ref10]: https://wetten.overheid.nl/BWBR0004825#Artikel26
