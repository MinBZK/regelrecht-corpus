  - number: '92'
    text: |-
      1 Overtreding van de [artikelen 3 tot en met 12][ref1], [14 tot en met 27][ref2], [30, eerste lid][ref3],
      [31 tot en met 43][ref4], [45][ref5], [46][ref6], [49 tot en met 61b][ref7], [62][ref8], met uitzondering van
      verkeersbord C22 van [bijlage 1][ref9], [68, zesde lid][ref10], [74, tweede lid][ref11], [82][ref12], [82a][ref13],
      [83][ref14] en [86b][ref15] is een strafbaar feit.

      2 Bij de veroordeling van de bestuurder van een motorvoertuig, een bromfietser of een snorfietser wegens een
      overtreding als bedoeld in het eerste lid kan hem de bevoegdheid om motorvoertuigen, bromfietsen en snorfietsen te
      besturen voor ten hoogste twee jaren worden ontzegd.


