  - number: '2'
    text: |-
      1 De regels van dit besluit betreffende voetgangers zijn mede van toepassing op bestuurders van een
      gehandicaptenvoertuig, indien zij van een voetpad of trottoir gebruik maken of van het ene naar het andere voetpad
      of trottoir oversteken.

      2 De regels van dit besluit betreffende voetgangers zijn voorts mede van toepassing op personen die te voet een
      motorfiets, bromfiets of fiets aan de hand meevoeren, alsmede op personen die zich verplaatsen met behulp van
      voorwerpen, niet zijnde voertuigen.

      3 De regels van dit besluit betreffende wagens zijn mede van toepassing op door voetgangers gevormde colonnes,
      optochten en uitvaartstoeten voor zover deze de rijbaan volgen.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel2
  - number: 2a
    text: |-
      De regels van dit besluit betreffende motorvoertuigen en bestuurders en passagiers van motorvoertuigen zijn, in
      plaats van de regels betreffende bromfietsen, bromfietsers en passagiers van bromfietsen, mede van toepassing op
      brommobielen en bestuurders en passagiers van brommobielen, tenzij anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel2a
  - number: 2b
    text: |-
      De regels van dit besluit betreffende fietsen en fietsers zijn, in plaats van de regels betreffende bromfietsen en
      bromfietsers, mede van toepassing op snorfietsen en snorfietsers, tenzij anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel2b
  - number: '3'
    text: |-
      1 Bestuurders zijn verplicht zoveel mogelijk rechts te houden.

      2 Fietsers mogen met zijn tweeën naast elkaar rijden. Dit geldt niet voor snorfietsers.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel3
  - number: '4'
    text: |-
      1 Voetgangers gebruiken het trottoir of het voetpad.

      2 Zij gebruiken het fietspad of het fiets/bromfietspad indien trottoir en voetpad ontbreken.

      3 Zij gebruiken de berm of de uiterste zijde van de rijbaan, indien ook een fietspad of een fiets/bromfietspad
      ontbreekt.

      4 In afwijking van het eerste en het tweede lid gebruiken personen die zich verplaatsen met behulp van voorwerpen,
      niet zijnde voertuigen, het fietspad, het fiets/bromfietspad, het trottoir of het voetpad. Zij gebruiken de rijbaan
      indien een fietspad, een fiets/bromfietspad, een trottoir of een voetpad ontbreekt.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel4
  - number: '5'
    text: |-
      1 Fietsers gebruiken het verplichte fietspad of het fiets/bromfietspad.

      2 Zij gebruiken de rijbaan indien een verplicht fietspad of een fiets/bromfietspad ontbreekt.

      3 Zij mogen het onverplichte fietspad gebruiken. Bestuurders van snorfietsen uitgerust met een verbrandingsmotor
      mogen het onverplichte fietspad slechts gebruiken met uitgeschakelde motor.

      4 Bestuurders van fietsen op meer dan twee wielen die met inbegrip van de lading breder zijn dan 0,75 meter en van
      fietsen met aanhangwagen die met inbegrip van de lading breder zijn dan 0,75 meter mogen de rijbaan gebruiken.

      5 Bestuurders vanaf 16 jaar van snorfietsen als bedoeld in
      [artikel 1, eerste lid, onderdeel e, subonderdeel d, van de wet][ref1] mogen het trottoir en het voetpad gebruiken
      indien zij beschikken over een gehandicaptenparkeerkaart of een bij ministeriële regeling aangewezen kaart ten
      behoeve van het vervoer van gehandicapten.

      6 Bestuurders jonger dan 16 jaar van snorfietsen als bedoeld in
      [artikel 1, eerste lid, onderdeel e, subonderdeel d, van de wet][ref2] gebruiken het trottoir of het voetpad indien
      zij beschikken over een gehandicaptenparkeerkaart of een bij ministeriële regeling aangewezen kaart ten behoeve van
      het vervoer van gehandicapten.

      7 Het eerste lid, het tweede lid en het vierde lid gelden niet voor bestuurders als bedoeld in het zesde lid.

      8 Bestuurders van snorfietsen gebruiken de rijbaan indien dit bij verkeersbesluit, bedoeld in
      [artikel 15, eerste lid, van de wet][ref3], is bepaald en bij het verkeersteken dat het verplichte fietspad
      aangeeft een onderbord dit aanduidt.

      9 Het achtste lid is niet van toepassing op snorfietsen als bedoeld in
      [artikel 1, eerste lid, onderdeel e, onder d, van de wet][ref4] en op bestuurders van snorfietsen zijnde
      bestuurders als bedoeld in het vijfde en zesde lid van dit artikel.


