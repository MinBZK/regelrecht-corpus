  - number: 61a
    text: |-
      Het is degene die een voertuig bestuurt verboden tijdens het rijden een mobiel elektronisch apparaat dat gebruikt
      kan worden voor communicatie of informatieverwerking vast te houden. Onder een mobiel elektronisch apparaat wordt
      in elk geval verstaan een mobiele telefoon, een tabletcomputer of een mediaspeler.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel61a
  - number: 61b
    text: |-
      1 Het is verboden personen te vervoeren in de open of gesloten laadruimte van een motorvoertuig of bromfiets en in
      of op een aanhangwagen achter een motorvoertuig of bromfiets.

      2 Het eerste lid is niet van toepassing:

      a. op het vervoer van personen in de laadruimte van een ambulance of dierenambulance en op het vervoer van
      rolstoelinzittenden op de daarvoor ingerichte plaatsen in de laadruimte van een voertuig dat blijkens een
      aantekening op het kentekenbewijs speciaal is uitgerust voor rolstoelvervoer.

      b. op het vervoer van personen in de laadruimte van motorvoertuigen ten dienste van politie en brandweer en van
      andere door Onze Minister aangewezen hulpverleningsdiensten;

      c. op het vervoer van een persoon op de bestuurderszitplaats in een motorvoertuig of op een bromfiets op meer dan
      twee wielen die door een ander motorvoertuig of een andere bromfiets op meer dan twee wielen wordt voortgetrokken
      en op het vervoer van passagiers van het getrokken voertuig als hier bedoeld, voor wie geen zitplaats in het
      trekkende voertuig als hier bedoeld beschikbaar is;

      d. in het geval het vervoer van personen geschiedt in het kader van een evenement of optocht waarvoor een
      vergunning op grond van een gemeentelijke verordening is afgegeven;

      e. op het vervoer van personen met een motorrijtuig met een door de constructie bepaalde maximumsnelheid van niet
      meer dan 45 km per uur, met niet meer dan acht zitplaatsen, de bestuurderszitplaats niet meegerekend, niet zijnde
      een bromfiets, dat een combinatie vormt met één of meer aanhangwagens die zijn ingericht voor het vervoer van
      personen indien voor dit vervoer een vergunning door het bevoegd gezag is afgegeven.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel61b
  - number: '62'
    text: Weggebruikers zijn verplicht gevolg te geven aan de verkeerstekens die een gebod of verbod inhouden.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel62
  - number: '63'
    text: Verkeerstekens gaan boven verkeersregels, voor zover deze regels onverenigbaar zijn met deze tekens.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel63
  - number: 63a
    text: |-
      Tijdelijke geplaatste of toegepaste verkeerstekens op het wegdek gaan boven ter plekke aangebrachte andere
      verkeerstekens op het wegdek, voor zover deze verkeerstekens onverenigbaar zijn.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel63a
  - number: 63b
    text: |-
      1 Wanneer verkeerstekens die een maximumsnelheid aanduiden een hogere snelheid aangeven dan :

      a. de in de [artikelen 20, onderdeel b][ref1], [21, onderdeel b][ref2], [22][ref3] en [22a][ref4] vastgestelde
      maximumsnelheden, of

      b. de ingevolge een ministeriële regeling krachtens [artikel 86a][ref5] geldende maximumsnelheid, of

      c. de in [artikel 45][ref6] aangegeven snelheid,

      geldt de laagste aangegeven snelheid.

      2 Indien zowel door verkeerstekens op borden als door elektronische signaleringsborden een maximumsnelheid wordt
      aangegeven, geldt de laagste aangegeven maximumsnelheid.


