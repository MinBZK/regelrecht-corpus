  - number: 86d
    text: |-
      1 De geslotenverklaring krachtens verkeersbord C22a van [bijlage 1][ref1] vanwege een milieuzone is van toepassing
      op personen- en bedrijfsauto’s, vrachtauto’s of bussen met een dieselmotor.

      2 Tot 1 januari 2022 worden onder verkeersbord C22a de in [bijlage 1][ref2] opgenomen onderborden C22a1, C22a2,
      C22a4, C22a6 of C22a8 geplaatst.

      3 Van 1 januari 2022 tot 1 januari 2025 worden onder verkeersbord C22a de in [bijlage 1][ref3] opgenomen
      onderborden C22a1, C22a2, C22a5, C22a7 of C22a9 geplaatst.

      4 Met ingang van 1 januari 2025 worden onder verkeersbord C22a de in [bijlage 1][ref4] opgenomen onderborden C22a2,
      C22a3, C22a5, C22a7 of C22a9 geplaatst.

      5 Het eerste lid is niet van toepassing op:

      a. kampeerwagens, voor zover het betreft een geslotenverklaring vanwege een milieuzone waarin de houder van het
      kenteken van het betreffende voertuig woonachtig is;

      b. voertuigen met een datum van eerste toelating van veertig jaar of ouder;

      c. voor rolstoelen toegankelijke personen- of bedrijfsauto’s;

      d. vrachtauto’s, met de in het kentekenregister vastgelegde carrosseriecode 15, 16, 19, 23, 26, 27, 31 of de
      aanduiding voor speciale doeleinden SB en SF, en met een datum van eerste toelating van twaalf jaar of jonger.

      6 Een ontheffing als bedoeld in [artikel 87][ref5], voor zover het betreft het verkeersteken C22a, wordt door het
      bevoegd gezag in ieder geval verleend voor de volgende voertuigen en is geldig voor het gehele land:

      a. voertuigen van gehandicapten, welke zijn aangepast voor € 500 of meer;

      b. kermis- en circusvrachtauto’s, vrachtauto’s voor exceptioneel transport, verhuisauto’s en vrachtauto’s met
      een laadkraan met een hefvermogen van 35 tonmeter of meer, en met een datum van eerste toelating van twaalf jaar
      of jonger.


      [ref1]: https://wetten.overheid.nl/BWBR0004825
      [ref2]: https://wetten.overheid.nl/BWBR0004825
