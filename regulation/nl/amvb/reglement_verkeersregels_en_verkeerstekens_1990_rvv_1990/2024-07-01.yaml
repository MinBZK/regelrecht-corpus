  - number: '88'
    text: |-
      1 Indien op grond van medische noodzaak toepassing wordt gevraagd van [artikel 149, tweede lid, van de wet][ref1]
      voor wat betreft ontheffing van de verplichting tot gebruik van autogordels en kinderbeveiligingssystemen, kan een
      schriftelijke verklaring van een arts worden verlangd.

      2 De ontheffing vermeldt een geldigheidsduur van maximaal twintig jaar.

      3 Op de ontheffing wordt het symbool zoals aangeduid in artikel 5 van de [richtlijn nr 91/671/EEG](31991L0671)
      van de Raad van de Europese Gemeenschappen van 16 december 1991 inzake de onderlinge aanpassing van de wetgevingen
      van de Lid-Staten betreffende het verplichte gebruik van veiligheidsgordels in voertuigen van minder dan 3,5 ton
      (*PbEG* L 373) aangebracht.

      4 Een wijziging van de [richtlijn nr 91/671/EEG](31991L0671) gaat voor de toepassing van het derde lid gelden met
      ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.

      5 De aan de behandeling van de aanvraag van een ontheffing van het gebruik van autogordels en
      kinderbeveiligingssystemen verbonden kosten worden ten laste van de aanvrager gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel149
