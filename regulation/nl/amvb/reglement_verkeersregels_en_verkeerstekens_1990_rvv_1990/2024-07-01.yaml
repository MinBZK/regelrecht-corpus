        artikel: '1.1'
  - number: 1a
    text: |-
      Onder de vermelding in dit besluit van een EG-richtlijn of VN/ECE-reglement wordt verstaan hetgeen
      daaronder wordt begrepen in [artikel 1.2 van de Regeling voertuigen][ref1], met inbegrip van de
      ingevolge [artikel 1.3, eerste lid, van de Regeling voertuigen][ref2] bekendgemaakte wijzigingen.
      [Artikel 1.3, tweede lid, van de Regeling voertuigen][ref3] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0025798#Artikel1.2
