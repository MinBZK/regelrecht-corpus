preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 12 mei 1989, nr. RW 26148, Hoofddirectie van de
    Waterstaat, Hoofdafdeling Bestuurlijke en Juridische Zaken;

    Gelet op artikel 2 en 34 van de Wegenverkeerswet (Stb. 1935, 554);

    Gelet op het op 8 november 1968 te Wenen tot stand gekomen Verdrag inzake het wegverkeer (Trb. 1974, 35), het op 8
    november 1968 te Wenen tot stand gekomen Verdrag inzake verkeerstekens (Trb. 1974, 36), de op 1 mei 1971 te Genève
    tot stand gekomen Europese Overeenkomst tot aanvulling van het Verdrag inzake het wegverkeer dat op 8 november
    1968 te Wenen voor ondertekening werd opengesteld (Trb. 1974, 37), de op 1 mei 1971 te Genève tot stand gekomen
    Europese Overeenkomst tot aanvulling van het Verdrag inzake verkeerstekens dat op 8 november 1968 te Wenen voor
    ondertekening werd opengesteld (Trb. 1974, 38) en het op 1 maart 1973 te Genève tot stand gekomen Protocol inzake
    tekens op het wegdek, aanvulling op de Europese Overeenkomst tot aanvulling van het Verdrag inzake verkeerstekens
    dat op 8 november 1968 te Wenen voor ondertekening werd opengesteld (Trb. 1975, 114);

    De Raad van State gehoord (advies van 2 maart 1990, nr. W09.89.0262);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 16 juli 1990, nr. RW65898, Hoofddirectie
    van de Waterstaat, Hoofdafdeling Bestuurlijke en Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

        - *aanhangwagens*: voertuigen die door een voertuig worden voortbewogen of kennelijk bestemd zijn om aldus te
      worden voortbewogen, alsmede opleggers;
        - *ambulance:* een voor het verlenen van zorg aan en vervoer van zieken en gewonden ingericht motorvoertuig als
      bedoeld in [artikel 1, eerste lid, van de Wet ambulancezorgvoorzieningen][ref1];
        - *autobus*: motorvoertuig, ingericht voor het vervoer van meer dan acht personen, de bestuurder daaronder niet
      begrepen;
        - *autosnelweg*: weg, aangeduid door bord G1 van [bijlage I][ref2]; langs autosnelwegen gelegen parkeerplaatsen,
      tankstations en bushalteplaatsen maken geen deel van de autosnelweg uit;
        - *autoweg*: weg, aangeduid door bord G3 van [bijlage I][ref3]; langs autowegen gelegen parkeerplaatsen,
      tankstations en bushalteplaatsen maken geen deel van de autoweg uit;
        - *bedrijfsauto*: bedrijfsauto als bedoeld in [artikel 1.1 van de Regeling voertuigen][ref4];
        - *bestelauto*: motorvoertuig, bestemd voor het vervoer van goederen, waarvan de toegestane maximum massa niet meer
      bedraagt dan 3500 kg;
        - *bestemmingsverkeer*: bestuurders wier reisdoel één of meer bepaalde percelen betreft die zijn gelegen aan
      of in de directe nabijheid van een weg met een door verkeerstekens aangegeven geslotenverklaring voor bepaalde
      categorieën bestuurders en die slechts via deze weg zijn te bereiken alsmede bestuurders van lijnbussen;
        - *bestuurders*: alle weggebruikers behalve voetgangers;
        - *bestuurder van een motorvoertuig*: 1. hij die het motorvoertuig bestuurt of 2. voor zover het
      betreft een motorvoertuig voor het besturen waarvan een rijbewijs AM, B, C, D of E, is vereist en dat is
      voorzien van een dubbele bediening, hij die rijonderricht geeft of toezicht houdt in het kader van een
      vanwege de overheid ingesteld onderzoek naar de rijvaardigheid, niet zijnde een onderzoek als bedoeld in
      [artikel 131, eerste lid, van de wet][ref5];
        - *bevoegd gezag*: gezag als bedoeld in [artikel 18, eerste lid, van de wet][ref6];
        - *brombakfiets*: bromfiets op drie symmetrisch geplaatste wielen, met twee voorwielen en uitsluitend ingericht
      voor het vervoer van de bestuurder en van goederen en eventueel van een achter de bestuurder gezeten passagier;
        - *brommobiel*: bromfiets op meer dan twee wielen, die is voorzien van een carrosserie;
        - *busbaan*: rijbaan waarop het woord «BUS» of «LIJNBUS» is aangebracht;
        - *busstrook*: door doorgetrokken of onderbroken strepen gemarkeerd gedeelte van de rijbaan waarop het woord «BUS»
      of «LIJNBUS» is aangebracht;
        - *dag*: de periode tussen zonsopgang en zonsondergang;
        - *diensten voor spoedeisende medische hulpverlening:* de op grond van
      [artikel 4, tweede lid, van de Wet ambulancezorgvoorzieningen][ref7] aangewezen Regionale Ambulancevoorzieningen,
      alsmede andere hulpverleningsdiensten die zich in opdracht van een Regionale Ambulancevoorziening als bedoeld
      in artikel 4, tweede lid, van de Wet ambulancezorgvoorzieningen bezig houden met het verlenen van spoedeisende
      medische hulpverlening;
        - *dierenambulance*: motorvoertuig, ingericht en bestemd om te worden gebruikt voor het vervoer van zieke en
      gewonde dieren;
        - *doorgaande rijbaan*: rijbaan zonder de invoeg- en uitrijstroken;
        - *driewielig motorvoertuig*: driewielig motorrijtuig als bedoeld in [artikel 1.1 van de Regeling voertuigen][ref8];
        - *fietsstrook*: door doorgetrokken of onderbroken strepen gemarkeerd gedeelte van de rijbaan waarop afbeeldingen
      van een fiets zijn aangebracht;
        - *gehandicaptenvoertuig*: voertuig dat is ingericht voor het vervoer van een gehandicapte, niet breder is dan
      1,10 meter en niet is uitgerust met een motor, dan wel is uitgerust met een motor waarvan de door de constructie
      bepaalde maximumsnelheid niet meer dan 45 km per uur bedraagt, en geen bromfiets is;
        - *geslotenverklaring*: verbod de betrokken weg in te rijden of in te gaan alsmede de betrokken weg te gebruiken;
        - *haaientanden*: voorrangsdriehoeken op het wegdek;
        - *invoegstrook*: door een blokmarkering van de doorgaande rijbaan afgescheiden weggedeelte dat is bestemd voor
      bestuurders die de doorgaande rijbaan oprijden;
        - *kampeerwagen:* kampeerwagen als bedoeld in [artikel 1.1 van de Regeling voertuigen][ref9];
        - *kruispunt*: kruising of splitsing van wegen;
        - *ligplaats:* ligplaats als bedoeld in [artikel 1.1 van de Regeling voertuigen][ref10];
        - *lijnbus*: motorvoertuig, gebezigd voor het verrichten van openbaar vervoer in de zin van de
      [Wet personenvervoer 2000][ref11];
        - *militaire colonne*: een aantal zich achter elkaar bevindende militaire dan wel bij een onderdeel van de
      rampenbestrijdingsorganisatie in gebruik zijnde motorvoertuigen, onder één commandant, die de door Onze Minister in
      overeenstemming met Onze Minister van Defensie vastgestelde herkenningstekens voeren;
        - *motorfiets*: motorvoertuig op twee wielen al dan niet met zijspan- of aanhangwagen;
        - *motorvoertuigen*: alle gemotoriseerde voertuigen behalve bromfietsen, fietsen met trapondersteuning en
      gehandicaptenvoertuigen, bestemd om anders dan langs rails te worden voortbewogen;
        - *nacht*: de periode tussen zonsondergang en zonsopgang;
        - *overweg*: kruising van een weg en een spoorweg die wordt aangeduid door middel van bord J12 of J13 van
      [bijlage 1][ref12];
        - *parkeerhaven of parkeerstrook*: langs de rijbaan gelegen verharding die is bestemd voor stilstaande of
      geparkeerde voertuigen;
        - *parkeren*: het laten stilstaan van een voertuig anders dan gedurende de tijd die nodig is voor en gebruikt wordt
      tot het onmiddellijk in- of uitstappen van passagiers of voor het onmiddellijk laden of lossen van goederen;
        - *personenauto*: personenauto als bedoeld in [artikel 1.1 van de Regeling voertuigen][ref13];
        - *puntstuk*: meerhoekig vlak op het wegdek, opgenomen bij splitsingen of samenvoegingen van wegen, rijstroken
      of rijbanen;
        - *richtlijn 97/24/EG:* richtlijn nr. 97/24/EG van het Europees Parlement en de Raad van 17 juni 1997 betreffende
      bepaalde onderdelen of eigenschappen van motorvoertuigen op twee of drie wielen (PbEG L 226);
        - *rijbaan*: elk voor rijdende voertuigen bestemd weggedeelte met uitzondering van de fietspaden en de fiets/
      bromfietspaden;
        - *rijstrook*: door doorgetrokken of onderbroken strepen gemarkeerd gedeelte van de rijbaan van zodanige breedte
      dat bestuurders van motorvoertuigen op meer dan twee wielen daarvan gebruik kunnen maken;
        - *snorfiets*: 1. bromfiets die blijkens de gegevens in het kentekenregister is geconstrueerd voor een
      maximumsnelheid die niet meer bedraagt dan 25 km per uur, met uitzondering van de speed-pedelec, of 2. bromfiets
      als bedoeld in [artikel 1, eerste lid, onderdeel e, subonderdeel d, van de wet][ref14];
        - *speed-pedelec:* elektrische bromfiets met trapondersteuning waarvan de aandrijfkracht aanhoudt als het voertuig
      de snelheid van 25 km per uur overschrijdt;
        - *spitsstrook*: de vluchtstrook die als rijstrook is aangewezen blijkens bord C23-01 van [bijlage 1][ref15];
        - *T100-bus*: autobus, ten aanzien waarvan uit een aantekening op het kentekenbewijs of uit het kentekenregister
      blijkt dat hij zodanig is ingericht dat hij in aanmerking komt voor een maximumsnelheid van 100 kilometer per uur.
      Met een T100-bus als bedoeld in dit besluit wordt gelijkgesteld een autobus die is geregistreerd in een andere
      lidstaat van de Europese Unie dan wel een staat, niet zijnde een lidstaat van de Europese Unie, die partij is
      bij een daartoe strekkend of mede daartoe strekkend Verdrag dat Nederland bindt, en ten aanzien waarvan uit het
      kentekenbewijs of uit een verklaring afgegeven door een onafhankelijke keuringsinstelling, afgegeven op basis
      van onderzoekingen die een beschermingsniveau bieden dat ten minste gelijkwaardig is aan het niveau dat met de
      nationale onderzoekingen wordt nagestreefd, blijkt dat de autobus geschikt is voor een maximumsnelheid van 100
      kilometer per uur;
        - *uitrijstrook*: door een blokmarkering van de doorgaande rijbaan afgescheiden weggedeelte dat is bestemd voor
      bestuurders die de doorgaande rijbaan verlaten;
        - *uitvaartstoet van motorvoertuigen:* een stoet, bestaande uit motorvoertuigen, die een lijk als bedoeld in
      [artikel 2, eerste lid, onderdeel a, van de Wet op de lijkbezorging][ref16] of de as van een gecremeerd lijk
      begeleiden en die de in [artikel 30c][ref17] bedoelde herkenningstekens voeren;
        - *veiligheidscel*: onderdeel van de constructie van een bromfiets, een motorfiets of een driewielig motorvoertuig
      dat de bestuurder of passagiers beschermt tegen hoofdletsel;
        - *verdrijvingsvlak*: gedeelte van de rijbaan waarop schuine strepen zijn aangebracht;
        - *verkeer*: alle weggebruikers;
        - *verkeersregelaar*: persoon als bedoeld in
      [artikel 1, onderdeel i, van het Besluit administratieve bepalingen inzake het wegverkeer][ref18];
        - *verlicht transparant*: verlicht transparant als bedoeld in [artikel 1.1 van de Regeling voertuigen][ref19];
        - *vluchthaven of vluchtstrook*: door een doorgetrokken streep van de rijbaan van de autosnelweg of autoweg
      afgescheiden weggedeelte, dat bestemd is voor gebruik in noodgevallen, behoudens voor de duur van openstelling
      als spitsstrook;
        - *voertuigen*: fietsen, bromfietsen, gehandicaptenvoertuigen, motorvoertuigen, trams en wagens;
        - *voorrangsvoertuig*: motorvoertuig dat de optische en geluidssignalen voert als bedoeld in [artikel 29][ref20];
        - *voorrang verlenen*: het de betrokken bestuurders in staat stellen ongehinderd hun weg te vervolgen;
        - *vrachtauto*: motorvoertuig, niet ingericht voor het vervoer van personen, waarvan de toegestane maximum massa
      meer bedraagt dan 3500 kg;
        - *weggebruikers*: voetgangers, fietsers, bromfietsers, bestuurders van een gehandicaptenvoertuig, van een
      motorvoertuig of van een tram, ruiters, geleiders van rij- of trekdieren of vee en bestuurders van een bespannen of
      onbespannen wagen;
        - *wet*: [Wegenverkeerswet 1994](onbekend);
        - *zitplaats*: zitplaats als bedoeld in [artikel 1.1 van de Regeling voertuigen][ref21].


