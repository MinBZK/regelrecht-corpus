  - number: 86c
    text: |-
      Voor de toepassing van dit hoofdstuk en bijlage 1 wordt verstaan onder:

        - *bedrijfsauto:* bedrijfsauto als bedoeld in [artikel 1.1 van de Regeling voertuigen][ref1], met een toegestane
      maximum massa van niet meer dan 3.500 kg;
        - *emissieklasse:* klasse van uitstoot van broeikasgassen, verontreinigende gassen en deeltjes door een voertuig
      als bedoeld in de bijlage van het [Kentekenreglement][ref2];
        - *kermis- en circusvrachtauto:* vrachtauto die feitelijk gebruikt wordt als kermis- en circusvoertuig als
      bedoeld in [artikel 1.1 van de Regeling voertuigen][ref3] en in het kentekenregister aangeduid als kermis- en
      circusvoertuig;
        - *emissieloos voertuig:* voertuig zonder uitlaatemissie van broeikasgassen, verontreinigende gassen en deeltjes
      (emissieklasse Z);
        - *opleggertrekker:* opleggertrekker als bedoeld in [artikel 1.1 van de Regeling voertuigen][ref4] met de
      voertuigclassificatie N of N;
        - *verhuisauto:* vrachtauto die gebruikt wordt door een verhuisonderneming en bestemd voor het vervoeren van
      inboedels;
        - *voor rolstoelen toegankelijke personen- of bedrijfsauto:* personen- of bedrijfsauto die in het kentekenregister
      is voorzien van de aanduiding voor speciale doeleinden voor rolstoelen toegankelijk voertuig (code SH) of van de
      bijzonderheidscodes 70, 145, 146, 147 of 149;
        - *vrachtauto voor exceptioneel transport:* vrachtauto voor exceptioneel transport als bedoeld in
      [artikel 1, onder c, van het Besluit ontheffingverlening exceptioneel vervoer][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0025798#Artikel1.1
      [ref2]: https://wetten.overheid.nl/BWBR0006951
      [ref3]: https://wetten.overheid.nl/BWBR0025798#Artikel1.1
      [ref4]: https://wetten.overheid.nl/BWBR0025798#Artikel1.1
      [ref5]: https://wetten.overheid.nl/BWBR0018680#Artikel1
