      - id: ref1
        bwb_id: BWBR0004825
        artikel: '35'
        hoofdstuk: II
        paragraaf: '13'
      - id: ref2
        bwb_id: BWBR0004825
        artikel: 35a
        hoofdstuk: II
        paragraaf: '13'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '1'
  - number: '36'
    text: |-
      Ruiters en geleiders van rij- of trekdieren en vee moeten bij dag, indien het zicht ernstig wordt belemmerd, en bij
      nacht een lantaarn meevoeren die naar voren wit of geel licht en naar achteren rood licht moet stralen.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel36
  - number: '37'
    text: |-
      Door voetgangers gevormde colonnes en optochten moeten buiten de bebouwde kom bij dag, indien het zicht ernstig
      wordt belemmerd, en bij nacht aan de linker voorzijde een naar alle zijden wit of geel licht uitstralende lantaarn
      en aan de linker achterzijde een naar alle zijden rood licht uitstralende lantaarn meevoeren.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel37
  - number: '38'
    text: |-
      Bestuurders van een motorvoertuig op meer dan twee wielen, die buiten de bebouwde kom stilstaan op de rijbaan en
      op langs autosnelwegen en autowegen gelegen parkeerstroken, parkeerhavens, vluchtstroken en vluchthavens moeten bij
      dag, indien het zicht ernstig wordt belemmerd, en bij nacht stadslicht en achterlicht voeren.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel38
  - number: '39'
    text: |-
      Stilstaande aanhangwagens moeten buiten de bebouwde kom op de rijbaan en op langs autosnelwegen en autowegen
      gelegen parkeerstroken, parkeerhavens, vluchtstroken en vluchthavens bij dag, indien het zicht ernstig wordt
      belemmerd, en bij nacht achterlicht en het in de [Regeling voertuigen][ref1] voorgeschreven stadslicht voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0025798
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0025798
  - number: '40'
    text: |-
      Stilstaande wagens moeten buiten de bebouwde kom op de rijbaan bij dag, indien het zicht ernstig wordt belemmerd,
      en bij nacht voor- en achterlicht voeren.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel40
  - number: '41'
    text: |-
      1 Onverminderd [artikel 32, eerste lid][ref1], mogen bestuurders van een motorvoertuig bij dag dagrijlicht voeren.
      Het dagrijlicht wordt niet tegelijk met enig ander licht aan de voorzijde van het voertuig gevoerd.

      2 Bestuurders van een motorvoertuig mogen, indien deze verlichting krachtens de Regeling voertuigen voor
      dat motorvoertuig is toegestaan, tegelijk met dimlicht of mistlicht aan de voorzijde bochtlicht, hoeklicht,
      manoeuvreerlichten, markeringslichten of staaklichten voeren, waarbij voor het mogen voeren van manoeuvreerlichten
      een maximumsnelheid geldt van 10 km per uur.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel32
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '32'
        hoofdstuk: II
        paragraaf: '13'
  - number: 41a
    text: |-
      1 Verlichte transparanten die informatie bieden over de bestemming of het gebruik van het voertuig mogen worden
      gevoerd door:

      a. personenauto’s, bedrijfsauto’s en motorfietsen:

      1°. in gebruik bij de politie of bij de bijzondere opsporingsdiensten, bedoeld in
      [artikel 2 van de Wet op de bijzondere opsporingsdiensten][ref1];

      2°. in gebruik bij de brandweer;

      3°. in gebruik bij pechhulpdiensten;

      4°. in gebruik bij Rijkswaterstaat, bij de Inspectie Leefomgeving en Transport of bij de douane;

      5°. die worden gebruikt door artsen;

      6°. die worden gebruikt voor het geven van rijonderricht of het afleggen van een rijproef;

      7°. die worden gebruikt door de Regionale Ambulancevoorzieningen, bedoeld in
      [artikel 4, tweede lid, van de Wet ambulancezorgvoorzieningen][ref2];

      8°. van hulpverleningsdiensten die zich in opdracht van een Regionale Ambulancevoorziening als bedoeld in
      [artikel 4, tweede lid, van de Wet ambulancezorgvoorzieningen][ref3] bezig houden met het verlenen van spoedeisende
      hulpverlening;

      b. autobussen van openbaar vervoerdiensten;

      c. bedrijfsauto’s van transportbegeleiders;

      d. personen- en bedrijfsauto’s ingericht als dierenambulance;

      e. taxi’s.

      2 Personenauto’s, bedrijfsauto’s en motorfietsen die worden gebruikt voor het geven van rijonderricht of
      het afleggen van een rijproef mogen slechts zijn voorzien van een verlicht transparant die de ingevolge het
      [Reglement rijbewijzen][ref4] voorgeschreven letter «L» weergeeft.

      3 Onverminderd het eerste lid mogen:

      a. verlichte transparanten die worden gevoerd door de voertuigen als bedoeld in het eerste lid, onderdeel a, onder
      1° tot en met 4° en onderdeel c, aanwijzingen weergeven voor het overige wegverkeer,

      b. taxi’s zijn voorzien van verlichte transparanten die de volgende informatie weergeven:

      1°. tarieven;

      2°. naam van het taxibedrijf; en

      3°. telefoonnummer van het taxibedrijf.

      4 Taxi’s die zijn voorzien van verlichte transparanten die tarieven weergeven, mogen deze verlichting slechts
      voeren wanneer zij zich op een taxistandplaats bevinden.

      5 Verlichte transparanten worden niet gevoerd door andere voertuigen dan genoemd in het eerste lid en worden niet
      gevoerd op een andere wijze dan bepaald in het eerste tot en met vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0019919#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0043925#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0043925#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0008074
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel41a
    references:
      - id: ref1
        bwb_id: BWBR0019919
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0043925
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0043925
        artikel: '4'
