  - number: 86b
    text: |-
      Het is de bestuurders van de in [artikel 86a, eerste lid][ref1], bedoelde motorvoertuigen verboden de ingevolge
      [artikel 86a][ref2] bepaalde maximumsnelheid te overschrijden.


