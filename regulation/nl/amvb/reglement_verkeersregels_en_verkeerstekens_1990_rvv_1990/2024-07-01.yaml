        bwb_id: BWBR0008074
  - number: '42'
    text: |-
      1 Het gebruik van de autosnelweg is slechts toegestaan voor bestuurders van een motorvoertuig waarmee met een
      snelheid van ten minste 60 km per uur mag en kan worden gereden.

      2 Het gebruik van de autoweg is slechts toegestaan voor bestuurders van een motorvoertuig waarmee met een snelheid
      van ten minste 50 km per uur mag en kan worden gereden.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel42
  - number: '43'
    text: |-
      1 Het is de bestuurders verboden op een autosnelweg of autoweg hun voertuig te keren of achteruit te rijden.

      2 Het is de bestuurders voorts verboden op de rijbaan van een autosnelweg of autoweg hun voertuig te laten
      stilstaan.

      3 Behoudens in noodgevallen is het de weggebruikers verboden op een autosnelweg of autoweg gebruik te maken van de
      vluchtstrook, de vluchthaven of de berm.

      4 Op een autosnelweg is het bestuurders van een samenstel van voertuigen met een totale lengte van meer dan 7 meter
      en van een vrachtauto verboden op een rijbaan met drie of meer rijstroken enig andere dan de twee meest rechts
      gelegen rijstroken te gebruiken. Het verbod geldt niet voor het geval zij moeten voorsorteren.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel43
  - number: '44'
    text: Voetgangers mogen wegen gelegen binnen een erf over de volle breedte gebruiken.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel44
  - number: '45'
    text: Bestuurders mogen binnen een erf niet sneller rijden dan 15 km per uur.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel45
  - number: '46'
    text: |-
      1 Het is bestuurders van een motorvoertuig verboden binnen een erf te parkeren anders dan op parkeerplaatsen die
      als zodanig zijn aangeduid of aangegeven.

      2 Indien het erf tevens is aangeduid als parkeerschijf-zone, zijn ten aanzien van het parkeren van voertuigen
      [artikel 25][ref1] en [26][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0004825#Artikel26
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '25'
        hoofdstuk: II
        paragraaf: '10'
      - id: ref2
        bwb_id: BWBR0004825
        artikel: '26'
        hoofdstuk: II
        paragraaf: '10'
  - number: '47'
    text: |-
      Het is bestuurders van een motorvoertuig en bromfietsers die de rijbaan volgen toegestaan vlak voor of op rotondes
      anders dan aan de rechterzijde van de rijbaan te rijden.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel47
  - number: '48'
    text: Het is bestuurders toegestaan vlak voor of op rotondes rechts in te halen.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel48
  - number: '49'
    text: |-
      1 Bestuurders moeten blinden, voorzien van een witte stok met één of meer rode ringen, en overigens alle personen
      die zich moeilijk voortbewegen, voor laten gaan.

      2 Bestuurders moeten voetgangers en bestuurders van een gehandicaptenvoertuig, die op een
      voetgangersoversteekplaats oversteken of kennelijk op het punt staan zulks te doen, voor laten gaan.

      3 Het tweede lid geldt niet voor bestuurders van een motorvoertuig dat behoort tot een militaire colonne of een
      uitvaartstoet van motorvoertuigen.

      4 Het tweede lid geldt evenmin, indien voor de voetgangers en de bestuurders van een gehandicaptenvoertuig een rood
      voetgangerslicht of een geel knipperlicht als bedoeld in [artikel 74, tweede lid][ref1], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel74
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '74'
        hoofdstuk: III
        paragraaf: '3'
  - number: '50'
    text: Weggebruikers moeten bestuurders van een voorrangsvoertuig voor laten gaan.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel50
  - number: '51'
    text: |-
      1 Het is verboden rij- of trekdieren of vee zonder toezicht op de weg los te laten lopen.

      2 Het eerste lid geldt niet ten aanzien van wegen die door het bevoegde gezag zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel51
  - number: '52'
    text: |-
      Bestuurders die een stilstaande tram of autobus willen voorbijrijden aan de zijde waar passagiers in- en
      uitstappen, moeten aan hen daartoe gelegenheid geven.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel52
  - number: '53'
    text: |-
      Het is bestuurders van een motorvoertuig verboden een ander motorvoertuig te slepen, indien de afstand van de
      achterzijde van het trekkende voertuig tot de voorzijde van het gesleepte voertuig meer dan vijf meter bedraagt.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel53
  - number: '54'
    text: |-
      Bestuurders die een bijzondere manoeuvre uitvoeren, zoals wegrijden, achteruitrijden, uit een uitrit de weg
      oprijden, van een weg een inrit oprijden, keren, van de invoegstrook de doorgaande rijbaan oprijden, van de
      doorgaande rijbaan de uitrijstrook oprijden en van rijstrook wisselen, moeten het overige verkeer voor laten gaan.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel54
  - number: '55'
    text: |-
      Bestuurders van een motorvoertuig respectievelijk bromfietsers moeten een teken met hun richtingaanwijzer geven
      respectievelijk een teken met hun richtingaanwijzer of met hun arm geven, indien zij willen wegrijden, andere
      bestuurders van een motorvoertuig willen inhalen, de doorgaande rijbaan willen oprijden en verlaten en indien zij
      van rijstrook willen wisselen alsmede bij alle andere belangrijke zijdelingse verplaatsingen.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel55
  - number: '56'
    text: |-
      1 Binnen de bebouwde kom moeten bestuurders aan bestuurders van een autobus de gelegenheid geven van een bushalte
      weg te rijden, wanneer de bestuurder van die autobus door het geven van een teken met zijn richtingaanwijzer zijn
      voornemen om weg te rijden kenbaar maakt.

      2 Het eerste lid geldt niet voor bestuurders van een motorvoertuig dat behoort tot een militaire colonne of een
      uitvaartstoet van motorvoertuigen.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel56
  - number: '57'
    text: |-
      Bestuurders van een motorvoertuig, bromfietsers en snorfietsers mogen met hun voertuig geen onnodig geluid
      veroorzaken.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel57
  - number: '58'
    text: |-
      1 Stilstaande motorvoertuigen op meer dan twee wielen en aanhangwagens moeten worden aangeduid door een
      gevarendriehoek, indien het voertuig een obstakel vormt dat door naderende bestuurders niet tijdig als zodanig kan
      worden opgemerkt.

      2 De gevarendriehoek moet goed zichtbaar op de weg worden geplaatst op een afstand van ongeveer 30 meter van het
      voertuig en in de richting van het verkeer waarvoor het voertuig gevaar oplevert.

      3 Het eerste lid geldt niet wanneer knipperend waarschuwingslicht wordt gevoerd.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel58
  - number: 58a
    text: |-
      1 Tijdens deelname aan het verkeer zitten bestuurders en passagiers op de voor hen bestemde zitplaatsen.

      2 Het eerste lid is niet van toepassing op:

      a. staande passagiers van autobussen waarin het vervoer van staande passagiers is toegestaan;

      b. passagiers van autobussen zonder staanplaatsen bij incidenteel gebruik van het gangpad of toilet;

      c. passagiers die worden vervoerd overeenkomstig [artikel 61b, tweede lid, onderdelen a, b en d][ref1];

      d. passagiers, jonger dan 3 jaar, in autobussen;

      e. passagiers jonger dan 18 jaar en met een lengte van minder dan 1,35 meter die gebruik maken van een voor deze
      passagiers geschikte zitgelegenheid die deel uitmaakt van de constructie van het voertuig, hierin deugdelijk is
      bevestigd en is voorzien van autogordels;

      f. het vervoer van passagiers die gebruik maken van een rolstoel als bedoeld in [artikel 59, vierde lid][ref2];

      g. het vervoer van één persoon van 8 jaar of ouder op de bagagedrager door fietsers met uitzondering van
      snorfietsers.

      h. passagiers die gebruik maken van een ligplaats, indien op één ligplaats ten hoogste één passagier is gelegen.

      3 In afwijking van het eerste lid worden op fietsen en bromfietsen passagiers jonger dan 8 jaar alleen vervoerd
      indien zij zijn gezeten op een doelmatige en veilige voorziening met voldoende steun voor rug, handen en voeten.

      4 Het is bestuurders verboden passagiers te vervoeren op een andere wijze dan in dit artikel is voorgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel61b
      [ref2]: https://wetten.overheid.nl/BWBR0004825#Artikel59
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel58a
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: 61b
        hoofdstuk: II
        paragraaf: '31'
      - id: ref2
        bwb_id: BWBR0004825
        artikel: '59'
        hoofdstuk: II
        paragraaf: '27'
  - number: '59'
    text: |-
      1 Bestuurders van een personenauto, een bedrijfsauto, een driewielig motorvoertuig met gesloten
      carrosserie of een brommobiel en hun passagiers maken gebruik van de voor hen beschikbare autogordel.
      Passagiers die jonger zijn dan 18 jaar en met een lengte van minder dan 1,35 meter, maken gebruik
      van een voor hen geschikt kinderbeveiligingssysteem dat is voorzien van een keurmerk als bedoeld in
      [artikel 22, vijfde lid, van de wet][ref1]. Wanneer de zitplaatsen die bestemd zijn voor passagiers voorzien zijn
      van autogordels, worden op deze zitplaatsen niet meer passagiers vervoerd dan er autogordels aanwezig zijn.

      2 Met een personenauto, een bedrijfsauto, een driewielig motorvoertuig met gesloten carrosserie of een brommobiel
      die niet zijn uitgerust met een autogordel of kinderbeveiligingssysteem als bedoeld in het eerste lid, worden geen
      passagiers vervoerd die jonger zijn dan 3 jaar en worden passagiers in de leeftijd van 3 tot 18 jaar met een lengte
      van minder dan 1,35 meter op een andere zitplaats dan een van de voorste zitplaatsen vervoerd.

      3 Passagiers die jonger zijn dan 18 jaar, worden niet in een naar achteren gericht kinderbeveiligingssysteem op een
      passagierszitplaats met een voorairbag vervoerd, tenzij deze airbag is uitgeschakeld of automatisch op toereikende
      wijze wordt uitgeschakeld.

      4 Het eerste lid geldt niet voor passagiers die gebruik maken van een rolstoel. Deze passagiers worden vervoerd in
      een rolstoel die in het voertuig wordt vastgezet op een wijze die de stabiliteit van de rolstoel en de veiligheid
      van de rolstoelgebruiker waarborgt. Deze passagiers maken gebruik van:

      a. de voor hen beschikbare veiligheidsgordel die deel uitmaakt van het voertuig,

      b. de veiligheidsgordel die deel uitmaakt van het systeem waarmee de rolstoel aan de vloer van het voertuig is
      bevestigd, of

      c. een door Onze Minister aangewezen constructie.

      5 Het eerste lid, tweede volzin, en het tweede lid zijn niet van toepassing tijdens vervoer in taxi’s. In taxi’s
      waarin geen kinderbeveiligingssysteem aanwezig is, worden passagiers die jonger zijn dan 18 jaar en met een lengte
      van minder dan 1,35 meter op een andere zitplaats dan een van de voorste zitplaatsen vervoerd.

      6 Het eerste lid voor zover dat op bestuurders betrekking heeft en het vierde lid gelden niet tijdens het vervoer
      van passagiers tegen vergoeding in de zin van de [Wet personenvervoer 2000][ref2] en tijdens vraagafhankelijk
      openbaar vervoer in taxi’s, anders dan in de gevallen waarin een overeenkomst is gesloten als bedoeld in
      [artikel 81, tweede lid, van die wet][ref3], of anders dan tijdens taxivervoer in een taxi die is ingericht voor
      rolstoelvervoer overeenkomstig de daaromtrent gestelde eisen in de [Regeling voertuigen][ref4].

      7 De autogordel, de veiligheidsgordel of het kinderbeveiligingssysteem wordt gebruikt op een wijze die de
      beschermende werking ervan niet negatief beïnvloedt of kan beïnvloeden. Personen van 18 jaar en ouder en personen
      onder de 18 jaar die in de betrokken omstandigheden geen gebruik hoeven maken van een kinderbeveiligingssysteem,
      kunnen een voorziening gebruiken door middel waarvan het diagonale deel van de autogordel over de schouder wordt
      geleid. Onze Minister kan aan een dergelijke voorziening nadere eisen stellen.

      8 Het is bestuurders van de in het eerste lid genoemde voertuigen verboden passagiers jonger dan 12 jaar
      en passagiers die gebruik maken van een rolstoel te vervoeren op een andere wijze dan in dit artikel is
      voorgeschreven.

      9 Het eerste lid geldt niet voor passagiers die gebruik maken van een ligplaats. Deze passagiers maken, indien
      beschikbaar, gebruik van de daarvoor bestemde veiligheidsvoorziening die deel uitmaakt van het voertuig of van het
      systeem waarmee de ligplaats aan de vloer van het voertuig is bevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0011470
      [ref3]: https://wetten.overheid.nl/BWBR0011470#Artikel81
      [ref4]: https://wetten.overheid.nl/BWBR0025798
