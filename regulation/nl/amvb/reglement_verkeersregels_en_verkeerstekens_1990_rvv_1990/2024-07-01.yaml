  - number: 86e
    text: |-
      1 De geslotenverklaring krachtens verkeersbord C22c van [bijlage 1][ref1] vanwege een nul-emissiezone is met ingang
      van 1 januari 2025 van toepassing op bedrijfs- en vrachtauto’s, met uitzondering van emissieloze voertuigen.

      2 Onder verkeersbord C22c wordt onderbord C22c1 geplaatst.

      3 Tot en met 31 december 2026 is het eerste lid niet van toepassing op bedrijfsauto’s met emissieklasse 5.

      4 Tot en met 31 december 2027 is het eerste lid niet van toepassing op bedrijfsauto’s met minimaal emissieklasse 6.

      5 Tot en met 31 december 2029 is het eerste lid niet van toepassing op:

      a. de voertuigen, bedoeld in [artikel 86d, vijfde lid, onderdelen b tot en met d][ref2];

      b. opleggertrekkers met emissieklasse 6 met een datum van eerste toelating vanaf 1 januari 2017;

      c. vrachtauto’s met emissieklasse 6 voor zover die niet onder onderdeel b vallen en met een datum van eerste
      toelating vanaf 1 januari 2020.

      6 Een ontheffing als bedoeld in [artikel 87][ref3], voor zover het betreft het verkeersteken C22c, wordt door het
      bevoegd gezag in ieder geval verleend voor de volgende voertuigen:

      a. voertuigen van gehandicapten, welke zijn aangepast voor € 500 of meer;

      b. kermis- en circusvrachtauto’s, vrachtauto’s voor exceptioneel transport, verhuisauto’s en vrachtauto’s met
      een laadkraan met een hefvermogen van 35 tonmeter of meer, en met een datum van eerste toelating van twaalf jaar
      of jonger.

      7 Het derde, vierde en vijfde lid, onderdelen b en c, zijn niet van toepassing op bedrijfs- en vrachtauto’s die na
      31 december 2024 op kenteken zijn gezet.


      [ref1]: https://wetten.overheid.nl/BWBR0004825
      [ref2]: https://wetten.overheid.nl/BWBR0004825#Artikel86d
      [ref3]: https://wetten.overheid.nl/BWBR0004825#Artikel87
