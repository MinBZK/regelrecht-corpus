  - number: '60'
    text: |-
      1 De bestuurder en de passagiers van bromfietsen, snorfietsen, brommobielen zonder gesloten carrosserie,
      motorfietsen en driewielige motorvoertuigen zonder gesloten carrosserie moeten een goed passende helm dragen, die
      door middel van een sluiting op deugdelijke wijze op het hoofd is bevestigd en die is voorzien van een goedkeuring
      als bedoeld in [artikel 21 van de wet][ref1] en een bij ministeriële regeling aangeduid goedkeuringskenmerk.

      2 Het eerste lid geldt niet voor:

      a. de bestuurder en de passagiers van een bromfiets als bedoeld in
      [artikel 1, eerste lid, onderdeel e, subonderdeel d, van de wet][ref2].

      b. de bestuurder en de achter hem zittende passagier van een brombakfiets;

      c. de bestuurder of de passagier van een door de Dienst Wegverkeer aangewezen type bromfiets, niet zijnde een
      brommobiel, of motorfiets van wie de zitplaats beschermd wordt door een veiligheidscel en voorzien is van een
      autogordel, mits van deze autogordel gebruik gemaakt wordt. Bij de aanwijzing kan onderscheid gemaakt worden tussen
      de bestuurder en de passagiers ten aanzien van de gelding van het eerste lid. Bij ministeriële regeling worden
      regels gesteld betreffende de eisen waaraan een type bromfiets of motorfiets moet voldoen om te kunnen worden
      aangewezen. Deze regels zien in elk geval op de eisen die gesteld worden aan de veiligheidscel en de autogordels;

      d. de bestuurders of de passagiers van een brommobiel zonder gesloten carrosserie of een driewielig
      motorvoertuig zonder gesloten carrosserie van wie de zitplaats in deze brommobiel of dat motorvoertuig is
      voorzien van twee bevestigingspunten onder en één bevestigingspunt boven voor een autogordel overeenkomstig
      de typegoedkeuring van het voertuig zoals die gold op de datum waarop het voertuig in gebruik is genomen, en
      waarbij de autogordel voldoet aan [artikel 5.6.47, derde en vierde lid, van de Regeling voertuigen][ref3] of aan
      [artikel 5.5.47, vierde en vijfde lid, van de Regeling voertuigen][ref4], mits van deze autogordel gebruik gemaakt
      wordt.

      3 Het is bestuurders verboden passagiers beneden de twaalf jaren te vervoeren op een andere wijze dan in dit
      artikel is voorgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0025798#Artikel5.6.47
      [ref4]: https://wetten.overheid.nl/BWBR0025798#Artikel5.5.47
