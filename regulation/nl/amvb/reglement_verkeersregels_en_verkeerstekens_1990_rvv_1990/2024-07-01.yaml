  - number: '86'
    text: |-
      Met een gehandicaptenparkeerkaart worden gelijkgesteld de door het daartoe bevoegde gezag buiten Nederland
      afgegeven parkeerkaarten voor gehandicapten, voor zover deze bij ministeriële regeling zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel86
  - number: 86a
    text: |-
      1 In geval van een ernstige verstoring van de olieaanvoer kan bij regeling van Onze Minister worden bepaald dat op
      autosnelwegen en op autowegen, in afwijking van [artikel 21, aanhef en onderdeel a][ref1], voor motorvoertuigen een
      maximumsnelheid geldt van 90 kilometer per uur.

      2 Het eerste lid is niet van toepassing op vrachtauto’s, motorvoertuigen met aanhangwagen of autobussen, niet
      zijnde T100-bussen.

      3 Onze Minister stelt de regeling, als bedoeld in het eerste lid, vast in overeenstemming met Onze Ministers van
      Justitie en van Economische Zaken.

      4 De regeling, als bedoeld in het eerste lid, vervalt uiterlijk met ingang van de eerste dag van de vijfde
      kalendermaand na het tijdstip van inwerkingtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel21
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel86a
