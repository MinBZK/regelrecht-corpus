  - number: 59a
    text: |-
      1 Bestuurders van een autobus en hun passagiers van 3 jaar of ouder gebruiken de autogordel of het
      kinderbeveiligingssysteem waarmee de autobus is uitgerust, wanneer zij zich op hun zitplaats bevinden en het
      voertuig deelneemt aan het verkeer.

      2 Passagiers van een autobus die in beweging is, wordt meegedeeld dat het verplicht is gebruik te maken van het in
      het eerste lid genoemde beveiligingsysteem wanneer zij zich op hun zitplaats bevinden en het voertuig deelneemt aan
      het verkeer. Deze mededeling gebeurt op één of meer van de volgende manieren:

      a. door de bestuurder, de conducteur, de reisleider of een als groepsleider aangewezen persoon;

      b. door audiovisuele middelen;

      c. door opschriften of het volgende pictogram:

      Het pictogram wordt bij gebruikmaking daarvan duidelijk op iedere zitplaats aangebracht.

      3 In afwijking van het eerste lid behoeven passagiers van autobussen waarin het vervoer van staande passagiers
      is toegestaan geen beveiligingssysteem te gebruiken en behoeven passagiers van autobussen die volgens een
      dienstregeling stads- of streekvervoer uitvoeren binnen de bebouwde kom geen beveiligingssysteem te gebruiken.

      4 Het is bestuurders van een autobus verboden passagiers jonger dan 12 jaren te vervoeren op een andere wijze dan
      in dit artikel is voorgeschreven.

      5 Het eerste lid geldt niet voor passagiers die gebruik maken van een ligplaats. Deze passagiers maken, indien
      beschikbaar, gebruik van de daarvoor bestemde veiligheidsvoorziening die deel uitmaakt van het voertuig of van het
      systeem waarmee de ligplaats aan de vloer van het voertuig is bevestigd.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel59a
  - number: 59b
    text: |-
      1 In afwijking van [artikel 59, eerste en achtste lid][ref1], mag anders dan op de voorste zitplaatsen in
      personenauto’s en bestelauto’s, wanneer het na installatie van twee kinderbeveiligingssystemen niet mogelijk is
      nog een derde kinderbeveiligingssysteem te installeren en deze beveiligingssystemen in gebruik zijn, een derde
      passagier die 3 jaren of ouder is en met een lengte van minder dan 1,35 meter, worden vervoerd wanneer deze een
      autogordel gebruikt. [Artikel 59, zevende lid, is van toepassing][ref2].

      2 In afwijking van [artikel 59, eerste lid, tweede volzin, en achtste lid][ref3], mogen in incidentele gevallen
      en over korte afstand in personenauto's en bestelauto's op andere dan de voorste zitplaatsen passagiers die 3 jaar
      of ouder zijn en met een lengte van minder dan 1,35 meter worden vervoerd wanneer deze passagiers een autogordel
      gebruiken. Dit geldt niet met betrekking tot passagiers waarvan een ouder de auto bestuurt dan wel daarvan eigenaar
      of houder is.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel59
