  - number: '6'
    text: |-
      1 Bromfietsers gebruiken het fiets/bromfietspad.

      2 Zij gebruiken de rijbaan indien een fiets/bromfietspad ontbreekt.

      3 Bestuurders van bromfietsen op meer dan twee wielen en bromfietsen met aanhangwagen, die met inbegrip van de
      lading breder zijn dan 0,75 meter, gebruiken de rijbaan.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel6
  - number: '7'
    text: |-
      Bestuurders van een gehandicaptenvoertuig gebruiken het trottoir, het voetpad, het fietspad, het fiets/bromfietspad
      of de rijbaan.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel7
  - number: '8'
    text: |-
      1 Ruiters gebruiken het ruiterpad.

      2 Zij gebruiken de berm of de rijbaan indien een ruiterpad ontbreekt.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel8
  - number: '9'
    text: Voetgangers mogen de rijbaan gebruiken, indien zij een colonne, een optocht of een uitvaartstoet vormen.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel9
  - number: '10'
    text: |-
      1 Andere bestuurders dan die genoemd in de [artikelen 5 tot en met 8][ref1] gebruiken de rijbaan. Deze bestuurders
      en voetgangers die een aanhangwagen voortbewegen die kennelijk bestemd is om door een motorvoertuig te worden
      voortbewogen, mogen voor het parkeren van hun voertuig tevens andere weggedeelten gebruiken, behalve het trottoir,
      het voetpad, het fietspad, het fiets/bromfietspad of het ruiterpad.

      2 Andere bestuurders dan fietsers en bestuurders van een gehandicaptenvoertuig mogen fietsstroken met doorgetrokken
      strepen niet gebruiken.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel5
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
  - number: '11'
    text: |-
      1 Inhalen geschiedt links.

      2 Bestuurders die links voorgesorteerd hebben en te kennen hebben gegeven dat zij naar links willen afslaan, worden
      rechts ingehaald.

      3 Fietsers dienen elkaar links in te halen; zij mogen andere bestuurders rechts inhalen.

      4 Bestuurders die zich rechts van een blokmarkering bevinden mogen bestuurders die zich links van deze markering
      bevinden rechts inhalen.

      5 Bestuurders mogen trams rechts inhalen.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel11
  - number: '12'
    text: Het is verboden een voertuig vlak voor of op een voetgangersoversteekplaats in te halen.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel12
  - number: '13'
    text: |-
      1 Bij fileverkeer behoeft, indien de rijbaan is verdeeld in rijstroken in dezelfde richting, niet de meest rechts
      gelegen rijstrook te worden gevolgd.

      2 Files mogen aan de rechterzijde worden ingehaald.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel13
  - number: '14'
    text: Bestuurders mogen een kruispunt niet blokkeren.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel14
  - number: '15'
    text: |-
      1 Op kruispunten verlenen bestuurders voorrang aan voor hen van rechts komende bestuurders.

      2 Op deze regel gelden de volgende uitzonderingen:

      a. bestuurders op een onverharde weg verlenen voorrang aan bestuurders op een verharde weg;

      b. bestuurders verlenen voorrang aan bestuurders van een tram.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel15
  - number: 15a
    text: |-
      1 Weggebruikers mogen een overweg opgaan, indien zij direct kunnen doorgaan en de overweg geheel kunnen vrijmaken.

      2 Bij overwegen laten weggebruikers een spoorvoertuig voorgaan en laten daarbij de overweg geheel vrij.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel15a
  - number: '16'
    text: Weggebruikers mogen militaire colonnes en uitvaartstoeten van motorvoertuigen niet doorsnijden.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel16
  - number: '17'
    text: |-
      1 Bestuurders die willen afslaan, mogen voorsorteren door:

      a. indien zij naar rechts willen afslaan tijdig zoveel mogelijk aan de rechterzijde te gaan rijden;

      b. indien zij naar links willen afslaan tijdig zoveel mogelijk tegen de wegas te rijden of bij rijbanen bestemd
      voor bestuurders in één richting daarop zoveel mogelijk links te houden.

      2 Bestuurders moeten alvorens af te slaan een teken met hun richtingaanwijzer of met hun arm geven.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel17
  - number: '18'
    text: |-
      1 Bestuurders die afslaan, moeten het verkeer dat hen op dezelfde weg tegemoet komt of dat op dezelfde weg zich
      naast dan wel links of rechts dicht achter hen bevindt, voor laten gaan.

      2 Bestuurders die naar links afslaan, moeten tegemoetkomende bestuurders die op hetzelfde kruispunt naar rechts
      afslaan voor laten gaan.

      3 Het eerste en het tweede lid gelden niet voor bestuurders van een tram.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel18
  - number: '19'
    text: |-
      De bestuurder moet in staat zijn zijn voertuig tot stilstand te brengen binnen de afstand waarover hij de weg kan
      overzien en waarover deze vrij is.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel19
  - number: '20'
    text: |-
      Binnen de bebouwde kom gelden de volgende maximumsnelheden:

      a. voor motorvoertuigen 50 km per uur;

      b. voor bromfietsen en gehandicaptenvoertuigen, uitgerust met een motor:

      1. op het fiets/bromfietspad 30 km per uur;

      2. op de rijbaan 45 km per uur;

      3. op het fietspad, voor de hier bedoelde gehandicaptenvoertuigen, 30 km per uur;

      c. voor gehandicaptenvoertuigen, uitgerust met een motor, en snorfietsen als bedoeld in
      [artikel 1, eerste lid, onderdeel e, subonderdeel d, van de wet][ref1] op het trottoir of het voetpad 6 km per uur.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel1
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '1'
  - number: '21'
    text: |-
      Buiten de bebouwde kom gelden de volgende maximumsnelheden:

      a. voor motorvoertuigen op autosnelwegen 130 km per uur, op autowegen 100 km per uur en op andere wegen 80 km per
      uur;

      b. voor bromfietsen en gehandicaptenvoertuigen, uitgerust met een motor:

      1. op het fiets/bromfietspad 40 km per uur;

      2. op de rijbaan 45 km per uur;

      3. op het fietspad, voor de hier bedoelde gehandicaptenvoertuigen, 40 km per uur;

      c. voor gehandicaptenvoertuigen, uitgerust met een motor, en snorfietsen als bedoeld in
      [artikel 1, eerste lid, onderdeel e, subonderdeel d, van de wet][ref1] op het trottoir of het voetpad 6 km per uur.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel1
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '1'
  - number: '22'
    text: |-
      Voor zover niet ingevolge andere artikelen van dit besluit een lagere maximumsnelheid geldt, gelden voor de
      volgende voertuigen de volgende bijzondere maximumsnelheden:

      a. voor kampeerwagens die volgens het kentekenbewijs behoren tot de categorie bedrijfsauto’s en waarvan de
      toegestane maximummassa meer bedraagt dan 3500 kg, vrachtauto’s en autobussen, niet zijnde T100-bussen, 80 km per
      uur;

      b. voor T100-bussen 100 km per uur;

      c. voor brommobielen 45 km per uur;

      d. voor snorfietsen 25 km per uur;

      e. voor personenauto’s, bestelauto’s, motorfietsen, driewielige motorvoertuigen en T100-bussen, die een
      aanhangwagen met een toegestane maximummassa van niet meer dan 3500 kg voortbewegen, 90 km per uur;

      f. voor andere dan de in onderdeel e genoemde motorvoertuigen met aanhangwagen 80 km per uur.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel22
  - number: 22a
    text: |-
      1 Voor zover niet ingevolge andere artikelen van dit besluit een lagere maximumsnelheid geldt, geldt als
      maximumsnelheid voor landbouw- en bosbouwtrekkers, motorrijtuigen met beperkte snelheid en mobiele machines, al dan
      niet met aanhangwagen: 25 km per uur.

      2 In afwijking van het eerste lid geldt, voor zover niet ingevolge andere artikelen van dit besluit een lagere
      maximumsnelheid geldt, als maximumsnelheid voor landbouw- en bosbouwtrekkers, motorrijtuigen met beperkte snelheid
      en mobiele machines, al dan niet met aanhangwagen, op wegen:

      a. buiten de bebouwde kom; en

      b. binnen de bebouwde kom:

      1°. die zijn voorzien van een vrijliggend fietspad of fiets/bromfietspad;

      2°. die gesloten zijn voor fietsers; of

      3°. waar een maximumsnelheid van 70 km per uur geldt:

      40 km per uur.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel22a
  - number: '23'
    text: |-
      1 De bestuurder mag zijn voertuig niet laten stilstaan:

      a. op een kruispunt of een overweg;

      b. op een fietsstrook of op de rijbaan langs een fietsstrook;

      c. op een oversteekplaats of binnen een afstand van vijf meter daarvan;

      d. in een tunnel;

      e. bij een bord bushalte ter hoogte van de geblokte markering dan wel, ingeval die markering niet is aangebracht,
      op een afstand van minder dan 12 meter van het bord;

      f. op de rijbaan langs een busstrook en

      g. langs een gele doorgetrokken streep.

      2 Onderdeel *e* van het eerste lid geldt niet voor het onmiddellijk laten in- en uitstappen van passagiers.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel23
  - number: '24'
    text: |-
      1 De bestuurder mag zijn voertuig niet parkeren:

      a. bij een kruispunt op een afstand van minder dan vijf meter daarvan;

      b. voor een inrit of een uitrit;

      c. buiten de bebouwde kom op de rijbaan van een voorrangsweg;

      d. op een parkeergelegenheid:

      1°. voor zover zijn voertuig niet behoort tot de op het bord of op het onderbord aangegeven voertuigcategorie of
      groep voertuigen;

      2°. op een andere wijze of met een ander doel dan op het bord of op het onderbord is aangegeven;

      3°. op dagen of uren waarop dit blijkens het onderbord is verboden;

      e. langs een gele onderbroken streep;

      f. op een gelegenheid bestemd voor het onmiddellijk laden en lossen van goederen;

      g. op een parkeerplaats voor vergunninghouders, aangeduid door verkeersbord E9 van [bijlage I][ref1], indien voor
      zijn voertuig geen vergunning tot parkeren op die plaats is verleend.

      2 Indien onder de verkeersborden E4 tot en met E8, E12 en E13 van [bijlage 1][ref2], op een onderbord dagen of
      uren zijn vermeld, gelden de uit het bord of onderbord voortvloeiende geboden of verboden slechts gedurende de
      aangegeven dagen of uren.

      3 De bestuurder mag zijn voertuig niet dubbel parkeren.

      4 Indien een parkeergelegenheid, aangeduid met een van de verkeersborden E4 tot en met E10, E12 of E13 van
      [bijlage 1][ref3], is voorzien van parkeervakken, mag slechts in die vakken worden geparkeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0004825
      [ref2]: https://wetten.overheid.nl/BWBR0004825
      [ref3]: https://wetten.overheid.nl/BWBR0004825
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004825
      - id: ref2
        bwb_id: BWBR0004825
      - id: ref3
        bwb_id: BWBR0004825
  - number: '25'
    text: |-
      1 Het is verboden in een parkeerschijf-zone te parkeren, behalve op parkeerplaatsen die als zodanig zijn aangeduid
      of aangegeven of plaatsen die zijn voorzien van een blauwe streep.

      2 Op plaatsen die zijn voorzien van een blauwe streep is het parkeren van een motorvoertuig op meer dan twee wielen
      slechts toegestaan indien het motorvoertuig is voorzien van een duidelijk zichtbare parkeerschijf. Indien het
      motorvoertuig is voorzien van een voorruit, wordt de parkeerschijf achter de voorruit geplaatst.

      3 Op de parkeerschijf staat aan de getoonde zijde slechts één cijferreeks, die een aanduiding geeft van de
      kalenderuren, en die vanaf het begin van het parkeren in duidelijk leesbare cijfers tegen een contrasterende
      achtergrond in hele of halve uren het tijdstip weergeeft waarop met het parkeren is begonnen. Een parkeerschijf
      voorzien van een mechanisme dat tijdens het parkeren het tijdstip van aankomst automatisch verschuift, mag niet
      worden gebruikt.

      4 Bij het instellen mag het tijdstip van aankomst naar boven worden afgerond op het eerstvolgende hele of halve
      uur. De toegestane parkeerduur mag niet zijn verstreken.

      5 Indien op een onderbord dagen of uren zijn vermeld, gelden het tweede tot en met het vierde lid slechts gedurende
      die dagen of uren.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel25
  - number: '26'
    text: |-
      1 Op een gehandicaptenparkeerplaats mag slechts worden geparkeerd:

      a. een gehandicaptenvoertuig, indien het parkeren rechtstreeks verband houdt met het vervoer van een gehandicapte;

      b. een motorvoertuig op meer dan twee wielen waarin een geldige gehandicaptenparkeerkaart duidelijk zichtbaar is
      aangebracht, indien het parkeren rechtstreeks verband houdt met het vervoer van de gehandicapte aan wie de kaart is
      verstrekt, dan wel met het vervoer van een of meerdere personen die in een instelling verblijven, indien de kaart
      aan het bestuur van die instelling is verstrekt; of

      c. indien de gehandicaptenparkeerplaats is gereserveerd voor een bepaald voertuig, dat voertuig.

      2 Indien op een onderbord een maximale parkeerduur is vermeld, is [artikel 25, tweede tot en met vijfde lid][ref1],
      van overeenkomstige toepassing, met dien verstande dat de parkeerplaats niet hoeft te zijn voorzien van een blauwe
      streep.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel25
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '25'
        hoofdstuk: II
        paragraaf: '10'
  - number: '27'
    text: |-
      Fietsen en bromfietsen worden geplaatst op het trottoir, op het voetpad of in de berm dan wel op andere door het
      bevoegde gezag aangewezen plaatsen.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel27
  - number: '28'
    text: Bestuurders mogen slechts geluidssignalen en knippersignalen geven ter afwending van dreigend gevaar.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel28
  - number: '29'
    text: |-
      1 Bestuurders van motorvoertuigen in gebruik bij politie en brandweer, motorvoertuigen in gebruik bij
      diensten voor spoedeisende medische hulpverlening, en motorvoertuigen van andere door Onze Minister aangewezen
      hulpverleningsdiensten voeren blauw zwaai-, flits- of knipperlicht en een tweetonige hoorn om kenbaar te maken dat
      zij een dringende taak vervullen.

      2 De in het eerste lid genoemde bestuurders mogen aanvullend op de in dat lid bedoelde verlichting overdag
      knipperende koplampen voeren.

      3 Bij ministeriële regeling kunnen voorschriften worden vastgesteld betreffende het blauwe zwaai-, flits- of
      knipperlicht, de tweetonige hoorn en de knipperende koplampen.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel29
  - number: '30'
    text: |-
      1 Bestuurders van motorvoertuigen die voor nader aan te geven werkzaamheden worden gebruikt, voeren onder nader
      aan te geven omstandigheden geel of groen zwaai-, flits- of knipperlicht. De in [artikel 29, eerste lid][ref1],
      genoemde bestuurders voeren in die gevallen geel of groen zwaai-, flits- of knipperlicht in plaats van blauw
      zwaai-, flits- of knipperlicht. De bestuurder van het motorvoertuig die als eerste of enige de plek bereikt om
      de daar aan hem opgedragen taak uit te voeren, mag in plaats van dat licht, blauw zwaai-, flits- of knipperlicht
      voeren.

      2 Bij ministeriële regeling worden voorschriften vastgesteld betreffende het geel of groen zwaai-, flits- of
      knipperlicht en de werkzaamheden en omstandigheden waarbij deze signalen worden gevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel29
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '29'
        hoofdstuk: II
        paragraaf: '12'
  - number: 30a
    text: |-
      1 Bestuurders van de in [artikel 29, eerste lid][ref1], bedoelde motorvoertuigen mogen onder nader aan te geven
      omstandigheden extra richtingaanwijzers voeren.

      2 Bij ministeriële regeling kunnen voorschriften worden vastgesteld betreffende de in het eerste lid bedoelde
      richtingaanwijzers en de omstandigheden waarin deze worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel29
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '29'
        hoofdstuk: II
        paragraaf: '12'
  - number: 30b
    text: |-
      De [artikelen 29 tot en met 30a][ref1] zijn niet van toepassing op Belgische en Duitse motorvoertuigen in gebruik
      bij politie en brandweer, in gebruik bij diensten voor spoedeisende hulpverlening alsmede motorvoertuigen van
      Belgische en Duitse hulpverleningsdiensten, aangewezen bij of krachtens [artikel 29, eerste lid][ref2], mits deze
      voertuigen elk de signalen voeren overeenkomstig de voor hen in hun eigen land geldende wettelijke regels.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0004825#Artikel29
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel30b
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '29'
        hoofdstuk: II
        paragraaf: '12'
      - id: ref2
        bwb_id: BWBR0004825
        artikel: '29'
        hoofdstuk: II
        paragraaf: '12'
  - number: 30c
    text: |-
      De motorvoertuigen die onderdeel uitmaken van een uitvaartstoet van motorvoertuigen voeren een herkenningsteken.
      Bij ministeriële regeling worden regels gesteld over het herkenningsteken en de wijze waarop dit wordt gevoerd.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel30c
  - number: '31'
    text: |-
      Signalen mogen niet worden gegeven en de in [artikel 30c][ref1] bedoelde herkenningstekens mogen niet worden
      gevoerd in andere gevallen of op andere wijze dan bij of krachtens de artikelen in deze paragraaf is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel30c
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: 30c
        hoofdstuk: II
        paragraaf: '12'
  - number: '32'
    text: |-
      1 Bestuurders van een motorvoertuig, een bromfiets, een snorfiets, niet zijnde een bromfiets als bedoeld in
      [artikel 1, eerste lid, onderdeel e, subonderdeel d, van de wet][ref1], een gehandicaptenvoertuig dat is uitgerust
      met een verbrandingsmotor, of een gehandicaptenvoertuig dat is uitgerust met een elektromotor en voorzien van een
      gesloten carrosserie, voeren bij dag, indien het zicht ernstig wordt belemmerd, en bij nacht dimlicht. Bestuurders
      van een gehandicaptenvoertuig dat is uitgerust met een elektromotor en niet is voorzien van een gesloten
      carrosserie voeren alsdan de in [artikel 5.18.43, eerste lid, van de Regeling voertuigen][ref2] bedoelde lichten.

      2 Het voeren van groot licht in plaats van dimlicht is toegestaan behoudens in de volgende gevallen:

      a. bij dag;

      b. bij het tegenkomen van een andere weggebruiker en

      c. bij het op korte afstand volgen van een ander voertuig.

      3 Achterlicht en de verlichting van de achterkentekenplaat moeten steeds gelijktijdig met groot licht, dimlicht,
      stadslicht of mistlicht branden.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0025798#Artikel5.18.43
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0025798
        artikel: 5.18.43
  - number: '33'
    text: |-
      Gekoppelde aanhangwagens moeten bij dag, indien het zicht ernstig wordt belemmerd, en bij nacht achterlicht,
      verlichting van de achterkentekenplaat en het in de [Regeling voertuigen][ref1] voorgeschreven stadslicht voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0025798
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0025798
  - number: '34'
    text: |-
      1 Bij mist, sneeuwval of regen, die het zicht ernstig belemmert, mogen bestuurders van een motorvoertuig en van
      een gehandicaptenvoertuig mistlicht aan de voorzijde voeren. In dat geval hoeven die bestuurders geen dimlicht
      te voeren.

      2 Bij mist of sneeuwval, die het zicht beperkt tot een afstand van minder dan 50 meter mag mistachterlicht worden
      gevoerd.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel34
  - number: '35'
    text: |-
      1 Fietsers voeren tijdens het rijden bij nacht of bij dag indien het zicht ernstig wordt belemmerd, verlichting
      overeenkomstig het tweede tot en met het vierde lid.

      2 Een fiets op twee wielen en een fiets op drie wielen met één voorwiel moeten zijn voorzien van een wit of geel
      licht dat aan de voorzijde wordt gevoerd, tenzij de bestuurder een wit of geel licht voert op zijn borst.

      3 Op een fiets op meer dan twee wielen met twee voorwielen moeten aan de voorzijde twee witte of twee gele
      symmetrisch links en rechts van het midden bevestigde lichten worden gevoerd.

      4 Een fiets moet zijn voorzien van een rood achterlicht dat aan de achterzijde wordt gevoerd, tenzij de bestuurder
      of een achter de bestuurder gezeten passagier een rood licht voert op zijn rug.

      5 Een fiets mag zijn voorzien van twee ambergeel licht stralende richtingaanwijzers aan de voorzijde en twee aan
      de achterzijde.

      6 Er mogen niet meer lichten worden gevoerd op een fiets, door de bestuurder daarvan of door een achter de
      bestuurder gezeten passagier dan de in het tweede tot en met vijfde lid genoemde lichten.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel35
  - number: 35a
    text: |-
      1 De in [artikel 35][ref1] bedoelde verlichting mag andere weggebruikers niet verblinden.

      2 De in [artikel 35, eerste tot en met vierde lid][ref2], bedoelde verlichting mag niet knipperen.

      3 De in [artikel 35, eerste tot en met vierde lid][ref3], bedoelde verlichting moet:

      a. aan de voorzijde voortdurend zichtbaar zijn voor tegemoetkomende weggebruikers;

      b. aan de achterzijde voortdurend zichtbaar zijn voor van achteren naderende weggebruikers.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0004825#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0004825#Artikel35
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '35'
        hoofdstuk: II
        paragraaf: '13'
      - id: ref2
        bwb_id: BWBR0004825
        artikel: '35'
        hoofdstuk: II
        paragraaf: '13'
      - id: ref3
        bwb_id: BWBR0004825
        artikel: '35'
        hoofdstuk: II
        paragraaf: '13'
  - number: 35b
    text: |-
      1 Bestuurders van een wagen voeren bij dag, indien het zicht ernstig wordt belemmerd, of bij nacht voor- en
      achterlicht.

      2 Bestuurders van een gehandicaptenvoertuig, dat niet is uitgerust met een motor, voeren bij dag, indien het zicht
      ernstig wordt belemmerd, of bij nacht voor- en achterlicht indien zij gebruik maken van de rijbaan, het fietspad of
      het fiets-/bromfietspad.
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel35b
  - number: 35c
    text: |-
      De [artikelen 35, eerste tot en met vierde lid en zesde lid][ref1], en [35a][ref2] zijn van
      overeenkomstige toepassing op bestuurders van snorfietsen, zijnde bromfietsen als bedoeld in
      [artikel 1, eerste lid, onderdeel e, subonderdeel d, van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0004825#Artikel35a
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel1
    url: https://wetten.overheid.nl/BWBR0004825/2024-07-01#Artikel35c
