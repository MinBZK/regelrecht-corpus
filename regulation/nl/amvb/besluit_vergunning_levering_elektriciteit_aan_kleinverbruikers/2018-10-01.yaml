  - number: '2'
    text: |-
      1 Een aanvraag voor een vergunning wordt bij de Autoriteit Consument en Markt ingediend.

      2 De aanvraag voor een vergunning bevat in aanvulling op
      [artikel 4:2, eerste lid, van de Algemene wet bestuursrecht][ref1]:

      a. de overeenkomst van erkenning als volledig programma-verantwoordelijke van de aanvrager of een contract van
      de aanvrager met een andere partij voor het overdragen van de programma-verantwoordelijkheid en de erkenning als
      volledig programma-verantwoordelijke van deze partij,

      b. een recente jaarrekening of een openingsbalans, welke is voorzien van een
      verklaring omtrent de getrouwheid, ondertekend door een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2],

      c. een recente verklaring van de rechtbank op basis van de registers, bedoeld in de [artikelen 19][ref3] en
      [222a van de Faillissementswet][ref4], waaruit blijkt dat de aanvrager niet in staat van faillissement verkeert en
      dat de aanvrager geen surseance van betaling is verleend,

      d. een beschrijving van de organisatie van de aanvrager, waarin in ieder geval is opgenomen de voorziene
      administratieve organisatie, met inbegrip van de financiële administratie, en de interne of externe controle
      hierop,

      e. voorbeelden van alle door de aanvrager gehanteerde offertes en overeenkomsten voor kleinverbruikers met de
      hierbij behorende algemene voorwaarden en

      f. de door de aanvrager gehanteerde klachten- en geschillenregeling voor kleinverbruikers.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel393
      [ref3]: https://wetten.overheid.nl/BWBR0001860#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0001860#Artikel222a
