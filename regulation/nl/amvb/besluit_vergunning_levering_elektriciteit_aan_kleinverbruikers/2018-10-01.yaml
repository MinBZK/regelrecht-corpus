  - number: '3'
    text: |-
      1 De aanvrager beschikt over de benodigde organisatorische, financiële en technische kwaliteiten indien:

      a. de aanvrager of, indien de aanvrager de programma-verantwoordelijkheid heeft overgedragen, degene aan wie de
      aanvrager de programma-verantwoordelijkheid heeft overgedragen, voor voldoende lange termijn een erkenning als
      volledig programma-verantwoordelijke is verleend,

      b. de aanvrager over een goede administratieve organisatie, met inbegrip van de financiële administratie, en over
      een goede interne of externe controle hierop beschikt, waarin op ordentelijke wijze per kleinverbruiker waarmee een
      leveringsovereenkomst is gesloten in ieder geval de volgende gegevens zijn opgenomen:

      1°. naam, adres, woonplaats en indien beschikbaar, telefoonnummer en e-mailadres van de kleinverbruiker;

      2°. factuuradres en bankrekeningnummer en indien beschikbaar het mandaat voor automatische afschrijving van de
      kleinverbruiker;

      3°. hoogte en betalingsfrequentie van het voorschotbedrag;

      4°. indien van toepassing, dat sprake is van teruglevering van elektriciteit;

      5°. EAN-code die is toegekend aan de aansluiting en waarvoor de leveringsovereenkomst is gesloten;

      6°. naam van de betreffende netbeheerder,

      c. de aanvrager niet in staat van faillissement verkeert en

      d. de aanvrager geen surseance van betaling is verleend.

      2 De aanvrager hanteert redelijke voorwaarden indien hij:

      a. duidelijke offertes en overeenkomsten hanteert, waarin de hoogte van de tarieven en de opbouw hiervan is
      aangegeven,

      b. een transparante en redelijke betalingsregeling hanteert,

      c. een transparante en redelijke regeling voor het opzeggen of ontbinden van overeenkomsten hanteert en

      d. in staat is klachten en geschillen op een adequate wijze te behandelen.

      3 De gegevens, bedoeld in het tweede lid, onderdeel b, zijn op ordentelijke wijze in
      de administratie opgenomen indien deze gegevens in het kader van de toepassing van
      [artikel 2, zesde lid, onderdeel b, het Besluit leveringszekerheid Elektriciteitswet 1998][ref1] in een
      machineleesbaar en interoperabel formaat uitwisselbaar zijn met andere vergunninghouders.


      [ref1]: https://wetten.overheid.nl/BWBR0019567#Artikel2
