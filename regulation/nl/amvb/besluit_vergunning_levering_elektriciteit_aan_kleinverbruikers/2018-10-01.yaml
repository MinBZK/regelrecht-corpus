articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. wet: de [Elektriciteitswet 1998][ref1];

      b. kleinverbruiker: de in [artikel 95a, eerste lid, van de wet][ref2] bedoelde afnemer;

      c. vergunning: de vergunning als bedoeld in [artikel 95a, eerste lid, van de wet][ref3];

      d. aanvraag: de aanvraag om een vergunning voor de levering van elektriciteit aan kleinverbruikers;

      e. aanvrager: degene die een vergunning voor de levering van elektriciteit aan kleinverbruikers aanvraagt;

      f. erkenning als volledig programma-verantwoordelijke: de door de netbeheerder van het landelijk hoogspanningsnet
      op basis van de voorwaarden, vastgesteld ingevolge [artikel 36][ref4] of [artikel 37 van de wet][ref5], afgegeven
      erkenning van een partij als volledig programma-verantwoordelijke.


