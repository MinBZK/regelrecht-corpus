  - number: '18'
    text: |-
      1 Er is een advies- en arbitragecommissie defensieambtenaren die tot taak heeft te adviseren of een bindende
      uitspraak te doen, in de geschillen die haar ingevolge de [artikelen 15 tot en met 17][ref1] worden voorgelegd.
      Zij is gevestigd te ’s-Gravenhage. Zij bestaat uit vijf leden, onder wie de voorzitter, en vijf plaatsvervangende
      leden. De leden worden bij Koninklijk besluit benoemd voor een tijdvak van ten hoogste vier jaar. Herbenoeming kan
      tweemaal en telkens voor ten hoogste vier jaar plaatsvinden.

      2 Uitgesloten van het lidmaatschap en plaatsvervangend lidmaatschap zijn:

      a. personen die lid of plaatsvervangend lid zijn van de sectorcommissie of dat binnen een periode van twee jaar
      zijn geweest;

      b. personen die bestuurslid zijn, of werkzaam zijn bij een centrale of een daarbij aangesloten vereniging of dat
      binnen een periode van twee jaar zijn geweest

      c. personen die werkzaam zijn, of binnen een periode van twee jaar werkzaam zijn geweest, bij de departementen
      van algemeen bestuur en de daaronder ressorterende instellingen, diensten en bedrijven wier onafhankelijkheid en
      onpartijdigheid op grond van hun dienstverband door de deelnemers aan het overleg onvoldoende wordt geacht.

      3 Onze Minister wijst in overeenstemming met de Sectorcommissie en met de voorzitter van de Advies- en
      Arbitragecommissie defensieambtenaren een secretaris aan die de Advies- en Arbitragecommissie defensieambtenaren
      bijstaat.

      4 Aan de leden en plaatsvervangende leden wordt vergoeding voor reis- en verblijfkosten verleend op grond van het
      [Besluit dienstreizen defensie][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006042#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0007956
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel18
    references:
