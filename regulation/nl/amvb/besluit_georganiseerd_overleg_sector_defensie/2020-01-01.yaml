      - id: ref2
        bwb_id: BWBR0007956
  - number: '19'
    text: |-
      1 De advies- en arbitragecommissie treedt in geval van advies op in een samenstelling van drie leden, onder wie de
      voorzitter, één van de twee leden, genoemd in [artikel 110][ref1] en één van de twee leden, genoemd in het derde
      lid, onder *b*, van dat artikel. De overige twee leden treden te zamen met de voorzitter op in geval van arbitrage.
      Bij verhindering van één van de leden treedt diens plaatsvervanger op.

      2 Indien het verzoek om arbitrage naar het oordeel van de voorzitter eenzelfde geschil betreft als waarover door
      de advies- en arbitragecommissie reeds advies is uitgebracht, treedt voor een lid dat bij het uitbrengen van dat
      advies betrokken was, diens plaatsvervanger op.

      3 De voorzitter van de advies- en arbitragecommissie draagt er zorg voor dat het advies of de uitspraak binnen vier
      weken nadat de kennisgeving, genoemd in [artikel 17][ref2], is ontvangen, aan de deelnemers aan het overleg ter
      kennis wordt gebracht.

      4 De advies- en arbitragecommissie stelt nadere regels vast met betrekking tot haar werkwijze.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel110g
      [ref2]: https://wetten.overheid.nl/BWBR0006042#Artikel17
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 110g
      - id: ref2
        bwb_id: BWBR0006042
        artikel: '17'
        hoofdstuk: '2'
  - number: '20'
    text: >-
      1 De advies- en arbitragecommissie neemt een beslissing bij meerderheid van stemmen.


      2 Het advies of de uitspraak moet inhouden:


      a. de namen van de deelnemers die het advies respectievelijk de arbitrale uitspraak hebben aangevraagd;


      b. een overzicht van de standpunten van alle deelnemers over het onderwerp en de inhoud van het geschil;


      c. het advies, respectievelijk de beslissing en de redenen die daaraan ten grondslag liggen.


      3 Het advies, respectievelijk de uitspraak, wordt gedagtekend en door ieder van de optredende leden van de advies-
      en arbitragecommissie ondertekend.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel20
  - number: '21'
    text: Binnen twee weken na ontvangst van het advies wordt het overleg over het geschil voortgezet.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel21
  - number: '22'
    text: De uitspraak van de advies- en arbitragecommissie heeft bindende kracht.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel22
  - number: '23'
    text: >-
      Het standpunt van de sectorcommissie over de in het overleg besproken aangelegenheden wordt schriftelijk aan Onze
      Minister bevestigd, waarbij desverlangd een samenvatting van de aan dit standpunt ten grondslag liggende argumenten
      wordt gegeven. Indien in de sectorcommissie een minderheidsstandpunt is, wordt daarvan desverlangd melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel23
  - number: '24'
    text: >-
      Indien over een aangelegenheid in afwijking van het standpunt van de sectorcommissie wordt beslist, brengt Onze
      minister de redenen van die afwijking zo spoedig mogelijk ter kennis van de sectorcommissie.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel24
  - number: '25'
    text: |-
      1 Het secretariaat van het overleg wordt gevoerd door een door Onze Minister aangewezen secretaris. Over de
      aanwijzing van de secretaris wordt de sectorcommissie gehoord. Onze Minister kan adjunct-secretarissen aanwijzen.

      2 De secretaris staat, onder leiding van de voorzitter van het overleg, ter beschikking van de voorzitter en van de
      in [artikel 7, tweede lid][ref1], bedoelde functionarissen, alsmede van de sectorcommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0006042#Artikel7
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0006042
        artikel: '7'
        hoofdstuk: '2'
  - number: '26'
    text: >-
      1 Van het in de vergaderingen van het overleg met de sectorcommissie en de werkgroepen en kamers behandelde, maakt
      de secretaris notulen. De voorzitter legt deze notulen aan de commissie, onderscheidenlijk de betrokken werkgroep
      of kamer, ter goedkeuring voor.


      2 Van het in een vergadering van het overleg met de sectorcommissie behandelde kan in overleg met die commissie een
      beknopte, voor publikatie bestemde samenvatting worden opgesteld.


      3 Na overleg met de sectorcommissie, onderscheidenlijk met de betrokken werkgroep of kamer, kan degene, die met
      de leiding van de vergadering is belast, ten aanzien van het behandelde in die vergadering geheimhouding opleggen.
      De plicht tot geheimhouding geldt niet voor zover de leden of plaatsvervangende leden van de sectorcommissie, dan
      wel de leden of plaatsvervangende leden van de betrokken werkgroep of kamer in bespreking treden met de door hen
      vertegenwoordigde centrale.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel26
  - number: '38'
    text: |-
      Onze Minister kan in afwijking van [artikel 6, eerste lid][ref1], bepalen dat het aantal vertegenwoordigers van de
      centrales in de sectorcommissie tijdelijk wordt verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0006042#Artikel6
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0006042
        artikel: '6'
        hoofdstuk: '2'
  - number: '39'
    text: >-
      1 Onze Minister kan in geval van buitengewone omstandigheden, tijdelijk afwijken van hetgeen bij of krachtens dit
      besluit is bepaald, voor zover en voor zolang dit met het oog op de goede uitvoering van de operationele taken van
      de krijgsmacht noodzakelijk wordt geacht.


      2 Onze Minister kan bepalen of doen bepalen, dat hetgeen bij of krachtens dit besluit is bepaald buiten toepassing
      blijft, voor zover en voor zolang zulks naar zijn oordeel, in overeenstemming met het gevoelen van de Raad van
      Ministers, door het landsbelang wordt gevorderd.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel39
  - number: '40'
    text: |-
      Na inwerkingtreding van de [Wet normalisering rechtspositie ambtenaren][ref1] berust dit besluit op de
      [artikelen 12][ref2] en [12o van de Wet ambtenaren defensie][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0039393
      [ref2]: https://wetten.overheid.nl/BWBR0001952#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0001952#Artikel12o
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0039393
      - id: ref2
        bwb_id: BWBR0001952
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0001952
        artikel: 12o
  - number: '42'
    text: >-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin het wordt
      geplaatst en werkt terug tot en met 1 april 1993.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel42
  - number: '43'
    text: 'Dit besluit wordt aangehaald als: Besluit georganiseerd overleg sector Defensie.'
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel43
