  - number: '2'
    text: >-
      Er is een sectorcommissie Defensie voor het georganiseerd overleg over aangelegenheden van algemeen belang voor de
      rechtstoestand van militaire ambtenaren en ambtenaren.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel2
  - number: '3'
    text: |-
      1 Over aangelegenheden van algemeen belang voor de rechtstoestand, met inbegrip van de algemene regels volgens
      welke het personeelsbeleid zal worden gevoerd, betreffende de militaire ambtenaren en de ambtenaren wordt niet
      beslist alvorens daarover door of namens Onze Minister overleg is gevoerd met de sectorcommissie.

      2 Onze Minister is bevoegd in afwijking van het eerste lid, de sectorcommissie gehoord, te beslissen dat bepaalde
      aangelegenheden van algemeen belang voor de rechtstoestand van de militaire ambtenaren of van de ambtenaren alsmede
      bepaalde algemene regels volgens welke het personeelsbeleid zal worden gevoerd, geen onderwerp van overleg zullen
      uitmaken.

      3 Een voorstel, voor zover het strekt tot het regelen van rechten of verplichtingen van individuele militaire
      ambtenaren of individuele ambtenaren, wordt slechts ten uitvoer gebracht indien daarover overeenstemming bestaat
      met de sectorcommissie. Het standpunt van de sectorcommissie wordt bepaald bij meerderheid van stemmen. Elke
      centrale brengt één stem uit. Indien de stemmen binnen de sectorcommissie staken, beslist de voorzitter van het
      overleg met de sectorcommissie of het voorstel ten uitvoer wordt gebracht.

      4 Het derde lid is niet van toepassing op een voorstel strekkende tot:

      a. het invoeren of wijzigen van een regeling bij of krachtens de wet, voor zover die betrekking heeft op de
      inrichting van de krijgsmacht, het verzekeren van de beschikbaarheid, de inzetbaarheid, de personele vulling of het
      ongestoorde functioneren van de krijgsmacht;

      b. het invoeren of wijzigen van een wettelijke regeling die betrekking heeft op alle burgers of alle werknemers,
      waaronder begrepen militaire ambtenaren en ambtenaren;

      c. het invoeren of wijzigen van een wettelijke regeling voor militaire ambtenaren of voor ambtenaren
      met een overeenkomstige inhoud als een voorstel tot het invoeren of wijzigen van een wettelijke
      regeling die betrekking heeft op werknemers die krachtens arbeidsovereenkomst als bedoeld in
      [artikel 7:610, eerste lid, van het Burgerlijk Wetboek][ref1] werkzaam zijn;

      d. het van toepassing verklaren op militaire ambtenaren of ambtenaren van een wettelijke
      regeling die betrekking heeft op werknemers die krachtens arbeidsovereenkomst als bedoeld in
      [artikel 7:610, eerste lid, van het Burgerlijk Wetboek][ref2] werkzaam zijn en tot met die van toepassing
      verklaring samenhangende wijzigingen in voor militaire ambtenaren of ambtenaren geldende regelingen, een en
      ander mits het totaal van rechten en verplichtingen van de militaire ambtenaren of de ambtenaren over het geheel
      beoordeeld niet ongunstiger wordt;

      e. de implementatie van verplichtingen voortvloeiend uit een verdrag of uit een besluit van een volkenrechtelijke
      organisatie;

      5 Indien in het overleg een geschil ontstaat over de vraag of bij een voorstel als bedoeld in het vierde lid
      onder d, voldaan wordt aan de voorwaarde dat het totaal van rechten en verplichtingen van militaire ambtenaren of
      ambtenaren over het geheel beoordeeld niet ongunstiger wordt, wordt dat geschil onderworpen aan arbitrage door de
      advies- en arbitragecommissie, bedoeld in [artikel 18][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel610
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel610
      [ref3]: https://wetten.overheid.nl/BWBR0006042#Artikel18
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel3
