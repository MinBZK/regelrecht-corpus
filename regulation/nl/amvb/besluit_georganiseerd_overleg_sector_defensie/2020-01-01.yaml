  - number: '14'
    text: |-
      De [artikelen 15 tot en met 22][ref1] zijn slechts van toepassing op geschillen inzake aangelegenheden als bedoeld
      in [artikel 3][ref2], voorzover die aangelegenheden uitsluitend de rechtstoestand van militaire ambtenaren of
      ambtenaren, met inbegrip van de algemene regels volgens welke het personeelsbeleid zal worden gevoerd, betreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0006042#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0006042#Artikel3
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006042
        artikel: '15'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0006042
        artikel: '3'
        hoofdstuk: '2'
  - number: '15'
    text: >-
      Indien de voorzitter dan wel één of meer van de centrales, in het overleg tot het oordeel komen dat dit overleg
      niet tot een uitkomst zal leiden die de instemming van alle deelnemers aan dat overleg zal hebben, brengen zij
      dat oordeel binnen drie dagen nadat zij daarvan in het overleg blijk hebben gegeven schriftelijk ter kennis van de
      overige deelnemers aan het overleg.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel15
  - number: '16'
    text: |-
      1 Binnen vijf dagen na de kennisgeving, genoemd in [artikel 15][ref1], schrijft de voorzitter een
      overlegvergadering uit. De vergadering moet worden gehouden binnen één week, nadat deze is uitgeschreven.

      2 Tenzij door de voorzitter en de sectorcommissie wordt besloten het overleg voort te zetten dan wel te beëindigen,
      wordt in de vergadering nagegaan of overeenstemming bestaat over de vraag wat het onderwerp en de inhoud van het
      geschil is en of een oplossing van dat geschil zal worden gezocht door middel van voortzetting van het overleg,
      nadat het advies is ingewonnen van de advies- en arbitragecommissie, dan wel door middel van onderwerping van het
      geschil aan een arbitrale uitspraak van de advies- en arbitragecommissie.

      3 Tot het inwinnen van advies is zowel de voorzitter als de sectorcommissie bevoegd.

      4 Voor onderwerping van het geschil aan arbitrage is overeenstemming vereist tussen alle deelnemers aan het
      overleg.


      [ref1]: https://wetten.overheid.nl/BWBR0006042#Artikel15
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006042
        artikel: '15'
        hoofdstuk: '2'
  - number: '17'
    text: |-
      1 Binnen drie dagen na de vergadering, genoemd in [artikel 16][ref1], wordt het verzoek om advies ter kennis
      gebracht van de voorzitter van de advies- en arbitragecommissie. Het verzoek wordt ondertekend door de deelnemers
      aan het overleg die zich voor inwinning van advies hebben uitgesproken, en bevat tenminste het onderwerp en de
      inhoud van het geschil. Indien in de vergadering, genoemd in [artikel 16][ref2], geen overeenstemming is bereikt
      tussen alle deelnemers aan het overleg over de vraag wat het onderwerp en de inhoud van het geschil is, brengen
      de overige deelnemers aan het overleg hun visie op het onderwerp en de inhoud van het geschil eveneens binnen drie
      dagen ter kennis van de voorzitter van de advies- en arbitragecommissie.

      2 De eerste zin van het eerste lid is van overeenkomstige toepassing op het onderwerpen van het geschil aan een
      arbitrale uitspraak. Het verzoek daartoe wordt ondertekend door alle deelnemers aan het overleg en dient tenminste
      te bevatten:

      a. het onderwerp en de inhoud van het geschil;

      b. de standpunten van alle deelnemers aan het overleg omtrent het onderwerp en de inhoud van het geschil.


      [ref1]: https://wetten.overheid.nl/BWBR0006042#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0006042#Artikel16
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel17
    references:
      - id: ref1
