$id: besluit_georganiseerd_overleg_sector_defensie
regulatory_layer: AMVB
publication_date: '2019-10-10'
valid_from: '2020-01-01'
bwb_id: BWBR0006042
url: https://wetten.overheid.nl/BWBR0006042/2020-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze minister van Defensie van 1 februari 1993, nr. PAV2210/93002671;

    Gelet op artikel 12, onder p, van de Militaire Ambtenarenwet 1931, artikel 125, eerste lid, onder m van de
    Ambtenarenwet 1929 en artikel 2, onder m, van de Wet rechtstoestand dienstplichtigen;

    De Raad van State gehoord (advies van 29 maart 1993, nr. W07.93.0060);

    Gezien het nader rapport van Onze Minister van Defensie van 16 juni 1993, nr. PAV 2210/93008962;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Defensie;'
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel1
  - number: 1.b
    text: |-
      militaire ambtenaar: de militaire ambtenaar, genoemd in
      [artikel 1, eerste en tweede lid van de Militaire Ambtenarenwet 1931][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001952#Artikel1
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001952
        artikel: '1'
  - number: 1.c
    text: |-
      ambtenaar: de ambtenaar, genoemd in [artikel 1 van het Burgerlijk ambtenarenreglement defensie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006040#Artikel1
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006040
        artikel: '1'
  - number: 1.d
    text: |-
      centrale: een centrale van verenigingen, welke zich mede ten doel stellen het behartigen van de belangen van de
      militaire ambtenaren of de ambtenaren op het terrein van de rechtstoestand;
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel1
  - number: 1.e
    text: |-
      sectorcommissie: de commissie, genoemd in [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006042#Artikel2
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006042
        artikel: '2'
        hoofdstuk: '2'
  - number: 1.f
    text: 'ministerie: het Ministerie van Defensie en de daaronder ressorterende diensten, bedrijven en instellingen;'
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel1
  - number: '2'
    text: |-
      Er is een sectorcommissie Defensie voor het georganiseerd overleg over aangelegenheden van algemeen belang voor de
      rechtstoestand van militaire ambtenaren en ambtenaren.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel2
  - number: '3.1'
    text: |-
      Over aangelegenheden van algemeen belang voor de rechtstoestand, met inbegrip van de algemene regels volgens welke
      het personeelsbeleid zal worden gevoerd, betreffende de militaire ambtenaren en de ambtenaren wordt niet beslist
      alvorens daarover door of namens Onze Minister overleg is gevoerd met de sectorcommissie.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel3
  - number: '3.2'
    text: |-
      Onze Minister is bevoegd in afwijking van het eerste lid, de sectorcommissie gehoord, te beslissen dat bepaalde
      aangelegenheden van algemeen belang voor de rechtstoestand van de militaire ambtenaren of van de ambtenaren alsmede
      bepaalde algemene regels volgens welke het personeelsbeleid zal worden gevoerd, geen onderwerp van overleg zullen
      uitmaken.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel3
  - number: '3.3'
    text: |-
      Een voorstel, voor zover het strekt tot het regelen van rechten of verplichtingen van individuele militaire
      ambtenaren of individuele ambtenaren, wordt slechts ten uitvoer gebracht indien daarover overeenstemming bestaat
      met de sectorcommissie. Het standpunt van de sectorcommissie wordt bepaald bij meerderheid van stemmen. Elke
      centrale brengt één stem uit. Indien de stemmen binnen de sectorcommissie staken, beslist de voorzitter van het
      overleg met de sectorcommissie of het voorstel ten uitvoer wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel3
  - number: '3.4'
    text: 'Het derde lid is niet van toepassing op een voorstel strekkende tot:'
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel3
  - number: 3.4.a
    text: |-
      het invoeren of wijzigen van een regeling bij of krachtens de wet, voor zover die betrekking heeft op de
      inrichting van de krijgsmacht, het verzekeren van de beschikbaarheid, de inzetbaarheid, de personele vulling of het
      ongestoorde functioneren van de krijgsmacht;
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel3
  - number: 3.4.b
    text: |-
      het invoeren of wijzigen van een wettelijke regeling die betrekking heeft op alle burgers of alle werknemers,
      waaronder begrepen militaire ambtenaren en ambtenaren;
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel3
  - number: 3.4.c
    text: |-
      het invoeren of wijzigen van een wettelijke regeling voor militaire ambtenaren of voor ambtenaren
      met een overeenkomstige inhoud als een voorstel tot het invoeren of wijzigen van een wettelijke
      regeling die betrekking heeft op werknemers die krachtens arbeidsovereenkomst als bedoeld in
      [artikel 7:610, eerste lid, van het Burgerlijk Wetboek][ref1] werkzaam zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel610
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '610'
  - number: 3.4.d
    text: |-
      het van toepassing verklaren op militaire ambtenaren of ambtenaren van een wettelijke
      regeling die betrekking heeft op werknemers die krachtens arbeidsovereenkomst als bedoeld in
      [artikel 7:610, eerste lid, van het Burgerlijk Wetboek][ref1] werkzaam zijn en tot met die van toepassing
      verklaring samenhangende wijzigingen in voor militaire ambtenaren of ambtenaren geldende regelingen, een en
      ander mits het totaal van rechten en verplichtingen van de militaire ambtenaren of de ambtenaren over het geheel
      beoordeeld niet ongunstiger wordt;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel610
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '610'
  - number: 3.4.e
    text: |-
      de implementatie van verplichtingen voortvloeiend uit een verdrag of uit een besluit van een volkenrechtelijke
      organisatie;
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel3
  - number: '3.5'
    text: |-
      Indien in het overleg een geschil ontstaat over de vraag of bij een voorstel als bedoeld in het vierde lid onder d,
      voldaan wordt aan de voorwaarde dat het totaal van rechten en verplichtingen van militaire ambtenaren of ambtenaren
      over het geheel beoordeeld niet ongunstiger wordt, wordt dat geschil onderworpen aan arbitrage door de advies- en
      arbitragecommissie, bedoeld in [artikel 18][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006042#Artikel18
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006042
        artikel: '18'
        hoofdstuk: '2'
  - number: '4.1'
    text: 'De sectorcommissie bestaat uit vertegenwoordigers van:'
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel4
  - number: 4.1.a
    text: de Algemene Centrale van Overheidspersoneel (ACOP);
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel4
  - number: 4.1.b
    text: de Christelijke Centrale voor Overheids- en Onderwijspersoneel (CCOOP);
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel4
  - number: 4.1.c
    text: het Ambtenarencentrum (AC);
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel4
  - number: 4.1.d
    text: de Centrale van Middelbare en Hogere Functionarissen bij Overheid, Onderwijs, Bedrijven en Instellingen (CMHF).
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel4
  - number: '4.2'
    text: |-
      Bij koninklijk besluit kunnen voorts tot het overleg worden toegelaten centrales die, gelet op hun ledental en
      de samenstelling daarvan, representatief zijn voor de militaire ambtenaren bij de gehele krijgsmacht en voor de
      ambtenaren bij het ministerie, voor zover het algemeen belang zich hiertegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel4
  - number: '4.3'
    text: |-
      Een toelating krachtens het tweede lid vindt niet plaats, alvorens Onze Minister daarover het advies van de
      sectorcommissie heeft ingewonnen.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel4
  - number: '4.4'
    text: |-
      Bij koninklijk besluit kan een toelating tot het overleg krachtens het eerste lid worden geschorst en kan een
      toelating tot het overleg krachtens het tweede lid, dan wel een toelating krachtens [artikel 5][ref1] worden
      ingetrokken, indien de centrale niet meer representatief is, dan wel het algemeen belang of het belang van een goed
      overleg zich tegen verdere deelneming aan het overleg verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0006042#Artikel5
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006042
        artikel: '5'
        hoofdstuk: '2'
  - number: '4.5'
    text: |-
      Vanaf de dag waarop het voornemen tot schorsing dan wel intrekking van de toelating tot het overleg aan het bestuur
      van de betrokken centrale kenbaar is gemaakt, tot aan de dag waarop daarover een beslissing is genomen, nemen
      vertegenwoordigers van deze centrale niet meer deel aan het overleg.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel4
  - number: '4.6'
    text: |-
      De schorsing wordt opgeheven met ingang van de dag waarop de reden is vervallen die tot de schorsing aanleiding
      gaf.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel4
  - number: '6.1'
    text: |-
      Een centrale, die tot het overleg in de sectorcommissie is toegelaten, is bevoegd tot het aanwijzen van twee leden
      en twee plaatsvervangende leden. Van deze aanwijzing geeft de centrale kennis aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel6
  - number: '6.2'
    text: |-
      Onze Minister is bevoegd een lid of een plaatsvervangend lid van de sectorcommissie van het deelnemen aan het
      overleg uit te sluiten, indien naar het oordeel van Onze Minister het dienstbelang dit vordert in verband met
      de aard van de werkzaamheden als militair ambtenaar of als ambtenaar van dat lid of plaatsvervangend lid. De
      beslissing tot uitsluiting wordt niet genomen, alvorens het bestuur van de betrokken centrale over het voornemen
      daartoe is gehoord en het advies van de vertegenwoordigers van de overige centrales daarover is ingewonnen.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel6
  - number: '6.3'
    text: |-
      Vanaf de dag waarop het voornemen tot uitsluiting aan het bestuur van de centrale is kenbaar gemaakt, neemt het
      betrokken lid of plaatsvervangend lid niet meer deel aan het overleg.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel6
  - number: '6.4'
    text: |-
      Na de uitsluiting wijst het bestuur van de centrale een ander lid of plaatsvervangend lid aan als zijn
      vertegenwoordiger in de sectorcommissie.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel6
  - number: '7.1'
    text: |-
      Het overleg met de sectorcommissie staat onder leiding van Onze Minister. Onze Minister is bevoegd de leiding van
      het overleg op te dragen aan de hoofddirecteur personeel van het ministerie, indien de aard van de te bespreken
      aangelegenheden dit toelaat.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel7
  - number: '7.2'
    text: |-
      Onze Minister wijst functionarissen aan die hem, of de functionaris die namens hem het overleg voert, bij het
      overleg terzijde staan.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel7
  - number: '7.3'
    text: |-
      Bij de behandeling van bepaalde aangelegenheden kan op uitnodiging of met toestemming van de voorzitter van het
      overleg door andere dan de in de vorige leden bedoelde personen aan het overleg worden deelgenomen.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel7
  - number: '7.4'
    text: |-
      De voorzitter van het overleg kan aan de leden van de sectorcommissie toestemming verlenen zich bij de behandeling
      van een bepaald onderwerp ter vergadering door deskundigen te laten bijstaan.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel7
  - number: '8.1'
    text: |-
      De centrale die van de in [artikel 6, eerste lid][ref1], genoemde bevoegdheid gebruik maakt, doet aan Onze Minister
      mededeling van de statuten, het huishoudelijk reglement en van de daarin aangebrachte wijzigingen, alsmede van
      de statuten en de daarin aangebrachte wijzigingen van de bij die centrale aangesloten verenigingen die militaire
      ambtenaren of ambtenaren als leden hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0006042#Artikel6
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006042
        artikel: '6'
        hoofdstuk: '2'
  - number: '8.2'
    text: |-
      Bij de aanvang van elk kalenderjaar verstrekt iedere centrale aan Onze Minister een opgave van het aantal militaire
      ambtenaren en het aantal ambtenaren dat lid is van de bij die centrale aangesloten verenigingen.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel8
  - number: '9.1'
    text: |-
      Aangelegenheden, die ingevolge [artikel 3][ref1] in het overleg met de sectorcommissie worden behandeld, of
      waarover deze commissie moet worden gehoord, worden door Onze Minister voorgelegd aan de sectorcommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0006042#Artikel3
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006042
        artikel: '3'
        hoofdstuk: '2'
  - number: '9.2'
    text: |-
      Elke centrale die in de sectorcommissie is vertegenwoordigd, kan Onze Minister verzoeken een aangelegenheid als
      bedoeld in [artikel 3][ref1] in een vergadering van het overleg te behandelen. Aan het verzoek wordt voldaan,
      tenzij het onderwerp naar het oordeel van Onze Minister niet of nog niet voor behandeling in het overleg geschikt
      is. De betrokken centrale wordt daarvan in dat geval schriftelijk mededeling gedaan, onder vermelding van de
      redenen die aan deze beslissing ten grondslag liggen.


      [ref1]: https://wetten.overheid.nl/BWBR0006042#Artikel3
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006042
        artikel: '3'
        hoofdstuk: '2'
  - number: '10.1'
    text: |-
      Plaats, dag en aanvangsuur, alsmede de agenda van de vergadering van het overleg met de sectorcommissie worden door
      de voorzitter van het overleg vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel10
  - number: '10.2'
    text: |-
      Indien de vertegenwoordigers van ten minste twee centrales Onze Minister verzoeken een vergadering bijeen te roepen
      voor het voeren van overleg, wordt deze vergadering binnen twee weken uitgeschreven. Bij het verzoek wordt vermeld
      waarover deze vertegenwoordigers overleg willen voeren.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel10
  - number: '10.3'
    text: |-
      Indien de sectorcommissie voor een door haar te houden vergadering daartoe een verzoek doet, stelt Onze Minister zo
      mogelijk een vergaderruimte ter beschikking.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel10
  - number: '11.1'
    text: |-
      Indien het gewenst is over aangelegenheden als bedoeld in [artikel 3][ref1] voorbereidende besprekingen te voeren
      of in het overleg naar voren gekomen standpunten uit te werken, wordt die voorbereiding of uitwerking verricht door
      werkgroepen, bestaande uit leden of plaatsvervangende leden van de sectorcommissie, aangewezen door deze commissie
      en uit functionarissen, aangewezen door Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0006042#Artikel3
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006042
        artikel: '3'
        hoofdstuk: '2'
  - number: '11.2'
    text: |-
      Indien het gewenst is over aangelegenheden als bedoeld in [artikel 3][ref1], die uitsluitend militaire ambtenaren
      of uitsluitend ambtenaren betreffen, voorbereidende besprekingen te voeren of in het overleg naar voren gekomen
      standpunten uit te werken, kan die voorbereiding of die uitwerking verricht worden door een kamer voor militaire
      ambtenaren onderscheidenlijk een kamer voor ambtenaren, bestaande uit leden of plaatsvervangende leden van de
      sectorcommissie, aangewezen door deze commissie, en uit functionarissen aangewezen door Onze Minister. De leden of
      plaatsvervangende leden van de sectorcommissie kunnen zich voor het overleg in een kamer laten vervangen.


      [ref1]: https://wetten.overheid.nl/BWBR0006042#Artikel3
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006042
        artikel: '3'
        hoofdstuk: '2'
  - number: '11.3'
    text: Een werkgroep en een kamer staan onder leiding van een door Onze Minister aangewezen functionaris.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel11
  - number: '11.4'
    text: |-
      Op het deelnemen aan een vergadering van een werkgroep of kamer is [artikel 7, derde en vierde lid][ref1], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006042#Artikel7
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006042
        artikel: '7'
        hoofdstuk: '2'
  - number: '12'
    text: |-
      Het standpunt van de sectorcommissie wordt bepaald bij eenvoudige meerderheid van stemmen. Elke centrale brengt één
      stem uit.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel12
  - number: '13'
    text: |-
      In de [artikelen 14 tot en met 22][ref1] wordt verstaan onder:


      [ref1]: https://wetten.overheid.nl/BWBR0006042#Artikel14
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006042
        artikel: '14'
        hoofdstuk: '2'
  - number: 13.a
    text: 'deelnemers aan het overleg: de voorzitter en de tot het overleg toegelaten centrales;'
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel13
  - number: 13.b
    text: |-
      advies- en arbitragecommissie: de Advies- en Arbitragecommissie genoemd in [artikel 18][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006042#Artikel18
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006042
        artikel: '18'
        hoofdstuk: '2'
  - number: '14'
    text: |-
      De [artikelen 15 tot en met 22][ref1] zijn slechts van toepassing op geschillen inzake aangelegenheden als bedoeld
      in [artikel 3][ref2], voorzover die aangelegenheden uitsluitend de rechtstoestand van militaire ambtenaren of
      ambtenaren, met inbegrip van de algemene regels volgens welke het personeelsbeleid zal worden gevoerd, betreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0006042#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0006042#Artikel3
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006042
        artikel: '15'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0006042
        artikel: '3'
        hoofdstuk: '2'
  - number: '15'
    text: |-
      Indien de voorzitter dan wel één of meer van de centrales, in het overleg tot het oordeel komen dat dit overleg
      niet tot een uitkomst zal leiden die de instemming van alle deelnemers aan dat overleg zal hebben, brengen zij
      dat oordeel binnen drie dagen nadat zij daarvan in het overleg blijk hebben gegeven schriftelijk ter kennis van de
      overige deelnemers aan het overleg.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel15
  - number: '16.1'
    text: |-
      Binnen vijf dagen na de kennisgeving, genoemd in [artikel 15][ref1], schrijft de voorzitter een overlegvergadering
      uit. De vergadering moet worden gehouden binnen één week, nadat deze is uitgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0006042#Artikel15
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006042
        artikel: '15'
        hoofdstuk: '2'
  - number: '16.2'
    text: |-
      Tenzij door de voorzitter en de sectorcommissie wordt besloten het overleg voort te zetten dan wel te beëindigen,
      wordt in de vergadering nagegaan of overeenstemming bestaat over de vraag wat het onderwerp en de inhoud van het
      geschil is en of een oplossing van dat geschil zal worden gezocht door middel van voortzetting van het overleg,
      nadat het advies is ingewonnen van de advies- en arbitragecommissie, dan wel door middel van onderwerping van het
      geschil aan een arbitrale uitspraak van de advies- en arbitragecommissie.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel16
  - number: '16.3'
    text: Tot het inwinnen van advies is zowel de voorzitter als de sectorcommissie bevoegd.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel16
  - number: '16.4'
    text: Voor onderwerping van het geschil aan arbitrage is overeenstemming vereist tussen alle deelnemers aan het overleg.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel16
  - number: '17.1'
    text: |-
      Binnen drie dagen na de vergadering, genoemd in [artikel 16][ref1], wordt het verzoek om advies ter kennis gebracht
      van de voorzitter van de advies- en arbitragecommissie. Het verzoek wordt ondertekend door de deelnemers aan het
      overleg die zich voor inwinning van advies hebben uitgesproken, en bevat tenminste het onderwerp en de inhoud van
      het geschil. Indien in de vergadering, genoemd in [artikel 16][ref2], geen overeenstemming is bereikt tussen alle
      deelnemers aan het overleg over de vraag wat het onderwerp en de inhoud van het geschil is, brengen de overige
      deelnemers aan het overleg hun visie op het onderwerp en de inhoud van het geschil eveneens binnen drie dagen ter
      kennis van de voorzitter van de advies- en arbitragecommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0006042#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0006042#Artikel16
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006042
        artikel: '16'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0006042
        artikel: '16'
        hoofdstuk: '2'
  - number: '17.2'
    text: |-
      De eerste zin van het eerste lid is van overeenkomstige toepassing op het onderwerpen van het geschil aan een
      arbitrale uitspraak. Het verzoek daartoe wordt ondertekend door alle deelnemers aan het overleg en dient tenminste
      te bevatten:
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel17
  - number: 17.2.a
    text: het onderwerp en de inhoud van het geschil;
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel17
  - number: 17.2.b
    text: de standpunten van alle deelnemers aan het overleg omtrent het onderwerp en de inhoud van het geschil.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel17
  - number: '18.1'
    text: |-
      Er is een advies- en arbitragecommissie defensieambtenaren die tot taak heeft te adviseren of een bindende
      uitspraak te doen, in de geschillen die haar ingevolge de [artikelen 15 tot en met 17][ref1] worden voorgelegd.
      Zij is gevestigd te ’s-Gravenhage. Zij bestaat uit vijf leden, onder wie de voorzitter, en vijf plaatsvervangende
      leden. De leden worden bij Koninklijk besluit benoemd voor een tijdvak van ten hoogste vier jaar. Herbenoeming kan
      tweemaal en telkens voor ten hoogste vier jaar plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0006042#Artikel15
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006042
        artikel: '15'
        hoofdstuk: '2'
  - number: '18.2'
    text: 'Uitgesloten van het lidmaatschap en plaatsvervangend lidmaatschap zijn:'
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel18
  - number: 18.2.a
    text: |-
      personen die lid of plaatsvervangend lid zijn van de sectorcommissie of dat binnen een periode van twee jaar zijn
      geweest;
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel18
  - number: 18.2.b
    text: |-
      personen die bestuurslid zijn, of werkzaam zijn bij een centrale of een daarbij aangesloten vereniging of dat
      binnen een periode van twee jaar zijn geweest
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel18
  - number: 18.2.c
    text: |-
      personen die werkzaam zijn, of binnen een periode van twee jaar werkzaam zijn geweest, bij de departementen van
      algemeen bestuur en de daaronder ressorterende instellingen, diensten en bedrijven wier onafhankelijkheid en
      onpartijdigheid op grond van hun dienstverband door de deelnemers aan het overleg onvoldoende wordt geacht.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel18
  - number: '18.3'
    text: |-
      Onze Minister wijst in overeenstemming met de Sectorcommissie en met de voorzitter van de Advies- en
      Arbitragecommissie defensieambtenaren een secretaris aan die de Advies- en Arbitragecommissie defensieambtenaren
      bijstaat.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel18
  - number: '18.4'
    text: |-
      Aan de leden en plaatsvervangende leden wordt vergoeding voor reis- en verblijfkosten verleend op grond van het
      [Besluit dienstreizen defensie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007956
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0007956
  - number: '19.1'
    text: |-
      De advies- en arbitragecommissie treedt in geval van advies op in een samenstelling van drie leden, onder wie de
      voorzitter, één van de twee leden, genoemd in [artikel 110][ref1] en één van de twee leden, genoemd in het derde
      lid, onder *b*, van dat artikel. De overige twee leden treden te zamen met de voorzitter op in geval van arbitrage.
      Bij verhindering van één van de leden treedt diens plaatsvervanger op.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel110g
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 110g
  - number: '19.2'
    text: |-
      Indien het verzoek om arbitrage naar het oordeel van de voorzitter eenzelfde geschil betreft als waarover door
      de advies- en arbitragecommissie reeds advies is uitgebracht, treedt voor een lid dat bij het uitbrengen van dat
      advies betrokken was, diens plaatsvervanger op.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel19
  - number: '19.3'
    text: |-
      De voorzitter van de advies- en arbitragecommissie draagt er zorg voor dat het advies of de uitspraak binnen vier
      weken nadat de kennisgeving, genoemd in [artikel 17][ref1], is ontvangen, aan de deelnemers aan het overleg ter
      kennis wordt gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006042#Artikel17
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006042
        artikel: '17'
        hoofdstuk: '2'
  - number: '19.4'
    text: De advies- en arbitragecommissie stelt nadere regels vast met betrekking tot haar werkwijze.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel19
  - number: '20.1'
    text: De advies- en arbitragecommissie neemt een beslissing bij meerderheid van stemmen.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel20
  - number: '20.2'
    text: 'Het advies of de uitspraak moet inhouden:'
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel20
  - number: 20.2.a
    text: de namen van de deelnemers die het advies respectievelijk de arbitrale uitspraak hebben aangevraagd;
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel20
  - number: 20.2.b
    text: een overzicht van de standpunten van alle deelnemers over het onderwerp en de inhoud van het geschil;
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel20
  - number: 20.2.c
    text: het advies, respectievelijk de beslissing en de redenen die daaraan ten grondslag liggen.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel20
  - number: '20.3'
    text: |-
      Het advies, respectievelijk de uitspraak, wordt gedagtekend en door ieder van de optredende leden van de advies- en
      arbitragecommissie ondertekend.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel20
  - number: '21'
    text: Binnen twee weken na ontvangst van het advies wordt het overleg over het geschil voortgezet.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel21
  - number: '22'
    text: De uitspraak van de advies- en arbitragecommissie heeft bindende kracht.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel22
  - number: '23'
    text: |-
      Het standpunt van de sectorcommissie over de in het overleg besproken aangelegenheden wordt schriftelijk aan Onze
      Minister bevestigd, waarbij desverlangd een samenvatting van de aan dit standpunt ten grondslag liggende argumenten
      wordt gegeven. Indien in de sectorcommissie een minderheidsstandpunt is, wordt daarvan desverlangd melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel23
  - number: '24'
    text: |-
      Indien over een aangelegenheid in afwijking van het standpunt van de sectorcommissie wordt beslist, brengt Onze
      minister de redenen van die afwijking zo spoedig mogelijk ter kennis van de sectorcommissie.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel24
  - number: '25.1'
    text: |-
      Het secretariaat van het overleg wordt gevoerd door een door Onze Minister aangewezen secretaris. Over de
      aanwijzing van de secretaris wordt de sectorcommissie gehoord. Onze Minister kan adjunct-secretarissen aanwijzen.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel25
  - number: '25.2'
    text: |-
      De secretaris staat, onder leiding van de voorzitter van het overleg, ter beschikking van de voorzitter en van de
      in [artikel 7, tweede lid][ref1], bedoelde functionarissen, alsmede van de sectorcommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0006042#Artikel7
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0006042
        artikel: '7'
        hoofdstuk: '2'
  - number: '26.1'
    text: |-
      Van het in de vergaderingen van het overleg met de sectorcommissie en de werkgroepen en kamers behandelde, maakt de
      secretaris notulen. De voorzitter legt deze notulen aan de commissie, onderscheidenlijk de betrokken werkgroep of
      kamer, ter goedkeuring voor.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel26
  - number: '26.2'
    text: |-
      Van het in een vergadering van het overleg met de sectorcommissie behandelde kan in overleg met die commissie een
      beknopte, voor publikatie bestemde samenvatting worden opgesteld.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel26
  - number: '26.3'
    text: |-
      Na overleg met de sectorcommissie, onderscheidenlijk met de betrokken werkgroep of kamer, kan degene, die met de
      leiding van de vergadering is belast, ten aanzien van het behandelde in die vergadering geheimhouding opleggen.
      De plicht tot geheimhouding geldt niet voor zover de leden of plaatsvervangende leden van de sectorcommissie, dan
      wel de leden of plaatsvervangende leden van de betrokken werkgroep of kamer in bespreking treden met de door hen
      vertegenwoordigde centrale.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel26
  - number: '38'
    text: |-
      Onze Minister kan in afwijking van [artikel 6, eerste lid][ref1], bepalen dat het aantal vertegenwoordigers van de
      centrales in de sectorcommissie tijdelijk wordt verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0006042#Artikel6
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0006042
        artikel: '6'
        hoofdstuk: '2'
  - number: '39.1'
    text: |-
      Onze Minister kan in geval van buitengewone omstandigheden, tijdelijk afwijken van hetgeen bij of krachtens dit
      besluit is bepaald, voor zover en voor zolang dit met het oog op de goede uitvoering van de operationele taken van
      de krijgsmacht noodzakelijk wordt geacht.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel39
  - number: '39.2'
    text: |-
      Onze Minister kan bepalen of doen bepalen, dat hetgeen bij of krachtens dit besluit is bepaald buiten toepassing
      blijft, voor zover en voor zolang zulks naar zijn oordeel, in overeenstemming met het gevoelen van de Raad van
      Ministers, door het landsbelang wordt gevorderd.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel39
  - number: '40'
    text: |-
      Na inwerkingtreding van de [Wet normalisering rechtspositie ambtenaren][ref1] berust dit besluit op de
      [artikelen 12][ref2] en [12o van de Wet ambtenaren defensie][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0039393
      [ref2]: https://wetten.overheid.nl/BWBR0001952#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0001952#Artikel12o
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0039393
      - id: ref2
        bwb_id: BWBR0001952
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0001952
        artikel: 12o
  - number: '42'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin het wordt
      geplaatst en werkt terug tot en met 1 april 1993.
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel42
  - number: '43'
    text: 'Dit besluit wordt aangehaald als: Besluit georganiseerd overleg sector Defensie.'
    url: https://wetten.overheid.nl/BWBR0006042/2020-01-01#Artikel43
