  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. Onze Minister:

      Onze Minister van Defensie;

      b. militaire ambtenaar:

      de militaire ambtenaar, genoemd in [artikel 1, eerste en tweede lid van de Militaire Ambtenarenwet 1931][ref1];

      c. ambtenaar:

      de ambtenaar, genoemd in [artikel 1 van het Burgerlijk ambtenarenreglement defensie][ref2];

      d. centrale:

      een centrale van verenigingen, welke zich mede ten doel stellen het behartigen van de belangen van de militaire
      ambtenaren of de ambtenaren op het terrein van de rechtstoestand;

      e. sectorcommissie:

      de commissie, genoemd in [artikel 2][ref3];

      f. bijzondere commissie:

      een commissie, genoemd in [artikel 27][ref4];

      g. ministerie:

      het Ministerie van Defensie en de daaronder ressorterende diensten, bedrijven en instellingen;


