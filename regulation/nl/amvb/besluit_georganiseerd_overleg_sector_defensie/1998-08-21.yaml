  - number: '19'
    text: |-
      1 De advies- en arbitragecommissie treedt in geval van advies op in een samenstelling van drie leden, onder wie de
      voorzitter, één van de twee leden, genoemd in [artikel 110][ref1] en één van de twee leden, genoemd in het derde
      lid, onder *b*, van dat artikel. De overige twee leden treden te zamen met de voorzitter op in geval van arbitrage.
      Bij verhindering van één van de leden treedt diens plaatsvervanger op.

      2 Indien het verzoek om arbitrage naar het oordeel van de voorzitter eenzelfde geschil betreft als waarover door
      de advies- en arbitragecommissie reeds advies is uitgebracht, treedt voor een lid dat bij het uitbrengen van dat
      advies betrokken was, diens plaatsvervanger op.

      3 De voorzitter van de advies- en arbitragecommissie draagt er zorg voor dat het advies of de uitspraak binnen vier
      weken nadat de kennisgeving, genoemd in [artikel 17][ref2], is ontvangen, aan de deelnemers aan het overleg ter
      kennis wordt gebracht.

      4 De advies- en arbitragecommissie stelt nadere regels vast met betrekking tot haar werkwijze.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel110g
      [ref2]: https://wetten.overheid.nl/BWBR0006042#Artikel17
    url: https://wetten.overheid.nl/BWBR0006042/1998-08-21#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 110g
      - id: ref2
        bwb_id: BWBR0006042
        artikel: '17'
        hoofdstuk: '2'
  - number: '20'
    text: |-
      1 De advies- en arbitragecommissie neemt een beslissing bij meerderheid van stemmen.

      2 Het advies of de uitspraak moet inhouden:

      a. de namen van de deelnemers die het advies respectievelijk de arbitrale uitspraak hebben aangevraagd;

      b. een overzicht van de standpunten van alle deelnemers over het onderwerp en de inhoud van het geschil;

      c. het advies, respectievelijk de beslissing en de redenen die daaraan ten grondslag liggen.

      3 Het advies, respectievelijk de uitspraak, wordt gedagtekend en door ieder van de optredende leden van de advies-
      en arbitragecommissie ondertekend.
    url: https://wetten.overheid.nl/BWBR0006042/1998-08-21#Artikel20
  - number: '21'
    text: Binnen twee weken na ontvangst van het advies wordt het overleg over het geschil voortgezet.
    url: https://wetten.overheid.nl/BWBR0006042/1998-08-21#Artikel21
  - number: '22'
    text: De uitspraak van de advies- en arbitragecommissie heeft bindende kracht.
    url: https://wetten.overheid.nl/BWBR0006042/1998-08-21#Artikel22
  - number: '23'
    text: |-
      Het standpunt van de sectorcommissie over de in het overleg besproken aangelegenheden, alsmede over de aan de
      commissie ingevolge [artikel 34, tweede lid][ref1], ter kennis gekomen adviezen van een bijzondere commissie,
      wordt schriftelijk aan Onze Minister bevestigd, waarbij desverlangd een samenvatting van de aan dit standpunt
      ten grondslag liggende argumenten wordt gegeven. Indien in de sectorcommissie een minderheidsstandpunt is, wordt
      daarvan desverlangd melding gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0006042#Artikel34
    url: https://wetten.overheid.nl/BWBR0006042/1998-08-21#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0006042
        artikel: '34'
        hoofdstuk: '3'
  - number: '24'
    text: |-
      Indien over een aangelegenheid in afwijking van het standpunt van de sectorcommissie wordt beslist, brengt Onze
      minister de redenen van die afwijking zo spoedig mogelijk ter kennis van de sectorcommissie.
    url: https://wetten.overheid.nl/BWBR0006042/1998-08-21#Artikel24
  - number: '25'
    text: |-
      1 Het secretariaat van het overleg wordt gevoerd door een door Onze Minister aangewezen secretaris. Over de
      aanwijzing van de secretaris wordt de sectorcommissie gehoord. Onze Minister kan adjunct-secretarissen aanwijzen.

      2 De secretaris staat, onder leiding van de voorzitter van het overleg, ter beschikking van de voorzitter en van de
      in [artikel 7, tweede lid][ref1], bedoelde functionarissen, alsmede van de sectorcommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0006042#Artikel7
    url: https://wetten.overheid.nl/BWBR0006042/1998-08-21#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0006042
        artikel: '7'
        hoofdstuk: '2'
  - number: '26'
    text: |-
      1 Van het in de vergaderingen van het overleg met de sectorcommissie en de werkgroepen en kamers behandelde, maakt
      de secretaris notulen. De voorzitter legt deze notulen aan de commissie, onderscheidenlijk de betrokken werkgroep
      of kamer, ter goedkeuring voor.

      2 Van het in een vergadering van het overleg met de sectorcommissie behandelde kan in overleg met die commissie een
      beknopte, voor publikatie bestemde samenvatting worden opgesteld.

      3 Na overleg met de sectorcommissie, onderscheidenlijk met de betrokken werkgroep of kamer, kan degene, die met
      de leiding van de vergadering is belast, ten aanzien van het behandelde in die vergadering geheimhouding opleggen.
      De plicht tot geheimhouding geldt niet voor zover de leden of plaatsvervangende leden van de sectorcommissie, dan
      wel de leden of plaatsvervangende leden van de betrokken werkgroep of kamer in bespreking treden met de door hen
      vertegenwoordigde centrale.
    url: https://wetten.overheid.nl/BWBR0006042/1998-08-21#Artikel26
  - number: '27'
    text: |-
      1 Onze Minister kan in overleg met de sectorcommissie bijzondere commissies instellen voor het georganiseerd
      overleg over aangelegenheden van algemeen belang voor de rechtstoestand van militaire ambtenaren en van ambtenaren
      voor een deel van de krijgsmacht en van ambtenaren werkzaam bij een deel van het ministerie. In ieder geval stelt
      Onze Minister bijzondere commissies in voor militaire ambtenaren en ambtenaren bij de Koninklijke marine, de
      Koninklijke landmacht en de Koninklijke luchtmacht en voor ambtenaren bij de centrale organisatie en het Defensie
      Interservice Commando.

      2 Over aangelegenheden van algemeen belang voor de rechtstoestand, met inbegrip van de algemene regels volgens
      welke het personeelsbeleid zal worden gevoerd, van hetzij de militaire ambtenaren, hetzij de ambtenaren, wordt,
      indien zij louter betrekking hebben op militaire ambtenaren of ambtenaren waarvoor een bijzondere commissie is
      ingesteld, niet beslist alvorens daarover namens Onze Minister overleg is gevoerd met de desbetreffende bijzondere
      commissie.

      3 Op het overleg met een bijzondere commissie is het [tweede lid van artikel 3][ref1] van overeenkomstige
      toepassing.

      4 Een voorstel, voor zover het strekt tot het regelen van rechten of verplichtingen van individuele militaire
      ambtenaren of individuele ambtenaren en voor zover het een uitwerking betreft van een voorstel dat in het
      in [artikel 2][ref2] bedoelde overleg is overeengekomen, wordt slechts ten uitvoer gebracht indien daarover
      overeenstemming bestaat met de bijzondere commissie. Het standpunt van de bijzondere commissie wordt bepaald
      bij meerderheid van stemmen. Elke centrale brengt één stem uit. Indien de stemmen binnen de bijzondere commissie
      staken, beslist de voorzitter van het overleg met de bijzondere commissie of het voorstel ten uitvoer wordt
      gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006042#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006042#Artikel2
    url: https://wetten.overheid.nl/BWBR0006042/1998-08-21#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0006042
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0006042
        artikel: '2'
        hoofdstuk: '2'
  - number: '28'
    text: |-
      1 Een bijzondere commissie bestaat uit vertegenwoordigers van de centrales die zijn toegelaten tot de
      sectorcommissie.

      2 Een centrale is bevoegd twee leden en twee plaatsvervangende leden in een bijzondere commissie aan te wijzen. Van
      deze aanwijzing geeft de centrale kennis aan Onze Minister.

      3 Schorsing of intrekking van een toelating tot het in [artikel 3][ref1] bedoelde overleg heeft van rechtswege
      schorsing, onderscheidenlijk intrekking, van de toelating tot het in [artikel 27][ref2] bedoelde overleg tot
      gevolg.

      4 Onze Minister kan een door een centrale aangewezen lid of plaatsvervangend lid uitsluiten van deelneming aan het
      overleg. Het [tweede, derde en vierde lid van artikel 6][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006042#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006042#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0006042#Artikel6
    url: https://wetten.overheid.nl/BWBR0006042/1998-08-21#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0006042
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0006042
        artikel: '27'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0006042
        artikel: '6'
        hoofdstuk: '2'
  - number: '29'
    text: |-
      1 Het overleg met een bijzondere commissie staat onder leiding van een door Onze Minister aangewezen functionaris.
      Onze Minister kan een plaatsvervangend voorzitter aanwijzen.

      2 Degene die belast is met de leiding van de vergadering van het overleg met de bijzondere commissie, in dit
      hoofdstuk te noemen de voorzitter, kan bij het overleg terzijde worden gestaan door nader door hem aan te wijzen
      functionarissen.
    url: https://wetten.overheid.nl/BWBR0006042/1998-08-21#Artikel29
  - number: '30'
    text: |-
      1 Aangelegenheden die op grond van [artikel 27][ref1] in het overleg met een bijzondere commissie moeten worden
      behandeld, of waarover deze commissie moet worden gehoord, worden door Onze Minister voorgelegd aan die bijzondere
      commissie.

      2 Een centrale, die in een bijzondere commissie is vertegenwoordigd, kan Onze Minister verzoeken een
      aangelegenheid als bedoeld in [artikel 27][ref2] in een vergadering van die commissie te doen behandelen.
      [Artikel 9, tweede lid][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006042#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0006042#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0006042#Artikel9
    url: https://wetten.overheid.nl/BWBR0006042/1998-08-21#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0006042
        artikel: '27'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0006042
        artikel: '27'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0006042
        artikel: '9'
        hoofdstuk: '2'
  - number: '31'
    text: |-
      1 Indien het gewenst is over aangelegenheden als bedoeld in [artikel 27][ref1] voorbereidende besprekingen te
      voeren of in het overleg met een bijzondere commissie naar voren gekomen standpunten uit te werken, wordt die
      voorbereiding of uitwerking verricht door werkgroepen, bestaande uit leden of plaatsvervangende leden van de
      desbetreffende bijzondere commissie, aangewezen door deze commissie, en uit functionarissen, aangewezen door de
      voorzitter.

      2 Een werkgroep wordt ingesteld door de voorzitter. De vergaderingen worden door de voorzitter, of door een door
      hem aan te wijzen functionaris geleid.

      3 Op het deelnemen aan een vergadering van een werkgroep zijn het [derde en vierde lid van artikel 7][ref2] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006042#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0006042#Artikel7
    url: https://wetten.overheid.nl/BWBR0006042/1998-08-21#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0006042
        artikel: '27'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0006042
        artikel: '7'
        hoofdstuk: '2'
  - number: '32'
    text: |-
      Het standpunt van de bijzondere commissie wordt bepaald bij eenvoudige meerderheid van stemmen. Elke centrale
      brengt één stem uit.
    url: https://wetten.overheid.nl/BWBR0006042/1998-08-21#Artikel32
  - number: '33'
    text: |-
      De [artikelen 13 tot en met 22][ref1] zijn van overeenkomstige toepassing op het overleg met een bijzondere
      commissie, met dien verstande dat de in [artikel 18][ref2] genoemde advies- en arbitragecommissie voor de
      behandeling van een geschil met een bijzondere commissie wordt uitgebreid met twee bijzondere leden, die worden
      benoemd door Onze Minister. Één lid wordt benoemd op voordracht van de voorzitter en één lid op voordracht van de
      tot het overleg toegelaten centrales. Niet benoembaar tot bijzonder lid zijn:

      a. personen die ingevolge [artikel 18, tweede lid][ref3] zijn uitgesloten van het lidmaatschap of het
      plaatsvervangend lidmaatschap;

      b. personen die lid of plaatsvervangend lid zijn van de bijzondere commissie, dan wel van wie dit lidmaatschap of
      plaatsvervangend lidmaatschap nog niet langer dan twee jaar is beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0006042#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0006042#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0006042#Artikel18
    url: https://wetten.overheid.nl/BWBR0006042/1998-08-21#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0006042
        artikel: '13'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0006042
        artikel: '18'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0006042
        artikel: '18'
        hoofdstuk: '2'
  - number: '34'
    text: |-
      1 Het standpunt van een bijzondere commissie over in het overleg besproken aangelegenheden wordt schriftelijk
      aan Onze Minister bevestigd, waarbij desverlangd een samenvatting van de aan dit standpunt ten grondslag liggende
      argumenten wordt gegeven. Indien er in de bijzondere commissie een minderheidsstandpunt is, wordt daarvan
      desverlangd melding gemaakt.

      2 Het advies van een bijzondere commissie over een aangelegenheid die haar ingevolge [artikel 11, vijfde lid][ref1]
      door de sectorcommissie is voorgelegd, wordt schriftelijk aan de sectorcommissie bevestigd, waarbij een
      samenvatting van de aan dit advies ten grondslag liggende argumenten wordt gegeven.

      De laatste zin van het eerste lid is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006042#Artikel11
    url: https://wetten.overheid.nl/BWBR0006042/1998-08-21#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0006042
        artikel: '11'
        hoofdstuk: '2'
  - number: '35'
    text: |-
      De voorzitter wordt bijgestaan door een secretaris. [Artikel 25, tweede lid][ref1] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006042#Artikel25
    url: https://wetten.overheid.nl/BWBR0006042/1998-08-21#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0006042
        artikel: '25'
        hoofdstuk: '2'
  - number: '36'
    text: |-
      De voorzitter van het overleg met een bijzondere commissie doet aan de voorzitter van het in [artikel 3][ref1]
      bedoelde overleg en aan de sectorcommissie tijdig de agenda van elke vergadering toekomen, alsmede een exemplaar
      van de notulen van de gehouden vergadering.


      [ref1]: https://wetten.overheid.nl/BWBR0006042#Artikel3
    url: https://wetten.overheid.nl/BWBR0006042/1998-08-21#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0006042
        artikel: '3'
        hoofdstuk: '2'
  - number: '37'
    text: |-
      Op het overleg met een bijzondere commissie zijn de [artikelen 10][ref1], [24][ref2] en [26][ref3] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006042#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0006042#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0006042#Artikel26
    url: https://wetten.overheid.nl/BWBR0006042/1998-08-21#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0006042
        artikel: '10'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0006042
        artikel: '24'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0006042
        artikel: '26'
        hoofdstuk: '2'
  - number: '38'
    text: |-
      Onze Minister kan in afwijking van [artikel 6, eerste lid][ref1], bepalen dat het aantal vertegenwoordigers van de
      centrales in de sectorcommissie tijdelijk wordt verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0006042#Artikel6
    url: https://wetten.overheid.nl/BWBR0006042/1998-08-21#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0006042
        artikel: '6'
        hoofdstuk: '2'
  - number: '39'
    text: |-
      1 Onze Minister kan in geval van buitengewone omstandigheden, tijdelijk afwijken van hetgeen bij of krachtens dit
      besluit is bepaald, voor zover en voor zolang dit met het oog op de goede uitvoering van de operationele taken van
      de krijgsmacht noodzakelijk wordt geacht.

      2 Onze Minister kan bepalen of doen bepalen, dat hetgeen bij of krachtens dit besluit is bepaald buiten toepassing
      blijft, voor zover en voor zolang zulks naar zijn oordeel, in overeenstemming met het gevoelen van de Raad van
      Ministers, door het landsbelang wordt gevorderd.
    url: https://wetten.overheid.nl/BWBR0006042/1998-08-21#Artikel39
  - number: '41'
    text: Het Besluit georganiseerd overleg militairen wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006042/1998-08-21#Artikel41
  - number: '42'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin het wordt
      geplaatst en werkt terug tot en met 1 april 1993.
    url: https://wetten.overheid.nl/BWBR0006042/1998-08-21#Artikel42
  - number: '43'
    text: 'Dit besluit wordt aangehaald als: Besluit georganiseerd overleg sector Defensie.'
    url: https://wetten.overheid.nl/BWBR0006042/1998-08-21#Artikel43
