  - number: '18'
    text: |-
      1 Er is een advies- en arbitragecommissie die tot taak heeft te adviseren of een bindende uitspraak te doen, in
      de geschillen die haar ingevolge de voorgaande artikelen worden voorgelegd. Als zodanig treedt op de Advies- en
      Arbitragecommissie, genoemd in [artikel 110][ref1].

      2 Uitgesloten van het lidmaatschap en plaatsvervangend lidmaatschap zijn naast de personen, genoemd in
      [artikel 110][ref2]:

      a. personen die lid of plaatsvervangend lid zijn van de sectorcommissie;

      b. personen die bestuurslid zijn, of werkzaam zijn bij een centrale.

      3 Als secretaris, die de advies- en arbitragecommissie bijstaat, treedt op de secretaris, genoemd in
      [artikel 110][ref3].

      4 Aan de leden en plaatsvervangende leden wordt vergoeding voor reis- en verblijfkosten verleend op grond van het
      [Besluit dienstreizen defensie](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel110g
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel110g
      [ref3]: https://wetten.overheid.nl/BWBR0001950#Artikel110g
