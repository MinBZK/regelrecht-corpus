  - number: '12'
    text: |-
      Het standpunt van de sectorcommissie wordt bepaald bij eenvoudige meerderheid van stemmen. Elke centrale brengt één
      stem uit.
    url: https://wetten.overheid.nl/BWBR0006042/1998-08-21#Artikel12
  - number: '13'
    text: |-
      In de [artikelen 14 tot en met 22][ref1] wordt verstaan onder:

      a. deelnemers aan het overleg:

      de voorzitter en de tot het overleg toegelaten centrales;

      b. advies- en arbitragecommissie:

      de Advies- en Arbitragecommissie genoemd in [artikel 18][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006042#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0006042#Artikel18
    url: https://wetten.overheid.nl/BWBR0006042/1998-08-21#Artikel13
    references:
