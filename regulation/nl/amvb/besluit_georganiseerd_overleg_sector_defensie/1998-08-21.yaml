  - number: '4'
    text: |-
      1 De sectorcommissie bestaat uit vertegenwoordigers van:

      a. de Algemene Centrale van Overheidspersoneel (ACOP);

      b. de Christelijke Centrale voor Overheids- en Onderwijspersoneel (CCOOP);

      c. het Ambtenarencentrum (AC);

      d. de Centrale van Middelbare en Hogere Functionarissen bij Overheid, Onderwijs, Bedrijven en Instellingen (CMHF).

      2 Bij koninklijk besluit kunnen voorts tot het overleg worden toegelaten centrales die, gelet op hun ledental en
      de samenstelling daarvan, representatief zijn voor de militaire ambtenaren bij de gehele krijgsmacht en voor de
      ambtenaren bij het ministerie, voor zover het algemeen belang zich hiertegen niet verzet.

      3 Een toelating krachtens het tweede lid vindt niet plaats, alvorens Onze Minister daarover het advies van de
      sectorcommissie heeft ingewonnen.

      4 Bij koninklijk besluit kan een toelating tot het overleg krachtens het eerste lid worden geschorst en kan een
      toelating tot het overleg krachtens het tweede lid, dan wel een toelating krachtens [artikel 5][ref1] worden
      ingetrokken, indien de centrale niet meer representatief is, dan wel het algemeen belang of het belang van een goed
      overleg zich tegen verdere deelneming aan het overleg verzet.

      5 Vanaf de dag waarop het voornemen tot schorsing dan wel intrekking van de toelating tot het overleg aan het
      bestuur van de betrokken centrale kenbaar is gemaakt, tot aan de dag waarop daarover een beslissing is genomen,
      nemen vertegenwoordigers van deze centrale niet meer deel aan het overleg.

      6 De schorsing wordt opgeheven met ingang van de dag waarop de reden is vervallen die tot de schorsing aanleiding
      gaf.


      [ref1]: https://wetten.overheid.nl/BWBR0006042#Artikel5
    url: https://wetten.overheid.nl/BWBR0006042/1998-08-21#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006042
        artikel: '5'
        hoofdstuk: '2'
  - number: '6'
    text: |-
      1 Een centrale, die tot het overleg in de sectorcommissie is toegelaten, is bevoegd tot het aanwijzen van twee
      leden en twee plaatsvervangende leden. Van deze aanwijzing geeft de centrale kennis aan Onze Minister.

      2 Onze Minister is bevoegd een lid of een plaatsvervangend lid van de sectorcommissie van het deelnemen aan het
      overleg uit te sluiten, indien naar het oordeel van Onze Minister het dienstbelang dit vordert in verband met
      de aard van de werkzaamheden als militair ambtenaar of als ambtenaar van dat lid of plaatsvervangend lid. De
      beslissing tot uitsluiting wordt niet genomen, alvorens het bestuur van de betrokken centrale over het voornemen
      daartoe is gehoord en het advies van de vertegenwoordigers van de overige centrales daarover is ingewonnen.

      3 Vanaf de dag waarop het voornemen tot uitsluiting aan het bestuur van de centrale is kenbaar gemaakt, neemt het
      betrokken lid of plaatsvervangend lid niet meer deel aan het overleg.

      4 Na de uitsluiting wijst het bestuur van de centrale een ander lid of plaatsvervangend lid aan als zijn
      vertegenwoordiger in de sectorcommissie.
    url: https://wetten.overheid.nl/BWBR0006042/1998-08-21#Artikel6
  - number: '7'
    text: |-
      1 Het overleg met de sectorcommissie staat onder leiding van Onze Minister. Onze Minister is bevoegd de leiding van
      het overleg op te dragen aan de directeur-generaal personeel van het ministerie, indien de aard van de te bespreken
      aangelegenheden dit toelaat.

      2 Onze Minister wijst functionarissen aan die hem, of de functionaris die namens hem het overleg voert, bij het
      overleg terzijde staan.

      3 Bij de behandeling van bepaalde aangelegenheden kan op uitnodiging of met toestemming van de voorzitter van het
      overleg door andere dan de in de vorige leden bedoelde personen aan het overleg worden deelgenomen.

      4 De voorzitter van het overleg kan aan de leden van de sectorcommissie toestemming verlenen zich bij de
      behandeling van een bepaald onderwerp ter vergadering door deskundigen te laten bijstaan.
    url: https://wetten.overheid.nl/BWBR0006042/1998-08-21#Artikel7
  - number: '8'
    text: |-
      1 De centrale die van de in [artikel 6, eerste lid][ref1], genoemde bevoegdheid gebruik maakt, doet aan Onze
      Minister mededeling van de statuten, het huishoudelijk reglement en van de daarin aangebrachte wijzigingen,
      alsmede van de statuten en de daarin aangebrachte wijzigingen van de bij die centrale aangesloten verenigingen die
      militaire ambtenaren of ambtenaren als leden hebben.

      2 Bij de aanvang van elk kalenderjaar verstrekt iedere centrale aan Onze Minister een opgave van het aantal
      militaire ambtenaren en het aantal ambtenaren dat lid is van de bij die centrale aangesloten verenigingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006042#Artikel6
    url: https://wetten.overheid.nl/BWBR0006042/1998-08-21#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006042
        artikel: '6'
        hoofdstuk: '2'
  - number: '9'
    text: |-
      1 Aangelegenheden, die ingevolge [artikel 3][ref1] in het overleg met de sectorcommissie worden behandeld, of
      waarover deze commissie moet worden gehoord, worden door Onze Minister voorgelegd aan de sectorcommissie.

      2 Elke centrale die in de sectorcommissie is vertegenwoordigd, kan Onze Minister verzoeken een aangelegenheid
      als bedoeld in [artikel 3][ref2] in een vergadering van het overleg te behandelen. Aan het verzoek wordt voldaan,
      tenzij het onderwerp naar het oordeel van Onze Minister niet of nog niet voor behandeling in het overleg geschikt
      is. De betrokken centrale wordt daarvan in dat geval schriftelijk mededeling gedaan, onder vermelding van de
      redenen die aan deze beslissing ten grondslag liggen.


      [ref1]: https://wetten.overheid.nl/BWBR0006042#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006042#Artikel3
    url: https://wetten.overheid.nl/BWBR0006042/1998-08-21#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006042
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0006042
        artikel: '3'
        hoofdstuk: '2'
  - number: '10'
    text: |-
      1 Plaats, dag en aanvangsuur, alsmede de agenda van de vergadering van het overleg met de sectorcommissie worden
      door de voorzitter van het overleg vastgesteld.

      2 Indien de vertegenwoordigers van ten minste twee centrales Onze Minister verzoeken een vergadering bijeen te
      roepen voor het voeren van overleg, wordt deze vergadering binnen twee weken uitgeschreven. Bij het verzoek wordt
      vermeld waarover deze vertegenwoordigers overleg willen voeren.

      3 Indien de sectorcommissie voor een door haar te houden vergadering daartoe een verzoek doet, stelt Onze Minister
      zo mogelijk een vergaderruimte ter beschikking.
    url: https://wetten.overheid.nl/BWBR0006042/1998-08-21#Artikel10
  - number: '11'
    text: |-
      1 Indien het gewenst is over aangelegenheden als bedoeld in [artikel 3][ref1] voorbereidende besprekingen te voeren
      of in het overleg naar voren gekomen standpunten uit te werken, wordt die voorbereiding of uitwerking verricht door
      werkgroepen, bestaande uit leden of plaatsvervangende leden van de sectorcommissie, aangewezen door deze commissie
      en uit functionarissen, aangewezen door Onze Minister.

      2 Indien het gewenst is over aangelegenheden als bedoeld in [artikel 3][ref2], die uitsluitend militaire ambtenaren
      of uitsluitend ambtenaren betreffen, voorbereidende besprekingen te voeren of in het overleg naar voren gekomen
      standpunten uit te werken, kan die voorbereiding of die uitwerking verricht worden door een kamer voor militaire
      ambtenaren onderscheidenlijk een kamer voor ambtenaren, bestaande uit leden of plaatsvervangende leden van de
      sectorcommissie, aangewezen door deze commissie, en uit functionarissen aangewezen door Onze Minister. De leden of
      plaatsvervangende leden van de sectorcommissie kunnen zich voor het overleg in een kamer laten vervangen.

      3 Een werkgroep en een kamer staan onder leiding van een door Onze Minister aangewezen functionaris.

      4 Op het deelnemen aan een vergadering van een werkgroep of kamer is [artikel 7, derde en vierde lid][ref3], van
      overeenkomstige toepassing.

      5 De sectorcommissie is bevoegd over een aangelegenheid die haar ter behandeling is voorgelegd het advies in te
      winnen van een bijzondere commissie. De voorzitter van het overleg met de sectorcommissie kan aanwijzingen geven
      omtrent de behandeling van die aangelegenheid in het overleg met een bijzondere commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0006042#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006042#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0006042#Artikel7
