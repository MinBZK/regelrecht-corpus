  - number: '2'
    text: |-
      Zodra de uitspraak, waarbij een jeugdige de maatregel van plaatsing in een inrichting voor jeugdigen is opgelegd
      ten uitvoer kan worden gelegd, brengt het openbaar ministerie deze ter kennis van de selectiefunctionaris, bedoeld
      in [artikel 1, onder aa, van de Beginselenwet justitiële jeugdinrichtingen][ref1] onder bijvoeging van het dossier
      van de zaak. Het voegt daarbij het advies van de rechter omtrent de plaatsing en doet tevens mededeling van de
      verblijfplaats van de jeugdige en de datum waarop de uitspraak in kracht van gewijsde is gegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel1
    url: https://wetten.overheid.nl/BWBR0007083/2011-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '1'
  - number: '4'
    text: |-
      1 Omtrent de jeugdige aan wie de maatregel van plaatsing in een inrichting voor jeugdigen is opgelegd worden door
      of vanwege de directeur van de inrichting aantekeningen gehouden.

      2 De aantekeningen bevatten in elk geval:

      a. zo volledig mogelijke gegevens betreffende de afkomst en verleden;

      b. gegevens omtrent de lichamelijke en geestelijke toestand bij binnenkomst;

      c. de voortgang in het perspectiefplan;

      d. gegevens omtrent belangrijke voorvallen gedurende het verblijf.
    url: https://wetten.overheid.nl/BWBR0007083/2011-07-01#Artikel4
  - number: 4a
    text: |-
      1 De jeugdreclassering dan wel de reclassering, belast met de begeleiding en het toezicht, bedoeld in
      [artikel 10, tweede lid, van het Reglement justitiële jeugdinrichtingen][ref1], kan aan de directeur van de
      inrichting een voorstel doen tot wijziging of opheffing van de voorwaarden, verbonden aan de deelname aan het
      scholings- en trainingsprogramma.

      2 De jeugdreclassering dan wel de reclassering, belast met de begeleiding en het toezicht, bedoeld in
      [artikel 10, tweede lid, van het Reglement justitiële jeugdinrichtingen][ref2], dient desgevraagd de directeur van
      de inrichting en Onze Minister van advies.


      [ref1]: https://wetten.overheid.nl/BWBR0012647#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0012647#Artikel10
    url: https://wetten.overheid.nl/BWBR0007083/2011-07-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0012647
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0012647
        artikel: '10'
  - number: '5'
    text: |-
      1 De maatregel van plaatsing in een inrichting voor jeugdigen kan te allen tijde door Onze Minister voorwaardelijk
      of onvoorwaardelijk worden beëindigd indien het doel van de maatregel bereikt is of beter op andere wijze kan
      worden bereikt.

      2 De beschikking tot voorwaardelijke beëindiging wordt genomen op voorstel van de directeur van de inrichting.

      3 De beschikking kan ook ambtshalve worden genomen, doch slechts nadat de directeur van de inrichting is gehoord.

      4 De jeugdreclassering dan wel de reclassering, belast met de begeleiding en het toezicht, bedoeld in
      [artikel 10, tweede lid, van het Reglement justitiële jeugdinrichtingen][ref1], kan aan Onze Minister een voorstel
      doen tot het voorwaardelijk beëindigen van de maatregel van plaatsing in een inrichting voor jeugdigen. Dit
      voorstel wordt door tussenkomst van de directeur van de inrichting aan Onze Minister gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0012647#Artikel10
    url: https://wetten.overheid.nl/BWBR0007083/2011-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012647
        artikel: '10'
  - number: '6'
    text: |-
      1 Onze Minister wijst in de beschikking tot voorwaardelijke beëindiging de stichting aan die met de begeleiding van
      en het toezicht op de naleving van de voorwaarden is belast.

      2 De stichting ontvangt mededeling van de beëindiging van de maatregel en de voorwaarden waaronder deze is
      verleend.
    url: https://wetten.overheid.nl/BWBR0007083/2011-07-01#Artikel6
  - number: '7'
    text: |-
      Aan een beschikking tot voorwaardelijke beëindiging worden behoudens nader te stellen bijzondere voorwaarden, de
      volgende algemene voorwaarden verbonden:

      a. dat de jeugdige zich gedraagt overeenkomstig de aanwijzingen van de jeugdreclassering dan wel de reclassering en
      aan de reclasseringswerker alle verlangde inlichtingen zal verschaffen;

      b. dat hij tevoren melding doet aan de betrokken jeugdreclassering dan wel reclassering van een verandering van
      betrekking of woonplaats en

      c. dat hij zich niet schuldig maakt aan een strafbaar feit.
    url: https://wetten.overheid.nl/BWBR0007083/2011-07-01#Artikel7
  - number: '8'
    text: |-
      Onze Minister doet aan de jeugdige ten aanzien van wie de maatregel voorwaardelijk is beëindigd door tussenkomst
      van de directeur van de inrichting een beschikking toekomen, waarin de voorwaarden verbonden aan de beëindiging
      zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0007083/2011-07-01#Artikel8
  - number: '9'
    text: |-
      1 Indien Onze Minister voorwaardelijk of onvoorwaardelijk de maatregel van plaatsing in een inrichting
      voor jeugdigen beëindigt, stelt hij zo spoedig mogelijk de directeur van de inrichting, de raad voor de
      kinderbescherming en het openbaar ministerie van die beslissing in kennis. Indien de beëindiging voorwaardelijk is
      verleend, deelt hij daarbij de voorwaarden mede.

      2 Indien de beslissing strekt tot onvoorwaardelijke beëindiging van de maatregel ten aanzien van een jeugdige aan
      wie reeds voorwaardelijke beëindiging was verleend, brengt Onze Minister de beslissing tevens ter kennis van de
      betrokken stichting.
    url: https://wetten.overheid.nl/BWBR0007083/2011-07-01#Artikel9
  - number: '11'
    text: |-
      Het openbaar ministerie doet aan de betrokken stichting en aan Onze Minister onverwijld mededeling van:

      a. elke vrijheidsbeneming van de jeugdige door het daartoe bevoegde gezag;

      b. elk misdrijf dat de jeugdige heeft begaan of vermoedelijk heeft begaan en

      c. elk ter zijner kennis gekomen overtreding van de voorwaarden door de jeugdige.
    url: https://wetten.overheid.nl/BWBR0007083/2011-07-01#Artikel11
  - number: '12'
    text: |-
      1 Indien de jeugdige de gestelde voorwaarden overtreedt, zendt de stichting via het openbaar ministerie aan Onze
      Minister een voorstel tot intrekking of schorsing van het voorwaardelijk ontslag dan wel een bericht waaruit blijkt
      om welke redenen die intrekking of schorsing niet, of nog niet, geraden wordt geacht.

      2 Een voorstel tot intrekking kan tevens worden gedaan indien het belang van de jeugdige zulks bepaaldelijk
      vordert.

      3 Ook het openbaar ministerie kan een voorstel of bericht als bedoeld in het eerste lid aan Onze Minister zenden.
    url: https://wetten.overheid.nl/BWBR0007083/2011-07-01#Artikel12
  - number: '13'
    text: |-
      Indien Onze Minister besluit tot intrekking of schorsing van de voorwaardelijke beëindiging stelt hij de
      jeugdreclassering dan wel de reclassering, het openbaar ministerie, alsmede de directeur van de inrichting van zijn
      beslissing in kennis.
    url: https://wetten.overheid.nl/BWBR0007083/2011-07-01#Artikel13
  - number: '14'
    text: |-
      1 Uiterlijk drie maanden voordat de maatregel ingevolge
      [artikel 77s, zesde lid, tweede volzin, van het Wetboek van Strafrecht][ref1] voorwaardelijk eindigt, maakt de
      directeur van de inrichting binnen een maand te rekenen vanaf voornoemd tijdstip een schriftelijk met redenen
      omkleed, gedagtekend en ondertekend advies op en zendt dit aan Onze Minister. Het advies betreft:

      a. de wenselijkheid van de verlenging van de maatregel;

      b. de termijn, waarover naar zijn mening, de verlenging zich zou moeten uitstrekken.

      2 Bij het advies wordt een afschrift van de aantekeningen omtrent de lichamelijke en geestelijke gesteldheid van de
      jeugdige overgelegd.

      3 Indien in het geval, bedoeld in het eerste lid, de jeugdige op grond van een scholings- en trainingsprogramma of
      een voorwaardelijke beëindiging als bedoeld in [artikel 77s, achtste lid, van het Wetboek van Strafrecht][ref2],
      buiten de inrichting verblijft, voegt de directeur van de inrichting bij zijn advies tevens de beschouwingen van de
      jeugdreclassering dan wel de reclassering inzake de wenselijkheid van de verlenging van de maatregel.

      4 Onze Minister zendt het advies met bijlagen aan het openbaar ministerie bij de rechtbank die in eerste aanleg
      heeft kennis genomen van het misdrijf terzake waarvan de maatregel van plaatsing in een inrichting voor jeugdigen
      is opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77s
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel77s
    url: https://wetten.overheid.nl/BWBR0007083/2011-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77s
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 77s
  - number: '15'
    text: |-
      1 Het openbaar ministerie, bedoeld in [artikel 14, vierde lid][ref1], doet Onze Minister zo spoedig mogelijk
      mededeling:

      a. van zijn eventuele beslissing geen vordering tot verlenging van de maatregel van plaatsing in een inrichting
      voor jeugdigen in te dienen;

      b. indien zodanige vordering wel is ingediend van de beslissing van de rechtbank.

      2 Indien de rechter de maatregel niet verlengt stelt het openbaar ministerie zo spoedig mogelijk de directeur van
      de inrichting van die beslissing in kennis.

      3 Indien de beslissing tot niet verlenging van de maatregel ziet op een jeugdige ten aanzien van wie reeds een
      beslissing tot voorwaardelijke beëindiging van de maatregel was genomen, brengt het openbaar ministerie deze
      beslissing tevens ter kennis van de jeugdreclassering dan wel de reclassering.


      [ref1]: https://wetten.overheid.nl/BWBR0007083#Artikel14
    url: https://wetten.overheid.nl/BWBR0007083/2011-07-01#Artikel15
    references:
