    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Justitie van 7 september 1994, Stafafdeling Wetgeving Publiekrecht, nr.
    453938/94/6;

    Gelet op artikel 77ff, tweede lid, van het Wetboek van Strafrecht;

    De Raad van State gehoord (advies van 21 november 1994, no. W03.94.0565);

    Gezien het nader rapport van Onze Minister van Justitie van 1 december 1994, Stafafdeling Wetgeving Publiekrecht,
    nr. 470227/94/6;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0007083/2011-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Dit besluit verstaat onder:

      a. Onze Minister: Onze Minister van Justitie;

      b. jeugdige: een persoon ten aanzien van wie recht is gedaan overeenkomstig de
      [artikelen 77g tot en met 77 gg van het Wetboek van Strafrecht][ref1];

      c. voorwaardelijke veroordeling: veroordeling waarbij de straf of maatregel, tenzij de rechter later anders
      beveelt, geheel of gedeeltelijk niet zal worden ten uitvoer gelegd;

      d. openbaar ministerie: het openbaar ministerie bij het gerecht dat de straf van jeugddetentie of van plaatsing in
      een inrichting voor jeugdigen heeft opgelegd;

      e. raad voor de kinderbescherming: de raad, bedoeld in
      [artikel 238, eerste lid, van Boek 1 van het Burgerlijk Wetboek][ref2];

      f. inrichting: een inrichting als bedoeld in
      [artikel 1, onder b, van de Beginselenwet justitiële jeugdinrichtingen][ref3];

      g. jeugdreclassering: een stichting als bedoeld in [artikel 1, onder f, van de Wet op de jeugdzorg][ref4], bij de
      uitvoering van de taken, bedoeld in [artikel 10, eerste lid, onder c en d, van die wet][ref5];

      h. reclassering: de stichting alsmede een reclasseringsinstelling als bedoeld in
      [artikel 1, onder b, onderscheidenlijk onder c, van de Reclasseringsregeling 1995][ref6];

      i. scholings- en trainingsprogramma: een programma als bedoeld in
      [artikel 3 van de Beginselenwet justitiële jeugdinrichtingen][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77aa
