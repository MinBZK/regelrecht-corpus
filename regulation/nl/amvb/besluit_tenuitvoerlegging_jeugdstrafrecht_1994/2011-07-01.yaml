        artikel: '14'
        paragraaf: '3'
        afdeling: II
  - number: '16'
    text: |-
      Bij het indienen van een vordering als bedoeld in [artikel 77tb van het Wetboek van Strafrecht][ref1] legt het
      openbaar ministerie de beschouwingen over van de jeugdreclassering dan wel de reclassering over de wijze waarop
      de jeugdige de voorwaarden, bedoeld in [artikel 77ta, eerste lid, van het Wetboek van Strafrecht][ref2] heeft
      nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77tb
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel77ta
    url: https://wetten.overheid.nl/BWBR0007083/2011-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77tb
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 77ta
  - number: '17'
    text: |-
      1 Het openbaar ministerie brengt een vordering en een beslissing als bedoeld in
      [artikel 77tb van het Wetboek van Strafrecht][ref1], ter kennis aan de raad voor de kinderbescherming.

      2 Het openbaar ministerie brengt een beslissing als bedoeld in
      [artikel 77tb, derde lid, onderdeel b, van het Wetboek van Strafrecht][ref2], onverwijld ter kennis aan de
      selectiefunctionaris.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77tb
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel77tb
    url: https://wetten.overheid.nl/BWBR0007083/2011-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77tb
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 77tb
  - number: '18'
    text: |-
      Indien de directeur van de inrichting waar de jeugddetentie wordt ondergaan van oordeel is dat de gestrafte
      voorwaardelijk in vrijheid behoort te worden gesteld, doet hij daaromtrent een gemotiveerd voorstel aan het
      openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0007083/2011-07-01#Artikel18
  - number: '19'
    text: |-
      1 Het openbaar ministerie brengt een beslissing van de rechter tot voorwaardelijke invrijheidstelling onverwijld
      ter kennis van de directeur van de inrichting waar de straf van jeugddetentie wordt ondergaan onder mededeling van
      de aan de jeugdige opgelegde voorwaarden en het begin en het einde van de proeftijd.

      2 Het eerste lid is van overeenkomstige toepassing op het mededelen van beslissingen krachtens de
      [artikelen 77cc][ref1] en [77dd van het Wetboek van Strafrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77cc
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel77dd
    url: https://wetten.overheid.nl/BWBR0007083/2011-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77cc
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 77dd
  - number: '21'
    text: |-
      De voorwaardelijke invrijheidstelling en haar herroeping worden aangetekend op het executie-extract van de
      rechterlijke uitspraak waarbij de straf werd opgelegd.
    url: https://wetten.overheid.nl/BWBR0007083/2011-07-01#Artikel21
  - number: 21a
    text: |-
      1 Er is een netwerkberaad en een trajectberaad.

      2 Het netwerkberaad en trajectberaad hebben tot doel de voorbereiding van de terugkeer in de samenleving van
      jeugdigen die op strafrechtelijke titel in een inrichting verblijven of hebben verbleven en het bevorderen van
      geleidelijke overgangen bij deze terugkeer.

      3 Aan het netwerkberaad nemen deel:

      a. een vertegenwoordiger van de raad voor de kinderbescherming,

      b. een vertegenwoordiger van de jeugdreclassering dan wel de reclassering, en

      c. een vertegenwoordiger van de inrichting waarin de jeugdige verblijft.

      4 De vertegenwoordiger van de raad voor de kinderbescherming is voorzitter van het netwerkberaad.

      5 Aan het trajectberaad nemen deel:

      a. een vertegenwoordiger van de raad voor de kinderbescherming,

      b. een vertegenwoordiger van de jeugdreclassering dan wel de reclassering,

      c. een vertegenwoordiger van de inrichting waarin de jeugdige heeft verbleven, en

      d. een vertegenwoordiger de gemeente, waar de jeugdige na zijn verblijf in de jeugdinrichting zal verblijven.

      6 De vertegenwoordiger van de raad voor de kinderbescherming is voorzitter van het trajectberaad.
    url: https://wetten.overheid.nl/BWBR0007083/2011-07-01#Artikel21a
  - number: '23'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0007083/2011-07-01#Artikel23
  - number: '24'
    text: 'Dit besluit wordt aangehaald als: Besluit tenuitvoerlegging jeugdstrafrecht 1994.'
    url: https://wetten.overheid.nl/BWBR0007083/2011-07-01#Artikel24
