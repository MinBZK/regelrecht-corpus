  - number: '18'
    text: |-
      Indien de directeur van de inrichting waar de jeugddetentie wordt ondergaan van oordeel is dat de gestrafte
      voorwaardelijk in vrijheid behoort te worden gesteld, doet hij daaromtrent een gemotiveerd voorstel aan het
      openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0007083/2015-01-01#Artikel18
  - number: '19'
    text: |-
      1 Het openbaar ministerie brengt een beslissing van de rechter tot voorwaardelijke invrijheidstelling onverwijld
      ter kennis van de directeur van de inrichting waar de straf van jeugddetentie wordt ondergaan onder mededeling van
      de aan de jeugdige opgelegde voorwaarden en het begin en het einde van de proeftijd.

      2 Het eerste lid is van overeenkomstige toepassing op het mededelen van beslissingen krachtens de
      [artikelen 77cc][ref1] en [77dd van het Wetboek van Strafrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77cc
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel77dd
    url: https://wetten.overheid.nl/BWBR0007083/2015-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77cc
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 77dd
  - number: '20'
    text: |-
      De voorwaardelijke invrijheidstelling en haar herroeping worden aangetekend op het executie-extract van de
      rechterlijke uitspraak waarbij de straf werd opgelegd.
    url: https://wetten.overheid.nl/BWBR0007083/2015-01-01#Artikel20
  - number: '21'
    text: |-
      1 Het programma, bedoeld in [artikel 77w, derde lid, van het Wetboek van Strafrecht][ref1] kan mede bestaan uit een
      of meer gedragsinterventies.

      2 Indien de maatregel betreffende het gedrag van de jeugdige gezamenlijk met een vrijheidsbenemende straf wordt
      opgelegd, voorziet het programma bedoeld in [artikel 77w, derde lid, van het Wetboek van Strafrecht][ref2] in ieder
      geval in begeleiding van de jeugdige bij een verantwoorde terugkeer in de samenleving. De rechter neemt in zijn
      vonnis zodanige bepalingen op als hij voor de juiste uitvoering van die begeleiding noodzakelijk acht.

      3


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77w
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel77w
    url: https://wetten.overheid.nl/BWBR0007083/2015-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77w
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 77w
  - number: '22'
    text: |-
      1

      2 Het openbaar ministerie kan de jeugdreclassering en de reclassering, voor zover zij zijn belast met het toezicht,
      aanwijzingen geven omtrent het toezicht op de naleving van de voorwaarden.
    url: https://wetten.overheid.nl/BWBR0007083/2015-01-01#Artikel22
  - number: '23'
    text: |-
      1 De jeugdreclassering of de reclassering die is belast met het toezicht, draagt er zorg voor dat de aard en de
      intensiteit van het toezicht en de verplichtingen waaraan de jeugdige zich in het kader van het toezicht heeft te
      houden, worden vastgelegd.

      2 De jeugdreclassering of de reclassering die is belast met het toezicht, draagt er zorg voor dat het
      toezicht aanvangt binnen een termijn van vijf dagen na het ingaan van de proeftijd, dan wel binnen
      een termijn van zeven dagen na het ingaan van de proeftijd, indien de rechter een bevel als bedoeld in
      [artikel 77za van het Wetboek van Strafrecht][ref1] heeft gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77za
    url: https://wetten.overheid.nl/BWBR0007083/2015-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77za
  - number: '24'
    text: |-
      1 De jeugdige volgt de aanwijzingen en opdrachten op die door de jeugdreclassering of de reclassering worden
      gegeven in het kader van het toezicht.

      2 De jeugdige geeft veranderingen in de woon- of werksituatie onmiddellijk door aan de jeugdreclassering of de
      reclassering.
    url: https://wetten.overheid.nl/BWBR0007083/2015-01-01#Artikel24
  - number: '25'
    text: |-
      Zo spoedig mogelijk na de melding van niet naleving van voorwaarden brengt de jeugdreclassering of de reclassering
      advies uit aan het openbaar ministerie of de melding naar haar oordeel aanleiding zou kunnen geven tot een van de
      volgende maatregelen:

      a. het indienen van een vordering als bedoeld in [artikel 77cc van het Wetboek van Strafrecht][ref1];

      b. het indienen van een vordering als bedoeld in [artikel 77dd, eerste lid, van het Wetboek van Strafrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77cc
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel77dd
    url: https://wetten.overheid.nl/BWBR0007083/2015-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77cc
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 77dd
  - number: '26'
    text: |-
      Met het oog op het beëindigen van het toezicht, stuurt de jeugdreclassering of de reclassering zo spoedig mogelijk
      een afloopbericht aan de raad voor de kinderbescherming en het openbaar ministerie. In het afloopbericht wordt het
      feitelijke verloop van het toezicht aangegeven.
    url: https://wetten.overheid.nl/BWBR0007083/2015-01-01#Artikel26
  - number: '27'
    text: |-
      1 De rechter kan bij schorsing van de tenuitvoerlegging van het bevel tot voorlopige hechtenis, één of meer van de
      volgende bijzondere voorwaarden aan de schorsing verbinden:

      1°. zich gedurende een door de rechter te bepalen termijn te houden aan de aanwijzingen van de jeugdreclassering,
      ook indien deze aanwijzingen inhouden dat de jeugdige zich onder behandeling van een bepaalde deskundige of
      bepaalde instantie zal stellen;

      2°. het aanvaarden van intensieve begeleiding;

      3°. het volgen van een leerproject van ten hoogste 120 uren;

      4°. op een bepaald tijdstip of gedurende een bepaalde periode op een bepaalde locatie aanwezig te zijn;

      5°. zich op bepaalde tijdstippen te melden bij een bepaalde instantie;

      6°. een verbod contact te leggen of te laten leggen met bepaalde personen of instellingen;

      7°. een verbod om zich op of in de directe omgeving van een bepaalde locatie te bevinden;

      8°. een verbod op het gebruik van verdovende middelen of alcohol en de verplichting ten behoeve van de naleving van
      dit verbod mee te werken aan bloedonderzoek of urineonderzoek;

      9°. andere bijzondere voorwaarden, het gedrag van de jeugdige betreffende.

      2 Een behandeling als bedoeld in het eerste lid, onder 1°, of de voorwaarde, bedoeld in het eerste lid, onder 9°,
      kunnen geheel of ten dele bestaan uit een vorm van jeugdhulp als bedoeld in [artikel 1.1 van de Jeugdwet][ref1],
      indien het college van burgemeester en wethouders een besluit tot het treffen van een voorziening op het gebied van
      jeugdhulp als bedoeld in [artikel 2.3, eerste lid, van de Jeugdwet][ref2], heeft genomen.

      3 De rechter kan de werking van de bijzondere voorwaarden, genoemd in het eerste lid, beperken tot een bij de
      beslissing tot schorsing van het bevel tot voorlopige hechtenis te bepalen tijdsduur, met dien verstande dat een
      behandeling als bedoeld in het eerste lid, onder 1°, de begeleiding als bedoeld in het eerste lid, onder 2°, en
      een voorwaarde als bedoeld in het eerste lid, onder 9°, ten hoogste zes maanden kunnen duren. Aan een bijzondere
      voorwaarde kan elektronisch toezicht worden verbonden.

      4

      5 De in [artikel 493, zesde lid, van het Wetboek van Strafvordering][ref3] bedoelde instemming moet blijken uit een
      door de jeugdige ondertekende verklaring, waarin de aard en inhoud van de bijzondere voorwaarden zijn omschreven.
      De instemming van de jeugdige kan eveneens blijken uit het proces-verbaal ter terechtzitting.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1.1
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel2.3
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel493
