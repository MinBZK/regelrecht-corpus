articles:
  - number: '1'
    text: |-
      1 Dit besluit verstaat onder:

      a. Onze Minister: Onze Minister van Veiligheid en Justitie;

      b. jeugdige: een persoon ten aanzien van wie recht is gedaan overeenkomstig de
      [artikelen 77g tot en met 77hh van het Wetboek van Strafrecht][ref1];

      c. voorwaardelijke veroordeling: veroordeling waarbij de straf of maatregel, tenzij de rechter later anders
      beveelt, geheel of gedeeltelijk niet zal worden ten uitvoer gelegd;

      d. openbaar ministerie: het openbaar ministerie bij het gerecht dat de straf van jeugddetentie of van plaatsing in
      een inrichting voor jeugdigen heeft opgelegd;

      e. raad voor de kinderbescherming: de raad, bedoeld in
      [artikel 238, eerste lid, van Boek 1 van het Burgerlijk Wetboek][ref2];

      f. inrichting: een inrichting als bedoeld in
      [artikel 1, onder b, van de Beginselenwet justitiële jeugdinrichtingen][ref3];

      g. jeugdreclassering: gecertificeerde instelling als bedoeld in [artikel 1.1 van de Jeugdwet][ref4], bij de
      uitvoering van jeugdreclassering;

      h. reclassering: de stichting alsmede een reclasseringsinstelling als bedoeld in
      [artikel 1, onder b, onderscheidenlijk onder c, van de Reclasseringsregeling 1995][ref5];

      i. scholings- en trainingsprogramma: een programma als bedoeld in
      [artikel 3 van de Beginselenwet justitiële jeugdinrichtingen][ref6];

      j. gedragsbeïnvloedende maatregel: de maatregel betreffende het gedrag van de jeugdige, bedoeld in
      [artikel 77w van het Wetboek van Strafrecht][ref7];

      k. gedragsinterventie: een gestructureerd geheel van methodische handelingen gericht op de beïnvloeding van gedrag
      of omstandigheden van de jeugdige, met als doel het voorkomen van recidive.

      2 Onder jeugdige wordt mede verstaan een jongvolwassene die ten tijde van het plegen van een strafbaar feit de
      leeftijd van 18 jaren wel maar de leeftijd van 23 jaren nog niet had bereikt en ten aanzien van wie recht is gedaan
      overeenkomstig de [artikelen 77g tot en met 77hh van het Wetboek van Strafrecht][ref8].


