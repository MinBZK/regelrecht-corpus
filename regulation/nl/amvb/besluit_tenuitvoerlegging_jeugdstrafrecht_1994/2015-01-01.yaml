        artikel: 77tb
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 77tb
  - number: 17a
    text: |-
      1 Het openbaar ministerie brengt een vordering en een beslissing als bedoeld in
      [artikel 77tc, eerste lid, van het Wetboek van Strafrecht][ref1] ter kennis aan de raad voor de kinderbescherming.

      2 Het openbaar ministerie brengt een beslissing als bedoeld in [artikel 77tc, eerste lid][ref2], onverwijld ter
      kennis aan de selectiefunctionaris.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77tc
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel77tc
    url: https://wetten.overheid.nl/BWBR0007083/2015-01-01#Artikel17a
