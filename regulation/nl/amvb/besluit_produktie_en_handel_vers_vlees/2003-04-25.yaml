  - number: '1.3'
    text: |-
      Dit besluit is niet van toepassing op het uitsnijden en de opslag van vers vlees en vlees van gekweekt wild in
      detailhandelzaken of in lokalen die aan verkooppunten grenzen, waar het uitsnijden en de opslag uitsluitend met het
      oog op rechtstreekse verkoop ter plaatse aan de consument geschiedt.
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel1
  - number: '2.1'
    text: 'Met betrekking tot de produktie en het in de handel brengen van vers vlees wordt voldaan aan de eisen dat:'
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel2
  - number: 2.1.A
    text: 'hele karkassen, halve karkassen, halve karkassen die in ten hoogste drie stukken zijn verdeeld, of voeten:'
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel2
  - number: 2.1.A.a
    text: |-
      verkregen worden in een slachthuis dat aan de voorwaarden van [bijlage I][ref1], [hoofdstukken I][ref2] en
      [II][ref3], voldoet en overeenkomstig [artikel 9][ref4] is erkend en gecontroleerd;


      [ref1]: https://wetten.overheid.nl/BWBR0006294
      [ref2]: https://wetten.overheid.nl/BWBR0006294
      [ref3]: https://wetten.overheid.nl/BWBR0006294
      [ref4]: https://wetten.overheid.nl/BWBR0006294#Artikel9
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006294
      - id: ref2
        bwb_id: BWBR0006294
      - id: ref3
        bwb_id: BWBR0006294
      - id: ref4
        bwb_id: BWBR0006294
        artikel: '9'
  - number: 2.1.A.b
    text: |-
      afkomstig zijn van een slachtdier dat overeenkomstig [bijlage I][ref1], [hoofdstuk VI][ref2], vóór het slachten is
      gekeurd door een keuringsdierenarts en daarbij geschikt is bevonden om voor de toepassing van dit besluit te worden
      geslacht;


      [ref1]: https://wetten.overheid.nl/BWBR0006294
      [ref2]: https://wetten.overheid.nl/BWBR0006294
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel2
