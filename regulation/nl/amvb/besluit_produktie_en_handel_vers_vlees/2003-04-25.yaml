    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel1
  - number: 1.1.ll
    text: |-
      in de handel brengen: het verkopen, te koop aanbieden of uitstallen met het oog op verkoop, het afleveren, het ten
      geschenke geven of op enige andere wijze afstaan, het tot vervoer of aflevering voorhanden hebben, het in voorraad
      hebben, het vervoeren of doen vervoeren, anders dan ter naleving van enig wettelijk voorschrift;
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel1
  - number: 1.1.mm
    text: |-
      beschikking 2001/471/EG: beschikking nr. 2001/471/EG van de Commissie van de Europese Gemeenschappen van 8
      juni 2001 tot vaststelling van voorschriften voor het regelmatig doen controleren van de algemene hygiëne
      door de exploitanten in inrichtingen overeenkomstig [richtlijn nr. 64/433/EEG](31964L0433) betreffende
      gezondheidsvoorschriften voor de productie en het in de handel brengen van vers vlees en [richtlijn nr. 71/118/
      EEG](31971L0118) inzake gezondheidsvraagstukken op het gebied van de productie en het in de handel brengen van vers
      vlees van pluimvee (PbEG L 165).
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel1
  - number: '1.2'
    text: |-
      Voor zover niet anders bepaald, zijn de [artikelen 2][ref1] en [4][ref2],
      [5, eerste, derde, vierde tot en met zevende lid][ref3], en [6 tot en met 12][ref4] van overeenkomstige toepassing
      op vlees van gekweekt wild.


