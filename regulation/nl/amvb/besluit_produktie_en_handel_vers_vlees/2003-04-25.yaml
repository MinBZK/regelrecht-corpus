  - number: '2.2'
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel2
  - number: 2.2.a
    text: vers vlees dat bestemd is voor ander gebruik dan menselijke consumptie;
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel2
  - number: 2.2.b
    text: |-
      vers vlees dat bestemd is voor tentoonstellingen, bijzonder onderzoek of analyses, mits dit vlees niet voor
      menselijke consumptie wordt gebruikt en na afloop van de tentoonstellingen of voltooiing van het bijzondere
      onderzoek of de analyses, dit vlees met uitzondering van de bij de analyses gebruikte hoeveelheden, wordt
      vernietigd;
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel2
  - number: 2.2.c
    text: vers vlees dat uitsluitend is bestemd voor de bevoorrading van internationale organisaties.
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel2
  - number: '3.1'
    text: |-
      Onverminderd [artikel 1, tweede lid][ref1], voldoet vlees van gekweekt wild aan de navolgende eisen:


      [ref1]: https://wetten.overheid.nl/BWBR0006294#Artikel1
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006294
        artikel: '1'
  - number: 3.1.a
    text: het beslag van oorsprong wordt aan een periodieke veterinaire controle onderworpen;
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel3
  - number: 3.1.b
    text: |-
      er mogen geen beperkingen gelden naar aanleiding van: - het overeenkomstig artikel 11 van [richtlijn nr. 91/495/
      EEG](31991L0495) verrichte onderzoek;
        - een veterinaire keuring;
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel3
  - number: 3.1.c
    text: de desbetreffende dieren worden op andere tijdstippen geslacht dan runderen, varkens, schapen, paarden en geiten.
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel3
  - number: '3.2'
    text: |-
      Indien gekweekt wild niet kan worden vervoerd zonder risico's voor de begeleiders of in verband
      met het welzijn van de dieren, kan de Voedsel en Waren Autoriteit, in afwijking van het bepaalde in
      [artikel 2, eerste lid, onder A, punten ][ref1], toestaan dat wordt geslacht op de plaats van oorsprong. Deze
      afwijking kan worden toegestaan onder de volgende voorwaarden: - de eigenaar van de dieren dient daartoe een
      verzoek in bij de Voedsel en Waren Autoriteit onder opgave van het aantal dieren, plaats en de datum waarop de
      dieren worden geslacht;
        - het bedrijf beschikt over een verzamelcentrum van de niet-gedomesticeerde dieren waar het mogelijk is een keuring
      vóór het slachten van de te slachten groep te verrichten;
        - het bedrijf beschikt over een passende ruimte voor het bedwelmen, het steken en het uitbloeden van de dieren;
        - het doden door steken en uitbloeden wordt voorafgegaan door bedwelming, overeenkomstig [richtlijn 93/119/EG]
      (31993L0119), de Voedsel en Waren Autoriteit mag in bijzondere gevallen doden door middel van de kogel toestaan;
        - de gedode en uitgebloede dieren worden onder bevredigende hygiënische omstandigheden, in hangende positie
      vervoerd naar een overeenkomstig [artikel 9][ref2] of 10 erkend slachthuis en zulks zo spoedig mogelijk na
      het doden. Wanneer het wild dat is gedood op de plaats waar het werd gekweekt, niet binnen een uur naar een
      overeenkomstig [artikel 9][ref3] of 10 erkend slachthuis kan worden gebracht, wordt het vervoerd in een container
      of vervoermiddel waarin een temperatuur heerst tussen 0°C en 4°C. Het verwijderen van de ingewanden dient ten
      laatste drie uur na het bedwelmen plaats te vinden;
        - bij het vervoer naar het slachthuis gaan de geslachte dieren vergezeld van een verklaring van de
      keuringsdierenarts waaruit blijkt dat de keuring voor het slachten een gunstig resultaat heeft opgeleverd, dat het
      leegbloeden op correcte wijze is geschied en waarin het uur waarop het slachten heeft plaatsgevonden wordt vermeld;
      deze verklaring stemt overeen met het model in [bijlage IV][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0006294#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006294#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0006294#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0006294
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006294
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0006294
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0006294
        artikel: '9'
      - id: ref4
        bwb_id: BWBR0006294
  - number: '4'
    text: |-
      Vlees is slechts geschikt voor menselijke consumptie indien het wordt goedgekeurd. Onze Minister bepaalt in welke
      gevallen vlees wordt afgekeurd en onbruikbaar moet worden gemaakt voor voedsel van mens en dier.
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel4
  - number: '5.1'
    text: |-
      Onverminderd [artikel 4][ref1], ondergaat vers vlees van varkens of paarden als bedoeld in [artikel 2][ref2],
      dat niet overeenkomstig bijlage I van [richtlijn nr. 77/96/EEG](31977L0096) op trichinen is onderzocht, een
      koudebehandeling overeenkomstig bijlage IV van die richtlijn. Vlees van gekweekte everzwijnen of van andere
      voor besmetting met trichinen vatbare soorten gekweekt wild wordt onderzocht met behulp van een digestiemethode
      overeenkomstig [richtlijn nr. 77/96/EEG](31977L0096).


      [ref1]: https://wetten.overheid.nl/BWBR0006294#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006294#Artikel2
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006294
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0006294
        artikel: '2'
  - number: '5.2'
    text: Vlees
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel5
  - number: 5.2.a
    text: van mannelijke varkens bestemd voor de fok;
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel5
  - number: 5.2.b
    text: van cryptorchiede en hermafrodiete varkens;
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel5
  - number: 5.2.c
    text: |-
      van niet-gecastreerde mannelijke varkens met een geslacht gewicht hoger dan 80 kg, tenzij de inrichting op basis
      van een door Onze Minister goedgekeurde methode kan garanderen dat karkassen met een uitgesproken seksuele geur
      kunnen worden opgespoord; wordt voorzien van het speciale merk als bedoeld in Beschikking 84/371/EEG en ondergaat
      een behandeling als bedoeld in [richtlijn nr. 77/99/EEG](31977L0099).
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel5
  - number: '5.3'
    text: |-
      Voor het bereiden van separatorvlees mag niet worden gebruikt kopbeenderen, poten onder het voorkniegewricht,
      respectievelijk het spronggewricht, alsmede varkensstaarten. Separatorvlees moet een warmtebehandeling
      overeenkomstig [richtlijn nr. 77/99/EEG](31977L0099) ondergaan.
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel5
  - number: '5.4'
    text: |-
      Vlees van dieren die bij een speciale noodslachting zijn gedood, mag uitsluitend ten behoeve van de plaatselijke
      markt voor menselijke consumptie geschikt worden verklaard en slechts indien aan de onderstaande voorwaarden is
      voldaan: '- voor het bedrijf van oorsprong mogen geen veterinairrechtelijke beperkingen gelden;'
        - het dier wordt vóór het doden onderworpen aan een keuring voor het slachten door een dierenarts overeenkomstig
      [artikel 2, eerste lid, onder A, punt ][ref1];
        - het dier moet na bedwelming gedood, uitgebloed en eventueel ter plaatse van de ingewanden ontdaan zijn; de
      dierenarts mag in bijzondere gevallen afzien van bedwelming en doden door middel van de kogel toestaan;
        - het gedode en uitgebloede dier wordt onder bevredigende hygiënische omstandigheden vervoerd naar een
      overeenkomstig [artikel 9, tweede lid][ref2], erkende slachtplaats en zulks zo spoedig mogelijk na het doden.
      Wanneer het gedode dier niet binnen één uur naar dit slachthuis kan worden gebracht, moet het worden vervoerd in
      een container of vervoermiddel waarin een temperatuur heerst tussen 0°C en 4°C. Het verwijderen van de ingewanden
        - indien dat niet meteen bij het doden is gebeurd - vindt ten laatste drie uur daarna plaats. Indien de ingewanden
      ter plaatse worden verwijderd, blijven zij tot in het slachthuis duidelijk geïdentificeerd bij het karkas;
        - het gedode dier gaat bij het vervoer naar het slachthuis vergezeld van een verklaring van de dierenarts die
      opdracht heeft gegeven tot het doden, ter vermelding van het resultaat van de keuring voor het slachten, het
      tijdstip van het doden en de aard van de eventuele aan het dier toegediende behandeling en, eventueel, het
      resultaat van de keuring van de ingewanden; deze verklaring stemt overeen met een door Onze Minister vastgesteld
      model;
        - het karkas van het gedode dier wordt, zolang het niet geheel of gedeeltelijk geschikt bevonden voor
      menselijke consumptie kan worden beschouwd op basis van de keuring na het slachten overeenkomstig
      [artikel 2, eerste lid, onder A, punt ][ref3], eventueel aangevuld met een bacteriologisch onderzoek, zodanig
      gehanteerd dat het niet in contact komt met karkassen, vlees en slachtafvallen die geschikt zijn bevonden voor
      menselijke consumptie.


      [ref1]: https://wetten.overheid.nl/BWBR0006294#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006294#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0006294#Artikel2
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006294
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0006294
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0006294
        artikel: '2'
  - number: '5.5'
    text: |-
      Vlees afkomstig uit een zone waarvoor veterinairrechtelijke beperkingen gelden, wordt onderworpen aan door Onze
      Minister, in overeenstemming met de Minister van Landbouw, Natuurbeheer en Visserij, vastgestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel5
  - number: '5.6'
    text: |-
      De in de vorige leden bedoelde behandelingen worden uitgevoerd in de inrichting van oorsprong of in een andere door
      de keuringsdierenarts aangewezen inrichting.
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel5
  - number: '5.7'
    text: |-
      Vlees als bedoeld in het vierde lid en geschikt bevonden voor menselijke consumptie wordt voorzien van het in
      [artikel 10, vierde lid][ref1], bedoelde stempel.


      [ref1]: https://wetten.overheid.nl/BWBR0006294#Artikel10
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006294
        artikel: '10'
  - number: '6.1'
    text: Vlees dat is afgekeurd, dient duidelijk te kunnen worden onderscheiden van vlees dat is goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel6
  - number: '6.2'
    text: Vlees dat is afgekeurd, dient een behandeling overeenkomstig [richtlijn nr. 90/667/EEG](31990L0667) te ondergaan.
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel6
  - number: '7.1'
    text: |-
      Indien de keuringsdierenarts op grond van de bevindingen bij de keuring de aanwezigheid van residuen vermoedt,
      worden de desbetreffende dieren of het vlees daarvan op residuen onderzocht. Dit onderzoek heeft betrekking op
      opsporing van residuen van stoffen met farmacologische werking en de omzettingsprodukten daarvan, alsmede van
      andere stoffen die in het vlees terecht kunnen komen en die een gevaar voor de gezondheid van de mens kunnen
      opleveren.
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel7
  - number: '7.2'
    text: |-
      Indien in het onderzochte vlees sporen van residuen voorkomen in hoeveelheden die de toegestane toleranties
      overschrijden, wordt dit vlees afgekeurd.
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel7
  - number: '7.3'
    text: |-
      De onderzoeken op residuen worden verricht volgens deugdelijk gebleken methoden die wetenschappelijk zijn
      erkend, in het bijzonder die welke zijn omschreven in de desbetreffende communautaire regelingen of in andere
      internationale normen.
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel7
  - number: '7.4'
    text: |-
      Onze Minister stelt de toleranties vast voor stoffen die in vlees terecht kunnen komen en die schadelijk kunnen
      zijn voor de gezondheid van de mens, voor zover die nog niet zijn vastgesteld bij [richtlijn nr. 86/363/EEG]
      (31986L0363) en bij [Verordening (EEG) nr. 2377/90](31990R2377).
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel7
  - number: '8.1'
    text: 'De aanwezigheid van een keuringsdierenarts is vereist:'
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel8
  - number: 8.1.a
    text: |-
      in een overeenkomstig [artikel 9][ref1] erkend slachthuis gedurende de tijd dat er keuringen vóór en na het
      slachten worden verricht;


      [ref1]: https://wetten.overheid.nl/BWBR0006294#Artikel9
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006294
        artikel: '9'
  - number: 8.1.b
    text: |-
      in een overeenkomstig [artikel 9][ref1] erkende uitsnijderij terwijl er vlees wordt bewerkt, ten minste eenmaal per
      dag om de algemene hygiëne van de uitsnijderij en het register van het in- en uitgaande verse vlees te controleren;


      [ref1]: https://wetten.overheid.nl/BWBR0006294#Artikel9
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006294
        artikel: '9'
  - number: 8.1.c
    text: |-
      in een overeenkomstig [artikel 9][ref1] erkend koel- of vrieshuis of herverpakkingscentrum, op gezette tijden.


      [ref1]: https://wetten.overheid.nl/BWBR0006294#Artikel9
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006294
        artikel: '9'
  - number: '8.2'
    text: |-
      De keuringsdierenarts kan zich laten bijstaan door keurmeesters, onder zijn gezag en verantwoordelijkheid, voor de
      volgende taken:
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel8
  - number: 8.2.a
    text: |-
      keuring vóór het slachten; de keurmeester verricht een eerste observatie van de dieren en zuiver praktische
      werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel8
  - number: 8.2.b
    text: |-
      keuring na het slachten, voor zover de keuringsdierenarts daadwerkelijk ter plaatse toezicht kan houden op het werk
      van de keurmeesters;
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel8
  - number: 8.2.c
    text: keuring van uitgesneden en opgeslagen vlees;
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel8
  - number: 8.2.d
    text: |-
      inspectie en controle van de overeenkomstig [artikel 9][ref1] erkende inrichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006294#Artikel9
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006294
        artikel: '9'
  - number: '8.3'
    text: |-
      Als keurmeesters kunnen slechts optreden personen die voldoen aan de in [bijlage III][ref1] vastgestelde eisen na
      het met goed gevolg afgelegd hebben van een door Onze Minister aangewezen examen.


      [ref1]: https://wetten.overheid.nl/BWBR0006294
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006294
  - number: '8.4'
    text: |-
      Het aantal keurmeesters wordt beperkt tot een niveau dat de keuringsdierenarts de mogelijkheid biedt daadwerkelijk
      controle uit te oefenen op de keuring na het slachten. Onze Minister kan, in overeenstemming met de Minister van
      Landbouw, Natuurbeheer en Visserij, het maximum aantal vaststellen.
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel8
  - number: '8.5'
    text: |-
      De keurmeesters verlenen de bijstand in het kader van een keuringsteam onder controle en verantwoordelijkheid van
      de keuringsdierenarts. Zij zijn onafhankelijk van de betrokken inrichting. De Voedsel en Waren Autoriteit bepaalt
      voor elke inrichting de samenstelling van het team, ten einde de keuringsdierenarts in staat te stellen op het
      verloop van bovengenoemde werkzaamheden toezicht te houden.
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel8
  - number: '9.1'
    text: Onze Minister kan inrichtingen erkennen, die voldoen aan het bepaalde bij of krachtens dit besluit.
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel9
  - number: '9.2'
    text: |-
      De erkenning geldt niet voor speciale noodslachtingen en het slachten van zieke of van ziekte verdachte dieren,
      tenzij onze Minister anders heeft bepaald.
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel9
  - number: '9.3'
    text: |-
      Wanneer wordt geconstateerd dat de hygiënische voorschriften niet worden nageleefd en wanneer de in
      [bijlage I, hoofdstuk VIII, punt 41F][ref1], bedoelde maatregelen onvoldoende zijn gebleken om dit te verhelpen,
      wordt de erkenning voor het in geding zijnde deel van de activiteit of voor de hele inrichting tijdelijk door Onze
      Minister opgeschort.


      [ref1]: https://wetten.overheid.nl/BWBR0006294
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006294
  - number: '9.4'
    text: |-
      Wanneer de exploitant van de inrichting, de eigenaar of diens vertegenwoordiger de geconstateerde gebreken niet
      binnen de door Onze Minister vastgestelde termijn herstelt, trekt Onze Minister de erkenning voor het in geding
      zijnde deel van de activiteit of voor de hele inrichting in.
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel9
  - number: '9.5'
    text: 'Aan de erkenning zijn de volgende voorschriften verbonden:'
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel9
  - number: 9.5.a
    text: |-
      De exploitant van een inrichting, de eigenaar of diens vertegenwoordiger doet regelmatig de algemene hygiëne bij de
      productie in zijn inrichting controleren door het uitwerken en toepassen van een permanente procedure op basis van
      de HACCP-beginselen, bedoeld in artikel 1, eerste lid, van beschikking 2001/471/EG;
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel9
  - number: 9.5.b
    text: |-
      De exploitant van een inrichting, de eigenaar of diens vertegenwoordiger kan voor de procedure, bedoeld in
      onderdeel a, gebruikmaken van de aanvulling op de hygiënecode voor slachterijen en uitsnijderijen van de
      Productschappen voor Vee, Vlees en Eieren van 17 mei 2002, met de titel: «Uitvoering van de Beschikking 2001/471/EG
      voor slachterijen, uitsnijderijen en koel- en vrieshuizen in de roodvleessector (rund, kalf, varken, paard, schaap
      en geit)»;
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel9
  - number: 9.5.c
    text: |-
      De exploitant van een slachthuis, de eigenaar of diens vertegenwoordiger doet de in artikel 10, tweede lid, van de
      richtlijn bedoelde microbiologische controles uitvoeren overeenkomstig de in de bijlage van beschikking 2001/471/
      EG vastgelegde methode, dan wel overeenkomstig een door Onze Minister en de Minister van Landbouw, Natuurbeheer en
      Visserij goedgekeurde methode die tenminste gelijkwaardig is aan die in de bijlage van beschikking 2001/471/EG;
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel9
  - number: 9.5.d
    text: |-
      De exploitant van een uitsnijderij, de eigenaar of diens vertegenwoordiger doet de in artikel 10, tweede lid,
      van de richtlijn bedoelde microbiologische controles uitvoeren overeenkomstig de in deel 2 van de bijlage van
      beschikking 2001/471/EG vastgelegde methode, dan wel overeenkomstig een door Onze Minister in overeenstemming met
      de Minister van Landbouw, Natuurbeheer en Visserij goedgekeurde methode die tenminste gelijkwaardig is aan die in
      deel 2 van de bijlage van beschikking 2001/471/EG.
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel9
  - number: 9.5.e
    text: |-
      De exploitant van de inrichting, de eigenaar of diens vertegenwoordiger is, op verzoek, in staat de
      hoofdinspecteur, de keuringsdierenarts of de veterinaire deskundigen van de Commissie van de EEG, bedoeld in
      artikel 12 van de richtlijn in kennis te stellen van aard, frequentie en resultaat van de te dien einde verrichte
      controles, alsmede, zo nodig, van de naam van het controlelaboratorium;
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel9
  - number: 9.5.f
    text: |-
      De exploitant van de inrichting, de eigenaar of diens vertegenwoordiger zet een opleidingsprogramma op dat het
      personeel in staat stelt te voldoen aan de voorschriften inzake hygiënische produktie die zijn aangepast aan de
      produktiestructuur. De keuringsdierenarts die voor de inrichting verantwoordelijk is, wordt bij het opzetten en de
      uitvoering van dit programma betrokken;
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel9
  - number: 9.5.g
    text: De inrichtingen geven medewerking aan de controles, bedoeld in artikel 12 van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel9
  - number: '10.1'
    text: |-
      In afwijking van [artikel 9][ref1] kan Onze Minister slachthuizen erkennen die niet voldoen aan de
      [hoofdstukken I][ref2] en [II][ref3] van [bijlage I][ref4] van dit besluit, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0006294#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0006294
      [ref3]: https://wetten.overheid.nl/BWBR0006294
      [ref4]: https://wetten.overheid.nl/BWBR0006294
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006294
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0006294
      - id: ref3
        bwb_id: BWBR0006294
      - id: ref4
        bwb_id: BWBR0006294
  - number: 10.1.a
    text: het slachthuis,
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel10
  - number: 10.1.a.1
    text: niet meer behandelt dan 20 GVE per week met een maximum van 1000 GVE per jaar;
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel10
  - number: 10.1.a.2
    text: |-
      voldoet aan de voorschriften van [bijlage I][ref1], [hoofdstukken V][ref2] en [VII][ref3], [hoofdstuk XIII][ref4],
      [punt 65, eerste, tweede en vierde volzin][ref5], en [punt 66][ref6] en [hoofdstuk XIV][ref7], [punt 68][ref8], met
      uitzondering van de voorschriften voor ingevoerd vers vlees, en de punten 70, 71 en 72;


      [ref1]: https://wetten.overheid.nl/BWBR0006294
      [ref2]: https://wetten.overheid.nl/BWBR0006294
      [ref3]: https://wetten.overheid.nl/BWBR0006294
      [ref4]: https://wetten.overheid.nl/BWBR0006294
      [ref5]: https://wetten.overheid.nl/BWBR0006294
      [ref6]: https://wetten.overheid.nl/BWBR0006294
      [ref7]: https://wetten.overheid.nl/BWBR0006294
      [ref8]: https://wetten.overheid.nl/BWBR0006294
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006294
      - id: ref2
        bwb_id: BWBR0006294
      - id: ref3
        bwb_id: BWBR0006294
      - id: ref4
        bwb_id: BWBR0006294
      - id: ref5
        bwb_id: BWBR0006294
      - id: ref6
        bwb_id: BWBR0006294
      - id: ref7
        bwb_id: BWBR0006294
      - id: ref8
        bwb_id: BWBR0006294
  - number: 10.1.a.3
    text: |-
      voldoet aan de voorwaarden van [bijlage II][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006294
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006294
  - number: 10.1.a.4
    text: |-
      de keuringsdierenarts op de hoogte brengt van het tijdstip van slachten, het aantal dieren en de herkomst
      ervan, zodat deze, hetzij op het landbouwbedrijf, hetzij in het slachthuis, overeenkomstig [bijlage I][ref1],
      [hoofdstuk VI][ref2], vóór het slachten een keuring kan uitvoeren;


      [ref1]: https://wetten.overheid.nl/BWBR0006294
      [ref2]: https://wetten.overheid.nl/BWBR0006294
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006294
      - id: ref2
        bwb_id: BWBR0006294
  - number: 10.1.b
    text: |-
      de exploitant van het slachthuis, de eigenaar of diens vertegenwoordiger een register bijhoudt van: - de inkomende
      dieren en de uitgaande slachtprodukten;
        - de uitgevoerde keuringen; en
        - de resultaten van de keuringen; deze gegevens worden desgevraagd aan de keuringsdierenarts medegedeeld; en
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel10
  - number: 10.1.c
    text: |-
      het vlees na het slachten overeenkomstig [bijlage I][ref1], [hoofdstuk VIII][ref2], met inachtneming van
      [bijlage I][ref3], [hoofdstuk VII][ref4], [punt 32][ref5], door de keuringsdierenarts of de keurmeester wordt
      gekeurd; als het vlees laesies of afwijkingen vertoont, wordt de keuring na het slachten uitgevoerd door de
      keuringsdierenarts; de keuringsdierenarts of de keurmeester controleert regelmatig of de in [bijlage I][ref6],
      [hoofdstukken V][ref7] en [VII][ref8] bedoelde hygiënevoorschriften worden nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0006294
      [ref2]: https://wetten.overheid.nl/BWBR0006294
      [ref3]: https://wetten.overheid.nl/BWBR0006294
      [ref4]: https://wetten.overheid.nl/BWBR0006294
      [ref5]: https://wetten.overheid.nl/BWBR0006294
      [ref6]: https://wetten.overheid.nl/BWBR0006294
      [ref7]: https://wetten.overheid.nl/BWBR0006294
      [ref8]: https://wetten.overheid.nl/BWBR0006294
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006294
      - id: ref2
        bwb_id: BWBR0006294
      - id: ref3
        bwb_id: BWBR0006294
      - id: ref4
        bwb_id: BWBR0006294
      - id: ref5
        bwb_id: BWBR0006294
      - id: ref6
        bwb_id: BWBR0006294
      - id: ref7
        bwb_id: BWBR0006294
      - id: ref8
        bwb_id: BWBR0006294
  - number: '10.2'
    text: |-
      In afwijking van het eerste lid, onderdeel *a*, onder *i*, kan Onze Minister slachthuizen erkennen waar in de loop
      van een werkweek met duidelijk onderscheiden tussenpozen verschillende ondernemers voor eigen rekening slachten
      en waar na cumulatie van de individuele slachthoeveelheden ten hoogste 30 GVE per week en 1500 GVE per jaar worden
      geslacht, mits aan de onderstaande voorwaarden is voldaan:
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel10
  - number: 10.2.a
    text: |-
      de eigenaar van de inrichting op het gebied van de hygiënische produktie een door de hoofdinspecteur erkende
      bijzondere opleiding heeft gevolgd;
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel10
  - number: 10.2.b
    text: |-
      de voor de slacht bestemde dieren behoren toe aan de eigenaar van de inrichting of aan een zelfstandige slager of
      zijn door deze laatsten gekocht om aan de behoeften bedoeld in onderdeel *d*, te voldoen;
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel10
  - number: 10.2.c
    text: |-
      de vleesproduktie geschiedt in lokalen die voldoen aan de voorschriften van [bijlage II][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006294
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006294
  - number: 10.2.d
    text: |-
      de vleesproduktie is bestemd voor de bevoorrading van de inrichtingen die toebehoren aan de in onderdeel *b*
      bedoelde slagers en voor de verkoop ter plaatse aan de consument.
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel10
  - number: '10.3'
    text: |-
      Tevens kan Onze Minister in afwijking van het eerste lid, onderdeel *a*, onder *i*, toestaan dat met inachtneming
      van het maximum van 1000 GVE per jaar, wordt afgeweken van het wekelijkse maximum om rekening te houden met
      religieuze feesten mits de keuringsdierenarts bij het slachten aanwezig is en het vlees van de geslachte dieren
      niet wordt ingevroren alvorens het in de handel te brengen.
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel10
  - number: 10a
    text: |-
      Voor de toepassing van dit besluit worden voor de berekening van GVE de volgende omrekeningscoëfficiënten gebruikt:






                  Diersoort


                  GVE






                  **Runderen en gedomesticeerde wilde soortgenoten**




                  volwassen runderen en eenhoevigen


                  1




                  andere runderen, alsmede gedomesticeerde edelherten


                  0,5








                  **Varkens en gedomesticeerde wilde soortgenoten**




                  varkens meer dan 100 kg levend gewicht


                  0,2




                  andere varkens


                  0,15








                  **Andere diersoorten en gedomesticeerde wilde soortgenoten**





                  schapen en geiten, alsmede gedomesticeerde damherten


                  0,1








                  lammeren, jonge geiten en biggen van minder dan 15 kg levend gewicht


                  0,05
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel10a
  - number: 10b.1
    text: |-
      In afwijking van [artikel 9][ref1] kan Onze Minister uitsnijderijen, die niet in een erkende inrichting zijn
      gelegen en niet meer dan 5 ton uitgebeend vlees of het equivalent daarvan in vlees met been per week produceren
      en die niet voldoen aan [hoofdstukken I][ref2] en [III][ref3] van [bijlage I][ref4] van dit besluit, erkennen en
      afwijkingen toestaan overeenkomstig [bijlage II][ref5] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0006294#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0006294
      [ref3]: https://wetten.overheid.nl/BWBR0006294
      [ref4]: https://wetten.overheid.nl/BWBR0006294
      [ref5]: https://wetten.overheid.nl/BWBR0006294
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0006294
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0006294
      - id: ref3
        bwb_id: BWBR0006294
      - id: ref4
        bwb_id: BWBR0006294
      - id: ref5
        bwb_id: BWBR0006294
  - number: 10b.2
    text: |-
      Op de opslag en het uitsnijden in inrichtingen, die op grond van het eerste lid zijn erkend, zijn van
      toepassing de bepalingen van [bijlage I][ref1], [hoofdstuk V][ref2], [hoofdstuk VII][ref3], [punt 38][ref4],
      [hoofdstuk IX][ref5], met uitzondering van het in punt 46, onder *c*, bepaalde voorschrift, inzake temperatuur in
      het lokaal en hoofdstuk X, punt 48.


      [ref1]: https://wetten.overheid.nl/BWBR0006294
      [ref2]: https://wetten.overheid.nl/BWBR0006294
      [ref3]: https://wetten.overheid.nl/BWBR0006294
      [ref4]: https://wetten.overheid.nl/BWBR0006294
      [ref5]: https://wetten.overheid.nl/BWBR0006294
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0006294
      - id: ref2
        bwb_id: BWBR0006294
      - id: ref3
        bwb_id: BWBR0006294
      - id: ref4
        bwb_id: BWBR0006294
      - id: ref5
        bwb_id: BWBR0006294
  - number: 10c
    text: |-
      Vlees dat afkomstig is van de ingevolge [artikel 10][ref1] of 10*b* erkende inrichtingen en dat voldoet aan de
      hygiëne- en de keuringsvoorschriften van dit besluit en geschikt wordt bevonden voor menselijke consumptie, wordt
      voorzien van een stempel, waarvan het model door Onze Minister zal worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006294#Artikel10
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel10c
    references:
      - id: ref1
        bwb_id: BWBR0006294
        artikel: '10'
  - number: 10d
    text: |-
      Onze Minister kan aan inrichtingen, erkend overeenkomstig [artikel 10][ref1] en die op basis van een goedgekeurd
      herstructureringsplan aanpassingen ondergaan om overeenkomstig [artikel 9][ref2] te worden erkend, aanvullende
      voorwaarden stellen met betrekking tot de slachtcapaciteit en de te verhandelen hoeveelheden vlees.


      [ref1]: https://wetten.overheid.nl/BWBR0006294#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0006294#Artikel9
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel10d
    references:
      - id: ref1
        bwb_id: BWBR0006294
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0006294
        artikel: '9'
  - number: 10e
    text: |-
      Onze Minister kan aan inrichtingen, waaraan tot en met 31 december 1995 een afwijking is toegestaan als bedoeld
      in [artikel 22, tweede lid][ref1], en die ten genoegen van onze Minister kunnen aantonen dat ze begonnen zijn te
      voldoen aan de voorschriften van dit besluit, maar de aanvankelijk bepaalde termijn, om redenen die hun niet zijn
      aan te rekenen, niet zullen kunnen eerbiedigen, een aanvullende termijn toekennen die uiterlijk op 31 december 1998
      eindigt, om de aangegane verbintenissen na te kunnen komen.


      [ref1]: https://wetten.overheid.nl/BWBR0006294#Artikel22
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel10e
    references:
      - id: ref1
        bwb_id: BWBR0006294
        artikel: '22'
  - number: '11'
    text: |-
      Ingeval de keuringsdierenarts bij de keuring voor of na het slachten een voor de mens besmettelijke ziekte
      constateert, stelt hij hiervan de hoofdinspecteur in kennis.
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel11
  - number: '12'
    text: 'Onze Minister kan ter uitvoering van krachtens artikel 16 van de richtlijn vastgestelde maatregelen:'
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel12
  - number: 12.a
    text: |-
      met betrekking tot [artikel 2, eerste lid, onder A, punt ][ref1], nadere regelen stellen, met name inzake de
      toekenning van de codenummers en de opstelling van een of meer lijsten aan de hand waarvan de keuringsdierenartsen
      kunnen worden geïdentificeerd;


      [ref1]: https://wetten.overheid.nl/BWBR0006294#Artikel2
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006294
        artikel: '2'
  - number: 12.b
    text: |-
      met betrekking tot [artikel 2, eerste lid, onder E, punten ][ref1], regels stellen inzake de bijzondere waarborgen
      betreffende de keuring en de verklaring dat is voldaan aan de eisen met betrekking tot de opslag en het vervoer,
      alsmede de voorwaarden vaststellen voor de afgifte van het certificaat;


      [ref1]: https://wetten.overheid.nl/BWBR0006294#Artikel2
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006294
        artikel: '2'
  - number: 12.c
    text: |-
      met betrekking tot [artikel 3, eerste lid, onder ][ref1], nadere regels stellen inzake de uitvoering van de in dat
      lid bedoelde controle.


      [ref1]: https://wetten.overheid.nl/BWBR0006294#Artikel3
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006294
        artikel: '3'
  - number: 12.d
    text: |-
      met betrekking tot [artikel 6][ref1] nadere regelen stellen;


      [ref1]: https://wetten.overheid.nl/BWBR0006294#Artikel6
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006294
        artikel: '6'
  - number: 12.e
    text: |-
      met betrekking tot [artikel 7, derde lid][ref1], referentiemethoden vaststellen aan de hand waarvan de uitkomsten
      van de onderzoeken op residuen moeten kunnen worden geëvalueerd, alsmede de referentielaboratoria aanwijzen voor
      het onderzoek op residuen;


      [ref1]: https://wetten.overheid.nl/BWBR0006294#Artikel7
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006294
        artikel: '7'
  - number: 12.f
    text: |-
      met betrekking tot [artikel 8][ref1] nadere regelen vaststellen inzake de in dat artikel bedoelde bijstand door
      keurmeesters;


      [ref1]: https://wetten.overheid.nl/BWBR0006294#Artikel8
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006294
        artikel: '8'
  - number: 12.g
    text: |-
      met betrekking tot [artikel 9, vijfde lid, onder ][ref1], de aard en de frequentie van de daar bedoelde controles,
      alsmede de methoden van monsterneming en bacteriologisch onderzoek vaststellen;


      [ref1]: https://wetten.overheid.nl/BWBR0006294#Artikel9
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006294
        artikel: '9'
  - number: 12.h
    text: |-
      [artikel 10][ref1] van toepassing verklaren op inrichtingen in gebieden met bijzondere geografische beperkingen of
      voorzieningsmoeilijkheden waar ten hoogste 2000 GVE per jaar worden verwerkt, indien is voldaan aan de onderstaande
      voorwaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0006294#Artikel10
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006294
        artikel: '10'
  - number: 12.h.1e
    text: |-
      de eigenaar van de inrichting moet op het gebied van de hygiënische produktie een door de inspecteur erkende
      bijzondere opleiding hebben gevolgd;
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel12
  - number: 12.h.2e
    text: |-
      de voor de slacht bestemde dieren moeten toebehoren aan de eigenaar van de inrichting of door hem zijn gekocht om
      aan de behoeften als bedoeld onder 4e te voldoen;
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel12
  - number: 12.h.3e
    text: |-
      de vleesproduktie moet geschieden in lokalen die zijn gelegen in de inrichting en die voldoen aan de voorschriften
      van [bijlage II][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006294
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006294
  - number: 12.h.4e
    text: |-
      de vleesproduktie moet beperkt blijven tot de voorziening van de inrichting of tot de directe verkoop ter plaatse
      aan de verbruiker;
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel12
  - number: 12.i
    text: |-
      [artikel 10][ref1] van toepassing verklaren op slachthuizen en uitsnijderijen in andere gevallen dan bedoeld onder
      *h*.;


      [ref1]: https://wetten.overheid.nl/BWBR0006294#Artikel10
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006294
        artikel: '10'
  - number: 12.j
    text: |-
      afwijkende regelen stellen met betrekking tot [bijlage I][ref1], [hoofdstuk II][ref2], [punt 14][ref3],
      [onder ][ref4], tweede, derde en vierde streepje, hoofdstuk VIII, punt 42A, onder 2, en hoofdstuk IX, punt 46,
      onder *d*;


      [ref1]: https://wetten.overheid.nl/BWBR0006294
      [ref2]: https://wetten.overheid.nl/BWBR0006294
      [ref3]: https://wetten.overheid.nl/BWBR0006294
      [ref4]: https://wetten.overheid.nl/BWBR0006294
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006294
      - id: ref2
        bwb_id: BWBR0006294
      - id: ref3
        bwb_id: BWBR0006294
      - id: ref4
        bwb_id: BWBR0006294
  - number: 12.k
    text: bijzondere erkenningsvoorwaarden stellen voor inrichtingen die in groothandelsmarkten zijn gelegen;
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel12
  - number: 12.l
    text: |-
      regels vaststellen met betrekking tot bijstand aan veterinaire deskundigen van de Commissie van de Europese
      Gemeenschap.
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel12
  - number: 12a
    text: |-
      Onze Minister kan met betrekking tot [artikel 9, vijfde lid, onder b][ref1], regels stellen omtrent de aard en de
      frequentie van de daar bedoelde controles, alsmede omtrent de methoden van monsterneming en het bacteriologische
      onderzoek, indien het betreft het opvangen en behandelen van bloed bestemd voor menselijke consumptie.


      [ref1]: https://wetten.overheid.nl/BWBR0006294#Artikel9
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0006294
        artikel: '9'
  - number: '13'
    text: |-
      Voor de toepassing van dit besluit wordt een ter uitvoering van artikel 10 van de richtlijn door een andere lid-
      staat van de Europese Gemeenschappen of van de Europese Ruimte erkende inrichting gelijkgesteld met een inrichting,
      erkend overeenkomstig [artikel 9][ref1] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0006294#Artikel9
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006294
        artikel: '9'
  - number: 13a
    text: |-
      Terzake van de controle alsmede keuring verricht door de keuringsdierenarts, als bedoeld in punt 48 van
      [bijlage I][ref1], [hoofdstuk X][ref2], is de eigenaar, het hoofd of de bestuurder van een uitsnijderij, koel- of
      vrieshuis een vergoeding verschuldigd overeenkomstig een door Onze Minister vastgesteld tarief.


      [ref1]: https://wetten.overheid.nl/BWBR0006294
      [ref2]: https://wetten.overheid.nl/BWBR0006294
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0006294
      - id: ref2
        bwb_id: BWBR0006294
  - number: '14'
    text: |-
      Het Besluit van 13 maart 1985 (*Stb.* 217), ex [artikel 1, tweede lid van de Vleeskeuringswet][ref1] wordt
      ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0001896#Artikel1
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001896
        artikel: '1'
  - number: '15'
    text: |-
      Het Besluit van 22 juni 1920 (*Stb.* 314) tot uitvoering van [artikel 25, tweede lid van de Vleeskeuringswet][ref1]
      wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0001896#Artikel25
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0001896
        artikel: '25'
  - number: '16'
    text: Het Besluit bijzondere slachtplaatsen wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel16
  - number: '18'
    text: |-
      Het Besluit van 26 november 1957 (*Stb.* 513), tot uitvoering van [artikel 2, eerste lid, onder ][ref1] wordt
      ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0001896#Artikel2
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001896
        artikel: '2'
  - number: '19'
    text: |-
      Het Besluit van 14 februari 1958 (*Stb.* 92), tot uitvoering van
      [artikel 2, tweede lid, van de Vleeskeuringswet][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0001896#Artikel2
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0001896
        artikel: '2'
  - number: '22.1'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel22
  - number: '22.2'
    text: |-
      In afwijking van het eerste lid treedt dit besluit voor inrichtingen waaraan door Onze Minister, op de
      voet van [richtlijn nr. 91/498/EEG](31991L0498) of op voet van [richtlijn nr. 92/120/EEG](31992L0120), een
      afwijking is toegestaan van de in de punten 1 tot en met 14, onderscheidenlijk 16 en 17 van bijlage I bij de in
      [artikel 1, eerste lid, onder ][ref1], bedoelde richtlijn, voor wat betreft die punten in werking met ingang van 1
      januari 1996. Vlees, onderscheidenlijk vlees van gekweekt grof wild, afkomstig uit in dit lid bedoelde inrichtingen
      wordt voorzien van een door Onze minister vast te stellen stempel.


      [ref1]: https://wetten.overheid.nl/BWBR0006294#Artikel1
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006294
        artikel: '1'
  - number: '22.3'
    text: |-
      Wijziging van een of meer onderdelen van richtlijnen waarnaar in dit besluit wordt verwezen, treedt voor de
      toepassing van de artikelen van dit besluit, waarin naar die onderdelen van deze richtlijnen wordt verwezen, in
      werking met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel22
  - number: '23'
    text: 'Dit besluit wordt aangehaald als: Besluit produktie en handel vers vlees.'
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel23
