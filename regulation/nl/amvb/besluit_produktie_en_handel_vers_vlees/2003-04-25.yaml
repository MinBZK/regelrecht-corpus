$id: besluit_produktie_en_handel_vers_vlees
regulatory_layer: AMVB
publication_date: '2005-12-13'
valid_from: '2003-04-25'
bwb_id: BWBR0006294
url: https://wetten.overheid.nl/BWBR0006294/2003-04-25
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 24 mei 1993, DGVgz/VVP/V-
    93845, gedaan in overeenstemming met Onze Minister van Landbouw, Natuurbeheer en Visserij;

    Gelet op richtlijn nr. 91/497/EEG van de Raad van de Europese Gemeenschappen van 29 juli 1991 tot wijziging en
    bijwerking van richtlijn nr. 64/433/EEG inzake gezondheidsvraagstukken op het gebied van het intracommunautaire
    handelsverkeer in vers vlees teneinde deze uit te breiden tot de produktie en het in de handel brengen van vers
    vlees en tot wijziging van richtlijn nr. 72/462/EEG (PbEG L 268), op richtlijn nr. 91/498/EEG van de Raad van
    de Europese Gemeenschappen van 29 juli 1991, houdende vaststelling van de voorschriften voor het toestaan van
    tijdelijke en beperkte afwijkingen op de specifieke communautaire gezondheidsvoorschriften voor de produktie
    en het in de handel brengen van vers vlees (PbEG L 268), op richtlijn 91/495/EEG van de Raad van de Europese
    Gemeenschappen van 27 november 1990 inzake gezondheidsvoorschriften en veterinairrechtelijke voorschriften
    voor de produktie en het in de handel brengen van konijnevlees en vlees van gekweekt wild (PbEG L 268) en op
    richtlijn nr. 92/120/EEG van de Raad van de Europese Gemeenschappen van 17 december 1992, houdende vaststelling
    van de voorschriften voor het toestaan van tijdelijk en beperkte afwijkingen op de specifieke communautaire
    gezondheidsvoorschriften voor de produktie en het in de handel brengen van bepaalde produkten van dierlijke
    oorsprong (PbEG L 62), alsmede op de artikelen 5, 18, 19, 19a, 25 en 30a van de Vleeskeuringswet en op het eerste
    lid van artikel II van de wijzigingswet 1988 Warenwet (Stb. 358) juncto artikel 16 van de Warenwet (Stb. 1935,
    793);

    Gezien het advies van de Adviescommissie Vleeskeuringswet (advies van 12 maart 1993, ACVW/U-93002);

    De Raad van State gehoord (advies van 26 augustus 1993, No. W13.93.0320);

    Gezien het nader rapport van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 23 november 1993,
    DGVgz/VVP/V-931986, uitgebracht in overeenstemming met Onze Minister van Landbouw, Natuurbeheer en Visserij;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Welzijn, Volksgezondheid en Cultuur;'
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel1
  - number: 1.1.b
    text: |-
      de wet: de [Vleeskeuringswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001896
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001896
  - number: 1.1.c
    text: 'hoofdinspecteur: de veterinair hoofdinspecteur van de Voedsel en Waren Autoriteit;'
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel1
  - number: 1.1.d
    text: |-
      keuringsdierenarts: persoon, bedoeld in de eerste zinsnede van [artikel 25 van de wet][ref1], belast met keuring
      van slachtdieren en van vlees;


      [ref1]: https://wetten.overheid.nl/BWBR0001896#Artikel25
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001896
        artikel: '25'
  - number: 1.1.e
    text: |-
      de richtlijn: [richtlijn nr. 64/433/EEG](31964L0433) van de Raad van de Europese Gemeenschappen betreffende de
      gezondheidsvoorschriften voor de produktie en het in de handel brengen van vers vlees (*PbEG* 1964, L 121);
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel1
  - number: 1.1.f
    text: |-
      vlees: alle voor menselijke consumptie geschikte delen van als landbouwhuisdier gehouden runderen (de soorten
      Bubalus bubalis en Bison bison daaronder begrepen), varkens, schapen, geiten en eenhoevigen;
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel1
  - number: 1.1.g
    text: |-
      vers vlees: vlees, ook vacuüm of in gecontroleerde atmosfeer verpakt, dat, buiten de koudebehandeling, geen
      behandeling ter bevordering van de houdbaarheid heeft ondergaan;
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel1
  - number: 1.1.h
    text: 'separatorvlees: vlees dat machinaal is afgescheiden van beenderen met daaraan vastzittend vlees;'
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel1
  - number: 1.1.i
    text: |-
      karkas: het uitgebloede gehele slachtdier dat is ontdaan van de ingewanden, waarvan de poten zijn afgesneden ter
      hoogte van het voorkniegewricht respectievelijk het spronggewricht, en waarvan de kop, de staart en de uier zijn
      verwijderd; voor runderen, schapen, geiten en eenhoevigen betreft het karkassen als hierboven bedoeld na het
      onthuiden. Bij varkens hoeven de poten niet ter hoogte van het voorkniegewricht, respectievelijk het spronggewricht
      te worden afgesneden en hoeft de kop niet te worden verwijderd wanneer het vlees bestemd is om te worden behandeld
      overeenkomstig de regelen, gesteld krachtens [richtlijn nr. 77/99/EEG](31977L0099);
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel1
  - number: 1.1.j
    text: |-
      slachtafval: vers vlees dat geen deel uitmaakt van het karkas als omschreven onder *i*, ook indien het op
      natuurlijke wijze met het karkas verbonden blijft;
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel1
  - number: 1.1.k
    text: 'ingewanden: het slachtafval in de borst-, buik- en de bekkenholte, met inbegrip van de luchtpijp en de slokdarm;'
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel1
  - number: 1.1.l
    text: |-
      land van verzending: de lid-staat van de Europese Gemeenschappen of van de Europese Ruimte van waaruit vers vlees
      wordt verzonden;
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel1
  - number: 1.1.m
    text: |-
      land van bestemming: de lid-staat van de Europese Gemeenschappen of van de Europese Ruimte waarnaar vers vlees uit
      een andere lid-staat wordt verzonden;
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel1
  - number: 1.1.n
    text: |-
      land van produktie: de lid-staat van de Europese Gemeenschappen of van de Europese Ruimte op het grondgebied
      waarvan de inrichting zich bevindt;
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel1
  - number: 1.1.o
    text: |-
      vervoermiddelen: voor belading bestemde gedeelten van motorvoetuigen, van spoorvoertuigen en van luchtvaartuigen,
      alsmede scheepsruimen of containers voor het vervoer over land, over zee of door de lucht;
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel1
  - number: 1.1.p
    text: |-
      inrichting: slachthuis, uitsnijderij, koelhuis of vrieshuis, herverpakkingscentrum of een complex bestaande uit
      verscheidene van deze inrichtingen;
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel1
  - number: 1.1.q
    text: |-
      herverpakkingscentrum: een werkplaats of een opslagplaats waar vlees met een onmiddellijke verpakking dat bestemd
      is om in de handel te worden gebracht opnieuw bijeengebracht of herverpakt wordt;
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel1
  - number: 1.1.r
    text: 'GVE: Groot Vee Eenheden;'
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel1
  - number: 1.1.s
    text: |-
      onmiddellijke verpakking: het beschermen van vers vlees door middel van een eerste omhulsel of een eerste
      bergingsmiddel dat rechtstreeks in contact komt met het betrokken verse vlees, alsmede het eerste omhulsel of het
      eerste bergingsmiddel zelf;
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel1
  - number: 1.1.t
    text: |-
      eindverpakking: het plaatsen van vers vlees in onmiddellijke verpakking in een tweede bergingsmiddel, alsmede het
      bergingsmiddel zelf;
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel1
  - number: 1.1.u
    text: |-
      speciale noodslachting: het doden, op last van een dierenarts, wegens een ongeval of ernstige lichamelijke en
      functionele stoornissen. De speciale noodslachting wordt buiten een slachthuis uitgevoerd indien de dierenarts
      meent dat vervoer onmogelijk is of onnodig lijden van het dier zou meebrengen;
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel1
  - number: 1.1.v
    text: |-
      vlees van gekweekt wild: alle voor menselijke consumptie geschikte delen van niet-gedomesticeerde landzoogdieren,
      niet zijnde lagomorfen, die niet worden vermeld onder *f*, die in gevangenschap zijn gekweekt, gehouden en
      geslacht;
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel1
  - number: 1.1.w
    text: |-
      gekweekt wild: niet als huisdier beschouwde landzoogdieren, niet zijnde lagomorfen, die niet worden vermeld
      onder *f*, en die worden gehouden als huisdieren. Niet-gedomesticeerde zoogdieren die leven op een afgesloten
      gebied onder soortgelijke omstandigheden ten aanzien van vrijheid als wild worden evenwel niet als gekweekt wild
      beschouwd;
    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel1
  - number: 1.1.x
    text: |-
      [richtlijn 90/675/EEG](31990L0675): de [richtlijn nr. 90/675/EEG](31990L0675) van de Raad van de Europese
