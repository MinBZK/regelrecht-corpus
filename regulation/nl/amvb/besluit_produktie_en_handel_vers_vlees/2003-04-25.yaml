    url: https://wetten.overheid.nl/BWBR0006294/2003-04-25#Artikel1
  - number: 1.1.kk
    text: |-
      [verordening (EEG) 2377/90](31990R2377): de [verordening (EEG) nr. 2377/90](31990R2377) van de Raad van de Europese
      Gemeenschappen van 26 juni 1990 houdende een communautaire procedure tot vaststelling van maximumwaarden voor
