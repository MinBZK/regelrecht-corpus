preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Financiën van 2 december 1993, no. BGW93-2098, Generale Thesaurie, Directie
    Binnenlands Geldwezen, Afdeling Verzekeringswezen;

    Gelet op deartikelen 20, aanhef en onderdeel a, en 187, eerste lid, van de Wet toezicht verzekeringsbedrijf 1993;

    Gezien de adviezen van de Verzekeringskamer en van het Verbond van Verzekeraars;

    De Raad van State gehoord (advies van 21 februari 1994, no. W06.93.0807);

    Gezien het nader rapport van Onze Minister van Financiën van 15 april 1994, no. BGW94-265;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      De [Wet toezicht verzekeringsbedrijf 1993][ref1] is, voor zover in dit besluit niet anders is bepaald, niet
      van toepassing op een onderlinge waarborgmaatschappij met zetel in Nederland die het schadeverzekeringsbedrijf
      uitoefent en in het bezit is van een door de Pensioen- & Verzekeringskamer verleende verklaring ingevolge
      [de artikelen 2][ref2] of [3][ref3] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0006509
      [ref2]: https://wetten.overheid.nl/BWBR0006624#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0006624#Artikel3
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006509
      - id: ref2
        bwb_id: BWBR0006624
        artikel: '2'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0006624
        artikel: '3'
        hoofdstuk: '1'
  - number: '1.2'
    text: |-
      Bij de aanvraag van een verklaring legt de aanvraagster aan de Pensioen- & Verzekeringskamer een programma van
      werkzaamheden over.
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel1
  - number: '1.3'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot het programma van werkzaamheden, bedoeld in het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel1
  - number: '1.4'
    text: |-
      Indien voor de eerste maal een verklaring wordt aangevraagd, legt de aanvraagster tevens aan de Pensioen- &
      Verzekeringskamer over een authentiek afschrift van de akte van oprichting, een exemplaar van haar statuten en
      reglementen alsmede een lijst met namen en adressen van haar bestuurders.
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel1
  - number: '1.5'
    text: |-
      Indien de stukken die bij de aanvraag van een verklaring zijn overgelegd de Pensioen- & Verzekeringskamer
      aanleiding geven tot het maken van opmerkingen, stelt zij de aanvraagster in de gelegenheid op deze opmerkingen
      binnen een door haar te stellen termijn te antwoorden.
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel1
  - number: '1.6'
    text: |-
      De Pensioen- & Verzekeringskamer beslist binnen acht weken. Indien toepassing is gegeven aan het vijfde lid,
      begint de in de eerste volzin genoemde termijn op het tijdstip waarop de inlichtingen door de Pensioen- &
      Verzekeringskamer zijn ontvangen.
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel1
  - number: '1.7'
    text: De Pensioen- & Verzekeringskamer doet van de verlening van een verklaring mededeling in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel1
  - number: '1.8'
    text: |-
      De Pensioen- & Verzekeringskamer legt te haren kantore ten behoeve van een ieder een lijst ter inzage van de
      onderlinge waarborgmaatschappijen die in het bezit zijn van een verklaring.
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel1
  - number: '2.1'
    text: 'De Pensioen- & Verzekeringskamer verleent een verklaring aan een onderlinge waarborgmaatschappij waarvan:'
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel2
  - number: 2.1.a
    text: |-
      de statuten bepalen dat de leden tijdens de bedrijfsuitoefening verplicht zijn of kunnen worden volledig bij te
      dragen in de tekorten of dat de schadevergoedingsplicht naar gelang van de beschikbare middelen kan worden beperkt
      en dat bij de ontbinding de leden en zij die binnen de in de statuten bepaalde termijn hebben opgehouden leden te
      zijn, aansprakelijk zijn voor tekorten of dat de schadevergoedingsplicht naar gelang van de beschikbare middelen
      kan worden beperkt;
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel2
  - number: 2.1.b
    text: |-
      de bedrijfsuitoefening is beperkt tot slechts een van de branches, genoemd in
      [artikel 15 van de Wet toezicht verzekeringsbedrijf 1993][ref1], met uitzondering van de branches Ongevallen,
      Ziekte, Aansprakelijkheid motorrijtuigen, Aansprakelijkheid wegvervoer, Aansprakelijkheid luchtvaartuigen,
      Aansprakelijkheid zee- en binnenschepen, Algemene aansprakelijkheid, Krediet, Borgtocht en Hulpverlening;


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel15
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '15'
  - number: 2.1.c
    text: |-
      de bij haar verzekerde risico’s op naar het oordeel van de Pensioen- & Verzekeringskamer genoegzame wijze zijn
      herverzekerd, tenzij de Pensioen- & Verzekeringskamer er mee instemt dat geen herverzekering plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel2
  - number: 2.1.d
    text: ten minste de helft van het jaarlijkse bruto premie-inkomen afkomstig is van de leden;
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel2
  - number: 2.1.e
    text: het aantal verzekeringnemers niet groter is dan drieduizend; en
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel2
  - number: 2.1.f
    text: het jaarlijkse bruto premie-inkomen niet meer dan € 455 000 beloopt.
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel2
  - number: '2.2'
    text: |-
      Het eerste lid, onderdeel *c*, is niet van toepassing op een onderlinge waarborgmaatschappij zolang het aantal
      verzekeringnemers niet groter is dan tweehonderd en het jaarlijkse bruto premie-inkomen niet meer dan € 91 000
      beloopt.
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel2
  - number: '3.1'
    text: |-
      De Pensioen- & Verzekeringskamer verleent een verklaring aan een onderlinge waarborgmaatschappij waaraan geen
      verklaring ingevolge [artikel 2][ref1] kan worden verleend en waarvan:


      [ref1]: https://wetten.overheid.nl/BWBR0006624#Artikel2
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006624
        artikel: '2'
        hoofdstuk: '1'
  - number: 3.1.a
    text: |-
      de statuten bepalen dat de leden tijdens de bedrijfsuitoefening verplicht zijn of kunnen worden volledig bij te
      dragen in de tekorten of dat de schadevergoedingsplicht naar gelang van de beschikbare middelen kan worden beperkt
      en dat bij de ontbinding de leden en zij die binnen de in de statuten bepaalde termijn hebben opgehouden leden te
      zijn, aansprakelijk zijn voor tekorten of dat de schadevergoedingsplicht naar gelang van de beschikbare middelen
      kan worden beperkt;
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel3
  - number: 3.1.b
    text: |-
      de bedrijfsuitoefening zich niet uitstrekt tot de branches Ongevallen, Ziekte, Aansprakelijkheid motorrijtuigen,
      Aansprakelijkheid wegvervoer, Aansprakelijkheid luchtvaartuigen, Aansprakelijkheid zee- en binnenschepen, Algemene
      aansprakelijkheid, Krediet, Borgtocht en Hulpverlening;
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel3
  - number: 3.1.c
    text: het jaarlijkse bruto premie-inkomen niet meer dan € 5 miljoen beloopt; en
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel3
  - number: 3.1.d
    text: ten minste de helft van het jaarlijkse bruto premie-inkomen afkomstig is van de leden.
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel3
  - number: '3.2'
    text: |-
      De onderlinge waarborgmaatschappij dient te beschikken over een solvabiliteitsmarge
      die ten minste € 205 000 bedraagt. Ten aanzien van deze solvabiliteitsmarge is
      [artikel 68, eerste lid en vierde tot en met zesde lid, van de Wet toezicht verzekeringsbedrijf 1993][ref1] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel68
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '68'
  - number: '4.1'
    text: |-
      Een onderlinge waarborgmaatschappij waaraan een verklaring ingevolge [artikel 2][ref1] is verleend:


      [ref1]: https://wetten.overheid.nl/BWBR0006624#Artikel2
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006624
        artikel: '2'
        hoofdstuk: '1'
  - number: 4.1.a
    text: |-
      dient binnen de door [artikel 58, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1] bepaalde termijnen haar
      jaarrekening en jaarverslag bij de Pensioen- & Verzekeringskamer in;


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel58
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '58'
  - number: 4.1.b
    text: |-
      toont op verzoek en ten genoegen van de Pensioen- & Verzekeringskamer binnen de door deze te bepalen termijn aan
      dat zij nog voldoet aan de voorwaarden, gesteld in [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006624#Artikel2
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006624
        artikel: '2'
        hoofdstuk: '1'
  - number: 4.1.c
    text: |-
      gedoogt dat de Pensioen- & Verzekeringskamer op elk door deze gewenst tijdstip bij haar een onderzoek instelt of
      zij nog voldoet aan de voorwaarden, gesteld voor het verkrijgen van de verklaring, en aan de verplichtingen die
      overigens ingevolge dit besluit op haar rusten;
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel4
  - number: 4.1.d
    text: |-
      geeft aan de Pensioen- & Verzekeringskamer of aan personen, door deze bij uitdrukkelijke en bijzondere machtiging
      aangewezen, inzage van haar zakelijke gegevens en bescheiden en verleent de vereiste medewerking opdat hij, die
      deze zakelijke gegevens en bescheiden onder zich heeft, deze aan de Pensioen- & Verzekeringskamer of de door deze
      aangewezen personen ter inzage geeft.
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel4
  - number: '4.2'
    text: |-
      Een derde, die de in het eerste lid, onderdeel *d*, bedoelde zakelijke gegevens en bescheiden onder zich heeft,
      legt deze desgevorderd over aan de Pensioen- & Verzekeringskamer of de overeenkomstig genoemd onderdeel aangewezen
      personen.
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel4
  - number: '4.3'
    text: |-
      Het eerste lid, onderdeel *a*, is niet van toepassing op een onderlinge waarborgmaatschappij indien het aantal
      verzekeringnemers niet groter is dan tweehonderd en het jaarlijkse bruto premie-inkomen niet meer dan € 91 000
      beloopt.
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel4
  - number: '5.1'
    text: |-
      Een onderlinge waarborgmaatschappij waaraan een verklaring ingevolge [artikel 3][ref1] is verleend, dient binnen
      zes maanden na afloop van het boekjaar bij de Pensioen- & Verzekeringskamer een opgave in met betrekking tot de
      vanuit de vestigingen in Nederland gesloten overeenkomsten van verzekering met betrekking tot in andere lid-staten
      dan Nederland gelegen risico's. In die opgave worden per lid-staat en per branchegroep de in dat boekjaar geboekte
      premies, schaden en provisies vermeld, telkens zonder aftrek van herverzekering.


      [ref1]: https://wetten.overheid.nl/BWBR0006624#Artikel3
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006624
        artikel: '3'
        hoofdstuk: '1'
  - number: '5.2'
    text: |-
      De in het eerste lid bedoelde branchegroepen en het model van de opgave worden door de Pensioen- &
      Verzekeringskamer vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel5
  - number: '6.1'
    text: |-
      Ten aanzien van een onderlinge waarborgmaatschappij waaraan een verklaring ingevolge [artikel 2][ref1]
      is verleend, is het bepaalde bij of krachtens de [artikelen 1][ref2], [2][ref3], [8][ref4],
      [10, eerste lid][ref5], [11][ref6], [15][ref7], [18][ref8], [20, aanhef en onderdeel a][ref9], [29][ref10],
      [51][ref11], [54][ref12], [55][ref13], [55a][ref14], [56][ref15], [64][ref16], [70][ref17], [70a][ref18],
      [71][ref19], [75, eerste tot en met derde lid][ref20], [141, eerste lid][ref21], [182 tot en met 186][ref22],
      [188, eerste lid][ref23], en [188a, van de Wet toezicht verzekeringsbedrijf 1993][ref24] van toepassing of van
      overeenkomstige toepassing.


