  - number: '7.2'
    text: |-
      De waarden, bedoeld in [artikel 66, zesde lid, eerste volzin, van de Wet toezicht verzekeringsbedrijf 1993][ref1]
      moeten in Nederland aanwezig zijn, met dien verstande dat met betrekking tot een overeenkomst van communautaire co-
      assurantie deze waarden ter keuze van de onderlinge waarborgmaatschappij ook aanwezig mogen zijn in de andere lid-
      staten van waaruit de overige co-assuradeuren deelnemen aan de overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel66
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '66'
  - number: '7.3'
    text: |-
      [Artikel 6, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006624#Artikel6
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006624
        artikel: '6'
        hoofdstuk: '1'
  - number: '8'
    text: |-
      Indien een onderlinge waarborgmaatschappij weet of redelijkerwijze kan voorzien dat zij niet meer voldoet of zal
      voldoen aan een der voorwaarden op grond waarvan zij een verklaring heeft verkregen, deelt zij dit terstond aan de
      Pensioen- & Verzekeringskamer mee.
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel8
  - number: '9.1'
    text: 'De Pensioen- & Verzekeringskamer kan een verklaring intrekken indien de onderlinge waarborgmaatschappij:'
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel9
  - number: 9.1.a
    text: daarom verzoekt;
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel9
  - number: 9.1.b
    text: niet meer voldoet aan de voorwaarden die voor de verlening van de verklaring zijn gesteld;
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel9
  - number: 9.1.c
    text: ernstig in gebreke blijft aan verplichtingen, haar bij of krachtens de wet of dit besluit opgelegd, te voldoen;
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel9
  - number: 9.1.d
    text: de bedrijfsuitoefening gedurende meer dan zes maanden heeft gestaakt;
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel9
  - number: 9.1.e
    text: binnen twaalf maanden na de verlening van de verklaring daarvan geen gebruik heeft gemaakt; of
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel9
  - number: 9.1.f
    text: |-
      waaraan een verklaring ingevolge [artikel 2][ref1] is verleend, in surséance van betaling verkeert of failliet
      is verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0006624#Artikel2
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006624
        artikel: '2'
        hoofdstuk: '1'
  - number: '9.2'
    text: |-
      De werking van het besluit tot intrekking van de verklaring wordt opgeschort totdat de beroepstermijn is verstreken
      of, indien beroep is ingesteld, op het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel9
  - number: '9.3'
    text: |-
      De Pensioen- & Verzekeringskamer doet van het besluit in de *Staatscourant* mededeling, zodra de intrekking van
      kracht is geworden. Zij kan, indien zij dit in het belang van verzekeringnemers, verzekerden of gerechtigden op
      uitkeringen acht, het besluit eveneens op andere door haar te bepalen wijze publiceren.
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel9
  - number: '9.4'
    text: |-
      De Pensioen- & Verzekeringskamer brengt de intrekking van een verklaring, verleend ingevolge [artikel 3][ref1], ter
      kennis van de toezichthoudende autoriteiten van de lid-staten waarheen de onderlinge waarborgmaatschappij vanuit
      Nederland diensten verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0006624#Artikel3
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006624
        artikel: '3'
        hoofdstuk: '1'
  - number: '10'
    text: |-
      De Pensioen- & Verzekeringskamer kan een verklaring weigeren of intrekken indien een onderlinge
      waarborgmaatschappij deel uitmaakt of zal uitmaken van een groep en met het deel uitmaken van die groep naar het
      oordeel van de Pensioen- & Verzekeringskamer uitsluitend of in hoofdzaak wordt beoogd te bewerkstelligen dat een
      andere in die groep verbonden onderlinge waarborgmaatschappij voldoet of zal blijven voldoen aan de voorwaarden,
      bedoeld in [artikel 2, eerste lid, onderdelen ][ref1], of [artikel 3, eerste lid, onderdeel ][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006624#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006624#Artikel3
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006624
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0006624
        artikel: '3'
        hoofdstuk: '1'
  - number: '11.1'
    text: |-
      Houdt de onderlinge waarborgmaatschappij op te bestaan, dan vervalt de aan haar verleende verklaring. Artikel 9,
      derde en vierde lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel11
  - number: '11.2'
    text: |-
      Herleeft de rechtspersoon vervolgens, dan is [artikel 12][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006624#Artikel12
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006624
        artikel: '12'
        hoofdstuk: '1'
  - number: '12.1'
    text: |-
      De intrekking van een verklaring verplicht de onderlinge waarborgmaatschappij haar bedrijf af te wikkelen, tenzij
      de intrekking gepaard gaat met de verlening van een andere verklaring ingevolge dit besluit of met de verlening van
      een vergunning als bedoeld in [artikel 24, eerste lid, van de Wet toezicht verzekeringsbedrijf 1993][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel24
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '24'
  - number: '12.2'
    text: |-
      Op de onderlinge waarborgmaatschappij die ingevolge het eerste lid verplicht is haar bedrijf af te wikkelen,
      blijven de bepalingen van dit besluit van toepassing.
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel12
  - number: '12.3'
    text: |-
      Gedurende de afwikkeling mag zonder toestemming van de Pensioen- & Verzekeringskamer geen wijziging worden
      gebracht in de verplichting van de leden om bij te dragen in de tekorten dan wel in de mogelijkheid de
      schadevergoedingsplicht te beperken.
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel12
  - number: '13'
    text: |-
      Op een onderneming of instelling op onderlinge grondslag met zetel buiten Nederland die vanuit een vestiging
      buiten Nederland diensten wenst te verrichten of verricht naar Nederland en niet in het bezit is van een vergunning
      die overeenkomt met de in [artikel 24, eerste lid, van de Wet toezicht verzekeringsbedrijf 1993][ref1] bedoelde
      vergunning, zijn de artikelen 111 tot en met 114 en 116 tot en met 119 van die wet niet van toepassing, indien de
      onderneming of instelling ten genoegen van de Pensioen- & Verzekeringskamer aantoont dat:


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel24
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '24'
  - number: 13.a
    text: |-
      zij voldoet aan voorwaarden die overeenkomen met het bepaalde in [artikel 2][ref1] of [artikel 3][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0006624#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006624#Artikel3
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006624
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0006624
        artikel: '3'
        hoofdstuk: '1'
  - number: 13.b
    text: |-
      indien de betrokken vestiging zich in een lid-staat bevindt, op deze vestiging toezicht wordt uitgeoefend dat in
      voldoende mate overeenkomt met het toezicht ingevolge dit besluit of, indien de betrokken vestiging zich buiten de
      Unie bevindt, zij in de staat van haar zetel bevoegd is tot uitoefening van het directe schadeverzekeringsbedrijf
      en dit bedrijf vanuit een vestiging in die staat daadwerkelijk uitoefent.
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel13
  - number: 13a.1
    text: |-
      Het bedrag van de boete, bedoeld in
      [artikel 188d, vijfde lid, eerste volzin, van de Wet toezicht verzekeringsbedrijf 1993][ref1], wordt bepaald op de
      wijze, voorzien in de bijlage bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel188d
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: 188d
  - number: 13a.2
    text: |-
      De Pensioen- & Verzekeringskamer kan het bedrag van de boete lager stellen dan in de bijlage is bepaald, indien het
      bedrag van de boete in een bepaald geval op grond van bijzondere omstandigheden onevenredig hoog is.
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel13a
  - number: '14.1'
    text: |-
      Een verklaring die is verleend ingevolge de [artikelen 2 of 3 van het Besluit vrijgestelde onderlinge
      waarborgmaatschappijen](onbekend) en die op het tijdstip waarop dit besluit in werking treedt niet is ingetrokken,
      wordt beschouwd te zijn verleend ingevolge [de artikelen 2][ref1] onderscheidenlijk [3][ref2] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0006624#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006624#Artikel3
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006624
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0006624
        artikel: '3'
        hoofdstuk: '1'
  - number: '14.2'
    text: |-
      Een onderneming of instelling op onderlinge grondslag met zetel buiten Nederland die op het tijdstip van
      inwerkingtreding van dit besluit op grond van [artikel 9](onbekend) bevoegd is diensten te verrichten naar
      Nederland vanuit een vestiging buiten Nederland en tevens daadwerkelijk zulke diensten verricht, wordt beschouwd
      bevoegd te zijn ingevolge [artikel 13][ref1] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0006624#Artikel13
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006624
        artikel: '13'
        hoofdstuk: '2'
  - number: '15'
    text: Dit besluit treedt in werking met ingang van 1 juli 1994.
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel15
  - number: '16'
    text: 'Dit besluit wordt aangehaald als: Besluit vrijgestelde onderlinge waarborgmaatschappijen 1994.'
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel16
