  - number: '6.2'
    text: |-
      Met betrekking tot het verzekeren van bijkomende risico’s is
      [artikel 27, tweede en derde lid, van de Wet toezicht verzekeringsbedrijf 1993][ref1] van overeenkomstige
      toepassing, met dien verstande dat de risico’s van de branche Rechtsbijstand uitsluitend als bijkomende
      risico’s mogen worden gecombineerd met branches waarbij risico’s worden verzekerd die verband houden met
      het gebruik van zeeschepen. Risico’s die verband houden met aansprakelijkheden ten aanzien waarvan de
      [Wet aansprakelijkheidsverzekering motorrijtuigen][ref2] van toepassing is, mogen evenwel niet als bijkomend risico
      worden verzekerd.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0002415
    url: https://wetten.overheid.nl/BWBR0006624/2003-12-02#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '27'
      - id: ref2
        bwb_id: BWBR0002415
