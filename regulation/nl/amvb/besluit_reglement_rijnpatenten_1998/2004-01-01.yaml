preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Verkeer en Waterstaat, van 18 april 1997, nr. RV 97/4660, Hoofddirectie van
    de Waterstaat, Hoofdafdeling Bestuurlijke en Juridische Zaken;


    Gelet op de op 17 oktober 1868 te Mannheim tot stand gekomen Herziene Rijnvaartakte (Trb. 1955, 161, en 1964, 83),
    de resoluties van de Centrale Commissie voor de Rijnvaart van 25 april 1996 en 28 november 1996 (protocollen 1996-
    I-31 en 1996-II-20) en artikel 4 van de Scheepvaartverkeerswet;


    De Raad van State gehoord (advies van 23 juni 1997, no. W09.97.0214);


    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat, van 19 september 1997, nr. DGG/J-97007930,
    Directoraat-Generaal Goederenvervoer, Stafafdeling Wetgeving en Juridische Zaken;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008935/2004-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: >-
      Voor de Rijn in Nederland, met inbegrip van de Waal en de Lek, is van kracht het Reglement betreffende het verlenen
      van Rijnpatenten, met de daarbij behorende bijlagen, dat is opgenomen in de bijlage bij dit besluit en dat wordt
      aangehaald als: Reglement Rijnpatenten 1998.
    url: https://wetten.overheid.nl/BWBR0008935/2004-01-01#Artikel1
  - number: '2'
    text: >-
      Onze Minister van Verkeer en Waterstaat wijst de bevoegde autoriteit, bedoeld in het Reglement Rijnpatenten 1998,
      aan. Van deze aanwijzing wordt mededeling gedaan in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0008935/2004-01-01#Artikel2
  - number: '3'
    text: >-
      Bij ministeriële regeling worden de vergoedingen vastgesteld, die de leden van de examencommissie ontvangen voor de
      door hen verrichte werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0008935/2004-01-01#Artikel3
  - number: '4'
    text: >-
      Bij ministeriële regeling worden richtlijnen vastgesteld voor de bevoegde autoriteit, overeenkomstig de door de
      Centrale Commissie voor de Rijnvaart aangenomen resoluties.
    url: https://wetten.overheid.nl/BWBR0008935/2004-01-01#Artikel4
  - number: '5'
    text: >-
      Het besluit van 14 mei 1976, houdende het van kracht worden van het Reglement betreffende het verlenen van
      Rijnschipperspatenten en van een wijziging in het Reglement betreffende het verlenen van diploma’s voor het voeren
      van een vaartuig met behulp van radar op de Rijn (*Stb*. 303), wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0008935/2004-01-01#Artikel5
  - number: '6'
    text: Dit besluit treedt in werking met ingang van 1 januari 1998.
    url: https://wetten.overheid.nl/BWBR0008935/2004-01-01#Artikel6
  - number: '7'
    text: 'Dit besluit wordt aangehaald als: Besluit Reglement Rijnpatenten 1998.'
    url: https://wetten.overheid.nl/BWBR0008935/2004-01-01#Artikel7
