  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Infrastructuur en Milieu van 17 december 2010, nr. BJZ2010033451,
    Hoofddirectie Bestuurlijke en Juridische Zaken i.o.;

    Gelet op de artikelen 1, tweede lid, 8, vierde lid, 10, eerste en tweede lid, 13, eerste lid, 18, tweede lid,
    21, derde tot en met vijfde lid, 22, eerste tot en met vierde lid en zevende lid, 25, tweede lid, 27, 28, eerste
    lid, 29, tweede en derde lid, 38, 39, tweede lid, 40, tweede lid, 43, vierde lid, en 51, van de Drinkwaterwet,
    artikel 16 van de Arbeidsomstandighedenwet, artikel 44, eerste lid, van de Grondwet, de Mijnbouwwet, de artikelen
    4, eerste lid, 5, eerste lid, 6, 8, onder a en c, 9, onder b, 12, 13, en 14 van de Warenwet, artikel 81 van de
    Wet gewasbeschermingsmiddelen en biociden, de artikelen 5.1, eerste en derde lid, 5.2, eerste lid, 5.2b, derde
    en vierde lid, en 5.3, eerste en derde lid, 7.2, 7.4, 7.5, achtste lid, 7.8e en 7.35, vierde lid, van de Wet
    milieubeheer, artikel 33, tweede lid, van de Wet op het Centraal bureau voor de statistiek en de artikelen 3, 4,
    10a, derde en vierde lid, 11 en 28 van de Wet hygiëne en veiligheid zwemgelegenheden;

    De Afdeling advisering van de Raad van State gehoord (advies van 17 maart 2011, nr. W14.11.0003/IV);

    Gezien het nader rapport van de Staatssecretaris van Infrastructuur en Milieu van (17 mei 2011, nr. BJZ2011043266),
    Hoofddirectie Bestuurlijke en Juridische Zaken i.o.;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: -
      *Autoriteit Consument en Markt:* de Autoriteit Consument en Markt, genoemd in
      [artikel 2, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref1];
        - *biocide:* biocide als bedoeld in [artikel 1, eerste lid, van de Wet gewasbeschermingsmiddelen en biociden][ref2];
        - *BRL 6010:* Nationale beoordelingsrichtlijn voor het KOMO INSTAL® procescertificaat voor «legionellapreventie-
      advisering voor collectieve leidingwaterinstallaties», zoals deze luidde op een bij ministeriële regeling genoemd
      tijdstip;
        - *BRL K14010-1:* Beoordelingsrichtlijn voor het Kiwa-attest met productcertificaat voor «legionellapreventie met
      alternatieve technieken; Deel 1: Fysische techniek inclusief beheersconcept voor de nageschakelde installatie»,
      zoals deze luidde op een bij ministeriële regeling genoemd tijdstip;
        - *BRL K14010-2:* Beoordelingsrichtlijn voor het Kiwa-attest met productcertificaat voor «legionellapreventie met
      alternatieve technieken; Deel 2: Elektrochemische technieken: koper/zilver-ionisatie, anodische oxidatie», zoals
      deze luidde op een bij ministeriële regeling genoemd tijdstip;
        - *BTO 2001.175:* BTO 2001.175 «Hygiënecode drinkwater; opslag, transport en distributie», zoals deze luidde op een
      bij ministeriële regeling genoemd tijdstip;
        - *certificatie-instelling:* door de Raad voor Accreditatie gecertificeerde instelling die bevoegd is certificaten
      af te geven of in te trekken voor een product, dienst of kwaliteitsmanagementsysteem;
        - *chemicaliën:* stoffen of daaruit samengestelde producten, niet zijnde biociden als bedoeld in
      [artikel 1 van de Wet gewasbeschermingsmiddelen en biociden][ref3], die ten behoeve van de bereiding van drinkwater
      in contact worden gebracht met te behandelen water of drinkwater, dan wel daaraan worden toegevoegd met het doel
      een kwaliteitsverandering van dat water te bewerkstelligen;
        - *chemisch beheer:* wijze van legionellapreventie, gebaseerd op het toevoegen van biociden aan drinkwater;
        - *elektrochemisch beheer:* wijze van legionellapreventie, gebaseerd op het gebruik van elektroden om daardoor
      biociden in het drinkwater te vormen dan wel biociden aan drinkwater toe te voegen;
        - *fotochemisch beheer:* wijze van legionellapreventie, gebaseerd op het gebruik van ultraviolet licht in
      combinatie met titaniumoxide om daardoor biociden in het drinkwater te vormen dan wel biociden aan drinkwater toe
      te voegen;
        - *fysisch beheer:* wijze van legionellapreventie, gebaseerd op het gebruik van filters, pasteurisatie of door
      lagedruk-lampen opgewekt ultraviolet licht;
        - *hemelwater:* water afkomstig van atmosferische neerslag;
        - *huishoudwater:* water als bedoeld in [artikel 1, tweede lid, van de wet][ref4], dat uitsluitend bestemd is voor
      toiletspoeling;
        - *huishoudwatervoorziening:* samenstel van leidingen, fittingen en toestellen voor de productie en distributie
      van huishoudwater;
        - *kwaliteitsmanagementsysteem:* systeem voor de bedrijfsvoering van een drinkwaterbedrijf als bedoeld in
      [artikel 15][ref5], dat betrekking heeft op de primaire en secundaire bedrijfsprocessen en strekt tot waarborging
      van de kwaliteit van het drinkwater en de kwaliteit van de distributie daarvan;
        - *legionellabacterie:* bacterie behorend tot het geslacht Legionella;
        - *legionella-beheersplan:* plan als bedoeld in [artikel 38, eerste lid][ref6];
        - *legionella-risicoanalyse:* risicoanalyse als bedoeld in [artikel 37, eerste en tweede lid][ref7];
        - *leveringspunt:* plaats waar: a. het distributienet van een drinkwaterbedrijf, respectievelijk collectieve
      watervoorziening, overgaat in een collectieve watervoorziening, respectievelijk collectief leidingnet, dan wel
      overgaat in een woninginstallatie of andere installatie die op dat distributienet is aangesloten; b. een collectief
      leidingnet overgaat in een woninginstallatie of andere installatie die op dat leidingnet is aangesloten;
        - *materialen:* industrieel gevormde vaste stoffen of daaruit samengestelde producten, niet zijnde chemicaliën,
      die gebruikt worden voor het vervaardigen en verwerken van producten die in contact kunnen komen met te behandelen
      water of drinkwater en daarbij kunnen worden afgegeven aan dat water;
        - *NEN 1006:* NEN 1006 «Algemene voorschriften voor leidingwaterinstallaties», zoals deze luidden op een bij
      ministeriële regeling genoemd tijdstip, met inbegrip van de bij die regeling aan te wijzen aanvullingen en
      correctiebladen;
        - *NEN 3650:* de volgende delen van NEN 3650: NEN 3650-1 «Eisen voor buisleidingsystemen – Deel 1: Algemeen»;
      NEN 3650-2 «Eisen voor buisleidingsystemen – Deel 2: Staal»; NEN 3650-3 «Eisen voor buisleidingsystemen – Deel 3:
      Kunststof»; NEN 3650-4 «Eisen voor buisleidingsystemen – Deel 4: Beton»; NEN 3650-5 «Eisen voor buisleidingsystemen
      – Deel 5: Gietijzer», zoals deze luidden op een bij ministeriële regeling genoemd tijdstip, met inbegrip van de bij
      die regeling genoemde aanvullingen en correctiebladen;
        - *NEN 3651:* NEN 3651 «Aanvullende eisen voor buisleidingsystemen in kruisingen met belangrijke
      waterstaatswerken», zoals deze luidden op een bij ministeriële regeling genoemd tijdstip, met inbegrip van de bij
      die regeling genoemde aanvullingen en correctiebladen;
        - *NEN 7171-1:* NEN 7171-1 «Ordening van ondergrondse netten – Criteria», zoals deze luidde op een bij ministeriële
      regeling genoemd tijdstip, met inbegrip van de bij die regeling genoemde aanvullingen en correctiebladen;
        - *NEN-EN-ISO 9001:* NPR 7171-2 «Ordening van ondergrondse netten – Procesbeschrijving», zoals deze luidde op
      een bij ministeriële regeling genoemd tijdstip, met inbegrip van de bij die regeling genoemde aanvullingen en
      correctiebladen;
        - *NPR 7171-2:* NEN-EN-ISO 9001 «Kwaliteitsmanagementsystemen – Eisen», zoals deze luidde op een bij ministeriële
      regeling genoemd tijdstip, met inbegrip van de bij die regeling genoemde aanvullingen en correctiebladen;
        - *noodwater-risicoanalyse:* analyse met betrekking tot het risico dat de inzet van noodwater oplevert voor de
      volksgezondheid of het distributienet als bedoeld in [artikel 49][ref8];
        - *paalkampeerterrein:* kosteloos te gebruiken kampeerterrein van Staatsbosbeheer dat met een paal als zodanig
      is aangeduid;
        - *recreatiewoning:* recreatiewoonverblijf, waarvan de gebruikers het hoofdverblijf elders hebben, voor zover dit
      verblijf geen deel uitmaakt van een complex van soortgelijke verblijven dat in het kader van een bedrijf of in
      enigerlei vorm van onderlinge samenwerking door de rechthebbenden wordt beheerd;
        - *tappunt:* plaats waar het drinkwater, huishoudwater of warm tapwater beschikbaar komt voor gebruik;
        - *thermisch beheer:* wijze van legionellapreventie, gebaseerd op beheersing van de temperatuur van het drinkwater
      of het warm tapwater;
        - *verstorings-risicoanalyse:* analyse met betrekking tot het risico op verstoringen, bedoeld in
      [artikel 33 van de wet][ref9], met inbegrip van het actueel houden van die analyse;
        - *wet:* [Drinkwaterwet][ref10].


