        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '31.2'
    text: |-
      [Artikel 26, vierde en vijfde lid][ref1], is van overeenkomstige toepassing indien om de desbetreffende gegevens
      wordt verzocht door de toezichthouder


      [ref1]: https://wetten.overheid.nl/BWBR0030111#Artikel26
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0030111
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '32'
    text: |-
      In afwijking van [artikel 31][ref1] zijn op een collectieve watervoorziening, die deel uitmaakt van een
      paalkampeerterrein, [hoofdstuk III van de wet][ref2] en de daarop berustende bepalingen niet van toepassing, voor
      zover bij de voorziening is aangegeven dat het water, ook na koken of filtreren, niet bestemd is om te drinken of
      voedsel mee te bereiden.


      [ref1]: https://wetten.overheid.nl/BWBR0030111#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0026338#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0030111
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0026338
        hoofdstuk: III
  - number: '33.1'
    text: |-
      De [artikelen 12][ref1], [13, eerste lid][ref2], [14][ref3], [19][ref4], voor zover het betreft de in een
      collectief leidingnet toe te passen materialen, [21 tot en met 25][ref5], [26, eerste lid][ref6], en [44][ref7] en
      de daarop berustende bepalingen zijn van overeenkomstige toepassing op de eigenaar van een collectief leidingnet.


      [ref1]: https://wetten.overheid.nl/BWBR0030111#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0030111#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0030111#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0030111#Artikel19
      [ref5]: https://wetten.overheid.nl/BWBR0030111#Artikel21
      [ref6]: https://wetten.overheid.nl/BWBR0030111#Artikel26
      [ref7]: https://wetten.overheid.nl/BWBR0030111#Artikel44
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0030111
        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0030111
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref3
        bwb_id: BWBR0030111
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref4
        bwb_id: BWBR0030111
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref5
        bwb_id: BWBR0030111
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref6
        bwb_id: BWBR0030111
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref7
        bwb_id: BWBR0030111
