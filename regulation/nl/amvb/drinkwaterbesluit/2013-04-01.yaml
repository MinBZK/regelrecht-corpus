        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '33.2'
    text: |-
      [Artikel 26, vierde en vijfde lid][ref1], is van overeenkomstige toepassing op de eigenaar van een collectief
      leidingnet, voor zover daarmee gemiddeld meer dan 1000 m3 drinkwater per dag of aan gemiddeld meer dan 5000
      personen per dag drinkwater wordt geleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0030111#Artikel26
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0030111
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '34.1'
    text: |-
      De eigenaar van een collectief leidingnet draagt zorg, op de wijze en in de mate, welke redelijkerwijs van
      hem kunnen worden gevergd, dat het leidingnet, voor zover dat geen deel uitmaakt van een gebouw als bedoeld in
      [artikel 1, eerste lid, onder c, van de Woningwet][ref1], voldoet aan NEN 1006.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '1'
  - number: '34.2'
    text: |-
      Het eerste lid is niet van toepassing op de eigenaar van een leidingnet dat deel uitmaakt van een op een binnen het
      Nederlandse territoir of het Nederlandse deel van het continentale plat gelegen mijnbouwinstallatie als bedoeld in
      [artikel 1, onderdeel o, van de Mijnbouwwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel1
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '1'
  - number: '34.3'
    text: |-
      Bij ministeriële regeling kunnen categorieën van leidingnetten als bedoeld in
      [artikel 29, derde lid, van de wet][ref1], worden aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel29
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '29'
  - number: '35.1'
    text: |-
      Dit hoofdstuk is van toepassing op de eigenaar van een collectieve watervoorziening of collectief leidingnet waarop
      direct of indirect tappunten als bedoeld in het vierde lid zijn aangesloten, voor zover die tappunten aanwezig
      zijn:
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel35
  - number: 35.1.a
    text: |-
      in instellingen als bedoeld in [artikel 1.2, onderdeel 1, van het Uitvoeringsbesluit WTZi][ref1], met uitzondering
      van zelfstandige behandelcentra;


      [ref1]: https://wetten.overheid.nl/BWBR0018983#Artikel1
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0018983
        artikel: '1'
  - number: 35.1.b
    text: in zorginstellingen die behoren tot een bij ministeriële regeling aangewezen categorie;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel35
  - number: 35.1.c
    text: 'in een gebouw, een gedeelte van een gebouw of een samenhangend geheel van gebouwen of gedeelten daarvan:'
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel35
  - number: 35.1.c.1°
    text: |-
      met een logiesfunctie als bedoeld in [artikel 1.1, tweede lid, van het Bouwbesluit 2012][ref1], met uitzondering
      van recreatiewoningen, huisjes op volkstuincomplexen en gebouwen waar uitsluitend wordt overnacht door personen die
      ter plaatse werkzaam zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel1
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '1'
  - number: 35.1.c.2°
    text: |-
      met een woonfunctie als bedoeld in [artikel 1.1, tweede lid, van het Bouwbesluit 2012][ref1], waar bedrijfsmatig
      nachtverblijf wordt verleend aan meer dan vijf personen;


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel1
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '1'
  - number: 35.1.d
    text: |-
      in een opvangcentrum als bedoeld in [artikel 1 van de Wet Centraal Orgaan opvang asielzoekers][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006685#Artikel1
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0006685
        artikel: '1'
  - number: 35.1.e
    text: |-
      in een gebouw, een gedeelte van een gebouw of een samenhangend geheel van gebouwen of gedeelten daarvan met een
      celfunctie als bedoeld in [artikel 1.1, tweede lid, van het Bouwbesluit 2012][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel1
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0030461
        artikel: '1'
  - number: 35.1.f
    text: |-
      in een badinrichting als bedoeld in
      [artikel 1 van de Wet hygiëne en veiligheid badinrichtingen en zwemgelegenheden][ref1], voor zover ten minste één
      bassin een wateroppervlakte van twee m2 of meer heeft en dieper is dan 0,50 meter;


      [ref1]: https://wetten.overheid.nl/BWBR0002660#Artikel1
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002660
        artikel: '1'
  - number: 35.1.g
    text: |-
      op een terrein of plaats, geheel of gedeeltelijk ingericht, en blijkens die inrichting bestemd, om daarop
      gelegenheid te geven tot het plaatsen of geplaatst houden van op de grond staande bouwwerken ten behoeve van
      recreatief nachtverblijf;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel35
  - number: 35.1.h
    text: |-
      in een haven met de daarbij behorende grond waar overwegend gelegenheid wordt gegeven voor het aanleggen, afmeren
      of afgemeerd houden van pleziervaartuigen;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel35
  - number: 35.1.i
    text: |-
      in een truckstop, benzinestation, wegrestaurant of andere locatie die verband houdt met het wegvervoer, waar
      douchefaciliteiten aanwezig zijn, bestemd voor openbaar gebruik.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel35
  - number: '35.2'
    text: |-
      De [artikelen 36][ref1], [41][ref2], [42][ref3] en [43][ref4] zijn van overeenkomstige toepassing op de eigenaar
      van een drinkwaterbedrijf, voor zover deze drinkwater aan derden ter beschikking stelt, met dien verstande dat voor
      de toepassing van artikel 43 geldt dat:


      [ref1]: https://wetten.overheid.nl/BWBR0030111#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0030111#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0030111#Artikel42
      [ref4]: https://wetten.overheid.nl/BWBR0030111#Artikel43
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0030111
        artikel: '36'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0030111
        artikel: '41'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref3
        bwb_id: BWBR0030111
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref4
        bwb_id: BWBR0030111
        artikel: '43'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 35.2.a
    text: |-
      het onderzoek naar de aanwezigheid van legionellabacteriën na de laatste zuiveringsstap ten minste iedere zes
      maanden wordt uitgevoerd, en
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel35
  - number: 35.2.b
    text: |-
      het drinkwater in het distributiegebied van het drinkwaterbedrijf onderzocht wordt met een bij ministeriële
      regeling vast te stellen frequentie.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel35
  - number: '35.3'
    text: |-
      Hoofdstuk 4 is van overeenkomstige toepassing op de eigenaar van een drinkwaterbedrijf, voor zover deze
      huishoudwater aan derden ter beschikking stelt.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel35
  - number: '35.4'
    text: 'Als de tappunten, bedoeld in de aanhef van het eerste lid, worden aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel35
  - number: 35.4.a
    text: tappunten met een douche of andere appendage waarmee water kan worden gesproeid of verneveld;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel35
  - number: 35.4.b
    text: |-
      tappunten die al dan niet tijdelijk gebruikt worden voor het aansluiten van een douche, andere appendage of toestel
      waarmee water kan worden gesproeid of verneveld;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel35
  - number: 35.4.c
    text: |-
      tappunten waarvan de eigenaar redelijkerwijze kan weten of vermoeden dat deze al dan niet tijdelijk gebruikt worden
      voor het aansluiten van een douche, andere appendage of toestel waarmee water kan worden gesproeid of verneveld;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel35
  - number: 35.4.d
    text: |-
      alle tappunten in een instelling als bedoeld in het eerste lid, onderdeel a, voor zover het een afdeling
      hematologie of oncologie is, dan wel daar transplantaties worden uitgevoerd of daar patiënten met chronische
      longaandoeningen of stoornissen van het immuunsysteem verblijven.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel35
  - number: '36.1'
    text: |-
      Drinkwater en warm tapwater bevatten minder dan 100 kolonie vormende eenheden legionellabacteriën per liter van
      de bij ministeriële regeling te bepalen soorten legionellabacterie. In de regeling, bedoeld in de vorige volzin,
      kan een equivalent worden opgenomen van het in de vorige volzin opgenomen toegestane aantal legionellabacteriën
      per liter.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel36
  - number: '36.2'
    text: |-
      De eigenaar van een collectieve watervoorziening of collectief leidingnet draagt er zorg voor dat het door hem aan
      derden ter beschikking gestelde drinkwater of warm tapwater op het punt van aflevering voldoet aan het eerste lid.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel36
  - number: '37.1'
    text: |-
      De eigenaar van een collectieve watervoorziening draagt zorg voor de uitvoering van een legionella-risicoanalyse
      met betrekking tot de kans, dat niet wordt voldaan aan [artikel 27][ref1] of [artikel 36, eerste lid][ref2],
      overeenkomstig daarvoor bij ministeriële regeling te stellen voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0030111#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0030111#Artikel36
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0030111
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0030111
        artikel: '36'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '37.2'
    text: |-
      De eigenaar van een collectief leidingnet draagt zorg voor de uitvoering van een legionella-risicoanalyse
      met betrekking tot het risico, dat niet wordt voldaan aan [artikel 36, eerste lid][ref1], ten gevolge van een
      omstandigheid als bedoeld in [29, eerste lid, van de wet][ref2], overeenkomstig daarvoor bij ministeriële regeling
      te stellen voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0030111#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0026338#Artikel29
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0030111
        artikel: '36'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0026338
        artikel: '29'
  - number: '37.3'
    text: |-
      De legionella-risicoanalyse, bedoeld in het eerste of tweede lid, wordt uitgevoerd door een daarvoor op basis van
      BRL 6010 gecertificeerd bedrijf.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel37
  - number: '37.4'
    text: |-
      Binnen drie maanden na iedere voor het in het eerste of tweede lid bedoelde risico relevante wijziging van een
      collectieve watervoorziening, respectievelijk collectief leidingnet, of het gebruik daarvan, dan wel een wijziging
      van factoren die invloed kunnen hebben op dat risico, wordt de legionella-risicoanalyse, bedoeld in het eerste lid
      respectievelijk tweede lid, opnieuw uitgevoerd. De verplichtingen, bedoeld in de eerste volzin, gelden niet voor
      wijzigingen, die zijn uitgevoerd op grond van [artikel 40, eerste lid][ref1], of [41, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030111#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0030111#Artikel41
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0030111
        artikel: '40'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0030111
        artikel: '41'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '37.5'
    text: |-
      De eigenaar van een collectieve watervoorziening of collectief leidingnet draagt er zorg voor dat de uitkomsten
      van de op grond van het eerste, tweede of vierde lid uitgevoerde legionella-risicoanalyse, met een overzicht van
      de daarbij gebruikte gegevens en de genomen maatregelen, voor de inspecteur ter inzage liggen ter plaatse van de
      collectieve watervoorziening of het collectieve leidingnet. De inspecteur kan op verzoek van de eigenaar toestaan
      dat de hiervoor bedoelde stukken op een andere plaats voor hem ter inzage liggen. De inspecteur kan verzoeken om
      toezending van de gegevens aan hem, in een door hem aangegeven vorm.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel37
  - number: '37.6'
    text: |-
      Indien de inspecteur van oordeel is dat de legionella-risicoanalyse, bedoeld in het eerste, tweede of vierde lid,
      onjuist of onvolledig is uitgevoerd dan wel anderszins niet voldoet aan de bij ministeriële regeling vastgestelde
      voorschriften, kan hij de eigenaar, bedoeld in het eerste of tweede lid, verplichten tot het wijzigen, aanvullen
      of opnieuw uitvoeren van de legionella-risicoanalyse binnen een daarbij aangegeven termijn. Het vijfde lid is van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel37
  - number: '38.1'
    text: |-
      Indien uit een legionella-risicoanalyse als bedoeld in [artikel 37, eerste, tweede of vierde lid][ref1], blijkt
      dat er een risico is dat niet wordt voldaan aan [artikel 27][ref2] of [artikel 36, eerste lid][ref3], draagt de
      eigenaar van de desbetreffende collectieve watervoorziening of het desbetreffende collectieve leidingnet er zorg
      voor dat een daarvoor overeenkomstig BRL 6010 gecertificeerd bedrijf op basis van de legionella-risicoanalyse een
      legionella-beheersplan opstelt met betrekking tot de inrichting en het beheer van die collectieve watervoorziening
      of dat collectieve leidingnet, dan wel laat hij door dit bedrijf een daarop betrekking hebbend, bestaand
      legionella-beheersplan herzien. Het legionella-beheersplan strekt ertoe dat voldaan wordt aan de artikelen 27 en
      36, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0030111#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0030111#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0030111#Artikel36
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0030111
        artikel: '37'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0030111
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref3
        bwb_id: BWBR0030111
        artikel: '36'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '38.2'
    text: |-
      In het in [artikel 37, vierde lid][ref1], bedoelde geval wordt het legionella-beheersplan binnen drie maanden
      na het tijdstip van gereedkomen van de in dat lid bedoelde legionella-risicoanalyse opgesteld, dan wel wordt een
      bestaand legionella-beheersplan binnen drie maanden na dat tijdstip herzien, indien de legionella-risicoanalyse
      daartoe aanleiding geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0030111#Artikel37
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0030111
        artikel: '37'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '38.3'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing voor zover de eigenaar, bedoeld in het eerste lid, het in dat
      lid bedoelde risico binnen drie maanden na het tijdstip van gereedkomen van de legionella-risicoanalyse opheft
      door zodanige wijzigingen in de collectieve watervoorziening of het collectieve leidingnet dat daardoor niet langer
      periodieke beheersmaatregelen zijn vereist.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel38
  - number: '38.4'
    text: 'Het legionella-beheersplan omvat ten minste de volgende onderdelen:'
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel38
  - number: 38.4.a
    text: |-
      tekeningen of beschrijvingen waaruit de ligging en inrichting van de collectieve watervoorziening of het
      collectieve leidingnet blijkt;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel38
  - number: 38.4.b
    text: |-
      gegevens over de in de collectieve watervoorziening of collectief leidingnet opgenomen toestellen waarmee warm
      tapwater wordt bereid, leidingen en overige toestellen;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel38
  - number: 38.4.c
    text: |-
      gegevens over de herkomst, aard en kwaliteit van het water dat wordt gebruikt voor de bereiding van drinkwater, met
      inbegrip van warm tapwater;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel38
  - number: 38.4.d
    text: de uitkomsten van de uitgevoerde legionella-risicoanalyse of legionella-risicoanalyses;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel38
  - number: 38.4.e
    text: |-
      de maatregelen die zijn of worden genomen, de werkinstructies voor het uitvoeren van de maatregelen en de
      voorschriften die worden toegepast voor bediening, onderhoud en controle van de collectieve watervoorziening of het
      collectieve leidingnet, voor zover deze betrekking hebben op de beheersing van de bij de legionella-risicoanalyse
      aangetroffen risico’s, waarbij tevens wordt aangegeven wie door de eigenaar belast is met de uitvoering van de
      maatregelen, welke bevoegdheden daarvoor bestaan en op welke wijze en in welke frequentie de uitvoering van die
      maatregelen plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel38
  - number: 38.4.f
    text: |-
      de tappunten waarop en de frequentie waarin het drinkwater wordt onderzocht op de aanwezigheid van
      legionellabacteriën overeenkomstig [artikel 43][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030111#Artikel43
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0030111
        artikel: '43'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 38.4.g
    text: |-
      in geval van een collectieve watervoorziening of een collectief leidingnet binnen een inrichting als bedoeld in
      [artikel 35, eerste lid, onder a of b][ref1]: een omschrijving van de getroffen voorzieningen om het risico van
      verbranding bij personen, die vanwege hun lichamelijke of geestelijke gesteldheid niet of onvoldoende in staat
      zijn de temperatuur van het bij de lichaamsverzorging of anderszins gebruikte drinkwater op een veilig niveau in te
      stellen, te voorkomen;


      [ref1]: https://wetten.overheid.nl/BWBR0030111#Artikel35
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0030111
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 38.4.h
    text: |-
      de maatregelen die worden genomen indien er aanwijzingen zijn dat niet wordt voldaan aan [artikel 27][ref1] of
      [artikel 36, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030111#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0030111#Artikel36
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0030111
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0030111
        artikel: '36'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '39.1'
    text: |-
      In gevallen waarin op grond van [artikel 38][ref1] een verplichting bestaat tot het opstellen van een legionella-
      beheersplan, draagt de eigenaar van een collectieve watervoorziening of collectief leidingnet er zorg voor dat het
      legionella-beheersplan voor de inspecteur ter inzage ligt ter plaatse van die collectieve watervoorziening of dat
      collectieve leidingnet. De inspecteur kan op verzoek van de eigenaar toestaan dat het legionella-beheersplan op een
      andere plaats voor hem ter inzage ligt. De inspecteur kan verzoeken om toezending van de gegevens in een door hem
      aangegeven vorm.


      [ref1]: https://wetten.overheid.nl/BWBR0030111#Artikel38
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0030111
        artikel: '38'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '39.2'
    text: |-
      Indien de inspecteur van oordeel is dat het legionella-beheersplan, bedoeld in
      [artikel 38, eerste of tweede lid][ref1], onjuist of onvolledig is dan wel anderszins niet voldoet aan de
      voorschriften, opgenomen in artikel 38, vierde lid, kan hij de eigenaar verplichten tot het wijzigen, aanvullen
      of opnieuw opstellen van het legionella-beheersplan binnen een daarbij aangegeven termijn. Het eerste lid is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030111#Artikel38
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0030111
        artikel: '38'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '40.1'
    text: |-
      De eigenaar van een collectieve watervoorziening of collectief leidingnet voert maatregelen en controles uit
      overeenkomstig het legionella-beheersplan.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel40
  - number: '40.2'
    text: |-
      De eigenaar, bedoeld in het eerste lid, houdt in een logboek aantekening van de krachtens hoofdstuk 4 uitgevoerde
      maatregelen, controles en onderzoeken, alsmede van de resultaten daarvan. Deze gegevens worden gedurende drie jaar
      bewaard.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel40
  - number: '40.3'
    text: |-
      De eigenaar, bedoeld in het eerste lid, draagt er zorg voor dat het logboek voor de inspecteur ter inzage ligt
      ter plaatse van de collectieve watervoorziening of het collectieve leidingnet of, indien de inspecteur daarmee
      instemt, op een andere door de eigenaar te bepalen plaats. Op verzoek van de inspecteur wordt het logboek aan hem
      toegezonden in een door hem aangegeven vorm.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel40
  - number: '41.1'
    text: |-
      In geval van omstandigheden die, naar de eigenaar van een collectieve watervoorziening of collectief leidingnet
      redelijkerwijze kan weten of vermoeden, gevaar of beletsel kunnen vormen voor het voldoen aan [artikel 27][ref1]
      of [artikel 36, eerste lid][ref2], voert hij uit voorzorg de maatregelen en controles uit die met het oog op
      deze omstandigheden in het legionella-beheersplan zijn opgenomen of, voor zover daaromtrent in het legionella-
      beheersplan geen maatregelen zijn opgenomen dan wel geen legionella-beheersplan van toepassing is, de maatregelen
      en controles die in deze omstandigheden redelijkerwijs van hem kunnen worden gevergd.


      [ref1]: https://wetten.overheid.nl/BWBR0030111#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0030111#Artikel36
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0030111
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0030111
        artikel: '36'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '41.2'
    text: |-
      Indien de inspecteur van oordeel is dat zich omstandigheden voordoen als bedoeld in het eerste lid kan hij de
      volgens hem noodzakelijke maatregelen voorschrijven. Deze kunnen afwijken van de in het eerste lid bedoelde
      maatregelen. De eigenaar, bedoeld in het eerste lid, is gehouden de door de inspecteur voorgeschreven maatregelen
      terstond en volledig uit te voeren.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel41
  - number: '41.3'
    text: |-
      Indien het drinkwater, bedoeld in [artikel 36, eerste lid][ref1], meer dan 1000 kolonie vormende eenheden
      legionellabacteriën per liter bevat, informeert de eigenaar van de desbetreffende collectieve watervoorziening
      of het desbetreffende collectieve leidingnet terstond en volledig de inspecteur. De inspecteur kan bepalen dat
      de eigenaar de verbruikers terstond en volledig informeert en adviseert over de door hen te nemen maatregelen ter
      bescherming van hun gezondheid.


      [ref1]: https://wetten.overheid.nl/BWBR0030111#Artikel36
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0030111
        artikel: '36'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '41.4'
    text: |-
      Indien de eigenaar van de collectieve watervoorziening of het collectief leidingnet vaststelt dat drinkwater niet
      voldoet aan [artikel 36, eerste lid][ref1], ten gevolge van een oorzaak die gelegen is in een op zijn leidingnet
      aangesloten woninginstallatie, collectieve watervoorziening, collectief leidingnet of andere installatie,
      informeert hij terstond en volledig de eigenaar daarvan en adviseert hij deze over de te nemen herstelmaatregelen.
      Tevens informeert hij terstond en volledig de inspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0030111#Artikel36
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0030111
        artikel: '36'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '42'
    text: |-
      Het nemen en analyseren van monsters ter uitvoering van hoofdstuk 4 en de daarop berustende bepalingen geschiedt
      overeenkomstig een bij ministeriële regeling vast te stellen methode.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel42
  - number: '43.1'
    text: |-
      Bij de uitvoering van de legionella-risicoanalyse, bedoeld in [artikel 37, eerste of tweede lid][ref1],
      en vervolgens ten minste om de zes maanden, onderzoekt de eigenaar van een collectieve watervoorziening of
      collectief leidingnet het drinkwater op de aanwezigheid van legionellabacteriën bij de tappunten, bedoeld in
      [artikel 35, vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030111#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0030111#Artikel35
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0030111
        artikel: '37'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0030111
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '43.2'
    text: |-
      Indien de collectieve watervoorziening of het collectieve leidingnet maximaal zeven maanden per jaar in gebruik is,
      is de frequentie van het in het in het eerste lid bedoelde onderzoek ten minste eenmaal per jaar.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel43
  - number: '43.3'
    text: |-
      Bij ministeriële regeling wordt vastgesteld op welke wijze het aantal in dit onderzoek te betrekken meetpunten
      wordt bepaald. De inspecteur kan bepalen dat de meetfrequentie of het aantal in het onderzoek te betrekken
      meetpunten verlaagd of verhoogd wordt.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel43
  - number: '44.1'
    text: |-
      De te nemen beheersmaatregelen zijn gebaseerd op thermisch beheer, op fysisch beheer, voor zover dit gecertificeerd
      is op basis van BRL K14010-1, op fotochemisch beheer, voor zover dit gecertificeerd is op basis van BRL K14010-1
      en onverminderd [artikel 14 van het Besluit gewasbeschermingsmiddelen en biociden][ref1], of op een combinatie van
      deze beheersvormen.


      [ref1]: https://wetten.overheid.nl/BWBR0022530#Artikel14
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0022530
        artikel: '14'
  - number: '44.2'
    text: |-
      Voor zover thermisch, fysisch of fotochemisch beheer naar het schriftelijke en gemotiveerde oordeel van het
      bedrijf, bedoeld in [artikel 37, derde lid][ref1], en [artikel 38, eerste lid][ref2], redelijkerwijs niet mogelijk
      is, kan, onverminderd [artikel 14 van het Besluit gewasbeschermingsmiddelen en biociden][ref3], worden gekozen voor
      elektrochemisch beheer, voor zover dit gecertificeerd is op basis van BRL K14010-2.


      [ref1]: https://wetten.overheid.nl/BWBR0030111#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0030111#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0022530#Artikel14
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0030111
        artikel: '37'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0030111
        artikel: '38'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref3
        bwb_id: BWBR0022530
        artikel: '14'
  - number: '44.3'
    text: |-
      Voor zover elektrochemisch beheer naar het schriftelijke en gemotiveerde oordeel van het bedrijf, bedoeld
      in [artikel 37, derde lid][ref1], en [artikel 38, eerste lid][ref2], redelijkerwijs niet mogelijk is, kan,
      onverminderd [artikel 14 van het Besluit gewasbeschermingsmiddelen en biociden][ref3], worden gekozen voor chemisch
      beheer.


      [ref1]: https://wetten.overheid.nl/BWBR0030111#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0030111#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0022530#Artikel14
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0030111
        artikel: '37'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0030111
        artikel: '38'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref3
        bwb_id: BWBR0022530
        artikel: '14'
  - number: '44.4'
    text: |-
      Bij toepassing van fysisch of fotochemisch beheer is de eigenaar van de collectieve watervoorziening of het
      collectief leidingnet verantwoordelijk voor het in acht nemen van de voorwaarden en voorschriften, opgenomen in BRL
      K 14010-1.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel44
  - number: '44.5'
    text: |-
      Bij toepassing van elektrochemisch beheer is de eigenaar verantwoordelijk voor het in acht nemen van de voorwaarden
      en voorschriften, opgenomen in BRL K 14010-2.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel44
  - number: '44.6'
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gesteld met betrekking tot de toepassing van het
      eerste tot en met vijfde lid.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel44
  - number: '45.1'
    text: |-
      De eigenaar van een drinkwaterbedrijf voldoet aan de in [artikel 32, eerste lid, van de wet][ref1] bepaalde
      hoeveelheideis en drukeis onder niet verstoorde omstandigheden, indien de inrichtingvan het distributienet en de
      productiecapaciteit het mogelijk maken om op een willekeurig moment van de dag in één uur tijd 1000 liter water op
      het leveringspunt van een enkelvoudige huishoudelijke installatie te leveren, terwijl de druk ter plaatse van het
      leveringspunt ten minste 150 kPa ten opzichte van het maaiveld is.


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel32
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '32'
  - number: '45.2'
    text: |-
      In omstandigheden waarin naar het oordeel van de inspecteur naleving van de hoeveelheideis of drukeis, bedoeld in
      het eerste lid, redelijkerwijs niet mogelijk is, kan gedurende een door de inspecteur bepaalde periode en tot een
      daarbij bepaalde waarde worden afgeweken van die eis.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel45
  - number: '46'
    text: |-
      De eigenaar van een drinkwaterbedrijf verschaft, middels het leveringsplan, inzicht in de redelijkerwijs te
      verwachten toekomstige behoefte aan drinkwater in het distributiegebied van zijn drinkwaterbedrijf en in de daaraan
      verbonden consequenties ten aanzien van de winning, zuivering en distributie van drinkwater en neemt in dat plan
      een daarop aansluitende planning voor de drinkwatervoorziening op voor een periode van ten minste tien jaar.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel46
  - number: '47.1'
    text: |-
      Een verstorings-risicoanalyse omvat het inventariseren en analyseren van de voor het leveringsgebied
      van een drinkwaterbedrijf bestaande en te verwachten dreigingen voor de openbare drinkwatervoorziening.
      Een beschrijving van deze dreigingen wordt met het oog op goedkeuring van het leveringsplan, bedoeld in
      [artikel 37, derde lid, van de wet][ref1], voorafgaand aan de indiening van het leveringsplan aan de inspecteur ter
      beoordeling voorgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel37
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '37'
  - number: '47.2'
    text: |-
      Onze Minister kan nationale dreigingen vaststellen en deze nader uitwerken in scenario’s. Hij kan de eigenaar
      van een drinkwaterbedrijf verplichten deze nationale dreigingen en scenario’s op te nemen in zijn verstorings-
      risicoanalyse.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel47
  - number: '47.3'
    text: |-
      Indien de inspecteur van oordeel is dat de verstorings-risicoanalyse, bedoeld in het eerste lid, onjuist of
      onvolledig is uitgevoerd dan wel anderszins niet voldoet aan de in [bijlage B][ref1], behorende bij dit besluit,
      opgenomen vereisten voor de verstoringsparagraaf van het leveringsplan, bedoeld in het vijfde lid, kan hij de
      eigenaar van het drinkwaterbedrijf verzoeken om wijziging, aanvulling of het opnieuw uitvoeren van de verstorings-
      risicoanalyse binnen een daarbij aangegeven termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0030111
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0030111
  - number: '47.4'
    text: |-
      De eigenaar van een drinkwaterbedrijf voert de verstorings-risicoanalyse uit binnen één jaar na inwerkingtreding
      van dit besluit en herziet deze ten minste éénmaal per vier jaar of indien wijzigingen in de omstandigheden daartoe
      aanleiding geven. Zo nodig geeft de inspecteur aanwijzingen.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel47
  - number: '47.5'
    text: |-
      Aan de hand van de uitkomsten van de verstorings-risicoanalyse stelt de eigenaar van een drinkwaterbedrijf
      als onderdeel van het leveringsplan een verstoringsparagraaf op overeenkomstig de vereisten, opgenomen in
      [bijlage B][ref1], behorende bij dit besluit,.


      [ref1]: https://wetten.overheid.nl/BWBR0030111
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0030111
  - number: '48.1'
    text: |-
      De eigenaar van een drinkwaterbedrijf stelt op basis van de dreigingen, bedoeld in
      [artikel 47, eerste en tweede lid][ref1], in overeenstemming met de inspecteur vast:


      [ref1]: https://wetten.overheid.nl/BWBR0030111#Artikel47
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0030111
        artikel: '47'
        hoofdstuk: '5'
  - number: 48.1.a
    text: wat het maximale aantal personen is dat van nooddrinkwater moet kunnen worden voorzien, en
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel48
  - number: 48.1.b
    text: |-
      de met dat aantal corresponderende hoeveelheid nooddrinkwater die krachtens
      [artikel 35, derde lid, van de wet][ref1], in geval van een verstoring als bedoeld in dat artikel dient te worden
      geleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel35
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '35'
  - number: '48.2'
    text: |-
      De eigenaar van een drinkwaterbedrijf draagt er zorg voor dat in geval van een verstoring als bedoeld in
      [artikel 35, tweede lid, van de wet][ref1] een nooddrinkwatervoorziening wordt ingezet waarmee ten minste drie
      liter nooddrinkwater per persoon per dag kan worden geleverd op de door de gemeente aangewezen distributiepunten.
      Deze distributiepunten zijn zodanig ingericht dat met één distributiepunt een gebied van nooddrinkwater wordt
      voorzien, waar in niet-verstoorde omstandigheden maximaal 2500 personen verblijven.


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel35
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '35'
  - number: '49.1'
    text: |-
      In overleg met de inspecteur draagt de eigenaar van een drinkwaterbedrijf er zorg voor dat bij de inzet van
      noodwater een noodwater-risicoanalyse ten grondslag ligt aan de beoordeling of het noodwater geen onaanvaardbare
      risico’s voor de volksgezondheid of het distributienet oplevert.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel49
  - number: '49.2'
    text: |-
      De inspecteur stelt ten behoeve van de uitvoering van een noodwater-risicoanalyse parameters ter beoordeling van de
      kwaliteit van noodwater op.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel49
  - number: '50'
    text: |-
      De eigenaar van een drinkwaterbedrijf beschikt over onafhankelijke voorzieningen, die een continue levering van
      deugdelijk drinkwater gedurende ten minste tien dagen waarborgen op basis van een gemiddeld dagverbruik, teneinde
      de gevolgen van uitval van externe leveranties zo veel mogelijk te beperken.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel50
  - number: '51'
    text: |-
      In overleg met de inspecteur oefent de eigenaar van een drinkwaterbedrijf ten minste een maal per twee
      jaar de inzet van het drinkwaterbedrijf bij verstoringen, welke oefeningen eenmaal per vier jaar worden
      gecombineerd met de diensten en organisaties die deel uitmaken van het openbaar lichaam, bedoeld in
      [artikel 9 van de Wet veiligheidsregio’s][ref1] en met de politie.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel9
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '9'
  - number: '52.1'
    text: |-
      Bij uitval van een zelfstandig onderdeel van een watervoorzieningswerk draagt de eigenaar van een drinkwaterbedrijf
      er zorg voor dat binnen 24 uur een hoeveelheid drinkwater kan worden geleverd die op dagbasis ten minste 75%
      bedraagt van de hoeveelheid die wordt geleverd op de maximumdag. Onder maximumdag wordt verstaan de dag in een
      kalenderjaar waarop het drinkwaterwaterverbruik op etmaalbasis in een distributiegebied het hoogst is, met een
      overschrijdingskans van eenmaal per tien jaar. De eerste en tweede volzin gelden voor aansluitingen of clusters van
      aansluitingen met een verbruik gelijk aan dat van 2000 huishoudelijke aansluitingen of meer.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel52
  - number: '52.2'
    text: |-
      Voor aansluitingen of clusters van aansluitingen met een verbruik dat minder bedraagt dan dat van 2000
      huishoudelijke aansluitingen, spant de eigenaar van een drinkwaterbedrijf zich in om te voldoen aan het eerste lid.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel52
  - number: '52.3'
    text: |-
      Bij uitval van meerdere zelfstandige onderdelen van een watervoorzieningswerk houdt de eigenaar van een
      drinkwaterbedrijf de levering in het door de uitval getroffen distributiegebied zo veel mogelijk in stand.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel52
  - number: '52.4'
    text: |-
      In omstandigheden waarin naar het oordeel van de inspecteur naleving van het eerste lid redelijkerwijs niet
      mogelijk is, kan de inspecteur voor een daarbij te bepalen periode ontheffing verlenen van het in dat lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel52
  - number: '53.1'
    text: |-
      Het leveringsplan, bedoeld in [artikel 37, eerste lid, van de wet][ref1], bevat de gegevens, bedoeld in
      [bijlage B][ref2], behorende bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0030111
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '37'
      - id: ref2
        bwb_id: BWBR0030111
  - number: '53.2'
    text: |-
      De inspecteur beoordeelt een aan hem krachtens [artikel 37, derde lid, van de wet][ref1], overgelegd leveringsplan
      binnen zes maanden na de indiening van dat plan. Aan het vereiste van goedkeuring, bedoeld in artikel 37, derde
      lid, van de wet, wordt in elk geval voldaan indien de inspecteur niet binnen zes maanden na de indiening een
      beslissing heeft genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel37
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '37'
  - number: '53.3'
    text: |-
      De eigenaar van een drinkwaterbedrijf herziet het leveringsplan ten minste eenmaal per vier jaar en tussentijds
      indien daar aanleiding toe is. Op de herziening zijn het eerste en tweede lid van overeenkomstige toepassing. Zo
      nodig geeft de inspecteur aanwijzingen.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel53
  - number: '53.4'
    text: |-
      De eigenaar van een drinkwaterbedrijf draagt er, voor zover dat binnen zijn vermogen
      ligt, zorg voor dat het leveringsplan in overeenstemming is met het rampenplan, bedoeld in
      [artikel 5 van de Wet rampen en zware ongevallen][ref1], het calamiteitenplan, bedoeld in
      [artikel 69 van de Waterstaatswet 1900][ref2] en andere voor de leveringszekerheid van de drinkwatervoorziening van
      belang zijnde plannen, tenzij dat zou leiden tot strijdigheid met de wet en de daarop berustende bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003765#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0001867#Artikel69
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0003765
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0001867
        artikel: '69'
  - number: '54.1'
    text: |-
      Onverminderd [artikel 50, eerste lid, van de wet][ref1], kan de inspecteur, indien de eigenaar van een
      drinkwaterbedrijf verzuimt het leveringsplan tijdig op te stellen, de eigenaar van een drinkwaterbedrijf verzoeken
      om dit binnen een daarbij aangegeven termijn alsnog te doen.


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel50
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '50'
  - number: '54.2'
    text: |-
      Indien de inspecteur van oordeel is dat het leveringsplan niet aan de gestelde eisen voldoet, kan hij de eigenaar
      van een drinkwaterbedrijf verzoeken het leveringsplan binnen een daarbij aangegeven termijn in overeenstemming te
      brengen met die eisen.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel54
  - number: '54.3'
    text: Zo nodig kan de inspecteur aanwijzingen geven bij een verzoek als bedoeld in het eerste of tweede lid.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel54
  - number: '54.4'
    text: |-
      Indien de eigenaar van een drinkwaterbedrijf geen gevolg geeft aan een verzoek op grond van het eerste of
      tweede lid, kan Onze Minister voorzien in het gevorderde ten laste van de eigenaar van het desbetreffende
      drinkwaterbedrijf.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel54
  - number: '55'
    text: |-
      De uitvoering van de prestatievergelijking vindt plaats volgens een bij ministeriële regeling te bepalen
      frequentie.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel55
  - number: '56.1'
    text: |-
      Het protocol, bedoeld in [artikel 40, eerste lid, van de wet][ref1], bevat naast de in dat lid genoemde elementen:


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel40
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '40'
  - number: 56.1.a
    text: |-
      een beschrijving van de te hanteren prestatie-indicatoren en de daaraan ten grondslag liggende
      berekeningsmethodieken;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel56
  - number: 56.1.b
    text: |-
      een model van een verslag als bedoeld in [artikel 43, eerste lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel43
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '43'
  - number: 56.1.c
    text: 'voorschriften met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel56
  - number: 56.1.c.1°
    text: |-
      de bronnen die gehanteerd mogen worden voor het verzamelen van de gegevens, bedoeld in
      [artikel 40, eerste lid, onder d, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel40
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '40'
  - number: 56.1.c.2°
    text: het standaardiseren van de bedoelde gegevens;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel56
  - number: 56.1.c.3°
    text: het waarborgen van de betrouwbaarheid en validiteit van die gegevens.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel56
  - number: '56.2'
    text: Financiële gegevens worden voorzien van een goedkeurende verklaring van een registeraccountant.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel56
  - number: '57.1'
    text: 'De in het protocol op te nemen prestatie-indicatoren voor kwaliteit hebben ten minste betrekking op:'
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel57
  - number: 57.1.a
    text: |-
      bij ministeriële regeling aangewezen parameters en de daarbij behorende waarden en de frequentie en mate van
      overschrijdingen daarvan;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel57
  - number: 57.1.b
    text: de kwaliteitsbewaking;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel57
  - number: 57.1.c
    text: de lek- en spuiverliezen;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel57
  - number: 57.1.d
    text: de druk in het distributienet.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel57
  - number: '57.2'
    text: |-
      De in het protocol op te nemen prestatie-indicatoren voor klantenservice hebben ten minste betrekking op de
      volgende dienstverleningsprocessen:
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel57
  - number: 57.2.a
    text: het verhelpen van verstoringen;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel57
  - number: 57.2.b
    text: geplande en ongeplande onderbrekingen van de levering;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel57
  - number: 57.2.c
    text: facturering;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel57
  - number: 57.2.d
    text: onderhoud aan het distributienet;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel57
  - number: 57.2.e
    text: meteropname;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel57
  - number: 57.2.f
    text: verhuizingen.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel57
  - number: '57.3'
    text: 'De in het protocol op te nemen prestatie-indicatoren voor milieuaspecten hebben ten minste betrekking op:'
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel57
  - number: 57.3.a
    text: het energieverbruik van het drinkwaterbedrijf;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel57
  - number: 57.3.b
    text: het percentage hergebruik van afvalstoffen van het drinkwaterbedrijf,
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel57
  - number: 57.3.c
    text: de duurzaamheid van het inkoopbeleid van het drinkwaterbedrijf.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel57
  - number: '57.4'
    text: |-
      De in het protocol op te nemen prestatie-indicatoren voor kostenefficiëntie hebben ten minste betrekking op de
      kosten van drinkwater, te onderscheiden in:
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel57
  - number: 57.4.a
    text: operationele kosten;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel57
  - number: 57.4.b
    text: vermogenskosten;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel57
  - number: 57.4.c
    text: afschrijvingen.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel57
  - number: '58.1'
    text: |-
      Het verslag, bedoeld in [artikel 43, eerste lid, van de wet][ref1], bevat ten minste:


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel43
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '43'
  - number: 58.1.a
    text: |-
      een weergave van de prestaties van de afzonderlijke drinkwaterbedrijven in onderlinge vergelijking op basis van de
      gehanteerde prestatie-indicatoren;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel58
  - number: 58.1.b
    text: een weergave van de veranderingen van de prestaties in de tijd;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel58
  - number: 58.1.c
    text: |-
      een weergave van de kosten en kostenontwikkeling voor de kostensoorten, genoemd in [artikel 57, vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030111#Artikel57
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0030111
        artikel: '57'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 58.1.d
    text: |-
      een weergave van de kosten en kostenontwikkeling van drinkwater per kubieke meter geleverd drinkwater en per
      aansluiting;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel58
  - number: 58.1.e
    text: een weergave van de investeringen in onderzoek en ontwikkeling;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel58
  - number: 58.1.f
    text: een analyse van de gerealiseerde efficiëntieverbetering;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel58
  - number: 58.1.g
    text: informatie over de vermogensopbouw en de opbouw van reserves;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel58
  - number: 58.1.h
    text: informatie over de uitkeringen aan aandeelhouders en andere winstgerechtigden.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel58
  - number: '58.2'
    text: |-
      De in het verslag opgenomen gegevens en overige informatie zijn volledig en voldoende gedetailleerd om een adequaat
      beeld van de prestaties van de drinkwaterbedrijven te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel58
  - number: '59'
    text: |-
      Bij ministeriële regeling worden in het belang van de volksgezondheid gegevens als bedoeld in
      [artikel 51 van de wet][ref1] aangewezen die door de eigenaar van een drinkwaterbedrijf aan de toezichthouder
      worden verstrekt, op een bij die regeling aangegeven wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel51
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '51'
  - number: '69.1'
    text: |-
      Een risicoanalyse, uitgevoerd op grond van of overeenkomstig
      [artikel 17k, eerste en tweede lid, van het Waterleidingbesluit][ref1], zoals dat luidde onmiddellijk voorafgaand
      aan de inwerkingtreding van dit besluit, geldt als een legionella-risicoanalyse, uitgevoerd op grond van
      [artikel 37, eerste, tweede en derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002339#Artikel17k
      [ref2]: https://wetten.overheid.nl/BWBR0030111#Artikel37
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0002339
        artikel: 17k
      - id: ref2
        bwb_id: BWBR0030111
        artikel: '37'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '69.2'
    text: |-
      Een beheersplan, opgesteld op grond van of overeenkomstig
      [artikel 17l, eerste en tweede lid, van het Waterleidingbesluit][ref1], zoals dat luidde onmiddellijk
      voorafgaand aan de inwerkingtreding van dit besluit, geldt als een legionella-beheersplan, opgesteld op grond van
      [artikel 38, eerste en vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002339#Artikel17l
      [ref2]: https://wetten.overheid.nl/BWBR0030111#Artikel38
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0002339
        artikel: 17l
      - id: ref2
        bwb_id: BWBR0030111
        artikel: '38'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '69.3'
    text: |-
      In gevallen waarin het eerste of tweede lid van toepassing zijn, zijn de
      [artikelen 37, vierde, vijfde en zesde lid][ref1], respectievelijk [38, tweede en derde lid][ref2], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030111#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0030111#Artikel38
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0030111
        artikel: '37'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0030111
        artikel: '38'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '69.4'
    text: |-
      Het eerste en het tweede lid zijn niet van toepassing, indien bij een controle als bedoeld in
      [artikel 24, eerste of tweede lid, van de wet][ref1] blijkt dat een risicoanalyse of een beheersplan,
      uitgevoerd op grond van of overeenkomstig [artikel 17k, eerste en tweede lid][ref2], respectievelijk
      [artikel 17l, eerste en tweede lid, van het Waterleidingbesluit][ref3], onjuist of onvolledig is uitgevoerd dan wel
      anderszins niet voldoet aan de in artikel 17k en 17l van het Waterleidingbesluit gestelde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0002339#Artikel17k
      [ref3]: https://wetten.overheid.nl/BWBR0002339#Artikel17l
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0002339
        artikel: 17k
      - id: ref3
        bwb_id: BWBR0002339
        artikel: 17l
  - number: '69.5'
    text: |-
      In geval van een situatie als bedoeld in [artikel 35, eerste lid, aanhef en onderdeel c, onder 2°][ref1], dan
      wel een situatie als bedoeld in artikel 35, eerste lid, aanhef en onderdeel i, wordt aan de in [hoofdstuk 4][ref2]
      bedoelde verplichtingen voor de eerste maal gevolg gegeven binnen ten hoogste één jaar nadat dit besluit in werking
      is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0030111#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0030111#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0030111
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0030111
        hoofdstuk: '4'
  - number: '69.6'
    text: |-
      Aan de in [artikelen 15 tot en met 17][ref1] bedoelde verplichtingen wordt voor de eerste maal gevolg gegeven
      binnen ten hoogste één jaar nadat dit besluit in werking is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0030111#Artikel15
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel69
    references:
      - id: ref1
