  - number: '2.1'
    text: |-
      Op huishoudwater is de [wet][ref1], met uitzondering van de [artikelen 1][ref2], [21, eerste lid][ref3], en
      [31][ref4], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0026338
      [ref2]: https://wetten.overheid.nl/BWBR0026338#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0026338#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0026338#Artikel31
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0026338
      - id: ref2
        bwb_id: BWBR0026338
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0026338
        artikel: '21'
      - id: ref4
        bwb_id: BWBR0026338
        artikel: '31'
  - number: '2.2'
    text: |-
      Voor zover huishoudwater door een drinkwaterbedrijf wordt geleverd, zijn de [artikelen 8, derde lid][ref1], en
      [11, eerste lid, van de wet][ref2] wel van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0026338#Artikel11
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0026338
        artikel: '11'
  - number: '3.1'
    text: |-
      Bij ministeriële regeling worden in het belang van de volksgezondheid nadere eisen gesteld aan de productie,
      distributie en het gebruik van huishoudwater. Daarbij kan met het oog op dat belang onderscheid worden gemaakt
      tussen eigenaars van drinkwaterbedrijven, collectieve watervoorzieningen, collectieve leidingnetten of andere
      huishoudwatervoorzieningen.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel3
  - number: '3.2'
    text: |-
      De nadere eisen, bedoeld in het eerste lid, kunnen inhouden dat het voor eigenaars als bedoeld in dat lid die
      behoren tot een daarbij aangewezen categorie, behoudens een voorafgaand door Onze Minister verleende ontheffing,
      niet toegestaan is om huishoudwater te produceren voor consumenten of andere afnemers of aan hen huishoudwater
      te leveren.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel3
  - number: '3.3'
    text: 'In het in het eerste lid genoemde belang:'
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel3
  - number: 3.3.a
    text: |-
      kan een ontheffing als bedoeld in het tweede lid voor bepaalde tijd en onder voorwaarden en beperkingen worden
      verleend;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel3
  - number: 3.3.b
    text: kunnen de aan een ontheffing verbonden voorwaarden en beperkingen worden gewijzigd of ingetrokken;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel3
  - number: 3.3.c
    text: kan een verleende ontheffing worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel3
  - number: '4'
    text: |-
      De eigenaar van een huishoudwatervoorziening draagt er, voor zover dat binnen zijn vermogen ligt, zorg voor dat een
      consument of andere afnemer van het huishoudwater dat water alleen gebruikt of kan gebruiken voor toiletspoeling.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel4
  - number: '5.1'
    text: |-
      De eigenaar van een huishoudwatervoorziening gebruikt voor de productie van huishoudwater uitsluitend hemelwater
      dat op een dak is opgevangen of grondwater.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel5
  - number: '5.2'
    text: |-
      Indien onvoldoende hemelwater of grondwater beschikbaar is voor de productie van huishoudwater, wordt daarnaast
      alleen drinkwater gebruikt voor die productie.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel5
  - number: '5.3'
    text: |-
      In afwijking van het eerste en tweede lid kan voor toiletspoeling op een binnen het Nederlandse
      territoir of het Nederlandse deel van het continentale plat gelegen mijnbouwinstallatie als bedoeld in
      [artikel 1, onderdeel o, van de Mijnbouwwet][ref1], zeewater worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel1
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '1'
  - number: '5.4'
    text: |-
      In afwijking van het eerste lid kan voor de productie van huishoudwater ander water worden gebruikt indien de
      toezichthouder van oordeel is dat het gebruik van dit water geen nadelige gevolgen heeft voor de gezondheid van de
      consumenten en voor de aan hen toebehorende goederen.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel5
  - number: '6.1'
    text: |-
      Als methode, bedoeld in [artikel 10, eerste lid, van de wet][ref1], voor het bepalen van de gewogen gemiddelde
      vermogenskostenvoet wordt vastgesteld de methode, opgenomen in de bij dit besluit behorende [bijlage C][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0030111
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0030111
  - number: '6.2'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de berekening van de gewogen
      gemiddelde vermogenskostenvoet overeenkomstig de methode bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel6
  - number: '7.1'
    text: |-
      Het aandeel eigen vermogen wordt bepaald als het totaal vermogen, verminderd met het vreemd vermogen, gedeeld door
      het totaal vermogen.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel7
  - number: '7.2'
    text: |-
      Bij het vaststellen van het maximaal toegestane aandeel eigen vermogen, bedoeld in
      [artikel 10, tweede lid, van de wet][ref1], worden de volgende criteria in acht genomen:


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel10
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '10'
  - number: 7.2.a
    text: de kredietwaardigheid ten behoeve van het aantrekken van vreemd vermogen;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel7
  - number: 7.2.b
    text: de ruimte voor investeringen;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel7
  - number: 7.2.c
    text: het vermogen om financiële tegenvallers op te vangen.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel7
  - number: '7.3'
    text: |-
      Het afwijken, bedoeld in [artikel 10, tweede lid, tweede volzin, van de wet][ref1], van het krachtens de eerste
      volzin van dat lid vastgesteld maximaal toegestane aandeel eigen vermogen is toegestaan voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel10
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '10'
  - number: 7.3.a
    text: aannemelijk kan worden gemaakt dat dit nodig is voor het doen van investeringen,
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel7
  - number: 7.3.b
    text: dat leidt tot een verlaging van de kosten van financiering,
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel7
  - number: 7.3.c
    text: de afwijking maximaal 10 procentpunten meer bedraagt dan het maximaal toegestane aandeel eigen vermogen.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel7
  - number: '7.4'
    text: |-
      Een verzoek tot afwijking als bedoeld in [artikel 10, tweede lid, van de wet][ref1], is met redenen omkleed.


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel10
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '10'
  - number: '8.1'
    text: |-
      Als kosten, bedoeld in [artikel 13, eerste lid, onder a, van de wet][ref1], die ten grondslag liggen aan het
      tarief, bedoeld in [artikel 11 van de wet][ref2], worden aangemerkt kosten die zijn of worden gemaakt ten behoeve
      van de taken, genoemd in [artikel 7, eerste en tweede lid, van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0026338#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0026338#Artikel7
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0026338
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0026338
        artikel: '7'
  - number: '8.2'
    text: |-
      De kosten van projecten ten behoeve van de bevordering van een goede drinkwatervoorziening in het buitenland
      bedragen maximaal 1% van de raming van de omzet, bedoeld in [artikel 9, eerste lid, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030111#Artikel9
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0030111
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '8.3'
    text: |-
      De kosten, bedoeld in het tweede lid, worden in mindering gebracht op de toegestane vermogenskostenvergoeding,
      volgend uit de vastgestelde vermogenskosten, bedoeld in [artikel 11, tweede lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel11
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '11'
  - number: '8.4'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de wijze van berekening van de
      vermogenskosten, bedoeld in [artikel 11, tweede lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel11
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '11'
  - number: 8a.1
    text: 'Onze Minister kan advies vragen aan de Autoriteit Consument en Markt voorafgaande aan:'
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel8a
  - number: 8a.1.a
    text: |-
      het afwijken, bedoeld in [artikel 10, tweede lid, tweede volzin, van de wet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel10
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '10'
  - number: 8a.1.b
    text: |-
      de vaststelling van de gewogen gemiddelde vermogenskostenvoet, bedoeld in [artikel 10, derde lid, van de wet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel10
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '10'
  - number: 8a.1.c
    text: |-
      de beoordeling van een verzoek tot fusie als bedoeld in [artikel 18, tweede lid, van de wet][ref1], voor zover het
      de doelmatige drinkwatervoorziening, bedoeld in [artikel 7, eerste lid, onder a, van de wet][ref2], in relatie tot
      de voorgenomen fusie betreft,


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0026338#Artikel7
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0026338
        artikel: '7'
  - number: 8a.1.d
    text: |-
      de vaststelling van de nadere regels, bedoeld in de [artikelen 6, tweede lid][ref1], en [8, vierde lid][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0030111#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0030111#Artikel8
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0030111
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0030111
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 8a.1.e
    text: |-
      de vaststelling van het maximaal toegestane aandeel eigen vermogen, bedoeld in [artikel 7, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030111#Artikel7
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0030111
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 8a.2
    text: |-
      De inspecteur kan bij de uitoefening van het toezicht op de naleving van [artikel 12, derde lid, van de wet][ref1]
      en van deze paragraaf advies vragen aan de Autoriteit Consument en Markt.


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel12
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '12'
  - number: 8a.3
    text: |-
      Bij ministeriële regeling wordt bepaald onder welke omstandigheden Onze Minister respectievelijk de inspecteur
      gebruikmaakt van zijn in het eerste respectievelijk tweede lid neergelegde bevoegdheid.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel8a
  - number: '9.1'
    text: |-
      De elementen en wijze van berekening van de tarieven, bedoeld in
      [artikel 13, eerste lid, onder b, van de wet][ref1], worden gevormd door:


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel13
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '13'
  - number: 9.1.a
    text: |-
      een raming van de met de taken, bedoeld in [artikel 7, eerste en tweede lid, van de wet][ref1], te behalen omzet,
      die mede is gebaseerd op de daadwerkelijk gerealiseerde omzet in het voorafgaande kalenderjaar;


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel7
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '7'
  - number: 9.1.b
    text: |-
      een raming van de kosten, bedoeld in [artikel 8, eerste lid][ref1], die worden doorberekend in de
      drinkwatertarieven.


      [ref1]: https://wetten.overheid.nl/BWBR0030111#Artikel8
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0030111
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '9.2'
    text: 'Bij de raming van de kosten, bedoeld in het eerste lid, onder b, worden betrokken:'
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel9
  - number: 9.2.a
    text: een in het voorafgaande jaar gerealiseerde verbetering van de kostenefficiëntie;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel9
  - number: 9.2.b
    text: |-
      het verslag met de resultaten van de prestatievergelijking, bedoeld in [artikel 43, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel43
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '43'
  - number: '9.3'
    text: |-
      Aan het vereiste van kostendekkendheid van het tarief, bedoeld in [artikel 11, eerste lid, van de wet][ref1],
      wordt in ieder geval voldaan indien de geraamde omzet uit het tarief niet meer bedraagt dan de som van de geraamde
      kosten, bedoeld in het eerste lid, onder b.


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel11
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '11'
  - number: '10.1'
    text: |-
      De eigenaar van een drinkwaterbedrijf publiceert jaarlijks voor 1 december een overzicht van de tarieven die hij in
      het daarop volgende kalenderjaar voor de beschikbaarstelling en levering van drinkwater in rekening brengt.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel10
  - number: '10.2'
    text: |-
      In het in het eerste lid bedoelde overzicht wordt ten minste onderscheid gemaakt in tarieven voor de volgende
      posten:
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel10
  - number: 10.2.a
    text: aansluitkosten,
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel10
  - number: 10.2.b
    text: vastrecht, en
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel10
  - number: 10.2.c
    text: prijs per kubieke meter geleverd drinkwater.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel10
  - number: '10.3'
    text: |-
      In het in het eerste lid bedoelde overzicht wordt bij de tarieven aangegeven hoe deze zijn afgeleid uit de door het
      drinkwaterbedrijf te maken kosten voor de volgende posten:
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel10
  - number: 10.3.a
    text: operationele kosten,
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel10
  - number: 10.3.b
    text: afschrijvingen,
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel10
  - number: 10.3.c
    text: vermogenskosten, en
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel10
  - number: 10.3.d
    text: belastingen.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel10
  - number: '10.4'
    text: |-
      In het in het eerste lid bedoelde overzicht wordt inzicht verschaft in de wijze van kostentoerekening voor de
      levering via het distributienet van ander water dan drinkwater.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel10
  - number: '11.1'
    text: |-
      Bij een verzoek tot fusie als bedoeld in [artikel 18, tweede lid, van de wet][ref1], maken de
      betrokken drinkwaterbedrijven inzichtelijk dat zij na de voorgenomen fusie blijven voldoen aan de
      [artikelen 7, eerste lid][ref2], en [32, eerste lid, van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0026338#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0026338#Artikel32
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0026338
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0026338
        artikel: '32'
  - number: '11.2'
    text: |-
      Onverminderd het eerste lid toetst Onze Minister een verzoek tot fusie als bedoeld in
      [artikel 18, tweede lid, van de wet][ref1] aan de mate waarin de voorgenomen fusie de mogelijkheid tot uitvoering
      van een zinvolle prestatievergelijking beperkt.


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel18
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '18'
  - number: '11.3'
    text: |-
      Bij ministeriële regeling kunnen ter uitvoering van het tweede lid de omstandigheden worden bepaald die na een
      fusie de mogelijkheid tot uitvoering van een zinvolle prestatievergelijking kunnen beperken.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel11
  - number: '12'
    text: |-
      Voor zover de eigenaar van een drinkwaterbedrijf voldoet aan de in deze paragraaf opgenomen bepalingen en de
      daarop berustende voorschriften, voldoet hij daarmee, voor zover het betreft de in die bepalingen en voorschriften
      geregelde onderwerpen, tevens aan [artikel 21, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel21
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '21'
  - number: '13.1'
    text: |-
      De eigenaar van een drinkwaterbedrijf draagt er zorg voor dat het drinkwater op het leveringspunt en op het tappunt
      voldoet aan de eisen die daaraan worden gesteld in de tabellen I, II, IIIa, IIIb en IIIc van [bijlage A][ref1],
      behorende bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0030111
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0030111
  - number: '13.2'
    text: |-
      Het eerste lid geldt niet voor zover het betreft drinkwater dat aan het tappunt ter beschikking komt en dat
      niet aan de in dat lid bedoelde eisen voldoet door een oorzaak die is gelegen in een op het leidingnet van het
      desbetreffende drinkwaterbedrijf aangesloten woninginstallatie, collectief leidingnet, collectieve watervoorziening
      of andere op het leidingnet van een drinkwaterbedrijf aangesloten installatie.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel13
  - number: '14'
    text: 'Bij ministeriële regeling worden met betrekking tot de volgende onderwerpen nadere voorschriften gesteld:'
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel14
  - number: 14.a
    text: |-
      de laboratoria die analyses uitvoeren en de bedrijven en personen die onder verantwoordelijkheid van een
      laboratorium monsters nemen ter uitvoering van dit besluit en de daarop berustende voorschriften,
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel14
  - number: 14.b
    text: |-
      de wijze van monsterneming en de analyse van water dat als grondstof wordt gebruikt voor de bereiding van
      drinkwater, het behandelde water of halffabrikaat en het geleverde drinkwater,
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel14
  - number: 14.c
    text: de frequentie waarmee het water wordt geanalyseerd, en
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel14
  - number: 14.d
    text: een daartoe op te stellen meetprogramma.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel14
  - number: '15.1'
    text: |-
      Het toezicht door de eigenaar van een drinkwaterbedrijf, bedoeld in
      [artikel 21, derde lid, onder b, van de wet][ref1], vindt plaats door middel van een daartoe op te stellen en uit
      te voeren kwaliteitsmanagementsysteem, gebaseerd op NEN-EN-ISO 9001. Bij ministeriële regeling kan een handleiding
      worden aangewezen die de eigenaar gebruikt bij het opstellen van het kwaliteitsmanagementsysteem.


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel21
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '21'
  - number: '15.2'
    text: |-
      De primaire bedrijfsprocessen die in ieder geval bij het opstellen en uitvoeren van het kwaliteitsmanagementsysteem
      worden betrokken zijn:
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel15
  - number: 15.2.a
    text: de winning, de opslag en het transport van de grondstof waaruit het drinkwater wordt bereid;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel15
  - number: 15.2.b
    text: de behandeling van het gewonnen water tot drinkwater, met inbegrip van het gebruik van chemicaliën en materialen;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel15
  - number: 15.2.c
    text: de opslag en distributie van het drinkwater;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel15
  - number: 15.2.d
    text: |-
      de inkoop en opslag van drinkwater dan wel van de grondstof of halffabrikaat waaruit het drinkwater wordt bereid,
      en
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel15
  - number: 15.2.e
    text: de energievoorziening.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel15
  - number: '15.3'
    text: |-
      De secundaire bedrijfsprocessen die in ieder geval bij het opstellen en uitvoeren van het
      kwaliteitsmanagementsysteem worden betrokken zijn:
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel15
  - number: 15.3.a
    text: |-
      de inkoop, de opslag en het beheer van chemicaliën en materialen waarmee het water wordt behandeld en
      gedistribueerd;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel15
  - number: 15.3.b
    text: 'de bewaking van:'
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel15
  - number: 15.3.b.1°
    text: de kwaliteit van de grondstof,
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel15
  - number: 15.3.b.2°
    text: de kwaliteitsveranderingen in het zuiveringsproces,
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel15
  - number: 15.3.b.3°
    text: de kwaliteit van het drinkwater na de laatste zuiveringsstap,
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel15
  - number: 15.3.b.4°
    text: de kwaliteit van het drinkwater aan het tappunt, en
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel15
  - number: 15.3.b.5°
    text: |-
      het voorkomen van verontreiniging van het leidingnet van het drinkwaterbedrijf vanuit de daarop aangesloten
      installaties;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel15
  - number: 15.3.c
    text: de bewaking van de hoeveelheid afgeleverd drinkwater en de druk in het leidingnet van het drinkwaterbedrijf;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel15
  - number: 15.3.d
    text: de bewaking van de kwaliteit van de te gebruiken chemicaliën en materialen in de primaire bedrijfsprocessen;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel15
  - number: 15.3.e
    text: het ontwerp, de bouw en het onderhoud van de watervoorzieningswerken;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel15
  - number: 15.3.f
    text: de bewaking van de conditie van de watervoorzieningswerken;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel15
  - number: 15.3.g
    text: het uitvoeren van onderhoud en reparaties aan de watervoorzieningswerken;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel15
  - number: 15.3.h
    text: |-
      de bewaking van de gezondheid van het personeel, teneinde de verspreiding van infectieziekten via de
      drinkwatervoorziening tegen te gaan;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel15
  - number: 15.3.i
    text: het hygiënisch werken bij de aanleg en het onderhoud van watervoorzieningswerken;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel15
  - number: 15.3.j
    text: de bewaking van de vakbekwaamheid van het personeel dat werkzaam is in de primaire bedrijfsprocessen.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel15
  - number: '16'
    text: |-
      Een kwaliteitsmanagementsysteem is of wordt gecertificeerd door een bij de Raad voor Accreditatie daarvoor
      geaccrediteerde certificatie-instelling of door een certificatie-instelling die daarvoor is geaccrediteerd door een
      andere accreditatie-instelling die ondertekenaar is van de Multilateral Agreement van de European co-operation for
      Accreditation (EA-01/06).
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel16
  - number: '17.1'
    text: |-
      De eigenaar van een drinkwaterbedrijf draagt er zorg voor dat jaarlijks een auditrapport wordt opgesteld door een
      certificatie-instelling als bedoeld in [artikel 16][ref1] en dat dit rapport ter inzage ligt voor de inspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0030111#Artikel16
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0030111
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '17.2'
    text: |-
      Indien de certificatie-instelling het certificaat van een drinkwaterbedrijf intrekt dan wel significante
      afwijkingen van de desbetreffende kwaliteitseisen constateert, stelt de eigenaar van dat drinkwaterbedrijf de
      inspecteur daar terstond en volledig van op de hoogte.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel17
  - number: '17.3'
    text: |-
      Indien het kwaliteitsmanagementsysteem van een drinkwaterbedrijf niet voldoet aan de eisen die daaraan worden
      gesteld overeenkomstig de handleiding, bedoeld in [artikel 15, eerste lid][ref1], kan de inspecteur aanwijzingen
      geven en daarbij bepalen op welke wijze en binnen welke termijn alsnog aan die eisen moet worden voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0030111#Artikel15
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0030111
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '18'
    text: |-
      Bij ministeriële regeling kunnen in het belang van de volksgezondheid eisen worden gesteld als bedoeld in
      [artikel 21, vierde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel21
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '21'
  - number: '19.1'
    text: |-
      Onverminderd de [paragrafen 3.1.1][ref1] en [3.1.2][ref2] draagt de eigenaar van een drinkwaterbedrijf er zorg voor
      dat de materialen en chemicaliën, die gebruikt worden bij de winning, de bereiding, de behandeling, de opslag, het
      transport of de distributie van drinkwater:


      [ref1]: https://wetten.overheid.nl/BWBR0030111#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0030111#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0030111
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0030111
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 19.1.a
    text: |-
      als gevolg van dat gebruik of de wijze waarop deze materialen en chemicaliën worden toegepast, niet in een hogere
      concentratie in het drinkwater achterblijven dan voor het gebruik van die materialen of chemicaliën noodzakelijk
      is,
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel19
  - number: 19.1.b
    text: |-
      ook anderszins als gevolg van dat gebruik of die wijze van toepassing geen nadelige gevolgen hebben voor de
      volksgezondheid. Daaronder wordt mede verstaan het effect dat de gebruikte materialen hebben op de vorming van
      biofilm in de leidingen.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel19
  - number: '19.2'
    text: |-
      Het eerste lid is niet van toepassing indien bij de distributie van drinkwater te gebruiken materialen deel
      uitmaken van een gebouw als bedoeld in [artikel 1, eerste lid, onder c, van de Woningwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '1'
  - number: '20.1'
    text: |-
      Aan [artikel 19, eerste lid, aanhef en onder b][ref1], wordt voldaan, indien het materialen en chemicaliën betreft:


      [ref1]: https://wetten.overheid.nl/BWBR0030111#Artikel19
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0030111
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 20.1.a
    text: |-
      waarvoor een door Onze Minister erkende tijdelijke of definitieve kwaliteitsverklaring of een aan van
      deze kwaliteitsverklaringen gelijkwaardige verklaring is afgegeven, mits deze materialen en chemicaliën
      dienovereenkomstig worden gebruikt of toegepast, of
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel20
  - number: 20.1.b
    text: |-
      waarvan volgens bij ministeriële regeling vast te stellen criteria is aangetoond dat aan het bedoelde vereiste
      wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel20
  - number: '20.2'
    text: |-
      Er is een commissie van deskundigen, belast met de uitvoering van het eerste lid en de daarop berustende
      bepalingen. Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de oprichting, samenstelling,
      activiteiten, werkwijze en kosten van de commissie.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel20
  - number: '21.1'
    text: |-
      De eigenaar van een drinkwaterbedrijf draagt er zorg voor dat de leidingen die deel uitmaken van zijn
      watervoorzieningswerken en distributienet worden aangelegd overeenkomstig NEN 3650, NEN 3651, NEN 7171-1 en NPR
      7171-2.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel21
  - number: '21.2'
    text: |-
      De eigenaar van een drinkwaterbedrijf draagt er zorg voor dat verontreiniging van het drinkwater wordt voorkomen
      door bij aanleg en herstel van zijn watervoorzieningwerken en distributienet te werken overeenkomstig BTO 2001.175.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel21
  - number: '22.1'
    text: |-
      Het door de eigenaar van een drinkwaterbedrijf krachtens [artikel 21, derde lid, onder d, van de wet][ref1], te
      verrichten onderzoek indien het drinkwater niet voldoet aan het eerste lid van dat artikel of aan een in de tabel
      I of II van [bijlage A][ref2], behorende bij dit besluit, gestelde eis, betreft de oorzaak en de mogelijke nadelige
      gevolgen daarvan voor de volksgezondheid. Dit onderzoek wordt terstond en volledig uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0030111
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0030111
  - number: '22.2'
    text: |-
      Voor zover uit het in het eerste lid bedoelde onderzoek blijkt dat het niet voldoen aan de daar bedoelde eis of
      eisen veroorzaakt wordt door de kwaliteit van het door de eigenaar van het drinkwaterbedrijf geleverde water, neemt
      hij terstond de in het belang van de volksgezondheid noodzakelijke en passende herstelmaatregelen waardoor het
      drinkwater alsnog voldoet aan de daaraan gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel22
  - number: '22.3'
    text: |-
      Voor zover uit het in het eerste lid bedoelde onderzoek blijkt dat het niet voldoen aan de daar bedoelde
      eis of eisen veroorzaakt wordt door een op het leidingnet van het drinkwaterbedrijf aangesloten collectieve
      watervoorziening, collectief leidingnet, woninginstallatie of andere daarop aangesloten installatie, wordt de
      eigenaar of beheerder daarvan terstond en volledig geïnformeerd door de eigenaar van het drinkwaterbedrijf.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel22
  - number: '23'
    text: |-
      Indien drinkwater niet voldoet aan [artikel 21, eerste lid, van de wet][ref1] of aan een in tabel I of II van
      [bijlage A][ref2], behorende bij dit besluit, gestelde eis, informeert de eigenaar van een drinkwaterbedrijf
      terstond en volledig de toezichthouder hierover alsmede over het onderzoek en de te nemen herstelmaatregelen,
      bedoeld in [artikel 22][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0030111
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel22
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0030111
      - id: ref3
        bwb_id: BWBR0005181
        artikel: '22'
  - number: '24.1'
    text: |-
      De eigenaar van een drinkwaterbedrijf informeert terstond en volledig de consumenten en andere afnemers, indien het
      aan hen geleverde drinkwater niet voldoet aan [artikel 21, eerste lid, van de wet][ref1] of aan een in tabel I of
      II van [bijlage A][ref2], behorende bij dit besluit, gestelde eis.


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0030111
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0030111
  - number: '24.2'
    text: |-
      Ingeval van een situatie als bedoeld in [artikel 21, derde lid, onder e, sub 2°, van de wet][ref1], adviseert
      de eigenaar van een drinkwaterbedrijf terstond en volledig de eigenaars van percelen waar drinkwater aan wordt
      geleverd alsmede consumenten en andere afnemers omtrent de voorzorgs- en herstelmaatregelen die zij kunnen nemen om
      nadelige gevolgen voor de gezondheid te voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel21
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '21'
  - number: '25.1'
    text: |-
      Indien het drinkwater niet voldoet aan een in tabel III van [bijlage A][ref1], behorende bij dit besluit, gestelde
      eis, informeert de eigenaar terstond en volledig de toezichthouder hierover en verricht hij terstond onderzoek naar
      de oorzaak en de mogelijke nadelige gevolgen voor de volksgezondheid.


      [ref1]: https://wetten.overheid.nl/BWBR0030111
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0030111
  - number: '25.2'
    text: |-
      In gevallen als bedoeld in het eerste lid neemt de eigenaar terstond de in het belang van de volksgezondheid
      noodzakelijke en passende herstelmaatregelen waardoor het drinkwater alsnog voldoet aan de daaraan gestelde eisen,
      tenzij de toezichthouder van oordeel is dat de normoverschrijding geen nadelige gevolgen heeft voor de gezondheid
      van de consumenten en voor de aan hen toebehorende goederen.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel25
  - number: '25.3'
    text: |-
      In gevallen als bedoeld in het eerste lid informeert de eigenaar de consumenten en andere afnemers over het
      niet voldoen aan de daar bedoelde eis of eisen en adviseert hij hen omtrent de maatregelen die zij kunnen
      nemen om nadelige gevolgen voor de gezondheid te voorkomen, tenzij de toezichthouder van oordeel is dat de
      normoverschrijding geen nadelige gevolgen heeft voor de gezondheid van de consumenten en voor de aan hen
      toebehorende goederen.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel25
  - number: '26.1'
    text: |-
      De eigenaar van een drinkwaterbedrijf houdt de op grond van [artikel 14][ref1] verkregen gegevens gedurende ten
      minste vijf jaar onder zich.


      [ref1]: https://wetten.overheid.nl/BWBR0030111#Artikel14
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0030111
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '26.2'
    text: |-
      De kwaliteitsgegevens, bedoeld in het eerste lid, worden uiterlijk vier weken nadat deze bij de eigenaar van een
      drinkwaterbedrijf bekend zijn geworden door hem voor een ieder toegankelijk gemaakt.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel26
  - number: '26.3'
    text: |-
      De eigenaar van een drinkwaterbedrijf stelt jaarlijks voor 1 april een overzicht op van de kwaliteit van het door
      hem geleverde drinkwater in het voorgaande kalenderjaar. Dit overzicht is openbaar en ligt ter inzage op een voor
      een ieder toegankelijke plaats.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel26
  - number: '26.4'
    text: 'Jaarlijks voor 1 april verstrekt de eigenaar aan de toezichthouder een representatieve samenvatting van:'
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel26
  - number: 26.4.a
    text: de kwaliteitsgegevens, bedoeld in het eerste lid, en
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel26
  - number: 26.4.b
    text: |-
      de herstelmaatregelen ter waarborging van de kwaliteit van het drinkwater, bedoeld in [artikel 22][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030111#Artikel22
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0030111
        artikel: '22'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '26.5'
    text: |-
      Bij ministeriële regeling kunnen nadere eisen worden gesteld aan de vorm waarin de gegevens, bedoeld in het vierde
      lid, worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel26
  - number: '27.1'
    text: |-
      Warm tapwater wordt bereid uit drinkwater dat voldoet aan de kwaliteitseisen, bedoeld in
      [artikel 13, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030111#Artikel13
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0030111
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '27.2'
    text: |-
      Bij ministeriële regeling worden nadere eisen gesteld aan de borging van de kwaliteit van het geleverde warm
      tapwater.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel27
  - number: '28.1'
    text: |-
      De verlening van een ontheffing, bedoeld in [artikel 21, vijfde lid, van de wet][ref1], is uitsluitend mogelijk:


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel21
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '21'
  - number: 28.1.a
    text: |-
      met betrekking tot een in tabel II van [bijlage A][ref1], behorende bij dit besluit, opgenomen parameterwaarde;


      [ref1]: https://wetten.overheid.nl/BWBR0030111
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0030111
  - number: 28.1.b
    text: op verzoek van de eigenaar van een drinkwaterbedrijf;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel28
  - number: 28.1.c
    text: voor een periode van ten hoogste drie jaren, en
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel28
  - number: 28.1.d
    text: |-
      voor zover de openbare drinkwatervoorziening in het desbetreffende gebied redelijkerwijs niet op een andere wijze
      kan worden voortgezet.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel28
  - number: '28.2'
    text: |-
      De voorschriften en beperkingen, bedoeld in [artikel 21, vijfde lid, tweede volzin, van de wet][ref1], worden
      gesteld in het belang van de volksgezondheid.


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel21
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '21'
  - number: '28.3'
    text: |-
      De intrekking van een ontheffing en wijziging of intrekking van de aan een ontheffing verbonden voorschriften
      vinden plaats in het belang van de volksgezondheid.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel28
  - number: '28.4'
    text: |-
      De eigenaar van een drinkwaterbedrijf aan wie een ontheffing als bedoeld in het eerste lid is verleend, stelt Onze
      Minister terstond en volledig op de hoogte van omstandigheden die er redelijkerwijs toe kunnen leiden dat aan het
      eind van de periode, bedoeld in het eerste lid, onder c, niet wordt voldaan aan de in dat lid, onder a, bedoelde
      parameterwaarde.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel28
  - number: '28.5'
    text: |-
      In het geval, bedoeld in het vierde lid, kan Onze Minister op verzoek van de eigenaar van een drinkwaterbedrijf
      de periode waarvoor de ontheffing geldt ten hoogste twee maal verlengen. Het eerste tot en met vierde lid zijn van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel28
  - number: '28.6'
    text: |-
      Bij het verlenen van een ontheffing, bedoeld in het eerste lid, of bij het verlengen van de periode waarvoor de
      ontheffing geldt, bedoeld in het vijfde lid, worden in ieder geval de volgende gegevens betrokken:
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel28
  - number: 28.6.a
    text: de redenen voor de ontheffing of de verlenging daarvan;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel28
  - number: 28.6.b
    text: |-
      de parameterwaarde waarop de ontheffing betrekking heeft, de resultaten van eerdere metingen in verband met deze
      parameterwaarde en de maximaal toegestane waarde ingevolge de ontheffing;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel28
  - number: 28.6.c
    text: |-
      het geografisch gebied, de hoeveelheid geleverd water per dag, het aantal verbruikers en de betrokken
      bevolkingsgroep alsmede de eventuele gevolgen van de ontheffing voor de levensmiddelenindustrie;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel28
  - number: 28.6.d
    text: een adequaat meetschema, met verhoogde meetfrequentie indien noodzakelijk;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel28
  - number: 28.6.e
    text: |-
      een samenvatting van het plan voor de noodzakelijke herstelmaatregelen, waaronder een tijdschema, een kostenraming
      en voorzieningen voor onderzoek en evaluatie;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel28
  - number: 28.6.f
    text: de periode waarvoor de ontheffing geldt.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel28
  - number: '29.1'
    text: |-
      In afwijking van [artikel 28, eerste lid, onder a][ref1], kan de toezichthouder op verzoek van de eigenaar van een
      drinkwaterbedrijf ontheffing verlenen voor afwijking van een waarde uit tabel II, opgenomen in [bijlage A][ref2],
      behorende bij dit besluit, voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0030111#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0030111
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0030111
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0030111
  - number: 29.1.a
    text: overschrijding van die waarde naar zijn oordeel geen nadelige gevolgen voor de volksgezondheid heeft,
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel29
  - number: 29.1.b
    text: de overschrijding binnen 30 dagen door het nemen van herstelmaatregelen kan worden opgeheven, en
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel29
  - number: 29.1.c
    text: |-
      de onder a bedoelde waarde door de eigenaar in de voorafgaande twaalf maanden niet gedurende meer dan 30 dagen
      is overschreden.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel29
  - number: '29.2'
    text: |-
      Bij de ontheffing stelt de toezichthouder de maximaal toegestane waarde en duur van de overschrijding van de waarde
      uit tabel II vast.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel29
  - number: '30.1'
    text: 'Bij ministeriële regeling worden:'
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel30
  - number: 30.1.a
    text: |-
      regels gesteld met betrekking tot het verrichten van onderzoek naar de hoedanigheid van het water dat gebruikt
      wordt voor de bereiding van drinkwater;
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel30
  - number: 30.1.b
    text: eisen gesteld aan het oppervlaktewater waaruit drinkwater kan worden bereid.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel30
  - number: '30.2'
    text: |-
      Het verbod, bedoeld in [artikel 22, tweede lid, van de wet][ref1], heeft betrekking op de bereiding van drinkwater
      uit oppervlaktewater dat niet voldoet aan de eisen, bedoeld in het eerste lid, onder b.


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel22
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '22'
  - number: '30.3'
    text: |-
      Het verbod, bedoeld in het tweede lid, is niet van toepassing op water dat tevoren op een bij de regeling, bedoeld
      in het eerste lid, vastgestelde wijze is behandeld, waarbij voor water van verschillende hoedanigheid verschillende
      wijzen van behandeling kunnen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel30
  - number: '30.4'
    text: |-
      Bij ministeriële regeling worden de categorieën van gevallen aangewezen waarin Onze Minister een ontheffing als
      bedoeld in [artikel 22, derde lid, of zevende lid juncto het derde lid, van de wet][ref1], kan verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel22
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '22'
  - number: '30.5'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld als bedoeld in
      [artikel 22, vierde lid, en zevende lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0026338#Artikel22
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0026338
        artikel: '22'
  - number: '31.1'
    text: |-
      De [artikelen 12][ref1], [13][ref2] en [14][ref3], [19 tot en met 24][ref4], [25, eerste lid][ref5],
      [26 tot en met 30][ref6] en [44][ref7] en de daarop berustende bepalingen zijn van overeenkomstige toepassing op de
      eigenaar van een collectieve watervoorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0030111#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0030111#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0030111#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0030111#Artikel19
      [ref5]: https://wetten.overheid.nl/BWBR0030111#Artikel25
      [ref6]: https://wetten.overheid.nl/BWBR0030111#Artikel26
      [ref7]: https://wetten.overheid.nl/BWBR0030111#Artikel44
    url: https://wetten.overheid.nl/BWBR0030111/2013-04-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0030111
        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0030111
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref3
        bwb_id: BWBR0030111
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '3.1'
