  - number: '2'
    text: |-
      Het participatiefonds heeft tot taak het bevoegd gezag de waarborgen te bieden, bedoeld in
      de [artikelen 184, eerste lid, van de WPO][ref1], [170, eerste lid, van de WEC][ref2] en
      [98b, eerste lid, van de WVO][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel184
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel170
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel98b
    url: https://wetten.overheid.nl/BWBR0008102/2006-09-20#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '184'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '170'
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 98b
  - number: '3.1'
    text: |-
      Indien Onze Minister voornemens is van een of meer van de bevoegdheden, bedoeld in de
      [artikelen 188, eerste lid, van de WPO][ref1], [173, eerste lid, van de WEC][ref2] en
      [123b, eerste lid, van de WVO][ref3], jegens het participatiefonds gebruik te maken en dit voornemen kan leiden tot
      een groter beslag op de middelen van het participatiefonds, geeft hij aan dat voornemen geen uitvoering dan nadat
      vier weken zijn verstreken na de bekendmaking van dat voornemen aan het bestuur van het participatiefonds.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel188
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel173
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel123b
    url: https://wetten.overheid.nl/BWBR0008102/2006-09-20#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '188'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '173'
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 123b
  - number: '3.2'
    text: |-
      Binnen het in het eerste lid bedoelde tijdvak kan het bestuur van het participatiefonds een begroting van de
      meerkosten die naar zijn verwachting aan de zijde van het participatiefonds zullen optreden als gevolg van de
      uitvoering van het voornemen, bedoeld in het eerste lid, aan Onze Minister zenden.
    url: https://wetten.overheid.nl/BWBR0008102/2006-09-20#Artikel3
  - number: '3.3'
    text: |-
      Binnen drie weken na ontvangst van de in het tweede lid bedoelde begroting bericht Onze Minister aan het bestuur
      van het participatiefonds of hij de meerkosten aanvaardt. De uitvoering van het voornemen, bedoeld in het eerste
      lid, binnen de termijn van drie weken of nadien geldt als aanvaarding van een aanspraak van het participatiefonds
      op vergoeding van de meerkosten ten laste van ’s Rijks kas overeenkomstig de toegezonden begroting.
    url: https://wetten.overheid.nl/BWBR0008102/2006-09-20#Artikel3
  - number: '3.4'
    text: |-
      Indien Onze Minister binnen drie weken na ontvangst van de in het tweede lid bedoelde begroting aan het bestuur
      van het participatiefonds bericht de meerkosten niet te aanvaarden, treden Onze Minister en het bestuur van het
      participatiefonds met elkaar in overleg ten einde te bezien of moet worden overgegaan tot uitvoering van het
      voornemen, bedoeld in het eerste lid. De tweede volzin van het derde lid is niet van toepassing, indien het overleg
      niet tot overeenstemming leidt.
    url: https://wetten.overheid.nl/BWBR0008102/2006-09-20#Artikel3
  - number: '4.1'
    text: De statuten van het participatiefonds behoeven de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0008102/2006-09-20#Artikel4
  - number: '4.2'
    text: |-
      Onze Minister verleent de goedkeuring aan de statuten van het participatiefonds uitsluitend, indien deze statuten
      ten minste de volgende bepalingen bevatten:
    url: https://wetten.overheid.nl/BWBR0008102/2006-09-20#Artikel4
  - number: 4.2.a
    text: |-
      de bepaling dat het participatiefonds zich ten doel stelt de waarborgen te bieden, bedoeld
      in de [artikelen 184, eerste lid, van de WPO][ref1], [170, eerste lid, van de WEC][ref2] en
      [98b, eerste lid, van de WVO][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel184
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel170
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel98b
    url: https://wetten.overheid.nl/BWBR0008102/2006-09-20#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '184'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '170'
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 98b
  - number: 4.2.b
    text: |-
      de bepaling dat het bestuur van het participatiefonds wordt gevormd door vertegenwoordigers van de centrales,
      genoemd in [artikel 3, eerste lid, van het Overlegbesluit onderwijspersoneel][ref1], en de organisaties, genoemd in
      [artikel 24, eerste lid, van dat besluit][ref2], met uitzondering van het Werkgeversverbond Voortgezet Onderwijs;


      [ref1]: https://wetten.overheid.nl/BWBR0006446#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006446#Artikel24
    url: https://wetten.overheid.nl/BWBR0008102/2006-09-20#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006446
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0006446
        artikel: '24'
  - number: 4.2.c
    text: |-
      de bepaling dat het bestuur van het participatiefonds ten minste een maal per jaar overleg voert met Onze Minister
      of een door Onze Minister aan te wijzen vertegenwoordiger;
    url: https://wetten.overheid.nl/BWBR0008102/2006-09-20#Artikel4
  - number: 4.2.d
    text: |-
      de bepaling dat het participatiefonds is gehouden de aanwijzingen die Onze Minister geeft op
      grond van de [artikelen 188, eerste lid, van de WPO][ref1], [173, eerste lid, van de WEC][ref2] en
      [123b, eerste lid, van de WVO][ref3], zomede op grond van dit besluit, op te volgen;


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel188
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel173
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel123b
    url: https://wetten.overheid.nl/BWBR0008102/2006-09-20#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '188'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '173'
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 123b
  - number: 4.2.e
    text: |-
      de bepaling dat het participatiefonds Onze Minister alle inlichtingen verschaft, die noodzakelijk zijn voor het
      door Onze Minister uit te oefenen toezicht op het participatiefonds;
    url: https://wetten.overheid.nl/BWBR0008102/2006-09-20#Artikel4
  - number: 4.2.f
    text: |-
      de bepaling dat het participatiefonds in het kader van zijn taakuitoefening, bedoeld in onderdeel *a* , het bevoegd
      gezag bij reglement of anderszins verplichtingen van administratieve aard oplegt:
    url: https://wetten.overheid.nl/BWBR0008102/2006-09-20#Artikel4
  - number: 4.2.f.1°
    text: ten behoeve van de controle van de rechtmatigheid van de uitgaven van het participatiefonds,
    url: https://wetten.overheid.nl/BWBR0008102/2006-09-20#Artikel4
  - number: 4.2.f.2°
    text: |-
      ten behoeve van het verkrijgen van betrouwbare gegevens met betrekking tot het ontstaan van aanspraken op
      werkloosheidsuitkeringen of herplaatsingswachtgelden,
    url: https://wetten.overheid.nl/BWBR0008102/2006-09-20#Artikel4
  - number: 4.2.f.3°
    text: ten behoeve van de doelmatige uitvoering van de werkzaamheden door het participatiefonds,
    url: https://wetten.overheid.nl/BWBR0008102/2006-09-20#Artikel4
  - number: 4.2.f.4°
    text: ten behoeve van het voldoen aan verplichtingen van het participatiefonds uit hoofde van de wet of dit besluit;
    url: https://wetten.overheid.nl/BWBR0008102/2006-09-20#Artikel4
  - number: 4.2.f.5°
    text: ten behoeve van het vaststellen van de bijdrage die het bevoegd gezag aan het participatiefonds moet voldoen;
    url: https://wetten.overheid.nl/BWBR0008102/2006-09-20#Artikel4
  - number: 4.2.g
    text: |-
      de bepaling dat bij ontbinding of beëindiging van de werkzaamheden van het participatiefonds de bestemming van het
      bij liquidatie aanwezige vermogen wordt vastgesteld in overeenstemming met Onze Minister.
    url: https://wetten.overheid.nl/BWBR0008102/2006-09-20#Artikel4
  - number: '4.3'
    text: |-
      Bij de goedkeuring van besluiten van het bestuur van het participatiefonds tot wijziging van de statuten is het
      tweede lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0008102/2006-09-20#Artikel4
  - number: '4.4'
    text: |-
      Onze Minister onthoudt zijn goedkeuring aan een besluit van het bestuur van het participatiefonds tot wijziging
      van de statuten, indien een dergelijk besluit in strijd is met de wet of met dit besluit, dan wel in strijd
      is met het algemeen belang of niet is te verenigen met de waarborgen welke het participatiefonds zich ten doel
      stelt te bieden. Onze Minister kan aan een besluit van het bestuur van het participatiefonds tot wijziging van de
      statuten zijn goedkeuring onthouden, indien dat besluit naar zijn oordeel in strijd is met een door hem gegeven of
      voorgenomen aanwijzing, bedoeld in het tweede lid, onderdeel *d*.
    url: https://wetten.overheid.nl/BWBR0008102/2006-09-20#Artikel4
  - number: '5.1'
    text: |-
      De hoogte van de bijdrage, die voor de bevoegde gezagsorganen verschillend kan worden vastgesteld, behoeft de
      goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0008102/2006-09-20#Artikel5
  - number: '5.2'
    text: |-
      Onze Minister toetst of de door het participatiefonds voorgestelde hoogte van de bijdrage in een redelijke
      verhouding staat tot de uitgaven die het participatiefonds naar verwachting dient te doen met het oog op de
      uitoefening van zijn taak, bedoeld in [artikel 2][ref1]. Onze Minister hanteert daarbij de volgende criteria:


      [ref1]: https://wetten.overheid.nl/BWBR0008102#Artikel2
    url: https://wetten.overheid.nl/BWBR0008102/2006-09-20#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008102
        artikel: '2'
        hoofdstuk: I
  - number: 5.2.a
    text: |-
      de hoogte van de bijdrage dient de vaststelling mogelijk te maken van uitvoeringsregels die ten minste de
      continuïteit in het onderwijs en de onderwijsverzorging op aanvaardbaar niveau waarborgen, en
    url: https://wetten.overheid.nl/BWBR0008102/2006-09-20#Artikel5
  - number: 5.2.b
    text: de hoogte van de bijdrage belemmert het bevoegd gezag in het algemeen niet in de normale taakuitoefening.
    url: https://wetten.overheid.nl/BWBR0008102/2006-09-20#Artikel5
  - number: '5.3'
    text: |-
      De in het eerste lid bedoelde goedkeuring is niet vereist, indien de bijdrage niet meer dan 1 procentpunt
      hoger of lager is dan het percentage dat, met toepassing van de [artikelen 126, tweede lid, van de WPO][ref1],
      [121, tweede lid, van de WEC][ref2] en [84b, tweede lid, van de WVO][ref3] door Onze Minister met het oog op de
      vergoeding van de kosten van werkloosheidsuitkeringen of herplaatsingswachtgelden jaarlijks wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel126
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel121
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel84b
    url: https://wetten.overheid.nl/BWBR0008102/2006-09-20#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '126'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '121'
      - id: ref3
        bwb_id: BWBR0002399
        artikel: 84b
  - number: '6.1'
    text: |-
      Indien Onze Minister van oordeel is dat de waarborgen voor de kosten van werkloosheidsuitkeringen of
      herplaatsingswachtgelden onvoldoende zijn in verband met de goede voortgang van het onderwijs en de
      onderwijsverzorging, treedt hij onverwijld in overleg met het bestuur van het participatiefonds.
    url: https://wetten.overheid.nl/BWBR0008102/2006-09-20#Artikel6
  - number: '6.2'
    text: |-
      Indien dit overleg niet leidt tot overeenstemming over de waarborgen die het participatiefonds ten minste dient te
      bieden, geeft Onze Minister binnen twee maanden een of meer aanwijzingen aan het participatiefonds met betrekking
      tot de te bieden waarborgen.
    url: https://wetten.overheid.nl/BWBR0008102/2006-09-20#Artikel6
  - number: '6.3'
    text: |-
      In geval van toepassing van dit artikel is [artikel 3][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008102#Artikel3
    url: https://wetten.overheid.nl/BWBR0008102/2006-09-20#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008102
        artikel: '3'
        hoofdstuk: I
  - number: '7'
    text: |-
      Onze Minister verstrekt aan het participatiefonds alle inlichtingen die het in verband met zijn taakuitoefening
      behoeft, tenzij Onze Minister niet over de desbetreffende gegevens beschikt of de wet zich tegen het verstrekken
      van die gegevens verzet.
    url: https://wetten.overheid.nl/BWBR0008102/2006-09-20#Artikel7
  - number: '8.1'
    text: 'Het participatiefonds verstrekt uit eigen beweging en onverwijld aan Onze Minister:'
    url: https://wetten.overheid.nl/BWBR0008102/2006-09-20#Artikel8
  - number: 8.1.a
    text: |-
      een overzicht van de in [artikel 2][ref1] bedoelde waarborgen die het aan het bevoegd gezag biedt;


      [ref1]: https://wetten.overheid.nl/BWBR0008102#Artikel2
    url: https://wetten.overheid.nl/BWBR0008102/2006-09-20#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008102
        artikel: '2'
        hoofdstuk: I
  - number: 8.1.b
    text: alle relevante gegevens betreffende de vaststelling van de bijdrage;
    url: https://wetten.overheid.nl/BWBR0008102/2006-09-20#Artikel8
  - number: 8.1.c
    text: zijn jaarverslag;
    url: https://wetten.overheid.nl/BWBR0008102/2006-09-20#Artikel8
  - number: 8.1.d
    text: zijn begroting en jaarrekening;
    url: https://wetten.overheid.nl/BWBR0008102/2006-09-20#Artikel8
  - number: 8.1.e
    text: |-
      afschrift van de uitvoeringsregels, reglementen en voorwaarden die het opstelt met het oog op zijn taakuitoefening
      ten behoeve van het bevoegd gezag, zomede van alle overige berichten die het aan de bevoegde gezagsorganen zendt;
    url: https://wetten.overheid.nl/BWBR0008102/2006-09-20#Artikel8
  - number: 8.1.f
    text: |-
      in een voorkomend geval, de mededeling van zijn voornemen om over te gaan tot zijn ontbinding of tot beëindiging
      van zijn werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0008102/2006-09-20#Artikel8
  - number: '8.2'
    text: 'Het participatiefonds verstrekt aan Onze Minister tevens:'
    url: https://wetten.overheid.nl/BWBR0008102/2006-09-20#Artikel8
  - number: 8.2.a
    text: de gegevens met betrekking tot de door het bevoegd gezag opgegeven voorgenomen ontslagen;
    url: https://wetten.overheid.nl/BWBR0008102/2006-09-20#Artikel8
  - number: 8.2.b
    text: |-
      de gegevens met betrekking tot de door hem bekostigde werkloosheidsuitkeringen of herplaatsingswachtgelden, mede in
      relatie tot de reden voor het door het bevoegd gezag voorgenomen of geëffectueerde ontslag;
    url: https://wetten.overheid.nl/BWBR0008102/2006-09-20#Artikel8
  - number: 8.2.c
    text: |-
      de financiële gegevens met betrekking tot de van het bevoegd gezag ontvangen bijdrage en de aan het bevoegd gezag
      uitgekeerde vergoedingen;
    url: https://wetten.overheid.nl/BWBR0008102/2006-09-20#Artikel8
  - number: 8.2.d
    text: de financiële gegevens met betrekking tot zijn overige inkomsten;
    url: https://wetten.overheid.nl/BWBR0008102/2006-09-20#Artikel8
  - number: 8.2.e
    text: de financiële gegevens met betrekking tot de bestuurs- en apparaatskosten;
    url: https://wetten.overheid.nl/BWBR0008102/2006-09-20#Artikel8
  - number: 8.2.f
    text: de financiële gegevens met betrekking tot zijn reserves;
    url: https://wetten.overheid.nl/BWBR0008102/2006-09-20#Artikel8
  - number: 8.2.g
    text: |-
      de gegevens met betrekking tot de aard en het aantal van de door hem verrichte controles op juistheid van de
      ontvangen gegevens van het bevoegd gezag, alsmede de gegevens met betrekking tot de uitkomsten van deze controles;
    url: https://wetten.overheid.nl/BWBR0008102/2006-09-20#Artikel8
  - number: 8.2.h
    text: jaarlijks een overzicht van de door hem jegens derden aangegane financiële verplichtingen.
    url: https://wetten.overheid.nl/BWBR0008102/2006-09-20#Artikel8
  - number: '8.3'
    text: |-
      Onze Minister stelt na overleg met het participatiefonds nadere voorwaarden vast met betrekking tot de inhoud, vorm
      en frequentie van de verstrekking van gegevens, bedoeld in het tweede lid, en in artikel 7.
    url: https://wetten.overheid.nl/BWBR0008102/2006-09-20#Artikel8
  - number: '8.4'
    text: |-
      Het participatiefonds voert een zodanige administratie dat de in het eerste en tweede lid bedoelde gegevens tijdig
      kunnen worden verstrekt. Onze Minister kan zonodig nadere aanwijzingen ter zake geven.
    url: https://wetten.overheid.nl/BWBR0008102/2006-09-20#Artikel8
  - number: '8.5'
    text: |-
      Het participatiefonds geeft aan Onze Minister of aan een door Onze Minister daartoe gemachtigde, zo dikwijls als
      Onze Minister of de gemachtigde dat vordert, inzage in de boeken en bescheiden en toont de gelden en waarden welke
      door het participatiefonds worden beheerd of bewaard.
    url: https://wetten.overheid.nl/BWBR0008102/2006-09-20#Artikel8
  - number: '8.6'
    text: |-
      Het participatiefonds verstrekt desgevraagd kosteloos aan het Centraal Bureau voor de Statistiek gegevens ten
      behoeve van de statistiek.
    url: https://wetten.overheid.nl/BWBR0008102/2006-09-20#Artikel8
  - number: '9'
    text: |-
      Onze Minister draagt er zorg voor dat bij de intrekking van de aanwijzing van het participatiefonds als de
      rechtspersoon, bedoeld in de [artikelen 184, eerste lid, van de WPO][ref1], [170, eerste lid, van de WEC][ref2] en
      [98b, eerste lid, van de WVO][ref3], het participatiefonds de onder zijn beheer staande middelen, bestemd voor het
      verschaffen van de waarborgen, bedoeld in [artikel 2][ref4], aanwendt voor het doel waartoe die middelen aan het
      participatiefonds ter beschikking zijn gesteld, dan wel overdraagt aan de rechtspersoon die door Onze Minister als
      participatiefonds wordt aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel184
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel170
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel98b
      [ref4]: https://wetten.overheid.nl/BWBR0008102#Artikel2
    url: https://wetten.overheid.nl/BWBR0008102/2006-09-20#Artikel9
