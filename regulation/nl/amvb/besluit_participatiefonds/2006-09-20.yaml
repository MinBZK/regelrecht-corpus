preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister-President, Minister van Algemene Zaken, Onze Minister van Onderwijs, Cultuur en
    Wetenschappen, en de Staatssecretaris van Binnenlandse Zaken, J. Kohnstamm, van 3 november 1995, nr. 95024410/3683,
    directie Wetgeving en Juridische Zaken, gedaan mede namens Onze Minister van Landbouw, Natuurbeheer en Visserij;

    Gelet op artikel 116c, eerste lid, van de Wet op het basisonderwijs, artikel 111b, eerste lid, van de Interimwet op
    het speciaal onderwijs en het voortgezet speciaal onderwijs, artikel 123b, eerste lid, van de Wet op het voortgezet
    onderwijs, artikel 4.4.3, vierde lid, van de Wet educatie en beroepsonderwijs, artikel 64b, vierde lid, van de Wet
    op de onderwijsverzorging, artikel 1a, onderdeel d, van de Wet openbaarheid van bestuur en artikel 1a, eerste lid,
    onderdeel a, van de Wet Nationale ombudsman;

    Gezien het advies van de Onderwijsraad (advies van 15 september 1995, nr. OR 95000147/Alg.);

    De Raad van State gehoord (advies van 26 februari 1996, nr. W05.95.0608);

    Gezien het nader rapport van Onze Minister van Onderwijs, Cultuur en Wetenschappen, Onze Minister-President,
    Minister van Algemene Zaken, en de Staatssecretaris van Binnenlandse Zaken, J. Kohnstamm, van 12 juni 1996,
    nr. 96009288/3683, directie Wetgeving en Juridische Zaken, uitgebracht mede namens Onze Minister van Landbouw,
    Natuurbeheer en Visserij;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008102/2006-09-20#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Dit besluit verstaat onder: WPO: [Wet op het primair onderwijs][ref1]; WEC: [Wet op de expertisecentra][ref2];
      WVO: [Wet op het voortgezet onderwijs][ref3]; Onze Minister: Onze Minister van Onderwijs, Cultuur en
      Wetenschappen en, wat betreft het landbouwonderwijs, Onze Minister van Landbouw, Natuurbeheer en Visserij;
      het participatiefonds: de rechtspersoon, bedoeld in de [artikel 184, eerste lid, van de WPO][ref4],
      [170, eerste lid, van de WEC][ref5] en [98b, eerste lid, van de WVO][ref6]; het bevoegd gezag: het bevoegd
      gezag dat is aangesloten bij het participatiefonds op grond van [artikel 184, eerste lid, van de WPO][ref7],
      [170, eerste lid, van de WEC][ref8] of [98b, eerste lid, van de WVO][ref9]; bijdrage: door het bevoegd
      gezag op grond van [artikel 184, tweede lid, van de WPO][ref10], [170, tweede lid, van de WEC][ref11] of
      [98b, tweede lid van de WVO][ref12] aan het participatiefonds verschuldigde bijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003549
      [ref3]: https://wetten.overheid.nl/BWBR0002399
