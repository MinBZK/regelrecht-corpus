preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Economische Zaken van 24 juni 2008, nr. WJZ8070077;

    Gelet artikel 18a van de Elektriciteitswet 1998 en artikel 10e van de Gaswet;

    De Raad van State gehoord (advies van 9 juli 2008, nr. W10.08.0241/III);

    Gezien het nader rapport van Onze Minister van Economische Zaken van 11 juli 2008, nr. WJZ/8085772;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0024376/2010-09-15#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder erkend kredietbeoordelingsbureau: een kredietbeoordelingsbureau als bedoeld
      in [artikel 1 van het Besluit prudentiële regels Wft][ref1], dat ingevolge [artikel 88 van dat besluit][ref2]
      is erkend.


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020420#Artikel88
    url: https://wetten.overheid.nl/BWBR0024376/2010-09-15#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020420
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0020420
        artikel: '88'
  - number: '2.1'
    text: 'De netbeheerder voldoet aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0024376/2010-09-15#Artikel2
  - number: 2.1.a
    text: het bedrijfsresultaat voor rente en belasting gedeeld door de bruto rentelasten bedraagt ten minste 1,7;
    url: https://wetten.overheid.nl/BWBR0024376/2010-09-15#Artikel2
  - number: 2.1.b
    text: |-
      de som van de netto winst uit gewone bedrijfsuitoefening, afschrijvingen, amortisatie, latente belastingen, overige
      kostenposten waarvoor geen kasgeld noodzakelijk is en bruto rentelasten gedeeld door de bruto rentelasten bedraagt
      ten minste 2,5;
    url: https://wetten.overheid.nl/BWBR0024376/2010-09-15#Artikel2
  - number: 2.1.c
    text: |-
      de som van de netto winst uit gewone bedrijfsuitoefening, afschrijvingen, amortisatie, latente belastingen en
      overige kostenposten waarvoor geen kasgeld noodzakelijk is gedeeld door de totale schuld bedraagt ten minste 0,11;
    url: https://wetten.overheid.nl/BWBR0024376/2010-09-15#Artikel2
  - number: 2.1.d
    text: |-
      de totale schuld gedeeld door de som van de totale schuld en het eigen vermogen inclusief minderheidsbelangen en
      preferente aandelen is maximaal 0,7.
    url: https://wetten.overheid.nl/BWBR0024376/2010-09-15#Artikel2
  - number: '2.2'
    text: |-
      Bij het voldoen aan de in het eerste lid bedoelde eisen, worden in de berekening opgenomen de financiële
      verplichtingen van tot de groep behorende rechtspersonen en vennootschappen die ten laste kunnen komen van de tot
      de groep behorende netbeheerder.
    url: https://wetten.overheid.nl/BWBR0024376/2010-09-15#Artikel2
  - number: '2.3'
    text: |-
      Het eerste lid is niet van toepassing indien door een erkend kredietbeoordelingsbureau aan de netbeheerder een
      kredietkwaliteitstrap investeringswaardig is toegekend.
    url: https://wetten.overheid.nl/BWBR0024376/2010-09-15#Artikel2
  - number: '3'
    text: |-
      De netbeheerder voegt jaarlijks bij zijn afzonderlijke boekhouding, bedoeld in [artikel 32 van de Gaswet][ref1] en
      [artikel 43 van de Elektriciteitswet 1998][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel43
    url: https://wetten.overheid.nl/BWBR0024376/2010-09-15#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '32'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '43'
  - number: 3.a
    text: |-
      een overzicht waaruit blijkt dat de netbeheerder voldoet aan de in [artikel 2, eerste lid][ref1], gestelde eisen,
      of


      [ref1]: https://wetten.overheid.nl/BWBR0024376#Artikel2
    url: https://wetten.overheid.nl/BWBR0024376/2010-09-15#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0024376
        artikel: '2'
        paragraaf: '2'
  - number: 3.b
    text: |-
      een verklaring waaruit blijkt dat door een erkend kredietbeoordelingsbureau aan de netbeheerder een
      kredietkwaliteitstrap investeringswaardig is toegekend als bedoeld in [artikel 2, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024376#Artikel2
    url: https://wetten.overheid.nl/BWBR0024376/2010-09-15#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0024376
        artikel: '2'
        paragraaf: '2'
  - number: 3a.1
    text: |-
      In aanvulling op [artikel 2][ref1] beschikt een netbeheerder in het kader van het beheer van
      zijn netten vanaf het tijdstip waarop hij geen deel meer uitmaakt van een groep als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref2] waartoe ook een rechtspersoon of vennootschap behoort
      die in Nederland elektriciteit of gas produceert of levert of daarin handelt over een eigen vermogen inclusief
      minderheidsbelangen en preferente aandelen van ten minste 40 procent van de som van de totale schuld en het eigen
      vermogen inclusief minderheidsbelangen en preferente aandelen.


      [ref1]: https://wetten.overheid.nl/BWBR0024376#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0024376/2010-09-15#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0024376
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: 24b
  - number: 3a.2
    text: |-
      Bij het voldoen aan de in het eerste lid bedoelde eis, worden in de berekening opgenomen de financiële
      verplichtingen van de tot de groep behorende rechtspersonen en vennootschappen die ten laste kunnen komen van de
      tot de groep behorende netbeheerder.
    url: https://wetten.overheid.nl/BWBR0024376/2010-09-15#Artikel3a
  - number: 3a.3
    text: |-
      Mits wordt voldaan aan [artikel 2][ref1] kan een netbeheerder, in afwijking van het eerste lid, beschikken over
      een lager percentage eigen vermogen inclusief minderheidsbelangen en preferente aandelen, indien hij aantoont
      dat de verlaging van dat percentage volledig veroorzaakt wordt door de financiering van investeringen die worden
      gedaan na het tijdstip, bedoeld in het eerste lid, en die noodzakelijk zijn om te voldoen aan de bij of krachtens
      de [Elektriciteitswet 1998][ref2] en [Gaswet][ref3] aan hem opgedragen taken en verplichtingen om zijn netten in
      werking te hebben, te vernieuwen, te onderhouden en uit te breiden.


      [ref1]: https://wetten.overheid.nl/BWBR0024376#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009755
      [ref3]: https://wetten.overheid.nl/BWBR0011440
    url: https://wetten.overheid.nl/BWBR0024376/2010-09-15#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0024376
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009755
      - id: ref3
        bwb_id: BWBR0011440
  - number: 3a.4
    text: |-
      Het eerste en derde lid zijn niet van toepassing op netbeheerders die op 27 maart 2009 geen deel uitmaakten van
      een groep als bedoeld in [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1] waartoe ook een rechtspersoon of
      vennootschap behoort die in Nederland elektriciteit of gas produceert of levert of daarin handelt.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0024376/2010-09-15#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: '4'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0024376/2010-09-15#Artikel4
  - number: '5'
    text: 'Dit besluit wordt aangehaald als: Besluit financieel beheer netbeheerder.'
    url: https://wetten.overheid.nl/BWBR0024376/2010-09-15#Artikel5
