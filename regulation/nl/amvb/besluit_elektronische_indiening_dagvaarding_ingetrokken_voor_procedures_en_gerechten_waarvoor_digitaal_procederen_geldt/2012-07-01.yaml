preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Veiligheid en Justitie van 23 mei 2012, directie Wetgeving, nr. 263435;

    Gelet op artikel 125, derde lid, van het Wetboek van Burgerlijke Rechtsvordering;

    De Afdeling advisering van de Raad van State gehoord (advies van 6 juni 2012, nr. W03.12.0179/II);

    Gezien het nader rapport van Onze Minister van Veiligheid en Justitie van 25 juni 2012, nr. 277802;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0031726/2012-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'De eiser kan een exploot van dagvaarding ter griffie elektronisch indienen, indien:'
    url: https://wetten.overheid.nl/BWBR0031726/2012-07-01#Artikel1
  - number: 1.a
    text: |-
      het een zaak betreft inzake een geldvordering waarvan het beloop valt onder het bereik van
      [artikel 93 aanhef en onderdelen a of b van het Wetboek van Burgerlijke Rechtsvordering][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel93
    url: https://wetten.overheid.nl/BWBR0031726/2012-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '93'
  - number: 1.b
    text: |-
      het exploot van dagvaarding namens de eiser wordt ingediend door de deurwaarder die het exploot van dagvaarding
      heeft betekend.
    url: https://wetten.overheid.nl/BWBR0031726/2012-07-01#Artikel1
  - number: '2'
    text: |-
      Het indienen van een exploot van dagvaarding langs elektronische weg geschiedt op een vanwege de gerechten
      aangegeven wijze.
    url: https://wetten.overheid.nl/BWBR0031726/2012-07-01#Artikel2
  - number: '3'
    text: |-
      Met het oog op de betrouwbaarheid en vertrouwelijkheid gebruikt de indiener bij het elektronisch indienen van een
      exploot van dagvaarding een vanwege de gerechten aangewezen systeem voor gegevensverwerking dat:
    url: https://wetten.overheid.nl/BWBR0031726/2012-07-01#Artikel3
  - number: 3.a
    text: |-
      in staat is om de verzender te identificeren en na te gaan of een bericht authentiek is en daadwerkelijk afkomstig
      van de verzender;
    url: https://wetten.overheid.nl/BWBR0031726/2012-07-01#Artikel3
  - number: 3.b
    text: in staat is om te controleren of het bericht volledig is en niet onbevoegdelijk is gewijzigd, en
    url: https://wetten.overheid.nl/BWBR0031726/2012-07-01#Artikel3
  - number: 3.c
    text: volgens nationale en internationale standaarden voor informatiebeveiliging ingericht is.
    url: https://wetten.overheid.nl/BWBR0031726/2012-07-01#Artikel3
  - number: '4'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat aan de eisen uit [artikel 3 aanhef en onderdelen a en b][ref1]
      slechts is voldaan indien de eisen van betrouwbaarheid en vertrouwelijkheid van een door Onze Minister van
      Veiligheid en Justitie aangewezen niveau zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0031726#Artikel3
    url: https://wetten.overheid.nl/BWBR0031726/2012-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0031726
        artikel: '3'
  - number: '5'
    text: Dit besluit treedt in werking op het tijdstip waarop de Wet elektronische indiening dagvaarding in werking treedt.
    url: https://wetten.overheid.nl/BWBR0031726/2012-07-01#Artikel5
  - number: '6'
    text: 'Dit besluit wordt aangehaald als: Besluit elektronische indiening dagvaarding.'
    url: https://wetten.overheid.nl/BWBR0031726/2012-07-01#Artikel6
