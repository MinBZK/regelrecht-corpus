---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: rangschikkingsbesluit_natuurschoonwet_1928
regulatory_layer: AMVB
publication_date: '2021-01-21'
valid_from: '2024-01-01'
bwb_id: BWBR0004914
url: https://wetten.overheid.nl/BWBR0004914/2024-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Landbouw, Natuurbeheer en Visserij van 4 mei 1990, nr. J. 905759, Directie
    Juridische en Bedrijfsorganisatorische Zaken, gedaan mede namens de Staatssecretaris van Financiën;

    Gelet op de artikelen 1, derde lid, en 2, tweede lid, van de Natuurschoonwet 1928 (Stb. 1989, 252);

    De Raad van State gehoord (advies van 10 juli 1990, no. W11.90.0201);

    Gezien het nader rapport van de Staatssecretaris van Landbouw, Natuurbeheer en Visserij van 8 november 1990, nr. J.
    9013303, uitgebracht mede namens de Staatssecretaris van Financiën;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel1
  - number: 1.a
    text: |-
      landgoed: landgoed als bedoeld in [artikel 1, eerste lid, onderdeel a, van de Natuurschoonwet 1928][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001939#Artikel1
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001939
        artikel: '1'
  - number: 1.b
    text: 'houtopstanden: houtopstanden niet zijnde kweekgoed, kerstboomteelten, laagstamboomgaarden of snijgrienden;'
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel1
  - number: 1.c
    text: |-
      buitenplaats: onroerende zaak met daarop gelegen een in oorsprong versterkt huis, een kasteel, een buitenhuis
      of een landhuis, eventueel met bijgebouwen, met een architectonisch daarmee verbonden historische tuin of
      historisch park van ten minste één hectare waarvan de aanleg dateert van vóór 1900 en herkenbaar aanwezig
      is, indien dit complex, dan wel ten minste één van de onderdelen daarvan, een rijksmonument als bedoeld in
      [artikel 1.1 van de Erfgoedwet][ref1] is;


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel1
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0037521
        artikel: '1'
  - number: 1.d
    text: 'natuurterrein: terrein bestaande uit bij ministeriële regeling aangewezen natuurtypen of landschapselementtypen;'
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel1
  - number: 1.e
    text: 'Onze Ministers: Onze Ministers van Landbouw, Natuur en Voedselkwaliteit en van Financiën;'
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel1
  - number: 1.f
    text: |-
      economische eigendom: economische eigendom als bedoeld in
      [artikel 1, eerste lid, onderdeel c, van de Natuurschoonwet 1928][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001939#Artikel1
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001939
        artikel: '1'
  - number: '2.1'
    text: 'Om als een landgoed te kunnen worden aangemerkt, dient een onroerende zaak te voldoen aan de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel2
  - number: 2.1.a
    text: de oppervlakte van de onroerende zaak bedraagt ten minste 5 hectare;
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel2
  - number: 2.1.b
    text: terreinen en wateren behorende tot de onroerende zaak vormen een aaneengesloten gebied;
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel2
  - number: 2.1.c
    text: de oppervlakte van de onroerende zaak is voor ten minste 30 percent bezet met houtopstanden of natuurterreinen en
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel2
  - number: 2.1.d
    text: het soort gebruik dat van de onroerende zaak wordt gemaakt, maakt geen inbreuk op het natuurschoon.
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel2
  - number: '2.2'
    text: |-
      Voor zover tot de onroerende zaak behorende terreinen, opstallen of wateren, of het soort gebruik dat daarvan wordt
      gemaakt, inbreuk maken op het natuurschoon, worden die terreinen, die opstallen en die wateren niet gerekend tot de
      als landgoed aan te merken onroerende zaak.
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel2
  - number: '2.3'
    text: |-
      De terreinen en wateren behorende tot een onroerende zaak worden mede als een aaneengesloten gebied aangemerkt,
      indien:
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel2
  - number: 2.3.a
    text: 'de terreinen en wateren gescheiden worden door:'
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel2
  - number: 2.3.a.1°
    text: onverharde wegen,
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel2
  - number: 2.3.a.2°
    text: verharde wegen niet breder dan vijf meter,
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel2
  - number: 2.3.a.3°
    text: waterlopen niet breder dan 25 meter, of
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel2
  - number: 2.3.a.4°
    text: niet-geëlektrificeerde enkelsporen; of
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel2
  - number: 2.3.b
    text: |-
      de terreinen en wateren gescheiden worden door een weg, dijk, spoorweg of waterloop, voor zover er een
      landschappelijke of functionele samenhang is tussen de terreinen en deze samenhang herkenbaar aanwezig is, of voor
      zover er een nauwe historische band bestaat tussen de terreinen.
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel2
  - number: '2.4'
    text: |-
      Voor de toepassing van het eerste lid, onderdeel *c*, worden tot de met houtopstanden bezette
      oppervlakte van de onroerende zaak mede gerekend kapvlakten, waarop een herplantplicht rust ingevolge de
      [afdeling 11.3 van het Besluit activiteiten leefomgeving][ref1] en welke niet groter zijn dan 15 percent van
      de oppervlakte van de met houtopstanden bezette terreinen tot ten hoogste 5 hectare, met dien verstande dat een
      kapvlakte van 0,5 hectare of minder wordt aangemerkt als een met houtopstanden bezet terrein.


      [ref1]: https://wetten.overheid.nl/BWBR0041330#Afdeling11.3
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0041330
        afdeling: '11.3'
  - number: '2.5'
    text: |-
      Voor de toepassing van het eerste lid, onderdeel c, worden tot de met natuurterreinen bezette oppervlakte van
      de onroerende zaak uitsluitend natuurterreinen gerekend die zelfstandig dan wel gezamenlijk met direct hieraan
      grenzende houtopstanden een aaneengesloten oppervlakte van ten minste 0,5 hectare hebben.
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel2
  - number: 2a
    text: |-
      Een onroerende zaak als bedoeld in
      [artikel 1, eerste lid, onderdeel a, aanhef en onder 2°, van de Natuurschoonwet 1928][ref1] vormt een element van
      het Nederlands cultureel erfgoed, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0001939#Artikel1
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0001939
        artikel: '1'
  - number: 2a.a
    text: 'de onroerende zaak cultuurhistorische waarde heeft, omdat:'
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel2a
  - number: 2a.a.1°
    text: |-
      de onroerende zaak of een wezenlijk onderdeel daarvan een bijzondere uitdrukking is van een voor Nederland
      kenmerkende culturele, sociaal-economische, bestuurlijke, beleidsmatige of geestelijke ontwikkeling;
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel2a
  - number: 2a.a.2°
    text: |-
      de onroerende zaak of een wezenlijk onderdeel daarvan een bijzondere uitdrukking is van een geografische,
      landschappelijke of historisch-ruimtelijke ontwikkeling, die evident verband houdt met de Nederlandse geschiedenis;
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel2a
  - number: 2a.a.3°
    text: |-
      de onroerende zaak of een wezenlijk onderdeel daarvan een bijzondere uitdrukking is van een technische of
      typologische ontwikkeling, die haar oorsprong heeft in Nederland of waarvan de ontwikkelaar een Nederlander is die
      van betekenis is geweest voor Nederland;
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel2a
  - number: 2a.a.4°
    text: |-
      de onroerende zaak of een wezenlijk onderdeel daarvan een bijzondere innovatieve waarde of pionierskarakter heeft,
      waarbij deze vernieuwing haar oorsprong heeft in Nederland; of
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel2a
  - number: 2a.a.5°
    text: |-
      de onroerende zaak of een wezenlijk onderdeel daarvan een bijzondere herinneringswaarde heeft door zijn
      verbondenheid met een historische episode die van groot belang is voor de Nederlandse geschiedenis; of
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel2a
  - number: 2a.b
    text: 'de onroerende zaak architectonische en kunsthistorische waarde heeft, omdat:'
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel2a
  - number: 2a.b.1°
    text: |-
      de onroerende zaak of een wezenlijk onderdeel daarvan van belang is voor de geschiedenis van de Nederlandse
      architectuur of Nederlandse bouwtechniek; of
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel2a
  - number: 2a.b.2°
    text: |-
      de onroerende zaak of een wezenlijk onderdeel daarvan tot het oeuvre van een Nederlandse bouwmeester, architect,
      ingenieur of kunstenaar behoort dat voor een belangrijk deel in Nederland tot stand kwam.
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel2a
  - number: '3.1'
    text: |-
      [Artikel 2, eerste lid, onderdeel a][ref1], is niet van toepassing op een buitenplaats of een deel daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0004914#Artikel2
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004914
        artikel: '2'
  - number: '3.2'
    text: |-
      [Artikel 2, eerste lid, onderdeel c][ref1], is niet van toepassing op een buitenplaats met een oppervlakte van
      minder dan vijf hectare of een deel daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0004914#Artikel2
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004914
        artikel: '2'
  - number: '3.3'
    text: |-
      [Artikel 2, eerste lid, onderdelen a en c][ref1], is niet van toepassing op een onroerende zaak met een oppervlakte
      van minder dan vijf hectare doch groter dan één hectare, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0004914#Artikel2
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004914
        artikel: '2'
  - number: 3.3.a
    text: |-
      de onroerende zaak grenst aan een onroerende zaak die als landgoed is aangemerkt en de oppervlakte van beide
      onroerende zaken gezamenlijk ten minste vijf hectare bedraagt, of de onroerende zaak met één aangrenzende nog niet
      als landgoed aangemerkte onroerende zaak, gezamenlijk een oppervlakte van ten minste vijf hectare heeft;
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel3
  - number: 3.3.b
    text: tussen beide onroerende zaken een nauwe historische band bestaat; en
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel3
  - number: 3.3.c
    text: |-
      de oppervlakte van de onroerende zaak voor ten minste 50 percent bezet is met natuurterreinen die voldoen aan
      [artikel 2, vijfde lid][ref1], of houtopstanden.


      [ref1]: https://wetten.overheid.nl/BWBR0004914#Artikel2
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004914
        artikel: '2'
  - number: '3.4'
    text: |-
      [Artikel 2, eerste lid, onderdelen a en c][ref1], is niet van toepassing op een onroerende zaak met een oppervlakte
      van ten hoogste één hectare, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0004914#Artikel2
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004914
        artikel: '2'
  - number: 3.4.a
    text: |-
      op de onroerende zaak een opstal is gelegen die vóór 1 januari 1950 is gebouwd en die na deze datum uiterlijk zijn
      karakter heeft behouden;
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel3
  - number: 3.4.b
    text: |-
      de onroerende zaak grenst aan een onroerende zaak die als landgoed is aangemerkt en de oppervlakte van beide
      onroerende zaken gezamenlijk ten minste vijf hectare bedraagt;
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel3
  - number: 3.4.c
    text: |-
      een nauwe historische band bestaat tussen de opstal, bedoeld in onderdeel a, en de onroerende zaak die als landgoed
      is aangemerkt, bedoeld in onderdeel b; en
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel3
  - number: 3.4.d
    text: |-
      de onroerende zaak bezwaard is met een beperkt recht van vruchtgebruik of erfpacht en de hoofdgerechtigde van die
      onroerende zaak eigenaar is van de onroerende zaak die is aangemerkt als landgoed als bedoeld in onderdeel b.
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel3
  - number: '3.5'
    text: |-
      Opstallen, gelegen op onroerende zaken met een oppervlakte van minder dan vijf hectare die met toepassing van het
      eerste, derde of vierde lid als landgoed kunnen worden aangemerkt, maken slechts deel uit van het landgoed voor
      zover het betreft:
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel3
  - number: 3.5.a
    text: |-
      rijksmonumenten als bedoeld in [artikel 1.1 van de Erfgoedwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel1
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0037521
        artikel: '1'
  - number: 3.5.b
    text: |-
      opstallen voor het technisch beheer van het landgoed, ongeschikt voor verblijf, met een oppervlakte van ten hoogste
      20 m2 en een nokhoogte van ten hoogste 3 meter; of,
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel3
  - number: 3.5.c
    text: |-
      opstallen die vóór 1 januari 1950 zijn gebouwd en die na deze datum uiterlijk hun karakter hebben behouden, voor
      zover een nauwe historische band bestaat tussen de opstal en het landgoed.
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel3
  - number: '3.6'
    text: |-
      In afwijking van [artikel 2, eerste lid, onderdeel c][ref1], kan een onroerende zaak waarop een of meer golfbanen
      zijn gelegen, slechts als landgoed worden aangemerkt, indien de oppervlakte van iedere golfbaan voor ten minste 50
      percent is bezet met natuurterreinen die voldoen aan artikel 2, vijfde lid, of met houtopstanden, en het overige
      deel van de onroerende zaak, indien van toepassing, voor ten minste 30 percent is bezet met natuurterreinen die
      voldoen aan artikel 2, vijfde lid, of met houtopstanden.


      [ref1]: https://wetten.overheid.nl/BWBR0004914#Artikel2
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004914
        artikel: '2'
  - number: '3.7'
    text: |-
      In afwijking van [artikel 2, eerste lid, onderdeel c][ref1], kan een onroerende zaak, die nog niet voor ten minste
      30 percent van de oppervlakte bestaat uit houtopstanden of natuurterreinen, en in afwijking van het derde lid,
      onderdeel c, en het zesde lid, kan een onroerende zaak die nog niet voor ten minste 50 percent van de oppervlakte
      bestaat uit houtopstanden of natuurterreinen, als landgoed worden aangemerkt, indien, blijkens een beplantingsplan
      en blijkens het begin van de feitelijke uitvoering daarvan, het voornemen bestaat om de onroerende zaak in
      voldoende mate met houtopstanden te bezetten, mits de onroerende zaak naar het oordeel van Onze Ministers na afloop
      van de in [artikel 3a, eerste lid, van de Natuurschoonwet 1928][ref2] genoemde termijn aan alle voorwaarden voor
      aanmerking als landgoed zal voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0004914#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001939#Artikel3a
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004914
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001939
        artikel: 3a
  - number: '3.8'
    text: |-
      Het in het vierde lid, onderdeel a, het vijfde lid, onderdeel c, en [artikel 5, eerste lid, onderdeel d][ref1],
      genoemde jaartal wordt telkens na het verstrijken van een periode van tien jaren na 1 juni 2017 met tien jaren
      verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0004914#Artikel5
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004914
        artikel: '5'
  - number: 3a
    text: |-
      De hoofdgerechtigde van een onroerende zaak die de onroerende zaak heeft bezwaard met het beperkt recht van
      erfpacht zonder de economische eigendom over te dragen wordt aangemerkt als de eigenaar van die onroerende zaak,
      indien die onroerende zaak een oppervlakte heeft van minder dan vijf hectaren.
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel3a
  - number: '4'
    text: |-
      Als inbreuk makend op het natuurschoon, bedoeld in [artikel 2, tweede lid][ref1], wordt in ieder geval beschouwd
      de omstandigheid dat terreinen en opstallen op die terreinen die tot de onroerende zaak behoren, zijn ingericht of
      worden gebruikt:


      [ref1]: https://wetten.overheid.nl/BWBR0004914#Artikel2
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004914
        artikel: '2'
  - number: 4.a
    text: voor industriële doeleinden;
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel4
  - number: 4.b
    text: voor intensieve veehouderij;
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel4
  - number: 4.c
    text: voor winning van bodemmaterialen of mijnbouw;
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel4
  - number: 4.d
    text: voor glastuinbouw;
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel4
  - number: 4.e
    text: als stortplaats voor afval;
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel4
  - number: 4.f
    text: |-
      als opslagplaats voor andere materialen dan die afkomstig uit of bestemd voor de land- en bosbouw op de onroerende
      zaak;
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel4
  - number: 4.g
    text: voor auto- of motorsport;
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel4
  - number: 4.h
    text: |-
      voor intensieve dag- of verblijfsrecreatie anders dan terreinen die zijn ingericht met inachtneming van het
      bepaalde in [artikel 6, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004914#Artikel6
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004914
        artikel: '6'
  - number: '5.1'
    text: |-
      Onverminderd het bepaalde in [artikel 4][ref1] wordt als inbreuk makend op het natuurschoon, bedoeld in
      [artikel 2, tweede lid][ref2], in ieder geval niet beschouwd de omstandigheid dat op de onroerende zaak:


      [ref1]: https://wetten.overheid.nl/BWBR0004914#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004914#Artikel2
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004914
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0004914
        artikel: '2'
  - number: 5.1.a
    text: parken of tuinen zijn gelegen, die behoren bij een buitenplaats;
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel5
  - number: 5.1.b
    text: |-
      landschappelijk aangelegde parken of landschapsstructuren die vanouds behoren bij een buitenplaats zijn
      gelegen, waarvan de aanleg dateert van vóór 1900 en herkenbaar aanwezig is, en voorts op die onroerende zaak een
      rijksmonument als bedoeld in [artikel 1.1 van de Erfgoedwet][ref1] is gelegen;


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel1
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0037521
        artikel: '1'
  - number: 5.1.c
    text: |-
      terreinen zijn gelegen, die vanouds het vrije uitzicht mogelijk maken op of vanuit een op die onroerende zaak
      gelegen opstal daterend van vóór 1900, voor zover die terreinen aan weerszijden worden begrensd door houtopstanden;
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel5
  - number: 5.1.d
    text: |-
      opstallen zijn gelegen, die vóór 1 januari 1950 zijn gebouwd en die na de genoemde datum uiterlijk hun karakter
      hebben behouden;
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel5
  - number: 5.1.e
    text: |-
      andere opstallen dan die bedoeld in onderdeel *d* zijn gelegen, indien zij grotendeels functioneel zijn voor de
      instandhouding of voor het beheer van de onroerende zaak, en die, ingeval zij door hun verschijningsvorm inbreuk
      maken op het natuurschoon, aan het oog zijn onttrokken door beplanting;
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel5
  - number: 5.1.f
    text: waterpartijen voorkomen, dan wel waterlopen die noodzakelijk zijn voor de waterhuishouding van de onroerende zaak;
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel5
  - number: 5.1.g
    text: 'terreinen zijn gelegen, die worden gebruikt voor de landbouw voor zover elk van die terreinen:'
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel5
  - number: 5.1.g.1°
    text: |-
      ten hoogste een oppervlakte van 5 hectare heeft, of, zo dit meer is, die oppervlakte niet meer bedraagt dan 5
      percent van de oppervlakte van de onroerende zaak tot een maximale oppervlakte van 20 hectare, en de omtrek van dat
      terrein voor ten minste 75 percent is omgeven door houtopstanden, dan wel de omtrek van dat terrein voor ten minste
      50 percent is omgeven door een nagenoeg aaneengesloten houtopstand en voorts visueel van de aangrenzende terreinen
      is gescheiden door een of meer bomen die bepalend zijn voor het landschap; en
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel5
  - number: 5.1.g.2°
    text: |-
      tezamen met een of meer aangrenzende, niet door houtopstanden gescheiden, voor de landbouw gebruikte terreinen
      ten hoogste een oppervlakte van 20 hectare heeft en de gezamenlijke omtrek van die terreinen voor 100 percent is
      omgeven door houtopstanden;
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel5
  - number: 5.1.h
    text: |-
      parkeerterreinen van beperkte omvang zijn gelegen, voor zover deze zijn bestemd voor gebruik door de eigenaar, door
      de gebruiker of door de bezoekers van de onroerende zaak;
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel5
  - number: 5.1.i
    text: |-
      terreinen zijn gelegen die worden gebruikt voor de landbouw die als gevolg van bij of krachtens wet geldende
      beperkingen niet geheel omgeven kunnen worden door houtopstanden, voor zover elk van die terreinen:
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel5
  - number: 5.1.i.1°
    text: ten hoogste een oppervlakte van 5 hectare heeft; en
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel5
  - number: 5.1.i.2°
    text: |-
      voor ten minste 75 percent van de omtrek is omgeven door houtopstanden en waar dit niet is toegestaan, door
      natuurterreinen, waarbij het deel van de omzoming dat uit natuurterreinen bestaat minimaal 5 meter breed is; of
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel5
  - number: 5.1.j
    text: |-
      terreinen zijn gelegen die worden gebruikt voor de landbouw waarvoor geen bij of krachtens wet opgelegde
      beperkingen gelden voor het omgeven met houtopstanden, voor zover:
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel5
  - number: 5.1.j.1°
    text: 'elk van de terreinen:'
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel5
  - number: 5.1.j.1°.i
    text: ten hoogste een oppervlakte van 5 hectare heeft; en
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel5
  - number: 5.1.j.1°.ii
    text: voor ten minste 75 percent van de omtrek is omgeven door houtopstanden of natuurterreinen; en
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel5
  - number: 5.1.j.2°
    text: 'voor zover de terreinen voor een deel omgeven worden door natuurterreinen:'
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel5
  - number: 5.1.j.2°.i
    text: |-
      de eigenaar aannemelijk maakt dat het met natuurterreinen omgeven meer bijdraagt aan natuurdoelstellingen die voor
      het gebied gelden op grond van een besluit van bestuursorganen van het Rijk, een provincie, een gemeente of een
      waterschap dan houtopstanden zouden bijdragen; en
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel5
  - number: 5.1.j.2°.ii
    text: het deel van de omzoming dat uit natuurterreinen bestaat minimaal 5 meter breed is.
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel5
  - number: '5.2'
    text: |-
      Onder in het eerste lid, onderdelen g, i en j, bedoelde houtopstanden worden mede begrepen houtopstanden die niet
      zijn gelegen op de onroerende zaak zelf maar daaraan direct grenzen.
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel5
  - number: '6.1'
    text: |-
      Als inbreuk makend op het natuurschoon, bedoeld in [artikel 2, tweede lid][ref1], wordt niet beschouwd de
      omstandigheid dat op de onroerende zaak een of meer kampeerterreinen zijn gelegen, mits er per oppervlakte van 25
      hectare ten hoogste één kampeerterrein is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0004914#Artikel2
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004914
        artikel: '2'
  - number: '6.2'
    text: |-
      Voor de toepassing van het eerste lid wordt onder kampeerterrein verstaan een terrein dat is ingericht of kennelijk
      duurzaam wordt gebruikt voor het kamperen en:
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel6
  - number: 6.2.a
    text: waarvan de oppervlakte niet groter is dan 1 hectare;
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel6
  - number: 6.2.b
    text: dat niet is gelegen op een natuurterrein, dan wel in een historisch park of in een historische tuin;
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel6
  - number: 6.2.c
    text: dat op meer dan 500 meter van een ander kampeerterrein op die onroerende zaak is gelegen;
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel6
  - number: 6.2.d
    text: |-
      waarop geen andere voorzieningen zijn aangebracht dan die voor de toevoer van gas, electriciteit en water en voor
      sanitaire behoeften;
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel6
  - number: 6.2.e
    text: waarop geen vaste standplaatsen zijn aangelegd.
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel6
  - number: '7.1'
    text: |-
      Een verzoek aan Onze Ministers om een onroerende zaak aan te merken als een landgoed wordt ingediend met
      gebruikmaking van een daartoe bestemd formulier en bevat ten minste:
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel7
  - number: 7.1.a
    text: |-
      een overzicht van de als landgoed aan te merken kadastrale percelen, waarbij per perceel de (geschatte) oppervlakte
      wordt vermeld;
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel7
  - number: 7.1.b
    text: 'een beschrijving van:'
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel7
  - number: 7.1.b.1°
    text: de vanuit het oogpunt van natuurschoon kenmerkende structuren en elementen van de onroerende zaak;
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel7
  - number: 7.1.b.2°
    text: |-
      de hoedanigheid van de terreinen, de opstallen en het soort gebruik dat van die terreinen en van die opstallen
      wordt gemaakt; en
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel7
  - number: 7.1.b.3°
    text: de historische ontwikkeling van de onroerende zaak.
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel7
  - number: '7.2'
    text: 'Bij het verzoek worden in ieder geval overgelegd:'
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel7
  - number: 7.2.a
    text: actuele uittreksels uit de basisregistratie kadaster die op de onroerende zaak betrekking hebben;
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel7
  - number: 7.2.b
    text: kleurenfoto’s van de opstallen;
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel7
  - number: 7.2.c
    text: |-
      een topografische kaart van de onroerende zaak, waarop de in het eerste lid, onderdeel b, onder 1° en 2°, bedoelde
      gegevens zijn aangegeven;
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel7
  - number: 7.2.d
    text: |-
      voor zover het betreft een aanvraag ten aanzien van een onroerende zaak als bedoeld in
      [artikel 3, eerste, tweede of vijfde lid, onderdeel a][ref1], een afschrift van de beschikking waarbij de
      onroerende zaak is aangewezen als rijksmonument als bedoeld in [artikel 1.1 van de Erfgoedwet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0004914#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037521#Artikel1
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004914
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0037521
        artikel: '1'
  - number: 7.2.e
    text: |-
      in geval een verzoek wordt gedaan om de onroerende zaak aan te merken als een landgoed met toepassing van
      [artikel 3, derde of vierde lid][ref1], bewijsstukken waaruit de nauwe historische band als bedoeld in deze
      artikelleden en, indien van toepassing, [artikel 3, vijfde lid][ref2], blijkt;


      [ref1]: https://wetten.overheid.nl/BWBR0004914#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004914#Artikel3
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004914
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0004914
        artikel: '3'
  - number: 7.2.f
    text: |-
      voor zover het betreft een aanvraag ten aanzien van een onroerende zaak als bedoeld in
      [artikel 1, eerste lid, onderdeel a, aanhef en onder 2°, van de Natuurschoonwet 1928][ref1], bewijsstukken
      en kopieën van de literatuur en documentatie waaruit blijkt dat het landgoed een element is van het Nederlands
      cultureel erfgoed, bedoeld in [artikel 2a][ref2]. De aanvrager verstrekt Onze Ministers op hun verzoek een door een
      beëdigde vertaler gemaakte vertaling van de ingediende documenten;


      [ref1]: https://wetten.overheid.nl/BWBR0001939#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004914#Artikel2a
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001939
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0004914
        artikel: 2a
  - number: 7.2.g
    text: |-
      ingeval een verzoek wordt gedaan om de onroerende zaak aan te merken als een landgoed met toepassing van
      [artikel 5, eerste lid, onderdeel i][ref1], bewijsstukken waaruit blijkt dat er bij of krachtens wet opgelegde
      beperkingen zijn die het voor een eigenaar niet mogelijk maken om te voldoen aan artikel 5, eerste lid, onderdeel
      g, onder 1°; en


      [ref1]: https://wetten.overheid.nl/BWBR0004914#Artikel5
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004914
        artikel: '5'
  - number: 7.2.h
    text: |-
      ingeval een verzoek wordt gedaan om de onroerende zaak aan te merken als een landgoed met toepassing van
      [artikel 5, eerste lid, onderdeel j][ref1], bewijsstukken waaruit blijkt dat op grond van besluiten van
      bestuursorganen van het Rijk, een provincie, een gemeente of een waterschap, natuurterreinen, waarmee de voor
      landbouw gebruikte terreinen zijn omgeven, meer dan houtopstanden bijdragen aan de natuurdoelstellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004914#Artikel5
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004914
        artikel: '5'
  - number: '7.3'
    text: |-
      Een verzoek om een onroerende zaak als landgoed aan te merken met toepassing van [artikel 3, derde lid][ref1],
      wordt ingediend tezamen met het verzoek van de eigenaar van de in dat lid bedoelde nog niet als landgoed
      aangemerkte aangrenzende onroerende zaak om die zaak als landgoed aan te merken. Bij de verzoeken wordt tevens
      een gezamenlijke verklaring van de eigenaren van de onroerende zaken gevoegd, waarin zij om toepassing van
      [artikel 3, derde lid][ref2], verzoeken. Indien beide onroerende zaken ieder een oppervlakte van minder dan
      5 hectare hebben en één van de gezamenlijk ingediende verzoeken wordt afgewezen, wordt ook het andere verzoek
      afgewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0004914#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004914#Artikel3
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004914
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0004914
        artikel: '3'
  - number: '7.4'
    text: |-
      Bij een verzoek om een onroerende zaak als landgoed aan te merken met toepassing van [artikel 3, zesde lid][ref1],
      worden tevens overgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0004914#Artikel3
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004914
        artikel: '3'
  - number: 7.4.a
    text: een beplantingsplan, waarvan het model door Onze Ministers wordt vastgesteld; en
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel7
  - number: 7.4.b
    text: |-
      een duidelijke kaart of plattegrond, waarop de tot de onroerende zaak behorende percelen die geheel of gedeeltelijk
      met houtopstanden bezet zullen worden, zijn aangegeven, onder vermelding van de kadastrale nummers.
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel7
  - number: '7.5'
    text: |-
      Indien met betrekking tot een onroerende zaak regelen als bedoeld
      [artikel 7, eerste lid, van de Natuurschoonwet 1928][ref1] inzake openstelling voor het publiek ter goedkeuring aan
      Onze Ministers worden voorgelegd, worden bij het verzoek tot goedkeuring op een afzonderlijke topografische kaart
      de wegen en paden die voor het publiek toegankelijk zijn en de totale lengte van deze wegen en paden in meters,
      alsmede de plaatsaanduiding van de toegangsborden, aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0001939#Artikel7
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001939
        artikel: '7'
  - number: '7.6'
    text: |-
      De topografische kaart, bedoeld in het tweede lid, onderdeel c, onderscheidenlijk vijfde lid, heeft een schaal van
      1 : 10.000, met dien verstande dat voor een onroerende zaak kleiner dan vijf hectare de schaal 1 : 2500 bedraagt.
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel7
  - number: '7.7'
    text: |-
      Bij regeling van Onze Ministers kan worden afgeweken van het eerste en tweede lid ten aanzien van bij die regeling
      aangewezen categorieën van verzoeken.
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel7
  - number: '7.8'
    text: |-
      Onze Ministers besluiten binnen een termijn van zestien weken na ontvangst van het verzoek, bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel7
  - number: '8'
    text: |-
      De voorwaarden, bedoeld in [artikel 220d, eerste lid, onderdeel d, van de Gemeentewet][ref1], zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel220d
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 220d
  - number: 8.a
    text: ten minste 30 percent van de oppervlakte van het landgoed is bezet met houtopstanden; of
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel8
  - number: 8.b
    text: |-
      de oppervlakte van het landgoed is voor ten minste 20 percent met houtopstanden bezet waarbij de oppervlakte voorts
      voor ten minste 50 percent bestaat uit natuurterreinen.
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel8
  - number: '9.1'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel9
  - number: '9.2'
    text: 'Dit besluit kan worden aangehaald als: Rangschikkingsbesluit Natuurschoonwet 1928.'
    url: https://wetten.overheid.nl/BWBR0004914/2024-01-01#Artikel9
