---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_mestbassins_milieubeheer
regulatory_layer: AMVB
publication_date: '2012-10-01'
valid_from: '2010-10-01'
bwb_id: BWBR0004990
url: https://wetten.overheid.nl/BWBR0004990/2010-10-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 7 november
    1989, Centrale Directie Juridische Zaken, afdeling Wetgeving, nr. MJZ07n89053, gedaan in overeenstemming met Onze
    Minister van Landbouw en Visserij en de Staatssecretaris van Sociale Zaken en Werkgelegenheid;

    Gelet op de artikelen 2a en 30e van de Hinderwet (Stb. 1981, 410);

    De Raad van State gehoord (advies van 3 mei 1990, no. W08.89.0684);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer 12 december
    1990, Centrale Directie Juridische Zaken, afdeling Wetgeving, nr. MJZ12d90014, uitgebracht in overeenstemming met
    Onze Minister van Landbouw, Natuurbeheer en Visserij en Onze Minister van Sociale Zaken en Werkgelegenheid;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004990/2010-10-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004990/2010-10-01#Artikel1
  - number: 1.1.a
    text: |-
      inrichting: een inrichting die behoort tot een krachtens [artikel 1.1, derde lid, van de Wet milieubeheer][ref1]
      aangewezen categorie;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0004990/2010-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
  - number: 1.1.b
    text: 'bewaren van dunne mest: het bewaren van dunne mest in één of meer bassins, voor zover:'
    url: https://wetten.overheid.nl/BWBR0004990/2010-10-01#Artikel1
  - number: 1.1.b.1°
    text: de gezamenlijke oppervlakte van de in de inrichting aanwezige bassins niet meer bedraagt dan 750 m²;
    url: https://wetten.overheid.nl/BWBR0004990/2010-10-01#Artikel1
  - number: 1.1.b.2°
    text: de gezamenlijke inhoud van de in de inrichting aanwezige bassins niet meer bedraagt dan 2500 m3;
    url: https://wetten.overheid.nl/BWBR0004990/2010-10-01#Artikel1
  - number: 1.1.b.3°
    text: |-
      er in de bassins geen beluchting, geforceerde vergisting of een andere be- of verwerking van dunne mest
      plaatsvindt, behoudens mengen of roeren;
    url: https://wetten.overheid.nl/BWBR0004990/2010-10-01#Artikel1
  - number: 1.1.c
    text: |-
      dunne mest: mest die verpompbaar is en die bestaat uit faeces of urine van landbouwhuisdieren, al dan niet vermengd
      met mors-, spoel-, reinigings- of regenwater;
    url: https://wetten.overheid.nl/BWBR0004990/2010-10-01#Artikel1
  - number: 1.1.d
    text: |-
      bassin: een reservoir bestemd en geschikt voor het bewaren van dunne mest, dat niet geheel of gedeeltelijk is
      gelegen onder een stal en dat tot stand is gebracht na 1 juni 1987;
    url: https://wetten.overheid.nl/BWBR0004990/2010-10-01#Artikel1
  - number: 1.1.e
    text: 'woning: een gebouw of een deel van een gebouw, dat voor bewoning wordt gebruikt of daartoe is bestemd;'
    url: https://wetten.overheid.nl/BWBR0004990/2010-10-01#Artikel1
  - number: 1.1.f
    text: |-
      gevoelig object: een gebouw of deel van een gebouw dat tot het verblijf van personen is bestemd, een gebouw
      of terrein dat is bestemd voor verblijfs- of dagrecreatie, niet zijnde een kampeerterrein als bedoeld in
      [artikel 8, tweede lid, onder a][ref1], of [artikel 8, derde lid, van de Wet op de openluchtrecreatie][ref2], een
      gebouw dat deel uitmaakt van een agrarisch bedrijf en ter beschikking wordt gesteld voor het houden van recreatief
      nachtverblijf, of een als kamphuis of blokhut aan te merken bouwwerk, dat ter beschikking wordt gesteld voor het
      houden van recreatief nachtverblijf;


      [ref1]: https://wetten.overheid.nl/BWBR0006548#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0006548#Artikel8
    url: https://wetten.overheid.nl/BWBR0004990/2010-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006548
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0006548
        artikel: '8'
  - number: 1.1.g
    text: |-
      zeer kwetsbaar gebied: zeer kwetsbaar gebied in de zin van de [Wet ammoniak en veehouderij][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013402
    url: https://wetten.overheid.nl/BWBR0004990/2010-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013402
  - number: 1.1.h
    text: |-
      bevoegd gezag: het bestuursorgaan dat bevoegd is of zou zijn een omgevingvergunning voor de inrichting waar dunne
      mest wordt bewaard, te verlenen.
    url: https://wetten.overheid.nl/BWBR0004990/2010-10-01#Artikel1
  - number: '1.2'
    text: 'Dit besluit is niet van toepassing op een inrichting waar dunne mest wordt bewaard in een bassin, dat is gelegen:'
    url: https://wetten.overheid.nl/BWBR0004990/2010-10-01#Artikel1
  - number: 1.2.a
    text: |-
      op minder dan 50 m afstand van een woning van derden, die behoort tot een krachtens
      [artikel 1.1, derde lid, van de Wet milieubeheer][ref1] aangewezen inrichting voor het kweken, fokken, mesten,
      houden, verhandelen, verladen of wegen van dieren;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0004990/2010-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
  - number: 1.2.b
    text: |-
      op minder dan 100 m afstand van een gevoelig object van derden of een woning van derden, niet zijnde een woning als
      bedoeld onder *a*.
    url: https://wetten.overheid.nl/BWBR0004990/2010-10-01#Artikel1
  - number: '1.3'
    text: |-
      Indien de gezamenlijke oppervlakte van de in de inrichting aanwezige bassins minder bedraagt dan 350 m², bedragen
      de in het tweede lid bedoelde afstanden respectievelijk 25 en 50 m.
    url: https://wetten.overheid.nl/BWBR0004990/2010-10-01#Artikel1
  - number: '2'
    text: |-
      Degene die een inrichting drijft, waarin dunne mest wordt bewaard, dient te voldoen aan de voorschriften die
      zijn opgenomen in dit besluit en de bij dit besluit behorende [bijlage I][ref1], alsmede aan de krachtens die
      voorschriften door het bevoegd gezag gestelde nadere eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0004990
    url: https://wetten.overheid.nl/BWBR0004990/2010-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004990
  - number: '3'
    text: |-
      Indien een inrichting tot een krachtens [artikel 1.1, derde lid, van de Wet milieubeheer][ref1] aangewezen
      categorie behoort, niet uitsluitend omdat daarin dunne mest wordt bewaard, geldt een voor de inrichting verleende
      omgevingsvergunning ook voor het oprichten, in werking hebben of veranderen van de inrichting, dan wel het
      veranderen van de werking daarvan, voor zover dit oprichten, in werking hebben of veranderen dan wel veranderen van
      de werking betrekking heeft op het bewaren van dunne mest overeenkomstig [artikel 1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004990#Artikel1
    url: https://wetten.overheid.nl/BWBR0004990/2010-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0004990
        artikel: '1'
  - number: '4.1'
    text: |-
      Degene die voornemens is een inrichting op te richten, voor zover dit oprichten betrekking heeft op het bewaren van
      dunne mest, meldt dit tenminste vier weken voor het oprichten aan het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0004990/2010-10-01#Artikel4
  - number: '4.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing met betrekking tot het uitbreiden of wijzigen van een inrichting,
      dan wel het veranderen van de werking daarvan, voor zover dat betrekking heeft op het bewaren van dunne mest. Deze
      melding is niet vereist, indien eerder een melding overeenkomstig het bepaalde in dit artikel is gedaan en door dit
      uitbreiden, wijzigen of veranderen van de werking van de inrichting geen afwijking ontstaat van de bij die melding
      verstrekte gegevens.
    url: https://wetten.overheid.nl/BWBR0004990/2010-10-01#Artikel4
  - number: '4.3'
    text: |-
      Bij een melding als bedoeld in het eerste of tweede lid, wordt in ieder geval het tijdstip vermeld, waarop de
      inrichting of de uitbreiding of wijziging daarvan in werking zal worden gebracht, dan wel de verandering van
      de werking daarvan verwezenlijkt zal zijn, en worden de gegevens verstrekt, die in de bij dit besluit behorende
      [bijlage II][ref1] zijn aangegeven. Tevens dienen de gegevens te worden verstrekt die zijn aangegeven in de
      krachtens [bijlage II][ref2] door het bevoegd gezag gestelde nadere eisen. De melding dient te worden gedaan op
      een formulier waarvan het model wordt vastgesteld door Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en
      Milieubeheer. Onze Minister kan daarbij nadere regels stellen met betrekking tot de in [bijlage II][ref3] bedoelde
      gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0004990
      [ref2]: https://wetten.overheid.nl/BWBR0004990
      [ref3]: https://wetten.overheid.nl/BWBR0004990
    url: https://wetten.overheid.nl/BWBR0004990/2010-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004990
      - id: ref2
        bwb_id: BWBR0004990
      - id: ref3
        bwb_id: BWBR0004990
  - number: '4.4'
    text: |-
      Degene die een melding heeft gedaan als bedoeld in het eerste of het tweede lid, dient het bevoegd gezag zo tijdig
      in kennis te stellen van een wijziging van het in het derde lid bedoelde tijdstip dat het bevoegd gezag in staat is
      voorafgaand aan dat tijdstip te controleren of aan de in [bijlage I][ref1] opgenomen voorschriften wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004990
    url: https://wetten.overheid.nl/BWBR0004990/2010-10-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004990
  - number: '5.1'
    text: |-
      Gedurende één jaar vanaf het tijdstip waarop dit besluit van toepassing wordt op een reeds opgerichte inrichting
      waar dunne mest wordt bewaard, zijn de [artikelen 2][ref1] en [3][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004990#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004990#Artikel3
    url: https://wetten.overheid.nl/BWBR0004990/2010-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004990
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0004990
        artikel: '3'
  - number: '5.2'
    text: |-
      In een geval als bedoeld in het eerste lid, meldt degene die de inrichting drijft, ten hoogste zes maanden na het
      in dat lid bedoelde tijdstip aan het bevoegd gezag dat hij de inrichting in werking heeft. De melding dient te
      geschieden overeenkomstig [artikel 4, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004990#Artikel4
    url: https://wetten.overheid.nl/BWBR0004990/2010-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004990
        artikel: '4'
  - number: '5.3'
    text: 'Deze melding is niet vereist, indien voor de inrichting:'
    url: https://wetten.overheid.nl/BWBR0004990/2010-10-01#Artikel5
  - number: 5.3.a
    text: |-
      een vergunning krachtens [artikel 8.1 van de Wet milieubeheer][ref1] of krachtens de Hinderwet is verleend, die
      betrekking heeft op het bewaren van dunne mest waarop dit besluit van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0004990/2010-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 5.3.b
    text: |-
      een melding als bedoeld in een verordening krachtens artikel 3 van de Hinderwet, heeft plaatsgevonden, die
      betrekking heeft op het bewaren van dunne mest waarop dit besluit van toepassing is;
    url: https://wetten.overheid.nl/BWBR0004990/2010-10-01#Artikel5
  - number: 5.3.c
    text: |-
      een eerdere kennisgeving heeft plaatsgevonden waarbij de gegevens zijn verstrekt, die zijn aangegeven in bijlage II
      van het ontwerp van dit besluit, dat is voorgepubliceerd in de *Staatscourant* 1987, 55.
    url: https://wetten.overheid.nl/BWBR0004990/2010-10-01#Artikel5
  - number: '6'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede kalendermaand na de datum van uitgifte van het *Staatsblad*
      waarin het wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0004990/2010-10-01#Artikel6
  - number: '7'
    text: 'Dit besluit kan worden aangehaald als: Besluit mestbassins milieubeheer.'
    url: https://wetten.overheid.nl/BWBR0004990/2010-10-01#Artikel7
