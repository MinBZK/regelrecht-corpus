  - number: '5'
    text: |-
      1 Gedurende één jaar vanaf het tijdstip waarop dit besluit van toepassing wordt op een reeds opgerichte inrichting
      waar dunne mest wordt bewaard, zijn de [artikelen 2][ref1] en [3][ref2] niet van toepassing.

      2 In een geval als bedoeld in het eerste lid, meldt degene die de inrichting drijft, ten hoogste zes maanden na
      het in dat lid bedoelde tijdstip aan het bevoegd gezag dat hij de inrichting in werking heeft. De melding dient te
      geschieden overeenkomstig [artikel 4, derde lid][ref3].

      3 Deze melding is niet vereist, indien voor de inrichting:

      a. een vergunning krachtens [artikel 8.1 van de Wet milieubeheer][ref4] of krachtens de Hinderwet is verleend, die
      betrekking heeft op het bewaren van dunne mest waarop dit besluit van toepassing is;

      b. een melding als bedoeld in een verordening krachtens artikel 3 van de Hinderwet, heeft plaatsgevonden, die
      betrekking heeft op het bewaren van dunne mest waarop dit besluit van toepassing is;

      c. een eerdere kennisgeving heeft plaatsgevonden waarbij de gegevens zijn verstrekt, die zijn aangegeven in bijlage
      II van het ontwerp van dit besluit, dat is voorgepubliceerd in de *Staatscourant* 1987, 55.


