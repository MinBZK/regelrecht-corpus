articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. inrichting: een inrichting die behoort tot een krachtens [artikel 1.1, derde lid, van de Wet milieubeheer][ref1]
      aangewezen categorie;

      b. bewaren van dunne mest: het bewaren van dunne mest in één of meer bassins, voor zover:

      1°. de gezamenlijke oppervlakte van de in de inrichting aanwezige bassins niet meer bedraagt dan 750 m²;

      2°. de gezamenlijke inhoud van de in de inrichting aanwezige bassins niet meer bedraagt dan 2500 m3;

      3°. er in de bassins geen beluchting, geforceerde vergisting of een andere be- of verwerking van dunne mest
      plaatsvindt, behoudens mengen of roeren;

      c. dunne mest: mest die verpompbaar is en die bestaat uit faeces of urine van landbouwhuisdieren, al dan niet
      vermengd met mors-, spoel-, reinigings- of regenwater;

      d. bassin: een reservoir bestemd en geschikt voor het bewaren van dunne mest, dat niet geheel of gedeeltelijk is
      gelegen onder een stal en dat tot stand is gebracht na 1 juni 1987;

      e. woning: een gebouw of een deel van een gebouw, dat voor bewoning wordt gebruikt of daartoe is bestemd;

      f. gevoelig object: een gebouw of deel van een gebouw dat tot het verblijf van personen is bestemd, een gebouw
      of terrein dat is bestemd voor verblijfs- of dagrecreatie, niet zijnde een kampeerterrein als bedoeld in
      [artikel 8, tweede lid, onder a][ref2], of [artikel 8, derde lid, van de Wet op de openluchtrecreatie][ref3], een
      gebouw dat deel uitmaakt van een agrarisch bedrijf en ter beschikking wordt gesteld voor het houden van recreatief
      nachtverblijf, of een als kamphuis of blokhut aan te merken bouwwerk, dat ter beschikking wordt gesteld voor het
      houden van recreatief nachtverblijf;

      g. zeer kwetsbaar gebied: zeer kwetsbaar gebied in de zin van de [Wet ammoniak en veehouderij][ref4];

      h. bevoegd gezag: het bestuursorgaan dat bevoegd is of zou zijn een omgevingvergunning voor de inrichting waar
      dunne mest wordt bewaard, te verlenen.

      2 Dit besluit is niet van toepassing op een inrichting waar dunne mest wordt bewaard in een bassin, dat is gelegen:

      a. op minder dan 50 m afstand van een woning van derden, die behoort tot een krachtens
      [artikel 1.1, derde lid, van de Wet milieubeheer][ref5] aangewezen inrichting voor het kweken, fokken, mesten,
      houden, verhandelen, verladen of wegen van dieren;

      b. op minder dan 100 m afstand van een gevoelig object van derden of een woning van derden, niet zijnde een woning
      als bedoeld onder *a*.

      3 Indien de gezamenlijke oppervlakte van de in de inrichting aanwezige bassins minder bedraagt dan 350 m², bedragen
      de in het tweede lid bedoelde afstanden respectievelijk 25 en 50 m.


