        artikel: '1'
  - number: '4'
    text: |-
      1 Degene die voornemens is een inrichting op te richten, voor zover dit oprichten betrekking heeft op het bewaren
      van dunne mest, meldt dit tenminste vier weken voor het oprichten aan het bevoegd gezag.

      2 Het eerste lid is van overeenkomstige toepassing met betrekking tot het uitbreiden of wijzigen van een
      inrichting, dan wel het veranderen van de werking daarvan, voor zover dat betrekking heeft op het bewaren van dunne
      mest. Deze melding is niet vereist, indien eerder een melding overeenkomstig het bepaalde in dit artikel is gedaan
      en door dit uitbreiden, wijzigen of veranderen van de werking van de inrichting geen afwijking ontstaat van de bij
      die melding verstrekte gegevens.

      3 Bij een melding als bedoeld in het eerste of tweede lid, wordt in ieder geval het tijdstip vermeld, waarop
      de inrichting of de uitbreiding of wijziging daarvan in werking zal worden gebracht, dan wel de verandering van
      de werking daarvan verwezenlijkt zal zijn, en worden de gegevens verstrekt, die in de bij dit besluit behorende
      [bijlage II][ref1] zijn aangegeven. Tevens dienen de gegevens te worden verstrekt die zijn aangegeven in de
      krachtens [bijlage II][ref2] door het bevoegd gezag gestelde nadere eisen. De melding dient te worden gedaan op
      een formulier waarvan het model wordt vastgesteld door Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en
      Milieubeheer. Onze Minister kan daarbij nadere regels stellen met betrekking tot de in [bijlage II][ref3] bedoelde
      gegevens.

      4 Degene die een melding heeft gedaan als bedoeld in het eerste of het tweede lid, dient het bevoegd gezag zo
      tijdig in kennis te stellen van een wijziging van het in het derde lid bedoelde tijdstip dat het bevoegd gezag in
      staat is voorafgaand aan dat tijdstip te controleren of aan de in [bijlage I][ref4] opgenomen voorschriften wordt
      voldaan.


