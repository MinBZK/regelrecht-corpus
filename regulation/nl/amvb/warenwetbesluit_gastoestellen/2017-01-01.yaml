  - number: '6'
    text: |-
      1 Gastoestellen dienen te zijn voorzien van de in [bijlage II][ref1], [onderdeel B][ref2], genoemde opschriften.

      2 De in het eerste lid bedoelde opschriften en de in [artikel 5, eerste lid][ref3], bedoelde aanduiding dienen
      zichtbaar, gemakkelijk leesbaar en onuitwisbaar op het gastoestel of op een daarop bevestigde plaat, te zijn
      aangebracht.

      3 De in het tweede lid bedoelde plaat moet zodanig zijn aangebracht, dat verwijdering niet mogelijk is zonder
      duidelijk zichtbare beschadiging ervan.

      4 Ten aanzien van gastoestellen mogen geen vermeldingen, vaststellingen of aanduidingen worden gebezigd, welke met
      de in [bijlage II][ref4], [onder A][ref5], bedoelde aanduiding kunnen worden verward.

      5 Een te koop aan te bieden gastoestel bevat een onlosmakelijke op of in het toestel op een duidelijke plaats
      aangebrachte, onuitwisbare aanduiding van geschiktheid voor G+-gas of H-gas.

      6 De in het eerste lid bedoelde aanduiding is voor G+-gas: I2(43,46 – 45,3 MJ/m3 (0°C)) en voor H-gas: I2E.


