  - number: '8'
    text: >-
      Gastoestellen en toebehoren die niet voldoen aan het bepaalde bij of krachtens dit besluit mogen nog tot 1 januari
      1996 worden verhandeld.
    url: https://wetten.overheid.nl/BWBR0005384/2017-01-01#Artikel8
  - number: '9'
    text: >-
      Dit besluit treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad* waarin het
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0005384/2017-01-01#Artikel9
