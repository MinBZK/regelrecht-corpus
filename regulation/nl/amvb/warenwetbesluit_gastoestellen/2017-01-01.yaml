preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 13 november 1991, VVP/P-U-
    692116, gedaan mede namens Onze Minister van Economische Zaken;


    Overwegende, dat het, gelet op richtlijn 90/396/EEG van de Raad van de Europese Gemeenschappen van 29 juni 1990
    betreffende de onderlinge aanpassing van de wetgevingen van de Lid-Staten inzake gastoestellen (PbEG L 196),
    noodzakelijk is regels te stellen ten aanzien van de veiligheid en het energiegebruik van gastoestellen en hun
    toebehoren;


    Gelet op de artikelen 1, vierde lid, 4, eerste lid, onderdelen a en b, 8, onderdelen a, b en c, 11, 12, 13 en 14
    van de Warenwet (Stb. 1988, 360) en de artikelen 2, 3, 4, 5, 6, 7 en 21 van de Wet energiebesparing toestellen
    (Stb. 1986, 59);


    Gezien het advies van de Adviescommissie Warenwet van 18 september 1991, nr. 14 398/(50) 5;


    De Raad van State gehoord (advies van 13 december 1991, Nr. W13.91.0595);


    Gezien het nader rapport van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 20 december 1991, VVP/
    P-692577 uitgebracht mede namens Onze Minister van Economische Zaken;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005384/2017-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit wordt verstaan onder:

      a. gas: elke brandstof die bij een temperatuur van 15° C onder een druk van 1 bar in gasvormige toestand verkeert;

      b. gastoestellen: toestellen bestemd of geschikt voor koken, verwarmen, warmwaterproduktie, koeling, verlichting
      of wassen die, indien van toepassing, een normale watertemperatuur van ten hoogste 105° C hebben alsmede
      ventilatorbranders en voor dergelijke branders bedoelde warmtegeneratoren, en bij gebruik waarvan gas als brandstof
      wordt gebezigd;

      c. toebehoren: beveiligings-, controle- en regelapparatuur en onderdelen, met uitzondering van ventilatorbranders
      en voor dergelijke branders bedoelde warmtegeneratoren, welke bestemd zijn om in een gastoestel te worden ingebouwd
      dan wel tot een gastoestel te worden geassembleerd;

      d. normaal gebruik: gebruik waarbij gastoestellen,

      1. op een juiste wijze zijn geïnstalleerd en regelmatig worden onderhouden overeenkomstig de instructies van de
      fabrikant;

      2. worden aangewend met een normale schommeling van de gaskwaliteit en de gasdruk en;

      3. overeenkomstig hun bestemming of op een redelijkerwijs te verwachten manier worden aangewend;

      e. *G+-gas:* gas met de samenstelling en kenmerken als vermeld in de tweede gasfamilie onder2 in [bijlage VI][ref1]
      bij dit besluit;

      f. *H-gas:* gas van een kwaliteit als bedoeld in groep E vermeld in [bijlage VI][ref2] bij dit besluit;

      g. *te koop aanbieden:* het in het kader van een handelsactiviteit, al dan niet tegen betaling, verstrekken met het
      oog op distributie, consumptie of gebruik op de Nederlandse markt.

      2 In afwijking van het eerste lid, wordt in dit besluit onder gastoestellen niet verstaan gastoestellen specifiek
      bestemd voor gebruik in industriële processen. [Artikel 2, vierde lid][ref3], en [artikel 6, vijfde lid][ref4],
      zijn niet van toepassing op gastoestellen die niet bestemd zijn om in Nederland op het aardgasnet te worden
      aangesloten.

      3 In dit besluit wordt, voor zover het berust op de [Wet implementatie EU-richtlijnen energie-efficiëntie][ref5],
      onder verhandelen verstaan: ten verkoop voorhanden hebben, ten verkoop aanbieden, verkopen, verhuren of afleveren.


