  - number: '7'
    text: |-
      1 Onze Minister van Volksgezondheid, Welzijn en Sport wijst de instellingen aan die:

      a. bevoegd zijn het in [artikel 5, tweede lid, onder a][ref1], bedoelde EG-type-onderzoek te verrichten;

      b. bevoegd zijn tot het verrichten van steekproeven, EG-toezicht en EG-keuring zoals omschreven in de in
      [artikel 5, tweede lid, onder a en b][ref2], bedoelde procedures.

      2 Voor een aanwijzing als bedoeld in het eerste lid, komen in aanmerking instanties die tenminste voldoen aan de in
      [bijlage V][ref3] genoemde voorwaarden.

      3 Aan de krachtens het eerste lid aangewezen instellingen worden gelijkgesteld de door de daartoe bevoegde
      autoriteiten van de lid-staten van de Europese Gemeenschappen dan wel die van de overige staten die partij zijn bij
      de Overeenkomst betreffende de Europese Economische Ruimte, in het kader van de [richtlijn 90/396/EEG](31990L0396)
      (*PbEG* L 196) aangewezen instellingen.

      4 Onze Minister kan een aanwijzing schorsen, wijzigen of intrekken:

      a. op grond van feiten of omstandigheden waarvan Onze Minister bij de aanwijzing redelijkerwijs niet op de hoogte
      kon zijn en op grond waarvan hij de aanwijzing niet zou hebben gegeven;

      b. op grond van door de aangewezen instelling verstrekte onjuiste inlichtingen over feiten of omstandigheden,
      tenzij de onjuistheid daarvan aan de instelling onbekend was of kon zijn;

      c. indien de aangewezen instelling niet meer voldoet aan de in [bijlage V][ref4] genoemde voorwaarden;

      d. indien de aangewezen instelling gedurende een aaneengesloten periode van twee jaren geen werkzaamheden waarvoor
      zij is aangewezen, heeft uitgevoerd; of

      e. indien de aangewezen instelling haar wettelijke verplichtingen niet naar behoren nakomt of de taken waarvoor zij
      is aangewezen, niet naar behoren uitvoert.


      [ref1]: https://wetten.overheid.nl/BWBR0005384#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005384#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005384
      [ref4]: https://wetten.overheid.nl/BWBR0005384
