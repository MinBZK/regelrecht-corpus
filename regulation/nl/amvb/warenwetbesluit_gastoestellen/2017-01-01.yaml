  - number: '2'
    text: >-
      1 Het is verboden gastoestellen en toebehoren te verhandelen die niet voldoen aan de eisen gesteld bij of krachtens
      dit besluit.


      2 Het is verboden gastoestellen en toebehoren te verhandelen anders dan met inachtneming van de voorschriften bij
      of krachtens dit besluit gesteld met betrekking tot de aanduiding en het bezigen van vermeldingen.


      3 Het is verboden met gebruikmaking van de in dit besluit aangegeven aanduiding andere gastoestellen te verhandelen
      dan die waarvoor die aanduiding in dit besluit is voorbehouden.


      4 Het is verboden om een gastoestel te koop aan te bieden dat niet aantoonbaar geschikt is voor G+-gas en H-gas,
      dan wel niet aantoonbaar geschikt is voor G+-gas en aantoonbaar geschikt is te maken voor H-gas.
    url: https://wetten.overheid.nl/BWBR0005384/2017-01-01#Artikel2
  - number: '3'
    text: |-
      1 Gastoestellen en toebehoren dienen zodanig te zijn samengesteld en zodanige eigenschappen te hebben alsmede
      van zodanige vermeldingen te zijn voorzien, dat zij bij normaal gebruik van het gastoestel geen bijzonder gevaar
      opleveren voor de veiligheid van personen, huisdieren of goederen.

      2 Gastoestellen en toebehoren moeten voldoen aan de in [bijlage I][ref1] opgenomen fundamentele voorschriften
      inzake de veiligheid en het doelmatig gebruik van energie van gastoestellen en toebehoren.


      [ref1]: https://wetten.overheid.nl/BWBR0005384
    url: https://wetten.overheid.nl/BWBR0005384/2017-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005384
  - number: '4'
    text: |-
      Gastoestellen en toebehoren worden vermoed te voldoen aan het in [artikel 3, tweede lid][ref1] bepaalde, indien zij
      voldoen aan de door Onze Minister van Volksgezondheid, Welzijn en Sport daartoe aangewezen normen.


      [ref1]: https://wetten.overheid.nl/BWBR0005384#Artikel3
    url: https://wetten.overheid.nl/BWBR0005384/2017-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005384
        artikel: '3'
  - number: '5'
    text: |-
      1 Gastoestellen dienen door de fabrikant te zijn voorzien van de in [bijlage II][ref1], [onder A][ref2], bedoelde
      aanduiding.

      2 De in het eerste lid bedoelde aanduiding mag uitsluitend worden gebezigd:

      a. na het verkrijgen van een EG-type-onderzoekcertificaat voor het desbetreffende type gastoestel, als bedoeld
      in het in [bijlage III][ref3], [onderdeel A][ref4], genoemde EG-type-onderzoek en zolang de vervaardiging van het
      type toestel geschiedt met inachtneming van één van de vier in [bijlage III][ref5], [onderdeel B][ref6], genoemde
      procedures inzake de vervaardiging van gastoestellen, dan wel,

      b. na inachtneming van de in [onderdeel C][ref7] van [bijlage III][ref8] genoemde procedure inzake EG-keuring per
      eenheid, voor ieder gastoestel afzonderlijk.

      3 Toebehoren mogen niet zijn voorzien van de in het eerste lid bedoelde aanduiding maar dienen te zijn voorzien
      van een door de fabrikant afgegeven verklaring dat zij voldoen aan de van toepassing zijnde eisen als opgenomen
      in [bijlage I][ref9] en waarin tevens de kenmerken van het toebehoren zijn vermeld alsmede de voorschriften voor
      het inbouwen in een gastoestel of het assembleren daarvan, welke van belang zijn voor het voldoen aan de voor
      gastoestellen bij of krachtens dit besluit gestelde voorschriften.

      4 De in het derde lid bedoelde verklaring mag slechts worden afgegeven voor toebehoren ten aanzien waarvan één van
      de vier in [bijlage III][ref10], [onderdeel B][ref11], genoemde procedures voor gastoestellen op overeenkomstige
      wijze in acht is genomen, met uitzondering van het in die procedures bepaalde aangaande de CE-markering en waarvoor
      een EG-type-onderzoekcertificaat als bedoeld in het in [bijlage III][ref12], [onderdeel A][ref13], genoemde type-
      onderzoek, is verkregen voor het desbetreffende type toebehoren.


