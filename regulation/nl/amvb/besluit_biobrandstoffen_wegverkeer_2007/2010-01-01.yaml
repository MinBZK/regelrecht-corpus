  - number: '4'
    text: |-
      1 Bij ministeriële regeling kunnen met verwijzing naar artikel 3, vierde lid, van [richtlijn 2003/30/EG]
      (32003L0030), minimumeisen van duurzaamheid worden vastgesteld. [Artikel 2, eerste lid, derde volzin][ref1], is van
      overeenkomstige toepassing.

      2 Bij ministeriële regeling kunnen ter bevordering van het gebruik van biobrandstoffen, als bedoeld in artikel 3,
      vierde lid, van [richtlijn 2003/30/EG](32003L0030), categorieën van biobrandstoffen, waarvan het voldoen aan de
      minimumeisen van duurzaamheid, bedoeld in het eerste lid, niet kan worden aangetoond, worden aangewezen die buiten
      beschouwing worden gelaten bij de toepassing van [artikel 2, eerste lid][ref2].

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld ten aanzien van de administratie, bedoeld in
      [artikel 3][ref3].

      4 De regelingen, bedoeld in het eerste en tweede lid treden niet eerder in werking dan zes maanden na publicatie in
      de Staatscourant en met ingang van 1 januari van enig kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0020446#Artikel2
