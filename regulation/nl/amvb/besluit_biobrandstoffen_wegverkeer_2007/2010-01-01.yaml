    text: |-
      Met ingang van 1 januari 2010 komt [artikel 2, eerste lid][ref1], te luiden:

      1. Iedere vergunninghouder levert per kalenderjaar ten minste 4,00% van de door hem uitgeslagen hoeveelheid
      ongelode lichte olie en gasolie aan als biobrandstof, waarbij zowel bij de ongelode lichte olie als bij de gasolie
      ten minste 3,5% bestaat uit biobrandstoffen. Bij de berekening van het percentage kan op bij ministeriële regeling
      aan te wijzen biobrandstoffen een bij die regeling vast te stellen wegingsfactor worden toegepast. Bij die regeling
      kan worden bepaald dat de vergunninghouder in bepaalde gevallen aantoont dat een biobrandstof voldoet aan het in
      die regeling gestelde en op welke wijze dit aangetoond kan worden.


