articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. accijnsgoederenplaats: accijnsgoederenplaats als bedoeld in
      [artikel 1a, eerste lid, onder d, van de Wet op de accijns][ref1];

      b. biobrandstof: biobrandstof als bedoeld in artikel 2, eerste lid, onder a, van [richtlijn 2003/30/EG]
      (32003L0030), waaronder in elk geval de biobrandstoffen, bedoeld in artikel 2, tweede lid, van [richtlijn 2003/30/
      EG](32003L0030), worden verstaan;

      c. energie-inhoud: energie-inhoud als bedoeld in artikel 2, eerste lid, onder d, van [richtlijn 2003/30/EG]
      (32003L0030);

      d. d.. gasolie: gasolie als bedoeld in [artikel 26, vierde lid, van de Wet op de accijns][ref2], niet zijnde
      gasolie die wordt belast naar het tarief van [artikel 27, derde lid, van die wet][ref3];

      e. ongelode lichte olie: ongelode lichte olie als bedoeld in
      [artikel 26, tweede lid, van de Wet op de accijns][ref4];

      f. [richtlijn 2003/30/EG](32003L0030): [richtlijn nr. 2003/30/EG](32003L0030) van het Europees Parlement en de
      Raad van de Europese Unie van 8 mei 2003 ter bevordering van het gebruik van biobrandstoffen of andere hernieuwbare
      brandstoffen in het vervoer (PbEU L 123), naar de tekst zoals deze bij die richtlijn is vastgesteld;

      g. uitslag: hetgeen ingevolge [artikel 2, eerste lid, van de Wet op de accijns][ref5] onder dit begrip wordt
      verstaan;

      h. vergunninghouder: persoon op wiens naam de vergunning is gesteld van een of meer accijnsgoederenplaatsen van
      waaruit uitslag plaatsvindt van ongelode lichte olie of gasolie voor het wegverkeer.


