        artikel: '2'
  - number: '2'
    text: |-
      1 Iedere vergunninghouder levert per kalenderjaar ten minste 4,00% van de door hem uitgeslagen hoeveelheid ongelode
      lichte olie en gasolie aan als biobrandstof, waarbij zowel bij de ongelode lichte olie als bij de gasolie ten
      minste 3,5% bestaat uit biobrandstoffen. Bij de berekening van het percentage kan op bij ministeriële regeling aan
      te wijzen biobrandstoffen een bij die regeling vast te stellen wegingsfactor worden toegepast. Bij die regeling kan
      worden bepaald dat de vergunninghouder in bepaalde gevallen aantoont dat een biobrandstof voldoet aan het in die
      regeling gestelde en op welke wijze dit aangetoond kan worden.

      2 Biobrandstoffen die in aanmerking komen voor een accijnsverlaging of accijnsvrijstelling blijven buiten
      beschouwing bij de vaststelling van het percentage, bedoeld in het eerste lid.

      3 De biobrandstof die ingevolge het eerste lid wordt geleverd in verband met de uitgeslagen hoeveelheid ongelode
      lichte olie bestaat uit een of meer van de volgende producten:

      a. bio-ethanol;

      b. biomethanol;

      c. bioETBE;

      d. bioMTBE;

      e. synthetische biobenzine;

      f. biowaterstof;

      g. andere producten die als toegestane componenten zijn gewaarmerkt in EN 228 en in overeenstemming zijn met
      artikel 2, eerste lid, onder a, van [richtlijn 2003/30/EG](32003L0030).

      4 De biobrandstof die ingevolge het eerste lid wordt geleverd in verband met de uitgeslagen hoeveelheid gasolie
      bestaat uit een of meer van de volgende producten:

      a. biodiesel;

      b. biodimethylether;

      c. biogas;

      d. onvermengde plantaardige olie;

      e. synthetische biodiesel;

      f. andere producten die als toegestane componenten zijn gewaarmerkt in EN 590 en in overeenstemming zijn met
      artikel 2, eerste lid, onder a, van [richtlijn 2003/30/EG](32003L0030).

      5 Het in het eerste lid genoemde percentage wordt als volgt berekend:

      energiepercentage biobrandstof = hoeveelheid biobrandstof x onderste verbrandingswaarde biobrandstof / (de
      totale in een kalenderjaar uitgeslagen hoeveelheid ongelode lichte olie respectievelijk gasolie x de onderste
      verbrandingswaarde ongelode lichte olie respectievelijk gasolie).

      Indien zich in ongelode lichte olie of gasolie biobrandstoffen bevinden, dan wordt de onderste verbrandingswaarde
      hiervoor gecorrigeerd.

      6 De biobrandstoffen die niet specifiek dienen ter vervanging van ongelode lichte olie en gasolie als bedoeld in
      de laatste zinsnede van de eerste volzin van het eerste lid, kunnen andere zijn dan die, genoemd in het derde en
      vierde lid.
    url: https://wetten.overheid.nl/BWBR0020446/2010-01-01#Artikel2
  - number: '3'
    text: |-
      1 De berekening, bedoeld in [artikel 2, eerste lid][ref1], wordt gebaseerd op de biobrandstoffenbalans per
      accijnsgoederenplaats. De hoeveelheden biobrandstoffen worden bijgehouden in liters bij een temperatuur van 15°C.

      2 In de biobrandstoffenbalans is opgenomen de hoeveelheid van iedere biobrandstof als bedoeld in
      [artikel 2, derde, vierde en zesde lid][ref2], die:

      a. in de accijnsgoederenplaats is geproduceerd;

      b. in de accijnsgoederenplaats is ingeslagen;

      c. is toegevoegd aan de hoeveelheid ongelode lichte olie onderscheidenlijk gasolie, die in de accijnsgoederenplaats
      is ingeslagen;

      d. uit de accijnsgoederenplaats is uitgeslagen;

      e. is toegevoegd aan de hoeveelheid ongelode lichte olie en gasolie die uit de accijnsgoederenplaats is
      uitgeslagen;

      f. is toegevoegd aan ongelode lichte olie onderscheidenlijk gasolie die overeenkomstig het bepaalde in
      [artikel 2, derde lid, onderdeel a, van de Wet op de accijns][ref3], is overgebracht naar een andere
      accijnsgoederenplaats, of

      g. buiten Nederland is gebracht en die al dan niet is toegevoegd aan ongelode lichte olie onderscheidenlijk
      gasolie.

      3 Bij de administratie dient een schriftelijke, ondertekende en gedateerde verklaring aanwezig te zijn van de
      leverancier van de biobrandstoffen, waarin hij verklaart welke hoeveelheid hij van iedere biobrandstof als bedoeld
      in het tweede lid, onder c, heeft geleverd.

      4 Degene die biobrandstoffen niet door middel van een accijnsgoederenplaats op de markt brengt, dient in zijn
      administratie aan te tonen dat de betreffende hoeveelheden biobrandstof als brandstof voor het wegverkeer zijn
      gebruikt.

      5 Vergunninghouders mogen aan hun verplichting, bedoeld in [artikel 2, eerste lid][ref4], voldoen door hoeveelheden
      biobrandstoffen als bedoeld in artikel 2, derde, vierde en zesde lid, administratief te verhandelen met andere
      vergunninghouders of met een ieder, die biobrandstoffen niet door middel van een accijnsgoederenplaats op de markt
      brengt. Bij de administratie dient een bewijsmiddel te zijn gevoegd.

      6 De vergunninghouder zendt ieder kalenderjaar vóór 1 april van het daarop volgende kalenderjaar een overzicht
      over het eerst bedoelde kalenderjaar naar Onze Minister met betrekking tot de geleverde hoeveelheden en soorten
      biobrandstoffen en de geleverde hoeveelheden ongelode lichte olie en gasolie. Uit dit overzicht moet blijken dat is
      voldaan aan het in [artikel 2, eerste lid][ref5], genoemde percentage.

      7 De administratie, met inbegrip van de biobrandstoffenbalans, dient ten minste 7 jaar bewaard te blijven.


