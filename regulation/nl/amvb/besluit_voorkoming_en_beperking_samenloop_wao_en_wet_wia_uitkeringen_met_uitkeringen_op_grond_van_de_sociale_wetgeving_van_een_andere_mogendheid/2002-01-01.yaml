preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van de Staatssecretaris van Sociale Zaken van 1 november 1972, Directoraat-Generaal voor Sociale
    Voorzieningen, Directie Soc. Verz., Afd. W.V., no. 54993;

    Gelet op artikel 52 van de Wet op de arbeidsongeschiktheidsverzekering;

    De Sociaal-Economische Raad gehoord (advies van 19 november 1971);

    De Raad van State gehoord (advies van 15 november 1972, No. 19);

    Gezien het nader rapport van de Staatssecretaris van Sociale Zaken van 18 december 1972, Directoraat-Generaal voor
    Sociale Voorzieningen, Directie Soc. Verz., Afd. W.V., no. 55.493;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002861/2002-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Bij samenloop over eenzelfde tijdvak van een arbeidsongeschiktheidsuitkering ingevolge de
      [Wet op de arbeidsongeschiktheidsverzekering][ref1] met één of meer van de navolgende ingevolge de sociale
      wetgeving van één of meer andere Mogendheden toegekende uitkeringen:


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0002861/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: 1.1.a
    text: uitkering wegens arbeidsongeschiktheid;
    url: https://wetten.overheid.nl/BWBR0002861/2002-01-01#Artikel1
  - number: 1.1.b
    text: wezenuitkering;
    url: https://wetten.overheid.nl/BWBR0002861/2002-01-01#Artikel1
  - number: 1.1.c
    text: |-
      ouderdomsuitkering, dan wel enige andere uitkering, welke in verband met het bereikt hebben van een bepaalde
      leeftijd is toegekend, wordt de arbeidsongeschiktheidsuitkering slechts uitbetaald, indien en voor zover deze het
      totale bedrag van de onder *a* t/m *c* bedoelde uitkeringen overtreft.
    url: https://wetten.overheid.nl/BWBR0002861/2002-01-01#Artikel1
  - number: '1.2'
    text: |-
      Bij de toepassing van het bepaalde in het vorige lid wordt met een in dat lid onder *a* bedoelde uitkering slechts
      rekening gehouden, indien en voor zover deze is verleend ter zake van dezelfde arbeidsongeschiktheid als de
      arbeidsongeschiktheidsuitkering.
    url: https://wetten.overheid.nl/BWBR0002861/2002-01-01#Artikel1
  - number: '2.1'
    text: |-
      Ten aanzien van een arbeidsongeschiktheidsuitkering ingevolge de
      [Wet op de arbeidsongeschiktheidsverzekering][ref1], welke met toepassing van artikel 17 van die wet is toegekend,
      dan wel wegens toegenomen arbeidsongeschiktheid is herzien, geldt het bepaalde in [artikel 1][ref2], behoudens de
      in de volgende leden van dit artikel opgenomen bijzondere bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0002861#Artikel1
    url: https://wetten.overheid.nl/BWBR0002861/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0002861
        artikel: '1'
  - number: '2.2'
    text: |-
      Bij samenloop over eenzelfde tijdvak van een arbeidsongeschiktheidsuitkering ingevolge de
      [Wet op de arbeidsongeschiktheidsverzekering][ref1], welke met toepassing van artikel 17 van die wet is toegekend,
      met een uitkering wegens arbeidsongeschiktheid ingevolge de sociale wetgeving van een andere Mogendheid, volgens
      welke het bedrag van de uitkering onafhankelijk is van de duur van de verzekering of de arbeidsverhouding, wordt
      de arbeidsongeschiktheidsuitkering, voor zover deze is verleend ter zake van dezelfde arbeidsongeschiktheid, niet
      uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0002861/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: '2.3'
    text: |-
      Indien een met toepassing van [artikel 17 van de Wet op de arbeidsongeschiktheidsverzekering][ref1] toegekende
      arbeidsongeschiktheidsuitkering wegens toegenomen arbeidsongeschiktheid is herzien - ongeacht of ook die herziening
      geschiedde met toepassing van [artikel 17 van de Wet op de arbeidsongeschiktheidsverzekering][ref2] - wordt, bij
      samenloop met een uitkering wegens arbeidsongeschiktheid ingevolge de sociale wetgeving van een andere Mogendheid,
      als bedoeld in het vorige lid, de verhoging van de arbeidsongeschiktheidsuitkering, voor zover deze is verleend ter
      zake van dezelfde arbeidsongeschiktheid als waarvoor die andere uitkering wordt verleend, evenmin uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel17
    url: https://wetten.overheid.nl/BWBR0002861/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '17'
  - number: '2.4'
    text: |-
      Indien een arbeidsongeschiktheidsuitkering, toegekend ingevolge de
      [Wet overgangsregeling arbeidsongeschiktheidsverzekering][ref1], dan wel een arbeidsongeschiktheidsuitkering
      ingevolge de [Wet op de arbeidsongeschiktheidsverzekering][ref2], welke zonder toepassing van artikel 17 van die
      wet werd toegekend, met toepassing van laatstgenoemd artikel wegens toegenomen arbeidsongeschiktheid is herzien,
      wordt, bij samenloop met een uitkering wegens arbeidsongeschiktheid ingevolge de sociale wetgeving van een
      andere Mogendheid, als bedoeld in de beide voorgaande leden, de verhoging van de arbeidsongeschiktheidsuitkering,
      voor zover deze is verleend ter zake van dezelfde arbeidsongeschiktheid als waarvoor die andere uitkering wordt
      verleend, niet uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002551
      [ref2]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0002861/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002551
      - id: ref2
        bwb_id: BWBR0002524
  - number: '3.1'
    text: |-
      Bij samenloop over eenzelfde tijdvak van een arbeidsongeschiktheidsuitkering, welke
      is toegekend op grond of mede op grond van het bepaalde in [artikel 3][ref1] of
      [artikel 4 van de Wet overgangsregeling arbeidsongeschiktheidsverzekering][ref2], doch zonder toepassing
      van artikel 12 dier wet, met één of meer vóór de dag van ingang van de arbeidsongeschiktheidsuitkering
      ingegane weduwenuitkeringen ingevolge de sociale wetgeving van een of meer andere Mogendheden, wordt de
      arbeidsongeschiktheidsuitkering slechts uitbetaald, indien en voor zover deze het bedrag van de weduwenuitkering of
      weduwenuitkeringen als hiervoor bedoeld, overtreft.


      [ref1]: https://wetten.overheid.nl/BWBR0002551#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002551#Artikel4
    url: https://wetten.overheid.nl/BWBR0002861/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002551
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002551
        artikel: '4'
  - number: '3.2'
    text: |-
      Indien zowel het bepaalde in [artikel 1][ref1], als het bepaalde in het vorige lid van toepassing is, wordt voor de
      toepassing van het bepaalde in het vorige lid als arbeidsongeschiktheidsuitkering aangemerkt het overeenkomstig het
      bepaalde in [artikel 1][ref2] vastgestelde uit te betalen bedrag van die uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0002861#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002861#Artikel1
    url: https://wetten.overheid.nl/BWBR0002861/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002861
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002861
        artikel: '1'
  - number: '4.1'
    text: |-
      Indien ingevolge de voorgaande artikelen bij de vaststelling van het bedrag van de uit te betalen
      arbeidsongeschiktheidsuitkering twee of meer uitkeringen ingevolge de sociale wetgeving van een of meer andere
      Mogendheden in aanmerking moeten worden genomen, welke reeds onderling onderhevig zijn aan de werking van
      anticumulatiebepalingen, wordt als bedrag van de betrokken uitkeringen in aanmerking genomen het bedrag dat is
      vastgesteld na toepassing van de vorenbedoelde anticumulatiebepalingen.
    url: https://wetten.overheid.nl/BWBR0002861/2002-01-01#Artikel4
  - number: '4.2'
    text: |-
      Indien enerzijds een uitkering ingevolge de sociale wetgeving van een andere Mogendheid ingevolge de
      voorgaande artikelen van dit besluit leidt tot een vermindering van het uit te betalen bedrag van de
      arbeidsongeschiktheidsuitkering, en anderzijds de eerstbedoelde uitkering krachtens de nationale wetgeving
      van die andere Mogendheid, al dan niet met toepassing van enige bepaling van een voor die andere Mogendheid
      en Nederland geldende internationale regeling inzake sociale zekerheid, moet worden verminderd of geschorst
      wegens de samenloop met de arbeidsongeschiktheidsuitkering, wordt de vermindering van de uitbetaling van de
      arbeidsongeschiktheidsuitkering te dier zake gesteld op de helft van het bedrag, dat ingevolge dit besluit als
      vermindering zou zijn vastgesteld wegens samenloop met die uitkering, wanneer deze niet verminderd of geschorst zou
      zijn wegens samenloop met de arbeidsongeschiktheidsuitkering.
    url: https://wetten.overheid.nl/BWBR0002861/2002-01-01#Artikel4
  - number: '4.3'
    text: |-
      Indien ter zake van de samenloop met een uitkering ingevolge de sociale wetgeving van een andere Mogendheid zowel
      het bepaalde in het eerste lid, als het bepaalde in het tweede lid van toepassing is, wordt voor de toepassing van
      het tweede lid de eerstgenoemde uitkering in aanmerking genomen voor hetzelfde bedrag, als waarvoor die uitkering
      in aanmerking zou moeten worden genomen als alleen het bepaalde in het eerste lid van toepassing was.
    url: https://wetten.overheid.nl/BWBR0002861/2002-01-01#Artikel4
  - number: 4.4.a
    text: |-
      Indien het bepaalde in de voorgaande leden van toepassing is ten aanzien van reeds voor de datum van
      inwerkingtreden van dit besluit ingegane uitkeringen, wordt de uitbetaling van een arbeidsongeschiktheidsuitkering,
      welke is toegekend op grond of mede op grond van het bepaalde in [artikel 3][ref1] of
      [artikel 4 van de Wet overgangsregeling arbeidsongeschiktheidsverzekering][ref2], niet verder beperkt dan tot het
      bedrag, dat onmiddellijk voorafgaande aan die datum aan arbeidsongeschiktheidsuitkering werd uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002551#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002551#Artikel4
    url: https://wetten.overheid.nl/BWBR0002861/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002551
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002551
        artikel: '4'
  - number: 4.4.b
    text: |-
      Het bepaalde onder *a* geldt slechts, indien en zolang de arbeidsongeschiktheid in de zin van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref1] niet is afgenomen en geen uitkering ingevolge de sociale
      wetgeving van een andere Mogendheid, die ingevolge de bepalingen van dit besluit leidt tot vermindering van het
      bedrag van de uit te betalen arbeidsongeschiktheidsuitkering, wordt toegekend of, om andere reden dan aanpassing
      aan het loon- en/of prijspeil, wordt verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0002861/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: '5'
    text: |-
      Bij samenloop over eenzelfde tijdvak van een arbeidsongeschiktheidsuitkering, welke is toegekend op grond of mede
      op grond van het bepaalde in [artikel 3 van de Wet overgangsregeling arbeidsongeschiktheidsverzekering][ref1]
      met een of meer uitkeringen als bedoeld in [artikel 1 onder ][ref2] en/of een of meer uitkeringen als
      bedoeld in [artikel 3][ref3], wordt, zolang de arbeidsongeschiktheid niet is afgenomen, de uitbetaling van de
      arbeidsongeschiktheidsuitkering ter zake van die samenloop niet verder beperkt dan tot het bedrag, waarop de
      betrokkene laatstelijk aan invaliditeitsrente ingevolge de Invaliditeitswet en bijslag ingevolge de Interimwet
      invaliditeitsrentetrekkers aanspraak had.


      [ref1]: https://wetten.overheid.nl/BWBR0002551#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002861#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002861#Artikel3
    url: https://wetten.overheid.nl/BWBR0002861/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002551
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002861
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0002861
        artikel: '3'
  - number: '6.1'
    text: |-
      Wanneer krachtens een internationale regeling inzake sociale zekerheid overeenkomstig de bepalingen van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref1] een - hierna als prorata arbeidsongeschiktheidsuitkering aan
      te duiden - arbeidsongeschiktheidsuitkering is toegekend, waarvan het bedrag is bepaald naar de verhouding tussen
      enerzijds de duur van de Nederlandse verzekering en anderzijds de totale duur van


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0002861/2002-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: 6.1.a
    text: de tijdvakken van Nederlandse verzekering en
    url: https://wetten.overheid.nl/BWBR0002861/2002-01-01#Artikel6
  - number: 6.1.b
    text: |-
      de tijdvakken van verzekering of arbeid, vervuld ingevolge de sociale wetgeving van een andere Mogendheid of van
      andere Mogendheden,
    url: https://wetten.overheid.nl/BWBR0002861/2002-01-01#Artikel6
  - number: '6.2'
    text: |-
      Op een in het vorige lid bedoelde prorata arbeidsongeschiktheidsuitkering zijn, met inachtneming van het
      bepaalde in het volgende lid, de bepalingen van dit besluit slechts van toepassing ter zake van samenloop met
      uitkeringen ingevolge de sociale wetgeving van een andere Mogendheid, die niet worden verleend in het kader van
      de invaliditeitsverzekering en waarvan het bedrag is berekend onafhankelijk van de duur van de verzekering of de
      arbeidsverhouding.
    url: https://wetten.overheid.nl/BWBR0002861/2002-01-01#Artikel6
  - number: '6.3'
    text: |-
      Wanneer bij de vaststelling van het uit te betalen bedrag van de prorata arbeidsongeschiktheidsuitkering
      een vermindering ingevolge de bepalingen van de voorgaande artikelen moet worden toegepast, wordt het in
      mindering te brengen bedrag aldus berekend, dat het bedrag dat ingevolge de voorgaande artikelen ter zake
      van de samenloop met de in het vorige lid bedoelde uitkeringen daartoe in aanmerking zou zijn genomen als de
      arbeidsongeschiktheidsuitkering niet op prorata-basis zou zijn toegekend, vermenigvuldigd wordt met hetzelfde
      verhoudingsgetal, dat aan de berekening van de prorata arbeidsongeschiktheidsuitkering ten grondslag ligt.
    url: https://wetten.overheid.nl/BWBR0002861/2002-01-01#Artikel6
  - number: '7.1'
    text: |-
      Wanneer een periodieke uitkering ingevolge de sociale wetgeving van een andere Mogendheid, welke
      van invloed was op de hoogte van het overeenkomstig de voorgaande artikelen tot uitbetaling komende
      bedrag van de arbeidsongeschiktheidsuitkering, is afgekocht, blijft het bedrag van de uit te betalen
      arbeidsongeschiktheidsuitkering vastgesteld, alsof de eerstbedoelde uitkering niet was afgekocht. Na de beëindiging
      van de periodieke uitkering wordt de betrokkene geacht uit hoofde van de ontvangen afkoopsom een periodieke
      uitkering te ontvangen ter hoogte van de periodieke uitkering, die laatstelijk voor die beëindiging werd genoten.
    url: https://wetten.overheid.nl/BWBR0002861/2002-01-01#Artikel7
  - number: '7.2'
    text: |-
      Indien aan de berekening van een in het vorige lid bedoelde afkoopsom een ander bedrag aan periodieke uitkering
      ten grondslag is gelegd dan laatstelijk voor de beëindiging van die uitkering werd genoten, en het verschil niet
      uitsluitend een gevolg is van een aanpassing aan het loon- en/of prijspeil, wordt voor de vaststelling van het
      bedrag van de na de beëindiging van de periodieke uitkering uit te betalen arbeidsongeschiktheidsuitkering, in
      afwijking van het bepaalde in het vorige lid, de betrokkene geacht uit hoofde van de ontvangen afkoopsom een
      periodieke uitkering te ontvangen ter hoogte van het bedrag, dat aan de berekening van die afkoopsom ten grondslag
      is gelegd.
    url: https://wetten.overheid.nl/BWBR0002861/2002-01-01#Artikel7
  - number: '7.3'
    text: |-
      Indien, na toepassing van een van de voorgaande leden van dit artikel, het uit te betalen bedrag van
      de arbeidsongeschiktheidsuitkering moet worden herberekend, wordt het overeenkomstig de voorgaande
      leden vastgestelde in mindering te brengen bedrag aangepast overeenkomstig de percentages waarmee de
      arbeidsongeschiktheidsuitkering sedert de beëindiging van de periodieke uitkering werd herzien ingevolge
      [artikel 15 van de Wet op de arbeidsongeschiktheidsverzekering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel15
    url: https://wetten.overheid.nl/BWBR0002861/2002-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '15'
  - number: '8.1'
    text: |-
      1. De bij de toepassing van de voorgaande artikelen noodzakelijke omrekening in euro van een niet in euro
      uitgedrukte uitkering op grond van de sociale wetgeving van een andere Mogendheid geschiedt met behulp van de door
      de Europese Centrale Bank geadviseerde wisselkoersen.
    url: https://wetten.overheid.nl/BWBR0002861/2002-01-01#Artikel8
  - number: '8.2'
    text: |-
      Een wijziging in de in het eerste lid bedoelde koers beïnvloedt het op grond van de [artikelen 1][ref1] tot en met
      [7][ref2] en [artikel 9][ref3] tot uitbetaling komende bedrag niet, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0002861#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002861#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002861#Artikel9
    url: https://wetten.overheid.nl/BWBR0002861/2002-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002861
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002861
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0002861
        artikel: '9'
  - number: 8.2.a
    text: |-
      bij herziening van het bedrag van de arbeidsongeschiktheidsuitkering, anders dan op grond van artikel 15 van de Wet
      op de arbeids-ongeschiktheidsverzekering of bij wijziging van het tot uitbetaling komende bedrag als gevolg van de
      toepassing van de [artikelen 1][ref1] tot en met [7][ref2], een omrekening plaatsvindt; en


      [ref1]: https://wetten.overheid.nl/BWBR0002861#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002861#Artikel7
    url: https://wetten.overheid.nl/BWBR0002861/2002-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002861
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002861
        artikel: '7'
  - number: 8.2.b
    text: tenminste een keer per jaar een omrekening plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0002861/2002-01-01#Artikel8
  - number: '9'
    text: 'Voor zoveel nodig in afwijking van het bepaalde in de voorgaande artikelen wordt:'
    url: https://wetten.overheid.nl/BWBR0002861/2002-01-01#Artikel9
  - number: 9.a
    text: |-
      in geval van een herziening van de daglonen, bedoeld in
      [artikel 15 van de Wet op de arbeidsongeschiktheidsverzekering][ref1], het laatstelijk voor de ingangsdatum van
      die herziening tot uitbetaling komende bedrag van de arbeidsongeschiktheidsuitkering herzien met inachtneming van
      hetzelfde percentage als waarmede de daglonen worden herzien;


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel15
    url: https://wetten.overheid.nl/BWBR0002861/2002-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '15'
  - number: 9.b
    text: |-
      in geval van een herziening van het bedrag van de uitkering ingevolge de sociale wetgeving van een andere
      Mogendheid als gevolg van een wijziging van het loon- en/of prijspeil geen wijziging gebracht in het laatstelijk
      voor de ingangsdatum van die herziening tot uitbetaling komende bedrag van de arbeidsongeschiktheidsuitkering.
    url: https://wetten.overheid.nl/BWBR0002861/2002-01-01#Artikel9
  - number: '10'
    text: |-
      Ons besluit van 30 augustus 1967 (*Stb.* 452) tot vaststelling van een algemene maatregel van bestuur als bedoeld
      in [artikel 52 van de Wet op de arbeidsongeschiktheidsverzekering][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel52
