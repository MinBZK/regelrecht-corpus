  - number: '11'
    text: |-
      Dit besluit treedt in werking met ingang van de eerste dag van de maand na de datum van uitgifte van het
      *Staatsblad*, waarin het wordt geplaatst, met dien verstande, dat artikel 8 terugwerkt tot 1 oktober 1969 en
      [artikel 9][ref1] tot 1 december 1969.


