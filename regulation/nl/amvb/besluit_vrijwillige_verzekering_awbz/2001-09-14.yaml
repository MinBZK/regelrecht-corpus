  - number: '7'
    text: |-
      1 De SVB administreert de AWBZ-premies en is daarover verantwoording verschuldigd aan het College
      zorgverzekeringen.

      2 De SVB verstrekt op verzoek van het College zorgverzekeringen, overeenkomstig door het College zorgverzekeringen
      gestelde eisen en binnen de daarbij gestelde termijnen, kosteloos alle gegevens en inlichtingen over de uitvoering
      van de vrijwillige verzekering die het College zorgverzekeringen nodig acht voor de uitoefening van zijn taak.
      De SVB verleent op verzoek van het College zorgverzekeringen aan de door het College zorgverzekeringen aangewezen
      personen toegang tot en inzage in alle gegevens over de uitvoering van de vrijwillige verzekering die het College
      zorgverzekeringen nodig acht voor de uitoefening van zijn taak. De aangewezen personen zijn bevoegd van de gegevens
      kopieën te maken.

      3 De SVB zendt jaarlijks aan het College zorgverzekeringen een verslag van werkzaamheden met betrekking tot
      de uitvoering van de vrijwillige verzekering in het voorafgaande kalenderjaar, met inbegrip van een financieel
      verslag, voorzien van een verklaring omtrent de getrouwheid en rechtmatigheid van ontvangsten en uitgaven afgegeven
      door een accountant als bedoeld in [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref1], alsmede van een
      rapport van de accountant over de ordelijkheid en controleerbaarheid van het gevoerde beheer.

      4 Het financieel verslag betreft naast de verantwoording van de premie-ontvangsten en -afdrachten, een
      verantwoording van de uitvoeringskosten, bedoeld in [artikel 8][ref2].

      5 Het College zorgverzekeringen kan regels stellen over:

      a. de minimumeisen waaraan de administratie, bedoeld in het eerste lid, moet voldoen;

      b. het tijdstip van indiening, alsmede de inrichting en inhoud van de verslagen en het rapport, bedoeld in het
      derde lid,

      c. de aandachtspunten voor de accountantscontrole.

      6 Het in het derde en vierde lid bedoelde financieel verslag behoeft de instemming van het College
      zorgverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
      [ref2]: https://wetten.overheid.nl/BWBR0012781#Artikel8
