        artikel: '2'
  - number: '4'
    text: >-
      1 De SVB deelt de belanghebbende zo spoedig mogelijk nadat hij zich voor de vrijwillige verzekering heeft
      aangemeld, mee:


      a. de hoogte van de verschuldigde AWBZ-premie;


      b. de termijn waarbinnen de AWBZ-premie dient te worden betaald;


      c. de wijze waarop de AWBZ-premie aan de SVB dient te worden betaald.


      2 De belanghebbende betaalt de AWBZ-premie per kalenderjaar vooruit.


      3 De SVB kan op verzoek van belanghebbende, een andere regeling treffen ten aanzien van de betaling van de AWBZ-
      premie.


      4 De betaling van de AWBZ-premie geschiedt in een voor Nederland wettig betaalmiddel.
    url: https://wetten.overheid.nl/BWBR0012781/2001-09-14#Artikel4
  - number: '5'
    text: |-
      1 De SVB kan de verschuldigde AWBZ-premie over een kalenderjaar voorlopig vaststellen, indien:

      a. zij bij de vaststelling van die premie rekening dient te houden met de in dat kalenderjaar verschuldigde premie
      op grond van de AWBZ-verzekering van rechtswege of

      b. nog onduidelijk is of [artikel 2, tweede lid][ref1], van toepassing is.

      2 Zodra zulks naar het oordeel van de SVB mogelijk is, wordt de over het bedoelde kalenderjaar verschuldigde AWBZ-
      premie definitief vastgesteld.

      3 Te veel betaalde AWBZ-premie wordt terugbetaald. Nog verschuldigde AWBZ-premie wordt binnen een door de SVB vast
      te stellen termijn betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0012781#Artikel2
    url: https://wetten.overheid.nl/BWBR0012781/2001-09-14#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012781
        artikel: '2'
  - number: '6'
    text: |-
      1 Indien de vrijwillige verzekering is geëindigd met toepassing van [artikel 32c, eerste lid, van de AWBZ][ref1],
      wordt voorzover dit nog niet heeft plaatsgevonden, de over een kalenderjaar verschuldigde AWBZ-premie definitief
      vastgesteld.

      2 [Artikel 5, derde lid][ref2], is van overeenkomstige toepassing.

      3 Indien de vrijwillige verzekering is geëindigd op grond van
      [artikel 32c, eerste lid, onder d of e, van de AWBZ][ref3], vindt restitutie van teveel betaalde AWBZ-premie niet
      plaats.

      4 Indien de verzekering is geëindigd met toepassing van [artikel 32c, eerste lid, onder d, van de AWBZ][ref4],
      kan het uitvoeringsorgaan waarbij betrokkene als vrijwillig verzekerde is ingeschreven, de kosten van medische
      zorg die door hem op grond van de vrijwillige verzekering zijn betaald over het tijdvak waarover geen of slechts
      gedeeltelijke premiebetaling heeft plaatsgevonden, geheel of gedeeltelijk van betrokkene terugvorderen. De
      vordering kan worden verhoogd met een door dat uitvoeringsorgaan vast te stellen bedrag voor administratie- en
      invorderingskosten. De SVB stelt het uitvoeringsorgaan in kennis van het bedrag van de openstaande premievordering.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel32c
      [ref2]: https://wetten.overheid.nl/BWBR0012781#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0002614#Artikel32c
      [ref4]: https://wetten.overheid.nl/BWBR0002614#Artikel32c
