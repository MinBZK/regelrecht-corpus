  - number: '8'
    text: >-
      1 De SVB ontvangt voor de uitvoering van de vrijwillige verzekering een vergoeding ten laste van het AFBZ volgens
      door het College zorgverzekeringen te stellen beleidsregels.


      2 De in het eerste lid bedoelde beleidsregels behoeven de goedkeuring van Onze Minister van Volksgezondheid,
      Welzijn en Sport.
    url: https://wetten.overheid.nl/BWBR0012781/2001-09-14#Artikel8
  - number: '9'
    text: >-
      Bij ministeriële regeling van Onze Minister van Volksgezondheid, Welzijn en Sport kunnen regels worden gesteld met
      betrekking tot de afdracht van premie voor de vrijwillige verzekering door de SVB aan het AFBZ.
    url: https://wetten.overheid.nl/BWBR0012781/2001-09-14#Artikel9
  - number: '10'
    text: |-
      In afwijking van [artikel 3, tweede lid][ref1], wordt tot 1 januari 2002 buiten Nederland ontvangen inkomen in
      de valuta van het desbetreffende land vastgesteld en met behulp van de door de Nederlandse Bank NV vastgestelde
      wisselkoersen omgerekend in Nederlandse valuta.


      [ref1]: https://wetten.overheid.nl/BWBR0012781#Artikel3
