    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Volksgezondheid, Welzijn en Sport van 10 mei 2001, kenmerk Z/VV-2180128;


    Gelet op de artikelen 25 tot en met 27 en 40, eerste lid, van de Wet financiering volksverzekeringen en op artikel
    32c, derde lid, van de Algemene Wet Bijzondere Ziektekosten;


    De Raad van State gehoord (advies van 5 juli 2001, nummer W13.01.0224/III);


    Gezien het nader rapport van Onze Minister van Volksgezondheid, Welzijn en Sport, van 20 augustus 2001, kenmerk
    ZIVV 2200443;


    Hebben goedgevonden en verstaan:
