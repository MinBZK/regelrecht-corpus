  - number: '2'
    text: |-
      1 De AWBZ- premie wordt voor elk in de periode van vrijwillige verzekering gelegen vol kalenderjaar, vastgesteld
      volgens de formule: PxH-K, waarbij

      a. P gelijk is aan het percentage dat op grond van [artikel 11, tweede lid, van de WFV][ref1] voor dat kalenderjaar
      is vastgesteld;

      b. H gelijk is aan het hoogste bedrag dat voor dat kalenderjaar als premie-inkomen in de zin van
      [artikel 8 van de WFV ][ref2]in aanmerking komt, te weten het als tweede vermelde bedrag in kolom II van de
      tarieftabel in [artikel 2.10 van de Wet inkomstenbelasting 2001][ref3];

      c. K gelijk is aan de algemene heffingskorting, bedoeld in [artikel 8.10 van de Wet inkomstenbelasting 2001][ref4],
      vermenigvuldigd met een breuk, met in de teller het percentage dat op grond van
      [artikel 11, tweede lid, van de WFV][ref5] voor dat kalenderjaar is vastgesteld en in de noemer de som van de
      percentages, bedoeld in de [artikelen 10a][ref6] en [11 van de WFV][ref7], en het percentage behorende bij de
      eerste belastingschijf, bedoeld in [artikel 2.10 van de Wet inkomstenbelasting 2001][ref8], zoals die percentages
      voor dat kalenderjaar zijn vastgesteld.

      2 In afwijking van het eerste lid is, indien ten genoegen van de SVB aannemelijk is gemaakt dat zulks
      tot een lagere uitkomst leidt, H gelijk aan het premie-inkomen voor de premieheffing in de zin van
      [artikel 8 van de WFV][ref9], en K gelijk aan de voor de premieplichtige toepasselijke heffingskorting berekend op
      grond van [artikel 10 van de WFV][ref10].

      3 Voorzover de AWBZ-premie slechts is verschuldigd voor een gedeelte van een kalenderjaar, wordt de overeenkomstig
      het eerste en het tweede lid berekende AWBZ-premie verminderd naar evenredigheid van dat gedeelte van een
      kalenderjaar.

      4 In afwijking van het eerste, tweede en derde lid, stelt de SVB, op verzoek van de belanghebbende die een gedeelte
      van een kalenderjaar van rechtswege AWBZ-verzekerd is geweest, de AWBZ-premie over dat kalenderjaar zodanig
      vast, dat de over het gehele kalenderjaar verschuldigde premie voor de AWBZ-verzekering van rechtswege en voor de
      vrijwillige verzekering tezamen niet meer bedraagt dan het premiebedrag dat de belanghebbende maximaal verschuldigd
      zou zijn, indien hij in dat gehele kalenderjaar van rechtswege verschuldigd zou zijn geweest.


