  - number: '3'
    text: |-
      1 Bij de toepassing van [artikel 2][ref1] wordt de waarde van inkomen in natura door de SVB geschat, waarbij wordt
      uitgegaan van de waarde van dat inkomen in het land, waar het wordt of werd ontvangen.

      2 Bij de toepassing van [artikel 2][ref2] wordt buiten Nederland ontvangen inkomen, voorzover dat niet in euro is
      uitgedrukt, in de valuta van het desbetreffende land vastgesteld en met behulp van de door de Nederlandse Bank NV
      vastgestelde wisselkoers omgerekend in euro.


      [ref1]: https://wetten.overheid.nl/BWBR0012781#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012781#Artikel2
    url: https://wetten.overheid.nl/BWBR0012781/2001-09-14#Artikel3
