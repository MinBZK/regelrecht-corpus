articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. de AWBZ: de [Algemene Wet Bijzondere Ziektekosten][ref1];

      b. de WFV: de [Wet financiering volksverzekeringen][ref2];

      c. de SVB: de Sociale Verzekeringsbank, genoemd in hoofdstuk 3 van de Organisatiewet sociale verzekeringen 1997;

      d. vrijwillige verzekering: de vrijwillige verzekering, bedoeld in [artikel 32a van de AWBZ][ref3];

      e. vrijwillig verzekerde: een persoon als bedoeld in [artikel 32a van de AWBZ][ref4], die is toegelaten tot de
      vrijwillige verzekering;

      f. AWBZ-premie: de premie voor de vrijwillige verzekering;

      g. het College zorgverzekeringen: het college, genoemd in [artikel 1a, van de Ziekenfondswet][ref5];

      h. het AFBZ: het Algemeen Fonds Bijzondere Ziektekosten, bedoeld in [artikel 38 van de WFV][ref6];

      i. uitvoeringsorgaan: een ziekenfonds, een ziektekostenverzekeraar en een uitvoerend orgaan als bedoeld in de AWBZ.


