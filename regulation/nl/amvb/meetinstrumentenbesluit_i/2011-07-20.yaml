preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Economische Zaken van 3 maart 2006, nr. WJZ 6015750;

    Gelet op richtlijn nr. 2004/22/EG van het Europees Parlement en de Raad van de Europese Unie van 31 maart 2004,
    betreffende meetinstrumenten (PbEU L 135), richtlijn nr. 90/384/EEG van de Raad van de Europese Gemeenschappen
    van 20 juni 1990 betreffende de harmonisatie van de wetgevingen van de Lid-Staten inzake niet-automatische
    weegwerktuigen (PbEG L 189), en de artikelen 5, 9 en 26 van de Metrologiewet;

    De Raad van State gehoord (advies van 21 april 2006, nr. W10.06.0064/II);

    Gezien het nader rapport van Onze Minister van Economische Zaken van 18 mei 2006, nr. WJZ 6036397;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel1
  - number: 1.a
    text: |-
      wet: [Metrologiewet][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0019517
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0019517
  - number: 1.b
    text: |-
      richtlijn meetinstrumenten: [richtlijn nr. 2004/22/EG](32004L0022) van het Europees Parlement en de Raad van de
      Europese Unie van 31 maart 2004, betreffende meetinstrumenten (PbEU L 135);
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel1
  - number: 1.c
    text: |-
      *richtlijn niet-automatische weegwerktuigen:* richtlijn nr. 2009/23/EG van het Europees Parlement en de Raad van de
      Europese Unie van 23 april 2009 betreffende niet-automatische weegwerktuigen (PbEU L 122);
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel1
  - number: 1.d
    text: |-
      fabrikant: de natuurlijke persoon of de rechtspersoon die verantwoordelijk is voor de overeenstemming van het
      meetinstrument met de bij of krachtens de [wet][ref1] gestelde eisen aan het instrument voordat het in de handel
      wordt gebracht of in gebruik wordt genomen, waarbij hij als doel heeft dat meetinstrument onder eigen naam in de
      handel te brengen of voor eigen doeleinden in gebruik te nemen;


      [ref1]: https://wetten.overheid.nl/BWBR0019517
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0019517
  - number: 1.e
    text: |-
      CE-markering: markering, overeenkomstig het model van punt I.B.d) van de bijlage bij besluit nr. 93/465/EEG van
      de Raad van de Europese Gemeenschappen van 22 juli 1993 betreffende de modules voor de verschillende fasen van
      de overeenstemmingsprocedures en de voorschriften inzake het aanbrengen en het gebruik van de CE-markering van
      overeenstemming (PbEG L 220);
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel1
  - number: 1.f
    text: |-
      instrumentspecifieke bijlage: bijlage MI-001, MI-002, MI-003, MI-004, MI-005, MI-006, MI-007, MI-008, MI-009 of MI-
      010 bij de richtlijn meetinstrumenten;
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel1
  - number: 1.g
    text: |-
      beoordelingsprocedurebijlage: bijlage A, A1, B, C, C1, D, D1, E, E1, F, F1, G, H of H1 bij de richtlijn
      meetinstrumenten;
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel1
  - number: 1.h
    text: |-
      niet-automatisch weegwerktuig: werktuig voor het bepalen van de massa van een lichaam met gebruikmaking van de
      werking van de zwaartekracht op dat lichaam, waarbij voor het wegen tussenkomst van een bedienaar noodzakelijk
      is, alsmede zodanige werktuigen die bovendien worden gebruikt voor het bepalen van met de massa verband houdende
      grootheden, hoeveelheden, parameters of kenmerken.
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel1
  - number: '2'
    text: |-
      Een meettaak ten behoeve van een specifieke toepassing als bedoeld in [artikel 5, eerste lid, van de wet][ref1]
      is het bij het drijven van handel, bij levering uit hoofde van beroep of bedrijf en bij het vaststellen van
      belastingen of van andere heffingen:


      [ref1]: https://wetten.overheid.nl/BWBR0019517#Artikel5
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0019517
        artikel: '5'
  - number: 2.a
    text: |-
      meten van een stromende hoeveelheid gasvormige brandstof, al dan niet onder herleiding van de onder
      meetomstandigheden gemeten hoeveelheid naar een hoeveelheid onder basisomstandigheden, voor huishoudelijk gebruik,
      handelsgebruik of licht industrieel gebruik;
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel2
  - number: 2.b
    text: |-
      meten van binnen een stroomkring verbruikte actieve elektrische energie voor huishoudelijk gebruik, handelsgebruik
      of licht industrieel gebruik;
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel2
  - number: 2.c
    text: |-
      continu en dynamisch meten in volume of massa van stromende vloeistoffen met uitzondering van water, al
      dan niet onder herleiding van de onder meetomstandigheden gemeten hoeveelheid naar een hoeveelheid onder
      basisomstandigheden, binnen een gesloten leiding, ten behoeve van
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel2
  - number: 2.c.1°
    text: |-
      het vaststellen van een hoeveelheid brandstof, al dan niet in de vorm van een vloeibaar gas, bij het tanken van
      motorvoertuigen, kleine schepen en kleine vliegtuigen;
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel2
  - number: 2.c.2°
    text: het vaststellen van een hoeveelheid cryogene vloeistoffen;
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel2
  - number: 2.c.3°
    text: het vaststellen van een hoeveelheid vloeistoffen bij het laden van schepen, of
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel2
  - number: 2.c.4°
    text: het in andere gevallen vaststellen van een hoeveelheid vloeistoffen;
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel2
  - number: 2.d
    text: |-
      bepalen van de massa van een lichaam op grond van de werking van de zwaartekracht op dat lichaam, zonder
      tussenkomst van een bedienaar en volgens een vooraf bepaald programma van automatische processen, en in het
      bijzonder
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel2
  - number: 2.d.1°
    text: |-
      het bepalen van de massa van vooraf samengevoegde afzonderlijke lasten of enkelvoudige lasten los materiaal, al dan
      niet met onderverdeling van artikelen met een verschillende massa of ter controle van voorverpakkingen;
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel2
  - number: 2.d.2°
    text: |-
      het bepalen van de massa bij het vullen van houders met een vooraf bepaalde en vrijwel constante hoeveelheid
      bulkgoed;
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel2
  - number: 2.d.3°
    text: |-
      het bepalen van de massa van bulkgoed door het in afzonderlijke lasten te verdelen, vervolgens de massa van de
      afzonderlijke last te bepalen en tenslotte de massa van de afzonderlijke lasten bij elkaar op te tellen;
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel2
  - number: 2.d.4°
    text: het ononderbroken bepalen van de massa van bulkgoed op een continue bewegende transportband;
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel2
  - number: 2.d.5°
    text: het bepalen van de massa van treinen en spoorwegwagons;
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel2
  - number: 2.e
    text: |-
      op basis van een door een afstandssignaalgenerator afgegeven signaal berekenen van afstand en het meten van
      tijdsduur in verband met het vaststellen van vergoedingen voor taxivervoer;
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel2
  - number: 2.f
    text: bepalen van de lengte van de randen van het kleinste omhullende rechthoekige parallellepipedum van een product.
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel2
  - number: '3'
    text: |-
      Een meettaak ten behoeve van een specifieke toepassing als bedoeld in [artikel 5, eerste lid, van de wet][ref1]
      is het


      [ref1]: https://wetten.overheid.nl/BWBR0019517#Artikel5
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0019517
        artikel: '5'
  - number: 3.a
    text: bij het drijven van handel,
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel3
  - number: 3.b
    text: |-
      bij het berekenen van een recht, heffing, belasting, premie, boete, vergoeding of soortgelijke verschuldigde
      bedragen,
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel3
  - number: 3.c
    text: |-
      bij de toepassing van wettelijke regelingen of andere besluiten van bestuursorganen of voor gerechtelijke
      expertise,
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel3
  - number: 3.d
    text: |-
      bij het bepalen van de prijs op grond van de massa voor rechtstreekse verkoop aan het publiek en voor voorverpakte
      artikelen,
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel3
  - number: 3.e
    text: |-
      bij het bepalen van de massa in de medische praktijk voor het wegen van patiënten voor observatie, diagnose en
      medische behandelingen,
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel3
  - number: 3.f
    text: |-
      bij het bepalen van de massa voor de vervaardiging van medicijnen op voorschrift in de apotheek en het bepalen van
      de massa tijdens analyses die in medische en farmaceutische laboratoria worden uitgevoerd,
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel3
  - number: '4'
    text: |-
      Meetinstrumenten en onderdelen als bedoeld in de onderdelen a tot en met f voldoen voordat zij in de handel worden
      gebracht, in gebruik worden genomen of voor ingebruikneming verder worden verhandeld, aan de in bijlage I van de
      richtlijn meetinstrumenten opgenomen essentiële eisen en aan de toepasselijke essentiële eisen in de hierna bij het
      meetinstrument vermelde instrumentspecifieke bijlage:
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel4
  - number: 4.a
    text: |-
      gasmeters en volumeherleidingsinstrumenten met een in [artikel 2, onder a][ref1], vermelde taak: bijlage MI-002;


      [ref1]: https://wetten.overheid.nl/BWBR0019897#Artikel2
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0019897
        artikel: '2'
        hoofdstuk: '2'
  - number: 4.b
    text: |-
      kilowattuurmeters met een in [artikel 2, onder b][ref1], vermelde taak: bijlage MI-003;


      [ref1]: https://wetten.overheid.nl/BWBR0019897#Artikel2
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0019897
        artikel: '2'
        hoofdstuk: '2'
  - number: 4.c
    text: |-
      vloeistofmeetinstallaties met een in [artikel 2, onderdeel c][ref1], bedoelde taak: bijlage MI-005;


      [ref1]: https://wetten.overheid.nl/BWBR0019897#Artikel2
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0019897
        artikel: '2'
        hoofdstuk: '2'
  - number: 4.d
    text: |-
      automatische weeginstrumenten met een in [artikel 2, onderdeel d][ref1], bedoelde taak: bijlage MI-006;


      [ref1]: https://wetten.overheid.nl/BWBR0019897#Artikel2
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0019897
        artikel: '2'
        hoofdstuk: '2'
  - number: 4.e
    text: |-
      taxameters met een in [artikel 2, onderdeel e][ref1], bedoelde taak: bijlage MI-007;


      [ref1]: https://wetten.overheid.nl/BWBR0019897#Artikel2
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0019897
        artikel: '2'
        hoofdstuk: '2'
  - number: 4.f
    text: |-
      multidimensionale meetinstrumenten met een in [artikel 2, onderdeel f][ref1], bedoelde taak: bijlage MI-009,
      hoofdstukken I en IV.


      [ref1]: https://wetten.overheid.nl/BWBR0019897#Artikel2
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0019897
        artikel: '2'
        hoofdstuk: '2'
  - number: '5.1'
    text: |-
      Een niet-automatisch weegwerktuig met een meettaak ten behoeve van een specifieke toepassing als bedoeld in
      [artikel 3][ref1] voldoet voordat het in de handel wordt gebracht, in gebruik wordt genomen, voor in gebruikneming
      verder wordt verhandeld of wordt gebruikt aan de fundamentele voorschriften van bijlage I van de richtlijn niet-
      automatische weegwerktuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0019897#Artikel3
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0019897
        artikel: '3'
        hoofdstuk: '2'
  - number: '5.2'
    text: |-
      Indien het niet-automatische weegwerktuig inrichtingen bevat of is aangesloten op inrichtingen die niet voor de
      meettaak in een specifiek toepassingsgebied als bedoeld in [artikel 3][ref1] bestemd zijn, gelden de in het eerste
      lid bedoelde voorschriften niet voor die inrichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0019897#Artikel3
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0019897
        artikel: '3'
        hoofdstuk: '2'
  - number: '6.1'
    text: |-
      Meetinstrumenten als bedoeld in de onderdelen a tot en met g en in voorkomend geval nader geduid in de hierna
      bij het meetinstrument vermelde instrumentspecifieke bijlage, voldoen ten behoeve van verkrijging van een CE-
      markering en de aanvullende metrologische markering aan de in bijlage I van de richtlijn meetinstrumenten opgenomen
      essentiële eisen en aan de toepasselijke essentiële eisen in de desbetreffende instrumentspecifieke bijlage:
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel6
  - number: 6.1.a
    text: 'watermeters bestemd voor huishoudelijk, handels- en licht industrieel gebruik: bijlage MI-001;'
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel6
  - number: 6.1.b
    text: |-
      warmtemeters bestemd voor huishoudelijk, handels- of licht industrieel gebruik en de in bijlage MI-004 genoemde
      onderdelen: bijlage MI-004;
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel6
  - number: 6.1.c
    text: 'lengtematen: bijlage MI-008, hoofdstuk I;'
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel6
  - number: 6.1.d
    text: 'inhoudsmaten: bijlage MI-008, hoofdstuk II;'
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel6
  - number: 6.1.e
    text: 'lengtemeetinstrumenten: bijlage MI-009, hoofdstukken I en II;'
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel6
  - number: 6.1.f
    text: 'oppervlaktemeetinstrumenten: bijlage MI-009, hoofdstukken I en III;'
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel6
  - number: 6.1.g
    text: |-
      uitlaatgasanalysatoren bestemd voor inspectie en professioneel onderhoud van in gebruik zijnde motorvoertuigen:
      bijlage MI-010.
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel6
  - number: '6.2'
    text: |-
      Het is verboden de in het eerste lid bedoelde meetinstrumenten voorzien van een CE- markering en de aanvullende
      metrologische markering, in de handel te brengen, in gebruik te nemen of voor ingebruikneming verder te
      verhandelen, indien zij niet aan de in het eerste lid bedoelde eisen voldoen.
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel6
  - number: '7.1'
    text: |-
      Een instrument als bedoeld in [artikel 4][ref1] of [artikel 6][ref2] wordt vermoed overeen te stemmen met de
      in bijlage I van de richtlijn meetinstrumenten en in de toepasselijke instrumentspecifieke bijlage opgenomen
      essentiële eisen, indien het voldoet aan:


      [ref1]: https://wetten.overheid.nl/BWBR0019897#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0019897#Artikel6
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0019897
        artikel: '4'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0019897
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 7.1.a
    text: |-
      de normen waarmee de in artikel 13, eerste lid, van die richtlijn bedoelde geharmoniseerde normen voor het
      betrokken meetinstrument in Nederland ten uitvoer zijn gelegd en waarvan de referentienummers door Onze Minister in
      de Staatscourant zijn bekendgemaakt,
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel7
  - number: 7.1.b
    text: |-
      de normen waarmee de onder a bedoelde geharmoniseerde normen in een andere lidstaat van de Europese Unie of in een
      andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte ten uitvoer zijn gelegd
      en waarvan de referentienummers in die lidstaat van de Europese Unie of andere staat zijn bekendgemaakt, of
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel7
  - number: 7.1.c
    text: |-
      de met de voor het betrokken meetinstrument gestelde essentiële eisen overeenkomende delen van normatieve
      documenten en lijsten als bedoeld in artikel 13, tweede lid, van de richtlijn meetinstrumenten waarvan
      de referenties zijn bekendgemaakt in de C-reeks van het Publicatieblad van de Europese Unie, alsmede zijn
      bekendgemaakt in de Staatscourant door Onze Minister of zijn bekendgemaakt in een lidstaat van de Europese Unie of
      een andere staat als bedoeld onder b.
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel7
  - number: '7.2'
    text: |-
      Indien een meetinstrument slechts ten dele voldoet aan de in het eerste lid bedoelde normen of normatieve
      documenten wordt voor dat gedeelte overeenstemming vermoed met de essentiële eisen die overeenkomen met het deel
      van die normen of normatieve documenten waaraan het meetinstrument voldoet.
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel7
  - number: '8.1'
    text: |-
      Een niet-automatisch weegwerktuig als bedoeld in [artikel 5][ref1] wordt vermoed overeen te stemmen met de in
      bijlage I van de richtlijn niet-automatische weegwerktuigen opgenomen fundamentele voorschriften, indien het
      voldoet aan:


      [ref1]: https://wetten.overheid.nl/BWBR0019897#Artikel5
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0019897
        artikel: '5'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 8.1.a
    text: |-
      de normen waarmee de in artikel 6, eerste lid, van die richtlijn bedoelde geharmoniseerde normen in Nederland ten
      uitvoer zijn gelegd en waarvan de referentienummers door Onze Minister in de Staatscourant zijn bekendgemaakt, of
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel8
  - number: 8.1.b
    text: |-
      de normen waarmee de onder a bedoelde geharmoniseerde normen in een andere lidstaat van de Europese Unie of in een
      andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte ten uitvoer zijn gelegd
      en waarvan de referentienummers in die lidstaat van de Europese Unie of andere staat zijn bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel8
  - number: '8.2'
    text: |-
      [Artikel 7, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019897#Artikel7
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0019897
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '9.1'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot de eisen waar de in de [artikelen 4][ref1] en
      [5][ref2] bedoelde meetinstrumenten bij gebruik aan moeten voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0019897#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0019897#Artikel5
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0019897
        artikel: '4'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0019897
        artikel: '5'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '9.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de wijze van installatie en anderszins
      omtrent de omstandigheden waaronder een meetinstrument als bedoeld in [artikel 4][ref1] of [artikel 5][ref2] wordt
      gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0019897#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0019897#Artikel5
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0019897
        artikel: '4'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0019897
        artikel: '5'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '10'
    text: |-
      Een geregeld meetinstrument als bedoeld in [artikel 4][ref1] of een meetinstrument als bedoeld in [artikel 6][ref2]
      ondergaat, naar keuze van de fabrikant, één van de in de instrumentspecifieke bijlage voor dat instrument
      aangegeven overeenstemmingsbeoordelingen volgens de beoordelingsprocedurebijlagen.


      [ref1]: https://wetten.overheid.nl/BWBR0019897#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0019897#Artikel6
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0019897
        artikel: '4'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0019897
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '11.1'
    text: |-
      De fabrikant mag elke technische oplossing kiezen die voldoet aan de in bijlage I van de richtlijn meetinstrumenten
      en in de instrumentspecifieke bijlage opgenomen essentiële eisen.
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel11
  - number: '11.2'
    text: |-
      De fabrikant hoeft de overeenstemming van het instrument met de in het eerste lid bedoelde eisen niet aan te tonen
      wanneer hij:
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel11
  - number: 11.2.a
    text: |-
      de in de relevante geharmoniseerde Europese normen bedoelde oplossingen voor dat meetinstrument op juiste wijze
      toepast;
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel11
  - number: 11.2.b
    text: |-
      hij de oplossingen toepast die in de in [artikel 7, eerste lid][ref1], bedoelde normen of normatieve documenten
      zijn weergegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0019897#Artikel7
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0019897
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '11.3'
    text: |-
      Indien de overeenstemmingsbeoordelingsprocedure voorziet in een test, wordt vermoed dat voldaan is
      aan die test wanneer het met die test overeenkomende testprogramma is uitgevoerd overeenkomstig de in
      [artikel 7, eerste lid][ref1], bedoelde normen of normatieve documenten en de testresultaten garanderen dat aan
      de essentiële eisen die zijn opgenomen in bijlage I van de richtlijn meetinstrumenten en in de toepasselijke
      instrumentspecifieke bijlage, is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0019897#Artikel7
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0019897
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '12.1'
    text: |-
      Een niet-automatisch weegwerktuig als bedoeld in [artikel 5][ref1] ondergaat naar keuze van de aanvrager een
      overeenstemmingsbeoordeling volgens één van de in artikel 9, eerste lid, onder a en b, van de richtlijn niet-
      automatische weegwerktuigen bedoelde procedures.


      [ref1]: https://wetten.overheid.nl/BWBR0019897#Artikel5
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0019897
        artikel: '5'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '12.2'
    text: |-
      De bescheiden en briefwisseling met betrekking tot de in het eerste lid bedoelde procedures zijn gesteld in de
      Nederlandse taal of in een andere taal die door de bij de procedure betrokken aangewezen instantie is aanvaard.
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel12
  - number: '13.1'
    text: |-
      De fabrikant verricht de werkzaamheden en komt de verplichtingen na die in verband met de
      overeenstemmingsbeoordeling volgens de desbetreffende beoordelingsprocedurebijlage of volgens de gekozen procedure
      van overeenstemmingsbeoordeling, bedoeld in [artikel 12][ref1], aan hem zijn opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0019897#Artikel12
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0019897
        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '13.2'
    text: |-
      De fabrikant kan overeenkomstig de desbetreffende beoordelingsprocedurebijlage of overeenkomstig de gekozen
      procedure van overeenstemmingsbeoordeling, bedoeld in [artikel 12][ref1], een in de Europese Gemeenschap gevestigde
      natuurlijke persoon of rechtspersoon schriftelijk machtigen namens hem op te treden ten aanzien van bepaalde
      verplichtingen en werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0019897#Artikel12
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0019897
        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '13.3'
    text: |-
      Indien de fabrikant niet in de Europese Gemeenschap is gevestigd en niet een machtiging als bedoeld in het tweede
      lid heeft verstrekt, komt degene die het instrument in de handel brengt, de verplichtingen na voor zover de
      beoordelingsprocedurebijlage dat voorschrijft.
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel13
  - number: '14.1'
    text: |-
      Voor een geregeld meetinstrument als bedoeld in [artikel 4][ref1] of [artikel 5][ref2] dat in gebruik is genomen,
      bestaat de overeenstemmingsbeoordeling uit een keuring.


      [ref1]: https://wetten.overheid.nl/BWBR0019897#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0019897#Artikel5
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0019897
        artikel: '4'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0019897
        artikel: '5'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '14.2'
    text: Bij ministeriële regeling kunnen nadere regels ten aanzien van de keuring worden gesteld.
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel14
  - number: '15.1'
    text: |-
      De aangewezen instantie die toetsende werkzaamheden verricht in het kader van een overeenstemmingsbeoordeling
      als bedoeld in [artikel 10][ref1] of [artikel 12][ref2] draagt daarbij zorg voor de uitvoering van haar met die
      toetsende werkzaamheden samenhangende verplichtingen die in de beoordelingsprocedurebijlage of in de gekozen
      procedure van overeenstemming, bedoeld in [artikel 12][ref3], zijn voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0019897#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0019897#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0019897#Artikel12
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0019897
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019897
        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0019897
        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '15.2'
    text: |-
      Voor zover de beoordelingsprocedurebijlage voorziet in de verplichting tot het verstrekken van gegevens aan de
      lidstaat door wie de aangewezen instantie is aangewezen, dan wel aan andere lidstaten, geldt dat in Nederland de
      gegevens worden verstrekt aan de toezichthoudende instantie.
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel15
  - number: '15.3'
    text: |-
      Voor zover een procedure van overeenstemmingsbeoordeling als bedoeld in [artikel 12][ref1] voorziet in het
      verstrekken van gegevens aan de Lid-Staten van de Europese Unie, geldt dat deze verstrekking geschiedt door
      tussenkomst van de toezichthoudende instantie.


      [ref1]: https://wetten.overheid.nl/BWBR0019897#Artikel12
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0019897
        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '15.4'
    text: |-
      De in [artikel 14][ref1] bedoelde keuring wordt verricht door een aangewezen instantie of door een natuurlijke
      persoon of rechtspersoon die beschikt over een erkenning als bedoeld in [artikel 11 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019897#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0019517#Artikel11
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0019897
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019517
        artikel: '11'
  - number: '16.1'
    text: |-
      De overeenstemming van een in de handel te brengen of in gebruik te nemen meetinstrument als bedoeld in
      [artikel 4][ref1] of [artikel 6][ref2] met de bij of krachtens de [wet][ref3] gestelde eisen blijkt uit de CE-
      markering en de aanvullende metrologische markering, zoals beschreven in artikel 17, tweede lid, van de richtlijn
      meetinstrumenten.


      [ref1]: https://wetten.overheid.nl/BWBR0019897#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0019897#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0019517
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0019897
        artikel: '4'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0019897
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0019517
  - number: '16.2'
    text: |-
      De in het eerste lid bedoelde markeringen alsmede andere opschriften worden aangebracht door de fabrikant of door
      een andere persoon onder verantwoordelijkheid van de fabrikant overeenkomstig de artikelen 7 en 17 van de richtlijn
      meetinstrumenten en de toepasselijke overeenstemmingsbeoordelingsprocedure.
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel16
  - number: '17.1'
    text: |-
      De overeenstemming van een in de handel te brengen of in gebruik te nemen weegwerktuig als bedoeld in
      [artikel 5][ref1] met de bij of krachtens de [wet][ref2] gestelde eisen blijkt uit de CE-markering en de
      aanvullende gegevens zoals omschreven in bijlage IV, punt 1, van de richtlijn niet-automatische weegwerktuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0019897#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0019517
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0019897
        artikel: '5'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0019517
  - number: '17.2'
    text: |-
      De in het eerste lid bedoelde markering en gegevens worden duidelijk zichtbaar, gemakkelijk leesbaar en
      onuitwisbaar aangebracht. Op de werktuigen mogen andere markeringen worden aangebracht, mits de zichtbaarheid en
      leesbaarheid van de CE-markering niet worden verminderd.
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel17
  - number: '17.3'
    text: |-
      Indien [artikel 5, tweede lid][ref1], van toepassing is, moet op elk van die inrichtingen die niet aan een
      overeenstemmingsbeoordeling als bedoeld in [artikel 12][ref2] zijn onderworpen het beperkend gebruikssymbool,
      als omschreven in bijlage IV, punt 3, van de richtlijn niet-automatische weegwerktuigen, duidelijk zichtbaar en
      onuitwisbaar zijn aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0019897#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0019897#Artikel12
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0019897
        artikel: '5'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0019897
        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '18.1'
    text: |-
      Een niet-automatisch weegwerktuig dat niet bestemd is voor een specifieke toepassing als bedoeld in
      [artikel 3][ref1] wordt voorzien van de in bijlage IV, punt 2, van de richtlijn niet-automatische weegwerktuigen
      bedoelde opschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0019897#Artikel3
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0019897
        artikel: '3'
        hoofdstuk: '2'
  - number: '18.2'
    text: |-
      [Artikel 17, tweede lid, eerste volzin][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0019897#Artikel17
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0019897
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '18.3'
    text: |-
      Het is verboden niet-automatische weegwerktuigen als bedoeld in het eerste lid in de handel te brengen indien zij
      niet aan de in het eerste lid bedoelde vereisten voldoen.
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel18
  - number: '19.1'
    text: |-
      Wanneer een meetinstrument als bedoeld in [artikel 4][ref1], [5][ref2] of [6][ref3] met betrekking tot andere
      aspecten valt onder bepalingen die zijn vastgesteld krachtens een andere richtlijn van de Raad van de Europese
      Unie of van de Raad en het Europees Parlement en die voorzien in het aanbrengen van de CE-markering, geeft deze
      markering aan dat het meetinstrument ook geacht wordt in overeenstemming te zijn met de vereisten van die andere
      richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0019897#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0019897#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0019897#Artikel6
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0019897
        artikel: '4'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0019897
        artikel: '5'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0019897
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '19.2'
    text: |-
      De bij de toegepaste richtlijn voorgeschreven documenten, handleidingen of gebruiksaanwijzingen die bij het
      meetinstrument zijn gevoegd, vermelden de verwijzing naar het Publicatieblad van de Europese Unie waarin de
      toegepaste richtlijn is bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel19
  - number: '20.1'
    text: |-
      De overeenstemming van een in gebruik genomen geregeld meetinstrument dat ingevolge [artikel 7 van de wet][ref1]
      een overeenstemmingsbeoordeling heeft ondergaan, blijkt uit een merkteken waarvan het model bij ministeriële
      regeling wordt vastgesteld. Bij ministeriële regeling kunnen tevens regels worden gesteld omtrent de plaats en de
      wijze van aanbrengen van het merkteken.


      [ref1]: https://wetten.overheid.nl/BWBR0019517#Artikel7
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0019517
        artikel: '7'
  - number: '20.2'
    text: |-
      Het in het eerste lid bedoelde merkteken wordt aangebracht door een aangewezen instantie of een persoon die
      beschikt over een erkenning als bedoeld in [artikel 11 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019517#Artikel11
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0019517
        artikel: '11'
  - number: '21'
    text: |-
      Bij ministeriële regeling kunnen ten aanzien van de toepassing van een bijlage van de richtlijn meetinstrumenten of
      van een bijlage van de richtlijn niet-automatische weegwerktuigen nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel21
  - number: 21a
    text: |-
      Een wijziging van de richtlijn meetinstrumenten of van de richtlijn niet-automatische weegwerktuigen gaat voor
      de toepassing van dit besluit gelden met ingang van de dag waarop aan de betrokken wijziging uitvoering moet zijn
      gegeven, tenzij bij ministerieel besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel21a
  - number: '23'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel23
  - number: '24'
    text: 'Dit besluit wordt aangehaald als: Meetinstrumentenbesluit I.'
    url: https://wetten.overheid.nl/BWBR0019897/2011-07-20#Artikel24
