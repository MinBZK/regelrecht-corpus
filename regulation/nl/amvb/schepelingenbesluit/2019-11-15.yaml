preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de gemeenschappelijke voordracht van Onze Ministers van Justitie en van Waterstaat van 24 Februari 1937, 1ste
    Afdeeling C, n°. 885, en van 25 Februari 1937, La. L.L., Afd. Vervoer- en Mijnwezen;

    Den Raad van State gehoord, advies van 13 April 1937, n°. 42;

    Gezien het nader gemeenschappelijk rapport van Onze voornoemde Ministers van 7 Mei 1937, 1ste Afdeeling C, n°. 1201
    en van 11 Mei 1937, La. L., Afd. Vervoer- en Mijnwezen;

    Gelet op de artikelen 407, 412, 450d, 451d en 451i van het Wetboek van Koophandel;

    Hebben goedgevonden en verstaan:

    met ingang van den dag, waarop de Wet van 14 Juni 1930 (Staatsblad n°. 240) in werking treedt, de volgende
    bepalingen vast te stellen:
  url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#ArtikelAanhef
articles:
  - number: '36.1'
    text: |-
      De zeewerkgever is verplicht zorg te dragen, dat vóór den aanvang van de reis voldoende voeding aan boord is en dat
      deze voeding in behoorlijken staat verkeert.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel36
  - number: '36.2'
    text: |-
      De zeewerkgever is verplicht zorg te dragen, dat gedurende de reis de aan boord aanwezige voeding in behoorlijken
      toestand blijft en, indien dit noodig is, wordt aangevuld.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel36
  - number: '37.1'
    text: |-
      Bij het vaststellen van de soort en van de hoeveelheid mede te nemen voeding moet rekening gehouden worden met het
      aantal leden van de bemanning, den duur der reis, met den aard van de reis en de mogelijkheid tot aanvullen van de
      voorraden gedurende de reis.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel37
  - number: '37.2'
    text: Zorg dient te worden gedragen voor voldoende afwisseling in de dagelijksche voeding.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel37
  - number: '37.3'
    text: De voeding moet van voldoende hoedanigheid en voedingswaarde zijn.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel37
  - number: 37b.1
    text: |-
      Alle schepen moeten zijn uitgerust met voldoende kooktoestellen voor het bereiden van goede maaltijden. Op schepen
      met een lengte van 35 meter en meer moeten deze kooktoestellen zijn opgesteld in een afzonderlijke kombuis.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel37b
  - number: 37b.2
    text: |-
      De kombuis moet voldoende groot zijn. Met betrekking tot de verwarming, verlichting en ventilatie van de kombuis
      dient, voor zover toepasselijk, te worden voldaan aan het bepaalde in de [artikelen 51][ref1], [52][ref2] en
      [53][ref3] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0001985#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0001985#Artikel52
      [ref3]: https://wetten.overheid.nl/BWBR0001985#Artikel53
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel37b
    references:
      - id: ref1
        bwb_id: BWBR0001985
        artikel: '51'
        hoofdstuk: VII
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001985
        artikel: '52'
        hoofdstuk: VII
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0001985
        artikel: '53'
        hoofdstuk: VII
        paragraaf: '2'
  - number: 37b.3
    text: De kombuis moet zijn aangesloten op het systeem van stromend koud en warm zoetwater.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel37b
  - number: 37b.4
    text: |-
      De kombuis moet zijn uitgerust met voldoende keukengerei en de nodige kasten, planken en bordenrekken en gootstenen
      van roestvrij materiaal die van voldoende afvoermogelijkheden zijn voorzien.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel37b
  - number: 37b.5
    text: De kombuis moet zodanig zijn ingericht dat op elk ogenblik warme dranken kunnen worden gemaakt voor de bemanning.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel37b
  - number: '38'
    text: |-
      De [artikelen 36 tot en met 37b][ref1] en [40 tot en met 43][ref2] zijn slechts van toepassing op vissersvaartuigen
      als bedoeld in de [Wet zeevarenden][ref3]. De in de [artikelen 36][ref4] en [37][ref5] genoemde verplichtingen
      gelden daarbij alleen indien de werkgever de zorg voor de voeding bij de arbeidsovereenkomst uitdrukkelijk op zich
      heeft genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0001985#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0001985#Artikel40
      [ref3]: https://wetten.overheid.nl/BWBR0009124
      [ref4]: https://wetten.overheid.nl/BWBR0001985#Artikel36
      [ref5]: https://wetten.overheid.nl/BWBR0001985#Artikel37
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0001985
        artikel: '36'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0001985
        artikel: '40'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0009124
      - id: ref4
        bwb_id: BWBR0001985
        artikel: '36'
        hoofdstuk: V
      - id: ref5
        bwb_id: BWBR0001985
        artikel: '37'
        hoofdstuk: V
  - number: '39.1'
    text: |-
      De voeding moet gedurende de reis worden geborgen in van andere ruimten behoorlijk afgesloten bergplaatsen, zo
      gelegen en zonodig zodanig geventileerd en gekoeld, dat de voeding in goede toestand blijft.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel39
  - number: '39.2'
    text: |-
      De in het vorige lid bedoelde bergplaatsen moeten, alvorens daarin voedsel wordt geborgen, afdoende zijn gereinigd,
      terwijl gedurende de reis zorg moet worden gedragen, dat zij behoorlijk worden schoongehouden.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel39
  - number: '40'
    text: |-
      Voor de aanvang van de reis is de zeewerkgever, en gedurende de reis is de kapitein verplicht zorg te dragen, dat
      een voldoende hoeveelheid drinkwater aan boord is en dat dit water van behoorlijke hoedanigheid is.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel40
  - number: '41.1'
    text: |-
      Bij de beoordeling of de hoeveelheid drinkwater voldoende is, moet rekening worden gehouden met het aantal
      opvarenden, het aantal reisdagen en de mogelijkheid van aanvulling gedurende de reis, zonodig door distilleren.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel41
  - number: '41.2'
    text: |-
      Ongeacht de bevoegdheid van de kapitein om in noodgevallen het zoetwater te rantsoeneren, kan hij de leiding van
      stromend zoetwater sluiten, indien het verbruik meer dan 30 liter per schepeling per dag bedraagt.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel41
  - number: '42.1'
    text: |-
      Het drinkwater moet geborgen worden in daarvoor geschikte tanks, welke zodanig moeten worden afgesloten, dat geen
      vreemde bestanddelen in de tanks kunnen komen.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel42
  - number: '42.2'
    text: Voordat de tanks worden gevuld, moeten zij inwendig schoon zijn.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel42
  - number: '42.3'
    text: |-
      Telkenmale wanneer een tank voor onderzoek, onderhoud of anderszins is betreden, moet zij, alvorens in gebruik te
      mogen worden genomen, worden gevuld met drinkwater, waarin 10 gram vrij chloor per ton moet worden gemengd. Dit
      water moet, nadat het ten minste 2 uur in de tank is geweest, worden uitgepompt, waarna de tank mag worden gevuld.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel42
  - number: '42.4'
    text: |-
      Tijdens het laden van drinkwater moet daaraan per ton water worden toegevoegd een gestabiliseerd hypochloriet in
      zodanige hoeveelheid, dat minstens 0,7 g. vrij chloor per ton vrijkomt, dan wel een hoeveelheid gestabiliseerd
      hypochloriet benevens een hoeveelheid ammoniumzout zodanig, dat minstens 2,5 g. monochlooramine (NHCl) per ton
      ontstaat. Bedoelde toevoeging moet op zulk een wijze geschieden, dat behoorlijke menging gewaarborgd is. Onze
      Minister van Infrastructuur en Milieu kan gelijkwaardig geachte stoffen toelaten, welke in bepaalde hoeveelheden
      0,7 g. vrij chloor per ton water opleveren.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel42
  - number: '42.5'
    text: |-
      Tijdens het laden van het drinkwater moet zoveel mogelijk zorggedragen worden, dat de aanvoerslang door middel van
      balkjes of van andere geschikte middelen vrij van de kade gehouden wordt. Alvorens het uit een aanvoerslang komende
      water in een drinkwatertank geleid wordt, moet het water gedurende ten minste een minuut op de volle aanvoerdruk
      door de slang stromen.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel42
  - number: 42a.1
    text: |-
      Drinkwatertanks mogen niet aan olietanks of verzameltanks voor vuil water grenzen, doch moeten daarvan gescheiden
      zijn door kofferdams. Pijpleidingen, van welke aard ook, welke niet voor het uitpompen van drinkwater zijn bestemd,
      mogen niet door drinkwatertanks lopen.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel42a
  - number: 42a.2
    text: |-
      De constructie van een drinkwatertank moet zodanig zijn, dat zo mogelijk bij het leegpompen geen restant daarin
      achter blijft.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel42a
  - number: 42b.1
    text: |-
      Peilstokken of andere instrumenten, die gebruikt worden om het restant drinkwater in tanks op te meten, moeten
      steeds vóór het gebruik gereinigd zijn. Zij moeten worden opgeborgen op een plaats, waar het gevaar van besmetting
      het geringst is. Bij het gebruik van metalen roestvrije tapelines, welke worden geborgen in een doos, waarin enkele
      formalinetabletten aanwezig zijn, is het afzonderlijk reinigen niet nodig.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel42b
  - number: 42b.2
    text: |-
      De kapitein moet er op toezien, dat de persoon, belast met het peilen, onmiddellijk vóór hij gaat peilen, de handen
      wast.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel42b
  - number: 42c.1
    text: |-
      In kombuizen en pantry’s moet bij elke drinkwaterkraan een opschrift "drinkwater" en bij elke zoutwaterkraan een
      opschrift "zoutwater" aangebracht zijn.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel42c
  - number: 42c.2
    text: |-
      Na vertrek uit een haven moet de zoutwaterleiding, welke voor afwas van keuken- en eetgerei dient, buiten de
      driemijlsgrens geruime tijd worden doorgespoeld, voordat deze voor afwasdoeleinden gebezigd mag worden.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel42c
  - number: '43.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens de [artikelen 36 tot en met 42][ref1] zijn belast
      de bij besluit van Onze Minister van Infrastructuur en Milieu aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0001985#Artikel36
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0001985
        artikel: '36'
        hoofdstuk: V
  - number: '43.2'
    text: |-
      Door het houden van onverwachte inspecties overtuigen de bij besluit van Onze Minister van Infrastructuur en Milieu
      aangewezen ambtenaren zich er van, dat de in dit hoofdstuk gegeven voorschriften behoorlijk worden nageleefd.
      Indien zij het noodzakelijk achten een monster van de voedingsmiddelen of van het drinkwater te nemen, roepen zij
      daartoe deskundige hulp in.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel43
  - number: '43.3'
    text: |-
      De bij besluit van Onze Minister van Infrastructuur en Milieu aangewezen ambtenaren zijn bevoegd aanbevelingen te
      doen met betrekking tot de naleving van de in dit hoofdstuk gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel43
  - number: '43.4'
    text: |-
      Gedurende de reis houdt de kapitein of een door hem aan te wijzen officier, vergezeld van een verantwoordelijk
      lid van de civiele dienst, iedere maand een inspectie, waarbij wordt nagegaan de toestand van de voorraad
      levensmiddelen en water en waarbij tevens alle ruimten en uitrustingen gebruikt voor de bewaring en de behandeling
      van levensmiddelen en water, alsmede de kombuis en elke andere inrichting, gebruikt voor het bereiden en het
      opdienen van maaltijden worden geïnspecteerd. Van de bevindingen wordt in het scheepsdagboek melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel43
  - number: '43.5'
    text: |-
      Indien een derde deel van de schepelingen of een organisatie die rechtspersoon met volledige rechtsbevoegdheid
      is van zeewerkgevers of zeelieden schriftelijk een klacht indient bij Onze Minister van Infrastructuur en Milieu
      met betrekking tot de deugdelijkheid of de hoeveelheid van de eet- en drinkwaren, is deze verplicht een onderzoek
      in te stellen naar de gegrondheid van de klacht. De klacht moet zo spoedig mogelijk, en tenminste 24 uur vóór het
      vastgestelde tijdstip van vertrek ingediend zijn.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel43
  - number: '44.1'
    text: |-
      Er mag voor gebruik van de bemanning op vissersvaartuigen als bedoeld in de [Wet zeevarenden][ref1] geen sterke
      drank aan boord worden medegenomen, boven de hoeveelheid van 0,1 liter per reisdag voor elk lid van de bemanning.


      [ref1]: https://wetten.overheid.nl/BWBR0009124
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0009124
  - number: '44.2'
    text: |-
      Het aantal reisdagen wordt door Onze Minister van Infrastructuur en Milieu vastgesteld, met dien verstande dat dit
      aantal nimmer meer dan 180 dagen mag bedragen.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel44
  - number: '45'
    text: |-
      Onder sterken drank, bedoeld in [artikel 44][ref1], wordt verstaan drank, die bij een temperatuur van vier graden
      van de honderddeelige schaal voor vijftien of meer volumeprocenten uit alcohol bestaat, met uitzondering van wijn.


      [ref1]: https://wetten.overheid.nl/BWBR0001985#Artikel44
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0001985
        artikel: '44'
        hoofdstuk: VI
  - number: '46'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel46
  - number: 46.a
    text: |-
      "verblijven": de dag- en nachtverblijven en alle ruimten voor sanitaire doeleinden, ziekenverpleging en
      ontspanning, bestemd voor gebruik door de zeevarenden als bedoeld in de [Wet zeevarenden][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009124
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0009124
  - number: 46.b
    text: |-
      "passagiersschip": een schip waarvoor een "veiligheidscertificaat voor passagiersschepen" is afgegeven, nog geldig
      op het ogenblik van vertrek;
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel46
  - number: 46.c
    text: |-
      "ton": registerton van 1/0,353 kubieke meter; waar in dit besluit de grootte van een schip in deze eenheid wordt
      uitgedrukt, wordt daaronder verstaan de bruto-inhoud van het schip als vastgesteld volgens de bepalingen krachtens
      de Meetbrievenwet 1948 (*Stb.* I 492); indien de grootte van een schip is vastgesteld volgens de bepalingen
      krachtens de [Meetbrievenwet 1981][ref1] (*Stb.* 122) en derhalve wordt aangegeven als bruto-tonnage, heeft deze
      term dezelfde betekenis als de term bruto-inhoud uitgedrukt in registerton;


      [ref1]: https://wetten.overheid.nl/BWBR0003378
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0003378
  - number: 46.d
    text: '"officieren": de zeevarenden, aan wie de monsterrol de rang van officier toekent;'
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel46
  - number: 46.e
    text: '"scheepsgezellen": alle zeevarenden die niet de rang van officier hebben;'
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel46
  - number: 46.f
    text: |-
      "onderofficieren": die scheepsgezellen, die dienst doen in een toezichthoudende functie of in een functie met
      bijzondere verantwoordelijkheid en die door de zeewerkgever als zodanig worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel46
  - number: 46.g
    text: '"volwassene": een persoon die ten minste 18 jaar oud is;'
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel46
  - number: 46.h
    text: '"des nachts": de tijd tussen 23 uur en het tijdstip van zonsopgang de volgende dag;'
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel46
  - number: 46.i
    text: |-
      «bestaande schepen»: schepen, geen oude schepen en geen vissersschepen zijnde, waarvan de kiel is gelegd of de
      bouw zich in een soortgelijk stadium bevond voor de datum van inwerkingtreding van artikel XII van de wet tot
      implementatie van het op 23 februari 2006 te Geneve tot stand gekomen Maritiem Arbeidsverdrag, 2006 (Trb. 2007,
      93);
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel46
  - number: 46.j
    text: |-
      «vissersschepen»: vissersvaartuigen als bedoeld in de [Wet zeevarenden][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009124
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0009124
  - number: 46.k
    text: |-
      "lengte": van een vissersschip: de lengte gemeten van de voorzijde van het bovenste uiteinde van de voorsteven
      tot de achterzijde van het bovenste uiteinde van de achtersteven. Indien geen achtersteven aanwezig is, behoort de
      lengte te worden genomen tot het snijpunt van de voorzijde van de roerkoning (of de lijn in het verlengde daarvan)
      met het bovenste dek;
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel46
  - number: 46.l
    text: '"bestaande vissersschepen": vissersschepen waarvan de kiel is gelegd voor 12 mei 1977;'
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel46
  - number: 46.m
    text: |-
      "sleepboot": een schip, in hoofdzaak bestemd voor het slepen of bergen van vaartuigen, en waarmee in de regel geen
      andere personen of goederen worden vervoerd dan die, welke tot de eigen bemanning en uitrusting, of tot die van het
      gesleept wordende, te slepen of te bergen object behoren, dan wel bij het bergingswerk nodig zijn;
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel46
  - number: 46.n
    text: |-
      "aannemersmaterieel": een schip dat uitsluitend bestemd is voor het verrichten van aannemingswerkzaamheden, als
      hoedanig onder meer worden beschouwd baggerwerkzaamheden, het inheien van palen, het inspuiten van jackets en het
      leggen van pijpleidingen;
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel46
  - number: 46.o
    text: |-
      «oude schepen»: schepen, geen vissersschepen zijnde, waarvan de kiel is gelegd of de bouw zich in een
      overeenkomstige fase van ontwikkeling bevond voor 1 augustus 1983.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel46
  - number: '47'
    text: |-
      Zonder toestemming van alle rechtstreeks daarbij betrokken zeevarenden mag, zolang het schip in dienst is, geen
      deel van de dag- en nachtverblijven worden onttrokken aan zijn bestemming. Slechts in gevallen van overmacht kan,
      ter beoordeling van de kapitein, hiervan worden afgeweken. Deze onttrekking wordt door hem met de redenen in het
      scheepsdagboek vermeld.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel47
  - number: '48.1'
    text: Alle verblijven moeten midscheeps of in het acherschip zijn gelegen.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel48
  - number: '48.2'
    text: |-
      In bijzondere gevallen kan Onze Minister van Infrastructuur en Milieu, indien de in het eerste lid voorgeschreven
      ligging in verband met de grootte, het type, de vaart of de beoogde dienst van het schip, niet wenselijk of
      practisch onmogelijk wordt geacht, toestaan dat verblijven in het voorschip achter het aanvaringsschot zijn
      gelegen.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel48
  - number: '48.3'
    text: Behalve op schepen van minder dan 200 ton moeten afzonderlijke dagverblijven en nachtverblijven aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel48
  - number: '48.4'
    text: Er moeten afzonderlijke dagverblijven en nachtverblijven voor officieren zijn ingericht.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel48
  - number: '48.5'
    text: |-
      Nachtverblijven moeten zodanig zijn gelegen dat de vloer boven de zomerlastlijn ligt. Onze Minister van
      Infrastructuur en Milieu kan toestaan dat aan boord van passagiersschepen, sleepboten en aannemersmaterieel en
      schepen van minder dan 500 ton, de vloer van nachtverblijven beneden die lastlijn is gelegen, mits maatregelen zijn
      getroffen voor voldoende verlichting en ventilatie; deze verblijven mogen dan niet onder dienstgangen zijn gelegen.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel48
  - number: '48.6'
    text: |-
      Op alle schepen dient het geluidniveau in de verblijven volgens een door Onze Minister van Infrastructuur en
      Milieu vast te stellen methode te worden bepaald en dienen de resultaten daarvan aan deze ter beschikking te worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel48
  - number: '48.7'
    text: In de nachtverblijven en recreatieruimten dient een aansluiting op het centraal antennesysteem aanwezig te zijn.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel48
  - number: '48.8'
    text: |-
      Voor sleepboten en aannemersmaterieel, zomede voor andere schepen van minder dan 500 ton kan Onze Minister van
      Infrastructuur en Milieu vrijstelling verlenen van de voorschriften vervat in het derde en vierde lid van dit
      artikel.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel48
  - number: '49.1'
    text: |-
      De luiken, deuren, kappen in of op de dag- en nachtverblijven, uitkomende in de vrije lucht, moeten zodanig van
      een waterkering zijn voorzien en gesloten kunnen worden, dat geen regen of overkomend zeewater binnen kan dringen.
      De plaats en het aantal der toegangen tot de dag- en nachtverblijven moeten zo zijn gekozen, dat de veiligheid
      voldoende verzekerd is. De inrichting van de toegangen tot deze verblijven moet zo zijn, dat deze toegangen steeds
      aan beide zijden gemakkelijk en vlug kunnen worden geopend en voldoende doorgang laten.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel49
  - number: '49.2'
    text: |-
      De dekken, welke de dag- en nachtverblijven boven en onder afsluiten, en de schotten, welke deze verblijven van de
      buitenlucht afsluiten, moeten waterdicht zijn.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel49
  - number: '49.3'
    text: |-
      Een houten vloerdek moet behoorlijk zijn gebreeuwd en gepekt. Een stalen vloerdek moet zijn bedekt met hout
      of ander materiaal, dat de warmte slecht geleidt en van voldoende dikte is. Indien de vloeren van samengesteld
      materiaal zijn vervaardigd, moeten de verbindingen met de wanden naar boven zijn afgerond. Van de verplichting
      tot het aanbrengen van de in dit lid voorgeschreven bedekking van een stalen vloerdek kan Onze Minister van
      Infrastructuur en Milieu vrijstelling verlenen voor schepen, die uitsluitend worden gebruikt voor reizen in de
      tropen of in andere gebieden met naar zijn oordeel vergelijkbare klimaatsomstandigheden.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel49
  - number: '49.4'
    text: |-
      Als het stalen bovendek van een dag- en nachtverblijf aan de buitenlucht of aan de invloed van enige warmtebron
      aan boord is blootgesteld, moet het aan de bovenzijde met hout ter dikte van ten minste 5 centimeter of met ander
      deugdelijk en gelijkwaardig isolatiemateriaal zijn bekleed dan wel moet aan de onderzijde een bekleding met even
      groot isolerend vermogen zijn aangebracht. Een tevens aangebracht plafond, aansluitend tegen de dekbalken, moet
      geheel of gedeeltelijk wegneembaar zijn.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel49
  - number: '49.5'
    text: |-
      De ruimten, welke voor nachtverblijf dienen, moeten van alle andere ruimten, die niet uitsluitend voor verblijf
      zijn aangewezen, door goed afsluitende schotten zijn gescheiden. Indien de inrichting van het schip dit
      noodzakelijk maakt, mogen een of meer deuren in die schotten zijn aangebracht. De nachtverblijven mogen niet
      rechtstreeks in verbinding staan met de overige in [artikel 46, onder a][ref1], genoemde ruimten, noch met de
      kombuis of de bakkerij. Dit voorschrift is niet van toepassing op de ruimten voor de waterclosetten, wastafels,
      badkuipen en douches welke worden vermeld in [artikel 58, vierde, vijfde en zesde lid][ref2]. De in dit lid
      bedoelde schotten moeten van staal of ander deugdelijk materiaal doelmatig zijn vervaardigd en zo goed mogelijk
      waterdicht en gasdicht zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0001985#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0001985#Artikel58
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0001985
        artikel: '46'
        hoofdstuk: VII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0001985
        artikel: '58'
        hoofdstuk: VII
        paragraaf: '2'
  - number: '49.6'
    text: |-
      De buitenwanden van de dag- en nachtverblijven moeten van staal of ander deugdelijk materiaal zijn vervaardigd
      en voldoende zijn geïsoleerd. Een schot van een machinekamerschacht, van kombuizen en andere ruimten waarin
      warmte wordt ontwikkeld, moet zo nodig met een isolerende laag zijn bedekt, opdat geen warmte-uitstraling naar de
      aangrenzende verblijven of gangen naar die verblijven plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel49
  - number: '49.7'
    text: |-
      Schotten in de dag- en nachtverblijven moeten vervaardigd zijn van deugdelijk materiaal, waarin zich niet
      gemakkelijk ongedierte kan nestelen.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel49
  - number: '49.8'
    text: |-
      Dag- en nachtverblijven, ziekenverblijven en ontspanningsruimten moeten zodanig zijn geïsoleerd dat overmatige
      condensatie of te hoge temperatuur wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel49
  - number: '49.9'
    text: |-
      De hoogte tussen de dekken van alle verblijven dient zodanig te zijn dat de bemanning zich daarin vrij kan bewegen.
      Gemeten vanaf de onderkant van de in het verblijf doorlopende dekbalken, dan wel van de onderkant van het plafond
      tot de bovenkant van de vloerbedekking dient deze hoogte ten minste 2,00 meter te bedragen. Indien naar het oordeel
      van Onze Minister van Infrastructuur en Milieu hierdoor geen vermindering van het gerief van de bemanning ontstaat,
      kan hij een mindere hoogte toestaan, doch slechts tot 1,90 meter.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel49
  - number: '49.10'
    text: |-
      Hoofdstoom- en afvoerleidingen van lieren en andere hulpwerktuigen moeten buiten de dag- en nachtverblijven en
      zo mogelijk buiten de gangen naar deze verblijven worden gehouden. Indien pijpen, andere dan die in de voorgaande
      zin bedoeld, door een dag- of nachtverblijf of door een gang naar een zodanig verblijf lopen, moeten deze zo
      nodig afdoende zijn geïsoleerd. Flenskoppelingen van pijpen mogen slechts bij hoge uitzondering in een dag- of
      nachtverblijf zijn aangebracht. Lucht- en overvloeipijpen van tanks mogen niet in een dag- of nachtverblijf of in
      een gang naar een zodanig verblijf uitmonden.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel49
  - number: '49.11'
    text: Ankerkettingen mogen niet door een dag- of nachtverblijf lopen, tenzij zij door zware stalen kokers zijn beschermd.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel49
  - number: '49.12'
    text: |-
      Ruimten, gebruikt voor het stallen van vee of pluimvee mogen niet op hetzelfde dek zijn gelegen als de dag- of
      nachtverblijven, tenzij op een afstand van ten minste 5 meter van de deuren van die verblijven. Dit voorschrift is
      niet van toepassing indien deze verblijven volkomen door ononderbroken waterdichte of gasdichte schotten van die
      ruimten zijn afgescheiden.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel49
  - number: '49.13'
    text: |-
      In de dag- en nachtverblijven moeten de huid en de eindschotten van de bovenbouw met hout zijn beschoten of op
      soortgelijke wijze van een bekleding van ander deugdelijk materiaal zijn voorzien. Indien de ruimte tussen wand en
      wegering niet voor ratten ontoegankelijk is gemaakt, moet zij op een aantal plaatsen toegankelijk worden gemaakt
      voor onderzoek en reiniging. De beschieting van deze verblijven moet zijn vervaardigd van materiaal, waarvan het
      oppervlak gemakkelijk kan worden schoongehouden en dat waarborgen biedt, dat ongedierte er zich niet gemakkelijk in
      kan nestelen.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel49
  - number: '49.14'
    text: |-
      De wanden en plafonds van dag- en nachtverblijven moeten gemakkelijk kunnen worden schoongehouden en als regel zijn
      geschilderd in een lichte kleur. Gebruik van witkalk is niet toegestaan. Indien betimmering met een edele houtsoort
      is toegepast, kan met een voor die houtsoort passende bewerking worden volstaan.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel49
  - number: '49.15'
    text: Er moeten voldoende middelen aanwezig zijn voor het afvoeren van water uit de dag- en nachtverblijven.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel49
  - number: '50'
    text: |-
      De bepalingen van [artikel 49][ref1] zijn van overeenkomstige toepassing op de in [artikel 46, onder a][ref2],
      bedoelde overige ruimten, met dien verstande, dat de beschieting en de isolatie van wanden slechts daar behoeft te
      worden aangebracht, waar dit door Onze Minister van Infrastructuur en Milieu nodig wordt geoordeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0001985#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0001985#Artikel46
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0001985
        artikel: '49'
        hoofdstuk: VII
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001985
        artikel: '46'
        hoofdstuk: VII
        paragraaf: '1'
  - number: '51.1'
    text: |-
      Alle verblijven van de bemanning op schepen van 200 ton en meer dienen te zijn aangesloten op een
      luchtbehandelingsinstallatie. Dit voorschrift is niet van toepassing op schepen die uitsluitend worden gebezigd op
      reizen in gebieden waar naar het oordeel van Onze Minister van Infrastructuur en Milieu een dergelijke installatie
      wegens de klimaatomstandigheden niet noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel51
  - number: '51.2'
    text: |-
      Een radiohut en een centrale controlekamer in de machinekamer moeten eveneens op de in het eerste lid genoemde
      installatie, dan wel op een afzonderlijke luchtbehandelingsinstallatie, zijn aangesloten.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel51
  - number: '51.3'
    text: |-
      De luchtbehandelingsinstallatie dient zodanig te zijn ontworpen dat ten opzichte van de buitenlucht te allen tijde
      een behaaglijke temperatuur en relatieve vochtigheid wordt gehandhaafd en een voldoende aantal luchtwisselingen
      wordt bereikt. De installatie dient te zijn aangepast aan de omstandigheden welke op zee kunnen voorkomen en mag
      geen hinderlijk lawaai of trillingen veroorzaken. Voor het overige dient de luchtbehandelingsinstallatie te voldoen
      aan de door Onze Minister van Infrastructuur en Milieu te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel51
  - number: '52.1'
    text: |-
      Op schepen, die ingevolge het bepaalde in [artikel 51, eerste lid][ref1], niet behoeven te zijn uitgerust met een
      luchtbehandelingsinstallatie, dienen de in de volgende leden genoemde voorzieningen te worden getroffen teneinde te
      voorzien in verwarming en ventilering van de verblijven. Het bepaalde in het negende lid van dit artikel is ook van
      toepassing op schepen die zijn voorzien van een luchtbehandelingsinstallatie.


      [ref1]: https://wetten.overheid.nl/BWBR0001985#Artikel51
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0001985
        artikel: '51'
        hoofdstuk: VII
        paragraaf: '2'
  - number: '52.2'
    text: |-
      De verblijven moeten zijn aangesloten op een doeltreffende verwarmingsinrichting die buiten de verblijven moet
      zijn opgesteld en die is aangepast aan de klimaatsomstandigheden. De verwarming dient te geschieden door toevoer
      van stoom, heet water, warme lucht, of een ander geschikt middel, dan wel door middel van elektriciteit. De
      verwarmingsinrichting en de plaats en wijze van opstelling daarvan dienen te voldoen aan door Onze Minister van
      Infrastructuur en Milieu te stellen eisen. Radiatoren in de verblijven dienen doelmatig te zijn geplaatst en waar
      nodig afgeschermd.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel52
  - number: '52.3'
    text: |-
      Het bepaalde in het tweede lid is niet van toepassing op schepen die uitsluitend worden gebruikt voor reizen in
      de tropen en in andere gebieden met naar het oordeel van Onze Minister van Infrastructuur en Milieu, vergelijkbare
      klimaatsomstandigheden.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel52
  - number: '52.4'
    text: |-
      Het verwarmingssysteem dient steeds in gebruik te zijn zolang leden van de bemanning aan boord wonen of werken en
      de omstandigheden dit vereisen. De verwarmingsinstallatie dient een zodanige capaciteit te hebben dat onder normale
      weersomstandigheden die tijdens de reis kunnen worden ondervonden, in alle verblijven steeds een temperatuur van
      ten minste 20° C kan worden onderhouden.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel52
  - number: '52.5'
    text: |-
      Alle verblijven moeten, dit ter beoordeling van Onze Minister van Infrastructuur en Milieu, doeltreffend kunnen
      worden geventileerd, en wel zodanig, dat de lucht in bevredigende toestand blijft zonder dat hinderlijke tocht
      wordt veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel52
  - number: '52.6'
    text: |-
      Schepen die regelmatig worden gebruikt voor reizen in de tropen of in andere gebieden met, naar het oordeel van
      Onze Minister van Infrastructuur en Milieu, vergelijkbare klimaatsomstandigheden, dienen te zijn uitgerust met
      mechanische ventilatiemiddelen en met elektrisch aangedreven waaiers, met dien verstande dat slechts een van deze
      middelen behoeft te worden aangebracht in ruimten waar dit een voldoende ventilatie verzekert.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel52
  - number: '52.7'
    text: |-
      Schepen die uitsluitend worden gebruikt voor reizen in gebieden buiten die genoemd in het zesde lid, dienen te
      zijn uitgerust met mechanische ventilatiemiddelen of elektrisch aangedreven waaiers. Voor schepen die uitsluitend
      worden gebruikt voor reizen in koude streken, kan Onze Minister van Infrastructuur en Milieu vrijstelling van dit
      voorschrift geven.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel52
  - number: '52.8'
    text: |-
      Het vermogen dat nodig is om de ventilatiemiddelen, als bedoeld in het zesde en zevende lid, aan te drijven, moet,
      wanneer dit praktisch mogelijk is, beschikbaar zijn zolang leden van de bemanning aan boord wonen of werken en de
      omstandigheden dit vereisen.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel52
  - number: '52.9'
    text: Alle waterclosetten moeten onafhankelijk van elk ander gedeelte van de verblijven op de buitenlucht ventileren.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel52
  - number: '53.1'
    text: |-
      Alle verblijven dienen behoorlijk te zijn verlicht, een en ander ter beoordeling van Onze Minister van
      Infrastructuur en Milieu.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel53
  - number: '53.2'
    text: |-
      Het daglicht dient voldoende toegang te hebben tot de dag- en nachtverblijven. Onze Minister van Infrastructuur en
      Milieu kan voor passagiersschepen, sleepboten en aannemersmaterieel bijzondere regelingen treffen.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel53
  - number: '53.3'
    text: |-
      Alle verblijven dienen te zijn voorzien van elektrisch licht. Indien geen twee onafhankelijke elektriciteitsbronnen
      voor verlichting aanwezig zijn, moet een ander doeltreffend verlichtingsmiddel voor noodgevallen zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel53
  - number: '53.4'
    text: In de nachtverblijven moet een elektrische leeslamp aan het hoofdeinde van elke slaapplaats zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel53
  - number: '54.1'
    text: |-
      Aan boord van schepen, geen passagiersschepen zijnde, dient ieder volwassen lid van de bemanning de beschikking te
      hebben over een eigen nachtverblijf. Wanneer de grootte en indeling van het schip en de werkzaamheden waarvoor het
      wordt gebruikt dit niet toelaten kan Onze Minister van Infrastructuur en Milieu hiervan vrijstelling verlenen.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel54
  - number: 54.2.a
    text: |-
      Voor de eerste stuurman, de eerste scheepswerktuigkundige en de andere officieren, chefs van diensten, zomede voor
      stuurlieden, scheepswerktuigkundigen en radio-officieren welke als chef van de zeewacht optreden en bovendien voor
      de chef radio-officier op schepen met meer dan drie radio-officieren moeten voor ieder afzonderlijk een hut als
      nachtverblijf beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel54
  - number: 54.2.b
    text: |-
      De overige officieren dienen eveneens over een afzonderlijk nachtverblijf te beschikken. Indien zich niet een
      omstandigheid voordoet als bedoeld in [art. 65, tweede lid][ref1], kan niettemin Onze Minister van Infrastructuur
      en Milieu vrijstelling van dit voorschrift verlenen met dien verstande dat ten hoogste twee officieren in één
      nachtverblijf mogen worden ondergebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0001985#Artikel65
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0001985
        artikel: '65'
        hoofdstuk: VII
        paragraaf: '2'
  - number: 54.2.c
    text: In een hut bestemd tot nachtverblijf van onderofficieren mogen ten hoogste twee personen worden ondergebracht.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel54
  - number: 54.2.d
    text: |-
      Van de overige zeevarenden mogen ten hoogste twee zeevarenden van hetzelfde nachtverblijf gebruik maken, behalve
      aan boord van passagiersschepen, waar het maximaal toegestane aantal zeevarenden in één nachtverblijf vier
      bedraagt.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel54
  - number: '54.3'
    text: |-
      Voor nachtverblijven aan boord van zeilschepen, schepen van minder dan 400 ton, sleepboten en aannemersmaterieel
      en voor nachtverblijven van fabriekspersoneel op schepen, bestemd voor de walvisvangst, kan Onze Minister van
      Infrastructuur en Milieu afwijking van de in het vorig lid gegeven voorschriften toestaan.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel54
  - number: '54.4'
    text: |-
      Aan boord van schepen van 3000 ton en meer dienen de eerste stuurman en de eerste scheepswerktuigkundige de
      beschikking te hebben over een aan het nachtverblijf grenzend dagverblijf.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel54
  - number: '54.5'
    text: |-
      Aan boord van schepen van 500 ton en meer moeten de nachtverblijven voor de leden van het dekpersoneel, het
      machinekamerpersoneel en het personeel van de civiele dienst per categorie gescheiden zijn, een en ander ter
      beoordeling van Onze Minister van Infrastructuur en Milieu.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel54
  - number: '54.6'
    text: |-
      Het onderbrengen van de bemanning moet zo geschieden, dat de wachten gescheiden zijn en vrije wachtsgasten
      (daglieden) geen nachtverblijf met wachtdoenden delen. Wanneer de grootte en indeling van het schip en de
      werkzaamheden waarvoor het wordt gebruikt dit niet toelaten kan Onze Minister van Infrastructuur en Milieu hiervan
      ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel54
  - number: '54.7'
    text: Op elk nachtverblijf moet duidelijk het aantal zeevarenden worden vermeld waarvoor het is bestemd.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel54
  - number: '55.1'
    text: |-
      Alle nachtverblijven moeten zodanig zijn uitgevoerd en ingericht, dat de netheid wordt bevorderd en redelijk
      comfort aan de bewoners wordt verzekerd.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel55
  - number: '55.2'
    text: |-
      Het vloeroppervlak in nachtverblijven bestemd voor scheepsgezellen, ingericht voor één persoon, moet ten minste
      bedragen:
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel55
  - number: 55.2.a
    text: |-
      op schepen, geen passagiersschepen zijnde:







                        (i)


                        van minder dan 500 ton:


                        3,00 vierkante meter




                        (ii)


                        van 500 ton en meer, doch van minder dan 1000 ton:


                        3,25 vierkante meter






                        (iii)


                        van 1000 ton en meer, doch van minder dan 3000 ton:


                        3,75 vierkante meter




                        (iv)


                        van 3000 ton en meer, doch minder dan 10 000 ton:


                        4,25 vierkante meter




                        (v)


                        van 10 000 ton en meer:


                        4,75 vierkante meter
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel55
  - number: 55.2.b
    text: |-
      op passagiersschepen:







                        (i)


                        van minder dan 1000 ton:


                        3,00 vierkantemeter




                        (ii)


                        van 1000 ton en meer, doch minder dan 3000 ton:


                        3,25 vierkante meter






                        (iii)


                        van 3000 ton en meer:


                        3,75 vierkante meter
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel55
  - number: '55.3'
    text: |-
      Het vloeroppervlak in nachtverblijven bestemd voor scheepsgezellen, ingericht voor meer dan één persoon, moet per
      persoon ten minste bedragen:
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel55
  - number: 55.3.a
    text: |-
      op schepen, geen passagiersschepen zijnde:







                        (i)


                        van minder dan 500 ton:


                        2,00 vierkante meter




                        (ii)


                        van 500 ton en meer, doch minder dan 1000 ton:


                        2,25 vierkante meter






                        (iii)


                        van 1000 ton en meer, doch minder dan 3000 ton:


                        2,75 vierkante meter




                        (iv)


                        van 3000 ton en meer, doch minder dan 10 000 ton:


                        3,25 vierkante meter




                        (v)


                        van 10 000 ton en meer:


                        3,75 vierkante meter
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel55
  - number: 55.3.b
    text: |-
      op passagiersschepen:







                        (i)


                        van minder dan 1000 ton:


                        2,00 vierkante meter




                        (ii)


                        van 1000 ton en meer, doch minder dan 3000 ton:


                        2,35 vierkante meter






                        (iii)


                        van 3000 ton en meer:


                        3,00 vierkante meter
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel55
  - number: '55.4'
    text: |-
      Het vloeroppervlak in nachtverblijven bestemd voor officieren die niet de beschikking hebben over een eigen
      dagverblijf, moet per persoon ten minste bedragen op schepen van:






                    a. minder dan 500 ton:


                    4,0 vierkante meter




                    b. 500 ton en meer, doch minder dan 1000 ton:


                    5,0 vierkante meter




                    c. 1000 ton en meer, doch minder dan 3000 ton:


                    6,5 vierkante meter




                    d. 3000 ton en meer:


                    7,5 vierkante meter
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel55
  - number: '55.5'
    text: |-
      Het vloeroppervlak wordt gemeten tussen de wanden van het verblijf. Kleine of onregelmatig gevormde oppervlakken,
      die de beschikbare ruimte niet daadwerkelijk vergroten en niet voor plaatsing van meubilair kunnen dienen worden
      niet meegemeten. Aan het verblijf verbonden badkamers worden bij de berekening van het vloeroppervlak buiten
      beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel55
  - number: '55.6'
    text: |-
      Behalve de slaapplaatsen moet in elk nachtverblijf voor elke bewoner een kleerkast aanwezig zijn met een hoogte
      van ten minste 1,75 meter en met een dwarsdoorsnede van ten minste 0,2 meter. De kleerkast moet zijn voorzien van
      een legplank en van een roe waaraan kleding op kleerhangers kan worden gehangen alsmede van een slot of van lippen
      voor een hangslot. Ook moet voor elke bewoner een lade of soortgelijke ruimte aanwezig zijn met een inhoud van ten
      minste 60 kubieke decimeter. Deze ruimte mag met de kleerkast één geheel uitmaken.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel55
  - number: '55.7'
    text: |-
      In een nachtverblijf dient een tafel of lessenaar met een gemakkelijke zitgelegenheid aanwezig te zijn. Voorts
      dient een nachtverblijf te zijn uitgerust met een spiegel, kastjes voor toiletbenodigdheden, een boekenrek en een
      voldoende aantal kleerhangers. Voor de patrijspoorten moeten gordijnen of jalouzieën zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel55
  - number: '55.8'
    text: |-
      De meubels dienen te zijn vervaardigd van glad, hard materiaal dat niet krom trekt of roest en waarin zich geen
      ongedierte kan nestelen.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel55
  - number: '55.9'
    text: |-
      Onverminderd het bepaalde in het zesde en zevende lid dient een nachtverblijf voor officieren tevens te zijn
      voorzien van een wastafel met warm en koud stromend zoet water, die is aangesloten op een afvoer; de wastafel mag
      zich ook in een aan het verblijf verbonden eigen badkamer bevinden.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel55
  - number: '55.10'
    text: Voor elke schepeling moet een afzonderlijke slaapplaats beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel55
  - number: '55.11'
    text: |-
      Slaapplaatsen moeten behoorlijk van elkaar zijn gescheiden en elk afzonderlijk toegankelijk zijn. Er mogen niet
      meer dan twee slaapplaatsen boven elkaar zijn aangebracht. Op schepen van 500 ton en meer mogen zich langs het
      scheepsboord ter plaatse van patrijspoorten geen slaapplaatsen boven elkaar bevinden.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel55
  - number: '55.12'
    text: |-
      De onderkant van de onderste slaapplaats moet ten minste 30 centimeter boven de vloer liggen; de afstand tussen de
      onderkant van de onderste slaapplaats en de onderkant van de bovenste slaapplaats en de afstand tussen de onderkant
      van de bovenste slaapplaats en de onderkant van het plafond dienen ten minste 75 centimeter te bedragen. Aan de
      onderkant van de bovenste slaapplaats dient een stofdichte bodem van hout, zeildoek of ander geschikt materiaal te
      zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel55
  - number: '55.13'
    text: De slaapplaatsen moeten binnenwerks gemeten ten minste 2,00 meter lang en 80 centimeter breed zijn.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel55
  - number: '55.14'
    text: |-
      De slaapplaatsen moeten zijn vervaardigd van hout, of van deugdelijk hard materiaal, dat niet gemakkelijk roest. De
      constructie moet zodanig zijn, dat er zich geen ongedierte in kan nestelen en de slaapplaats gemakkelijk kan worden
      schoongemaakt. Indien slaapplaatsen uit buizen zijn samengesteld, mogen deze buizen geen openingen hebben, welke
      aan ongedierte toegang kunnen verlenen. Houten kooiplanken moeten uitneembaar zijn. Elke slaapplaats moet zijn
      voorzien van een vaste of los ingelegde staaldraadmatras of van een andere ondermatras van daarmede gelijkwaardige
      constructie, zomede van een bovenmatras van doeltreffend materiaal. Bij gebruik van een matras met binnenvering of
      van een schuimrubbermatras kan een ondermatras vervallen.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel55
  - number: '55.15'
    text: Onder de opening van een luchtkoker mag geen slaapplaats aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel55
  - number: '56.1'
    text: |-
      Aan boord van schepen van 200 ton en meer moeten voldoende dagverblijven zijn, gescheiden van de nachtverblijven en
      zo dicht mogelijk bij de kombuis.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel56
  - number: '56.2'
    text: 'Er dient een afzonderlijk dagverblijf te zijn:'
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel56
  - number: 56.2.a
    text: 'aan boord van schepen van 400 ton en meer, doch minder dan 1000 ton:'
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel56
  - number: 56.2.a.1°
    text: voor de kapitein en de officieren;
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel56
  - number: 56.2.a.2°
    text: voor de scheepsgezellen.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel56
  - number: 56.2.b
    text: 'aan boord van schepen van 1000 ton meer:'
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel56
  - number: 56.2.b.1°
    text: voor de kapitein en de officieren;
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel56
  - number: 56.2.b.2°
    text: voor de scheepsgezellen van het dekpersoneel;
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel56
  - number: 56.2.b.3°
    text: voor de scheepsgezellen van het machinekamerpersoneel.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel56
  - number: '56.3'
    text: |-
      In afwijking van het bepaalde in het tweede lid, onder b, kan Onze Minister van Infrastructuur en Milieu toestaan
      dat voor de scheepsgezellen één gezamenlijk dagverblijf wordt ingericht indien organisaties van zeewerkgevers en
      zeevarenden, die als representatief kunnen worden aangemerkt, daar de voorkeur aan geven.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel56
  - number: '56.4'
    text: |-
      Voor het personeel van de civiele dienst moet hetzij een afzonderlijk dagverblijf zijn ingericht, hetzij
      behoorlijke gelegenheid tot gebruik van maaltijden in een van de dagverblijven worden gegeven.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel56
  - number: '56.5'
    text: |-
      De grootte en inrichting, het aantal tafels en zitbanken of stoelen, vastgezet of verplaatsbaar, van elk
      dagverblijf moeten voldoende zijn voor het grootste aantal personen dat gelijktijdig van het verblijf gebruik zou
      kunnen maken.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel56
  - number: '56.6'
    text: |-
      Het vloeroppervlak van de dagverblijven voor officieren en scheepsgezellen mag niet minder bedragen dan 1 vierkante
      meter per zitplaats.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel56
  - number: '56.7'
    text: |-
      Indien bijzondere omstandigheden dit noodzakelijk maken, kan Onze Minister van Infrastructuur en Milieu voor
      passagiersschepen afwijking van het bepaalde in het tweede, vierde, vijfde en zesde lid toestaan.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel56
  - number: '56.8'
    text: 'Voor de bemanningsleden dienen te allen tijde beschikbaar te zijn:'
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel56
  - number: 56.8.a
    text: |-
      een koelkast, die zich op een gemakkelijk toegankelijke plaats moet bevinden, en groot genoeg is, gezien het aantal
      personen dat van het dagverblijf of de dagverblijven gebruik maakt;
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel56
  - number: 56.8.b
    text: voorzieningen voor het verstrekken van warme dranken; en
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel56
  - number: 56.8.c
    text: voorzieningen voor het verstrekken van gekoeld water.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel56
  - number: '56.9'
    text: |-
      Indien pantry’s in niet-rechtstreekse verbinding met de dagverblijven staan, moet zijn voorzien in voldoende
      kastruimte voor het opbergen van eetgerei alsmede in een geschikte gelegenheid voor het schoonmaken daarvan.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel56
  - number: '56.10'
    text: |-
      De bovenkanten van tafels, banken en stoelen moeten zijn vervaardigd van vochtwerend materiaal, zonder barsten en
      gemakkelijk schoon te houden.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel56
  - number: '57.1'
    text: |-
      Aan boord van alle schepen moeten van het open dek een of meer gedeelten toegankelijk zijn voor de zeevarenden,
      wanneer zij geen dienst hebben.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel57
  - number: '57.2'
    text: |-
      Aan boord van schepen van 500 ton en meer moeten voor de officieren en voor de scheepsgezellen ontspanningsruimten
      aanwezig zijn, gelegen op een daartoe geschikte plaats en op passende wijze ingericht. Wanneer buiten de
      dagverblijven niet is voorzien in afzonderlijke ontspanningsruimten, dienen deze dagverblijven op zodanige wijze te
      zijn ingericht, gemeubileerd en uitgerust, dat zij als ontspanningsruimte kunnen dienst doen.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel57
  - number: '57.3'
    text: |-
      In de ontspanningsruimten moet ten minste een boekenkast aanwezig zijn, alsmede gelegenheid worden geboden tot
      lezen en schrijven en zo mogelijk tot gezelschapsspelen.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel57
  - number: '57.4'
    text: |-
      Op schepen van 8000 ton en meer dient een rookkamer of een bibliotheek aanwezig te zijn, waar films kunnen worden
      vertoond en naar televisie kan worden gekeken. Voorts dient te zijn voorzien in een ruimte waar men kan knutselen
      of gezelschapsspelen kan beoefenen. Er dient een zwembad aanwezig te zijn tenzij, naar het oordeel van Onze
      Minister van Infrastructuur en Milieu, de inrichting van het schip daartoe onvoldoende mogelijkheid biedt.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel57
  - number: '58.1'
    text: |-
      Aan boord van schepen dienen op een geschikte plaats voor officieren en scheepsgezellen sanitaire voorzieningen
      aanwezig te zijn, bestaande uit tenminste een watercloset, een badkuip en/of douche en een wastafel met warm en
      koud stromend zoet water voor iedere 6 personen of minder, die niet beschikken over de sanitaire voorzieningen
      als bedoeld in het vierde, vijfde en zesde lid van dit artikel, met dien verstande dat op een schip van: 400 tot
      500 ton ten minste 2, 500 tot 800 ton ten minste 3, 800 tot 3000 ton ten minste 4, en van 3000 ton en meer ten
      minste 6 waterclosetten aanwezig moeten zijn. Bij de berekeningen van het aantal voorzieningen wordt bij meer
      dan 6 schepelingen of een veelvoud van 6 schepelingen, een aantal van 2 schepelingen of minder verwaarloosd. Voor
      vrouwelijke zeevarenden dienen afzonderlijke sanitaire voorzieningen ter beschikking te staan.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel58
  - number: '58.2'
    text: |-
      De beschikbaarheid van de waterclosetten dient gelijkelijk over de groepen van officieren en scheepsgezellen te
      worden verdeeld.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel58
  - number: '58.3'
    text: |-
      Aan boord van schepen van 500 ton en meer moeten ten behoeve van de officieren waterclosetten in de nabijheid van
      hun nachtverblijven beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel58
  - number: '58.4'
    text: |-
      Op schepen van 5000 ton en meer, doch minder dan 15 000 ton, moeten ten minste vijf eenpersoons nachtverblijven
      voor officieren een daaraan verbonden eigen badkamer bezitten, welke is voorzien van een watercloset, een badkuip
      en/of douche en een wastafel met warm en koud stromend zoet water; de wastafel mag zich in het nachtverblijf
      bevinden. Bovendien moeten op schepen van 10 000 ton en meer, doch minder dan 15 000 ton de nachtverblijven
      van alle overige officieren voorzien zijn van een daaraan verbonden eigen badkamer, dan wel van een badkamer
      die op dezelfde wijze is uitgerust en is gelegen in een ruimte tussen twee nachtverblijven en die vanuit deze
      nachtverblijven direkt bereikbaar is.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel58
  - number: '58.5'
    text: |-
      Aan boord van schepen van 15 000 ton en meer dienen de éénpersoons nachtverblijven voor de officieren te zijn
      voorzien van een daaraan verbonden eigen badkamer, voorzien van een watercloset, een badkuip en/of douche en een
      wastafel met warm en koud stromend zoet water; de wastafel mag zich in het nachtverblijf bevinden.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel58
  - number: '58.6'
    text: |-
      Aan boord van schepen van 25 000 ton en meer, met uitzondering van passagiersschepen, dient per twee
      scheepsgezellen een badkamer aanwezig te zijn in een ruimte tussen twee aangrenzende nachtverblijven en van daaruit
      rechtstreeks te bereiken, dan wel een badkamer gelegen tegenover deze verblijven. Deze badkamers dienen te zijn
      uitgerust met een watercloset, een badkuip en/of douche en een wastafel met warm en koud stromend zoet water.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel58
  - number: '58.7'
    text: |-
      Aan boord van schepen van 5000 ton en meer, met uitzondering van passagiersschepen, dient elk nachtverblijf voor
      scheepsgezellen te zijn voorzien van een wastafel met koud en warm stromend zoet water die is aangesloten op een
      afvoer, behalve wanneer een wastafel aanwezig is in een badkamer die is ingericht overeenkomstig het bepaalde in
      het zesde lid.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel58
  - number: '58.8'
    text: |-
      Aan boord van schepen van 1600 ton en meer, met uitzondering van schepen waarop het gehele machinekamerpersoneel de
      beschikking heeft over een eigen nachtverblijf en een badkamer per een of twee nachtverblijven, dienen kleedruimten
      aanwezig te zijn, die
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel58
  - number: 58.8.a
    text: |-
      buiten de machinekamer zijn gelegen, doch gemakkelijk bereikbaar zijn vanuit de machinekamer. Deze ruimten moeten
      door het machinekamerpersoneel vanuit de machinekamer kunnen worden bereikt zonder dat men in de open lucht komt;
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel58
  - number: 58.8.b
    text: |-
      zijn voorzien van een kleerkast voor elk lid van het personeel alsmede van badkuipen en/of douches en wastafels met
      warm en koud stromend zoet water.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel58
  - number: '58.9'
    text: 'Aan boord van schepen van 1600 ton en meer dient te zijn voorzien in:'
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel58
  - number: 58.9.a
    text: |-
      een aparte toiletruimte, bevattende een watercloset en een wastafel met warm en koud stromend zoet water, die
      gemakkelijk bereikbaar is vanaf het navigatie brugdek en bedoeld voor diegenen die daar hun werk verrichten;
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel58
  - number: 58.9.b
    text: |-
      een watercloset en een wastafel met warm en koud stromend zoet water, gemakkelijk bereikbaar vanuit de
      machinekamer, indien deze voorzieningen niet zijn aangebracht in de onmiddellijke nabijheid van de centrale
      controlekamer in de machinekamer.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel58
  - number: '58.10'
    text: |-
      Op schepen waar het aantal zeevarenden groter dan 100 is, kan Onze Minister van Infrastructuur en Milieu een
      vermindering van het aantal wastafels, badkuipen en douches toestaan.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel58
  - number: '58.11'
    text: |-
      De in dit artikel genoemde waterclosetten aan boord van schepen van 500 ton en meer zijn uitsluitend bestemd ten
      gebruike van zeevarenden. Deze waterclosetten worden niet meegeteld voor het aantal, dat krachtens de Stuwadoorswet
      voor de havenarbeiders aan boord beschikbaar moet zijn.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel58
  - number: '59'
    text: |-
      De sanitaire ruimten en voorzieningen, als bedoeld in [artikel 58][ref1], behalve de ruimten die zijn verbonden met
      hutten, moeten voldoen aan de volgende eisen:


      [ref1]: https://wetten.overheid.nl/BWBR0001985#Artikel58
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0001985
        artikel: '58'
        hoofdstuk: VII
        paragraaf: '2'
  - number: 59.a
    text: |-
      De vloer moet van deugdelijk, duurzaam en gemakkelijk te reinigen materiaal zijn, dat ondoordringbaar is voor
      vocht; schotten moeten zijn vervaardigd van staal of ander deugdelijk materiaal, dat tot ten minste 23 centimeter
      boven de vloer waterdicht is.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel59
  - number: 59.b
    text: |-
      Waterclosetten moeten op voldoende wijze van elkaar zijn gescheiden en gemakkelijk bereikbaar zijn. Waterclosetten
      mogen noch rechtstreeks in verbinding staan met de nachtverblijven, noch met een doodlopende gang tussen de
      nachtverblijven en de waterclosetten, met dien verstande, dat dit niet geldt voor een watercloset tussen twee
      nachtverblijven, welke tezamen voor niet meer dan 4 personen zijn bestemd.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel59
  - number: 59.c
    text: |-
      Waterclosetten moeten van een ruime afvoer zijn voorzien en elk afzonderlijk door middel van een vaste inrichting
      gemakkelijk kunnen worden doorgespoeld, zodanig, dat geen stank wordt verspreid. De waterclosetten moeten van een
      zodanig model zijn en de afvoer moet zodanig zijn ingericht, dat de kans op verstopping zo klein mogelijk is en het
      schoonhouden vergemakkelijkt wordt.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel59
  - number: 59.d
    text: |-
      Wastafels en badkuipen moeten voldoende afmetingen hebben en zijn vervaardigd van deugdelijk materiaal, met een
      glad oppervlak, niet onderhevig aan scheuren, schilferen of roesten.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel59
  - number: 59.e
    text: |-
      De vloer van een ruimte, waarin een watercloset of een wasgelegenheid is ondergebracht, moet zijn voorzien van een
      behoorlijke waterafvoer.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel59
  - number: '60.1'
    text: |-
      Er dient voldoende gelegenheid te zijn voor het wassen, drogen en strijken van kleding, in een mate die in
      overeenstemming is met het aantal bemanningsleden en de normale duur van de reis. Deze voorzieningen dienen te
      worden aangebracht op een gemakkelijk vanuit de hutten te bereiken plaats.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel60
  - number: '60.2'
    text: 'De voorzieningen, als bedoeld in het vorige lid, dienen te bestaan uit:'
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel60
  - number: 60.2.a
    text: wasmachines;
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel60
  - number: 60.2.b
    text: droogtrommels of behoorlijk verwarmde en geventileerde droogkamers;
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel60
  - number: 60.2.c
    text: strijkijzers en strijkplanken of gelijkwaardige voorzieningen.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel60
  - number: '60.3'
    text: |-
      Op schepen van minder dan 250 ton mag van het bepaalde in het eerste en tweede lid worden afgeweken, mits andere
      voorzieningen worden getroffen, die naar het oordeel van Onze Minister van Infrastructuur en Milieu genoegzaam
      zijn.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel60
  - number: '60.4'
    text: |-
      Er moet buiten, doch nabij de nachtverblijven, voldoende behoorlijk geventileerde bergruimte zijn om oliegoed,
      natte en vuile kleding op te hangen. Onze Minister van Infrastructuur en Milieu kan toestaan, dat deze
      kledingstukken op schepen van minder dan 400 ton in een goed sluitende kast in het nachtverblijf worden opgeborgen,
      mits deze kast op een ruimte buiten het verblijf ventileert.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel60
  - number: '61.1'
    text: |-
      Aan boord van elk schip met een bemanning van 15 zeevarenden of meer, dat een reis maakt gedurende welke het langer
      dan 3 achtereenvolgende etmalen op zee blijft, moet een afzonderlijk ziekenverblijf aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel61
  - number: '61.2'
    text: Het ziekenverblijf moet doelmatig zijn gelegen, en gemakkelijk bereikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel61
  - number: '61.3'
    text: |-
      Het ziekenverblijf moet zo groot zijn, dat de verpleging naar behoren kan geschieden en de patiënten gerieflijk
      zijn gehuisvest. De patiënten moeten op gemakkelijke wijze in en uit het verblijf kunnen worden gebracht.
      De verlichting, ventilatie en verwarming moeten voldoen aan de eisen voor de verblijven als bedoeld in de
      [artikelen 48 tot en met 53][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001985#Artikel48
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0001985
        artikel: '48'
        hoofdstuk: VII
        paragraaf: '2'
  - number: '61.4'
    text: |-
      In het ziekenverblijf moet voldoende wasgelegenheid met toebehoren en afvoer van vuil water zijn aangebracht. De
      wasgelegenheid dient te zijn voorzien van warm en koud stromend zoet water.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel61
  - number: '61.5'
    text: |-
      Indien het aantal leden van de bemanning, dat verblijf houdt in hutten voor meer dan één persoon, minder dan 30
      bedraagt, moet het ziekenverblijf zijn voorzien van één slaapplaats. Bedraagt dat aantal 30 of meer, dan dient het
      ziekenverblijf te zijn voorzien van twee slaapplaatsen, of zoveel meer als in verband met de omstandigheden van de
      reis door Onze Minister van Infrastructuur en Milieu wordt vastgesteld. Indien voor passagiers geen ziekenverblijf
      aanwezig is, mogen de passagiers in het ziekenverblijf worden opgenomen en gelden de voorschriften van dit lid voor
      de zeevarenden en de passagiers gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel61
  - number: '61.6'
    text: |-
      De slaapplaatsen mogen niet boven elkaar zijn geplaatst. Hun inrichting moet ten minste voldoen aan de eisen, als
      bedoeld in het elfde lid en als bedoeld in [artikel 55, tiende tot en met vijftiende lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001985#Artikel55
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0001985
        artikel: '55'
        hoofdstuk: VII
        paragraaf: '2'
  - number: '61.7'
    text: |-
      In of in de onmiddellijke nabijheid van het ziekenverblijf moeten, uitsluitend voor gebruik door patiënten een
      watercloset en een daaraan toegevoegde badkamer beschikbaar zijn. Deze ruimten moeten van het ziekenverblijf zijn
      afgescheiden.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel61
  - number: '61.8'
    text: |-
      Indien een arts tot de bemanning behoort, moet een ruimte bij het ziekenverblijf worden ingericht als apotheek en
      verbandkamer, die van het ziekenverblijf moet zijn afgescheiden.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel61
  - number: '61.9'
    text: |-
      Het ziekenverblijf mag niet voor andere doeleinden dan het verplegen of behandelen van zieken en gewonden worden
      gebruikt.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel61
  - number: '61.10'
    text: |-
      Aan boord van alle schepen welke krachtens het bepaalde in het eerste lid niet van een ziekenverblijf behoeven
      te zijn voorzien, moet voor een zieke of gewonde een éénpersoonsnachtverblijf beschikbaar kunnen worden gesteld,
      waarin de slaapplaats als ziekenkooi is ingericht. Is het aantal zeevarenden minder dan 6, dan kan worden volstaan
      met een als ziekenkooi ingerichte slaapplaats in een nachtverblijf.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel61
  - number: '61.11'
    text: |-
      De ziekenkooi moet zodanig zijn ingericht, dat de zieke er gemakkelijk met de matras kan worden ingebracht en
      uitgenomen waartoe zo nodig de schotten wegneembaar moeten zijn.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel61
  - number: '61.12'
    text: |-
      Indien iemand aan een ernstige of aan een besmettelijke ziekte lijdt, moet getracht worden de zieke, afgezonderd
      van alle anderen, te verplegen.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel61
  - number: '62.1'
    text: |-
      Schepen, die geregeld worden gebruikt voor reizen in de tropen of in andere gebieden met naar het oordeel van Onze
      Minister van Infrastructuur en Milieu, vergelijkbare klimaatsomstandigheden moeten zijn uitgerust met tenten over
      de aan de zon blootgestelde dekken boven de verblijven en over de voor ontspanning bestemde dekruimten.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel62
  - number: '62.2'
    text: |-
      Aan boord van schepen, die niet zijn voorzien van een luchtbehandelingsinstallatie en welke geregeld havens
      aandoen, waar malaria voorkomt of kan voorkomen, moeten de dag-, nacht- en ziekenverblijven tegen binnendringen
      van muskieten zijn beschermd door passende horren voor patrijspoorten en luchtkokers, alsmede voor deuren, toegang
      gevende tot het open dek.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel62
  - number: '62.3'
    text: |-
      Aan boord van schepen van meer dan 3000 ton moet zowel voor de dekdienst als voor de machinedienst een
      afzonderlijke ruimte als kantoor beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel62
  - number: '63.1'
    text: De verblijven moeten, wanneer een schip voor de eerste maal of opnieuw in de vaart wordt gebracht, schoon zijn.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel63
  - number: '63.2'
    text: De verblijven moeten schoon en in behoorlijk bewoonbare toestand worden gehouden.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel63
  - number: '64'
    text: |-
      Indien tijdens de reis gebreken ontstaan aan de in dit Hoofdstuk omschreven voorzieningen, dient de kapitein deze
      zo spoedig mogelijk te doen verhelpen.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel64
  - number: '65.1'
    text: |-
      Behoudens het bepaalde in het tweede lid kan Onze Minister van Infrastructuur en Milieu, na overleg
      met de organisaties van zeewerkgevers en zeevarenden die als representatief kunnen worden aangemerkt,
      hetzij in een incidenteel geval, hetzij algemeen, vrijstelling verlenen van het bepaalde in de
      [artikelen 48 tot en met 62, onder][ref1] zo nodig door hem te stellen voorwaarden of beperkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0001985#Artikel48
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0001985
        artikel: '48'
        hoofdstuk: VII
        paragraaf: '2'
  - number: '65.2'
    text: |-
      Onze Minister van Infrastructuur en Milieu kan voor schepen, aan boord waarvan vanwege de samenstelling van
      de bemanning rekening moet worden gehouden met de belangen van bemanningsleden die verschillende gewoonten
      van godsdienstige en maatschappelijke aard hebben, na overleg met de organisaties van zeewerkgevers
      en zeevarenden die als representatief kunnen worden aangemerkt, vrijstelling verlenen van het bepaalde
      in de [artikelen 54, eerste lid en tweede lid, onder d][ref1], [55, tweede en derde lid][ref2], en
      [58, eerste en zesde lid][ref3], onder zo nodig door hem te stellen voorwaarden of beperkingen, mits de hiervoor
      bedoelde organisaties ter zake overeenstemming hebben bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0001985#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0001985#Artikel55
      [ref3]: https://wetten.overheid.nl/BWBR0001985#Artikel58
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0001985
        artikel: '54'
        hoofdstuk: VII
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001985
        artikel: '55'
        hoofdstuk: VII
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0001985
        artikel: '58'
        hoofdstuk: VII
        paragraaf: '2'
  - number: '66'
    text: |-
      Behoudens het bepaalde in [artikel 67, eerste lid][ref1], is het bepaalde in de [artikelen 48 tot en met 62][ref2]
      niet van toepassing op oude schepen. Op oude schepen blijft van toepassing het bepaalde in de artikelen 46 tot en
      met 64 van het Koninklijk besluit van 15 mei 1937, *Stb.* 242, zoals gewijzigd bij Koninklijk besluit van 5 juni
      1975, *Stb.* 327.


      [ref1]: https://wetten.overheid.nl/BWBR0001985#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0001985#Artikel48
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0001985
        artikel: '67'
        hoofdstuk: VII
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001985
        artikel: '48'
        hoofdstuk: VII
        paragraaf: '2'
  - number: '67.1'
    text: |-
      Onze Minister van Infrastructuur en Milieu kan, na raadpleging van de organisaties van zeewerkgevers en zeevarenden
      die als representatief kunnen worden aangemerkt, voor een oud schip, dat:
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel67
  - number: 67.1.a
    text: hetzij de Nederlandse nationaliteit verkrijgt;
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel67
  - number: 67.1.b
    text: |-
      hetzij ingrijpende veranderingen in de bouw of grote reparaties ondergaat volgens een tevoren ontworpen plan,
      echter niet ten gevolge van een ongeval of ramp;
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel67
  - number: 67.1.c
    text: hetzij op de datum van inwerkingtreding van dit besluit in aanbouw is;
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel67
  - number: '67.2'
    text: |-
      Voorzieningen als bedoeld in het vorige lid worden uitsluitend voorgeschreven voor zover deze redelijk en
      uitvoerbaar zijn; rekening wordt gehouden met de daarmee samenhangende technische, economische en andere problemen
      die voortvloeien uit het uitvoeren van de voorgeschreven voorzieningen.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel67
  - number: '67.3'
    text: Een beschikking als bedoeld in het eerste lid wordt schriftelijk en met redenen omkleed gegeven.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel67
  - number: '68.1'
    text: |-
      Alle verblijven dienen midscheeps of in het achterschip te zijn gelegen. Onze Minister van Infrastructuur en Milieu
      kan, in byzondere gevallen, indien de grootte, het type of de beoogde vaart van het schip deze ligging onredelijk
      of onuitvoerbaar maakt, toestaan dat de verblijven in het voorschip achter het aanvaringsschot zijn gelegen.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel68
  - number: '68.2'
    text: |-
      Voldoende dagverblijven moeten aanwezig zijn, gescheiden van de nachtverblijven en zo dicht mogelijk bij de kombuis
      gelegen. Indien op schepen met een lengte van minder dan 24 meter een afzonderlijk dagverblijf niet mogelijk is,
      kan worden volstaan met een gecombineerd dag- en nachtverblijf.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel68
  - number: '68.3'
    text: |-
      Op schepen met een lengte van 60 meter en meer moeten zowel voor de kapitein en de officieren als voor de
      scheepsgezellen afzonderlijke dagverblijven aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel68
  - number: '69.1'
    text: |-
      De plaats, de toegangen, de constructie en de indeling van de dag- en nachtverblijven ten opzichte van andere
      ruimten dienen zodanig te zijn dat de veiligheid, de bescherming tegen weersinvloeden en overkomend zeewater en de
      isolatie tegen hitte en koude, overmatig lawaai of tegen uitwaseming van andere ruimten, voldoende zijn verzekerd.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel69
  - number: '69.2'
    text: |-
      De inrichting van de toegangen tot de dag- en nachtverblijven moet zo zijn, dat deze toegangen steeds aan beide
      zijden gemakkelijk en vlug kunnen worden geopend en voldoende doorgang laten.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel69
  - number: '69.3'
    text: |-
      Indien Onze Minister van Infrastructuur en Milieu dit noodzakelijk acht, dienen dag- en nachtverblijven op naar
      zijn oordeel doelmatige plaatsen te zijn voorzien van nooduitgangen.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel69
  - number: '69.4'
    text: |-
      Het materiaal en de constructie van de dekken in alle dag- en nachtverblijven moeten zijn goedgekeurd door Onze
      Minister van Infrastructuur en Milieu. Het oppervlak van deze dekken dient ondoordringbaar te zijn voor vocht en
      gemakkelijk schoon te houden.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel69
  - number: '69.5'
    text: |-
      Indien de vloeren zijn vervaardigd uit samengesteld materiaal, dienen de verbindingen met de wanden naar boven te
      zijn afgerond om spleten of naden te vermijden.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel69
  - number: '69.6'
    text: |-
      Als het stalen bovendek van dag- en nachtverblijven aan de buitenlucht of aan de invloed van enige warmtebron
      aan boord is blootgesteld, moet het aan de bovenzijde met hout ter dikte van ten minste 5 centimeter of met ander
      deugdelijk en gelijkwaardig isolatiemateriaal zijn bekleed, dan wel moet aan de onderzijde een bekleding met even
      groot isolerend vermogen zijn aangebracht. In elk dag- en nachtverblijf moet aansluitend tegen de dekbalken een
      plafond zijn aangebracht, dat geheel of gedeeltelijk wegneembaar is.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel69
  - number: '69.7'
    text: |-
      Nachtverblijven mogen niet rechtstreeks in verbinding staan met visruimen, opslagplaatsen voor vismeel, ruimten
      waarin werktuigen zijn opgesteld, kombuizen, lampenhutten, verfhutten, bergruimten, droogkamers, gemeenschappelijke
      wasplaatsen en privaten. Dat deel van het schot dat bovengenoemde ruimten scheidt van de nachtverblijven, alsmede
      de buitenschotten van de nachtverblijven, dienen doelmatig te zijn geconstrueerd van staal of ander goedgekeurd
      materiaal. Genoemde schotten moeten water- en gasdicht zijn.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel69
  - number: '69.8'
    text: |-
      Buitenschotten van dag- en nachtverblijven dienen doelmatig te zijn geïsoleerd. Schotten van een
      machinekamerschacht, van een kombuis en van een andere ruimte waarin warmte wordt ontwikkeld, dienen doelmatig te
      zijn geïsoleerd opdat geen warmteuitstraling plaats vindt naar aangrenzende verblijven of gangen van de verblijven.
      Tevens dient er voor te worden gezorgd dat bescherming plaats vindt tegen warmteuitstraling van stoom en/of
      warmwaterleidingen.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel69
  - number: '69.9'
    text: |-
      Schotten in dag- en nachtverblijven moeten zijn vervaardigd van goedgekeurd materiaal waarin zich geen ongedierte
      kan nestelen.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel69
  - number: '69.10'
    text: |-
      Dag- en nachtverblijven en gangen in de verblijven dienen doelmatig te zijn geïsoleerd om condensatie en te hoge
      temperaturen te voorkomen.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel69
  - number: '69.11'
    text: |-
      De hoogte van de dag- en nachtverblijven tussen de dekken, gemeten van de onderkant van het plafond tot de
      bovenkant van de vloerbedekking moet op alle plaatsen waar de bemanning zich vrij moet kunnen bewegen, ten minste
      2,0 meter bedragen.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel69
  - number: '69.12'
    text: |-
      Hoofdstoom- en afvoerleidingen van lieren en andere hulpwerktuigen dienen buiten de dag- en nachtverblijven en zo
      mogelijk buiten de gangen naar deze verblijven te worden gehouden. Waar deze leidingen toch door de gangen zijn
      gevoerd, dienen zij te zijn voorzien van een doelmatige isolatie en omkasting. Flenskoppelingen van pijpen mogen
      slechts bij hoge uitzondering in een dag- of nachtverblijf zijn aangebracht. Lucht- en overvloeipijpen van tanks
      mogen niet in een dag- of nachtverblijf of in een gang naar een zodanig verblijf uitmonden.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel69
  - number: '69.13'
    text: Ankerkettingen mogen niet door een dag- of nachtverblijf lopen, tenzij beschermd door zware kokers.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel69
  - number: '69.14'
    text: |-
      In de dag- en nachtverblijven moeten de huid en de eindschotten van de bovenbouw met hout zijn beschoten of
      op soortgelijke wijze van een bekleding van ander deugdelijk materiaal zijn voorzien. De beschieting dient te
      zijn vervaardigd van materiaal waarvan het oppervlak gemakkelijk kan worden schoongehouden en waarin zich geen
      ongedierte kan nestelen.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel69
  - number: '69.15'
    text: |-
      De wanden en plafonds van dag- en nachtverblijven dienen gemakkelijk te kunnen worden schoongehouden. Indien zij
      zijn geschilderd, dient dit in een lichte kleur te zijn. Witkalk mag niet worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel69
  - number: '69.16'
    text: Voldoende middelen moeten aanwezig zijn voor het afvoeren van water uit de dag- en nachtverblijven.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel69
  - number: '69.17'
    text: |-
      Al het mogelijke dient te worden gedaan om de dag- en nachtverblijven te beschermen tegen het binnendringen van
      vliegen en andere insekten.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel69
  - number: '70'
    text: |-
      De bepalingen van [artikel 69][ref1] zijn van overeenkomstige toepassing op de in [artikel 46, eerste lid][ref2],
      bedoelde overige ruimten, met dien verstande dat de beschieting en de isolatie van wanden slechts daar behoeft te
      worden aangebracht, waar dit door Onze Minister van Infrastructuur en Milieu nodig wordt geoordeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0001985#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0001985#Artikel46
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0001985
        artikel: '69'
        hoofdstuk: VII
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0001985
        artikel: '46'
        hoofdstuk: VII
        paragraaf: '1'
  - number: '71.1'
    text: |-
      Alle verblijven moeten zijn aangesloten op een doeltreffende verwarmingsinrichting die buiten de verblijven moet
      zijn opgesteld en die is aangepast aan de klimatologische omstandigheden. De verwarming dient te geschieden door
      toevoer van stoom, heet water, warme lucht of elektriciteit. De verwarmingsinrichting en de plaats en wijze van
      opstelling daarvan dienen te voldoen aan door Onze Minister van Infrastructuur en Milieu te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel71
  - number: '71.2'
    text: |-
      Het verwarmingssysteem dient steeds in gebruik te zijn zolang de bemanning aan boord woont of werkt en de
      omstandigheden dit vereisen.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel71
  - number: '71.3'
    text: Radiatoren in verblijven dienen doelmatig te zijn geplaatst en waar nodig afgeschermd.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel71
  - number: '71.4'
    text: |-
      De verwarmingsinrichting dient een zodanig vermogen te hebben dat onder normale weersomstandigheden die tijdens
      de reis kunnen worden ondervonden, in alle verblijven steeds een temperatuur van ten minste 20°C kan worden
      onderhouden.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel71
  - number: '72.1'
    text: |-
      Overdag moet een verblijf licht ontvangen door schijnlichten of doelmatige lichtglazen van voldoende grootte,
      patrijspoorten of ramen, zodanig dat het aan een persoon met normale gezichtsscherpte mogelijk is bij helder
      weer gewoon drukwerk te lezen op de daarvoor in aanmerking komende plaatsen van het verblijf. Indien naar het
      oordeel van Onze Minister van Infrastructuur en Milieu door de ligging van het verblijf een voldoende natuurlijke
      verlichting niet mogelijk is, kan met de kunstmatige verlichting als bedoeld in het tweede en derde lid van dit
      artikel worden volstaan.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel72
  - number: '72.2'
    text: |-
      Alle verblijven moeten elektrisch kunnen worden verlicht. Wanneer geen twee onafhankelijke elektriciteitsbronnen
      voor de verlichting aanwezig zijn, moet tevens een elektrische noodverlichting zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel72
  - number: '72.3'
    text: |-
      De elektrische verlichting moet zodanig zijn aangebracht en van zodanige sterkte zijn, dat de gebruikers van het
      verblijf er een optimaal profijt van hebben.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel72
  - number: '72.4'
    text: |-
      Boven de normale verlichting van het nachtverblijf moet aan het hoofdeinde van elke slaapplaats een doelmatige
      elektrische leeslamp zijn aangebracht. Tevens dient in dit verblijf gedurende de gehele nacht een blauwe lamp te
      branden.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel72
  - number: '73.1'
    text: |-
      Alle verblijven moeten ten genoege van Onze Minister van Infrastructuur en Milieu doeltreffend kunnen worden
      geventileerd, zodanig dat de lucht in een bevredigende toestand blijft en voldoende afvoer van bedorven en toevoer
      van verse lucht onder alle weersomstandigheden zijn gewaarborgd, zonder dat hinderlijke tocht wordt veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel73
  - number: '73.2'
    text: |-
      Schepen die regelmatig worden gebezigd op reizen in de tropen of in andere gebieden met vergelijkbare
      klimatologische omstandigheden, dienen te zijn uitgerust met mechanische ventilatiemiddelen en met elektrisch
      aangedreven waaiers, met dien verstande dat slechts één van deze middelen behoeft te worden aangebracht in ruimten
      waar dit een voldoende ventilatie verzekert.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel73
  - number: '73.3'
    text: |-
      Schepen die worden gebezigd op reizen in gebieden buiten die genoemd in het tweede lid van dit artikel, dienen te
      zijn uitgerust met mechanische ventilatiemiddelen of met elektrisch aangedreven waaiers. Voor schepen die geregeld
      worden gebezigd op reizen in koude streken, kan Onze Minister van Infrastructuur en Milieu vrijstelling van dit
      voorschrift verlenen.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel73
  - number: '73.4'
    text: |-
      Het vermogen dat nodig is om de ventilatiemiddelen, voorgeschreven in het tweede en derde lid van dit artikel,
      aan te drijven, moet beschikbaar zijn gedurende de gehele tijd dat de bemanning aan boord woont of werkt en de
      omstandigheden dit vereisen.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel73
  - number: '73.5'
    text: Alle privaten moeten onafhankelijk van elk ander gedeelte van de verblijven op de buitenlucht ventileren.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel73
  - number: '74.1'
    text: |-
      Met in achtneming van het bepaalde in het tweede lid van dit artikel, dient een nachtverblijf ten hoogste te zijn
      bestemd voor het hieronder vermelde aantal personen:
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel74
  - number: 74.1.a
    text: |-
      een nachtverblijf voor officieren: op schepen met een lengte van 60 meter en meer: 1 persoon op schepen met een
      lengte van minder dan 60 meter: 2 personen;
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel74
  - number: 74.1.b
    text: |-
      een nachtverblijf voor scheepsgezellen: op schepen met een lengte van 60 meter en meer: 2 personen op schepen met
      een lengte van 35 tot 60 meter: 4 personen op schepen met een lengte van minder dan 35 meter: 6 personen.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel74
  - number: '74.2'
    text: |-
      Op schepen met een lengte van minder dan 35 meter kan het nachtverblijf voor officieren en dat voor scheepsgezellen
      worden gecombineerd tot één verblijf voor ten hoogste 6 personen.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel74
  - number: '74.3'
    text: |-
      Op schepen met een lengte van 35 meter en meer moeten voor het dekpersoneel, het machinekamerpersoneel en het
      personeel voor de civiele dienst afzonderlijke nachtverblijven beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel74
  - number: '74.4'
    text: |-
      Voor zover dit praktisch uitvoerbaar is, moet het onderbrengen van de bemanning zo geschieden dat de wachten
      gescheiden zijn en vrije wachtgasten (daglieden) geen nachtverblijf delen met wachtdoenden.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel74
  - number: '74.5'
    text: Elk nachtverblijf moet duidelijk zijn gemerkt met het maximum aantal personen waarvoor het bestemd is.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel74
  - number: '75.1'
    text: |-
      Alle nachtverblijven moeten zodanig zijn uitgevoerd en ingericht, dat de netheid wordt bevorderd en redelijk
      comfort aan de bewoners wordt verzekerd.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel75
  - number: '75.2'
    text: |-
      Het vloeroppervlak per persoon in een nachtverblijf voor scheepsgezellen of in een gecombineerd nachtverblijf
      voor officieren en scheepsgezellen als bedoeld in het [tweede lid van artikel 74][ref1], de ruimte ingenomen door
      slaapplaatsen en kasten niet meegerekend, moet ten minste bedragen:


      [ref1]: https://wetten.overheid.nl/BWBR0001985#Artikel74
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0001985
        artikel: '74'
        hoofdstuk: VII
        paragraaf: '3'
  - number: 75.2.a
    text: 'op schepen met een lengte van 13 tot 19 meter: 0,5 m2,'
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel75
  - number: 75.2.b
    text: 'op schepen met een lengte van 19 tot 26 meter: 0,75 m2,'
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel75
  - number: 75.2.c
    text: 'op schepen met een lengte van 26 tot 35 meter: 0,9 m2,'
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel75
  - number: 75.2.d
    text: 'op schepen met een lengte van 35 meter en meer: 1,0 m2.'
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel75
  - number: '75.3'
    text: |-
      Het vloeroppervlak per persoon in een nachtverblijf voor officieren, de ruimte ingenomen door slaapplaatsen en
      kasten niet meegerekend, moet ten minste bedragen:
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel75
  - number: 75.3.a
    text: 'op schepen met een lengte van minder dan 60 meter: 2,0 m2,'
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel75
  - number: 75.3.b
    text: 'op schepen met een lengte van 60 meter en meer: 2,5 m2.'
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel75
  - number: '75.4'
    text: |-
      In een nachtverblijf dient voor iedere bewoner een kleerkast aanwezig te zijn met een hoogte van ten minste
      1,75 met en een dwarsdoorsnede van ten minste 0,2 m2, voorzien van een legplank en een roede waaraan kleding op
      kleerhangers kan worden gehangen. De kast moet zijn voorzien van een slot of van lippen voor een hangslot.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel75
  - number: '75.5'
    text: |-
      In een nachtverblijf dient voor iedere bewoner een lade of soortgelijke ruimte aanwezig te zijn met een inhoud van
      tenminste 60 dm3.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel75
  - number: '75.6'
    text: |-
      In een nachtverblijf dient een tafel of lessenaar met een gemakkelijke zitgelegenheid aanwezig te zijn. De tafel of
      lessenaar mag vast, klapbaar of uitschuifbaar zijn.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel75
  - number: '75.7'
    text: |-
      Een nachtverblijf dient te zijn uitgerust met een spiegel, kastjes voor toiletbenodigdheden, een boekenrek en een
      voldoende aantal kleerhaken.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel75
  - number: '75.8'
    text: |-
      Een nachtverblijf voor officieren moet bovendien zijn voorzien van een wastafel, de nodige legkasten of laden,
      gordijnen, handdoek- en deurhaken en van een doelmatige vloerbedekking.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel75
  - number: '75.9'
    text: |-
      De meubelen dienen te zijn vervaardigd van glad, hard materiaal dat niet krom trekt of roest en waarin zich geen
      ongedierte kan nestelen.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel75
  - number: '75.10'
    text: Voor de patrijspoorten in een nachtverblijf dienen gordijnen of jaloezieën te zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel75
  - number: '75.11'
    text: Voor elk lid van de bemanning moet een afzonderlijke slaapplaats beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel75
  - number: '75.12'
    text: Slaapplaatsen moeten behoorlijk van elkaar zijn gescheiden en elk afzonderlijk toegankelijk zijn.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel75
  - number: '75.13'
    text: Er mogen niet meer dan twee slaapplaatsen boven elkaar zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel75
  - number: '75.14'
    text: |-
      De onderkant van de onderste slaapplaats moet ten minste 30 centimeter boven de vloer liggen; de afstand tussen de
      onderkant van de onderste slaapplaats en de onderkant van de bovenste slaapplaats en de afstand tussen de onderkant
      van de bovenste slaapplaats en de onderkant van het plafond dient ten minste 75 centimeter te bedragen.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel75
  - number: '75.15'
    text: |-
      Aan de onderkant van de bovenste slaaplaats dient een stofdichte bodem van hout, zeildoek of ander geschikt
      materiaal te zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel75
  - number: '75.16'
    text: De slaapplaatsen moeten binnenwerks gemeten ten minste 2,0 meter lang en 0,68 meter breed zijn.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel75
  - number: '75.17'
    text: |-
      De slaapplaatsen moeten van hout of van deugdelijk hard materiaal dat niet gemakkelijk roest, zijn vervaardigd.
      De constructie moet zo zijn dat er zich geen ongedierte in kan nestelen en de slaapplaats gemakkelijk kan worden
      schoongemaakt. Indien slaapplaatsen uit buizen zijn samengesteld, mogen deze buizen geen openingen hebben die aan
      ongedierte toegang kunnen verlenen. Houten kooiplanken moeten uitneembaar zijn. Elke slaapplaats moet zijn voorzien
      van een matras van deugdelijk materiaal. Als vulling voor matrassen mag geen materiaal worden gebruikt, waarin zich
      ongedierte kan nestelen.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel75
  - number: '75.18'
    text: Onder de opening van een luchtkoker mag geen slaapplaats aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel75
  - number: '76.1'
    text: |-
      De grootte en de inrichting, het aantal tafels en geschikte zitplaatsen van een dagverblijf moeten voldoende zijn
      voor het aantal personen dat gelijktijdig van het verblijf gebruik moet kunnen maken.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel76
  - number: '76.2'
    text: |-
      Tenzij pantries aanwezig zijn die in rechtstreekse verbinding staan met de dagverblijven, moet in deze verblijven
      voldoende kastruimte aanwezig zijn voor het opbergen van eetgerei, alsmede een geschikte gelegenheid voor het
      schoonmaken daarvan.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel76
  - number: '76.3'
    text: |-
      De bovenkanten van tafels en zitplaatsen moeten zijn vervaardigd van vochtwerend materiaal, zonder barsten en
      gemakkelijk schoon te houden.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel76
  - number: '76.4'
    text: |-
      Waar dit uitvoerbaar is, dienen de dagverblijven zodanig te zijn ontworpen, gemeubileerd en uitgerust dat zij
      gelegenheid bieden tot ontspanning.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel76
  - number: '76.5'
    text: Indien een radiodistributie-installatie aanwezig is, moeten de dagverblijven daarop zijn aangesloten.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel76
  - number: '77.1'
    text: |-
      Elk schip moet zijn voorzien van voldoende sanitaire voorzieningen, met inbegrip van wastafels, douches en
      privaten.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel77
  - number: '77.2'
    text: |-
      Voor personen die gebruik maken van een nachtverblijf dat niet is voorzien van eigen sanitair, moeten de volgende
      voorzieningen aanwezig zijn:
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel77
  - number: 77.2.a
    text: één wastafel voor elke 6 personen of minder,
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel77
  - number: 77.2.b
    text: één douche voor elke 8 personen of minder,
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel77
  - number: 77.2.c
    text: één privaat voor elke 8 personen of minder.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel77
  - number: '78.1'
    text: 'Sanitaire inrichtingen bestemd voor gemeenschappelijk gebruik dienen aan de volgende eisen te voldoen:'
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel78
  - number: 78.1.a
    text: |-
      de vloer moet van deugdelijk, duurzaam en gemakkelijk te reinigen materiaal zijn vervaardigd dat ondoordringbaar is
      voor vocht; een behoorlijke waterafvoer moet mogelijk zijn;
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel78
  - number: 78.1.b
    text: |-
      de schotten moeten van staal of ander deugdelijk materiaal zijn vervaardigd en tot een hoogte van ten minste 25
      centimeter boven de vloer waterdicht zijn uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel78
  - number: 78.1.c
    text: |-
      privaten moeten op voldoende wijze van elkaar zijn gescheiden; zij moeten gemakkelijk bereikbaar zijn gelegen,
      afgescheiden van de verblijven. Zij mogen noch rechtstreeks in verbinding staan met de nachtverblijven, noch met
      een doodlopende gang tussen de nachtverblijven en de privaten, met dien verstande dat dit niet geldt voor een
      privaat tussen twee nachtverblijven die tezamen voor niet meer dan 4 personen zijn bestemd;
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel78
  - number: 78.1.d
    text: |-
      privaten moeten van een ruime afvoer zijn voorzien en elk afzonderlijk door middel van een deugdelijke vast
      aangebrachte inrichting van voldoende capaciteit gemakkelijk kunnen worden doorgespoeld, zodanig dat geen stank
      wordt verspreid. De watertoevoer moet steeds beschikbaar zijn en onafhankelijk te bedienen. De privaten moeten van
      een zodanig model zijn en de afvoer zodanig zijn ingericht, dat de kans op verstopping zo klein mogelijk is en het
      schoonhouden vergemakkelijkt wordt. De afvoer mag niet door drinkwatertanks en, indien uitvoerbaar, niet onderdeks
      door dag- of nachtverblijven lopen;
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel78
  - number: 78.1.e
    text: |-
      wastafels moeten voldoende afmetingen hebben en zijn vervaardigd van deugdelijk materiaal met een gladde
      oppervlakte, niet onderhevig aan scheuren, schilferen of roesten;
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel78
  - number: 78.1.f
    text: alle wastafels en douches moeten zijn voorzien van stromend koud en warm zoetwater.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel78
  - number: '78.2'
    text: |-
      Het bepaalde onder *a, b, d, e* en *f* van het eerste lid van dit artikel is mede van toepassing op wastafels in
      nachtverblijven en op sanitaire inrichtingen die rechtstreeks in verbinding staan met nachtverblijven.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel78
  - number: '79.1'
    text: |-
      Op schepen met een lengte van 35 meter en meer moet voldoende ruimte beschikbaar zijn voor het wassen en drogen
      van kleding.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel79
  - number: '79.2'
    text: |-
      De wasplaats voor kleding dient geschikte spoelbakken te bevatten die zijn voorzien van een afvoer. Zij mogen in
      een badkamer worden geplaatst indien niet in een afzonderlijke wasruimte kan worden voorzien. De spoelbakken moeten
      zijn voorzien van stromend koud en warm zoet water.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel79
  - number: '79.3'
    text: |-
      Een van de verblijven afgescheiden ruimte moet beschikbaar zijn voor het drogen van kleding. Deze ruimte moet
      voldoende kunnen worden verwarmd en geventileerd en zijn voorzien van middelen voor het ophangen van kleding.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel79
  - number: '80'
    text: |-
      Op elk schip dient nabij de nachtverblijven, doch daarvan gescheiden, voldoende en behoorlijk geventileerde
      bergruimte aanwezig te zijn om oliegoed en natte of vuile kledingstukken op te hangen.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel80
  - number: '81.1'
    text: |-
      Op schepen met een lengte van 45 meter en meer moet een afzonderlijk ziekenverblijf aanwezig zijn dat voldoet aan
      het terzake bepaalde in [artikel 61][ref1] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0001985#Artikel61
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0001985
        artikel: '61'
        hoofdstuk: VII
        paragraaf: '2'
  - number: '81.2'
    text: |-
      Op schepen met een lengte van 35 tot 45 meter moet voor een zieke of gewonde een éénpersoons nachtverblijf
      beschikbaar kunnen worden gesteld, waarin de slaapplaats als ziekenkooi is ingericht. Op schepen met een lengte van
      minder dan 35 meter kan worden volstaan met een als ziekenkooi ingerichte slaapplaats in een nachtverblijf.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel81
  - number: '81.3'
    text: |-
      De ziekenkooi moet zodanig zijn ingericht, dat de zieke er gemakkelijk met de matras ingebracht en uitgenomen kan
      worden, waartoe zo nodig de schotten wegneembaar moeten zijn.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel81
  - number: '81.4'
    text: |-
      Indien iemand aan een ernstige of aan een besmettelijke ziekte lijdt, moet zoveel doenlijk getracht worden de zieke
      afgezonderd van alle anderen te verplegen.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel81
  - number: '82.1'
    text: |-
      De verblijven moeten schoon en in behoorlijk bewoonbare toestand worden gehouden; goederen en voorraden die niet
      het persoonlijk eigendom zijn van de gebruikers van het verblijf, mogen er niet worden opgeborgen.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel82
  - number: '82.2'
    text: |-
      Ten minste éénmaal per week wordt door de kapitein of een daarvoor door hem aangewezen officier een inspectie
      van alle verblijven gehouden, waarbij hij zich door een of meer leden van de bemanning doet vergezellen. Van zijn
      bevindingen wordt in het scheepsdagboek melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel82
  - number: '83'
    text: |-
      De kapitein is verplicht, indien gebreken blijken aan voorgeschreven inrichtingen en hulpmiddelen, daarin zo
      spoedig mogelijk te doen voorzien.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel83
  - number: '84.1'
    text: |-
      Behoudens het bepaalde in het derde en vierde lid, zijn de [artikelen 68-81][ref1] niet van toepassing op bestaande
      vissersschepen. Op bestaande vissersschepen blijven van toepassing de artikelen 46-65, voorkomende in het besluit
      van 15 mei 1937, *Stb.* 242, zoals deze luidden voor 12 mei 1977.


      [ref1]: https://wetten.overheid.nl/BWBR0001985#Artikel68
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0001985
        artikel: '68'
        hoofdstuk: VII
        paragraaf: '3'
  - number: '84.2'
    text: |-
      Onze Minister van Infrastructuur en Milieu kan, na overleg met de rechtspersoonlijkheid bezittende organisaties van
      werkgevers en vissers afwijkingen toestaan van het bepaalde in de [artikelen 68-81][ref1], indien deze afwijkingen
      voordelen medebrengen welke tot resultaat hebben, dat de inrichting over het geheel genomen niet minder gunstig is
      dan die, welke het gevolg zou zijn van volledige toepassing van de bepalingen van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0001985#Artikel68
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0001985
        artikel: '68'
        hoofdstuk: VII
        paragraaf: '3'
  - number: '84.3'
    text: |-
      Voor een vissersschip dat voor 12 mei 1977 geheel gereed was, kan Onze Minister van Infrastructuur en Milieu,
      na raadpleging van de rechtspersoonlijkheid bezittende organisaties van werkgevers en vissers, wanneer het schip
      onder Nederlandse vlag wordt gebracht of wanneer ingrijpende veranderingen in de bouw of grote reparaties aan het
      schip worden uitgevoerd volgens een tevoren ontworpen plan en niet tengevolge van een ongeval of ramp, wijzigingen
      voorschrijven, welke nodig zijn om het schip te laten voldoen aan de eisen gesteld in de [artikelen 68-81][ref1],
      voor zover hij dit mogelijk acht, daarbij rekening houdende met alle praktische problemen welke zich bij de
      toepassing voordoen.


      [ref1]: https://wetten.overheid.nl/BWBR0001985#Artikel68
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0001985
        artikel: '68'
        hoofdstuk: VII
        paragraaf: '3'
  - number: '84.4'
    text: |-
      Was een vissersschip voor 12 mei 1977 in aanbouw of werd het op die datum verbouwd, dan kan Onze Minister
      van Infrastructuur en Milieu, na raadpleging van de in het derde lid genoemde belanghebbenden, wijzigingen
      voorschrijven, welke nodig zijn om het schip te laten voldoen aan de eisen gesteld in de [artikelen 69-81][ref1],
      voorzover hij dit mogelijk acht, daarbij rekening houdende met alle praktische problemen welke zich bij de
      toepassing voordoen.


      [ref1]: https://wetten.overheid.nl/BWBR0001985#Artikel69
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0001985
        artikel: '69'
        hoofdstuk: VII
        paragraaf: '3'
  - number: '84.5'
    text: |-
      Onze Minister van Infrastructuur en Milieu kan bij de toepassing van het derde of vierde lid bepalen binnen welke
      tijdsduur de voor te schrijven wijzigingen ten uitvoer moeten worden gelegd.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel84
  - number: '85.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens dit besluit ten aanzien van vissersschepen, zijn
      belast de bij besluit van Onze Minister van Infrastructuur en Milieu aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel85
  - number: '85.2'
    text: |-
      Aan vissersschepen wordt een certificaat voor de verblijven afgegeven, indien is voldaan aan het bepaalde in het
      derde lid.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel85
  - number: '85.3'
    text: |-
      Ter verkrijging van een certificaat als bedoeld in het tweede lid, wendt degene die het schip laat bouwen
      zich, alvorens met de bouw van het schip wordt begonnen, tot Onze Minister van Infrastructuur en Milieu,
      onder overlegging van een algemeen plan, aangevende de plaats en de algemene indeling van de verblijven van de
      zeevarenden en de kombuis. Alvorens met de bouw van de verblijven en de kombuis wordt aangevangen, wordt een
      uitgewerkt plan met toelichting overgelegd, aangevende de ligging van elke ruimte, de meubilering en stoffering, de
      ventilatie, verlichting en verwarming en de sanitaire inrichtingen.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel85
  - number: '85.4'
    text: |-
      Afschriften van het uitgereikte certificaat voor de verblijven zijn op een duidelijk zichtbare en voor de bemanning
      toegankelijke plaats aanwezig.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel85
  - number: '85.5'
    text: |-
      Wanneer door een organisatie die rechtspersoon met volledige rechtsbevoegdheid is van zeevarenden, dan wel door
      ten minste een derde van de zeevarenden bij Onze Minister van Infrastructuur en Milieu een klacht is ingediend,
      inhoudende, dat de verblijven op een vissersschip niet aan de voorschriften voldoen, wordt door een bij besluit van
      Onze Minister van Infrastructuur en Milieu aangewezen ambtenaar een onderzoek ingesteld, indien de klacht zo tijdig
      binnenkomt, dat het onderzoek kan geschieden zonder het schip op te houden.
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel85
  - number: '86'
    text: |-
      Dit besluit is niet van toepassing op een nieuw vissersvaartuig als bedoeld in bijlage II, voorschrift 2, onder b,
      van Richtlijn (EU) 2017/159 van de Raad van 19 december 2016 tot uitvoering van de op 21 mei 2012 door het Algemeen
      Comité van de landbouwcoöperaties van de Europese Unie (COGECA), de Europese Federatie van vervoerswerknemers (ETF)
      en de Vereniging van de nationale organisaties van visserijondernemingen in de Europese Unie (Europêche) gesloten
      Overeenkomst betreffende de uitvoering van het Verdrag betreffende werk in de visserijsector van de Internationale
      Arbeidsorganisatie uit 2007 (PbEU 2016, L 25).
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel86
  - number: '87'
    text: |-
      Dit besluit berust mede op [artikel 64 van de Wet zeevarenden][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel64
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '64'
  - number: '88'
    text: Dit besluit kan worden aangehaald onder den titel van "Schepelingenbesluit".
    url: https://wetten.overheid.nl/BWBR0001985/2019-11-15#Artikel88
