  - number: '2'
    text: |-
      Ingeval de ondernemer ter zake van een prestatie als is bedoeld in [artikel 1, eerste lid, letter b of c][ref1],
      een vergoeding in rekening heeft gebracht en deswege omzetbelasting is verschuldigd, wordt de aftrek niet
      uitgesloten tot het bedrag van de ter zake van die prestatie verschuldigde belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0002636#Artikel1
    url: https://wetten.overheid.nl/BWBR0002636/2019-02-23#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002636
        artikel: '1'
  - number: '3'
    text: |-
      1 Indien goederen en diensten door de ondernemer worden gebezigd ten behoeve van de verstrekking van spijzen en
      dranken aan zijn personeel en hij ter zake van die verstrekking minder in rekening heeft gebracht dan het in het
      tweede lid omschreven bedrag, wordt de aftrek uitgesloten tot 9 percent van het verschil tussen dat bedrag en
      hetgeen in rekening is gebracht.

      2 Het in het eerste lid bedoelde bedrag bestaat uit de aanschaffingskosten van de spijzen en dranken, de
      omzetbelasting niet daaronder begrepen, vermeerderd met 25 percent. Voor zover de ondernemer de spijzen en
      dranken zelf heeft vervaardigd, worden in plaats van de aanschaffingskosten van de spijzen en dranken de
      aanschaffingskosten van de grondstoffen in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0002636/2019-02-23#Artikel3
  - number: '4'
    text: |-
      1 Indien het totaal van de aanschaffings- of voortbrengingskosten dan wel de kostprijs, de omzetbelasting niet
      daaronder begrepen, van alle door de ondernemer in een boekjaar ten behoeve van eenzelfde belanghebbende verrichte
      prestaties als zijn bedoeld in [artikel 1, eerste lid, letters b en c][ref1], en het op die belanghebbende
      betrekking hebbende deel van het in [artikel 3, eerste lid][ref2], bedoelde verschil niet meer bedraagt dan € 227,
      blijven die prestaties en dat deel van bedoeld verschil voor de toepassing van dit besluit buiten aanmerking.

      2 Bij het berekenen van het in het eerste lid bedoelde totaal blijft het in [artikel 3, eerste lid][ref3], bedoelde
      verschil buiten aanmerking, indien ter zake van het verstrekken van spijzen en dranken aan het personeel van de
      ondernemer uitsluiting van de aftrek heeft plaatsgevonden op de voet van [artikel 3][ref4].


