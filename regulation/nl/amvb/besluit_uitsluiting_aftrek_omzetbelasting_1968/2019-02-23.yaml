  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van de Staatssecretaris van Financiën van 23 september 1968, nr. D 68/6240, directie Wetgeving
    Douane en Verbruiksbelastingen;

    Gelet op artikel 16 van de Wet op de omzetbelasting 1968 (Stb. 329);

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002636/2019-02-23#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 De in [artikel 15, eerste lid, van de Wet op de omzetbelasting 1968][ref1] bedoelde aftrek wordt uitgesloten in
      de gevallen waarin en voor zover de goederen en diensten worden gebezigd voor:

      a. het voeren van een zekere staat;

      b. het geven van relatiegeschenken of het doen van andere giften aan degenen bij wie, indien aan hen ter zake
      omzetbelasting in rekening is of zou zijn gebracht, deze in het geheel niet of hoofdzakelijk niet voor aftrek in
      aanmerking komt of zou komen;

      c. het aan het personeel van de ondernemer verlenen van huisvesting, uitkeren van loon in natura, geven van
      gelegenheid tot sport, ontspanning of privé-vervoer, dan wel voor andere persoonlijke doeleinden van dat personeel.
      De terbeschikkingstelling van een auto wordt van het vorenstaande uitgezonderd.

      2 Onder relatiegeschenken of andere giften worden verstaan alle prestaties welke de ondernemer in verband met
      zakelijke verhoudingen of uit vrijgevigheid ten behoeve van anderen verricht zonder vergoeding of tegen een
      vergoeding welke lager is dan de aanschaffings- of voortbrengingskosten dan wel, in geval van diensten, de
      kostprijs van die prestaties de omzetbelasting niet daaronder begrepen.

      3 Onder de prestaties als zijn bedoeld in het eerste lid, onderdeel *c*, worden niet begrepen:

      a. het verstrekken van spijzen en dranken aan het personeel van de ondernemer;

      b. het vervoer van het personeel van de ondernemer tussen de woon- of verblijfplaats en de plaats waar de
      werkzaamheden worden verricht, indien dit vervoer geschiedt in de vorm van besloten busvervoer als bedoeld
      in [artikel 1, onderdeel i, van de Wet personenvervoer 2000][ref2] op grond van een krachtens die wet daartoe
      verleende vergunning;

      c. het aan een werknemer verstrekken of ter beschikking stellen van een fiets voor het vervoer van die werknemer
      tussen zijn woon- of verblijfplaats en de plaats waar deze zijn werkzaamheden verricht, voorzover:

      1°. de aanschaffings- of voortbrengingskosten van de fiets niet meer bedragen dan € 749 inclusief omzetbelasting
      of, in gevallen waarin de werkgever een gebruiksrecht van een derde heeft verworven, de totale kostprijs inclusief
      omzetbelasting van dat recht niet meer bedraagt dan € 749;

      2°. in het kalenderjaar en de twee voorafgaande kalenderjaren aan de werknemer geen fiets is verstrekt of ter
      beschikking is gesteld; en

      3°. vanaf het verstrekken of ter beschikking stellen tot het einde van het kalenderjaar en in elk van de twee
      daaropvolgende kalenderjaren niet voor 50 percent of meer van het aantal dagen dat de werknemer pleegt te reizen
      tussen zijn woon- of verblijfplaats en de plaats waar deze zijn werkzaamheden verricht, wordt voorzien in een
      vergoeding of ander vervoer dan het vervoer per fiets;

      d. outplacement ten behoeve van het personeel van de ondernemer.


