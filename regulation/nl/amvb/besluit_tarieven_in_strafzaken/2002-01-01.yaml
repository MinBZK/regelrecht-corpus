    text: |-
      1 Wegens tijdverzuim, als bedoeld in artikel 3, lid 1, sub *b,* van de [Wet tarieven in strafzaken][ref1], zijn
      vergoedingen verschuldigd berekend naar de volgende tarieven:

      I. aan artsen tot uitoefening van de praktijk in Nederland bevoegd f 83,40 tot f 116,60 per uur

      II. Aan vertalers en tolken afhankelijk van de taal, de vakbekwaamheid en de duur van het tijdverzuim tenminste f
      10,- per uur en ten hoogste f 116,60 per uur.

      III. aan andere personen, aan wie werkzaamheden zijn opgedragen, naar gelang de werkzaamheden niet, of in mindere
      of meerdere mate van wetenschappelijke of bijzondere aard zijn, ten minste f 10,- en ten hoogste f 116,60 per uur.

      IV. aan getuigen, met uitzondering van minderjarigen, die geen inkomsten derven, aan voogden, die wegens een
      strafzaak tegen een onder hun gezag staande minderjarige ingevolge het [Wetboek van Strafvordering][ref2] moeten
      worden opgeroepen, aan curatoren, bij toepassing van [artikel 509][ref3], aan noodzakelijke geleiders van de
      bovengenoemde personen, van personen aan wie werkzaamheden zijn opgedragen, van verdachten en van gerekwestreerden
      f 10,30 per uur.

      2 De in het eerste lid bedoelde vergoeding komt voor de tijd aan de reis besteed niet toe aan artsen, vertalers,
      tolken en andere personen, aan wie werkzaamheden zijn opgedragen van wetenschappelijke of bijzondere aard.

      3 Onze Minister van Justitie kan nadere regelen stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002406
      [ref2]: https://wetten.overheid.nl/BWBR0001903
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel509d
