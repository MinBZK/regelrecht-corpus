      Tot de in [artikel 2 van de Wet tarieven in strafzaken][ref1] bedoelde buitengewone, bij en krachtens deze wet niet
      voorziene kosten worden gerekend vergoedingen voor werkzaamheden, verricht door, wegens tijdverzuim en daarmede
      verband houdende noodzakelijke kosten en voor reis- en verblijfkosten van personen, ten aanzien van wie in verband
      met hun verblijf buitenslands moet worden afgeweken van de tarieven, vervat in de [artikelen 1][ref2]-[4][ref3]
      en [6][ref4].


