      Voor het uitbrengen van exploiten ingevolge bijzondere wetten is aan de deurwaarders een vergoeding verschuldigd,
      berekend naar de in het [Besluit tarieven ambtshandelingen gerechtsdeurwaarders][ref1] bepaalde tarieven met dien
      verstande dat het tarief voor het uitreiken van gerechtelijke stukken € 46,58 bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0012638
