        artikel: '6'
  - number: '9'
    text: |-
      1 Behalve in de gevallen, bedoeld in [artikel 17, tweede lid, van de Wet tarieven in strafzaken][ref1], wordt
      bovendien geen recht geheven voor:

      a. het geven van inzage van vonnissen, arresten, registers of andere stukken, waarvan kennisneming geoorloofd is,
      of voor het verstrekken van inlichtingen aan de verdachte, de gewezen verdachte, de gerekwestreerde, de gewezen
      gerekwestreerde, de beledigde partij - ook indien deze zich niet in de strafzaak voegt doch dan slechts voorzover
      hij belang heeft bij de gewenste gegevens, hij deze niet op andere wijze kan verkrijgen en hij niet in staat is
      enig recht te betalen -;

      b. het verstrekken van afschriften van of uittreksels uit vonnissen, arresten, registers of andere stukken, waarvan
      kennisneming geoorloofd is, aan de verdachte, de gewezen verdachte, de gerekwestreerde, de gewezen gerekwestreerde,
      de beledigde partij - ook indien deze zich niet in de strafzaak voegt -, voor zover zij daarbij belang hebben, niet
      op andere wijze in de behoefte kunnen voorzien en niet in staat zijn enig recht te betalen.

      2 Aan de advocaat of de gemachtigde van de in het eerste lid bedoelde personen wordt evenmin recht in rekening
      gebracht in de gevallen, waarin deze personen geen recht verschuldigd zijn.

      3 In de overige gevallen wordt door de griffier een recht berekend van:

      a. f 7,- per aanvrage, voor inzage van en voor het verstrekken van afschriften van en uittreksels en inlichtingen
      uit vonnissen, arresten, registers of andere stukken, waarvan kennisneming geoorloofd is, betrekking hebbende op
      één zaak, tenzij de aanvrager recht heeft op kosteloze inzage van of inlichtingen uit de desbetreffende stukken;

      b. f 0,40 per bladzijde voor afschriften van de onder *a* vermelde stukken, tenzij ingevolge enig wettelijk
      voorschrift een lager bedrag moet worden berekend.

      Indien op een aanvrage om inzage, afschriften of inlichtingen afwijzend moet worden beschikt, omdat geen inzage mag
      worden verleend, of geen inlichtingen of afschriften mogen worden verstrekt, is geen recht verschuldigd.

      4 Tegen een weigering van de griffier tot toepassing van het eerste of het tweede lid en tegen een
      beschikking op grond van het derde lid, kan de belanghebbende schriftelijk bezwaar indienen bij de
      voorzieningenrechter van het gerecht en indien het de Hoge Raad betreft, bij de president van de Hoge Raad. De
      [artikelen 10 tot en met 13 van de Wet tarieven in strafzaken][ref2] zijn van overeenkomstige toepassing.

      5 Onze Minister van Justitie is bevoegd, te bepalen dat voor door hem aan te wijzen doeleinden van algemeen belang
      niet getekende afschriften en uittreksels kunnen worden afgegeven, inzage kan worden verleend en inlichtingen
      kunnen worden verstrekt tegen betaling van een door hem aan te geven lager recht, dan het in het derde lid genoemde
      of zonder betaling van enig recht.

      6 Onze Minister van Justitie kan nadere regelen stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002406#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002406#Artikel10
