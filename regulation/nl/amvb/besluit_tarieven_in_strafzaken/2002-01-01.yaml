  - number: '6'
    text: |-
      1 Voor reis- en verblijfkosten als bedoeld in [artikel 6 van de Wet tarieven in strafzaken][ref1] zijn vergoedingen
      verschuldigd berekend naar de volgende tarieven:

      I. aan personen, als bedoeld in [artikel 2, lid 2 f][ref2] 3,40 per retourkilometer; het aantal retourkilometers
      wordt berekend naar de kortste reisroute, met dien verstande dat voor de eerste 4 retourkilometers geen vergoeding
      wordt gegeven.

      II. aan personen, aan wie op grond van artikel 3, derde lid, sub *c, d* en *e,* van de
      [Wet tarieven in strafzaken][ref3] geen vergoeding wegens tijdverzuim toekomt, ... op de voet van het Reisbesluit
      1971

      III. aan personen, aan wie werkzaamheden zijn opgedragen, die niet van wetenschappelijke of bijzondere aard zijn,
      aan getuigen, aan voogden die wegens een strafzaak tegen een onder hun gezag staande minderjarige ingevolge het
      [Wetboek van Strafvordering][ref4] moeten worden opgeroepen, aan curatoren, bij toepassing van [artikel 509][ref5],
      en aan noodzakelijke geleiders van deze personen, van personen aan wie werkzaamheden zijn opgedragen, van
      verdachten en van gerekwestreerden. de reiskosten per openbaar middel van vervoer, laagste klasse, alsmede
      verblijfkosten tot ten hoogste f 83,40 per dag, met inbegrip van overnachting; een taxi wordt niet aangemerkt als
      openbaar middel van vervoer.

      2 Voor het gebruik van een bijzonder middel van vervoer in de in [artikel 7 van de Wet tarieven in strafzaken][ref6]
      bedoelde gevallen is een vergoeding verschuldigd, berekend naar de werkelijke kosten, tegen overlegging van een
      bewijs van betaling. Voor het gebruik van een eigen auto wordt ten hoogste f 0,60 per kilometer vergoed.

      3 Vergoeding voor reis- en verblijfkosten wordt niet meer dan éénmaal toegekend, ook al wordt de reis gemaakt ten
      behoeve van verschillende zaken.


