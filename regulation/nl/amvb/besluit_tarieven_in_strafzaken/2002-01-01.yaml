      1 Voor een gedeelte van een uur gelijk aan een half uur of korter is de halve uurvergoeding verschuldigd, voor een
      gedeelte langer dan een half uur is de hele uurvergoeding verschuldigd.

      2 Per dag is voor tijdverzuim ten hoogste een vergoeding voor 9 uren verschuldigd.
    url: https://wetten.overheid.nl/BWBR0002429/2002-01-01#Artikel3
  - number: '4'
    text: |-
      1 Voor met het tijdverzuim verband houdende noodzakelijke kosten wordt vergoeding gegeven tegen overlegging van een
      bewijs van betaling.

      2 Indien vergoeding wordt toegekend voor een plaatsvervanger, wordt de voor tijdverzuim toe te kennen vergoeding
      daarop in mindering gebracht.
    url: https://wetten.overheid.nl/BWBR0002429/2002-01-01#Artikel4
  - number: '5'
    text: |-
      1 Voor een lokaliteit, beschikbaar gesteld door een gemeente ingevolge een verzoek als bedoeld in
      [artikel 4 van de Wet tarieven in strafzaken][ref1] is, indien de vergoeding voor het gebruik van die lokaliteit
      in een plaatselijke belastingverordening is geregeld, een vergoeding overeenkomstig die verordening verschuldigd.
      In andere gevallen is een vergoeding verschuldigd, berekend naar het plaatselijk gangbare tarief per tijdsduur
      of per binnengebrachte gewonde of binnengebracht lijk. Is dit tarief verschillend naar gelang van een klasse-
      indeling, dan wordt de vergoeding berekend naar het tarief voor de laagste klasse. Bij vergoeding volgens dagtarief
      is voor beschikbaarstelling gedurende 6 uur of korter de halve dagprijs, voor meer dan 6 uren de hele dagprijs
      verschuldigd.

      2 Bijkomende kosten kunnen overeenkomstig plaatselijk gebruik worden vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0002406#Artikel4
    url: https://wetten.overheid.nl/BWBR0002429/2002-01-01#Artikel5
