articles:
  - number: '1'
    text: |-
      1 Voor werkzaamheden, als bedoeld in artikel 3, lid 1, sub *a,* van de [Wet tarieven in strafzaken][ref1], zijn
      vergoedingen verschuldigd berekend naar de volgende tarieven:

      I. aan artsen, tot uitoefening van de praktijk in Nederland bevoegd voor

      a. psychiatrisch onderzoek, inclusief het opmaken van een rapport, naar gelang van de uitgebreidheid der gegeven
      motivering f 688,- - f 861,-,

      indien het onderzoek omvangrijker is dan normaal, na overleg met de opdrachtgever, ten hoogste f 1284,70;

      b. onderzoek van een geestelijk gestoorde en afgifte van een verklaring, benodigd voor gedwongen opneming van de
      patiënt in een inrichting voor geestelijk gestoorden f 116,60;

      c. onderzoek en afgifte van een verklaring omtrent de conclusies van dat onderzoek door een controlerend arts of
      een rayonarts f 20,05,

      indien het onderzoek met spoed moet worden verricht f 39,15;

      d. inwendige lijkschouwing, inclusief histologisch en bacteriologisch onderzoek, de daarvoor vereiste benodigdheden
      en het opmaken van een rapport f 399,50;

      e. uitwendige lijkschouwing, inclusief het opmaken van een rapport f 49,75;

      f. uitwendige lijkschouwing, voor zover betreft het opmaken van een verslag met aandachtspunten naar aanleiding
      van een melding van een geval van uitvoering van euthanasie of hulpverlening bij zelfdoding door een gemeentelijke
      lijkschouwer f 250.

      II. aan vertalers voor vertalingen uit of in

      a. het frans, duits en engels f 1,70 per regel

      b. andere talen f 2,60 tot f 3,65 per regel

      Hetgeen voor de kantlijn staat, wordt gerekend bij de regel, waar het naast staat.

      III. Aan tolken afhankelijk van de taal, vakbekwaamheid en de duur van de werkzaamheden tenminste f 10,- per uur en
      ten hoogste f 116,60 per uur.

      IV. voor werkzaamheden, waarvoor geen speciaal tarief is bepaald, naar gelang de werkzaamheden niet, of in mindere
      of meerdere mate van wetenschappelijke of bijzondere aard zijn,

      ten minste f 10,- per uur

      en ten hoogste f 116,60 per uur,

      met dien verstande dat

      a. voor verrichtingen van medische aard de vergoedingen worden berekend volgens door Onze Minister van Justitie
      vast te stellen tarieven;

      b. voor verpleging in een inrichting tot verpleging of genezing de vergoedingen worden berekend naar de daarvoor
      geldende tarieven derde klas.

      2 Deze tarieven worden met de helft verhoogd voor werkzaamheden, die ingevolge het daartoe strekkende verzoek of de
      gegeven opdracht moeten worden verricht op:

      a. zaterdag;

      b. zondag;

      c. een in [artikel 3 van de Algemene termijnenwet][ref2] genoemde algemeen erkende feestdag of een bij of krachtens
      dat artikel daarmede gelijkgestelde dag;

      d. een andere dag, dan onder *a-c* omschreven, tussen 0 en 8 of 20 en 24 uur.

      3 Onze Minister van Justitie kan nadere regelen stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002406
      [ref2]: https://wetten.overheid.nl/BWBR0002448#Artikel3
