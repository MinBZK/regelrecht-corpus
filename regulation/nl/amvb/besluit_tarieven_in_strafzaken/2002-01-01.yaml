  - number: 7a
    text: De bedragen in dit besluit genoemd, worden verhoogd met de omzetbelasting, die daarover is verschuldigd.
    url: https://wetten.overheid.nl/BWBR0002429/2002-01-01#Artikel7a
  - number: '8'
    text: |-
      1 Aan personen, die niet in staat zijn de kosten voor de te maken reis te betalen, kan op hun verzoek door
      de griffier, belast met de betaling van de vergoeding waarop deze personen recht zullen hebben op grond van
      [artikel 6][ref1] of 7, een voorschot op de vergoeding worden verleend.

      2 Het voorschot wordt met de toe te kennen vergoeding verrekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002429#Artikel6
    url: https://wetten.overheid.nl/BWBR0002429/2002-01-01#Artikel8
