url: https://wetten.overheid.nl/BWBR0033134/2020-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties van 19 februari 2013, 2012-
    0000711991;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0033134/2020-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder: - *Onze Minister:* de Minister van Binnenlandse Zaken en Koninkrijksrelaties;
        - *het ministerie:* het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0033134/2020-01-01#Artikel1
  - number: '2'
    text: |-
      Er is een Vertegenwoordiger van de Nederlandse regering bij de regeringen van Aruba, Curaçao en Sint
      Maarten. Bij koninklijk besluit wordt besloten tot het aangaan of wijzigen van een arbeidsovereenkomst met de
      vertegenwoordiger. Tot beëindiging van de arbeidsovereenkomst wordt bij koninklijk besluit besloten, tenzij Onze
      Minister de arbeidsovereenkomst opzegt op grond van [artikel 677 van Boek 7 van het Burgerlijk Wetboek][ref1]. De
      vertegenwoordiger maakt deel uit van de organisatie van het ministerie.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel677
    url: https://wetten.overheid.nl/BWBR0033134/2020-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '677'
  - number: '3'
    text: 'De vertegenwoordiger is belast met de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0033134/2020-01-01#Artikel3
  - number: 3.a
    text: |-
      het optreden als vertegenwoordiger van de Nederlandse regering bij de regeringen van Aruba, Curaçao en Sint
      Maarten;
    url: https://wetten.overheid.nl/BWBR0033134/2020-01-01#Artikel3
  - number: 3.b
    text: |-
      het regelmatig onderhouden van contacten met de onder a genoemde regeringen alsmede met andere autoriteiten in
      die landen;
    url: https://wetten.overheid.nl/BWBR0033134/2020-01-01#Artikel3
  - number: 3.c
    text: |-
      Onze minister via zijn ministerie op structurele wijze voorzien van informatie over de bestuurlijke, financiële,
      maatschappelijke en sociaaleconomische ontwikkelingen in Aruba, Curaçao en Sint Maarten;
    url: https://wetten.overheid.nl/BWBR0033134/2020-01-01#Artikel3
  - number: 3.d
    text: |-
      het gevraagd en ongevraagd adviseren van Onze minister, zijn ministerie en andere ministeries over alles dat
      betrekking heeft op de relatie tussen Nederland, Aruba, Curaçao en Sint Maarten;
    url: https://wetten.overheid.nl/BWBR0033134/2020-01-01#Artikel3
  - number: 3.e
    text: |-
      het voorbereiden en begeleiden van bezoeken van Nederlandse ministers en staatssecretarissen, bestuurders en andere
      autoriteiten aan Aruba, Curaçao en Sint Maarten;
    url: https://wetten.overheid.nl/BWBR0033134/2020-01-01#Artikel3
  - number: 3.f
    text: |-
      het coördineren van het beleid van Nederland in Aruba, Curaçao en Sint Maarten en het bevorderen van de onderlinge
      afstemming van het beleid tussen Nederland enerzijds en Aruba, Curaçao en Sint Maarten anderzijds in aanvulling op
      de coördinerende activiteiten van het ministerie;
    url: https://wetten.overheid.nl/BWBR0033134/2020-01-01#Artikel3
  - number: 3.g
    text: het onderhouden van contacten over de uitvoering en de evaluatie van de door Nederland gefinancierde projecten;
    url: https://wetten.overheid.nl/BWBR0033134/2020-01-01#Artikel3
  - number: 3.h
    text: |-
      het onderhouden van contacten met de vanuit Nederland uitgezonden deskundigen en het adviseren van Onze minister,
      zijn ministerie en andere ministeries over de personele samenwerking tussen Nederland, Aruba, Curaçao en Sint
      Maarten;
    url: https://wetten.overheid.nl/BWBR0033134/2020-01-01#Artikel3
  - number: 3.i
    text: |-
      het fungeren als eerste aanspreekpunt voor de coördinatie van de contacten over de samenwerkingsrelatie tussen de
      landen van het Koninkrijk in de Cariben;
    url: https://wetten.overheid.nl/BWBR0033134/2020-01-01#Artikel3
  - number: 3.j
    text: |-
      het geven van voorlichting over het door Onze minister te voeren beleid ten aanzien van Aruba, Curaçao en Sint
      Maarten, alsmede over de door Nederland gefinancierde projecten in die landen;
    url: https://wetten.overheid.nl/BWBR0033134/2020-01-01#Artikel3
  - number: 3.k
    text: het verlenen van consulaire bijstand aan Europese Nederlanders;
    url: https://wetten.overheid.nl/BWBR0033134/2020-01-01#Artikel3
  - number: 3.l
    text: |-
      het verrichten van taken ingevolge de [Kieswet][ref1], zoals deze na de Wet van 20 december 2001 (Stb. 705) is
      komen te luiden.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0033134/2020-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: '4.1'
    text: De Vertegenwoordiging heeft vestigingen in Aruba, in Curaçao en in Sint Maarten.
    url: https://wetten.overheid.nl/BWBR0033134/2020-01-01#Artikel4
  - number: '4.2'
    text: De vertegenwoordiger staat aan het hoofd van de Vertegenwoordiging en heeft zijn hoofdvestiging in Curaçao.
    url: https://wetten.overheid.nl/BWBR0033134/2020-01-01#Artikel4
  - number: '4.3'
    text: |-
      De vestigingen hebben een vestigingshoofd, tevens plaatsvervangend vertegenwoordiger voor het desbetreffende land
      die ondergeschikt is aan de vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0033134/2020-01-01#Artikel4
  - number: '4.4'
    text: |-
      De personeelsformatie en de positie van de Vertegenwoordiging worden geregeld in het organisatiebesluit van het
      ministerie.
    url: https://wetten.overheid.nl/BWBR0033134/2020-01-01#Artikel4
  - number: '5'
    text: |-
      Het koninklijk besluit tot regeling van de positie van de vertegenwoordiger van de Nederlandse regering van de
      Nederlandse Antillen onderscheidenlijk Aruba van 24 april 1997, nr. 97.0011986, Stcrt, 1997, nr. 97, zoals dit
      laatstelijk gewijzigd is bij koninklijk besluit van 7 oktober 2002, nr. 02.004597, Stcrt. 2002, nr. 200 wordt
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0033134/2020-01-01#Artikel5
  - number: '6'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van de Staatcourant waarin het wordt
      geplaatst en werkt terug tot en met 10 oktober 2010.
    url: https://wetten.overheid.nl/BWBR0033134/2020-01-01#Artikel6
  - number: '7'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties is belast met de uitvoering van dit besluit dat met de
      daarbij behorende nota van toelichting in de Staatscourant zal worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0033134/2020-01-01#Artikel7
