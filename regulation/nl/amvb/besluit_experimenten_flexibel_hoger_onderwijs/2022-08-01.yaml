  - number: '16'
    text: |-
      1 Het bestuur van een deelnemende instelling sluit met een student die zich wenst in te schrijven voor hoger
      onderwijs als bedoeld in [artikel 7][ref1], een onderwijsovereenkomst, waarin in ieder geval de duur van de
      overeenkomst en het onderwijsprogramma voor de betrokken student worden vastgelegd.

      2 Het bestuur van een deelnemende instelling maakt in de onderwijs- en examenregeling bekend op welke wijze de
      onderwijsovereenkomst, bedoeld in het eerste lid, wordt gesloten en welke wederzijdse rechten en verplichtingen
      daarin in ieder geval worden vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0037837#Artikel7
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0037837
        artikel: '7'
        hoofdstuk: '2'
  - number: '17'
    text: |-
      1 Van 2017 tot en met 2020 rapporteert het bestuur van een deelnemende instelling jaarlijks over de uitvoering van
      het experiment leeruitkomsten in het voorafgaande kalenderjaar.

      2 Voor 1 mei 2021 rapporteert het bestuur van een deelnemende instelling over de uitvoering van het experiment
      leeruitkomsten in het tijdvak 2016 tot en met 2020.

      3 Het bestuur van een bekostigde instelling voor hoger onderwijs neemt de rapportages, bedoeld in het eerste
      en tweede lid, op in het verslag, bedoeld in [artikel 2.9 van de wet][ref1]. Het bestuur van een andere
      deelnemende instelling neemt de rapportages, bedoeld in het eerste en tweede lid, op in het verslag, bedoeld in
      [artikel 1.12, derde lid, van de wet][ref2].

      4 Het bestuur van een deelnemende instelling verstrekt desgevraagd nadere informatie aan Onze Minister in verband
      met de deelname aan en monitoring, evaluatie en effectmeting van het experiment leeruitkomsten.

      5 Onze Minister kan een deelnemende instelling in verband met het experiment leeruitkomsten andere, op de
      individuele instelling of op een categorie instellingen voor hoger onderwijs afgestemde, verplichtingen opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2.9
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1.12
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17
    references:
