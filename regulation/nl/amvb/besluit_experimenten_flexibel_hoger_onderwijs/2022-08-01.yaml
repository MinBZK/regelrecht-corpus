articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. *wet:* [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1];

      b. *Onze Minister:* Onze Minister van Onderwijs, Cultuur en Wetenschap;

      c. *inspectie:* de inspectie, bedoeld in de [Wet op het onderwijstoezicht][ref2];

      d. *instelling voor hoger onderwijs:* instelling voor hoger onderwijs als bedoeld in de [wet][ref3];

      e. *bekostigde instelling voor hoger onderwijs:* bekostigde instelling voor hoger onderwijs, bedoeld in
      [artikel 1.8 van de wet][ref4];

      f. *bestuur:* instellingsbestuur als bedoeld in [artikel 1.1, onderdeel j, van de wet][ref5];

      g. *rechtspersoon voor hoger onderwijs:* rechtspersoon als bedoeld in [artikel 1.1, onderdeel aa, van de wet][ref6];

      h. *hoger onderwijs:* onderwijs, bedoeld in [artikel 1.1, onderdeel d, van de wet][ref7];

      i. *wetenschappelijk onderwijs:* hoger onderwijs, bedoeld in [artikel 1.1, onderdeel c, van de wet][ref8];

      j. *hoger beroepsonderwijs:* hoger onderwijs, bedoeld in [artikel 1.1, onderdeel d, van de wet][ref9];

      k. *bacheloropleiding:* bacheloropleiding als bedoeld in
      [artikel 7.3a, eerste lid, onderdeel a, of tweede lid, onderdeel a, van de wet][ref10];

      l. *masteropleiding:* masteropleiding als bedoeld in
      [artikel 7.3a, eerste lid, onderdeel b, of tweede lid, onderdeel b, van de wet;][ref11]

      m. *deeltijds:* deeltijds als bedoeld in [artikel 7.7, eerste lid, van de wet][ref12];

      n. *duaal:* duaal als bedoeld in [artikel 7.7, tweede lid, van de wet][ref13];

      o. *Ad-opleiding:* Ad-opleiding als bedoeld in [artikel 7.3a, tweede lid, onderdeel a, van de wet][ref14];

      p. *accreditatieorgaan:* de Nederlands-Vlaamse Accreditatieorganisatie bedoeld in artikel 1 van het op 3 september
      2003 te Den Haag totstandgekomen Verdrag tussen het Koninkrijk der Nederlanden en de Vlaamse Gemeenschap van België
      inzake de accreditatie van opleidingen binnen het Nederlandse en Vlaamse hoger onderwijs (Trb. 2003, 167);

      q. *accreditatie:* keurmerk dat tot uitdrukking brengt dat de kwaliteit van een bachelor- of een masteropleiding
      door het accreditatieorgaan positief is beoordeeld;

      r. *toets nieuwe opleiding:* keurmerk dat tot uitdrukking brengt dat de kwaliteit van een voorgenomen bachelor- of
      masteropleiding door het accreditatieorgaan positief is beoordeeld;

      s. *studiepunt:* studiepunt als bedoeld in [artikel 7.4, eerste lid, van de wet][ref15];

      t. *studielast:* studielast als bedoeld in [artikel 7.4, van de wet][ref16];

      u. *leeruitkomst:* inhoud en niveau van kennis, inzicht en vaardigheden die zijn vereist om een bepaald aantal
      studiepunten te behalen;

      v. *educatieve module:* module wetenschappelijk onderwijs als bedoeld in [artikel 27][ref17];

      w. *certificaat educatieve module:* door de examencommissie van een instelling voor hoger onderwijs afgegeven
      getuigschrift ten bewijze dat een educatieve module met goed gevolg is afgerond;

      x. *examencommissie:* examencommissie als bedoeld in [artikel 7.12 van de wet][ref18];

      y. *onderwijs- en examenregeling:* onderwijs- en examenregeling als bedoeld in [artikel 7.13 van de wet][ref19];

      z. *experiment leeruitkomsten:* experiment als bedoeld in [artikel 7][ref20];

      aa. *experiment accreditatie onvolledige opleidingen:* experiment als bedoeld in [artikel 19][ref21];

      bb. *experiment educatieve module:* experiment als bedoeld in [artikel 27][ref22];

      cc. *experiment flexstuderen:* experiment als bedoeld in [artikel 17b][ref23];

      dd. *studiejaar:* tijdvak dat begint op 1 september en eindigt op 31 augustus van het daaropvolgende jaar.


