        artikel: 7.45a
  - number: '30'
    text: >-
      Onze Minister evalueert het experiment educatieve module op basis van de volgende criteria:


      a. de mate waarin meer gediplomeerden in het wetenschappelijk onderwijs zijn opgeleid voor leraar in het voortgezet
      onderwijs; en


      b. de mate waarin meer gediplomeerden op bachelorniveau in het wetenschappelijk onderwijs direct of indirect
      doorstromen naar een master lerarenopleiding op het niveau van wetenschappelijk onderwijs of naar het beroep
      leraar.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel30
  - number: '32'
    text: |-
      1 Van 2017 tot en met 2019 rapporteert het bestuur van een aan de eerste fase deelnemende instelling jaarlijks in
      het verslag, bedoeld in [artikel 2.9 van de wet][ref1], over de uitvoering van het experiment educatieve module in
      het voorafgaande kalenderjaar.

      2 Van 2020 tot en met 2023 rapporteert het bestuur van een aan de tweede fase deelnemende instelling jaarlijks in
      het verslag, bedoeld in [artikel 2.9 van de wet][ref2], over de uitvoering van het experiment educatieve module in
      het voorafgaande kalenderjaar.

      3 Voor 1 juli 2023 rapporteert het bestuur van een deelnemende instelling in het verslag, bedoeld in
      [artikel 2.9 van de wet][ref3] over de uitvoering van het experiment educatieve module gedurende de fase of fasen
      van dit experiment waaraan deze instelling heeft deelgenomen.

      4 Het bestuur van een deelnemende instelling verstrekt desgevraagd nadere informatie aan Onze Minister of het
      accreditatieorgaan in verband met de deelname aan en monitoring, evaluatie en effectmeting van het experiment
      educatieve module.

      5 Het bestuur van een deelnemende instelling bevordert dat de met goed gevolg afgeronde educatieve module een
      vrijstelling oplevert voor een universitaire lerarenopleiding onverminderd de verantwoordelijkheden van de
      examencommissie, bedoeld in [artikel 7.12 van de wet][ref4].

      6 Onze Minister kan in verband met het experiment educatieve module een deelnemende instelling andere, op een
      individuele instelling of op een categorie instellingen voor hoger onderwijs afgestemde, verplichtingen opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2.9
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel2.9
