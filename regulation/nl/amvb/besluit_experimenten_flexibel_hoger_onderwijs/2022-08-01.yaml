  - number: '24'
    text: |-
      1 Het accreditatieorgaan legt voor 1 juli 2016 in het accreditatiekader, bedoeld in [artikel 5.2 van de wet][ref1],
      vast op welke wijze en volgens welke criteria accreditatie of toets nieuwe opleiding wordt verleend aan de
      deeltijdse en duale bacheloropleidingen in het hoger beroepsonderwijs, bedoeld in [artikel 19][ref2].

      2 Het accreditatieorgaan besteedt bij het vastleggen van de werkwijze en de beoordelingscriteria, bedoeld in
      het eerste lid, in ieder geval aandacht aan de kwaliteit van de toetsing en beoordeling door de deelnemende
      rechtspersoon voor hoger onderwijs van het toelatingsniveau van aspirant-studenten op het niveau dat benodigd is
      voor deelname aan het onderwijs dat door de rechtspersoon voor hoger onderwijs wordt verzorgd in het kader van de
      desbetreffende opleiding.

      3 Het accreditatieorgaan geeft uitvoering aan de toets, bedoeld in [artikel 23, vierde lid][ref3].

      4 Het accreditatieorgaan meldt aan Onze Minister de indiening van een aanvraag als bedoeld in [artikel 23][ref4] en
      de uitkomst van de daarmee verband houdende toets, bedoeld in artikel 23, vierde lid.

      5 Het accreditatieorgaan brengt jaarlijks verslag uit over de uitvoering van het experiment accreditatie onvolledige
      opleidingen in het jaarverslag, bedoeld in [artikel 18 van de Kaderwet zelfstandige bestuursorganen][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5.2
