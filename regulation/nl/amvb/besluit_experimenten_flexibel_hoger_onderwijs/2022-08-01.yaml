  - number: '9'
    text: |-
      In verband met het experiment leeruitkomsten wordt afgeweken van de [artikelen 7.3, tweede lid][ref1], en
      [7.4 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7.3
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7.4
