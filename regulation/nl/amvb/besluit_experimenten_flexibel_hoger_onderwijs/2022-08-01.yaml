  - number: '25'
    text: |-
      1 Van 2017 tot en met 2020 rapporteert het bestuur van een deelnemende rechtspersoon voor hoger onderwijs jaarlijks
      voor 1 juli in het verslag, bedoeld in [artikel 1.12, derde lid, van de wet][ref1], aan Onze Minister over de
      uitvoering van het experiment accreditatie onvolledige opleidingen in het voorafgaande kalenderjaar.

      2 In 2021 rapporteert het bestuur van een deelnemende rechtspersoon voor hoger onderwijs aan Onze Minister over de
      uitvoering van het experiment accreditatie onvolledige opleidingen in het tijdvak 2016 tot en met 2020.

      3 Het bestuur van een deelnemende rechtspersoon voor hoger onderwijs verstrekt desgevraagd nadere informatie aan
      Onze Minister of het accreditatieorgaan in verband met de deelname aan en monitoring, evaluatie en effectmeting van
      het experiment accreditatie onvolledige opleidingen.

      4 Onze Minister kan in verband met het experiment accreditatie onvolledige opleidingen een deelnemende instelling
      andere, op een individuele instelling of op een categorie instellingen voor hoger onderwijs afgestemde,
      verplichtingen opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1.12
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel25
