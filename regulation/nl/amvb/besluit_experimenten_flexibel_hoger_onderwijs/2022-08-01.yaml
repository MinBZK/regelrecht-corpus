  - number: '28'
    text: >-
      Met het experiment educatieve module wordt beoogd te onderzoeken of door educatieve modules nieuwe doelgroepen
      kiezen voor het leraarschap in het voortgezet onderwijs en meer gediplomeerden in het wetenschappelijk onderwijs
      worden opgeleid tot leraar in het voortgezet onderwijs.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel28
  - number: '29'
    text: |-
      In verband met het experiment educatieve module wordt afgeweken van
      [artikel 7.12, eerste lid, aanhef en onderdeel a, van de Wet voortgezet onderwijs 2020][ref1] en de
      [artikelen 7.11][ref2], [7.32, derde lid][ref3], en [7.45a van de wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel7.12
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7.11
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7.32
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel7.45a
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '7.12'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7.11'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7.32'
      - id: ref4
