  - number: '26'
    text: |-
      In dit hoofdstuk wordt verstaan onder een deelnemende instelling: een instelling voor hoger onderwijs die op grond
      van [artikel 26b][ref1] gedurende één of beide fasen deelneemt aan het experiment educatieve module.


      [ref1]: https://wetten.overheid.nl/BWBR0037837#Artikel26b
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0037837
        artikel: 26b
        hoofdstuk: '4'
  - number: 26a
    text: >-
      Het experiment educatieve module duurt van 1 juli 2016 tot en met 30 juni 2022. Dit experiment bestaat uit twee
      fasen. De eerste fase duurt van 1 juli 2016 tot en met 30 juni 2019 en de tweede fase duurt van 1 juli 2019 tot en
      met 30 juni 2022.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel26a
  - number: 26b
    text: |-
      1 Een instelling voor hoger onderwijs als genoemd in de bijlage behorend bij
      [artikel 2, tweede lid, van de Regeling verwantschapstabel educatieve minor][ref1], kan deelnemen aan één of beide
      fasen van het experiment educatieve module.

      2 Een instelling voor hoger onderwijs die het voornemen had deel te nemen aan het experiment educatieve module
      en dit voor 1 september 2016 aan Onze Minister heeft gemeld neemt deel aan de eerste en tweede fase van dit
      experiment.

      3 Een instelling voor hoger onderwijs die heeft deelgenomen aan de eerste fase van het experiment educatieve
      module, maar niet wenst deel te nemen aan de tweede fase van dit experiment meldt dat voor 1 januari 2020 aan Onze
      Minister.

      4 Een instelling voor hoger onderwijs, als bedoeld in het eerste lid, die niet heeft deelgenomen aan de eerste fase
      van het experiment educatieve module en die het voornemen heeft deel te nemen aan de tweede fase van dit experiment
      meldt dat voor 1 januari 2020 aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0028148#Artikel2
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel26b
    references:
      - id: ref1
        bwb_id: BWBR0028148
        artikel: '2'
  - number: '27'
    text: |-
      1 Een deelnemende instelling kan, anders dan in het kader van een bacheloropleiding, een of meer
      modules wetenschappelijk onderwijs met een studielast van tenminste 30 studiepunten aanbieden op
      de opleidingsterreinen waarvoor deze instelling educatieve minoren kan verzorgen op grond van de
      [Regeling verwantschapstabel educatieve minor][ref1].

      2 Een student die beschikt over een getuigschrift als bedoeld in [artikel 7.11 van de wet][ref2] betreffende een
      bacheloropleiding in het wetenschappelijk onderwijs of een masteropleiding in het wetenschappelijk onderwijs, kan
      zich bij een deelnemende instelling inschrijven voor een module als bedoeld in het eerste lid.

      3 Voor inschrijving voor een module als bedoeld in het eerste lid is de aspirant-student de helft van het wettelijk
      collegegeld, bedoeld in [artikel 7.45a van de wet][ref3], verschuldigd.

      4 De examencommissie van de deelnemende instelling verstrekt aan een student een certificaat educatieve module,
      indien de student de module, bedoeld in het eerste lid, met goed gevolg heeft afgerond.

      5 Een student die beschikt over een getuigschrift als bedoeld in [artikel 7.11 van de wet][ref4] betreffende een
      bacheloropleiding in het wetenschappelijk onderwijs of een masteropleiding in het wetenschappelijk onderwijs en
      tevens beschikt over een certificaat educatieve module, is met inachtneming van de verwantschapsvoorschriften,
      bedoeld in [artikel 2, tweede lid, van de Regeling verwantschapstabel educatieve minor][ref5], bevoegd tot het
      geven van middelbaar algemeen voortgezet onderwijs, het geven van onderwijs in de eerste drie leerjaren van
      het hoger algemeen voortgezet onderwijs of van het voorbereidend wetenschappelijk onderwijs als bedoeld in de
      [Wet voortgezet onderwijs 2020][ref6] in een met zijn opleiding inhoudelijk overeenkomend vak in die leerjaren.


      [ref1]: https://wetten.overheid.nl/BWBR0028148
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7.11
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7.45a
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel7.11
      [ref5]: https://wetten.overheid.nl/BWBR0028148#Artikel2
      [ref6]: https://wetten.overheid.nl/BWBR0044212
