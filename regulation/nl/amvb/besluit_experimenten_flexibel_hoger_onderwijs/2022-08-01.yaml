  - number: '2'
    text: >-
      Het bestuur van een instelling voor hoger onderwijs die deelneemt aan een experiment in de zin van dit besluit
      is verplicht


      a. tijdig zodanige informatie aan studenten en aanstaande studenten te verstrekken over de deelname aan en
      inrichting van het desbetreffende experiment dat het hen in staat stelt zich voorafgaand aan de inschrijving een
      goed oordeel te vormen over de gevolgen daarvan; en


      b. tijdig in de onderwijs- en examenregeling bekend te maken op welke opleidingen en op welke wijze dit besluit van
      toepassing is.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel2
  - number: '3'
    text: |-
      1 Onverminderd [artikel 5.21 van de wet][ref1], zorgt het bestuur van een instelling voor hoger onderwijs die
      deelneemt aan een experiment in de zin van dit besluit ervoor dat in geval van beëindiging van het desbetreffende
      experiment de onderwijscontinuïteit voor de betrokken studenten is gewaarborgd.

      2 Het bestuur van een bekostigde instelling voor hoger onderwijs die deelneemt aan het experiment leeruitkomsten
      of het experiment educatieve module stelt de medezeggenschapsraad in de gelegenheid te adviseren over de inrichting
      van het desbetreffende experiment.

      3 Indien het bestuur van een bekostigde instelling voor hoger onderwijs die deelneemt aan het experiment
      leeruitkomsten op grond van [artikel 10.16a, eerste lid, van de wet][ref2] heeft besloten dat de
      [Wet op de ondernemingsraden][ref3] met uitzondering van [hoofdstuk VIIB][ref4] van toepassing is, stelt het
      bestuur de gezamenlijke vergadering van de ondernemingsraad in de gelegenheid te adviseren over de inrichting van
      het experiment.

      4 Het bestuur van een bekostigde instelling voor hoger onderwijs die deelneemt aan het experiment flexstuderen
      stelt de medezeggenschapsraad, of in geval van een universiteit, de universiteitsraad, in de gelegenheid te
      adviseren over de inrichting van het desbetreffende experiment.

      5 Indien het bestuur van een bekostigde instelling voor hoger onderwijs die deelneemt aan het experiment
      flexstuderen, op grond van de [artikelen 9.30, eerste lid][ref5], of [10.16a, eerste lid, van de wet][ref6] heeft
      besloten dat de [Wet op de ondernemingsraden][ref7] met uitzondering van [hoofdstuk VIIB][ref8] van toepassing is,
      stelt het bestuur het orgaan dat is ingesteld op grond van de medezeggenschapsregeling, bedoeld in de artikelen
      9.30, derde lid, tweede volzin, of 10.16a, derde lid, tweede volzin, in de gelegenheid te adviseren over de
      inrichting van het experiment.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5.21
