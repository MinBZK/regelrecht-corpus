        artikel: '11'
        hoofdstuk: '2'
  - number: '14'
    text: |-
      1 Het bestuur van een deelnemende instelling stelt voor een aan het experiment leeruitkomsten deelnemende
      opleiding, de leeruitkomsten en de daaraan verbonden studiepunten vast.

      2 Het bestuur van een deelnemende instelling stelt vast hoe de studiepunten, bedoeld in het eerste lid, zijn
      opgebouwd en op welke wijze zij met elkaar samenhangen.

      3 De studielast van een eenheid van leeruitkomsten bedraagt niet meer dan 30 studiepunten.

      4 Het bestuur van een deelnemende instelling maakt de vastgestelde leeruitkomsten, de daaraan verbonden
      studiepunten, alsmede de opbouw en samenhang daarvan tijdig bekend in de onderwijs- en examenregeling.

      5 Het bestuur van een deelnemende instelling maakt in de onderwijs- en examenregeling voorts tijdig bekend:

      a. hoe het behalen door studenten van leeruitkomsten door de examencommissie wordt beoordeeld;

      b. wanneer het examen, bedoeld in [artikel 7.10, tweede lid, van de wet][ref1], is afgelegd; en

      c. wanneer het afsluitend examen, bedoeld in [artikel 7.10a][ref2], onderscheidenlijk het examen bedoeld in
      [artikel 7.10b van de wet][ref3], met goed gevolg is afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7.10
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7.10a
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7.10b
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel14
    references:
      - id: ref1
