  - number: '4'
    text: |-
      1 Onze Minister evalueert uiterlijk in 2023 het experiment leeruitkomsten, het experiment accreditatie onvolledige
      opleidingen en het experiment educatieve module. Onze Minister evalueert uiterlijk in 2022 het experiment
      flexstuderen.

      2 Bij de evaluatie wordt in ieder geval onderzocht of de wijze waarop de experimenten op grond van dit besluit zijn
      vormgegeven, doelmatig is, mede in relatie tot de administratieve lasten.

      3 Onze Minister kan zich in het kader van de evaluatie laten bijstaan door een van Onze Minister onafhankelijke
      deskundige.

      4 Onze Minister stelt de inspectie en het accreditatieorgaan in de gelegenheid hun zienswijze naar voren te brengen
      naar aanleiding van een ontwerp van een verslag als bedoeld in [artikel 1.7a, vijfde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1.7a
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 1.7a
  - number: '5'
    text: >-
      1 Onze Minister kan een experiment in de zin van dit besluit bij een instelling voor hoger onderwijs geheel of
      gedeeltelijk beëindigen, indien:


      a. de desbetreffende instelling voor hoger onderwijs de voorschriften van dit besluit niet naar behoren naleeft; of


      b. door het experiment afbreuk wordt gedaan aan de kwaliteit of toegankelijkheid van het hoger onderwijs.


      2 Een experiment eindigt van rechtswege voortijdig indien dit experiment tot wet is verheven en in werking treedt.
      Onze Minister deelt de voortijdige beëindiging van een experiment mee aan de aan dit experiment deelnemende
      instellingen.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel5
  - number: '6'
    text: >-
      In dit hoofdstuk wordt verstaan onder deelnemende instelling: instelling voor hoger onderwijs die deelneemt aan het
      experiment leeruitkomsten.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel6
  - number: '7'
    text: |-
      1 Instellingen voor hoger onderwijs kunnen deeltijdse en duale associate degree-opleidingen, deeltijdse en duale
      bacheloropleidingen of deeltijdse en duale masteropleidingen, aanbieden waarbij geen sprake hoeft te zijn van
      een samenhangend geheel van onderwijseenheden als bedoeld in [artikel 7.3 van de wet][ref1], maar waarbij sprake
      kan zijn van een samenhangend geheel van eenheden van leeruitkomsten, op basis waarvan opleidingstrajecten kunnen
      worden ingericht en afgestemd op de uitgangspositie, werksituatie, kenmerken en behoeften van individuele studenten
      of groepen studenten.

      2 Het experiment leeruitkomsten, bedoeld in het eerste lid, duurt van 1 juli 2016 tot en met 30 juni 2022.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7.3
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7.3'
  - number: '8'
    text: |-
      Met het experiment leeruitkomsten wordt beoogd te onderzoeken of het verzorgen van hoger onderwijs als bedoeld in
      [artikel 7][ref1] leidt tot:

      a. een grotere deelname van studenten aan deeltijdse en duale opleidingen; en

      b. het verlenen van meer graden als bedoeld in de [artikelen 7.10a van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037837#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7.10a
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel8
