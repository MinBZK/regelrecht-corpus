        artikel: '7.10'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: 7.10a
      - id: ref3
        bwb_id: BWBR0005682
        artikel: 7.10b
  - number: '15'
    text: |-
      De examencommissie stelt vast:

      a. hoe het behalen door studenten van leeruitkomsten door de examencommissie wordt beoordeeld;

      b. wanneer het examen, bedoeld in [artikel 7.10, tweede lid, van de wet][ref1] is afgelegd; en

      c. wanneer het afsluitend examen, bedoeld in [artikel 7.10a][ref2], onderscheidenlijk het examen, bedoeld in
      [artikel 7.10b van de wet][ref3], met goed gevolg is afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7.10
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7.10a
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7.10b
