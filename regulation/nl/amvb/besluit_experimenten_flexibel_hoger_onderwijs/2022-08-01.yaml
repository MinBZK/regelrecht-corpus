  - number: '18'
    text: >-
      In dit hoofdstuk wordt verstaan onder een deelnemende rechtspersoon voor hoger onderwijs: een rechtspersoon voor
      hoger onderwijs die deelneemt aan het experiment accreditatie onvolledige opleidingen.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel18
  - number: '19'
    text: >-
      1 Het accreditatieorgaan kan accreditatie of toets nieuwe opleiding verlenen voor deeltijdse of duale
      bacheloropleidingen in het hoger beroepsonderwijs verzorgd door rechtspersonen voor hoger onderwijs:


      a. die deelnemen aan het experiment leeruitkomsten;


      b. waarbij het onderwijsaanbod beperkt is tot de afsluitende fase van de opleiding; en


      c. waarbij de studielast van het aangeboden onderwijs minder bedraagt dan 240 studiepunten.


      2 Het experiment accreditatie onvolledige opleidingen duurt van 1 juli 2016 tot en met 30 juni 2022.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel19
  - number: '20'
    text: |-
      Met het experiment accreditatie onvolledige opleidingen wordt beoogd te onderzoeken of het verlenen van
      accreditatie of een toets nieuwe opleiding als bedoeld in [artikel 19][ref1] leidt tot een groter aanbod
      niet bekostigde deeltijdse en duale bacheloropleidingen, een hogere deelname aan die opleidingen in het
      hoger beroepsonderwijs en tot het verlenen van meer graden als bedoeld in de [artikelen 7.10a][ref2] en
      [7.10b van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037837#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7.10a
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7.10b
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0037837
        artikel: '19'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: 7.10a
      - id: ref3
        bwb_id: BWBR0005682
        artikel: 7.10b
  - number: '21'
    text: |-
      In verband met het experiment accreditatie onvolledige opleidingen wordt afgeweken van de
      [artikelen 7.4b, eerste lid][ref1], en [7.8, tweede lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7.4b
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7.8
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 7.4b
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7.8'
  - number: '22'
    text: |-
      1 Onze Minister evalueert het experiment accreditatie onvolledige opleidingen op basis van de volgende criteria:

      a. de mate waarin het verlenen van accreditatie of toets nieuwe opleiding als bedoeld in [artikel 19][ref1]
      tot een groter privaat aanbod en een hogere deelname aan deeltijdse en duale bacheloropleidingen in het
      hoger beroepsonderwijs en tot het verlenen van meer graden als bedoeld in de [artikelen 7.10a][ref2] en
      [7.10b van de wet][ref3] leidt; en

      b. de mate van effectiviteit van de kaders voor accreditatie of toets nieuwe opleiding die ten behoeve van het
      experiment accreditatie onvolledige opleidingen zijn gehanteerd.

      2 Bij de evaluatie wordt in ieder geval onderzoek gedaan naar de kwaliteit van de toelating van aspirant-studenten,
      van het verzorgde onderwijsaanbod en van het gerealiseerde eindniveau.


      [ref1]: https://wetten.overheid.nl/BWBR0037837#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7.10a
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7.10b
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0037837
        artikel: '19'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: 7.10a
      - id: ref3
        bwb_id: BWBR0005682
        artikel: 7.10b
  - number: '23'
    text: |-
      1 Rechtspersonen voor hoger onderwijs die deeltijdse of duale bacheloropleidingen in het hoger beroepsonderwijs
      verzorgen, waarbij het onderwijsaanbod beperkt is tot de afsluitende fase van de opleiding en waarbij de
      studielast van het aangeboden onderwijs minder bedraagt dan 240 studiepunten, kunnen deelnemen aan het experiment
      accreditatie onvolledige opleidingen door het indienen van een aanvraag als bedoeld in de [artikelen 5.6][ref1] en
      [5.11 van de wet][ref2] bij het accreditatieorgaan.

      2 Een aanvraag wordt voor 1 januari 2018 worden ingediend.

      3 In de aanvraag geeft de aanvrager aan hoe het voor de desbetreffend onvolledige opleiding benodigde
      toelatingsniveau van aspirant-studenten wordt gewaarborgd.

      4 Het accreditatieorgaan neemt de aanvraag niet in behandeling, indien de aanvrager niet deelneemt aan het
      experiment leeruitkomsten.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5.6
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5.11
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel23
