  - number: '2'
    text: |-
      Het bestuur van een instelling voor hoger onderwijs die deelneemt aan een experiment in de zin van dit besluit
      is verplicht
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel2
  - number: 2.a
    text: |-
      tijdig zodanige informatie aan studenten en aanstaande studenten te verstrekken over de deelname aan en inrichting
      van het desbetreffende experiment dat het hen in staat stelt zich voorafgaand aan de inschrijving een goed oordeel
      te vormen over de gevolgen daarvan; en
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel2
  - number: 2.b
    text: |-
      tijdig in de onderwijs- en examenregeling bekend te maken op welke opleidingen en op welke wijze dit besluit van
      toepassing is.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel2
  - number: '3.1'
    text: |-
      Onverminderd [artikel 5.21 van de wet][ref1], zorgt het bestuur van een instelling voor hoger onderwijs die
      deelneemt aan een experiment in de zin van dit besluit ervoor dat in geval van beëindiging van het desbetreffende
      experiment de onderwijscontinuïteit voor de betrokken studenten is gewaarborgd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
  - number: '3.2'
    text: |-
      Het bestuur van een bekostigde instelling voor hoger onderwijs die deelneemt aan het experiment leeruitkomsten of
      het experiment educatieve module stelt de medezeggenschapsraad in de gelegenheid te adviseren over de inrichting
      van het desbetreffende experiment.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel3
  - number: '3.3'
    text: |-
      Indien het bestuur van een bekostigde instelling voor hoger onderwijs die deelneemt aan het experiment
      leeruitkomsten op grond van [artikel 10.16a, eerste lid, van de wet][ref1] heeft besloten dat de
      [Wet op de ondernemingsraden][ref2] met uitzondering van [hoofdstuk VIIB][ref3] van toepassing is, stelt het
      bestuur de gezamenlijke vergadering van de ondernemingsraad in de gelegenheid te adviseren over de inrichting van
      het experiment.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002747
      [ref3]: https://wetten.overheid.nl/BWBR0002747#HoofdstukVII_B
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002747
      - id: ref3
        bwb_id: BWBR0002747
        hoofdstuk: VII_B
  - number: '3.4'
    text: |-
      Het bestuur van een bekostigde instelling voor hoger onderwijs die deelneemt aan het experiment flexstuderen stelt
      de medezeggenschapsraad, of in geval van een universiteit, de universiteitsraad, in de gelegenheid te adviseren
      over de inrichting van het desbetreffende experiment.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel3
  - number: '3.5'
    text: |-
      Indien het bestuur van een bekostigde instelling voor hoger onderwijs die deelneemt aan het experiment
      flexstuderen, op grond van de [artikelen 9.30, eerste lid][ref1], of [10.16a, eerste lid, van de wet][ref2] heeft
      besloten dat de [Wet op de ondernemingsraden][ref3] met uitzondering van [hoofdstuk VIIB][ref4] van toepassing is,
      stelt het bestuur het orgaan dat is ingesteld op grond van de medezeggenschapsregeling, bedoeld in de artikelen
      9.30, derde lid, tweede volzin, of 10.16a, derde lid, tweede volzin, in de gelegenheid te adviseren over de
      inrichting van het experiment.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0002747
      [ref4]: https://wetten.overheid.nl/BWBR0002747#HoofdstukVII_B
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0002747
      - id: ref4
        bwb_id: BWBR0002747
        hoofdstuk: VII_B
  - number: '4.1'
    text: |-
      Onze Minister evalueert uiterlijk in 2023 het experiment leeruitkomsten, het experiment accreditatie onvolledige
      opleidingen en het experiment educatieve module. Onze Minister evalueert uiterlijk in 2022 het experiment
      flexstuderen.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel4
  - number: '4.2'
    text: |-
      Bij de evaluatie wordt in ieder geval onderzocht of de wijze waarop de experimenten op grond van dit besluit zijn
      vormgegeven, doelmatig is, mede in relatie tot de administratieve lasten.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel4
  - number: '4.3'
    text: |-
      Onze Minister kan zich in het kader van de evaluatie laten bijstaan door een van Onze Minister onafhankelijke
      deskundige.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel4
  - number: '4.4'
    text: |-
      Onze Minister stelt de inspectie en het accreditatieorgaan in de gelegenheid hun zienswijze naar voren te brengen
      naar aanleiding van een ontwerp van een verslag als bedoeld in [artikel 1.7a, vijfde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
  - number: '5.1'
    text: |-
      Onze Minister kan een experiment in de zin van dit besluit bij een instelling voor hoger onderwijs geheel of
      gedeeltelijk beëindigen, indien:
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel5
  - number: 5.1.a
    text: de desbetreffende instelling voor hoger onderwijs de voorschriften van dit besluit niet naar behoren naleeft; of
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel5
  - number: 5.1.b
    text: door het experiment afbreuk wordt gedaan aan de kwaliteit of toegankelijkheid van het hoger onderwijs.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel5
  - number: '5.2'
    text: |-
      Een experiment eindigt van rechtswege voortijdig indien dit experiment tot wet is verheven en in werking treedt.
      Onze Minister deelt de voortijdige beëindiging van een experiment mee aan de aan dit experiment deelnemende
      instellingen.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel5
  - number: '6'
    text: |-
      In dit hoofdstuk wordt verstaan onder deelnemende instelling: instelling voor hoger onderwijs die deelneemt aan het
      experiment leeruitkomsten.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel6
  - number: '7.1'
    text: |-
      Instellingen voor hoger onderwijs kunnen deeltijdse en duale associate degree-opleidingen, deeltijdse en duale
      bacheloropleidingen of deeltijdse en duale masteropleidingen, aanbieden waarbij geen sprake hoeft te zijn van
      een samenhangend geheel van onderwijseenheden als bedoeld in [artikel 7.3 van de wet][ref1], maar waarbij sprake
      kan zijn van een samenhangend geheel van eenheden van leeruitkomsten, op basis waarvan opleidingstrajecten kunnen
      worden ingericht en afgestemd op de uitgangspositie, werksituatie, kenmerken en behoeften van individuele studenten
      of groepen studenten.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: '7.2'
    text: Het experiment leeruitkomsten, bedoeld in het eerste lid, duurt van 1 juli 2016 tot en met 30 juni 2022.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel7
  - number: '8'
    text: |-
      Met het experiment leeruitkomsten wordt beoogd te onderzoeken of het verzorgen van hoger onderwijs als bedoeld in
      [artikel 7][ref1] leidt tot:


      [ref1]: https://wetten.overheid.nl/BWBR0037837#Artikel7
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0037837
        artikel: '7'
        hoofdstuk: '2'
  - number: 8.a
    text: een grotere deelname van studenten aan deeltijdse en duale opleidingen; en
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel8
  - number: 8.b
    text: |-
      het verlenen van meer graden als bedoeld in de [artikelen 7.10a van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: '9'
    text: |-
      In verband met het experiment leeruitkomsten wordt afgeweken van de [artikelen 7.3, tweede lid][ref1], en
      [7.4 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
  - number: '10'
    text: 'Onze Minister evalueert het experiment leeruitkomsten op basis van de volgende criteria:'
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel10
  - number: 10.a
    text: |-
      de mate waarin het verzorgen van hoger onderwijs als bedoeld in [artikel 7][ref1] tot een grotere deelname
      door studenten aan deeltijdse en duale associate degree-opleidingen, deeltijdse en duale bacheloropleidingen of
      deeltijdse en duale masteropleidingen en tot het verlenen van meer graden als bedoeld in de [artikelen 7.10a][ref2]
      en [7.10b van de wet][ref3] leidt;


      [ref1]: https://wetten.overheid.nl/BWBR0037837#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0037837
        artikel: '7'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 10.b
    text: |-
      de mate waarin flexibiliteit van de inrichting en uitvoering van het hoger onderwijs, bedoeld in [artikel 7][ref1],
      leidt tot meer tevredenheid bij studenten en werkgevers; en


      [ref1]: https://wetten.overheid.nl/BWBR0037837#Artikel7
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0037837
        artikel: '7'
        hoofdstuk: '2'
  - number: 10.c
    text: |-
      de mate waarin de tijdens het experiment gehanteerde kaders ter borging van de onderwijskwaliteit effectief blijken
      te zijn.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel10
  - number: '11'
    text: |-
      Deelname aan het experiment leeruitkomsten staat open voor instellingen voor hoger onderwijs die een aanvraag
      hebben ingediend op grond van de [Subsidieregeling flexibel hoger onderwijs voor volwassenen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037055
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0037055
  - number: '12.1'
    text: Voor deelname aan het experiment leeruitkomsten is toestemming van Onze Minister vereist.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel12
  - number: '12.2'
    text: |-
      Een instelling voor hoger onderwijs als bedoeld in [artikel 11][ref1] die toestemming wenst te verkrijgen voor
      deelname aan het experiment leeruitkomsten, dient daartoe voor 1 mei 2016, voor 1 november 2016 of voor 1 mei 2017
      bij Onze Minister een aanvraag in.


      [ref1]: https://wetten.overheid.nl/BWBR0037837#Artikel11
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0037837
        artikel: '11'
        hoofdstuk: '2'
  - number: '12.3'
    text: |-
      Het bestuur van een deelnemende instelling bepaalt welke opleidingen deelnemen aan het experiment. De deelnemende
      opleidingen hanteren een onderwijsconcept waarvoor Onze Minister toestemming heeft verleend.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel12
  - number: '14.1'
    text: |-
      Het bestuur van een deelnemende instelling stelt voor een aan het experiment leeruitkomsten deelnemende opleiding,
      de leeruitkomsten en de daaraan verbonden studiepunten vast.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel14
  - number: '14.2'
    text: |-
      Het bestuur van een deelnemende instelling stelt vast hoe de studiepunten, bedoeld in het eerste lid, zijn
      opgebouwd en op welke wijze zij met elkaar samenhangen.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel14
  - number: '14.3'
    text: De studielast van een eenheid van leeruitkomsten bedraagt niet meer dan 30 studiepunten.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel14
  - number: '14.4'
    text: |-
      Het bestuur van een deelnemende instelling maakt de vastgestelde leeruitkomsten, de daaraan verbonden studiepunten,
      alsmede de opbouw en samenhang daarvan tijdig bekend in de onderwijs- en examenregeling.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel14
  - number: '14.5'
    text: 'Het bestuur van een deelnemende instelling maakt in de onderwijs- en examenregeling voorts tijdig bekend:'
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel14
  - number: 14.5.a
    text: hoe het behalen door studenten van leeruitkomsten door de examencommissie wordt beoordeeld;
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel14
  - number: 14.5.b
    text: |-
      wanneer het examen, bedoeld in [artikel 7.10, tweede lid, van de wet][ref1], is afgelegd; en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 14.5.c
    text: |-
      wanneer het afsluitend examen, bedoeld in [artikel 7.10a][ref1], onderscheidenlijk het examen bedoeld in
      [artikel 7.10b van de wet][ref2], met goed gevolg is afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
  - number: '15'
    text: 'De examencommissie stelt vast:'
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel15
  - number: 15.a
    text: hoe het behalen door studenten van leeruitkomsten door de examencommissie wordt beoordeeld;
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel15
  - number: 15.b
    text: |-
      wanneer het examen, bedoeld in [artikel 7.10, tweede lid, van de wet][ref1] is afgelegd; en


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 15.c
    text: |-
      wanneer het afsluitend examen, bedoeld in [artikel 7.10a][ref1], onderscheidenlijk het examen, bedoeld in
      [artikel 7.10b van de wet][ref2], met goed gevolg is afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
  - number: '16.1'
    text: |-
      Het bestuur van een deelnemende instelling sluit met een student die zich wenst in te schrijven voor hoger
      onderwijs als bedoeld in [artikel 7][ref1], een onderwijsovereenkomst, waarin in ieder geval de duur van de
      overeenkomst en het onderwijsprogramma voor de betrokken student worden vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0037837#Artikel7
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0037837
        artikel: '7'
        hoofdstuk: '2'
  - number: '16.2'
    text: |-
      Het bestuur van een deelnemende instelling maakt in de onderwijs- en examenregeling bekend op welke wijze de
      onderwijsovereenkomst, bedoeld in het eerste lid, wordt gesloten en welke wederzijdse rechten en verplichtingen
      daarin in ieder geval worden vastgelegd.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel16
  - number: '17.1'
    text: |-
      Van 2017 tot en met 2020 rapporteert het bestuur van een deelnemende instelling jaarlijks over de uitvoering van
      het experiment leeruitkomsten in het voorafgaande kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17
  - number: '17.2'
    text: |-
      Voor 1 mei 2021 rapporteert het bestuur van een deelnemende instelling over de uitvoering van het experiment
      leeruitkomsten in het tijdvak 2016 tot en met 2020.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17
  - number: '17.3'
    text: |-
      Het bestuur van een bekostigde instelling voor hoger onderwijs neemt de rapportages, bedoeld in het eerste
      en tweede lid, op in het verslag, bedoeld in [artikel 2.9 van de wet][ref1]. Het bestuur van een andere
      deelnemende instelling neemt de rapportages, bedoeld in het eerste en tweede lid, op in het verslag, bedoeld in
      [artikel 1.12, derde lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '1'
  - number: '17.4'
    text: |-
      Het bestuur van een deelnemende instelling verstrekt desgevraagd nadere informatie aan Onze Minister in verband met
      de deelname aan en monitoring, evaluatie en effectmeting van het experiment leeruitkomsten.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17
  - number: '17.5'
    text: |-
      Onze Minister kan een deelnemende instelling in verband met het experiment leeruitkomsten andere, op de individuele
      instelling of op een categorie instellingen voor hoger onderwijs afgestemde, verplichtingen opleggen.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17
  - number: 17a
    text: |-
      In dit hoofdstuk wordt verstaan onder deelnemende instelling: een universiteit als bedoeld in de [onderdelen a en
      b van de bijlage behorende bij de wet](onbekend), of een hogeschool als bedoeld in onderdeel g van die bijlage, die
      deelneemt aan het experiment flexstuderen.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17a
  - number: 17b.1
    text: |-
      Een deelnemende instelling kan een student die is ingeschreven voor een opleiding de mogelijkheid bieden die
      opleiding, of een deel daarvan, flexibel te volgen, waarbij
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17b
  - number: 17b.1.a
    text: |-
      de hoogte van het collegegeld wordt bepaald door de omvang van het onderwijs dat de student van plan is te volgen,
      en
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17b
  - number: 17b.1.b
    text: de student uitsluitend het onderwijs volgt waarvoor hij collegegeld betaalt.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17b
  - number: 17b.2
    text: |-
      Aan het experiment flexstuderen kunnen uitsluitend studenten deelnemen die het wettelijk collegegeld verschuldigd
      zijn als bedoeld in [artikel 7.45a van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 17b.3
    text: |-
      Het collegegeldtarief voor het volgen van onderwijs, bedoeld in het eerste lid, bedraagt voor onderwijs met een
      studielast van één studiepunt, het bedrag van het wettelijk collegegeld, geldend voor het desbetreffende studiejaar
      van de desbetreffende opleiding, gedeeld door de studielast van die opleiding voor dat studiejaar en vermeerderd
      met maximaal 15 procent van dat breukdeel.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17b
  - number: 17c.1
    text: |-
      Een deelnemende instelling laat in een studiejaar niet meer studenten toe tot het experiment flexstuderen dan 10
      procent van het totaal aantal studenten dat in het daaraan voorafgaande studiejaar per 1 oktober was ingeschreven
      bij alle opleidingen van die instelling.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17c
  - number: 17c.2
    text: Per studiejaar laat een deelnemende instelling maximaal 1.000 nieuwe studenten toe tot het experiment flexstuderen.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17c
  - number: 17d
    text: |-
      Het experiment flexstuderen duurt van 1 september 2017 tot 1 september 2023, tenzij Onze Minister een besluit neemt
      als bedoeld in [artikel 17h, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037837#Artikel17h
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17d
    references:
      - id: ref1
        bwb_id: BWBR0037837
        artikel: 17h
        hoofdstuk: 2a
  - number: 17e
    text: |-
      Met het experiment flexstuderen wordt beoogd te onderzoeken of het aanbieden van hoger onderwijs als bedoeld in
      [artikel 17b][ref1] leidt tot een toegankelijker aanbod van hoger onderwijs, dat beter aansluit bij de behoeften
      van studenten en daardoor leidt tot meer tevredenheid van en ontplooiingsmogelijkheden voor studenten en tot minder
      uitval.


      [ref1]: https://wetten.overheid.nl/BWBR0037837#Artikel17b
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17e
    references:
      - id: ref1
        bwb_id: BWBR0037837
        artikel: 17b
        hoofdstuk: 2a
  - number: 17f.1
    text: |-
      In verband met het experiment flexstuderen wordt afgeweken van de
      [artikelen 7.34, eerste lid, onderdelen a en b][ref1], [7.43][ref2] en [7.48 van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17f
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 17f.2
    text: |-
      Het bestuur van een deelnemende instelling kan in verband met het experiment flexstuderen ten aanzien van een
      deelnemende student afwijken van de [artikelen 7.47][ref1] en [7.51 tot en met 7.51i van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17f
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 17g
    text: |-
      Onze Minister evalueert het experiment flexstuderen op basis van de volgende criteria: de mate waarin het aanbieden
      van hoger onderwijs als bedoeld in [artikel 17b][ref1] positief bijdraagt aan


      [ref1]: https://wetten.overheid.nl/BWBR0037837#Artikel17b
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17g
    references:
      - id: ref1
        bwb_id: BWBR0037837
        artikel: 17b
        hoofdstuk: 2a
  - number: 17g.a
    text: een toegankelijker aanbod van hoger onderwijs, dat
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17g
  - number: 17g.b
    text: beter aansluit bij de behoeften van studenten en daardoor leidt tot
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17g
  - number: 17g.c
    text: meer tevredenheid van studenten,
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17g
  - number: 17g.d
    text: meer ontplooiingsmogelijkheden voor studenten en
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17g
  - number: 17g.e
    text: tot minder uitval.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17g
  - number: 17h.1
    text: |-
      Onze Minister doet in het studiejaar 2018–2019 tussentijds een onderzoek naar het experiment flexstuderen. Daarbij
      wordt in het bijzonder onderzocht:
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17h
  - number: 17h.1.a
    text: |-
      of de belangstelling voor deelname aan het experiment flexstuderen bij studenten toereikend is met het oog op een
      betekenisvolle evaluatie; en
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17h
  - number: 17h.1.b
    text: |-
      of voortzetting van het experiment flexstuderen verantwoord is uit een oogpunt van financiële beheersbaarheid en
      organisatorische uitvoerbaarheid.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17h
  - number: 17h.2
    text: |-
      Indien de uitkomsten van de tussentijdse beoordeling, bedoeld in het eerste lid, negatief zijn, kan Onze Minister,
      na overleg met de deelnemende instellingen, het experiment met ingang van het studiejaar 2019–2020 beëindigen.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17h
  - number: 17i
    text: |-
      Aan het experiment flexstuderen kan uitsluitend worden deelgenomen door universiteiten als bedoeld in de
      [onderdelen a en b van de bijlage behorende bij de wet](onbekend), en door hogescholen als bedoeld in onderdeel g
      van die bijlage.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17i
  - number: 17j.1
    text: Voor deelname aan het experiment flexstuderen is toestemming van Onze Minister vereist.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17j
  - number: 17j.2
    text: |-
      Een universiteit of een hogeschool die toestemming wenst te verkrijgen voor deelname aan het experiment
      flexstuderen, dient daartoe ofwel voor 1 maart 2017 ofwel in de periode van 1 januari 2019 tot 1 maart 2019 bij
      Onze Minister elektronisch een aanvraag in via het e-mailadres experimentflexstuderen@minocw.nl.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17j
  - number: 17j.3
    text: In de aanvraag maakt de aanvrager inzichtelijk hoe het experiment bij de instelling zal worden vormgegeven.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17j
  - number: 17j.4
    text: |-
      Een universiteit of een hogeschool als bedoeld in het tweede lid die reeds van Onze Minister toestemming heeft
      verkregen voor deelname aan het experiment flexstuderen, neemt deel aan het experiment.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17j
  - number: 17j.5
    text: |-
      Een universiteit of hogeschool als bedoeld in [artikel 17i][ref1] die op 31 december 2020 nog niet deelnam aan
      het experiment flexstuderen, verkrijgt van rechtswege toestemming van Onze Minister om deel te nemen aan dit
      experiment, indien de universiteit of hogeschool:


      [ref1]: https://wetten.overheid.nl/BWBR0037837#Artikel17i
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17j
    references:
      - id: ref1
        bwb_id: BWBR0037837
        artikel: 17i
        hoofdstuk: 2a
  - number: 17j.5.a
    text: |-
      instemming heeft verkregen van het medezeggenschapsorgaan, bedoeld in [artikel 3, vierde en vijfde lid][ref1], op
      het voornemen om deel te nemen aan het experiment flexstuderen;


      [ref1]: https://wetten.overheid.nl/BWBR0037837#Artikel3
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17j
    references:
      - id: ref1
        bwb_id: BWBR0037837
        artikel: '3'
        hoofdstuk: '1'
  - number: 17j.5.b
    text: |-
      het voornemen om deel te nemen aan het experiment flexstuderen voor 1 september 2021 heeft gemeld aan Onze
      Minister; en
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17j
  - number: 17j.5.c
    text: |-
      in de melding inzichtelijk heeft gemaakt hoe het experiment flexstuderen bij deze universiteit of hogeschool zal
      worden vormgegeven.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17j
  - number: 17m.1
    text: |-
      Deelname aan het experiment flexstuderen geeft de student uitsluitend het recht: deel te nemen aan het onderwijs
      waarvoor hij overeenkomstig [artikel 17b][ref1] betaalt, tentamens af te leggen van de onderwijseenheden waarvoor
      hij overeenkomstig artikel 17b betaalt en in voorkomend geval examens af te leggen. [Artikel 7.48 van de wet][ref2]
      is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037837#Artikel17b
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17m
    references:
      - id: ref1
        bwb_id: BWBR0037837
        artikel: 17b
        hoofdstuk: 2a
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 17m.2
    text: |-
      De student die deelneemt aan het experiment flexstuderen, kan gedurende het studiejaar volgens door de instelling
      vastgestelde regels van procedurele aard alsnog kiezen voor het volgen van onderwijs tegen wettelijk collegegeld.
      In dat geval betaalt de student het resterende deel van het wettelijk collegegeld naar rato van de omvang van het
      resterende deel van het desbetreffende studiejaar. In een studiejaar betaalt de deelnemende student in totaal niet
      meer dan het bedrag van het wettelijk collegegeld, geldend voor het desbetreffende studiejaar vermeerderd met 15
      procent van dat bedrag.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17m
  - number: 17m.3
    text: |-
      Een student die deelneemt aan het experiment flexstuderen verstrekt desgevraagd nadere informatie aan de
      deelnemende instelling waar hij is ingeschreven in verband met de deelname aan het experiment flexstuderen door de
      instelling en de monitoring, evaluatie en effectmeting van het experiment flexstuderen door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17m
  - number: 17n.1
    text: |-
      Met inachtneming van dit besluit richt het bestuur van een deelnemende instelling het experiment flexstuderen naar
      eigen inzicht in.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17n
  - number: 17n.2
    text: |-
      Het bestuur van een deelnemende instelling kan in verband met de uitvoering van het experiment flexstuderen
      afwijken van de verplichting jegens een deelnemende student tot het bieden van financiële ondersteuning, bedoeld in
      de [artikelen 7.51 tot en met 7.51i van de wet][ref1], indien die ondersteuning in verband met de deelname van de
      student aan het experiment flexstuderen niet nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17n
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 17n.3
    text: |-
      Het bestuur van een deelnemende instelling kan in verband met de uitvoering van het experiment flexstuderen de
      wijze van betalen van het collegegeld, bedoeld in [artikel 17b, derde lid][ref1], regelen.


      [ref1]: https://wetten.overheid.nl/BWBR0037837#Artikel17b
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17n
    references:
      - id: ref1
        bwb_id: BWBR0037837
        artikel: 17b
        hoofdstuk: 2a
  - number: 17o.1
    text: |-
      Het bestuur van een deelnemende instelling voert het experiment flexstuderen overeenkomstig de aanvraag, bedoeld in
      [artikel 17j, tweede lid][ref1], of de melding, bedoeld in artikel 17j, vijfde lid, uit.


      [ref1]: https://wetten.overheid.nl/BWBR0037837#Artikel17j
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17o
    references:
      - id: ref1
        bwb_id: BWBR0037837
        artikel: 17j
        hoofdstuk: 2a
  - number: 17o.2
    text: |-
      Het bestuur van een deelnemende instelling neemt zodanige maatregelen dat studenten die deelnemen aan het
      experiment flexstuderen uitsluitend onderwijs kunnen volgen en uitsluitend tentamens en examens kunnen afleggen in
      de vakken van de opleiding waarvoor zij betalen.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17o
  - number: 17o.3
    text: |-
      Het bestuur van een deelnemende instelling maakt de inrichting van het experiment flexstuderen binnen de instelling
      tijdig bekend. De informatie, bedoeld in de eerste volzin, betreft in ieder geval de volgende onderwerpen:
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17o
  - number: 17o.3.a
    text: een vermelding van de opleidingen waarop het experiment flexstuderen betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17o
  - number: 17o.3.b
    text: de wijze van aanmelding door studenten voor het experiment flexstuderen;
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17o
  - number: 17o.3.c
    text: |-
      de maximaal tot het experiment flexstuderen toe te laten studenten en de in verband daarmee vastgestelde
      selectiecriteria en -procedure;
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17o
  - number: 17o.3.d
    text: een regeling voor het herkansen van tentamens en de geldigheidsduur van tentamenresultaten;
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17o
  - number: 17o.3.e
    text: |-
      het maximum aantal, al dan niet aaneengesloten, studiejaren, dat een student kan deelnemen aan het experiment
      flexstuderen;
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17o
  - number: 17o.3.f
    text: |-
      de wijze waarop het instellingsbestuur de overstap door studenten van deelname aan het experiment flexstuderen naar
      het volgen van regulier hoger onderwijs, bedoeld in [artikel 17m, tweede lid][ref1], en omgekeerd in procedurele en
      financiële zin heeft geregeld;


      [ref1]: https://wetten.overheid.nl/BWBR0037837#Artikel17m
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17o
    references:
      - id: ref1
        bwb_id: BWBR0037837
        artikel: 17m
        hoofdstuk: 2a
  - number: 17o.3.g
    text: |-
      de wijze waarop het bestuur gebruik maakt van de bevoegdheden, bedoeld in [artikel 17n, tweede en derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0037837#Artikel17n
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17o
    references:
      - id: ref1
        bwb_id: BWBR0037837
        artikel: 17n
        hoofdstuk: 2a
  - number: 17o.3.h
    text: het handhavingsbeleid van het bestuur in verband met de verplichting, bedoeld in het tweede lid; en
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17o
  - number: 17o.3.i
    text: |-
      de inhoud van de informatieverplichting voor studenten, bedoeld in [artikel 17m, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037837#Artikel17m
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17o
    references:
      - id: ref1
        bwb_id: BWBR0037837
        artikel: 17m
        hoofdstuk: 2a
  - number: 17o.4
    text: De aspecten, bedoeld in het derde lid, onderdelen a en d, worden vastgesteld in de onderwijs- en examenregeling.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17o
  - number: 17o.5
    text: |-
      Het bestuur van een deelnemende instelling rapporteert jaarlijks in het verslag, bedoeld in
      [artikel 2.9 van de wet][ref1], aan Onze Minister over de uitvoering van het experiment flexstuderen in het
      voorafgaande kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17o
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '2'
  - number: 17o.6
    text: |-
      Het bestuur van een deelnemende instelling verstrekt desgevraagd nadere informatie aan Onze Minister in verband met
      de deelname aan en monitoring, evaluatie en effectmeting van het experiment flexstuderen.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17o
  - number: 17o.7
    text: |-
      Onze Minister kan een deelnemende instelling in verband met het experiment flexstuderen andere, op de individuele
      instelling of op een categorie instellingen voor hoger onderwijs afgestemde verplichtingen opleggen.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17o
  - number: '18'
    text: |-
      In dit hoofdstuk wordt verstaan onder een deelnemende rechtspersoon voor hoger onderwijs: een rechtspersoon voor
      hoger onderwijs die deelneemt aan het experiment accreditatie onvolledige opleidingen.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel18
  - number: '19.1'
    text: |-
      Het accreditatieorgaan kan accreditatie of toets nieuwe opleiding verlenen voor deeltijdse of duale
      bacheloropleidingen in het hoger beroepsonderwijs verzorgd door rechtspersonen voor hoger onderwijs:
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel19
  - number: 19.1.a
    text: die deelnemen aan het experiment leeruitkomsten;
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel19
  - number: 19.1.b
    text: waarbij het onderwijsaanbod beperkt is tot de afsluitende fase van de opleiding; en
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel19
  - number: 19.1.c
    text: waarbij de studielast van het aangeboden onderwijs minder bedraagt dan 240 studiepunten.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel19
  - number: '19.2'
    text: Het experiment accreditatie onvolledige opleidingen duurt van 1 juli 2016 tot en met 30 juni 2022.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel19
  - number: '20'
    text: |-
      Met het experiment accreditatie onvolledige opleidingen wordt beoogd te onderzoeken of het verlenen van
      accreditatie of een toets nieuwe opleiding als bedoeld in [artikel 19][ref1] leidt tot een groter aanbod
      niet bekostigde deeltijdse en duale bacheloropleidingen, een hogere deelname aan die opleidingen in het
      hoger beroepsonderwijs en tot het verlenen van meer graden als bedoeld in de [artikelen 7.10a][ref2] en
      [7.10b van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037837#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0037837
        artikel: '19'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
  - number: '21'
    text: |-
      In verband met het experiment accreditatie onvolledige opleidingen wordt afgeweken van de
      [artikelen 7.4b, eerste lid][ref1], en [7.8, tweede lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
  - number: '22.1'
    text: 'Onze Minister evalueert het experiment accreditatie onvolledige opleidingen op basis van de volgende criteria:'
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel22
  - number: 22.1.a
    text: |-
      de mate waarin het verlenen van accreditatie of toets nieuwe opleiding als bedoeld in [artikel 19][ref1]
      tot een groter privaat aanbod en een hogere deelname aan deeltijdse en duale bacheloropleidingen in het
      hoger beroepsonderwijs en tot het verlenen van meer graden als bedoeld in de [artikelen 7.10a][ref2] en
      [7.10b van de wet][ref3] leidt; en


      [ref1]: https://wetten.overheid.nl/BWBR0037837#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0037837
        artikel: '19'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
  - number: 22.1.b
    text: |-
      de mate van effectiviteit van de kaders voor accreditatie of toets nieuwe opleiding die ten behoeve van het
      experiment accreditatie onvolledige opleidingen zijn gehanteerd.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel22
  - number: '22.2'
    text: |-
      Bij de evaluatie wordt in ieder geval onderzoek gedaan naar de kwaliteit van de toelating van aspirant-studenten,
      van het verzorgde onderwijsaanbod en van het gerealiseerde eindniveau.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel22
  - number: '23.1'
    text: |-
      Rechtspersonen voor hoger onderwijs die deeltijdse of duale bacheloropleidingen in het hoger beroepsonderwijs
      verzorgen, waarbij het onderwijsaanbod beperkt is tot de afsluitende fase van de opleiding en waarbij de
      studielast van het aangeboden onderwijs minder bedraagt dan 240 studiepunten, kunnen deelnemen aan het experiment
      accreditatie onvolledige opleidingen door het indienen van een aanvraag als bedoeld in de [artikelen 5.6][ref1] en
      [5.11 van de wet][ref2] bij het accreditatieorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel5
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '5'
  - number: '23.2'
    text: Een aanvraag wordt voor 1 januari 2018 worden ingediend.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel23
  - number: '23.3'
    text: |-
      In de aanvraag geeft de aanvrager aan hoe het voor de desbetreffend onvolledige opleiding benodigde
      toelatingsniveau van aspirant-studenten wordt gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel23
  - number: '23.4'
    text: |-
      Het accreditatieorgaan neemt de aanvraag niet in behandeling, indien de aanvrager niet deelneemt aan het experiment
      leeruitkomsten.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel23
  - number: '24.1'
    text: |-
      Het accreditatieorgaan legt voor 1 juli 2016 in het accreditatiekader, bedoeld in [artikel 5.2 van de wet][ref1],
      vast op welke wijze en volgens welke criteria accreditatie of toets nieuwe opleiding wordt verleend aan de
      deeltijdse en duale bacheloropleidingen in het hoger beroepsonderwijs, bedoeld in [artikel 19][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0037837#Artikel19
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0037837
        artikel: '19'
        hoofdstuk: '3'
  - number: '24.2'
    text: |-
      Het accreditatieorgaan besteedt bij het vastleggen van de werkwijze en de beoordelingscriteria, bedoeld in
      het eerste lid, in ieder geval aandacht aan de kwaliteit van de toetsing en beoordeling door de deelnemende
      rechtspersoon voor hoger onderwijs van het toelatingsniveau van aspirant-studenten op het niveau dat benodigd is
      voor deelname aan het onderwijs dat door de rechtspersoon voor hoger onderwijs wordt verzorgd in het kader van de
      desbetreffende opleiding.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel24
  - number: '24.3'
    text: |-
      Het accreditatieorgaan geeft uitvoering aan de toets, bedoeld in [artikel 23, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037837#Artikel23
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0037837
        artikel: '23'
        hoofdstuk: '3'
  - number: '24.4'
    text: |-
      Het accreditatieorgaan meldt aan Onze Minister de indiening van een aanvraag als bedoeld in [artikel 23][ref1] en
      de uitkomst van de daarmee verband houdende toets, bedoeld in artikel 23, vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0037837#Artikel23
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0037837
        artikel: '23'
        hoofdstuk: '3'
  - number: '24.5'
    text: |-
      Het accreditatieorgaan brengt jaarlijks verslag uit over de uitvoering van het experiment accreditatie onvolledige
      opleidingen in het jaarverslag, bedoeld in [artikel 18 van de Kaderwet zelfstandige bestuursorganen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel18
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '18'
  - number: '25.1'
    text: |-
      Van 2017 tot en met 2020 rapporteert het bestuur van een deelnemende rechtspersoon voor hoger onderwijs jaarlijks
      voor 1 juli in het verslag, bedoeld in [artikel 1.12, derde lid, van de wet][ref1], aan Onze Minister over de
      uitvoering van het experiment accreditatie onvolledige opleidingen in het voorafgaande kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
  - number: '25.2'
    text: |-
      In 2021 rapporteert het bestuur van een deelnemende rechtspersoon voor hoger onderwijs aan Onze Minister over de
      uitvoering van het experiment accreditatie onvolledige opleidingen in het tijdvak 2016 tot en met 2020.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel25
  - number: '25.3'
    text: |-
      Het bestuur van een deelnemende rechtspersoon voor hoger onderwijs verstrekt desgevraagd nadere informatie aan Onze
      Minister of het accreditatieorgaan in verband met de deelname aan en monitoring, evaluatie en effectmeting van het
      experiment accreditatie onvolledige opleidingen.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel25
  - number: '25.4'
    text: |-
      Onze Minister kan in verband met het experiment accreditatie onvolledige opleidingen een deelnemende instelling
      andere, op een individuele instelling of op een categorie instellingen voor hoger onderwijs afgestemde,
      verplichtingen opleggen.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel25
  - number: '26'
    text: |-
      In dit hoofdstuk wordt verstaan onder een deelnemende instelling: een instelling voor hoger onderwijs die op grond
      van [artikel 26b][ref1] gedurende één of beide fasen deelneemt aan het experiment educatieve module.


      [ref1]: https://wetten.overheid.nl/BWBR0037837#Artikel26b
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0037837
        artikel: 26b
        hoofdstuk: '4'
  - number: 26a
    text: |-
      Het experiment educatieve module duurt van 1 juli 2016 tot en met 30 juni 2022. Dit experiment bestaat uit twee
      fasen. De eerste fase duurt van 1 juli 2016 tot en met 30 juni 2019 en de tweede fase duurt van 1 juli 2019 tot en
      met 30 juni 2022.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel26a
  - number: 26b.1
    text: |-
      Een instelling voor hoger onderwijs als genoemd in de bijlage behorend bij
      [artikel 2, tweede lid, van de Regeling verwantschapstabel educatieve minor][ref1], kan deelnemen aan één of beide
      fasen van het experiment educatieve module.


      [ref1]: https://wetten.overheid.nl/BWBR0028148#Artikel2
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel26b
    references:
      - id: ref1
        bwb_id: BWBR0028148
        artikel: '2'
  - number: 26b.2
    text: |-
      Een instelling voor hoger onderwijs die het voornemen had deel te nemen aan het experiment educatieve module en dit
      voor 1 september 2016 aan Onze Minister heeft gemeld neemt deel aan de eerste en tweede fase van dit experiment.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel26b
  - number: 26b.3
    text: |-
      Een instelling voor hoger onderwijs die heeft deelgenomen aan de eerste fase van het experiment educatieve
      module, maar niet wenst deel te nemen aan de tweede fase van dit experiment meldt dat voor 1 januari 2020 aan Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel26b
  - number: 26b.4
    text: |-
      Een instelling voor hoger onderwijs, als bedoeld in het eerste lid, die niet heeft deelgenomen aan de eerste fase
      van het experiment educatieve module en die het voornemen heeft deel te nemen aan de tweede fase van dit experiment
      meldt dat voor 1 januari 2020 aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel26b
  - number: '27.1'
    text: |-
      Een deelnemende instelling kan, anders dan in het kader van een bacheloropleiding, een of meer
      modules wetenschappelijk onderwijs met een studielast van tenminste 30 studiepunten aanbieden op
      de opleidingsterreinen waarvoor deze instelling educatieve minoren kan verzorgen op grond van de
      [Regeling verwantschapstabel educatieve minor][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028148
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0028148
  - number: '27.2'
    text: |-
      Een student die beschikt over een getuigschrift als bedoeld in [artikel 7.11 van de wet][ref1] betreffende een
      bacheloropleiding in het wetenschappelijk onderwijs of een masteropleiding in het wetenschappelijk onderwijs, kan
      zich bij een deelnemende instelling inschrijven voor een module als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: '27.3'
    text: |-
      Voor inschrijving voor een module als bedoeld in het eerste lid is de aspirant-student de helft van het wettelijk
      collegegeld, bedoeld in [artikel 7.45a van de wet][ref1], verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: '27.4'
    text: |-
      De examencommissie van de deelnemende instelling verstrekt aan een student een certificaat educatieve module,
      indien de student de module, bedoeld in het eerste lid, met goed gevolg heeft afgerond.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel27
  - number: '27.5'
    text: |-
      Een student die beschikt over een getuigschrift als bedoeld in [artikel 7.11 van de wet][ref1] betreffende een
      bacheloropleiding in het wetenschappelijk onderwijs of een masteropleiding in het wetenschappelijk onderwijs en
      tevens beschikt over een certificaat educatieve module, is met inachtneming van de verwantschapsvoorschriften,
      bedoeld in [artikel 2, tweede lid, van de Regeling verwantschapstabel educatieve minor][ref2], bevoegd tot het
      geven van middelbaar algemeen voortgezet onderwijs, het geven van onderwijs in de eerste drie leerjaren van
      het hoger algemeen voortgezet onderwijs of van het voorbereidend wetenschappelijk onderwijs als bedoeld in de
      [Wet voortgezet onderwijs 2020][ref3] in een met zijn opleiding inhoudelijk overeenkomend vak in die leerjaren.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0028148#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0044212
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0028148
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0044212
  - number: '28'
    text: |-
      Met het experiment educatieve module wordt beoogd te onderzoeken of door educatieve modules nieuwe doelgroepen
      kiezen voor het leraarschap in het voortgezet onderwijs en meer gediplomeerden in het wetenschappelijk onderwijs
      worden opgeleid tot leraar in het voortgezet onderwijs.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel28
  - number: '29'
    text: |-
      In verband met het experiment educatieve module wordt afgeweken van
      [artikel 7.12, eerste lid, aanhef en onderdeel a, van de Wet voortgezet onderwijs 2020][ref1] en de
      [artikelen 7.11][ref2], [7.32, derde lid][ref3], en [7.45a van de wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref4
        bwb_id: BWBR0005682
        artikel: '7'
  - number: '30'
    text: 'Onze Minister evalueert het experiment educatieve module op basis van de volgende criteria:'
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel30
  - number: 30.a
    text: |-
      de mate waarin meer gediplomeerden in het wetenschappelijk onderwijs zijn opgeleid voor leraar in het voortgezet
      onderwijs; en
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel30
  - number: 30.b
    text: |-
      de mate waarin meer gediplomeerden op bachelorniveau in het wetenschappelijk onderwijs direct of indirect
      doorstromen naar een master lerarenopleiding op het niveau van wetenschappelijk onderwijs of naar het beroep
      leraar.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel30
  - number: '32.1'
    text: |-
      Van 2017 tot en met 2019 rapporteert het bestuur van een aan de eerste fase deelnemende instelling jaarlijks in het
      verslag, bedoeld in [artikel 2.9 van de wet][ref1], over de uitvoering van het experiment educatieve module in het
      voorafgaande kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '2'
  - number: '32.2'
    text: |-
      Van 2020 tot en met 2023 rapporteert het bestuur van een aan de tweede fase deelnemende instelling jaarlijks in het
      verslag, bedoeld in [artikel 2.9 van de wet][ref1], over de uitvoering van het experiment educatieve module in het
      voorafgaande kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '2'
  - number: '32.3'
    text: |-
      Voor 1 juli 2023 rapporteert het bestuur van een deelnemende instelling in het verslag, bedoeld in
      [artikel 2.9 van de wet][ref1] over de uitvoering van het experiment educatieve module gedurende de fase of fasen
      van dit experiment waaraan deze instelling heeft deelgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel2
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '2'
  - number: '32.4'
    text: |-
      Het bestuur van een deelnemende instelling verstrekt desgevraagd nadere informatie aan Onze Minister of het
      accreditatieorgaan in verband met de deelname aan en monitoring, evaluatie en effectmeting van het experiment
      educatieve module.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel32
  - number: '32.5'
    text: |-
      Het bestuur van een deelnemende instelling bevordert dat de met goed gevolg afgeronde educatieve module een
      vrijstelling oplevert voor een universitaire lerarenopleiding onverminderd de verantwoordelijkheden van de
      examencommissie, bedoeld in [artikel 7.12 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: '32.6'
    text: |-
      Onze Minister kan in verband met het experiment educatieve module een deelnemende instelling andere, op een
      individuele instelling of op een categorie instellingen voor hoger onderwijs afgestemde, verplichtingen opleggen.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel32
  - number: 32a
    text: |-
      Dit besluit berust mede op de [artikelen 9.1, eerste lid][ref1], en
      [9.2, eerste lid, van de Wet voortgezet onderwijs 2020][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel9
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0044212
        artikel: '9'
  - number: '33'
    text: Dit besluit treedt in werking op 1 mei 2016 en vervalt met ingang van 1 januari 2025.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel33
  - number: '34'
    text: 'Dit besluit wordt aangehaald als: Besluit experimenten flexibel hoger onderwijs'
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel34
