      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7.4'
  - number: '10'
    text: |-
      Onze Minister evalueert het experiment leeruitkomsten op basis van de volgende criteria:

      a. de mate waarin het verzorgen van hoger onderwijs als bedoeld in [artikel 7][ref1] tot een grotere deelname
      door studenten aan deeltijdse en duale associate degree-opleidingen, deeltijdse en duale bacheloropleidingen of
      deeltijdse en duale masteropleidingen en tot het verlenen van meer graden als bedoeld in de [artikelen 7.10a][ref2]
      en [7.10b van de wet][ref3] leidt;

      b. de mate waarin flexibiliteit van de inrichting en uitvoering van het hoger onderwijs, bedoeld in
      [artikel 7][ref4], leidt tot meer tevredenheid bij studenten en werkgevers; en

      c. de mate waarin de tijdens het experiment gehanteerde kaders ter borging van de onderwijskwaliteit effectief
      blijken te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0037837#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7.10a
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7.10b
      [ref4]: https://wetten.overheid.nl/BWBR0037837#Artikel7
