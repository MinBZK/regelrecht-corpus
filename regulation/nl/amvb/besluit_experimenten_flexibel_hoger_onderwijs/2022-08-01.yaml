        bwb_id: BWBR0005682
        artikel: '2.9'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '1.12'
  - number: 17a
    text: >-
      In dit hoofdstuk wordt verstaan onder deelnemende instelling: een universiteit als bedoeld in de [onderdelen a en
      b van de bijlage behorende bij de wet](onbekend), of een hogeschool als bedoeld in onderdeel g van die bijlage, die
      deelneemt aan het experiment flexstuderen.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17a
  - number: 17b
    text: |-
      1 Een deelnemende instelling kan een student die is ingeschreven voor een opleiding de mogelijkheid bieden die
      opleiding, of een deel daarvan, flexibel te volgen, waarbij

      a. de hoogte van het collegegeld wordt bepaald door de omvang van het onderwijs dat de student van plan is te
      volgen, en

      b. de student uitsluitend het onderwijs volgt waarvoor hij collegegeld betaalt.

      2 Aan het experiment flexstuderen kunnen uitsluitend studenten deelnemen die het wettelijk collegegeld verschuldigd
      zijn als bedoeld in [artikel 7.45a van de wet][ref1].

      3 Het collegegeldtarief voor het volgen van onderwijs, bedoeld in het eerste lid, bedraagt voor onderwijs met een
      studielast van één studiepunt, het bedrag van het wettelijk collegegeld, geldend voor het desbetreffende studiejaar
      van de desbetreffende opleiding, gedeeld door de studielast van die opleiding voor dat studiejaar en vermeerderd
      met maximaal 15 procent van dat breukdeel.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7.45a
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: 7.45a
  - number: 17c
    text: >-
      1 Een deelnemende instelling laat in een studiejaar niet meer studenten toe tot het experiment flexstuderen dan 10
      procent van het totaal aantal studenten dat in het daaraan voorafgaande studiejaar per 1 oktober was ingeschreven
      bij alle opleidingen van die instelling.


      2 Per studiejaar laat een deelnemende instelling maximaal 1.000 nieuwe studenten toe tot het experiment
      flexstuderen.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17c
  - number: 17d
    text: |-
      Het experiment flexstuderen duurt van 1 september 2017 tot 1 september 2023, tenzij Onze Minister een besluit neemt
      als bedoeld in [artikel 17h, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037837#Artikel17h
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17d
    references:
      - id: ref1
        bwb_id: BWBR0037837
        artikel: 17h
        hoofdstuk: 2a
  - number: 17e
    text: |-
      Met het experiment flexstuderen wordt beoogd te onderzoeken of het aanbieden van hoger onderwijs als bedoeld in
      [artikel 17b][ref1] leidt tot een toegankelijker aanbod van hoger onderwijs, dat beter aansluit bij de behoeften
      van studenten en daardoor leidt tot meer tevredenheid van en ontplooiingsmogelijkheden voor studenten en tot minder
      uitval.


      [ref1]: https://wetten.overheid.nl/BWBR0037837#Artikel17b
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17e
    references:
      - id: ref1
        bwb_id: BWBR0037837
        artikel: 17b
        hoofdstuk: 2a
  - number: 17f
    text: |-
      1 In verband met het experiment flexstuderen wordt afgeweken van de
      [artikelen 7.34, eerste lid, onderdelen a en b][ref1], [7.43][ref2] en [7.48 van de wet][ref3].

      2 Het bestuur van een deelnemende instelling kan in verband met het experiment flexstuderen ten aanzien van een
      deelnemende student afwijken van de [artikelen 7.47][ref4] en [7.51 tot en met 7.51i van de wet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7.34
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7.43
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7.48
      [ref4]: https://wetten.overheid.nl/BWBR0005682#Artikel7.47
      [ref5]: https://wetten.overheid.nl/BWBR0005682#Artikel7.51
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17f
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7.34'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7.43'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7.48'
      - id: ref4
        bwb_id: BWBR0005682
        artikel: '7.47'
      - id: ref5
        bwb_id: BWBR0005682
        artikel: '7.51'
  - number: 17g
    text: |-
      Onze Minister evalueert het experiment flexstuderen op basis van de volgende criteria: de mate waarin het aanbieden
      van hoger onderwijs als bedoeld in [artikel 17b][ref1] positief bijdraagt aan

      a. een toegankelijker aanbod van hoger onderwijs, dat

      b. beter aansluit bij de behoeften van studenten en daardoor leidt tot

      c. meer tevredenheid van studenten,

      d. meer ontplooiingsmogelijkheden voor studenten en

      e. tot minder uitval.


      [ref1]: https://wetten.overheid.nl/BWBR0037837#Artikel17b
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17g
    references:
      - id: ref1
        bwb_id: BWBR0037837
        artikel: 17b
        hoofdstuk: 2a
  - number: 17h
    text: >-
      1 Onze Minister doet in het studiejaar 2018–2019 tussentijds een onderzoek naar het experiment flexstuderen.
      Daarbij wordt in het bijzonder onderzocht:


      a. of de belangstelling voor deelname aan het experiment flexstuderen bij studenten toereikend is met het oog op
      een betekenisvolle evaluatie; en


      b. of voortzetting van het experiment flexstuderen verantwoord is uit een oogpunt van financiële beheersbaarheid en
      organisatorische uitvoerbaarheid.


      2 Indien de uitkomsten van de tussentijdse beoordeling, bedoeld in het eerste lid, negatief zijn, kan Onze
      Minister, na overleg met de deelnemende instellingen, het experiment met ingang van het studiejaar 2019–2020
      beëindigen.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17h
  - number: 17i
    text: >-
      Aan het experiment flexstuderen kan uitsluitend worden deelgenomen door universiteiten als bedoeld in de
      [onderdelen a en b van de bijlage behorende bij de wet](onbekend), en door hogescholen als bedoeld in onderdeel g
      van die bijlage.
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17i
  - number: 17j
    text: |-
      1 Voor deelname aan het experiment flexstuderen is toestemming van Onze Minister vereist.

      2 Een universiteit of een hogeschool die toestemming wenst te verkrijgen voor deelname aan het experiment
      flexstuderen, dient daartoe ofwel voor 1 maart 2017 ofwel in de periode van 1 januari 2019 tot 1 maart 2019 bij
      Onze Minister elektronisch een aanvraag in via het e-mailadres experimentflexstuderen@minocw.nl.

      3 In de aanvraag maakt de aanvrager inzichtelijk hoe het experiment bij de instelling zal worden vormgegeven.

      4 Een universiteit of een hogeschool als bedoeld in het tweede lid die reeds van Onze Minister toestemming heeft
      verkregen voor deelname aan het experiment flexstuderen, neemt deel aan het experiment.

      5 Een universiteit of hogeschool als bedoeld in [artikel 17i][ref1] die op 31 december 2020 nog niet deelnam
      aan het experiment flexstuderen, verkrijgt van rechtswege toestemming van Onze Minister om deel te nemen aan dit
      experiment, indien de universiteit of hogeschool:

      a. instemming heeft verkregen van het medezeggenschapsorgaan, bedoeld in [artikel 3, vierde en vijfde lid][ref2],
      op het voornemen om deel te nemen aan het experiment flexstuderen;

      b. het voornemen om deel te nemen aan het experiment flexstuderen voor 1 september 2021 heeft gemeld aan Onze
      Minister; en

      c. in de melding inzichtelijk heeft gemaakt hoe het experiment flexstuderen bij deze universiteit of hogeschool zal
      worden vormgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0037837#Artikel17i
      [ref2]: https://wetten.overheid.nl/BWBR0037837#Artikel3
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17j
    references:
      - id: ref1
        bwb_id: BWBR0037837
        artikel: 17i
        hoofdstuk: 2a
      - id: ref2
        bwb_id: BWBR0037837
        artikel: '3'
        hoofdstuk: '1'
  - number: 17m
    text: |-
      1 Deelname aan het experiment flexstuderen geeft de student uitsluitend het recht:

      deel te nemen aan het onderwijs waarvoor hij overeenkomstig [artikel 17b][ref1] betaalt, tentamens af te leggen van
      de onderwijseenheden waarvoor hij overeenkomstig artikel 17b betaalt en in voorkomend geval examens af te leggen.
      [Artikel 7.48 van de wet][ref2] is niet van toepassing.

      2 De student die deelneemt aan het experiment flexstuderen, kan gedurende het studiejaar volgens door de instelling
      vastgestelde regels van procedurele aard alsnog kiezen voor het volgen van onderwijs tegen wettelijk collegegeld.
      In dat geval betaalt de student het resterende deel van het wettelijk collegegeld naar rato van de omvang van het
      resterende deel van het desbetreffende studiejaar. In een studiejaar betaalt de deelnemende student in totaal niet
      meer dan het bedrag van het wettelijk collegegeld, geldend voor het desbetreffende studiejaar vermeerderd met 15
      procent van dat bedrag.

      3 Een student die deelneemt aan het experiment flexstuderen verstrekt desgevraagd nadere informatie aan de
      deelnemende instelling waar hij is ingeschreven in verband met de deelname aan het experiment flexstuderen door de
      instelling en de monitoring, evaluatie en effectmeting van het experiment flexstuderen door Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0037837#Artikel17b
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7.48
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17m
    references:
      - id: ref1
        bwb_id: BWBR0037837
        artikel: 17b
        hoofdstuk: 2a
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7.48'
  - number: 17n
    text: |-
      1 Met inachtneming van dit besluit richt het bestuur van een deelnemende instelling het experiment flexstuderen
      naar eigen inzicht in.

      2 Het bestuur van een deelnemende instelling kan in verband met de uitvoering van het experiment flexstuderen
      afwijken van de verplichting jegens een deelnemende student tot het bieden van financiële ondersteuning, bedoeld in
      de [artikelen 7.51 tot en met 7.51i van de wet][ref1], indien die ondersteuning in verband met de deelname van de
      student aan het experiment flexstuderen niet nodig is.

      3 Het bestuur van een deelnemende instelling kan in verband met de uitvoering van het experiment flexstuderen de
      wijze van betalen van het collegegeld, bedoeld in [artikel 17b, derde lid][ref2], regelen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7.51
      [ref2]: https://wetten.overheid.nl/BWBR0037837#Artikel17b
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17n
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7.51'
      - id: ref2
        bwb_id: BWBR0037837
        artikel: 17b
        hoofdstuk: 2a
  - number: 17o
    text: |-
      1 Het bestuur van een deelnemende instelling voert het experiment flexstuderen overeenkomstig de aanvraag, bedoeld
      in [artikel 17j, tweede lid][ref1], of de melding, bedoeld in artikel 17j, vijfde lid, uit.

      2 Het bestuur van een deelnemende instelling neemt zodanige maatregelen dat studenten die deelnemen aan het
      experiment flexstuderen uitsluitend onderwijs kunnen volgen en uitsluitend tentamens en examens kunnen afleggen in
      de vakken van de opleiding waarvoor zij betalen.

      3 Het bestuur van een deelnemende instelling maakt de inrichting van het experiment flexstuderen binnen de
      instelling tijdig bekend. De informatie, bedoeld in de eerste volzin, betreft in ieder geval de volgende
      onderwerpen:

      a. een vermelding van de opleidingen waarop het experiment flexstuderen betrekking heeft;

      b. de wijze van aanmelding door studenten voor het experiment flexstuderen;

      c. de maximaal tot het experiment flexstuderen toe te laten studenten en de in verband daarmee vastgestelde
      selectiecriteria en -procedure;

      d. een regeling voor het herkansen van tentamens en de geldigheidsduur van tentamenresultaten;

      e. het maximum aantal, al dan niet aaneengesloten, studiejaren, dat een student kan deelnemen aan het experiment
      flexstuderen;

      f. de wijze waarop het instellingsbestuur de overstap door studenten van deelname aan het experiment flexstuderen
      naar het volgen van regulier hoger onderwijs, bedoeld in [artikel 17m, tweede lid][ref2], en omgekeerd in
      procedurele en financiële zin heeft geregeld;

      g. de wijze waarop het bestuur gebruik maakt van de bevoegdheden, bedoeld in
      [artikel 17n, tweede en derde lid][ref3];

      h. het handhavingsbeleid van het bestuur in verband met de verplichting, bedoeld in het tweede lid; en

      i. de inhoud van de informatieverplichting voor studenten, bedoeld in [artikel 17m, derde lid][ref4].

      4 De aspecten, bedoeld in het derde lid, onderdelen a en d, worden vastgesteld in de onderwijs- en examenregeling.

      5 Het bestuur van een deelnemende instelling rapporteert jaarlijks in het verslag, bedoeld in
      [artikel 2.9 van de wet][ref5], aan Onze Minister over de uitvoering van het experiment flexstuderen in het
      voorafgaande kalenderjaar.

      6 Het bestuur van een deelnemende instelling verstrekt desgevraagd nadere informatie aan Onze Minister in verband
      met de deelname aan en monitoring, evaluatie en effectmeting van het experiment flexstuderen.

      7 Onze Minister kan een deelnemende instelling in verband met het experiment flexstuderen andere, op de individuele
      instelling of op een categorie instellingen voor hoger onderwijs afgestemde verplichtingen opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0037837#Artikel17j
      [ref2]: https://wetten.overheid.nl/BWBR0037837#Artikel17m
      [ref3]: https://wetten.overheid.nl/BWBR0037837#Artikel17n
      [ref4]: https://wetten.overheid.nl/BWBR0037837#Artikel17m
      [ref5]: https://wetten.overheid.nl/BWBR0005682#Artikel2.9
    url: https://wetten.overheid.nl/BWBR0037837/2022-08-01#Artikel17o
