  - number: '5'
    text: |-
      1 Met betrekking tot homeopathische farmaceutische producten als bedoeld in [artikel 4][ref1] zijn ten aanzien van
      etikettering en bijsluiter, alsmede ten aanzien van reclame de volgende leden van toepassing.

      2 In plaats van de in artikel 2, onderscheidenlijk artikel 7 van het Besluit etikettering en bijsluiter
      farmaceutische producten voorgeschreven vermeldingen, worden uitsluitend de volgende vermeldingen aangebracht op de
      buitenverpakking waarin het homeopathisch farmaceutisch product wordt afgeleverd, onderscheidenlijk in voorkomend
      geval opgenomen in de bijsluiter:

      a. de aanduiding 'homeopathisch farmaceutisch product' of 'homeopathisch geneesmiddel';
      [artikel 2, tweede lid][ref2], is van overeenkomstige toepassing;

      b. de wetenschappelijke benaming van de homeopathische grondstof of grondstoffen, gevolgd door de verdunningsgraad,
      waarvoor gebruik wordt gemaakt van de symbolen van de desbetreffende van toepassing zijnde farmacopee;

      c. de naam en het adres van degene te wiens name het homeopathisch farmaceutisch product in het register staat
      ingeschreven, en eventueel van de fabrikant;

      d. de wijze van gebruik en, zo nodig, de wijze van toediening;

      e. de datum tot welke het homeopathisch farmaceutisch product geschikt voor gebruik wordt geacht, voorafgegaan door
      de woorden: 'niet te gebruiken na';

      f. de farmaceutische vorm;

      g. de inhoud van de verpakking, uitgedrukt in gewicht of volume, dan wel doseringseenheden;

      h. zo nodig, bijzondere voorzorgsmaatregelen voor de bewaring;

      i. zo nodig een bijzondere waarschuwing, verband houdende met het gebruik;

      j. het charge-nummer van de fabrikant;

      k. het nummer waaronder het homeopathisch farmaceutisch product in het register is ingeschreven;

      l. de aanduiding 'homeopathisch geneesmiddel zonder goedgekeurde therapeutische indicaties', waarin

      - «homeopathisch» mag zijn vervangen door: «homeopatisch»; alsmede
      - 'goedgekeurde' door: specifieke;

      en waarop [artikel 2, tweede lid][ref3], van overeenkomstige toepassing is;

      m.een vermelding waarbij de gebruiker wordt geadviseerd een arts te raadplegen indien de klachten aanhouden
      gedurende het gebruik van het homeopathische farmaceutische product;

      n. in geval het een farmaceutisch product betreft ten aanzien waarvan artikel 4, eerste of derde lid, van de wet
      van toepassing is: 'uitsluitend af te leveren in apotheken', onderscheidenlijk: 'uitsluitend af te leveren op
      recept', dan wel 'U.A.', onderscheidenlijk 'U.R.'; in alle andere gevallen de vermelding dat vóór toepassing wordt
      aanbevolen arts of therapeut te raadplegen;

      o. de prijs alsmede de eventuele regeling voor vergoeding, voor zover deze vermelding door Onze Minister is
      voorgeschreven.

      3 In afwijking van het [Reclamebesluit geneesmiddelen][ref4] mogen in de reclame slechts de in het tweede lid
      bedoelde gegevens worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0005371#Artikel4
