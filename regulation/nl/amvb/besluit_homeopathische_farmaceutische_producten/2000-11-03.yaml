preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 16 oktober 1990, GMI-735113;


    Overwegende dat de beginselen die in de Wet op de Geneesmiddelenvoorziening (Stb. 1958, 408) aan de registratie
    van farmaceutische producten ten grondslag liggen, niet zinvol van toepassing kunnen zijn op homeopathische
    farmaceutische producten en dat registratie van die producten uit een oogpunt van volksgezondheid ook niet nodig
    wordt geacht;


    Gelet op de artikelen 1, derde lid, en 26 onder f, van de Wet op de Geneesmiddelenvoorziening;


    Gehoord de Geneesmiddelencommissie (advies van 5 december 1989, nr. 4126);


    De Raad van State gehoord (advies van 5 april 1991, nr. W13.90.0518);


    Gezien het nader rapport van voornoemde Staatssecretaris van 12 december 1991, GMV/G-904624;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005371/2000-11-03#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit wordt verstaan onder 'wet', 'farmaceutisch product', 'fabrikant', 'bijsluiter' en 'lid-staat'
      hetgeen daaronder wordt verstaan in het [Besluit registratie geneesmiddelen][ref1], het Besluit bereiding en
      aflevering van farmaceutische producten en het Besluit etikettering en bijsluiter farmaceutische producten, terwijl
      voorts wordt verstaan onder:

      homeopathisch farmaceutisch product: farmaceutisch product

      - dat is bereid volgens een in de Europese Farmacopee, of in de op 22 september 1992 door de lid-staten officieel
      gebruikte farmacopees, beschreven homeopathisch fabricageprocédé, en
      - dat verkregen is uit producten, substanties of mengsels die homeopathische grondstoffen worden genoemd.

      2 Voor de toepassing van dit besluit wordt onder een homeopathisch farmaceutisch product tevens verstaan een
      farmaceutisch product dat is bereid volgens antroposofische receptuur, voor zover de bereidingswijze de algemene
      methodiek is die gangbaar is bij de bereiding van een homeopathisch farmaceutisch product.


      [ref1]: https://wetten.overheid.nl/BWBR0003114
    url: https://wetten.overheid.nl/BWBR0005371/2000-11-03#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003114
  - number: '2'
    text: |-
      1 Op de verpakking van het homeopathisch farmaceutisch product wordt duidelijk leesbaar vermeld dat het om een
      homeopathisch geneesmiddel gaat.

      2 In afwijking van het eerste lid, mag voor een in [artikel 1, tweede lid][ref1], bedoeld homeopathisch
      farmaceutisch product worden vermeld dat het om een antroposofisch geneesmiddel gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0005371#Artikel1
    url: https://wetten.overheid.nl/BWBR0005371/2000-11-03#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005371
        artikel: '1'
  - number: '3'
    text: >-
      In een homeopathisch farmaceutisch product zijn geen bestanddelen aanwezig, andere dan hulpstoffen, die niet
      volgens homeopathische bereidingswijze zijn vervaardigd.
    url: https://wetten.overheid.nl/BWBR0005371/2000-11-03#Artikel3
  - number: '4'
    text: |-
      1 Dit artikel is uitsluitend van toepassing ten aanzien van homeopathische farmaceutische producten die voldoen aan
      de volgende voorwaarden:

      a. het homeopathisch farmaceutisch product is voor oraal of uitwendig gebruik bestemd;

      b. noch op of in de verpakking, noch in de bijsluiter wordt melding gemaakt van enige therapeutische indicatie;

      c. de verdunningsgraad is zodanig dat het homeopathisch farmaceutisch product gegarandeerd onschadelijk is; in het
      bijzonder mag het niet meer bevatten dan:

      - één deel per 10 000 van de oertinctuur; of
      - niet meer dan één honderdste van de kleinste, eventueel in de allopathische geneeskunde gebruikte dosis voor
      werkzame bestanddelen waarvan de aanwezigheid in een allopathisch geneesmiddel met zich brengt dat het uitsluitend
      op recept mag worden afgeleverd.

      2 De volgende voorschriften van het [Besluit registratie geneesmiddelen][ref1] zijn niet van toepassing:

      a. [artikel 2][ref2],

      - eerste lid, onderdelen *h* en *i*;
      - tweede lid, voor wat betreft het overleggen van monsters van de werkzame bestanddelen;
      - zevende lid, voor wat betreft controlemethodieken onderscheidenlijk gegevens die niet in de aanvraag aanwezig
      moeten zijn;
      - achtste lid;
      - tiende lid, onderdelen *d, e* en *f*;

      b. [artikel 3][ref3];

      c. de procedure bedoeld in de artikelen 7*a* tot en met 7*f*;

      d. artikel 9, eerste lid, onderdeel *b*.

      3 In het geval de aanvraag tot registratie betrekking heeft op een reeks van homeopathische farmaceutische
      producten die uitsluitend van dezelfde homeopathische grondstof zijn afgeleid, gaat, teneinde in het bijzonder
      de farmaceutische kwaliteit en de homogeniteit van de charges van deze producten aan te tonen, zodanige aanvraag
      vergezeld van de volgende documenten:

      a. de wetenschappelijke benaming of een andere in een farmacopee voorkomende benaming van de homeopathische
      grondstof of grondstoffen, onder vermelding van de verschillende te registreren toedieningswijzen, farmaceutische
      vormen en verdunningsgraden;

      b. een dossier waarin wordt beschreven hoe de homeopathische grondstof of grondstoffen wordt, onderscheidenlijk
      worden verkregen en gecontroleerd, en waarin het homeopathische karakter met behulp van een gedegen bibliografie
      wordt onderbouwd;

      c. het fabricage- en controledossier voor elke farmaceutische vorm en een beschrijving van de verdunnings- en
      potentiëringsmethoden;

      d. de fabricagevergunning voor de betrokken homeopathische farmaceutische producten;

      e. een afschrift van de eventuele registratiebewijzen of vergunningen die in andere lid-staten voor dezelfde
      homeopathische farmaceutische producten zijn afgegeven;

      f. gegevens betreffende de houdbaarheid van het geneesmiddel.

      Tevens worden meegezonden een of meer monsters of modellen van het handelsspecimen van de betrokken homeopathische
      farmaceutische producten.


      [ref1]: https://wetten.overheid.nl/BWBR0003114
      [ref2]: https://wetten.overheid.nl/BWBR0005371#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0005371#Artikel3
