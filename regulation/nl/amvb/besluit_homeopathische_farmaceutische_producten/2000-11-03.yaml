  - number: '6'
    text: |-
      1 Dit artikel is uitsluitend van toepassing ten aanzien van andere homeopathische farmaceutische producten dan die
      bedoeld in [artikel 4, eerste lid][ref1].

      2 [Artikel 2, eerste lid, onderdeel ][ref2] is niet van toepassing.

      3 Bij de aanvraag tot inschrijving als bedoeld in
      [artikel 2, eerste lid, van het Besluit registratie geneesmiddelen][ref3] wordt, met inachtneming van de krachtens
      het vijfde lid vastgestelde voorschriften, gevoegd:

      - de op het homeopathisch farmaceutisch product betrekking hebbende monografie onderscheidenlijk de op de
      bestanddelen van het homeopathisch farmaceutisch product betrekking hebbende monografieën;
      - literatuurgegevens die aannemelijk maken dat het product voor de aangegeven indicatie met succes is toe te
      passen.

      4 De procedure bedoeld in de [artikelen 7][ref4] is niet van toepassing.

      5 Onze Minister geeft voorschriften ten aanzien van de farmacologische, toxicologische en klinische proeven met
      het oog op de registratie van homeopathische farmaceutische producten, alsmede ten aanzien van de aard en inhoud
      van de over te leggen monografieën. Zodanige voorschriften worden opgesteld met inachtneming van de beginselen en
      bijzondere kenmerken van de in Nederland bedreven homeopathische geneeskunde.

      6 Onverminderd [artikel 2][ref5], onderscheidenlijk
      [artikel 7 van het Besluit etikettering en bijsluiter farmaceutische producten][ref6], wordt op het etiket en
      in de bijsluiter van homeopathische farmaceutische producten die krachtens het vijfde lid zijn geregistreerd, de
      volgende vermelding gebezigd: 'De werkzaamheid van dit homeopathische middel is door het College ter beoordeling
      van geneesmiddelen niet met wetenschappelijke criteria beoordeeld'.


