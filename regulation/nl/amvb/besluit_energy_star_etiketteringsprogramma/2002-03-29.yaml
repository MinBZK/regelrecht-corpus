      Het is verboden het gemeenschappelijk logo, bedoeld in artikel 3, onder a, van [verordening (EG) nr. 2422/2001]
      (32001R2422) van het Europees Parlement en de Raad van de Europese Unie betreffende een communautair energie-
      efficiëntie-etiketteringsprogramma voor kantoorapparatuur (PbEG L 332) te gebruiken anders dan in overeenstemming
      met deze verordening.
