articles:
  - number: '1'
    text: |-
      De verplichting om met iedere instelling op haar verzoek een overeenkomst te sluiten als bedoeld in
      [artikel 15, eerste lid, van de Algemene Wet Bijzondere Ziektekosten][ref1], geldt niet voor zover de instelling
      zorg verleent als bedoeld in de [artikelen 4 tot en met 8, van het Besluit zorgaanspraken AWBZ][ref2] welke niet
      gepaard gaat met verblijf als bedoeld in [artikel 9][ref3] van dat besluit, alsmede voor zover de instelling zorg
      verleent als bedoeld in de [artikelen 11][ref4] en [16][ref5] van dat besluit.


