  - number: '2.1'
    text: |-
      Het bevoegd gezag schrijft een leerling in voor een opleiding na ondertekening van een onderwijsovereenkomst. In
      de onderwijsovereenkomst verklaart de leerling zich bekend met de verplichting tot het betalen van lesgeld op grond
      van de wet.
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel2
  - number: '2.2'
    text: |-
      De lesgeldplicht gaat in op de eerste dag van het desbetreffende schooljaar of, indien de leerling in de loop van
      het schooljaar wordt ingeschreven, op de datum van inschrijving.
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel2
  - number: '2.3'
    text: |-
      Inschrijving geschiedt door of namens het bevoegd gezag. Na medeondertekening door of namens het bevoegd gezag
      geldt de onderwijsovereenkomst als bewijs van inschrijving.
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel2
  - number: '3'
    text: |-
      Het bevoegd gezag beëindigt de inschrijving van de leerling op zijn aanvraag of zodra de leerling de opleiding met
      goed gevolg heeft afgesloten.
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel3
  - number: '4.1'
    text: |-
      Het lesgeld wordt door de lesgeldplichtige aan het Ministerie van OCW voldaan. De lesgeldplichtige heeft de keuze
      tussen:
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel4
  - number: 4.1.a
    text: betaling ineens binnen een maand na de datum van het betalingsverzoek, en
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel4
  - number: 4.1.b
    text: betaling ineens of in termijnen door een opdracht tot automatische incasso aan Onze minister.
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel4
  - number: '4.2'
    text: |-
      Indien de lesgeldplichtige een opdracht tot automatische incasso voor betaling in één termijn heeft verstrekt en
      de leerling voor 1 oktober van het schooljaar wordt ingeschreven, wordt het verschuldigde bedrag afgeschreven in de
      maand oktober van het schooljaar.
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel4
  - number: '4.3'
    text: |-
      Indien de lesgeldplichtige een opdracht tot automatische incasso voor betaling in meer dan één termijn heeft
      verstrekt en de leerling voor 1 oktober van het schooljaar wordt ingeschreven, wordt van het totaal verschuldigde
      bedrag afgeschreven in de maand:
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel4
  - number: 4.3.a
    text: 'oktober van het schooljaar: 11,11%;'
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel4
  - number: 4.3.b
    text: 'november van het schooljaar: 11,11%;'
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel4
  - number: 4.3.c
    text: 'december van het schooljaar: 11,11%;'
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel4
  - number: 4.3.d
    text: 'januari van het schooljaar: 11,11%;'
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel4
  - number: 4.3.e
    text: 'februari van het schooljaar: 11,11%;'
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel4
  - number: 4.3.f
    text: 'maart van het schooljaar: 11,11%;'
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel4
  - number: 4.3.g
    text: 'april van het schooljaar: 11,11%;'
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel4
  - number: 4.3.h
    text: 'mei van het schooljaar: 11,11%; en'
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel4
  - number: 4.3.i
    text: 'juni van het schooljaar: 11,11%.'
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel4
  - number: '4.4'
    text: |-
      Indien de lesgeldplichtige een opdracht tot automatische incasso voor betaling in een of meer termijnen heeft
      verstrekt en de leerling na 30 september van het schooljaar wordt ingeschreven, wordt het verschuldigde bedrag
      afgeschreven op bij ministeriële regeling te bepalen tijdstippen.
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel4
  - number: '5'
    text: |-
      Voor een leerling die na 31 oktober van een schooljaar wordt ingeschreven aan een dagschool, wordt het lesgeld
      verminderd met eentwaalfde deel voor iedere verstreken hele maand in dat schooljaar.
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel5
  - number: '6.1'
    text: |-
      Geen lesgeld is verschuldigd indien de inschrijving van de leerling voor 1 oktober van dat schooljaar wordt
      beëindigd.
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel6
  - number: '6.2'
    text: 'Vrijgesteld van het betalen van lesgeld is de lesgeldplichtige indien het betreft een leerling die:'
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel6
  - number: 6.2.a
    text: |-
      eerder in het desbetreffende schooljaar was ingeschreven aan een dagschool, voor welke inschrijving geen
      vrijstelling of teruggave van lesgeld heeft plaatsgehad,
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel6
  - number: 6.2.b
    text: is ingeschreven aan een dagschool, verbonden aan een justitiële jeugdinrichting, of
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel6
  - number: 6.2.c
    text: is ingeschreven voor een bij ministeriële regeling aan te wijzen bijzondere vorm van dagonderwijs.
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel6
  - number: '6.3'
    text: |-
      Voor een schooljaar is de leerling aan lesgeld nooit meer verschuldigd dan het bedrag, bedoeld in
      [artikel 5, tweede lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004188#Artikel5
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004188
        artikel: '5'
  - number: '6.4'
    text: |-
      Bij ministeriële regeling wordt bepaald welke bewijsstukken de lesgeldplichtige overlegt om voor vrijstelling in
      aanmerking te komen.
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel6
  - number: '7.1'
    text: |-
      Indien de inschrijving voor 1 mei van het schooljaar wordt beëindigd vanwege een in het tweede lid genoemde reden,
      wordt het lesgeld voor dat schooljaar op aanvraag van de lesgeldplichtige terugbetaald met eentwaalfde deel voor
      iedere resterende hele maand in dat schooljaar.
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel7
  - number: '7.2'
    text: 'Teruggave van lesgeld is uitsluitend mogelijk indien de inschrijving is beëindigd in verband met:'
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel7
  - number: 7.2.a
    text: het met goed gevolg hebben afgerond van de opleiding,
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel7
  - number: 7.2.b
    text: |-
      de inschrijving voor een cursus als bedoeld in [artikel 15, eerste lid][ref1], mits die inschrijving plaatsvindt in
      het desbetreffende schooljaar,


      [ref1]: https://wetten.overheid.nl/BWBR0011400#Artikel15
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011400
        artikel: '15'
        hoofdstuk: '3'
  - number: 7.2.c
    text: overlijden of ernstige ziekte van de leerling, of
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel7
  - number: 7.2.d
    text: bij ministeriële regeling te bepalen bijzondere familieomstandigheden.
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel7
  - number: '7.3'
    text: |-
      Een aanvraag om teruggave van lesgeld wordt voor het einde van het desbetreffende schooljaar gedaan op een bij
      ministeriële regeling te bepalen wijze.
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel7
  - number: '7.4'
    text: |-
      Geen teruggave van lesgeld vindt plaats indien op grond van de
      [Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref1] of de [Wet studiefinanciering 2000][ref2] een
      tegemoetkoming in de onderwijsbijdrage is toegekend of als voorschot is verstrekt, en de tegemoetkoming of het
      voorschot is verrekend met de verplichting tot het betalen van lesgeld.


      [ref1]: https://wetten.overheid.nl/BWBR0012438
      [ref2]: https://wetten.overheid.nl/BWBR0011453
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0012438
      - id: ref2
        bwb_id: BWBR0011453
  - number: '8'
    text: |-
      De dagscholen verstrekken Onze minister gegevens omtrent de inschrijving op een bij ministeriële regeling te
      bepalen wijze.
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel8
  - number: '9.1'
    text: |-
      Een aanvraag tot inschrijving van een cursist bij een cursus kan uitsluitend worden gedaan door degene die op grond
      van de inschrijving cursusgeldplichtig zal zijn.
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel9
  - number: '9.2'
    text: |-
      De aanvraag wordt gedaan door inlevering bij de cursus van een door de cursusgeldplichtige ingevuld en ondertekend
      inschrijvingsformulier. Het inschrijvingsformulier wordt door of namens het bevoegd gezag verstrekt en bevat bij
      ministeriële regeling te bepalen gegevens. Het formulier bevat in ieder geval de naam en het adres van de cursist
      en, indien deze minderjarig is, van de wettelijke vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel9
  - number: '9.3'
    text: |-
      Inschrijving geschiedt door of namens het bevoegd gezag. Na medeondertekening door of namens het bevoegd gezag
      geldt het inschrijvingsformulier als bewijs van inschrijving.
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel9
  - number: '9.4'
    text: 'Inschrijving geschiedt niet dan nadat:'
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel9
  - number: 9.4.a
    text: |-
      het cursusgeld is voldaan, tenzij [artikel 13][ref1] van toepassing is, of


      [ref1]: https://wetten.overheid.nl/BWBR0011400#Artikel13
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011400
        artikel: '13'
        hoofdstuk: '3'
  - number: 9.4.b
    text: |-
      een betalingsregeling als bedoeld in [artikel 11][ref1] is getroffen.


      [ref1]: https://wetten.overheid.nl/BWBR0011400#Artikel11
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011400
        artikel: '11'
        hoofdstuk: '3'
  - number: '10'
    text: |-
      Het bevoegd gezag beëindigt de inschrijving van de cursist op aanvraag van de cursusgeldplichtige. Het bevoegd
      gezag verstrekt een bewijs van uitschrijving aan de cursusgeldplichtige. Het bewijs van uitschrijving bevat bij
      ministeriële regeling te bepalen gegevens.
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel10
  - number: '11.1'
    text: |-
      Het cursusgeld is door de cursusgeldplichtige verschuldigd aan de instelling die het onderwijs aan de cursus
      verzorgt.
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel11
  - number: '11.2'
    text: |-
      Het cursusgeld is, ongeacht het aantal inschrijvingen door een cursist, eenmaal verschuldigd per cursusjaar per
      instelling en wordt voldaan door:
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel11
  - number: 11.2.a
    text: betaling van het cursusgeld aan het bevoegd gezag bij de inschrijving,
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel11
  - number: 11.2.b
    text: |-
      het bij de inschrijving treffen van een regeling inzake de betaling van het cursusgeld tussen het bevoegd gezag en
      de cursusgeldplichtige alsmede de naleving door de cursusgeldplichtige, of
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel11
  - number: 11.2.c
    text: |-
      schriftelijke vaststelling bij de inschrijving door of namens het bevoegd gezag dat op de cursusgeldplichtige
      [artikel 13][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0011400#Artikel13
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011400
        artikel: '13'
        hoofdstuk: '3'
  - number: '11.3'
    text: |-
      De laatste termijn van het cursusgeld wordt in ieder geval betaald binnen 4 maanden na aanvang van de cursus, en
      uiterlijk voor het einde van de cursus.
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel11
  - number: '11.4'
    text: |-
      Indien een cursist in een cursusjaar bij dezelfde instelling voor meerdere cursussen staat ingeschreven, is het
      cursusgeld van de cursus met het hoogste cursusgeldtarief verschuldigd.
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel11
  - number: '11.5'
    text: |-
      De cursusgeldplichtige verstrekt aan het bevoegd gezag bewijsstukken voor de aanspraak op terugbetaling van
      cursusgeld als bedoeld in [artikel 14][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011400#Artikel14
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011400
        artikel: '14'
        hoofdstuk: '3'
  - number: '12'
    text: |-
      Voor een cursist die in de loop van het cursusjaar wordt ingeschreven, wordt het cursusgeld verminderd met
      eentwaalfde deel voor iedere in dat cursusjaar reeds verstreken maand.
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel12
  - number: '13.1'
    text: |-
      Geen cursusgeld is verschuldigd indien de cursist bij aanvang van het cursusjaar waarin de cursus plaatsvindt de
      leeftijd van 18 jaren nog niet heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel13
  - number: '13.2'
    text: |-
      Geen cursusgeld is verschuldigd indien de cursist bij de instelling die de cursus verzorgt, tevens is ingeschreven
      voor een opleiding waarvoor lesgeld is verschuldigd.
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel13
  - number: '14.1'
    text: |-
      Indien de inschrijving wordt beëindigd wegens een in het tweede of derde lid genoemde reden, wordt het cursusgeld
      voor het desbetreffende cursusjaar op aanvraag van de cursusgeldplichtige geheel of gedeeltelijk terugbetaald
      met eentwaalfde deel voor iedere in dat cursusjaar resterende hele maand waarin de cursist niet langer zal zijn
      ingeschreven.
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel14
  - number: '14.2'
    text: 'Teruggave van cursusgeld is uitsluitend mogelijk indien de inschrijving is beëindigd:'
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel14
  - number: 14.2.a
    text: voor de eerste dag waarop de lessen in het cursusjaar aanvangen,
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel14
  - number: 14.2.b
    text: |-
      in verband met de inschrijving bij een dagschool, mits die inschrijving plaatsvindt in het desbetreffende
      cursusjaar,
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel14
  - number: 14.2.c
    text: wegens overlijden of ernstige ziekte van de cursist, ter beoordeling van het bevoegd gezag, of
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel14
  - number: 14.2.d
    text: wegens bij ministeriële regeling te bepalen bijzondere familieomstandigheden.
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel14
  - number: '14.3'
    text: |-
      In afwijking van het tweede lid kan teruggave van cursusgeld plaatsvinden
      op grond van door het bevoegd gezag opgestelde bepalingen als bedoeld in
      [artikel 8.1.3, derde lid, onder e, van de Wet educatie en beroepsonderwijs][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel8
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '8'
  - number: '14.4'
    text: Een aanvraag om teruggave van cursusgeld wordt voor het einde van dat cursusjaar gedaan bij het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel14
  - number: '14.5'
    text: |-
      Indien de inschrijving wordt beëindigd wegens het met goed gevolg hebben afgerond van de opleiding, wordt het
      cursusgeld voor het desbetreffende cursusjaar op aanvraag van de cursusgeldplichtige terugbetaald met een tiende
      deel voor iedere in het cursusjaar resterende maand waarin de cursist niet langer zal zijn ingeschreven. De laatste
      twee maanden van het cursusjaar tellen daarbij niet mee.
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel14
  - number: '15.1'
    text: 'Het cursusgeldtarief voor de volgende categorieën cursussen bedraagt naar de maatstaf van 1 augustus 2006:'
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel15
  - number: 15.1.a
    text: |-
      opleidingen beroepsonderwijs voor zover het betreft de assistent-opleiding, de entreeopleiding en de
      basisberoepsopleiding: € 199,71  per cursusjaar,
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel15
  - number: 15.1.b
    text: |-
      opleidingen beroepsonderwijs voor zover het betreft de vakopleiding, de middenkaderopleiding en de
      specialistenopleiding: € 485,60  per cursusjaar, en
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel15
  - number: 15.1.c
    text: |-
      opleidingen voortgezet algemeen volwassenenonderwijs, gericht op het behalen van een diploma als bedoeld in de
      [artikelen 7 tot en met 9 van de Wet op het voortgezet onderwijs][ref1], of onderdelen van dat diploma: € 0,62
      voor elke 45 minuten onderwijs, berekend op basis van het normatieve aantal minuten onderwijs per jaar van de
      opleiding waarvoor inschrijving heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel7
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '7'
  - number: '15.2'
    text: |-
      De cursusgeldtarieven worden jaarlijks bij ministeriële regeling vastgesteld aan de hand van de
      consumentenprijsindex. De tarieven, met uitzondering van het in het eerste lid, onder c, bedoelde tarief, worden
      afgerond op het naastbij gelegen gehele getal. De ministeriële regeling wordt voor 1 oktober voorafgaande aan het
      cursusjaar waarop de herziening van het cursusgeldtarief betrekking heeft, vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel15
  - number: '15.3'
    text: Bij ministeriële regeling wordt bepaald wat onder de consumentenprijsindex wordt verstaan.
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel15
  - number: '16'
    text: |-
      Indien de aard van het onderwijs, de cursusduur, het aantal lessen of de doelgroep van de cursus daartoe aanleiding
      geeft, kunnen bij ministeriële regeling de in [artikel 15][ref1] genoemde cursusgeldtarieven worden verlaagd.


      [ref1]: https://wetten.overheid.nl/BWBR0011400#Artikel15
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011400
        artikel: '15'
        hoofdstuk: '3'
  - number: '17.1'
    text: |-
      Het lesgeld voor het cursusjaar 2021–2022 wordt verminderd met 50 procent van het bedrag aan lesgeld dat op grond
      van [artikel 5, tweede lid, van de wet][ref1] voor de lesgeldplichtige is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004188#Artikel5
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004188
        artikel: '5'
  - number: '17.2'
    text: |-
      Het cursusgeld voor het cursusjaar 2021–2022 wordt verminderd met 50 procent van het bedrag aan cursusgeld dat op
      grond van [artikel 15][ref1] voor de cursusgeldplichtige is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011400#Artikel15
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0011400
        artikel: '15'
        hoofdstuk: '3'
  - number: '18.1'
    text: Het Uitvoeringsbesluit Les- en cursusgeldwet wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel18
  - number: '18.2'
    text: |-
      In afwijking van het eerste lid blijven de hoofdstukken van het Uitvoeringsbesluit Les- en cursusgeldwet van
      kracht tot het tijdstip van inwerkingtreding van de overeenkomstige hoofdstukken van het Uitvoeringsbesluit Les- en
      cursusgeldwet 2000.
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel18
  - number: '19'
    text: |-
      Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip. Bij koninklijk besluit kan een
      ander tijdstip worden vastgesteld waarop de verschillende hoofdstukken of onderdelen daarvan in werking treden.
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel19
  - number: '20'
    text: Dit besluit wordt aangehaald als «Uitvoeringsbesluit Les- en cursusgeldwet 2000».
    url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#Artikel20
