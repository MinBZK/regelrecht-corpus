preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Onderwijs, Cultuur en Wetenschappen, van 5 april 2000, nr. WJZ/2000/11620
    (1711), directie Wetgeving en Juridische Zaken, gedaan mede namens Onze Minister van Landbouw, Natuurbeheer en
    Visserij;

    Gelet op de artikelen 4, derde en vierde lid, 5, vierde lid, en 6, vierde en vijfde lid, van de Les- en
    cursusgeldwet;

    De Raad van State gehoord (advies van 4 mei 2000, nr. W05.00.0145/III);

    Gezien het nader rapport van Onze Minister van Onderwijs, Cultuur en Wetenschappen van 26 mei, nr. 2000/21484
    (1711), directie Wetgeving en Juridische Zaken, uitgebracht mede namens Onze Minister van Landbouw, Natuurbeheer
    en Visserij;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0011400/2021-08-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder: **cursist**: degene die een opleiding volgt als bedoeld in
      [artikel 15, eerste lid][ref1], **cursusgeld:**krachtens [artikel 15][ref2] vastgesteld bedrag,
      **cursusgeldplichtige**: cursist of indien deze minderjarig is, de wettelijke vertegenwoordiger, **lesgeld**:
      krachtens [artikel 5, tweede lid, van de wet][ref3] voor het desbetreffende schooljaar vastgestelde bedrag,
      **lesgeldplichtige**: degene die krachtens de wet lesgeld is verschuldigd, **onderwijsovereenkomst:**
      onderwijsovereenkomst, bedoeld in [artikel 8.1.3 van de Wet educatie en beroepsonderwijs][ref4],
      **schooljaar**: tijdvak van 1 augustus tot en met 31 juli daaropvolgend, **teldatum**: bij of
      krachtens de [Wet op het voortgezet onderwijs][ref5], de [Wet educatie en beroepsonderwijs][ref6] of de
      [Experimentenwet onderwijs][ref7] aangewezen tijdstip in het schooljaar waarop ten behoeve van de bekostiging uit
      's Rijks kas het aantal leerlingen van een dagschool wordt vastgesteld, **wet**: [Les- en cursusgeldwet][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0011400#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0011400#Artikel15
