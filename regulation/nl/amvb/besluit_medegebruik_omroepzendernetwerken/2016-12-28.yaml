  - number: '4'
    text: >-
      De gegevens die worden verstrekt met het oog op het kunnen indienen van een verzoek tot medegebruik en de gegevens
      die worden verstrekt in het kader van een verzoek tot medegebruik, mogen door degene aan wie de gegevens zijn
      verstrekt slechts worden gebruikt voor het doel waarvoor de gegevens zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0015153/2016-12-28#Artikel4
