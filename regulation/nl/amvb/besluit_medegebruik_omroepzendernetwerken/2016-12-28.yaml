articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. wet: [Telecommunicatiewet][ref1];

      b. houder: houder van een vergunning voor het gebruik van frequentieruimte die is bestemd voor het verspreiden
      van programma's alsmede degene die in opdracht van die houder door middel van zijn openbaar elektronisch
      communicatienetwerk dat bestaat uit radioapparaten die geschikt zijn voor het verspreiden van programma's een
      programma verspreidt;

      c. verzoek tot medegebruik: een schriftelijk verzoek tot medegebruik als bedoeld in
      [artikel 3.24, vierde lid, van de wet][ref2];

      d. verzoeker: een houder, die een schriftelijk verzoek tot medegebruik bij een andere houder heeft ingediend;

      e. ontvanger: een houder, die een schriftelijk verzoek tot medegebruik heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0009950
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Artikel3.24
    url: https://wetten.overheid.nl/BWBR0015153/2016-12-28#Artikel1
