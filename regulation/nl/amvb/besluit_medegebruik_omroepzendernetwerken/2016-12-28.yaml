        artikel: '3.24'
  - number: '2'
    text: >-
      1 Een ontvanger beslist binnen twee weken na de datum van ontvangst van een verzoek tot medegebruik of aan het
      verzoek kan worden voldaan. De beslissing is schriftelijk en berust op een deugdelijke motivering, welke bij de
      bekendmaking van de beslissing aan de verzoeker wordt medegedeeld.


      2 Indien onvoldoende gegevens zijn verstrekt voor de beoordeling van het verzoek tot medegebruik, brengt de
      ontvanger binnen een week na ontvangst van het verzoek de verzoeker hiervan schriftelijk op de hoogte. De ontvanger
      geeft daarbij aan welke gegevens ontbreken en geeft daarbij een deugdelijke motivering waarom de onbrekende
      gegevens noodzakelijk zijn voor de beslissing op het verzoek tot medegebruik.


      3 De verzoeker dient de ontbrekende gegevens als bedoeld in het tweede lid binnen twee weken aan de ontvanger te
      verstrekken. De termijn, bedoeld in het eerste lid, wordt opgeschort met ingang van de dag na de datum waarop de
      ontvanger de verzoeker schriftelijk op de hoogte heeft gesteld van het ontbreken van gegevens tot de dag waarop de
      ontbrekende gegevens door de ontvanger zijn ontvangen.


      4 Indien de ontbrekende gegevens niet zijn verstrekt binnen de termijn, bedoeld in het derde lid, kan de ontvanger
      besluiten het verzoek tot medegebruik niet verder te behandelen.


      5 De ontvanger kan de termijn, bedoeld in het eerste lid, eenmaal met een week verlengen. Van de verlenging wordt
      schriftelijk mededeling gedaan aan de verzoeker.


      6 Bij ministeriële regeling worden nadere regels gesteld met betrekking tot gegevens die door de verzoeker moeten
      worden overgelegd bij de indiening van een verzoek tot medegebruik.
    url: https://wetten.overheid.nl/BWBR0015153/2016-12-28#Artikel2
  - number: '3'
    text: |-
      1 Een houder verstrekt op verzoek van een andere houder, teneinde deze in staat te stellen een verzoek tot
      medegebruik in te dienen, binnen twee weken na ontvangst van het verzoek, de daartoe benodigde gegevens. Bij
      ministeriële regeling worden nadere regels gesteld met betrekking tot de te verstrekken gegevens.

      2 Het verzoek als bedoeld in het eerste lid wordt, gelet op de aanwezige behoefte tot medegebruik, beperkt tot een
      bepaald antenne-opstelpunt dan wel de antenne-opstelpunten in een nader aangeduid deel van het land. Daarbij wordt,
      indien dit reeds mogelijk is, aangegeven wat voor soort medegebruik met betrekking tot het desbetreffende antenne-
      opstelpunt dan wel de desbetreffende antenne-opstelpunten wordt gewenst.

      3 In het geval, bedoeld in [artikel 2, tweede lid][ref1], waarbij door de ontvanger aan de verzoeker is medegedeeld
      dat deze onvoldoende gegevens heeft verstrekt om een beslissing op het verzoek tot medegebruik te nemen, is
      de ontvanger verplicht aan de verzoeker die informatie betreffende het antenne-opstelpunt, het antennesysteem
      of de antenne waarop het verzoek tot medegebruik betrekking heeft, te verstrekken, die noodzakelijk is voor de
      verzoeker om op redelijke wijze aan het verzoek tot het verstrekken van de ontbrekende gegevens als bedoeld in
      [artikel 2, tweede lid][ref2], te kunnen voldoen. De gegevens dienen gelijktijdig te worden verstrekt bij de
      mededeling als bedoeld in [artikel 2, tweede lid][ref3], eerste volzin.

      4 Tot de informatie, bedoeld in het derde lid, behoort in ieder geval:

      a. een overzicht van de beschikbare ruimte op de betreffende antenne-opstelpunten en het frequentiebereik van de
      betreffende antennesystemen of antennes, waarbij in elk geval wordt aangegeven of de ruimte, respectievelijk het
      gehele frequentiebereik daadwerkelijk in gebruik dan wel gereserveerd is;

      b. de noodzakelijke technische gegevens van de betreffende antenne-opstelpunten en de daarop aanwezige
      antennesystemen en antennes.

      5 Voor het verstrekken van gegevens als bedoeld in het eerste lid kan een vergoeding op basis van werkelijk
      gemaakte kosten in rekening worden gebracht bij de houder die het verzoek heeft ingediend.

      6 Indien een houder niet voldoet aan een verzoek tot gegevensverstrekking als bedoeld in het eerste lid of de
      ontvanger niet voldoet aan de verplichting tot het verstrekken van de informatie als bedoeld in het derde lid,
      neemt de Autoriteit Consument en Markt op aanvraag van de houder die het verzoek tot gegevensverstrekking heeft
      gedaan onderscheidenlijk de verzoeker als bedoeld in het derde lid een besluit inzake de plicht tot het verstrekken
      van de desbetreffende gegevens. Voor zover het gaat om de verstrekking van gegevens als bedoeld in het derde
      lid, wordt met ingang van de dag na de datum waarop aan de Autoriteit Consument en Markt is verzocht een besluit
      als bedoeld in de eerste volzin te nemen, de termijn, bedoeld in [artikel 2, derde lid][ref4], eerste volzin,
      opgeschort tot de dag waarop door de Autoriteit Consument en Markt een besluit is genomen. De Autoriteit Consument
      en Markt kan bij haar besluit in afwijking van het bepaalde in [artikel 2][ref5] termijnen stellen waarbinnen:

      a. de gegevens, bedoeld in het derde lid, door de ontvanger dienen te worden verstrekt;

      b. de ontbrekende gegevens, bedoeld in [artikel 2, tweede lid][ref6], door de verzoeker aan de ontvanger dienen te
      worden verstrekt.

      7 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot:

      a. de beperking van het verzoek, bedoeld in het tweede lid;

      b. de gegevens, bedoeld in het derde lid;

      c. de vergoeding, bedoeld in het vijfde lid.


