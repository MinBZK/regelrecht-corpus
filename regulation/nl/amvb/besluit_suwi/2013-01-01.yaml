      kosteloos te verstrekken gegevens als bedoeld in [artikel 5.12, eerste lid, onderdelen a, b, c en d][ref1] ,
      afkomstig van de rijksbelastingdienst, en gegevens van de werknemer, die een WGA-uitkering op grond van
      de [Wet WIA][ref2] ontvangt, omtrent het dagloon dat aan de uitkering ten grondslag ligt, de mate van
      arbeidsongeschiktheid uitgedrukt in het arbeidsongeschiktheidspercentage, en de duur van uitkering in verband
      met de uitvoering van de overeenkomsten met werkgevers tot verzekering van het risico van het betalen van premie
      voor de arbeidsongeschiktheidsverzekering op grond van de [Wfsv][ref3] en van de betalingen als gevolg van het
      eigenrisicodragen, bedoeld in [artikel 40, eerste lid, onderdeel b, van de Wfsv][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0019057
      [ref3]: https://wetten.overheid.nl/BWBR0017745
      [ref4]: https://wetten.overheid.nl/BWBR0017745#Artikel40
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel5.13
