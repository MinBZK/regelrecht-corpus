  - number: 2.1.1
    text: |-
      Onze Minister kan een besluit van het UWV of de SVB om andere werkzaamheden dan de in de [Wet SUWI][ref1] bedoelde
      taken uit te voeren uitsluitend goedkeuren, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0013060
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0013060
  - number: 2.1.1.a
    text: de goede uitvoering van de in die wet bedoelde taken daardoor niet in gevaar komt;
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel2.1
  - number: 2.1.1.b
    text: de andere werkzaamheden in opdracht en voor rekening en risico van de opdrachtgever worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel2.1
  - number: 2.1.1.c
    text: |-
      de taakuitoefening van de Inspectie Werk en Inkomen met betrekking tot het toezicht op de uitvoering van de wetten
      door het UWV en de SVB, bedoeld in [artikel 37, onderdeel a, van de Wet SUWI][ref1] voldoende gewaarborgd is;


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel37
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '37'
  - number: 2.1.1.d
    text: |-
      de [Wet op het financieel toezicht][ref1] in acht wordt genomen voor zover deze van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: 2.1.1.e
    text: |-
      de uitvoering van die andere werkzaamheden gescheiden van de uitvoering van de wettelijke taken plaatsvindt, voor
      zover de andere werkzaamheid niet noodzaakt tot een gezamenlijke uitvoering.
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel2.1
  - number: 2.1.2
    text: |-
      Het UWV, onderscheidenlijk de SVB, meldt de werkzaamheden, bedoeld in
      [artikel 5, vierde lid, van de Wet SUWI][ref1], binnen een termijn van vier weken na aanvang van die werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel5
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '5'
  - number: 2.1.3
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de berekening van de prijzen die voor het verrichten van
      andere werkzaamheden in rekening worden gebracht.
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel2.1
  - number: '2.2'
    text: |-
      De resultaten van werkzaamheden in verband met de taakuitoefening, bedoeld in [artikel 9 van de Wet SUWI][ref1],
      worden beoordeeld aan de hand van:


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel9
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '9'
  - number: 2.2.a
    text: voorkoming van uitkeringsinstroom, bij het UWV;
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel2.2
  - number: 2.2.b
    text: juiste en tijdige uitkeringsverstrekking, bij het UWV en de SVB;
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel2.2
  - number: 2.2.c
    text: bevordering uitstroom in relatie tot bemiddeling en re-integratie, bij het UWV;
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel2.2
  - number: 2.2.d
    text: klantgerichtheid, bij het UWV en de SVB;
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel2.2
  - number: 2.2.e
    text: efficiency, bij het UWV en de SVB;
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel2.2
  - number: 2.2.f
    text: ketenprestaties, bij het UWV en colleges van burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel2.2
  - number: 2.3.1
    text: |-
      Geïntegreerde dienstverlening als bedoeld in [artikel 10, eerste lid, van de Wet SUWI][ref1] houdt in dat het UWV
      en de colleges van burgemeester en wethouders in de locaties werk en inkomen gezamenlijk:


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel10
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '10'
  - number: 2.3.1.a
    text: |-
      diensten verlenen op een gemeenschappelijke en herkenbare locatie, die zich naar derden presenteert onder de naam
      werkplein;
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel2.3
  - number: 2.3.1.b
    text: |-
      een structuur creëren waarin de medewerkers op de locatie werk en inkomen gebruik maken van elkaars expertise en
      instrumenten;
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel2.3
  - number: 2.3.1.c
    text: gebruik maken van arbeidsmarktinformatie en arbeidsmarktanalyse;
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel2.3
  - number: 2.3.1.d
    text: |-
      diensten op maat verlenen aan werkzoekenden op het gebied van werk, die voor zover de arbeidsinschakeling daarmee
      bevorderd wordt, bestaan uit diagnosestelling, re-integratie en bemiddeling, waarbij de werkzoekende een vaste
      adviseur heeft die de dienstverlening regisseert;
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel2.3
  - number: 2.3.1.e
    text: |-
      afspraken maken over de wijze waarop in de dienstverlening op het gebied van werk wordt aangesloten op de
      dienstverlening op het gebied van inkomen en, voor zover geen sprake is van gegevensverwerking als bedoeld
      in [artikel 62, tweede lid, van de Wet SUWI][ref1], over de wijze waarop de informatieverstrekking over deze
      dienstverlening via de locatie werk en inkomen en het aanspreekpunt, genoemd in onderdeel d, plaatsvindt;


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel62
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '62'
  - number: 2.3.1.f
    text: |-
      zorg dragen voor eenmalige uitvraag van gegevens die door het UWV en de colleges van burgemeester en
      wethouders verwerkt worden voor de uitvoering van alle taken op het gebied van werk en inkomen, bedoeld in
      [artikel 9 van de Wet SUWI][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel9
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '9'
  - number: 2.3.1.g
    text: |-
      op maat en vraaggericht diensten verlenen aan werkgevers met betrekking tot vacaturevervulling, waarbij de
      werkgever een vaste adviseur heeft die de dienstverlening regisseert.
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel2.3
  - number: 2.3.2
    text: |-
      Het UWV en de colleges van burgemeester en wethouders werken bij hun taken ter bevordering van re-integratie
      en participatie van werkzoekenden in de locaties werk en inkomen in ieder geval samen met uitzendbureaus, re-
      integratiebedrijven, organisaties die betrokken zijn bij de uitvoering van de [Wet sociale werkvoorziening][ref1],
      onderwijsinstellingen en zorginstellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0008903
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0008903
  - number: 2.3.3
    text: |-
      Het UWV en de colleges van burgemeester en wethouders dragen gezamenlijk zorg voor vormgeving van de
      cliëntenparticipatie via de locaties werk en inkomen.
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel2.3
  - number: 2.4.1
    text: |-
      Het UWV wijst in evenwichtig gespreide regio’s locaties werk en inkomen aan, waar vorm wordt gegeven aan regionale
      samenwerking ten behoeve van arbeidsmarktbeleid.
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel2.4
  - number: 2.4.2
    text: |-
      Het college van burgemeester en wethouders van de gemeente waarin een locatie werk en inkomen als bedoeld in
      het eerste lid is gevestigd, draagt zorg voor de totstandkoming, organisatie en ondersteuning van een regionaal
      netwerk van werk, inkomen en scholing, waarin periodiek overleg wordt gevoerd over afstemming van regionale
      arbeidsmarktvraagstukken en uitvoering van regionale arbeidsmarktprojecten.
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel2.4
  - number: 2.4.3
    text: |-
      Aan het regionale netwerk, bedoeld in het tweede lid, wordt in ieder geval deelgenomen door werkgevers of
      vertegenwoordigers daarvan, organisaties van werknemers, instanties als bedoeld in [artikel 2.3, tweede lid][ref1],
      het UWV en alle gemeenten uit de regio. De deelnemers van het regionale netwerk kiezen uit hun midden een
      voorzitter, die de activiteiten van het netwerk coördineert.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel2
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.4.4
    text: |-
      Het UWV en het college van burgemeester en wethouders van de gemeente waarin een locatie werk en inkomen, bedoeld
      in het eerste lid, is gevestigd, dragen zorg voor:
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel2.4
  - number: 2.4.4.a
    text: |-
      uitvoering van regionale taken, waaronder uitvoering van [artikel 30d van de Wet SUWI][ref1] en werkzaamheden,
      bedoeld in [artikel 5, vierde lid, van de Wet SUWI][ref2], en regionale dienstverlening aan werkgevers;


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30d
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel5
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 30d
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '5'
  - number: 2.4.4.b
    text: regionale arbeidsmarktanalyse.
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel2.4
  - number: 2.4.5
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de aanwijzing en spreiding van de locaties werk en
      inkomen als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel2.4
  - number: 2.5.1
    text: |-
      Het UWV en de colleges van burgemeester en wethouders van de gemeenten die bij een locatie werk en inkomen zijn
      betrokken, stellen een gezamenlijk jaarplan op, waarin op basis van een gedeelde arbeidsmarktanalyse, wordt vermeld
      op welke wijze uitwerking wordt gegeven aan [artikel 2.3.][ref1] en in geval van samenwerking in de vorm van een
      regionale werkplein op welke wijze uitwerking wordt gegeven aan [artikel 2.4][ref2]. Het gezamenlijke jaarplan
      wordt bekend gemaakt op een daartoe ingerichte website.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013267#Artikel2
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0013267
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.5.2
    text: |-
      Het UWV en de colleges van burgemeester en wethouders die bij een locatie werk en inkomen zijn betrokken, stellen
      een gezamenlijk jaarverslag op, waarin verantwoording wordt afgelegd over de onderwerpen uit het jaarplan. Het
      gezamenlijke jaarverslag wordt bekend gemaakt op de website, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel2.5
  - number: 2.5.3
    text: |-
      In gezamenlijke tussentijdse verslagen van het UWV en van vertegenwoordigende organisaties van de gemeenten wordt
      gerapporteerd over de behaalde resultaten en de vastgestelde tekortkomingen, en wordt vermeld op welke wijze is
      voldaan aan de invulling van de samenwerking, bedoeld in dit hoofdstuk, en welke verbeteringen in de organisatie
      van de dienstverlening op de locaties werk en inkomen worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel2.5
  - number: 2.5.4
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over het gezamenlijke jaarplan, het gezamenlijke
      jaarverslag en de gezamenlijke tussentijdse verslagen.
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel2.5
  - number: 2.6.1
    text: |-
      Ten behoeve van geïntegreerde dienstverlening dragen het UWV en de colleges van burgemeester en wethouders zorg
      voor de gezamenlijke verwerking van gegevens, bedoeld in [artikel 62, derde lid, van de Wet SUWI][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel62
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '62'
  - number: 2.6.2
    text: |-
      Het UWV en de colleges van burgemeester en wethouders dragen gezamenlijk zorg voor de inrichting van een landelijk
      systeem voor de verwerking van gegevens die betrekking hebben op geïntegreerde dienstverlening aan werkzoekenden
      op het gebied van werk en aan werkgevers in verband met melding van vacatures, en voor het beschikbaar maken van
      informatie voor beleidsvorming, statistiek en management over de inzet van re-integratievoorzieningen.
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel2.6
  - number: 2.6.3
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over de inrichting van het landelijk systeem en de
      gegevensset.
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel2.6
  - number: 3.1.1
    text: 'Het UWV registreert op diens verzoek als werkzoekende:'
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel3.1
  - number: 3.1.1.a
    text: |-
      een vreemdeling die rechtmatig in Nederland verblijft, in de zin van
      [artikel 8, onderdeel b of l, van de Vreemdelingenwet 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.1.1.b
    text: |-
      een vreemdeling die rechtmatig in Nederland verblijft, in de zin van
      [artikel 8, onderdeel a, van de Vreemdelingenwet 2000][ref1], die onvrijwillig werkloos is terwijl het verbod,
      bedoeld in [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref2] nog van toepassing is, mits de vergunning
      tot verblijf het in Nederland verrichten van arbeid niet uitsluit;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0007149#Artikel2
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0007149
        artikel: '2'
  - number: 3.1.1.c
    text: |-
      een vreemdeling die rechtmatig in Nederland verblijf heeft gehouden in de zin van
      [artikel 8, onderdeel a tot en met e, of m, van de Vreemdelingenwet 2000][ref1], mits de vergunning tot verblijf
      het in Nederland verrichten van arbeid niet uitsloot, indien de vreemdeling onvrijwillig werkloos is, en mits hij:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.1.1.c.1°
    text: voor de beëindiging van dit verblijf een aanvraag heeft ingediend om voortgezette toelating, of
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel3.1
  - number: 3.1.1.c.2°
    text: |-
      binnen de termijn, genoemd in [artikel 69, eerste lid, van de Vreemdelingenwet 2000][ref1], of buiten
      die termijn, in geval [artikel 6:11 van de Algemene wet bestuursrecht][ref2] toepassing heeft gevonden,
      bezwaar heeft gemaakt of beroep heeft ingesteld tegen intrekking van de toelating in de zin van
      [artikel 8, onderdeel a tot en met e, of m, van de Vreemdelingenwet 2000][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '69'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 3.1.2
    text: 'De registratie eindigt voor een vreemdeling als bedoeld in het eerste lid, onderdeel c, zodra:'
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel3.1
  - number: 3.1.2.a
    text: onherroepelijk op de aanvraag, het bezwaar of het beroep is beslist, of
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel3.1
  - number: 3.1.2.b
    text: |-
      de uitzetting van de vreemdeling is gelast, tenzij die uitzetting ingevolge de [Vreemdelingenwet 2000][ref1] of op
      grond van een rechterlijke beslissing achterwege dient te blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: 4.1.1
    text: |-
      Bij de toepassing van [artikel 30a, negende lid, van de Wet SUWI][ref1] laat het UWV de werkzaamheden verrichten
      op grond van een schriftelijke overeenkomst waarin in elk geval is geregeld, dat het re-integratiebedrijf verplicht
      is:


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 30a
  - number: 4.1.1.a
    text: |-
      alle gegevens en inlichtingen omtrent deze werkzaamheden op verzoek aan het UWV te verstrekken, voor zover dit
      noodzakelijk is voor de uitvoering van de in de aanhef genoemde wetten;
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.1
  - number: 4.1.1.b
    text: |-
      de persoonlijke levenssfeer van de personen van wie de inschakeling in de arbeid wordt bevorderd, te beschermen
      overeenkomstig een reglement dat aan die personen en het UWV wordt overgelegd;
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.1
  - number: 4.1.1.c
    text: |-
      in geval van een geschil tussen de te re-integreren persoon en het re-integratiebedrijf een klachten- en
      geschillenregeling toe te passen die door het re-integratiebedrijf aan de te re-integreren persoon en de partij met
      wie de in de aanhef bedoelde overeenkomst is gesloten, is overgelegd;
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.1
  - number: 4.1.1.d
    text: |-
      toegang tot en inzage in alle gegevens te verlenen die een accountant naar zijn oordeel nodig heeft voor het
      instellen van een nader onderzoek als bedoeld in [artikel 42, vierde lid, van de Wet SUWI][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel42
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '42'
  - number: 4.1.1.e
    text: |-
      op verzoek aan het UWV een schriftelijk oordeel van een accountant of een gelijkwaardige deskundige over de
      verwerking van informatie en de genomen maatregelen ter beveiliging van informatie door het re-integratiebedrijf
      over te leggen;
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.1
  - number: 4.1.1.f
    text: |-
      de gegevens die het re-integratiebedrijf in verband met deze werkzaamheden verkrijgt uitsluitend te verwerken voor
      zover dat noodzakelijk is voor het verrichten van die werkzaamheden dan wel voor de naleving van verplichtingen als
      bedoeld in de onderdelen a tot en met e;
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.1
  - number: 4.1.1.g
    text: |-
      indien dit re-integratiebedrijf deze werkzaamheden laat verrichten door een ander re-integratiebedrijf in een
      schriftelijke overeenkomst met dat andere re-integratiebedrijf te regelen dat voor dat bedrijf, die persoon of
      dienst de verplichtingen jegens het UWV, bedoeld in de onderdelen a tot en met f, gelden.
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.1
  - number: 4.1.2
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.1
  - number: 4.1.3
    text: |-
      Indien het college van burgemeester en wethouders werkzaamheden, die in het kader van de
      voorzieningen, bedoeld in de [artikelen 7, eerste lid, onderdeel a, en zevende lid, van de WWB][ref1],
      [34, eerste lid, onderdeel a, van de IOAW][ref2] en [artikel 34, eerste lid, onderdeel a, van de IOAZ][ref3],
      worden uitgevoerd, laat uitvoeren door een re-integratiebedrijf is het eerste lid van overeenkomstige toepassing,
      waarbij in de overeenkomst tevens is geregeld, dat het college op verzoek of uit eigen beweging in kennis worden
      gesteld van het gegronde vermoeden dat een persoon voor wie de voorzieningen zijn bestemd, onvoldoende medewerking
      verleent aan deze werkzaamheden, voorzover dit noodzakelijk is voor de uitvoering van genoemde wetten.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0004163#Artikel34
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0004044
        artikel: '34'
      - id: ref3
        bwb_id: BWBR0004163
        artikel: '34'
  - number: 4.2.1
    text: |-
      Het UWV kan ten behoeve van een persoon als bedoeld in
      [artikel 30a, eerste lid, onderdelen a en c, van de Wet SUWI][ref1], met uitzondering van een
      uitkeringsgerechtigde op grond van de [Werkloosheidswet][ref2] tenzij sprake is van een werknemer als bedoeld
      in [artikel 20, zesde lid, onderdeel a, van die wet][ref3] en met uitzondering van een uitkeringsgerechtigde op
      grond van de Wet inkomensvoorziening oudere werklozen, op diens aanvraag een individuele re-integratieovereenkomst
      sluiten met een re-integratiebedrijf, overeenkomstig de voorkeur van de aanvrager, ter uitvoering van werkzaamheden
      die zijn gericht op de inschakeling in het arbeidsproces.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
      [ref2]: https://wetten.overheid.nl/BWBR0004045
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel20
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 30a
      - id: ref2
        bwb_id: BWBR0004045
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '20'
  - number: 4.2.2
    text: |-
      Het UWV bepaalt het ten hoogste aan het re-integratiebedrijf verschuldigde bedrag voor de uitvoering van de
      individuele re-integratieovereenkomst, bedoeld in het eerste lid, en het tijdvak waarvoor de individuele re-
      integratieovereenkomst, bedoeld in het eerste lid, wordt gesloten.
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.2
  - number: 4.2.3
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent de voorwaarden waaronder door het UWV een
      individuele re-integratieovereenkomst als bedoeld in het eerste lid, kan worden gesloten en omtrent de inhoud van
      de individuele re-integratieovereenkomst, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.2
  - number: 4.3.1
    text: |-
      In geval van een toekennende beschikking op een aanvraag als bedoeld in [artikel 4.2, eerste lid][ref1], sluit
      het UWV binnen zes weken na het nemen van die beschikking een overeenkomst met een re-integratiebedrijf dat de in
      artikel 4.2, eerste lid, bedoelde werkzaamheden uitvoert.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 4.3.2
    text: |-
      De persoon ten behoeve van wie een individuele re-integratieovereenkomst als bedoeld in
      [artikel 4.2, eerste lid][ref1], wordt gesloten tekent een exemplaar van die overeenkomst voor gezien en verstrekt
      dit aan het UWV.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '4.4'
    text: |-
      De aanvraag om een individuele re-integratieovereenkomst kan in ieder geval worden geweigerd in de gevallen waarin
      op grond van [artikel 4:35, eerste lid, onderdelen a en b en tweede lid, van de Algemene wet bestuursrecht][ref1]
      een subsidieverlening kan worden geweigerd, en indien niet wordt voldaan aan de krachtens
      [artikel 4.2, derde lid][ref2], door het UWV gestelde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '4.5'
    text: |-
      Onze Minister zendt binnen vier jaar na de inwerkingtreding van de [artikelen 4.2 tot en met 4.4][ref1] aan de
      Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze artikelen in de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '4.7'
    text: 'In deze paragraaf en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.7
  - number: 4.7.a
    text: |-
      arbeidsgehandicapte werknemer: een arbeidsgehandicapte werknemer als bedoeld in
      [artikel 31, eerste lid, van de Wet REA][ref1], zoals deze luidde op de dag voorafgaand aan de
      dag van inwerkingtreding van de [Wet IWIA][ref2], dan wel een werknemer of persoon als bedoeld in
      [artikel 2.7a, eerste lid, van de Wet IWIA][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0019058
      [ref3]: https://wetten.overheid.nl/BWBR0019058#Artikel2
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '31'
      - id: ref2
        bwb_id: BWBR0019058
      - id: ref3
        bwb_id: BWBR0019058
        artikel: '2'
  - number: 4.7.b
    text: |-
      subsidie: een subsidie als bedoeld in [artikel 2.7a, eerste lid, onderdeel a, van de Wet IWIA][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019058#Artikel2
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0019058
        artikel: '2'
  - number: 4.7.c
    text: |-
      subsidie-ontvanger: de arbeidsgehandicapte werknemer aan wie een subsidie is verstrekt als bedoeld in
      [artikel 2.7a, eerste lid, onderdeel a, van de Wet IWIA][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019058#Artikel2
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0019058
        artikel: '2'
  - number: 4.7.d
    text: |-
      persoonsgebonden reïntegratie-overeenkomst: een overeenkomst als bedoeld in
      [artikel 2.7a, eerste lid, onderdeel b, van de Wet IWIA][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019058#Artikel2
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0019058
        artikel: '2'
  - number: 4.7.e
    text: |-
      begunstigde: de arbeidsgehandicapte werknemer ten behoeve van wie een overeenkomst is gesloten als bedoeld in
      [artikel 2.7a, eerste lid, onderdeel b, van de Wet IWIA][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019058#Artikel2
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0019058
        artikel: '2'
  - number: 4.7.f
    text: |-
      Wet IWIA: [Wet Invoering en financiering Wet werk en inkomen naar arbeidsvermogen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019058
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0019058
  - number: 4.8.1
    text: |-
      Het UWV kan op een aanvraag als bedoeld in [artikel 2.7a van de Wet IWIA][ref1] een subsidie verstrekken
      ter voldoening van de noodzakelijk te maken kosten van werkzaamheden die zijn gericht op behoud, herstel of
      bevordering van mogelijkheden tot het verrichten van arbeid, waaronder begrepen het behouden en verkrijgen van een
      dienstbetrekking, of een persoonsgebonden re-integratieovereenkomst sluiten ter uitvoering van die werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0019058#Artikel2
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0019058
        artikel: '2'
  - number: 4.8.2
    text: 'Onder werkzaamheden als bedoeld in het eerste lid worden uitsluitend verstaan:'
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.8
  - number: 4.8.2.a
    text: begeleiding en advisering;
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.8
  - number: 4.8.2.b
    text: opleiding;
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.8
  - number: 4.8.2.c
    text: |-
      arbeidsbemiddeling en andere werkzaamheden die, in aansluiting op de onder a en b bedoelde werkzaamheden, zijn
      gericht op behoud, herstel of bevordering van mogelijkheden tot het verrichten van arbeid.
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.8
  - number: 4.8.3
    text: |-
      Kosten van werkzaamheden die niet zijn beschreven in het in [artikel 4.10, onderdeel b][ref1], bedoelde trajectplan
      komen niet voor subsidiëring in aanmerking en ter uitvoering van die werkzaamheden wordt geen persoonsgebonden re-
      integratieovereenkomst gesloten, tenzij het UWV voor het verrichten van die werkzaamheden schriftelijk goedkeuring
      heeft verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '4.9'
    text: |-
      Bij de aanvraag, bedoeld in [artikel 2.7a van de Wet IWIA][ref1], vermeldt de aanvrager of zijn aanvraag betrekking
      heeft op verstrekking van subsidie dan wel het sluiten van een persoonsgebonden re-integratieovereenkomst door
      het UWV.


      [ref1]: https://wetten.overheid.nl/BWBR0019058#Artikel2
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.9
    references:
      - id: ref1
        bwb_id: BWBR0019058
        artikel: '2'
  - number: '4.10'
    text: 'Het UWV kan uitsluitend een subsidie verstrekken of een persoonsgebonden re-integratieovereenkomst sluiten indien:'
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.10
  - number: 4.10.a
    text: |-
      de aanvraag wordt ingediend binnen zes weken nadat het oordeel van het UWV omtrent de aanwezigheid
      van passende arbeid in het bedrijf van zijn werkgever of in een ander bedrijf, als bedoeld in
      [artikel 2.7a, tweede lid, van de Wet IWIA][ref1], aan de arbeidsgehandicapte werknemer bekend is gemaakt;


      [ref1]: https://wetten.overheid.nl/BWBR0019058#Artikel2
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0019058
        artikel: '2'
  - number: 4.10.b
    text: |-
      de aanvraag vergezeld gaat van een door of namens de werknemer opgesteld trajectplan waarin in elk geval zijn
      opgenomen:
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.10
  - number: 4.10.b.1°
    text: |-
      het opleidingsniveau en het burgerservicenummer of, bij het ontbreken daarvan, het sociaal-fiscaalnummer van de
      arbeidsgehandicapte werknemer;
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.10
  - number: 4.10.b.2°
    text: |-
      een beschrijving van de werkzaamheden die de aanvrager op grond van
      [artikel 2.7a, eerste lid, van de Wet IWIA][ref1] zal laten verrichten;


      [ref1]: https://wetten.overheid.nl/BWBR0019058#Artikel2
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0019058
        artikel: '2'
  - number: 4.10.b.3°
    text: |-
      de verwachte begin- en einddatum van de werkzaamheden, bedoeld in [artikel 2.7a van de Wet IWIA][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019058#Artikel2
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0019058
        artikel: '2'
  - number: 4.10.b.4°
    text: de beroepsactiviteiten die de aanvrager naar verwachting na afloop van die periode kan vervullen;
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.10
  - number: 4.10.b.5°
    text: |-
      een begroting van de kosten van de in [artikel 4.8][ref1] bedoelde werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.11.1
    text: |-
      De werkgever vergoedt aan het UWV 50 procent van de kosten die door het re-integratiebedrijf aan het UWV in
      rekening worden gebracht voor het verrichten van werkzaamheden ter uitvoering van de persoonsgebonden re-
      integratieovereenkomst, tenzij de arbeidsgehandicapte werknemer binnen drie maanden nadat de werkzaamheden ter
      uitvoering van de persoonsgebonden re-integratieovereenkomst zijn geëindigd een dienstbetrekking met een andere
      werkgever is aangegaan en deze arbeidsgehandicapte werknemer voor een aaneengesloten periode van ten minste 26
      weken daadwerkelijk in dienstbetrekking met deze andere werkgever heeft gestaan of met die arbeid in een periode
      van één jaar ten minste gedurende 26 weken inkomsten heeft verworven waardoor hij geen recht meer heeft op
      een uitkering anders dan een arbeidsongeschiktheidsuitkering in verband met het verwerven van die inkomsten of
      verrichten van die arbeid.
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.11
  - number: 4.11.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing indien de werknemer voor het verrichten van de werkzaamheden een
      subsidie als bedoeld in deze paragraaf heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.11
  - number: 4.11.3
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.11
  - number: 4.12.1
    text: Op de aanvraag om een subsidie wordt een beschikking omtrent subsidieverlening gegeven.
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.12
  - number: 4.12.2
    text: |-
      In de subsidievoorwaarden bij een beschikking als bedoeld in het eerste lid wordt in elk geval opgenomen dat in een
      overeenkomst die de subsidie-ontvanger met een re-integratiebedrijf sluit wordt geregeld:
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.12
  - number: 4.12.2.a
    text: |-
      de duur van de overeenkomst alsmede de hoogte van de kosten die door het re-integratiebedrijf in rekening zullen
      worden gebracht;
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.12
  - number: 4.12.2.b
    text: dat de overeenkomst door beide partijen wegens gewichtige redenen tussentijds door opzegging kan worden beëindigd;
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.12
  - number: 4.12.2.c
    text: 'dat het re-integratiebedrijf verplicht is:'
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.12
  - number: 4.12.2.c.1º
    text: |-
      toegang tot en inzage in alle gegevens te verlenen die een accountant naar zijn oordeel nodig heeft voor het
      instellen van een nader onderzoek als bedoeld in [artikel 42, vierde lid, van de Wet SUWI][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel42
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.12
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '42'
  - number: 4.12.2.c.2º
    text: |-
      de persoonlijke levenssfeer van de personen van wie de inschakeling in de arbeid wordt bevorderd, te beschermen
      overeenkomstig een reglement dat aan die personen en de werkgever wordt overgelegd;
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.12
  - number: 4.12.2.c.3º
    text: |-
      in geval van een geschil tussen de te re-integreren persoon en het re-integratiebedrijf een klachten- en
      geschillenregeling toe te passen die door het re-integratiebedrijf aan de te re-integreren persoon en de werkgever
      is overgelegd;
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.12
  - number: 4.12.2.c.4º
    text: |-
      op verzoek aan de werkgever een schriftelijk oordeel van een accountant of een gelijkwaardige deskundige over de
      verwerking van informatie en de genomen maatregelen ter beveiliging van informatie door het re-integratiebedrijf
      over te leggen;
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.12
  - number: 4.12.2.c.5º
    text: |-
      de gegevens die het re-integratiebedrijf in verband met deze werkzaamheden verkrijgt uitsluitend te verwerken
      voorzover dat noodzakelijk is voor het verrichten van die activiteiten of werkzaamheden dan wel voor de naleving
      van verplichtingen als bedoeld in de subonderdelen 1° tot en met 4°;
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.12
  - number: 4.12.2.c.6º
    text: |-
      indien dit re-integratiebedrijf deze werkzaamheden laat verrichten door een ander re-integratiebedrijf, in een
      schriftelijke overeenkomst met dat andere re-integratiebedrijf te regelen dat voor dat bedrijf de verplichtingen,
      bedoeld in de subonderdelen 1° tot en met 6°, gelden;
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.12
  - number: 4.12.2.d
    text: |-
      dat het re-integratiebedrijf aan het UWV op verzoek of na toestemming van de subsidie-ontvanger uit eigen beweging
      gegevens verstrekt over de besteding van de subsidie.
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.12
  - number: 4.12.3
    text: Bij ministeriële regeling kunnen regels worden gesteld omtrent het tweede lid.
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.12
  - number: 4.13.1
    text: De subsidie bedraagt ten hoogste een bij ministeriële regeling vastgesteld bedrag.
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.13
  - number: 4.13.2
    text: |-
      De subsidie wordt verleend voor werkzaamheden als bedoeld in [artikel 4.8][ref1] gedurende een tijdvak van ten
      hoogste een jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.13
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.13.3
    text: |-
      Indien de aanvrager van een subsidie of de subsidie-ontvanger aantoont dat de noodzakelijke kosten van de
      werkzaamheden die zijn gericht op behoud, herstel of bevordering van mogelijkheden tot het verrichten van arbeid
      hoger zijn dan het in het eerste lid bedoelde bedrag of die werkzaamheden langer zullen duren dan een tijdvak van
      een jaar, kan subsidie worden verleend voor een hoger bedrag of een langere periode.
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.13
  - number: 4.13.4
    text: |-
      De in het derde lid bedoelde bevoegdheid bestaat uitsluitend indien het in het eerste lid bedoelde bedrag of de in
      het tweede lid bedoelde werkzaamheden gedurende een tijdvak van een jaar redelijkerwijs niet zullen kunnen leiden
      tot behoud, herstel of bevordering van mogelijkheden tot het verrichten van arbeid.
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.13
  - number: 4.14.1
    text: |-
      Het UWV kan aan de subsidie-ontvanger voorschotten op de vast te stellen subsidie verlenen aan de hand van aan het
      UWV overgelegde declaraties voor de werkzaamheden, die voortvloeien uit het trajectplan.
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.14
  - number: 4.14.2
    text: |-
      Indien het UWV besluit tot het verlenen van voorschotten, betaalt het UWV de voorschotten binnen één week na het
      nemen van dat besluit aan de subsidie-ontvanger of aan het re-integratiebedrijf, waarmee de subsidie-ontvanger een
      overeenkomst heeft gesloten.
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.14
  - number: 4.15.1
    text: |-
      De subsidie-ontvanger dient iedere drie maanden bij het UWV een rapportage in waarin een beschrijving is opgenomen
      van de ten behoeve van de subsidie-ontvanger verrichte werkzaamheden, bedoeld in [artikel 4.8][ref1]. In de
      rapportage worden in ieder geval de resultaten van de uitvoering van het trajectplan en de prognose voor de
      resterende periode van het traject beschreven en wordt een overzicht gegeven van de tot op dat moment gemaakte
      kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.15
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.15.2
    text: |-
      De subsidie-ontvanger verstrekt onverwijld en uit eigen beweging alle gegevens en inlichtingen omtrent voortijdige
      beëindiging van gesubsidieerde trajecten aan het UWV.
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.15
  - number: 4.15.3
    text: |-
      De subsidie-ontvanger verstrekt op verzoek aan het UWV alle gegevens en inlichtingen die van belang zijn voor de
      vaststelling van de rechtmatigheid en doelmatigheid van de uitvoering van [artikel 2.7a van de Wet IWIA][ref1],
      alsmede binnen vier weken alle hem betreffende informatie die noodzakelijk is voor de evaluatie van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0019058#Artikel2
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.15
    references:
      - id: ref1
        bwb_id: BWBR0019058
        artikel: '2'
  - number: '4.16'
    text: |-
      De subsidie-ontvanger dient binnen zes weken na afloop van het tijdvak waarvoor de subsidie is verleend een
      aanvraag tot vaststelling van de subsidie in.
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.16
  - number: 4.17.1
    text: |-
      In geval van een toekennende beschikking op een aanvraag om een persoonsgebonden re-integratieovereenkomst, sluit
      het UWV binnen zes weken na het nemen van die beschikking een overeenkomst met een re-integratiebedrijf dat de in
      [artikel 4.8][ref1] bedoelde werkzaamheden uitvoert.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.17
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.17.2
    text: |-
      Het UWV sluit een overeenkomst met een re-integratiebedrijf als bedoeld in het eerste lid overeenkomstig de
      voorkeur voor een re-integratiebedrijf van de aanvrager of begunstigde.
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.17
  - number: '4.18'
    text: |-
      Het sluiten van een persoonsgebonden re-integratieovereenkomst kan in ieder geval worden geweigerd in de gevallen,
      bedoeld in [artikel 4:35 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.18
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 4.19.1
    text: |-
      Het door het UWV aan het re-integratiebedrijf verschuldigde bedrag voor de uitvoering van de persoonsgebonden re-
      integratieovereenkomst bedraagt ten hoogste een bij ministeriële regeling vastgesteld bedrag.
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.19
  - number: 4.19.2
    text: De persoonsgebonden re-integratieovereenkomst wordt gesloten voor een tijdvak van ten hoogste een jaar.
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.19
  - number: 4.19.3
    text: |-
      Indien de aanvrager van een persoonsgebonden re-integratieovereenkomst of begunstigde aantoont dat de noodzakelijke
      kosten van de in [artikel 4.8][ref1] bedoelde werkzaamheden hoger zijn dan het in het eerste lid bedoelde bedrag of
      die werkzaamheden langer zullen duren dan een tijdvak van een jaar, kan een overeenkomst worden gesloten voor een
      hoger bedrag of een langere periode.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.19
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.19.4
    text: |-
      De in het derde lid bedoelde bevoegdheid bestaat uitsluitend indien het in het eerste lid bedoelde bedrag of de in
      het derde lid bedoelde werkzaamheden gedurende een tijdvak van een jaar redelijkerwijs niet zullen kunnen leiden
      tot behoud, herstel of bevordering van mogelijkheden tot het verrichten van arbeid.
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.19
  - number: 4.20.1
    text: 'In de persoonsgebonden re-integratieovereenkomst wordt in elk geval geregeld:'
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.20
  - number: 4.20.1.a
    text: |-
      de duur van de overeenkomst alsmede de hoogte van de kosten die door het re-integratiebedrijf in rekening zullen
      worden gebracht;
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.20
  - number: 4.20.1.b
    text: |-
      dat het re-integratiebedrijf iedere drie maanden bij het UWV een rapportage indient waarin een beschrijving
      is opgenomen van de werkzaamheden die zijn verricht ten behoeve van het behoud, herstel of bevordering van
      mogelijkheden tot het verrichten van arbeid van de arbeidsgehandicapte werknemer. In de rapportage worden tevens de
      resultaten van de uitvoering van het trajectplan, bedoeld in [artikel 4.10, onderdeel b][ref1], en de prognose voor
      de resterende periode van het traject beschreven en wordt een overzicht gegeven van de tot op dat moment gemaakte
      kosten;


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.20
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.20.1.c
    text: dat de overeenkomst door beide partijen wegens gewichtige redenen tussentijds door opzegging kan worden beëindigd;
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.20
  - number: 4.20.1.d
    text: |-
      dat de prijs voor de overeenkomst uitsluitend wordt betaald voor die werkzaamheden, die zijn beschreven in
      het in [artikel 4.10, onderdeel b][ref1], bedoelde trajectplan, tenzij het UWV voor het verrichten van andere
      werkzaamheden schriftelijk goedkeuring heeft verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.20
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.20.1.e
    text: |-
      dat het re-integratiebedrijf voldoet aan verplichtingen als bedoeld in
      [artikel 4.12, eerste lid, onderdeel c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.20
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.20.1.f
    text: |-
      dat het re-integratiebedrijf aan het UWV op verzoek of na toestemming van de subsidie-ontvanger uit eigen beweging
      gegevens verstrekt over de uitvoering van de overeenkomst.
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.20
  - number: 4.20.2
    text: Bij ministeriële regeling kunnen regels worden gesteld omtrent het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel4.20
  - number: 5.1.1
    text: |-
      In de polisadministratie worden van de werknemer of de persoon die vrijwillig verzekerd is voor de [ZW][ref1], de
      [Wet WIA][ref2], de [WW][ref3] en de [WAO][ref4] de volgende gegevens verwerkt:


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0019057
      [ref3]: https://wetten.overheid.nl/BWBR0004045
      [ref4]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0019057
      - id: ref3
        bwb_id: BWBR0004045
      - id: ref4
        bwb_id: BWBR0002524
  - number: 5.1.1.a
    text: |-
      *adresgegevens*: straatnaam, huisnummer, huisnummertoevoeging, postcode, woonplaats, gemeentenaam,
      woonobjectverwijzing en locatieomschrijving;
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel5.1
  - number: 5.1.1.b
    text: '*postbusadresgegevens*: postbusnummer, postcode, woonplaats, gemeentenaam en locatieomschrijving;'
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel5.1
  - number: 5.1.1.c
    text: |-
      *buitenlandse adresgegevens*: straatnaam, huisnummer, huisnummertoevoeging, postcode, woonplaats,
      locatieomschrijving, regionaam en landcode ISO;
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel5.1
  - number: 5.1.1.d
    text: '*sociaal verzekeringsnummer buitenland*: verzekeringsnummer en landcode ISO;'
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel5.1
  - number: 5.1.1.e
    text: |-
      *persoonsgegevens*: namen, burgerservicenummer of, bij het ontbreken daarvan, sociaal-fiscaalnummer, het
      administratienummer, bedoeld in de [Wet gemeentelijke basisadministratie persoonsgegevens][ref1] (A-nummer),
      geboortedatum, overlijdensdatum, geslacht, burgerlijke staat, leefvorm, nationaliteit, verblijfstitel, datum
      vertrek uit Nederland, indicatie curatelestelling en indicatie voor informatiebeveiliging;


      [ref1]: https://wetten.overheid.nl/BWBR0006723
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0006723
  - number: 5.1.1.f
    text: '*ontheffing wegens gemoedsbezwaren*;'
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel5.1
  - number: 5.1.1.g
    text: |-
      *verzekeringsplicht werknemersverzekeringen*: gegevens inzake de vaststelling verzekeringsplicht, indicaties
      verzekerd en premies voor de werknemersverzekeringen;
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel5.1
  - number: 5.1.1.h
    text: |-
      *gegevens over de werkgever in de zin van de Wfsv en de inhoudingsplichtige in de zin van de Wet op de
      loonbelasting 1964*: naam en loonheffingennummer;
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel5.1
  - number: 5.1.1.i
    text: |-
      *gegevens over de inkomstenverhouding*: personeelsnummer, soort inkomstenverhouding, collectieve
      arbeidsovereenkomst, risicopremiegroep, sector, datum begin en einde van inkomstenverhouding, reden einde
      inkomstenverhouding en code invloed verzekeringsplicht;
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel5.1
  - number: 5.1.1.j
    text: |-
      *loongerelateerde gegevens*: lonen, aantal SV-dagen, aantal verloonde uren, ingehouden loonbelasting en
      premie volksverzekeringen, inkomensafhankelijke bijdrage als bedoeld in [artikel 41 van de ZVW][ref1],
      verzekeringssituatie [ZVW][ref2], andere gegevens van belang voor de heffing van inkomstenbelasting en toegepaste
      kortingen.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '41'
      - id: ref2
        bwb_id: BWBR0018450
  - number: 5.1.2
    text: |-
      In aanvulling op het eerste lid kunnen tevens bij regeling van Onze Minister, in overeenstemming met Onze Minister
      van Financiën, aan te wijzen gegevens worden verwerkt die afkomstig zijn van een werkgever in de zin van de
      [Wfsv][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017745
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0017745
  - number: 5.2.1
    text: |-
      In [bijlage I][ref1] bij dit besluit wordt voor de polisadministratie een overzicht gegeven van de opgenomen
      gegevens, voor welk doel die gegevens worden verwerkt en hoe die gegevens worden verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0013267
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0013267
  - number: 5.2.2
    text: |-
      [Bijlage I][ref1] kan bij regeling van Onze Minister, in overeenstemming met Onze Minister van Financiën, en na
      overleg met het Centraal bureau voor de statistiek, worden gewijzigd, voorzover deze wijziging geen wijziging tot
      gevolg heeft van de lijst van gegevens in [artikel 5.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013267
      [ref2]: https://wetten.overheid.nl/BWBR0013267#Artikel5
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0013267
      - id: ref2
        bwb_id: BWBR0013267
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.2a.1
    text: |-
      In [bijlage II][ref1] bij dit besluit wordt vermeld welke soort gegevens op grond van de
      [artikelen 33a, tweede lid][ref2], en [35, vijfde lid, van de Wet SUWI][ref3], [14, eerste lid, van de IOAW][ref4],
      [14, eerste lid, van de IOAZ][ref5] en [53a, eerste lid, van de WWB][ref6] niet van de belanghebbende worden
      verkregen en uit welke bron deze gegevens afkomstig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0013267
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel33a
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0004044#Artikel14
      [ref5]: https://wetten.overheid.nl/BWBR0004163#Artikel14
      [ref6]: https://wetten.overheid.nl/BWBR0015703#Artikel53a
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel5.2a
    references:
      - id: ref1
        bwb_id: BWBR0013267
      - id: ref2
        bwb_id: BWBR0013060
        artikel: 33a
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '35'
      - id: ref4
        bwb_id: BWBR0004044
        artikel: '14'
      - id: ref5
        bwb_id: BWBR0004163
        artikel: '14'
      - id: ref6
        bwb_id: BWBR0015703
        artikel: 53a
  - number: 5.2a.2
    text: |-
      Het UWV informeert de belanghebbende over de soort gegevens, bedoeld in het eerste lid, op het moment dat hij een
      aanvraag als bedoeld in [artikel 30c, eerste lid, van de Wet SUWI][ref1] dan wel een aanvraag voor een uitkering
      als bedoeld in [artikel 30, eerste lid, van de Wet SUWI][ref2] indient.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30c
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel5.2a
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 30c
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '30'
  - number: 5.2a.3
    text: |-
      Bij ministeriële regeling kan worden bepaald, dat tot een in die regeling genoemd tijdstip bepaalde onderdelen van
      [bijlage II][ref1] voor bepaalde bestuursorganen met betrekking tot bepaalde taken niet van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0013267
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel5.2a
    references:
      - id: ref1
        bwb_id: BWBR0013267
  - number: 5.2a.4
    text: |-
      Bij regeling van Onze Minister, voor zover het gegevens betreft die afkomstig zijn van de rijksbelastingdienst
      in overeenstemming met Onze Minister van Financiën, wordt nader bepaald voor welke gegevens het eerste lid van
      toepassing is.
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel5.2a
  - number: 5.2b.1
    text: |-
      Indien een betrokkene op wie de gegevens betrekking hebben bij het indienen van de aanvraag, bedoeld
      in [artikel 30c, eerste lid, van de Wet SUWI][ref1] dan wel een aanvraag voor een uitkering als
      bedoeld in [artikel 30, eerste lid, van de Wet SUWI][ref2], op grond van de informatie, bedoeld in
      [artikel 5.2a, tweede lid][ref3], vaststelt, dat de gegevens niet juist of niet volledig zijn, kan hij het UWV dan
      wel het desbetreffende college van burgemeester en wethouders verzoeken bij de uitvoering van gegevensverwerking
      als bedoeld in [artikel 62 van de Wet SUWI][ref4] zorg te dragen voor verbetering, aanvulling of verwijdering van
      deze gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30c
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0013267#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0013060#Artikel62
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel5.2b
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 30c
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '30'
      - id: ref3
        bwb_id: BWBR0013267
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.1a
      - id: ref4
        bwb_id: BWBR0013060
        artikel: '62'
  - number: 5.2b.2
    text: |-
      Indien het UWV en de colleges van burgemeester en wethouders voor de verwerking van die gegevens geen
      verantwoordelijke in de zin van de [Wet bescherming persoonsgegevens][ref1] zijn, wordt het verzoek onverwijld
      gezonden naar de verantwoordelijk in de zin van de [Wet bescherming persoonsgegevens][ref2] om dit aan te merken
      als een verzoek als bedoeld in [artikel 36 van de Wet bescherming persoonsgegevens][ref3] of een daarmee op grond
      van de toepasselijke wetgeving gelijk te stellen verzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0011468
      [ref2]: https://wetten.overheid.nl/BWBR0011468
      [ref3]: https://wetten.overheid.nl/BWBR0011468#Artikel36
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel5.2b
    references:
      - id: ref1
        bwb_id: BWBR0011468
      - id: ref2
        bwb_id: BWBR0011468
      - id: ref3
        bwb_id: BWBR0011468
        artikel: '36'
  - number: 5.2b.3
    text: Bij het desbetreffende gegeven wordt aangetekend, dat het gegeven in onderzoek is.
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel5.2b
  - number: '5.3'
    text: |-
      De melding, bedoeld in [artikel 61 van de Wet SUWI][ref1], geschiedt kosteloos.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel61
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '61'
  - number: '5.4'
    text: |-
      Het UWV, de SVB en de colleges van burgemeester en wethouders zijn bevoegd uit eigen beweging
      en verplicht op verzoek uit de onder hun verantwoordelijkheid gevoerde administraties voor
      de taken, bedoeld in [artikel 62, eerste lid, van de Wet SUWI][ref1] kosteloos aan de door
      Onze Minister aangewezen ambtenaren, die zijn belast met het toezicht op de naleving van de
      [Wet arbeid vreemdelingen][ref2], de [Arbeidsomstandighedenwet][ref3], de [Arbeidstijdenwet][ref4], de
      [Wet allocatie arbeidskrachten door intermediairs][ref5], de [Wet minimumloon en minimumvakantiebijslag][ref6], de
      [Wet op de loonvorming][ref7] en de [Wet gelijke behandeling mannen en vrouwen][ref8] gegevens te verstrekken die
      noodzakelijk zijn voor het toezicht op de naleving en de uitvoering van die wetten.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0007149
      [ref3]: https://wetten.overheid.nl/BWBR0010346
      [ref4]: https://wetten.overheid.nl/BWBR0007671
      [ref5]: https://wetten.overheid.nl/BWBR0009616
      [ref6]: https://wetten.overheid.nl/BWBR0002638
      [ref7]: https://wetten.overheid.nl/BWBR0002698
      [ref8]: https://wetten.overheid.nl/BWBR0003299
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '62'
      - id: ref2
        bwb_id: BWBR0007149
      - id: ref3
        bwb_id: BWBR0010346
      - id: ref4
        bwb_id: BWBR0007671
      - id: ref5
        bwb_id: BWBR0009616
      - id: ref6
        bwb_id: BWBR0002638
      - id: ref7
        bwb_id: BWBR0002698
      - id: ref8
        bwb_id: BWBR0003299
  - number: 5.5.1
    text: |-
      Voor het verstrekken van gegevens en inlichtingen als bedoeld in [artikel 72 van de Wet SUWI][ref1] en
      [artikel 5.4][ref2], aan de ambtenaren, bedoeld in [artikel 5.4][ref3] en de opsporingsambtenaren, bedoeld
      in [artikel 85, tweede lid, van de Wet SUWI][ref4], maken het UWV, de SVB en de colleges van burgemeester en
      wethouders gebruik van elektronische voorzieningen als bedoeld in [paragraaf 5.6][ref5], voor zover die gegevens
      noodzakelijk zijn voor het toezicht op de naleving van de in [artikel 5.4][ref6] genoemde wetten, respectievelijk
      voor de opsporing van feiten strafbaar gesteld bij de [Wet SUWI][ref7] of enig andere wet.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0013267#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0013267#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0013060#Artikel85
      [ref5]: https://wetten.overheid.nl/BWBR0013267#Hoofdstuk5
      [ref6]: https://wetten.overheid.nl/BWBR0013267#Artikel5
      [ref7]: https://wetten.overheid.nl/BWBR0013060
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '72'
      - id: ref2
        bwb_id: BWBR0013267
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref3
        bwb_id: BWBR0013267
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref4
        bwb_id: BWBR0013060
        artikel: '85'
      - id: ref5
        bwb_id: BWBR0013267
        hoofdstuk: '5'
        paragraaf: '5.6'
      - id: ref6
        bwb_id: BWBR0013267
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref7
        bwb_id: BWBR0013060
  - number: 5.5.2
    text: |-
      Voor het verstrekken van gegevens als bedoeld in [artikel 73, zesde lid, van de Wet SUWI][ref1] aan het UWV,
      de SVB en de colleges van burgemeester en wethouders, maken de ambtenaren en opsporingsambtenaren gebruik van
      elektronische voorzieningen als bedoeld in [paragraaf 5.6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0013267#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '73'
      - id: ref2
        bwb_id: BWBR0013267
        hoofdstuk: '5'
        paragraaf: '5.6'
  - number: 5.5a
    text: |-
      De Dienst Wegverkeer, bedoeld in [artikel 4a van de Wegenverkeerswet 1994][ref1], is verplicht op verzoek aan
      colleges van burgemeester en wethouders opgaven en inlichtingen te verstrekken die noodzakelijk zijn voor de
      uitvoering van de [WWB][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0015703
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel5.5a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 4a
      - id: ref2
        bwb_id: BWBR0015703
  - number: '5.6'
    text: |-
      Het UWV en de SVB zijn bevoegd uit de onder hun verantwoordelijkheid gevoerde administraties gegevens te
      verstrekken aan buitenlandse bestuursorganen, voorzover die gegevens noodzakelijk zijn voor de vervulling van
      een taak van zwaarwegend algemeen belang waartoe in ieder geval gerekend wordt het verstrekken en vaststellen van
      uitkeringen en het heffen en innen van premies en bijdragen daarvoor.
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel5.6
  - number: '5.7'
    text: |-
      Het UWV en de SVB zijn bevoegd uit eigen beweging en verplicht op verzoek uit de onder hun verantwoordelijkheid
      gevoerde administraties kosteloos te verstrekken:
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel5.7
  - number: 5.7.a
    text: |-
      aan de rijksbelastingdienst de gegevens die noodzakelijk zijn voor de heffing of invordering van enige
      rijksbelasting, van premies sociale verzekeringen als bedoeld in [artikel 2, onderdelen a en c, van de Wfsv][ref1]
      en van de inkomensafhankelijke bijdrage, bedoeld in de [ZVW][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0018450
  - number: 5.7.b
    text: |-
      aan het College zorgverzekeringen, de zorgautoriteit, zorgverzekeraars als bedoeld in
      [artikel 1, eerste lid, onderdeel b, van de Algemene Wet Bijzondere Ziektekosten][ref1], het CAK, genoemd in
      [artikel 48, eerste lid, van de Algemene Wet Bijzondere Ziektekostenverzekering][ref2] en de verbindingskantoren,
      bedoeld in [artikel 1, onderdeel c, van het Administratiebesluit Bijzondere Ziektekostenverzekering][ref3]
      de gegevens voorzover die noodzakelijk zijn voor de uitvoering van de [ZVW][ref4] en de
      [Algemene Wet Bijzondere Ziektekosten][ref5];


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel48
      [ref3]: https://wetten.overheid.nl/BWBR0003585#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0018450
      [ref5]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '48'
      - id: ref3
        bwb_id: BWBR0003585
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0018450
      - id: ref5
        bwb_id: BWBR0002614
  - number: 5.7.c
    text: |-
      aan Onze Minister van Onderwijs, Cultuur en Wetenschap dan wel, voor zover het betreft het onderwijs of onderzoek
      op het gebied van de landbouw en de natuurlijke omgeving, Onze Minister van Landbouw, Natuur en Voedselkwaliteit de
      gegevens die noodzakelijk zijn voor de uitvoering van bij of krachtens een onderwijswet aan hen opgedragen taken,
      alsmede aan Onze Minister voor Wonen, Wijken en Integratie de gegevens die noodzakelijk zijn voor de uitvoering van
      de [Wet inburgering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020611
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0020611
  - number: 5.7.d
    text: |-
      aan de Pensioen- en Uitkeringsraad, bedoeld in [artikel 2 van de Wet op de Pensioen- en Uitkeringsraad][ref1],
      de gegevens die noodzakelijk zijn voor de uitvoering van de [Wet buitengewoon pensioen 1940–1945][ref2],
      de [Wet buitengewoon pensioen zeelieden-oorlogsslachtoffers][ref3], de
      [Wet buitengewoon pensioen Indisch verzet][ref4], de [Wet uitkeringen vervolgingsslachtoffers 1940–1945][ref5] en
      de [Wet uitkeringen burger-oorlogsslachtoffers 1940–1945][ref6];


      [ref1]: https://wetten.overheid.nl/BWBR0004806#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002032
      [ref3]: https://wetten.overheid.nl/BWBR0002035
      [ref4]: https://wetten.overheid.nl/BWBR0003968
      [ref5]: https://wetten.overheid.nl/BWBR0002844
      [ref6]: https://wetten.overheid.nl/BWBR0003664
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0004806
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002032
      - id: ref3
        bwb_id: BWBR0002035
      - id: ref4
        bwb_id: BWBR0003968
      - id: ref5
        bwb_id: BWBR0002844
      - id: ref6
        bwb_id: BWBR0003664
  - number: 5.7.e
    text: |-
      aan de raden voor de kinderbescherming de gegevens die noodzakelijk zijn voor een goede uitoefening van hun
      taak of van hun bevoegdheden op grond van één van de bepalingen van de [titels 9][ref1], [10][ref2], [13][ref3],
      [14][ref4], [15][ref5] en [17 van Boek 1 van het Burgerlijk Wetboek][ref6];


