    text: |-
      de ontwikkeling van het totale bedrag aan loon in de zin van [artikel 16 van de Wfsv][ref1] per jaar over de
      periode van vijf jaar voorafgaande aan het verzoek;


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel16
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel5.13
    references:
