  - number: 5.9.3
    text: |-
      Het UWV is verplicht op verzoek uit de onder zijn verantwoordelijkheid gevoerde administraties kosteloos te
      verstrekken aan een deurwaarder die gerechtigd is tegen een schuldenaar executoriaal beslag onder derden te leggen
      de gegevens die ten behoeve van het leggen van dit beslag noodzakelijk zijn voor het vaststellen van de identiteit
      van degene die periodieke betalingen aan de schuldenaar verricht.
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel5.9
  - number: 5.9.4
    text: |-
      In verband met het systematisch verstrekken van gegevens als bedoeld in [artikel 5.11][ref1] kunnen bij
      ministeriële regeling nadere regels worden gesteld omtrent de wijze waarop en de vorm waarin de adresgegevens,
      bedoeld in het eerste lid, onderdeel i, verstrekt worden.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel5
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel5.9
