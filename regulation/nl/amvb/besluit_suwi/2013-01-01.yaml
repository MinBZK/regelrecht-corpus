    text: |-
      de instroom, bedoeld in [artikel 40 van de Wet WIA][ref1], over de periode van drie jaar voorafgaande aan het
      verzoek;


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel40
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel5.13
    references:
