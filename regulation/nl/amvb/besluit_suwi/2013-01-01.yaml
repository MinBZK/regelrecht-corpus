  - number: 5.25.5
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent de inhoud en de indiening van de begroting en
      ontwerpen daarvan, het jaarplan, tussentijdse verslagen, het jaarverslag, de jaarrekening, de verklaring, bedoeld
      in het vierde lid, en het aan die verklaring ten grondslag liggende onderzoek.
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel5.25
