    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel5.13
  - number: 5.13.1.d
    text: |-
      het arbeidsverleden van de werknemers die ten tijde van het verzoek bij de werkgever in dienst zijn zoals het UWV
      dat vastlegt op grond van [artikel 33d, eerste lid, van de Wet SUWI][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel33d
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel5.13
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 33d
  - number: 5.13.2
    text: |-
      Het UWV is bevoegd op verzoek uit de onder zijn verantwoordelijkheid gevoerde administraties aan een financiële
      onderneming als bedoeld in [artikel 73, tweede lid, onderdeel b, van de Wet SUWI][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel73
    url: https://wetten.overheid.nl/BWBR0013267/2013-01-01#Artikel5.13
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '73'
  - number: 5.13.2.a
