  - number: '5.15'
    text: |-
      1 De SVB en het UWV zijn bevoegd op verzoek uit de onder hun verantwoordelijkheid gevoerde administraties
      aan derden, genoemd in [artikel 73, eerste lid, van de Wet SUWI][ref1], en derden, bedoeld in
      [artikel 5.12, tweede lid][ref2], persoonsgegevens, gegevens over de uitkeringsverhouding en over opleiding en
      werkervaring te verstrekken.

      2 De in het eerste lid bedoelde gegevens, niet zijnde persoonsgegevens als bedoeld in
      [artikel 16 van de Wet bescherming persoonsgegevens][ref3], kunnen door de SVB en het UWV systematisch worden
      verstrekt aan de derden, genoemd in [artikel 73, eerste lid][ref4], indien met de desbetreffende derden
      overeenstemming is bereikt over de te verstrekken gegevens, de omstandigheden waaronder, de regelmaat waarmee
      en de wijze waarop die verstrekking plaatsvindt, vast te leggen in een besluit, dat op adequate wijze wordt
      bekendgemaakt.

      3 De bevoegdheid op grond van het eerste lid geldt ook voor het UWV voor het verstrekken van andere gegevens dan
      bedoeld in [artikel 5.12][ref5], die door het UWV worden verwerkt op grond van [artikel 33a van de Wet SUWI][ref6].

      4 Bij ministeriële regeling wordt bepaald welke gegevens op grond van het derde lid worden verstrekt.

      5 Bij het verstrekken van gegevens op grond van dit artikel worden kosten in rekening gebracht. Bij ministeriële
      regeling worden hiervoor nadere regels gesteld.


