  - number: '4.4'
    text: |-
      De aanvraag om een individuele re-integratieovereenkomst kan in ieder geval worden geweigerd in de gevallen waarin
      op grond van [artikel 4:35, eerste lid, onderdelen a en b en tweede lid, van de Algemene wet bestuursrecht][ref1]
      een subsidieverlening kan worden geweigerd, en indien niet wordt voldaan aan de krachtens
      [artikel 4.2, derde lid][ref2], of [artikel 4.2a, derde lid][ref3], door het UWV of de overheidswerkgever gestelde
      voorwaarden.


