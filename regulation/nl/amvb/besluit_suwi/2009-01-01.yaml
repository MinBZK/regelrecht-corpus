  - number: 5.1.7
    text: |-
      1 Het UWV verstrekt uit de onder zijn verantwoordelijkheid gevoerde administraties aan overheidswerkgevers
      als bedoeld in [artikel 1, onderdeel i, van de WW][ref1], kosteloos de gegevens die noodzakelijk zijn voor de
      uitvoering van de taak, bedoeld in [artikel 72a van de WW][ref2].

      2 Het UWV verstrekt uit de onder zijn verantwoordelijkheid gevoerde administraties aan het participatiefonds,
      bedoeld in [artikel 1 van het Besluit participatiefonds][ref3], kosteloos de gegevens die noodzakelijk zijn voor de
      uitvoering van de taak van het participatiefonds waarborgen te bieden voor de kosten van werkloosheidsuitkeringen,
      voorzover die taak samenhangt met de uitvoering van [artikel 72a van de WW][ref4].

      3 Een overheidswerkgever of het participatiefonds, bedoeld in het tweede lid, kan het UWV op verzoek of uit
      eigen beweging kennis geven van het gegronde vermoeden dat een persoon van wie de inschakeling in de arbeid
      wordt bevorderd, onvoldoende medewerking verleent aan deze werkzaamheden, voorzover dit noodzakelijk is voor de
      uitvoering van de [WW][ref5] door het UWV.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel72a
