  - number: '5.24'
    text: |-
      1 Het Inlichtingenbureau is bewerker in de zin van de [Wet bescherming persoonsgegevens][ref1] voor het verwerken
      van gegevens die bij of krachtens enige wet door tussenkomst van het Inlichtingenbureau aan of door colleges
      van burgemeester en wethouders worden verstrekt, voor zover [artikel 62 van de Wet SUWI][ref2] van toepassing
      is, en voor het verwerken van de gegevens noodzakelijk voor het verlenen van kwijtschelding van gemeentelijke
      belastingen, bedoeld in [artikel 255 van de Gemeentewet][ref3], die door het UWV, de Dienst wegverkeer of de
      rijksbelastingdienst op grond van enig wettelijk voorschrift worden verstrekt aan colleges van burgemeester en
      wethouders.

      2 Bij ministeriële regeling kan worden bepaald welke gegevens door het Inlichtingenbureau worden verwerkt en onder
      welke voorwaarden het Inlichtingenbureau als bewerker voor colleges van burgemeester en wethouders optreedt.


      [ref1]: https://wetten.overheid.nl/BWBR0011468
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel62
      [ref3]: https://wetten.overheid.nl/BWBR0005416#Artikel255
