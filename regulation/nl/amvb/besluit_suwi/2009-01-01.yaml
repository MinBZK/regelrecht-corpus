preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid, gedaan mede namens de Staatssecretaris van
    Sociale Zaken en Werkgelegenheid, J. F. Hoogervorst, van 19 oktober 2001, Nr SUWI/SEC/2001/71128;

    Gelet op de artikelen 13, vijfde lid, 25, eerste lid, onderdeel d, 28, derde lid, en73, vijfde lid, van de
    Wet structuur uitvoeringsorganisatie werk en inkomen, de artikelen 125, derde lid, en 145, eerste lid, van de
    Algemene bijstandswet, de artikelen 48, derde lid, en 64, eerste lid, van de Wet inkomensvoorziening oudere
    en gedeeltelijk arbeidsongeschikte werkloze werknemers, de artikelen 48, derde lid, en 64, eerste lid, van
    de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen, de artikelen 8,
    zevende lid, 10, vijfde lid, 14, tweede lid, 15, tweede lid, en33a, vierde lid, van de Wet op de (re)integratie
    arbeidsgehandicapten, artikel 72, vijfde lid, van de Werkloosheidswet en artikel 8, vijfde lid, van de Wet
    inschakeling werkzoekenden;

    De Raad van State gehoord (advies van 12 december 2001, nr. W12.01.0543/IV);

    Gezien het nader rapport van Onze Minister van Sociale Zaken en Werkgelegenheid en de Staatssecretaris van Sociale
    Zaken en Werkgelegenheid, J. F. Hoogervorst, van 13 december 2001, nr. SUWI/SEC/2001/366;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0013267/2009-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. WWB: [Wet werk en bijstand][ref1];

      b. IOAW:[ Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2];

      c. IOAZ: [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3];

      d. WWIK: [Wet werk en inkomen kunstenaars][ref4];

      e. Wet REA: [Wet op de (re)integratie arbeidsgehandicapten][ref5];

      f. WW: [Werkloosheidswet][ref6];

      g. Wet SUWI: [Wet structuur uitvoeringsorganisatie werk en inkomen][ref7];

      h. UWV: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in[ hoofdstuk 5 van de Wet SUWI][ref8];

      i. SVB: de Sociale verzekeringsbank, genoemd in [hoofdstuk 6 van de Wet SUWI][ref9];

      j. arbeidsgehandicapte: arbeidsgehandicapte als bedoeld in[ artikel 2 van de Wet REA][ref10];

      k. arbodienst: een arbodienst als bedoeld in de [Arbeidsomstandighedenwet][ref11];

      l. deskundige persoon: een persoon als bedoeld in [artikel 14, eerste lid, van de Arbeidsomstandighedenwet][ref12]
      die belast is met de taken, bedoeld in [artikel 14, eerste lid, onderdeel b, van die wet][ref13];

      m. Wfsv: [Wet financiering sociale verzekeringen][ref14];

      n. Wet WIA: [Wet werk en inkomen naar arbeidsvermogen][ref15];

      o. WAO: [Wet op de arbeidsongeschiktheidsverzekering][ref16];

      p. ZW: [Ziektewet][ref17];

      q. ZVW: [Zorgverzekeringswet][ref18];

      r. College zorgverzekeringen: het College voor zorgverzekeringen, genoemd in
      [artikel 58, eerste lid, van de ZVW][ref19];

      s. zorgautoriteit: de Nederlandse Zorgautoriteit, bedoeld in de [Wet marktordening gezondheidszorg][ref20];

      t. eigenrisicodrager: de werkgever aan wie op grond van [artikel 40 van de Wfsv][ref21] toestemming is verleend het
      risico te dragen van de betalingen, bedoeld in [artikel 40, eerste lid, van de Wfsv][ref22];

      u. gebruikers: het UWV, de SVB en de colleges van burgemeester en wethouders;

      v. elektronische voorzieningen: elektronische voorzieningen als bedoeld in
      [artikel 62, tweede lid, van de Wet SUWI][ref23].


