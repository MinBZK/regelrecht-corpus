  - number: '5.13'
    text: |-
      1 Het UWV is bevoegd uit de onder zijn verantwoordelijkheid gevoerde administraties op verzoek van een werkgever
      als bedoeld in [artikel 73, tweede lid, onderdeel a, van de Wet SUWI][ref1], aan die werkgever in verband met
      het aangaan van overeenkomsten tot verzekering van de risico’s van het eigenrisicodrager zijn of van betaling
      van premie als bedoeld in [hoofdstuk 3, afdeling 5, van de Wfsv][ref2] kosteloos gegevens, mede afkomstig van de
      rijksbelastingdienst, te verstrekken op grond waarvan die werkgever kan bepalen:

      a. de instroom, bedoeld in [artikel 80a van de WAO][ref3] en [artikel 40 van de Wet WIA][ref4], over de periode van
      drie jaar voorafgaande aan het verzoek;

      b. de ontwikkeling van het totale bedrag aan loon in de zin van [artikel 16 van de Wfsv][ref5] per jaar over de
      periode van vijf jaar voorafgaande aan het verzoek;

      c. het aantal werknemers naar leeftijd en geslacht in de periode van vijf jaar voorafgaand aan het verzoek;

      d. het arbeidsverleden van de werknemers die ten tijde van het verzoek bij de werkgever in dienst zijn, zoals
      dit in de arbeidsverledenbeschikking, bedoeld in [artikel 83i van de Wet SUWI][ref6] wordt vermeld of zou worden
      vermeld,

      voorzover die werkgever dat niet op basis van gegevens in zijn loonadministratie kan bepalen.

      2 Het UWV is bevoegd op verzoek uit de onder zijn verantwoordelijkheid gevoerde administraties aan een financiële
      onderneming als bedoeld in [artikel 73, tweede lid, onderdeel b, van de Wet SUWI][ref7] in verband met de
      uitvoering van overeenkomsten als bedoeld in dat artikelonderdeel van de werknemer kosteloos gegevens als bedoeld
      in [artikel 5.12, eerste lid, onderdelen a, b, c en d][ref8], afkomstig van de rijksbelastingdienst, te verstrekken
      of van de werknemer die een arbeidsongeschiktheidsuitkering of een WGA-uitkering op grond van de [WAO][ref9] of
      de [Wet WIA][ref10] ontvangt te verstrekken: het dagloon, dat aan de uitkering ten grondslag ligt, de mate van
      arbeidsongeschiktheid uitgedrukt in het arbeidsongeschiktheidspercentage en de duur van de uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel73
