  - number: '5.14'
    text: |-
      Het UWV is bevoegd uit de onder zijn verantwoordelijkheid gevoerde administraties kosteloos gegevens die
      mede afkomstig zijn van de rijksbelastingdienst en die het UWV verwerkt ten behoeve van de statistiek over de
      ontwikkeling van de arbeidsongeschiktheidsuitkeringen te verstrekken aan de financiële ondernemingen, bedoeld in
      [artikel 73, tweede lid, onderdeel b, van de Wet SUWI][ref1], in verband met de in [dat artikel][ref2] bedoelde
      overeenkomsten:

      a. aantallen nieuwe uitkeringen op grond van de [WAO][ref3] of de [Wet WIA][ref4] per jaar, beëindigde uitkeringen
      op grond van de [WAO][ref5] of de [Wet WIA][ref6] per jaar en lopende uitkeringen in een jaar, naar geslacht,
      leeftijd, sector als bedoeld in [artikel 95 van de Wfsv][ref7], en bedrijfsgrootte, dagloon, naar ingangdatum
      respectievelijk datum beëindiging uitkering, arbeidsongeschiktheidspercentages, diagnose, soort inkomstenverhouding
      en combinatie met inkomsten uit arbeid;

      b. totaal aantal werknemers naar jaar, geslacht, leeftijd, sector als bedoeld in [artikel 95 van de Wfsv][ref8],
      en bedrijfsgrootte, en het totaalbedrag van de premieplichtige loonsom per jaar, bedoeld in
      [artikel 2.7 van het Besluit Wfsv][ref9].


