        artikel: 2.7a
  - number: '4.16'
    text: |-
      De subsidie-ontvanger dient binnen zes weken na afloop van het tijdvak waarvoor de subsidie is verleend een
      aanvraag tot vaststelling van de subsidie in.
    url: https://wetten.overheid.nl/BWBR0013267/2009-01-01#Artikel4.16
  - number: '4.17'
    text: |-
      1 In geval van een toekennende beschikking op een aanvraag om een persoonsgebonden re-integratieovereenkomst, sluit
      het UWV binnen zes weken na het nemen van die beschikking een overeenkomst met een re-integratiebedrijf dat de in
      [artikel 4.8][ref1] bedoelde werkzaamheden uitvoert.

      2 Het UWV sluit een overeenkomst met een re-integratiebedrijf als bedoeld in het eerste lid overeenkomstig de
      voorkeur voor een re-integratiebedrijf van de aanvrager of begunstigde.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4.8
    url: https://wetten.overheid.nl/BWBR0013267/2009-01-01#Artikel4.17
