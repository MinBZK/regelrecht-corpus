  - number: '3.1'
    text: |-
      1 Het UWV registreert op diens verzoek als werkzoekende:

      a. een vreemdeling die rechtmatig in Nederland verblijft, in de zin van
      [artikel 8, onderdeel b of l, van de Vreemdelingenwet 2000][ref1];

      b. een vreemdeling die rechtmatig in Nederland verblijft, in de zin van
      [artikel 8, onderdeel a, van de Vreemdelingenwet 2000][ref2], die onvrijwillig werkloos is terwijl het verbod,
      bedoeld in [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref3] nog van toepassing is, mits de vergunning
      tot verblijf het in Nederland verrichten van arbeid niet uitsluit;

      c. een vreemdeling die rechtmatig in Nederland verblijf heeft gehouden in de zin van
      [artikel 8, onderdeel a tot en met e, of m, van de Vreemdelingenwet 2000][ref4], mits de vergunning tot verblijf
      het in Nederland verrichten van arbeid niet uitsloot, indien de vreemdeling onvrijwillig werkloos is, en mits hij:

      1°. voor de beëindiging van dit verblijf een aanvraag heeft ingediend om voortgezette toelating, of

      2°. binnen de termijn, genoemd in [artikel 69, eerste lid, van de Vreemdelingenwet 2000][ref5], of
      buiten die termijn, in geval [artikel 6:11 van de Algemene wet bestuursrecht][ref6] toepassing heeft
      gevonden, bezwaar heeft gemaakt of beroep heeft ingesteld tegen intrekking van de toelating in de zin van
      [artikel 8, onderdeel a tot en met e, of m, van de Vreemdelingenwet 2000][ref7].

      2 De registratie eindigt voor een vreemdeling als bedoeld in het eerste lid, onderdeel c, zodra:

      a. onherroepelijk op de aanvraag, het bezwaar of het beroep is beslist, of

      b. de uitzetting van de vreemdeling is gelast, tenzij die uitzetting ingevolge de [Vreemdelingenwet 2000][ref8] of
      op grond van een rechterlijke beslissing achterwege dient te blijven.


