  - number: '4.3'
    text: |-
      1 In geval van een toekennende beschikking op een aanvraag als bedoeld in [artikel 4.2, eerste lid][ref1], sluit
      het UWV binnen zes weken na het nemen van die beschikking een overeenkomst met een re-integratiebedrijf dat de in
      artikel [4.2, eerste lid][ref2], bedoelde werkzaamheden uitvoert.

      2 De persoon ten behoeve van wie een individuele re-integratieovereenkomst als bedoeld in
      [artikel 4.2, eerste lid][ref3], wordt gesloten tekent een exemplaar van die overeenkomst voor gezien en verstrekt
      dit aan het UWV.

      3 In geval van een toekennende beschikking op een aanvraag als bedoeld in [artikel 4.2a, eerste lid][ref4],
      sluit de overheidswerkgever binnen zes weken na het nemen van die beschikking een overeenkomst met een re-
      integratiebedrijf dat de in [artikel 4.2a, eerste lid][ref5], bedoelde werkzaamheden uitvoert.

      4 De persoon ten behoeve van wie een individuele re-integratieovereenkomst als bedoeld in [artikel 4.2a][ref6]
      wordt gesloten tekent een exemplaar van die overeenkomst voor gezien en verstrekt dit aan de overheidswerkgever.


