  - number: '5.6'
    text: |-
      Het UWV en de SVB zijn bevoegd uit de onder hun verantwoordelijkheid gevoerde administraties gegevens te
      verstrekken aan buitenlandse bestuursorganen, voorzover die gegevens noodzakelijk zijn voor de vervulling van
      een taak van zwaarwegend algemeen belang waartoe in ieder geval gerekend wordt het verstrekken en vaststellen van
      uitkeringen en het heffen en innen van premies en bijdragen daarvoor.
    url: https://wetten.overheid.nl/BWBR0013267/2009-01-01#Artikel5.6
  - number: '5.7'
    text: |-
      Het UWV en de SVB zijn bevoegd uit eigen beweging en verplicht op verzoek uit de onder hun verantwoordelijkheid
      gevoerde administraties kosteloos te verstrekken:

      a. aan de rijksbelastingdienst de gegevens die noodzakelijk zijn voor de heffing of invordering van enige
      rijksbelasting, van premies sociale verzekeringen als bedoeld in [artikel 2, onderdelen a en c, van de Wfsv][ref1]
      en van de inkomensafhankelijke bijdrage, bedoeld in de [ZVW][ref2];

      b. aan het College zorgverzekeringen, de zorgautoriteit, zorgverzekeraars als bedoeld in
      [artikel 1, eerste lid, onderdeel b, van de Algemene Wet Bijzondere Ziektekosten][ref3],
      het centraal administratiekantoor, bedoeld in
      [artikel 1, onderdeel b, van het Administratiebesluit Bijzondere Ziektekostenverzekering][ref4]
      en de verbindingskantoren, bedoeld in
      [artikel 1, onderdeel c, van het Administratiebesluit Bijzondere Ziektekostenverzekering][ref5]
      de gegevens voorzover die noodzakelijk zijn voor de uitvoering van de [ZVW][ref6] en de
      [Algemene Wet Bijzondere Ziektekosten][ref7];

      c. aan de Informatie Beheer Groep de gegevens die noodzakelijk zijn voor de uitvoering van bij of krachtens enige
      wet aan de Informatie Beheer Groep opgedragen taken;

      d. aan de Pensioen- en Uitkeringsraad, bedoeld in [artikel 2 van de Wet op de Pensioen- en Uitkeringsraad][ref8],
      de gegevens die noodzakelijk zijn voor de uitvoering van de [Wet buitengewoon pensioen 1940–1945][ref9],
      de [Wet buitengewoon pensioen zeelieden-oorlogsslachtoffers][ref10], de
      [Wet buitengewoon pensioen Indisch verzet][ref11], de [Wet uitkeringen vervolgingsslachtoffers 1940–1945][ref12]
      en de [Wet uitkeringen burger-oorlogsslachtoffers 1940–1945][ref13];

      e. aan de raden voor de kinderbescherming de gegevens die noodzakelijk zijn voor een goede uitoefening van hun
      taak of van hun bevoegdheden op grond van één van de bepalingen van de [titels 9][ref14], [10][ref15], [13][ref16],
      [14][ref17], [15][ref18] en [17 van Boek 1 van het Burgerlijk Wetboek][ref19];

      f. aan de Kamers van Koophandel en Fabrieken de gegevens die nodig zijn voor de uitvoering van
      [hoofdstuk 2 van de Handelsregisterwet 1996][ref20] opgedragen taken.


