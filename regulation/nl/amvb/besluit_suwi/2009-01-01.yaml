  - number: '5.9'
    text: |-
      1 Het UWV is bevoegd uit eigen beweging en verplicht op verzoek uit de onder zijn verantwoordelijkheid gevoerde
      administraties kosteloos te verstrekken:

      a. aan het vervangingsfonds, bedoeld in [artikel 1 van het Besluit vervangingsfonds][ref1], de gegevens die
      noodzakelijk zijn voor de uitvoering van zijn taak op grond van de [Wet op het primair onderwijs][ref2], de
      [Wet op het voortgezet onderwijs][ref3] en de [Wet op de expertisecentra][ref4];

      b. aan het participatiefonds, bedoeld in [artikel 1 van het Besluit participatiefonds][ref5], de gegevens die
      noodzakelijk zijn voor de uitvoering van zijn taak op grond van de [Wet op het primair onderwijs][ref6], de
      [Wet op het voortgezet onderwijs][ref7] en de [Wet op de expertisecentra][ref8];

      c. aan Onze Minister van Onderwijs, Cultuur en Wetenschap de gegevens die noodzakelijk zijn voor de bekostiging
      van onderwijsinstellingen;

      d. aan de Sociaal Economische Raad de gegevens die noodzakelijk zijn voor de uitvoering van bij of krachtens enige
      wet aan die Raad opgedragen taken;

      e. aan een indicatieorgaan als bedoeld in [artikel 9a, eerste lid, van de Algemene Wet Bijzondere Ziektekosten][ref9]
      de gegevens die noodzakelijk zijn in verband met taken die voortvloeien uit de [Wet sociale werkvoorziening][ref10]
      en de [Algemene Wet Bijzondere Ziektekosten][ref11];

      f. aan colleges van burgemeester en wethouders de gegevens die noodzakelijk zijn ten behoeve van de
      registratie van gegevens, bedoeld in [artikel 118h van de Wet op het voortgezet onderwijs][ref12],
      [artikel 8.3.2 van de Wet educatie en beroepsonderwijs][ref13] en
      [artikel 162b van de Wet op de expertisecentra][ref14] in verband met de doorverwijzing van vroegtijdige
      schoolverlaters naar onderwijs of arbeidsmarkt;

      g. aan colleges van burgemeester en wethouders de gegevens die noodzakelijk zijn voor het verlenen van
      kwijtschelding van gemeentelijke belastingen, bedoeld in [artikel 255 van de Gemeentewet][ref15];

      h. aan Onze Minister van Economische Zaken, de gegevens die noodzakelijk
      zijn voor de uitvoering van de S&O-afdrachtvermindering, bedoeld in
      [hoofdstuk VIII van de Wet vermindering afdracht loonbelasting en premie voor de volksverzekeringen][ref16].

      2 Het UWV is bij de verwerking van gegevens voor de uitvoering van de taak, die krachtens de
      [Wet arbeid vreemdelingen][ref17] aan het UWV is opgedragen, bevoegd uit eigen beweging en verplicht op verzoek aan
      colleges van burgemeester en wethouders gegevens te verstrekken die noodzakelijk zijn in verband met de taken die
      voortvloeien uit de [Huisvestingswet][ref18] en de [Woningwet][ref19].

      3 Het UWV is verplicht op verzoek uit de onder zijn verantwoordelijkheid gevoerde administraties kosteloos te
      verstrekken aan een deurwaarder die gerechtigd is tegen een schuldenaar executoriaal beslag onder derden te leggen
      de gegevens die ten behoeve van het leggen van dit beslag noodzakelijk zijn voor het vaststellen van de identiteit
      van degene die periodieke betalingen aan de schuldenaar verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0007009#Artikel1
