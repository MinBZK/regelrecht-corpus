  - number: '5.18'
    text: |-
      1 De gegevens die het UWV op grond van [artikel 73, negende lid][ref1], bevoegd is te verstrekken betreffen
      gegevens omtrent naam, adres, telefoonnummer, postcode, woonplaats, opleiding en werkervaring.

      2 Bij het verstrekken van gegevens door het UWV op grond van [artikel 73, achtste en negende lid][ref2], aan re-
      integratiebedrijven worden geen kosten in rekening gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel73
