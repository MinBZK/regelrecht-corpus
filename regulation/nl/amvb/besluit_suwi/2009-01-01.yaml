  - number: '5.12'
    text: |-
      1 Het UWV is bevoegd op verzoek uit de onder zijn verantwoordelijkheid gevoerde administraties aan derden als
      bedoeld in [artikel 73a, tweede lid][ref1], en in [artikel 73, eerste lid, van de Wet SUWI][ref2], de volgende van
      de rijksbelastingdienst afkomstige gegevens te verstrekken:

      a. *persoonsgegevens van de werknemer*: adresgegevens, namen, burgerservicenummer of, bij het ontbreken daarvan,
      sociaal-fiscaalnummer, geboortedatum en geslacht;

      b. *verzekeringsplicht werknemersverzekeringen*: indicatie verzekerd en premies voor de werknemersverzekeringen;

      c. *gegevens over de inkomstenverhouding*: soort inkomstenverhouding, aard arbeidsverhouding, datum begin en einde
      van inkomstenverhouding, risicopremiegroep, sector, contract (on)bepaalde tijd, fase indeling Flexibiliteit en
      Zekerheid, collectieve arbeidsovereenkomst, reden einde dienstbetrekking van een flexwerker;

      d. *loongerelateerde gegevens*: aantal SV-dagen, aantal verloonde uren, loon SV, (opgebouwd recht) vakantiebijslag,
      indicatie aanvulling op uitkering, indicatie vakantiebonnen toegepast;

      e. *gegevens over de werkgever*: naam, loonheffingennummer, fi-nummer, rechtsvorm, risicopremiegroep,
      sector, voortzettingsrelatie, datum oprichting, datum ontbinding, statutaire zetel, eigenrisicodragerschap,
      premiepercentage individueel, faillissement of surseance en gemoedsbezwaardheid.

      2 De in artikel 73a, tweede lid, van de [Wet SUWI][ref3] bedoelde derden zijn: deskundigen en instellingen die in
      het kader van de uitoefening van beroep of bedrijf taken uitvoeren of diensten verrichten ter ondersteuning van
      administraties of het verrichten van keuringen.

      3 Bij het verstrekken van gegevens op grond van dit artikel worden kosten in rekening gebracht. Bij ministeriële
      regeling worden hiervoor nadere regels gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel73a
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel73
      [ref3]: https://wetten.overheid.nl/BWBR0013060
