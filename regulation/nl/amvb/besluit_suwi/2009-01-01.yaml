  - number: 4.2a
    text: |-
      1 De overheidswerkgever kan ten behoeve van de werknemer, bedoeld in [artikel 72a, van de WW][ref1], op diens
      aanvraag een individuele re-integratieovereenkomst sluiten met een re-integratiebedrijf, overeenkomstig de voorkeur
      van de aanvrager, ter uitvoering van werkzaamheden die zijn gericht op de inschakeling in het arbeidsproces.

      2 De overheidswerkgever bepaalt het ten hoogste aan het re-integratiebedrijf verschuldigde bedrag voor de
      uitvoering van de individuele re-integratieovereenkomst, bedoeld in het eerste lid, en het tijdvak waarvoor de
      individuele re-integratieovereenkomst, bedoeld in het eerste lid, wordt gesloten.

      3 Bij ministeriële regeling kunnen regels worden gesteld omtrent de voorwaarden waaronder door de
      overheidswerkgever een individuele re-integratieovereenkomst als bedoeld in het eerste lid kan worden gesloten en
      omtrent de inhoud van de individuele re-integratieovereenkomst, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel72a
    url: https://wetten.overheid.nl/BWBR0013267/2009-01-01#Artikel4.2a
    references:
