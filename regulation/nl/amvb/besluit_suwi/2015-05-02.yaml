      1 In [bijlage I][ref1] bij dit besluit wordt voor de polisadministratie een overzicht gegeven van de opgenomen
      gegevens, voor welk doel die gegevens worden verwerkt en hoe die gegevens worden verkregen.

      2 [Bijlage I][ref2] kan bij regeling van Onze Minister, in overeenstemming met Onze Minister van Financiën, en na
      overleg met het Centraal bureau voor de statistiek, worden gewijzigd, voorzover deze wijziging geen wijziging tot
      gevolg heeft van de lijst van gegevens in [artikel 5.1][ref3].


