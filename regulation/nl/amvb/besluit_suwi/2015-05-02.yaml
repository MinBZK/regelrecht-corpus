  - number: 5a.3
    text: |-
      1 Onze Minister analyseert de verstrekte gegevens, bedoeld in [artikel 5a.2, derde lid, onderdeel g][ref1], en
      bepaalt in welke gevallen deze leiden tot een risicomelding.

      2 Onze Minister verstrekt aan de betreffende bestuursorganen en personen van het samenwerkingsverband de in
      aanmerking komende risicomeldingen die noodzakelijk zijn voor een goede uitvoering van hun wettelijke taak.

      3 Indien een natuurlijk persoon of rechtspersoon geen onderwerp is van een risicomelding worden zijn of haar
      gegevens binnen vier weken na afronding van de analyse, bedoeld in het eerste lid, door Onze Minister vernietigd.

      4 De terugkoppeling, bedoeld in [artikel 65, zesde lid, van de Wet SUWI][ref2] vindt plaats binnen twintig maanden
      te rekenen vanaf de aanvang van het SyRI-project.

      5 Onverminderd de regels krachtens [artikel 5a.5][ref3], vernietigt Onze Minister na de terugkoppeling, bedoeld
      in [artikel 65, zesde lid, van de Wet SUWI][ref4], maar in ieder geval uiterlijk twee jaar nadat het SyRI-project
      is aangevangen, alle in het kader van dat project verkregen gegevens, waaronder de via de terugkoppeling verkregen
      gegevens.


