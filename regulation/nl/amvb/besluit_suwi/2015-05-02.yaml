  - number: '5.13'
    text: |-
      1 Het UWV is bevoegd uit de onder zijn verantwoordelijkheid gevoerde administraties op verzoek van een werkgever
      als bedoeld in [artikel 73, derde lid, onderdeel a, van de Wet SUWI][ref1], aan die werkgever in verband met
      het aangaan van overeenkomsten tot verzekering van de risico’s van het eigenrisicodrager zijn of van betaling
      van premie als bedoeld in [hoofdstuk 3, afdeling 5, van de Wfsv][ref2] kosteloos gegevens te verstrekken, mede
      afkomstig van de Belastingdienst, over WGA-uitkeringen verstrekt aan werknemers, met vermelding van aanvangsdatum
      en vermoedelijke einddatum, BSN-nummer en naam van de werknemer, op grond waarvan die werkgever de lasten van
      uitkeringen ingevolge de Werkhervattingsregeling op grond van de [Wet WIA][ref3] kan bepalen die aan de werkgever
      worden doorbelast op grond van de [Wfsv][ref4] dan wel de Wet WIA.

      2 Het UWV is bevoegd op verzoek uit de onder zijn verantwoordelijkheid gevoerde administraties aan een financiële
      onderneming als bedoeld in [artikel 73, derde lid, onderdeel b, van de Wet SUWI][ref5]:

      a. kosteloos te verstrekken gegevens als bedoeld in [artikel 5.12, eerste lid, onderdelen a, b, c en d][ref6] ,
      afkomstig van de rijksbelastingdienst, en gegevens van de werknemer, die een WGA-uitkering op grond van
      de [Wet WIA][ref7] ontvangt, omtrent het dagloon dat aan de uitkering ten grondslag ligt, de mate van
      arbeidsongeschiktheid uitgedrukt in het arbeidsongeschiktheidspercentage, en de duur van uitkering in verband
      met de uitvoering van de overeenkomsten met werkgevers tot verzekering van het risico van het betalen van premie
      voor de arbeidsongeschiktheidsverzekering op grond van de [Wfsv][ref8] en van de betalingen als gevolg van het
      eigenrisicodragen, bedoeld in [artikel 40, eerste lid, onderdeel b, van de Wfsv][ref9];

      b. gegevens te verstrekken als bedoeld in artikel [5.12, eerste lid, onderdelen a, b, c en d][ref10] , afkomstig
      van de rijksbelastingdienst, in verband met de uitvoering van de overeenkomsten met werkgevers tot verzekering
      van het risico van het betalen van loon in geval van ziekte en van de betaling van ziekengeld, bedoeld in
      [artikel 40, eerste lid, onderdeel a, van de Wfsv][ref11].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel73
