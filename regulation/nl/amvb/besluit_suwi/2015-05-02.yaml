  - number: '5.14'
    text: |-
      1 UWV verstrekt aan financiële ondernemingen, bedoeld in
      [artikel 73, derde lid, onderdeel b, van de Wet SUWI][ref1], met inachtneming van het derde lid, kosteloos de
      volgende gegevens die het UWV verwerkt in de onder zijn verantwoordelijkheid gevoerde administraties, die mede
      afkomstig zijn van de Belastingdienst, die noodzakelijk zijn voor het vervaardigen van de statistieken ten behoeve
      van de uitvoering van overeenkomsten als bedoeld in artikel 73, derde lid, onderdeel b, van de Wet SUWI:

      a. per persoon, die in een kalenderjaar een nieuwe uitkering [Wet WIA][ref2] heeft ontvangen, een lopende uitkering
      ontvangt dan wel van wie de WIA-uitkering is beëindigd of afgewezen: geslacht, leeftijd, sector als bedoeld in
      [artikel 95 van de Wfsv][ref3], bedrag grondslag of dagloon, ingangsdatum (vervolg)uitkering, uitkeringspercentage
      Wet WIA, code verzekerd Wet WIA (soort dienstverband), benutting van de verdiencapaciteit, soort recht Wet WIA
      (WIA-klasse, en WGA of IVA), datum eerste ziektedag, werkgever eigenrisicodrager of publiek verzekerd, datum einde
      uitkering en reden beëindiging, jaar-maand afhandeling claimbeoordeling;

      b. per werknemer naar kalenderjaar: loonaangiftetijdvak, geslacht, leeftijd, sector als bedoeld in
      [artikel 95 van de Wfsv][ref4], code bepaald/onbepaald, code oproepkracht, code uitzendkracht, SV-jaarloon,
      werkgever eigenrisicodrager of publiek verzekerd,

      met dien verstande dat de gegevens uitsluitend gebruikt mogen worden voor het vervaardigen van statistieken met
      betrekking tot het verzekeringsproduct inzake het arbeidsongeschiktheids- of ziekterisico van werknemers en dat de
      gegevens niet verrijkt mogen worden met gegevens over afzonderlijke personen en rechtspersonen uit andere bronnen.

      2 De gegevens, bedoeld in het eerste lid, worden ontdaan van unieke persoonsidentificerende gegevens.

      3 Het UWV verstrekt de gegevens, bedoeld in het eerste lid, aan de door het Verbond
      van Verzekeraars namens de financiële ondernemingen aangewezen bewerker in de zin van
      [artikel 1, aanhef en onderdeel e, van de Wet bescherming persoonsgegevens][ref5] belast met de verwerking van
      gegevens voor statistische doeleinden.

      4 De door de bewerker vervaardigde statistieken, bedoeld in het eerste lid, worden om niet ter beschikking gesteld
      aan Onze Minister en aan De Nederlandsche Bank N.V.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0019057
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel95
      [ref4]: https://wetten.overheid.nl/BWBR0017745#Artikel95
      [ref5]: https://wetten.overheid.nl/BWBR0011468#Artikel1
