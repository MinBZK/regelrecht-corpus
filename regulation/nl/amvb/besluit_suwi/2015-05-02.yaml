        hoofdstuk: 5a
      - id: ref4
        bwb_id: BWBR0013060
        artikel: '65'
  - number: 5a.4
    text: |-
      1 Onze Minister bepaalt de aanvangsdatum van het SyRI-project indien het verzoek aan
      [artikel 5a.1, eerste lid][ref1], voldoet. Hiervan doet hij mededeling in de Staatscourant.

      2 Het SyRI-project eindigt zodra de terugkoppelingen, bedoeld in [artikel 65, zesde lid, van de Wet SUWI][ref2] bij
      Onze Minister zijn ingediend of Onze Minister hiertoe besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel5a.1
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel65
    url: https://wetten.overheid.nl/BWBR0013267/2015-05-02#Artikel5a.4
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: 5a.1
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '65'
  - number: 5a.5
    text: |-
      1 Er is een register risicomeldingen waarin gegevens over risicomeldingen worden verwerkt teneinde
      projectdeelnemers en bestuursorganen te informeren over de risicomeldingen die zijn verstrekt en om subjecten van
      risicomeldingen op aanvraag te informeren of zijn gegevens in het register zijn opgenomen.

      2 Onze Minister is de verantwoordelijke in de zin van de [Wet bescherming persoonsgegevens][ref1] voor de
      verwerking van gegevens in het register risicomeldingen.

      3 De gegevens uit het register risicomeldingen die noodzakelijk zijn voor de in het eerste lid genoemde doeleinden,
      worden verstrekt aan projectdeelnemers en subjecten van projecten.

      4 Gelet op het bepaalde in het eerste lid worden subjecten niet na afloop van het onderzoek afzonderlijk
      geïnformeerd over de risicomeldingen die in het register worden verwerkt.

      5 Indien een risicomelding wordt gedaan, worden de gegevens over de risicomelding direct opgenomen in het register
      risicomeldingen. De gegevens over de risicomeldingen worden bewaard tot twee jaren nadat de risicomelding in het
      register risicomeldingen is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0013267/2015-05-02#Artikel5a.5
    references:
      - id: ref1
        bwb_id: BWBR0011468
  - number: 5a.6
    text: |-
      1 Met inachtneming van de bewaartermijnen, bedoeld in [artikel 65, vijfde lid, van de Wet SUWI][ref1] evalueert
      Onze Minister het voor het SyRI-project gehanteerde risicomodel aan de hand van de ontvangen terugkoppelingen,
      bedoeld in [artikel 65, zesde lid, van de Wet SUWI][ref2].

      2 De terugkoppeling vindt op de volgende onderdelen plaats:

      a. voor zover beschikbaar: de resultaten van de risicomeldingen;

      b. de bruikbaarheid van de risicomeldingen;

      c. indien een of meer risicomeldingen niet tot vervolgacties hebben geleid: de redenen hiervan.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de terugkoppeling van de resultaten van de
      risicomeldingen, bedoeld in [artikel 65, zesde lid, van de Wet SUWI][ref3], en de evaluatie, bedoeld in het eerste
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel65
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel65
    url: https://wetten.overheid.nl/BWBR0013267/2015-05-02#Artikel5a.6
    references:
