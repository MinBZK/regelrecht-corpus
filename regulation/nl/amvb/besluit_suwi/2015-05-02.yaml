      1 In [bijlage II][ref1] bij dit besluit wordt vermeld welke soort gegevens op grond van de
      [artikelen 33a, tweede lid][ref2], en [35, vijfde lid, van de Wet SUWI][ref3], [14, eerste lid, van de IOAW][ref4],
      [14, eerste lid, van de IOAZ][ref5] en [53a, eerste lid, van de Participatiewet][ref6] niet van de belanghebbende
      worden verkregen en uit welke bron deze gegevens afkomstig zijn.

      2 Het UWV informeert de belanghebbende over de soort gegevens, bedoeld in het eerste lid, op het moment dat hij een
      aanvraag als bedoeld in [artikel 30c, eerste lid, van de Wet SUWI][ref7] dan wel een aanvraag voor een uitkering
      als bedoeld in [artikel 30, eerste lid, van de Wet SUWI][ref8] indient.

      3 Bij ministeriële regeling kan worden bepaald, dat tot een in die regeling genoemd tijdstip bepaalde onderdelen
      van [bijlage II][ref9] voor bepaalde bestuursorganen met betrekking tot bepaalde taken niet van toepassing zijn.

      4 Bij regeling van Onze Minister, voor zover het gegevens betreft die afkomstig zijn van de Belastingdienst
      in overeenstemming met Onze Minister van Financiën, wordt nader bepaald voor welke gegevens het eerste lid van
      toepassing is.


