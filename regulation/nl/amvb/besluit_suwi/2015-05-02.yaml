preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid, gedaan mede namens de Staatssecretaris van
    Sociale Zaken en Werkgelegenheid, J. F. Hoogervorst, van 19 oktober 2001, Nr SUWI/SEC/2001/71128;

    Gelet op de artikelen 13, vijfde lid, 25, eerste lid, onderdeel d, 28, derde lid, en73, vijfde lid, van de
    Wet structuur uitvoeringsorganisatie werk en inkomen, de artikelen 125, derde lid, en 145, eerste lid, van de
    Algemene bijstandswet, de artikelen 48, derde lid, en 64, eerste lid, van de Wet inkomensvoorziening oudere
    en gedeeltelijk arbeidsongeschikte werkloze werknemers, de artikelen 48, derde lid, en 64, eerste lid, van
    de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen, de artikelen 8,
    zevende lid, 10, vijfde lid, 14, tweede lid, 15, tweede lid, en33a, vierde lid, van de Wet op de (re)integratie
    arbeidsgehandicapten, artikel 72, vijfde lid, van de Werkloosheidswet en artikel 8, vijfde lid, van de Wet
    inschakeling werkzoekenden;

    De Raad van State gehoord (advies van 12 december 2001, nr. W12.01.0543/IV);

    Gezien het nader rapport van Onze Minister van Sociale Zaken en Werkgelegenheid en de Staatssecretaris van Sociale
    Zaken en Werkgelegenheid, J. F. Hoogervorst, van 13 december 2001, nr. SUWI/SEC/2001/366;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0013267/2015-05-02#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. IOAW:[ Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref1];

      b. IOAZ: [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref2];

      c. Wet REA: [Wet op de (re)integratie arbeidsgehandicapten][ref3];

      d. WW: [Werkloosheidswet][ref4];

      e. Wet SUWI: [Wet structuur uitvoeringsorganisatie werk en inkomen][ref5];

      f. UWV: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in[ hoofdstuk 5 van de Wet SUWI][ref6];

      g. SVB: de Sociale verzekeringsbank, genoemd in [hoofdstuk 6 van de Wet SUWI][ref7];

      h. arbeidsgehandicapte: arbeidsgehandicapte als bedoeld in[ artikel 2 van de Wet REA][ref8];

      i. arbodienst: een arbodienst als bedoeld in de [Arbeidsomstandighedenwet][ref9];

      j. deskundige persoon: een persoon als bedoeld in [artikel 14, eerste lid, van de Arbeidsomstandighedenwet][ref10]
      die belast is met de taken, bedoeld in [artikel 14, eerste lid, onderdeel b, van die wet][ref11];

      k. Wfsv: [Wet financiering sociale verzekeringen][ref12];

      l. Wet WIA: [Wet werk en inkomen naar arbeidsvermogen][ref13];

      m. WAO: [Wet op de arbeidsongeschiktheidsverzekering][ref14];

      n. ZW: [Ziektewet][ref15];

      o. ZVW: [Zorgverzekeringswet][ref16];

      p. Zorginstituut: het Zorginstituut Nederland, genoemd in [artikel 58, eerste lid, van de ZVW][ref17];

      q. zorgautoriteit: de Nederlandse Zorgautoriteit, bedoeld in de [Wet marktordening gezondheidszorg][ref18];

      r. eigenrisicodrager: de werkgever aan wie op grond van [artikel 40 van de Wfsv][ref19] toestemming is verleend het
      risico te dragen van de betalingen, bedoeld in [artikel 40, eerste lid, van de Wfsv][ref20];

      s. gebruikers: het UWV, de SVB en de colleges van burgemeester en wethouders;

      t. elektronische voorzieningen: elektronische voorzieningen als bedoeld in
      [artikel 62, tweede lid, van de Wet SUWI][ref21];

      u.

      v. bestand: elk gestructureerd geheel van persoons- of bedrijfsgegevens, ongeacht of dit geheel van gegevens
      gecentraliseerd is of verspreid is op een functioneel of geografische bepaalde wijze, dat volgens de bepaalde
      criteria toegankelijk is en betrekking heeft op verschillende natuurlijke- of rechtspersonen;

      w. bedrijfsgegeven: een gegeven betreffende een geïdentificeerde of identificeerbare rechtspersoon;

      x. bewerker: een bewerker als bedoeld in [artikel 1, onderdeel e, van de Wet bescherming persoonsgegevens][ref22];

      y. indicator: een gegeven dat de aanwezigheid van een bepaalde omstandigheid aannemelijk maakt;

      z. risicomelding: de melding, bedoeld in [artikel 65, tweede lid, van de Wet SUWI][ref23];

      aa. risicomodel: een model dat bestaat uit vooraf bepaalde indicatoren en aangeeft of er sprake is van een verhoogd
      risico op:

        - onrechtmatig gebruik van overheidsgelden en overheidsvoorzieningen op het terrein van sociale zekerheid en de
      inkomensafhankelijke regelingen,
        - belasting- en premiefraude, of
        - het niet naleven van arbeidswetten;

      bb. samenwerkingsverband: de samenwerking tussen twee of meer van de bestuursorganen of personen, bedoeld in
      [artikel 64, eerste lid, van de Wet SUWI][ref24], met het oogmerk SyRI in te zetten en waarbij ieder van de
      samenwerkende bestuursorganen en personen tevens partij is bij de Samenwerkingsovereenkomst voor interventieteams;

      cc. SyRI: het systeem risico indicatie, bedoeld in [artikel 65, eerste lid, van de wet][ref25];

      dd. SyRI-project: het project dat met gebruikmaking van SyRI informatie vergaart voor de doelstelling van dat
      project en past binnen het doel, bedoeld in [artikel 64, eerste lid, van de Wet SUWI][ref26];

      ee. verzoek: een verzoek als bedoeld in [artikel 65, eerste lid, van de Wet SUWI][ref27].


