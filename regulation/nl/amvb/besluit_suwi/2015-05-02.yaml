  - number: '2.5'
    text: |-
      1 Het UWV en de colleges van burgemeester en wethouders van de gemeenten die bij een locatie werk en inkomen zijn
      betrokken, stellen een gezamenlijk jaarplan op, waarin op basis van een gedeelde arbeidsmarktanalyse, wordt vermeld
      op welke wijze uitwerking wordt gegeven aan [artikel 2.3.][ref1] en in geval van samenwerking in de vorm van een
      regionale werkplein op welke wijze uitwerking wordt gegeven aan [artikel 2.4][ref2]. Het gezamenlijke jaarplan
      wordt bekend gemaakt op een daartoe ingerichte website.

      2 Het UWV en de colleges van burgemeester en wethouders die bij een locatie werk en inkomen zijn betrokken, stellen
      een gezamenlijk jaarverslag op, waarin verantwoording wordt afgelegd over de onderwerpen uit het jaarplan. Het
      gezamenlijke jaarverslag wordt bekend gemaakt op de website, bedoeld in het eerste lid.

      3 In gezamenlijke tussentijdse verslagen van het UWV en van vertegenwoordigende organisaties van de gemeenten wordt
      gerapporteerd over de behaalde resultaten en de vastgestelde tekortkomingen, en wordt vermeld op welke wijze is
      voldaan aan de invulling van de samenwerking, bedoeld in dit hoofdstuk, en welke verbeteringen in de organisatie
      van de dienstverlening op de locaties werk en inkomen worden aangebracht.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld over het gezamenlijke jaarplan, het gezamenlijke
      jaarverslag en de gezamenlijke tussentijdse verslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel2.3
      [ref2]: https://wetten.overheid.nl/BWBR0013267#Artikel2.4
