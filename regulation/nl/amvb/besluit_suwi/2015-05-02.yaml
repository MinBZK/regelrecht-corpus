  - number: '5.1'
    text: |-
      1 In de polisadministratie worden van de werknemer of de persoon die vrijwillig verzekerd is voor de [ZW][ref1], de
      [Wet WIA][ref2], de [WW][ref3] en de [WAO][ref4] de volgende gegevens verwerkt:

      a. *adresgegevens*: straatnaam, huisnummer, huisnummertoevoeging, postcode, woonplaats, gemeentenaam,
      woonobjectverwijzing en locatieomschrijving;

      b. *postbusadresgegevens*: postbusnummer, postcode, woonplaats, gemeentenaam en locatieomschrijving;

      c. *buitenlandse adresgegevens*: straatnaam, huisnummer, huisnummertoevoeging, postcode, woonplaats,
      locatieomschrijving, regionaam en landcode ISO;

      d. *sociaal verzekeringsnummer buitenland*: verzekeringsnummer en landcode ISO;

      e. *persoonsgegevens*: namen, burgerservicenummer, het administratienummer, bedoeld in
      [artikel 4.9 van de Wet basisregistratie personen][ref5] (A-nummer), geboortedatum, overlijdensdatum, geslacht,
      burgerlijke staat, leefvorm, nationaliteit, verblijfstitel, datum vertrek uit Nederland, indicatie curatelestelling
      en indicatie voor informatiebeveiliging;

      f. *ontheffing wegens gemoedsbezwaren*;

      g. *verzekeringsplicht werknemersverzekeringen*: gegevens inzake de vaststelling verzekeringsplicht, indicaties
      verzekerd en premies voor de werknemersverzekeringen;

      h. *gegevens over de werkgever in de zin van de Wfsv en de inhoudingsplichtige in de zin van de Wet op de
      loonbelasting 1964*: naam en loonheffingennummer;

      i. *gegevens over de inkomstenverhouding*: personeelsnummer, soort inkomstenverhouding, collectieve
      arbeidsovereenkomst, risicopremiegroep, sector, datum begin en einde van inkomstenverhouding, reden einde
      inkomstenverhouding en code invloed verzekeringsplicht;

      j. *loongerelateerde gegevens*: lonen, aantal SV-dagen, aantal verloonde uren, ingehouden loonbelasting
      en premie volksverzekeringen, inkomensafhankelijke bijdrage als bedoeld in [artikel 41 van de ZVW][ref6],
      verzekeringssituatie [ZVW][ref7], andere gegevens van belang voor de heffing van inkomstenbelasting en toegepaste
      kortingen.

      2 In aanvulling op het eerste lid kunnen tevens bij regeling van Onze Minister, in overeenstemming met Onze
      Minister van Financiën, aan te wijzen gegevens worden verwerkt die afkomstig zijn van een werkgever in de zin van
      de [Wfsv][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0019057
