      1 Voor het verstrekken van gegevens en inlichtingen als bedoeld in [artikel 72 van de Wet SUWI][ref1] en
      [artikel 5.4][ref2], aan de ambtenaren, bedoeld in [artikel 5.4][ref3] en de opsporingsambtenaren, bedoeld
