  - number: '4.11'
    text: |-
      1 De werkgever vergoedt aan het UWV 50 procent van de kosten die door het re-integratiebedrijf aan het UWV
      in rekening worden gebracht voor het verrichten van werkzaamheden ter uitvoering van de persoonsgebonden re-
      integratieovereenkomst, tenzij de arbeidsgehandicapte werknemer binnen drie maanden nadat de werkzaamheden ter
      uitvoering van de persoonsgebonden re-integratieovereenkomst zijn geëindigd een dienstbetrekking met een andere
      werkgever is aangegaan en deze arbeidsgehandicapte werknemer voor een aaneengesloten periode van ten minste 26
      weken daadwerkelijk in dienstbetrekking met deze andere werkgever heeft gestaan of met die arbeid in een periode
      van één jaar ten minste gedurende 26 weken inkomsten heeft verworven waardoor hij geen recht meer heeft op
      een uitkering anders dan een arbeidsongeschiktheidsuitkering in verband met het verwerven van die inkomsten of
      verrichten van die arbeid.

      2 Het eerste lid is van overeenkomstige toepassing indien de werknemer voor het verrichten van de werkzaamheden een
      subsidie als bedoeld in deze paragraaf heeft ontvangen.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013267/2015-05-02#Artikel4.11
  - number: '4.12'
    text: |-
      1 Op de aanvraag om een subsidie wordt een beschikking omtrent subsidieverlening gegeven.

      2 In de subsidievoorwaarden bij een beschikking als bedoeld in het eerste lid wordt in elk geval opgenomen dat in
      een overeenkomst die de subsidie-ontvanger met een re-integratiebedrijf sluit wordt geregeld:

      a. de duur van de overeenkomst alsmede de hoogte van de kosten die door het re-integratiebedrijf in rekening zullen
      worden gebracht;

      b. dat de overeenkomst door beide partijen wegens gewichtige redenen tussentijds door opzegging kan worden
      beëindigd;

      c. dat het re-integratiebedrijf verplicht is:

      1º. toegang tot en inzage in alle gegevens te verlenen die een accountant naar zijn oordeel nodig heeft voor het
      instellen van een nader onderzoek als bedoeld in [artikel 42, vierde lid, van de Wet SUWI][ref1];

      2º. de persoonlijke levenssfeer van de personen van wie de inschakeling in de arbeid wordt bevorderd, te beschermen
      overeenkomstig een reglement dat aan die personen en de werkgever wordt overgelegd;

      3º. in geval van een geschil tussen de te re-integreren persoon en het re-integratiebedrijf een klachten- en
      geschillenregeling toe te passen die door het re-integratiebedrijf aan de te re-integreren persoon en de werkgever
      is overgelegd;

      4º. op verzoek aan de werkgever een schriftelijk oordeel van een accountant of een gelijkwaardige deskundige over
      de verwerking van informatie en de genomen maatregelen ter beveiliging van informatie door het re-integratiebedrijf
      over te leggen;

      5º. de gegevens die het re-integratiebedrijf in verband met deze werkzaamheden verkrijgt uitsluitend te verwerken
      voorzover dat noodzakelijk is voor het verrichten van die activiteiten of werkzaamheden dan wel voor de naleving
      van verplichtingen als bedoeld in de subonderdelen 1° tot en met 4°;

      6º. indien dit re-integratiebedrijf deze werkzaamheden laat verrichten door een ander re-integratiebedrijf, in een
      schriftelijke overeenkomst met dat andere re-integratiebedrijf te regelen dat voor dat bedrijf de verplichtingen,
      bedoeld in de subonderdelen 1° tot en met 6°, gelden;

      d. dat het re-integratiebedrijf aan het UWV op verzoek of na toestemming van de subsidie-ontvanger uit eigen
      beweging gegevens verstrekt over de besteding van de subsidie.

      3 Bij ministeriële regeling kunnen regels worden gesteld omtrent het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel42
    url: https://wetten.overheid.nl/BWBR0013267/2015-05-02#Artikel4.12
