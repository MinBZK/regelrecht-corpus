  - number: '5.6'
    text: |-
      Het UWV en de SVB zijn bevoegd uit de onder hun verantwoordelijkheid gevoerde administraties gegevens te
      verstrekken aan buitenlandse bestuursorganen, voorzover die gegevens noodzakelijk zijn voor de vervulling van
      een taak van zwaarwegend algemeen belang waartoe in ieder geval gerekend wordt het verstrekken en vaststellen van
      uitkeringen en het heffen en innen van premies en bijdragen daarvoor.
    url: https://wetten.overheid.nl/BWBR0013267/2015-05-02#Artikel5.6
  - number: '5.7'
    text: |-
      Het UWV en de SVB zijn bevoegd uit eigen beweging en verplicht op verzoek uit de onder hun verantwoordelijkheid
      gevoerde administraties kosteloos te verstrekken:

      a. aan de Belastingdienst de gegevens die noodzakelijk zijn voor de heffing of invordering van enige
      rijksbelasting, van premies sociale verzekeringen als bedoeld in [artikel 2, onderdelen a en c, van de Wfsv][ref1]
      en van de inkomensafhankelijke bijdrage, bedoeld in de [ZVW][ref2];

      b. aan de zorgverzekeraars, bedoeld in de [Zorgverzekeringswet][ref3], en het Zorginstituut, de zorgautoriteit,
      Wlz-uitvoerders en het het CAK, bedoeld in de [Wet langdurige zorg][ref4] de gegevens voor zover die noodzakelijk
      zijn voor de uitvoering van de Zorgverzekeringswet en de Wet langdurige zorg;

      c. aan Onze Minister van Onderwijs, Cultuur en Wetenschap dan wel, voor zover het betreft het onderwijs of
      onderzoek op het gebied van de landbouw en de natuurlijke omgeving, Onze Minister van Landbouw, Natuur en
      Voedselkwaliteit de gegevens die noodzakelijk zijn voor de uitvoering van bij of krachtens een onderwijswet aan hen
      opgedragen taken, alsmede aan Onze Minister voor Wonen, Wijken en Integratie de gegevens die noodzakelijk zijn voor
      de uitvoering van de [Wet inburgering][ref5];

      d. aan de Pensioen- en Uitkeringsraad, bedoeld in de
      [Wet uitvoering wetten voor verzetsdeelnemers en oorlogsgetroffenen][ref6], de gegevens die noodzakelijk zijn voor
      de uitvoering van die wet;

      e. aan de raden voor de kinderbescherming de gegevens die noodzakelijk zijn voor een goede uitoefening van hun
      taak of van hun bevoegdheden op grond van één van de bepalingen van de [titels 9][ref7], [10][ref8], [13][ref9],
      [14][ref10], [15][ref11] en [17 van Boek 1 van het Burgerlijk Wetboek][ref12];

      f. aan de Kamer van Koophandel de gegevens die nodig zijn voor de uitvoering van
      [hoofdstuk 3 van de Handelsregisterwet 2007][ref13] opgedragen taken;

      g. aan Onze Minister van Veiligheid en Justitie de gegevens die noodzakelijk zijn voor de tenuitvoerlegging van
      vrijheidsstraffen en vrijheidsbenemende maatregelen.


