  - number: 5.2b
    text: |-
      1 Indien een betrokkene op wie de gegevens betrekking hebben bij het indienen van de aanvraag, bedoeld
      in [artikel 30c, eerste lid, van de Wet SUWI][ref1] dan wel een aanvraag voor een uitkering als
      bedoeld in [artikel 30, eerste lid, van de Wet SUWI][ref2], op grond van de informatie, bedoeld in
      [artikel 5.2a, tweede lid][ref3], vaststelt, dat de gegevens niet juist of niet volledig zijn, kan hij het UWV dan
      wel het desbetreffende college van burgemeester en wethouders verzoeken bij de uitvoering van gegevensverwerking
      als bedoeld in [artikel 62 van de Wet SUWI][ref4] zorg te dragen voor verbetering, aanvulling of verwijdering van
      deze gegevens.

      2 Indien het UWV en de colleges van burgemeester en wethouders voor de verwerking van die gegevens geen
      verantwoordelijke in de zin van de [Wet bescherming persoonsgegevens][ref5] zijn, wordt het verzoek onverwijld
      gezonden naar de verantwoordelijk in de zin van de [Wet bescherming persoonsgegevens][ref6] om dit aan te merken
      als een verzoek als bedoeld in [artikel 36 van de Wet bescherming persoonsgegevens][ref7] of een daarmee op grond
      van de toepasselijke wetgeving gelijk te stellen verzoek.

      3 Bij het desbetreffende gegeven wordt aangetekend, dat het gegeven in onderzoek is.


