  - number: 5a.1
    text: |-
      1 Indien het verzoek van het samenwerkingsverband voldoet aan de voorwaarden, bedoeld in het tweede tot en met
      vierde lid, en uit de in het zesde lid bedoelde prioritering blijkt dat er voldoende capaciteit beschikbaar is
      voor de koppeling, bedoeld in [artikel 5a.2][ref1], en de analyse, bedoeld in [artikel 5a.3][ref2], verwerkt Onze
      Minister de gegevens, bedoeld in [artikel 64, tweede lid, van de Wet SUWI][ref3] in SyRI.

      2 Uit het verzoek blijkt in ieder geval:

      a. met welke bestuursorganen en personen in het kader van [artikel 64, eerste lid, van de Wet SUWI][ref4] ten
      behoeve van het SyRI-project wordt samengewerkt, wat de concrete doelstelling van de samenwerking is, hoe de
      samenwerking is georganiseerd en vormgegeven, en de beoogde aanvangsdatum en de duur van het SyRI-project;

      b. welke concrete gegevens door de bestuursorganen en personen van het samenwerkingsverband zullen worden
      aangeleverd;

      c. de beoogde wijze van terugkoppeling van de risicomeldingen door Onze Minister, en

      d. op welke indicatoren en welk risicomodel het verzoek betrekking heeft.

      3 Voor verwerking in SyRI komen uitsluitend een of meer van de volgende categorieën gegevens in aanmerking:

      a. arbeidsgegevens, zijnde gegevens waarmee een door een persoon verrichte werkzaamheden vastgesteld kunnen worden;

      b. gegevens inzake bestuursrechtelijke maatregelen en sancties, zijnde gegevens waaruit blijkt dat een natuurlijke
      persoon of een rechtspersoon een bestuursrechtelijke boete opgelegd heeft gekregen dan wel dat een andere
      bestuursrechtelijke maatregel is getroffen;

      c. fiscale gegevens, zijnde gegevens waarmee de fiscale verplichtingen van een natuurlijk persoon of rechtspersoon
      kunnen worden vastgesteld;

      d. gegevens roerende en onroerende goederen, zijnde gegevens waarmee het bezit en het gebruik van bepaalde goederen
      door een natuurlijk persoon of rechtspersoon kunnen worden vastgesteld;

      e. gegevens over uitsluitingsgronden van bijstand of uitkeringen, zijnde gegevens waaruit blijkt dat een persoon
      niet in aanmerking komt voor een uitkering;

      f. handelsgegevens, zijnde gegevens waarmee de aard en werkzaamheden van een rechtspersoon kunnen worden
      vastgesteld;

      g. huisvestingsgegevens, zijnde gegevens waarmee de (daadwerkelijke) verblijfs- of vestigingsplaats van een
      natuurlijk persoon of rechtspersoon kunnen worden vastgesteld;

      h. identificerende gegevens, zijnde bij een natuurlijk persoon: naam, adres, woonplaats, postadres,
      geboortedatum, geslacht en administratieve kenmerken en bij een rechtspersoon: naam, adres, postadres, rechtsvorm,
      vestigingsplaats en administratieve kenmerken;

      i. inburgeringsgegevens, zijnde gegevens waarmee kan worden vastgesteld of aan een persoon
      inburgeringsverplichtingen zijn opgelegd;

      j. nalevingsgegevens, zijnde gegevens waarmee de nalevingshistorie van wet- en regelgeving van een natuurlijk
      persoon of rechtspersoon kan worden vastgelegd;

      k. onderwijsgegevens, zijnde gegevens waarmee de financiële ondersteuning ten behoeve van de bekostiging van
      onderwijs kan worden vastgesteld;

      l. pensioengegevens, zijnde gegevens waarmee de pensioenrechten kunnen worden vastgesteld;

      m. re-integratiegegevens, zijnde uitsluitend de gegevens waarmee kan worden vastgesteld of aan een persoon re-
      integratieverplichtingen zijn opgelegd en of deze worden nageleefd;

      n. schuldenlastgegevens, zijnde gegevens waarmee de eventuele schulden van een natuurlijk persoon of rechtspersoon
      kunnen worden vastgesteld;

      o. uitkerings-, toeslagen- en subsidiegegevens, zijnde gegevens waarmee de financiële ondersteuning van een
      natuurlijk persoon of rechtspersoon kan worden vastgesteld;

      p. vergunningen en ontheffingen, zijnde gegevens waarmee kan worden bepaald voor welke activiteiten een natuurlijk
      persoon of rechtspersoon toestemming heeft gevraagd of verkregen;

      q. zorgverzekeringsgegevens, zijnde uitsluitend de gegevens waarmee kan worden vastgesteld of een persoon is
      verzekerd voor de Zorgverzekeringswet.

      4 Voorts blijkt uit het verzoek, dat ieder van de bestuursorganen en personen, bedoeld in
      [artikel 64, eerste lid, van de wet][ref5]:

      a. met het verzoek instemt;

      b. de voorgenomen bestandslevering heeft getoetst aan de gegevens die nodig zijn voor de risico analyses, ten
      behoeve van het doel van het SyRI-project, waaronder het doel in [artikel 64, eerste lid, van de Wet SUWI][ref6];

      c. heeft onderbouwd dat een mogelijke aantasting van de belangen van de natuurlijke personen of rechtspersonen op
      wie de verwerking van gegevens betrekking heeft niet onevenredig is in verhouding tot het doel dat met de inzet van
      SyRI wordt beoogd;

      d. alleen die gegevens verstrekt, die voor de risicoanalyses, bedoeld in
      [artikel 65, eerste lid, van de Wet SUWI][ref7] nodig zijn, en

      e. in redelijkheid geen minder ingrijpende wijze voor de betrokken personen of rechtspersonen kan hanteren om het
      doel dat met de inzet van SyRI wordt beoogd, te bereiken.

      5 Voor zover een bestuursorgaan dat of een persoon die deel uitmaakt van een samenwerkingsverband voor een SyRI-
      project niet beschikt over de noodzakelijke gegevens, bedoeld in [artikel 64, tweede lid, van de Wet SUWI][ref8] is
      het vierde lid, onderdelen b tot en met e, niet van toepassing.

      6 Onze Minister stelt een prioritering van de analysecapaciteit voor SyRI vast.

      7 Onze Minister stelt een of meer risicomodellen vast.

      8 Bij ministeriële regeling kunnen nadere regels worden gesteld over de wijze waarop het verzoek door het
      samenwerkingsverband wordt opgesteld en ingediend en de inhoud van dit verzoek.


