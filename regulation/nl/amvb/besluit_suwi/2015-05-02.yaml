      1 Ten aanzien van de arbeidsbeperkte die wordt opgenomen in de registratie van arbeidsbeperkten, bedoeld in
      [artikel 38d van de Wfsv][ref1], worden de volgende gegevens vastgelegd:

      a. het burgerservicenummer;

      b. de aanduiding of hij een arbeidsbeperkte is als bedoeld in
      [artikel 38b, eerste lid, onderdeel a, onderdeel b, onderscheidenlijk onderdeel c, van de Wfsv][ref2], of de
      aanduiding dat hij een arbeidsbeperkte is op grond van [artikel 38f, vijfde lid, van de Wfsv][ref3];

      c. de datum van registratie;

      d. voor zover van toepassing de datum waarop de registratie eindigt.

      2 De registratie van een arbeidsbeperkte is geldig zolang wordt voldaan aan de voorwaarden, bedoeld in
      [artikel 38b, eerste lid, van de Wfsv][ref4], of zolang sprake is van een gelijkgestelde arbeidsbeperkte als
      bedoeld in [artikel 38f, vijfde lid, van de Wfsv][ref5], met dien verstande dat de registratie eindigt ten aanzien
      van:

      a. de arbeidsbeperkte, bedoeld in [artikel 38b, eerste lid, onderdeel a, en onderdeel b, van de Wfsv][ref6], en
      de gelijkgestelde arbeidsbeperkte op grond van [artikel 38f, vijfde lid, van de Wfsv][ref7] die niet meer aan
      de voorwaarden voldoet, op 31 december van het tweede kalenderjaar volgend op de datum waarop niet meer aan de
      voorwaarden wordt voldaan;

      b. de arbeidsbeperkte, bedoeld in [artikel 38b, eerste lid, onderdeel c, van de Wfsv][ref8], die niet meer
      aan de voorwaarden voldoet, op 31 december van het tweede kalenderjaar volgend op de datum waarop niet meer
      aan de voorwaarden wordt voldaan, tenzij hij voor die datum wederom recht heeft op arbeidsondersteuning of een
      arbeidsongeschiktheidsuitkering op grond van de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref9].


