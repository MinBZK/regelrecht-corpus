  - number: '2.1'
    text: |-
      1 Onze Minister kan een besluit van het UWV of de SVB om andere werkzaamheden dan de in de [Wet SUWI][ref1]
      bedoelde taken uit te voeren uitsluitend goedkeuren, indien:

      a. de goede uitvoering van de in die wet bedoelde taken daardoor niet in gevaar komt;

      b. de andere werkzaamheden in opdracht en voor rekening en risico van de opdrachtgever worden uitgevoerd;

      c. de taakuitoefening van de Inspectie Werk en Inkomen met betrekking tot het toezicht op de uitvoering van de
      wetten door het UWV en de SVB, bedoeld in [artikel 37, onderdeel a, van de Wet SUWI][ref2] voldoende gewaarborgd
      is;

      d. de [Wet op het financieel toezicht][ref3] in acht wordt genomen voor zover deze van toepassing is;

      e. de uitvoering van die andere werkzaamheden gescheiden van de uitvoering van de wettelijke taken plaatsvindt,
      voor zover de andere werkzaamheid niet noodzaakt tot een gezamenlijke uitvoering.

      2 Het UWV, onderscheidenlijk de SVB, meldt de werkzaamheden, bedoeld in
      [artikel 5, vierde lid, van de Wet SUWI][ref4], binnen een termijn van vier weken na aanvang van die werkzaamheden.

      3 Bij ministeriële regeling worden regels gesteld omtrent de berekening van de prijzen die voor het verrichten van
      andere werkzaamheden in rekening worden gebracht.


