  - number: '3.5'
    text: |-
      1 Het UWV verricht op verzoek van het college van burgemeester en wethouders een beoordeling of een persoon,
      bedoeld in [artikel 38b, eerste lid, onderdeel a, van de Wfsv][ref1] in staat is het wettelijk minimumloon, bedoeld
      in [artikel 2, onderdeel c, van de Participatiewet][ref2] te verdienen.

      2 Bij ministeriële regeling kunnen regels worden gesteld voor de vergoeding van de kosten van de beoordeling,
      bedoeld in het eerste lid, door het college van burgemeester en wethouders aan het UWV.

      3 In het kader van de beoordeling, bedoeld in het eerste lid, wordt door het UWV het arbeidsvermogen van de
      betrokken persoon beoordeeld.

      4 Het arbeidsvermogen, bedoeld in het derde lid, wordt getoetst aan de methodiek van drempelfuncties die het UWV
      hanteert bij de beoordeling van arbeidsongeschiktheid.

      5 Onder een drempelfunctie als bedoeld in het vierde lid wordt verstaan een bestaande functie op de Nederlandse
      arbeidsmarkt die de ondergrens van de verdiencapaciteit markeert, met een minimale belasting waardoor deze geschikt
      is voor mensen met beperkingen.

      6 Indien uit de analyse, bedoeld in het derde lid en vierde lid, blijkt dat een persoon geen drempelfunctie of
      voor een deel één drempelfunctie kan uitvoeren wordt de persoon niet geacht in staat te zijn het minimumloon te
      verdienen met dien verstande dat de beperkingen of belemmeringen die een persoon ondervindt naar verwachting nog
      ten minste voor 6 maanden na de beoordeling zullen bestaan.

      7 Indien uit de analyse, bedoeld in het derde lid en vierde lid, blijkt dat een persoon één drempelfunctie kan
      uitvoeren of één drempelfunctie kan uitvoeren met behulp van aanpassingen of begeleiding wordt de persoon geacht in
      staat te zijn het minimumloon te verdienen.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel38b
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel2
    url: https://wetten.overheid.nl/BWBR0013267/2015-05-02#Artikel3.5
