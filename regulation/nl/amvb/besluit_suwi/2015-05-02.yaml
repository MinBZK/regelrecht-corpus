        paragraaf: '4.3'
  - number: '4.18'
    text: |-
      Het sluiten van een persoonsgebonden re-integratieovereenkomst kan in ieder geval worden geweigerd in de gevallen,
      bedoeld in [artikel 4:35 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel435
