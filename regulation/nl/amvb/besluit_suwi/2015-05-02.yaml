  - number: '2.6'
    text: |-
      1 Ten behoeve van geïntegreerde dienstverlening dragen het UWV en de colleges van burgemeester en wethouders zorg
      voor de gezamenlijke verwerking van gegevens, bedoeld in [artikel 62, derde lid, van de Wet SUWI][ref1].

      2 Het UWV en de colleges van burgemeester en wethouders dragen gezamenlijk zorg voor de inrichting van een
      landelijk systeem voor de verwerking van gegevens die betrekking hebben op geïntegreerde dienstverlening
      aan werkzoekenden op het gebied van werk en aan werkgevers in verband met melding van vacatures, en voor
      het beschikbaar maken van informatie voor beleidsvorming, statistiek en management over de inzet van re-
      integratievoorzieningen.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld over de inrichting van het landelijk systeem en
      de gegevensset.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel62
