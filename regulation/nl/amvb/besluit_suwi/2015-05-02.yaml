  - number: '4.8'
    text: |-
      1 Het UWV kan op een aanvraag als bedoeld in [artikel 2.7a van de Wet IWIA][ref1] een subsidie verstrekken
      ter voldoening van de noodzakelijk te maken kosten van werkzaamheden die zijn gericht op behoud, herstel of
      bevordering van mogelijkheden tot het verrichten van arbeid, waaronder begrepen het behouden en verkrijgen van een
      dienstbetrekking, of een persoonsgebonden re-integratieovereenkomst sluiten ter uitvoering van die werkzaamheden.

      2 Onder werkzaamheden als bedoeld in het eerste lid worden uitsluitend verstaan:

      a. begeleiding en advisering;

      b. opleiding;

      c. arbeidsbemiddeling en andere werkzaamheden die, in aansluiting op de onder a en b bedoelde werkzaamheden, zijn
      gericht op behoud, herstel of bevordering van mogelijkheden tot het verrichten van arbeid.

      3 Kosten van werkzaamheden die niet zijn beschreven in het in [artikel 4.10, onderdeel b][ref2], bedoelde
      trajectplan komen niet voor subsidiëring in aanmerking en ter uitvoering van die werkzaamheden wordt geen
      persoonsgebonden re-integratieovereenkomst gesloten, tenzij het UWV voor het verrichten van die werkzaamheden
      schriftelijk goedkeuring heeft verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0019058#Artikel2.7a
      [ref2]: https://wetten.overheid.nl/BWBR0013267#Artikel4.10
    url: https://wetten.overheid.nl/BWBR0013267/2015-05-02#Artikel4.8
