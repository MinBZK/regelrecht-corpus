  - number: 4.1a
    text: |-
      Het UWV heeft de taak, bedoeld in [artikel 30a, eerste lid, van de Wet SUWI][ref1] ten aanzien van
      de werknemer, die recht heeft op een WGA-uitkering in de zin van de [Wet WIA][ref2] als bedoeld in
      [artikel 82, eerste lid, van de Wet WIA][ref3], en die op de eerste dag van arbeidsongeschiktheid tot werken in
      een dienstbetrekking stond van een eigenrisicodrager als bedoeld in de Wet WIA waarbij die dag gelegen is vóór de
      dag van ingang van het eigenrisicodragen, indien die eigenrisicodrager een kleine of middelgrote werkgever is als
      bedoeld in [artikel 2.5, eerste lid, onderdelen b en c, van het Besluit Wfsv][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
