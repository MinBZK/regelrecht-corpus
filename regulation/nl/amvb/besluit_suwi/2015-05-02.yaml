  - number: '2.3'
    text: |-
      1 De bestuursorganen en organisaties, genoemd in [artikel 10a van de Wet SUWI][ref1], maken afspraken over
      de wijze van betrokkenheid van die organisaties bij de samenwerking van de bestuursorganen, bedoeld in de
      [artikelen 9][ref2] en [10 van de Wet SUWI][ref3].

      2 De afspraken, bedoeld in het eerste lid, zien in ieder geval op:

      a. de samenwerkingsvorm en inrichting van het samenwerkingsverband, waarbij ten minste aandacht wordt besteed aan
      de inrichting van het bestuur, de regeling van het voorzitterschap, en de taken en verantwoordelijkheden van alle
      betrokkenen;

      b. de wijze waarop de betrokken colleges van burgemeester en wethouders het voorzitterschap van het bestuur
      verzorgen;

      c. de wijze waarop de regionale uitvoering van de gemaakte afspraken wordt geregeld en de wijze waarop wordt
      aangesloten bij de bestaande regionale samenwerking;

      d. de wijze waarop wordt omgegaan met de afzonderlijke van toepassing zijnde verordeningen die door de
      afzonderlijke gemeenteraden zijn vastgesteld op grond van de [artikelen 6, tweede lid][ref4], [8a][ref5] en
      [47 van de Participatiewet][ref6];

      e. de wijze waarop inzicht wordt geboden in de registratie van werkzoekenden met behulp van de elektronische
      voorzieningen, bedoeld in [artikel 10, eerste lid, van de Wet SUWI][ref7];

      f. de wijze waarop namens de colleges van burgemeester en wethouders taken op grond van
      [artikel 7 van de Participatiewet][ref8] worden uitgevoerd in het samenwerkingsverband in relatie tot de uitvoering
      van de andere taken op grond van artikel 7 van de Participatiewet, waarbij ten minste aandacht wordt besteed aan de
      verantwoording aan de afzonderlijke gemeenteraden;

      g. de wijze waarop de werkgeversdienstverlening wordt ingericht;

      in relatie tot de bestaande structuur op grond van de [Wet SUWI][ref9], waaronder tenminste wordt verstaan de
      werkgeversdienstverlening in het werkgeversservicepunt;

      h. de wijze waarop de financiële betrokkenheid van werkgevers wordt geregeld; en

      i. eisen waaraan een methode ter vaststelling van de loonwaarde als bedoeld in
      [artikel 2, tweede lid, van het Besluit loonkostensubsidie Participatiewet][ref10] voldoet.

      3 Het samenwerkingsverband stelt een marktbewerkingsplan op, waarin een beschrijving wordt gegeven
      van de kenmerken van de personen die behoren tot de doelgroep van arbeidsbeperkten als bedoeld in
      [artikel 38b van de Wet financiering sociale verzekeringen][ref11], in de regio, de mogelijkheden van die personen,
      waarin een analyse is opgenomen van de sectoren en bedrijven waar vacatures voor deze personen bestaan of kunnen
      worden gecreëerd en waarin de afspraken zijn opgenomen over de wijze van aanlevering en bemiddeling van die
      personen.

      4 Het samenwerkingsverband draagt iedere twee jaar, te beginnen in 2016, zorg voor een evaluatie van de
      samenwerking.


