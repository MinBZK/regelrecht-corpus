  - number: '5.8'
    text: |-
      De SVB is bevoegd op verzoek uit de onder zijn verantwoordelijkheid gevoerde administratie kosteloos aan de Stichting
      Administratie Indonesische Pensioenen de gegevens te verstrekken die noodzakelijk zijn voor de uitvoering van de
      __REF000___________________________________________________________________________________________________________
      ________________________________________________________ en overeenkomstige wet- en regelgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0002180
    url: https://wetten.overheid.nl/BWBR0013267/2015-05-02#Artikel5.8
    references:
      - id: ref1
        bwb_id: BWBR0002180
  - number: '5.9'
    text: |-
      1 Het UWV is bevoegd uit eigen beweging en verplicht op verzoek uit de onder zijn verantwoordelijkheid gevoerde
      administraties kosteloos te verstrekken:

      a. aan het Vervangingsfonds, bedoeld in
      [artikel 1, onderdeel e, van het Besluit Vervangingsfonds en Participatiefonds][ref1], de gegevens die
      noodzakelijk zijn voor de uitvoering van zijn taak op grond van de [Wet op het primair onderwijs][ref2], de
      [Wet op het voortgezet onderwijs][ref3] en de [Wet op de expertisecentra][ref4];

      b. aan het Participatiefonds, bedoeld in
      [artikel 1, onderdeel f, van het Besluit Vervangingsfonds en Participatiefonds][ref5], de gegevens die
      noodzakelijk zijn voor de uitvoering van zijn taak op grond van de [Wet op het primair onderwijs][ref6], de
      [Wet op het voortgezet onderwijs][ref7] en de [Wet op de expertisecentra][ref8];

      c. aan Onze Minister van Onderwijs, Cultuur en Wetenschap de gegevens die noodzakelijk zijn voor de bekostiging
      van onderwijsinstellingen;

      d. aan de Sociaal Economische Raad de gegevens die noodzakelijk zijn voor de uitvoering van bij of krachtens enige
      wet aan die Raad opgedragen taken;

      e.

      f. aan colleges van burgemeester en wethouders de gegevens die noodzakelijk zijn ten behoeve van de
      registratie van gegevens, bedoeld in [artikel 118h van de Wet op het voortgezet onderwijs][ref9],
      [artikel 8.3.2 van de Wet educatie en beroepsonderwijs][ref10] en
      [artikel 162b van de Wet op de expertisecentra][ref11] in verband met de doorverwijzing van voortijdige
      schoolverlaters naar onderwijs of arbeidsmarkt;

      g. aan colleges van burgemeester en wethouders de gegevens die noodzakelijk zijn voor het verlenen van
      kwijtschelding van gemeentelijke belastingen, bedoeld in [artikel 255 van de Gemeentewet][ref12], en aan de
      dagelijkse besturen van de waterschappen de gegevens die noodzakelijk zijn voor het verlenen van kwijtschelding van
      waterschapsbelastingen, bedoeld in [artikel 144 van de Waterschapswet][ref13];

      h. aan Onze Minister van Economische Zaken, de gegevens die noodzakelijk
      zijn voor de uitvoering van de S&O-afdrachtvermindering, bedoeld in
      [hoofdstuk VIII van de Wet vermindering afdracht loonbelasting en premie voor de volksverzekeringen][ref14];

      i. aan een college van burgemeester en wethouders, adresgegevens, waaronder adresgegevens die worden verwerkt voor
      de doelen, genoemd in [artikel 33, tweede lid, onderdelen a, b, en c van de Wet SUWI][ref15], die noodzakelijk zijn
      voor het bijhouden van persoonsgegevens in de basisregistratie personen.

      2 Het UWV is bij de verwerking van gegevens voor de uitvoering van de taak, die krachtens de
      [Wet arbeid vreemdelingen][ref16] aan het UWV is opgedragen, bevoegd uit eigen beweging en verplicht op verzoek aan
      colleges van burgemeester en wethouders gegevens te verstrekken die noodzakelijk zijn in verband met de taken die
      voortvloeien uit de [Huisvestingswet 2014][ref17] en de [Woningwet][ref18].

      3 Het UWV is verplicht op verzoek uit de onder zijn verantwoordelijkheid gevoerde administraties kosteloos te
      verstrekken aan een deurwaarder die gerechtigd is tegen een schuldenaar executoriaal beslag onder derden te leggen
      de gegevens die ten behoeve van het leggen van dit beslag noodzakelijk zijn voor het vaststellen van de identiteit
      van degene die periodieke betalingen aan de schuldenaar verricht.

      4 Het UWV is verplicht op verzoek uit de onder zijn verantwoordelijkheid gevoerde administratie kosteloos
      te verstrekken aan Onze Minister en de colleges van burgemeester en wethouders de gegevens van personen die
      werknemer zijn van een houder van een kinderopvangvoorziening of peuterspeelzaal die noodzakelijk zijn voor het
      toezicht op de naleving van de kwaliteitseisen, bedoeld in [hoofdstuk 1, afdeling 3, paragraaf 2][ref19] en in
      [hoofdstuk 2, afdeling 2, paragraaf 2, van de Wet kinderopvang en kwaliteitseisen peuterspeelzalen][ref20] die deze
      wet aan de exploitatie van kinderopvangvoorzieningen of peuterspeelzalen stelt.

      5 In verband met het systematisch verstrekken van gegevens als bedoeld in [artikel 5.11][ref21] kunnen bij
      ministeriële regeling nadere regels worden gesteld omtrent de wijze waarop en de vorm waarin de adresgegevens,
      bedoeld in het eerste lid, onderdeel i, verstrekt worden.


