        artikel: '65'
  - number: 5a.7
    text: |-
      1 De bewerker respectievelijk Onze Minister stelt bij vernietiging van gegevens als bedoeld in
      [artikel 5a.2, vierde lid][ref1], respectievelijk [artikel 5a.3, derde en vijfde lid][ref2], en
      [artikel 5a.5, vijfde lid][ref3], ter zake een proces-verbaal van vernietiging op waarin staat op welke wijze de
      gegevens zijn vernietigd alsmede de datum waarop en de locatie waar de vernietiging heeft plaatsgevonden.

      2 Het proces-verbaal, bedoeld in het eerste lid, wordt door de bewerker respectievelijk Onze Minister ter
      kennisname aan het samenwerkingsverband verzonden.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel5a.2
      [ref2]: https://wetten.overheid.nl/BWBR0013267#Artikel5a.3
      [ref3]: https://wetten.overheid.nl/BWBR0013267#Artikel5a.5
