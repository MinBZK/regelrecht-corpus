        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '4.14'
    text: |-
      1 Het UWV kan aan de subsidie-ontvanger voorschotten op de vast te stellen subsidie verlenen aan de hand van aan
      het UWV overgelegde declaraties voor de werkzaamheden, die voortvloeien uit het trajectplan.

      2 Indien het UWV besluit tot het verlenen van voorschotten, betaalt het UWV de voorschotten binnen één week na het
      nemen van dat besluit aan de subsidie-ontvanger of aan het re-integratiebedrijf, waarmee de subsidie-ontvanger een
      overeenkomst heeft gesloten.
    url: https://wetten.overheid.nl/BWBR0013267/2015-05-02#Artikel4.14
  - number: '4.15'
    text: |-
      1 De subsidie-ontvanger dient iedere drie maanden bij het UWV een rapportage in waarin een beschrijving is
      opgenomen van de ten behoeve van de subsidie-ontvanger verrichte werkzaamheden, bedoeld in [artikel 4.8][ref1].
      In de rapportage worden in ieder geval de resultaten van de uitvoering van het trajectplan en de prognose voor
      de resterende periode van het traject beschreven en wordt een overzicht gegeven van de tot op dat moment gemaakte
      kosten.

      2 De subsidie-ontvanger verstrekt onverwijld en uit eigen beweging alle gegevens en inlichtingen omtrent
      voortijdige beëindiging van gesubsidieerde trajecten aan het UWV.

      3 De subsidie-ontvanger verstrekt op verzoek aan het UWV alle gegevens en inlichtingen die van belang zijn voor
      de vaststelling van de rechtmatigheid en doelmatigheid van de uitvoering van [artikel 2.7a van de Wet IWIA][ref2],
      alsmede binnen vier weken alle hem betreffende informatie die noodzakelijk is voor de evaluatie van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4.8
      [ref2]: https://wetten.overheid.nl/BWBR0019058#Artikel2.7a
