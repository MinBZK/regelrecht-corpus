      voor de opsporing van feiten strafbaar gesteld bij de [Wet SUWI][ref7] of enig andere wet.

      2 Voor het verstrekken van gegevens als bedoeld in [artikel 73, zesde lid, van de Wet SUWI][ref8] aan het UWV,
      de SVB en de colleges van burgemeester en wethouders, maken de ambtenaren en opsporingsambtenaren gebruik van
