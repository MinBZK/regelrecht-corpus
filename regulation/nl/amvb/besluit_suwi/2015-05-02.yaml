        artikel: '42'
  - number: '4.13'
    text: |-
      1 De subsidie bedraagt ten hoogste een bij ministeriële regeling vastgesteld bedrag.

      2 De subsidie wordt verleend voor werkzaamheden als bedoeld in [artikel 4.8][ref1] gedurende een tijdvak van ten
      hoogste een jaar.

      3 Indien de aanvrager van een subsidie of de subsidie-ontvanger aantoont dat de noodzakelijke kosten van de
      werkzaamheden die zijn gericht op behoud, herstel of bevordering van mogelijkheden tot het verrichten van arbeid
      hoger zijn dan het in het eerste lid bedoelde bedrag of die werkzaamheden langer zullen duren dan een tijdvak van
      een jaar, kan subsidie worden verleend voor een hoger bedrag of een langere periode.

      4 De in het derde lid bedoelde bevoegdheid bestaat uitsluitend indien het in het eerste lid bedoelde bedrag of
      de in het tweede lid bedoelde werkzaamheden gedurende een tijdvak van een jaar redelijkerwijs niet zullen kunnen
      leiden tot behoud, herstel of bevordering van mogelijkheden tot het verrichten van arbeid.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4.8
    url: https://wetten.overheid.nl/BWBR0013267/2015-05-02#Artikel4.13
