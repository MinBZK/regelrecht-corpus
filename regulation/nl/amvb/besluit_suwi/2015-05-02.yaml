  - number: '2.4'
    text: |-
      1 Het UWV wijst in evenwichtig gespreide regio’s locaties werk en inkomen aan, waar vorm wordt gegeven aan
      regionale samenwerking ten behoeve van arbeidsmarktbeleid.

      2 Het college van burgemeester en wethouders van de gemeente waarin een locatie werk en inkomen als bedoeld in
      het eerste lid is gevestigd, draagt zorg voor de totstandkoming, organisatie en ondersteuning van een regionaal
      netwerk van werk, inkomen en scholing, waarin periodiek overleg wordt gevoerd over afstemming van regionale
      arbeidsmarktvraagstukken en uitvoering van regionale arbeidsmarktprojecten.

      3 Aan het regionale netwerk, bedoeld in het tweede lid, wordt in ieder geval deelgenomen door werkgevers of
      vertegenwoordigers daarvan, organisaties van werknemers, instanties als bedoeld in [artikel 2.3, tweede lid][ref1],
      het UWV en alle gemeenten uit de regio. De deelnemers van het regionale netwerk kiezen uit hun midden een
      voorzitter, die de activiteiten van het netwerk coördineert.

      4 Het UWV en het college van burgemeester en wethouders van de gemeente waarin een locatie werk en inkomen, bedoeld
      in het eerste lid, is gevestigd, dragen zorg voor:

      a. uitvoering van regionale taken, waaronder uitvoering van [artikel 30d van de Wet SUWI][ref2] en werkzaamheden,
      bedoeld in [artikel 5, vierde lid, van de Wet SUWI][ref3], en regionale dienstverlening aan werkgevers;

      b. regionale arbeidsmarktanalyse.

      5 Bij ministeriële regeling kunnen regels worden gesteld over de aanwijzing en spreiding van de locaties werk en
      inkomen als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel2.3
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30d
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel5
