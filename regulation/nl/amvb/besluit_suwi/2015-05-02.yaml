  - number: '5.16'
    text: |-
      Eigenrisicodragers, die het risico dragen van de betaling van uitkeringen aan personen, ten aanzien van wie op
      grond van [artikel 7, eerste lid, onderdeel a, van de Participatiewet][ref1] een verantwoordelijkheid bestaat,
      verstrekken op verzoek aan colleges van burgemeester en wethouders opgaven en inlichtingen die noodzakelijk zijn
      voor de uitvoering van [artikel 7, eerste lid, onderdeel a, van de Participatiewet][ref2] ten aanzien van die
      personen.


