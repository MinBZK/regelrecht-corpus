      [ref1]: https://wetten.overheid.nl/BWBR0004806#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002032
      [ref3]: https://wetten.overheid.nl/BWBR0002035
      [ref4]: https://wetten.overheid.nl/BWBR0003968
      [ref5]: https://wetten.overheid.nl/BWBR0002844
