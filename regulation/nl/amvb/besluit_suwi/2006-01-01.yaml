      [artikel 1, eerste lid, onderdeel b, van de Algemene Wet Bijzondere Ziektekosten][ref1],
      het centraal administratiekantoor, bedoeld in
      [artikel 1, onderdeel b, van het Administratiebesluit Bijzondere Ziektekostenverzekering][ref2]
      en de verbindingskantoren, bedoeld in
      [artikel 1, onderdeel c, van het Administratiebesluit Bijzondere Ziektekostenverzekering][ref3]
      de gegevens voorzover die noodzakelijk zijn voor de uitvoering van de [ZVW][ref4] en de
      [Algemene Wet Bijzondere Ziektekosten][ref5];


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003585#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0003585#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0018450
      [ref5]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.7
