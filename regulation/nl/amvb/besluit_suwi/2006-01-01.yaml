  - number: 5.9.c
    text: |-
      aan Onze Minister van Onderwijs, Cultuur en Wetenschap de gegevens die noodzakelijk zijn voor de bekostiging van
      onderwijsinstellingen;
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.9
  - number: 5.9.d
    text: |-
      aan de Sociaal Economische Raad de gegevens die noodzakelijk zijn voor de uitvoering van bij of krachtens enige wet
      aan die Raad opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.9
  - number: '5.10'
    text: |-
      De CWI is bevoegd uit eigen beweging en verplicht op verzoek uit de onder haar verantwoordelijkheid gevoerde
      administratie kosteloos te verstrekken:
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.10
  - number: 5.10.a
    text: |-
      aan een indicatieorgaan als bedoeld in [artikel 9a, eerste lid, van de Algemene Wet Bijzondere Ziektekosten][ref1]
      de gegevens die noodzakelijk zijn in verband met taken die voortvloeien uit de Wet sociale werkvoorziening en de
      [Algemene Wet Bijzondere Ziektekosten][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel9a
      [ref2]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.10
