        paragraaf: '5.3'
      - id: ref3
        bwb_id: BWBR0011468
        artikel: '16'
      - id: ref4
        bwb_id: BWBR0011468
        artikel: '21'
  - number: 5.12.1
    text: |-
      Het UWV is bevoegd op verzoek uit de onder zijn verantwoordelijkheid gevoerde administraties aan derden als bedoeld
      in [artikel 13, vierde lid][ref1], en in [artikel 73, eerste lid, van de Wet SUWI][ref2], de volgende van de
      rijksbelastingdienst afkomstige gegevens te verstrekken:


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel73
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.12
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '73'
  - number: 5.12.1.a
    text: '*persoonsgegevens van de werknemer*: adresgegevens, namen, sociaal-fiscaalnummer, geboortedatum en geslacht;'
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.12
  - number: 5.12.1.b
    text: '*verzekeringsplicht werknemersverzekeringen*: indicatie verzekerd en premies voor de werknemersverzekeringen;'
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.12
  - number: 5.12.1.c
    text: |-
      *gegevens over de inkomstenverhouding*: soort inkomstenverhouding, aard arbeidsverhouding, datum begin en einde
      van inkomstenverhouding, risicopremiegroep, sector, contract (on)bepaalde tijd, fase indeling Flexibiliteit en
      Zekerheid, collectieve arbeidsovereenkomst, reden einde dienstbetrekking van een flexwerker;
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.12
  - number: 5.12.1.d
    text: |-
      *loongerelateerde gegevens*: aantal SV-dagen, aantal verloonde uren, loon SV, (opgebouwd recht) vakantiebijslag,
      indicatie aanvulling op uitkering, indicatie vakantiebonnen toegepast;
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.12
  - number: 5.12.1.e
    text: |-
      *gegevens over de werkgever*: naam, loonheffingennummer, fi-nummer, rechtsvorm, risicopremiegroep, sector,
      voortzettingsrelatie, datum oprichting, datum ontbinding, statutaire zetel, eigenrisicodragerschap,
      premiepercentage individueel, faillissement of surseance en gemoedsbezwaardheid.
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.12
  - number: 5.12.2
    text: |-
      De in [artikel 13, vierde lid, van de Wet SUWI][ref1] bedoelde derden zijn: deskundigen en instellingen die in
      het kader van de uitoefening van beroep of bedrijf taken uitvoeren of diensten verrichten ter ondersteuning van
      administraties of het verrichten van keuringen.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel13
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.12
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '13'
  - number: 5.12.3
    text: |-
      Bij het verstrekken van gegevens op grond van dit artikel worden kosten in rekening gebracht. Bij ministeriële
      regeling worden hiervoor nadere regels gesteld.
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.12
  - number: 5.13.1
    text: |-
      Het UWV is bevoegd uit de onder zijn verantwoordelijkheid gevoerde administraties op verzoek van een werkgever
      als bedoeld in [artikel 73, tweede lid, onderdeel a, van de Wet SUWI][ref1], aan die werkgever in verband met
      het aangaan van overeenkomsten tot verzekering van de risico’s van het eigenrisicodrager zijn of van betaling
      van premie als bedoeld in [hoofdstuk 3, afdeling 5, van de Wfsv][ref2] kosteloos gegevens, mede afkomstig van de
      rijksbelastingdienst, te verstrekken op grond waarvan die werkgever kan bepalen:


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Afdeling5
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.13
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '73'
      - id: ref2
        bwb_id: BWBR0017745
        afdeling: '5'
  - number: 5.13.1.a
    text: |-
      de instroom, bedoeld in [artikel 80a van de WAO][ref1] en [artikel 40 van de Wet WIA][ref2], over de periode van
      drie jaar voorafgaande aan het verzoek;


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel80a
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel40
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.13
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 80a
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '40'
  - number: 5.13.1.b
    text: |-
      de ontwikkeling van het totale bedrag aan loon in de zin van [artikel 16 van de Wfsv][ref1] per jaar over de
      periode van vijf jaar voorafgaande aan het verzoek;


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel16
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.13
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '16'
  - number: 5.13.1.c
    text: het aantal werknemers naar leeftijd en geslacht in de periode van vijf jaar voorafgaand aan het verzoek;
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.13
  - number: 5.13.1.d
    text: |-
      het arbeidsverleden van de werknemers die ten tijde van het verzoek bij de werkgever in dienst zijn, zoals dit in
      de arbeidsverledenbeschikking, bedoeld in [artikel 83i van de Wet SUWI][ref1] wordt vermeld of zou worden vermeld,


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel83i
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.13
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 83i
  - number: 5.13.2
    text: |-
      Het UWV is bevoegd op verzoek uit de onder zijn verantwoordelijkheid gevoerde administraties aan een verzekeraar
      als bedoeld in [artikel 73, tweede lid, onderdeel b, van de Wet SUWI][ref1] in verband met de uitvoering van
      overeenkomsten als bedoeld in [dat artikelonderdeel][ref2] van de werknemer kosteloos gegevens als bedoeld in
      [artikel 5.12, eerste lid, onderdelen a, b, c en d][ref3], afkomstig van de rijksbelastingdienst, te verstrekken
      of van de werknemer die een arbeidsongeschiktheidsuitkering of een WGA-uitkering op grond van de [WAO][ref4] of
      de [Wet WIA][ref5] ontvangt te verstrekken: het dagloon, dat aan de uitkering ten grondslag ligt, de mate van
      arbeidsongeschiktheid uitgedrukt in het arbeidsongeschiktheidspercentage en de duur van de uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel73
      [ref3]: https://wetten.overheid.nl/BWBR0013267#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0002524
      [ref5]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.13
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '73'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '73'
      - id: ref3
        bwb_id: BWBR0013267
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.4'
      - id: ref4
        bwb_id: BWBR0002524
      - id: ref5
        bwb_id: BWBR0019057
  - number: '5.14'
    text: |-
      Het UWV is bevoegd uit de onder zijn verantwoordelijkheid gevoerde administraties kosteloos gegevens die
      mede afkomstig zijn van de rijksbelastingdienst en die het UWV verwerkt ten behoeve van de statistiek over
      de ontwikkeling van de arbeidsongeschiktheidsuitkeringen te verstrekken aan de verzekeraars, bedoeld in
      [artikel 73, tweede lid, onderdeel b, van de Wet SUWI][ref1], in verband met de in [dat artikel][ref2] bedoelde
      overeenkomsten:


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel73
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.14
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '73'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '73'
  - number: 5.14.a
    text: |-
      aantallen nieuwe uitkeringen op grond van de [WAO][ref1] of de [Wet WIA][ref2] per jaar, beëindigde uitkeringen
      op grond van de [WAO][ref3] of de [Wet WIA][ref4] per jaar en lopende uitkeringen in een jaar, naar geslacht,
      leeftijd, sector als bedoeld in [artikel 95 van de Wfsv][ref5], en bedrijfsgrootte, dagloon, naar ingangdatum
      respectievelijk datum beëindiging uitkering, arbeidsongeschiktheidspercentages, diagnose, soort inkomstenverhouding
      en combinatie met inkomsten uit arbeid;


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0019057
      [ref3]: https://wetten.overheid.nl/BWBR0002524
      [ref4]: https://wetten.overheid.nl/BWBR0019057
      [ref5]: https://wetten.overheid.nl/BWBR0017745#Artikel95
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.14
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0019057
      - id: ref3
        bwb_id: BWBR0002524
      - id: ref4
        bwb_id: BWBR0019057
      - id: ref5
        bwb_id: BWBR0017745
        artikel: '95'
  - number: 5.14.b
    text: |-
      totaal aantal werknemers naar jaar, geslacht, leeftijd, sector als bedoeld in [artikel 95 van de Wfsv][ref1],
      en bedrijfsgrootte, en het totaalbedrag van de premieplichtige loonsom per jaar, bedoeld in
      [artikel 2.7 van het Besluit Wfsv][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel95
      [ref2]: https://wetten.overheid.nl/BWBR0019070#Artikel2
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.14
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '95'
      - id: ref2
        bwb_id: BWBR0019070
        artikel: '2'
  - number: 5.15.1
    text: |-
      De SVB en de CWI zijn bevoegd op verzoek uit de onder hun verantwoordelijkheid gevoerde administraties aan derden,
      genoemd in [artikel 73, eerste lid, van de Wet SUWI][ref1], en derden, bedoeld in [artikel 5.12, tweede lid][ref2],
      persoonsgegevens, gegevens over de uitkeringsverhouding en over opleiding en werkervaring te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0013267#Artikel5
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.15
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '73'
      - id: ref2
        bwb_id: BWBR0013267
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.4'
  - number: 5.15.2
    text: |-
      De in het eerste lid bedoelde gegevens, niet zijnde persoonsgegevens als bedoeld in
      [artikel 16 van de Wet bescherming persoonsgegevens][ref1], kunnen door de SVB en de CWI systematisch worden
      verstrekt aan de derden, genoemd in [artikel 73, eerste lid][ref2], indien met de desbetreffende derden
      overeenstemming is bereikt over de te verstrekken gegevens, de omstandigheden waaronder, de regelmaat waarmee
      en de wijze waarop die verstrekking plaatsvindt, vast te leggen in een besluit, dat op adequate wijze wordt
      bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel73
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.15
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '73'
  - number: 5.15.3
    text: |-
      De bevoegdheid op grond van het eerste lid geldt ook voor het UWV voor het verstrekken van andere gegevens dan
      bedoeld in [artikel 5.12][ref1], die door het UWV worden verwerkt op grond van [artikel 33a van de Wet SUWI][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel33a
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.15
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.4'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: 33a
  - number: 5.15.4
    text: Bij ministeriële regeling wordt bepaald welke gegevens op grond van het derde lid worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.15
  - number: 5.15.5
    text: |-
      Bij het verstrekken van gegevens op grond van dit artikel worden kosten in rekening gebracht. Bij ministeriële
      regeling worden hiervoor nadere regels gesteld.
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.15
  - number: '5.16'
    text: |-
      Eigenrisicodragers, die het risico dragen van de betaling van uitkeringen aan personen, ten aanzien van wie op
      grond van [artikel 7, eerste lid, onderdeel a, van de WWB][ref1] een verantwoordelijkheid bestaat, verstrekken
      op verzoek aan colleges van burgemeester en wethouders opgaven en inlichtingen die noodzakelijk zijn voor de
      uitvoering van [artikel 7, eerste lid, onderdeel a, van de WWB][ref2] ten aanzien van die personen.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel7
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.16
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '7'
  - number: 5.1.7.1
    text: |-
      Het UWV verstrekt uit de onder zijn verantwoordelijkheid gevoerde administraties aan overheidswerkgevers als
      bedoeld in [artikel 1, onderdeel i, van de WW][ref1], kosteloos de gegevens die noodzakelijk zijn voor de
      uitvoering van de taak, bedoeld in [artikel 72a van de WW][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel72a
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.1.7
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: 72a
  - number: 5.1.7.2
    text: |-
      Het UWV verstrekt uit de onder zijn verantwoordelijkheid gevoerde administraties aan het participatiefonds,
      bedoeld in [artikel 1 van het Besluit participatiefonds][ref1], kosteloos de gegevens die noodzakelijk zijn voor de
      uitvoering van de taak van het participatiefonds waarborgen te bieden voor de kosten van werkloosheidsuitkeringen,
      voorzover die taak samenhangt met de uitvoering van [artikel 72a van de WW][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008102#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel1
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.1.7
    references:
      - id: ref1
        bwb_id: BWBR0008102
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '1'
  - number: 5.1.7.3
    text: |-
      Een overheidswerkgever of het participatiefonds, bedoeld in het tweede lid, kan het UWV op verzoek of uit
      eigen beweging kennis geven van het gegronde vermoeden dat een persoon van wie de inschakeling in de arbeid
      wordt bevorderd, onvoldoende medewerking verleent aan deze werkzaamheden, voorzover dit noodzakelijk is voor de
      uitvoering van de [WW][ref1] door het UWV.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.1.7
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: 5.1.7.4
    text: Dit artikel is van overeenkomstige toepassing voor de CWI.
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.1.7
  - number: 5.18.1
    text: |-
      De gegevens die de CWI op grond van [artikel 73, negende lid][ref1], bevoegd is te verstrekken betreffen gegevens
      omtrent naam, adres, telefoonnummer, postcode, woonplaats, opleiding en werkervaring.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel73
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.18
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '73'
  - number: 5.18.2
    text: |-
      Bij het verstrekken van gegevens door het UWV en de CWI op grond van [artikel 73, achtste en negende lid][ref1],
      aan reïntegratiebedrijven worden geen kosten in rekening gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel73
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.18
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '73'
  - number: '6.1'
    text: |-
      Dit besluit berust mede op [artikelen 7, zesde lid][ref1], en [67, derde lid, van de Wet werk en bijstand][ref2],
      [artikel 34, vijfde lid, van de IOAW][ref3], [artikel 34, vijfde lid, van de IOAZ][ref4] en de
      [artikelen 21, tweede lid][ref5] en [43, derde lid, van de WWIK][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel67
      [ref3]: https://wetten.overheid.nl/BWBR0004044#Artikel34
      [ref4]: https://wetten.overheid.nl/BWBR0004163#Artikel34
      [ref5]: https://wetten.overheid.nl/BWBR0017837#Artikel21
      [ref6]: https://wetten.overheid.nl/BWBR0017837#Artikel43
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '67'
      - id: ref3
        bwb_id: BWBR0004044
        artikel: '34'
      - id: ref4
        bwb_id: BWBR0004163
        artikel: '34'
      - id: ref5
        bwb_id: BWBR0017837
        artikel: '21'
      - id: ref6
        bwb_id: BWBR0017837
        artikel: '43'
  - number: '6.2'
    text: |-
      Dit besluit treedt in werking met ingang van 1 januari 2002, met uitzondering van de
      [artikelen 4.7 tot en met 4.20][ref1], die in werking treden op een bij koninklijk besluit te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '6.3'
    text: 'Dit besluit wordt aangehaald als: Besluit SUWI.'
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel6.3
