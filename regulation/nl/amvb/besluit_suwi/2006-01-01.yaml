      taak of van hun bevoegdheden op grond van één van de bepalingen van de [titels 9][ref1], [10][ref2], [13][ref3],
      [14][ref4], [15][ref5] en [17 van Boek 1 van het Burgerlijk Wetboek][ref6];


      [ref1]: https://wetten.overheid.nl/BWBR0002656
      [ref2]: https://wetten.overheid.nl/BWBR0002656
