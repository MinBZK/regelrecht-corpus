  - number: 2.1.1
    text: 'Het recht zich als werkzoekende door de CWI te laten registreren, komt toe aan:'
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel2.1
  - number: 2.1.1.a
    text: |-
      een vreemdeling die rechtmatig in Nederland verblijft, in de zin van
      [artikel 8, onderdeel b of l, van de Vreemdelingenwet 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 2.1.1.b
    text: |-
      een vreemdeling die rechtmatig in Nederland verblijft, in de zin van
      [artikel 8, onderdeel a, van de Vreemdelingenwet 2000][ref1], die onvrijwillig werkloos is terwijl het verbod,
      bedoeld in [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref2] nog van toepassing is, mits de vergunning
      tot verblijf het in Nederland verrichten van arbeid niet uitsluit;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0007149#Artikel2
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0007149
        artikel: '2'
  - number: 2.1.1.c
    text: |-
      een vreemdeling die rechtmatig in Nederland verblijf heeft gehouden in de zin van
      [artikel 8, onderdeel a tot en met e, of m, van de Vreemdelingenwet 2000][ref1], mits de vergunning tot verblijf
      het in Nederland verrichten van arbeid niet uitsloot, indien de vreemdeling onvrijwillig werkloos is, en mits hij:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 2.1.1.c.1°
    text: voor de beëindiging van dit verblijf een aanvraag heeft ingediend om voortgezette toelating, of
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel2.1
  - number: 2.1.1.c.2°
    text: |-
      binnen de termijn, genoemd in[ artikel 69, eerste lid, van de Vreemdelingenwet 2000][ref1], of buiten
      die termijn, in geval [artikel 6:11 van de Algemene wet bestuursrecht][ref2] toepassing heeft gevonden,
      bezwaar heeft gemaakt of beroep heeft ingesteld tegen intrekking van de toelating in de zin van
      [artikel 8, onderdeel a tot en met e, of m, van de Vreemdelingenwet 2000][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '69'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 2.1.2
    text: 'Het recht op registratie eindigt voor een vreemdeling als bedoeld in het eerste lid, onder c, zodra:'
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel2.1
  - number: 2.1.2.a
    text: onherroepelijk op de aanvraag, het bezwaar of het beroep is beslist, of
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel2.1
  - number: 2.1.2.b
    text: |-
      de uitzetting van de vreemdeling is gelast, tenzij die uitzetting ingevolge de [Vreemdelingenwet 2000][ref1] of op
      grond van een rechterlijke beslissing achterwege dient te blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: '2.2'
    text: |-
      De overdracht van een aanvraag aan het UWV van een uitkering op grond van de [WW][ref1] of van de aangifte van
      werkloosheid op grond van [artikel 26, eerste lid, onderdeel a, van voornoemde wet][ref2], vindt plaats binnen acht
      werkdagen na deze aangifte.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel26
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '26'
  - number: 2.3.1
    text: |-
      De overdracht van een aanvraag van algemene bijstand op grond van de [WWB][ref1] dan wel van een uitkering op
      grond van de [IOAW][ref2] of de [IOAZ][ref3] vindt plaats binnen acht werkdagen nadat de aanvraag door de CWI in
      ontvangst is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0015703
      [ref2]: https://wetten.overheid.nl/BWBR0004044
      [ref3]: https://wetten.overheid.nl/BWBR0004163
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0015703
      - id: ref2
        bwb_id: BWBR0004044
      - id: ref3
        bwb_id: BWBR0004163
  - number: 2.3.2
    text: |-
      Burgemeester en wethouders kunnen, in overeenstemming met de CWI, de in het eerste lid bedoelde termijn van acht
      werkdagen verlengen. Indien burgemeester en wethouders de bedoelde termijn verlengen, dragen zij zorg voor adequate
      bekendmaking daarvan.
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel2.3
  - number: 2.3.3
    text: |-
      Bij de melding, bedoeld in [artikel 44, tweede lid, van de WWB][ref1], [artikel 16a, tweede lid, van de IOAW][ref2]
      of [artikel 16a, tweede lid, van de IOAZ][ref3] wordt door de CWI of, bij een aanvraag als bedoeld
      in [artikel 63a, tweede of derde lid][ref4], [artikel 11a, tweede lid, van de IOAW][ref5] of
      [artikel 11a, tweede lid, van de IOAZ][ref6], door burgemeester en wethouders met de belanghebbende een afspraak
      gemaakt voor een gesprek waarin de aanvraag in ontvangst wordt genomen. Door de CWI onderscheidenlijk burgemeester
      en wethouders wordt bevorderd dat het gesprek op een zo kort mogelijke termijn na de melding plaatsheeft.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel16a
      [ref3]: https://wetten.overheid.nl/BWBR0004163#Artikel16a
      [ref4]: https://wetten.overheid.nl/BWBR0004044#Artikel63a
      [ref5]: https://wetten.overheid.nl/BWBR0004044#Artikel11a
      [ref6]: https://wetten.overheid.nl/BWBR0004163#Artikel11a
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '44'
      - id: ref2
        bwb_id: BWBR0004044
        artikel: 16a
      - id: ref3
        bwb_id: BWBR0004163
        artikel: 16a
      - id: ref4
        bwb_id: BWBR0004044
        artikel: 63a
      - id: ref5
        bwb_id: BWBR0004044
        artikel: 11a
      - id: ref6
        bwb_id: BWBR0004163
        artikel: 11a
  - number: 3.1.1
    text: |-
      Onze Minister kan een besluit van de CWI, het UWV of de SVB om andere dan de in de [Wet SUWI][ref1] bedoelde taken
      uit te voeren uitsluitend goedkeuren, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0013060
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0013060
  - number: 3.1.1.a
    text: de goede uitvoering van de in die wet bedoelde taken daardoor niet in gevaar komt;
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel3.1
  - number: 3.1.1.b
    text: de andere taken in opdracht en voor rekening en risico van de opdrachtgever worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel3.1
  - number: 3.1.1.c
    text: |-
      de taakuitoefening van de Inspectie Werk en Inkomen met betrekking tot het toezicht op de uitvoering van de wetten
      door de CWI, het UWV en de SVB, bedoeld in [artikel 37, onderdeel a, van de Wet SUWI][ref1] voldoende gewaarborgd
      is;


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel37
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '37'
  - number: 3.1.1.d
    text: |-
      voorzover de [Wet toezicht verzekeringsbedrijf][ref1] van toepassing is, deze in acht wordt genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0006509
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0006509
  - number: 3.1.1.e
    text: |-
      de uitvoering van die andere taken gescheiden van de uitvoering van de wettelijke taken plaatsvindt, voorzover de
      andere taak niet noodzaakt tot een gezamenlijke uitvoering.
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel3.1
  - number: 3.1.2
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de berekening van de prijzen die voor het verrichten van
      andere taken in rekening worden gebracht.
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel3.1
  - number: 4.1.1
    text: |-
      Het UWV laat de werkzaamheden, bedoeld in de [artikelen 72, derde lid, van de WW][ref1] en
      [30, zesde lid, van de Wet SUWI][ref2] door een reïntegratiebedrijf, deskundige persoon of een arbodienst
      verrichten op grond van een schriftelijke overeenkomst waarin in elk geval is geregeld, dat het
      reïntegratiebedrijf, de deskundige persoon of de arbodienst verplicht is:


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '72'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '30'
  - number: 4.1.1.a
    text: |-
      alle gegevens en inlichtingen omtrent deze werkzaamheden op verzoek aan het UWV te verstrekken, voor zover dit
      noodzakelijk is voor de uitvoering van de in de aanhef genoemde wetten;
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.1
  - number: 4.1.1.b
    text: |-
      de persoonlijke levenssfeer van de personen van wie de inschakeling in de arbeid wordt bevorderd, te beschermen
      overeenkomstig een reglement dat aan die personen, het UWV wordt overgelegd;
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.1
  - number: 4.1.1.c
    text: |-
      in geval van een geschil tussen de te reïntegreren persoon en het reïntegratiebedrijf, de deskundige persoon of
      de arbodienst een klachten- en geschillenregeling toe te passen die door het reïntegratiebedrijf, de deskundige
      persoon of de arbodienst aan de te reïntegreren persoon en de partij met wie de in de aanhef bedoelde overeenkomst
      is gesloten, is overgelegd;
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.1
  - number: 4.1.1.d
    text: |-
      toegang tot en inzage in alle gegevens te verlenen die een accountant naar zijn oordeel nodig heeft voor het
      instellen van een nader onderzoek als bedoeld in [artikel 42, vierde lid, van de Wet SUWI][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel42
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '42'
  - number: 4.1.1.e
    text: |-
      op verzoek aan het UWV een schriftelijk oordeel van een accountant of een gelijkwaardige deskundige over de
      verwerking van informatie en de genomen maatregelen ter beveiliging van informatie door het reïntegratiebedrijf, de
      deskundige persoon of de arbodienst over te leggen;
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.1
  - number: 4.1.1.f
    text: |-
      de gegevens die het reïntegratiebedrijf, de deskundige persoon of de arbodienst in verband met deze werkzaamheden
      verkrijgt uitsluitend te verwerken voorzover dat noodzakelijk is voor het verrichten van die werkzaamheden dan wel
      voor de naleving van verplichtingen als bedoeld in de onderdelen a tot en met e;
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.1
  - number: 4.1.1.g
    text: |-
      indien dit reïntegratiebedrijf, deze deskundige persoon of deze arbodienst deze werkzaamheden laat verrichten
      door een ander reïntegratiebedrijf, een andere deskundige persoon of een andere arbodienst, in een schriftelijke
      overeenkomst met dat andere reïntegratiebedrijf, die andere deskundige persoon of deze andere arbodienst te regelen
      dat voor dat bedrijf, die persoon of dienst de verplichtingen jegens het UWV, bedoeld in de onderdelen a tot en met
      f, gelden.
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.1
  - number: 4.1.2
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.1
  - number: 4.1.3
    text: |-
      Indien het college van burgemeester en wethouders werkzaamheden, die in het kader van de
      voorzieningen, bedoeld in de [artikelen 7, eerste lid, onderdeel a, en derde lid, van de WWB][ref1],
      [34, eerste lid, onderdeel a, van de IOAW][ref2], [artikel 34, eerste lid, onderdeel a, van de IOAZ][ref3] en
      [artikel 21, eerste lid, van de WWIK][ref4], worden uitgevoerd, laat uitvoeren door een reïntegratiebedrijf, een
      deskundige persoon of een arbodienst is het eerste lid van overeenkomstige toepassing, waarbij in de overeenkomst
      tevens is geregeld, dat het college op verzoek of uit eigen beweging in kennis worden gesteld van het gegronde
      vermoeden dat een persoon voor wie de voorzieningen zijn bestemd, onvoldoende medewerking verleent aan deze
      werkzaamheden, voorzover dit noodzakelijk is voor de uitvoering van genoemde wetten.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0004163#Artikel34
      [ref4]: https://wetten.overheid.nl/BWBR0017837#Artikel21
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0004044
        artikel: '34'
      - id: ref3
        bwb_id: BWBR0004163
        artikel: '34'
      - id: ref4
        bwb_id: BWBR0017837
        artikel: '21'
  - number: 4.2.1
    text: |-
      Het UWV kan ten behoeve van een persoon als bedoeld in [artikel 30, eerste lid, onderdeel b, van de Wet SUWI][ref1]
      of de werknemer, bedoeld in [artikel 72, eerste lid, van de WW][ref2], op diens aanvraag een individuele
      reïntegratieovereenkomst sluiten met een reïntegratiebedrijf, deskundige persoon of arbodienst, overeenkomstig
      de voorkeur van de aanvrager, ter uitvoering van werkzaamheden die zijn gericht op de inschakeling in het
      arbeidsproces.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel72
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '30'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '72'
  - number: 4.2.2
    text: |-
      Het UWV bepaalt het ten hoogste aan het reïntegratiebedrijf, de deskundige persoon of de arbodienst verschuldigde
      bedrag voor de uitvoering van de individuele reïntegratieovereenkomst en het tijdvak waarvoor de individuele
      reïntegratieovereenkomst wordt gesloten.
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.2
  - number: 4.2.3
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent de voorwaarden waaronder door het UWV
      een individuele reïntegratieovereenkomst kan worden gesloten en omtrent de inhoud van de individuele
      reïntegratieovereenkomst.
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.2
  - number: 4.3.1
    text: |-
      In geval van een toekennende beschikking op een aanvraag als bedoeld in [artikel 4.2, eerste lid][ref1], sluit
      het UWV binnen zes weken na het nemen van die beschikking een overeenkomst met een reïntegratiebedrijf, deskundige
      persoon of arbodienst dat de in artikel [4.2, eerste lid][ref2], bedoelde werkzaamheden uitvoert.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 4.3.2
    text: |-
      De persoon ten behoeve van wie een individuele reïntegratieovereenkomst wordt gesloten tekent een exemplaar van die
      overeenkomst voor gezien en verstrekt dit aan het UWV.
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.3
  - number: '4.4'
    text: |-
      De aanvraag om een individuele reïntegratieovereenkomst kan in ieder geval worden geweigerd in de gevallen waarin
      op grond van [artikel 4:35, eerste lid, onderdelen a en b en tweede lid, van de Algemene wet bestuursrecht][ref1]
      een subsidieverlening kan worden geweigerd, en indien niet wordt voldaan aan de krachtens
      [artikel 4.2, vierde lid][ref2], door het UWV gestelde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '4.5'
    text: |-
      Onze Minister zendt binnen vier jaar na de inwerkingtreding van de [artikelen 4.2 tot en met 4.4][ref1] aan de
      Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze artikelen in de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '4.7'
    text: 'In deze paragraaf en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.7
  - number: 4.7.a
    text: |-
      arbeidsgehandicapte werknemer: een arbeidsgehandicapte werknemer als bedoeld in
      [artikel 31, eerste lid, van de Wet REA][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel31
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '31'
  - number: 4.7.b
    text: |-
      subsidie: een subsidie als bedoeld in [artikel 33a, eerste lid, onderdeel a, van de Wet REA][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel33a
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: 33a
  - number: 4.7.c
    text: |-
      subsidie-ontvanger: de arbeidsgehandicapte werknemer aan wie een subsidie is verstrekt als bedoeld in
      [artikel 33a, eerste lid, onderdeel a, van de Wet REA][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel33a
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: 33a
  - number: 4.7.d
    text: |-
      persoonsgebonden reïntegratie-overeenkomst: een overeenkomst als bedoeld in
      [artikel 33a, eerste lid, onderdeel b, van de Wet REA][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel33a
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: 33a
  - number: 4.7.e
    text: |-
      begunstigde: de arbeidsgehandicapte werknemer ten behoeve van wie een overeenkomst is gesloten als bedoeld in
      [artikel 33a, eerste lid, onderdeel b, van de Wet REA][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel33a
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: 33a
  - number: 4.8.1
    text: |-
      Het UWV kan op een aanvraag als bedoeld in [artikel 33a van de Wet REA][ref1] een subsidie verstrekken ter
      voldoening van de noodzakelijk te maken kosten van werkzaamheden die zijn gericht op behoud, herstel of
      bevordering van mogelijkheden tot het verrichten van arbeid, waaronder begrepen het behouden en verkrijgen van een
      dienstbetrekking, of een persoonsgebonden reïntegratie-overeenkomst sluiten ter uitvoering van die werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel33a
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: 33a
  - number: 4.8.2
    text: 'Onder werkzaamheden als bedoeld in het eerste lid worden uitsluitend verstaan:'
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.8
  - number: 4.8.2.a
    text: begeleiding en advisering;
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.8
  - number: 4.8.2.b
    text: opleiding;
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.8
  - number: 4.8.2.c
    text: |-
      arbeidsbemiddeling en andere werkzaamheden die, in aansluiting op de onder a en b bedoelde werkzaamheden, zijn
      gericht op behoud, herstel of bevordering van mogelijkheden tot het verrichten van arbeid.
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.8
  - number: 4.8.3
    text: |-
      Kosten van werkzaamheden die niet zijn beschreven in het in [artikel 4.10, onderdeel b][ref1], bedoelde trajectplan
      komen niet voor subsidiëring in aanmerking en ter uitvoering van die werkzaamheden wordt geen persoonsgebonden
      reïntegratie-overeenkomst gesloten, tenzij het UWV voor het verrichten van die werkzaamheden schriftelijk
      goedkeuring heeft verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '4.9'
    text: |-
      Bij de aanvraag, bedoeld in [artikel 33a, eerste lid, van de Wet REA][ref1], vermeldt de aanvrager of zijn
      aanvraag betrekking heeft op verstrekking van subsidie dan wel het sluiten van een persoonsgebonden reïntegratie-
      overeenkomst door het UWV.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel33a
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.9
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: 33a
  - number: '4.10'
    text: 'Het UWV kan uitsluitend een subsidie verstrekken of een persoonsgebonden reïntegratie-overeenkomst sluiten indien:'
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.10
  - number: 4.10.a
    text: |-
      de aanvraag wordt ingediend binnen zes weken nadat het oordeel van het UWV omtrent de aanwezigheid
      van passende arbeid in het bedrijf van zijn werkgever of in een ander bedrijf, als bedoeld in
      [artikel 33a, tweede lid, van de Wet REA][ref1], aan de arbeidsgehandicapte werknemer bekend is gemaakt;


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel33a
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: 33a
  - number: 4.10.b
    text: |-
      de aanvraag vergezeld gaat van een door of namens de werknemer opgesteld trajectplan waarin in elk geval zijn
      opgenomen:
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.10
  - number: 4.10.b.1°
    text: het opleidingsniveau en het sociaal-fiscaalnummer van de arbeidsgehandicapte werknemer;
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.10
  - number: 4.10.b.2°
    text: |-
      een beschrijving van de werkzaamheden die de aanvrager op grond van [artikel 33a, eerste lid, van de Wet REA][ref1]
      zal laten verrichten;


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel33a
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: 33a
  - number: 4.10.b.3°
    text: |-
      de verwachte begin- en einddatum van de werkzaamheden, bedoeld in [artikel 33a, van de Wet REA][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel33a
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: 33a
  - number: 4.10.b.4°
    text: de beroepsactiviteiten die de aanvrager naar verwachting na afloop van die periode kan vervullen;
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.10
  - number: 4.10.b.5°
    text: |-
      een begroting van de kosten van de in [artikel 4.8][ref1] bedoelde werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.11.1
    text: |-
      De werkgever vergoedt aan het UWV 50 procent van de kosten die door het reïntegratiebedrijf, de deskundige persoon
      of arbodienst aan het UWV in rekening worden gebracht voor het verrichten van werkzaamheden ter uitvoering van de
      persoonsgebonden reïntegratie-overeenkomst, tenzij de arbeidsgehandicapte werknemer binnen drie maanden nadat de
      werkzaamheden ter uitvoering van de persoonsgebonden reïntegratie-overeenkomst zijn geëindigd een dienstbetrekking
      met een andere werkgever is aangegaan en deze arbeidsgehandicapte werknemer voor een aaneengesloten periode van
      ten minste 26 weken daadwerkelijk in dienstbetrekking met deze andere werkgever heeft gestaan of met die arbeid in
      een periode van één jaar ten minste gedurende 26 weken inkomsten heeft verworven waardoor hij geen recht meer heeft
      op een uitkering anders dan een arbeidsongeschiktheidsuitkering in verband met het verwerven van die inkomsten of
      verrichten van die arbeid.
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.11
  - number: 4.11.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing indien de werknemer voor het verrichten van de werkzaamheden een
      subsidie als bedoeld in deze paragraaf heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.11
  - number: 4.11.3
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.11
  - number: 4.12.1
    text: Op de aanvraag om een subsidie wordt een beschikking omtrent subsidieverlening gegeven.
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.12
  - number: 4.12.2
    text: |-
      In de subsidievoorwaarden bij een beschikking als bedoeld in het eerste lid wordt in elk geval opgenomen dat in een
      overeenkomst die de subsidie-ontvanger met een reïntegratiebedrijf sluit wordt geregeld:
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.12
  - number: 4.12.2.a
    text: |-
      de duur van de overeenkomst alsmede de hoogte van de kosten die door het reïntegratiebedrijf in rekening zullen
      worden gebracht;
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.12
  - number: 4.12.2.b
    text: dat de overeenkomst door beide partijen wegens gewichtige redenen tussentijds door opzegging kan worden beëindigd;
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.12
  - number: 4.12.2.c
    text: 'dat het reïntegratiebedrijf verplicht is:'
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.12
  - number: 4.12.2.c.1º
    text: |-
      toegang tot en inzage in alle gegevens te verlenen die een accountant naar zijn oordeel nodig heeft voor het
      instellen van een nader onderzoek als bedoeld in [artikel 42, vierde lid, van de Wet SUWI][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel42
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.12
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '42'
  - number: 4.12.2.c.2º
    text: |-
      de persoonlijke levenssfeer van de personen van wie de inschakeling in de arbeid wordt bevorderd, te beschermen
      overeenkomstig een reglement dat aan die personen en de werkgever wordt overgelegd;
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.12
  - number: 4.12.2.c.3º
    text: |-
      in geval van een geschil tussen de te reïntegreren persoon en het reïntegratiebedrijf een klachten- en
      geschillenregeling toe te passen die door het reïntegratiebedrijf aan de te reïntegreren persoon en de werkgever
      is overgelegd;
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.12
  - number: 4.12.2.c.4º
    text: |-
      op verzoek aan de werkgever een schriftelijk oordeel van een accountant of een gelijkwaardige deskundige over de
      verwerking van informatie en de genomen maatregelen ter beveiliging van informatie door het reïntegratiebedrijf
      over te leggen;
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.12
  - number: 4.12.2.c.5º
    text: |-
      de gegevens die het reïntegratiebedrijf in verband met deze werkzaamheden verkrijgt uitsluitend te verwerken
      voorzover dat noodzakelijk is voor het verrichten van die activiteiten of werkzaamheden dan wel voor de naleving
      van verplichtingen als bedoeld in de subonderdelen 1° tot en met 4°;
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.12
  - number: 4.12.2.c.6º
    text: |-
      indien dit reïntegratiebedrijf deze werkzaamheden laat verrichten door een ander reïntegratiebedrijf, in een
      schriftelijke overeenkomst met dat andere reïntegratiebedrijf te regelen dat voor dat bedrijf de verplichtingen,
      bedoeld in de subonderdelen 1° tot en met 6°, gelden;
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.12
  - number: 4.12.2.d
    text: |-
      dat het reïntegratiebedrijf aan het UWV op verzoek of na toestemming van de subsidie-ontvanger uit eigen beweging
      gegevens verstrekt over de besteding van de subsidie.
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.12
  - number: 4.12.3
    text: Bij ministeriële regeling kunnen regels worden gesteld omtrent het tweede lid.
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.12
  - number: 4.13.1
    text: De subsidie bedraagt ten hoogste een bij ministeriële regeling vastgesteld bedrag.
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.13
  - number: 4.13.2
    text: |-
      De subsidie wordt verleend voor werkzaamheden als bedoeld in [artikel 4.8][ref1] gedurende een tijdvak van ten
      hoogste een jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.13
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.13.3
    text: |-
      Indien de aanvrager van een subsidie of de subsidie-ontvanger aantoont dat de noodzakelijke kosten van de
      werkzaamheden die zijn gericht op behoud, herstel of bevordering van mogelijkheden tot het verrichten van arbeid
      hoger zijn dan het in het eerste lid bedoelde bedrag of die werkzaamheden langer zullen duren dan een tijdvak van
      een jaar, kan subsidie worden verleend voor een hoger bedrag of een langere periode.
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.13
  - number: 4.13.4
    text: |-
      De in het derde lid bedoelde bevoegdheid bestaat uitsluitend indien het in het eerste lid bedoelde bedrag of de in
      het tweede lid bedoelde werkzaamheden gedurende een tijdvak van een jaar redelijkerwijs niet zullen kunnen leiden
      tot behoud, herstel of bevordering van mogelijkheden tot het verrichten van arbeid.
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.13
  - number: 4.14.1
    text: |-
      Het UWV kan aan de subsidie-ontvanger voorschotten op de vast te stellen subsidie verlenen aan de hand van aan het
      UWV overgelegde declaraties voor de werkzaamheden, die voortvloeien uit het trajectplan.
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.14
  - number: 4.14.2
    text: |-
      Indien het UWV besluit tot het verlenen van voorschotten, betaalt het UWV de voorschotten binnen één week na het
      nemen van dat besluit aan de subsidie-ontvanger of aan het reïntegratiebedrijf, waarmee de subsidie-ontvanger een
      overeenkomst heeft gesloten.
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.14
  - number: 4.15.1
    text: |-
      De subsidie-ontvanger dient iedere drie maanden bij het UWV een rapportage in waarin een beschrijving is opgenomen
      van de ten behoeve van de subsidie-ontvanger verrichte werkzaamheden, bedoeld in [artikel 4.8][ref1]. In de
      rapportage worden in ieder geval de resultaten van de uitvoering van het trajectplan en de prognose voor de
      resterende periode van het traject beschreven en wordt een overzicht gegeven van de tot op dat moment gemaakte
      kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.15
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.15.2
    text: |-
      De subsidie-ontvanger verstrekt onverwijld en uit eigen beweging alle gegevens en inlichtingen omtrent voortijdige
      beëindiging van gesubsidieerde trajecten aan het UWV.
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.15
  - number: 4.15.3
    text: |-
      De subsidie-ontvanger verstrekt op verzoek aan het UWV alle gegevens en inlichtingen die van belang zijn voor
      de vaststelling van de rechtmatigheid en doelmatigheid van de uitvoering van [artikel 33a van de Wet REA][ref1],
      alsmede binnen vier weken alle hem betreffende informatie die noodzakelijk is voor de evaluatie van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel33a
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.15
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: 33a
  - number: '4.16'
    text: |-
      De subsidie-ontvanger dient binnen zes weken na afloop van het tijdvak waarvoor de subsidie is verleend een
      aanvraag tot vaststelling van de subsidie in.
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.16
  - number: 4.17.1
    text: |-
      In geval van een toekennende beschikking op een aanvraag om een persoonsgebonden reïntegratie-overeenkomst, sluit
      het UWV binnen zes weken na het nemen van die beschikking een overeenkomst met een reïntegratiebedrijf dat, een
      deskundige persoon die of een arbodienst die de in [artikel 4.8][ref1] bedoelde werkzaamheden uitvoert.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.17
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.17.2
    text: |-
      Het UWV sluit een overeenkomst met een reïntegratiebedrijf, deskundige persoon of arbodienst als bedoeld in
      het eerste lid overeenkomstig de voorkeur voor een reïntegratiebedrijf, deskundige persoon of arbodienst van de
      aanvrager of begunstigde.
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.17
  - number: '4.18'
    text: |-
      Het sluiten van een persoonsgebonden reïntegratie-overeenkomst kan in ieder geval worden geweigerd in de gevallen,
      bedoeld in [artikel 4:35 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.18
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 4.19.1
    text: |-
      Het door het UWV aan het reïntegratiebedrijf, de deskundige persoon of de arbodienst verschuldigde bedrag voor de
      uitvoering van de persoonsgebonden reïntegratie-overeenkomst bedraagt ten hoogste een bij ministeriële regeling
      vastgesteld bedrag.
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.19
  - number: 4.19.2
    text: De persoonsgebonden reïntegratie-overeenkomst wordt gesloten voor een tijdvak van ten hoogste een jaar.
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.19
  - number: 4.19.3
    text: |-
      Indien de aanvrager van een persoonsgebonden reïntegratie-overeenkomst of begunstigde aantoont dat de noodzakelijke
      kosten van de in [artikel 4.8][ref1] bedoelde werkzaamheden hoger zijn dan het in het eerste lid bedoelde bedrag of
      die werkzaamheden langer zullen duren dan een tijdvak van een jaar, kan een overeenkomst worden gesloten voor een
      hoger bedrag of een langere periode.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.19
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.19.4
    text: |-
      De in het derde lid bedoelde bevoegdheid bestaat uitsluitend indien het in het eerste lid bedoelde bedrag of de in
      het derde lid bedoelde werkzaamheden gedurende een tijdvak van een jaar redelijkerwijs niet zullen kunnen leiden
      tot behoud, herstel of bevordering van mogelijkheden tot het verrichten van arbeid.
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.19
  - number: 4.20.1
    text: 'In de persoonsgebonden reïntegratie-overeenkomst wordt in elk geval geregeld:'
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.20
  - number: 4.20.1.a
    text: |-
      de duur van de overeenkomst alsmede de hoogte van de kosten die door het reïntegratiebedrijf, de deskundige persoon
      of de arbodienst in rekening zullen worden gebracht;
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.20
  - number: 4.20.1.b
    text: |-
      dat het reïntegratiebedrijf, de deskundige persoon of de arbodienst iedere drie maanden bij het UWV een
      rapportage indient waarin een beschrijving is opgenomen van de werkzaamheden die zijn verricht ten behoeve van
      het behoud, herstel of bevordering van mogelijkheden tot het verrichten van arbeid van de arbeidsgehandicapte
      werknemer. In de rapportage worden tevens de resultaten van de uitvoering van het trajectplan, bedoeld in
      [artikel 4.10, onderdeel b][ref1], en de prognose voor de resterende periode van het traject beschreven en wordt
      een overzicht gegeven van de tot op dat moment gemaakte kosten;


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.20
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.20.1.c
    text: dat de overeenkomst door beide partijen wegens gewichtige redenen tussentijds door opzegging kan worden beëindigd;
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.20
  - number: 4.20.1.d
    text: |-
      dat de prijs voor de overeenkomst uitsluitend wordt betaald voor die werkzaamheden, die zijn beschreven in
      het in [artikel 4.10, onderdeel b][ref1], bedoelde trajectplan, tenzij het UWV voor het verrichten van andere
      werkzaamheden schriftelijk goedkeuring heeft verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.20
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.20.1.e
    text: |-
      dat het reïntegratiebedrijf voldoet aan verplichtingen als bedoeld in [artikel 4.12, eerste lid, onderdeel c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.20
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.20.1.f
    text: |-
      dat het reïntegratiebedrijf aan het UWV op verzoek of na toestemming van de subsidie-ontvanger uit eigen beweging
      gegevens verstrekt over de uitvoering van de overeenkomst.
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.20
  - number: 4.20.2
    text: Bij ministeriële regeling kunnen regels worden gesteld omtrent het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel4.20
  - number: 5.1.1
    text: |-
      In de polisadministratie worden van de werknemer of de persoon die vrijwillig verzekerd is voor de [ZW][ref1], de
      [Wet WIA][ref2], de [WW][ref3] en de [WAO][ref4] de volgende gegevens verwerkt:


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0019057
      [ref3]: https://wetten.overheid.nl/BWBR0004045
      [ref4]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0019057
      - id: ref3
        bwb_id: BWBR0004045
      - id: ref4
        bwb_id: BWBR0002524
  - number: 5.1.1.a
    text: |-
      *adresgegevens*: straatnaam, huisnummer, huisnummertoevoeging, postcode, woonplaats, gemeentenaam,
      woonobjectverwijzing en locatieomschrijving;
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.1
  - number: 5.1.1.b
    text: '*postbusadresgegevens*: postbusnummer, postcode, woonplaats, gemeentenaam en locatieomschrijving;'
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.1
  - number: 5.1.1.c
    text: |-
      *buitenlandse adresgegevens*: straatnaam, huisnummer, huisnummertoevoeging, postcode, woonplaats,
      locatieomschrijving, regionaam en landcode ISO;
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.1
  - number: 5.1.1.d
    text: '*sociaal verzekeringsnummer buitenland*: verzekeringsnummer en landcode ISO;'
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.1
  - number: 5.1.1.e
    text: |-
      *persoonsgegevens*: namen, sociaal-fiscaalnummer, het administratienummer, bedoeld in de
      [Wet gemeentelijke basisadministratie persoonsgegevens][ref1] (A-nummer), geboortedatum, overlijdensdatum,
      geslacht, burgerlijke staat, leefvorm, nationaliteit, verblijfstitel, datum vertrek uit Nederland, indicatie
      curatelestelling en indicatie voor informatiebeveiliging;


      [ref1]: https://wetten.overheid.nl/BWBR0006723
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0006723
  - number: 5.1.1.f
    text: '*ontheffing wegens gemoedsbezwaren*;'
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.1
  - number: 5.1.1.g
    text: |-
      *verzekeringsplicht werknemersverzekeringen*: gegevens inzake de vaststelling verzekeringsplicht, indicaties
      verzekerd en premies voor de werknemersverzekeringen;
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.1
  - number: 5.1.1.h
    text: |-
      *gegevens over de werkgever in de zin van de Wfsv en de inhoudingsplichtige in de zin van de Wet op de
      loonbelasting 1964*: naam en loonheffingennummer;
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.1
  - number: 5.1.1.i
    text: |-
      *gegevens over de inkomstenverhouding*: personeelsnummer, soort inkomstenverhouding, collectieve
      arbeidsovereenkomst, risicopremiegroep, sector, datum begin en einde van inkomstenverhouding, reden einde
      inkomstenverhouding en code invloed verzekeringsplicht;
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.1
  - number: 5.1.1.j
    text: |-
      *loongerelateerde gegevens*: lonen, aantal SV-dagen, aantal verloonde uren, ingehouden loonbelasting en
      premie volksverzekeringen, inkomensafhankelijke bijdrage als bedoeld in [artikel 41 van de ZVW][ref1],
      verzekeringssituatie [ZVW][ref2], andere gegevens van belang voor de heffing van inkomstenbelasting en toegepaste
      kortingen.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '41'
      - id: ref2
        bwb_id: BWBR0018450
  - number: 5.1.2
    text: |-
      In aanvulling op het eerste lid kunnen tevens bij regeling van Onze Minister, in overeenstemming met Onze Minister
      van Financiën, aan te wijzen gegevens worden verwerkt die afkomstig zijn van een werkgever in de zin van de
      [Wfsv][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017745
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0017745
  - number: 5.2.1
    text: |-
      In de bijlage bij dit besluit wordt voor de polisadministratie een overzicht gegeven van de opgenomen gegevens,
      voor welk doel die gegevens worden verwerkt en hoe die gegevens worden verkregen.
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.2
  - number: 5.2.2
    text: |-
      De bijlage, bedoeld in het eerste lid, kan bij regeling van Onze Minister, in overeenstemming met Onze Minister
      van Financiën, en na overleg met het Centraal bureau voor de statistiek, worden gewijzigd, voorzover deze wijziging
      geen wijziging tot gevolg heeft van de lijst van gegevens in [artikel 5.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel5
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: '5.3'
    text: |-
      De melding, bedoeld in [artikel 61 van de Wet SUWI][ref1], geschiedt kosteloos.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel61
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '61'
  - number: '5.4'
    text: |-
      De CWI, het UWV en de SVB zijn bevoegd uit eigen beweging en verplicht op verzoek uit
      de onder hun verantwoordelijkheid gevoerde administraties kosteloos aan de door Onze
      Minister aangewezen ambtenaren, die zijn belast met het toezicht op de naleving van de
      [Wet arbeid vreemdelingen][ref1], de [Arbeidsomstandighedenwet 1998][ref2], de [Arbeidstijdenwet][ref3], de
      [Wet allocatie arbeidskrachten door intermediairs][ref4], de [Wet minimumloon en minimumvakantiebijslag][ref5], de
      [Wet op de loonvorming][ref6] en de [Wet gelijke behandeling mannen en vrouwen][ref7] gegevens te verstrekken die
      noodzakelijk zijn voor het toezicht op de naleving en de uitvoering van die wetten.


      [ref1]: https://wetten.overheid.nl/BWBR0007149
      [ref2]: https://wetten.overheid.nl/BWBR0010346
      [ref3]: https://wetten.overheid.nl/BWBR0007671
      [ref4]: https://wetten.overheid.nl/BWBR0009616
      [ref5]: https://wetten.overheid.nl/BWBR0002638
      [ref6]: https://wetten.overheid.nl/BWBR0002698
      [ref7]: https://wetten.overheid.nl/BWBR0003299
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0007149
      - id: ref2
        bwb_id: BWBR0010346
      - id: ref3
        bwb_id: BWBR0007671
      - id: ref4
        bwb_id: BWBR0009616
      - id: ref5
        bwb_id: BWBR0002638
      - id: ref6
        bwb_id: BWBR0002698
      - id: ref7
        bwb_id: BWBR0003299
  - number: 5.5.1
    text: |-
      Voor het verstrekken van gegevens en inlichtingen, bedoeld in [artikel 72 van de Wet SUWI][ref1],
      aan de ambtenaren, bedoeld in [artikel 5.4][ref2], en de opsporingsambtenaren, bedoeld in
      [artikel 85, tweede lid, van de Wet SUWI][ref3], maken de CWI, het UWV, de SVB en het Inlichtingenbureau gebruik
      van Suwinet, voorzover die gegevens noodzakelijk zijn voor het toezicht op de naleving van de genoemde wetten
      respectievelijk voor de opsporing van feiten strafbaar gesteld bij de [Wet SUWI][ref4] of enig andere wet.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0013267#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel85
      [ref4]: https://wetten.overheid.nl/BWBR0013060
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '72'
      - id: ref2
        bwb_id: BWBR0013267
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '85'
      - id: ref4
        bwb_id: BWBR0013060
  - number: 5.5.2
    text: |-
      Voor het verstrekken van gegevens, bedoeld in [artikel 73, zesde lid, van de Wet SUWI][ref1] aan de CWI, het UWV,
      de SVB en de colleges van burgemeester en wethouders, maken de ambtenaren en de opsporingsambtenaren, bedoeld in
      het eerste lid, gebruik van Suwinet, voorzover die gegevens noodzakelijk zijn voor het toezicht op de naleving van
      de genoemde wetten respectievelijk voor de opsporing van feiten strafbaar gesteld bij de [Wet SUWI][ref2] of enig
      andere wet.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel73
