  - number: 5.10.c
    text: |-
      aan Onze Minister van Onderwijs, Cultuur en Wetenschap de gegevens die noodzakelijk zijn voor de bekostiging van
      onderwijsinstellingen.
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.10
  - number: '5.11'
    text: |-
      Het UWV en de SVB verstrekken in de in de [artikelen 5.7][ref1] en [5.9][ref2] vermelde
      gevallen slechts systematisch gegevens, niet zijnde persoonsgegevens als bedoeld in
      [artikel 16 van de Wet bescherming persoonsgegevens][ref3], tenzij het betreft persoonsgegevens
      betreffende iemands gezondheid die noodzakelijk zijn voor reïntegratie of begeleiding van
      werknemers of uitkeringsgerechtigden in verband met ziekte of arbeidsongeschiktheid als bedoeld in
      [artikel 21, eerste lid, onderdeel f, van die wet][ref4], indien met de desbetreffende bestuursorganen
      overeenstemming is bereikt over in ieder geval de systematisch te verstrekken gegevens, alsmede de omstandigheid
      waaronder, de regelmaat waarmee en de wijze waarop die verstrekking plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0013267#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0011468#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0011468#Artikel21
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.11
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref2
