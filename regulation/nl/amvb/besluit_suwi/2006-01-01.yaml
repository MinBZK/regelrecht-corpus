        bwb_id: BWBR0002614
        artikel: 9a
      - id: ref2
        bwb_id: BWBR0002614
  - number: 5.10.b
    text: |-
      aan colleges van burgemeester en wethouders de gegevens die noodzakelijk zijn ten behoeve van de
      registratie van gegevens, bedoeld in [artikel 118h van de Wet op het voortgezet onderwijs][ref1],
      [artikel 8.3.2 van de Wet educatie en beroepsonderwijs][ref2] en
      [artikel 162b van de Wet op de expertisecentra][ref3] in verband met de doorverwijzing van vroegtijdige
      schoolverlaters naar onderwijs of arbeidsmarkt;


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel118h
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel162b
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.10
