  - number: 5.5.3
    text: |-
      De gegevensverstrekking, bedoeld in het eerste en tweede lid, vindt plaats overeenkomstig het Gegevensregister
      Suwi.
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.5
  - number: 5.5.4
    text: |-
      Bij ministeriële regeling wordt het Gegevensregister Suwi vastgesteld met inachtneming van de gegevensverstrekking,
      bedoeld in het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.5
  - number: '5.6'
    text: |-
      De CWI, het UWV en de SVB zijn bevoegd uit de onder hun verantwoordelijkheid gevoerde administraties gegevens
      te verstrekken aan buitenlandse bestuursorganen, voorzover die gegevens noodzakelijk zijn voor de vervulling van
      een taak van zwaarwegend algemeen belang waartoe in ieder geval gerekend wordt het verstrekken en vaststellen van
      uitkeringen en het heffen en innen van premies en bijdragen daarvoor.
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.6
  - number: '5.7'
    text: |-
      Het UWV en de SVB zijn bevoegd uit eigen beweging en verplicht op verzoek uit de onder hun verantwoordelijkheid
      gevoerde administraties kosteloos te verstrekken:
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.7
  - number: 5.7.a
    text: |-
      aan de rijksbelastingdienst de gegevens die noodzakelijk zijn voor de heffing of invordering van enige
      rijksbelasting, van premies sociale verzekeringen als bedoeld in [artikel 2, onderdelen a en c, van de Wfsv][ref1]
      en van de inkomensafhankelijke bijdrage, bedoeld in de [ZVW][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0013267/2006-01-01#Artikel5.7
    references:
