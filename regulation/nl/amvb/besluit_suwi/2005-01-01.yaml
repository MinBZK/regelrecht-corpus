    text: |-
      reïntegratiebedrijf: natuurlijke persoon of rechtspersoon die in het kader van de uitoefening van beroep of bedrijf
      de inschakeling van personen in het arbeidsproces bevordert;
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel1.1
  - number: 1.1.m
    text: |-
      arbodienst: een arbodienst als bedoeld in de [Arbeidsomstandighedenwet 1998][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010346
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0010346
  - number: 2.1.1
    text: 'Het recht zich als werkzoekende door de CWI te laten registreren, komt toe aan:'
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel2.1
  - number: 2.1.1.a
    text: |-
      een vreemdeling die rechtmatig in Nederland verblijft, in de zin van
      [artikel 8, onderdeel b of l, van de Vreemdelingenwet 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 2.1.1.b
    text: |-
      een vreemdeling die rechtmatig in Nederland verblijft, in de zin van
      [artikel 8, onderdeel a, van de Vreemdelingenwet 2000][ref1], die onvrijwillig werkloos is terwijl het verbod,
      bedoeld in [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref2] nog van toepassing is, mits de vergunning
      tot verblijf het in Nederland verrichten van arbeid niet uitsluit;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0007149#Artikel2
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0007149
        artikel: '2'
  - number: 2.1.1.c
    text: |-
      een vreemdeling die rechtmatig in Nederland verblijf heeft gehouden in de zin van
      [artikel 8, onderdeel a tot en met e, of m, van de Vreemdelingenwet 2000][ref1], mits de vergunning tot verblijf
      het in Nederland verrichten van arbeid niet uitsloot, indien de vreemdeling onvrijwillig werkloos is, en mits hij:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 2.1.1.c.1°
    text: voor de beëindiging van dit verblijf een aanvraag heeft ingediend om voortgezette toelating, of
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel2.1
  - number: 2.1.1.c.2°
    text: |-
      binnen de termijn, genoemd in[ artikel 69, eerste lid, van de Vreemdelingenwet 2000][ref1], of buiten
      die termijn, in geval [artikel 6:11 van de Algemene wet bestuursrecht][ref2] toepassing heeft gevonden,
      bezwaar heeft gemaakt of beroep heeft ingesteld tegen intrekking van de toelating in de zin van
      [artikel 8, onderdeel a tot en met e, of m, van de Vreemdelingenwet 2000][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '69'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 2.1.2
    text: 'Het recht op registratie eindigt voor een vreemdeling als bedoeld in het eerste lid, onder c, zodra:'
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel2.1
  - number: 2.1.2.a
    text: onherroepelijk op de aanvraag, het bezwaar of het beroep is beslist, of
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel2.1
  - number: 2.1.2.b
    text: |-
      de uitzetting van de vreemdeling is gelast, tenzij die uitzetting ingevolge de [Vreemdelingenwet 2000][ref1] of op
      grond van een rechterlijke beslissing achterwege dient te blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: '2.2'
    text: |-
      De overdracht van een aanvraag aan het UWV van een uitkering op grond van de [WW][ref1] of van de aangifte van
      werkloosheid op grond van [artikel 26, eerste lid, onderdeel a, van voornoemde wet][ref2], vindt plaats binnen acht
      werkdagen na deze aangifte.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel26
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '26'
  - number: 2.3.1
    text: |-
      De overdracht van een aanvraag van algemene bijstand op grond van de [WWB][ref1] dan wel van een uitkering op
      grond van de [IOAW][ref2] of de [IOAZ][ref3] vindt plaats binnen acht werkdagen nadat de aanvraag door de CWI in
      ontvangst is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0015703
      [ref2]: https://wetten.overheid.nl/BWBR0004044
      [ref3]: https://wetten.overheid.nl/BWBR0004163
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0015703
      - id: ref2
        bwb_id: BWBR0004044
      - id: ref3
        bwb_id: BWBR0004163
  - number: 2.3.2
    text: |-
      Burgemeester en wethouders kunnen, in overeenstemming met de CWI, de in het eerste lid bedoelde termijn van acht
      werkdagen verlengen. Indien burgemeester en wethouders de bedoelde termijn verlengen, dragen zij zorg voor adequate
      bekendmaking daarvan.
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel2.3
  - number: 2.3.3
    text: |-
      Bij de melding, bedoeld in [artikel 44, tweede lid, van de WWB][ref1], [artikel 16a, tweede lid, van de IOAW][ref2]
      of [artikel 16a, tweede lid, van de IOAZ][ref3] wordt door de CWI of, bij een aanvraag als bedoeld
      in [artikel 63a, tweede of derde lid][ref4], [artikel 11a, tweede lid, van de IOAW][ref5] of
      [artikel 11a, tweede lid, van de IOAZ][ref6], door burgemeester en wethouders met de belanghebbende een afspraak
      gemaakt voor een gesprek waarin de aanvraag in ontvangst wordt genomen. Door de CWI onderscheidenlijk burgemeester
      en wethouders wordt bevorderd dat het gesprek op een zo kort mogelijke termijn na de melding plaatsheeft.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel16a
      [ref3]: https://wetten.overheid.nl/BWBR0004163#Artikel16a
      [ref4]: https://wetten.overheid.nl/BWBR0004044#Artikel63a
      [ref5]: https://wetten.overheid.nl/BWBR0004044#Artikel11a
      [ref6]: https://wetten.overheid.nl/BWBR0004163#Artikel11a
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '44'
      - id: ref2
        bwb_id: BWBR0004044
        artikel: 16a
      - id: ref3
        bwb_id: BWBR0004163
        artikel: 16a
      - id: ref4
        bwb_id: BWBR0004044
        artikel: 63a
      - id: ref5
        bwb_id: BWBR0004044
        artikel: 11a
      - id: ref6
        bwb_id: BWBR0004163
        artikel: 11a
  - number: 3.1.1
    text: |-
      Onze Minister kan een besluit van de CWI, het UWV of de SVB om andere dan de in de [Wet SUWI][ref1] bedoelde taken
      uit te voeren uitsluitend goedkeuren, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0013060
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0013060
  - number: 3.1.1.a
    text: de goede uitvoering van de in die wet bedoelde taken daardoor niet in gevaar komt;
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel3.1
  - number: 3.1.1.b
    text: de andere taken in opdracht en voor rekening en risico van de opdrachtgever worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel3.1
  - number: 3.1.1.c
    text: |-
      de taakuitoefening van de Inspectie Werk en Inkomen met betrekking tot het toezicht op de uitvoering van de wetten
      door de CWI, het UWV en de SVB, bedoeld in [artikel 37, onderdeel a, van de Wet SUWI][ref1] voldoende gewaarborgd
      is;


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel37
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '37'
  - number: 3.1.1.d
    text: |-
      voorzover de [Wet toezicht verzekeringsbedrijf][ref1] van toepassing is, deze in acht wordt genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0006509
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0006509
  - number: 3.1.1.e
    text: |-
      de uitvoering van die andere taken gescheiden van de uitvoering van de wettelijke taken plaatsvindt, voorzover de
      andere taak niet noodzaakt tot een gezamenlijke uitvoering.
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel3.1
  - number: 3.1.2
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de berekening van de prijzen die voor het verrichten van
      andere taken in rekening worden gebracht.
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel3.1
  - number: 4.1.1
    text: |-
      Het UWV en burgemeester en wethouders laten de werkzaamheden, bedoeld in de
      [artikelen 72, derde lid, van de WW][ref1], [10, derde lid van de Wet REA][ref2] en
      [7, vierde lid, van de WWB][ref3], [34, derde lid, van de IOAW][ref4], [artikel 34, derde lid, van de IOAZ][ref5]
      en [artikel 21, tweede lid, van de WWIK][ref6] door een reïntegratiebedrijf of arbodienst verrichten op grond
      van een schriftelijke overeenkomst waarin in elk geval is geregeld dat het reïntegratiebedrijf of de arbodienst
      verplicht is:


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0015709#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0004044#Artikel34
      [ref5]: https://wetten.overheid.nl/BWBR0004163#Artikel34
      [ref6]: https://wetten.overheid.nl/BWBR0017837#Artikel21
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '72'
      - id: ref2
        bwb_id: BWBR0009565
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0015709
        artikel: '7'
      - id: ref4
        bwb_id: BWBR0004044
        artikel: '34'
      - id: ref5
        bwb_id: BWBR0004163
        artikel: '34'
      - id: ref6
        bwb_id: BWBR0017837
        artikel: '21'
  - number: 4.1.1.a
    text: |-
      alle gegevens en inlichtingen omtrent deze werkzaamheden op verzoek aan het UWV of het burgemeester en wethouders
      te verstrekken, voor zover dit noodzakelijk is voor de uitvoering van de in de aanhef genoemde wetten;
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.1
  - number: 4.1.1.b
    text: |-
      de persoonlijke levenssfeer van de personen van wie de inschakeling in de arbeid wordt bevorderd, te beschermen
      overeenkomstig een reglement dat aan die personen, het UWV of het burgemeester en wethouders wordt overgelegd;
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.1
  - number: 4.1.1.c
    text: |-
      in geval van een geschil tussen de te reïntegreren persoon en het reïntegratiebedrijf of de arbodienst een
      klachten- en geschillenregeling toe te passen die door het reïntegratiebedrijf of de arbodienst aan de te
      reïntegreren persoon en de partij met wie de in de aanhef bedoelde overeenkomst is gesloten, is overgelegd;
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.1
  - number: 4.1.1.d
    text: |-
      toegang tot en inzage in alle gegevens te verlenen die een accountant naar zijn oordeel nodig heeft voor het
      instellen van een nader onderzoek als bedoeld in [artikel 42, vierde lid, van de Wet SUWI][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel42
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '42'
  - number: 4.1.1.e
    text: |-
      op verzoek aan het UWV of het burgemeester en wethouders een schriftelijk oordeel van een accountant of een
      gelijkwaardige deskundige over de verwerking van informatie en de genomen maatregelen ter beveiliging van
      informatie door het reïntegratiebedrijf of de arbodienst over te leggen;
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.1
  - number: 4.1.1.f
    text: |-
      de gegevens die het reïntegratiebedrijf of de arbodienst in verband met deze werkzaamheden verkrijgt uitsluitend
      te verwerken voorzover dat noodzakelijk is voor het verrichten van die werkzaamheden dan wel voor de naleving van
      verplichtingen als bedoeld in de onderdelen a tot en met e;
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.1
  - number: 4.1.1.g
    text: |-
      indien dit reïntegratiebedrijf of deze arbodienst deze werkzaamheden laat verrichten door een ander
      reïntegratiebedrijf of een andere arbodienst, in een schriftelijke overeenkomst met dat andere reïntegratiebedrijf
      of deze andere arbodienst te regelen dat voor dat bedrijf de verplichtingen jegens het UWV of het burgemeester en
      wethouders, bedoeld in de onderdelen a tot en met f en h, gelden;
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.1
  - number: 4.1.1.h
    text: |-
      het UWV, onderscheidenlijk burgemeester en wethouders van de betrokken gemeente op verzoek en uit eigen beweging
      kennis te geven van het gegronde vermoeden dat een persoon, van wie de inschakeling in de arbeid wordt bevorderd,
      onvoldoende medewerking verleent aan deze werkzaamheden, voor zover dit noodzakelijk is voor de uitvoering van de
      in de aanhef genoemde wetten door het UWV en burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.1
  - number: 4.1.2
    text: |-
      Alvorens overeenkomsten met reïntegratiebedrijven of arbodiensten te sluiten volgen het UWV en het burgemeester en
      wethouders een transparante en toetsbare aanbestedingsprocedure in het kader waarvan meer offertes worden gevraagd
      op basis van vooraf vastgestelde criteria.
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.1
  - number: 4.1.3
    text: |-
      Bij de selectie en gunning van overeenkomsten als bedoeld in het tweede lid, vindt de beoordeling van offertes
      uitsluitend plaats op basis van vergelijkbare kosten.
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.1
  - number: 4.1.4
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.1
  - number: 4.1.5
    text: |-
      Bij ministeriële regeling kunnen werkzaamheden in het kader van bepaalde voorzieningen, bedoeld in
      [artikel 7, vierde lid, van de WWB][ref1], [34, derde lid, van de IOAW][ref2], [34, derde lid, van de IOAZ][ref3]
      of [21, tweede lid, van de WWIK][ref4] worden aangewezen waarop het eerste of tweede lid niet van toepassing is en
      kan worden geregeld dat een deel van de werkzaamheden, bedoeld in genoemde artikelen of werkzaamheden in het kader
      van bepaalde voorzieningen, bedoeld in genoemde artikelen, niet door derden hoeft te worden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0015709#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0004163#Artikel34
      [ref4]: https://wetten.overheid.nl/BWBR0017837#Artikel21
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0015709
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0004044
        artikel: '34'
      - id: ref3
        bwb_id: BWBR0004163
        artikel: '34'
      - id: ref4
        bwb_id: BWBR0017837
        artikel: '21'
  - number: 4.2.1
    text: |-
      Het UWV kan ten behoeve van de arbeidsgehandicapte, bedoeld in [artikel 10, eerste lid, van de Wet REA][ref1]
      en de werknemer, bedoeld in [artikel 72, eerste lid, van de WW][ref2], op diens aanvraag een individuele
      reïntegratieovereenkomst sluiten met een reïntegratiebedrijf of arbodienst, overeenkomstig de voorkeur van de
      aanvrager, ter uitvoering van werkzaamheden die zijn gericht op de inschakeling in het arbeidsproces.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel72
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '72'
  - number: 4.2.2
    text: |-
      In afwijking van [artikel 4.1, tweede lid][ref1], volgt het UWV geen aanbestedingsprocedure alvorens het een
      individuele reïntegratieovereenkomst sluit.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.2.3
    text: |-
      Het UWV bepaalt het ten hoogste aan het reïntegratiebedrijf of de arbodienst verschuldigde bedrag
      voor de uitvoering van de individuele reïntegratieovereenkomst en het tijdvak waarvoor de individuele
      reïntegratieovereenkomst wordt gesloten.
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.2
  - number: 4.2.4
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent de voorwaarden waaronder door het UWV
      een individuele reïntegratieovereenkomst kan worden gesloten en omtrent de inhoud van de individuele
      reïntegratieovereenkomst.
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.2
  - number: 4.3.1
    text: |-
      In geval van een toekennende beschikking op een aanvraag als bedoeld in [artikel 4.2, eerste lid][ref1], sluit het
      UWV binnen zes weken na het nemen van die beschikking een overeenkomst met een reïntegratiebedrijf of arbodienst
      dat de in artikel [4.2, eerste lid][ref2], bedoelde werkzaamheden uitvoert.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 4.3.2
    text: |-
      De arbeidsgehandicapte of de werknemer ten behoeve van wie een individuele reïntegratieovereenkomst wordt gesloten
      tekent een exemplaar van die overeenkomst voor gezien en verstrekt dit aan het UWV.
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.3
  - number: '4.4'
    text: |-
      De aanvraag om een individuele reïntegratieovereenkomst kan in ieder geval worden geweigerd in de gevallen waarin
      op grond van [artikel 4:35, eerste lid, onderdelen a en b en tweede lid, van de Algemene wet bestuursrecht][ref1]
      een subsidieverlening kan worden geweigerd, en indien niet wordt voldaan aan de krachtens
      [artikel 4.2, vierde lid][ref2], door het UWV gestelde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '4.5'
    text: |-
      Onze Minister zendt binnen vier jaar na de inwerkingtreding van de [artikelen 4.2 tot en met 4.4][ref1] aan de
      Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze artikelen in de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '4.7'
    text: 'In deze paragraaf en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.7
  - number: 4.7.a
    text: |-
      arbeidsgehandicapte werknemer: een arbeidsgehandicapte werknemer als bedoeld in
      [artikel 31, eerste lid, van de Wet REA][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel31
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '31'
  - number: 4.7.b
    text: |-
      subsidie: een subsidie als bedoeld in [artikel 33a, eerste lid, onderdeel a, van de Wet REA][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel33a
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: 33a
  - number: 4.7.c
    text: |-
      subsidie-ontvanger: de arbeidsgehandicapte werknemer aan wie een subsidie is verstrekt als bedoeld in
      [artikel 33a, eerste lid, onderdeel a, van de Wet REA][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel33a
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: 33a
  - number: 4.7.d
    text: |-
      persoonsgebonden reïntegratie-overeenkomst: een overeenkomst als bedoeld in
      [artikel 33a, eerste lid, onderdeel b, van de Wet REA][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel33a
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: 33a
  - number: 4.7.e
    text: |-
      begunstigde: de arbeidsgehandicapte werknemer ten behoeve van wie een overeenkomst is gesloten als bedoeld in
      [artikel 33a, eerste lid, onderdeel b, van de Wet REA][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel33a
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: 33a
  - number: 4.8.1
    text: |-
      Het UWV kan op een aanvraag als bedoeld in [artikel 33a van de Wet REA][ref1] een subsidie verstrekken ter
      voldoening van de noodzakelijk te maken kosten van werkzaamheden die zijn gericht op behoud, herstel of
      bevordering van mogelijkheden tot het verrichten van arbeid, waaronder begrepen het behouden en verkrijgen van een
      dienstbetrekking, of een persoonsgebonden reïntegratie-overeenkomst sluiten ter uitvoering van die werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel33a
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: 33a
  - number: 4.8.2
    text: 'Onder werkzaamheden als bedoeld in het eerste lid worden uitsluitend verstaan:'
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.8
  - number: 4.8.2.a
    text: begeleiding en advisering;
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.8
  - number: 4.8.2.b
    text: opleiding;
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.8
  - number: 4.8.2.c
    text: |-
      arbeidsbemiddeling en andere werkzaamheden die, in aansluiting op de onder a en b bedoelde werkzaamheden, zijn
      gericht op behoud, herstel of bevordering van mogelijkheden tot het verrichten van arbeid.
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.8
  - number: 4.8.3
    text: |-
      Kosten van werkzaamheden die niet zijn beschreven in het in [artikel 4.10, onderdeel b][ref1], bedoelde trajectplan
      komen niet voor subsidiëring in aanmerking en ter uitvoering van die werkzaamheden wordt geen persoonsgebonden
      reïntegratie-overeenkomst gesloten, tenzij het UWV voor het verrichten van die werkzaamheden schriftelijk
      goedkeuring heeft verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '4.9'
    text: |-
      Bij de aanvraag, bedoeld in [artikel 33a, eerste lid, van de Wet REA][ref1], vermeldt de aanvrager of zijn
      aanvraag betrekking heeft op verstrekking van subsidie dan wel het sluiten van een persoonsgebonden reïntegratie-
      overeenkomst door het UWV.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel33a
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.9
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: 33a
  - number: '4.10'
    text: 'Het UWV kan uitsluitend een subsidie verstrekken of een persoonsgebonden reïntegratie-overeenkomst sluiten indien:'
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.10
  - number: 4.10.a
    text: |-
      de aanvraag wordt ingediend binnen zes weken nadat het oordeel van het UWV omtrent de aanwezigheid
      van passende arbeid in het bedrijf van zijn werkgever of in een ander bedrijf, als bedoeld in
      [artikel 33a, tweede lid, van de Wet REA][ref1], aan de arbeidsgehandicapte werknemer bekend is gemaakt;


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel33a
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: 33a
  - number: 4.10.b
    text: |-
      de aanvraag vergezeld gaat van een door of namens de werknemer opgesteld trajectplan waarin in elk geval zijn
      opgenomen:
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.10
  - number: 4.10.b.1°
    text: het opleidingsniveau en het sociaal-fiscaalnummer van de arbeidsgehandicapte werknemer;
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.10
  - number: 4.10.b.2°
    text: |-
      een beschrijving van de werkzaamheden die de aanvrager op grond van [artikel 33a, eerste lid, van de Wet REA][ref1]
      zal laten verrichten;


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel33a
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: 33a
  - number: 4.10.b.3°
    text: |-
      de verwachte begin- en einddatum van de werkzaamheden, bedoeld in [artikel 33a, van de Wet REA][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel33a
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: 33a
  - number: 4.10.b.4°
    text: de beroepsactiviteiten die de aanvrager naar verwachting na afloop van die periode kan vervullen;
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.10
  - number: 4.10.b.5°
    text: |-
      een begroting van de kosten van de in [artikel 4.8][ref1] bedoelde werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.11.1
    text: |-
      De werkgever vergoedt aan het UWV 50 procent van de kosten die door het reïntegratiebedrijf of de arbodienst aan
      het UWV in rekening worden gebracht voor het verrichten van werkzaamheden ter uitvoering van de persoonsgebonden
      reïntegratie-overeenkomst, tenzij de arbeidsgehandicapte werknemer binnen drie maanden nadat de werkzaamheden ter
      uitvoering van de persoonsgebonden reïntegratie-overeenkomst zijn geëindigd een dienstbetrekking met een andere
      werkgever is aangegaan en deze arbeidsgehandicapte werknemer voor een aaneengesloten periode van ten minste 26
      weken daadwerkelijk in dienstbetrekking met deze andere werkgever heeft gestaan of met die arbeid in een periode
      vanéén jaar ten minste gedurende 26 weken inkomsten heeft verworven waardoor hij geen recht meer heeft op een
      uitkering anders dan een arbeidsongeschiktheidsuitkering in verband met het verwerven van die inkomsten of
      verrichten van die arbeid.
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.11
  - number: 4.11.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing indien de werknemer voor het verrichten van de werkzaamheden een
      subsidie als bedoeld in deze paragraaf heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.11
  - number: 4.11.3
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.11
  - number: 4.12.1
    text: Op de aanvraag om een subsidie wordt een beschikking omtrent subsidieverlening gegeven.
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.12
  - number: 4.12.2
    text: |-
      In de subsidievoorwaarden bij een beschikking als bedoeld in het eerste lid wordt in elk geval opgenomen dat in een
      overeenkomst die de subsidie-ontvanger met een reïntegratiebedrijf sluit wordt geregeld:
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.12
  - number: 4.12.2.a
    text: |-
      de duur van de overeenkomst alsmede de hoogte van de kosten die door het reïntegratiebedrijf in rekening zullen
      worden gebracht;
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.12
  - number: 4.12.2.b
    text: dat de overeenkomst door beide partijen wegens gewichtige redenen tussentijds door opzegging kan worden beëindigd;
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.12
  - number: 4.12.2.c
    text: 'dat het reïntegratiebedrijf verplicht is:'
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.12
  - number: 4.12.2.c.1º
    text: |-
      toegang tot en inzage in alle gegevens te verlenen die een accountant naar zijn oordeel nodig heeft voor het
      instellen van een nader onderzoek als bedoeld in [artikel 42, vierde lid, van de Wet SUWI][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel42
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.12
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '42'
  - number: 4.12.2.c.2º
    text: |-
      de persoonlijke levenssfeer van de personen van wie de inschakeling in de arbeid wordt bevorderd, te beschermen
      overeenkomstig een reglement dat aan die personen en de werkgever wordt overgelegd;
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.12
  - number: 4.12.2.c.3º
    text: |-
      in geval van een geschil tussen de te reïntegreren persoon en het reïntegratiebedrijf een klachten- en
      geschillenregeling toe te passen die door het reïntegratiebedrijf aan de te reïntegreren persoon en de werkgever
      is overgelegd;
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.12
  - number: 4.12.2.c.4º
    text: |-
      op verzoek aan de werkgever een schriftelijk oordeel van een accountant of een gelijkwaardige deskundige over de
      verwerking van informatie en de genomen maatregelen ter beveiliging van informatie door het reïntegratiebedrijf
      over te leggen;
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.12
  - number: 4.12.2.c.5º
    text: |-
      de gegevens die het reïntegratiebedrijf in verband met deze werkzaamheden verkrijgt uitsluitend te verwerken
      voorzover dat noodzakelijk is voor het verrichten van die activiteiten of werkzaamheden dan wel voor de naleving
      van verplichtingen als bedoeld in de subonderdelen 1° tot en met 4°;
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.12
  - number: 4.12.2.c.6º
    text: |-
      indien dit reïntegratiebedrijf deze werkzaamheden laat verrichten door een ander reïntegratiebedrijf, in een
      schriftelijke overeenkomst met dat andere reïntegratiebedrijf te regelen dat voor dat bedrijf de verplichtingen,
      bedoeld in de subonderdelen 1° tot en met 6°, gelden;
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.12
  - number: 4.12.2.d
    text: |-
      dat het reïntegratiebedrijf aan het UWV op verzoek of na toestemming van de subsidie-ontvanger uit eigen beweging
      gegevens verstrekt over de besteding van de subsidie.
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.12
  - number: 4.12.3
    text: Bij ministeriële regeling kunnen regels worden gesteld omtrent het tweede lid.
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.12
  - number: 4.13.1
    text: De subsidie bedraagt ten hoogste een bij ministeriële regeling vastgesteld bedrag.
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.13
  - number: 4.13.2
    text: |-
      De subsidie wordt verleend voor werkzaamheden als bedoeld in [artikel 4.8][ref1] gedurende een tijdvak van ten
      hoogste een jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.13
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.13.3
    text: |-
      Indien de aanvrager van een subsidie of de subsidie-ontvanger aantoont dat de noodzakelijke kosten van de
      werkzaamheden die zijn gericht op behoud, herstel of bevordering van mogelijkheden tot het verrichten van arbeid
      hoger zijn dan het in het eerste lid bedoelde bedrag of die werkzaamheden langer zullen duren dan een tijdvak van
      een jaar, kan subsidie worden verleend voor een hoger bedrag of een langere periode.
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.13
  - number: 4.13.4
    text: |-
      De in het derde lid bedoelde bevoegdheid bestaat uitsluitend indien het in het eerste lid bedoelde bedrag of de in
      het tweede lid bedoelde werkzaamheden gedurende een tijdvak van een jaar redelijkerwijs niet zullen kunnen leiden
      tot behoud, herstel of bevordering van mogelijkheden tot het verrichten van arbeid.
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.13
  - number: 4.14.1
    text: |-
      Het UWV kan aan de subsidie-ontvanger voorschotten op de vast te stellen subsidie verlenen aan de hand van aan het
      UWV overgelegde declaraties voor de werkzaamheden, die voortvloeien uit het trajectplan.
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.14
  - number: 4.14.2
    text: |-
      Indien het UWV besluit tot het verlenen van voorschotten, betaalt het UWV de voorschotten binnen één week na het
      nemen van dat besluit aan de subsidie-ontvanger of aan het reïntegratiebedrijf, waarmee de subsidie-ontvanger een
      overeenkomst heeft gesloten.
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.14
  - number: 4.15.1
    text: |-
      De subsidie-ontvanger dient iedere drie maanden bij het UWV een rapportage in waarin een beschrijving is opgenomen
      van de ten behoeve van de subsidie-ontvanger verrichte werkzaamheden, bedoeld in [artikel 4.8][ref1]. In de
      rapportage worden in ieder geval de resultaten van de uitvoering van het trajectplan en de prognose voor de
      resterende periode van het traject beschreven en wordt een overzicht gegeven van de tot op dat moment gemaakte
      kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.15
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.15.2
    text: |-
      De subsidie-ontvanger verstrekt onverwijld en uit eigen beweging alle gegevens en inlichtingen omtrent voortijdige
      beëindiging van gesubsidieerde trajecten aan het UWV.
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.15
  - number: 4.15.3
    text: |-
      De subsidie-ontvanger verstrekt op verzoek aan het UWV alle gegevens en inlichtingen die van belang zijn voor
      de vaststelling van de rechtmatigheid en doelmatigheid van de uitvoering van [artikel 33a van de Wet REA][ref1],
      alsmede binnen vier weken alle hem betreffende informatie die noodzakelijk is voor de evaluatie van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel33a
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.15
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: 33a
  - number: '4.16'
    text: |-
      De subsidie-ontvanger dient binnen zes weken na afloop van het tijdvak waarvoor de subsidie is verleend een
      aanvraag tot vaststelling van de subsidie in.
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.16
  - number: 4.17.1
    text: |-
      In geval van een toekennende beschikking op een aanvraag om een persoonsgebonden reïntegratie-overeenkomst, sluit
      het UWV binnen zes weken na het nemen van die beschikking een overeenkomst met een reïntegratiebedrijf dat, of een
      arbodienst die de in [artikel 4.8][ref1] bedoelde werkzaamheden uitvoert.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.17
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.17.2
    text: |-
      Het UWV sluit een overeenkomst met een reïntegratiebedrijf of arbodienst als bedoeld in het eerste lid
      overeenkomstig de voorkeur voor een reïntegratiebedrijf of arbodienst van de aanvrager of begunstigde.
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.17
  - number: '4.18'
    text: |-
      Het sluiten van een persoonsgebonden reïntegratie-overeenkomst kan in ieder geval worden geweigerd in de gevallen,
      bedoeld in [artikel 4:35 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.18
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 4.19.1
    text: |-
      Het door het UWV aan het reïntegratiebedrijf of de arbodienst verschuldigde bedrag voor de uitvoering van de
      persoonsgebonden reïntegratie-overeenkomst bedraagt ten hoogste een bij ministeriële regeling vastgesteld bedrag.
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.19
  - number: 4.19.2
    text: De persoonsgebonden reïntegratie-overeenkomst wordt gesloten voor een tijdvak van ten hoogste een jaar.
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.19
  - number: 4.19.3
    text: |-
      Indien de aanvrager van een persoonsgebonden reïntegratie-overeenkomst of begunstigde aantoont dat de noodzakelijke
      kosten van de in [artikel 4.8][ref1] bedoelde werkzaamheden hoger zijn dan het in het eerste lid bedoelde bedrag of
      die werkzaamheden langer zullen duren dan een tijdvak van een jaar, kan een overeenkomst worden gesloten voor een
      hoger bedrag of een langere periode.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.19
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.19.4
    text: |-
      De in het derde lid bedoelde bevoegdheid bestaat uitsluitend indien het in het eerste lid bedoelde bedrag of de in
      het derde lid bedoelde werkzaamheden gedurende een tijdvak van een jaar redelijkerwijs niet zullen kunnen leiden
      tot behoud, herstel of bevordering van mogelijkheden tot het verrichten van arbeid.
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.19
  - number: 4.20.1
    text: 'In de persoonsgebonden reïntegratie-overeenkomst wordt in elk geval geregeld:'
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.20
  - number: 4.20.1.a
    text: |-
      de duur van de overeenkomst alsmede de hoogte van de kosten die door het reïntegratiebedrijf of de arbodienst in
      rekening zullen worden gebracht;
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.20
  - number: 4.20.1.b
    text: |-
      dat het reïntegratiebedrijf of de arbodienst iedere drie maanden bij het UWV een rapportage indient waarin een
      beschrijving is opgenomen van de werkzaamheden die zijn verricht ten behoeve van het behoud, herstel of bevordering
      van mogelijkheden tot het verrichten van arbeid van de arbeidsgehandicapte werknemer. In de rapportage worden
      tevens de resultaten van de uitvoering van het trajectplan, bedoeld in [artikel 4.10, onderdeel b][ref1], en de
      prognose voor de resterende periode van het traject beschreven en wordt een overzicht gegeven van de tot op dat
      moment gemaakte kosten;


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.20
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.20.1.c
    text: dat de overeenkomst door beide partijen wegens gewichtige redenen tussentijds door opzegging kan worden beëindigd;
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.20
  - number: 4.20.1.d
    text: |-
      dat de prijs voor de overeenkomst uitsluitend wordt betaald voor die werkzaamheden, die zijn beschreven in
      het in [artikel 4.10, onderdeel b][ref1], bedoelde trajectplan, tenzij het UWV voor het verrichten van andere
      werkzaamheden schriftelijk goedkeuring heeft verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.20
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.20.1.e
    text: |-
      dat het reïntegratiebedrijf voldoet aan verplichtingen als bedoeld in [artikel 4.12, eerste lid, onderdeel c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.20
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.20.1.f
    text: |-
      dat het reïntegratiebedrijf aan het UWV op verzoek of na toestemming van de subsidie-ontvanger uit eigen beweging
      gegevens verstrekt over de uitvoering van de overeenkomst.
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.20
  - number: 4.20.2
    text: Bij ministeriële regeling kunnen regels worden gesteld omtrent het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel4.20
  - number: '5.1'
    text: |-
      Indien de CWI, het UWV of de SVB, bij de uitvoering van een wet een misdrijf vermoedt, waardoor een bestuursorgaan
      bij het verstrekken van uitkeringen, het doen van verstrekkingen dan wel het heffen van bijdragen wordt benadeeld,
      stellen de CWI, het UWV en de SVB het betrokken bestuursorgaan hiervan, kosteloos, in kennis.
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel5.1
  - number: '5.2'
    text: |-
      Het UWV en de SVB zijn bevoegd uit eigen beweging en verplicht op verzoek, kosteloos, uit de onder hun
      verantwoordelijkheid gevoerde administratie, aan de hieronder vermelde instanties te verstrekken:
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel5.2
  - number: 5.2.a
    text: |-
      aan de rijksbelastingdienst de gegevens die noodzakelijk zijn voor de heffing of invordering van enige
      rijksbelasting of premies volksverzekeringen;
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel5.2
  - number: 5.2.b
    text: |-
      aan het College voor zorgverzekeringen, het college van toezicht op de zorgverzekeringen,
      ziekenfondsen, ziektekostenverzekeraars, uitvoerende organen van publierechtelijke
      ziektekostenregelingen voor ambtenaren, het centraal administratiekantoor, bedoeld in
      [artikel 1, onderdeel b, van het Administratiebesluit Bijzondere Ziektekostenverzekering][ref1]
      en verbindingskantoren, bedoeld in
      [artikel 1, onderdeel c, van het Administratiebesluit Bijzondere Ziektekostenverzekering][ref2],
      de gegevens voorzover die noodzakelijk zijn voor de uitvoering van de [Ziekenfondswet][ref3],
      [Algemene Wet Bijzondere Ziektekosten][ref4] en de [Overgangswet verzorgingshuizen][ref5];


      [ref1]: https://wetten.overheid.nl/BWBR0003585#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003585#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002460
      [ref4]: https://wetten.overheid.nl/BWBR0002614
      [ref5]: https://wetten.overheid.nl/BWBR0008252
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0003585
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0003585
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0002460
      - id: ref4
        bwb_id: BWBR0002614
      - id: ref5
        bwb_id: BWBR0008252
  - number: 5.2.c
    text: |-
      aan de Informatie Beheer Groep de gegevens die noodzakelijk zijn voor de uitvoering van bij of krachtens enige wet
      aan de Informatie Beheer Groep opgedragen taken;
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel5.2
  - number: 5.2.d
    text: |-
      aan de Pensioen- en Uitkeringsraad, bedoeld in [artikel 2 van de Wet op de Pensioen- en Uitkeringsraad][ref1],
      de gegevens die noodzakelijk zijn voor de uitvoering van de [Wet buitengewoon pensioen 1940–1945][ref2],
      de[ Wet buitengewoon pensioen zeelieden-oorlogsslachtoffers][ref3],
      de[ Wet buitengewoon pensioen Indisch verzet][ref4], de [Wet uitkeringen vervolgingsslachtoffers 1940–1945][ref5]
      en de [Wet uitkeringen burger-oorlogsslachtoffers 1940–1945][ref6];


      [ref1]: https://wetten.overheid.nl/BWBR0004806#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002032
      [ref3]: https://wetten.overheid.nl/BWBR0002035
      [ref4]: https://wetten.overheid.nl/BWBR0003968
      [ref5]: https://wetten.overheid.nl/BWBR0002844
      [ref6]: https://wetten.overheid.nl/BWBR0003664
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0004806
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002032
      - id: ref3
        bwb_id: BWBR0002035
      - id: ref4
        bwb_id: BWBR0003968
      - id: ref5
        bwb_id: BWBR0002844
      - id: ref6
        bwb_id: BWBR0003664
  - number: 5.2.e
    text: |-
      aan Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer de gegevens die noodzakelijk zijn voor
      de uitvoering van de Wet individuele huursubsidie en de [Huursubsidiewet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008659
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0008659
  - number: 5.2.f
    text: |-
      aan de raden voor de kinderbescherming de gegevens die noodzakelijk zijn voor een goede uitoefening van hun
      taak of van hun bevoegdheden op grond van één van de bepalingen van de [titels 9][ref1], [10][ref2], [13][ref3],
      [14][ref4], [15][ref5] en [17 van Boek 1 van het Burgerlijk Wetboek][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0002656
      [ref2]: https://wetten.overheid.nl/BWBR0002656
      [ref3]: https://wetten.overheid.nl/BWBR0002656
      [ref4]: https://wetten.overheid.nl/BWBR0002656
      [ref5]: https://wetten.overheid.nl/BWBR0002656
      [ref6]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0002656
      - id: ref2
        bwb_id: BWBR0002656
      - id: ref3
        bwb_id: BWBR0002656
