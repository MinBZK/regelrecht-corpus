        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '6.3'
    text: 'Dit besluit wordt aangehaald als: Besluit SUWI.'
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel6.3
