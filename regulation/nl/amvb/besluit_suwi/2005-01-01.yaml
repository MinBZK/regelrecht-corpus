  - number: '6.1'
    text: |-
      Dit besluit berust mede op [artikelen 7, zesde lid][ref1], en [67, derde lid, van de Wet werk en bijstand][ref2],
      [artikel 34, vijfde lid, van de IOAW][ref3], [artikel 34, vijfde lid, van de IOAZ][ref4] en de
      [artikelen 21, tweede lid][ref5] en [43, derde lid, van de WWIK][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel67
      [ref3]: https://wetten.overheid.nl/BWBR0004044#Artikel34
