        bwb_id: BWBR0002656
      - id: ref5
        bwb_id: BWBR0002656
      - id: ref6
        bwb_id: BWBR0002656
  - number: 5.2a
    text: |-
      De SVB is bevoegd op verzoek, kosteloos, uit de door hem gevoerde administratie, aan de Stichting Administratie
      Indonesische Pensioenen alle gegevens en inlichtingen te verstrekken die noodzakelijk zijn voor de uitvoering
      van de [wet van 21 april 1955, Stb. 189][ref1] (en de daarbij behorende overeenkomst) en overeenkomstige wet- en
      regelgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0002180
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel5.2a
    references:
      - id: ref1
        bwb_id: BWBR0002180
  - number: '5.3'
    text: |-
      Het UWV is bevoegd uit eigen beweging en verplicht op verzoek uit de onder zijn verantwoordelijkheid gevoerde
      administratie gegevens kosteloos te verstrekken aan:
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel5.3
  - number: 5.3.a
    text: |-
      de Sociaal-Economische Raad de gegevens die noodzakelijk zijn voor de uitvoering van
      [artikel 46a van de Wet op de ondernemingsraden][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel46a
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: 46a
  - number: 5.3.b
    text: organen van de publiekrechtelijke bedrijfsorganisatie, de totale loonsom per werkgever;
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel5.3
  - number: 5.3.c
    text: |-
      het Vervangingsfonds de gegevens die noodzakelijk zijn voor de uitvoering van de
      [Wet op het primair onderwijs][ref1], de [Wet op het voortgezet onderwijs][ref2] en
      de[ Wet op de expertisecentra][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0002399
      [ref3]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0003420
      - id: ref2
        bwb_id: BWBR0002399
      - id: ref3
        bwb_id: BWBR0003549
  - number: 5.3.d
    text: |-
      de Kamers van Koophandel en Fabrieken de gegevens die nodig zijn voor de uitvoering van de in de artikelen
      [2][ref1], [3][ref2] en [4 Handelsregisterwet 1996][ref3] opgedragen taken.


      [ref1]: https://wetten.overheid.nl/BWBR0007893#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007893#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0007893#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0007893
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0007893
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0007893
        artikel: '4'
  - number: '5.4'
    text: |-
      De CWI is bevoegd om bij de uitoefening van de taken, bedoeld in
      [artikel 21, eerste lid, onderdeel b, van de Wet SUWI][ref1] uit de onder haar verantwoordelijkheid gevoerde
      administratie, waaraan informatie omtrent individuele personen ontleend kan worden, aan een reïntegratiebedrijf
      gegevens omtrent naam, adres, telefoonnummer, postcode, woonplaats, opleiding en werkervaring te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel21
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '21'
  - number: '5.5'
    text: |-
      De CWI, het UWV en de SVB zijn bevoegd uit de onder hun verantwoordelijkheid gevoerde administraties gegevens te
      verstrekken aan buitenlandse organen, voorzover die verstrekking noodzakelijk is voor de vervulling van een taak
      van zwaarwegend algemeen belang.
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel5.5
  - number: '5.6'
    text: |-
      De CWI en het UWV zijn bevoegd uit eigen beweging en verplicht op verzoek, uit de onder hun verantwoordelijkheid
      gevoerde administratie, kosteloos aan de door Onze Minister aangewezen ambtenaren, bedoeld in
      [artikel 14 van de Wet arbeid vreemdelingen][ref1], [artikel 24 van de Arbeidsomstandighedenwet 1998][ref2]
      en [artikel 13, eerste lid, van de Wet allocatie arbeidskrachten door intermediairs][ref3], gegevens
      te verstrekken die noodzakelijk zijn voor de uitvoering van de [Wet arbeid vreemdelingen][ref4], de
      [Arbeidsomstandighedenwet 1998][ref5] en de [Wet allocatie arbeidskrachten door intermediairs][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0009616#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0007149
      [ref5]: https://wetten.overheid.nl/BWBR0010346
      [ref6]: https://wetten.overheid.nl/BWBR0009616
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '24'
      - id: ref3
        bwb_id: BWBR0009616
        artikel: '13'
      - id: ref4
        bwb_id: BWBR0007149
      - id: ref5
        bwb_id: BWBR0010346
      - id: ref6
        bwb_id: BWBR0009616
  - number: '5.7'
    text: |-
      Bij het verstrekken van gegevens maken de CWI, het UWV en de SVB gebruik van het sociaal-fiscaalnummer, voorzover
      het gebruik van dit nummer wettelijk is voorgeschreven of toegestaan bij de uitvoering van de in dit besluit
      vermelde wettelijk voorschriften.
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel5.7
  - number: 5.8.1
    text: |-
      De CWI, het UWV en de SVB verstrekken in de in [artikel 73, eerste lid, van de Wet SUWI][ref1] en in de
      [artikelen 5.2][ref2] en [5.3 van dit besluit][ref3] vermelde gevallen, slechts systematisch gegevens, niet
      zijnde persoonsgegevens als bedoeld in [artikel 16 van de Wet bescherming persoonsgegevens][ref4], indien met de
      desbetreffende bestuursorganen of rechtspersonen overeenstemming is bereikt over in ieder geval de systematisch te
      verstrekken gegevens, alsmede de omstandigheid waaronder, de regelmaat waarmee en de wijze waarop die verstrekking
      plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0013267#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0013267#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0011468#Artikel16
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel5.8
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '73'
      - id: ref2
        bwb_id: BWBR0013267
        artikel: '5'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0013267
        artikel: '5'
        hoofdstuk: '5'
      - id: ref4
        bwb_id: BWBR0011468
        artikel: '16'
  - number: 5.8.2
    text: |-
      De in het eerste lid bedoelde overeenstemming wordt opgenomen in een schriftelijk besluit, dat door de CWI, het UWV
      of de SVB op adequate wijze bekend wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel5.8
  - number: 5.9.1
    text: |-
      Bij het verstrekken van gegevens op verzoek, bedoeld in [artikel 73 van de Wet SUWI][ref1], brengen de CWI, het UWV
      en de SVB kosten in rekening, voorzover niet is bepaald dat gegevensverstrekking kosteloos dient te geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel73
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel5.9
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '73'
  - number: 5.9.2
    text: |-
      Indien de CWI, het UWV en de SVB in verband met het opdragen van werkzaamheden voor de uitvoering van hun taken aan
      privaatrechtelijke rechtspersonen gegevens verstrekken die voor die opdracht noodzakelijk zijn, worden die gegevens
      kosteloos verstrekt.
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel5.9
  - number: 5.9.3
    text: |-
      Het tweede lid is van overeenkomstige toepassing voor het verstrekken van gegevens aan arbodiensten
      en reïntegratiebedrijven die de gegevens van de CWI, het UWV en de SVB nodig hebben in verband met het
      verrichten van werkzaamheden ter uitvoering van de taak, bedoeld in [artikel 10 van de Wet REA][ref1],
      [artikel 72 van de WW][ref2] en [artikel 7, vierde lid, van de WWB][ref3], [34, derde lid, van de IOAW][ref4] en
      [34, derde lid, van de IOAZ][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel72
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0004044#Artikel34
      [ref5]: https://wetten.overheid.nl/BWBR0004163#Artikel34
    url: https://wetten.overheid.nl/BWBR0013267/2005-01-01#Artikel5.9
    references:
