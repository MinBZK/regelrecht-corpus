  - number: '5.8'
    text: |-
      De SVB is bevoegd op verzoek uit de onder zijn verantwoordelijkheid gevoerde administratie kosteloos aan de Stichting
      Administratie Indonesische Pensioenen de gegevens te verstrekken die noodzakelijk zijn voor de uitvoering van de
      __REF000___________________________________________________________________________________________________________
      ________________________________________________________ en overeenkomstige wet- en regelgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0002180
    url: https://wetten.overheid.nl/BWBR0013267/2022-01-01#Artikel5.8
