        artikel: 2.7a
  - number: '4.10'
    text: |-
      Het UWV kan uitsluitend een subsidie verstrekken of een persoonsgebonden re-integratieovereenkomst sluiten indien:

      a. de aanvraag wordt ingediend binnen zes weken nadat het oordeel van het UWV omtrent de aanwezigheid
      van passende arbeid in het bedrijf van zijn werkgever of in een ander bedrijf, als bedoeld in
      [artikel 2.7a, tweede lid, van de Wet IWIA][ref1], aan de arbeidsgehandicapte werknemer bekend is gemaakt;

      b. de aanvraag vergezeld gaat van een door of namens de werknemer opgesteld trajectplan waarin in elk geval zijn
      opgenomen:

      1°. het opleidingsniveau en het burgerservicenummer van de arbeidsgehandicapte werknemer;

      2°. een beschrijving van de werkzaamheden die de aanvrager op grond van
      [artikel 2.7a, eerste lid, van de Wet IWIA][ref2] zal laten verrichten;

      3°. de verwachte begin- en einddatum van de werkzaamheden, bedoeld in [artikel 2.7a van de Wet IWIA][ref3];

      4°. de beroepsactiviteiten die de aanvrager naar verwachting na afloop van die periode kan vervullen;

      5°. een begroting van de kosten van de in [artikel 4.8][ref4] bedoelde werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0019058#Artikel2.7a
      [ref2]: https://wetten.overheid.nl/BWBR0019058#Artikel2.7a
      [ref3]: https://wetten.overheid.nl/BWBR0019058#Artikel2.7a
      [ref4]: https://wetten.overheid.nl/BWBR0013267#Artikel4.8
