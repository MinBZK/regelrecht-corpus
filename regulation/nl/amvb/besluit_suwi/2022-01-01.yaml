    text: |-
      1 Het UWV kan ten behoeve van een persoon als bedoeld in
      [artikel 30a, eerste lid, onderdelen a en c, van de Wet SUWI][ref1], op diens aanvraag een individuele re-
      integratieovereenkomst sluiten met een re-integratiebedrijf, overeenkomstig de voorkeur van de aanvrager, ter
      uitvoering van werkzaamheden die zijn gericht op de inschakeling in het arbeidsproces, tenzij het betreft:

      a. een uitkeringsgerechtigde op grond van de [Werkloosheidswet][ref2], bij wie geen sprake is van ongeschiktheid
      tot het verrichten van zijn arbeid wegens ziekte;

      b. een uitkeringsgerechtigde op grond van de [Wet inkomensvoorziening oudere werklozen][ref3].

      2 Het UWV bepaalt het ten hoogste aan het re-integratiebedrijf verschuldigde bedrag voor de uitvoering van de
      individuele re-integratieovereenkomst, bedoeld in het eerste lid, en het tijdvak waarvoor de individuele re-
      integratieovereenkomst, bedoeld in het eerste lid, wordt gesloten.

      3 Bij ministeriële regeling kunnen regels worden gesteld omtrent de voorwaarden waaronder door het UWV een
      individuele re-integratieovereenkomst als bedoeld in het eerste lid, kan worden gesloten en omtrent de inhoud van
      de individuele re-integratieovereenkomst, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
      [ref2]: https://wetten.overheid.nl/BWBR0004045
