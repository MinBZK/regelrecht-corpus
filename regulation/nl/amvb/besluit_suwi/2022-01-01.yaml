  - number: '5.15'
    text: |-
      1 De SVB en het UWV zijn bevoegd op verzoek uit de onder hun verantwoordelijkheid gevoerde administraties
      aan instanties, genoemd in [artikel 73, eerste en tweede lid, van de Wet SUWI][ref1], en derden, bedoeld in
      [artikel 5.12, tweede lid][ref2], persoonsgegevens, gegevens over de uitkeringsverhouding en over opleiding en
      werkervaring te verstrekken.

      2 De in het eerste lid bedoelde gegevens, niet zijnde bijzondere categorieën van persoonsgegevens
      en persoonsgegevens van strafrechtelijke aard als bedoeld in [paragraaf 3.1][ref3] respectievelijk
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref4], kunnen door de SVB en het
      UWV systematisch worden verstrekt aan de instanties, genoemd in [artikel 73, eerste en tweede lid][ref5], indien
      met de desbetreffende instantie overeenstemming is bereikt over de te verstrekken gegevens, de omstandigheden
      waaronder, de regelmaat waarmee en de wijze waarop die verstrekking plaatsvindt, vast te leggen in een besluit, dat
      op adequate wijze wordt bekendgemaakt.

      3 De bevoegdheid op grond van het eerste lid geldt ook voor het UWV voor het verstrekken van andere gegevens dan
      bedoeld in [artikel 5.12][ref6], die door het UWV worden verwerkt op grond van [artikel 33a van de Wet SUWI][ref7].

      4 Bij ministeriële regeling wordt bepaald welke gegevens op grond van het derde lid worden verstrekt.

      5 Bij het verstrekken van gegevens op grond van dit artikel worden kosten in rekening gebracht. Bij ministeriële
      regeling worden hiervoor nadere regels gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel73
