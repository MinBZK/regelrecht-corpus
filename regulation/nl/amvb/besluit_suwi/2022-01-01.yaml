  - number: 5a.2
    text: |-
      1 Indien het verzoek voldoet aan [artikel 5a.1, tweede tot en met vierde lid][ref1], worden de gegevens
      overeenkomstig [artikel 65, eerste lid, van de Wet SUWI][ref2] verwerkt, nadat het samenwerkingsverband de
      noodzakelijke bestanden kosteloos en voldoende beveiligd aan de verwerker heeft aangeleverd.

      2 Als verwerker voor de koppeling van de bestanden in SyRI wordt de Stichting Inlichtingenbureau aangewezen.

      3 De verwerker verricht achtereenvolgens de volgende activiteiten ten behoeve van het SyRI-project:

      a. hij brengt de door het samenwerkingsverband aangeleverde bestanden die ten behoeve van de uitvoering van het
      risicomodel noodzakelijk zijn samen;

      b. hij creëert bestanden met versleutelde persoons- en bedrijfsgegevens, zodanig dat deze voor anderen niet meer
      tot natuurlijke personen en rechtspersonen herleidbaar zijn;

      c. hij creëert een afzonderlijk bestand met de sleutels voor de ontsleuteling van de versleutelde gegevens, bedoeld
      in onderdeel b;

      d. hij maakt de bestanden gereed voor koppeling;

      e. hij neemt de gegevens op in SyRI door het koppelen van de bestanden, bedoeld in onderdeel b, overeenkomstig
      het risicomodel;

      f. hij ontsleutelt alleen die gegevens die op basis van de resultaten van de koppeling van de bestanden duiden op
      een verhoogd risico op onregelmatigheden als bedoeld in [artikel 64, eerste lid, van de Wet SUWI][ref3] en legt
      daar een bestand van aan;

      g. hij verstrekt het bestand, bedoeld in onderdeel f, aan Onze Minister.

      4 De verwerker vernietigt de in het kader van het SyRI-project aan hem verstrekte bestanden, de door hem bewerkte
      bestanden en de bestanden, bedoeld in het derde lid, onderdeel c, binnen vier weken nadat het bestand, bedoeld in
      het derde lid, onderdeel g, aan Onze Minister is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel5a.1
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel65
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel64
