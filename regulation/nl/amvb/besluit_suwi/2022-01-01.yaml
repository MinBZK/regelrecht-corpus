  - number: '3.5'
    text: |-
      1 Het UWV verricht op verzoek van het college van burgemeester en wethouders of op verzoek van een persoon als
      bedoeld in [artikel 38b, eerste lid, onderdeel a of e, van de Wfsv][ref1] een beoordeling of die persoon in staat
      is het wettelijk minimumloon, bedoeld in [artikel 2, onderdeel c, van de Participatiewet][ref2], te verdienen.

      2 Bij ministeriële regeling kunnen regels worden gesteld voor de vergoeding van de kosten van de beoordeling,
      bedoeld in het eerste lid, door het college van burgemeester en wethouders aan het UWV.

      3 In het kader van de beoordeling, bedoeld in het eerste lid, wordt door het UWV het arbeidsvermogen van de
      betrokken persoon beoordeeld.

      4 Het arbeidsvermogen, bedoeld in het derde lid, wordt getoetst aan de methodiek van drempelfuncties die het UWV
      hanteert bij de beoordeling van arbeidsongeschiktheid.

      5 Onder een drempelfunctie als bedoeld in het vierde lid wordt verstaan een bestaande functie op de Nederlandse
      arbeidsmarkt die de ondergrens van de verdiencapaciteit markeert, met een minimale belasting waardoor deze geschikt
      is voor mensen met beperkingen.

      6 Indien uit de analyse, bedoeld in het derde lid en vierde lid, blijkt dat een persoon geen drempelfunctie of
      voor een deel één drempelfunctie kan uitvoeren wordt de persoon niet geacht in staat te zijn het minimumloon te
      verdienen met dien verstande dat de beperkingen of belemmeringen die een persoon ondervindt naar verwachting nog
      ten minste voor 6 maanden na de beoordeling zullen bestaan.

      7 Indien uit de analyse, bedoeld in het derde lid en vierde lid, blijkt dat een persoon één drempelfunctie kan
      uitvoeren of één drempelfunctie kan uitvoeren met behulp van aanpassingen wordt de persoon geacht in staat te zijn
      het minimumloon te verdienen.

      8 Met betrekking tot de beoordeling door het UWV of een persoon een arbeidsbeperkte is als bedoeld in
      [artikel 38b, tweede lid, van de Wfsv][ref3], is dit artikel van overeenkomstige toepassing met dien verstande dat
      in afwijking van het zevende lid uit de analyse, bedoeld in het derde lid en vierde lid, blijkt dat een persoon één
      drempelfunctie met behulp van een voorziening op grond van [artikel 10 van de Participatiewet][ref4] of op grond
      van [artikel 35 van de Wet WIA][ref5] kan uitvoeren.

      9 Op een beoordeling als bedoeld in het eerste lid waarom verzocht is voor 28 oktober 2016 is het zevende lid,
      zoals dat luidde op 27 oktober 2016, van toepassing.

      10 Een beoordeling als bedoeld in het eerste lid is niet langer geldig indien:

      a. door het college van burgemeester en wethouders in overeenstemming met de eisen gesteld aan een
      loonwaardevaststelling op grond van [artikel 10d, eerste of tweede lid, van de Participatiewet][ref6]
      een loonwaarde is vastgesteld die bij voltijdse arbeid ten minste het wettelijk minimumloon, bedoeld in
      [artikel 2, onderdeel c, van de Participatiewet][ref7], bedraagt; of

      b. het inkomen uit arbeid in dienstbetrekking ten minste het minimumloon, bedoeld in
      [artikel 2, onderdeel c, van de Participatiewet][ref8] bedraagt en ten behoeve van die persoon in die periode geen
      loonkostensubsidie als bedoeld in [artikel 10d van de Participatiewet][ref9] is verstrekt.


