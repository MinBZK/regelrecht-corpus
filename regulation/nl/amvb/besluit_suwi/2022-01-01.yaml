  - number: '5.12'
    text: |-
      1 Het UWV is bevoegd op verzoek uit de onder zijn verantwoordelijkheid gevoerde administraties aan
      instanties als bedoeld in [artikel 73, eerste en tweede lid][ref1], en aan derden als bedoeld in
      [artikel 73a, tweede lid, van de Wet SUWI][ref2], de volgende mede van de Belastingdienst afkomstige gegevens te
      verstrekken:

      a. *gegevens over de werknemer*: adresgegevens, namen, burgerservicenummer, geboortedatum, geslacht en
      overlijdensdatum;

      b. *verzekeringsplicht werknemersverzekeringen*: indicatie verzekerd en premies voor de werknemersverzekeringen;

      c. *gegevens over de inkomstenverhouding*: soort inkomstenverhouding, aard arbeidsverhouding, datum begin en
      einde van inkomstenverhouding, sector, fase indeling Flexibiliteit en Zekerheid, collectieve arbeidsovereenkomst,
      reden einde arbeidsovereenkomst, indicatie arbeidsovereenkomst voor onbepaalde tijd, indicatie schriftelijke
      overeenkomst, indicatie oproepovereenkomst, indicatie jaarurennorm, indicatie publiekrechtelijke aanstelling voor
      onbepaalde tijd;

      d. *loongerelateerde gegevens*: aantal verloonde uren, loon SV, (opgebouwd recht) vakantiebijslag, (opbouw of
      opname) arbeidsvoorwaardenbedrag, indicatie aanvulling op uitkering, indicatie vakantiebonnen toegepast;

      e. *gegevens over de werkgever*: naam, loonheffingennummer, het RSIN of een aan een onderneming of rechtspersoon
      toegekend uniek nummer waarmee een onderneming of rechtspersoon in het handelsregister is opgenomen,
      rechtsvorm, risicopremiegroep, sector, voortzettingsrelatie, datum oprichting, datum ontbinding, statutaire
      zetel, adresgegevens, eigenrisicodragerschap, premiepercentage individueel, faillissement of surseance en
      gemoedsbezwaardheid.

      2 De in [artikel 73a, tweede lid, van de Wet SUWI][ref3] bedoelde derden zijn: deskundigen en instellingen die in
      het kader van de uitoefening van beroep of bedrijf taken uitvoeren of diensten verrichten ter ondersteuning van
      administraties of het verrichten van keuringen.

      3 Bij het verstrekken van gegevens op grond van dit artikel worden kosten in rekening gebracht. Bij ministeriële
      regeling worden hiervoor nadere regels gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel73a
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel73a
