  - number: 5.5b
    text: |-
      1 Ter uitvoering van [artikel 72a van de Wet SUWI][ref1] verstrekken het UWV, de SVB en de colleges van
      burgemeesters en wethouders aan Onze Minister ten behoeve van de onder hem ressorterende opsporingsdienst kosteloos
      en uitsluitend het gegeven of een natuurlijk persoon een uitkering ontvangt, welke uitkering het betreft en welke
      uitvoeringsinstantie die uitkering verstrekt.

      2 Voor het verstrekken van de in het eerste lid bepaalde gegevens en inlichtingen maken het UWV, de SVB
      en de colleges van burgemeesters en wethouders gebruik van elektronische voorzieningen als bedoeld in
      [paragraaf 5.6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel72a
