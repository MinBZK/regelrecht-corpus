  - number: '2.6'
    text: |-
      1 De werkgeversdienstverlening vindt plaats in de arbeidsmarktregio.

      2 De centrumgemeente treedt op als regievoerder voor de regionale samenwerking in de arbeidsmarktregio, bedoeld in
      [artikel 2.5][ref1], tenzij de colleges van burgemeester en wethouders van gemeenten binnen de arbeidsmarktregio
      een andere gemeente aanwijzen als regievoerder voor de werkgeversdienstverlening.

      3 De colleges van burgemeester en wethouders in de arbeidsmarktregio en het UWV stellen jaarlijks één gezamenlijk
      uitvoeringsplan vast voor de uitvoering van de werkgeversdienstverlening in het werkgeversservicepunt in die
      arbeidsmarktregio. Dit uitvoeringsplan bevat in elk geval:

      a. de wijze van organisatie van de dienstverlening, bedoeld in [artikel 2.5][ref2], waaronder het proces van
      dienstverlening;

      b. afspraken over de inzet van instrumenten en voorzieningen in die arbeidsmarktregio, bedoeld in
      [artikel 2.5, tweede lid, onderdeel b, onder 2°][ref3];

      c. de te behalen resultaten in die arbeidsmarktregio met betrekking tot de dienstverlening, bedoeld
      in [artikel 2.5, tweede lid][ref4], op basis van de regionale arbeidsmarktanalyse, bedoeld in
      [artikel 2.3, derde lid][ref5]; en

      d. de wijze van aansluiting op de werkzoekendendienstverlening en scholing in de arbeidsmarktregio.

      4 De colleges van burgemeester en wethouders in de arbeidsmarktregio en het UWV evalueren jaarlijks de uitvoering
      van het gezamenlijke uitvoeringsplan, bedoeld in het derde lid, inclusief de uitkomsten op het gebied van
      werkgeverstevredenheid op basis van een periodieke meting in die arbeidsmarktregio.

      5 De colleges van burgemeester en wethouders en het UWV maken afspraken over de wijze waarop vacatures en gegevens
      van werkzoekenden op het werkgeversservicepunt beschikbaar worden gemaakt.

      6 Bij ministeriële regeling worden nadere regels gesteld voor de naamgeving van het gezamenlijk aanspreekpunt,
      bedoeld in [artikel 2.5, derde lid][ref6] en de verslaglegging over de resultaten, bedoeld in het derde lid,
      onderdeel c.


