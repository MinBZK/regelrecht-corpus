      1 De gegevens die het UWV op grond van [artikel 73, negende lid, van de Wet SUWI][ref1] bevoegd is te verstrekken
      betreffen gegevens omtrent naam, woon- of postadres, telefoonnummer, opleiding en werkervaring.

      2 De gegevens die het UWV op grond van [artikel 73, elfde lid, van de Wet SUWI][ref2] bevoegd is te verstrekken
      betreffen naam, woon- of postadres, telefoonnummer of e-mailadres.

      3 Bij het verstrekken van gegevens door het UWV op grond van
      [artikel 73, negende tot en met elfde lid, van de Wet SUWI][ref3], aan re-integratiebedrijven en ondersteunende
      instanties worden geen kosten in rekening gebracht.


