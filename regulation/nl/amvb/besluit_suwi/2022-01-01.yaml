  - number: '2.4'
    text: |-
      1 De regionale samenwerking, bedoeld in [artikel 10 van de Wet SUWI][ref1], wordt uitgevoerd in door het UWV
      jaarlijks vast te stellen arbeidsmarktregio’s.

      2 Bij ministeriële regeling wordt per arbeidsmarktregio een centrumgemeente vastgesteld die belast is met de regie
      op de regionale samenwerking en het beheer van de daarvoor beschikbaar gestelde financiële middelen.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel10
    url: https://wetten.overheid.nl/BWBR0013267/2022-01-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '10'
  - number: '2.5'
    text: |-
      1 De colleges van burgemeester en wethouders en het UWV dragen zorg voor de inrichting van
      werkgeversdienstverlening in het werkgeversservicepunt als bedoeld in [artikel 2.3, tweede lid, onderdeel g][ref1],
      in de arbeidsmarktregio.

      2 De dienstverlening aan werkgevers in het werkgeversservicepunt betreft in ieder geval:

      a. het voordragen bij een werkgever van passende kandidaten uit de registratie van werkzoekenden, bedoeld in
      [artikel 30b van de Wet SUWI][ref2], die personen zijn die de colleges van burgemeester en wethouders als bedoeld
      in [artikel 7, eerste lid, onderdeel a, van de Participatiewet][ref3] ondersteunen bij de arbeidsinschakeling of
      van wie het UWV op grond van [artikel 30a van de Wet SUWI][ref4] de taak heeft de inschakeling in het arbeidsproces
      te bevorderen;

      b. verstrekking van informatie en advies aan werkgevers, waaronder in elk geval:

      1°. voorlichting over de inzet van instrumenten en voorzieningen, inclusief de bijbehorende voorwaarden,
      die de bestuursorganen, bedoeld in de [artikelen 9][ref5] en [10 van de Wet SUWI][ref6], in die
      arbeidsmarktregio inzetten bij de uitvoering van de taken, bedoeld in [artikel 30a van de Wet SUWI][ref7] en
      [artikel 7 van de Participatiewet][ref8];

      2°. advies over de specifieke instrumenten en voorzieningen die aan de werkgever en de werknemer verstrekt kunnen
      worden bij een plaatsing op een werkplek en informatie over de daarbij behorende wet- en regelgeving;

      3°. advies over het zodanig organiseren van werk, dat de werkgever werkplekken kan aanbieden
      onder meer aan personen die behoren tot de doelgroep van arbeidsbeperkten als bedoeld in
      [artikel 38b van de Wet financiering sociale verzekeringen][ref9] en van wie gegevens zijn geregistreerd in de
      doelgroepregistratie, bedoeld in [artikel 3.2][ref10] van Besluit SUWI;

      4°. informatie over de ontwikkelingen op de arbeidsmarkt in de regio.

      3 Voor het bieden van de dienstverlening aan werkgevers richten de bestuursorganen, bedoeld in het eerste lid,
      binnen de arbeidsmarktregio één gezamenlijk aanspreekpunt in.


