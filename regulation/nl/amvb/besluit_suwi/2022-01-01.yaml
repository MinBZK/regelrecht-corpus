  - number: 3.2a
    text: |-
      1 Ten behoeve van de berekening van het quotumtekort, bedoeld in [artikel 38g, derde lid, van de Wfsv][ref1],
      voor de vaststelling van de quotumheffing, verwerkt het UWV in verband met de registratie van
      arbeidsbeperkten, bedoeld in [artikel 38d van de Wfsv][ref2], gegevens over inleenverbanden als bedoeld in
      [artikel 2.27 van het Besluit Wfsv][ref3].

      2 Het UWV verwerkt voor de inleenverbanden, bedoeld in het eerste lid, de gegevens, vastgesteld
      in [artikel 3.2b][ref4] over de uitlener, de inlener en de arbeidsbeperkte, bedoeld in
      [artikel 2.27 van het Besluit Wfsv][ref5], met het oog op het ter beschikking stellen door de uitlener van de
      arbeidsbeperkte aan de inlener om arbeid te verrichten.

      3 Het UWV verstrekt de Belastingdienst uit eigen beweging de gegevens, die zijn verkregen op
      grond van het eerste lid, die noodzakelijk zijn voor de uitvoering van zijn taak op grond van
      [hoofdstuk III, afdeling 4, paragraaf 4a, van de Wfsv][ref6].

      4 Het UWV is bevoegd gegevens die het verwerkt voor de uitvoering van de Wet arbeidsongeschiktheidsvoorziening
      jonggehandicapten en voor de uitvoering van de taak, bedoeld in [artikel 30d van de Wet SUWI][ref7], te verwerken
      voor inleenverbanden.


