  - number: '5.1'
    text: |-
      1 In de polisadministratie worden van de werknemer of de persoon die vrijwillig verzekerd is voor de [ZW][ref1], de
      [Wet WIA][ref2], de [WW][ref3] en de [WAO][ref4] de volgende gegevens verwerkt:

      a. *basisregistratie gegevens:*

      1°. *adresgegevens:* straatnaam, huisnummer, huisnummertoevoeging, postcode, woonplaatsnaam, gemeentenaam,
      woonobjectverwijzing en locatieomschrijving; en

      2°. *buitenlandse adresgegevens:* straatnaam, huisnummer, huisnummertoevoeging, postcode, woonplaats,
      locatieomschrijving, regionaam en landcode ISO;

      b. *postbusadresgegevens:* postbusnummer, postcode, woonplaats, gemeentenaam en locatieomschrijving;

      c. *sociaal verzekeringsnummer buitenland:* verzekeringsnummer en landcode ISO;

      d. *persoonsgegevens:* namen, burgerservicenummer, het administratienummer, bedoeld in
      [artikel 4.9 van de Wet basisregistratie personen][ref5] (A-nummer), geboortedatum, overlijdensdatum, geslacht,
      burgerlijke staat, leefvorm, nationaliteit, verblijfstitel, datum vertrek uit Nederland, indicatie curatelestelling
      en indicatie voor informatiebeveiliging;

      e. *ontheffing wegens gemoedsbezwaren;*

      f. *verzekeringsplicht werknemersverzekeringen:* gegevens inzake de vaststelling verzekeringsplicht, indicaties
      verzekerd en premies voor de werknemersverzekeringen;

      g. *gegevens over de werkgever in de zin van de Wfsv en de inhoudingsplichtige in de zin van de Wet op de
      loonbelasting 1964:* naam en loonheffingennummer;

      h. *gegevens over de inkomstenverhouding:* personeelsnummer, soort inkomstenverhouding, collectieve
      arbeidsovereenkomst, sector, datum begin en einde van inkomstenverhouding, reden einde arbeidsovereenkomst en code
      invloed verzekeringsplicht;

      i. *loongerelateerde gegevens:* lonen, aantal verloonde uren, ingehouden loonbelasting en premie
      volksverzekeringen, inkomensafhankelijke bijdrage als bedoeld in [artikel 41 van de ZVW][ref6],
      verzekeringssituatie ZVW, andere gegevens van belang voor de heffing van inkomstenbelasting en heffing van
      loonbelasting en premies werknemersverzekeringen en het aanvragen tegemoetkomingen loondomein.

      2 In aanvulling op het eerste lid kunnen tevens bij regeling van Onze Minister, in overeenstemming met Onze
      Minister van Financiën, aan te wijzen gegevens worden verwerkt die afkomstig zijn van een werkgever in de zin van
      de [Wfsv][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0019057
      [ref3]: https://wetten.overheid.nl/BWBR0004045
