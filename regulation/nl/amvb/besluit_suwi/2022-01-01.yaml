        paragraaf: '4.3'
  - number: '4.20'
    text: |-
      1 In de persoonsgebonden re-integratieovereenkomst wordt in elk geval geregeld:

      a. de duur van de overeenkomst alsmede de hoogte van de kosten die door het re-integratiebedrijf in rekening zullen
      worden gebracht;

      b. dat het re-integratiebedrijf iedere drie maanden bij het UWV een rapportage indient waarin een beschrijving
      is opgenomen van de werkzaamheden die zijn verricht ten behoeve van het behoud, herstel of bevordering van
      mogelijkheden tot het verrichten van arbeid van de arbeidsgehandicapte werknemer. In de rapportage worden tevens de
      resultaten van de uitvoering van het trajectplan, bedoeld in [artikel 4.10, onderdeel b][ref1], en de prognose voor
      de resterende periode van het traject beschreven en wordt een overzicht gegeven van de tot op dat moment gemaakte
      kosten;

      c. dat de overeenkomst door beide partijen wegens gewichtige redenen tussentijds door opzegging kan worden
      beëindigd;

      d. dat de prijs voor de overeenkomst uitsluitend wordt betaald voor die werkzaamheden, die zijn beschreven in
      het in [artikel 4.10, onderdeel b][ref2], bedoelde trajectplan, tenzij het UWV voor het verrichten van andere
      werkzaamheden schriftelijk goedkeuring heeft verleend;

      e. dat het re-integratiebedrijf voldoet aan verplichtingen als bedoeld in
      [artikel 4.12, eerste lid, onderdeel c][ref3];

      f. dat het re-integratiebedrijf aan het UWV op verzoek of na toestemming van de subsidie-ontvanger uit eigen
      beweging gegevens verstrekt over de uitvoering van de overeenkomst.

      2 Bij ministeriële regeling kunnen regels worden gesteld omtrent het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4.10
      [ref2]: https://wetten.overheid.nl/BWBR0013267#Artikel4.10
      [ref3]: https://wetten.overheid.nl/BWBR0013267#Artikel4.12
