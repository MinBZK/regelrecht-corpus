  - number: '4.7'
    text: |-
      In deze paragraaf en de daarop berustende bepalingen wordt verstaan onder:

      a. arbeidsgehandicapte werknemer: een arbeidsgehandicapte werknemer als bedoeld in
      [artikel 31, eerste lid, van de Wet REA][ref1], zoals deze luidde op de dag voorafgaand aan de
      dag van inwerkingtreding van de [Wet IWIA][ref2], dan wel een werknemer of persoon als bedoeld in
      [artikel 2.7a, eerste lid, van de Wet IWIA][ref3];

      b. subsidie: een subsidie als bedoeld in [artikel 2.7a, eerste lid, onderdeel a, van de Wet IWIA][ref4];

      c. subsidie-ontvanger: de arbeidsgehandicapte werknemer aan wie een subsidie is verstrekt als bedoeld in
      [artikel 2.7a, eerste lid, onderdeel a, van de Wet IWIA][ref5];

      d. persoonsgebonden reïntegratie-overeenkomst: een overeenkomst als bedoeld in
      [artikel 2.7a, eerste lid, onderdeel b, van de Wet IWIA][ref6];

      e. begunstigde: de arbeidsgehandicapte werknemer ten behoeve van wie een overeenkomst is gesloten als bedoeld in
      [artikel 2.7a, eerste lid, onderdeel b, van de Wet IWIA][ref7];

      f. Wet IWIA: [Wet Invoering en financiering Wet werk en inkomen naar arbeidsvermogen][ref8].


