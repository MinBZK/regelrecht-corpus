  - number: '4.9'
    text: |-
      Bij de aanvraag, bedoeld in [artikel 2.7a van de Wet IWIA][ref1], vermeldt de aanvrager of zijn aanvraag betrekking
      heeft op verstrekking van subsidie dan wel het sluiten van een persoonsgebonden re-integratieovereenkomst door
      het UWV.


      [ref1]: https://wetten.overheid.nl/BWBR0019058#Artikel2.7a
    url: https://wetten.overheid.nl/BWBR0013267/2022-01-01#Artikel4.9
