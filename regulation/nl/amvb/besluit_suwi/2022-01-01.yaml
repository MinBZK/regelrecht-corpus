  - number: '5.19'
    text: |-
      Ten behoeve van de gegevensverwerking, bedoeld in [artikel 62 van de Wet SUWI][ref1], worden de elektronische
      voorzieningen in ieder geval benut:

      a. om de gebruikers en derde partijen te faciliteren bij de raadpleging en aanlevering van de gegevens met het oog
      op eenmalige gegevensuitvraag en de inrichting van hun administraties daarbij;

      b. voor eenduidige informatieverstrekking aan de betrokkene op wie de gegevens betrekking hebben door gebruikers.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel62
    url: https://wetten.overheid.nl/BWBR0013267/2022-01-01#Artikel5.19
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '62'
  - number: '5.20'
    text: |-
      Bij ministeriële regeling wordt in het Gegevensregister SUWI bepaald:

      a. dat gegevens met behulp van de elektronische voorzieningen worden uitgewisseld;

      b. welke soort gegevens en documenten het daarbij betreft;

      c. wie de verwerkingsverantwoordelijke is;

      d. welke gegevens aan de betrokkene op wie de gegevens betrekking hebben worden gepresenteerd en op welke wijze.
    url: https://wetten.overheid.nl/BWBR0013267/2022-01-01#Artikel5.20
  - number: '5.21'
    text: |-
      1 Het UWV voert ten behoeve van de gezamenlijke zorg voor de instandhouding van de elektronische voorzieningen de
      volgende beheertaken uit:

      a. de inrichting van een centrale elektronische voorziening;

      b. de inrichting van een gemeenschappelijke faciliteit voor de toegangsbeveiliging;

      c. de ondersteuning van de gebruikers bij het beheer en gebruik van de centrale elektronische voorzieningen;

      d. het, na overleg met de gebruikers, doen van voorstellen aan Onze Minister over de wijziging van de ministeriële
      regelingen op grond van deze paragraaf.

      2 Het UWV belast een afzonderlijk en herkenbaar organisatieonderdeel met de taken, bedoeld in het eerste lid.

      3 De gebruikers zorgen, ten behoeve van het beheer en gebruik van onderdelen van de elektronische voorzieningen,
      voor de inrichting van een decentrale elektronische voorziening en de aansluiting daarvan op de centrale
      elektronische voorziening, bedoeld in het eerste lid, onderdeel a.

      4 Bij ministeriële regeling worden, in de vorm van het Stelselontwerp gezamenlijke elektronische voorzieningen
      SUWI, regels gesteld over de wijze waarop invulling wordt gegeven aan het eerste en derde lid.
    url: https://wetten.overheid.nl/BWBR0013267/2022-01-01#Artikel5.21
  - number: '5.22'
    text: |-
      1 De gebruikers dragen op uniforme wijze zorg voor de beveiliging van de gegevensverwerking door middel van de
      elektronische voorzieningen tegen inbreuken op de beschikbaarheid, de integriteit en de vertrouwelijkheid.

      2 Bij ministeriële regeling worden regels gesteld over deze beveiliging.
    url: https://wetten.overheid.nl/BWBR0013267/2022-01-01#Artikel5.22
  - number: '5.23'
    text: |-
      1 De elektronische voorzieningen worden tevens gebruikt voor de verwerking van gegevens als bedoeld in
      [artikel 62, tweede lid, tweede zin, van de Wet SUWI][ref1] indien er een overeenkomst is gesloten tussen één van
      de gebruikers, voor zover die tot de gegevensverstrekking of het opvragen van de gegevens bevoegd is, en een derde
      partij. De overeenkomst heeft in ieder geval betrekking op de gegevens die worden verstrekt en de stelselmatigheid
      van de verstrekking.

      2 In geval één van de partijen bij een overeenkomst als bedoeld in het eerste lid een college van burgemeester en
      wethouders is treedt het Inlichtingenbureau namens het betrokken college van burgemeester en wethouders als partij
      op, indien het de verwerking van gegevens betreft, bedoeld in [artikel 5.24][ref2].

      3 Op de gegevensverstrekking, bedoeld in dit artikel, is [artikel 5.20][ref3] van overeenkomstige toepassing.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld over de overeenkomst, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0013267#Artikel5.24
      [ref3]: https://wetten.overheid.nl/BWBR0013267#Artikel5.20
    url: https://wetten.overheid.nl/BWBR0013267/2022-01-01#Artikel5.23
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '62'
      - id: ref2
