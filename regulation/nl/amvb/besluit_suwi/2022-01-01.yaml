  - number: '3.2'
    text: |-
      1 Ten aanzien van de arbeidsbeperkte die wordt opgenomen in de registratie van arbeidsbeperkten, bedoeld in
      [artikel 38d van de Wfsv][ref1], worden de volgende gegevens vastgelegd:

      a. het burgerservicenummer;

      b. de aanduiding of hij een arbeidsbeperkte is als bedoeld in
      __REF000___________________________________________________________________________________________________________
      ___________________________, of de aanduiding dat hij een gelijkgestelde arbeidsbeperkte is op grond van
      [artikel 38f, vijfde lid, van de Wfsv][ref3];

      c. de datum van registratie;

      d. voor zover van toepassing de datum waarop de registratie eindigt.

      2 De registratie van een arbeidsbeperkte is geldig zolang wordt voldaan aan de voorwaarden, bedoeld in
      [artikel 38b, eerste of tweede lid, van de Wfsv][ref4], zolang hij een gelijkgestelde arbeidsbeperkte is op
      grond van [artikel 38f, vijfde lid, van de Wfsv][ref5], of zolang hij een arbeidsbeperkte of gelijkgestelde
      arbeidsbeperkte is op grond van artikel 38b, zesde lid, van de Wfsv, met dien verstande dat de registratie
      ten aanzien van de arbeidsbeperkte, bedoeld in artikel 38b, zesde lid, van de Wfsv, en de gelijkgestelde
      arbeidsbeperkte op grond van artikel 38f, vijfde lid, van de Wfsv die met overeenkomstige toepassing van artikel
      38b, zesde lid, van de Wfsv is geregistreerd, eindigt:

      a. op de dag waarop hij de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref6], bereikt, of

      b. op de dag waarop hij overlijdt.

      3 In afwijking van het tweede lid eindigt de registratie van een persoon ten aanzien van wie het college van
      burgemeester en wethouders op grond van [artikel 10b, eerste lid, van de Participatiewet][ref7] heeft vastgesteld
      dat hij uitsluitend in een beschutte omgeving onder aangepaste omstandigheden mogelijkheden tot arbeidsparticipatie
      heeft, op de dag direct volgend op die vaststelling.

      4 Een persoon die in de registratie van arbeidsbeperkten, bedoeld in [artikel 38d van de Wfsv][ref8], is opgenomen
      op grond van [artikel 38b, zesde lid, van de Wfsv][ref9], omdat hij niet langer aan de voorwaarden, bedoeld
      in artikel 38b, eerste of tweede lid, voldoet of geen gelijkgestelde arbeidsbeperkte meer is als bedoeld in
      [artikel 38f, vijfde lid, van de Wfsv][ref10], of een persoon die daarin uitsluitend is opgenomen op grond van
      [artikel 2.24][ref11] of [artikel 2.25, eerste lid, onderdeel b, van het Besluit Wfsv][ref12], kan verzoeken
      zijn opname in die registratie te beëindigen. De opname in de registratie van arbeidsbeperkten eindigt na een
      verzoek als bedoeld in de eerste zin op de dag waarop het UWV vaststelt dat de verzoeker in de registratie
      van arbeidsbeperkten is opgenomen op grond van artikel 38b, zesde lid, van de Wfsv, dan wel dat de verzoeker
      uitsluitend in de registratie van arbeidsbeperkten is opgenomen op grond van artikel 2.24 of artikel 2.25, eerste
      lid, onderdeel b, van het Besluit Wfsv, met dien verstande dat de opname in de registratie niet eindigt voor
      1 januari 2021.

      5 De mogelijkheid om een verzoek als bedoeld in het vierde lid te doen, is van overeenkomstige toepassing op een
      persoon die uitsluitend op grond van [artikel 38b, eerste lid, onderdeel f, van de Wfsv][ref13] is opgenomen in de
      registratie van arbeidsbeperkten, bedoeld in [artikel 38d van de Wfsv][ref14], met dien verstande dat de restrictie
      dat de beëindiging van de opname in de registratie van arbeidsbeperkten niet plaatsvindt voor 1 januari 2021 niet
      van toepassing is.


