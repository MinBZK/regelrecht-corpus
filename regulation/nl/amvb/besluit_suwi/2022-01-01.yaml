  - number: '4.1'
    text: |-
      1 Bij de toepassing van [artikel 30a, negende lid, van de Wet SUWI][ref1] laat het UWV de werkzaamheden verrichten
      op grond van een schriftelijke overeenkomst waarin in elk geval is geregeld, dat het re-integratiebedrijf verplicht
      is:

      a. alle gegevens en inlichtingen omtrent deze werkzaamheden op verzoek aan het UWV te verstrekken, voor zover dit
      noodzakelijk is voor de uitvoering van de in de aanhef genoemde wetten;

      b. de persoonlijke levenssfeer van de personen van wie de inschakeling in de arbeid wordt bevorderd, te beschermen
      overeenkomstig een reglement dat aan die personen en het UWV wordt overgelegd;

      c. in geval van een geschil tussen de te re-integreren persoon en het re-integratiebedrijf een klachten- en
      geschillenregeling toe te passen die door het re-integratiebedrijf aan de te re-integreren persoon en de partij met
      wie de in de aanhef bedoelde overeenkomst is gesloten, is overgelegd;

      d. toegang tot en inzage in alle gegevens te verlenen die een accountant naar zijn oordeel nodig heeft voor het
      instellen van een nader onderzoek als bedoeld in [artikel 42, vierde lid, van de Wet SUWI][ref2];

      e. op verzoek aan het UWV een schriftelijk oordeel van een accountant of een gelijkwaardige deskundige over de
      verwerking van informatie en de genomen maatregelen ter beveiliging van informatie door het re-integratiebedrijf
      over te leggen;

      f. de gegevens die het re-integratiebedrijf in verband met deze werkzaamheden verkrijgt uitsluitend te
      verwerken voor zover dat noodzakelijk is voor het verrichten van die werkzaamheden dan wel voor de naleving van
      verplichtingen als bedoeld in de onderdelen a tot en met e;

      g. indien dit re-integratiebedrijf deze werkzaamheden laat verrichten door een ander re-integratiebedrijf in een
      schriftelijke overeenkomst met dat andere re-integratiebedrijf te regelen dat voor dat bedrijf, die persoon of
      dienst de verplichtingen jegens het UWV, bedoeld in de onderdelen a tot en met f, gelden.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent het eerste lid.

      3 Indien het college van burgemeester en wethouders werkzaamheden, die in het kader van de voorzieningen,
      bedoeld in de [artikelen 7, eerste lid, onderdeel a, en zevende lid, van de Participatiewet][ref3],
      [34, eerste lid, onderdeel a, van de IOAW][ref4] en [artikel 34, eerste lid, onderdeel a, van de IOAZ][ref5],
      worden uitgevoerd, laat uitvoeren door een re-integratiebedrijf is het eerste lid van overeenkomstige toepassing,
      waarbij in de overeenkomst tevens is geregeld, dat het college op verzoek of uit eigen beweging in kennis worden
      gesteld van het gegronde vermoeden dat een persoon voor wie de voorzieningen zijn bestemd, onvoldoende medewerking
      verleent aan deze werkzaamheden, voorzover dit noodzakelijk is voor de uitvoering van genoemde wetten.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
