  - number: '3.4'
    text: |-
      1 De gegevens die de colleges van burgemeester en wethouders op grond van de [artikelen 77 van de Wet SUWI][ref1],
      [78 van de Participatiewet][ref2], [55 van de IOAW][ref3] en [55 van de IOAZ][ref4] aan Onze Minister verstrekken
      en worden verwerkt in verband met informatie over voorzieningen gericht op arbeidsinschakeling als bedoeld in
      [artikel 7, eerste lid, onderdeel a, van de Participatiewet][ref5], worden tevens verstrekt ten behoeve van de
      uitvoering van de [Wet banenafspraak en quotum arbeidsbeperkten][ref6].

      2 Onze Minister is bevoegd de gegevens, bedoeld in het eerste lid, ook indien deze gegevens worden verkregen
      door tussenkomst van het Centraal Bureau voor de Statistiek, te verstrekken aan het UWV ten behoeve van de
      verwerking in de registratie, bedoeld in [artikel 38d van de Wfsv][ref7], voor zover deze noodzakelijk zijn voor
      de bevordering van arbeidsdeelname van arbeidsbeperkten en voor de vaststelling van de quotumheffing, bedoeld in
      [artikel 38h van de Wfsv][ref8].

      3 Het UWV verstrekt de gegevens, die het UWV verwerkt in de registratie arbeidsbeperkten, bedoeld in
      [artikel 38d van de Wfsv][ref9], op verzoek van Onze Minister aan een door Onze Minister aan te wijzen derde ten
      behoeve van onderzoek en statistiek in verband met de [Wet banenafspraak en quotum arbeidsbeperkten][ref10].

      4 Bij ministeriële regeling worden de gegevens, bedoeld in het eerste lid, nader bepaald en kan het Centraal Bureau
      voor de Statistiek worden gemachtigd deze gegevens rechtstreeks aan het UWV te verstrekken.


