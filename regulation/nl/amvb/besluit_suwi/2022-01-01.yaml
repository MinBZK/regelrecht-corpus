    text: |-
      1 Van een inleenverband worden de volgende gegevens door het UWV verwerkt:

      a. het burgerservicenummer van de uitgeleende arbeidsbeperkte;

      b. identificatienummer uitlener;

      c. identificatienummer inlener, aangeleverd door de uitlener, overeenkomstig
      [artikel 2.29 van het Besluit Wfsv][ref1]; en

      d. het aantal toe te rekenen verloonde uren van de uitgeleende arbeidsbeperkte in het kalenderjaar waarover de
      quotumheffing wordt geheven dat de uitlener toerekent aan de inlener.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld ten aanzien van het eerste lid.


