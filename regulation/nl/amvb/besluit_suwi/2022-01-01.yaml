      1 In geval van een toekennende beschikking op een aanvraag als bedoeld in [artikel 4.2, eerste lid][ref1], sluit
      het UWV binnen zes weken na het nemen van die beschikking een overeenkomst met een re-integratiebedrijf dat de in
      artikel 4.2, eerste lid, bedoelde werkzaamheden uitvoert.

      2 De persoon ten behoeve van wie een individuele re-integratieovereenkomst als bedoeld in
      [artikel 4.2, eerste lid][ref2], wordt gesloten tekent een exemplaar van die overeenkomst voor gezien en verstrekt
      dit aan het UWV.


