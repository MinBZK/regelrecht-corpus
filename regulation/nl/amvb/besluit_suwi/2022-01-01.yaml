  - number: 5.18a
    text: |-
      1 Werkgevers als bedoeld in [artikel 73, derde lid, onderdeel a, van de Wet SUWI][ref1] zijn
      bevoegd persoonsgegevens, waaronder gegevens over gezondheid, van de persoon, die in zijn dienst
      of voor hem arbeid verricht of heeft verricht, te verstrekken aan verzekeraars als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref2], of financiële dienstverleners die bemiddelen in
      verzekeringen als bedoeld in artikel 1:1 van die wet, voor zover de verwerking noodzakelijk is voor:

      a. de beoordeling bij het aangaan van de overeenkomst van het door de verzekeraar te verzekeren risico van het
      betalen van loon in geval van ziekte van de werknemer dan wel van het risico van betalingen als gevolg van het
      eigenrisicodragen, bedoeld in [artikel 40, eerste lid, van de Wfsv][ref3] alsmede van verzekeringen van uitkeringen
      ten gevolge van arbeidsongeschiktheid;

      b. de uitvoering van de overeenkomst tot verzekering van het risico van het betalen van loon in geval van
      ziekte van de werknemer dan wel het risico van betalingen als gevolg van het eigenrisicodragen, bedoeld
      in [artikel 40, eerste lid, van de Wfsv][ref4], alsmede verzekeringen van uitkeringen ten gevolge van
      arbeidsongeschiktheid.

      2 Bij de gegevensverwerking noodzakelijk voor de beoordeling, bedoeld in het eerste lid, onderdeel a, kan de
      werkgever de volgende gegevens, waaronder gegevens over gezondheid, verstrekken van werknemers: geboortedatum,
      geslacht, gegevens over het dienstverband, salaris, verzuimstatistieken, arbeidsongeschiktheidspercentages van
      de werknemers bij verzuim en in verband met de beoordeling van een Wet WIA uitkering, ingangsdatum WGA-uitkering
      op grond van de [Wet WIA][ref5], datum beëindiging loongerelateerde uitkering, datum beëindiging uitkering op
      grond van de Wet WIA, begin- en einddatum van de ZW-uitkering, aantal werknemers met een ZW-uitkering op grond van
      [artikel 29b van de ZW][ref6].

      3 Bij de gegevensverwerking noodzakelijk voor de uitvoering van een overeenkomst als bedoeld in het eerste lid,
      onderdeel b, kan de werkgever de volgende gegevens, waaronder gegevens over gezondheid van werknemers verstrekken:
      NAW-gegevens, geboortedatum, geslacht, gegevens over het dienstverband, salaris, arbeidsongeschiktheids-
      of werkhervattingspercentage, lopende uitkeringen en regelingen, percentage loonwaarde, datum aanvang
      mutatie van verzuim, gegevens met betrekking tot de algemene voortgang van de re-integratie en het re-
      integratietraject, waaronder gegevens over het plan van aanpak en de instroom in de [WIA][ref7], bedoeld in
      [artikel 25, tweede lid, van de Wet WIA][ref8], en over het reïntegratieverslag, bedoeld in artikel 25, derde
      lid, van de Wet WIA, in verband met een aanvraag voor een uitkering, bedoeld in [artikel 65 van de Wet WIA][ref9],
      toekennings- en vervolgbeslissingen over uitkeringen op grond van de Wet WIA van UWV, gegevens over de WGA-
      uitkering in geval de werkgever eigenrisicodrager is in de zin van de Wet WIA, gegevens in verband met de
      mogelijkheid van regres, bedoeld in [artikel 99][ref10] of [100 van de Wet WIA][ref11].

      4 Bij de gegevensverwerking noodzakelijk voor de uitvoering van de taak, bedoeld in het eerste lid, onderdeel b,
      kan gebruik worden gemaakt van het burgerservicenummer voor zover er sprake is van verwerking van gegevens over
      gezondheid.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel73
