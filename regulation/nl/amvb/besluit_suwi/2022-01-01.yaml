        artikel: 4:35
  - number: '4.19'
    text: |-
      1 Het door het UWV aan het re-integratiebedrijf verschuldigde bedrag voor de uitvoering van de persoonsgebonden re-
      integratieovereenkomst bedraagt ten hoogste een bij ministeriële regeling vastgesteld bedrag.

      2 De persoonsgebonden re-integratieovereenkomst wordt gesloten voor een tijdvak van ten hoogste een jaar.

      3 Indien de aanvrager van een persoonsgebonden re-integratieovereenkomst of begunstigde aantoont dat de
      noodzakelijke kosten van de in [artikel 4.8][ref1] bedoelde werkzaamheden hoger zijn dan het in het eerste lid
      bedoelde bedrag of die werkzaamheden langer zullen duren dan een tijdvak van een jaar, kan een overeenkomst worden
      gesloten voor een hoger bedrag of een langere periode.

      4 De in het derde lid bedoelde bevoegdheid bestaat uitsluitend indien het in het eerste lid bedoelde bedrag of de
      in het derde lid bedoelde werkzaamheden gedurende een tijdvak van een jaar redelijkerwijs niet zullen kunnen leiden
      tot behoud, herstel of bevordering van mogelijkheden tot het verrichten van arbeid.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4.8
    url: https://wetten.overheid.nl/BWBR0013267/2022-01-01#Artikel4.19
    references:
