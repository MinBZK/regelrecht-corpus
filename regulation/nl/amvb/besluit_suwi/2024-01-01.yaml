    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel3.2
  - number: 3.2.2
    text: |-
      De registratie van een arbeidsbeperkte is geldig zolang wordt voldaan aan de voorwaarden, bedoeld in
      [artikel 38b, eerste of tweede lid, van de Wfsv][ref1], zolang hij een gelijkgestelde arbeidsbeperkte is op
      grond van [artikel 38f, vijfde lid, van de Wfsv][ref2], of zolang hij een arbeidsbeperkte of gelijkgestelde
      arbeidsbeperkte is op grond van artikel 38b, zesde lid, van de Wfsv, met dien verstande dat de registratie
      ten aanzien van de arbeidsbeperkte, bedoeld in artikel 38b, zesde lid, van de Wfsv, en de gelijkgestelde
      arbeidsbeperkte op grond van artikel 38f, vijfde lid, van de Wfsv die met overeenkomstige toepassing van artikel
      38b, zesde lid, van de Wfsv is geregistreerd, eindigt:


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel38b
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel38f
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel3.2
    references:
