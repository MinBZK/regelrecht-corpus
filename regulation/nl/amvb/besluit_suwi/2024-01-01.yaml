    text: 'De dienstverlening aan werkgevers in het werkgeversservicepunt betreft in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel2.5
  - number: 2.5.2.a
    text: |-
