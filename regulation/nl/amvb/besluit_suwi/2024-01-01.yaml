      [artikel 30b van de Wet SUWI][ref1], die personen zijn die de colleges van burgemeester en wethouders als bedoeld
      in [artikel 7, eerste lid, onderdeel a, van de Participatiewet][ref2] ondersteunen bij de arbeidsinschakeling of
      van wie het UWV op grond van [artikel 30a van de Wet SUWI][ref3] de taak heeft de inschakeling in het arbeidsproces
      te bevorderen;


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30b
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
