        artikel: 7a
  - number: 3.2.2.b
    text: op de dag waarop hij overlijdt.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel3.2
  - number: 3.2.3
    text: |-
      In afwijking van het tweede lid eindigt de registratie van een persoon ten aanzien van wie het college van
      burgemeester en wethouders op grond van [artikel 10b, eerste lid, van de Participatiewet][ref1] heeft vastgesteld
      dat hij uitsluitend in een beschutte omgeving onder aangepaste omstandigheden mogelijkheden tot arbeidsparticipatie
      heeft, op de dag direct volgend op die vaststelling.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel10b
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: 10b
  - number: 3.2.4
    text: |-
      Een persoon die in de registratie van arbeidsbeperkten, bedoeld in [artikel 38d van de Wfsv][ref1], is opgenomen
      op grond van [artikel 38b, zesde lid, van de Wfsv][ref2], omdat hij niet langer aan de voorwaarden, bedoeld
      in artikel 38b, eerste of tweede lid, voldoet of geen gelijkgestelde arbeidsbeperkte meer is als bedoeld in
      [artikel 38f, vijfde lid, van de Wfsv][ref3], of een persoon die daarin uitsluitend is opgenomen op grond van
      [artikel 2.24][ref4] of [artikel 2.25, eerste lid, onderdeel b, van het Besluit Wfsv][ref5], kan verzoeken
      zijn opname in die registratie te beëindigen. De opname in de registratie van arbeidsbeperkten eindigt na een
      verzoek als bedoeld in de eerste zin op de dag waarop het UWV vaststelt dat de verzoeker in de registratie
      van arbeidsbeperkten is opgenomen op grond van artikel 38b, zesde lid, van de Wfsv, dan wel dat de verzoeker
      uitsluitend in de registratie van arbeidsbeperkten is opgenomen op grond van artikel 2.24 of artikel 2.25, eerste
      lid, onderdeel b, van het Besluit Wfsv, met dien verstande dat de opname in de registratie niet eindigt voor
      1 januari 2021.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel38d
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel38b
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel38f
      [ref4]: https://wetten.overheid.nl/BWBR0019070#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0019070#Artikel2
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: 38d
      - id: ref2
        bwb_id: BWBR0017745
        artikel: 38b
      - id: ref3
        bwb_id: BWBR0017745
        artikel: 38f
      - id: ref4
        bwb_id: BWBR0019070
        artikel: '2'
      - id: ref5
        bwb_id: BWBR0019070
        artikel: '2'
  - number: 3.2.5
    text: |-
      De mogelijkheid om een verzoek als bedoeld in het vierde lid te doen, is van overeenkomstige toepassing op een
      persoon die uitsluitend op grond van [artikel 38b, eerste lid, onderdeel f, van de Wfsv][ref1] is opgenomen in de
      registratie van arbeidsbeperkten, bedoeld in [artikel 38d van de Wfsv][ref2], met dien verstande dat de restrictie
      dat de beëindiging van de opname in de registratie van arbeidsbeperkten niet plaatsvindt voor 1 januari 2021 niet
      van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel38b
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel38d
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: 38b
      - id: ref2
        bwb_id: BWBR0017745
        artikel: 38d
  - number: 3.2a.1
    text: |-
      Ten behoeve van de berekening van het quotumtekort, bedoeld in [artikel 38g, derde lid, van de Wfsv][ref1],
      voor de vaststelling van de quotumheffing, verwerkt het UWV in verband met de registratie van
      arbeidsbeperkten, bedoeld in [artikel 38d van de Wfsv][ref2], gegevens over inleenverbanden als bedoeld in
      [artikel 2.27 van het Besluit Wfsv][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel38g
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel38d
      [ref3]: https://wetten.overheid.nl/BWBR0019070#Artikel2
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel3.2a
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: 38g
      - id: ref2
        bwb_id: BWBR0017745
        artikel: 38d
      - id: ref3
        bwb_id: BWBR0019070
        artikel: '2'
  - number: 3.2a.2
    text: |-
      Het UWV verwerkt voor de inleenverbanden, bedoeld in het eerste lid, de gegevens, vastgesteld
      in [artikel 3.2b][ref1] over de uitlener, de inlener en de arbeidsbeperkte, bedoeld in
      [artikel 2.27 van het Besluit Wfsv][ref2], met het oog op het ter beschikking stellen door de uitlener van de
      arbeidsbeperkte aan de inlener om arbeid te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0019070#Artikel2
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel3.2a
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '3'
        hoofdstuk: 3a
      - id: ref2
        bwb_id: BWBR0019070
        artikel: '2'
  - number: 3.2a.3
    text: |-
      Het UWV verstrekt de Belastingdienst uit eigen beweging de gegevens, die zijn verkregen op
      grond van het eerste lid, die noodzakelijk zijn voor de uitvoering van zijn taak op grond van
      [hoofdstuk III, afdeling 4, paragraaf 4a, van de Wfsv][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Paragraaf4a
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel3.2a
    references:
      - id: ref1
        bwb_id: BWBR0017745
        paragraaf: 4a
  - number: 3.2a.4
    text: |-
      Het UWV is bevoegd gegevens die het verwerkt voor de uitvoering van de Wet arbeidsongeschiktheidsvoorziening
      jonggehandicapten en voor de uitvoering van de taak, bedoeld in [artikel 30d van de Wet SUWI][ref1], te verwerken
      voor inleenverbanden.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30d
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel3.2a
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 30d
  - number: 3.2b.1
    text: 'Van een inleenverband worden de volgende gegevens door het UWV verwerkt:'
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel3.2b
  - number: 3.2b.1.a
    text: het burgerservicenummer van de uitgeleende arbeidsbeperkte;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel3.2b
  - number: 3.2b.1.b
    text: identificatienummer uitlener;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel3.2b
  - number: 3.2b.1.c
    text: |-
      identificatienummer inlener, aangeleverd door de uitlener, overeenkomstig
      [artikel 2.29 van het Besluit Wfsv][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0019070#Artikel2
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel3.2b
    references:
      - id: ref1
        bwb_id: BWBR0019070
        artikel: '2'
  - number: 3.2b.1.d
    text: |-
      het aantal toe te rekenen verloonde uren van de uitgeleende arbeidsbeperkte in het kalenderjaar waarover de
      quotumheffing wordt geheven dat de uitlener toerekent aan de inlener.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel3.2b
  - number: 3.2b.2
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld ten aanzien van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel3.2b
  - number: '3.3'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat het UWV opgave doet aan de werkgever wie van zijn werknemers,
      of arbeidskrachten die aan de werkgever ter beschikking zijn gesteld om onder zijn leiding en toezicht arbeid te
      verrichten, zijn opgenomen in de registratie arbeidsbeperkten, bedoeld in [artikel 38d van de Wfsv][ref1], op basis
      van het burgerservicenummer op de momenten die bij die regeling zijn bepaald. Bij deze regeling kan worden bepaald
      dat bij de opgave van het UWV de datum waarop de registratie eindigt, wordt vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel38d
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: 38d
  - number: 3.4.1
    text: |-
      De gegevens die de colleges van burgemeester en wethouders op grond van de [artikelen 77 van de Wet SUWI][ref1],
      [78 van de Participatiewet][ref2], [55 van de IOAW][ref3] en [55 van de IOAZ][ref4] aan Onze Minister verstrekken
      en worden verwerkt in verband met informatie over voorzieningen gericht op arbeidsinschakeling als bedoeld in
      [artikel 7, eerste lid, onderdeel a, van de Participatiewet][ref5], worden tevens verstrekt ten behoeve van de
      uitvoering van de [Wet banenafspraak en quotum arbeidsbeperkten][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel77
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel78
      [ref3]: https://wetten.overheid.nl/BWBR0004044#Artikel55
      [ref4]: https://wetten.overheid.nl/BWBR0004163#Artikel55
      [ref5]: https://wetten.overheid.nl/BWBR0015703#Artikel7
      [ref6]: https://wetten.overheid.nl/BWBR0036551
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '77'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '78'
      - id: ref3
        bwb_id: BWBR0004044
        artikel: '55'
      - id: ref4
        bwb_id: BWBR0004163
        artikel: '55'
      - id: ref5
        bwb_id: BWBR0015703
        artikel: '7'
      - id: ref6
        bwb_id: BWBR0036551
  - number: 3.4.2
    text: |-
      Onze Minister is bevoegd de gegevens, bedoeld in het eerste lid, ook indien deze gegevens worden verkregen
      door tussenkomst van het Centraal Bureau voor de Statistiek, te verstrekken aan het UWV ten behoeve van de
      verwerking in de registratie, bedoeld in [artikel 38d van de Wfsv][ref1], voor zover deze noodzakelijk zijn voor
      de bevordering van arbeidsdeelname van arbeidsbeperkten en voor de vaststelling van de quotumheffing, bedoeld in
      [artikel 38h van de Wfsv][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel38d
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel38h
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: 38d
      - id: ref2
        bwb_id: BWBR0017745
        artikel: 38h
  - number: 3.4.3
    text: |-
      Het UWV verstrekt de gegevens, die het UWV verwerkt in de registratie arbeidsbeperkten, bedoeld in
      [artikel 38d van de Wfsv][ref1], op verzoek van Onze Minister aan een door Onze Minister aan te wijzen derde ten
      behoeve van onderzoek en statistiek in verband met de [Wet banenafspraak en quotum arbeidsbeperkten][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel38d
      [ref2]: https://wetten.overheid.nl/BWBR0036551
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: 38d
      - id: ref2
        bwb_id: BWBR0036551
  - number: 3.4.4
    text: |-
      Bij ministeriële regeling worden de gegevens, bedoeld in het eerste lid, nader bepaald en kan het Centraal Bureau
      voor de Statistiek worden gemachtigd deze gegevens rechtstreeks aan het UWV te verstrekken.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel3.4
  - number: 3.5.1
    text: |-
      Het UWV verricht op verzoek van het college van burgemeester en wethouders of op verzoek van een persoon als
      bedoeld in [artikel 38b, eerste lid, onderdeel a of e, van de Wfsv][ref1] een beoordeling of die persoon in staat
      is het wettelijk minimumloon, bedoeld in [artikel 2, onderdeel c, van de Participatiewet][ref2], te verdienen.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel38b
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel2
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: 38b
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '2'
  - number: 3.5.2
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld voor de vergoeding van de kosten van de beoordeling, bedoeld
      in het eerste lid, door het college van burgemeester en wethouders aan het UWV.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel3.5
  - number: 3.5.3
    text: |-
      In het kader van de beoordeling, bedoeld in het eerste lid, wordt door het UWV het arbeidsvermogen van de betrokken
      persoon beoordeeld.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel3.5
  - number: 3.5.4
    text: |-
      Het arbeidsvermogen, bedoeld in het derde lid, wordt getoetst aan de methodiek van drempelfuncties die het UWV
      hanteert bij de beoordeling van arbeidsongeschiktheid.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel3.5
  - number: 3.5.5
    text: |-
      Onder een drempelfunctie als bedoeld in het vierde lid wordt verstaan een bestaande functie op de Nederlandse
      arbeidsmarkt die de ondergrens van de verdiencapaciteit markeert, met een minimale belasting waardoor deze geschikt
      is voor mensen met beperkingen.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel3.5
  - number: 3.5.6
    text: |-
      Indien uit de analyse, bedoeld in het derde lid en vierde lid, blijkt dat een persoon geen drempelfunctie of
      voor een deel één drempelfunctie kan uitvoeren wordt de persoon niet geacht in staat te zijn het minimumloon te
      verdienen met dien verstande dat de beperkingen of belemmeringen die een persoon ondervindt naar verwachting nog
      ten minste voor 6 maanden na de beoordeling zullen bestaan.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel3.5
  - number: 3.5.7
    text: |-
      Indien uit de analyse, bedoeld in het derde lid en vierde lid, blijkt dat een persoon één drempelfunctie kan
      uitvoeren of één drempelfunctie kan uitvoeren met behulp van aanpassingen wordt de persoon geacht in staat te zijn
      het minimumloon te verdienen.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel3.5
  - number: 3.5.8
    text: |-
      Met betrekking tot de beoordeling door het UWV of een persoon een arbeidsbeperkte is als bedoeld in
      [artikel 38b, tweede lid, van de Wfsv][ref1], is dit artikel van overeenkomstige toepassing met dien verstande dat
      in afwijking van het zevende lid uit de analyse, bedoeld in het derde lid en vierde lid, blijkt dat een persoon één
      drempelfunctie met behulp van een voorziening op grond van [artikel 10 van de Participatiewet][ref2] of op grond
      van [artikel 35 van de Wet WIA][ref3] kan uitvoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel38b
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Artikel35
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: 38b
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0019057
        artikel: '35'
  - number: 3.5.9
    text: |-
      Op een beoordeling als bedoeld in het eerste lid waarom verzocht is voor 28 oktober 2016 is het zevende lid, zoals
      dat luidde op 27 oktober 2016, van toepassing.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel3.5
  - number: 3.5.10
    text: 'Een beoordeling als bedoeld in het eerste lid is niet langer geldig indien:'
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel3.5
  - number: 3.5.10.a
    text: |-
      door het college van burgemeester en wethouders in overeenstemming met de eisen gesteld aan een
      loonwaardevaststelling op grond van [artikel 10d, eerste of tweede lid, van de Participatiewet][ref1]
      een loonwaarde is vastgesteld die bij voltijdse arbeid ten minste het wettelijk minimumloon, bedoeld in
      [artikel 2, onderdeel c, van de Participatiewet][ref2], bedraagt; of


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel10d
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel2
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: 10d
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '2'
  - number: 3.5.10.b
    text: |-
      het inkomen uit arbeid in dienstbetrekking ten minste het minimumloon, bedoeld in
      [artikel 2, onderdeel c, van de Participatiewet][ref1] bedraagt en ten behoeve van die persoon in die periode geen
      loonkostensubsidie als bedoeld in [artikel 10d van de Participatiewet][ref2] is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel10d
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: 10d
  - number: 4.1.1
    text: |-
      Bij de toepassing van [artikel 30a, negende lid, van de Wet SUWI][ref1] laat het UWV de werkzaamheden verrichten
      op grond van een schriftelijke overeenkomst waarin in elk geval is geregeld, dat het re-integratiebedrijf verplicht
      is:


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 30a
  - number: 4.1.1.a
    text: |-
      alle gegevens en inlichtingen omtrent deze werkzaamheden op verzoek aan het UWV te verstrekken, voor zover dit
      noodzakelijk is voor de uitvoering van de in de aanhef genoemde wetten;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.1
  - number: 4.1.1.b
    text: |-
      de persoonlijke levenssfeer van de personen van wie de inschakeling in de arbeid wordt bevorderd, te beschermen
      overeenkomstig een reglement dat aan die personen en het UWV wordt overgelegd;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.1
  - number: 4.1.1.c
    text: |-
      in geval van een geschil tussen de te re-integreren persoon en het re-integratiebedrijf een klachten- en
      geschillenregeling toe te passen die door het re-integratiebedrijf aan de te re-integreren persoon en de partij met
      wie de in de aanhef bedoelde overeenkomst is gesloten, is overgelegd;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.1
  - number: 4.1.1.d
    text: |-
      toegang tot en inzage in alle gegevens te verlenen die een accountant naar zijn oordeel nodig heeft voor het
      instellen van een nader onderzoek als bedoeld in [artikel 42, vierde lid, van de Wet SUWI][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel42
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '42'
  - number: 4.1.1.e
    text: |-
      op verzoek aan het UWV een schriftelijk oordeel van een accountant of een gelijkwaardige deskundige over de
      verwerking van informatie en de genomen maatregelen ter beveiliging van informatie door het re-integratiebedrijf
      over te leggen;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.1
  - number: 4.1.1.f
    text: |-
      de gegevens die het re-integratiebedrijf in verband met deze werkzaamheden verkrijgt uitsluitend te verwerken voor
      zover dat noodzakelijk is voor het verrichten van die werkzaamheden dan wel voor de naleving van verplichtingen als
      bedoeld in de onderdelen a tot en met e;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.1
  - number: 4.1.1.g
    text: |-
      indien dit re-integratiebedrijf deze werkzaamheden laat verrichten door een ander re-integratiebedrijf in een
      schriftelijke overeenkomst met dat andere re-integratiebedrijf te regelen dat voor dat bedrijf, die persoon of
      dienst de verplichtingen jegens het UWV, bedoeld in de onderdelen a tot en met f, gelden.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.1
  - number: 4.1.2
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.1
  - number: 4.1.3
    text: |-
      Indien het college van burgemeester en wethouders werkzaamheden, die in het kader van de voorzieningen,
      bedoeld in de [artikelen 7, eerste lid, onderdeel a, en zevende lid, van de Participatiewet][ref1],
      [34, eerste lid, onderdeel a, van de IOAW][ref2] en [artikel 34, eerste lid, onderdeel a, van de IOAZ][ref3],
      worden uitgevoerd, laat uitvoeren door een re-integratiebedrijf is het eerste lid van overeenkomstige toepassing,
      waarbij in de overeenkomst tevens is geregeld, dat het college op verzoek of uit eigen beweging in kennis worden
      gesteld van het gegronde vermoeden dat een persoon voor wie de voorzieningen zijn bestemd, onvoldoende medewerking
      verleent aan deze werkzaamheden, voorzover dit noodzakelijk is voor de uitvoering van genoemde wetten.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0004163#Artikel34
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0004044
        artikel: '34'
      - id: ref3
        bwb_id: BWBR0004163
        artikel: '34'
  - number: 4.2.1
    text: |-
      Het UWV kan ten behoeve van een persoon als bedoeld in
      [artikel 30a, eerste lid, onderdelen a en c, van de Wet SUWI][ref1], op diens aanvraag een individuele re-
      integratieovereenkomst sluiten met een re-integratiebedrijf, overeenkomstig de voorkeur van de aanvrager, ter
      uitvoering van werkzaamheden die zijn gericht op de inschakeling in het arbeidsproces, tenzij het betreft:


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 30a
  - number: 4.2.1.a
    text: |-
      een uitkeringsgerechtigde op grond van de [Werkloosheidswet][ref1], bij wie geen sprake is van ongeschiktheid tot
      het verrichten van zijn arbeid wegens ziekte;


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: 4.2.1.b
    text: |-
      een uitkeringsgerechtigde op grond van de [Wet inkomensvoorziening oudere werklozen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024394
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0024394
  - number: 4.2.2
    text: |-
      Het UWV bepaalt het ten hoogste aan het re-integratiebedrijf verschuldigde bedrag voor de uitvoering van de
      individuele re-integratieovereenkomst, bedoeld in het eerste lid, en het tijdvak waarvoor de individuele re-
      integratieovereenkomst, bedoeld in het eerste lid, wordt gesloten.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.2
  - number: 4.2.3
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent de voorwaarden waaronder door het UWV een
      individuele re-integratieovereenkomst als bedoeld in het eerste lid, kan worden gesloten en omtrent de inhoud van
      de individuele re-integratieovereenkomst, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.2
  - number: 4.3.1
    text: |-
      In geval van een toekennende beschikking op een aanvraag als bedoeld in [artikel 4.2, eerste lid][ref1], sluit
      het UWV binnen zes weken na het nemen van die beschikking een overeenkomst met een re-integratiebedrijf dat de in
      artikel 4.2, eerste lid, bedoelde werkzaamheden uitvoert.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 4.3.2
    text: |-
      De persoon ten behoeve van wie een individuele re-integratieovereenkomst als bedoeld in
      [artikel 4.2, eerste lid][ref1], wordt gesloten tekent een exemplaar van die overeenkomst voor gezien en verstrekt
      dit aan het UWV.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '4.4'
    text: |-
      De aanvraag om een individuele re-integratieovereenkomst kan in ieder geval worden geweigerd in de gevallen waarin
      op grond van [artikel 4:35, eerste lid, onderdelen a en b en tweede lid, van de Algemene wet bestuursrecht][ref1]
      een subsidieverlening kan worden geweigerd, en indien niet wordt voldaan aan de krachtens
      [artikel 4.2, derde lid][ref2], door het UWV gestelde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '4.5'
    text: |-
      Onze Minister zendt binnen vier jaar na de inwerkingtreding van de [artikelen 4.2 tot en met 4.4][ref1] aan de
      Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze artikelen in de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '4.7'
    text: 'In deze paragraaf en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.7
  - number: 4.7.a
    text: |-
      arbeidsgehandicapte werknemer: een arbeidsgehandicapte werknemer als bedoeld in
      [artikel 31, eerste lid, van de Wet REA][ref1], zoals deze luidde op de dag voorafgaand aan de
      dag van inwerkingtreding van de [Wet IWIA][ref2], dan wel een werknemer of persoon als bedoeld in
      [artikel 2.7a, eerste lid, van de Wet IWIA][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0019058
      [ref3]: https://wetten.overheid.nl/BWBR0019058#Artikel2
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '31'
      - id: ref2
        bwb_id: BWBR0019058
      - id: ref3
        bwb_id: BWBR0019058
        artikel: '2'
  - number: 4.7.b
    text: |-
      subsidie: een subsidie als bedoeld in [artikel 2.7a, eerste lid, onderdeel a, van de Wet IWIA][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019058#Artikel2
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0019058
        artikel: '2'
  - number: 4.7.c
    text: |-
      subsidie-ontvanger: de arbeidsgehandicapte werknemer aan wie een subsidie is verstrekt als bedoeld in
      [artikel 2.7a, eerste lid, onderdeel a, van de Wet IWIA][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019058#Artikel2
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0019058
        artikel: '2'
  - number: 4.7.d
    text: |-
      persoonsgebonden reïntegratie-overeenkomst: een overeenkomst als bedoeld in
      [artikel 2.7a, eerste lid, onderdeel b, van de Wet IWIA][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019058#Artikel2
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0019058
        artikel: '2'
  - number: 4.7.e
    text: |-
      begunstigde: de arbeidsgehandicapte werknemer ten behoeve van wie een overeenkomst is gesloten als bedoeld in
      [artikel 2.7a, eerste lid, onderdeel b, van de Wet IWIA][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019058#Artikel2
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0019058
        artikel: '2'
  - number: 4.7.f
    text: |-
      Wet IWIA: [Wet Invoering en financiering Wet werk en inkomen naar arbeidsvermogen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019058
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0019058
  - number: 4.8.1
    text: |-
      Het UWV kan op een aanvraag als bedoeld in [artikel 2.7a van de Wet IWIA][ref1] een subsidie verstrekken
      ter voldoening van de noodzakelijk te maken kosten van werkzaamheden die zijn gericht op behoud, herstel of
      bevordering van mogelijkheden tot het verrichten van arbeid, waaronder begrepen het behouden en verkrijgen van een
      dienstbetrekking, of een persoonsgebonden re-integratieovereenkomst sluiten ter uitvoering van die werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0019058#Artikel2
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0019058
        artikel: '2'
  - number: 4.8.2
    text: 'Onder werkzaamheden als bedoeld in het eerste lid worden uitsluitend verstaan:'
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.8
  - number: 4.8.2.a
    text: begeleiding en advisering;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.8
  - number: 4.8.2.b
    text: opleiding;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.8
  - number: 4.8.2.c
    text: |-
      arbeidsbemiddeling en andere werkzaamheden die, in aansluiting op de onder a en b bedoelde werkzaamheden, zijn
      gericht op behoud, herstel of bevordering van mogelijkheden tot het verrichten van arbeid.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.8
  - number: 4.8.3
    text: |-
      Kosten van werkzaamheden die niet zijn beschreven in het in [artikel 4.10, onderdeel b][ref1], bedoelde trajectplan
      komen niet voor subsidiëring in aanmerking en ter uitvoering van die werkzaamheden wordt geen persoonsgebonden re-
      integratieovereenkomst gesloten, tenzij het UWV voor het verrichten van die werkzaamheden schriftelijk goedkeuring
      heeft verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '4.9'
    text: |-
      Bij de aanvraag, bedoeld in [artikel 2.7a van de Wet IWIA][ref1], vermeldt de aanvrager of zijn aanvraag betrekking
      heeft op verstrekking van subsidie dan wel het sluiten van een persoonsgebonden re-integratieovereenkomst door
      het UWV.


      [ref1]: https://wetten.overheid.nl/BWBR0019058#Artikel2
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.9
    references:
      - id: ref1
        bwb_id: BWBR0019058
        artikel: '2'
  - number: '4.10'
    text: 'Het UWV kan uitsluitend een subsidie verstrekken of een persoonsgebonden re-integratieovereenkomst sluiten indien:'
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.10
  - number: 4.10.a
    text: |-
      de aanvraag wordt ingediend binnen zes weken nadat het oordeel van het UWV omtrent de aanwezigheid
      van passende arbeid in het bedrijf van zijn werkgever of in een ander bedrijf, als bedoeld in
      [artikel 2.7a, tweede lid, van de Wet IWIA][ref1], aan de arbeidsgehandicapte werknemer bekend is gemaakt;


      [ref1]: https://wetten.overheid.nl/BWBR0019058#Artikel2
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0019058
        artikel: '2'
  - number: 4.10.b
    text: |-
      de aanvraag vergezeld gaat van een door of namens de werknemer opgesteld trajectplan waarin in elk geval zijn
      opgenomen:
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.10
  - number: 4.10.b.1°
    text: het opleidingsniveau en het burgerservicenummer van de arbeidsgehandicapte werknemer;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.10
  - number: 4.10.b.2°
    text: |-
      een beschrijving van de werkzaamheden die de aanvrager op grond van
      [artikel 2.7a, eerste lid, van de Wet IWIA][ref1] zal laten verrichten;


      [ref1]: https://wetten.overheid.nl/BWBR0019058#Artikel2
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0019058
        artikel: '2'
  - number: 4.10.b.3°
    text: |-
      de verwachte begin- en einddatum van de werkzaamheden, bedoeld in [artikel 2.7a van de Wet IWIA][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019058#Artikel2
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0019058
        artikel: '2'
  - number: 4.10.b.4°
    text: de beroepsactiviteiten die de aanvrager naar verwachting na afloop van die periode kan vervullen;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.10
  - number: 4.10.b.5°
    text: |-
      een begroting van de kosten van de in [artikel 4.8][ref1] bedoelde werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.11.1
    text: |-
      De werkgever vergoedt aan het UWV 50 procent van de kosten die door het re-integratiebedrijf aan het UWV in
      rekening worden gebracht voor het verrichten van werkzaamheden ter uitvoering van de persoonsgebonden re-
      integratieovereenkomst, tenzij de arbeidsgehandicapte werknemer binnen drie maanden nadat de werkzaamheden ter
      uitvoering van de persoonsgebonden re-integratieovereenkomst zijn geëindigd een dienstbetrekking met een andere
      werkgever is aangegaan en deze arbeidsgehandicapte werknemer voor een aaneengesloten periode van ten minste 26
      weken daadwerkelijk in dienstbetrekking met deze andere werkgever heeft gestaan of met die arbeid in een periode
      van één jaar ten minste gedurende 26 weken inkomsten heeft verworven waardoor hij geen recht meer heeft op
      een uitkering anders dan een arbeidsongeschiktheidsuitkering in verband met het verwerven van die inkomsten of
      verrichten van die arbeid.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.11
  - number: 4.11.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing indien de werknemer voor het verrichten van de werkzaamheden een
      subsidie als bedoeld in deze paragraaf heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.11
  - number: 4.11.3
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.11
  - number: 4.12.1
    text: Op de aanvraag om een subsidie wordt een beschikking omtrent subsidieverlening gegeven.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.12
  - number: 4.12.2
    text: |-
      In de subsidievoorwaarden bij een beschikking als bedoeld in het eerste lid wordt in elk geval opgenomen dat in een
      overeenkomst die de subsidie-ontvanger met een re-integratiebedrijf sluit wordt geregeld:
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.12
  - number: 4.12.2.a
    text: |-
      de duur van de overeenkomst alsmede de hoogte van de kosten die door het re-integratiebedrijf in rekening zullen
      worden gebracht;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.12
  - number: 4.12.2.b
    text: dat de overeenkomst door beide partijen wegens gewichtige redenen tussentijds door opzegging kan worden beëindigd;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.12
  - number: 4.12.2.c
    text: 'dat het re-integratiebedrijf verplicht is:'
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.12
  - number: 4.12.2.c.1º
    text: |-
      toegang tot en inzage in alle gegevens te verlenen die een accountant naar zijn oordeel nodig heeft voor het
      instellen van een nader onderzoek als bedoeld in [artikel 42, vierde lid, van de Wet SUWI][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel42
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.12
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '42'
  - number: 4.12.2.c.2º
    text: |-
      de persoonlijke levenssfeer van de personen van wie de inschakeling in de arbeid wordt bevorderd, te beschermen
      overeenkomstig een reglement dat aan die personen en de werkgever wordt overgelegd;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.12
  - number: 4.12.2.c.3º
    text: |-
      in geval van een geschil tussen de te re-integreren persoon en het re-integratiebedrijf een klachten- en
      geschillenregeling toe te passen die door het re-integratiebedrijf aan de te re-integreren persoon en de werkgever
      is overgelegd;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.12
  - number: 4.12.2.c.4º
    text: |-
      op verzoek aan de werkgever een schriftelijk oordeel van een accountant of een gelijkwaardige deskundige over de
      verwerking van informatie en de genomen maatregelen ter beveiliging van informatie door het re-integratiebedrijf
      over te leggen;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.12
  - number: 4.12.2.c.5º
    text: |-
      de gegevens die het re-integratiebedrijf in verband met deze werkzaamheden verkrijgt uitsluitend te verwerken
      voorzover dat noodzakelijk is voor het verrichten van die activiteiten of werkzaamheden dan wel voor de naleving
      van verplichtingen als bedoeld in de subonderdelen 1° tot en met 4°;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.12
  - number: 4.12.2.c.6º
    text: |-
      indien dit re-integratiebedrijf deze werkzaamheden laat verrichten door een ander re-integratiebedrijf, in een
      schriftelijke overeenkomst met dat andere re-integratiebedrijf te regelen dat voor dat bedrijf de verplichtingen,
      bedoeld in de subonderdelen 1° tot en met 6°, gelden;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.12
  - number: 4.12.2.d
    text: |-
      dat het re-integratiebedrijf aan het UWV op verzoek of na toestemming van de subsidie-ontvanger uit eigen beweging
      gegevens verstrekt over de besteding van de subsidie.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.12
  - number: 4.12.3
    text: Bij ministeriële regeling kunnen regels worden gesteld omtrent het tweede lid.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.12
  - number: 4.13.1
    text: De subsidie bedraagt ten hoogste een bij ministeriële regeling vastgesteld bedrag.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.13
  - number: 4.13.2
    text: |-
      De subsidie wordt verleend voor werkzaamheden als bedoeld in [artikel 4.8][ref1] gedurende een tijdvak van ten
      hoogste een jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.13
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.13.3
    text: |-
      Indien de aanvrager van een subsidie of de subsidie-ontvanger aantoont dat de noodzakelijke kosten van de
      werkzaamheden die zijn gericht op behoud, herstel of bevordering van mogelijkheden tot het verrichten van arbeid
      hoger zijn dan het in het eerste lid bedoelde bedrag of die werkzaamheden langer zullen duren dan een tijdvak van
      een jaar, kan subsidie worden verleend voor een hoger bedrag of een langere periode.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.13
  - number: 4.13.4
    text: |-
      De in het derde lid bedoelde bevoegdheid bestaat uitsluitend indien het in het eerste lid bedoelde bedrag of de in
      het tweede lid bedoelde werkzaamheden gedurende een tijdvak van een jaar redelijkerwijs niet zullen kunnen leiden
      tot behoud, herstel of bevordering van mogelijkheden tot het verrichten van arbeid.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.13
  - number: 4.14.1
    text: |-
      Het UWV kan aan de subsidie-ontvanger voorschotten op de vast te stellen subsidie verlenen aan de hand van aan het
      UWV overgelegde declaraties voor de werkzaamheden, die voortvloeien uit het trajectplan.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.14
  - number: 4.14.2
    text: |-
      Indien het UWV besluit tot het verlenen van voorschotten, betaalt het UWV de voorschotten binnen één week na het
      nemen van dat besluit aan de subsidie-ontvanger of aan het re-integratiebedrijf, waarmee de subsidie-ontvanger een
      overeenkomst heeft gesloten.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.14
  - number: 4.15.1
    text: |-
      De subsidie-ontvanger dient iedere drie maanden bij het UWV een rapportage in waarin een beschrijving is opgenomen
      van de ten behoeve van de subsidie-ontvanger verrichte werkzaamheden, bedoeld in [artikel 4.8][ref1]. In de
      rapportage worden in ieder geval de resultaten van de uitvoering van het trajectplan en de prognose voor de
      resterende periode van het traject beschreven en wordt een overzicht gegeven van de tot op dat moment gemaakte
      kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.15
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.15.2
    text: |-
      De subsidie-ontvanger verstrekt onverwijld en uit eigen beweging alle gegevens en inlichtingen omtrent voortijdige
      beëindiging van gesubsidieerde trajecten aan het UWV.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.15
  - number: 4.15.3
    text: |-
      De subsidie-ontvanger verstrekt op verzoek aan het UWV alle gegevens en inlichtingen die van belang zijn voor de
      vaststelling van de rechtmatigheid en doelmatigheid van de uitvoering van [artikel 2.7a van de Wet IWIA][ref1],
      alsmede binnen vier weken alle hem betreffende informatie die noodzakelijk is voor de evaluatie van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0019058#Artikel2
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.15
    references:
      - id: ref1
        bwb_id: BWBR0019058
        artikel: '2'
  - number: '4.16'
    text: |-
      De subsidie-ontvanger dient binnen zes weken na afloop van het tijdvak waarvoor de subsidie is verleend een
      aanvraag tot vaststelling van de subsidie in.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.16
  - number: 4.17.1
    text: |-
      In geval van een toekennende beschikking op een aanvraag om een persoonsgebonden re-integratieovereenkomst, sluit
      het UWV binnen zes weken na het nemen van die beschikking een overeenkomst met een re-integratiebedrijf dat de in
      [artikel 4.8][ref1] bedoelde werkzaamheden uitvoert.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.17
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.17.2
    text: |-
      Het UWV sluit een overeenkomst met een re-integratiebedrijf als bedoeld in het eerste lid overeenkomstig de
      voorkeur voor een re-integratiebedrijf van de aanvrager of begunstigde.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.17
  - number: '4.18'
    text: |-
      Het sluiten van een persoonsgebonden re-integratieovereenkomst kan in ieder geval worden geweigerd in de gevallen,
      bedoeld in [artikel 4:35 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.18
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 4.19.1
    text: |-
      Het door het UWV aan het re-integratiebedrijf verschuldigde bedrag voor de uitvoering van de persoonsgebonden re-
      integratieovereenkomst bedraagt ten hoogste een bij ministeriële regeling vastgesteld bedrag.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.19
  - number: 4.19.2
    text: De persoonsgebonden re-integratieovereenkomst wordt gesloten voor een tijdvak van ten hoogste een jaar.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.19
  - number: 4.19.3
    text: |-
      Indien de aanvrager van een persoonsgebonden re-integratieovereenkomst of begunstigde aantoont dat de noodzakelijke
      kosten van de in [artikel 4.8][ref1] bedoelde werkzaamheden hoger zijn dan het in het eerste lid bedoelde bedrag of
      die werkzaamheden langer zullen duren dan een tijdvak van een jaar, kan een overeenkomst worden gesloten voor een
      hoger bedrag of een langere periode.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.19
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.19.4
    text: |-
      De in het derde lid bedoelde bevoegdheid bestaat uitsluitend indien het in het eerste lid bedoelde bedrag of de in
      het derde lid bedoelde werkzaamheden gedurende een tijdvak van een jaar redelijkerwijs niet zullen kunnen leiden
      tot behoud, herstel of bevordering van mogelijkheden tot het verrichten van arbeid.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.19
  - number: 4.20.1
    text: 'In de persoonsgebonden re-integratieovereenkomst wordt in elk geval geregeld:'
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.20
  - number: 4.20.1.a
    text: |-
      de duur van de overeenkomst alsmede de hoogte van de kosten die door het re-integratiebedrijf in rekening zullen
      worden gebracht;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.20
  - number: 4.20.1.b
    text: |-
      dat het re-integratiebedrijf iedere drie maanden bij het UWV een rapportage indient waarin een beschrijving
      is opgenomen van de werkzaamheden die zijn verricht ten behoeve van het behoud, herstel of bevordering van
      mogelijkheden tot het verrichten van arbeid van de arbeidsgehandicapte werknemer. In de rapportage worden tevens de
      resultaten van de uitvoering van het trajectplan, bedoeld in [artikel 4.10, onderdeel b][ref1], en de prognose voor
      de resterende periode van het traject beschreven en wordt een overzicht gegeven van de tot op dat moment gemaakte
      kosten;


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.20
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.20.1.c
    text: dat de overeenkomst door beide partijen wegens gewichtige redenen tussentijds door opzegging kan worden beëindigd;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.20
  - number: 4.20.1.d
    text: |-
      dat de prijs voor de overeenkomst uitsluitend wordt betaald voor die werkzaamheden, die zijn beschreven in
      het in [artikel 4.10, onderdeel b][ref1], bedoelde trajectplan, tenzij het UWV voor het verrichten van andere
      werkzaamheden schriftelijk goedkeuring heeft verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.20
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.20.1.e
    text: |-
      dat het re-integratiebedrijf voldoet aan verplichtingen als bedoeld in
      [artikel 4.12, eerste lid, onderdeel c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.20
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.20.1.f
    text: |-
      dat het re-integratiebedrijf aan het UWV op verzoek of na toestemming van de subsidie-ontvanger uit eigen beweging
      gegevens verstrekt over de uitvoering van de overeenkomst.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.20
  - number: 4.20.2
    text: Bij ministeriële regeling kunnen regels worden gesteld omtrent het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel4.20
  - number: 5.1.1
    text: |-
      In de polisadministratie worden van de werknemer of de persoon die vrijwillig verzekerd is voor de [ZW][ref1], de
      [Wet WIA][ref2], de [WW][ref3] en de [WAO][ref4] de volgende gegevens verwerkt:


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0019057
      [ref3]: https://wetten.overheid.nl/BWBR0004045
      [ref4]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0019057
      - id: ref3
        bwb_id: BWBR0004045
      - id: ref4
        bwb_id: BWBR0002524
  - number: 5.1.1.a
    text: '*basisregistratie gegevens:*'
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.1
  - number: 5.1.1.a.1°
    text: |-
      *adresgegevens:* straatnaam, huisnummer, huisnummertoevoeging, postcode, woonplaatsnaam, gemeentenaam,
      woonobjectverwijzing en locatieomschrijving; en
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.1
  - number: 5.1.1.a.2°
    text: |-
      *buitenlandse adresgegevens:* straatnaam, huisnummer, huisnummertoevoeging, postcode, woonplaats,
      locatieomschrijving, regionaam en landcode ISO;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.1
  - number: 5.1.1.b
    text: '*postbusadresgegevens:* postbusnummer, postcode, woonplaats, gemeentenaam en locatieomschrijving;'
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.1
  - number: 5.1.1.c
    text: '*sociaal verzekeringsnummer buitenland:* verzekeringsnummer en landcode ISO;'
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.1
  - number: 5.1.1.d
    text: |-
      *persoonsgegevens:* namen, burgerservicenummer, het administratienummer, bedoeld in
      [artikel 4.9 van de Wet basisregistratie personen][ref1] (A-nummer), geboortedatum, overlijdensdatum, geslacht,
      burgerlijke staat, leefvorm, nationaliteit, verblijfstitel, datum vertrek uit Nederland, indicatie curatelestelling
      en indicatie voor informatiebeveiliging;


      [ref1]: https://wetten.overheid.nl/BWBR0033715#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0033715
        artikel: '4'
  - number: 5.1.1.e
    text: '*ontheffing wegens gemoedsbezwaren;*'
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.1
  - number: 5.1.1.f
    text: |-
      *verzekeringsplicht werknemersverzekeringen:* gegevens inzake de vaststelling verzekeringsplicht, indicaties
      verzekerd en premies voor de werknemersverzekeringen;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.1
  - number: 5.1.1.g
    text: |-
      *gegevens over de werkgever in de zin van de Wfsv en de inhoudingsplichtige in de zin van de Wet op de
      loonbelasting 1964:* naam en loonheffingennummer;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.1
  - number: 5.1.1.h
    text: |-
      *gegevens over de inkomstenverhouding:* personeelsnummer, soort inkomstenverhouding, collectieve
      arbeidsovereenkomst, sector, datum begin en einde van inkomstenverhouding, reden einde arbeidsverhouding en code
      invloed verzekeringsplicht;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.1
  - number: 5.1.1.i
    text: |-
      *loongerelateerde gegevens:* lonen, aantal verloonde uren, ingehouden loonbelasting en premie volksverzekeringen,
      inkomensafhankelijke bijdrage als bedoeld in [artikel 41 van de ZVW][ref1], verzekeringssituatie ZVW,
      andere gegevens van belang voor de heffing van inkomstenbelasting en heffing van loonbelasting en premies
      werknemersverzekeringen en het aanvragen tegemoetkomingen loondomein.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel41
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '41'
  - number: 5.1.2
    text: |-
      In aanvulling op het eerste lid kunnen tevens bij regeling van Onze Minister, in overeenstemming met Onze Minister
      van Financiën, aan te wijzen gegevens worden verwerkt die afkomstig zijn van een werkgever in de zin van de
      [Wfsv][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017745
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0017745
  - number: 5.2.1
    text: |-
      In [bijlage I][ref1] bij dit besluit wordt voor de polisadministratie een overzicht gegeven van de opgenomen
      gegevens, voor welk doel die gegevens worden verwerkt en hoe die gegevens worden verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0013267
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0013267
  - number: 5.2.2
    text: |-
      [Bijlage I][ref1] kan bij regeling van Onze Minister, in overeenstemming met Onze Minister van Financiën, en na
      overleg met het Centraal bureau voor de statistiek, worden gewijzigd, voorzover deze wijziging geen wijziging tot
      gevolg heeft van de lijst van gegevens in [artikel 5.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013267
      [ref2]: https://wetten.overheid.nl/BWBR0013267#Artikel5
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0013267
      - id: ref2
        bwb_id: BWBR0013267
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.2a.1
    text: |-
      In [bijlage II][ref1] bij dit besluit wordt vermeld welke soort gegevens op grond van de
      [artikelen 33a, tweede lid][ref2], en [35, vijfde lid, van de Wet SUWI][ref3], [14, eerste lid, van de IOAW][ref4],
      [14, eerste lid, van de IOAZ][ref5] en [53a, eerste lid, van de Participatiewet][ref6] niet van de belanghebbende
      worden verkregen en uit welke bron deze gegevens afkomstig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0013267
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel33a
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0004044#Artikel14
      [ref5]: https://wetten.overheid.nl/BWBR0004163#Artikel14
      [ref6]: https://wetten.overheid.nl/BWBR0015703#Artikel53a
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.2a
    references:
      - id: ref1
        bwb_id: BWBR0013267
      - id: ref2
        bwb_id: BWBR0013060
        artikel: 33a
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '35'
      - id: ref4
        bwb_id: BWBR0004044
        artikel: '14'
      - id: ref5
        bwb_id: BWBR0004163
        artikel: '14'
      - id: ref6
        bwb_id: BWBR0015703
        artikel: 53a
  - number: 5.2a.2
    text: |-
      Het UWV informeert de belanghebbende over de soort gegevens, bedoeld in het eerste lid, op het moment dat hij een
      aanvraag als bedoeld in [artikel 30c, eerste lid, van de Wet SUWI][ref1] dan wel een aanvraag voor een uitkering
      als bedoeld in [artikel 30, eerste lid, van de Wet SUWI][ref2] indient.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30c
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.2a
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 30c
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '30'
  - number: 5.2a.3
    text: |-
      Bij ministeriële regeling kan worden bepaald, dat tot een in die regeling genoemd tijdstip bepaalde onderdelen van
      [bijlage II][ref1] voor bepaalde bestuursorganen met betrekking tot bepaalde taken niet van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0013267
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.2a
    references:
      - id: ref1
        bwb_id: BWBR0013267
  - number: 5.2a.4
    text: |-
      Bij regeling van Onze Minister, voor zover het gegevens betreft die afkomstig zijn van de Belastingdienst in
      overeenstemming met Onze Minister van Financiën, wordt nader bepaald voor welke gegevens het eerste lid van
      toepassing is.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.2a
  - number: 5.2b.1
    text: |-
      Indien een betrokkene op wie de gegevens betrekking hebben bij het indienen van de aanvraag, bedoeld
      in [artikel 30c, eerste lid, van de Wet SUWI][ref1] dan wel een aanvraag voor een uitkering als
      bedoeld in [artikel 30, eerste lid, van de Wet SUWI][ref2], op grond van de informatie, bedoeld in
      [artikel 5.2a, tweede lid][ref3], vaststelt, dat de gegevens niet juist of niet volledig zijn, kan hij het UWV dan
      wel het desbetreffende college van burgemeester en wethouders verzoeken bij de uitvoering van gegevensverwerking
      als bedoeld in [artikel 62 van de Wet SUWI][ref4] zorg te dragen voor rectificatie, vervollediging of wissing van
      deze gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30c
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0013267#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0013060#Artikel62
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.2b
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 30c
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '30'
      - id: ref3
        bwb_id: BWBR0013267
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.1a
      - id: ref4
        bwb_id: BWBR0013060
        artikel: '62'
  - number: 5.2b.2
    text: |-
      Indien het UWV en de colleges van burgemeester en wethouders voor de verwerking van die gegevens geen
      verwerkingsverantwoordelijke zijn, wordt het verzoek onverwijld gezonden naar de verwerkingsverantwoordelijke om
      dit aan te merken als een verzoek als bedoeld in artikel 16 of 17 van de Algemene verordening gegevensbescherming
      of een daarmee op grond van de toepasselijke wetgeving gelijk te stellen verzoek.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.2b
  - number: 5.2b.3
    text: Bij het desbetreffende gegeven wordt aangetekend, dat het gegeven in onderzoek is.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.2b
  - number: 5.2c
    text: |-
      Voor Onze Minister van Economische Zaken en Klimaat gelden de verplichtingen bedoeld in
      [artikel 54, derde, vierde en vijfde lid, van de Wet SUWI][ref1] ten aanzien van gegevens die noodzakelijk zijn
      voor de vaststelling van subsidies die zijn verleend in verband met de tegemoetkoming van werkgevers in de betaling
      van de loonkosten vanwege een vermindering in bedrijvigheid door buitengewone omstandigheden die in redelijkheid
      niet tot het normale ondernemersrisico kunnen worden gerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel54
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.2c
    references:
