        bwb_id: BWBR0015703
        artikel: '7'
  - number: 2.3.2.g
    text: |-
      de wijze waarop de werkgeversdienstverlening wordt ingericht; in relatie tot de bestaande structuur op grond van de
      [Wet SUWI][ref1], waaronder tenminste wordt verstaan de werkgeversdienstverlening in het werkgeversservicepunt;


      [ref1]: https://wetten.overheid.nl/BWBR0013060
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel2.3
