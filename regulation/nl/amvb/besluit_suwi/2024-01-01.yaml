  - number: 5.5.2
    text: |-
      Het verstrekken van gegevens en inlichtingen als bedoeld in
      [artikel 73, zevende en achtste lid, van de Wet SUWI][ref1] aan het UWV, de SVB en de colleges van burgemeester en
      wethouders, vindt plaats met gebruik van de elektronische voorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel73
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '73'
  - number: 5.5a
    text: |-
      De Dienst Wegverkeer, bedoeld in [artikel 4a van de Wegenverkeerswet 1994][ref1], is verplicht op verzoek aan
      colleges van burgemeester en wethouders opgaven en inlichtingen te verstrekken die noodzakelijk zijn voor de
      uitvoering van de [Participatiewet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0015703
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.5a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 4a
      - id: ref2
        bwb_id: BWBR0015703
  - number: 5.5b.1
    text: |-
      Ter uitvoering van [artikel 72a van de Wet SUWI][ref1] verstrekken het UWV, de SVB en de colleges van burgemeesters
      en wethouders aan Onze Minister ten behoeve van de onder hem ressorterende opsporingsdienst kosteloos en
      uitsluitend het gegeven of een natuurlijk persoon een uitkering ontvangt, welke uitkering het betreft en welke
      uitvoeringsinstantie die uitkering verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel72a
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.5b
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 72a
  - number: 5.5b.2
    text: |-
      Voor het verstrekken van de in het eerste lid bepaalde gegevens en inlichtingen maken het UWV, de SVB
      en de colleges van burgemeesters en wethouders gebruik van elektronische voorzieningen als bedoeld in
      [paragraaf 5.6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.5b
    references:
      - id: ref1
        bwb_id: BWBR0013267
        hoofdstuk: '5'
        paragraaf: '5.6'
  - number: '5.6'
    text: |-
      Het UWV en de SVB zijn bevoegd uit de onder hun verantwoordelijkheid gevoerde administraties gegevens te
      verstrekken aan buitenlandse bestuursorganen, voorzover die gegevens noodzakelijk zijn voor de vervulling van
      een taak van zwaarwegend algemeen belang waartoe in ieder geval gerekend wordt het verstrekken en vaststellen van
      uitkeringen en het heffen en innen van premies en bijdragen daarvoor.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.6
  - number: '5.7'
    text: |-
      Het UWV en de SVB zijn bevoegd uit eigen beweging en verplicht op verzoek uit de onder hun verantwoordelijkheid
      gevoerde administraties kosteloos te verstrekken:
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.7
  - number: 5.7.a
    text: |-
      aan de Belastingdienst de gegevens die noodzakelijk zijn voor de heffing of invordering van enige rijksbelasting,
      van premies sociale verzekeringen als bedoeld in [artikel 2, onderdelen a en c, van de Wfsv][ref1] en van de
      inkomensafhankelijke bijdrage, bedoeld in de [ZVW][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0018450
  - number: 5.7.b
    text: |-
      aan de zorgverzekeraars, bedoeld in de [Zorgverzekeringswet][ref1], en het Zorginstituut, de zorgautoriteit,
      Wlz-uitvoerders en het CAK, bedoeld in de [Wet langdurige zorg][ref2] de gegevens voor zover die
      noodzakelijk zijn voor de uitvoering van de [Zorgverzekeringswet][ref3], de [Wet langdurige zorg][ref4] en de
      [Wet maatschappelijke ondersteuning 2015][ref5];


      [ref1]: https://wetten.overheid.nl/BWBR0018450
      [ref2]: https://wetten.overheid.nl/BWBR0035917
      [ref3]: https://wetten.overheid.nl/BWBR0018450
      [ref4]: https://wetten.overheid.nl/BWBR0035917
      [ref5]: https://wetten.overheid.nl/BWBR0035362
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.7
    references:
