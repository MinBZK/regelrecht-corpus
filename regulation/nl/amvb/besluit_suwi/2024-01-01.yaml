    text: |-
      aan een college van burgemeester en wethouders, adresgegevens, waaronder adresgegevens die worden verwerkt voor
      de doelen, genoemd in [artikel 33, tweede lid, onderdelen a, b, en c van de Wet SUWI][ref1], die noodzakelijk zijn
      voor het bijhouden van persoonsgegevens in de basisregistratie personen.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel33
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.9
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '33'
  - number: 5.9.2
    text: |-
      Het UWV is bij de verwerking van gegevens voor de uitvoering van de taak, die krachtens de
      [Wet arbeid vreemdelingen][ref1] aan het UWV is opgedragen, bevoegd uit eigen beweging en verplicht op verzoek aan
      colleges van burgemeester en wethouders gegevens te verstrekken die noodzakelijk zijn in verband met de taken die
      voortvloeien uit de [Huisvestingswet 2014][ref2] en de [Woningwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007149
      [ref2]: https://wetten.overheid.nl/BWBR0035303
      [ref3]: https://wetten.overheid.nl/BWBR0005181
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.9
    references:
      - id: ref1
        bwb_id: BWBR0007149
      - id: ref2
        bwb_id: BWBR0035303
      - id: ref3
        bwb_id: BWBR0005181
  - number: 5.9.3
    text: |-
      Het UWV is verplicht op verzoek uit de onder zijn verantwoordelijkheid gevoerde administratie kosteloos
      te verstrekken aan Onze Minister de gegevens van personen die werknemer zijn bij een houder van een
      kindercentrum of gastouderbureau en die noodzakelijk zijn voor de verwerking van gegevens, bedoeld in
      [artikel 1.48d van de Wet kinderopvang][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel1
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.9
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '1'
  - number: 5.9.4
    text: |-
      In verband met het systematisch verstrekken van gegevens als bedoeld in [artikel 5.11][ref1] kunnen bij
      ministeriële regeling nadere regels worden gesteld omtrent de wijze waarop en de vorm waarin de adresgegevens,
      bedoeld in het eerste lid, onderdeel i, verstrekt worden.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel5
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.9
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: '5.10'
    text: |-
      Het college van burgemeester en wethouders is bevoegd gegevens die worden verwerkt voor
      de uitvoering van taken die krachtens de [Participatiewet][ref1] aan het college van
      burgemeester en wethouders zijn opgedragen, verder te verwerken ten behoeve van de registratie
      van gegevens, bedoeld in [artikel 8.22 van de Wet voortgezet onderwijs 2020][ref2],
      [artikel 8.3.2 van de Wet educatie en beroepsonderwijs][ref3] en
      [artikel 162b van de Wet op de expertisecentra][ref4], voor zover dat noodzakelijk is voor de doorverwijzing van
      voortijdige schoolverlaters naar onderwijs of arbeidsmarkt.


      [ref1]: https://wetten.overheid.nl/BWBR0015703
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel162b
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.10
    references:
      - id: ref1
        bwb_id: BWBR0015703
      - id: ref2
        bwb_id: BWBR0044212
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0003549
        artikel: 162b
  - number: '5.11'
    text: |-
      Het UWV en de SVB verstrekken in de in de [artikelen 5.7][ref1] en [5.9][ref2] vermelde gevallen
      slechts systematisch gegevens, niet zijnde bijzondere categorieën van persoonsgegevens als bedoeld in de
      [Uitvoeringswet Algemene verordening gegevensbescherming][ref3], tenzij het betreft gegevens over gezondheid die
      noodzakelijk zijn voor re-integratie of begeleiding van werknemers of uitkeringsgerechtigden in verband met ziekte
      of arbeidsongeschiktheid als bedoeld in [artikel 30, eerste lid, van die wet][ref4], indien met de desbetreffende
      bestuursorganen overeenstemming is bereikt over in ieder geval de systematisch te verstrekken gegevens, alsmede de
      omstandigheid waaronder, de regelmaat waarmee en de wijze waarop die verstrekking plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0013267#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0040940
      [ref4]: https://wetten.overheid.nl/BWBR0040940#Artikel30
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.11
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref2
        bwb_id: BWBR0013267
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
      - id: ref3
        bwb_id: BWBR0040940
      - id: ref4
        bwb_id: BWBR0040940
        artikel: '30'
  - number: 5.12.1
    text: |-
      Het UWV is bevoegd op verzoek uit de onder zijn verantwoordelijkheid gevoerde administraties aan
      instanties als bedoeld in [artikel 73, eerste en tweede lid][ref1], en aan derden als bedoeld in
      [artikel 73a, tweede lid, van de Wet SUWI][ref2], de volgende mede van de Belastingdienst afkomstige gegevens te
      verstrekken:


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel73a
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.12
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '73'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: 73a
  - number: 5.12.1.a
    text: |-
      *gegevens over de werknemer*: adresgegevens, namen, burgerservicenummer, geboortedatum, geslacht en
      overlijdensdatum;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.12
  - number: 5.12.1.b
    text: '*verzekeringsplicht werknemersverzekeringen*: indicaties verzekerd werknemersverzekeringen;'
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.12
  - number: 5.12.1.c
    text: |-
      *gegevens over de inkomstenverhouding*: soort inkomstenverhouding, aard arbeidsverhouding, datum begin en einde
      van inkomstenverhouding, sector, fase indeling Flexibiliteit en Zekerheid, collectieve arbeidsovereenkomst, reden
      einde arbeidsverhouding, indicatie arbeidsovereenkomst voor onbepaalde tijd, indicatie schriftelijke overeenkomst,
      indicatie oproepovereenkomst, indicatie jaarurennorm, indicatie publiekrechtelijke aanstelling voor onbepaalde
      tijd;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.12
  - number: 5.12.1.d
    text: |-
      *loongerelateerde gegevens*: aantal verloonde uren, loon SV, (opgebouwd recht) vakantiebijslag, (opbouw of
      opname) arbeidsvoorwaardenbedrag, verstrekte aanvulling op uitkering werknemersverzekering, indicatie deelname
      tijdspaarfonds;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.12
  - number: 5.12.1.e
    text: |-
      *gegevens over de werkgever*: naam, loonheffingennummer, het RSIN of een aan een onderneming of rechtspersoon
      toegekend uniek nummer waarmee een onderneming of rechtspersoon in het handelsregister is opgenomen,
      rechtsvorm, sector, voortzettingsrelatie, datum oprichting, datum ontbinding, statutaire zetel, adresgegevens,
      eigenrisicodragerschap, premiepercentage individueel, faillissement of surseance;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.12
  - number: 5.12.1.f
    text: |-
      gegevens over uitkeringen, waaronder datum eerste dag van arbeidsongeschiktheid, code SZ product, ingangsdatum
      uitkering, datum einde uitkering, code sector OSV, datum-tijd registratie, registratienummer, bedrag
      restverdiencapaciteit, code soort recht, code soort uitkering, percentage maatregel, indicatie indexeringsmutatie,
      code dagloon uitkeringsrecht, bedrag grondslag, code arbeidsongeschiktheidsklasse, bedrag dagloon gemaximeerd
      en ongemaximeerd, bedrag eigen verdiensten, bedrag verdiensten WW, code kenmerk percentage uitkering grondslag
      betaling, code reden wijziging arbeidsongeschiktheidsuitkering, percentage uitkering grondslag betaling, percentage
      uitkering gerelateerd aan mate arbeidsongeschiktheid, datum omslag loongerelateerde uitkering.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.12
  - number: 5.12.2
    text: |-
      De in [artikel 73a, tweede lid, van de Wet SUWI][ref1] bedoelde derden zijn: deskundigen en instellingen die in
      het kader van de uitoefening van beroep of bedrijf taken uitvoeren of diensten verrichten ter ondersteuning van
      administraties of het verrichten van keuringen.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel73a
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.12
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 73a
  - number: 5.12.3
    text: |-
      Het UWV is bevoegd op verzoek uit de onder zijn verantwoordelijkheid gevoerde administraties aan instanties
      als bedoeld in [artikel 73, eerste lid, onderdelen a en b, van de Wet SUWI][ref1], de volgende gegevens te
      verstrekken: loon in geld, waarde niet in geld uitgekeerd loon, loon uit overwerk, waarde privégebruik auto en
      werknemersbijdrage privégebruik auto.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel73
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.12
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '73'
  - number: 5.12.4
    text: |-
      Het UWV is bevoegd aan instanties als bedoeld in [artikel 73, eerste lid, onderdelen a en c, van de Wet SUWI][ref1]
      gegevens te verstrekken over voorschotten op uitkeringen op grond van de Wet WIA, met vermelding van aanvangsdatum
      en einddatum.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel73
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.12
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '73'
  - number: 5.12.5
    text: Bij het verstrekken van gegevens op grond van dit artikel worden kosten in rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.12
  - number: 5.13.1
    text: |-
      Het UWV is bevoegd uit de onder zijn verantwoordelijkheid gevoerde administraties op verzoek van een werkgever
      als bedoeld in [artikel 73, derde lid, onderdeel a, van de Wet SUWI][ref1], aan die werkgever in verband met het
      aangaan of beëindigen van overeenkomsten tot verzekering van de risico’s van het eigenrisicodrager zijn of van
      betaling van premie als bedoeld in [hoofdstuk 3, afdeling 5, van de Wfsv][ref2] kosteloos gegevens te verstrekken,
      mede afkomstig van de Belastingdienst, over WGA-uitkeringen verstrekt aan werknemers, met vermelding van
      aanvangsdatum en vermoedelijke einddatum, BSN-nummer en naam van de werknemer, op grond waarvan die werkgever de
      lasten van uitkeringen ingevolge de Werkhervattingsregeling op grond van de [Wet WIA][ref3] kan bepalen die aan de
      werkgever worden doorbelast op grond van de [Wfsv][ref4] dan wel de Wet WIA.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Afdeling5
      [ref3]: https://wetten.overheid.nl/BWBR0019057
      [ref4]: https://wetten.overheid.nl/BWBR0017745
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.13
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '73'
      - id: ref2
        bwb_id: BWBR0017745
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0019057
      - id: ref4
        bwb_id: BWBR0017745
  - number: 5.13.2
    text: |-
      Het UWV is bevoegd op verzoek uit de onder zijn verantwoordelijkheid gevoerde administraties aan een financiële
      onderneming als bedoeld in [artikel 73, derde lid, onderdeel b, van de Wet SUWI][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel73
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.13
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '73'
  - number: 5.13.2.a
    text: |-
      Kosteloos te verstrekken gegevens als bedoeld in
      [artikel 5.12, eerste lid, onderdelen a, b, c, d, en f, en derde lid][ref1], in verband met de uitvoering
      van de overeenkomsten met werkgevers tot verzekering van het risico van het betalen van premie voor de
      arbeidsongeschiktheidsverzekering op grond van de [Wfsv][ref2] en van de betalingen als gevolg van het
      eigenrisicodragen, bedoeld in [artikel 40, eerste lid, onderdeel b, van de Wfsv][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0017745
      [ref3]: https://wetten.overheid.nl/BWBR0017745#Artikel40
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.13
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.4'
      - id: ref2
        bwb_id: BWBR0017745
      - id: ref3
        bwb_id: BWBR0017745
        artikel: '40'
  - number: 5.13.2.b
    text: |-
      gegevens te verstrekken als bedoeld in artikel [5.12, eerste lid, onderdelen a, b, c en d][ref1] , afkomstig
      van de rijksbelastingdienst, in verband met de uitvoering van de overeenkomsten met werkgevers tot verzekering
      van het risico van het betalen van loon in geval van ziekte en van de betaling van ziekengeld, bedoeld in
      [artikel 40, eerste lid, onderdeel a, van de Wfsv][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel40
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.13
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.4'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '40'
  - number: 5.14.1
    text: |-
      UWV verstrekt aan financiële ondernemingen, bedoeld in [artikel 73, derde lid, onderdeel b, van de Wet SUWI][ref1],
      met inachtneming van het vijfde lid, kosteloos de volgende gegevens die het UWV verwerkt in de onder zijn
      verantwoordelijkheid gevoerde administraties, die mede afkomstig zijn van de Belastingdienst, die noodzakelijk zijn
      voor het vervaardigen van de statistieken ten behoeve van de uitvoering van overeenkomsten als bedoeld in artikel
      73, derde lid, onderdeel b, van de Wet SUWI:


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel73
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.14
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '73'
  - number: 5.14.1.a
    text: |-
      per persoon, die in een kalenderjaar een nieuwe uitkering [Wet WIA][ref1] heeft ontvangen, een lopende uitkering
      ontvangt dan wel van wie de WIA-uitkering is beëindigd of afgewezen: geslacht, leeftijd, sector als bedoeld in
      [artikel 95 van de Wfsv][ref2], bedrag grondslag of dagloon, ingangsdatum (vervolg)uitkering, uitkeringspercentage
      Wet WIA, code verzekerd Wet WIA (soort dienstverband), benutting van de verdiencapaciteit, soort recht Wet WIA
      (WIA-klasse, en WGA of IVA), datum eerste ziektedag, bedrijfsgrootte werkgever, werkgever eigenrisicodrager of
      publiek verzekerd, datum einde uitkering en reden beëindiging, jaar-maand afhandeling claimbeoordeling;


      [ref1]: https://wetten.overheid.nl/BWBR0019057
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel95
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.14
    references:
      - id: ref1
        bwb_id: BWBR0019057
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '95'
  - number: 5.14.1.b
    text: |-
      per werknemer naar kalenderjaar: loonaangiftetijdvak, geslacht, leeftijd, sector als bedoeld in
      [artikel 95 van de Wfsv][ref1], code bepaald/onbepaald, code oproepkracht, code uitzendkracht, code payrolling, SV-
      jaarloon, werkgever eigenrisicodrager of publiek verzekerd.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel95
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.14
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '95'
  - number: 5.14.2
    text: |-
      UWV is bevoegd aan financiële ondernemingen, bedoeld in [artikel 73, derde lid, onderdeel b, van de Wet SUWI][ref1],
      kosteloos per persoon, die in een kalenderjaar een nieuwe uitkering [Wet WIA][ref2] dan wel voorschot op die
      uitkering heeft ontvangen, een lopende uitkering ontvangt dan wel van wie de WIA-uitkering is beëindigd of
      afgewezen de volgende gegevens te verstrekken die het UWV verwerkt in de onder zijn verantwoordelijkheid gevoerde
      administraties, die mede afkomstig zijn van de Belastingdienst, die noodzakelijk zijn voor het vervaardigen van de
      statistieken ten behoeve van de uitvoering van overeenkomsten als bedoeld in artikel 73, derde lid, onderdeel b,
      van de Wet SUWI:


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.14
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '73'
      - id: ref2
        bwb_id: BWBR0019057
  - number: 5.14.2.a
    text: |-
      vermelding dat het verstrekte bedrag een voorschot op een uitkering [Wet WIA][ref1] betreft, met vermelding van
      aanvangsdatum en einddatum;


      [ref1]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.14
    references:
      - id: ref1
        bwb_id: BWBR0019057
  - number: 5.14.2.b
    text: |-
      vermelding dat de verstrekte uitkering plaatsvindt onder toepassing van de vereenvoudigde beoordeling van de WIA-
      aanvraag voor 60-plussers.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.14
  - number: 5.14.3
    text: |-
      De gegevens, bedoeld in het eerste en tweede lid, mogen uitsluitend gebruikt worden voor het vervaardigen van
      statistieken met betrekking tot het verzekeringsproduct inzake het arbeidsongeschiktheids- of ziekterisico van
      werknemers en mogen niet verrijkt worden met gegevens over afzonderlijke personen en rechtspersonen uit andere
      bronnen.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.14
  - number: 5.14.4
    text: De gegevens, bedoeld in het eerste en tweede lid, worden ontdaan van unieke persoonsidentificerende gegevens.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.14
  - number: 5.14.5
    text: |-
      Het UWV verstrekt de gegevens, bedoeld in het eerste en tweede lid, aan de door het Verbond van Verzekeraars
      namens de financiële ondernemingen aangewezen verwerker belast met de verwerking van gegevens voor statistische
      doeleinden.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.14
  - number: 5.14.6
    text: |-
      De door de verwerker vervaardigde statistieken, bedoeld in het eerste en tweede lid, worden om niet ter beschikking
      gesteld aan Onze Minister en aan De Nederlandsche Bank N.V.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.14
  - number: 5.15.1
    text: |-
      De SVB en het UWV zijn bevoegd op verzoek uit de onder hun verantwoordelijkheid gevoerde administraties
      aan instanties, genoemd in [artikel 73, eerste en tweede lid, van de Wet SUWI][ref1], en derden, bedoeld in
      [artikel 5.12, tweede lid][ref2], persoonsgegevens, gegevens over de uitkeringsverhouding en over opleiding en
      werkervaring te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0013267#Artikel5
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.15
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '73'
      - id: ref2
        bwb_id: BWBR0013267
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.4'
  - number: 5.15.2
    text: |-
      De in het eerste lid bedoelde gegevens, niet zijnde bijzondere categorieën van persoonsgegevens
      en persoonsgegevens van strafrechtelijke aard als bedoeld in [paragraaf 3.1][ref1] respectievelijk
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref2], kunnen door de SVB en het
      UWV systematisch worden verstrekt aan de instanties, genoemd in [artikel 73, eerste en tweede lid][ref3], indien
      met de desbetreffende instantie overeenstemming is bereikt over de te verstrekken gegevens, de omstandigheden
      waaronder, de regelmaat waarmee en de wijze waarop die verstrekking plaatsvindt, vast te leggen in een besluit, dat
      op adequate wijze wordt bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.1
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel73
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.15
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0040940
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '73'
  - number: 5.15.3
    text: |-
      De bevoegdheid op grond van het eerste lid geldt ook voor het UWV voor het verstrekken van andere gegevens dan
      bedoeld in [artikel 5.12][ref1], die door het UWV worden verwerkt op grond van [artikel 33a van de Wet SUWI][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel33a
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.15
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.4'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: 33a
  - number: 5.15.4
    text: Bij ministeriële regeling wordt bepaald welke gegevens op grond van het derde lid worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.15
  - number: 5.15.5
    text: |-
      Bij het verstrekken van gegevens op grond van dit artikel worden kosten in rekening gebracht. Bij ministeriële
      regeling worden hiervoor nadere regels gesteld.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.15
  - number: '5.16'
    text: |-
      Eigenrisicodragers, die het risico dragen van de betaling van uitkeringen aan personen, ten aanzien van wie op
      grond van [artikel 7, eerste lid, onderdeel a, van de Participatiewet][ref1] een verantwoordelijkheid bestaat,
      verstrekken op verzoek aan colleges van burgemeester en wethouders opgaven en inlichtingen die noodzakelijk zijn
      voor de uitvoering van [artikel 7, eerste lid, onderdeel a, van de Participatiewet][ref2] ten aanzien van die
      personen.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel7
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.16
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '7'
  - number: 5.17.1
    text: |-
      Het UWV verstrekt uit de onder zijn verantwoordelijkheid gevoerde administraties aan overheidswerkgevers als
      bedoeld in [artikel 1, onderdeel i, van de WW][ref1], kosteloos de gegevens die noodzakelijk zijn voor de
      uitvoering van de taak, bedoeld in [artikel 72a van de WW][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel72a
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.17
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: 72a
  - number: 5.17.2
    text: |-
      Het UWV verstrekt uit de onder zijn verantwoordelijkheid gevoerde administraties aan het
      participatiefonds, bedoeld in [artikel 190, eerste lid, van de Wet op het primair onderwijs][ref1] en
      [artikel 169, eerste lid, van de Wet op de expertisecentra][ref2], kosteloos de gegevens die noodzakelijk zijn voor
      de uitvoering van zijn taak, bedoeld in artikel 190, derde lid, onderdeel d, van de Wet op het primair onderwijs en
      artikel 169, derde lid, onderdeel d, van de Wet op de expertisecentra.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel190
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel169
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.17
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '190'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '169'
  - number: 5.17.3
    text: |-
      Een overheidswerkgever of het Participatiefonds, bedoeld in het tweede lid, kan het UWV op verzoek of uit
      eigen beweging kennis geven van het gegronde vermoeden dat een persoon van wie de inschakeling in de arbeid
      wordt bevorderd, onvoldoende medewerking verleent aan deze werkzaamheden, voorzover dit noodzakelijk is voor de
      uitvoering van de [WW][ref1] door het UWV.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.17
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: 5.18.1
    text: |-
      De gegevens die het UWV op grond van [artikel 73, negende lid, van de Wet SUWI][ref1] bevoegd is te verstrekken
      betreffen gegevens omtrent naam, woon- of postadres, telefoonnummer, opleiding en werkervaring.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel73
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.18
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '73'
  - number: 5.18.2
    text: |-
      De gegevens die het UWV op grond van [artikel 73, elfde lid, van de Wet SUWI][ref1] bevoegd is te verstrekken
      betreffen naam, woon- of postadres, telefoonnummer of e-mailadres.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel73
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.18
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '73'
  - number: 5.18.3
    text: |-
      Bij het verstrekken van gegevens door het UWV op grond van
      [artikel 73, negende tot en met elfde lid, van de Wet SUWI][ref1], aan re-integratiebedrijven en ondersteunende
      instanties worden geen kosten in rekening gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel73
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.18
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '73'
  - number: 5.18a.1
    text: |-
      Werkgevers als bedoeld in [artikel 73, derde lid, onderdeel a, van de Wet SUWI][ref1] zijn
      bevoegd persoonsgegevens, waaronder gegevens over gezondheid, van de persoon, die in zijn dienst
      of voor hem arbeid verricht of heeft verricht, te verstrekken aan verzekeraars als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref2], of financiële dienstverleners die bemiddelen in
      verzekeringen als bedoeld in artikel 1:1 van die wet, voor zover de verwerking noodzakelijk is voor:


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.18a
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '73'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 5.18a.1.a
    text: |-
      de beoordeling bij het aangaan van de overeenkomst van het door de verzekeraar te verzekeren risico van het
      betalen van loon in geval van ziekte van de werknemer dan wel van het risico van betalingen als gevolg van het
      eigenrisicodragen, bedoeld in [artikel 40, eerste lid, van de Wfsv][ref1] alsmede van verzekeringen van uitkeringen
      ten gevolge van arbeidsongeschiktheid;


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel40
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.18a
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '40'
  - number: 5.18a.1.b
    text: |-
      de uitvoering van de overeenkomst tot verzekering van het risico van het betalen van loon in geval van
      ziekte van de werknemer dan wel het risico van betalingen als gevolg van het eigenrisicodragen, bedoeld
      in [artikel 40, eerste lid, van de Wfsv][ref1], alsmede verzekeringen van uitkeringen ten gevolge van
      arbeidsongeschiktheid.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel40
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.18a
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '40'
  - number: 5.18a.2
    text: |-
      Bij de gegevensverwerking noodzakelijk voor de beoordeling, bedoeld in het eerste lid, onderdeel a, kan de
      werkgever de volgende gegevens, waaronder gegevens over gezondheid, verstrekken van werknemers: geboortedatum,
      geslacht, gegevens over het dienstverband, salaris, verzuimstatistieken, arbeidsongeschiktheidspercentages van
      de werknemers bij verzuim en in verband met de beoordeling van een Wet WIA uitkering, ingangsdatum WGA-uitkering
      op grond van de [Wet WIA][ref1], datum beëindiging loongerelateerde uitkering, datum beëindiging uitkering op
      grond van de Wet WIA, begin- en einddatum van de ZW-uitkering, aantal werknemers met een ZW-uitkering op grond van
      [artikel 29b van de ZW][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019057
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel29b
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.18a
    references:
      - id: ref1
        bwb_id: BWBR0019057
      - id: ref2
        bwb_id: BWBR0001888
        artikel: 29b
  - number: 5.18a.3
    text: |-
      Bij de gegevensverwerking noodzakelijk voor de uitvoering van een overeenkomst als bedoeld in het eerste lid,
      onderdeel b, kan de werkgever de volgende gegevens, waaronder gegevens over gezondheid van werknemers verstrekken:
      NAW-gegevens, geboortedatum, geslacht, gegevens over het dienstverband, salaris, arbeidsongeschiktheids-
      of werkhervattingspercentage, lopende uitkeringen en regelingen, percentage loonwaarde, datum aanvang
      mutatie van verzuim, gegevens met betrekking tot de algemene voortgang van de re-integratie en het re-
      integratietraject, waaronder gegevens over het plan van aanpak en de instroom in de [WIA][ref1], bedoeld in
      [artikel 25, tweede lid, van de Wet WIA][ref2], en over het reïntegratieverslag, bedoeld in artikel 25, derde
      lid, van de Wet WIA, in verband met een aanvraag voor een uitkering, bedoeld in [artikel 65 van de Wet WIA][ref3],
      toekennings- en vervolgbeslissingen over uitkeringen op grond van de Wet WIA van UWV, gegevens over de WGA-
      uitkering in geval de werkgever eigenrisicodrager is in de zin van de Wet WIA, gegevens in verband met de
      mogelijkheid van regres, bedoeld in [artikel 99][ref4] of [100 van de Wet WIA][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0019057
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Artikel65
      [ref4]: https://wetten.overheid.nl/BWBR0019057#Artikel99
      [ref5]: https://wetten.overheid.nl/BWBR0019057#Artikel100
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.18a
    references:
      - id: ref1
        bwb_id: BWBR0019057
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '25'
      - id: ref3
        bwb_id: BWBR0019057
        artikel: '65'
      - id: ref4
        bwb_id: BWBR0019057
        artikel: '99'
      - id: ref5
        bwb_id: BWBR0019057
        artikel: '100'
  - number: 5.18a.4
    text: |-
      Bij de gegevensverwerking noodzakelijk voor de uitvoering van de taak, bedoeld in het eerste lid, onderdeel b,
      kan gebruik worden gemaakt van het burgerservicenummer voor zover er sprake is van verwerking van gegevens over
      gezondheid.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.18a
  - number: '5.19'
    text: |-
      Ten behoeve van de gegevensverwerking, bedoeld in [artikel 62 van de Wet SUWI][ref1], worden de elektronische
      voorzieningen in ieder geval benut:


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel62
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.19
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '62'
  - number: 5.19.a
    text: |-
      om de gebruikers en derde partijen te faciliteren bij de raadpleging en aanlevering van de gegevens met het oog op
      eenmalige gegevensuitvraag en de inrichting van hun administraties daarbij;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.19
  - number: 5.19.b
    text: voor eenduidige informatieverstrekking aan de betrokkene op wie de gegevens betrekking hebben door gebruikers.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.19
  - number: '5.20'
    text: 'Bij ministeriële regeling wordt in het Gegevensregister SUWI bepaald:'
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.20
  - number: 5.20.a
    text: dat gegevens met behulp van de elektronische voorzieningen worden uitgewisseld;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.20
  - number: 5.20.b
    text: welke soort gegevens en documenten het daarbij betreft;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.20
  - number: 5.20.c
    text: wie de verwerkingsverantwoordelijke is;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.20
  - number: 5.20.d
    text: welke gegevens aan de betrokkene op wie de gegevens betrekking hebben worden gepresenteerd en op welke wijze.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.20
  - number: 5.21.1
    text: |-
      Het UWV voert ten behoeve van de gezamenlijke zorg voor de instandhouding van de elektronische voorzieningen de
      volgende beheertaken uit:
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.21
  - number: 5.21.1.a
    text: de inrichting van een centrale elektronische voorziening;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.21
  - number: 5.21.1.b
    text: de inrichting van een gemeenschappelijke faciliteit voor de toegangsbeveiliging;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.21
  - number: 5.21.1.c
    text: de ondersteuning van de gebruikers bij het beheer en gebruik van de centrale elektronische voorzieningen;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.21
  - number: 5.21.1.d
    text: |-
      het, na overleg met de gebruikers, doen van voorstellen aan Onze Minister over de wijziging van de ministeriële
      regelingen op grond van deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.21
  - number: 5.21.2
    text: Het UWV belast een afzonderlijk en herkenbaar organisatieonderdeel met de taken, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.21
  - number: 5.21.3
    text: |-
      De gebruikers zorgen, ten behoeve van het beheer en gebruik van onderdelen van de elektronische voorzieningen, voor
      de inrichting van een decentrale elektronische voorziening en de aansluiting daarvan op de centrale elektronische
      voorziening, bedoeld in het eerste lid, onderdeel a.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.21
  - number: 5.21.4
    text: |-
      Bij ministeriële regeling worden, in de vorm van het Stelselontwerp gezamenlijke elektronische voorzieningen SUWI,
      regels gesteld over de wijze waarop invulling wordt gegeven aan het eerste en derde lid.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.21
  - number: 5.22.1
    text: |-
      De gebruikers dragen op uniforme wijze zorg voor de beveiliging van de gegevensverwerking door middel van de
      elektronische voorzieningen tegen inbreuken op de beschikbaarheid, de integriteit en de vertrouwelijkheid.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.22
  - number: 5.22.2
    text: Bij ministeriële regeling worden regels gesteld over deze beveiliging.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.22
  - number: 5.23.1
    text: |-
      De elektronische voorzieningen worden tevens gebruikt voor de verwerking van gegevens als bedoeld in
      [artikel 62, tweede lid, tweede zin, van de Wet SUWI][ref1] indien er een overeenkomst is gesloten tussen één van
      de gebruikers, voor zover die tot de gegevensverstrekking of het opvragen van de gegevens bevoegd is, en een derde
      partij. De overeenkomst heeft in ieder geval betrekking op de gegevens die worden verstrekt en de stelselmatigheid
      van de verstrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel62
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.23
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '62'
  - number: 5.23.2
    text: |-
      In geval één van de partijen bij een overeenkomst als bedoeld in het eerste lid een college van burgemeester en
      wethouders is treedt het Inlichtingenbureau namens het betrokken college van burgemeester en wethouders als partij
      op, indien het de verwerking van gegevens betreft, bedoeld in [artikel 5.24][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel5
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.23
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.7'
  - number: 5.23.3
    text: |-
      Op de gegevensverstrekking, bedoeld in dit artikel, is [artikel 5.20][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel5
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.23
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.6'
  - number: 5.23.4
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld over de overeenkomst, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.23
  - number: 5.23a.1
    text: |-
      Op het verwerken van de justitiële gegevens die het UWV, de SVB en de colleges van burgemeester en
      wethouders op grond van [artikel 13a van het Besluit justitiële en strafvorderlijke gegevens][ref1]
      ontvangen voor het nemen van een besluit tot oplegging van een bestuurlijke boete ter uitvoering van de in
      artikel 13a, tweede lid, van dat Besluit genoemde wetten, zijn de elektronische voorzieningen, bedoeld in
      [artikel 62, tweede lid, van de Wet SUWI][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016544#Artikel13a
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel62
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.23a
    references:
      - id: ref1
        bwb_id: BWBR0016544
        artikel: 13a
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '62'
  - number: 5.23a.2
    text: |-
      [Artikel 5.20][ref1] is van overeenkomstige toepassing, waarbij voorts regels worden gesteld voor de
      bewaartermijnen van de gegevens, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel5
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.23a
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.6'
  - number: 5.24.1
    text: |-
      Het Inlichtingenbureau verwerkt gegevens die bij of krachtens enige wet door tussenkomst van het
      Inlichtingenbureau aan of door colleges van burgemeester en wethouders worden verstrekt, voor zover
      [artikel 62 van de Wet SUWI][ref1] van toepassing is. Het Inlichtingenbureau kan tevens, als verwerker, de
      gegevens verwerken die door het UWV, de Dienst wegverkeer of de Belastingdienst op grond van enig wettelijk
      voorschrift worden verstrekt aan colleges van burgemeester en wethouders, voor zover dit noodzakelijk is voor het
      verlenen van kwijtschelding van gemeentelijke belastingen, bedoeld in [artikel 255 van de Gemeentewet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel255
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.24
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '62'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '255'
  - number: 5.24.2
    text: |-
      De in het eerste lid genoemde gegevens kunnen justitiële gegevens betreffen,
      die aan de colleges van burgemeester en wethouders worden verstrekt op grond van
      [artikel 13a, tweede lid, onderdelen l, m en n, van het Besluit justitiële en strafvorderlijke gegevens][ref1]
      met het oog op het nemen van een besluit tot oplegging van een bestuurlijke boete op grond van de wetten, genoemd
      in die onderdelen.


      [ref1]: https://wetten.overheid.nl/BWBR0016544#Artikel13a
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.24
    references:
      - id: ref1
        bwb_id: BWBR0016544
        artikel: 13a
  - number: 5.24.3
    text: |-
      Het Inlichtingenbureau en de betrokken colleges van burgemeester en wethouders zijn gezamenlijke
      verwerkingsverantwoordelijken als bedoeld in artikel 26 van de Algemene verordening gegevensbescherming, voor de
      verwerking van persoonsgegevens als bedoeld in het eerste lid, eerste volzin, en het tweede lid.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.24
  - number: 5.24.4
    text: |-
      Bij ministeriële regeling kan worden bepaald welke gegevens door het Inlichtingenbureau worden verwerkt bij de
      uitoefening van de taken, genoemd in het eerste en tweede lid, en wat de respectievelijke verantwoordelijkheden
      zijn van het Inlichtingenbureau en de betrokken colleges van burgemeester en wethouders voor de nakoming van de
      verplichtingen uit hoofde van de Algemene verordening gegevensbescherming.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.24
  - number: 5.25.1
    text: |-
      De kosten van het Inlichtingenbureau voor de uitvoering van de taken, bedoeld in [artikel 5.24, eerste lid][ref1],
      komen ten laste van de daartoe door Onze Minister toegekende rijksbijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel5
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.25
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.7'
  - number: 5.25.2
    text: |-
      Het Inlichtingenbureau stelt hiertoe elk jaar een begroting en een jaarplan voor het komende kalenderjaar vast en
      biedt deze vóór een door Onze Minister vast te stellen datum aan hem aan.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.25
  - number: 5.25.3
    text: |-
      Onze Minister stelt jaarlijks vóór 1 december het budget voor de uitvoeringskosten van het Inlichtingenbureau voor
      het eerstvolgende kalenderjaar vast. Hij kan besluiten dit budget te wijzigen. Het Inlichtingenbureau gaat met
      betrekking tot de uitvoering van zijn wettelijke taken geen verplichtingen aan en doet geen uitgaven die leiden
      tot een overschrijding van het vastgestelde budget. Wanneer het budget niet is vastgesteld vóór 1 januari van het
      kalenderjaar waarop de begroting betrekking heeft, is het Inlichtingenbureau bevoegd, teneinde zijn activiteiten
      gaande te houden, te beschikken over ten hoogste een derde gedeelte van het budget dat laatstelijk voor een
      geheel jaar is vastgesteld. Onze Minister kan besluiten dat het Inlichtingenbureau in een geval als bedoeld in de
      vorige zin, kan beschikken over meer dan een derde gedeelte van het budget dat laatstelijk voor een geheel jaar
      is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.25
  - number: 5.25.4
    text: |-
      Het Inlichtingenbureau stelt jaarlijks een jaarverslag en een jaarrekening op en biedt deze vóór 15
      maart van het kalenderjaar volgend op het jaar waarop deze betrekking hebben aan Onze Minister aan. Het
      Inlichtingenbureau beschrijft in zijn jaarverslag de taakuitoefening, het gevoerde beleid en de doelmatigheid
      van de uitvoering van de taken, bedoeld in [artikel 5.24, eerste lid][ref1], in het afgelopen jaar en legt
      in zijn jaarrekening rekening en verantwoording af over het financieel beheer, alsmede over de rechtmatigheid
      van genoemde taken in het verstreken boekjaar. De jaarrekening gaat vergezeld van een verklaring omtrent
      de getrouwheid, afgegeven door een door het Inlichtingenbureau aangewezen accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2]. Deze verklaring heeft mede betrekking op de
      rechtmatige besteding van de middelen door het Inlichtingenbureau. De accountant voegt bij de verklaring tevens een
      verslag van zijn bevindingen over de vraag of het beheer en de organisatie van het Inlichtingenbureau voldoen aan
      de eisen van doelmatigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.25
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.7'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 5.25.5
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent de inhoud en de indiening van de begroting en
      ontwerpen daarvan, het jaarplan, tussentijdse verslagen, het jaarverslag, de jaarrekening, de verklaring, bedoeld
      in het vierde lid, en het aan die verklaring ten grondslag liggende onderzoek.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.25
  - number: 5.25.6
    text: |-
      Onze Minister betaalt maandelijks op of omstreeks de vijftiende dag van de maand een periodiek voorschot ter hoogte
      van 1/12de deel van het budget, bedoeld in het derde lid. Onze Minister kan na overleg met het Inlichtingenbureau
      van het in de voorgaande zin bedoeld bedrag afwijken.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.25
  - number: 5a.1.1
    text: |-
      Indien het verzoek van het samenwerkingsverband voldoet aan de voorwaarden, bedoeld in het tweede tot en met vierde
      lid, en uit de in het zesde lid bedoelde prioritering blijkt dat er voldoende capaciteit beschikbaar is voor de
      koppeling, bedoeld in [artikel 5a.2][ref1], en de analyse, bedoeld in [artikel 5a.3][ref2], verwerkt Onze Minister
      de gegevens, bedoeld in [artikel 64, tweede lid, van de Wet SUWI][ref3] in SyRI.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0013267#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel64
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.1
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: 5a
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0013267
        artikel: 5a
        hoofdstuk: 5a
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '64'
  - number: 5a.1.2
    text: 'Uit het verzoek blijkt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.1
  - number: 5a.1.2.a
    text: |-
      met welke bestuursorganen en personen in het kader van [artikel 64, eerste lid, van de Wet SUWI][ref1] ten behoeve
      van het SyRI-project wordt samengewerkt, wat de concrete doelstelling van de samenwerking is, hoe de samenwerking
      is georganiseerd en vormgegeven, en de beoogde aanvangsdatum en de duur van het SyRI-project;


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel64
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '64'
  - number: 5a.1.2.b
    text: welke concrete gegevens door de bestuursorganen en personen van het samenwerkingsverband zullen worden aangeleverd;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.1
  - number: 5a.1.2.c
    text: de beoogde wijze van terugkoppeling van de risicomeldingen door Onze Minister, en
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.1
  - number: 5a.1.2.d
    text: op welke indicatoren en welk risicomodel het verzoek betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.1
  - number: 5a.1.3
    text: 'Voor verwerking in SyRI komen uitsluitend een of meer van de volgende categorieën gegevens in aanmerking:'
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.1
  - number: 5a.1.3.a
    text: arbeidsgegevens, zijnde gegevens waarmee een door een persoon verrichte werkzaamheden vastgesteld kunnen worden;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.1
  - number: 5a.1.3.b
    text: |-
      gegevens inzake bestuursrechtelijke maatregelen en sancties, zijnde gegevens waaruit blijkt dat een natuurlijke
      persoon of een rechtspersoon een bestuursrechtelijke boete opgelegd heeft gekregen dan wel dat een andere
      bestuursrechtelijke maatregel is getroffen;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.1
  - number: 5a.1.3.c
    text: |-
      fiscale gegevens, zijnde gegevens waarmee de fiscale verplichtingen van een natuurlijk persoon of rechtspersoon
      kunnen worden vastgesteld;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.1
  - number: 5a.1.3.d
    text: |-
      gegevens roerende en onroerende goederen, zijnde gegevens waarmee het bezit en het gebruik van bepaalde goederen
      door een natuurlijk persoon of rechtspersoon kunnen worden vastgesteld;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.1
  - number: 5a.1.3.e
    text: |-
      gegevens over uitsluitingsgronden van bijstand of uitkeringen, zijnde gegevens waaruit blijkt dat een persoon niet
      in aanmerking komt voor een uitkering;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.1
  - number: 5a.1.3.f
    text: handelsgegevens, zijnde gegevens waarmee de aard en werkzaamheden van een rechtspersoon kunnen worden vastgesteld;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.1
  - number: 5a.1.3.g
    text: |-
      huisvestingsgegevens, zijnde gegevens waarmee de (daadwerkelijke) verblijfs- of vestigingsplaats van een natuurlijk
      persoon of rechtspersoon kunnen worden vastgesteld;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.1
  - number: 5a.1.3.h
    text: |-
      identificerende gegevens, zijnde bij een natuurlijk persoon: naam, adres, woonplaats, postadres, geboortedatum,
      geslacht en administratieve kenmerken en bij een rechtspersoon: naam, adres, postadres, rechtsvorm,
      vestigingsplaats en administratieve kenmerken;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.1
  - number: 5a.1.3.i
    text: |-
      inburgeringsgegevens, zijnde gegevens waarmee kan worden vastgesteld of aan een persoon inburgeringsverplichtingen
      zijn opgelegd;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.1
  - number: 5a.1.3.j
    text: |-
      nalevingsgegevens, zijnde gegevens waarmee de nalevingshistorie van wet- en regelgeving van een natuurlijk persoon
      of rechtspersoon kan worden vastgelegd;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.1
  - number: 5a.1.3.k
    text: |-
      onderwijsgegevens, zijnde gegevens waarmee de financiële ondersteuning ten behoeve van de bekostiging van onderwijs
      kan worden vastgesteld;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.1
  - number: 5a.1.3.l
    text: pensioengegevens, zijnde gegevens waarmee de pensioenrechten kunnen worden vastgesteld;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.1
  - number: 5a.1.3.m
    text: |-
      re-integratiegegevens, zijnde uitsluitend de gegevens waarmee kan worden vastgesteld of aan een persoon re-
      integratieverplichtingen zijn opgelegd en of deze worden nageleefd;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.1
  - number: 5a.1.3.n
    text: |-
      schuldenlastgegevens, zijnde gegevens waarmee de eventuele schulden van een natuurlijk persoon of rechtspersoon
      kunnen worden vastgesteld;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.1
  - number: 5a.1.3.o
    text: |-
      uitkerings-, toeslagen- en subsidiegegevens, zijnde gegevens waarmee de financiële ondersteuning van een natuurlijk
      persoon of rechtspersoon kan worden vastgesteld;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.1
  - number: 5a.1.3.p
    text: |-
      vergunningen en ontheffingen, zijnde gegevens waarmee kan worden bepaald voor welke activiteiten een natuurlijk
      persoon of rechtspersoon toestemming heeft gevraagd of verkregen;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.1
  - number: 5a.1.3.q
    text: |-
      zorgverzekeringsgegevens, zijnde uitsluitend de gegevens waarmee kan worden vastgesteld of een persoon is verzekerd
      voor de Zorgverzekeringswet.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.1
  - number: 5a.1.4
    text: |-
      Voorts blijkt uit het verzoek, dat ieder van de bestuursorganen en personen, bedoeld in
      [artikel 64, eerste lid, van de wet][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel64
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '64'
  - number: 5a.1.4.a
    text: met het verzoek instemt;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.1
  - number: 5a.1.4.b
    text: |-
      de voorgenomen bestandslevering heeft getoetst aan de gegevens die nodig zijn voor de risico analyses, ten behoeve
      van het doel van het SyRI-project, waaronder het doel in [artikel 64, eerste lid, van de Wet SUWI][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel64
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '64'
  - number: 5a.1.4.c
    text: |-
      heeft onderbouwd dat een mogelijke aantasting van de belangen van de natuurlijke personen of rechtspersonen op wie
      de verwerking van gegevens betrekking heeft niet onevenredig is in verhouding tot het doel dat met de inzet van
      SyRI wordt beoogd;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.1
  - number: 5a.1.4.d
    text: |-
      alleen die gegevens verstrekt, die voor de risicoanalyses, bedoeld in
      [artikel 65, eerste lid, van de Wet SUWI][ref1] nodig zijn, en


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel65
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '65'
  - number: 5a.1.4.e
    text: |-
      in redelijkheid geen minder ingrijpende wijze voor de betrokken personen of rechtspersonen kan hanteren om het doel
      dat met de inzet van SyRI wordt beoogd, te bereiken.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.1
  - number: 5a.1.5
    text: |-
      Voor zover een bestuursorgaan dat of een persoon die deel uitmaakt van een samenwerkingsverband voor een SyRI-
      project niet beschikt over de noodzakelijke gegevens, bedoeld in [artikel 64, tweede lid, van de Wet SUWI][ref1] is
      het vierde lid, onderdelen b tot en met e, niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel64
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '64'
  - number: 5a.1.6
    text: Onze Minister stelt een prioritering van de analysecapaciteit voor SyRI vast.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.1
  - number: 5a.1.7
    text: Onze Minister stelt een of meer risicomodellen vast.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.1
  - number: 5a.1.8
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over de wijze waarop het verzoek door het
      samenwerkingsverband wordt opgesteld en ingediend en de inhoud van dit verzoek.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.1
  - number: 5a.2.1
    text: |-
      Indien het verzoek voldoet aan [artikel 5a.1, tweede tot en met vierde lid][ref1], worden de gegevens
      overeenkomstig [artikel 65, eerste lid, van de Wet SUWI][ref2] verwerkt, nadat het samenwerkingsverband de
      noodzakelijke bestanden kosteloos en voldoende beveiligd aan de verwerker heeft aangeleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel65
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.2
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: 5a
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '65'
  - number: 5a.2.2
    text: Als verwerker voor de koppeling van de bestanden in SyRI wordt de Stichting Inlichtingenbureau aangewezen.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.2
  - number: 5a.2.3
    text: 'De verwerker verricht achtereenvolgens de volgende activiteiten ten behoeve van het SyRI-project:'
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.2
  - number: 5a.2.3.a
    text: |-
      hij brengt de door het samenwerkingsverband aangeleverde bestanden die ten behoeve van de uitvoering van het
      risicomodel noodzakelijk zijn samen;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.2
  - number: 5a.2.3.b
    text: |-
      hij creëert bestanden met versleutelde persoons- en bedrijfsgegevens, zodanig dat deze voor anderen niet meer tot
      natuurlijke personen en rechtspersonen herleidbaar zijn;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.2
  - number: 5a.2.3.c
    text: |-
      hij creëert een afzonderlijk bestand met de sleutels voor de ontsleuteling van de versleutelde gegevens, bedoeld in
      onderdeel b;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.2
  - number: 5a.2.3.d
    text: hij maakt de bestanden gereed voor koppeling;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.2
  - number: 5a.2.3.e
    text: |-
      hij neemt de gegevens op in SyRI door het koppelen van de bestanden, bedoeld in onderdeel b, overeenkomstig het
      risicomodel;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.2
  - number: 5a.2.3.f
    text: |-
      hij ontsleutelt alleen die gegevens die op basis van de resultaten van de koppeling van de bestanden duiden op een
      verhoogd risico op onregelmatigheden als bedoeld in [artikel 64, eerste lid, van de Wet SUWI][ref1] en legt daar
      een bestand van aan;


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel64
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.2
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '64'
  - number: 5a.2.3.g
    text: hij verstrekt het bestand, bedoeld in onderdeel f, aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.2
  - number: 5a.2.4
    text: |-
      De verwerker vernietigt de in het kader van het SyRI-project aan hem verstrekte bestanden, de door hem bewerkte
      bestanden en de bestanden, bedoeld in het derde lid, onderdeel c, binnen vier weken nadat het bestand, bedoeld in
      het derde lid, onderdeel g, aan Onze Minister is verstrekt.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.2
  - number: 5a.3.1
    text: |-
      Onze Minister analyseert de verstrekte gegevens, bedoeld in [artikel 5a.2, derde lid, onderdeel g][ref1], en
      bepaalt in welke gevallen deze leiden tot een risicomelding.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel5a
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.3
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: 5a
        hoofdstuk: 5a
  - number: 5a.3.2
    text: |-
      Onze Minister verstrekt aan de betreffende bestuursorganen en personen van het samenwerkingsverband de in
      aanmerking komende risicomeldingen die noodzakelijk zijn voor een goede uitvoering van hun wettelijke taak.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.3
  - number: 5a.3.3
    text: |-
      Indien een natuurlijk persoon of rechtspersoon geen onderwerp is van een risicomelding worden zijn of haar gegevens
      binnen vier weken na afronding van de analyse, bedoeld in het eerste lid, door Onze Minister vernietigd.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.3
  - number: 5a.3.4
    text: |-
      De terugkoppeling, bedoeld in [artikel 65, zesde lid, van de Wet SUWI][ref1] vindt plaats binnen twintig maanden te
      rekenen vanaf de aanvang van het SyRI-project.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel65
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.3
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '65'
  - number: 5a.3.5
    text: |-
      Onverminderd de regels krachtens [artikel 5a.5][ref1], vernietigt Onze Minister na de terugkoppeling, bedoeld in
      [artikel 65, zesde lid, van de Wet SUWI][ref2], maar in ieder geval uiterlijk twee jaar nadat het SyRI-project is
      aangevangen, alle in het kader van dat project verkregen gegevens, waaronder de via de terugkoppeling verkregen
      gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel65
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.3
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: 5a
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '65'
  - number: 5a.4.1
    text: |-
      Onze Minister bepaalt de aanvangsdatum van het SyRI-project indien het verzoek aan
      [artikel 5a.1, eerste lid][ref1], voldoet. Hiervan doet hij mededeling in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel5a
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.4
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: 5a
        hoofdstuk: 5a
  - number: 5a.4.2
    text: |-
      Het SyRI-project eindigt zodra de terugkoppelingen, bedoeld in [artikel 65, zesde lid, van de Wet SUWI][ref1] bij
      Onze Minister zijn ingediend of Onze Minister hiertoe besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel65
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.4
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '65'
  - number: 5a.5.1
    text: |-
      Er is een register risicomeldingen waarin gegevens over risicomeldingen worden verwerkt teneinde projectdeelnemers
      en bestuursorganen te informeren over de risicomeldingen die zijn verstrekt en om subjecten van risicomeldingen op
      aanvraag te informeren of zijn gegevens in het register zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.5
  - number: 5a.5.2
    text: Onze Minister is de verwerkingsverantwoordelijke voor de verwerking van gegevens in het register risicomeldingen.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.5
  - number: 5a.5.3
    text: |-
      De gegevens uit het register risicomeldingen die noodzakelijk zijn voor de in het eerste lid genoemde doeleinden,
      worden verstrekt aan projectdeelnemers en subjecten van projecten.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.5
  - number: 5a.5.4
    text: |-
      Gelet op het bepaalde in het eerste lid worden subjecten niet na afloop van het onderzoek afzonderlijk geïnformeerd
      over de risicomeldingen die in het register worden verwerkt.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.5
  - number: 5a.5.5
    text: |-
      Indien een risicomelding wordt gedaan, worden de gegevens over de risicomelding direct opgenomen in het register
      risicomeldingen. De gegevens over de risicomeldingen worden bewaard tot twee jaren nadat de risicomelding in het
      register risicomeldingen is opgenomen.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.5
  - number: 5a.6.1
    text: |-
      Met inachtneming van de bewaartermijnen, bedoeld in [artikel 65, vijfde lid, van de Wet SUWI][ref1] evalueert Onze
      Minister het voor het SyRI-project gehanteerde risicomodel aan de hand van de ontvangen terugkoppelingen, bedoeld
      in [artikel 65, zesde lid, van de Wet SUWI][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel65
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.6
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '65'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '65'
  - number: 5a.6.2
    text: 'De terugkoppeling vindt op de volgende onderdelen plaats:'
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.6
  - number: 5a.6.2.a
    text: 'voor zover beschikbaar: de resultaten van de risicomeldingen;'
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.6
  - number: 5a.6.2.b
    text: de bruikbaarheid van de risicomeldingen;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.6
  - number: 5a.6.2.c
    text: 'indien een of meer risicomeldingen niet tot vervolgacties hebben geleid: de redenen hiervan.'
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.6
  - number: 5a.6.3
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de terugkoppeling van de resultaten van de
      risicomeldingen, bedoeld in [artikel 65, zesde lid, van de Wet SUWI][ref1], en de evaluatie, bedoeld in het eerste
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel65
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.6
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '65'
  - number: 5a.7.1
    text: |-
      De verwerker respectievelijk Onze Minister stelt bij vernietiging van gegevens als bedoeld in
      [artikel 5a.2, vierde lid][ref1], respectievelijk [artikel 5a.3, derde en vijfde lid][ref2], en
      [artikel 5a.5, vijfde lid][ref3], ter zake een proces-verbaal van vernietiging op waarin staat op welke wijze de
      gegevens zijn vernietigd alsmede de datum waarop en de locatie waar de vernietiging heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0013267#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0013267#Artikel5a
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.7
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: 5a
        hoofdstuk: 5a
      - id: ref2
        bwb_id: BWBR0013267
        artikel: 5a
        hoofdstuk: 5a
      - id: ref3
        bwb_id: BWBR0013267
        artikel: 5a
        hoofdstuk: 5a
  - number: 5a.7.2
    text: |-
      Het proces-verbaal, bedoeld in het eerste lid, wordt door de verwerker respectievelijk Onze Minister ter kennisname
      aan het samenwerkingsverband verzonden.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5a.7
  - number: '6.1'
    text: |-
      Dit besluit berust mede op [artikelen 7, zesde lid][ref1], en
      [67, vierde en vijfde lid, van de Participatiewet][ref2], [artikel 34, vijfde lid, van de IOAW][ref3],
      [artikel 34, vijfde lid, van de IOAZ][ref4] en de [artikelen 33, elfde lid][ref5], en
      [54, elfde lid, van de Wet SUWI][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel67
      [ref3]: https://wetten.overheid.nl/BWBR0004044#Artikel34
      [ref4]: https://wetten.overheid.nl/BWBR0004163#Artikel34
      [ref5]: https://wetten.overheid.nl/BWBR0013060#Artikel33
      [ref6]: https://wetten.overheid.nl/BWBR0013060#Artikel54
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '7'
      - id: ref2
