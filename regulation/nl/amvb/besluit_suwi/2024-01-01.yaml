      [artikel 7 van de Participatiewet][ref1] worden uitgevoerd in het samenwerkingsverband in relatie tot de uitvoering
      van de andere taken op grond van artikel 7 van de Participatiewet, waarbij ten minste aandacht wordt besteed aan de
      verantwoording aan de afzonderlijke gemeenteraden;


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel2.3
    references:
