        artikel: '34'
      - id: ref5
        bwb_id: BWBR0013060
        artikel: '33'
      - id: ref6
        bwb_id: BWBR0013060
        artikel: '54'
  - number: 6.2.1
    text: |-
      Dit besluit treedt in werking met ingang van 1 januari 2002, met uitzondering van de
      [artikelen 4.7 tot en met 4.20][ref1], die in werking treden op een bij koninklijk besluit te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 6.2.2
    text: |-
      [Artikel 3.1, eerste lid, onderdeel d][ref1], vervalt op een bij koninklijk besluit te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel3
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '3'
        hoofdstuk: '3'
  - number: '6.3'
    text: 'Dit besluit wordt aangehaald als: Besluit SUWI.'
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel6.3
