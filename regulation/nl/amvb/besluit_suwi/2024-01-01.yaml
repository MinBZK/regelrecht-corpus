  - number: 5.4a
    text: |-
      De gegevens, bedoeld in [artikel 42, derde lid, van de Wet SUWI][ref1], die het UWV, de SVB en de colleges van
      burgemeester en wethouders op verzoek, kosteloos, aan de Nederlandse Arbeidsinspectie verstrekken, zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel42
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.4a
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '42'
  - number: 5.4a.a
    text: 'algemene gegevens over de uitkeringsgerechtigde: namen, adresgegevens, e-mailadres, burgerservicenummer;'
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.4a
  - number: 5.4a.b
    text: 'persoonskenmerken van de uitkeringsgerechtigde: geslacht, geboortedatum, opleiding, leefvorm;'
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.4a
  - number: 5.4a.c
    text: 'gegevens over uitkeringen: soort uitkering, ingangsdatum uitkering, datum einde uitkering, hoogte van de uitkering;'
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.4a
  - number: 5.4a.d
    text: |-
      nadere gegevens over uitkeringen, inkomsten en schulden: uitkeringspercentage, uitkeringscategorie, diagnosecode,
      registratie Landelijk Doelgroep Register, grondslag Landelijk Doelgroep Register, inkomsten naast uitkering;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.4a
  - number: 5.4a.e
    text: |-
      gegevens over dienstverlening: re-integratieondersteuning, arbeidsverplichtingen en arbeidsvrijstellingen,
      sanctionering, uitkomst werkverkenner, werkgeversvoorzieningen ten behoeve van de Doelgroep Banenafspraak,
      schuldhulpdienstverlening.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.4a
  - number: 5.5.1
    text: |-
      Voor het verstrekken van gegevens en inlichtingen als bedoeld in de [artikelen 54][ref1] en
      [72 van de Wet SUWI][ref2], en [5.4][ref3] aan Onze Minister en de opsporingsambtenaren, bedoeld in
      [artikel 85, tweede lid, van de Wet SUWI][ref4], maken het UWV, de SVB en de colleges van burgemeester en
      wethouders gebruik van de elektronische voorzieningen als bedoeld in [paragraaf 5.6][ref5], voor zover die
      gegevens noodzakelijk zijn voor de uitvoering van of het toezicht op de naleving van de in [artikel 5.4][ref6]
      genoemde wetten, respectievelijk voor de opsporing van feiten strafbaar gesteld bij de [Wet SUWI][ref7] of enige
      andere wet.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel72
      [ref3]: https://wetten.overheid.nl/BWBR0013267#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0013060#Artikel85
      [ref5]: https://wetten.overheid.nl/BWBR0013267#Hoofdstuk5
      [ref6]: https://wetten.overheid.nl/BWBR0013267#Artikel5
      [ref7]: https://wetten.overheid.nl/BWBR0013060
