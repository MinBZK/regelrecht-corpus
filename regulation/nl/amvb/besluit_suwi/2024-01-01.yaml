    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.8
    references:
      - id: ref1
        bwb_id: BWBR0002180
  - number: 5.9.1
    text: |-
      Het UWV is bevoegd uit eigen beweging en verplicht op verzoek uit de onder zijn verantwoordelijkheid gevoerde
      administraties kosteloos te verstrekken:
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.9
  - number: 5.9.1.a
    text: |-
      aan het Vervangingsfonds, bedoeld in
      [artikel 1, onderdeel e, van het Besluit Vervangingsfonds en Participatiefonds][ref1], de gegevens die
      noodzakelijk zijn voor de uitvoering van zijn taak op grond van de [Wet op het primair onderwijs][ref2], de
      [Wet voortgezet onderwijs 2020][ref3] en de [Wet op de expertisecentra][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0030106#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003420
      [ref3]: https://wetten.overheid.nl/BWBR0044212
      [ref4]: https://wetten.overheid.nl/BWBR0003549
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.9
    references:
      - id: ref1
        bwb_id: BWBR0030106
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0003420
      - id: ref3
        bwb_id: BWBR0044212
      - id: ref4
        bwb_id: BWBR0003549
  - number: 5.9.1.b
    text: |-
      aan het participatiefonds, bedoeld in [artikel 190, eerste lid, van de Wet op het primair onderwijs][ref1] en
      [artikel 169, eerste lid, van de Wet op de expertisecentra][ref2], de gegevens die noodzakelijk zijn voor de
      uitvoering van zijn taken, bedoeld in artikel 190, derde lid, onderdelen a, b en c, van de Wet op het primair
      onderwijs en artikel 169, derde lid, onderdelen a, b en c, van de Wet op de expertisecentra;


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel190
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel169
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.9
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '190'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '169'
  - number: 5.9.1.c
    text: |-
      aan Onze Minister van Onderwijs, Cultuur en Wetenschap de gegevens die noodzakelijk zijn voor de bekostiging van
      onderwijsinstellingen;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.9
  - number: 5.9.1.d
    text: |-
      aan de Sociaal Economische Raad de gegevens die noodzakelijk zijn voor de uitvoering van bij of krachtens enige wet
      aan die Raad opgedragen taken;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.9
  - number: 5.9.1.f
    text: |-
      aan colleges van burgemeester en wethouders de gegevens die noodzakelijk zijn ten behoeve van de
      registratie van gegevens, bedoeld in [artikel 8.22 van de Wet voortgezet onderwijs 2020][ref1],
      [artikel 8.3.2 van de Wet educatie en beroepsonderwijs][ref2] en
      [artikel 147 van de Wet op de expertisecentra][ref3] in verband met de doorverwijzing van voortijdige
      schoolverlaters naar onderwijs of arbeidsmarkt;


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel147
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.9
    references:
