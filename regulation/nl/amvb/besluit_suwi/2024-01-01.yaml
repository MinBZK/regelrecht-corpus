        bwb_id: BWBR0013060
        artikel: '54'
  - number: '5.3'
    text: |-
      De melding, bedoeld in [artikel 61 van de Wet SUWI][ref1], geschiedt kosteloos.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel61
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '61'
  - number: '5.4'
    text: |-
      Het UWV, de SVB en de colleges van burgemeester en wethouders zijn bevoegd uit eigen beweging en
      verplicht op verzoek uit de onder hun verantwoordelijkheid gevoerde administraties voor de taken,
      bedoeld in [artikel 62, eerste lid, van de Wet SUWI][ref1] kosteloos aan Onze Minister gegevens
      te verstrekken, die noodzakelijk zijn voor de uitvoering van of het toezicht op de naleving van het
      bepaalde bij of krachtens de [Wet arbeid vreemdelingen][ref2], de [Arbeidsomstandighedenwet][ref3],
      de [Arbeidstijdenwet][ref4], de [Wet allocatie arbeidskrachten door intermediairs][ref5],
      de [Wet arbeidsvoorwaarden gedetacheerde werknemers in de Europese Unie][ref6], de
      [Wet minimumloon en minimumvakantiebijslag][ref7], de [Wet op de loonvorming][ref8] en de
      [Wet gelijke behandeling mannen en vrouwen][ref9].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0007149
      [ref3]: https://wetten.overheid.nl/BWBR0010346
