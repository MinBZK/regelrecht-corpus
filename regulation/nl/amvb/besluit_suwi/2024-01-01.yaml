    text: |-
      aan Onze Minister van Economische Zaken, de gegevens die noodzakelijk
      zijn voor de uitvoering van de S&O-afdrachtvermindering, bedoeld in
      [hoofdstuk VIII van de Wet vermindering afdracht loonbelasting en premie voor de volksverzekeringen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007746#HoofdstukVIII
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.9
    references:
