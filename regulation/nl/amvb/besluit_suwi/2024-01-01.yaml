      van gemeentelijke belastingen, bedoeld in [artikel 255 van de Gemeentewet][ref1], en aan de dagelijkse besturen van
      de waterschappen de gegevens die noodzakelijk zijn voor het verlenen van kwijtschelding van waterschapsbelastingen,
      bedoeld in [artikel 144 van de Waterschapswet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel255
      [ref2]: https://wetten.overheid.nl/BWBR0005108#Artikel144
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.9
