    text: de wijze waarop de financiële betrokkenheid van werkgevers wordt geregeld.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel2.3
  - number: 2.3.3
    text: |-
      Het samenwerkingsverband stelt een marktbewerkingsplan op, waarin een beschrijving wordt gegeven
      van de kenmerken van de personen die behoren tot de doelgroep van arbeidsbeperkten als bedoeld in
      [artikel 38b van de Wet financiering sociale verzekeringen][ref1], in de regio, de mogelijkheden van die personen,
      waarin een analyse is opgenomen van de sectoren en bedrijven waar vacatures voor deze personen bestaan of kunnen
      worden gecreëerd en waarin de afspraken zijn opgenomen over de wijze van aanlevering en bemiddeling van die
      personen.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel38b
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: 38b
  - number: 2.3.4
    text: Het samenwerkingsverband draagt iedere twee jaar, te beginnen in 2016, zorg voor een evaluatie van de samenwerking.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel2.3
  - number: 2.3.5
    text: |-
      Bij ministeriële regeling kunnen tijdelijk nadere regels worden gesteld over de samenwerking, bedoeld in
      [artikel 10a van de Wet SUWI][ref1], waaronder in ieder geval over de wijze van samenwerking, gegevensuitwisseling
      en vergoeding van kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel10a
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 10a
  - number: 2.4.1
    text: |-
      De regionale samenwerking, bedoeld in [artikel 10 van de Wet SUWI][ref1], wordt uitgevoerd in door het UWV
      jaarlijks vast te stellen arbeidsmarktregio’s.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel10
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '10'
  - number: 2.4.2
    text: |-
      Bij ministeriële regeling wordt per arbeidsmarktregio een centrumgemeente vastgesteld die belast is met de regie op
      de regionale samenwerking en het beheer van de daarvoor beschikbaar gestelde financiële middelen.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel2.4
  - number: 2.5.1
    text: |-
      De colleges van burgemeester en wethouders en het UWV dragen zorg voor de inrichting van werkgeversdienstverlening
      in het werkgeversservicepunt als bedoeld in [artikel 2.3, tweede lid, onderdeel g][ref1], in de arbeidsmarktregio.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel2
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel2.5
    references:
