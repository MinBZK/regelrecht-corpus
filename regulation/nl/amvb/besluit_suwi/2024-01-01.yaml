    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel2.6
  - number: 2.6.4
    text: |-
      De colleges van burgemeester en wethouders in de arbeidsmarktregio en het UWV evalueren jaarlijks de uitvoering
      van het gezamenlijke uitvoeringsplan, bedoeld in het derde lid, inclusief de uitkomsten op het gebied van
      werkgeverstevredenheid op basis van een periodieke meting in die arbeidsmarktregio.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel2.6
  - number: 2.6.5
    text: |-
      De colleges van burgemeester en wethouders en het UWV maken afspraken over de wijze waarop vacatures en gegevens
      van werkzoekenden op het werkgeversservicepunt beschikbaar worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel2.6
  - number: 2.6.6
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld voor de naamgeving van het gezamenlijk aanspreekpunt,
      bedoeld in [artikel 2.5, derde lid][ref1] en de verslaglegging over de resultaten, bedoeld in het derde lid,
      onderdeel c.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel2
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel2.6
    references:
