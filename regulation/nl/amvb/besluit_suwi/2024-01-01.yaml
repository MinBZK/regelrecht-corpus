      of krachtens een onderwijswet aan hen opgedragen taken, alsmede aan Onze Minister de gegevens die noodzakelijk zijn
      voor de uitvoering van de [Wet inburgering][ref1] en de [Wet inburgering 2021][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0020611
      [ref2]: https://wetten.overheid.nl/BWBR0044770
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0020611
      - id: ref2
        bwb_id: BWBR0044770
  - number: 5.7.d
    text: |-
      aan de Pensioen- en Uitkeringsraad, bedoeld in de
      [Wet uitvoering wetten voor verzetsdeelnemers en oorlogsgetroffenen][ref1], de gegevens die noodzakelijk zijn voor
      de uitvoering van die wet;


      [ref1]: https://wetten.overheid.nl/BWBR0027660
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0027660
