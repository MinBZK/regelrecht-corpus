  - number: 2.5.3
    text: |-
      Voor het bieden van de dienstverlening aan werkgevers richten de bestuursorganen, bedoeld in het eerste lid, binnen
      de arbeidsmarktregio één gezamenlijk aanspreekpunt in.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel2.5
  - number: 2.6.1
    text: De werkgeversdienstverlening vindt plaats in de arbeidsmarktregio.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel2.6
  - number: 2.6.2
    text: |-
      De centrumgemeente treedt op als regievoerder voor de regionale samenwerking in de arbeidsmarktregio, bedoeld in
      [artikel 2.5][ref1], tenzij de colleges van burgemeester en wethouders van gemeenten binnen de arbeidsmarktregio
      een andere gemeente aanwijzen als regievoerder voor de werkgeversdienstverlening.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel2
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.6.3
    text: |-
      De colleges van burgemeester en wethouders in de arbeidsmarktregio en het UWV stellen jaarlijks één gezamenlijk
      uitvoeringsplan vast voor de uitvoering van de werkgeversdienstverlening in het werkgeversservicepunt in die
      arbeidsmarktregio. Dit uitvoeringsplan bevat in elk geval:
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel2.6
  - number: 2.6.3.a
    text: |-
      de wijze van organisatie van de dienstverlening, bedoeld in [artikel 2.5][ref1], waaronder het proces van
      dienstverlening;


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel2
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel2.6
