  - number: 2.1.1
    text: |-
      Onze Minister kan een besluit van het UWV of de SVB om andere werkzaamheden dan de in de [Wet SUWI][ref1] bedoelde
      taken uit te voeren uitsluitend goedkeuren, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0013060
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0013060
  - number: 2.1.1.a
    text: de goede uitvoering van de in die wet bedoelde taken daardoor niet in gevaar komt;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel2.1
  - number: 2.1.1.b
    text: de andere werkzaamheden in opdracht en voor rekening en risico van de opdrachtgever worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel2.1
  - number: 2.1.1.c
    text: |-
      de [Wet op het financieel toezicht][ref1] in acht wordt genomen voor zover deze van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: 2.1.1.d
    text: |-
      de uitvoering van die andere werkzaamheden gescheiden van de uitvoering van de wettelijke taken plaatsvindt, voor
      zover de andere werkzaamheid niet noodzaakt tot een gezamenlijke uitvoering.
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel2.1
  - number: 2.1.2
    text: |-
      Het UWV, onderscheidenlijk de SVB, meldt de werkzaamheden, bedoeld in
      [artikel 5, vierde lid, van de Wet SUWI][ref1], binnen een termijn van vier weken na aanvang van die werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel5
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel2.1
    references:
