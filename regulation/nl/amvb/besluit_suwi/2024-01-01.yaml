        bwb_id: BWBR0013060
        artikel: '10'
  - number: 2.3.2
    text: |-
      De afspraken, bedoeld in het eerste lid, voor zover daarover geen regels zijn gesteld bij ministeriële regeling als
      bedoeld in het vijfde lid, zien in ieder geval op:
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel2.3
  - number: 2.3.2.a
    text: |-
      de samenwerkingsvorm en inrichting van het samenwerkingsverband, waarbij ten minste aandacht wordt besteed aan
      de inrichting van het bestuur, de regeling van het voorzitterschap, en de taken en verantwoordelijkheden van alle
      betrokkenen;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel2.3
  - number: 2.3.2.b
    text: de wijze waarop de betrokken colleges van burgemeester en wethouders het voorzitterschap van het bestuur verzorgen;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel2.3
  - number: 2.3.2.c
    text: |-
      de wijze waarop de regionale uitvoering van de gemaakte afspraken wordt geregeld en de wijze waarop wordt
      aangesloten bij de bestaande regionale samenwerking;
    url: https://wetten.overheid.nl/BWBR0013267/2024-01-01#Artikel2.3
  - number: 2.3.2.d
    text: |-
      de wijze waarop wordt omgegaan met de afzonderlijke van toepassing zijnde verordeningen die door de
      afzonderlijke gemeenteraden zijn vastgesteld op grond van de [artikelen 6, tweede lid][ref1], [8a][ref2] en
      [47 van de Participatiewet][ref3];


