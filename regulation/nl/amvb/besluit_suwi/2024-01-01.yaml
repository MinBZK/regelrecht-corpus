      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel30a
      [ref4]: https://wetten.overheid.nl/BWBR0015703#Artikel7
