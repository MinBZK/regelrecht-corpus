  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordrachten van de Staatssecretaris van Volksgezondheid, Welzijn en Sport van 18 september 2003, kenmerk
    DJB/JZ-2408602, van 13 mei 2004, kenmerk DJB/JZ-481048, van 18 september 2003, kenmerk DJB/JZ-2409926, van 18
    september 2003, kenmerk DJB/JZ-2408604, van 18 september 2003, kenmerk DJB/JZ-2408605, van 13 november 2003,
    kenmerk DJB/JZ-2422233 en van 6 mei 2004, kenmerk DJB/JZ-2481049, gedaan mede namens Onze Minister van Justitie;

    Gelet op artikel 3, eerste en vijfde, achtste en negende lid, artikel 5, tweede lid, onder b, artikel 6, vijfde
    lid, artikel 13, zevende lid, artikel 38, vijfde lid, en artikel 57, derde lid, de artikelen 69, eerste en tweede
    lid, 70, tweede lid, 71, eerste lid, onder e, en 112, derde lid, van de Wet op de jeugdzorg, artikel 9b, tweede
    en vijfde lid van de Algemene Wet Bijzondere Ziektekosten, artikel 11a, eerste lid, derde en vierde volzin, van
    de Beginselenwet justitiële jeugdinrichtingen, artikel 238, vijfde lid, van boek 1 van het Burgerlijk Wetboek en
    artikel 77ff, tweede lid, van het Wetboek van Strafrecht;

    De Raad van State gehoord (adviezen van 24 november 2003, nr. W13.03.0399/III, van 30 augustus 2004, nr.
    W13.04.0213/III, van 24 november 2004, nr. W13.03.0396/III, van 24 november 2003, nr. W13.03.0398/III, van
    24 november 2003, nr. W13.03.0397/III, van 19 december 2003, nr. W13.03.0476/III en van 3 augustus 2004, nr.
    W13.04.0210/III);

    Gezien het nader rapport van de Staatssecretaris van Volksgezondheid, Welzijn en Sport van 14 december 2004, DJB/
    JZ-2537954, uitgebracht mede namens Onze Minister van Justitie;

    Hebben goedgevonden en verstaan:
