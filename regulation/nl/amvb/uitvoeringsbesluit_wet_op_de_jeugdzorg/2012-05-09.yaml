      Als categorieën van instanties als bedoeld in [artikel 2b, eerste lid, onder a, van de wet][ref1] in het domein
      jeugdzorg worden aangewezen:

      a. bureaus jeugdzorg als bedoeld in [artikel 4 van de wet][ref2];

      b. instanties die voor de stichting taken als bedoeld in
      [artikel 10, eerste lid, onder a, b, c of d, van de wet][ref3] uitoefenen;

      c. instanties die, daartoe aanvaard door de Minister van Justitie als rechtspersoon, bedoeld in de
      [artikelen 254, tweede lid][ref4], en [302, tweede lid, van Boek 1 van het Burgerlijk Wetboek][ref5], de voogdij of
      de voorlopige voogdij uitoefenen met betrekking tot minderjarige vreemdelingen.


