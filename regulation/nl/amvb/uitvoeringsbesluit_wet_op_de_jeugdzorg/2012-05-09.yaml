  - number: '5'
    text: |-
      1 Observatiediagnostiek omvat het onderzoeken van een jeugdige gericht op het verkrijgen van gegevens die een
      stichting nodig heeft voor het nemen van een indicatiebesluit.

      2 Geen aanspraak op observatiediagnostiek bestaat als aannemelijk is dat een jeugdige is aangewezen op zorg als
      bedoeld in [artikel 5, tweede lid, onder b, van de wet][ref1].

      3 Aanspraak op observatiediagnostiek bestaat slechts indien voor het verkrijgen van de gegevens, bedoeld in het
      eerste lid, observatie tijdens verblijf gedurende het etmaal of een deel daarvan noodzakelijk is.

      4 Aanspraak op observatiediagnostiek bestaat voor een termijn van ten hoogste zes weken. De aanspraak kan eenmaal
      met ten hoogste zes weken worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel5
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '5'
  - number: '6'
    text: |-
      1 Bij regeling van Onze Ministers kunnen nadere regels worden gesteld over de omvang van en de voorwaarden
      waaronder aanspraak op jeugdhulp, verblijf of observatiediagnostiek bestaat.

      2 Een regeling als bedoeld in het eerste lid, vervalt drie jaar na haar inwerkingtreding.
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel6
  - number: '7'
    text: |-
      Als categorie niet rechtmatig in Nederland verblijvende vreemdelingen tot wie de aanspraken ingevolge de
      [wet][ref1] worden uitgebreid, wordt aangemerkt de categorie vreemdelingen die geen rechtmatig verblijf in
      Nederland hebben en die de leeftijd van achttien jaren nog niet hebben bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0016637
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0016637
  - number: '8'
    text: |-
      1 Een vreemdeling als bedoeld in [artikel 7][ref1], heeft, aanspraak op jeugdhulp, verblijf en
      observatiediagnostiek.

      2 Deze vreemdeling heeft geen aanspraak op verblijf bij een pleegouder tenzij verblijf bij een pleegouder in het
      belang van de ontwikkeling van die vreemdeling geboden is. Indien een stichting voor een vreemdeling verblijf bij
      een pleegouder geboden acht, wordt in het indicatiebesluit aangegeven waarom zij verblijf in een accommodatie van
      een zorgaanbieder niet aangewezen acht.


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel7
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0017751
        artikel: '7'
        hoofdstuk: '3'
  - number: '9'
    text: |-
      Als vormen van zorg als bedoeld in [artikel 5, tweede lid, onder b, van de wet][ref1] worden, voor zover deze zorg
      of het verblijf betrekking heeft op een jeugdige en verband houdt met een psychiatrische aandoening, aangewezen:

      a. persoonlijke verzorging, begeleiding, verblijf, kortdurend verblijf en voortgezet verblijf
      als bedoeld in de [artikelen 4][ref2], [6][ref3], [9][ref4], [artikel 9a][ref5], [10][ref6] en
      [13, tweede lid, van het Besluit zorgaanspraken AWBZ][ref7];

      b. geneeskundige zorg en verblijf als bedoeld in de [artikelen 2.4][ref8]en
      [2.10 van het Besluit zorgverzekering][ref9].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel5
