  - number: '25'
    text: |-
      1 Medewerkers die zijn belast met de uitvoering van de taken, bedoeld in [artikel 5, eerste lid, van de wet][ref1],
      voogdijwerkers, gezinsvoogdijwerkers, jeugdreclasseringswerkers en medewerkers die taken uitvoeren van een
      advies- en meldpunt kindermishandeling, alsmede medewerkers die belast zijn met de uitvoering van de taken,
      bedoeld in [artikel 10, eerste lid, onder f tot en met j, van de wet][ref2], zijn werkzaam op basis van een
      arbeidsovereenkomst met de stichting of op basis van een detacheringsovereenkomst tussen hun werkgever en de
      stichting.

      2 In afwijking van het eerste lid, kan een medewerker anders dan op basis van een arbeidsovereenkomst of
      detacheringsovereenkomst bij de stichting werkzaam zijn:

      a. indien hij zodanig gespecialiseerd is dat een arbeidsovereenkomst of een detacheringsovereenkomst een doelmatige
      werkwijze van de stichting belemmert;

      b. ten behoeve van een tijdelijke functievervulling.

      3 Bij regeling van Onze Ministers kunnen regels worden gesteld ten aanzien van de detacheringsovereenkomst, bedoeld
      in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel10
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel25
    references:
      - id: ref1
