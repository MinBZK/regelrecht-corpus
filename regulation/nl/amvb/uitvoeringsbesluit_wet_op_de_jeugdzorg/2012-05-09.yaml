  - number: '47'
    text: |-
      1 De stichting wijst binnen vijf dagen nadat zij een taak, bedoeld in
      [artikel 10, eerste lid, onder c of d van de wet][ref1] heeft gekregen en zij daarvan op de hoogte is gesteld, een
      jeugdreclasseringswerker aan, en doet hiervan mededeling aan de jeugdige en de met het gezag belaste ouder, voogd
      of anderen die de jeugdige als behorend tot hun gezin verzorgen en opvoeden.

      2 In deze mededeling wordt tevens opgenomen:

      a. de datum van het eerste contact van de jeugdige met de jeugdreclasseringswerker dat uiterlijk vijf dagen nadat
      de stichting de taak als bedoeld in eerste lid heeft gekregen, plaats vindt en

      b. de medewerker die de jeugdreclasseringswerker bij afwezigheid vervangt.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel10
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '10'
  - number: '48'
    text: |-
      1 Onverminderd de aan de raad voor de kinderbescherming toekomende taken en bevoegdheden, voldoet de
      jeugdreclassering aan verzoeken van de rechter en het openbaar ministerie om advies omtrent een jeugdige die wordt
      verdacht van een strafbaar feit of die op grond daarvan is veroordeeld.

      2 De jeugdreclassering brengt voor zover het de uitvoering betreft van de taak, bedoeld in
      [artikel 10, eerste lid, onder c en d][ref1], geregeld verslag uit aan het openbaar ministerie dat is belast met
      het toezicht op de naleving van de voorwaarden, over de wijze waarop de jeugdige zich houdt aan de voorwaarden door
      de rechter of het openbaar ministerie opgelegd.

      3 Indien de jeugdige een opgelegde voorwaarde niet of niet geheel nakomt, meldt de jeugdreclassering dit onverwijld
      aan het openbaar ministerie.

      4 De jeugdreclassering zendt de raad voor de kinderbescherming een afschrift van het verslag, bedoeld in het tweede
      lid en de melding, bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel10
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '10'
  - number: '49'
    text: |-
      1 Onverminderd [artikel 60, vierde lid][ref1], legt de stichting de wijze van samenwerking van de jeugdreclassering
      met de politie, de rechter, het openbaar ministerie, de volwassenenreclassering, inrichtingen en de raad voor de
      kinderbescherming vast in een protocol.

      2 In het protocol wordt in ieder geval vastgelegd:

      a. een vermelding van welke functionaris het aanspreekpunt is van de jeugdreclassering voor vragen die casuïstiek
      overstijgen;

      b. een beschrijving van de wijze waarop taken van de jeugdreclassering en die van de in het eerste lid bedoelde
      instanties worden uitgeoefend voor zover deze samenhangen of gelijktijdig plaatsvinden;

      c. de wijze waarop en de termijn waarbinnen de instanties, bedoeld in het eerste lid, over individuele zaken worden
      geïnformeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel60
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel49
    references:
