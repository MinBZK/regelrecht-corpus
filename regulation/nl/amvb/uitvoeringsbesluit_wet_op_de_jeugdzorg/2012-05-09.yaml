    text: |-
      1 Indien een meldingsbevoegde een jeugdige die niet beschikt over een burgerservicenummer meldt aan de
      verwijsindex, biedt hij daartoe de volgende gegevens van de jeugdige aan in de verwijsindex:

      a. de familienaam;

      b. de geboortedatum;

      c. het geslacht.

      2 De gegevens, bedoeld in het eerste lid, worden in de verwijsindex omgezet in een verwijsindexservicenummer, dat
      vervolgens gebruikt wordt voor de melding in de verwijsindex.
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel1l
  - number: '2'
    text: |-
      De aanspraak op jeugdzorg ingevolge de [wet][ref1] omvat: jeugdhulp, verblijf en observatiediagnostiek.


      [ref1]: https://wetten.overheid.nl/BWBR0016637
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0016637
  - number: '3'
    text: |-
      1 Jeugdhulp omvat behandeling of begeleiding van een:

      a. jeugdige, gericht op het oplossen, verminderen of voorkomen van verergering dan wel het omgaan met de gevolgen
      van zijn psychosociale, psychische of gedragsproblemen;

      b. cliënt, niet zijnde een jeugdige, gericht op het verkrijgen van zodanige vaardigheden dat hij aan de onder a
      bedoelde psychosociale, psychische of gedragsproblemen in het gezin het hoofd kan bieden.

      2 Geen aanspraak bestaat op jeugdhulp voor zover:

      a. de jeugdige of zijn ouders, stiefouder, of anderen die hem als behorende tot hun gezin verzorgen en opvoeden de
      psychosociale, psychische of gedragsproblemen van die jeugdige het hoofd kunnen bieden, al dan niet met behulp van
      personen uit hun directe omgeving of met behulp van andere voorzieningen die hulp bieden dan zorgaanbieders of

      b. de psychosociale, psychische of gedragsproblemen hun oorzaak vinden of mede vinden in een psychiatrische
      aandoening van een jeugdige die zodanig van aard is dat een psychiatrische aanpak van de problemen noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel3
  - number: '4'
    text: |-
      1 Verblijf omvat het aan een jeugdige gedurende het etmaal of een deel daarvan bieden van verblijf met een passend
      pedagogisch klimaat bij een pleegouder of in een accommodatie van een zorgaanbieder.

      2 Geen aanspraak bestaat op verblijf voor zover:

      a. de jeugdige geen psychosociale, psychische of gedragsproblemen heeft, dan wel de jeugdige of zijn ouders,
      stiefouder, of anderen die hem als behorende tot hun gezin verzorgen en opvoeden, de psychosociale, psychische
      of gedragsproblemen van die jeugdige het hoofd kunnen bieden, al dan niet met jeugdhulp als bedoeld in
      [artikel 3][ref1], met behulp van personen uit hun directe omgeving of met behulp van andere voorzieningen die hulp
      bieden dan zorgaanbieders,

      b. het verblijf noodzakelijk is voor persoonlijke verzorging, begeleiding of behandeling als
      bedoeld in [artikel 2, eerste lid, van het Besluit zorgaanspraken AWBZ][ref2] of zorg als bedoeld in
      [artikel 2.4 van het Besluit zorgverzekering][ref3] in verband met een verstandelijke, lichamelijke of zintuiglijke
      handicap, dan wel een psychiatrische of somatische aandoening of beperking of

      c. het verblijf in een justitiële jeugdinrichting als bedoeld in
      [artikel 1, onder b, van de Beginselenwet justitiële jeugdinrichtingen][ref4] betreft.

      3 In afwijking van het tweede lid, onder a, bestaat aanspraak op verblijf:

      a. indien het een minderjarige betreft die onder voogdij van een stichting staat;

      b. als door verblijf bij een pleegouder het hoofd kan worden geboden aan de psychosociale, psychische of
      gedragsproblemen van de jeugdige.

      4 Aanspraak op verblijf gedurende een deel van het etmaal bestaat slechts indien dit noodzakelijk is voor het tot
      gelding brengen van een aanspraak op jeugdhulp als bedoeld in [artikel 3][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0014149#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0018492#Artikel2.4
      [ref4]: https://wetten.overheid.nl/BWBR0011756#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0017751#Artikel3
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel4
