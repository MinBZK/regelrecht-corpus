      1 Als categorieën van instanties als bedoeld in [artikel 2b, eerste lid, onder a, van de wet][ref1] in het domein
      onderwijs worden aangewezen:

      a. scholen als bedoeld in [artikel 1 van de Wet op het primair onderwijs][ref2];

      b. scholen als bedoeld in [artikel 1 van de Wet op de expertisecentra][ref3];

      c. scholen als bedoeld in [artikel 1 van de Wet op het voortgezet onderwijs][ref4];

      d. instellingen als bedoeld in [artikel 1.1.1, onderdeel b, van de Wet educatie en beroepsonderwijs][ref5];

      e. instellingen voor hoger onderwijs als bedoeld in
      [artikel 1.2, onder a of b, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref6];

      f. contactgemeenten als bedoeld in [artikel 162b, derde lid, van de Wet op de expertisecentra][ref7],
      [artikel 118h, derde lid, van de Wet op het voortgezet onderwijs][ref8] en
      [artikel 8.3.2, derde lid, van de Wet educatie en beroepsonderwijs][ref9] ten behoeve van de regionale meld- en
      coördinatiefunctie.

      2 Als categorie van functionarissen als bedoeld in [artikel 2b, tweede lid, onder a, van de wet][ref10] in het
      domein onderwijs worden ambtenaren als bedoeld in [artikel 16 van de Leerplichtwet 1969][ref11] aangewezen.


