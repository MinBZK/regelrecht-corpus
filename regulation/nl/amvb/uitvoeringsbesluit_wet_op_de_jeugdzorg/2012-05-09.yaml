  - number: '61'
    text: |-
      1 Op een door Onze Minister van Justitie aanvaarde rechtspersoon, bedoeld in de [artikelen 254, tweede lid][ref1],
      en [302, tweede lid, van Boek 1 van het Burgerlijk Wetboek][ref2] zijn de [artikelen 26][ref3], [27][ref4],
      [29, eerste lid, onder b en h][ref5], en [38 tot en met 45][ref6] van overeenkomstige toepassing, met dien
      verstande dat de wijze van uitvoering van de taken door de rechtspersoon past bij de aard van het verblijf van de
      minderjarige en zijn verwachte verblijfsduur.

      2 De rechtspersoon, bedoeld in het eerste lid, die de voogdij uitoefent over een minderjarige zorgt dat die
      minderjarige wordt ondergebracht:

      a. bij meerderjarige familieleden;

      b. in een pleeggezin;

      c. in speciale centra voor minderjarigen, of

      d. in andere voor minderjarige geschikte tehuizen.

      Voorzover mogelijk is de verblijfplaats van de minderjarige dezelfde als die van zijn broers of zussen.
      Veranderingen in de verblijfplaats van de minderjarige worden tot het strikt noodzakelijke minimum beperkt.


