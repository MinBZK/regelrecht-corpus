  - number: '22'
    text: |-
      Indien de stichting vaststelt dat een jeugdige is aangewezen op verblijf in een inrichting geeft zij in het
      indicatiebesluit aan of sprake moet zijn van verblijf in een beperkt beveiligde of normaal beveiligde inrichting
      als bedoeld in [artikel 14, eerste lid, van de Beginselenwet justitiële jeugdinrichtingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel14
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '14'
  - number: '23'
    text: |-
      1 De in het indicatiebesluit vast te leggen termijn gedurende welke de aanspraak geldt, bedraagt ten hoogste een
      jaar na de datum waarop de zorg waarin het indicatiebesluit voorziet, is aangevangen, tenzij het betreft:

      a. verblijf bij een pleegouder van een jeugdige die al langer dan twee jaar bij eenzelfde pleegouder verblijft en
      voorzien wordt dat van terugkeer naar het gezin van herkomst geen sprake kan zijn;

      b. een aanspraak op een vorm van zorg als bedoeld in [artikel 5, tweede lid, onder b, van de wet][ref1] in verband
      met een aandoening die maakt dat een jeugdige langer dan twee jaar is aangewezen op eenzelfde vorm van zorg en
      voorzien wordt dat de jeugdige op deze vorm van zorg aangewezen blijft.

      2 De in het eerste lid bedoelde termijn is met betrekking tot rechtmatig in
      Nederland verblijvende vreemdelingen wier verblijf tijdelijk is als bedoeld in
      [artikel 3.5, tweede lid, aanhef en onder q, van het Vreemdelingenbesluit 2000][ref2], ten hoogste een half jaar.

      3 De in het eerste lid bedoelde termijn is met betrekking tot vreemdelingen, bedoeld in [artikel 7][ref3], in
      overeenstemming met de verwachte duur van het verblijf in Nederland, en ten hoogste een half jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3.5
      [ref3]: https://wetten.overheid.nl/BWBR0017751#Artikel7
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel23
