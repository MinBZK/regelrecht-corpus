  - number: 55b
    text: |-
      Indien de klager daarom verzoekt, wordt de klacht ter kennis gebracht van één lid van de klachtencommissie teneinde
      terzake te bemiddelen.
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel55b
  - number: 55c
    text: |-
      1 De klager kan zich doen bijstaan door een vertrouwenspersoon.

      2 Indien de klager de Nederlandse taal onvoldoende beheerst, draagt de voorzitter van de klachtencommissie zorg
      voor de bijstand van een tolk.
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel55c
  - number: 55d
    text: |-
      Van de klachtencommissie maken in ieder geval deel uit:

      a. een jurist,

      b. een gekwalificeerde gedragswetenschapper, alsmede

      c. een arts, indien het een klacht betreft tegen een geneeskundige behandelingsmethode als bedoeld in
      [artikel 29p, derde lid, van de wet][ref1], niet zijnde een behandeling van een stoornis van de geestvermogens
      of een psychiater, indien het een klacht betreft tegen een geneeskundige behandelingsmethode als bedoeld
      in [artikel 29p, derde lid, van de wet][ref2] indien het gaat om een behandeling van een stoornis van de
      geestvermogens.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel29p
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel29p
