        artikel: 73e
        hoofdstuk: 13a
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '5'
  - number: 73c
    text: |-
      1 Onze Ministers stellen het bedrag voor de uitvoering van de jeugdbeschermings- en reclasseringstaken, als volgt
      vast:

      a. de voorlopige vaststelling door vermenigvuldiging van het aantal minderjarigen voor wie de stichting in
      het tweede jaar voorafgaand aan het jaar waarvoor de uitkering wordt verstrekt, de jeugdbeschermings- en
      reclasseringstaken heeft uitgevoerd, met de vastgestelde normbedragen, en

      b. de definitieve vaststelling door vermenigvuldiging van het aantal minderjarigen voor wie de stichting in
      het eerste jaar, voorafgaand aan het jaar waarvoor de uitkering wordt verstrekt, de jeugdbeschermings- en
      reclasseringstaken heeft uitgevoerd, met de vastgestelde normbedragen.

      2 Het aantal minderjarigen, bedoeld in het eerste lid, is het gemiddelde van het aantal minderjarigen op de
      eerste dag van elke kalendermaand met uitsluiting van het aantal minderjarigen voor wie een persoon in dienst
      van een landelijke instelling als bedoeld in [artikel 104, eerste lid, van de wet][ref1], de taak uitoefent, met
      uitzondering van de taken als bedoeld in [artikel 10, eerste lid, onder c en d, van de wet][ref2], waarvoor de
      regeling waarbij het normbedrag of de normbedragen worden vastgesteld anders bepaalt.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel104
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel10
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel73c
    references:
