  - number: '72'
    text: |-
      1 De hoogte van de eigen bijdrage in de kosten van verblijf gedurende het etmaal van een jeugdige die over een
      inkomen beschikt of die recht kan doen gelden op een inkomen, wordt vastgesteld op een bedrag gelijk aan het netto-
      maandinkomen, verminderd met eenvierde van het minimumloon dat geldt voor een vijftienjarige of indien de jeugdige
      zestien jaar of ouder is, het voor die leeftijd geldende minimumloon.

      2 De eigen bijdrage berekend volgens het eerste lid, wordt voor een jeugdige met een netto jaarinkomen uit
      tegenwoordige arbeid verminderd met een vierde van deze bijdrage. Indien het inkomen uit tegenwoordige arbeid
      minder is dan € 635,29 op jaarbasis wordt deze bijdrage verminderd met dat inkomen.

      3 Indien het inkomen, bedoeld in het eerste lid betrekking heeft op een uitkering ingevolge de
      [Wet studiefinanciering 2000][ref1], wordt de bijdrage verminderd met:

      a. het deel van de uitkering dat volgens de normen van het Ministerie van Onderwijs, Cultuur en Wetenschappen
      bedoeld is voor boeken, leermiddelen of onderwijsbijdrage, en

      b. de te betalen premie voor een door of ten behoeve van de jeugdige gesloten zorgverzekering als bedoeld in
      [artikel 1, onderdeel d, van de Zorgverzekeringswet][ref2].

      4 De eigen bijdrage is niet hoger dan de kosten van het verblijf.


      [ref1]: https://wetten.overheid.nl/BWBR0011453
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel1
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0011453
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '1'
  - number: '73'
    text: |-
      1 De ouderbijdrage of eigen bijdrage is verschuldigd over elke dag dat het verblijf heeft geduurd. De dag van
      aankomst wordt daarbij wel en de dag van vertrek wordt daarbij niet meegerekend als dag van verblijf. Wordt het
      verblijf beëindigd op de dag waarop deze is aangevangen, dan is over deze dag de bijdrage verschuldigd.

      2 Indien de bijdrage over een gedeelte van een maand is verschuldigd, bedraagt zij het voor een maand geldende
      bedrag, gedeeld door dertig en vermenigvuldigd met het aantal dagen dat het verblijf heeft geduurd.
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel73
  - number: 73a
    text: |-
      In dit hoofdstuk wordt verstaan onder:

      1. uitkering bureau jeugdzorg: de uitkering, bedoeld in [artikel 37, eerste lid, onder a, van de wet][ref1];

      2. uitkering zorgaanbod: de uitkering, bedoeld in [artikel 37, eerste lid, onder b, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel37
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel73a
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '37'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '37'
  - number: 73b
    text: |-
      1 De uitkering bureau jeugdzorg bestaat uit de som van de volgende bedragen:

      a. een bedrag voor de uitvoering van de jeugdbeschermings- en reclasseringstaken, op basis van het aantal
      minderjarigen voor wie de stichting deze taken heeft uitgevoerd in het jaar voorafgaand aan het jaar waarvoor de
      uitkering wordt verstrekt en de daartoe vastgestelde normbedragen, en

      b. een bedrag voor de uitvoering van de overige wettelijke taken, dat overeenkomt met het verschil tussen
      het bedrag dat de provinciebesturen ontvingen in het jaar voorafgaande aan het jaar waarin de uitkering
      wordt verstrekt en het bedrag bedoeld in [artikel 73e][ref1], vermeerderd met een door Onze Ministers
      vast te stellen bedrag, dat is gerelateerd aan de uitvoering door de stichting van de taak, bedoeld in
      [artikel 5, tweede lid, onder b, van de wet][ref2], en de uitvoering door de stichting van de taak, bedoeld in
      artikel 5 van de wet.

      2 De normbedragen, bedoeld in het eerste lid, onder a, worden per onderscheiden taak vastgesteld bij regeling van
      Onze Ministers.


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel73e
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel5
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel73b
    references:
      - id: ref1
