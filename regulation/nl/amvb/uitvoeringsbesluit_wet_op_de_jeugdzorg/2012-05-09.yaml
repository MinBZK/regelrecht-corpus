        artikel: '5'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '10'
  - number: '26'
    text: |-
      1 De stichting is zeven maal vierentwintig uur per week telefonisch bereikbaar.

      2 De stichting is zeven maal vierentwintig uur per week beschikbaar voor situaties waarin
      onmiddellijke uitvoering van de taken, bedoeld in [artikel 3, vijfde lid][ref1], of
      [artikel 10, eerste lid, onder a tot en met f, van de wet][ref2], geboden is.


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel10
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0017751
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '10'
  - number: '27'
    text: |-
      1 De stichting informeert de cliënt over de taken en werkwijze van het bureau jeugdzorg en over zijn rechten. De
      informatie wordt in begrijpelijke vorm verschaft.

      2 De stichting maakt de cliënt duidelijk welke taak het bureau jeugdzorg ten aanzien van hem uitoefent.
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel27
  - number: '28'
    text: |-
      De stichting stuurt, onverminderd [artikel 51 van de wet][ref1], aan de huisarts van de cliënt een afschrift van
      het indicatiebesluit of het document waarin de zorg, bedoeld in [artikel 8, van de wet][ref2], is vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel8
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '51'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '8'
  - number: '29'
    text: |-
      1 Ten behoeve van een verantwoorde uitvoering door de stichting van de aan haar bij de wet opgedragen taken,
      beschikt de stichting over deskundigheid met betrekking tot:

      a. de beoordeling en aanpak van psychosociale, psychische of gedragsproblemen, dan wel een psychiatrische
      aandoening van jeugdigen;

      b. de beoordeling en aanpak van opvoedingssituaties die het onbedreigd opgroeien van jeugdigen kunnen belemmeren;

      c. de herkenning van taal- en leerproblemen;

      d. de herkenning van somatische aandoeningen;

      e. de herkenning van lichamelijke of verstandelijke handicaps;

      f. de beoordeling en aanpak van kindermishandeling;

      g. de aanpak van jeugdige delinquenten;

      h. de juridische aspecten van de haar opgedragen taken.

      2 De stichting heeft kennis van het aanbod van zorg.

      3 Bij regeling van Onze Ministers kunnen regels worden gesteld over de opleidings- of deskundigheidseisen van
      medewerkers van de stichting, van beroepskrachten werkzaam bij de stichting alsmede van de deskundigen, bedoeld
      in [artikel 35][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel35
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0017751
        artikel: '35'
        hoofdstuk: '9'
        paragraaf: '3'
  - number: '30'
    text: |-
      1 Ter uitvoering van de taak, bedoeld in [artikel 5, eerste lid, van de wet][ref1], beziet de stichting
      de problemen van een cliënt en de ernst hiervan. Zij onderzoekt hiertoe de psychosociale, psychische of
      gedragsproblemen, dan wel de psychiatrische aandoening van de jeugdige, de problemen van de cliënt, niet zijnde
      de jeugdige, die het onbedreigd opgroeien van de jeugdige belemmeren, en besteedt bovendien aandacht aan de
      opvoedingssituatie.

      2 De stichting betrekt in haar onderzoek tevens factoren die de ontwikkeling van de jeugdige gunstig beïnvloeden of
      kunnen beïnvloeden.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel5
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '5'
  - number: '31'
    text: |-
      De stichting beziet hoe de problemen met inzet van jeugdzorg of andere zorg kunnen worden opgelost, verminderd,
      of hoe verergering kan worden voorkomen dan wel op welke wijze de cliënt kan leren omgaan met de gevolgen van deze
      problemen.
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel31
  - number: '32'
    text: |-
      Bij de uitvoering van de taken, bedoeld in de [artikelen 5, eerste lid][ref1] en
      [10, eerste lid, onder a tot en met e, van de wet][ref2], vindt een multidisciplinaire beoordeling van de problemen
      plaats, indien de aard van de problematiek dit vergt.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel10
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '10'
  - number: '33'
    text: |-
      Bij regeling van Onze Ministers kunnen nadere regels worden gesteld omtrent de werkwijze van de stichting bij de
      uitvoering van de in de [artikelen 5, eerste lid][ref1], en [10, eerste lid, van de wet][ref2], genoemde taken
      indien het niveau van de uitvoering door de bureaus jeugdzorg dit vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel10
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '10'
  - number: '34'
    text: |-
      1 Het indicatiebesluit komt niet tot stand dan nadat over een ontwerp daarvan in ieder geval overleg is gepleegd
      met de aanvrager en met degene wiens instemming is vereist op grond van [artikel 7, van de wet][ref1].

      2 In een geval als bedoeld in [artikel 7, zesde lid, onder b, van de wet][ref2] neemt de stichting geen
      indicatiebesluit dan na overleg met het openbaar ministerie of de raad voor de kinderbescherming.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel7
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '7'
  - number: '35'
    text: |-
      De stichting kan, alvorens het indicatiebesluit te nemen, een ontwerp daarvan ter advisering aan een
      gekwalificeerde gedragswetenschapper voorleggen.
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel35
  - number: '36'
    text: |-
      1 De stichting laat op verzoek van de cliënt de, bij het opstellen van het indicatiebesluit gebruikte test-
      en onderzoeksgegevens van gedragsdeskundig of psychiatrisch onderzoek, door een deskundige interpreteren en
      van een advies voorzien, tenzij het belang van de jeugdige zich daartegen verzet. Deze deskundige heeft geen
      arbeidsovereenkomst met de stichting en is niet werkzaam bij de stichting op basis van een detacheringsovereenkomst
      en is evenmin bij de behandeling of begeleiding of bij onderzoek van de cliënt betrokken geweest.

      2 Uiterlijk veertien dagen nadat de deskundige zijn advies schriftelijk ter kennis heeft gebracht aan de cliënt en
      de stichting, neemt de stichting een indicatiebesluit.

      3 Indien het indicatiebesluit afwijkt van het advies van de deskundige, wordt in het besluit de reden van de
      afwijking vermeld.
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel36
  - number: '37'
    text: |-
      Indien de stichting ten aanzien van een jeugdige meer dan één van de jeugdbeschermings- en reclasseringstaken
      uitoefent, bevat het plan, bedoeld in [artikel 13, derde lid, van de wet][ref1], een beschrijving van de wijze
      waarop de uitvoering van de verschillende taken op elkaar worden afgestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel13
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '13'
  - number: '38'
    text: |-
      Onverminderd [artikel 10, eerste lid, onder i, van de wet][ref1] stelt de stichting bij beëindiging van de
      jeugdbeschermings- en reclasseringstaken ten aanzien van de jeugdige een rapport op waarin beschreven wordt op
      welke wijze zij haar taak heeft verricht. In het rapport wordt aangegeven of de jeugdige naar het oordeel van de
      stichting, behoefte heeft aan nazorg en op welke wijze hierin kan worden voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel10
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '10'
  - number: '39'
    text: |-
      Bij regeling van Onze Ministers kunnen regels worden gesteld over het verrichten of doen verrichten van een
      gedragsdeskundig of psychiatrisch diagnostisch onderzoek ter voorbereiding van een besluit in het kader van de
      uitvoering van de jeugdbeschermings- en reclasseringstaken, dat een rechterlijke beslissing vereist.
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel39
  - number: '40'
    text: |-
      1 De stichting stelt uiterlijk zes weken nadat de voogdij aan haar is opgedragen en zij hiervan in kennis is
      gesteld, een plan vast als bedoeld in [artikel 13, derde lid, van de wet][ref1].

      2 Het plan bevat in ieder geval:

      a. een beschrijving van de doelen die met de voogdij worden nagestreefd, zo nodig uitgesplitst in doelen op korte
      en lange termijn,

      b. de wijze waarop deze doelen worden nagestreefd,

      c. een beschrijving van de voorgenomen activiteiten met betrekking tot de minderjarige,

      d. een vermelding van de wijze waarop de ouders of anderen die de minderjarige als behorend tot hun gezin verzorgen
      en opvoeden, alsmede zijn sociale omgeving zullen worden betrokken bij de werkzaamheden, dan wel een vermelding van
      de redenen waarom dit niet zal gebeuren en

      e. een vermelding van de momenten waarop de voogdij geëvalueerd wordt.

      3 In het plan wordt tevens vermeld welke zorg voor de minderjarige dan wel anderen die de minderjarige als behorend
      tot hun gezin verzorgen en opvoeden nodig is, onder vermelding van de wijze waarop de doelen die met de voogdij
      worden nagestreefd, samenhangen met de doelen van de zorg.

      4 Het plan komt niet tot stand en wordt niet gewijzigd dan nadat daarover in ieder geval overleg is gepleegd met:

      a. de minderjarige, overeenkomstig zijn leeftijds- en ontwikkelingsniveau, en

      b. de ouders of anderen die de minderjarige als behorend tot hun gezin verzorgen en opvoeden, tenzij dit overleg
      kennelijk schade zal toebrengen aan de minderjarige.

      5 Van het overleg en de resultaten daarvan wordt melding gemaakt in het plan. Indien geen overleg mogelijk is,
      wordt hiervan met opgave van redenen melding gemaakt.

      6 Zo vaak als noodzakelijk, doch ten minste één maal per jaar wordt bezien in hoeverre het plan bijstelling
      behoeft.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel13
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '13'
  - number: '41'
    text: |-
      1 De stichting wijst binnen vijf dagen nadat de voogdij aan haar is opgedragen en zij hiervan in kennis is gesteld,
      een voogdijwerker aan, en doet hiervan mededeling aan de minderjarige en zijn ouders of anderen die de minderjarige
      als behorend tot hun gezin verzorgen en opvoeden.

      2 In deze mededeling worden tevens opgenomen:

      a. de datum van het eerste contact van de voogdijwerker met de minderjarige en

      b. de medewerker van de stichting die de voogdijwerker bij afwezigheid vervangt.
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel41
  - number: '42'
    text: |-
      1 De stichting houdt zich op de hoogte van de ontwikkeling van de minderjarige die onder haar voogdij staat, de aan
      hem bestede zorg en diens vermogen.

      2 Het contact tussen de minderjarige en zijn oorspronkelijk milieu wordt bevorderd, tenzij dit contact kennelijk
      schade zal toebrengen aan de minderjarige.

      3 De stichting bevordert dat de minderjarige persoonlijk contact heeft met een persoon buiten de stichting en dat
      dit contact gecontinueerd wordt.

      4 De stichting houdt rekening met het belang dat voor de minderjarige kan zijn gelegen in een overgang van het
      gezag naar de ouders dan wel, indien het belang van de minderjarige dit eist, naar een pleegouder of een ander die
      in nauwe persoonlijke betrekking staat tot de minderjarige.
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel42
  - number: '43'
    text: |-
      1 De stichting stelt uiterlijk zes weken nadat de minderjarige onder haar toezicht is gesteld en zij hiervan in
      kennis is gesteld, een plan vast als bedoeld in [artikel 13, derde lid, van de wet][ref1].

      2 Het plan bevat in ieder geval:

      a. een beschrijving van de doelen die met de ondertoezichtstelling worden nagestreefd, zo nodig uitgesplitst in
      doelen op korte en lange termijn,

      b. de wijze waarop deze doelen worden nagestreefd,

      c. een beschrijving van de voorgenomen activiteiten met betrekking tot de minderjarige en de met het gezag belaste
      ouder of voogd,

      d. een vermelding van de wijze waarop de ouders of anderen die de minderjarige als behorend tot hun gezin verzorgen
      en opvoeden, alsmede zijn sociale omgeving zullen worden betrokken bij de werkzaamheden, dan wel een vermelding van
      de redenen waarom dit niet zal gebeuren en

      e. een vermelding van de momenten waarop de ondertoezichtstelling geëvalueerd wordt.

      3 In het plan wordt tevens vermeld welke zorg voor de minderjarige, voor de met het gezag belaste ouder, voogd of
      voor anderen die de minderjarige als behorend tot hun gezin verzorgen en opvoeden nodig is, onder vermelding van de
      wijze waarop de doelen die met de ondertoezichtstelling worden nagestreefd, samenhangen met de doelen van de zorg.

      4 Indien een minderjarige ten minste achttien maanden buiten het ouderlijke gezin is verzorgd en opgevoed, bevat
      het plan een beschrijving van de doelen van de ondertoezichtstelling op langere termijn waarbij aandacht wordt
      besteed aan de continuïteit van de verblijfplaats van de minderjarige.

      5 Het plan komt niet tot stand en wordt niet gewijzigd dan nadat daarover in ieder geval overleg is gepleegd met:

      a. de minderjarige, overeenkomstig zijn leeftijds- en ontwikkelingsniveau en

      b. de met het gezag belaste ouder, voogd of anderen die de minderjarige als behorend tot hun gezin verzorgen en
      opvoeden, tenzij dit overleg kennelijk schade zou toebrengen aan de minderjarige.

      6 Van het overleg en de resultaten daarvan wordt melding gemaakt in het plan. Indien geen overleg mogelijk is,
      wordt hiervan met opgave van redenen melding gemaakt.

      7 Zo vaak als noodzakelijk, doch ten minste één maal per jaar wordt bezien in hoeverre het plan bijstelling
      behoeft.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel13
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '13'
  - number: '44'
    text: |-
      1 De stichting wijst binnen vijf dagen nadat de minderjarige onder haar toezicht is gesteld en zij hiervan in
      kennis is gesteld, een gezinsvoogdijwerker aan, en doet hiervan mededeling aan de minderjarige en de met het gezag
      belaste ouder of voogd.

      2 In deze mededeling worden tevens opgenomen:

      a. de datum van het eerste contact van de gezinsvoogdijwerker met de minderjarige en de met het gezag belaste ouder
      of voogd,

      b. de medewerker van de stichting die de gezinsvoogdijwerker bij diens afwezigheid vervangt,

      c. informatie over de bevoegdheden van de stichting bij de uitoefening van de ondertoezichtstelling en

      d. de wijze waarop een verzoek als bedoeld in [artikel 259, eerste lid][ref1], [artikel 260, eerste lid][ref2], en
      [artikel 263, tweede lid, van Boek 1 van het Burgerlijk Wetboek][ref3] moet worden gedaan.

      3 De stichting kan, al dan niet op verzoek van de minderjarige, de met het gezag belaste ouder of voogd, een andere
      medewerker als gezinsvoogdijwerker aanwijzen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel259
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel260
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel263
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '259'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '260'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '263'
  - number: '45'
    text: |-
      De stichting beziet bij de uitoefening van de ondertoezichtstelling regelmatig of een ontheffing van de ouders als
      bedoeld in [artikel 268 van Boek 1 van het Burgerlijk Wetboek][ref1] overwogen moet worden. Zodra de stichting tot
      het oordeel komt dat een ontheffing overwogen dient te worden, stelt zij de raad voor de kinderbescherming hiervan
      in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel268
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '268'
  - number: '46'
    text: |-
      1 De stichting stelt uiterlijk zes weken nadat zij een taak, bedoeld in
      [artikel 10, eerste lid, onder c of d, van de wet][ref1] heeft gekregen en zij hiervan in kennis is gesteld, een
      plan vast als bedoeld in [artikel 13, derde lid, van de wet][ref2].

      2 Het plan bevat in ieder geval:

      a. een beschrijving van de doelen die met de jeugdreclassering worden nagestreefd , zo nodig uitgesplitst in doelen
      op korte en lange termijn,

      b. de wijze waarop deze doelen worden nagestreefd,

      c. een beschrijving van de voorgenomen activiteiten met betrekking tot de jeugdige,

      d. een vermelding van de wijze waarop de ouders, voogd of anderen die de jeugdige als behorend tot hun gezin
      verzorgen en opvoeden, alsmede zijn sociale omgeving zal worden betrokken bij de werkzaamheden, dan wel een
      vermelding van de redenen waarom dit niet zal gebeuren en

      e. een vermelding van de momenten waarop de wijze waarop de jeugdreclassering wordt uitgevoerd, geëvalueerd wordt.

      3 In het plan wordt tevens vermeld welke zorg voor de jeugdige, voor de met het gezag belaste ouder, voogd of voor
      anderen die de jeugdige als behorend tot hun gezin verzorgen en opvoeden nodig is, onder vermelding van de wijze
      waarop de doelen die met de jeugdreclassering worden nagestreefd, samenhangen met de doelen van de zorg.

      4 Het plan komt niet tot stand en wordt niet gewijzigd dan nadat daarover in ieder geval overleg is gepleegd met:

      a. de jeugdige;

      b. de ouders, voogd of anderen die de jeugdige als behorend tot hun gezin verzorgen en opvoeden, tenzij dit overleg
      kennelijk schade zal toebrengen aan de jeugdige.

      5 Van het overleg en de resultaten daarvan wordt melding gemaakt in het plan. Indien geen overleg mogelijk is,
      wordt hiervan met opgave van redenen melding gemaakt.

      6 Zo vaak als noodzakelijk, doch ten minste één maal per jaar wordt bezien in hoeverre het plan bijstelling
      behoeft.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel13
