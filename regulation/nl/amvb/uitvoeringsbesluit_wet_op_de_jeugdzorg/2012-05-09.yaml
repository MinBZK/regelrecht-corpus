      Als categorieën van instanties als bedoeld in [artikel 2b, eerste lid, onder a, van de wet][ref1] in het domein
      jeugdgezondheidszorg worden aangewezen:

      a. instanties die de in [artikel 5, tweede lid, van de Wet publieke gezondheid][ref2] genoemde werkzaamheden in
      opdracht van het college van burgemeester en wethouders uitvoeren;

      b. aanbieders van zorg als bedoeld in [artikel 5, tweede lid, onder b, van de wet][ref3].


