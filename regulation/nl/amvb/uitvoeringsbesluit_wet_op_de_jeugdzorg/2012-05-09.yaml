  - number: '56'
    text: |-
      Indien sprake is van een acute en ernstig bedreigende situatie voor de minderjarige stelt de stichting de raad voor
      de kinderbescherming onverwijld in kennis van haar oordeel dat een maatregel met betrekking tot het gezag over de
      minderjarige overwogen dient te worden.
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel56
  - number: '57'
    text: |-
      1 De raad voor de kinderbescherming neemt een geval waarbij een maatregel met betrekking tot het gezag over de
      minderjarige overwogen dient te worden, slechts in onderzoek indien de stichting hem van een dergelijk geval in
      kennis heeft gesteld.

      2 In afwijking van het eerste lid, neemt de raad voor de kinderbescherming een geval als bedoeld in het eerste lid
      zonder kennisgeving van de stichting in onderzoek, indien:

      a. er sprake is van een acute en ernstig bedreigende situatie voor de minderjarige of

      b. bij de uitvoering van enige andere wettelijke taak blijkt dat er sprake is van een geval waarbij een maatregel
      met betrekking tot het gezag over de minderjarige overwogen dient te worden.

      3 Indien een ander dan de stichting de raad voor de kinderbescherming in kennis stelt van een geval waarbij naar
      diens oordeel, een maatregel met betrekking tot het gezag over de minderjarige overwogen dient te worden, zendt de
      raad de kennisgeving onverwijld en onder gelijktijdige mededeling daarvan aan de melder, door aan de stichting die
      werkzaam is in de provincie waarin de jeugdige duurzaam verblijft, tenzij de kennisgeving betrekking heeft op een
      geval als bedoeld in het tweede lid, onder a.
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel57
  - number: '58'
    text: |-
      1 De raad voor de kinderbescherming doet van het in onderzoek nemen van een geval waarbij een maatregel met
      betrekking tot het gezag over een minderjarige overwogen wordt, onverwijld mededeling aan de stichting die werkzaam
      is in de provincie waarin de minderjarige duurzaam verblijft.

      2 De raad voor de kinderbescherming informeert de stichting over de resultaten van het onderzoek.
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel58
  - number: '59'
    text: |-
      1 De stichting informeert de minderjarige en de met het gezag belaste ouder uiterlijk op het moment dat zij de raad
      voor de kinderbescherming in kennis stelt van haar oordeel dat een maatregel met betrekking tot het gezag over een
      minderjarige overwogen dient te worden, tenzij dit kennelijk een bedreiging vormt voor de minderjarige.

      2 Indien de stichting de minderjarige en de met het gezag belaste ouder niet informeert, wordt in de kennisgeving
      aan de raad voor de kinderbescherming hiervan de reden vermeld.
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel59
  - number: '60'
    text: |-
      1 De stichting en de raad voor de kinderbescherming leggen de wijze van samenwerken vast in een protocol.

      2 In het protocol worden met betrekking tot de [artikelen 56 tot en met 59][ref1] in ieder geval vastgelegd:

      a. de wijze waarop de stichting de kennisgeving van een geval als bedoeld in [artikel 56][ref2] doet,

      b. een beschrijving van de gegevens die de stichting verstrekt bij de kennisgeving op grond waarvan de raad voor de
      kinderbescherming een beslissing kan nemen of hij het geval in onderzoek neemt,

      c. de wijze waarop de raad voor de kinderbescherming zijn beslissing over het in onderzoek nemen van een geval aan
      de stichting kenbaar maakt,

      d. een beschrijving van de werkwijze van de stichting en de raad voor de kinderbescherming voor zover de werkwijze
      samenhangt of gelijktijdig plaatsvindt en

      e. de wijze waarop de raad voor de kinderbescherming de stichting informeert over de resultaten van zijn onderzoek.

      3 In het protocol worden met betrekking tot het indicatiebesluit in ieder geval vastgelegd:

      a. de procedure die de stichting hanteert bij het nemen van een indicatiebesluit
      ingeval de raad voor de kinderbescherming voornemens is een machtiging als bedoeld in
      [artikel 261, eerste lid, van Boek 1 van het Burgerlijk Wetboek][ref3] te verzoeken en;

      b. een beschrijving van de criteria op grond waarvan de raad voor de kinderbescherming een indicatiebesluit in de
      gevallen, bedoeld in [artikel 7, zesde lid, onder b, van de wet][ref4], verzoekt.

      4 In het protocol wordt met betrekking tot de jeugdreclassering in ieder geval vastgelegd:

      a. een omschrijving van de criteria op grond waarvan de raad voor de kinderbescherming zijn bevoegdheid, bedoeld in
      [artikel 10, tweede lid, van de wet][ref5], gebruikt en;

      b. de wijze van samenwerking in het kader van de taak, bedoeld in
      [artikel 77hh van het Wetboek van Strafrecht][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0017751#Artikel56
