      1 Onze Ministers stellen de uitkering bureau jeugdzorg, bedoeld in [artikel 73b][ref1], eerste lid, voorlopig vast
      uiterlijk dertien weken na ontvangst van de aanvraag. De definitieve vaststelling van de uitkering vindt plaats
      uiterlijk dertien weken nadat het provinciebestuur de gegevens, bedoeld in [artikel 73c, tweede lid][ref2], heeft
      overgelegd. Het provinciebestuur overlegt de gegevens uiterlijk vóór 1 juni van het uitvoeringsjaar.

      2 Onze Ministers stellen de uitkering zorgaanbod, bedoeld in [artikel 73e][ref3], vast binnen dertien weken na
      ontvangst van de aanvraag.

      3 De uitkeringen worden betaald in termijnen, volgens bij regeling van Onze Ministers vast te stellen schema.


