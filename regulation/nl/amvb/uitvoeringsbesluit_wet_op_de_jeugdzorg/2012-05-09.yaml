  - number: 73e
    text: |-
      1 De uitkering zorgaanbod bestaat, onverminderd [artikel 104, tweede lid, van de wet][ref1], uit het bedrag dat het
      provinciebestuur in het jaar voorafgaande aan het jaar waarin de uitkering wordt verstrekt ontving voor jeugdzorg
      waarop aanspraak bestaat ingevolge de [wet][ref2], voor de vertrouwenspersoon voor de cliënten van zorgaanbieders,
      voor experimenten, voor de steunfunctie met betrekking tot die jeugdzorg, voor cliëntenorganisaties en voor het
      verwerken van gegevens, bedoeld in de [artikelen 43][ref3] en [44, eerste lid, van de wet][ref4].

      2 De uitkering zorgaanbod wordt verhoogd met een bedrag uit de in de begroting beschikbaar gestelde gelden voor
      extra aanbod, volgens bij circulaire van Onze Ministers vast te stellen regels over de verdeling van dit bedrag
      aan de hand van het aantal jeugdigen in de provincie, het aantal allochtone jeugdigen en het aantal jeugdigen dat
      behoort tot een eenoudergezin.

      3 De uitkering zorgaanbod kan, in afwijking van het eerste lid, en onverminderd het tweede lid, voor zover in
      de begroting de benodigde gelden ter beschikking zijn gesteld, worden verhoogd, indien aannemelijk is dat de
      uitkering, vastgesteld overeenkomstig het eerste en tweede lid, onvoldoende is om te voorzien in de behoefte aan
      jeugdzorg waarop aanspraak bestaat ingevolge de [wet][ref5].

      4 De uitkering zorgaanbod kan, in afwijking van het eerste lid, worden verminderd, indien aannemelijk is dat de
      behoefte aan subsidie voor door zorgaanbieders te leveren activiteiten in het jaar waarop de uitkering betrekking
      heeft, substantieel lager zal zijn dan die in het tweede jaar voorafgaand aan dat jaar.

      5 [Artikel 73d, derde lid][ref6], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel104
      [ref2]: https://wetten.overheid.nl/BWBR0016637
