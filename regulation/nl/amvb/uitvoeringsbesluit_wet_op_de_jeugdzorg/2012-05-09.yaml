  - number: '11'
    text: |-
      Als psychische stoornis als bedoeld in [artikel 9b, vijfde lid, van de Algemene Wet Bijzondere Ziektekosten][ref1]
      wordt aangewezen de psychische stoornis, beschreven op as I of as II van het classificatiesysteem Diagnostic and
      Statistical Manual of Mental Disorders.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel9b
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: 9b
  - number: '12'
    text: |-
      Als ernst als bedoeld in [artikel 9b, vijfde lid, van de Algemene Wet Bijzondere Ziektekosten][ref1] wordt
      aangegeven het functioneren van een jeugdige op een psychisch niveau dat leidt tot een score van 40 of minder
      op de Children’s Global Assessment Scale in de Nederlandse vertaling van 1994 dan wel een score van 50 als het
      betreft een jeugdige waarbij sprake is van een ernstig verminderd functioneren op één van de in de schaal opgenomen
      terreinen, terwijl redelijkerwijs vermoed kan worden dat dit verminderde functioneren samenhangt met de psychische
      stoornis.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel9b
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: 9b
  - number: '13'
    text: |-
      Indien [artikel 9b, vijfde lid, van de Algemene Wet Bijzondere Ziektekosten][ref1] toepassing heeft gevonden, geeft
      de betrokken huisarts, arts of andere behandelaar, bedoeld in [artikel 10, tweede lid][ref2], aan de stichting,
      die werkzaam is in de provincie waar de betrokken jeugdige duurzaam verblijft, gemotiveerd aan welke psychische
      stoornis hij vermoedt aanwezig te zijn en op welk psychisch niveau de jeugdige functioneert.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel9b
      [ref2]: https://wetten.overheid.nl/BWBR0017751#Artikel10
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: 9b
      - id: ref2
        bwb_id: BWBR0017751
        artikel: '10'
        hoofdstuk: '5'
  - number: '14'
    text: |-
      1 Een cliënt heeft, in afwijking van [artikel 3, derde lid, van de wet][ref1], in situaties waarin naar het oordeel
      van de stichting die werkzaam is in de provincie waarin de jeugdige duurzaam verblijft, onmiddellijke verlening
      van jeugdzorg als bedoeld in [artikel 5, tweede lid, onder a, van de wet][ref2], geboden is, aanspraak op deze
      jeugdzorg zonder dat die stichting een indicatiebesluit heeft genomen.

      2 Een aanspraak als bedoeld in het eerste lid vervalt zodra met betrekking tot de cliënt een indicatiebesluit is
      genomen, doch in ieder geval na vier weken.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing bij plaatsing van een jeugdige in een inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel5
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '5'
  - number: '15'
    text: |-
      Indien de stichting voorziet dat de zorg waarop een cliënt is aangewezen niet tijdig beschikbaar is, kan zij
      vervangende zorg aanduiden, waarop de cliënt alsdan is aangewezen. Een cliënt heeft aanspraak op de vervangende
      zorg tot het moment waarop hij zijn aanspraak op de eerst aangewezen zorg tot gelding heeft gebracht, of de met
      betrekking tot de vervangende zorg genoemde termijn, bedoeld in [artikel 6, eerste lid, onder c, van de wet][ref1],
      is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel6
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '6'
  - number: '16'
    text: |-
      Indien ten behoeve van één jeugdige meer dan één cliënt op zorg is aangewezen geven de indicatiebesluiten de
      samenhang met de andere besluiten aan.
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel16
  - number: '17'
    text: |-
      Bij regeling van Onze Ministers kan worden geregeld dat een indicatiebesluit inhoudende dat de cliënt is aangewezen
      op zorg als bedoeld in [artikel 5, tweede lid, van de wet][ref1] wordt vastgelegd op een formulier dat overeenkomt
      met een bij die regeling vast te stellen model.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel5
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '5'
  - number: '18'
    text: |-
      Indien de stichting vaststelt dat een cliënt is aangewezen op jeugdhulp, geeft zij in het indicatiebesluit aan of
      een cliënt is aangewezen op jeugdhulp:

      a. in de thuissituatie of in een accommodatie van een zorgaanbieder;

      b. individueel of in groepsverband.
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel18
  - number: '19'
    text: |-
      1 Indien de stichting vaststelt dat een jeugdige is aangewezen op verblijf, geeft zij in het indicatiebesluit
      aan of de jeugdige is aangewezen op verblijf bij een pleegouder, dan wel op verblijf in een accommodatie van een
      zorgaanbieder.

      2 Het indicatiebesluit vermeldt of het verblijf hele etmalen omvat of een gedeelte van een etmaal.
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel19
  - number: '20'
    text: |-
      Indien de stichting vaststelt dat een jeugdige is aangewezen op observatiediagnostiek, geeft zij in het
      indicatiebesluit aan welke vragen met de observatiediagnostiek beantwoord moeten worden.
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel20
  - number: '21'
    text: |-
      1 Indien de stichting vaststelt dat een jeugdige is aangewezen op een vorm van zorg als bedoeld in
      [artikel 9][ref1], geeft zij in het indicatiebesluit aan op welke van deze vormen de jeugdige is aangewezen.

      2 Indien de stichting vaststelt dat een jeugdige is aangewezen op een vorm van zorg als bedoeld in de
      [artikelen 4][ref2] of [6 van het Besluit zorgaanspraken AWBZ][ref3], vermeldt het indicatiebesluit de omvang van
      de benodigde zorg, uitgedrukt in een minimum en een maximum aantal contacturen, waarbij de marge twintig procent
      ten opzichte van het gemiddelde van het minimum en maximum bedraagt.

      3 Indien de stichting vaststelt dat een jeugdige is aangewezen op een vorm van zorg als bedoeld in de
      [artikelen 9][ref4], [9a][ref5], onderscheidenlijk [13, tweede lid, van het Besluit zorgaanspraken AWBZ][ref6],
      vermeldt het indicatiebesluit de omvang van het benodigde verblijf, uitgedrukt in het benodigde aantal uren per
      etmaal en het aantal dagen waarover de uren worden gespreid. Het aantal dagen waarover de uren worden gespreid
      wordt uitgedrukt in een minimum en maximum aantal dagen, waarbij de marge twintig procent ten opzichte van het
      gemiddelde van het minimum en het maximum bedraagt.

      4 Indien de stichting vaststelt dat een jeugdige is aangewezen op een vorm van zorg als bedoeld in
      [artikel 9][ref7], [9a][ref8] of [artikel 13, tweede lid, van het Besluit zorgaanspraken AWBZ][ref9], is,
      [artikel 13 van het Zorgindicatiebesluit][ref10] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0014149#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0014149#Artikel6
