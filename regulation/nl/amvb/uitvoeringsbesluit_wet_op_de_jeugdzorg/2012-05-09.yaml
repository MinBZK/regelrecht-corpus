      1 Als categorieën van instanties als bedoeld in [artikel 2b, eerste lid, onder a, van de wet][ref1] in het domein
      gezondheidszorg worden aangewezen:

      a. instanties voor verslavingszorg voor wie het op grond van
      [artikel 35 van de Wet marktordening gezondheidszorg][ref2] niet verboden is een tarief in rekening te brengen;

      b. instanties voor gehandicaptenzorg, die zorg verlenen waarop aanspraak bestaat op grond van de
      [Zorgverzekeringswet][ref3] of de [Algemene Wet Bijzondere Ziektekosten][ref4];

      c. instanties die integrale eerstelijns geneeskundige zorg aanbieden, zoals die door huisartsen pleegt te
      geschieden;

      d. ziekenhuizen die krachtens [artikel 5 van de Wet toelating zorginstellingen][ref5] als zodanig zijn toegelaten,
      voor zover het spoedeisende hulp betreft.

      2 Als categorie van functionarissen als bedoeld in [artikel 2b, tweede lid, onder a, van de wet][ref6] in het
      domein gezondheidszorg worden artsen aangewezen die integrale eerstelijns geneeskundige zorg aanbieden, zoals die
      door huisartsen pleegt te geschieden.


