  - number: '10'
    text: |-
      1 Als beroepsgroep als bedoeld in [artikel 9b, vijfde lid, van de Algemene Wet Bijzondere Ziektekosten][ref1] wordt
      aangewezen de beroepsgroep huisarts.

      2 Met een huisarts wordt gelijkgesteld de arts naar wie de huisarts een jeugdige heeft verwezen,
      alsmede de andere behandelaar van een jeugdige die in verband met een psychische stoornis een
      aanspraak heeft op grond van die wet waaraan geen indicatiebesluit ten grondslag ligt, omdat
      [artikel 9b, vijfde lid, van de Algemene Wet Bijzondere Ziektekosten][ref2] toepassing heeft gevonden.

      3 Met een huisarts wordt bovendien gelijkgesteld de arts, bedoeld in
      [artikel 47, eerste lid, van de Beginselenwet justitiële jeugdinrichtingen][ref3], voor
      zover het betreft jeugdigen die anders dan met toepassing van [artikel 261][ref4] of
      [305, derde lid, van Boek 1 van het Burgerlijk Wet boek][ref5] in een inrichting zijn geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel9b
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel9b
      [ref3]: https://wetten.overheid.nl/BWBR0011756#Artikel47
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel261
      [ref5]: https://wetten.overheid.nl/BWBR0002656#Artikel305
