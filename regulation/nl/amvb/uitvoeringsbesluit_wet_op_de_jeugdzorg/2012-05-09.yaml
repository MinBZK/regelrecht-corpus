  - number: 73k
    text: |-
      1 Het provinciebestuur vormt een egalisatiereserve jeugdzorg.

      2 Het verschil tussen de som van vastgestelde uitkeringen en de vastgestelde subsidies in het jaar waarop de
      uitkeringen betrekking hebben, komt ten gunste of ten laste van de egalisatiereserve.

      3 De van de egalisatiereserve genoten rente wordt aan de egalisatiereserve toegevoegd.

      4 In de gevallen, bedoeld in [artikel 4:41, tweede lid, onder c, d, en e, van de Algemene wet bestuursrecht][ref1],
      is het provinciebestuur terzake van de egalisatiereserve vergoedingsplichtig naar evenredigheid van de mate waarin
      de uitkering aan de egalisatiereserve heeft bijgedragen.

      5 De egalisatiereserve wordt uitsluitend besteed voor een van de doeleinden waarvoor de uitkeringen zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel441
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel73k
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:41
  - number: '77'
    text: |-
      Tot het tijdstip, bedoeld in [artikel 104, eerste lid, van de wet][ref1], kan de stichting een medewerker van een
      instelling met een landelijk bereik, die op het moment van inwerkingtreding van de [Wet op de jeugdzorg][ref2] als
      voogdij-instelling op grond van [artikel 60, eerste lid, onder a, van de Wet op de jeugdhulpverlening][ref3] of als
      gezinsvoogdij-instelling op grond van [artikel 60, eerste lid, onder b, van die wet][ref4] aanvaard was, aanwijzen
      als voogdij- onderscheidenlijk gezinsvoogdij- of jeugdreclasseringswerker.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel104
      [ref2]: https://wetten.overheid.nl/BWBR0016637
      [ref3]: https://wetten.overheid.nl/BWBR0004608#Artikel60
