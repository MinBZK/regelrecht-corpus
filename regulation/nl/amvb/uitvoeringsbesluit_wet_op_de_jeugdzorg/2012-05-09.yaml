articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

        - aanvrager: degene die de aanvraag indient voor een indicatiebesluit;
        - advies- en meldpunt kindermishandeling: de stichting bij de uitvoering van de taak, bedoeld in
      [artikel 10, eerste lid, onder e, van de wet][ref1];
        - de wet: de [Wet op de jeugdzorg][ref2];
        - gekwalificeerde gedragswetenschapper: degene die lid is van het Nederlands Instituut voor Psychologen en is
      opgenomen in het Register Klinisch Psychologen of het register Kinder- en Jeugdpsychologen en beschikt over
      de Basisaantekening Psychodiagnostiek van dit instituut of degene die lid is van de Nederlandse Vereniging van
      Orthopedagogen en Onderwijskundigen en geregistreerd is als Orthopedagoog-Generalist dan wel een BIG-geregistreerde
      gezondheidszorgpsycholoog;
        - gezinsvoogdijwerker: medewerker van de stichting die belast is met de uitoefening van de taak, bedoeld in
      [artikel 10, eerste lid, onder b, van de wet][ref3];
        - indicatiebesluit: een besluit waarbij wordt vastgesteld of een cliënt is aangewezen op zorg als bedoeld in
      [artikel 5, tweede lid, van de wet][ref4];
        - inrichting: een justitiële jeugdinrichting als bedoeld in
      [artikel 1, onder b, van de Beginselenwet justitiële jeugdinrichtingen][ref5];
        - jeugdbeschermings- en reclasseringstaken: de taken, bedoeld in
      [artikel 10, eerste lid, onderdelen a tot en met d, van de wet][ref6];
        - jeugdhulp: jeugdhulp als bedoeld in [artikel 3][ref7];
        - jeugdreclassering: de stichting bij de uitvoering van de taken, bedoeld in
      [artikel 10, eerste lid, onder c en d, van de wet][ref8];
        - jeugdreclasseringswerker: medewerker van de stichting die belast is met de uitvoering van de taak, bedoeld in
      [artikel 10, eerste lid, onder c en d, van de wet][ref9].
        - melding: een melding van kindermishandeling of van een vermoeden daarvan;
        - observatiediagnostiek: observatiediagnostiek als bedoeld in [artikel 5][ref10];
        - verblijf: verblijf als bedoeld in [artikel 4][ref11];
        - verwijsindex: verwijsindex als bedoeld in [artikel 2d van de wet][ref12];
        - voogdijwerker: medewerker van de stichting die belast is met de uitoefening van de taak, bedoeld in
      [artikel 10, eerste lid, onder a, van de wet][ref13];
        - vreemdeling: hetgeen daaronder wordt verstaan in de [Vreemdelingenwet 2000][ref14].


