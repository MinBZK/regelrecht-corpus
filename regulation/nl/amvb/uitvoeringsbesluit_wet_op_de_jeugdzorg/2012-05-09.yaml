        bwb_id: BWBR0017751
        artikel: '60'
        hoofdstuk: '10'
  - number: '50'
    text: |-
      1 De stichting legt de wijze waarop de herkenbaarheid en toegankelijkheid van een advies- en meldpunt
      kindermishandeling binnen het bureau jeugdzorg is georganiseerd, schriftelijk vast.

      2 De stichting draagt er zorg voor dat het advies- en meldpunt kindermishandeling is aangesloten op het daartoe
      bestemde landelijke telefoonnummer.
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel50
  - number: '51'
    text: |-
      Een bij de stichting werkzame persoon die taken uitvoert van een advies- en meldpunt kindermishandeling is niet
      belast met de uitvoering van andere taken van de stichting betreffende een geval van kindermishandeling waarbij
      deze rechtstreeks betrokken was.
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel51
  - number: '52'
    text: |-
      Bij een advies- en meldpunt kindermishandeling is in ieder geval een arts werkzaam. Deze arts is deskundig op het
      gebied van kindermishandeling.
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel52
  - number: '53'
    text: |-
      Onverminderd [artikel 27][ref1], draagt de stichting er zorg voor dat aan iedere betrokkene bij een advies, melding
      of onderzoek naar aanleiding van een melding bij het eerste contact informatie wordt verschaft over de procedure
      met betrekking tot een advies, melding of onderzoek, de verwerking van persoonsgegevens, met inachtneming van
      de [artikelen 43][ref2], [53][ref3] en [54 van de wet][ref4], het recht op inzage in of afschrift van de hem
      betreffende bescheiden alsmede de wijze van behandeling van klachten. Als betrokkenen worden aangemerkt degene die
      advies vraagt, degene die een melding doet, degene op wie een melding betrekking heeft en degene die om informatie
      in het kader van een onderzoek naar aanleiding van een melding wordt verzocht.


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel43
      [ref3]: https://wetten.overheid.nl/BWBR0016637#Artikel53
      [ref4]: https://wetten.overheid.nl/BWBR0016637#Artikel54
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel53
