  - number: 73j
    text: |-
      De [artikelen 4:49][ref1], [4:56][ref2] en [4:57 van de Algemene wet bestuursrecht][ref3] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel449
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel456
