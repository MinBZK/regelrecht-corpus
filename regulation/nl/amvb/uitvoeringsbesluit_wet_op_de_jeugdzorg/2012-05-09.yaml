      of een functionaris die behoort tot een van de categorieën als bedoeld in [artikel 1c, tweede lid][ref2], of
      [1d, tweede lid][ref3], draagt zorg voor een veilig en zorgvuldig gebruik van de verwijsindex.

      2 Een instantie of een functionaris wordt vermoed te voldoen aan het bepaalde in het eerste lid als voldaan wordt
      aan de eisen zoals deze zijn uitgegeven door het Nederlands Normalisatie-instituut in de NEN 7510, Medische
