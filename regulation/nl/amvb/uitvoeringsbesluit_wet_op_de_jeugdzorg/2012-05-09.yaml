  - number: '54'
    text: |-
      1 Een advies- en meldpunt kindermishandeling stelt binnen vijf dagen na ontvangst van een melding vast of de
      melding in onderzoek wordt genomen.

      2 Een advies- en meldpunt kindermishandeling oordeelt binnen dertien weken na de vaststelling, bedoeld in het
      eerste lid, of en zo ja tot welke stappen de melding aanleiding geeft.

      3 Onverminderd [artikel 32][ref1] vindt besluitvorming omtrent een melding plaats door ten minste twee bij de
      stichting werkzame personen die taken uitvoeren van een advies- en meldpunt kindermishandeling.


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel32
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel54
