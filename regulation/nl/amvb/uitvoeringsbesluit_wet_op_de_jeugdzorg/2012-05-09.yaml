  - number: '55'
    text: |-
      1 In dit artikel wordt onder persoonsgegeven verstaan hetgeen daaronder wordt verstaan in de
      [Wet bescherming persoonsgegevens][ref1].

      2 Een advies- en meldpunt kindermishandeling verstrekt aan degene op de persoonsgegevens betrekking hebben,
      inlichtingen over de herkomst van de persoonsgegevens die het naar aanleiding van een melding verkrijgt.

      3 In afwijking van het tweede lid verstrekt het advies- en meldpunt kindermishandeling geen inlichtingen over de
      herkomst van persoonsgegevens die het naar aanleiding van een melding heeft verkregen indien:

      a. een persoon die in een beroepsmatige, hulpverlenende of pedagogische relatie tot de minderjarige of zijn gezin
      staat, de persoonsgegevens naar aanleiding van een melding heeft verstrekt en het verstrekken van die inlichtingen:

      1°. een bedreiging vormt of kan vormen voor de minderjarige of andere minderjarige leden van het gezin waartoe de
      minderjarige behoort;

      2°. een bedreiging vormt of kan vormen voor die persoon of medewerkers van die persoon;

      3°. leidt of kan leiden tot een verstoring van de vertrouwensrelatie met het gezin waartoe de minderjarige behoort;

      b. het andere personen betreft dan die bedoeld onder a, behoudens voor zover zij daarvoor toestemming hebben
      gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0017751/2012-05-09#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0011468
  - number: 55a
    text: |-
      In dit hoofdstuk wordt verstaan onder:

        - *klachtencommissie:* klachtencommissie, bedoeld in [artikel 68 van de wet][ref1], voor zover deze klachten
      behandelt over een beslissing als bedoeld in [artikel 29w, eerste lid, van de wet][ref2] of over de toepassing van
      [artikel 29t van de wet][ref3];
        - *klacht:* klacht als bedoeld in [artikel 29w, eerste lid, van de wet][ref4].
        - *klager:* degene die een klacht als bedoeld in [artikel 29w, eerste lid van de wet][ref5], indient.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel29w
