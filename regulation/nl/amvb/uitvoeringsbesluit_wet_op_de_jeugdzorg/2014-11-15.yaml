articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - aanvrager: degene die de aanvraag indient
      voor een indicatiebesluit;
        - advies- en meldpunt kindermishandeling: de stichting bij de uitvoering van de taak, bedoeld in
      [artikel 10, eerste lid, onder e, van de wet][ref1];
        - autorisatielijst: autorisatielijst van jeugdzorgaanbieders, bedoeld in [artikel 2y van de wet][ref2];
        - beroepsregister voor jeugdzorg: register waarin beoefenaren van beroepen werkzaam op het terrein van de jeugdzorg
      worden ingeschreven en dat tot doel heeft de kwaliteit van de beroepsbeoefening in het belang van de jeugdzorg,
      alsmede de handhaving van die kwaliteit te bevorderen;
        - de wet: de [Wet op de jeugdzorg][ref3];
        - geautoriseerde: in de autorisatielijst opgenomen zorgaanbieder;
        - gekwalificeerde gedragswetenschapper: degene die is opgenomen in het register Kinder- en Jeugdpsychologen van
      het Nederlands Instituut van Psychologen of degene die lid is van de Nederlandse Vereniging van Pedagogen en
      Onderwijskundigen en geregistreerd is als Orthopedagoog-Generalist, dan wel een gezondheidszorgpsycholoog;
        - geregistreerde jeugdprofessional: een beroepsbeoefenaar die is ingeschreven in het kwaliteitsregister jeugd;
        - gezinsvoogdijwerker: medewerker van de stichting die belast is met de uitoefening van de taak, bedoeld in
      [artikel 10, eerste lid, onder b, van de wet][ref4];
        - indicatiebesluit: een besluit waarbij wordt vastgesteld of een cliënt is aangewezen op zorg als bedoeld in
      [artikel 5, tweede lid, van de wet][ref5];
        - inrichting: een justitiële jeugdinrichting als bedoeld in
      [artikel 1, onder b, van de Beginselenwet justitiële jeugdinrichtingen][ref6];
        - jeugdbeschermings- en reclasseringstaken: de taken, bedoeld in
      [artikel 10, eerste lid, onderdelen a tot en met d, van de wet][ref7];
        - jeugdhulp: jeugdhulp als bedoeld in [artikel 3][ref8];
        - jeugdreclassering: de stichting bij de uitvoering van de taken, bedoeld in
      [artikel 10, eerste lid, onder c en d, van de wet][ref9];
        - jeugdreclasseringswerker: medewerker van de stichting die belast is met de uitvoering van de taak, bedoeld in
      [artikel 10, eerste lid, onder c en d, van de wet][ref10].
        - kwaliteitsregister jeugd: het door Onze Ministers op grond van [artikel 68a, eerste lid][ref11], erkende
      register;
        - melding: een melding van kindermishandeling of van een vermoeden daarvan;
        - observatiediagnostiek: observatiediagnostiek als bedoeld in [artikel 5][ref12];
        - registerstichting: de rechtspersoon bedoeld in [artikel 68a, tweede lid][ref13];
        - SBV-Z: sectorale berichtenvoorziening in de zorg, bedoeld in
      [artikel 11 van het Besluit gebruik burgerservicenummer in de zorg][ref14];
        - toegangsmiddel: middel als bedoeld in [artikel 24g][ref15], met inbegrip van de drager van het middel;
        - verblijf: verblijf als bedoeld in [artikel 4][ref16];
        - verwijsindex: verwijsindex als bedoeld in [artikel 2d van de wet][ref17];
        - voogdijwerker: medewerker van de stichting die belast is met de uitoefening van de taak, bedoeld in
      [artikel 10, eerste lid, onder a, van de wet][ref18];
        - vreemdeling: hetgeen daaronder wordt verstaan in de [Vreemdelingenwet 2000][ref19].


