    text: |-
      de politie, bedoeld in [artikel 25, eerste lid, van de Politiewet 2012][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel25
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel1g
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '25'
  - number: 1g.b
    text: |-
      Halt-bureaus als bedoeld in [artikel 48f, onder c, van de Wet Justitie-subsidies][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008121#Artikel48f
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel1g
    references:
      - id: ref1
        bwb_id: BWBR0008121
        artikel: 48f
  - number: 1g.c
    text: |-
      de regionale locaties van de raad voor de kinderbescherming, bedoeld in
      [artikel 2 van het Organisatiebesluit raad voor de kinderbescherming 2006][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019732#Artikel2
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel1g
    references:
      - id: ref1
        bwb_id: BWBR0019732
        artikel: '2'
  - number: 1h
    text: |-
      Een instantie die behoort tot een van de categorieën als bedoeld in de [artikelen 1a tot en met 1g][ref1] wijst
      uitsluitend functionarissen aan die beschikken over een adequate opleiding en voldoende ervaring.


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel1a
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel1h
    references:
      - id: ref1
        bwb_id: BWBR0017751
        artikel: 1a
        hoofdstuk: 1a
        paragraaf: '1'
  - number: 1i.1
    text: |-
      Indien voor een melding aan de verwijsindex gebruik wordt gemaakt van een gemeentelijk signaleringssysteem,
      draagt het college van burgemeester en wethouders zorg voor een zorgvuldige en veilige aansluiting daarvan op de
      verwijsindex.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel1i
  - number: 1i.2
    text: |-
      Indien voor een melding aan de verwijsindex gebruik wordt gemaakt van een ander digitaal systeem
      dan een gemeentelijk signaleringssysteem, draagt de daarvoor verantwoordelijke in de zin van de
      [Wet bescherming persoonsgegevens][ref1] zorg voor een zorgvuldige en veilige aansluiting daarvan op de
      verwijsindex.


      [ref1]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel1i
    references:
      - id: ref1
        bwb_id: BWBR0011468
  - number: 1i.3
    text: |-
      Een aansluiting als bedoeld in het eerste of tweede lid wordt vermoed voldoende zorgvuldig en veilig te zijn als
      het voldoet aan de eisen zoals deze zijn uitgegeven door het Nederlands Normalisatie-instituut in de NTA 8023,
      Maatschappelijke zorg – Informatiearchitectuur in de jeugdsector – Deel 1 : Landelijke verwijsindex risicojongeren.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel1i
  - number: 1j.1
    text: |-
      Een instantie die behoort tot een van de categorieën als bedoeld in de [artikelen 1a tot en met 1g][ref1]
      of een functionaris die behoort tot een van de categorieën als bedoeld in [artikel 1c, tweede lid][ref2], of
      [1d, tweede lid][ref3], draagt zorg voor een veilig en zorgvuldig gebruik van de verwijsindex.


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0017751#Artikel1c
      [ref3]: https://wetten.overheid.nl/BWBR0017751#Artikel1d
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel1j
    references:
      - id: ref1
        bwb_id: BWBR0017751
        artikel: 1a
        hoofdstuk: 1a
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0017751
        artikel: 1c
        hoofdstuk: 1a
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0017751
        artikel: 1d
        hoofdstuk: 1a
        paragraaf: '1'
  - number: 1j.2
    text: |-
      Een instantie of een functionaris wordt vermoed te voldoen aan het bepaalde in het eerste lid als voldaan wordt aan
      de eisen zoals deze zijn uitgegeven door het Nederlands Normalisatie-instituut in de NEN 7510, Medische informatica
      – Informatiebeveiliging in de zorg – Algemeen.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel1j
  - number: 1k
    text: |-
      Onze Minister van Volksgezondheid, Welzijn en Sport doet van wijziging van een norm als bedoeld in
      [1i, derde lid][ref1], of [artikel 1j, tweede lid][ref2], mededeling in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel1i
      [ref2]: https://wetten.overheid.nl/BWBR0017751#Artikel1j
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel1k
    references:
      - id: ref1
        bwb_id: BWBR0017751
        artikel: 1i
        hoofdstuk: 1a
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017751
        artikel: 1j
        hoofdstuk: 1a
        paragraaf: '2'
  - number: 1l.1
    text: |-
      Indien een meldingsbevoegde een jeugdige die niet beschikt over een burgerservicenummer meldt aan de verwijsindex,
      biedt hij daartoe de volgende gegevens van de jeugdige aan in de verwijsindex:
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel1l
  - number: 1l.1.a
    text: de familienaam;
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel1l
  - number: 1l.1.b
    text: de geboortedatum;
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel1l
  - number: 1l.1.c
    text: het geslacht.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel1l
  - number: 1l.2
    text: |-
      De gegevens, bedoeld in het eerste lid, worden in de verwijsindex omgezet in een verwijsindexservicenummer, dat
      vervolgens gebruikt wordt voor de melding in de verwijsindex.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel1l
  - number: '2'
    text: |-
      De aanspraak op jeugdzorg ingevolge de [wet][ref1] omvat: jeugdhulp, verblijf en observatiediagnostiek.


      [ref1]: https://wetten.overheid.nl/BWBR0016637
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0016637
  - number: '3.1'
    text: 'Jeugdhulp omvat behandeling of begeleiding van een:'
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel3
  - number: 3.1.a
    text: |-
      jeugdige, gericht op het oplossen, verminderen of voorkomen van verergering dan wel het omgaan met de gevolgen van
      zijn psychosociale, psychische of gedragsproblemen;
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel3
  - number: 3.1.b
    text: |-
      cliënt, niet zijnde een jeugdige, gericht op het verkrijgen van zodanige vaardigheden dat hij aan de onder a
      bedoelde psychosociale, psychische of gedragsproblemen in het gezin het hoofd kan bieden.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel3
  - number: '3.2'
    text: 'Geen aanspraak bestaat op jeugdhulp voor zover:'
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel3
  - number: 3.2.a
    text: |-
      de jeugdige of zijn ouders, stiefouder, of anderen die hem als behorende tot hun gezin verzorgen en opvoeden de
      psychosociale, psychische of gedragsproblemen van die jeugdige het hoofd kunnen bieden, al dan niet met behulp van
      personen uit hun directe omgeving of met behulp van andere voorzieningen die hulp bieden dan zorgaanbieders of
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel3
  - number: 3.2.b
    text: |-
      de psychosociale, psychische of gedragsproblemen hun oorzaak vinden of mede vinden in een psychiatrische aandoening
      van een jeugdige die zodanig van aard is dat een psychiatrische aanpak van de problemen noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel3
  - number: '4.1'
    text: |-
      Verblijf omvat het aan een jeugdige gedurende het etmaal of een deel daarvan bieden van verblijf met een passend
      pedagogisch klimaat bij een pleegouder of in een accommodatie van een zorgaanbieder.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel4
  - number: '4.2'
    text: 'Geen aanspraak bestaat op verblijf voor zover:'
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel4
  - number: 4.2.a
    text: |-
      de jeugdige geen psychosociale, psychische of gedragsproblemen heeft, dan wel de jeugdige of zijn ouders,
      stiefouder, of anderen die hem als behorende tot hun gezin verzorgen en opvoeden, de psychosociale, psychische
      of gedragsproblemen van die jeugdige het hoofd kunnen bieden, al dan niet met jeugdhulp als bedoeld in
      [artikel 3][ref1], met behulp van personen uit hun directe omgeving of met behulp van andere voorzieningen die hulp
      bieden dan zorgaanbieders,


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel3
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0017751
        artikel: '3'
        hoofdstuk: '2'
  - number: 4.2.b
    text: |-
      het verblijf noodzakelijk is voor persoonlijke verzorging, begeleiding of behandeling als bedoeld
      in [artikel 2, eerste lid, van het Besluit zorgaanspraken AWBZ][ref1] of zorg als bedoeld in
      [artikel 2.4 van het Besluit zorgverzekering][ref2] in verband met een verstandelijke, lichamelijke of zintuiglijke
      handicap, dan wel een psychiatrische of somatische aandoening of beperking of


      [ref1]: https://wetten.overheid.nl/BWBR0014149#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0014149
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0018492
        artikel: '2'
  - number: 4.2.c
    text: |-
      het verblijf in een justitiële jeugdinrichting als bedoeld in
      [artikel 1, onder b, van de Beginselenwet justitiële jeugdinrichtingen][ref1] betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel1
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '1'
  - number: '4.3'
    text: 'In afwijking van het tweede lid, onder a, bestaat aanspraak op verblijf:'
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel4
  - number: 4.3.a
    text: indien het een minderjarige betreft die onder voogdij van een stichting staat;
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel4
  - number: 4.3.b
    text: |-
      als door verblijf bij een pleegouder het hoofd kan worden geboden aan de psychosociale, psychische of
      gedragsproblemen van de jeugdige.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel4
  - number: '4.4'
    text: |-
      Aanspraak op verblijf gedurende een deel van het etmaal bestaat slechts indien dit noodzakelijk is voor het tot
      gelding brengen van een aanspraak op jeugdhulp als bedoeld in [artikel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel3
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0017751
        artikel: '3'
        hoofdstuk: '2'
  - number: '5.1'
    text: |-
      Observatiediagnostiek omvat het onderzoeken van een jeugdige gericht op het verkrijgen van gegevens die een
      stichting nodig heeft voor het nemen van een indicatiebesluit.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel5
  - number: '5.2'
    text: |-
      Geen aanspraak op observatiediagnostiek bestaat als aannemelijk is dat een jeugdige is aangewezen op zorg als
      bedoeld in [artikel 5, tweede lid, onder b, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel5
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '5'
  - number: '5.3'
    text: |-
      Aanspraak op observatiediagnostiek bestaat slechts indien voor het verkrijgen van de gegevens, bedoeld in het
      eerste lid, observatie tijdens verblijf gedurende het etmaal of een deel daarvan noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel5
  - number: '5.4'
    text: |-
      Aanspraak op observatiediagnostiek bestaat voor een termijn van ten hoogste zes weken. De aanspraak kan eenmaal met
      ten hoogste zes weken worden verlengd.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel5
  - number: '6.1'
    text: |-
      Bij regeling van Onze Ministers kunnen nadere regels worden gesteld over de omvang van en de voorwaarden waaronder
      aanspraak op jeugdhulp, verblijf of observatiediagnostiek bestaat.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel6
  - number: '6.2'
    text: Een regeling als bedoeld in het eerste lid, vervalt drie jaar na haar inwerkingtreding.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel6
  - number: '7'
    text: |-
      Als categorie niet rechtmatig in Nederland verblijvende vreemdelingen tot wie de aanspraken ingevolge de
      [wet][ref1] worden uitgebreid, wordt aangemerkt de categorie vreemdelingen die geen rechtmatig verblijf in
      Nederland hebben en die de leeftijd van achttien jaren nog niet hebben bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0016637
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0016637
  - number: '8.1'
    text: |-
      Een vreemdeling als bedoeld in [artikel 7][ref1], heeft, aanspraak op jeugdhulp, verblijf en observatiediagnostiek.


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel7
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0017751
        artikel: '7'
        hoofdstuk: '3'
  - number: '8.2'
    text: |-
      Deze vreemdeling heeft geen aanspraak op verblijf bij een pleegouder tenzij verblijf bij een pleegouder in het
      belang van de ontwikkeling van die vreemdeling geboden is. Indien een stichting voor een vreemdeling verblijf bij
      een pleegouder geboden acht, wordt in het indicatiebesluit aangegeven waarom zij verblijf in een accommodatie van
      een zorgaanbieder niet aangewezen acht.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel8
  - number: '9'
    text: |-
      Als vormen van zorg als bedoeld in [artikel 5, tweede lid, onder b, van de wet][ref1] worden, voor zover deze zorg
      of het verblijf betrekking heeft op een jeugdige en verband houdt met een psychiatrische aandoening, aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel5
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '5'
  - number: 9.a
    text: |-
      persoonlijke verzorging, begeleiding, verblijf, kortdurend verblijf en voortgezet verblijf als
      bedoeld in de [artikelen 4][ref1], [6][ref2], [9][ref3], [artikel 9a][ref4], [10][ref5] en
      [13, tweede lid, van het Besluit zorgaanspraken AWBZ][ref6];


      [ref1]: https://wetten.overheid.nl/BWBR0014149#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0014149#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0014149#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0014149#Artikel9a
      [ref5]: https://wetten.overheid.nl/BWBR0014149#Artikel10
      [ref6]: https://wetten.overheid.nl/BWBR0014149#Artikel13
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0014149
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0014149
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0014149
        artikel: '9'
      - id: ref4
        bwb_id: BWBR0014149
        artikel: 9a
      - id: ref5
        bwb_id: BWBR0014149
        artikel: '10'
      - id: ref6
        bwb_id: BWBR0014149
        artikel: '13'
  - number: 9.b
    text: |-
      geneeskundige zorg en verblijf als bedoeld in de [artikelen 2.4][ref1]en
      [2.10 van het Besluit zorgverzekering][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0018492
        artikel: '2'
  - number: '10.1'
    text: |-
      Als beroepsgroep als bedoeld in [artikel 9b, vijfde lid, van de Algemene Wet Bijzondere Ziektekosten][ref1] wordt
      aangewezen de beroepsgroep huisarts.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel9b
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: 9b
  - number: '10.2'
    text: |-
      Met een huisarts wordt gelijkgesteld de arts naar wie de huisarts een jeugdige heeft verwezen,
      alsmede de andere behandelaar van een jeugdige die in verband met een psychische stoornis een
      aanspraak heeft op grond van die wet waaraan geen indicatiebesluit ten grondslag ligt, omdat
      [artikel 9b, vijfde lid, van de Algemene Wet Bijzondere Ziektekosten][ref1] toepassing heeft gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel9b
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: 9b
  - number: '10.3'
    text: |-
      Met een huisarts wordt bovendien gelijkgesteld de arts, bedoeld in
      [artikel 47, eerste lid, van de Beginselenwet justitiële jeugdinrichtingen][ref1], voor
      zover het betreft jeugdigen die anders dan met toepassing van [artikel 261][ref2] of
      [305, derde lid, van Boek 1 van het Burgerlijk Wet boek][ref3] in een inrichting zijn geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel261
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel305
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '47'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '261'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '305'
  - number: '11'
    text: |-
      Als psychische stoornis als bedoeld in [artikel 9b, vijfde lid, van de Algemene Wet Bijzondere Ziektekosten][ref1]
      wordt aangewezen de psychische stoornis, beschreven op as I of as II van het classificatiesysteem Diagnostic and
      Statistical Manual of Mental Disorders.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel9b
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: 9b
  - number: '12'
    text: |-
      Als ernst als bedoeld in [artikel 9b, vijfde lid, van de Algemene Wet Bijzondere Ziektekosten][ref1] wordt
      aangegeven het functioneren van een jeugdige op een psychisch niveau dat leidt tot een score van 40 of minder
      op de Children’s Global Assessment Scale in de Nederlandse vertaling van 1994 dan wel een score van 50 als het
      betreft een jeugdige waarbij sprake is van een ernstig verminderd functioneren op één van de in de schaal opgenomen
      terreinen, terwijl redelijkerwijs vermoed kan worden dat dit verminderde functioneren samenhangt met de psychische
      stoornis.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel9b
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: 9b
  - number: '13'
    text: |-
      Indien [artikel 9b, vijfde lid, van de Algemene Wet Bijzondere Ziektekosten][ref1] toepassing heeft gevonden, geeft
      de betrokken huisarts, arts of andere behandelaar, bedoeld in [artikel 10, tweede lid][ref2], aan de stichting,
      die werkzaam is in de provincie waar de betrokken jeugdige duurzaam verblijft, gemotiveerd aan welke psychische
      stoornis hij vermoedt aanwezig te zijn en op welk psychisch niveau de jeugdige functioneert.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel9b
      [ref2]: https://wetten.overheid.nl/BWBR0017751#Artikel10
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: 9b
      - id: ref2
        bwb_id: BWBR0017751
        artikel: '10'
        hoofdstuk: '5'
  - number: '14.1'
    text: |-
      Een cliënt heeft, in afwijking van [artikel 3, derde lid, van de wet][ref1], in situaties waarin naar het oordeel
      van de stichting die werkzaam is in de provincie waarin de jeugdige duurzaam verblijft, onmiddellijke verlening
      van jeugdzorg als bedoeld in [artikel 5, tweede lid, onder a, van de wet][ref2], geboden is, aanspraak op deze
      jeugdzorg zonder dat die stichting een indicatiebesluit heeft genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel5
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '5'
  - number: '14.2'
    text: |-
      Een aanspraak als bedoeld in het eerste lid vervalt zodra met betrekking tot de cliënt een indicatiebesluit is
      genomen, doch in ieder geval na vier weken.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel14
  - number: '14.3'
    text: Het eerste en tweede lid zijn van overeenkomstige toepassing bij plaatsing van een jeugdige in een inrichting.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel14
  - number: '15'
    text: |-
      Indien de stichting voorziet dat de zorg waarop een cliënt is aangewezen niet tijdig beschikbaar is, kan zij
      vervangende zorg aanduiden, waarop de cliënt alsdan is aangewezen. Een cliënt heeft aanspraak op de vervangende
      zorg tot het moment waarop hij zijn aanspraak op de eerst aangewezen zorg tot gelding heeft gebracht, of de met
      betrekking tot de vervangende zorg genoemde termijn, bedoeld in [artikel 6, eerste lid, onder c, van de wet][ref1],
      is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel6
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '6'
  - number: '16'
    text: |-
      Indien ten behoeve van één jeugdige meer dan één cliënt op zorg is aangewezen geven de indicatiebesluiten de
      samenhang met de andere besluiten aan.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel16
  - number: '17'
    text: |-
      Bij regeling van Onze Ministers kan worden geregeld dat een indicatiebesluit inhoudende dat de cliënt is aangewezen
      op zorg als bedoeld in [artikel 5, tweede lid, van de wet][ref1] wordt vastgelegd op een formulier dat overeenkomt
      met een bij die regeling vast te stellen model.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel5
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '5'
  - number: '18'
    text: |-
      Indien de stichting vaststelt dat een cliënt is aangewezen op jeugdhulp, geeft zij in het indicatiebesluit aan of
      een cliënt is aangewezen op jeugdhulp:
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel18
  - number: 18.a
    text: in de thuissituatie of in een accommodatie van een zorgaanbieder;
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel18
  - number: 18.b
    text: individueel of in groepsverband.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel18
  - number: '19.1'
    text: |-
      Indien de stichting vaststelt dat een jeugdige is aangewezen op verblijf, geeft zij in het indicatiebesluit aan
      of de jeugdige is aangewezen op verblijf bij een pleegouder, dan wel op verblijf in een accommodatie van een
      zorgaanbieder.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel19
  - number: '19.2'
    text: Het indicatiebesluit vermeldt of het verblijf hele etmalen omvat of een gedeelte van een etmaal.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel19
  - number: '20'
    text: |-
      Indien de stichting vaststelt dat een jeugdige is aangewezen op observatiediagnostiek, geeft zij in het
      indicatiebesluit aan welke vragen met de observatiediagnostiek beantwoord moeten worden.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel20
  - number: '21.1'
    text: |-
      Indien de stichting vaststelt dat een jeugdige is aangewezen op een vorm van zorg als bedoeld in [artikel 9][ref1],
      geeft zij in het indicatiebesluit aan op welke van deze vormen de jeugdige is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel9
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0017751
        artikel: '9'
        hoofdstuk: '4'
  - number: '21.2'
    text: |-
      Indien de stichting vaststelt dat een jeugdige is aangewezen op een vorm van zorg als bedoeld in de
      [artikelen 4][ref1] of [6 van het Besluit zorgaanspraken AWBZ][ref2], vermeldt het indicatiebesluit de omvang van
      de benodigde zorg, uitgedrukt in een minimum en een maximum aantal contacturen, waarbij de marge twintig procent
      ten opzichte van het gemiddelde van het minimum en maximum bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0014149#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0014149#Artikel6
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0014149
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0014149
        artikel: '6'
  - number: '21.3'
    text: |-
      Indien de stichting vaststelt dat een jeugdige is aangewezen op een vorm van zorg als bedoeld in de
      [artikelen 9][ref1], [9a][ref2], onderscheidenlijk [13, tweede lid, van het Besluit zorgaanspraken AWBZ][ref3],
      vermeldt het indicatiebesluit de omvang van het benodigde verblijf, uitgedrukt in het benodigde aantal uren per
      etmaal en het aantal dagen waarover de uren worden gespreid. Het aantal dagen waarover de uren worden gespreid
      wordt uitgedrukt in een minimum en maximum aantal dagen, waarbij de marge twintig procent ten opzichte van het
      gemiddelde van het minimum en het maximum bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0014149#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0014149#Artikel9a
      [ref3]: https://wetten.overheid.nl/BWBR0014149#Artikel13
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0014149
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0014149
        artikel: 9a
      - id: ref3
        bwb_id: BWBR0014149
        artikel: '13'
  - number: '21.4'
    text: |-
      Indien de stichting vaststelt dat een jeugdige is aangewezen op een vorm van zorg als bedoeld in
      [artikel 9][ref1], [9a][ref2] of [artikel 13, tweede lid, van het Besluit zorgaanspraken AWBZ][ref3], is,
      [artikel 13 van het Zorgindicatiebesluit][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014149#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0014149#Artikel9a
      [ref3]: https://wetten.overheid.nl/BWBR0014149#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0008946#Artikel13
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0014149
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0014149
        artikel: 9a
      - id: ref3
        bwb_id: BWBR0014149
        artikel: '13'
      - id: ref4
        bwb_id: BWBR0008946
        artikel: '13'
  - number: '22'
    text: |-
      Indien de stichting vaststelt dat een jeugdige is aangewezen op verblijf in een inrichting geeft zij in het
      indicatiebesluit aan of sprake moet zijn van verblijf in een beperkt beveiligde of normaal beveiligde inrichting
      als bedoeld in [artikel 14, eerste lid, van de Beginselenwet justitiële jeugdinrichtingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel14
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '14'
  - number: '23.1'
    text: |-
      De in het indicatiebesluit vast te leggen termijn gedurende welke de aanspraak geldt, bedraagt ten hoogste een jaar
      na de datum waarop de zorg waarin het indicatiebesluit voorziet, is aangevangen, tenzij het betreft:
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel23
  - number: 23.1.a
    text: |-
      verblijf bij een pleegouder van een jeugdige die al langer dan twee jaar bij eenzelfde pleegouder verblijft en
      voorzien wordt dat van terugkeer naar het gezin van herkomst geen sprake kan zijn;
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel23
  - number: 23.1.b
    text: |-
      een aanspraak op een vorm van zorg als bedoeld in [artikel 5, tweede lid, onder b, van de wet][ref1] in verband met
      een aandoening die maakt dat een jeugdige langer dan twee jaar is aangewezen op eenzelfde vorm van zorg en voorzien
      wordt dat de jeugdige op deze vorm van zorg aangewezen blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel5
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '5'
  - number: '23.2'
    text: |-
      De in het eerste lid bedoelde termijn is met betrekking tot rechtmatig in Nederland
      verblijvende minderjarige vreemdelingen wier verblijf tijdelijk is als bedoeld in
      [artikel 3.5, tweede lid, aanhef en onder i, van het Vreemdelingenbesluit 2000][ref1], ten hoogste een half jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
  - number: '23.3'
    text: |-
      De in het eerste lid bedoelde termijn is met betrekking tot vreemdelingen, bedoeld in [artikel 7][ref1], in
      overeenstemming met de verwachte duur van het verblijf in Nederland, en ten hoogste een half jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel7
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0017751
        artikel: '7'
        hoofdstuk: '3'
  - number: 23a.1
    text: |-
      Indien toepassing is gegeven aan artikel 68a, eerste lid, worden de taken waarmee de zorgaanbieder bij of krachtens
      de wet is belast, verricht door of onder verantwoordelijkheid van een geregistreerde jeugdprofessional. De
      zorgaanbieder houdt bij de toedeling van taken rekening met de specifieke kennis en vaardigheden op basis waarvan
      de geregistreerde jeugdprofessional is ingeschreven in het kwaliteitsregister jeugd.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel23a
  - number: 23a.2
    text: |-
      In afwijking van het eerste lid kan de zorgaanbieder anderen dan geregistreerde jeugdprofessionals met de
      uitvoering van taken belasten indien hij aannemelijk kan maken dat de kwaliteit van de zorgverlening daardoor niet
      nadelig wordt beïnvloed. De zorgaanbieder belast anderen met die taken indien dit noodzakelijk is voor de kwaliteit
      van de zorgverlening.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel23a
  - number: 23a.3
    text: |-
      De zorgaanbieder draagt er zorg voor dat geregistreerde jeugdprofessionals hun taken kunnen verrichten met
      inachtneming van de professionele standaarden waaraan zij door de inschrijving in het kwaliteitsregister jeugd
      zijn gebonden.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel23a
  - number: 23a.4
    text: |-
      Dit artikel is niet van toepassing op zorgaanbieders als bedoeld in [artikel 18, tweede lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel18
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '18'
  - number: '24'
    text: |-
      Bij regeling van Onze Minister wordt bepaald welke gegevens en bescheiden worden verstrekt bij de aanvraag om te
      worden opgenomen in de autorisatielijst.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel24
  - number: 24a.1
    text: |-
      Onze Minister stelt, aan de hand van bij of krachtens de wet gestelde vereisten voor de hoedanigheid van de
      zorgaanbieder, vast of de aanvraag, bedoeld in [artikel 24][ref1], is gedaan door een zorgaanbieder.


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel24
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0017751
        artikel: '24'
        hoofdstuk: 8b
        paragraaf: '1'
  - number: 24a.2
    text: De aanvraag wordt in ieder geval afgewezen indien deze niet is gedaan door een zorgaanbieder.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel24a
  - number: 24b.1
    text: 'In de autorisatielijst wordt per inschrijving opgenomen:'
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel24b
  - number: 24b.1.a
    text: 'indien de geautoriseerde een natuurlijke persoon is:'
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel24b
  - number: 24b.1.a.1°
    text: geslachtsnaam;
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel24b
  - number: 24b.1.a.2°
    text: voornamen;
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel24b
  - number: 24b.1.a.3°
    text: geboortedatum;
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel24b
  - number: 24b.1.a.4°
    text: geboorteplaats;
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel24b
  - number: 24b.1.a.5°
    text: |-
      titel in de zin van de [Wet op de beroepen in de individuele gezondheidszorg][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006251
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel24b
    references:
      - id: ref1
        bwb_id: BWBR0006251
  - number: 24b.1.b
    text: 'indien de geautoriseerde een rechtspersoon is: de naam.'
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel24b
  - number: 24b.2
    text: 'In de autorisatielijst wordt voorts per inschrijving opgenomen:'
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel24b
  - number: 24b.2.a
    text: aard van de gegevens en bescheiden aan de hand waarvan is vastgesteld dat de geautoriseerde een zorgaanbieder is;
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel24b
  - number: 24b.2.b
    text: datum van opname in de autorisatielijst;
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel24b
  - number: 24b.2.c
    text: adres van vestiging;
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel24b
  - number: 24b.2.d
    text: gegevens met betrekking tot verstrekte en ingetrokken toegangsmiddelen.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel24b
  - number: 24b.3
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld over de opname en verwerking van gegevens in
      de autorisatielijst.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel24b
  - number: 24c
    text: |-
      De geautoriseerde stelt Onze Minister onmiddellijk op de hoogte van een wijziging van de in de autorisatielijst
      opgenomen gegevens en van omstandigheden die van belang kunnen zijn voor het schorsen of doorhalen van de opname.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel24c
  - number: 24d.1
    text: 'Verwijdering van de autorisatielijst vindt slechts plaats:'
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel24d
  - number: 24d.1.a
    text: op verzoek van de geautoriseerde, of
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel24d
  - number: 24d.1.b
    text: indien de geautoriseerde geen zorgaanbieder meer is.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel24d
  - number: 24d.2
    text: |-
      Zolang de inschrijving van een zorgaanbieder in het register, bedoeld in
      [artikel 3 van de Wet op de beroepen in de individuele gezondheidszorg][ref1], is geschorst, is zijn opname in de
      autorisatielijst van jeugdzorgaanbieders geschorst.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel3
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel24d
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '3'
  - number: 24e.1
    text: 'Onze Minister deelt aan een ieder die daarom verzoekt mede of:'
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel24e
  - number: 24e.1.a
    text: een zorgaanbieder is opgenomen op de autorisatielijst;
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel24e
  - number: 24e.1.b
    text: een aan een geautoriseerde verstrekt toegangsmiddel geldig is.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel24e
  - number: 24e.2
    text: |-
      Indien het verzoek wordt gedaan door de voorzieningen als bedoeld in
      [artikel 3, eerste lid, onder c en d, van de Wet algemene bepalingen burgerservicenummer][ref1], wordt de
      mededeling, bedoeld in het eerste lid, onmiddellijk gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel3
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel24e
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '3'
  - number: 24f
    text: |-
      Zorgaanbieders kunnen uitsluitend gebruik maken van de voorzieningen, bedoeld in
      [artikel 3, eerste lid, onder c en d, van de Wet algemene bepalingen burgerservicenummer][ref1] uitsluitend door
      tussenkomst van de SBV-Z.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel3
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel24f
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '3'
  - number: 24g
    text: |-
      Onze Minister kan op aanvraag middelen verschaffen waarmee de geautoriseerde toegang kan verkrijgen tot de SBV-
      Z. De [artikelen 18 tot en met 25][ref1] en [33 van het Besluit gebruik burgerservicenummer in de zorg][ref2]
      zijn van overeenkomstige toepassing op de aanvraag, het overleggen van gegevens en bescheiden, de verstrekking, de
      vergoeding, het gebruik, de intrekking, geldigheidsduur en eigendom van toegangsmiddelen, met dien verstande dat
      daarbij onder «geregistreerde» verstaan wordt: geautoriseerde.


      [ref1]: https://wetten.overheid.nl/BWBR0023902#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0023902#Artikel33
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel24g
    references:
      - id: ref1
        bwb_id: BWBR0023902
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0023902
        artikel: '33'
  - number: '25.1'
    text: |-
      Medewerkers die zijn belast met de uitvoering van de taken, bedoeld in [artikel 5, eerste lid, van de wet][ref1],
      voogdijwerkers, gezinsvoogdijwerkers, jeugdreclasseringswerkers en medewerkers die taken uitvoeren van een
      advies- en meldpunt kindermishandeling, alsmede medewerkers die belast zijn met de uitvoering van de taken,
      bedoeld in [artikel 10, eerste lid, onder f tot en met j, van de wet][ref2], zijn werkzaam op basis van een
      arbeidsovereenkomst met de stichting of op basis van een detacheringsovereenkomst tussen hun werkgever en de
      stichting.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel10
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '10'
  - number: '25.2'
    text: |-
      In afwijking van het eerste lid, kan een medewerker anders dan op basis van een arbeidsovereenkomst of
      detacheringsovereenkomst bij de stichting werkzaam zijn:
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel25
  - number: 25.2.a
    text: |-
      indien hij zodanig gespecialiseerd is dat een arbeidsovereenkomst of een detacheringsovereenkomst een doelmatige
      werkwijze van de stichting belemmert;
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel25
  - number: 25.2.b
    text: ten behoeve van een tijdelijke functievervulling.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel25
  - number: '25.3'
    text: |-
      Bij regeling van Onze Ministers kunnen regels worden gesteld ten aanzien van de detacheringsovereenkomst, bedoeld
      in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel25
  - number: '26.1'
    text: De stichting is zeven maal vierentwintig uur per week telefonisch bereikbaar.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel26
  - number: '26.2'
    text: |-
      De stichting is zeven maal vierentwintig uur per week beschikbaar voor situaties waarin
      onmiddellijke uitvoering van de taken, bedoeld in [artikel 3, vijfde lid][ref1], of
      [artikel 10, eerste lid, onder a tot en met f, van de wet][ref2], geboden is.


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel10
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0017751
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '10'
  - number: '27.1'
    text: |-
      De stichting informeert de cliënt over de taken en werkwijze van het bureau jeugdzorg en over zijn rechten. De
      informatie wordt in begrijpelijke vorm verschaft.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel27
  - number: '27.2'
    text: De stichting maakt de cliënt duidelijk welke taak het bureau jeugdzorg ten aanzien van hem uitoefent.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel27
  - number: '28'
    text: |-
      De stichting stuurt, onverminderd [artikel 51 van de wet][ref1], aan de huisarts van de cliënt een afschrift van
      het indicatiebesluit of het document waarin de zorg, bedoeld in [artikel 8, van de wet][ref2], is vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel8
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '51'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '8'
  - number: '29.1'
    text: |-
      Onverminderd het derde, vierde en vijfde lid, beschikt de stichting ten behoeve van een verantwoorde uitvoering van
      de aan haar bij de wet opgedragen taken over deskundigheid met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel29
  - number: 29.1.a
    text: |-
      de beoordeling en aanpak van psychosociale, psychische of gedragsproblemen, dan wel een psychiatrische aandoening
      van jeugdigen;
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel29
  - number: 29.1.b
    text: de beoordeling en aanpak van opvoedingssituaties die het onbedreigd opgroeien van jeugdigen kunnen belemmeren;
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel29
  - number: 29.1.c
    text: de herkenning van taal- en leerproblemen;
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel29
  - number: 29.1.d
    text: de herkenning van somatische aandoeningen;
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel29
  - number: 29.1.e
    text: de herkenning van lichamelijke of verstandelijke handicaps;
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel29
  - number: 29.1.f
    text: de beoordeling en aanpak van kindermishandeling;
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel29
  - number: 29.1.g
    text: de aanpak van jeugdige delinquenten;
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel29
  - number: 29.1.h
    text: de juridische aspecten van de haar opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel29
  - number: '29.2'
    text: De stichting heeft kennis van het aanbod van zorg.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel29
  - number: '29.3'
    text: |-
      Indien toepassing is gegeven aan [artikel 68a, eerste lid][ref1], worden de taken waarmee de stichting bij de wet
      is belast, verricht door of onder verantwoordelijkheid van een geregistreerde jeugdprofessional. De stichting houdt
      bij de toedeling van taken rekening met de specifieke kennis en vaardigheden op basis waarvan de geregistreerde
      jeugdprofessional is ingeschreven in het kwaliteitsregister jeugd.


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel68a
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0017751
        artikel: 68a
        hoofdstuk: 12a
        paragraaf: '1'
  - number: '29.4'
    text: |-
      In afwijking van het derde lid, kan de stichting anderen dan geregistreerde jeugdprofessionals met de uitvoering
      van taken belasten indien zij aannemelijk kan maken dat de kwaliteit van de taakuitoefening daardoor niet nadelig
      wordt beïnvloed. Zij belast anderen met die taken indien dit noodzakelijk is voor de kwaliteit van de uitvoering
      van haar taken.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel29
  - number: '29.5'
    text: |-
      De stichting draagt er zorg voor dat geregistreerde jeugdprofessionals hun taken kunnen verrichten met inachtneming
      van de professionele standaarden waaraan zij door de inschrijving in het kwaliteitsregister jeugd zijn gebonden.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel29
  - number: '29.6'
    text: |-
      Bij regeling van Onze Ministers kunnen regels worden gesteld over de opleidings- of deskundigheidseisen van
      medewerkers van de stichting, van beroepskrachten werkzaam bij de stichting alsmede van de deskundigen, bedoeld
      in [artikel 35][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel35
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0017751
        artikel: '35'
        hoofdstuk: '9'
        paragraaf: '3'
  - number: '30.1'
    text: |-
      Ter uitvoering van de taak, bedoeld in [artikel 5, eerste lid, van de wet][ref1], beziet de stichting de problemen
      van een cliënt en de ernst hiervan. Zij onderzoekt hiertoe de psychosociale, psychische of gedragsproblemen, dan
      wel de psychiatrische aandoening van de jeugdige, de problemen van de cliënt, niet zijnde de jeugdige, die het
      onbedreigd opgroeien van de jeugdige belemmeren, en besteedt bovendien aandacht aan de opvoedingssituatie.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel5
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '5'
  - number: '30.2'
    text: |-
      De stichting betrekt in haar onderzoek tevens factoren die de ontwikkeling van de jeugdige gunstig beïnvloeden of
      kunnen beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel30
  - number: '31'
    text: |-
      De stichting beziet hoe de problemen met inzet van jeugdzorg of andere zorg kunnen worden opgelost, verminderd,
      of hoe verergering kan worden voorkomen dan wel op welke wijze de cliënt kan leren omgaan met de gevolgen van deze
      problemen.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel31
  - number: '32'
    text: |-
      Bij de uitvoering van de taken, bedoeld in de [artikelen 5, eerste lid][ref1] en
      [10, eerste lid, onder a tot en met e, van de wet][ref2], vindt een multidisciplinaire beoordeling van de problemen
      plaats, indien de aard van de problematiek dit vergt.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel10
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '10'
  - number: '33'
    text: |-
      Bij regeling van Onze Ministers kunnen nadere regels worden gesteld omtrent de werkwijze van de stichting bij de
      uitvoering van de in de [artikelen 5, eerste lid][ref1], en [10, eerste lid, van de wet][ref2], genoemde taken
      indien het niveau van de uitvoering door de bureaus jeugdzorg dit vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel10
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '10'
  - number: '34.1'
    text: |-
      Het indicatiebesluit komt niet tot stand dan nadat over een ontwerp daarvan in ieder geval overleg is gepleegd met
      de aanvrager en met degene wiens instemming is vereist op grond van [artikel 7, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel7
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '7'
  - number: '34.2'
    text: |-
      In een geval als bedoeld in [artikel 7, zesde lid, onder b, van de wet][ref1] neemt de stichting geen
      indicatiebesluit dan na overleg met het openbaar ministerie of de raad voor de kinderbescherming.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel7
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '7'
  - number: '35'
    text: |-
      In afwijking van [artikel 29, derde lid][ref1], kan de stichting, alvorens het indicatiebesluit te nemen, een
      ontwerp daarvan ter advisering aan een gekwalificeerde gedragswetenschapper voorleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel29
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0017751
        artikel: '29'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: '36.1'
    text: |-
      De stichting laat op verzoek van de cliënt de, bij het opstellen van het indicatiebesluit gebruikte test-
      en onderzoeksgegevens van gedragsdeskundig of psychiatrisch onderzoek, door een deskundige interpreteren en
      van een advies voorzien, tenzij het belang van de jeugdige zich daartegen verzet. Deze deskundige heeft geen
      arbeidsovereenkomst met de stichting en is niet werkzaam bij de stichting op basis van een detacheringsovereenkomst
      en is evenmin bij de behandeling of begeleiding of bij onderzoek van de cliënt betrokken geweest.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel36
  - number: '36.2'
    text: |-
      Uiterlijk veertien dagen nadat de deskundige zijn advies schriftelijk ter kennis heeft gebracht aan de cliënt en de
      stichting, neemt de stichting een indicatiebesluit.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel36
  - number: '36.3'
    text: |-
      Indien het indicatiebesluit afwijkt van het advies van de deskundige, wordt in het besluit de reden van de
      afwijking vermeld.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel36
  - number: '37'
    text: |-
      Indien de stichting ten aanzien van een jeugdige meer dan één van de jeugdbeschermings- en reclasseringstaken
      uitoefent, bevat het plan, bedoeld in [artikel 13, derde lid, van de wet][ref1], een beschrijving van de wijze
      waarop de uitvoering van de verschillende taken op elkaar worden afgestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel13
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '13'
  - number: '38'
    text: |-
      Onverminderd [artikel 10, eerste lid, onder i, van de wet][ref1] stelt de stichting bij beëindiging van de
      jeugdbeschermings- en reclasseringstaken ten aanzien van de jeugdige een rapport op waarin beschreven wordt op
      welke wijze zij haar taak heeft verricht. In het rapport wordt aangegeven of de jeugdige naar het oordeel van de
      stichting, behoefte heeft aan nazorg en op welke wijze hierin kan worden voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel10
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '10'
  - number: '39'
    text: |-
      Bij regeling van Onze Ministers kunnen regels worden gesteld over het verrichten of doen verrichten van een
      gedragsdeskundig of psychiatrisch diagnostisch onderzoek ter voorbereiding van een besluit in het kader van de
      uitvoering van de jeugdbeschermings- en reclasseringstaken, dat een rechterlijke beslissing vereist.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel39
  - number: '40.1'
    text: |-
      De stichting stelt uiterlijk zes weken nadat de voogdij aan haar is opgedragen en zij hiervan in kennis is gesteld,
      een plan vast als bedoeld in [artikel 13, derde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel13
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '13'
  - number: '40.2'
    text: 'Het plan bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel40
  - number: 40.2.a
    text: |-
      een beschrijving van de doelen die met de voogdij worden nagestreefd, zo nodig uitgesplitst in doelen op korte en
      lange termijn,
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel40
  - number: 40.2.b
    text: de wijze waarop deze doelen worden nagestreefd,
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel40
  - number: 40.2.c
    text: een beschrijving van de voorgenomen activiteiten met betrekking tot de minderjarige,
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel40
  - number: 40.2.d
    text: |-
      een vermelding van de wijze waarop de ouders of anderen die de minderjarige als behorend tot hun gezin verzorgen en
      opvoeden, alsmede zijn sociale omgeving zullen worden betrokken bij de werkzaamheden, dan wel een vermelding van de
      redenen waarom dit niet zal gebeuren en
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel40
  - number: 40.2.e
    text: een vermelding van de momenten waarop de voogdij geëvalueerd wordt.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel40
  - number: '40.3'
    text: |-
      In het plan wordt tevens vermeld welke zorg voor de minderjarige dan wel anderen die de minderjarige als behorend
      tot hun gezin verzorgen en opvoeden nodig is, onder vermelding van de wijze waarop de doelen die met de voogdij
      worden nagestreefd, samenhangen met de doelen van de zorg.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel40
  - number: '40.4'
    text: 'Het plan komt niet tot stand en wordt niet gewijzigd dan nadat daarover in ieder geval overleg is gepleegd met:'
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel40
  - number: 40.4.a
    text: de minderjarige, overeenkomstig zijn leeftijds- en ontwikkelingsniveau, en
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel40
  - number: 40.4.b
    text: |-
      de ouders of anderen die de minderjarige als behorend tot hun gezin verzorgen en opvoeden, tenzij dit overleg
      kennelijk schade zal toebrengen aan de minderjarige.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel40
  - number: '40.5'
    text: |-
      Van het overleg en de resultaten daarvan wordt melding gemaakt in het plan. Indien geen overleg mogelijk is, wordt
      hiervan met opgave van redenen melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel40
  - number: '40.6'
    text: Zo vaak als noodzakelijk, doch ten minste één maal per jaar wordt bezien in hoeverre het plan bijstelling behoeft.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel40
  - number: '41.1'
    text: |-
      De stichting wijst binnen vijf dagen nadat de voogdij aan haar is opgedragen en zij hiervan in kennis is gesteld,
      een voogdijwerker aan, en doet hiervan mededeling aan de minderjarige en zijn ouders of anderen die de minderjarige
      als behorend tot hun gezin verzorgen en opvoeden.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel41
  - number: '41.2'
    text: 'In deze mededeling worden tevens opgenomen:'
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel41
  - number: 41.2.a
    text: de datum van het eerste contact van de voogdijwerker met de minderjarige en
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel41
  - number: 41.2.b
    text: de medewerker van de stichting die de voogdijwerker bij afwezigheid vervangt.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel41
  - number: '42.1'
    text: |-
      De stichting houdt zich op de hoogte van de ontwikkeling van de minderjarige die onder haar voogdij staat, de aan
      hem bestede zorg en diens vermogen.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel42
  - number: '42.2'
    text: |-
      Het contact tussen de minderjarige en zijn oorspronkelijk milieu wordt bevorderd, tenzij dit contact kennelijk
      schade zal toebrengen aan de minderjarige.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel42
  - number: '42.3'
    text: |-
      De stichting bevordert dat de minderjarige persoonlijk contact heeft met een persoon buiten de stichting en dat dit
      contact gecontinueerd wordt.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel42
  - number: '42.4'
    text: |-
      De stichting houdt rekening met het belang dat voor de minderjarige kan zijn gelegen in een overgang van het gezag
      naar de ouders dan wel, indien het belang van de minderjarige dit eist, naar een pleegouder of een ander die in
      nauwe persoonlijke betrekking staat tot de minderjarige.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel42
  - number: '43.1'
    text: |-
      De stichting stelt uiterlijk zes weken nadat de minderjarige onder haar toezicht is gesteld en zij hiervan in
      kennis is gesteld, een plan vast als bedoeld in [artikel 13, derde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel13
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '13'
  - number: '43.2'
    text: 'Het plan bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel43
  - number: 43.2.a
    text: |-
      een beschrijving van de doelen die met de ondertoezichtstelling worden nagestreefd, zo nodig uitgesplitst in doelen
      op korte en lange termijn,
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel43
  - number: 43.2.b
    text: de wijze waarop deze doelen worden nagestreefd,
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel43
  - number: 43.2.c
    text: |-
      een beschrijving van de voorgenomen activiteiten met betrekking tot de minderjarige en de met het gezag belaste
      ouder of voogd,
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel43
  - number: 43.2.d
    text: |-
      een vermelding van de wijze waarop de ouders of anderen die de minderjarige als behorend tot hun gezin verzorgen en
      opvoeden, alsmede zijn sociale omgeving zullen worden betrokken bij de werkzaamheden, dan wel een vermelding van de
      redenen waarom dit niet zal gebeuren en
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel43
  - number: 43.2.e
    text: een vermelding van de momenten waarop de ondertoezichtstelling geëvalueerd wordt.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel43
  - number: '43.3'
    text: |-
      In het plan wordt tevens vermeld welke zorg voor de minderjarige, voor de met het gezag belaste ouder, voogd of
      voor anderen die de minderjarige als behorend tot hun gezin verzorgen en opvoeden nodig is, onder vermelding van de
      wijze waarop de doelen die met de ondertoezichtstelling worden nagestreefd, samenhangen met de doelen van de zorg.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel43
  - number: '43.4'
    text: |-
      Indien een minderjarige ten minste achttien maanden buiten het ouderlijke gezin is verzorgd en opgevoed, bevat het
      plan een beschrijving van de doelen van de ondertoezichtstelling op langere termijn waarbij aandacht wordt besteed
      aan de continuïteit van de verblijfplaats van de minderjarige.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel43
  - number: '43.5'
    text: 'Het plan komt niet tot stand en wordt niet gewijzigd dan nadat daarover in ieder geval overleg is gepleegd met:'
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel43
  - number: 43.5.a
    text: de minderjarige, overeenkomstig zijn leeftijds- en ontwikkelingsniveau en
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel43
  - number: 43.5.b
    text: |-
      de met het gezag belaste ouder, voogd of anderen die de minderjarige als behorend tot hun gezin verzorgen en
      opvoeden, tenzij dit overleg kennelijk schade zou toebrengen aan de minderjarige.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel43
  - number: '43.6'
    text: |-
      Van het overleg en de resultaten daarvan wordt melding gemaakt in het plan. Indien geen overleg mogelijk is, wordt
      hiervan met opgave van redenen melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel43
  - number: '43.7'
    text: Zo vaak als noodzakelijk, doch ten minste één maal per jaar wordt bezien in hoeverre het plan bijstelling behoeft.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel43
  - number: '44.1'
    text: |-
      De stichting wijst binnen vijf dagen nadat de minderjarige onder haar toezicht is gesteld en zij hiervan in kennis
      is gesteld, een gezinsvoogdijwerker aan, en doet hiervan mededeling aan de minderjarige en de met het gezag belaste
      ouder of voogd.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel44
  - number: '44.2'
    text: 'In deze mededeling worden tevens opgenomen:'
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel44
  - number: 44.2.a
    text: |-
      de datum van het eerste contact van de gezinsvoogdijwerker met de minderjarige en de met het gezag belaste ouder
      of voogd,
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel44
  - number: 44.2.b
    text: de medewerker van de stichting die de gezinsvoogdijwerker bij diens afwezigheid vervangt,
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel44
  - number: 44.2.c
    text: informatie over de bevoegdheden van de stichting bij de uitoefening van de ondertoezichtstelling en
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel44
  - number: 44.2.d
    text: |-
      de wijze waarop een verzoek als bedoeld in [artikel 259, eerste lid][ref1], [artikel 260, eerste lid][ref2], en
      [artikel 263, tweede lid, van Boek 1 van het Burgerlijk Wetboek][ref3] moet worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel259
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel260
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel263
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '259'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '260'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '263'
  - number: '44.3'
    text: |-
      De stichting kan, al dan niet op verzoek van de minderjarige, de met het gezag belaste ouder of voogd, een andere
      medewerker als gezinsvoogdijwerker aanwijzen.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel44
  - number: '45'
    text: |-
      De stichting beziet bij de uitoefening van de ondertoezichtstelling regelmatig of een ontheffing van de ouders als
      bedoeld in [artikel 268 van Boek 1 van het Burgerlijk Wetboek][ref1] overwogen moet worden. Zodra de stichting tot
      het oordeel komt dat een ontheffing overwogen dient te worden, stelt zij de raad voor de kinderbescherming hiervan
      in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel268
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '268'
  - number: '46.1'
    text: |-
      De stichting stelt uiterlijk zes weken nadat zij een taak, bedoeld in
      [artikel 10, eerste lid, onder c of d, van de wet][ref1] heeft gekregen en zij hiervan in kennis is gesteld, een
      plan vast als bedoeld in [artikel 13, derde lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel13
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '13'
  - number: '46.2'
    text: 'Het plan bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel46
  - number: 46.2.a
    text: |-
      een beschrijving van de doelen die met de jeugdreclassering worden nagestreefd , zo nodig uitgesplitst in doelen op
      korte en lange termijn,
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel46
  - number: 46.2.b
    text: de wijze waarop deze doelen worden nagestreefd,
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel46
  - number: 46.2.c
    text: een beschrijving van de voorgenomen activiteiten met betrekking tot de jeugdige,
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel46
  - number: 46.2.d
    text: |-
      een vermelding van de wijze waarop de ouders, voogd of anderen die de jeugdige als behorend tot hun gezin verzorgen
      en opvoeden, alsmede zijn sociale omgeving zal worden betrokken bij de werkzaamheden, dan wel een vermelding van de
      redenen waarom dit niet zal gebeuren en
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel46
  - number: 46.2.e
    text: een vermelding van de momenten waarop de wijze waarop de jeugdreclassering wordt uitgevoerd, geëvalueerd wordt.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel46
  - number: '46.3'
    text: |-
      In het plan wordt tevens vermeld welke zorg voor de jeugdige, voor de met het gezag belaste ouder, voogd of voor
      anderen die de jeugdige als behorend tot hun gezin verzorgen en opvoeden nodig is, onder vermelding van de wijze
      waarop de doelen die met de jeugdreclassering worden nagestreefd, samenhangen met de doelen van de zorg.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel46
  - number: '46.4'
    text: 'Het plan komt niet tot stand en wordt niet gewijzigd dan nadat daarover in ieder geval overleg is gepleegd met:'
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel46
  - number: 46.4.a
    text: de jeugdige;
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel46
  - number: 46.4.b
    text: |-
      de ouders, voogd of anderen die de jeugdige als behorend tot hun gezin verzorgen en opvoeden, tenzij dit overleg
      kennelijk schade zal toebrengen aan de jeugdige.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel46
  - number: '46.5'
    text: |-
      Van het overleg en de resultaten daarvan wordt melding gemaakt in het plan. Indien geen overleg mogelijk is, wordt
      hiervan met opgave van redenen melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel46
  - number: '46.6'
    text: Zo vaak als noodzakelijk, doch ten minste één maal per jaar wordt bezien in hoeverre het plan bijstelling behoeft.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel46
  - number: '47.1'
    text: |-
      De stichting wijst binnen vijf dagen nadat zij een taak, bedoeld in
      [artikel 10, eerste lid, onder c of d van de wet][ref1] heeft gekregen en zij daarvan op de hoogte is gesteld, een
      jeugdreclasseringswerker aan, en doet hiervan mededeling aan de jeugdige en de met het gezag belaste ouder, voogd
      of anderen die de jeugdige als behorend tot hun gezin verzorgen en opvoeden.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel10
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '10'
  - number: '47.2'
    text: 'In deze mededeling wordt tevens opgenomen:'
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel47
  - number: 47.2.a
    text: |-
      de datum van het eerste contact van de jeugdige met de jeugdreclasseringswerker dat uiterlijk vijf dagen nadat de
      stichting de taak als bedoeld in eerste lid heeft gekregen, plaats vindt en
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel47
  - number: 47.2.b
    text: de medewerker die de jeugdreclasseringswerker bij afwezigheid vervangt.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel47
  - number: '48.1'
    text: |-
      Onverminderd de aan de raad voor de kinderbescherming toekomende taken en bevoegdheden, voldoet de
      jeugdreclassering aan verzoeken van de rechter en het openbaar ministerie om advies omtrent een jeugdige die wordt
      verdacht van een strafbaar feit of die op grond daarvan is veroordeeld.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel48
  - number: '48.2'
    text: |-
      De jeugdreclassering brengt voor zover het de uitvoering betreft van de taak, bedoeld in
      [artikel 10, eerste lid, onder c en d][ref1], geregeld verslag uit aan het openbaar ministerie dat is belast met
      het toezicht op de naleving van de voorwaarden, over de wijze waarop de jeugdige zich houdt aan de voorwaarden door
      de rechter of het openbaar ministerie opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel10
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '10'
  - number: '48.3'
    text: |-
      Indien de jeugdige een opgelegde voorwaarde niet of niet geheel nakomt, meldt de jeugdreclassering dit onverwijld
      aan het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel48
  - number: '48.4'
    text: |-
      De jeugdreclassering zendt de raad voor de kinderbescherming een afschrift van het verslag, bedoeld in het tweede
      lid en de melding, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel48
  - number: '49.1'
    text: |-
      Onverminderd [artikel 60, vierde lid][ref1], legt de stichting de wijze van samenwerking van de jeugdreclassering
      met de politie, de rechter, het openbaar ministerie, de volwassenenreclassering, inrichtingen en de raad voor de
      kinderbescherming vast in een protocol.


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel60
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0017751
        artikel: '60'
        hoofdstuk: '10'
  - number: '49.2'
    text: 'In het protocol wordt in ieder geval vastgelegd:'
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel49
  - number: 49.2.a
    text: |-
      een vermelding van welke functionaris het aanspreekpunt is van de jeugdreclassering voor vragen die casuïstiek
      overstijgen;
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel49
  - number: 49.2.b
    text: |-
      een beschrijving van de wijze waarop taken van de jeugdreclassering en die van de in het eerste lid bedoelde
      instanties worden uitgeoefend voor zover deze samenhangen of gelijktijdig plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel49
  - number: 49.2.c
    text: |-
      de wijze waarop en de termijn waarbinnen de instanties, bedoeld in het eerste lid, over individuele zaken worden
      geïnformeerd.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel49
  - number: '50.1'
    text: |-
      De stichting legt de wijze waarop de herkenbaarheid en toegankelijkheid van een advies- en meldpunt
      kindermishandeling binnen het bureau jeugdzorg is georganiseerd, schriftelijk vast.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel50
  - number: '50.2'
    text: |-
      De stichting draagt er zorg voor dat het advies- en meldpunt kindermishandeling is aangesloten op het daartoe
      bestemde landelijke telefoonnummer.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel50
  - number: '51'
    text: |-
      Een bij de stichting werkzame persoon die taken uitvoert van een advies- en meldpunt kindermishandeling is niet
      belast met de uitvoering van andere taken van de stichting betreffende een geval van kindermishandeling waarbij
      deze rechtstreeks betrokken was.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel51
  - number: '52'
    text: |-
      Bij een advies- en meldpunt kindermishandeling is in ieder geval een arts werkzaam. Deze arts is deskundig op het
      gebied van kindermishandeling.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel52
  - number: '53'
    text: |-
      Onverminderd [artikel 27][ref1], draagt de stichting er zorg voor dat aan iedere betrokkene bij een advies, melding
      of onderzoek naar aanleiding van een melding bij het eerste contact informatie wordt verschaft over de procedure
      met betrekking tot een advies, melding of onderzoek, de verwerking van persoonsgegevens, met inachtneming van
      de [artikelen 43][ref2], [53][ref3] en [54 van de wet][ref4], het recht op inzage in of afschrift van de hem
      betreffende bescheiden alsmede de wijze van behandeling van klachten. Als betrokkenen worden aangemerkt degene die
      advies vraagt, degene die een melding doet, degene op wie een melding betrekking heeft en degene die om informatie
      in het kader van een onderzoek naar aanleiding van een melding wordt verzocht.


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel43
      [ref3]: https://wetten.overheid.nl/BWBR0016637#Artikel53
      [ref4]: https://wetten.overheid.nl/BWBR0016637#Artikel54
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0017751
        artikel: '27'
        hoofdstuk: '9'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '43'
      - id: ref3
        bwb_id: BWBR0016637
        artikel: '53'
      - id: ref4
        bwb_id: BWBR0016637
        artikel: '54'
  - number: '54.1'
    text: |-
      Een advies- en meldpunt kindermishandeling stelt binnen vijf dagen na ontvangst van een melding vast of de melding
      in onderzoek wordt genomen.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel54
  - number: '54.2'
    text: |-
      Een advies- en meldpunt kindermishandeling oordeelt binnen dertien weken na de vaststelling, bedoeld in het eerste
      lid, of en zo ja tot welke stappen de melding aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel54
  - number: '54.3'
    text: |-
      Onverminderd [artikel 32][ref1] vindt besluitvorming omtrent een melding plaats door ten minste twee bij de
      stichting werkzame personen die taken uitvoeren van een advies- en meldpunt kindermishandeling.


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel32
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0017751
        artikel: '32'
        hoofdstuk: '9'
        paragraaf: '3'
  - number: '55.1'
    text: |-
      In dit artikel wordt onder persoonsgegeven verstaan hetgeen daaronder wordt verstaan in de
      [Wet bescherming persoonsgegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0011468
  - number: '55.2'
    text: |-
      Een advies- en meldpunt kindermishandeling verstrekt aan degene op de persoonsgegevens betrekking hebben,
      inlichtingen over de herkomst van de persoonsgegevens die het naar aanleiding van een melding verkrijgt.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel55
  - number: '55.3'
    text: |-
      In afwijking van het tweede lid verstrekt het advies- en meldpunt kindermishandeling geen inlichtingen over de
      herkomst van persoonsgegevens die het naar aanleiding van een melding heeft verkregen indien:
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel55
  - number: 55.3.a
    text: |-
      een persoon die in een beroepsmatige, hulpverlenende of pedagogische relatie tot de minderjarige of zijn gezin
      staat, de persoonsgegevens naar aanleiding van een melding heeft verstrekt en het verstrekken van die inlichtingen:
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel55
  - number: 55.3.a.1°
    text: |-
      een bedreiging vormt of kan vormen voor de minderjarige of andere minderjarige leden van het gezin waartoe de
      minderjarige behoort;
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel55
  - number: 55.3.a.2°
    text: een bedreiging vormt of kan vormen voor die persoon of medewerkers van die persoon;
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel55
  - number: 55.3.a.3°
    text: leidt of kan leiden tot een verstoring van de vertrouwensrelatie met het gezin waartoe de minderjarige behoort;
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel55
  - number: 55.3.b
    text: het andere personen betreft dan die bedoeld onder a, behoudens voor zover zij daarvoor toestemming hebben gegeven.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel55
  - number: 55a
    text: |-
      In dit hoofdstuk wordt verstaan onder: - *klachtencommissie:* klachtencommissie, bedoeld in
      [artikel 68 van de wet][ref1], voor zover deze klachten behandelt over een beslissing als bedoeld in
      [artikel 29w, eerste lid, van de wet][ref2] of over de toepassing van [artikel 29t van de wet][ref3];
        - *klacht:* klacht als bedoeld in [artikel 29w, eerste lid, van de wet][ref4].
        - *klager:* degene die een klacht als bedoeld in [artikel 29w, eerste lid van de wet][ref5], indient.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel29w
      [ref3]: https://wetten.overheid.nl/BWBR0016637#Artikel29t
      [ref4]: https://wetten.overheid.nl/BWBR0016637#Artikel29w
      [ref5]: https://wetten.overheid.nl/BWBR0016637#Artikel29w
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel55a
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '68'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: 29w
      - id: ref3
        bwb_id: BWBR0016637
        artikel: 29t
      - id: ref4
        bwb_id: BWBR0016637
        artikel: 29w
      - id: ref5
        bwb_id: BWBR0016637
        artikel: 29w
  - number: 55b
    text: |-
      Indien de klager daarom verzoekt, wordt de klacht ter kennis gebracht van één lid van de klachtencommissie teneinde
      terzake te bemiddelen.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel55b
  - number: 55c.1
    text: De klager kan zich doen bijstaan door een vertrouwenspersoon.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel55c
  - number: 55c.2
    text: |-
      Indien de klager de Nederlandse taal onvoldoende beheerst, draagt de voorzitter van de klachtencommissie zorg voor
      de bijstand van een tolk.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel55c
  - number: 55d
    text: 'Van de klachtencommissie maken in ieder geval deel uit:'
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel55d
  - number: 55d.a
    text: een jurist,
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel55d
  - number: 55d.b
    text: |-
      een gekwalificeerde gedragswetenschapper of, indien toepassing is gegeven aan [artikel 68a, eerste lid][ref1], een
      gedragswetenschapper die is opgenomen in het kwaliteitsregister jeugd, alsmede


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel68a
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel55d
    references:
      - id: ref1
        bwb_id: BWBR0017751
        artikel: 68a
        hoofdstuk: 12a
        paragraaf: '1'
  - number: 55d.c
    text: |-
      een arts, indien het een klacht betreft tegen een geneeskundige behandelingsmethode als bedoeld in
      [artikel 29p, derde lid, van de wet][ref1], niet zijnde een behandeling van een stoornis van de geestvermogens
      of een psychiater, indien het een klacht betreft tegen een geneeskundige behandelingsmethode als bedoeld
      in [artikel 29p, derde lid, van de wet][ref2] indien het gaat om een behandeling van een stoornis van de
      geestvermogens.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel29p
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel29p
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel55d
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: 29p
      - id: ref2
        bwb_id: BWBR0016637
        artikel: 29p
  - number: '56'
    text: |-
      Indien sprake is van een acute en ernstig bedreigende situatie voor de minderjarige stelt de stichting de raad voor
      de kinderbescherming onverwijld in kennis van haar oordeel dat een maatregel met betrekking tot het gezag over de
      minderjarige overwogen dient te worden.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel56
  - number: '57.1'
    text: |-
      De raad voor de kinderbescherming neemt een geval waarbij een maatregel met betrekking tot het gezag over de
      minderjarige overwogen dient te worden, slechts in onderzoek indien de stichting hem van een dergelijk geval in
      kennis heeft gesteld.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel57
  - number: '57.2'
    text: |-
      In afwijking van het eerste lid, neemt de raad voor de kinderbescherming een geval als bedoeld in het eerste lid
      zonder kennisgeving van de stichting in onderzoek, indien:
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel57
  - number: 57.2.a
    text: er sprake is van een acute en ernstig bedreigende situatie voor de minderjarige of
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel57
  - number: 57.2.b
    text: |-
      bij de uitvoering van enige andere wettelijke taak blijkt dat er sprake is van een geval waarbij een maatregel met
      betrekking tot het gezag over de minderjarige overwogen dient te worden.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel57
  - number: '57.3'
    text: |-
      Indien een ander dan de stichting de raad voor de kinderbescherming in kennis stelt van een geval waarbij naar
      diens oordeel, een maatregel met betrekking tot het gezag over de minderjarige overwogen dient te worden, zendt de
      raad de kennisgeving onverwijld en onder gelijktijdige mededeling daarvan aan de melder, door aan de stichting die
      werkzaam is in de provincie waarin de jeugdige duurzaam verblijft, tenzij de kennisgeving betrekking heeft op een
      geval als bedoeld in het tweede lid, onder a.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel57
  - number: '58.1'
    text: |-
      De raad voor de kinderbescherming doet van het in onderzoek nemen van een geval waarbij een maatregel met
      betrekking tot het gezag over een minderjarige overwogen wordt, onverwijld mededeling aan de stichting die werkzaam
      is in de provincie waarin de minderjarige duurzaam verblijft.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel58
  - number: '58.2'
    text: De raad voor de kinderbescherming informeert de stichting over de resultaten van het onderzoek.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel58
  - number: '59.1'
    text: |-
      De stichting informeert de minderjarige en de met het gezag belaste ouder uiterlijk op het moment dat zij de raad
      voor de kinderbescherming in kennis stelt van haar oordeel dat een maatregel met betrekking tot het gezag over een
      minderjarige overwogen dient te worden, tenzij dit kennelijk een bedreiging vormt voor de minderjarige.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel59
  - number: '59.2'
    text: |-
      Indien de stichting de minderjarige en de met het gezag belaste ouder niet informeert, wordt in de kennisgeving aan
      de raad voor de kinderbescherming hiervan de reden vermeld.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel59
  - number: '60.1'
    text: De stichting en de raad voor de kinderbescherming leggen de wijze van samenwerken vast in een protocol.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel60
  - number: '60.2'
    text: |-
      In het protocol worden met betrekking tot de [artikelen 56 tot en met 59][ref1] in ieder geval vastgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel56
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0017751
        artikel: '56'
        hoofdstuk: '10'
  - number: 60.2.a
    text: |-
      de wijze waarop de stichting de kennisgeving van een geval als bedoeld in [artikel 56][ref1] doet,


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel56
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0017751
        artikel: '56'
        hoofdstuk: '10'
  - number: 60.2.b
    text: |-
      een beschrijving van de gegevens die de stichting verstrekt bij de kennisgeving op grond waarvan de raad voor de
      kinderbescherming een beslissing kan nemen of hij het geval in onderzoek neemt,
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel60
  - number: 60.2.c
    text: |-
      de wijze waarop de raad voor de kinderbescherming zijn beslissing over het in onderzoek nemen van een geval aan de
      stichting kenbaar maakt,
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel60
  - number: 60.2.d
    text: |-
      een beschrijving van de werkwijze van de stichting en de raad voor de kinderbescherming voor zover de werkwijze
      samenhangt of gelijktijdig plaatsvindt en
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel60
  - number: 60.2.e
    text: de wijze waarop de raad voor de kinderbescherming de stichting informeert over de resultaten van zijn onderzoek.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel60
  - number: '60.3'
    text: 'In het protocol worden met betrekking tot het indicatiebesluit in ieder geval vastgelegd:'
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel60
  - number: 60.3.a
    text: |-
      de procedure die de stichting hanteert bij het nemen van een indicatiebesluit
      ingeval de raad voor de kinderbescherming voornemens is een machtiging als bedoeld in
      [artikel 261, eerste lid, van Boek 1 van het Burgerlijk Wetboek][ref1] te verzoeken en;


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel261
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '261'
  - number: 60.3.b
    text: |-
      een beschrijving van de criteria op grond waarvan de raad voor de kinderbescherming een indicatiebesluit in de
      gevallen, bedoeld in [artikel 7, zesde lid, onder b, van de wet][ref1], verzoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel7
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '7'
  - number: '60.4'
    text: 'In het protocol wordt met betrekking tot de jeugdreclassering in ieder geval vastgelegd:'
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel60
  - number: 60.4.a
    text: |-
      een omschrijving van de criteria op grond waarvan de raad voor de kinderbescherming zijn bevoegdheid, bedoeld in
      [artikel 10, tweede lid, van de wet][ref1], gebruikt en;


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel10
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '10'
  - number: 60.4.b
    text: |-
      de wijze van samenwerking in het kader van de taak, bedoeld in [artikel 77hh van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77hh
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77hh
  - number: '61.1'
    text: |-
      Op een door Onze Minister van Veiligheid en Justitie aanvaarde rechtspersoon, bedoeld in de
      [artikelen 254, tweede lid][ref1], en [302, tweede lid, van Boek 1 van het Burgerlijk Wetboek][ref2] zijn
      de [artikelen 26][ref3], [27][ref4], [29, eerste lid, onder b en h][ref5], en [38 tot en met 45][ref6] van
      overeenkomstige toepassing, met dien verstande dat de wijze van uitvoering van de taken door de rechtspersoon past
      bij de aard van het verblijf van de minderjarige en zijn verwachte verblijfsduur.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel254
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel302
      [ref3]: https://wetten.overheid.nl/BWBR0017751#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0017751#Artikel27
      [ref5]: https://wetten.overheid.nl/BWBR0017751#Artikel29
      [ref6]: https://wetten.overheid.nl/BWBR0017751#Artikel38
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '254'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '302'
      - id: ref3
        bwb_id: BWBR0017751
        artikel: '26'
        hoofdstuk: '9'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0017751
        artikel: '27'
        hoofdstuk: '9'
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0017751
        artikel: '29'
        hoofdstuk: '9'
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0017751
        artikel: '38'
        hoofdstuk: '9'
        paragraaf: '4'
  - number: '61.2'
    text: |-
      De rechtspersoon, bedoeld in het eerste lid, die de voogdij uitoefent over een minderjarige zorgt dat die
      minderjarige wordt ondergebracht:
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel61
  - number: 61.2.a
    text: bij meerderjarige familieleden;
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel61
  - number: 61.2.b
    text: in een pleeggezin;
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel61
  - number: 61.2.c
    text: in speciale centra voor minderjarigen, of
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel61
  - number: 61.2.d
    text: in andere voor minderjarige geschikte tehuizen.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel61
  - number: '62'
    text: |-
      Voor de toepassing van dit hoofdstuk is onder stichting mede begrepen een rechtspersoon als bedoeld in de
      [artikelen 254, tweede lid][ref1], en [302, tweede lid, van Boek 1 van het Burgerlijk Wetboek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel254
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel302
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '254'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '302'
  - number: '63'
    text: |-
      Het verlenen door de vertrouwenspersoon van ondersteuning in aangelegenheden samenhangend met de door de stichting
      uitgeoefende taken onderscheidenlijk aangelegenheden samenhangend met de door de zorgaanbieder geboden jeugdzorg,
      bedoeld in [artikel 1, eerste lid, van de wet][ref1], is met name gericht op de uitoefening door de cliënt van
      zijn rechten.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel1
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '1'
  - number: '64'
    text: |-
      De stichting onderscheidenlijk de zorgaanbieder deelt aan cliënten mee dat een vertrouwenspersoon aan hen op hun
      verzoek de in [artikel 63][ref1] bedoelde ondersteuning kan verlenen, wat deze taak inhoudt, en op welke plaats en
      tijdstippen de vertrouwenspersoon voor cliënten bereikbaar en beschikbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel63
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0017751
        artikel: '63'
        hoofdstuk: '12'
  - number: '65'
    text: |-
      De vertrouwenspersoon heeft vrije toegang tot de gebouwen van de stichting en de gebouwen, terreinen en ruimten van
      de zorgaanbieder waar jeugdigen kunnen verblijven, een en ander voor zover dit voor een juiste uitoefening van zijn
      taak nodig is. De vertrouwenspersoon behoeft geen toestemming van derden om met een jeugdige te spreken.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel65
  - number: '66'
    text: |-
      Onverminderd het bij of krachtens de wet bepaalde worden aan de vertrouwenspersoon alle inlichtingen verschaft en
      bescheiden getoond die deze voor een juiste uitoefening van zijn taak nodig heeft.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel66
  - number: '67'
    text: |-
      Aan de vertrouwenspersoon worden door de stichting of de zorgaanbieder de faciliteiten verschaft die deze voor een
      juiste uitoefening van zijn taak nodig heeft. Daartoe behoren in ieder geval een eigen werkruimte met telefoon en
      computer en een voorziening waardoor gegevens omtrent cliënten waaraan de vertrouwenspersoon ondersteuning verleent
      op voor anderen niet toegankelijke wijze kunnen worden bewaard.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel67
  - number: '68'
    text: |-
      De vertrouwenspersoon die ondersteuning verleent aan een cliënt, onthoudt zich van ondersteuning van anderen indien
      zulks een onafhankelijke taakuitoefening jegens die cliënt in gevaar kan brengen.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel68
  - number: 68a.1
    text: |-
      Onze Ministers kunnen op aanvraag van de beheerder van een beroepsregister voor jeugdzorg dat register als enig
      kwaliteitsregister jeugd erkennen.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel68a
  - number: 68a.2
    text: |-
      De beheerder van het kwaliteitsregister jeugd heeft de rechtsvorm, bedoeld in
      [artikel 285, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel285
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel68a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '285'
  - number: 68b
    text: |-
      De erkenning, bedoeld in [artikel 68a, eerste lid][ref1], vindt slechts plaats indien het
      beroepsregister voor jeugdzorg onderscheidenlijk de beheerder van die stichting voldoen aan de in de
      [artikelen 68d tot en met 68l][ref2] gestelde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel68a
      [ref2]: https://wetten.overheid.nl/BWBR0017751#Artikel68d
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel68b
    references:
      - id: ref1
        bwb_id: BWBR0017751
        artikel: 68a
        hoofdstuk: 12a
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0017751
        artikel: 68d
        hoofdstuk: 12a
        paragraaf: '2'
  - number: 68c.1
    text: |-
      Een erkenning als bedoeld in [artikel 68a, eerste lid][ref1], kan door Onze Ministers worden ingetrokken:


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel68a
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel68c
    references:
      - id: ref1
        bwb_id: BWBR0017751
        artikel: 68a
        hoofdstuk: 12a
        paragraaf: '1'
  - number: 68c.1.a
    text: indien de registerstichting niet of niet langer voldoet aan de bij dit besluit gestelde eisen;
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel68c
  - number: 68c.1.b
    text: indien de registerstichting handelt in strijd met de in dit hoofdstuk neergelegde erkenningsvoorwaarden;
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel68c
  - number: 68c.1.c
    text: indien de registerstichting niet naar behoren functioneert;
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel68c
  - number: 68c.1.d
    text: op verzoek van de registerstichting.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel68c
  - number: 68c.2
    text: Onze Ministers kunnen in het belang van de jeugdzorg een termijn vaststellen waarop de intrekking zal plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel68c
  - number: 68d.1
    text: |-
      De leden van het bestuur van de registerstichting worden benoemd op voordracht van beroepsverenigingen waarbij
      beroepsbeoefenaren zijn aangesloten die van relevant belang zijn voor de beroepsuitoefening binnen de jeugdzorg.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel68d
  - number: 68d.2
    text: |-
      De statuten van de registerstichting regelen de mogelijkheid tot aanwijzing van andere beroepsverenigingen van
      relevant belang voor de beroepsuitoefening binnen de jeugdzorg, die gerechtigd zijn tot een voordracht van leden
      van het bestuur.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel68d
  - number: 68e
    text: |-
      De statuten van de registerstichting regelen op afdoende wijze dat de leden van het bestuur, dan wel leden van
      andere organen van de registerstichting geen functies vervullen die onverenigbaar, strijdig zijn of strijdig kunnen
      zijn met de belangen of doelstellingen van de registerstichting.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel68e
  - number: 68f.1
    text: |-
      De statuten van de registerstichting voorzien in een raad van advies, bestaande uit leden die in ieder geval
      organisaties van werkgevers en cliënten vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel68f
  - number: 68f.2
    text: 'De raad van advies heeft in ieder geval het recht advies uit te brengen over:'
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel68f
  - number: 68f.2.a
    text: de voorwaarden voor registratie en herregistratie;
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel68f
  - number: 68f.2.b
    text: |-
      een aanwijzing als bedoeld in [artikel 68d, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel68d
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel68f
    references:
      - id: ref1
        bwb_id: BWBR0017751
        artikel: 68d
        hoofdstuk: 12a
        paragraaf: '2'
  - number: 68f.2.c
    text: de samenstelling van de raad van advies.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel68f
  - number: 68f.3
    text: |-
      De statuten voorzien erin dat van een door de raad van advies uitgebracht advies slechts schriftelijk en
      gemotiveerd kan worden afgeweken nadat over het advies een op overeenstemming gericht overleg heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel68f
  - number: 68g
    text: 'De registerstichting:'
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel68g
  - number: 68g.a
    text: |-
      regelt dat het kwaliteitsregister jeugd slechts toegankelijk is voor beroepsbeoefenaren die behoren tot bij een van
      de voordragende beroepsverenigingen aangesloten categorieën van beroepsbeoefenaren;
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel68g
  - number: 68g.b
    text: hanteert niet het vereiste van lidmaatschap van een beroepsvereniging voor opname in het kwaliteitsregister jeugd.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel68g
  - number: 68h
    text: |-
      De registerstichting stelt het register open voor de inschrijving van beroepsbeoefenaren die minimaal op het
      niveau van een hogere beroepsopleiding scholing hebben afgerond die is gericht op het vervullen van een beroep in
      de jeugdzorg.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel68h
  - number: 68i.1
    text: 'De registerstichting regelt dat:'
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel68i
  - number: 68i.1.a
    text: registratie en herregistratie op zorgvuldige wijze plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel68i
  - number: 68i.1.b
    text: de registratie een geldigheid heeft van een door de registerstichting vast te stellen, bepaalde duur;
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel68i
  - number: 68i.1.c
    text: |-
      herregistratie plaatsvindt op voorwaarde dat de betrokkene in de periode, bedoeld onder b, heeft voldaan aan door
      de registerstichting te stellen eisen van werkervaring en van na- en bijscholing.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel68i
  - number: 68i.2
    text: |-
      De registerstichting regelt voorts dat voorafgaand aan de wijziging van de eisen van registratie aan een
      beroepsbeoefenaar overleg wordt gevoerd met de beroepsverenigingen, bedoeld in [artikel 68d, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel68d
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel68i
    references:
      - id: ref1
        bwb_id: BWBR0017751
        artikel: 68d
        hoofdstuk: 12a
        paragraaf: '2'
  - number: 68j.1
    text: |-
      De registerstichting waarborgt dat de in het kwaliteitsregister jeugd opgenomen beroepsbeoefenaren dienen te
      handelen volgens voor hen geldende professionele standaarden.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel68j
  - number: 68j.2
    text: |-
      De statuten van de registerstichting voorzien in de binding van de geregistreerde beroepsbeoefenaren aan
      een adequaat systeem van normhandhaving op grond waarvan passende maatregelen kunnen worden genomen tegen
      beroepsbeoefenaren die niet voldoen aan professionele standaarden, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel68j
  - number: 68k
    text: |-
      De door de registerstichting in rekening te brengen kosten voor de registratie worden zodanig vastgesteld
      dat de baten niet uitgaan boven de kosten die redelijkerwijs noodzakelijk zijn voor de verwezenlijking van de
      doelstellingen van de registerstichting.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel68k
  - number: 68l
    text: |-
      De registerstichting regelt dat het register voor een ieder kosteloos raadpleegbaar is. Zij regelt voorts dat
      maatregelen als bedoeld in [artikel 68j, tweede lid][ref1], gedurende een door haar vast te stellen periode voor
      het publiek kenbaar zijn. Zij houdt daarbij rekening met de aard van de maatregelen, de verwijtbaarheid van het
      handelen en met het belang van degenen die daarvan kennis kunnen nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel68j
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel68l
    references:
      - id: ref1
        bwb_id: BWBR0017751
        artikel: 68j
        hoofdstuk: 12a
        paragraaf: '4'
  - number: 68m
    text: |-
      Na de beëindiging van de erkenning verleent de registerstichting alle medewerking die noodzakelijk is voor de
      overdracht van taken aan een andere, door Onze Ministers aan te wijzen organisatie.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel68m
  - number: 68n.1
    text: |-
      De registerstichting verstrekt aan Onze Ministers kosteloos op verzoek alle in haar bezit zijnde, op de op
      het functioneren van de registerstichting of het kwaliteitsregister jeugd betrekking hebbende informatie die
      redelijkerwijs noodzakelijk is om te beoordelen of de registerstichting of het kwaliteitsregister jeugd voldoet aan
      de bij dit besluit gestelde eisen, dan wel de informatie die redelijkerwijs noodzakelijk is om ten minste inzicht
      te krijgen in de aantallen registraties, de aard van de registraties en de ontwikkelingen rond het systeem van
      normhandhaving, bedoeld in [artikel 68j, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel68j
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel68n
    references:
      - id: ref1
        bwb_id: BWBR0017751
        artikel: 68j
        hoofdstuk: 12a
        paragraaf: '4'
  - number: 68n.2
    text: De registerstichting meldt voorgenomen wijzingen van haar statuten aan Onze Ministers.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel68n
  - number: 68o.1
    text: |-
      De registerstichting stelt jaarlijks een verslag op met betrekking tot de uitvoering van de met dit besluit
      samenhangende werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel68o
  - number: 68o.2
    text: |-
      Het jaarverslag bevat in ieder geval een beschrijving van de werkzaamheden, bedoeld in het eerste lid, en geven
      inzicht in:
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel68o
  - number: 68o.2.a
    text: de voorbereiding en uitvoering van de werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel68o
  - number: 68o.2.b
    text: de kwaliteit van de daarbij gevolgde procedures;
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel68o
  - number: 68o.2.c
    text: de behandeling van personen en instellingen die met de registerstichting in aanraking komen; en
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel68o
  - number: 68o.2.d
    text: |-
      de werkzaamheden, samenhangend met [68j, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel68j
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel68o
    references:
      - id: ref1
        bwb_id: BWBR0017751
        artikel: 68j
        hoofdstuk: 12a
        paragraaf: '4'
  - number: 68o.3
    text: Het jaarverslag geeft tevens cijfermatig inzicht in de gegevens, bedoeld in het tweede lid, onder a, c en d.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel68o
  - number: 68o.4
    text: |-
      De registerstichting zendt het jaarverslag voor 1 april aan Onze Ministers en de beroepsverenigingen, bedoeld in
      [artikel 68d, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel68d
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel68o
    references:
      - id: ref1
        bwb_id: BWBR0017751
        artikel: 68d
        hoofdstuk: 12a
        paragraaf: '2'
  - number: 68o.5
    text: |-
      Het jaarverslag gaat vergezeld van een verklaring van een accountant die is ingeschreven in het register, bedoeld
      in [artikel 36, eerste lid, van de Wet toezicht accountantsorganisaties][ref1]. In de verklaring:


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel36
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel68o
    references:
      - id: ref1
        bwb_id: BWBR0019468
        artikel: '36'
  - number: 68o.5.a
    text: wordt mededeling gedaan omtrent de getrouwheid van het jaarverslag; en
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel68o
  - number: 68o.5.b
    text: |-
      wordt er blijk van gegeven dat de accountant heeft onderzocht of de registerstichting, onderscheidenlijk het
      kwaliteitsregister, heeft voldaan aan de bij dit besluit gestelde verplichtingen en wat daarvan de bevindingen
      zijn.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel68o
  - number: 68p
    text: |-
      Van de erkenning, bedoeld in [artikel 68a, eerste lid][ref1], en de intrekking van de erkenning, bedoeld in
      [artikel 68c, eerste lid][ref2], wordt mededeling gedaan in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel68a
      [ref2]: https://wetten.overheid.nl/BWBR0017751#Artikel68c
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel68p
    references:
      - id: ref1
        bwb_id: BWBR0017751
        artikel: 68a
        hoofdstuk: 12a
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0017751
        artikel: 68c
        hoofdstuk: 12a
        paragraaf: '1'
  - number: 68q
    text: |-
      De bevoegdheid van de Inspectie jeugdzorg, bedoeld in [artikel 47, tiende lid, van de wet][ref1], is beperkt tot
      het kwaliteitsregister jeugd.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel47
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel68q
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '47'
  - number: '69'
    text: |-
      Als vorm van zorg waarvoor een bijdrage als bedoeld in de [artikelen 69][ref1] en [70 van de wet][ref2] is
      verschuldigd, wordt aangewezen een tot gelding gebrachte aanspraak op verblijf.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel70
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '69'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '70'
  - number: '70'
    text: 'De hoogte van de ouderbijdrage in de kosten van verblijf is:'
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel70
  - number: 70.a
    text: 'indien het verblijf gedurende het etmaal betreft:'
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel70
  - number: 70.a.1°
    text: 'van een jeugdige van 0 tot en met 5 jaar: € 63,78  per maand;'
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel70
  - number: 70.a.2°
    text: 'van een jeugdige van 6 tot en met 11 jaar: € 87,70  per maand;'
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel70
  - number: 70.a.3°
    text: 'van een jeugdige van 12 tot en met 20 jaar: € 111,61  per maand;'
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel70
  - number: 70.b
    text: |-
      indien het verblijf gedurende een deel van een etmaal betreft: de helft van het voor de jeugdige ingevolge in het
      eerste lid geldende bedrag per maand.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel70
  - number: '71'
    text: |-
      Bij ministeriële regeling worden de bedragen, genoemd in [artikel 70, onder a][ref1], jaarlijks met ingang van 1
      januari opnieuw vastgesteld aan de hand van de consumentenprijsindex.


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel70
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0017751
        artikel: '70'
        hoofdstuk: '13'
  - number: 71a
    text: |-
      Het bedrag per maand, bedoeld in [artikel 71, eerste lid, onder e, van de wet][ref1], wordt vastgesteld op
      € 226,89.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel71
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel71a
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '71'
  - number: 71b
    text: |-
      Het Landelijk Bureau Inning Onderhoudsbijdragen kan de verschuldigde ouderbijdrage slechts buiten invordering
      stellen indien het betreft een bijdrageplichtige die:
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel71b
  - number: 71b.a
    text: |-
      algemene bijstand ontvangt op grond van [artikel 20, eerste lid][ref1], of
      [artikel 23, eerste lid, onder a, van de Wet werk en bijstand][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel23
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel71b
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '23'
  - number: 71b.b
    text: |-
      een verstrekking ontvangt als bedoeld in
      __REF000___________________________________________________________________________________________________________
      _ en geen ander inkomen heeft;


      [ref1]: https://wetten.overheid.nl/BWBR0017959#Artikel9
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel71b
    references:
      - id: ref1
        bwb_id: BWBR0017959
        artikel: '9'
  - number: 71b.c
    text: |-
      zak- en kleedgeld ontvangt op grond van [artikel 41 van het Reglement verpleging ter beschikking gestelden][ref1]
      of;


      [ref1]: https://wetten.overheid.nl/BWBR0008690#Artikel41
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel71b
    references:
      - id: ref1
        bwb_id: BWBR0008690
        artikel: '41'
  - number: 71b.d
    text: |-
      rechtens zijn vrijheid is ontnomen en de tenuitvoerlegging van de vrijheidsstraf of vrijheidsbenemende maatregel
      plaatsvindt in een penitentiaire inrichting, in een inrichting voor de verpleging van ter beschikking gestelden,
      in een inrichting als bedoeld in [artikel 1, onderdeel b, van de Beginselenwet justitiële jeugdinrichtingen][ref1]
      of in een psychiatrisch ziekenhuis als bedoeld in
      [artikel 1, eerste lid, onder h, van de Wet bijzondere opnemingen in psychiatrische ziekenhuizen][ref2] en geen
      inkomen heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005700#Artikel1
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel71b
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0005700
        artikel: '1'
  - number: '72.1'
    text: |-
      De hoogte van de eigen bijdrage in de kosten van verblijf gedurende het etmaal van een jeugdige die over een
      inkomen beschikt of die recht kan doen gelden op een inkomen, wordt vastgesteld op een bedrag gelijk aan het netto-
      maandinkomen, verminderd met eenvierde van het minimumloon dat geldt voor een vijftienjarige of indien de jeugdige
      zestien jaar of ouder is, het voor die leeftijd geldende minimumloon.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel72
  - number: '72.2'
    text: |-
      De eigen bijdrage berekend volgens het eerste lid, wordt voor een jeugdige met een netto jaarinkomen uit
      tegenwoordige arbeid verminderd met een vierde van deze bijdrage. Indien het inkomen uit tegenwoordige arbeid
      minder is dan € 635,29 op jaarbasis wordt deze bijdrage verminderd met dat inkomen.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel72
  - number: '72.3'
    text: |-
      Indien het inkomen, bedoeld in het eerste lid betrekking heeft op een uitkering ingevolge de
      [Wet studiefinanciering 2000][ref1], wordt de bijdrage verminderd met:


      [ref1]: https://wetten.overheid.nl/BWBR0011453
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0011453
  - number: 72.3.a
    text: |-
      het deel van de uitkering dat volgens de normen van het Ministerie van Onderwijs, Cultuur en Wetenschappen bedoeld
      is voor boeken, leermiddelen of onderwijsbijdrage, en
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel72
  - number: 72.3.b
    text: |-
      de te betalen premie voor een door of ten behoeve van de jeugdige gesloten zorgverzekering als bedoeld in
      [artikel 1, onderdeel d, van de Zorgverzekeringswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel1
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '1'
  - number: '72.4'
    text: De eigen bijdrage is niet hoger dan de kosten van het verblijf.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel72
  - number: '73.1'
    text: |-
      De ouderbijdrage of eigen bijdrage is verschuldigd over elke dag dat het verblijf heeft geduurd. De dag van
      aankomst wordt daarbij wel en de dag van vertrek wordt daarbij niet meegerekend als dag van verblijf. Wordt het
      verblijf beëindigd op de dag waarop deze is aangevangen, dan is over deze dag de bijdrage verschuldigd.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel73
  - number: '73.2'
    text: |-
      Indien de bijdrage over een gedeelte van een maand is verschuldigd, bedraagt zij het voor een maand geldende
      bedrag, gedeeld door dertig en vermenigvuldigd met het aantal dagen dat het verblijf heeft geduurd.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel73
  - number: 73a
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel73a
  - number: 73a.1
    text: |-
      uitkering bureau jeugdzorg: de uitkering, bedoeld in [artikel 37, eerste lid, onder a, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel37
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel73a
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '37'
  - number: 73a.2
    text: |-
      uitkering zorgaanbod: de uitkering, bedoeld in [artikel 37, eerste lid, onder b, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel37
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel73a
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '37'
  - number: 73b.1
    text: 'De uitkering bureau jeugdzorg bestaat uit de som van de volgende bedragen:'
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel73b
  - number: 73b.1.a
    text: |-
      een bedrag voor de uitvoering van de jeugdbeschermings- en reclasseringstaken, op basis van het aantal
      minderjarigen voor wie de stichting deze taken heeft uitgevoerd in het jaar voorafgaand aan het jaar waarvoor de
      uitkering wordt verstrekt en de daartoe vastgestelde normbedragen, en
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel73b
  - number: 73b.1.b
    text: |-
      een bedrag voor de uitvoering van de overige wettelijke taken, dat overeenkomt met het verschil tussen
      het bedrag dat de provinciebesturen ontvingen in het jaar voorafgaande aan het jaar waarin de uitkering
      wordt verstrekt en het bedrag bedoeld in [artikel 73e][ref1], vermeerderd met een door Onze Ministers
      vast te stellen bedrag, dat is gerelateerd aan de uitvoering door de stichting van de taak, bedoeld in
      [artikel 5, tweede lid, onder b, van de wet][ref2], en de uitvoering door de stichting van de taak, bedoeld in
      artikel 5 van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel73e
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel5
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel73b
    references:
      - id: ref1
        bwb_id: BWBR0017751
        artikel: 73e
        hoofdstuk: 13a
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '5'
  - number: 73b.2
    text: |-
      De normbedragen, bedoeld in het eerste lid, onder a, worden per onderscheiden taak vastgesteld bij regeling van
      Onze Ministers.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel73b
  - number: 73c.1
    text: |-
      Onze Ministers stellen het bedrag voor de uitvoering van de jeugdbeschermings- en reclasseringstaken, als volgt
      vast:
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel73c
  - number: 73c.1.a
    text: |-
      de voorlopige vaststelling door vermenigvuldiging van het aantal minderjarigen voor wie de stichting in het tweede
      jaar voorafgaand aan het jaar waarvoor de uitkering wordt verstrekt, de jeugdbeschermings- en reclasseringstaken
      heeft uitgevoerd, met de vastgestelde normbedragen, en
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel73c
  - number: 73c.1.b
    text: |-
      de definitieve vaststelling door vermenigvuldiging van het aantal minderjarigen voor wie de stichting in het eerste
      jaar, voorafgaand aan het jaar waarvoor de uitkering wordt verstrekt, de jeugdbeschermings- en reclasseringstaken
      heeft uitgevoerd, met de vastgestelde normbedragen.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel73c
  - number: 73c.2
    text: |-
      Het aantal minderjarigen, bedoeld in het eerste lid, is het gemiddelde van het aantal minderjarigen op de eerste
      dag van elke kalendermaand met uitsluiting van het aantal minderjarigen voor wie een persoon in dienst van
      een landelijke instelling als bedoeld in [artikel 104, eerste lid, van de wet][ref1], de taak uitoefent, met
      uitzondering van de taken als bedoeld in [artikel 10, eerste lid, onder c en d, van de wet][ref2], waarvoor de
      regeling waarbij het normbedrag of de normbedragen worden vastgesteld anders bepaalt.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel104
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel10
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel73c
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '104'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '10'
  - number: 73d.1
    text: |-
      De uitkering bureau jeugdzorg, kan, in afwijking van de [artikelen 73b][ref1] en [73c][ref2], voor zover
      in de begroting de benodigde gelden ter beschikking zijn gesteld, worden verhoogd, indien aannemelijk is
      dat de uitkering, vastgesteld overeenkomstig artikel 73b, onvoldoende is om te voorzien in de behoefte
      aan de uitvoering van de wettelijke taken van het bureau jeugdzorg en de andere activiteiten, genoemd in
      [artikel 37, eerste lid, onder a, van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel73b
      [ref2]: https://wetten.overheid.nl/BWBR0017751#Artikel73c
      [ref3]: https://wetten.overheid.nl/BWBR0016637#Artikel37
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel73d
    references:
      - id: ref1
        bwb_id: BWBR0017751
        artikel: 73b
        hoofdstuk: 13a
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017751
        artikel: 73c
        hoofdstuk: 13a
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0016637
        artikel: '37'
  - number: 73d.2
    text: |-
      De uitkering bureau jeugdzorg kan, in afwijking van de [artikelen 73b][ref1] en [73c][ref2], worden verminderd,
      indien aannemelijk is dat de behoefte aan subsidie voor door de stichting te leveren activiteiten, in het jaar
      waarop de uitkering betrekking heeft, substantieel lager zal zijn dan die in het tweede jaar voorafgaand aan dat
      jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel73b
      [ref2]: https://wetten.overheid.nl/BWBR0017751#Artikel73c
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel73d
    references:
      - id: ref1
        bwb_id: BWBR0017751
        artikel: 73b
        hoofdstuk: 13a
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017751
        artikel: 73c
        hoofdstuk: 13a
        paragraaf: '2'
  - number: 73d.3
    text: |-
      Onze Ministers kunnen bij ministeriële regeling factoren aanwijzen die in aanmerking worden genomen bij de
      vaststelling van de behoefte en regels stellen omtrent de mate waarin de factoren, de vaststelling van de behoefte
      beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel73d
  - number: 73d.4
    text: |-
      Het overeenkomstig [artikel 73b, eerste lid, onder b][ref1], berekende bedrag van de uitkering bureau jeugdzorg
      voor het jaar 2013 wordt verminderd met 2,65%.


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel73b
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel73d
    references:
      - id: ref1
        bwb_id: BWBR0017751
        artikel: 73b
        hoofdstuk: 13a
        paragraaf: '2'
  - number: 73e.1
    text: |-
      De uitkering zorgaanbod bestaat, onverminderd [artikel 104, tweede lid, van de wet][ref1], uit het bedrag dat het
      provinciebestuur in het jaar voorafgaande aan het jaar waarin de uitkering wordt verstrekt ontving voor jeugdzorg
      waarop aanspraak bestaat ingevolge de [wet][ref2], voor de vertrouwenspersoon voor de cliënten van zorgaanbieders,
      voor experimenten, voor de steunfunctie met betrekking tot die jeugdzorg, voor cliëntenorganisaties en voor het
      verwerken van gegevens, bedoeld in de [artikelen 43][ref3] en [44, eerste lid, van de wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel104
      [ref2]: https://wetten.overheid.nl/BWBR0016637
      [ref3]: https://wetten.overheid.nl/BWBR0016637#Artikel43
      [ref4]: https://wetten.overheid.nl/BWBR0016637#Artikel44
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel73e
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '104'
      - id: ref2
        bwb_id: BWBR0016637
      - id: ref3
        bwb_id: BWBR0016637
        artikel: '43'
      - id: ref4
        bwb_id: BWBR0016637
        artikel: '44'
  - number: 73e.2
    text: |-
      De uitkering zorgaanbod wordt verhoogd met een bedrag uit de in de begroting beschikbaar gestelde gelden voor extra
      aanbod, volgens bij circulaire van Onze Ministers vast te stellen regels over de verdeling van dit bedrag aan de
      hand van het aantal jeugdigen in de provincie, het aantal allochtone jeugdigen en het aantal jeugdigen dat behoort
      tot een eenoudergezin.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel73e
  - number: 73e.3
    text: |-
      De uitkering zorgaanbod kan, in afwijking van het eerste lid, en onverminderd het tweede lid, voor zover in
      de begroting de benodigde gelden ter beschikking zijn gesteld, worden verhoogd, indien aannemelijk is dat de
      uitkering, vastgesteld overeenkomstig het eerste en tweede lid, onvoldoende is om te voorzien in de behoefte aan
      jeugdzorg waarop aanspraak bestaat ingevolge de [wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016637
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel73e
    references:
      - id: ref1
        bwb_id: BWBR0016637
  - number: 73e.4
    text: |-
      De uitkering zorgaanbod kan, in afwijking van het eerste lid, worden verminderd, indien aannemelijk is dat de
      behoefte aan subsidie voor door zorgaanbieders te leveren activiteiten in het jaar waarop de uitkering betrekking
      heeft, substantieel lager zal zijn dan die in het tweede jaar voorafgaand aan dat jaar.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel73e
  - number: 73e.5
    text: |-
      [Artikel 73d, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel73d
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel73e
    references:
      - id: ref1
        bwb_id: BWBR0017751
        artikel: 73d
        hoofdstuk: 13a
        paragraaf: '2'
  - number: 73e.6
    text: |-
      Het overeenkomstig het eerste lid berekende bedrag van de uitkering zorgaanbod voor het jaar 2013 wordt verminderd
      met 2,65%.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel73e
  - number: 73f.1
    text: |-
      Een uitkering als bedoeld in [artikel 73b][ref1] en [artikel 73d][ref2] wordt verminderd, indien de omvang van
      de egalisatiereserve, bedoeld in [artikel 73k][ref3], zodanig is dat van het provinciebestuur redelijkerwijs mag
      worden verwacht dat zij te verlenen subsidies ten laste brengt van die reserve.


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel73b
      [ref2]: https://wetten.overheid.nl/BWBR0017751#Artikel73d
      [ref3]: https://wetten.overheid.nl/BWBR0017751#Artikel73k
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel73f
    references:
      - id: ref1
        bwb_id: BWBR0017751
        artikel: 73b
        hoofdstuk: 13a
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017751
        artikel: 73d
        hoofdstuk: 13a
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0017751
        artikel: 73k
        hoofdstuk: 13a
        paragraaf: '5'
  - number: 73f.2
    text: |-
      De uitkeringen, bedoeld in de [artikelen 73b][ref1] en [73d][ref2], kunnen worden bijgesteld in verband met
      de ontwikkeling van het prijspeil of de ontwikkeling in de kosten van arbeidsvoorwaarden. Met het oog hierop
      bepalen Onze Ministers per activiteit welk deel van de uitkeringen, dan wel welk deel van de desbetreffende
      normbedragen waaruit de uitkering is opgebouwd, in aanmerking zal worden genomen in verband met de ontwikkeling
      van het prijspeil en welk deel in verband met de ontwikkeling van de kosten van de arbeidsvoorwaarden en welk deel
      ongevoelig is voor ontwikkeling van beide.


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel73b
      [ref2]: https://wetten.overheid.nl/BWBR0017751#Artikel73d
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel73f
    references:
      - id: ref1
        bwb_id: BWBR0017751
        artikel: 73b
        hoofdstuk: 13a
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017751
        artikel: 73d
        hoofdstuk: 13a
        paragraaf: '2'
  - number: 73g.1
    text: |-
      Een aanvraag van de uitkering bureau jeugdzorg en van de uitkering zorgaanbod voor het eerstvolgende
      jaar wordt gedaan door de toezending van het ontwerp van het uitvoeringsprogramma, bedoeld in
      [artikel 32, eerste lid, tweede volzin, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel32
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel73g
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '32'
  - number: 73g.2
    text: |-
      Bij regeling van Onze Ministers kunnen nadere regels worden gesteld omtrent de bij de aanvraag te voegen gegevens
      en de wijze waarop deze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel73g
  - number: 73h
    text: |-
      Gedeputeerde staten verstrekken ter verantwoording de informatie, bedoeld in
      [artikel 32, tweede lid, onder a, van de wet][ref1], op de wijze, bedoeld in
      [artikel 17a van de Financiële-verhoudingswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel73h
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '32'
      - id: ref2
        bwb_id: BWBR0008290
        artikel: 17a
  - number: 73i.1
    text: |-
      Onze Ministers stellen de uitkering bureau jeugdzorg, bedoeld in [artikel 73b][ref1], eerste lid, voorlopig vast
      uiterlijk dertien weken na ontvangst van de aanvraag. De definitieve vaststelling van de uitkering vindt plaats
      uiterlijk dertien weken nadat het provinciebestuur de gegevens, bedoeld in [artikel 73c, tweede lid][ref2], heeft
      overgelegd. Het provinciebestuur overlegt de gegevens uiterlijk vóór 1 juni van het uitvoeringsjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel73b
      [ref2]: https://wetten.overheid.nl/BWBR0017751#Artikel73c
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel73i
    references:
      - id: ref1
        bwb_id: BWBR0017751
        artikel: 73b
        hoofdstuk: 13a
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017751
        artikel: 73c
        hoofdstuk: 13a
        paragraaf: '2'
  - number: 73i.2
    text: |-
      Onze Ministers stellen de uitkering zorgaanbod, bedoeld in [artikel 73e][ref1], vast binnen dertien weken na
      ontvangst van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel73e
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel73i
    references:
      - id: ref1
        bwb_id: BWBR0017751
        artikel: 73e
        hoofdstuk: 13a
        paragraaf: '2'
  - number: 73i.3
    text: De uitkeringen worden betaald in termijnen, volgens bij regeling van Onze Ministers vast te stellen schema.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel73i
  - number: 73j
    text: |-
      De [artikelen 4:49][ref1], [4:56][ref2] en [4:57 van de Algemene wet bestuursrecht][ref3] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel73j
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 73k.1
    text: Het provinciebestuur vormt een egalisatiereserve jeugdzorg.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel73k
  - number: 73k.2
    text: |-
      Het verschil tussen de som van vastgestelde uitkeringen en de vastgestelde subsidies in het jaar waarop de
      uitkeringen betrekking hebben, komt ten gunste of ten laste van de egalisatiereserve.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel73k
  - number: 73k.3
    text: De van de egalisatiereserve genoten rente wordt aan de egalisatiereserve toegevoegd.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel73k
  - number: 73k.4
    text: |-
      In de gevallen, bedoeld in [artikel 4:41, tweede lid, onder c, d, en e, van de Algemene wet bestuursrecht][ref1],
      is het provinciebestuur terzake van de egalisatiereserve vergoedingsplichtig naar evenredigheid van de mate waarin
      de uitkering aan de egalisatiereserve heeft bijgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel73k
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 73k.5
    text: De egalisatiereserve wordt uitsluitend besteed voor een van de doeleinden waarvoor de uitkeringen zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel73k
  - number: '77'
    text: |-
      Tot het tijdstip, bedoeld in [artikel 104, eerste lid, van de wet][ref1], kan de stichting een medewerker van een
      instelling met een landelijk bereik, die op het moment van inwerkingtreding van de [Wet op de jeugdzorg][ref2] als
      voogdij-instelling op grond van [artikel 60, eerste lid, onder a, van de Wet op de jeugdhulpverlening][ref3] of als
      gezinsvoogdij-instelling op grond van [artikel 60, eerste lid, onder b, van die wet][ref4] aanvaard was, aanwijzen
      als voogdij- onderscheidenlijk gezinsvoogdij- of jeugdreclasseringswerker.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel104
      [ref2]: https://wetten.overheid.nl/BWBR0016637
      [ref3]: https://wetten.overheid.nl/BWBR0004608#Artikel60
      [ref4]: https://wetten.overheid.nl/BWBR0004608#Artikel60
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '104'
      - id: ref2
        bwb_id: BWBR0016637
      - id: ref3
        bwb_id: BWBR0004608
        artikel: '60'
      - id: ref4
        bwb_id: BWBR0004608
        artikel: '60'
  - number: 77a
    text: |-
      Gedurende een periode van een jaar na het tijdstip van inwerkingtreding van de
      [artikelen 23a, eerste tot en met derde lid][ref1], en [29, derde tot en met vijfde lid][ref2], zijn die bepalingen
      niet van toepassing op werktoedelingen waarvan de zorgaanbieder onderscheidenlijk de stichting, aannemelijk kan
      maken dat die toedeling plaatsvindt aan een beroepsbeoefenaar die reeds op dat tijdstip van inwerkingtreding binnen
      de betreffende organisatie werkzaam was.


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel23a
      [ref2]: https://wetten.overheid.nl/BWBR0017751#Artikel29
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel77a
    references:
      - id: ref1
        bwb_id: BWBR0017751
        artikel: 23a
        hoofdstuk: 8a
      - id: ref2
        bwb_id: BWBR0017751
        artikel: '29'
        hoofdstuk: '9'
        paragraaf: '2'
  - number: 77b
    text: |-
      Gedurende een periode van vijf jaar en drie maanden na inwerkingtreding van [artikel 68h][ref1] kan in afwijking
      van dat artikel een beroepsbeoefenaar in het kwaliteitsregister jeugd zijn ingeschreven indien:


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel68h
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel77b
    references:
      - id: ref1
        bwb_id: BWBR0017751
        artikel: 68h
        hoofdstuk: 12a
        paragraaf: '3'
  - number: 77b.a
    text: |-
      die beroepsbeoefenaar op het tijdstip van inwerkingtreding van [artikel 68h][ref1] binnen de jeugdzorg werkzaam is
      in een functie waarvoor scholing is vereist op het niveau van een hogere beroepsopleiding;


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel68h
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel77b
    references:
      - id: ref1
        bwb_id: BWBR0017751
        artikel: 68h
        hoofdstuk: 12a
        paragraaf: '3'
  - number: 77b.b
    text: |-
      de aan de registratie van de beroepsbeoefenaar ten grondslag liggende aanvraag is ingediend binnen drie maanden na
      inwerkingtreding van [artikel 68h][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel68h
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel77b
    references:
      - id: ref1
        bwb_id: BWBR0017751
        artikel: 68h
        hoofdstuk: 12a
        paragraaf: '3'
  - number: 77b.c
    text: |-
      de beroepsbeoefenaar deelneemt aan een scholingstraject, dat erop gericht is uiterlijk bij de eerste herregistratie
      de scholing op het niveau van hoger beroepsonderwijs te voltooien; en
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel77b
  - number: 77b.d
    text: |-
      in het kader van de raadpleegbaarheid, bedoeld in [artikel 68l][ref1], voor een ieder kenbaar is dat de
      inschrijving van de beroepsbeoefenaar valt onder de werking van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0017751#Artikel68l
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel77b
    references:
      - id: ref1
        bwb_id: BWBR0017751
        artikel: 68l
        hoofdstuk: 12a
        paragraaf: '6'
  - number: '78'
    text: Dit besluit treedt in werking met ingang van 1 januari 2005.
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel78
  - number: '79'
    text: 'Dit besluit wordt aangehaald als: Uitvoeringsbesluit Wet op de jeugdzorg.'
    url: https://wetten.overheid.nl/BWBR0017751/2014-11-15#Artikel79
