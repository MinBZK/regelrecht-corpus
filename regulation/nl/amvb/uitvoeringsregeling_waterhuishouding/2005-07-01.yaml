        artikel: '60'
  - number: '4'
    text: |-
      Met een melding wordt gelijkgesteld de indiening van een aanvraag om een vergunning, (of een wijziging daarvan),
      zoals bedoeld in [artikel 1, eerste lid, van de Wet verontreiniging oppervlaktewateren][ref1], dan wel het houden
      van zodanige (al dan niet gewijzigde) vergunning op de dag van het van kracht worden van de meldplicht.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel1
    url: https://wetten.overheid.nl/BWBR0004778/2005-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '1'
  - number: '5'
    text: |-
      1 Degene die water afvoert of aanvoert is verplicht de verplaatste waterhoeveelheden te meten, daarvan aantekening
      te houden en van de verkregen gegevens opgave te doen, indien op de gemelde wijze meer dan 5000 m3 water per uur
      kan worden afgevoerd dan wel meer dan 100 m3 water kan worden aangevoerd. De in de voorgaande volzin omschreven
      verplichting geldt in de gevallen dat de afvoer of aanvoer van water plaatsvindt naar of uit een rijkswater
      behorende tot die welke daartoe zijn aangewezen door Onze Minister.

      2 De in het eerste lid bedoelde aanwijzing vindt slechts plaats wanneer nauwkeurige gegevens over de werkelijk
      verplaatste waterhoeveelheden noodzakelijk zijn voor een goed oordeel over de invloed van de afvoer of de aanvoer
      op de peilregeling of waterbeweging en over de noodzaak tot bijzondere beheersmaatregelen. Onze Minister houdt
      daarbij rekening met het beheersplan voor de rijkswateren.

      3 De meetplicht als bedoeld in het eerste lid geldt niet indien in een waterakkoord meetvoorschriften zijn
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0004778/2005-07-01#Artikel5
  - number: '6'
    text: |-
      1 Een melding, als bedoeld in [artikel 12, eerste lid][ref1], van de wet geschiedt tenminste 8 weken voordat een
      begin wordt gemaakt met uitvoering van de tot afvoer, aanvoer, lozing of onttrekking dienende werken dan wel met
      het op andere wijze mogelijk maken van de afvoer, aanvoer, lozing of onttrekking.

      2 Indien in een spoedeisend geval de meldplichtige niet aan het eerste lid kan voldoen, doet hij de melding zo
      spoedig mogelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel12
    url: https://wetten.overheid.nl/BWBR0004778/2005-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004575
        artikel: '12'
  - number: '7'
    text: |-
      Indien op de dag waarop de meldplicht van kracht wordt, de afvoer, aanvoer, lozing of onttrekking reeds op een te
      melden wijze mogelijk is, geschiedt de melding binnen 8 weken na die dag.
    url: https://wetten.overheid.nl/BWBR0004778/2005-07-01#Artikel7
  - number: '8'
    text: |-
      De melding bevat:

      a. de naam en het adres van de meldingplichtige;

      b. de dagtekening;

      c. de naam van de betrokken wateren;

      d. een kaart met de plaats van de afvoer, aanvoer, lozing of onttrekking, met de ligging van de werken en, indien
      het gaat om afwatering van een gebied, met de percelen ten behoeve waarvan water wordt afgevoerd;

      e. een beschrijving van de werken, waaronder een opgave van de capaciteit;

      f. een aan duiding van de waterhoeveelheden in m3 die per één of meer tijdseenheden worden verplaatst, te
      onderscheiden naar perioden of omstandigheden;

      g. het doel, de begindatum en, indien vooraf bekend, de einddatum van de afvoer, lozing, aanvoer of onttrekking.
    url: https://wetten.overheid.nl/BWBR0004778/2005-07-01#Artikel8
  - number: '9'
    text: De kwantiteitsbeheerder kan voor het doen van de melding een formulier vaststellen.
    url: https://wetten.overheid.nl/BWBR0004778/2005-07-01#Artikel9
  - number: '10'
    text: |-
      Een meting, aantekening en opgave, als bedoeld in [artikel 12, eerste lid][ref1], van de wet, geschieden op de
      volgende wijze:

      a. gemeten wordt op een zodanige plaats en op een zodanige wijze dat het meetresultaat niet meer dan 10% kan
      afwijken van de werkelijk verplaatste waterhoeveelheid;

      b. een waterverplaatsing wordt uitgedrukt in m3 per één of meer tijdseenheden;

      c. van een waterverplaatsing wordt in ieder geval het gemiddelde per etmaal berekend;

      d. de regelmaat waarmee en de vorm waarin de gegevens worden verstrekt, komen overeen met de wijze waarop de
      kwantiteitsbeheerder in vergelijkbare gevallen gegevens verwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel12
    url: https://wetten.overheid.nl/BWBR0004778/2005-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004575
        artikel: '12'
  - number: '11'
    text: |-
      1 Onze Minister stelt een peilbesluit vast voor de volgende rijkswateren:

        - Noordzeekanaal; Het IJ, Amsterdam-Rijnkanaal;
        - Grevelingemeer;
        - Veerse Meer;
        - Krammer, Volkerak, Eendracht, Zoommeer, Bathse Spuikanaal;
        - IJsselmeer, Ketelmeer, Vossemeer, Zwarte Meer, Markermeer, IJmeer, Gooimeer, Eemmeer, Wolderwijd, Nijkerkernauw,
      Nuldernauw, Veluwemeer, Drontermeer.

      2 De in het eerste lid bedoelde verplichtingen worden eerst van kracht met ingang van 1 juli 1991, onverlet de
      bevoegdheid van Onze Minister het peilbesluit eerder vast te stellen.
    url: https://wetten.overheid.nl/BWBR0004778/2005-07-01#Artikel11
  - number: '12'
    text: |-
      Onze Minister stelt zo spoedig mogelijk, doch uiterlijk binnen een termijn van acht maanden na het van kracht
      worden van de verplichting een peilbesluit vast te stellen, een ontwerp van het peilbesluit op.
    url: https://wetten.overheid.nl/BWBR0004778/2005-07-01#Artikel12
  - number: '13'
    text: |-
      Op de voorbereiding van het peilbesluit is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0004778/2005-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '15'
    text: |-
      Onze Minister stelt binnen acht weken na afloop van de door hem vast te stellen termijn als bedoeld in [artikel
      3.11. van de Algemene wet bestuursrecht](onbekend), het peilbesluit vast.
    url: https://wetten.overheid.nl/BWBR0004778/2005-07-01#Artikel15
  - number: '19'
    text: |-
      1 Een kwantiteitsbeheerder die water afvoert naar of aanvoert uit rijkswateren, alsmede het Rijk zijn in de
      volgende gevallen van afvoer of aanvoer verplicht gezamenlijk een waterakkoord vast te stellen:

        - de aanvoer uit het IJsselmeer ten behoeve van de watervoorziening in Friesland, Groningen en Noord-West-
      Overijssel;
        - de afvoer naar het IJsselmeer ten behoeve van de afwatering van de Wieringermeer;
        - de afvoer naar het Ketelmeer, Markermeer en Veluwemeer ten behoeve van de afwatering van Flevoland;
        - de aanvoer uit het Markermeer ten behoeve van de watervoorziening in Noord-Holland;
        - de afvoer naar het Noordzeekanaal en het Amsterdam-Rijnkanaal ten behoeve van de afwatering van delen van Noord-
      Holland, Zuid-Holland, Utrecht en Gelderland;
        - de aanvoer uit de Lek, de Hollandsche IJssel en het Amsterdam-Rijnkanaal ten behoeve van de watervoorziening in
      delen van Midden-Holland;
        - de aanvoer uit het Zoommeer ten behoeve van de watervoorziening in delen van Noord-Brabant, Zeeland en Zuid-
      Holland alsmede de afvoer naar het Zoommeer ten behoeve van de afwatering van die gebieden;
        - de aanvoer uit de Zuid-Willemsvaart, het Wilhelminakanaal, het Kanaal Wessem-Nederweert en de Noordervaart ten
      behoeve van de watervoorziening in delen van Noord-Brabant en Limburg alsmede de afvoer naar de Zuid-Willemsvaart
      en het Wilhelminakanaal ten behoeve van de afwatering van die gebieden;
        - de aanvoer uit de Twentekanalen, het kanaal Almelo-De Haandrik en de Overijsselsche Vecht ten behoeve van de
      watervoorziening in delen van Overijssel, Gelderland en Drenthe alsmede de afvoer naar de Twentekanalen ten behoeve
      van de afwatering van delen van Overijssel en Gelderland;
        - de aanvoer uit het Meppelerdiep en de Drentse Hoofdvaart ten behoeve van de watervoorziening in Drenthe;
        - de afvoer naar de Drentse Hoofdvaart, Het Meppelerdiep en de Overijsselsche Vecht in geval van hoog water in
      Noord-Overijssel en Zuid-Drenthe.

      2 De in het eerste lid bedoelde verplichtingen worden eerst van kracht met ingang van 1 juli 1991, onverlet de
      bevoegdheid van partijen het waterakkoord eerder vast te stellen.
    url: https://wetten.overheid.nl/BWBR0004778/2005-07-01#Artikel19
  - number: '20'
    text: |-
      Het is verboden zonder vergunning water te lozen in of te onttrekken aan rijkswateren, indien op de voorgenomen
      wijze van lozing of onttrekking meer dan 5000 m3 water per uur kan worden geloosd of meer dan 100 m3 water per uur
      kan worden onttrokken.
    url: https://wetten.overheid.nl/BWBR0004778/2005-07-01#Artikel20
  - number: '21'
    text: |-
      1 Onze Minister kan met betrekking tot een of meer rijkswateren gevallen aanwijzen, waarin het verbod van
      [artikel 20][ref1] tevens geldt bij overschrijding van aangegeven waterhoeveelheden die kleiner zijn dan die in
      [artikel 20][ref2] maar groter dan die in [artikel 3, eerste lid, onder a en b][ref3].

      2 Onze Minister oefent de in het eerste lid bedoelde bevoegdheid slecht uit met betrekking tot rijkswateren
      die onvoldoende capaciteit hebben om onder normale of afwijkende omstandigheden de te verwachten lozingen of
      onttrekkingen zonder nadelige gevolgen voor de waterhuishouding te kunnen verwerken.


      [ref1]: https://wetten.overheid.nl/BWBR0004778#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0004778#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0004778#Artikel3
    url: https://wetten.overheid.nl/BWBR0004778/2005-07-01#Artikel21
