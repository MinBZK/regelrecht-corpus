preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 20 juni 1989, nr. RW 29 877, Hoofddirectie van de
    Waterstaat, Hoofdafdeling Bestuurlijke en Juridische Zaken; Gelet op de artikelen 7, tweede lid, 12, vijfde lid,
    13, eerste lid, 16, tweede en vierde lid, 17, derde lid, 24, tweede lid, 25, tweede lid, en 70 van de Wet op de
    waterhuishouding (Stb. 1989, 285);

    Gelet tevens op artikel 1 van de Wet van 28 februari 1891 tot vaststellen van bepalingen betreffende 's Rijks
    waterstaatswerken (Stb. 69), en op artikel 7, tweede lid, van de Grondwaterwet (Stb. 1981, 392);

    Gehoord gedeputeerde staten van de provincies;

    Gehoord de betrokken beheerders;

    Gehoord de Raad van de Waterstaat;

    De Raad van State gehoord (advies van 2 maart 1990, no. WO9.89.0342);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 29 mei 1990, nr. R 62108, Hoofddirectie
    van de Waterstaat, Hoofdafdeling Bestuurlijke en Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004778/2005-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. wet: de [Wet op de waterhuishouding][ref1] (*Stb.* 1989, 285);

      b. rijkswateren: de oppervlaktewateren onder beheer van het Rijk, met inbegrip van met deze wateren in open
      verbinding staande wateren welke zijn aangewezen bij het [Besluit aanwijzing zijwateren van hoofdwateren][ref2] en
      van met de eerstbedoelde wateren in open verbinding staande havens welke bij anderen dan het Rijk in beheer zijn;

      c. hoofdwateren: de in de bijlage bij dit besluit opgenomen rijkswateren van landelijk belang;

      d. afvoeren: het door middel van een werk of langs natuurlijke weg brengen of laten stromen van water uit een
      oppervlaktewater naar een ander oppervlaktewater;

      e. aanvoeren: het door middel van een werk of langs natuurlijke weg naar een oppervlaktewater halen of laten
      stromen van water uit een ander oppervlaktewater;

      f. lozen: het door middel van een werk brengen van water in een oppervlaktewater, zonder dat het water daarbij uit
      een ander oppervlaktewater wordt gehaald;

      g. onttrekken: het door middel van een werk halen van water uit een oppervlaktewater, zonder dat het water daarbij
      in een ander oppervlaktewater wordt gebracht;

      h. beheersplan voor de rijkswateren: het in [artikel 5][ref3] van de wet bedoelde plan;

      i. vergunning: de in [artikel 24][ref4] van de wet bedoelde vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0004575
      [ref2]: https://wetten.overheid.nl/BWBR0010970
      [ref3]: https://wetten.overheid.nl/BWBR0004575#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0004575#Artikel24
