        paragraaf: '2'
        afdeling: '1'
  - number: '26'
    text: |-
      Het besluit van 1 oktober 1982 (*Stb.* 591), houdende aanwijzing van rijksambtenaren als bedoeld in
      [artikel 7, tweede lid, van de Grondwaterwet][ref1], wordt ingetrokken met ingang van het tijdstip waarop in
      de onderscheiden provincies de verordeningen als bedoeld in [artikel 8, tweede lid][ref2], van de wet zijn
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003406#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0004575#Artikel8
    url: https://wetten.overheid.nl/BWBR0004778/2005-07-01#Artikel26
    references:
