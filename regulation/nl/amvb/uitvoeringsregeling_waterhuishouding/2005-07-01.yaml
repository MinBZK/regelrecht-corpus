        artikel: '8'
  - number: '27'
    text: Dit besluit treedt met ingang van 1 juli 1990 in werking.
    url: https://wetten.overheid.nl/BWBR0004778/2005-07-01#Artikel27
  - number: '28'
    text: Dit besluit kan worden aangehaald als Uitvoeringsregeling waterhuishouding.
    url: https://wetten.overheid.nl/BWBR0004778/2005-07-01#Artikel28
