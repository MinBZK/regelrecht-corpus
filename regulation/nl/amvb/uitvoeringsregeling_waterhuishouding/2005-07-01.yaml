        afdeling: '4'
  - number: '23'
    text: |-
      Bij de aanvraag tot verlening van een vergunning worden in ieder geval overgelegd de gegevens bedoeld in
      [artikel 8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004778#Artikel8
    url: https://wetten.overheid.nl/BWBR0004778/2005-07-01#Artikel23
    references:
      - id: ref1
