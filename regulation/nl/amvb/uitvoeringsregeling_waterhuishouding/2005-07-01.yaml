  - number: '2'
    text: |-
      Het provinciaal plan voor de waterhuishouding heeft mede betrekking op rijkswateren die geen hoofdwateren of bij
      het [Besluit aanwijzing zijwateren van hoofdwateren][ref1] aangewezen oppervlaktewateren zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0010970
    url: https://wetten.overheid.nl/BWBR0004778/2005-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0010970
  - number: '3'
    text: |-
      1 Degene die water afvoert naar, aanvoert uit, loost in of onttrekt aan rijkswateren, meldt de wijze daarvan
      indien:

      a. op die wijze meer dan 1 000 m3 water per uur kan worden afgevoerd of geloosd;

      b. op die wijze meer dan 20 m3 water per uur kan worden aangevoerd of onttrokken; of

      c. door veranderingen in een eerder gemelde wijze van afvoer of lozing dan wel aanvoer of onttrekking tenminste
      20 percent meer of minder water, met een minimum verschil van 1000 m3 onderscheidenlijk 20 m3 per uur, kan worden
      afgevoerd of geloosd dan wel aangevoerd of onttrokken,

      een en ander tenzij slechts éénmalig ten hoogste 1 000 000 m3 water wordt afgevoerd of geloosd dan wel 20
      000 m3 water wordt aangevoerd of onttrokken én daarbij per uur niet meer water wordt verplaatst dan 5000 m3
      respectievelijk 100 m3.

      2 De meldplicht geldt niet voor een afvoer, aanvoer, lozing of onttrekking:

      a. waarvoor ingevolge [artikel 19][ref1], [20][ref2], [21][ref3] of [22][ref4] een waterakkoord of vergunning is
      vereist;

      b. waarvoor vóór het van kracht worden van de meldplicht een vergunning is verleend die ingevolge
      [artikel 60, derde lid][ref5], van de wet wordt beschouwd als een vergunning op grond van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0004778#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0004778#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0004778#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0004778#Artikel22
      [ref5]: https://wetten.overheid.nl/BWBR0004575#Artikel60
    url: https://wetten.overheid.nl/BWBR0004778/2005-07-01#Artikel3
