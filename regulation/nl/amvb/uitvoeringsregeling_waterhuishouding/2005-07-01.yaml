  - number: '22'
    text: |-
      De [artikelen 20][ref1] en [21][ref2] zijn tevens van toepassing op het afvoeren naar of aanvoeren uit rijkswateren
      door anderen dan kwantiteitsbeheerders.


      [ref1]: https://wetten.overheid.nl/BWBR0004778#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0004778#Artikel21
    url: https://wetten.overheid.nl/BWBR0004778/2005-07-01#Artikel22
