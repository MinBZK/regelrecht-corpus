  - number: 26.2.f
    text: |-
      een uiteenzetting over het in het verslagjaar gevoerde beleid en beheer op financieel gebied, in welke
      uiteenzetting zij aannemelijk maakt, dat dit beleid en beheer voldoet aan [de artikelen 21][ref1] en [22][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0005686#Artikel22
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: '21'
        hoofdstuk: III
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0005686
        artikel: '22'
        hoofdstuk: III
        paragraaf: '5'
  - number: 26.2.g
    text: |-
      een uiteenzetting over haar werkzaamheden in het verslagjaar aangaande het bouwen van woningen, voor zover de
      kosten van het verkrijgen in eigendom van die woningen hoger zijn dan of gelijk zijn aan € 200 000, in welke
      uiteenzetting zij aannemelijk maakt, dat die werkzaamheden hebben bijgedragen aan de beleidsresultaten, uiteengezet
      ingevolge de onderdelen a tot en met f;
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel26
  - number: 26.2.h
    text: |-
      een uiteenzetting over haar overige werkzaamheden in het verslagjaar op het gebied van de volkshuisvesting,
      voor zover daarover niet ingevolge het eerste lid verslag dient te worden gelegd, in welke uiteenzetting zij
      aannemelijk maakt, dat die werkzaamheden hebben bijgedragen aan de beleidsresultaten, uiteengezet ingevolge
      [de onderdelen a][ref1] tot en met [f][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0005686#Artikel26
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: '26'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005686
        artikel: '26'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 26.2.i
    text: |-
      een uiteenzetting over het door haar gevoerde overleg met de gemeenten waar zij feitelijk werkzaam is over het in
      die gemeenten geldende volkshuisvestingsbeleid en de daaruit voortgevloeide afspraken daarover met die gemeenten,
      in welke uiteenzetting zij aannemelijk maakt, dat is voldaan aan [artikel 11f][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel11f
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: 11f
        hoofdstuk: III
        paragraaf: '1'
  - number: 26.2.j
    text: |-
      een overzicht van en een uiteenzetting over de verbindingen met andere rechtspersonen en vennootschappen
      waartoe zij in het verslagjaar heeft besloten, in welke uiteenzetting zij aannemelijk maakt, dat is voldaan aan
      [artikel 11][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel11a
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: 11a
        hoofdstuk: III
        paragraaf: '1'
  - number: 26.2.k
    text: |-
      een overzicht van haar overige activiteiten in het verslagjaar op het gebied van verbindingen met andere
      rechtspersonen of vennootschappen, welk overzicht een juist en volledig inzicht geeft in de werkzaamheden en de
      financiële situatie van die rechtspersonen en vennootschappen;
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel26
  - number: 26.2.l
    text: een overzicht van haar activiteiten in het verslagjaar op het gebied van beleggingen;
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel26
  - number: 26.2.m
    text: een overzicht van haar onrendabele investeringen in het verslagjaar en
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel26
  - number: 26.2.n
    text: |-
      een verklaring, dat zij in het verslagjaar haar middelen uitsluitend heeft besteed in het belang van de
      volkshuisvesting.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel26
  - number: '26.3'
    text: |-
      Indien de grond waarop de woningen, bedoeld in het tweede lid, onderdeel g, worden gebouwd in erfpacht wordt
      verkregen, dient in de kosten van het verkrijgen in eigendom, bedoeld in dat onderdeel, per kavel voor grondkosten
      mede te worden begrepen een bedrag dat vergelijkbaar is met de kosten van een vergelijkbare in eigendom
      verkrijgbare kavel.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel26
  - number: '26.4'
    text: |-
      Het bedrag, genoemd in het tweede lid, onderdeel g, kan bij ministeriële regeling met ingang van 1 januari van enig
      kalenderjaar worden gewijzigd, indien daartoe aanleiding bestaat wegens wijziging van de prijzen in verband met het
      bouwen van woningen.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel26
  - number: '26.5'
    text: |-
      De toegelaten instelling stelt jaarlijks een overzicht op met cijfermatige kerngegevens over het verslagjaar en
      prognoses over die gegevens. Bij de bepaling van het aantal woongelegenheden dat de toegelaten instelling in het
      verslagjaar in eigendom of in beheer had, begrijpt zij steeds mede de woongelegenheden, die zij in het verslagjaar
      heeft verkregen als gevolg van een fusie als bedoeld in [artikel 309 van Boek 2 van het Burgerlijk Wetboek][ref1].
      Het overzicht wordt ingericht overeenkomstig [bijlage II][ref2] bij dit besluit, van welke bijlage de aanhangsels
      bij ministeriële regeling kunnen worden gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel309
      [ref2]: https://wetten.overheid.nl/BWBR0005686
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '309'
      - id: ref2
        bwb_id: BWBR0005686
  - number: '27.1'
    text: |-
      De toegelaten instelling verleent opdracht tot onderzoek van de stukken, genoemd in [artikel 26][ref1], aan
      een accountant als bedoeld in [artikel 393, eerste lid, van boek 2 van het Burgerlijk Wetboek][ref2] of aan een
      organisatie waarin zodanige accountants samenwerken. De aanwijzing van de accountant die het in de eerste volzin
      bedoelde onderzoek verricht wordt niet door enige voordracht beperkt.


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: '26'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '27.2'
    text: |-
      De toegelaten instelling verzoekt aan de betrokken accountant of organisatie omtrent het onderzoek verslag aan haar
      uit te brengen.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel27
  - number: '28'
    text: |-
      De toegelaten instelling laat de ingevolge [artikel 27][ref1] aangewezen accountant of organisatie onderzoeken, of:


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel27
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: '27'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 28.a
    text: |-
      de jaarrekening, bedoeld in [artikel 26, eerste lid][ref1], het
      in[ artikel 362, eerste lid, van boek 2 van het Burgerlijk Wetboek][ref2] vereiste inzicht geeft en voldoet aan de
      overige krachtens [artikel 26, eerste lid, aanhef en onderdeel ][ref3], daarop van toepassing zijnde voorschriften;


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel362
      [ref3]: https://wetten.overheid.nl/BWBR0005686#Artikel26
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '362'
      - id: ref3
        bwb_id: BWBR0005686
        artikel: '26'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 28.b
    text: |-
      het volkshuisvestingsverslag, bedoeld in [artikel 26, tweede lid][ref1], voor zover deze dat kan beoordelen
      overeenkomstig dat lid is opgesteld en met de jaarrekening verenigbaar is en


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel26
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: '26'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 28.c
    text: |-
      het overzicht, bedoeld in [artikel 26, vijfde lid][ref1], is gebaseerd op verantwoorde aannames.


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel26
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: '26'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '29.1'
    text: |-
      De toegelaten instelling verzoekt aan een daartoe als openbaar accountant optredende accountant als bedoeld in
      [artikel 27, eerste lid][ref1], of aan een organisatie waarin zodanige accountants samenwerken, om op te stellen:


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel27
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: '27'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 29.1.a
    text: |-
      een verklaring omtrent de getrouwheid van de jaarrekening, bedoeld in [artikel 26, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel26
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: '26'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 29.1.b
    text: |-
      een mededeling omtrent het volkshuisvestingsverslag, bedoeld in [artikel 26, tweede lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel26
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: '26'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 29.1.c
    text: |-
      een mededeling omtrent het overzicht, bedoeld in [artikel 26, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel26
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: '26'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '29.2'
    text: |-
      De jaarrekening wordt niet vastgesteld of goedgekeurd, indien de toegelaten instelling geen kennis heeft kunnen
      nemen van de verklaring, bedoeld in het eerste lid, onderdeel *a*, die aan de jaarrekening moest zijn toegevoegd,
      tenzij onder de overige gegevens een wettige grond wordt meegedeeld waarom die verklaring ontbreekt.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel29
  - number: '29.3'
    text: |-
      De in het eerste lid, onderdelen a, b en c, genoemde stukken worden opgesteld overeenkomstig [bijlage III][ref1]
      bij dit besluit, welke bijlage bij ministeriële regeling kan worden gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005686
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005686
  - number: '30'
    text: |-
      De toegelaten instelling doet jaarlijks voor 1 juli aan Onze Minister, aan het college van burgemeester en
      wethouders van de gemeente waar zij haar woonplaats heeft en van elke gemeente waar zij feitelijk werkzaam is, en
      aan het bestuur van het Centraal Fonds voor de Volkshuisvesting toekomen:
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel30
  - number: 30.a
    text: |-
      de ingevolge [artikel 26][ref1] opgestelde stukken over het aan die datum voorafgaande verslagjaar en


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel26
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: '26'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 30.b
    text: |-
      de bij die stukken behorende verklaring en mededelingen, bedoeld in [artikel 29, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel29
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: '29'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '31.1'
    text: |-
      Onze Minister, de betrokken colleges van burgemeester en wethouders en het bestuur van het Centraal Fonds voor de
      Volkshuisvesting bevestigen binnen vier weken de ontvangst van de krachtens [artikel 30][ref1] aan hen gezonden
      bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel30
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: '30'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '31.2'
    text: |-
      Indien een toegelaten instelling een of meer van de bescheiden op 1 juli van een jaar niet aan Onze Minister, een
      betrokken college van burgemeester en wethouders of het bestuur van het Centraal Fonds voor de Volkshuisvesting
      heeft doen toekomen, stelt Onze Minister, eigener beweging of op een daartoe strekkende aanvraag van dat college,
      of stelt dat bestuur onverwijld een termijn van ten hoogste vier weken binnen welke de ontbrekende bescheiden
      alsnog moeten worden verstrekt en doet daarvan mededeling aan die toegelaten instelling.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel31
  - number: '31.3'
    text: |-
      Indien de toegelaten instelling de ontbrekende bescheiden niet binnen de krachtens het tweede lid gestelde
      termijn verstrekt, kan Onze Minister, eigener beweging of op een daartoe strekkende aanvraag van het college van
      burgemeester en wethouders, en kan het bestuur van het Centraal Fonds voor de Volkshuisvesting bepalen, dat zij,
      totdat zij die bescheiden alsnog verstrekt, de door hem aangegeven rechtshandelingen slechts kan verrichten na zijn
      instemming of de instemming van dat bestuur.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel31
  - number: '33.1'
    text: |-
      Onze Minister vormt zich jaarlijks voor 1 december een oordeel over de werkzaamheden van de toegelaten
      instellingen in het aan die datum voorafgaande verslagjaar. Hij betrekt het overzicht, bedoeld in
      [artikel 4, eerste lid, onderdeel a][ref1], van het Besluit Centraal Fonds voor de Volkshuisvesting, bij dat
      oordeel, indien hij dat overzicht op 1 november voorafgaand aan de in de eerste volzin bedoelde datum heeft
      ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel4
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '1'
  - number: '33.2'
    text: |-
      Onze Minister deelt het oordeel, bedoeld in het eerste lid, voor de in de eerste volzin van dat lid bedoelde datum
      mee aan de toegelaten instelling.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel33
  - number: '39'
    text: |-
      Indien een college van burgemeester en wethouders of het bestuur van het Centraal Fonds voor de Volkshuisvesting
      Onze Minister verzoekt maatregelen te nemen of te bevorderen waartoe hij ingevolge dit hoofdstuk bevoegd is, is hij
      gehouden naar aanleiding van dat verzoek een besluit te nemen.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel39
  - number: 39a.1
    text: |-
      Ten behoeve van het toezicht verstrekt de toegelaten instelling jaarlijks voor 1 juli aan Onze Minister de
      gegevens, bedoeld in [bijlage IV][ref1] bij dit besluit, welke bijlage bij ministeriële regeling kan worden
      gewijzigd, alsmede de mededeling, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005686
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel39a
    references:
      - id: ref1
        bwb_id: BWBR0005686
  - number: 39a.2
    text: |-
      De toegelaten instelling verzoekt aan een daartoe als openbaar optredende accountant als bedoeld in
      [artikel 27, eerste lid][ref1], of aan een organisatie waarin zodanige accountants samenwerken, om overeenkomstig
      [bijlage III][ref2] bij dit besluit een mededeling op te stellen omtrent de gegevens, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0005686
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel39a
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: '27'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005686
  - number: 39a.3
    text: Onze Minister bevestigt binnen vier weken de ontvangst van de krachtens het eerste lid gezonden bescheiden.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel39a
  - number: 39a.4
    text: |-
      Indien een toegelaten instelling de bescheiden op 1 juli van een jaar niet aan Onze Minister heeft doen toekomen,
      stelt hij onverwijld een termijn van ten hoogste vier weken binnen welke de bescheiden alsnog moeten worden
      verstrekt en doet daarvan mededeling aan die toegelaten instelling.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel39a
  - number: 39a.5
    text: |-
      Indien de toegelaten instelling de bescheiden niet binnen de krachtens het vierde lid gestelde termijn
      verstrekt, kan Onze Minister bepalen, dat zij, totdat zij de bescheiden alsnog verstrekt, de door hem aangegeven
      rechtshandelingen slechts kan verrichten na zijn instemming.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel39a
  - number: '40'
    text: |-
      Op verzoek van Onze Minister verleent de toegelaten instelling onverwijld inzage van de door hem verlangde
      bescheiden en verstrekt zij hem de door hem verlangde inlichtingen, voor zover dit naar zijn oordeel voor
      uitoefening van het toezicht nodig is.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel40
  - number: '41.1'
    text: |-
      Onze Minister kan in het belang van de volkshuisvesting een toegelaten instelling een aanwijzing geven. In een
      aanwijzing kan een toegelaten instelling worden verplicht:
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel41
  - number: 41.1.a
    text: zodanig te handelen dat een situatie die strijdig is met het belang van de volkshuisvesting wordt opgeheven of
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel41
  - number: 41.1.b
    text: een voorgenomen handelwijze die niet in het belang van de volkshuisvesting is achterwege te laten.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel41
  - number: '41.2'
    text: |-
      Onze Minister stelt in een aanwijzing die een toegelaten instelling tot een handeling verplicht een termijn binnen
      welke die toegelaten instelling daaraan dient te voldoen.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel41
  - number: '41.3'
    text: Een aanwijzing omvat de gevolgen die Onze Minister verbindt aan het niet voldoen aan die aanwijzing.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel41
  - number: '41.4'
    text: |-
      Onze Minister betrekt bij een besluit om een aanwijzing als bedoeld in het eerste lid te geven de situatie van de
      volkshuisvesting in de gemeenten waar de toegelaten instelling feitelijk werkzaam is.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel41
  - number: '41.5'
    text: |-
      Alvorens toepassing te geven aan het eerste lid kan Onze Minister, indien dit naar zijn oordeel wegens de aard van
      de voorgenomen aanwijzing noodzakelijk is, een of meer gemeenten of het Centraal Fonds voor de Volkshuisvesting in
      de gelegenheid stellen binnen een door hem te stellen termijn hun zienswijze over die toepassing aan hem kenbaar
      te maken.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel41
  - number: '41.6'
    text: Van een aanwijzing wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel41
  - number: '42'
    text: |-
      Een verzoek aan een toegelaten instelling om een bepaalde gedragslijn te volgen waarin niet is aangegeven
      welke gevolgen Onze Minister verbindt aan het niet voldoen aan dat verzoek, is geen aanwijzing in de zin van
      [artikel 41, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel41
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: '41'
        hoofdstuk: V
  - number: '43.1'
    text: |-
      Onze Minister kan in het belang van de volkshuisvesting bepalen dat een toegelaten instelling voor een door hem te
      bepalen tijdvak door hem aangegeven handelingen slechts kan verrichten met de voorafgaande instemming van een of
      meer door hem aangewezen personen of instanties, dan wel met zijn voorafgaande instemming. Een gemeente kan niet
      als instantie als bedoeld in de eerste volzin worden aangewezen.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel43
  - number: '43.2'
    text: |-
      Onze Minister kan, indien een toegelaten instelling niet binnen de in [artikel 41, tweede lid][ref1], bedoelde
      termijn voldoet aan een aanwijzing als bedoeld in [artikel 41, eerste lid][ref2], die de verplichting inhoudt tot
      handelingen die redelijkerwijs niet kunnen worden verricht zonder dat voorafgaand daaraan een schriftelijk plan
      daarvoor is opgesteld, bepalen dat een of meer door hem aangewezen personen of instanties dat plan opstellen.
      De toegelaten instelling verleent die personen of instanties alle medewerking daarbij. Een gemeente kan niet als
      instantie als bedoeld in dit lid worden aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0005686#Artikel41
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: '41'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0005686
        artikel: '41'
        hoofdstuk: V
  - number: '43.3'
    text: |-
      Onze Minister geeft geen toepassing aan het tweede lid, dan nadat hij de toegelaten instelling in de gelegenheid
      heeft gesteld binnen een door hem te bepalen termijn aannemelijk te maken dat zij binnen een redelijke termijn zal
      voldoen aan de in de eerste volzin van dat lid bedoelde aanwijzing.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel43
  - number: '43.4'
    text: |-
      De kosten, gepaard gaande met de door Onze Minister aan personen of instanties als bedoeld in het eerste en tweede
      lid opgedragen werkzaamheden komen voor rekening van de toegelaten instelling.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel43
  - number: 43a
    text: 'Onze Minister doet in december van elk jaar aan de Tweede Kamer der Staten-Generaal toekomen:'
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel43a
  - number: 43a.a
    text: |-
      een overzicht van de door de toegelaten instellingen voorgenomen activiteiten voor dat jaar, gebaseerd op de hem
      ingevolge [artikel 25f, eerste lid][ref1], gezonden samenvattingen, en


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel25f
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: 25f
        hoofdstuk: IIIA
  - number: 43a.b
    text: |-
      een rapportage over de door de toegelaten instellingen in het aan dat jaar voorafgaande jaar verrichte
      werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel43a
  - number: '44'
    text: |-
      Buiten de gevallen, bedoeld in de [artikelen 70, tweede lid, derde volzin][ref1], en
      [70a, tweede lid, van de Woningwet][ref2] kan de toelating worden ingetrokken, indien naar het oordeel van
      Onze Minister de toegelaten instelling zodanige schade aan het belang van de volkshuisvesting berokkent of bij
      handhaving van de toelating op korte termijn zal berokkenen, dat haar toelating niet langer in dat belang is te
      achten.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel70a
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '70'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 70a
  - number: '45'
    text: |-
      Een koninklijk besluit tot intrekking van de toelating wordt in de Staatscourant geplaatst. De werking ervan wordt
      opgeschort totdat de beroepstermijn is verstreken of, indien beroep is ingesteld, op het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel45
  - number: '46'
    text: |-
      [De artikelen 1][ref1], [11][ref2] tot en met [19][ref3], [21][ref4], [22][ref5], [24][ref6], [25][ref7],
      [26][ref8], [27, eerste lid][ref9], [28][ref10], [30][ref11], [39a, eerste lid][ref12], met uitzondering van
      de zinsnede «, alsmede de mededeling, bedoeld in [het tweede lid][ref13]», [derde][ref14], [vierde][ref15] en
      [vijfde lid][ref16], [40][ref17], [41][ref18] en [42 ][ref19]zijn van overeenkomstige toepassing op afzonderlijke
      organisatie-onderdelen van de gemeente die zijn belast met de exploitatie van van gemeentewege gebouwde of
      verworven woongelegenheden.


