  - number: 26.2.e.2°
    text: |-
      indien zij op 1 januari van het verslagjaar een toegelaten instelling is als bedoeld in
      [artikel 19, eerste lid][ref1]: aannemelijk maakt, dat deze voldoet aan [de artikelen 16][ref2],
      [17][ref3], [17a][ref4] en [19, tweede tot en met zesde lid][ref5], en aan de
      [artikelen 3, eerste, vierde en zesde lid][ref6], [4, eerste, tweede en vierde lid][ref7], [5][ref8] en
      [7, eerste, tweede en derde lid, van de Wet op het overleg huurders verhuurder][ref9];


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0005686#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0005686#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0005686#Artikel17a
      [ref5]: https://wetten.overheid.nl/BWBR0005686#Artikel19
