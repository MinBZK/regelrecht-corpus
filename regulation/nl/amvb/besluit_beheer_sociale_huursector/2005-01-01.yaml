---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_beheer_sociale_huursector
regulatory_layer: AMVB
publication_date: '2006-10-10'
valid_from: '2005-01-01'
bwb_id: BWBR0005686
url: https://wetten.overheid.nl/BWBR0005686/2005-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 28 april
    1992, nr. MJZ28492056, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Gelet op de artikelen 70, 71, 81 en 82 van de Woningwet (Stb. 1991, 439) en artikel 9 van de Huurprijzenwet
    woonruimte (Stb. 1986, 331);

    Gehoord de Raad voor de Volkshuisvesting (advies van 6 maart 1992, nr. 197);

    De Raad van State gehoord (advies van 28 augustus 1992, nr. W08.92.0192);

    Gezien het nader rapport van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 7
    oktober 1992, nr. MJZ08092001, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'Voor de toepassing van dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel1
  - number: 1.1.a
    text: |-
      Centraal Fonds voor de Volkshuisvesting: Centraal Fonds voor de Volkshuisvesting, bedoeld in
      [artikel 71 van de Woningwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel71
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '71'
  - number: 1.1.b
    text: |-
      woongelegenheid: woning, verzorgingshuis als bedoeld in
      [artikel 1, eerste lid, onderdeel b, van de Overgangswet][ref1] verzorgingshuizen, standplaats en woonwagen;


      [ref1]: https://wetten.overheid.nl/BWBR0001834#Artikel1
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001834
        artikel: '1'
  - number: 1.1.c
    text: |-
      voorziening: bouwkundige of bouwtechnische maatregel aan een woongelegenheid die strekt tot verbetering van de
      indeling of het woongerief, waaronder begrepen de daarbij noodzakelijke opheffing van technische gebreken, of tot
      bouwkundige splitsing of samenvoeging;
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel1
  - number: 1.1.d
    text: |-
      huurprijs: prijs die bij huur en verhuur is verschuldigd voor het enkele gebruik van een woongelegenheid,
      uitgedrukt in een bedrag per maand;
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel1
  - number: 1.1.e
    text: |-
      onrendabele investeringen: investeringen tegenover welke geen opbrengsten staan of opbrengsten staan die blijkens
      de raming daarvan niet kostendekkend zijn.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel1
  - number: '1.2'
    text: 'Voor de toepassing van dit besluit wordt onder de huurder mede verstaan:'
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel1
  - number: 1.2.a
    text: |-
      de medehuurder in de zin van de [artikelen 266][ref1] en [267 van Boek 7 van het Burgerlijk Wetboek][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel266
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel267
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '266'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '267'
  - number: 1.2.b
    text: |-
      de persoon, bedoeld in [artikel 268, tweede lid, van Boek 7, van het Burgerlijk Wetboek][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel268
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '268'
  - number: 1.2.c
    text: |-
      degene die de woongelegenheid met toestemming van de toegelaten instelling huurt van een huurder die haar huurt van
      die toegelaten instelling.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel1
  - number: '1.3'
    text: |-
      Voor de toepassing van dit besluit wordt onder de bewoner, naast de huurder, verstaan degene die met instemming van
      de huurder zijn hoofdverblijf in de gehuurde woongelegenheid heeft.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel1
  - number: '1.4'
    text: Voor de toepassing van dit besluit valt het verslagjaar in de zin van dit besluit samen met het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel1
  - number: 2a
    text: |-
      Voor de toepassing van dit besluit verbindt een toegelaten instelling zich met een andere rechtspersoon of
      vennootschap, indien:
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel2a
  - number: 2a.a
    text: |-
      die andere rechtspersoon of vennootschap een dochtermaatschappij als bedoeld in
      [artikel 24a van boek 2 van het Burgerlijk Wetboek][ref1] van haar wordt;


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24a
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24a
  - number: 2a.b
    text: |-
      zij in die andere rechtspersoon deelneemt in de zin van [artikel 24c van boek 2 van het Burgerlijk Wetboek][ref1]
      of;


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24c
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24c
  - number: 2a.c
    text: |-
      zij anderszins financiële of bestuurlijke banden met een bestaande andere rechtspersoon of vennootschap aangaat,
      stemrechten in de algemene vergadering van een bestaande andere rechtspersoon verwerft of een andere rechtspersoon
      of vennootschap opricht of doet oprichten, op een zodanige wijze dat daardoor een duurzame band met die
      rechtspersoon of vennootschap ontstaat.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel2a
  - number: '4.1'
    text: |-
      Een aanvraag om een toelating als bedoeld in [artikel 70, eerste lid, van de Woningwet][ref1] wordt door de
      vereniging of de stichting aan de Kroon gericht en bij Onze Minister ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel70
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '70'
  - number: '4.2'
    text: 'De aanvraag omvat:'
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel4
  - number: 4.2.a
    text: de gronden waarop deze rust;
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel4
  - number: 4.2.b
    text: |-
      een authentiek afschrift van de akte van oprichting van de vereniging of de stichting of van de notariële
      akte waarin de statuten van de vereniging na haar oprichting zijn opgenomen, en van de notariële akten waarin
      statutenwijzigingen zijn opgenomen;
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel4
  - number: 4.2.c
    text: |-
      het bewijs, dat de vereniging of de stichting is ingeschreven in een openbaar register, gehouden door de Kamer van
      Koophandel en Fabrieken binnen welker gebied zij haar woonplaats heeft;
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel4
  - number: 4.2.d
    text: |-
      het bewijs, dat een authentiek afschrift van de akte van oprichting of van de notariële akte waarin de statuten
      zijn opgenomen, dan wel een authentiek uittreksel van die akte, authentieke afschriften van de notariële akten
      waarin statutenwijzigingen zijn opgenomen en de statuten als laatstelijk gewijzigd ten kantore van die Kamer zijn
      neergelegd, en
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel4
  - number: 4.2.e
    text: |-
      zodanige bescheiden, dat Onze Minister een juist en volledig inzicht verkrijgt in de financiële situatie van de
      vereniging of de stichting.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel4
  - number: '4.3'
    text: |-
      Indien de oprichting van de vereniging of de stichting, al dan niet gezamenlijk met de oprichting van een of
      meer andere verenigingen of stichtingen, is geschied met het oogmerk om de werkzaamheden te gaan verrichten
      die ter plaatse worden verricht door een afzonderlijk organisatie-onderdeel van de gemeente dat is belast met
      de exploitatie van van gemeentewege gebouwde of verworven woongelegenheden en om daartoe die woongelegenheden
      in eigendom te verkrijgen, omvat de aanvraag voorts een rapport van bevindingen omtrent de financiële
      transacties tussen dat organisatie-onderdeel enerzijds en de algemene dienst en andere organisatie-onderdelen
      van de gemeente anderzijds, uitgebracht door een als openbaar accountant optredende accountant als bedoeld in
      [artikel 393, eerste lid, van boek 2 van het Burgerlijk Wetboek][ref1] of door een organisatie waarin zodanige
      accountants samenwerken. Het rapport omvat alle zodanige transacties over het tijdvak dat loopt vanaf 1 januari
      1991 tot een dag die ten hoogste een maand ligt voor het tijdstip waarop de aanvraag wordt ingediend, die naar
      het oordeel van de accountant mogelijk niet in het belang van de volkshuisvesting zijn verricht, en die over het
      genoemde tijdvak afzonderlijk of gezamenlijk meer dan 1 procent van de financiële middelen van het in de eerste
      volzin eerstgenoemde organisatie-onderdeel per 31 december 1990, en afzonderlijk of gezamenlijk ten minste € 25 000
      bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '5.1'
    text: |-
      Binnen acht weken na ontvangst van een aanvraag om een toelating als bedoeld in
      [artikel 70, eerste lid, van de Woningwet][ref1] stelt Onze Minister de gemeente waar de vereniging of de stichting
      haar woonplaats heeft, alsmede elke gemeente waar zij bij toelating naar verwachting feitelijk werkzaam zal zijn,
      in de gelegenheid haar zienswijze over de gevolgen van de toelating voor de volkshuisvesting ter plaatse aan hem
      kenbaar te maken. Die gemeenten kunnen binnen acht weken nadien hun zienswijzen aan Onze Minister doen toekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel70
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '70'
  - number: '5.2'
    text: |-
      Binnen acht weken na ontvangst van een aanvraag om een toelating als bedoeld in
      [artikel 70, eerste lid, van de Woningwet][ref1] stelt Onze Minister voorts het Centraal Fonds voor de
      Volkshuisvesting in de gelegenheid zijn zienswijze over de financiële aspecten van de toelating aan hem kenbaar te
      maken. Het fonds kan binnen acht weken nadien zijn zienswijze aan Onze Minister doen toekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel70
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '70'
  - number: '6.1'
    text: |-
      Onze Minister doet binnen acht weken na ontvangst van de zienswijzen, bedoeld in [artikel 5][ref1], een voordracht
      voor een koninklijk besluit tot toelating of tot weigering van de toelating. Hij betrekt die zienswijzen bij zijn
      voordracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel5
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '1'
  - number: '6.2'
    text: |-
      Indien een gemeente haar zienswijze of het Centraal Fonds voor de Volkshuisvesting zijn zienswijze
      niet of niet tijdig aan Onze Minister heeft doen toekomen, doet Onze Minister een voordracht
      als bedoeld in het eerste lid binnen acht weken na het verstrijken van de termijnen, bedoeld in
      [artikel 5, eerste lid, tweede volzin, en tweede lid, tweede volzin][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel5
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '1'
  - number: '6.3'
    text: Het koninklijk besluit wordt in de Staatscourant geplaatst.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel6
  - number: '7.1'
    text: |-
      Buiten het geval, bedoeld in [artikel 70, tweede lid, tweede volzin, van de Woningwet][ref1] wordt de toelating
      geweigerd, indien de statuten van de vereniging of de stichting niet voorzien in:


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel70
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '70'
  - number: 7.1.a
    text: de vermelding van de gemeente of een aanduiding van de gemeenten waar zij werkzaam is;
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel7
  - number: 7.1.b
    text: 'de instelling van een orgaan waaraan het toezicht op het bestuur is opgedragen, welk orgaan:'
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel7
  - number: 7.1.b.1°
    text: in staat is dat toezicht voortdurend uit te oefenen;
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel7
  - number: 7.1.b.2°
    text: |-
      bevoegd is tot het nemen van maatregelen die voor uitoefening van dat toezicht nodig zijn, en daartoe de uitvoering
      van besluiten van het bestuur kan schorsen, en
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel7
  - number: 7.1.b.3°
    text: niet is gehouden over zijn handelingen verantwoording aan het bestuur af te leggen;
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel7
  - number: 7.1.c
    text: |-
      de bepaling dat met personen die zitting hebben in het orgaan, bedoeld in onderdeel *b* , geen
      arbeidsovereenkomsten als bedoeld in [artikel 610, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref1]
      bestaan;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel610
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '610'
  - number: 7.1.d
    text: |-
      de bepaling dat het zitting hebben in het bestuur of in het orgaan, bedoeld in onderdeel b, onverenigbaar is met
      het lidmaatschap van het college van burgemeester en wethouders van de gemeente of van het college van gedeputeerde
      staten van de provincie waar de vereniging of de stichting haar woonplaats heeft, of van een gemeente of een
      provincie waar zij feitelijk werkzaam is, of van een orgaan van een organisatie die zich ten doel heeft gesteld de
      belangen van gemeenten of provincies te behartigen;
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel7
  - number: 7.1.e
    text: |-
      regels inzake de wijze waarop de huurders van de woongelegenheden van de vereniging of de stichting en in het
      belang van die huurders werkzame organisaties invloed kunnen uitoefenen op de samenstelling van het bestuur van
      die vereniging of stichting of van het orgaan, bedoeld in onderdeel *b* , welke regels in elk geval inhouden,
      dat het bestuur die huurders en zodanige organisaties in de gelegenheid stelt om, ten aanzien van ten minste twee
      vrijkomende plaatsen in het bestuur of orgaan, een bindende voordracht uit te brengen voor benoeming in dat bestuur
      of orgaan van een persoon uit hun kring, waarbij, in geval van een vereniging, wordt bepaald op welke wijze de
      betrokken benoeming tot stand komt ingeval aan de voordracht het bindende karakter is ontnomen;
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel7
  - number: 7.1.f
    text: |-
      de bepaling dat de algemene vergadering van een vereniging slechts een besluit kan nemen om aan een voordracht als
      bedoeld in onderdeel *e* het bindende karakter te ontnemen, indien op die vergadering een aantal stemmen kan worden
      uitgebracht dat ten minste de helft bedraagt van het aantal stemmen dat door de stemgerechtigden gezamenlijk kan
      worden uitgebracht;
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel7
  - number: 7.1.g
    text: |-
      de bepaling dat het orgaan, bedoeld in onderdeel *b* , de opdracht verleent tot het onderzoek, bedoeld in
      [artikel 27, eerste lid, eerste volzin][ref1], en dat, indien het orgaan niet daartoe overgaat, dit geschiedt door
      de algemene vergadering of, indien deze niet daartoe overgaat, het bestuur van de vereniging, dan wel door het
      bestuur van de stichting;


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel27
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: '27'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 7.1.h
    text: |-
      de bepaling dat de opdracht, bedoeld in onderdeel *g* , kan worden ingetrokken door het orgaan dat deze heeft
      verleend, en dat een zodanige door het bestuur verleende opdracht tevens kan worden ingetrokken door het orgaan,
      bedoeld in onderdeel *b* ;
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel7
  - number: 7.1.i
    text: |-
      de bepaling dat de vereniging of de stichting voor wijziging van de statuten de voorafgaande instemming van Onze
      Minister behoeft, en daartoe iedere voorgenomen wijziging daarvan aan hem voorlegt, en
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel7
  - number: 7.1.j
    text: 'bepalingen omtrent de ontbinding van de vereniging of de stichting, welke inhouden, dat:'
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel7
  - number: 7.1.j.1°
    text: het bestuur de ontbinding onverwijld aan Onze Minister meedeelt;
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel7
  - number: 7.1.j.2°
    text: |-
      na ontbinding de vereffening geschiedt door een of meer vereffenaars, te benoemen door het college van burgemeester
      en wethouders van de gemeente waar de ontbonden vereniging of stichting haar woonplaats had, op welke vereffenaars
      dat college toezicht houdt en welke vereffenaars door dat college kunnen worden geschorst of ontslagen, in welk
      laatste geval het een of meer nieuwe vereffenaars benoemt;
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel7
  - number: 7.1.j.3°
    text: |-
      indien de onroerende zaken gelegen zijn binnen het werkgebied van een of meer toegelaten instellingen, de
      vereffenaar de goederen en de schulden van de ontbonden vereniging of stichting bij voorrang aan die toegelaten
      instellingen aanbiedt ter gehele of gedeeltelijke overneming, en, voor zover die toegelaten instellingen die
      goederen of schulden niet overnemen, hij die goederen of schulden ter gehele of gedeeltelijke overneming aanbiedt
      aan de gemeente waar de onroerende zaken gelegen zijn, en, voor zover de gemeente die goederen of schulden niet
      overneemt, hij de huurders van de tot die zaken behorende woongelegenheden in de gelegenheid stelt deze in eigendom
      te verkrijgen;
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel7
  - number: 7.1.j.4°
    text: |-
      indien de ontbonden vereniging of stichting op het tijdstip van ontbinding geen onroerende zaken bezat, de
      vereffenaar de goederen en de schulden van die vereniging of stichting ter overneming aanbiedt aan de gemeente waar
      die vereniging of stichting haar woonplaats had;
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel7
  - number: 7.1.j.5°
    text: |-
      voor zover wegens het niet aanvaarden van de aanbiedingen, bedoeld onder 3° en 4°, de goederen en de schulden
      niet zijn overgenomen, de vereffenaar de goederen van de ontbonden vereniging of stichting te gelde maakt en haar
      schulden voldoet en
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel7
  - number: 7.1.j.6°
    text: |-
      de vereffenaar de middelen die zijn overgebleven na het overeenkomstig onderdeel 3°, 4° of 5° te gelde maken van de
      goederen van de ontbonden vereniging of stichting, en na het voldoen van haar schulden, stort in het Centraal Fonds
      voor de Volkshuisvesting.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel7
  - number: '7.2'
    text: 'De toelating wordt voorts geweigerd, indien de statuten een bepaling bevatten waaraan:'
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel7
  - number: 7.2.a
    text: |-
      personen waarop het eerste lid, onderdeel d, van toepassing is het recht kunnen ontlenen om personen te benoemen
      in het bestuur van de vereniging of de stichting, of in het orgaan, bedoeld in het eerste lid, onderdeel b, of om
      personen voor een zodanige benoeming voor te dragen, of
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel7
  - number: 7.2.b
    text: |-
      het recht kan worden ontleend tot het verkrijgen van de eigendom van onroerende zaken van de vereniging of de
      stichting op een andere wijze dan die, bedoeld in het eerste lid, onderdeel *j*, onder 3° en 4°.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel7
  - number: '7.3'
    text: |-
      Het eerste lid, onderdeel d, en het tweede lid, onderdeel a, zijn, voorzover het betreft het lidmaatschap
      van het college van burgemeester en wethouders van de gemeente of van het college van gedeputeerde staten
      van de provincie waar de vereniging of de stichting haar woonplaats heeft, of van een gemeente of een
      provincie waar zij feitelijk werkzaam is, niet van toepassing op een vereniging of stichting als bedoeld in
      [artikel 4, derde lid, eerste volzin][ref1], indien door die vereniging of stichting op of na 1 januari 1993 en
      voor 1 mei 1996 een aanvraag om toelating bij Onze Minister is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel4
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '1'
  - number: '8.1'
    text: |-
      De toelating wordt bovendien geweigerd, indien naar het oordeel van Onze Minister de vereniging of de stichting
      niet voldoende financieel draagkrachtig is of de financiële continuïteit van die vereniging of stichting niet
      voldoende is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel8
  - number: '8.2'
    text: |-
      De toelating van een vereniging of stichting als bedoeld in [artikel 4, derde lid, eerste volzin][ref1], wordt
      bovendien geweigerd, indien het rapport van bevindingen, bedoeld in die volzin, daar naar het oordeel van Onze
      Minister aanleiding toe geeft, of indien transacties als bedoeld in die volzin die hebben plaatsgevonden op of na
      de dag waarop dat rapport is uitgebracht daar naar zijn oordeel aanleiding toe geven.


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel4
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '1'
  - number: '8.3'
    text: De toelating kan voorts worden geweigerd op grond van gebreken in de akte van oprichting.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel8
  - number: '9.1'
    text: |-
      Onze Minister stemt slechts in met een voorgenomen wijziging van de statuten van de toegelaten instelling, indien
      die wijziging voldoet aan [artikel 7][ref1], er niet toe leidt dat de toegelaten instelling niet voldoet aan
      [artikel 8, eerste lid][ref2], en ook overigens naar zijn oordeel het belang van de volkshuisvesting zich niet
      daartegen verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005686#Artikel8
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: '7'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0005686
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: '1'
  - number: '9.2'
    text: |-
      Indien de voorgenomen wijziging van de statuten van de toegelaten instelling gevolgen heeft voor haar financiële
      situatie, stelt Onze Minister binnen acht weken na ontvangst van die wijziging het Centraal Fonds voor de
      Volkshuisvesting in de gelegenheid zijn zienswijze over de financiële aspecten van die wijziging aan hem kenbaar te
      maken. Het fonds kan binnen vier weken nadien zijn zienswijze aan Onze Minister doen toekomen.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel9
  - number: '9.3'
    text: |-
      Indien de voorgenomen wijziging van de statuten van de toegelaten instelling betrekking heeft op haar werkgebied,
      kan Onze Minister, binnen acht weken na ontvangst van die wijziging, de gemeenten waar zij na die wijziging
      naar verwachting feitelijk werkzaam zal zijn in de gelegenheid stellen hun zienswijzen over de gevolgen van die
      wijziging voor de volkshuisvesting ter plaatse aan hem kenbaar te maken. Die gemeenten kunnen binnen vier weken
      nadien hun zienswijzen aan Onze Minister doen toekomen.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel9
  - number: '9.4'
    text: |-
      Onze Minister kan instemmen met een voorgenomen wijziging van statuten van een toegelaten instelling zonder
      toepassing van een of meer van de ingevolge het eerste lid aan die instemming verbonden vereisten, indien die
      wijziging uitsluitend een uitbreiding van haar werkgebied inhoudt.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel9
  - number: '10.1'
    text: |-
      Indien de voorgenomen wijziging van de statuten van de toegelaten instelling geen gevolgen heeft voor haar
      financiële situatie en voorts hetzij geen betrekking heeft op haar werkgebied, hetzij geen aanleiding heeft
      gegeven tot toepassing van [artikel 9, derde lid][ref1], neemt Onze Minister binnen acht weken na ontvangst van die
      wijziging een beslissing omtrent instemming daarmee.


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel9
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: '9'
        hoofdstuk: II
        afdeling: '2'
  - number: '10.2'
    text: |-
      Indien de voorgenomen wijziging van de statuten van de toegelaten instelling gevolgen heeft voor haar
      financiële situatie, neemt Onze Minister binnen acht weken na ontvangst van de zienswijze, bedoeld in
      [artikel 9, tweede lid][ref1], een beslissing omtrent instemming met die wijziging. Hij betrekt die zienswijze bij
      zijn beslissing. Indien het Centraal Fonds voor de Volkshuisvesting zijn zienswijze niet of niet tijdig aan Onze
      Minister heeft doen toekomen, neemt hij een beslissing als bedoeld in de eerste volzin binnen acht weken na het
      verstrijken van de termijn, bedoeld in [artikel 9, tweede lid, tweede volzin][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005686#Artikel9
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: '9'
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005686
        artikel: '9'
        hoofdstuk: II
        afdeling: '2'
  - number: '10.3'
    text: |-
      Indien de voorgenomen wijziging van de statuten van de toegelaten instelling betrekking heeft op haar werkgebied en
      aanleiding heeft gegeven tot toepassing van [artikel 9, derde lid][ref1], neemt Onze Minister binnen acht weken na
      ontvangst van de zienswijzen, bedoeld in dat lid, een beslissing omtrent instemming met die wijziging. Hij betrekt
      die zienswijzen bij zijn beslissing. Indien een gemeente haar zienswijze niet of niet tijdig aan Onze Minister
      heeft doen toekomen, neemt hij een beslissing als bedoeld in de eerste volzin binnen acht weken na het verstrijken
      van de termijn, bedoeld in [artikel 9, derde lid, tweede volzin][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005686#Artikel9
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: '9'
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005686
        artikel: '9'
        hoofdstuk: II
        afdeling: '2'
  - number: 10a
    text: |-
      Indien bij een fusie als bedoeld in [artikel 309 van boek 2 van het Burgerlijk Wetboek][ref1] hetzij een
      rechtspersoon die geen toegelaten instelling is het vermogen van een toegelaten instelling onder algemene
      titel verkrijgt, hetzij door twee toegelaten instellingen of mede door een toegelaten instelling een nieuwe
      rechtspersoon wordt opgericht, stemt Onze Minister slechts in met die fusie, indien die rechtspersoon toepassing
      heeft gegeven aan [artikel 4, eerste lid][ref2], en toetsing van de in dat artikellid bedoelde aanvraag aan
      [de artikelen 4, tweede lid][ref3], en [5][ref4] tot en met [8][ref5] heeft geleid tot een toelating van die
      rechtspersoon, als bedoeld in [artikel 70, eerste lid, van de Woningwet][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0005686#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005686#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0005686#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005686#Artikel8
      [ref6]: https://wetten.overheid.nl/BWBR0005181#Artikel70
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0003045
      - id: ref2
        bwb_id: BWBR0005686
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0005686
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0005686
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '1'
      - id: ref5
        bwb_id: BWBR0005686
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: '1'
      - id: ref6
        bwb_id: BWBR0005181
        artikel: '70'
  - number: 10b
    text: |-
      Indien bij een fusie als bedoeld in [artikel 309 van boek 2 van het Burgerlijk Wetboek][ref1] een
      toegelaten instelling het vermogen van een andere rechtspersoon onder algemene titel verkrijgt, zijn
      [de artikelen 9, eerste, tweede en derde lid][ref2], en [10][ref3] van overeenkomstige toepassing op die fusie.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel309
      [ref2]: https://wetten.overheid.nl/BWBR0005686#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0005686#Artikel10
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '309'
      - id: ref2
        bwb_id: BWBR0005686
        artikel: '9'
        hoofdstuk: II
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005686
        artikel: '10'
        hoofdstuk: II
        afdeling: '2'
  - number: '11.1'
    text: |-
      De toegelaten instelling is uitsluitend werkzaam op het gebied van de volkshuisvesting. Zij neemt bij haar
      werkzaamheden het bepaalde in de paragrafen 2 tot en met 6 in acht.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel11
  - number: '11.2'
    text: |-
      Het gebied van de volkshuisvesting omvat, behoudens de [artikelen 12a, tweede lid][ref1], en
      [12b, tweede lid][ref2], uitsluitend:


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0005686#Artikel12b
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: 12a
        hoofdstuk: III
        paragraaf: 2a
      - id: ref2
        bwb_id: BWBR0005686
        artikel: 12b
        hoofdstuk: III
        paragraaf: 2b
  - number: 11.2.a
    text: het bouwen, verwerven, bezwaren en slopen van woongelegenheden en onroerende aanhorigheden;
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel11
  - number: 11.2.b
    text: |-
      het in stand houden van en het treffen van voorzieningen aan haar woongelegenheden en onroerende aanhorigheden, en
      aan woongelegenheden en onroerende aanhorigheden van derden;
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel11
  - number: 11.2.c
    text: |-
      het in stand houden en verbeteren van de direct aan de woongelegenheden en aanhorigheden, bedoeld in onderdeel
      *b* , grenzende omgeving;
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel11
  - number: 11.2.d
    text: het beheren, toewijzen en verhuren van woongelegenheden en onroerende aanhorigheden;
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel11
  - number: 11.2.e
    text: het vervreemden van woongelegenheden en onroerende aanhorigheden;
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel11
  - number: 11.2.f
    text: |-
      het aan bewoners van bij de toegelaten instelling in beheer zijnde woongelegenheden verlenen van diensten
      die rechtstreeks verband houden met de bewoning, alsmede het, aan personen die te kennen geven een zodanige
      woongelegenheid te willen betrekken, verlenen van diensten die rechtstreeks verband houden met het huisvesten van
      die personen, en
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel11
  - number: 11.2.g
    text: |-
      de werkzaamheden die noodzakelijkerwijs voortvloeien uit het verrichten van de werkzaamheden, genoemd in de
      onderdelen *a* tot en met *f* .
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel11
  - number: 11a.1
    text: |-
      De werkzaamheden van de toegelaten instelling dragen bij aan de uitvoering van de
      [artikelen 12 tot en met 22][ref1] overeenkomstig dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel12
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: '12'
        hoofdstuk: III
        paragraaf: '2'
  - number: 11a.2
    text: |-
      De toegelaten instelling verbindt zich slechts met een andere rechtspersoon of vennootschap, indien dit
      noodzakelijk is om te voldoen aan het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel11a
  - number: 11c.1
    text: |-
      De toegelaten instelling vervreemdt haar woongelegenheden, indien de verkrijger daarvan geen toegelaten instelling
      is, slechts tegen een prijs van ten minste 90 procent van de onderhandse verkoopwaarde vrij van huur en gebruik van
      die woongelegenheden, met uitzondering van de gevallen, genoemd in het tweede, derde en vierde lid.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel11c
  - number: 11c.2
    text: |-
      Indien een woning in de zin van de [Wet bevordering eigenwoningbezit][ref1] wordt verkocht aan een eigenaar-
      bewoner in de zin van die wet die een eigenwoningbijdrage in de zin van die wet zal ontvangen en in die woning zijn
      hoofdverblijf zal hebben, vervreemdt de toegelaten instelling die woning tegen een prijs van ten minste 80 procent
      van de onderhandse verkoopwaarde vrij van huur en gebruik van die woning.


      [ref1]: https://wetten.overheid.nl/BWBR0011919
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel11c
    references:
      - id: ref1
        bwb_id: BWBR0011919
  - number: 11c.3
    text: |-
      Indien een bestaande woning in de zin van de [Wet bevordering eigenwoningbezit][ref1] wordt verkocht aan een
      eigenaar-bewoner in de zin van die wet die een eigenwoningbijdrage in de zin van die wet zal ontvangen en in die
      woning voor de verkoop reeds zijn hoofdverblijf had, vervreemdt de toegelaten instelling die woning tegen een prijs
      van ten minste 70 procent van de onderhandse verkoopwaarde vrij van huur en gebruik van die woning.


      [ref1]: https://wetten.overheid.nl/BWBR0011919
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel11c
    references:
      - id: ref1
        bwb_id: BWBR0011919
  - number: 11c.4
    text: |-
      Onze Minister kan op een daartoe strekkende aanvraag van een toegelaten instelling afwijking van het eerste lid
      toestaan in andere gevallen dan die, genoemd in het tweede en derde lid, indien het belang van de volkshuisvesting
      zich naar zijn oordeel niet tegen die afwijking verzet.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel11c
  - number: 11d.1
    text: |-
      De toegelaten instelling meldt aan Onze Minister haar voornemens tot het vervreemden van onroerende zaken aan en
      het op onroerende zaken vestigen van een recht van erfpacht, van opstal of van vruchtgebruik ten behoeve van:
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel11d
  - number: 11d.1.a
    text: natuurlijke personen en
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel11d
  - number: 11d.1.b
    text: rechtspersonen of vennootschappen die geen toegelaten instelling zijn.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel11d
  - number: 11d.2
    text: |-
      Een melding als bedoeld in het eerste lid geschiedt bij een afzonderlijke schriftelijke mededeling, welke de
      gegevens bevat die door Onze Minister noodzakelijk worden geacht om het betrokken voornemen te kunnen beoordelen.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel11d
  - number: 11d.3
    text: |-
      Bij ministeriële regeling kunnen beperkingen op de in het eerste lid bedoelde meldingsplicht worden aangebracht,
      indien naar het oordeel van Onze Minister voldoende vast is komen te staan dat de daardoor niet meer te melden
      voornemens zullen passen in het volkshuisvestingsbeleid en dat voldoende invloed van de gemeente op die voornemens
      zal zijn gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel11d
  - number: 11e.1
    text: |-
      Onze Minister bevestigt binnen twee weken de ontvangst van een melding als bedoeld in
      [artikel 11d, eerste lid][ref1]. Hij stelt voorts, binnen twee weken na ontvangst van een melding van een voornemen
      als bedoeld in [artikel 11d, eerste lid][ref2], tot het vervreemden van onroerende zaken, elke gemeente waar die
      zaken gelegen zijn in de gelegenheid haar zienswijze over de gevolgen van dat voornemen voor de volkshuisvesting
      ter plaatse aan hem kenbaar te maken, indien dat voornemen niet is opgenomen in afspraken als bedoeld in
      [artikel 25f, tweede lid][ref3]. Hij kan voorts, binnen twee weken na ontvangst van een melding van een voornemen
      als bedoeld in [artikel 11d, eerste lid][ref4], tot het vestigen van rechten als bedoeld in dat lid, toepassing
      geven aan de tweede volzin. De gemeenten kunnen binnen drie weken nadien hun zienswijzen aan Onze Minister doen
      toekomen. Onze Minister doet onverwijld mededeling aan de betrokken toegelaten instelling van de ontvangst van
      die zienswijzen.


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel11d
      [ref2]: https://wetten.overheid.nl/BWBR0005686#Artikel11d
      [ref3]: https://wetten.overheid.nl/BWBR0005686#Artikel25f
      [ref4]: https://wetten.overheid.nl/BWBR0005686#Artikel11d
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel11e
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: 11d
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005686
        artikel: 11d
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005686
        artikel: 25f
        hoofdstuk: IIIA
      - id: ref4
        bwb_id: BWBR0005686
        artikel: 11d
        hoofdstuk: III
        paragraaf: '1'
  - number: 11e.2
    text: |-
      Indien de zienswijzen van de in het eerste lid bedoelde gemeenten niet binnen drie weken nadat Onze Minister hen
      tot het geven daarvan in de gelegenheid heeft gesteld in zijn bezit zijn, stelt hij onverwijld een termijn van ten
      hoogste drie weken binnen welke die gemeenten hun zienswijzen alsnog aan hem kunnen doen toekomen en doet daarvan,
      en van de ontvangst van die zienswijzen, onverwijld mededeling aan de betrokken toegelaten instelling.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel11e
  - number: 11e.3
    text: 'De toegelaten instelling kan het betrokken voornemen uitvoeren, indien:'
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel11e
  - number: 11e.3.a
    text: |-
      Onze Minister niet binnen drie weken na ontvangst van de zienswijzen, bedoeld in het eerste lid, aan de toegelaten
      instelling een aanwijzing als bedoeld in [artikel 41, eerste lid][ref1], heeft gegeven die de uitvoering van het
      betrokken voornemen verbiedt;


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel41
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel11e
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: '41'
        hoofdstuk: V
  - number: 11e.3.b
    text: uit een schriftelijke mededeling van Onze Minister blijkt dat hij daartegen geen bezwaar heeft of
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel11e
  - number: 11e.3.c
    text: |-
      elf weken zijn verstreken vanaf de ontvangst van de melding van dat voornemen door Onze Minister, zonder dat hetzij
      uit een aanwijzing als bedoeld in [artikel 41, eerste lid][ref1], is gebleken dat hij daartegen bezwaar heeft,
      hetzij uit een mededeling als bedoeld in de tweede volzin van het vierde lid is gebleken dat hij daartegen bezwaar
      zou kunnen hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel41
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel11e
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: '41'
        hoofdstuk: V
  - number: 11e.4
    text: |-
      Onze Minister kan, indien de melding daartoe naar zijn oordeel aanleiding geeft, de in onderdeel a van het derde
      lid genoemde termijn met ten hoogste twee weken verlengen. Hij deelt een verlenging binnen de in onderdeel a van
      het derde lid genoemde termijn mee aan de betrokken toegelaten instelling en de gemeenten die een zienswijze als
      bedoeld in het eerste lid aan hem hebben doen toekomen.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel11e
  - number: 11f
    text: |-
      De toegelaten instelling neemt bij haar werkzaamheden het in de betrokken gemeenten geldende
      volkshuisvestingsbeleid in acht.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel11f
  - number: '12'
    text: |-
      De toegelaten instelling zet de middelen voor het verrichten van de werkzaamheden, genoemd in
      [artikel 11, tweede lid, onderdelen a, b en c][ref1], zodanig in, dat zo veel mogelijk wordt voldaan aan de eisen
      die ter plaatse in het belang van de huisvesting van de bevolking redelijkerwijs kunnen worden gesteld aan de
      kwaliteit van woongelegenheden.


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel11
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: '11'
        hoofdstuk: III
        paragraaf: '1'
  - number: 12a.1
    text: |-
      De toegelaten instelling draagt bij aan de leefbaarheid in de buurten en wijken waar haar woongelegenheden gelegen
      zijn.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel12a
  - number: 12a.2
    text: |-
      Ter uitvoering van het eerste lid kan de toegelaten instelling, naast de werkzaamheden, genoemd in de
      [artikelen 11, tweede lid][ref1], en [12b, tweede lid][ref2], uitsluitend overgaan tot:


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005686#Artikel12b
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: '11'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005686
        artikel: 12b
        hoofdstuk: III
        paragraaf: 2b
  - number: 12a.2.a
    text: het bouwen, verwerven, bezwaren en slopen van andere gebouwen dan woongelegenheden;
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel12a
  - number: 12a.2.b
    text: het in stand houden van en het treffen van voorzieningen aan andere gebouwen dan woongelegenheden;
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel12a
  - number: 12a.2.c
    text: het in stand houden en verbeteren van de omgeving buiten de directe nabijheid van woongelegenheden;
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel12a
  - number: 12a.2.d
    text: het verhuren van andere gebouwen dan woongelegenheden;
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel12a
  - number: 12a.2.e
    text: het vervreemden van andere gebouwen dan woongelegenheden;
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel12a
  - number: 12a.2.f
    text: het verrichten van andere werkzaamheden die ten goede komen aan het woongenot in een buurt of wijk en
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel12a
  - number: 12a.2.g
    text: |-
      de werkzaamheden die noodzakelijkerwijs voortvloeien uit het verrichten van de werkzaamheden, genoemd in de
      onderdelen *a* tot en met *f* .
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel12a
  - number: 12a.3
    text: |-
      De toegelaten instelling verricht werkzaamheden als bedoeld in de onderdelen *a* tot en met *g* van het tweede lid
      slechts, indien zij zich daarbij de uitvoering van het eerste lid als enige of voornaamste doel stelt.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel12a
  - number: 12b.1
    text: |-
      De toegelaten instelling draagt bij aan het volgens redelijke wensen tot stand brengen van huisvesting voor
      ouderen, gehandicapten en personen die zorg of begeleiding behoeven.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel12b
  - number: 12b.2
    text: |-
      Ter uitvoering van het eerste lid kan de toegelaten instelling, naast de werkzaamheden, genoemd in de
      [artikelen 11, tweede lid][ref1], en [12a, tweede lid][ref2], uitsluitend overgaan tot:


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005686#Artikel12a
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: '11'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005686
        artikel: 12a
        hoofdstuk: III
        paragraaf: 2a
  - number: 12b.2.a
    text: |-
      het bouwen en exploiteren van woon-zorgcomplexen en de daarbij behorende gemeenschappelijke ruimten en fysieke
      zorginfrastructuur, van projecten voor begeleid wonen, en van vastgoed met een woon- of verblijffunctie voor de
      bewoners van instellingen in de verzorging, verpleging of opvang;
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel12b
  - number: 12b.2.b
    text: |-
      het leveren van een bijdrage aan de totstandkoming van arrangementen met betrekking tot wonen, zorg- en
      dienstverlening, die, zoveel mogelijk naar wens van de in het eerste lid bedoelde personen, het zelfstandig wonen
      bevorderen;
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel12b
  - number: 12b.2.c
    text: het vervullen van een bemiddelende rol voor bewoners met betrekking tot zorg- en dienstverlening of
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel12b
  - number: 12b.2.d
    text: |-
      de werkzaamheden die noodzakelijkerwijs voortvloeien uit het verrichten van de werkzaamheden, genoemd in de
      onderdelen a tot en met c.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel12b
  - number: '13.1'
    text: |-
      Onverminderd [artikel 70c, eerste lid, van de Woningwet][ref1] geeft de toegelaten instelling bij het verhuren
      van woningen met een rekenhuur als bedoeld in [artikel 5, eerste lid, van de Huursubsidiewet][ref2], die gelijk is
      aan of lager is dan de aftoppingsgrens, bedoeld in [artikel 20, tweede lid, van die wet][ref3], zo veel mogelijk
      voorrang aan woningzoekenden die een zodanig rekeninkomen als bedoeld in [artikel 3 van die wet][ref4] genieten,
      dat zij een beroep kunnen doen op huursubsidie in de zin van [artikel 1, onderdeel e, van die wet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel70c
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0008659#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0008659#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0008659#Artikel1
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 70c
      - id: ref2
        bwb_id: BWBR0008659
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0008659
        artikel: '20'
      - id: ref4
        bwb_id: BWBR0008659
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0008659
        artikel: '1'
  - number: '13.2'
    text: |-
      De toegelaten instelling bouwt of verwerft woningen op een zodanige wijze, dat aan woningzoekenden als bedoeld in
      het eerste lid zo veel mogelijk een woning als bedoeld in dat lid kan worden verhuurd.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel13
  - number: '13.3'
    text: |-
      De toegelaten instelling kan, onverminderd het tweede lid, het meest recente inkomen van de woningzoekende, en
      de actuele vraag naar en het actuele aanbod ter plaatse van woongelegenheden, betrekken bij het verhuren van haar
      woningen.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel13
  - number: '14'
    text: |-
      Onverminderd [artikel 70c, eerste lid, van de Woningwet][ref1] en [artikel 13, eerste lid][ref2], streeft de
      toegelaten instelling er bij het verhuren van haar woningen naar, dat door huurders in een zo gering mogelijke mate
      een beroep wordt gedaan op bijdragen op voet van de [Huursubsidiewet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel70c
      [ref2]: https://wetten.overheid.nl/BWBR0005686#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0008659
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 70c
      - id: ref2
        bwb_id: BWBR0005686
        artikel: '13'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0008659
  - number: '15'
    text: |-
      De toegelaten instelling stelt criteria op aan de hand waarvan zij, onverminderd [artikel 13][ref1], beoordeelt of
      en in welke mate zij haar woongelegenheden vervreemdt. Zij schenkt daarbij afzonderlijk aandacht aan vervreemding
      aan huurders van die woongelegenheden.


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel13
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: '13'
        hoofdstuk: III
        paragraaf: '3'
  - number: 15a.1
    text: |-
      De gemiddelde huurprijs van de woningen van de toegelaten instelling op 1 juli van enig jaar is niet hoger dan
      de gemiddelde huurprijs van die woningen op 30 juni daaraan voorafgaand, vermeerderd met het inflatiepercentage,
      bedoeld in [artikel 1, tweede lid, van het Besluit huurprijzen woonruimte][ref1] en vermeerderd met 0,4 procent.


      [ref1]: https://wetten.overheid.nl/BWBR0003237#Artikel1
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0003237
        artikel: '1'
  - number: 15a.2
    text: |-
      Bij de berekening van de gemiddelde huurprijs, bedoeld in het eerste lid, wordt geen rekening gehouden met
      woningen:
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel15a
  - number: 15a.2.a
    text: die per 1 juli van het betrokken jaar voor het eerst of aan een opvolgende huurder zijn verhuurd;
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel15a
  - number: 15a.2.b
    text: |-
      waarvan de huurprijs per 1 juli van het betrokken jaar is verhoogd als gevolg van een woningverbetering als bedoeld
      in [artikel 255 van Boek 7 van het Burgerlijk Wetboek][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel255
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '255'
  - number: 15a.2.c
    text: die een onzelfstandige woonruimte vormen.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel15a
  - number: '16.1'
    text: |-
      De toegelaten instelling stelt de huurders van haar woongelegenheden in de gelegenheid klachten over haar handelen
      of nalaten, of het handelen of nalaten van personen die voor haar werkzaamheden verrichten, in te dienen bij een
      klachtencommissie die tot taak heeft haar met redenen omkleed over de behandeling van die klachten te adviseren.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel16
  - number: '16.2'
    text: |-
      De toegelaten instelling deelt aan de huurder die de klacht heeft ingediend zo spoedig mogelijk schriftelijk en
      met redenen omkleed mee, of zij naar aanleiding van de behandeling van de klacht maatregelen zal nemen en, zo ja,
      welke.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel16
  - number: '16.3'
    text: |-
      De toegelaten instelling geeft bij reglement regels omtrent de samenstelling en de werkwijze van de
      klachtencommissie.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel16
  - number: '17'
    text: |-
      De toegelaten instelling voert ten minste een maal per jaar overleg met de huurders van haar woongelegenheden of
      met hun vertegenwoordigers. Zij geeft bij reglement regels omtrent dat overleg.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel17
  - number: 17a.1
    text: |-
      De toegelaten instelling draagt er zorg voor, dat een door bewoners van haar woongelegenheden in het leven geroepen
      bewonerscommissie die geen huurdersorganisatie in de zin van de Wet op het overleg huurders verhuurder is, de
      werkzaamheden die met haar taak verband houden kan verrichten.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel17a
  - number: 17a.2
    text: |-
      De toegelaten instelling kan besluiten een bewonerscommissie als bedoeld in het eerste lid niet als
      vertegenwoordiger van bewoners aan te merken, indien de commissie niet aannemelijk kan maken dat zij namens
      bewoners met de toegelaten instelling in overleg kan treden.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel17a
  - number: 17a.3
    text: |-
      De toegelaten instelling kan bij reglement bepalen dat een bewonerscommissie als bedoeld in het eerste lid eerst
      dan als vertegenwoordiger van bewoners kan worden aangemerkt, indien de commissie namens ten minste een bij dat
      reglement te bepalen aantal bewoners met de toegelaten instelling in overleg kan treden.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel17a
  - number: '18.1'
    text: 'Dit artikel is uitsluitend van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel18
  - number: 18.1.a
    text: toegelaten instellingen die minder dan honderd woongelegenheden verhuren en
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel18
  - number: 18.1.b
    text: |-
      toegelaten instellingen die honderd of meer woongelegenheden verhuren, ten aanzien van welke woongelegenheden geen
      huurdersorganisatie in de zin van de Wet op het overleg huurders verhuurder werkzaam is.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel18
  - number: '18.2'
    text: |-
      De toegelaten instelling informeert de huurders van haar woongelegenheden of hun vertegenwoordigers zodanig tijdig
      over onderwerpen van beleid of beheer die voor de huurders van wezenlijk belang kunnen zijn, dat die huurders of
      vertegenwoordigers in de gelegenheid zijn daarop hun zienswijze te geven op een tijdstip dat die zienswijze van
      invloed kan zijn op vaststelling of wijziging van het beleid of de voornemens van de toegelaten instelling.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel18
  - number: '18.3'
    text: 'Tot de onderwerpen, bedoeld in het tweede lid, behoren in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel18
  - number: 18.3.a
    text: |-
      het in stand houden van en het treffen van voorzieningen aan woongelegenheden en de direct daaraan grenzende
      omgeving;
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel18
  - number: 18.3.b
    text: het beleid inzake de leefbaarheid in de buurten en wijken waar haar woongelegenheden gelegen zijn;
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel18
  - number: 18.3.c
    text: |-
      het beleid inzake het bijdragen aan het tot stand brengen van huisvesting voor ouderen, gehandicapten en personen
      die zorg of begeleiding behoeven;
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel18
  - number: 18.3.d
    text: het beleid inzake het vervreemden, bezwaren en slopen van woongelegenheden;
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel18
  - number: 18.3.e
    text: haar voornemens tot het vervreemden en bezwaren van woongelegenheden;
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel18
  - number: 18.3.f
    text: het toewijzings- en verhuurbeleid;
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel18
  - number: 18.3.g
    text: de door de toegelaten instelling in het algemeen te hanteren voorwaarden van de overeenkomst van huur en verhuur;
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel18
  - number: 18.3.h
    text: het beleid inzake de huurprijzen en
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel18
  - number: 18.3.i
    text: |-
      de samenstelling, het kwaliteitsniveau en de prijs van het door de toegelaten instelling aan te bieden pakket van
      diensten als bedoeld in [artikel 11, tweede lid, onderdeel f][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel11
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: '11'
        hoofdstuk: III
        paragraaf: '1'
  - number: '18.4'
    text: |-
      De toegelaten instelling is niet gehouden om toepassing te geven aan het tweede lid in samenhang met het derde
      lid, onderdeel e, ten aanzien van andere huurders dan de huurders van de woongelegenheden die zij voornemens is te
      vervreemden of te bezwaren.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel18
  - number: '18.5'
    text: |-
      Indien huurders de toegelaten instelling te kennen hebben gegeven overleg met haar te willen voeren over de
      verstrekte informatie, stelt de toegelaten instelling die huurders daartoe in de gelegenheid.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel18
  - number: '18.6'
    text: |-
      De toegelaten instelling geeft ten aanzien van de overige bewoners van haar woongelegenheden toepassing aan het
      tweede en vijfde lid, voor zover de onderwerpen, genoemd in het derde lid, mede op die bewoners betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel18
  - number: '19.1'
    text: |-
      Dit artikel is uitsluitend van toepassing op toegelaten instellingen die honderd of meer woongelegenheden
      verhuren, ten aanzien van welke woongelegenheden een huurdersorganisatie in de zin van de
      [Wet op het overleg huurders verhuurder][ref1] werkzaam is.


      [ref1]: https://wetten.overheid.nl/BWBR0009810
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0009810
  - number: '19.2'
    text: |-
      De toegelaten instelling informeert de huurdersorganisaties in de zin van de
      [Wet op het overleg huurders verhuurder][ref1] over het beleid inzake de leefbaarheid in de buurten en wijken waar
      haar woongelegenheden gelegen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009810
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0009810
  - number: '19.3'
    text: |-
      De toegelaten instelling informeert de huurdersorganisaties in de zin van de
      [Wet op het overleg huurders verhuurder][ref1] over het beleid inzake het bijdragen aan het tot stand brengen van
      huisvesting voor ouderen, gehandicapten en personen die zorg of begeleiding behoeven.


      [ref1]: https://wetten.overheid.nl/BWBR0009810
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0009810
  - number: '19.4'
    text: |-
      De toegelaten instelling informeert de huurdersorganisaties in de zin van de
      [Wet op het overleg huurders verhuurder][ref1] zodanig tijdig over de onderwerpen, genoemd in de
      [artikelen 3, tweede lid][ref2], en [4, eerste lid, van die wet][ref3] en in het tweede en derde lid van dit
      artikel, dat die organisaties in de gelegenheid zijn daarop hun zienswijze te geven op een tijdstip dat die
      zienswijze van invloed kan zijn op vaststelling of wijziging van het beleid van de toegelaten instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0009810
      [ref2]: https://wetten.overheid.nl/BWBR0009810#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0009810#Artikel4
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0009810
      - id: ref2
        bwb_id: BWBR0009810
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0009810
        artikel: '4'
  - number: '19.5'
    text: |-
      De toegelaten instelling informeert de bewoners van haar woongelegenheden over de onderwerpen, genoemd in de
      [artikelen 3, tweede lid][ref1], en [4, eerste lid, van de Wet op het overleg huurders verhuurder][ref2] en in het
      tweede en derde lid van dit artikel, voor zover die onderwerpen mede op hen betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0009810#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009810#Artikel4
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0009810
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0009810
        artikel: '4'
  - number: '19.6'
    text: |-
      De toegelaten instelling informeert de bewoners van woongelegenheden die zij voornemens is te vervreemden of te
      bezwaren zodanig tijdig over haar voornemens daartoe, dat die bewoners in de gelegenheid zijn daarop hun zienswijze
      te geven op een tijdstip dat die zienswijze van invloed kan zijn op wijziging van die voornemens.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel19
  - number: '21.1'
    text: |-
      De toegelaten instelling voert een zodanig financieel beleid en beheer, dat haar voortbestaan in financieel opzicht
      is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel21
  - number: '21.2'
    text: |-
      De toegelaten instelling zet de middelen die zij niet dient aan te houden om te voldoen aan het eerste lid, in ten
      behoeve van de volkshuisvesting.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel21
  - number: '22'
    text: De toegelaten instelling bestemt batige saldi uitsluitend voor werkzaamheden op het gebied van de volkshuisvesting.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel22
  - number: '24'
    text: De toegelaten instelling draagt zorg voor een sobere en doelmatige bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel24
  - number: '25'
    text: |-
      De toegelaten instelling draagt zorg voor een administratie die een juist en volledig inzicht geeft in haar
      werkzaamheden en haar financiële situatie.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel25
  - number: 25a.1
    text: |-
      De toegelaten instelling stelt een overzicht op van voorgenomen activiteiten, waaruit elke gemeente waar zij
      feitelijk werkzaam is kan afleiden welke activiteiten op haar grondgebied zijn voorzien. Dat overzicht is
      van toepassing op het eerstvolgende kalenderjaar en kan van toepassing zijn op een of meer daaropvolgende
      kalenderjaren.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel25a
  - number: 25a.2
    text: |-
      Het overzicht verschaft op hoofdlijnen een toegelicht inzicht in de voornemens van de toegelaten instelling over de
      uitvoering van [de artikelen 12][ref1] tot en met [22][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0005686#Artikel22
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: '12'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005686
        artikel: '22'
        hoofdstuk: III
        paragraaf: '5'
  - number: 25b.1
    text: |-
      De toegelaten instelling stelt voorts jaarlijks een samenvatting op van het in [artikel 25a ][ref1] bedoelde
      overzicht, uit welke samenvatting elke gemeente waar zij feitelijk werkzaam is kan afleiden welke gegevens met name
      op haar betrekking hebben. Die samenvatting is van toepassing op het eerstvolgende kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel25a
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel25b
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: 25a
        hoofdstuk: IIIA
  - number: 25b.2
    text: |-
      De samenvatting wordt opgesteld overeenkomstig [bijlage I][ref1] bij dit besluit, welke bijlage voor 1 juli van een
      jaar met betrekking tot het daaropvolgende jaar bij ministeriële regeling kan worden gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005686
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel25b
    references:
      - id: ref1
        bwb_id: BWBR0005686
  - number: 25c
    text: |-
      De toegelaten instellingen dragen er zorg voor dat de colleges van burgemeester en wethouders van de gemeenten waar
      zij feitelijk werkzaam zijn en, voor zover van toepassing, bovendien die van de gemeenten waar zij hun woonplaats
      hebben, op 1 december van elk jaar beschikken over de in de [artikelen 25a][ref1] en [25b][ref2] bedoelde
      bescheiden die op het op die datum eerstvolgende jaar van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel25a
      [ref2]: https://wetten.overheid.nl/BWBR0005686#Artikel25b
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel25c
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: 25a
        hoofdstuk: IIIA
      - id: ref2
        bwb_id: BWBR0005686
        artikel: 25b
        hoofdstuk: IIIA
  - number: 25d.1
    text: |-
      Het college van burgemeester en wethouders bevestigt binnen vier weken de ontvangst van aan dat college gezonden
      bescheiden als bedoeld in de [artikelen 25a][ref1] en [25b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel25a
      [ref2]: https://wetten.overheid.nl/BWBR0005686#Artikel25b
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel25d
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: 25a
        hoofdstuk: IIIA
      - id: ref2
        bwb_id: BWBR0005686
        artikel: 25b
        hoofdstuk: IIIA
  - number: 25d.2
    text: |-
      Indien op 1 december van enig jaar de in de [artikelen 25a][ref1] en [25b][ref2] bedoelde bescheiden niet in het
      bezit zijn van het college van burgemeester en wethouders, stelt Onze Minister op een daartoe strekkende aanvraag
      van dat college onverwijld een termijn van ten hoogste vier weken binnen welke de ontbrekende bescheiden moeten
      worden verstrekt en doet daarvan mededeling aan de betrokken toegelaten instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel25a
      [ref2]: https://wetten.overheid.nl/BWBR0005686#Artikel25b
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel25d
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: 25a
        hoofdstuk: IIIA
      - id: ref2
        bwb_id: BWBR0005686
        artikel: 25b
        hoofdstuk: IIIA
  - number: 25d.3
    text: |-
      Indien de toegelaten instelling de ontbrekende bescheiden niet binnen de krachtens het tweede lid gestelde termijn
      verstrekt, kan Onze Minister op een daartoe strekkende aanvraag van het college van burgemeester en wethouders
      bepalen dat zij, totdat zij die bescheiden alsnog verstrekt, de door hem aangegeven rechtshandelingen slechts kan
      verrichten na zijn instemming.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel25d
  - number: 25e.1
    text: |-
      De toegelaten instellingen verzoeken jaarlijks, tegelijk met de toezending van de in [artikel 25b][ref1]
      bedoelde samenvatting, om een overleg met de betrokken colleges van burgemeester en wethouders over het
      volkshuisvestingsbeleid in het op de in [artikel 25c][ref2] bedoelde datum eerstvolgende kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel25b
      [ref2]: https://wetten.overheid.nl/BWBR0005686#Artikel25c
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel25e
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: 25b
        hoofdstuk: IIIA
      - id: ref2
        bwb_id: BWBR0005686
        artikel: 25c
        hoofdstuk: IIIA
  - number: 25e.2
    text: |-
      Het eerste lid is niet van toepassing, indien een toegelaten instelling op de in [artikel 25c][ref1] bedoelde
      datum niet beschikt over bescheiden waarin de gemeente op hoofdlijnen een toegelicht inzicht verschaft in haar
      voorgenomen volkshuisvestingsbeleid voor het kalenderjaar, bedoeld in het eerste lid, waarover de gemeente overleg
      heeft gevoerd met de haar omringende gemeenten.


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel25c
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel25e
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: 25c
        hoofdstuk: IIIA
  - number: 25f.1
    text: |-
      De toegelaten instellingen zenden de in [artikel 25][ref1] bedoelde samenvatting voor 1 maart volgend op de in
      [artikel 25c][ref2] bedoelde datum aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel25b
      [ref2]: https://wetten.overheid.nl/BWBR0005686#Artikel25c
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel25f
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: 25b
        hoofdstuk: IIIA
      - id: ref2
        bwb_id: BWBR0005686
        artikel: 25c
        hoofdstuk: IIIA
  - number: 25f.2
    text: |-
      Indien een toegelaten instelling in een overleg als bedoeld in [artikel 25e, eerste lid][ref1], afspraken met een
      of meer colleges van burgemeester en wethouders van de betrokken in [artikel 25c][ref2] bedoelde gemeenten heeft
      gemaakt over haar activiteiten in het betrokken kalenderjaar, vermeldt zij die afspraken, alsmede de wijzigingen in
      haar voorgenomen activiteiten, in de ingevolge het eerste lid aan Onze Minister te zenden samenvatting.


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel25e
      [ref2]: https://wetten.overheid.nl/BWBR0005686#Artikel25c
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel25f
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: 25e
        hoofdstuk: IIIA
      - id: ref2
        bwb_id: BWBR0005686
        artikel: 25c
        hoofdstuk: IIIA
  - number: '26.1'
    text: |-
      De toegelaten instelling stelt jaarlijks een jaarrekening en een jaarverslag op, waarop van overeenkomstige
      toepassing zijn:
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel26
  - number: 26.1.a
    text: |-
      de afdelingen 2 tot en met 8, 11 en 13 van [titel 9 van boek 2 van het Burgerlijk Wetboek][ref1], met dien
      verstande dat voor de toepassing van de artikelen van die afdelingen de leden van het orgaan, bedoeld in
      [artikel 7, eerste lid, onderdeel b][ref2], gelijk staan aan commissarissen als bedoeld in die artikelen, en
      in [artikel 408, eerste lid, onderdeel e][ref3], voor «de in onderdeel d genoemde stukken of vertalingen» wordt
      gelezen «de geconsolideerde jaarrekening en het jaarverslag», alsmede met uitzondering van:


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0005686#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel408
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0003045
      - id: ref2
        bwb_id: BWBR0005686
        artikel: '7'
        hoofdstuk: II
        paragraaf: '2'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '408'
  - number: 26.1.a.1°
    text: de bepalingen die gezien hun inhoud niet op verenigingen of stichtingen van toepassing kunnen zijn, en
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel26
  - number: 26.1.a.2°
    text: |-
      de artikelen[ 361][ref1], tweede lid, eerste volzin, zinsnede «en de in [artikel 360 lid 3][ref2] bedoelde
      stichtingen en verenigingen», [362][ref3], zesde lid, tweede volzin vanaf «handelsregister», zevende lid, eerste
      volzin en tweede volzin vanaf «omschreven», [373][ref4], vijfde lid, [383a][ref5], [389][ref6], vierde en vijfde
      lid, [391][ref7], eerste lid, tweede volzin vanaf« gesteld», [392][ref8], eerste lid, onderdelen a en e, en derde,
      vierde en vijfde lid, [396][ref9], zesde, zevende en achtste lid, [398][ref10], derde en vijfde lid, [406][ref11],
      vierde tot en met zevende lid en [408][ref12], eerste lid, onderdeel d,


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel361
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel360
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel362
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel373
      [ref5]: https://wetten.overheid.nl/BWBR0003045#Artikel383a
      [ref6]: https://wetten.overheid.nl/BWBR0003045#Artikel389
      [ref7]: https://wetten.overheid.nl/BWBR0003045#Artikel391
      [ref8]: https://wetten.overheid.nl/BWBR0003045#Artikel392
      [ref9]: https://wetten.overheid.nl/BWBR0003045#Artikel396
      [ref10]: https://wetten.overheid.nl/BWBR0003045#Artikel398
      [ref11]: https://wetten.overheid.nl/BWBR0003045#Artikel406
      [ref12]: https://wetten.overheid.nl/BWBR0003045#Artikel408
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '361'
      - id: ref2
