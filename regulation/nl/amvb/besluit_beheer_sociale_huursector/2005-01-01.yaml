  - number: '47'
    text: |-
      Voor zover gemeenten bevoegdheden die hen ingevolge dit besluit toekomen hebben overgedragen aan een
      samenwerkingsverband als bedoeld in de Wet gemeenschappelijke regelingen, zijn de bepalingen van dit besluit die op
      die bevoegdheden betrekking hebben van overeenkomstige toepassing op dat samenwerkingsverband.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel47
  - number: '48'
    text: |-
      Onze Minister stelt zo spoedig mogelijk na 1 juli 2001 een verslag op over de wijze waarop dit besluit in de jaren
      1997 tot en met 2000 is toegepast, in welk verslag hij tevens een oordeel geeft over de werking van dit besluit.
      Het verslag wordt in de *Staatscourant* geplaatst.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel48
  - number: '49.1'
    text: |-
      Onze Minister kan van dit besluit afwijken of afwijking daarvan toestaan ten behoeve van experimenten die naar zijn
      oordeel in het belang van de volkshuisvesting zijn.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel49
  - number: '49.2'
    text: |-
      Onze Minister kan besluiten dat een afwijking als bedoeld in het eerste lid van kracht blijft zolang een door hem
      op basis van het experiment noodzakelijk geoordeelde wijziging van dit besluit nog niet van kracht is geworden en
      in werking is getreden.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel49
  - number: '51.1'
    text: |-
      Koninklijke besluiten tot toelating die op voet van het Besluit toegelaten instellingen volkshuisvesting, of van
      een daaraan voorafgaand koninklijk besluit, zijn genomen en waartegen geen beroep meer kan worden ingesteld, staan
      gelijk aan koninklijke besluiten tot toelating op voet van dit besluit.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel51
  - number: '51.2'
    text: |-
      Aanvragen om toelating, bij Onze Minister ingediend voor 1 januari 1993, en beroepen tegen besluiten tot toelating,
      tot weigering van een toelating of tot intrekking van een toelating, ingesteld voor die datum, worden behandeld
      volgens de regels inzake de toelating en intrekking van de toelating die op het tijdstip van die indiening of
      instelling van toepassing waren. Toelatingen op zodanige aanvragen en toelatingen die naar aanleiding van zodanige
      beroepen plaatsvinden of in stand blijven staan gelijk aan toelatingen op voet van dit besluit.
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel51
  - number: '60.1'
    text: |-
      Dit besluit treedt, met uitzondering van afdeling 1 van [hoofdstuk IV][ref1], het opschrift van afdeling 2 van dat
      [hoofdstuk][ref2] en [artikel 46][ref3] in werking met ingang van 1 januari 1993.


      [ref1]: https://wetten.overheid.nl/BWBR0005686#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0005686#HoofdstukIV
      [ref3]: https://wetten.overheid.nl/BWBR0005686#Artikel46
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0005686
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0005686
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0005686
        artikel: '46'
        hoofdstuk: VII
  - number: '60.2'
    text: |-
      Afdeling 1 van [hoofdstuk IV][ref1], het opschrift van afdeling 2 van dat [hoofdstuk][ref2] en [artikel 46][ref3]
      treden in werking op een bij koninklijk besluit te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0005686#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0005686#HoofdstukIV
      [ref3]: https://wetten.overheid.nl/BWBR0005686#Artikel46
