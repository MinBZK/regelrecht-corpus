        artikel: '999'
  - number: '26.2'
    text: |-
      De toegelaten instelling stelt jaarlijks een volkshuisvestingsverslag op, waaruit elke gemeente waar zij feitelijk
      werkzaam is kan afleiden welke gegevens met name op haar betrekking hebben, en dat omvat:
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel26
  - number: 26.2.a
    text: |-
      een uiteenzetting over het in het verslagjaar gevoerde beleid inzake de werkzaamheden, genoemd in
      [artikel 11, tweede lid, onderdelen ][ref1], in welke uiteenzetting zij aannemelijk maakt, dat dit beleid voldoet
      aan [artikel 12][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005686#Artikel12
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: '11'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005686
        artikel: '12'
        hoofdstuk: III
        paragraaf: '2'
  - number: 26.2.b
    text: |-
      een uiteenzetting over het in het verslagjaar gevoerde beleid inzake het leveren van een bijdrage aan de
      leefbaarheid, in welke uiteenzetting zij aannemelijk maakt, dat dit beleid voldoet aan [artikel 12][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel12a
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: 12a
        hoofdstuk: III
        paragraaf: 2a
  - number: 26.2.c
    text: |-
      een uiteenzetting over het in het verslagjaar gevoerde beleid inzake het bijdragen aan het tot stand brengen van
      huisvesting voor ouderen, gehandicapten en personen die zorg of begeleiding behoeven, in welke uiteenzetting zij
      aannemelijk maakt, dat dit beleid voldoet aan [artikel 12b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel12b
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: 12b
        hoofdstuk: III
        paragraaf: 2b
  - number: 26.2.d
    text: |-
      een uiteenzetting over het in het verslagjaar gevoerde beleid inzake het toewijzen, verhuren en vervreemden
      van haar woongelegenheden, in welke uiteenzetting zij aannemelijk maakt, dat dit beleid voldoet aan
      [artikel 70c, eerste lid, van de Woningwet][ref1], en aan [de artikelen 13][ref2], [14][ref3], [15][ref4] en
      [15a][ref5];


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel70c
      [ref2]: https://wetten.overheid.nl/BWBR0005686#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0005686#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0005686#Artikel15
      [ref5]: https://wetten.overheid.nl/BWBR0005686#Artikel15a
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: 70c
      - id: ref2
        bwb_id: BWBR0005686
        artikel: '13'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0005686
        artikel: '14'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0005686
        artikel: '15'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0005686
        artikel: 15a
        hoofdstuk: III
        paragraaf: '3'
  - number: 26.2.e
    text: |-
      een uiteenzetting over de wijze waarop zij in het verslagjaar de bewoners van haar woongelegenheden bij haar beleid
      en beheer heeft betrokken, in welke uiteenzetting zij:
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel26
  - number: 26.2.e.1°
    text: |-
      indien zij op 1 januari van het verslagjaar een toegelaten instelling is als bedoeld in
      [artikel 18, eerste lid][ref1]: aannemelijk maakt, dat deze voldoet aan [de artikelen 16][ref2], [17][ref3],
      [17a][ref4] en [18, tweede tot en met zesde lid][ref5], of


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0005686#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0005686#Artikel17
