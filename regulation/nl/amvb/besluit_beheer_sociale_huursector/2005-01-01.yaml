        artikel: '408'
  - number: 26.1.b
    text: |-
      de elfde titel van het derde boek van het Wetboek van Burgerlijke Rechtsvordering, met dien verstande dat
      [artikel 999, eerste volzin][ref1], niet van toepassing is op de verklaring en de mededelingen, bedoeld in
      [artikel 29, eerste lid][ref2], en met uitzondering van [artikel 999, tweede volzin][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel999
      [ref2]: https://wetten.overheid.nl/BWBR0005686#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel999
    url: https://wetten.overheid.nl/BWBR0005686/2005-01-01#Artikel26
