  - number: 2a
    text: |-
      Voor de toepassing van dit besluit verbindt een toegelaten instelling zich met een andere rechtspersoon of
      vennootschap, indien:

      a. die andere rechtspersoon of vennootschap een dochtermaatschappij als bedoeld in
      [artikel 24a van Boek 2 van het Burgerlijk Wetboek][ref1] van haar wordt;

      b. zij in die andere rechtspersoon deelneemt in de zin van [artikel 24c van Boek 2 van het Burgerlijk Wetboek][ref2]
      of;

      c. zij anderszins financiële of bestuurlijke banden met een bestaande andere rechtspersoon of vennootschap
      aangaat, stemrechten in de algemene vergadering van een bestaande andere rechtspersoon verwerft of een andere
      rechtspersoon of vennootschap opricht of doet oprichten, op een zodanige wijze dat daardoor een duurzame band met
      die rechtspersoon of vennootschap ontstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24a
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel24c
