  - number: 11f
    text: |-
      De toegelaten instelling neemt bij haar werkzaamheden het in de betrokken gemeenten geldende
      volkshuisvestingsbeleid in acht.
    url: https://wetten.overheid.nl/BWBR0005686/2013-08-01#Artikel11f
  - number: 11g
    text: |-
      De toegelaten instelling stelt na overleg met de huurders van haar woongelegenheden of hun vertegenwoordigers
      een reglement vast met betrekking tot de bijdragen, bedoeld in de [artikelen 220, vijfde lid][ref1], en
      [275, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref2], waarin in elk geval de hoogte van die bijdragen
      is vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel220
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel275
