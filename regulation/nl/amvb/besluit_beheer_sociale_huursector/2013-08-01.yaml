  - number: '7'
    text: |-
      1 Buiten het geval, bedoeld in [artikel 70, tweede lid, tweede volzin, van de Woningwet][ref1] wordt de toelating
      geweigerd, indien de statuten van de vereniging of de stichting niet voorzien in:

      a. de vermelding van de gemeente of een aanduiding van de gemeenten waar zij werkzaam is;

      b. de instelling van een orgaan waaraan het toezicht op het bestuur is opgedragen, welk orgaan:

      1°. in staat is dat toezicht voortdurend uit te oefenen;

      2°. bevoegd is tot het nemen van maatregelen die voor uitoefening van dat toezicht nodig zijn, en daartoe de
      uitvoering van besluiten van het bestuur kan schorsen, en

      3°. niet is gehouden over zijn handelingen verantwoording aan het bestuur af te leggen;

      c. de bepaling dat met personen die zitting hebben in het orgaan, bedoeld in onderdeel *b* , geen
      arbeidsovereenkomsten als bedoeld in [artikel 610, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref2]
      bestaan;

      d. de bepaling dat het zitting hebben in het bestuur of in het orgaan, bedoeld in onderdeel b, onverenigbaar is met
      het lidmaatschap van het college van burgemeester en wethouders van de gemeente of van het college van gedeputeerde
      staten van de provincie waar de vereniging of de stichting haar woonplaats heeft, of van een gemeente of een
      provincie waar zij feitelijk werkzaam is, of van een orgaan van een organisatie die zich ten doel heeft gesteld de
      belangen van gemeenten of provincies te behartigen;

      e. regels inzake de wijze waarop de huurders van de woongelegenheden van de vereniging of de stichting en in het
      belang van die huurders werkzame organisaties invloed kunnen uitoefenen op de samenstelling van het bestuur van
      die vereniging of stichting of van het orgaan, bedoeld in onderdeel *b* , welke regels in elk geval inhouden,
      dat het bestuur die huurders en zodanige organisaties in de gelegenheid stelt om, ten aanzien van ten minste twee
      vrijkomende plaatsen in het bestuur of orgaan, een bindende voordracht uit te brengen voor benoeming in dat bestuur
      of orgaan van een persoon uit hun kring, waarbij, in geval van een vereniging, wordt bepaald op welke wijze de
      betrokken benoeming tot stand komt ingeval aan de voordracht het bindende karakter is ontnomen;

      f. de bepaling dat de algemene vergadering van een vereniging slechts een besluit kan nemen om aan een voordracht
      als bedoeld in onderdeel *e* het bindende karakter te ontnemen, indien op die vergadering een aantal stemmen kan
      worden uitgebracht dat ten minste de helft bedraagt van het aantal stemmen dat door de stemgerechtigden gezamenlijk
      kan worden uitgebracht;

      g. de bepaling dat het orgaan, bedoeld in onderdeel *b* , de opdracht verleent tot het onderzoek, bedoeld in
      [artikel 27, eerste lid, eerste volzin][ref3], en dat, indien het orgaan niet daartoe overgaat, dit geschiedt door
      de algemene vergadering of, indien deze niet daartoe overgaat, het bestuur van de vereniging, dan wel door het
      bestuur van de stichting;

      h. de bepaling dat de opdracht, bedoeld in onderdeel *g* , kan worden ingetrokken door het orgaan dat deze heeft
      verleend, en dat een zodanige door het bestuur verleende opdracht tevens kan worden ingetrokken door het orgaan,
      bedoeld in onderdeel *b* ;

      i. de bepaling dat de vereniging of de stichting voor wijziging van de statuten de voorafgaande instemming van Onze
      Minister behoeft, en daartoe iedere voorgenomen wijziging daarvan aan hem voorlegt, en

      j. bepalingen omtrent de ontbinding van de vereniging of de stichting, welke inhouden, dat:

      1°. het bestuur de ontbinding onverwijld aan Onze Minister meedeelt;

      2°. na ontbinding de vereffening geschiedt door een of meer vereffenaars, te benoemen door het college van
      burgemeester en wethouders van de gemeente waar de ontbonden vereniging of stichting haar woonplaats had, op
      welke vereffenaars dat college toezicht houdt en welke vereffenaars door dat college kunnen worden geschorst of
      ontslagen, in welk laatste geval het een of meer nieuwe vereffenaars benoemt;

      3°. indien de onroerende zaken gelegen zijn binnen het werkgebied van een of meer toegelaten instellingen, de
      vereffenaar de goederen en de schulden van de ontbonden vereniging of stichting bij voorrang aan die toegelaten
      instellingen aanbiedt ter gehele of gedeeltelijke overneming, en, voor zover die toegelaten instellingen die
      goederen of schulden niet overnemen, hij die goederen of schulden ter gehele of gedeeltelijke overneming aanbiedt
      aan de gemeente waar de onroerende zaken gelegen zijn, en, voor zover de gemeente die goederen of schulden niet
      overneemt, hij de huurders van de tot die zaken behorende woongelegenheden in de gelegenheid stelt deze in eigendom
      te verkrijgen;

      4°. indien de ontbonden vereniging of stichting op het tijdstip van ontbinding geen onroerende zaken bezat, de
      vereffenaar de goederen en de schulden van die vereniging of stichting ter overneming aanbiedt aan de gemeente waar
      die vereniging of stichting haar woonplaats had;

      5°. voor zover wegens het niet aanvaarden van de aanbiedingen, bedoeld onder 3° en 4°, de goederen en de schulden
      niet zijn overgenomen, de vereffenaar de goederen van de ontbonden vereniging of stichting te gelde maakt en haar
      schulden voldoet en

      6°. de vereffenaar de middelen die zijn overgebleven na het overeenkomstig onderdeel 3°, 4° of 5° te gelde maken
      van de goederen van de ontbonden vereniging of stichting, en na het voldoen van haar schulden, stort in het
      Centraal Fonds voor de Volkshuisvesting.

      2 De toelating wordt voorts geweigerd, indien de statuten een bepaling bevatten waaraan:

      a. personen waarop het eerste lid, onderdeel d, van toepassing is het recht kunnen ontlenen om personen te benoemen
      in het bestuur van de vereniging of de stichting, of in het orgaan, bedoeld in het eerste lid, onderdeel b, of om
      personen voor een zodanige benoeming voor te dragen, of

      b. het recht kan worden ontleend tot het verkrijgen van de eigendom van onroerende zaken van de vereniging of de
      stichting op een andere wijze dan die, bedoeld in het eerste lid, onderdeel *j*, onder 3° en 4°.

      3 Het eerste lid, onderdeel d, en het tweede lid, onderdeel a, zijn, voorzover het betreft het lidmaatschap
      van het college van burgemeester en wethouders van de gemeente of van het college van gedeputeerde staten
      van de provincie waar de vereniging of de stichting haar woonplaats heeft, of van een gemeente of een
      provincie waar zij feitelijk werkzaam is, niet van toepassing op een vereniging of stichting als bedoeld in
      [artikel 4, derde lid, eerste volzin][ref4], indien door die vereniging of stichting op of na 1 januari 1993 en
      voor 1 mei 1996 een aanvraag om toelating bij Onze Minister is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel610
      [ref3]: https://wetten.overheid.nl/BWBR0005686#Artikel27
      [ref4]: https://wetten.overheid.nl/BWBR0005686#Artikel4
