  - number: '15'
    text: |-
      De toegelaten instelling stelt criteria op aan de hand waarvan zij, onverminderd [artikel 13][ref1], beoordeelt of
      en in welke mate zij haar woongelegenheden vervreemdt. Zij schenkt daarbij afzonderlijk aandacht aan vervreemding
      aan huurders van die woongelegenheden.


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel13
    url: https://wetten.overheid.nl/BWBR0005686/2013-08-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: '13'
        hoofdstuk: III
        paragraaf: '3'
  - number: 15a
    text: |-
      1 De gemiddelde huurprijs van de woningen van de toegelaten instelling op 1 juli
      van enig jaar is niet hoger dan de gemiddelde huurprijs van die woningen op 30 juni
      daaraan voorafgaand, vermeerderd met het basishuurverhogingspercentage, bedoeld in
      [artikel 1, eerste lid, onderdeel a, van de Uitvoeringswet huurprijzen woonruimte][ref1].

      2 Bij de berekening van de gemiddelde huurprijs, bedoeld in het eerste lid, wordt geen rekening gehouden met
      woningen:

      a. waarvoor een huurovereenkomst als bedoeld in [artikel 247 van Boek 7 van het Burgerlijk Wetboek][ref2] geldt;

      b. die per 1 juli van het betrokken jaar voor het eerst of aan een opvolgende huurder zijn verhuurd;

      c. waarvan de huurprijs met ingang van 1 juli van het betrokken jaar is verhoogd naar aanleiding van een voorstel
      daartoe als bedoeld in [artikel 252a, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref3], of als gevolg
      van een woningverbetering als bedoeld in [artikel 255 van dat boek][ref4], of is verlaagd naar aanleiding van een
      voorstel daartoe als bedoeld in [artikel 252b, eerste lid, van dat boek][ref5], of

      d. die een onzelfstandige woonruimte vormen.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel247
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel252a
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel255
      [ref5]: https://wetten.overheid.nl/BWBR0005290#Artikel252b
