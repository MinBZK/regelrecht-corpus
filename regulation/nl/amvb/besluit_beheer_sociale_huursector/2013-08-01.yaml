      - id: ref2
        bwb_id: BWBR0005686
        artikel: 12a
        hoofdstuk: III
        paragraaf: 2a
  - number: '13'
    text: |-
      1 Onverminderd [artikel 70c, eerste lid, van de Woningwet][ref1] geeft de toegelaten instelling bij het verhuren
      van woningen met een rekenhuur als bedoeld in [artikel 5, eerste lid, van de Wet op de huurtoeslag][ref2],
      die gelijk is aan of lager is dan de aftoppingsgrens, bedoeld in [artikel 20, tweede lid, van die wet][ref3],
      zo veel mogelijk voorrang aan woningzoekenden die een zodanig de gezamenlijke toetsingsinkomens, bedoeld in
      [artikel 8 van de Algemene wet inkomensafhankelijke regelingen][ref4], die in aanmerking worden genomen voor het
      bepalen van de draagkracht, bedoeld in [artikel 7 van die wet][ref5] genieten, dat zij een beroep kunnen doen op
      een huurtoeslag in de zin van [artikel 1, onderdeel e, van de Wet op de huurtoeslag][ref6].

      2 De toegelaten instelling bouwt of verwerft woningen op een zodanige wijze, dat aan woningzoekenden als bedoeld in
      het eerste lid zo veel mogelijk een woning als bedoeld in dat lid kan worden verhuurd.

      3 De toegelaten instelling kan, onverminderd het tweede lid, het meest recente inkomen van de woningzoekende, en
      de actuele vraag naar en het actuele aanbod ter plaatse van woongelegenheden, betrekken bij het verhuren van haar
      woningen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel70c
