  - number: '10'
    text: |-
      1 Indien de voorgenomen wijziging van de statuten van de toegelaten instelling geen gevolgen heeft voor haar
      financiële situatie en voorts hetzij geen betrekking heeft op haar werkgebied, hetzij geen aanleiding heeft
      gegeven tot toepassing van [artikel 9, derde lid][ref1], neemt Onze Minister binnen acht weken na ontvangst van die
      wijziging een beslissing omtrent instemming daarmee.

      2 Indien de voorgenomen wijziging van de statuten van de toegelaten instelling gevolgen heeft voor haar
      financiële situatie, neemt Onze Minister binnen acht weken na ontvangst van de zienswijze, bedoeld in
      [artikel 9, tweede lid][ref2], een beslissing omtrent instemming met die wijziging. Hij betrekt die zienswijze bij
      zijn beslissing. Indien het Centraal Fonds voor de Volkshuisvesting zijn zienswijze niet of niet tijdig aan Onze
      Minister heeft doen toekomen, neemt hij een beslissing als bedoeld in de eerste volzin binnen acht weken na het
      verstrijken van de termijn, bedoeld in [artikel 9, tweede lid, tweede volzin][ref3].

      3 Indien de voorgenomen wijziging van de statuten van de toegelaten instelling betrekking heeft op haar werkgebied
      en aanleiding heeft gegeven tot toepassing van [artikel 9, derde lid][ref4], neemt Onze Minister binnen acht
      weken na ontvangst van de zienswijzen, bedoeld in dat lid, een beslissing omtrent instemming met die wijziging.
      Hij betrekt die zienswijzen bij zijn beslissing. Indien een gemeente haar zienswijze niet of niet tijdig aan Onze
      Minister heeft doen toekomen, neemt hij een beslissing als bedoeld in de eerste volzin binnen acht weken na het
      verstrijken van de termijn, bedoeld in [artikel 9, derde lid, tweede volzin][ref5].


