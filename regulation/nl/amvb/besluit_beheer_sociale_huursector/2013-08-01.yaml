  - number: '12'
    text: |-
      De toegelaten instelling zet de middelen voor het verrichten van de werkzaamheden, genoemd in
      [artikel 11, tweede lid, onderdelen a, b en c][ref1], zodanig in, dat zo veel mogelijk wordt voldaan aan de eisen
      die ter plaatse in het belang van de huisvesting van de bevolking redelijkerwijs kunnen worden gesteld aan de
      kwaliteit van woongelegenheden.


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel11
    url: https://wetten.overheid.nl/BWBR0005686/2013-08-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: '11'
        hoofdstuk: III
        paragraaf: '1'
  - number: 12a
    text: |-
      1 De toegelaten instelling draagt bij aan de leefbaarheid in de buurten en wijken waar haar woongelegenheden
      gelegen zijn.

      2 Ter uitvoering van het eerste lid kan de toegelaten instelling, naast de werkzaamheden, genoemd in de
      [artikelen 11, tweede lid][ref1], en [12b, tweede lid][ref2], uitsluitend overgaan tot:

      a. het bouwen, verwerven, bezwaren en slopen van andere gebouwen dan woongelegenheden;

      b. het in stand houden van en het treffen van voorzieningen aan andere gebouwen dan woongelegenheden;

      c. het in stand houden en verbeteren van de omgeving buiten de directe nabijheid van woongelegenheden;

      d. het verhuren van andere gebouwen dan woongelegenheden;

      e. het vervreemden van andere gebouwen dan woongelegenheden;

      f. het verrichten van andere werkzaamheden die ten goede komen aan het woongenot in een buurt of wijk en

      g. de werkzaamheden die noodzakelijkerwijs voortvloeien uit het verrichten van de werkzaamheden, genoemd in de
      onderdelen *a* tot en met *f* .

      3 De toegelaten instelling verricht werkzaamheden als bedoeld in de onderdelen *a* tot en met *g* van het tweede
      lid slechts, indien zij zich daarbij de uitvoering van het eerste lid als enige of voornaamste doel stelt.


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005686#Artikel12b
    url: https://wetten.overheid.nl/BWBR0005686/2013-08-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: '11'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005686
        artikel: 12b
        hoofdstuk: III
        paragraaf: 2b
  - number: 12b
    text: |-
      1 De toegelaten instelling draagt bij aan het volgens redelijke wensen tot stand brengen van huisvesting voor
      ouderen, gehandicapten en personen die zorg of begeleiding behoeven.

      2 Ter uitvoering van het eerste lid kan de toegelaten instelling, naast de werkzaamheden, genoemd in de
      [artikelen 11, tweede lid][ref1], en [12a, tweede lid][ref2], uitsluitend overgaan tot:

      a. het bouwen en exploiteren van woon-zorgcomplexen en de daarbij behorende gemeenschappelijke ruimten en fysieke
      zorginfrastructuur, van projecten voor begeleid wonen, en van vastgoed met een woon- of verblijffunctie voor de
      bewoners van instellingen in de verzorging, verpleging of opvang;

      b. het leveren van een bijdrage aan de totstandkoming van arrangementen met betrekking tot wonen, zorg- en
      dienstverlening, die, zoveel mogelijk naar wens van de in het eerste lid bedoelde personen, het zelfstandig wonen
      bevorderen;

      c. het vervullen van een bemiddelende rol voor bewoners met betrekking tot zorg- en dienstverlening of

      d. de werkzaamheden die noodzakelijkerwijs voortvloeien uit het verrichten van de werkzaamheden, genoemd in de
      onderdelen a tot en met c.


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005686#Artikel12a
    url: https://wetten.overheid.nl/BWBR0005686/2013-08-01#Artikel12b
