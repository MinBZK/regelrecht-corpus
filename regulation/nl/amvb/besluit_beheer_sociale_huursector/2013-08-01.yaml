  - number: '4'
    text: |-
      1 Een aanvraag om een toelating als bedoeld in [artikel 70, eerste lid, van de Woningwet][ref1] wordt door de
      vereniging of de stichting aan de Kroon gericht en bij Onze Minister ingediend.

      2 De aanvraag omvat:

      a. de gronden waarop deze rust;

      b. een authentiek afschrift van de akte van oprichting van de vereniging of de stichting of van de notariële
      akte waarin de statuten van de vereniging na haar oprichting zijn opgenomen, en van de notariële akten waarin
      statutenwijzigingen zijn opgenomen;

      c. het bewijs, dat de vereniging of de stichting is ingeschreven in een openbaar register, gehouden door de Kamer
      van Koophandel en Fabrieken binnen welker gebied zij haar woonplaats heeft;

      d. het bewijs, dat een authentiek afschrift van de akte van oprichting of van de notariële akte waarin de statuten
      zijn opgenomen, dan wel een authentiek uittreksel van die akte, authentieke afschriften van de notariële akten
      waarin statutenwijzigingen zijn opgenomen en de statuten als laatstelijk gewijzigd ten kantore van die Kamer zijn
      neergelegd, en

      e. zodanige bescheiden, dat Onze Minister een juist en volledig inzicht verkrijgt in de financiële situatie van de
      vereniging of de stichting.

      3 Indien de oprichting van de vereniging of de stichting, al dan niet gezamenlijk met de oprichting van een
      of meer andere verenigingen of stichtingen, is geschied met het oogmerk om de werkzaamheden te gaan verrichten
      die ter plaatse worden verricht door een afzonderlijk organisatie-onderdeel van de gemeente dat is belast met
      de exploitatie van van gemeentewege gebouwde of verworven woongelegenheden en om daartoe die woongelegenheden
      in eigendom te verkrijgen, omvat de aanvraag voorts een rapport van bevindingen omtrent de financiële
      transacties tussen dat organisatie-onderdeel enerzijds en de algemene dienst en andere organisatie-onderdelen
      van de gemeente anderzijds, uitgebracht door een als openbaar accountant optredende accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2] of door een organisatie waarin zodanige
      accountants samenwerken. Het rapport omvat alle zodanige transacties over het tijdvak dat loopt vanaf 1 januari
      1991 tot een dag die ten hoogste een maand ligt voor het tijdstip waarop de aanvraag wordt ingediend, die naar
      het oordeel van de accountant mogelijk niet in het belang van de volkshuisvesting zijn verricht, en die over het
      genoemde tijdvak afzonderlijk of gezamenlijk meer dan 1 procent van de financiële middelen van het in de eerste
      volzin eerstgenoemde organisatie-onderdeel per 31 december 1990, en afzonderlijk of gezamenlijk ten minste € 25 000
      bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel393
