  - number: '28'
    text: |-
      De toegelaten instelling laat de ingevolge [artikel 27][ref1] aangewezen accountant of organisatie onderzoeken, of:

      a.

      b. het jaarverslag, bedoeld in [artikel 26, eerste lid][ref2], en het volkshuisvestingsverslag, bedoeld in
      [artikel 26, tweede lid][ref3], voor zover deze dat kan beoordelen, overeenkomstig die leden zijn opgesteld en met
      de jaarrekening verenigbaar zijn, en

      c. het overzicht, bedoeld in [artikel 26, derde lid][ref4], in overeenstemming is met de vastgestelde jaarrekening.


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0005686#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0005686#Artikel26
