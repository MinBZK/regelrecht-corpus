  - number: 25c
    text: |-
      De toegelaten instellingen dragen er zorg voor dat de colleges van burgemeester en wethouders van de gemeenten waar
      zij feitelijk werkzaam zijn en, voor zover van toepassing, bovendien die van de gemeenten waar zij hun woonplaats
      hebben, op 1 november van elk jaar beschikken over de in de [artikelen 25a][ref1] en [25b][ref2] bedoelde
      bescheiden die op het op die datum eerstvolgende jaar van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel25a
      [ref2]: https://wetten.overheid.nl/BWBR0005686#Artikel25b
    url: https://wetten.overheid.nl/BWBR0005686/2013-08-01#Artikel25c
