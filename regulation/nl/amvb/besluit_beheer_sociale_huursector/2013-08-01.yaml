  - number: '29'
    text: |-
      1 De toegelaten instelling verzoekt aan een daartoe als openbaar accountant optredende accountant als bedoeld in
      [artikel 27, eerste lid][ref1], of aan een organisatie waarin zodanige accountants samenwerken, om op te stellen:

      a. een verklaring omtrent de getrouwheid van de jaarrekening, bedoeld in [artikel 26, eerste lid][ref2];

      b. een mededeling omtrent het volkshuisvestingsverslag, bedoeld in [artikel 26, tweede lid][ref3];

      c. een mededeling omtrent het overzicht, bedoeld in [artikel 26, derde lid][ref4], en

      d. een accountantsverslag als bedoeld in het
      [vierde lid van artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref5].

      2 De jaarrekening wordt niet vastgesteld of goedgekeurd, indien de toegelaten instelling geen kennis heeft kunnen
      nemen van de verklaring, bedoeld in het eerste lid, onderdeel *a*, die aan de jaarrekening moest zijn toegevoegd,
      tenzij onder de overige gegevens een wettige grond wordt meegedeeld waarom die verklaring ontbreekt.

      3 De in het eerste lid, onderdelen a, b en c, genoemde stukken worden opgesteld overeenkomstig [bijlage III][ref6]
      bij dit besluit, welke bijlage bij ministeriële regeling kan worden gewijzigd.


