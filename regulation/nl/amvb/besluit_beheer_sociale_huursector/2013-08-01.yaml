  - number: '6'
    text: |-
      1 Onze Minister doet binnen acht weken na ontvangst van de zienswijzen, bedoeld in [artikel 5][ref1], een
      voordracht voor een koninklijk besluit tot toelating of tot weigering van de toelating. Hij betrekt die zienswijzen
      bij zijn voordracht.

      2 Indien een gemeente haar zienswijze of het Centraal Fonds voor de Volkshuisvesting zijn zienswijze
      niet of niet tijdig aan Onze Minister heeft doen toekomen, doet Onze Minister een voordracht
      als bedoeld in het eerste lid binnen acht weken na het verstrijken van de termijnen, bedoeld in
      [artikel 5, eerste lid, tweede volzin, en tweede lid, tweede volzin][ref2].

      3 Het koninklijk besluit wordt in de Staatscourant geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005686#Artikel5
