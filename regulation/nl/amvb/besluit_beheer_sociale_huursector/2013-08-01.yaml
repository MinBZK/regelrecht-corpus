  - number: '9'
    text: |-
      1 Onze Minister stemt slechts in met een voorgenomen wijziging van de statuten van de toegelaten instelling,
      indien die wijziging voldoet aan [artikel 7][ref1], er niet toe leidt dat de toegelaten instelling niet voldoet
      aan [artikel 8, eerste lid][ref2], en ook overigens naar zijn oordeel het belang van de volkshuisvesting zich niet
      daartegen verzet.

      2 Indien de voorgenomen wijziging van de statuten van de toegelaten instelling gevolgen heeft voor haar financiële
      situatie, stelt Onze Minister binnen acht weken na ontvangst van die wijziging het Centraal Fonds voor de
      Volkshuisvesting in de gelegenheid zijn zienswijze over de financiële aspecten van die wijziging aan hem kenbaar te
      maken. Het fonds kan binnen vier weken nadien zijn zienswijze aan Onze Minister doen toekomen.

      3 Indien de voorgenomen wijziging van de statuten van de toegelaten instelling betrekking heeft op haar werkgebied,
      kan Onze Minister, binnen acht weken na ontvangst van die wijziging, de gemeenten waar zij na die wijziging
      naar verwachting feitelijk werkzaam zal zijn in de gelegenheid stellen hun zienswijzen over de gevolgen van die
      wijziging voor de volkshuisvesting ter plaatse aan hem kenbaar te maken. Die gemeenten kunnen binnen vier weken
      nadien hun zienswijzen aan Onze Minister doen toekomen.

      4 Onze Minister kan instemmen met een voorgenomen wijziging van statuten van een toegelaten instelling zonder
      toepassing van een of meer van de ingevolge het eerste lid aan die instemming verbonden vereisten, indien die
      wijziging uitsluitend een uitbreiding van haar werkgebied inhoudt.


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005686#Artikel8
