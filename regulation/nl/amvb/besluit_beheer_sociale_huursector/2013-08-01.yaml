  - number: '11'
    text: |-
      1 De toegelaten instelling is uitsluitend werkzaam op het gebied van de volkshuisvesting. Zij neemt bij haar
      werkzaamheden het bepaalde in de paragrafen 2 tot en met 6 in acht.

      2 Het gebied van de volkshuisvesting omvat, behoudens de [artikelen 12a, tweede lid][ref1], en
      [12b, tweede lid][ref2], uitsluitend:

      a. het bouwen, verwerven, bezwaren en slopen van woongelegenheden en onroerende aanhorigheden;

      b. het in stand houden van en het treffen van voorzieningen aan haar woongelegenheden en onroerende aanhorigheden,
      en aan woongelegenheden en onroerende aanhorigheden van derden;

      c. het in stand houden en verbeteren van de direct aan de woongelegenheden en aanhorigheden, bedoeld in onderdeel
      *b* , grenzende omgeving;

      d. het beheren, toewijzen en verhuren van woongelegenheden en onroerende aanhorigheden;

      e. het vervreemden van woongelegenheden en onroerende aanhorigheden;

      f. het aan bewoners van bij de toegelaten instelling in beheer zijnde woongelegenheden verlenen van diensten
      die rechtstreeks verband houden met de bewoning, alsmede het, aan personen die te kennen geven een zodanige
      woongelegenheid te willen betrekken, verlenen van diensten die rechtstreeks verband houden met het huisvesten van
      die personen, en

      g. de werkzaamheden die noodzakelijkerwijs voortvloeien uit het verrichten van de werkzaamheden, genoemd in de
      onderdelen *a* tot en met *f* .


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0005686#Artikel12b
