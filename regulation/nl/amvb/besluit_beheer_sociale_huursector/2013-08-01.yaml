  - number: '8'
    text: |-
      1 De toelating wordt bovendien geweigerd, indien naar het oordeel van Onze Minister de vereniging of de stichting
      niet voldoende financieel draagkrachtig is of de financiële continuïteit van die vereniging of stichting niet
      voldoende is gewaarborgd.

      2 De toelating van een vereniging of stichting als bedoeld in [artikel 4, derde lid, eerste volzin][ref1], wordt
      bovendien geweigerd, indien het rapport van bevindingen, bedoeld in die volzin, daar naar het oordeel van Onze
      Minister aanleiding toe geeft, of indien transacties als bedoeld in die volzin die hebben plaatsgevonden op of na
      de dag waarop dat rapport is uitgebracht daar naar zijn oordeel aanleiding toe geven.

      3 De toelating kan voorts worden geweigerd op grond van gebreken in de akte van oprichting.


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel4
