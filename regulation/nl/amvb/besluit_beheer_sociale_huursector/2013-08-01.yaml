  - number: '31'
    text: |-
      1 Onze Minister, de betrokken colleges van burgemeester en wethouders en het bestuur van het Centraal Fonds voor de
      Volkshuisvesting bevestigen binnen vier weken de ontvangst van de krachtens de [artikelen 25f, eerste lid][ref1],
      en [30][ref2] aan hen gezonden bescheiden.

      2 Indien een toegelaten instelling een of meer van de bescheiden 1 februari respectievelijk op 1 juli van een jaar
      niet aan Onze Minister, een betrokken college van burgemeester en wethouders of het bestuur van het Centraal Fonds
      voor de Volkshuisvesting heeft doen toekomen, stelt Onze Minister, eigener beweging of op een daartoe strekkende
      aanvraag van dat college, of stelt dat bestuur onverwijld een termijn van ten hoogste vier weken binnen welke de
      ontbrekende bescheiden alsnog moeten worden verstrekt en doet daarvan mededeling aan die toegelaten instelling.

      3 Indien de toegelaten instelling de ontbrekende bescheiden niet binnen de krachtens het tweede lid gestelde
      termijn verstrekt, kan Onze Minister, eigener beweging of op een daartoe strekkende aanvraag van het college van
      burgemeester en wethouders, en kan het bestuur van het Centraal Fonds voor de Volkshuisvesting bepalen, dat zij,
      totdat zij die bescheiden alsnog verstrekt, de door hem aangegeven rechtshandelingen slechts kan verrichten na zijn
      instemming of de instemming van dat bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel25f
      [ref2]: https://wetten.overheid.nl/BWBR0005686#Artikel30
    url: https://wetten.overheid.nl/BWBR0005686/2013-08-01#Artikel31
