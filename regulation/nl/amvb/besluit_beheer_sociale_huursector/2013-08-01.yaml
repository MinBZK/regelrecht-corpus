  - number: 11a
    text: |-
      1 De werkzaamheden van de toegelaten instelling dragen bij aan de uitvoering van de
      [artikelen 12 tot en met 22][ref1] overeenkomstig dit besluit.

      2 De toegelaten instelling verbindt zich slechts met een andere rechtspersoon of vennootschap, indien dit
      noodzakelijk is om te voldoen aan het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel12
    url: https://wetten.overheid.nl/BWBR0005686/2013-08-01#Artikel11a
