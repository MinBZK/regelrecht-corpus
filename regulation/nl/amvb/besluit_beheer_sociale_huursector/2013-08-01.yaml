  - number: '27'
    text: |-
      1 De toegelaten instelling verleent opdracht tot onderzoek van de stukken, genoemd in [artikel 26][ref1], aan
      een accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2] of aan een
      organisatie waarin zodanige accountants samenwerken. De aanwijzing van de accountant die het in de eerste volzin
      bedoelde onderzoek verricht wordt niet door enige voordracht beperkt.

      2 De toegelaten instelling verzoekt aan de betrokken accountant of organisatie omtrent het onderzoek verslag aan
      haar uit te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel393
