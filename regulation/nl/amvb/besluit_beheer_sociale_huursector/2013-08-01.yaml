  - number: '26'
    text: |-
      1 De toegelaten instelling stelt jaarlijks een jaarrekening en een jaarverslag op,
      waarop de [afdelingen 2 tot en met 8][ref1], [10][ref2], [11][ref3], [13][ref4], en
      [16 van titel 9 van Boek 2 van het Burgerlijk Wetboek][ref5] van overeenkomstige toepassing zijn, met dien
      verstande dat voor de toepassing van de artikelen van die afdelingen de leden van het orgaan, bedoeld in
      [artikel 7, eerste lid, onderdeel b][ref6], gelijk staan aan commissarissen als bedoeld in die artikelen, en
      in [artikel 408, eerste lid, onderdeel e][ref7], voor «de in onderdeel d genoemde stukken of vertalingen» wordt
      gelezen «de geconsolideerde jaarrekening en het jaarverslag», alsmede met uitzondering van:

      a. de bepalingen die gezien hun inhoud niet op verenigingen of stichtingen van toepassing kunnen zijn, en

      b. de [artikelen 361, tweede lid, eerste volzin][ref8], zinsnede «en de in [artikel 360 lid 3][ref9]
      bedoelde stichtingen en verenigingen», [362, zesde lid, tweede volzin][ref10] vanaf
      «handelsregister», zevende lid, eerste volzin en tweede volzin vanaf «omschreven», achtste en
      negende lid, [373, vijfde lid][ref11], [378, tweede tot en met vierde lid][ref12], [383a][ref13],
      [389, vierde en vijfde lid][ref14], [390][ref15], [391, eerste lid, vijfde volzin][ref16]
      vanaf «gesteld», [392, eerste lid, onderdelen a en e, en derde, vierde en vijfde lid][ref17],
      [396, zesde tot en met negende lid][ref18], [398, derde en vijfde lid][ref19],
      [406, derde tot en met vijfde lid][ref20], en [408, eerste lid, onderdeel d][ref21].

      2 De toegelaten instelling stelt jaarlijks een volkshuisvestingsverslag op, waaruit elke gemeente waar zij
      feitelijk werkzaam is kan afleiden welke gegevens met name op haar betrekking hebben, en dat omvat:

      a. een uiteenzetting over het in het verslagjaar gevoerde beleid inzake de werkzaamheden, genoemd in
      [artikel 11, tweede lid, onderdelen a, b en c][ref22], in welke uiteenzetting zij aannemelijk maakt, dat dit beleid
      voldoet aan [artikel 12][ref23];

      b. een uiteenzetting over het in het verslagjaar gevoerde beleid inzake het leveren van een bijdrage aan de
      leefbaarheid, in welke uiteenzetting zij aannemelijk maakt, dat dit beleid voldoet aan [artikel 12a][ref24];

      c. een uiteenzetting over het in het verslagjaar gevoerde beleid inzake het bijdragen aan het tot stand brengen van
      huisvesting voor ouderen, gehandicapten en personen die zorg of begeleiding behoeven, in welke uiteenzetting zij
      aannemelijk maakt, dat dit beleid voldoet aan [artikel 12b][ref25];

      d. een uiteenzetting over het in het verslagjaar gevoerde beleid inzake het toewijzen, verhuren en vervreemden
      van haar woongelegenheden, in welke uiteenzetting zij aannemelijk maakt, dat dit beleid voldoet aan
      [artikel 70c, eerste lid, van de Woningwet][ref26], en aan de [artikelen 13][ref27], [14][ref28], [15][ref29] en
      [15a][ref30];

      e. een uiteenzetting over de wijze waarop zij in het verslagjaar de bewoners van haar
      woongelegenheden bij haar beleid en beheer heeft betrokken, in welke uiteenzetting zij aannemelijk
      maakt, dat zij voldoet aan [artikel 16][ref31] en [17][ref32], en aan de [artikelen 2a][ref33],
      [3, eerste, tweede en vierde lid][ref34], [4][ref35], [5][ref36], [5a][ref37], [5b, tweede en derde lid][ref38], en
      [7, eerste en tweede lid, van de Wet op het overleg huurders verhuurder][ref39];

      f. een uiteenzetting over het in het verslagjaar gevoerde beleid en beheer op financieel gebied, in welke
      uiteenzetting zij aannemelijk maakt, dat dit beleid en beheer voldoet aan de [artikelen 21][ref40] en [22][ref41];

      g. een uiteenzetting over haar overige werkzaamheden in het verslagjaar op het gebied van de volkshuisvesting, voor
      zover daarover niet ingevolge het eerste lid verslag dient te worden gelegd, in welke uiteenzetting zij aannemelijk
      maakt, dat die werkzaamheden hebben bijgedragen aan de beleidsresultaten, uiteengezet ingevolge de onderdelen a tot
      en met f;

      h. een uiteenzetting over het door haar gevoerde overleg met de gemeenten waar zij feitelijk werkzaam is over
      het in die gemeenten geldende volkshuisvestingsbeleid en de daaruit voortgevloeide afspraken daarover met die
      gemeenten, in welke uiteenzetting zij aannemelijk maakt, dat is voldaan aan [artikel 11f][ref42];

      i. een overzicht van en een uiteenzetting over de verbindingen met andere rechtspersonen en vennootschappen
      waartoe zij in het verslagjaar heeft besloten, in welke uiteenzetting zij aannemelijk maakt, dat is voldaan aan
      [artikel 11a, tweede lid][ref43];

      j. een overzicht van haar overige activiteiten in het verslagjaar op het gebied van verbindingen met andere
      rechtspersonen of vennootschappen, welk overzicht een juist en volledig inzicht geeft in de werkzaamheden en de
      financiële situatie van die rechtspersonen en vennootschappen;

      k. een overzicht van haar activiteiten in het verslagjaar op het gebied van beleggingen;

      l. een overzicht van haar onrendabele investeringen in het verslagjaar en

      m. een verklaring, dat zij in het verslagjaar haar middelen uitsluitend heeft besteed in het belang van de
      volkshuisvesting.

      3 De toegelaten instelling stelt van haarzelf en van haar verbindingen met andere rechtspersonen en vennootschappen
      als bedoeld in [artikel 2a][ref44], voor zover deze verbindingen betrekking hebben op onroerende zaken, jaarlijks
      een overzicht op met verantwoordingsgegevens over het verslagjaar. Dit overzicht wordt ingericht overeenkomstig
      [bijlage II][ref45] bij dit besluit, welke bijlage bij ministeriële regeling kan worden gewijzigd.


