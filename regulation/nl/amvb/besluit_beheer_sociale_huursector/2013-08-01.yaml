  - number: '16'
    text: |-
      1 De toegelaten instelling stelt de huurders van haar woongelegenheden in de gelegenheid klachten over haar
      handelen of nalaten, of het handelen of nalaten van personen die voor haar werkzaamheden verrichten, in te dienen
      bij een klachtencommissie die tot taak heeft haar met redenen omkleed over de behandeling van die klachten te
      adviseren.

      2 De toegelaten instelling deelt aan de huurder die de klacht heeft ingediend zo spoedig mogelijk schriftelijk en
      met redenen omkleed mee, of zij naar aanleiding van de behandeling van de klacht maatregelen zal nemen en, zo ja,
      welke.

      3 De toegelaten instelling geeft bij reglement regels omtrent de samenstelling en de werkwijze van de
      klachtencommissie.
    url: https://wetten.overheid.nl/BWBR0005686/2013-08-01#Artikel16
  - number: '17'
    text: |-
      1 Indien de toegelaten instelling een meerjarenplan of een stuk, genoemd in de [artikelen 25a][ref1] en
      [26, eerste, tweede en derde lid][ref2], opstelt, informeert zij de betrokken huurdersorganisaties en de betrokken
      bewonerscommissies, bedoeld in [artikel 1 van de Wet op het overleg huurders verhuurder][ref3], over deze
      onderwerpen.

      2 Indien de betrokken huurdersorganisaties of de betrokken bewonerscommissies, bedoeld in
      [artikel 1 van de Wet op het overleg huurders verhuurder][ref4], de toegelaten instelling te kennen hebben gegeven
      een advies te willen geven of overleg met haar te willen voeren over de verstrekte informatie, bedoeld in het
      eerste lid, stelt de toegelaten instelling de betrokken huurdersorganisaties of de betrokken bewonerscommissies
      daartoe in de gelegenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel25a
