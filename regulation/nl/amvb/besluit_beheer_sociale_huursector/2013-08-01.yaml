  - number: '5'
    text: |-
      1 Binnen acht weken na ontvangst van een aanvraag om een toelating als bedoeld in
      [artikel 70, eerste lid, van de Woningwet][ref1] stelt Onze Minister de gemeente waar de vereniging of de stichting
      haar woonplaats heeft, alsmede elke gemeente waar zij bij toelating naar verwachting feitelijk werkzaam zal zijn,
      in de gelegenheid haar zienswijze over de gevolgen van de toelating voor de volkshuisvesting ter plaatse aan hem
      kenbaar te maken. Die gemeenten kunnen binnen acht weken nadien hun zienswijzen aan Onze Minister doen toekomen.

      2 Binnen acht weken na ontvangst van een aanvraag om een toelating als bedoeld in
      [artikel 70, eerste lid, van de Woningwet][ref2] stelt Onze Minister voorts het Centraal Fonds voor de
      Volkshuisvesting in de gelegenheid zijn zienswijze over de financiële aspecten van de toelating aan hem kenbaar te
      maken. Het fonds kan binnen acht weken nadien zijn zienswijze aan Onze Minister doen toekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel70
