  - number: '30'
    text: |-
      1 De toegelaten instelling doet jaarlijks voor 1 juli aan Onze Minister, aan het college van burgemeester en
      wethouders van de gemeente waar zij haar woonplaats heeft en van elke gemeente waar zij feitelijk werkzaam is, en
      aan het bestuur van het Centraal Fonds voor de Volkshuisvesting toekomen:

      a. de ingevolge [artikel 26][ref1] opgestelde stukken over het aan die datum voorafgaande verslagjaar en

      b. de bij die stukken behorende verklaring en mededelingen, bedoeld in
      [artikel 29, eerste lid, onderdelen a, b en c][ref2].

      2 De toegelaten instelling doet jaarlijks voor 1 juli aan Onze Minister en aan het bestuur van het Centraal Fonds
      voor de Volkshuisvesting het accountantsverslag, bedoeld in [artikel 29, eerste lid, onderdeel d][ref3], toekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0005686#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0005686#Artikel29
