  - number: '33'
    text: |-
      1 Onze Minister vormt zich jaarlijks voor 1 december een oordeel over de werkzaamheden van de toegelaten
      instellingen in het aan die datum voorafgaande verslagjaar. Hij betrekt het overzicht, bedoeld in
      [artikel 4, eerste lid, onderdeel a][ref1], van het Besluit Centraal Fonds voor de Volkshuisvesting, bij dat
      oordeel, indien hij dat overzicht op 1 november voorafgaand aan de in de eerste volzin bedoelde datum heeft
      ontvangen.

      2 Onze Minister deelt het oordeel, bedoeld in het eerste lid, voor de in de eerste volzin van dat lid bedoelde
      datum mee aan de toegelaten instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel4
    url: https://wetten.overheid.nl/BWBR0005686/2013-08-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
        afdeling: '1'
  - number: '39'
    text: |-
      Indien een college van burgemeester en wethouders of het bestuur van het Centraal Fonds voor de Volkshuisvesting
      Onze Minister verzoekt maatregelen te nemen of te bevorderen waartoe hij ingevolge dit hoofdstuk bevoegd is, is hij
      gehouden naar aanleiding van dat verzoek een besluit te nemen.
    url: https://wetten.overheid.nl/BWBR0005686/2013-08-01#Artikel39
  - number: 39a
    text: |-
      1 Ten behoeve van het toezicht verstrekt de toegelaten instelling jaarlijks voor 1 juli aan Onze Minister de
      gegevens, bedoeld in [bijlage IV][ref1] bij dit besluit, welke bijlage bij ministeriële regeling kan worden
      gewijzigd, alsmede de mededeling, bedoeld in het tweede lid.

      2 De toegelaten instelling verzoekt aan een daartoe als openbaar optredende accountant als bedoeld in
      [artikel 27, eerste lid][ref2], of aan een organisatie waarin zodanige accountants samenwerken, om overeenkomstig
      [bijlage III][ref3] bij dit besluit een mededeling op te stellen omtrent de gegevens, bedoeld in het eerste lid.

      3 Onze Minister bevestigt binnen vier weken de ontvangst van de krachtens het eerste lid gezonden bescheiden.

      4 Indien een toegelaten instelling de bescheiden op 1 juli van een jaar niet aan Onze Minister heeft doen toekomen,
      stelt hij onverwijld een termijn van ten hoogste vier weken binnen welke de bescheiden alsnog moeten worden
      verstrekt en doet daarvan mededeling aan die toegelaten instelling.

      5 Indien de toegelaten instelling de bescheiden niet binnen de krachtens het vierde lid gestelde termijn
      verstrekt, kan Onze Minister bepalen, dat zij, totdat zij de bescheiden alsnog verstrekt, de door hem aangegeven
      rechtshandelingen slechts kan verrichten na zijn instemming.


      [ref1]: https://wetten.overheid.nl/BWBR0005686
      [ref2]: https://wetten.overheid.nl/BWBR0005686#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0005686
    url: https://wetten.overheid.nl/BWBR0005686/2013-08-01#Artikel39a
    references:
      - id: ref1
        bwb_id: BWBR0005686
      - id: ref2
        bwb_id: BWBR0005686
        artikel: '27'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0005686
  - number: '40'
    text: |-
      Op verzoek van Onze Minister verleent de toegelaten instelling onverwijld inzage van de door hem verlangde
      bescheiden en verstrekt zij hem de door hem verlangde inlichtingen, voor zover dit naar zijn oordeel voor
      uitoefening van het toezicht nodig is.
    url: https://wetten.overheid.nl/BWBR0005686/2013-08-01#Artikel40
  - number: '41'
    text: |-
      1 Onze Minister kan in het belang van de volkshuisvesting een toegelaten instelling een aanwijzing geven. In een
      aanwijzing kan een toegelaten instelling worden verplicht:

      a. zodanig te handelen dat een situatie die strijdig is met het belang van de volkshuisvesting wordt opgeheven of

      b. een voorgenomen handelwijze die niet in het belang van de volkshuisvesting is achterwege te laten.

      2 Onze Minister stelt in een aanwijzing die een toegelaten instelling tot een handeling verplicht een termijn
      binnen welke die toegelaten instelling daaraan dient te voldoen.

      3 Een aanwijzing omvat de gevolgen die Onze Minister verbindt aan het niet voldoen aan die aanwijzing.

      4 Onze Minister betrekt bij een besluit om een aanwijzing als bedoeld in het eerste lid te geven de situatie van de
      volkshuisvesting in de gemeenten waar de toegelaten instelling feitelijk werkzaam is.

      5 Alvorens toepassing te geven aan het eerste lid kan Onze Minister, indien dit naar zijn oordeel wegens de aard
      van de voorgenomen aanwijzing noodzakelijk is, een of meer gemeenten of het Centraal Fonds voor de Volkshuisvesting
      in de gelegenheid stellen binnen een door hem te stellen termijn hun zienswijze over die toepassing aan hem kenbaar
      te maken.

      6 Van een aanwijzing wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0005686/2013-08-01#Artikel41
  - number: '42'
    text: |-
      Een verzoek aan een toegelaten instelling om een bepaalde gedragslijn te volgen waarin niet is aangegeven
      welke gevolgen Onze Minister verbindt aan het niet voldoen aan dat verzoek, is geen aanwijzing in de zin van
      [artikel 41, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel41
    url: https://wetten.overheid.nl/BWBR0005686/2013-08-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: '41'
        hoofdstuk: V
  - number: '43'
    text: |-
      1 Onze Minister kan in het belang van de volkshuisvesting bepalen dat een toegelaten instelling voor een door hem
      te bepalen tijdvak door hem aangegeven handelingen slechts kan verrichten met de voorafgaande instemming van een
      of meer door hem aangewezen personen of instanties, dan wel met zijn voorafgaande instemming. Een gemeente kan niet
      als instantie als bedoeld in de eerste volzin worden aangewezen.

      2 Onze Minister kan, indien een toegelaten instelling niet binnen de in [artikel 41, tweede lid][ref1], bedoelde
      termijn voldoet aan een aanwijzing als bedoeld in [artikel 41, eerste lid][ref2], die de verplichting inhoudt tot
      handelingen die redelijkerwijs niet kunnen worden verricht zonder dat voorafgaand daaraan een schriftelijk plan
      daarvoor is opgesteld, bepalen dat een of meer door hem aangewezen personen of instanties dat plan opstellen.
      De toegelaten instelling verleent die personen of instanties alle medewerking daarbij. Een gemeente kan niet als
      instantie als bedoeld in dit lid worden aangewezen.

      3 Onze Minister geeft geen toepassing aan het tweede lid, dan nadat hij de toegelaten instelling in de gelegenheid
      heeft gesteld binnen een door hem te bepalen termijn aannemelijk te maken dat zij binnen een redelijke termijn zal
      voldoen aan de in de eerste volzin van dat lid bedoelde aanwijzing.

      4 De kosten, gepaard gaande met de door Onze Minister aan personen of instanties als bedoeld in het eerste en
      tweede lid opgedragen werkzaamheden komen voor rekening van de toegelaten instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0005686#Artikel41
    url: https://wetten.overheid.nl/BWBR0005686/2013-08-01#Artikel43
    references:
