      1 Bij ministeriële regeling kunnen voorschriften worden gegeven met het oog op de nakoming van voor Nederland
      verbindende besluiten van de Raad van de Europese Unie, van het Europees Parlement en de Raad gezamenlijk of van
      de Commissie van de Europese Gemeenschap inzake staatssteun of compensatie in de zin van het Verdrag betreffende de
      Europese Unie aan toegelaten instellingen.

      2 Een ministeriële regeling als bedoeld in het eerste lid vervalt met ingang van de dag die een jaar ligt na de
      datum waarop zij in werking is getreden. Zij blijft na die dag van kracht voor zover op die dag een voorstel van
      wet bij de Staten-Generaal is ingediend dat, of een algemene maatregel van bestuur in het Staatsblad is geplaatst
      die in regeling van het betrokken onderwerp voorziet, en voor zover voor een juiste nakoming als bedoeld in het
      eerste lid regeling bij wet of bij algemene maatregel van bestuur niet noodzakelijk is. Na de indiening van een
      zodanig wetsvoorstel of de plaatsing in het Staatsblad van een zodanige algemene maatregel van bestuur vervalt
      zij op het tijdstip waarop dat wetsvoorstel wordt verworpen of, na tot wet te zijn verheven, in werking treedt,
      respectievelijk die algemene maatregel van bestuur wordt ingetrokken of in werking treedt.

      3 De werkingsduur van een ministeriële regeling als bedoeld in het eerste lid kan eenmalig met ten hoogste een jaar
      worden verlengd. De tweede en derde zin van het tweede lid zijn van overeenkomstige toepassing.

      4 Onverminderd [artikel 120b van de Woningwet][ref1] zijn gedragingen in strijd met voorschriften als bedoeld in
      het eerste lid strijdig met het belang van de volkshuisvesting.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel120b
