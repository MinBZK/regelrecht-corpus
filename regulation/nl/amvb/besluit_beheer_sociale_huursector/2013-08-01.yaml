articles:
  - number: '1'
    text: |-
      1 Voor de toepassing van dit besluit wordt verstaan onder:

      a. Centraal Fonds voor de Volkshuisvesting: Centraal Fonds voor de Volkshuisvesting, bedoeld in
      [artikel 71 van de Woningwet][ref1];

      b. woongelegenheid: woning, standplaats, woonwagen, en instelling waarin aan ten minste vijf personen van 65 jaar
      of ouder duurzaam verblijf en verzorging wordt verschaft;

      c. voorziening: bouwkundige of bouwtechnische maatregel aan een woongelegenheid die strekt tot verbetering van de
      indeling of het woongerief, waaronder begrepen de daarbij noodzakelijke opheffing van technische gebreken, of tot
      bouwkundige splitsing of samenvoeging;

      d. huurprijs: prijs die bij huur en verhuur is verschuldigd voor het enkele gebruik van een woongelegenheid,
      uitgedrukt in een bedrag per maand;

      e. onrendabele investeringen: investeringen tegenover welke geen opbrengsten staan of opbrengsten staan die
      blijkens de raming daarvan niet kostendekkend zijn.

      2 Voor de toepassing van dit besluit wordt onder de huurder mede verstaan:

      a. de medehuurder in de zin van de [artikelen 266][ref2] en [267 van Boek 7 van het Burgerlijk Wetboek][ref3];

      b. de persoon, bedoeld in [artikel 268, tweede lid, van Boek 7, van het Burgerlijk Wetboek][ref4], en

      c. degene die de woongelegenheid met toestemming van de toegelaten instelling huurt van een huurder die haar huurt
      van die toegelaten instelling.

      3 Voor de toepassing van dit besluit wordt onder de bewoner, naast de huurder, verstaan degene die met instemming
      van de huurder zijn hoofdverblijf in de gehuurde woongelegenheid heeft.

      4 Voor de toepassing van dit besluit valt het verslagjaar in de zin van dit besluit samen met het kalenderjaar.


