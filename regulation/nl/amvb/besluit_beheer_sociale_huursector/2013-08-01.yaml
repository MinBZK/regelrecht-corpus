  - number: '14'
    text: |-
      Onverminderd [artikel 70c, eerste lid, van de Woningwet][ref1] en [artikel 13, eerste lid][ref2], streeft de
      toegelaten instelling er bij het verhuren van haar woningen naar, dat door huurders in een zo gering mogelijke mate
      een beroep wordt gedaan op bijdragen op voet van de [Wet op de huurtoeslag][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel70c
      [ref2]: https://wetten.overheid.nl/BWBR0005686#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0008659
    url: https://wetten.overheid.nl/BWBR0005686/2013-08-01#Artikel14
