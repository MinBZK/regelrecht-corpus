  - number: '21'
    text: |-
      1 De toegelaten instelling voert een zodanig financieel beleid en beheer, dat haar voortbestaan in financieel
      opzicht is gewaarborgd.

      2 De toegelaten instelling zet de middelen die zij niet dient aan te houden om te voldoen aan het eerste lid, in
      ten behoeve van de volkshuisvesting.
    url: https://wetten.overheid.nl/BWBR0005686/2013-08-01#Artikel21
  - number: '22'
    text: De toegelaten instelling bestemt batige saldi uitsluitend voor werkzaamheden op het gebied van de volkshuisvesting.
    url: https://wetten.overheid.nl/BWBR0005686/2013-08-01#Artikel22
  - number: '24'
    text: De toegelaten instelling draagt zorg voor een sobere en doelmatige bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0005686/2013-08-01#Artikel24
  - number: '25'
    text: |-
      De toegelaten instelling draagt zorg voor een administratie die een juist en volledig inzicht geeft in haar
      werkzaamheden en haar financiële situatie.
    url: https://wetten.overheid.nl/BWBR0005686/2013-08-01#Artikel25
  - number: 25a
    text: |-
      1 De toegelaten instelling stelt van haarzelf en van haar verbindingen met andere rechtspersonen en vennootschappen
      als bedoeld in [artikel 2a][ref1], voor zover deze verbindingen betrekking hebben op onroerende zaken een
      overzicht op van voorgenomen activiteiten, waaruit elke gemeente waar zij feitelijk werkzaam is kan afleiden welke
      activiteiten op haar grondgebied zijn voorzien. Dat overzicht is van toepassing op het eerstvolgende kalenderjaar
      en kan van toepassing zijn op een of meer daaropvolgende kalenderjaren.

      2 Het overzicht verschaft op hoofdlijnen een toegelicht inzicht in de voornemens van de toegelaten
      instelling over de uitvoering van de [artikelen 12 tot en met 17][ref2], [21][ref3] en [22][ref4] en van
      de [artikelen 2a][ref5], [3, eerste en vierde lid][ref6], [4][ref7], [5, eerste lid][ref8], [5a][ref9] en
      [5b, tweede en derde lid, van de Wet op het overleg huurders verhuurder][ref10], en in de voornemens van haar
      verbindingen met andere rechtspersonen en vennootschappen voor zover deze verbindingen betrekking hebben op
      onroerende zaken over de uitvoering van de [artikelen 12][ref11], [12a][ref12], [12b][ref13], [21][ref14] en
      [22][ref15].


