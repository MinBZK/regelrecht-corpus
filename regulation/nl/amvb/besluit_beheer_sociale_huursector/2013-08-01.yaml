        artikel: '41'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0005686
        artikel: '41'
        hoofdstuk: V
  - number: 43a
    text: |-
      Onze Minister doet uiterlijk in december van elk jaar aan de Tweede Kamer der Staten-Generaal toekomen:

      a. een overzicht van de door de toegelaten instellingen voorgenomen activiteiten voor dat jaar, gebaseerd op de hem
      ingevolge [artikel 25f, eerste lid][ref1], gezonden samenvattingen, en

      b. een rapportage over de door de toegelaten instellingen in het aan dat jaar voorafgaande jaar verrichte
      werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel25f
    url: https://wetten.overheid.nl/BWBR0005686/2013-08-01#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0005686
        artikel: 25f
        hoofdstuk: IIIA
  - number: '44'
    text: |-
      Buiten de gevallen, bedoeld in de [artikelen 70, tweede lid, derde volzin][ref1], en
      [70a, tweede lid, van de Woningwet][ref2] kan de toelating worden ingetrokken, indien naar het oordeel van
      Onze Minister de toegelaten instelling zodanige schade aan het belang van de volkshuisvesting berokkent of bij
      handhaving van de toelating op korte termijn zal berokkenen, dat haar toelating niet langer in dat belang is te
      achten.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel70a
    url: https://wetten.overheid.nl/BWBR0005686/2013-08-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '70'
      - id: ref2
        bwb_id: BWBR0005181
        artikel: 70a
  - number: '45'
    text: |-
      Een koninklijk besluit tot intrekking van de toelating wordt in de Staatscourant geplaatst. De werking ervan wordt
      opgeschort totdat de beroepstermijn is verstreken of, indien beroep is ingesteld, op het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0005686/2013-08-01#Artikel45
  - number: '47'
    text: |-
      Voor zover gemeenten bevoegdheden die hen ingevolge dit besluit toekomen hebben overgedragen aan een
      samenwerkingsverband als bedoeld in de Wet gemeenschappelijke regelingen, zijn de bepalingen van dit besluit die op
      die bevoegdheden betrekking hebben van overeenkomstige toepassing op dat samenwerkingsverband.
    url: https://wetten.overheid.nl/BWBR0005686/2013-08-01#Artikel47
  - number: '49'
    text: |-
      1 Onze Minister kan van dit besluit afwijken of afwijking daarvan toestaan ten behoeve van experimenten die naar
      zijn oordeel in het belang van de volkshuisvesting zijn.

      2 Onze Minister kan besluiten dat een afwijking als bedoeld in het eerste lid van kracht blijft zolang een door hem
      op basis van het experiment noodzakelijk geoordeelde wijziging van dit besluit nog niet van kracht is geworden en
      in werking is getreden.
    url: https://wetten.overheid.nl/BWBR0005686/2013-08-01#Artikel49
  - number: '51'
    text: |-
      Koninklijke besluiten tot toelating die op voet van het Besluit toegelaten instellingen volkshuisvesting, of van
      een daaraan voorafgaand koninklijk besluit, zijn genomen en waartegen geen beroep meer kan worden ingesteld, staan
      gelijk aan koninklijke besluiten tot toelating op voet van dit besluit.
    url: https://wetten.overheid.nl/BWBR0005686/2013-08-01#Artikel51
  - number: '60'
    text: |-
      1 Dit besluit treedt, met uitzondering van afdeling 1 van [hoofdstuk IV][ref1], het opschrift van afdeling 2 van
      dat [hoofdstuk][ref2] en [artikel 46][ref3] in werking met ingang van 1 januari 1993.

      2 Afdeling 1 van [hoofdstuk IV][ref4], het opschrift van afdeling 2 van dat [hoofdstuk][ref5] en [artikel 46][ref6]
      treden in werking op een bij koninklijk besluit te bepalen tijdstip.


