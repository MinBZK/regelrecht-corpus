  - number: 25f
    text: |-
      1 De toegelaten instellingen zenden de in [artikel 25b][ref1] bedoelde samenvatting voor 1 februari volgend op de
      in [artikel 25c][ref2] bedoelde datum aan Onze Minister.

      2 Indien een toegelaten instelling in een overleg als bedoeld in [artikel 25e, eerste lid][ref3], afspraken met een
      of meer colleges van burgemeester en wethouders van de betrokken in [artikel 25c][ref4] bedoelde gemeenten heeft
      gemaakt over haar activiteiten in het betrokken kalenderjaar, vermeldt zij die afspraken, alsmede de wijzigingen in
      haar voorgenomen activiteiten, in de ingevolge het eerste lid aan Onze Minister te zenden samenvatting.


