  - number: 25b
    text: |-
      1 De toegelaten instelling stelt voorts jaarlijks een samenvatting op van het in [artikel 25a ][ref1] bedoelde
      overzicht, uit welke samenvatting elke gemeente waar zij feitelijk werkzaam is kan afleiden welke gegevens met name
      op haar betrekking hebben.

      2 De samenvatting wordt opgesteld overeenkomstig [bijlage I][ref2] bij dit besluit, welke [bijlage][ref3] bij
      ministeriële regeling kan worden gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel25a
      [ref2]: https://wetten.overheid.nl/BWBR0005686
