        paragraaf: '2'
  - number: 11c
    text: |-
      1 De toegelaten instelling vervreemdt haar woongelegenheden, indien de verkrijger daarvan geen toegelaten
      instelling is, slechts tegen een prijs van ten minste 90 procent van de onderhandse verkoopwaarde vrij van huur en
      gebruik van die woongelegenheden, met uitzondering van de gevallen, bedoeld in het tweede en derde lid.

      2 In bij ministeriële regeling aangegeven gevallen kan de toegelaten instelling haar woongelegenheden vervreemden
      tegen een lagere verkoopprijs dan die, bedoeld in het eerste lid, indien de verkrijger daarvan een natuurlijke
      persoon is die in die woning zijn hoofdverblijf heeft of zal hebben, en wordt voldaan aan de daarbij gestelde
      voorwaarden.

      3 Onze Minister kan op een daartoe strekkende aanvraag van een toegelaten instelling voor andere vervreemdingen
      van woongelegenheden als bedoeld in het eerste lid of in de in het tweede lid bedoelde ministeriële regeling,
      toestemming verlenen indien het belang van de volkshuisvesting zich naar zijn oordeel daartegen niet verzet.
      [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref1] is van toepassing op de aanvraag om toestemming, voor
      zover die toestemming betrekking heeft op de vervreemding van woongelegenheden aan natuurlijke personen die daarin
      hun hoofdverblijf hebben of zullen hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0005686/2013-08-01#Artikel11c
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: 11d
    text: |-
      1 De toegelaten instelling meldt aan Onze Minister haar voornemens tot het vervreemden van onroerende
      zaken aan en het op onroerende zaken vestigen van een recht van erfpacht, van opstal of van
      vruchtgebruik en tot de overdracht van de economische eigendom van onroerende zaken, als bedoeld in
      [artikel 2, tweede lid, van de Wet op belastingen van rechtsverkeer][ref1] ten behoeve van:

      a. natuurlijke personen en

      b. rechtspersonen of vennootschappen die geen toegelaten instelling zijn.

      2 Een melding als bedoeld in het eerste lid geschiedt bij een afzonderlijke schriftelijke mededeling, welke de
      gegevens bevat die door Onze Minister noodzakelijk worden geacht om het betrokken voornemen te kunnen beoordelen.

      3 Bij ministeriële regeling kunnen beperkingen op de in het eerste lid bedoelde meldingsplicht worden aangebracht,
      indien naar het oordeel van Onze Minister voldoende vast is komen te staan dat de daardoor niet meer te melden
      voornemens zullen passen in het volkshuisvestingsbeleid en dat voldoende invloed van de gemeente op die voornemens
      zal zijn gewaarborgd.


      [ref1]: https://wetten.overheid.nl/BWBR0002740#Artikel2
    url: https://wetten.overheid.nl/BWBR0005686/2013-08-01#Artikel11d
    references:
      - id: ref1
        bwb_id: BWBR0002740
        artikel: '2'
  - number: 11e
    text: |-
      1 Onze Minister bevestigt binnen twee weken de ontvangst van een melding als bedoeld in
      [artikel 11d, eerste lid][ref1]. Hij stelt voorts, binnen twee weken na ontvangst van een melding van een voornemen
      als bedoeld in [artikel 11d, eerste lid][ref2], tot het vervreemden van onroerende zaken, elke gemeente waar die
      zaken gelegen zijn in de gelegenheid haar zienswijze over de gevolgen van dat voornemen voor de volkshuisvesting
      ter plaatse aan hem kenbaar te maken, indien dat voornemen niet is opgenomen in afspraken als bedoeld in
      [artikel 25f, tweede lid][ref3]. Hij kan voorts, binnen twee weken na ontvangst van een melding van een voornemen
      als bedoeld in [artikel 11d, eerste lid][ref4], tot het vestigen van rechten als bedoeld in dat lid, toepassing
      geven aan de tweede volzin. De gemeenten kunnen binnen drie weken nadien hun zienswijzen aan Onze Minister doen
      toekomen. Onze Minister doet onverwijld mededeling aan de betrokken toegelaten instelling van de ontvangst van
      die zienswijzen.

      2 Indien de zienswijzen van de in het eerste lid bedoelde gemeenten niet binnen drie weken nadat Onze Minister hen
      tot het geven daarvan in de gelegenheid heeft gesteld in zijn bezit zijn, stelt hij onverwijld een termijn van ten
      hoogste drie weken binnen welke die gemeenten hun zienswijzen alsnog aan hem kunnen doen toekomen en doet daarvan,
      en van de ontvangst van die zienswijzen, onverwijld mededeling aan de betrokken toegelaten instelling.

      3 De toegelaten instelling kan het betrokken voornemen uitvoeren, indien:

      a. Onze Minister niet binnen drie weken na ontvangst van de zienswijzen, bedoeld in het eerste lid, aan de
      toegelaten instelling een aanwijzing als bedoeld in [artikel 41, eerste lid][ref5], heeft gegeven die de uitvoering
      van het betrokken voornemen verbiedt;

      b. uit een schriftelijke mededeling van Onze Minister blijkt dat hij daartegen geen bezwaar heeft of

      c. elf weken zijn verstreken vanaf de ontvangst van de melding van dat voornemen door Onze Minister, zonder dat
      hetzij uit een aanwijzing als bedoeld in [artikel 41, eerste lid][ref6], is gebleken dat hij daartegen bezwaar
      heeft, hetzij uit een mededeling als bedoeld in de tweede volzin van het vierde lid is gebleken dat hij daartegen
      bezwaar zou kunnen hebben.

      4 Onze Minister kan, indien de melding daartoe naar zijn oordeel aanleiding geeft, de in onderdeel a van het derde
      lid genoemde termijn met ten hoogste twee weken verlengen. Hij deelt een verlenging binnen de in onderdeel a van
      het derde lid genoemde termijn mee aan de betrokken toegelaten instelling en de gemeenten die een zienswijze als
      bedoeld in het eerste lid aan hem hebben doen toekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005686#Artikel11d
