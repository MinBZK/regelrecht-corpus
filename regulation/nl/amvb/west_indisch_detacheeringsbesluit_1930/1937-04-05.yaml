preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onzen Minister van Koloniën van 30 Mei 1930, 7de Afdeeling n°. 6;

    Gelet op artikel 63 van de Grondwet;

    Den Raad van State gehoord (advies van 24 Juni 1930, n°. 41);

    Gelezen het nader rapport van Onzen voornoemden Minister van 8 Juli 1930, 7de Afdeeling n°. 13);

    Overwegende, dat het noodzakelijk is, regelen vast te stellen omtrent uitzending naar Suriname en Curaçao van
    personen, in dienst van het Rijk, ter vervulling van betrekkingen in den burgerlijken Landsdienst van die gewesten;

    Hebben goedgevonden en verstaan te bepalen:
  url: https://wetten.overheid.nl/BWBR0001949/1937-04-05#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 De ambtenaar in dienst van het Rijk, die wenscht te worden uitgezonden naar Suriname of naar Curaçao ter
      vervulling van eene betrekking in den burgerlijken Landsdienst van een dier gewesten, moet een daartoe strekkend
      verzoek richten aan Onzen Minister van Koloniën.

      2 Waar in dit besluit wordt gesproken van "Rijksambtenaar" of "ambtenaar", wordt daarmede bedoeld ieder, die in
      burgerlijken dienst is van het Rijk, alsmede beroepsofficieren van de Zee- en Landmacht.

      3 Onze voornoemde Minister stelt - voor zooveel hij dit noodig acht - een onderzoek in naar de bekwaamheid en
      geschiktheid van den gegadigde voor de door hem gewenschte betrekking en naar zijn karakter en levenswandel; tot
      zijne aanwijzing voor mogelijke uitzending op den voet van dit besluit wordt niet besloten dan in overleg met het
      Hoofd van het Departement van Algemeen Bestuur of den Voorzitter van het Hooge College van Staat, waaronder hij
      werkzaam is.
    url: https://wetten.overheid.nl/BWBR0001949/1937-04-05#Artikel1
  - number: '2'
    text: |-
      1 De uitzending geschiedt met een dienstverband van ten hoogste zes jaren, ingaande met den dag van aankomst uit
      Nederland in Suriname of in Curaçao, behalve voor officieren, voor wie de uitzending voor niet langer dan vier
      jaren geschiedt, zullende nochtans voorzoover de burgerlijke ambtenaren betreft, in zeer bijzondere gevallen,
      ter gezamenlijke beoordeeling van den Minister van Koloniën en van den Minister, onder wiens Departement de
      gedetacheerde laatstelijk ressorteerde, de termijn van ten hoogste zes jaren uiterlijk met twee jaren kunnen worden
      verlengd.

      2 Aan een burgerlijk ambtenaar in dienst van het Rijk wordt:

      1°. ter voorbereiding van zijn vertrek uit Nederland voor ten minste veertien dagen vrijstelling van dienst
      verleend met behoud van zijne ambtelijke inkomsten;

      2°. met ingang van den dag van zijn vertrek uit Nederland hetzij eervol ontslag uit den dienst, hetzij, voor den
      duur van zijne detacheering, verlof buiten bezwaar van ’s Rijks schatkist verleend.

      Komt een officier in aanmerking voor uitzending, als in dit besluit bedoeld, dan wordt hij:

      a. indien hij tot de landmacht behoort, voor den duur van die uitzending beschouwd als te zijn ter beschikking van
      den Gouverneur bij de landmacht in Suriname of in Curaçao dienstdoende gesteld, als bedoeld in artikel 20, derde
      lid, der Be[vorderingswet][ref1] voor de Landmacht 1902;

      b. indien hij tot de zeemacht behoort, voor den duur der zending beschouwd als tijdelijk door Ons tot andere
      diensten, niet behoorende tot het Departement van Defensie, te zijn geroepen en ter beschikking te zijn gesteld van
      den Gouverneur van Suriname of van Curaçao.

      Een officier van de landmacht wordt voor den duur van zijne uitzending voor herinnering gevoerd bij de landmacht in
      Suriname of in Curaçao.

      3 Het bepaalde bij het tweede lid onder 1° van dit artikel is ook van toepassing ten aanzien van een uitgezonden
      officier.


      [ref1]: https://wetten.overheid.nl/BWBR0002393
    url: https://wetten.overheid.nl/BWBR0001949/1937-04-05#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002393
  - number: '3'
    text: |-
      Op uitzendingen, als bedoeld in [artikel 2][ref1], zijn van toepassing de bepalingen van het West-Indisch-
      Uitzendingsbesluit 1925 (*Staatsblad* n°. 15, *Gouvernementsblad* n°. 14, *Publicatieblad* n°. 19), en zulks met
      dien verstande, dat het in [artikel 1 onder ][ref2] genoemd bedrag van f 1500 (een duizend vijfhonderd gulden)
      wordt vervangen door f 2500 (tweeduizend vijfhonderd gulden) en dat het maximum van de aldaar onder *c* bedoelde
      vergoedingen naar laatstgemelde som wordt berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0001949#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001949#Artikel1
    url: https://wetten.overheid.nl/BWBR0001949/1937-04-05#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001949
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0001949
        artikel: '1'
  - number: '4'
    text: |-
      1 Nadat een op den voet van de bepalingen van dit besluit uitgezonden ambtenaar hetzij vóór, hetzij uiterlijk op
      of gerekend van den dag, waarop hij in Suriname of in Curaçao zijn in het [eerste lid van artikel 2][ref1] bedoeld
      dienstverband zal hebben vervuld, van zijne werkzaamheid in Surinaamschen of in Curaçaoschen dienst eervol zal
      zijn ontheven dan wel uit dien dienst eervol zal zijn ontslagen, wordt hem, mits hij uiterlijk na verloop van één
      jaar, gerekend van en met den datum, waarop de ontheffing of het ontslag is ingegaan, in Nederland teruggekeerd
      is, ter zake van de afgeloopen detacheering eene uitzendingspremie uitgekeerd, gelijkstaande met tien procent van
      de tijdens het bovenbedoeld dienstverband door hem in Surinaamschen of Curaçaoschen dienst genoten gezamenlijke
      activiteitsjaarwedden.

      2 In geval van overlijden tijdens den duur van het dienstverband wordt naar gelijken maatstaf, berekend tot en met
      den dag van het overlijden, een bedrag aan de erfgenamen uitgekeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0001949#Artikel2
    url: https://wetten.overheid.nl/BWBR0001949/1937-04-05#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001949
        artikel: '2'
  - number: '5'
    text: |-
      1 Een krachtens het [tweede lid van artikel 2][ref1] eervol ontslagen ambtenaar, die van de vervulling van de
      laatstelijk door hem in Suriname of in Curaçao bekleede betrekking eervol is ontheven, wordt bij terugkeer hier
      te lande zoo spoedig doenlijk herplaatst in de vroeger door hem bekleede dan wel in eene daarmede ten minste
      gelijkwaardige betrekking.

      2 Die herplaatsing geschiedt, indien wettelijk toegelaten, desvereischt buiten voordracht of aanbeveling om en met
      voorbijgang van hen, die, ware de belanghebbende onafgebroken in den dienst van het Rijk gebleven, in hun dienstvak
      eene jongere ancienniteit zouden hebben gehad dan hij.

      3 Voor eene zoodanige herplaatsing wordt binnen de grenzen zijner bevoegdheid het noodige verricht door Onzen
      Minister, Hoofd van het betrokken Departement van Algemeen Bestuur.

      4 Aan een eervol ontslagen ambtenaar, als in dit artikel bedoeld, wordt bij herplaatsing eene wedde toegekend,
      welke niet lager is dan die, welke hij zou hebben genoten, indien hij onafgebroken in ’s Rijks dienst ware
      gebleven.


      [ref1]: https://wetten.overheid.nl/BWBR0001949#Artikel2
    url: https://wetten.overheid.nl/BWBR0001949/1937-04-05#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001949
        artikel: '2'
  - number: '6'
    text: |-
      1 Zoolang een eervol ontslagen ambtenaar, als in het vorige artikel bedoeld, niet kan worden geplaatst, heeft
      hij aanspraak op een wachtgeld als omschreven in artikel 4 van het Uitzendingsbesluit 1925 (*Staatsblad* n°. 15,
      *Gouvernementsblad* n°. 14, *Publicatieblad* n°. 19), welk wachtgeld echter niet minder zal bedragen dan de wedde,
      welke hij zou hebben genoten, indien hij onafgebroken in ’s Rijks dienst ware gebleven.

      2 Is de plaatsing in ’s Rijks dienst nog niet geschied op het tijdstip, waarop dit wachtgeld, na zes maanden
      genoten te zijn, ophoudt, dan wordt aan den belanghebbende door den Minister, onder wiens Departement de
      belanghebbende vóór zijn ontslag laatstelijk ressorteerde, met ingang van den dag, waarop het wachtgeld ten laste
      van Suriname of van Curaçao heeft opgehouden, een tweede wachtgeld toegekend ten bedrage van de wedde, welke hij
      zou hebben genoten, indien hij onafgebroken in ’s Rijks dienst ware gebleven.

      3 Het door Onzen vorenbedoelden Minister toegekende wachtgeld wordt gekweten ten laste van het Hoofdstuk der
      Rijksbegrooting, hetwelk die Minister beheert. Indien de betrokkene inkomsten gaat genieten uit of in verband met
      arbeid of bedrijf, wordt het bedrag dier inkomsten op het wachtgeld in mindering gebracht. Ten aanzien van dit
      wachtgeld zijn voorts van overeenkomstige toepassing de artikelen 5, 6, derde, vijfde en zesde lid, 7, eerste lid,
      7*a*, 8, 8 *a*, 9, 10, 11 en 12 van het Koninklijk besluit van 3 Augustus 1922 (*Staatsblad* n°. 479), zooals dit
      sedert zal zijn gewijzigd of aangevuld.

      4 Indien de belanghebbende in ’s Rijks dienst herplaatst is, komt de tijd, gedurende welken hij op grond van dit
      artikel wachtgeld genoten heeft, voor de helft in aanmerking als geldig voor Surinaamsch of Curaçaosch pensioen.
    url: https://wetten.overheid.nl/BWBR0001949/1937-04-05#Artikel6
  - number: '7'
    text: |-
      Een burgerlijk ambtenaar, die terugkeert van eene detacheering met verlof buiten bezwaar van ’s Rijks schatkist als
      in het [tweede lid van artikel 2][ref1] bedoeld, wordt, gerekend van en met den dag van terugkeer hier te lande, in
      activiteit hersteld en in het genot gesteld van de bezoldiging, welke hij zou hebben genoten, indien hij niet naar
      Suriname of naar Curaçao gedetacheerd ware geworden, c. q. met toekenning ook van den hoogeren rang, dien hij in
      dat geval zou hebben bekleed.


      [ref1]: https://wetten.overheid.nl/BWBR0001949#Artikel2
    url: https://wetten.overheid.nl/BWBR0001949/1937-04-05#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001949
        artikel: '2'
  - number: '8'
    text: |-
      1 Ten aanzien van een officier der zeemacht, die van eene detacheering krachtens dit besluit terugkeert, wordt
      gehandeld, alsof hij hier te lande was teruggekeerd van dienst bij de Marine binnen de keerkringen.

      2 Indien een officier van de landmacht bij terugkeer van een zoodanige detacheering krachtens het bepaalde bij
      artikel 70, 4*°*., der Be[vorderingswet][ref1] voor de Landmacht 1902 op non-activiteit wordt gesteld, wordt hem
      boven zijn nonactiviteitsbezoldiging eene uitkeering verleend, ten laste van het Hoofdstuk der Rijksbegrooting
      onder beheer van den Minister van Defensie, ten bedrage van het verschil tusschen hetgeen hij in actieven dienst
      zou genieten en de hem verleende nonactiviteitsbezoldiging.


      [ref1]: https://wetten.overheid.nl/BWBR0002393
    url: https://wetten.overheid.nl/BWBR0001949/1937-04-05#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002393
  - number: '9'
    text: |-
      Het pensioen, dat aan een naar Suriname of naar Curaçao uitgezonden Rijksambtenaar of gewezen Rijksambtenaar ten
      laste van de geldmiddelen van een dezer gewesten mocht worden verleend, wordt aan den belanghebbende, indien en
      zoolang hij in Rijksdienst is herplaatst, niet uitbetaald dan voor zoover noodig tot aanvulling van zijne inkomsten
      uit ’s Rijks kas tot ten hoogste zoodanig bedrag, als waarop hij, ware hij zonder uitzicht op zoodanig pensioen van
      zijne werkzaamstelling in genoemde gewesten ontheven, ingevolge dit besluit aanspraak had kunnen maken.
    url: https://wetten.overheid.nl/BWBR0001949/1937-04-05#Artikel9
  - number: '10'
    text: |-
      Dit besluit, dat kan worden aangehaald als "West-Indisch Detacheeringsbesluit 1930", treedt in werking met ingang
      van den 1sten September 1930.
    url: https://wetten.overheid.nl/BWBR0001949/1937-04-05#Artikel10
