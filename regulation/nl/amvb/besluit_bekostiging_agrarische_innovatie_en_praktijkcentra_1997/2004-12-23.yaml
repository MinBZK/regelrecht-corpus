  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op voordracht van Onze Minister van Landbouw, Natuurbeheer en Visserij, van 20 november 1996, nr. J. 9611314,
    Directie Juridische Zaken;

    Gelet op artikel 2.2.12 van de Wet educatie en beroepsonderwijs ;

    De Raad van State gehoord (advies van 20 december 1996, No. W11.96.0552);

    Gezien het nader rapport van Onze Minister van Landbouw, Natuurbeheer en Visserij van 16 januari 1997, nr. J.97180,
    Directie Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008516/2004-12-23#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:








                  wet


                  Wet educatie en beroepsonderwijs;




                  leerlingcursistweek


                  periode van een week gedurende welke een ingeschreven cursist instructie volgt;




                  logeergebouw:


                  logeeraccommodatie voor de cursisten die wordt gebruikt door een agrarisch innovatie- en
      praktijkcentrum;




                  agrarisch innovatie- en praktijkcentrum:


                  een uit de openbare kas bekostigd centrum, dat werkzaam is ten behoeve van het beroepsonderwijs op het
      gebied van de landbouw en de natuurlijke omgeving.
    url: https://wetten.overheid.nl/BWBR0008516/2004-12-23#Artikel1
  - number: '2'
    text: |-
      1 De rijksbijdrage, bedoeld in artikel 2.2.12 van de wet, bestaat uit een bijdrage voor het personeel en een
      bijdrage voor de overige kosten.

      2 De bijdrage voor het personeel, bestaande uit de categorieën docent en ondersteunend en beheerspersoneel,
      wordt berekend door voor beide categorieën de ratio's te vermenigvuldigen met de in het voorgaande cursusjaar
      gerealiseerde leerlingcursistweken, voor het ondersteunend personeel met de door Onze Minister vastgestelde
      formatie, en daarna te vermenigvuldigen met de betrokken gemiddelde personeelslast. Op de uitkomst van deze
      berekening kan een budgetfactor worden toegepast.

      3 De bijdrage voor de overige kosten bestaat uit:

      a. een bijdrage voor het schoolgebouw per vierkante meter, zijnde de eigenaarsvergoeding;

      b. een vergoeding per leerlingcursistweek, zijnde de gebruikersvergoeding;

      c. een vergoeding voor het logeergebouw, en

      d. een vergoeding voor de tussen Onze Minister en een agrarisch innovatie- en praktijkcentrum overeengekomen
      activiteiten.
    url: https://wetten.overheid.nl/BWBR0008516/2004-12-23#Artikel2
  - number: '3'
    text: |-
      Een ratio als bedoeld in [artikel 2, tweede lid][ref1], is een breuk die de verhouding weergeeft tussen een
      volledige formatieplaats en een door Onze Minister vastgesteld aantal leerlingcursistweken.


      [ref1]: https://wetten.overheid.nl/BWBR0008516#Artikel2
    url: https://wetten.overheid.nl/BWBR0008516/2004-12-23#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008516
        artikel: '2'
  - number: '4'
    text: |-
      De gemiddelde personeelslast, bedoeld in [artikel 2, tweede lid][ref1], is het bedrag aan personele middelen per
      formatieplaats binnen de betrokken personeelscategorie, gerekend over alle agrarische innovatie- en praktijkcentra.


      [ref1]: https://wetten.overheid.nl/BWBR0008516#Artikel2
    url: https://wetten.overheid.nl/BWBR0008516/2004-12-23#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008516
        artikel: '2'
  - number: '5'
    text: |-
      De in het voorgaande cursusjaar gerealiseerde leerlingcursistweken, bedoeld in
      [artikel 2, derde lid, onderdeel ][ref1], komen ten hoogste voor een door Onze Minister voor datzelfde cursusjaar
      toegewezen aantal voor een bijdrage in aanmerking.


      [ref1]: https://wetten.overheid.nl/BWBR0008516#Artikel2
    url: https://wetten.overheid.nl/BWBR0008516/2004-12-23#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008516
        artikel: '2'
  - number: '6'
    text: |-
      De budgetfactor, bedoeld in [artikel 2, tweede lid][ref1], geeft de verhouding weer tussen het aantal door Onze
      Minister voor het jaar waarvoor de vergoeding wordt betaald toegewezen leerlingcursistweken, en het voor een
      bijdrage in aanmerking komende aantal leerlingcursistweken, bedoeld in [artikel 2, derde lid, onderdeel ][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008516#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008516#Artikel2
    url: https://wetten.overheid.nl/BWBR0008516/2004-12-23#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008516
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0008516
        artikel: '2'
  - number: '7'
    text: |-
      De personele middelen, bedoeld in [artikel 4][ref1], zijn de middelen ten behoeve van salarissen,
      overhevelingstoeslagen, toelagen, uitkeringen en vergoedingen, alsmede de bijdragen tot het pensioen van het
      personeel en van hun nagelaten betrekkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0008516#Artikel4
    url: https://wetten.overheid.nl/BWBR0008516/2004-12-23#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008516
        artikel: '4'
  - number: '8'
    text: |-
      Onze Minister kan vooruitlopend op de betaling van de in [artikel 2, eerste lid][ref1], bedoelde bijdrage, een
      voorschot verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0008516#Artikel2
    url: https://wetten.overheid.nl/BWBR0008516/2004-12-23#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008516
        artikel: '2'
  - number: '9'
    text: |-
      Met het oog op de vergoeding, bedoeld in [artikel 2, eerste lid][ref1], dient het agrarisch innovatie- en
      praktijkcentrum bij Onze Minister elk jaar voor 1 september ten behoeve van het eerstkomende kalenderjaar een
      aanvraag in vergezeld van een activiteitenplan.


      [ref1]: https://wetten.overheid.nl/BWBR0008516#Artikel2
    url: https://wetten.overheid.nl/BWBR0008516/2004-12-23#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008516
        artikel: '2'
  - number: '10'
    text: |-
      De jaarrekening gaat vergezeld van een opgave van de leerlingenbezetting van het agrarisch innovatie- en
      praktijkcentrum en van het logeergebouw per week van het afgelopen cursusjaar, op een formulier waarvan het model
      door Onze Minister wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008516/2004-12-23#Artikel10
  - number: '11'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin het wordt
      geplaatst en werkt terug tot en met 1 januari 1997.
    url: https://wetten.overheid.nl/BWBR0008516/2004-12-23#Artikel11
  - number: '12'
    text: Dit besluit wordt aangehaald als Besluit bekostiging agrarische innovatie- en praktijkcentra 1997.
    url: https://wetten.overheid.nl/BWBR0008516/2004-12-23#Artikel12
