  - number: '1.2'
    text: 'Tenzij het tegendeel blijkt, worden in dit besluit onder ambtenaren mede begrepen:'
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel1
  - number: 1.2.a
    text: gewezen ambtenaren;
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel1
  - number: 1.2.b
    text: |-
      bij een vertegenwoordiging van het Koninkrijk in het buitenland op arbeidsovereenkomst naar
      burgerlijk recht in dienst genomen werknemers als bedoeld in de [artikelen 114][ref1] en
      [115 van het Reglement Dienst Buitenlandse Zaken][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel114
      [ref2]: https://wetten.overheid.nl/BWBR0004052#Artikel115
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '114'
      - id: ref2
        bwb_id: BWBR0004052
        artikel: '115'
  - number: 1.2.c
    text: gewezen werknemers als bedoeld in onderdeel b.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel1
  - number: '1.3'
    text: |-
      Voor de toepassing van [hoofdstuk 3][ref1] van dit besluit wordt onder ambtenaar ook verstaan een ambtenaar in de
      zin van het [Burgerlijk ambtenarenreglement Defensie][ref2] of het [Algemeen militair ambtenarenreglement][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0026951#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0006040
      [ref3]: https://wetten.overheid.nl/BWBR0003482
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0026951
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0006040
      - id: ref3
        bwb_id: BWBR0003482
  - number: '2.1'
    text: |-
      Ten aanzien van een melder wordt als gevolg van het te goeder trouw melden van een vermoeden van een misstand
      geen besluit met nadelige gevolgen voor zijn rechtspositie genomen. Het bevoegd gezag draagt er zorg voor dat een
      melder, niet op andere wijze bij de uitoefening van zijn functie nadelige gevolgen ondervindt ten gevolge van die
      melding.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel2
  - number: '2.2'
    text: |-
      Ten aanzien van een vertrouwenspersoon of een gewezen vertrouwenspersoon, wordt vanwege de uitoefening van zijn
      taken op basis van dit besluit geen besluit met nadelige gevolgen voor zijn rechtspositie genomen. Het bevoegd
      gezag draagt er zorg voor dat hij niet op andere wijze bij de uitoefening van zijn functie nadelige gevolgen
      ondervindt in de uitoefening van zijn taken.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel2
  - number: '2.3'
    text: |-
      Onder een besluit met nadelige gevolgen voor de rechtspositie wordt in ieder geval verstaan een besluit dat strekt
      tot:
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel2
  - number: 2.3.a
    text: het verlenen van ontslag anders dan op eigen verzoek;
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel2
  - number: 2.3.b
    text: het tussentijds beëindigen of het niet verlengen van diens aanstelling in tijdelijke dienst;
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel2
  - number: 2.3.c
    text: het niet omzetten van diens aanstelling in tijdelijke dienst voor een proeftijd in een aanstelling in vaste dienst;
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel2
  - number: 2.3.d
    text: het verplaatsen of overplaatsen of het weigeren van een verzoek daartoe;
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel2
  - number: 2.3.e
    text: het treffen van een ordemaatregel;
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel2
  - number: 2.3.f
    text: het treffen van een disciplinaire maatregel;
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel2
  - number: 2.3.g
    text: het onthouden van salarisverhoging;
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel2
  - number: 2.3.h
    text: het onthouden van promotiekansen;
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel2
  - number: 2.3.i
    text: het afwijzen van verlof.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel2
  - number: '3.1'
    text: Er is een Commissie integriteit overheid.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel3
  - number: '3.2'
    text: |-
      De commissie heeft tot taak een melding te onderzoeken en het bevoegd gezag naar aanleiding van dat onderzoek te
      adviseren.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel3
  - number: '4.1'
    text: |-
      De commissie bestaat uit drie leden, onder wie de voorzitter. Voorts kunnen een plaatsvervangend voorzitter en
      plaatsvervangende leden worden benoemd. De plaatsvervangend voorzitter wordt uit de leden benoemd.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel4
  - number: '4.2'
    text: |-
      De leden en de plaatsvervangende leden worden door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      benoemd en ontslagen. Zij worden benoemd voor een periode van ten hoogste vier jaar. Herbenoeming kan twee maal en
      telkens voor ten hoogste vier jaar plaatsvinden. Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt
      de centrales van verenigingen van ambtenaren die zijn toegelaten tot het arbeidsvoorwaardenoverleg van de sectoren
      Rijk, Politie en Defensie in de gelegenheid ter zake voorstellen te doen.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel4
  - number: '5'
    text: |-
      De commissie wordt bijgestaan door een secretaris en een plaatsvervangend secretaris, die door Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties worden benoemd en ontslagen.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel5
  - number: '6'
    text: De commissie besluit bij meerderheid van stemmen.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel6
  - number: '7'
    text: |-
      De commissie zendt jaarlijks een verslag van haar werkzaamheden aan Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties. Deze zendt dit verslag naar de Tweede Kamer der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel7
  - number: '8.1'
    text: Het bevoegd gezag wijst een of meer vertrouwenspersonen aan bij de organisatie.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel8
  - number: '8.2'
    text: 'De vertrouwenspersoon heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel8
  - number: 8.2.a
    text: een ambtenaar op diens verzoek te adviseren over een melding;
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel8
  - number: 8.2.b
    text: de hoogste ambtelijke leidinggevende te informeren over een melding; en
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel8
  - number: 8.2.c
    text: het bevoegd gezag en de hoogste ambtelijke leidinggevende te adviseren over vermoedens van misstanden.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel8
  - number: '8.3'
    text: |-
      Als vertrouwenspersoon wordt niet een ambtenaar van politie, bedoeld in
      [artikel 2, onderdelen a, c en d, van de Politiewet 2012][ref1] aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '2'
  - number: '9.1'
    text: |-
      Een ambtenaar doet een melding bij zijn leidinggevende, bij een vertrouwenspersoon, of, indien daartoe aanleiding
      bestaat, rechtstreeks bij de commissie.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel9
  - number: '9.2'
    text: |-
      Een ambtenaar doet een melding over een organisatie waar hij niet werkzaam is, bij een leidinggevende of bij een
      vertrouwenspersoon van die organisatie of indien daartoe aanleiding bestaat, rechtstreeks bij de commissie.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel9
  - number: '9.3'
    text: Een melding laat wettelijke verplichtingen tot het doen van aangifte van strafbare feiten onverlet.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel9
  - number: '10'
    text: |-
      Indien een melder niet meer werkzaam is bij de organisatie waarop de melding betrekking heeft, doet hij de melding
      binnen twee jaar na zijn vertrek bij die organisatie.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel10
  - number: '11'
    text: De vertrouwenspersoon maakt de identiteit van de melder niet bekend zonder instemming van de melder.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel11
  - number: '12'
    text: |-
      Diegenen die betrokken zijn bij de behandeling van een melding gaan op behoorlijke en zorgvuldige wijze met de
      identiteit van de melder om.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel12
  - number: '13'
    text: |-
      Degene bij wie een melding is gedaan stelt de hoogste ambtelijke leidinggevende onverwijld schriftelijk in kennis
      van de melding en de datum waarop deze is ontvangen.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel13
  - number: '14.1'
    text: 'De hoogste ambtelijke leidinggevende:'
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel14
  - number: 14.1.a
    text: bevestigt de ontvangst van de melding schriftelijk aan de melder of de vertrouwenspersoon; en
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel14
  - number: 14.1.b
    text: |-
      informeert de persoon of personen op wie de melding betrekking heeft over de melding, tenzij daardoor een
      onderzoeksbelang kan worden geschaad.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel14
  - number: '14.2'
    text: |-
      Indien de hoogste ambtelijke leidinggevende de ontvangst van de melding aan de vertrouwenspersoon heeft gemeld,
      stuurt deze de ontvangstbevestiging door aan de melder.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel14
  - number: '15.1'
    text: Het bevoegd gezag stelt een onderzoek in naar het vermoeden van een misstand.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel15
  - number: '15.2'
    text: |-
      Het onderzoek wordt niet verricht door een persoon die mogelijk betrokken is of is geweest bij de vermoede
      misstand.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel15
  - number: '15.3'
    text: 'Het onderzoek en de verdere behandeling van de melding kan in ieder geval achterwege worden gelaten als:'
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel15
  - number: 15.3.a
    text: |-
      geen sprake is van een vermoeden van een misstand als bedoeld in [artikel 1, eerste lid, onder e][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0026951#Artikel1
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0026951
        artikel: '1'
        hoofdstuk: '1'
  - number: 15.3.b
    text: |-
      de melding niet is gedaan binnen de in [artikel 10][ref1] genoemde termijn, wanneer de melder niet meer werkzaam is
      bij de organisatie waarop de melding betrekking heeft;


      [ref1]: https://wetten.overheid.nl/BWBR0026951#Artikel10
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0026951
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 15.3.c
    text: de melding kennelijk onredelijk laat is gedaan.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel15
  - number: '15.4'
    text: |-
      Het bevoegd gezag meldt het achterwege laten van een onderzoek en van de verdere behandeling van de melding zo
      spoedig mogelijk schriftelijk aan de melder of de vertrouwenspersoon, alsmede aan de persoon of personen op wie
      de melding betrekking heeft, tenzij daardoor een ander onderzoeksbelang kan worden geschaad. De vertrouwenspersoon
      stuurt de kennisgeving door aan de melder.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel15
  - number: '15.5'
    text: |-
      Bij de kennisgeving, bedoeld in het vierde lid, wordt mededeling gedaan van de mogelijkheid het vermoeden van een
      misstand te melden bij de commissie.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel15
  - number: '16.1'
    text: |-
      Het bevoegd gezag stelt de melder of de vertrouwenspersoon binnen twaalf weken na de melding schriftelijk en
      gemotiveerd in kennis van de bevindingen van het onderzoek, het oordeel daarover en de eventuele consequenties die
      daaraan worden verbonden.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel16
  - number: '16.2'
    text: |-
      Als niet binnen twaalf weken toepassing kan worden gegeven aan het eerste lid, wordt de melder of de
      vertrouwenspersoon voordat deze termijn verlopen is daarvan schriftelijk en gemotiveerd op de hoogte gesteld.
      Daarbij wordt de termijn aangegeven waarbinnen de melder of de betrokken vertrouwenspersoon een kennisgeving als
      bedoeld in het eerste lid ontvangt.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel16
  - number: '16.3'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op de persoon of personen op wie de melding betrekking
      heeft, tenzij daardoor een onderzoeksbelang kan worden geschaad.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel16
  - number: '16.4'
    text: |-
      Indien het bevoegd gezag de kennisgeving, bedoeld in het eerste of tweede lid, zendt aan de vertrouwenspersoon,
      stuurt deze de kennisgeving door aan de melder.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel16
  - number: '16.5'
    text: |-
      Bij de kennisgeving, bedoeld in het eerste lid, wordt mededeling gedaan van de mogelijkheid het vermoeden van een
      misstand te melden bij de commissie.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel16
  - number: '17.1'
    text: |-
      Behoudens de rechtstreekse melding bij de commissie, bedoeld in [artikel 9, eerste en tweede lid][ref1], kan een
      ambtenaar een vermoeden van een misstand melden bij de commissie, indien hij:


      [ref1]: https://wetten.overheid.nl/BWBR0026951#Artikel9
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0026951
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 17.1.a
    text: |-
      zich niet kan vinden in de inhoud van de kennisgeving, bedoeld in [artikel 15, vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0026951#Artikel15
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0026951
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 17.1.b
    text: |-
      zich niet kan vinden in de inhoud van de kennisgeving, bedoeld in [artikel 16, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0026951#Artikel16
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0026951
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 17.1.c
    text: |-
      niet binnen de termijn, genoemd in [artikel 16, eerste lid][ref1], of de door het bevoegd gezag aangegeven termijn,
      bedoeld in [artikel 16, tweede lid][ref2], een kennisgeving heeft ontvangen;


      [ref1]: https://wetten.overheid.nl/BWBR0026951#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0026951#Artikel16
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0026951
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0026951
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 17.1.d
    text: |-
      de door het bevoegd gezag aangegeven termijn, bedoeld in [artikel 16, tweede lid][ref1], onredelijk lang is.


      [ref1]: https://wetten.overheid.nl/BWBR0026951#Artikel16
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0026951
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '17.2'
    text: 'De melding bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel17
  - number: 17.2.a
    text: naam en adres van de melder;
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel17
  - number: 17.2.b
    text: de organisatie waar de betrokkene werkzaam is of is geweest;
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel17
  - number: 17.2.c
    text: de organisatie waarop de melding betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel17
  - number: 17.2.d
    text: een omschrijving van de misstand die wordt vermoed;
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel17
  - number: 17.2.e
    text: de reden van de melding aan de commissie.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel17
  - number: '17.3'
    text: |-
      De melder verschaft voorts de gegevens die voor het advies van de commissie nodig zijn en waarover de melder
      redelijkerwijs de beschikking kan krijgen.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel17
  - number: '18'
    text: De commissie maakt de identiteit van de melder niet bekend zonder instemming van de melder.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel18
  - number: '19'
    text: |-
      De commissie bevestigt de ontvangst van een melding aan de melder en stelt het bevoegd gezag op de hoogte van de
      melding. De commissie informeert voorts de persoon of de personen op wie de vermoede misstand betrekking heeft, dat
      een melding is gedaan, tenzij dit een onderzoeksbelang kan schaden.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel19
  - number: '20.1'
    text: De commissie stelt een onderzoek in.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel20
  - number: '20.2'
    text: 'Het onderzoek en de verdere behandeling van de melding kan achterwege worden gelaten indien:'
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel20
  - number: 20.2.a
    text: |-
      de termijnen, genoemd in [artikel 17, eerste lid, onder c en d][ref1], nog niet verstreken zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0026951#Artikel17
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0026951
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 20.2.b
    text: |-
      niet is voldaan aan [artikel 9, eerste of tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0026951#Artikel9
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0026951
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 20.2.c
    text: |-
      niet is voldaan aan [artikel 17, tweede lid][ref1], met dien verstande dat de melder eerst de gelegenheid moet
      hebben gehad binnen een door de commissie gestelde termijn de melding aan te vullen;


      [ref1]: https://wetten.overheid.nl/BWBR0026951#Artikel17
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0026951
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 20.2.d
    text: |-
      de melding niet is gedaan binnen de in [artikel 10][ref1] genoemde termijn, wanneer de melder niet meer werkzaam is
      bij de organisatie waarop de melding betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0026951#Artikel10
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0026951
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '20.3'
    text: |-
      Het achterwege laten van een onderzoek en de verdere behandeling van de melding wordt onder vermelding van redenen
      zo spoedig mogelijk schriftelijk medegedeeld aan de melder, het bevoegd gezag, alsmede aan de persoon of personen
      op wie de melding betrekking heeft, tenzij daardoor een ander onderzoeksbelang kan worden geschaad.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel20
  - number: '20.4'
    text: |-
      Ten behoeve van het onderzoek kan de commissie bij het bevoegd gezag alle inlichtingen inwinnen die zij voor de
      vorming van haar advies nodig acht. Het bevoegd gezag verschaft aan de commissie de gevraagde inlichtingen.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel20
  - number: '20.5'
    text: |-
      Wanneer de inhoud van bepaalde door het bevoegd gezag verstrekte inlichtingen vanwege het vertrouwelijke karakter
      uitsluitend ter kennisneming van de commissie dient te blijven, wordt dit aan de commissie medegedeeld. De
      commissie draagt er zorg voor in dergelijke gevallen vertrouwelijk met deze informatie om te gaan en deze waar
      nodig te beveiligen tegen kennisneming door onbevoegden.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel20
  - number: '20.6'
    text: De kosten van het onderzoek komen voor rekening van de organisatie waarop de melding betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel20
  - number: '21.1'
    text: |-
      De commissie legt zo spoedig mogelijk, maar uiterlijk twaalf weken na ontvangst van de melding, haar bevindingen
      omtrent de melding neer in een advies, gericht aan het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel21
  - number: '21.2'
    text: |-
      Als niet binnen twaalf weken kan worden geadviseerd, kan de commissie het uitbrengen van een advies verdagen. Het
      bevoegd gezag en de melder worden daarover tijdig schriftelijk en met vermelding van redenen geïnformeerd. Daarbij
      wordt de termijn aangegeven waarbinnen zij het advies ontvangen.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel21
  - number: '21.3'
    text: De commissie zendt aan de melder een afschrift van het advies.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel21
  - number: '22.1'
    text: |-
      Na ontvangst van het advies, bedoeld in [artikel 21][ref1], stelt het bevoegd gezag de melder, de commissie en,
      tenzij daardoor een onderzoeksbelang kan worden geschaad, de persoon of personen op wie de melding betrekking
      heeft, zo spoedig mogelijk maar uiterlijk binnen twaalf weken schriftelijk in kennis van zijn standpunt
      dienaangaande en de eventuele consequenties die het daaraan verbindt.


      [ref1]: https://wetten.overheid.nl/BWBR0026951#Artikel21
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0026951
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '22.2'
    text: |-
      Als het standpunt en de consequenties afwijken van het advies, vermeldt het bevoegd gezag de reden voor de
      afwijking.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel22
  - number: '22.3'
    text: |-
      Als de commissie de identiteit van de melder niet bekend heeft gemaakt, stuurt de commissie de kennisgeving,
      bedoeld in het eerste lid, door aan de melder.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel22
  - number: '22.4'
    text: |-
      Nadat de commissie het standpunt van het bevoegd gezag heeft ontvangen maakt deze haar advies in geanonimiseerde
      vorm openbaar. Indien de commissie het standpunt na twaalf weken na verzending van het advies aan het bevoegd gezag
      nog niet heeft ontvangen, maakt de commissie haar advies openbaar. Indien zwaarwegende redenen hieraan in de weg
      staan, blijft openbaarmaking van het advies achterwege.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel22
  - number: '22.5'
    text: |-
      Het bevoegd gezag maakt zijn standpunt in geanonimiseerde vorm openbaar tenzij zwaarwegende redenen hieraan in de
      weg staan.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel22
  - number: '23.1'
    text: |-
      De melder, de vertrouwenspersoon of de gewezen vertrouwenspersoon die bezwaar maakt, beroep of hoger beroep instelt
      of een verzoek om voorlopige voorziening bij de bestuursrechter doet, kan aanspraak maken op een tegemoetkoming in
      de kosten van die procedures, op voorwaarde dat:
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel23
  - number: 23.1.a
    text: |-
      de rechtsprocedure is gericht tegen een besluit als bedoeld in [artikel 2, eerste of tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0026951#Artikel2
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0026951
        artikel: '2'
        hoofdstuk: '1'
  - number: 23.1.b
    text: |-
      bedoeld besluit is genomen binnen vijf jaar nadat het bevoegd gezag kennis heeft gegeven van de bevindingen en
      het oordeel bedoeld in [artikel 16, eerste lid][ref1], of nadat het bevoegd gezag kennis heeft gegeven van het
      standpunt, bedoeld in [artikel 22, eerste lid][ref2]; en


      [ref1]: https://wetten.overheid.nl/BWBR0026951#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0026951#Artikel22
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0026951
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0026951
        artikel: '22'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 23.1.c
    text: bedoeld besluit wordt aangevochten op de grond dat het is genomen vanwege een melding.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel23
  - number: '23.2'
    text: |-
      De melder, de vertrouwenspersoon of de gewezen vertrouwenspersoon die op grond van
      [artikel 4:8 Algemene wet bestuursrecht][ref1] zijn zienswijze naar voren brengt met betrekking tot een voorgenomen
      besluit, kan aanspraak maken op een tegemoetkoming in de kosten op voorwaarde dat:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 23.2.a
    text: |-
      het voorgenomen besluit betreft een besluit als bedoeld in [artikel 2, eerste of tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0026951#Artikel2
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0026951
        artikel: '2'
        hoofdstuk: '1'
  - number: 23.2.b
    text: het voorgenomen besluit is kenbaar gemaakt binnen de in het eerste lid, onder b, genoemde termijn; en
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel23
  - number: 23.2.c
    text: in de zienswijze naar voren wordt gebracht dat het voorgenomen besluit verband houdt met de melding.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel23
  - number: '23.3'
    text: |-
      De melder, de vertrouwenspersoon of de gewezen vertrouwenspersoon richt een verzoek om een tegemoetkoming aan het
      bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel23
  - number: '24.1'
    text: 'Aanspraak op een tegemoetkoming bestaat alleen voor zover:'
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel24
  - number: 24.1.a
    text: |-
      door de melder in verband met de in [artikel 23][ref1] bedoelde procedures daadwerkelijk kosten worden of zijn
      gemaakt met betrekking tot door een derde beroepsmatig verleende rechtsbijstand; en


      [ref1]: https://wetten.overheid.nl/BWBR0026951#Artikel23
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0026951
        artikel: '23'
        hoofdstuk: '4'
  - number: 24.1.b
    text: |-
      het verzoek door het bevoegd gezag is ontvangen voordat op het bezwaar is beslist of uitspraak is gedaan in de
      procedure waarop het verzoek betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel24
  - number: '24.2'
    text: |-
      Het bevoegd gezag kan het verzoek in ieder geval afwijzen indien het onderzoek en de verdere behandeling van de
      melding op grond van [artikel 15, derde lid][ref1], en [20, tweede lid][ref2], achterwege zijn gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0026951#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0026951#Artikel20
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0026951
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0026951
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '25.1'
    text: |-
      De tegemoetkoming voor iedere afzonderlijke procedure, genoemd in [artikel 23, eerste en tweede lid][ref1], is
      gelijk aan tweemaal het bedrag, genoemd in onderdeel B1 van de [bijlage bij het Besluit proceskosten bestuursrecht]
      (onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0026951#Artikel23
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0026951
        artikel: '23'
        hoofdstuk: '4'
  - number: '25.2'
    text: |-
      [Artikel 3 van het Besluit proceskosten bestuursrecht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006358#Artikel3
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0006358
        artikel: '3'
  - number: '26.1'
    text: Het bevoegd gezag beslist binnen zes weken op het verzoek.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel26
  - number: '26.2'
    text: |-
      Het bevoegd gezag kan de beslissing voor ten hoogste vier weken verdagen. Van de verdaging wordt schriftelijk
      mededeling gedaan.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel26
  - number: '27'
    text: |-
      Degene aan wie een tegemoetkoming is toegekend, kan worden verplicht tot terugbetaling, indien hij de procedure
      waarop de tegemoetkoming betrekking heeft, staakt voordat op het bezwaar is beslist of uitspraak is gedaan. Deze
      verplichting geldt niet, indien het staken van de procedure direct voortvloeit uit de intrekking door het bevoegd
      gezag van het besluit, waartegen de procedure is gericht.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel27
  - number: '28.1'
    text: |-
      Als een besluit of een voorgenomen besluit waarvoor op grond van [artikel 23, eerste of tweede lid][ref1],
      aanspraak bestaat op een tegemoetkoming in de kosten van de procedures, in de bezwaarprocedure of
      zienswijzeprocedure wordt herroepen wegens een aan het bevoegd gezag te wijten onrechtmatigheid of het bestreden
      besluit als gevolg van een uitspraak van de rechter die onherroepelijk is geworden wordt vernietigd, waarbij de
      rechtsgevolgen niet in stand worden gelaten, vergoedt het bevoegd gezag voor iedere afzonderlijke procedure aan
      de melder, de vertrouwenspersoon of de gewezen vertrouwenspersoon alle daadwerkelijk en in redelijkheid door hem
      gemaakte kosten als bedoeld in [artikel 1 van het Besluit proceskosten bestuursrecht][ref2], met dien verstande
      dat:


      [ref1]: https://wetten.overheid.nl/BWBR0026951#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0006358#Artikel1
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0026951
        artikel: '23'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0006358
        artikel: '1'
  - number: 28.1.a
    text: de vergoeding wordt toegekend zonder toepassing van het tariefsysteem in voornoemd besluit;
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel28
  - number: 28.1.b
    text: |-
      de kosten van door een derde beroepsmatig verleende rechtsbijstand worden vergoed voor een bedrag van ten hoogste
      € 200 per uur tot een bedrag van ten hoogste € 5000, beide bedragen exclusief BTW en kantoorkosten;
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel28
  - number: 28.1.c
    text: |-
      aan de melder toegekende bedragen waarop de melder op grond van een ander wettelijk voorschrift of een uitspraak
      van een gerechtelijke instantie aanspraak heeft in verband met de vergoeding van kosten als bedoeld in dit artikel,
      in aftrek worden gebracht op de vergoeding.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel28
  - number: '28.2'
    text: |-
      De in het eerste lid genoemde bedragen worden per 1 januari van elk jaar bij ministeriële regeling gewijzigd aan de
      hand van de consumentenprijsindex, geldend voor de maand september van het voorafgaande jaar.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel28
  - number: '29'
    text: |-
      Het [Besluit van 3 februari 2006 tot instelling van de Commissie integriteit overheid][ref1] (Stb. 130) wordt
      ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0019525
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0019525
  - number: '30'
    text: |-
      [Hoofdstuk VIIb van het Algemeen Rijksambtenarenreglement][ref1] vervalt.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#HoofdstukVIIb
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0001950
        hoofdstuk: VIIb
  - number: '31'
    text: |-
      [Hoofdstuk VIIa, paragraaf 2, van het Besluit algemene rechtspositie politie][ref1] vervalt.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0006516
        paragraaf: '2'
  - number: '32'
    text: |-
      [Hoofdstuk II, paragraaf 3b, van het Besluit rechtspositie vrijwillige politie][ref1] vervalt.


      [ref1]: https://wetten.overheid.nl/BWBR0007321#Paragraaf3b
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0007321
        paragraaf: 3b
  - number: '33'
    text: |-
      [Hoofdstuk VIIb van het Ambtenarenreglement Staten-Generaal][ref1] vervalt.


      [ref1]: https://wetten.overheid.nl/BWBR0003229#HoofdstukVIIb
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0003229
        hoofdstuk: VIIb
  - number: '34'
    text: |-
      [Hoofdstuk XIIa van het Reglement Dienst Buitenlandse Zaken][ref1] vervalt.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#HoofdstukXIIa
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0004052
        hoofdstuk: XIIa
  - number: '35'
    text: |-
      De benoemingsbesluiten van de leden van de Commissie integriteit overheid, zoals die op grond van
      [artikel 3, tweede lid, van het Besluit tot instelling van de Commissie integriteit overheid][ref1] zijn
      vastgesteld en die op de datum van inwerkingtreding van dit besluit gelden, blijven na de inwerkingtreding van dit
      besluit ongewijzigd van kracht.


      [ref1]: https://wetten.overheid.nl/BWBR0019525#Artikel3
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0019525
        artikel: '3'
  - number: 35a
    text: |-
