  - number: '36'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties zendt binnen vijf jaar na de inwerkingtreding van dit
      besluit aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van dit besluit in de praktijk.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel36
  - number: '37'
    text: |-
      Dit besluit treedt in werking met ingang van 1 januari 2010. Indien het Staatsblad waarin dit besluit wordt
      geplaatst, wordt uitgegeven na 31 december 2009, treedt het in werking met ingang van de dag na de datum van
      uitgifte van het Staatsblad waarin het wordt geplaatst, en werkt het terug tot en met 1 januari 2010.
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel37
  - number: '38'
    text: 'Dit besluit wordt aangehaald als: Besluit melden vermoeden van misstand bij Rijk en Politie.'
    url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#Artikel38
