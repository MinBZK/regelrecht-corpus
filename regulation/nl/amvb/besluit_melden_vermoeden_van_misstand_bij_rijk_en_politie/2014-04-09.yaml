  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties van 18 september 2009, nr. DCB/
    CZW/WVOB 2009-0000514166, gedaan mede namens Onze Minister van Buitenlandse Zaken;

    Gelet op de artikelen 125, eerste lid, onder j, 125quinquies, eerste lid, onder f en 134, eerste lid, van de
    Ambtenarenwet en artikel 50, eerste lid, van de Politiewet 1993;

    De Raad van State gehoord (advies van 14 oktober 2009, nr. W04.09.0368/I);

    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties van 25 november 2009,
    nr. 2009-0000601757, CZW/WVOB, uitgebracht mede namens Onze Minister van Buitenlandse Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0026951/2014-04-09#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In dit besluit wordt verstaan onder: - *ambtenaar:* de ambtenaar in de zin van het
      [Algemeen Rijksambtenarenreglement][ref1], het [Ambtenarenreglement Staten-Generaal][ref2], het
      [Reglement Dienst Buitenlandse Zaken][ref3], het [Besluit algemene rechtspositie politie][ref4], het
      [Besluit rechtspositie vrijwillige politie][ref5];
        - *organisatie:* een ministerie met inbegrip van de daaronder ressorterende diensten en instellingen, de
      Eerste en Tweede Kamer der Staten-Generaal, de Raad van State, de Algemene Rekenkamer, het bureau van de
      Nationale ombudsman, de Hoge Raad van Adel, de Kanselarij der Nederlandse Orden, het Kabinet van de Koning,
      de commissie van toezicht betreffende de inlichtingen- en veiligheidsdiensten, de politie, bedoeld in
      [artikel 1, eerste lid, onderdeel b, van de Politiewet 2012][ref6], de rijksrecherche of het LSOP, de rechtbanken,
      de gerechtshoven, de Centrale Raad van Beroep, het College van Beroep voor het bedrijfsleven, de Raad voor de
      rechtspraak en de daaronder ressorterende diensten, alsmede de diensten die door een gerechtelijk college of de
      Raad voor de rechtspraak gezamenlijk of in samenwerking met een ander orgaan van de rijksoverheid in stand worden
      gehouden;
        - *bevoegd gezag:* het tot aanstellen bevoegde gezag van de organisatie, niet zijnde de Minister van Defensie;
        - *hoogste ambtelijke leidinggevende:* de ambtenaar die de hoogste zeggenschap uitoefent bij de leiding van de
      arbeid in de organisatie anders dan het Ministerie van Defensie, niet zijnde het bevoegd gezag;
        - *vermoeden van een misstand:* een op redelijke gronden gebaseerd vermoeden van: 1° een schending van wettelijke
      voorschriften of beleidsregels; 2° een gevaar voor de gezondheid, de veiligheid of het milieu; 3° een onbehoorlijke
      wijze van handelen of nalaten, die een gevaar vormt voor het goed functioneren van de openbare dienst; bij de
      organisatie waarin de melder werkt of heeft gewerkt of bij een andere organisatie indien hij uit hoofde van zijn
      ambtenaarschap met die organisatie in aanraking is gekomen en kennis heeft gekregen van de misstand;
        - *melder:* de ambtenaar die een vermoeden van een misstand meldt overeenkomstig [hoofdstuk 3][ref7] van dit
      besluit;
        - *melding:* de melding van een vermoeden van een misstand door een melder;
        - *commissie:* de Commissie integriteit overheid;
        - *vertrouwenspersoon:* de vertrouwenspersoon, bedoeld in [artikel 8][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0001950
