articles:
  - number: '1'
    text: |-
      1 Voor de toepassing van de [Participatiewet][ref1], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2] en de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3] wordt met een
      Nederlander gelijkgesteld de vreemdeling die, na rechtmatig in Nederland verblijf te hebben gehouden in de zin van
      [artikel 8, onder a tot en met e, of l, van de Vreemdelingenwet 2000][ref4]:

      a. voor de beëindiging van dit verblijf een aanvraag heeft ingediend om voortgezette toelating, of

      b. binnen de termijn, genoemd in [artikel 69, eerste lid, van de Vreemdelingenwet 2000][ref5], of,
      buiten die termijn, in geval [artikel 6.11 van de Algemene wet bestuursrecht][ref6] toepassing heeft
      gevonden, bezwaar heeft gemaakt of beroep heeft ingesteld tegen intrekking van de toelating in de zin van
      [artikel 8, onder a tot en met e, of l, van de Vreemdelingenwet 2000][ref7].

      2 De gelijkstelling, bedoeld in het eerste lid, eindigt zodra:

      a. onherroepelijk op de aanvraag, het bezwaar of het beroep is beslist, of

      b. de uitzetting van de vreemdeling is gelast, tenzij die uitzetting ingevolge de [Vreemdelingenwet 2000][ref8] of
      op grond van een rechterlijke beslissing achterwege dient te blijven.


