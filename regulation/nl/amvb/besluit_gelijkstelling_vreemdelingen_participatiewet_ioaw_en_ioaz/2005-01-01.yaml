  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid van 20 mei 1997, Directie Wetgeving,
    Bestuurlijke en Juridische Aangelegenheden, Nr. WBJA/W1/97/0567;

    Gelet op de artikelen 7, derde lid, van de Algemene bijstandswet, 6, derde lid, van de Wet inkomensvoorziening
    oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers en 6, vijfde lid, van de Wet inkomensvoorziening
    oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen;

    De Raad van State gehoord (advies van 17 juni 1997, nr. W12.97.0307);

    Gezien het nader rapport van Onze Minister van Sociale Zaken en Werkgelegenheid van 22 april 1998, Directie
    Wetgeving, Bestuurlijke en Juridische Aangelegenheden, Nr. WBJA/W1/98/0477;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0009576/2005-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Voor de toepassing van de [Wet werk en bijstand][ref1], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3], de
      [Wet voorzieningen gehandicapten][ref4] en de [Wet werk en inkomen kunstenaars][ref5] wordt met een Nederlander
      gelijkgesteld de vreemdeling die, na rechtmatig in Nederland verblijf te hebben gehouden in de zin van
      [artikel 8, onder a tot en met e, of l, van de Vreemdelingenwet 2000][ref6]:

      a. voor de beëindiging van dit verblijf een aanvraag heeft ingediend om voortgezette toelating, of

      b. binnen de termijn, genoemd in [artikel 69, eerste lid, van de Vreemdelingenwet 2000][ref7], of,
      buiten die termijn, in geval [artikel 6.11 van de Algemene wet bestuursrecht][ref8] toepassing heeft
      gevonden, bezwaar heeft gemaakt of beroep heeft ingesteld tegen intrekking van de toelating in de zin van
      [artikel 8, onder a tot en met e, of l, van de Vreemdelingenwet 2000][ref9].

      2 De gelijkstelling, bedoeld in het eerste lid, eindigt zodra:

      a. onherroepelijk op de aanvraag, het bezwaar of het beroep is beslist, of

      b. de uitzetting van de vreemdeling is gelast, tenzij die uitzetting ingevolge de [Vreemdelingenwet 2000][ref10] of
      op grond van een rechterlijke beslissing achterwege dient te blijven.


