        hoofdstuk: '5'
  - number: '34'
    text: |-
      De eigenaar stort teveel ontvangen voorschotten onmiddellijk terug, tenzij Onze minister tot verrekening op andere
      wijze heeft besloten.
    url: https://wetten.overheid.nl/BWBR0008615/2003-06-18#Artikel34
  - number: '35'
    text: |-
      Onze minister kan een formulier vaststellen voor:

      a. de restauratie-behoefteraming, bedoeld in [artikel 4][ref1];

      b. het gemeentelijk en provinciaal restauratie-uitvoeringsprogramma, bedoeld in [artikel 11][ref2],
      onderscheidenlijk 12;

      c. de aanvraag en de begroting, bedoeld in [artikel 14, eerste lid][ref3];

      d. het overzicht, bedoeld in [artikel 22][ref4];

      e. een verklaring als bedoeld in [artikel 23, tweede lid][ref5];

      f. het rapport en het verslag, bedoeld in [artikel 25, onderdeel ][ref6];

      g. het onderhoudsplan, bedoeld in [artikel 29, derde lid][ref7];

      h. de aanvraag tot subsidievaststelling en de rekening en verantwoording, bedoeld in
      [artikel 31, eerste lid][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0008615#Artikel4
