articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. de wet: de [Monumentenwet 1988][ref1];

      b. eigenaar: een natuurlijke persoon of rechtspersoon die het recht van eigendom of een ander zakelijk recht heeft
      op een beschermd monument;

      c. restauratie: werkzaamheden aan een beschermd monument, het normale onderhoud te boven gaand, die voor het
      herstel van het beschermd monument noodzakelijk zijn;

      d. subsidiabele restauratiekosten: kosten als bedoeld in [artikel 16][ref2];

      e. budgethoudende gemeente: een gemeente die beschikt over een in werking getreden verordening als bedoeld in
      [artikel 15 van de wet][ref3] en waarin ten minste 100 beschermde monumenten gelegen zijn;

      f. budget: het budget, bedoeld in [artikel 5][ref4].

      2 Het aantal beschermde monumenten dat in een gemeente is gelegen, wordt eenmaal in de vier jaar bepaald aan de
      hand van het register, bedoeld in [artikel 6, van de wet][ref5]; de eerste keer naar de stand van 1 januari 1997.


      [ref1]: https://wetten.overheid.nl/BWBR0004471
      [ref2]: https://wetten.overheid.nl/BWBR0008615#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0004471#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0008615#Artikel5
