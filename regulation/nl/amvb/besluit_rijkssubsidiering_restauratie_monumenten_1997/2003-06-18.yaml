  - number: '40'
    text: |-
      1 Op een subsidieverstrekking als bedoeld in [artikel 38][ref1] zijn de[ artikelen 2][ref2],
      [4 tot en met 13][ref3] en [15][ref4] niet van toepassing.

      2 Subsidie als bedoeld in [artikel 38][ref5] wordt onverminderd [artikel 3][ref6] slechts verstrekt indien:

      a. de vergunning, bedoeld in [artikel 11][ref7] van de wet, is verleend en de werking daarvan niet is opgeschort;

      b. naar genoegen van Onze minister aannemelijk is gemaakt dat het gedeelte van de kosten van de voorgenomen
      restauratie, dat niet door subsidie gedekt kan worden, financieel zeker gesteld is en dat overigens met de
      restauratie vóór 1 oktober 1997 kan worden begonnen.

      3 De aanvraag om subsidie als bedoeld in [artikel 38][ref8] bevat, naast de eisen, gesteld in [artikel 14][ref9],
      tevens een verklaring waarin wordt aangegeven:

      a. op welke wijze het monument na de restauratie wordt gefinancierd;

      b. welke bestemming het monument na de restauratie krijgt;

      c. op welke wijze verzekerd is dat met de restauratie vóór 1 oktober 1997 kan worden begonnen.

      4 Burgemeester en wethouders zenden Onze minister de aanvraag om subsidie als bedoeld in artikel 38 vóór 16 juli
      1997 toe, vergezeld van:

      a. een door hen opgestelde berekening van de subsidiabele restauratiekosten; en

      b. een afschrift van de voor de restauratie benodigde vergunning.


