  - number: '33'
    text: |-
      1 Onze minister beslist op de aanvraag tot vaststelling van de subsidie binnen een redelijke termijn na de
      doorzending, bedoeld in [artikel 32][ref1].

      2 Indien de aanvraag is ingediend bij burgemeester en wethouders van een gemeente zonder verordening als bedoeld in
      [artikel 15][ref2] van de wet beslist Onze minister op de aanvraag binnen een redelijke termijn na de doorzending
      van de aanvraag.

      3 Een afschrift van de vaststelling van de subsidie zendt Onze minister aan burgemeester en wethouders, aan
      gedeputeerde staten en aan de Stichting Nationaal Restauratiefonds.


      [ref1]: https://wetten.overheid.nl/BWBR0008615#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0008615#Artikel15
    url: https://wetten.overheid.nl/BWBR0008615/2003-06-18#Artikel33
