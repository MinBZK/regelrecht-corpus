  - number: '17'
    text: |-
      1 De subsidie bedraagt twintig procent van de subsidiabele restauratiekosten.

      2 In afwijking van het eerste lid gelden de volgende percentages:

      a. voor kerkelijke monumenten: 40;

      b. voor monumenten met uitzondering van molens, waarvan de eigenaar een in Nederland gevestigde privaatrechtelijke
      rechtspersoon is die zonder winstoogmerk in hoofdzaak de instandhouding van één of meer monumenten ten doel heeft
      en die is gerangschikt onder de instellingen, bedoeld in [artikel 24, vierde lid, van de Successiewet 1956][ref1]:
      40;

      c. voor molens en gemalen die uit een oogpunt van monumentenzorg bedrijfsvaardig zijn of door de restauratie
      bedrijfsvaardig worden gemaakt en waarvan de eigenaar een in Nederland gevestigde privaatrechtelijke rechtspersoon
      is die zonder winstoogmerk in hoofdzaak de instandhouding van één of meer monumenten ten doel heeft: 40;

      d. voor monumenten waarvan de eigenaar een publiekrechtelijke rechtspersoon is en voor andere dan de onder *c*
      bedoelde molens en gemalen die uit een oogpunt van monumentenzorg bedrijfsvaardig zijn of door de restauratie
      bedrijfsvaardig worden gemaakt: 30;

      e. Voor orgels, carillons, klokken en uurwerken, die deel uitmaken van een monument en die vermeld worden in het
      register waarin het monument is ingeschreven, voor zover dat monument valt: onder de onder *a* of *b* genoemde
      categorie: '40; onder de onder *d* genoemde categorie: 30.'

      3 De percentages, bedoeld in het eerste en tweede lid, worden met 30 verhoogd, indien ten tijde van de indiening
      van de aanvraag om subsidie bij de gemeente, de eigenaar:

      a. een lichaam is dat niet behoort tot de belastingplichtigen, bedoeld in de [artikelen 2][ref2] en
      [3 van de Wet op de vennootschapsbelasting 1969][ref3];

      b. een lichaam is als bedoeld in [artikel 5, onderdeel a, van de Wet op de vennootschapsbelasting 1969][ref4]
      waarop [artikel 10.9 van de Wet inkomstenbelasting 2001][ref5] niet van toepassing is;

      c. een lichaam is als bedoeld in [artikel 5, onderdeel d, van de Wet op de vennootschapsbelasting 1969][ref6];

      d. een lichaam is dat op grond van [artikel 6 van de Wet op de vennootschapsbelasting 1969][ref7] is vrijgesteld
      van belasting;

      e. een natuurlijke persoon is, die de kosten van restauratie niet kan
      aanmerken als uitgaven waarvoor hij persoonsgebonden aftrek in de zin van
      [artikel 6.1, tweede lid, onderdeel g, van de Wet inkomstenbelasting 2001][ref8] kan genieten, zulks blijkens een
      daartoe strekkende beslissing van de belastingdienst, en voorzover het monument door hem niet wordt gebruikt in het
      kader van de uitoefening van een beroep of bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0002226#Artikel24
