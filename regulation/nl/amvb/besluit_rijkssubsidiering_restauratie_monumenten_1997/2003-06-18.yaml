  - number: '16'
    text: |-
      1 Subsidiabele restauratiekosten zijn kosten die, met inachtneming van het tweede tot en met zevende lid, naar het
      oordeel van Onze minister noodzakelijk zijn om de onderdelen van een beschermd monument, die monumentale waarde
      bezitten te herstellen of te conserveren.

      2 De monumentale waarde van een beschermd monument wordt bepaald door de dragende onderdelen, de vloeren en het
      omhulsel, alsmede door die onderdelen of objecten die blijkens het register, bedoeld in [artikel 6][ref1] van de
      wet, dan wel naar het oordeel van Onze minister van algemeen belang zijn wegens hun schoonheid, hun betekenis voor
      de wetenschap of hun cultuur-historische waarde.

      3 Indien uit het register, bedoeld in [artikel 6][ref2] van de wet, blijkt dat een monument uitsluitend beschermd
      is vanwege één of meer met name genoemde onderdelen of objecten, wordt de monumentale waarde van dat monument
      uitsluitend bepaald door die onderdelen of objecten.

      4 Subsidiabele restauratiekosten zijn tevens kosten die gemaakt worden voor:

      a. voorzieningen aan een beschermd monument, die naar het oordeel van Onze minister nodig zijn ten behoeve van een
      regelmatige inspectie daarvan;

      b. installaties ter voorkoming van brand of blikseminslag voor zover die installaties door Onze minister op grond
      van [artikel 28, eerste lid][ref3], zijn voorgeschreven;

      c. schilderwerk voor zover de te schilderen onderdelen gerestaureerd worden en de kosten daarvan subsidiabel zijn;

      d. leges, naar evenredigheid van de verhouding tussen de subsidiabele en de niet-subsidiabele restauratiekosten;

      e. een Casco-All-Risk verzekering als bedoeld in [artikel 27, tweede lid][ref4], naar evenredigheid van de
      verhouding tussen de subsidiabele en de niet-subsidiabele restauratiekosten;

      f. directiekosten naar evenredigheid van de verhouding tussen de subsidiabele en de niet-subsidiabele
      restauratiekosten;

      g. bouwhistorisch onderzoek.

      5 Indien een eigenaar zelf werkzaamheden in het kader van een restauratie verricht, zijn diens loonkosten niet
      subsidiabel tenzij hij die werkzaamheden verricht in het kader van een door hem gedreven onderneming.

      6 Indien restauratiekosten op grond van een verzekering worden gedekt, worden de subsidiabele restauratiekosten
      verminderd met het bedrag dat ontstaat door het bedrag van de verzekeringspenningen te vermenigvuldigen met de
      breuk die ontstaat door de subsidiabele restauratiekosten te delen door de restauratiekosten.


      [ref1]: https://wetten.overheid.nl/BWBR0008615#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008615#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0008615#Artikel28
      [ref4]: https://wetten.overheid.nl/BWBR0008615#Artikel27
