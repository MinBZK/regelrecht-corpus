  - number: '2'
    text: |-
      1 Onze minister kan aan de eigenaar van een beschermd monument dat voorkomt in een gemeentelijk restauratie-
      uitvoeringsprogramma als bedoeld in [artikel 11][ref1] subsidie verstrekken in de subsidiabele restauratiekosten
      van dat monument.

      2 Onze minister kan aan de eigenaar van een beschermd monument dat voorkomt in een provinciaal restauratie-
      uitvoeringsprogramma als bedoeld in [artikel 12][ref2] subsidie verstrekken in de subsidiabele restauratiekosten
      van dat monument.

      3 Een subsidie als bedoeld in het eerste of tweede lid wordt slechts verstrekt voorzover:

      a. het budget van de budgethoudende gemeente of van de provincie in het jaar of de jaren ten laste waarvan de
      subsidie wordt verstrekt, toereikend is; en

      b. de som van vier opeenvolgende budgetten toereikend is.

      4 Een periode van vier opeenvolgende budgetten als bedoeld in het derde lid, onderdeel *b*, valt samen met elke
      periode van vier jaren, te rekenen vanaf het jaar 2002.

      5 Zolang binnen een periode van vier jaren als bedoeld in het vierde lid voor een of meer jaren geen budget is
      vastgesteld, wordt uitsluitend om de som van het derde lid, onderdeel *b*, te kunnen maken, het vastgestelde budget
      of het gemiddelde van twee of drie vastgestelde budgetten, geacht te zijn vastgesteld voor het tweede, derde of
      vierde jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0008615#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0008615#Artikel12
    url: https://wetten.overheid.nl/BWBR0008615/2003-06-18#Artikel2
