        artikel: '1'
        hoofdstuk: '1'
  - number: '43'
    text: |-
      1 De budgetten, berekend op grond van artikel 5 van het Besluit rijkssubsidiëring restauratie monumenten
      ten behoeve van een budgethoudende gemeente en ten laste komend van de begrotingen voor de jaren 1998 tot
      en met 2002, gelden voor zover ten laste daarvan geen toezeggingen zijn gedaan, als budgetten als bedoeld in
      [artikel 5, eerste lid][ref1].

      2 De budgetten, berekend op grond van artikel 5 van het Besluit rijkssubsidiëring restauratie monumenten ten
      behoeve van de niet-budgethoudende gemeenten en ten laste komend van de begrotingen voor de jaren 1998 tot en met
      2002, gelden voor zover ten laste van die budgetten geen toezeggingen zijn gedaan, per bedoelde jaren bij elkaar
      opgeteld als budgetten als bedoeld in [artikel 5, tweede lid][ref2].

      3 De budgetten, bedoeld in het eerste of tweede lid, zijn voor:

      a. 50% beschikbaar voor subsidieverstrekking aan woonhuizen en boerderijen;

      b. 50% beschikbaar voor subsidieverstrekking aan overige monumenten.

      4 In afwijking van [artikel 2, derde lid, onderdeel b][ref3], wordt een subsidie ten laste van de begroting voor
      de jaren 1998 tot en met 2002 slechts verstrekt voorzover de ingevolge [artikel 2, vijfde lid][ref4], voor de
      categorie van monumenten waartoe het te restaureren monument behoort, beschikbare gedeelten van de budgetten van de
      desbetreffende budgethoudende gemeente of provincie betreffende de jaren 1998 tot en met 2002, tezamen toereikend
      zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0008615#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0008615#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0008615#Artikel2
