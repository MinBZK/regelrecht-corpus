        artikel: '6'
        hoofdstuk: '3'
  - number: '6'
    text: |-
      1 Budgetten hebben betrekking op het zesde jaar volgend op het jaar waarin ze op grond van [artikel 5][ref1] moeten
      worden vastgesteld.

      2 Budgetten worden vastgesteld onder de voorwaarde dat voldoende begrotingsgelden ter beschikking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008615#Artikel5
    url: https://wetten.overheid.nl/BWBR0008615/2003-06-18#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008615
        artikel: '5'
        hoofdstuk: '3'
  - number: '8'
    text: |-
      1 Indien een budgethoudende gemeente na 30 april een restauratie-behoefteraming indient, wordt voor de
      desbetreffende gemeente in dat jaar geen budget vastgesteld.

      2 Indien een niet-budgethoudende gemeente na 30 april een restauratie-behoefteraming heeft ingediend, wordt die
      restauratie-behoefteraming in dat jaar buiten de vaststelling van de budgetten gehouden.

      3 Indien een gegronde reden bestaat om aan te nemen dat een restauratie-behoefteraming niet is opgesteld volgens
      de methode, bedoeld in [artikel 4, derde lid][ref1], dan wel dat daarin onjuiste of onvolledige gegevens zijn
      verstrekt en de verstrekking van deze gegevens tot een onjuiste vaststelling zou hebben geleid, kan in geval van
      een budgethoudende gemeente de vaststelling van het budget worden geweigerd, en kan in geval van een provincie die
      restauratie-behoefteraming buiten de vaststelling van het budget worden gehouden.

      4 Een restauratie-behoefteraming die ouder is dan vier jaren wordt niet betrokken bij de vaststelling van het
      budget.


      [ref1]: https://wetten.overheid.nl/BWBR0008615#Artikel4
    url: https://wetten.overheid.nl/BWBR0008615/2003-06-18#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008615
        artikel: '4'
        hoofdstuk: '3'
  - number: '9'
    text: |-
      1 Onze minister kan vastgestelde budgetten verhogen, met inachtneming van [artikel 5, derde of vierde lid][ref1].

      2 Onze minister kan vastgestelde budgetten verlagen:

      a. voor zover de vaststelling onjuist was;

      b. voor zover veranderde omstandigheden of gewijzigde inzichten zich in overwegende mate tegen ongewijzigde
      handhaving van de hoogte van de budgetten verzetten.


      [ref1]: https://wetten.overheid.nl/BWBR0008615#Artikel5
    url: https://wetten.overheid.nl/BWBR0008615/2003-06-18#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008615
        artikel: '5'
        hoofdstuk: '3'
  - number: '10'
    text: |-
      Ten laste van een budget kunnen tot 1 oktober van het jaar waarop het budget betrekking heeft, aanvragen om
      subsidie als bedoeld in [artikel 2][ref1] worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0008615#Artikel2
    url: https://wetten.overheid.nl/BWBR0008615/2003-06-18#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008615
        artikel: '2'
        hoofdstuk: '2'
  - number: '11'
    text: |-
      1 Het bestuur van een budgethoudende gemeente kan jaarlijks een gemeentelijk restauratie-uitvoeringsprogramma
      vaststellen waarin staat aangegeven welke beschermde monumenten naar zijn oordeel voor subsidie in aanmerking komen
      en in welke volgorde.

      2 Een gemeentelijk restauratie-uitvoeringsprogramma heeft betrekking op de periode van zes jaren waarvoor Onze
      minister budgetten heeft vastgesteld.

      3 Het gemeentebestuur kan wijzigingen aanbrengen in het gemeentelijk restauratie-uitvoeringsprogramma.

      4 Het gemeentebestuur stelt Onze minister terstond op de hoogte van een besluit tot vaststelling van een
      gemeentelijk restauratie-uitvoeringsprogramma of een besluit tot wijziging daarvan.
    url: https://wetten.overheid.nl/BWBR0008615/2003-06-18#Artikel11
  - number: '12'
    text: |-
      1 Het provinciaal bestuur kan jaarlijks voor de binnen de provincie gelegen niet-budgethoudende gemeenten een
      provinciaal restauratie-uitvoeringsprogramma vaststellen waarin staat aangegeven welke beschermde monumenten uit
      die gemeenten en in welke volgorde naar zijn oordeel voor subsidie in aanmerking komen.

      2 De besturen van de gemeenten, bedoeld in het eerste lid, kunnen jaarlijks vóór 1 oktober kenbaar maken welke
      beschermde monumenten naar hun oordeel in het restauratie-uitvoeringsprogramma opgenomen zouden moeten worden en in
      welke volgorde.

      3 De voorbereiding van een provinciaal restauratie-uitvoeringsprogramma vindt plaats volgens de in [afdeling 3:4
      van de Algemene wet bestuursrecht](onbekend) geregelde procedure.

      4 Bij de vaststelling van een provinciaal restauratie-uitvoeringsprogramma wijkt het provinciaal bestuur niet af
      van een volgorde als bedoeld in het tweede lid.

      5 [Artikel 11, tweede, derde en vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008615#Artikel11
    url: https://wetten.overheid.nl/BWBR0008615/2003-06-18#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008615
        artikel: '11'
        hoofdstuk: '4'
  - number: '13'
    text: |-
      1 Op aanvraag van een budgethoudende gemeente betrekt het provinciaal bestuur die gemeente bij het vaststellen van
      het provinciaal restauratie-uitvoeringsprogramma.

      2 Indien een bij een provinciaal restauratie-uitvoeringsprogramma betrokken budgethoudende gemeente vraagt om die
      betrokkenheid op te heffen, vindt de opheffing plaats met ingang van het eerste jaar van de eerst volgende periode
      van vier jaren, bedoeld in [artikel 2, vierde lid][ref1].

      3 Afschrift van een aanvraag als bedoeld in het eerste of tweede lid zenden burgemeester en wethouders aan Onze
      minister.


      [ref1]: https://wetten.overheid.nl/BWBR0008615#Artikel2
    url: https://wetten.overheid.nl/BWBR0008615/2003-06-18#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0008615
        artikel: '2'
        hoofdstuk: '2'
  - number: '14'
    text: |-
      1 De eigenaar dient de aanvraag om subsidie, vergezeld van een restauratieplan en een begroting van de
      restauratiekosten, in bij burgemeester en wethouders van de gemeente waarin het desbetreffende beschermde monument
      is gelegen.

      2 Het restauratieplan bestaat uit:

      a. een beschrijving van de technische staat van het beschermd monument, waarin de gebreken van het beschermd
      monument nauwkeurig vermeld staan;

      b. tekeningen van de bestaande toestand en tekeningen waarop de voorgenomen herstelwerkzaamheden of wijzigingen
      staan aangegeven;

      c. een op de onder *a* bedoelde beschrijving gebaseerd bestek of gebaseerde werkomschrijving per onderdeel van de
      toe te passen constructies, materialen, afwerkingen en kleuren alsmede van de wijze van verwerking daarvan.

      3 De begroting omvat alle kosten van de restauratie, is niet ouder dan 2 jaar en is gespecificeerd in hoeveelheden,
      uren en materialen.
    url: https://wetten.overheid.nl/BWBR0008615/2003-06-18#Artikel14
  - number: '15'
    text: |-
      1 Burgemeester en wethouders van een budgethoudende gemeente zenden de aanvraag, vergezeld van een door hen
      opgestelde berekening van de hoogte van de subsidiabele restauratiekosten binnen acht weken na ontvangst van
      de aanvraag door aan Onze minister. Zij geven daarbij aan of de aanvraag gelet op het gemeentelijk restauratie-
      uitvoeringsprogramma voor inwilliging in aanmerking komt en ten laste van welk voor de gemeente vastgesteld budget
      de subsidie zou moeten worden gebracht.

      2 Burgemeester en wethouders van een niet-budgethoudende gemeente of van een budgethoudende gemeente die de
      aanvraag, bedoeld in [artikel 13, eerste lid][ref1], heeft gedaan, zenden de aanvraag, vergezeld van een door
      burgemeester en wethouders opgestelde berekening van de hoogte van de subsidiabele restauratiekosten binnen acht
      weken na ontvangst van de aanvraag door aan gedeputeerde staten.

      3 Burgemeester en wethouders van een gemeente zonder verordening als bedoeld in [artikel 15][ref2] van de wet
      zenden de aanvraag binnen vier weken door aan gedeputeerde staten.

      4 Gedeputeerde staten zenden de aanvraag, bedoeld in het tweede of derde lid, binnen twee weken na de doorzending
      van de aanvraag door aan Onze minister. Zij geven daarbij aan of de aanvraag gelet op het provinciaal restauratie-
      uitvoeringsprogramma voor inwilliging in aanmerking komt en ten laste van welk voor de provincie vastgesteld budget
      de subsidie zou moeten worden gebracht.

      5 Burgemeester en wethouders alsmede gedeputeerde staten stellen de eigenaar in kennis van een doorzending als
      bedoeld in het eerste, tweede, derde of vierde lid.

      6 Indien de doorzending, bedoeld in de vorige leden, niet binnen het in die leden gestelde aantal weken kan
      plaatsvinden, stellen burgemeester en wethouders, of gedeputeerde staten de eigenaar daarvan in kennis en noemen
      daarbij een redelijke termijn waarbinnen de doorzending wel tegemoet kan worden gezien.


      [ref1]: https://wetten.overheid.nl/BWBR0008615#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0008615#Artikel15
    url: https://wetten.overheid.nl/BWBR0008615/2003-06-18#Artikel15
