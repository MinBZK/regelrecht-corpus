        artikel: '20'
        hoofdstuk: '7'
  - number: '22'
    text: |-
      1 Nadat subsidie is verleend, kan Onze minister aan de eigenaar op basis van door de eigenaar via
      burgemeester en wethouders bij Onze minister ingediende overzichten van gemaakte kosten, die vergezeld gaan
      van de desbetreffende originele rekeningen, voorschotten verstrekken in het jaar of de jaren, bedoeld in
      [artikel 19, eerste lid, onderdeel ][ref1].

      2 Burgemeester en wethouders voegen aan de overzichten, bedoeld in het eerste lid, een verklaring als bedoeld in
      [artikel 23, tweede lid][ref2], toe.


      [ref1]: https://wetten.overheid.nl/BWBR0008615#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0008615#Artikel23
    url: https://wetten.overheid.nl/BWBR0008615/2003-06-18#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0008615
        artikel: '19'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0008615
        artikel: '23'
        hoofdstuk: '8'
  - number: '23'
    text: |-
      1 De restauratie wordt door burgemeester en wethouders begeleid.

      2 De begeleiding houdt in ieder geval in dat burgemeester en wethouders ten minste eenmaal per kwartaal een
      verklaring opstellen betreffende de tot het moment van opstelling verrichte restauratiewerkzaamheden en de daarvoor
      gemaakte kosten.

      3 Burgemeester en wethouders zenden de verklaring, bedoeld in tweede lid, naar Onze minister en in afschrift naar
      de Stichting Nationaal Restauratiefonds.

      4 Indien burgemeester en wethouders aan Onze minister berichten dat zij niet in staat zijn een bepaalde restauratie
      te begeleiden, wordt de restauratie door Onze minister begeleid.

      5 Onze minister kan besluiten om in geval van een restauratie waarvoor specifieke kennis vereist is waarover
      burgemeester en wethouders niet beschikken, in afwijking van het eerste lid de restauratie te begeleiden.
    url: https://wetten.overheid.nl/BWBR0008615/2003-06-18#Artikel23
  - number: '24'
    text: |-
      1 De restauratie wordt begonnen en wordt beëindigd vóór de door Onze minister te bepalen data.

      2 Van het begin en het einde van de restauratie zendt de eigenaar onmiddellijk een mededeling aan burgemeester en
      wethouders en aan de Rijksdienst voor de Monumentenzorg.
    url: https://wetten.overheid.nl/BWBR0008615/2003-06-18#Artikel24
  - number: '25'
    text: |-
      Onze minister kan de eigenaar verplichten:

      a. mee te werken aan een wetenschappelijk onderzoek naar de bouwgeschiedenis van het beschermd monument;

      b. de aanbesteding en de gunning van de restauratie op een door Onze minister te bepalen wijze te doen
      plaatsvinden;

      c. tijdens de restauratie aan de Rijksdienst voor de Monumentenzorg te zenden:

      1°. voor de 15e van elke maand een rapport betreffende de in de voorafgaande maand verrichte werkzaamheden;

      2°. jaarlijks voor 1 april een verslag van de in het voorafgaande kalenderjaar uitgevoerde werkzaamheden, alsmede
      een financiële verantwoording over het afgelopen kalenderjaar;

      d. binnen drie maanden na afloop van de restauratie een door een architect gewaarmerkt volledig stel revisie-
      tekeningen aan de Rijksdienst voor de Monumentenzorg te zenden.
    url: https://wetten.overheid.nl/BWBR0008615/2003-06-18#Artikel25
  - number: '26'
    text: |-
      De eigenaar doet zo spoedig mogelijk schriftelijk mededeling aan Onze minister indien er zich omstandigheden
      voordoen die van invloed kunnen zijn op de subsidieverlening onder overlegging van de relevante stukken.
    url: https://wetten.overheid.nl/BWBR0008615/2003-06-18#Artikel26
  - number: '27'
    text: |-
      1 De eigenaar is verplicht vanaf de aanvang van de restauratie op zijn kosten het beschermd monument te verzekeren
      dan wel verzekerd te houden tegen brand-, storm- en bliksemschade en na afloop van de restauratie daartegen
      verzekerd te houden.

      2 De eigenaar is verplicht voor de duur van de restauratie een Casco-All-Risks verzekering af te sluiten.

      3 Onze minister kan voor door hem vast te stellen categorieën van beschermde monumenten vrijstelling verlenen van
      het eerste lid.

      4 Onze minister verleent op aanvraag aan degene die gemoedsbezwaren heeft tegen de in het eerste en tweede lid
      bedoelde verzekeringen ontheffing van het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0008615/2003-06-18#Artikel27
  - number: '28'
    text: |-
      1 Onze minister kan de eigenaar verplichten het beschermd monument te voorzien van een of meer installaties ter
      voorkoming van brand of blikseminslag ter bescherming van de monumentale waarde van dat beschermd monument.

      2 De eigenaar draagt er zorg voor dat een door Onze minister verplicht gestelde installatie ter voorkoming van
      blikseminslag jaarlijks wordt getest en voorts telkens na onweer voor zover de installatie dat vereist.
    url: https://wetten.overheid.nl/BWBR0008615/2003-06-18#Artikel28
  - number: '29'
    text: |-
      1 De eigenaar is verplicht na afloop van de restauratie het beschermd monument te bewaren en te onderhouden in de
      staat waarin het door de restauratie is gebracht.

      2 De eigenaar van een beschermd monument dat behoort tot een van de categorieën, genoemd in
      [artikel 3, eerste lid, van het Besluit rijkssubsidiëring onderhoud monumenten][ref1] is verplicht na afloop van
      de restauratie gedurende vijf jaren jaarlijks door een deskundige een rapport te laten opstellen van de bouwkundige
      toestand van dat monument.

      3 Onze minister kan de eigenaar verplichten vóór een bepaalde datum een onderhoudsplan op te stellen en aan
      Onze minister toe te zenden. Het onderhoudsplan dient gebaseerd te zijn op een bouwkundig inspectierapport en
      gedetailleerd inzicht te geven in de voorgenomen onderhoudswerkzaamheden over een periode van 10 jaren alsmede in
      de kosten daarvan.

      4 Onze minister kan op aanvraag ontheffing verlenen van de verplichting, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004654#Artikel3
    url: https://wetten.overheid.nl/BWBR0008615/2003-06-18#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0004654
        artikel: '3'
  - number: '30'
    text: |-
      1 Indien de eigenaar zijn recht op het beschermd monument ten behoeve waarvan een subsidie is verstrekt,
      overdraagt, is hij gehouden ten behoeve van de Staat van zijn rechtsopvolger te bedingen dat deze de
      verplichtingen, vastgesteld bij of krachtens dit besluit, zal nakomen, met dien verstande dat, ingeval de
      overdracht plaatsvindt na de vaststelling van de subsidie, met oplegging van de verplichting tot nakoming van de
      verplichtingen, vastgesteld bij of krachtens de[artikelen 27 tot en met 30][ref1] kan worden volstaan.

      2 In het geval, bedoeld in het eerste lid, bedingt de eigenaar tevens ten behoeve van de Staat dat zijn
      rechtsopvolger bij niet-nakoming van het beding, bedoeld in het eerste lid, als boete het bedrag verschuldigd is
      dat Onze minister als subsidie heeft verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0008615#Artikel27
    url: https://wetten.overheid.nl/BWBR0008615/2003-06-18#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0008615
        artikel: '27'
        hoofdstuk: '9'
  - number: '31'
    text: |-
      1 Binnen drie maanden na afloop van de restauratie dient de eigenaar in tweevoud een aanvraag tot vaststelling van
      de subsidie in bij burgemeester en wethouders.

      2 Bij de aanvraag tot subsidievaststelling legt de eigenaar, gerelateerd aan de ingediende begroting, rekening en
      verantwoording af onder overlegging van de desbetreffende originele rekeningen en bewijzen van betaling.

      3 Indien rekeningen en bewijzen van betaling betrekking hebben op kosten van personeel dat in loondienst is bij de
      eigenaar, is de aanvraag tot subsidievaststelling tevens vergezeld van een verklaring van een registeraccountant
      of een accountant-administratieconsulent waaruit blijkt hoeveel uren door dat personeel is besteed aan subsidiabele
      werkzaamheden.

      4 De aanvraag tot subsidievaststelling kan geen kosten bevatten die niet reeds bij de verlening als subsidiabele
      restauratiekosten zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008615/2003-06-18#Artikel31
  - number: '32'
    text: |-
      1 Burgemeester en wethouders zenden de aanvraag tot subsidievaststelling, vergezeld van:

      a. een door hen opgestelde berekening van de werkelijk gemaakte subsidiabele restauratiekosten; en

      b. een verklaring waaruit blijkt dat het werk naar behoren is uitgevoerd; binnen acht weken na ontvangst van de
      aanvraag door aan Onze minister.

      2 Burgemeester en wethouders van een gemeente zonder verordening als bedoeld in [artikel 15][ref1] van de wet
      zenden de aanvraag binnen twee weken na ontvangst van de aanvraag door aan Onze minister.

      3 [Artikel 15, vijfde en zesde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008615#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0008615#Artikel15
    url: https://wetten.overheid.nl/BWBR0008615/2003-06-18#Artikel32
