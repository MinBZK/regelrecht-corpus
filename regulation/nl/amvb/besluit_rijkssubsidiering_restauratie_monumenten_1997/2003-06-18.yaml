  - number: '36'
    text: |-
      Onze minister kan artikelen van dit besluit buiten toepassing laten of daarvan afwijken voor zover toepassing gelet
      op het belang dat dit besluit beoogt te beschermen zal leiden tot een onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0008615/2003-06-18#Artikel36
  - number: '37'
    text: |-
      1 Burgemeester en wethouders van een gemeente zonder verordening als bedoeld in [artikel 15][ref1] van de wet
      behoeven geen berekening als bedoeld in [artikel 15][ref2], eerste en twee lid, en 32, eerste lid, onderdeel *a*,
      op te stellen; op hen zijn de[artikelen 23][ref3] en [32, eerste lid, onderdeel ][ref4], niet van toepassing.

      2 Ingeval van een gemeente zonder verordening als bedoeld in [artikel 15][ref5] van de wet geschiedt de begeleiding
      van een restauratie door Onze minister.


