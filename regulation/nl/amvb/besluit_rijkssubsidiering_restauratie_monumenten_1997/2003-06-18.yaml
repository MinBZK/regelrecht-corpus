  - number: '44'
    text: |-
      1 In het provinciaal restauratie-uitvoeringsprogramma voor de jaren 1998–2002 worden in ieder geval uit elke niet-
      budgethoudende gemeente beschermde monumenten betrokken voorzover de beschikbare budgetten voor die jaren gevoed
      zijn met dat gedeelte van de voor de gemeente op grond van artikel 5 van het Besluit rijkssubsidiëring restauratie
      monumenten berekende budgetten, als bedoeld in [artikel 43, tweede lid][ref1].

      2 Een eigenaar wiens restauratieproject voorkomt op een meerjarenprogramma als bedoeld in artikel 3 van het Besluit
      rijkssubsidiëring restauratie monumenten voor de jaren 1997–2002 maar niet voorkomt op een provinciaal restauratie-
      uitvoeringsprogramma voor die jaren, wordt hiervan terstond door de provincie in kennis gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008615#Artikel43
