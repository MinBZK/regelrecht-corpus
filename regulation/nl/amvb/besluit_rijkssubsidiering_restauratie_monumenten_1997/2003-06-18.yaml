  - number: '41'
    text: |-
      1 Het Besluit rijkssubsidiëring restauratie monumenten wordt ingetrokken met dien verstande dat de
      subsidieverlening in het jaar 1997 alsmede de vaststelling van een subsidie, toegezegd op basis van dat besluit,
      plaatsvindt overeenkomstig dat besluit.

      2 Indien de aanvraag om subsidie, bedoeld in [artikel 14][ref1], wordt ingediend na de inwerkingtreding van dit
      besluit, wordt, ingeval de beslissing een subsidieverlening inhoudt, het subsidiebedrag berekend op basis van de
      percentages, genoemd in [artikel 17][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008615#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0008615#Artikel17
