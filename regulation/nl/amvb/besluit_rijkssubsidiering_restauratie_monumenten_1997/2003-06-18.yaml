        bwb_id: BWBR0005537
        artikel: 4:34
  - number: '4'
    text: |-
      1 Burgemeester en wethouders kunnen eenmaal per vier jaar een restauratie-behoefteraming bij Onze minister indienen
      vóór 1 mei van enig jaar.

      2 Een restauratie-behoefteraming bestaat uit een inventarisatie van alle restauraties die binnen een gemeente
      uitvoering behoeven.

      3 De inventarisatie, bedoeld in het tweede lid, wordt opgesteld volgens een door Onze minister nader voor te
      schrijven methode waarbij categorieën van monumenten en soorten van restauratie kunnen worden onderscheiden.

      4 In een restauratie-behoefteraming worden betrokken de monumenten die naar de stand van 1 januari 1997 dan wel
      telkens vier jaar later in het register, bedoeld in [artikel 6, van de wet][ref1] zijn opgenomen, met uitzondering
      van de monumenten die eigendom zijn van de Staat.


      [ref1]: https://wetten.overheid.nl/BWBR0004471#Artikel6
    url: https://wetten.overheid.nl/BWBR0008615/2003-06-18#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004471
        artikel: '6'
  - number: '5'
    text: |-
      1 Onze minister stelt jaarlijks vóór 1 oktober ten behoeve van de budgethoudende gemeenten op basis van hun
      restauratie-behoefteraming het budget vast.

      2 Onze minister stelt jaarlijks vóór 1 oktober ten behoeve van de provincies op basis van de restauratie-
      behoefteramingen van de niet-budgethoudende gemeenten het budget vast.

      3 Het budget, bedoeld in het eerste lid, wordt berekend door de verhouding van het aantal restauratie-eenheden
      in een gemeente tot het landelijk gemeten aantal restauratie-eenheden te vermenigvuldigen met het bedrag dat
      Onze minister voor de toepassing van dit besluit ten laste van de begroting van het zesde jaar, bedoeld in
      [artikel 6][ref1], wil brengen.

      4 Het budget, bedoeld in het tweede lid, wordt berekend door de verhouding van de som van het aantal restauratie-
      eenheden van de gemeenten, bedoeld in het tweede lid, tot het landelijk gemeten aantal restauratie-eenheden te
      vermenigvuldigen met het bedrag dat Onze minister voor de toepassing van dit besluit ten laste van de begroting van
      het zesde jaar, bedoeld in [artikel 6][ref2], wil brengen.

      5 Een restauratie-eenheid als bedoeld in het derde en vierde lid is een getal per monument dat ontstaat door van
      elke door Onze minister te onderscheiden werkzaamheid het geïnventariseerde aantal te vermenigvuldigen met de door
      Onze minister voor de door hem te onderscheiden werkzaamheden vast te stellen normgetallen.


      [ref1]: https://wetten.overheid.nl/BWBR0008615#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008615#Artikel6
    url: https://wetten.overheid.nl/BWBR0008615/2003-06-18#Artikel5
    references:
      - id: ref1
