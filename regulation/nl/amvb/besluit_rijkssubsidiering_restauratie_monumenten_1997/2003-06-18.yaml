  - number: '39'
    text: |-
      1 Onze Minister stelt in 1997 voor de verstrekking van subsidie als bedoeld in [artikel 38][ref1]:

      a. ten behoeve van woonhuizen en boerderijen 25 miljoen gulden beschikbaar;

      b. ten behoeve van kerken 15 miljoen beschikbaar; en

      c. ten behoeve van overige monumenten 10 miljoen gulden beschikbaar.

      2 Een subsidie als bedoeld in [artikel 38][ref2] wordt geweigerd voor zover door verstrekking van subsidie aan
      woonhuizen en boerderijen, aan kerken, of aan overige monumenten het daarvoor in het eerste lid genoemde bedrag zou
      worden overschreden.

      3 Indien na de beslissing op de aanvragen om subsidie als bedoeld in [artikel 38][ref3] het beschikbare bedrag,
      bedoeld in het eerste lid, onderdelen *a*, *b* of *c*, niet geheel besteed is, besteedt Onze minister het restant
      ten behoeve van aanvragen om subsidie die op grond van het tweede lid zouden worden geweigerd.


      [ref1]: https://wetten.overheid.nl/BWBR0008615#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0008615#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0008615#Artikel38
