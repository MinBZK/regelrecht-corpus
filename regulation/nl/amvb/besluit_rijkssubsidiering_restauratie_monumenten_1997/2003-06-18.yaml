  - number: '3'
    text: |-
      Subsidie wordt in ieder geval niet verstrekt:

      a. voor zover in de subsidiabele restauratiekosten subsidie is verstrekt op grond van een andere
      rijkssubsidieregeling;

      b. voor zover de subsidiabele restauratiekosten op grond van de [Wet op de omzetbelasting][ref1] op verschuldigde
      belasting in aftrek kunnen worden gebracht;

      c. indien de vergunning, bedoeld in [artikel 11][ref2] van de wet, niet is verleend;

      d. indien met de restauratie is begonnen voordat Onze minister de subsidiabele restauratiekosten heeft vastgesteld;

      e. ten behoeve van de restauratie van archeologische monumenten.


      [ref1]: https://wetten.overheid.nl/BWBR0002629
      [ref2]: https://wetten.overheid.nl/BWBR0008615#Artikel11
