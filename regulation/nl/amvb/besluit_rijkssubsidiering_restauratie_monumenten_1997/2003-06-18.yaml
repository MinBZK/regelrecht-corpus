  - number: '18'
    text: |-
      Onze minister beslist op de aanvraag binnen redelijke termijn na de doorzending van de aanvraag door burgemeester
      en wethouders of door gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0008615/2003-06-18#Artikel18
  - number: '19'
    text: |-
      1 Indien de beschikking een subsidieverlening inhoudt, vermeldt Onze minister daarin:

      a. de door hem vastgestelde subsidiabele restauratiekosten;

      b. het jaar of de jaren waarin de subsidie kan worden bevoorschot;

      c. het jaar of de jaren waarin de subsidie kan worden betaald.

      2 Indien de beschikking een afwijzing inhoudt, vermeldt Onze minister daarin de door hem vastgestelde subsidiabele
      restauratiekosten.

      3 Afschrift van de beschikking, bedoeld in het eerste en tweede lid, zendt Onze minister aan burgemeester en
      wethouders, aan gedeputeerde staten en aan de Stichting Nationaal Restauratiefonds.
    url: https://wetten.overheid.nl/BWBR0008615/2003-06-18#Artikel19
  - number: '20'
    text: |-
      De eigenaar aan wie een subsidie is verleend, komt in aanmerking voor een door de Stichting Nationaal
      Restauratiefonds te verstrekken hypothecaire geldlening ten behoeve van de restauratie onder door die stichting te
      bepalen voorwaarden, tenzij de subsidie is verleend met toepassing van [artikel 17, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008615#Artikel17
    url: https://wetten.overheid.nl/BWBR0008615/2003-06-18#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0008615
        artikel: '17'
        hoofdstuk: '6'
  - number: '21'
    text: |-
      1 Het budget van de budgethoudende gemeente of de provincie, waarin het beschermd monument ten behoeve waarvan
      een subsidie is verleend, is gelegen, wordt verminderd met het bedrag van de subsidie dat de beschikking tot
      subsidieverlening vermeldt.

      2 Indien de eigenaar voor de in [artikel 20][ref1] bedoelde hypothecaire geldlening in aanmerking komt, wordt het
      desbetreffende budget van de budgethoudende gemeente of de provincie tevens verminderd met een bedrag ter grootte
      van 30% van de subsidiabele restauratiekosten.

      3 Indien het desbetreffende budget van de budgethoudende gemeente of de provincie niet toereikend is om ten laste
      daarvan zowel een subsidie, vastgesteld volgens dit besluit, als het bedrag ten behoeve van een hypothecaire
      geldlening als bedoeld in [artikel 20][ref2] te brengen, stelt Onze minister de te verlenen subsidie alsmede het
      bedrag ten behoeve van de hypothecaire geldlening in hun onderlinge verhouding lager vast, zodat de som van beide
      bedragen gelijk is aan dat budget.


      [ref1]: https://wetten.overheid.nl/BWBR0008615#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0008615#Artikel20
    url: https://wetten.overheid.nl/BWBR0008615/2003-06-18#Artikel21
    references:
      - id: ref1
