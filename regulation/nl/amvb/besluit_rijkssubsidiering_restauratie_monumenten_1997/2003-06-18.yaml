  - number: '38'
    text: |-
      1 Onverminderd [artikel 41][ref1] kan Onze minister in het jaar 1997 aan de eigenaar van een beschermd monument
      waarvan het casco zich naar het oordeel van Onze minister in een zodanig slechte staat bevindt dat het voortbestaan
      van dat monument in gevaar is, subsidie verstrekken in de subsidiabele restauratiekosten van dat monument.

      2 Indien met het aantal aanvragen dat ingevolge het eerste lid voor subsidie in aanmerking komt totale bedragen
      gemoeid zijn die de in [artikel 39][ref2] voor de desbetreffende categorieën van monumenten gereserveerde
      subsidiegelden overtreffen, houdt Onze minister bij de beslissing op die aanvragen rekening met de bestemming die
      aan de te restaureren monumenten wordt toegekend.

      3 Indien met het aantal aanvragen dat na toetsing aan het tweede lid voor subsidie in aanmerking komt totale
      bedragen gemoeid zijn die de in [artikel 39][ref3] voor de desbetreffende categorieën van monumenten gereserveerde
      subsidiegelden overtreffen, houdt Onze minister bij de beslissing op die aanvragen rekening met de te verwachten
      investeringseffecten, verbonden aan de verstrekking van subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0008615#Artikel41
