  - number: '42'
    text: |-
      In afwijking van [artikel 1, tweede lid][ref1], wordt het aantal beschermde monumenten dat op 1 januari 2001 in
      een gemeente gelegen is, eenmalig aangevuld met het aantal monumenten dat voor 1 januari 2001 in het kader van
      het Monumenten Selectie Project door de gemeente voor aanwijzing als beschermd monument bij Onze minister is
      voorgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0008615#Artikel1
    url: https://wetten.overheid.nl/BWBR0008615/2003-06-18#Artikel42
    references:
