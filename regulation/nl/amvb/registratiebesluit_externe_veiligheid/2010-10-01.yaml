  - number: '5'
    text: |-
      Als transportroutes als bedoeld in [artikel 12.12, tweede lid, van de wet][ref1] worden aangewezen transportroutes
      waarvan het plaatsgebonden risico voor wegen en spoorlijnen op de as van de transportroute, of voor vaarwegen op de
      oever, hoger is dan 10-6 per jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel12.12
    url: https://wetten.overheid.nl/BWBR0020724/2010-10-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '12.12'
  - number: '6'
    text: |-
      1 Als buisleidingen als bedoeld in [artikel 12.12, tweede lid, van de wet][ref1] worden aangewezen:

      a. aardgasleidingen met een uitwendige diameter van meer dan 50 mm en een druk van meer dan 1600 kPa;

      b. buisleidingen voor het vervoer van brandbare vloeistoffen van de categorieën K1, K2 of K3, met een uitwendige
      diameter van meer dan 100 mm;

      c. buisleidingen voor andere gevaarlijke stoffen dan bedoeld onder a en b, waarvoor het plaatsgebonden risico op
      een afstand van 5 m gemeten vanaf het hart van de buisleiding hoger is dan 10-6 per jaar.

      2 Onze Minister is bevoegd gezag voor andere buisleidingen dan bedoeld in
      [artikel 12.11, eerste lid, onderdeel a, onder 8°, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel12.12
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel12.11
