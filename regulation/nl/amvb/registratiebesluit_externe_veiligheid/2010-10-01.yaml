preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 28 maart
    2006, nr. DJZ2005203937, Directie Juridische Zaken, afdeling Wetgeving, gedaan in overeenstemming met Onze Minister
    van Verkeer en Waterstaat en Onze Minister van Economische Zaken;

    Gelet op de artikelen 12.11, tweede lid, 12.12, tweede, vierde en vijfde lid, en 12.13, tweede en derde lid, 12.16,
    derde lid, en 21.8 van de Wet milieubeheer;

    De Raad van State gehoord (advies van 24 mei 2006, nr. W08.06.0083/V);

    Gezien het nader rapport van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van
    22 november 2006, nr. DJZ 2006290246, Directie Juridische Zaken, afdeling Wetgeving, uitgebracht in overeenstemming
    met Onze Minister van Verkeer en Waterstaat en Onze Minister van Economische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0020724/2010-10-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0020724/2010-10-01#Artikel1
  - number: 1.1.a
    text: |-
      bestrijdingsmiddel: gewasbeschermingsmiddelen of biociden als bedoeld in
      [artikel 1, eerste lid, van de Wet gewasbeschermingsmiddelen en biociden][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel1
    url: https://wetten.overheid.nl/BWBR0020724/2010-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '1'
  - number: 1.1.b
    text: |-
      gevaarlijke afvalstof: afvalstof als bedoeld in
      [artikel 3, eerste lid, van de Regeling Europese afvalstoffenlijst][ref1], voor zover die afvalstof een of meer
      eigenschappen, genoemd in [artikel 4, tweede lid, onderdelen a tot en met c, e en f, van die regeling][ref2] bezit;


      [ref1]: https://wetten.overheid.nl/BWBR0013546#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013546#Artikel4
    url: https://wetten.overheid.nl/BWBR0020724/2010-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013546
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013546
        artikel: '4'
  - number: 1.1.c
    text: |-
      groepsrisico: cumulatieve kansen per jaar dat ten minste 10, 100 of 1000 personen overlijden als rechtstreeks
      gevolg van hun aanwezigheid in het invloedsgebied van een inrichting, een transportroute of een buisleiding en een
      ongewoon voorval binnen die inrichting, op die transportroute of met die buisleiding waarbij een gevaarlijke stof
      betrokken is;
    url: https://wetten.overheid.nl/BWBR0020724/2010-10-01#Artikel1
  - number: 1.1.d
    text: |-
      invloedsgebied: gebied waarin volgens door Onze Minister bij ministeriële regeling op grond van
      [artikel 15, eerste lid, van het Besluit externe veiligheid inrichtingen][ref1] personen worden meegeteld voor de
      berekening van het groepsrisico;


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel15
    url: https://wetten.overheid.nl/BWBR0020724/2010-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '15'
  - number: 1.1.e
    text: |-
      opslag in verband met vervoer van gevaarlijke stoffen: opslag in verband met vervoer van gevaarlijke stoffen als
      bedoeld in [artikel 1, onderdeel c, van het Besluit risico’s zware ongevallen 1999][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010475#Artikel1
    url: https://wetten.overheid.nl/BWBR0020724/2010-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0010475
        artikel: '1'
  - number: 1.1.f
    text: |-
      plaatsgebonden risico: risico op een plaats buiten een inrichting, een transportroute of een buisleiding,
      uitgedrukt als de kans per jaar dat een persoon die onafgebroken en onbeschermd op die plaats zou verblijven,
      overlijdt als rechtstreeks gevolg van een ongewoon voorval binnen die inrichting, op die transportroute of met die
      buisleiding, waarbij een gevaarlijke stof betrokken is;
    url: https://wetten.overheid.nl/BWBR0020724/2010-10-01#Artikel1
  - number: 1.1.g
    text: |-
      categorie K1: een product niet zijnde een brandbaar gas met een vlampunt dat, bepaald met het toestel van Abel-
      Pensky, bij een druk van 100 kPa lager is dan 21°C;
    url: https://wetten.overheid.nl/BWBR0020724/2010-10-01#Artikel1
  - number: 1.1.h
    text: |-
      categorie K2: een product met een vlampunt dat, bepaald met het toestel van Abel-Pensky, bij een druk van 100 kPa
      ligt tussen de 21°C en 55°C;
    url: https://wetten.overheid.nl/BWBR0020724/2010-10-01#Artikel1
  - number: 1.1.i
    text: |-
      categorie K3: een product met een vlampunt dat, bepaald met het toestel van Pensky-Martens, bij een druk van 100
      kPa hoger is dan 55°C en lager is dan 100°C;
    url: https://wetten.overheid.nl/BWBR0020724/2010-10-01#Artikel1
  - number: 1.1.j
    text: |-
      maatgevende stof of maatgevende categorie van stoffen: gevaarlijke stof of categorie van gevaarlijke stoffen
      die door zijn gevaarseigenschappen in combinatie met de hoeveelheid die van die stof of van die categorie in een
      inrichting aanwezig mag zijn, meer dan alle andere voor die inrichting vergunde gevaarlijke stoffen bepalend is
      voor de ligging van de 10-6 per jaar contour voor het plaatsgebonden risico van die inrichting;
    url: https://wetten.overheid.nl/BWBR0020724/2010-10-01#Artikel1
  - number: 1.1.k
    text: |-
      register: register als bedoeld in [artikel 12.12 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel12
    url: https://wetten.overheid.nl/BWBR0020724/2010-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '12'
  - number: 1.1.l
    text: |-
      bijlage A van het ADR: de door Onze Minister ingevolge [artikel 5.4.1 van het Vuurwerkbesluit][ref1] aangewezen
      of bekendgemaakte vertaling van bijlage A bij de op 30 september 1957 te Genève tot stand gekomen Europese
      Overeenkomst betreffende het internationale vervoer van gevaarlijke goederen over de weg (Trb. 1959, 171);


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel5
    url: https://wetten.overheid.nl/BWBR0020724/2010-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '5'
  - number: 1.1.m
    text: |-
      wet: [Wet milieubeheer][ref1].

      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0020724/2010-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '1.2'
    text: |-
      Voor de berekening van het groepsrisico en het plaatsgebonden risico van inrichtingen en spoorwegemplacementen als
      bedoeld in [artikel 2 van het Besluit externe veiligheid inrichtingen][ref1] alsmede voor de wijze van toepassing
      van de afstanden waarbij wordt voldaan aan het plaatsgebonden risico, indien deze afstanden door Onze Minister zijn
      voorgeschreven op grond van het [Besluit externe veiligheid inrichtingen][ref2], zijn de daarvoor krachtens het
      [Besluit externe veiligheid inrichtingen][ref3] vastgestelde regels van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0016767
      [ref3]: https://wetten.overheid.nl/BWBR0016767
    url: https://wetten.overheid.nl/BWBR0020724/2010-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0016767
      - id: ref3
        bwb_id: BWBR0016767
  - number: '2'
    text: |-
      Als gevaarlijke stoffen als bedoeld in [artikel 12.11, tweede lid, van de wet][ref1] worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel12
    url: https://wetten.overheid.nl/BWBR0020724/2010-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '12'
  - number: 2.a
    text: |-
      de in [bijlage I, deel 1, van het Besluit risico’s zware ongevallen 1999][ref1] onder de nummers 2a tot en met 2d
      en 15 genoemde stoffen;


      [ref1]: https://wetten.overheid.nl/BWBR0010475
    url: https://wetten.overheid.nl/BWBR0020724/2010-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0010475
  - number: 2.b
    text: distikstofoxide;
    url: https://wetten.overheid.nl/BWBR0020724/2010-10-01#Artikel2
  - number: 2.c
    text: bestrijdingsmiddelen;
    url: https://wetten.overheid.nl/BWBR0020724/2010-10-01#Artikel2
  - number: 2.d
    text: gevaarlijke afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0020724/2010-10-01#Artikel2
  - number: '3'
    text: |-
      Als inrichtingen als bedoeld in [artikel 12.12, tweede lid, van de wet][ref1] worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel12
    url: https://wetten.overheid.nl/BWBR0020724/2010-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '12'
  - number: 3.a
    text: |-
      inrichtingen waarop het [Besluit risico’s zware ongevallen 1999][ref1] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0010475
    url: https://wetten.overheid.nl/BWBR0020724/2010-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0010475
  - number: 3.b
    text: |-
      inrichtingen bestemd voor de opslag in verband met het vervoer van gevaarlijke stoffen als
      bedoeld in [artikel 1, onderdeel c, van het Besluit risico’s zware ongevallen 1999][ref1], waar
      gevaarlijke stoffen als bedoeld in [bijlage I van het Besluit risico’s zware ongevallen 1999][ref2]
      worden opgeslagen in hoeveelheden groter dan de in
      [kolom 2 van de delen 1 onderscheidenlijk 2 van bijlage I van het Besluit risico’s zware ongevallen 1999][ref3]
      genoemde hoeveelheden;


      [ref1]: https://wetten.overheid.nl/BWBR0010475#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0010475
      [ref3]: https://wetten.overheid.nl/BWBR0010475
    url: https://wetten.overheid.nl/BWBR0020724/2010-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0010475
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0010475
      - id: ref3
        bwb_id: BWBR0010475
  - number: 3.c
    text: |-
      door Onze Minister krachtens [artikel 2 van het Besluit externe veiligheid inrichtingen][ref1] aangewezen
      spoorwegemplacementen die gebruikt worden voor het rangeren van wagons met gevaarlijke stoffen;


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel2
    url: https://wetten.overheid.nl/BWBR0020724/2010-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '2'
  - number: 3.d
    text: |-
      andere door Onze Minister krachtens [artikel 2 van het Besluit externe veiligheid inrichtingen][ref1] aangewezen
      categorieën van inrichtingen dan de inrichtingen, bedoeld in de onderdelen a tot en met c, waarvan het
      plaatsgebonden risico, berekend volgens bij die regeling gestelde regels, hoger is of kan zijn dan 10-6 per jaar,
      niet zijnde inrichtingen waarvoor regels gelden krachtens [artikel 8.40 van de wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0020724/2010-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 3.e
    text: |-
      LPG-tankstations als bedoeld in
      [artikel 1, eerste lid, onderdeel b, van het Besluit LPG-tankstations milieubeheer][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004327#Artikel1
    url: https://wetten.overheid.nl/BWBR0020724/2010-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004327
        artikel: '1'
  - number: 3.f
    text: |-
      inrichtingen waar verpakte gevaarlijke afvalstoffen, of verpakte gevaarlijke stoffen, niet zijnde nitraathoudende
      kunstmeststoffen groep 2 als bedoeld in PGS 7, verpakte gevaarlijke afvalstoffen of verpakte bestrijdingsmiddelen
      worden opgeslagen in een hoeveelheid van meer dan 10 000 kg per opslagvoorziening, niet zijnde een inrichting als
      bedoeld in onderdeel a of d, indien:
    url: https://wetten.overheid.nl/BWBR0020724/2010-10-01#Artikel3
  - number: 3.f.1
    text: brandbare gevaarlijke stoffen met fluor-, chloor-, stikstof- of zwavelhoudende verbindingen worden opgeslagen, of
    url: https://wetten.overheid.nl/BWBR0020724/2010-10-01#Artikel3
  - number: 3.f.2
    text: |-
      binnen een opslagvoorziening zowel brandbare gevaarlijke stoffen als gevaarlijke stoffen met fluor-, chloor-,
      stikstof- of zwavelhoudende verbindingen worden opgeslagen;
    url: https://wetten.overheid.nl/BWBR0020724/2010-10-01#Artikel3
  - number: 3.g
    text: |-
      inrichtingen waarin een koel- of vriesinstallatie aanwezig is met een hoeveelheid van meer dan 1500 kg ammoniak,
      niet zijnde een inrichting als bedoeld in onderdeel a, d of h;
    url: https://wetten.overheid.nl/BWBR0020724/2010-10-01#Artikel3
  - number: 3.h
    text: |-
      andere door Onze Minister krachtens [artikel 2 van het Besluit externe veiligheid inrichtingen][ref1] aangewezen
      categorieën van inrichtingen dan de inrichtingen, bedoeld in de onderdelen e tot en met g, en [artikel 4][ref2],
      waarvan het plaatsgebonden risico, berekend volgens bij [die regeling][ref3] gestelde regels, hoger is of kan zijn
      dan 10-6 per jaar, niet zijnde inrichtingen waarvoor regels gelden krachtens [artikel 8.40 van de wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020724#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0016767
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0020724/2010-10-01#Artikel3
    references:
