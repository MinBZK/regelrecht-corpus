  - number: '11'
    text: |-
      1 Onverminderd [artikel 8][ref1] bevat het register ten aanzien van buisleidingen aangewezen ingevolge de
      [artikelen 6][ref2] en [7][ref3] tevens de volgende gegevens:

      a. indien beschikbaar het groepsrisico van de buisleidingen, uitgedrukt in een grafiek met op de horizontale as het
      aantal dodelijke slachtoffers per kilometer lengte van de buisleiding en op de verticale as de cumulatieve kansen
      per jaar op ten minste dat aantal slachtoffers;

      b. de eventuele naam of aanduiding waaronder de buisleidingen bekend zijn;

      c. de naam van de eigenaar en de eventuele gebruikers van de buisleiding;

      d. de uitwendige diameter van de buisleiding in millimeters;

      e. de maximale werkdruk uitgedrukt in kiloPascal;

      f. de wanddikte van de buis in millimeters en

      g. de ligging van de bovenkant van de buisleiding ten opzichte van het maaiveld, in centimeters.

      2 [Artikel 9, eerste lid, onderdelen d en e][ref4], is van overeenkomstige toepassing op buisleidingen aangewezen
      ingevolge de [artikelen 6][ref5] en [7][ref6].


