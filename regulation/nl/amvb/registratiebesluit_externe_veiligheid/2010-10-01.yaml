  - number: '16.3'
    text: |-
      In afwijking van [artikel 15, eerste lid][ref1], vindt verstrekking aan het RIVM van gegevens als
      bedoeld in [artikel 8][ref2], voor inrichtingen als bedoeld in [artikel 3, onderdeel f][ref3], en
      [artikel 4, onderdelen b, d en e][ref4], indien voor die inrichtingen ten tijde van het in werking treden van dit
      besluit de gegevens als bedoeld in [artikel 8][ref5] niet ingevolge een wettelijk voorschrift beschikbaar zijn of
      behoren te zijn, plaats binnen twaalf maanden na het in werking treden van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0020724#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0020724#Artikel8
