  - number: '9'
    text: |-
      1 Onverminderd [artikel 8][ref1] bevat het register ten aanzien van inrichtingen aangewezen ingevolge de
      [artikelen 3][ref2], [4][ref3] en [7, eerste lid][ref4], tevens de volgende gegevens:

      a. de bedrijfsnaam;

      b. het adres, de kadastrale aanduiding en de ligging van de aangewezen inrichtingen;

      c. de datum waarop de voor de risico’s relevante geldende vergunning is verleend of laatstelijk is gewijzigd;

      d. de aard van het risico;

      e. de chemische naam en het CAS-nummer en voor zover bekend het UN-nummer van de voor het risico maatgevende stof
      of de naam van de voor het risico maatgevende categorie van stoffen en

      f. indien beschikbaar het groepsrisico uitgedrukt in een grafiek met op de horizontale as het aantal dodelijke
      slachtoffers en op de verticale as de cumulatieve kansen per jaar op ten minste dat aantal slachtoffers of de
      gemiddelde bevolkingsdichtheid binnen het invloedsgebied rondom de desbetreffende inrichting.

      2 Ten aanzien van inrichtingen als bedoeld in [artikel 4, onderdeel g][ref5], bevat het register de ligging van de
      zones waar beperkingen gelden voor de bebouwing of de aanwezigheid van personen.


