    text: |-
      Als gevaarlijke stoffen als bedoeld in [artikel 12.11, tweede lid, van de wet][ref1] worden aangewezen:

      a. de in [bijlage I, deel 1, van het Besluit risico’s zware ongevallen 1999][ref2] onder de nummers 2a tot en met
      2d en 15 genoemde stoffen;

      b. distikstofoxide;

      c. bestrijdingsmiddelen;

      d. gevaarlijke afvalstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel12.11
      [ref2]: https://wetten.overheid.nl/BWBR0010475
