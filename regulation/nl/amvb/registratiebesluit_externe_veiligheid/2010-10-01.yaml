preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 28 maart
    2006, nr. DJZ2005203937, Directie Juridische Zaken, afdeling Wetgeving, gedaan in overeenstemming met Onze Minister
    van Verkeer en Waterstaat en Onze Minister van Economische Zaken;

    Gelet op de artikelen 12.11, tweede lid, 12.12, tweede, vierde en vijfde lid, en 12.13, tweede en derde lid, 12.16,
    derde lid, en 21.8 van de Wet milieubeheer;

    De Raad van State gehoord (advies van 24 mei 2006, nr. W08.06.0083/V);

    Gezien het nader rapport van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van
    22 november 2006, nr. DJZ 2006290246, Directie Juridische Zaken, afdeling Wetgeving, uitgebracht in overeenstemming
    met Onze Minister van Verkeer en Waterstaat en Onze Minister van Economische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0020724/2010-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. bestrijdingsmiddel: gewasbeschermingsmiddelen of biociden als bedoeld in
      [artikel 1, eerste lid, van de Wet gewasbeschermingsmiddelen en biociden][ref1].

      b. gevaarlijke afvalstof: afvalstof als bedoeld in
      [artikel 3, eerste lid, van de Regeling Europese afvalstoffenlijst][ref2], voor zover die afvalstof een of meer
      eigenschappen, genoemd in [artikel 4, tweede lid, onderdelen a tot en met c, e en f, van die regeling][ref3] bezit;

      c. groepsrisico: cumulatieve kansen per jaar dat ten minste 10, 100 of 1000 personen overlijden als rechtstreeks
      gevolg van hun aanwezigheid in het invloedsgebied van een inrichting, een transportroute of een buisleiding en een
      ongewoon voorval binnen die inrichting, op die transportroute of met die buisleiding waarbij een gevaarlijke stof
      betrokken is;

      d. invloedsgebied: gebied waarin volgens door Onze Minister bij ministeriële regeling op grond van
      [artikel 15, eerste lid, van het Besluit externe veiligheid inrichtingen][ref4] personen worden meegeteld voor de
      berekening van het groepsrisico;

      e. opslag in verband met vervoer van gevaarlijke stoffen: opslag in verband met vervoer van gevaarlijke stoffen als
      bedoeld in [artikel 1, onderdeel c, van het Besluit risico’s zware ongevallen 1999][ref5];

      f. plaatsgebonden risico: risico op een plaats buiten een inrichting, een transportroute of een buisleiding,
      uitgedrukt als de kans per jaar dat een persoon die onafgebroken en onbeschermd op die plaats zou verblijven,
      overlijdt als rechtstreeks gevolg van een ongewoon voorval binnen die inrichting, op die transportroute of met die
      buisleiding, waarbij een gevaarlijke stof betrokken is;

      g. categorie K1: een product niet zijnde een brandbaar gas met een vlampunt dat, bepaald met het toestel van Abel-
      Pensky, bij een druk van 100 kPa lager is dan 21°C;

      h. categorie K2: een product met een vlampunt dat, bepaald met het toestel van Abel-Pensky, bij een druk van 100
      kPa ligt tussen de 21°C en 55°C;

      i. categorie K3: een product met een vlampunt dat, bepaald met het toestel van Pensky-Martens, bij een druk van 100
      kPa hoger is dan 55°C en lager is dan 100°C;

      j. maatgevende stof of maatgevende categorie van stoffen: gevaarlijke stof of categorie van gevaarlijke stoffen
      die door zijn gevaarseigenschappen in combinatie met de hoeveelheid die van die stof of van die categorie in een
      inrichting aanwezig mag zijn, meer dan alle andere voor die inrichting vergunde gevaarlijke stoffen bepalend is
      voor de ligging van de 10-6 per jaar contour voor het plaatsgebonden risico van die inrichting;

      k. register: register als bedoeld in [artikel 12.12 van de wet][ref6];

      l. bijlage A van het ADR: de door Onze Minister ingevolge [artikel 5.4.1 van het Vuurwerkbesluit][ref7] aangewezen
      of bekendgemaakte vertaling van bijlage A bij de op 30 september 1957 te Genève tot stand gekomen Europese
      Overeenkomst betreffende het internationale vervoer van gevaarlijke goederen over de weg (Trb. 1959, 171);

      m. wet: [Wet milieubeheer][ref8].

      2 Voor de berekening van het groepsrisico en het plaatsgebonden risico van inrichtingen en spoorwegemplacementen
      als bedoeld in [artikel 2 van het Besluit externe veiligheid inrichtingen][ref9] alsmede voor de wijze van
      toepassing van de afstanden waarbij wordt voldaan aan het plaatsgebonden risico, indien deze afstanden door Onze
      Minister zijn voorgeschreven op grond van het [Besluit externe veiligheid inrichtingen][ref10], zijn de daarvoor
      krachtens het [Besluit externe veiligheid inrichtingen][ref11] vastgestelde regels van overeenkomstige toepassing.


