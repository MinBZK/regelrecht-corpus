  - number: '14'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de gegevens die het register bevat
      en de verdere inrichting en vorm van het register.
    url: https://wetten.overheid.nl/BWBR0020724/2010-10-01#Artikel14
  - number: '15'
    text: |-
      1 De verstrekking van gegevens als bedoeld in de [artikelen 8 tot en met 10][ref1] aan het RIVM, met betrekking tot
      inrichtingen vindt plaats binnen twee weken na:

      a. het in werking treden van een besluit tot verlening, wijziging of intrekking van een vergunning krachtens
      [artikel 2.1, eerste lid, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref2] of
      [artikel 15, onderdeel b, van de Kernenergiewet][ref3];

      b. de ontvangst van een melding als bedoeld in [artikel 8.41, tweede lid, van de wet][ref4];

      c. een uitspraak van de Afdeling bestuursrechtspraak van de Raad van State of een uitspraak van de Voorzitter van
      die Afdeling, inzake een besluit, als bedoeld in de onderdelen a of c, of een melding als bedoeld in onderdeel b.

      2 De verstrekking van gegevens als bedoeld in de [artikelen 8][ref5], [11][ref6] en [12][ref7] aan het RIVM, met
      betrekking tot transportroutes of buisleidingen vindt plaats:

      a. op basis van vooraf geraamde gegevens binnen twee weken na ingebruikname van de nieuw aangelegde of
      gewijzigdetransportroute of buisleiding en

      b. op basis van tijdens het gebruik van de transportroute of buisleiding verzamelde gegevens binnen zes maanden na
      ingebruikname van de nieuw aangelegde of gewijzigde transportroute of buisleiding.

      3 Onverminderd het bepaalde in het eerste en tweede lid, draagt het bevoegd gezag ervoor zorg dat de gegevens in
      het register ten minste eens per vijf jaar worden geactualiseerd.


