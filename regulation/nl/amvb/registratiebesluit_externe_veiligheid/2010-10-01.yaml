  - number: '16.4'
    text: |-
      In afwijking van [artikel 15, tweede lid][ref1], vindt verstrekking aan het RIVM van gegevens als bedoeld in
      [artikel 8][ref2] met betrekking tot transportroutes als bedoeld in [artikel 5][ref3] en buisleidingen als bedoeld
      in [artikel 6][ref4] die voor het in werking treden van dit besluit zijn aangelegd, plaats binnen twaalf maanden na
      het in werking treden van dit besluit.


