    text: |-
      Als inrichtingen als bedoeld in [artikel 12.12, tweede lid, van de wet][ref1] worden eveneens aangewezen:

      a. inrichtingen waarop [artikel 15, onderdeel b, van de Kernenergiewet][ref2] van toepassing is;

      b. inrichtingen, met uitzondering van in de territoriale zee gelegen inrichtingen, die krachtens
      [artikel 1 van de Mijnbouwwet][ref3] zijn aangewezen als mijnbouwwerken en waarvan het plaatsgebonden risico hoger
      is dan 10-6 per jaar;

      c. inrichtingen waar meer dan 10.000 kg consumentenvuurwerk in de zin van het [Vuurwerkbesluit][ref4] wordt
      opgeslagen al dan niet in combinatie met het bewerken daarvan in de zin van het [Vuurwerkbesluit][ref5];

      d. inrichtingen waar professioneel vuurwerk al dan niet tezamen met consumentenvuurwerk in de zin van het
      [Vuurwerkbesluit][ref6] wordt opgeslagen of bewerkt in de zin van het [Vuurwerkbesluit][ref7];

      e. inrichtingen als bedoeld in categorie 3.1 van [bijlage I, onder C, bij het Besluit omgevingsrecht][ref8], waar
      meer dan 10 kg ontplofbare stoffen aanwezig is of meer dan 100 kg netto explosieve massa aan munitie aanwezig is,
      met uitzondering van volgens bijlage A van het ADR tot klasse 1.4 behorende patronen dan wel onderdelen daarvan
      voor vuurwapens met een kaliber van niet meer dan 13,2 mm;

      f. inrichtingen waar meer dan 1000 kg distikstofoxide aanwezig is, niet zijnde inrichtingen die behoren tot een
      categorie als aangewezen onder 23.1 van [bijlage I, onder C, bij het Besluit omgevingrecht][ref9];

      g. inrichtingen die worden gebruikt door de Nederlandse krijgsmacht of door een bondgenootschappelijke mogendheid
      voor zover buiten die inrichtingen ruimtelijke beperkingen gelden in verband met die inrichtingen.


