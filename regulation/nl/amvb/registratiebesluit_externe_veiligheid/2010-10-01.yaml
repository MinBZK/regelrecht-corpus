  - number: '16'
    text: |-
      1 In afwijking van [artikel 15, eerste lid][ref1], vindt verstrekking aan het RIVM van gegevens als bedoeld in de
      [artikelen 8 tot en met 10][ref2] voor inrichtingen ten aanzien waarvan ten tijde van het in werking treden van dit
      besluit reeds een besluit als bedoeld in [artikel 15, eerste lid, onderdelen a of c][ref3], in werking is getreden,
      een melding als bedoeld in [artikel 15, eerste lid, onderdeel b][ref4], is ontvangen of een uitspraak als bedoeld
      in [artikel 15 eerste lid, onderdeel d][ref5], is gedaan, plaats binnen twaalf maanden na het in werking treden van
      dit besluit voor zover de gegevens ingevolge een wettelijk voorschrift beschikbaar zijn of behoren te zijn.

      2 In afwijking van [artikel 15, eerste lid][ref6], vindt verstrekking aan het RIVM van gegevens als bedoeld in
      [artikel 8 tot en met 10][ref7] voor inrichtingen als bedoeld in [artikel 3, onderdelen a, b, e en g][ref8], en
      [artikel 4, onderdelen a, c en f][ref9], indien voor die inrichtingen ten tijde van het inwerkingtreden van dit
      besluit de gegevens als bedoeld in [artikel 8][ref10] niet ingevolge een wettelijk voorschrift beschikbaar zijn of
      behoren te zijn, plaats binnen twaalf maanden na het in werking treden van dit besluit.

      3 In afwijking van [artikel 15, eerste lid][ref11], vindt verstrekking aan het RIVM van gegevens als
      bedoeld in [artikel 8][ref12], voor inrichtingen als bedoeld in [artikel 3, onderdeel f][ref13], en
      [artikel 4, onderdelen b, d en e][ref14], indien voor die inrichtingen ten tijde van het in werking treden van dit
      besluit de gegevens als bedoeld in [artikel 8][ref15] niet ingevolge een wettelijk voorschrift beschikbaar zijn of
      behoren te zijn, plaats binnen twaalf maanden na het in werking treden van dit besluit.

      4 In afwijking van [artikel 15, tweede lid][ref16], vindt verstrekking aan het RIVM van gegevens als bedoeld
      in [artikel 8][ref17] met betrekking tot transportroutes als bedoeld in [artikel 5][ref18] en buisleidingen als
      bedoeld in [artikel 6][ref19] die voor het in werking treden van dit besluit zijn aangelegd, plaats binnen twaalf
      maanden na het in werking treden van dit besluit.


