  - number: '3'
    text: |-
      Als inrichtingen als bedoeld in [artikel 12.12, tweede lid, van de wet][ref1] worden aangewezen:

      a. inrichtingen waarop het [Besluit risico’s zware ongevallen 1999][ref2] van toepassing is;

      b. inrichtingen bestemd voor de opslag in verband met het vervoer van gevaarlijke stoffen als
      bedoeld in [artikel 1, onderdeel c, van het Besluit risico’s zware ongevallen 1999][ref3], waar
      gevaarlijke stoffen als bedoeld in [bijlage I van het Besluit risico’s zware ongevallen 1999][ref4]
      worden opgeslagen in hoeveelheden groter dan de in
      [kolom 2 van de delen 1 onderscheidenlijk 2 van bijlage I van het Besluit risico’s zware ongevallen 1999][ref5]
      genoemde hoeveelheden;

      c. door Onze Minister krachtens [artikel 2 van het Besluit externe veiligheid inrichtingen][ref6] aangewezen
      spoorwegemplacementen die gebruikt worden voor het rangeren van wagons met gevaarlijke stoffen;

      d. andere door Onze Minister krachtens [artikel 2 van het Besluit externe veiligheid inrichtingen][ref7]
      aangewezen categorieën van inrichtingen dan de inrichtingen, bedoeld in de onderdelen a tot en met c, waarvan het
      plaatsgebonden risico, berekend volgens bij die regeling gestelde regels, hoger is of kan zijn dan 10-6 per jaar,
      niet zijnde inrichtingen waarvoor regels gelden krachtens [artikel 8.40 van de wet][ref8];

      e. LPG-tankstations als bedoeld in
      [artikel 1, eerste lid, onderdeel b, van het Besluit LPG-tankstations milieubeheer][ref9];

      f. inrichtingen waar verpakte gevaarlijke afvalstoffen, of verpakte gevaarlijke stoffen, niet zijnde
      nitraathoudende kunstmeststoffen groep 2 als bedoeld in PGS 7, verpakte gevaarlijke afvalstoffen of verpakte
      bestrijdingsmiddelen worden opgeslagen in een hoeveelheid van meer dan 10 000 kg per opslagvoorziening, niet zijnde
      een inrichting als bedoeld in onderdeel a of d, indien:

      1° brandbare gevaarlijke stoffen met fluor-, chloor-, stikstof- of zwavelhoudende verbindingen worden opgeslagen,
      of

      2° binnen een opslagvoorziening zowel brandbare gevaarlijke stoffen als gevaarlijke stoffen met fluor-, chloor-,
      stikstof- of zwavelhoudende verbindingen worden opgeslagen;

      g. inrichtingen waarin een koel- of vriesinstallatie aanwezig is met een hoeveelheid van meer dan 1500 kg ammoniak,
      niet zijnde een inrichting als bedoeld in onderdeel a, d of h;

      h. andere door Onze Minister krachtens [artikel 2 van het Besluit externe veiligheid inrichtingen][ref10]
      aangewezen categorieën van inrichtingen dan de inrichtingen, bedoeld in de onderdelen e tot en met g, en
      [artikel 4][ref11], waarvan het plaatsgebonden risico, berekend volgens bij [die regeling][ref12] gestelde
      regels, hoger is of kan zijn dan 10-6 per jaar, niet zijnde inrichtingen waarvoor regels gelden krachtens
      [artikel 8.40 van de wet][ref13].


