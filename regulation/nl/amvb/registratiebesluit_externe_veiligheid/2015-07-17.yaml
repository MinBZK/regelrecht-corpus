  - number: '8'
    text: |-
      Het register bevat ten aanzien van inrichtingen, transportroutes en buisleidingen aangewezen ingevolge de
      [artikelen 3 tot en met 6][ref1] slechts de volgende gegevens:

      a. de geografische situering van de inrichtingen, transportroutes en buisleidingen, weergegeven met behulp van de
      coördinaten van het stelsel van de rijksdriehoeksmeting, bedoeld in [artikel 52 van de Kadasterwet][ref2];

      b. een aanduiding van het bevoegd gezag;

      c. de ligging van de 10-6 per jaar contour van het plaatsgebonden risico en, indien beschikbaar, de 10-5 per jaar
      contour en de 10-8 per jaar contour van het plaatsgebonden risico, dan wel de afstanden die overeenkomen met deze
      waarden voor het plaatsgebonden risico indien deze afstanden door Onze Minister zijn voorgeschreven alsmede de
      veiligheidsafstanden die gelden voor inrichtingen als bedoeld in [artikel 4, onderdelen c, d en g][ref3], en

      d. de datum waarop de betreffende gegevens in het register laatstelijk zijn gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0020724#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel52
      [ref3]: https://wetten.overheid.nl/BWBR0020724#Artikel4
