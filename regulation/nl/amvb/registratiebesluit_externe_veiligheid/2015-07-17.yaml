    text: |-
      Als gevaarlijke stoffen als bedoeld in [artikel 12.11, tweede lid, van de wet][ref1] worden aangewezen:

      a. de in bijlage I, deel 2, bij de Seveso III-richtlijn onder de nummers 1 tot en met 4 en 29 genoemde stoffen;

      b. distikstofoxide;

      c. bestrijdingsmiddelen;

      d. gevaarlijke afvalstoffen;

      e. voor zover het betreft inrichtingen: gevaarlijke stoffen als bedoeld in
      [artikel 1, eerste lid, van de Wet vervoer gevaarlijke stoffen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel12.11
