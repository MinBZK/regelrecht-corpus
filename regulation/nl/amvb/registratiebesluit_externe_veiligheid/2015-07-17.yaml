$id: registratiebesluit_externe_veiligheid
regulatory_layer: AMVB
publication_date: '2020-10-28'
valid_from: '2015-07-17'
bwb_id: BWBR0020724
url: https://wetten.overheid.nl/BWBR0020724/2015-07-17
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 28 maart
    2006, nr. DJZ2005203937, Directie Juridische Zaken, afdeling Wetgeving, gedaan in overeenstemming met Onze Minister
    van Verkeer en Waterstaat en Onze Minister van Economische Zaken;

    Gelet op de artikelen 12.11, tweede lid, 12.12, tweede, vierde en vijfde lid, en 12.13, tweede en derde lid, 12.16,
    derde lid, en 21.8 van de Wet milieubeheer;

    De Raad van State gehoord (advies van 24 mei 2006, nr. W08.06.0083/V);

    Gezien het nader rapport van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 22
    november 2006, nr. DJZ 2006290246, Directie Juridische Zaken, afdeling Wetgeving, uitgebracht in overeenstemming
    met Onze Minister van Verkeer en Waterstaat en Onze Minister van Economische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel1
  - number: 1.1.a
    text: |-
      bestrijdingsmiddel: gewasbeschermingsmiddelen of biociden als bedoeld in
      [artikel 1, eerste lid, van de Wet gewasbeschermingsmiddelen en biociden][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021670#Artikel1
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0021670
        artikel: '1'
  - number: 1.1.b
    text: |-
      gevaarlijke afvalstof: afvalstof als bedoeld in
      [artikel 3, eerste lid, van de Regeling Europese afvalstoffenlijst][ref1], voor zover die afvalstof een of meer
      eigenschappen, genoemd in [artikel 4, tweede lid, onderdelen a tot en met c, e en f, van die regeling][ref2] bezit;


      [ref1]: https://wetten.overheid.nl/BWBR0013546#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013546#Artikel4
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013546
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013546
        artikel: '4'
  - number: 1.1.c
    text: |-
      groepsrisico: cumulatieve kansen per jaar dat ten minste 10, 100 of 1000 personen overlijden als rechtstreeks
      gevolg van hun aanwezigheid in het invloedsgebied van een inrichting, een transportroute of een buisleiding en een
      ongewoon voorval binnen die inrichting, op die transportroute of met die buisleiding waarbij een gevaarlijke stof
      betrokken is;
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel1
  - number: 1.1.d
    text: |-
      invloedsgebied: gebied waarin volgens door Onze Minister bij ministeriële regeling op grond van
      [artikel 15, eerste lid, van het Besluit externe veiligheid inrichtingen][ref1] personen worden meegeteld voor de
      berekening van het groepsrisico;


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel15
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '15'
  - number: 1.1.e
    text: |-
      opslag in verband met vervoer van gevaarlijke stoffen: opslag van verpakte gevaarlijke stoffen gedurende korte tijd
      en in afwachting van aansluitend vervoer naar een vooraf bekende ontvanger, met inbegrip van het laden en lossen
      van die stoffen en de overbrenging daarvan naar of van een andere tak van vervoer, voor zover daadwerkelijk in
      aansluitend vervoer is voorzien en de betrokken gevaarlijke stoffen in hun oorspronkelijke verpakking blijven;
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel1
  - number: 1.1.f
    text: |-
      plaatsgebonden risico: risico op een plaats buiten een inrichting, een transportroute of een buisleiding,
      uitgedrukt als de kans per jaar dat een persoon die onafgebroken en onbeschermd op die plaats zou verblijven,
      overlijdt als rechtstreeks gevolg van een ongewoon voorval binnen die inrichting, op die transportroute of met die
      buisleiding, waarbij een gevaarlijke stof betrokken is;
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel1
  - number: 1.1.g
    text: |-
      maatgevende stof of maatgevende categorie van stoffen: gevaarlijke stof of categorie van gevaarlijke stoffen
      die door zijn gevaarseigenschappen in combinatie met de hoeveelheid die van die stof of van die categorie in een
      inrichting aanwezig mag zijn, meer dan alle andere voor die inrichting vergunde gevaarlijke stoffen bepalend is
      voor de ligging van de 10-6 per jaar contour voor het plaatsgebonden risico van die inrichting;
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel1
  - number: 1.1.h
    text: |-
      register: register als bedoeld in [artikel 12.12 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel12
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '12'
  - number: 1.1.i
    text: |-
      bijlage A van het ADR: de door Onze Minister ingevolge [artikel 5.4.1 van het Vuurwerkbesluit][ref1] aangewezen
      of bekendgemaakte vertaling van bijlage A bij de op 30 september 1957 te Genève tot stand gekomen Europese
      Overeenkomst betreffende het internationale vervoer van gevaarlijke goederen over de weg (Trb. 1959, 171);


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel5
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '5'
  - number: 1.1.j
    text: |-
      wet: [Wet milieubeheer][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 1.1.n
    text: |-
      Seveso III-richtlijn: Richtlijn 2012/18/EU van het Europees Parlement en de Raad van 4 juli 2012 betreffende de
      beheersing van de gevaren van zware ongevallen waarbij gevaarlijke stoffen zijn betrokken, houdende wijziging en
      vervolgens intrekking van Richtlijn 96/82/EG van de Raad (PbEU 2012, L 197).
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel1
  - number: '1.2'
    text: |-
      Voor de berekening van het groepsrisico en het plaatsgebonden risico van inrichtingen en spoorwegemplacementen als
      bedoeld in [artikel 2 van het Besluit externe veiligheid inrichtingen][ref1] alsmede voor de wijze van toepassing
      van de afstanden waarbij wordt voldaan aan het plaatsgebonden risico, indien deze afstanden door Onze Minister zijn
      voorgeschreven op grond van het [Besluit externe veiligheid inrichtingen][ref2], zijn de daarvoor krachtens het
      [Besluit externe veiligheid inrichtingen][ref3] vastgestelde regels van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0016767
      [ref3]: https://wetten.overheid.nl/BWBR0016767
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0016767
      - id: ref3
        bwb_id: BWBR0016767
  - number: '1.3'
    text: |-
      Voor de berekening van het groepsrisico en het plaatsgebonden risico van buisleidingen waarop het
      [Besluit externe veiligheid buisleidingen][ref1] van toepassing is, zijn de daarvoor krachtens dat besluit gestelde
      regels van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028265
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028265
  - number: '2'
    text: |-
      Als gevaarlijke stoffen als bedoeld in [artikel 12.11, tweede lid, van de wet][ref1] worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel12
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '12'
  - number: 2.a
    text: de in bijlage I, deel 2, bij de Seveso III-richtlijn onder de nummers 1 tot en met 4 en 29 genoemde stoffen;
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel2
  - number: 2.b
    text: distikstofoxide;
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel2
  - number: 2.c
    text: bestrijdingsmiddelen;
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel2
  - number: 2.d
    text: gevaarlijke afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel2
  - number: 2.e
    text: |-
      voor zover het betreft inrichtingen: gevaarlijke stoffen als bedoeld in
      [artikel 1, eerste lid, van de Wet vervoer gevaarlijke stoffen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel1
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '1'
  - number: '3'
    text: |-
      Als categorieën van inrichtingen als bedoeld in [artikel 12.12, tweede lid, van de wet][ref1]
      worden aangewezen de categorieën van inrichtingen, bedoeld in
      [artikel 2, eerste lid, van het Besluit externe veiligheid inrichtingen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0016767#Artikel2
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0016767
        artikel: '2'
  - number: '4'
    text: |-
      Als inrichtingen als bedoeld in [artikel 12.12, tweede lid, van de wet][ref1] worden eveneens aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel12
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '12'
  - number: 4.a
    text: |-
      inrichtingen waarop [artikel 15, onderdeel b, van de Kernenergiewet][ref1] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: 4.b
    text: |-
      inrichtingen, met uitzondering van in de territoriale zee gelegen inrichtingen, die krachtens
      [artikel 1 van de Mijnbouwwet][ref1] zijn aangewezen als mijnbouwwerken en waarvan het plaatsgebonden risico hoger
      is dan 10-6 per jaar;


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel1
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '1'
  - number: 4.c
    text: |-
      inrichtingen waar meer dan 10.000 kg consumentenvuurwerk in de zin van het [Vuurwerkbesluit][ref1] wordt opgeslagen
      al dan niet in combinatie met het bewerken daarvan in de zin van het [Vuurwerkbesluit][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0013360
      [ref2]: https://wetten.overheid.nl/BWBR0013360
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013360
      - id: ref2
        bwb_id: BWBR0013360
  - number: 4.d
    text: |-
      inrichtingen waar professioneel vuurwerk al dan niet tezamen met consumentenvuurwerk in de zin van het
      [Vuurwerkbesluit][ref1] wordt opgeslagen of bewerkt in de zin van het [Vuurwerkbesluit][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0013360
      [ref2]: https://wetten.overheid.nl/BWBR0013360
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013360
      - id: ref2
        bwb_id: BWBR0013360
  - number: 4.e
    text: |-
      inrichtingen als bedoeld in categorie 3.1 van [bijlage I, onder C, bij het Besluit omgevingsrecht][ref1], waar meer
      dan 10 kg ontplofbare stoffen aanwezig is of meer dan 100 kg netto explosieve massa aan munitie aanwezig is, met
      uitzondering van volgens bijlage A van het ADR tot klasse 1.4 behorende patronen dan wel onderdelen daarvan voor
      vuurwapens met een kaliber van niet meer dan 13,2 mm;


      [ref1]: https://wetten.overheid.nl/BWBR0027464
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0027464
  - number: 4.f
    text: |-
      inrichtingen waar meer dan 1000 kg distikstofoxide aanwezig is, niet zijnde inrichtingen die behoren tot een
      categorie als aangewezen onder 23.1 van [bijlage I, onder C, bij het Besluit omgevingrecht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0027464
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0027464
  - number: 4.g
    text: |-
      inrichtingen die worden gebruikt door de Nederlandse krijgsmacht of door een bondgenootschappelijke mogendheid voor
      zover buiten die inrichtingen ruimtelijke beperkingen gelden in verband met die inrichtingen.
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel4
  - number: '5'
    text: |-
      Als transportroutes als bedoeld in [artikel 12.12, tweede lid, van de wet][ref1] worden aangewezen transportroutes
      waarvan het plaatsgebonden risico voor wegen en spoorlijnen op de as van de transportroute, of voor vaarwegen op de
      oever, hoger is dan 10-6 per jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel12
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '12'
  - number: '6'
    text: |-
      Als categorieën van buisleidingen als bedoeld in [artikel 12.12, tweede lid, van de wet][ref1] worden aangewezen de
      categorieën van buisleidingen waarop het [Besluit externe veiligheid buisleidingen][ref2] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0028265
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0028265
  - number: '8'
    text: |-
      Het register bevat ten aanzien van inrichtingen, transportroutes en buisleidingen aangewezen ingevolge de
      [artikelen 3 tot en met 6][ref1] slechts de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0020724#Artikel3
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020724
        artikel: '3'
        paragraaf: '2'
  - number: 8.a
    text: |-
      de geografische situering van de inrichtingen, transportroutes en buisleidingen, weergegeven met behulp van de
      coördinaten van het stelsel van de rijksdriehoeksmeting, bedoeld in [artikel 52 van de Kadasterwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel52
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '52'
  - number: 8.b
    text: een aanduiding van het bevoegd gezag;
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel8
  - number: 8.c
    text: |-
      de ligging van de 10-6 per jaar contour van het plaatsgebonden risico en, indien beschikbaar, de 10-5 per jaar
      contour en de 10-8 per jaar contour van het plaatsgebonden risico, dan wel de afstanden die overeenkomen met deze
      waarden voor het plaatsgebonden risico indien deze afstanden door Onze Minister zijn voorgeschreven alsmede de
      veiligheidsafstanden die gelden voor inrichtingen als bedoeld in [artikel 4, onderdelen c, d en g][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0020724#Artikel4
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020724
        artikel: '4'
        paragraaf: '2'
  - number: 8.d
    text: de datum waarop de betreffende gegevens in het register laatstelijk zijn gewijzigd.
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel8
  - number: '9.1'
    text: |-
      Onverminderd [artikel 8][ref1] bevat het register ten aanzien van inrichtingen aangewezen ingevolge de
      [artikelen 3][ref2] en [4][ref3] tevens de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0020724#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0020724#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020724#Artikel4
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020724
        artikel: '8'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0020724
        artikel: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0020724
        artikel: '4'
        paragraaf: '2'
  - number: 9.1.a
    text: de bedrijfsnaam;
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel9
  - number: 9.1.b
    text: het adres, de kadastrale aanduiding en de ligging van de aangewezen inrichtingen;
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel9
  - number: 9.1.c
    text: de datum waarop de voor de risico’s relevante geldende vergunning is verleend of laatstelijk is gewijzigd;
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel9
  - number: 9.1.d
    text: de aard van het risico;
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel9
  - number: 9.1.e
    text: |-
      de chemische naam en het CAS-nummer en voor zover bekend het UN-nummer van de voor het risico maatgevende stof of
      de naam van de voor het risico maatgevende categorie van stoffen en
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel9
  - number: 9.1.f
    text: |-
      indien beschikbaar het groepsrisico uitgedrukt in een grafiek met op de horizontale as het aantal dodelijke
      slachtoffers en op de verticale as de cumulatieve kansen per jaar op ten minste dat aantal slachtoffers of de
      gemiddelde bevolkingsdichtheid binnen het invloedsgebied rondom de desbetreffende inrichting.
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel9
  - number: '9.2'
    text: |-
      Ten aanzien van inrichtingen als bedoeld in [artikel 4, onderdeel g][ref1], bevat het register de ligging van de
      zones waar beperkingen gelden voor de bebouwing of de aanwezigheid van personen.


      [ref1]: https://wetten.overheid.nl/BWBR0020724#Artikel4
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020724
        artikel: '4'
        paragraaf: '2'
  - number: '10.1'
    text: |-
      Het register bevat voor LPG-tankstations als bedoeld in [artikel 3, onderdeel e][ref1], tevens de plaats van de
      LPG-opslagtanks, de LPG-vulpunten en de LPG-afleverzuilen, uitgedrukt in coördinaten volgens het stelsel van de
      rijksdriehoeksmeting, bedoeld in [artikel 52 van de Kadasterwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020724#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004541#Artikel52
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0020724
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0004541
        artikel: '52'
  - number: '10.2'
    text: |-
      Voor inrichtingen met zowel een voor het toxisch risico maatgevende stof als voor het risico van brand of explosie
      maatgevende stof bevat het register de in [artikel 9, eerste lid, onderdelen d en e][ref1], bedoelde gegevens ten
      aanzien van beide maatgevende stoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0020724#Artikel9
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0020724
        artikel: '9'
        paragraaf: '3'
  - number: '10.3'
    text: |-
      Bij de berekening van de in de in [artikel 8, onderdeel c][ref1], bedoelde gegevens wordt uitgegaan van de
      in de vergunning genoemde maximale hoeveelheid maatgevende stof of maatgevende categorie van stoffen, zonodig
      gecorrigeerd voor strikt voorzienbare, incidentele wijzigingen in deze hoeveelheid over het jaar. Bij ministeriële
      regeling kunnen regels gesteld worden over de wijze waarop de maximale hoeveelheid maatgevende stof of maatgevende
      categorie van stoffen wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020724#Artikel8
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0020724
        artikel: '8'
        paragraaf: '3'
  - number: '11.1'
    text: |-
      Onverminderd [artikel 8][ref1] bevat het register ten aanzien van buisleidingen aangewezen ingevolge
      [artikel 6][ref2] tevens de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0020724#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0020724#Artikel6
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0020724
        artikel: '8'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0020724
        artikel: '6'
        paragraaf: '2'
  - number: 11.1.a
    text: |-
      indien beschikbaar het groepsrisico van de buisleidingen, uitgedrukt in een grafiek met op de horizontale as het
      aantal dodelijke slachtoffers per kilometer lengte van de buisleiding en op de verticale as de cumulatieve kansen
      per jaar op ten minste dat aantal slachtoffers;
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel11
  - number: 11.1.b
    text: de eventuele naam of aanduiding waaronder de buisleidingen bekend zijn;
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel11
  - number: 11.1.c
    text: de naam van de exploitant van de buisleiding;
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel11
  - number: 11.1.d
    text: de uitwendige diameter van de buisleiding in millimeters;
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel11
  - number: 11.1.e
    text: de maximale werkdruk uitgedrukt in kiloPascal;
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel11
  - number: 11.1.f
    text: de wanddikte van de buis in millimeters;
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel11
  - number: 11.1.g
    text: de ligging van de bovenkant van de buisleiding ten opzichte van het maaiveld, in centimeters, en
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel11
  - number: 11.1.h
    text: de materiaalsoort van de buisleiding.
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel11
  - number: '11.2'
    text: |-
      [Artikel 9, eerste lid, onderdelen d en e][ref1], is van overeenkomstige toepassing op buisleidingen aangewezen
      ingevolge [artikel 6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020724#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0020724#Artikel6
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0020724
        artikel: '9'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0020724
        artikel: '6'
        paragraaf: '2'
  - number: '12'
    text: |-
      Onverminderd [artikel 8][ref1] bevat het register ten aanzien van transportroutes aangewezen ingevolge
      [artikel 5][ref2] tevens de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0020724#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0020724#Artikel5
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0020724
        artikel: '8'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0020724
        artikel: '5'
        paragraaf: '2'
  - number: 12.a
    text: |-
      indien beschikbaar het groepsrisico van de transportroutes, uitgedrukt in een grafiek met op de horizontale as
      het aantal dodelijke slachtoffers per kilometer lengte van de transportroute en op de verticale as de cumulatieve
      kansen per jaar op ten minste dat aantal slachtoffers;
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel12
  - number: 12.b
    text: de eventuele naam of aanduiding waaronder de transportroutes bekend zijn.
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel12
  - number: '13'
    text: |-
      Onverminderd de [artikelen 8][ref1] en [10, eerste lid][ref2], bevat het register een overzicht op een kaart
      waaruit de geografische ligging van de inrichtingen, transportroutes en buisleidingen waarover in het register
      gegevens zijn opgenomen blijkt. Op de kaart worden opgenomen de ligging van de 10-6 per jaar contour van het
      plaatsgebonden risico, en indien beschikbaar, de 10-5 per jaar contour en de 10-8 per jaar contour van het
      plaatsgebonden risico als bedoeld in [artikel 8, onderdeel c][ref3], alsmede de afstanden die gelden voor
      inrichtingen als bedoeld in [artikel 4, onderdelen c en g][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0020724#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0020724#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0020724#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0020724#Artikel4
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020724
        artikel: '8'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0020724
        artikel: '10'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0020724
        artikel: '8'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0020724
        artikel: '4'
        paragraaf: '2'
  - number: '14'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de gegevens die het register bevat
      en de verdere inrichting en vorm van het register.
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel14
  - number: '15.1'
    text: |-
      De verstrekking van gegevens als bedoeld in de [artikelen 8 tot en met 10][ref1] ter uitvoering van
      [artikel 12.13 van de wet][ref2], met betrekking tot inrichtingen vindt plaats binnen twee weken na:


      [ref1]: https://wetten.overheid.nl/BWBR0020724#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel12
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0020724
        artikel: '8'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '12'
  - number: 15.1.a
    text: |-
      het in werking treden van een besluit tot verlening, wijziging of intrekking van een vergunning krachtens
      [artikel 2.1, eerste lid, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref1] of
      [artikel 15, onderdeel b, van de Kernenergiewet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002402
        artikel: '15'
  - number: 15.1.b
    text: |-
      de ontvangst van een melding als bedoeld in [artikel 8.41, tweede lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 15.1.c
    text: |-
      een uitspraak van de Afdeling bestuursrechtspraak van de Raad van State of een uitspraak van de Voorzitter van die
      Afdeling, inzake een besluit, als bedoeld in de onderdelen a of c, of een melding als bedoeld in onderdeel b.
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel15
  - number: '15.2'
    text: |-
      De verstrekking van gegevens als bedoeld in de [artikelen 8][ref1], [11][ref2] en [12][ref3] ter uitvoering van
      [artikel 12.13 van de wet][ref4], met betrekking tot transportroutes of buisleidingen vindt plaats:


      [ref1]: https://wetten.overheid.nl/BWBR0020724#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0020724#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0020724#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel12
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0020724
        artikel: '8'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0020724
        artikel: '11'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0020724
        artikel: '12'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '12'
  - number: 15.2.a
    text: |-
      op basis van vooraf geraamde gegevens binnen twee weken na ingebruikname van de nieuw aangelegde of
      gewijzigdetransportroute of buisleiding en
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel15
  - number: 15.2.b
    text: |-
      op basis van tijdens het gebruik van de transportroute of buisleiding verzamelde gegevens binnen zes maanden na
      ingebruikname van de nieuw aangelegde of gewijzigde transportroute of buisleiding.
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel15
  - number: '15.3'
    text: |-
      Onverminderd het bepaalde in het eerste en tweede lid, draagt het bevoegd gezag ervoor zorg dat de gegevens in het
      register ten minste eens per vijf jaar worden geactualiseerd.
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel15
  - number: '16.1'
    text: |-
      In afwijking van [artikel 15, eerste lid][ref1], vindt verstrekking van gegevens als bedoeld in de
      [artikelen 8 tot en met 10][ref2] voor inrichtingen ten aanzien waarvan ten tijde van het in werking treden van
      dit besluit reeds een besluit als bedoeld in artikel 15, eerste lid, onderdelen a of c, in werking is getreden, een
      melding als bedoeld in artikel 15, eerste lid, onderdeel b, is ontvangen of een uitspraak als bedoeld in artikel
      15 eerste lid, onderdeel d, is gedaan, plaats binnen twaalf maanden na het in werking treden van dit besluit voor
      zover de gegevens ingevolge een wettelijk voorschrift beschikbaar zijn of behoren te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0020724#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0020724#Artikel8
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0020724
        artikel: '15'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0020724
        artikel: '8'
        paragraaf: '3'
  - number: '16.2'
    text: |-
      In afwijking van [artikel 15, eerste lid][ref1], vindt verstrekking van gegevens als bedoeld in
      [artikel 8 tot en met 10][ref2] voor inrichtingen als bedoeld in [artikel 3, onderdelen a, b, e en g][ref3], en
      [artikel 4, onderdelen a, c en f][ref4], indien voor die inrichtingen ten tijde van het inwerkingtreden van dit
      besluit de gegevens als bedoeld in [artikel 8][ref5] niet ingevolge een wettelijk voorschrift beschikbaar zijn of
      behoren te zijn, plaats binnen twaalf maanden na het in werking treden van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0020724#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0020724#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0020724#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020724#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0020724#Artikel8
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0020724
        artikel: '15'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0020724
        artikel: '8'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0020724
        artikel: '3'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0020724
        artikel: '4'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0020724
        artikel: '8'
        paragraaf: '3'
  - number: '16.3'
    text: |-
      In afwijking van [artikel 15, eerste lid][ref1], vindt verstrekking van gegevens als bedoeld in [artikel 8][ref2],
      voor inrichtingen als bedoeld in [artikel 3, onderdeel f][ref3], en [artikel 4, onderdelen b, d en e][ref4], indien
      voor die inrichtingen ten tijde van het in werking treden van dit besluit de gegevens als bedoeld in artikel 8 niet
      ingevolge een wettelijk voorschrift beschikbaar zijn of behoren te zijn, plaats binnen twaalf maanden na het in
      werking treden van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0020724#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0020724#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0020724#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020724#Artikel4
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0020724
        artikel: '15'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0020724
        artikel: '8'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0020724
        artikel: '3'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0020724
        artikel: '4'
        paragraaf: '2'
  - number: '16.4'
    text: |-
      In afwijking van [artikel 15, tweede lid][ref1], vindt verstrekking van gegevens als bedoeld in [artikel 8][ref2]
      met betrekking tot transportroutes als bedoeld in [artikel 5][ref3] en buisleidingen als bedoeld in
      [artikel 6][ref4] die voor het in werking treden van dit besluit zijn aangelegd, plaats binnen twaalf maanden na
      het in werking treden van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0020724#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0020724#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0020724#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0020724#Artikel6
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0020724
        artikel: '15'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0020724
        artikel: '8'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0020724
        artikel: '5'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0020724
        artikel: '6'
        paragraaf: '2'
  - number: '17'
    text: |-
      Onze Minister kan gegevens als bedoeld in de [artikelen 8 tot en met 12][ref1] aanwijzen die uitsluitend zijn in
      te zien bij het bevoegd gezag. Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de
      wijze waarop toegang kan worden verkregen tot de aangewezen gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0020724#Artikel8
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0020724
        artikel: '8'
        paragraaf: '3'
  - number: '18'
    text: |-
      Voor het vervaardigen van afschriften van in het register opgenomen gegevens wordt een vergoeding in rekening
      gebracht die wordt berekend volgens de normen van het [Besluit tarieven openbaarheid van bestuur][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005869
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005869
  - number: '21'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel21
  - number: '22'
    text: 'Dit besluit wordt aangehaald als: Registratiebesluit externe veiligheid.'
    url: https://wetten.overheid.nl/BWBR0020724/2015-07-17#Artikel22
