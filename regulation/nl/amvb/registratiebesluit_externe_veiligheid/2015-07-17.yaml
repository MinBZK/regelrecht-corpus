  - number: '13'
    text: |-
      Onverminderd de [artikelen 8][ref1] en [10, eerste lid][ref2], bevat het register een overzicht op een kaart
      waaruit de geografische ligging van de inrichtingen, transportroutes en buisleidingen waarover in het register
      gegevens zijn opgenomen blijkt. Op de kaart worden opgenomen de ligging van de 10-6 per jaar contour van het
      plaatsgebonden risico, en indien beschikbaar, de 10-5 per jaar contour en de 10-8 per jaar contour van het
      plaatsgebonden risico als bedoeld in [artikel 8, onderdeel c][ref3], alsmede de afstanden die gelden voor
      inrichtingen als bedoeld in [artikel 4, onderdelen c en g][ref4].


