articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. bestrijdingsmiddel: gewasbeschermingsmiddelen of biociden als bedoeld in
      [artikel 1, eerste lid, van de Wet gewasbeschermingsmiddelen en biociden][ref1].

      b. gevaarlijke afvalstof: afvalstof als bedoeld in
      [artikel 3, eerste lid, van de Regeling Europese afvalstoffenlijst][ref2], voor zover die afvalstof een of meer
      eigenschappen, genoemd in [artikel 4, tweede lid, onderdelen a tot en met c, e en f, van die regeling][ref3] bezit;

      c. groepsrisico: cumulatieve kansen per jaar dat ten minste 10, 100 of 1000 personen overlijden als rechtstreeks
      gevolg van hun aanwezigheid in het invloedsgebied van een inrichting, een transportroute of een buisleiding en een
      ongewoon voorval binnen die inrichting, op die transportroute of met die buisleiding waarbij een gevaarlijke stof
      betrokken is;

      d. invloedsgebied: gebied waarin volgens door Onze Minister bij ministeriële regeling op grond van
      [artikel 15, eerste lid, van het Besluit externe veiligheid inrichtingen][ref4] personen worden meegeteld voor de
      berekening van het groepsrisico;

      e. opslag in verband met vervoer van gevaarlijke stoffen: opslag van verpakte gevaarlijke stoffen gedurende korte
      tijd en in afwachting van aansluitend vervoer naar een vooraf bekende ontvanger, met inbegrip van het laden en
      lossen van die stoffen en de overbrenging daarvan naar of van een andere tak van vervoer, voor zover daadwerkelijk
      in aansluitend vervoer is voorzien en de betrokken gevaarlijke stoffen in hun oorspronkelijke verpakking blijven;

      f. plaatsgebonden risico: risico op een plaats buiten een inrichting, een transportroute of een buisleiding,
      uitgedrukt als de kans per jaar dat een persoon die onafgebroken en onbeschermd op die plaats zou verblijven,
      overlijdt als rechtstreeks gevolg van een ongewoon voorval binnen die inrichting, op die transportroute of met die
      buisleiding, waarbij een gevaarlijke stof betrokken is;

      g. maatgevende stof of maatgevende categorie van stoffen: gevaarlijke stof of categorie van gevaarlijke stoffen
      die door zijn gevaarseigenschappen in combinatie met de hoeveelheid die van die stof of van die categorie in een
      inrichting aanwezig mag zijn, meer dan alle andere voor die inrichting vergunde gevaarlijke stoffen bepalend is
      voor de ligging van de 10-6 per jaar contour voor het plaatsgebonden risico van die inrichting;

      h. register: register als bedoeld in [artikel 12.12 van de wet][ref5];

      i. bijlage A van het ADR: de door Onze Minister ingevolge [artikel 5.4.1 van het Vuurwerkbesluit][ref6] aangewezen
      of bekendgemaakte vertaling van bijlage A bij de op 30 september 1957 te Genève tot stand gekomen Europese
      Overeenkomst betreffende het internationale vervoer van gevaarlijke goederen over de weg (Trb. 1959, 171);

      j. wet: [Wet milieubeheer][ref7];

      k.

      l.

      m.

      n. Seveso III-richtlijn: Richtlijn 2012/18/EU van het Europees Parlement en de Raad van 4 juli 2012 betreffende de
      beheersing van de gevaren van zware ongevallen waarbij gevaarlijke stoffen zijn betrokken, houdende wijziging en
      vervolgens intrekking van Richtlijn 96/82/EG van de Raad (PbEU 2012, L 197).

      2 Voor de berekening van het groepsrisico en het plaatsgebonden risico van inrichtingen en spoorwegemplacementen
      als bedoeld in [artikel 2 van het Besluit externe veiligheid inrichtingen][ref8] alsmede voor de wijze van
      toepassing van de afstanden waarbij wordt voldaan aan het plaatsgebonden risico, indien deze afstanden door Onze
      Minister zijn voorgeschreven op grond van het [Besluit externe veiligheid inrichtingen][ref9], zijn de daarvoor
      krachtens het [Besluit externe veiligheid inrichtingen][ref10] vastgestelde regels van overeenkomstige toepassing.

      3 Voor de berekening van het groepsrisico en het plaatsgebonden risico van buisleidingen waarop het
      [Besluit externe veiligheid buisleidingen][ref11] van toepassing is, zijn de daarvoor krachtens dat besluit
      gestelde regels van overeenkomstige toepassing.


