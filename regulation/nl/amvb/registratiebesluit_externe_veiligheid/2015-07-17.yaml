  - number: '11'
    text: |-
      1 Onverminderd [artikel 8][ref1] bevat het register ten aanzien van buisleidingen aangewezen ingevolge
      [artikel 6][ref2] tevens de volgende gegevens:

      a. indien beschikbaar het groepsrisico van de buisleidingen, uitgedrukt in een grafiek met op de horizontale as het
      aantal dodelijke slachtoffers per kilometer lengte van de buisleiding en op de verticale as de cumulatieve kansen
      per jaar op ten minste dat aantal slachtoffers;

      b. de eventuele naam of aanduiding waaronder de buisleidingen bekend zijn;

      c. de naam van de exploitant van de buisleiding;

      d. de uitwendige diameter van de buisleiding in millimeters;

      e. de maximale werkdruk uitgedrukt in kiloPascal;

      f. de wanddikte van de buis in millimeters;

      g. de ligging van de bovenkant van de buisleiding ten opzichte van het maaiveld, in centimeters, en

      h. de materiaalsoort van de buisleiding.

      2 [Artikel 9, eerste lid, onderdelen d en e][ref3], is van overeenkomstige toepassing op buisleidingen aangewezen
      ingevolge [artikel 6][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0020724#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0020724#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0020724#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0020724#Artikel6
