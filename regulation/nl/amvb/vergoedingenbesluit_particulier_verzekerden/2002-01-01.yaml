articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;

      b. specialist: een arts die is ingeschreven in het specialistenregister van de Koninklijke Nederlandsche
      Maatschappij tot Bevordering der Geneeskunst;

      c. tandarts-specialist: een tandarts die is ingeschreven in het specialistenregister voor mondziekten en
      kaakchirurgie dan wel in het specialistenregister voor dentomaxillaire orthopaedie van de Nederlandse Maatschappij
      tot bevordering der Tandheelkunde;

      d. huisarts: een arts die is ingeschreven in het register van erkende huisartsen van de Koninklijke Nederlandsche
      Maatschappij tot Bevordering der Geneeskunst;

      e. verpleegkundige: een persoon die bevoegd is de titel van verpleegkundige te voeren;

      f. ziekenverzorgende: een persoon die bevoegd is de titel van ziekenverzorgende te voeren.
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel1
  - number: '2'
    text: |-
      De in [artikel 3, eerste lid, van de Wet op de toegang tot ziektekostenverzekeringen 1998][ref1] bedoelde
      overeenkomst van standaardverzekering omvat naast vergoeding van de kosten van de in [artikel 5 van die wet][ref2]
      genoemde vormen van zorg vergoeding van de kosten van de navolgende vormen van zorg op het gebied van de
      gezondheidszorg:

      a. ziekenvervoer;

      b. kraamzorg;

      c. hulp door een audiologisch centrum;

      d. niet-klinische haemodialyse;

      e. chronisch intermitterende beademing;

      f. onderzoek in het kader van de behandeling van tuberculose en tuberculose-infectie;

      g. hulp door een trombosedienst;

      een en ander met inachtneming van het bij of krachtens dit besluit bepaalde ter zake van omvang, eigen bijdrage en
      eigen risico.

      h. het geven van erfelijkheidsadvies.


      [ref1]: https://wetten.overheid.nl/BWBR0009750#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009750#Artikel5
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel2
    references:
