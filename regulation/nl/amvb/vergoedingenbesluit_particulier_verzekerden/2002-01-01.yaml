preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 10 januari 1986, DGVGZ/VTA/VZ,
    nr. 325799;

    Gelet op artikel 2, tweede lid, van de Wet op de toegang tot ziektekostenverzekeringen;

    Gehoord het Kontaktorgaan Landelijke Organisaties van Ziektekostenverzekeraars (advies van 5 november 1985,
    V/550/85/WJW/WR);

    De Raad van State gehoord (advies van 14 maart 1986, No. W 13.86.0031/17.6.10.);

    Gezien het nader rapport van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 20 maart 1986, DGVGZ/
    VTA/VZ, nr. 32220;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;'
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel1
  - number: 1.b
    text: |-
      specialist: een arts die is ingeschreven in het specialistenregister van de Koninklijke Nederlandsche Maatschappij
      tot Bevordering der Geneeskunst;
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel1
  - number: 1.c
    text: |-
      tandarts-specialist: een tandarts die is ingeschreven in het specialistenregister voor mondziekten en kaakchirurgie
      dan wel in het specialistenregister voor dentomaxillaire orthopaedie van de Nederlandse Maatschappij tot
      bevordering der Tandheelkunde;
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel1
  - number: 1.d
    text: |-
      huisarts: een arts die is ingeschreven in het register van erkende huisartsen van de Koninklijke Nederlandsche
      Maatschappij tot Bevordering der Geneeskunst;
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel1
  - number: 1.e
    text: 'verpleegkundige: een persoon die bevoegd is de titel van verpleegkundige te voeren;'
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel1
  - number: 1.f
    text: 'ziekenverzorgende: een persoon die bevoegd is de titel van ziekenverzorgende te voeren.'
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel1
  - number: '2'
    text: |-
      De in [artikel 3, eerste lid, van de Wet op de toegang tot ziektekostenverzekeringen 1998][ref1] bedoelde
      overeenkomst van standaardverzekering omvat naast vergoeding van de kosten van de in [artikel 5 van die wet][ref2]
      genoemde vormen van zorg vergoeding van de kosten van de navolgende vormen van zorg op het gebied van de
      gezondheidszorg:


      [ref1]: https://wetten.overheid.nl/BWBR0009750#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009750#Artikel5
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009750
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0009750
        artikel: '5'
  - number: 2.a
    text: ziekenvervoer;
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel2
  - number: 2.b
    text: kraamzorg;
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel2
  - number: 2.c
    text: hulp door een audiologisch centrum;
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel2
  - number: 2.d
    text: niet-klinische haemodialyse;
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel2
  - number: 2.e
    text: chronisch intermitterende beademing;
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel2
  - number: 2.f
    text: onderzoek in het kader van de behandeling van tuberculose en tuberculose-infectie;
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel2
  - number: 2.g
    text: |-
      hulp door een trombosedienst; een en ander met inachtneming van het bij of krachtens dit besluit bepaalde ter zake
      van omvang, eigen bijdrage en eigen risico.
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel2
  - number: 2.h
    text: het geven van erfelijkheidsadvies.
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel2
  - number: 2a.1
    text: |-
      Behoudens voor zover in dit besluit anders is bepaald, wordt per kalenderjaar van de kosten van de zorg een bedrag
      van ƒ 105 [per 1 januari 2002: € 50] per polis, indien daarop een alleenstaande is verzekerd, dan wel twee maal dat
      bedrag per polis, indien daarop meer dan een persoon is verzekerd, niet vergoed.
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel2a
  - number: 2a.2
    text: |-
      Indien een overeenkomst van standaardverzekering als bedoeld in
      [artikel 3, eerste lid, van de Wet op de toegang tot ziektekostenverzekeringen 1998][ref1] in de loop van het
      kalenderjaar wordt gesloten, wordt het bedrag, bedoeld in het eerste lid, vermenigvuldigd met het aantal maanden
      waarop de overeenkomst van standaardverzekering in dat jaar betrekking heeft gehad en gedeeld door 12. Bij de
      berekening wordt de kalendermaand waarin de overeenkomst van standaardverzekering ingaat, buiten beschouwing
      gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0009750#Artikel3
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0009750
        artikel: '3'
  - number: 2a.3
    text: |-
      Indien een overeenkomst van standaardverzekering als bedoeld in
      [artikel 3, eerste lid, van de Wet op de toegang tot ziektekostenverzekeringen 1998][ref1] in de loop van
      het kalenderjaar wordt beëindigd, wordt het bedrag, bedoeld in het eerste lid, vermenigvuldigd met het aantal
      maanden waarop de overeenkomst van standaardverzekering in dat jaar betrekking heeft gehad en gedeeld door 12.
      Bij de berekening wordt de maand waarin de overeenkomst van standaardverzekering wordt beëindigd als volledige
      kalendermaand meegeteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009750#Artikel3
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0009750
        artikel: '3'
  - number: 2b.1
    text: |-
      Bij ministeriële regeling wordt het bedrag, genoemd in [artikel 2a, eerste lid][ref1], jaarlijks gewijzigd aan de
      hand van de prijsindex voor de gezinsconsumptie.


      [ref1]: https://wetten.overheid.nl/BWBR0003935#Artikel2a
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0003935
        artikel: 2a
        paragraaf: 2a
  - number: 2b.2
    text: Het berekende bedrag wordt naar beneden afgerond op een veelvoud van een hele euro.
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel2b
  - number: 2b.3
    text: |-
      Bij de jaarlijkse toepassing van het eerste lid wordt de afronding, bedoeld in het tweede lid, buiten beschouwing
      gelaten.
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel2b
  - number: '3'
    text: |-
      De vergoeding van de kosten van huisartsenzorg omvat de kosten van genees- en heelkundige zorg te verlenen door een
      huisarts naar de omvang bepaald door hetgeen in de kring der beroepsgenoten gebruikelijk is, met uitzondering van
      vaccinatie ten behoeve van preventie van influenza.
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel3
  - number: 3a.1
    text: |-
      Vergoeding van de kosten van paramedische zorg omvat de kosten van zorg te verlenen door heilgymnasten-masseurs,
      fysiotherapeuten, oefentherapeuten of logopedisten, naar omvang bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel3a
  - number: 3a.2
    text: |-
      Vergoeding van de kosten van paramedische zorg omvat tevens de kosten van advisering, instructie, training of
      behandeling gedurende maximaal 10 uren per kalenderjaar, te verlenen door een ergotherapeut in zijn behandelruimte
      of ten huize van de verzekerde, met als doel de zelfzorg en zelfredzaamheid van de verzekerde te bevorderen of
      te herstellen.
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel3a
  - number: '4'
    text: |-
      Vergoeding van de kosten van verloskundige zorg omvat de vergoeding van de kosten van die zorg, verleend door een
      huisarts of een verloskundige.
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel4
  - number: '5.1'
    text: |-
      Vergoeding van de kosten van tandheelkundige zorg omvat de vergoeding van de kosten van die zorg, verleend door een
      tandarts of een tandarts-specialist.
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel5
  - number: '5.2'
    text: |-
      Onverminderd [artikel 2][ref1] wordt bij ministeriële regeling ten aanzien van de vergoeding van de kosten van
      tandheelkundige zorg de omvang van de vergoeding vastgesteld, met dien verstande dat de omvang voor verschillende
      categorieën van verzekerden verschillend kan worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003935#Artikel2a
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003935
        artikel: 2a
        paragraaf: 2a
  - number: '6'
    text: |-
      Onverminderd [artikel 2a][ref1] omvat de vergoeding van kosten van farmaceutische zorg niet de kosten van
      farmaceutische zorg, op het verkrijgen waarvan verzekerden in gevolge de [Ziekenfondswet][ref2] geen aanspraak
      hebben. In gevallen waarin verzekerden in de zin van de [Ziekenfondswet][ref3] voor het verkrijgen van
      geneesmiddelen op grond van [artikel 11l van het Verstrekkingenbesluit ziekenfondsverzekering][ref4] bijdragen
      in de kosten daarvan, blijft ten aanzien van dat geneesmiddel een bedrag, gelijk aan die bijdrage, buiten de
      vergoeding op grond van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0003935#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0002460
      [ref3]: https://wetten.overheid.nl/BWBR0002460
      [ref4]: https://wetten.overheid.nl/BWBR0002520#Artikel11l
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003935
        artikel: 2a
        paragraaf: 2a
      - id: ref2
        bwb_id: BWBR0002460
      - id: ref3
        bwb_id: BWBR0002460
      - id: ref4
        bwb_id: BWBR0002520
        artikel: 11l
  - number: '7.1'
    text: 'Vergoeding van de kosten van medisch-specialistische zorg door of vanwege een ziekenhuis omvat:'
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel7
  - number: 7.1.a
    text: |-
      genees-, heel- en verloskundige zorg naar de omvang bepaald door hetgeen in de kring der beroepsgenoten
      gebruikelijk is;
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel7
  - number: 7.1.b
    text: |-
      de vergoeding van de kosten van een opneming in de derde klasse van een ziekenhuis voor onbeperkte duur, indien
      en zolang op medische gronden verpleging, onderzoek en behandeling uitsluitend in een ziekenhuis kunnen worden
      geboden, terwijl onafgebroken behandeling door een specialist noodzakelijk moet zijn;
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel7
  - number: 7.1.c
    text: door Onze Minister aan te wijzen vormen van transplantatie van weefsels en organen.
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel7
  - number: '7.2'
    text: |-
      Betreffende door Onze Minister aangewezen vormen van transplantatie van weefsels en organen wordt onder de
      vergoeding van de kosten, bedoeld in het eerste lid, onder c, mede begrepen:
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel7
  - number: 7.2.a
    text: de vergoeding van de kosten, verband houdende met het verkrijgen van het meest passende transplantatiemateriaal;
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel7
  - number: 7.2.b
    text: |-
      de vergoeding van de kosten van het onderzoek en de behandeling, alsmede de verpleging in het ziekenhuis van de
      donor, op basis van de klasse waarvoor deze verzekerd is;
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel7
  - number: 7.2.c
    text: |-
      de vergoeding van de kosten van de aan de donor verleende hulp, voor zover ter zake bij of krachtens de
      [Wet op de toegang tot ziektekostenverzekeringen 1998][ref1] recht op vergoeding van de kosten bestaat, gedurende
      ten hoogste drie maanden na de datum van ontslag uit het ziekenhuis, waarin de donor ter selectie of ter
      verwijdering van het transplantatiemateriaal werd opgenomen, mits deze hulp verband houdt met de transplantatie.


      [ref1]: https://wetten.overheid.nl/BWBR0009750
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009750
  - number: '8.1'
    text: |-
      Vergoeding van de kosten van medisch-specialistische zorg door of vanwege een ziekenhuis omvat niet de vergoeding
      van de kosten van opneming in een psychiatrisch ziekenhuis onderscheidenlijk een psychiatrische afdeling van een
      algemeen of academisch ziekenhuis.
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel8
  - number: '8.2'
    text: |-
      De vergoeding van de kosten van medisch-specialistische zorg door of vanwege een ziekenhuis omvat voorts niet de
      bij ministeriële regeling aangewezen kosten.
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel8
  - number: 9a.1
    text: |-
      Vergoeding van de kosten van medisch-specialistische zorg, verleend anders dan door of vanwege een ziekenhuis,
      omvat de kosten van genees-, heel- en verloskundige zorg naar de omvang bepaald door hetgeen in de kring der
      beroepsgenoten gebruikelijk is.
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel9a
  - number: 9a.2
    text: |-
      Vergoeding van de kosten van de zorg, bedoeld in het eerste lid, omvat niet de bij ministeriële regeling aangewezen
      kosten.
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel9a
  - number: 9a.3
    text: |-
      Vergoeding van de kosten van de zorg, bedoeld in het eerste lid, omvat voorts niet de kosten van zorg, te verlenen
      door een psychiater of zenuwarts.
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel9a
  - number: '10.1'
    text: |-
      Vergoeding van de kosten van ziekenvervoer omvat de vergoeding van de kosten van medisch noodzakelijk vervoer van
      de verzekerde in Nederland per ambulance, taxi of auto:
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel10
  - number: 10.1.a
    text: naar of van een inrichting waarin hij is opgenomen;
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel10
  - number: 10.1.b
    text: naar of van een persoon bij wie de verzekerde een onderzoek of een behandeling heeft ondergaan;
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel10
  - number: 10.1.c
    text: naar of van een polikliniek van een academisch ziekenhuis, waar hij een onderzoek of behandeling heeft ondergaan;
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel10
  - number: '10.2'
    text: 'Vergoeding van de kosten van ziekenvervoer omvat tevens de vergoeding van de kosten van het vervoer:'
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel10
  - number: 10.2.a
    text: naar of van een inrichting;
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel10
  - number: 10.2.b
    text: naar of van een instrumentmaker voor het aanpassen van een prothese;
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel10
  - number: 10.2.c
    text: |-
      naar of van een niet-klinisch werkzame psychiater of zenuwarts dan wel een psychiatrische polikliniek of een
      instelling voor psychiatrische deeltijdbehandeling;
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel10
  - number: '10.3'
    text: |-
      [Artikel 2][ref1] is niet van toepassing op ziekenvervoer, tenzij het betreft ambulancevervoer als bedoeld
      in [artikel 1, eerste lid, van de Wet ambulancevervoer][ref2]. Van de kosten van ziekenvervoer, anders dan
      ambulancevervoer als bedoeld in [artikel 1, eerste lid, van de Wet ambulancevervoer][ref3], wordt per kalenderjaar
      een bedrag van € 22,69 per polis, indien daarop een alleenstaande is verzekerd, dan wel twee maal dat bedrag per
      polis, indien daarop meer dan een persoon is verzekerd, niet vergoed, met dien verstande dat voor de vergoeding van
      de kosten per auto slechts een bij ministeriële regeling te bepalen bedrag per kilometer in aanmerking komt.


      [ref1]: https://wetten.overheid.nl/BWBR0003935#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0002757#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002757#Artikel1
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003935
        artikel: 2a
        paragraaf: 2a
      - id: ref2
        bwb_id: BWBR0002757
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0002757
        artikel: '1'
  - number: '11.1'
    text: |-
      Vergoeding van de kosten van kraamzorg ten huize van de verzekerde, verleend onder verantwoordelijkheid van een
      kraamcentrum, omvat de vergoeding van de kosten van de verzorging van moeder en kind van ten minste 24 en ten
      hoogste 80 uren, verdeeld over ten hoogste 10 dagen, te rekenen vanaf de dag van de bevalling.
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel11
  - number: '11.2'
    text: |-
      Vergoeding van de kosten van kraamzorg omvat de vergoeding van de kosten van verzorging en verpleging van moeder en
      kind, te verlenen in een kraaminrichting of in een ziekenhuis zonder een medische indicatie, gedurende ten hoogste
      10 dagen te rekenen vanaf de dag van de bevalling. De hoogte van de maximum vergoeding per dag voor deze kraamzorg
      wordt bij ministeriële regeling bepaald.
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel11
  - number: '11.3'
    text: |-
      Op vergoeding van de kosten van kraamzorg, bedoeld in het eerste en tweede lid, bestaat aanspraak voor zover moeder
      en kind, gelet op hun behoefte, redelijkerwijs op kraamzorg zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel11
  - number: '11.4'
    text: |-
      Indien de verzekerde gedurende een deel van de periode, bedoeld in het eerste lid, verblijft in een ziekenhuis op
      grond van een medische indicatie, behoudt zij voor de resterende kraamzorg, bedoeld in het eerste lid, aanspraak op
      de vergoeding van de kosten daarvan.
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel11
  - number: '11.5'
    text: |-
      Onverminderd [artikel 2a][ref1]** komt een bij ministeriële regeling te bepalen bedrag per uur niet voor vergoeding
      in aanmerking, indien de kraamzorg wordt verleend ten huize van de verzekerde. Indien de kraamzorg wordt verleend
      in een kraaminrichting of zonder medische indicatie in een ziekenhuis, komt een bij ministeriële regeling te
      bepalen bedrag per dag niet voor vergoeding in aanmerking, vermeerderd met het bedrag waarmee het ingevolge de
      [Wet tarieven gezondheidszorg][ref2] vastgestelde of goedgekeurde tarief van de kraaminrichting of het ziekenhuis
      het bij die regeling te bepalen bedrag te boven gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0003935#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0003356
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003935
        artikel: 2a
        paragraaf: 2a
      - id: ref2
        bwb_id: BWBR0003356
  - number: '12'
    text: |-
      De vergoeding van kosten van hulp door een audiologisch centrum omvat de vergoeding van de kosten van op
      voorschrift van de huisarts, een kinderarts of een keel-, neus- en oorarts verleende hulp bestaande uit:
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel12
  - number: 12.a
    text: onderzoek van de gehoorfunctie;
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel12
  - number: 12.b
    text: advisering over de aan te schaffen gehoorapparatuur;
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel12
  - number: 12.c
    text: voorlichting over het gebruik van de apparatuur;
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel12
  - number: 12.d
    text: psycho-sociale hulp indien noodzakelijk in verband met problemen met de gestoorde gehoorfunctie.
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel12
  - number: '13'
    text: |-
      Vergoeding van de kosten van onderzoek in het kader van de behandeling van tuberculose of tuberculose-infectie
      omvat de kosten van onderzoek op aanvraag van een arts die verbonden is aan een gemeentelijke gezondheidsdienst.
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel13
  - number: '14.1'
    text: 'Vergoeding van de kosten van niet-klinische haemodialyse omvat de vergoeding van de kosten van de hulp verleend:'
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel14
  - number: 14.1.a
    text: in een dialysecentrum;
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel14
  - number: 14.1.b
    text: ten huize van de verzekerde.
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel14
  - number: '14.2'
    text: 'De in het eerste lid bedoelde vergoeding omvat:'
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel14
  - number: 14.2.a
    text: |-
      vergoeding van de kosten van de aan de verzekerde verleende haemodialyse, alsmede van het daarmee verband houdende
      onderzoek, behandeling en verpleging;
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel14
  - number: 14.2.b
    text: vergoeding van de kosten, verband houdende met door het dialysecentrum verleende psychosociale begeleiding.
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel14
  - number: '14.3'
    text: 'De in het eerste lid, onder *b*, bedoelde vergoeding omvat bovendien:'
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel14
  - number: 14.3.a
    text: |-
      vergoeding van de kosten voor redelijkerwijs te verrichten aanpassingen in en aan de woning en voor het herstel in
      de oorspronkelijke staat;
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel14
  - number: 14.3.b
    text: vergoeding van de overige kosten die rechtstreeks met de thuisdialyse samenhangen;
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel14
  - number: 14.3.c
    text: |-
      vergoeding van de kosten, verband houdende met de opleiding door het dialysecentrum van degenen die de dialyse
      uitvoeren dan wel daarbij behulpzaam zijn;
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel14
  - number: 14.3.d
    text: |-
      vergoeding van de kosten van het in bruikleen geven van de haemodialyse-apparatuur met toebehoren, de vergoeding
      van de kosten van de regelmatige controle en het onderhoud hiervan, vervanging inbegrepen, alsmede van de
      chemicaliën en vloeistoffen, benodigd voor het verrichten van de haemodialyse.
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel14
  - number: '14.4'
    text: |-
      Vergoeding van de kosten, bedoeld in het derde lid, onder *a* en *b*, wordt alleen verleend voor zover niet andere
      wettelijke regelingen daarin voorzien.
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel14
  - number: '15.1'
    text: |-
      Vergoeding van de kosten van chronisch intermitterende beademing omvat de vergoeding van de kosten, verband
      houdende met de mechanische beademing
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel15
  - number: 15.1.a
    text: in een beademingscentrum;
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel15
  - number: 15.1.b
    text: ten huize van de verzekerde.
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel15
  - number: '15.2'
    text: 'De in het eerste lid, onder *a*, bedoelde vergoeding omvat:'
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel15
  - number: 15.2.a
    text: vergoeding van de kosten van de voor de verzekerde noodzakelijke mechanische beademing;
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel15
  - number: 15.2.b
    text: |-
      vergoeding van de kosten van de met de beademing verband houdende specialistische hulp, farmaceutische hulp alsmede
      verpleging en verzorging gedurende minder dan 24 uur.
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel15
  - number: '15.3'
    text: 'De in het eerste lid, onder *b*, bedoelde vergoeding omvat:'
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel15
  - number: 15.3.a
    text: |-
      vergoeding van de kosten in verband met het door het beademingscentrum voor elke behandeling aan de verzekerde
      gebruiksklaar ter beschikking stellen van de daarvoor benodigde apparatuur;
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel15
  - number: 15.3.b
    text: |-
      vergoeding van de kosten van de met de mechanische beademing verband houdende specialistische hulp, verleend door
      of vanwege het beademingscentrum.
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel15
  - number: '16.1'
    text: |-
      De vergoeding van de kosten van revalidatiezorg van medisch-specialistische, paramedische, gedragswetenschappelijke
      en revalidatie-technische aard omvat de kosten van onderzoek, behandeling en advisering te verlenen door een aan
      een instelling voor revalidatiezorg verbonden multidisciplinair team van deskundigen, staande onder leiding van
      een specialist.
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel16
  - number: '16.2'
    text: |-
      Indien de revalidatiezorg wordt verleend in een instelling voor revalidatiezorg omvat de vergoeding van de kosten
      tevens de kosten van meerdaagse dagbehandeling van enkele uren per dag of de kosten van meerdaagse opneming met
      verzorging en verpleging.
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel16
  - number: '16.3'
    text: 'Op de vergoeding van de kosten van revalidatiezorg bestaat slechts aanspraak indien:'
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel16
  - number: 16.3.a
    text: |-
      deze hulp voor de verzekerde als meest doeltreffend is aangewezen ter voorkoming, vermindering of overwinning van
      een handicap die het gevolg is van stoornissen of beperkingen in het bewegingsvermogen, en
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel16
  - number: 16.3.b
    text: |-
      de verzekerde met die hulp in staat is een mate van zelfstandigheid te bereiken of te behouden die, gegeven diens
      beperkingen, redelijkerwijs mogelijk is.
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel16
  - number: '16.4'
    text: |-
      Op vergoeding van de kosten van revalidatiezorg, gepaard gaande met meerdaagse opneming, bestaat slechts aanspraak
      indien daarmee spoedig betere resultaten te verwachten zijn dan met revalidatiezorg zonder die opneming.
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel16
  - number: '17'
    text: Vergoeding van de kosten van hulp door een trombosedienst omvat vergoeding van de kosten van
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel17
  - number: 17.a
    text: het regelmatig afnemen van bloedmonsters van de verzekerde;
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel17
  - number: 17.b
    text: |-
      het verrichten dan wel onder verantwoordelijkheid van de trombosedienst doen verrichten van de noodzakelijke
      laboratoriumonderzoeken ter bepaling van de stollingstijd van het bloed;
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel17
  - number: 17.c
    text: |-
      het geven van adviezen aan de behandelend arts omtrent de toepassing van geneesmiddelen ter beïnvloeding van de
      bloedstolling.
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel17
  - number: '18'
    text: |-
      Hulp in het kader van erfelijkheidsadvisering omvat onderzoek naar en van erfelijke afwijkingen door middel van
      stamboomonderzoek, chromosoomonderzoek, biochemische diagnostiek, ultrageluidsonderzoek en DNA-onderzoek, het geven
      van erfelijkheidsadviezen en daarmee verband houdende psycho-sociale begeleiding, te verlenen door een instelling
      die een vergunning heeft op grond van [artikel 18 van de Wet ziekenhuisvoorzieningen][ref1] voor de toepassing van
      klinisch genetisch onderzoek en erfelijkheidsadvisering.


      [ref1]: https://wetten.overheid.nl/BWBR0002753#Artikel18
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002753
        artikel: '18'
  - number: 18a
    text: |-
      Onverminderd [artikel 2][ref1] omvat de vergoeding van de kosten van hulpmiddelen niet de kosten van hulpmiddelen,
      op het verkrijgen waarvan verzekerden in gevolge de [Ziekenfondswet][ref2] geen aanspraak hebben. In gevallen
      waarin verzekerden in de zin van de [Ziekenfondswet][ref3] voor het verkrijgen van hulpmiddelen op grond van
      [artikel 15 van het Verstrekkingenbesluit ziekenfondsverzekering][ref4] bijdragen in de kosten daarvan, blijft ten
      aanzien van dat hulpmiddel een bedrag, gelijk aan die bijdrage, buiten de vergoeding op grond van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0003935#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0002460
      [ref3]: https://wetten.overheid.nl/BWBR0002460
      [ref4]: https://wetten.overheid.nl/BWBR0002520#Artikel15
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0003935
        artikel: 2a
        paragraaf: 2a
      - id: ref2
        bwb_id: BWBR0002460
      - id: ref3
        bwb_id: BWBR0002460
      - id: ref4
        bwb_id: BWBR0002520
        artikel: '15'
  - number: '19.1'
    text: |-
      De in [artikel 3, eerste lid, van de Wet op de toegang tot ziektekostenverzekeringen 1998][ref1] bedoelde
      overeenkomst van standaardverzekering omvat eveneens vergoeding van in een andere lidstaat van de Europese Unie
      verleende zorg, voor zover die zorg overeenkomt met zorg op vergoeding waarvan ingevolge dit besluit aanspraak
      bestaat. De vergoeding bedraagt ten hoogste 100% van de kosten die zouden zijn vergoed indien de zorg in Nederland
      zou zijn verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0009750#Artikel3
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0009750
        artikel: '3'
  - number: '19.2'
    text: |-
      Vergoeding van de kosten van medisch noodzakelijk ziekenvervoer per ambulance, taxi of auto in verband met de
      verleende zorg, bedoeld in het eerste lid, bedraagt maximaal het bedrag dat gelijk is aan de kosten van zodanig
      vervoer tussen de woonplaats van de verzekerde en de dichtstbijzijnde plaats waar de zorg zou zijn verleend, indien
      deze in Nederland zou zijn geboden.
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel19
  - number: '20.1'
    text: |-
      De in [artikel 3, eerste lid, van de Wet op de toegang tot ziektekostenverzekeringen 1998][ref1] bedoelde
      overeenkomst van standaardverzekering omvat eveneens vergoeding gedurende maximaal 365 dagen van de kosten
      van spoedeisende opname en verblijf in een ziekenhuis in het buitenland alsmede vergoeding van de kosten van
      spoedeisende medisch-specialistische zorg, spoedeisende farmaceutische zorg en spoedeisende huisartsenzorg in het
      buitenland, een en ander tot ten hoogste 200% van de kosten die zouden zijn vergoed indien de zorg met toepassing
      van dit besluit in Nederland zou zijn verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0009750#Artikel3
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0009750
        artikel: '3'
  - number: '20.2'
    text: |-
      Vergoeding van de kosten van de in het eerste lid genoemde zorg omvat voorts vergoeding van de kosten van
      het medisch noodzakelijk ziekenvervoer per ambulance of taxi naar het dichtstbijzijnde ziekenhuis of de
      dichtstbijzijnde specialist.
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel20
  - number: '20.3'
    text: |-
      Vergoeding van de in het eerste en tweede lid bedoelde kosten wordt niet verleend indien het verblijf in het
      buitenland uitsluitend of mede tot doel had aldaar een opneming of een behandeling te ondergaan en de opneming of
      de behandeling niet kan worden uitgesteld tot na de terugkeer in Nederland.
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel20
  - number: '20.4'
    text: |-
      Voor de toepassing van het eerste en tweede lid wordt onder huisarts onderscheidenlijk specialist mede verstaan de
      huisarts onderscheidenlijk specialist die als zodanig in het buitenland werkzaam is.
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel20
  - number: '21'
    text: |-
      Dit besluit, dat kan worden aangehaald als Vergoedingenbesluit particulier verzekerden, treedt in werking op het
      tijdstip waarop [artikel 2 van de Wet op de toegang tot ziektekostenverzekeringen][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0003934#Artikel2
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0003934
        artikel: '2'
