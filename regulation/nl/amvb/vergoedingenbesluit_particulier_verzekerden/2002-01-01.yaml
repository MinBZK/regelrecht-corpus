  - number: '11'
    text: |-
      1 Vergoeding van de kosten van kraamzorg ten huize van de verzekerde, verleend onder verantwoordelijkheid van
      een kraamcentrum, omvat de vergoeding van de kosten van de verzorging van moeder en kind van ten minste 24 en ten
      hoogste 80 uren, verdeeld over ten hoogste 10 dagen, te rekenen vanaf de dag van de bevalling.

      2 Vergoeding van de kosten van kraamzorg omvat de vergoeding van de kosten van verzorging en verpleging van moeder
      en kind, te verlenen in een kraaminrichting of in een ziekenhuis zonder een medische indicatie, gedurende ten
      hoogste 10 dagen te rekenen vanaf de dag van de bevalling. De hoogte van de maximum vergoeding per dag voor deze
      kraamzorg wordt bij ministeriële regeling bepaald.

      3 Op vergoeding van de kosten van kraamzorg, bedoeld in het eerste en tweede lid, bestaat aanspraak voor zover
      moeder en kind, gelet op hun behoefte, redelijkerwijs op kraamzorg zijn aangewezen.

      4 Indien de verzekerde gedurende een deel van de periode, bedoeld in het eerste lid, verblijft in een ziekenhuis op
      grond van een medische indicatie, behoudt zij voor de resterende kraamzorg, bedoeld in het eerste lid, aanspraak op
      de vergoeding van de kosten daarvan.

      5 Onverminderd [artikel 2a][ref1]** komt een bij ministeriële regeling te bepalen bedrag per uur niet voor
      vergoeding in aanmerking, indien de kraamzorg wordt verleend ten huize van de verzekerde. Indien de kraamzorg wordt
      verleend in een kraaminrichting of zonder medische indicatie in een ziekenhuis, komt een bij ministeriële regeling
      te bepalen bedrag per dag niet voor vergoeding in aanmerking, vermeerderd met het bedrag waarmee het ingevolge de
      [Wet tarieven gezondheidszorg][ref2] vastgestelde of goedgekeurde tarief van de kraaminrichting of het ziekenhuis
      het bij die regeling te bepalen bedrag te boven gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0003935#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0003356
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel11
