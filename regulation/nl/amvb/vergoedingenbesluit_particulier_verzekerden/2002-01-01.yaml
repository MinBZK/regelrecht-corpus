        artikel: '3'
  - number: 2b
    text: |-
      1 Bij ministeriële regeling wordt het bedrag, genoemd in [artikel 2a, eerste lid][ref1], jaarlijks gewijzigd aan de
      hand van de prijsindex voor de gezinsconsumptie.

      2 Het berekende bedrag wordt naar beneden afgerond op een veelvoud van een hele euro.

      3 Bij de jaarlijkse toepassing van het eerste lid wordt de afronding, bedoeld in het tweede lid, buiten beschouwing
      gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0003935#Artikel2a
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel2b
