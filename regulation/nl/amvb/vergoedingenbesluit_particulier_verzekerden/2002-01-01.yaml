  - number: '7'
    text: |-
      1 Vergoeding van de kosten van medisch-specialistische zorg door of vanwege een ziekenhuis omvat:

      a. genees-, heel- en verloskundige zorg naar de omvang bepaald door hetgeen in de kring der beroepsgenoten
      gebruikelijk is;

      b. de vergoeding van de kosten van een opneming in de derde klasse van een ziekenhuis voor onbeperkte duur, indien
      en zolang op medische gronden verpleging, onderzoek en behandeling uitsluitend in een ziekenhuis kunnen worden
      geboden, terwijl onafgebroken behandeling door een specialist noodzakelijk moet zijn;

      c. door Onze Minister aan te wijzen vormen van transplantatie van weefsels en organen.

      2 Betreffende door Onze Minister aangewezen vormen van transplantatie van weefsels en organen wordt onder de
      vergoeding van de kosten, bedoeld in het eerste lid, onder c, mede begrepen:

      a. de vergoeding van de kosten, verband houdende met het verkrijgen van het meest passende transplantatiemateriaal;

      b. de vergoeding van de kosten van het onderzoek en de behandeling, alsmede de verpleging in het ziekenhuis van de
      donor, op basis van de klasse waarvoor deze verzekerd is;

      c. de vergoeding van de kosten van de aan de donor verleende hulp, voor zover ter zake bij of krachtens de
      [Wet op de toegang tot ziektekostenverzekeringen 1998][ref1] recht op vergoeding van de kosten bestaat, gedurende
      ten hoogste drie maanden na de datum van ontslag uit het ziekenhuis, waarin de donor ter selectie of ter
      verwijdering van het transplantatiemateriaal werd opgenomen, mits deze hulp verband houdt met de transplantatie.


      [ref1]: https://wetten.overheid.nl/BWBR0009750
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009750
  - number: '8'
    text: |-
      1 Vergoeding van de kosten van medisch-specialistische zorg door of vanwege een ziekenhuis omvat niet de vergoeding
      van de kosten van opneming in een psychiatrisch ziekenhuis onderscheidenlijk een psychiatrische afdeling van een
      algemeen of academisch ziekenhuis.

      2 De vergoeding van de kosten van medisch-specialistische zorg door of vanwege een ziekenhuis omvat voorts niet de
      bij ministeriële regeling aangewezen kosten.
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel8
  - number: 9a
    text: |-
      1 Vergoeding van de kosten van medisch-specialistische zorg, verleend anders dan door of vanwege een ziekenhuis,
      omvat de kosten van genees-, heel- en verloskundige zorg naar de omvang bepaald door hetgeen in de kring der
      beroepsgenoten gebruikelijk is.

      2 Vergoeding van de kosten van de zorg, bedoeld in het eerste lid, omvat niet de bij ministeriële regeling
      aangewezen kosten.

      3 Vergoeding van de kosten van de zorg, bedoeld in het eerste lid, omvat voorts niet de kosten van zorg, te
      verlenen door een psychiater of zenuwarts.
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel9a
  - number: '10'
    text: |-
      1 Vergoeding van de kosten van ziekenvervoer omvat de vergoeding van de kosten van medisch noodzakelijk vervoer van
      de verzekerde in Nederland per ambulance, taxi of auto:

      a. naar of van een inrichting waarin hij is opgenomen;

      b. naar of van een persoon bij wie de verzekerde een onderzoek of een behandeling heeft ondergaan;

      c. naar of van een polikliniek van een academisch ziekenhuis, waar hij een onderzoek of behandeling heeft
      ondergaan;

      een en ander voor zover de kosten verband houden met een opneming, een onderzoek of een behandeling waarvan de
      kosten geheel of gedeeltelijk voor vergoeding in aanmerking komen.

      2 Vergoeding van de kosten van ziekenvervoer omvat tevens de vergoeding van de kosten van het vervoer:

      a. naar of van een inrichting;

      b. naar of van een instrumentmaker voor het aanpassen van een prothese;

      c. naar of van een niet-klinisch werkzame psychiater of zenuwarts dan wel een psychiatrische polikliniek of een
      instelling voor psychiatrische deeltijdbehandeling;

      een en ander voor zover de opneming, het aanmeten en passen van een prothese, of de behandeling ten laste van de
      bijzondere ziektekostenverzekering, bedoeld in de [Algemene Wet Bijzondere Ziektekosten][ref1] wordt verleend.

      3 [Artikel 2][ref2] is niet van toepassing op ziekenvervoer, tenzij het betreft ambulancevervoer als bedoeld
      in [artikel 1, eerste lid, van de Wet ambulancevervoer][ref3]. Van de kosten van ziekenvervoer, anders dan
      ambulancevervoer als bedoeld in [artikel 1, eerste lid, van de Wet ambulancevervoer][ref4], wordt per kalenderjaar
      een bedrag van € 22,69 per polis, indien daarop een alleenstaande is verzekerd, dan wel twee maal dat bedrag per
      polis, indien daarop meer dan een persoon is verzekerd, niet vergoed, met dien verstande dat voor de vergoeding van
      de kosten per auto slechts een bij ministeriële regeling te bepalen bedrag per kilometer in aanmerking komt.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
      [ref2]: https://wetten.overheid.nl/BWBR0003935#Artikel2a
      [ref3]: https://wetten.overheid.nl/BWBR0002757#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0002757#Artikel1
