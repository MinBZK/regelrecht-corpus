  - number: '12'
    text: |-
      De vergoeding van kosten van hulp door een audiologisch centrum omvat de vergoeding van de kosten van op
      voorschrift van de huisarts, een kinderarts of een keel-, neus- en oorarts verleende hulp bestaande uit:

      a. onderzoek van de gehoorfunctie;

      b. advisering over de aan te schaffen gehoorapparatuur;

      c. voorlichting over het gebruik van de apparatuur;

      d. psycho-sociale hulp indien noodzakelijk in verband met problemen met de gestoorde gehoorfunctie.
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel12
  - number: '13'
    text: |-
      Vergoeding van de kosten van onderzoek in het kader van de behandeling van tuberculose of tuberculose-infectie
      omvat de kosten van onderzoek op aanvraag van een arts die verbonden is aan een gemeentelijke gezondheidsdienst.
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel13
  - number: '14'
    text: |-
      1 Vergoeding van de kosten van niet-klinische haemodialyse omvat de vergoeding van de kosten van de hulp verleend:

      a. in een dialysecentrum;

      b. ten huize van de verzekerde.

      2 De in het eerste lid bedoelde vergoeding omvat:

      a. vergoeding van de kosten van de aan de verzekerde verleende haemodialyse, alsmede van het daarmee verband
      houdende onderzoek, behandeling en verpleging;

      b. vergoeding van de kosten, verband houdende met door het dialysecentrum verleende psychosociale begeleiding.

      3 De in het eerste lid, onder *b*, bedoelde vergoeding omvat bovendien:

      a. vergoeding van de kosten voor redelijkerwijs te verrichten aanpassingen in en aan de woning en voor het herstel
      in de oorspronkelijke staat;

      b. vergoeding van de overige kosten die rechtstreeks met de thuisdialyse samenhangen;

      c. vergoeding van de kosten, verband houdende met de opleiding door het dialysecentrum van degenen die de dialyse
      uitvoeren dan wel daarbij behulpzaam zijn;

      d. vergoeding van de kosten van het in bruikleen geven van de haemodialyse-apparatuur met toebehoren, de vergoeding
      van de kosten van de regelmatige controle en het onderhoud hiervan, vervanging inbegrepen, alsmede van de
      chemicaliën en vloeistoffen, benodigd voor het verrichten van de haemodialyse.

      4 Vergoeding van de kosten, bedoeld in het derde lid, onder *a* en *b*, wordt alleen verleend voor zover niet
      andere wettelijke regelingen daarin voorzien.
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel14
  - number: '15'
    text: |-
      1 Vergoeding van de kosten van chronisch intermitterende beademing omvat de vergoeding van de kosten, verband
      houdende met de mechanische beademing

      a. in een beademingscentrum;

      b. ten huize van de verzekerde.

      2 De in het eerste lid, onder *a*, bedoelde vergoeding omvat:

      a. vergoeding van de kosten van de voor de verzekerde noodzakelijke mechanische beademing;

      b. vergoeding van de kosten van de met de beademing verband houdende specialistische hulp, farmaceutische hulp
      alsmede verpleging en verzorging gedurende minder dan 24 uur.

      3 De in het eerste lid, onder *b*, bedoelde vergoeding omvat:

      a. vergoeding van de kosten in verband met het door het beademingscentrum voor elke behandeling aan de verzekerde
      gebruiksklaar ter beschikking stellen van de daarvoor benodigde apparatuur;

      b. vergoeding van de kosten van de met de mechanische beademing verband houdende specialistische hulp, verleend
      door of vanwege het beademingscentrum.
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel15
  - number: '16'
    text: |-
      1 De vergoeding van de kosten van revalidatiezorg van medisch-specialistische, paramedische,
      gedragswetenschappelijke en revalidatie-technische aard omvat de kosten van onderzoek, behandeling en advisering te
      verlenen door een aan een instelling voor revalidatiezorg verbonden multidisciplinair team van deskundigen, staande
      onder leiding van een specialist.

      2 Indien de revalidatiezorg wordt verleend in een instelling voor revalidatiezorg omvat de vergoeding van de kosten
      tevens de kosten van meerdaagse dagbehandeling van enkele uren per dag of de kosten van meerdaagse opneming met
      verzorging en verpleging.

      3 Op de vergoeding van de kosten van revalidatiezorg bestaat slechts aanspraak indien:

      a. deze hulp voor de verzekerde als meest doeltreffend is aangewezen ter voorkoming, vermindering of overwinning
      van een handicap die het gevolg is van stoornissen of beperkingen in het bewegingsvermogen, en

      b. de verzekerde met die hulp in staat is een mate van zelfstandigheid te bereiken of te behouden die, gegeven
      diens beperkingen, redelijkerwijs mogelijk is.

      4 Op vergoeding van de kosten van revalidatiezorg, gepaard gaande met meerdaagse opneming, bestaat slechts
      aanspraak indien daarmee spoedig betere resultaten te verwachten zijn dan met revalidatiezorg zonder die opneming.
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel16
  - number: '17'
    text: |-
      Vergoeding van de kosten van hulp door een trombosedienst omvat vergoeding van de kosten van

      a. het regelmatig afnemen van bloedmonsters van de verzekerde;

      b. het verrichten dan wel onder verantwoordelijkheid van de trombosedienst doen verrichten van de noodzakelijke
      laboratoriumonderzoeken ter bepaling van de stollingstijd van het bloed;

      c. het geven van adviezen aan de behandelend arts omtrent de toepassing van geneesmiddelen ter beïnvloeding van
      de bloedstolling.
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel17
  - number: '18'
    text: |-
      Hulp in het kader van erfelijkheidsadvisering omvat onderzoek naar en van erfelijke afwijkingen door middel van
      stamboomonderzoek, chromosoomonderzoek, biochemische diagnostiek, ultrageluidsonderzoek en DNA-onderzoek, het geven
      van erfelijkheidsadviezen en daarmee verband houdende psycho-sociale begeleiding, te verlenen door een instelling
      die een vergunning heeft op grond van [artikel 18 van de Wet ziekenhuisvoorzieningen][ref1] voor de toepassing van
      klinisch genetisch onderzoek en erfelijkheidsadvisering.


      [ref1]: https://wetten.overheid.nl/BWBR0002753#Artikel18
    url: https://wetten.overheid.nl/BWBR0003935/2002-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002753
        artikel: '18'
  - number: 18a
    text: |-
      Onverminderd [artikel 2][ref1] omvat de vergoeding van de kosten van hulpmiddelen niet de kosten van hulpmiddelen,
      op het verkrijgen waarvan verzekerden in gevolge de [Ziekenfondswet][ref2] geen aanspraak hebben. In gevallen
      waarin verzekerden in de zin van de [Ziekenfondswet][ref3] voor het verkrijgen van hulpmiddelen op grond van
      [artikel 15 van het Verstrekkingenbesluit ziekenfondsverzekering][ref4] bijdragen in de kosten daarvan, blijft ten
      aanzien van dat hulpmiddel een bedrag, gelijk aan die bijdrage, buiten de vergoeding op grond van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0003935#Artikel2a
