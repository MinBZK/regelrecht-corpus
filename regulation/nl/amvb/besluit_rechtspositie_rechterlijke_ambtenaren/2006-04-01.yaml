        artikel: 125c
      - id: ref3
        bwb_id: BWBR0001830
        artikel: '145'
      - id: ref4
        bwb_id: BWBR0001947
        artikel: '125'
      - id: ref5
        bwb_id: BWBR0001950
        artikel: 9b
      - id: ref6
        bwb_id: BWBR0001950
        artikel: 9c
      - id: ref7
        bwb_id: BWBR0001950
        artikel: 94a
      - id: ref8
        bwb_id: BWBR0001950
        artikel: '96'
      - id: ref9
        bwb_id: BWBR0001950
        artikel: '98'
      - id: ref10
        bwb_id: BWBR0001950
        artikel: '99'
      - id: ref11
        bwb_id: BWBR0001950
        artikel: '100'
      - id: ref12
        bwb_id: BWBR0001950
        artikel: '102'
  - number: '39.2'
    text: |-
      In afwijking van het eerste lid zijn de [artikelen 6][ref1], [9][ref2] en
      [97b van het Algemeen Rijksambtenarenreglement][ref3] van overeenkomstige toepassing, zoals die op 1 februari 1997
      golden voor de burgerlijke rijksambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0001950#Artikel97b
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0001950
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0001950
        artikel: 97b
  - number: '39.3'
    text: |-
      In afwijking van het eerste lid is [artikel 95 van het Algemeen Rijksambtenarenreglement][ref1] van overeenkomstige
      toepassing, zoals dat op 7 juli 2000 gold voor de burgerlijke rijksambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel95
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '95'
  - number: '40'
    text: Dit besluit treedt in werking met ingang van 1 april 1994.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel40
  - number: '41'
    text: 'Dit besluit wordt aangehaald als: Besluit rechtspositie rechterlijke ambtenaren.'
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel41
