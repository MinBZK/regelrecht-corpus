  - number: '2.1'
    text: |-
      Het secretariaat van het overleg wordt gevoerd door een secretaris, zo nodig bijgestaan door één of meer adjunct-
      secretarissen. Deze functionarissen worden na overleg met de Sectorcommissie benoemd door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel2
  - number: '2.2'
    text: |-
      Van het overleg worden door de secretaris notulen gemaakt, die worden toegezonden aan de voorzitter van het
      overleg, de Sectorcommissie en mogelijke andere deelnemers aan het overleg.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel2
  - number: '3'
    text: De Sectorcommissie is bevoegd aan de voorzitter van het overleg onderwerpen ter plaatsing op de agenda op te geven.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel3
  - number: '4'
    text: De deelnemers aan het overleg kunnen omtrent het in de vergadering verhandelde geheimhouding overeenkomen.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel4
  - number: '5.1'
    text: 'Uitgesloten van het lidmaatschap of het plaatsvervangend lidmaatschap van de Advies- en Arbitragecommissie zijn:'
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel5
  - number: 5.1.a
    text: personen die lid zijn van de Sectorcommissie;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel5
  - number: 5.1.b
    text: personen die bestuurslid zijn van, dan wel werkzaam zijn bij de Nederlandse Vereniging voor Rechtspraak;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel5
  - number: 5.1.c
    text: |-
      personen die bestuurslid zijn van, dan wel werkzaam zijn bij, een in
      [artikel 50, tweede lid, onderdeel b, van de wet][ref1] bedoelde vereniging of centrale van verenigingen van
      ambtenaren;


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel50
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '50'
  - number: 5.1.d
    text: |-
      personen, werkzaam bij de ministeries en de daaronder ressorterende instellingen, diensten en bedrijven, wier
      onafhankelijkheid en onpartijdigheid op grond van hun dienstverband door de deelnemers aan het overleg onvoldoende
      wordt geacht.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel5
  - number: '5.2'
    text: |-
      De personen, bedoeld in het eerste lid, zijn eveneens uitgesloten van het lidmaatschap of het plaatsvervangend
      lidmaatschap, bedoeld in het eerste lid, onderdelen *a* en *b*, alsmede na beëindiging van de werkzaamheden,
      bedoeld in het eerste lid, onderdelen *b* en *c*.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel5
  - number: '5.3'
    text: |-
      Aan de op grond van [artikel 53, eerste lid, van de wet][ref1] benoemde leden en de plaatsvervangende leden
      worden uit ’s Rijks kas vergoedingen voor reis- en verblijfkosten verleend volgens de regelen welke voor reis- en
      verblijfkosten wegens reizen voor ’s Rijks dienst gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel53
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '53'
  - number: '6.1'
    text: |-
      De Advies- en Arbitragecommissie treedt in geval van advies of arbitrale uitspraak ten aanzien van de gelegenheden
      die haar ingevolge de [artikelen 51, derde lid][ref1], of [52, tweede lid, onderdeel b, van de wet][ref2] worden
      voorgelegd, op in een samenstelling van vijf leden, onder wie de voorzitter en de twee leden die overeenkomstig
      [artikel 53, eerste lid, van de wet][ref3] zijn benoemd. Bij verhindering van een van de leden treedt diens
      plaatsvervanger op.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel52
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel53
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '51'
      - id: ref2
        bwb_id: BWBR0008365
        artikel: '52'
      - id: ref3
        bwb_id: BWBR0008365
        artikel: '53'
  - number: '6.2'
    text: |-
      Indien het verzoek om een arbitrale uitspraak naar het oordeel van de voorzitter van de Advies- en
      Arbitragecommissie een zelfde geschil betreft als waarover door de Advies- en Arbitragecommissie in dezelfde
      samenstelling reeds advies is uitgebracht, treedt voor een lid die bij het uitbrengen van dat advies betrokken was,
      diens plaatsvervanger op.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel6
  - number: '7.1'
    text: |-
      Indien overeenkomstig [artikel 52, tweede lid, onderdeel b, van de wet][ref1] wordt besloten het advies in
      te winnen van de Advies- en Arbitragecommissie, wordt binnen drie dagen na de desbetreffende vergadering het
      verzoek om advies ter kennis gebracht van de voorzitter van de Advies- en Arbitragecommissie. Het verzoek
      wordt ondertekend door de deelnemers aan het overleg die zich voor inwinning van advies hebben uitgesproken
      en bevat ten minste het onderwerp en de inhoud van het geschil. Indien in de vergadering, bedoeld in
      [artikel 52, tweede lid, van de wet][ref2] geen overeenstemming is bereikt tussen de deelnemers aan het overleg
      over de vraag wat het onderwerp en de inhoud van het geschil is, brengt de andere deelnemer aan het overleg zijn
      visie op het onderwerp en de inhoud van het geschil eveneens drie dagen na die vergadering ter kennis van de
      voorzitter van de Advies- en Arbitragecommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel52
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '52'
      - id: ref2
        bwb_id: BWBR0008365
        artikel: '52'
  - number: '7.2'
    text: |-
      Indien overeenkomstig [artikel 52, tweede lid, onderdeel b, van de wet][ref1] wordt besloten het geschil aan een
      arbitrale uitspraak te onderwerpen van de Advies- en Arbitragecommissie, wordt binnen drie dagen na de vergadering,
      bedoeld in dat artikel, het verzoek om een arbitrale uitspraak ter kennis gebracht van de voorzitter van de Advies-
      en Arbitragecommissie. Het verzoek wordt daartoe ondertekend door de deelnemers aan het overleg en dient ten minste
      te bevatten:


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel52
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '52'
  - number: 7.2.a
    text: het onderwerp en de inhoud van het geschil, en
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel7
  - number: 7.2.b
    text: de standpunten van de deelnemers aan het overleg omtrent onderwerp en inhoud van het geschil.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel7
  - number: '7.3'
    text: |-
      Indien overeenkomstig [artikel 51, derde lid, van de wet][ref1] het geschil wordt onderworpen aan een arbitrale
      uitspraak van de Advies- en Arbitragecommissie, wordt zo spoedig mogelijk het verzoek om een arbitrale uitspraak
      ter kennis gebracht van de voorzitter van de Advies- en Arbitragecommissie. Het verzoek wordt ondertekend door de
      deelnemers aan het overleg en bevat hun standpunten ten aanzien van het onderwerp en inhoud van het geschil.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel51
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '51'
  - number: '8.1'
    text: |-
      De leden, de plaatsvervangende leden en de secretaris, die bij de uitoefening van hun taak de beschikking krijgen
      over gegevens waarvan zij het vertrouwelijk karakter kennen of redelijkerwijs moeten vermoeden, zijn, voor
      zover voor hen niet reeds uit hoofde van ambt, beroep of wettelijk voorschrift ter zake van die gegevens een
      geheimhoudingsplicht geldt, verplicht tot geheimhouding daarvan, behoudens voor zover enig wettelijk voorschrift
      hen tot bekendmaking verplicht of uit hun taak de noodzaak tot bekendmaking voortvloeit.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel8
  - number: '8.2'
    text: De Advies- en Arbitragecommissie stelt nadere regels vast met betrekking tot haar werkwijze.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel8
  - number: '9.1'
    text: De Advies- en Arbitragecommissie besluit bij meerderheid van stemmen.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel9
  - number: '9.2'
    text: 'Het advies of de arbitrale uitspraak moet inhouden:'
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel9
  - number: 9.2.a
    text: de namen van deelnemers die het advies of de arbitrale uitspraak hebben aangevraagd,
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel9
  - number: 9.2.b
    text: een overzicht van de standpunten van de deelnemers over het onderwerp en de inhoud van het geschil, en
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel9
  - number: 9.2.c
    text: het advies dan wel de arbitrale beslissing en de redenen die daaraan ten grondslag liggen.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel9
  - number: '9.3'
    text: |-
      Het advies of de arbitrale uitspraak wordt gedagtekend en door ieder van de optredende leden van de Advies- en
      Arbitragecommissie ondertekend.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel9
  - number: '9.4'
    text: |-
      De voorzitter van de Advies- en Arbitragecommissie draagt er zorg voor dat het advies of de arbitrale uitspraak
      binnen vier weken nadat de kennisgeving, bedoeld in [artikel 7][ref1], is ontvangen, aan de deelnemers aan het
      overleg ter kennis wordt gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel7
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 9a.1
    text: |-
      De eed of belofte, bedoeld in [artikel 1g, eerste lid, van de wet][ref1], wordt wanneer deze wordt afgenomen ten
      overstaan van een gerecht, afgenomen op requisitoir van het openbaar ministerie dan wel van de procureur-generaal
      bij de Hoge Raad.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel1g
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 1g
  - number: 9a.2
    text: 'De eed wordt afgelegd:'
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel9a
  - number: 9a.2.a
    text: 'ten overstaan van een enkelvoudige- of meervoudige kamer van de rechtbank door:'
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel9a
  - number: 9a.2.a.1°
    text: |-
      de coördinerend vice-presidenten senior van, de coördinerend-vice presidenten van, de vice-presidenten van en de
      rechters in die rechtbank;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel9a
  - number: 9a.2.a.2°
    text: de rechters-plaatsvervangers in die rechtbank;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel9a
  - number: 9a.2.a.3°
    text: de gerechtsauditeurs bij die rechtbank;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel9a
  - number: 9a.2.a.4°
    text: |-
      de officieren van justitie en de officieren enkelvoudige zittingen bij het arrondissementsparket en het landelijk
      parket die zijn gevestigd in de plaats van vestiging van die rechtbank;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel9a
  - number: 9a.2.a.5°
    text: |-
      de plaatsvervangende officieren van justitie en de plaatsvervangend officieren enkelvoudige zittingen bij het
      arrondissementsparket en het landelijk parket die zijn gevestigd in de plaats van vestiging van die rechtbank.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel9a
  - number: 9a.2.b
    text: 'ten overstaan van een enkelvoudige- of meervoudige kamer van het gerechtshof, door:'
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel9a
  - number: 9a.2.b.1°
    text: |-
      de coördinerend vice-presidenten senior van, de coördinerend vice-presidenten van, de vice-presidenten van en de
      raadsheren in dat gerechtshof;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel9a
  - number: 9a.2.b.2°
    text: de raadsheren-plaatsvervangers in dat gerechtshof;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel9a
  - number: 9a.2.b.3°
    text: de gerechtsauditeurs bij dat gerechtshof;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel9a
  - number: 9a.2.b.4°
    text: de advocaten-generaal bij het ressortsparket dat is gevestigd in de plaats van vestiging van dat gerechtshof;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel9a
  - number: 9a.2.b.5°
    text: |-
      de plaatsvervangende advocaten-generaal bij het ressortsparket dat is gevestigd in de plaats van vestiging van
      dat gerechtshof.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel9a
  - number: 9a.2.c
    text: 'ten overstaan van de president van de Hoge Raad door:'
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel9a
  - number: 9a.2.c.1°
    text: de procureurs-generaal die het College van procureurs-generaal vormen;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel9a
  - number: 9a.2.c.2°
    text: de substituut-griffiers van de Hoge Raad;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel9a
  - number: 9a.2.c.3°
    text: de gerechtsauditeurs bij de Hoge Raad;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel9a
  - number: 9a.2.d
    text: 'ten overstaan van de Koning of ten overstaan van Onze Minister, daartoe door de Koning gemachtigd, door:'
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel9a
  - number: 9a.2.d.1°
    text: de president van, de vice-presidenten van en de raadsheren in de Hoge Raad;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel9a
  - number: 9a.2.d.2°
    text: de procureur-generaal bij, de plaatsvervangend procureur-generaal bij en de advocaten-generaal bij de Hoge Raad;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel9a
  - number: 9a.2.d.3°
    text: de griffier van de Hoge Raad.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel9a
  - number: 9a.3
    text: |-
      Het formulier, bedoeld in [artikel 1g, eerste lid van de wet][ref1], wordt na het afleggen van de eed of belofte
      ondertekend door de rechterlijk ambtenaar, de rechterlijk ambtenaar met rechtspraak belast die zitting heeft in een
      enkelvoudige kamer dan wel de voorzitter van de meervoudige kamer, bedoeld in het tweede lid, dan wel de president
      van de Hoge Raad dan wel de Koning of Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel1g
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 1g
  - number: 9b.1
    text: |-
      Het bestuur van een gerechtshof of een rechtbank houdt een register bij, waarin de koninklijke besluiten
      betreffende de benoeming van de daar beëdigde rechterlijke ambtenaren en de formulieren betreffende de afgelegde
      eed of belofte worden bewaard.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel9b
  - number: 9b.2
    text: |-
      Een uittreksel uit dat register, inclusief het formulier betreffende de eed of belofte, wordt aan de rechterlijk
      ambtenaar uitgereikt.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel9b
  - number: 9b.3
    text: |-
      De griffier van de Hoge Raad houdt een afzonderlijk register bij, waarin de benoeming van rechterlijke ambtenaren
      bij de Hoge Raad wordt ingeschreven. Tevens houdt de griffier van de Hoge Raad een register bij waarin de
      koninklijke besluiten worden ingeschreven, bevattende de benoeming van rechterlijke ambtenaren die voor een
      beëdiging bij de Hoge Raad zijn toegelaten. Tevens worden in dit register de formulieren betreffende de afgelegde
      eed of belofte bewaard.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel9b
  - number: 9c.1
    text: |-
      De installatie, bedoeld in [artikel 1g, derde lid, van de wet][ref1], geschiedt door middel van het op een
      terechtzitting voorlezen van het formulier, bedoeld in [artikel 1g, eerste lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel1g
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel1g
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel9c
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 1g
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 1g
  - number: 9c.2
    text: |-
      In geval van een opvolgende benoeming binnen een zelfde gerecht of parket, kan de functionele autoriteit bepalen
      dat de installatie achterwege blijft.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel9c
  - number: 9c.3
    text: |-
      De raadsheren in buitengewone dienst van de Hoge Raad, de advocaten-generaal in buitengewone dienst van de Hoge
      Raad, de raadsheren plaatsvervangers, de rechters-plaatsvervangers, de leden van het College van procureurs-
      generaal, de plaatsvervangende advocaten-generaal bij de ressortsparketten, de plaatsvervangende officieren van
      justitie en de gerechtsauditeurs worden niet geïnstalleerd.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel9c
  - number: '10'
    text: 'In dit hoofdstuk wordt onder rechterlijk ambtenaar mede verstaan: rechterlijk ambtenaar in opleiding.'
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel10
  - number: '11.1'
    text: |-
      Onverminderd hetgeen terzake is bepaald in de [Arbeidsomstandighedenwet 1998][ref1] geniet de rechterlijk ambtenaar
      arbeidsgezondheidskundige begeleiding op basis van dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0010346
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0010346
  - number: '11.2'
    text: |-
      De functionele autoriteit is verantwoordelijk voor de begeleiding van verzuim en de arbeidsgezondheidskundige
      begeleiding van de rechterlijk ambtenaar.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel11
  - number: '11.3'
    text: |-
      Onze Minister kan regels vaststellen met betrekking tot de wijze waarop invulling wordt gegeven aan de begeleiding
      van verzuim, de arbeidsgezondheidskundige begeleiding en de daarbij in acht te nemen procedures. Van het
      vaststellen van deze regels kan Onze Minister mandaat verlenen.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel11
  - number: '12.1'
    text: |-
      De rechterlijk ambtenaar geeft in geval van ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte hiervan
      zo spoedig mogelijk, doch uiterlijk op de tweede dag van die ongeschiktheid, kennis aan de functionele autoriteit.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel12
  - number: '12.2'
    text: |-
      Ten aanzien van de rechterlijk ambtenaar die wegens ziekte ongeschikt is geweest om zijn arbeid te verrichten, kan
      de functionele autoriteit bepalen dat de rechterlijk ambtenaar zijn arbeid slechts mag hervatten nadat hiervoor
      door hem toestemming is verleend.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel12
  - number: '12.3'
    text: |-
      De rechterlijk ambtenaar die wegens ziekte gedurende een jaar of langer volledig ongeschikt is geweest om zijn
      arbeid te verrichten, mag zijn arbeid slechts hervatten nadat de functionele autoriteit hiervoor toestemming heeft
      verleend.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel12
  - number: '12.4'
    text: |-
      De functionele autoriteit verleent de in het tweede en het derde lid bedoelde toestemming eerst nadat er een
      medisch advies is.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel12
  - number: '13.1'
    text: 'De rechterlijk ambtenaar kan worden verplicht om een arbeidsgezondheidskundig onderzoek te ondergaan:'
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel13
  - number: 13.1.a
    text: |-
      indien de functionele autoriteit gegronde redenen heeft om te twijfelen aan de goede gezondheidstoestand van de
      rechterlijk ambtenaar;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel13
  - number: 13.1.b
    text: |-
      indien de rechterlijk ambtenaar niet meer volledig geschikt is gebleken voor het verrichten van zijn arbeid,
      teneinde na te gaan of hiervoor medische oorzaken aanwezig zijn, en zo ja, of de rechterlijk ambtenaar geschikt kan
      worden geacht voor het verrichten van andere arbeid;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel13
  - number: 13.1.c
    text: |-
      ter beantwoording van de vraag of de rechterlijk ambtenaar tijdens het tijdvak waarin hij wegens ziekte ongeschikt
      is om zijn arbeid te verrichten, in het belang van zijn genezing arbeid mag verrichten en om vast te stellen welke
      arbeid wenselijk wordt geacht;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel13
  - number: 13.1.d
    text: |-
      ter beantwoording van de vraag of, in welke mate en tot welk tijdstip de rechterlijk ambtenaar ongeschikt is tot
      het verrichten van zijn arbeid wegens ziekte;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel13
  - number: 13.1.e
    text: |-
      om te beoordelen of de rechterlijk ambtenaar die wegens ziekte ongeschikt is geweest om zijn arbeid te verrichten
      zijn arbeid mag hervatten; of
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel13
  - number: 13.1.f
    text: voorzover dit voortvloeit uit enige wettelijke verplichting.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel13
  - number: '13.2'
    text: |-
      De functionele autoriteit verleent de rechterlijk ambtenaar, gehoord deze laatste, ziekteverlof indien na
      een arbeidsgezondheidskundig onderzoek als bedoeld in het eerste lid, blijkt dat sprake is van een zodanige
      lichamelijke of geestelijke toestand dat de belangen van de rechterlijk ambtenaar, van de arbeid of van bij het
      verrichten van de arbeid betrokken derden zich er tegen verzetten dat de rechterlijk ambtenaar zijn arbeid blijft
      verrichten.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel13
  - number: '13.3'
    text: |-
      Ziekteverlof als bedoeld in het tweede lid wordt niet verleend indien de rechterlijk ambtenaar andere passende
      werkzaamheden kunnen worden opgedragen.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel13
  - number: '13.4'
    text: |-
      Indien ziekteverlof als bedoeld in het tweede lid wordt verleend, wordt de rechterlijk ambtenaar geacht wegens
      ziekte ongeschikt te zijn tot het verrichten van zijn arbeid en zijn de overige bepalingen van dit hoofdstuk van
      toepassing. De functionele autoriteit kan ter effectuering van bedoeld ziekteverlof maatregelen treffen.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel13
  - number: '14.1'
    text: |-
      Het medisch advies dat wordt uitgebracht naar aanleiding van een arbeidsgezondheidskundig onderzoek als bedoeld
      in [artikel 13][ref1], wordt zo spoedig mogelijk aan de rechterlijk ambtenaar en de functionele autoriteit
      schriftelijk medegedeeld. De rechterlijk ambtenaar wordt daarbij gewezen op de in het tweede lid bedoelde
      mogelijkheid om een hernieuwd onderzoek te verzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel13
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '14.2'
    text: |-
      De rechterlijk ambtenaar kan de deskundige persoon of de arbodienst binnen drie dagen na ontvangst van het medisch
      advies schriftelijk om een hernieuwd onderzoek verzoeken indien hij het niet eens is met het medisch advies. De
      deskundige persoon of de arbodienst stelt de functionele autoriteit in kennis van een ingediend verzoek als bedoeld
      in de vorige volzin.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel14
  - number: '14.3'
    text: |-
      Zo spoedig mogelijk na ontvangst van het schriftelijke verzoek als bedoeld in het tweede lid, doch uiterlijk binnen
      vier weken, vindt het hernieuwd onderzoek door een commissie van drie artsen plaats. De rechterlijk ambtenaar kan
      worden verplicht om in het kader hiervan een onderzoek te ondergaan.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel14
  - number: '14.4'
    text: |-
      Op verzoek van de rechterlijk ambtenaar wordt zijn behandelend arts in de gelegenheid gesteld mondeling of
      schriftelijk zijn mening aan de commissie van drie artsen kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel14
  - number: '14.5'
    text: |-
      De kosten van het hernieuwd onderzoek komen voor rekening van Onze Minister. Eventuele reis- en verblijfkosten van
      de rechterlijk ambtenaar worden hem vergoed overeenkomstig de regels die gelden voor burgerlijke rijksambtenaren.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel14
  - number: 14a.1
    text: |-
      Indien een geschil bestaat tussen de rechterlijk ambtenaar en diens functionele autoriteit over het
      al dan niet bestaan van ongeschiktheid tot werken wegens ziekte, kan de rechterlijk ambtenaar of diens
      functionele autoriteit het UWV verzoeken een onderzoek in te stellen en een oordeel te geven als bedoeld in
      [artikel 30, eerste lid, onderdeel e, van de Wet Suwi][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '30'
  - number: 14a.2
    text: |-
      De kosten van het onderzoek, bedoeld in het eerste lid, komen voor rekening van Onze Minister. Eventuele reis- en
      verblijfkosten van de rechterlijk ambtenaar worden hem vergoed overeenkomstig de regels die gelden voor burgerlijke
      rijksambtenaren.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel14a
  - number: '15.1'
    text: |-
      De leden van de commissie, bedoeld in [artikel 14, derde en vierde lid][ref1], worden per verzoek om een hernieuwd
      onderzoek aangewezen door Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel14
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '15.2'
    text: |-
      De arts die betrokken is geweest bij het opstellen van het medisch advies naar aanleiding waarvan om een hernieuwd
      onderzoek wordt gevraagd, heeft in de commissie geen zitting.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel15
  - number: '15.3'
    text: |-
      De commissie deelt haar oordeel schriftelijk mede aan de rechterlijk ambtenaar, de functionele autoriteit en de
      behandelend arts, bedoeld in [artikel 14, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel14
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '16'
    text: |-
      De [artikelen 13 tot en met 15][ref1] zijn van overeenkomstige toepassing op de gewezen rechterlijk ambtenaar
      voorzover het zijn aanspraken op basis van dit hoofdstuk betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel13
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '17.1'
    text: |-
      De rechterlijk ambtenaar heeft bij ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte gedurende een
      tijdvak van 52 weken recht op de doorbetaling van zijn bezoldiging.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel17
  - number: '17.2'
    text: |-
      De rechterlijk ambtenaar die na afloop van het in het eerste lid bedoelde tijdvak nog ongeschikt is wegens ziekte
      tot het verrichten van zijn arbeid, heeft aanspraak op de doorbetaling van 70% van zijn bezoldiging.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel17
  - number: '17.3'
    text: |-
      In afwijking van het tweede lid heeft de rechterlijk ambtenaar na afloop van het in het eerste lid bedoelde tijdvak
      aanspraak op de doorbetaling van zijn bezoldiging over de uren dat hij passende arbeid verricht of zou hebben
      verricht indien die arbeid hem zou zijn aangeboden.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel17
  - number: '17.4'
    text: |-
      Aan de rechterlijk ambtenaar wordt op zijn aanvraag na afloop van het in het eerste lid bedoelde tijdvak, in
      afwijking van het tweede lid, zijn bezoldiging doorbetaald, indien de ziekte uit hoofde waarvan hij ongeschikt is
      om zijn arbeid te verrichten wordt veroorzaakt door een dienstongeval of een door het verrichten van zijn arbeid
      opgelopen beroepsziekte.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel17
  - number: '18.1'
    text: |-
      De gewezen rechterlijk ambtenaar die wegens ziekte, ontstaan voor het tijdstip van ingang van zijn ontslag, na zijn
      ontslag anders dan op grond van [artikel 36, eerste lid, onderdeel f][ref1], of [artikel 36a][ref2] van dit besluit
      onderscheidenlijk [artikel 46i van de wet][ref3], nog ongeschikt is om een naar aard en omvang soortgelijke taak te
      verrichten, heeft:


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0006530#Artikel36a
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel46i
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '36'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0006530
        artikel: 36a
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0008365
        artikel: 46i
  - number: 18.1.a
    text: |-
      zolang hij ongeschikt is tot het verrichten van arbeid wegens ziekte en voor ten hoogste het met ingang van zijn
      ontslag nog resterende gedeelte van het tijdvak van 52 weken, aanspraak op de doorbetaling van zijn laatstelijk
      genoten bezoldiging; en
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel18
  - number: 18.1.b
    text: |-
      zolang hij na het tijdvak van 52 weken nog ongeschikt is tot het verrichten van zijn arbeid wegens ziekte en
      voor ten hoogste een tijdvak van 26 weken, aanspraak op de doorbetaling van 70% van zijn laatstelijk genoten
      bezoldiging.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel18
  - number: '18.2'
    text: |-
      De gewezen rechterlijk ambtenaar die binnen een maand na het tijdstip van zijn ontslag ongeschikt wordt wegens
      ziekte om een naar aard en omvang soortgelijke taak te verrichten, heeft, zolang hij wegens ziekte ongeschikt is en
      voor een tijdvak van ten hoogste 52 weken, aanspraak op de doorbetaling van zijn laatstelijk genoten bezoldiging,
      indien hij gedurende ten minste twee maanden onmiddellijk voorafgaand aan het ontslag als rechterlijk ambtenaar
      aangesteld is geweest.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel18
  - number: '18.3'
    text: |-
      Aan de gewezen rechterlijk ambtenaar wordt op zijn aanvraag, in afwijking van het eerste onderscheidenlijk tweede
      lid, zolang hij ongeschikt is tot het verrichten van arbeid wegens ziekte en voor ten hoogste het met ingang van
      zijn ontslag nog resterende deel van een tijdvak van 104 weken onderscheidenlijk een tijdvak van ten hoogste 104
      weken, zijn laatstelijk genoten bezoldiging doorbetaald, indien de ziekte uit hoofde waarvan hij ongeschikt is om
      arbeid te verrichten wordt veroorzaakt door een dienstongeval of een door het verrichten van zijn arbeid opgelopen
      beroepsziekte.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel18
  - number: '18.4'
    text: |-
      Aan de gewezen rechterlijk ambtenaar, die aanspraak heeft op een WAO-uitkering op grond van de aan zijn
      ontslag voorafgaande aanstelling, wordt op zijn aanvraag een aanvullende uitkering toegekend, indien de
      arbeidsongeschiktheid is veroorzaakt door een dienstongeval of een door het verrichten van zijn arbeid opgelopen
      beroepsziekte.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel18
  - number: '18.5'
    text: 'De in het derde lid bedoelde aanvullende uitkering is gelijk aan het verschil tussen:'
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel18
  - number: 18.5.a
    text: |-
      een percentage van de bezoldiging die de gewezen rechterlijk ambtenaar in het jaar voorafgaand aan zijn ontslag
      heeft genoten; en
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel18
  - number: 18.5.b
    text: |-
      de aan hem toegekende WAO-uitkering, in voorkomend geval vermeerderd met een hem toegekend invaliditeitspensioen of
      een hem toegekende herplaatsingstoelage.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel18
  - number: '18.6'
    text: |-
      Het percentage, bedoeld in het vierde lid, onderdeel a, is afhankelijk van de mate van arbeidsongeschiktheid en
      bedraagt bij een arbeidsongeschiktheid van: 80% of meer: 90,02%; 65 tot 80%: 65,26%; 55 tot 65%: 54,01%; 45 tot
      55%: 45,01%; 35 tot 45%: 36,01%; 25 tot 35%: 27,01%; 15 tot 25%: 18,00%.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel18
  - number: '18.7'
    text: |-
      Geen recht op een aanvullende uitkering als bedoeld in het derde lid heeft de gewezen rechterlijk ambtenaar die
      recht heeft op suppletie overeenkomstig [artikel 33][ref1]. In afwijking van de eerste volzin heeft de gewezen
      rechterlijk ambtenaar, bedoeld in het derde lid, wel recht op een aanvullende uitkering, indien zijn recht op
      suppletie niet tot uitbetaling komt ingevolge [artikel 4][ref2] van de in [artikel 33][ref3] van overeenkomstige
      toepassing verklaarde [Suppletieregeling gedeeltelijk arbeidsongeschikten sector Rijk][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0006530#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0006530#Artikel33
      [ref4]: https://wetten.overheid.nl/BWBR0007758
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0006530
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0006530
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '7'
      - id: ref4
        bwb_id: BWBR0007758
  - number: '18.8'
    text: |-
      De gewezen rechterlijk ambtenaar aan wie op eigen verzoek ontslag is verleend met het oog op een uitkering op
      grond van de Regeling flexibel pensioen en uittreden, bedoeld in artikel 3 van de Centrale vut-overeenkomst en
      artikel 1.5 van het pensioenreglement, heeft slechts aanspraak op de doorbetaling van zijn laatstelijk genoten
      bezoldiging onderscheidenlijk 70% van de laatstelijk genoten bezoldiging, voorzover deze tezamen met de aanvullende
      uitkering, bedoeld in artikel 4 van het FPU-reglement basis- en aanvullende uitkering, de laatstgenoten bezoldiging
      onderscheidenlijk 70% van de laatstgenoten bezoldiging niet overschrijdt.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel18
  - number: '19.1'
    text: |-
      De rechterlijk ambtenaar, die op grond van [artikel 35][ref1] van dit besluit onderscheidenlijk
      [artikel 46k van de wet][ref2] is herplaatst voordat de termijn van twee jaar, bedoeld
      in [artikel 36, derde lid, onderdeel a][ref3], van dit besluit onderscheidenlijk
      [artikel 46i, eerste lid, onderdeel a, van de wet][ref4] is verstreken, heeft tot het einde van die termijn
      aanspraak op een aanvullende uitkering, indien zijn bezoldiging als gevolg van die herplaatsing vermindering
      ondergaat, ter grootte van het verschil tussen:


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46k
      [ref3]: https://wetten.overheid.nl/BWBR0006530#Artikel36
      [ref4]: https://wetten.overheid.nl/BWBR0008365#Artikel46i
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '35'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 46k
      - id: ref3
        bwb_id: BWBR0006530
        artikel: '36'
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0008365
        artikel: 46i
  - number: 19.1.a
    text: |-
      het bedrag waarop de rechterlijk ambtenaar op grond van [artikel 17][ref1] recht zou hebben gehad indien hem geen
      andere taak zou zijn opgedragen, maar in plaats daarvan zijn eigen taak met dezelfde omvang; en


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel17
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 19.1.b
    text: zijn bezoldiging na herplaatsing.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel19
  - number: '19.2'
    text: |-
      Aan de rechterlijk ambtenaar, die is herplaatst op grond van [artikel 35][ref1] van dit besluit onderscheidenlijk
      [artikel 46k van de wet][ref2], wordt op zijn aanvraag na afloop van de termijn van twee jaar, bedoeld in het
      eerste lid, een aanvullende uitkering toegekend, indien de ziekte uit hoofde waarvan hij ongeschikt is om zijn
      arbeid te verrichten, wordt veroorzaakt door een dienstongeval of een door het verrichten van zijn arbeid opgelopen
      beroepsziekte, ter grootte van het verschil tussen:


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46k
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '35'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 46k
  - number: 19.2.a
    text: |-
      een percentage van zijn bezoldiging, zoals die zou zijn op de dag voorafgaand aan zijn herplaatsing indien hij op
      die dag niet ongeschikt zou zijn geweest om zijn arbeid te verrichten; en
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel19
  - number: 19.2.b
    text: |-
      zijn bezoldiging na herplaatsing, in voorkomend geval vermeerderd met een uit de oorspronkelijke taak voortvloeiend
      recht op een WAO-uitkering, een invaliditeitspensioen of een herplaatsingstoelage.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel19
  - number: '19.3'
    text: |-
      Het percentage, bedoeld in het tweede lid, onderdeel a, is afhankelijk van de mate van arbeidsongeschiktheid en
      bedraagt bij een arbeidsongeschiktheid van: 80% of meer: 90,02%; 65 tot 80%: 65,26%; 55 tot 65%: 54,01%; 45 tot
      55%: 45,01%; 35 tot 45%: 36,01%; 25 tot 35%: 27,01%; 15 tot 25%: 18,00%.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel19
  - number: 19a
    text: |-
      Een vrouwelijke rechterlijk ambtenaar of vrouwelijke gewezen rechterlijk ambtenaar heeft geen recht op
      doorbetaling van bezoldiging krachtens [artikel 17][ref1] of [18][ref2] gedurende de periode dat zij zwangerschaps-
      en bevallingsverlof als bedoeld in [artikel 3:1 van de Wet arbeid en zorg][ref3] geniet of op basis van
      [artikel 26, eerste tot en met vierde lid][ref4], haar laatstelijk genoten bezoldiging geniet.


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0006530#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0006530#Artikel26
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006530
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0006530
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '20.1'
    text: |-
      De rechterlijk ambtenaar en de gewezen rechterlijk ambtenaar hebben geen aanspraak op de doorbetaling van
      bezoldiging:
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel20
  - number: 20.1.a
    text: |-
      indien de ziekte is voorgewend, althans zodanig overdreven wordt voorgesteld, dat ongeschiktheid tot het verrichten
      van arbeid wegens ziekte niet kan worden aangenomen;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel20
  - number: 20.1.b
    text: |-
      indien hij de ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte opzettelijk heeft veroorzaakt, tenzij
      hem daarvan op grond van psychische toestand geen verwijt kan worden gemaakt; of
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel20
  - number: 20.1.c
    text: |-
      indien de ongeschiktheid tot het verrichten van arbeid wegens ziekte zich voordoet binnen een half jaar na een
      geneeskundig onderzoek – indien dat heeft plaatsgehad in verband met zijn aanstelling – en blijkt dat hij hierbij
      onjuiste informatie omtrent zijn gezondheidstoestand heeft verstrekt of gegevens heeft verzwegen, ten gevolge
      waarvan de verklaring van geschiktheid om de desbetreffende taak te verrichten, ten onrechte heeft plaatsgevonden,
      tenzij de rechterlijk ambtenaar aannemelijk maakt dat hij te goeder trouw heeft gehandeld.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel20
  - number: '20.2'
    text: |-
      De gewezen rechterlijk ambtenaar heeft geen aanspraak op de doorbetaling van laatstelijk genoten bezoldiging,
      indien hij op grond van een aanvaarde andere betrekking van gelijke omvang aanspraak kan maken op loon of
      bezoldiging dan wel een ZW-uitkering.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel20
  - number: '21.1'
    text: |-
      Het tijdvak gedurende welke de rechterlijk ambtenaar en de gewezen rechterlijk ambtenaar aanspraak
      hebben op de doorbetaling van de bezoldiging, bedoeld in de [artikelen 17, eerste lid][ref1], en
      [18, eerste lid, onderdeel a, tweede en derde lid][ref2], vangt aan op de eerste dag waarop:


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0006530#Artikel18
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006530
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 21.1.a
    text: wegens ziekte geheel of gedeeltelijk niet is gewerkt;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel21
  - number: 21.1.b
    text: het werken wegens ziekte geheel of gedeeltelijk is gestaakt;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel21
  - number: 21.1.c
    text: wegens ziekte geheel of gedeeltelijk niet zou zijn gewerkt; of
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel21
  - number: 21.1.d
    text: het werken wegens ziekte geheel of gedeeltelijk zou zijn gestaakt.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel21
  - number: '21.2'
    text: |-
      Voor het bepalen van het einde van het in het eerste lid bedoelde tijdvak worden perioden van ongeschiktheid tot
      het verrichten van arbeid wegens ziekte samengeteld, indien:
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel21
  - number: 21.2.a
    text: zij elkaar met een onderbreking van minder dan vier weken opvolgen; of
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel21
  - number: 21.2.b
    text: |-
      de ene periode van ongeschiktheid direct voorafgaat aan en de andere periode van ongeschiktheid
      direct aansluit op het tijdvak gedurende welke zwangerschaps- en bevallingsverlof als bedoeld
      in [artikel 3:1 van de Wet arbeid en zorg][ref1] wordt genoten dan wel bezoldiging op basis van
      [artikel 26, eerste tot en met vierde lid][ref2], van dit besluit wordt ontvangen, en de ongeschiktheid in deze
      perioden redelijkerwijs geacht kan worden voort te vloeien uit dezelfde oorzaak.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006530#Artikel26
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0006530
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '21.3'
    text: |-
      Het tijdvak van 26 weken gedurende welke de gewezen rechterlijk ambtenaar aanspraak heeft op de doorbetaling van
      bezoldiging, bedoeld in [artikel 18, eerste lid, onderdeel b][ref1], vangt aan op de dag nadat het tijdvak, bedoeld
      in [artikel 18, eerste lid, onderdeel a][ref2], is geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0006530#Artikel18
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006530
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '21.4'
    text: |-
      Voor het bepalen van het einde van het in het derde lid bedoelde tijdvak van 26 weken worden perioden van
      ongeschiktheid tot het verrichten van arbeid wegens ziekte samengeteld, indien:
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel21
  - number: 21.4.a
    text: zij elkaar met een onderbreking van minder dan vier weken opvolgen; of
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel21
  - number: 21.4.b
    text: |-
      de ene periode van ongeschiktheid direct voorafgaat aan en de andere periode van ongeschiktheid
      direct aansluit op het tijdvak gedurende welke zwangerschaps- en bevallingsverlof als bedoeld
      in [artikel 3:1 van de Wet arbeid en zorg][ref1] wordt genoten dan wel bezoldiging op basis van
      [artikel 26, eerste tot en met vierde lid][ref2], van dit besluit wordt ontvangen, en de ongeschiktheid in deze
      perioden redelijkerwijs geacht kan worden voort te vloeien uit dezelfde oorzaak.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006530#Artikel26
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0006530
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '21.5'
    text: |-
      Bij buitengewoon verlof zonder behoud van bezoldiging vangt het tijdvak, bedoeld in het eerste lid, aan op de dag
      volgende op die waarop het buitengewoon verlof is beëindigd.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel21
  - number: '22.1'
    text: |-
      De doorbetaling van bezoldiging, bedoeld in [artikel 17, eerste tot en met vierde lid][ref1], eindigt na ommekomst
      van de uitkeringsduur, maar in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel17
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 22.1.a
    text: |-
      met ingang van de dag waarop de rechterlijk ambtenaar op grond van [artikel 35][ref1] van dit besluit
      onderscheidenlijk [artikel 46k van de wet][ref2] is herplaatst;


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46k
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '35'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 46k
  - number: 22.1.b
    text: met ingang van de dag waarop de rechterlijk ambtenaar ontslag is verleend; of
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel22
  - number: 22.1.c
    text: met ingang van de dag volgende op die waarop de rechterlijk ambtenaar is overleden.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel22
  - number: '22.2'
    text: |-
      De aanvullende uitkering, bedoeld in [artikel 19][ref1], eindigt na ommekomst van de uitkeringsduur, maar in ieder
      geval:


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel19
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 22.2.a
    text: |-
      met ingang van de dag waarop de rechterlijk ambtenaar niet meer voldoet aan de in bedoelde artikelleden genoemde
      voorwaarden;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel22
  - number: 22.2.b
    text: met ingang van de dag waarop de rechterlijk ambtenaar ontslag is verleend; of
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel22
  - number: 22.2.c
    text: met ingang van de dag volgende op die waarop de rechterlijk ambtenaar is overleden.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel22
  - number: '22.3'
    text: |-
      De doorbetaling van bezoldiging, bedoeld in [artikel 18, eerste tot en met derde lid][ref1], eindigt na ommekomst
      van de uitkeringsduur, maar in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel18
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 22.3.a
    text: |-
      met ingang van de dag waarop de gewezen rechterlijk ambtenaar op grond van een aanvaarde andere betrekking van
      gelijke omvang aanspraak maakt op loon of bezoldiging;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel22
  - number: 22.3.b
    text: |-
      met ingang van de eerste dag van de maand volgende op die waarin de gewezen rechterlijk ambtenaar de leeftijd van
      65 jaar onderscheidenlijk, indien het een gewezen voor het leven benoemde rechterlijk ambtenaar betreft, 70 jaar
      heeft bereikt; of
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel22
  - number: 22.3.c
    text: met ingang van de dag volgende op die waarop de gewezen rechterlijk ambtenaar is overleden.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel22
  - number: '22.4'
    text: |-
      De aanvullende uitkering, bedoeld in [artikel 18, vierde tot en met zesde lid][ref1], eindigt:


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel18
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 22.4.a
    text: |-
      met ingang van de dag waarop de gewezen rechterlijk ambtenaar niet meer voldoet aan de in
      [artikel 18, derde lid][ref1], genoemde voorwaarden;


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel18
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 22.4.b
    text: |-
      met ingang van de eerste dag van de maand waarin de gewezen rechterlijk ambtenaar de leeftijd van 65 jaar heeft
      bereikt; of
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel22
  - number: 22.4.c
    text: met ingang van de dag volgende op die waarop de gewezen rechterlijk ambtenaar is overleden.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel22
  - number: '23.1'
    text: |-
      De aanspraak van de rechterlijk ambtenaar of de gewezen rechterlijk ambtenaar op de doorbetaling van bezoldiging,
      bedoeld in de [artikelen 17][ref1] en [18, eerste tot en met derde lid][ref2], vervalt indien de rechterlijk
      ambtenaar of de gewezen rechterlijk ambtenaar:


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0006530#Artikel18
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006530
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 23.1.a
    text: niet binnen een redelijke termijn gezondheidskundige hulp inroept;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel23
  - number: 23.1.b
    text: zich niet gedurende het gehele verloop van de ziekte onder gezondheidskundige behandeling blijft stellen;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel23
  - number: 23.1.c
    text: de voorschriften van de behandelend arts niet opvolgt;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel23
  - number: 23.1.d
    text: zich schuldig maakt aan gedragingen waardoor zijn genezing wordt belemmerd;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel23
  - number: 23.1.e
    text: |-
      verzuimt de deskundige persoon of de arbodienst op eerste aanvraag mede te delen om welke reden hij ongeschikt is
      tot het verrichten van arbeid;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel23
  - number: 23.1.f
    text: |-
      zonder deugdelijke grond nalaat gevolg te geven aan een verzoek van de deskundige persoon of de arbodienst om te
      verschijnen;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel23
  - number: 23.1.g
    text: |-
      er de oorzaak van is dat het arbeidsgezondheidskundig onderzoek door een door de deskundige persoon of de
      arbodienst aangewezen arts niet kan plaatshebben;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel23
  - number: 23.1.h
    text: |-
      niet binnen twee dagen na de aanvang van de ongeschiktheid tot het verrichten van arbeid wegens ziekte dit heeft
      gemeld bij de functionele autoriteit;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel23
  - number: 23.1.i
    text: |-
      weigert passende arbeid, waartoe de deskundige persoon of de arbodienst hem in staat acht, te verkrijgen of te
      aanvaarden, dan wel, indien hij hiertoe in de gelegenheid wordt gesteld, te verrichten;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel23
  - number: 23.1.j
    text: |-
      zich niet houdt aan de ten aanzien van hem geldende regels met betrekking tot de wijze waarop invulling wordt
      gegeven aan de verzuimbegeleiding, de arbeidsgezondheidskundige begeleiding en de daarbij in acht te nemen
      procedures;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel23
  - number: 23.1.k
    text: |-
      weigert inzage te geven in een op hem betrekking hebbend document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1] of een geldig rijbewijs als bedoeld in artikel 9, eerste
      lid, van de Wegenverkeerswet, voorzover dit redelijkerwijs nodig is voor de uitvoering van wetten;


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 23.1.l
    text: |-
      tijdens de ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte arbeid voor zichzelf of voor derden
      verricht, tenzij dit door de deskundige persoon of de arbodienst in het belang van zijn genezing wenselijk wordt
      geacht;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel23
  - number: 23.1.m
    text: |-
      voorafgaand aan de betaling van bezoldiging weigert mededeling te doen van inkomsten uit arbeid die hij heeft
      in verband met het verrichten van door de deskundige persoon of de arbodienst in het belang van zijn genezing
      wenselijk geachte arbeid voor zichzelf of voor derden;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel23
  - number: 23.1.n
    text: |-
      niet onverwijld op verzoek of uit eigen beweging alle feiten en omstandigheden mededeelt, waarvan hem
      redelijkerwijs duidelijk moet zijn dat zij van invloed kunnen zijn op het recht of op de hoogte van de betaling
      van bezoldiging;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel23
  - number: 23.1.o
    text: |-
      zijn arbeid verzuimt te hervatten op het door de deskundige persoon of de arbodienst bepaalde tijdstip en in de
      door deze dienst bepaalde mate, indien zulks hem is opgedragen, tenzij hij daarvoor een door de deskundige persoon
      of de arbodienst als geldig erkende reden heeft opgegeven;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel23
  - number: 23.1.p
    text: |-
      zonder deugdelijke grond weigert gevolg te geven onderscheidenlijk mee te werken aan door de functionele autoriteit
      of een door de functionele autoriteit aangewezen deskundige gegeven redelijke voorschriften onderscheidenlijk
      getroffen maatregelen die erop gericht zijn om de betrokkene in staat te stellen passende arbeid te verrichten;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel23
  - number: 23.1.q
    text: |-
      zonder deugdelijke grond weigert mee te werken aan het opstellen, evalueren en bijstellen van een plan van aanpak
      als bedoeld in [artikel 71a, tweede lid, van de WAO][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 71a
  - number: 23.1.r
    text: zijn medewerking weigert bij de doelmatige uitvoering van de bepalingen van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel23
  - number: '23.2'
    text: |-
      De ingevolge het eerste lid vervallen aanspraak herleeft met ingang van het tijdstip waarop de rechterlijk
      ambtenaar of de gewezen rechterlijk ambtenaar alsnog gevolg geeft aan de desbetreffende verplichting op grond van
      dat lid.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel23
  - number: '23.3'
    text: |-
      Onze Minister kan op grond van bijzondere omstandigheden bepalen dat de in het eerste lid bedoelde aanspraak niet
      vervalt, maar geheel of ten dele aan anderen dan aan de rechterlijk ambtenaar of de gewezen rechterlijk ambtenaar
      zal worden uitbetaald.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel23
  - number: '23.4'
    text: |-
      Voorzover Onze Minister van de bevoegdheid, bedoeld in het derde lid, geen gebruik heeft gemaakt, wordt de niet
      uitbetaalde bezoldiging alsnog aan de rechterlijk ambtenaar of de gewezen rechterlijk ambtenaar uitbetaald,
      indien het oordeel, bedoeld in [artikel 30, eerste lid, onderdeel e, van de Wet Suwi][ref1], ten gunste van de
      rechterlijk ambtenaar of de gewezen rechterlijk ambtenaar uitvalt of indien de in [artikel 14, derde lid][ref2],
      bedoelde commissie van drie artsen ten gunste van de rechterlijk ambtenaar of de gewezen rechterlijk ambtenaar
      heeft geoordeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0006530#Artikel14
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '30'
      - id: ref2
        bwb_id: BWBR0006530
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 24a.1
    text: |-
      De functionele autoriteit treft zo tijdig mogelijk zodanige maatregelen en geeft zo tijdig mogelijk zodanige
      voorschriften als redelijkerwijs nodig is om de rechterlijk ambtenaar, die in verband met ongeschiktheid wegens
      ziekte verhinderd is zijn arbeid te verrichten, in staat te stellen de eigen of andere passende arbeid te
      verrichten.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel24a
  - number: 24a.2
    text: |-
      De maatregelen en voorschriften, bedoeld in het eerste lid, zijn gericht op duurzame reïntegratie in de eigen
      arbeid of andere passende arbeid bij een gerecht of binnen het gezagsbereik van Onze Minister waarbij de resterende
      mogelijkheden van de ambtenaar volledig worden benut. Indien na overleg tussen de functionele autoriteit en
      de rechterlijk ambtenaar vaststaat dat de in het eerste lid bedoelde arbeid niet bij een gerecht of binnen het
      gezagsbereik van Onze Minister voorhanden is, richten de maatregelen en voorschriften zich op duurzame reïntegratie
      in passende arbeid buiten dat gezagsbereik.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel24a
  - number: 24a.3
    text: |-
      Zolang duurzame reïntegratie als bedoeld in het tweede lid niet mogelijk is, stelt de functionele autoriteit de
      rechterlijk ambtenaar in de gelegenheid andere passende arbeid te verrichten.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel24a
  - number: 24a.4
    text: |-
      Uit hoofde van zijn verplichting, bedoeld in het eerste lid, stelt de functionele autoriteit in overeenstemming
      met de rechterlijk ambtenaar een plan van aanpak op als bedoeld in [artikel 71a, tweede lid, van de WAO][ref1]. Het
      plan van aanpak wordt met medewerking van de rechterlijk ambtenaar regelmatig geëvalueerd en zo nodig bijgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 71a
  - number: 24a.5
    text: |-
      De rechterlijk ambtenaar, die van mening is dat de functionele autoriteit de in het eerste lid bedoelde
      verplichting niet of onvoldoende nakomt, legt bij zijn verzoek tot nakoming aan de functionele autoriteit
      een oordeel van het UWV als bedoeld in [artikel 30, eerste lid, onderdeel g, van de Wet Suwi][ref1] over. De
      functionele autoriteit beslist op het verzoek binnen zes weken na ontvangst hiervan en deelt daarbij mee tot welke
      aanpassingen ten aanzien van de reïntegratieinspanningen het verzoek hem aanleiding geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '30'
  - number: '25.1'
    text: |-
      Bij samenloop van een aanspraak krachtens dit hoofdstuk met een WAO-uitkering, een ZW-uitkering, een WW-uitkering
      of een bovenwettelijke WW-uitkering, wordt deze aanspraak verminderd met het bedrag van deze uitkeringen, tenzij
      het een tegemoetkoming op grond van [artikel 27][ref1] betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel27
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '25.2'
    text: |-
      Indien als gevolg van handelingen of het nalaten van handelingen door de rechterlijk ambtenaar of de gewezen
      rechterlijk ambtenaar de WAO-uitkering, de ZW-uitkering, de WW-uitkering of de bovenwettelijke WW-uitkering
      vermindering ondergaat dan wel de aanspraak daarop geheel of gedeeltelijk wordt geweigerd, wordt de WAO-uitkering,
      de ZW-uitkering, de WW-uitkering of de bovenwettelijke WW-uitkering voor het vaststellen van de vermindering,
      bedoeld in het eerste lid, steeds geacht onverminderd te zijn genoten.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel25
  - number: '25.3'
    text: |-
      Indien ten aanzien van de WAO-uitkering of de ZW-uitkering, die de rechterlijk ambtenaar of de gewezen rechterlijk
      ambtenaar geniet, een verplichting wordt opgelegd of een sanctie wordt toegepast, wordt zoveel mogelijk dezelfde
      verplichting opgelegd dan wel een overeenkomende sanctie toegepast op de aanspraken op grond van dit hoofdstuk
      waarop de WAO-uitkering of de ZW-uitkering in mindering is gebracht.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel25
  - number: '25.4'
    text: |-
      Indien de rechterlijk ambtenaar of de gewezen rechterlijk ambtenaar zowel op grond van de aanstelling terzake
      waarvan hij aanspraken op grond van dit hoofdstuk heeft als op grond van een of meer andere betrekkingen
      een WAO-uitkering of een ZW-uitkering geniet, wordt voor de toepassing van dit hoofdstuk onder WAO-uitkering
      onderscheidenlijk ZW-uitkering verstaan, de WAO-uitkering onderscheidenlijk de ZW-uitkering voorzover deze, naar
      rato van de bezoldiging uit hoofde van die aanstelling en die andere betrekking of betrekkingen, wordt toegerekend
      aan die aanstelling.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel25
  - number: 25a.1
    text: |-
      De inkomsten die de rechterlijk ambtenaar of de gewezen rechterlijk ambtenaar geniet in verband met het verrichten
      van arbeid, die in het belang van zijn genezing door de deskundige persoon of de arbodienst wenselijk wordt geacht,
      worden op de aanspraak op doorbetaling van bezoldiging krachtens dit hoofdstuk in mindering gebracht, voorzover
      deze inkomsten tezamen met die aanspraak de bezoldiging te boven gaan.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel25a
  - number: 25a.2
    text: |-
      Inkomsten uit of in verband met arbeid of bedrijf worden in mindering gebracht op het bedrag waarop de gewezen
      rechterlijk ambtenaar ingevolge [artikel 18, eerste lid][ref1], of, indien de ongeschiktheid wegens ziekte voor
      het tijdstip van ontslag is ontstaan, [artikel 18, derde lid][ref2], aanspraak heeft, tenzij deze inkomsten reeds
      voorafgaand aan het intreden van de ongeschiktheid tot het verrichten van arbeid werden genoten en de omvang van
      die arbeid niet is toegenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0006530#Artikel18
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006530
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 25a.3
    text: |-
      Op het bedrag waarop de gewezen rechterlijk ambtenaar ingevolge [artikel 18, tweede lid][ref1], [artikel 26][ref2]
      of, indien de ongeschiktheid wegens ziekte na het tijdstip van ontslag is ontstaan, [artikel 18, derde lid][ref3],
      recht heeft, worden inkomsten uit of in verband met arbeid of bedrijf in mindering gebracht, tenzij deze inkomsten
      reeds voorafgaand aan de datum van ontslag werden genoten en de omvang van die arbeid niet is toegenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0006530#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0006530#Artikel18
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006530
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0006530
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '26.1'
    text: |-
      De rechterlijk ambtenaar, die wordt ontslagen in het tijdvak waarin zij zwangerschaps- en bevallingsverlof geniet,
      ontvangt met ingang van de datum van haar ontslag de laatstelijk genoten bezoldiging gedurende een periode die
      gelijk is aan de op de datum van ontslag nog resterende duur van haar zwangerschaps- en bevallingsverlof.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel26
  - number: '26.2'
    text: |-
      De gewezen rechterlijk ambtenaar wier bevalling waarschijnlijk is binnen vier maanden na het tijdstip van ingang
      van haar ontslag, ontvangt de laatstelijk genoten bezoldiging gedurende de periode die aanvangt op de 41e dag
      voorafgaand aan de vermoedelijke datum van bevalling en eindigt op de 70e dag na de datum waarop de bevalling heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel26
  - number: '26.3'
    text: |-
      De in het tweede lid bedoelde periode wordt verlengd tot 16 weken, indien die periode door een voortijdige
      bevalling minder dan 16 weken heeft bedragen.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel26
  - number: '26.4'
    text: |-
      De gewezen rechterlijk ambtenaar wier bevalling niet wordt verwacht binnen vier maanden na het tijdstip van ingang
      van haar ontslag, maar niettemin binnen die termijn bevalt, ontvangt de laatstelijk genoten bezoldiging gedurende
      de periode die aanvangt op de datum van bevalling en eindigt op de 70e dag na de datum waarop de bevalling heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel26
  - number: '26.5'
    text: |-
      Indien de gewezen rechterlijk ambtenaar gedurende de periode dat zij op basis van het eerste, tweede of vierde
      lid de laatstelijk genoten bezoldiging ontvangt tevens recht heeft op een financiële tegemoetkoming op basis
      van de [Wet arbeid en zorg][ref1], wordt gedurende de periode waarin de financiële tegemoetkoming wordt genoten
      een inhouding toegepast op de doorbetaling van de laatstelijk genoten bezoldiging ter grootte van die financiële
      tegemoetkoming.


      [ref1]: https://wetten.overheid.nl/BWBR0013008
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0013008
  - number: '26.6'
    text: |-
      Indien de gewezen rechterlijk ambtenaar aan de voorwaarden voor het toekennen van een financiële tegemoetkoming
      als bedoeld in het vijfde lid voldoet, maar geen financiële tegemoetkoming is toegekend omdat zij daarvoor geen
      aanvraag heeft ingediend, wordt de financiële tegemoetkoming geacht onverminderd te zijn genoten en wordt het
      vijfde lid overeenkomstig toegepast.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel26
  - number: '26.7'
    text: |-
      Voor zolang de gewezen rechterlijk ambtenaar na beëindiging van de haar ingevolge het eerste, tweede of vierde lid
      toekomende uitkering nog wegens ziekte ongeschikt is tot het verrichten van arbeid dan wel binnen een maand na deze
      beëindiging daartoe ongeschikt wordt, heeft zij gedurende een tijdvak van 52 weken recht op de doorbetaling van de
      bezoldiging overeenkomstig [artikel 18][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel18
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '26.8'
    text: |-
      Het in het zevende lid bedoelde tijdvak van 52 weken vangt aan met ingang van de eerste dag na beëindiging
      van de ingevolge het eerste, tweede of vierde lid aan de gewezen rechterlijk ambtenaar toekomende uitkering
      onderscheidenlijk de eerste dag waarop zij binnen een maand na die beëindiging ongeschikt is geworden tot het
      verrichten van arbeid.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel26
  - number: '26.9'
    text: |-
      Ongeschikt tot het verrichten van arbeid, geheel of gedeeltelijk, in de zin van het zevende lid, is de vrouwelijke
      gewezen rechterlijk ambtenaar die als rechtstreeks en objectief medisch vast te stellen gevolg van ziekte of
      gebreken geheel of gedeeltelijk niet in staat is om een naar aard en omvang soortgelijke taak te verrichten.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel26
  - number: '27.1'
    text: |-
      In bijzondere gevallen kan aan de rechterlijk ambtenaar een tegemoetkoming worden toegekend in noodzakelijk
      gemaakte kosten die verband houden met ziekte, welke de rechterlijk ambtenaar voor zichzelf en voor zijn
      medebelanghebbenden heeft gemaakt, indien hierin niet ingevolge een andere regeling kan worden voorzien en deze
      kosten redelijkerwijs niet voor zijn rekening kunnen blijven.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel27
  - number: '27.2'
    text: Onze Minister kan omtrent het bepaalde in het eerste lid nadere regels vaststellen.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel27
  - number: 27a.1
    text: |-
      De [Regeling ziektekostenvoorziening rijkspersoneel][ref1] is van overeenkomstige toepassing op de rechterlijk
      ambtenaar, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0008818
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0008818
  - number: 27a.1.a
    text: 'onder «Onze Minister» wordt verstaan: Onze Minister van Justitie;'
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel27a
  - number: 27a.1.b
    text: 'onder «betrokkenen» wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel27a
  - number: 27a.1.b.1°
    text: degenen wier rechtspositie is geregeld op grond van de wet;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel27a
  - number: 27a.1.b.2°
    text: |-
      gewezen personeel als bedoeld in onderdeel 1°, waaraan wegens ontslag uit de betrekking een uitkering is toegekend
      krachtens of op de voet van het [Rijkswachtgeldbesluit 1959][ref1], de [Uitkeringsregeling 1966][ref2], een
      vutovereenkomst als bedoeld in de [Wet kaderregeling vut overheidspersoneel][ref3], of krachtens een andere
      overeenkomstige regeling;


      [ref1]: https://wetten.overheid.nl/BWBR0002326
      [ref2]: https://wetten.overheid.nl/BWBR0002537
      [ref3]: https://wetten.overheid.nl/BWBR0007792
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0002326
      - id: ref2
        bwb_id: BWBR0002537
      - id: ref3
        bwb_id: BWBR0007792
  - number: 27a.1.b.3°
    text: |-
      degenen aan wie een pensioen is toegekend krachtens het pensioenreglement en die in de maand voorafgaande aan de
      pensionering behoorden tot de categorieën, bedoeld in onderdeel 1° of 2°;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel27a
  - number: 27a.1.b.4°
    text: |-
      de krachtens het reglement, genoemd in onderdeel 3°, weduwen of weduwnaarspensioengenietende niet hertrouwde
      weduwen of weduwnaars van degenen die op de dag van overlijden betrokkenen waren in de zin van dit besluit, of
      betrokkenen zouden zijn geweest indien dit besluit op die dag van kracht zou zijn geweest;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel27a
  - number: 27a.1.b.5°
    text: |-
      gewezen personeel als bedoeld in onderdeel 1° aan wie een WAO-uitkering als bedoeld in
      [artikel 31 van de Wet privatisering ABP][ref1] is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel31
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0007791
        artikel: '31'
  - number: 27a.2
    text: |-
      Onze Minister kan ook andere categorieën van personen, wier bezoldiging, uitkering of pensioen direct of indirect
      ten laste komt van de algemene middelen van het Rijk, aanwijzen als betrokkenen in de zin van het besluit, bedoeld
      in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel27a
  - number: 27b.1
    text: |-
      De rechterlijk ambtenaar of de gewezen rechterlijk ambtenaar, die een dienstongeval heeft gehad of een
      beroepsziekte heeft opgelopen, heeft recht op volledige vergoeding van de schade die hij ten gevolge van dat
      dienstongeval of die beroepsziekte lijdt, indien het dienstongeval of de beroepsziekte voortvloeit uit een
      gevaarzettende situatie die rechtstreeks verband houdt met de uitvoering van zijn taak waaraan hij zich vanwege
      zijn specifieke werkzaamheden niet heeft kunnen onttrekken.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel27b
  - number: 27b.2
    text: |-
      In overeenstemming met de gewezen rechterlijk ambtenaar kan de vergoeding, bedoeld in het eerste lid, mede strekken
      ter vervanging van de aanvullende uitkering, bedoeld in [artikel 18, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel18
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel27b
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 27b.3
    text: |-
      Toekenning van de schadevergoeding, bedoeld in het eerste en tweede lid, geschiedt door Onze Minister
      onderscheidenlijk, indien het een rechterlijk ambtenaar betreft die werkzaam is bij een gerechtshof of rechtbank
      dan wel een gewezen rechterlijk ambtenaar die laatstelijk werkzaam is geweest bij een gerechtshof of rechtbank,
      door de functionele autoriteit. [Artikel 46, tweede en derde lid, van de wet][ref1] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel27b
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '46'
  - number: '28'
    text: |-
      Het bedrag van de laatstelijk genoten bezoldiging, bedoeld in de [artikelen 18][ref1] en [26][ref2], wordt in
      voorkomende gevallen gewijzigd overeenkomstig een algemene salariswijziging.


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0006530#Artikel26
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006530
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '29'
    text: |-
      De gewezen rechterlijk ambtenaar die krachtens dit hoofdstuk aanspraak heeft op de doorbetaling van bezoldiging,
      heeft eveneens aanspraak op een vakantie-uitkering overeenkomstig [artikel 16, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel16
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '16'
  - number: '30.1'
    text: |-
      Indien de rechterlijk ambtenaar op de dag van het overlijden aanspraak had op een WAO-uitkering, een ZW-uitkering
      of een WW-uitkering, wordt voor de toepassing van [artikel 18 van de wet][ref1] onder bezoldiging verstaan het
      bedrag waarop de rechterlijk ambtenaar op de dag van het overlijden op basis van dit hoofdstuk aanspraak zou hebben
      gehad indien hij geen aanspraak op een WAO-uitkering, een ZW-uitkering of een WW-uitkering zou hebben gehad.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel18
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '18'
  - number: '30.2'
    text: |-
      Indien de rechterlijk ambtenaar op de dag van het overlijden meer dan 52 weken wegens ziekte ongeschikt was
      tot het verrichten van zijn arbeid en geen aanspraak had op een WAO-uitkering, wordt voor de toepassing van
      [artikel 18 van de wet][ref1] onder bezoldiging verstaan het bedrag waarop de rechterlijk ambtenaar op de dag van
      het overlijden op basis van dit hoofdstuk aanspraak had.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel18
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '18'
  - number: '30.3'
    text: |-
      Op het bedrag, bedoeld in [artikel 18, tweede lid, van de wet][ref1] wordt in mindering gebracht een uitkering
      op grond van [artikel 35 van de ZW][ref2] of [artikel 53 van de WAO][ref3] en naar aard en strekking daarmee
      overeenkomende uitkeringen, indien deze uitkeringen worden uitgekeerd. [Artikel 25, vierde lid,][ref4] is van
      overeenkomstige toepassing op deze uitkeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel53
      [ref4]: https://wetten.overheid.nl/BWBR0006530#Artikel25
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: '35'
      - id: ref3
        bwb_id: BWBR0002524
        artikel: '53'
      - id: ref4
        bwb_id: BWBR0006530
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '31.1'
    text: |-
      Na het overlijden van de gewezen rechterlijk ambtenaar, die op de dag van zijn overlijden op grond van
      [artikel 18][ref1] of [artikel 26][ref2] in het genot was van de doorbetaling van zijn laatstelijk genoten
      bezoldiging onderscheidenlijk 70% daarvan, wordt aan de in [artikel 18 van de wet][ref3] bedoelde personen en
      met overeenkomstige toepassing van dat artikel uitgekeerd een bedrag, gelijk aan de bezoldiging die de gewezen
      rechterlijk ambtenaar op de dag van zijn overlijden genoot onderscheidenlijk 70% daarvan, berekend over een tijdvak
      van drie maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0006530#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel18
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006530
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0008365
        artikel: '18'
  - number: '31.2'
    text: |-
      Op de in het eerste lid bedoelde uitkering wordt in mindering gebracht een uitkering op grond
      van [artikel 35 van de ZW][ref1], [artikel 53 van de WAO][ref2] of de [artikelen 6][ref3]
      of [11 van het Besluit bovenwettelijke uitkeringen bij werkloosheid van rechterlijke ambtenaren][ref4]
      en naar aard en strekking daarmee overeenkomende uitkeringen, indien deze uitkeringen worden uitgekeerd.
      [Artikel 25, vierde lid][ref5], is van overeenkomstige toepassing op deze uitkeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel53
      [ref3]: https://wetten.overheid.nl/BWBR0011826#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0011826#Artikel11
      [ref5]: https://wetten.overheid.nl/BWBR0006530#Artikel25
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '35'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '53'
      - id: ref3
        bwb_id: BWBR0011826
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0011826
        artikel: '11'
      - id: ref5
        bwb_id: BWBR0006530
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '32.1'
    text: |-
      Indien het overlijden van de rechterlijk ambtenaar is veroorzaakt door een dienstongeval of een door het
      verrichten van arbeid opgelopen beroepsziekte, wordt aan degene die in verband met dit overlijden krachtens het
      pensioenreglement een nabestaandenpensioen geniet, een uitkering toegekend ten bedrage van 18% van het resultaat
      van de vermenigvuldiging van:
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel32
  - number: 32.1.a
    text: |-
      vijf zevende deel van 1,75% van de berekeningsgrondslag, bedoeld in artikel 6.2 van het pensioenreglement, en
      de pensioengeldige diensttijd, bedoeld in hoofdstuk 5 van het pensioenreglement, indien het gaat om de partner,
      bedoeld in artikel 7.1 van het pensioenreglement;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel32
  - number: 32.1.b
    text: |-
      een zevende deel van 1,75% van de berekeningsgrondslag, bedoeld in artikel 6.2 van het pensioenreglement, en de
      pensioengeldige diensttijd, bedoeld in hoofdstuk 5 van het pensioenreglement, indien het gaat om de wees, bedoeld
      in artikel 7.7, eerste lid, onderdeel a, van het pensioenreglement;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel32
  - number: 32.1.c
    text: |-
      twee zevende deel van 1,75% van de berekeningsgrondslag, bedoeld in artikel 6.2 van het pensioenreglement, en de
      pensioengeldige diensttijd, bedoeld in hoofdstuk 5 van het pensioenreglement, indien het gaat om de wees, bedoeld
      in artikel 7.7, eerste lid, onderdeel b, van het pensioenreglement.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel32
  - number: '32.2'
    text: |-
      De in het eerste lid bedoelde uitkering eindigt met ingang van de dag waarop de overledene de leeftijd van 65
      jaar zou hebben bereikt, dan wel, indien de partner, bedoeld in artikel 7.1 van het pensioenreglement, aan wie een
      pensioen werd toegekend, hertrouwt, een samenlevingscontract sluit onderscheidenlijk een geregistreerd partnerschap
      aangaat, met ingang van de maand volgende op de datum van het hertrouwen, het sluiten van het samenlevingscontract
      onderscheidenlijk het aangaan van het geregistreerd partnerschap.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel32
  - number: '32.3'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op de gewezen rechterlijk ambtenaar aan wie een
      aanvullende uitkering als bedoeld in [artikel 18, vierde tot en met zesde lid][ref1], is toegekend, indien zijn
      overlijden het rechtstreekse gevolg is van de in [dat artikel][ref2] bedoelde arbeidsongeschiktheid.


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0006530#Artikel18
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006530
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '33'
    text: |-
      De [Suppletieregeling gedeeltelijk arbeidsongeschikten sector Rijk][ref1] is op de rechterlijke ambtenaren van
      overeenkomstige toepassing, met dien verstande dat in [artikel 1][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0007758
      [ref2]: https://wetten.overheid.nl/BWBR0006530#Artikel1
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0007758
      - id: ref2
        bwb_id: BWBR0006530
        artikel: '1'
        hoofdstuk: '1'
  - number: 33.a
    text: 'onder «Onze Minister» wordt verstaan: Onze Minister van Justitie; en'
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel33
  - number: 33.b
    text: |-
      onder «betrokkene» wordt verstaan: de rechterlijk ambtenaar aan wie op grond van [artikel 46i van de wet][ref1]
      onderscheidenlijk [artikel 36, eerste lid, onderdeel f][ref2], van dit besluit ontslag is verleend, die ten tijde
      van dat ontslag minder dan 80% arbeidsongeschikt is, en die uit dat ontslag werkloos is geworden in de zin van
      de [Werkloosheidswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46i
      [ref2]: https://wetten.overheid.nl/BWBR0006530#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46i
      - id: ref2
        bwb_id: BWBR0006530
        artikel: '36'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0004045
  - number: '34.1'
    text: 'In dit hoofdstuk wordt onder rechterlijk ambtenaar mede verstaan: de rechterlijk ambtenaar in opleiding.'
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel34
  - number: '34.2'
    text: Dit hoofdstuk is niet van toepassing op voor het leven benoemde rechterlijke ambtenaren.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel34
  - number: '35'
    text: |-
      Aan de rechterlijk ambtenaar, die ongeschikt is tot het verrichten van zijn arbeid wegens ziekte, kan een andere
      taak worden opgedragen, indien sprake is van passende arbeid. De rechterlijk ambtenaar is verplicht de hem
      opgedragen taak te aanvaarden.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel35
  - number: '36.1'
    text: |-
      Anders dan op diens aanvraag, bij wijze van straf of ingevolge
      [artikel 7 van de Wet Incompatibiliteiten Staten-Generaal en Europees Parlement][ref1], de
      [artikelen 95][ref2], [96a][ref3], [96b][ref4] of [97 van het Algemeen Rijksambtenarenreglement][ref5] of
      [artikel 125e, tweede lid, van de Ambtenarenwet][ref6], kan de rechterlijk ambtenaar worden ontslagen op grond van:


      [ref1]: https://wetten.overheid.nl/BWBR0006612#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel95
      [ref3]: https://wetten.overheid.nl/BWBR0001950#Artikel96a
      [ref4]: https://wetten.overheid.nl/BWBR0001950#Artikel96b
      [ref5]: https://wetten.overheid.nl/BWBR0001950#Artikel97
      [ref6]: https://wetten.overheid.nl/BWBR0001947#Artikel125e
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0006612
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0001950
        artikel: '95'
      - id: ref3
        bwb_id: BWBR0001950
        artikel: 96a
      - id: ref4
        bwb_id: BWBR0001950
        artikel: 96b
      - id: ref5
        bwb_id: BWBR0001950
        artikel: '97'
      - id: ref6
        bwb_id: BWBR0001947
        artikel: 125e
  - number: 36.1.a
    text: |-
      het verlies van een vereiste voor de benoembaarheid, door het bevoegde gezag gesteld bij een regeling aan de
      benoeming voorafgegaan, tenzij het vereiste alleen voor de aanvang van het ambt geldt;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36
  - number: 36.1.b
    text: het aangaan van een graad van zwagerschap, die de benoembaarheid tot het ambt zou uitsluiten;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36
  - number: 36.1.c
    text: onherroepelijk geworden rechterlijke uitspraak, waarbij de rechterlijk ambtenaar onder curatele is gesteld;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36
  - number: 36.1.d
    text: het ondergaan van lijfsdwang wegens schulden krachtens onherroepelijk geworden rechterlijke uitspraak;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36
  - number: 36.1.e
    text: onherroepelijk geworden veroordeling tot vrijheidsstraf wegens misdrijf;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36
  - number: 36.1.f
    text: ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36
  - number: 36.1.g
    text: onbekwaamheid of ongeschiktheid voor het door hem beklede ambt, anders dan op grond van ziels- of lichaamsgebreken;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36
  - number: 36.1.h
    text: het bereiken van de pensioengerechtigde leeftijd;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36
  - number: 36.1.i
    text: |-
      het bij of in verband met indiensttreding en/of keuring verstrekken van onjuiste of onvolledige inlichtingen,
      zonder welke handelwijze niet tot indienstneming of goedkeuring zou zijn overgegaan, tenzij de rechterlijk
      ambtenaar aannemelijk maakt dat hij te goeder trouw heeft gehandeld.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36
  - number: '36.2'
    text: |-
      Een ontslag op grond van het bepaalde in het eerste lid onder *a*, *b*, *f*, *g* en *h* wordt steeds eervol
      verleend.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36
  - number: '36.3'
    text: 'Een ontslag als bedoeld in het eerste lid, onderdeel *f*, kan slechts plaatsvinden indien:'
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36
  - number: 36.3.a
    text: |-
      er sprake is van ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte gedurende een ononderbroken
      periode van twee jaar,
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36
  - number: 36.3.b
    text: |-
      herstel van zijn ziekte niet binnen een periode van zes maanden na de in onderdeel *a* genoemde termijn van twee
      jaar te verwachten is, en
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36
  - number: 36.3.c
    text: |-
      naar het oordeel van de functionele autoriteit duurzame reïntegratie als bedoeld in
      [artikel 24a, tweede lid][ref1], niet binnen een redelijke termijn is te verwachten.


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel24a
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: 24a
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '36.4'
    text: |-
      Voor het berekenen van het tijdvak van twee jaar, bedoeld in het derde lid, onderdeel a, worden niet in aanmerking
      genomen:
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36
  - number: 36.4.a
    text: |-
      perioden van ongeschiktheid tot het verrichten van arbeid als gevolg van zwangerschap voorafgaand aan het
      zwangerschapsverlof; en
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36
  - number: 36.4.b
    text: |-
      perioden van ongeschiktheid tot het verrichten van arbeid tijdens het zwangerschaps- en bevallingsverlof, bedoeld
      in [artikel 3:1 van de Wet arbeid en zorg][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '36.5'
    text: |-
      Voor de berekening van het tijdvak van twee jaar, bedoeld in het derde lid, onderdeel a, worden perioden van
      ongeschiktheid tot het verrichten van arbeid, anders dan bedoeld in het vijfde lid, samengeteld:
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36
  - number: 36.5.a
    text: indien zij elkaar met een onderbreking van minder dan vier weken opvolgen; of
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36
  - number: 36.5.b
    text: |-
      indien de ene periode van ongeschiktheid direct voorafgaat aan en de andere periode van ongeschiktheid
      direct aansluit op het tijdvak gedurende welke zwangerschaps- en bevallingsverlof als bedoeld in
      [artikel 3:1 van de Wet arbeid en zorg][ref1] wordt genoten, en de ongeschiktheid in deze perioden redelijkerwijs
      geacht kan worden voort te vloeien uit dezelfde oorzaak.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Artikel3
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0013008
        artikel: '3'
  - number: '36.6'
    text: 'Het tijdvak van twee jaar, bedoeld in het derde lid, onderdeel a, wordt verlengd:'
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36
  - number: 36.6.a
    text: |-
      indien de aangifte, bedoeld in [artikel 38, eerste lid, van de ZW][ref1], later is gedaan dan op grond van dat
      artikel is voorgeschreven, met de duur van die vertraging;


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel38
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '38'
  - number: 36.6.b
    text: |-
      indien de wachttijd, bedoeld in [artikel 19, eerste lid, van de WAO][ref1], op grond van het zevende lid van dat
      artikel is verlengd, met de duur van die verlenging; en


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '19'
  - number: 36.6.c
    text: |-
      indien het UWV op grond van [artikel 71a, negende lid, van de WAO][ref1] een tijdvak heeft vastgesteld, met de duur
      van dit tijdvak.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 71a
  - number: '36.7'
    text: |-
      Om te beoordelen of er sprake is van een situatie als bedoeld in het derde lid, onderdelen a en b, vraagt de
      functionele autoriteit het oordeel van een daartoe door het UWV aangewezen arts.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36
  - number: '36.8'
    text: |-
      De in het zevende lid bedoelde arts betrekt bij zijn beoordeling een door de functionele autoriteit aangewezen arts
      en, indien de rechterlijk ambtenaar dit wenst, een door de rechterlijk ambtenaar aangewezen arts.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36
  - number: '36.9'
    text: |-
      De functionele autoriteit stelt de rechterlijk ambtenaar er schriftelijk van in kennis dat de procedure, bedoeld
      in het zevende lid, wordt ingesteld. Daarbij wijst de functionele autoriteit de rechterlijk ambtenaar op de
      mogelijkheid om een arts van zijn keuze te laten deelnemen aan de procedure.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36
  - number: '36.10'
    text: |-
      De kennisgeving, bedoeld in het negende lid, geschiedt niet eerder dan nadat de rechterlijk ambtenaar gedurende
      een onafgebroken periode van 18 maanden ongeschikt is geweest tot het verrichten van zijn arbeid wegens ziekte. Het
      vijfde en zesde lid zijn hierbij van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36
  - number: '36.11'
    text: |-
      De in het zevende lid bedoelde arts stelt naar aanleiding van zijn bevindingen een rapport op. Hij zendt dit
      rapport aan de functionele autoriteit en een afschrift aan de rechterlijk ambtenaar.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36
  - number: '36.12'
    text: |-
      Indien herplaatsing als bedoeld in het derde lid, onder *c*, plaatsvindt in een betrekking voor minder uren dan het
      aantal waarvoor de rechterlijk ambtenaar was aangesteld, heeft het ontslag uitsluitend betrekking op het meerdere
      aantal uren.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36
  - number: 36a.1
    text: |-
      De rechterlijk ambtenaar, die wegens ziekte ongeschikt is om zijn arbeid te verrichten, kan, in afwijking van
      [artikel 36, derde lid][ref1], worden ontslagen indien hij zonder deugdelijke grond weigert:


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel36
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '36'
        hoofdstuk: '4'
  - number: 36a.1.a
    text: |-
      gevolg te geven aan door de functionele autoriteit of een door de functionele autoriteit aangewezen deskundige
      gegeven redelijke voorschriften of mee te werken aan door de functionele autoriteit of een door de functionele
      autoriteit aangewezen deskundige getroffen maatregelen om hem in staat te stellen de eigen of andere passende
      arbeid te verrichten;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36a
  - number: 36a.1.b
    text: passende arbeid te verrichten waartoe hij in de gelegenheid wordt gesteld; of
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36a
  - number: 36a.1.c
    text: |-
      zijn medewerking te verlenen aan het opstellen, evalueren en bijstellen van een plan van aanpak als bedoeld in
      [artikel 71a, tweede lid, van de WAO][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: 71a
  - number: 36a.2
    text: |-
      Om te beoordelen of sprake is van een situatie als bedoeld in het eerste lid wint de functionele autoriteit het
      advies in van het UWV.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36a
  - number: 36b.1
    text: |-
      Aan de rechterlijk ambtenaar kan ook op andere gronden dan de gronden, genoemd of bedoeld in de
      [artikelen 36][ref1] en [36a][ref2] of de krachtens [artikel 39][ref3] van overeenkomstige toepassing zijnde
      bepalingen, ontslag worden verleend. Dat ontslag wordt eervol verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0006530#Artikel36a
      [ref3]: https://wetten.overheid.nl/BWBR0006530#Artikel39
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '36'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0006530
        artikel: 36a
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0006530
        artikel: '39'
        hoofdstuk: '5'
  - number: 36b.2
    text: |-
      In geval van ontslag als bedoeld in het eerste lid wordt door het tot ontslagverlening bevoegde gezag een
      voorziening getroffen waarbij de rechterlijk ambtenaar een uitkering wordt verleend die naar het oordeel van dat
      bevoegde gezag met het oog op de omstandigheden redelijk is te achten.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36b
  - number: 36b.3
    text: |-
      De uitkering is ten minste gelijk aan het voor de rechterlijk ambtenaar
      geldende totaal van uitkeringen berekend op basis van de [WW][ref1] en het
      [Besluit bovenwettelijke uitkeringen bij werkloosheid van rechterlijke ambtenaren][ref2],
      als ware als gevolg van het ontslag geen sprake van verwijtbare werkloosheid als bedoeld in
      [artikel 24 van de WW][ref3]. Voor zover door het tot ontslagverlening bevoegde gezag ten gunste van de
      rechterlijk ambtenaar niet anders is beslist, zijn op de uitkering voor het overige de [WW][ref4] en het
      [Besluit bovenwettelijke uitkeringen bij werkloosheid van rechterlijke ambtenaren][ref5] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0011826
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0004045
      [ref5]: https://wetten.overheid.nl/BWBR0011826
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0011826
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '24'
      - id: ref4
        bwb_id: BWBR0004045
      - id: ref5
        bwb_id: BWBR0011826
  - number: 36b.4
    text: |-
      Indien de rechterlijk ambtenaar ter zake van zijn ontslag ingevolge het
      eerste lid recht heeft op een uitkering krachtens de [WW][ref1] of het
      [Besluit bovenwettelijke uitkeringen bij werkloosheid van rechterlijke ambtenaren][ref2], wordt de in het tweede
      lid bedoelde uitkering met die uitkering verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0011826
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36b
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0011826
  - number: 36c.1
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36c
  - number: 36c.1.a
    text: 'functie: het samenstel van werkzaamheden dat de rechterlijk ambtenaar verricht;'
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36c
  - number: 36c.1.b
    text: |-
      herplaatsen: het verplaatsen van een rechterlijk ambtenaar dan wel het benoemen bij koninklijk besluit van een
      niet voor het leven benoemde rechterlijk ambtenaar in een passende functie, anders dan de oorspronkelijke functie,
      bij het eigen parket of gerecht, of een passende functie bij een ander parket of gerecht, of anderszins binnen het
      gezagsbereik van Onze Minister;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36c
  - number: 36c.1.c
    text: 'herplaatsingskandidaat: de te herplaatsen rechterlijk ambtenaar;'
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36c
  - number: 36c.1.d
    text: |-
      passende functie: een functie ten aanzien waarvan de herplaatsingskandidaat naar het oordeel van Onze Minister,
      indien het een rechterlijk ambtenaar, werkzaam bij een parket betreft, of het gerechtsbestuur, indien het een
      rechterlijk ambtenaar, werkzaam bij een gerecht betreft, beschikt over de kennis en kunde die noodzakelijk worden
      geacht om de functie naar behoren te kunnen uitoefenen dan wel een functie waarvoor de herplaatsingskandidaat
      naar het oordeel van Onze Minister, indien het een rechterlijk ambtenaar, werkzaam bij een parket, of het
      gerechtsbestuur, indien het een rechterlijk ambtenaar werkzaam bij een gerecht betreft, binnen redelijke termijn
      om-, her- of bijgeschoold kan worden, en deze functie hem in verband met zijn persoonlijkheid, zijn omstandigheden
      en de voor hem bestaande vooruitzichten, redelijkerwijs kan worden opgedragen;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36c
  - number: 36c.1.e
    text: |-
      rechterlijk ambtenaar: de rechterlijk ambtenaar die is aangesteld of aangewezen voor het vervullen van een
      volledige of gedeeltelijke taak;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36c
  - number: 36c.1.f
    text: |-
      reorganisatie: iedere wijziging van de organisatiestructuur, de omvang of de taakinhoud van een parket of een
      gerecht of een onderdeel daarvan, waaraan personele consequenties zijn verbonden;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36c
  - number: 36c.1.g
    text: |-
      verplaatsen: het elders binnen het eigen parket of eigen gerecht tewerkstellen van de rechterlijk ambtenaar in een
      zelfde functie als de oorspronkelijke functie.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36c
  - number: 36c.2
    text: |-
      Dit hoofdstuk is niet van toepassing op de rechterlijke ambtenaren, werkzaam bij de Hoge Raad en het parket bij de
      Hoge Raad.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36c
  - number: 36d
    text: Bij een reorganisatie zijn de bepalingen van dit hoofdstuk van toepassing.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36d
  - number: 36e.1
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden vastgesteld omtrent de procedure bij reorganisaties en het
      herplaatsen van rechterlijke ambtenaren.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36e
  - number: 36e.2
    text: |-
      Voorzover de in het eerste lid bedoelde regels van toepassing zijn op de bij een gerecht werkzame rechterlijke
      ambtenaren worden deze regels vastgesteld na overleg met de Raad voor de rechtspraak.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36e
  - number: 36f.1
    text: |-
      Ten aanzien van de bij een gerecht werkzame rechterlijke ambtenaren worden de bevoegdheden in de
      [artikelen 36g tot en met 36ac][ref1] uitgeoefend door het gerechtsbestuur, tenzij anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel36g
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36f
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: 36g
        hoofdstuk: 4a
  - number: 36f.2
    text: |-
      Ten aanzien van de bij een parket werkzame rechterlijke ambtenaren worden de bevoegdheden in de
      [artikelen 36g tot en met 36ab][ref1] uitgeoefend door Onze Minister, tenzij anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel36g
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36f
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: 36g
        hoofdstuk: 4a
  - number: 36f.3
    text: |-
      De bevoegdheden, bedoeld in het tweede lid, worden niet uitgeoefend dan nadat advies is ingewonnen bij de
      functionele autoriteit, tenzij anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36f
  - number: 36g.1
    text: |-
      De vertegenwoordigers van de Nederlandse Vereniging voor Rechtspraak en van de andere door Onze Minister
      tot het overleg toegelaten verenigingen of centrales van verenigingen van ambtenaren, bedoeld in
      [artikel 50, tweede lid, van de wet][ref1], worden tijdig geïnformeerd over een voorgenomen besluit tot een
      reorganisatie. Zij kunnen Onze Minister of het gerechtsbestuur verzoeken om overleg over het voorgenomen besluit of
      onderdelen daarvan, indien het een belangrijke reorganisatie betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel50
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36g
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '50'
  - number: 36g.2
    text: De betrokken ondernemingsraden worden tijdig geïnformeerd over een voorgenomen besluit tot een reorganisatie.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36g
  - number: 36h
    text: |-
      De rechterlijk ambtenaar benoemd in vaste dienst, wiens functie in verband met een reorganisatie is opgeheven,
      wordt aangewezen als herplaatsingskandidaat.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36h
  - number: 36i.1
    text: |-
      De rechterlijk ambtenaar benoemd in vaste dienst, die in verband met een reorganisatie overtollig is, wordt
      aangewezen als herplaatsingskandidaat, waarbij de rechterlijk ambtenaar die het geringste aantal jaren in dienst
      van een parket of gerecht heeft doorgebracht het eerst als herplaatsingskandidaat wordt aangewezen.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36i
  - number: 36i.2
    text: |-
      Van overtolligheid als bedoeld in het eerste lid is sprake indien binnen een parket of gerecht of een onderdeel
      daarvan meer rechterlijke ambtenaren een vergelijkbare of uitwisselbare functie vervullen en het totale aantal van
      die functies zodanig wordt verminderd dat onvoldoende van die functies voor de betrokken rechterlijke ambtenaren
      resteren.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36i
  - number: 36i.3
    text: |-
      Voor de berekening van het aantal in dienst van een parket of een gerecht doorgebrachte jaren worden voor een
      rechterlijk ambtenaar mede in aanmerking genomen:
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36i
  - number: 36i.3.a
    text: |-
      de tijd voorafgaand aan de indiensttreding als rechterlijk ambtenaar bij een parket of een gerecht in rijksdienst
      bij een parket of gerecht doorgebracht, indien de indiensttreding als rechterlijk ambtenaar bij een parket of een
      gerecht aansluitend hierop is geschied; en
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36i
  - number: 36i.3.b
    text: |-
      de tijd gewijd aan de verzorging van tot het huishouden van de rechterlijk ambtenaar behorende 0–4 jarige eigen,
      stief- of pleegkinderen, tot een maximum van in totaal zes jaren.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36i
  - number: 36i.4
    text: |-
      Van de volgorde in het eerste lid kan worden afgeweken, indien dat naar het oordeel van Onze Minister of het
      gerechtsbestuur noodzakelijk is en daarover overleg is gevoerd met de Nederlandse Vereniging voor Rechtspraak of
      andere door Onze Minister tot het overleg toegelaten verenigingen of centrales van verenigingen van ambtenaren als
      bedoeld in [artikel 50, tweede lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel50
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36i
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '50'
  - number: 36j
    text: De rechterlijk ambtenaar wordt omtrent zijn aanwijzing als herplaatsingskandidaat zo spoedig mogelijk geïnformeerd.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36j
  - number: 36k.1
    text: |-
      Aan de niet voor het leven benoemde rechterlijk ambtenaar wordt binnen een periode van 18 maanden, te rekenen
      vanaf het moment dat hij is aangewezen als herplaatsingskandidaat, ten minste één passende functie aangeboden. Het
      vorenstaande laat het gestelde in [artikel 36aa, eerste lid][ref1], onverlet.


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel36aa
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36k
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: 36aa
        hoofdstuk: 4a
  - number: 36k.2
    text: 'De termijn, bedoeld in het eerste lid, kan worden verkort indien:'
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36k
  - number: 36k.2.a
    text: |-
      de herplaatsingskandidaat heeft geweigerd te voldoen aan een hem op grond van dit hoofdstuk opgelegde verplichting,
      of;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36k
  - number: 36k.2.b
    text: |-
      reeds eerder in overleg met herplaatsingskandidaat binnen de termijn kan worden vastgesteld dat er geen
      mogelijkheden zijn om de herplaatsingskandidaat te herplaatsen.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36k
  - number: 36k.3
    text: |-
      De termijn kan worden verlengd of opgeschort, indien de omstandigheden naar het oordeel van Onze Minister of het
      gerechtsbestuur, indien het een gerechtsauditeur betreft, daartoe aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36k
  - number: 36k.4
    text: |-
      De rechterlijk ambtenaar, bedoeld in het eerste lid, wordt gelijktijdig met zijn aanwijzing als
      herplaatsingskandidaat geïnformeerd over de aanvang en het einde van de termijn als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36k
  - number: 36k.5
    text: |-
      De herplaatsingskandidaat wordt geïnformeerd over het verkorten, verlengen of opschorten van de termijn, bedoeld in
      het tweede en het derde lid.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36k
  - number: 36l.1
    text: |-
      Aan de voor het leven benoemde rechterlijk ambtenaar wordt binnen een periode van 18 maanden, te rekenen
      vanaf het moment dat deze is aangewezen als herplaatsingskandidaat, ten minste één passende functie
      aangeboden binnen het eigen gerecht met behoud van de rang, bedoeld in de [artikelen 40][ref1] en
      [58 van de Wet op de rechterlijke organisatie][ref2], waarin de rechterlijk ambtenaar is benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0001830#Artikel58
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36l
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '40'
      - id: ref2
        bwb_id: BWBR0001830
        artikel: '58'
  - number: 36l.2
    text: |-
      De rechterlijk ambtenaar, bedoeld in het eerste lid, wordt gelijktijdig met zijn aanwijzing als
      herplaatsingskandidaat geïnformeerd over de aanvang en het einde van de termijn als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36l
  - number: 36m
    text: |-
      De naar het oordeel van Onze Minister of het gerechtsbestuur meest geschikte herplaatsingskandidaat, voor wie
      de functie als passend wordt aangemerkt, kan bij koninklijk besluit worden benoemd of door Onze Minister of het
      gerechtsbestuur worden verplaatst.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36m
  - number: 36n
    text: |-
      De rechterlijk ambtenaar die in het kader van een reorganisatie wordt herplaatst in een functie bij een parket of
      gerecht of anderszins binnen het gezagsbereik van Onze Minister waaraan een lagere bezoldiging is verbonden dan
      aan zijn oorspronkelijke rang, behoudt zijn oorspronkelijke bezoldiging gedurende de periode waarin hij die andere
      functie vervult.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36n
  - number: 36o
    text: |-
      Onverminderd het bepaalde in artikel 36k, eerste lid, is de herplaatsingskandidaat verplicht al het mogelijke te
      doen om een passende functie te vinden.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36o
  - number: 36p.1
    text: |-
      De niet voor het leven benoemde rechterlijk ambtenaar die is aangewezen als herplaatsingskandidaat is verplicht een
      passende functie te aanvaarden.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36p
  - number: 36p.2
    text: |-
      De voor het leven benoemde rechterlijk ambtenaar die is aangewezen als herplaatsingskandidaat is verplicht een
      passende functie te aanvaarden binnen het eigen gerecht.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36p
  - number: 36q.1
    text: |-
      De herplaatsingskandidaat die slechts in een passende functie kan worden herplaatst na om-, her- of bijscholing kan
      hiertoe worden verplicht voor zover dat redelijkerwijs van hem kan worden gevergd.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36q
  - number: 36q.2
    text: |-
      Aan de rechterlijk ambtenaar die op grond van het eerste lid verplicht is om scholing te volgen, wordt een
      volledige vergoeding van de noodzakelijk te maken scholingskosten toegekend. In bijzondere gevallen kan worden
      afgeweken van de vorige volzin.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36q
  - number: 36q.3
    text: Aan de herplaatsingskandidaat kan scholingsverlof met behoud van bezoldiging worden verleend.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36q
  - number: 36q.4
    text: |-
      De rechterlijk ambtenaar die op grond van het eerste lid verplicht is om scholing te volgen, kan worden verplicht
      tot terugbetaling van de aan hem toegekende vergoeding van de scholingskosten:
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36q
  - number: 36q.4.a
    text: |-
      bij onvoldoende resultaat in de scholing of bij tussentijds afbreken van de scholing, indien dit aan eigen schuld
      of toedoen van de rechterlijk ambtenaar is te wijten;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36q
  - number: 36q.4.b
    text: |-
      bij ontslag tijdens het volgen van de scholing en in bijzondere gevallen bij ontslag binnen een termijn van
      maximaal drie jaren na het met voldoende resultaat afronden van de scholing, tenzij de rechterlijk ambtenaar binnen
      een maand na zijn ontslag elders dan bij een parket of gerecht, of anderszins buiten het gezagsbereik van Onze
      Minister, in dienst treedt, of aansluitend op zijn ontslag recht heeft op een uitkering op grond van werkloosheid,
      arbeidsongeschiktheid of ouderdomspensioen.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36q
  - number: 36q.5
    text: |-
      De verplichting tot terugbetaling wordt niet opgelegd aan de rechterlijk ambtenaar aan wie binnen 18 maanden nadat
      hij is aangewezen als herplaatsingskandidaat op zijn aanvraag eervol ontslag wordt verleend wegens de aanvaarding
      van een functie elders dan bij een parket of gerecht, of anderszins buiten het gezagsbereik van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36q
  - number: 36r.1
    text: |-
      Aan de rechterlijk ambtenaar die in verband met zijn herplaatsing in opdracht van Onze
      Minister of het gerechtsbestuur is verhuisd, wordt eenmalig een bedrag toegekend overeenkomstig
      [artikel 49n van het Algemeen Rijksambtenarenreglement][ref1] ter tegemoetkoming in de daarmee verband houdende
      kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel49n
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36r
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 49n
  - number: 36r.2
    text: |-
      In de gevallen waarin de rechterlijk ambtenaar en zijn echtgenoot beiden in aanmerking komen voor een
      bedrag als bedoeld in het eerste lid, ontvangt elk de helft daarvan. Onder echtgenoot wordt mede verstaan de
      geregistreerde partner alsmede de levenspartner met wie de niet gehuwde rechterlijk ambtenaar samenwoont en,
      met het oogmerk duurzaam samen te leven, een gemeenschappelijke huishouding voert op basis van een notarieel
      verleden samenlevingscontract bevattende de wederzijdse rechten en verplichtingen ter zake van die samenwoning en
      gemeenschappelijke huishouding.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36r
  - number: 36r.3
    text: |-
      Het bedrag, bedoeld in het eerste lid, wordt niet toegekend, indien de verhuizing niet heeft plaatsgevonden binnen
      twee jaren nadat de opdracht om te verhuizen is gegeven.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36r
  - number: 36s
    text: |-
      Aan de herplaatsingskandidaat kan een premie ter grootte van maximaal drie maandsalarissen in het vooruitzicht
      worden gesteld, indien aan hem binnen 18 maanden nadat hij is aangewezen als herplaatsingskandidaat op zijn
      aanvraag eervol ontslag als bedoeld in [artikel 94 van het Algemeen Rijksambtenarenreglement][ref1], zoals dat
      luidde op 31 maart 1994, indien het een niet voor het leven benoemde rechterlijk ambtenaar betreft, dan wel ontslag
      op eigen verzoek als bedoeld in [artikel 46h, eerste lid, van de wet][ref2], indien het een voor het leven benoemde
      rechterlijk ambtenaar betreft, is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel94
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46h
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36s
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '94'
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 46h
  - number: 36t.1
    text: |-
      Aan de herplaatsingskandidaat aan wie op zijn aanvraag eervol ontslag dan wel ontslag op eigen verzoek is verleend
      wegens de aanvaarding van een functie elders dan bij een parket of gerecht of anderszins buiten het gezagsbereik
      van Onze Minister kan, onverminderd het bepaalde in artikel 36s, een salarissuppletie worden toegekend, indien het
      in de nieuwe functie genoten salaris lager is dan het salaris in de oorspronkelijke functie.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36t
  - number: 36t.2
    text: |-
      De suppletie, bedoeld in het eerste lid, wordt toegekend gedurende maximaal vijf jaar en is ten hoogste gelijk aan
      het verschil tussen het in de oorspronkelijke functie genoten salaris en het salaris in de nieuwe functie.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36t
  - number: 36t.3
    text: |-
      Onder door Onze Minister of het gerechtsbestuur te stellen voorwaarden kan het recht op suppletie op aanvraag van
      de herplaatsingskandidaat worden afgekocht.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36t
  - number: 36u
    text: |-
      Onze Minister of het gerechtsbestuur kan de artikelen 36p, 36q, 36r en 36t toepassen op de rechterlijk ambtenaar
      wiens functie binnen afzienbare tijd wordt opgeheven of de rechterlijk ambtenaar die binnen afzienbare tijd als
      overtollig zal worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36u
  - number: 36v.1
    text: |-
      De rechterlijk ambtenaar aan wie op zijn aanvraag eervol ontslag wordt verleend in verband met de aanvaarding
      van een functie elders dan bij een parket of gerecht, of anderszins buiten het gezagsbereik van Onze Minister,
      heeft op grond van zijn ontslag als rechterlijk ambtenaar aanspraak op een uitkering overeenkomstig het Besluit
      bovenwettelijke uitkeringen bij werkloosheid voor de sector Rechterlijke Macht.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36v
  - number: 36v.2
    text: |-
      Het bepaalde in het eerste lid geldt slechts indien de rechterlijk ambtenaar is aangewezen als
      herplaatsingskandidaat als bedoeld in de artikelen 36h en 36i en hij binnen twee jaar na de aanvaarding van een
      functie elders dan bij een parket of gerecht, of anderszins buiten het gezagsbereik van Onze Minister, anders dan
      door zijn schuld of toedoen wordt ontslagen.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36v
  - number: 36v.3
    text: |-
      Indien de rechterlijk ambtenaar terzake van zijn ontslag ingevolge het tweede lid recht heeft op een uitkering
      krachtens de [Werkloosheidswet][ref1] wordt de in het eerste lid bedoelde uitkering met die uitkering verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36v
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: 36w.1
    text: |-
      De rechterlijk ambtenaar die een diensttijd heeft van tien jaar of meer en aan wie ontslag wordt verleend op
      grond van [artikel 36aa][ref1] wordt een diensttijdgratificatie toegekend ter grootte van een in verhouding tot de
      doorgebrachte diensttijd evenredig gedeelte van een gratificatie bij ambtsjubileum. Toekenning vindt niet plaats
      indien niet binnen een termijn van vijf jaar na de datum van ingang van het ontslag aanspraak op een gratificatie
      bij ambtsjubileum zou hebben bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel36aa
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36w
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: 36aa
        hoofdstuk: 4a
  - number: 36w.2
    text: |-
      Bij de bepaling van de diensttijd wordt rekening gehouden met de tijd in overheidsdienst doorgebracht
      overeenkomstig de bepalingen die gelden voor burgerlijke rijksambtenaren.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36w
  - number: 36x
    text: |-
      In de [artikelen 36y tot en met 36ab][ref1] wordt onder rechterlijk ambtenaar verstaan: niet voor het leven
      benoemde rechterlijk ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel36y
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36x
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: 36y
        hoofdstuk: 4a
  - number: 36y.1
    text: |-
      De rechterlijk ambtenaar kan in het kader van een reorganisatie bij koninklijk besluit worden benoemd in een
      passende functie, anders dan de oorspronkelijke functie, bij het eigen parket of gerecht of een passende functie
      bij een ander parket of gerecht of anderszins binnen het gezagsbereik van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36y
  - number: 36y.2
    text: De rechterlijk ambtenaar is verplicht een passende functie als bedoeld in het eerste lid te aanvaarden.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36y
  - number: 36y.3
    text: |-
      De benoeming in een passende functie als bedoeld in het eerste lid van een gerechtsauditeur geschiedt niet dan
      nadat advies is ingewonnen bij de functionele autoriteit.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36y
  - number: 36z.1
    text: |-
      Aan de rechterlijk ambtenaar die heeft geweigerd te voldoen aan een hem op grond van dit hoofdstuk opgelegde
      verplichting, kan in verband daarmee bij koninklijk besluit, ontslag worden verleend.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36z
  - number: 36z.2
    text: Bij een ontslagverlening op grond van het eerste lid wordt een opzeggingstermijn van drie maanden in acht genomen.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36z
  - number: 36z.3
    text: |-
      De ontslagverlening, bedoeld in het eerste lid, aan een gerechtsauditeur geschiedt niet dan nadat advies is
      ingewonnen bij de functionele autoriteit.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36z
  - number: 36aa.1
    text: |-
      Aan de rechterlijk ambtenaar kan in het kader van een reorganisatie bij koninklijk besluit eervol ontslag worden
      verleend, indien het niet mogelijk is gebleken om hem te herplaatsen in een passende functie.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36aa
  - number: 36aa.2
    text: |-
      Aan de rechterlijk ambtenaar die in het kader van een reorganisatie is herplaatst kan alsnog het ontslag, bedoeld
      in het eerste lid, worden verleend indien binnen een periode van uiterlijk één jaar te rekenen vanaf de datum
      waarop de functie is opgedragen, blijkt dat de desbetreffende functie niet passend is voor die rechterlijk
      ambtenaar en het niet mogelijk is om de rechterlijk ambtenaar binnen een redelijke termijn in een andere passende
      functie te plaatsen.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36aa
  - number: 36aa.3
    text: |-
      Bij een ontslagverlening op grond van het eerste lid wordt een opzeggingstermijn van drie maanden in acht genomen.
      Bij een ontslagverlening op grond van het tweede lid geldt geen opzeggingstermijn.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36aa
  - number: 36aa.4
    text: |-
      De ontslagverlening, bedoeld in het eerste lid en tweede lid, aan een gerechtsauditeur geschiedt niet dan nadat
      advies is ingewonnen bij de functionele autoriteit.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36aa
  - number: 36ab.1
    text: |-
      Aan de rechterlijk ambtenaar kan bij koninklijk besluit eervol ontslag worden verleend, indien van hem in
      redelijkheid niet kan worden verlangd, dat hij zich zal voegen in zijn plaatsing over een aanmerkelijke afstand
      tengevolge van een benoeming in een passende functie.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36ab
  - number: 36ab.2
    text: |-
      Aan de rechterlijk ambtenaar kan binnen een periode van uiterlijk één jaar nadat hij is benoemd in een functie,
      die verplaatsing over een aanmerkelijke afstand ten gevolge heeft, alsnog het ontslag, bedoeld in het eerste lid,
      worden verleend indien van hem in redelijkheid niet kan worden verlangd dat hij zich hierin zal blijven voegen.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36ab
  - number: 36ab.3
    text: |-
      De ontslagverlening, bedoeld in het eerste lid en tweede lid, aan een gerechtsauditeur geschiedt niet dan nadat
      advies is ingewonnen bij de functionele autoriteit.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36ab
  - number: 36ab.4
    text: |-
      De [artikelen 36n tot en met 36q][ref1], [36s][ref2], [36t][ref3] en [36z][ref4] zijn op de rechterlijke ambtenaar
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel36n
      [ref2]: https://wetten.overheid.nl/BWBR0006530#Artikel36s
      [ref3]: https://wetten.overheid.nl/BWBR0006530#Artikel36t
      [ref4]: https://wetten.overheid.nl/BWBR0006530#Artikel36z
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36ab
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: 36n
        hoofdstuk: 4a
      - id: ref2
        bwb_id: BWBR0006530
        artikel: 36s
        hoofdstuk: 4a
      - id: ref3
        bwb_id: BWBR0006530
        artikel: 36t
        hoofdstuk: 4a
      - id: ref4
        bwb_id: BWBR0006530
        artikel: 36z
        hoofdstuk: 4a
  - number: 36ac
    text: |-
      Op de voor het leven benoemde rechterlijk ambtenaar, die in het kader van een reorganisatie op eigen verzoek wordt
      benoemd in een functie bij een ander gerecht of elders binnen het gezagsbereik van Onze Minister, zijn de artikelen
      36n, 36q, en 36r van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel36ac
  - number: '37.1'
    text: 'In dit artikel wordt onder rechterlijk ambtenaar verstaan: de niet voor het leven benoemde rechterlijk ambtenaar.'
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel37
  - number: '37.2'
    text: |-
      De functionele autoriteit besteedt aan de wijze van functievervulling van de rechterlijk ambtenaar regelmatig
      aandacht door middel van het houden van functioneringsgesprekken of het opmaken van beoordelingen, dan wel van
      beide.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel37
  - number: '37.3'
    text: |-
      Een beoordeling wordt in elk geval opgemaakt wanneer de functionele autoriteit dit wenselijk vindt of de
      rechterlijk ambtenaar dit aanvraagt.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel37
  - number: '37.4'
    text: |-
      Alvorens een beoordeling wordt vastgesteld, wordt deze met de rechterlijk ambtenaar besproken en wordt hem de
      gelegenheid geboden daarover zijn mening kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel37
  - number: '37.5'
    text: Onze Minister kan nadere regels stellen omtrent het opmaken en vaststellen van beoordelingen.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel37
  - number: '37.6'
    text: Onze Minister kan beleidsregels vaststellen inzake de functioneringsgesprekken.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel37
  - number: 37a.1
    text: |-
      De rechterlijk ambtenaar die de leeftijd van 50 jaar heeft bereikt, heeft, ongeacht of er sprake is van
      gezondheidsproblemen, het recht om op kosten van het Rijk een maal per twee jaar een algemene medische keuring
      te ondergaan.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel37a
  - number: 37a.2
    text: De keuring wordt verricht door een andere arts dan de eigen huisarts of specialist.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel37a
  - number: 37a.3
    text: Onze minister kan een arts als bedoeld in het tweede lid aanwijzen.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel37a
  - number: '38.1'
    text: |-
      De vergoedingen, bedoeld in de [artikelen 9, tweede lid][ref1], en [10 van de wet][ref2], bedragen per zitting:


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel10
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0008365
        artikel: '10'
  - number: 38.1.a
    text: 'voor raadsheren in buitengewone dienst van en advocaten-generaal in buitengewone dienst bij de Hoge Raad: € 414,'
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38
  - number: 38.1.b
    text: 'voor raadsheren-plaatsvervangers en plaatsvervangend advocaten-generaal bij een ressortsparket: € 317 en'
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38
  - number: 38.1.c
    text: 'voor rechters-plaatsvervangers en plaatsvervangende officieren van justitie: € 240.'
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38
  - number: '38.2'
    text: |-
      Voor de toepassing van het eerste lid worden zittingen die op één dag worden gehouden, samen als één zitting
      beschouwd.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38
  - number: '38.3'
    text: 'Voor de toepassing van het eerste lid, aanhef en onder *a*, worden met een zitting gelijkgesteld:'
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38
  - number: 38.3.a
    text: 'indien het raadsheren in buitengewone dienst betreft: een bijeenkomst in de raadskamer, en'
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38
  - number: 38.3.b
    text: 'indien het advocaten-generaal in buitengewone dienst betreft: een schriftelijke conclusie.'
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38
  - number: '38.4'
    text: |-
      De functionele autoriteit kan besluiten dat aan een raadsheer-plaatsvervanger of een rechter-plaatsvervanger
      een vergoeding overeenkomstig het eerste lid wordt toegekend voor het concipiëren van een of meer schriftelijke
      uitspraken in een of meer zaken waarin geen zitting heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38
  - number: 38a.1
    text: |-
      Een rechterlijk ambtenaar, niet zijnde een plaatsvervanger als bedoeld in [artikel 9, tweede lid, van de wet][ref1]
      of een raadsheer dan wel advocaat-generaal in buitengewone dienst als bedoeld in [artikel 10 van de wet][ref2],
      die de leeftijd van 57 jaar heeft bereikt, kan Onze Minister verzoeken om bij een opvolgende benoeming in een
      ambt, waaraan overeenkomstig [artikel 7 van de wet][ref3] een lager maximum salaris is verbonden, in plaats van
      het salaris dat hij bij het vervullen van dat ambt overeenkomstig de wet geniet, het salaris behorende bij het
      voorafgaand aan de benoeming vervulde ambt te genieten.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel7
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38a
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0008365
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0008365
        artikel: '7'
  - number: 38a.2
    text: 'Een verzoek als bedoeld in het eerste lid wordt ingewilligd, tenzij:'
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38a
  - number: 38a.2.a
    text: |-
      het ambt, waarin de rechterlijk ambtenaar wordt benoemd, door rechtstreekse of overeenkomstige toepassing tot een
      van de in [artikel 7, eerste lid, van de wet][ref1] bedoelde categorieën 10 tot en met 12 behoort; of


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel7
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38a
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '7'
  - number: 38a.2.b
    text: |-
      de rechterlijk ambtenaar op het tijdstip van de benoeming, bedoeld in het eerste lid, niet ten minste vijf
      aaneengesloten jaren in dienst is als rechterlijk ambtenaar.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38a
  - number: 38a.3
    text: |-
      Op het salaris van de rechterlijk ambtenaar wordt in geval van inwilliging van een verzoek als bedoeld in het
      eerste lid een korting toegepast.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38a
  - number: 38a.4
    text: 'Deze korting bedraagt:'
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38a
  - number: 38a.4.a
    text: |-
      5% van het salaris, indien het maximum salaris verbonden aan het ambt waarin hij wordt benoemd het naast lagere
      maximum salaris is van dat van het ambt dat hij voorafgaand aan de benoeming heeft vervuld dan wel het naast lagere
      maximum salaris is van het vorenbedoelde naast lagere maximum salaris;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38a
  - number: 38a.4.b
    text: |-
      10% van het salaris, indien het maximum salaris verbonden aan het ambt waarin hij wordt benoemd lager is dan de in
      het vierde lid, onder a, bedoelde naast lagere maximum salarissen.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38a
  - number: 38a.5
    text: Onze Minister kan ter zake van de uitvoering van dit artikel regels stellen.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38a
  - number: 38b.1
    text: |-
      Om benoemd te kunnen worden als rechterlijk ambtenaar, bedoeld in
      [artikel 1, onderdeel b, onder 1° tot en met 3°, van de Wet op de rechterlijke organisatie][ref1], dient het
      afsluitend examen, bedoeld in [artikel 1d, eerste lid, van de wet][ref2], te voldoen aan de eisen van het tweede en
      derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel1d
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38b
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 1d
  - number: 38b.2
    text: |-
      Het afsluitend examen is zodanig samengesteld dat ten minste grondige kennis van en inzicht in drie van de vijf
      volgende rechtsgebieden is verkregen:
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38b
  - number: 38b.2.a
    text: burgerlijk recht, met inbegrip van burgerlijk procesrecht;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38b
  - number: 38b.2.b
    text: strafrecht, met inbegrip van strafprocesrecht;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38b
  - number: 38b.2.c
    text: bestuursrecht, met inbegrip van bestuursprocesrecht;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38b
  - number: 38b.2.d
    text: staatsrecht;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38b
  - number: 38b.2.e
    text: belastingrecht.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38b
  - number: 38b.3
    text: |-
      Tot de drie rechtsgebieden, bedoeld in het tweede lid, behoren in ieder geval twee van de rechtsgebieden genoemd in
      de onderdelen a tot en met c.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38b
  - number: 38b.4
    text: |-
      De eisen, bedoeld in het tweede en derde lid, zijn niet van toepassing op degene die ten minste zes jaar voor de
      beoogde datum van benoeming het afsluitend examen heeft afgelegd en die tot aan de beoogde datum van benoeming een
      ruime praktijkervaring heeft opgedaan in een van de rechtsgebieden genoemd in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38b
  - number: 38c.1
    text: |-
      Om benoemd te kunnen worden als rechterlijk ambtenaar, bedoeld in
      [artikel 1, onderdeel b, onder 4° tot en met 6°, van de Wet op de rechterlijke organisatie][ref1], dient het
      afsluitend examen, bedoeld in [artikel 1d, eerste lid, van de wet][ref2], te voldoen aan de eisen van het tweede en
      derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel1d
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38c
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 1d
  - number: 38c.2
    text: |-
      Het afsluitend examen is zodanig samengesteld dat ten minste grondige kennis van en inzicht in het rechtsgebied
      strafrecht, met inbegrip van strafprocesrecht, is verkregen.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38c
  - number: 38c.3
    text: |-
      Naast het in het tweede lid genoemde rechtsgebied is ten minste grondige kennis van en inzicht in twee van de drie
      volgende rechtsgebieden verkregen:
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38c
  - number: 38c.3.a
    text: burgerlijk recht, met inbegrip van burgerlijk procesrecht;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38c
  - number: 38c.3.b
    text: bestuursrecht, met inbegrip van bestuursprocesrecht;
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38c
  - number: 38c.3.c
    text: staatsrecht.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38c
  - number: 38d.1
    text: |-
      De gemiddelde wekelijkse werktijd van een rechterlijk ambtenaar van 57 jaar en ouder wordt op zijn verzoek, met
      behoud van zijn arbeidsduur, teruggebracht met 11,1%, tenzij het belang van de taakvervulling zich daartegen naar
      het oordeel van de functionele autoriteit verzet.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38d
  - number: 38d.2
    text: |-
      De gemiddelde wekelijkse werktijd van een rechterlijk ambtenaar van 61 jaar en ouder wordt op zijn verzoek, met
      behoud van zijn arbeidsduur, teruggebracht met 33,3%, tenzij het belang van de taakvervulling zich daartegen naar
      het oordeel van de functionele autoriteit verzet.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38d
  - number: 38d.3
    text: |-
      Het terugbrengen van de werktijd overeenkomstig het eerste of tweede lid heeft in totaal gedurende een periode
      van ten hoogste tien aaneengesloten jaren plaats, met dien verstande dat het terugbrengen van de werktijd
      overeenkomstig het tweede lid plaatsheeft gedurende een periode van ten hoogste zes aaneengesloten jaren.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38d
  - number: 38d.4
    text: |-
      De rechterlijk ambtenaar dient op het tijdstip waarop de werktijd overeenkomstig het eerste of tweede lid wordt
      teruggebracht ten minste vijf aaneengesloten jaren in dienst te zijn als rechterlijk ambtenaar.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38d
  - number: 38d.5
    text: |-
      Voor de uren die het wekelijkse verschil vormen tussen de in het eerste of tweede lid bedoelde arbeidsduur en de
      overeenkomstig het eerste of tweede lid teruggebrachte werktijd wordt de rechterlijk ambtenaar geacht met verlof
      te zijn.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38d
  - number: 38d.6
    text: |-
      Op het salaris van de rechterlijk ambtenaar, van wie de werktijd wordt teruggebracht overeenkomstig het eerste
      respectievelijk tweede lid, wordt een korting toegepast ter grootte van 5% onderscheidenlijk 10% van het salaris
      dat voor hem zou gelden zonder werktijdvermindering op grond van dit artikel.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38d
  - number: 38d.7
    text: |-
      Met ingang van het tijdstip waarop de werktijd overeenkomstig het eerste of tweede lid is teruggebracht, vervalt
      ten aanzien van de rechterlijk ambtenaar de verhoging van de vakantie-aanspraak op grond van zijn leeftijd en wordt
      de vakantie-aanspraak overigens vastgesteld op een evenredig deel van de vakantie-aanspraak bij een volledige taak.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38d
  - number: 38d.8
    text: |-
      De rechterlijk ambtenaar voor wie de arbeidsduur op basis van [artikel 20, eerste lid, van de wet][ref1] op meer
      dan gemiddeld 36 uur is vastgesteld, kan een verzoek als bedoeld in het eerste en tweede lid eerst indienen nadat
      op zijn verzoek zijn arbeidsduur is vastgesteld op ten hoogste 36 uur.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel20
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38d
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '20'
  - number: 38da.1
    text: |-
      Op het salaris van de rechterlijk ambtenaar, die gelijktijdig gebruik maakt van de mogelijkheid, bedoeld in artikel
      38a, eerste lid, om een minder belastende functie te vervullen en de mogelijkheid, bedoeld in artikel 38d, eerste
      of tweede lid, om de gemiddelde wekelijkse werktijd terug te brengen, wordt een korting toegepast ter grootte
      van het voor hem geldende percentage, bedoeld in artikel 38a, vierde lid, opgeteld met het voor hem geldende
      percentage, bedoeld in artikel 38d, zesde lid.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38da
  - number: 38da.2
    text: |-
      Bij de korting, bedoeld in het eerste lid, wordt een korting van 5% opgeteld, indien het maximum salaris, verbonden
      aan het ambt waarin de rechterlijk ambtenaar op grond van artikel 38a wordt benoemd, lager is dan het naast lagere
      maximum salaris van dat van het ambt dat hij voorafgaand aan die benoeming heeft vervuld.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38da
  - number: 38e.1
    text: |-
      In dit artikel wordt onder inkomen verstaan: het salaris van de rechterlijk ambtenaar na de korting overeenkomstig
      het [zesde lid van artikel 38d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel38d
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38e
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: 38d
        hoofdstuk: '5'
  - number: 38e.2
    text: |-
      De inkomsten die de rechterlijk ambtenaar geniet of gaat genieten uit of in verband met arbeid of bedrijf,
      voor zover niet reeds ter hand genomen voorafgaand aan het tijdstip waarop de arbeidsduur overeenkomstig
      [artikel 38d, eerste of tweede lid][ref1], is teruggebracht, worden met het inkomen verrekend, tenzij de
      rechterlijk ambtenaar aannemelijk maakt dat die inkomsten of die vermeerdering van inkomsten dan wel een gedeelte
      daarvan geen verband houden met verhoogde werkzaamheid.


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel38d
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38e
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: 38d
        hoofdstuk: '5'
  - number: 38e.3
    text: |-
      Inkomsten uit arbeid of bedrijf als bedoeld in het tweede lid die op één maand betrekking hebben of geacht
      kunnen worden te hebben, worden in mindering gebracht op het inkomen over die maand. De vermindering bedraagt
      niet meer dan het verschil tussen het inkomen van de rechterlijk ambtenaar en het salaris dat hij krachtens
      [artikel 8 van de wet][ref1] zou hebben genoten indien zijn arbeidsduur zou zijn teruggebracht met eenzelfde
      percentage als zijn werktijd overeenkomstig [artikel 38d, eerste respectievelijk tweede lid][ref2], is
      teruggebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0006530#Artikel38d
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38e
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0006530
        artikel: 38d
        hoofdstuk: '5'
  - number: 38e.4
    text: |-
      Inkomsten uit arbeid of bedrijf, waarvoor in verband met verleend buitengewoon verlof reeds een inhouding op
      het salaris van de rechterlijk ambtenaar plaatsvindt of reeds een verlaging van het salaris van de rechterlijk
      ambtenaar geldt of ter zake waarvan de rechterlijk ambtenaar reeds storting in 's Rijks kas verricht, zijn tot het
      bedrag van die inhouding, verlaging of storting, geen inkomsten uit arbeid of bedrijf als bedoeld in het tweede en
      derde lid.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38e
  - number: 38e.5
    text: |-
      De rechterlijk ambtenaar is verplicht van op of na het tijdstip, waarop de werktijd overeenkomstig
      [artikel 38d, eerste of tweede lid][ref1], is teruggebracht, ter hand te nemen of reeds ter hand genomen arbeid of
      bedrijf mededeling te doen aan functionele autoriteit, onder opgave, voor zover mogelijk, van de inkomsten die hij
      uit die werkzaamheden zal genieten.


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel38d
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38e
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: 38d
        hoofdstuk: '5'
  - number: 38e.6
    text: |-
      Indien de inkomsten niet vooraf kunnen worden vastgesteld, doet de rechterlijk ambtenaar maandelijks voorafgaand
      aan de salarisbetaling, opgave van de inkomsten die hij sinds de vorige opgave heeft genoten.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38e
  - number: 38e.7
    text: |-
      Indien de inkomsten slechts over een langere termijn kunnen worden vastgesteld, doet de rechterlijk ambtenaar
      dienovereenkomstig opgave en wordt, onder voorbehoud van verrekening aan het eind van de desbetreffende termijn, op
      het inkomen een voorlopig vastgesteld bedrag in mindering gebracht met overeenkomstige toepassing van het tweede en
      derde lid.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38e
  - number: 38e.8
    text: |-
      De functionele autoriteit kan bij de vaststelling van het bedrag van de vermindering ten gunste van de rechterlijk
      ambtenaar afwijken van de opgave.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38e
  - number: 38e.9
    text: |-
      Onze Minister kan bij ministeriële regeling nadere voorschriften geven met betrekking tot de wijze van opgave van
      inkomsten van de rechterlijk ambtenaar.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38e
  - number: 38e.10
    text: |-
      De rechterlijk ambtenaar verstrekt aan de functionele autoriteit alle inlichtingen en gegevens omtrent zijn
      omstandigheden die voor de uitvoering van de [artikelen 38d][ref1] en [38e][ref2] noodzakelijk zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel38d
      [ref2]: https://wetten.overheid.nl/BWBR0006530#Artikel38e
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38e
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: 38d
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0006530
        artikel: 38e
        hoofdstuk: '5'
  - number: 38f
    text: |-
      Ten aanzien van de rechterlijke ambtenaren bij de rechtbanken en de gerechtshoven, worden de bevoegdheden in
      de ingevolge [artikel 16 van de wet][ref1] overeenkomstige bepalingen, behoudens de daarin aan Onze Minister
      van Binnenlandse Zaken en Koninkrijksrelaties toegekende bevoegdheden en met uitzondering van de regelgevende
      bevoegdheden, uitgeoefend door de functionele autoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel16
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38f
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '16'
  - number: 38g.1
    text: |-
      De rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding heeft recht op een eindejaarsuitkering ter hoogte
      van:
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38g
  - number: 38g.1.a
    text: 0,8% van het in dat jaar genoten salaris; en
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38g
  - number: 38g.1.b
    text: een door Onze Minister vast te stellen nominaal bedrag.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38g
  - number: 38g.2
    text: |-
      Indien de rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding aanspraak heeft op een WAO-uitkering, een ZW-
      uitkering of een uitkering op grond van de [Wet arbeid en zorg][ref1], wordt voor de toepassing van het eerste lid
      het salaris in acht genomen dat de rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding zou hebben genoten
      indien hij geen aanspraak op een WAO-uitkering, een ZW-uitkering of een uitkering op grond van de Wet arbeid en
      zorg zou hebben gehad.


      [ref1]: https://wetten.overheid.nl/BWBR0013008
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38g
    references:
      - id: ref1
        bwb_id: BWBR0013008
  - number: 38g.3
    text: |-
      Het bedrag, bedoeld in het eerste lid, onderdeel b, bedraagt voor de rechterlijk ambtenaar of rechterlijk ambtenaar
      in opleiding die is aangesteld voor het vervullen van minder dan een volledige taak, een met zijn werktijd
      overeenkomend deel van het bedrag dat hij zou hebben ontvangen indien hij in hetzelfde ambt zou zijn aangesteld
      voor het vervullen van een volledige taak.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38g
  - number: 38g.4
    text: De eindejaarsuitkering wordt uitbetaald in de maand december van het desbetreffende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38g
  - number: 38g.5
    text: |-
      In geval van ontslag en overlijden wordt de eindejaarsuitkering zo veel mogelijk uitbetaald in de maand na het
      ontslag of overlijden.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38g
  - number: 38h
    text: |-
      Onze Minister kan regels stellen ten aanzien van het verrichten van werkzaamheden ten behoeve van de taakvervulling
      in de woning van de rechterlijk ambtenaar of rechterlijk ambtenaar in opleiding.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38h
  - number: 38i
    text: |-
      Onze Minister kan regels stellen ten aanzien van de vergoeding van de literatuur die voor de rechterlijk ambtenaar
      of rechterlijk ambtenaar in opleiding naar het oordeel van de functionele autoriteit noodzakelijk is voor een
      correcte uitoefening van de taakvervulling.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38i
  - number: 38j.1
    text: |-
      In dit artikel en de daarop berustende bepalingen wordt onder ouder, kinderopvang respectievelijk gastouderopvang
      verstaan hetgeen hieronder wordt verstaan in de [Wet kinderopvang][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017017
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38j
    references:
      - id: ref1
        bwb_id: BWBR0017017
  - number: 38j.2
    text: |-
      De rechterlijk ambtenaar die is aangesteld voor het vervullen van een volledige of gedeeltelijke taak of
      rechterlijk ambtenaar in opleiding die ouder is, heeft recht op een bijdrage in de kosten van kinderopvang en
      gastouderopvang.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38j
  - number: 38j.3
    text: |-
      Bij regeling van Onze Minister kunnen regels gesteld worden omtrent de bijdrage in de kosten voor kinderopvang
      en gastouderopvang.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38j
  - number: 38k.1
    text: |-
      De rechterlijke ambtenaren die zijn aangesteld of aangewezen voor het vervullen van een volledige of gedeeltelijke
      taak en de rechterlijke ambtenaren in opleiding kunnen gebruikmaken van de mogelijkheid tot individuele keuzen in
      het arbeidsvoorwaardenpakket.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38k
  - number: 38k.2
    text: Onze Minister stelt regels ten aanzien van de mogelijkheid tot individuele keuzen in het arbeidsvoorwaardenpakket.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38k
  - number: 38l.1
    text: |-
      De rechterlijk ambtenaar die werkzaamheden verricht als rechter-commissaris in strafzaken of piketofficier ontvangt
      een toelage.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38l
  - number: 38l.2
    text: Onze Minister stelt regels ten aanzien van de hoogte van de toelage.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38l
  - number: 38m.1
    text: |-
      Aan de niet voor het leven benoemde rechterlijk ambtenaar, die naar het oordeel van Onze Minister
      onderscheidenlijk, indien het een bij een gerechtshof of rechtbank werkzame gerechtsauditeur betreft, het
      gerechtsbestuur zijn functie uitstekend vervult, kan een eenmalige toeslag worden toegekend.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38m
  - number: 38m.2
    text: |-
      Het oordeel over de wijze waarop een functie wordt vervuld, bedoeld in het eerste lid, komt tot
      stand op basis van het verslag van een met de rechterlijk ambtenaar gehouden functioneringsgesprek
      als bedoeld in [artikel 37, tweede lid][ref1], of een vastgestelde beoordeling als bedoeld in
      [artikel 37, tweede tot en met vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0006530#Artikel37
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38m
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '37'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0006530
        artikel: '37'
        hoofdstuk: '5'
  - number: 38q.1
    text: |-
      De rechterlijke ambtenaren die zijn aangesteld of aangewezen voor het vervullen van een volledige of gedeeltelijke
      taak en de rechterlijke ambtenaren in opleiding kunnen gebruikmaken van de mogelijkheid van levensloopverlof.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38q
  - number: 38q.2
    text: Onze Minister stelt regels ten aanzien van levensloopverlof.
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel38q
  - number: '39.1'
    text: |-
      De op grond van de [artikelen 125][ref1] en [125c van de Ambtenarenwet][ref2] bij of krachtens algemene
      maatregel van bestuur tot stand gebrachte algemeen verbindende voorschriften zoals die tot en met 31 maart
      1994 golden ten aanzien van de niet voor het leven benoemde rechterlijke ambtenaren en de rechterlijke
      ambtenaren in opleiding, bedoeld in [artikel 145 van de Wet op de rechterlijke organisatie][ref3],
      zijn ten aanzien van hen van overeenkomstige toepassing, met uitzondering van de algemeen
      verbindende voorschriften die tot stand zijn gebracht op grond van het op 31 maart 1994 geldende
      [artikel 125, eerste lid, onderdelen c, d, e, f, g, h, i, j, l en m, van de Ambtenarenwet][ref4], en met
      uitzondering van de [artikelen 9b][ref5], [9c][ref6], [94a][ref7], [96][ref8], [98][ref9], [99][ref10],
      [100][ref11] en [102, eerste, tweede en vierde lid, van het Algemeen Rijksambtenarenreglement][ref12].


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel125
      [ref2]: https://wetten.overheid.nl/BWBR0001947#Artikel125c
      [ref3]: https://wetten.overheid.nl/BWBR0001830#Artikel145
      [ref4]: https://wetten.overheid.nl/BWBR0001947#Artikel125
      [ref5]: https://wetten.overheid.nl/BWBR0001950#Artikel9b
      [ref6]: https://wetten.overheid.nl/BWBR0001950#Artikel9c
      [ref7]: https://wetten.overheid.nl/BWBR0001950#Artikel94a
      [ref8]: https://wetten.overheid.nl/BWBR0001950#Artikel96
      [ref9]: https://wetten.overheid.nl/BWBR0001950#Artikel98
      [ref10]: https://wetten.overheid.nl/BWBR0001950#Artikel99
      [ref11]: https://wetten.overheid.nl/BWBR0001950#Artikel100
      [ref12]: https://wetten.overheid.nl/BWBR0001950#Artikel102
    url: https://wetten.overheid.nl/BWBR0006530/2006-04-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: '125'
      - id: ref2
