  - number: '39.2'
    text: |-
      In afwijking van het eerste lid is [artikel 48, eerste lid, van het Algemeen Rijksambtenarenreglement][ref1] van
      overeenkomstige toepassing zoals dat luidde op 1 januari 1996.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel48
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '48'
  - number: '39.3'
    text: |-
      In afwijking van het eerste lid zijn de [artikelen 6][ref1], [9][ref2] en
      [97b van het Algemeen Rijksambtenarenreglement][ref3] van overeenkomstige toepassing, zoals die op 1 februari 1997
      golden voor de burgerlijke rijksambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0001950#Artikel97b
