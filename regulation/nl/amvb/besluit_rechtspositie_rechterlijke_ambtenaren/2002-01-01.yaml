  - number: '2.1'
    text: |-
      Het secretariaat van het overleg wordt gevoerd door een secretaris, zo nodig bijgestaan door één of meer adjunct-
      secretarissen. Deze functionarissen worden na overleg met de Sectorcommissie benoemd door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel2
  - number: '2.2'
    text: |-
      Van het overleg worden door de secretaris notulen gemaakt, die worden toegezonden aan de voorzitter van het
      overleg, de Sectorcommissie en mogelijke andere deelnemers aan het overleg.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel2
  - number: '3'
    text: De Sectorcommissie is bevoegd aan de voorzitter van het overleg onderwerpen ter plaatsing op de agenda op te geven.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel3
  - number: '4'
    text: De deelnemers aan het overleg kunnen omtrent het in de vergadering verhandelde geheimhouding overeenkomen.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel4
  - number: '5.1'
    text: 'Uitgesloten van het lidmaatschap of het plaatsvervangend lidmaatschap van de Advies- en Arbitragecommissie zijn:'
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel5
  - number: 5.1.a
    text: personen die lid zijn van de Sectorcommissie;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel5
  - number: 5.1.b
    text: personen die bestuurslid zijn van, dan wel werkzaam zijn bij de Nederlandse Vereniging voor Rechtspraak;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel5
  - number: 5.1.c
    text: |-
      personen die bestuurslid zijn van, dan wel werkzaam zijn bij, een in
      [artikel 50, tweede lid, onderdeel b, van de wet][ref1] bedoelde vereniging of centrale van verenigingen van
      ambtenaren;


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel50
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '50'
  - number: 5.1.d
    text: |-
      personen, werkzaam bij de ministeries en de daaronder ressorterende instellingen, diensten en bedrijven, wier
      onafhankelijkheid en onpartijdigheid op grond van hun dienstverband door de deelnemers aan het overleg onvoldoende
      wordt geacht.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel5
  - number: '5.2'
    text: |-
      De personen, bedoeld in het eerste lid, zijn eveneens uitgesloten van het lidmaatschap of het plaatsvervangend
      lidmaatschap, bedoeld in het eerste lid, onderdelen *a* en *b*, alsmede na beëindiging van de werkzaamheden,
      bedoeld in het eerste lid, onderdelen *b* en *c*.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel5
  - number: '5.3'
    text: |-
      Aan de op grond van [artikel 53, eerste lid, van de wet][ref1] benoemde leden en de plaatsvervangende leden
      worden uit ’s Rijks kas vergoedingen voor reis- en verblijfkosten verleend volgens de regelen welke voor reis- en
      verblijfkosten wegens reizen voor ’s Rijks dienst gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel53
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '53'
  - number: '6.1'
    text: |-
      De Advies- en Arbitragecommissie treedt in geval van advies of arbitrale uitspraak ten aanzien van de gelegenheden
      die haar ingevolge de [artikelen 51, derde lid][ref1], of [52, tweede lid, onderdeel b, van de wet][ref2] worden
      voorgelegd, op in een samenstelling van vijf leden, onder wie de voorzitter en de twee leden die overeenkomstig
      [artikel 53, eerste lid, van de wet][ref3] zijn benoemd. Bij verhindering van een van de leden treedt diens
      plaatsvervanger op.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel52
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel53
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '51'
      - id: ref2
        bwb_id: BWBR0008365
        artikel: '52'
      - id: ref3
        bwb_id: BWBR0008365
        artikel: '53'
  - number: '6.2'
    text: |-
      Indien het verzoek om een arbitrale uitspraak naar het oordeel van de voorzitter van de Advies- en
      Arbitragecommissie een zelfde geschil betreft als waarover door de Advies- en Arbitragecommissie in dezelfde
      samenstelling reeds advies is uitgebracht, treedt voor een lid die bij het uitbrengen van dat advies betrokken was,
      diens plaatsvervanger op.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel6
  - number: '7.1'
    text: |-
      Indien overeenkomstig [artikel 52, tweede lid, onderdeel b, van de wet][ref1] wordt besloten het advies in
      te winnen van de Advies- en Arbitragecommissie, wordt binnen drie dagen na de desbetreffende vergadering het
      verzoek om advies ter kennis gebracht van de voorzitter van de Advies- en Arbitragecommissie. Het verzoek
      wordt ondertekend door de deelnemers aan het overleg die zich voor inwinning van advies hebben uitgesproken
      en bevat ten minste het onderwerp en de inhoud van het geschil. Indien in de vergadering, bedoeld in
      [artikel 52, tweede lid, van de wet][ref2] geen overeenstemming is bereikt tussen de deelnemers aan het overleg
      over de vraag wat het onderwerp en de inhoud van het geschil is, brengt de andere deelnemer aan het overleg zijn
      visie op het onderwerp en de inhoud van het geschil eveneens drie dagen na die vergadering ter kennis van de
      voorzitter van de Advies- en Arbitragecommissie.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel52
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '52'
      - id: ref2
        bwb_id: BWBR0008365
        artikel: '52'
  - number: '7.2'
    text: |-
      Indien overeenkomstig [artikel 52, tweede lid, onderdeel b, van de wet][ref1] wordt besloten het geschil aan een
      arbitrale uitspraak te onderwerpen van de Advies- en Arbitragecommissie, wordt binnen drie dagen na de vergadering,
      bedoeld in dat artikel, het verzoek om een arbitrale uitspraak ter kennis gebracht van de voorzitter van de Advies-
      en Arbitragecommissie. Het verzoek wordt daartoe ondertekend door de deelnemers aan het overleg en dient ten minste
      te bevatten:


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel52
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '52'
  - number: 7.2.a
    text: het onderwerp en de inhoud van het geschil, en
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel7
  - number: 7.2.b
    text: de standpunten van de deelnemers aan het overleg omtrent onderwerp en inhoud van het geschil.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel7
  - number: '7.3'
    text: |-
      Indien overeenkomstig [artikel 51, derde lid, van de wet][ref1] het geschil wordt onderworpen aan een arbitrale
      uitspraak van de Advies- en Arbitragecommissie, wordt zo spoedig mogelijk het verzoek om een arbitrale uitspraak
      ter kennis gebracht van de voorzitter van de Advies- en Arbitragecommissie. Het verzoek wordt ondertekend door de
      deelnemers aan het overleg en bevat hun standpunten ten aanzien van het onderwerp en inhoud van het geschil.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel51
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '51'
  - number: '8.1'
    text: |-
      De leden, de plaatsvervangende leden en de secretaris, die bij de uitoefening van hun taak de beschikking krijgen
      over gegevens waarvan zij het vertrouwelijk karakter kennen of redelijkerwijs moeten vermoeden, zijn, voor
      zover voor hen niet reeds uit hoofde van ambt, beroep of wettelijk voorschrift ter zake van die gegevens een
      geheimhoudingsplicht geldt, verplicht tot geheimhouding daarvan, behoudens voor zover enig wettelijk voorschrift
      hen tot bekendmaking verplicht of uit hun taak de noodzaak tot bekendmaking voortvloeit.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel8
  - number: '8.2'
    text: De Advies- en Arbitragecommissie stelt nadere regels vast met betrekking tot haar werkwijze.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel8
  - number: '9.1'
    text: De Advies- en Arbitragecommissie besluit bij meerderheid van stemmen.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel9
  - number: '9.2'
    text: 'Het advies of de arbitrale uitspraak moet inhouden:'
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel9
  - number: 9.2.a
    text: de namen van deelnemers die het advies of de arbitrale uitspraak hebben aangevraagd,
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel9
  - number: 9.2.b
    text: een overzicht van de standpunten van de deelnemers over het onderwerp en de inhoud van het geschil, en
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel9
  - number: 9.2.c
    text: het advies dan wel de arbitrale beslissing en de redenen die daaraan ten grondslag liggen.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel9
  - number: '9.3'
    text: |-
      Het advies of de arbitrale uitspraak wordt gedagtekend en door ieder van de optredende leden van de Advies- en
      Arbitragecommissie ondertekend.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel9
  - number: '9.4'
    text: |-
      De voorzitter van de Advies- en Arbitragecommissie draagt er zorg voor dat het advies of de arbitrale uitspraak
      binnen vier weken nadat de kennisgeving, bedoeld in [artikel 7][ref1], is ontvangen, aan de deelnemers aan het
      overleg ter kennis wordt gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel7
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 9a.1
    text: |-
      De eed of belofte, bedoeld in [artikel 1g, eerste lid, van de wet][ref1], wordt afgenomen op requisitoir van het
      openbaar ministerie dan wel van de procureur-generaal bij de Hoge Raad.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel1g
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 1g
  - number: 9a.2
    text: 'De eed wordt afgelegd:'
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel9a
  - number: 9a.2.a
    text: 'ten overstaan van de rechterlijk ambtenaar, tevens zijnde president van de rechtbank, door:'
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel9a
  - number: 9a.2.a.1°
    text: |-
      de coördinerend vice-presidenten senior van, de coördinerend-vice presidenten van, de vice-presidenten van en de
      rechters in die rechtbanken;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel9a
  - number: 9a.2.a.2°
    text: de rechters-plaatsvervangers in die rechtbanken;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel9a
  - number: 9a.2.a.3°
    text: de gerechtsauditeurs bij die rechtbanken;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel9a
  - number: 9a.2.a.4°
    text: |-
      de officieren van justitie bij het arrondissementsparket en het landelijk parket dat is gevestigd in de plaats van
      vestiging van die rechtbank;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel9a
  - number: 9a.2.a.5°
    text: |-
      de plaatsvervangende officieren van justitie bij het arrondissementsparket en het landelijk parket dat is gevestigd
      in de plaats van vestiging van die rechtbank.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel9a
  - number: 9a.2.b
    text: 'ten overstaan van de rechterlijk ambtenaar, tevens zijnde president van het gerechtshof, door:'
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel9a
  - number: 9a.2.b.1°
    text: |-
      de coördinerend vice-presidenten senior van, de coördinerend vice-presidenten van, de vice-presidenten van en de
      raadsheren in die gerechtshoven;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel9a
  - number: 9a.2.b.2°
    text: de raadsheren-plaatsvervangers in die gerechtshoven;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel9a
  - number: 9a.2.b.3°
    text: de gerechtsauditeurs bij de gerechtshoven;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel9a
  - number: 9a.2.b.4°
    text: de advocaten-generaal bij het ressortsparket dat is gevestigd in de plaats van vestiging van het gerechtshof;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel9a
  - number: 9a.2.b.5°
    text: |-
      de plaatsvervangende advocaten-generaal bij het ressortsparket dat is gevestigd in de plaats van vestiging van
      het gerechtshof.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel9a
  - number: 9a.2.c
    text: 'ten overstaan van de Hoge Raad door:'
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel9a
  - number: 9a.2.c.1°
    text: de procureurs-generaal die het College van procureurs-generaal vormen;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel9a
  - number: 9a.2.c.2°
    text: de gerechtsauditeurs bij de Hoge Raad;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel9a
  - number: 9a.2.d
    text: 'ten overstaan van de Koning of ten overstaan van Onze Minister, daartoe door de Koning gemachtigd, door:'
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel9a
  - number: 9a.2.d.1°
    text: de president van, de vice-presidenten van en de raadsheren in de Hoge Raad;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel9a
  - number: 9a.2.d.2°
    text: de procureur-generaal bij, de plaatsvervangend procureur-generaal bij en de advocaten-generaal bij de Hoge Raad;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel9a
  - number: 9a.2.d.3°
    text: de griffier en de substituut-griffiers van de Hoge Raad.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel9a
  - number: 9a.4
    text: De eed of belofte wordt afgelegd overeenkomstig het als bijlage bij dit besluit gehechte formulier.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel9a
  - number: 9a.5
    text: |-
      Het formulier, bedoeld in het vierde lid, wordt na het afleggen van de eed of belofte ondertekend door de
      rechterlijk ambtenaar, de rechterlijk ambtenaar tevens zijnde president van de rechtbank of de rechterlijk
      ambtenaar tevens zijnde president van het gerechtshof dan wel namens de Hoge Raad.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel9a
  - number: 9b.1
    text: |-
      Het bestuur van een gerechtshof of een rechtbank houdt een register bij, waarin de koninklijke besluiten
      betreffende de benoeming van de daar beëdigde rechterlijke ambtenaren en de formulieren betreffende de afgelegde
      eed of belofte worden bewaard.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel9b
  - number: 9b.2
    text: |-
      Een uittreksel uit dat register, inclusief het formulier betreffende de eed of belofte, wordt aan de rechterlijk
      ambtenaar uitgereikt.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel9b
  - number: 9b.3
    text: |-
      De griffier van de Hoge Raad houdt een afzonderlijk register bij, waarin de benoeming van rechterlijke ambtenaren
      bij de Hoge Raad wordt ingeschreven. Tevens houdt de griffier van de Hoge Raad een register bij waarin de
      Koninklijke Besluiten worden ingeschreven, bevattende de benoeming van rechterlijke ambtenaren die voor een
      beëdiging bij de Hoge Raad zijn toegelaten. Tevens worden in dit register de formulieren betreffende de afgelegde
      eed of belofte bewaard.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel9b
  - number: 9c.1
    text: |-
      De installatie, bedoeld in [artikel 1g, derde lid, van de wet][ref1], geschiedt door middel van het op een
      terechtzitting voorlezen van het formulier, bedoeld in [artikel 9a, vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel1g
      [ref2]: https://wetten.overheid.nl/BWBR0006530#Artikel9a
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel9c
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 1g
      - id: ref2
        bwb_id: BWBR0006530
        artikel: 9a
        hoofdstuk: 2a
  - number: 9c.2
    text: |-
      In geval van een opvolgende benoeming binnen een zelfde gerecht of parket, kan de functionele autoriteit bepalen
      dat de installatie achterwege blijft.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel9c
  - number: 9c.3
    text: |-
      De raadsheren in buitengewone dienst van de Hoge Raad, de advocaten-generaal in buitengewone dienst van de Hoge
      Raad, de raadsheren plaatsvervangers, de rechters-plaatsvervangers, de leden van het College van procureurs-
      generaal, de plaatsvervangende advocaten-generaal bij de ressortsparketten, de plaatsvervangende officieren van
      justitie en de gerechtsauditeurs worden niet geïnstalleerd.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel9c
  - number: '10'
    text: 'In dit hoofdstuk wordt onder rechterlijk ambtenaar mede verstaan: rechterlijk ambtenaar in opleiding.'
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel10
  - number: '11.1'
    text: |-
      Onverminderd hetgeen terzake is bepaald in de [Arbeidsomstandighedenwet 1998][ref1] geniet de rechterlijk ambtenaar
      arbeidsgezondheidskundige begeleiding op basis van dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0010346
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0010346
  - number: '11.2'
    text: |-
      De functionele autoriteit is verantwoordelijk voor de begeleiding van verzuim en de arbeidsgezondheidskundige
      begeleiding van de rechterlijk ambtenaar.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel11
  - number: '11.3'
    text: |-
      Onze Minister kan regels vaststellen met betrekking tot de wijze waarop invulling wordt gegeven aan de begeleiding
      van verzuim, de arbeidsgezondheidskundige begeleiding en de daarbij in acht te nemen procedures. Van het
      vaststellen van deze regels kan Onze Minister mandaat verlenen.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel11
  - number: '12.1'
    text: |-
      De rechterlijk ambtenaar geeft in geval van ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte hiervan
      zo spoedig mogelijk, doch uiterlijk op de tweede dag van die ongeschiktheid, kennis aan de functionele autoriteit.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel12
  - number: '12.2'
    text: |-
      Ten aanzien van de rechterlijk ambtenaar die wegens ziekte ongeschikt is geweest om zijn arbeid te verrichten, kan
      de functionele autoriteit bepalen dat de rechterlijk ambtenaar zijn arbeid slechts mag hervatten nadat hiervoor
      door hem toestemming is verleend.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel12
  - number: '12.3'
    text: |-
      De rechterlijk ambtenaar die wegens ziekte gedurende een jaar of langer volledig ongeschikt is geweest om zijn
      arbeid te verrichten, mag zijn arbeid slechts hervatten nadat de functionele autoriteit hiervoor toestemming heeft
      verleend.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel12
  - number: '12.4'
    text: |-
      De functionele autoriteit verleent de in het tweede en het derde lid bedoelde toestemming eerst nadat er een
      medisch advies is.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel12
  - number: '13.1'
    text: 'De rechterlijk ambtenaar kan worden verplicht om een arbeidsgezondheidskundig onderzoek te ondergaan:'
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel13
  - number: 13.1.a
    text: |-
      indien de functionele autoriteit gegronde redenen heeft om te twijfelen aan de goede gezondheidstoestand van de
      rechterlijk ambtenaar;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel13
  - number: 13.1.b
    text: |-
      indien de rechterlijk ambtenaar niet meer volledig geschikt is gebleken voor het verrichten van zijn arbeid,
      teneinde na te gaan of hiervoor medische oorzaken aanwezig zijn, en zo ja, of de rechterlijk ambtenaar geschikt kan
      worden geacht voor het verrichten van andere arbeid;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel13
  - number: 13.1.c
    text: |-
      ter beantwoording van de vraag of de rechterlijk ambtenaar tijdens het tijdvak waarin hij wegens ziekte ongeschikt
      is om zijn arbeid te verrichten, in het belang van zijn genezing arbeid mag verrichten en om vast te stellen welke
      arbeid wenselijk wordt geacht;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel13
  - number: 13.1.d
    text: |-
      ter beantwoording van de vraag of, in welke mate en tot welk tijdstip de rechterlijk ambtenaar ongeschikt is tot
      het verrichten van zijn arbeid wegens ziekte;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel13
  - number: 13.1.e
    text: |-
      om te beoordelen of de rechterlijk ambtenaar die wegens ziekte ongeschikt is geweest om zijn arbeid te verrichten
      zijn arbeid mag hervatten; of
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel13
  - number: 13.1.f
    text: voorzover dit voortvloeit uit enige wettelijke verplichting.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel13
  - number: '13.2'
    text: |-
      De functionele autoriteit verleent de rechterlijk ambtenaar, gehoord deze laatste, ziekteverlof indien na
      een arbeidsgezondheidskundig onderzoek als bedoeld in het eerste lid, blijkt dat sprake is van een zodanige
      lichamelijke of geestelijke toestand dat de belangen van de rechterlijk ambtenaar, van de arbeid of van bij het
      verrichten van de arbeid betrokken derden zich er tegen verzetten dat de rechterlijk ambtenaar zijn arbeid blijft
      verrichten.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel13
  - number: '13.3'
    text: |-
      Ziekteverlof als bedoeld in het tweede lid wordt niet verleend indien de rechterlijk ambtenaar andere passende
      werkzaamheden kunnen worden opgedragen.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel13
  - number: '13.4'
    text: |-
      Indien ziekteverlof als bedoeld in het tweede lid wordt verleend, wordt de rechterlijk ambtenaar geacht wegens
      ziekte ongeschikt te zijn tot het verrichten van zijn arbeid en zijn de overige bepalingen van dit hoofdstuk van
      toepassing. De functionele autoriteit kan ter effectuering van bedoeld ziekteverlof maatregelen treffen.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel13
  - number: '14.1'
    text: |-
      Het medisch advies dat wordt uitgebracht naar aanleiding van een arbeidsgezondheidskundig onderzoek als bedoeld
      in [artikel 13][ref1], wordt zo spoedig mogelijk aan de rechterlijk ambtenaar en de functionele autoriteit
      schriftelijk medegedeeld. De rechterlijk ambtenaar wordt daarbij gewezen op de in het tweede lid bedoelde
      mogelijkheid om een hernieuwd onderzoek te verzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel13
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '14.2'
    text: |-
      De rechterlijk ambtenaar kan de Arbo-dienst binnen drie dagen na ontvangst van het medisch advies schriftelijk
      om een hernieuwd onderzoek verzoeken indien hij het niet eens is met het medisch advies. De Arbo-dienst stelt de
      functionele autoriteit in kennis van een ingediend verzoek als bedoeld in [de vorige volzin][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel14
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '14.3'
    text: |-
      Zo spoedig mogelijk na ontvangst van het schriftelijke verzoek als bedoeld in het tweede lid, doch uiterlijk binnen
      vier weken, vindt het hernieuwd onderzoek door een commissie van drie artsen plaats. De rechterlijk ambtenaar kan
      worden verplicht om in het kader hiervan een onderzoek te ondergaan.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel14
  - number: '14.4'
    text: |-
      Op verzoek van de rechterlijk ambtenaar wordt zijn behandelend arts in de gelegenheid gesteld mondeling of
      schriftelijk zijn mening aan de commissie van drie artsen kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel14
  - number: '14.5'
    text: |-
      De kosten van het hernieuwd onderzoek komen voor rekening van Onze Minister. Eventuele reis- en verblijfkosten van
      de rechterlijk ambtenaar worden hem vergoed overeenkomstig de regels die gelden voor burgerlijke rijksambtenaren.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel14
  - number: '15.1'
    text: |-
      De leden van de commissie, bedoeld in [artikel 14, derde en vierde lid][ref1], worden per verzoek om een hernieuwd
      onderzoek aangewezen door Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel14
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '15.2'
    text: |-
      De arts die betrokken is geweest bij het opstellen van het medisch advies naar aanleiding waarvan om een hernieuwd
      onderzoek wordt gevraagd, heeft in de commissie geen zitting.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel15
  - number: '15.3'
    text: |-
      De commissie deelt haar oordeel schriftelijk mede aan de rechterlijk ambtenaar, de functionele autoriteit en de
      behandelend arts, bedoeld in [artikel 14, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel14
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '16'
    text: |-
      De [artikelen 13 tot en met 15][ref1] zijn van overeenkomstige toepassing op de gewezen rechterlijk ambtenaar
      voorzover het zijn aanspraken op basis van dit hoofdstuk betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel13
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '17.1'
    text: |-
      De rechterlijk ambtenaar heeft bij ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte gedurende een
      tijdvak van 52 weken recht op de doorbetaling van zijn bezoldiging.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel17
  - number: '17.2'
    text: |-
      De rechterlijk ambtenaar die na het in het eerste lid bedoelde tijdvak van 52 weken op grond van zijn aanstelling
      aanspraak heeft op een WAO-uitkering onderscheidenlijk ongeschikt is wegens ziekte tot het verrichten van zijn
      arbeid doch anders dan als gevolg van eigen handelingen of nalaten van handelingen geen aanspraak heeft op een WAO-
      uitkering, heeft:
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel17
  - number: 17.2.a
    text: |-
      gedurende een tijdvak van ten hoogste 26 weken, aanspraak op een bovenwettelijke arbeidsongeschiktheidsuitkering
      ter grootte van het verschil tussen zijn bezoldiging en de WAO-uitkering onderscheidenlijk op de doorbetaling van
      zijn bezoldiging; en
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel17
  - number: 17.2.b
    text: |-
      daarna, aanspraak op een bovenwettelijke arbeidsongeschiktheidsuitkering ter grootte van het verschil tussen 80%
      van zijn bezoldiging en de WAO-uitkering onderscheidenlijk op de doorbetaling van 80% van zijn bezoldiging.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel17
  - number: '17.3'
    text: |-
      De rechterlijk ambtenaar heeft ook na afloop van het tijdvak van 26 weken, bedoeld in het tweede lid, aanspraak op
      een bovenwettelijke arbeidsongeschiktheidsuitkering ter grootte van het verschil tussen zijn bezoldiging en de WAO-
      uitkering onderscheidenlijk op de doorbetaling van zijn bezoldiging:
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel17
  - number: 17.3.a
    text: voor zolang hij zijn arbeid voor ten minste 45% verricht;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel17
  - number: 17.3.b
    text: |-
      indien hij in het belang van zijn genezing door de Arbo-dienst wenselijk geachte andere arbeid verricht voor ten
      minste 45% van de taakomvang waarvoor hij is aangesteld; of
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel17
  - number: 17.3.c
    text: |-
      indien de ziekte, uit hoofde waarvan hij ongeschikt is om zijn arbeid te verrichten, is veroorzaakt door een
      dienstongeval of een door het verrichten van zijn arbeid opgelopen beroepsziekte.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel17
  - number: '17.4'
    text: |-
      De rechterlijk ambtenaar die op grond van [artikel 35][ref1] van dit besluit onderscheidenlijk
      [artikel 46k van de wet][ref2] is herplaatst voordat de termijn van twee jaar, bedoeld
      in [artikel 36, derde lid, onderdeel a][ref3], van dit besluit onderscheidenlijk
      [artikel 46i, eerste lid, onderdeel a, van de wet][ref4] is verstreken, heeft tot het einde van de laatstgenoemde
      termijn aanspraak op een aanvullende uitkering, indien zijn bezoldiging als gevolg van die herplaatsing
      vermindering ondergaat, ter grootte van het verschil tussen:


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46k
      [ref3]: https://wetten.overheid.nl/BWBR0006530#Artikel36
      [ref4]: https://wetten.overheid.nl/BWBR0008365#Artikel46i
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '35'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 46k
      - id: ref3
        bwb_id: BWBR0006530
        artikel: '36'
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0008365
        artikel: 46i
  - number: 17.4.a
    text: |-
      het bedrag waarop de rechterlijk ambtenaar op grond van dit artikel, onderscheidenlijk op grond van de [WAO][ref1]
      alsmede op grond van dit artikel, recht zou hebben gehad indien hem geen andere taak zou zijn opgedragen, maar in
      plaats daarvan zijn eigen taak met dezelfde omvang; en


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: 17.4.b
    text: |-
      zijn bezoldiging na herplaatsing, in voorkomend geval vermeerderd met een uit de oorspronkelijke taak voortvloeiend
      recht op een WAO-uitkering, een invaliditeitspensioen of een herplaatsingstoelage.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel17
  - number: '17.5'
    text: |-
      De rechterlijk ambtenaar die is herplaatst op grond van [artikel 35][ref1] van dit besluit onderscheidenlijk
      [artikel 46k van de wet][ref2], heeft tevens aanspraak op een aanvullende uitkering nadat de termijn van twee
      jaar, bedoeld in het vierde lid, is verstreken, indien de ziekte uit hoofde waarvan hij ongeschikt is om zijn
      arbeid te verrichten, wordt veroorzaakt door een dienstongeval of een door het verrichten van zijn arbeid opgelopen
      beroepsziekte, ter grootte van het verschil tussen:


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46k
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '35'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 46k
  - number: 17.5.a
    text: |-
      een percentage van zijn bezoldiging, zoals die zou zijn op de dag voorafgaand aan zijn herplaatsing indien hij op
      die dag niet ongeschikt zou zijn geweest om zijn arbeid te verrichten; en
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel17
  - number: 17.5.b
    text: |-
      zijn bezoldiging na herplaatsing, in voorkomend geval vermeerderd met een uit de oorspronkelijke taak voortvloeiend
      recht op een WAO-uitkering, een invaliditeitspensioen of een herplaatsingstoelage.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel17
  - number: '17.6'
    text: |-
      Het percentage, bedoeld in het vijfde lid, onderdeel a, is afhankelijk van de mate van arbeidsongeschiktheid en
      bedraagt bij een arbeidsongeschiktheid van: 80% of meer: 90,02%; 65 tot 80%: 65,26%; 55 tot 65%: 54,01%; 45 tot
      55%: 45,01%; 35 tot 45%: 36,01%; 25 tot 35%: 27,01%; 15 tot 25%: 18,00%.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel17
  - number: '18.1'
    text: |-
      De gewezen rechterlijk ambtenaar die wegens ziekte, ontstaan voor het tijdstip van ingang van zijn ontslag, na
      zijn ontslag anders dan op grond van [artikel 36, eerste lid, onderdeel f, van dit besluit ][ref1]onderscheidenlijk
      [artikel 46i van de wet][ref2], nog ongeschikt is om een naar aard en omvang soortgelijke taak te verrichten,
      heeft:


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46i
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '36'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 46i
  - number: 18.1.a
    text: |-
      zolang hij ongeschikt is tot het verrichten van arbeid wegens ziekte en voor ten hoogste het met ingang van zijn
      ontslag nog resterende gedeelte van het tijdvak van 52 weken, aanspraak op de doorbetaling van zijn laatstelijk
      genoten bezoldiging; en
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel18
  - number: 18.1.b
    text: |-
      indien hij na het tijdvak van 52 weken op grond van zijn arbeidsongeschiktheid aanspraak heeft op een WAO-uitkering
      onderscheidenlijk wegens ziekte ongeschikt is tot het verrichten van arbeid doch anders dan als gevolg van zijn
      eigen handelingen of nalaten van handelingen geen aanspraak op een WAO-uitkering heeft, zolang hij ongeschikt
      is tot het verrichten van arbeid wegens ziekte en voor ten hoogste een tijdvak van 26 weken, aanspraak op een
      bovenwettelijke arbeidsongeschiktheidsuitkering ter grootte van het verschil tussen zijn laatstelijk genoten
      bezoldiging en de WAO-uitkering onderscheidenlijk op de doorbetaling van zijn laatstelijk genoten bezoldiging.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel18
  - number: '18.2'
    text: |-
      De gewezen rechterlijk ambtenaar die binnen een maand na het tijdstip van zijn ontslag ongeschikt wordt wegens
      ziekte om een naar aard en omvang soortgelijke taak te verrichten, heeft, zolang hij wegens ziekte ongeschikt is en
      voor een tijdvak van ten hoogste 52 weken, aanspraak op de doorbetaling van zijn laatstelijk genoten bezoldiging,
      indien hij gedurende ten minste twee maanden onmiddellijk voorafgaand aan het ontslag als rechterlijk ambtenaar
      aangesteld is geweest.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel18
  - number: '18.3'
    text: |-
      De gewezen rechterlijk ambtenaar die aanspraak heeft op een WAO-uitkering op grond van de aan zijn ontslag
      voorafgaande aanstelling, heeft aanspraak op een aanvullende uitkering indien de arbeidsongeschiktheid is
      veroorzaakt door een dienstongeval of een door het verrichten van zijn arbeid opgelopen beroepsziekte.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel18
  - number: '18.4'
    text: 'De in het derde lid bedoelde aanvullende uitkering is gelijk aan het verschil tussen:'
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel18
  - number: 18.4.a
    text: |-
      een percentage van de bezoldiging die de gewezen rechterlijk ambtenaar in het jaar voorafgaand aan zijn ontslag
      heeft genoten; en
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel18
  - number: 18.4.b
    text: |-
      de aan hem toegekende WAO-uitkering, in voorkomend geval vermeerderd met een hem toegekend invaliditeitspensioen of
      een hem toegekende herplaatsingstoelage.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel18
  - number: '18.5'
    text: |-
      Het percentage, bedoeld in het vierde lid, onderdeel a, is afhankelijk van de mate van arbeidsongeschiktheid en
      bedraagt bij een arbeidsongeschiktheid van: 80% of meer: 90,02%; 65 tot 80%: 65,26%; 55 tot 65%: 54,01%; 45 tot
      55%: 45,01%; 35 tot 45%: 36,01%; 25 tot 35%: 27,01%; 15 tot 25%: 18,00%.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel18
  - number: '18.6'
    text: |-
      Geen recht op een aanvullende uitkering als bedoeld in het derde lid heeft de gewezen rechterlijk ambtenaar die
      recht heeft op suppletie overeenkomstig [artikel 33][ref1]. In afwijking van de eerste volzin heeft de gewezen
      rechterlijk ambtenaar, bedoeld in het derde lid, wel recht op een aanvullende uitkering, indien zijn recht op
      suppletie niet tot uitbetaling komt ingevolge [artikel 4][ref2] van de in [artikel 33][ref3] van overeenkomstige
      toepassing verklaarde [Suppletieregeling gedeeltelijk arbeidsongeschikten sector Rijk][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0006530#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0006530#Artikel33
      [ref4]: https://wetten.overheid.nl/BWBR0007758
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0006530
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0006530
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '7'
      - id: ref4
        bwb_id: BWBR0007758
  - number: '18.7'
    text: |-
      De gewezen rechterlijk ambtenaar aan wie op eigen verzoek ontslag is verleend met het oog op een uitkering op grond
      van de Regeling flexibel pensioen en uittreden, bedoeld in artikel 3 van de Centrale vut-overeenkomst en artikel
      1.5 van het pensioenreglement, heeft slechts aanspraak op de doorbetaling van zijn laatstelijk genoten bezoldiging
      of de bovenwettelijke arbeidsongeschiktheidsuitkering, voorzover deze tezamen met de aanvullende uitkering, bedoeld
      in artikel 4 van het FPU-reglement basis- en aanvullende uitkering, de laatstgenoten bezoldiging niet overschrijdt.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel18
  - number: '19'
    text: |-
      Indien de rechterlijk ambtenaar of de gewezen rechterlijk ambtenaar zowel op grond van de aanstelling terzake
      waarvan hij krachtens [artikel 17][ref1] of [18][ref2] aanspraken heeft als op grond van een of meer andere
      betrekkingen een WAO-uitkering geniet, wordt voor de toepassing van dit hoofdstuk onder WAO-uitkering verstaan, de
      WAO-uitkering voorzover deze, naar rato van de bezoldiging uit hoofde van die aanstelling en die andere betrekking
      of betrekkingen, wordt toegerekend aan die aanstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0006530#Artikel18
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006530
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '20.1'
    text: |-
      De rechterlijk ambtenaar en de gewezen rechterlijk ambtenaar hebben geen aanspraak op de doorbetaling van de
      bezoldiging of een bovenwettelijke arbeidsongeschiktheidsuitkering:
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel20
  - number: 20.1.a
    text: |-
      indien de ziekte is voorgewend, althans zodanig overdreven wordt voorgesteld, dat ongeschiktheid tot het verrichten
      van arbeid wegens ziekte niet kan worden aangenomen;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel20
  - number: 20.1.b
    text: |-
      indien hij de ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte opzettelijk heeft veroorzaakt, tenzij
      hem daarvan op grond van psychische toestand geen verwijt kan worden gemaakt; of
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel20
  - number: 20.1.c
    text: |-
      indien de ongeschiktheid tot het verrichten van arbeid wegens ziekte zich voordoet binnen een half jaar na een
      geneeskundig onderzoek – indien dat heeft plaatsgehad in verband met zijn aanstelling – en blijkt dat hij hierbij
      onjuiste informatie omtrent zijn gezondheidstoestand heeft verstrekt of gegevens heeft verzwegen, ten gevolge
      waarvan de verklaring van geschiktheid om de desbetreffende taak te verrichten, ten onrechte heeft plaatsgevonden,
      tenzij de rechterlijk ambtenaar aannemelijk maakt dat hij te goeder trouw heeft gehandeld.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel20
  - number: '20.2'
    text: |-
      De gewezen rechterlijk ambtenaar heeft geen aanspraak op de doorbetaling van zijn laatstelijk genoten bezoldiging
      of een bovenwettelijke arbeidsongeschiktheidsuitkering, indien hij op grond van een aanvaarde andere betrekking van
      gelijke omvang aanspraak kan maken op loon of bezoldiging dan wel een ZW-uitkering.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel20
  - number: '21.1'
    text: |-
      Het tijdvak gedurende welke de rechterlijk ambtenaar en de gewezen rechterlijk ambtenaar aanspraak
      hebben op de doorbetaling van de bezoldiging, bedoeld in de [artikelen 17, eerste lid][ref1], en
      [18, eerste lid, onderdeel a, en tweede lid][ref2], vangt aan op de eerste dag waarop:


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0006530#Artikel18
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006530
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 21.1.a
    text: wegens ziekte geheel of gedeeltelijk niet is gewerkt;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel21
  - number: 21.1.b
    text: het werken wegens ziekte geheel of gedeeltelijk is gestaakt;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel21
  - number: 21.1.c
    text: wegens ziekte geheel of gedeeltelijk niet zou zijn gewerkt; of
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel21
  - number: 21.1.d
    text: het werken wegens ziekte geheel of gedeeltelijk zou zijn gestaakt.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel21
  - number: '21.2'
    text: |-
      Het tijdvak gedurende welke de rechterlijk ambtenaar en de gewezen rechterlijk ambtenaar aanspraak hebben op de in
      het eerste lid bedoelde doorbetaling van de bezoldiging, eindigt 52 weken na de in het eerste lid bedoelde eerste
      ziektedag.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel21
  - number: '21.3'
    text: |-
      Voor het bepalen van het einde van het in het tweede lid bedoelde tijdvak van 52 weken worden perioden van
      ongeschiktheid tot het verrichten van arbeid wegens ziekte samengeteld, indien deze perioden elkaar met een
      onderbreking van minder dan vier weken opvolgen.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel21
  - number: '21.4'
    text: |-
      Het tijdvak van 26 weken gedurende welke de rechterlijk ambtenaar en de gewezen rechterlijk
      ambtenaar aanspraak hebben op een bovenwettelijke arbeidsongeschiktheidsuitkering als bedoeld in de
      [artikelen 17, tweede lid, onderdeel a][ref1], en [18, eerste lid, onderdeel b][ref2], dan wel op
      de doorbetaling van de bezoldiging, bedoeld in de [artikelen 17, tweede lid, onderdeel a][ref3], en
      [18, eerste lid, onderdeel b][ref4], vangt aan op de dag nadat het tijdvak van 52 weken is geëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0006530#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0006530#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0006530#Artikel18
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006530
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0006530
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0006530
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '21.5'
    text: |-
      Voor het bepalen van het einde van het in het vierde lid bedoelde tijdvak van 26 weken worden perioden van
      ongeschiktheid tot het verrichten van arbeid wegens ziekte samengeteld, indien deze perioden elkaar met een
      onderbreking van minder dan vier weken opvolgen.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel21
  - number: '21.6'
    text: |-
      Het in het vierde lid bedoelde tijdvak van 26 weken eindigt na 26 weken, vermeerderd met de tijdvakken waarin de
      rechterlijk ambtenaar gerekend vanaf de eerste ziektedag:
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel21
  - number: 21.6.a
    text: zijn arbeid voor ten minste 45% heeft verricht; of
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel21
  - number: 21.6.b
    text: |-
      in het belang van zijn genezing door de Arbo-dienst wenselijk geachte andere arbeid heeft verricht voor ten minste
      45% van de taakomvang waarvoor hij is aangesteld.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel21
  - number: '21.7'
    text: |-
      Bij buitengewoon verlof zonder behoud van bezoldiging vangt het tijdvak, bedoeld in het eerste lid, aan op de dag
      volgende op die waarop het buitengewoon verlof is beëindigd.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel21
  - number: '21.8'
    text: |-
      Indien de aangifte, bedoeld in [artikel 38, eerste lid, van de ZW][ref1], wordt gedaan na de eerste dag nadat de
      ongeschiktheid tot het verrichten van arbeid wegens ziekte dertien weken heeft geduurd, wordt:


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel38
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '38'
  - number: 21.8.a
    text: |-
      het tijdvak van 52 weken, gedurende welke de rechterlijk ambtenaar en de gewezen rechterlijk ambtenaar aanspraak
      hebben op de doorbetaling van de bezoldiging, vermeerderd met een tijdvak ter grootte van het tijdvak tussen de
      eerste dag nadat de ongeschiktheid tot het verrichten van arbeid wegens ziekte dertien weken heeft geduurd en de
      dag waarop de aangifte is gedaan; en
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel21
  - number: 21.8.b
    text: |-
      het tijdvak van 26 weken, gedurende welke de ambtenaar en de gewezen rechterlijk ambtenaar aanspraak hebben op
      een bovenwettelijke arbeidsongeschiktheidsuitkering ter grootte van het verschil tussen hun bezoldiging en de WAO-
      uitkering dan wel op de doorbetaling van de bezoldiging, verminderd met het tijdvak ter grootte van het tijdvak
      tussen de eerste dag nadat de ongeschiktheid tot het verrichten van arbeid wegens ziekte dertien weken heeft
      geduurd en de dag waarop de aangifte is gedaan.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel21
  - number: '22.1'
    text: |-
      De doorbetaling van de bezoldiging of 80% van die bezoldiging, bedoeld in
      [artikel 17, eerste tot en met derde lid][ref1], eindigt na ommekomst van de uitkeringsduur, maar in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel17
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 22.1.a
    text: |-
      met ingang van de dag waarop de rechterlijk ambtenaar op grond van
      [artikel 35 van dit besluit ][ref1]onderscheidenlijk [artikel 46k van de wet][ref2] is herplaatst;


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46k
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '35'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 46k
  - number: 22.1.b
    text: met ingang van de dag waarop de rechterlijk ambtenaar ontslag is verleend; of
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel22
  - number: 22.1.c
    text: met ingang van de dag volgende op die waarop de rechterlijk ambtenaar is overleden.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel22
  - number: '22.2'
    text: |-
      De bovenwettelijke arbeidsongeschiktheidsuitkering, bedoeld in [artikel 17, tweede en derde lid][ref1], eindigt na
      ommekomst van de uitkeringsduur, maar in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel17
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 22.2.a
    text: |-
      met ingang van de dag waarop de rechterlijk ambtenaar op grond van
      [artikel 35 van dit besluit ][ref1]onderscheidenlijk [artikel 46k van de wet][ref2] is herplaatst;


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46k
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '35'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 46k
  - number: 22.2.b
    text: met ingang van de dag waarop de rechterlijk ambtenaar ontslag is verleend;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel22
  - number: 22.2.c
    text: met ingang van de eerste dag van de maand waarin de rechterlijk ambtenaar de leeftijd van 65 jaar heeft bereikt; of
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel22
  - number: 22.2.d
    text: met ingang van de dag volgende op die waarop de rechterlijk ambtenaar is overleden.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel22
  - number: '22.3'
    text: |-
      De aanvullende uitkering, bedoeld in [artikel 17, vierde en vijfde lid][ref1], eindigt na ommekomst van de
      uitkeringsduur, maar in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel17
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 22.3.a
    text: |-
      met ingang van de dag waarop de rechterlijk ambtenaar niet meer voldoet aan de in bedoelde artikelleden genoemde
      voorwaarden;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel22
  - number: 22.3.b
    text: met ingang van de dag waarop de rechterlijk ambtenaar ontslag is verleend; of
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel22
  - number: 22.3.c
    text: met ingang van de dag volgende op die waarop de rechterlijk ambtenaar is overleden.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel22
  - number: '22.4'
    text: |-
      De doorbetaling van de bezoldiging, bedoeld in [artikel 18, eerste en tweede lid][ref1], eindigt na ommekomst van
      de uitkeringsduur, maar in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel18
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 22.4.a
    text: |-
      met ingang van de dag waarop de gewezen rechterlijk ambtenaar op grond van een aanvaarde andere betrekking van
      gelijke omvang aanspraak maakt op loon of bezoldiging;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel22
  - number: 22.4.b
    text: |-
      met ingang van de eerste dag van de maand volgende op die waarin de gewezen rechterlijk ambtenaar de leeftijd van
      65 jaar onderscheidenlijk, indien het een gewezen voor het leven benoemde rechterlijk ambtenaar betreft, 70 jaar
      heeft bereikt; of
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel22
  - number: 22.4.c
    text: met ingang van de dag volgende op die waarop de gewezen rechterlijk ambtenaar is overleden.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel22
  - number: '22.5'
    text: |-
      De bovenwettelijke arbeidsongeschiktheidsuitkering, bedoeld in [artikel 18, eerste lid][ref1], eindigt na ommekomst
      van de uitkeringsduur, maar in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel18
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 22.5.a
    text: |-
      met ingang van de dag waarop de gewezen rechterlijk ambtenaar op grond van een aanvaarde andere betrekking van
      gelijke omvang aanspraak maakt op loon of bezoldiging;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel22
  - number: 22.5.b
    text: |-
      met ingang van de eerste dag van de maand waarin de gewezen rechterlijk ambtenaar de leeftijd van 65 jaar heeft
      bereikt; of
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel22
  - number: 22.5.c
    text: met ingang van de dag volgende op die waarop de gewezen rechterlijk ambtenaar is overleden.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel22
  - number: '22.6'
    text: |-
      De aanvullende uitkering, bedoeld in [artikel 18, derde en vierde lid][ref1], eindigt:


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel18
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 22.6.a
    text: |-
      met ingang van de dag waarop de gewezen rechterlijk ambtenaar niet meer voldoet aan de in
      [artikel 18, derde lid][ref1], genoemde voorwaarden;


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel18
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 22.6.b
    text: |-
      met ingang van de eerste dag van de maand waarin de gewezen rechterlijk ambtenaar de leeftijd van 65 jaar heeft
      bereikt; of
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel22
  - number: 22.6.c
    text: met ingang van de dag volgende op die waarop de gewezen rechterlijk ambtenaar is overleden.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel22
  - number: '23.1'
    text: |-
      De aanspraak van de rechterlijk ambtenaar en de gewezen rechterlijk ambtenaar op de doorbetaling van de bezoldiging
      gedurende de eerste 52 weken van de ongeschiktheid tot het verrichten van arbeid wegens ziekte, vervalt indien de
      rechterlijk ambtenaar of de gewezen rechterlijk ambtenaar:
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel23
  - number: 23.1.a
    text: niet binnen een redelijke termijn gezondheidskundige hulp inroept;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel23
  - number: 23.1.b
    text: zich niet gedurende het gehele verloop van de ziekte onder gezondheidskundige behandeling blijft stellen;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel23
  - number: 23.1.c
    text: de voorschriften van de behandelend arts niet opvolgt;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel23
  - number: 23.1.d
    text: zich schuldig maakt aan gedragingen waardoor zijn genezing wordt belemmerd;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel23
  - number: 23.1.e
    text: |-
      verzuimt de Arbo-dienst op eerste aanvraag mede te delen om welke reden hij ongeschikt is tot het verrichten van
      arbeid;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel23
  - number: 23.1.f
    text: zonder deugdelijke grond nalaat gevolg te geven aan een verzoek van de Arbo-dienst om te verschijnen;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel23
  - number: 23.1.g
    text: |-
      er de oorzaak van is dat het arbeidsgezondheidskundig onderzoek door een door de Arbo-dienst aangewezen arts niet
      kan plaatshebben;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel23
  - number: 23.1.h
    text: |-
      niet binnen twee dagen na de aanvang van de ongeschiktheid tot het verrichten van arbeid wegens ziekte dit heeft
      gemeld bij de functionele autoriteit;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel23
  - number: 23.1.i
    text: weigert aangeboden passende arbeid, waartoe de Arbo-dienst hem in staat acht, te verkrijgen of te aanvaarden;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel23
  - number: 23.1.j
    text: |-
      zich niet houdt aan de ten aanzien van hem geldende regels met betrekking tot de wijze waarop invulling wordt
      gegeven aan de verzuimbegeleiding, de arbeidsgezondheidskundige begeleiding en de daarbij in acht te nemen
      procedures;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel23
  - number: 23.1.k
    text: |-
      weigert inzage te geven in een op hem betrekking hebbend document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1] of een geldig rijbewijs als bedoeld in artikel 9, eerste
      lid, van de Wegenverkeerswet, voorzover dit redelijkerwijs nodig is voor de uitvoering van wetten;


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 23.1.l
    text: |-
      tijdens de ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte arbeid voor zichzelf of voor derden
      verricht, tenzij dit door de Arbo-dienst in het belang van zijn genezing wenselijk wordt geacht;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel23
  - number: 23.1.m
    text: |-
      voorafgaand aan de betaling van de bezoldiging weigert mededeling te doen van inkomsten uit arbeid die hij heeft
      in verband met het verrichten van door de Arbo-dienst in het belang van zijn genezing wenselijk geachte arbeid voor
      zichzelf of voor derden;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel23
  - number: 23.1.n
    text: |-
      niet onverwijld op verzoek of uit eigen beweging alle feiten en omstandigheden mededeelt, waarvan hem
      redelijkerwijs duidelijk moet zijn dat zij van invloed kunnen zijn op het recht of op de hoogte van de betaling van
      de bezoldiging;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel23
  - number: 23.1.o
    text: |-
      zijn arbeid verzuimt te hervatten op het door de Arbo-dienst bepaalde tijdstip en in de door deze dienst bepaalde
      mate, indien zulks hem is opgedragen, tenzij hij daarvoor een door de Arbo-dienst als geldig erkende reden heeft
      opgegeven; of
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel23
  - number: 23.1.p
    text: zijn medewerking weigert bij de doelmatige uitvoering van de bepalingen van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel23
  - number: '23.2'
    text: |-
      De ingevolge het eerste lid vervallen aanspraak herleeft met ingang van het tijdstip waarop de rechterlijk
      ambtenaar of de gewezen rechterlijk ambtenaar alsnog gevolg geeft aan de desbetreffende verplichting op grond van
      dat lid.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel23
  - number: '23.3'
    text: |-
      Onze Minister kan op grond van bijzondere omstandigheden bepalen dat de in het eerste lid bedoelde aanspraak niet
      vervalt, maar geheel of ten dele aan anderen dan aan de rechterlijk ambtenaar of de gewezen rechterlijk ambtenaar
      zal worden uitbetaald.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel23
  - number: '23.4'
    text: |-
      Voorzover Onze Minister van de bevoegdheid, bedoeld in het derde lid, geen gebruik heeft gemaakt, wordt de niet
      uitbetaalde bezoldiging alsnog aan de rechterlijk ambtenaar of de gewezen rechterlijk ambtenaar uitbetaald, indien
      de in [artikel 14, derde lid][ref1], bedoelde commissie van drie artsen ten gunste van de rechterlijk ambtenaar of
      de gewezen rechterlijk ambtenaar heeft geoordeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel14
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '24.1'
    text: |-
      De aanspraak van de rechterlijk ambtenaar en de gewezen rechterlijk ambtenaar op een bovenwettelijke
      arbeidsongeschiktheidsuitkering, op de doorbetaling van de bezoldiging of op de doorbetaling van 80% van de
      bezoldiging na de eerste 52 weken van de ongeschiktheid tot het verrichten van arbeid wegens ziekte, vervalt indien
      de rechterlijk ambtenaar of de gewezen rechterlijk ambtenaar:
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel24
  - number: 24.1.a
    text: zijn medewerking weigert bij de doelmatige uitvoering van de bepalingen van dit hoofdstuk;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel24
  - number: 24.1.b
    text: weigert aangeboden gangbare arbeid, waartoe de Arbo-dienst hem in staat acht, te verkrijgen of aanvaarden; of
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel24
  - number: 24.1.c
    text: |-
      zich niet houdt aan de ten aanzien van hem geldende regels met betrekking tot de wijze waarop invulling wordt
      gegeven aan de verzuimbegeleiding, de arbeidsgezondheidskundige begeleiding en de daarbij in acht te nemen
      procedures.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel24
  - number: '24.2'
    text: |-
      De ingevolge het eerste lid vervallen aanspraak herleeft met ingang van het tijdstip waarop de rechterlijk
      ambtenaar of de gewezen rechterlijk ambtenaar alsnog gevolg geeft aan de desbetreffende verplichting op grond van
      dat lid.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel24
  - number: '24.3'
    text: |-
      Na het tijdvak van 52 weken, bedoeld in de [artikelen 17][ref1] en [18][ref2], is op de aanspraak
      die de rechterlijk ambtenaar of de gewezen rechterlijk ambtenaar heeft op een bovenwettelijke
      arbeidsongeschiktheidsuitkering, op de doorbetaling van de bezoldiging of op de doorbetaling van 80% van de
      bezoldiging, het verplichtingen- en sanctieregime van de [WAO][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0006530#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006530
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0002524
  - number: '24.4'
    text: |-
      Indien ten aanzien van de WAO-uitkering die de rechterlijk ambtenaar of de gewezen rechterlijk ambtenaar
      geniet een verplichting wordt opgelegd of een sanctie wordt toegepast, wordt door Onze Minister zoveel
      mogelijk dezelfde verplichting opgelegd dan wel een overeenkomende sanctie toegepast op de bovenwettelijke
      arbeidsongeschiktheidsuitkering waarop de rechterlijk ambtenaar of de gewezen rechterlijk ambtenaar aanspraak
      heeft.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel24
  - number: '24.5'
    text: |-
      Indien als gevolg van handelingen of het nalaten van handelingen door de rechterlijk ambtenaar of de gewezen
      rechterlijk ambtenaar de WAO-uitkering vermindering ondergaat dan wel de aanspraak daarop geheel of gedeeltelijk
      wordt geweigerd, wordt de WAO-uitkering voor het vaststellen van zijn aanspraak op een bovenwettelijke
      arbeidsongeschiktheidsuitkering steeds geacht onverminderd te zijn genoten.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel24
  - number: '25.1'
    text: |-
      De inkomsten die de rechterlijk ambtenaar of de gewezen rechterlijk ambtenaar geniet in verband met het verrichten
      van in het belang van zijn genezing door de Arbo-dienst wenselijk geachte arbeid, worden op de aanspraak op
      de doorbetaling van zijn bezoldiging, op de doorbetaling van 80% van de bezoldiging of op de bovenwettelijke
      arbeidsongeschiktheidsuitkering in mindering gebracht, voor zover deze inkomsten tezamen met de aanspraak op de
      doorbetaling van zijn bezoldiging, op de doorbetaling van 80% van de bezoldiging onderscheidenlijk op de WAO-
      uitkering vermeerderd met de bovenwettelijke arbeidsongeschiktheidsuitkering, zijn volledige bezoldiging te boven
      gaan.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel25
  - number: '25.2'
    text: |-
      Inkomsten uit of in verband met arbeid of bedrijf worden in mindering gebracht op het bedrag waarop de gewezen
      rechterlijk ambtenaar ingevolge [artikel 18, eerste lid][ref1], recht heeft, tenzij deze inkomsten reeds
      voorafgaand aan het intreden van de ongeschiktheid tot het verrichten van arbeid wegens ziekte werden genoten
      en de omvang van die arbeid niet is toegenomen. Op het bedrag waarop de gewezen rechterlijk ambtenaar ingevolge
      [artikel 18, tweede lid][ref2], of [26][ref3] recht heeft, worden inkomsten uit of in verband met arbeid of bedrijf
      in mindering gebracht, tenzij deze inkomsten reeds voorafgaand aan de datum van ontslag werden genoten en de omvang
      van die arbeid niet is toegenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0006530#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0006530#Artikel26
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006530
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0006530
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '26.1'
    text: |-
      De gewezen rechterlijk ambtenaar wier bevalling waarschijnlijk is binnen vier maanden na het tijdstip van ingang
      van haar ontslag, ontvangt de laatstelijk genoten bezoldiging gedurende de periode die aanvangt op de 41e dag
      voorafgaand aan de vermoedelijke datum van bevalling en eindigt op de 70e dag na de datum waarop de bevalling heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel26
  - number: '26.2'
    text: |-
      De in het eerste lid bedoelde periode wordt verlengd tot 16 weken, indien die periode door een voortijdige
      bevalling minder dan 16 weken heeft bedragen.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel26
  - number: '26.3'
    text: |-
      De gewezen rechterlijk ambtenaar wier bevalling niet wordt verwacht binnen vier maanden na het tijdstip van ingang
      van haar ontslag, maar niettemin binnen die termijn bevalt, ontvangt de laatstelijk genoten bezoldiging gedurende
      de periode die aanvangt op de datum van bevalling en eindigt op de 70e dag na de datum waarop de bevalling heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel26
  - number: '26.4'
    text: |-
      Voor zolang de gewezen rechterlijk ambtenaar na beëindiging van de haar ingevolge het eerste of het derde lid
      toekomende uitkering nog wegens ziekte ongeschikt is tot het verrichten van arbeid dan wel binnen een maand na deze
      beëindiging daartoe ongeschikt wordt, heeft zij gedurende een tijdvak van 52 weken recht op de doorbetaling van de
      bezoldiging overeenkomstig [artikel 18][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel18
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '26.5'
    text: Het in het vierde lid bedoelde tijdvak van 52 weken wordt geacht aan te vangen op de eerste dag na de bevalling.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel26
  - number: '26.6'
    text: |-
      Ongeschikt tot het verrichten van arbeid, geheel of gedeeltelijk, in de zin van het vierde lid, is de vrouwelijke
      gewezen rechterlijk ambtenaar die als rechtstreeks en objectief medisch vast te stellen gevolg van ziekte of
      gebreken geheel of gedeeltelijk niet in staat is om een naar aard en omvang soortgelijke taak te verrichten.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel26
  - number: '27.1'
    text: |-
      In bijzondere gevallen kan aan de rechterlijk ambtenaar een tegemoetkoming worden toegekend in noodzakelijk
      gemaakte kosten die verband houden met ziekte, welke de rechterlijk ambtenaar voor zichzelf en voor zijn
      medebelanghebbenden heeft gemaakt, indien hierin niet ingevolge een andere regeling kan worden voorzien en deze
      kosten redelijkerwijs niet voor zijn rekening kunnen blijven.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel27
  - number: '27.2'
    text: Onze Minister kan omtrent het bepaalde in het eerste lid nadere regels vaststellen.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel27
  - number: '28'
    text: |-
      Het bedrag van de laatstelijk genoten bezoldiging, bedoeld in de [artikelen 18][ref1] en [26][ref2], wordt in
      voorkomende gevallen gewijzigd overeenkomstig een algemene salariswijziging.


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0006530#Artikel26
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006530
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '29.1'
    text: |-
      De rechterlijk ambtenaar en de gewezen rechterlijk ambtenaar die aanspraak hebben op een
      bovenwettelijke arbeidsongeschiktheidsuitkering, hebben aanspraak op een vakantie-uitkering ter
      grootte van 8% van de bovenwettelijke arbeidsongeschiktheidsuitkering. De [artikelen 21][ref1] en
      [22 van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0003630#Artikel22
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0003630
        artikel: '22'
  - number: '29.2'
    text: |-
      De gewezen rechterlijk ambtenaar die krachtens dit hoofdstuk aanspraak heeft op de doorbetaling van bezoldiging,
      heeft eveneens aanspraak op een vakantie-uitkering overeenkomstig [artikel 16, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel16
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '16'
  - number: '30.1'
    text: |-
      Indien de rechterlijk ambtenaar op de dag van het overlijden meer dan 52 weken wegens ziekte ongeschikt was tot
      het verrichten van zijn arbeid en anders dan als gevolg van zijn eigen handelingen of nalaten van handelingen geen
      aanspraak had op een WAO-uitkering, wordt voor de toepassing van [artikel 18 van de wet][ref1] onder bezoldiging
      verstaan het bedrag waarop de rechterlijk ambtenaar op de dag van het overlijden op basis van dit hoofdstuk
      aanspraak had.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel18
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '18'
  - number: '30.2'
    text: |-
      Indien de rechterlijk ambtenaar op de dag van het overlijden aanspraak had op een WAO-uitkering vermeerderd met
      een bovenwettelijke arbeidsongeschiktheidsuitkering, wordt voor de toepassing van [artikel 18 van de wet][ref1]
      onder bezoldiging verstaan het bedrag waarop de rechterlijk ambtenaar op de dag van het overlijden op basis van de
      [WAO][ref2] alsmede op basis van dit hoofdstuk aanspraak had.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0002524
  - number: '30.3'
    text: |-
      Op het bedrag, bedoeld in [artikel 18, tweede lid, van de wet][ref1], wordt in mindering gebracht een uitkering op
      grond van [artikel 53 van de WAO][ref2] en naar aard en strekking daarmee overeenkomende uitkeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel53
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: '53'
  - number: '31.1'
    text: |-
      Na het overlijden van de gewezen rechterlijk ambtenaar, die op de dag van zijn overlijden op grond van
      [artikel 18][ref1] in het genot was van de doorbetaling van zijn laatstelijk genoten bezoldiging, wordt aan de
      in [artikel 18 van de wet][ref2] bedoelde personen en met overeenkomstige toepassing van dat artikel uitgekeerd
      een bedrag, gelijk aan de bezoldiging die de gewezen rechterlijk ambtenaar op de dag van zijn overlijden genoot,
      berekend over een tijdvak van drie maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel18
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0008365
        artikel: '18'
  - number: '31.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing indien de gewezen rechterlijk ambtenaar op de dag
      van zijn overlijden op grond van [artikel 18, eerste lid][ref1], aanspraak had op een bovenwettelijke
      arbeidsongeschiktheidsuitkering in aanvulling op een WAO-uitkering, met dien verstande dat een bedrag wordt
      uitgekeerd, gelijk aan de bezoldiging die de gewezen rechterlijk ambtenaar op de dag van zijn overlijden zou
      hebben genoten indien hij op die dag in het genot zou zijn geweest van de doorbetaling van zijn laatstelijk genoten
      bezoldiging, berekend over een tijdvak van drie maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel18
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '31.3'
    text: |-
      Op de in het eerste lid bedoelde uitkering wordt in mindering gebracht een uitkering op grond van
      [artikel 53 van de WAO][ref1] en naar aard en strekking daarmee overeenkomende uitkeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel53
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '53'
  - number: '32.1'
    text: |-
      Indien het overlijden van de rechterlijk ambtenaar is veroorzaakt door een dienstongeval of een door het
      verrichten van arbeid opgelopen beroepsziekte, wordt aan degene die in verband met dit overlijden krachtens het
      pensioenreglement een nabestaandenpensioen geniet, een uitkering toegekend ten bedrage van 18% van het resultaat
      van de vermenigvuldiging van:
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel32
  - number: 32.1.a
    text: |-
      vijf zevende deel van 1,75% van de berekeningsgrondslag, bedoeld in artikel 6.2 van het pensioenreglement, en
      de pensioengeldige diensttijd, bedoeld in hoofdstuk 5 van het pensioenreglement, indien het gaat om de partner,
      bedoeld in artikel 7.1 van het pensioenreglement;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel32
  - number: 32.1.b
    text: |-
      een zevende deel van 1,75% van de berekeningsgrondslag, bedoeld in artikel 6.2 van het pensioenreglement, en de
      pensioengeldige diensttijd, bedoeld in hoofdstuk 5 van het pensioenreglement, indien het gaat om de wees, bedoeld
      in artikel 7.7, eerste lid, onderdeel a, van het pensioenreglement;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel32
  - number: 32.1.c
    text: |-
      twee zevende deel van 1,75% van de berekeningsgrondslag, bedoeld in artikel 6.2 van het pensioenreglement, en de
      pensioengeldige diensttijd, bedoeld in hoofdstuk 5 van het pensioenreglement, indien het gaat om de wees, bedoeld
      in artikel 7.7, eerste lid, onderdeel b, van het pensioenreglement.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel32
  - number: '32.2'
    text: |-
      De in het eerste lid bedoelde uitkering eindigt met ingang van de dag waarop de overledene de leeftijd van 65
      jaar zou hebben bereikt, dan wel, indien de partner, bedoeld in artikel 7.1 van het pensioenreglement, aan wie een
      pensioen werd toegekend, hertrouwt, een samenlevingscontract sluit onderscheidenlijk een geregistreerd partnerschap
      aangaat, met ingang van de maand volgende op de datum van het hertrouwen, het sluiten van het samenlevingscontract
      onderscheidenlijk het aangaan van het geregistreerd partnerschap.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel32
  - number: '32.3'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op de gewezen rechterlijk ambtenaar ten aanzien van
      wie [artikel 18, derde lid][ref1], toepassing heeft gevonden, indien zijn overlijden het rechtstreekse gevolg is
      van de in dat artikel bedoelde arbeidsongeschiktheid.


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel18
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '33'
    text: |-
      De [Suppletieregeling gedeeltelijk arbeidsongeschikten sector Rijk][ref1] is op de rechterlijke ambtenaren van
      overeenkomstige toepassing, met dien verstande dat in [artikel 1][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0007758
      [ref2]: https://wetten.overheid.nl/BWBR0006530#Artikel1
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0007758
      - id: ref2
        bwb_id: BWBR0006530
        artikel: '1'
        hoofdstuk: '1'
  - number: 33.a
    text: 'onder «Onze Minister» wordt verstaan: Onze Minister van Justitie; en'
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel33
  - number: 33.b
    text: |-
      onder «betrokkene» wordt verstaan: de voor het leven benoemde rechterlijk ambtenaar aan wie ontslag
      is verleend op grond van [artikel 46i van de wet][ref1] dan wel de niet voor het leven benoemde
      rechterlijk ambtenaar of de rechterlijk ambtenaar in opleiding die is ontslagen op grond van
      [artikel 36, eerste lid, onderdeel f, van dit besluit][ref2], en die ten tijde van dat ontslag minder dan 80%
      arbeidsongeschikt is, met uitzondering van degene die zijn resterende verdienvermogen volledig benut in een of meer
      aangehouden betrekkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46i
      [ref2]: https://wetten.overheid.nl/BWBR0006530#Artikel36
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46i
      - id: ref2
        bwb_id: BWBR0006530
        artikel: '36'
        hoofdstuk: '4'
  - number: '34.1'
    text: 'In dit hoofdstuk wordt onder rechterlijk ambtenaar mede verstaan: de rechterlijk ambtenaar in opleiding.'
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel34
  - number: '34.2'
    text: Dit hoofdstuk is niet van toepassing op voor het leven benoemde rechterlijke ambtenaren.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel34
  - number: '35.1'
    text: |-
      De rechterlijk ambtenaar die ongeschikt is tot het verrichten van zijn arbeid wegens ziekte kan een andere taak
      worden opgedragen.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel35
  - number: '35.2'
    text: |-
      Gedurende het eerste jaar dat de rechterlijk ambtenaar ongeschikt is tot het verrichten van zijn arbeid wegens
      ziekte is hij verplicht een hem opgedragen taak te aanvaarden indien sprake is van passende arbeid.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel35
  - number: '35.3'
    text: |-
      Gedurende het tweede jaar dat de rechterlijk ambtenaar ongeschikt is tot het verrichten van zijn arbeid wegens
      ziekte is hij verplicht een hem opgedragen taak te aanvaarden indien sprake is van gangbare arbeid. Deze
      verplichting geldt eveneens na afloop van het tweede jaar.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel35
  - number: '35.4'
    text: |-
      Het tweede en derde lid zijn van overeenkomstige toepassing indien aan de rechterlijk ambtenaar de eigen taak wordt
      opgedragen onder andere voorwaarden.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel35
  - number: '36.1'
    text: |-
      Anders dan op diens aanvraag, bij wijze van straf of ingevolge
      [artikel 7 van de Wet Incompatibiliteiten Staten-Generaal en Europees Parlement][ref1], de [artikelen 95][ref2],
      [96][ref3], [96a][ref4], [96b][ref5] of [97 van het Algemeen Rijksambtenarenreglement][ref6] of
      [artikel 125e, tweede lid, van de Ambtenarenwet][ref7], kan de rechterlijk ambtenaar worden ontslagen op grond van:


      [ref1]: https://wetten.overheid.nl/BWBR0006612#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel95
      [ref3]: https://wetten.overheid.nl/BWBR0001950#Artikel96
      [ref4]: https://wetten.overheid.nl/BWBR0001950#Artikel96a
      [ref5]: https://wetten.overheid.nl/BWBR0001950#Artikel96b
      [ref6]: https://wetten.overheid.nl/BWBR0001950#Artikel97
      [ref7]: https://wetten.overheid.nl/BWBR0001947#Artikel125e
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0006612
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0001950
        artikel: '95'
      - id: ref3
        bwb_id: BWBR0001950
        artikel: '96'
      - id: ref4
        bwb_id: BWBR0001950
        artikel: 96a
      - id: ref5
        bwb_id: BWBR0001950
        artikel: 96b
      - id: ref6
        bwb_id: BWBR0001950
        artikel: '97'
      - id: ref7
        bwb_id: BWBR0001947
        artikel: 125e
  - number: 36.1.a
    text: |-
      het verlies van een vereiste voor de benoembaarheid, door het bevoegde gezag gesteld bij een regeling aan de
      benoeming voorafgegaan, tenzij het vereiste alleen voor de aanvang van het ambt geldt;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel36
  - number: 36.1.b
    text: het aangaan van een graad van zwagerschap, die de benoembaarheid tot het ambt zou uitsluiten;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel36
  - number: 36.1.c
    text: onherroepelijk geworden rechterlijke uitspraak, waarbij de rechterlijk ambtenaar onder curatele is gesteld;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel36
  - number: 36.1.d
    text: het ondergaan van lijfsdwang wegens schulden krachtens onherroepelijk geworden rechterlijke uitspraak;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel36
  - number: 36.1.e
    text: onherroepelijk geworden veroordeling tot vrijheidsstraf wegens misdrijf;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel36
  - number: 36.1.f
    text: ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel36
  - number: 36.1.g
    text: onbekwaamheid of ongeschiktheid voor het door hem beklede ambt, anders dan op grond van ziels- of lichaamsgebreken;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel36
  - number: 36.1.h
    text: het bereiken van de pensioengerechtigde leeftijd;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel36
  - number: 36.1.i
    text: |-
      het bij of in verband met indiensttreding en/of keuring verstrekken van onjuiste of onvolledige inlichtingen,
      zonder welke handelwijze niet tot indienstneming of goedkeuring zou zijn overgegaan, tenzij de rechterlijk
      ambtenaar aannemelijk maakt dat hij te goeder trouw heeft gehandeld.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel36
  - number: '36.2'
    text: |-
      Een ontslag op grond van het bepaalde in het eerste lid onder *a*, *b*, *f*, *g* en *h* wordt steeds eervol
      verleend.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel36
  - number: '36.3'
    text: 'Een ontslag als bedoeld in het eerste lid, onderdeel *f*, kan slechts plaatsvinden indien:'
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel36
  - number: 36.3.a
    text: |-
      er sprake is van ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte gedurende een ononderbroken
      periode van twee jaar,
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel36
  - number: 36.3.b
    text: |-
      herstel van zijn ziekte niet binnen een periode van zes maanden na de in onderdeel *a* genoemde termijn van twee
      jaar te verwachten is, en
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel36
  - number: 36.3.c
    text: |-
      na een zorgvuldig onderzoek door de functionele autoriteit het niet mogelijk is gebleken de rechterlijk ambtenaar
      andere arbeid aan te bieden bij een gerecht of binnen het gezagsbereik van Onze Minister, dan wel indien de
      rechterlijk ambtenaar heeft geweigerd deze arbeid te aanvaarden.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel36
  - number: '36.4'
    text: |-
      Onder arbeid als bedoeld in het derde lid, onder *c*, wordt gedurende het eerste jaar dat de rechterlijk ambtenaar
      ongeschikt is tot het verrichten van zijn arbeid wegens ziekte passende arbeid en gedurende de periode daarna
      gangbare arbeid verstaan.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel36
  - number: '36.5'
    text: |-
      Bij het bepalen van het tijdvak van twee jaar, bedoeld in het derde lid, onder a, worden niet in aanmerking genomen
      afwezigheid van een rechterlijk ambtenaar wegens door haar zwangerschap of bevalling veroorzaakte ziekte in de
      periode vanaf het begin van de zwangerschap tot de eerste dag van het zwangerschapsverlof en afwezigheid van een
      rechterlijk ambtenaar wegens ziekte in de periode van de eerste dag van het zwangerschapsverlof tot en met de
      laatste dag van het bevallingsverlof.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel36
  - number: '36.6'
    text: |-
      Voor het bepalen van het tijdvak van twee jaar, bedoeld in het derde lid, onder a, worden tijdvakken van
      ongeschiktheid samengeteld: a. indien zij elkaar met een onderbreking van minder dan vier weken opvolgen; b.
      indien zij worden onderbroken door afwezigheid van de rechterlijk ambtenaar wegens ziekte als bedoeld in het
      vijfde lid; of c. indien een onder b bedoelde afwezigheid wordt voorafgegaan of wordt gevolgd door een periode van
      arbeidsgeschiktheid, die in totaal minder dan vier weken bedraagt.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel36
  - number: '36.7'
    text: |-
      Om te beoordelen of er sprake is van een situatie als bedoeld in het derde lid, onderdelen *a* en *b*, vraagt de
      functionele autoriteit het oordeel van een daartoe door de uitvoeringsinstelling, die de WAO uitvoert ten aanzien
      van de rechterlijk ambtenaar, aangewezen arts.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel36
  - number: '36.8'
    text: |-
      De in het zevende lid bedoelde arts betrekt bij zijn beoordeling een door de functionele autoriteit aangewezen arts
      en, indien de rechterlijk ambtenaar dit wenst, een door de rechterlijk ambtenaar aangewezen arts.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel36
  - number: '36.9'
    text: |-
      De functionele autoriteit stelt de rechterlijk ambtenaar er schriftelijk van in kennis dat de procedure, bedoeld
      in het zevende lid, wordt ingesteld. Daarbij wijst de functionele autoriteit de rechterlijk ambtenaar op de
      mogelijkheid om een arts van zijn keuze te laten deelnemen aan de procedure.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel36
  - number: '36.10'
    text: |-
      De kennisgeving, bedoeld in het negende lid, geschiedt niet eerder dan nadat de rechterlijk ambtenaar gedurende
      een onafgebroken periode van 18 maanden ongeschikt is geweest tot het verrichten van zijn arbeid wegens ziekte. Het
      vijfde en zesde lid zijn hierbij van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel36
  - number: '36.11'
    text: |-
      De in het zevende lid bedoelde arts stelt naar aanleiding van zijn bevindingen een rapport op. Hij zendt dit
      rapport aan de functionele autoriteit en een afschrift aan de rechterlijk ambtenaar.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel36
  - number: '36.12'
    text: |-
      Indien herplaatsing als bedoeld in het derde lid, onder *c*, plaatsvindt in een betrekking voor minder uren dan het
      aantal waarvoor de rechterlijk ambtenaar was aangesteld, heeft het ontslag uitsluitend betrekking op het meerdere
      aantal uren.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel36
  - number: '37.1'
    text: 'In dit artikel wordt onder rechterlijk ambtenaar verstaan: de niet voor het leven benoemde rechterlijk ambtenaar.'
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel37
  - number: '37.2'
    text: |-
      De functionele autoriteit besteedt aan de wijze van functievervulling van de rechterlijk ambtenaar regelmatig
      aandacht door middel van het houden van functioneringsgesprekken of het opmaken van beoordelingen, dan wel van
      beide.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel37
  - number: '37.3'
    text: |-
      Een beoordeling wordt in elk geval opgemaakt wanneer de functionele autoriteit dit wenselijk vindt of de
      rechterlijk ambtenaar dit aanvraagt.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel37
  - number: '37.4'
    text: |-
      Alvorens een beoordeling wordt vastgesteld, wordt deze met de rechterlijk ambtenaar besproken en wordt hem de
      gelegenheid geboden daarover zijn mening kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel37
  - number: '37.5'
    text: Onze Minister kan nadere regels stellen omtrent het opmaken en vaststellen van beoordelingen.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel37
  - number: '37.6'
    text: Onze Minister kan beleidsregels vaststellen inzake de functioneringsgesprekken.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel37
  - number: 37a.1
    text: |-
      De rechterlijk ambtenaar die de leeftijd van 50 jaar heeft bereikt, heeft, ongeacht of er sprake is van
      gezondheidsproblemen, het recht om op kosten van het Rijk een maal per twee jaar een algemene medische keuring
      te ondergaan.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel37a
  - number: 37a.2
    text: De keuring wordt verricht door een andere arts dan de eigen huisarts of specialist.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel37a
  - number: 37a.3
    text: Onze minister kan een arts als bedoeld in het tweede lid aanwijzen.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel37a
  - number: '38.1'
    text: |-
      De vergoedingen, bedoeld in de [artikelen 9, tweede lid][ref1], en [10 van de wet][ref2], bedragen per zitting:


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel10
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0008365
        artikel: '10'
  - number: 38.1.a
    text: 'voor raadsheren in buitengewone dienst van en advocaten-generaal in buitengewone dienst bij de Hoge Raad: € 332,'
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38
  - number: 38.1.b
    text: 'voor raadsheren-plaatsvervangers en plaatsvervangend advocaten-generaal bij een ressortsparket: € 255 en'
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38
  - number: 38.1.c
    text: 'voor rechters-plaatsvervangers en plaatsvervangende officieren van justitie: € 191.'
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38
  - number: '38.2'
    text: |-
      Voor de toepassing van het eerste lid worden zittingen die op één dag worden gehouden, samen als één zitting
      beschouwd.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38
  - number: '38.3'
    text: 'Voor de toepassing van het eerste lid, aanhef en onder *a*, worden met een zitting gelijkgesteld:'
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38
  - number: 38.3.a
    text: 'indien het raadsheren in buitengewone dienst betreft: een bijeenkomst in de raadskamer, en'
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38
  - number: 38.3.b
    text: 'indien het advocaten-generaal in buitengewone dienst betreft: een schriftelijke conclusie.'
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38
  - number: '38.4'
    text: |-
      De functionele autoriteit kan besluiten dat aan een raadsheer-plaatsvervanger of een rechter-plaatsvervanger
      een vergoeding overeenkomstig het eerste lid wordt toegekend voor het concipiëren van een of meer schriftelijke
      uitspraken in een of meer zaken waarin geen zitting heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38
  - number: 38a.1
    text: |-
      Een rechterlijk ambtenaar, niet zijnde een plaatsvervanger als bedoeld in [artikel 9, tweede lid, van de wet][ref1]
      of een raadsheer dan wel advocaat-generaal in buitengewone dienst als bedoeld in [artikel 10 van de wet][ref2],
      die de leeftijd van 57 jaar heeft bereikt, kan Onze Minister verzoeken om bij een opvolgende benoeming in een
      ambt, waaraan overeenkomstig [artikel 7 van de wet][ref3] een lager maximum salaris is verbonden, in plaats van
      het salaris dat hij bij het vervullen van dat ambt overeenkomstig de wet geniet, het salaris behorende bij het
      voorafgaand aan de benoeming vervulde ambt te genieten.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel7
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38a
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0008365
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0008365
        artikel: '7'
  - number: 38a.2
    text: 'Een verzoek als bedoeld in het eerste lid wordt ingewilligd tenzij:'
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38a
  - number: 38a.2.a
    text: |-
      het ambt, waarin de rechterlijk ambtenaar wordt benoemd, door rechtstreekse of overeenkomstige toepassing tot een
      van de in [artikel 7, eerste lid, van de wet][ref1] bedoelde categorieën 10 tot en met 12 behoort;


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel7
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38a
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '7'
  - number: 38a.2.b
    text: |-
      de rechterlijk ambtenaar op het tijdstip van de benoeming, bedoeld in het eerste lid, niet ten minste vijf
      aaneengesloten jaren in dienst is als rechterlijk ambtenaar; of
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38a
  - number: 38a.2.c
    text: |-
      de werktijd van de rechterlijk ambtenaar reeds is teruggebracht overeenkomstig [artikel 38e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel38e
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38a
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: 38e
        hoofdstuk: '5'
  - number: 38a.3
    text: |-
      Op het salaris van de rechterlijk ambtenaar wordt in geval van inwilliging van een verzoek als bedoeld in het
      eerste lid een korting toegepast.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38a
  - number: 38a.4
    text: 'Deze korting bedraagt:'
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38a
  - number: 38a.4.a
    text: |-
      5% van het salaris, indien het maximum salaris verbonden aan het ambt waarin hij wordt benoemd het naast lagere
      maximum salaris is van dat van het ambt dat hij voorafgaand aan de benoeming heeft vervuld dan wel het naast lagere
      maximum salaris is van het vorenbedoelde naast lagere maximum salaris;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38a
  - number: 38a.4.b
    text: |-
      10% van het salaris, indien het maximum salaris verbonden aan het ambt waarin hij wordt benoemd lager is dan de in
      het vierde lid, onder a, bedoelde naast lagere maximum salarissen.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38a
  - number: 38a.5
    text: Onze Minister kan ter zake van de uitvoering van dit artikel regels stellen.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38a
  - number: 38b.1
    text: |-
      Om benoemd te kunnen worden als rechterlijk ambtenaar, bedoeld in
      [artikel 1, onderdeel b, onder 1° tot en met 3°, van de Wet op de rechterlijke organisatie][ref1], dient het
      afsluitend examen, bedoeld in [artikel 1d, eerste lid, van de wet][ref2], te voldoen aan de eisen van het tweede en
      derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel1d
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38b
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 1d
  - number: 38b.2
    text: |-
      Het afsluitend examen is zodanig samengesteld dat ten minste grondige kennis van en inzicht in drie van de vijf
      volgende rechtsgebieden is verkregen:
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38b
  - number: 38b.2.a
    text: burgerlijk recht, met inbegrip van burgerlijk procesrecht;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38b
  - number: 38b.2.b
    text: strafrecht, met inbegrip van strafprocesrecht;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38b
  - number: 38b.2.c
    text: bestuursrecht, met inbegrip van bestuursprocesrecht;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38b
  - number: 38b.2.d
    text: staatsrecht;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38b
  - number: 38b.2.e
    text: belastingrecht.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38b
  - number: 38b.3
    text: |-
      Tot de drie rechtsgebieden, bedoeld in het tweede lid, behoren in ieder geval twee van de rechtsgebieden genoemd in
      de onderdelen a tot en met c.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38b
  - number: 38c.1
    text: |-
      Om benoemd te kunnen worden als rechterlijk ambtenaar, bedoeld in
      [artikel 1, onderdeel b, onder 4° tot en met 6°, van de Wet op de rechterlijke organisatie][ref1], dient het
      afsluitend examen, bedoeld in [artikel 1d, eerste lid, van de wet][ref2], te voldoen aan de eisen van het tweede en
      derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel1d
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38c
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 1d
  - number: 38c.2
    text: |-
      Het afsluitend examen is zodanig samengesteld dat ten minste grondige kennis van en inzicht in het rechtsgebied
      strafrecht, met inbegrip van strafprocesrecht, is verkregen.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38c
  - number: 38c.3
    text: |-
      Naast het in het tweede lid genoemde rechtsgebied is ten minste grondige kennis van en inzicht in twee van de drie
      volgende rechtsgebieden verkregen:
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38c
  - number: 38c.3.a
    text: burgerlijk recht, met inbegrip van burgerlijk procesrecht;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38c
  - number: 38c.3.b
    text: bestuursrecht, met inbegrip van bestuursprocesrecht;
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38c
  - number: 38c.3.c
    text: staatsrecht.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38c
  - number: 38d.1
    text: |-
      De gemiddelde wekelijkse werktijd van een rechterlijk ambtenaar van 57 jaar en ouder wordt op zijn verzoek, met
      behoud van zijn arbeidsduur, teruggebracht met 15,7%, tenzij het belang van de taakvervulling zich daartegen naar
      het oordeel van de functionele autoriteit verzet.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38d
  - number: 38d.2
    text: |-
      De gemiddelde wekelijkse werktijd van een rechterlijk ambtenaar van 61 jaar en ouder wordt op zijn verzoek, met
      behoud van zijn arbeidsduur, teruggebracht met 36,8%, tenzij het belang van de taakvervulling zich daartegen naar
      het oordeel van de functionele autoriteit verzet.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38d
  - number: 38d.3
    text: |-
      Het terugbrengen van de werktijd overeenkomstig het eerste of tweede lid heeft in totaal gedurende een periode
      van ten hoogste acht aaneengesloten jaren plaats, met dien verstande dat het terugbrengen van de werktijd
      overeenkomstig het tweede lid plaatsheeft gedurende een periode van ten hoogste vier aaneengesloten jaren.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38d
  - number: 38d.4
    text: |-
      De rechterlijk ambtenaar dient op het tijdstip waarop de werktijd overeenkomstig het eerste of tweede lid wordt
      teruggebracht ten minste vijf aaneengesloten jaren in dienst te zijn als rechterlijk ambtenaar.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38d
  - number: 38d.5
    text: |-
      Voor de uren die het wekelijkse verschil vormen tussen de in het eerste of tweede lid bedoelde arbeidsduur en de
      overeenkomstig het eerste of tweede lid teruggebrachte werktijd wordt de rechterlijk ambtenaar geacht met verlof
      te zijn.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38d
  - number: 38d.6
    text: |-
      Op het salaris van de rechterlijk ambtenaar, van wie de werktijd wordt teruggebracht overeenkomstig het eerste
      respectievelijk tweede lid, wordt een inhouding toegepast ter grootte van 5% onderscheidenlijk 10% van het salaris
      dat voor hem zou gelden zonder werktijdvermindering op grond van dit artikel.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38d
  - number: 38d.7
    text: |-
      Met ingang van het tijdstip waarop de werktijd overeenkomstig het eerste of tweede lid is teruggebracht, vervalt
      ten aanzien van de rechterlijk ambtenaar de verhoging van de vakantie-aanspraak op grond van zijn leeftijd en wordt
      de vakantie-aanspraak overigens vastgesteld op een evenredig deel van de vakantie-aanspraak bij een volledige taak.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38d
  - number: 38d.8
    text: |-
      Een verzoek als bedoeld in het eerste of tweede lid wordt niet ingewilligd, indien reeds een verzoek van de
      rechterlijk ambtenaar als bedoeld in [artikel 38a][ref1] is ingewilligd.


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel38a
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38d
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: 38a
        hoofdstuk: '5'
  - number: 38e.1
    text: |-
      In dit artikel wordt onder inkomen verstaan: het salaris van de rechterlijk ambtenaar na de inhouding
      overeenkomstig het [zesde lid van artikel 38d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel38d
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38e
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: 38d
        hoofdstuk: '5'
  - number: 38e.2
    text: |-
      De inkomsten die de rechterlijk ambtenaar geniet of gaat genieten uit of in verband met arbeid of bedrijf,
      voor zover niet reeds ter hand genomen voorafgaand aan het tijdstip waarop de arbeidsduur overeenkomstig
      [artikel 38d, eerste of tweede lid][ref1], is teruggebracht, worden met het inkomen verrekend, tenzij de
      rechterlijk ambtenaar aannemelijk maakt dat die inkomsten of die vermeerdering van inkomsten dan wel een gedeelte
      daarvan geen verband houden met verhoogde werkzaamheid.


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel38d
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38e
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: 38d
        hoofdstuk: '5'
  - number: 38e.3
    text: |-
      Inkomsten uit arbeid of bedrijf als bedoeld in het tweede lid die op één maand betrekking hebben of geacht
      kunnen worden te hebben, worden in mindering gebracht op het inkomen over die maand. De vermindering bedraagt
      niet meer dan het verschil tussen het inkomen van de rechterlijk ambtenaar en het salaris dat hij krachtens
      [artikel 8 van de wet][ref1] zou hebben genoten indien zijn arbeidsduur zou zijn teruggebracht met eenzelfde
      percentage als zijn werktijd overeenkomstig [artikel 38d, eerste respectievelijk tweede lid][ref2], is
      teruggebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0006530#Artikel38d
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38e
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0006530
        artikel: 38d
        hoofdstuk: '5'
  - number: 38e.4
    text: |-
      Inkomsten uit arbeid of bedrijf, waarvoor in verband met verleend buitengewoon verlof reeds een inhouding op het
      salaris van de ambtenaar plaatsvindt of reeds een verlaging van het salaris van de rechterlijk ambtenaar geldt
      of ter zake waarvan de rechterlijk ambtenaar reeds storting in 's Rijks kas verricht, zijn tot het bedrag van die
      inhouding, verlaging of storting, geen inkomsten uit arbeid of bedrijf als bedoeld in het tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38e
  - number: 38e.5
    text: |-
      De rechterlijk ambtenaar is verplicht van op of na het tijdstip, waarop de werktijd overeenkomstig
      [artikel 38d, eerste of tweede lid][ref1], is teruggebracht, ter hand te nemen of reeds ter hand genomen arbeid of
      bedrijf mededeling te doen aan functionele autoriteit, onder opgave, voor zover mogelijk, van de inkomsten die hij
      uit die werkzaamheden zal genieten.


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel38d
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38e
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: 38d
        hoofdstuk: '5'
  - number: 38e.6
    text: |-
      Indien de inkomsten niet vooraf kunnen worden vastgesteld, doet de rechterlijk ambtenaar maandelijks voorafgaand
      aan de salarisbetaling, opgave van de inkomsten die hij sinds de vorige opgave heeft genoten.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38e
  - number: 38e.7
    text: |-
      Indien de inkomsten slechts over een langere termijn kunnen worden vastgesteld, doet de rechterlijk ambtenaar
      dienovereenkomstig opgave en wordt, onder voorbehoud van verrekening aan het eind van de desbetreffende termijn, op
      het inkomen een voorlopig vastgesteld bedrag in mindering gebracht met overeenkomstige toepassing van het tweede en
      derde lid.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38e
  - number: 38e.8
    text: |-
      De functionele autoriteit kan bij de vaststelling van het bedrag van de vermindering ten gunste van de rechterlijk
      ambtenaar afwijken van de opgave.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38e
  - number: 38e.9
    text: |-
      Onze Minister kan bij ministeriële regeling nadere voorschriften geven met betrekking tot de wijze van opgave van
      inkomsten van de rechterlijk ambtenaar.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38e
  - number: 38e.10
    text: |-
      De rechterlijk ambtenaar verstrekt aan de functionele autoriteit alle inlichtingen en gegevens omtrent zijn
      omstandigheden die voor de uitvoering van de [artikelen 38d][ref1] en [38e][ref2] noodzakelijk zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0006530#Artikel38d
      [ref2]: https://wetten.overheid.nl/BWBR0006530#Artikel38e
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38e
    references:
      - id: ref1
        bwb_id: BWBR0006530
        artikel: 38d
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0006530
        artikel: 38e
        hoofdstuk: '5'
  - number: 38f
    text: |-
      Ten aanzien van de rechterlijke ambtenaren bij de rechtbanken en de gerechtshoven, worden de bevoegdheden in de
      ingevolge [artikel 16 van de wet][ref1] overeenkomstige bepalingen, behoudens de daarin aan Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties toegekende bevoegdheden, uitgeoefend door de functionele autoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel16
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38f
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '16'
  - number: 38g.1
    text: |-
      Aan de rechterlijke ambtenaren en de rechterlijke ambtenaren in opleiding wordt over een kalenderjaar een
      eindejaarsuitkering toegekend van 0,3% van het in dat kalenderjaar genoten salaris.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38g
  - number: 38g.2
    text: |-
      Indien de betrokkene aanspraak heeft op een uitkering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref1] en een bovenwettelijke arbeidsongeschiktheidsverzekering
      overeenkomstig dit besluit, wordt voor de toepassing van het eerste lid het salaris in acht genomen dat de
      betrokkene zou hebben genoten, indien hij wegens ziekte ongeschikt zou zijn geweest tot het verrichten van zijn
      arbeid doch anders dan als gevolg van eigen handelingen of nalaten van handelingen geen aanspraak zou hebben gehad
      op een WAO-uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38g
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: 38g.3
    text: De eindejaarsuitkering wordt uitbetaald in de maand december van het desbetreffende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38g
  - number: 38g.4
    text: |-
      In geval van ontslag of overlijden wordt de eindejaarsuitkering zo veel mogelijk uitbetaald in de maand na het
      ontslag of overlijden.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel38g
  - number: '39.1'
    text: |-
      De op grond van de [artikelen 125][ref1] en [125c van de Ambtenarenwet][ref2] bij of krachtens algemene
      maatregel van bestuur tot stand gebrachte algemeen verbindende voorschriften zoals die tot en met 31 maart
      1994 golden ten aanzien van de niet voor het leven benoemde rechterlijke ambtenaren en de rechterlijke
      ambtenaren in opleiding, bedoeld in [artikel 145 van de Wet op de rechterlijke organisatie][ref3],
      zijn ten aanzien van hen van overeenkomstige toepassing, met uitzondering van de algemeen
      verbindende voorschriften die tot stand zijn gebracht op grond van het op 31 maart 1994 geldende
      [artikel 125, eerste lid, onderdelen c, d, e, f, g, h, i, j, l en m, van de Ambtenarenwet][ref4],
      en met uitzondering van de [artikelen 9b][ref5], [9c][ref6], [94a][ref7], [98][ref8] en
      [102, eerste, tweede en vierde lid, van het Algemeen Rijksambtenarenreglement][ref9].


