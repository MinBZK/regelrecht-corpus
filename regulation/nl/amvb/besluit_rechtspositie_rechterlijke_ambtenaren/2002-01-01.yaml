  - number: '39.4'
    text: |-
      In afwijking van het eerste lid is [artikel 95 van het Algemeen Rijksambtenarenreglement][ref1] van overeenkomstige
      toepassing, zoals dat op 7 juli 2000 gold voor de burgerlijke rijksambtenaren.


