    text: Dit besluit treedt in werking met ingang van 1 april 1994.
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel40
  - number: '41'
    text: 'Dit besluit wordt aangehaald als: Besluit rechtspositie rechterlijke ambtenaren.'
    url: https://wetten.overheid.nl/BWBR0006530/2002-01-01#Artikel41
