$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_registratie_en_bijwerkingen_1999
regulatory_layer: AMVB
publication_date: '2006-01-12'
valid_from: '2002-05-17'
bwb_id: BWBR0010977
url: https://wetten.overheid.nl/BWBR0010977/2002-05-17
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Landbouw, Natuurbeheer en Visserij van 23 februari 1999, no.
    TRCJZ/1999/2072, Directie Juridische Zaken, gedaan in overeenstemming met Onze Minister van Volksgezondheid,
    Welzijn en Sport en na overleg met de Staatssecretaris van Sociale Zaken en werkgelegenheid, drs J.F. Hoogervorst;

    Gelet op de artikelen 11, tweede lid, 42, eerste lid, onderdelen g en h, en 49 van de Diergeneesmiddelenwet;

    De Raad van State gehoord (advies van 27 april 1999, no. W11.99.0092/V);

    Gezien het nader rapport van de Staatssecretaris van Landbouw, Natuurbeheer en Visserij van 13 december 1999, no.
    TRCJZ/1999/11644, Directie Juridische Zaken, uitgebracht in overeenstemming met Onze Minister van Volksgezondheid,
    Welzijn en Sport en na overleg met de Staatssecretaris van Sociale Zaken en werkgelegenheid, drs J.F. Hoogervorst;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0010977/2002-05-17#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt in afwijking van
      [artikel 1, eerste lid, van de Diergeneesmiddelenwet][ref1] onder bijwerking verstaan: reactie die schadelijk en
      onbedoeld is en die optreedt bij doses die normaal bij dieren voor de profylaxe, diagnose of behandeling van een
      ziekte of voor de wijziging van een fysiologische functie worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel1
    url: https://wetten.overheid.nl/BWBR0010977/2002-05-17#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '1'
  - number: '1.2'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0010977/2002-05-17#Artikel1
  - number: 1.2.a
    text: |-
      [verordening (EEG) nr. 2377/90](31990R2377): [verordening (EEG) nr. 2377/90](31990R2377) van de Raad van
      de Europese Gemeenschappen van 26 juni 1990 houdende een communautaire procedure tot vaststelling van de
      maximumwaarden voor residuen van geneesmiddelen voor diergeneeskundig gebruik in levensmiddelen van dierlijke
      oorsprong (PbEG L 317);
    url: https://wetten.overheid.nl/BWBR0010977/2002-05-17#Artikel1
  - number: 1.2.b
    text: |-
      [verordening (EEG) nr. 2309/93](31993R2309): [verordening (EEG) nr. 2309/93](31993R2309) van de Raad van 22
      juli 1993 tot vaststelling van communautaire procedures voor het verlenen van vergunningen voor en het toezicht
      op geneesmiddelen voor menselijk en diergeneeskundig gebruik en tot oprichting van het Europees Bureau voor de
      geneesmiddelenbeoordeling (PbEG L 214);
    url: https://wetten.overheid.nl/BWBR0010977/2002-05-17#Artikel1
  - number: 1.2.c
    text: |-
      [richtlijn nr. 2001/82/EG](32001L0082): [richtlijn nr. 2001/82/EG](32001L0082) van het Europees Parlement en
      de Raad van de Europese Unie van 6 november 2001 tot vaststelling van een communautair wetboek betreffende
      geneesmiddelen voor diergeneeskundig gebruik (PbEG L 311);
    url: https://wetten.overheid.nl/BWBR0010977/2002-05-17#Artikel1
  - number: 1.2.d
    text: |-
      wet: [Diergeneesmiddelenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003818
    url: https://wetten.overheid.nl/BWBR0010977/2002-05-17#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003818
  - number: 1.2.e
    text: |-
      ernstige bijwerking: bijwerking die tot de dood leidt, levensgevaar oplevert, een significante handicap of
      lichamelijke ongeschiktheid veroorzaakt, tot een aangeboren afwijking of geboorteafwijking bij de volgende
      generatie leidt, of tot blijvende of langdurige verschijnselen bij de behandelde dieren leidt;
    url: https://wetten.overheid.nl/BWBR0010977/2002-05-17#Artikel1
  - number: 1.2.f
    text: |-
      bijwerking bij de mens: reactie die schadelijk en onbedoeld is en die na de blootstelling aan een geneesmiddel voor
      diergeneeskundig gebruik bij een mens optreedt;
    url: https://wetten.overheid.nl/BWBR0010977/2002-05-17#Artikel1
  - number: 1.2.g
    text: |-
      onverwachte bijwerking: bijwerking waarvan de aard, de ernst of het gevolg niet verenigbaar is met de samenvatting
      van de kenmerken van het product;
    url: https://wetten.overheid.nl/BWBR0010977/2002-05-17#Artikel1
  - number: 1.2.h
    text: 'ernstige onverwachte bijwerking: bijwerking die zowel ernstig als onverwacht is;'
    url: https://wetten.overheid.nl/BWBR0010977/2002-05-17#Artikel1
  - number: 1.2.i
    text: |-
      het Europees Bureau voor de geneesmiddelenbeoordeling: het Europees Bureau voor de geneesmiddelenbeoordeling,
      bedoeld in artikel 49 van de [verordening (EEG) nr. 2309/93](31993R2309);
    url: https://wetten.overheid.nl/BWBR0010977/2002-05-17#Artikel1
  - number: 1.2.j
    text: |-
      afwijkend gebruik: gebruik van een geneesmiddel voor diergeneeskundig gebruik dat niet in overeenstemming is met
      de samenvatting van de kenmerken van het product, verkeerd gebruik of ernstig misbruik van een geneesmiddel voor
      diergeneeskundig gebruik;
    url: https://wetten.overheid.nl/BWBR0010977/2002-05-17#Artikel1
  - number: 1.2.k
    text: |-
      veiligheidsonderzoek na toelating: een farmaco-epidemiologisch onderzoek of een klinische test die overeenkomstig
      voorschriften, gegeven bij de registratie, bedoeld in [artikel 3, eerste lid, van de wet][ref1] dan wel
      voorschriften van de vergunning voor het in de handel brengen, bedoeld in [verordening (EEG) nr. 2309/93]
      (31993R2309), wordt uitgevoerd teneinde een gevaar voor de veiligheid in verband met een toegelaten geneesmiddel
      voor diergeneeskundig gebruik te specificeren of te onderzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel3
    url: https://wetten.overheid.nl/BWBR0010977/2002-05-17#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '3'
  - number: '2.1'
    text: |-
      De registratie van een diergeneesmiddel dat een werkzaam bestanddeel bevat dat ingevolge een besluit op grond van
      de artikelen 8 of 9, tweede of derde lid, van [verordening (EEG) nr. 2377/90](31990R2377) op bijlage IV van die
      verordening is geplaatst, vervalt van rechtswege op de dag waarop dat besluit ingevolge de bekendmaking in het
      Publicatieblad van de Europese Gemeenschappen in werking treedt. 2. Het eerste lid is uitsluitend van toepassing op
      diergeneesmiddelen waarvoor ingevolge de [artikelen 3][ref1] of [58 van de wet][ref2] een registratie is verleend
      voor zover die registratie diergeneesmiddelen voor voedselproducerende dieren betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003818#Artikel58
    url: https://wetten.overheid.nl/BWBR0010977/2002-05-17#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0003818
        artikel: '58'
  - number: '3.1'
    text: 'De registratiehouder meldt onverwijld en uiterlijk binnen vijftien dagen aan Onze Minister:'
    url: https://wetten.overheid.nl/BWBR0010977/2002-05-17#Artikel3
  - number: 3.1.a
    text: iedere voorgenomen wijziging in de gegevens op grond waarvan het diergeneesmiddel is geregistreerd, en
    url: https://wetten.overheid.nl/BWBR0010977/2002-05-17#Artikel3
  - number: 3.1.b
    text: 'elk nieuw element dat kan leiden tot een wijziging in de gegevens, bedoeld in onderdeel a, in het bijzonder:'
    url: https://wetten.overheid.nl/BWBR0010977/2002-05-17#Artikel3
  - number: 3.1.b.1°
    text: |-
      elk verbod of elke beperking uitgaande van de bevoegde instantievan een land, waar eveneens een vergunning voor
      het in de handel brengen als bedoeld in artikel 5 van [richtlijn nr. 2001/82/EG](32001L0082) voor het betrokken
      diergeneesmiddel is verleend;
    url: https://wetten.overheid.nl/BWBR0010977/2002-05-17#Artikel3
  - number: 3.1.b.2°
    text: |-
      elke vermoedelijk ernstige bijwerking en bijwerking bij de mens in verband met het gebruik van diergeneesmiddelen
      waarvan redelijkerwijs kan worden verwacht dat hij daarvan op de hoogte is of waarvan hij in kennis is gesteld;
    url: https://wetten.overheid.nl/BWBR0010977/2002-05-17#Artikel3
  - number: 3.1.b.3°
    text: |-
      elke vermoedelijk ernstige en onverwachte bijwerking en bijwerking bij de mens die zich op het grondgebied van een
      derde land voordoet.
    url: https://wetten.overheid.nl/BWBR0010977/2002-05-17#Artikel3
  - number: '3.2'
    text: |-
      Indien de vermoedelijke bijwerkingen, bedoeld in het eerste lid, onderdeel b, onder 1o en 2o, zich voordoen in een
      andere lidstaat, dan vindt de melding plaats aan de bevoegde instantie van de lidstaat op wiens grondgebied het
      voorval zich heeft voorgedaan.
    url: https://wetten.overheid.nl/BWBR0010977/2002-05-17#Artikel3
  - number: '3.3'
    text: |-
      Onze Minister meldt elke ernstige of ernstige onverwachte bijwerking die tevens betrekking heeft op de bescherming
      van de volksgezondheid, en elke bijwerking bij de mens aan Onze Minister van Volksgezondheid, Welzijn en Sport en
      aan Onze Minister van Sociale Zaken en Werkgelegenheid en stelt de daarbij behorende gegevens ter beschikking.
    url: https://wetten.overheid.nl/BWBR0010977/2002-05-17#Artikel3
  - number: '3.4'
    text: |-
      Na ontvangst van een melding van een vermoedelijke ernstige bijwerking of bijwerking bij de mens stelt Onze
      Minister onverwijld en uiterlijk binnen vijftien dagen het Europees Bureau voor de geneesmiddelenbeoordeling en de
      desbetreffende registratiehouder hiervan in kennis.
    url: https://wetten.overheid.nl/BWBR0010977/2002-05-17#Artikel3
  - number: '3.5'
    text: |-
      Een wijziging van artikel 5 van [richtlijn nr. 2001/82/EG](32001L0082) gaat voor de toepassing van het eerste lid
      gelden met ingang van de dag waarop aan de desbetreffende wijzigingsrichtlijn uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0010977/2002-05-17#Artikel3
  - number: '3.6'
    text: |-
      Een dierenarts meldt onverwijld en uiterlijk binnen vijftien dagen elke vermoedelijke ernstige of onverwachte
      bijwerking en elke bijwerking bij de mens, waarvan redelijkerwijs kan worden verwacht dat hij daarvan op de hoogte
      is of waarvan hij in kennis wordt gesteld, aan onze Minister indien bij de registratie van het door hem toegepaste
      diergeneesmiddel dit voorschrift is gegeven.
    url: https://wetten.overheid.nl/BWBR0010977/2002-05-17#Artikel3
  - number: '4.1'
    text: |-
      De registratiehouder evalueert regelmatig de bij de aanvraag tot registratie overgelegde bereidings-, analyse-
      en controlemethoden, bedoeld in artikel 12, derde lid, onderdelen d, h en i, van [richtlijn nr. 2001/82/EG]
      (32001L0082), in het licht van de technische en wetenschappelijke vooruitgang.
    url: https://wetten.overheid.nl/BWBR0010977/2002-05-17#Artikel4
  - number: '4.2'
    text: |-
      Indien de evaluatie, bedoeld in het eerste lid, leidt tot een wijziging van de daar bedoelde bereidings-, analyse-
      en controlemethoden, meldt de registratiehouder deze wijziging aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0010977/2002-05-17#Artikel4
  - number: '4.3'
    text: |-
      Een wijziging van artikel 12, derde lid, onderdelen d, h en i, van [richtlijn nr. 2001/82/EG](32001L0082) gaat
      voor de toepassing van het eerste lid gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn
      uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0010977/2002-05-17#Artikel4
  - number: '5.1'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de wijze waarop meldingen als bedoeld in de
      [artikelen 3][ref1] en [4][ref2] plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0010977#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010977#Artikel4
    url: https://wetten.overheid.nl/BWBR0010977/2002-05-17#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0010977
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0010977
        artikel: '4'
  - number: '5.2'
    text: |-
      Voorgenomen wijzigingen in de gegevens op grond waarvan de registratie is verleend, als bedoeld in de
      [artikelen 3, eerste lid, onderdeel a][ref1], en [4, tweede lid][ref2], die niet leiden tot aanpassing van de bij
      de registratie gegeven voorschriften, worden niet doorgevoerd alvorens zij door Onze Minister zijn goedgekeurd.


      [ref1]: https://wetten.overheid.nl/BWBR0010977#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010977#Artikel4
    url: https://wetten.overheid.nl/BWBR0010977/2002-05-17#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0010977
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0010977
        artikel: '4'
  - number: '6.1'
    text: |-
      De registratiehouder laat zich voortdurend en zonder onderbreking bijstaan door een terzake gekwalificeerde, voor
      de geneesmiddelenbewaking verantwoordelijke persoon.
    url: https://wetten.overheid.nl/BWBR0010977/2002-05-17#Artikel6
  - number: '6.2'
    text: 'De in het eerste lid bedoelde persoon is belast met:'
    url: https://wetten.overheid.nl/BWBR0010977/2002-05-17#Artikel6
  - number: 6.2.a
    text: |-
      de totstandbrenging en het beheer van een systeem dat waarborgt dat gegevens over alle vermoedelijke bijwerkingen,
      bijwerkingen na afwijkend gebruik, onderzoek naar de juistheid van de wachttijd, potentiële milieuproblemen en
      informatie omtrent lagere werkzaamheid dan te verwachten die gemeld worden aan het personeel van de onderneming,
      waaronder het verkooppersoneel en de dierenartsenbezoekers, op ten minste één punt worden vermeld, geordend en
      toegankelijk gemaakt;
    url: https://wetten.overheid.nl/BWBR0010977/2002-05-17#Artikel6
  - number: 6.2.b
    text: |-
      het opstellen van de in [artikel 7, eerste lid][ref1], bedoelde verslagen, en


      [ref1]: https://wetten.overheid.nl/BWBR0010977#Artikel7
    url: https://wetten.overheid.nl/BWBR0010977/2002-05-17#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0010977
        artikel: '7'
  - number: 6.2.c
    text: |-
      de taak ervoor te zorgen dat aan elk verzoek van Onze Minister om verstrekking van de nodige aanvullende gegevens
      voor de beoordeling van de aan een diergeneesmiddel verbonden voordelen en risico's snel en volledig wordt voldaan,
      met inbegrip van gegevens over het afzetvolume van of het aantal recepten voor het betrokken diergeneesmiddel;
    url: https://wetten.overheid.nl/BWBR0010977/2002-05-17#Artikel6
  - number: 6.2.d
    text: |-
      de verstrekking aan Onze Minister van alle andere informatie die relevant is voor de beoordeling van de baten en
      risico's van een diergeneesmiddel, met inbegrip van relevante informatie over veiligheidsonderzoek na toelating.
    url: https://wetten.overheid.nl/BWBR0010977/2002-05-17#Artikel6
  - number: '6.3'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de in het eerste lid bedoelde
      kwalificatie.
    url: https://wetten.overheid.nl/BWBR0010977/2002-05-17#Artikel6
  - number: '7.1'
    text: |-
      De registratiehouder houdt gedetailleerd aantekening van alle vermoedelijke bijwerkingen en bijwerkingen bij
      de mens betreffende een door hem geregistreerd diergeneesmiddel die zich in de gemeenschap of in een derde land
      voordoen en stelt daarvan verslagen op, die hij ten minste vijf jaar bewaart.
    url: https://wetten.overheid.nl/BWBR0010977/2002-05-17#Artikel7
  - number: '7.2'
    text: |-
      De verslagen, bedoeld in het eerste lid, bevatten in elk geval de meldingen voortkomend uit het systeem, bedoeld in
      [artikel 6, tweede lid, onderdeel a][ref1], en gaan vergezeld van een wetenschappelijke beoordeling van de baten en
      de risico's van het diergeneesmiddel.


      [ref1]: https://wetten.overheid.nl/BWBR0010977#Artikel6
    url: https://wetten.overheid.nl/BWBR0010977/2002-05-17#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0010977
        artikel: '6'
  - number: '7.3'
    text: |-
      De registratiehouder overlegt de in het eerste lid bedoelde verslagen op een eerste daartoe strekkend verzoek van
      Onze Minister.
    url: https://wetten.overheid.nl/BWBR0010977/2002-05-17#Artikel7
  - number: '7.4'
    text: |-
      In de eerste twee jaren na de registratie van het betreffende diergeneesmiddel overlegt de registratiehouder de in
      het eerste lid bedoelde verslagen tenminste om de zes maanden en in de daarop volgende drie jaren tenminste éénmaal
      per jaar. Na verloop van een periode van vijf jaren na registratie overlegt de registratiehouder de verslagen bij
      de aanvraag voor verlenging van de registratie van het betreffende diergeneesmiddel.
    url: https://wetten.overheid.nl/BWBR0010977/2002-05-17#Artikel7
  - number: '7.5'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de inrichting en de wijze van bijhouden van
      de verslagen, bedoeld in het eerste lid, en de rapportage daarvan aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0010977/2002-05-17#Artikel7
  - number: '8'
    text: Het Besluit registratie, substanties en bijwerkingen wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0010977/2002-05-17#Artikel8
  - number: '10'
    text: |-
      Na de inwerkingtreding van dit besluit berust de Regeling registratie diergeneesmiddelen 1995 mede op
      [artikel 5][ref1] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0010977#Artikel5
    url: https://wetten.overheid.nl/BWBR0010977/2002-05-17#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0010977
        artikel: '5'
  - number: '11'
    text: Dit besluit treedt in werking met ingang van 1 januari 2000.
    url: https://wetten.overheid.nl/BWBR0010977/2002-05-17#Artikel11
  - number: '12'
    text: 'Dit besluit wordt aangehaald als: Besluit registratie en bijwerkingen 1999.'
    url: https://wetten.overheid.nl/BWBR0010977/2002-05-17#Artikel12
