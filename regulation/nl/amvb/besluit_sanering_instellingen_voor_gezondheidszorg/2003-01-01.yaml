  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volksgezondheid, Welzijn en Sport van 11 november 1999, kenmerk CSZ/
    ZT/2014855;

    Gelet op artikel 18b, vierde, vijfde en elfde lid, van de Wet ziekenhuisvoorzieningen en op artikel 12a van de
    Wet ambulancevervoer;

    De Raad van State gehoord (advies van 30 december 1999, No. W13.99.0570/III);

    Gezien het nader rapport van Onze Minister van Volksgezondheid, Welzijn en Sport van 18 februari 2000, CSZ/
    ZT/2038137;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0011192/2003-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0011192/2003-01-01#Artikel1
  - number: 1.a
    text: |-
      College sanering: het College sanering ziekenhuisvoorzieningen, genoemd in
      [artikel 2m, eerste lid, van de Wet ziekenhuisvoorzieningen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002753#Artikel2m
    url: https://wetten.overheid.nl/BWBR0011192/2003-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002753
        artikel: 2m
  - number: 1.b
    text: |-
      ziekenhuisvoorziening: een inrichting voor gezondheidszorg als bedoeld in
      [artikel 1, eerste lid, onder c, van de Wet ziekenhuisvoorzieningen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002753#Artikel1
    url: https://wetten.overheid.nl/BWBR0011192/2003-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002753
        artikel: '1'
  - number: 1.c
    text: 'sanering: het geheel van de maatregelen die worden genomen:'
    url: https://wetten.overheid.nl/BWBR0011192/2003-01-01#Artikel1
  - number: 1.c.1°
    text: |-
      op grond van een besluit als bedoeld in [artikel 18b, eerste lid, van de Wet ziekenhuisvoorzieningen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002753#Artikel18b
    url: https://wetten.overheid.nl/BWBR0011192/2003-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002753
        artikel: 18b
  - number: 1.c.2°
    text: |-
      ter uitvoering van een voornemen als bedoeld in [artikel 17a van de Wet ziekenhuisvoorzieningen][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0002753#Artikel17a
    url: https://wetten.overheid.nl/BWBR0011192/2003-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002753
        artikel: 17a
  - number: 1.c.3°
    text: |-
      op grond van een besluit als bedoeld in [artikel 12a, onder a en b, van de Wet ambulancevervoer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002757#Artikel12a
    url: https://wetten.overheid.nl/BWBR0011192/2003-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002757
        artikel: 12a
  - number: '2.1'
    text: |-
      De financiële gevolgen van sanering, bedoeld in [artikel 18b, tweede lid, van de Wet ziekenhuisvoorzieningen][ref1]
      bestaan uit het verschil tussen de door het College sanering aanvaardbaar geachte lasten terzake van de
      sanering en de door het College sanering vastgestelde opbrengsten daarvan. Het College sanering stelt het
      verschil niet vast dan nadat de liquidatiebegroting is geverifieerd door een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002753#Artikel18b
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0011192/2003-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002753
        artikel: 18b
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '2.2'
    text: 'Bij het vaststellen van de lasten terzake van sanering neemt het College sanering in beschouwing:'
    url: https://wetten.overheid.nl/BWBR0011192/2003-01-01#Artikel2
  - number: 2.2.a
    text: onderbezettingsverliezen;
    url: https://wetten.overheid.nl/BWBR0011192/2003-01-01#Artikel2
  - number: 2.2.b
    text: uitkeringen aan werknemers of gewezen werknemers;
    url: https://wetten.overheid.nl/BWBR0011192/2003-01-01#Artikel2
  - number: 2.2.c
    text: |-
      uitkeringen aan personen die krachtens overeenkomst met de ziekenhuisvoorziening voor eigen rekening een medisch
      beroep uitoefenen of hebben uitgeoefend;
    url: https://wetten.overheid.nl/BWBR0011192/2003-01-01#Artikel2
  - number: 2.2.d
    text: boekverliezen als gevolg van de vervreemding van zaken;
    url: https://wetten.overheid.nl/BWBR0011192/2003-01-01#Artikel2
  - number: 2.2.e
    text: andere uitgaven ten behoeve van de sanering.
    url: https://wetten.overheid.nl/BWBR0011192/2003-01-01#Artikel2
  - number: '2.3'
    text: |-
      Voor de toepassing van het tweede lid blijven buiten beschouwing lasten die in aanmerking zijn genomen of
      kunnen worden genomen bij de goedkeuring of vaststelling van een tarief of een maximumtarief als bedoeld in de
      [Wet tarieven gezondheidszorg][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003356
    url: https://wetten.overheid.nl/BWBR0011192/2003-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003356
  - number: '2.4'
    text: |-
      Bij het vaststellen van de opbrengsten van sanering neemt het College sanering in beschouwing de opbrengsten van
      vermogensbestanddelen die als gevolg van de sanering niet meer bij de ziekenhuisvoorziening in gebruik zullen
      zijn, met uitzondering van de vermogensbestanddelen die naar het oordeel van het College sanering, gelet op hun
      herkomst en bestemming, behoren te worden uitgezonderd , alsmede opbrengsten die in aanmerking zijn genomen of
      kunnen worden genomen bij de goedkeuring of vaststelling van een tarief of een maximumtarief als bedoeld in de
      [Wet tarieven gezondheidszorg][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003356
    url: https://wetten.overheid.nl/BWBR0011192/2003-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003356
  - number: '2.5'
    text: Het College sanering kan nadere regels stellen terzake van de lasten en opbrengsten bedoeld in de voorgaande leden.
    url: https://wetten.overheid.nl/BWBR0011192/2003-01-01#Artikel2
  - number: '3.1'
    text: Het College sanering kan ten behoeve van de sanering en het toezicht daarop een gemachtigde aanwijzen.
    url: https://wetten.overheid.nl/BWBR0011192/2003-01-01#Artikel3
  - number: '3.2'
    text: |-
      De gemachtigde is belast met het toezicht op de naleving van de bij of krachtens
      [artikel 18b van de Wet ziekenhuisvoorzieningen][ref1] gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0002753#Artikel18b
    url: https://wetten.overheid.nl/BWBR0011192/2003-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002753
        artikel: 18b
  - number: '4.1'
    text: |-
      De ziekenhuisvoorziening is verplicht aan het College sanering de gegevens en bescheiden te verstrekken die het in
      verband met de sanering nodig acht.
    url: https://wetten.overheid.nl/BWBR0011192/2003-01-01#Artikel4
  - number: '4.2'
    text: |-
      Het College sanering kan nadere regels stellen terzake van het verstrekken van de gegevens en bescheiden bedoeld in
      het vorige lid.
    url: https://wetten.overheid.nl/BWBR0011192/2003-01-01#Artikel4
  - number: '4.3'
    text: |-
      Het College sanering kan de ziekenhuisvoorziening verplichtingen opleggen als bedoeld in
      [artikel 4:38 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0011192/2003-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '5.1'
    text: |-
      Het College sanering kan de ziekenhuisvoorziening aanwijzingen geven ten behoeve van het goede verloop van de
      sanering.
    url: https://wetten.overheid.nl/BWBR0011192/2003-01-01#Artikel5
  - number: '5.2'
    text: De ziekenhuisvoorziening is verplicht uitvoering te geven aan aanwijzingen als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0011192/2003-01-01#Artikel5
  - number: '6'
    text: Het College sanering kan de ziekenhuisvoorziening voorschotten verlenen.
    url: https://wetten.overheid.nl/BWBR0011192/2003-01-01#Artikel6
  - number: '7.1'
    text: |-
      De [artikelen 2][ref1] tot en met [6][ref2], met uitzondering van [artikel 2, tweede lid, onder c][ref3],
      zijn van overeenkomstige toepassing ten aanzien van de financiële gevolgen van sanering als bedoeld in
      [artikel 12a van de Wet ambulancevervoer][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0011192#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011192#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0011192#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0002757#Artikel12a
    url: https://wetten.overheid.nl/BWBR0011192/2003-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011192
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0011192
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0011192
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0002757
        artikel: 12a
  - number: '7.2'
    text: |-
      De subsidieverlening in het kader van het eerste lid kan worden geweigerd indien de aanvraag wordt gedaan nadat met
      de sanering een aanvang is gemaakt.
    url: https://wetten.overheid.nl/BWBR0011192/2003-01-01#Artikel7
  - number: '8'
    text: Het Besluit financiering sanering ziekenhuisvoorzieningen wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0011192/2003-01-01#Artikel8
  - number: '9'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst, en werkt terug tot en met 1 januari 2000.
    url: https://wetten.overheid.nl/BWBR0011192/2003-01-01#Artikel9
  - number: '10'
    text: 'Dit besluit wordt aangehaald als: Besluit sanering instellingen voor gezondheidszorg.'
    url: https://wetten.overheid.nl/BWBR0011192/2003-01-01#Artikel10
