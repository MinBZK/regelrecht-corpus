  - number: '5.13'
    text: |-
      1 [Artikel 5.5, derde lid, van de wet][ref1] is niet van toepassing op een besluit
      op een aanvraag om een vergunning als bedoeld in [artikel 19d, eerste lid][ref2], of
      [47a, eerste lid, van de Natuurbeschermingswet 1998][ref3], die is ingediend vóór 1 juli 2015.

      2 De [artikelen 2.7][ref4], [2.8][ref5] en [2.9][ref6] zijn niet van toepassing op projecten, plannen en andere
      handelingen die stikstofdepositie op voor stikstof gevoelige habitats in een Natura 2000-gebied veroorzaken indien
      is voldaan aan elk van de volgende voorwaarden:

      a. voor het project, het plan of de andere handeling was vóór 1 juli 2015 een besluit als bedoeld in
      [artikel 2.7, eerste lid][ref7], in voorbereiding bij het desbetreffende bestuursorgaan;

      b. de voor het nemen van het desbetreffende besluit beschikbare gegevens en bescheiden zijn naar het oordeel
      van het desbetreffende bestuursorgaan voldoende voor de beoordeling van de aanvraag of voor de voorbereiding
      van het desbetreffende besluit en bovendien, ingeval het besluit betrekking heeft op een project als bedoeld in
      [artikel 2.7, derde lid, onderdeel a, van de wet][ref8], is een volledige passende beoordeling als bedoeld in
      [artikel 2.8, eerste lid, van de wet][ref9] gemaakt, en

      c. degene die het desbetreffende project zal realiseren, onderscheidenlijk de andere handeling zal verrichten,
      heeft een tijdige uitvoering verzekerd van de maatregelen die in het kader van de realisering van het project,
      onderscheidenlijk het verrichten van de andere handeling worden getroffen om te verzekeren dat de natuurlijke
      kenmerken van Natura 2000-gebied niet zullen worden aangetast als gevolg van het project, onderscheidenlijk om
      verslechteringen of significant verstorende effecten als gevolg van de andere handeling te voorkomen.


