  - number: '1.3'
    text: |-
      1 Als categorieën van handelingen en projecten als bedoeld in
      [artikel 1.3, vijfde lid, onderdeel a, van de wet][ref1] worden aangewezen:

      a. aanleg, uitbreiding en, voor zover van toepassing, inrichting, alsmede wijziging, gebruik, beheer en onderhoud
      van:

      1°. hoofdwegen en hoofdvaarwegen als bedoeld in [artikel 1, eerste lid, van de Tracéwet][ref2] en hoofdspoorwegen
      als bedoeld in [artikel 1, eerste lid, van de Spoorwegwet][ref3];

      2°. primaire waterkeringen als bedoeld in [artikel 1.1, eerste lid, van de Waterwet][ref4], voor zover deze in
      beheer zijn bij het Rijk;

      3°. militaire terreinen en oefengebieden, alsmede de inrichtingen, bedoeld in categorie 29 van
      [bijlage I, onder C, bij het Besluit omgevingsrecht][ref5];

      4°. militaire luchthavens, de luchthaven Schiphol en overige burgerluchthavens van nationale betekenis als bedoeld
      in [artikel 8.1, tweede lid, van de Wet luchtvaart][ref6];

      5°. het landelijke gastransportnet, bedoeld in [artikel 1, eerste lid, onderdeel n, van de Gaswet][ref7];

      6°. hoogspanningsverbindingen met een spanning van ten minste 220 kV en de daarmee verbonden schakel- en
      transformatorstations en andere hulpmiddelen;

      b. activiteiten ten aanzien van:

      1°. het voorkomen of tegengaan van landwaartse verplaatsing van de kustlijn als bedoeld in
      [artikel 2.7 van de Waterwet][ref8];

      2°. landaanwinning in de territoriale zee, bedoeld in
      [artikel 1 van de Wet grenzen Nederlandse territoriale zee][ref9];

      3°. het opsporen, winnen of opslaan van diepe delfstoffen, bedoeld in [artikel 1 van de Mijnbouwwet][ref10];

      c. het treffen van maatregelen en voorzieningen die nodig zijn met het oog op de ontwikkeling, werking en
      bescherming van hoofdwateren als bedoeld in [artikel 1.1, eerste lid, van het Waterbesluit][ref11];

      d. militaire activiteiten buiten de in onderdeel a, onder 3°, bedoelde terreinen, gebieden en inrichtingen, en de
      in onderdeel a, onder 4°, bedoelde militaire luchthavens;

      e. vluchten met opsporings- of reddingshelikopters buiten de reguliere routes;

      f. uitoefening van de volgende vormen van visserij:

      1°. niet-handmatige schaal- en schelpdiervisserij, met inbegrip van het invangen van schelpdierenzaad en van
      schelpdiercultures en het uitzetten van schelpdieren;

      2°. sleepnetvisserij in zoute wateren;

      g. lozing van afvalwater in de Waddenzee;

      h. activiteiten van buitenlandse mogendheden;

      i. activiteiten die direct het op 19 april 1839 te Londen gesloten Tractaat tussen het Koninkrijk der Nederlanden
      en het Koninkrijk België betreffende de scheiding der wederzijdse grondgebieden (Trb. 1966, nr. 161) raken;

      j. activiteiten van of namens een lid van het Koninklijk Huis, en

      k. activiteiten die geheel of grotendeels plaatsvinden in:

      1°. het grensgebied, bedoeld in artikel 1 van de op 14 mei 1962 te Bennekom tot stand gekomen aanvullende
      Overeenkomst bij het Eems-Dollardverdrag (Trb. 1962, nr. 54);

      2°. de exclusieve economische zone van Nederland, bedoeld in de
      [Rijkswet instelling exclusieve economische zone][ref12], of

      3°. andere niet-provinciaal ingedeelde gebieden.

      2 Het eerste lid is uitsluitend van toepassing ten aanzien van de bevoegdheden, verantwoordelijkheden en
      verplichtingen, bedoeld in de artikelen:

      a. [2.4, eerste, tweede en derde lid][ref13], [2.7, tweede en derde lid][ref14],
      [2.8, derde, zesde, zevende en negende lid][ref15], [2.9, derde lid][ref16], en
      [5.5, eerste lid, van de wet][ref17];

      b. [3.3, eerste en tweede lid][ref18], [3.4, tweede lid][ref19], [3.8, eerste en tweede lid][ref20],
      [3.9, tweede lid][ref21], [3.10, tweede lid][ref22] in samenhang met [artikel 3.8, eerste of tweede lid][ref23],
      [3.11, eerste en tweede lid][ref24], en [3.34, derde lid, van de wet][ref25] met uitzondering van vrijstellingen
      en ontheffingen die met toepassing van de [artikelen 3.15, vierde lid][ref26], of [3.16, vierde lid][ref27],
      onderscheidenlijk [artikel 3.17, eerste lid, van de wet][ref28], worden verleend;

      c. [4.2, eerste, tweede en derde lid][ref29], [4.3, derde lid][ref30], en
      [4.5, eerste, derde en vierde lid, van de wet][ref31].


