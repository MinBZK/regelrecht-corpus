  - number: '2.15'
    text: |-
      Het in [artikel 1.13a, tweede lid, van de wet][ref1] bedoelde programma voor het legaliseren
      van activiteiten met een geringe stikstofdepositie die voldeden aan de voorwaarden van
      [artikel 19kh, zevende lid, van de Natuurbeschermingswet 1998][ref2] zoals dat luidde tot 1 januari 2017 of
      [artikel 2.12][ref3] zoals dat luidde op 28 mei 2019, bevat een beschrijving van:

      a. de totale stikstofdepositie door die activiteiten op elke hectare van de voor stikstof gevoelige habitats in
      Natura 2000-gebieden;

      b. de getroffen of te treffen maatregelen om de gevolgen van de onder a bedoelde stikstofdepositie te mitigeren of
      te compenseren;

      c. de gevolgen van de onder b bedoelde maatregelen voor de omvang van de stikstofdepositie op elke hectare van de
      voor stikstof gevoelige habitats in Natura 2000-gebieden;

      d. de wijze waarop invulling wordt gegeven aan de eisen die in [artikel 2.16][ref4] worden gesteld aan het
      verzamelen en verstrekken van gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel1.13a
      [ref2]: https://wetten.overheid.nl/BWBR0009641#Artikel19kh
