  - number: '3.21'
    text: |-
      1 De jachtakte geldt van 1 april tot 1 april van het daaropvolgende kalenderjaar en is van kracht voor heel
      Nederland.

      2 De valkeniersakte geldt van 1 april tot 1 april van het vijfde daaropvolgende kalenderjaar en is van kracht voor
      heel Nederland.

      3 De jachtakte en de valkeniersakte verliezen hun geldigheid van rechtswege op het tijdstip waarop een rechterlijke
      uitspraak waarbij aan de houder de bevoegdheid tot het gebruik van een geweer, onderscheidenlijk van jachtvogels
      ter uitoefening van het bepaalde bij of krachtens de [wet][ref1] is ontzegd, voor tenuitvoerlegging vatbaar wordt.

      4 Bij ministeriële regeling worden regels gesteld ten aanzien van:

      a. de aanvraag van jachtakten en valkeniersakten;

      b. het besluit op aanvragen van jachtakten en valkeniersakten.

      5 Degene wiens jachtakte of valkeniersakte is ingetrokken, levert deze binnen vijf dagen nadat het besluit tot
      intrekking hem bekend is gemaakt, in bij degene die haar heeft verleend.

      6 Degene aan wie de bevoegdheid tot jagen bij een rechterlijke uitspraak is ontzegd, levert binnen vijf dagen nadat
      die uitspraak voor tenuitvoerlegging vatbaar is geworden, diens jachtakte of valkeniersakte in bij degene die haar
      heeft verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0037552
    url: https://wetten.overheid.nl/BWBR0038662/2022-01-01#Artikel3.21
    references:
      - id: ref1
        bwb_id: BWBR0037552
  - number: '3.22'
    text: |-
      1 Om door Onze Minister te worden erkend wordt in het examen voor het gebruik van eendenkooien
      als bedoeld in [artikel 3.30, derde lid, van de wet][ref1] getoetst op kennis als bedoeld in
      [artikel 3.18, eerste lid, onderdeel a, onder 1°, 2°, 3°, 5°, 10°, 11° en 12°][ref2].

      3 De [artikelen 3.18, tweede lid][ref3], en [3.20][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3.30
