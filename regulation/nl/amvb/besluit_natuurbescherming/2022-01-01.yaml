articles:
  - number: '1.1'
    text: |-
      In dit besluit wordt verstaan onder:

        - *bouwactiviteit:* activiteit inhoudende het bouwen van een bouwwerk;
        - *bouwen:* plaatsen, geheel of gedeeltelijk oprichten, vernieuwen, veranderen of vergroten;
        - *bouwwerk:* constructie van enige omvang van hout, steen, metaal of ander materiaal, die op de plaats van
      bestemming hetzij direct of indirect met de grond verbonden is, hetzij direct of indirect steun vindt in of op
      de grond, bedoeld om ter plaatse te functioneren, met inbegrip van de daarvan deel uitmakende bouwwerkgebonden
      installaties anders dan een schip dat wordt gebruikt voor verblijf van personen en dat is bestemd en wordt gebruikt
      voor de vaart;
        - *depositieruimte:* ruimte, uitgedrukt in mol stikstof per hectare per jaar, die in het kader van het programma,
      bedoeld in [artikel 2.1][ref1], beschikbaar is voor stikstofdepositie op een in het programma opgenomen Natura
      2000-gebied die het gevolg is van wijziging of uitbreiding van bestaande activiteiten of het gevolg is van de
      realisatie van nieuwe projecten of verrichting van nieuwe andere handelingen;
        - *jachtexamen:* jachtexamen als bedoeld in [artikel 3.28, tweede lid, onderdeel a, van de wet][ref2];
        - *korpschef:* korpschef als bedoeld in [artikel 27 van de Politiewet 2012][ref3];
        - *ontwikkelingsruimte:* deel van de depositieruimte dat, met inachtneming van de in voorkomend geval op grond van
      [artikel 2.7, derde lid][ref4], gestelde regels, beschikbaar is voor toedeling in of reservering voor besluiten als
      bedoeld in artikel 2.7, eerste lid;
        - *CITES-basisverordening:* [verordening (EG) nr. 338/97](31997R0338) van de Raad van de Europese Unie van
      9 december 1996 inzake de bescherming van in het wild levende dier- en plantensoorten door controle op het
      desbetreffende handelsverkeer (PbEG L 61);
        - *CITES-uitvoeringsverordening:* [verordening (EG) nr. 865/2006](32006R0865) van de Commissie van 6 mei 2006,
      houdende uitvoeringsbepalingen van Verordening (EG) nr. 338/97 van de Raad inzake de bescherming van in het wild
      levende dier- en plantensoorten door controle op het desbetreffende handelsverkeer (PbEU 2006, L 166);
        - *sloopactiviteit:* activiteit inhoudende het slopen van een bouwwerk;
        - *slopen:* geheel of gedeeltelijk afbreken of uit elkaar nemen;
        - *Verordening invasieve uitheemse soorten:* verordening (EU) nr. 1143/2014 van het Europees Parlement en de Raad
      van de Europese Unie van 22 oktober 2014 betreffende de preventie en beheersing van de introductie en verspreiding
      van invasieve uitheemse soorten (PbEU L 317);
        - *voor stikstof gevoelige habitats:* voor stikstof gevoelige leefgebieden voor vogelsoorten, natuurlijke habitats
      en habitats van soorten waarvoor een instandhoudingsdoelstelling geldt;
        - *wet:* [Wet natuurbescherming][ref5].


