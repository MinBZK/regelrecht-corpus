  - number: '3.20'
    text: |-
      1 Om door Onze Minister te worden erkend, worden het jachtexamen en het examen voor het gebruik van jachtvogels
      afgenomen door een organisatie die voldoet aan de volgende eisen:

      a. zij bezit rechtspersoonlijkheid;

      b. de bestuursleden zijn naar evenredigheid afkomstig uit de kringen van jagers en natuurbescherming-landbouw;

      c. zij beschikt over een itembank met ten minste vijfhonderd meerkeuzevragen die betrekking hebben op de examens,
      waarvan de relatieve samenstelling overeenkomt met de eisen die ten aanzien van het examen worden gesteld;

      d. zij beschikt over een beeldbank met ten minste twee afbeeldingen van elk dier van de soorten, bedoeld in
      [artikel 3.18, eerste lid, onderdeel a, onder 1°][ref1], en ten minste één afbeelding van de dieren van andere
      beschermde soorten, en

      e. zij beschikt over:

      1°. een kwaliteitszorgsysteem;

      2°. een reglement waarin is vastgelegd aan welke eisen dient te worden voldaan om een examen te mogen afleggen,
      wanneer examens worden afgenomen, de wijze waarop het resultaat van het examen wordt beoordeeld, wie gerechtigd is
      de examens bij te wonen, en

      3°. een geschillenregeling.

      2 Onze Minister wijst personen aan die belast zijn met het toezicht op de kwaliteit van jachtexamens en examens
      voor het gebruik van jachtvogels. Deze personen worden gekozen uit de kring van Commissarissen van de Koning en
      burgemeesters.

      3 Een persoon als bedoeld in het tweede lid ziet erop toe dat de organisatie die examens afneemt voldoet aan de
      eisen, genoemd in het eerste lid, en dat de examens worden afgenomen in overeenstemming met de bij en krachtens de
      [artikelen 3.18][ref2] en [3.19][ref3] gestelde regels.

      4 Het bestuur van een organisatie die examens afneemt, verstrekt aan personen als bedoeld in het tweede lid
      desgevraagd inlichtingen over de inhoud van en de wijze van afnemen van examens en laat desgevraagd deze personen
      het afleggen van examens bijwonen.

      5 Een persoon als bedoeld in het tweede lid informeert Onze Minister over zijn bevindingen ten aanzien van de
      organisatie die van belang zijn voor de erkenning van examens die zijn afgenomen door die organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0038662#Artikel3.18
      [ref2]: https://wetten.overheid.nl/BWBR0038662#Artikel3.18
      [ref3]: https://wetten.overheid.nl/BWBR0038662#Artikel3.19
