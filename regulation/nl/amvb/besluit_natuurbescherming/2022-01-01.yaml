    text: |-
      1 Als categorie van handelingen als bedoeld in [artikel 1.3, vijfde lid, onderdeel a, van de wet][ref1] wordt
      aangewezen het vangen en onder zich hebben van dieren van de soorten, aangewezen in het derde lid, ten behoeve van:

      a. het opvangen en verzorgen van zieke of gewonde dieren van deze soorten in een opvangcentrum;

      b. het doen van wetenschappelijk onderzoek.

      2 Het eerste lid is uitsluitend van toepassing ten aanzien van de bevoegdheden, bedoeld in
      de [artikelen 3.8, eerste en tweede lid][ref2], en [3.10, tweede lid][ref3], in samenhang met
      [artikel 3.8, eerste en tweede lid, van de wet][ref4].

      3 Als soorten als bedoeld in het eerste lid worden aangewezen:

      a. bruinvis;

      b. gewone dolfijn;

      c. gewone zeehond;

      d. grijze zeehond;

      e. tuimelaar;

      f. witflankdolfijn;

      g. witsnuitdolfijn.


