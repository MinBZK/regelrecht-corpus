  - number: '3.7'
    text: |-
      1 Het verbod, bedoeld in [artikel 3.6, eerste lid][ref1], geldt niet voor de jacht op de wilde eend gedurende een
      half uur voor zonsopkomst en een half uur na zonsondergang.

      2 Het verbod, bedoeld in [artikel 3.6, vijfde lid][ref2], geldt niet voor de jacht vanuit vaartuigen die varen met
      een snelheid van ten hoogste 5 kilometer per uur.

      3 Het verbod, bedoeld in [artikel 3.6, zevende lid][ref3], geldt niet voor de jacht op:

      a. wilde eenden of houtduiven, of

      b. konijnen, hazen of fazanten, indien deze dieren anders worden bejaagd dan voor de voet.

      4 Het verbod, bedoeld in [artikel 3.6, twaalfde lid][ref4], geldt niet voor de uitoefening van de jacht met
      gebruikmaking van een eendenkooi als bedoeld in [artikel 3.21, eerste lid, onderdeel d, van de wet][ref5].


