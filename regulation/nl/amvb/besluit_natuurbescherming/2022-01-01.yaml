  - number: '5.16'
    text: |-
      1 Onderdelen van een omgevingsvergunning die met toepassing van
      [hoofdstuk IX, titel 2, van de Natuurbeschermingswet 1998][ref1] is verleend, gelden
      als onderdelen van een omgevingsvergunning, verleend voor een activiteit als bedoeld
      in[ artikel 2.2aa, onderdeel a, van het Besluit omgevingsrecht][ref2].

      2 Onderdelen van een omgevingsvergunning die met toepassing van
      [titel III, afdeling 2a, van de Flora- en faunawet][ref3] is verleend, gelden als
      onderdelen van een omgevingsvergunning, verleend voor een activiteit als bedoeld in
      [artikel 2.2aa, onderdeel b, van het Besluit omgevingsrecht][ref4].

      3 De op het tijdstip van inwerkingtreding van de wet aanhangige procedures over de verlening van een
      omgevingsvergunning met toepassing van [hoofdstuk IX, titel 2, van de Natuurbeschermingswet 1998][ref5] of van
      [titel III, afdeling 2a, van de Flora- en faunawet][ref6], zijn aanhangig in de staat waarin zij zich op dat
      moment bevinden en worden vanaf het tijdstip van inwerkingtreding van deze wet overeenkomstig het bepaalde bij en
      krachtens de [wet][ref7] en het [Besluit omgevingsrecht][ref8] behandeld.

      4 In zoverre in afwijking van het derde lid is Onze Minister bevoegd tot het geven van een
      verklaring van geen bedenkingen over aanvragen van omgevingsvergunning met toepassing van
      [titel III, afdeling 2a, van de Flora- en faunawet][ref9], die zijn ingediend voor het tijdstip van
      inwerkingtreding van deze wet.


