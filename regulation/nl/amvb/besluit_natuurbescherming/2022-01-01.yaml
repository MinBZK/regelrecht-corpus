    text: |-
      1 Om door Onze Minister te worden erkend, bevat het examen voor het gebruik van jachtvogels als bedoeld in
      [artikel 3.30, tweede lid, tweede volzin, van de wet][ref1]:

      a. een theoretisch gedeelte, waarin wordt getoetst op kennis als bedoeld in
      [artikel 3.18, eerste lid, onderdeel a, onder 1°, 2°, 3°, 5°, 7°, 8°, 10°, 11° en 12°][ref2];

      b. een praktisch gedeelte, waarin wordt getoetst op bekwaamheid in de omgang met jachtvogels.

      2 [Artikel 3.18, tweede lid][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3.30
