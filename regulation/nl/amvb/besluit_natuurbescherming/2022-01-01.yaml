        artikel: '2.3'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '2.10'
  - number: '2.4'
    text: |-
      Onze Minister informeert de beide Kamers der Staten-Generaal:

      a. elk jaar over de resultaten van de beoordeling, bedoeld in [artikel 1.12f, derde lid, van de wet][ref1],
      of wordt voldaan aan de omgevingswaarden, bedoeld in [artikel 1.12a van de wet][ref2], en aan de tussentijdse
      doelstellingen om tijdig aan die omgevingswaarden te voldoen;

      b. elke twee jaar over de voortgang en de gevolgen van de maatregelen, opgenomen in het programma stikstofreductie
      en natuurverbetering;

      c. elke zes jaar over de ontwikkeling van de staat van instandhouding van de voor stikstof gevoelige habitats in
      Natura 2000-gebieden in relatie tot de instandhoudingsdoelstellingen voor die gebieden.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel1.12f
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel1.12a
    url: https://wetten.overheid.nl/BWBR0038662/2022-01-01#Artikel2.4
