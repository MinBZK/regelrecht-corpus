    text: |-
      1 Als categorieën van handelingen als bedoeld in [artikel 1.3, vijfde lid, onderdeel a, van de wet][ref1] worden
      aangewezen:

      a. het vervoeren van zieke of gewonde dieren in een dierenambulance;

      b. het zich toe-eigenen en onder zich hebben van een dood uit het wild afkomstig dier, dat buiten schuld of
      medeweten is gestorven van degene die zich het dier toe-eigent, met het oog op het prepareren ervan;

      c. het onder zich hebben van een geprepareerd uit het wild afkomstig dier.

      2 Het eerste lid is uitsluitend van toepassing ten aanzien van de bevoegdheden, bedoeld in de
      [artikelen 3.3, eerste en tweede lid][ref2], [3.8, eerste en tweede lid][ref3], en [3.10, tweede lid][ref4], in
      samenhang met artikel 3.8, eerste en tweede lid, van de wet.

      3 Onder «dierenambulance» wordt in het eerste lid, onderdeel a, verstaan: motorvoertuig, ingericht en bestemd om te
      worden gebruikt voor het vervoer van zieke of gewonde dieren.


