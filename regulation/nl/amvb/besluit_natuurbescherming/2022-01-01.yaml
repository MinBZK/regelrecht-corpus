  - number: '3.10'
    text: |-
      Als middelen als bedoeld in [artikel 3.24, tweede lid, van de wet][ref1] worden aangewezen:

      a. hagelpatronen die metallisch lood bevatten;

      b. klemmen, met uitzondering van klemmen:

      1°. uitsluitend geschikt en bestemd voor het vangen en doden van mollen, zwarte ratten, bruine ratten, huismuizen,
      en

      2°. die gebruikt worden bij het voorkomen van schade aan waterstaatswerken, veroorzaakt door muskus- en
      beverratten, ter uitvoering van [artikel 3.2a van de Waterwet][ref2], door personen die in dienst zijn of
      handelen in opdracht van een waterschap en die aantoonbaar de nodige kennis en vaardigheden bezitten om deze taak
      doeltreffend uit te voeren;

      c. vallen, met uitzondering van kastvallen;

      d. strikken;

      e. vangkooien, met uitzondering van vangkooien geschikt en bestemd voor het vangen van verwilderde katten en
      verwilderde duiven binnen de bebouwde kom;

      f. lijm;

      g. netten, geschikt en bestemd om te worden gebruikt voor het vangen van vogels, en

      h. rodenators.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3.24
