  - number: '2.3'
    text: |-
      1 De bestuursorganen die zijn belast met de uitvoering van de maatregelen, opgenomen in het programma
      stikstofreductie en natuurverbetering, verzamelen gegevens over de voortgang en de gevolgen van die maatregelen en
      verstrekken die gegevens elke twee jaar aan Onze Minister.

      2 De bestuursorganen die ingevolge de [artikelen 2.3][ref1] en [2.10, eerste lid, onderdeel a, van de wet][ref2]
      verantwoordelijk zijn voor de vaststelling van het in artikel 2.3 van de wet bedoelde beheerplan, verzamelen
      gegevens over de ontwikkeling van de staat van instandhouding van de voor stikstof gevoelige habitats in Natura
      2000-gebieden in relatie tot de instandhoudingsdoelstellingen voor die gebieden en verstrekken die gegevens elke
      zes jaar aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2.3
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel2.10
    url: https://wetten.overheid.nl/BWBR0038662/2022-01-01#Artikel2.3
    references:
