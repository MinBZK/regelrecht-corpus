  - number: '3.4'
    text: |-
      Als soorten van jachtvogels als bedoeld in [artikel 3.21, eerste lid, onderdeel c, van de wet][ref1] worden
      aangewezen:

      a. haviken (Accipiter gentilis);

      b. slechtvalken (Falco peregrinus).


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3.21
    url: https://wetten.overheid.nl/BWBR0038662/2022-01-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3.21'
  - number: '3.5'
    text: |-
      Een eendenkooi als bedoeld in [artikel 3.21, eerste lid, onderdeel d, van de wet][ref1], voldoet aan de volgende
      regels:

      a. er is een open wateroppervlakte aanwezig van ten minste 200 vierkante meter, waarin een cirkel met een straal
      van ten minste 7,50 meter beschreven kan worden;

      b. het water is ten minste 50 centimeter diep;

      c. rondom het water ligt een rand van bos of struweel, en

      d. in open verbinding met het water is ten minste één vangpijp aanwezig die onmiddellijk als vangmiddel kan worden
      gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3.21
    url: https://wetten.overheid.nl/BWBR0038662/2022-01-01#Artikel3.5
