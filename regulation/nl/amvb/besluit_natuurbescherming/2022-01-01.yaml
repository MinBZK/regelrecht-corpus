        artikel: '3.21'
  - number: '3.6'
    text: |-
      1 Het is verboden om de jacht uit te oefenen voor zonsopgang en na zonsondergang.

      2 Het is verboden om de jacht uit te oefenen op zondagen, de nieuwjaarsdag, de tweede paas- en pinksterdag, de
      beide kerstdagen en de Hemelvaartsdag.

      3 Het is verboden om de jacht uit te oefenen op begraafplaatsen.

      4 Het is verboden om de jacht uit te oefenen vanaf of vanuit een motorrijtuig dan wel een ander voertuig.

      5 Het is verboden om de jacht uit te oefenen vanaf of vanuit een vaartuig.

      6 Het is verboden om de jacht uit te oefenen vanuit een luchtvaartuig.

      7 Het is verboden om de jacht uit te oefenen indien de grond met sneeuw is bedekt.

      8 Het is verboden om de jacht uit te oefenen op wild als bedoeld in [artikel 3.20, tweede lid, van de wet][ref1]
      dat zich ten gevolge van hoge waterstand ophoudt op hoog gelegen gedeelten van het terrein.

      9 Het is verboden om de jacht uit te oefenen op wild als bedoeld in [artikel 3.20, tweede lid, van de wet][ref2]
      voor zover dat zich bevindt in of in de nabijheid van wakken of bijten in het ijs.

      10 Het is verboden om de jacht uit te oefenen op wild als bedoeld in [artikel 3.20, tweede lid, van de wet][ref3]
      voor zover dat als gevolg van onvoldoende bevedering niet in staat is te vliegen.

      11 Het is verboden om de jacht uit te oefenen op wild als bedoeld in [artikel 3.20, tweede lid, van de wet][ref4]
      dat als gevolg van weersomstandigheden in uitgeputte toestand verkeert.

      12 Het is verboden om de jacht uit te oefenen binnen een straal van 200 meter rond plaatsen waar voer of aas is of
      wordt verstrekt met als oogmerk wild als bedoeld in [artikel 3.20, tweede lid, van de wet][ref5] te lokken.


