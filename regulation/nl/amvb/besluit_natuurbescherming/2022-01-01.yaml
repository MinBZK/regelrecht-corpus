      Als soort als bedoeld in [artikel 3.39 van de wet][ref1] worden de volgende soorten aangewezen:

      a. Japanse duizendknoop (*Fallopia japonica*);

      b. Sachalinse duizendknoop (*Fallopia sachalinensis*); en

      c. bastaardduizendknoop (*Fallopia x bohemica*).


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3.39
