        artikel: '81'
  - number: '3.9'
    text: |-
      1 Als middelen als bedoeld in [artikel 3.3, vijfde lid, onderdeel a, van de wet][ref1] worden aangewezen:

      a. geweren;

      b. honden, niet zijnde lange honden;

      c. haviken, slechtvalken en woestijnbuizerds;

      d. kastvallen;

      e. vangkooien;

      f. vangnetten;

      g. eendenkooien;

      h. bal-chatri, en

      i. slag-, snij- of steekwapens.

      2 Als methoden als bedoeld in [artikel 3.3, vijfde lid, onderdeel a, van de wet][ref2] worden aangewezen:

      a. het doden met gebruikmaking van middelen die krachtens de [Wet gewasbeschermingsmiddelen en biociden][ref3] zijn
      toegelaten of vrijgesteld, met inbegrip van de gebruikmaking van alle middelen of installaties die noodzakelijk
      zijn om die middelen toe te passen;

      b. het vangen door middel van bijeendrijven, waaronder in elk geval wordt begrepen het gebruik van de vangkraal in
      combinatie met een middel als bedoeld in onderdeel a;

      c. het vangen of doden met gebruikmaking van lokvogels;

      d. het vangen of doden met gebruikmaking van een middel waarmee lokgeluiden kunnen worden gemaakt;

      e. het doden met gebruikmaking van een geweer, waarbij wordt gehandeld in afwijking van de regels, gesteld in de
      [artikelen 3.12][ref4], [3.13][ref5], [3.14][ref6], [3.15][ref7] of [3.16][ref8], inzake:

      1°. de omvang van het jachtveld,

      2°. het gebruik van middelen op, aan of bij het geweer, zoals een geluiddemper, een kunstmatige lichtbron, een
      voorziening om de prooi te verlichten, een vizier met beeldomzetter, een elektronische beeldversterker of enig
      ander instrument om in de nacht te schieten,

      3°. de munitie, of

      4°. het gebruik van het geweer:

        - voor zonsopgang of na zonsondergang,
        - binnen de bebouwde kom of op terreinen als bedoeld in [artikel 3.21, derde lid, van de wet][ref9],
        - binnen de afpalingskring van een eendenkooi als bedoeld in
      [artikel 3.21, eerste lid, onderdeel d, van de wet][ref10],
        - vanaf of vanuit een rijdend motorrijtuig dan wel een ander voertuig, of
        - vanuit een luchtvaartuig;

      f. het doden door middel van cervicale dislocatie, en

      g. het vangen of doden met gebruikmaking van lokvoer.

      3 Als middelen, onderscheidenlijk methoden als bedoeld in [artikel 3.4, vierde lid, van de wet][ref11] worden
      aangewezen:

      a. eendenkooien die worden gebruikt anders dan ten behoeve van de uitoefening van de jacht;

      b. bal-chatri;

      c. doden met gebruikmaking van middelen die krachtens de [Wet gewasbeschermingsmiddelen en biociden][ref12] zijn
      toegelaten of vrijgesteld;

      d. het vangen of doden met gebruikmaking van een middel waarmee elektronisch versterkte lokgeluiden kunnen worden
      gemaakt, en

      e. het vangen of doden met gebruikmaking van een geweer, voorzien van een geluiddemper.

      4 De aanwijzing van geweren, bedoeld in het eerste lid, onderdeel a, en de methode, bedoeld in het tweede lid,
      onderdeel e, geldt uitsluitend voor zover:

      a. wordt gehandeld overeenkomstig de [artikelen 3.12][ref13], [3.13][ref14], [3.14][ref15], [3.15][ref16] en
      [3.16][ref17] inzake de regels waaraan het jachtveld voldoet, inzake de regels over de munitie, het gebruik van
      middelen op, aan of bij het geweer of de diersoorten waarop het gebruik van het geweer betrekking heeft en inzake
      de gevallen waarin het gebruik van het geweer is uitgesloten of beperkt, dan wel,

      b. voor zover het betreft de methode, bedoeld in het tweede lid, onderdeel e, op grond van
      [artikel 3.26, derde lid, van de wet][ref18] ontheffing of vrijstelling is verleend van de [artikelen 3.12][ref19],
      [3.13][ref20], [3.14][ref21], [3.15][ref22] of [3.16][ref23].

      5 De aanwijzing van woestijnbuizerds, bedoeld in het eerste lid, aanhef en onderdeel c, geldt uitsluitend
      voor het gebruik van deze roofvogels door degene die beschikt over een valkeniersakte als bedoeld in
      [artikel 3.30, eerste lid, onderdeel a, van de wet][ref24].

      6 De aanwijzing van bal-chatri, bedoeld in het eerste lid, aanhef en onderdeel h, en geldt uitsluitend onder de
      voorwaarde dat hierbij geen gebruik wordt gemaakt van levende lokdieren, dat op voorhand is gewaarborgd dat de bal-
      chatri onder permanent direct toezicht staat van een deskundige en dat gevangen dieren niet onnodig lang vastzitten
      en niet onnodig worden verwond.

      7 De aanwijzing van slag-, snij- of steekwapens, bedoeld in het eerste lid, aanhef en onderdeel i, geldt
      alleen voor het doden van in nood verkerende, gewonde vogels, door personen die aantoonbaar de nodige kennis
      en vaardigheden bezitten om deze taak humaan en doeltreffend uit te voeren, en ingeval er redelijkerwijs geen
      alternatief middel voorhanden is met minder mogelijke nadelige gevolgen voor het welzijn van het desbetreffende
      dier.

      8 De aanwijzing van lokvogels, bedoeld in het tweede lid, aanhef en onderdeel c, geldt, indien het levende
      lokvogels betreft, uitsluitend indien:

      a. het eksters, kauwen, zwarte kraaien, ganzen, eenden of spreeuwen betreft, die worden gebruikt voor het vangen
      van eksters, kauwen, zwarte kraaien, ganzen, eenden, onderscheidenlijk spreeuwen met vangkooien, kastvallen of
      vangnetten;

      b. de vogels zijn gefokt;

      c. de vangkooien en kastvallen zodanig zijn vervaardigd dat in de kooi of val geen lichamelijk contact mogelijk is
      tussen de lokvogel en het te vangen dier;

      d. de vogels niet verminkt of blind zijn, en

      e. de vogels beschikken over voldoende voedsel, water, lucht, beschutting en bewegingsruimte en worden ook
      overigens gehouden overeenkomstig de eisen gesteld bij of krachtens de [Wet dieren][ref25].

      9 De aanwijzing van cervicale dislocatie, bedoeld in het tweede lid, aanhef en onderdeel f, geldt alleen voor het
      doden van in nood verkerende, gewonde vogels van een omvang kleiner dan of gelijk aan eenden, door personen die
      aantoonbaar de nodige kennis en vaardigheden bezitten om deze taak humaan en doeltreffend uit te voeren, en ingeval
      er redelijkerwijs geen alternatief middel voorhanden is met minder mogelijke nadelige gevolgen voor het welzijn van
      het desbetreffende dier.


