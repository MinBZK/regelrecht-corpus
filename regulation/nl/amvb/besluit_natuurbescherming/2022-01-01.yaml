      1 Een geweer als bedoeld in [artikel 3.26, eerste lid, van de wet][ref1] heeft een gladde loop met een kaliber
      van ten minste 24 en ten hoogste 12 of een getrokken loop met een nominaal kaliber van ten minste .22 inch of 5,58
      millimeter.

      2 Een enkelloops hagelgeweer als bedoeld in [artikel 3.26, eerste lid, van de wet][ref2] heeft een magazijn dat ten
      hoogste twee patronen kan bevatten.

      3 Een kogelgeweer als bedoeld in [artikel 3.26, eerste lid, van de wet][ref3] heeft een magazijn dat ten hoogste
      twee patronen kan bevatten, tenzij het is voorzien van een grendelinrichting waarmee het wapen handmatig schot voor
      schot wordt geladen.

      4 Een geweer als bedoeld in [artikel 3.26, eerste lid, van de wet][ref4] is niet voorzien van een geluiddemper, een
      kunstmatige lichtbron, een voorziening om de prooi te verlichten, een vizier met beeldomzetter, een elektronische
      beeldversterker of enig ander instrument om in de nacht te schieten.


