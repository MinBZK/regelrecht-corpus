    text: |-
      Als minister als bedoeld in [artikel 1.3, vijfde lid, aanhef, van de wet][ref1] wordt aangewezen Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel1.3
