  - number: '3.23'
    text: |-
      De eigenaar van een eendenkooi gebruikt voor de afpaling van de eendenkooi, bedoeld in
      [artikel 3.30, negende lid, van de wet][ref1] palen die zijn voorzien van het opschrift «Eendenkooi van x, met
      recht van afpaling op y meter, gerekend uit het midden der kooi», waarbij wordt ingevuld voor:

        - x: de naam van de eigenaar van de desbetreffende eendenkooi;
        - y: het aantal meters waarop het afpalingsrecht betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3.30
    url: https://wetten.overheid.nl/BWBR0038662/2022-01-01#Artikel3.23
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3.30'
  - number: '3.24'
    text: |-
      1 Het is verboden gefokte vogels van soorten als bedoeld in artikel 1 van de Vogelrichtlijn, die niet zijn genoemd
      in bijlage A, B, C of D bij de CITES-basisverordening, of producten of eieren daarvan onder zich te hebben of te
      verhandelen.

      2 Het is verboden dieren of planten van de soorten, genoemd in bijlage A, B, C of D bij de CITES-basisverordening,
      producten of eieren van deze dieren, of producten van deze planten onder zich te hebben.

      3 Het is verboden dieren of planten van de soorten, genoemd in bijlage C of D bij de CITES-basisverordening,
      producten of eieren van deze dieren, of producten van deze planten te verhandelen.

      4 Het tweede en derde lid zijn niet van toepassing op:

      a. uit het wild afkomstige dieren en planten die na 10 juni 1994 aantoonbaar overeenkomstig de op dat moment
      geldende regelgeving aan de natuur zijn onttrokken van de soorten, genoemd in bijlage IV bij de Habitatrichtlijn;

      b. uit het wild afkomstige dieren en planten die na 10 juni 1994 aantoonbaar overeenkomstig de op dat moment
      geldende regelgeving aan de natuur zijn onttrokken van de soorten, genoemd in bijlage I of II bij het Verdrag van
      Bern of bijlage I bij het Verdrag van Bonn, niet zijnde soorten als bedoeld in artikel 1 van de Vogelrichtlijn, en

      c. uit het wild afkomstige vogels van soorten als bedoeld in artikel 1 van de Vogelrichtlijn.
    url: https://wetten.overheid.nl/BWBR0038662/2022-01-01#Artikel3.24
  - number: '3.25'
    text: |-
      Het is verboden uit het wild afkomstige dieren van de soorten, genoemd in [bijlage 1 bij dit besluit][ref1], onder
      zich te hebben of te verhandelen.


      [ref1]: https://wetten.overheid.nl/BWBR0038662
    url: https://wetten.overheid.nl/BWBR0038662/2022-01-01#Artikel3.25
    references:
      - id: ref1
        bwb_id: BWBR0038662
  - number: '3.26'
    text: |-
      1 Het is verboden een uit het wild afkomstige vogel als bedoeld in artikel 1 van de Vogelrichtlijn te prepareren.

      2 Het verbod, bedoeld in het eerste lid, is niet van toepassing op degene die:

      a. aan Onze Minister binnen drie dagen na ontvangst gegevens verstrekt over een vogel als bedoeld in het eerste
      lid, die hem ter preparatie wordt aangeboden, op een bij ministeriële regeling te bepalen wijze, en

      b. een door Onze Minister verstrekt merkteken aanbrengt op geprepareerde vogels als bedoeld in het eerste lid.

      3 Bij ministeriële regeling worden regels gesteld over het verstrekken van gegevens en het merken van geprepareerde
      vogels, bedoeld in het tweede lid. Deze regels kunnen onder meer betrekking hebben op:

      a. welke gegevens aan Onze Minister worden verstrekt;

      b. de kenmerken van de merktekens, en

      c. de wijze waarop een merkteken wordt aangevraagd.
    url: https://wetten.overheid.nl/BWBR0038662/2022-01-01#Artikel3.26
  - number: '3.27'
    text: |-
      1 Degene die een levend gefokt dier of een levende gekweekte plant onder zich heeft, houdt een administratie bij
      met betrekking tot dat dier of die plant, indien het dier of de plant behoort tot:

      a. de soorten genoemd in bijlage IV bij de Habitatrichtlijn, bijlage II bij het Verdrag van Bern of bijlage I bij
      het Verdrag van Bonn, met uitzondering van vogels van soorten als bedoeld in artikel 1 van de Vogelrichtlijn;

      b. de soorten, genoemd in bijlage A bij de CITES-basisverordening, met uitzondering van de in bijlage X bij de
      CITES-uitvoeringsverordening genoemde diersoorten en de hybriden daarvan;

      c. de diersoorten, genoemd in bijlage B bij de CITES-basisverordening, met uitzondering van:

      1°. gefokte vogels, die van een gesloten pootring zijn voorzien, en

      2°. de soorten, genoemd in [bijlage 2 bij dit besluit][ref1], of

      d. de kunstmatig gekweekte hybriden van niet van een annotatie voorziene soorten genoemd in bijlage A bij de CITES-
      basisverordening, voor zover voor die soorten een fytosanitair certificaat als bedoeld in artikel 17 van de CITES-
      uitvoeringsverordening is afgegeven.

      2 Bij ministeriële regeling worden regels gesteld over de administratie, bedoeld in het eerste lid. Deze regels
      kunnen onder meer betrekking hebben op:

      a. de gegevens die worden geadministreerd;

      b. de wijze waarop de administratie wordt bijgehouden, en

      c. de bewaartermijn van de administratie.

      3 Degene die een administratie als bedoeld in het eerste lid bijhoudt, verschaft desgevraagd inzage in die
      administratie aan in en op grond van [artikel 7.1 van de wet][ref2] aangewezen ambtenaren.

      4 Het eerste, tweede en derde lid zijn van overeenkomstige toepassing op degene die een uit het wild afkomstig
      levend dier van een soort, genoemd in bijlage B bij de CITES-basisverordening, onder zich heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0038662
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel7.1
    url: https://wetten.overheid.nl/BWBR0038662/2022-01-01#Artikel3.27
    references:
      - id: ref1
        bwb_id: BWBR0038662
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '7.1'
  - number: '3.28'
    text: |-
      1 Een ieder die een vogel van een soort als bedoeld in artikel 1 van de Vogelrichtlijn of genoemd in bijlage A bij
      de CITES-basisverordening fokt, voorziet de vogel van een gesloten pootring.

      2 Het eerste lid is niet van toepassing ten aanzien van vogels van de soorten, genoemd in bijlage X bij de CITES-
      uitvoeringsverordening.

      3 De gesloten pootringen, bedoeld in het eerste lid, worden uitgereikt door Onze Minister.

      4 Bij ministeriële regeling worden nadere regels gesteld over de pootringen. Deze regels kunnen onder meer
      betrekking hebben op:

      a. de kenmerken van de pootringen, waarbij onderscheid gemaakt kan worden naar vogelsoort, en

      b. de wijze waarop de gesloten pootringen dienen te worden aangevraagd.

      5 In afwijking van het derde lid, kunnen bij ministeriële regeling rechtspersoonlijkheid bezittende organisaties
      worden aangewezen die belast zijn met de taak om pootringen uit te geven.

      6 Bij de ministeriële regeling, bedoeld in het vijfde lid, kan worden bepaald dat:

      a. de aangewezen organisaties een administratie bijhouden op een bij de ministeriële regeling te bepalen wijze, en

      b. de aangewezen organisaties informatie verstrekken aan Onze Minister op een bij de ministeriële regeling te
      bepalen wijze.
    url: https://wetten.overheid.nl/BWBR0038662/2022-01-01#Artikel3.28
  - number: '3.29'
    text: |-
      Het is verboden dieren, planten, producten, nesten of eieren van dieren of producten van planten van soorten als
      bedoeld in artikel 1 van de Vogelrichtlijn, of genoemd in bijlage IV bij de Habitatrichtlijn, bijlage II bij het
      Verdrag van Bern, bijlage I bij het Verdrag van Bonn of bijlage A, B, C, of D van de CITES-basisverordening op
      andere plaatsen dan bij ministeriële regeling aangewezen douanekantoren Nederland binnen of buiten te brengen.
    url: https://wetten.overheid.nl/BWBR0038662/2022-01-01#Artikel3.29
  - number: '3.30'
    text: |-
      1 Als verordening als bedoeld in [artikel 3.36, onderdeel e, van de wet][ref1] wordt aangewezen verordening (EEG)
      nr. 3254/91 van de Raad van 4 november 1991 houdende een verbod op het gebruik van de wildklem in de Gemeenschap
      en op het binnenbrengen in de Gemeenschap van pelzen en produkten die vervaardigd zijn van bepaalde in het wild
      levende diersoorten uit landen waar gebruik wordt gemaakt van de wildklem of andere vangmethoden die niet stroken
      met de internationale normen voor humane vangst met behulp van vallen (PbEG 1991, L 308).

      2 Als richtlijn als bedoeld in [artikel 3.36, onderdeel e, van de wet][ref2] wordt aangewezen [richtlijn 83/129/
      EEG](31983L0129) van de Raad van 28 maart 1983 betreffende de invoer in de Lid-Staten van huiden van bepaalde
      zeehondenjongen en daarvan vervaardigde produkten (PbEG 1983, L 91).


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3.36
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3.36
