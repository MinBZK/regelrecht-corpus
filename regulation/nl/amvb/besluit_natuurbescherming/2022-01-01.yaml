  - number: '2.14'
    text: |-
      1 Het bestuursorgaan dat bevoegd is tot verlening van een vergunning als
      bedoeld in [artikel 2.7, tweede lid, van de wet][ref1], of op grond van
      [artikel 6.10a, eerste en tweede lid, van het Besluit omgevingsrecht][ref2] bevoegd is te verklaren geen
      bedenkingen tegen de verlening van een omgevingsvergunning te hebben, kan in uitzonderlijke gevallen en
      uitsluitend ingeval verzekerd is dat een goede werking van het programma, bedoeld in [artikel 2.1][ref3], niet
      in gevaar komt, besluiten dat [artikel 5.5, derde lid, van de wet][ref4] met betrekking tot een project dat
      stikstofdepositie veroorzaakt op voor stikstof gevoelige habitats in een Natura 2000-gebied buiten toepassing
      blijft. Het bestuursorgaan neemt dit besluit in overeenstemming met de bestuursorganen die het beheerplan, bedoeld
      in [artikel 2.3 van de wet][ref5], vaststellen voor de in het programma, bedoeld in artikel 2.1, opgenomen Natura
      2000-gebieden waarin de stikstofdepositie die het project veroorzaakt hoofdzakelijk plaatsvindt.

      2 Het derde tot en met zesde lid is van toepassing op projecten en andere handelingen als bedoeld in
      [artikel 2.7, tweede lid, van de wet][ref6]:

      a. die stikstofdepositie veroorzaken op een gebied dat niet in het programma, bedoeld in [artikel 2.1][ref7] is
      opgenomen, of

      b. ten aanzien waarvan een besluit als bedoeld in het eerste lid is genomen.

      3 Voor de toepassing van [artikel 2.7, derde lid, aanhef en onderdeel a][ref8], in samenhang met
      [artikel 2.8, derde lid, van de wet][ref9] wordt ervan uitgegaan dat de door een project veroorzaakte
      stikstofdepositie op voor stikstof gevoelige habitats in een Natura 2000-gebied met zekerheid de natuurlijke
      kenmerken van dat gebied niet aantast, indien:

      a. blijkens de passende beoordeling is verzekerd dat, in samenhang met voor dat project getroffen maatregelen, per
      saldo nergens in het Natura 2000-gebied de stikstofdepositie op de voor stikstof gevoelige habitats als gevolg van
      dat project toeneemt, en,

      b. ingeval het Natura 2000-gebied is opgenomen in het programma, bedoeld in [artikel 2.1][ref10], de gevolgen
      van de in onderdeel a bedoelde maatregelen niet al zijn betrokken bij de ecologische beoordeling, bedoeld in
      [artikel 2.5][ref11].

      4 Het bestuursorgaan kan ter vermindering van de belasting door stikstofdepositie van het desbetreffende Natura
      2000-gebied aan het verlenen van de vergunning voor een project als voorwaarde verbinden dat de stikstofdepositie
      op de voor stikstof gevoelige habitats in het Natura 2000-gebied die wordt veroorzaakt door het project of de
      andere handeling, niet groter is dan de door het bestuursorgaan geregistreerde en voor dat project beschikbaar
      gestelde afname van stikstofdepositie op deze habitats als gevolg van de beëindiging van een of meer bepaalde
      andere projecten.

      5 Gedeputeerde staten, onderscheidenlijk provinciale staten, kunnen bij het toepassen van
      [artikel 2.4 van de wet][ref12], in elk geval de verplichting opleggen dat de stikstofdepositie op de voor stikstof
      gevoelige habitats in het Natura 2000-gebied geheel dan wel voor een bepaald deel, niet groter is dan de door
      gedeputeerde staten geregistreerde en voor het project of de andere handeling beschikbaar gestelde afname van
      stikstofdepositie op deze habitats als gevolg van de beëindiging van een of meer bepaalde andere projecten of
      andere handelingen.

      6 De bestuursorganen, bedoeld in het eerste lid, tweede volzin, dragen zorg voor een actueel
      overzicht van de gevolgen van de projecten ten aanzien waarvan een besluit als bedoeld in het eerste
      lid is genomen voor de stikstofdepositie. Deze gegevens worden betrokken bij de toepassing van
      [artikel 2.2, eerste lid, onderdeel j][ref13].


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2.7
