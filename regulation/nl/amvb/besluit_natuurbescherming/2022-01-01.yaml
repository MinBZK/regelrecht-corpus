      1 Het is verboden een geweer ter uitoefening van het bepaalde bij of krachtens de [wet][ref1] te gebruiken:

      a. voor zonsopgang en na zonsondergang;

      b. binnen de bebouwde kom of op terreinen als bedoeld in [artikel 3.21, derde lid, van de wet][ref2];

      c. binnen de afpalingskring van een eendenkooi als bedoeld in
      [artikel 3.21, eerste lid, onderdeel d, van de wet][ref3];

      d. vanaf of vanuit een rijdend motorrijtuig dan wel een ander voertuig, of

      e. vanuit een luchtvaartuig.

      2 [Artikel 3.7, eerste lid][ref4], is van overeenkomstige toepassing op het verbod, bedoeld in het eerste lid,
      aanhef en onderdeel a, ingeval het geweer wordt gebruikt bij de uitoefening van de jacht op wilde eenden.


