  - number: '3.31'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld ter uitvoering van artikel 10, eerste lid, van de
      Verordening invasieve uitheemse soorten.
    url: https://wetten.overheid.nl/BWBR0038662/2022-01-01#Artikel3.31
  - number: '3.32'
    text: |-
      1 Gedeputeerde staten zijn belast met het uitvoeren in hun provincie van uitroeiingsmaatregelen als bedoeld
      in artikel 17 van de Verordening invasieve uitheemse soorten, beheersmaatregelen als bedoeld in artikel 19 van
      de Verordening invasieve uitheemse soorten en herstelmaatregelen als bedoeld in artikel 20 van de Verordening
      invasieve uitheemse soorten, ten aanzien van bij ministeriële regeling aangewezen uitheemse invasieve soorten die
      worden genoemd op de Unielijst, bedoeld in artikel 4 van de Verordening invasieve uitheemse soorten.

      2 De aanwijzing, bedoeld in het eerste lid, vindt plaats in overeenstemming met gedeputeerde staten, bedoeld in het
      eerste lid.

      3 Bij de ministeriële regeling, bedoeld in het eerste lid, kunnen nadere regels worden gesteld over de maatregelen,
      bedoeld in het eerste lid. Deze regels kunnen in elk geval betrekking hebben op:

      a. de door gedeputeerde staten te gebruiken methoden, bedoeld in artikel 17, tweede lid, van de Verordening
      invasieve uitheemse soorten;

      b. de rangschikking naar prioriteit van beheersmaatregelen, bedoeld in artikel 19, eerste lid, van de Verordening
      invasieve uitheemse soorten;

      c. de aard van de door gedeputeerde staten te nemen beheersmaatregelen, overeenkomstig artikel 19, tweede en derde
      lid, van de Verordening invasieve uitheemse soorten;

      d. de aard van de door gedeputeerde staten te nemen herstelmaatregelen, overeenkomstig artikel 20, eerste en tweede
      lid, van de Verordening invasieve uitheemse soorten, en

      e. de gegevens die gedeputeerden aan Onze Minister verstrekken over de uitvoering van de maatregelen, bedoeld in
      het eerste lid, en over de aanwezigheid van dieren van invasieve uitheemse soorten in hun provincie.
    url: https://wetten.overheid.nl/BWBR0038662/2022-01-01#Artikel3.32
  - number: '4.1'
    text: |-
      1 Als gedragingen als bedoeld in [artikel 7.6, eerste lid, van de wet][ref1] worden aangewezen:

      a. het binnenbrengen in de Gemeenschap van een specimen in strijd met het bepaalde in artikel 4, derde en vierde
      lid, van de CITES-basisverordening;

      b. handelen in strijd met een voorwaarde of vereiste, verbonden aan een vergunning of certificaat op grond
      van artikel 11, derde lid, van de CITES-basisverordening, voor zover de voorwaarde of het vereiste ziet op de
      administratie, de verstrekking van gegevens of het merken van dieren, planten of eieren;

      c. handelen in strijd met de artikelen 33, eerste lid, onderdeel c, en 40, eerste lid, onderdeel d, van de CITES-
      uitvoeringsverordening van de Commissie van 4 mei 2006 houdende uitvoeringsbepalingen van Verordening (EG)
      nr. 338/97 van de Raad inzake de bescherming van in het wild levende dier- en plantensoorten door controle op het
      desbetreffende handelsverkeer (PB L 166), en

      d. handelen in strijd met het bepaalde bij of krachtens de [artikelen 3.27][ref2] en [3.28][ref3] van dit besluit.

      2 De op grond van [7.6, tweede lid][ref4], vast te stellen bestuurlijke boete bedraagt
      ten hoogste 50% van het bedrag dat is vastgesteld voor de eerste categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref5].

      3 In afwijking van het tweede lid bedraagt de op grond van [7.6, tweede lid][ref6], vast te stellen
      bestuurlijke boete ten hoogste het bedrag dat is vastgesteld voor de eerste categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref7], indien ten tijde van het begaan van een overtreding
      nog geen vijf jaren zijn verstreken sinds een eerder aan de overtreder opgelegde bestuurlijke boete voor een
      overtreding, behorende tot eenzelfde categorie van gedragingen als bedoeld in het eerste lid, onherroepelijk is
      geworden.


