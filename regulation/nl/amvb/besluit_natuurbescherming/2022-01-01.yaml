    text: |-
      1 De jachthouder verleent aan derden, anders dan de jachtopzichter, uitsluitend de toestemming, bedoeld in
      [artikel 3.20, vierde lid, van de wet][ref1], indien:

      a. hij een natuurlijke persoon is en aan hem een jachtakte of valkeniersakte is verleend die op het tijdstip van
      ondertekening van de toestemming geldig is;

      b. hij een rechtspersoonlijkheid bezittende organisatie van samenwerkende jachthouders is, of

      c. hij een bij ministeriële regeling aangewezen rechtspersoonlijkheid bezittende organisatie is.

      2 Aanwijzing van een organisatie als bedoeld in het eerste lid, onderdeel c, geschiedt uitsluitend, indien naar
      het oordeel van Onze Minister een duurzaam beheer van populaties in het wild levende dieren door deze organisatie,
      gelet op haar doelstelling en gelet op de kennis en kunde waarover de organisatie beschikt, in voldoende mate is
      verzekerd. Indien een aangewezen organisatie naar het oordeel van Onze Minister niet langer aan de in de eerste
      volzin bedoelde voorwaarde voor aanwijzing voldoet, kan hij de aanwijzing van de organisatie intrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3.20
    url: https://wetten.overheid.nl/BWBR0038662/2022-01-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3.20'
  - number: '3.3'
    text: |-
      1 De toestemming, bedoeld in [artikel 3.20, vierde lid, van de wet][ref1]:

      a. is voorzien van een aantekening van de korpschef, waaruit blijkt dat het jachtveld waarop de jacht wordt
      uitgeoefend, voldoet aan [artikel 3.12][ref2], voor zover bij de uitoefening van de jacht gebruik wordt gemaakt van
      een geweer;

      b. is voorzien van de namen, voornamen en geboortedata van degenen aan wie de toestemming wordt verleend, en

      c. heeft een geldigheidsduur die uiterlijk verstrijkt op 31 maart volgende op de datum van ondertekening van de
      toestemming.

      2 Het eerste lid, aanhef en onderdeel a, is niet van toepassing indien de toestemming wordt verleend aan de
      jachtopzichter.

      3 Het eerste lid, aanhef en onderdeel b, is niet van toepassing ten aanzien van derden, indien:

      a. deze derde de jacht uitoefent in het gezelschap van degene aan wie de jachthouder toestemming heeft verleend;

      b. de jachthouder de uitoefening van de jacht door derden in de desbetreffende toestemming uitdrukkelijk heeft
      toegestaan, en

      c. aan degene aan wie de jachthouder de toestemming heeft verleend, een jachtakte of valkeniersakte is verleend die
      op het tijdstip van uitoefening van de jacht geldig is.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3.20
      [ref2]: https://wetten.overheid.nl/BWBR0038662#Artikel3.12
    url: https://wetten.overheid.nl/BWBR0038662/2022-01-01#Artikel3.3
