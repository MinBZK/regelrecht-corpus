      1 Met betrekking tot dieren van de hierna genoemde soorten worden, onverminderd de
      [artikelen 3.13, tweede, derde en vierde lid][ref1], en [3.14, derde lid][ref2], uitsluitend de volgende geweren en
      munitie gebruikt:

      a. reeën: geweren met ten minste één getrokken loop en kogelpatronen voor getrokken loop waarvan de trefenergie ten
      minste 980 Joule op 100 meter afstand van de loopmond bedraagt;

      b. edelherten, damherten en wilde zwijnen: geweren met ten minste één getrokken loop en kogelpatronen van een
      kaliber van ten minste 6,5 millimeter voor getrokken loop waarvan de trefenergie ten minste 2.200 Joule op 100
      meter afstand van de loopmond bedraagt.

      2 Onverminderd [artikel 3.14, tweede en derde lid][ref3], worden met betrekking tot konijnen en houtduiven
      uitsluitend gebruikt:

      a. hagelpatronen waarvan de korrelgrootte van de hagel een doorsnede van 3,5 millimeter niet overschrijdt, of

      b. kogelpatronen van een kaliber van .22 inch of 5,58 millimeter.

      3 Met betrekking tot hazen, fazanten en wilde eenden worden, onverminderd [artikel 3.14, tweede lid][ref4],
      uitsluitend hagelpatronen gebruikt.


