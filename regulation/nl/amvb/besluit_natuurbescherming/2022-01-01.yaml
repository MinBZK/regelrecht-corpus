  - number: '2.5'
    text: |-
      Als activiteiten van de bouwsector als bedoeld in [artikel 2.9a van de wet][ref1] worden aangewezen:

      a. het verrichten van een bouwactiviteit of een sloopactiviteit die het feitelijk verrichten van bouw- of
      sloopwerkzaamheden aan een bouwwerk betreft, met inbegrip van de daarmee samenhangende vervoersbewegingen;

      b. het aanleggen, veranderen of verwijderen van een werk, met inbegrip van de daarmee samenhangende
      vervoersbewegingen.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel2.9a
