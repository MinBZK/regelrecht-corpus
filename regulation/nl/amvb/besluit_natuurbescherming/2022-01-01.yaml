  - number: '5.14'
    text: |-
      1 In dit artikel wordt onder «beperkingenbesluit» verstaan een aanwijzing als bedoeld in
      [artikel 10, eerste lid][ref1], [12, eerste lid][ref2] of [27 van de Natuurbeschermingswet 1998][ref3] of een
      aanwijzing als bedoeld in [artikel 19][ref4] of [24 van de Flora- en faunawet][ref5], zoals deze wetten golden
      onmiddellijk voor de inwerkingtreding van [artikel 12.1, onderdeel b, onderscheidenlijk c, van de wet][ref6].

      2 Indien een bestuursorgaan met betrekking tot een beperkingenbesluit toepassing heeft gegeven
      aan de [Wet kenbaarheid publiekrechtelijke beperkingen onroerende zaken][ref7], draagt dat
      bestuursorgaan ervoor zorg dat binnen vier dagen na het tijdstip waarop het beperkingenbesluit
      van rechtswege is vervallen een verklaring met betrekking tot het vervallen van de uit dat
      beperkingenbesluit voortvloeiende publiekrechtelijke beperking met overeenkomstige toepassing van
      [artikel 15, eerste lid, van de Wet kenbaarheid publiekrechtelijke beperkingen onroerende zaken][ref8]
      ter inschrijving wordt aangeboden aan de Dienst voor het kadaster en de openbare registers, bedoeld in
      [artikel 2 van de Organisatiewet Kadaster][ref9].

      3 De rechtspersoon waartoe het bestuursorgaan, bedoeld in het tweede lid, behoort, is aansprakelijk voor schade
      die is veroorzaakt door vergissingen, verzuimen, vertragingen of andere onregelmatigheden, door hem of door
      personen voor wier gedragingen hij aansprakelijk is begaan bij de nakoming van de in het tweede lid voorgeschreven
      verplichting.


