  - number: '3.8'
    text: |-
      Bij het aangaan van een huurovereenkomst als bedoeld in [artikel 3.23, eerste lid, onderdeel d, van de wet][ref1]
      mag worden bedongen dat, indien enige onroerende zaak waarop de overeenkomst betrekking heeft, wordt opgenomen in
      een ruilakte als bedoeld in [artikel 81, eerste lid, van de Wet inrichting landelijk gebied][ref2], en deze akte
      voor het einde van de duur van de overeenkomst in de openbare registers is ingeschreven, de huurovereenkomst, voor
      zover het die zaak betreft, eindigt met ingang van de datum waarop deze akte is ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3.23
      [ref2]: https://wetten.overheid.nl/BWBR0020748#Artikel81
