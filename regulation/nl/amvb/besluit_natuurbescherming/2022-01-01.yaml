  - number: '3.17'
    text: |-
      1 De verzekering, bedoeld in [artikel 3.26, eerste lid, onderdeel c, van de wet][ref1], is gesloten met een
      financiële onderneming die ingevolge [artikel 2.48 van de Wet op het financieel toezicht][ref2] in Nederland het
      bedrijf van schadeverzekeraar met beperkte risico-omvang mag uitoefenen.

      2 De verzekering geeft dekking van 1 april tot 1 april van het jaar daaropvolgend en is van kracht voor geheel
      Nederland.

      3 De verzekering dekt de aansprakelijkheid voor een bedrag van ten minste € 1.000.000,– per gebeurtenis.

      4 De polis, bedoeld in [artikel 932 van boek 7 van het Burgerlijk Wetboek][ref3] van de verzekering, bedoeld in
      [artikel 3.26, eerste lid, onderdeel c, van de wet][ref4] bevat in elk geval de volgende gegevens:

      a. naam en adres van de verzekeraar;

      b. naam en adres van de verzekeringnemer;

      c. het polisnummer;

      d. dagtekening en jaar van de ingang en van het einde van de dekking;

      e. de aanduiding van de personen die als verzekerden worden aangemerkt;

      f. het gebied waarin de verzekering van kracht is, en

      g. het verzekerde bedrag.

      5 De korpschef maakt aantekening van de gegevens, bedoeld in het vierde lid.

      6 De houder van de jachtakte meldt elke wijziging van één van de gegevens, bedoeld in het vierde lid, onmiddellijk
      aan de korpschef.

      7 De korpschef verstrekt op verzoek schriftelijke inlichtingen over de nakoming van
      [artikel 3.26, eerste lid, aanhef in samenhang met onderdeel c, van de wet][ref5] voor zover deze blijken uit de
      bijgehouden aantekeningen, bedoeld in het vijfde lid, aan:

      a. Onze Minister en Onze Minister van Veiligheid en Justitie;

      b. de personen belast met de opsporing van de bij of krachtens de [wet][ref6] strafbaar gestelde feiten, en

      c. hen die aannemelijk maken dat zij betrokken zijn bij schade die grond kan opleveren voor toepassing van
      [artikel 3.29 van de wet][ref7].


