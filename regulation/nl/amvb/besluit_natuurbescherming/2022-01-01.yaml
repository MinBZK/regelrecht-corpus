    text: |-
      1 Monitoring voor de omgevingswaarden, bedoeld in [artikel 1.12a van de wet][ref1], en van de tussentijdse
      doelstellingen, bedoeld in [artikel 1.12b, tweede lid, van de wet][ref2] vindt plaats door metingen, berekeningen
      of het op andere wijze verzamelen van gegevens.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld over de uitvoering van de monitoring.


