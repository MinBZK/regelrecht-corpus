    text: |-
      1 Het is verboden mistnetten te vervoeren, te verkopen, te koop aan te bieden, te kopen of onder zich te hebben.

      2 Onder «mistnetten» wordt in het eerste lid verstaan: netten, in banen, aan het stuk of in bepaalde vorm,
      vervaardigd van garens van synthetische of van kunstmatige vezels met een totale dikte van minder van 150 deniers
      (16,2 mg per meter) en waarvan de maaswijdte, gemeten over het garen, van knoop tot knoop, kleiner is dan 35
      millimeter.
    url: https://wetten.overheid.nl/BWBR0038662/2022-01-01#Artikel3.11
  - number: '3.12'
    text: |-
      1 Een jachtveld als bedoeld in [artikel 3.26, eerste lid, onderdeel b, van de wet][ref1], heeft:

      a. een aaneengesloten oppervlakte van ten minste 40 hectare, per jachthouder die in zijn hoedanigheid als
      jachthouder gerechtigd is tot het uitoefenen van de jacht in dat jachtveld, en

      b. zodanige afmetingen dat in het jachtveld een cirkel met een straal van ten minste 150 meter kan worden
      beschreven.

      2 Ingeval het op grond van de bij en krachtens [artikel 3.20, vierde lid, van de wet][ref2] gestelde regels ook
      aan anderen dan de jachthouder, niet zijnde jachtopzichters, is toegestaan om in het desbetreffende jachtveld de
      jacht uit te oefenen, bedraagt de aaneengesloten oppervlakte van dat jachtveld de in het eerste lid, onderdeel a,
      bedoelde oppervlakte vermeerderd met 40 hectare per persoon, niet zijnde jachtopzichter, aan wie het is toegestaan
      in dat jachtveld de jacht uit te oefenen.

      3 Bij de berekening van de oppervlakte, bedoeld in het eerste lid, onderdeel a, en tweede lid, worden niet
      meegerekend:

      a. gronden die zijn gelegen op een afstand van meer dan 350 meter van het middelpunt van een cirkel met een straal
      van 150 meter die het dichtst bij die gronden in het jachtveld kan worden beschreven;

      b. andere gronden dan die, bedoeld in onderdeel a, die van het middelpunt, bedoeld in onderdeel a, uit in rechte
      lijn slechts bereikbaar zijn over grond die tot een ander jachtveld behoort;

      c. openbare, verharde verkeerswegen, niet zijnde grindwegen;

      d. begraafplaatsen, en

      e. bebouwde kommen van de gemeenten als bedoeld in [artikel 3.21, derde lid, van de wet][ref3] en onmiddellijk aan
      die kommen grenzende terreinen.

      4 Als afzonderlijke jachtvelden worden beschouwd, ook ingeval zij grenzen aan gronden waarop het aan dezelfde
      persoon of personen is toegestaan om de jacht uit te oefenen:

      a. gronden als bedoeld in het derde lid, onderdelen a of b;

      b. delen van gronden waarbij de verbinding tussen deze delen op enig punt smaller is dan 50 meter, en

      c. delen van gronden die van elkaar worden gescheiden door een autosnelweg als bedoeld in
      [artikel 1, onderdeel c, van het Reglement verkeersregels en verkeerstekens 1990][ref4] of door een water, breder
      dan 10 meter, indien de jachthouder niet gerechtigd is om daarop de jacht uit te oefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3.26
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel3.20
      [ref3]: https://wetten.overheid.nl/BWBR0037552#Artikel3.21
      [ref4]: https://wetten.overheid.nl/BWBR0004825#Artikel1
