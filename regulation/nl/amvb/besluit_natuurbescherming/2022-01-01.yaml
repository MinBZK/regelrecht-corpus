      1 De munitie die wordt gebruikt in een geweer als bedoeld in [artikel 3.26, eerste lid, van de wet][ref1] voldoet
      aan het tweede of het derde lid.

      2 Hagelpatronen bestaan uit hagelkorrels met een doorsnede van 3,5 millimeter of minder en bevatten geen metallisch
