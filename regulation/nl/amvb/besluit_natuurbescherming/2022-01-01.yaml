  - number: '3.18'
    text: |-
      1 Om door Onze Minister te worden erkend, bevat het jachtexamen:

      a. een theoretisch gedeelte, waarin wordt getoetst op kennis van:

      1°. het wild, bedoeld in [artikel 3.20, tweede lid, van de wet][ref1], en dieren van andere soorten die schade
      kunnen veroorzaken aan gewassen, vee, bossen, bedrijfsmatige visserij en wateren en van hierop gelijkende
      diersoorten;

      2°. de leefomgeving van de in onderdeel a bedoelde diersoorten;

      3°. het beheer van het wild als bedoeld in [artikel 3.20, tweede lid, van de wet][ref2];

      4°. het beheer van het edelhert, de ree, het damhert en het wilde zwijn;

      5°. de belangrijkste wettelijke voorschriften op het terrein van de jacht en de natuurbescherming;

      6°. de belangrijkste wettelijke voorschriften over het voorhanden hebben van geweren en munitie;

      7°. landbouw-, tuinbouw- en bosbouwgewassen die gevoelig zijn voor schade aangericht door dieren van de in
      onderdeel a bedoelde soorten, en de perioden gedurende het jaar waarin zich deze schade kan voordoen;

      8°. de maatregelen die genomen kunnen worden om schade aan landbouw-, tuinbouw- en bosbouwgewassen aangericht door
      dieren van de in onderdeel a bedoelde soorten te voorkomen;

      9°. het geweer, de daarbij gebruikte munitie en het gebruik van het geweer;

      10°. de middelen, genoemd in de [artikelen 3.21, eerste lid, onderdelen b, c, d, e, f, g en h, van de wet][ref3],
      de krachtens [artikel 3.25, eerste en tweede lid, van de wet][ref4] aangewezen middelen en de middelen, genoemd in
      [artikel 3.9][ref5], en het gebruik van deze middelen;

      11°. kennis van de jachtmethoden en van de verzorging van voor consumptie bestemde dieren, en

      12°. kennis van hetgeen een goed jager betaamt.

      b. een praktisch gedeelte, waarin wordt getoetst op schietvaardigheid en bekwaamheid in de omgang met vuurwapens,
      waarbij onderscheid kan worden gemaakt al naar gelang de aard van het gebruik van de munitie.

      2 Bij ministeriële regeling worden nadere regels gesteld aan een jachtexamen om te worden erkend. Deze regels
      hebben in elk geval betrekking op:

      a. de wijze van toetsing van kennis, vaardigheid en bekwaamheid, en

      b. de wijze van beoordeling van examenresultaten.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3.20
