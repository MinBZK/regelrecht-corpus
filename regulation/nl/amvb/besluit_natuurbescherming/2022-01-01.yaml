  - number: '5.15'
    text: |-
      Ontheffingen als bedoeld in
      [artikel 5, tweede lid, van het Besluit vrijstelling beschermde dier- en plantensoorten][ref1] gelden als
      ontheffingen als bedoeld in [artikel 3.40 van de wet][ref2], onder dezelfde voorschriften, beperkingen en
      voorwaarden.


