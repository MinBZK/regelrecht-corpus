  - number: '2.1'
    text: |-
      Het in [artikel 1.12b van de wet][ref1] bedoelde programma stikstofreductie en natuurverbetering bevat voor de
      periode waarvoor het geldt voor de in het programma opgenomen Natura 2000-gebieden een beschrijving van:

      a. de omvang van de stikstofdepositie aan het begin van die periode, onderscheiden naar de bijdrage aan de
      depositie door de belangrijkste sectoren en onderscheiden naar depositie afkomstig uit buitenlandse en binnenlandse
      bronnen;

      b. de mate waarin aan het begin van die periode de instandhoudingsdoelstellingen zijn bereikt voor in ieder geval
      de voor stikstof gevoelige habitats;

      c. de verwachte autonome ontwikkeling van de stikstofemissie door bronnen binnen en buiten de betrokken Natura
      2000-gebieden en de gevolgen daarvan voor de omvang van de stikstofdepositie op de voor stikstof gevoelige
      habitats;

      d. de getroffen of te treffen maatregelen die bijdragen aan:

      1°. vermindering van de stikstofdepositie op de voor stikstof gevoelige habitats;

      2°. het bereiken van de instandhoudingsdoelstellingen voor in ieder geval de voor stikstof gevoelige habitats;

      e. de verwachte sociaal-economische effecten en de weging van de haalbaarheid en betaalbaarheid van de maatregelen,
      bedoeld in onderdeel d;

      f. de verwachte gevolgen van de maatregelen, bedoeld in onderdeel d, voor de omvang van de stikstofdepositie,
      respectievelijk het bereiken van de instandhoudingsdoelstellingen voor in ieder geval de voor stikstof gevoelige
      habitats;

      g. de wijze waarop invulling wordt gegeven aan de in [artikel 2.3][ref2] gestelde eisen aan het verzamelen en
      verstrekken van gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel1.12b
      [ref2]: https://wetten.overheid.nl/BWBR0038662#Artikel2.3
    url: https://wetten.overheid.nl/BWBR0038662/2022-01-01#Artikel2.1
