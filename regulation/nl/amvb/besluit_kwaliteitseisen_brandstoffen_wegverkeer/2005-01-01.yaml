  - number: '9'
    text: Het Besluit loodgehalte benzine wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0010993/2005-01-01#Artikel9
  - number: '10'
    text: |-
      1 Dit besluit treedt in werking met ingang van 1 januari 2000.

      2 De onderdelen a van de [artikelen 3, eerste lid][ref1], en [5, eerste lid][ref2], alsmede de dubbele punt en de
