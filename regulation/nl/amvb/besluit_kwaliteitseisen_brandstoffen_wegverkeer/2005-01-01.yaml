preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 30 juli 1999, nr.
    MJZ 99198855, Centrale Directie Juridische Zaken, Afdeling Wetgeving;


    Gelet op richtlijn 98/70/EG van het Europees Parlement en de Raad van de Europese Unie van 13 oktober 1998
    betreffende de kwaliteit van benzine en van dieselbrandstof en tot wijziging van Richtlijn 93/12/EEG van de Raad
    (PbEG L 350) en op artikel 13 van de Wet inzake de luchtverontreiniging;


    De Raad van State gehoord (advies van 29 oktober 1999, nr. W08.99.0430/V);


    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 15
    december 1999, nr. MJZ 1999257786, Centrale Directie Juridische Zaken, Afdeling Wetgeving;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0010993/2005-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: >-
      In dit besluit wordt verstaan onder:


      a. Onze Minister: Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;


      b. Commissie: Commissie van de Europese Gemeenschappen;


      c. richtlijn: [richtlijn nr. 98/70/EG](31998L0070) van het Europees Parlement en de Raad van de Europese Unie van
      13 oktober 1998 betreffende de kwaliteit van benzine en van dieselbrandstof en tot wijziging van [Richtlijn 93/12/
      EEG](31993L0012) van de Raad (PbEG L 350), zoals deze laatstelijk is gewijzigd bij [richtlijn nr. 2003/17/EG]
      (32003L0017) van het Europees Parlement en de Raad van de Europese Unie van 3 maart 2003 (PbEU L 76);


      d. [richtlijn 70/220/EEG](31970L0220): [richtlijn nr. 70/220/EEG](31970L0220) van de Raad van de Europese
      Gemeenschappen van 20 maart 1970 inzake de onderlinge aanpassing van de wetgevingen der Lid-Staten met betrekking
      tot maatregelen tegen luchtverontreiniging door emissies van motorvoertuigen (PbEG L 76/1), als geldend op 28
      december 1998;


      e. [richtlijn 88/77/EEG](31988L0077): [richtlijn nr. 88/77/EEG](31988L0077) van de Raad van de Europese
      Gemeenschappen van 3 december 1987 inzake de onderlinge aanpassing van de wetgevingen van de Lid-Staten met
      betrekking tot de maatregelen die moeten worden genomen tegen de emissie van gasvormige verontreinigingen door
      dieselmotoren, bestemd voor het aandrijven van voertuigen (PbEG L 036), als geldend op 28 december 1998;


      f. GN-code: code als bedoeld in de [verordening (EEG) nr. 2658/87](31987R2658) van de Raad van de Europese
      Gemeenschappen van 23 juli 1987 met betrekking tot de tarief- en statistieknomenclatuur en het gemeenschappelijk
      douanetarief (PbEG L 256), als geldend op 28 december 1998;


      g. benzine: benzine als bedoeld in artikel 2, onderdeel 1, van de richtlijn;


      h. dieselbrandstof: dieselbrandstof als bedoeld in artikel 2, onderdeel 2, van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0010993/2005-01-01#Artikel1
  - number: '2'
    text: >-
      1 Het is verboden benzine met een loodgehalte van meer dan 0,005 g/l ten verkoop aan te bieden, te verkopen of af
      te leveren.


      2 Het eerste lid is niet van toepassing op benzine die ten verkoop wordt aangeboden, verkocht of afgeleverd aan
      een persoon of met een bestemming voor een persoon die deze naar redelijkerwijs moet worden aangenomen niet in
      Nederland gebruikt.
    url: https://wetten.overheid.nl/BWBR0010993/2005-01-01#Artikel2
  - number: 2a
    text: >-
      Het is met ingang van 1 januari 2009 verboden ongelode benzine of dieselbrandstof met een zwavelgehalte van meer
      dan 10 mg/kg ten verkoop aan te bieden, te verkopen of af te leveren.
    url: https://wetten.overheid.nl/BWBR0010993/2005-01-01#Artikel2a
  - number: '3'
    text: >-
      1 Benzine wordt slechts ten verkoop aangeboden, verkocht of afgeleverd indien de benzine voldoet aan de
      milieutechnische specificaties van bijlage III van de richtlijn.


      2 Het eerste lid is niet van toepassing op benzine die ten verkoop wordt aangeboden, verkocht of afgeleverd aan
      een persoon of met een bestemming voor een persoon die deze naar redelijkerwijs moet worden aangenomen niet in
      Nederland gebruikt.
    url: https://wetten.overheid.nl/BWBR0010993/2005-01-01#Artikel3
  - number: '4'
    text: >-
      1 De zomerperiode, bedoeld in de bijlagen I en III van de richtlijn, loopt elk jaar vanaf 1 mei en duurt tot en met
      30 september van dat jaar.


      2 In afwijking van het eerste lid kan bij regeling van Onze Minister met betrekking tot bepaalde categorieën van
      tankstations een tijdstip, gelegen na 1 mei in een jaar, worden vastgesteld, vanaf welk tijdstip de ten verkoop
      aangeboden benzine aan de specificaties van zomerbenzine voldoet. Dit tijdstip kan afhankelijk worden gesteld van
      het aantal malen dat een bepaalde categorie van tankstations op of na 15 april in dat jaar met zomerbenzine wordt
      bevoorraad.
    url: https://wetten.overheid.nl/BWBR0010993/2005-01-01#Artikel4
  - number: '5'
    text: >-
      1 Dieselbrandstof wordt slechts ten verkoop aangeboden, verkocht of afgeleverd indien de dieselbrandstof voldoet
      aan de milieutechnische specificaties van bijlage IV van de richtlijn.


      2 Het eerste lid is niet van toepassing op dieselbrandstof die ten verkoop wordt aangeboden, verkocht of afgeleverd
      aan een persoon of met een bestemming voor een persoon die deze naar redelijkerwijs moet worden aangenomen niet in
      Nederland gebruikt.
    url: https://wetten.overheid.nl/BWBR0010993/2005-01-01#Artikel5
  - number: '6'
    text: |-
      1 Een wijziging van de richtlijn gaat voor de toepassing van [artikel 1, onderdeel g en h][ref1], gelden met
      ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij ministerieel
      besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.

      2 Een wijziging van de bijlagen I, II, III of IV van de richtlijn gaat voor de toepassing van dit besluit gelden
      met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij
      ministerieel besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0010993#Artikel1
    url: https://wetten.overheid.nl/BWBR0010993/2005-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0010993
        artikel: '1'
  - number: '7'
    text: |-
      1 Indien zich als gevolg van een uitzonderlijke gebeurtenis als bedoeld in artikel 7 van de richtlijn een
      plotselinge verandering in het aanbod van ruwe olie of olieproducten voordoet waardoor met betrekking tot benzine,
      onderscheidenlijk dieselbrandstof, de naleving van de in de [artikelen 3, eerste lid][ref1], onderscheidenlijk
      [5, eerste lid][ref2], bedoelde milieutechnische specificaties redelijkerwijs niet kan worden gevergd, kan Onze
      Minister op aanvraag van een raffinaderij na toestemming van de Commissie ontheffing verlenen van die artikelen.

      2 De aanvraag om een ontheffing bevat in ieder geval de volgende gegevens:

      a. een beschrijving van de desbetreffende uitzonderlijke gebeurtenis en van de plotselinge verandering in het
      aanbod van ruwe olie of olieproducten;

      b. de technische gegevens betreffende de kwaliteit van de aangeboden ruwe olie of olieproducten;

      c. de reden waarom naleving redelijkerwijs niet kan worden gevergd.

      3 Indien de aanvraag naar het oordeel van Onze Minister volledig en voldoende met redenen omkleed is, verzoekt hij
      de Commissie hogere grenswaarden toe te staan dan die volgens de bijlagen bij de richtlijn in acht moeten worden
      genomen.

      4 Nadat het besluit van de Commissie is bekendgemaakt, beslist Onze Minister onverwijld overeenkomstig het besluit
      van de Commissie. Indien de Raad van de Europese Unie in het kader van [artikel 7][ref3], vierde alinea, van de
      richtlijn een andersluidend besluit neemt, beslist Onze Minister nadat het besluit van de Raad van de Europese Unie
      is bekendgemaakt onverwijld overeenkomstig dat besluit, onder gelijktijdige intrekking van het besluit dat hij in
      eerste instantie heeft genomen.

      5 De ontheffing kan onder beperkingen worden verleend. Aan de ontheffing kunnen voorschriften worden verbonden.

      6 De [artikelen 3, eerste lid][ref4], onderscheidenlijk [5, eerste lid][ref5], zijn niet van toepassing op benzine,
      onderscheidenlijk dieselbrandstof, die vervaardigd is met een ontheffing als bedoeld in dit artikel, of, indien
      het benzine, onderscheidenlijk dieselbrandstof, betreft die vervaardigd is in een andere lidstaat van de Europese
      Unie, ten aanzien waarvan door de bevoegde instantie van die lidstaat de procedure van artikel 7 van de richtlijn
      is toegepast en door de Commissie hogere grenswaarden zijn toegestaan.


