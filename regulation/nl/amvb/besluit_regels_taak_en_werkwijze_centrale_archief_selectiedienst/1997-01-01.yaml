  - number: '2'
    text: |-
      1 Er is een Centrale Archief Selectiedienst, die ressorteert onder Onze Minister van Binnenlandse Zaken.

      2 De dienst heeft de status van agentschap en is gevestigd te Winschoten.
    url: https://wetten.overheid.nl/BWBR0008412/1997-01-01#Artikel2
  - number: '3'
    text: |-
      De dienst heeft tot taak om in opdracht van een zorgdrager werkzaamheden te verrichten in verband met
      archiefbewerking.
    url: https://wetten.overheid.nl/BWBR0008412/1997-01-01#Artikel3
  - number: '4'
    text: |-
      1 De dienst verricht werkzaamheden in verband met archiefbewerking op basis van het tussen de dienst en de
      zorgdrager afgesloten raamconvenant.

      2 Het raamconvenant bevat de door de zorgdrager opgegeven kwalitatieve en kwantitatieve specificaties van de te
      bewerken archiefbescheiden en de vermelding van het ten behoeve van de archiefbewerking door Onze Minister van
      Binnenlandse Zaken beschikbaar gestelde budget.

      3 De uit het raamconvenant voortvloeiende werkzaamheden worden per onderdeel van archiefbewerking nader beschreven
      in het projectconvenant.

      4 Het projectconvenant bevat de door de zorgdrager opgegeven kwalitatieve en kwantitatieve specificaties van de te
      bewerken archiefbescheiden per onderdeel van archiefbewerking, een beschrijving van de tussen zorgdrager en dienst
      overeengekomen werkzaamheden in het kader van archiefbewerking en de daaraan verbonden, door Onze Minister van
      Binnenlandse Zaken te vergoeden kosten.

      5 Jaarlijks vindt overleg plaats tussen de dienst en de zorgdrager over de planning en de voortgang van
      archiefbewerking in het kader van de raam- en projectconvenanten.

      6 De dienst kan voor een zorgdrager andere werkzaamheden verrichten in het kader van archiefbewerking dan in
      de raamconvenanten, bedoeld in het eerste lid van dit artikel, aangegeven. Voor dergelijke werkzaamheden is de
      zorgdrager een vergoeding aan de dienst verschuldigd op basis van de integrale kostprijs.
    url: https://wetten.overheid.nl/BWBR0008412/1997-01-01#Artikel4
  - number: '5'
    text: |-
      De dienst kan voor een zorgdrager, vallend onder het regime van de [Archiefwet 1995][ref1] maar niet zijnde een
      Hoog College van Staat, een ministerie of een daaronder ressorterend dienstonderdeel of agentschap, werkzaamheden
      verrichten in het kader van archiefbewerking. Voor dergelijke werkzaamheden is de zorgdrager een vergoeding aan de
      dienst verschuldigd op basis van de integrale kostprijs.


      [ref1]: https://wetten.overheid.nl/BWBR0007376
    url: https://wetten.overheid.nl/BWBR0008412/1997-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007376
  - number: '6'
    text: |-
      1 De bewerkte en voor blijvende bewaring aangewezen archiefbescheiden worden na voltooiing van de werkzaamheden
      naar de zorgdrager teruggezonden of, in opdracht van de zorgdrager, overgebracht naar de bij of krachtens de
      [Archiefwet 1995][ref1] voor de bewaring van die bescheiden aangewezen archiefbewaarplaats.

      2 De voor vernietiging in aanmerking komende archiefbescheiden worden na voltooiing van de werkzaamheden aan
      de zorgdrager teruggezonden of, in opdracht van de zorgdrager, ter vernietiging overgedragen aan een daarvoor
      aangewezen instelling met inachtneming van de daarvoor in de archiefwetgeving voorgeschreven procedure.


      [ref1]: https://wetten.overheid.nl/BWBR0007376
    url: https://wetten.overheid.nl/BWBR0008412/1997-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007376
  - number: '7'
    text: |-
      Het besluit van 17 juli 1989, *Stb.* 365, houdende nieuwe regels met betrekking tot taak en werkwijze van de
      Centrale Archief Selectiedienst, wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0008412/1997-01-01#Artikel7
  - number: '8'
    text: Dit besluit treedt in werking met ingang van 1 januari 1997.
    url: https://wetten.overheid.nl/BWBR0008412/1997-01-01#Artikel8
