  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Binnenlandse Zaken van 4 december 1996, nr. CPZ96/1/12, directoraat-
    generaal Openbaar Bestuur;

    Gelet op de artikelen 3 en 23, eerste lid, van de Archiefwet 1995 (Stb. 313);

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008412/1997-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Dit besluit verstaat onder:

      «de dienst»: de dienst bedoeld in [artikel 2][ref1];

      «archiefbewerking»: het geheel van activiteiten gericht op het realiseren van de bij
      [artikel 3 van de Archiefwet 1995][ref2] aan overheidsorganen gestelde verplichting de onder hen berustende
      archiefbescheiden in goede, geordende en toegankelijke staat te brengen en te bewaren, alsmede zorg te dragen voor
      de vernietiging van de daarvoor in aanmerking komende archiefbescheiden;

      «zorgdrager»: een Hoog College van Staat, een ministerie of een daaronder ressorterend dienstonderdeel of
      agentschap dat bij de [Archiefwet 1995][ref3] is belast met de zorg voor de archiefbescheiden, alsmede, ingeval
      [artikel 5][ref4] van toepassing is, een ander orgaan van een rechtspersoon die krachtens publiekrecht is ingesteld
      of een ander persoon of college met enig openbaar gezag bekleed en bij [Archiefwet 1995][ref5] belast met de zorg
      voor de archiefbescheiden.


