        bwb_id: BWBR0005537
        artikel: 5:18
  - number: '30'
    text: |-
      1 Meetmiddelen welke wegens hun samenstelling of in verband met het doel, waarvoor zij zijn bestemd, enigerlei
      beperking in hun gebruik of in de wijze van meten of wegen vereisen, moeten een opschrift dragen, waaruit van die
      beperkte bestemming blijkt, behoudens voor zover Onze Minister anders bepaalt.

      2 Onze Minister kan dienaangaande nadere voorschriften geven.
    url: https://wetten.overheid.nl/BWBR0003165/1998-09-11#Artikel30
  - number: '31'
    text: |-
      1 Alle bij of krachtens de [IJkwet][ref1] voorgeschreven aanduidingen en opschriften moeten duidelijk,
      ondubbelzinning en duurzaam zijn. Onze Minister kan ter uitvoering van een bijzondere richtlijn regelen stellen ten
      aanzien van aanduidingen en opschriften.

      2 De in het eerste lid bedoelde aanduidingen en opschriften, die van metrologische aard zijn en in een taal zijn
      weergegeven, moeten in de Nederlandse taal zijn gesteld; op meetmiddelen vermelde of door middel van meetmiddelen
      zichtbaar gemaakte aanduidingen van geldrekeneenheden moeten ten minste de aanduidingen van de Nederlandse
      munteenheid zijn.

      3 In afwijking van het tweede lid moeten de aanduidingen en opschriften op meetmiddelen, ten aanzien waarvan
      aannemelijk kan worden gemaakt dat zij voor uitvoer naar een andere EER-Staat bestemd zijn, en aanduidingen, die
      door middel van die meetmiddelen zichtbaar gemaakt worden, in overeenstemming zijn met de wettelijke bepalingen van
      die EER-Staat.


      [ref1]: https://wetten.overheid.nl/BWBR0009082
    url: https://wetten.overheid.nl/BWBR0003165/1998-09-11#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0009082
  - number: '32'
    text: |-
      1 Het bij de artikelen 33 en 34 bepaalde geldt uitsluitend ten aanzien van de bij artikel 2, eerste lid, aangewezen
      meetmiddelen:

      a. die EEG-geijkte meetmiddelen zijn, of

      b. die kennelijk EEG-geijkte meetmiddelen zijn geweest.

      2 Het bij de artikelen 33 en 34 bepaalde geldt niet ten aanzien van de meetmiddelen, aangewezen bij artikel 2,
      eerste lid, onder *c*, 2°, en *e*, 3° en 4°.
    url: https://wetten.overheid.nl/BWBR0003165/1998-09-11#Artikel32
  - number: '33'
    text: |-
      1 Meetmiddelen mogen uitsluitend worden gebruikt voor metingen en wegingen overeenkomstig hun bestemming.

      2 Niet-automatische weegwerktuigen voor grove weging mogen uitsluitend worden gebruikt:

      a. voor het bepalen in postkantoren van de vervoerkosten van postpakketten;

      b. voor het bepalen, op terreinen van ondernemingen tot exploitatie van middelen van openbaar vervoer, van de
      vervoerkosten van goederen;

      c. voor het wegen in mortelfabrieken van asfaltbeton, betonmortel, metselspecie en soortgelijke produkten, alsmede
      voor het in die fabrieken bij de vervaardiging van die produkten wegen van de materialen, waaruit die produkten
      worden samengesteld;

      d. voor het wegen van afvalstoffen en van zand, grind en aarde.

      3 Onder afvalstoffen wordt verstaan: alle stoffen, preparaten of andere produkten waarvan de houder - met het oog
      op de verwijdering daarvan - zich ontdoet, voornemens is zich te ontdoen of zich moet ontdoen.

      4 De gewichten, aangewezen bij artikel 2, eerste lid, onder *b*, 1°, en de niet-automatische weegwerktuigen voor
      gewone weging, mogen uitsluitend worden gebruikt voor andere wegingen dan de weging van edele metalen, parels,
      edelgesteenten en munten.

      5 Meetmiddelen, ten aanzien waarvan toepassing is gegeven aan artikel 6, derde lid, onder *b*, mogen uitsluitend
      worden gebruikt met inachtneming van de beperking, onder welke de EEG-modelgoedkeuring voor het model als in
      artikel 6, eerste lid, bedoeld, is verleend.
    url: https://wetten.overheid.nl/BWBR0003165/1998-09-11#Artikel33
  - number: '34'
    text: |-
      1 Metingen of wegingen met een meet- of weegwerktuig of meetinstrument waarbij de wijze van opstelling van belang
      is voor de nauwkeurigheid van de meting of weging, mogen slechts worden verricht, indien het meet- of weegwerktuig
      of meetinstrument volgens aanwijzing van een daartoe aanwezige inrichting op de juiste wijze is opgesteld.

      2 Meet- en weegwerktuigen als bedoeld in het eerste lid, aanwezig op plaatsen van verkoop aan particulieren van
      goederen, die bij de maat of het gewicht worden verkocht, moeten volgens aanwijzing van de daartoe aanwezige
      inrichting juist zijn opgesteld.

      3 Weegwerktuigen moeten, alvorens daarmede gewogen wordt, onbelast in de juiste evenwichtsstand worden gebracht,
      indien de evenwichtsstand van het onbelaste weegwerktuig van belang is voor de juistheid van het weegresultaat.

      4 Weegwerktuigen, aanwezig op plaatsen, bedoeld in het tweede lid, moeten onbelast in de juiste evenwichtsstand
      verkeren.

      5 Meet- en weegwerktuigen, aanwezig op plaatsen, bedoeld in het tweede lid, moeten zodanig zijn opgesteld, dat de
      koper de aanwijzing van het betrokken meet- of weegwerktuig onbelemmerd kan waarnemen.
    url: https://wetten.overheid.nl/BWBR0003165/1998-09-11#Artikel34
  - number: '35'
    text: |-
      1 De artikelen 7, eerste lid, onder *b*, 8, eerste lid, onder *b*, en 10 tot en met 16 van de wet gelden niet ten
      aanzien van de meetmiddelen, aangewezen bij artikel 2, eerste lid, onder *c*, 2°.

      2 Ten aanzien van meetmiddelen, aangewezen bij artikel 2, eerste lid, onder *e*, 3°, gelden de artikelen 10 tot en
      met 16 van de wet niet; artikel 8, eerste lid, onder *b*, van de wet geldt niet ten aanzien van deze meetmiddelen
      die EEG-geijkte meetmiddelen zijn.

      3 De artikelen 10 tot en met 16 van de wet gelden niet ten aanzien van meetmiddelen, aangewezen bij artikel 2,
      eerste lid, onder *e*, 4°.
    url: https://wetten.overheid.nl/BWBR0003165/1998-09-11#Artikel35
  - number: '36'
    text: |-
      1 Voor de toepassing van artikel 11, vierde lid, van de wet en de daarop berustende bepalingen wordt een EEG-
      geijkt meetmiddel aangemerkt als een meetmiddel, dat de keuring, bedoeld in artikel 10, eerste lid, van de wet
      heeft ondergaan.

      2 Het eerste lid geldt niet ten aanzien van meetmiddelen, aangewezen bij artikel 2, eerste lid, onder *c*, 4°.
    url: https://wetten.overheid.nl/BWBR0003165/1998-09-11#Artikel36
  - number: '37'
    text: |-
      Artikel 11, eerste tot en met derde lid, van de wet en het ten aanzien van de keuring en het daarbij aanbrengen van
      ijkmerken in de artikelen 13, eerste en tweede lid, en 14, eerste lid, van de wet bepaalde gelden niet ten aanzien
      van een bij artikel 2, eerste lid, onder *a*, *b*, *c*, 1°, 3°, 4°, 5° of 6°, *d* of *e*, 2°, aangewezen meetmiddel
      dat een EEG-geijkt meetmiddel is.
    url: https://wetten.overheid.nl/BWBR0003165/1998-09-11#Artikel37
  - number: '38'
    text: |-
      1 Van de herkeuring, bedoeld in artikel 11, vierde lid, onder *a*, van de wet, zijn vrijgesteld de bij artikel 2,
      eerste lid, van het onderhavige besluit aangewezen meetmiddelen, die EEG-geijkte meetmiddelen zijn of die kennelijk
      EEG-geijkte meetmiddelen zijn geweest, een en ander met uitzondering van de meetmiddelen aangewezen bij artikel 2,
      eerste lid, onder *b.* en onder *c*, 6°.

      2 De herkeuring, bedoeld in artikel 11, vierde lid, onder *a*, van de wet, geschiedt bij taxameters, aangewezen in
      artikel 2, eerste lid, onder *c*, 6°, niet eerder dan na verloop van twee jaren na goedkeuring van de taxameter bij
      de eerste EEG-ijk.

      3 Onze Minister kan regelen stellen omtrent de gegevens, die ten aanzien van meetmiddelen, die EEG-geijkte
      meetmiddelen zijn of kennelijk EEG-geijkte meetmiddelen zijn geweest, bij de aanvraag tot de in artikel 11, vierde
      lid, van de wet bedoelde herkeuring moeten worden overgelegd, en kan bepalen, dat vorenomschreven meetmiddelen,
      ten aanzien waarvan toepassing is gegeven aan artikel 18, zevende lid, onder *a*, voor die herkeuring moeten worden
      aangeboden in de verpakking, waarin zij voor de eerste EEG-ijk zijn aangeboden.

      4 Ten aanzien van de herkeuring van de bij artikel 2, eerste lid, onder *b*, aangewezen meetmiddelen is het
      bepaalde in [artikel 11 van het IJkreglement][ref1] van toepassing.

      5 Ten aanzien van bij artikel 2, eerste lid, onder *b*, aangewezen meetmiddelen, die EEG-geijkte meetmiddelen zijn
      of kennelijk EEG-geijkte meetmiddelen zijn geweest, en ter voldoening aan artikel 11, vierde lid, onder *a*, van de
      wet ter herkeuring worden aangeboden, is het bepaalde in de [artikelen 12][ref2] en [15 van het IJkreglement][ref3]
      van overeenkomstige toepassing.

      6 Onze Minister kan regelen stellen omtrent de voor de herkeuring door de aanvrager daarvan of de eigenaar of de
      houder van het betrokken meetmiddel te verlenen medewerking.

      7 Onverminderd artikel 25 van de wet kan de herkeuring van meetmiddelen, die EEG-geijkte meetmiddelen zijn of
      kennelijk EEG-geijkte meetmiddelen zijn geweest, worden geweigerd of beëindigd, indien de aanvrager niet voldoet
      aan de krachtens het tweede lid gestelde regelen.


