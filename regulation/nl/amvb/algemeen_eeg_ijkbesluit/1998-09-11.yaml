  - number: '10'
    text: |-
      1 Degene op wiens naam het certificaat van EEG-modelgoedkeuring is gesteld, is met uitsluiting van ieder
      ander gerechtigd in de periode, waarin de EEG-modelgoedkeuring geldt voor het model of de modellen, waarop dat
      certificaat betrekking heeft, het met betrekking tot dat model of die modellen vastgestelde en in dat certificaat
      opgenomen EEG-modelgoedkeuringsteken aan te brengen op meetmiddelen, die naar dat model of een van die modellen
      zijn vervaardigd.

      2 Het is ieder ander dan de ingevolge het eerste lid gerechtigde verboden het EEG-modelgoedkeuringsteken, dat voor
      die gerechtigde is vastgesteld en in het op diens naam gestelde certificaat van EEG-modelgoedkeuring is opgenomen,
      op meetmiddelen aan te brengen.
    url: https://wetten.overheid.nl/BWBR0003165/1998-09-11#Artikel10
  - number: '11'
    text: |-
      1 Behoudens het bepaalde bij of krachtens de [artikelen 6][ref1], derde lid, onder *c*, en vierde lid, en
      [12][ref2], is de geldigheidsduur van de EEG-modelgoedkeuring tien jaar.

      2 In afwijking van het eerste lid wordt de EEG-modelgoedkeuring verleend voor een periode die eindigt tien jaar na
      de eerste dagtekening van het certificaat van EEG-modelgoedkeuring, indien het betreft een model van een variant
      als in [artikel 8][ref3], eerste lid, bedoeld.

      3 De geldigheidsduur van de EEG-modelgoedkeuring voor een model ten aanzien waarvan een certificaat van aanvullende
      EEG-modelgoedkeuring als in [artikel 8][ref4], eerste lid, bedoeld, is afgegeven, wordt gerekend van de dagtekening
      van dat certificaat af; ten aanzien van elk ander model wordt de geldigheidsduur van de EEG-modelgoedkeuring
      gerekend van de eerste dagtekening van het certificaat van EEG-modelgoedkeuring af.

      4 Op een daartoe strekkend schriftelijk verzoek van degene op wiens naam het certificaat van EEG-modelgoedkeuring
      is gesteld, wordt de geldigheidsduur van een EEG-modelgoedkeuring, waarop dat certificaat betrekking heeft,
      telkenmale met een periode van tien jaar verlengd, mits dat verzoek wordt ingediend bij de ijkinstelling binnen een
      tijdvak, aanvangende een jaar en eindigende zes maanden voor de einddatum van de lopende geldigheidsduur.

      5 De geldigheidsduur van de EEG-modelgoedkeuring wordt echter niet verlengd, indien ten tijde van de beslissing op
      de aanvraag ten aanzien van de betrokken meetmiddelen:

      a. zodanig gewijzigde algemene ijktechnische voorschriften gelden, dat onder de werking daarvan een EEG-
      modelgoedkeuring voor het betrokken model niet zou zijn verleend, of

      b. ter uitvoering van een bekendgemaakte bijzondere richtlijn erin is of moet worden voorzien, dat uiterlijk
      met ingang van de dag, volgende op de einddatum van de lopende geldigheidsduur van de EEG-modelgoedkeuring een
      zodanige wijziging van de algemene ijktechnische voorschriften in werking is getreden, dat onder de werking van die
      voorschriften de betrokken EEG-modelgoedkeuring niet zou zijn verleend.

      6 Onze Minister kan in afwijking van het vierde lid bepalen dat de geldigheidsduur van een EEG-modelgoedkeuring met
      betrekking tot een model als bedoeld in [artikel 6][ref5], eerste lid, niet wordt verlengd of slechts eenmaal wordt
      verlengd voor een door hem vastgestelde periode.

      7 Ten aanzien van de verlenging van de geldigheidsduur van een EEG-modelgoedkeuring van een model als bedoeld in
      [artikel 6][ref6], eerste lid, is [artikel 6][ref7], tweede, derde, vierde, vijfde, zevende en achtste lid, van
      overeenkomstige toepassing.

      8 Op het verzoek tot verlenging van de EEG-modelgoedkeuring beslist de ijkinstelling zo spoedig mogelijk na afloop
      van het in het vierde lid bedoelde tijdvak doch vóór de einddatum van de lopende geldigheidsduur. Dit besluit van
      de ijkinstelling wordt de betrokkene schriftelijk medegedeeld.


