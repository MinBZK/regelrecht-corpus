articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      wet: de [IJkwet][ref1] (*Stb.* 1989, 10);

      kaderrichtlijn: de richtlijn van de Raad van de Europese Gemeenschappen van 26 juli 1971 inzake de onderlinge
      aanpassing van de wetgevingen der Lid-Staten betreffende voor meetmiddelen en metrologische controlemethoden
      geldende algemene bepalingen, nr. 71/316/EEG (*Pb. E.G.* L 202);

      bijzondere richtlijn: een richtlijn - niet zijnde de kaderrichtlijn - van de Raad van de Europese Gemeenschappen of
      van de Commissie van de Europese Gemeenschappen;

      meetmiddel: een maat, een gewicht, een meet- of weegwerktuig of een meetinstrument;

      afzonderlijk onderdeel of afzonderlijke hulpinrichting: een onderdeel, dat of een hulpinrichting, die bestemd is om
      in een meetmiddel te worden ingebouwd of aan een meetmiddel te worden toegevoegd;

      andere EER-Staat: een Lid-Staat van de Europese Unie alsmede een andere Staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte, niet zijnde het Koninkrijk der Nederlanden;

      algemene ijktechnische voorschriften: de voorschriften, die bij artikel 6, eerste tot en met vierde lid, van de wet
      en bij of krachtens de artikelen [26][ref2], [27][ref3], [28][ref4], [30][ref5], [31][ref6] en [38][ref7], vierde
      lid, van het onderhavige besluit zijn gegeven;

      specifieke ijktechnische voorschriften: de door de ijkinstelling of door of vanwege een andere Lid-Staat
      bij de EEG-modelgoedkeuring vastgestelde voorschriften, die zijn opgenomen in het certificaat van EEG-
      modelgoedkeuring, bedoeld in [artikel 7][ref8], eerste lid, [artikel 14][ref9], eerste lid, of in verband daarmede
      [artikel 15][ref10], derde lid;

      bijzondere ijktechnische voorschriften: de algemene ijktechnische voorschriften, die bij artikel 6, eerste tot en
      met vierde lid, van de wet en bij de [artikelen 26][ref11], [27][ref12], [28][ref13], eerste en derde tot en met
      vijfde lid, [30][ref14], [31][ref15] en [38][ref16], vierde lid, van het onderhavige besluit zijn gegeven, en de
      krachtens [artikel 28][ref17], tweede lid, gestelde eisen ten aanzien van de maximaal toelaatbare fouten, alsmede
      de specifieke ijktechnische voorschriften.


