    text: |-
      1 De meetmiddelen ten aanzien waarvan op een daartoe strekkende aanvraag EEG-keuring wordt toegepast, zijn:

      a. *maten:* de stoffelijke lengtematen;

      b. gewichten:

      1°. de gewichten voor gewone weging,

      2°. de gewichten, die een grotere nauwkeurigheid hebben dan de gewichten voor gewone weging, met uitzondering van
      de metriekkaraatgewichten;

      c. meetwerktuigen:

      1°. de balgen-, rotor- en schoepenradgasmeters,

      2°. de koudwatermeters en warmwatermeters, met uitzondering van warmwatermeters die bestemd zijn om te worden
      ingebouwd in een systeem voor overbrenging van thermische energie of die van elektronische inrichtingen zijn
      voorzien,

      3°. de meetinstallaties voor andere vloeistoffen dan water, uitgerust met volumemeters, waarin de vloeistof de
      beweging van wanden van meetkamers veroorzaakt, voor zover dit zijn:

      I. benzinepompen, met uitzondering van benzinepompen, die verschillende soorten brandstof mengen, brandstof
      en olie mengen, voorzien zijn van elektrische of elektronische aanwijs- of hulpinrichtingen, voorzien zijn van
      zelfbedieningsinrichtingen of bestemd zijn voor meting van vloeibaar gas,

      II. meetinstallaties op tankauto’s voor vervoer over de weg, bestemd voor afgifte van bij atmosferische druk
      opgeslagen vloeistof met een viscositeit van ten hoogste 20 mPa.s, uitgezonderd vloeistoffen voor menselijke
      consumptie,

      III. meetinstallaties, bestemd voor meting van melk,

      IV. andere dan onder III aangewezen meetinstallaties, bestemd voor ontvangst van vloeistoffen bij het lossen van
      tankschepen, tankwagons en tankauto's, of

      V. vast opgestelde of op tankauto’s gemonteerde meetinstallaties - niet zijnde benzinepompen - bestemd voor meting
      van vloeibare gassen, uitgezonderd cryogene vloeistoffen,

      4°. de meetreservoirs in schepen voor de binnenvaart of de kustvaart,

      5°. de toestellen, bestemd voor de meting van het natuurgewicht van granen,

      6°. de taxameters, met uitzondering van elektronische taxameters;

      d. weegwerktuigen:

      1°. de automatische weegwerktuigen, uitgevoerd als continu totaliserende bandwegers,

      2°. de automatische weegwerktuigen, uitgevoerd als gewichtscontrolemachines of als gewichtssorteermachines, met
      uitzondering van de weegwerktuigen welke een of meer elektronische onderdelen bezitten, en de eiersorteermachines;

      e. meetinstrumenten:

      1°.

      2°. de inductieve kilowattuurmeters voor rechtstreekse netaansluiting, ingericht voor het meten van de actieve
      energie in wissel- of draaistroom met een frequentie van 50 Hz, met uitzondering van de overschrijdingsmeters en de
      meters met maximumaanwijzing,

      3°. de alcoholmeters en areometers voor alcohol, bestemd ter bepaling van het alcoholvolumegehalte of het
      alcoholmassagehalte van een mengsel van water en alcohol,

      4°. de manometers voor luchtbanden van automobielen.

      2 De EEG-keuring omvat de volgende vormen van onderzoek:

      a. het onderzoek tot EEG-modelgoedkeuring;

      b. de eerste EEG-ijk.

      3 Het bepaalde in het tweede lid, onder *a*, geldt niet ten aanzien van:

      a. de meetmiddelen, die in het eerste lid, onder *b*, 1° en 2°, en *c*, 3°, sub IV, en 4°, zijn aangewezen, de in
      dat lid, onder *c*, 3°, sub III, aangewezen meetinstallaties, voor zover zij bestemd zijn voor afgifte van melk, en
      de in dat lid, onder *c*, 3°, sub V, aangewezen meetinstallaties, voor zover zij vast zijn opgesteld;

      b. de niet-automatische weegwerktuigen voor gewone of grove weging, voor zover deze behoren tot een door Onze
      Minister aangewezen categorie en van een door hem omschreven samenstelling zijn.
    url: https://wetten.overheid.nl/BWBR0003165/1998-09-11#Artikel2
  - number: '3'
    text: |-
      1 Voor het model van een meetmiddel wordt de EEG-modelgoedkeuring niet verleend, indien niet de redelijke
      verwachting bestaat dat naar dat model vervaardigde meetmiddelen zullen voldoen aan de daarvoor gegeven algemene
      ijktechnische voorschriften.

      2 Het model wordt, tenzij door Onze Minister anders is bepaald, vertegenwoordigd door een exemplaar van het
      betrokken meetmiddel.

      3 Het onderzoek tot EEG-modelgoedkeuring omvat de bestudering van de aanvraag en van de bescheiden, die de aanvraag
      vergezellen en - voor zover het model wordt vertegenwoordigd door een of meer voorwerpen - een onderzoek van de
      metrologische eigenschappen daarvan.
    url: https://wetten.overheid.nl/BWBR0003165/1998-09-11#Artikel3
  - number: '4'
    text: |-
      1 Een onderzoek tot EEG-modelgoedkeuring van een model van een meetmiddel geschiedt uitsluitend op aanvraag van de
      fabrikant van dat meetmiddel of zijn in Nederland of een andere EER-Staat gevestigde gemachtigde.

      2 De aanvraag bevat de door Onze Minister vastgestelde gegevens die het betrokken model kenmerken, alsmede die
      welke nodig zijn voor de identificatie van de aanvrager.

      3 Onze Minister stelt regelen omtrent het aantal afschriften van de aanvraag en omtrent de op het model of op
      de daarnaar vervaardigde of te vervaardigen meetmiddelen betrekking hebbende bescheiden, die de aanvraag moeten
      vergezellen, en het aantal van laatstbedoelde bescheiden; Onze Minister kan bepalen, dat een of meer maquettes van
      naar het model vervaardigde of te vervaardigen meetmiddelen of van onderdelen van zodanige meetmiddelen de aanvraag
      moeten vergezellen.

      4 Een aanvraag tot het onderzoek tot EEG-modelgoedkeuring wordt niet in behandeling genomen, zolang niet is voldaan
      aan het tweede lid en de krachtens het derde lid gestelde regelen of indien is gebleken dat een aanvraag van de
      betrokkene tot het onderzoek tot EEG-modelgoedkeuring voor hetzelfde model in een andere EER-Staat aanhangig is.

      5 De aanvrager van het onderzoek tot EEG-modelgoedkeuring is verplicht de ijkinstelling in de gelegenheid te
      stellen de exemplaren van het naar het model vervaardigde meetmiddel te onderzoeken die naar het oordeel van die
      instelling, met inachtneming van daaromtrent door Onze Minister gestelde regelen, voor een deugdelijk onderzoek
      nodig zijn.
    url: https://wetten.overheid.nl/BWBR0003165/1998-09-11#Artikel4
  - number: '5'
    text: |-
      1 Onze Minister kan met betrekking tot door hem aangewezen categorieën van meetmiddelen de plaats bepalen waar het
      onderzoek tot EEG-modelgoedkeuring geschiedt.

      2 Onze Minister kan regelen stellen omtrent voor het onderzoek tot EEG-modelgoedkeuring door de aanvrager te
      verlenen medewerking.

      3 Onverminderd artikel 25, eerste lid, van de wet, kan het onderzoek tot EEG-modelgoedkeuring worden geweigerd
      of beëindigd, indien blijkt, dat een aanvraag van de betrokkene tot het onderzoek tot EEG-modelgoedkeuring voor
      hetzelfde model in een andere EER-Staat aanhangig is.
    url: https://wetten.overheid.nl/BWBR0003165/1998-09-11#Artikel5
  - number: '6'
    text: |-
      1 In afwijking van [artikel 3][ref1], eerste lid, kan de EEG-modelgoedkeuring worden verleend voor een model
      van een meetmiddel bij de vervaardiging waarvan nieuwe technieken die niet zijn voorzien in de voor de betrokken
      categorie meetmiddelen krachtens [artikel 28][ref2], tweede lid, gegeven algemene ijktechnische voorschriften,
      worden toegepast, ten gevolge waarvan het betrokken meetmiddel niet kan voldoen aan die voorschriften.

      2 Voor een model als bedoeld in het eerste lid kan de EEG-modelgoedkeuring niet worden verleend dan met
      verbinding daaraan van het voorschrift dat de plaatsen van opstelling van naar het model vervaardigde meetmiddelen
      schriftelijk aan de ijkinstelling moeten worden medegedeeld.

      3 Voor een model als bedoeld in het eerste lid kan de EEG-modelgoedkeuring worden verleend onder beperking:

      a. van het aantal meetmiddelen, dat bij de eerste EEG-ijk kan worden goedgekeurd,

      b. van het gebruik van naar het model vervaardigde meetmiddelen of

      c. van de in [artikel 11][ref3], eerste lid, bepaalde geldigheidsduur van die EEG-modelgoedkeuring.

      4 Onze Minister kan in afwijking van het derde lid ten aanzien van een door hem aangewezen categorie van
      meetmiddelen bepalen, dat de EEG-modelgoedkeuring voor een model als bedoeld in het eerste lid niet kan worden
      verleend dan onder één of meer van de door hem daartoe aangewezen beperkingen, bedoeld in het derde lid, en kan
      daarbij regelen omtrent de omvang van die beperkingen stellen.

      5 Bij de EEG-modelgoedkeuring van een model als bedoeld in het eerste lid worden door de ijkinstelling in verband
      met de nieuwe technieken die bij de vervaardiging van de betrokken meetmiddelen worden toegepast, specifieke
      ijktechnische voorschriften gesteld, waaraan naar dat model vervaardigde meetmiddelen moeten voldoen.

      6 Voor een model als bedoeld in het eerste lid wordt de EEG-modelgoedkeuring niet verleend, indien niet de
      redelijke verwachting bestaat dat naar dat model vervaardigde meetmiddelen zullen beantwoorden aan het ter zake
      van de maximaal toelaatbare fouten bepaalde in de voor de betrokken categorie meetmiddelen gegeven algemene
      ijktechnische voorschriften.

      7 Voor een model van een meetmiddel als bedoeld in het eerste lid wordt de EEG-modelgoedkeuring niet verleend dan
      na overleg met de bevoegde organen van de andere EER-Staten.

      8 Het voorschrift en de beperkingen, bedoeld in het tweede en derde lid, en de specifieke ijktechnische
      voorschriften bedoeld in het vijfde lid, worden onderscheidenlijk ingetrokken of opgeheven, zodra de redelijke
      verwachting als in [artikel 3][ref4] bedoeld kan worden uitgesproken. De ijkinstelling deelt een zodanig besluit
      schriftelijk mede aan degene op wiens naam het met betrekking tot het goedgekeurde model afgegeven certificaat van
      EEG-modelgoedkeuring als in [artikel 7][ref5], eerste lid, bedoeld is gesteld; die mededeling wordt vervat in een
      aanvulling op dat certificaat.


