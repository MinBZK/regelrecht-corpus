  - number: '12'
    text: |-
      1 Een EEG-modelgoedkeuring wordt ingetrokken, indien aan de ijkinstelling uit een onderzoek blijkt dat de naar
      het goedgekeurde model vervaardigde meetmiddelen bij gebruik gebreken van algemene aard vertonen, welke die
      meetmiddelen ongeschikt maken voor hun doel.

      2 Een EEG-modelgoedkeuring kan worden ingetrokken, indien aan de ijkinstelling:

      a. blijkt dat degene op wiens naam het certificaat van EEG-modelgoedkeuring is gesteld, het met betrekking tot het
      desbetreffende model vastgestelde EEG-modelgoedkeuringsteken heeft aangebracht op meetmiddelen die niet naar het
      goedgekeurde model zijn vervaardigd;

      b. blijkt dat naar het goedgekeurde model vervaardigde meetmiddelen niet voldoen aan de daarvoor gegeven algemene
      of bijzondere ijktechnische voorschriften;

      c. blijkt dat het voorschrift of de beperkingen, die ingevolge [artikel 6][ref1], tweede lid, derde lid, onder *a*
      of *b*, of [artikel 11][ref2], zevende lid, aan de EEG-modelgoedkeuring zijn verbonden, niet zijn nageleefd of in
      acht genomen;

      d. blijkt dat de EEG-modelgoedkeuring ten onrechte is verleend;

      e. door het bevoegde orgaan van een andere EER-Staat schriftelijk is medegedeeld dat is gebleken van feiten als
      omschreven in het eerste lid of in het onderhavige lid, onder *a, b, c* of d.

      3 In een geval als in het tweede lid, onder *e*, bedoeld vindt de intrekking van een EEG-modelgoedkeuring niet
      plaats dan na overleg van de ijkinstelling met het bevoegde orgaan van de betrokken EER-Staat.

      4 Indien een EEG-modelgoedkeuring wordt ingetrokken op een tijdstip, waarop ingevolge [artikel 11][ref3] reeds voor
      de betrokkene die EEG-modelgoedkeuring is verlengd met ingang van een na dat tijdstip liggende datum, vervalt die
      verlenging van rechtswege.


      [ref1]: https://wetten.overheid.nl/BWBR0003165#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003165#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0003165#Artikel11
