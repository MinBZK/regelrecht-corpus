  - number: '8'
    text: |-
      1 Indien een aanvrager het onderzoek tot EEG-modelgoedkeuring heeft verzocht voor een meetmiddel, dat naar het
      oordeel van de ijkinstelling een variant is van een meetmiddel, waarvoor blijkens een door de ijkinstelling
      aan die aanvrager afgegeven certificaat een EEG-modelgoedkeuring geldt, wordt bij goedkeuring van het betrokken
      model, in afwijking van [artikel 7][ref1], eerste lid, van die EEG-modelgoedkeuring aan de aanvrager een op diens
      naam gesteld, gedagtekend en ondertekend certificaat van aanvullende EEG-modelgoedkeuring door de ijkinstelling
      afgegeven.

      2 Het EEG-modelgoedkeuringsteken, opgenomen in het in het eerste lid bedoelde certificaat van EEG-modelgoedkeuring,
      wordt met ingang van de dagtekening van het in dat lid bedoelde certificaat van aanvullende EEG-modelgoedkeuring
      geacht door de ijkinstelling voor de aanvrager mede met betrekking tot het goedgekeurde model van de variant te
      zijn vastgesteld.

      3 Ten aanzien van het certificaat van aanvullende EEG-modelgoedkeuring is [artikel 7][ref2], tweede lid, onder *a*
      en *d*, derde en vierde lid, van overeenkomstige toepassing.

      4 Onze Minister stelt het model van het certificaat van aanvullende EEG-modelgoedkeuring vast.

      5 Het eerste lid is niet van toepassing indien het verzoek van de aanvrager betreft:

      a. een meetmiddel, dat naar het oordeel van de ijkinstelling een variant is van een meetmiddel met betrekking
      waartoe een ingevolge [artikel 6][ref3], eerste lid, verleende EEG-modelgoedkeuring geldt;

      b. een meetmiddel als bedoeld in [artikel 6][ref4], eerste lid, of

      c. een meetmiddel dat bij het onderzoek tot EEG-modelgoedkeuring moet worden getoetst aan algemene ijktechnische
      voorschriften die ten gevolge van wijziging daarvan zodanig afwijken van de voorschriften, welke golden op de datum
      van dagtekening van het reeds aan de aanvrager afgegeven certificaat van EEG-modelgoedkeuring, dat het betrokken
      meetmiddel niet tevens aan laatstbedoelde voorschriften kan beantwoorden.


      [ref1]: https://wetten.overheid.nl/BWBR0003165#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003165#Artikel7
