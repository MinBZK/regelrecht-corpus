  - number: '7'
    text: |-
      1 Van de EEG-modelgoedkeuring wordt aan de aanvrager van het onderzoek daartoe een op diens naam gesteld,
      gedagtekend en ondertekend certificaat van EEG-modelgoedkeuring door de ijkinstelling afgegeven.

      2 In het certificaat van EEG-modelgoedkeuring zijn opgenomen:

      a. de gegevens, strekkende tot identificatie van de aanvrager, en de kenmerken van het model,

      b. het voor de aanvrager met betrekking tot het goedgekeurde model door de ijkinstelling vastgestelde EEG-
      modelgoedkeuringsteken, alsmede

      c. - indien toepassing is gegeven aan artikel 6, eerste lid - het aan de EEG-modelgoedkeuring verbonden
      voorschrift, de beperkingen waaronder die goedkeuring is verleend en de door de ijkinstelling gestelde specifieke
      ijktechnische voorschriften, bedoeld in [artikel 6][ref1], vijfde lid, waaraan naar het desbetreffende model
      vervaardigde meetmiddelen moeten voldoen, en

      d. - indien het betreft door Onze Minister aangewezen categorieën van meetmiddelen - andere dan de onder *a-c*
      bedoelde, door hem bepaalde gegevens met betrekking tot het model of de daarnaar vervaardigde meetmiddelen.

      3 In door Onze Minister te bepalen gevallen kan in het certificaat van EEG-modelgoedkeuring het voorschrift worden
      opgenomen dat degene, op wiens naam dat certificaat is gesteld, op de door de ijkinstelling te bepalen plaats of
      plaatsen een of meer naar het goedgekeurde model vervaardigde meetmiddelen, onderdelen of maquettes van een zodanig
      meetmiddel of tekeningen met betrekking tot het model ter beschikking van de ijkinstelling stelt of houdt.

      4 Bij het certificaat van EEG-modelgoedkeuring worden aan de aanvrager de bescheiden, nodig ter identificatie van
      het model en ter verklaring van de werking van het desbetreffende meetmiddel, afgegeven.

      5 Onze Minister stelt het model van het certificaat van EEG-modelgoedkeuring vast en maakt het model van het EEG-
      modelgoedkeuringsteken, zoals vastgesteld bij de kaderrichtlijn of een bijzondere richtlijn, bekend.

      6 In een geval, waarin [artikel 6][ref2], achtste lid, toepassing vindt, stelt de ijkinstelling voor degene,
      op wiens naam het certificaat van EEG-modelgoedkeuring is gesteld, met betrekking tot diens reeds goedgekeurde
      model een nieuw EEG-modelgoedkeuringsteken vast, dat het oorspronkelijk voor dat model vastgestelde EEG-
      modelgoedkeuringsteken vervangt; het nieuwe EEG-modelgoedkeuringsteken is opgenomen in de aanvulling op het
      certificaat van EEG-modelgoedkeuring, bedoeld in [artikel 6][ref3], achtste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003165#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003165#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0003165#Artikel6
