  - number: '39'
    text: |-
      1 Het model van het ijkmerk, bedoeld in artikel 13, eerste lid, van de wet, van welk merk bij artikel 2, eerste
      lid, aangewezen meetmiddelen, die EEG-geijkte meetmiddelen zijn of kennelijk EEG-geijkte meetmiddelen zijn
      geweest, in geval van goedkeuring bij herkeuring worden voorzien, is identiek aan het model, vastgesteld bij
      [artikel 18 van het IJkreglement][ref1].

      2 Het model van het in artikel 13, derde lid, van de wet bedoelde afkeuringsmerk, waarvan bij artikel 2, eerste
      lid, aangewezen meetmiddelen, die EEG-geijkte meetmiddelen zijn of kennelijk EEG-geijkte meetmiddelen zijn geweest,
      ingevolge artikel 13, derde lid, van de wet worden voorzien, en het model van de afkeuringsmerken, bedoeld in
      de artikelen 16, tweede lid, en 29c van de wet, waarmede bedoelde meetmiddelen en de bij artikel 2, eerste lid,
      aangewezen meetmiddelen, waarop artikel 26, eerste lid, onder *d*, van toepassing is, kunnen worden voorzien, zijn
      identiek aan het model, vastgesteld bij [artikel 20 van het IJkreglement][ref2].

      3 Ten aanzien van de in het eerste lid bedoelde meetmiddelen die krachtens artikel 38, tweede lid, in hun
      verpakking ter herkeuring moeten worden aangeboden, geldt artikel 13, eerste en tweede lid, van de wet, in geval
      van herkeuring niet; in geval van goedkeuring van die meetmiddelen bij herkeuring worden een of meer van de in
      het eerste lid bedoelde ijkmerken aangebracht op de verpakking. Zodanige meetmiddelen, waarvan de verpakking is
      voorzien van de vereiste ijkmerken, bedoeld in het eerste lid, worden voor de toepassing van de wet aangemerkt als
      meetmiddelen die van de vereiste ijkmerken zijn voorzien.

      4 Ten aanzien van de in het eerste lid bedoelde meetmiddelen, met betrekking waartoe toepassing is gegeven
      aan artikel 18, zevende lid, onder *a* of *b*, en die anders dan in hun verpakking ter herkeuring mogen worden
      aangeboden, wordt, in afwijking van artikel 13, eerste lid, van de wet, in geval van goedkeuring bij herkeuring:

      a. voor zover het betreft categorieën van gewichten als bedoeld in [artikel 22 van het IJkreglement][ref3],
      het aanbrengen van ijkmerken geheel of ten dele achterwege gelaten of geheel of ten dele vervangen door de
      afgifte van een gewaarmerkte verklaring, een en ander overeenkomstig het bepaalde in de [artikelen 22][ref4] en
      [23 van het IJkreglement][ref5];

      b. voor zover het betreft andere meetmiddelen dan onder *a* bedoeld, het aanbrengen van ijkmerken
      vervangen door de afgifte van een gewaarmerkte verklaring overeenkomstig het bepaalde in
      [artikel 23, tweede lid, van het IJkreglement][ref6].


