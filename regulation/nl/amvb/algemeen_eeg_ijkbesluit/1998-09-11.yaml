  - number: '40'
    text: |-
      1 Artikel 6, zevende lid, van de wet geldt niet ten aanzien van de meetmiddelen, aangewezen bij artikel 2, eerste
      lid, onder *c*, 5°.

      2 De artikelen 6, vijfde lid, 7, eerste lid, onder *b*, 8, eerste lid, onder *b*, en 9-16 van de wet gelden niet
      voor in het eerste lid bedoelde meetmiddelen, ten aanzien waarvan aannemelijk kan worden gemaakt, dat zij niet
      bestemd zijn om ter bepaling van het natuurgewicht van granen te worden gebruikt bij of in verband met het drijven
      van handel in granen tussen, in verschillende Lid-Staten van de Europese Unie of andere Staten die partij zijn bij
      de Overeenkomst betreffende de Europese Economische Ruimte gevestigde, kopers en verkopers.

      3 Ten aanzien van andere, bij artikel 2, eerste lid, onder *c*, 5°, aangewezen meetmiddelen dan de in het tweede
      lid bedoelde geldt het in artikel 10, eerste lid, van de wet met betrekking tot keuring bepaalde uitsluitend
      alvorens eerstbedoelde meetmiddelen in gebruik worden genomen. De in artikel 10, eerste lid, van de wet bedoelde
      keuring is voor die meetmiddelen de EEG-keuring of de herkeuring, bedoeld in artikel 11, vierde lid, onder *b* of
      *c*, van de wet. Ten aanzien van die meetmiddelen gelden artikel 11, eerste lid, van de wet en het met betrekking
      tot de keuring bepaalde in artikel 14 van de wet niet.

      4 Het is verboden op plaatsen als in artikel 7, eerste lid, van de wet bedoeld ter bepaling van het natuurgewicht
      van granen bij of in verband met het drijven van handel in granen tussen, in verschillende Lid-Staten van de
      Europese Unie of andere Staten die partij zijn bij de Overeenkomst betreffende de Europese Economische Ruimte
      gevestigde, kopers en verkopers gebruik te maken van een ander bij artikel 2, eerste lid, onder *c*, 5°, aangewezen
      meetmiddel van een zodanig meetwerktuig, dat een EEG-geijkt meetmiddel is.

      5 Het vierde lid geldt niet ten aanzien van een bij artikel 2, eerste lid, onder *c*, 5°, aangewezen meetmiddel,
      dat kennelijk een EEG-geijkt meetmiddel is geweest, bij de herkeuring, bedoeld in artikel 11, vierde lid, onder *b*
      of *c*, van de wet is goedgekeurd en niet is voorzien van een afkeuringsmerk.
    url: https://wetten.overheid.nl/BWBR0003165/1998-09-11#Artikel40
  - number: '42'
    text: |-
      De artikelen 19 en 20, eerste lid, van de wet en het krachtens artikel 20, derde lid, van de wet bepaalde gelden
      niet ten aanzien van een bij artikel 2, eerste lid, onder *a*, *b*, *c*, 1°, 3°, 4°, 5° of 6°, *d* of *e*, 2°,
      aangewezen meetmiddel dat voldoet aan het bepaalde in artikel 25, eerste en tweede lid, alsmede aan het bij of
      krachtens artikel 31, derde lid, bepaalde, en ten aanzien waarvan aannemelijk kan worden gemaakt dat het bestemd is
      voor uitvoer naar een andere EER-Staat.
    url: https://wetten.overheid.nl/BWBR0003165/1998-09-11#Artikel42
  - number: '43'
    text: |-
      Ten aanzien van bij artikel 2, eerste lid, onder *b*, aangewezen gewichten, die EEG-geijkte meetmiddelen zijn of
      kennelijk EEG-geijkte meetmiddelen zijn geweest, is het bepaalde in [artikel 15 van het IJkreglement][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009069#Artikel15
    url: https://wetten.overheid.nl/BWBR0003165/1998-09-11#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0009069
        artikel: '15'
  - number: '44'
    text: |-
      Het [IJkreglement][ref1] geldt niet ten aanzien van bij artikel 2, eerste lid, aangewezen meetmiddelen:

      a. waarop een vorm van EEG-keuring wordt toegepast,

      b. die EEG-geijkte meetmiddelen zijn,

      c. die kennelijk EEG-geijkte meetmiddelen zijn geweest of

      d. die voldoen aan het bepaalde in artikel 25, eerste lid, maar ingevolge het tweede lid van dat artikel niet als
      EEG-geijkte meetmiddelen worden aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0009069
    url: https://wetten.overheid.nl/BWBR0003165/1998-09-11#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0009069
  - number: '45'
    text: |-
      Het is verboden een meetmiddel, een onderdeel van een meetmiddel of een hulpinrichting voor een meetmiddel te
      voorzien van een merk, teken of een ander opschrift, dat verward kan worden met een merk of een teken, bedoeld
      in de artikelen 7, vijfde lid, 14, tweede lid, 15, derde lid, 17, 22, tweede lid, onder *a*, of onder *c*, of 24,
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0003165/1998-09-11#Artikel45
