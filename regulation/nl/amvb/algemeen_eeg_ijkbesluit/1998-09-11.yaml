  - number: '13'
    text: |-
      De ijkinstelling draagt zorg dat:

      a. afschriften van elke bij haar ingediende aanvraag van een onderzoek tot EEG-modelgoedkeuring aan de andere EER-
      Staten worden toegezonden;

      b. afschriften van elk door haar afgegeven certificaat van EEG-modelgoedkeuring of van aanvullende EEG-
      modelgoedkeuring en van elk door haar genomen besluit als in [artikel 6][ref1], achtste lid, bedoeld, aan de andere
      EER-Staten en - ten behoeve van de bekendmaking daarvan in het *Publikatieblad van de Europese Gemeenschappen* -
      aan de Commissie van de Europese Gemeenschappen worden toegezonden;

      c. een afschrift van het keuringsrapport, betrekking hebbende op een verricht onderzoek tot EEG-modelgoedkeuring,
      aan een andere EER-Staat, op diens daartoe strekkend verzoek, wordt verstrekt;

      d. het besluit tot weigering, tot verlenging of tot intrekking van een EEG-modelgoedkeuring alsmede alle overige
      feiten die van belang zijn voor de draagwijdte en de geldigheid van een EEG-modelgoedkeuring worden medegedeeld
      aan de andere EER-Staten en - ten behoeve van de bekendmaking van die besluiten en feiten, met uitzondering van het
      besluit tot weigering van een EEG-modelgoedkeuring, in het *Publikatieblad van de Europese Gemeenschappen* - aan de
      Commissie van de Europese Gemeenschappen.


      [ref1]: https://wetten.overheid.nl/BWBR0003165#Artikel6
    url: https://wetten.overheid.nl/BWBR0003165/1998-09-11#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003165
        artikel: '6'
        paragraaf: '2'
  - number: '14'
    text: |-
      1 Een bij [artikel 2][ref1], eerste lid, aangewezen meetmiddel, ten aanzien waarvan een door of vanwege een
      andere EER-Staat verleende EEG-modelgoedkeuring in die EER-Staat geldt en een afschrift van het door die EER-
      Staat afgegeven certificaat van EEG-modelgoedkeuring of van aanvullende EEG-modelgoedkeuring of een afschrift
      van de aanvulling op het certificaat van EEG-modelgoedkeuring als in artikel 6, achtste lid, bedoeld, aan de
      ijkinstelling is verstrekt, wordt voor de toepassing van de wet en de daarop berustende besluiten aangemerkt als
      een meetmiddel, ten aanzien waarvan een door de ijkinstelling verleende EEG-modelgoedkeuring geldt en door de
      ijkinstelling onderscheidenlijk een certificaat van EEG-modelgoedkeuring of van aanvullende EEG-modelgoedkeuring of
      een aanvulling op het certificaat van EEG-modelgoedkeuring is afgegeven, met dien verstande dat:

      a. ten aanzien van dat meetmiddel als EEG-modelgoedkeuringsteken geldt het met betrekking tot het model van dat
      meetmiddel door of vanwege die andere EER-Staat vastgestelde EEG-modelgoedkeuringsteken;

      b. ten aanzien van die EEG-modelgoedkeuring door de ijkinstelling de artikelen 6, achtste lid, 8, eerste lid, 11,
      vierde en achtste lid, 12 en 13 niet worden toegepast.

      2 Onze Minister maakt het model van het in het eerste lid, onder *a*, bedoelde EEG-modelgoedkeuringsteken, zoals
      bij de kaderrichtlijn of een bijzondere richtlijn voor elk der andere EER-Staten vastgesteld, bekend.


      [ref1]: https://wetten.overheid.nl/BWBR0003165#Artikel2
    url: https://wetten.overheid.nl/BWBR0003165/1998-09-11#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003165
        artikel: '2'
        paragraaf: '1'
  - number: '15'
    text: |-
      1 Op een afzonderlijk onderdeel of een afzonderlijke hulpinrichting voor een bij artikel 2, eerste lid, aangewezen
      meetmiddel wordt op een daartoe strekkend verzoek een onderzoek tot EEG-modelgoedkeuring toegepast, voor zover de
      voor dat meetmiddel gegeven algemene ijktechnische voorschriften uitdrukkelijk bepalingen bevatten ten aanzien van
      dat onderdeel of die hulpinrichting als deel van het betrokken meetmiddel.

      2 Ten aanzien van een onderdeel of hulpinrichting als in het eerste lid bedoeld gelden als algemene ijktechnische
      voorschriften die bepalingen van de voor het betrokken meetmiddel gegeven algemene ijktechnische voorschriften,
      welke op het desbetreffende onderdeel of de desbetreffende hulpinrichting als deel van het betrokken meetmiddel
      betrekking of mede betrekking hebben.

      3 Ten aanzien van de in het eerste lid bedoelde onderdelen en hulpinrichtingen is het met betrekking tot een
      meetmiddel of met betrekking tot meetmiddelen bepaalde in de artikelen 3-14 - met uitzondering van artikel 6,
      tweede lid, - van overeenkomstige toepassing.

      4 Aan de EEG-modelgoedkeuring voor een onderdeel of een hulpinrichting als in het eerste lid bedoeld kunnen
      voorschriften worden verbonden ter zake van de werking van het samenstel van dat onderdeel onderscheidenlijk die
      hulpinrichting, en de meetmiddelen, waarvoor dat onderdeel kan worden toegepast of waaraan die hulpinrichting kan
      worden toegevoegd.

      5 De EEG-modelgoedkeuring van een onderdeel of een hulpinrichting als in het eerste lid bedoeld kan worden verleend
      onder de beperking dat dat onderdeel uitsluitend mag worden toegepast in, of die hulpinrichting uitsluitend mag
      worden toegevoegd aan door de ijkinstelling aangewezen meetmiddelen.

      6 In het certificaat van EEG-modelgoedkeuring van een onderdeel of hulpinrichting als in het eerste lid bedoeld
      zijn de voorschriften, bedoeld in het vierde lid, en de beperking, bedoeld in het vijfde lid, opgenomen.
    url: https://wetten.overheid.nl/BWBR0003165/1998-09-11#Artikel15
  - number: '16'
    text: |-
      Ten aanzien van een meetmiddel, waarop de beide vormen van een EEG-keuring, bedoeld in artikel 2, tweede lid, van
      toepassing zijn, moet bij de aanbieding daarvan tot de eerste EEG-ijk een EEG-modelgoedkeuring gelden.
    url: https://wetten.overheid.nl/BWBR0003165/1998-09-11#Artikel16
  - number: '17'
    text: |-
      Onze Minister maakt het bij de kaderrichtlijn vastgestelde EEG-teken bekend, waarvan bij artikel 2, derde
      lid, aangewezen meetmiddelen door de fabrikant daarvan kunnen worden voorzien; hij kan bepalen, dat bedoelde
      meetmiddelen niet tot de eerste EEG-ijk worden toegelaten, indien zij niet dienovereenkomstig van dat teken zijn
      voorzien.
    url: https://wetten.overheid.nl/BWBR0003165/1998-09-11#Artikel17
  - number: '18'
    text: |-
      1 Een meetmiddel wordt bij de eerste EEG-ijk niet goedgekeurd, indien:

      a. het blijkt te zijn voorzien van een EEG-modelgoedkeuringsteken in strijd met artikel 10, tweede lid,

      b. het niet is vervaardigd naar een model, waarvoor ten tijde van de aanbieding tot de eerste EEG-ijk een EEG-
      modelgoedkeuring geldt,

      c. het niet is voorzien van het met betrekking tot het goedgekeurde model daarvan vastgestelde EEG-
      modelgoedkeuringsteken,

      d. voor het model daarvan een EEG-modelgoedkeuring is verleend onder een beperking als in artikel 6, derde lid,
      onder *a*, bedoeld en het beperkte aantal meetmiddelen bij de eerste EEG-ijk reeds blijkt te zijn goedgekeurd, of

      e. het niet voldoet aan:

      1°. de daarvoor gegeven algemene ijktechnische voorschriften zoals die golden op het tijdstip van de eerste
      dagtekening van het certificaat van EEG-modelgoedkeuring, of

      2°. ingeval het betreft een meetmiddel, als bedoeld in artikel 6, eerste lid, de daarvoor gegeven bijzondere
      ijktechnische voorschriften zoals die golden op het tijdstip van de eerste dagtekening van het certificaat van EEG-
      modelgoedkeuring, dan wel

      3°. ingeval het betreft een meetmiddel, als bedoeld in artikel 2, derde lid, de daarvoor geldende algemene
      ijktechnische voorschriften.

      2 Het eerste lid, onder *b* en *c*, geldt niet ten aanzien van een meetmiddel als bedoeld in artikel 2, derde lid.

      3 Onze Minister kan bepalen, dat ten aanzien van door hem aangewezen categorieën van meetmiddelen of in door hem
      aangewezen categorieën van gevallen het eerste lid, onder *c*, niet geldt.

      4 Een meetmiddel dat bij de eerste EEG-ijk wordt goedgekeurd, wordt ten bewijze daarvan van het uit twee delen
      bestaande ijkmerk van eerste EEG-ijk voorzien.

      5 Onze Minister kan ter uitvoering van een bijzondere richtlijn regelen stellen omtrent de voorziening van
      meetmiddelen met zegelmerken bij de eerste EEG-ijk.

      6 Een meetmiddel, dat bij de eerste EEG-ijk niet wordt goedgekeurd, kan worden voorzien van een afkeuringsmerk,
      dat identiek is aan het afkeuringsmerk waarvan het model is vastgesteld in [artikel 20 van het IJkreglement][ref1]
      (1989, 116).

      7 In afwijking van het vierde lid kan Onze Minister bepalen dat ten aanzien van door hem aangewezen categorieën van
      meetmiddelen of in door hem aangewezen categorieën van gevallen het ijkmerk van eerste EEG-ijk:

      a. op de verpakking van de betrokken meetmiddelen wordt aangebracht of

      b. wordt vervangen door een gewaarmerkte of gedagtekende verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0009069#Artikel20
    url: https://wetten.overheid.nl/BWBR0003165/1998-09-11#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0009069
        artikel: '20'
  - number: 18a
    text: |-
      De artikelen 16 en 18, eerste lid, onder *b*, zijn niet van toepassing ten aanzien van een meetmiddel, dat na
      kennelijk bij de eerste EEG-ijk reeds te zijn goedgekeurd, opnieuw tot de eerste EEG-ijk wordt aangeboden.
    url: https://wetten.overheid.nl/BWBR0003165/1998-09-11#Artikel18a
  - number: '19'
    text: |-
      1 De eerste EEG-ijk geschiedt ten aanzien van meetmiddelen, waarvan de juiste werking afhangt van omstandigheden
      met betrekking tot de opstelling of het gebruik, in meer dan één fase en geschiedt ten aanzien van de overige
      meetmiddelen in één fase, een en ander voor zover Onze Minister niet anders heeft bepaald.

      2 Bij de eerste EEG-ijk in meer fasen wordt een meetmiddel, dat is goedgekeurd:

      a. bij een fase - niet zijnde de slotfase - ten bewijze daarvan voorzien van het eerste deel van het ijkmerk van
      eerste EEG-ijk;

      b. bij de slotfase, ten bewijze daarvan voorzien van het uit twee delen bestaande ijkmerk van eerste EEG-ijk
      door het aanbrengen van hetzij het tweede deel van het ijkmerk van eerste EEG-ijk, hetzij de beide delen van dat
      ijkmerk.

      3 Onze Minister kan de plaats of plaatsen bepalen waar de eerste EEG-ijk en, voor zover het de eerste EEG-ijk in
      meer fasen betreft, die fasen, met uitzondering van de slotfase, geschieden; de slotfase van de eerste EEG-ijk
      geschiedt ter plaatse van opstelling van het meetmiddel.
    url: https://wetten.overheid.nl/BWBR0003165/1998-09-11#Artikel19
  - number: '20'
    text: |-
      Een meetmiddel, dat in één of meer andere EER-Staten één of meer fasen van de eerste EEG-ijk - niet zijnde de
      slotfase - heeft ondergaan en waarop door of vanwege de betrokken EER-Staat of EER-Staten het eerste deel van
      het ijkmerk van eerste EEG-ijk is aangebracht, wordt voor de toepassing van dit besluit en de daarop berustende
      bepalingen gelijk gesteld met een meetmiddel dat bij de betrokken fase of fasen door de ijkinstelling is
      goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0003165/1998-09-11#Artikel20
  - number: '21'
    text: |-
      1 Ten aanzien van meetreservoirs in schepen voor de binnenvaart of de kustvaart, aangewezen in artikel 2, eerste
      lid, onder *c*, 4°, waarvoor de het ijkmerk van eerste EEG-ijk vervangende verklaring, bedoeld in artikel 22,
      tweede lid, onder *b*, is afgegeven, geschiedt de herkeuring, bedoeld in [artikel 11, vierde lid, onder ][ref1],
      telkens in aaneensluitende tijdvakken van twaalf jaar, te rekenen vanaf de dagtekening van die verklaring.

      2 Ten aanzien van meetreservoirs als in het eerste lid bedoeld, waarop voor 1 juli 1978 door de dienst van het
      IJkwezen een ijkmerk van eerste EEG-ijk is aangebracht, geschiedt de herkeuring als in het eerste lid bedoeld,
      telkens in aaneensluitende tijdvakken van twaalf jaar, te rekenen vanaf de dagtekening van het ter gelegenheid van
      de goedkeuring van de meetreservoirs afgegeven certificaat.

      3 In afwijking van het eerste en tweede lid geschiedt de herkeuring als in het eerste lid bedoeld eveneens, indien
      ten gevolge van vervorming, herstelling of verbouwing de metrologische eigenschappen van de meetreservoirs als in
      het eerste lid bedoeld kunnen zijn gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0009082#Artikel11
    url: https://wetten.overheid.nl/BWBR0003165/1998-09-11#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0009082
        artikel: '11'
  - number: 21a
    text: |-
      1 Bij de eerste EEG-ijk wordt elk meetmiddel afzonderlijk aan een onderzoek onderworpen.

      2 In afwijking van het eerste lid kan Onze Minister regelen stellen, volgens welke in door hem bepaalde categorieën
      van gevallen of ten aanzien van door hem daartoe aangewezen categorieën van meetmiddelen de eerste EEG-ijk anders
      dan stuksgewijze plaatsvindt.

      3 De in het tweede lid bedoelde regelen kunnen onder meer betrekking hebben op:

      a. de keuring van een partij meetmiddelen door middel van een feitelijk onderzoek van een aantal exemplaren, dat
      als steekproef uit die partij is genomen;

      b. de samenstelling van de partij;

      c. de grootte van de partij en van de steekproef;

      d. de maatstaven aan de hand waarvan op grond van de uitslag van het onderzoek van de steekproef meetmiddelen, die
      tot de partij behoren, bij de eerste EEG-ijk worden goedgekeurd onderscheidenlijk niet worden goedgekeurd, en

      e. de mededeling aan de aanvrager van de eerste EEG-ijk van de voor de meetmiddelen, behorende tot de betrokken
      partij, vastgestelde uitslag van het onderzoek en de wijze waarop die mededeling wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0003165/1998-09-11#Artikel21a
  - number: '22'
    text: |-
      1 Onze Minister kan regelen stellen omtrent:

      a. de bescheiden die bij de aanvraag tot eerste EEG-ijk met betrekking tot een meetmiddel moeten worden overgelegd;

      b. de wijze waarop of de toestand waarin een meetmiddel voor de eerste EEG-ijk moet worden aangeboden;

      c. de plaats voor en de wijze van het aanbrengen van het ijkmerk van eerste EEG-ijk of van delen van dat ijkmerk.

      2 Onze Minister maakt bekend:

      a. het bij de kaderrichtlijn of een bijzondere richtlijn vastgestelde ijkmerk van eerste EEG-ijk, dat door de
      ijkinstelling, door een ijkbevoegde of door of vanwege een andere EER-Staat in geval van goedkeuring bij de
      eerste EEG-ijk op meetmiddelen of - indien toepassing is gegeven aan artikel 18, zevende lid, onder *a*, - op de
      verpakking daarvan kan worden aangebracht;

      b. - indien toepassing is gegeven aan artikel 18, zevende lid, onder *b*, - het bij een bijzondere richtlijn
      vastgestelde model van de verklaring, welke ter vervanging van het ijkmerk van eerste EEG-ijk door de
      ijkinstelling, door een ijkbevoegde of door of vanwege een andere EER-Staat bij de eerste EEG-ijk kan worden
      afgegeven;

      c. - indien toepassing is gegeven aan artikel 18, vijfde lid, - de bij de kaderrichtlijn of een bijzondere
      richtlijn vastgestelde EEG-zegelmerken, die door de ijkinstelling, door een ijkbevoegde of door of vanwege een
      andere EER-Staat bij de eerste EEG-ijk op meetmiddelen kunnen worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0003165/1998-09-11#Artikel22
  - number: '23'
    text: |-
      1 Onze Minister kan regelen stellen omtrent de voor de eerste EEG-ijk door de aanvrager daarvan of de eigenaar of
      de houder van het betrokken meetmiddel te verlenen medewerking.

      2 Onverminderd artikel 25 van de wet kan de eerste EEG-ijk worden geweigerd of beëindigd, indien de aanvrager niet
      voldoet aan de krachtens artikel 22, eerste lid, onder *a* en *b*, gestelde regelen.
    url: https://wetten.overheid.nl/BWBR0003165/1998-09-11#Artikel23
  - number: '24'
    text: |-
      1 Onze Minister kan bepalen, dat op een daartoe strekkende aanvraag op door hem aangewezen afzonderlijke onderdelen
      of hulpinrichtingen voor door hem aangewezen categorieën van meetmiddelen, aangewezen bij artikel 2, eerste lid,
      de eerste EEG-ijk in één fase of een of meer fasen van de eerste EEG-ijk, met uitzondering van de slotfase, worden
      toegepast.

      2 Ten aanzien van de krachtens het eerste lid aangewezen onderdelen en hulpinrichtingen is het met betrekking tot
      een meetmiddel of het met betrekking tot meetmiddelen bepaalde in de artikelen 16, 18, eerste lid en derde tot en
      met zevende lid, 19, tweede lid, onder *a*, 20, 22 en 23, tenzij door Onze Minister anders is bepaald, alsmede het
      bepaalde in artikel 21*a* van overeenkomstige toepassing.

      3 Onze Minister kan in afwijking van het tweede lid en in verband daarmede artikel 18, vierde lid, bepalen dat
      op een krachtens het eerste lid aangewezen voorwerp bij de eerste EEG-ijk, in geval van goedkeuring, slechts het
      eerste deel van het ijkmerk van eerste EEG-ijk op één dan wel meer plaatsen wordt aangebracht of dat het ijkmerk
      van eerste EEG-ijk op meer dan één plaats wordt aangebracht.

      4 Onze Minister kan bepalen dat bij de eerste EEG-ijk van een meetmiddel, behorende tot een door hem aangewezen
      categorie, in geval van goedkeuring daarvan ook de krachtens het eerste lid aangewezen voorwerpen, die deel van
      dat meetmiddel uitmaken en het eerste deel van het ijkmerk van eerste EEG-ijk dragen, op één dan wel meer plaatsen
      worden voorzien van het tweede deel van dat ijkmerk.

      5 Een krachtens het eerste lid aangewezen voorwerp dat op één dan wel meer plaatsen het door of vanwege een andere
      EER-Staat aangebrachte eerste deel van het ijkmerk van eerste EEG-ijk of een door of vanwege een andere EER-Staat
      aangebracht ijkmerk van eerste EEG-ijk draagt of ten aanzien waarvan een dat ijkmerk vervangende verklaring is
      afgegeven door of vanwege een andere EER-Staat, wordt voor de toepassing van dit besluit en de daarop berustende
      bepalingen gelijk gesteld met een voorwerp dat op één of meer plaatsen door de ijkinstelling met inachtneming van
      de regelen, gegeven krachtens het eerste tot en met het vierde lid, is voorzien van het eerste deel van het ijkmerk
      van eerste EEG-ijk of is voorzien van een ijkmerk van eerste EEG-ijk onderscheidenlijk ten aanzien waarvan een dat
      ijkmerk vervangende verklaring door de ijkinstelling is afgegeven.
    url: https://wetten.overheid.nl/BWBR0003165/1998-09-11#Artikel24
  - number: '25'
    text: |-
      1 Voor de toepassing van dit besluit en de daarop berustende bepalingen wordt als een EEG-geijkt meetmiddel
      aangemerkt een bij artikel 2, eerste lid, aangewezen meetmiddel, dat niet van een afkeuringsmerk als in artikel 18,
      zesde lid, bedoeld is voorzien en:

      a. dat een door de ijkinstelling of een ijkbevoegde dan wel een door of vanwege een andere EER-Staat aangebracht
      geldig ijkmerk van eerste EEG-ijk op een andere plaats dan een krachtens artikel 24, eerste lid, aangewezen
      onderdeel of hulpinrichting daarvan draagt, of

      b. dat op zijn verpakking een door de ijkinstelling of een ijkbevoegde dan wel een door of vanwege een andere EER-
      Staat aangebracht geldig ijkmerk van eerste EEG-ijk draagt of ten aanzien waarvan een het ijkmerk van eerste EEG-
      ijk vervangende verklaring geldt, die is afgegeven door de ijkinstelling of een ijkbevoegde dan wel door of vanwege
      een andere EER-Staat.

      2 Voor de toepassing van dit besluit en de daarop berustende bepalingen wordt niet als een EEG-geijkt meetmiddel
      aangemerkt een meetmiddel, dat is voorzien van:

      a. een metrologische aanduiding, die in een andere dan de Nederlandse taal is gesteld,

      b. een niet in een taal gestelde metrologische aanduiding, die krachtens artikel 28, tweede lid, uitsluitend is
      vereist of toegelaten voor meetmiddelen, ten aanzien waarvan aannemelijk kan worden gemaakt dat zij voor uitvoer
      naar een andere EER-Staat zijn bestemd, of

      c. een inrichting, die de prijs van het door middel van dat meetmiddel gemetene niet zichtbaar maakt in de
      Nederlandse munteenheid.
    url: https://wetten.overheid.nl/BWBR0003165/1998-09-11#Artikel25
  - number: '26'
    text: |-
      1 Het bij of krachtens de artikelen 27-31 bepaalde geldt uitsluitend ten aanzien van de bij artikel 2, eerste lid,
      aangewezen meetmiddelen:

      a. waarop een vorm van EEG-keuring wordt toegepast,

      b. die EEG-geijkte meetmiddelen zijn,

      c. die kennelijk EEG-geijkte meetmiddelen zijn geweest of

      d. die voldoen aan het bepaalde in artikel 25, eerste lid, maar ingevolge het tweede lid van dat artikel niet als
      EEG-geijkte meetmiddelen worden aangemerkt.

      2 Een bij artikel 2, eerste lid, onder *c*, 4°, aangewezen meetmiddel, dat bij de eerste EEG-ijk is goedgekeurd,
      wordt, indien daarvoor krachtens artikel 21 de geldigheidsduur van het ijkmerk van eerste EEG-ijk of van de dat
      ijkmerk vervangende verklaring is beperkt, na afloop van die geldigheidsduur voor de toepassing van dit besluit
      en de daarop berustende bepalingen niet aangemerkt als een meetmiddel, dat kennelijk een EEG-geijkt meetmiddel
      is geweest.
    url: https://wetten.overheid.nl/BWBR0003165/1998-09-11#Artikel26
  - number: '27'
    text: |-
      1 Artikel 6, tweede lid, van de wet geldt niet ten aanzien van de meetmiddelen, aangewezen bij artikel 2, eerste
      lid, onder *b*, 2°.

      2 Het bepaalde in artikel 6, derde lid, tweede volzin, van de wet geldt niet ten aanzien van de meetmiddelen,
      aangewezen bij artikel 2, eerste lid, onder *c*, 2°, 3°, 4° en 5°, en e.
    url: https://wetten.overheid.nl/BWBR0003165/1998-09-11#Artikel27
  - number: '28'
    text: |-
      1 De meetmiddelen moeten zodanig zijn ingericht, dat zij geen aanleiding tot misleiding of misvatting kunnen
      geven. Zij moeten een doelmatige vorm hebben, uit voor het doel geschikte grondstoffen van goede hoedanigheid zijn
      vervaardigd, aan de eis van goed werk voldoen en in goede staat van onderhoud verkeren; zij moeten zodanig zijn
      samengesteld dat ijkmerken en afkeuringsmerken gemakkelijk kunnen worden aangebracht en niet zonder beschadiging
      kunnen worden verwijderd.

      2 Onze Minister stelt ter uitvoering van het eerste lid nadere bepalingen vast, waarbij de betrokken meetmiddelen
      zo nodig nader worden omschreven; hij geeft voorts overige ingevolge een bijzondere richtlijn vereiste
      voorschriften omtrent de samenstelling, stelt eisen vast ten aanzien van de meet- en weegeigenschappen en de
      daarbij toegelaten maximale fouten en kan nadere voorschriften geven, welke voor een doelmatig gebruik van de
      betrokken meetmiddelen bevorderlijk zijn.

      3 De meetmiddelen mogen geen aanduidingen van andere dan de bij of krachtens artikel 1 van de wet erkende
      meeteenheden dragen; de aanduiding van decimale veelvouden en delen van erkende meeteenheden op de meetmiddelen
      moet overeenstemmen met het bij of krachtens artikel 4 van de wet bepaalde. Onze Minister kan bepalen dat die
      aanduidingen in door hem aangewezen gevallen of ten aanzien van meetmiddelen, behorende tot door hem aangewezen
      categorieën, met inachtneming van de door hem gestelde regelen mogen zijn vergezeld van aanduidingen van andere dan
      de erkende meeteenheden.

      4 Op meetmiddelen, aangewezen bij artikel 2, eerste lid, onder *b*, 2°, moet de nominale massa daarvan zijn
      vermeld en zijn uitgedrukt door een getal, gevolgd door het symbool van een door Onze Minister bepaalde wettelijke
      meeteenheid.

      5 Onze Minister kan in afwijking van het vierde lid ten aanzien van door hem aangewezen categorieën van
      meetmiddelen, bedoeld in het vierde lid, bepalen, dat de nominale waarde daarop uitsluitend in de vorm van een
      getal moet zijn vermeld dan wel daarop niet mag zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0003165/1998-09-11#Artikel28
  - number: '29'
    text: |-
      1 De krachtens artikel 28, tweede lid, gegeven regelen - behoudens de eisen ten aanzien van de maximaal toelaatbare
      fouten - gelden niet ten aanzien van een meetmiddel dat naar een ingevolge artikel 6, eerste lid, goedgekeurd model
      is vervaardigd en met inachtneming van artikel 10 van het voor dat model vastgestelde EEG-modelgoedkeuringsteken
      is voorzien.

      2 Voor de toepassing van artikel 12 en, in verband daarmede, artikel 11, vierde lid, van de artikelen 13 en 16 van
      de wet, van [artikel 5:18 van de Algemene wet bestuursrecht][ref1] en van het met betrekking tot herkeuring bij
      of krachtens artikel 14 van de wet bepaalde ten aanzien van een meetmiddel als in het eerste lid bedoeld worden
      de daarvoor gegeven specifieke ijktechnische voorschriften aangemerkt als voorschriften, welke bij of krachtens
      artikel 6 van de wet zijn gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel518
    url: https://wetten.overheid.nl/BWBR0003165/1998-09-11#Artikel29
