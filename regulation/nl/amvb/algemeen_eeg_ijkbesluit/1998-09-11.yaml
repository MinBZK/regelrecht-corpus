  - number: '9'
    text: |-
      Voor de toepassing van dit besluit en de daarop berustende bepalingen worden de in [artikel 6][ref1], achtste
      lid, bedoelde aanvulling van het certificaat van EEG-modelgoedkeuring en het in [artikel 8][ref2], eerste lid,
      bedoelde certificaat van aanvullende EEG-modelgoedkeuring geacht deel uit te maken van het certificaat van EEG-
      modelgoedkeuring en worden onder het certificaat van EEG-modelgoedkeuring vorenbedoelde bescheiden mede verstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003165#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003165#Artikel8
