  - number: '4.1'
    text: |-
      De aanvraag aan Onze Minister om een toelating wordt ingediend onder gebruikmaking van een door Onze Minister
      beschikbaar te stellen formulier.
    url: https://wetten.overheid.nl/BWBR0018983/2015-05-30#Artikel4.1
  - number: '6.1'
    text: |-
      1 Met betrekking tot de bestuursstructuur van instellingen gelden de volgende eisen:

      a. er is een orgaan dat toezicht houdt op het beleid van de dagelijkse of algemene leiding van de instelling
      en deze met raad ter zijde staat; geen persoon kan tegelijk deel uitmaken van het toezichthoudend orgaan en de
      dagelijkse of algemene leiding;

      b. het toezichthoudend orgaan is zodanig samengesteld dat de leden ten opzichte van elkaar, de dagelijkse en
      algemene leiding van de instelling en welk deelbelang dan ook onafhankelijk en kritisch kunnen opereren;

      c. de instelling legt inzichtelijk de verantwoordelijkheidsverdeling tussen het toezichthoudend orgaan en de
      dagelijkse of algemene leiding vast, alsmede de wijze waarop interne conflicten tussen beide organen worden
      geregeld.

      2 Instellingen die rechtspersoon zijn, met uitzondering van kerkgenootschappen, leggen het in het eerste lid
      bepaalde vast in de statuten; de overige instellingen leggen dat anderszins schriftelijk vast.
    url: https://wetten.overheid.nl/BWBR0018983/2015-05-30#Artikel6.1
  - number: '6.2'
    text: |-
      Indien de instelling de rechtsvorm van stichting of vereniging als bedoeld in
      [artikel 344 van Boek 2 van het Burgerlijk Wetboek][ref1] heeft, kent zij in de
      statuten aan een orgaan dat de cliënten van de instelling vertegenwoordigt, de in
      [artikel 346, onder c, van Boek 2 van het Burgerlijk Wetboek][ref2] bedoelde bevoegdheid toe tot het indienen
      van een verzoek als bedoeld in [artikel 345 van Boek 2 van het Burgerlijk Wetboek][ref3]. De instelling kan die
      bevoegdheid daarnaast ook aan anderen toekennen.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel344
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel346
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel345
    url: https://wetten.overheid.nl/BWBR0018983/2015-05-30#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '344'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '346'
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '345'
  - number: '6.3'
    text: |-
      De instelling heeft schriftelijk vastgelegd welk orgaan of welke organen van de instelling welke bevoegdheden heeft
      onderscheidenlijk hebben ten aanzien van welk onderdeel of aspect van de bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0018983/2015-05-30#Artikel6.3
  - number: '6.4'
    text: |-
      1 De instelling heeft schriftelijk en inzichtelijk vastgelegd hoe de zorgverlening georganiseerd wordt, van welke
      andere organisatorische verbanden daarbij gebruik wordt gemaakt en wat de aard is van de relaties met die andere
      verbanden, waaronder begrepen verantwoordelijkheden, taken en beslissingsbevoegdheden.

      2 De activiteiten van de instelling waarvoor de toelating geldt, worden in ieder geval financieel onderscheiden van
      andere activiteiten van de instelling.
    url: https://wetten.overheid.nl/BWBR0018983/2015-05-30#Artikel6.4
  - number: '6.5'
    text: |-
      In de financiële administratie van de instelling zijn ontvangsten en betalingen duidelijk traceerbaar naar bron en
      bestemming, en duidelijk is wie op welk moment welke verplichtingen voor of namens de instelling is aangegaan.
    url: https://wetten.overheid.nl/BWBR0018983/2015-05-30#Artikel6.5
  - number: '7.1'
    text: |-
      Dit hoofdstuk heeft betrekking op de in [artikel 16 van de wet][ref1] bedoelde gegevens van de in
      [artikel 2.1, vijfde lid][ref2], bedoelde instellingen, voor zover die betreffen:

        - de structuur van de instellingen;
        - het gebruik van de instellingen;
        - de investeringen en de exploitatiekosten van de instellingen,

      in de volgende artikelen «gegevens» genoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0018983#Artikel2.1
    url: https://wetten.overheid.nl/BWBR0018983/2015-05-30#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0018906
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0018983
        artikel: '2.1'
        hoofdstuk: II
  - number: '7.2'
    text: |-
      1 Onze Minister geeft per categorie van instellingen en per categorie van personen die bij de exploitatie van een
      instelling betrokken zijn, aan, welke gegevens jaarlijks dienen te worden verstrekt.

      2 Onze Minister kan voor instellingen gelegen binnen een door hem aan te wijzen gebied en voor personen die bij de
      exploitatie van die instellingen betrokken zijn, aangeven welke gegevens op zijn desbetreffend verzoek dienen te
      worden verstrekt.

      3 Met betrekking tot academische en militaire ziekenhuizen geeft Onze Minister in overeenstemming met Onze Minister
      van Onderwijs, Cultuur en Wetenschappen onderscheidenlijk in overeenstemming met Onze Minister van Defensie aan
      welke gegevens dienen te worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0018983/2015-05-30#Artikel7.2
  - number: '7.3'
    text: |-
      1 De gegevens bedoeld in [artikel 7.2, eerste lid][ref1], dienen jaarlijks uiterlijk vijf maanden na het
      verstrijken van het jaar waarop zij betrekking hebben te worden verstrekt.

      2 De gegevens, bedoeld in [artikel 7.2, tweede lid][ref2], dienen te worden verstrekt telkens uiterlijk zes maanden
      na een desbetreffend verzoek van Onze Minister.

      3 Met betrekking tot academische ziekenhuizen en militaire ziekenhuizen geeft Onze Minister in overeenstemming met
      Onze Minister van Onderwijs, Cultuur en Wetenschappen onderscheidenlijk in overeenstemming met Onze Minister van
      Defensie aan, op welke termijn de gegevens bedoeld in [artikel 7.2, derde lid][ref3], dienen te worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0018983#Artikel7.2
      [ref2]: https://wetten.overheid.nl/BWBR0018983#Artikel7.2
      [ref3]: https://wetten.overheid.nl/BWBR0018983#Artikel7.2
    url: https://wetten.overheid.nl/BWBR0018983/2015-05-30#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0018983
        artikel: '7.2'
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0018983
        artikel: '7.2'
        hoofdstuk: VII
      - id: ref3
        bwb_id: BWBR0018983
        artikel: '7.2'
        hoofdstuk: VII
  - number: '7.4'
    text: |-
      1 Onze Minister kan regels vaststellen over de wijze waarop en de vorm waarin de gegevens dienen te worden
      verstrekt.

      2 Onze Minister wijst instanties aan die de te verstrekken gegevens verzamelen en verwerken. Hij stelt
      voorschriften die door die instanties in acht worden genomen.
    url: https://wetten.overheid.nl/BWBR0018983/2015-05-30#Artikel7.4
  - number: '7.5'
    text: |-
      De gegevens kunnen door Onze Minister op door hem te bepalen wijze ter beschikking worden gesteld van de organen
      genoemd in of betrokken bij de uitvoering van de wet.
    url: https://wetten.overheid.nl/BWBR0018983/2015-05-30#Artikel7.5
  - number: '7.7'
    text: |-
      Onze Minister stelt regels omtrent de wijze van vergoeding van de kosten, verbonden aan de verstrekking van de
      gegevens.
    url: https://wetten.overheid.nl/BWBR0018983/2015-05-30#Artikel7.7
  - number: '8.1'
    text: |-
      In dit hoofdstuk wordt verstaan onder sanering: het geheel van de maatregelen die worden genomen op grond van een
      besluit als bedoeld in [artikel 17, eerste lid, van de wet][ref1] of ter uitvoering van een beslissing als bedoeld
      in [artikel 18 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0018906#Artikel18
    url: https://wetten.overheid.nl/BWBR0018983/2015-05-30#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0018906
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0018906
        artikel: '18'
  - number: '8.2'
    text: |-
      1 De financiële gevolgen van sanering, bedoeld in [artikel 17, eerste lid, van de wet][ref1] bestaan
      uit het verschil tussen de door het College sanering aanvaardbaar geachte lasten terzake van de sanering
      en de door het College sanering vastgestelde opbrengsten daarvan. Het College sanering stelt het
      verschil niet vast dan nadat de liquidatiebegroting is geverifieerd door een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2].

      2 Bij het vaststellen van de lasten terzake van sanering neemt het College sanering in beschouwing:

      a. onderbezettingsverliezen;

      b. uitkeringen aan werknemers of gewezen werknemers;

      c. uitkeringen aan personen die krachtens overeenkomst met de instelling voor eigen rekening een medisch beroep
      uitoefenen of hebben uitgeoefend;

      d. boekverliezen als gevolg van de vervreemding van zaken;

      e. andere uitgaven ten behoeve van de sanering.

      3 Voor de toepassing van het tweede lid blijven buiten beschouwing lasten die in aanmerking zijn genomen of kunnen
      worden genomen bij de vaststelling van een tarief als bedoeld in de [Wet marktordening gezondheidszorg][ref3].

      4 Bij het vaststellen van de opbrengsten van sanering neemt het College sanering in beschouwing de opbrengsten
      van vermogensbestanddelen die als gevolg van de sanering niet meer bij de instelling in gebruik zullen zijn, met
      uitzondering van de vermogensbestanddelen die naar het oordeel van het College sanering, gelet op hun herkomst en
      bestemming, behoren te worden uitgezonderd, alsmede opbrengsten die in aanmerking zijn genomen of kunnen worden
      genomen bij de vaststelling van een tarief als bedoeld in de [Wet marktordening gezondheidszorg][ref4].

      5 Het College sanering kan nadere regels stellen terzake van de lasten en opbrengsten bedoeld in de voorgaande
      leden.


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel393
