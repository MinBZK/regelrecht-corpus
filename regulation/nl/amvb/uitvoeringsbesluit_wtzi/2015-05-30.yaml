        bwb_id: BWBR0018906
        artikel: '5'
  - number: '2.3'
    text: |-
      [Artikel 5 van de Wet toelating zorginstellingen][ref1] is niet van toepassing voor zover een instelling
      forensische zorg verleent als bedoeld in [artikel 2 van het Interimbesluit forensische zorg][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0029333#Artikel5
