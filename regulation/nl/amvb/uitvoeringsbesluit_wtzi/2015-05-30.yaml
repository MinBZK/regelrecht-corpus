        bwb_id: BWBR0011192
      - id: ref2
        bwb_id: BWBR0011192
  - number: '9.1'
    text: |-
      Dit besluit treedt in werking op het tijdstip waarop de [Wet toelating zorginstellingen][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0018906
