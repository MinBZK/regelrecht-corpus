  - number: '2.2'
    text: |-
      De instellingen, genoemd in [artikel 1.2, onder de nummers 5 tot en met 14, 20 en 24][ref1] worden voor de
      toepassing van [artikel 5, eerste lid, van de wet][ref2] aangemerkt als in het bezit van een toelating.


      [ref1]: https://wetten.overheid.nl/BWBR0018983#Artikel1.2
      [ref2]: https://wetten.overheid.nl/BWBR0018906#Artikel5
    url: https://wetten.overheid.nl/BWBR0018983/2015-05-30#Artikel2.2
