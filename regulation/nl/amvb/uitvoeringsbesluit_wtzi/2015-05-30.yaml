        artikel: '2.10'
  - number: '1.2'
    text: |-
      Voor de toepassing van [artikel 5, eerste lid, van de wet][ref1] worden de volgende categorieën van instellingen
      aangewezen:

      1. instellingen voor medisch-specialistische zorg;

      2. audiologische centra;

      3. trombosediensten;

      alsmede instellingen voor:

      4.

      5. huisartsenzorg;

      6. verloskundige zorg;

      7. kraamzorg;

      8. mondzorg;

      9. paramedische zorg;

      10. het verstrekken van hulpmiddelen;

      11. het verlenen van farmaceutische zorg;

      12. ziekenvervoer;

      13. erfelijkheidsadvisering;

      14. behandeling van gedragswetenschappelijke aard in verband met een psychiatrische aandoening;

      15.

      16.

      17. persoonlijke verzorging;

      18. verpleging;

      19. begeleiding;

      20. ADL-assistentie;

      21. behandeling, anders dan bedoeld onder nummer 14;

      22.

      23.

      24. de uitleen van verpleegartikelen.


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel5
    url: https://wetten.overheid.nl/BWBR0018983/2015-05-30#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0018906
        artikel: '5'
  - number: '2.1'
    text: |-
      1 Niet tot de in [artikel 1.2][ref1] genoemde instellingen behoren militaire instellingen als ziekenboegen,
      gezondheidscentra en operationeel geneeskundige instellingen.

      2 Op de instellingen, genoemd in [artikel 1.2, onder nummer 1][ref2], voor zover het betreft militaire ziekenhuizen
      en militaire revalidatiecentra, zijn de [artikelen 7, derde lid, onder c][ref3], [9, eerste lid, onder b][ref4], en
      [13, eerste lid, eerste volzin, van de wet][ref5] niet van toepassing.

      3 Op de instellingen, genoemd in [artikel 1.2, onder nummer 1][ref6], voor zover het betreft academische
      ziekenhuizen, zijn de [artikelen 6.1][ref7] en [6.2][ref8] van dit besluit niet van toepassing.

      4 [Artikel 6.1][ref9] is uitsluitend van toepassing op:

      a. de instellingen, bedoeld in het vijfde lid, met uitzondering van academische ziekenhuizen, en

      b. op overige instellingen wanneer daarop [artikel 2, eerste lid, van de Wet op de ondernemingsraden][ref10] van
      toepassing is.

      5 De [artikelen 15][ref11] en [16 van de wet][ref12] zijn uitsluitend van toepassing op de instellingen, bedoeld in
      [artikel 1.2, onder de nummers 1, 17, 18, 19, en 21][ref13].

      6 [Artikel 18 van de wet][ref14] is uitsluitend van toepassing op:

      a. de instellingen, bedoeld in [artikel 1.2, nummer 1][ref15],

        - die zorg verlenen in combinatie met Zvw-verblijf;
        - voor welke zorg op grond van de [Wet marktordening gezondheidszorg][ref16] een tarief is vastgesteld; en
        - welke zorg behoort tot de ingevolge de [Zorgverzekeringswet][ref17] te verzekeren prestaties,

      een en ander met uitzondering van militaire instellingen;

      b. instellingen die zorg verlenen in combinatie met Wlz-verblijf.

      7 In afwijking van het zesde lid geldt [artikel 18 van de wet][ref18] niet voor kleinschalige woonvoorzieningen,
      zijnde instellingen of delen daarvan die:

      a. bestaan uit zelfstandige woningen, dat wil zeggen woningen die naast één of meer privévertrekken een eigen
      voordeur, een eigen keuken, een eigen toilet en een eigen badkamer hebben,

      b. een beperkte omvang hebben, dat wil zeggen dat zij huisvesting bieden aan ten hoogste zes personen, en

      c. samen met andere in de directe omgeving gelegen zodanige voorzieningen aan niet meer dan 50 personen verblijf
      bieden.


