  - number: '8.3'
    text: |-
      1 Het College sanering kan ten behoeve van de sanering en het toezicht daarop een gemachtigde aanwijzen.

      2 De gemachtigde is onder verantwoordelijkheid van het College sanering belast met het toezicht op de naleving van
      de bij of krachtens [artikel 17 van de wet][ref1] gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel17
    url: https://wetten.overheid.nl/BWBR0018983/2015-05-30#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0018906
        artikel: '17'
  - number: '8.4'
    text: |-
      1 De instelling is verplicht aan het College sanering de gegevens en bescheiden te verstrekken die het in verband
      met de sanering nodig acht.

      2 Het College sanering kan nadere regels stellen terzake van het verstrekken van de gegevens en bescheiden bedoeld
      in het vorige lid.

      3 Het College sanering kan de instelling verplichtingen opleggen als bedoeld in
      [artikel 4:38 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel438
    url: https://wetten.overheid.nl/BWBR0018983/2015-05-30#Artikel8.4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:38
  - number: '8.5'
    text: |-
      1 Het College sanering kan de instelling aanwijzingen geven ten behoeve van het goede verloop van de sanering.

      2 De instelling is verplicht uitvoering te geven aan aanwijzingen als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018983/2015-05-30#Artikel8.5
  - number: '8.8'
    text: |-
      1 Het [Besluit sanering instellingen voor gezondheidszorg][ref1] wordt ingetrokken.

      2 Na de inwerkingtreding van dit artikel berusten de regels ter uitvoering van het
      [Besluit sanering instellingen voor gezondheidszorg][ref2] op de overeenkomstige bepalingen van dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0011192
      [ref2]: https://wetten.overheid.nl/BWBR0011192
    url: https://wetten.overheid.nl/BWBR0018983/2015-05-30#Artikel8.8
