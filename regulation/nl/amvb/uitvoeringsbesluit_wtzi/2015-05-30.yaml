        artikel: '5'
  - number: '3.1'
    text: |-
      Als instellingen waarvoor winstoogmerk is toegestaan, worden aangewezen:

      a. de instellingen, behorend tot de categorie, genoemd in [artikel 1.2, onder nummer 1][ref1], die uitsluitend de
      daar genoemde zorg verlenen in verband met een psychiatrische aandoening, niet in combinatie met Zvw-verblijf;

      b. de instellingen, behorend tot de categorieën, genoemd in
      [artikel 1.2, onder de nummers 2, 3, 5 tot en met 12, 14 en 24][ref2];

      c. de instellingen, behorend tot de categorieën, genoemd in [artikel 1.2, onder de nummers 17, 18, 19 en 21][ref3],
      die de desbetreffende zorg niet verlenen in combinatie met Wlz-verblijf;

      d. de instellingen, bedoeld in [artikel 2.1, zevende lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0018983#Artikel1.2
      [ref2]: https://wetten.overheid.nl/BWBR0018983#Artikel1.2
      [ref3]: https://wetten.overheid.nl/BWBR0018983#Artikel1.2
      [ref4]: https://wetten.overheid.nl/BWBR0018983#Artikel2.1
