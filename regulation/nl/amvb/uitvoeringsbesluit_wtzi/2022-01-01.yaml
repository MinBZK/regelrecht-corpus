  - number: '8.3'
    text: |-
      1 Het College sanering kan ten behoeve van de sanering en het toezicht daarop een gemachtigde aanwijzen.

      2 De gemachtigde is onder verantwoordelijkheid van het College sanering belast met het toezicht op de naleving van
      de bij of krachtens [artikel 17 van de wet][ref1] gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel17
    url: https://wetten.overheid.nl/BWBR0018983/2022-01-01#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0018906
        artikel: '17'
  - number: '8.4'
    text: |-
      1 De instelling is verplicht aan het College sanering de gegevens en bescheiden te verstrekken die het in verband
      met de sanering nodig acht.

      2 Het College sanering kan nadere regels stellen terzake van het verstrekken van de gegevens en bescheiden bedoeld
      in het vorige lid.

      3 Het College sanering kan de instelling verplichtingen opleggen als bedoeld in
      [artikel 4:38 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel438
    url: https://wetten.overheid.nl/BWBR0018983/2022-01-01#Artikel8.4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:38
  - number: '8.5'
    text: >-
      1 Het College sanering kan de instelling aanwijzingen geven ten behoeve van het goede verloop van de sanering.


      2 De instelling is verplicht uitvoering te geven aan aanwijzingen als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018983/2022-01-01#Artikel8.5
  - number: '8.6'
    text: |-
      1 [Artikel 18 van de wet][ref1] is uitsluitend van toepassing op:

      a. instellingen die medisch specialistische zorg verlenen:

      1° die wordt verleend in combinatie met Zvw-verblijf;

      2° waarvoor op grond van de [Wet marktordening gezondheidszorg][ref2] een tarief is vastgesteld; en

      3° die behoort tot de ingevolge de [Zorgverzekeringswet][ref3] te verzekeren prestaties;

      b. instellingen die zorg verlenen in combinatie met Wlz-verblijf.

      2 In afwijking van het eerste lid geldt [artikel 18 van de wet][ref4] niet voor:

      a. kleinschalige woonvoorzieningen;

      b. de militair geneeskundige dienst, bedoeld in
      [artikel 1, eerste lid, onderdeel f, van de Wet ambtenaren defensie][ref5];

      c. rijksinstellingen als bedoeld in [artikel 1.1, eerste lid, onderdeel j, van de Wet forensische zorg][ref6];

      d. instellingen als bedoeld in [artikel 3.3, eerste lid, van de Wet forensische zorg][ref7].


