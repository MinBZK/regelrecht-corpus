  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Volksgezondheid, Welzijn en Sport van 27 september 2004, kenmerk Z/PB-
    2519449;


    Gelet op de artikelen 1, tweede en derde lid, 5, eerste, tweede en derde lid, 6, 7, derde lid, onder c, 9, eerste
    lid, onder b, 16 en 17, vierde lid, van de Wet toelating zorginstellingen;


    De Raad van State gehoord (advies van 23 november 2004, nr. W13.04.0473/III);


    Gezien het nader rapport van Onze Minister van Volksgezondheid, Welzijn en Sport van 27 oktober 2005, kenmerk MC/
    MO-2625487;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0018983/2022-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In dit besluit wordt, tenzij anders bepaald, verstaan onder:

      a. de wet: de [Wet toelating zorginstellingen][ref1];

      b. Wlz-verblijf: het verblijf, bedoeld in [artikel 3.1.1, eerste lid, onderdeel a, van de Wet langdurige zorg][ref2];

      c. Zvw-verblijf: het verblijf, omschreven in [artikel 2.12 van het Besluit zorgverzekering][ref3];

      d. kleinschalige woonvoorziening: instelling die:

      - bestaat uit een of meerdere zelfstandige woningen, dat wil zeggen woningen die naast één of meer privévertrekken
      een eigen voordeur, een eigen keuken, een eigen toilet en een eigen badkamer hebben;
      - een beperkte omvang heeft, dat wil zeggen dat deze huisvesting biedt aan ten hoogste zes personen; en
      - samen met andere in de directe omgeving gelegen zodanige voorzieningen aan niet meer dan 50 personen verblijf
      biedt.


      [ref1]: https://wetten.overheid.nl/BWBR0018906
      [ref2]: https://wetten.overheid.nl/BWBR0035917#Artikel3.1.1
      [ref3]: https://wetten.overheid.nl/BWBR0018492#Artikel2.12
    url: https://wetten.overheid.nl/BWBR0018983/2022-01-01#Artikel1.1
