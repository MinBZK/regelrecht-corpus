        artikel: '2.12'
  - number: '3.1'
    text: |-
      Als categorieën van instellingen waarvoor winstoogmerk is toegestaan, worden aangewezen instellingen die
      uitsluitend een of meer van de volgende vormen van zorg verlenen:

      - audiologische zorg;
      - behandeling van gedragswetenschappelijke aard in verband met een psychiatrische aandoening;
      - farmaceutische zorg;
      - huisartsenzorg;
      - kraamzorg;
      - medisch specialistische zorg, uitsluitend in verband met een psychiatrische aandoening en niet in combinatie met
      Zvw-verblijf;
      - mondzorg;
      - paramedische zorg;
      - persoonlijke verzorging, verpleging, begeleiding, schoonmaak van de woning of behandeling, anders dan behandeling
      van gedragswetenschappelijke aard in verband met een psychiatrische aandoening, indien deze vormen van zorg niet
      worden verleend in combinatie met Wlz-verblijf;
      - trombosezorg;
      - uitleen van verpleegartikelen;
      - verloskundige zorg;
      - verstrekken van hulpmiddelen;
      - vervoer;
      - zorg in een kleinschalige woonvoorziening.
    url: https://wetten.overheid.nl/BWBR0018983/2022-01-01#Artikel3.1
  - number: '8.1'
    text: |-
      In dit hoofdstuk wordt verstaan onder sanering: het geheel van de maatregelen die worden genomen op grond van een
      besluit als bedoeld in [artikel 17, eerste lid, van de wet][ref1] of ter uitvoering van een beslissing als bedoeld
      in [artikel 18 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0018906#Artikel18
    url: https://wetten.overheid.nl/BWBR0018983/2022-01-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0018906
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0018906
        artikel: '18'
  - number: '8.2'
    text: |-
      1 De financiële gevolgen van sanering, bedoeld in [artikel 17, eerste lid, van de wet][ref1] bestaan
      uit het verschil tussen de door het College sanering aanvaardbaar geachte lasten terzake van de sanering
      en de door het College sanering vastgestelde opbrengsten daarvan. Het College sanering stelt het
      verschil niet vast dan nadat de liquidatiebegroting is geverifieerd door een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2].

      2 Bij het vaststellen van de lasten terzake van sanering neemt het College sanering in beschouwing:

      a. onderbezettingsverliezen;

      b. uitkeringen aan werknemers of gewezen werknemers;

      c. uitkeringen aan personen die krachtens overeenkomst met de instelling voor eigen rekening een medisch beroep
      uitoefenen of hebben uitgeoefend;

      d. boekverliezen als gevolg van de vervreemding van zaken;

      e. andere uitgaven ten behoeve van de sanering.

      3 Voor de toepassing van het tweede lid blijven buiten beschouwing lasten die in aanmerking zijn genomen of kunnen
      worden genomen bij de vaststelling van een tarief als bedoeld in de [Wet marktordening gezondheidszorg][ref3].

      4 Bij het vaststellen van de opbrengsten van sanering neemt het College sanering in beschouwing de opbrengsten
      van vermogensbestanddelen die als gevolg van de sanering niet meer bij de instelling in gebruik zullen zijn, met
      uitzondering van de vermogensbestanddelen die naar het oordeel van het College sanering, gelet op hun herkomst en
      bestemming, behoren te worden uitgezonderd, alsmede opbrengsten die in aanmerking zijn genomen of kunnen worden
      genomen bij de vaststelling van een tarief als bedoeld in de [Wet marktordening gezondheidszorg][ref4].

      5 Het College sanering kan nadere regels stellen terzake van de lasten en opbrengsten bedoeld in de voorgaande
      leden.


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel393
      [ref3]: https://wetten.overheid.nl/BWBR0020078
      [ref4]: https://wetten.overheid.nl/BWBR0020078
