---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.5.2/schema.json
$id: lozingenbesluit_wvo_huishoudelijk_afvalwater
regulatory_layer: AMVB
publication_date: '2012-10-01'
valid_from: '2009-12-22'
bwb_id: BWBR0008512
url: https://wetten.overheid.nl/BWBR0008512/2009-12-22
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 1 februari 1996, nr RH 211 313, Hoofddirectie
    van de Waterstaat, Hoofdafdeling Bestuurlijke en Juridische Zaken, gedaan mede namens Onze Minister van
    Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

    Gelet op de artikelen 2a, eerste en tweede lid, 2b, 2c, tweede lid, van de Wet verontreiniging oppervlaktewateren;

    Gezien het advies van de Staatscommissie voor de waterstaatswetgeving (advies van 16 februari 1994);

    De Raad van State gehoord (advies van 18 juni 1996, nr. W09.96.0042);

    Gezien het nader rapport van Onze Ministers van Verkeer en Waterstaat en van Volkshuisvesting, Ruimtelijke Ordening
    en Milieubeheer van 23 januari 1997, nr. RH 97/1666, Hoofddirectie van de Waterstaat, Hoofdafdeling Bestuurlijke en
    Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel1
  - number: 1.1.a
    text: |-
      gebouw: een bouwwerk in de zin van [artikel 1, eerste lid, onder c, van de Woningwet][ref1], waaronder begrepen een
      woonschip dat uit hoofde van zijn feitelijke bestemming plaatsgebonden is;


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '1'
  - number: 1.1.b
    text: 'afvalwater: water dat afvalstoffen, verontreinigende of schadelijke stoffen bevat;'
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel1
  - number: 1.1.c
    text: |-
      huishoudelijk afvalwater: afvalwater afkomstig van particuliere huishoudens en ander afvalwater dat naar zijn aard
      en samenstelling overeenkomt met afvalwater afkomstig van een particulier huishouden;
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel1
  - number: 1.1.d
    text: 'lozen: in een oppervlaktewaterlichaam brengen van huishoudelijk afvalwater;'
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel1
  - number: 1.1.e
    text: 'bestaand lozen: lozen dat al vóór het tijdstip van inwerkingtreding van dit besluit plaatsvond;'
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel1
  - number: 1.1.f
    text: 'nieuw lozen: lozen dat geen bestaand lozen is;'
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel1
  - number: 1.1.g
    text: 'beperkt lozen: lozen van 10 inwonerequivalenten of minder;'
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel1
  - number: 1.1.h
    text: 'omvangrijk lozen: lozen van meer dan 10 doch niet meer dan 200 inwonerequivalenten;'
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel1
  - number: 1.1.i
    text: 'Onze Minister: Onze Minister van Verkeer en Waterstaat;'
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel1
  - number: 1.1.j
    text: |-
      wet: [Waterwet][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0025458
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0025458
  - number: 1.1.k
    text: |-
      riolering: voorziening voor de inzameling en het transport van stedelijk afvalwater als bedoeld in
      [artikel 10.33 van de Wet milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
  - number: '1.2'
    text: 'In dit besluit en de daarop rustende bepalingen wordt het aantal inwonerequivalenten als volgt bepaald:'
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel1
  - number: 1.2.a
    text: |-
      Voor lozen van huishoudelijk afvalwater afkomstig van particuliere huishoudens, of
      afkomstig van een voor recreatiedoeleinden bestemde woonruimte is het bepaalde in
      [artikel 122h, eerste en vijfde lid, van de Waterschapswet][ref1] van toepassing met dien verstande dat
      voor «vervuilingseenheden» en vervuilingseenheid» wordt gelezen: inwonerequivalenten onderscheidenlijk
      inwonerequivalent;


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel122h
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: 122h
  - number: 1.2.b
    text: |-
      Voor lozen van huishoudelijk afvalwater anders dan bedoeld onder a, wordt het aantal inwoner-equivalenten bepaald
      op 0,023 inwonerequivalent per m3 gebruikt water.
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel1
  - number: '1.3'
    text: |-
      Voor de toepassing van dit besluit en de daarop berustende bepalingen, wordt de afstand tot de dichtstbijzijnde
      riolering berekend langs de kortste lijn waarlangs de afvoerleidingen zonder overwegende bezwaren kunnen worden
      aangelegd. Bij bestaand lozen wordt de afstand berekend vanaf het gedeelte van het gebouw dat zich het dichtst bij
      een riolering bevindt. Indien bij bestaand lozen vanuit meerdere gebouwen gelegen op één perceel wordt geloosd,
      wordt de afstand berekend vanaf het gebouw dat het dichtst bij de riolering is gelegen. Bij nieuw lozen wordt de
      afstand berekend vanaf de kadastrale grens van het perceel waar het huishoudelijk afvalwater vrijkomt.
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel1
  - number: 1a
    text: |-
      Dit besluit berust op de [artikelen 6.2, eerste lid, onderdeel b, en tweede lid, onderdeel b][ref1], [6.6][ref2]
      en [6.7 van de Waterwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0025458
        artikel: '6'
  - number: '2'
    text: |-
      Dit besluit is niet van toepassing op het lozen van huishoudelijk afvalwater, waarvoor regels zijn gesteld bij een
      ander besluit krachtens [artikel 6.6 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
  - number: '3.1'
    text: |-
      De verboden gesteld in [artikel 6.2 van de wet][ref1], gelden niet ten aanzien van het lozen van uitsluitend
      huishoudelijk afvalwater. Degene die loost, voldoet aan de voorschriften die bij of krachtens dit besluit zijn
      gesteld, alsmede aan de krachtens die voorschriften door het bevoegd gezag gestelde nadere eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
  - number: '3.2'
    text: Het eerste lid geldt niet ten aanzien van lozen van meer dan 200 inwonerequivalenten.
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel3
  - number: '3.3'
    text: 'Het eerste lid geldt niet ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel3
  - number: 3.3.a
    text: nieuw beperkt lozen waarbij de afstand tot de dichtstbijzijnde riolering meer bedraagt dan 40 meter;
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel3
  - number: 3.3.b
    text: 'omvangrijk lozen waarbij de afstand tot de dichtstbijzijnde riolering ten minste bedraagt:'
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel3
  - number: 3.3.b.1°
    text: 100 m bij meer dan 10 doch minder dan 25 inwonerequivalenten;
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel3
  - number: 3.3.b.2°
    text: 600 m bij 25 tot 50 inwonerequivalenten;
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel3
  - number: 3.3.b.3°
    text: 1500 m bij 50 tot 100 inwonerequivalenten;
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel3
  - number: 3.3.b.4°
    text: 3000 m bij 100 doch niet meer dan 200 inwonerequivalenten.
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel3
  - number: '4'
    text: |-
      Het is verboden huishoudelijk afvalwater te lozen, dat stoffen bevat, die zijn versneden of vermalen door
      versnijdende of vermalende apparatuur.
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel4
  - number: '5'
    text: Beperkt lozen is verboden, indien de afstand tot de dichtstbijzijnde riolering 40 meter of minder bedraagt.
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel5
  - number: '6.1'
    text: |-
      Indien bij bestaand beperkt lozen de afstand tot de dichtstbijzijnde riolering meer dan 40 meter bedraagt, wordt
      het huishoudelijk afvalwater door een voorziening voor de individuele behandeling van afvalwater geleid, waarmee de
      nadelige gevolgen voor de kwaliteit van een oppervlaktewaterlichaam zoveel mogelijk worden voorkomen.
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel6
  - number: '6.2'
    text: |-
      Indien aan het betrokken oppervlaktewaterlichaam in een plan, vastgesteld ingevolge de de [wet][ref1], een
      bijzondere functie of waterkwaliteitsdoelstelling is toegekend, kan de beheerder bij nadere eis een voorziening
      voorschrijven die voor het behoud daarvan voldoende bescherming biedt.


      [ref1]: https://wetten.overheid.nl/BWBR0025458
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0025458
  - number: '7.1'
    text: |-
      Tenzij toepassing is gegeven aan [artikel 6, tweede lid][ref1], wordt alleen dan aan de eis van
      [artikel 6, eerste lid][ref2], voldaan, indien het huishoudelijk afvalwater wordt geleid door een septic tank die
      is uitgevoerd overeenkomstig de voorschriften gesteld krachtens het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008512#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008512#Artikel6
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008512
        artikel: '6'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0008512
        artikel: '6'
        hoofdstuk: II
  - number: '7.2'
    text: Onze Minister stelt voorschriften ten aanzien van de uitvoering van de septic tank.
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel7
  - number: '7.3'
    text: De septic tank wordt zo dikwijls geledigd als voor een goede werking daarvan noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel7
  - number: '7.4'
    text: Het is verboden de bij het ledigen van de septic tank vrijkomende stoffen te lozen.
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel7
  - number: '7.5'
    text: |-
      In afwijking van het eerste lid kan worden volstaan met een voorziening die wat het zuiveringsrendement betreft ten
      minste gelijkwaardig is aan een voorziening als bedoeld in dat lid, indien wordt voldaan aan door de beheerder te
      stellen nadere eisen ten aanzien van het zuiveringsrendement dan wel de doelmatigheid, het gebruik of het onderhoud
      van de voorziening.
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel7
  - number: '8'
    text: 'Omvangrijk lozen is verboden, indien de afstand tot de dichtstbijzijnde riolering minder bedraagt dan:'
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel8
  - number: 8.a
    text: 100 m bij meer dan 10 doch minder dan 25 inwonerequivalenten;
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel8
  - number: 8.b
    text: 600 m bij 25 tot 50 inwonerequivalenten;
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel8
  - number: 8.c
    text: 1500 m bij 50 tot 100 inwonerequivalenten;
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel8
  - number: 8.d
    text: 3000 m bij 100 doch niet meer dan 200 inwonerequivalenten.
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel8
  - number: '9.1'
    text: |-
      Degene die voornemens is het lozen te veranderen meldt dit voordat met het veranderende lozen wordt aangevangen aan
      de beheerder.
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel9
  - number: '9.2'
    text: 'Een melding als bedoeld in het eerste lid wordt schriftelijk gedaan en omvat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel9
  - number: 9.2.a
    text: de naam en het adres van degene die huishoudelijk afvalwater loost;
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel9
  - number: 9.2.b
    text: het adres van het gebouw waaruit het lozen plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel9
  - number: 9.2.c
    text: de reden van de melding;
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel9
  - number: 9.2.d
    text: gegevens op grond waarvan het aantal inwonerequivalenten kan worden bepaald;
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel9
  - number: 9.2.e
    text: gegevens waaruit kan worden afgeleid hoeveel meter de afstand tot de dichtstbijzijnde riolering bedraagt;
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel9
  - number: 9.2.f
    text: |-
      gegevens met betrekking tot de wijze van lozen en de voorziening, bedoeld in [artikel 6, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008512#Artikel6
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008512
        artikel: '6'
        hoofdstuk: II
  - number: '10'
    text: |-
      Degene die huishoudelijk afvalwater loost vanuit een gebouw, dat niet een inrichting is waarop de
      [Wet milieubeheer][ref1] van toepassing is en waarin zich een ongewoon voorval voordoet of heeft voorgedaan,
      waardoor nadelige gevolgen voor de kwaliteit van het ontvangende oppervlaktewaterlichaam zijn ontstaan of dreigen
      te ontstaan, maakt zo spoedig mogelijk melding van dat voorval aan de beheerder binnen wiens gebied als gevolg van
      dit ongewone voorval het lozen heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '11'
    text: |-
      Indien een vergunning geldt krachtens [artikel 6.2 van de wet][ref1] en [artikel 14][ref2] of [16][ref3] van
      toepassing is, blijven de voorschriften van toepassing, gesteld in die vergunning gedurende de periode, bedoeld in
      de desbetreffende bepaling.


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008512#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0008512#Artikel16
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0008512
        artikel: '14'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0008512
        artikel: '16'
        hoofdstuk: V
  - number: '14'
    text: |-
      Indien bij beperkt lozen de afstand tot de dichtstbijzijnde riolering 40 meter of minder wordt, is het, in
      afwijking van [artikel 5][ref1], toegestaan gedurende vijf jaar te lozen vanaf het tijdstip waarop aansluiting op
      die riolering mogelijk is, indien het afvalwater voorafgaand aan het lozen door een voorziening wordt geleid die
      voldoet aan de voorschriften gesteld krachtens de [artikelen 6][ref2] en [7][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008512#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0008512#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0008512#Artikel7
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008512
        artikel: '5'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0008512
        artikel: '6'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0008512
        artikel: '7'
        hoofdstuk: II
  - number: '16'
    text: |-
      Indien bij omvangrijk lozen binnen de in [artikel 8][ref1], aangegeven afstand riolering wordt aangelegd, is
      het vanaf het tijdstip waarop aansluiting daarop mogelijk is, in afwijking van dat artikel toegestaan te lozen
      gedurende:


      [ref1]: https://wetten.overheid.nl/BWBR0008512#Artikel8
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0008512
        artikel: '8'
        hoofdstuk: III
  - number: 16.a
    text: |-
      10 jaar, indien ingevolge een vergunning als bedoeld in [artikel 6.2 van de wet][ref1] een voorziening voor de
      individuele behandeling van afvalwater was voorgeschreven;


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
  - number: 16.b
    text: 3 jaar, in de overige gevallen.
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel16
  - number: '18'
    text: |-
      Dit besluit treedt in werking met ingang van de eerste dag van de tweede kalendermaand na de datum van uitgifte van
      het *Staatsblad* waarin het wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel18
  - number: '19'
    text: 'Dit besluit wordt aangehaald als: Lozingenbesluit Wvo huishoudelijk afvalwater.'
    url: https://wetten.overheid.nl/BWBR0008512/2009-12-22#Artikel19
