---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_geluidproduktie_bromfietsen
regulatory_layer: AMVB
publication_date: '2015-09-04'
valid_from: '1998-12-18'
bwb_id: BWBR0003834
url: https://wetten.overheid.nl/BWBR0003834/1998-12-18
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 25 januari 1985,
    MJZ 2515019, gedaan in overeenstemming met de Staatssecretaris van Verkeer en Waterstaat en Onze Minister van
    Economische Zaken;

    Gelet op de artikelen 2, 4, 6 en 147a van de Wet geluidhinder (Stb. 1979, 99);

    Gehoord de Centrale Raad voor de Milieuhygiëne (advies van 7 juni 1982, no. 451);

    De Raad van State gehoord (advies van 22 april 1985, no. W08.85.0053/21.5.16.);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer a.i. van 7
    augustus 1985, nr. MJZ 0785025, uitgebracht in overeenstemming met de Staatssecretaris van Verkeer en Waterstaat en
    Onze Minister van Economische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003834/1998-12-18#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Voor de toepassing van dit besluit wordt verstaan onder Onze Ministers: Onze Ministers van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer, van Verkeer en Waterstaat en van Economische Zaken te zamen.
    url: https://wetten.overheid.nl/BWBR0003834/1998-12-18#Artikel1
  - number: '2'
    text: |-
      Het is verboden bromfietsen te vervaardigen, in te voeren, in voorraad te hebben, te koop aan te bieden, af te
      leveren of te vervoeren, die niet behoren tot een type dat:
    url: https://wetten.overheid.nl/BWBR0003834/1998-12-18#Artikel2
  - number: 2.a
    text: |-
      hetzij is goedgekeurd bij een keuring, door de Dienst Wegverkeer of een andere door Onze Minister van Verkeer en
      Waterstaat aangewezen instantie verricht aan de hand van de krachtens [artikel 4][ref1] vastgestelde voorschriften;


      [ref1]: https://wetten.overheid.nl/BWBR0003834#Artikel4
    url: https://wetten.overheid.nl/BWBR0003834/1998-12-18#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003834
        artikel: '4'
        hoofdstuk: III
  - number: 2.b
    text: |-
      hetzij blijkens een goedkeuringscertificaat als bedoeld in artikel 4, vierde lid, van [richtlijn nr. 92/61/EEG]
      (31992L0061) van de Raad van de Europese Gemeenschappen van 30 juni 1992 betreffende de goedkeuring van twee- of
      driewielige motorvoertuigen (PbEG L 225) voldoet aan de voorschriften van hoofdstuk 9 van [richtlijn nr. 97/24/
      EG](31997L0024) van het Europees Parlement en de Raad van de Europese Unie van 17 juni 1997 betreffende bepaalde
      onderdelen of eigenschappen van motorvoertuigen op twee of drie wielen (PbEG L 226).
    url: https://wetten.overheid.nl/BWBR0003834/1998-12-18#Artikel2
  - number: '3.1'
    text: |-
      Het in [artikel 2][ref1] bepaalde geldt niet indien de handelingen geschieden met het oog op het buiten Nederland
      in de handel brengen van bromfietsen.


      [ref1]: https://wetten.overheid.nl/BWBR0003834#Artikel2
    url: https://wetten.overheid.nl/BWBR0003834/1998-12-18#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003834
        artikel: '2'
        hoofdstuk: II
  - number: '3.2'
    text: |-
      Het in [artikel 2][ref1] bepaalde geldt voorts niet ten aanzien van bromfietsen:


      [ref1]: https://wetten.overheid.nl/BWBR0003834#Artikel2
    url: https://wetten.overheid.nl/BWBR0003834/1998-12-18#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003834
        artikel: '2'
        hoofdstuk: II
  - number: 3.2.a
    text: die zich in het kader van bedrijfsmatige vervaardiging nog bevinden in het stadium van beproeving of onderzoek;
    url: https://wetten.overheid.nl/BWBR0003834/1998-12-18#Artikel3
  - number: 3.2.b
    text: die dienen als monster bij een ingevolge dit besluit te verrichten keuring;
    url: https://wetten.overheid.nl/BWBR0003834/1998-12-18#Artikel3
  - number: 3.2.c
    text: |-
      waarmee blijkens een voor de bromfiets ingevolge [hoofdstuk 7 van het Voertuigreglement][ref1] afgegeven ontheffing
      uitsluitend op de weg mag worden gereden om te worden tentoongesteld of om aan overeenkomstige manifestaties te
      kunnen deelnemen;


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0003834/1998-12-18#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006746
        hoofdstuk: '7'
  - number: 3.2.d
    text: |-
      die hebben behoord tot een type als bedoeld in [artikel 2][ref1] en als bromfiets in gebruik zijn geweest, maar
      die door reparaties of door vervanging van onderdelen niet langer tot dat type behoren, mits de verschillen met
      het oorspronkelijke type niet tot een hogere geluidproduktie leiden dan die welke bij de typegoedkeuring werd
      vastgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0003834#Artikel2
    url: https://wetten.overheid.nl/BWBR0003834/1998-12-18#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003834
        artikel: '2'
        hoofdstuk: II
  - number: 3.2.e
    text: |-
      waarvoor door of vanwege Onze Ministers ontheffing is verleend. Aan een ontheffing kunnen voorschriften worden
      verbonden.
    url: https://wetten.overheid.nl/BWBR0003834/1998-12-18#Artikel3
  - number: '4.1'
    text: |-
      Onze Ministers stellen de voorschriften vast, aan de hand waarvan de in [artikel 2, onder ][ref1] bedoelde keuring
      wordt verricht. Deze voorschriften hebben betrekking op de eigenschappen of onderdelen van bromfietsen die bepalend
      zijn voor de geluidproduktie van deze bromfietsen, alsmede op het keuringsproces.


      [ref1]: https://wetten.overheid.nl/BWBR0003834#Artikel2
    url: https://wetten.overheid.nl/BWBR0003834/1998-12-18#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003834
        artikel: '2'
        hoofdstuk: II
  - number: '4.2'
    text: |-
      [Artikel 22, eerste en derde lid, van de Wegenverkeerswet 1994][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel22
    url: https://wetten.overheid.nl/BWBR0003834/1998-12-18#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '22'
  - number: '10'
    text: |-
      In geval van wijziging van de keuringsvoorschriften als bedoeld in [artikel 4][ref1] die ten grondslag hebben
      gelegen aan een goedkeuring als bedoeld in [artikel 2, onder a en onder b][ref2], kunnen Onze Ministers in hun
      regeling tot wijziging van die voorschriften bepalen, dat bij het verstrijken van een daarbij te stellen termijn
      die goedkeuring ophoudt te gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0003834#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003834#Artikel2
    url: https://wetten.overheid.nl/BWBR0003834/1998-12-18#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003834
        artikel: '4'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003834
        artikel: '2'
        hoofdstuk: II
  - number: '11.1'
    text: |-
      Met betrekking tot bromfietsen die voor het in werking treden van dit besluit in Nederland voor het gebruik op
      de weg waren toegelaten, geldt [artikel 2][ref1] slechts voor wat betreft het verbod om te vervaardigen of in te
      voeren, en wel vanaf een jaar na de datum van uitgifte van het *Staatsblad* waarin dit besluit wordt geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0003834#Artikel2
    url: https://wetten.overheid.nl/BWBR0003834/1998-12-18#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003834
        artikel: '2'
        hoofdstuk: II
  - number: '11.2'
    text: |-
      Voor bromfietsen als bedoeld in het eerste lid geldt het verbod om in te voeren van voor het in werking treden van
      dit besluit vervaardigde bromfietsen niet.
    url: https://wetten.overheid.nl/BWBR0003834/1998-12-18#Artikel11
  - number: '12'
    text: |-
      Bromfietsen als bedoeld in artikel 11, eerste lid, waarvoor een goedkeuring is verkregen op grond van een
      keuring waarbij de bromfiets bleek te voldoen aan keuringsvoorschriften die naar het oordeel van Onze Ministers
      gelijkwaardig zijn aan de keuringsvoorschriften, geldende krachtens artikel 4, eerste lid, worden gelijkgesteld met
      bromfietsen, behorende tot een type als bedoeld in artikel 2.
    url: https://wetten.overheid.nl/BWBR0003834/1998-12-18#Artikel12
  - number: '13'
    text: |-
      Dit besluit treedt in werking met ingang van de zevende kalendermaand na de datum van uitgifte van het *Staatsblad*
      waarin het wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0003834/1998-12-18#Artikel13
  - number: '14'
    text: 'Dit besluit kan worden aangehaald als: Besluit geluidproduktie bromfietsen.'
    url: https://wetten.overheid.nl/BWBR0003834/1998-12-18#Artikel14
