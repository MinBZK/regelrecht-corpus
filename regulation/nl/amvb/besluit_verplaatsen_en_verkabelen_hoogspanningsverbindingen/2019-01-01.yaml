$id: besluit_verplaatsen_en_verkabelen_hoogspanningsverbindingen
regulatory_layer: AMVB
publication_date: '2025-11-12'
valid_from: '2019-01-01'
bwb_id: BWBR0041451
url: https://wetten.overheid.nl/BWBR0041451/2019-01-01
preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Economische Zaken en Klimaat van 9 mei 2018, nr. WJZ /18034248;

    Gelet op artikel 22a, zevende lid, van de Elektriciteitswet 1998;

    De Afdeling advisering van de Raad van State gehoord (advies van 20 juni 2018, nr. W18.18.0112/IV);

    Gezien het nader rapport van Onze Minister van Economische Zaken en Klimaat van 1 oktober 2018, nr. WJZ /18247312;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0041451/2019-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder: - *wet:* [Elektriciteitswet 1998][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755
    url: https://wetten.overheid.nl/BWBR0041451/2019-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009755
  - number: '2.1'
    text: |-
      De indiener van een verzoek tot verplaatsing of vervanging als bedoeld in
      [artikel 22a, eerste lid, van de wet][ref1], betreffende een deel van een net dat is aangewezen op grond van
      onderdeel b van dat artikellid, of tot het doen van een onderzoek als bedoeld in het vierde lid van dat artikel,
      betaalt van de kosten voor de uitvoering van het betreffende verzoek:


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel22a
    url: https://wetten.overheid.nl/BWBR0041451/2019-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 22a
  - number: 2.1.a
    text: 20%, indien het deel zich bevindt in een gemeente met meer dan 30.000 inwoners, of
    url: https://wetten.overheid.nl/BWBR0041451/2019-01-01#Artikel2
  - number: 2.1.b
    text: 15%, indien het deel zich bevindt in een gemeente met ten hoogste 30.000 inwoners.
    url: https://wetten.overheid.nl/BWBR0041451/2019-01-01#Artikel2
  - number: '2.2'
    text: |-
      In afwijking van het eerste lid betaalt de indiener voor de uitvoering van de verzoeken, bedoeld in het eerste lid,
      tezamen, een bedrag dat wordt berekend door € 975.000,– te vermenigvuldigen met het aantal kilometers, afgerond op
      één cijfer achter de komma, waaruit het aan te leggen deel bestaat, voor zover dat bedrag lager is dan het bedrag
      dat de indiener op grond van het eerste lid zou betalen.
    url: https://wetten.overheid.nl/BWBR0041451/2019-01-01#Artikel2
  - number: '2.3'
    text: |-
      De inwonertallen, bedoeld in het eerste lid, worden bepaald aan de hand van de door het Centraal Bureau voor de
      Statistiek bekend gemaakte gegevens betreffende de bevolkingscijfers per 1 januari van het jaar waarin het verzoek
      tot het doen van onderzoek als bedoeld in [artikel 22a, vierde lid][ref1], is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel22a
    url: https://wetten.overheid.nl/BWBR0041451/2019-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 22a
  - number: '2.4'
    text: |-
      Het in het tweede lid genoemde bedrag is uitgedrukt in het prijspeil van 2018 en wordt jaarlijks per 1 januari
      geïndexeerd volgens de door het Centraal Bureau voor de Statistiek gepubliceerde inputprijsindex voor Grond- weg-
      en waterbouw. Voor de berekening van het verschuldigde bedrag vindt de bijstelling van het bedrag plaats tot en met
      het jaar waarin het verzoek tot verplaatsing of vervanging, bedoeld in [artikel 22a, eerste lid, van de wet][ref1]
      is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel22a
    url: https://wetten.overheid.nl/BWBR0041451/2019-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 22a
  - number: '3.1'
    text: |-
      De indiener van verzoeken als bedoeld in [artikel 22a, zesde lid, tweede of laatste volzin van de wet][ref1],
      betaalt 10% van de kosten voor de uitvoering van het verzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel22a
    url: https://wetten.overheid.nl/BWBR0041451/2019-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 22a
  - number: '3.2'
    text: |-
      In afwijking van het eerste lid betaalt de indiener voor de uitvoering van de verzoeken, bedoeld in het eerste lid,
      tezamen, een bedrag dat wordt berekend door € 975.000,– te vermenigvuldigen met het aantal kilometers, afgerond op
      één cijfer achter de komma, waaruit het aan te leggen deel bestaat, voor zover dat bedrag lager is dan het bedrag
      dat de indiener op grond van het eerste lid zou betalen. [Artikel 2, vierde lid][ref1], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0041451#Artikel2
    url: https://wetten.overheid.nl/BWBR0041451/2019-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0041451
        artikel: '2'
  - number: '4.1'
    text: |-
      Als kosten voor de uitvoering van een verzoek tot het doen van onderzoek als bedoeld in
      [artikel 22a, vierde lid of zesde lid, tweede volzin, van de wet][ref1], worden aangemerkt de kosten die de
      netbeheerder voorafgaand aan de investeringsbeslissing van de indiener maakt:


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel22a
    url: https://wetten.overheid.nl/BWBR0041451/2019-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 22a
  - number: 4.1.a
    text: voortvloeiend uit overeenkomsten van opdracht;
    url: https://wetten.overheid.nl/BWBR0041451/2019-01-01#Artikel4
  - number: 4.1.b
    text: voor personele inzet;
    url: https://wetten.overheid.nl/BWBR0041451/2019-01-01#Artikel4
  - number: 4.1.c
    text: |-
      voor andere zaken of werkzaamheden die zijn toe te rekenen aan de uitvoering van het verzoek tot het doen van
      onderzoek.
    url: https://wetten.overheid.nl/BWBR0041451/2019-01-01#Artikel4
  - number: '4.2'
    text: |-
      Als kosten voor de uitvoering van een verplaatsing of vervanging als bedoeld in
      [artikel 22a, eerste lid en zesde lid, laatste volzin][ref1], worden aangemerkt de kosten die de netbeheerder na de
      investeringsbeslissing van de indiener maakt:


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel22a
    url: https://wetten.overheid.nl/BWBR0041451/2019-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 22a
  - number: 4.2.a
    text: voor het opstellen van een ontwerp voor vervanging of verplaatsing van het betreffende deel van het net;
    url: https://wetten.overheid.nl/BWBR0041451/2019-01-01#Artikel4
  - number: 4.2.b
    text: voor materiële en personele inzet;
    url: https://wetten.overheid.nl/BWBR0041451/2019-01-01#Artikel4
  - number: 4.2.c
    text: |-
      voortvloeiend uit een voor de realisatie gesloten overeenkomst van aanneming van werk of de levering van diensten
      en materialen;
    url: https://wetten.overheid.nl/BWBR0041451/2019-01-01#Artikel4
  - number: 4.2.d
    text: voor de verwerving van een onroerende zaak of de vestiging van een beperkt recht op een onroerende zaak;
    url: https://wetten.overheid.nl/BWBR0041451/2019-01-01#Artikel4
  - number: 4.2.e
    text: voor het verwijderen van resterende onderdelen van het te vervangen of te verplaatsen deel van het net;
    url: https://wetten.overheid.nl/BWBR0041451/2019-01-01#Artikel4
  - number: 4.2.f
    text: voor herstel van de terreinen waar verplaatsing of vervanging heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0041451/2019-01-01#Artikel4
  - number: 4.2.g
    text: voor communicatie over de uit te voeren werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0041451/2019-01-01#Artikel4
  - number: 4.2.h
    text: voor andere zaken of werkzaamheden die zijn toe te rekenen aan de uitvoering van de verplaatsing of vervanging.
    url: https://wetten.overheid.nl/BWBR0041451/2019-01-01#Artikel4
  - number: '4.3'
    text: |-
      Op de kosten voor de uitvoering van een verzoek tot verplaatsing of vervanging als bedoeld in het tweede lid worden
      in mindering gebracht:
    url: https://wetten.overheid.nl/BWBR0041451/2019-01-01#Artikel4
  - number: 4.3.a
    text: |-
      kosten voor voorgenomen investeringen in het te verplaatsen of te vervangen deel van het net, voor zover de
      investering was voorzien in een ten tijde van het verzoek laatst vastgestelde investeringsplan als bedoeld in
      [artikel 21 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel21
    url: https://wetten.overheid.nl/BWBR0041451/2019-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '21'
  - number: 4.3.b
    text: |-
      eventuele aan de netbeheerder toekomende opbrengsten vanwege het vrijkomen van een onroerende zaak door de
      verplaatsing of vervanging.
    url: https://wetten.overheid.nl/BWBR0041451/2019-01-01#Artikel4
  - number: '4.4'
    text: |-
      Als kosten voor de uitvoering van een verzoek als bedoeld in het eerste of tweede lid worden niet aangemerkt de
      kosten die door een college van burgemeester en wethouders of van gedeputeerde staten worden gemaakt, waaronder
      kosten voor de voorbereiding van voor de verplaatsing of vervanging benodigde besluiten.
    url: https://wetten.overheid.nl/BWBR0041451/2019-01-01#Artikel4
  - number: '5'
    text: |-
      Indien een netbeheerder onvoldoende capaciteit heeft om aan alle ontvangen verzoeken tot verplaatsing of vervanging
      gelijktijdig uitvoering te geven, hanteert de netbeheerder de volgorde van binnenkomst van de verzoeken als
      uitgangspunt voor de volgorde van uitvoering.
    url: https://wetten.overheid.nl/BWBR0041451/2019-01-01#Artikel5
  - number: '6'
    text: |-
      De aanvraag, bedoeld in [artikel 22a, vijfde lid, van de wet][ref1], bevat een beschrijving waarin wordt onderbouwd
      dat het vervangen of verplaatsen van dat deel technisch of ruimtelijk niet haalbaar is of strijdig is met het
      belang van leveringszekerheid.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel22a
    url: https://wetten.overheid.nl/BWBR0041451/2019-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 22a
  - number: '7'
    text: |-
      Een verzoek als bedoeld is [artikel 22a, zesde lid, eerste volzin][ref1],
      kan worden ingediend tot 2 jaren na het tijdstip waarop het bij
      __REF001___________________________________________________________________________________________________________
      _________________________________________________________ () tot wet is of wordt verheven en die wet in werking
      treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel22a
      [ref2]: https://wetten.overheid.nl/BWBR0040852
    url: https://wetten.overheid.nl/BWBR0041451/2019-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 22a
      - id: ref2
        bwb_id: BWBR0040852
  - number: '8'
    text: 'Dit besluit wordt aangehaald als: Besluit verplaatsen en verkabelen hoogspanningsverbindingen.'
    url: https://wetten.overheid.nl/BWBR0041451/2019-01-01#Artikel8
  - number: '9'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0041451/2019-01-01#Artikel9
