  - number: B 21
    text: |-
      De betaling van de bekostigingsbedragen voor personeelskosten vindt maandelijks plaats in een bij ministeriële
      regeling vast te stellen betaalritme dat voor verschillende delen van de bekostiging verschillend kan worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003833/2007-02-21#ArtikelB_21
  - number: B 22
    text: |-
      1 De bekostiging wordt beëindigd op 1 augustus indien het aantal leerlingen gedurende 3 achtereenvolgende
      schooljaren telkens minder heeft bedragen dan 10.

      2 De bekostiging van een bijzondere school wordt niet beëindigd binnen de eerste 5 jaren van bekostiging van de
      school.
    url: https://wetten.overheid.nl/BWBR0003833/2007-02-21#ArtikelB_22
  - number: B 23
    text: |-
      1 Indien gebouwen, terreinen of roerende zaken van scholen, ten behoeve waarvan een vergoeding is genoten, geheel
      of gedeeltelijk aan hun bestemming worden onttrokken of met toestemming van Onze Minister worden vervreemd, anders
      dan bedoeld in artikel 56 van de wet, dan wel indien de bekostiging wordt beëindigd, is het bevoegd gezag van een
      bijzondere school aan het Rijk een bedrag verschuldigd. Het bevoegd gezag kan, buiten het geval van vervreemding,
      in plaats van betaling van dit bedrag de eigendom van die gebouwen, terreinen of roerende zaken, binnen 4 maanden
      aan het Rijk overdragen.

      2 Onze Minister stelt na overleg met het bevoegd gezag het bedrag bedoeld in het eerste lid, vast op de grondslag
      van de waarde van de gebouwen, terreinen of roerende zaken en de door het bevoegd gezag daarvoor ontvangen
      vergoedingen en uit eigen middelen bestede gelden.
    url: https://wetten.overheid.nl/BWBR0003833/2007-02-21#ArtikelB_23
  - number: C 1
    text: |-
      1 Het onderwijs aan varende kinderen wordt verzorgd door de school voor varende kinderen.

      2 Het bevoegd gezag van de school voor varende kinderen houdt een hoofdvestiging in stand en kan in een of meer
      andere gemeenten een vestiging in stand houden waar onderwijs aan varende kinderen wordt verzorgd.
    url: https://wetten.overheid.nl/BWBR0003833/2007-02-21#ArtikelC_1
  - number: C 2
    text: |-
      1 Het onderwijs aan varende kinderen is het onderwijs bestemd voor kinderen van 3,5 tot omstreeks 7 jaar die aan
      boord wonen bij hun ouders, die het schippersbedrijf uitoefenen.

      2 De inspecteur kan toestemming verlenen dat andere kinderen dan bedoeld in het eerste lid, van wie de ouders een
      trekkend bestaan leiden, tot het onderwijs aan varende kinderen worden toegelaten.
    url: https://wetten.overheid.nl/BWBR0003833/2007-02-21#ArtikelC_2
  - number: C 3
    text: |-
      1 [Artikel 9 van de wet][ref1] is van overeenkomstige toepassing, met dien verstande dat de verplichting tot het
      geven van onderwijs in de Engelse en Friese taal niet bestaat. Het onderwijs aan varende kinderen legt mede de
      grondslag voor het volgen van aansluitend basisonderwijs.

      2 Het onderwijs aan varende kinderen wordt verzorgd:

      a. in onderwijsruimten op plaatsen waar de school voor varende kinderen of een vestiging van deze school in stand
      wordt gehouden;

      b. aan boord, door middel van:

      1 e boordbezoek,

      2 e afstandsonderwijs door middel van vormen van telecommunicatie, dan wel

      3 e speelwerkpakketten

      3 Een leerling is gehouden het onderwijs, bedoeld in het tweede lid, onderdeel a, te volgen indien de afstand
      tussen de ligplaats van het schip waar de leerling aan boord woont en de school voor varende kinderen of een
      vestiging van deze school minder bedraagt dan 5 kilometer, gemeten langs de kortste voor de leerling voldoende
      begaanbare en veilige weg.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel9
    url: https://wetten.overheid.nl/BWBR0003833/2007-02-21#ArtikelC_3
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '9'
  - number: C 9
    text: |-
      1 Een kind kan als leerling tot de school voor varende kinderen worden toegelaten indien het de leeftijd van 3,5
      jaar heeft bereikt.

      2 Een leerling verlaat de school voor varende kinderen in elk geval na afloop van het schooljaar waarin deze de
      leeftijd van 7 jaar heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0003833/2007-02-21#ArtikelC_9
