  - number: C 13
    text: |-
      1 Het Rijk bekostigt ten behoeve van elk kalenderjaar de uitgaven voor voorzieningen in de huisvesting en voor de
      materiële instandhouding.

      2 De bekostiging van voorzieningen in de huisvesting en voor de materiële instandhouding ten behoeve van
      een kalenderjaar, bestaat uit een vast bedrag, verhoogd met een bedrag voor elke leerling, bedoeld in
      [artikel C 11, derde lid][ref1].

      3 De bekostiging, bedoeld in het tweede lid, wordt jaarlijks aangepast overeenkomstig de prijsmutatie van de netto
      materiële consumptie, zoals opgenomen in de Macro Economische Verkenning, die naar verwachting zal optreden tussen
      het prijsniveau in het kalenderjaar waarvoor de bekostiging wordt vastgesteld en het prijsniveau in het daaraan
      voorafgaande jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003833#ArtikelC_11
