  - number: B 20
    text: |-
      1 Onze Minister stelt jaarlijks uiterlijk op 15 april, de bekostigingsbedragen, bedoeld in de
      [artikelen B 16b][ref1] en [B 16g][ref2] vast. De bedragen hebben betrekking op een schooljaar.

      2 De in het eerste lid bedoelde bekostigingsbedragen kunnen gedurende het schooljaar door Onze Minister worden
      gewijzigd wegens algemene salarismaatregelen of wegens andere al dan niet uit de rijksbegroting voortvloeiende
      maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0003833#ArtikelB_16b
