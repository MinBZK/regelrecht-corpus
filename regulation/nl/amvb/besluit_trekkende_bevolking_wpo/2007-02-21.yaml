  - number: C 19
    text: |-
      Indien een andere school voor basisonderwijs tijdelijk het onderwijs verzorgt aan een of meer leerlingen die zijn
      ingeschreven bij de school voor varende kinderen, ontvangt die andere school voor basisonderwijs ondersteuning door
      de school voor varende kinderen en kan die andere school voor basisonderwijs een vergoeding ontvangen volgens een
      regeling die het bevoegd gezag van de school voor varende kinderen met het bevoegd gezag van die andere school voor
      basisonderwijs overeenkomt.
    url: https://wetten.overheid.nl/BWBR0003833/2007-02-21#ArtikelC_19
  - number: C 20
    text: |-
      De bekostiging van de school voor varende kinderen wordt beëindigd indien het aantal ingeschreven leerlingen in het
      eerste en derde schooljaar van 3 achtereenvolgende schooljaren telkens minder heeft bedragen dan 50.
    url: https://wetten.overheid.nl/BWBR0003833/2007-02-21#ArtikelC_20
  - number: G 1
    text: |-
      De verplichte formatie voor het schooljaar 1985-1986 wordt vastgesteld aan de hand van:

      a. het gemiddeld aantal leerlingen van de hoogste dagtellingen van de maanden september 1984 tot en met april 1985
      voor scholen als bedoeld in titel B en titel C;

      b. de som van het gemiddeld aantal leerlingen van de hoogste dagtellingen van de maanden september 1984 tot en met
      april 1985 van de kernafdeling en de afdeling zeer jeugdigen bedoeld in het Besluit buitengewoon onderwijs 1967
      (*Stb.* 1978, 582) voor scholen als bedoeld in titel D, en afdelingen als bedoeld in titel E;

      c. het aantal leerlingen op 16 april 1985 voor scholen als bedoeld in titel F.
    url: https://wetten.overheid.nl/BWBR0003833/2007-02-21#ArtikelG_1
  - number: G 1.a
    text: |-
      In afwijking van artikel B 16*k*.1, eerste lid, geldt:

      a. indien de som van de aantallen formatieplaatsen op de school berekend op grond van artikel B 16e en artikel B
      16k, zoals dat artikel luidde tot 1 augustus 1998, op 1 oktober van het voorafgaande schooljaar kleiner is dan 7,4:

      1°. voor het schooljaar 1994-1995 een percentage van 1,5%, met dien verstande dat na de afronding op grond van
      artikel B 16*k*.1, tweede lid, de uitkomst van deze berekening wordt verminderd met de opslag ten behoeve van
      schoolspecifiek formatie- en personeelsbeleid voor het schooljaar 1994-1995 als bedoeld in artikel B 16*i*.3,

      2°. voor het schooljaar 1995-1996 een percentage van 2,0%,

      3°. voor het schooljaar 1996-1997 een percentage van 2,6%, of

      b. indien de som van de aantallen formatieplaatsen op de school berekend op grond van artikel B 16e en artikel B
      16k, zoals dat artikel luidde tot 1 augustus 1998, op 1 oktober van het voorafgaande schooljaar gelijk is aan of
      groter is dan 7,4:

      1°. voor het schooljaar 1994-1995 een percentage van 2,5%, met dien verstande dat na de afronding op grond van
      artikel B 16*k*.1, tweede lid, de uitkomst van deze berekening wordt verminderd met de opslag ten behoeve van
      schoolspecifiek formatie- en personeelsbeleid voor het schooljaar 1994-1995 als bedoeld in artikel B 16*i*.3,

      2°. voor het schooljaar 1995-1996 een percentage van 3,8%,

      3°. voor het schooljaar 1996-1997 een percentage van 4,9%.
    url: https://wetten.overheid.nl/BWBR0003833/2007-02-21#ArtikelG_1.a
  - number: G 1.b
    text: |-
