  - number: C 11
    text: |-
      1 Aan de school wordt voor de bekostiging van personeelskosten een vast bedrag per school toegekend. Het vaste
      bedrag per school is het bedrag dat de uitkomst is van de vermenigvuldiging van 4,1899 formatieplaats en een bij
      ministeriële regeling vast te stellen bedrag.

      2 Voor de bekostiging van personeel wordt tevens per leerling een bedrag toegekend welk bedrag de uitkomst is van
      0,0545 formatieplaats vermenigvuldigd met een bij ministeriële regeling vast te stellen bedrag.

      3 Bij de toepassing van het tweede lid wordt uitgegaan van het aantal leerlingen, bedoeld in [artikel C 2][ref1],
      dat op 1 oktober van het voorafgaande schooljaar, aan de school voor varende kinderen is ingeschreven. Het bevoegd
      gezag van de school voor varende kinderen zendt de telling van het aantal leerlingen voor 15 oktober van het
      desbetreffende jaar aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003833#ArtikelC_2
    url: https://wetten.overheid.nl/BWBR0003833/2007-02-21#ArtikelC_11
