  - number: C 17
    text: |-
      De [artikelen 140 tot en met 147 van de wet][ref1] zijn van overeenkomstige toepassing, met dien verstande dat:

      a. in [artikel 142, tweede en derde lid][ref2], «nevenvestiging» wordt gelezen als: vestiging, bedoeld in
      [artikel C 1, tweede lid][ref3], van het Besluit trekkende bevolking WPO;

      b. in [artikel 144, eerste lid onder d1e][ref4], «[artikel 137, derde lid][ref5]» wordt gelezen als:
      [artikel C 16, eerste lid onder a][ref6], van het Besluit trekkende bevolking WPO, en

      c. in [artikel 144, eerste lid onder d2e][ref7], «[artikel 137, eerste lid onder b][ref8]» wordt gelezen als:
      [artikel C 16, eerste lid onder b][ref9], van het Besluit trekkende bevolking WPO.


