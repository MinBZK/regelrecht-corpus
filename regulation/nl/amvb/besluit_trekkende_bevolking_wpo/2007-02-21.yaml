articles:
  - number: A 1
    text: |-
      In dit besluit wordt verstaan onder:

      *wet*: [Wet op het primair onderwijs][ref1];

      *school*: een basisschool als bedoeld in de [titels B][ref2] en [C van dit besluit][ref3], tenzij het tegendeel
      blijkt;

      *schooljaar*: het tijdvak van 1 augustus tot en met 31 juli daaraanvolgend voor zover in dit besluit niet anders
      is bepaald.

      leerling met een niet-Nederlandse culturele achtergrond: leerling:

      a. die behoort tot de Molukse bevolkingsgroep,

      b. van wie ten minste een van de ouders of voogden afkomstig is uit Griekenland, Italië, het voormalige
      Joegoslavië, Kaapverdië, Marokko, Portugal, Spanje, Tunesië of Turkije,

      c. van wie ten minste een van de ouders of voogden afkomstig is uit Suriname, de Nederlandse Antillen of Aruba,

      d. van wie ten minste een van de ouders of voogden als vreemdeling rechtmatig verblijf heeft op grond van een
      verblijfsvergunning als bedoeld in [artikel 28][ref4] of [33 van de Vreemdelingenwet 2000][ref5],

      e. van wie ten minste een van de ouders of voogden afkomstig is uit een ander niet-Engelstalig land buiten Europa,
      echter met uitzondering van Indonesië;


