      1 Onze Minister stelt jaarlijks uiterlijk op 15 april, de bekostigingsbedragen, bedoeld in [artikel C 11][ref1]
      vast. De bedragen hebben betrekking op een schooljaar.

      2 De in het eerste lid bedoelde bekostigingsbedragen kunnen door Onze Minister worden gewijzigd wegens algemene
      salarismaatregelen of wegens andere al dan niet uit de rijksbegroting voortvloeiende maatregelen.


