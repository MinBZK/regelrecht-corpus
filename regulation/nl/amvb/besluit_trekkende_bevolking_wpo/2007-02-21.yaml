  - number: B 1
    text: |-
      1 Het onderwijs aan kinderen van wie de ouders in het kermisbedrijf, onderscheidenlijk het circusbedrijf werkzaam
      zijn, wordt gegeven in daartoe ingerichte voertuigen die in het kermisseizoen of circusseizoen standplaats kiezen
      bij daarvoor in aanmerking komende kermissen of circussen.

      2 Gedurende de maanden november tot en met februari nemen de scholen een vaste standplaats in die wordt bepaald
      door het bevoegd gezag in overeenstemming met de inspecteur. Indien de inspecteur bedenkingen heeft tegen de
      standplaats en het bevoegd gezag weigert daaraan tegemoet te komen, besluit Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003833/2007-02-21#ArtikelB_1
  - number: B 2
    text: |-
      Het onderwijs aan kinderen van wie de ouders in het kermisbedrijf, onderscheidenlijk het circusbedrijf werkzaam
      zijn, wordt gegeven in scholen die bestemd zijn voor kinderen vanaf de leeftijd van 4 tot omstreeks 12 jaar. Het
      legt mede de grondslag voor het volgen van aansluitend basisonderwijs, onderscheidenlijk aansluitend voortgezet
      onderwijs.
    url: https://wetten.overheid.nl/BWBR0003833/2007-02-21#ArtikelB_2
  - number: B 3
    text: Artikel 9, eerste tot en met derde lid, vijfde en zesde lid, van de wet is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003833/2007-02-21#ArtikelB_3
  - number: B 5
    text: |-
      1 Elk jaar in de maanden maart en mei zendt het bevoegd gezag van een bijzondere school aan de inspecteur een
      gedeelte van een reisplan, waarin is vermeld bij welke kermissen of circussen elke van dat bevoegd gezag uitgaande
      school gedurende de eerstkomende periode standplaats zal kiezen. Het reisplan bestaat uit twee gedeelten welke
      gezamenlijk het kermisseizoen dan wel het circusseizoen omvatten.

      2 Indien van het reisplan wordt afgeweken, wordt de inspecteur daarvan tevoren in kennis gesteld.

      3 Indien de inspecteur tegen het reisplan of tegen een voorgenomen afwijking daarvan bedenkingen heeft en het
      bevoegd gezag weigert daaraan tegemoet te komen, besluit Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003833/2007-02-21#ArtikelB_5
  - number: B 10
    text: |-
      1 Om als leerling tot een school voor kinderen als bedoeld in [artikel B 2][ref1] te worden toegelaten, moet het
      kind de leeftijd van 4 jaar hebben bereikt.

      2 De leerlingen verlaten de school, bedoeld in het eerste lid, in elk geval na afloop van het schooljaar waarin zij
      de leeftijd van 14 jaar hebben bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0003833#ArtikelB_2
