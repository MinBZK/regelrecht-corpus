    text: |-
      De betaling van de bekostigingsbedragen voor personeelskosten vindt maandelijks plaats in een bij ministeriële
      regeling vast te stellen betaalritme dat voor verschillende delen van de bekostiging verschillend kan worden
      vastgesteld.
