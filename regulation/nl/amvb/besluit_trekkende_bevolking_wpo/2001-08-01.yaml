  - number: C 14b
    text: |-
      Artikel 106 van de wet is van overeenkomstige toepassing, met dien verstande dat voor vervreemding of bezwaring
      toestemming van Onze Minister is vereist.
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelC_14b
  - number: C 15
    text: |-
      1 Indien de school is gehuisvest in een gebouw zijn de artikelen 113, 114, 116, 119, 134, eerste, derde, zevende en
      achtste lid, en 135 van de wet van overeenkomstige toepassing.

      2 Onze Minister stelt jaarlijks de vergoeding vast per school voor de kosten van:

      a. het noodzakelijk vervoer van de leerlingen ten behoeve van het schoolbezoek;

      b. het zwemonderwijs en het daaraan verbonden noodzakelijke vervoer van de leerlingen;

      c. de vergoeding van de belastingen ter zake van onroerende zaken.
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelC_15
  - number: C 15a
    text: |-
      De grondslag voor de vergoeding van de in [artikel C 15][ref1] bedoelde kosten zijn:

      a. het normatief bepaalde aantal te huisvesten groepen leerlingen dat gelijk wordt gesteld aan het aantal
      formatieplaatsen berekend overeenkomstig [artikel C 15f][ref2], met dien verstande dat wordt gerekend met het
      aantal leerlingen bepaald overeenkomstig onderdeel b, en

      b. het rekenkundig afgeronde gemiddelde van de hoogste dagtellingen van het aantal leerlingen van de maand
      september van het tweede jaar voorafgaande aan het jaar waarover de vergoeding plaatsvindt tot en metde maand april
      van het jaar voorafgaande aan het jaar waarover de vergoeding plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0003833#ArtikelC_15
      [ref2]: https://wetten.overheid.nl/BWBR0003833#ArtikelC_15f
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelC_15a
    references:
      - id: ref1
        bwb_id: BWBR0003833
        artikel: C_15
