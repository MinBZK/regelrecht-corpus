  - number: C 15j
    text: |-
      De formatie voor speciale doeleinden, bedoeld in artikel C 15*b*, eerste lid onderdeel , omvat de formatie voor
      personeelsbeleid, kwaliteitsverbetering en innovatie.
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelC_15j
  - number: C 15k.1
    text: |-
      1 De formatie voor personeelsbeleid, kwaliteitsverbetering en innovatie wordt vastgesteld door het aantal
      formatierekeneenheden, berekend op grond van artikel C 15f, te vermenigvuldigen:

      a. met 2,7% indien het aantal formatieplaatsen op de school, berekend op grond van artikel C 15f, op 1 oktober van
      het voorafgaande schooljaar kleiner is dan 7,4; of

      b. met 5,0% indien het aantal formatieplaatsen op de school, berekend op grond van artikel C 15f, op 1 oktober van
      het voorafgaande schooljaar gelijk is aan of groter is dan 7,4.

      2 De uitkomst van de berekening op grond van het eerste lid wordt vervolgens afgerond op een geheel getal. Bij de
      afronding worden de decimalen verwaarloosd indien het eerste cijfer achter de komma kleiner is dan 5, en worden de
      decimalen verwaarloosd en het getal verhoogd met 1 indien het eerste cijfer achter de komma gelijk is aan of groter
      is dan 5.
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelC_15k.1
  - number: C 15l
    text: |-
      1 Grondslag voor de berekening van het aantal leerlingen, bedoeld in de artikelen C15f en C15g, is het gemiddelde
      van de hoogste dagtellingen van de maanden september tot en met april van het voorafgaande schooljaar.

      2 Voor het schooljaar waarin een nieuwe school wordt geopend, geldt het gemiddeld aantal leerlingen van de hoogste
      dagtellingen van de maanden september tot en met november volgend op de aanvang van de bekostiging.
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelC_15l
  - number: C 15m
    text: |-
      1 Voor de omrekening in formatierekeneenheden wordt het aantal formatieplaatsen vermenigvuldigd met 179.

      2 De berekening, bedoeld in het eerste lid, vindt plaats op 4 decimalen nauwkeurig. De uitkomst van de som van
      het aantal formatierekeneenheden, berekend op grond van het eerste lid, wordt afgerond op een geheel getal. Bij de
      afronding worden de decimalen verwaarloosd indien het eerste cijfer achter de komma kleiner is dan 5, en worden de
      decimalen verwaarloosd en het getal verhoogd met 1 indien het eerste cijfer achter de komma gelijk is aan of groter
      is dan 5.
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelC_15m
  - number: C 16
    text: |-
      Het Rijk vergoedt aan het bevoegd gezag van een school gehuisvest in een gebouw de kosten van de voorzieningen
      bedoeld in artikel C 14.
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelC_16
  - number: C 16a
    text: |-
      [Artikel 15 van het Bekostigingsbesluit WPO][ref1] is van overeenkomstige toepassing op de vergoeding voor de
      huisvesting en de materiële instandhouding van een school, gehuisvest in een gebouw of op een vaartuig.


      [ref1]: https://wetten.overheid.nl/BWBR0003862#Artikel15
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelC_16a
