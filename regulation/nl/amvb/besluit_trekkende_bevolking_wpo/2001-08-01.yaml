  - number: B 13
    text: |-
      1 Het bevoegd gezag van een bijzondere school kan Onze Minister verzoeken de school voor bekostiging in aanmerking
      te brengen.

      2 Het verzoek gaat vergezeld van een opgave van het verwachte aantal leerlingen en de voorgestelde datum van
      aanvang van de bekostiging. Voorts vermeldt het bevoegd gezag naam en adres van het bevoegd gezag en de richting
      van de school.

      3 Onze Minister willigt het verzoek in elk geval in, indien op grond van de bij het verzoek overgelegde gegevens
      aannemelijk is dat de school zal worden bezocht door ten minste 20 leerlingen.

      4 Onze Minister besluit binnen 3 maanden na ontvangst van het verzoek. Indien Onze Minister niet binnen 3 maanden
      heeft besloten, is het verzoek ingewilligd.
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelB_13
  - number: B 14
    text: |-
      1 Het bevoegd gezag van een bijzondere school dat een voertuig bestemd voor de huisvesting wenst met inbegrip van
      ingrijpende voorzieningen aan een dergelijk voertuig, dient een daartoe strekkend verzoek in bij Onze Minister. Het
      bevoegd gezag vermeldt de reden en de omvang van de voorziening.

      2 Het eerste lid is van overeenkomstige toepassing, indien het bevoegd gezag een andere voorziening wenst die niet
      het gewoon onderhoud betreft, alsmede indien het bevoegd gezag een aanschaffing wenst te doen waarmee bij de eerste
      inrichting van de school geen rekening was gehouden.

      3 Onze Minister weigert inwilliging van het verzoek, indien hij van oordeel is dat:

      a. op andere wijze dan is gevraagd redelijkerwijs in de behoefte aan huisvesting van de school kan worden voorzien;

      b. de voorgenomen voorziening niet gerechtvaardigd is op grond van de te verwachten ontwikkeling van het aantal
      leerlingen;

      c. de voorgenomen voorziening niet gerechtvaardigd is op grond van onderwijskundige ontwikkelingen;

      d. de voorgenomen voorziening op grond van de hem ten dienste staande gegevens niet noodzakelijk is.

      4 Alvorens Onze Minister een besluit neemt die afwijkt van hetgeen in het verzoek is aangegeven, pleegt hij overleg
      met het bevoegd gezag.

      5 Artikel B 13, vierde lid, van dit besluit is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelB_14
  - number: B 16
    text: |-
      De kosten van materiële instandhouding die voor vergoeding uit 's Rijks kas in aanmerking kunnen komen, zijn:

      a. onderhoud,

      b. energie- en waterverbruik,

      c. publiekrechtelijke heffingen,

      d. middelen,

      e. administratie, beheer en bestuur,

      f. de kosten voor verplaatsing en inneming van standplaats,

      g. de kosten voor noodzakelijk vervoer van leerlingen ten behoeve van het schoolbezoek, en

      h. de reiskosten en andere noodzakelijke kosten verbonden aan het ononderbroken meerdaagse verblijf van het voor
      rekening van het Rijk komende personeel.
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelB_16
  - number: B 16a
    text: |-
      1 De formatie voor een school omvat de formatie

      a. voor de vervulling van reguliere taken van de school, en

      b. voor speciale doeleinden.

      De formatie, bedoeld in onderdeel *a*, is redelijkerwijs voldoende voor het leiden en beheren van de school, voor
      het geven van onderwijs aan de school en voor de overige werkzaamheden die verband houden met het onderwijs aan
      de school.

      2 Onze Minister kan op verzoek van het bevoegd gezag op grond van bijzondere omstandigheden meer formatie
      toekennen aan een school dan op grond van het eerste lid juncto de [artikelen B 16b tot en met B 16m][ref1] wordt
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003833#ArtikelB_16b
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelB_16a
    references:
      - id: ref1
        bwb_id: BWBR0003833
        artikel: B_16b
        paragraaf: 4A
        afdeling: '6'
  - number: B 16b
    text: |-
      1 De totale omvang van de formatie, bedoeld in [artikel B 16a][ref1], die voor een school wordt vastgesteld, is het
      formatiebudget. Indien krachtens [artikel B 16j][ref2] kan worden voorzien in formatie voor speciale doeleinden,
      maakt deze formatie uitsluitend deel uit van het formatiebudget indien de desbetreffende formatierekeneenheden
      worden besteed voor die speciale doeleinden. Het formatiebudget wordt in de vorm van formatierekeneenheden aan het
      bevoegd gezag van een school toegekend.

      2 De omvang van het formatiebudget wordt bepaald door de som van de aantallen formatierekeneenheden zoals voor een
      school berekend op grond van de [artikelen B 16d tot en met B 16m][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003833#ArtikelB_16a
      [ref2]: https://wetten.overheid.nl/BWBR0003833#ArtikelB_16j
      [ref3]: https://wetten.overheid.nl/BWBR0003833#ArtikelB_16d
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelB_16b
