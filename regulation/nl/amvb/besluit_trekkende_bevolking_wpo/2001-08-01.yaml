  - number: C 18b
    text: |-
      1 De vergoeding, bedoeld in artikel C 18, eerste lid onderdeel *a*, wordt besteed aan de kosten van het personeel
      dat is aangesteld ten laste van het formatiebudget.

      2 De vergoeding, bedoeld in artikel C 18, eerste lid onderdeel *b*, wordt besteed aan personele uitgaven.

      3 Artikel 150 van de wet is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelC_18b
  - number: C 19
    text: |-
      1 De bekostiging van een bijzondere school wordt beëindigd aan het einde van het tweede schooljaar volgend op het
      schooljaar waarin het gemiddelde van de hoogste dagtellingen van de maanden september tot en met april minder heeft
      bedragen dan 10.

      2 De bekostiging van een bijzondere school wordt niet beëindigd binnen de eerste 5 jaren van bekostiging van de
      school.
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelC_19
  - number: C 20
    text: |-
      1 De gemeenteraad besluit tot opheffing van een openbare school aan het einde van het tweede schooljaar volgend op
      het schooljaar waarin het gemiddelde van de hoogste dagtellingen van de maanden september tot en met april minder
      heeft bedragen dan 10.

      2 Een openbare school wordt niet opgeheven binnen de eerste 5 jaren van bekostiging van de school.
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelC_20
  - number: C 21
    text: |-
      1 Indien gebouwen, terreinen of roerende zaken van scholen, ten behoeve waarvan een vergoeding is genoten, geheel
      of gedeeltelijk aan hun bestemming worden onttrokken of met toestemming van Onze Minister worden vervreemd, anders
      dan bedoeld in artikel 56 van de wet, dan wel indien de bekostiging wordt beëindigd, is het bevoegd gezag aan het
      Rijk een bedrag verschuldigd. Het bevoegd gezag kan, buiten het geval van vervreemding, in plaats van betaling van
      dit bedrag de eigendom van die gebouwen, terreinen of roerende zaken, binnen 4 maanden aan het Rijk overdragen.

      2 Onze Minister stelt na overleg met het bevoegd gezag het bedrag bedoeld in het eerste lid, vast op de grondslag
      van de waarde van de gebouwen, terreinen of roerende zaken en de door het bevoegd gezag daarvoor ontvangen
      vergoedingen en uit eigen middelen bestede gelden.
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelC_21
  - number: C 21a
    text: |-
      1 Indien vaartuigen of andere roerende zaken van scholen, ten behoeve waarvan een vergoeding is genoten, geheel
      of gedeeltelijk aan hun bestemming worden onttrokken of met toestemming van Onze Minister worden vervreemd, anders
      dan bedoeld in artikel 56 van de wet, dan wel indien de bekostiging wordt beëindigd, is het bevoegd gezag aan het
      Rijk een bedrag verschuldigd. Indien het andere roerende zaken betreft, kan het bevoegd gezag buiten het geval van
      vervreemding in plaats van betaling binnen 4 maanden de eigendom van die roerende zaken aan het Rijk overdragen.

      2 Onze Minister stelt na overleg met het bevoegd gezag het bedrag bedoeld in het eerste lid, vast op de grondslag
      van de waarde van de vaartuigen of andere roerende zaken en de door het bevoegd gezag daarvoor ontvangen
      vergoedingen en uit eigen middelen bestede gelden.
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelC_21a
  - number: G 1
    text: |-
      De verplichte formatie voor het schooljaar 1985-1986 wordt vastgesteld aan de hand van:

      a. het gemiddeld aantal leerlingen van de hoogste dagtellingen van de maanden september 1984 tot en met april 1985
      voor scholen als bedoeld in titel B en titel C;

      b. de som van het gemiddeld aantal leerlingen van de hoogste dagtellingen van de maanden september 1984 tot en met
      april 1985 van de kernafdeling en de afdeling zeer jeugdigen bedoeld in het Besluit buitengewoon onderwijs 1967
      (*Stb.* 1978, 582) voor scholen als bedoeld in titel D, en afdelingen als bedoeld in titel E;

      c. het aantal leerlingen op 16 april 1985 voor scholen als bedoeld in titel F.
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelG_1
  - number: G 1.a
    text: |-
      In afwijking van artikel B 16*k*.1, eerste lid, geldt:

      a. indien de som van de aantallen formatieplaatsen op de school berekend op grond van artikel B 16e en artikel B
      16k, zoals dat artikel luidde tot 1 augustus 1998, op 1 oktober van het voorafgaande schooljaar kleiner is dan 7,4:

      1°. voor het schooljaar 1994-1995 een percentage van 1,5%, met dien verstande dat na de afronding op grond van
      artikel B 16*k*.1, tweede lid, de uitkomst van deze berekening wordt verminderd met de opslag ten behoeve van
      schoolspecifiek formatie- en personeelsbeleid voor het schooljaar 1994-1995 als bedoeld in artikel B 16*i*.3,

      2°. voor het schooljaar 1995-1996 een percentage van 2,0%,

      3°. voor het schooljaar 1996-1997 een percentage van 2,6%, of

      b. indien de som van de aantallen formatieplaatsen op de school berekend op grond van artikel B 16e en artikel B
      16k, zoals dat artikel luidde tot 1 augustus 1998, op 1 oktober van het voorafgaande schooljaar gelijk is aan of
      groter is dan 7,4:

      1°. voor het schooljaar 1994-1995 een percentage van 2,5%, met dien verstande dat na de afronding op grond van
      artikel B 16*k*.1, tweede lid, de uitkomst van deze berekening wordt verminderd met de opslag ten behoeve van
      schoolspecifiek formatie- en personeelsbeleid voor het schooljaar 1994-1995 als bedoeld in artikel B 16*i*.3,

      2°. voor het schooljaar 1995-1996 een percentage van 3,8%,

      3°. voor het schooljaar 1996-1997 een percentage van 4,9%.
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelG_1.a
  - number: G 1.b
    text: |-
      In afwijking van artikel C 15*k*.1, eerste lid, geldt:

      a. indien de som van de aantallen formatieplaatsen op de school berekend op grond van artikel C 15f en artikel C
      15k, zoals dat artikel luidde tot 1 augustus 1998, op 1 oktober van het voorafgaande schooljaar kleiner is dan 7,4:

      1°. voor het schooljaar 1994-1995 een percentage van 1,5%, met dien verstande dat na de afronding op grond van
      artikel C 15*k*.1, tweede lid, de uitkomst van deze berekening wordt verminderd met de opslag ten behoeve van
      schoolspecifiek formatie- en personeelsbeleid voor het schooljaar 1994-1995 als bedoeld in artikel C 15*i*.3,

      2°. voor het schooljaar 1995-1996 een percentage van 2,0%,

      3°. voor het schooljaar 1996-1997 een percentage van 2,6%, of

      b. indien de som van de aantallen formatieplaatsen op de school berekend op grond van artikel C 15f en artikel C
      15k, zoals dat artikel luidde tot 1 augustus 1998, op 1 oktober van het voorafgaande schooljaar gelijk is aan of
      groter is dan 7,4:

      1°. voor het schooljaar 1994-1995 een percentage van 2,5%, met dien verstande dat na de afronding op grond van
      artikel C 15*k*.1, tweede lid, de uitkomst van deze berekening wordt verminderd met de opslag ten behoeve van
      schoolspecifiek formatie- en personeelsbeleid voor het schooljaar 1994-1995 als bedoeld in artikel C 15*i*.3,

      2°. voor het schooljaar 1995-1996 een percentage van 3,8%,

      3°. voor het schooljaar 1996-1997 een percentage van 4,9%.
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelG_1.b
  - number: G 2
    text: |-
      Met inachtneming van het bepaalde in [artikel 185, derde lid, van de Wet op het primair onderwijs][ref1] treedt dit
      besluit in werking op een bij koninklijk besluit te bepalen datum. Het koninklijk besluit kan er in voorzien dat
      het besluit terugwerkende kracht heeft tot en met 1 augustus 1985.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel185
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelG_2
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '185'
  - number: G 3
    text: Dit besluit kan worden aangehaald als "Besluit trekkende bevolking WPO".
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelG_3
