  - number: C 16b
    text: |-
      [Artikel 13, eerste en derde lid, van het Bekostigingsbesluit WPO][ref1] is van overeenkomstige toepassing op de
      vergoeding voor de materiële instandhouding van een school, gehuisvest in een gebouw en op de vergoeding voor de
      huisvesting en de materiële instandhouding van een school, gehuisvest op een vaartuig.


      [ref1]: https://wetten.overheid.nl/BWBR0003862#Artikel13
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelC_16b
