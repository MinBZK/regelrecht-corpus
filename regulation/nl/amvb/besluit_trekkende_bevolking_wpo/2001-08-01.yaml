        artikel: '30'
  - number: B 20a
    text: |-
      1 De vergoeding, bedoeld in artikel B 20, eerste lid onderdeel *a*, wordt besteed aan de kosten van het personeel
      dat is aangesteld ten laste van het formatiebudget.

      2 De vergoeding, bedoeld in artikel B 20, eerste lid onderdeel *b*, wordt besteed aan personele uitgaven.
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelB_20a
  - number: B 21
    text: |-
      Onze Minister verstrekt maandelijks voorschotten op de vergoeding en bepaalt de wijze van verrekening van de
      uitgekeerde voorschotten met het bedrag van de vastgestelde vergoeding.
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelB_21
  - number: B 22
    text: |-
      1 De bekostiging wordt beëindigd op 1 maart volgend op het tweede jaar waarin het gemiddelde van de hoogste
      dagtellingen van de maanden maart tot en met oktober minder heeft bedragen dan 10.

      2 De bekostiging van een bijzondere school wordt niet beëindigd binnen de eerste 5 jaren van bekostiging van de
      school.
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelB_22
  - number: B 23
    text: |-
      1 Indien gebouwen, terreinen of roerende zaken van scholen, ten behoeve waarvan een vergoeding is genoten, geheel
      of gedeeltelijk aan hun bestemming worden onttrokken of met toestemming van Onze Minister worden vervreemd, anders
      dan bedoeld in artikel 56 van de wet, dan wel indien de bekostiging wordt beëindigd, is het bevoegd gezag van een
      bijzondere school aan het Rijk een bedrag verschuldigd. Het bevoegd gezag kan, buiten het geval van vervreemding,
      in plaats van betaling van dit bedrag de eigendom van die gebouwen, terreinen of roerende zaken, binnen 4 maanden
      aan het Rijk overdragen.

      2 Onze Minister stelt na overleg met het bevoegd gezag het bedrag bedoeld in het eerste lid, vast op de grondslag
      van de waarde van de gebouwen, terreinen of roerende zaken en de door het bevoegd gezag daarvoor ontvangen
      vergoedingen en uit eigen middelen bestede gelden.
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelB_23
  - number: C 1
    text: |-
      1 Het ligplaatsonderwijs aan varende kinderen is het onderwijs bestemd voor kinderen van 3½ tot omstreeks 7 jaar
      die bij hun ouders, die het schippersbedrijf uitoefenen, aan boord wonen. Het legt mede de grondslag voor het
      volgen van onderwijs aan een basisschool.

      2 De inspecteur kan toestemming verlenen dat andere kinderen dan bedoeld in het eerste lid, van wie de ouders een
      trekkend bestaan leiden, tot de school worden toegelaten.
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelC_1
  - number: C 2
    text: |-
      [Artikel 9 van de wet][ref1] is van overeenkomstige toepassing, met dien verstande dat de verplichting tot het
      geven van onderwijs in de Engelse en de Friese taal niet bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel9
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelC_2
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '9'
  - number: C 2a
    text: |-
      Het plan inzake onderwijs in allochtone levende talen, bedoeld in [artikel 171, eerste lid, van de wet][ref1], kan
      mede betrekking hebben op scholen als bedoeld in deze titel.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel171
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelC_2a
