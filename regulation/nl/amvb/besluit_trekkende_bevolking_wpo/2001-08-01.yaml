  - number: C 5
    text: Artikel 29 van de wet is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelC_5
  - number: C 9
    text: |-
      1 Om als leerling tot een school te worden toegelaten, moeten kinderen de leeftijd van 3½ jaar hebben bereikt.

      2 De leerlingen verlaten de school in elk geval na afloop van het schooljaar waarin zij de leeftijd van 7 jaar
      hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelC_9
  - number: C 11
    text: |-
      De[ artikelen 1][ref1], [2][ref2], [3][ref3], [4][ref4], [6][ref5], [7][ref6], [8][ref7] en
      [9 van het Bekostigingsbesluit WPO][ref8] zijn van overeenkomstige toepassing, met dien verstande dat ten aanzien
      van artikel 7, eerste lid, onder b, de bepaling inzake de termijn van 6 maanden buiten toepassing blijft.


