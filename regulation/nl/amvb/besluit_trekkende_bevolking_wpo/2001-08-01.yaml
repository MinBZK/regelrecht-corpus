  - number: B 16c
    text: |-
      De formatie voor de vervulling van de reguliere taken van de school, bedoeld in artikel B 16a, eerste lid onderdeel
      a, bestaat uit:

      a. de normatieve formatie,

      b. een opslag in verband met formatieve fricties,

      c. een opslag vanwege herbezetting in verband met arbeidsduurverkorting,

      d. een opslag vanwege herbezetting in verband met toepassing regeling bevordering arbeidsparticipatie ouderen, en

      e. een opslag ten behoeve van schoolspecifiek formatie- en personeelsbeleid voor de schooljaren 1993-1994 en 1994-
      1995.
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelB_16c
  - number: B 16d
    text: |-
      De normatieve formatie van een school, bedoeld in [artikel B 16c][ref1] onderdeel *a*, omvat de basisformatie, de
      formatie voor vakonderwijs, en de formatie voor de schoolleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0003833#ArtikelB_16c
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelB_16d
    references:
      - id: ref1
        bwb_id: BWBR0003833
        artikel: B_16c
        paragraaf: 4A
        afdeling: '6'
  - number: B 16e
    text: |-
      De basisformatie wordt berekend op 1 formatieplaats ingeval het aantal leerlingen 16 of minder bedraagt. Tot en met
      telkens 16 leerlingen boven het aantal van 16 wordt de basisformatie met 1 formatieplaats verhoogd.
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelB_16e
  - number: B 16f
    text: |-
      1 De formatie voor vakonderwijs in de onderwijsactiviteiten zintuiglijke en lichamelijke oefening, tekenen, muziek
      en handvaardigheid genoemd in artikel 9 van de wet, of, met toepassing van artikel 9, zesde lid, van de wet, ten
      behoeve van vakonderwijs in een of meer niet in artikel 9 van de wet genoemde onderwijsactiviteiten, wordt berekend
      op 4 uur.

      2 Het aantal uren vakonderwijs, genoemd in het eerste lid, wordt besteed aan het geven van vakonderwijs in de in
      het eerste lid bedoelde onderwijsactiviteiten.
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelB_16f
  - number: B 16g
    text: |-
      1 De formatie voor de schoolleiding wordt deels berekend in een aantal uren en deels uitgedrukt in
      formatierekeneenheden.

      2 De formatie voor zover berekend in uren, omvat 16 uren.

      3 De formatie voor zover uitgedrukt in formatierekeneenheden, wordt berekend aan de hand van onderstaand schema:








                    Aantal leerlingen


                    Aantal formatierekeneenheden






                    tot en met 99


                    54




                    100 tot en met 199


                    86
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelB_16g
  - number: B 16h
    text: |-
      De opslag in verband met rechtspositionele aanspraken van personeel bij vermindering van de formatie bedraagt 12
      formatierekeneenheden.
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelB_16h
  - number: B 16i
    text: |-
      1 De aantallen formatierekeneenheden, berekend op grond van artikel B 16*m*, worden verhoogd met 8,11% vanwege
      herbezetting in verband met arbeidsduurverkorting. De uitkomst wordt afgerond op een geheel getal. Bij de afronding
      worden de decimalen verwaarloosd indien het eerste cijfer achter de komma kleiner is dan 5, en worden de decimalen
      verwaarloosd en het getal verhoogd met 1 indien het eerste cijfer achter de komma gelijk is aan of groter is dan 5.

      2 Het aantal formatierekeneenheden, berekend op grond van artikel B 16m en verhoogd op grond van het eerste lid,
      wordt tevens verhoogd met het aantal formatierekeneenheden dat behoort bij het gedeelte van de betrekkingsomvang
      dat kan worden herbezet in verband met toepassing van de regeling bevordering arbeidsparticipatie ouderen, bedoeld
      in [hoofdstuk I-V van het Rechtspositiebesluit onderwijspersoneel](onbekend). Het eerste lid, tweede en derde
      volzin, is van toepassing.
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelB_16i
  - number: B 16i.3
    text: |-
      De aantallen formatierekeneenheden, berekend op grond van artikel B 16e en B 16k, zoals dat artikel luidde tot
      1 augustus 1998, worden ten behoeve van schoolspecifiek formatie- en personeelsbeleid voor het schooljaar 1993-
      1994 verhoogd met 0,783% en voor het schooljaar 1994-1995 verhoogd met 1,284%. Per schooljaar wordt de uitkomst
      van de berekening op grond van de vorige volzin vervolgens afgerond op een geheel getal. Bij de afronding worden
      de decimalen verwaarloosd indien het eerste cijfer achter de komma kleiner is dan 5, en worden de decimalen
      verwaarloosd en het getal verhoogd met 1 indien het eerste cijfer achter de komma gelijk is aan of groter is dan 5.
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelB_16i.3
  - number: B 16j
    text: |-
      De formatie voor speciale doeleinden, bedoeld in artikel B 16*a*, eerste lid onderdeel , omvat de formatie voor
      personeelsbeleid, kwaliteitsverbetering en innovatie.
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelB_16j
  - number: B 16k.1
    text: |-
      1 De formatie voor personeelsbeleid, kwaliteitsverbetering en innovatie wordt vastgesteld door het aantal
      formatierekeneenheden, berekend op grond van artikel B 16e, te vermenigvuldigen:

      a. met 2,7% indien het aantal formatieplaatsen op de school, berekend op grond van artikel B 16e, op 1 oktober van
      het voorafgaande schooljaar kleiner is dan 7,4; of

      b. met 5,0% indien het aantal formatieplaatsen op de school, berekend op grond van artikel B 16e, op 1 oktober van
      het voorafgaande schooljaar gelijk is aan of groter is dan 7,4.

      2 De uitkomst van de berekening op grond van het eerste lid wordt vervolgens afgerond op een geheel getal. Bij de
      afronding worden de decimalen verwaarloosd indien het eerste cijfer achter de komma kleiner is dan 5, en worden de
      decimalen verwaarloosd en het getal verhoogd met 1 indien het eerste cijfer achter de komma gelijk is aan of groter
      is dan 5.
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelB_16k.1
  - number: B 16l
    text: |-
      1 Grondslag voor de berekening van het aantal leerlingen, bedoeld in de artikelen B16e en B16g, is het gemiddelde
      van de hoogste dagtellingen van de maanden maart tot en met oktober van het voorafgaande jaar.

      2 Voor het schooljaar waarin een nieuwe school wordt geopend, geldt het gemiddeld aantal leerlingen van de hoogste
      dagtellingen van de 3 maanden volgende op de maand waarin de school is geopend, doch uiterlijk tot en met de
      maand oktober. Voor het daaropvolgende schooljaar wordt als grondslag genomen het gemiddeld aantal leerlingen
      van de hoogste dagtellingen van de maanden volgende op de maand waarin de school is geopend tot en met oktober
      daaraanvolgend.

      3 Voor de toepassing van het eerste en tweede lid wordt onder "schooljaar" verstaan het tijdvak van 1 maart tot 1
      maart daaraanvolgend.
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelB_16l
  - number: B 16m
    text: |-
      1 Voor zover de berekening van de formatie geschiedt in formatieplaatsen, wordt voor de omrekening in
      formatierekeneenheden dat aantal formatieplaatsen vermenigvuldigd met 179.

      2 Voor zover de berekening van de formatie geschiedt in uren, wordt voor de omrekening in formatierekeneenheden dat
      aantal uren vermenigvuldigd met 179/40.

      3 De berekening, bedoeld in het eerste en tweede lid, vindt plaats op 4 decimalen nauwkeurig. De uitkomst van de
      som van het aantal formatierekeneenheden, berekend op grond van het eerste en tweede lid, wordt afgerond op een
      geheel getal. Bij de afronding worden de decimalen verwaarloosd indien het eerste cijfer achter de komma kleiner
      is dan 5, en worden de decimalen verwaarloosd en het getal verhoogd met 1 indien het eerste cijfer achter de komma
      gelijk is aan of groter is dan 5.
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelB_16m
  - number: B 17
    text: |-
      Het Rijk vergoedt aan het bevoegd gezag van een bijzondere school de kosten van de voorzieningen genoemd in artikel
      B 14.
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelB_17
  - number: B 18
    text: |-
      1 Het Rijk vergoedt jaarlijks aan het bevoegd gezag van een bijzondere school de uitgaven voor de materiële
      instandhouding.

      2 Het bevoegd gezag stelt jaarlijks de begroting op voor het eerstvolgende jaar. De begroting is voorzien van een
      toelichting en wordt jaarlijks voor 1 oktober ter toestemming bij Onze Minister ingediend.

      3 Eveneens jaarlijks voor 1 oktober dient het bevoegd gezag ter toestemming bij Onze Minister een raming van
      inkomsten en uitgaven in voor de 4 jaren volgend op het jaar bedoeld in het tweede lid. De raming is voorzien van
      een toelichting.

      4 Bij ministeriële regeling kunnen richtlijnen worden gegeven voor de inrichting van de begroting en de
      meerjarenraming.

      5 Onze Minister stelt de vergoeding vast. Deze omvat het bedrag van de kosten voor zover Onze Minister daaraan zijn
      toestemming heeft gehecht.
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelB_18
  - number: B 19
    text: |-
      1 Het bevoegd gezag van een bijzondere school stelt jaarlijks een rekening en verantwoording op over het afgelopen
      jaar en dient deze jaarlijks voor 1 juli bij Onze Minister in.

      2 De rekening en verantwoording omvatten in elk geval:

      a. de gemaakte kosten;

      b. de genoten inkomsten uit verhaal van wettelijk verschuldigde bijdragen en premies;

      c. de door Onze Minister vast te stellen waarde van de roerende zaken die door vervreemding of op andere wijze met
      toestemming van Onze Minister worden onttrokken aan de bestemming waartoe zij met vergoeding uit ’s Rijks kas zijn
      aangeschaft;

      d. andere inkomsten, voortvloeiende uit de instandhouding van de school;

      e. een verklaring van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1], van de juistheid van de gegevens bedoeld
      onder ,  en .

      3 Bij ministeriële regeling kunnen richtlijnen worden gegeven voor de inrichting van de rekening en verantwoording
      en de over te leggen bescheiden.

      4 Onze Minister besluit binnen twee jaren na 1 juli van het jaar waarin de rekening en verantwoording is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelB_19
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: B 20
    text: |-
      1 Met inachtneming van de [artikelen B 16a tot en met B 16m][ref1] van dit besluit, vergoedt het Rijk aan het
      bevoegd gezag van een bijzondere school:

      a. de uitgaven voor het personeel dat is aangesteld ten laste van het formatiebudget, en

      b. de geldswaarde van niet verbruikte formatierekeneenheden, en

      c. de vergoedingen, bedoeld in [artikel 126 van de wet][ref2].

      2 [Artikel 137, tweede en derde lid, van de wet][ref3] alsmede [artikel 30 van het Bekostigingsbesluit WPO][ref4]
      zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003833#ArtikelB_16a
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel126
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel137
      [ref4]: https://wetten.overheid.nl/BWBR0003862#Artikel30
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelB_20
    references:
