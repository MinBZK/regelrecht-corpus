        bwb_id: BWBR0003420
        artikel: '171'
  - number: C 3
    text: |-
      [Artikel 13 van de wet][ref1] is van overeenkomstige toepassing, behoudens voorzover het betreft de in dat artikel
      bedoelde algemene maatregel van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel13
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelC_3
