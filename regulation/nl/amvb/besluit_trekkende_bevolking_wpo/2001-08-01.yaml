        artikel: C_15f
        paragraaf: 4A
        afdeling: '5'
  - number: C 15a.1
    text: |-
      1 Een school gehuisvest op een vaartuig ontvangt jaarlijks van het Rijk een vergoeding bestemd voor voorzieningen
      in de huisvesting en voor de materiële instandhouding.

      2 De in het eerste lid bedoelde vergoeding voor een kalenderjaar wordt vastgesteld per formatieplaats, berekend
      overeenkomstig artikel C 15f, waarbij aan de eerste formatiepats f 50 000,– wordt toegekend en aan elke volgende
      formatieplaats f 30 000,–. Bij de berekening van het aantal formatieplaatsen op grond van de eerste volzin wordt
      uitgegaan van het rekenkundig afgeronde gemiddelde van de hoogste dagtellingen van het aantal leerlingen van de
      maand september van het tweede jaar voorafgaande aan het jaar waarover de vergoeding plaatsvindt, tot en met de
      maand april van het jaar voorafgaande aan het jaar waarover de vergoeding plaatsvindt.

      3 De in het tweede lid bedoelde vergoeding wordt jaarlijks aangepast overeenkomstig de prijsmutatie van de netto
      materiële consumptie, zoals opgenomen in de Macro Economische Verkenning, die naar verwachting zal optreden tussen
      het prijsniveau in het kalenderjaar waarvoor de vergoeding wordt vastgesteld en het prijsniveau in het daaraan
      voorafgaande jaar.

      4 Artikel C 14b is van overeenkomstige toepassing.

      5 Artikel C 15, tweede lid, onderdelen a en b, zijn van overeenkomstige toepassing, met dien verstande dat de
      vaststelling geschiedt op basis van het rekenkundig afgeronde gemiddelde van de hoogste dagtellingen van het aantal
      leerlingen van de maand september van het tweede jaar voorafgaande aan het jaar waarover de vergoeding plaatsvindt
      tot en met de maand april van het jaar voorafgaande aan het jaar waarover de vergoeding plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelC_15a.1
  - number: C 15b
    text: |-
      1 De formatie voor een school omvat de formatie

      a. voor de vervulling van de reguliere taken van de school, en

      b. voor speciale doeleinden.

      De formatie, bedoeld in onderdeel *a*, is redelijkerwijs voldoende voor het leiden en beheren van de school, voor
      het geven van onderwijs aan de school en voor de overige werkzaamheden die verband houden met het onderwijs aan
      de school.

      2 Onze Minister kan op verzoek van het bevoegd gezag op grond van bijzondere omstandigheden meer formatie toekennen
      aan een school dan op grond van het eerste lid juncto de artikelen C 15*c* tot en met C 15*m* wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelC_15b
  - number: C 15c
    text: |-
      1 De totale omvang van de formatie, bedoeld in artikel C 15*b*, die voor een school wordt vastgesteld, is het
      formatiebudget. Indien op grond van artikel C 15j kan worden voorzien in formatie voor speciale doeleinden, maakt
      deze formatie uitsluitend deel uit van het formatiebudget indien de desbetreffende formatierekeneenheden worden
      besteed voor die speciale doeleinden. Het formatiebudget wordt in de vorm van formatierekeneenheden aan het bevoegd
      gezag van een school toegekend.

      2 De omvang van het formatiebudget wordt bepaald door de som van de aantallen formatierekeneenheden zoals voor de
      school berekend op grond van de artikelen C 15*e* tot en met C 15*m*.
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelC_15c
  - number: C 15d
    text: |-
      De formatie voor de vervulling van reguliere taken van de school, bedoeld in [artikel C 15][ref1], bestaat uit:

      a. de normatieve formatie,

      b. een opslag in verband met formatieve fricties,

      c. een opslag vanwege herbezetting in verband met arbeidsduurverkorting,

      d. een opslag vanwege herbezetting in verband met toepassing regeling bevordering arbeidsparticipatie ouderen, en

      e. een opslag ten behoeve van schoolspecifiek formatie- en personeelsbeleid voor de schooljaren 1993-1994 en 1994-
      1995.


      [ref1]: https://wetten.overheid.nl/BWBR0003833#ArtikelC_15
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelC_15d
    references:
      - id: ref1
        bwb_id: BWBR0003833
        artikel: C_15
        paragraaf: 3A
        afdeling: '5'
  - number: C 15e
    text: |-
      De normatieve formatie van een school, bedoeld in artikel C 15*d* onderdeel *a*, omvat de basisformatie en de
      formatie voor de schoolleiding.
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelC_15e
  - number: C 15f
    text: |-
      De basisformatie wordt berekend op 1 formatieplaats ingeval het aantal leerlingen 16 of minder bedraagt. Tot en met
      telkens 16 leerlingen boven het aantal van 16 wordt de basisformatie met 1 formatieplaats verhoogd.
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelC_15f
  - number: C 15g
    text: |-
      De formatie voor de schoolleiding wordt uitgedrukt in formatierekeneenheden. De berekening van de formatie vindt
      plaats aan de hand van onderstaand schema:








                  Aantal leerlingen


                  Aantal formatierekeneenheden






                  tot en met 99


                  54




                  100 tot en met 199


                  86
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelC_15g
  - number: C 15h
    text: |-
      De opslag in verband met rechtspositionele aanspraken van personeel bij vermindering van de formatie bedraagt 12
      formatierekeneenheden.
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelC_15h
  - number: C 15i
    text: |-
      1 De aantallen formatierekeneenheden, berekend op grond van artikel C 15*m*, worden verhoogd met 8,11% vanwege
      herbezetting in verband met arbeidsduurverkorting. De uitkomst wordt afgerond op een geheel getal. Bij de afronding
      worden de decimalen verwaarloosd indien het eerste cijfer achter de komma kleiner is dan 5, en worden de decimalen
      verwaarloosd en het getal verhoogd met 1 indien het eerste cijfer achter de komma gelijk is aan of groter is dan 5.

      2 Het aantal formatierekeneenheden, berekend op grond van artikel C 15m en verhoogd op grond van het eerste lid,
      wordt tevens verhoogd met het aantal formatierekeneenheden dat behoort bij het gedeelte van de betrekkingsomvang
      dat kan worden herbezet in verband met toepassing van de regeling bevordering arbeidsparticipatie ouderen, bedoeld
      in [hoofdstuk I-V van het Rechtspositiebesluit onderwijspersoneel](onbekend). Het eerste lid, tweede en derde
      volzin, is van toepassing.
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelC_15i
  - number: C 15i.3
    text: |-
      De aantallen formatierekeneenheden, berekend op grond van [artikel C 15f][ref1] en [artikel C 15k][ref2], zoals
      dat artikel luidde tot 1 augustus 1998, worden ten behoeve van schoolspecifiek formatie en personeelsbeleid voor
      het schooljaar 1993-1994 verhoogd met 0,783% en voor het schooljaar 1994-1995 verhoogd met 1,284%. Per schooljaar
      wordt de uitkomst van de berekening op grond van de vorige volzin vervolgens afgerond op een geheel getal. Bij de
      afronding worden de decimalen verwaarloosd indien het eerste cijfer achter de komma kleiner is dan 5, en worden de
      decimalen verwaarloosd en het getal verhoogd met 1 indien het eerste cijfer achter de komma gelijk is aan of groter
      is dan 5.


      [ref1]: https://wetten.overheid.nl/BWBR0003833#ArtikelC_15f
      [ref2]: https://wetten.overheid.nl/BWBR0003833#ArtikelC_15k
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelC_15i.3
