  - number: C 13
    text: |-
      1 Het bevoegd gezag kan Onze Minister verzoeken de school voor bekostiging in aanmerking te brengen. De bekostiging
      kan slechts aanvangen per 1 augustus van een schooljaar.

      2 Het verzoek gaat vergezeld van een opgave van het verwachte aantal leerlingen en de voorgestelde datum van
      aanvang van de bekostiging. Voorts vermeldt het bevoegd gezag van een bijzondere school naam en adres van het
      bevoegd gezag en de richting van de school.

      3 Onze Minister willigt het verzoek in elk geval in, indien op grond van de bij het verzoek overgelegde gegevens
      aannemelijk is dat de school zal worden bezocht door ten minste 20 leerlingen.

      4 Onze Minister besluit binnen 3 maanden na ontvangst van het verzoek. Indien Onze Minister niet binnen 3 maanden
      heeft besloten, is het verzoek ingewilligd.
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelC_13
  - number: C 14
    text: |-
      1 Het bevoegd gezag dat een voorziening in de huisvesting voor een school gehuisvest in een gebouw wenst met
      inbegrip van de eerste inrichting, dient een daartoe strekkende aanvraag in bij Onze Minister. Het bevoegd gezag
      vermeldt de reden voor en de omvang van de voorziening.

      2 Onder een voorziening in de huisvesting wordt verstaan een voorziening als bedoeld in artikel 92, eerste lid, van
      de wet.

      3 [Artikel 3 van het Uitvoeringsbesluit voorzieningen in de huisvesting PO/VO][ref1] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008562#Artikel3
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelC_14
    references:
      - id: ref1
        bwb_id: BWBR0008562
        artikel: '3'
  - number: C 14a
    text: |-
      1 Onze Minister weigert inwilliging van het in [artikel C 14, eerste lid][ref1], bedoelde verzoek, in voorkomende
      gevallen na overleg met de desbetreffende gemeente, indien hij van oordeel is dat:

      a. de gewenste voorziening geen voorziening is in de zin van [artikel 92 van de wet][ref2],

      b. de gewenste voorziening niet gerechtvaardigd is op grond van de aard en de omvang van de voorzieningen waarover
      de school reeds beschikt, voor zover deze uit de openbare kas zijn bekostigd,

      c. de gewenste voorziening niet gerechtvaardigd is op grond van de te verwachten ontwikkeling van het aantal
      leerlingen of onderwijskundige ontwikkelingen,

      d. op andere wijze dan is gevraagd redelijkerwijs in de behoefte aan huisvesting van de school kan worden voorzien,
      of

      e. de gewenste voorziening op grond van de hem ten dienste staande gegevens niet noodzakelijk is.

      2 Een voorziening in de huisvesting kan tevens worden geweigerd, indien de voorziening als gevolg van het
      verwijtbaar nalaten van noodzakelijk onderhoud in een slechte bouwkundige staat verkeert of indien de voorziening
      nodig is voor herstel van schade die is veroorzaakt door schuld of toedoen van het bevoegd gezag.

      3 Alvorens Onze Minister een besluit neemt dat afwijkt van hetgeen in het verzoek is aangegeven, pleegt hij overleg
      met het bevoegd gezag.

      4 [Artikel C 13, vierde lid][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003833#ArtikelC_14
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel92
      [ref3]: https://wetten.overheid.nl/BWBR0003833#ArtikelC_13
    url: https://wetten.overheid.nl/BWBR0003833/2001-08-01#ArtikelC_14a
