      a. de uitgaven voor het personeel dat is aangesteld ten laste van het formatiebudget, en

      b. de geldswaarde van niet verbruikte formatierekeneenheden, en

      c. de vergoedingen, bedoeld in [artikel 96][ref2].

      2 [Artikel 137, tweede en derde lid, van de wet][ref3] alsmede [artikel 30 van het Bekostigingsbesluit WPO][ref4]
