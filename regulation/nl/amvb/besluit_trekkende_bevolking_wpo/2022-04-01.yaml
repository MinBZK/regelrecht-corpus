articles:
  - number: A 1
    text: |-
      In dit besluit wordt verstaan onder: *wet*: [Wet op het primair onderwijs][ref1]; *school*: een basisschool als
      bedoeld in de [titels B][ref2] en [C van dit besluit][ref3], tenzij het tegendeel blijkt; *schooljaar*: het tijdvak
      van 1 augustus tot en met 31 juli daaraanvolgend voor zover in dit besluit niet anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0003420
      [ref2]: https://wetten.overheid.nl/BWBR0003833
      [ref3]: https://wetten.overheid.nl/BWBR0003833
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelA_1
