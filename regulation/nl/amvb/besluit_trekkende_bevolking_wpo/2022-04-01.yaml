  - number: B 1.1
    text: |-
      Het onderwijs aan kinderen van wie de ouders in het kermisbedrijf of het circusbedrijf werkzaam zijn, wordt gegeven
      in daartoe ingerichte voertuigen die standplaats kiezen bij daarvoor in aanmerking komende kermissen of circussen.
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelB_1
  - number: B 1.2
    text: |-
      Gedurende een aantal maanden in het jaar kunnen de scholen een vaste standplaats innemen die wordt bepaald door het
      bevoegd gezag in overeenstemming met de inspecteur. Indien de inspecteur bedenkingen heeft tegen de standplaats en
      het bevoegd gezag weigert daaraan tegemoet te komen, besluit Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelB_1
  - number: B 1.3
    text: In afwijking van het eerste lid kan het onderwijs ook gedeeltelijk op afstand worden gegeven.
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelB_1
  - number: B 2
    text: |-
      Het onderwijs aan kinderen van wie de ouders in het kermisbedrijf, onderscheidenlijk het circusbedrijf werkzaam
      zijn, wordt gegeven in scholen die bestemd zijn voor kinderen vanaf de leeftijd van 4 tot omstreeks 12 jaar. Het
      legt mede de grondslag voor het volgen van aansluitend basisonderwijs, onderscheidenlijk aansluitend voortgezet
      onderwijs.
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelB_2
  - number: B 3
    text: Artikel 9, eerste tot en met derde lid, vijfde en zesde lid, van de wet is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelB_3
  - number: B 10.1
    text: |-
      Om als leerling tot een school voor kinderen als bedoeld in [artikel B 2][ref1] te worden toegelaten, moet het kind
      de leeftijd van 4 jaar hebben bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0003833#Afdeling2
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelB_10
    references:
      - id: ref1
        bwb_id: BWBR0003833
        afdeling: '2'
  - number: B 10.2
    text: |-
      De leerlingen verlaten de school, bedoeld in het eerste lid, in elk geval na afloop van het schooljaar waarin zij
      de leeftijd van 14 jaar hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelB_10
  - number: B 12
    text: |-
      De [artikelen 1][ref1], [2][ref2], [4][ref3], [9 tot en met 12][ref4], [23][ref5], [24][ref6] en
      [26 van het Besluit bekostiging WPO 2022][ref7] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0046159#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0046159#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0046159#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0046159#Artikel9
      [ref5]: https://wetten.overheid.nl/BWBR0046159#Artikel23
      [ref6]: https://wetten.overheid.nl/BWBR0046159#Artikel24
      [ref7]: https://wetten.overheid.nl/BWBR0046159#Artikel26
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelB_12
    references:
