    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Onderwijs en Wetenschappen, drs. G. van Leijenhorst, van 7 juni 1985,
    nr. 6359/2326, centrale directie Wetgeving en Juridische Zaken;

    Gelet op artikel 115 van de Wet op het basisonderwijs (Stb. 1984, 2);

    Gehoord de Onderwijsraad (advies van 10 oktober 1984, nr. O.R. III/99815LO);

    De Raad van State gehoord (advies van 23 juli 1985, nr. W05.85.0299/12.5.29);

    Gezien het nader rapport van de Staatssecretaris van Onderwijs en Wetenschappen, drs. G. van Leijenhorst, van 2
