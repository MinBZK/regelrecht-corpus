  - number: A 2.1
    text: |-
      [Artikel 4 van de wet][ref1] is niet van toepassing op een school als bedoeld in dit besluit.
      [Artikel 2 van de wet][ref2] is niet van toepassing op de school, bedoeld in [titel C van dit besluit][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel2
