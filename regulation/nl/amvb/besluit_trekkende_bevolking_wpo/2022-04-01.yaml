  - number: A 4
    text: |-
      De [artikelen 12][ref1] en [20 van de Wet register onderwijsdeelnemers][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0042012#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0042012#Artikel20
