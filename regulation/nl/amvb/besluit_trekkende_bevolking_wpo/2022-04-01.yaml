  - number: B 13.1
    text: |-
      Het bevoegd gezag van een bijzondere school kan Onze Minister verzoeken de school voor bekostiging in aanmerking
      te brengen.
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelB_13
  - number: B 13.2
    text: |-
      Het verzoek gaat vergezeld van een opgave van het verwachte aantal leerlingen en de voorgestelde datum van aanvang
      van de bekostiging. Voorts vermeldt het bevoegd gezag naam en adres van het bevoegd gezag en de richting van de
      school.
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelB_13
  - number: B 13.3
    text: |-
      Onze Minister willigt het verzoek in elk geval in, indien op grond van de bij het verzoek overgelegde gegevens
      aannemelijk is dat de school zal worden bezocht door ten minste 20 leerlingen.
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelB_13
  - number: B 13.4
    text: |-
      Onze Minister besluit binnen 3 maanden na ontvangst van het verzoek. Indien Onze Minister niet binnen 3 maanden
      heeft besloten, is het verzoek ingewilligd.
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelB_13
  - number: B 14.1
    text: |-
      Het bevoegd gezag van een bijzondere school dat een voertuig bestemd voor de huisvesting wenst met inbegrip van
      ingrijpende voorzieningen aan een dergelijk voertuig, dient een daartoe strekkend verzoek in bij Onze Minister. Het
      bevoegd gezag vermeldt de reden en de omvang van de voorziening.
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelB_14
  - number: B 14.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing, indien het bevoegd gezag een andere voorziening wenst die niet
      het gewoon onderhoud betreft, alsmede indien het bevoegd gezag een aanschaffing wenst te doen waarmee bij de eerste
      inrichting van de school geen rekening was gehouden.
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelB_14
  - number: B 14.3
    text: 'Onze Minister weigert inwilliging van het verzoek, indien hij van oordeel is dat:'
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelB_14
  - number: B 14.3.a
    text: op andere wijze dan is gevraagd redelijkerwijs in de behoefte aan huisvesting van de school kan worden voorzien;
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelB_14
  - number: B 14.3.b
    text: |-
      de voorgenomen voorziening niet gerechtvaardigd is op grond van de te verwachten ontwikkeling van het aantal
      leerlingen;
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelB_14
  - number: B 14.3.c
    text: de voorgenomen voorziening niet gerechtvaardigd is op grond van onderwijskundige ontwikkelingen;
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelB_14
  - number: B 14.3.d
    text: de voorgenomen voorziening op grond van de hem ten dienste staande gegevens niet noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelB_14
  - number: B 14.4
    text: |-
      Alvorens Onze Minister een besluit neemt die afwijkt van hetgeen in het verzoek is aangegeven, pleegt hij overleg
      met het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelB_14
  - number: B 14.5
    text: Artikel B 13, vierde lid, van dit besluit is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelB_14
  - number: B 15.1
    text: 'De kosten die voor vergoeding uit ''s Rijks kas in aanmerking kunnen komen, zijn:'
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelB_15
  - number: B 15.1.a
    text: |-
      de kosten, bedoeld in [artikel 115, tweede lid, onderdelen a tot en met d, f tot en met i en k, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel115
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelB_15
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '115'
  - number: B 15.1.b
    text: |-
      het onderhoud en de schoonmaak van het voertuig, bedoeld in [artikel B 14][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003833#Afdeling6
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelB_15
    references:
      - id: ref1
        bwb_id: BWBR0003833
        paragraaf: '3'
        afdeling: '6'
  - number: B 15.1.c
    text: de kosten voor verplaatsing en inneming van standplaats;
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelB_15
  - number: B 15.1.d
    text: de kosten voor noodzakelijk vervoer van leerlingen ten behoeve van het schoolbezoek; en
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelB_15
  - number: B 15.1.e
    text: de reiskosten en andere noodzakelijke kosten verbonden aan het ononderbroken meerdaagse verblijf van het personeel.
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelB_15
  - number: B 15.2
    text: |-
      De bekostiging is redelijkerwijs voldoende voor het leiden en beheren van de school, voor het geven van onderwijs
      aan de school en voor de overige werkzaamheden die verband houden met het onderwijs aan de school.
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelB_15
  - number: B 15.3
    text: De bekostiging bestaat uit een jaarlijks bij ministeriële regeling vast te stellen bedrag per school.
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelB_15
  - number: B 16.1
    text: |-
      In geval van bijzondere ontwikkelingen in het basisonderwijs, kan Onze Minister in aanvulling op de bekostiging,
      bedoeld in [artikel B 15][ref1], bekostiging verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0003833#Afdeling6
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelB_16
    references:
      - id: ref1
        bwb_id: BWBR0003833
        paragraaf: '4'
        afdeling: '6'
  - number: B 16.2
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over het verstrekken van de aanvullende bekostiging, bedoeld
      in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelB_16
  - number: B 16.3
    text: |-
      Onze Minister kan een bekostigingsplafond instellen voor de aanvullende bekostiging, bedoeld in het eerste lid. In
      dat geval worden bij ministeriële regeling regels gesteld over de verdeling.
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelB_16
  - number: B 17
    text: |-
      Het Rijk vergoedt aan het bevoegd gezag van een bijzondere school de kosten van de voorzieningen genoemd in artikel
      B 14.
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelB_17
  - number: B 20.1
    text: |-
      Onze Minister stelt jaarlijks uiterlijk op 1 januari, de bekostigingsbedragen, bedoeld in [artikel B 15][ref1]
      vast. De bedragen hebben betrekking op een kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003833#Afdeling6
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelB_20
    references:
      - id: ref1
        bwb_id: BWBR0003833
        paragraaf: '4'
        afdeling: '6'
  - number: B 20.2
    text: |-
      De in het eerste lid bedoelde bekostigingsbedragen kunnen gedurende het kalenderjaar door Onze Minister worden
      gewijzigd wegens algemene salarismaatregelen of wegens andere al dan niet uit de rijksbegroting voortvloeiende
      maatregelen.
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelB_20
  - number: B 21
    text: |-
      De betaling van de bekostiging vindt maandelijks plaats in een bij ministeriële regeling vast te stellen
      betaalritme dat voor verschillende delen van de bekostiging verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelB_21
  - number: B 21a.1
    text: |-
      In deze paragraaf wordt onder het aantal leerlingen van de school verstaan: het aantal unieke leerlingen als
      bedoeld in [artikel B 10, eerste lid][ref1], tot 1 oktober van het schooljaar, geteld over de periode vanaf
      1 oktober van het voorafgaande schooljaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003833#Afdeling4
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelB_21a
    references:
      - id: ref1
        bwb_id: BWBR0003833
        afdeling: '4'
  - number: B 21a.2
    text: |-
      Het bevoegd gezag vermeldt het aantal leerlingen van de school in het jaarverslag, bedoeld in
      [artikel 165, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel165
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelB_21a
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '165'
  - number: B 22.1
    text: |-
      De bekostiging van een school onder het bevoegd gezag wordt beëindigd op 1 augustus indien het aantal leerlingen
      van alle scholen onder dat bevoegd gezag gedurende drie achtereenvolgende jaren per school gemiddeld telkens minder
      heeft bedragen dan 10.
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelB_22
  - number: B 22.2
    text: |-
      De bekostiging van een bijzondere school wordt niet beëindigd binnen de eerste 5 jaren van bekostiging van de
      school.
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelB_22
  - number: B 23.1
    text: |-
      Indien gebouwen, terreinen of roerende zaken van scholen, ten behoeve waarvan een vergoeding is genoten, geheel
      of gedeeltelijk aan hun bestemming worden onttrokken of met toestemming van Onze Minister worden vervreemd, anders
      dan bedoeld in artikel 56 van de wet, dan wel indien de bekostiging wordt beëindigd, is het bevoegd gezag van een
      bijzondere school aan het Rijk een bedrag verschuldigd. Het bevoegd gezag kan, buiten het geval van vervreemding,
      in plaats van betaling van dit bedrag de eigendom van die gebouwen, terreinen of roerende zaken, binnen 4 maanden
      aan het Rijk overdragen.
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelB_23
  - number: B 23.2
    text: |-
      Onze Minister stelt na overleg met het bevoegd gezag het bedrag bedoeld in het eerste lid, vast op de grondslag van
      de waarde van de gebouwen, terreinen of roerende zaken en de door het bevoegd gezag daarvoor ontvangen vergoedingen
      en uit eigen middelen bestede gelden.
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelB_23
  - number: C 1.1
    text: Het onderwijs aan varende kinderen wordt verzorgd door de school voor varende kinderen.
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelC_1
  - number: C 1.2
    text: |-
      Het bevoegd gezag van de school voor varende kinderen houdt een hoofdvestiging in stand en kan in een of meer
      andere gemeenten een vestiging in stand houden waar onderwijs aan varende kinderen wordt verzorgd.
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelC_1
  - number: C 2.1
    text: |-
      Het onderwijs aan varende kinderen is het onderwijs bestemd voor kinderen van 3,5 tot omstreeks 7 jaar die aan
      boord wonen bij hun ouders, die het schippersbedrijf uitoefenen.
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelC_2
  - number: C 2.2
    text: |-
      De inspecteur kan toestemming verlenen dat andere kinderen dan bedoeld in het eerste lid, van wie de ouders een
      trekkend bestaan leiden, tot het onderwijs aan varende kinderen worden toegelaten.
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelC_2
  - number: C 2.3
    text: |-
      [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref1] is van toepassing op het verzoek om toestemming,
      bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelC_2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: C 3.1
    text: |-
      [Artikel 9 van de wet][ref1] is van overeenkomstige toepassing, met dien verstande dat de verplichting tot het
      geven van onderwijs in de Engelse en Friese taal niet bestaat. Het onderwijs aan varende kinderen legt mede de
      grondslag voor het volgen van aansluitend basisonderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel9
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelC_3
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '9'
  - number: C 3.2
    text: 'Het onderwijs aan varende kinderen wordt verzorgd:'
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelC_3
  - number: C 3.2.a
    text: |-
      in onderwijsruimten op plaatsen waar de school voor varende kinderen of een vestiging van deze school in stand
      wordt gehouden;
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelC_3
  - number: C 3.2.b
    text: 'aan boord, door middel van:'
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelC_3
  - number: C 3.2.b.1
    text: e boordbezoek,
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelC_3
  - number: C 3.2.b.2
    text: e afstandsonderwijs door middel van vormen van telecommunicatie, dan wel
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelC_3
  - number: C 3.2.b.3
    text: e speelwerkpakketten
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelC_3
  - number: C 3.3
    text: |-
      Een leerling is gehouden het onderwijs, bedoeld in het tweede lid, onderdeel a, te volgen indien de afstand tussen
      de ligplaats van het schip waar de leerling aan boord woont en de school voor varende kinderen of een vestiging
      van deze school minder bedraagt dan 5 kilometer, gemeten langs de kortste voor de leerling voldoende begaanbare en
      veilige weg.
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelC_3
  - number: C 9.1
    text: |-
      Een kind kan als leerling tot de school voor varende kinderen worden toegelaten indien het de leeftijd van 3,5 jaar
      heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelC_9
  - number: C 9.2
    text: |-
      Een leerling verlaat de school voor varende kinderen in elk geval na afloop van het schooljaar waarin deze de
      leeftijd van 7 jaar heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelC_9
  - number: C 10
    text: |-
      De [artikelen 7, tweede, derde en vierde lid][ref1], en [9 tot en met 12 van het Besluit bekostiging WPO 2022][ref2]
      zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0046159#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0046159#Artikel9
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelC_10
    references:
      - id: ref1
        bwb_id: BWBR0046159
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0046159
        artikel: '9'
  - number: C 11.1
    text: Onze Minister stelt jaarlijks de bekostiging voor de school voor varende kinderen vast.
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelC_11
  - number: C 11.2
    text: De bekostiging bestaat uit een bedrag per school en een bedrag per leerling.
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelC_11
  - number: C 11.3
    text: |-
      Bij ministeriële regeling worden jaarlijks de bedragen, bedoeld in het tweede lid vastgesteld en worden nadere
      regels gesteld over de wijze waarop de hoogte van de bekostiging wordt berekend.
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelC_11
  - number: C 11.4
    text: |-
      Bij de toepassing van het tweede lid wordt uitgegaan van het aantal leerlingen, bedoeld in [artikel C 2][ref1], dat
      op 1 februari van het voorafgaande jaar, aan de school voor varende kinderen is ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0003833#ArtikelC_2
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelC_11
    references:
      - id: ref1
        bwb_id: BWBR0003833
        artikel: C_2
        afdeling: '2'
  - number: C 12.1
    text: |-
      In geval van bijzondere ontwikkelingen in het basisonderwijs, kan Onze Minister in aanvulling op de bekostiging,
      bedoeld in [artikel C 11][ref1] bekostiging verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0003833#ArtikelC_11
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelC_12
    references:
      - id: ref1
        bwb_id: BWBR0003833
        artikel: C_11
        paragraaf: '2'
        afdeling: '4'
  - number: C 12.2
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over het verstrekken van de aanvullende bekostiging, bedoeld
      in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelC_12
  - number: C 12.3
    text: |-
      Onze Minister kan een bekostigingsplafond instellen voor de aanvullende bekostiging, bedoeld in het eerste lid. In
      dat geval worden bij ministeriële regeling regels gesteld over de verdeling.
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelC_12
  - number: C 13.1
    text: Het Rijk bekostigt ten behoeve van elk kalenderjaar de uitgaven voor voorzieningen in de huisvesting.
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelC_13
  - number: C 13.2
    text: |-
      De bekostiging van voorzieningen in de huisvesting ten behoeve van een kalenderjaar, bestaat uit een vast bedrag,
      verhoogd met een bedrag voor elke leerling, bedoeld in [artikel C 11, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003833#ArtikelC_11
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelC_13
    references:
      - id: ref1
        bwb_id: BWBR0003833
        artikel: C_11
        paragraaf: '2'
        afdeling: '4'
  - number: C 13.3
    text: |-
      De bekostiging, bedoeld in het tweede lid, wordt jaarlijks aangepast overeenkomstig de prijsmutatie van de netto
      materiële consumptie, zoals opgenomen in de Macro Economische Verkenning, die naar verwachting zal optreden tussen
      het prijsniveau in het kalenderjaar waarvoor de bekostiging wordt vastgesteld en het prijsniveau in het daaraan
      voorafgaande jaar.
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelC_13
  - number: C 16.1
    text: |-
      Onze Minister stelt jaarlijks uiterlijk op 1 januari, de bekostigingsbedragen, bedoeld in [artikel C 11][ref1]
      vast. De bedragen hebben betrekking op een kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003833#ArtikelC_11
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelC_16
    references:
      - id: ref1
        bwb_id: BWBR0003833
        artikel: C_11
        paragraaf: '2'
        afdeling: '4'
  - number: C 16.2
    text: |-
      De in het eerste lid bedoelde bekostigingsbedragen kunnen door Onze Minister worden gewijzigd wegens algemene
      salarismaatregelen of wegens andere al dan niet uit de rijksbegroting voortvloeiende maatregelen.
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelC_16
  - number: C 16.1
    text: |-
      De betaling van de bekostiging vindt maandelijks plaats in een bij ministeriële regeling vast te stellen
      betaalritme dat voor verschillende delen van de bekostiging verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelC_16.1
  - number: C 17
    text: |-
      De [artikelen 128 tot en met 134 van de wet][ref1] zijn van overeenkomstige toepassing, met dien verstande
      dat in [artikel 130, vierde en vijfde lid][ref2], «nevenvestiging» wordt gelezen als: vestiging, bedoeld in
      [artikel C 1, tweede lid][ref3], van het Besluit trekkende bevolking WPO.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel126
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel130
      [ref3]: https://wetten.overheid.nl/BWBR0003833#ArtikelC_1
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelC_17
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '126'
      - id: ref2
        bwb_id: BWBR0003420
        artikel: '130'
      - id: ref3
        bwb_id: BWBR0003833
        artikel: C_1
        afdeling: '1'
  - number: C 19
    text: |-
      Indien een andere school voor basisonderwijs tijdelijk het onderwijs verzorgt aan een of meer leerlingen die zijn
      ingeschreven bij de school voor varende kinderen, ontvangt die andere school voor basisonderwijs ondersteuning door
      de school voor varende kinderen en kan die andere school voor basisonderwijs een vergoeding ontvangen volgens een
      regeling die het bevoegd gezag van de school voor varende kinderen met het bevoegd gezag van die andere school voor
      basisonderwijs overeenkomt.
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelC_19
  - number: C 20
    text: |-
      De bekostiging van de school voor varende kinderen wordt beëindigd indien het aantal ingeschreven leerlingen in het
      eerste en derde schooljaar van 3 achtereenvolgende schooljaren telkens minder heeft bedragen dan 50.
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelC_20
  - number: G 1
    text: |-
      Dit besluit berust op [artikel 193 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel193
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelG_1
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '193'
  - number: G 2
    text: |-
      Met inachtneming van het bepaalde in [artikel 185, derde lid, van de Wet op het primair onderwijs][ref1] treedt dit
      besluit in werking op een bij koninklijk besluit te bepalen datum. Het koninklijk besluit kan er in voorzien dat
      het besluit terugwerkende kracht heeft tot en met 1 augustus 1985.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel185
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelG_2
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '185'
  - number: G 3
    text: Dit besluit kan worden aangehaald als "Besluit trekkende bevolking WPO".
    url: https://wetten.overheid.nl/BWBR0003833/2022-04-01#ArtikelG_3
