preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Onderwijs, Cultuur en Wetenschappen van 28 april 2003, WJZ/2003/9996 (2590),
    gedaan mede namens de Staatssecretaris van Landbouw, Natuurbeheer en Visserij;

    Gelet op de artikelen 103d, derde lid, en 103e, tweede lid, van de Wet op het voortgezet onderwijs;

    De Raad van State gehoord (advies van 10 juli 2003, nr. W05.03.0161/III);

    Gezien het nader rapport van Onze Minister van Onderwijs, Cultuur en Wetenschappen van 4 augustus 2003, nr.
    WJZ/2003/36772 (2590), uitgebracht mede namens Onze Minister van Landbouw, Natuur en Voedselkwaliteit;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0015457/2019-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0015457/2019-01-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Onderwijs, Cultuur en Wetenschap;'
    url: https://wetten.overheid.nl/BWBR0015457/2019-01-01#Artikel1
  - number: 1.b
    text: |-
      inspectie: de inspectie, bedoeld in de [Wet op het onderwijstoezicht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013800
    url: https://wetten.overheid.nl/BWBR0015457/2019-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013800
  - number: 1.c
    text: |-
      wet: de [Wet op het voortgezet onderwijs][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0015457/2019-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002399
  - number: 1.d
    text: |-
      basisregister onderwijs: basisregister onderwijs als bedoeld in
      [artikel 24b van de Wet op het onderwijstoezicht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel24b
    url: https://wetten.overheid.nl/BWBR0015457/2019-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: 24b
  - number: 1.e
    text: |-
      persoonsgebonden nummer: het persoonsgebonden nummer, bedoeld in [artikel 1 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel1
    url: https://wetten.overheid.nl/BWBR0015457/2019-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '1'
  - number: '2'
    text: |-
      Dit besluit is van toepassing op de gegevens van leerlingen die zijn ingeschreven of ingeschreven zijn geweest aan
      een uit de openbare kas bekostigde school als bedoeld in [de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0015457/2019-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002399
  - number: '7.1'
    text: |-
      Ten behoeve van de vaststelling van de bekostiging van een school als bedoeld in [de wet][ref1] kan Onze Minister
      de volgende in het basisregister onderwijs opgenomen gegevens van een leerling of voormalige leerling van de school
      gebruiken:


      [ref1]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0015457/2019-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002399
  - number: 7.1.a
    text: het persoonsgebonden nummer;
    url: https://wetten.overheid.nl/BWBR0015457/2019-01-01#Artikel7
  - number: 7.1.b
    text: de geboortedatum en het geboorteland;
    url: https://wetten.overheid.nl/BWBR0015457/2019-01-01#Artikel7
  - number: 7.1.c
    text: het geboorteland van de moeder en het geboorteland van de vader;
    url: https://wetten.overheid.nl/BWBR0015457/2019-01-01#Artikel7
  - number: 7.1.d
    text: de gegevens over het verblijf in Nederland en het vertrek uit Nederland;
    url: https://wetten.overheid.nl/BWBR0015457/2019-01-01#Artikel7
  - number: 7.1.e
    text: de datum van in- of uitschrijving;
    url: https://wetten.overheid.nl/BWBR0015457/2019-01-01#Artikel7
  - number: 7.1.f
    text: de soort onderwijs;
    url: https://wetten.overheid.nl/BWBR0015457/2019-01-01#Artikel7
  - number: 7.1.g
    text: de leerweg of het profiel;
    url: https://wetten.overheid.nl/BWBR0015457/2019-01-01#Artikel7
  - number: 7.1.h
    text: het behaalde diploma;
    url: https://wetten.overheid.nl/BWBR0015457/2019-01-01#Artikel7
  - number: 7.1.i
    text: de aanduiding van de minderheidsgroep en de verblijfsduur in Nederland; en
    url: https://wetten.overheid.nl/BWBR0015457/2019-01-01#Artikel7
  - number: 7.1.j
    text: |-
      het registratienummer van de school dan wel scholengemeenschap of, indien sprake is van een nevenvestiging, het
      registratienummer daarvan.
    url: https://wetten.overheid.nl/BWBR0015457/2019-01-01#Artikel7
  - number: '7.2'
    text: |-
      De gegevens bedoeld in het eerste lid, onderdelen e tot en met j, worden gespecificeerd overeenkomstig het bepaalde
      krachtens [artikel 103b, derde lid, eerste volzin, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel103b
    url: https://wetten.overheid.nl/BWBR0015457/2019-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 103b
  - number: '9.1'
    text: |-
      De gegevens, bedoeld in [artikel 7][ref1], worden uitsluitend gebruikt door de daartoe door Onze Minister
      aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0015457#Artikel7
    url: https://wetten.overheid.nl/BWBR0015457/2019-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0015457
        artikel: '7'
        paragraaf: '3'
  - number: '9.2'
    text: 'Onze Minister kan uitsluitend gebruiken:'
    url: https://wetten.overheid.nl/BWBR0015457/2019-01-01#Artikel9
  - number: 9.2.a
    text: |-
      de gegevens van een leerling of voormalige leerling van wie het bevoegd gezag op grond van
      [artikel 103b, vierde lid, van de wet][ref1] het persoonsgebonden nummer aan Onze Minister heeft verstrekt ten
      behoeve van de vaststelling van de bekostiging van de school;


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel103b
    url: https://wetten.overheid.nl/BWBR0015457/2019-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 103b
  - number: 9.2.b
    text: |-
      de gegevens van een leerling of voormalige leerling, voorzover Onze Minister dit noodzakelijk acht ten behoeve van
      een onderzoek als bedoeld in [artikel 103c, derde lid, van de wet][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel103c
    url: https://wetten.overheid.nl/BWBR0015457/2019-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 103c
  - number: 9.2.c
    text: |-
      de gegevens van een leerling of voormalige leerling, voorzover Onze Minister het noodzakelijk acht deze gegevens
      ten behoeve van de vaststelling van de bekostiging van de school te gebruiken in het verkeer met die school.
    url: https://wetten.overheid.nl/BWBR0015457/2019-01-01#Artikel9
  - number: '9.3'
    text: |-
      Onder gebruik ten behoeve van de vaststelling van de bekostiging wordt mede verstaan het daartoe noodzakelijke
      gebruik voor de motivering van beschikkingen en de behandeling van bezwaar- en beroepschriften.
    url: https://wetten.overheid.nl/BWBR0015457/2019-01-01#Artikel9
  - number: '11'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0015457/2019-01-01#Artikel11
  - number: '12'
    text: 'Dit besluit wordt aangehaald als: Besluit gebruik persoonsgebonden nummers WVO.'
    url: https://wetten.overheid.nl/BWBR0015457/2019-01-01#Artikel12
