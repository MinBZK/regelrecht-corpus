articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. Onze Minister: Onze Minister van Onderwijs, Cultuur en Wetenschap;

      b. inspectie: de inspectie, bedoeld in de [Wet op het onderwijstoezicht][ref1];

      c. wet: de [Wet op het voortgezet onderwijs][ref2];

      d. basisregister onderwijs: basisregister onderwijs als bedoeld in
      [artikel 24b van de Wet op het onderwijstoezicht][ref3];

      e. persoonsgebonden nummer: het persoonsgebonden nummer, bedoeld in [artikel 1 van de wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0013800
