  - number: '2'
    text: |-
      Dit besluit is van toepassing op de gegevens van leerlingen die zijn ingeschreven of ingeschreven zijn geweest aan
      een uit de openbare kas bekostigde school als bedoeld in [de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002399
    url: https://wetten.overheid.nl/BWBR0015457/2019-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002399
  - number: '7'
    text: |-
      1 Ten behoeve van de vaststelling van de bekostiging van een school als bedoeld in [de wet][ref1] kan Onze Minister
      de volgende in het basisregister onderwijs opgenomen gegevens van een leerling of voormalige leerling van de school
      gebruiken:

      a. het persoonsgebonden nummer;

      b. de geboortedatum en het geboorteland;

      c. het geboorteland van de moeder en het geboorteland van de vader;

      d. de gegevens over het verblijf in Nederland en het vertrek uit Nederland;

      e. de datum van in- of uitschrijving;

      f. de soort onderwijs;

      g. de leerweg of het profiel;

      h. het behaalde diploma;

      i. de aanduiding van de minderheidsgroep en de verblijfsduur in Nederland; en

      j. het registratienummer van de school dan wel scholengemeenschap of, indien sprake is van een nevenvestiging, het
      registratienummer daarvan.

      2 De gegevens bedoeld in het eerste lid, onderdelen e tot en met j, worden gespecificeerd overeenkomstig het
      bepaalde krachtens [artikel 103b, derde lid, eerste volzin, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel103b
    url: https://wetten.overheid.nl/BWBR0015457/2019-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002399
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 103b
  - number: '9'
    text: |-
      1 De gegevens, bedoeld in [artikel 7][ref1], worden uitsluitend gebruikt door de daartoe door Onze Minister
      aangewezen ambtenaren.

      2 Onze Minister kan uitsluitend gebruiken:

      a. de gegevens van een leerling of voormalige leerling van wie het bevoegd gezag op grond van
      [artikel 103b, vierde lid, van de wet][ref2] het persoonsgebonden nummer aan Onze Minister heeft verstrekt ten
      behoeve van de vaststelling van de bekostiging van de school;

      b. de gegevens van een leerling of voormalige leerling, voorzover Onze Minister dit noodzakelijk acht ten behoeve
      van een onderzoek als bedoeld in [artikel 103c, derde lid, van de wet][ref3]; en

      c. de gegevens van een leerling of voormalige leerling, voorzover Onze Minister het noodzakelijk acht deze gegevens
      ten behoeve van de vaststelling van de bekostiging van de school te gebruiken in het verkeer met die school.

      3 Onder gebruik ten behoeve van de vaststelling van de bekostiging wordt mede verstaan het daartoe noodzakelijke
      gebruik voor de motivering van beschikkingen en de behandeling van bezwaar- en beroepschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0015457#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel103b
      [ref3]: https://wetten.overheid.nl/BWBR0002399#Artikel103c
