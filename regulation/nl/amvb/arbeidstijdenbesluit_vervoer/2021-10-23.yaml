  - number: 6A.1:1
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:

      a. *vissersvaartuig:* een zeevissersschip als bedoeld in
      [artikel 2, derde lid, van Boek 8 van het Burgerlijk Wetboek][ref1];

      b. *scheepsbeheerder:* de natuurlijke of rechtspersoon die vanuit een vestiging in Nederland van een
      visserijonderneming de dagelijkse leiding heeft over het beheer van een vissersvaartuig;

      c. *schipper:* de gezagvoerder van een vissersvaartuig;

      d. *visser:* een zeevarende als bedoeld in [artikel 1, onderdeel aa, van de Wet zeevarenden][ref2];

      e. *jeugdige visser:* de visser van 16 of 17 jaar;

      f. *rusttijd:* een periode van ten minste een uur waarin geen arbeid wordt verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009124#Artikel1
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel6A.11
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0009124
        artikel: '1'
  - number: 6A.1:2
    text: |-
      1 Voor de toepassing van dit hoofdstuk geldt de periode waarin door de visser, die werknemer is, of de visser
      die zonder werkgever of werknemer in de zin van de wet te zijn, samen met werknemers op hetzelfde vissersvaartuig
      arbeid verricht, door omstandigheden inherent aan de visserij, geen arbeid kan worden verricht hoewel hij volgens
      zijn werkrooster arbeid zou moeten verrichten, als rusttijd.

      2 In afwijking van het eerste lid worden niet als rusttijd aangemerkt de perioden waarin de visser, bedoeld in het
      eerste lid, niet vrijelijk over zijn tijd kan beschikken en zich gereed houdt tot een onmiddellijke aanvang der
      werkzaamheden, en waarbij het tijdstip van de aanvang en de duur van deze perioden niet vooraf bekend is.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel6A.12
  - number: 6A.1:3
    text: |-
      Met uitsluiting van hetgeen in het [Arbeidstijdenbesluit][ref1] is bepaald zijn dit hoofdstuk en de daarop
      berustende bepalingen uitsluitend van toepassing op arbeid, verricht door schippers en vissers aan boord van
      vissersvaartuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0007687
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel6A.13
    references:
      - id: ref1
        bwb_id: BWBR0007687
  - number: 6A.1:4
    text: |-
      1 De schipper die vissers aan boord heeft die werknemer zijn, zorgt ervoor dat aan boord van het vissersvaartuig
      op een voor alle vissers toegankelijke plaats een werkrooster is opgehangen, waarin zijn arbeidspatroon en dat van
      alle aan boord zijnde vissers alsmede de wettelijk voorgeschreven arbeids- en rusttijden worden vermeld.

      2 Bij regeling van Onze Minister van Infrastructuur en Waterstaat kan een model worden vastgesteld voor een
      werkrooster. Bij die regeling kunnen voorschriften worden gegeven omtrent de invulling van het werkrooster.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel6A.14
  - number: 6A.2:1
    text: |-
      In plaats van [paragraaf 5.2 van de wet][ref1] wordt deze paragraaf toegepast op arbeid, verricht aan boord van
      een vissersvaartuig.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Paragraaf5.2
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel6A.21
    references:
      - id: ref1
