        artikel: '3.10'
      - id: ref3
        bwb_id: BWBR0030215
        artikel: '3.11'
  - number: 5.1:2
    text: |-
      1 Voor de toepassing van dit hoofdstuk geldt de periode waarop de arbeid van het bemanningslid zich beperkt tot de
      aanwezigheid op het schip, zonder dat hij zijn taken uitoefent, eveneens als rusttijd.

      2 In afwijking van het eerste lid worden niet als rusttijd aangemerkt de perioden waarin het bemanningslid niet
      vrijelijk over zijn tijd kan beschikken en zich gereed houdt tot een onmiddellijke aanvang der werkzaamheden, en
      waarbij het tijdstip van de aanvang en de duur van deze perioden niet vooraf bekend is.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel5.12
  - number: 5.2:1
    text: |-
      [Artikel 4:3][ref1] en [hoofdstuk 5 van de wet][ref2] en de daarop berustende
      bepalingen zijn niet van toepassing op arbeid, verricht op schepen als bedoeld in
      [artikel 12, tweede lid, onderdelen a, b en c, van het Binnenvaartbesluit][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Hoofdstuk5
      [ref3]: https://wetten.overheid.nl/BWBR0025631#Artikel12
