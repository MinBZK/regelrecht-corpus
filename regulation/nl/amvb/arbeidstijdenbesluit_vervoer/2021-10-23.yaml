  - number: 5.2:2
    text: |-
      [Paragraaf 5.1][ref1] en – voorzover aangeduid als overtredingen of strafbare feiten – de
      [paragrafen 5.2 tot en met 5.5][ref2] en de daarop berustende bepalingen van de wet zijn van overeenkomstige
      toepassing op bemanningsleden die geen werkgever of werknemer zijn in de zin van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Paragraaf5.2
