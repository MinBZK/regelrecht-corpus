  - number: 2.4:2
    text: |-
      1 Bij taxivervoer wordt door de werkgever, de bestuurder en de persoon, bedoeld in
      [artikel 2:7, eerste lid, van de wet][ref1] ten behoeve van een deugdelijke registratie van de arbeids- en
      rusttijden, een boordcomputer, als bedoeld in [artikel 79, eerste lid, van het Besluit personenvervoer 2000][ref2]
      gebruikt, overeenkomstig het bepaalde bij of krachtens voornoemd besluit.

      2 Bij regeling van Onze Minister van Infrastructuur en Waterstaat worden nadere regels gesteld over de
      registratieverplichtingen die op de vervoerder en de bestuurder rusten indien de boordcomputer buiten gebruik is en
      de gegevens die in dat geval aanwezig zijn in de taxi.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0011982#Artikel79
