  - number: 5.3:1
    text: |-
      1 Met uitsluiting van hetgeen in het [Arbeidstijdenbesluit][ref1] is bepaald, is dit hoofdstuk van toepassing op
      arbeid, verricht door een bemanningslid aan boord van schepen waarop de [Binnenvaartwet][ref2] van toepassing is.

      2 In afwijking van het eerste lid en met uitsluiting van hetgeen in het [Arbeidstijdenbesluit][ref3] is bepaald,
      is [paragraaf 6.6][ref4] van overeenkomstige toepassing op arbeid, verricht door bemanningsleden aan boord van
      de in dat lid bedoelde schepen gedurende de tijd dat dit schip dienst doet in havensleepdienst als bedoeld in
      [artikel 6.1:1, onderdeel b][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0007687
