        paragraaf: '5.2'
  - number: 6a.2:1a
    text: |-
      1 De [artikelen 6A.2:2, tweede lid][ref1], [6A.2:3][ref2],
      [6A.2:4, met uitzondering van het eerste lid, onder b en het derde lid, onder b][ref3], [6A.2:5][ref4] en
      [6A.2:7][ref5], zijn uitsluitend van toepassing op de visser die werknemer is, of, de visser die zonder werkgever
      of werknemer in de zin van de wet te zijn, samen met werknemers op hetzelfde vissersvaartuig arbeid verricht.

      2 [Artikel 6A.2:2, eerste en derde lid][ref6], is van overeenkomstige toepassing op de visser van 16 jaar en ouder
      die zonder werkgever of werknemer in de zin van de wet te zijn arbeid verricht aan boord van een vissersvaartuig
      dat langer dan drie dagen op zee blijft.

      3 [Artikel 6A.2:4, eerste lid, onder b en derde lid, onder b][ref7], is van overeenkomstige toepassing op de
      jeugdige visser die zonder werkgever of werknemer in de zin van de wet te zijn arbeid verricht aan boord van een
      vissersvaartuig.


