  - number: 2.5:5
    text: |-
      1 Dit artikel is uitsluitend van toepassing op arbeid verricht in het kader van:

      a. vervoer van brood- en banketbakkerijproducten;

      b. vervoer van goederen van en naar distributiecentra, terminals of luchthavens;

      c. grensoverschrijdend vervoer van bloembollen, bloemen, planten en boomkwekerijproducten, groente en fruit;

      d. vervoer ten behoeve van het onderhoud en de aanleg van wegen en railverbindingen.

      2 In afwijking van [artikel 2.5:4, tweede lid][ref1], kan dit artikel worden toegepast indien de aard van het
      vervoer met zich brengt dat dit vervoer hoofdzakelijk gedurende de nacht plaatsvindt en dit door het op een andere
      wijze organiseren van het vervoer redelijkerwijs niet is te voorkomen.

      3 De werkgever organiseert de arbeid zodanig, dat de werknemer:

      a. ten hoogste 52 maal in elke periode van 16 achtereenvolgende weken en 140 maal in elke periode van 52
      achtereenvolgende weken arbeid in nachtdienst verricht, of

      b. ten hoogste 38 uren in elke periode van 2 achtereenvolgende weken arbeid verricht tussen 00.00 en 06.00 uur.


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Artikel2.54
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel2.55
    references:
