  - number: 3.3:3
    text: |-
      1 In plaats van [artikel 5:4, tweede en derde lid, van de wet][ref1] wordt dit artikel toegepast.

      2 De werkgever organiseert de arbeid van de machinist zodanig, dat indien hij:

      a. meer dan 6 uur arbeid per dienst verricht, zijn arbeid wordt onderbroken door een pauze van ten minste 30
      minuten;

      b. meer dan 8 uur arbeid per dienst verricht, zijn arbeid wordt onderbroken door een pauze van ten minste 45
      minuten;

      c. een gedeelte van de pauze, bedoeld onder a en b, wordt genoten tussen het derde en het zesde uur waarin arbeid
      wordt verricht.

      3 Het tweede lid, onderdeel b en c, is niet van toepassing ingeval van aanwezigheid van twee dienstdoende
      machinisten in het spoorvoertuig.

      4 De werkgever organiseert de arbeid van het overige personeel in of op het spoorvoertuig zodanig dat indien meer
      dan 6 uur per dienst arbeid wordt verricht, deze arbeid wordt onderbroken door een pauze van ten minste 30 minuten.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel54
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel3.33
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: 5:4
  - number: 3.3:4
    text: |-
      1 De werkgever organiseert de arbeid van de machinist zodanig, dat zijn rijtijd:

      a. ten hoogste 9 uren per dienst bedraagt, dan wel ten hoogste 8 uren indien er 3 of meer uren arbeid wordt
      verricht in de periode tussen 00.00 en 07.00 uur;

      b. ten hoogste 80 uur bedraagt in elke aaneengesloten periode van 14 maal 24 uren, waarin hij ten minste twee
      diensten verricht als bedoeld in [artikel 3.1:1][ref1].

      2 Voor de toepassing van het eerste lid wordt als rijtijd aangemerkt:

      a. de duur van de ingeroosterde activiteit waarbij de machinist verantwoordelijk is voor het besturen van een
      locomotief, en

      b. ingeroosterde onderbrekingen waarin de machinist verantwoordelijk blijft voor de locomotief.

      3 Voor de toepassing van het eerste lid wordt niet als rijtijd aangemerkt de tijd die is voorzien voor het in- en
      uitschakelen van de locomotief.


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Artikel3.11
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel3.34
