  - number: 2.7:3
    text: |-
      Onze Minister van Infrastructuur en Waterstaat wordt aangewezen als de bevoegde autoriteit, bedoeld in de artikelen
      19, tweede lid, en 22, tweede lid, van verordening (EG) nr. 561/2006.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel2.73
  - number: 2.7:4
    text: |-
      1 De werkgever kan een jeugdige werknemer als bijrijder arbeid doen verrichten indien wordt voldaan aan de eisen,
      genoemd in artikel 5, tweede lid, van verordening (EG) nr. 561/2006.

      2 Een jeugdige werknemer voldoet aan artikel 5, tweede lid, onderdeel b, van verordening (EG) nr. 561/2006 indien
      hij een opleiding volgt als bedoeld in [artikel 156q, derde lid, van het Reglement rijbewijzen][ref1].

      3 De werkgever ziet toe op het bezit van de in [artikel 156q, derde lid, van het Reglement rijbewijzen][ref2]
      bedoelde verklaring en het in dat lid bedoelde bewijs van inschrijving.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel156q
