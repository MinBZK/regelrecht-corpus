  - number: 3.2:1
    text: |-
      De werkgever bewaart de gegevens en bescheiden met betrekking tot de in [artikel 4:3 van de wet][ref1] neergelegde
      registratieverplichting ten minste 52 weken, gerekend vanaf de datum waarop de gegevens en bescheiden betrekking
      hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel43
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel3.21
