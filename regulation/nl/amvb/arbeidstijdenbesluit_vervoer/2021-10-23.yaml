  - number: 4.2:2
    text: |-
      [Paragraaf 5.1][ref1] en – voorzover aangeduid als overtredingen – de
      [paragrafen 5.2 tot en met 5.5 van de wet][ref2] en de daarop berustende bepalingen zijn van overeenkomstige
      toepassing op een lid van het boordpersoneel dat geen werkgever of werknemer is in de zin van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Paragraaf5.1
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Paragraaf5.2
