        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 5.5:2
    text: |-
      Voor de toepassing van [de artikelen 5.5:3 tot en met 5.5:5][ref1] houden de werkgever en de gezagvoerend schipper
      rekening met de arbeids-, rust- en vaartijden, vervuld gedurende een tijdvak van 48 uren, onmiddellijk voorafgaand
      aan het tijdstip waarop het schip de binnenwateren is binnengevaren.


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Artikel5.53
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel5.52
    references:
      - id: ref1
        bwb_id: BWBR0009386
        artikel: 5.5:3
        hoofdstuk: '5'
        paragraaf: '5.5'
  - number: 5.5:3
    text: |-
      1 De werkgever en de gezagvoerend schipper organiseren de arbeid zodanig, dat een bemanningslid dat werknemer is
      en arbeid verricht bij exploitatiewijze A1 of A2, een rusttijd heeft van ten minste 10 uren in elke aaneengesloten
      periode van 24 uren.

      2 De in het eerste lid bedoelde rusttijd is:

      a. bij exploitatiewijze A1 ten minste 8 uren ononderbroken en wordt berekend vanaf het einde van iedere
      ononderbroken rusttijd van ten minste 8 uren, en

      b. bij exploitatiewijze A2 ten minste 6 uren ononderbroken en wordt berekend vanaf het einde van iedere
      ononderbroken rusttijd van ten minste 6 uren.

      3 De werkgever en de gezagvoerend schipper organiseren de arbeid zodanig, dat een bemanningslid dat werknemer is en
      arbeid verricht bij exploitatiewijze B, een rusttijd heeft van ten minste 10 uren in elke aaneengesloten tijdruimte
      van 24 uren, waarvan ten minste 6 uren ononderbroken, en 24 uren in een aaneengesloten periode van 48 uren, te
      rekenen vanaf het begin van een rusttijd van ten minste 6 uren.

      4 De werkgever en de gezagvoerend schipper organiseren de arbeid zodanig, dat een bemanningslid dat werknemer is
      een rusttijd heeft van ten minste 84 uren in elke periode van 7 dagen.

      5 De werkgever en de gezagvoerend schipper organiseren de arbeid zodanig, dat een bemanningslid
      als bedoeld in [artikel 1, eerste lid, van de Binnenvaartwet][ref1], dat geen werknemer
      is, rusttijden in acht neemt overeenkomstig de [artikelen 3.11][ref2] onderscheidenlijk
      [3.12 van het Reglement betreffende het scheepvaartpersoneel op de Rijn][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0030215#Artikel3.11
      [ref3]: https://wetten.overheid.nl/BWBR0030215#Artikel3.12
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel5.53
    references:
      - id: ref1
        bwb_id: BWBR0023009
        artikel: '1'
      - id: ref2
