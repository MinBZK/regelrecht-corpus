  - number: 6.3:1
    text: |-
      1 Met uitsluiting van hetgeen in het [Arbeidstijdenbesluit][ref1] is bepaald zijn dit hoofdstuk
      en de daarop berustende bepalingen uitsluitend van toepassing op arbeid, verricht door
      zeevarenden aan boord van zeeschepen die te boek staan in de openbare registers, bedoeld in
      [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref2] of die zijn ingeschreven in het
      rompbevrachtingsregister, bedoeld in [artikel 2 van de Wet nationaliteit zeeschepen][ref3] in rompbevrachting.

      2 In afwijking van het eerste lid is dit hoofdstuk niet van toepassing op duikwerkzaamheden op het continentaal
      plat, bedoeld in [artikel 1, onderdeel c, van de Mijnbouwwet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0007687
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
      [ref3]: https://wetten.overheid.nl/BWBR0005681#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0014168#Artikel1
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel6.31
    references:
      - id: ref1
        bwb_id: BWBR0007687
      - id: ref2
        bwb_id: BWBR0005291
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0005681
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0014168
        artikel: '1'
  - number: 6.3:2
    text: |-
      Dit hoofdstuk is niet van toepassing op arbeid, verricht aan boord van installaties, opgericht op of boven de bodem
      van de zee.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel6.32
  - number: 6.4:1
    text: |-
      1 De kapitein zorgt ervoor dat aan boord van een zeeschip op een voor alle zeevarenden toegankelijke plaats een
      werkrooster aanwezig is, waarin het arbeidstijdpatroon van de zeevarenden is vastgesteld en waarin de wettelijk
      voorgeschreven arbeidstijden en rusttijden worden vermeld.

      2 Bij regeling van Onze Minister van Infrastructuur en Waterstaat wordt een model voor een werkrooster vastgesteld.
      Bij die regeling kunnen voorschriften worden gegeven omtrent de invulling van het werkrooster.

      3 Het werkrooster bevat ten minste de gegevens opgenomen in het model bedoeld in het tweede lid, en is gesteld in
      de werktaal of in de werktalen van het schip en in de Engelse taal.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel6.41
  - number: 6.4:2
    text: |-
      1 De kapitein zorgt ervoor dat de daadwerkelijke arbeidstijden en rusttijden van elke zeevarende uiterlijk na een
      week op een werklijst zijn geregistreerd. De volledig ingevulde werklijst wordt door de desbetreffende zeevarende
      en door of namens de kapitein geaccordeerd. De kapitein zorgt ervoor dat elke zeevarende een afschrift ontvangt van
      zijn werklijst.

      2 De kapitein zorgt ervoor dat de werklijsten uiterlijk 8 weken na de vaststelling ervan ter beschikking van de
      scheepsbeheerder worden gesteld.

      3 De scheepsbeheerder zorgt ervoor dat de werklijsten zorgvuldig worden bijgehouden.

      4 Bij regeling van Onze Minister van Infrastructuur en Waterstaat wordt een model vastgesteld voor een werklijst
      voor de registratie van arbeidstijden en rusttijden. Bij die regeling kunnen voorschriften worden gegeven omtrent
      de invulling van de werklijst.

      5 De werklijst bevat ten minste de gegevens opgenomen in het in het tweede lid bedoelde model en is gesteld in de
      werktaal of in de werktalen van het schip en in de Engelse taal.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel6.42
  - number: 6.4:3
    text: |-
      De scheepsbeheerder bewaart de werklijsten ten minste 3 jaren, gerekend vanaf het einde van de periode waarop de
      werklijsten betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel6.43
  - number: 6.5:1
    text: |-
      In plaats van [paragraaf 5.2 van de wet][ref1] wordt deze paragraaf toegepast op arbeid, verricht aan boord van
      een zeeschip als bedoeld in [artikel 6.1:1, onderdeel a, onder 1°][ref2], met uitzondering van de tijd waarin dit
      zeeschip in havensleepdienst dienst doet.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Paragraaf5.2
      [ref2]: https://wetten.overheid.nl/BWBR0009386#Artikel6.61
