  - number: 2.4:1
    text: |-
      1 Met uitzondering van de gegevens en bescheiden, bedoeld in verordening (EU) nr. 165/2014, en deel c,
      afdeling 2, van bijlage 31 van de Handels- en Samenwerkingsovereenkomst bewaren de werkgever en de persoon,
      bedoeld in [artikel 2:7, eerste lid, van de wet][ref1], de gegevens en bescheiden met betrekking tot de in
      [artikel 4:3 van de wet][ref2] neergelegde registratieverplichting ten minste 104 weken, gerekend vanaf de datum
      waarop de gegevens en bescheiden betrekking hebben.

      2 De werkgever en de persoon, bedoeld in [artikel 2:7, eerste lid, van de wet][ref3], handelen in
      overeenstemming met artikel 33, eerste en tweede lid, van verordening (EU) nr. 165/2014, dan wel, voor zover
      van toepassing, artikel 15, eerste en tweede lid, van deel c, afdeling 2, van bijlage 31 van de Handels- en
      Samenwerkingsovereenkomst.

      3 De bestuurder handelt in overeenstemming met artikel 6, vijfde lid, van verordening (EG) nr. 561/2006, dan
      wel, voor zover van toepassing, artikel 4, vijfde lid, van deel b, afdeling 2, van bijlage 31 van de Handels- en
      Samenwerkingsovereenkomst.

      4 De werkgever en de persoon, bedoeld in [artikel 2:7, eerste lid, van de wet][ref4], handelen in overeenstemming
      met artikel 10, vijfde lid, van verordening (EG) nr. 561/2006, dan wel, voor zover van toepassing, artikel 7,
      vijfde lid, van deel b, afdeling 2, van bijlage 31 van de Handels- en Samenwerkingsovereenkomst.

      5 De werknemer bewaart de gegevens en bescheiden met betrekking tot de in [artikel 4:3 van de wet][ref5]
      neergelegde registratieverplichting die tijdens zijn werkzaamheden, bedoeld in [artikel 2.3:1][ref6] zijn
      geregistreerd tot het tijdstip van deugdelijke overdracht aan de werkgever.

      6 Bij regeling van Onze Minister van Infrastructuur en Waterstaat kunnen regels worden gesteld over de wijze
      van bewaren van de in het eerste en tweede lid bedoelde gegevens en bescheiden, en het overbrengen van de in
      het controleapparaat en op de bestuurderskaart geregistreerde gegevens naar de vestiging van de werkgever of de
      persoon, bedoeld in [artikel 2:7, eerste lid, van de wet][ref7].


