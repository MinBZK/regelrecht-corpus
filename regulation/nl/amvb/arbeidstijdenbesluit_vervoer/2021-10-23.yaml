  - number: 5.4:2
    text: |-
      Onverminderd [artikel 5.4:1, eerste lid][ref1], wordt van een bemanningslid dat werknemer is de dagelijkse
      arbeidstijd geregistreerd op een door de werkgever te bepalen wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Artikel5.41
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel5.42
    references:
      - id: ref1
        bwb_id: BWBR0009386
        artikel: 5.4:1
        hoofdstuk: '5'
        paragraaf: '5.4'
  - number: 5.4:3
    text: |-
      1 De gezagvoerend schipper en de werkgever bewaren de in de [artikelen 5.4:1][ref1] en [5.4:2][ref2] bedoelde
      registratie van arbeids- en rusttijden ten minste 52 weken, gerekend vanaf de datum waarop de desbetreffende
      gegevens en bescheiden betrekking hebben, aan boord.

      2 De registratie van de arbeidstijden en rusttijden van een bemanningslid dat werknemer is wordt uiterlijk aan het
      einde van de volgende maand gezamenlijk door de werkgever of zijn vertegenwoordiger en de werknemer gecontroleerd
      en bekrachtigd.

      3 Het bemanningslid dat werknemer is ontvangt een kopie van de registratie van zijn arbeids- en rusttijden en
      bewaart deze ten minste 52 weken, gerekend vanaf de datum waarop de gegevens betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Artikel5.41
      [ref2]: https://wetten.overheid.nl/BWBR0009386#Artikel5.42
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel5.43
