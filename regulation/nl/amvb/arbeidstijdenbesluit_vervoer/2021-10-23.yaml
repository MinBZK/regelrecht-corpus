  - number: 2.4:3
    text: |-
      1 Bij openbaar vervoer als bedoeld in [artikel 1 van de Wet personenvervoer 2000][ref1]
      dat wordt verricht met een bus, alsmede bij geregeld vervoer als bedoeld in
      [artikel 89, onderdelen e en f, van het Besluit personenvervoer 2000][ref2], stelt de werkgever een dienstrooster
      op als bedoeld in artikel 16 van verordening (EG) nr. 561/2006.

      2 Het eerste lid is niet van toepassing indien wordt gehandeld overeenkomstig het bepaalde bij of krachtens de
      [artikelen 2.4:1][ref3] en [2.4:13][ref4] en het verbod van [artikel 2.4:4][ref5] wordt nageleefd.

      3 Bij regeling van Onze Minister van Infrastructuur en Waterstaat kunnen nadere regels worden gesteld ten aanzien
      van de inhoud, de invulling, de bekendmaking en de bewaring van het dienstrooster.


