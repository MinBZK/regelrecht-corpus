        bwb_id: BWBR0005681
        artikel: '1'
  - number: 6.1:2
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:

        - *jeugdige zeevarende:* zeevarende van 16 of 17 jaar;
        - *kapitein:* zeevarende die het gezag over een zeeschip voert;
        - *scheepsbeheerder:* scheepsbeheerder als bedoeld in de [Wet zeevarenden][ref1];
        - *zeevarende:* zeevarende als bedoeld in de [Wet zeevarenden][ref2], met dien verstande dat personen die op grond
      van artikel 1, tweede lid, van die wet zijn uitgezonderd, niet als zeevarende worden aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0009124
      [ref2]: https://wetten.overheid.nl/BWBR0009124
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel6.12
    references:
      - id: ref1
        bwb_id: BWBR0009124
      - id: ref2
        bwb_id: BWBR0009124
  - number: 6.1:3
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder *rusttijd* een periode van ten minste 1
      uur waarin geen arbeid wordt verricht.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel6.13
  - number: 6.2:1
    text: |-
      1 De [paragrafen 4.1][ref1] en [4.4][ref2] en [hoofdstuk 5 van de wet][ref3] en de daarop berustende bepalingen
      zijn niet van toepassing op arbeid, verricht door een zeevarende van 18 jaar of ouder, aan boord van:

      a. reddingsvaartuigen gedurende de tijd dat daarmee reddingswerkzaamheden worden verricht;

      b. pleziervaartuigen die uitsluitend als zodanig worden gebezigd voor zover zij geen passagiers tegen vergoeding
      vervoeren.

      2 De [paragrafen 4.1][ref4] en [4.4][ref5] en [hoofdstuk 5 van de wet][ref6] en de daarop berustende bepalingen
      zijn niet van toepassing op arbeid, verricht door een scheepsarts.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Paragraaf4.1
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Paragraaf4.4
