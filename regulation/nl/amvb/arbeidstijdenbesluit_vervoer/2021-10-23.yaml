  - number: 4.8:4
    text: |-
      1 In [bijlage G][ref1] behorend bij dit besluit wordt de wijze van berekening vastgesteld van de maximum
      vliegwerktijd alsmede de tabel volgens welke de maximum vliegwerktijd wordt bepaald over de korte en lange termijn
      en de wijze waarop de gecorrigeerde vliegwerktijd van de vliegwerktijd wordt afgeleid door middel van de volgende
      correcties:

      a. verzwarende omstandigheden,

      b. grondtijd zonder werkzaamheden, en

      c. opdrachten anders dan opdrachten tot het als lid van het cockpitpersoneel maken van vluchten anders dan
      verkeersvluchten.

      2 De in [bijlage G][ref2] behorende bij dit besluit in tabel G genoemde maxima zijn slechts van toepassing indien
      de uitvoering van de in [artikel 4.8:3, tweede lid][ref3], bedoelde opdracht wordt gevolgd door een vliegwerktijd,
      waarin daadwerkelijk werkzaamheden als lid van het cockpitpersoneel ten behoeve van de uitvoering van een vlucht
      worden verricht, zonder dat deze zijn gescheiden door ten minste één rusttijd.

      3 Ingevolge [artikel 4.8:10, derde lid][ref4], wordt de tabel vastgesteld volgens welke het maximum van de
      vliegwerktijd wordt bepaald na een bekorte rust met inachtneming van de aan de bekorte rust voorafgegane
      vliegwerktijd.

      4 De werkgever organiseert de arbeid in overeenstemming met het eerste tot en met derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009386
      [ref2]: https://wetten.overheid.nl/BWBR0009386
      [ref3]: https://wetten.overheid.nl/BWBR0009386#Artikel4.83
      [ref4]: https://wetten.overheid.nl/BWBR0009386#Artikel4.810
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel4.84
    references:
      - id: ref1
        bwb_id: BWBR0009386
      - id: ref2
        bwb_id: BWBR0009386
      - id: ref3
        bwb_id: BWBR0009386
        artikel: 4.8:3
        hoofdstuk: '4'
        paragraaf: '4.8'
      - id: ref4
        bwb_id: BWBR0009386
        artikel: 4.8:10
        hoofdstuk: '4'
        paragraaf: '4.8'
  - number: 4.8:5
    text: |-
      1 De som van de vliegtijden binnen de vliegwerktijd bedraagt ten hoogste 9 uren of zoveel uren als bepaald
      overeenkomstig het tweede lid.

      2 In [bijlage H][ref1] behorend bij dit besluit wordt de reductie op de vliegtijd vastgesteld in verband met het
      aantal landingen binnen de vliegwerktijd, waarbij een landing tussen zonsondergang en zonsopgang wordt geteld als
      twee landingen.

      3 Een aaneengesloten vliegtijd bedraagt ten hoogste 4 uren.

      4 In afwijking van het derde lid wordt indien de geplande vliegtijd 4 tot 5 uur bedraagt, deze onderbroken door een
      pauze van ten minste 30 minuten.

      5 Indien, in afwijking van het derde lid, de geplande vliegtijd meer dan 5 uren bedraagt, wordt deze onderbroken
      door een pauze van ten minste 45 minuten of door twee pauzes van elk ten minste 30 minuten. De pauzes worden zo
      veel mogelijk gelijkmatig over de vliegwerktijd verdeeld.

      6 De maximum vliegtijd voor een lid van het cockpitpersoneel is:

      a. 33 uren per aaneengesloten periode van 7 dagen;

      b. 110 uren per maand;

      c. 900 uren per jaar.

      7 De werktijd bedraagt niet meer dan 2000 uur per jaar en wordt zo gelijk mogelijk over het kalenderjaar verspreid.

      8 De werkgever organiseert de arbeid in overeenstemming met het eerste tot en met het zevende lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009386
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel4.85
    references:
      - id: ref1
        bwb_id: BWBR0009386
  - number: 4.8:6
    text: |-
      1 Binnen één vliegwerktijd worden maximaal 25 landingen tussen zonsondergang en zonsopgang gemaakt.

      2 In bijlage I behorend bij dit besluit wordt de tabel vastgesteld voor het maximum aantal landingen binnen één
      vliegwerktijd indien deze zowel landingen tussen zonsopgang en zonsondergang alsmede tussen zonsondergang en
      zonsopgang omvat.

      3 De werkgever organiseert de arbeid in overeenstemming met het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel4.86
  - number: 4.8:7
    text: |-
      1 De werkgever organiseert de arbeid zodanig dat bij de planning van de vliegwerktijd een verantwoorde marge in
      acht wordt genomen ten opzichte van de maximum vliegwerktijd en de vliegtijd.

      2 Artikel 4.5:9a en artikel 4.5:11 zijn van overeenkomstige toepassing op het cockpitpersoneel van helikopters.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel4.87
  - number: 4.8:8
    text: |-
      1 De werkgever organiseert de arbeid zodanig dat een reservetijd maximaal 12 uren bedraagt.

      2 Indien de tijd gelegen tussen de oproep tot aanmelding en het aanmeldingstijdstip minder bedraagt dan 8 uren
      wordt de tijd gelegen tussen de aanvang van de reservetijd en het aanmeldingstijdstip als reservetijd beschouwd.

      3 Indien de tijd gelegen tussen de oproep tot aanmelding en het aanmeldingstijdstip meer bedraagt dan 8 uren en het
      desbetreffende personeelslid wordt ontheven van de reserveverplichting dan wordt de tijd gelegen tussen de aanvang
      van de reservetijd en het tijdstip van oproep als reservetijd beschouwd.

      4 Tussen verschillende reservetijden zit ten minste een periode van 8 uren.

      5 De werkgever organiseert de arbeid in overeenstemming met het tweede tot en met vierde lid.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel4.88
  - number: 4.8:9
    text: |-
      1 De normale minimum rusttijd, voorafgaande aan een vliegwerktijd, bedraagt 12 uren.

      2 Een lid van het cockpitpersoneel van helikopters heeft in elke aaneengesloten periode van 7 dagen een
      aaneengesloten rusttijd van ten minste 36 uren dan wel in elke aaneengesloten periode van 10 dagen een
      aaneengesloten rusttijd van ten minste 48 uren.

      3 Indien in een aaneengesloten periode van 3 dagen de som van de vliegwerktijden meer dan 32 uren bedraagt, wordt
      één der tussenliggende normale minimum rusttijden genoten tussen 20.00 uur en 12.00 uur lokale tijd.

      4 De werkgever organiseert de arbeid in overeenstemming met het eerste tot en met derde lid.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel4.89
  - number: 4.8:10
    text: |-
      1 Een normale minimum rusttijd kan worden bekort tot niet minder dan 8 uren met dien verstande dat een bekorting
      met meer dan een uur ten hoogste eenmaal per aaneengesloten periode van 7 dagen plaats vindt.

      2 Na een bekorte rust is de rusttijd na de vliegwerktijd, volgend op de bekorte rust, ten minste gelijk aan de
      normale minimum rusttijd, vermeerderd met de tijd waarmee de normale minimum rusttijd is bekort.

      3 In bijlage J behorend bij dit besluit wordt de tabel vastgesteld volgens welke het maximum van de vliegwerktijd
      wordt bepaald na een bekorte rust met inachtneming van de aan de bekorte rust voorafgegane vliegwerktijd.

      4 Een rusttijd van minder dan 8 uren geldt als grondtijd.

      5 De werkgever organiseert de arbeid in overeenstemming met het eerste tot en met vierde lid.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel4.810
  - number: 4.9:1
    text: |-
      1 Onze Minister van Infrastructuur en Waterstaat kan ontheffing verlenen van [paragraaf 4.8][ref1] voor arbeid
      verricht door een lid van het boordpersoneel van helikopters, die gebruikt worden ten behoeve van het vervoeren
      van:

      a. traumateams voor spoedeisende medische hulpverlening, of

      b. passagiers of vracht van of naar helikopterplatforms op mijnbouwinstallaties als bedoeld in
      [artikel 1, onder o, van de Mijnbouwwet][ref2], of op schepen, gebruikt in het kader van het opsporen of het winnen
      van delfstoffen of aardwarmte.

      2 De werkgever leeft de aan een ontheffing verbonden voorschriften na.


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel1
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel4.91
    references:
