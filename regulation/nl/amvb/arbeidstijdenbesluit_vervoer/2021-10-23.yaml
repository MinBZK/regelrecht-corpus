  - number: 2.5:7
    text: |-
      1 In afwijking van de [artikelen 2.2:2][ref1] en [2.3:1][ref2] is dit artikel uitsluitend van toepassing op de
      werknemer die vervoer verricht waarop verordening (EEG) nr. 561/2006 niet van toepassing is.

      2 In plaats van [artikel 5:7, tweede tot en met vierde lid, van de wet][ref3] wordt dit artikel toegepast.

      3 De werknemer die vervoer anders dan taxivervoer verricht, verricht in elke periode van 16 achtereenvolgende weken
      ten hoogste gemiddeld 48 uren per week arbeid.

      4 De werknemer die taxivervoer verricht, verricht ten hoogste:

      a. 60 uren arbeid per week;

      b. 12 uren arbeid per dienst; en

      c. gemiddeld 48 uren arbeid per week in elke periode van 16 aaneengesloten weken.

      5 Van het derde en vierde lid kan met inachtneming van het zesde lid slechts bij collectieve regeling worden
      afgeweken. Elk beding waarbij op andere wijze dan in de vorige volzin is bepaald, wordt afgeweken van het eerste
      lid, is nietig.

      6 De werkgever organiseert de arbeid zodanig dat de werknemer in elke periode van 26 achtereenvolgende weken ten
      hoogste gemiddeld 48 uren per week arbeid verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Artikel2.22
      [ref2]: https://wetten.overheid.nl/BWBR0009386#Artikel2.31
      [ref3]: https://wetten.overheid.nl/BWBR0007671#Artikel57
