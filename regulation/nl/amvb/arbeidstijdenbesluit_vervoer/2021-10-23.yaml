  - number: 2.5:8
    text: |-
      1 In afwijking van de [artikelen 2.2:2][ref1] en [2.3:1][ref2] is dit artikel uitsluitend van toepassing voor zover
      verordening (EG) nr. 561/2006 of de Handels- en Samenwerkingsovereenkomst van toepassing is.

      2 In plaats van [artikel 5:7, tweede tot en met vierde lid, van de wet][ref3] wordt dit artikel toegepast.

      3 De werknemer verricht ten hoogste 60 uren per week arbeid, met dien verstande dat hij gedurende een periode van
      16 achtereenvolgende weken ten hoogste gemiddeld 48 uren per week arbeid verricht.

      4 Van het derde lid kan met inachtneming van het vijfde lid slechts bij collectieve regeling worden afgeweken. Elk
      beding waarbij op andere wijze dan in de vorige volzin is bepaald, wordt afgeweken van het derde lid, is nietig.

      5 De werkgever organiseert de arbeid zodanig, dat de werknemer gedurende een periode van een week ten hoogste 60
      uren arbeid verricht, met dien verstande dat hij gedurende een periode van 26 achtereenvolgende weken ten hoogste
      gemiddeld 48 uren per week arbeid verricht.

      6 De persoon, bedoeld in [artikel 2:7, eerste lid, van de wet][ref4], neemt een maximale wekelijkse arbeidstijd in
      acht overeenkomstig het vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Artikel2.22
      [ref2]: https://wetten.overheid.nl/BWBR0009386#Artikel2.31
      [ref3]: https://wetten.overheid.nl/BWBR0007671#Artikel57
      [ref4]: https://wetten.overheid.nl/BWBR0007671#Artikel27
