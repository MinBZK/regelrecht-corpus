  - number: 4.3:1
    text: |-
      Met uitsluiting van hetgeen in het [Arbeidstijdenbesluit][ref1] is bepaald, is dit hoofdstuk van toepassing op
      arbeid, verricht aan boord van luchtvaartuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0007687
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel4.31
    references:
      - id: ref1
        bwb_id: BWBR0007687
  - number: 4.4:1
    text: |-
      1 Elk lid van het boordpersoneel op verkeersvluchten met helikopters met uitzondering van rondvluchten, houdt van
      zijn arbeids- en rusttijden een deugdelijke registratie bij of doet die bijhouden.

      2 Bij regeling van Onze Minister van Infrastructuur en Waterstaat worden nadere regels gesteld omtrent de wijze
      van registratie.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel4.41
  - number: 4.4:2
    text: |-
      De werkgever, de persoon, bedoeld in [artikel 4.2:2][ref1], en het lid van het boordpersoneel,
      bedoeld in [artikel 4.4:1, eerste lid][ref2], bewaren de gegevens en bescheiden met betrekking tot
      [artikel 4.4:1, eerste en tweede lid][ref3], en de in [artikel 4.3 van de wet][ref4] neergelegde
      registratieverplichting ten minste 52 weken, gerekend vanaf de datum waarop de desbetreffende gegevens en
      bescheiden betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Artikel4.22
      [ref2]: https://wetten.overheid.nl/BWBR0009386#Artikel4.41
      [ref3]: https://wetten.overheid.nl/BWBR0009386#Artikel4.41
      [ref4]: https://wetten.overheid.nl/BWBR0007671#Artikel43
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel4.42
    references:
      - id: ref1
        bwb_id: BWBR0009386
        artikel: 4.2:2
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
