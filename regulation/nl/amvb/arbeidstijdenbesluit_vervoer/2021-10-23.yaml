        bwb_id: BWBR0014168
        artikel: '1'
  - number: 4.10:1
    text: |-
      1 De gezagvoerder van een luchtvaartuig, bij vluchten die niet vallen onder [§ 4.5][ref1], kan afwijken en kan een
      lid van het boordpersoneel opdragen af te wijken van de arbeids- en rusttijden om arbeid te verrichten indien dit
      noodzakelijk is in verband met de onmiddellijke veiligheid van de personen aan boord en het luchtvaartuig. Van deze
      afwijking wordt aantekening gehouden en wordt melding gemaakt bij Onze Minister van Infrastructuur en Waterstaat.

      2 Zodra de situatie, bedoeld in het eerste lid, voorbij is, zorgt de werkgever ervoor dat de werknemer die arbeid
      heeft verricht in een rustperiode, voldoende rusttijd ter compensatie krijgt.


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel4.101
    references:
      - id: ref1
        bwb_id: BWBR0009386
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: 5.1:1
    text: |-
        - *bemanningslid:* hetgeen daaronder wordt verstaan [in artikel 1, eerste lid, van de Binnenvaartwet][ref1] alsmede
      boordpersoneel als bedoeld in clausule 2, onderdeel k, van de overeenkomst;
        - *exploitatiewijze A1, exploitatiewijze A2 en exploitatiewijze B:* hetgeen daaronder wordt verstaan in
      [artikel 3.10 van het Reglement betreffende het scheepvaartpersoneel op de Rijn][ref2];
        - *jeugdig bemanningslid:* een bemanningslid van 16 of 17 jaar;
        - *overeenkomst:* Europese Overeenkomst betreffende de regeling van een aantal aspecten van de organisatie van de
      arbeidstijd in de binnenvaart, bedoeld in de bijlage bij Richtlijn 2014/112/EU van de Raad van 19 december 2014
      tot uitvoering van de Europese Overeenkomst betreffende de regeling van bepaalde aspecten van de organisatie van
      de arbeidstijd in de binnenvaart die op 15 februari 2012 is gesloten door de Europese Binnenvaartunie (EBU), de
      Europese Schippersorganisatie (ESO) en de Europese Federatie van Vervoerswerknemers (ETF) (PbEU 2014, L 367);
        - *rusttijd:* hetgeen daaronder wordt verstaan in
      [artikel 3.11 van het Reglement betreffende het scheepvaartpersoneel op de Rijn][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0030215#Artikel3.10
      [ref3]: https://wetten.overheid.nl/BWBR0030215#Artikel3.11
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel5.11
    references:
