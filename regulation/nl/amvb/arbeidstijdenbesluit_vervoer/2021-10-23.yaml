        artikel: 4:3
  - number: 4.5:1
    text: |-
      In plaats van [§ 5.2 van de wet][ref1] is deze paragraaf en EG-verordening 3922/91 van toepassing op
      bemanningsleden op vluchten die vallen onder EG-verordening 3922/91.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Paragraaf5.2
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel4.51
    references:
      - id: ref1
        bwb_id: BWBR0007671
        paragraaf: '5.2'
  - number: 4.5:2
    text: |-
      De werkgever organiseert de arbeid zodanig dat voor een lid van het boordpersoneel de werktijd niet meer dan 2000
      uur per jaar bedraagt en zo gelijk mogelijk over het kalenderjaar wordt verspreid.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel4.52
  - number: 4.5:3
    text: |-
      Bij regeling van Onze Ministers kan worden bepaald op welke wijze de vliegdienstperiode kan worden verlengd bij
      gesplitste dienst.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel4.53
  - number: 4.5:4
    text: |-
      1 Bij regeling van Onze Ministers wordt bepaald op welke wijze de effecten van tijdzoneverschillen op
      bemanningsleden met extra rust worden gecompenseerd.

      2 Bij regeling van Onze Ministers kan, met inachtneming van het bepaalde in EG-verordening 3922/91, bijlage III,
      onderdeel 1.1110, onder 1.1 en 1.2, worden bepaald onder welke voorwaarden de rustregeling kan worden verkort.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel4.54
  - number: 4.5:5
    text: |-
      1 Bij regeling van Onze Ministers kunnen regels worden gesteld ten aanzien van het verlengen van de
      vliegdienstperiode, met overschrijding van de limieten vermeld in EG-verordening 3922/91, bijlage III, onderdeel
      1.1105, voor zover sprake is van uitbreiding van de basiscockpitbemanning. Hierbij wordt ten minste rekening
      gehouden met het aantal uren genoten rust en de rustgelegenheid aan boord.

      2 Bij regeling van Onze Ministers kunnen regels worden gesteld aan het verlengen van de vliegdienstperiode van
      cabinepersoneel, met overschrijding van de limieten vermeld in EG-verordening 3922/91, bijlage III, onderdeel
      1.1105. Hierbij wordt ten minste rekening gehouden met het aantal uren genoten rust en de rustgelegenheid aan
      boord.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel4.55
  - number: 4.5:6
    text: |-
      Bij regeling van Onze Ministers kunnen regels worden gesteld ten aanzien van:

      a. de relatie tussen luchthavenparaatheid en de onmiddellijk daarop volgende vliegdienst;

      b. de minimumrustperiode volgend op luchthavenparaatheid die niet wordt gevolgd door een vliegdienst;

      c. de overige vormen van paraatheid.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel4.56
  - number: 4.7:1
    text: |-
      In plaats van [paragraaf 5.2 van de wet][ref1] is deze paragraaf van toepassing op het lid van het boordpersoneel
      op rondvluchten met helikopters.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel52
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel4.71
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: 5:2
  - number: 4.7:2
    text: |-
      1 De werkgever ontwerpt regels ten aanzien van de arbeids- en rusttijden voor elk lid van het boordpersoneel
      op rondvluchten. Deze regels zijn zodanig dat de veiligheid van de vlucht niet in gevaar wordt gebracht door
      vermoeidheid, optredende, hetzij tijdens een vlucht, hetzij tijdens een serie vluchten, hetzij tijdens een bepaalde
      periode.

      2 Deze regels worden ter instemming aan Onze Minister van Infrastructuur en Waterstaat en aan Onze Minister
      voorgelegd.

      3 De werkgever organiseert de arbeid in overeenstemming met de regels waarvoor Onze Minister van Infrastructuur en
      Waterstaat en Onze Minister instemming hebben gegeven.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel4.72
  - number: 4.8:1
    text: |-
      In plaats van [paragraaf 5.2 van de wet][ref1] is deze paragraaf van toepassing op het lid van het cockpitpersoneel
      op verkeersvluchten van helikopters, met uitzondering van rondvluchten.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Paragraaf5.2
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel4.81
    references:
      - id: ref1
        bwb_id: BWBR0007671
        paragraaf: '5.2'
  - number: 4.8:2
    text: |-
      In deze paragraaf en de daarop berustende bepalingen wordt onder «landing» verstaan: een nadering, gevolgd door het
      tot stilstand op een landingsplaats hetzij in een hovervlucht brengen van een helikopter met:

      1°. het doel:

      a. het embarkeren of debarkeren van passagier(s) dan wel bemanningslid(leden) al dan niet door middel van een
      hijsinstallatie;

      b. het in- of uitladen van vracht;

      c. het aan- of afhaken van een uitwendige lading;

      d. het innemen van brandstof,

      voorzover de activiteiten, bedoeld in de onderdelen a tot en met d, plaatsvinden met draaiende motoren(en), of

      2°. het doel de vlucht te beëindigen door de rotor(en) tot stilstand te brengen of de motor(en) te stoppen.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel4.82
  - number: 4.8:3
    text: |-
      1 De vliegwerktijd wordt geacht te duren tot ten minste 15 minuten na het beëindigen van de laatste vlucht in de
      periode, waarin het lid van het cockpitpersoneel als zodanig optreedt.

      2 Als vliegwerktijd wordt tevens aangemerkt de tijdsduur van een door de werkgever gegeven opdracht, anders dan tot
      het als lid van het cockpitpersoneel maken van een vlucht.

      3 Indien een opdracht als bedoeld in het tweede lid het maken van één of meer opeenvolgende vluchten als passagier
      of als niet-werkend bemanningslid inhoudt:

      a. geldt als tijdsduur van deze opdracht de tijd vanaf het tijdstip van aanmelding voor de eerste vlucht tot 15
      minuten na het beëindigen van de laatste vlucht,

      b. zijn de normen bedoeld in [artikel 4.8:6, eerste en tweede lid][ref1], en de correcties, bedoeld in de in
      [bijlage G][ref2] behorende bij dit besluit onder VII bedoelde verzwarende omstandigheden niet van toepassing,

      c. is het toegestaan, meerdere malen achtereen een bekorte rust, als bedoeld in [artikel 4.8:10][ref3], toe
      te passen, mits na afloop een rusttijd in acht wordt genomen, gelijk aan de normale minimum rust volgens
      [artikel 4.8:9][ref4], vermeerderd met het totaal van de bekortingen van de voorafgaande rusten ten opzichte van de
      normale minimum rust.


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Artikel4.86
      [ref2]: https://wetten.overheid.nl/BWBR0009386
      [ref3]: https://wetten.overheid.nl/BWBR0009386#Artikel4.810
      [ref4]: https://wetten.overheid.nl/BWBR0009386#Artikel4.89
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel4.83
    references:
