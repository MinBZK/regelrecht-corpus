  - number: 2.2:1
    text: |-
      [Artikel 11:3, eerste lid, van de wet][ref1] is niet van toepassing op overtredingen die zijn geconstateerd na
      staandehoudingen langs de voor openbaar gebruik toegankelijke wegen van een vrachtauto, bus of taxi in lege of
      beladen toestand als bedoeld in [artikel 2.3:1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel113
      [ref2]: https://wetten.overheid.nl/BWBR0009386#Artikel2.31
