  - number: 5.5:4
    text: |-
      De werkgever en de gezagvoerend schipper organiseren de arbeid zodanig, dat een bemanningslid dat werknemer is in
      elke periode van 7 dagen ten hoogste 42 uren arbeid verricht tussen 23:00 uur en 06:00 uur.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel5.54
  - number: 5.5:5
    text: |-
      1 De werkgever en de gezagvoerend schipper organiseren de arbeid zodanig dat een bemanningslid dat werknemer is ten
      hoogste arbeid verricht gedurende:

      a. 14 uren in elke periode van 24 uur,

      b. 84 uren in elke periode van zeven dagen, en

      c. gemiddeld 48 uren per week in elke periode van 52 weken, of, indien de contractperiode korter is dan 52 weken,
      gemiddeld 48 uren per week in de contractperiode.

      2 Onverminderd onderdeel c, van het eerste lid verricht een bemanningslid dat werknemer is, wanneer er volgens het
      dienstrooster meer arbeidsdagen dan rustdagen zijn, ten hoogste arbeid gedurende gemiddeld 72 uren per week in elke
      periode van 16 weken.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel5.55
  - number: 5.5:5a
    text: |-
      De werkgever en de gezagvoerend schipper nemen bij de vaststelling van het aantal arbeids- en rustdagen van een
      bemanningslid dat werknemer is, clausule 5 van de overeenkomst in acht.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel5.55a
  - number: 5.5:5b
    text: |-
      1 Dit artikel is uitsluitend van toepassing op een bemanningslid dat werknemer is en seizoensarbeid in de
      passagiersvaart verricht.

      2 De werkgever en de gezagvoerend schipper nemen bij de vaststelling van het aantal arbeids- en rustdagen van een
      bemanningslid dat werknemer is clausule 6 van de overeenkomst in acht.

      3 Toepassing van dit artikel is slechts mogelijk bij collectieve regeling. Elk beding waarbij wordt afgeweken van
      de vorige zin is nietig.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel5.55b
  - number: 5.5:5c
    text: |-
      De werkgever en de gezagvoerend schipper organiseren de arbeid van een bemanningslid dat werknemer is zodanig, dat
      indien hij meer dan 6 uren arbeid per dienst verricht, zijn arbeid wordt onderbroken door een pauze.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel5.55c
  - number: 5.5:6
    text: |-
      1 De gezagvoerend schipper kan afwijken van de arbeids- en rusttijden om arbeid te verrichten indien dit
      noodzakelijk is in verband met de onmiddellijke veiligheid van het schip, de personen aan boord, de lading of bij
      het geven van hulp aan andere schepen of personen in nood.

      2 Zodra de noodsituatie, bedoeld in het eerste lid, voorbij is, zorgt de gezagvoerend schipper er voor dat het
      bemanningslid dat werknemer is en dat arbeid heeft verricht in een rustperiode, voldoende rusttijd ter compensatie
      krijgt.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel5.56
  - number: 5.5:7
    text: |-
      1 De werkgever en de gezagvoerend schipper organiseren de arbeid zodanig dat het jeugdige bemanningslid:

      a. bij exploitatiewijzen A1 en A2 in elke periode van 24 uren een rusttijd geniet, die inclusief de in het vierde
      lid bedoelde pauze ten minste 16 uren bedraagt, waarvan ten minste 12 uren ononderbroken;

      b. bij exploitatiewijze B in elke periode van 24 uren een rusttijd geniet, die inclusief de in het vierde lid
      bedoelde pauze ten minste 16 uren bedraagt, waarvan ten minste tweemaal 6 uren ononderbroken.

      2 De werkgever en de gezagvoerend schipper organiseren de arbeid zodanig dat het jeugdige bemanningslid:

      a. hetzij een wekelijkse rusttijd heeft van ten minste 2 dagen, waarin de zondag is begrepen;

      b. hetzij een wekelijkse ononderbroken rusttijd heeft van ten minste 36 uren, waarin de zondag is begrepen;

      c. hetzij, ingeval van een reis van meer dan 5 dagen, in elke periode van 10 weken een ononderbroken rusttijd heeft
      van ten minste 16 dagen.

      3 De werkgever en de gezagvoerend schipper organiseren de arbeid zodanig dat het jeugdige bemanningslid tussen
      22.00 uur en 06.00 uur, dan wel tussen 23.00 en 07.00 uur slechts arbeid verricht indien dit in het kader van de
      opleiding noodzakelijk is.

      4 De werkgever en de gezagvoerend schipper organiseren de arbeid zodanig dat het jeugdige bemanningslid een pauze
      van ten minste 30 minuten heeft ingeval de dagelijkse arbeidstijd langer is dan vier en een half uur.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel5.57
  - number: 6.1:1
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:

      a. zeeschip:

      1º. hetgeen daaronder wordt verstaan in [artikel 2, eerste lid, van Boek 8 van het Burgerlijk Wetboek][ref1],
      uitgezonderd de zeeschepen, bedoeld in het [derde lid van dat artikel][ref2], en in
      [artikel 1, onderdeel a, van de Wet nationaliteit zeeschepen in rompbevrachting][ref3], alsmede

      2º. de havensleepboot gedurende de tijd dat er in havensleepdienst dienst wordt gedaan.

      b. havensleepdienst: het geheel van werkzaamheden en activiteiten ten behoeve van het assisteren bij het meren,
      ontmeren en verhalen van zeeschepen die gebruik maken van eigen voortstuwing, inkomend van of uitgaand naar zee.

      c. pleziervaartuig: een schip dat uitsluitend anders dan in de uitoefening van een beroep of bedrijf wordt
      gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0005681#Artikel1
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel6.11
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '2'
