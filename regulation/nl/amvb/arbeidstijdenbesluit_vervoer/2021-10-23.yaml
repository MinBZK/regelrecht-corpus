        artikel: 3.1:1
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 4.1:1
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:

      a. *lid van het cockpitpersoneel:* de werknemer van 18 jaar of ouder die aan boord van een luchtvaartuig
      werkzaamheden heeft te verrichten die van direct belang zijn voor de bediening van het luchtvaartuig tijdens de
      vlucht;

      b. *lid van het cabinepersoneel:* de werknemer van 18 jaar of ouder die, niet zijnde lid van het cockpitpersoneel,
      aan boord van een luchtvaartuig enige werkzaamheden heeft te verrichten ten behoeve van de inzittenden dan wel als
      dierenbegeleider werkzaam is tijdens de vlucht;

      c. *lid van het boordpersoneel:* lid van het cockpitpersoneel en cabinepersoneel.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel4.11
  - number: 4.1:2
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen, met uitzondering van [§ 4.5][ref1], wordt verstaan onder:

      a. *vliegwerktijd:* de periode van het ogenblik af, waarop een lid van het boordpersoneel zich dient te melden voor
      de uitoefening van zijn functie tot het einde van zijn werkzaamheden;

      b. *werktijd:*de som van de vliegwerktijd en de luchthavenreservetijd;

      c. *reservetijd:*een periode waarin een lid van het boordpersoneel niet voor een vlucht is ingedeeld en niet
      verplicht is op de luchthaven aanwezig te zijn, maar wel beschikbaar dient te zijn voor het ontvangen van een
      opdracht tot het uitvoeren van enige verkeersvlucht;

      d. *luchthavenreservetijd:* een periode waarin een lid van het boordpersoneel niet voor een vlucht is ingedeeld,
      maar wel verplicht is op de luchthaven aanwezig te zijn voor het ontvangen van een opdracht tot het uitvoeren van
      enige verkeersvlucht;

      e. *rusttijd:*elke periode buiten de vliegwerktijd gedurende welke een lid van het boordpersoneel is ontheven van
      alle taken en opdrachten, en daarin de gelegenheid heeft om rust te genieten in een passende accommodatie;

      f. *grondtijd:* elke periode van de vliegwerktijd die geen deel uitmaakt van een vlucht;

      g. *rustgelegenheid:*de deugdelijke accommodatie aan boord van het luchtvaartuig, die het mogelijk maakt voor een
      lid van het boordpersoneel horizontale rust te genieten in een van de passagiers en hinderlijke vracht afgescheiden
      ruimte.


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel4.12
    references:
      - id: ref1
        bwb_id: BWBR0009386
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: 4.1:3
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen, met uitzondering van [§ 4.5][ref1], wordt verstaan onder:

      a. *vliegtijd:* de periode van het ogenblik af dat de helikopter zich op eigen kracht voortbeweegt tot het ogenblik
      waarop de hefschroef of hefschroeven tot stilstand komt of komen;

      b. *verkeersvlucht:* een vlucht die vervoer door een luchtvaartmaatschappij ten doel heeft;

      c. *rondvlucht:*een verkeersvlucht welke aanvangt en eindigt op hetzelfde terrein en welke een tijdsduur heeft van
      ten hoogste 60 minuten;

      d. *luchtarbeid:*werkzaamheden uitgevoerd door een lid van het boordpersoneel tijdens de vlucht, niet zijnde een
      verkeersvlucht.


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel4.13
    references:
      - id: ref1
        bwb_id: BWBR0009386
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: 4.1:4
    text: |-
      Tenzij anders is bepaald, wordt in dit hoofdstuk en de daarop berustende bepalingen verstaan onder:

      a. *luchtvaartmaatschappij:* onderneming, welke geheel of gedeeltelijk haar bedrijf maakt van het vervoer van
      personen, dieren of goederen met luchtvaartuigen tegen vergoeding;

      b. *luchtvaartuig:* een luchtvaartuig als bedoeld in de [Wet luchtvaart][ref1];

      c. *dag:*een periode van 00.00 uur tot 24.00 uur Universal Time Coordinated voor vliegtuigen en van 00.00 uur tot
      24.00 uur lokale tijd voor helikopters;

      d. *luchthaven:*een terrein, dat is ingericht voor het opstijgen en het landen alsmede de daarmede verband houdende
      beweging op dat terrein van luchtvaartuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel4.14
    references:
      - id: ref1
        bwb_id: BWBR0005555
  - number: 4.1:5
    text: |-
      In [§ 4.5][ref1] wordt verstaan onder:

      a. *EG-verordening 3922/91:* verordening (EEG) nr. 3922/91 van de Raad van de Europese Gemeenschappen van 16
      december 1991 inzake de harmonisatie van technische voorschriften en administratieve procedures op het gebied van
      de burgerluchtvaart (PbEG L 373);

      b. *vliegdienstperiode:* een vliegdienstperiode (FDP) als bedoeld in EG-verordening 3922/91, bijlage III, onderdeel
      1.1095, onder 1.6;

      c. *Onze Ministers:* Onze Minister van Infrastructuur en Waterstaat en Onze Minister van Sociale Zaken en
      Werkgelegenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel4.15
    references:
      - id: ref1
        bwb_id: BWBR0009386
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: 4.2:1
    text: |-
      [Artikel 4.3][ref1] en [hoofdstuk 5 van de wet][ref2] en de daarop berustende bepalingen zijn niet van toepassing
      op:

      a. arbeid, verricht door een lid van het boordpersoneel van 18 jaar of ouder dat vluchten, niet zijnde
      verkeersvluchten maakt ten behoeve van het eigen bedrijf, of van de overheid;

      b. luchtarbeid, verricht door een lid van het boordpersoneel van 18 jaar of ouder;

      c. arbeid, verricht door een lid van het cabinepersoneel van 18 jaar of ouder van helikopters dat verkeersvluchten
      maakt;

      d. arbeid, verricht door personen van 18 jaar of ouder aan boord van luchtvaartuigen, niet zijnde boordpersoneel.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel4.21
