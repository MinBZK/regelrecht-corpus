  - number: 6.6:2
    text: |-
      1 De zeevarenden van 18 jaar of ouder hebben een ononderbroken rusttijd van hetzij ten minste 36 uren in elke
      aaneengesloten periode van 7 maal 24 uren, hetzij ten minste 72 uren in elke aaneengesloten periode van 10 maal
      24 uren.

      2 Uitsluitend bij collectieve regeling kan van het eerste lid worden afgeweken. Elk beding waarin op andere wijze
      dan in de vorige volzin is bepaald, wordt afgeweken van het eerste lid, is nietig.

      3 De in het eerste lid bedoelde perioden vangen aan op het eerste tijdstip van de dag waarop de zeevarenden arbeid
      verrichten.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel6.62
  - number: 6.6:3
    text: |-
      1 De kapitein organiseert de arbeid zodanig, dat hij en de overige zeevarenden van 18 jaar of ouder in elke periode
      van 24 achtereenvolgende uren een rusttijd hebben van ten minste 10 uren.

      2 De zeevarenden van 18 jaar of ouder hebben in elke periode van 24 achtereenvolgende uren een onafgebroken
      rusttijd van 8 uren.

      3 Uitsluitend bij collectieve regeling kan, met inachtneming van het vierde lid, worden afgeweken van het tweede
      lid. Elk beding waarin op andere wijze dan in de vorige volzin is bepaald, wordt afgeweken van het tweede lid,
      is nietig.

      4 De kapitein organiseert de arbeid zodanig, dat de onafgebroken rusttijd van 8 uren, bedoeld in het tweede lid,
      ten hoogste 3 maal per week wordt ingekort tot ten minste 6 uren onafgebroken rusttijd.

      5 De kapitein organiseert de arbeid zodanig dat hij en de overige zeevarenden van 18 jaar en ouder in elke
      aaneengesloten periode van 7 maal 24 uren een totale rusttijd hebben van ten minste 77 uren.

      6 De in het eerste, tweede en vijfde lid, bedoelde periode van 24 uren wordt berekend vanaf het begin van de
      langste genoten rusttijd. De tijd tussen twee op elkaar volgende perioden van rust mag niet meer dan 14 uren
      bedragen.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel6.63
  - number: 6.6:4
    text: |-
      De kapitein organiseert de arbeid zodanig dat de zeevarenden van 18 jaar of ouder in elke periode van 13
      achtereenvolgende weken gemiddeld ten hoogste 48 uren per week arbeid verrichten.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel6.64
  - number: 6.6:5
    text: |-
      1 De kapitein organiseert de arbeid zodanig dat een jeugdige zeevarende:

      a. een onafgebroken rusttijd heeft van ten minste 36 uren in elke aaneengesloten periode van 7 maal 24 uren, waarin
      de zondag is begrepen;

      b. in elke periode van 24 uren een rusttijd heeft van ten minste 12 uren, waarvan ten minste 9 uren aaneengesloten
      en waarin de periode tussen hetzij 22.00 en 06.00 uur hetzij tussen 23.00 en 07.00 begrepen is.

      2 De kapitein organiseert de arbeid zodanig dat een jeugdige zeevarende:

      a. in elke periode van 24 achtereenvolgende uren ten hoogste 8 uren arbeid verricht;

      b. in elke aaneengesloten periode van 7 maal 24 uren ten hoogste 40 uren arbeid verricht.

      3 De kapitein organiseert de arbeid zodanig dat de arbeid van een jeugdige zeevarende indien hij meer dan 4,5 uur
      arbeid verricht wordt afgewisseld door een pauze van ten minste, zo mogelijk aaneengesloten, 30 minuten.

      4 In afwijking van het eerste lid, onderdeel b, mag een jeugdige zeevarende tussen 22.00 uur en 06.00 uur dan wel
      tussen 23.00 uur en 07.00 uur arbeid verrichten indien dit in het kader van de opleiding noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel6.65
  - number: 6.6:6
    text: |-
      1 Indien een zeevarende van 18 jaar of ouder tijdens consignatie arbeid moet verrichten krijgt hij, met
      inachtneming van [artikel 6.6:3, eerste en vijfde lid][ref1], voldoende rusttijd of pauze ter compensatie. Deze
      compensatie is ten minste gelijk aan de resterende rusttijd onderscheidenlijk pauze op het ogenblik van de oproep,
      en wordt toegevoegd aan de eerstvolgende periode van rust onderscheidenlijk pauze.

      2 De arbeid die voortvloeit uit een oproep als bedoeld in het eerste lid wordt voor de toepassing van de
      [artikelen 6.6:2, eerste lid][ref2] en [6.6:3, tweede en vierde lid][ref3], buiten beschouwing gelaten.

      3 De kapitein organiseert de arbeid zodanig dat hij en de overige zeevarenden van 18 jaar of ouder in elke periode
      van 4 achtereenvolgende weken:

      a. ten minste 14 maal gedurende een periode van 24 achtereenvolgende uren geen consignatie worden opgelegd en

      b. ten minste 2 maal gedurende een aaneengesloten periode van 48 uren geen arbeid verrichten noch consignatie
      worden opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Artikel6.63
