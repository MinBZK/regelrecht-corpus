  - number: 6.5:2
    text: |-
      1 De kapitein organiseert de arbeid zodanig dat de rusttijd van de zeevarenden van 18 jaar en ouder; ten minste 10
      uren bedraagt in elke periode van 24 achtereenvolgende uren, te rekenen vanaf het begin van de rusttijd.

      2 De rusttijd kan worden verdeeld in niet meer dan twee perioden, waarvan één periode een onafgebroken rusttijd van
      ten minste 6 uren omvat. In dat geval wordt de periode van 24 uren, bedoeld in het eerste lid, berekend vanaf het
      begin van de langste genoten rusttijd. De tijd tussen twee op elkaar volgende perioden van rust mag niet meer dan
      14 uren bedragen.

      3 De kapitein organiseert de arbeid zodanig, dat de rusttijd van de zeevarenden van 18 jaar en ouder; ten minste 77
      uren bedraagt in elke periode van 7 dagen.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel6.52
  - number: 6.5:3
    text: |-
      1 De kapitein organiseert de arbeid zodanig dat de jeugdige zeevarende:

      a. in elke periode van 24 achtereenvolgende uren ten hoogste 8 uren arbeid verricht;

      b. in elke periode van 24 achtereenvolgende uren een rusttijd heeft van ten minste 12 uren, waarvan ten minste 9
      uren aaneengesloten en waarin de periode tussen 00.00 en 5.00 uur is begrepen;

      c. per week ten hoogste 40 uren arbeid verricht;

      d. een onafgebroken rusttijd heeft van ten minste 36 uren in elke aaneengesloten periode van 7 maal 24 uren;

      e. op zondag in beginsel geen arbeid verricht.

      2 De kapitein organiseert de arbeid zodanig dat de jeugdige zeevarende een pauze krijgt van ten minste, zo mogelijk
      aaneengesloten, 30 minuten ingeval de dagelijkse arbeidstijd langer is dan 4,5 uur.

      3 In afwijking van het eerste lid, onderdelen a en b, mag de jeugdige zeevarende:

      a. in elke periode van 24 achtereenvolgende uren gedurende ten hoogste 12 uren arbeid verrichten indien hij uit
      hoofde van de wachtindeling gedurende die uren feitelijk wacht loopt;

      b. arbeid verrichten tussen 00.00 en 05.00 uur indien dit in verband met zijn opleiding noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel6.53
  - number: 6.5:4
    text: |-
      De kapitein organiseert de arbeid zodanig dat de arbeid van de zeevarende telkens na ten hoogste 7 uur wordt
      afgewisseld door een pauze.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel6.54
  - number: 6.5:5
    text: |-
      1 Indien de zeevarende tijdens consignatie arbeid moet verrichten krijgt hij, met inachtneming van de
      [artikelen 6.5:2, eerste en tweede lid][ref1], en [6.5:3, eerste lid][ref2], voldoende rusttijd of pauze ter
      compensatie.

      2 De arbeid die voortvloeit uit een oproep als bedoeld in het eerste lid wordt voor de toepassing van de
      [artikelen 6.5:2][ref3], [6.5:3, uitgezonderd het eerste lid, onder a, b en c][ref4], en [6.5:4][ref5] buiten
      beschouwing gelaten.


