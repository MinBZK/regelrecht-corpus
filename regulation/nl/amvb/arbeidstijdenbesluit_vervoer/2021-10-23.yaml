  - number: 2.4:4
    text: |-
      1 Het is de werkgever, de werknemer en de persoon, bedoeld in [artikel 2:7, eerste lid, van de wet][ref1],
      verboden:

      a. in of op controlemiddelen onjuiste gegevens of onjuiste aantekeningen te stellen, te doen stellen, of toe te
      laten dat zij daarin of daarop gesteld worden;

      b. in of op controlemiddelen wijziging aan te brengen, te doen aanbrengen of toe te laten dat wijziging wordt
      aangebracht in vroeger daarin of daarop gestelde gegevens of aantekeningen, deze onleesbaar te maken, te doen maken
      of toe te laten dat zij onleesbaar gemaakt worden;

      c. controlemiddelen geheel of ten dele zoek te maken of te doen zoekmaken, ondeugdelijk te maken of te doen maken,
      te vernietigen of te doen vernietigen, verborgen te houden of te doen verborgen houden, dan wel toe te laten dat
      deze zoekgemaakt, ondeugdelijk gemaakt, vernietigd of verborgen gehouden worden;

      d. gebruik te maken van een controlemiddel waarop of waarin onjuiste aantekeningen zijn gesteld, waarop of waarin
      in de aantekeningen wijzigingen zijn aangebracht dan wel waarop of waarin aantekeningen onleesbaar zijn gemaakt;

      e. een niet op zijn naam gestelde bestuurderskaart, werkplaatskaart of bedrijfskaart te gebruiken, met uitzondering
      van een bedrijfskaart van een werkgever die wordt gebruikt door zijn werknemer;

      f. in het voertuig een voorziening aanwezig te hebben die voor misbruik als bedoeld in de onderdelen a tot en met e
      kan worden aangewend.

      2 Dit artikel is niet van toepassing op de boordcomputer, bedoeld in [artikel 2.4:2, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0009386#Artikel2.42
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel2.44
    references:
