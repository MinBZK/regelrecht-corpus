  - number: 7.1:1
    text: |-
      In dit hoofdstuk wordt verstaan onder:

      a. *registerloods:* hetgeen daaronder wordt verstaan in [artikel 1, eerste lid, van de Loodsenwet][ref1];

      b. *loodsen op afstand:* de functie-uitoefening, bedoeld in [artikel 2, tweede lid, van de Loodsenwet][ref2];

      c. *week:* een periode van 7 dagen, die ingaat op maandag 00.00 uur.


      [ref1]: https://wetten.overheid.nl/BWBR0004365#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004365#Artikel2
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel7.11
    references:
      - id: ref1
        bwb_id: BWBR0004365
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0004365
        artikel: '2'
  - number: 7.2:1
    text: |-
      Met uitsluiting van hetgeen in het [Arbeidstijdenbesluit][ref1] is bepaald is dit hoofdstuk uitsluitend van
      toepassing op arbeid, verricht door registerloodsen.


      [ref1]: https://wetten.overheid.nl/BWBR0007687
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel7.21
    references:
      - id: ref1
        bwb_id: BWBR0007687
  - number: 7.2:2
    text: |-
      [Paragraaf 5.1 van de wet][ref1] en – voorzover aangewezen als overtredingen – de
      [paragrafen 5.2 tot en met 5.5 van de wet][ref2] en de daarop berustende bepalingen zijn van overeenkomstige
      toepassing op de registerloods die zonder werkgever of werknemer in de zin van de wet te zijn arbeid verricht aan
      boord van zeeschepen.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Paragraaf5.1
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Paragraaf5.2
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel7.22
