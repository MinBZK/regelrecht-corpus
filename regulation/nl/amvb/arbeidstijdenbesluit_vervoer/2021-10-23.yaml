    text: |-
      1 Onze Ministers kunnen, indien daartoe gegronde redenen aanwezig zijn, vrijstelling verlenen van:

      a. [artikel 2.5:4, tweede lid][ref1];

      b. de verplichting tot het installeren van een controlemiddel, voorzover dit niet in strijd is met verordening (EG)
      nr. 561/2006.

      2 De vrijstelling, bedoeld in het eerste lid, onderdeel a, wordt niet verleend dan nadat de belanghebbende
      werkgevers of werkgeversorganisaties met volledige rechtsbevoegdheid en werknemersorganisaties met volledige
      rechtsbevoegdheid in de gelegenheid zijn gesteld hun zienswijze naar voren te brengen.

      3 De werkgever en de persoon, bedoeld in [artikel 2:7, eerste lid, van de wet][ref2], leven de aan de vrijstelling
      verbonden voorschriften na.


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Artikel2.54
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel27
