        artikel: 5:5
  - number: 2.5:2
    text: |-
      Voor taxivervoer wordt voor de toepassing van [artikel 5:6 van de wet][ref1] de zondag aangemerkt als de periode
      gelegen tussen zondag 06.00 uur en 24.00 uur.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel56
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel2.52
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: 5:6
  - number: 2.5:3
    text: |-
      De bestuurder die vervoer anders dan taxivervoer verricht, handelt in overeenstemming met:

      a. voor zover van toepassing, artikel 6, eerste tot en met derde lid, van verordening (EG) nr. 561/2006;

      b. voor zover van toepassing, artikel 6 van het AETR-verdrag; of

      c. voor zover van toepassing, artikel 4, eerste tot en met derde lid, van deel b, afdeling 2, van bijlage 31 van de
      Handels- en Samenwerkingsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel2.53
  - number: 2.5:4
    text: |-
      1 In plaats van [artikel 5:8 van de wet][ref1] wordt dit artikel toegepast.

      2 De werkgever organiseert de arbeid zodanig, dat de werknemer die vervoer anders dan taxivervoer verricht:

      a. ten hoogste 43 maal in elke periode van 16 achtereenvolgende weken arbeid in nachtdienst verricht, of

      b. ten hoogste 20 uren in elke periode van 2 achtereenvolgende weken arbeid verricht tussen 00.00 en 06.00 uur.

      3 De werknemer die taxivervoer verricht, verricht:

      a. ten hoogste 52 maal in elke periode van 16 achtereenvolgende weken en 140 maal in elke periode van 52
      achtereenvolgende weken arbeid in nachtdienst; of

      b. ten hoogste 38 uren in elke periode van 2 achtereenvolgende weken arbeid tussen 00.00 en 06.00 uur.

      4 Van het derde lid kan slechts bij collectieve regeling en nadat de werknemer daarmee heeft ingestemd, worden
      afgeweken. Elk beding waarbij op andere wijze dan in de vorige volzin is bepaald, wordt afgeweken van het derde
      lid, is nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel58
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel2.54
    references:
