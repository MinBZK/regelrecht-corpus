  - number: 6A.2:2
    text: |-
      1 De schipper organiseert de arbeid zodanig dat zijn rusttijd en die van de vissers van 18 jaar of ouder ten minste
      10 uren bedraagt in elke periode van 24 achtereenvolgende uren, te rekenen vanaf het begin van de rusttijd.

      2 De schipper organiseert de arbeid zodanig dat de rusttijd van de vissers wordt verdeeld in niet meer dan twee
      perioden, waarvan één periode een onafgebroken rusttijd van ten minste 6 uren omvat. In dat geval wordt de periode
      van 24 uren, bedoeld in het eerste lid, berekend vanaf het begin van de langste genoten rusttijd. De tijd tussen
      twee op elkaar volgende perioden van rust bedraagt niet meer dan 14 uren.

      3 De schipper organiseert de arbeid zodanig dat zijn rusttijd en die van de vissers van 18 jaar of ouder tenminste
      77 uren bedraagt in elke periode van 7 dagen.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel6A.22
  - number: 6A.2:3
    text: |-
      De schipper organiseert de arbeid zodanig dat zijn gemiddelde wekelijkse arbeidstijd en die van de vissers van 18
      jaar of ouder ten hoogste 48 uren bedraagt, gerekend over een periode van 52 achtereenvolgende weken.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel6A.23
  - number: 6A.2:4
    text: |-
      1 De schipper organiseert de arbeid zodanig dat een jeugdige visser:

      a. in elke periode van 24 achtereenvolgende uren ten hoogste 8 uren arbeid verricht;

      b. in elke periode van 24 achtereenvolgende uren een rusttijd heeft van ten minste 9 uren aaneengesloten en waarin
      de periode tussen 00.00 en 5.00 uur is begrepen;

      c. per week ten hoogste 40 uren arbeid verricht;

      d. een onafgebroken rusttijd heeft van ten minste 36 uren in elke aaneengesloten tijdsruimte van 7 maal 24 uren;

      e. op zondag in beginsel geen arbeid verricht.

      2 De schipper organiseert de arbeid zodanig dat de jeugdige visser een pauze krijgt van ten minste, zo mogelijk
      aaneengesloten, 30 minuten ingeval de dagelijkse arbeidstijd langer is dan 4,5 uur.

      3 In afwijking van het eerste lid, onderdelen a en b, mag de jeugdige visser:

      a. in elke periode van 24 achtereenvolgende uren ten hoogste 12 uren arbeid verrichten indien hij uit hoofde van de
      wachtindeling gedurende die uren feitelijk wacht loopt;

      b. arbeid verrichten tussen 00.00 en 5.00 uur indien dit in verband met zijn opleiding noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel6A.24
  - number: 6A.2:5
    text: |-
      De schipper organiseert de arbeid zodanig dat de arbeid van een visser telkens na ten hoogste 6 uren wordt
      afgewisseld door een pauze.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel6A.25
  - number: 6A.2:6
    text: |-
      De schipper organiseert de wettelijk voorgeschreven oefeningen en appèls zodanig dat zij zo min mogelijk inbreuk
      maken op de rusttijden en geen oververmoeidheid veroorzaken.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel6A.26
  - number: 6A.2:7
    text: |-
      1 De schipper kan afwijken en kan een visser verplichten af te wijken van de arbeids- en rusttijden om arbeid
      te verrichten indien dit noodzakelijk is in verband met de onmiddellijke veiligheid van het vissersvaartuig, de
      personen aan boord, de lading of het milieu, of bij het geven van hulp aan andere schepen of personen in nood.

      2 Zodra de noodsituatie, bedoeld in het eerste lid, voorbij is, zorgt de schipper ervoor dat de visser die arbeid
      heeft verricht in een rustperiode, voldoende rusttijd ter compensatie krijgt.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel6A.27
  - number: 6A.3:1
    text: |-
      1 De scheepsbeheerder zorgt ervoor dat de schipper en de vissers aan boord van het vissersvaartuig:

      a. regelmatig voldoende lange rustperioden krijgen om hun veiligheid en gezondheid te waarborgen; en

      b. geen arbeid verrichten in strijd met dit hoofdstuk en de daarop berustende bepalingen.

      2 De scheepsbeheerder verschaft de schipper de nodige middelen en gegevens die deze nodig heeft om aan de hem in
      dit hoofdstuk en de daarop berustende bepalingen opgelegde verplichtingen te voldoen.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel6A.31
  - number: 6A.3:2
    text: |-
      1 Onze Minister van Infrastructuur en Waterstaat kan:

      a. vrijstelling verlenen van [artikel 6A.2:2][ref1], onder voorwaarden die zoveel mogelijk een gelijkwaardig
      beschermingsniveau bieden, onder andere door het toekennen van compenserende rusttijden;

      b. ontheffing verlenen van [artikel 6A.2:4, eerste lid, onderdelen a en b][ref2].

      2 De scheepsbeheerder en de schipper leven de aan de ontheffing verbonden voorschriften na.

      3 Onze Minister van Infrastructuur en Waterstaat kan vrijstelling verlenen van [artikel 6A.2:3][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Artikel6A.22
      [ref2]: https://wetten.overheid.nl/BWBR0009386#Artikel6A.24
      [ref3]: https://wetten.overheid.nl/BWBR0009386#Artikel6A.23
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel6A.32
