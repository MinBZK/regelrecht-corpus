  - number: 5.4:1
    text: |-
      1 De rusttijden van een bemanningslid worden als volgt geregistreerd:

      a. voor een bemanningslid als bedoeld in [artikel 1, eerste lid, van de Binnenvaartwet][ref1], in het
      vaartijdenboek, overeenkomstig het bepaalde krachtens [artikel 31 van het Binnenvaartbesluit][ref2];

      b. voor het boordpersoneel bedoeld in clausule 2, onderdeel k, van de overeenkomst, op een door de werkgever te
      bepalen wijze.

      2 Het eerste lid, onderdeel a, is niet van toepassing aan boord van veerboten en veerponten.


      [ref1]: https://wetten.overheid.nl/BWBR0023009#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0025631#Artikel31
