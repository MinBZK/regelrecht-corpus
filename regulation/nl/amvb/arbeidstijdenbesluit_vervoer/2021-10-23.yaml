  - number: 6.5:6
    text: |-
      De kapitein organiseert de wettelijk voorgeschreven oefeningen en appèls zodanig dat zij zo min mogelijk inbreuk
      maken op de rusttijden en geen oververmoeidheid veroorzaken.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel6.56
  - number: 6.5:7
    text: |-
      1 De kapitein kan afwijken en doen afwijken van de arbeids- en rusttijden om arbeid te verrichten indien dit
      noodzakelijk is in verband met de onmiddellijke veiligheid van het schip, de personen aan boord, de lading of het
      milieu, of bij het geven van hulp aan andere schepen of personen in nood.

      2 Zodra de noodsituatie, bedoeld in het eerste lid, voorbij is, zorgt de kapitein er voor dat de zeevarende die
      arbeid heeft verricht in een rustperiode, voldoende rusttijd ter compensatie krijgt.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel6.57
  - number: 6.6:1
    text: |-
      In plaats van [paragraaf 5.2 van de wet][ref1] wordt deze paragraaf toegepast op arbeid, verricht aan boord van
      een zeeschip als bedoeld in [artikel 6.1:1, onderdeel a, onder 1°][ref2], gedurende de tijd waarin dit zeeschip in
      havensleepdienst dienst doet, alsmede, in aanvulling op [artikel 6.3:1, eerste lid][ref3], op arbeid, verricht aan
      boord van een sleepboot als bedoeld in [artikel 1 van het Binnenvaartbesluit][ref4], gedurende de tijd waarin deze
      havensleepboot in havensleepdienst dienst doet.


