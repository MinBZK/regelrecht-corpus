  - number: 3.3:2
    text: |-
      1 In plaats van [artikel 5:5, tweede en derde lid, van de wet][ref1] wordt dit artikel toegepast.

      2 De werkgever organiseert de arbeid zodanig, dat de werknemer in elke aaneengesloten periode van 7 maal 24 uren,
      waarin hij ten minste één dienst verricht als bedoeld in [artikel 3.1:1][ref2], een onafgebroken rusttijd heeft van
      ten minste 36 uren.

      3 De in het tweede lid bedoelde periode vangt aan op het eerste tijdstip van de dag, waarop de werknemer een dienst
      als bedoeld in [artikel 3.1:1][ref3] verricht.

      4 In elke periode van 52 aaneengesloten weken waarin een werknemer ten minste 52 diensten als bedoeld in
      [artikel 3.1:1][ref4] verricht, organiseert de werkgever de arbeid zodanig, dat de werknemer 104 perioden heeft van
      ten minste 24 uren onafgebroken rusttijd.

      5 De in het vierde lid bedoelde 104 perioden omvatten ten minste 24 aaneengesloten perioden van ten minste 60 uren,
      van welke 24 perioden ten minste 12 perioden de gehele zaterdag en de gehele zondag omvatten.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel55
