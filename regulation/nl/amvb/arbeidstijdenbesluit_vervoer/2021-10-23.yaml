  - number: 3.1:1
    text: |-
      Met uitsluiting van het [Arbeidstijdenbesluit][ref1] is dit hoofdstuk van toepassing op de werknemer van 18 jaar
      of ouder, die voor een spoorwegonderneming als bedoeld in de [Spoorwegwet][ref2], in of op een spoorvoertuig een
      dienst verricht waarbij hij gedurende meer dan een uur wordt ingezet op een traject waarvan het begin- of eindpunt
      meer dan 15 kilometer over de grens is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0007687
      [ref2]: https://wetten.overheid.nl/BWBR0015007
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel3.11
