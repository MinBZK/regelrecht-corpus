        paragraaf: '5.2'
  - number: 7.3:1
    text: |-
      In plaats van [paragraaf 5.2][ref1] van de wet wordt deze paragraaf toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel7.31
    references:
      - id: ref1
        bwb_id: BWBR0009386
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 7.3:2
    text: |-
      1 De registerloods organiseert zijn arbeid zodanig dat hij gedurende ten hoogste 100 uren per week arbeid verricht
      als registerloods.

      2 Indien de registerloods zijn arbeid verricht gedurende een periode van aaneengesloten dagen die meer of minder
      dan een week omvat, wordt het aantal uren gedurende welke hij in die periode ten hoogste arbeid mag verrichten naar
      evenredigheid verhoogd onderscheidenlijk verlaagd.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel7.32
  - number: 7.3:3
    text: |-
      1 De registerloods organiseert zijn arbeid zodanig dat hij in elke periode van 24 aaneengesloten uren een
      onafgebroken rusttijd heeft van ten minste 8 uren dan wel twee rusttijden van elk ten minste 5 aaneengesloten uren.

      2 Indien bijzondere omstandigheden met betrekking tot een loodsreis hiertoe noodzaken, mag de in het eerste lid
      bedoelde rusttijd naar evenredigheid over 2 dagen worden gehouden.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel7.33
  - number: 7.3:4
    text: |-
      De registerloods mag na 4 aaneengesloten uren loodsen op afstand vanaf de wal pas weer op deze wijze dienst
      verrichten na ten minste 8 aaneengesloten uren rust.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel7.34
  - number: 8:1
    text: |-
      1 Het niet naleven van de [artikelen 2.4:1, eerste tot en met vijfde lid][ref1], [2.4:2, eerste lid][ref2],
      [2.4:3, eerste lid][ref3], [2.4:4][ref4], [2.4:8 tot en met 2.4:10][ref5], [2.4:11, derde lid][ref6],
      [2.4:13, tweede tot en met zesde lid][ref7], [2.5:1, tweede en vijfde lid][ref8], [2.5:3][ref9],
      [2.5:4, tweede lid][ref10], [2.5:4a, vijfde en zesde lid][ref11], [2.5:5, derde lid][ref12],
      [2.5:6, eerste tot en met vierde lid][ref13], [2.5:7, zesde lid][ref14], [2.5:8, vijfde en zesde lid][ref15],
      [2.6:1, derde lid][ref16], [2.7:1][ref17] en [2.7:4, eerste en derde lid][ref18], alsmede het bepaalde
      krachtens de [artikelen 2.4:1, zesde lid][ref19], [2.4:2, tweede lid][ref20], [2.4:3, derde lid][ref21],
      [2.4:12, onderdelen e, f en g][ref22], of [2.4:13, eerste lid][ref23], levert een overtreding op.

      2 Behoudens de [artikelen 2.4:4][ref24] en [2.4:13, tweede tot en met zesde lid][ref25], wordt, indien de
      bestuurder werknemer is, ingeval van het niet naleven van een tot de bestuurder gerichte bepaling de werkgever
      aangemerkt als degene die die bepaling niet heeft nageleefd.

      3 Het tweede lid is niet van toepassing indien de werkgever aantoont dat door hem de nodige bevelen zijn gegeven,
      de nodige maatregelen zijn genomen, de nodige middelen zijn verschaft en het redelijkerwijs te vorderen toezicht is
      gehouden om de naleving van de bepaling te verzekeren.

      4 Het niet naleven van [artikel 79, vierde lid][ref26], alsmede het bepaalde krachtens de
      [artikelen 80, vierde lid][ref27] en [83, achtste lid, onderdeel b, van het Besluit personenvervoer 2000][ref28],
      levert een overtreding op.


