    text: |-
      [Paragraaf 5.1][ref1] en – voorzover aangeduid als overtredingen – de [paragrafen 5.2 tot en met 5.5][ref2] en
      de daarop berustende bepalingen en [artikel 11:1 van de wet][ref3] zijn van overeenkomstige toepassing op de
      bestuurder die geen werkgever of werknemer is in de zin van de wet.


