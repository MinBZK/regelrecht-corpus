  - number: 3.3:1
    text: |-
      1 In plaats van de [artikelen 5:3, tweede en derde lid][ref1], en [5:8, vierde lid, van de wet][ref2] wordt dit
      artikel toegepast.

      2 De werkgever organiseert de arbeid zodanig, dat de werknemer een dagelijkse onafgebroken rusttijd heeft van:

      a. ten minste 12 uren in elke aaneengesloten periode van 24 uren indien de rusttijd in de normale woonplaats kan
      worden doorgebracht;

      b. ten minste 8 uren in elke aaneengesloten periode van 24 uren indien de rusttijd niet in de normale woonplaats
      kan worden doorgebracht.

      3 De rusttijd, bedoeld in het tweede lid, onder a, mag gedurende een periode van 7 maal 24 uren eenmaal
      worden ingekort tot ten minste 9 uren, mits de tijd waarmee deze rusttijd is ingekort, wordt toegevoegd aan de
      eerstvolgende rusttijd die in de normale woonplaats kan worden doorgebracht.

      4 De rusttijd die in de normale woonplaats kan worden doorgebracht, wordt niet aanzienlijk ingekort indien deze
      wordt voorafgegaan en wordt gevolgd door een rusttijd die niet in de normale woonplaats kan worden doorgebracht.

      5 De werknemer heeft na een dagelijkse onafgebroken rusttijd die niet in de normale woonplaats kan worden
      doorgebracht een dagelijkse onafgebroken rusttijd die in de normale woonplaats kan worden doorgebracht.

      6 Bij collectieve regeling kan, met inachtneming van het zevende lid, van het vijfde lid worden afgeweken. Elk
      beding waarbij op andere wijze wordt afgeweken van het vijfde lid, is nietig.

      7 De werkgever organiseert de arbeid zodanig, dat de werknemer ten hoogste 2 achtereenvolgende dagelijkse
      onafgebroken rusttijden heeft die niet in de normale woonplaats kunnen worden doorgebracht.

      8 De in het tweede lid bedoelde periode vangt aan op het eerste tijdstip van de dag, waarop de werknemer een dienst
      als bedoeld in [artikel 3.1:1][ref3] verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel58
      [ref3]: https://wetten.overheid.nl/BWBR0009386#Artikel3.11
