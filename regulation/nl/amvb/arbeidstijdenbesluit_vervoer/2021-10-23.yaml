      1 Het is de werkgever verboden te handelen in strijd met artikel 10, eerste lid, van verordening (EG) nr. 561/2006,
      dan wel, voor zover van toepassing, artikel 7, eerste lid, van deel b, afdeling 2, van bijlage 31 van de Handels-
      en Samenwerkingsovereenkomst.

      2 De werkgever handelt in overeenstemming met artikel 10, tweede en vijfde lid, van verordening (EG) nr. 561/2006,
      dan wel, voor zover van toepassing, artikel 7, tweede en vijfde lid, van deel b, afdeling 2, van bijlage 31 van de
      Handels- en Samenwerkingsovereenkomst.

      3 De bestuurder handelt in overeenstemming met artikel 20 van verordening (EG) nr. 561/2006.
