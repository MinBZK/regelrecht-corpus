  - number: 2.3:1
    text: |-
      Met uitsluiting van het [Arbeidstijdenbesluit][ref1] zijn dit hoofdstuk en de daarop berustende bepalingen van
      toepassing op iedere verplaatsing, die geheel of gedeeltelijk over voor openbaar gebruik toegankelijke wegen plaats
      vindt in lege of beladen toestand, alsmede de direct daarmee samenhangende werkzaamheden, van:

      a. een vrachtauto waarvan het kentekenbewijs een laadvermogen van meer dan 500 kilogram vermeldt, alsmede een losse
      trekker;

      b. een bus;

      c. een taxi, niet zijnde een ambulance.


      [ref1]: https://wetten.overheid.nl/BWBR0007687
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel2.31
    references:
      - id: ref1
        bwb_id: BWBR0007687
  - number: 2.3:2
    text: |-
      1 Dit hoofdstuk is niet van toepassing op vervoer met voertuigen als bedoeld in artikel 3, onder a bis tot en
      met i, van verordening (EG) nr. 561/2006, en artikel 1, vierde lid, van deel b, afdeling 2, van bijlage 31 van de
      Handels- en Samenwerkingsovereenkomst.

      2 Dit hoofdstuk is, behoudens [artikel 2.7:4][ref1], niet van toepassing op arbeid, verricht door een jeugdige
      werknemer.

      3 De [artikelen 2.4:1, derde lid][ref2], [2.4:13, tweede tot en met vierde lid][ref3], [2.5:1][ref4], [2.5:3][ref5]
      en [2.5:6][ref6] zijn niet van toepassing op vervoer als bedoeld in artikel 13, eerste lid, onder a, b, c, d, g, h,
      j, k, l, m, n en p, van verordening (EG) nr. 561/2006, en artikel 8, derde lid, onder a, b, c, d, g, h, i, j, k, l,
      en n, van deel b, afdeling 2, van bijlage 31 van de Handels- en Samenwerkingsovereenkomst.

      4 De [artikelen 2.4:1, derde lid][ref7], [2.5:1][ref8], [2.5:3][ref9] en [2.5:6][ref10] zijn niet van toepassing op
      vervoer als bedoeld in artikel 13, eerste lid, onderdeel o, van verordening (EG) nr. 561/2006, en artikel 8, derde
      lid, onderdeel m, van deel b, afdeling 2, van bijlage 31 van de Handels- en Samenwerkingsovereenkomst, voor zover
      het betreft voertuigen binnen hubfaciliteiten voor zover dit vervoer binnen een straal van 5 kilometer plaatsvindt.

      5 De [artikelen 2.4:1, derde lid][ref11], [2.4:13, tweede tot en met vierde lid][ref12], [2.5:1][ref13],
      [2.5:3][ref14] en [2.5:6][ref15] zijn niet van toepassing op vervoer als bedoeld in artikel 13, eerste lid,
      onder f, van verordening (EG) nr. 561/2006, en artikel 8, derde lid, onderdeel f, van deel b, afdeling 2, van
      bijlage 31 van de Handels- en Samenwerkingsovereenkomst, mits het gebruikte voertuig en de bestuurder voldoen aan
      [artikel 173b van het Reglement rijbewijzen][ref16].


