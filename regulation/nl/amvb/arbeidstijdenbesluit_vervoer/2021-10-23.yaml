  - number: 2.5:9
    text: |-
      1 Voor de toepassing van de [artikelen 2.5:4a, derde en vijfde lid][ref1], [2.5:6, derde lid][ref2], en
      [2.5:8, derde en vijfde lid][ref3], wordt niet als arbeidstijd aangemerkt:

      a. ten aanzien van de bestuurder de perioden waarin deze een voertuig begeleidt dat wordt vervoerd;

      b. wachttijden ten gevolge van rijverboden;

      c. ten aanzien van de bijrijder of een tweede bestuurder: de perioden die deze gedurende de rit naast de bestuurder
      of in een slaapcabine doorbrengt; en

      d. ten aanzien van de persoon, bedoeld in [artikel 2:7, eerste lid, van de wet][ref4], de perioden waarin deze niet
      ter beschikking van de klant staat en algemeen administratief werk verricht dat niet direct verband houdt met het
      ten behoeve van de klant verrichte vervoer.

      2 Voor zover de verwachte duur voor de bestuurder van tevoren bekend is, dan wel bij regeling van Onze
      Ministers is vastgelegd, wordt voor de toepassing van de [artikelen 2.5:4a, derde en vijfde lid][ref5],
      [2.5:6, derde lid][ref6], en [2.5:8, derde en vijfde lid][ref7], voor de bestuurder tevens niet als arbeidstijd
      aangemerkt de periode waarin deze voor eventuele oproepen beschikbaar moet zijn om een rit aan te vatten of te
      hervatten dan wel andere werkzaamheden moet uitvoeren.


