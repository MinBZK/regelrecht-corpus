        paragraaf: '2.4'
  - number: 2.4:5
    text: |-
      1 Onze Minister van Infrastructuur en Waterstaat is bevoegd inzake de artikelen 16, vierde lid, en 26 van
      verordening (EU) nr. 165/2014.

      2 De Dienst Wegverkeer is bevoegd inzake de artikelen 12 en 24 van verordening (EU) nr. 165/2014.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel2.45
  - number: 2.4:6
    text: |-
      Onze Minister van Infrastructuur en Waterstaat besluit ten aanzien van de aanvraag, verlening, weigering,
      intrekking of schorsing van een tachograafkaart met inachtneming van:

      a. de artikelen 25, derde lid, en 26, zevende lid, van verordening (EU) nr. 165/2014; of

      b. artikel 9, vijfde lid, van deel c, afdeling 2, van bijlage 31 van de Handels- en Samenwerkingsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel2.46
  - number: 2.4:7
    text: |-
      1 Een bestuurderskaart en een bedrijfskaart hebben een geldigheidsduur van 5 jaar.

      2 Een werkplaatskaart heeft een geldigheidsduur van 1 jaar.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel2.47
  - number: 2.4:8
    text: |-
      De werkgever, de werknemer en de persoon, bedoeld in [artikel 2:7, eerste lid, van de wet][ref1], die als
      bestuurder rijden op een vrachtauto of bus, die is voorzien van een controleapparaat, handelen overeenkomstig:

      a. de artikelen 27, onderscheidenlijk 29, vijfde lid, van verordening (EU) nr. 165/2014; of

      b. de artikelen 4, onderscheidenlijk 8, vijfde lid, van deel b, afdeling 4, van bijlage 31 van de Handels- en
      Samenwerkingsovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel27
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel2.48
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: 2:7
  - number: 2.4:9
    text: |-
      De houder van een werkplaatskaart handelt overeenkomstig de artikelen 22, tweede lid, derde lid, eerste volzin,
      vierde en vijfde lid, en 23 van verordening (EU) nr. 165/2014.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel2.49
  - number: 2.4:10
    text: |-
      De werkgever en de persoon bedoeld in [artikel 2:7, eerste lid, van de wet][ref1] gebruikt een bedrijfskaart
      om de registratie van gegevens met betrekking tot de in [artikel 4:3, eerste lid, van de wet][ref2] neergelegde
      verplichting in het controleapparaat in te stellen en de in het controleapparaat geregistreerde gegevens te kunnen
      onttrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel43
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel2.410
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: 2:7
      - id: ref2
        bwb_id: BWBR0007671
        artikel: 4:3
  - number: 2.4:11
    text: |-
      1 Een bestuurderskaart, werkplaatskaart of bedrijfskaart verliest zijn geldigheid in ieder geval door intrekking of
      schorsing en door het verstrijken van de geldigheidsduur.

      2 Een binnen de geldigheidsduur verloren, gestolen, defect geraakte of beschadigde bestuurderskaart,
      werkplaatskaart of bedrijfskaart wordt vervangen door een vervangende kaart voor de resterende termijn van
      geldigheid.

      3 De houder meldt verlies of diefstal van zijn bestuurderskaart, werkplaatskaart of bedrijfskaart aan Onze Minister
      van Infrastructuur en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel2.411
  - number: 2.4:12
    text: |-
      Bij regeling van Onze Minister van Infrastructuur en Waterstaat kunnen regels worden gesteld over:

      a. de gronden voor goedkeuring, weigering, intrekking of schorsing van een model tachograafkaart;

      b. het voor goedkeuring van een model tachograafkaart benodigde certificaat;

      c. de geldigheid en de gronden van verlening, weigering, intrekking of schorsing van tachograafkaarten;

      d. de aanvraag van tachograafkaarten en model tachograafkaarten, de beslistermijn op de aanvraag en de aan de
      behandeling van een aanvraag verbonden kosten alsmede over de afgifte van tachograafkaarten;

      e. de wijze van melden en inleveren in geval van verloren, gestolen, defecte of beschadigde tachograafkaarten;

      f. de wijze waarop een tachograafkaart of een controleapparaat wordt gebruikt;

      g. de wijze van verwerking van de op een tachograafkaart of in een controleapparaat opgeslagen gegevens.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel2.412
  - number: 2.4:13
    text: |-
      1 Bij regeling van Onze Minister van Infrastructuur en Waterstaat kunnen nadere regels worden gesteld, welke voor
      de uitvoering van verordening (EU) nr. 165/2014 noodzakelijk zijn.

      2 Voor zover verordening (EG) nr. 561/2006 van toepassing is, is het verboden te handelen in strijd met de
      artikelen 1, eerste lid, tweede alinea, 3, eerste lid, 27, 29, tweede lid, 32, eerste tot en met vierde lid, 33,
      eerste en tweede lid, 34, behoudens het derde lid, onder b, tweede alinea, 35, 36, eerste en tweede lid, 37, eerste
      lid, eerste volzin en tweede lid van verordening (EU) nr. 165/2014.

      3 Voor zover verordening (EG) nr. 561/2006 van toepassing is, leeft de bestuurder het voorschrift van artikel 12,
      tweede volzin van verordening (EG) nr. 561/2006 na.

      4 Voor zover het AETR-verdrag van toepassing is, is het verboden te handelen in strijd met het bepaalde bij of
      krachtens artikel 10 van het AETR-verdrag.

      5 Voor zover van toepassing, is het verboden te handelen in strijd met de artikelen:

      a. 3, 6, behoudens het derde lid, onder b, tweede alinea, 7, 8, tweede lid, 9, 10, eerste en tweede lid, en 11, van
      deel b, afdeling 4, van bijlage 31 van de Handels- en Samenwerkingsovereenkomst; en

      b. 3, 14, eerste en tweede lid, 15, eerste en tweede lid, en 16, eerste en tweede lid, van deel c, afdeling 2, van
      bijlage 31 van de Handels- en Samenwerkingsovereenkomst.

      6 Voor zover van toepassing, leeft de bestuurder het voorschrift van artikel 8, tweede lid, derde volzin, van deel
      b, afdeling 2, van bijlage 31 van de Handels- en Samenwerkingsovereenkomst na.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel2.413
  - number: 2.5:1
    text: |-
      1 In plaats van de [artikelen 5:3, tweede en derde lid][ref1], en [5:5, tweede en derde lid, van de wet][ref2]
      wordt dit artikel toegepast.

      2 De bestuurder die vervoer anders dan taxivervoer verricht, en de bijrijder handelen in overeenstemming met:

      a. voor zover van toepassing, de artikelen 8 en 9 van [verordening (EG) nr. 561/2006](32006R0561);

      b. voor zover van toepassing, in overeenstemming met artikel 8 van het AETR-verdrag; of

      c. voor zover van toepassing, artikel 6 van deel b, afdeling 2, van bijlage 31 van de Handels- en
      Samenwerkingsovereenkomst.

      3 De werknemer die taxivervoer verricht, heeft:

      a. in elke aaneengesloten periode van 24 uren een onafgebroken rusttijd van ten minste 10 uren; en

      b. in elke aaneengesloten periode van 7 maal 24 uren een onafgebroken rusttijd van ten minste 36 uren.

      4 Van het derde lid kan, met inachtneming van het vijfde lid, slechts bij collectieve regeling worden afgeweken.
      Elk beding waarbij op andere wijze dan in de vorige volzin is bepaald, wordt afgeweken van het derde lid, is
      nietig.

      5 De werkgever organiseert de werkzaamheden zodanig, dat de werknemer die taxivervoer verricht:

      a. in elke aaneengesloten periode van 24 uren een onafgebroken rusttijd van ten minste 10 uren heeft, welke
      rusttijd tweemaal in elke aaneengesloten periode van 14 maal 24 uren mag worden ingekort tot ten minste 8 uren; en

      b. in elke aaneengesloten periode van 14 maal 24 uren een rusttijd van 72 uren heeft, welke mag worden gesplitst in
      perioden van ten minste 24 uren.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Artikel55
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel2.51
    references:
