  - number: 6.7:1
    text: |-
      1 De scheepsbeheerder zorgt er voor dat de zeevarenden aan boord van het zeeschip geen arbeid verrichten in strijd
      met dit hoofdstuk en de daarop berustende bepalingen.

      2 De scheepsbeheerder verschaft de kapitein de middelen en gegevens die deze nodig heeft om aan de hem in dit
      hoofdstuk en de daarop berustende bepalingen opgelegde verplichtingen te voldoen.

      3 De scheepsbeheerder zorgt er voor dat aan boord de tekst van de wet en van dit hoofdstuk en de daarop berustende
      bepalingen en van de van toepassing zijnde collectieve regeling beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel6.71
  - number: 6.7:2
    text: |-
      1 Onze Minister van Infrastructuur en Waterstaat kan ontheffing verlenen van
      [artikel 6.5:2, eerste en tweede lid][ref1], en [artikel 6.5:3, eerste lid, onderdelen a en b][ref2].

      2 De scheepsbeheerder en de kapitein leven de aan de ontheffing verbonden voorschriften na.

      3 Onze Minister van Infrastructuur en Waterstaat kan regels stellen omtrent de wijze waarop de aanvraag om een
      ontheffing moet worden ingediend en de gegevens die door de aanvrager moeten worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Artikel6.52
