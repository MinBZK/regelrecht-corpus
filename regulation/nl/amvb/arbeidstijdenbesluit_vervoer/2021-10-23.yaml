        artikel: 5:8
  - number: 2.5:4a
    text: |-
      1 In afwijking van de [artikelen 2.2:2][ref1] en [2.3:1][ref2] is dit artikel uitsluitend van toepassing voor zover
      verordening (EG) nr. 561/2006 of de Handels- en Samenwerkingsovereenkomst van toepassing is.

      2 In plaats van [artikel 5:8 van de wet][ref3] wordt dit artikel toegepast.

      3 Ten aanzien van de werknemer die arbeid verricht die geheel of gedeeltelijk is gelegen in de periode tussen
      01.00 en 05.00 uur, geldt dat zijn totale arbeidstijd niet meer bedraagt dan 10 uur in de periode van 24
      achtereenvolgende uren, te rekenen vanaf het begin van zijn arbeid.

      4 Van het derde lid kan, met inachtneming van het vijfde lid, slechts bij collectieve regeling worden afgeweken.
      Elk beding waarbij op andere wijze dan in de vorige volzin is bepaald, wordt afgeweken van het derde lid, is
      nietig.

      5 De werkgever organiseert de arbeid zodanig, dat de werknemer een dagelijkse arbeidstijd heeft die niet meer
      bedraagt dan 12 uur in elke periode van 24 achtereenvolgende uren, te rekenen vanaf het begin van zijn arbeid.

      6 De persoon, bedoeld in [artikel 2:7, eerste lid, van de wet][ref4], neemt een maximale dagelijkse arbeidstijd in
      acht overeenkomstig het vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Artikel2.22
      [ref2]: https://wetten.overheid.nl/BWBR0009386#Artikel2.31
      [ref3]: https://wetten.overheid.nl/BWBR0007671#Artikel58
      [ref4]: https://wetten.overheid.nl/BWBR0007671#Artikel27
