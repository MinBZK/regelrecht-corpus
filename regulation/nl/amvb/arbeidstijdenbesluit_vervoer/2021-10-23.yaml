articles:
  - number: 1:1
    text: |-
      In dit besluit wordt verstaan onder wet: de [Arbeidstijdenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007671
    url: https://wetten.overheid.nl/BWBR0009386/2021-10-23#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007671
  - number: 2.1:1
    text: |-
      1 Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt, voor zover niet anders is bepaald,
      verstaan onder:

      a. *Onze Ministers:* Onze Minister van Infrastructuur en Waterstaat en Onze Minister van Sociale Zaken en
      Werkgelegenheid;

      b. *verordening (EG) nr. 561/2006:* verordening (EG) nr. 561/2006 van het Europees Parlement en de Raad van de
      Europese Unie van 15 maart 2006 tot harmonisatie van bepaalde voorschriften van sociale aard voor het wegvervoer,
      tot wijziging van Verordeningen (EEG) nr. 3821/85 en (EG) nr. 2135/98 van de Raad en tot intrekking van Verordening
      (EEG) nr. 3820/85 van de Raad (PbEU L 102);

      c. *verordening (EU) nr. 165/2014:* verordening (EU) nr. 165/2014 van het Europees Parlement en van de Raad van
      4 februari 2014 betreffende tachografen in het wegvervoer, tot intrekking van Verordening (EEG) nr. 3821/85 van
      de Raad betreffende het controleapparaat in het wegvervoer en tot wijziging van Verordening (EG) nr. 561/2006 van
      het Europees Parlement en de Raad tot harmonisatie van bepaalde voorschriften van sociale aard voor het wegvervoer
      (PbEU 2014, L 60);

      d. *vrachtauto:* vrachtauto als bedoeld in [artikel 1.1 van de Wet wegvervoer goederen][ref1], alsmede een trekker
      als bedoeld in [artikel 1.1 van de Regeling voertuigen][ref2];

      e. *bus:* motorrijtuig als bedoeld in [artikel 1 van de Wet personenvervoer 2000][ref3];

      f. *taxi:* auto, als bedoeld in [artikel 1 van de Wet personenvervoer 2000][ref4] waarmee vervoer wordt verricht
      waarvoor een vergunning, als bedoeld in [artikel 76, eerste lid, van voornoemde wet][ref5], vereist is;

      g. *bijrijder:* persoon die als functie heeft in een vrachtauto mee te rijden om de bestuurder daarvan behulpzaam
      te zijn en in voorkomende gevallen direct met het vervoer samenhangende werkzaamheden te verrichten;

      h. *controleapparaat:* controleapparaat als bedoeld in verordening (EU) nr. 165/2014;

      i. richtlijn 2002/15/EG: richtlijn 2002/15/EG van het Europees Parlement en de Raad van de Europese Unie van
      11 maart 2002 betreffende de organisatie van de arbeidstijd van personen die mobiele werkzaamheden in het
      wegvervoer uitoefenen (PbEG L 80);

      j. AETR-verdrag: de op 1 juli 1970 te Genève tot stand gekomen Europese Overeenkomst nopens de arbeidsvoorwaarden
      voor de bemanningen van motorrijtuigen in het Internationale vervoer over de weg (Trb. 1994, 123);

      k. *Handels- en Samenwerkingsovereenkomst:* Handels- en Samenwerkingsovereenkomst tussen de Europese Unie en
      de Europese Gemeenschap voor Atoomenergie, enerzijds, en het Verenigd Koninkrijk van Groot-Brittannië en Noord-
      Ierland, anderzijds (PbEU 2021, L 149).

      2 Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt onder «bestuurder» en «week»
      verstaan hetgeen onder deze begrippen wordt verstaan in artikel 4, onderdelen c en i, van verordening (EG) nr.
      561/2006.

      3 Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt onder «tachograafkaart»,
      «bestuurderskaart», «controlekaart», «bedrijfskaart» en «werkplaatskaart» verstaan hetgeen onder deze begrippen
      wordt verstaan in artikel 2, onderdelen d, f en i tot en met k van verordening (EU) nr. 165/2014.


