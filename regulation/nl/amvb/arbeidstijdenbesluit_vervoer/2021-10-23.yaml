  - number: 2.5:6
    text: |-
      1 De bestuurder op wie verordening (EG) nr. 561/2006, het AETR-verdrag, en de Handels- en Samenwerkingsovereenkomst
      niet van toepassing zijn, handelt overeenkomstig [artikel 5:4, tweede en derde lid, van de wet][ref1].

      2 De bestuurder op wie het eerste lid niet van toepassing is, handelt in overeenstemming met:

      a. voor zover van toepassing, artikel 7 van verordening (EG) nr. 561/2006;

      b. voor zover van toepassing, artikel 7 van het AETR-verdrag; of

      c. voor zover van toepassing, artikel 5 van deel b, afdeling 2, van bijlage 31 van de Handels- en
      Samenwerkingsovereenkomst.

      3 Behoudens het eerste en tweede lid en [artikel 2.5:3][ref2], organiseert de werkgever de arbeid zodanig, dat
      indien deze andere werkzaamheden dan rijden omvat dan wel mede omvat, de werknemer, voor zover hij vervoer verricht
      waarop verordening (EG) nr. 561/2006 of de Handels- en Samenwerkingswerkingsovereenkomst van toepassing is:

      a. geen arbeidstijd langer dan zes uren achtereen zonder pauze heeft;

      b. ingeval de arbeidstijd zes uren of langer, doch niet meer dan negen uren bedraagt, een pauze van ten minste 30
      minuten heeft, dan wel twee pauzes van elk ten minste 15 minuten;

      c. ingeval de arbeidstijd meer dan negen uren bedraagt, een pauze van ten minste 45 minuten heeft, dan wel
      verschillende pauzes van elk ten minste 15 minuten.

      4 De persoon, bedoeld in [artikel 2:7, eerste lid, van de wet][ref3], neemt pauzes in acht overeenkomstig het derde
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0009386#Artikel2.53
      [ref3]: https://wetten.overheid.nl/BWBR0007671#Artikel27
