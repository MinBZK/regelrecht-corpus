---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: arbeidstijdenbesluit_vervoer
regulatory_layer: AMVB
publication_date: '2009-11-20'
valid_from: '2005-01-01'
bwb_id: BWBR0009386
url: https://wetten.overheid.nl/BWBR0009386/2005-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op voordracht van Onze Ministers van Verkeer en Waterstaat en van Sociale Zaken en Werkgelegenheid van 13 augustus
    1997, nr. DGP/WJZ/V 723769, Directoraat-Generaal Personenvervoer;

    Gelet op artikel 5:12, tweede lid, van de Arbeidstijdenwet;

    De Raad van State gehoord (advies van 30 september 1997, no. W09.97.0529);

    Gezien het nader rapport van Onze Ministers van Verkeer en Waterstaat en van Sociale Zaken en Werkgelegenheid van 9
    februari 1998, nr. DGP/WJZ/V 725 901, Directoraat-Generaal Personenvervoer;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#ArtikelAanhef
articles:
  - number: 1:1
    text: |-
      In dit besluit wordt verstaan onder wet: de [Arbeidstijdenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007671
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007671
  - number: 2.1:1.1
    text: 'Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.11
  - number: 2.1:1.1.a
    text: '*Onze Ministers:* Onze Ministers van Verkeer en Waterstaat en van Sociale Zaken en Werkgelegenheid;'
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.11
  - number: 2.1:1.1.b
    text: |-
      *verordening (EEG) nr. 3820/85:* [verordening (EEG) nr. 3820/85](31985R3820) van de Raad van de Europese
      Gemeenschappen van 20 december 1985 tot harmonisatie van bepaalde voorschriften van sociale aard voor het
      wegvervoer (PbEG L 370);
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.11
  - number: 2.1:1.1.c
    text: |-
      *verordening (EEG) nr. 3821/85:* [verordening (EEG) nr. 3821/85](31985R3821) van de Raad van de Europese
      Gemeenschappen van 20 december 1985 betreffende de invoering van een controle-apparaat bij het wegvervoer (PbEG
      L 370);
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.11
  - number: 2.1:1.1.d
    text: |-
      *vrachtauto:*motorrijtuig als bedoeld in
      [artikel 1, eerste lid, onderdeel e, van de Wet goederenvervoer over de weg][ref1], alsmede een losse trekker als
      bedoeld in [artikel 1.1, eerste lid, onderdeel bb, van het Voertuigreglement][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005443#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006746#Artikel1
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0005443
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006746
        artikel: '1'
  - number: 2.1:1.1.e
    text: |-
      *bus:* motorrijtuig als bedoeld in [artikel 1, onderdeel e, van de Wet personenvervoer 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel1
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '1'
  - number: 2.1:1.1.f
    text: |-
      *taxi:* auto waarmee taxivervoer wordt verricht als bedoeld in
      [artikel 1, onderdeel j, van de Wet personenvervoer 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel1
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '1'
  - number: 2.1:1.1.g
    text: |-
      *bijrijder:* persoon die als functie heeft in een vrachtauto mee te rijden om de bestuurder daarvan behulpzaam te
      zijn en in voorkomende gevallen direct met het vervoer samenhangende werkzaamheden te verrichten.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.11
  - number: 2.1:1.2
    text: |-
      Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt onder bestuurder, week en rusttijd
      verstaan hetgeen onder deze begrippen wordt verstaan in artikel 1, onderdelen 3, 4 en 5, van [verordening (EEG) nr.
      3820/85](31985R3820).
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.11
  - number: 2.2:1
    text: |-
      [ Artikel 5:7 van de wet][ref1] is niet van toepassing op verplaatsing over voor openbaar gebruik toegankelijke
      wegen van een vrachtauto, bus of taxi in lege of beladen toestand als bedoeld in [artikel 2.3:1][ref2], alsmede de
      daar bedoelde direct daarmee samenhangende werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009386#Artikel2
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.21
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0009386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.2:2
    text: |-
      [Paragraaf 5.1][ref1] en – voorzover aangeduid als strafbare feiten – de [paragrafen 5.2 tot en met 5.5][ref2]
      en de daarop berustende bepalingen en [artikel 11:1 van de wet][ref3] zijn van overeenkomstige toepassing op de
      bestuurder die geen werkgever of werknemer is in de zin van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Paragraaf5.1
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Paragraaf5.2
      [ref3]: https://wetten.overheid.nl/BWBR0007671#Artikel11
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.22
    references:
      - id: ref1
        bwb_id: BWBR0007671
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0007671
        paragraaf: '5.2'
      - id: ref3
        bwb_id: BWBR0007671
        artikel: '11'
  - number: 2.3:1
    text: |-
      Met uitsluiting van het [Arbeidstijdenbesluit][ref1] zijn dit hoofdstuk en de daarop berustende bepalingen van
      toepassing op iedere verplaatsing over voor openbaar gebruik toegankelijke wegen in lege of beladen toestand,
      alsmede de direct daarmee samenhangende werkzaamheden, van:


      [ref1]: https://wetten.overheid.nl/BWBR0007687
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.31
    references:
      - id: ref1
        bwb_id: BWBR0007687
  - number: 2.3:1.a
    text: |-
      een vrachtauto waarvan het kenteken- of registratiebewijs een laadvermogen van meer dan 500 kilogram vermeldt,
      alsmede een losse trekker;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.31
  - number: 2.3:1.b
    text: een bus;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.31
  - number: 2.3:1.c
    text: een taxi, niet zijnde een ambulance.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.31
  - number: 2.3:2.1
    text: |-
      Dit hoofdstuk is niet van toepassing op vervoer met voertuigen als bedoeld in artikel 4, onderdelen 4, 5, 7, 8, 10,
      11 en 12 van [verordening (EEG) nr. 3820/85](31985R3820).
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.32
  - number: 2.3:2.2
    text: Dit hoofdstuk is, behoudens artikel 2.7:4, niet van toepassing op arbeid, verricht door een jeugdige werknemer.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.32
  - number: 2.3:2.3
    text: |-
      [De artikelen 2.5:1, tweede en derde lid][ref1], en [2.5:4, tweede en derde lid][ref2], zijn niet van toepassing
      ten aanzien van vervoer, verricht onder gezag van een niet in Nederland gevestigde werkgever.


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009386#Artikel2
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.32
    references:
      - id: ref1
        bwb_id: BWBR0009386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.5'
      - id: ref2
        bwb_id: BWBR0009386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 2.4:1
    text: |-
      De werkgever en de persoon, bedoeld in artikel 2:7, eerste lid, van de wet, bewaren de gegevens en bescheiden met
      betrekking tot de in artikel 4:3 van de wet neergelegde registratieverplichting ten minste 52 weken, gerekend vanaf
      de datum waarop de desbetreffende gegevens en bescheiden betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.41
  - number: 2.4:2.1
    text: |-
      Bij taxivervoer heeft de bestuurder gedurende de tijd dat hij arbeid verricht een geldige werkmap bij zich volgens
      een door Onze Minister vastgesteld model.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.42
  - number: 2.4:2.2
    text: |-
      Het eerste lid is niet van toepassing indien een dienstrooster is opgesteld overeenkomstig het bepaalde bij of
      krachtens [artikel 2.4:3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Artikel2
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.42
    references:
      - id: ref1
        bwb_id: BWBR0009386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 2.4:2.3
    text: |-
      Bij regeling van Onze Ministers kunnen nadere regels worden gesteld ten aanzien van de inhoud, het gebruik, de
      vorm, de afgifte en de verlenging van de geldigheidsduur van de werkmap.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.42
  - number: 2.4:3.1
    text: |-
      Bij openbaar vervoer als bedoeld in [artikel 1, onderdeel h, van de Wet personenvervoer 2000][ref1] waarop
      [verordening (EEG) nr. 3820/85](31985R3820) niet van toepassing is en dat wordt verricht met een bus, alsmede bij
      geregeld vervoer als bedoeld in [artikel 89, onderdelen g en h, van het Besluit personenvervoer 2000][ref2], stelt
      de werkgever een dienstrooster op als bedoeld in artikel 14 van die verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0011982#Artikel89
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.43
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0011982
        artikel: '89'
  - number: 2.4:3.2
    text: |-
      Bij regeling van Onze Ministers kunnen nadere regels worden gesteld ten aanzien van de inhoud, de invulling, de
      bekendmaking en de bewaring van het dienstrooster.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.43
  - number: 2.4:4
    text: 'Het is de werkgever, de werknemer en de persoon, bedoeld in artikel 2:7, eerste lid, van de wet, verboden:'
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.44
  - number: 2.4:4.a
    text: |-
      in of op controlemiddelen onjuiste gegevens of onjuiste aantekeningen te stellen, te doen stellen, of toe te laten
      dat zij daarin of daarop gesteld worden;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.44
  - number: 2.4:4.b
    text: |-
      in of op controlemiddelen wijziging aan te brengen, te doen aanbrengen of toe te laten dat wijziging wordt
      aangebracht in vroeger daarin of daarop gestelde gegevens of aantekeningen, deze onleesbaar te maken, te doen maken
      of toe te laten dat zij onleesbaar gemaakt worden;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.44
  - number: 2.4:4.c
    text: |-
      controlemiddelen geheel of ten dele zoek te maken of te doen zoekmaken, ondeugdelijk te maken of te doen maken, te
      vernietigen of te doen vernietigen, verborgen te houden of te doen verborgen houden, dan wel toe te laten dat deze
      zoekgemaakt, ondeugdelijk gemaakt, vernietigd of verborgen gehouden worden;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.44
  - number: 2.4:4.d
    text: |-
      gebruik te maken van een controlemiddel waarop of waarin onjuiste aantekeningen zijn gesteld, waarop of waarin in
      de aantekeningen wijzigingen zijn aangebracht dan wel waarop of waarin aantekeningen onleesbaar zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.44
  - number: 2.4:5.1
    text: |-
      Bij regeling van Onze Ministers kunnen nadere regels worden gesteld, welke voor de uitvoering van [verordening
      (EEG) nr. 3821/85](31985R3821) noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.45
  - number: 2.4:5.2
    text: |-
      Voor zover [verordening (EEG) nr. 3820/85](31985R3820) van toepassing is, is het verboden te handelen in strijd met
      de artikelen 1, 3, eerste lid, en 13 tot en met 16 van [verordening (EEG) nr. 3821/85](31985R3821).
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.45
  - number: 2.4:5.3
    text: |-
      Voor zover [verordening (EEG) nr. 3820/85](31985R3820) van toepassing is, leeft de bestuurder het voorschrift van
      artikel 12, tweede volzin van [verordening (EEG) nr. 3820/85](31985R3820) na.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.45
  - number: 2.4:6.1
    text: |-
      Onze Ministers worden aangewezen als bevoegde instantie, bedoeld in de artikelen 16, eerste lid, derde volzin, en
      19, derde lid, van [verordening (EEG) nr. 3821/85](31985R3821).
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.46
  - number: 2.4:6.2
    text: |-
      Onze Minister van Verkeer en Waterstaat wordt aangewezen als bevoegde instantie, bedoeld in artikel 7 van
      [verordening (EEG) nr. 3821/85](31985R3821), ten aanzien van tachograafkaarten.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.46
  - number: 2.4:6.3
    text: |-
      Onze Minister van Verkeer en Waterstaat wordt aangewezen als instantie tot uitvoering van de artikelen 5, 6, 8 en
      11 van [verordening (EEG) nr. 3821/85](31985R3821), ten aanzien van tachograafkaarten.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.46
  - number: 2.4:6.4
    text: |-
      De Dienst Wegverkeer wordt aangewezen als bevoegde instantie, bedoeld in de artikelen 7, 9, tweede lid, en 12,
      eerste, tweede, derde en vijfde lid, van [verordening (EEG) nr. 3821/85](31985R3821) , met uitzondering van
      tachograafkaarten.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.46
  - number: 2.4:6.5
    text: |-
      De Dienst Wegverkeer wordt aangewezen als instantie tot uitvoering van de artikelen 5, 6, 8 en 11 van [verordening
      (EEG) nr. 3821/85](31985R3821) , met uitzondering van tachograafkaarten.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.46
  - number: 2.5:1.1
    text: In plaats van de artikelen 5:3, tweede en derde lid, en 5:5, tweede lid, van de wet wordt dit artikel toegepast.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.51
  - number: 2.5:1.2
    text: 'De werknemer heeft:'
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.51
  - number: 2.5:1.2.a
    text: |-
      een onafgebroken rusttijd van ten minste 11 uren in elke periode van 24 achtereenvolgende uren, te rekenen vanaf
      het tijdstip dat de werknemer niet vrij is om over zijn eigen tijd te beschikken;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.51
  - number: 2.5:1.2.b
    text: |-
      per week een onafgebroken rusttijd overeenkomstig artikel 8, derde lid, van [verordening (EEG) nr. 3820/85]
      (31985R3820);
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.51
  - number: 2.5:1.2.c
    text: een rusttijd van ten minste 228 uren in elke periode van 2 weken.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.51
  - number: 2.5:1.3
    text: |-
      Van het tweede lid kan met inachtneming van het vierde lid slechts bij collectieve regeling worden afgeweken. Elk
      beding waarbij op andere wijze dan in de vorige volzin is bepaald, wordt afgeweken van het tweede lid, is nietig.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.51
  - number: 2.5:1.4
    text: De bestuurder handelt overeenkomstig de artikelen 8 en 9 van [verordening (EEG) nr. 3820/85](31985R3820).
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.51
  - number: 2.5:2
    text: |-
      Voor taxivervoer wordt voor de toepassing van artikel 5:4 van de wet de zondag aangemerkt als de periode gelegen
      tussen zondag 06.00 uur en 24.00 uur.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.52
  - number: 2.5:3
    text: De bestuurder handelt overeenkomstig artikel 6 van [verordening (EEG) nr. 3820/85](31985R3820).
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.53
  - number: 2.5:4.1
    text: In plaats van artikel 5:8 van de wet wordt dit artikel toegepast.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.54
  - number: 2.5:4.2
    text: 'Ten aanzien van de werknemer die arbeid verricht in nachtdienst, geldt dat hij:'
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.54
  - number: 2.5:4.2.a
    text: hetzij ten hoogste 26 maal in elke periode van 13 achtereenvolgende weken arbeid in nachtdienst verricht;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.54
  - number: 2.5:4.2.b
    text: |-
      hetzij ten hoogste 12 uren in elke periode van 2 achtereenvolgende weken arbeid verricht tussen 00.00 uur en 06.00
      uur.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.54
  - number: 2.5:4.3
    text: |-
      Van het tweede lid kan, met inachtneming van het vierde lid, slechts bij collectieve regeling worden afgeweken. Elk
      beding waarbij op andere wijze dan in de vorige volzin is bepaald, wordt afgeweken van het tweede lid, is nietig.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.54
  - number: 2.5:4.4
    text: 'De werkgever organiseert de arbeid zodanig, dat de werknemer:'
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.54
  - number: 2.5:4.4.a
    text: hetzij ten hoogste 35 maal in elke periode van 13 achtereenvolgende weken arbeid in nachtdienst verricht;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.54
  - number: 2.5:4.4.b
    text: |-
      hetzij ten hoogste 20 uren in elke periode van 2 achtereenvolgende weken arbeid verricht tussen 00.00 uur en 06.00
      uur.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.54
  - number: 2.5:5.1
    text: 'Dit artikel is uitsluitend van toepassing op arbeid verricht in het kader van:'
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.55
  - number: 2.5:5.1.a
    text: vervoer van brood- en banketbakkerijproducten;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.55
  - number: 2.5:5.1.b
    text: vervoer van goederen van en naar distributiecentra, terminals of luchthavens;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.55
  - number: 2.5:5.1.c
    text: grensoverschrijdend vervoer van bloembollen, bloemen, planten en boomkwekerijproducten, groente en fruit;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.55
  - number: 2.5:5.1.d
    text: vervoer per taxi;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.55
  - number: 2.5:5.1.e
    text: vervoer ten behoeve van het onderhoud en de aanleg van wegen en railverbindingen.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.55
  - number: 2.5:5.2
    text: |-
      In afwijking van [artikel 2.5:4, vierde lid][ref1], kan dit artikel worden toegepast indien de aard van het vervoer
      met zich brengt dat dit vervoer hoofdzakelijk gedurende de nacht plaatsvindt en dit door het op een andere wijze
      organiseren van het vervoer redelijkerwijs niet is te voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Artikel2
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.55
    references:
      - id: ref1
        bwb_id: BWBR0009386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 2.5:5.3
    text: 'De werkgever organiseert de arbeid zodanig, dat de werknemer:'
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.55
  - number: 2.5:5.3.a
    text: |-
      hetzij ten hoogste 42 maal in elke periode van 13 achtereenvolgende weken en 140 maal in elke periode van 52
      achtereenvolgende weken arbeid in nachtdienst verricht;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.55
  - number: 2.5:5.3.b
    text: |-
      hetzij ten hoogste 38 uren in elke periode van 2 achtereenvolgende weken arbeid verricht tussen 00.00 uur en 06.00
      uur.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.55
  - number: 2.5:6.1
    text: |-
      Behoudens ten aanzien van voertuigen als bedoeld in artikel 4, onder 3 van [verordening (EEG) nr. 3820/85]
      (31985R3820) wordt in plaats van [artikel 5:10, tweede tot en met zevende lid, van de wet](onbekend), dit artikel
      toegepast.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.56
  - number: 2.5:6.2
    text: |-
      De bestuurder handelt overeenkomstig artikel 7, eerste en tweede lid, van [verordening (EEG) nr. 3820/85]
      (31985R3820).
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.56
  - number: 2.5:7.1
    text: |-
      In afwijking van de [artikelen 2.2:2][ref1] en [2.3:1][ref2] is dit artikel uitsluitend van toepassing op de
      werknemer die vervoer verricht waarop [verordening (EEG) nr. 3820/85](31985R3820) niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009386#Artikel2
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.57
    references:
      - id: ref1
        bwb_id: BWBR0009386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0009386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.5:7.2
    text: De werknemer verricht in elke periode van 13 achtereenvolgende weken ten hoogste gemiddeld 48 uren per week arbeid.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.57
  - number: 2.5:7.3
    text: |-
      Van het tweede lid kan met inachtneming van het vierde lid slechts bij collectieve regeling worden afgeweken. Elk
      beding waarbij op andere wijze dan in de vorige volzin is bepaald, wordt afgeweken van het eerste lid, is nietig.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.57
  - number: 2.5:7.4
    text: |-
      De werkgever organiseert de arbeid zodanig dat de werknemer in elke periode van 26 achtereenvolgende weken ten
      hoogste gemiddeld 48 uren per week arbeid verricht.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.57
  - number: 2.6:1.1
    text: 'Onze Ministers kunnen, indien daartoe gegronde redenen aanwezig zijn, vrijstelling verlenen van:'
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.61
  - number: 2.6:1.1.a
    text: artikel 2.5:4, vierde lid;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.61
  - number: 2.6:1.1.b
    text: |-
      de verplichting tot het installeren van een controlemiddel, voorzover dit niet in strijd is met [verordening (EEG)
      nr. 3820/85](31985R3820);
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.61
  - number: 2.6:1.1.c
    text: artikel 2.7:2.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.61
  - number: 2.6:1.2
    text: |-
      De vrijstelling, bedoeld in het eerste lid, onderdeel a, wordt niet verleend dan nadat de belanghebbende werkgevers
      of werkgeversorganisaties met volledige rechtsbevoegdheid en werknemersorganisaties met volledige rechtsbevoegdheid
      in de gelegenheid zijn gesteld hun zienswijze naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.61
  - number: 2.6:1.3
    text: |-
      De werkgever en de persoon, bedoeld in [artikel 2:7, eerste lid, van de wet][ref1], leven de aan de vrijstelling
      verbonden voorschriften na.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel2
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.61
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '2'
  - number: 2.7:1
    text: |-
      Het is de werkgever verboden een werknemer te belonen naar gelang van de afgelegde afstand of de hoeveelheid
      vervoerde goederen, tenzij deze beloningen de verkeersveiligheid niet in gevaar kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.71
  - number: 2.7:2.1
    text: |-
      De bestuurder van een bus en de bestuurder van een vrachtauto met een toegestaan maximumgewicht van meer dan 7500
      kg, die geboren zijn na 30 juni 1955, hebben een door Onze Ministers erkend getuigschrift van vakbekwaamheid, of
      een gewaarmerkt afschrift daarvan, bij zich, waaruit blijkt dat zij met goed gevolg een opleiding voor bestuurder
      van een autobus, onderscheidenlijk van een vrachtauto, hebben gevolgd.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.72
  - number: 2.7:2.2
    text: |-
      De werkgever ziet toe op het bezit van het in het eerste lid bedoelde getuigschrift of het gewaarmerkte afschirft
      daarvan.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.72
  - number: 2.7:3
    text: |-
      Onze Ministers worden aangewezen als de bevoegde autoriteit, bedoeld in artikel 5, tweede lid, onder b, van
      [verordening (EEG) nr. 3820/85](31985R3820).
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.73
  - number: 2.7:4.1
    text: 'De werkgever mag een jeugdige werknemer als bijrijder arbeid doen verrichten indien:'
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.74
  - number: 2.7:4.1.a
    text: |-
      deze in het bezit is van een verklaring, afgegeven door de Stichting Landelijk Orgaan Beroepsonderwijs, Transport
      en Logistiek, waaruit blijkt dat hij aldaar is ingeschreven als leerling, en
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.74
  - number: 2.7:4.1.b
    text: het vervoer geheel in Nederland wordt verricht.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.74
  - number: 2.7:4.2
    text: De werkgever ziet toe op het bezit van de in het eerste lid, onderdeel a, bedoelde verklaring.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel2.74
  - number: 3.1:1
    text: |-
      Dit hoofdstuk is van toepassing op werknemers van 18 jaar of ouder, die voor een spoorwegonderneming als bedoeld
      in de [Spoorwegwet][ref1], arbeid verrichten in of op een spoorvoertuig, gebezigd in verband met vervoer over
      hoofdspoorwegen of lokale spoorwegen, alsmede de daarop aansluitende bijzondere spoorwegen.


      [ref1]: https://wetten.overheid.nl/BWBR0001848
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0001848
  - number: 3.2:1.1
    text: Dit artikel is uitsluitend van toepassing op arbeid verricht in verband met het vervoer van personen.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel3.21
  - number: 3.2:1.2
    text: In afwijking van artikel 5:8, derde lid, onderdeel d, van de wet kan dit artikel worden toegepast.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel3.21
  - number: 3.2:1.3
    text: |-
      De werkgever organiseert de arbeid zodanig, dat de werknemer die arbeid verricht in nachtdienst na een reeks van
      ten minste 3 en ten hoogste 7 maal achtereen arbeid te hebben verricht in nachtdienst, een onafgebroken rusttijd
      heeft van ten minste 48 uren, welke rusttijd in elke periode van 13 achtereenvolgende weken ten hoogste 4 maal mag
      worden ingekort met 1 uur.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel3.21
  - number: 3.2:2.1
    text: Dit artikel is uitsluitend van toepassing op arbeid verricht in verband met het vervoer van goederen.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel3.22
  - number: 3.2:2.2
    text: In afwijking van artikel 5:8, derde lid, onderdeel b, onder 2°, van de wet kan dit artikel worden toegepast.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel3.22
  - number: 3.2:2.3
    text: |-
      De werkgever organiseert de arbeid zodanig, dat de werknemer die arbeid verricht in nachtdienst ten hoogste 42 maal
      in elke periode van 13 achtereenvolgende weken en 140 maal in elke periode van 52 achtereenvolgende weken arbeid in
      nachtdienst verricht.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel3.22
  - number: 4.1:1
    text: 'In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.11
  - number: 4.1:1.a
    text: |-
      *lid van het cockpitpersoneel:* de werknemer van 18 jaar of ouder die aan boord van een luchtvaartuig werkzaamheden
      heeft te verrichten die van direct belang zijn voor de bediening van het luchtvaartuig tijdens de vlucht;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.11
  - number: 4.1:1.b
    text: |-
      *lid van het cabinepersoneel:* de werknemer van 18 jaar of ouder die, niet zijnde lid van het cockpitpersoneel,
      aan boord van een luchtvaartuig enige werkzaamheden heeft te verrichten ten behoeve van de inzittenden dan wel als
      dierenbegeleider werkzaam is tijdens de vlucht;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.11
  - number: 4.1:1.c
    text: '*lid van het boordpersoneel:* lid van het cockpitpersoneel en cabinepersoneel.'
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.11
  - number: 4.1:2
    text: 'In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.12
  - number: 4.1:2.a
    text: |-
      *vliegwerktijd:* de periode van het ogenblik af, waarop een lid van het boordpersoneel zich dient te melden voor de
      uitoefening van zijn functie tot het einde van zijn werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.12
  - number: 4.1:2.b
    text: '*werktijd:*de som van de vliegwerktijd en de luchthavenreservetijd;'
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.12
  - number: 4.1:2.c
    text: |-
      *reservetijd:*een periode waarin een lid van het boordpersoneel niet voor een vlucht is ingedeeld en niet verplicht
      is op de luchthaven aanwezig te zijn, maar wel beschikbaar dient te zijn voor het ontvangen van een opdracht tot
      het uitvoeren van enige verkeersvlucht;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.12
  - number: 4.1:2.d
    text: |-
      *luchthavenreservetijd:* een periode waarin een lid van het boordpersoneel niet voor een vlucht is ingedeeld, maar
      wel verplicht is op de luchthaven aanwezig te zijn voor het ontvangen van een opdracht tot het uitvoeren van enige
      verkeersvlucht;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.12
  - number: 4.1:2.e
    text: |-
      *rusttijd:*elke periode buiten de vliegwerktijd gedurende welke een lid van het boordpersoneel is ontheven van alle
      taken en opdrachten, en daarin de gelegenheid heeft om rust te genieten in een passende accommodatie;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.12
  - number: 4.1:2.f
    text: '*grondtijd:* elke periode van de vliegwerktijd die geen deel uitmaakt van een vlucht;'
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.12
  - number: 4.1:2.g
    text: |-
      *rustgelegenheid:*de deugdelijke accommodatie aan boord van het luchtvaartuig, die het mogelijk maakt voor een lid
      van het boordpersoneel horizontale rust te genieten in een van de passagiers en hinderlijke vracht afgescheiden
      ruimte.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.12
  - number: 4.1:3
    text: 'In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.13
  - number: 4.1:3.a
    text: |-
      *vlieguren:* de periode van het ogenblik af dat een vleugelvliegtuig zijn vliegtuigopstelplaats verlaat, met de
      bedoeling om op te stijgen, tot het ogenblik dat het vleugelvliegtuig na de vlucht tot stilstand komt op de gekozen
      of aangewezen vliegtuigopstelplaats en de motoren zijn afgezet;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.13
  - number: 4.1:3.b
    text: |-
      *vliegtijd:* de periode van het ogenblik af dat het hefschroefvliegtuig zich op eigen kracht voortbeweegt tot het
      ogenblik waarop de hefschroef of hefschroeven tot stilstand komt of komen;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.13
  - number: 4.1:3.c
    text: '*verkeersvlucht:* een vlucht die vervoer door een luchtvaartmaatschappij ten doel heeft;'
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.13
  - number: 4.1:3.d
    text: |-
      *rondvlucht:*een verkeersvlucht welke aanvangt en eindigt op hetzelfde terrein en welke een tijdsduur heeft van ten
      hoogste 60 minuten;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.13
  - number: 4.1:3.e
    text: |-
      *luchtarbeid:*werkzaamheden uitgevoerd door een lid van het boordpersoneel tijdens de vlucht, niet zijnde een
      verkeersvlucht.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.13
  - number: 4.1:4
    text: 'In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.14
  - number: 4.1:4.a
    text: |-
      *luchtvaartmaatschappij:* onderneming, welke geheel of gedeeltelijk haar bedrijf maakt van het vervoer van
      personen, dieren of goederen met luchtvaartuigen tegen vergoeding;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.14
  - number: 4.1:4.b
    text: |-
      *luchtvaartuig:* een toestel als bedoeld in [artikel 1, onderdeel b, van de Luchtvaartwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel1
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.14
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '1'
  - number: 4.1:4.c
    text: |-
      *dag:*een periode van 00.00 uur tot 24.00 uur Universal Time Coordinated voor vleugelvliegtuigen en van 00.00 uur
      tot 24.00 uur lokale tijd voor hefschroefvliegtuigen;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.14
  - number: 4.1:4.d
    text: |-
      *luchthaven:*een terrein, dat is ingericht voor het opstijgen en het landen alsmede de daarmede verband houdende
      beweging op dat terrein van luchtvaartuigen.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.14
  - number: 4.2:1
    text: |-
      Artikel 4.3 en [hoofdstuk 5][ref1] van de wet en de daarop berustende bepalingen zijn niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.21
    references:
      - id: ref1
        bwb_id: BWBR0009386
        hoofdstuk: '5'
  - number: 4.2:1.a
    text: |-
      arbeid, verricht door een lid van het boordpersoneel van 18 jaar of ouder dat vluchten, niet zijnde
      verkeersvluchten maakt ten behoeve van het eigen bedrijf, of van de overheid;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.21
  - number: 4.2:1.b
    text: luchtarbeid, verricht door een lid van het boordpersoneel van 18 jaar of ouder;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.21
  - number: 4.2:1.c
    text: |-
      arbeid, verricht door een lid van het cabinepersoneel van 18 jaar of ouder van hefschroefvliegtuigen dat
      verkeersvluchten maakt;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.21
  - number: 4.2:1.d
    text: arbeid, verricht door personen van 18 jaar of ouder aan boord van luchtvaartuigen, niet zijnde boordpersoneel.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.21
  - number: 4.2:2
    text: |-
      [Paragraaf 5.1][ref1] en – voorzover aangeduid als strafbare feiten – de
      [paragrafen 5.2 tot en met 5.5 van de wet][ref2] en de daarop berustende bepalingen zijn van overeenkomstige
      toepassing op een lid van het boordpersoneel dat geen werkgever of werknemer is in de zin van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Paragraaf5.1
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Paragraaf5.2
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.22
    references:
      - id: ref1
        bwb_id: BWBR0007671
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0007671
        paragraaf: '5.2'
  - number: 4.3:1
    text: |-
      Met uitsluiting van hetgeen in het [Arbeidstijdenbesluit][ref1] is bepaald, is dit hoofdstuk van toepassing op
      arbeid, verricht aan boord van luchtvaartuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0007687
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.31
    references:
      - id: ref1
        bwb_id: BWBR0007687
  - number: 4.4:1.1
    text: |-
      Elk lid van het boordpersoneel op verkeersvluchten met uitzondering van rondvluchten, houdt van zijn arbeids- en
      rusttijden een deugdelijke registratie bij of doet die bijhouden.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.41
  - number: 4.4:1.2
    text: |-
      Bij regeling van Onze Minister van Verkeer en Waterstaat worden nadere regels gesteld omtrent de wijze van
      registratie.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.41
  - number: 4.4:2
    text: |-
      De werkgever, de persoon, bedoeld in [artikel 4.2:2][ref1], en het lid van het boordpersoneel,
      bedoeld in [artikel 4.4:1, eerste lid][ref2], bewaren de gegevens en bescheiden met betrekking tot
      [artikel 4.4:1, eerste en tweede lid][ref3], en de in [artikel 4.3 van de wet][ref4] neergelegde
      registratieverplichting ten minste 52 weken, gerekend vanaf de datum waarop de desbetreffende gegevens en
      bescheiden betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009386#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0009386#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0007671#Artikel4
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.42
    references:
      - id: ref1
        bwb_id: BWBR0009386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0009386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.4'
      - id: ref3
        bwb_id: BWBR0009386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.4'
      - id: ref4
        bwb_id: BWBR0007671
        artikel: '4'
  - number: 4.5:1
    text: |-
      In plaats van [paragraaf 5.2][ref1] van de wet is deze paragraaf van toepassing op het lid van het cockpitpersoneel
      op verkeersvluchten van vleugelvliegtuigen, met uitzondering van rondvluchten.


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.51
    references:
      - id: ref1
        bwb_id: BWBR0009386
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 4.5:2.1
    text: |-
      De vliegwerktijd duurt tot ten minste 30 minuten na het beëindigen van de laatste vlucht in die periode, waarin het
      lid van het cockpitpersoneel als lid van het boordpersoneel optreedt.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.52
  - number: 4.5:2.2
    text: |-
      Als vliegwerktijd wordt tevens aangemerkt de tijdsduur van een door de werkgever gegeven opdracht, anders dan tot
      het als lid van het cockpitpersoneel maken van een verkeersvlucht.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.52
  - number: 4.5:2.3
    text: |-
      Indien een opdracht als bedoeld in het tweede lid het maken van één of meer opeenvolgende vluchten als passagier
      inhoudt, geldt als tijdsduur van deze opdracht de tijd vanaf het tijdstip van aanmelding voor de vlucht tot
      30 minuten na het beëindigen van de vlucht. [Artikel 4.5:3, eerste lid][ref1], is dan niet van toepassing, met
      uitzondering van correcties ten aanzien van de grondtijd.


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Artikel4
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.52
    references:
      - id: ref1
        bwb_id: BWBR0009386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: 4.5:2.4
    text: |-
      Bij opdrachten als bedoeld in het derde lid, is meerdere malen achtereen een bekorte rust als bedoeld in
      [artikel 4.5:9][ref1] toegestaan. Na afloop dient dan een rusttijd in acht te worden genomen, gelijk aan de normale
      minimale rusttijd, bedoeld in [artikel 4.5:6][ref2], vermeerderd met het totaal der bekortingen van de voorafgaande
      rusten ten opzichte van de normale minimale rusttijd.


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009386#Artikel4
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.52
    references:
      - id: ref1
        bwb_id: BWBR0009386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.5'
      - id: ref2
        bwb_id: BWBR0009386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: 4.5:2.5
    text: |-
      Indien de vliegwerktijd anders dan als lid van het cockpitpersoneel, gevolgd wordt door vliegwerktijd waarin men
      werkzaam is als cockpitpersoneel, zonder dat deze vliegwerktijden zijn gescheiden door ten minste één minimum
      rusttijd, is de maximum gecorrigeerde vliegwerktijd, bedoeld in [artikel 4.5:3][ref1], van toepassing. De
      vliegwerktijd wordt in dat geval geacht in te gaan bij aanvang van de opdracht anders dan tot het als lid van het
      cockpitpersoneel maken van een verkeersvlucht.


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Artikel4
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.52
    references:
      - id: ref1
        bwb_id: BWBR0009386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: 4.5:2.6
    text: |-
      Indien de vliegwerktijd waarin men werkzaam is als cockpitpersoneel wordt gevolgd door vliegwerktijd anders dan als
      lid van het cockpitpersoneel, zonder dat deze vliegwerktijden zijn gescheiden door ten minste één minimum rusttijd,
      zijn de maximum gecorrigeerde vliegwerktijden, genoemd in [bijlage B, tabel A, onder III][ref1], van toepassing.
      Ten aanzien van de periode dat men werkzaam is als cockpitpersoneel, dient ten aanzien van de maximum gecorrigeerde
      vliegwerktijd te worden voldaan aan [artikel 4.5:3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009386
      [ref2]: https://wetten.overheid.nl/BWBR0009386#Artikel4
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.52
    references:
      - id: ref1
        bwb_id: BWBR0009386
      - id: ref2
        bwb_id: BWBR0009386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: 4.5:3.1
    text: |-
      In [bijlage A][ref1] behorend bij dit besluit wordt de wijze van berekening vastgesteld van de vliegwerktijd en van
      de wijze waarop de gecorrigeerde vliegwerktijd daarvan wordt afgeleid onder toepassing van de volgende correcties:


      [ref1]: https://wetten.overheid.nl/BWBR0009386
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.53
    references:
      - id: ref1
        bwb_id: BWBR0009386
  - number: 4.5:3.1.a
    text: voor landingen onder verschillende weersomstandigheden en met vliegtuigen met een verschillende startmassa,
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.53
  - number: 4.5:3.1.b
    text: het aantal landingen,
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.53
  - number: 4.5:3.1.c
    text: voor andere verzwarende omstandigheden dan bedoeld in de onderdelen a en b, en
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.53
  - number: 4.5:3.1.d
    text: . voor grondtijd.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.53
  - number: 4.5:3.2
    text: |-
      In [bijlage B][ref1] behorend bij dit besluit worden de tabellen vastgesteld volgens welke de maximum gecorrigeerde
      vliegwerktijd wordt bepaald, afhankelijk van:


      [ref1]: https://wetten.overheid.nl/BWBR0009386
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.53
    references:
      - id: ref1
        bwb_id: BWBR0009386
  - number: 4.5:3.2.a
    text: |-
      het tijdstip van aanvang van de vliegwerktijd uitgedrukt in lokale tijd van de luchthaven waar de vliegwerktijd
      aanvangt,
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.53
  - number: 4.5:3.2.b
    text: of de oproep tot aanmelding voor de vliegwerktijd valt in een reservetijd,
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.53
  - number: 4.5:3.2.c
    text: de mogelijkheden om af te lossen,
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.53
  - number: 4.5:3.2.d
    text: om in geval van aflossing van een rustgelegenheid, dan wel van een zitplaats in de cabine, gebruik te maken, en
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.53
  - number: 4.5:3.2.e
    text: de lengte van de eventuele voorafgaande bekorte rust.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.53
  - number: 4.5:3.3
    text: De werkgever organiseert de arbeid in overstemming met het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.53
  - number: 4.5:4
    text: 'De werkgever organiseert de arbeid zodanig dat voor een werkend lid van het cockpitpersoneel:'
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.54
  - number: 4.5:4.a
    text: |-
      de werktijd niet meer dan 2000 uur per jaar bedraagt en zo gelijk mogelijk over het kalenderjaar wordt verspreid,
      en
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.54
  - number: 4.5:4.b
    text: |-
      het aantal vlieguren in een aaneengesloten periode van 30 dagen maximaal 120, per kalenderkwartaal maximaal 320 en
      per kalenderjaar maximaal 900 bedraagt.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.54
  - number: 4.5:5.1
    text: 'De werkgever organiseert de arbeid zodanig dat:'
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.55
  - number: 4.5:5.1.a
    text: een reservetijd ten hoogste 12 uren bedraagt;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.55
  - number: 4.5:5.1.b
    text: gedurende ten minste 8 uren na een reservetijd geen nieuwe reservetijd aanvangt.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.55
  - number: 4.5:5.2
    text: |-
      Op een opdracht gegeven voor de aanvang van een reservetijd tot het uitvoeren van een vliegwerktijd waarvan
      het tijdstip van aanmelding ligt binnen 8 uren na afloop van die reservetijd is voor de bepaling van de maximum
      gecorrigeerde vliegwerktijd [artikel 4.5:3, eerste en tweede lid][ref1], van toepassing. De opdracht wordt
      dan gezien als een opdracht die is ontvangen op het tijdstip, onmiddellijk voorafgaand aan het einde van de
      reservetijd.


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Artikel4
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.55
    references:
      - id: ref1
        bwb_id: BWBR0009386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: 4.5:5.3
    text: |-
      Indien het aanvangstijdstip van een vliegwerktijd wordt opgeschort, wordt de tijd tussen het oorspronkelijke
      meldingstijdstip en het werkelijke meldingstijdstip aangemerkt als reservetijd en zijn de correcties, bedoeld in
      het tweede lid, daarop van toepassing.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.55
  - number: 4.5:6.1
    text: |-
      In [bijlage C][ref1] behorend bij dit besluit, wordt de tabel vastgesteld volgens welke de normale minimum
      rusttijd, afhankelijk van de duur van de voorafgaande gecorrigeerde vliegwerktijd, wordt bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0009386
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.56
    references:
      - id: ref1
        bwb_id: BWBR0009386
  - number: 4.5:6.2
    text: De werkgever organiseert de arbeid in overeenstemming met het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.56
  - number: 4.5:7.1
    text: Drie opeenvolgende rustperiodes bedragen tezamen ten minste 36 uren.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.57
  - number: 4.5:7.2
    text: |-
      Een lid van het cockpitpersoneel heeft een onafgebroken rusttijd van ten minste 36 uren in elke aaneengesloten
      periode van 7 dagen, hetzij een onafgebroken rusttijd van ten minste 48 uren in elke aaneengesloten periode van
      10 dagen.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.57
  - number: 4.5:7.3
    text: |-
      Indien een lid van het cockpitpersoneel in een aaneengesloten periode van 8 dagen ten minste 128 uren rust heeft
      genoten, kan van het tweede lid worden afgeweken, mits hij in de aaneengesloten periode van 7 dagen volgend op
      de afwijking een onafgebroken rusttijd heeft van ten minste 72 uren. Afwijkingen als bedoeld in de vorige volzin
      worden niet direct achter elkaar toegepast.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.57
  - number: 4.5:7.4
    text: Bij toepassing van het tweede en derde lid vangt een nieuwe periode aan zodra de bedoelde rust is genoten.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.57
  - number: 4.5:7.5
    text: |-
      De rustperiodes kunnen opschuiven, ten behoeve van een reis als niet-werkend bemanningslid in opdracht van een
      luchtvaartmaatschappij, tot het einde van een reis.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.57
  - number: 4.5:7.6
    text: De werkgever organiseert de arbeid in overeenstemming met het eerste tot en met vijfde lid.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.57
  - number: 4.5:8
    text: 'De werkgever organiseert de arbeid zodanig dat:'
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.58
  - number: 4.5:8.a
    text: |-
      een lid van het cockpitpersoneel in beginsel zodanig wordt ingedeeld dat de rusttijd in een aaneengesloten periode
      van 7 dagen ten minste 126 uur bedraagt;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.58
  - number: 4.5:8.b
    text: |-
      indien het lid van het cockpitpersoneel, in afwijking van onderdeel a, minder dan 18 uren per dag rust geniet, een
      periode van maximaal 15 dagen aanvangt, waarin [bijlage D][ref1] behorend bij dit besluit van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0009386
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.58
    references:
      - id: ref1
        bwb_id: BWBR0009386
  - number: 4.5:9.1
    text: Een normale minimum rusttijd van een lid van het cockpitpersoneel kan worden bekort tot niet minder dan 7,5 uur.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.59
  - number: 4.5:9.2
    text: |-
      Na een bekorte rust is de rusttijd van een lid van het cockpitpersoneel na de vliegwerktijd volgend op de bekorte
      rust, ten minste gelijk aan de normale minimum rusttijd volgens de tabel, bedoeld in [artikel 4.5:6][ref1],
      vermeerderd met de tijd waarmee de normale minimum rust is bekort.


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Artikel4
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.59
    references:
      - id: ref1
        bwb_id: BWBR0009386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: 4.5:9.3
    text: Een rusttijd van minder dan 7,5 uur geldt als grondtijd.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.59
  - number: 4.5:9.4
    text: |-
      In afwijking van het tweede lid, kan een rust van een lid van het cockpitpersoneel meerdere malen achtereen worden
      bekort indien de vliegwerktijd bestaat uit opdrachten als bedoeld in [artikel 4.5:2, derde lid][ref1]. In dat geval
      wordt na afloop van de opdrachten een rusttijd genoten, die gelijk is aan de normale minimum rusttijd, vermeerderd
      met het totaal der bekortingen van de voorafgaande rustperiodes ten opzichte van de normale rust.


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Artikel4
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.59
    references:
      - id: ref1
        bwb_id: BWBR0009386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: 4.5:9.5
    text: De werkgever organiseert de arbeid in overeenstemming met het eerste tot en met vierde lid.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.59
  - number: 4.5:9a
    text: |-
      De werkgever deelt de arbeid van een lid van het cockpitpersoneel zodanig in, dat een lid van het cockpitpersoneel,
      onverminderd zijn aanspraak op vakantiedagen maar met inbegrip van eventuele rusttijd, ten minste 7 dagen in elke
      kalendermaand en ten minste 96 dagen in elk kalenderjaar op de standplaats heeft, welke vrij zijn van vliegwerktijd
      en reservetijd. In afwijking van het bepaalde in artikel 4.1:4, onder c, wordt in dit artikel onder «dag» verstaan
      een periode van 00.00 uur tot 24.00 uur lokale tijd.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.59a
  - number: 4.5:10.1
    text: De werkgever maakt een planning voor de vliegwerktijd.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.510
  - number: 4.5:10.2
    text: |-
      Bij de planning van een vliegwerktijd neemt de werkgever een verantwoorde marge in acht ten opzichte van de maximum
      gecorrigeerde vliegwerktijd, berekend volgens [artikel 4.5:3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Artikel4
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.510
    references:
      - id: ref1
        bwb_id: BWBR0009386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: 4.5:10.3
    text: |-
      Indien de maximum gecorrigeerde vliegwerktijd ten minste 14 en ten hoogste 16 uren bedraagt, bedraagt deze marge
      ten minste 1,5 uur. Indien de maximum gecorrigeerde vliegwerktijd meer dan 16 uren bedraagt, bedraagt deze marge
      ten minste 2 uren.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.510
  - number: 4.5:10.4
    text: |-
      Bij optredende afwijkingen van de oorspronkelijke planning kan bij het opzetten van de nieuwe planning van de in
      het derde lid genoemde marges worden afgeweken, indien na afweging van alle belangen het verantwoord wordt geacht
      een kleinere marge in acht te nemen.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.510
  - number: 4.5:10.5
    text: Afwijkingen als bedoeld in het vierde lid worden terstond aan de Minister van Verkeer en Waterstaat gemeld.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.510
  - number: 4.5:10.6
    text: De planning eindigt bij de aanvang van de vliegwerktijd.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.510
  - number: 4.5:11
    text: |-
      Indien een lid van het cockpitpersoneel geen opdracht tot het verrichten van werkzaamheden met betrekking tot
      het uitvoeren van een verkeersvlucht behoeft te verwachten en de werkgever onverwacht een opdracht geeft tot het
      verrichten van deze werkzaamheden en deze werkzaamheden dienen aan te vangen binnen 10 uren nadat dit aan het lid
      van het cockpitpersoneel is medegedeeld, behoeft hij deze opdracht slechts te aanvaarden voor zover deze een door
      hem zelf te bepalen tijdsduur binnen de grenzen van dit besluit niet overschrijdt.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.511
  - number: 4.6:1
    text: |-
      In plaats van [paragraaf 5.2][ref1] van de wet is deze paragraaf van toepassing op het lid van het cabinepersoneel
      op verkeersvluchten van vleugelvliegtuigen, met uitzondering van rondvluchten.


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.61
    references:
      - id: ref1
        bwb_id: BWBR0009386
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 4.6:2.1
    text: |-
      [Artikel 4.5:2][ref1] is van overeenkomstige toepassing op het lid van het cabinepersoneel op verkeersvluchten met
      dien verstande dat daar waar wordt verwezen naar [artikel 4.5:3][ref2], gelezen moet worden [artikel 4.6:3][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009386#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0009386#Artikel4
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.62
    references:
      - id: ref1
        bwb_id: BWBR0009386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.5'
      - id: ref2
        bwb_id: BWBR0009386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.5'
      - id: ref3
        bwb_id: BWBR0009386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.6'
  - number: 4.6:2.2
    text: |-
      In afwijking van het eerste lid, vangt de vliegwerktijd van een lid van het cabinepersoneel dat werkzaam is
      als dierenbegeleider, aan twee uur voor het begin van een vlucht waarin dat lid van het cabinepersoneel als
      dierenbegeleider werkzaam is, en eindigt deze twee uur na het beëindigen van die vlucht.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.62
  - number: 4.6:3.1
    text: |-
      In [bijlage E][ref1] behorend bij dit besluit wordt de wijze van berekening vastgesteld van de vliegwerktijd en
      van de wijze waarop de gecorrigeerde vliegwerktijd voor het lid van het cabinepersoneel op verkeersvluchten daarvan
      wordt afgeleid onder toepassing van de volgende correcties:


      [ref1]: https://wetten.overheid.nl/BWBR0009386
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.63
    references:
      - id: ref1
        bwb_id: BWBR0009386
  - number: 4.6:3.1.a
    text: het aantal landingen,
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.63
  - number: 4.6:3.1.b
    text: andere verzwarende omstandigheden, en
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.63
  - number: 4.6:3.1.c
    text: grondtijd.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.63
  - number: 4.6:3.2
    text: |-
      In [bijlage F][ref1] behorend bij dit besluit worden de tabellen en wijzen van berekening vastgesteld volgens welke
      de maximum gecorrigeerde vliegwerktijd wordt bepaald afhankelijk van:


      [ref1]: https://wetten.overheid.nl/BWBR0009386
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.63
    references:
      - id: ref1
        bwb_id: BWBR0009386
  - number: 4.6:3.2.a
    text: |-
      het tijdstip van aanvang van de vliegwerktijd uitgedrukt in lokale tijd van de luchthaven waar de vliegwerktijd
      aanvangt,
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.63
  - number: 4.6:3.2.b
    text: of de oproep tot aanmelding voor de vliegwerktijd valt in een reservetijd;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.63
  - number: 4.6:3.2.c
    text: de mogelijkheid om af te lossen,
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.63
  - number: 4.6:3.2.d
    text: om in geval van aflossing van een rustgelegenheid, dan wel van een zitplaats in de cabine, gebruik te maken,
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.63
  - number: 4.6:3.2.e
    text: de lengte van de eventuele voorafgaande bekorte rust, en
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.63
  - number: 4.6:3.2.f
    text: het aan- en afmeldingstijdstip.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.63
  - number: 4.6:3.3
    text: De werkgever organiseert de arbeid in overeenstemming met het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.63
  - number: 4.6:4.1
    text: |-
      [de artikelen 4.5:4 tot en met 4.5:10][ref1] zijn van overeenkomstige toepassing op het lid van
      het cabinepersoneel op verkeersvluchten met dien verstande dat in [de artikelen 4.5:5][ref2] en
      [4.5:10][ref3] voor «[artikel 4.5.3][ref4]» wordt gelezen: [artikel 4.6.3][ref5], en dat ten aanzien van
      [artikel 4.5.4, onderdeel b][ref6], alleen het maximum per kalenderjaar van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009386#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0009386#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0009386#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0009386#Artikel4
      [ref6]: https://wetten.overheid.nl/BWBR0009386#Artikel4
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.64
    references:
      - id: ref1
        bwb_id: BWBR0009386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.5'
      - id: ref2
        bwb_id: BWBR0009386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.5'
      - id: ref3
        bwb_id: BWBR0009386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.5'
      - id: ref4
        bwb_id: BWBR0009386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.5'
      - id: ref5
        bwb_id: BWBR0009386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.6'
      - id: ref6
        bwb_id: BWBR0009386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: 4.6:4.2
    text: De werkgever organiseert de arbeid in overeenstemming met het eerste lid.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.64
  - number: 4.6:5
    text: |-
      In de omstandigheid dat een lid van het cabinepersoneel geen opdracht tot het verrichten van werkzaamheden met
      betrekking tot het uitvoeren van een verkeersvlucht behoeft te verwachten en de werkgever onverwacht een opdracht
      geeft tot het verrichten van deze werkzaamheden en deze werkzaamheden dienen aan te vangen binnen 10 uren nadat
      dit aan het lid van het cabinepersoneel is medegedeeld, houdt de werkgever bij het vaststellen van de aard en de
      tijdsduur van die opdracht rekening met het onverwachte karakter van die opdracht.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.65
  - number: 4.7:1
    text: |-
      In plaats van [paragraaf 5.2][ref1] van de wet is deze paragraaf van toepassing op het lid van het boordpersoneel
      op rondvluchten.


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.71
    references:
      - id: ref1
        bwb_id: BWBR0009386
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 4.7:2.1
    text: |-
      De werkgever ontwerpt regels ten aanzien van de arbeids- en rusttijden voor elk lid van het boordpersoneel
      op rondvluchten. Deze regels zijn zodanig dat de veiligheid van de vlucht niet in gevaar wordt gebracht door
      vermoeidheid, optredende, hetzij tijdens een vlucht, hetzij tijdens een serie vluchten, hetzij tijdens een bepaalde
      periode.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.72
  - number: 4.7:2.2
    text: Deze regels worden ter instemming aan Onze Minister van Verkeer en Waterstaat en aan Onze Minister voorgelegd.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.72
  - number: 4.7:2.3
    text: |-
      De werkgever organiseert de arbeid in overeenstemming met de regels waarvoor Onze Minister van Verkeer en
      Waterstaat en Onze Minister instemming hebben gegeven.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.72
  - number: 4.8:1
    text: |-
      In plaats van [paragraaf 5.2][ref1] van de wet is deze paragraaf van toepassing op het lid van het cockpitpersoneel
      op verkeersvluchten van hefschroefvliegtuigen, met uitzondering van rondvluchten.


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.81
    references:
      - id: ref1
        bwb_id: BWBR0009386
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 4.8:2
    text: |-
      In deze paragraaf en de daarop berustende bepalingen wordt onder «landing» verstaan: een nadering, gevolgd door het
      tot stilstand op een landingsplaats hetzij in een hovervlucht brengen van een hefschroefvliegtuig met:
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.82
  - number: 4.8:2.1°
    text: 'het doel:'
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.82
  - number: 4.8:2.1°.a
    text: |-
      het embarkeren of debarkeren van passagier(s) dan wel bemanningslid(leden) al dan niet door middel van een
      hijsinstallatie;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.82
  - number: 4.8:2.1°.b
    text: het in- of uitladen van vracht;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.82
  - number: 4.8:2.1°.c
    text: het aan- of afhaken van een uitwendige lading;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.82
  - number: 4.8:2.1°.d
    text: het innemen van brandstof,
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.82
  - number: 4.8:2.2°
    text: het doel de vlucht te beëindigen door de rotor(en) tot stilstand te brengen of de motor(en) te stoppen.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.82
  - number: 4.8:3.1
    text: |-
      De vliegwerktijd wordt geacht te duren tot ten minste 15 minuten na het beëindigen van de laatste vlucht in de
      periode, waarin het lid van het cockpitpersoneel als zodanig optreedt.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.83
  - number: 4.8:3.2
    text: |-
      Als vliegwerktijd wordt tevens aangemerkt de tijdsduur van een door de werkgever gegeven opdracht, anders dan tot
      het als lid van het cockpitpersoneel maken van een vlucht.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.83
  - number: 4.8:3.3
    text: |-
      Indien een opdracht als bedoeld in het tweede lid het maken van één of meer opeenvolgende vluchten als passagier of
      als niet-werkend bemanningslid inhoudt:
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.83
  - number: 4.8:3.3.a
    text: |-
      geldt als tijdsduur van deze opdracht de tijd vanaf het tijdstip van aanmelding voor de eerste vlucht tot 15
      minuten na het beëindigen van de laatste vlucht,
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.83
  - number: 4.8:3.3.b
    text: |-
      zijn de normen bedoeld in [artikel 4.8:6, eerste en tweede lid][ref1], en de correcties, bedoeld in de in
      [bijlage G][ref2] behorende bij dit besluit onder VII bedoelde verzwarende omstandigheden niet van toepassing,


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009386
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.83
    references:
      - id: ref1
        bwb_id: BWBR0009386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.8'
      - id: ref2
        bwb_id: BWBR0009386
  - number: 4.8:3.3.c
    text: |-
      is het toegestaan, meerdere malen achtereen een bekorte rust, als bedoeld in [artikel 4.8:10][ref1], toe
      te passen, mits na afloop een rusttijd in acht wordt genomen, gelijk aan de normale minimum rust volgens
      [artikel 4.8:9][ref2], vermeerderd met het totaal van de bekortingen van de voorafgaande rusten ten opzichte van de
      normale minimum rust.


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009386#Artikel4
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.83
    references:
      - id: ref1
        bwb_id: BWBR0009386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.8'
      - id: ref2
        bwb_id: BWBR0009386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.8'
  - number: 4.8:4.1
    text: |-
      In [bijlage G][ref1] behorend bij dit besluit wordt de wijze van berekening vastgesteld van de maximum
      vliegwerktijd alsmede de tabel volgens welke de maximum vliegwerktijd wordt bepaald over de korte en lange termijn
      en de wijze waarop de gecorrigeerde vliegwerktijd van de vliegwerktijd wordt afgeleid door middel van de volgende
      correcties:


      [ref1]: https://wetten.overheid.nl/BWBR0009386
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.84
    references:
      - id: ref1
        bwb_id: BWBR0009386
  - number: 4.8:4.1.a
    text: verzwarende omstandigheden,
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.84
  - number: 4.8:4.1.b
    text: grondtijd zonder werkzaamheden, en
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.84
  - number: 4.8:4.1.c
    text: |-
      opdrachten anders dan opdrachten tot het als lid van het cockpitpersoneel maken van vluchten anders dan
      verkeersvluchten.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.84
  - number: 4.8:4.2
    text: |-
      De in [bijlage G][ref1] behorende bij dit besluit in tabel G genoemde maxima zijn slechts van toepassing indien
      de uitvoering van de in [artikel 4.8:3, tweede lid][ref2], bedoelde opdracht wordt gevolgd door een vliegwerktijd,
      waarin daadwerkelijk werkzaamheden als lid van het cockpitpersoneel ten behoeve van de uitvoering van een vlucht
      worden verricht, zonder dat deze zijn gescheiden door ten minste één rusttijd.


      [ref1]: https://wetten.overheid.nl/BWBR0009386
      [ref2]: https://wetten.overheid.nl/BWBR0009386#Artikel4
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.84
    references:
      - id: ref1
        bwb_id: BWBR0009386
      - id: ref2
        bwb_id: BWBR0009386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.8'
  - number: 4.8:4.3
    text: |-
      Ingevolge [artikel 4.8:10, derde lid][ref1], wordt de tabel vastgesteld volgens welke het maximum van de
      vliegwerktijd wordt bepaald na een bekorte rust met inachtneming van de aan de bekorte rust voorafgegane
      vliegwerktijd.


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Artikel4
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.84
    references:
      - id: ref1
        bwb_id: BWBR0009386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.8'
  - number: 4.8:4.4
    text: De werkgever organiseert de arbeid in overeenstemming met het eerste tot en met derde lid.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.84
  - number: 4.8:5.1
    text: |-
      De som van de vliegtijden binnen de vliegwerktijd bedraagt ten hoogste 9 uren of zoveel uren als bepaald
      overeenkomstig het tweede lid.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.85
  - number: 4.8:5.2
    text: |-
      In [bijlage H][ref1] behorend bij dit besluit wordt de reductie op de vliegtijd vastgesteld in verband met het
      aantal landingen binnen de vliegwerktijd, waarbij een landing tussen zonsondergang en zonsopgang wordt geteld als
      twee landingen.


      [ref1]: https://wetten.overheid.nl/BWBR0009386
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.85
    references:
      - id: ref1
        bwb_id: BWBR0009386
  - number: 4.8:5.3
    text: Een aaneengesloten vliegtijd bedraagt ten hoogste 4 uren.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.85
  - number: 4.8:5.4
    text: |-
      In afwijking van het derde lid wordt indien de geplande vliegtijd 4 tot 5 uur bedraagt, deze onderbroken door een
      pauze van ten minste 30 minuten.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.85
  - number: 4.8:5.5
    text: |-
      Indien, in afwijking van het derde lid, de geplande vliegtijd meer dan 5 uren bedraagt, wordt deze onderbroken door
      een pauze van ten minste 45 minuten of door twee pauzes van elk ten minste 30 minuten. De pauzes worden zo veel
      mogelijk gelijkmatig over de vliegwerktijd verdeeld.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.85
  - number: 4.8:5.6
    text: 'De maximum vliegtijd voor een lid van het cockpitpersoneel is:'
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.85
  - number: 4.8:5.6.a
    text: 33 uren per aaneengesloten periode van 7 dagen;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.85
  - number: 4.8:5.6.b
    text: 110 uren per maand;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.85
  - number: 4.8:5.6.c
    text: 900 uren per jaar.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.85
  - number: 4.8:5.7
    text: De werktijd bedraagt niet meer dan 2000 uur per jaar en wordt zo gelijk mogelijk over het kalenderjaar verspreid.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.85
  - number: 4.8:5.8
    text: De werkgever organiseert de arbeid in overeenstemming met het eerste tot en met het zevende lid.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.85
  - number: 4.8:6.1
    text: Binnen één vliegwerktijd worden maximaal 25 landingen tussen zonsondergang en zonsopgang gemaakt.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.86
  - number: 4.8:6.2
    text: |-
      In bijlage I behorend bij dit besluit wordt de tabel vastgesteld voor het maximum aantal landingen binnen één
      vliegwerktijd indien deze zowel landingen tussen zonsopgang en zonsondergang alsmede tussen zonsondergang en
      zonsopgang omvat.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.86
  - number: 4.8:6.3
    text: De werkgever organiseert de arbeid in overeenstemming met het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.86
  - number: 4.8:7.1
    text: |-
      De werkgever organiseert de arbeid zodanig dat bij de planning van de vliegwerktijd een verantwoorde marge in acht
      wordt genomen ten opzichte van de maximum vliegwerktijd en de vliegtijd.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.87
  - number: 4.8:7.2
    text: |-
      [Artikel 4.5:9a][ref1] en [artikel 4.5:11][ref2] zijn van overeenkomstige toepassing op het cockpitpersoneel van
      hefschroefvliegtuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009386#Artikel4
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.87
    references:
      - id: ref1
        bwb_id: BWBR0009386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.5'
      - id: ref2
        bwb_id: BWBR0009386
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: 4.8:8.1
    text: De werkgever organiseert de arbeid zodanig dat een reservetijd maximaal 12 uren bedraagt.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.88
  - number: 4.8:8.2
    text: |-
      Indien de tijd gelegen tussen de oproep tot aanmelding en het aanmeldingstijdstip minder bedraagt dan 8 uren wordt
      de tijd gelegen tussen de aanvang van de reservetijd en het aanmeldingstijdstip als reservetijd beschouwd.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.88
  - number: 4.8:8.3
    text: |-
      Indien de tijd gelegen tussen de oproep tot aanmelding en het aanmeldingstijdstip meer bedraagt dan 8 uren en het
      desbetreffende personeelslid wordt ontheven van de reserveverplichting dan wordt de tijd gelegen tussen de aanvang
      van de reservetijd en het tijdstip van oproep als reservetijd beschouwd.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.88
  - number: 4.8:8.4
    text: Tussen verschillende reservetijden zit ten minste een periode van 8 uren.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.88
  - number: 4.8:8.5
    text: De werkgever organiseert de arbeid in overeenstemming met het tweede tot en met vierde lid.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.88
  - number: 4.8:9.1
    text: De normale minimum rusttijd, voorafgaande aan een vliegwerktijd, bedraagt 12 uren.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.89
  - number: 4.8:9.2
    text: |-
      Een lid van het cockpitpersoneel van hefschroefvliegtuigen heeft in elke aaneengesloten periode van 7 dagen
      een aaneengesloten rusttijd van ten minste 36 uren dan wel in elke aaneengesloten periode van 10 dagen een
      aaneengesloten rusttijd van ten minste 48 uren.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.89
  - number: 4.8:9.3
    text: |-
      Indien in een aaneengesloten periode van 3 dagen de som van de vliegwerktijden meer dan 32 uren bedraagt, wordt één
      der tussenliggende normale minimum rusttijden genoten tussen 20.00 uur en 12.00 uur lokale tijd.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.89
  - number: 4.8:9.4
    text: De werkgever organiseert de arbeid in overeenstemming met het eerste tot en met derde lid.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.89
  - number: 4.8:10.1
    text: |-
      Een normale minimum rusttijd kan worden bekort tot niet minder dan 8 uren met dien verstande dat een bekorting met
      meer dan een uur ten hoogste eenmaal per aaneengesloten periode van 7 dagen plaats vindt.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.810
  - number: 4.8:10.2
    text: |-
      Na een bekorte rust is de rusttijd na de vliegwerktijd, volgend op de bekorte rust, ten minste gelijk aan de
      normale minimum rusttijd, vermeerderd met de tijd waarmee de normale minimum rusttijd is bekort.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.810
  - number: 4.8:10.3
    text: |-
      In bijlage J behorend bij dit besluit wordt de tabel vastgesteld volgens welke het maximum van de vliegwerktijd
      wordt bepaald na een bekorte rust met inachtneming van de aan de bekorte rust voorafgegane vliegwerktijd.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.810
  - number: 4.8:10.4
    text: Een rusttijd van minder dan 8 uren geldt als grondtijd.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.810
  - number: 4.8:10.5
    text: De werkgever organiseert de arbeid in overeenstemming met het eerste tot en met vierde lid.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.810
  - number: 4.9:1.1
    text: |-
      Onze Minister van Verkeer en Waterstaat kan ontheffing verlenen van [paragraaf 4.8][ref1] voor arbeid verricht
      door het lid van het boordpersoneel van hefschroefvliegtuigen, die gebruikt worden ten behoeve van het vervoer van
      traumateams voor spoedeisende medische hulpverlening.


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.91
    references:
      - id: ref1
        bwb_id: BWBR0009386
        hoofdstuk: '4'
        paragraaf: '4.8'
  - number: 4.9:1.2
    text: De werkgever leeft de aan de ontheffing verbonden voorschriften na.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.91
  - number: 4.10:1.1
    text: |-
      De gezagvoerder van een luchtvaartuig kan afwijken en kan een lid van het boordpersoneel opdragen af te wijken
      van de arbeids- en rusttijden om arbeid te verrichten indien dit noodzakelijk is in verband met de onmiddellijke
      veiligheid van de personen aan boord en het luchtvaartuig. Van deze afwijking wordt aantekening gehouden en wordt
      melding gemaakt bij Onze Minister van Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.101
  - number: 4.10:1.2
    text: |-
      Zodra de situatie, bedoeld in het eerste lid, voorbij is, zorgt de werkgever ervoor dat de werknemer die arbeid
      heeft verricht in een rustperiode, voldoende rusttijd ter compensatie krijgt.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel4.101
  - number: 5.1:1
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel5.11
  - number: 5.1:1.a
    text: |-
      *bemanningslid:* hetgeen daaronder wordt verstaan in
      [artikel 1, onderdeel b, van de Wet vaartijden en bemanningssterkte binnenvaart][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006029#Artikel1
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel5.11
    references:
      - id: ref1
        bwb_id: BWBR0006029
        artikel: '1'
  - number: 5.1:1.b
    text: '*jeugdig bemanningslid:* een bemanningslid van 16 of 17 jaar;'
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel5.11
  - number: 5.1:1.c
    text: |-
      rusttijd, exploitatiewijze A1, exploitatiewijze A2 en exploitatiewijze B: hetgeen daaronder wordt verstaan in
      [artikel 1, eerste lid, onderdelen q, r, s en t, van het Besluit vaartijden en bemanningssterkte binnenvaart][ref1]
      .


      [ref1]: https://wetten.overheid.nl/BWBR0007124#Artikel1
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel5.11
    references:
      - id: ref1
        bwb_id: BWBR0007124
        artikel: '1'
  - number: 5.1:2.1
    text: |-
      Voor de toepassing van dit hoofdstuk geldt de tijd waarop de arbeid van het bemanningslid zich beperkt tot de
      aanwezigheid op het schip, zonder dat hij zijn taken uitoefent, eveneens als rusttijd.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel5.12
  - number: 5.1:2.2
    text: |-
      In afwijking van het eerste lid worden niet als rusttijd aangemerkt de tijdsruimten waarin het bemanningslid niet
      vrijelijk over zijn tijd kan beschikken en zich gereed houdt tot een onmiddellijke aanvang der werkzaamheden, en
      waarbij het tijdstip van de aanvang en de duur van deze tijdsruimten niet vooraf bekend is.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel5.12
  - number: 5.2:1
    text: |-
      Artikel 4:3 en [hoofdstuk 5][ref1] van de wet en de daarop berustende bepalingen
      zijn niet van toepassing op arbeid, verricht op schepen als bedoeld in
      [artikel 4, onderdelen a, b, d, e, f en g, van de Wet vaartijden en bemanningssterkte binnenvaart][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0006029#Artikel4
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel5.21
    references:
      - id: ref1
        bwb_id: BWBR0009386
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0006029
        artikel: '4'
  - number: 5.2:2
    text: |-
      [Paragraaf 5.1][ref1] en – voorzover aangeduid als strafbare feiten – de [paragrafen 5.2 tot en met 5.5][ref2]
      en de daarop berustende bepalingen van de wet zijn van overeenkomstige toepassing op bemanningsleden die geen
      werkgever of werknemer zijn in de zin van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Paragraaf5.2
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel5.22
    references:
      - id: ref1
        bwb_id: BWBR0007671
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0007671
        paragraaf: '5.2'
  - number: 5.3:1.1
    text: |-
      Met uitsluiting van hetgeen in het [Arbeidstijdenbesluit][ref1] is bepaald, is dit hoofdstuk
      van toepassing op arbeid, verricht door een bemanningslid aan boord van schepen waarop de
      [Wet vaartijden en bemanningssterkte binnenvaart][ref2] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0007687
      [ref2]: https://wetten.overheid.nl/BWBR0006029
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel5.31
    references:
      - id: ref1
        bwb_id: BWBR0007687
      - id: ref2
        bwb_id: BWBR0006029
  - number: 5.3:1.2
    text: |-
      In afwijking van het eerste lid en met uitsluiting van hetgeen in het [Arbeidstijdenbesluit][ref1] is bepaald,
      is [paragraaf 6.6][ref2] van overeenkomstige toepassing op arbeid, verricht door bemanningsleden aan boord van
      de in dat lid bedoelde schepen gedurende de tijd dat dit schip dienst doet in havensleepdienst als bedoeld in
      [artikel 6.1:1, onderdeel b][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007687
      [ref2]: https://wetten.overheid.nl/BWBR0009386#Hoofdstuk6
      [ref3]: https://wetten.overheid.nl/BWBR0009386#Artikel6
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel5.31
    references:
      - id: ref1
        bwb_id: BWBR0007687
      - id: ref2
        bwb_id: BWBR0009386
        hoofdstuk: '6'
        paragraaf: '6.6'
      - id: ref3
        bwb_id: BWBR0009386
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 5.4:1.1
    text: |-
      De rusttijden van een bemanningslid worden geregistreerd overeenkomstig
      [artikel 27, eerste lid, van het Besluit vaartijden en bemanningssterkte binnenvaart][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007124#Artikel27
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel5.41
    references:
      - id: ref1
        bwb_id: BWBR0007124
        artikel: '27'
  - number: 5.4:1.2
    text: |-
      Het bepaalde in het eerste lid is niet van toepassing aan boord van schepen als bedoeld in
      [artikel 28, eerste lid, van het Besluit vaartijden en bemanningssterkte binnenvaart][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007124#Artikel28
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel5.41
    references:
      - id: ref1
        bwb_id: BWBR0007124
        artikel: '28'
  - number: 5.4:2
    text: |-
      De gezagvoerend schipper en de werkgever bewaren de gegevens en bescheiden met betrekking tot de registratie van de
      arbeidstijden van een bemanningslid ten minste 52 weken, gerekend vanaf de datum waarop de desbetreffende gegevens
      en bescheiden betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel5.42
  - number: 5.5:1
    text: |-
      In plaats van [paragraaf 5.2][ref1] van de wet wordt deze paragraaf toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel5.51
    references:
      - id: ref1
        bwb_id: BWBR0009386
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 5.5:2
    text: |-
      Voor de toepassing van [de artikelen 5.5:3 tot en met 5.5:5][ref1] wordt rekening gehouden met de rust- en
      vaartijden, vervuld gedurende een tijdvak van 48 uren, onmiddellijk voorafgaand aan het tijdstip waarop het schip
      de binnenwateren is binnengevaren.


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Artikel5
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel5.52
    references:
      - id: ref1
        bwb_id: BWBR0009386
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.5'
  - number: 5.5:3.1
    text: |-
      Een bemanningslid dat arbeid verricht bij exploitatiewijze A1, heeft een ononderbroken rusttijd van ten minste 8
      uren in een aaneengesloten tijdruimte van 24 uren, te rekenen vanaf het einde van iedere ononderbroken rusttijd van
      ten minste 8 uren.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel5.53
  - number: 5.5:3.2
    text: De in het eerste lid bedoelde rusttijd is gelegen buiten de vaartijd.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel5.53
  - number: 5.5:4.1
    text: |-
      Een bemanningslid dat arbeid verricht bij exploitatiewijze A2, heeft een rusttijd van ten minste 8 uren, waarvan
      ten minste 6 uren ononderbroken in een aaneengesloten tijdruimte van 24 uren, te rekenen vanaf het einde van iedere
      ononderbroken rusttijd van ten minste 6 uren.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel5.54
  - number: 5.5:4.2
    text: De in het eerste lid bedoelde ononderbroken rusttijd is gelegen buiten de vaartijd.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel5.54
  - number: 5.5:5
    text: |-
      Een bemanningslid dat arbeid verricht bij exploitatiewijze B, heeft een rusttijd van ten minste 24 uren, waarvan
      ten minste tweemaal 6 uren ononderbroken, in een aaneengesloten tijdruimte van 48 uren, te rekenen vanaf het begin
      van een rusttijd van ten minste 6 uren.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel5.55
  - number: 5.5:6.1
    text: |-
      In afwijking van [artikel 5.2:2][ref1] is dit artikel uitsluitend van toepassing op bemanningsleden die werknemer
      zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Artikel5
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel5.56
    references:
      - id: ref1
        bwb_id: BWBR0009386
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 5.5:6.2
    text: |-
      Een bemanningslid verricht in elke periode van 13 achtereenvolgende weken ten hoogste gemiddeld 48 uren per week
      arbeid.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel5.56
  - number: 5.5:6.3
    text: |-
      Van het tweede lid kan, met inachtneming van het derde lid, slechts bij collectieve regeling worden afgeweken. Elk
      beding waarbij op andere wijze dan in de vorige volzin is bepaald, wordt afgeweken van het tweede lid, is nietig.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel5.56
  - number: 5.5:6.4
    text: |-
      De werkgever en de gezagvoerend schipper organiseren de arbeid zodanig dat een bemanningslid in elke periode van 52
      achtereenvolgende weken ten hoogste gemiddeld 48 uren per week arbeid verricht.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel5.56
  - number: 5.5:7.1
    text: 'De werkgever en de gezagvoerend schipper organiseren de arbeid zodanig dat het jeugdige bemanningslid:'
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel5.57
  - number: 5.5:7.1.a
    text: |-
      bij exploitatiewijzen A1 en A2 in elke periode van 24 uren een rusttijd geniet, die inclusief de in het vierde lid
      bedoelde pauze ten minste 16 uren bedraagt, waarvan ten minste 12 uren ononderbroken;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel5.57
  - number: 5.5:7.1.b
    text: |-
      bij exploitatiewijze B in elke periode van 24 uren een rusttijd geniet, die inclusief de in het vierde lid bedoelde
      pauze ten minste 16 uren bedraagt, waarvan ten minste tweemaal 6 uren ononderbroken.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel5.57
  - number: 5.5:7.2
    text: 'De werkgever en de gezagvoerend schipper organiseren de arbeid zodanig dat het jeugdige bemanningslid:'
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel5.57
  - number: 5.5:7.2.a
    text: hetzij een wekelijkse rusttijd heeft van ten minste 2 dagen, waarin de zondag is begrepen;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel5.57
  - number: 5.5:7.2.b
    text: hetzij een wekelijkse ononderbroken rusttijd heeft van ten minste 36 uren, waarin de zondag is begrepen;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel5.57
  - number: 5.5:7.2.c
    text: |-
      hetzij, ingeval van een reis van meer dan 5 dagen, in elke periode van 10 weken een ononderbroken rusttijd heeft
      van ten minste 16 dagen.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel5.57
  - number: 5.5:7.3
    text: |-
      De werkgever en de gezagvoerend schipper organiseren de arbeid zodanig dat het jeugdige bemanningslid tussen
      22.00 uur en 06.00 uur, dan wel tussen 23.00 en 07.00 uur slechts arbeid verricht indien dit in het kader van de
      opleiding noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel5.57
  - number: 5.5:7.4
    text: |-
      De werkgever en de gezagvoerend schipper organiseren de arbeid zodanig dat het jeugdige bemanningslid een pauze van
      ten minste 30 minuten heeft ingeval de dagelijkse arbeidstijd langer is dan vier en een half uur.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel5.57
  - number: 6.1:1
    text: 'In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.11
  - number: 6.1:1.a
    text: 'zeeschip:'
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.11
  - number: 6.1:1.a.1º
    text: |-
      hetgeen daaronder wordt verstaan in [artikel 2, eerste lid, van Boek 8 van het Burgerlijk Wetboek][ref1],
      uitgezonderd de zeeschepen, bedoeld in het [derde lid van dat artikel][ref2], en in
      [artikel 1, onderdeel a, van de Wet nationaliteit zeeschepen in rompbevrachting][ref3], alsmede


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005034#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0005681#Artikel1
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.11
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0005034
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0005681
        artikel: '1'
  - number: 6.1:1.a.2º
    text: de havensleepboot gedurende de tijd dat er in havensleepdienst dienst wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.11
  - number: 6.1:1.b
    text: |-
      havensleepdienst: het geheel van werkzaamheden en activiteiten ten behoeve van het assisteren bij het meren,
      ontmeren en verhalen van zeeschepen die gebruik maken van eigen voortstuwing, inkomend van of uitgaand naar zee.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.11
  - number: 6.1:1.c
    text: 'pleziervaartuig: een schip dat uitsluitend anders dan in de uitoefening van een beroep of bedrijf wordt gebruikt.'
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.11
  - number: 6.1:2
    text: |-
      In [dit hoofdstuk][ref1] en de daarop berustende bepalingen wordt voorts verstaan onder:


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.12
    references:
      - id: ref1
        bwb_id: BWBR0009386
        hoofdstuk: '6'
  - number: 6.1:2.a
    text: |-
      *scheepsbeheerder:*de natuurlijke of rechtspersoon, die vanuit een vestiging in Nederland van een
      zeescheepvaartonderneming de dagelijkse leiding heeft over het beheer van het schip;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.12
  - number: 6.1:2.b
    text: '*kapitein:* de gezagvoerder van een zeeschip;'
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.12
  - number: 6.1:2.c
    text: |-
      *schepeling:*degene die gehouden is onder gezag van de kapitein aan boord van een zeeschip buitengaats arbeid te
      verrichten;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.12
  - number: 6.1:2.d
    text: '*jeugdige schepeling:*een schepeling van 16 of 17 jaar.'
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.12
  - number: 6.1:3
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder *rusttijd* een periode van ten minste 1
      uur waarin geen arbeid wordt verricht.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.13
  - number: 6.2:1.1
    text: |-
      De [paragrafen 4.1][ref1] en [4.4][ref2] en [hoofdstuk 5 van de wet][ref3] en de daarop berustende bepalingen zijn
      niet van toepassing op arbeid, verricht door een kapitein en een schepeling van 18 jaar of ouder, aan boord van:


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Paragraaf4.1
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Paragraaf4.4
      [ref3]: https://wetten.overheid.nl/BWBR0007671#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.21
    references:
      - id: ref1
        bwb_id: BWBR0007671
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0007671
        paragraaf: '4.4'
      - id: ref3
        bwb_id: BWBR0007671
        hoofdstuk: '5'
  - number: 6.2:1.1.a
    text: reddingsvaartuigen gedurende de tijd dat daarmee reddingswerkzaamheden worden verricht;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.21
  - number: 6.2:1.1.b
    text: |-
      pleziervaartuigen die uitsluitend als zodanig worden gebezigd voor zover zij geen passagiers tegen vergoeding
      vervoeren.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.21
  - number: 6.2:1.2
    text: |-
      De [paragrafen 4.1][ref1] en [4.4][ref2] en [hoofdstuk 5 van de wet][ref3] en de daarop berustende bepalingen zijn
      niet van toepassing op arbeid, verricht door een scheepsarts.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Paragraaf4.1
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Paragraaf4.4
      [ref3]: https://wetten.overheid.nl/BWBR0007671#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.21
    references:
      - id: ref1
        bwb_id: BWBR0007671
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0007671
        paragraaf: '4.4'
      - id: ref3
        bwb_id: BWBR0007671
        hoofdstuk: '5'
  - number: 6.2:2
    text: |-
      [Paragraaf 5.1 van de wet][ref1] en – voorzover aangeduid als strafbare feiten – de
      [paragrafen 5.2 tot en met 5.5. van de wet][ref2] en de daarop berustende bepalingen zijn van overeenkomstige
      toepassing op de kapitein die zonder werknemer te zijn in de zin van de wet arbeid verricht aan boord van
      zeeschepen.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Paragraaf5.1
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Paragraaf5.2
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.22
    references:
      - id: ref1
        bwb_id: BWBR0007671
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0007671
        paragraaf: '5.2'
  - number: 6.3:1.1
    text: |-
      Met uitsluiting van hetgeen in het [Arbeidstijdenbesluit][ref1] is bepaald zijn dit hoofdstuk en de
      daarop berustende bepalingen uitsluitend van toepassing op arbeid, verricht door kapiteins en schepelingen
      aan boord van zeeschepen die te boek staan in het register, bedoeld in [artikel 193 van Boek 8 van
      het Burgerlijk Wetboek ](onbekend)of die zijn ingeschreven in het rompbevrachtingsregister, bedoeld in
      [artikel 2 van de Wet nationaliteit zeeschepen][ref2] in rompbevrachting.


      [ref1]: https://wetten.overheid.nl/BWBR0007687
      [ref2]: https://wetten.overheid.nl/BWBR0005681#Artikel2
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.31
    references:
      - id: ref1
        bwb_id: BWBR0007687
      - id: ref2
        bwb_id: BWBR0005681
        artikel: '2'
  - number: 6.3:1.2
    text: |-
      In afwijking van het eerste lid is dit hoofdstuk niet van toepassing op duikwerkzaamheden op het continentaal plat,
      bedoeld in [artikel 1, onderdeel c, van de Mijnbouwwet](onbekend).
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.31
  - number: 6.3:2
    text: |-
      Dit hoofdstuk is niet van toepassing op arbeid, verricht aan boord van installaties, opgericht op of boven de bodem
      van de zee.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.32
  - number: 6.4:1.1
    text: |-
      De kapitein zorgt er voor dat aan boord van een zeeschip op een voor alle schepelingen toegankelijke plaats een
      werkrooster is opgehangen, waarin zijn arbeidstijdpatroon en dat van de schepelingen is vastgesteld en waarin de
      wettelijk voorgeschreven arbeids- en rusttijden worden vermeld.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.41
  - number: 6.4:1.2
    text: |-
      Bij regeling van Onze Minister van Verkeer en Waterstaat wordt een model vastgesteld voor een werkrooster. Bij die
      regeling kunnen voorschriften worden gegeven omtrent de invulling van het werkrooster.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.41
  - number: 6.4:2.1
    text: |-
      De kapitein zorgt er voor dat zijn arbeids- en rusttijden en die van elke schepeling uiterlijk na een week op een
      werklijst zijn geregistreerd. De volledig ingevulde werklijst wordt getekend door de kapitein en de desbetreffende
      schepeling. De kapitein zorgt er voor dat elke schepeling een afschrift ontvangt van zijn werklijst.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.42
  - number: 6.4:2.2
    text: |-
      De kapitein zorgt er voor dat de ingevulde en ondertekende werklijsten uiterlijk 8 weken na de invulling ter
      beschikking van de scheepsbeheerder worden gesteld.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.42
  - number: 6.4:2.3
    text: De scheepsbeheerder zorgt er voor dat de werklijsten zorgvuldig worden bijgehouden.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.42
  - number: 6.4:2.4
    text: |-
      Bij regeling van Onze Minister van Verkeer en Waterstaat wordt een model vastgesteld voor een werklijst ten behoeve
      van de registratie van arbeids- en rusttijden. Bij die regeling kunnen voorschriften worden gegeven omtrent de
      invulling van die lijst.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.42
  - number: 6.4:3
    text: |-
      De scheepsbeheerder bewaart de werklijsten ten minste 3 jaren, gerekend vanaf het einde van de periode waarop de
      werklijsten betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.43
  - number: 6.5:1
    text: |-
      In plaats van [paragraaf 5.2 van de wet][ref1] wordt deze paragraaf toegepast op arbeid, verricht aan boord van
      een zeeschip als bedoeld in [artikel 6.1:1, onderdeel a, onder 1°][ref2], met uitzondering van de tijd waarin dit
      zeeschip in havensleepdienst dienst doet.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Paragraaf5.2
      [ref2]: https://wetten.overheid.nl/BWBR0009386#Artikel6
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.51
    references:
      - id: ref1
        bwb_id: BWBR0007671
        paragraaf: '5.2'
      - id: ref2
        bwb_id: BWBR0009386
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.6'
  - number: 6.5:2.1
    text: |-
      De kapitein organiseert de arbeid zodanig dat zijn rusttijd en die van de schepeling van 18 jaar of ouder ten
      minste 10 uren bedraagt in elke periode van 24 achtereenvolgende uren, te rekenen vanaf het begin van de rusttijd.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.52
  - number: 6.5:2.2
    text: |-
      De rusttijd kan worden verdeeld in niet meer dan twee perioden, waarvan één periode een onafgebroken rusttijd van
      ten minste 6 uren omvat. In dat geval wordt de periode van 24 uren, bedoeld in het eerste lid, berekend vanaf het
      begin van de langste genoten rusttijd. De tijd tussen twee op elkaar volgende perioden van rust mag niet meer dan
      14 uren bedragen.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.52
  - number: 6.5:2.3
    text: |-
      De kapitein organiseert de arbeid zodanig, dat zijn rusttijd en die van de schepeling van 18 jaar of ouder ten
      minste 77 uren bedraagt in elke periode van 7 dagen.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.52
  - number: 6.5:3.1
    text: 'De kapitein organiseert de arbeid zodanig dat de jeugdige schepeling:'
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.53
  - number: 6.5:3.1.a
    text: in elke periode van 24 achtereenvolgende uren ten hoogste 8 uren arbeid verricht;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.53
  - number: 6.5:3.1.b
    text: |-
      in elke periode van 24 achtereenvolgende uren een rusttijd heeft van ten minste 12 uren, waarvan ten minste 9 uren
      aaneengesloten en waarin de periode tussen 00.00 en 5.00 uur is begrepen;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.53
  - number: 6.5:3.1.c
    text: per week ten hoogste 40 uren arbeid verricht;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.53
  - number: 6.5:3.1.d
    text: een onafgebroken rusttijd heeft van ten minste 36 uren in elke aaneengesloten tijdsruimte van 7 maal 24 uren;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.53
  - number: 6.5:3.1.e
    text: op zondag in beginsel geen arbeid verricht.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.53
  - number: 6.5:3.2
    text: |-
      De kapitein organiseert de arbeid zodanig dat de jeugdige schepeling een pauze krijgt van ten minste, zo mogelijk
      aaneengesloten, 30 minuten ingeval de dagelijkse arbeidstijd langer is dan 4,5 uur.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.53
  - number: 6.5:3.3
    text: 'In afwijking van het eerste lid, onderdelen a en b, mag de jeugdige schepeling:'
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.53
  - number: 6.5:3.3.a
    text: |-
      in elke periode van 24 achtereenvolgende uren gedurende ten hoogste 12 uren arbeid verrichten indien hij uit hoofde
      van de wachtindeling gedurende die uren feitelijk wacht loopt;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.53
  - number: 6.5:3.3.b
    text: arbeid verrichten tussen 00.00 en 05.00 uur indien dit in verband met zijn opleiding noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.53
  - number: 6.5:4
    text: |-
      De kapitein organiseert de arbeid zodanig dat de arbeid van de schepeling telkens na ten hoogste 6 uur wordt
      afgewisseld door een pauze.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.54
  - number: 6.5:5.1
    text: |-
      Onder consignatie wordt in dit artikel verstaan een rustperiode of pauze aan boord van een zeeschip, waarin de
      kapitein of de schepeling uitsluitend verplicht is bereikbaar te zijn om in geval van onvoorziene omstandigheden op
      oproep zo spoedig mogelijk de bedongen arbeid te verrichten.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.55
  - number: 6.5:5.2
    text: |-
      Indien de schepeling tijdens consignatie arbeid moet verrichten krijgt hij, met inachtneming van
      [de artikelen 6.5:2, eerste en tweede lid][ref1], en [6.5:3, eerste lid][ref2], voldoende rusttijd of pauze ter
      compensatie.


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0009386#Artikel6
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.55
    references:
      - id: ref1
        bwb_id: BWBR0009386
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.5'
      - id: ref2
        bwb_id: BWBR0009386
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.5'
  - number: 6.5:5.3
    text: |-
      De arbeid die voortvloeit uit een oproep als bedoeld in het eerste lid wordt voor de toepassing van
      [de artikelen 6.5:2][ref1], [6.5:3, uitgezonderd het eerste lid, onder a, b en c][ref2], en [6.5:4][ref3] buiten
      beschouwing gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0009386#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0009386#Artikel6
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.55
    references:
      - id: ref1
        bwb_id: BWBR0009386
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.5'
      - id: ref2
        bwb_id: BWBR0009386
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.5'
      - id: ref3
        bwb_id: BWBR0009386
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.5'
  - number: 6.5:6
    text: |-
      De kapitein organiseert de wettelijk voorgeschreven oefeningen en appèls zodanig dat zij zo min mogelijk inbreuk
      maken op de rusttijden en geen oververmoeidheid veroorzaken.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.56
  - number: 6.5:7.1
    text: |-
      De kapitein kan afwijken en kan een schepeling verplichten af te wijken van de arbeids- en rusttijden om arbeid
      te verrichten indien dit noodzakelijk is in verband met de onmiddellijke veiligheid van het schip, de personen aan
      boord, de lading of het milieu, of bij het geven van hulp aan andere schepen of personen in nood.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.57
  - number: 6.5:7.2
    text: |-
      Zodra de noodsituatie, bedoeld in het eerste lid, voorbij is, zorgt de kapitein er voor dat de schepeling die
      arbeid heeft verricht in een rustperiode, voldoende rusttijd ter compensatie krijgt.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.57
  - number: 6.6:1
    text: |-
      In plaats van [paragraaf 5.2 van de wet][ref1] wordt deze paragraaf toegepast op arbeid,
      verricht aan boord van een zeeschip als bedoeld in [artikel 6.1:1, onderdeel a, onder 1°][ref2],
      gedurende de tijd waarin dit zeeschip in havensleepdienst dienst doet, alsmede, in aanvulling op
      [artikel 6.3:1, eerste lid][ref3], op arbeid, verricht aan boord van een havensleepboot als bedoeld in
      [artikel 1, onder i, van de Wet vaartijden en bemanningssterkte binnenvaart][ref4], gedurende de tijd waarin deze
      havensleepboot in havensleepdienst dienst doet.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Paragraaf5.2
      [ref2]: https://wetten.overheid.nl/BWBR0009386#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0009386#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0006029#Artikel1
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.61
    references:
      - id: ref1
        bwb_id: BWBR0007671
        paragraaf: '5.2'
      - id: ref2
        bwb_id: BWBR0009386
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref3
        bwb_id: BWBR0009386
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref4
        bwb_id: BWBR0006029
        artikel: '1'
  - number: 6.6:2.1
    text: |-
      De kapitein en de schepelingen van 18 jaar of ouder hebben een ononderbroken rusttijd van hetzij ten minste 36 uren
      in elke aaneengesloten periode van 7 maal 24 uren, hetzij ten minste 72 uren in elke aaneengesloten periode van 10
      maal 24 uren.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.62
  - number: 6.6:2.2
    text: |-
      Uitsluitend bij collectieve regeling kan van het eerste lid worden afgeweken. Elk beding waarin op andere wijze dan
      in de vorige volzin is bepaald, wordt afgeweken van het eerste lid, is nietig.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.62
  - number: 6.6:2.3
    text: |-
      De in het eerste lid bedoelde perioden vangen aan op het eerste tijdstip van de dag waarop de kapitein en de
      schepelingen arbeid verrichten.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.62
  - number: 6.6:3.1
    text: |-
      De kapitein organiseert de arbeid zodanig, dat hij en de schepelingen van 18 jaar of ouder in elke periode van 24
      achtereenvolgende uren een rusttijd hebben van ten minste 10 uren.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.63
  - number: 6.6:3.2
    text: |-
      De kapitein en de schepeling van 18 jaar of ouder hebben in elke periode van 24 achtereenvolgende uren een
      onafgebroken rusttijd van 8 uren.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.63
  - number: 6.6:3.3
    text: |-
      Uitsluitend bij collectieve regeling kan, met inachtneming van het vierde lid, worden afgeweken van het tweede
      lid. Elk beding waarin op andere wijze dan in de vorige volzin is bepaald, wordt afgeweken van het tweede lid,
      is nietig.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.63
  - number: 6.6:3.4
    text: |-
      De kapitein organiseert de arbeid zodanig, dat de onafgebroken rusttijd van 8 uren, bedoeld in het tweede lid, ten
      hoogste 3 maal per week wordt ingekort tot ten minste 6 uren onafgebroken rusttijd.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.63
  - number: 6.6:3.5
    text: |-
      De kapitein organiseert de arbeid zodanig dat hij en de schepelingen van 18 jaar en ouder in elke aaneengesloten
      periode van 7 maal 24 uren een totale rusttijd hebben van ten minste 77 uren.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.63
  - number: 6.6:3.6
    text: |-
      De in het eerste, tweede en vijfde lid, bedoelde periode van 24 uren wordt berekend vanaf het begin van de langste
      genoten rusttijd. De tijd tussen twee op elkaar volgende perioden van rust mag niet meer dan 14 uren bedragen.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.63
  - number: 6.6:4
    text: |-
      De kapitein organiseert de arbeid zodanig dat hij en de schepelingen van 18 jaar of ouder in elke periode van 13
      achtereenvolgende weken gemiddeld ten hoogste 48 uren per week arbeid verrichten.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.64
  - number: 6.6:5.1
    text: 'De kapitein organiseert de arbeid zodanig dat een jeugdige schepeling:'
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.65
  - number: 6.6:5.1.a
    text: |-
      een onafgebroken rusttijd heeft van ten minste 36 uren in elke aaneengesloten periode van 7 maal 24 uren, waarin de
      zondag is begrepen;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.65
  - number: 6.6:5.1.b
    text: |-
      in elke periode van 24 uren een rusttijd heeft van ten minste 12 uren, waarvan ten minste 9 uren aaneengesloten en
      waarin de periode tussen hetzij 22.00 en 06.00 uur hetzij tussen 23.00 en 07.00 begrepen is.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.65
  - number: 6.6:5.2
    text: 'De kapitein organiseert de arbeid zodanig dat een jeugdige schepeling:'
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.65
  - number: 6.6:5.2.a
    text: in elke periode van 24 achtereenvolgende uren ten hoogste 8 uren arbeid verricht;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.65
  - number: 6.6:5.2.b
    text: in elke aaneengesloten periode van 7 maal 24 uren ten hoogste 40 uren arbeid verricht.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.65
  - number: 6.6:5.3
    text: |-
      De kapitein organiseert de arbeid zodanig dat de arbeid van een jeugdige schepeling indien hij meer dan 4,5 uur
      arbeid verricht wordt afgewisseld door een pauze van ten minste, zo mogelijk aaneengesloten, 30 minuten.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.65
  - number: 6.6:5.4
    text: |-
      In afwijking van het eerste lid, onderdeel b, mag een jeugdige schepeling tussen 22.00 uur en 06.00 uur dan wel
      tussen 23.00 uur en 07.00 uur arbeid verrichten indien dit in het kader van de opleiding noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.65
  - number: 6.6:6.1
    text: |-
      Onder consignatie wordt in dit artikel verstaan een rustperiode of pauze, waarin de kapitein of een schepeling van
      18 jaar of ouder verplicht is bereikbaar te zijn om in geval van onvoorziene omstandigheden op oproep zo spoedig
      mogelijk de bedongen arbeid te verrichten.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.66
  - number: 6.6:6.2
    text: |-
      Indien de kapitein of een schepeling van 18 jaar of ouder tijdens consignatie arbeid moet verrichten krijgt hij,
      met inachtneming van [artikel 6.6:3, eerste en vijfde lid][ref1], voldoende rusttijd of pauze ter compensatie. Deze
      compensatie is ten minste gelijk aan de resterende rusttijd onderscheidenlijk pauze op het ogenblik van de oproep,
      en wordt toegevoegd aan de eerstvolgende periode van rust onderscheidenlijk pauze.


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Artikel6
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.66
    references:
      - id: ref1
        bwb_id: BWBR0009386
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.6'
  - number: 6.6:6.3
    text: |-
      De arbeid die voortvloeit uit een oproep als bedoeld in het eerste lid wordt voor de toepassing van de
      [artikelen 6.6:2, eerste lid][ref1] en [6.6:3, tweede en vierde lid][ref2], buiten beschouwing gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0009386#Artikel6
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.66
    references:
      - id: ref1
        bwb_id: BWBR0009386
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.6'
      - id: ref2
        bwb_id: BWBR0009386
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.6'
  - number: 6.6:6.4
    text: |-
      De kapitein organiseert de arbeid zodanig dat hij en de schepelingen van 18 jaar of ouder in elke periode van 4
      achtereenvolgende weken:
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.66
  - number: 6.6:6.4.a
    text: ten minste 14 maal gedurende een periode van 24 achtereenvolgende uren geen consignatie worden opgelegd en
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.66
  - number: 6.6:6.4.b
    text: |-
      ten minste 2 maal gedurende een aaneengesloten periode van 48 uren geen arbeid verrichten noch consignatie worden
      opgelegd.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.66
  - number: 6.6:7
    text: |-
      De artikelen [6.4:1, eerste lid][ref1], [6.4:2, eerste tot en met derde lid][ref2], [6.4:3][ref3] voor zover het
      betreft de bewaartermijn, [6.5:4][ref4], [6.5:6][ref5] en [6.5:7][ref6] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0009386#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0009386#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0009386#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0009386#Artikel6
      [ref6]: https://wetten.overheid.nl/BWBR0009386#Artikel6
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.67
    references:
      - id: ref1
        bwb_id: BWBR0009386
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0009386
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref3
        bwb_id: BWBR0009386
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref4
        bwb_id: BWBR0009386
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.5'
      - id: ref5
        bwb_id: BWBR0009386
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.5'
      - id: ref6
        bwb_id: BWBR0009386
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.5'
  - number: 6.7:1.1
    text: |-
      De scheepsbeheerder zorgt er voor dat de kapitein en de schepelingen aan boord van het zeeschip geen arbeid
      verrichten in strijd met dit hoofdstuk en de daarop berustende bepalingen.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.71
  - number: 6.7:1.2
    text: |-
      De scheepsbeheerder verschaft de kapitein de middelen en gegevens die deze nodig heeft om aan de hem in dit
      hoofdstuk en de daarop berustende bepalingen opgelegde verplichtingen te voldoen.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.71
  - number: 6.7:1.3
    text: |-
      De scheepsbeheerder zorgt er voor dat aan boord de tekst van de wet en van dit hoofdstuk en de daarop berustende
      bepalingen en van de van toepassing zijnde collectieve regeling beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.71
  - number: 6.7:2.1
    text: |-
      Onze Minister van Verkeer en Waterstaat kan ontheffing verlenen van [artikel 6.5:2, eerste en tweede lid][ref1], en
      [artikel 6.5:3, eerste lid, onderdelen a en b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0009386#Artikel6
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.72
    references:
      - id: ref1
        bwb_id: BWBR0009386
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.5'
      - id: ref2
        bwb_id: BWBR0009386
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.5'
  - number: 6.7:2.2
    text: De scheepsbeheerder en de kapitein leven de aan de ontheffing verbonden voorschriften na.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.72
  - number: 6.7:2.3
    text: |-
      Onze Minister van Verkeer en Waterstaat kan regels stellen omtrent de wijze waarop de aanvraag om een ontheffing
      moet worden ingediend en de gegevens die door de aanvrager moeten worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6.72
  - number: 6A.1:1
    text: 'In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6A.11
  - number: 6A.1:1.a
    text: |-
      *vissersvaartuig:* een zeevissersschip als bedoeld in
      [artikel 2, derde lid, van Boek 8 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel2
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6A.11
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '2'
  - number: 6A.1:1.b
    text: |-
      *scheepsbeheerder:* de natuurlijke of rechtspersoon die vanuit een vestiging in Nederland van een
      visserijonderneming de dagelijkse leiding heeft over het beheer van een vissersvaartuig;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6A.11
  - number: 6A.1:1.c
    text: '*schipper:* de gezagvoerder van een vissersvaartuig;'
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6A.11
  - number: 6A.1:1.d
    text: |-
      *schepeling:* degene die als werknemer aan boord van een vissersvaartuig gehouden is buitengaats arbeid te
      verrichten;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6A.11
  - number: 6A.1:1.e
    text: '*jeugdige schepeling:* de schepeling van 16 of 17 jaar;'
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6A.11
  - number: 6A.1:1.f
    text: '*rusttijd:* een periode van ten minste een uur waarin geen arbeid wordt verricht.'
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6A.11
  - number: 6A.1:2.1
    text: |-
      Voor de toepassing van dit hoofdstuk geldt de tijd waarin door de schepeling van een vissersvaartuig door
      omstandigheden inherent aan de visserij, geen arbeid kan worden verricht hoewel hij volgens zijn werkrooster arbeid
      zou moeten verrichten, als rusttijd.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6A.12
  - number: 6A.1:2.2
    text: |-
      In afwijking van het eerste lid worden niet als rusttijd aangemerkt de tijdsruimten waarin de schepeling niet
      vrijelijk over zijn tijd kan beschikken en zich gereed houdt tot een onmiddellijke aanvang der werkzaamheden, en
      waarbij het tijdstip van de aanvang en de duur van deze tijdsruimten niet vooraf bekend is.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6A.12
  - number: 6A.1:3
    text: |-
      Met uitsluiting van hetgeen in het Arbeidstijdenbesluit is bepaald zijn dit hoofdstuk en de
      daarop berustende bepalingen uitsluitend van toepassing op arbeid, verricht door schippers
      en schepelingen aan boord van vissersvaartuigen die te boek staan in het register, bedoeld in
      [artikel 193 van Boek 8 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel193
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6A.13
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '193'
  - number: 6A.1:4.1
    text: |-
      De schipper zorgt ervoor dat aan boord van een vissersvaartuig op een voor alle schepelingen toegankelijke
      plaats een werkrooster is opgehangen, waarin zijn arbeidspatroon en dat van de schepelingen alsmede de wettelijk
      voorgeschreven arbeids- en rusttijden worden vermeld.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6A.14
  - number: 6A.1:4.2
    text: |-
      Bij regeling van Onze Minister van Verkeer en Waterstaat kan een model worden vastgesteld voor een werkrooster. Bij
      die regeling kunnen voorschriften worden gegeven omtrent de invulling van het werkrooster.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6A.14
  - number: 6A.2:1
    text: |-
      In plaats van [paragraaf 5.2 van de wet][ref1] wordt deze paragraaf toegepast op arbeid, verricht aan boord van
      een vissersvaartuig.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Paragraaf5.2
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6A.21
    references:
      - id: ref1
        bwb_id: BWBR0007671
        paragraaf: '5.2'
  - number: 6A.2:2.1
    text: |-
      De schipper organiseert de arbeid zodanig dat zijn rusttijd en die van de schepelingen van 18 jaar of ouder ten
      minste 10 uren bedraagt in elke periode van 24 achtereenvolgende uren, te rekenen vanaf het begin van de rusttijd.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6A.22
  - number: 6A.2:2.2
    text: |-
      De rusttijd kan worden verdeeld in niet meer dan twee perioden, waarvan één periode een onafgebroken rusttijd van
      ten minste 6 uren omvat. In dat geval wordt de periode van 24 uren, bedoeld in het eerste lid, berekend vanaf het
      begin van de langste genoten rusttijd. De tijd tussen twee op elkaar volgende perioden van rust bedraagt niet meer
      dan 14 uren.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6A.22
  - number: 6A.2:2.3
    text: |-
      De schipper organiseert de arbeid zodanig dat zijn rusttijd en die van de schepelingen van 18 jaar of ouder
      tenminste 77 uren bedraagt in elke periode van 7 dagen.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6A.22
  - number: 6A.2:3
    text: |-
      De schipper organiseert de arbeid zodanig dat zijn gemiddelde wekelijkse arbeidstijd en die van de schepelingen van
      18 jaar of ouder ten hoogste 48 uren bedraagt, gerekend over een periode van 52 achtereenvolgende weken.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6A.23
  - number: 6A.2:4.1
    text: 'De schipper organiseert de arbeid zodanig dat een jeugdige schepeling:'
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6A.24
  - number: 6A.2:4.1.a
    text: in elke periode van 24 achtereenvolgende uren ten hoogste 8 uren arbeid verricht;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6A.24
  - number: 6A.2:4.1.b
    text: |-
      in elke periode van 24 achtereenvolgende uren een rusttijd heeft van ten minste 9 uren aaneengesloten en waarin de
      periode tussen 00.00 en 5.00 uur is begrepen;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6A.24
  - number: 6A.2:4.1.c
    text: per week ten hoogste 40 uren arbeid verricht;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6A.24
  - number: 6A.2:4.1.d
    text: een onafgebroken rusttijd heeft van ten minste 36 uren in elke aaneengesloten tijdsruimte van 7 maal 24 uren;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6A.24
  - number: 6A.2:4.1.e
    text: op zondag in beginsel geen arbeid verricht.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6A.24
  - number: 6A.2:4.2
    text: |-
      De schipper organiseert de arbeid zodanig dat de jeugdige schepeling een pauze krijgt van ten minste, zo mogelijk
      aaneengesloten, 30 minuten ingeval de dagelijkse arbeidstijd langer is dan 4,5 uur.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6A.24
  - number: 6A.2:4.3
    text: 'In afwijking van het eerste lid, onderdelen a en b, mag de jeugdige schepeling:'
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6A.24
  - number: 6A.2:4.3.a
    text: |-
      in elke periode van 24 achtereenvolgende uren ten hoogste 12 uren arbeid verrichten indien hij uit hoofde van de
      wachtindeling gedurende die uren feitelijk wacht loopt;
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6A.24
  - number: 6A.2:4.3.b
    text: arbeid verrichten tussen 00.00 en 5.00 uur indien dit in verband met zijn opleiding noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6A.24
  - number: 6A.2:5
    text: |-
      De schipper organiseert de arbeid zodanig dat de arbeid van een schepeling telkens na ten hoogste 6 uren wordt
      afgewisseld door een pauze.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6A.25
  - number: 6A.2:6
    text: |-
      De schipper organiseert de wettelijk voorgeschreven oefeningen en appèls zodanig dat zij zo min mogelijk inbreuk
      maken op de rusttijden en geen oververmoeidheid veroorzaken.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6A.26
  - number: 6A.2:7.1
    text: |-
      De schipper kan afwijken en kan een schepeling verplichten af te wijken van de arbeids- en rusttijden om arbeid
      te verrichten indien dit noodzakelijk is in verband met de onmiddellijke veiligheid van het vissersvaartuig, de
      personen aan boord, de lading of het milieu, of bij het geven van hulp aan andere schepen of personen in nood.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6A.27
  - number: 6A.2:7.2
    text: |-
      Zodra de noodsituatie, bedoeld in het eerste lid, voorbij is, zorgt de schipper ervoor dat de schepeling die arbeid
      heeft verricht in een rustperiode, voldoende rusttijd ter compensatie krijgt.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6A.27
  - number: 6A.3:1.1
    text: |-
      De scheepsbeheerder zorgt ervoor dat de schipper en de schepelingen aan boord van het vissersvaartuig geen arbeid
      verrichten in strijd met dit hoofdstuk en de daarop berustende bepalingen.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6A.31
  - number: 6A.3:1.2
    text: |-
      De scheepsbeheerder verschaft de schipper de nodige middelen en gegevens die deze nodig heeft om aan de hem in dit
      hoofdstuk en de daarop berustende bepalingen opgelegde verplichtingen te voldoen.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6A.31
  - number: 6A.3:2.1
    text: |-
      Onze Minister van Verkeer en Waterstaat kan ontheffing verlenen van [artikel 6A.2:2, eerste en tweede lid][ref1],
      en van [artikel 6A.2:4, eerste lid, onderdelen a en b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Artikel6A
      [ref2]: https://wetten.overheid.nl/BWBR0009386#Artikel6A
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6A.32
    references:
      - id: ref1
        bwb_id: BWBR0009386
        artikel: 6A
        hoofdstuk: 6A
        paragraaf: 6A.2
      - id: ref2
        bwb_id: BWBR0009386
        artikel: 6A
        hoofdstuk: 6A
        paragraaf: 6A.2
  - number: 6A.3:2.2
    text: De scheepsbeheerder en de schipper leven de aan de ontheffing verbonden voorschriften na.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6A.32
  - number: 6A.3:2.3
    text: |-
      Onze Minister van Verkeer en Waterstaat kan vrijstelling verlenen van [artikel 6A.2:3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Artikel6A
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel6A.32
    references:
      - id: ref1
        bwb_id: BWBR0009386
        artikel: 6A
        hoofdstuk: 6A
        paragraaf: 6A.2
  - number: 7.1:1
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel7.11
  - number: 7.1:1.a
    text: |-
      *registerloods:* hetgeen daaronder wordt verstaan in [artikel 1, eerste lid, van de Loodsenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004365#Artikel1
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel7.11
    references:
      - id: ref1
        bwb_id: BWBR0004365
        artikel: '1'
  - number: 7.1:1.b
    text: |-
      *loodsen op afstand:* de functie-uitoefening, bedoeld in [artikel 2, tweede lid, van de Loodsenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004365#Artikel2
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel7.11
    references:
      - id: ref1
        bwb_id: BWBR0004365
        artikel: '2'
  - number: 7.1:1.c
    text: '*week:* een periode van 7 dagen, die ingaat op maandag 00.00 uur.'
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel7.11
  - number: 7.2:1
    text: |-
      Met uitsluiting van hetgeen in het [Arbeidstijdenbesluit][ref1] is bepaald is dit hoofdstuk uitsluitend van
      toepassing op arbeid, verricht door registerloodsen.


      [ref1]: https://wetten.overheid.nl/BWBR0007687
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel7.21
    references:
      - id: ref1
        bwb_id: BWBR0007687
  - number: 7.2:2
    text: |-
      [Paragraaf 5.1 van de wet][ref1] en – voorzover aangewezen als strafbare feiten – de
      [paragrafen 5.2 tot en met 5.5 van de wet][ref2] en de daarop berustende bepalingen zijn van overeenkomstige
      toepassing op de registerloods die zonder werkgever of werknemer in de zin van de wet te zijn arbeid verricht aan
      boord van zeeschepen.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Paragraaf5.1
      [ref2]: https://wetten.overheid.nl/BWBR0007671#Paragraaf5.2
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel7.22
    references:
      - id: ref1
        bwb_id: BWBR0007671
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0007671
        paragraaf: '5.2'
  - number: 7.3:1
    text: |-
      In plaats van [paragraaf 5.2][ref1] van de wet wordt deze paragraaf toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel7.31
    references:
      - id: ref1
        bwb_id: BWBR0009386
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 7.3:2.1
    text: |-
      De registerloods organiseert zijn arbeid zodanig dat hij gedurende ten hoogste 100 uren per week arbeid verricht
      als registerloods.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel7.32
  - number: 7.3:2.2
    text: |-
      Indien de registerloods zijn arbeid verricht gedurende een periode van aaneengesloten dagen die meer of minder dan
      een week omvat, wordt het aantal uren gedurende welke hij in die periode ten hoogste arbeid mag verrichten naar
      evenredigheid verhoogd onderscheidenlijk verlaagd.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel7.32
  - number: 7.3:3.1
    text: |-
      De registerloods organiseert zijn arbeid zodanig dat hij in elke periode van 24 aaneengesloten uren een
      onafgebroken rusttijd heeft van ten minste 8 uren dan wel twee rusttijden van elk ten minste 5 aaneengesloten uren.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel7.33
  - number: 7.3:3.2
    text: |-
      Indien bijzondere omstandigheden met betrekking tot een loodsreis hiertoe noodzaken, mag de in het eerste lid
      bedoelde rusttijd naar evenredigheid over 2 dagen worden gehouden.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel7.33
  - number: 7.3:4
    text: |-
      De registerloods mag na 4 aaneengesloten uren loodsen op afstand vanaf de wal pas weer op deze wijze dienst
      verrichten na ten minste 8 aaneengesloten uren rust.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel7.34
  - number: 8:1.1
    text: |-
      Het niet naleven van [de artikelen 2.4:1][ref1], [2.4:2, eerste lid][ref2], [2.4:3, eerste lid][ref3],
      [2.4:4][ref4], [2.4:5, tweede en derde lid][ref5], [2.5:1, vierde lid][ref6], [2.5:3][ref7],
      [2.5:4, vierde lid][ref8], [2.5:5, derde lid][ref9], [2.5:6, tweede en derde lid][ref10],
      [2.5:7, vierde lid][ref11], [2.6:1, derde lid][ref12], [2.7:1][ref13], [2.7:2][ref14] en
      [2.7:4, eerste lid, onderdeel b, en tweede lid][ref15], alsmede het bepaalde krachtens
      [de artikelen 2.4:2, derde lid][ref16], [2.4:3, tweede lid][ref17], en [2.4:5, eerste lid][ref18] levert een
      strafbaar feit op.


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Artikel2
