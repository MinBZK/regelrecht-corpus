  - number: 8:1.2
    text: |-
      Behoudens de [artikelen 2.4:4][ref1] en [2.4:5, tweede en derde lid][ref2], wordt, indien de bestuurder werknemer
      is, ingeval van het niet naleven van een tot de bestuurder gerichte bepaling de werkgever aangemerkt als degene die
      die bepaling niet heeft nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0009386#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009386#Artikel2
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0009386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0009386
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 8:1.3
    text: |-
      Het tweede lid is niet van toepassing indien de werkgever aantoont dat door hem de nodige bevelen zijn gegeven, de
      nodige maatregelen zijn genomen, de nodige middelen zijn verschaft en het redelijkerwijs te vorderen toezicht is
      gehouden om de naleving van de bepaling te verzekeren.
    url: https://wetten.overheid.nl/BWBR0009386/2005-01-01#Artikel81
  - number: 8:2
    text: |-
      Het niet naleven van de [artikelen 3.2:1, derde lid][ref1], en [3.2:2, derde lid][ref2], levert een strafbaar feit
      op.


