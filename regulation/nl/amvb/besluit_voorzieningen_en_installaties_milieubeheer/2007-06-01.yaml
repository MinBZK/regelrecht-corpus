    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 4 april 2001, nr.
    MJZ2001038858, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Gelet op richtlijn nr. 1991/689/EEG van de Raad van de Europese Gemeenschappen van 12 december 1991 betreffende
    gevaarlijke afvalstoffen (PbEG L 377), richtlijn nr. 1991/271/EEG van de Raad van de Europese Gemeenschappen van
    21 mei 1991 betreffende de behandeling van stedelijk afvalwater (PbEG L 135), artikel 8.19, eerste lid, van de Wet
    milieubeheer, de artikelen 8.40, 8.41 en 8.42 van de Wet milieubeheer, voorzover het betreft artikel 1, onder f en
    g, artikel 2, eerste lid, onder c, ten derde, artikel 3, eerste lid, en artikel 4, eerste lid, en op artikel 8.44
    van de Wet milieubeheer, voorzover het betreft artikel 1, onder h, en artikel 4, tweede lid;

    De Raad van State gehoord (advies van 27 juni 2001, nr. W08.01.0179/V);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 11
    oktober 2001, nr. MJZ2001111.453, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

