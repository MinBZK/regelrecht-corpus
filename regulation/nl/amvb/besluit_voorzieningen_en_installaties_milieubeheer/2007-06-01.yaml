        bwb_id: BWBR0013360
  - number: '2.1'
    text: |-
      Dit besluit is van toepassing op een inrichting of een onderdeel daarvan, waarbij uitsluitend of in hoofdzaak
      sprake is van:
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel2
  - number: 2.1.a
    text: 'het reduceren van aardgasdruk of het meten van aardgashoeveelheid, voorzover:'
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel2
  - number: 2.1.a.1°
    text: |-
      de ontwerpcapaciteit meer dan 10 Nm3/h bedraagt bij een maximale incidentele inlaatzijdige werkdruk van meer dan
      20 kPa en een maximale inlaatzijdige werkdruk van ten hoogste 1 600 kPa, of de ontwerpcapaciteit meer dan 650 Nm3/
      h bedraagt bij een maximale incidentele inlaatzijdige werkdruk van ten hoogste 20 kPa, of de maximale inlaatzijdige
      werkdruk meer dan 1 600 kPa en ten hoogste 10 000 kPa bedraagt,
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel2
  - number: 2.1.a.2°
    text: geen odorisatie-apparatuur aanwezig is,
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel2
  - number: 2.1.a.3°
    text: geen antivries-injectie-apparatuur aanwezig is,
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel2
  - number: 2.1.a.4°
    text: geen expansieturbine aanwezig is,
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel2
  - number: 2.1.a.5°
    text: |-
      het geen ondergronds of gedeeltelijk ondergronds station betreft waarvan de nominale ontwerpcapaciteit meer dan
      6 000 Nm3/h bedraagt, de maximale inlaatzijdige werkdruk meer dan 1 600 kPa en ten hoogste 10 000 kPa bedraagt of
      de inhoud van de behuizing meer dan 15m3 bedraagt;
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel2
  - number: 2.1.b
    text: |-
      het gelijktijdig produceren van elektrische energie en thermische energie door middel van een
      warmtekrachtinstallatie, voorzover:
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel2
  - number: 2.1.b.1°
    text: de installatie geen groter nominaal elektrisch vermogen heeft dan 10 MW,
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel2
  - number: 2.1.b.2°
    text: ten behoeve van de installatie geen andere brandstof dan aardgas, propaangas of butaangas wordt gebruikt;
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel2
  - number: 2.1.c
    text: 'het verstoken van brandstoffen voor verwarmingsdoeleinden, voorzover:'
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel2
  - number: 2.1.c.1°
    text: de stookinstallatie voor verwarming geen groter thermisch vermogen heeft dan 7 500 kW per toestel,
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel2
  - number: 2.1.c.2°
    text: |-
      ten behoeve van de stookinstallatie geen andere brandstof dan aardgas, propaangas, butaangas of gasolie wordt
      gebruikt,
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel2
  - number: 2.1.c.3°
    text: het verstoken van brandstoffen niet geschiedt in een inrichting type B of C;
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel2
  - number: 2.1.d
    text: |-
      het tot stand brengen en in bedrijf houden van verbindingen ten behoeve van het transport van spraak, data en beeld
      door middel van telecommunicatie-apparatuur, voorzover niet van installaties voor de omzetting van die elektrische
      energie in stralingsenergie gebruik wordt gemaakt;
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel2
  - number: 2.1.e
    text: 'het omzetten van windenergie in elektrische energie in één of meer windturbines, voorzover:'
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel2
  - number: 2.1.e.1°
    text: windturbines elk afzonderlijk een vaste verbinding hebben met de bodem of waterbodem in de vorm van een mast,
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel2
  - number: 2.1.e.2°
    text: windturbines zijn voorzien van een horizontale draaias van de rotor,
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel2
  - number: 2.1.e.3°
    text: |-
      de afstand tussen een afzonderlijke windturbine en de dichtstbijzijnde woning of andere geluidsgevoelige gebouwen
      en geluidsgevoelige terreinen, ten minste viermaal de ashoogte bedraagt, en
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel2
  - number: 2.1.e.4°
    text: de windturbine of het samenstel van windturbines een gezamenlijk elektrisch vermogen heeft, kleiner dan 15 MW;
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel2
  - number: 2.1.f
    text: |-
      het doorvoeren, opslaan, bufferen of keren van rioolwater, hemelwater of oppervlaktewater of water ten behoeve van
      verwarmings- of koelingsdoeleinden, alsmede het onttrekken, zuiveren, doorvoeren, opslaan, bufferen of keren van
      grondwater of oppervlaktewater voor drinkwaterdoeleinden;
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel2
  - number: 2.1.g
    text: 'het reinigen van binnen de inrichting vrijgekomen grond of grondwater, voorzover:'
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel2
  - number: 2.1.g.1°
    text: |-
      geen afvalwater wordt gebracht in het oppervlaktewater, in een voorziening voor inzameling en transport van
      afvalwater, of in een werk dat is aangesloten op een inrichting voor het zuiveren van afvalwater in gebruik bij een
      provincie, een gemeente, een waterschap of een ander openbaar lichaam, onderscheidenlijk,
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel2
  - number: 2.1.g.2°
    text: |-
      afvalwater wordt gebracht in een voorziening voor inzameling en transport van afvalwater of
      in een werk dat is aangesloten op een inrichting voor het zuiveren van afvalwater in gebruik
      bij een provincie, een gemeente, een waterschap of een ander openbaar lichaam en waarop
      [artikel 4 van het Lozingenbesluit Wvo bodemsanering en proefbronnering][ref1] van toepassing is, of


      [ref1]: https://wetten.overheid.nl/BWBR0008511#Artikel4
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0008511
        artikel: '4'
  - number: 2.1.h
    text: 'het bewaren van propaan, voorzover:'
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel2
  - number: 2.1.h.1°
    text: het bewaren van propaan geschiedt in bovengrondse reservoirs elk met een inhoud van ten hoogste 13 m3,
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel2
  - number: 2.1.h.2°
    text: niet meer dan twee reservoirs binnen de inrichting aanwezig zijn, en
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel2
  - number: 2.1.h.3°
    text: |-
      propaan, behoudens voor het leegmaken voor verplaatsing van een reservoir, uitsluitend in de gasfase aan een
      reservoir wordt onttrokken.
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel2
  - number: '2.2'
    text: |-
      Dit besluit is eveneens van toepassing op inrichtingen die uitsluitend of in hoofdzaak bestemd zijn voor een
      samenstel van bedrijvigheden als bedoeld in het eerste lid, onder a tot en met h.
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel2
  - number: '3.1'
    text: 'Dit besluit is niet van toepassing op een inrichting type A, indien:'
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel3
  - number: 3.1.a
    text: |-
      in de inrichting of een onderdeel daarvan één of meer installaties of voorzieningen aanwezig zijn, die kunnen
      worden gebruikt voor het verstoken van andere brandstoffen dan aardgas, propaangas, butaangas of gasolie;
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel3
  - number: 3.1.b
    text: |-
      in de inrichting of een onderdeel daarvan koel- en vriesinstallaties of warmtepompen aanwezig zijn met een
      capaciteit of een totale capaciteit van meer dan 200 kg ammoniak of van meer dan 100 kg propaan, butaan of mengsels
      van propaan en butaan;
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel3
  - number: 3.1.c
    text: |-
      afvalstoffen worden op- of overgeslagen, die van buiten de inrichting afkomstig zijn, voorzover de inrichting
      beschikt over een capaciteit:
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel3
  - number: 3.1.c.1°
    text: van meer dan 35 m3 voor de opslag van afvalstoffen,
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel3
  - number: 3.1.c.2°
    text: voor de opslag van gevaarlijke afvalstoffen, of
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel3
  - number: 3.1.c.3°
    text: van meer dan 1000 m3 per jaar voor de overslag van afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel3
  - number: 3.1.d
    text: |-
      vloeibare gevaarlijke stoffen, vloeibare gevaarlijke afvalstoffen of brandbare vloeistoffen in tanks worden op- of
      overgeslagen, tenzij sprake is van:
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel3
  - number: 3.1.d.1°
    text: |-
      opslaan in ondergrondse tanks waarop het [Besluit opslaan in ondergrondse tanks 1998][ref1] van toepassing is,


      [ref1]: https://wetten.overheid.nl/BWBR0009747
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009747
  - number: 3.1.d.2°
    text: opslaan van brandbare vloeistoffen in bovengrondse tanks, of
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel3
  - number: 3.1.d.3°
    text: |-
      opslaan van stoffen, genoemd in voorschrift 2.1.5 van [bijlage 2][ref1], voorzover niet meer dan in totaal 10 000
      kg van de in voorschrift 2.1.5 van [bijlage 2][ref2] bedoelde stoffen aanwezig is;


      [ref1]: https://wetten.overheid.nl/BWBR0012897
      [ref2]: https://wetten.overheid.nl/BWBR0012897
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012897
      - id: ref2
        bwb_id: BWBR0012897
  - number: 3.1.e
    text: |-
      voorzieningen of installaties aanwezig zijn voor het afleveren aan voertuigen die niet in hoofdzaak voor eigen
      gebruik zijn, van autogas of andere brandstoffen;
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel3
  - number: 3.1.f
    text: de inrichting of een onderdeel daarvan is ingericht voor de opslag van vuurwerk.
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel3
  - number: '3.2'
    text: |-
      Dit besluit is niet van toepassing op een inrichting als bedoeld in [artikel 2][ref1], ten aanzien waarvan
      gedeputeerde staten ingevolge [artikel 3.1 van het Inrichtingen- en vergunningenbesluit milieubeheer][ref2] het
      bevoegd gezag zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0012897#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005829#Artikel3
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012897
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0005829
        artikel: '3'
  - number: '4.1'
    text: |-
      De voorschriften die zijn opgenomen in [bijlage 1][ref1] en 2 gelden voor een ieder die een inrichting type A
      drijft. Deze draagt er zorg voor dat de voorschriften worden nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0012897
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0012897
  - number: '4.2'
    text: |-
      De voorschriften die zijn opgenomen in [bijlage 1][ref1] gelden voor een ieder die een inrichting type B of C
      drijft. Deze draagt er zorg voor dat de voorschriften worden nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0012897
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0012897
  - number: '4.3'
    text: |-
      Indien een voorschrift dat is opgenomen in [bijlage 1][ref1], [hoofdstukken 1][ref2] tot en met [8][ref3], of
      [bijlage 2][ref4], [hoofdstukken 1][ref5] tot en met [3][ref6], inhoudt dat daarbij aangegeven middelen ter
      bescherming van het milieu moeten worden toegepast, meldt degene die de inrichting drijft en die voornemens is
      andere middelen toe te passen, dit voornemen ten minste vier weken voordat hij die andere middelen wil toepassen
      aan het bevoegd gezag, onder overlegging van de in [artikel 6, elfde lid][ref7], bedoelde gegevens. Het bevoegd
      gezag beslist over de juistheid van een gekozen middel.


      [ref1]: https://wetten.overheid.nl/BWBR0012897
      [ref2]: https://wetten.overheid.nl/BWBR0012897
      [ref3]: https://wetten.overheid.nl/BWBR0012897
      [ref4]: https://wetten.overheid.nl/BWBR0012897
      [ref5]: https://wetten.overheid.nl/BWBR0012897
      [ref6]: https://wetten.overheid.nl/BWBR0012897
      [ref7]: https://wetten.overheid.nl/BWBR0012897#Artikel6
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0012897
      - id: ref2
        bwb_id: BWBR0012897
      - id: ref3
        bwb_id: BWBR0012897
      - id: ref4
        bwb_id: BWBR0012897
      - id: ref5
        bwb_id: BWBR0012897
      - id: ref6
        bwb_id: BWBR0012897
      - id: ref7
        bwb_id: BWBR0012897
        artikel: '6'
  - number: '5.1'
    text: 'Het bevoegd gezag kan nadere eisen stellen met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel5
  - number: 5.1.a
    text: |-
      de in [bijlage 1][ref1] opgenomen voorschriften ten aanzien van de veiligheid van toestellen en installaties
      voor warmtekracht, waterwinning, waterbeheer en watertransport, onderzoek naar hinder door slagschaduw of
      lichtschittering, metingen van emissies naar de lucht of riolering, voorzover dat in [bijlage 1][ref2] is
      aangegeven,


      [ref1]: https://wetten.overheid.nl/BWBR0012897
      [ref2]: https://wetten.overheid.nl/BWBR0012897
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012897
      - id: ref2
        bwb_id: BWBR0012897
  - number: 5.1.b
    text: |-
      de in [bijlage 2][ref1] opgenomen voorschriften ten aanzien van geluid, trilling, energie, afvalstoffen,
      afvalwater, lucht, verlichting en opslag, voorzover dat in [hoofdstuk 4][ref2] van [bijlage 2][ref3] is aangegeven,
      of


      [ref1]: https://wetten.overheid.nl/BWBR0012897
      [ref2]: https://wetten.overheid.nl/BWBR0012897
      [ref3]: https://wetten.overheid.nl/BWBR0012897
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012897
      - id: ref2
        bwb_id: BWBR0012897
      - id: ref3
        bwb_id: BWBR0012897
  - number: 5.1.c
    text: |-
      de aanwezigheid van brandbestrijdingsmiddelen, de veiligheid van toestellen en installaties voor gas of
      elektriciteit, de veiligheid van de opslag van stoffen, het verbruik van grondstoffen, onderzoek naar
      bodemverontreiniging, voorzover dat in [hoofdstuk 4][ref1] van [bijlage 2][ref2] is aangegeven, de gevolgen van
      het verkeer van personen of goederen van en naar de inrichting en de nadelige gevolgen voor het milieu die de
      inrichting kan veroorzaken waarop voorschrift 1.7.1 van [bijlage 2][ref3] betrekking heeft, indien dat bijzonder is
      aangewezen in het belang van de bescherming van het milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0012897
      [ref2]: https://wetten.overheid.nl/BWBR0012897
      [ref3]: https://wetten.overheid.nl/BWBR0012897
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012897
      - id: ref2
        bwb_id: BWBR0012897
      - id: ref3
        bwb_id: BWBR0012897
  - number: '5.2'
    text: |-
      De nadere eisen gelden voor een ieder die de inrichting drijft. Deze draagt er zorg voor dat de nadere eisen worden
      nageleefd.
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel5
  - number: '5.3'
    text: |-
      Het bevoegd gezag kan nadere eisen wijzigen of aanvullen in het belang van de bescherming van het milieu, of
      wijzigen of intrekken indien het belang van de bescherming van het milieu zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel5
  - number: '6.1'
    text: |-
      Degene die een inrichting type A, B of C opricht, meldt dit ten minste vier weken voor de oprichting aan het
      bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel6
  - number: '6.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing met betrekking tot het veranderen van een inrichting type A, B of
      C en het veranderen van de werking daarvan. Deze melding is niet vereist, indien eerder een melding overeenkomstig
      dit artikel is gedaan en door dit veranderen geen afwijking ontstaat van de bij die melding verstrekte gegevens.
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel6
  - number: '6.3'
    text: 'Bij de melding wordt vermeld:'
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel6
  - number: 6.3.a
    text: het adres van de inrichting,
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel6
  - number: 6.3.b
    text: |-
      de naam en het adres van degene die de inrichting opricht dan wel verandert of de werking daarvan verandert, en,
      indien degene die de inrichting drijft of zal drijven, een andere persoon is, de naam en het adres van die persoon,
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel6
  - number: 6.3.c
    text: de aard en omvang van de activiteiten of processen in de inrichting,
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel6
  - number: 6.3.d
    text: de indeling en uitvoering van de inrichting, en
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel6
  - number: 6.3.e
    text: |-
      het tijdstip waarop de inrichting in werking zal zijn, de verandering daarvan gereed zal zijn, dan wel de
      verandering van de werking daarvan verwezenlijkt zal zijn.
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel6
  - number: '6.4'
    text: |-
      Bij de melding wordt tevens een rapport van een akoestisch onderzoek gevoegd, indien het geheel of gedeeltelijk een
      inrichting betreft als bedoeld in [artikel 2, eerste lid, onder b of onder e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012897#Artikel2
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0012897
        artikel: '2'
  - number: '6.5'
    text: |-
      Uit het rapport van een akoestisch onderzoek blijkt op grond van verrichte geluidmetingen of geluidberekeningen
      of aan de waarden, bedoeld in voorschrift 1.1.1 van [bijlage 2][ref1], kan worden voldaan. In het rapport wordt
      aangegeven welke voorzieningen worden getroffen om te voorkomen dat de in de eerste volzin bedoelde waarden worden
      overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0012897
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0012897
  - number: '6.6'
    text: |-
      Voorzover het een melding betreft als bedoeld in het tweede lid, is het overleggen van een rapport van een
      akoestisch onderzoek alleen vereist, indien een beoogde uitbreiding of verandering van de inrichting of het
      veranderen van de werking daarvan naar verwachting van nadelige invloed kan zijn op de geluidbelasting die door de
      inrichting wordt veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel6
  - number: '6.7'
    text: |-
      Het bevoegd gezag kan besluiten dat het overleggen van een rapport van een akoestisch onderzoek niet is vereist,
      indien het aannemelijk is dat het geluidniveau en het piekniveau veroorzaakt door de inrichting niet meer
      bedragen dan de waarden, bedoeld in voorschrift 1.1.1 van [bijlage 2][ref1]. Voor een inrichting als bedoeld
      onder [artikel 2, eerste lid, onder e][ref2], is een akoestisch onderzoek niet vereist, indien de afstand van een
      windturbine tot de dichtstbijzijnde woning meer bedraagt dan 100 meter voor een windturbine met een rotordiameter
      vanaf 20 meter en tot 30 meter; 200 meter voor een windturbine met een rotordiameter vanaf 30 meter en tot 50
      meter, en 300 meter voor een windturbine met een rotordiameter vanaf 50 meter.


      [ref1]: https://wetten.overheid.nl/BWBR0012897
      [ref2]: https://wetten.overheid.nl/BWBR0012897#Artikel2
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0012897
      - id: ref2
        bwb_id: BWBR0012897
        artikel: '2'
  - number: '6.8'
    text: |-
      Bij de melding wordt tevens een rapport met betrekking tot emissies naar de lucht en het water gevoegd, indien
      het geheel of gedeeltelijk een inrichting betreft als bedoeld in [artikel 2, eerste lid, onder g][ref1]. Uit dit
      rapport moet blijken welke emissies naar de lucht en het water optreden en welke voorzieningen zijn getroffen om
      deze emissies te voorkomen dan wel zo veel mogelijk te beperken.


      [ref1]: https://wetten.overheid.nl/BWBR0012897#Artikel2
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0012897
        artikel: '2'
  - number: '6.9'
    text: |-
      De in het derde tot en met vijfde lid en achtste lid vermelde gegevens behoeven niet te worden verstrekt, indien
      het bevoegd gezag over die gegevens beschikt.
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel6
  - number: '6.10'
    text: |-
      Degene die de melding doet, geeft bij de melding aan welke van de ingevolge dit artikel over te leggen gegevens hij
      reeds aan het bevoegd gezag heeft verschaft.
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel6
  - number: '6.11'
    text: |-
      Bij de melding overeenkomstig [artikel 4, derde lid][ref1], worden aan het bevoegd gezag gegevens verstrekt waaruit
      blijkt dat met de volgens die melding toe te passen andere middelen een ten minste gelijkwaardige bescherming voor
      het milieu wordt bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0012897#Artikel4
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0012897
        artikel: '4'
  - number: '7'
    text: |-
      Een voor een inrichting waarvan een inrichting type C onderdeel uitmaakt, krachtens
      [artikel 8.1 van de Wet milieubeheer][ref1] verleende vergunning, geldt ook voor het oprichten, in werking hebben
      of veranderen van de inrichting type C, dan wel het veranderen van de werking daarvan, voorzover dit oprichten, in
      werking hebben of veranderen van de inrichting type C, dan wel het veranderen van de werking betrekking heeft op
      het drijven van die inrichting type C.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: '8.1'
    text: |-
      Voor een inrichting die op het tijdstip van inwerkingtreding van dit besluit reeds was opgericht en waarvoor
      onmiddellijk daaraan voorafgaand een vergunning in werking en onherroepelijk was, blijven de voorschriften van
      die vergunning in verbinding met de gegevens die behoren bij de aanvraag, alsmede de aanvraag voorzover die deel
      uitmaakt van de vergunning en gegevens bevat die zich lenen voor opname of omzetting in voorschriften, gelden
      als nadere eis, bedoeld in [artikel 5][ref1], behoudens eerdere wijziging of intrekking van die voorschriften,
      gedurende drie jaar na het tijdstip van het van toepassing worden van dit besluit op die inrichting, mits het
      voorschrift betrekking heeft op een onderwerp dat is genoemd in [artikel 5, eerste lid, onder a of b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012897#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0012897#Artikel5
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0012897
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0012897
        artikel: '5'
  - number: '8.2'
    text: |-
      De nadere eisen die onmiddellijk voorafgaande aan de inwerkingtreding van dit besluit golden krachtens de
      vergunning dan wel krachtens het Besluit opslag propaan milieubeheer, het Besluit riool- of poldergemalen
      milieubeheer, het Besluit propaan in de bouw milieubeheer en het Besluit gasdrukregel- en meetstations
      milieubeheer, blijven gelden als nadere eis, bedoeld in [artikel 5][ref1], na het tijdstip van de
      inwerkingtreding van dit besluit, mits het voorschrift betrekking heeft op een onderwerp dat is genoemd in
      [artikel 5, eerste lid, onder a of b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012897#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0012897#Artikel5
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0012897
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0012897
        artikel: '5'
  - number: '9.1'
    text: |-
      Indien op het tijdstip waarop dit besluit in werking treedt, een inrichting reeds is opgericht en voor die
      inrichting onmiddellijk voor dat tijdstip geen vergunning in werking en onherroepelijk was of geen melding was
      gedaan krachtens het Besluit opslag propaan milieubeheer, het Besluit riool- of poldergemalen milieubeheer, het
      Besluit propaan in de bouw milieubeheer en het Besluit gasdrukregel- en meetstations milieubeheer, meldt degene die
      de inrichting drijft, aan het bevoegd gezag dat hij de inrichting in werking heeft.
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel9
  - number: '9.2'
    text: |-
      De melding geschiedt binnen twaalf weken na het tijdstip waarop dit besluit in werking treedt.
      [Artikel 6, derde tot en met tiende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012897#Artikel6
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0012897
        artikel: '6'
  - number: '9.3'
    text: |-
      Indien op het tijdstip waarop dit besluit in werking treedt, een aanvraag om een vergunning voor het oprichten
      van een inrichting is ingediend en waarop dit besluit op de inrichting van toepassing is of zal zijn, zijn het
      eerste en tweede lid niet van toepassing. De aanvraag wordt in dat geval aangemerkt als een melding overeenkomstig
      [artikel 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012897#Artikel6
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0012897
        artikel: '6'
  - number: '11'
    text: .
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel11
  - number: '12'
    text: .
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel12
  - number: '21'
    text: |-
      Het Besluit opslag propaan milieubeheer , het Besluit riool- of poldergemalen milieubeheer , het Besluit propaan in
      de bouw milieubeheer en het Besluit gasdrukregel- en meetstations milieubeheer worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel21
  - number: '22'
    text: Dit besluit treedt in werking met ingang van 1 december 2001.
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel22
  - number: '23'
    text: 'Dit besluit wordt aangehaald als: Besluit voorzieningen en installaties milieubeheer.'
    url: https://wetten.overheid.nl/BWBR0012897/2007-06-01#Artikel23
