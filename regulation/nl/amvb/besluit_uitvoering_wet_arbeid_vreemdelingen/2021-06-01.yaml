    text: |-
      Indien in verband met een beslissing op bezwaar, beroep of hoger beroep wordt vastgesteld dat de gegevens, die op
      grond van [artikel 19g van de wet][ref1], en de [artikelen 4g][ref2] en [4h][ref3] openbaar zijn gemaakt, niet meer
      juist of volledig zijn, worden deze gegevens aangepast, binnen tien werkdagen na ontvangst van de desbetreffende
      beslissing door Onze Minister.


