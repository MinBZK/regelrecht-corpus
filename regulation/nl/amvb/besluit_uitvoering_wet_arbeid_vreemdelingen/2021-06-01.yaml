  - number: 1i
    text: |-
      1 Het verbod, bedoeld in [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref1] is niet van toepassing met
      betrekking tot een vreemdeling die houder is van een door Onze Minister van Veiligheid en Justitie ter uitvoering
      van artikel 7 van Richtlijn 2009/50/EG van de Raad van 25 mei 2009 betreffende de voorwaarden voor toegang en
      verblijf van onderdanen van derde landen met het oog op een hooggekwalificeerde baan (PbEU L 155) afgegeven
      Europese blauwe kaart, dan wel van een geldige machtiging tot voorlopig verblijf onder een beperking verband
      houdend met verblijf als houder van een Europese blauwe kaart, voor zover die vreemdeling:

      a. een opleiding aan een geaccrediteerde opleiding aan een instelling voor hoger onderwijs in Nederland of een
      vergelijkbare opleiding aan een buitenlandse hogeronderwijsinstelling met goed gevolg heeft afgerond, en

      b. van de werkgever een vast brutoloon voor de arbeid ontvangt van ten minste € 5.567 per maand, waartoe niet wordt
      gerekend de door de werkgever te betalen vakantiebijslag.

      2 Het verbod, bedoeld in [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref2] is eveneens niet van
      toepassing met betrekking tot een vreemdeling die arbeid verricht als bedoeld in het eerste lid, en daarnaast
      arbeid als zelfstandige verricht.

      3 Het in het eerste lid, onder b, genoemde bedrag wordt jaarlijks met ingang van 1 januari gewijzigd met het
      percentage waarmee het indexcijfer van de CAO-lonen over de maand oktober daaraan voorafgaand, gepubliceerd door
      het Centraal Bureau voor de Statistiek, afwijkt van het indexcijfer waarop de laatste vaststelling van de bedragen
      is gebaseerd. De gewijzigde bedragen worden door of namens Onze Minister medegedeeld in de Staatscourant.

      4 Het loon, bedoeld in het eerste lid, onder b, wordt door de werkgever over een periode van ten hoogste een maand,
      bijgeschreven op een bankrekening, bestemd voor girale betaling, op naam van de vreemdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007149#Artikel2
