    text: |-
      1 Het verbod, bedoeld in [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref1] is niet van
      toepassing met betrekking tot een vreemdeling die houder is van een verblijfsvergunning voor bepaalde
      tijd, als bedoeld in [artikel 14 van de Vreemdelingenwet 2000][ref2], verleend onder een beperking verband
      houdend met onderzoek in de zin van richtlijn (EU) 2016/801 van het Europees Parlement en de Raad van
      11 mei 2016 betreffende de voorwaarden voor toegang en verblijf van derdelanders met het oog op onderzoek,
      studie, stages, vrijwilligerswerk, scholierenuitwisseling, educatieve projecten of au-pairactiviteiten
      (herschikking) (PbEU 2016, L 132) of een vreemdeling die in het bezit is van een machtiging tot voorlopig
      verblijf die overeenkomt met voornoemd verblijfsdoel, die in Nederland wordt tewerkgesteld bij een krachtens
      [artikel 2c van de Vreemdelingenwet 2000][ref3] als referent erkende onderzoeksinstelling in de zin van die
      richtlijn.

      2 Het verbod, bedoeld in [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref4] is eveneens
      niet van toepassing met betrekking tot een vreemdeling die in Nederland verblijft op grond van
      [artikel 3.3, vierde lid, onder a, van het Vreemdelingenbesluit 2000][ref5] en onderwijs geeft of
      onderzoek verricht aan een krachtens [artikel 2c van de Vreemdelingenwet 2000][ref6] als referent
      erkende onderzoeksinstelling die geen universiteit, hogeschool of gelieerde instelling is, bedoeld in
      [artikel 1, eerste lid, onder l][ref7].

      3 Het tweede lid is van overeenkomstige toepassing op een vreemdeling die in afwachting is van de beslissing op
      een aanvraag tot het verlenen van de verblijfsvergunning regulier voor bepaalde tijd voor onderzoek in de zin van
      de richtlijn, bedoeld in het eerste lid, en tevens houder is van een door een andere lidstaat van de Europese Unie
      afgegeven verblijfsvergunning voor onderzoek in de zin van die richtlijn.


