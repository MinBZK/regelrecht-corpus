articles:
  - number: '1'
    text: |-
      1 Het verbod, bedoeld in [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref1] is niet van toepassing met
      betrekking tot een vreemdeling:

      a. die zijn hoofdverblijf buiten Nederland heeft en die incidentele arbeid verricht uitsluitend bestaande uit:

      1°. het monteren of repareren van door zijn, buiten Nederland gevestigde, werkgever geleverde werktuigen, machines
      of apparatuur, dan wel het installeren en aanpassen van zijn, buiten Nederland gevestigde, werkgever geleverde
      software of uit het instrueren in het gebruik daarvan;

      2°. het voeren van zakelijke besprekingen of het sluiten van overeenkomsten met bedrijven en instellingen;

      3°. het voorbereiden, inrichten, houden of afbreken van een tentoonstelling of stand voor een buiten Nederland
      gevestigde opdrachtgever;

      4°. het verzorgen van rapportages of het maken van documentaires voor een buiten Nederland gevestigd
      publiciteitsmedium;

      5°. het werkzaam zijn in de huishouding van toeristen;

      6°. het deelnemen aan sportwedstrijden, dan wel het werkzaam zijn als vaste persoonlijke begeleider van een
      deelnemer aan sportwedstrijden;

      7°. het werkzaam zijn als artiest, vaste persoonlijk begeleider van een artiest, musicus, vaste persoonlijk
      begeleider van een musicus, beeldend kunstenaar, conservator of restaurator;

      8°. het onbeloond deelnemen aan proeftrainingen, die in het kader van een sollicitatieprocedure met een werkgever
      in het betaald voetbal schriftelijk zijn overeengekomen en waarvan de exacte periodevoorafgaande aan de feitelijke
      deelname aan de proeftrainingen eveneens schriftelijk is vastgelegd;

      9°. het in opdracht van een buitenlandse autoriteit controleren van in Nederland vervaardigde goederen,
      geproduceerde levensmiddelen of diervoerders ten behoeve van de invoer daarvan in het land van die buitenlandse
      autoriteit, of het in opdracht van een buitenlandse autoriteit opstellen, of afgeven van certificaten die vereist
      zijn voor de invoer van in Nederland vervaardigde goederen, geproduceerde levensmiddelen of diervoeders in het land
      van die buitenlandse autoriteit;

      10°. het ontvangen van trainingen, dan wel instructies met betrekking tot het gebruik van in Nederland vervaardigde
      goederen en in Nederland te verrichten diensten.

      b. die zijn hoofdverblijf buiten Nederland heeft en geen arbeidsovereenkomst heeft met een in Nederland gevestigde
      werkgever en uitsluitend arbeid verricht op buiten Nederland geregistreerde vervoermiddelen in het internationale
      verkeer;

      c. die zijn hoofdverblijf buiten Nederland heeft en als lid van de bemanning schepelingendienst verricht aan boord
      van een zeeschip in de zin van de [Zeebrievenwet][ref2], voor zover het zeeschip niet uitsluitend als binnenschip
      wordt geëxploiteerd op de Nederlandse binnenwateren, dan wel als werktuig voor weg en waterbouw binnen Nederland;

      d. die houder is van een door Onze Minister van Buitenlandse Zaken afgegeven legitimatiebewijs;

      e. die als correspondent werkzaam is in dienst van een publiciteitsmedium dat zijn hoofdzetel buiten Nederland
      gevestigd heeft;

      f. die als militair behoort tot de krijgsmacht van een vreemde mogendheid;

      g. die als burger werkzaam is in dienst van een Geallieerd Hoofdkwartier of de Noordatlantische
      Verdragsorganisatie;

      h. die als burger werkzaam is in dienst van een vreemde mogendheid ten behoeve van een Geallieerd Hoofdkwartier, de
      Noordatlantische Verdragsorganisatie dan wel een vreemde krijgsmacht;

      i. die als burger werkzaam is in dienst van een vreemde mogendheid ten behoeve van een instelling die in verband
      met de aanwezigheid van een Geallieerd Hoofdkwartier in Nederland is gevestigd;

      j.

      k. die met een door of vanwege de Europese Unie, een instituut of instelling voor internationaal onderwijs of
      onderzoek dat door het Ministerie van Onderwijs, Cultuur en Wetenschappen wordt gesubsidieerd, de Nederlandse
      overheid, of een Nederlandse onderwijs- of onderzoeksinstelling verstrekte beurs in Nederland tijdelijk onderzoek
      verricht voor de duur van de beurs en degene die in het kader van een bilaterale of multilaterale overeenkomst
      waarbij Nederland partij is onderzoek verricht voor de duur zoals is bepaald in de bilaterale of multilaterale
      overeenkomst;

      l. die onderwijs geeft of onderzoek verricht aan een universiteit, hogeschool of instelling die gelieerd is aan of
      werkzaam is op het terrein van een universiteit, hogeschool of instelling voor hoger internationaal onderwijs;

      m. die tot Nederland wordt toegelaten om arbeid te verrichten in het kader van een actieprogramma van de Europese
      Unie dat bekend gemaakt is in het publicatieblad van de Europese Unie voor de duur zoals is bepaald in het
      programma;

      n. die in het kader van een ontwikkelingssamenwerkingsproject voor maximaal vier aaneengesloten weken per
      kalenderjaar naar Nederland komt om in samenwerking met Nederlandse ondernemers, vakspecialisten of experts van het
      project uitzending managers kennis en ervaring op te doen inzake de bedrijfsvoering van bedrijven, en zich door hen
      laat adviseren.

      2 Onder incidentele arbeid als bedoeld in artikel 1, eerste lid, onderdeel a, wordt verstaan:

      a. onder 1°, 3°, 9° en 10°, arbeid met een maximale duur van 12 aaneengesloten weken binnen een tijdbestek van
      36 weken;

      b. onder 2°, arbeid met een maximale duur van 13 weken binnen een tijdsbestek van 52 weken;

      c. onder 4°, 5°, 6° en 7°, arbeid met een maximale duur van 6 aaneengesloten weken binnen een tijdbestek van 13
      weken;

      d. onder 8°, arbeid met een maximale duur van 4 aaneengesloten weken binnen een tijdsbestek van 52 weken.

      3 Het eerste lid, onderdeel a, onder 8°, is niet van toepassing met betrekking tot een vreemdeling die de leeftijd
      van 17 jaar nog niet heeft bereikt.

      4 Indien een vreemdeling wordt vervangen door een andere vreemdeling die op dezelfde plaats hetzelfde of
      vergelijkbaar werk uitvoert, is de duur van de incidentele arbeid, bedoeld in het tweede lid, de totale duur van de
      perioden van arbeid van de afzonderlijke vreemdelingen gezamenlijk.


