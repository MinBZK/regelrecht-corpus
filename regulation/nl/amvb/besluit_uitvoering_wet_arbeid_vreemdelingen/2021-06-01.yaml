  - number: '4'
    text: |-
      Het verbod, bedoeld in [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref1] is gedurende zes en twintig
      weken na het tijdstip van inwerkingtreding van dit besluit niet van toepassing op een vreemdeling die reeds vóór de
      inwerkingtreding daarvan:

      a. uitsluitend arbeid verricht op vervoermiddelen in het internationale verkeer;

      b. als stagiaire hier te lande werkzaam is in het kader van een met een vreemde mogendheid gesloten overeenkomst;

      c. optreedt als gastdocent aan een Nederlandse instelling voor wetenschappelijk onderwijs;

      d. is aangesteld om in openbare dienst werkzaam te zijn;

      e. arbeid verricht in dienst van de Europese Gemeenschap voor Atoomenergie.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2
    url: https://wetten.overheid.nl/BWBR0007523/2021-06-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '2'
  - number: 4b
    text: |-
      1 Na een herhaling van een overtreding of soortgelijke overtreding wordt een waarschuwing gegeven als bedoeld in
      [artikel 17b, eerste lid, van de wet][ref1] en indien een herhaling van die of een soortgelijke overtreding is
      geconstateerd als bedoeld in dat artikel van de wet, wordt een bevel opgelegd door de daartoe aangewezen ambtenaar
      dat de door hem aangewezen werkzaamheden voor een daarbij aangegeven periode worden stilgelegd dan wel niet mogen
      aanvangen.

      2 Indien een ernstige overtreding is geconstateerd, wordt in afwijking van het eerste lid, een waarschuwing als
      bedoeld in [artikel 17b, eerste lid, van de wet][ref2] gegeven bij de eerste overtreding en wordt, indien opnieuw
      dezelfde of een soortgelijke overtreding is geconstateerd die eveneens ernstig is, een bevel opgelegd door de
      daartoe aangewezen ambtenaar dat de door hem aangewezen werkzaamheden voor een daarbij aangegeven periode worden
      stilgelegd dan wel niet mogen aanvangen.

      3 Als een ernstige overtreding als bedoeld in het eerste of tweede lid wordt aangemerkt de overtreding waarbij ten
      minste 20 werkenden zijn betrokken.

      4 Indien de aard van de overtreding of de met de overtreding samenhangende omstandigheden dan wel de gevolgen van
      een stillegging van de werkzaamheden daartoe aanleiding geven, kan worden afgezien van een waarschuwing als bedoeld
      in het eerste en tweede lid en kan worden afgezien van een bevel als bedoeld in het eerste en tweede lid. Een
      dergelijke waarschuwing wordt niet gegeven of een dergelijk bevel wordt niet opgelegd, indien de overtreding een
      handelen of nalaten betreft in strijd met de [artikelen 2a, eerste lid][ref3], en [15 van de wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel17b
      [ref2]: https://wetten.overheid.nl/BWBR0007149#Artikel17b
      [ref3]: https://wetten.overheid.nl/BWBR0007149#Artikel2a
      [ref4]: https://wetten.overheid.nl/BWBR0007149#Artikel15
    url: https://wetten.overheid.nl/BWBR0007523/2021-06-01#Artikel4b
