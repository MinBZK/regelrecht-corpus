  - number: 1m
    text: |-
      1 Het verbod, bedoeld in [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref1], is niet van toepassing met
      betrekking tot een vreemdeling die beschikt over een verblijfsvergunning regulier onder de beperking in verband met
      studie als bedoeld in [artikel 3.4, eerste lid, van het Vreemdelingenbesluit 2000][ref2] of die rechtmatig verblijf
      heeft op grond van [artikel 8, onder e, van de Vreemdelingenwet 2000][ref3], en arbeid verricht die noodzakelijk
      is voor het opdoen van werkervaring in het kader van een opleiding aan een Academie van Bouwkunst waarbij werk en
      studie worden gecombineerd, mits:

      a. de tewerkstelling plaatsvindt op grond van een arbeidsovereenkomst waarin in ieder geval het aantal te werken
      uren per week, de ingangsdatum en duur van het contract en de beloning worden vermeld;

      b. een tripartiete overeenkomst wordt gesloten tussen de onderwijsinstelling, de werkgever, en de student;

      c. de tripartiete overeenkomst en arbeidsovereenkomst aanwezig is bij de werkgever op de werkplek;

      d. de arbeid verricht wordt voor de duur van maximaal 32 uur per week; en

      e. de student loon ontvangt dat marktconform is.

      2 Dit artikel is van toepassing op de instroom per studiejaar voor de Academies van Bouwkunst gezamenlijk van de
      eerste 50 studenten met de nationaliteit van een staat die niet tot de Europese Unie behoort, die geen partij is
      bij de Overeenkomst betreffende de Europese Economische Ruimte, of niet met de Zwitserse nationaliteit.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3.4
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel8
