  - number: 1g
    text: |-
      Het verbod, bedoeld in [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref1], is niet van toepassing op de
      vreemdeling die:

      a. een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 28 van de Vreemdelingenwet 2000][ref2]
      heeft aangevraagd, aanspraken op voorzieningen geniet voorzien bij of krachtens de
      [Wet Centraal Orgaan opvang asielzoekers][ref3] of een ander wettelijk voorschrift dat aanspraken op voorzieningen
      regelt en op basis van [artikel 8, onderdeel f of h, van de Vreemdelingenwet 2000][ref4] rechtmatig in Nederland
      verblijft; dan wel

      b. minderjarig is en houder is van een op grond van
      [artikel 14, eerste lid, onderdeel e, van de Vreemdelingenwet 2000][ref5] verleende verblijfsvergunning voor
      bepaalde tijd onder de beperking medische behandeling, en

      in Nederland een beroepsopleiding volgt bij een instelling als bedoeld in
      [artikel 1.1.1, onder b, van de Wet educatie en beroepsonderwijs][ref6] of een instelling die een beroepsopleiding
      verzorgt waarvan op grond van [artikel 1.4.1. Wet educatie en beroepsonderwijs][ref7] aan de met goed gevolg
      afgelegde examens of onderdelen van examens een diploma of certificaat is verbonden, en in het kader van die
      beroepsopleiding te werk wordt gesteld op grond van een beroepspraktijkvormingsovereenkomst als bedoeld in
      [artikel 7.2.8. van de Wet educatie en beroepsonderwijs][ref8], dan wel in Nederland in het kader van een opleiding
      aan een hogeschool in de zin van de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref9] te werk wordt
      gesteld op de grond van een stageovereenkomst, gesloten tussen de hogeschool, de werkgever en hemzelf.


