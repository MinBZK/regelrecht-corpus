        artikel: 19g
  - number: 4g
    text: |-
      1 De gegevens, bedoeld in [artikel 19g van de wet][ref1], betreffen:

      a. de punten waarop is gecontroleerd en de wet of wetten die de grondslag daarvoor bieden;

      b. de locatie waar het onderzoek heeft plaatsgevonden;

      c. de datum of periode waarop het onderzoek heeft plaatsgevonden;

      d. de naam en vestigingsplaats van de betreffende normadressaat;

      e. het nummer waaronder de betreffende normadressaat is ingeschreven in een register van het land van vestiging,
      dan wel de unieke code die naar de betreffende normadressaat te herleiden is; en

      f. de sector of branche waarin deze normadressaat zijn economische activiteiten verricht.

      2 Indien na afronding van een onderzoek geen overtreding is geconstateerd die leidt tot de besluiten, genoemd in
      [artikel 4h][ref2], wordt bij de gegevens, genoemd in het eerste lid, de opmerking geplaatst dat geen overtreding
      is geconstateerd.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel19g
      [ref2]: https://wetten.overheid.nl/BWBR0007523#Artikel4h
    url: https://wetten.overheid.nl/BWBR0007523/2021-06-01#Artikel4g
    references:
