  - number: 4f
    text: |-
      1 De gegevens, bedoeld in [artikel 19g van de wet][ref1], worden door de toezichthouder of de door Onze Minister
      aangewezen ambtenaren geplaatst op een website met informatie van de toezichthouder of de door Onze Minister
      aangewezen ambtenaren, bedoeld in artikel 19g, eerste lid, van de wet.

      2 De gegevens, bedoeld in [artikel 19g, eerste lid, van de wet][ref2], blijven drie jaar na de datum van
      bekendmaking van het besluit, bedoeld 19g, eerste lid, van de wet, dan wel na verzending van een brief met de
      mededeling dat er geen overtreding is geconstateerd, beschikbaar op de website.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel19g
      [ref2]: https://wetten.overheid.nl/BWBR0007149#Artikel19g
    url: https://wetten.overheid.nl/BWBR0007523/2021-06-01#Artikel4f
