  - number: 1n
    text: |-
      1 Het verbod, bedoeld in [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref1] is niet van toepassing
      met betrekking tot een vreemdeling, voor zover die arbeid verricht in het kader van een overplaatsing binnen een
      onderneming, indien hij:

      a. houder is van de verblijfsvergunning regulier voor bepaalde tijd, verleend onder de beperking «overplaatsing
      binnen een onderneming» in de zin van [artikel 3.30d van het Vreemdelingenbesluit 2000][ref2];

      b. ten hoogste 90 dagen in Nederland verblijft op grond van
      [artikel 3.3, eerste lid, onder c, Vreemdelingenbesluit 2000][ref3] en houder is van een door een andere lidstaat
      van de Europese Unie afgegeven verblijfsvergunning met de vermelding «ICT», die is afgegeven ter uitvoering van
      [richtlijn 2014/66](32014L0066)/EU van het Europees Parlement en de Raad van 15 mei 2014 betreffende de voorwaarden
      voor toegang en verblijf van onderdanen van derde landen in het kader van een overplaatsing binnen een onderneming
      (PbEU 2014, L 157), of

      c. in afwachting is van de beslissing op een aanvraag tot het verlenen van de onder a bedoelde verblijfsvergunning
      en tevens houder is van de onder b bedoelde door een andere lidstaat afgegeven verblijfsvergunning.

      2 Het verbod, bedoeld in [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref4] is eveneens niet van
      toepassing met betrekking tot een vreemdeling die arbeid verricht als bedoeld in het eerste lid, en daarnaast
      arbeid als zelfstandige verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2
