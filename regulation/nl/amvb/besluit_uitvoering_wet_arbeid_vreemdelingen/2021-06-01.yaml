  - number: 1f
    text: |-
      1 Het verbod, bedoeld in [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref1] is niet van toepassing met
      betrekking tot een vreemdeling die in Nederland:

      a. rechtmatig verblijf heeft op grond van [artikel 8, onder e, van de Vreemdelingenwet 2000][ref2] en die als
      stagiair wordt tewerkgesteld in het kader van zijn studie;

      b. beschikt over een verblijfsvergunning regulier voor bepaalde tijd voor studie als bedoeld in
      [artikel 3.4, eerste lid, van het Vreemdelingenbesluit 2000][ref3], en arbeid als zelfstandige verricht, of als
      stagiair wordt tewerkgesteld in het kader van zijn studie;

      c. vóór zijn achttiende verjaardag is gestart:

      1°. met een beroepsopleiding bij een instelling als bedoeld in
      [artikel 1.1.1, onder b, van de Wet educatie en beroepsonderwijs][ref4], of bij een instelling die een
      beroepsopleiding verzorgt waarvan op grond van [artikel 1.4.1 van de Wet educatie en beroepsonderwijs][ref5]
      aan de met goed gevolg afgelegde examens of onderdelen van examens een diploma of
      certificaat is verbonden, en die in het kader van de beroepsopleidende leerweg, bedoeld
      in [artikel 7.2.2, tweede lid, van de Wet educatie en beroepsonderwijs][ref6] onbezoldigd
      te werk wordt gesteld op grond van een beroepspraktijkvormingsovereenkomst als bedoeld in
      [artikel 7.2.8, tweede lid, van de Wet educatie en beroepsonderwijs][ref7];

      2°. met praktijkonderwijs als bedoeld in [artikel 10f, eerste lid van de Wet op het voortgezet onderwijs][ref8],
      en die in het kader van de voorbereiding op het uitoefenen van functies op de arbeidsmarkt, bedoeld in artikel 10f,
      derde lid, van de Wet op het voortgezet onderwijs, onbezoldigd te werk wordt gesteld;

      3°. met een leer-werktraject als bedoeld in [artikel 10b1, eerste lid, van de Wet op het voortgezet onderwijs][ref9],
      en die in het kader van een beroepsgericht programma als bedoeld in artikel 10b1, tweede lid, onder
      b, van de Wet op het voortgezet onderwijs op grond van een leer-werkovereenkomst als bedoeld in
      [artikel 10b3, eerste lid, van de Wet op het voortgezet onderwijs][ref10] of een maatschappelijke stage als bedoeld
      in artikel 10b1, vierde lid, van de Wet op het voortgezet onderwijs op grond van een stageovereenkomst als bedoeld
      in [artikel 6f, tweede lid, van de Wet op het voortgezet onderwijs][ref11] onbezoldigd te werk wordt gesteld;

      4°. met een entreeopleiding als bedoeld in [artikel 10b8 van de Wet op het voortgezet onderwijs][ref12], en die
      in het kader van de kwalificatie voor het eerste niveau van beroepsuitoefening onbezoldigd te werk wordt gesteld
      op grond van een samenwerkingsovereenkomst als bedoeld in artikel 10b9, tweede lid, van de Wet op het voortgezet
      onderwijs;

      5°. met het arbeidsmarktgerichte uitstroomprofiel van het voortgezet speciaal onderwijs als bedoeld
      in [artikel 14, eerste lid, onder b, van de Wet op de expertisecentra][ref13], en die in het kader van
      het getuigschrift onbezoldigd te werk wordt gesteld op grond van een stageovereenkomst als bedoeld in
      [artikel 9 van het Onderwijskundig besluit WEC][ref14]; of

      6°. met het uitstroomprofiel vervolgonderwijs van het voortgezet speciaal onderwijs als
      bedoeld in [artikel 14, eerste lid, onder a, van de Wet op de expertisecentra][ref15], en
      die in het kader van een leer-werktraject of een beroepsgericht programma als bedoeld in
      [artikel 10b1 van de Wet op het voortgezet onderwijs][ref16], een entreeopleiding als bedoeld in
      [artikel 10b8 van de Wet op het voortgezet onderwijs][ref17], of de kwalificatie voor het eerste niveau van
      beroepsuitoefening onbezoldigd te werk wordt gesteld op grond van een leer-werkovereenkomst als bedoeld in
      [artikel 10b3, van Wet op het voortgezet onderwijs][ref18]; of

      d. beschikt over een verblijfsvergunning regulier voor bepaalde tijd voor studie als
      bedoeld in [artikel 3.4, eerste lid, van het Vreemdelingenbesluit 2000][ref19], en
      activiteiten verricht in het kader van medezeggenschap of een bestuursfunctie als bedoeld in
      [artikel 7.51, tweede lid, onder a, van de Wet op het Hoger onderwijs en Wetenschappelijk onderzoek][ref20].

      2 De onderdelen a en b van het eerste lid zijn van toepassing indien:

      a. de stage wordt verricht op grond van een schriftelijke stageovereenkomst gesloten tussen de onderwijsinstelling,
      de werkgever als stagebiedende organisatie, en de stagiair, waarbij in ieder geval bij de overeenkomst
      afspraken zijn gemaakt over de taken van de stagiair, de leerdoelen, de arbeidstijden, de duur van de stage en
      onkostenvergoedingen en voorzien is in een ongevallen- en aansprakelijkheidsverzekering;

      b. de onderwijsinstelling in de stageovereenkomst verklaart dat de stage relevant is voor zijn studie; en

      c. de stageovereenkomst aanwezig is bij de werkgever op de stageplek.


