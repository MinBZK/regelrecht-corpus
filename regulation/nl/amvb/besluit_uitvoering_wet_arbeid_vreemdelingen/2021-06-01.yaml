  - number: 1k
    text: |-
      1 Het verbod, bedoeld in [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref1] is niet van toepassing met
      betrekking tot de vreemdeling die werkzaamheden verricht binnen een traject in het kader van het internationale
      handelsverkeer, waarbij de in Nederland gevestigde werkgever de werkzaamheden in opdracht van de in het buitenland
      gevestigde onderneming, werkgever, of opdrachtgever verricht, indien het gaat om werkzaamheden die de vreemdeling
      uitoefent in de hoedanigheid van:

      a. directeur-grootaandeelhouder van een in het buitenland gevestigde onderneming;

      b. opdrachtnemer van een in het buitenland gevestigde onderneming; of

      c. werknemer van een in het buitenland gevestigde werkgever.

      2 De werkgever die gebruik wil maken van dit artikel dient daartoe een schriftelijke aanvraag in bij het
      Uitvoeringsinstituut werknemersverzekeringen. Bij het verzoek worden het traject, de bijbehorende werkzaamheden,
      evenals de duur van het traject gemeld, en wordt door de werkgever aangetoond dat hij aan de voorwaarden van dit
      artikel voldoet.

      3 Het Uitvoeringsinstituut werknemersverzekeringen beslist binnen vijf weken op het verzoek tot toelating van het
      traject, bedoeld in het tweede lid.

      4 Het Uitvoeringsinstituut werknemersverzekeringen verleent de toelating van het traject, bedoeld in het tweede
      lid, voor het traject voor de duur van maximaal drie jaar.

      5 Het Uitvoeringsinstituut werknemersverzekeringen kan de toelating van het traject, bedoeld in het tweede lid,
      weigeren:

      a. indien de activiteit naar het oordeel van het Uitvoeringsinstituut werknemersverzekeringen concurrentie oplevert
      met het prioriteitgenietend aanbod, waarbij wordt meegewogen:

      1°. de aard van het traject;

      2°. de aard van de werkzaamheden die de vreemdeling binnen het traject zal uitvoeren;

      3°. de duur van het traject;

      4°. de waarde van de te leveren of geleverde goederen en diensten;

      5°. het verwachte aantal vreemdelingen dat werkzaamheden zal uitvoeren binnen het traject; en

      6°. de waarde van het traject;

      b. indien de werkgever binnen een periode van vijf jaar direct voorafgaande aan de aanvraag een onherroepelijke
      bestuurlijke boete is opgelegd op grond van een overtreding als bedoeld in:

      1°. [artikel 10:1 van de Arbeidstijdenwet][ref2];

      2°. [artikel 33 van de Arbeidsomstandighedenwet][ref3];

      3°. [artikel 18b van de Wet minimumloon en minimumvakantiebijslag][ref4];

      4°. [artikel 18 van de Wet arbeid vreemdelingen][ref5]; of

      5°. [artikel 16 van de Wet allocatie arbeidskrachten door intermediairs][ref6];

      c. indien de werkgever binnen een periode van vijf jaar direct voorafgaande aan de aanvraag is gestraft op grond
      van:

      1°. [artikel 273f, van het Wetboek van Strafrecht][ref7];

      2°. [artikel 11:3 van de Arbeidstijdenwet][ref8]; of

      3°. [artikel 32 van de Arbeidsomstandighedenwet][ref9];

      d. indien de werkgever in het kader van een vorig traject niet heeft voldaan aan de meldplicht, bedoeld in het
      zevende lid.

      6 Het Uitvoeringsinstituut werknemersverzekeringen kan de toelating van het traject, bedoeld in het tweede lid,
      intrekken:

      a. indien de voor verkrijging verstrekte gegevens zodanig onjuist of onvolledig blijken te zijn geweest, dat op de
      aanvraag een andere beslissing zou zijn genomen als bij de beoordeling daarvan de juiste omstandigheden volledig
      bekend waren geweest;

      b. indien de werkgever binnen een periode van vijf jaar direct voorafgaande aan het moment waarop de toelating van
      het traject wordt ingetrokken een onherroepelijke bestuurlijke boete is opgelegd op grond van een overtreding als
      bedoeld in:

      1°. [artikel 10:1 van de Arbeidstijdenwet][ref10];

      2°. [artikel 33 van de Arbeidsomstandighedenwet][ref11];

      3°. [artikel 18b van de Wet minimumloon en minimumvakantiebijslag][ref12];

      4°. [artikel 18 van de Wet arbeid vreemdelingen][ref13]; of

      5°. [artikel 16 van de Wet allocatie arbeidskrachten door intermediairs][ref14];

      c. indien de werkgever binnen een periode van vijf jaar direct voorafgaande aan het moment waarop de toelating van
      het traject wordt ingetrokken is gestraft op grond van:

      1°. [artikel 273f, van het Wetboek van Strafrecht][ref15];

      2°. [artikel 11:3 van de Arbeidstijdenwet][ref16]; of

      3°. [artikel 32 van de Arbeidsomstandighedenwet][ref17].

      7 Beëindiging van het traject meldt de werkgever binnen drie maanden na afloop aan het Uitvoeringsinstituut
      werknemersverzekeringen.


