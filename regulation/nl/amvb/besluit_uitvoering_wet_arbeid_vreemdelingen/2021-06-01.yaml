  - number: '2'
    text: |-
      Een aantekening als bedoeld in [artikel 4, eerste lid, van de Wet arbeid vreemdelingen][ref1] wordt afgegeven aan:

      a. een vreemdeling die beschikt over een verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 14 van de Vreemdelingenwet 2000][ref2], onder een beperking verband houdend met verblijf als familie- of
      gezinslid van:

      1°. een kennismigrant als bedoeld in [artikel 3.4, eerste lid, van het Vreemdelingenbesluit 2000][ref3];

      2°. een houder van een door Onze Minister van Veiligheid en Justitie afgegeven Europese blauwe kaart als bedoeld
      in [artikel 1i][ref4];

      3°. een houder van de verblijfsvergunning regulier voor bepaalde tijd, verleend onder de beperking «overplaatsing
      binnen een onderneming» op grond van [artikel 3.30d van het Vreemdelingenbesluit 2000][ref5];

      4°. een zelfstandige als bedoeld in [artikel 3.4, eerste lid, van het Vreemdelingenbesluit 2000][ref6]; of

      5°. een vreemdeling die beschikt over een verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 14 van de Vreemdelingenwet 2000][ref7], onder een beperking verband houdend met verblijf als familie- of
      gezinslid van een vreemdeling, bedoeld in [artikel 1o][ref8].

      b. een vreemdeling die rechtmatig in Nederland verblijft, in de zin van
      [artikel 8, onder a, van de Vreemdelingenwet 2000][ref9], en is toegelaten voor verblijf bij:

      1. een in Nederland woonachtige Nederlander of gemeenschapsonderdaan die rechtmatig in Nederland verblijft, in de
      zin van [artikel 8, onder e, van de Vreemdelingenwet 2000][ref10], of

      2. een vreemdeling aan wie een aantekening als bedoeld in
      [artikel 4, eerste lid, van de Wet arbeid vreemdelingen][ref11] is afgegeven;

      c. een vreemdeling die beschikt over een verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 14 van de Vreemdelingenwet 2000][ref12], onder een beperking verband houdend met verblijf als familie- of
      gezinslid van een vreemdeling die is toegelaten onder een beperking verband houdend met onderzoek als bedoeld in
      [artikel 3.4, eerste lid, van het Vreemdelingenbesluit 2000][ref13];

      d. een vreemdeling, met uitzondering van de vreemdeling, genoemd in de onderdelen a en f, die in het verleden heeft
      beschikt over een krachtens de Vreemdelingenwet of [Vreemdelingenwet 2000][ref14] afgegeven vergunning met daarop
      de aantekening, bedoeld in [artikel 4, eerste lid, van de Wet arbeid vreemdelingen][ref15], die is afgegeven op
      grond van het tweede lid van dat artikel en die nadien zijn hoofdverblijf niet buiten Nederland heeft gevestigd;

      e. een vreemdeling die rechtmatig in Nederland verblijft, in de zin van
      [artikel 8, onder a, van de Vreemdelingenwet 2000][ref16], indien de vreemdeling gedurende ononderbroken periode
      van zeven jaar direct voorafgaande aan de vergunning tot verblijf werkzaam is geweest op zeeschepen die onder
      Nederlandse vlag varen en in Nederland zijn geregistreerd of op mijnbouwinstallaties op het continentaal plat als
      bedoeld in [artikel 1, onderdelen o en c, van de Mijnbouwwet][ref17];

      f. een vreemdeling die beschikt over een verblijfsvergunning regulier voor bepaalde tijd onder de
      beperking «het zoeken naar en verrichten van arbeid al dan niet in loondienst» die is verleend op grond van
      [artikel 3.42 van het Vreemdelingenbesluit 2000][ref18];

      g. een vreemdeling die rechtmatig in Nederland verblijft in de zin van
      [artikel 8, onder a, van de Vreemdelingenwet 2000][ref19], onder een beperking
      «tijdelijke humanitaire gronden» of «niet-tijdelijke humanitaire gronden» als bedoeld in
      [artikel 3.4, eerste lid, van het Vreemdelingenbesluit 2000][ref20];

      h. de afhankelijke gezinsleden van de onder g genoemde vreemdelingen;

      i. een vreemdeling die rechtmatig in Nederland verblijft in de zin van
      [artikel 8, onder a, van de Vreemdelingenwet 2000][ref21], onder de beperking «verblijf
      als economisch niet-actieve langdurig ingezetene of vermogende vreemdeling», genoemd in
      [artikel 3.4, eerste lid, van het Vreemdelingenbesluit 2000][ref22];

      j. een vreemdeling die rechtmatig in Nederland verblijft in de zin van
      [artikel 8, onder a, van de Vreemdelingenwet 2000][ref23], onder de beperking «het afwachten van
      een verzoek op grond van [artikel 17 van de Rijkswet op het Nederlanderschap][ref24]», genoemd in
      [artikel 3.4, eerste lid, van het Vreemdelingenbesluit 2000][ref25].


