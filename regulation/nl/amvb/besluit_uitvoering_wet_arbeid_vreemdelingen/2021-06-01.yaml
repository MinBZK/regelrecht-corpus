  - number: 1d
    text: |-
      1 Het verbod, bedoeld in [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref1], is niet
      van toepassing met betrekking tot een vreemdeling die rechtmatig in Nederland verblijft op grond van
      [artikel 8, onderdelen a, b, c, d, e, k of l, van de Vreemdelingenwet 2000][ref2] of een vreemdeling die in het
      bezit is van een machtiging tot voorlopig verblijf die overeenkomt met het verblijfsdoel «kennismigrant» waarvoor
      een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 14 van de Vreemdelingenwet 2000][ref3] is
      aangevraagd en die:

      a. als kennismigrant als bedoeld in [artikel 3.4, eerste lid, van het Vreemdelingenbesluit 2000][ref4] in Nederland
      wordt tewerkgesteld op basis van een arbeidsovereenkomst of een ambtelijke aanstelling en:

      1°. van wie het overeengekomen vaste, naar tijdruimte en in geld vastgestelde loon als vergoeding voor zijn arbeid
      dat hij van de werkgever ontvangt, indien hij de leeftijd van dertig jaar niet heeft bereikt, ten minste € 3.484
      per maand bedraagt, waartoe niet wordt gerekend de door de werkgever te betalen vakantiebijslag, dan wel indien hij
      dertig jaar of ouder is, ten minste € 4.752 per maand bedraagt, waartoe niet wordt gerekend de door de werkgever te
      betalen vakantiebijslag, of

      2°. die voldoet aan de voorwaarden voor een verblijfsvergunning regulier voor bepaalde tijd onder
      de beperking «het zoeken naar en verrichten van arbeid al dan niet in loondienst» op grond van
      [artikel 3.42 van het Vreemdelingenbesluit 2000][ref5] en van wie het overeengekomen vaste, naar tijdruimte en in
      geld vastgestelde loon als vergoeding voor zijn arbeid dat hij van de werkgever ontvangt, ten minste € 2.497 per
      maand bedraagt, waartoe niet wordt gerekend de door de werkgever te betalen vakantiebijslag,

      b. in Nederland wordt tewerkgesteld in het kader van het doen van wetenschappelijk onderzoek bij een bekostigde of
      aangewezen onderwijsinstelling of een van overheidswege direct of indirect, geheel of gedeeltelijke bekostigde of
      gesubsidieerde onderzoeksinstelling,

      c. in Nederland wordt tewerkgesteld als arts in opleiding tot specialist aan een door de Medisch Specialisten
      Registratie Commissie, de Sociaal-Geneeskundigen Registratie Commissie of de Huisarts en Verpleeghuisarts
      Registratie Commissie aangewezen opleidingsinstituut, of

      d. als gastdocent onder de beperking «arbeid als kennismigrant» als bedoeld in
      [artikel 3.4, eerste lid, van het Vreemdelingenbesluit 2000][ref6] in Nederland wordt tewerkgesteld bij een
      universiteit, hogeschool of instelling voor hoger internationaal onderwijs die erkende referent is als bedoeld
      in [artikel 1, onderdeel t, van de Vreemdelingenwet 2000][ref7] en die beschikt over een gastovereenkomst
      met de vreemdeling, of bij een onderzoeksinstelling die gelieerd is aan of werkzaam is op het terrein van een
      universiteit, hogeschool of instelling voor hoger internationaal onderwijs, die erkende referent is en die beschikt
      over een gastovereenkomst met de vreemdeling,

      en wiens werkgever door Onze Minister van Veiligheid en Justitie krachtens
      [artikel 2c van de Vreemdelingenwet 2000][ref8] is erkend als referent ten behoeve van het verblijf van
      vreemdelingen die in Nederland verblijven of willen verblijven voor het verrichten van arbeid in loondienst, als
      kennismigrant of voor onderzoek in de zin van richtlijn (EU) 2016/801 van het Europees Parlement en de Raad van
      11 mei 2016 betreffende de voorwaarden voor toegang en verblijf van derdelanders met het oog op onderzoek, studie,
      stages, vrijwilligerswerk, scholierenuitwisseling, educatieve projecten of au-pairactiviteiten (herschikking) (PbEU
      2016, L 132).

      2 Het verbod, bedoeld in [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref9] is eveneens niet van
      toepassing met betrekking tot een vreemdeling die arbeid verricht als bedoeld in het eerste lid, onder a, b, c of
      d, en daarnaast arbeid als zelfstandige verricht.

      3 In afwijking van het eerste lid, aanhef en onderdeel a, blijft het verbod, bedoeld in
      [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref10] van toepassing met betrekking tot de vreemdeling
      die:

      a. werkzaam is als beroepssporter in het betaald voetbal;

      b. werkzaam is als geestelijke, of

      c. werkzaamheden als bedoeld in [artikel 3][ref11] verricht.

      4 De in het eerste lid, onder a, genoemde bedragen worden jaarlijks met ingang van 1 januari gewijzigd met het
      percentage waarmee het indexcijfer van de CAO-lonen over de maand oktober daaraan voorafgaand, gepubliceerd door
      het Centraal Bureau voor de Statistiek, afwijkt van het indexcijfer waarop de laatste vaststelling van de bedragen
      is gebaseerd. De gewijzigde bedragen worden door of namens Onze Minister medegedeeld in de Staatscourant.

      5 Het loon, bedoeld in het eerste lid, aanhef en onder a, is ten minste marktconform als bedoeld in
      [artikel 3.30a van het Vreemdelingenbesluit 2000][ref12] en wordt door de werkgever over een periode van ten
      hoogste een maand, bijgeschreven op een bankrekening, bestemd voor girale betaling, op naam van de vreemdeling.


