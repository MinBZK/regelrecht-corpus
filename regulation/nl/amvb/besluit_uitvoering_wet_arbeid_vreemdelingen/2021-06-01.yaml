  - number: 1o
    text: |-
      1 Het verbod, bedoeld in [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref1] is niet van toepassing met
      betrekking tot een vreemdeling die op basis van een arbeidsovereenkomst werkzaamheden verricht voor een onderneming
      die naar het oordeel van onze Minister van Justitie en Veiligheid startend en innovatief is met schaalbare
      bedrijfsactiviteiten, en:

      a. van wie het overeengekomen vaste, naar tijdruimte en in geld vastgestelde loon als vergoeding voor zijn arbeid
      dat hij van de werkgever ontvangt, ten minste € 2.497 bruto per maand bedraagt, waartoe niet wordt gerekend de door
      de werkgever te betalen vakantiebijslag; en

      b. die een medewerkersparticipatie van een door Onze Minister van Justitie en Veiligheid in overeenstemming
      met Onze Minister van Economische Zaken en Klimaat bij ministeriële regeling vast te stellen percentage in de
      onderneming, bedoeld in het eerste lid, aanhef, ontvangt.

      2 De beoordeling of sprake is van een onderneming als bedoeld in het eerste lid geschiedt aan de hand van
      een door Onze Minister van Justitie en Veiligheid bij ministeriële regeling in overeenstemming met Onze
      Minister van Economische Zaken en Klimaat vastgesteld toetsingskader. Er is in ieder geval geen sprake
      van een onderneming als bedoeld in het eerste lid indien de onderneming op het moment van de beoordeling
      arbeid laat verrichten door meer dan vijftien werknemers, die krachtens arbeidsovereenkomst als bedoeld in
      [artikel 610 van Boek 7 van het Burgerlijk Wetboek][ref2] werkzaam zijn. De beoordeling heeft een geldigheidsduur
      van drie jaar na ingang van de eerste verblijfsvergunning ten behoeve van werkzaamheden in het kader van dit
      artikel.

      3 Bij ministeriële regeling, bedoeld in het eerste lid, onderdeel b, worden nadere regels gesteld over de
      medewerkersparticipatie.

      4 Dit artikel is van toepassing op ten hoogste vijf vreemdelingen die werkzaamheden verrichten voor de onderneming,
      bedoeld in het eerste lid.

      5 Het in het eerste lid, onderdeel a, genoemde bedrag wordt jaarlijks met ingang van 1 januari gewijzigd met het
      percentage waarmee het indexcijfer van de CAO-lonen over de maand oktober daaraan voorafgaand, gepubliceerd door
      het Centraal Bureau voor de Statistiek, afwijkt van het indexcijfer waarop de laatste vaststelling van de bedragen
      is gebaseerd. De gewijzigde bedragen worden door of namens Onze Minister medegedeeld in de Staatscourant.

      6 Het loon, bedoeld in het eerste lid, onderdeel a, wordt door de werkgever over een periode van ten hoogste een
      maand, bijgeschreven op een bankrekening, bestemd voor girale betaling, op naam van de vreemdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel610
