  - number: 4c
    text: |-
      Als ernstige overtreding in de zin van [artikel 19d, derde en vijfde lid, van de wet][ref1] wordt aangemerkt de
      overtreding, genoemd in [artikel 4b, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel19d
      [ref2]: https://wetten.overheid.nl/BWBR0007523#Artikel4b
