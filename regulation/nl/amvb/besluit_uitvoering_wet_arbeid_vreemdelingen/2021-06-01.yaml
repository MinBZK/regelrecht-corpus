  - number: 4e
    text: |-
      1 Als soortgelijke verplichtingen en verboden als bedoeld in [artikel 19d, tweede en vierde lid, van de wet][ref1]
      worden aangewezen de verplichtingen en verboden op grond van de [artikelen 2, eerste lid][ref2], [15a][ref3] en
      [18, tweede lid][ref4], zoals dat artikel luidde op 30 juni 2015, van de wet.

      2 Als een soortgelijke overtreding als bedoeld in [artikel 4b, eerste en tweede lid][ref5], wordt beschouwd een
      overtreding van de [artikelen 2, eerste lid][ref6], [15a][ref7] en [18, tweede lid][ref8], zoals dat artikel luidde
      op 30 juni 2015, van de wet.


