  - number: 1j
    text: |-
      Het verbod, bedoeld in [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref1] is voor een periode van
      maximaal één jaar niet van toepassing met betrekking tot een vreemdeling die rechtmatig in Nederland verblijft in
      de zin van [artikel 14 van de Vreemdelingenwet 2000][ref2], onder de beperking «uitwisseling, al dan niet in het
      kader van een verdrag», bedoeld in [artikel 3.4, eerste lid, van het Vreemdelingenbesluit 2000][ref3], indien:

      a. het een au pair betreft die:

      1°. verblijft in een gastgezin, bestaande uit minimaal twee personen, tot wie de vreemdeling niet in
      familierechtelijke betrekking staat tot in de derde graad en voor wie deze niet eerder werkzaamheden heeft
      verricht,

      2°. kost en inwoning geniet van het gastgezin,

      3°. maximaal 8 uur per dag tot een maximum van 30 uur per week in het gastgezin slechts lichte ondersteunende
      huishoudelijke werkzaamheden mag verrichten, waarvoor een aantoonbaar alternatief voorhanden is,

      4°. minimaal 2 dagen per week vrij heeft,

      5°. een dagindeling met het gastgezin schriftelijk en in een voor de au pair begrijpelijke taal heeft vastgesteld
      op grond waarvan de au pair licht ondersteunende huishoudelijke werkzaamheden verricht, en

      6°. kan aantonen dat een verklaring is ondertekend, waaruit blijkt dat het gastgezin zich er van bewust is, dat de
      toezichthouders de bevoegdheid, bedoeld in [artikel 17 van de wet][ref4], hebben;

      b. er sprake is van werkzaamheden in het kader van een Working Holiday Scheme (WHS) of een Working Holiday
      Programme (WHP), dat in een Memorandum of Understanding geformuleerd is dat is goedgekeurd door Onze Minister van
      Sociale Zaken en Werkgelegenheid en Onze Minister van Veiligheid en Justitie;

      c. er sprake is van werkzaamheden in het kader van een door het Nederlands Jeugdinstituut goedgekeurd European
      Voluntary Service-programme; of

      d. er sprake is van deelname aan een door Onze Minister van Veiligheid en Justitie goedgekeurd
      uitwisselingsprogramma van een particuliere uitwisselingsorganisatie en verblijft in het gastgezin, bestaande uit
      minimaal 2 personen voor wie de vreemdeling niet eerder werkzaamheden heeft verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2
