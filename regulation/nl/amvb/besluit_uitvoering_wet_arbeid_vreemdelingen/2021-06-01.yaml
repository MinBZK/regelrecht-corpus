  - number: '3'
    text: |-
      Een tewerkstellingsvergunning of gecombineerde vergunning wordt geweigerd voor werkzaamheden geheel of ten dele
      bestaande in het verrichten van seksuele handelingen met derden of voor derden.
    url: https://wetten.overheid.nl/BWBR0007523/2021-06-01#Artikel3
  - number: 3b
    text: |-
      1 Ten behoeve van vreemdelingen met de Noord-Koreaanse nationaliteit worden geen tewerkstellingsvergunningen of
      gecombineerde vergunningen verleend.

      2 Het eerste lid is niet van toepassing indien het Sanctiecomité, bedoeld in Resolutie 1718 (2006) van
      de Veiligheidsraad van de Verenigde Naties, vooraf per geval goedkeuring geeft voor de tewerkstelling van
      vreemdelingen met de Noord-Koreaanse nationaliteit omdat het dit nodig acht voor de verstrekking van humanitaire
      bijstand, denuclearisatie, of enig ander doel dat verenigbaar is met de doelstellingen van de resoluties van de
      Veiligheidsraad van de Verenigde Naties 1718 (2006), 1874 (2009), 2087 (2013), 2094 (2013), 2270 (2016), 2321
      (2016), 2356 (2017) of 2371 (2017).

      3 In afwijking van [artikel 1][ref1], met uitzondering van de artikelen 1, eerste lid, aanhef en onderdeel a,
      subonderdeel 6°, en de onderdelen b en c, en in afwijking van de [artikelen 1b][ref2], [1d][ref3], [1f][ref4],
      [1h][ref5], [1i][ref6], [1j][ref7], [1k][ref8], [1m][ref9], en [artikel 2][ref10], is het verbod, bedoeld in
      [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref11] van toepassing met betrekking tot de vreemdeling
      met de Noord-Koreaanse nationaliteit.


      [ref1]: https://wetten.overheid.nl/BWBR0007523#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007523#Artikel1b
