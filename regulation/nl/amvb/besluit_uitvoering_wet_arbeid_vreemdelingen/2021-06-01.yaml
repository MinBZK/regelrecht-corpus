    text: |-
      Het verbod, bedoeld in [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref1] is niet
      van toepassing met betrekking tot een vreemdeling die rechtmatig verblijf heeft op grond van
      [artikel 8 van de Vreemdelingenwet 2000][ref2], en die:

      a. gedetineerd is en deelneemt aan de in de inrichting beschikbare arbeid als bedoeld in
      [artikel 47, eerste lid, van de Penitentiaire beginselenwet][ref3];

      b. deelneemt aan een penitentiair programma als bedoeld in [artikel 4 van de Penitentiaire beginselenwet][ref4]; of

      c. arbeid verricht in het kader van een taakstraf in de zin van [artikel 9 van het Wetboek van Strafrecht][ref5].


