  - number: 4j
    text: |-
      1 Op verzoek van de belanghebbende kan een schriftelijke reactie over de openbaarmaking van de gegevens, bedoeld
      in de [artikelen 4g][ref1] en [4h][ref2], van ten hoogste 2.000 leestekens worden gegeven, die zal worden gevoegd
      bij de openbaar te maken gegevens op de website met informatie van de toezichthouder of de door Onze Minister
      aangewezen ambtenaren.

      2 Onderdelen van de schriftelijke reactie die persoonsgegevens, bedrijfsnamen of bedrijfsgegevens van derden dan
      wel strafbare of aanstootgevende uitlatingen bevatten, worden niet op de website gepubliceerd.


