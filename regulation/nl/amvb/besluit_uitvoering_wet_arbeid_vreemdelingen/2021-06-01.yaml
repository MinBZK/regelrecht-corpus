  - number: 2a
    text: |-
      1 In afwijking van [artikel 8, eerste lid, onderdelen a, b, c, f en h, van de Wet arbeid vreemdelingen][ref1] mag
      een vreemdeling als bedoeld in [artikel 8, tweede lid, van die wet][ref2] arbeid verrichten indien:

      a. die vreemdeling een verblijfsvergunning voor bepaalde tijd, bedoeld in
      [artikel 28 van de Vreemdelingenwet 2000][ref3], heeft aangevraagd en welke aanvraag blijkens een
      verklaring van Onze Minister van Justitie tenminste zes maanden in behandeling is, aanspraken op
      voorzieningen geniet voorzien bij of krachtens de [Wet Centraal Orgaan opvang asielzoekers][ref4] of
      een ander wettelijk voorschrift dat aanspraken op voorzieningen regelt en de vreemdeling op basis van
      [artikel 8, onderdelen f of h, van de Vreemdelingenwet 2000][ref5] rechtmatig in Nederland verblijft;

      b. de vreemdeling, bedoeld in onderdeel a, de in de vergunningsaanvraag aangegeven werkzaamheden onder
      marktconforme voorwaarden zal verrichten, en

      c. de vreemdeling, bedoeld in onderdeel a, binnen een tijdsbestek van 52 weken vanaf de aanvang van de
      werkzaamheden een arbeidsperiode van in totaal 24 weken, waarin ten hoogste een arbeidsperiode van 14 weken is
      gelegen waarin werkzaamheden worden verricht als artiest, musicus, filmmedewerker of in de vorm van technische
      ondersteuning van optredens van een artiest of musicus, niet overschrijdt.

      2 Bij ministeriële regeling worden nadere regels worden gesteld met betrekking tot het eerste lid, onderdeel a.


