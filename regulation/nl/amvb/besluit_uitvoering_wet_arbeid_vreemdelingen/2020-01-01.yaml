  - number: 1k.7
    text: |-
      Beëindiging van het traject meldt de werkgever binnen drie maanden na afloop aan het Uitvoeringsinstituut
      werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1k
  - number: 1l
    text: |-
      Het verbod, bedoeld in [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref1] is niet
      van toepassing met betrekking tot een vreemdeling die rechtmatig verblijf heeft op grond van
      [artikel 8 van de Vreemdelingenwet 2000][ref2], en die:


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1l
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 1l.a
    text: |-
      gedetineerd is en deelneemt aan de in de inrichting beschikbare arbeid als bedoeld in
      [artikel 47, eerste lid, van de Penitentiaire beginselenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel47
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1l
