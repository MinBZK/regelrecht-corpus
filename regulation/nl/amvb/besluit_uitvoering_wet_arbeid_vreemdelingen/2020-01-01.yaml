    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1k
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '32'
  - number: 1k.5.d
    text: |-
      indien de werkgever in het kader van een vorig traject niet heeft voldaan aan de meldplicht, bedoeld in het zevende
      lid.
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1k
  - number: 1k.6
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan de toelating van het traject, bedoeld in het tweede lid,
      intrekken:
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1k
  - number: 1k.6.a
    text: |-
      indien de voor verkrijging verstrekte gegevens zodanig onjuist of onvolledig blijken te zijn geweest, dat op de
      aanvraag een andere beslissing zou zijn genomen als bij de beoordeling daarvan de juiste omstandigheden volledig
      bekend waren geweest;
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1k
  - number: 1k.6.b
    text: |-
      indien de werkgever binnen een periode van vijf jaar direct voorafgaande aan het moment waarop de toelating van
      het traject wordt ingetrokken een onherroepelijke bestuurlijke boete is opgelegd op grond van een overtreding als
      bedoeld in:
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1k
  - number: 1k.6.b.1°
    text: |-
      [artikel 10:1 van de Arbeidstijdenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel10
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1k
