---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_uitvoering_wet_arbeid_vreemdelingen
regulatory_layer: AMVB
publication_date: '2022-05-18'
valid_from: '2020-01-01'
bwb_id: BWBR0007523
url: https://wetten.overheid.nl/BWBR0007523/2020-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid van 19 december 1994, Directoraat-Generaal
    voor Algemene Beleidsaangelegenheden nr. ABA/AM/SCV/94/1957b;

    Gelet op de artikelen 3, eerste lid, onder c, 4, tweede lid, onder c en 8, eerste lid, onder e, van de Wet arbeid
    vreemdelingen;

    De Raad van State gehoord (advies van 6 februari 1995, nr. W12.94.0767);

    Gezien het nader rapport van Onze Minister van Sociale Zaken en Werkgelegenheid van 17 augustus 1995, nr. AM/
    AAB/95/9326;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Het verbod, bedoeld in [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref1] is niet van toepassing met
      betrekking tot een vreemdeling:


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '2'
  - number: 1.1.a
    text: 'die zijn hoofdverblijf buiten Nederland heeft en die incidentele arbeid verricht uitsluitend bestaande uit:'
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1
  - number: 1.1.a.1°
    text: |-
      het monteren of repareren van door zijn, buiten Nederland gevestigde, werkgever geleverde werktuigen, machines
      of apparatuur, dan wel het installeren en aanpassen van zijn, buiten Nederland gevestigde, werkgever geleverde
      software of uit het instrueren in het gebruik daarvan;
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1
  - number: 1.1.a.2°
    text: het voeren van zakelijke besprekingen of het sluiten van overeenkomsten met bedrijven en instellingen;
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1
  - number: 1.1.a.3°
    text: |-
      het voorbereiden, inrichten, houden of afbreken van een tentoonstelling of stand voor een buiten Nederland
      gevestigde opdrachtgever;
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1
  - number: 1.1.a.4°
    text: |-
      het verzorgen van rapportages of het maken van documentaires voor een buiten Nederland gevestigd
      publiciteitsmedium;
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1
  - number: 1.1.a.5°
    text: het werkzaam zijn in de huishouding van toeristen;
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1
  - number: 1.1.a.6°
    text: |-
      het deelnemen aan sportwedstrijden, dan wel het werkzaam zijn als vaste persoonlijke begeleider van een deelnemer
      aan sportwedstrijden;
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1
  - number: 1.1.a.7°
    text: |-
      het werkzaam zijn als artiest, vaste persoonlijk begeleider van een artiest, musicus, vaste persoonlijk begeleider
      van een musicus, beeldend kunstenaar, conservator of restaurator;
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1
  - number: 1.1.a.8°
    text: |-
      het onbeloond deelnemen aan proeftrainingen, die in het kader van een sollicitatieprocedure met een werkgever in
      het betaald voetbal schriftelijk zijn overeengekomen en waarvan de exacte periodevoorafgaande aan de feitelijke
      deelname aan de proeftrainingen eveneens schriftelijk is vastgelegd;
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1
  - number: 1.1.a.9°
    text: |-
      het in opdracht van een buitenlandse autoriteit controleren van in Nederland vervaardigde goederen, geproduceerde
      levensmiddelen of diervoerders ten behoeve van de invoer daarvan in het land van die buitenlandse autoriteit, of
      het in opdracht van een buitenlandse autoriteit opstellen, of afgeven van certificaten die vereist zijn voor de
      invoer van in Nederland vervaardigde goederen, geproduceerde levensmiddelen of diervoeders in het land van die
      buitenlandse autoriteit;
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1
  - number: 1.1.a.10°
    text: |-
      het ontvangen van trainingen, dan wel instructies met betrekking tot het gebruik van in Nederland vervaardigde
      goederen en in Nederland te verrichten diensten.
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1
  - number: 1.1.b
    text: |-
      die zijn hoofdverblijf buiten Nederland heeft en geen arbeidsovereenkomst heeft met een in Nederland gevestigde
      werkgever en uitsluitend arbeid verricht op buiten Nederland geregistreerde vervoermiddelen in het internationale
      verkeer;
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1
  - number: 1.1.c
    text: |-
      die zijn hoofdverblijf buiten Nederland heeft en als lid van de bemanning schepelingendienst verricht aan boord van
      een zeeschip in de zin van de [Zeebrievenwet][ref1], voor zover het zeeschip niet uitsluitend als binnenschip wordt
      geëxploiteerd op de Nederlandse binnenwateren, dan wel als werktuig voor weg en waterbouw binnen Nederland;


      [ref1]: https://wetten.overheid.nl/BWBR0001933
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001933
  - number: 1.1.d
    text: die houder is van een door Onze Minister van Buitenlandse Zaken afgegeven legitimatiebewijs;
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1
  - number: 1.1.e
    text: |-
      die als correspondent werkzaam is in dienst van een publiciteitsmedium dat zijn hoofdzetel buiten Nederland
      gevestigd heeft;
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1
  - number: 1.1.f
    text: die als militair behoort tot de krijgsmacht van een vreemde mogendheid;
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1
  - number: 1.1.g
    text: die als burger werkzaam is in dienst van een Geallieerd Hoofdkwartier of de Noordatlantische Verdragsorganisatie;
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1
  - number: 1.1.h
    text: |-
      die als burger werkzaam is in dienst van een vreemde mogendheid ten behoeve van een Geallieerd Hoofdkwartier, de
      Noordatlantische Verdragsorganisatie dan wel een vreemde krijgsmacht;
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1
  - number: 1.1.i
    text: |-
      die als burger werkzaam is in dienst van een vreemde mogendheid ten behoeve van een instelling die in verband met
      de aanwezigheid van een Geallieerd Hoofdkwartier in Nederland is gevestigd;
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1
  - number: 1.1.k
    text: |-
      die met een door of vanwege de Europese Unie, een instituut of instelling voor internationaal onderwijs of
      onderzoek dat door het Ministerie van Onderwijs, Cultuur en Wetenschappen wordt gesubsidieerd, de Nederlandse
      overheid, of een Nederlandse onderwijs- of onderzoeksinstelling verstrekte beurs in Nederland tijdelijk onderzoek
      verricht voor de duur van de beurs en degene die in het kader van een bilaterale of multilaterale overeenkomst
      waarbij Nederland partij is onderzoek verricht voor de duur zoals is bepaald in de bilaterale of multilaterale
      overeenkomst;
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1
  - number: 1.1.l
    text: |-
      die onderwijs geeft of onderzoek verricht aan een universiteit, hogeschool of instelling die gelieerd is aan of
      werkzaam is op het terrein van een universiteit, hogeschool of instelling voor hoger internationaal onderwijs;
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1
  - number: 1.1.m
    text: |-
      die tot Nederland wordt toegelaten om arbeid te verrichten in het kader van een actieprogramma van de Europese Unie
      dat bekend gemaakt is in het publicatieblad van de Europese Unie voor de duur zoals is bepaald in het programma;
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1
  - number: 1.1.n
    text: |-
      die in het kader van een ontwikkelingssamenwerkingsproject voor maximaal vier aaneengesloten weken per kalenderjaar
      naar Nederland komt om in samenwerking met Nederlandse ondernemers, vakspecialisten of experts van het project
      uitzending managers kennis en ervaring op te doen inzake de bedrijfsvoering van bedrijven, en zich door hen laat
      adviseren.
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1
  - number: '1.2'
    text: 'Onder incidentele arbeid als bedoeld in artikel 1, eerste lid, onderdeel a, wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1
  - number: 1.2.a
    text: |-
      onder 1°, 3°, 9° en 10°, arbeid met een maximale duur van 12 aaneengesloten weken binnen een tijdbestek van 36
      weken;
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1
  - number: 1.2.b
    text: onder 2°, arbeid met een maximale duur van 13 weken binnen een tijdsbestek van 52 weken;
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1
  - number: 1.2.c
    text: onder 4°, 5°, 6° en 7°, arbeid met een maximale duur van 6 aaneengesloten weken binnen een tijdbestek van 13 weken;
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1
  - number: 1.2.d
    text: onder 8°, arbeid met een maximale duur van 4 aaneengesloten weken binnen een tijdsbestek van 52 weken.
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1
  - number: '1.3'
    text: |-
      Het eerste lid, onderdeel a, onder 8°, is niet van toepassing met betrekking tot een vreemdeling die de leeftijd
      van 17 jaar nog niet heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1
  - number: 1a
    text: |-
      Het verbod, bedoeld in [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref1], is niet van toepassing met
      betrekking tot een vreemdeling die:


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '2'
  - number: 1a.a
    text: |-
      rechtmatig in Nederland verblijft, in de zin van [artikel 8, onder a, c of l, van de Vreemdelingenwet 2000][ref1],
      dan wel rechtmatig in Nederland verblijft, in de zin van
      [artikel 8, onder f, g of h, van de Vreemdelingenwet 2000][ref2], in verband met een aanvraag van een
      verblijfsvergunning asiel of een aanvraag om voortgezette toelating, en


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 1a.b
    text: |-
      naar het oordeel van het Uitvoeringsinstituut werknemersverzekeringen als vrijwilliger deelneemt aan arbeid die
      gebruikelijk onbetaald wordt verricht, geen winstoogmerk heeft en een algemeen maatschappelijk doel dient.
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1a
  - number: 1b.1
    text: |-
      Het verbod, bedoeld in [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref1], is niet van toepassing
      met betrekking tot een vreemdeling van wie de krachtens de [Vreemdelingenwet 2000][ref2] afgegeven vergunning met
      daarop de aantekening, bedoeld in [artikel 4, eerste lid, van de Wet arbeid vreemdelingen][ref3], is ingetrokken en
      die met instemming van Onze Minister van Veiligheid en Justitie in Nederland verblijft en beschikt over een geldige
      sticker in het paspoort met de aantekening «arbeid is vrij toegestaan».


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011823
      [ref3]: https://wetten.overheid.nl/BWBR0007149#Artikel4
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0011823
      - id: ref3
        bwb_id: BWBR0007149
        artikel: '4'
  - number: 1b.2
    text: |-
      Het verbod, bedoeld in [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref1], is niet van toepassing met
      betrekking tot een vreemdeling:


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '2'
  - number: 1b.2.a
    text: |-
      die in afwachting is van de beslissing op een aanvraag tot het verlengen van de geldigheidsduur van de
      gecombineerde vergunning voor dezelfde werkzaamheden bij dezelfde werkgever;
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1b
  - number: 1b.2.b
    text: |-
      van wie de aanvraag is ontvangen uiterlijk op de dag voor de dag waarop de geldigheidsduur van de gecombineerde
      vergunning verstrijkt, dan wel, indien deze later is ontvangen, indien de termijnoverschrijding de vreemdeling niet
      kan worden toegerekend;
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1b
  - number: 1b.2.c
    text: |-
      die dezelfde werkzaamheden verricht bij dezelfde werkgever als waarvoor de vreemdeling reeds voor de
      verlengingsaanvraag in het bezit is gesteld van een gecombineerde vergunning; en
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1b
  - number: 1b.2.d
    text: |-
      die beschikt over een door Onze Minister van Veiligheid en Justitie afgegeven geldige sticker in het paspoort met
      de aantekening «TWV niet vereist voor specifieke arbeid, andere arbeid toegestaan mits TWV is verleend».
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1b
  - number: 1c
    text: |-
      Het verbod, bedoeld in [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref1], is niet van
      toepassing met betrekking tot een vreemdeling, die beschikt over een vergunning tot verblijf op grond van
      [artikel 28 van de Vreemdelingenwet 2000][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1c
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '28'
  - number: 1d.1
    text: |-
      Het verbod, bedoeld in [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref1], is niet van
      toepassing met betrekking tot een vreemdeling die rechtmatig in Nederland verblijft op grond van
      [artikel 8, onderdelen a, b, c, d, e, k of l, van de Vreemdelingenwet 2000][ref2] of een vreemdeling die in het
      bezit is van een machtiging tot voorlopig verblijf die overeenkomt met het verblijfsdoel «kennismigrant» waarvoor
      een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 14 van de Vreemdelingenwet 2000][ref3] is
      aangevraagd en die:


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1d
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 1d.1.a
    text: |-
      als kennismigrant als bedoeld in [artikel 3.4, eerste lid, van het Vreemdelingenbesluit 2000][ref1] in Nederland
      wordt tewerkgesteld op basis van een arbeidsovereenkomst of een ambtelijke aanstelling en:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1d
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
  - number: 1d.1.a.1°
    text: |-
      van wie het overeengekomen vaste, naar tijdruimte en in geld vastgestelde loon als vergoeding voor zijn arbeid dat
      hij van de werkgever ontvangt, indien hij de leeftijd van dertig jaar niet heeft bereikt, ten minste € 3.381 per
      maand bedraagt, waartoe niet wordt gerekend de door de werkgever te betalen vakantiebijslag, dan wel indien hij
      dertig jaar of ouder is, ten minste € 4.612 per maand bedraagt, waartoe niet wordt gerekend de door de werkgever te
      betalen vakantiebijslag, of
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1d
  - number: 1d.1.a.2°
    text: |-
      die voldoet aan de voorwaarden voor een verblijfsvergunning regulier voor bepaalde tijd onder
      de beperking «het zoeken naar en verrichten van arbeid al dan niet in loondienst» op grond van
      [artikel 3.42 van het Vreemdelingenbesluit 2000][ref1] en van wie het overeengekomen vaste, naar tijdruimte en in
      geld vastgestelde loon als vergoeding voor zijn arbeid dat hij van de werkgever ontvangt, ten minste € 2.423 per
      maand bedraagt, waartoe niet wordt gerekend de door de werkgever te betalen vakantiebijslag,


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1d
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
  - number: 1d.1.b
    text: |-
      in Nederland wordt tewerkgesteld in het kader van het doen van wetenschappelijk onderzoek bij een bekostigde of
      aangewezen onderwijsinstelling of een van overheidswege direct of indirect, geheel of gedeeltelijke bekostigde of
      gesubsidieerde onderzoeksinstelling,
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1d
  - number: 1d.1.c
    text: |-
      in Nederland wordt tewerkgesteld als arts in opleiding tot specialist aan een door de Medisch Specialisten
      Registratie Commissie, de Sociaal-Geneeskundigen Registratie Commissie of de Huisarts en Verpleeghuisarts
      Registratie Commissie aangewezen opleidingsinstituut, of
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1d
  - number: 1d.1.d
    text: |-
      als gastdocent onder de beperking «arbeid als kennismigrant» als bedoeld in
      [artikel 3.4, eerste lid, van het Vreemdelingenbesluit 2000][ref1] in Nederland wordt tewerkgesteld bij een
      universiteit, hogeschool of instelling voor hoger internationaal onderwijs die erkende referent is als bedoeld
      in [artikel 1, onderdeel t, van de Vreemdelingenwet 2000][ref2] en die beschikt over een gastovereenkomst
      met de vreemdeling, of bij een onderzoeksinstelling die gelieerd is aan of werkzaam is op het terrein van een
      universiteit, hogeschool of instelling voor hoger internationaal onderwijs, die erkende referent is en die beschikt
      over een gastovereenkomst met de vreemdeling,


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel1
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1d
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '1'
  - number: 1d.2
    text: |-
      Het verbod, bedoeld in [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref1] is eveneens niet van
      toepassing met betrekking tot een vreemdeling die arbeid verricht als bedoeld in het eerste lid, onder a, b, c of
      d, en daarnaast arbeid als zelfstandige verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1d
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '2'
  - number: 1d.3
    text: |-
      In afwijking van het eerste lid, aanhef en onderdeel a, blijft het verbod, bedoeld in
      [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref1] van toepassing met betrekking tot de vreemdeling
      die:


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1d
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '2'
  - number: 1d.3.a
