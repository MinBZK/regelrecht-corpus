    text: |-
      Het verbod, bedoeld in [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref1] is niet van toepassing
      met betrekking tot een vreemdeling die houder is van een verblijfsvergunning voor bepaalde tijd, als
      bedoeld in [artikel 14 van de Vreemdelingenwet 2000][ref2], verleend onder een beperking verband houdend
      met onderzoek in de zin van richtlijn (EU) 2016/801 van het Europees Parlement en de Raad van 11 mei
      2016 betreffende de voorwaarden voor toegang en verblijf van derdelanders met het oog op onderzoek,
      studie, stages, vrijwilligerswerk, scholierenuitwisseling, educatieve projecten of au-pairactiviteiten
      (herschikking) (PbEU 2016, L 132) of een vreemdeling die in het bezit is van een machtiging tot voorlopig
      verblijf die overeenkomt met voornoemd verblijfsdoel, die in Nederland wordt tewerkgesteld bij een krachtens
      [artikel 2c van de Vreemdelingenwet 2000][ref3] als referent erkende onderzoeksinstelling in de zin van die
      richtlijn.


