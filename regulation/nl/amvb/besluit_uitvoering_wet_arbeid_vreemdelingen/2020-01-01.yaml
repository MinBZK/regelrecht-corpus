  - number: 1j
    text: |-
      Het verbod, bedoeld in [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref1] is voor een periode van
      maximaal één jaar niet van toepassing met betrekking tot een vreemdeling die rechtmatig in Nederland verblijft in
      de zin van [artikel 14 van de Vreemdelingenwet 2000][ref2], onder de beperking «uitwisseling, al dan niet in het
      kader van een verdrag», bedoeld in [artikel 3.4, eerste lid, van het Vreemdelingenbesluit 2000][ref3], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1j
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '3'
  - number: 1j.a
    text: 'het een au pair betreft die:'
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1j
  - number: 1j.a.1°
    text: |-
      verblijft in een gastgezin, bestaande uit minimaal twee personen, tot wie de vreemdeling niet in familierechtelijke
      betrekking staat tot in de derde graad en voor wie deze niet eerder werkzaamheden heeft verricht,
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1j
  - number: 1j.a.2°
    text: kost en inwoning geniet van het gastgezin,
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1j
  - number: 1j.a.3°
    text: |-
      maximaal 8 uur per dag tot een maximum van 30 uur per week in het gastgezin slechts lichte ondersteunende
      huishoudelijke werkzaamheden mag verrichten, waarvoor een aantoonbaar alternatief voorhanden is,
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1j
  - number: 1j.a.4°
    text: minimaal 2 dagen per week vrij heeft,
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1j
  - number: 1j.a.5°
    text: |-
      een dagindeling met het gastgezin schriftelijk en in een voor de au pair begrijpelijke taal heeft vastgesteld op
      grond waarvan de au pair licht ondersteunende huishoudelijke werkzaamheden verricht, en
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1j
  - number: 1j.a.6°
    text: |-
      kan aantonen dat een verklaring is ondertekend, waaruit blijkt dat het gastgezin zich er van bewust is, dat de
      toezichthouders de bevoegdheid, bedoeld in [artikel 17 van de wet][ref1], hebben;


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel17
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1j
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '17'
  - number: 1j.b
    text: |-
      er sprake is van werkzaamheden in het kader van een Working Holiday Scheme (WHS) of een Working Holiday Programme
      (WHP), dat in een Memorandum of Understanding geformuleerd is dat is goedgekeurd door Onze Minister van Sociale
      Zaken en Werkgelegenheid en Onze Minister van Veiligheid en Justitie;
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1j
  - number: 1j.c
    text: |-
      er sprake is van werkzaamheden in het kader van een door het Nederlands Jeugdinstituut goedgekeurd European
      Voluntary Service-programme; of
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1j
  - number: 1j.d
    text: |-
      er sprake is van deelname aan een door Onze Minister van Veiligheid en Justitie goedgekeurd uitwisselingsprogramma
      van een particuliere uitwisselingsorganisatie en verblijft in het gastgezin, bestaande uit minimaal 2 personen voor
      wie de vreemdeling niet eerder werkzaamheden heeft verricht.
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1j
  - number: 1k.1
    text: |-
      Het verbod, bedoeld in [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref1] is niet van toepassing met
      betrekking tot de vreemdeling die werkzaamheden verricht binnen een traject in het kader van het internationale
      handelsverkeer, waarbij de in Nederland gevestigde werkgever de werkzaamheden in opdracht van de in het buitenland
      gevestigde onderneming, werkgever, of opdrachtgever verricht, indien het gaat om werkzaamheden die de vreemdeling
      uitoefent in de hoedanigheid van:


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1k
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '2'
  - number: 1k.1.a
    text: directeur-grootaandeelhouder van een in het buitenland gevestigde onderneming;
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1k
  - number: 1k.1.b
    text: opdrachtnemer van een in het buitenland gevestigde onderneming; of
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1k
  - number: 1k.1.c
    text: werknemer van een in het buitenland gevestigde werkgever.
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1k
  - number: 1k.2
    text: |-
      De werkgever die gebruik wil maken van dit artikel dient daartoe een schriftelijke aanvraag in bij het
      Uitvoeringsinstituut werknemersverzekeringen. Bij het verzoek worden het traject, de bijbehorende werkzaamheden,
      evenals de duur van het traject gemeld, en wordt door de werkgever aangetoond dat hij aan de voorwaarden van dit
      artikel voldoet.
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1k
  - number: 1k.3
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen beslist binnen vijf weken op het verzoek tot toelating van het
      traject, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1k
  - number: 1k.4
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen verleent de toelating van het traject, bedoeld in het tweede lid,
      voor het traject voor de duur van maximaal drie jaar.
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1k
  - number: 1k.5
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan de toelating van het traject, bedoeld in het tweede lid,
      weigeren:
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1k
  - number: 1k.5.a
    text: |-
      indien de activiteit naar het oordeel van het Uitvoeringsinstituut werknemersverzekeringen concurrentie oplevert
      met het prioriteitgenietend aanbod, waarbij wordt meegewogen:
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1k
  - number: 1k.5.a.1°
    text: de aard van het traject;
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1k
  - number: 1k.5.a.2°
    text: de aard van de werkzaamheden die de vreemdeling binnen het traject zal uitvoeren;
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1k
  - number: 1k.5.a.3°
    text: de duur van het traject;
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1k
  - number: 1k.5.a.4°
    text: de waarde van de te leveren of geleverde goederen en diensten;
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1k
  - number: 1k.5.a.5°
    text: het verwachte aantal vreemdelingen dat werkzaamheden zal uitvoeren binnen het traject; en
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1k
  - number: 1k.5.a.6°
    text: de waarde van het traject;
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1k
  - number: 1k.5.b
    text: |-
      indien de werkgever binnen een periode van vijf jaar direct voorafgaande aan de aanvraag een onherroepelijke
      bestuurlijke boete is opgelegd op grond van een overtreding als bedoeld in:
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1k
  - number: 1k.5.b.1°
    text: |-
