        artikel: '47'
  - number: 1l.b
    text: |-
      deelneemt aan een penitentiair programma als bedoeld in [artikel 4 van de Penitentiaire beginselenwet][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel4
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1l
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '4'
  - number: 1l.c
    text: |-
      arbeid verricht in het kader van een taakstraf in de zin van [artikel 9 van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel9
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1l
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '9'
  - number: 1m.1
    text: |-
      Het verbod, bedoeld in [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref1], is niet van toepassing met
      betrekking tot een vreemdeling die beschikt over een verblijfsvergunning regulier onder de beperking in verband met
      studie als bedoeld in [artikel 3.4, eerste lid, van het Vreemdelingenbesluit 2000][ref2] of die rechtmatig verblijf
      heeft op grond van [artikel 8, onder e, van de Vreemdelingenwet 2000][ref3], en arbeid verricht die noodzakelijk
      is voor het opdoen van werkervaring in het kader van een opleiding aan een Academie van Bouwkunst waarbij werk en
      studie worden gecombineerd, mits:


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1m
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 1m.1.a
    text: |-
      de tewerkstelling plaatsvindt op grond van een arbeidsovereenkomst waarin in ieder geval het aantal te werken uren
      per week, de ingangsdatum en duur van het contract en de beloning worden vermeld;
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1m
  - number: 1m.1.b
    text: een tripartiete overeenkomst wordt gesloten tussen de onderwijsinstelling, de werkgever, en de student;
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1m
  - number: 1m.1.c
    text: de tripartiete overeenkomst en arbeidsovereenkomst aanwezig is bij de werkgever op de werkplek;
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1m
  - number: 1m.1.d
    text: de arbeid verricht wordt voor de duur van maximaal 32 uur per week; en
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1m
  - number: 1m.1.e
    text: de student loon ontvangt dat marktconform is.
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1m
  - number: 1m.2
    text: |-
      Dit artikel is van toepassing op de instroom per studiejaar voor de Academies van Bouwkunst gezamenlijk van de
      eerste 50 studenten met de nationaliteit van een staat die niet tot de Europese Unie behoort, die geen partij is
      bij de Overeenkomst betreffende de Europese Economische Ruimte, of niet met de Zwitserse nationaliteit.
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1m
  - number: 1n.1
    text: |-
      Het verbod, bedoeld in [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref1] is niet van toepassing
      met betrekking tot een vreemdeling, voor zover die arbeid verricht in het kader van een overplaatsing binnen een
      onderneming, indien hij:


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel1n
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '2'
  - number: 1n.1.a
    text: |-
      houder is van de verblijfsvergunning regulier voor bepaalde tijd, verleend onder de beperking «overplaatsing binnen
      een onderneming» in de zin van [artikel 3.30d van het Vreemdelingenbesluit 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
