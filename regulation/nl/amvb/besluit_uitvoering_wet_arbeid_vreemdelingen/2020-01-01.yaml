  - number: 4b.1
    text: |-
      Na een herhaling van een overtreding of soortgelijke overtreding wordt een waarschuwing gegeven als bedoeld in
      [artikel 17b, eerste lid, van de wet][ref1] en indien een herhaling van die of een soortgelijke overtreding is
      geconstateerd als bedoeld in dat artikel van de wet, wordt een bevel opgelegd door de daartoe aangewezen ambtenaar
      dat de door hem aangewezen werkzaamheden voor een daarbij aangegeven periode worden stilgelegd dan wel niet mogen
      aanvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel17b
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: 17b
  - number: 4b.2
    text: |-
      Indien een ernstige overtreding is geconstateerd, wordt in afwijking van het eerste lid, een waarschuwing als
      bedoeld in [artikel 17b, eerste lid, van de wet][ref1] gegeven bij de eerste overtreding en wordt, indien opnieuw
      dezelfde of een soortgelijke overtreding is geconstateerd die eveneens ernstig is, een bevel opgelegd door de
      daartoe aangewezen ambtenaar dat de door hem aangewezen werkzaamheden voor een daarbij aangegeven periode worden
      stilgelegd dan wel niet mogen aanvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel17b
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: 17b
  - number: 4b.3
    text: |-
      Als een ernstige overtreding als bedoeld in het eerste of tweede lid wordt aangemerkt de overtreding waarbij ten
      minste 20 werkenden zijn betrokken.
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel4b
  - number: 4b.4
    text: |-
      Indien de aard van de overtreding of de met de overtreding samenhangende omstandigheden dan wel de gevolgen van
      een stillegging van de werkzaamheden daartoe aanleiding geven, kan worden afgezien van een waarschuwing als bedoeld
      in het eerste en tweede lid en kan worden afgezien van een bevel als bedoeld in het eerste en tweede lid. Een
      dergelijke waarschuwing wordt niet gegeven of een dergelijk bevel wordt niet opgelegd, indien de overtreding een
      handelen of nalaten betreft in strijd met de [artikelen 2a, eerste lid][ref1], en [15 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0007149#Artikel15
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: 2a
      - id: ref2
        bwb_id: BWBR0007149
        artikel: '15'
  - number: 4c
    text: |-
      Als ernstige overtreding in de zin van [artikel 19d, derde en vijfde lid, van de wet][ref1] wordt aangemerkt de
      overtreding, genoemd in [artikel 4b, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel19d
      [ref2]: https://wetten.overheid.nl/BWBR0007523#Artikel4b
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel4c
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: 19d
      - id: ref2
        bwb_id: BWBR0007523
        artikel: 4b
  - number: 4d
    text: |-
      Bij ministeriële regeling kan het aantal werkenden, bedoeld in [artikel 4b, derde lid][ref1], worden aangepast.


      [ref1]: https://wetten.overheid.nl/BWBR0007523#Artikel4b
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel4d
    references:
      - id: ref1
        bwb_id: BWBR0007523
        artikel: 4b
  - number: 4e.1
    text: |-
      Als soortgelijke verplichtingen en verboden als bedoeld in [artikel 19d, tweede en vierde lid, van de wet][ref1]
      worden aangewezen de verplichtingen en verboden op grond van de [artikelen 2, eerste lid][ref2], [15a][ref3] en
      [18, tweede lid][ref4], zoals dat artikel luidde op 30 juni 2015, van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel19d
      [ref2]: https://wetten.overheid.nl/BWBR0007149#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0007149#Artikel15a
      [ref4]: https://wetten.overheid.nl/BWBR0007149#Artikel18
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel4e
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: 19d
      - id: ref2
        bwb_id: BWBR0007149
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0007149
        artikel: 15a
      - id: ref4
        bwb_id: BWBR0007149
        artikel: '18'
  - number: 4e.2
    text: |-
      Als een soortgelijke overtreding als bedoeld in [artikel 4b, eerste en tweede lid][ref1], wordt beschouwd een
      overtreding van de [artikelen 2, eerste lid][ref2], [15a][ref3] en [18, tweede lid][ref4], zoals dat artikel luidde
      op 30 juni 2015, van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0007523#Artikel4b
      [ref2]: https://wetten.overheid.nl/BWBR0007149#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0007149#Artikel15a
      [ref4]: https://wetten.overheid.nl/BWBR0007149#Artikel18
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel4e
    references:
      - id: ref1
        bwb_id: BWBR0007523
        artikel: 4b
      - id: ref2
        bwb_id: BWBR0007149
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0007149
        artikel: 15a
      - id: ref4
        bwb_id: BWBR0007149
        artikel: '18'
  - number: 4f.1
    text: |-
      De gegevens, bedoeld in [artikel 19g van de wet][ref1], worden door de toezichthouder of de door Onze Minister
      aangewezen ambtenaren geplaatst op een website met informatie van de toezichthouder of de door Onze Minister
      aangewezen ambtenaren, bedoeld in artikel 19g, eerste lid, van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel19g
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel4f
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: 19g
  - number: 4f.2
    text: |-
      De gegevens, bedoeld in [artikel 19g, eerste lid, van de wet][ref1], blijven drie jaar na de datum van bekendmaking
      van het besluit, bedoeld 19g, eerste lid, van de wet, dan wel na verzending van een brief met de mededeling dat er
      geen overtreding is geconstateerd, beschikbaar op de website.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel19g
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel4f
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: 19g
  - number: 4g.1
    text: |-
      De gegevens, bedoeld in [artikel 19g van de wet][ref1], betreffen:


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel19g
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel4g
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: 19g
  - number: 4g.1.a
    text: de punten waarop is gecontroleerd en de wet of wetten die de grondslag daarvoor bieden;
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel4g
  - number: 4g.1.b
    text: de locatie waar het onderzoek heeft plaatsgevonden; en
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel4g
  - number: 4g.1.c
    text: de datum of periode waarop het onderzoek heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel4g
  - number: 4g.2
    text: |-
      Indien het onderzoek heeft plaatsgevonden bij een normadressaat die is ingeschreven in het handelsregister, bedoeld
      in [artikel 2 van de Handelsregisterwet 2007][ref1], worden in aanvulling op het eerste lid met betrekking tot de
      normadressaat tevens openbaar gemaakt:


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel2
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel4g
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '2'
  - number: 4g.2.a
    text: de naam en vestigingsplaats;
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel4g
  - number: 4g.2.b
    text: het nummer waaronder deze staat ingeschreven in het handelsregister; en
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel4g
  - number: 4g.2.c
    text: de sector of branche waarin deze normadressaat zijn economische activiteiten verricht.
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel4g
  - number: 4g.3
    text: |-
      Indien na afronding van een onderzoek geen overtreding is geconstateerd die leidt tot de besluiten, genoemd in
      [artikel 4h][ref1], wordt bij de gegevens, genoemd in het eerste lid, de opmerking geplaatst dat geen overtreding
      is geconstateerd.


      [ref1]: https://wetten.overheid.nl/BWBR0007523#Artikel4h
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel4g
    references:
      - id: ref1
        bwb_id: BWBR0007523
        artikel: 4h
  - number: 4h.1
    text: |-
      In aanvulling op [artikel 4g, eerste lid][ref1], worden indien een onderzoek door de toezichthouder
      of de door Onze Minister aangewezen ambtenaren, bedoeld in de [artikelen 14, eerste lid][ref2], en
      [19a, eerste lid, van de wet][ref3], wordt gevolgd door een besluit tot het opleggen van een bestuurlijke boete
      als bedoeld in artikel 19a, dan wel door een besluit tot bevel tot staken van de werkzaamheden als bedoeld in
      [artikel 17b, tweede lid, van de wet][ref4], de volgende inspectiegegevens over dat besluit openbaar gemaakt:


      [ref1]: https://wetten.overheid.nl/BWBR0007523#Artikel4g
      [ref2]: https://wetten.overheid.nl/BWBR0007149#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0007149#Artikel19a
      [ref4]: https://wetten.overheid.nl/BWBR0007149#Artikel17b
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel4h
    references:
      - id: ref1
        bwb_id: BWBR0007523
        artikel: 4g
      - id: ref2
        bwb_id: BWBR0007149
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0007149
        artikel: 19a
      - id: ref4
        bwb_id: BWBR0007149
        artikel: 17b
  - number: 4h.1.a
    text: welk besluit is genomen, de artikelen van de wet die de grondslag daarvoor bieden en de datum van dat besluit; en
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel4h
  - number: 4h.1.b
    text: |-
      welke rechtsmiddelen tegen het besluit zijn of kunnen worden aangewend en wat hiervan de uitkomst was, of dat het
      besluit onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel4h
  - number: 4h.2
    text: |-
      Indien het besluit geheel of gedeeltelijk bestaat uit een bevel tot staken van de werkzaamheden, bedoeld in
      [artikel 17b van de wet][ref1], bevat de openbaarmaking tevens de periode waarin de werkzaamheden zijn gestaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel17b
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel4h
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: 17b
  - number: 4i.1
    text: |-
      De openbaarmaking van de gegevens, bedoeld in de [artikelen 4g][ref1] en [4h][ref2], geschiedt niet eerder dan tien
      werkdagen, doch uiterlijk dertig werkdagen na de datum waarop het besluit tot openbaarmaking van deze gegevens aan
      belanghebbende bekend is gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0007523#Artikel4g
      [ref2]: https://wetten.overheid.nl/BWBR0007523#Artikel4h
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel4i
    references:
      - id: ref1
        bwb_id: BWBR0007523
        artikel: 4g
      - id: ref2
        bwb_id: BWBR0007523
        artikel: 4h
  - number: 4i.2
    text: |-
      Indien wordt verzocht om een voorlopige voorziening als bedoeld in [artikel 19g, zevende lid, van de wet][ref1],
      wordt de termijn van dertig werkdagen, bedoeld in het eerste lid, overeenkomstig opgeschort.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel19g
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel4i
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: 19g
  - number: 4j.1
    text: |-
      Op verzoek van de belanghebbende kan een schriftelijke reactie over de openbaarmaking van de gegevens, bedoeld
      in de [artikelen 4g][ref1] en [4h][ref2], van ten hoogste 2.000 leestekens worden gegeven, die zal worden gevoegd
      bij de openbaar te maken gegevens op de website met informatie van de toezichthouder of de door Onze Minister
      aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0007523#Artikel4g
      [ref2]: https://wetten.overheid.nl/BWBR0007523#Artikel4h
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel4j
    references:
      - id: ref1
        bwb_id: BWBR0007523
        artikel: 4g
      - id: ref2
        bwb_id: BWBR0007523
        artikel: 4h
  - number: 4j.2
    text: |-
      Onderdelen van de schriftelijke reactie die persoonsgegevens, bedrijfsnamen of bedrijfsgegevens van derden dan wel
      strafbare of aanstootgevende uitlatingen bevatten, worden niet op de website gepubliceerd.
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel4j
  - number: 4k
    text: |-
      Indien in verband met een beslissing op bezwaar, beroep of hoger beroep wordt vastgesteld dat de gegevens, die op
      grond van [artikel 19g van de wet][ref1], en de [artikelen 4g][ref2] en [4h][ref3] openbaar zijn gemaakt, niet meer
      juist of volledig zijn, worden deze gegevens aangepast, binnen tien werkdagen na ontvangst van de desbetreffende
      beslissing door Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel19g
      [ref2]: https://wetten.overheid.nl/BWBR0007523#Artikel4g
      [ref3]: https://wetten.overheid.nl/BWBR0007523#Artikel4h
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel4k
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: 19g
      - id: ref2
        bwb_id: BWBR0007523
        artikel: 4g
      - id: ref3
        bwb_id: BWBR0007523
        artikel: 4h
  - number: '5'
    text: 'Dit besluit wordt aangehaald als: Besluit uitvoering Wet arbeid vreemdelingen.'
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel5
  - number: '6'
    text: |-
      Dit besluit treedt in werking met ingang van de dag waarop de [Wet arbeid vreemdelingen][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0007149
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007149
