  - number: '3'
    text: |-
      Een tewerkstellingsvergunning of gecombineerde vergunning wordt geweigerd voor werkzaamheden geheel of ten dele
      bestaande in het verrichten van seksuele handelingen met derden of voor derden.
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel3
  - number: 3b.1
    text: |-
      Ten behoeve van vreemdelingen met de Noord-Koreaanse nationaliteit worden geen tewerkstellingsvergunningen of
      gecombineerde vergunningen verleend.
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel3b
  - number: 3b.2
    text: |-
      Het eerste lid is niet van toepassing indien het Sanctiecomité, bedoeld in Resolutie 1718 (2006) van de
      Veiligheidsraad van de Verenigde Naties, vooraf per geval goedkeuring geeft voor de tewerkstelling van
      vreemdelingen met de Noord-Koreaanse nationaliteit omdat het dit nodig acht voor de verstrekking van humanitaire
      bijstand, denuclearisatie, of enig ander doel dat verenigbaar is met de doelstellingen van de resoluties van de
      Veiligheidsraad van de Verenigde Naties 1718 (2006), 1874 (2009), 2087 (2013), 2094 (2013), 2270 (2016), 2321
      (2016), 2356 (2017) of 2371 (2017).
    url: https://wetten.overheid.nl/BWBR0007523/2020-01-01#Artikel3b
  - number: 3b.3
    text: |-
