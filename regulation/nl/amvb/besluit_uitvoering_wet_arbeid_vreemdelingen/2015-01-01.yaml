  - number: 2a.1.b
    text: |-
      de vreemdeling, bedoeld in onderdeel a, de in de vergunningsaanvraag aangegeven werkzaamheden onder marktconforme
      voorwaarden zal verrichten, en
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel2a
  - number: 2a.1.c
    text: |-
      de vreemdeling, bedoeld in onderdeel a, binnen een tijdsbestek van 52 weken vanaf de aanvang van de werkzaamheden
      een arbeidsperiode van in totaal 24 weken, waarin ten hoogste een arbeidsperiode van 14 weken is gelegen waarin
      werkzaamheden worden verricht als artiest, musicus, filmmedewerker of in de vorm van technische ondersteuning van
      optredens van een artiest of musicus, niet overschrijdt.
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel2a
  - number: 2a.2
    text: Bij ministeriële regeling worden nadere regels worden gesteld met betrekking tot het eerste lid, onderdeel a.
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel2a
  - number: '3'
    text: |-
      Een tewerkstellingsvergunning of gecombineerde vergunning wordt geweigerd voor werkzaamheden geheel of ten dele
      bestaande in het verrichten van seksuele handelingen met derden of voor derden.
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel3
  - number: '4'
    text: |-
      Het verbod, bedoeld in [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref1] is gedurende zes en twintig
      weken na het tijdstip van inwerkingtreding van dit besluit niet van toepassing op een vreemdeling die reeds vóór de
      inwerkingtreding daarvan:


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '2'
  - number: 4.a
    text: uitsluitend arbeid verricht op vervoermiddelen in het internationale verkeer;
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel4
  - number: 4.b
    text: als stagiaire hier te lande werkzaam is in het kader van een met een vreemde mogendheid gesloten overeenkomst;
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel4
  - number: 4.c
    text: optreedt als gastdocent aan een Nederlandse instelling voor wetenschappelijk onderwijs;
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel4
  - number: 4.d
    text: is aangesteld om in openbare dienst werkzaam te zijn;
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel4
  - number: 4.e
    text: arbeid verricht in dienst van de Europese Gemeenschap voor Atoomenergie.
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel4
  - number: 4b.1
    text: |-
      Na een herhaling van een overtreding of soortgelijke overtreding wordt een waarschuwing gegeven als bedoeld in
      [artikel 17b, eerste lid, van de wet][ref1] en indien een herhaling van die of een soortgelijke overtreding is
      geconstateerd als bedoeld in dat artikel van de wet, wordt een bevel opgelegd door de daartoe aangewezen ambtenaar
      dat de door hem aangewezen werkzaamheden voor een daarbij aangegeven periode worden stilgelegd dan wel niet mogen
      aanvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel17b
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: 17b
  - number: 4b.2
    text: |-
      Indien een ernstige overtreding is geconstateerd, wordt in afwijking van het eerste lid, een waarschuwing als
      bedoeld in [artikel 17b, eerste lid, van de wet][ref1] gegeven bij de eerste overtreding en wordt, indien opnieuw
      dezelfde of een soortgelijke overtreding is geconstateerd die eveneens ernstig is, een bevel opgelegd door de
      daartoe aangewezen ambtenaar dat de door hem aangewezen werkzaamheden voor een daarbij aangegeven periode worden
      stilgelegd dan wel niet mogen aanvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel17b
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: 17b
  - number: 4b.3
    text: |-
      Als een ernstige overtreding als bedoeld in het eerste of tweede lid wordt aangemerkt de overtreding waarbij ten
      minste 20 werkenden zijn betrokken.
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel4b
  - number: 4b.4
    text: |-
      Indien de aard van de overtreding of de met de overtreding samenhangende omstandigheden dan wel de gevolgen van
      een stillegging van de werkzaamheden daartoe aanleiding geven, kan worden afgezien van een waarschuwing als bedoeld
      in het eerste en tweede lid en kan worden afgezien van een bevel als bedoeld in het eerste en tweede lid. Een
      dergelijke waarschuwing wordt niet gegeven of een dergelijk bevel wordt niet opgelegd, indien de overtreding een
      handelen of nalaten betreft in strijd met de [artikelen 2a, eerste lid][ref1], en [15 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0007149#Artikel15
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel4b
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: 2a
      - id: ref2
        bwb_id: BWBR0007149
        artikel: '15'
  - number: 4c
    text: |-
      Als ernstige overtreding in de zin van [artikel 19d, derde en vijfde lid, van de wet][ref1] wordt aangemerkt de
      overtreding, genoemd in [artikel 4b, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel19d
      [ref2]: https://wetten.overheid.nl/BWBR0007523#Artikel4b
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel4c
    references:
