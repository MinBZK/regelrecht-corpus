      [artikel 28 van de Vreemdelingenwet 2000][ref1], heeft aangevraagd en welke aanvraag blijkens een
      verklaring van Onze Minister van Justitie tenminste zes maanden in behandeling is, aanspraken op
      voorzieningen geniet voorzien bij of krachtens de [Wet Centraal Orgaan opvang asielzoekers][ref2] of
      een ander wettelijk voorschrift dat aanspraken op voorzieningen regelt en de vreemdeling op basis van
      [artikel 8, onderdelen f of h, van de Vreemdelingenwet 2000][ref3] rechtmatig in Nederland verblijft;


