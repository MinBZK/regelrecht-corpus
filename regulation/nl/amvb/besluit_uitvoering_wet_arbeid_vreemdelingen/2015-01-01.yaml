  - number: 2a.1
    text: |-
      In afwijking van [artikel 8, eerste lid, onderdelen a, b en d, van de Wet arbeid vreemdelingen][ref1] mag een
      vreemdeling als bedoeld in [artikel 8, tweede lid, van die wet][ref2] arbeid verrichten indien:


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel8
