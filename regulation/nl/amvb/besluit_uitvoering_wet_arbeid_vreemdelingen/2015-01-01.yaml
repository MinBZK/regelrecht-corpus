preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid van 19 december 1994, Directoraat-Generaal
    voor Algemene Beleidsaangelegenheden nr. ABA/AM/SCV/94/1957b;

    Gelet op de artikelen 3, eerste lid, onder c, 4, tweede lid, onder c en 8, eerste lid, onder e, van de Wet arbeid
    vreemdelingen;

    De Raad van State gehoord (advies van 6 februari 1995, nr. W12.94.0767);

    Gezien het nader rapport van Onze Minister van Sociale Zaken en Werkgelegenheid van 17 augustus 1995, nr. AM/
    AAB/95/9326;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Het verbod, bedoeld in [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref1] is niet van toepassing met
      betrekking tot een vreemdeling:


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '2'
  - number: 1.1.a
    text: 'die zijn hoofdverblijf buiten Nederland heeft en die incidentele arbeid verricht uitsluitend bestaande uit:'
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1
  - number: 1.1.a.1°
    text: |-
      het monteren of repareren van door zijn, buiten Nederland gevestigde, werkgever geleverde werktuigen, machines
      of apparatuur, dan wel het installeren en aanpassen van zijn, buiten Nederland gevestigde, werkgever geleverde
      software of uit het instrueren in het gebruik daarvan;
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1
  - number: 1.1.a.2°
    text: het voeren van zakelijke besprekingen of het sluiten van overeenkomsten met bedrijven en instellingen;
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1
  - number: 1.1.a.3°
    text: |-
      het voorbereiden, inrichten, houden of afbreken van een tentoonstelling of stand voor een buiten Nederland
      gevestigde opdrachtgever;
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1
  - number: 1.1.a.4°
    text: |-
      het verzorgen van rapportages of het maken van documentaires voor een buiten Nederland gevestigd
      publiciteitsmedium;
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1
  - number: 1.1.a.5°
    text: het werkzaam zijn in de huishouding van toeristen;
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1
  - number: 1.1.a.6°
    text: |-
      het deelnemen aan sportwedstrijden, dan wel het werkzaam zijn als vaste persoonlijke begeleider van een deelnemer
      aan sportwedstrijden;
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1
  - number: 1.1.a.7°
    text: |-
      het werkzaam zijn als artiest, vaste persoonlijk begeleider van een artiest, musicus, vaste persoonlijk begeleider
      van een musicus, beeldend kunstenaar, conservator of restaurator;
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1
  - number: 1.1.a.8°
    text: |-
      het onbeloond deelnemen aan proeftrainingen, die in het kader van een sollicitatieprocedure met een werkgever in
      het betaald voetbal schriftelijk zijn overeengekomen en waarvan de exacte periodevoorafgaande aan de feitelijke
      deelname aan de proeftrainingen eveneens schriftelijk is vastgelegd;
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1
  - number: 1.1.a.9°
    text: |-
      het in opdracht van een buitenlandse autoriteit controleren van in Nederland vervaardigde goederen, geproduceerde
      levensmiddelen of diervoerders ten behoeve van de invoer daarvan in het land van die buitenlandse autoriteit, of
      het in opdracht van een buitenlandse autoriteit opstellen, of afgeven van certificaten die vereist zijn voor de
      invoer van in Nederland vervaardigde goederen, geproduceerde levensmiddelen of diervoeders in het land van die
      buitenlandse autoriteit;
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1
  - number: 1.1.a.10°
    text: |-
      het ontvangen van trainingen, dan wel instructies met betrekking tot het gebruik van in Nederland vervaardigde
      goederen en in Nederland te verrichten diensten.
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1
  - number: 1.1.b
    text: |-
      die zijn hoofdverblijf buiten Nederland heeft en geen arbeidsovereenkomst heeft met een in Nederland gevestigde
      werkgever en uitsluitend arbeid verricht op buiten Nederland geregistreerde vervoermiddelen in het internationale
      verkeer;
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1
  - number: 1.1.c
    text: |-
      die zijn hoofdverblijf buiten Nederland heeft en als lid van de bemanning schepelingendienst verricht aan boord van
      een zeeschip in de zin van de [Zeebrievenwet][ref1], voor zover het zeeschip niet uitsluitend als binnenschip wordt
      geëxploiteerd op de Nederlandse binnenwateren, dan wel als werktuig voor weg en waterbouw binnen Nederland;


      [ref1]: https://wetten.overheid.nl/BWBR0001933
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001933
  - number: 1.1.d
    text: die houder is van een door Onze Minister van Buitenlandse Zaken afgegeven legitimatiebewijs;
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1
  - number: 1.1.e
    text: |-
      die als correspondent werkzaam is in dienst van een publiciteitsmedium dat zijn hoofdzetel buiten Nederland
      gevestigd heeft;
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1
  - number: 1.1.f
    text: die als militair behoort tot de krijgsmacht van een vreemde mogendheid;
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1
  - number: 1.1.g
    text: die als burger werkzaam is in dienst van een Geallieerd Hoofdkwartier of de Noordatlantische Verdragsorganisatie;
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1
  - number: 1.1.h
    text: |-
      die als burger werkzaam is in dienst van een vreemde mogendheid ten behoeve van een Geallieerd Hoofdkwartier, de
      Noordatlantische Verdragsorganisatie dan wel een vreemde krijgsmacht;
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1
  - number: 1.1.i
    text: |-
      die als burger werkzaam is in dienst van een vreemde mogendheid ten behoeve van een instelling die in verband met
      de aanwezigheid van een Geallieerd Hoofdkwartier in Nederland is gevestigd;
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1
  - number: 1.1.k
    text: |-
      die met een door of vanwege de Europese Unie, een instituut of instelling voor internationaal onderwijs of
      onderzoek dat door het Ministerie van Onderwijs, Cultuur en Wetenschappen wordt gesubsidieerd, de Nederlandse
      overheid, of een Nederlandse onderwijs- of onderzoeksinstelling verstrekte beurs in Nederland tijdelijk onderzoek
      verricht voor de duur van de beurs en degene die in het kader van een bilaterale of multilaterale overeenkomst
      waarbij Nederland partij is onderzoek verricht voor de duur zoals is bepaald in de bilaterale of multilaterale
      overeenkomst;
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1
  - number: 1.1.l
    text: |-
      die onderwijs geeft of onderzoek verricht aan een universiteit, hogeschool of instelling die gelieerd is aan of
      werkzaam is op het terrein van een universiteit, hogeschool of instelling voor hoger internationaal onderwijs, voor
      de duur van maximaal drie jaar;
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1
  - number: 1.1.m
    text: |-
      die tot Nederland wordt toegelaten om arbeid te verrichten in het kader van een actieprogramma van de Europese Unie
      dat bekend gemaakt is in het publicatieblad van de Europese Unie voor de duur zoals is bepaald in het programma;
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1
  - number: 1.1.n
    text: |-
      die als slachtoffer of getuige-aangever van mensenhandel als bedoeld in
      [artikel 3.48, eerste lid, onder a en b, van het Vreemdelingenbesluit 2000][ref1], beschikt over een
      verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 8, onder a, van de Vreemdelingenwet 2000][ref2],
      onder een beperking verband houdend met de vervolging van mensenhandel als bedoeld in
      [artikel 3.4, eerste lid, onder s, van het Vreemdelingenbesluit 2000][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '3'
  - number: 1.1.o
    text: |-
      die in het kader van een ontwikkelingssamenwerkingsproject voor maximaal vier aaneengesloten weken per kalenderjaar
      naar Nederland komt om in samenwerking met Nederlandse ondernemers, vakspecialisten of experts van het project
      uitzending managers kennis en ervaring op te doen inzake de bedrijfsvoering van bedrijven, en zich door hen laat
      adviseren.
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1
  - number: '1.2'
    text: 'Onder incidentele arbeid als bedoeld in artikel 1, eerste lid, onderdeel a, wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1
  - number: 1.2.a
    text: |-
      onder 1°, 3°, 9° en 10°, arbeid met een maximale duur van 12 aaneengesloten weken binnen een tijdbestek van 36
      weken;
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1
  - number: 1.2.b
    text: onder 2°, arbeid met een maximale duur van 13 aaneengesloten weken binnen een tijdsbestek van 52 weken;
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1
  - number: 1.2.c
    text: onder 4°, 5°, 6° en 7°, arbeid met een maximale duur van 6 aaneengesloten weken binnen een tijdbestek van 13 weken;
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1
  - number: 1.2.d
    text: onder 8°, arbeid met een maximale duur van 4 aaneengesloten weken binnen een tijdsbestek van 52 weken.
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1
  - number: '1.3'
    text: |-
      Het eerste lid, onderdeel a, onder 8°, is niet van toepassing met betrekking tot een vreemdeling die de leeftijd
      van 17 jaar nog niet heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1
  - number: 1a
    text: |-
      Het verbod, bedoeld in [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref1], is niet van toepassing met
      betrekking tot een vreemdeling die:


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '2'
  - number: 1a.a
    text: |-
      rechtmatig in Nederland verblijft, in de zin van [artikel 8, onder a, c of l, van de Vreemdelingenwet 2000][ref1],
      dan wel rechtmatig in Nederland verblijft, in de zin van
      [artikel 8, onder f, g of h, van de Vreemdelingenwet 2000][ref2], in verband met een aanvraag van een
      verblijfsvergunning asiel of een aanvraag om voortgezette toelating, en


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 1a.b
    text: |-
      naar het oordeel van het Uitvoeringsinstituut werknemersverzekeringen als vrijwilliger deelneemt aan arbeid die
      gebruikelijk onbetaald wordt verricht, geen winstoogmerk heeft en een algemeen maatschappelijk doel dient.
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1a
  - number: 1b
    text: |-
      Het verbod, bedoeld in [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref1], is niet van toepassing
      met betrekking tot een vreemdeling van wie de krachtens de [Vreemdelingenwet 2000][ref2] afgegeven vergunning met
      daarop de aantekening, bedoeld in [artikel 4, eerste lid, van de Wet arbeid vreemdelingen][ref3], is ingetrokken
      en die met instemming van Onze Minister van Justitie in Nederland verblijft en beschikt over een geldige sticker in
      het paspoort met de aantekening «arbeid is vrij toegestaan».


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011823
      [ref3]: https://wetten.overheid.nl/BWBR0007149#Artikel4
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0011823
      - id: ref3
        bwb_id: BWBR0007149
        artikel: '4'
  - number: 1c
    text: |-
      Het verbod, bedoeld in [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref1], is niet van
      toepassing met betrekking tot een vreemdeling, die beschikt over een vergunning tot verblijf op grond van
      [artikel 28 van de Vreemdelingenwet 2000][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1c
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '28'
  - number: 1d.1
    text: |-
      Het verbod, bedoeld in [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref1], is niet van
      toepassing met betrekking tot een vreemdeling die rechtmatig in Nederland verblijft op grond van
      [artikel 8, onderdelen a, b, c, d, e, k of l, van de Vreemdelingenwet 2000][ref2] of een vreemdeling die in het
      bezit is van een machtiging tot voorlopig verblijf die overeenkomt met het verblijfsdoel «kennismigrant» waarvoor
      een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 14 van de Vreemdelingenwet 2000][ref3] is
      aangevraagd en die:


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1d
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 1d.1.a
    text: |-
      als kennismigrant als bedoeld in [artikel 3.4, eerste lid, onder d, van het Vreemdelingenbesluit 2000][ref1] in
      Nederland wordt tewerkgesteld op basis van een arbeidsovereenkomst of een ambtelijke aanstelling en:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1d
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
  - number: 1d.1.a.1°
    text: |-
      van wie het overeengekomen vaste, naar tijdruimte en in geld vastgestelde loon als vergoeding voor zijn arbeid dat
      hij van de werkgever ontvangt, indien hij de leeftijd van dertig jaar niet heeft bereikt, ten minste € 3071,- per
      maand bedraagt bedraagt, dan wel indien hij dertig jaar of ouder is, ten minste € 4189,- per maand bedraagt,
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1d
  - number: 1d.1.a.2°
    text: |-
      die binnen een jaar voorafgaand aan de tewerkstelling een geaccrediteerde opleiding aan een hoger
      onderwijsinstelling in Nederland heeft afgerond en van wie het overeengekomen vaste, naar tijdruimte en in geld
      vastgestelde loon als vergoeding voor zijn arbeid dat hij van de werkgever ontvangt, ten minste € 2201,- per maand
      bedraagt,
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1d
  - number: 1d.1.b
    text: |-
      in Nederland wordt tewerkgesteld in het kader van het doen van wetenschappelijk onderzoek bij een bekostigde of
      aangewezen onderwijsinstelling of een van overheidswege direct of indirect, geheel of gedeeltelijke bekostigde of
      gesubsidieerde onderzoeksinstelling,
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1d
  - number: 1d.1.c
    text: |-
      in Nederland wordt tewerkgesteld als arts in opleiding tot specialist aan een door de Medisch Specialisten
      Registratie Commissie, de Sociaal-Geneeskundigen Registratie Commissie of de Huisarts en Verpleeghuisarts
      Registratie Commissie aangewezen opleidingsinstituut, of
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1d
  - number: 1d.1.d
    text: |-
      als gastdocent onder de beperking «arbeid als kennismigrant» als bedoeld in
      [artikel 3.4, eerste lid, onder d, van het Vreemdelingenbesluit 2000][ref1] in Nederland wordt tewerkgesteld
      bij een universiteit, hogeschool of instelling voor hoger internationaal onderwijs die erkende referent is als
      bedoeld in [artikel 1, onderdeel t, van de Vreemdelingenwet 2000][ref2] en die beschikt over een gastovereenkomst
      met de vreemdeling, of bij een onderzoeksinstelling die gelieerd is aan of werkzaam is op het terrein van een
      universiteit, hogeschool of instelling voor hoger internationaal onderwijs, die erkende referent is en die beschikt
      over een gastovereenkomst met de vreemdeling,


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel1
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1d
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '1'
  - number: 1d.2
    text: |-
      In afwijking van het eerste lid, aanhef en onderdeel a, blijft het verbod, bedoeld in
      [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref1] van toepassing met betrekking tot de vreemdeling
      die:


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1d
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '2'
  - number: 1d.2.a
    text: werkzaam is als beroepssporter in het betaald voetbal;
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1d
  - number: 1d.2.b
    text: werkzaam is als geestelijke, of
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1d
  - number: 1d.2.c
    text: |-
      werkzaamheden als bedoeld in [artikel 3][ref1] verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0007523#Artikel3
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1d
    references:
      - id: ref1
        bwb_id: BWBR0007523
        artikel: '3'
  - number: 1d.3
    text: |-
      De in het eerste lid, onder a, genoemde bedragen worden bij ministeriële regeling jaarlijks met ingang van 1
      januari gewijzigd met het percentage waarmee het indexcijfer van de CAO-lonen over de maand oktober daaraan
      voorafgaand, gepubliceerd door het Centraal Bureau voor de Statistiek, afwijkt van het indexcijfer waarop de
      laatste vaststelling van de bedragen is gebaseerd.
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1d
  - number: 1d.4
    text: |-
      Het loon, bedoeld in het eerste lid, aanhef en onder a, is ten minste marktconform als bedoeld in
      [artikel 3.30a van het Vreemdelingenbesluit 2000][ref1] en wordt door de werkgever over een periode van ten hoogste
      een maand, bijgeschreven op een bankrekening, bestemd voor girale betaling, op naam van de vreemdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1d
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
  - number: 1e.1
    text: |-
      Het verbod, bedoeld in [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref1] is niet van toepassing met
      betrekking tot een vreemdeling die in het kader van grensoverschrijdende dienstverlening tijdelijk in Nederland
      arbeid verricht in dienst van een werkgever die buiten Nederland is gevestigd in een andere lidstaat van de
      Europese Unie, een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of
      Zwitserland, mits


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1e
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '2'
  - number: 1e.1.a
    text: |-
      de vreemdeling gerechtigd is als werknemer van deze werkgever de arbeid te verrichten in het land alwaar de
      werkgever gevestigd is,
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1e
  - number: 1e.1.b
    text: |-
      de werkgever de arbeid in Nederland voor de aanvang daarvan schriftelijk aan het Uitvoeringsinstituut
      werknemersverzekeringen heeft gemeld, onder overlegging van een verklaring en bewijsstukken als bedoeld in het
      tweede lid, en
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1e
  - number: 1e.1.c
    text: er geen sprake is van dienstverlening die bestaat uit het ter beschikking stellen van arbeidskrachten.
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1e
  - number: 1e.2
    text: |-
      Bij de melding, bedoeld in het eerste lid, onder b, dienen, indien de desbetreffende vreemdeling beschikt over een
      andere nationaliteit dan die van een lidstaat van de Europese Unie, een staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte of Zwitserland, bewijsstukken te worden verstrekt waaruit blijkt dat de
      vreemdeling gerechtigd is in het land alwaar de werkgever gevestigd is te verblijven en er de arbeid te verrichten,
      en dient te worden overgelegd:
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1e
  - number: 1e.2.a
    text: |-
      een volledig ingevulde en voor de desbetreffende arbeid geldige E101-verklaring, waarbij wordt vermeld waar de
      werknemer in Nederland de arbeid zal verrichten, of
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1e
  - number: 1e.2.b
    text: |-
      een door de werkgever schriftelijk en naar waarheid afgelegde verklaring, opgesteld op een daartoe door het
      Uitvoeringsinstituut werknemersverzekeringen verstrekt formulier, waarin worden vermeld de naam en het adres van de
      werkgever, een aanduiding van de aard van zijn onderneming en de registratiegegevens in het land van vestiging, de
      naam en het adres van degene ten behoeve van wie de dienst wordt verleend, de aard van de te verlenen dienst, waar
      en wanneer de vreemdeling de arbeid zal verrichten, alsmede de identiteitsgegevens van de vreemdeling.
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1e
  - number: 1e.3
    text: |-
      Onder E101-verklaring, als bedoeld in het tweede lid, wordt verstaan: het bewijs, bedoeld in artikel 11 van
      [verordening(EEG)574/72](31972R0574).
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1e
  - number: 1f
    text: |-
      Het verbod, bedoeld in [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref1] is niet van toepassing met
      betrekking tot een vreemdeling die in Nederland:


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1f
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '2'
  - number: 1f.a
    text: |-
      rechtmatig verblijf heeft op grond van [artikel 8, onder e, van de Vreemdelingenwet 2000][ref1] en die als stagiair
      wordt tewerkgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1f
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 1f.b
    text: |-
      beschikt over een verblijfsvergunning regulier voor bepaalde tijd voor studie als bedoeld in
      [artikel 3.4, eerste lid, onder l, van het Vreemdelingenbesluit 2000][ref1] en als stagiair wordt tewerkgesteld; of


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1f
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
  - number: 1f.c
    text: |-
      vóór zijn achttiende levensjaar is gestart met een beroepsopleiding bij een instelling als bedoeld in
      [artikel 1.1.1, onder b, van de Wet educatie en beroepsonderwijs][ref1], of bij een instelling die een
      beroepsopleiding verzorgt waarvan op grond van [artikel 1.4.1 van de Wet educatie en beroepsonderwijs][ref2]
      aan de met goed gevolg afgelegde examens of onderdelen van examens een diploma of
      certificaat is verbonden, en die in het kader van de beroepsopleidende leerweg, bedoeld in
      [artikel 7.2.2, tweede lid, onder a, van de Wet educatie en beroepsonderwijs][ref3] onbezoldigd
      te werk wordt gesteld op grond van een beroepspraktijkvormingsovereenkomst als bedoeld in
      [artikel 7.2.8, tweede lid, van de Wet educatie en beroepsonderwijs][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1f
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref4
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 1g
    text: |-
      Het verbod, bedoeld in [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref1], is niet van toepassing op de
      vreemdeling die:


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1g
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '2'
  - number: 1g.a
    text: |-
      een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 28 van de Vreemdelingenwet 2000][ref1]
      heeft aangevraagd, aanspraken op voorzieningen geniet voorzien bij of krachtens de
      [Wet Centraal Orgaan opvang asielzoekers][ref2] of een ander wettelijk voorschrift dat aanspraken op voorzieningen
      regelt en op basis van [artikel 8, onderdeel f of h, van de Vreemdelingenwet 2000][ref3] rechtmatig in Nederland
      verblijft; dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0006685
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1g
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0006685
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 1g.b
    text: |-
      minderjarig is en houder is van een op grond van
      [artikel 14, eerste lid, onderdeel e, van de Vreemdelingenwet 2000][ref1] verleende verblijfsvergunning voor
      bepaalde tijd onder de beperking medische behandeling, en


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1g
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 1h
    text: |-
      Het verbod, bedoeld in [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref1] is niet van toepassing
      met betrekking tot een vreemdeling die houder is van een verblijfsvergunning voor bepaalde tijd, als bedoeld in
      [artikel 14 van de Vreemdelingenwet 2000][ref2], verleend onder een beperking verband houdend met het verblijf
      als onderzoeker in de zin van richtlijn 2005/71/EG van de Raad van 12 oktober 2005 (PbEU L 289) of een vreemdeling
      die in het bezit is van een machtiging tot voorlopig verblijf die overeenkomt met voornoemd verblijfsdoel, die
      in Nederland wordt tewerkgesteld bij een krachtens [artikel 2c van de Vreemdelingenwet 2000][ref3] als referent
      erkende onderzoeksinstelling in de zin van die richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel2c
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1h
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0011823
        artikel: 2c
  - number: 1i.1
    text: |-
      Het verbod, bedoeld in [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref1] is niet van toepassing met
      betrekking tot een vreemdeling die houder is van een door Onze Minister van Veiligheid en Justitie ter uitvoering
      van artikel 7 van Richtlijn 2009/50/EG van de Raad van 25 mei 2009 betreffende de voorwaarden voor toegang en
      verblijf van onderdanen van derde landen met het oog op een hooggekwalificeerde baan (PbEU L 155) afgegeven
      Europese blauwe kaart, dan wel van een geldige machtiging tot voorlopig verblijf onder een beperking verband
      houdend met verblijf als houder van een Europese blauwe kaart, voor zover die vreemdeling:


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1i
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '2'
  - number: 1i.1.a
    text: |-
      een opleiding aan een geaccrediteerde opleiding aan een instelling voor hoger onderwijs in Nederland of een
      vergelijkbare opleiding aan een buitenlandse hogeronderwijsinstelling met goed gevolg heeft afgerond, en
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1i
  - number: 1i.1.b
    text: van de werkgever een vast bruto-loon voor de arbeid ontvangt van ten minste € 4908 per maand.
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1i
  - number: 1i.2
    text: |-
      Het in het eerste lid, onder b, genoemde bedrag wordt bij ministeriële regeling jaarlijks met ingang van 1 januari
      gewijzigd met het percentage waarmee het indexcijfer van de CAO-lonen over de maand oktober daaraan voorafgaand,
      gepubliceerd door het Centraal Bureau voor de Statistiek, afwijkt van het indexcijfer waarop de laatste
      vaststelling van de bedragen is gebaseerd.
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1i
  - number: 1j
    text: |-
      Het verbod, bedoeld in [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref1] is voor een periode van
      maximaal één jaar niet van toepassing met betrekking tot een vreemdeling die rechtmatig in Nederland verblijft in
      de zin van [artikel 14 van de Vreemdelingenwet 2000][ref2], onder de beperking «uitwisseling, al dan niet in het
      kader van een verdrag», bedoeld in [artikel 3.4, eerste lid, onder n, van het Vreemdelingenbesluit 2000][ref3],
      indien:


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1j
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '3'
  - number: 1j.a
    text: 'het een au pair betreft die:'
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1j
  - number: 1j.a.1°
    text: |-
      verblijft in het gastgezin, bestaande uit minimaal 2 personen, voor wie de vreemdeling niet eerder werkzaamheden
      heeft verricht,
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1j
  - number: 1j.a.2°
    text: kost en inwoning geniet van het gastgezin,
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1j
  - number: 1j.a.3°
    text: |-
      maximaal 8 uur per dag tot een maximum van 30 uur per week in het gastgezin slechts lichte ondersteunende
      huishoudelijke werkzaamheden mag verrichten, waarvoor een aantoonbaar alternatief voorhanden is,
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1j
  - number: 1j.a.4°
    text: minimaal 2 dagen per week vrij heeft, en
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1j
  - number: 1j.a.5°
    text: |-
      een dagindeling met het gastgezin schriftelijk en in een voor de au pair begrijpelijke taal heeft vastgesteld op
      grond waarvan de au pair licht ondersteunende huishoudelijke werkzaamheden verricht;
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1j
  - number: 1j.b
    text: |-
      er sprake is van werkzaamheden in het kader van een Working Holiday Scheme (WHS) of een Working Holiday Programme
      (WHP), dat in een Memorandum of Understanding geformuleerd is dat is goedgekeurd door Onze Minister van Sociale
      Zaken en Werkgelegenheid en Onze Minister van Veiligheid en Justitie;
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1j
  - number: 1j.c
    text: |-
      er sprake is van werkzaamheden in het kader van een door het Nederlands Jeugdinstituut goedgekeurd European
      Voluntary Service-programme; of
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1j
  - number: 1j.d
    text: |-
      er sprake is van deelname aan een door Onze Minister van Veiligheid en Justitie goedgekeurd uitwisselingsprogramma
      van een particuliere uitwisselingsorganisatie en verblijft in het gastgezin, bestaande uit minimaal 2 personen voor
      wie de vreemdeling niet eerder werkzaamheden heeft verricht.
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1j
  - number: 1k.1
    text: |-
      In geval van internationale dienstverlening is het verbod, bedoeld in
      [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref1], niet van toepassing bij levering van goederen door
      een in Nederland gevestigde onderneming in het geval dat het noodzakelijk is dat:


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1k
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '2'
  - number: 1k.1.a
    text: |-
      de buitenlandse afnemer van die goederen de desbetreffende goederen voorafgaand aan de feitelijke levering laat
      controleren, certificeren, inspecteren dan wel anderszins laat onderzoeken door vreemdelingen in dienst van de
      afnemer; of
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1k
  - number: 1k.1.b
    text: |-
      specifieke kennis of ervaring aan de vreemdelingen in dienst van de buitenlandse afnemer wordt doorgegeven, die
      voor de afnemer nodig is om met de geleverde goederen te kunnen werken.
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1k
  - number: 1k.2
    text: 'Het eerste lid is van toepassing onder voorwaarde dat:'
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1k
  - number: 1k.2.a
    text: |-
      de omzet van de onderneming die de goederen levert in het jaar voorafgaand aan de toepassing van dit artikel en
      gedurende de periode van de toepassing van dit artikel ten minste 50 miljoen euro bedraagt;
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1k
  - number: 1k.2.b
    text: |-
      de omzet van de productie van de goederen waarvoor de vreemdeling de in het eerste lid bedoelde arbeid verricht ten
      minste 5 miljoen euro bedraagt; en
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1k
  - number: 1k.2.c
    text: |-
      bij de onderneming die de goederen levert in de periode van 5 jaar voorafgaande aan het
      tijdstip waarop het verzoek aan het Uitvoeringsinstituut werknemersverzekeringen is gedaan,
      geen overtreding van de [Arbeidsomstandighedenwet][ref1], de [Arbeidstijdenwet][ref2], de
      [Wet allocatie arbeidskrachten door intermediairs][ref3], de [Wet arbeid vreemdelingen][ref4] of de
      [Wet minimumloon en minimumvakantiebijslag][ref5] is geconstateerd waarvoor een bestuurlijke boete of een sanctie
      op grond van de [Wet op de economische delicten][ref6] is opgelegd die onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0010346
      [ref2]: https://wetten.overheid.nl/BWBR0007671
      [ref3]: https://wetten.overheid.nl/BWBR0009616
      [ref4]: https://wetten.overheid.nl/BWBR0007149
      [ref5]: https://wetten.overheid.nl/BWBR0002638
      [ref6]: https://wetten.overheid.nl/BWBR0002063
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1k
    references:
      - id: ref1
        bwb_id: BWBR0010346
      - id: ref2
        bwb_id: BWBR0007671
      - id: ref3
        bwb_id: BWBR0009616
      - id: ref4
        bwb_id: BWBR0007149
      - id: ref5
        bwb_id: BWBR0002638
      - id: ref6
        bwb_id: BWBR0002063
  - number: 1k.3
    text: |-
      De werkgever die gebruik wil maken van dit artikel verzoekt dit schriftelijk bij het Uitvoeringsinstituut
      werknemersverzekeringen. Bij het verzoek wordt door de werkgever aangetoond dat hij aan de voorwaarden van dit
      artikel voldoet en geeft hij aan gedurende welke periode hij gebruik wil maken van de toepasselijkheid van dit
      artikel. Het Uitvoeringsinstituut werknemersverzekeringen beslist binnen 5 weken op het verzoek.
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1k
  - number: 1k.4
    text: |-
      Indien de werkgever gedurende de periode dat hij dit artikel toepast niet meer voldoet aan de voorwaarden, bedoeld
      in het tweede lid, onder a, b of c, vervalt de toepasselijkheid van dit artikel van rechtswege met ingang van de
      dag waarop hij niet meer aan de voorwaarden voldoet.
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1k
  - number: 1k.5
    text: |-
      Indien bij de werkgever gedurende de periode dat hij dit artikel toepast een overtreding van de in het tweede
      lid, onder c, genoemde wetten is geconstateerd waarvoor een bestuurlijke boete of een sanctie op grond van de
      [Wet op de economische delicten][ref1] is opgelegd die onherroepelijk is geworden, vervalt de toepasselijkheid van
      dit artikel van rechtswege met ingang van de dag waarop die boete of sanctie onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0002063
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1k
    references:
      - id: ref1
        bwb_id: BWBR0002063
  - number: 1l
    text: |-
      Het verbod, bedoeld in [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref1] is niet
      van toepassing met betrekking tot een vreemdeling die rechtmatig verblijf heeft op grond van
      [artikel 8 van de Vreemdelingenwet 2000][ref2], en die:


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1l
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 1l.a
    text: |-
      gedetineerd is en deelneemt aan de in de inrichting beschikbare arbeid als bedoeld in
      [artikel 47, eerste lid, van de Penitentiaire beginselenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel47
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1l
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '47'
  - number: 1l.b
    text: |-
      deelneemt aan een penitentiair programma als bedoeld in [artikel 4 van de Penitentiaire beginselenwet][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel4
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel1l
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '4'
  - number: 1l.c
    text: |-
      arbeid verricht in het kader van een taakstraf in de zin van [artikel 9 van het Wetboek van Strafrecht][ref1].


