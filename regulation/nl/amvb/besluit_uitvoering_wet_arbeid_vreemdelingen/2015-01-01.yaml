        bwb_id: BWBR0007149
        artikel: 19d
      - id: ref2
        bwb_id: BWBR0007523
        artikel: 4b
  - number: 4d
    text: |-
      Bij ministeriële regeling kan het aantal werkenden, bedoeld in [artikel 4b, derde lid][ref1], worden aangepast.


      [ref1]: https://wetten.overheid.nl/BWBR0007523#Artikel4b
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel4d
    references:
      - id: ref1
        bwb_id: BWBR0007523
        artikel: 4b
  - number: 4e.1
    text: |-
      Als soortgelijke verplichtingen en verboden als bedoeld in [artikel 19d, tweede en vierde lid, van de wet][ref1]
      worden aangewezen de verplichtingen en verboden op grond van de [artikelen 2, eerste lid][ref2], en
      [18, tweede lid, van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel19d
      [ref2]: https://wetten.overheid.nl/BWBR0007149#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0007149#Artikel18
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel4e
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: 19d
      - id: ref2
        bwb_id: BWBR0007149
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0007149
        artikel: '18'
  - number: 4e.2
    text: |-
      Als een soortgelijke overtreding als bedoeld in [artikel 4b, eerste en tweede lid][ref1], wordt beschouwd een
      overtreding van de [artikelen 2, eerste lid][ref2], en [18, tweede lid, van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007523#Artikel4b
      [ref2]: https://wetten.overheid.nl/BWBR0007149#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0007149#Artikel18
    url: https://wetten.overheid.nl/BWBR0007523/2015-01-01#Artikel4e
    references:
