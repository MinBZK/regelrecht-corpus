  - number: 1d
    text: |-
      1 Het verbod, bedoeld in [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref1], is niet
      van toepassing met betrekking tot een vreemdeling die rechtmatig in Nederland verblijft op grond van
      [artikel 8, onderdelen a, b, c, d, e, k of l, van de Vreemdelingenwet 2000][ref2] of een vreemdeling die in het
      bezit is van een machtiging tot voorlopig verblijf die overeenkomt met het verblijfsdoel «kennismigrant» waarvoor
      een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 14 van de Vreemdelingenwet 2000][ref3] is
      aangevraagd en die:

      a. als kennismigrant als bedoeld in [artikel 3.4., eerste lid, onder y, van het Vreemdelingenbesluit 2000][ref4]
      in Nederland wordt tewerkgesteld op basis van een arbeidsovereenkomst of een ambtelijke aanstelling en van wie het
      overeengekomen vaste, naar tijdruimte en in geld vastgestelde loon als vergoeding voor zijn arbeid dat hij van de
      werkgever ontvangt, indien hij de leeftijd van dertig jaar niet heeft bereikt tenminste gelijk is aan het bedrag,
      genoemd in [artikel 3, eerste lid, onderdeel a, van de Ziekenfondswet][ref5], dan wel indien hij dertig jaar of
      ouder is, tenminste € 45.000 per jaar bedraagt, of

      b. in Nederland wordt tewerkgesteld als promovendus bij een bekostigde of aangewezen onderwijsinstelling of een van
      overheidswege direct of indirect, geheel of gedeeltelijke bekostigde of gesubsidieerde onderzoeksinstelling, of

      c. in Nederland wordt tewerkgesteld als postdoctoraal of universitair docent bij een bekostigde of aangewezen
      onderwijsinstelling of een van overheidswege direct of indirect, geheel of gedeeltelijke bekostigde of
      gesubsidieerde onderzoeksinstelling en de leeftijd van dertig jaar nog niet heeft bereikt,

      en van wiens werkgever Onze Minister voor Vreemdelingenzaken & Integratie een door hem bij ministeriële regeling
      vastgestelde verklaring heeft ontvangen betreffende op de werkgever rustende verplichtingen.

      2 In afwijking van het eerste lid, aanhef en onderdeel a, blijft het verbod, bedoeld in
      [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref6] van toepassing met betrekking tot de vreemdeling
      die:

      a. werkzaam is als beroepssporter in het betaald voetbal;

      b. werkzaam is als geestelijke, of

      c. werkzaamheden als bedoeld in [artikel 3][ref7] verricht.

      3 Onze Minister herziet, met ingang van 1 januari van elk kalenderjaar, het bedrag met betrekking tot een
      vreemdeling van dertig jaar of ouder, genoemd in het eerste lid, onderdeel a, met de procentuele wijziging van het
      meest recente indexcijfer der CAO-lonen, gepubliceerd door het Centraal Bureau voor de Statistiek.


