  - number: 1a
    text: |-
      Het verbod, bedoeld in [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref1], is niet van toepassing met
      betrekking tot een vreemdeling die:

      a. rechtmatig in Nederland verblijft, in de zin van
      [artikel 8, onder a, c of l, van de Vreemdelingenwet 2000][ref2], dan wel rechtmatig in Nederland verblijft, in
      de zin van [artikel 8, onder f, g of h, van de Vreemdelingenwet 2000][ref3], in verband met een aanvraag van een
      verblijfsvergunning asiel of een aanvraag om voortgezette toelating, en

      b. naar het oordeel van de Centrale organisatie werk en inkomen als vrijwilliger deelneemt aan arbeid die
      gebruikelijk onbetaald wordt verricht, geen winstoogmerk heeft en een algemeen maatschappelijk doel dient.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2
