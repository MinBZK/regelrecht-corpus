  - number: 1c
    text: |-
      Het verbod, bedoeld in [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref1], is niet van
      toepassing met betrekking tot een vreemdeling, die beschikt over een vergunning tot verblijf op grond van
      [artikel 28 van de Vreemdelingenwet 2000][ref2].


