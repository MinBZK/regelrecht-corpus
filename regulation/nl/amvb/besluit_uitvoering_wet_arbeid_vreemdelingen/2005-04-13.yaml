  - number: '2'
    text: |-
      Een aantekening als bedoeld in [artikel 4, eerste lid, van de Wet arbeid vreemdelingen][ref1] wordt afgegeven aan:

      a. een vreemdeling die beschikt over een verblijfsvergunning voor bepaalde tijd als
      bedoeld in [artikel 14 van de Vreemdelingenwet 2000][ref2], onder een beperking verband
      houdend met gezinshereniging of gezinsvorming met een kennismigrant, als bedoeld in
      [artikel 3.4, eerste lid, onder y, van het Vreemdelingenbesluit 2000][ref3];

      b. een vreemdeling die rechtmatig in Nederland verblijft, in de zin van
      [artikel 8, onder a, van de Vreemdelingenwet 2000][ref4], en is toegelaten voor verblijf bij:

      1. een in Nederland woonachtige Nederlander of gemeenschapsonderdaan die rechtmatig in Nederland verblijft, in de
      zin van [artikel 8, onder e, van de Vreemdelingenwet 2000][ref5], of

      2. een vreemdeling aan wie een aantekening als bedoeld in
      [artikel 4, eerste lid, van de Wet arbeid vreemdelingen][ref6] is afgegeven;

      c.

      d. een vreemdeling, met uitzondering van de vreemdeling, genoemd in onderdeel a, die in het verleden heeft
      beschikt over een krachtens de Vreemdelingenwet of [Vreemdelingenwet 2000][ref7] afgegeven vergunning met daarop
      een aantekening als bedoeld in [artikel 4, eerste lid, van de Wet arbeid vreemdelingen][ref8] en die nadien zijn
      hoofdverblijf niet buiten Nederland heeft gevestigd;

      e. een vreemdeling die rechtmatig in Nederland verblijft, in de zin van
      [artikel 8, onder a, van de Vreemdelingenwet 2000][ref9], indien de vreemdeling gedurende ononderbroken periode
      van zeven jaar direct voorafgaande aan de vergunning tot verblijf werkzaam is geweest op zeeschepen die onder
      Nederlandse vlag varen en in Nederland zijn geregistreerd of op mijnbouwinstallaties op het continentaal plat als
      bedoeld in [artikel 1, onderdelen o en c, van de Mijnbouwwet][ref10].


