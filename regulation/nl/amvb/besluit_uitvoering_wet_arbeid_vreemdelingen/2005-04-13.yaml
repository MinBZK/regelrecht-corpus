  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Sociale Zaken en Werkgelegenheid van 19 december 1994, Directoraat-Generaal
    voor Algemene Beleidsaangelegenheden nr. ABA/AM/SCV/94/1957b;

    Gelet op de artikelen 3, eerste lid, onder c, 4, tweede lid, onder c en 8, eerste lid, onder e, van de Wet arbeid
    vreemdelingen;

    De Raad van State gehoord (advies van 6 februari 1995, nr. W12.94.0767);

    Gezien het nader rapport van Onze Minister van Sociale Zaken en Werkgelegenheid van 17 augustus 1995, nr. AM/
    AAB/95/9326;

    Hebben goedgevonden en verstaan:
