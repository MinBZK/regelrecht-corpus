  - number: 1b
    text: |-
      Het verbod, bedoeld in [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref1], is niet van toepassing
      met betrekking tot een vreemdeling van wie de krachtens de [Vreemdelingenwet 2000][ref2] afgegeven vergunning met
      daarop de aantekening, bedoeld in [artikel 4, eerste lid, van de Wet arbeid vreemdelingen][ref3], is ingetrokken
      en die met instemming van Onze Minister van Justitie in Nederland verblijft en beschikt over een geldige sticker in
      het paspoort met de aantekening «arbeid is vrij toegestaan».


