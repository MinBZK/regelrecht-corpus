  - number: 4a
    text: |-
      Behoudens bij ministeriële regeling te bepalen gevallen wordt een verlenging van de tewerkstellingsvergunning die
      voor minder dan drie jaar is verleend, geweigerd indien:

      a. de geldigheidsduur van de tewerkstellingsvergunning, inclusief de verlenging van de tewerkstellingsvergunning de
      maximale duur van drie jaar heeft bereikt;

      b. de maximale toegestane duur van de arbeid wordt overschreden.
