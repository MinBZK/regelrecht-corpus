  - number: 2a
    text: |-
      1 In afwijking van [artikel 8, eerste lid, onderdelen a, b en d, van de Wet arbeid vreemdelingen][ref1] mag een
      vreemdeling als bedoeld in [artikel 8, tweede lid, van die wet][ref2] arbeid verrichten indien:

      a. die vreemdeling een verblijfsvergunning asiel, bedoeld in [artikel 28 van de Vreemdelingenwet 2000][ref3],
      heeft aangevraagd en deze aanvraag blijkens een verklaring van Onze Minister van Justitie tenminste zes maanden in
      behandeling is, verstrekkingen geniet voorzien bij of krachtens de [Wet Centraal Orgaan opvang asielzoekers][ref4]
      of een ander wettelijk voorschrift dat soortgelijke verstrekkingen regelt en de vreemdeling op basis van
      [artikel 8, onderdelen f of h, van de Vreemdelingenwet 2000][ref5] rechtmatig in Nederland verblijft;

      b. die vreemdeling houder is van een op grond van
      [artikel 14, eerste lid, onderdeel e, van de Vreemdelingenwet 2000][ref6] verleende verblijfsvergunning voor
      bepaalde tijd onder beperking voor verblijf als alleenstaande minderjarige vreemdeling;

      c. die vreemdeling houder is van een op grond van
      [artikel 14, eerste lid, onderdeel e, van de Vreemdelingenwet 2000][ref7] verleende verblijfsvergunning voor
      bepaalde tijd onder de beperking van voortgezet verblijf, verband houdend met eerder verblijf als alleenstaande
      minderjarige vreemdeling;

      d. de vreemdeling, bedoeld in onderdeel a, b en c, de in de vergunningsaanvraag aangegeven werkzaamheden onder
      marktconforme voorwaarden zal verrichten, en

      e. de vreemdeling, bedoeld in onderdeel a en b, binnen een tijdsbestek van 52 weken een arbeidsperiode van in
      totaal twaalf weken niet overschrijdt.

      2 Bij ministeriële regeling worden nadere regels worden gesteld met betrekking tot het eerste lid, onderdeel a.


