articles:
  - number: '1.1'
    text: |-
      Voor de ambtenaren, bedoeld in [artikel 2 van de Politiewet 2012][ref1], die zijn aangesteld voor de uitvoering van
      de politietaak of zijn belast met de opsporing van alle strafbare feiten, gelden de volgende rangen:


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
    url: https://wetten.overheid.nl/BWBR0006981/2025-04-01#Artikel1
