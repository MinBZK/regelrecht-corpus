  - number: '1.2'
    text: Een in het eerste lid eerdergenoemde rang is hoger dan een later genoemde rang.
    url: https://wetten.overheid.nl/BWBR0006981/2025-04-01#Artikel1
  - number: '2.1'
    text: 'De volgende rangen zijn verbonden aan de volgende functies:'
    url: https://wetten.overheid.nl/BWBR0006981/2025-04-01#Artikel2
  - number: 2.1.a
    text: |-
      aspirant voor degene die op grond van de [artikelen 3, eerste, tweede of derde lid][ref1],
      [3bis, eerste lid][ref2], of [3a van het Besluit algemene rechtspositie politie][ref3] is aangesteld als aspirant,
      vrijwilliger-aspirant, ambtenaar in opleiding onderscheidenlijk vrijwillige ambtenaar in opleiding;


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel3bis
      [ref3]: https://wetten.overheid.nl/BWBR0006516#Artikel3a
    url: https://wetten.overheid.nl/BWBR0006981/2025-04-01#Artikel2
    references:
