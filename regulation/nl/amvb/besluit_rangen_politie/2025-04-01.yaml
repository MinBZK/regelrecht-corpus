    text: surveillant van politie voor functies die zijn gewaardeerd op schaal 4 en 5;
    url: https://wetten.overheid.nl/BWBR0006981/2025-04-01#Artikel2
  - number: 2.1.c
    text: agent voor functies die zijn gewaardeerd op schaal 6;
    url: https://wetten.overheid.nl/BWBR0006981/2025-04-01#Artikel2
  - number: 2.1.d
