    text: commissaris voor functies die zijn gewaardeerd op schaal 13 en hoger;
    url: https://wetten.overheid.nl/BWBR0006981/2025-04-01#Artikel2
  - number: 2.1.i
    text: |-
      hoofdcommissaris voor de functie van politiechef van een regionale eenheid en voor de functie van het hoofd van een
      landelijke eenheid;
    url: https://wetten.overheid.nl/BWBR0006981/2025-04-01#Artikel2
  - number: 2.1.j
    text: eerste hoofdcommissaris voor de functie van korpschef.
    url: https://wetten.overheid.nl/BWBR0006981/2025-04-01#Artikel2
  - number: '2.2'
    text: |-
      De functies, bedoeld in het eerste lid, onder b tot en met j, zijn de functies die zijn beschreven en gewaardeerd
      op grond van de regeling, bedoeld in [artikel 6, tweede lid, van het Besluit bezoldiging politie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel6
    url: https://wetten.overheid.nl/BWBR0006981/2025-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '6'
  - number: 2b
    text: |-
      Aan de directeur van de Politieacademie en zijn plaatsvervanger kan op voordracht van Onze Minister bij koninklijk
      besluit de titulaire rang van hoofdcommissaris worden toegekend.
    url: https://wetten.overheid.nl/BWBR0006981/2025-04-01#Artikel2b
  - number: 2c
    text: |-
      Aan de ambtenaar die is aangesteld als ambtenaar als bedoeld in
      [artikel 2, onderdeel a, van de Politiewet 2012][ref1] voor wie de rang van hoofdcommissaris heeft gegolden, kan
      voor de resterende duur van deze aanstelling op voordracht van Onze Minister bij koninklijk besluit de titulaire
      rang van hoofdcommissaris worden toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
    url: https://wetten.overheid.nl/BWBR0006981/2025-04-01#Artikel2c
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '2'
  - number: 2d
    text: |-
      Aan de ambtenaar, bedoeld in [artikel 2, onderdeel a, van de Politiewet 2012][ref1], die is aangesteld in een
      functie waaraan de rang van commissaris is verbonden en die op uitzonderlijke wijze heeft bijgedragen tot de
      behartiging van de belangen van de Nederlandse politie, kan voor de resterende duur van deze aanstelling op
      voordracht van Onze Minister bij koninklijk besluit de titulaire rang van hoofdcommissaris worden toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
    url: https://wetten.overheid.nl/BWBR0006981/2025-04-01#Artikel2d
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '2'
  - number: '3.1'
    text: |-
      De ambtenaar die in een reorganisatie als bedoeld in [artikel 55i Besluit algemene rechtspositie politie][ref1],
      negatief verticaal geplaatst is, behoudt, indien hij daartoe een aanvraag heeft gedaan, de rang die is
      verbonden aan de functie waaraan dezelfde salarisschaal is verbonden als de salarisschaal die is opgenomen in
      [bijlage I van het Besluit bezoldiging politie][ref2] en die voor hem gold voor het tijdstip waarop de negatieve
      verticale plaatsing plaatsvond.


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel55i
      [ref2]: https://wetten.overheid.nl/BWBR0006517
    url: https://wetten.overheid.nl/BWBR0006981/2025-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: 55i
      - id: ref2
        bwb_id: BWBR0006517
  - number: '3.2'
    text: |-
      Indien de ambtenaar, bedoeld in het eerste lid, na de termijn van vijf jaren niet in een functie is geplaatst
      waaraan dezelfde salarisschaal is verbonden als de salarisschaal die is opgenomen in bijlage I van het
      Bezoldigingsreglement politie 1958 en die voor hem gold voor het tijdstip waarop de negatieve verticale plaatsing
      plaatsvond, wordt, indien de ambtenaar daartoe de aanvraag heeft gedaan, de termijn van vijf jaren verlengd.
    url: https://wetten.overheid.nl/BWBR0006981/2025-04-01#Artikel3
  - number: 3a
    text: |-
      In afwijking van [artikel 2, eerste lid][ref1], behoudt de ambtenaar:


      [ref1]: https://wetten.overheid.nl/BWBR0006981#Artikel2
    url: https://wetten.overheid.nl/BWBR0006981/2025-04-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0006981
        artikel: '2'
  - number: 3a.a
    text: |-
      de rang zoals die gold direct voorafgaand aan het besluit tot verplaatsing op grond van
      [artikel 64 van het Besluit algemene rechtspositie politie][ref1], waarbij hij wordt verplaatst naar een functie
      waaraan een lagere rang is verbonden;


      [ref1]: https://wetten.overheid.nl/BWBR0006516#Artikel64
    url: https://wetten.overheid.nl/BWBR0006981/2025-04-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0006516
        artikel: '64'
  - number: 3a.b
    text: |-
      met een aanstelling als bedoeld in [artikel 2, onderdeel a, van de Politiewet 2012][ref1], onverminderd
      [artikel 55ra, tweede lid, van het Besluit algemene rechtspositie politie][ref2], bij een vrijwillige overstap
      naar een administratief technische functie, de rang die gold direct voorafgaand aan het besluit tot plaatsing in de
      administratief technische functie, voor zover de ambtenaar blijft aangesteld als ambtenaar voor de uitvoering van
      de politietaak.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006516#Artikel55ra
    url: https://wetten.overheid.nl/BWBR0006981/2025-04-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0006516
        artikel: 55ra
  - number: '4'
    text: |-
      Dit besluit berust op de [artikelen 48][ref1] en [81, vierde lid, van de Politiewet 2012][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel81
    url: https://wetten.overheid.nl/BWBR0006981/2025-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '48'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '81'
  - number: '5.1'
    text: |-
      De ambtenaar die ten gevolge van het LFNP, bedoeld in
      [artikel 1, eerste lid, van het Besluit bezoldiging politie][ref1], overgaat naar een functie waaraan een
      lagere salarisschaal is verbonden, behoudt, indien hij daartoe de wens te kennen heeft gegeven, de rang die is
      verbonden aan de functie die voor hem gold direct voorafgaand aan het tijdstip waarop de overgang naar een functie
      plaatsvond.


      [ref1]: https://wetten.overheid.nl/BWBR0006517#Artikel1
    url: https://wetten.overheid.nl/BWBR0006981/2025-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006517
        artikel: '1'
  - number: '5.2'
    text: |-
      De ambtenaar die op grond van een uitgangspositie, zijnde de functie en in samenhang daarmee de functiebeschrijving
      en de overige opgedragen werkzaamheden of bijzondere situaties op enig moment vanaf 31 december 2009 tot en met
      31 december 2011, dan wel een toegekende functie op grond van die functie recht had op een rang, behoudt deze rang,
      indien hij daartoe de wens te kennen heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0006981/2025-04-01#Artikel5
  - number: '6'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin het wordt
      geplaatst en werkt terug tot en met 1 april 1994.
    url: https://wetten.overheid.nl/BWBR0006981/2025-04-01#Artikel6
  - number: '7'
    text: 'Dit besluit wordt aangehaald als: Besluit rangen politie.'
    url: https://wetten.overheid.nl/BWBR0006981/2025-04-01#Artikel7
