articles:
  - number: III
    text: |-
      1 In afwijking van [artikel 17, eerste en tweede lid, van het Inschrijvingsbesluit ziekenfondsverzekering][ref1]
      wordt de inschrijving van een verzekerde die op 31 december 1991 bij een ziekenfonds als verzekerde in de zin van
      de [Ziekenfondswet][ref2] stond ingeschreven en ten aanzien van wie in de periode van 31 december 1991 tot en met
      31 december 1994 geen nieuwe inschrijving tot stand is gekomen, met ingang van 1 januari 1995 beëindigd indien vóór
      die datum, de verzekerde schriftelijk heeft meegedeeld na die datum de inschrijving niet te willen voortzetten.

      2 In afwijking van
      [artikel 8, eerste en tweede lid, van het Inschrijvingsbesluit bijzondere ziektekostenverzekering 1992][ref3] wordt
      de inschrijving van een verzekerde die op 31 december 1991 bij een ziekenfonds, een ziektekostenverzekeraar of een
      uitvoerend orgaan als verzekerde in de zin van de [Algemene Wet Bijzondere Ziektekosten][ref4] stond ingeschreven
      en ten aanzien van wie in de periode van 31 december 1991 tot en met 31 december 1994 geen nieuwe inschrijving tot
      stand is gekomen, met ingang van 1 januari 1995 beëindigd indien vóór die datum, de verzekerde schriftelijk heeft
      meegedeeld na die datum de inschrijving niet te willen voortzetten.


