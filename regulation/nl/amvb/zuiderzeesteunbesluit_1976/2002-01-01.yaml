        artikel: '13'
  - number: '2'
    text: |-
      1 Degenen die op het tijdstip van het in werking treden van dit besluit in het genot zijn van een geldelijke
      tegemoetkoming op grond van het [Zuiderzeesteunbesluit 1963][ref1] hebben recht op een geldelijke tegemoetkoming
      volgens dit besluit.

      2 Voorts kan een geldelijke tegemoetkoming worden toegekend aan:

      a. belanghebbenden, die de IJsselmeervisserij na 31 december 1949 doch uiterlijk 31 mei 1976 hebben verlaten,
      tenzij, indien zij houder waren van een krachtens [artikel 17 van de Visserijwet][ref2] (*Stb.* 1931, 410) of
      [artikel 21 van de Visserijwet 1963][ref3] (*Stb.* 312) verleende visvergunning, hun bedrijf na 15 augustus 1966
      bij opvolging is of wordt voortgezet;

      b. weduwen van een belanghebbende, die de leeftijd van 65 jaar hebben bereikt en vóór 1 januari 1913 zijn geboren,
      terwijl haar overleden echtgenoot tot zijn overlijden in het genot was van een geldelijke tegemoetkoming op
      grond van het [Zuiderzeesteunbesluit 1963][ref4] of van dit besluit dan wel, indien hij op het tijdstip van zijn
      overlijden de IJsselmeervisserij zou hebben verlaten, ingevolge het [Zuiderzeesteunbesluit 1963][ref5] of dit
      besluit voor toekenning van zodanige geldelijke tegemoetkoming in aanmerking zou zijn gekomen.

      3 Het bedrag van de geldelijke tegemoetkoming wordt bepaald volgens de [artikelen 3][ref6]-[8][ref7] van dit
      besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0002420
