preamble:
  text: |-
    Wij Juliana, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 30 maart 1976, Hoofddirectie van de Waterstaat,
    nr. RW 22080;

    Overwegende, dat het gewenst is de regeling van de geldelijke tegemoetkoming wegens gederfde inkomsten, zoals deze
    thans is neergelegd in Titel IV van het Zuiderzeesteunbesluit 1963, te vereenvoudigen en door een geheel nieuwe
    regeling te vervangen ten einde op dit punt een meer doelmatige wijze van uitvoering van de Zuiderzeesteunwet (Stb.
    1925, 290) mogelijk te doen zijn;

    Gelet op de artikelen 1 en 13 der Zuiderzeesteunwet;

    De Raad van State gehoord (advies van 14 april 1976, nr. 15);

    Gezien het nader rapport van Onze voornoemde Minister van 28 april 1976, Hoofddirectie van de Waterstaat, nr. RW
    29013;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003032/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      Onze Minister: Onze Minister van Verkeer en Waterstaat;

      een belanghebbende: een belanghebbende, als bedoeld in [artikel 1 van de Zuiderzeesteunwet][ref1], alsmede een op
      grond van artikel 1*a* van die wet met een belanghebbende gelijkgestelde;

      een geldelijke tegemoetkoming: een geldelijke tegemoetkoming, als bedoeld in
      [artikel 13, eerste lid, der Zuiderzeesteunwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001925#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001925#Artikel13
    url: https://wetten.overheid.nl/BWBR0003032/2002-01-01#Artikel1
