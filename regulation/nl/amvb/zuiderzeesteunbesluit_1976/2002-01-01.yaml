  - number: '9'
    text: |-
      De geldelijke tegemoetkoming wordt toegekend door of vanwege Onze Minister. De aanvraag van de geldelijke
      tegemoetkoming moet worden ingediend bij Onze Minister, dan wel bij een door deze aangewezen instantie. Indien
      de feitelijke voorwaarden voor de aanspraak op een geldelijke tegemoetkoming reeds waren vervuld voordat de
      beschikking tot toekenning van de geldelijke tegemoetkoming is genomen, wordt aan die beschikking terugwerkende
      kracht verleend doch niet verder dan tot de eerste van de maand waarin de aanvraag is ingediend.
    url: https://wetten.overheid.nl/BWBR0003032/2002-01-01#Artikel9
  - number: 9a
    text: |-
      1 De geldelijke tegemoetkoming vervalt met ingang van de eerste maand volgend op de datum van overlijden van de
      belanghebbende. De vervaldatum is tevens de datum van ingang van een geldelijke tegemoetkoming aan de weduwe van
      een belanghebbende, bij toekenning daarvan op een aanvraag als bedoeld in [artikel 9][ref1].

      2 De erven van de belanghebbende, die in het genot was van een geldelijke tegemoetkoming, doen binnen veertien
      dagen na diens overlijden mededeling daarvan aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003032#Artikel9
    url: https://wetten.overheid.nl/BWBR0003032/2002-01-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0003032
        artikel: '9'
  - number: '10'
    text: |-
      De beschikking waarbij de geldelijke tegemoetkoming is toegekend kan geheel of gedeeltelijk worden ingetrokken,
      indien de voor de verkrijging van die tegemoetkoming verstrekte gegevens zodanig onjuist blijken, dat op de
      aanvraag anders zou zijn beslist wanneer bij de beoordeling daarvan de juiste gegevens bekend waren geweest.
    url: https://wetten.overheid.nl/BWBR0003032/2002-01-01#Artikel10
  - number: '11'
    text: |-
      Degene te wiens aanzien een beschikking op grond van dit besluit is genomen kan daartegen een bezwaarschrift
      indienen bij Onze Minister. Deze hoort, alvorens op het bezwaarschrift te beschikken, de subcommissie voor de
      bezwaarschriften, bedoeld in artikel 8, derde lid, van het Koninklijk besluit van 18 december 1925 (*Stb.* 475).
    url: https://wetten.overheid.nl/BWBR0003032/2002-01-01#Artikel11
  - number: '13'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad* waarin het
      wordt geplaatst en werkt terug tot 1 mei 1976. Het kan worden aangehaald als: Zuiderzeesteunbesluit 1976.
    url: https://wetten.overheid.nl/BWBR0003032/2002-01-01#Artikel13
