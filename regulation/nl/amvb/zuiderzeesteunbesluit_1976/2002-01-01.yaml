  - number: '3'
    text: |-
      1 De geldelijke tegemoetkoming aan de belanghebbende bedraagt tot en met de maand waarin hij de leeftijd van 65
      jaar heeft bereikt ten hoogste € 530,47 per maand.

      2 Op de in het eerste lid bedoelde geldelijke tegemoetkoming wordt in mindering gebracht het inkomen van de
      belanghebbende uit bedrijf of beroep dan wel uit loondienst, voor zover dat inkomen hoger is dan een bedrag van €
      166,08 per maand. Onder inkomen uit loondienst worden mede begrepen wachtgelden en uitkeringen wegens werkloosheid,
      ziekte of arbeidsongeschiktheid.
    url: https://wetten.overheid.nl/BWBR0003032/2002-01-01#Artikel3
  - number: '4'
    text: |-
      1 Het op de voet van [artikel 3][ref1] bepaalde bedrag van de geldelijke tegemoetkoming wordt beperkt in de
      verhouding waarin de bij de uitoefening van de IJsselmeervisserij in de jaren 1950-1952 gemiddeld daaraan ontleende
      netto-inkomsten per jaar minder dan f 2460 bedroegen dan wel, indien de belanghebbende in loondienst werkzaam was,
      minder dan f 2280 bedroegen.

      2 Indien bijzondere omstandigheden de in het eerste lid bedoelde inkomsten van de belanghebbende buiten zijn wil
      nadelig hebben beïnvloed, waardoor toepassing van het in dat lid bepaalde tot een voor hem onbillijk resultaat zou
      leiden, wordt, in de plaats van hetgeen de aan de IJsselmeervisserij ontleende inkomsten bedroegen in het jaar of
      de jaren waarin die omstandigheden zich hebben voorgedaan, in aanmerking genomen hetgeen die inkomsten bedroegen in
      de jaren 1948 en 1949. Hetzelfde geschiedt indien de belanghebbenden de IJsselmeervisserij in een der jaren 1950,
      1951 of 1952 heeft verlaten.


      [ref1]: https://wetten.overheid.nl/BWBR0003032#Artikel3
    url: https://wetten.overheid.nl/BWBR0003032/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003032
        artikel: '3'
  - number: '5'
    text: |-
      Vanaf de eerste van de maand, volgende op de maand waarin de belanghebbende de leeftijd van 65 jaar heeft bereikt,
      bedraagt de geldelijke tegemoetkoming aan hem ten hoogste EUR 298,- per maand, tenzij hij vóór 31 mei 1932
      eigenaar of hoofd was van een scheepswerf, die voor die datum in hoofdzaak was gegrond op de Zuiderzeevisserij,
      in welk geval de geldelijke tegemoetkoming ten hoogste EUR 366,50 per maand bedraagt. [Artikel 4][ref1] , is van
      overeenkomstige toepassing op eerstgenoemde geldelijke tegemoetkoming.


      [ref1]: https://wetten.overheid.nl/BWBR0003032#Artikel4
    url: https://wetten.overheid.nl/BWBR0003032/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003032
        artikel: '4'
  - number: '6'
    text: |-
      De geldelijke tegemoetkoming aan een weduwe, bedoeld in [artikel 2, tweede lid][ref1], bedraagt ten hoogste
      EUR 234,- per maand. Indien het betreft de weduwe van een belanghebbende, voor wie de geldelijke tegemoetkoming
      ingevolge [artikel 4][ref2] was beperkt of beperkt zou zijn geweest, wordt de geldelijke tegemoetkoming aan die
      weduwe beperkt in dezelfde verhouding als die van haar overleden echtgenoot.


      [ref1]: https://wetten.overheid.nl/BWBR0003032#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003032#Artikel4
    url: https://wetten.overheid.nl/BWBR0003032/2002-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003032
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003032
        artikel: '4'
  - number: '7'
    text: |-
      De geldelijke tegemoetkoming wordt verhoogd met € 46,74 per maand voor ieder minderjarig kind dat:

      a. jonger is dan 16 jaar, dan wel

      b. zestien jaar of ouder is en door lichaams- of zielsgebreken niet in staat is in eigen onderhoud te voorzien,
      terwijl het tot het gezin van belanghebbende behoort of door deze moet worden verzorgd;

      behalve voor zover voor dat kind kinderbijslag of kindertoeslag wordt uitgekeerd of op andere wijze in het
      onderhoud van dat kind wordt voorzien.
    url: https://wetten.overheid.nl/BWBR0003032/2002-01-01#Artikel7
  - number: '8'
    text: |-
      1 Tot en met het jaar 1978 wordt het in [artikel 3][ref1] genoemde bedrag en tot en met het jaar 1979
      worden de in de [artikelen 5][ref2], [6][ref3] en [7][ref4] genoemde bedragen door Onze Minister
      verhoogd of verlaagd met ingang van de datum waarop en in de mate waarin het ouderdomspensioen, bedoeld in
      [artikel 8, tweede lid, van de Algemene Ouderdomswet][ref5], met toepassing van artikel 9, tweede, derde en zesde
      lid van die wet wordt verhoogd of verlaagd.

      2 Na het jaar 1979 worden de in de [artikelen 5][ref6] en [6][ref7] bedoelde bedragen, zoals zij met toepassing
      van het eerste lid zijn gewijzigd, jaarlijks per 1 juni door Onze Minister gewijzigd.

      3 De in het tweede lid bedoelde jaarlijkse wijziging geschiedt met hetzelfde percentage als waarmee het naar
      de stand van 31 december van het voorafgaande kalenderjaar door het Centraal Bureau voor de Statistiek op basis
      van het jaar 1972 (na 1 juni 1984: op basis van het jaar 1980) berekende en voor de eerste maal al dan niet
      voorlopig in het "Statistisch Bulletin van het Centraal Bureau voor de Statistiek" gepubliceerde indexcijfer
      van de regelingslonen per week en per maand van volwassen werknemers, particulier bedrijf, (inclusief spaarloon,
      vakantietoeslag en andere uitkeringen), naar boven of beneden afwijkt van het overeenkomstig indexcijfer per 31
      december van het daaraan voorafgaande kalenderjaar.

      4 De op de voet van voorgaande leden verkregen bedragen worden naar boven afgerond op halve euro’s.


