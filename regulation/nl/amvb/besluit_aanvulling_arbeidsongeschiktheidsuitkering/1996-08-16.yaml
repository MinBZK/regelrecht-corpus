  - number: '3'
    text: De duur van de uitkering bedraagt zes maanden.
    url: https://wetten.overheid.nl/BWBR0002931/1996-08-16#Artikel3
  - number: '4'
    text: |-
      1 De uitvoering van dit besluit wordt opgeschort:

      a. gedurende de tijd, waarin de betrokkene aanspraak heeft op zijn laatstelijk genoten bezoldiging of loon;

      b. indien en zolang de betrokkene aanspraak heeft op een invaliditeitspensioen, onderscheidenlijk een uitkering
      overeenkomstig de normen van de [Wet op de arbeidsongeschiktheidsverzekering][ref1], berekend naar een algemene
      invaliditeit van 80% of hoger;

      c. met ingang van de dag, waarop de onvrijwillige werkloosheid eindigt.

      2 De uitvoering van dit besluit wordt in het geval, bedoeld in het vorige lid, onder *c*, onverminderd het
      overigens in dit besluit bepaalde, hervat bij opnieuw intredende onvrijwillige werkloosheid binnen 12 maanden na
      het tijdstip van ingang van het recht op uitkering krachtens dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0002931/1996-08-16#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002524
  - number: '5'
    text: |-
      Het recht op uitkering vervalt:

      a. met ingang van de eerste dag van de maand, waarin de betrokkene de leeftijd van 65 jaar bereikt;

      b. met ingang van de dag waarop de betrokkene door eigen schuld of toedoen niet als onvrijwillig werkloos kan
      worden aangemerkt;

      c. met ingang van de dag, waarop vaststaat dat de betrokkene, wegens het aanvaard hebben van een nieuwe betrekking
      bij arbeidsongeschiktheid aanspraak zal kunnen maken op arbeidsongeschiktheidsuitkering;

      d. met ingang van de dag, waarop vaststaat dat de betrokkene, wegens het aanvaard hebben van een nieuwe betrekking
      bij onvrijwillige werkloosheid aanspraak zal kunnen maken op wachtgeld.
    url: https://wetten.overheid.nl/BWBR0002931/1996-08-16#Artikel5
  - number: '6'
    text: |-
      1 De uitkering bedraagt het verschil tussen het bedrag dat aan invaliditeitspensioen, onderscheidenlijk
      aan uitkering overeenkomstig de normen van de [Wet op de arbeidsongeschiktheidsverzekering][ref1] wordt
      ontvangen dan wel kan worden ontvangen, en het bedrag dat bij een algemene invaliditeit van 80% of hoger aan
      invaliditeitspensioen, inbegrepen een daarop te verlenen aanvulling, onderscheidenlijk uitkering zou zijn
      ontvangen.

      2 Onder het bedrag dat aan invaliditeitspensioen wordt ontvangen worden mede begrepen het bedrag, dat ingevolge
      de Algemene burgerlijke pensioenwet als aanvulling op dat pensioen wordt ontvangen en het bedrag aan uitkering op
      grond dan wel op de voet van [artikel 45 van het Algemeen Rijksambtenarenreglement][ref2] dan wel artikel 33*b* van
      het Arbeidsovereenkomstenbesluit.

      3 Indien ter zake van de uitkering premie ingevolge de [Algemene Ouderdomswet][ref3] en de
      [Algemene nabestaandenwet][ref4] wordt geheven, wordt de uitkering verhoogd met 7,1% van het bedrag der uitkering,
      waarover die premie wordt geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0002221
      [ref4]: https://wetten.overheid.nl/BWBR0007795
