preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken van 11 januari 1973, nr. AW73/U14, Directoraat-Generaal
    Overheidspersoneelsbeleid, Directie Overheidspersoneelszaken, Hoofdafdeling Pensioenen en Wachtgelden;

    gelet op de artikelen 125, eerste lid, en 134, eerste lid, van de Ambtenarenwet 1929 en op artikel A 4 van de
    Algemene burgerlijke pensioenwet;

    de Raad van State gehoord (advies van 14 februari 1973, nr. 6);

    gezien het nader rapport van Onze Minister van Binnenlandse Zaken van 3 juli 1974, nr. AW74/U563, Directoraat-
    Generaal Overheidspersoneelsbeleid, Directie Overheidspersoneelszaken, Hoofdafdeling Pensioenen en Wachtgelden;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002931/1996-08-16#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. Onze Minister: Onze Minister van Binnenlandse Zaken;

      b. wachtgeld: elke uitkering ter zake van onvrijwillige werkloosheid;

      c. arbeidsongeschiktheidsuitkering: elke uitkering ter zake van arbeidsongeschiktheid;

      d. invaliditeitspensioen: invaliditeitspensioen krachtens de Algemene burgerlijke pensioenwet;

      e. betrokkene:

      1. de gewezen ambtenaar in de zin van het [Algemeen Rijksambtenarenreglement][ref1], met uitzondering van hem
      op wie hoofdstuk VI van dat reglement niet van toepassing was, aan wie wegens blijvende ongeschiktheid voor het
      vervullen van zijn betrekking ontslag is verleend met dadelijk ingaand recht op invaliditeitspensioen;

      2. de gewezen ambtenaar in de zin van het [Algemeen Rijksambtenarenreglement][ref2], die op grond
      van artikel 42 van dat reglement aanspraak heeft op een uitkering overeenkomstig de normen van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref3] en aan het hem verleende ontslag geen aanspraak op wachtgeld
      kon ontlenen;

      3. de gewezen werknemer in de zin van het Arbeidsovereenkomstenbesluit wiens arbeidsovereenkomst met dadelijk
      ingaand recht op invaliditeitspensioen is beëindigd door opzegging wegens ongeschiktheid uit hoofde van ziekten of
      gebreken voor het vervullen van zijn betrekking, tenzij hij ter zake van het vervullen van die betrekking werknemer
      was in de zin van de [Werkloosheidswet][ref4];

      4. de gewezen werknemer in de zin van het Arbeidsovereenkomstenbesluit, die op grond van
      artikel 32*c* van dat besluit aanspraak heeft op een uitkering overeenkomstig de normen van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref5] en aan de beëindiging der arbeidsovereenkomst geen aanspraak op
      wachtgeld kon ontlenen;

      5. de gewezen burgemeester, aan wie wegens blijvende ongeschiktheid voor het vervullen van zijn ambt ontslag is
      verleend met dadelijk ingaand recht op invaliditeitspensioen;

      6. de gewezen burgemeester, die op grond van het [Rechtspositiebesluit burgemeesters][ref6] op de voet van
      [artikel 42 van het Algemeen Rijksambtenarenreglement][ref7] aanspraak heeft op een uitkering overeenkomstig de
      normen van de [Wet op de arbeidsongeschiktheidsverzekering][ref8] en aan het hem verleende ontslag geen aanspraak
      op wachtgeld kon ontlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0001950
