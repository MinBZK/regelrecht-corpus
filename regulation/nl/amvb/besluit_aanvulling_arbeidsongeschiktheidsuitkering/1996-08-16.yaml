  - number: '7'
    text: |-
      Een uitkering op de voet van dit besluit wordt niet aangemerkt als wachtgeld in de zin van de Algemene burgerlijke
      pensioenwet.
    url: https://wetten.overheid.nl/BWBR0002931/1996-08-16#Artikel7
  - number: '8'
    text: |-
      Bij overlijden van een betrokkene die op het tijdstip van overlijden een uitkering krachtens dit besluit genoot
      wordt een op basis van het bedrag van de uitkering op dat tijdstip berekende smartegelduitkering verleend:

      a. ter grootte van tweemaal de maandelijkse uitkering aan de weduwe of weduwnaar van betrokkene van wie hij
      niet duurzaam gescheiden leefde, indien de overledene een invaliditeitspensioen had; onder weduwe of weduwnaar
      wordt mede begrepen de nabestaande levenspartner met wie de niet-gehuwde betrokkene samenwoonde en - met het
      oogmerk duurzaam samen te leven - een gemeenschappelijke huishouding voerde op basis van een notarieel verleden
      samenlevingscontract bevattende de wederzijdse rechten en verplichtingen ter zake van die samenwoning en
      gemeenschappelijke huishouding; tegelijkertijd kan slechts één persoon als levenspartner worden aangemerkt; Onze
      Minister kan verlangen dat een schriftelijke verklaring van een notaris wordt overgelegd waaruit blijkt van het
      bestaan van dat samenlevingscontract; bij ontstentenis van een weduwe of weduwnaar van wie de overledene niet
      duurzaam gescheiden leefde, geschiedt de uitkering ten behoeve van de minderjarige wettige of natuurlijke kinderen
      van de overledene, of minderjarige kinderen waarover de overledene ten tijde van het overlijden de pleegouderlijke
      zorg droeg; onder pleegouderlijke zorg wordt verstaan de zorg voor het onderhoud en de opvoeding van het kind,
      als ware het een eigen kind, onafhankelijk van enige verplichting daartoe of van het genieten van een vergoeding
      daarvoor; ontbreken ook zodanige kinderen, dan geschiedt de hierbedoelde uitkering aan degenen die geheel of
      grotendeels afhankelijk waren van de inkomsten van de overledene;

      b. op de voet van het bepaalde omtrent smartegelduitkeringen in het [Algemeen Rijksambtenarenreglement][ref1],
      onderscheidenlijk in het Arbeidsovereenkomstenbesluit, bij overlijden van een rechthebbende op een uitkering
      overeenkomstig de normen van de [Wet op de arbeidsongeschiktheidsverzekering][ref2], indien de overledene een
      zodanige uitkering genoot.


      [ref1]: https://wetten.overheid.nl/BWBR0001950
      [ref2]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0002931/1996-08-16#Artikel8
