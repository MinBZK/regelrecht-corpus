  - number: '9'
    text: |-
      De bepalingen van dit besluit en de krachtens dit besluit gestelde regelen zijn voor zoveel mogelijk van toepassing
      ten aanzien van:

      a. de gewezen ambtenaar en de gewezen werknemer in de zin van dit besluit die ter zake van zijn ontslag recht heeft
      op wachtgeld krachtens het [Rijkswachtgeldbesluit 1959][ref1] of de [Uitkeringsregeling 1966][ref2] en wiens recht
      op wachtgeld eindigt wegens het ontstaan van recht op invaliditeitspensioen wegens blijvende ongeschiktheid voor
      het vervullen van de betrekking, waaruit hij met recht op wachtgeld is ontslagen;

      b. de gewezen ambtenaar en de gewezen arbeidscontractant in de zin van dit besluit, die als herplaatsbaar
      verklaarde ambtenaar in de zin van de Algemene burgerlijke pensioenwet ter zake van zijn ontslag recht heeft op
      herplaatsingswachtgeld en wiens invaliditeitspensioen ingaat binnen 6 maanden na het hem verleende ontslag;

      met dien verstande, dat de duur van de uitkering van de in dit artikel bedoelde betrokkene wordt verminderd met de
      duur van het tijdvak, waarin recht bestond op wachtgeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002326
      [ref2]: https://wetten.overheid.nl/BWBR0002537
    url: https://wetten.overheid.nl/BWBR0002931/1996-08-16#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002326
      - id: ref2
        bwb_id: BWBR0002537
  - number: '10'
    text: |-
      1 Uitkeringen krachtens dit besluit worden door Onze Minister toegekend op daartoe door of namens de betrokkene
      ingediend verzoek.

      2 De rechthebbende op een uitkering is verplicht alle gegevens te verschaffen die voor de uitvoering van dit
      besluit door Onze Minister noodzakelijk worden geacht en is voorts verplicht zich te gedragen naar door Onze
      Minister gegeven voorschriften.
    url: https://wetten.overheid.nl/BWBR0002931/1996-08-16#Artikel10
  - number: '11'
    text: |-
      Onze Minister kan regelen stellen ter voorkoming of beperking van samenloop van uitkeringen krachtens dit besluit,
      alsmede van uitkering krachtens dit besluit met andere uitkeringen.
    url: https://wetten.overheid.nl/BWBR0002931/1996-08-16#Artikel11
  - number: '12'
    text: |-
      1 Een betrokkene als bedoeld in [artikel 1, onder ][ref1], die bezwaar heeft tegen een beslissing welke te zijnen
      aanzien ter uitvoering van dit besluit is genomen, kan tegen die beslissing bezwaar maken.

      2 [Artikel 3:45 van de Algemene wet bestuursrecht][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002931#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel345
    url: https://wetten.overheid.nl/BWBR0002931/1996-08-16#Artikel12
    references:
