  - number: '2'
    text: |-
      1 Een betrokkene heeft, indien hij onvrijwillig werkloos is, met ingang van de dag waarop het recht
      op invaliditeitspensioen, onderscheidenlijk het recht op uitkering overeenkomstig de normen van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref1] ingaat, recht op een uitkering.

      2 Voor de toepassing van het besluit wordt geen onvrijwillige werkloosheid aangenomen, indien betrokkene werkzaam
      blijft in een gelijktijdig vervulde volledige of als volledig aan te merken betrekking.

      3 In afwijking van het eerste lid heeft een betrokkene geen recht op een uitkering
      indien zijn invaliditeitspensioen of uitkering overeenkomstig de normen van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref2] is gebaseerd op de bepalingen van de Algemene burgerlijke
      pensioenwet of de [Wet op de Arbeidsongeschiktheidsverzekering][ref3] zoals deze zijn komen te luiden na de
      inwerkingtreding van de [Wet terugdringing beroep op de arbeidsongeschiktheidsregelingen][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0002524
      [ref3]: https://wetten.overheid.nl/BWBR0002524
      [ref4]: https://wetten.overheid.nl/BWBR0006072
