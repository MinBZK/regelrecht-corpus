        artikel: 3:45
  - number: '13'
    text: |-
      Voor de toepassing van dit besluit worden onder ambtenaar in de zin van het
      [Algemeen Rijksambtenarenreglement][ref1], onderscheidenlijk werknemer in de zin van het
      Arbeidsovereenkomstenbesluit mede begrepen leden van het personeel van rijksuniversiteiten, rijkshogescholen en
      academische ziekenhuizen, wier rechtspositie door de bepalingen van genoemd reglement, onderscheidenlijk genoemd
      besluit wordt beheerst.


      [ref1]: https://wetten.overheid.nl/BWBR0001950
    url: https://wetten.overheid.nl/BWBR0002931/1996-08-16#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0001950
  - number: '14'
    text: |-
      Dit besluit vindt geen toepassing ten aanzien van hen die zijn ontslagen voor het tijdstip van de inwerkingtreding
      van dit besluit.
    url: https://wetten.overheid.nl/BWBR0002931/1996-08-16#Artikel14
  - number: '15'
    text: |-
      Dit besluit, dat kan worden aangehaald als "Besluit aanvulling arbeidsongeschiktheidsuitkering" treedt in werking
      met ingang van 1 september 1974.
    url: https://wetten.overheid.nl/BWBR0002931/1996-08-16#Artikel15
