  - number: 3.3.a
    text: |-
      voor aansluitingen voor levering van warmte met een vermogen tot en met 3 kilowatt vastgesteld met inachtneming van
      de formule: VK = BT
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel3
  - number: 3.3.b
    text: |-
      voor aansluitingen voor levering van warmte met een vermogen vanaf 3 kilowatt vastgesteld met inachtneming van
      de formule: VK = BT + O* (AV – 3 kW) waarbij: VK = de vaste kosten voor levering van warmte in het jaar t; BT
      = basistarief voor aansluitingen voor levering van warmte met een vermogen tot en met 3 kilowatt; O  = opslag
      per kilowatt extra vermogen van de aansluiting voor aansluitingen voor levering van warmte met een vermogen
      van meer dan 3 kilowatt, en AV = aansluitvermogen van een aansluiting voor levering van warmte volgens de
      leveringsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel3
  - number: '3.4'
    text: |-
      Aan een verbruiker met een centrale aansluiting voor levering van warmte met een vermogen van meer dan 100 kilowatt
      als bedoeld in [artikel 1 van de wet][ref1] wordt een opslag opgelegd voor iedere kilowatt vermogen boven de 100
      kilowatt.


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel1
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: '1'
  - number: '3.5'
    text: |-
      De opslag wordt vastgesteld door de Autoriteit Consument en Markt met in achtneming van de volgende formule:
      waarbij: VK = de vaste kosten van een aansluiting voor levering van warmte met een vermogen tot en met 100 kilowatt
      berekend met in achtneming van de formule, bedoeld in het eerste lid, en VK = de vaste kosten van een aansluiting
      voor levering van warmte met een vermogen van 1000 kilowatt berekend met in achtneming van de formule, bedoeld in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel3
  - number: '3.6'
    text: |-
      Voor warmte met een temperatuur categorie als bedoeld in [artikel 1a, eerste lid, onderdeel b en d][ref1], bedraagt
      de opslag maximaal de helft van de opslag die is vastgesteld met behulp van de formule, bedoeld in het vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0033940#Artikel1a
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel3
    references:
