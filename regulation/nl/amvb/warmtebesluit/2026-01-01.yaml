        bwb_id: BWBR0033940
        artikel: 1a
        paragraaf: '2'
  - number: '3.7'
    text: |-
      Bij ministeriële regeling kunnen nadere eisen worden gesteld aan de elementen, genoemd in het eerste, derde of
      vijfde lid.
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel3
  - number: '4.1'
    text: 'Het gebruiksafhankelijk deel van de maximumprijs voor:'
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel4
  - number: 4.1.a
    text: |-
      de levering van warmte tot maximaal 31 gigajoule per jaar met een temperatuur categorie als bedoeld in
      [artikel 1a, eerste lid, onderdelen a, b en d][ref1], wordt vastgesteld met inachtneming van de formule:


      [ref1]: https://wetten.overheid.nl/BWBR0033940#Artikel1a
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0033940
        artikel: 1a
        paragraaf: '2'
  - number: 4.1.b
    text: |-
      de levering van warmte vanaf 31 gigajoule per jaar met een temperatuur categorie als bedoeld in
      [artikel 1a, eerste lid, onderdelen a, b en d][ref1], wordt vastgesteld met inachtneming van de formule:


      [ref1]: https://wetten.overheid.nl/BWBR0033940#Artikel1a
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0033940
        artikel: 1a
        paragraaf: '2'
  - number: 4.1.c
    text: |-
      de levering van warmte met een temperatuur categorie als bedoeld in [artikel 1a, eerste lid, onderdeel c][ref1],
      wordt vastgesteld met inachtneming van de formule: *P* = 0 waarbij: *P* = de variabele kosten in het jaar t,
      uitgedrukt in euro per gigajoule; *P*  = de gemiddelde gebruiksafhankelijke gasprijs uitgedrukt in euro per m3 op
      basis van het gewogen gemiddelde van het gebruiksafhankelijke deel van de gasprijs van de overeenkomsten tussen de
      leverancier en verbruiker voor het standaardproduct voor een jaar met vaste prijs op basis van het G1 tarief van
      de tien grootste Nederlandse gasleveranciers, dat door de gasleveranciers wordt aangeboden in de maanden september,
      oktober en november in het jaar t-1, vermeerderd met het laagste van de volgende bedragen: 1°. een bedrag van
      € 0,58301 dat ieder achtereenvolgend jaar voor inflatie wordt gecorrigeerd; 2°. de energiebelasting op aardgas
      per m3 gas in het jaar t bij een verbruik tot 1.000 m3, waarbij voor de jaarlijkse inflatiecorrectie gebruik
      wordt gemaakt van de tabelcorrectiefactor, bedoeld in [artikel 10.2, van de Wet inkomstenbelasting 2001][ref2] en
      waarbij deze jaarlijkse inflatiecorrectie wordt toegepast vanaf 2025; *P*  = de gemiddelde gebruiksafhankelijke
      gasprijs uitgedrukt in euro per m3 op basis van het gewogen gemiddelde van het gebruiksafhankelijke deel
      van de gasprijs van de overeenkomsten tussen de leverancier en verbruiker voor het standaardproduct voor een
      jaar met vaste prijs op basis van het G1 tarief van de tien grootste Nederlandse gasleveranciers, dat door de
      gasleveranciers wordt aangeboden in de maanden september, oktober en november in het jaar t-1, vermeerderd met
      het laagste van de volgende bedragen: 1°. een bedrag van € 0,58301 dat ieder achtereenvolgend jaar voor inflatie
      wordt gecorrigeerd; 2°. de energiebelasting op aardgas per m3 gas in het jaar t bij een verbruik van 1.000 m3
      tot 170.000 m3, waarbij voor de jaarlijkse inflatiecorrectie gebruik wordt gemaakt van de tabelcorrectiefactor,
      bedoeld in [artikel 10.2, van de Wet inkomstenbelasting 2001][ref3] en waarbij deze jaarlijkse inflatiecorrectie
      wordt toegepast vanaf 2025; *η* = het brandstofrendement van de warmteproductie, en *CV* = de bovenwaarde van de
      verbrandingswaarde van aardgas.


      [ref1]: https://wetten.overheid.nl/BWBR0033940#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel10
