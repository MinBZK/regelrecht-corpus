  - number: 1a.2
    text: |-
      Als systeem dat mede dient voor levering van warmte als bedoeld in [artikel 5, vierde lid, van de wet][ref1] wordt
      ieder systeem aangewezen waarbij de verbruiker bij het aangaan van de leveringsovereenkomst niet de vrije keuze
      heeft om alleen koude af te nemen van het systeem.


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel5
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: '5'
  - number: '2'
    text: |-
      De maximumprijs voor de levering van warmte bestaat uit een gebruiksafhankelijk en gebruiksonafhankelijk deel
      en wordt vastgesteld met inachtneming van de formule: Pmax = VK + P * W waarbij: Pmax = de maximumprijs voor
      de levering van warmte in het jaar t; VK = de vaste kosten in het jaar t, uitgedrukt in euro; P = de variabele
      kosten in het jaar t, uitgedrukt in euro per gigajoule; W = het jaarverbruik van de warmteverbruiker, uitgedrukt
      in gigajoule.
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel2
  - number: '3.1'
    text: |-
      Voor warmte met een temperatuur categorie als bedoeld in [artikel 1a, eerste lid, onderdeel a][ref1], wordt het
      gebruiksonafhankelijk deel van de maximumprijs vastgesteld met inachtneming van de formule: VK = VK + ΔGK en
      ΔGK = GK – GK waarbij: VK = de vaste kosten in het jaar t; VK = de gemiddelde jaarlijkse vaste kosten van het
      transport, de levering en de aansluiting van gas, bestaande uit: a. het gewogen gemiddelde van de vaste tarieven
      voor gaslevering van de overeenkomsten tussen leverancier en verbruiker voor het standaardproduct voor een jaar
      met vaste prijs op basis van het G1 tarief van de tien grootste Nederlandse gasleveranciers, voor het jaar t; b.
      het gewogen gemiddelde van de transportonafhankelijke verbruikerstarieven voor afnemers met G6 aansluitingen van
      de netbeheerders van de gastransportnetten niet zijnde de netbeheerder van het landelijk gastransportnet, voor
      het jaar t; c. het gewogen gemiddelde van de transportafhankelijke verbruikerstarieven voor de G6 aansluitingen
      van de netbeheerders van gastransportnetten niet zijnde de netbeheerder van het landelijk gastransportnet, voor
      het jaar t, en d. het gewogen gemiddelde van de periodieke aansluittarieven voor de G6 aansluitingen van de
      netbeheerders van gastransportnetten, niet zijnde de netbeheerder van het landelijk gastransportnet, voor het
      jaar t; ΔGK = het verschil in gebruikskosten, bestaande uit het verschil tussen de gebruikskosten bij het gebruik
      van gas als energiebron en de gebruikskosten bij het gebruik van warmte als energiebron; GK = de gebruikskosten
      bij gas, bestaande uit: a. de gemiddelde jaarlijkse kapitaal- en operationele kosten van een cv-ketel, waarbij
      voor de operationele kosten wordt uitgegaan van de gemiddelde kosten van de aangeboden onderhoudscontracten voor
      een cv-ketel, en b. de meetkosten op basis van het gewogen gemiddelde van de meettarieven voor G6 aansluitingen
      van de gasmeter van de netbeheerders van de gastransportnetten, niet zijnde de netbeheerder van het landelijk
      gastransportnet, voor het jaar t; GK = de gebruikskosten bij warmte, bestaande uit: a. de gemiddelde jaarlijkse
      kapitaal- en operationele kosten van een afleverset, en b. de meetkosten op basis van het gewogen gemiddelde van de
      meettarieven voor G6 aansluitingen van de gasmeter van de netbeheerders van de gastransportnetten, niet zijnde de
      netbeheerder van het landelijk gastransportnet, voor het jaar t;


      [ref1]: https://wetten.overheid.nl/BWBR0033940#Artikel1a
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel3
    references:
