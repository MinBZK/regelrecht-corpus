    text: |-
      Het brandstofrendement van de warmteproductie wordt vastgesteld met inachtneming van de formule: waarbij: η =
      het brandstofrendement van warmteproductie; VR = warmtevraag voor ruimteverwarming als percentage van de totale
      warmtevraag; η = gemiddeld opwekrendement voor ruimteverwarming; VT = warmtevraag voor warm tapwater als percentage
      van de totale warmtevraag, en η = gemiddeld opwekrendement voor warm tapwater.
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel4
  - number: '4.3'
    text: Bij ministeriële regeling kunnen nadere eisen worden gesteld aan de elementen, genoemd in het eerste of tweede lid.
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel4
  - number: 4a.1
    text: |-
      De maximumprijs die een leverancier aan een verbruiker in rekening mag brengen voor het gebruik van een warmte
      koude systeem bestaat uit:
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel4a
  - number: 4a.1.a
    text: |-
      een maximumprijs voor de levering van warmte, die wordt vastgesteld overeenkomstig de methode beschreven in
      [artikel 2][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0033940#Artikel2
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0033940
        artikel: '2'
        paragraaf: '2'
  - number: 4a.1.b
    text: een maximumprijs voor de levering van koude, die wordt vastgesteld met toepassing van het tweede lid.
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel4a
  - number: 4a.2
    text: |-
      De maximumprijs die een leverancier aan verbruiker in rekening mag brengen voor de levering van koude bedraagt niet
      meer dan een door de Autoriteit Consument en Markt vastgesteld bedrag dat:
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel4a
  - number: 4a.2.a
    text: |-
      voor aansluitingen voor levering van koude met een vermogen tot en met 2 kilowatt wordt vastgesteld met
      inachtneming van de formule: VK = BT
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel4a
  - number: 4a.2.b
    text: |-
      voor aansluitingen voor levering van koude met een vermogen vanaf 2 kilowatt wordt vastgesteld met inachtneming van
      de formule: VK = BT + O * (AV – 2 kW) Waarbij: VK : de vaste kosten voor koude in het jaar t; BT : het basistarief
      voor koude bij een aansluiting voor levering van koude van 2 kilowatt; O: opslag voor koude per kilowatt extra
      vermogen van de aansluiting voor levering van koude voor aansluitingen groter dan 2 kilowatt, en AV : het
      aansluitvermogen van de aansluiting in kilowatt, zoals vastgelegd in de leveringsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel4a
  - number: 4a.3
    text: |-
      De maximumprijs voor de levering van koude is, indien het warmte koude systeem in gebruik is genomen voor de datum
      van inwerkingtreding van dit artikel en met dit systeem warmte wordt geleverd met een temperatuurcategorie als
      bedoeld in [artikel 1a, eerste lid, onderdeel a of b][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0033940#Artikel1a
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0033940
        artikel: 1a
        paragraaf: '2'
  - number: 4a.3.a
    text: |-
      niet van toepassing op leveringsovereenkomsten met een bepaalde looptijd, indien de leveringsovereenkomst is
      gesloten voor de datum van inwerkingtreding van dit artikel, en
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel4a
  - number: 4a.3.b
    text: |-
      gedurende 15 jaar na de datum waarop het warmte koude systeem voor het eerst in gebruik is genomen niet van
      toepassing op leveringsovereenkomsten met een onbepaalde looptijd, indien de leveringsovereenkomst is gesloten voor
      de datum van inwerkingtreding van dit artikel.
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel4a
  - number: 4a.4
    text: |-
      In afwijking van het eerste lid wordt de maximumprijs voor het gebruik van een warmte koude systeem waarmee warmte
      wordt geleverd met een temperatuurcategorie als bedoeld in [artikel 1a, eerste lid, onderdeel c][ref1], vastgesteld
      op de maximumprijs voor levering van warmte van de temperatuurcategorie bedoeld in artikel 1a, eerste lid,
      onderdeel a, gedurende:


      [ref1]: https://wetten.overheid.nl/BWBR0033940#Artikel1a
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0033940
        artikel: 1a
        paragraaf: '2'
  - number: 4a.4.a
    text: 'de resterende looptijd van een overeenkomst indien:'
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel4a
  - number: 4a.4.a.i
    text: de overeenkomst een bepaalde looptijd heeft;
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel4a
  - number: 4a.4.a.ii
    text: het systeem in gebruik is genomen voor de datum van inwerkingtreding van dit artikel, en
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel4a
  - number: 4a.4.a.iii
    text: de leveringsovereenkomst is gesloten voor de datum van inwerkingtreding van dit artikel, of
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel4a
  - number: 4a.4.b
    text: 'gedurende 15 jaar na de datum waarop het systeem voor het eerst in gebruik is genomen indien:'
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel4a
  - number: 4a.4.b.i
    text: de leveringsovereenkomst een onbepaalde looptijd;
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel4a
  - number: 4a.4.b.ii
    text: het systeem in gebruik is genomen voor de datum van inwerkingtreding van dit artikel, en
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel4a
  - number: 4a.4.b.ii
    text: de leveringsovereenkomst is gesloten voor de datum van inwerkingtreding van dit artikel.
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel4a
  - number: 4a.5
    text: Bij ministeriële regeling worden het basistarief en de opslag, bedoeld in het tweede lid, vastgesteld.
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel4a
  - number: '5.1'
    text: |-
      Als categorieën aansluitingen, als bedoeld in [artikel 6, tweede lid, van de wet][ref1] worden vastgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel6
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: '6'
  - number: 5.1.a
    text: individuele aansluitingen met een lengte van maximaal 25 meter;
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5
  - number: 5.1.b
    text: individuele aansluitingen met een lengte van meer dan 25 meter;
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5
  - number: 5.1.c
    text: 'centrale aansluitingen met een lengte van maximaal 25 meter en een doorlaatwaarde van:'
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5
  - number: 5.1.c.1°
    text: maximaal 100 kilowatt;
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5
  - number: 5.1.c.2°
    text: meer dan 100 kilowatt tot en met 1.250 kilowatt;
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5
  - number: 5.1.c.3°
    text: meer dan 1250 kilowatt;
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5
  - number: 5.1.d
    text: 'centrale aansluitingen met een lengte van meer dan 25 meter en een doorlaatwaarde van:'
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5
  - number: 5.1.d.1°
    text: maximaal 100 kilowatt;
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5
  - number: 5.1.d.2°
    text: meer dan 100 kilowatt tot en met 1.250 kilowatt;
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5
  - number: 5.1.d.3°
    text: meer dan 1250 kilowatt;
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5
  - number: 5.1.e
    text: |-
      individuele aansluitingen die tijdelijk zijn afgesloten voor een periode van maximaal twee jaar van een warmtenet
      of inpandig warmtenet en opnieuw aangesloten worden;
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5
  - number: 5.1.f
    text: |-
      centrale aansluitingen die tijdelijk zijn afgesloten voor een periode van maximaal twee jaar van een warmtenet of
      inpandig warmtenet en opnieuw aangesloten worden.
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5
  - number: '5.2'
    text: 'De berekening van de hoogte van het bedrag voor aansluitingen:'
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5
  - number: 5.2.a
    text: 'als bedoeld in het eerste lid, onderdelen a, b, c en d, wordt vastgesteld op basis van:'
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5
  - number: 5.2.a.1°
    text: de gemiddelde werkelijke kosten van leveranciers voor de desbetreffende categorie aansluitingen, of
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5
  - number: 5.2.a.2°
    text: |-
      door de Autoriteit Consument en Markt verkregen marktgegevens over de kosten van de desbetreffende categorie
      aansluitingen;
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5
  - number: 5.2.b
    text: |-
      als bedoeld in het eerste lid, onderdeel b, is gebaseerd op het maximum bedrag voor een aansluiting als bedoeld in
      het eerste lid, onderdeel a, en een vast bedrag per meter vanaf een lengte van de aansluiting van 25 meter;
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5
  - number: 5.2.c
    text: |-
      als bedoeld in het eerste lid, onderdeel d, is gebaseerd op het maximum bedrag voor een aansluiting als bedoeld in
      het eerste lid, onderdeel c, en een vast bedrag per meter vanaf een lengte van de aansluiting van 25 meter;
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5
  - number: 5.2.d
    text: |-
      als bedoeld in het eerste lid, onderdeel e, is gelijk aan het bedrag dat in rekening gebracht wordt voor het
      tijdelijk afsluiten van een individuele aansluiting, bedoeld in [artikel 5a, eerste lid, onderdeel a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0033940#Artikel5a
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0033940
        artikel: 5a
        paragraaf: '2'
  - number: 5.2.e
    text: |-
      als bedoeld in het eerste lid, onderdeel f, is gelijk aan het bedrag dat in rekening gebracht wordt voor het
      tijdelijk afsluiten van een centrale aansluiting, bedoeld in [artikel 5a, eerste lid, onderdeel c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033940#Artikel5a
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0033940
        artikel: 5a
        paragraaf: '2'
  - number: 5a.1
    text: |-
      Bij de berekening van de hoogte van het tarief voor afsluiting of gedeeltelijke afsluiting, bedoeld in
      [artikel 4a, eerste lid, van de wet][ref1] wordt onderscheid gemaakt tussen een tarief voor:


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel4a
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: 4a
  - number: 5a.1.a
    text: |-
      het tijdelijk afsluiten voor een periode van maximaal twee jaar van een individuele aansluiting op een warmtenet
      of een inpandig leidingstelsel door de hoofdafsluiter af te sluiten en te verzegelen of door verwijdering van de
      afleverset;
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5a
  - number: 5a.1.b
    text: |-
      het definitief afsluiten van een individuele aansluiting op een warmtenet of een inpandig leidingstelsel door
      verwijdering van de hele aansluiting;
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5a
  - number: 5a.1.c
    text: |-
      het tijdelijk afsluiten voor een periode van maximaal twee jaar van een centrale aansluiting op een warmtenet
      of een inpandig leidingstelsel door de hoofdafsluiters van de aansluiting af te sluiten en te verzegelen of door
      verwijdering van de afleverset;
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5a
  - number: 5a.1.d
    text: het definitief afsluiten van een centrale aansluiting op een warmtenet of een inpandig leidingstelsel, en
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5a
  - number: 5a.1.e
    text: |-
      het gedeeltelijk afsluiten van een individuele aansluiting op een systeem als bedoeld in
      [artikel 5, vierde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel5
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: '5'
  - number: 5a.2
    text: |-
      Het tarief, bedoeld in [artikel 4a, eerste lid, van de wet][ref1] wordt vastgesteld op basis van:


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel4a
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: 4a
  - number: 5a.2.a
    text: de gemiddelde werkelijke kosten van leveranciers voor de desbetreffende wijze van afsluiten, of
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5a
  - number: 5a.2.b
    text: |-
      door de Autoriteit Consument en Markt verkregen marktgegevens over de kosten van de desbetreffende wijze van
      afsluiten.
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5a
  - number: 5b.1
    text: |-
      Als categorieën afleversets voor warmte als bedoeld in [artikel 8, eerste lid, van de wet][ref1] worden
      vastgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel8
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: '8'
  - number: 5b.1.a
    text: een individuele afleverset voor warmte voor alleen ruimteverwarming;
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5b
  - number: 5b.1.b
    text: een collectieve afleverset voor warmte voor alleen ruimteverwarming;
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5b
  - number: 5b.1.c
    text: een individuele afleverset voor warmte voor alleen verwarming van tapwater;
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5b
  - number: 5b.1.d
    text: een collectieve afleverset voor warmte voor alleen verwarming van tapwater;
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5b
  - number: 5b.1.e
    text: een individuele gecombineerde afleverset voor warmte voor ruimteverwarming en verwarming van tapwater, en
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5b
  - number: 5b.1.f
    text: een collectieve gecombineerde afleverset voor warmte voor ruimteverwarming en verwarming van tapwater.
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5b
  - number: 5b.2
    text: |-
      De Autoriteit Consument en Markt kan aanvullende functionaliteiten van afleversets vaststellen voor zover de kosten
      van een aanvullende functionaliteit zodanig significant zijn dat een apart tarief is gerechtvaardigd.
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5b
  - number: 5b.3
    text: |-
      Het maximumtarief, bedoeld in [artikel 8, eerste lid, van de wet][ref1] bestaat uit:


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel8
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: '8'
  - number: 5b.3.a
    text: een basistarief voor een categorie van een afleverset als bedoeld in het eerste lid, en
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5b
  - number: 5b.3.b
    text: |-
      een jaarlijkse opslag of jaarlijkse afslag per aanvullende functionaliteit van een afleverset, als bedoeld in
      het tweede lid, indien van toepassing. De Autoriteit Consument en Markt stelt daarnaast een eenmalige bijdrage
      of teruggave vast voor het gebruik gedurende de economische levensduur van een aanvullende functionaliteit die in
      plaats kan komen van een jaarlijkse opslag of jaarlijkse afslag per aanvullende functionaliteit.
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5b
  - number: 5b.4
    text: |-
      Het maximumtarief voor een collectieve afleverset wordt omgeslagen over het aantal verbruikers dat gedurende
      het jaar waarop de nota, bedoeld in [artikel 2, tweede lid, van de wet][ref1], betrekking heeft via het met
      de collectieve afleverset verbonden inpandige leidingenstelsel warmte afneemt. Een leverancier geeft in de
      nota, bedoeld in artikel 2, tweede lid, van de wet, inzage in het aantal verbruikers waarover het tarief wordt
      omgeslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel2
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: '2'
  - number: 5b.5
    text: 'Het basistarief, bedoeld in het derde lid, onderdeel a, wordt vastgesteld op basis van:'
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5b
  - number: 5b.5.a
    text: |-
      de gemiddelde jaarlijkse kapitaal- en operationele kosten van leveranciers voor de desbetreffende categorie
      afleversets, of
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5b
  - number: 5b.5.b
    text: |-
      door de Autoriteit Consument en Markt verkregen marktgegevens over de kosten van de desbetreffende categorie
      afleversets.
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5b
  - number: 5b.6
    text: 'De jaarlijkse opslag of jaarlijkse afslag, bedoeld in het derde lid, onderdeel b, wordt vastgesteld op basis van:'
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5b
  - number: 5b.6.a
    text: de gemiddelde jaarlijkse kapitaalkosten van leveranciers voor de desbetreffende aanvullende functionaliteit, of
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5b
  - number: 5b.6.b
    text: |-
      door de Autoriteit Consument en Markt verkregen marktgegevens over de kosten van de desbetreffende aanvullende
      functionaliteit.
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5b
  - number: 5b.7
    text: 'De eenmalige bijdrage of teruggave, bedoeld in het derde lid, onderdeel b, wordt vastgesteld op basis van:'
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5b
  - number: 5b.7.a
    text: |-
      de gemiddelde meerkosten of minderkosten van leveranciers van de aanschaf en installatie van de desbetreffende
      aanvullende functionaliteit, of
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5b
  - number: 5b.7.b
    text: |-
      door de Autoriteit Consument en Markt verkregen marktgegevens over de kosten van de aanschaf en installatie van de
      desbetreffende aanvullende functionaliteit.
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5b
  - number: 5b.8
    text: 'Bij ministeriële regeling kunnen nadere regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5b
  - number: 5b.8.a
    text: de kenmerkende functionaliteiten van de categorieën afleversets, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5b
  - number: 5b.8.b
    text: de aanvullende functionaliteiten van afleversets, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5b
  - number: 5b.9
    text: |-
      Als een installatie als bedoeld in [artikel 1, tweede lid, van de wet][ref1] wordt aangewezen een warmtepomp in een
      warmte koude systeem.


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel1
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: '1'
  - number: 5c.1
    text: |-
      De leverancier baseert ieder aanbod als bedoeld in [artikel 5a, eerste lid, van de wet][ref1] op de persoonlijke
      situatie van de verbruiker en voorziet een verbruiker voor ieder aanbod van transparante informatie over de
      tarieven en voorwaarden voor levering en transport van warmte die de verbruiker in staat stelt de verschillende
      aanbiedingen met elkaar te vergelijken.


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel5a
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5c
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: 5a
  - number: 5c.2
    text: |-
      Bij ieder ander aanbod dan het aanbod om warmte geleverd te krijgen tegen ten hoogste de maximumprijs, bedoeld in
      [artikel 5, eerste lid, van de wet][ref1] wijst de leverancier de verbruiker er schriftelijk en in begrijpelijke
      taal op dat de verbruiker gedurende de looptijd van de overeenkomst afziet van de bescherming van artikel 5, eerste
      lid, van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel5
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5c
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: '5'
  - number: 5c.3
    text: |-
      De transparante informatie over de tarieven en voorwaarden, bedoeld in het eerste lid, omvat in ieder geval
      informatie over:
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5c
  - number: 5c.3.a
    text: de looptijd van de overeenkomst;
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5c
  - number: 5c.3.b
    text: de omschrijving van hetgeen er geleverd wordt;
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5c
  - number: 5c.3.c
    text: de prijs waarvoor geleverd wordt;
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5c
  - number: 5c.3.d
    text: de wijze van het opzeggen van de overeenkomst;
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5c
  - number: 5c.3.e
    text: de opzegtermijn, en
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5c
  - number: 5c.3.f
    text: de gevolgen van het aflopen van de overeenkomst.
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5c
  - number: 5c.4
    text: |-
      Indien een overeenkomst voor bepaalde tijd afloopt wordt de overeenkomst van rechtswege omgezet
      in een overeenkomst waarbij warmte geleverd wordt tegen ten hoogste de maximumprijs, bedoeld in
      [artikel 5, eerste lid, van de wet][ref1], tenzij anders overeengekomen op basis van een nieuw aanbod als bedoeld
      in [artikel 5a, eerste lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0033729#Artikel5a
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5c
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0033729
        artikel: 5a
  - number: 5c.5
    text: 'Bij ministeriële regeling kunnen nadere regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5c
  - number: 5c.5.a
    text: het bepalen van de persoonlijke situatie van de verbruiker, bedoeld in het eerste lid, en
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5c
  - number: 5c.5.b
    text: de transparante informatie over de tarieven en voorwaarden, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5c
  - number: 5d
    text: |-
      De termijn waarbinnen een leverancier een verbruiker een nota als bedoeld in
      [artikel 2, tweede lid, van de wet][ref1] verstrekt bedraagt ten hoogste 6 weken:


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel2
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5d
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: '2'
  - number: 5d.a
    text: |-
      na afloop van het jaar waar de nota betrekking op heeft, in de gevallen, bedoeld in
      [artikel 2, tweede lid, onderdeel a, van de wet][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel2
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5d
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: '2'
  - number: 5d.b
    text: |-
      na de dag van beëindiging van de leveringsovereenkomst, in de gevallen, bedoeld in
      [artikel 2, tweede lid, onderdeel b, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel2
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel5d
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: '2'
  - number: '6.1'
    text: |-
      De afzonderlijke boekhouding, bedoeld in [artikel 12a, eerste lid, van de wet][ref1], bevat in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel12a
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: 12a
  - number: 6.1.a
    text: een balans,
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel6
  - number: 6.1.b
    text: een winst- en verliesrekening, en
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel6
  - number: 6.1.c
    text: een toelichting op de gebruikte regels voor de afschrijving.
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel6
  - number: '6.2'
    text: 'De vergunninghouder geeft in zijn boekhouding aan:'
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel6
  - number: 6.2.a
    text: |-
      welke tarieven, volumes en omzetten bij een verbruiker in rekening zijn gebracht, waarbij de vergunninghouder, voor
      zover relevant voor het betreffende tarief, in ieder geval onderscheid maakt naar:
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel6
  - number: 6.2.a.1°
    text: |-
      de verschillende categorieën en functionaliteiten van afleversets, bedoeld in
      [artikel 5b, eerste en tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0033940#Artikel5b
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0033940
        artikel: 5b
        paragraaf: '2'
  - number: 6.2.a.2°
    text: de verschillende typen warmtemeters;
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel6
  - number: 6.2.a.3°
    text: de verschillende typen warmtekostenverdelers;
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel6
  - number: 6.2.a.4°
    text: de verschillende kostenverdeelsystematieken;
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel6
  - number: 6.2.a.5°
    text: |-
      het tijdelijk en definitief afsluiten van verbruikers in de situaties, bedoeld in [artikel 5a, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0033940#Artikel5a
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0033940
        artikel: 5a
        paragraaf: '2'
  - number: 6.2.a.6°
    text: |-
      de verschillende categorieën aansluitingen van verbruikers, bedoeld in [artikel 5, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0033940#Artikel5
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0033940
        artikel: '5'
        paragraaf: '2'
  - number: 6.2.a.7°
    text: de verschillende tarieven voor de levering van warmte, en
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel6
  - number: 6.2.a.8°
    text: de verschillende tarieven voor het gebruik van warmte koude systemen;
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel6
  - number: 6.2.b
    text: |-
      welke kosten zijn gemaakt ten behoeve van de levering van warmte, waarbij in ieder geval een onderscheid als
      bedoeld in onderdeel a wordt gemaakt;
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel6
  - number: 6.2.c
    text: |-
      over hoeveel verbruikers het tarief dat in rekening is gebracht voor het in gebruik nemen van een collectieve
      afleverset is omgeslagen op grond van [artikel 5b, vierde lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0033940#Artikel5b
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0033940
        artikel: 5b
        paragraaf: '2'
  - number: 6.2.d
    text: welke methoden en criteria zijn gehanteerd bij het opstellen van de boekhouding.
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel6
  - number: '7.1'
    text: |-
      Het bestuursverslag, bedoeld in [artikel 12a, tweede lid, van de wet][ref1], bevat in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel12a
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: 12a
  - number: 7.1.a
    text: het aantal aansluitingen op de warmtenetten van de vergunninghouder,
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel7
  - number: 7.1.b
    text: het aantal geleverde gigajoules,
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel7
  - number: 7.1.c
    text: de naar vaste kosten en variabele kosten gesplitste inkoopkosten per gigajoule,
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel7
  - number: 7.1.d
    text: het geïnvesteerd vermogen,
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel7
  - number: 7.1.e
    text: de naar tariefcomponenten gesplitste opbrengsten,
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel7
  - number: 7.1.f
    text: de afschrijvingslasten,
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel7
  - number: 7.1.g
    text: de onderhoudslasten, en
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel7
  - number: 7.1.h
    text: het resultaat.
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel7
  - number: '7.2'
    text: |-
      De in het bestuursverslag opgenomen informatie over de duurzaamheid van de geleverde warmte, bedoeld in
      [artikel 12a, derde lid, aanhef en onderdeel c, van de wet][ref1] omvat voor ieder warmtenet ten minste:


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel12a
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: 12a
  - number: 7.2.a
    text: een beschrijving van het warmtenet;
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel7
  - number: 7.2.b
    text: |-
      informatie over de energieprestatie en de CO-prestaties van de gedurende het jaar waarover verslag wordt gedaan
      geleverde warmte, en
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel7
  - number: 7.2.c
    text: informatie over de energiebalans.
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel7
  - number: '7.3'
    text: |-
      Indien meerdere vergunninghouders gebruik maken van hetzelfde warmtenet rapporteert iedere vergunninghouder
      afzonderlijk over de duurzaamheid van het aandeel warmte dat voor zijn verbruikers via het warmtenet is
      getransporteerd.
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel7
  - number: '7.4'
    text: 'Bij ministeriële regeling kunnen nadere regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel7
  - number: 7.4.a
    text: de beschrijving van het warmtenet;
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel7
  - number: 7.4.b
    text: de informatie over de energieprestatie en de CO-prestaties van de geleverde warmte over het verslagjaar;
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel7
  - number: 7.4.c
    text: de informatie over de energiebalans, en
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel7
  - number: 7.4.d
    text: het vaststellen van de informatie over de duurzaamheid van de geleverde warmte in het bestuursverslag.
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel7
  - number: '8.1'
    text: |-
      In de toelichting op de jaarrekening wordt iedere producent van warmte waarmee de leverancier een overeenkomst
      heeft gesloten, vermeld. Daarbij wordt tevens per bedrijf het aantal van die overeenkomsten gemeld.
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel8
  - number: '8.2'
    text: |-
      Indien een leverancier niet reeds uit hoofde van een wettelijke verplichting zijn jaarrekening of een daarmee
      overeenkomend financieel overzicht openbaar maakt, legt hij die jaarrekening of dat overzicht voor een ieder ter
      inzage op het kantoor van zijn hoofdvestiging.
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel8
  - number: '8.3'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de inrichting van de boekhouding,
      de jaarrekening en het bestuursverslag.
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel8
  - number: '9.1'
    text: Een aanvraag voor een vergunning wordt ingediend bij de Autoriteit Consument en Markt.
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel9
  - number: '9.2'
    text: |-
      De aanvraag voor een vergunning bevat in aanvulling op
      [artikel 4:2, eerste lid, van de Algemene wet bestuursrecht][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 9.2.a
    text: een overzicht en een beschrijving van de door de aanvrager te exploiteren warmtenetten,
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel9
  - number: 9.2.b
    text: een recente jaarrekening of een openingsbalans, welke is voorzien van een accountantsverklaring,
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel9
  - number: 9.2.c
    text: |-
      een recente verklaring van de rechtbank op basis van de registers, bedoeld in de [artikelen 19][ref1] en
      [222a van de Faillissementswet][ref2], waaruit blijkt dat de aanvrager niet in staat van faillissement verkeert en
      dat de aanvrager geen surseance van betaling is verleend,


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel222a
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0001860
        artikel: 222a
  - number: 9.2.d
    text: |-
      een beschrijving van de organisatie van de aanvrager, waarin in ieder geval is opgenomen de voorziene
      administratieve organisatie, met inbegrip van de financiële administratie, en de interne en externe controle
      hierop,
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel9
  - number: 9.2.e
    text: |-
      een prognose van de warmtevraag van de verbruikers en een beschrijving van de wijze waarop aan deze vraag tegemoet
      wordt gekomen,
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel9
  - number: 9.2.f
    text: |-
      een beschrijving van de juridische structuur van de groep, bedoeld in
      [artikel 24b, van Boek 2 van het Burgerlijk Wetboek][ref1], voorzien van een organogram, waarin per rechtspersoon
      en vennootschap wordt aangegeven wie daarin de zeggenschap uitoefent en wie gerechtigd is tot het resultaat,


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: 9.2.g
    text: |-
      voorbeelden van alle door de aanvrager gehanteerde offertes en overeenkomsten voor verbruikers met de hierbij
      behorende algemene voorwaarden,
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel9
  - number: 9.2.h
    text: de door de aanvrager gehanteerde klachten- en geschillenregeling voor verbruikers.
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel9
  - number: '9.3'
    text: |-
      De bescheiden, bedoeld in het tweede lid, worden niet aan de Autoriteit Consument en Markt overgelegd indien deze
      bij haar reeds beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel9
  - number: '9.4'
    text: 'De aanvrager beschikt over de benodigde organisatorische, financiële en technische kwaliteiten indien ten minste:'
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel9
  - number: 9.4.a
    text: |-
      de aanvrager over een goede administratieve organisatie, met inbegrip van de financiële administratie, en over een
      goede interne of externe controle hierop beschikt,
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel9
  - number: 9.4.b
    text: de aanvrager niet in staat van faillissement verkeert,
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel9
  - number: 9.4.c
    text: de aanvrager geen surseance van betaling is verleend, en
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel9
  - number: 9.4.d
    text: |-
      de aanvrager beschikt over een doeltreffend systeem voor de beheersing van de kwaliteit van zijn te leveren
      goederen en diensten.
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel9
  - number: '10.1'
    text: |-
      De vergoedingen die verschuldigd zijn op grond van [artikel 20, eerste lid, van de wet][ref1] bestaan uit een vast
      bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel20
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: '20'
  - number: '10.2'
    text: Het vaste bedrag wordt vastgesteld bij ministeriële regeling.
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel10
  - number: 10a.1
    text: |-
      Een verzoek als bedoeld in [artikel 21, eerste lid, van de wet][ref1] wordt door een producent schriftelijk
      ingediend bij de netbeheerder en de leverancier en bevat ten minste de volgende informatie:


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel21
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: '21'
  - number: 10a.1.a
    text: de naam en het adres van de producent;
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel10a
  - number: 10a.1.b
    text: wie er optreedt als contactpersoon namens de producent en wat de contactgegevens van de contactpersoon zijn;
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel10a
  - number: 10a.1.c
    text: op welk warmtenet of welke warmtenetten het verzoek betrekking heeft, en
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel10a
  - number: 10a.1.d
    text: het verwachte leveringsprofiel per warmtenet waarop het verzoek betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel10a
  - number: 10a.2
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld omtrent het leveringsprofiel, bedoeld in het eerste lid,
      onderdeel d.
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel10a
  - number: 10b
    text: |-
      De netbeheerder en de leverancier verschaffen de producent de informatie, bedoeld in
      [artikel 21, tweede en derde lid, van de wet][ref1], binnen twee maanden na indiening van een verzoek als bedoeld
      in artikel 21, eerste lid, van de wet, door de producent.


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel21
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: '21'
  - number: 10c
    text: |-
      De producent, netbeheerder en de leverancier treden binnen 2 maanden na ontvangst van het verzoek van de producent,
      bedoeld in [artikel 21, eerste lid, van de wet][ref1], in overleg over:


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel21
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel10c
    references:
      - id: ref1
        bwb_id: BWBR0033729
        artikel: '21'
  - number: 10c.a
    text: toegang voor de producent tot het warmtenet van de netbeheerder ten behoeve van transport van warmte, of
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel10c
  - number: 10c.b
    text: afname van de door de producent geproduceerde warmte door de leverancier.
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel10c
  - number: 11a
    text: |-
      [Artikel 6, tweede lid][ref1], geldt niet voor zover de vergunninghouder ten genoegen van de Autoriteit Consument
      en Markt voldoende aannemelijk kan maken dat het niet of slechts tegen zeer hoge kosten mogelijk is om in zijn
      boekhouding aan te geven:


      [ref1]: https://wetten.overheid.nl/BWBR0033940#Artikel6
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0033940
        artikel: '6'
        paragraaf: '3'
  - number: 11a.a
    text: |-
      welke tarieven bij een verbruiker in rekening zijn gebracht voor het moment van inwerkingtreding van het Besluit
      van 26 maart 2019 tot wijziging van het Warmtebesluit Stb. 133 of
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel11a
  - number: 11a.b
    text: |-
      welke kosten gemaakt voor het moment van inwerkingtreding van het Besluit van 26 maart 2019 tot wijziging van het
      Warmtebesluit Stb. 133 ten grondslag liggen aan de bij verbruikers in rekening gebrachte tarieven.
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel11a
  - number: '12'
    text: 'Dit besluit wordt aangehaald als: Warmtebesluit.'
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel12
  - number: '13'
    text: Dit besluit treedt in werking met ingang van 1 januari 2014.
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel13
