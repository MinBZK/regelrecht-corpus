articles:
  - number: '1.1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - *aanvrager:* degene die een vergunning
      voor de levering van warmte aanvraagt;
        - *vergunning:* de vergunning, bedoeld in [artikel 10, eerste lid, van de wet][ref1];
        - *warmte koude systemen:* systemen als bedoeld in [artikel 1a, tweede lid][ref2];
        - *wet:* de [Warmtewet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0033729#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0033940#Artikel1a
