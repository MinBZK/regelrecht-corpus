  - number: '3.3'
    text: |-
      Voor warmte met een temperatuur categorie als bedoeld in [artikel 1a, eerste lid, onderdeel c][ref1], wordt het
      gebruiksonafhankelijk deel:


      [ref1]: https://wetten.overheid.nl/BWBR0033940#Artikel1a
    url: https://wetten.overheid.nl/BWBR0033940/2026-01-01#Artikel3
