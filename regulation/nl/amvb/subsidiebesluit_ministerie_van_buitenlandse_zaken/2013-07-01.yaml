preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Buitenlandse Zaken van 22 juli 1999, nr. DJZ/BR/1257-99, gedaan mede namens
    Onze Minister voor Ontwikkelingssamenwerking;

    Gelet op artikel 3, eerste en tweede lid, van de Kaderwet subsidies Ministerie van Buitenlandse Zaken;

    De Raad van State gehoord (advies van 11 november 1999, nr. W02.99.0422/II);

    Gezien het nader rapport van Onze Minister van Buitenlandse Zaken van 11 februari 2005, nr. DJZ/BR/0074-05,
    uitgebracht mede namens Onze Minister voor Ontwikkelingssamenwerking;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0018039/2013-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. activiteitensubsidie: subsidie ten behoeve van activiteiten, gericht op vooraf omschreven doelstellingen en
      resultaten;

      b. instellingssubsidie: subsidie ten behoeve van de integrale kosten van de werkzaamheden van een instelling;

      c. verstrekking: verlening, dan wel ingeval de subsidie direct wordt vastgesteld, vaststelling.
    url: https://wetten.overheid.nl/BWBR0018039/2013-07-01#Artikel1
  - number: '2'
    text: |-
      Subsidie kan worden verstrekt voor bij ministeriële regeling aangeduide activiteiten. Bij ministeriële regeling
      kunnen nadere regels worden gesteld ten aanzien van de in dit besluit geregelde onderwerpen en kunnen de bedragen,
      genoemd in dit besluit, worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0018039/2013-07-01#Artikel2
  - number: '4'
    text: |-
      1 Subsidie wordt slechts verstrekt aan rechtspersonen waarvan de statutaire doelstelling past binnen het doel van
      de subsidieverstrekking, die:

      a. in staat zijn tot een adequaat financieel beheer en

      b. door ervaringsdeskundigheid met betrekking tot activiteiten als waarvoor subsidie wordt gevraagd, een
      doelgerichte en doelmatige uitvoering van de activiteiten kunnen waarborgen.

      2 In bijzondere gevallen kan subsidie worden verstrekt aan natuurlijke personen die voldoen aan de onderdelen a
      en b van het eerste lid, indien de omstandigheden waaronder de activiteiten worden uitgevoerd daartoe aanleiding
      geven.

      3 Instellingssubsidies kunnen slechts worden verstrekt aan instellingen die zich geheel
      of in overwegende mate richten op het uitvoeren van activiteiten waarvoor krachtens
      [artikel 3, eerste lid, van de Kaderwet subsidies Ministerie van Buitenlandse Zaken][ref1] subsidie kan worden
      verstrekt. Samenloop van een instellingssubsidie en een activiteitensubsidie krachtens artikel 3, eerste lid,
      van de Kaderwet subsidies Ministerie van Buitenlandse Zaken is uitsluitend mogelijk in bij ministeriële regeling
      voorziene gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0010178#Artikel3
    url: https://wetten.overheid.nl/BWBR0018039/2013-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0010178
        artikel: '3'
  - number: '6'
    text: |-
      1 Indien Onze Minister beleidsregels met betrekking tot de verstrekking van subsidie vaststelt, maakt hij
      deze uiterlijk twee weken voor aanvang van het subsidietijdvak bekend. Onze Minister kan een subsidieplafond
      vaststellen.

      2 Het subsidietijdvak, bedoeld in het eerste lid, valt samen met het kalenderjaar, tenzij bij de bekendmaking op
      grond van het eerste lid anders is bepaald.

      3 Bekendmaking van de beleidsregels vindt plaats in de Staatscourant dan wel op een andere geschikte wijze, onder
      kennisgeving daarvan in de Staatscourant. Bekendmaking van een subsidieplafond vindt plaats in de Staatscourant.

      4 Onze Minister kan bij de bekendmaking van een subsidieplafond bepalen dat bij de beoordeling van aanvragen
      mede acht wordt geslagen op een spreiding van uitgaven over de loop van het subsidietijdvak alsmede per categorie
      activiteiten afzonderlijke bedragen vaststellen voor doelgroepen, regio's, thema's, aard van de activiteiten, vorm
      van de subsidie en andere voor de subsidieverstrekking relevante invalshoeken.
    url: https://wetten.overheid.nl/BWBR0018039/2013-07-01#Artikel6
  - number: '7'
    text: |-
      1 Onze Minister behandelt subsidieaanvragen in volgorde van binnenkomst.

      2 In afwijking van het eerste lid kan Onze Minister bij de bekendmaking van zijn beleidsregels of van het
      subsidieplafond bepalen dat met het oog op een onderlinge afweging van aanvragen dan wel met het oog op een
      spreiding van uitgaven over het subsidietijdvak, op aanvragen die voor afloop van de bij de bekendmaking
      vastgestelde termijn zijn ontvangen, uiterlijk op een of meer bepaalde data wordt beslist. Daarbij kan Onze
      Minister bepalen dat de aanvragen worden gerangschikt aan de hand van bij de bekendmaking aangeduide maatstaven.

      3 Indien toepassing is gegeven aan [artikel 4:5 van de Algemene wet bestuursrecht][ref1], geldt voor de toepassing
      van het eerste en tweede lid als datum van ontvangst van de aanvraag de datum waarop de aanvraag is aangevuld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel45
    url: https://wetten.overheid.nl/BWBR0018039/2013-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:5
  - number: '8'
    text: |-
      1 Onze Minister neemt bij de beoordeling van subsidieaanvragen, mede in relatie tot overige aanvragen waarop nog
      niet is beslist, in acht de mate waarin:

      a. de activiteiten bijdragen aan het realiseren van de doelstellingen van de subsidie,

      b. de subsidie in evenredige verhouding staat tot aard, omvang en beoogde resultaten van de activiteiten,

      c. de activiteiten een meer dan incidentele uitwerking kunnen hebben en

      d. draagvlak voor de activiteiten bestaat, bijvoorbeeld blijkend uit een bijdrage in de kosten door betrokkenen.

      2 Onze Minister kan bij de beoordeling van subsidieaanvragen mede betrekken:

      a. de positie van vrouwen,

      b. de gevolgen voor het milieu,

      c. de naleving van internationaal aanvaarde humanitaire principes door de subsidieaanvrager, alsmede

      d. de gevolgen voor internationaal erkende burger-, politieke, economische, sociale en culturele rechten van de
      mens.

      3 Onze Minister kan bij de beoordeling van subsidieaanvragen voorts rekening houden met:

      a. een spreiding van uitgaven over de loop van het subsidietijdvak,

      b. de mate waarin een spreiding van de beschikbare middelen over verschillende ontvangers bijdraagt aan de
      doelmatigheid van de besteding daarvan en in een evenredige verhouding staat tot de administratieve lasten bij de
      verstrekking van subsidie,

      c. de mate waarin de activiteiten waarvoor subsidie wordt gevraagd voorzien in een behoefte, mede gelet op het
      geheel van verrichte activiteiten en

      d. een evenwichtige spreiding over doelgroepen, regio's, thema's, aard van de activiteiten, vorm van de subsidie en
      andere voor de subsidieverstrekking relevante invalshoeken.
    url: https://wetten.overheid.nl/BWBR0018039/2013-07-01#Artikel8
  - number: '9'
    text: |-
      Subsidie wordt geweigerd indien de aanvraag wordt ingediend na aanvang van de activiteiten. Bij ministeriële
      regeling kan worden bepaald dat in afwijking van de eerste volzin subsidie kan worden verstrekt voor nader
      omschreven activiteiten met een spoedeisend karakter.
    url: https://wetten.overheid.nl/BWBR0018039/2013-07-01#Artikel9
  - number: '10'
    text: |-
      Onverminderd het overigens bij of krachtens de wet bepaalde kan Onze Minister de verstrekking van subsidie
      weigeren indien verstrekking niet verenigbaar is met het beleid van Onze Minister ten aanzien van de buitenlandse
      betrekkingen en de ontwikkelingssamenwerking, zoals onder andere kenbaar uit de memorie van toelichting bij de
      begroting van het Ministerie van Buitenlandse Zaken, uit het verkeer tussen Onze Minister en de Staten-Generaal,
      uit de bekendmaking van zijn beleidsregels op grond van [artikel 6, eerste lid][ref1], of uit andere geschikte
      vormen van bekendmaking of mededeling.


      [ref1]: https://wetten.overheid.nl/BWBR0018039#Artikel6
    url: https://wetten.overheid.nl/BWBR0018039/2013-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0018039
        artikel: '6'
        paragraaf: '3'
  - number: '11'
    text: |-
      Subsidie wordt slechts verstrekt indien de aanvrager aannemelijk maakt dat de hem ten dienste staande financiële
      middelen, met inbegrip van de subsidie, voldoende zullen zijn om de voorgenomen activiteiten uit te voeren.
    url: https://wetten.overheid.nl/BWBR0018039/2013-07-01#Artikel11
  - number: '12'
    text: |-
      Subsidie wordt verstrekt voor een bij de subsidieverstrekking vast te stellen tijdvak, maar niet langer dan
      voor de duur van de activiteiten. Onze Minister kan op aanvraag van de subsidieontvanger het tijdvak verlengen,
      zonder aanpassing van het subsidiebedrag, indien de activiteiten waarvoor subsidie werd verstrekt niet binnen het
      oorspronkelijke tijdvak konden worden voltooid.
    url: https://wetten.overheid.nl/BWBR0018039/2013-07-01#Artikel12
  - number: '13'
    text: |-
      1 Subsidieverlening gaat vooraf aan subsidievaststelling, onverminderd [artikel 39, tweede lid][ref1].

      2 Aan subsidieverlening ten laste van een begroting die nog niet is vastgesteld, kan de voorwaarde, bedoeld in
      [artikel 4:34, eerste lid, van de Algemene wet bestuursrecht][ref2] worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0018039#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel434
    url: https://wetten.overheid.nl/BWBR0018039/2013-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0018039
        artikel: '39'
        paragraaf: '9'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 4:34
  - number: '14'
    text: |-
      1 Subsidie wordt slechts verstrekt voor de noodzakelijke kosten van de voorgenomen activiteiten in het licht van de
      beoogde doelstellingen en resultaten voor zover redelijkerwijs niet gevergd kan worden dat deze uit eigen middelen
      of anderszins bekostigd worden.

      2 Subsidie wordt niet verstrekt ter dekking van tekorten na afloop van de activiteiten.

      3 Bij de subsidieverlening kan Onze Minister bepalen dat het subsidiebedrag door hem kan worden aangepast in het
      licht van onvoorziene ontwikkelingen die niet aan de subsidieontvanger kunnen worden toegerekend en redelijkerwijze
      niet voor diens risico gelaten kunnen worden.
    url: https://wetten.overheid.nl/BWBR0018039/2013-07-01#Artikel14
  - number: '15'
    text: |-
      Bij de subsidieverlening kan worden bepaald dat de kosten van de activiteiten, bedoeld in
      [artikel 14, eerste lid][ref1], op normatieve grondslag worden berekend op voet van de gerealiseerde resultaten
      van de activiteiten of op een andere bij de subsidieverlening bepaalde grondslag en dat in het subsidiebedrag een
      genormeerde vergoeding voor de personele en materiële kosten van de subsidieontvanger is begrepen.


      [ref1]: https://wetten.overheid.nl/BWBR0018039#Artikel14
    url: https://wetten.overheid.nl/BWBR0018039/2013-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0018039
        artikel: '14'
        paragraaf: '6'
  - number: '20'
    text: |-
      1 De subsidieontvanger draagt zorg voor een doelmatige besteding van de subsidie. De subsidie, daaronder begrepen
      de daarop ontvangen renteopbrengsten, wordt uitsluitend besteed voor de activiteiten waarvoor zij blijkens de
      subsidieverstrekking is bestemd.

      2 Bij de subsidieverstrekking kan worden bepaald dat de subsidieontvanger recht doet aan de volkenrechtelijke
      positie van het Koninkrijk.

      3 Bij de subsidieverstrekking kan worden bepaald dat de subsidieontvanger in voorkomend geval blijk geeft van de
      bereidheid om zijn activiteiten af te stemmen op de activiteiten van andere organisaties.
    url: https://wetten.overheid.nl/BWBR0018039/2013-07-01#Artikel20
  - number: '21'
    text: |-
      Bij de subsidieverstrekking kan worden bepaald dat de subsidieontvanger een kostendekkende vergoeding in rekening
      brengt voor de beschikbaarstelling van goederen aan derden of het verrichten van diensten voor derden.
    url: https://wetten.overheid.nl/BWBR0018039/2013-07-01#Artikel21
  - number: '22'
    text: |-
      Bij de subsidieverstrekking kunnen ten aanzien van goederen die met de subsidie worden aangeschaft voorschriften
      worden gegeven omtrent gebruik en bestemming daarvan na afloop van het tijdvak waarvoor subsidie wordt verstrekt
      of na uitvoering van de activiteiten waarvoor de goederen zijn verworven. Onze Minister kan daarbij bepalen dat
      de goederen om niet of tegen een door hem te bepalen vergoeding worden overgedragen aan hem of aan door hem aan te
      wijzen derden.
    url: https://wetten.overheid.nl/BWBR0018039/2013-07-01#Artikel22
  - number: '23'
    text: |-
      Bij de subsidieverstrekking kan worden bepaald dat de subsidieontvanger Onze Minister in de gelegenheid stelt om
      ten behoeve van de doelstellingen waarvoor de subsidie is verstrekt vrijelijk en om niet gebruik te maken van alle
      auteurs- of andere intellectuele eigendomsrechten die het resultaat zijn van geheel of gedeeltelijk met de subsidie
      bekostigde activiteiten.
    url: https://wetten.overheid.nl/BWBR0018039/2013-07-01#Artikel23
  - number: '24'
    text: |-
      Bij de subsidieverstrekking kan worden bepaald dat de subsidieontvanger bij publicaties inzake gesubsidieerde
      activiteiten en in correspondentie met derden die bij de uitvoering van de activiteiten zijn betrokken, melding
      maakt van de omstandigheid dat de activiteiten geheel of gedeeltelijk bekostigd zijn uit een subsidie verstrekt
      door Onze Minister, tenzij de aard van de activiteiten, de hoedanigheid van de ontvanger of andere gewichtige
      omstandigheden zich daartegen verzetten.
    url: https://wetten.overheid.nl/BWBR0018039/2013-07-01#Artikel24
  - number: 24a
    text: |-
      Aan de subsidieverstrekking kunnen verplichtingen als bedoeld in
      [artikel 4:39, tweede lid van de Algemene wet bestuursrecht][ref1] worden verbonden, met het oog op de belangen,
      genoemd in [artikel 2, onder a tot en met h, van de Kaderwet subsidies Ministerie van Buitenlandse Zaken][ref2] en
      in [artikel 8, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel439
      [ref2]: https://wetten.overheid.nl/BWBR0010178#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0018039#Artikel8
    url: https://wetten.overheid.nl/BWBR0018039/2013-07-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:39
      - id: ref2
        bwb_id: BWBR0010178
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0018039
        artikel: '8'
        paragraaf: '4'
  - number: 24b
    text: |-
      Bij de subsidieverlening wordt bepaald dat de subsidieontvanger onverwijld een schriftelijke melding doet zodra
      aannemelijk is dat de activiteiten waarvoor de subsidie is verleend niet, niet tijdig of niet geheel zullen
      worden verricht of dat niet, niet tijdig of niet geheel aan de aan de subsidie verbonden verplichtingen zal worden
      voldaan.
    url: https://wetten.overheid.nl/BWBR0018039/2013-07-01#Artikel24b
  - number: '25'
    text: |-
      De aanvraag tot verstrekking van een activiteitensubsidie omvat:

      a. een activiteitenplan,

      b. een begroting en

      c. een liquiditeitsprognose voor de eerstvolgende twaalf maanden.
    url: https://wetten.overheid.nl/BWBR0018039/2013-07-01#Artikel25
  - number: '26'
    text: |-
      Het activiteitenplan omvat een overzicht van activiteiten, naar aard, omvang, fasering en onderling verband,
      in relatie tot de daarmee beoogde doelstellingen en resultaten en verwachte effecten voor de eerstvolgende
      twaalf maanden van het tijdvak waarvoor subsidie wordt gevraagd. Doelstellingen, resultaten en effecten worden
      waar mogelijk uitgedrukt in meetbare grootheden. Indien de activiteiten zich over een tijdvak van meer dan
      twaalf maanden uitstrekken gaat het activiteitenplan vergezeld van een globaal overzicht van werkzaamheden,
      doelstellingen, resultaten en verwachte effecten voor de resterende periode van het tijdvak.
    url: https://wetten.overheid.nl/BWBR0018039/2013-07-01#Artikel26
  - number: '27'
    text: |-
      De begroting geeft inzicht in de inkomsten, daaronder begrepen bijdragen van derden, en uitgaven gerelateerd aan
      de voorgenomen activiteiten voor de eerstvolgende twaalf maanden van het tijdvak waarvoor subsidie wordt gevraagd
      en is voorzien van een postgewijze toelichting. Indien de activiteiten zich over een tijdvak van meer dan twaalf
      maanden uitstrekken gaat de begroting vergezeld van een financiële raming voor de daaropvolgende periode.
    url: https://wetten.overheid.nl/BWBR0018039/2013-07-01#Artikel27
  - number: '28'
    text: |-
      1 Indien de activiteiten zich over een tijdvak van meer dan twaalf maanden uitstrekken, verstrekt de
      subsidieontvanger uiterlijk dertien weken voor aanvang van de dertiende maand een activiteitenplan, vergezeld
      van een begroting en een liquiditeitsprognose voor de daarop volgende periode van twaalf maanden. Bij de
      subsidieverlening kan worden bepaald dat activiteitenplan en begroting voor elke nieuwe periode de instemming van
      Onze Minister behoeven.

      2 Bij de subsidieverlening kan Onze Minister bepalen dat het eerste lid niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0018039/2013-07-01#Artikel28
  - number: '29'
    text: |-
      De [artikelen 26 tot en met 28][ref1] zijn van overeenkomstige toepassing op de aanvraag voor een
      instellingssubsidie, met dien verstande dat de gegevens betrekking hebben op alle werkzaamheden van de instelling
      en de integrale kosten daarvan. Een aanvraag voor een instellingssubsidie gaat voor de eerste maal vergezeld van:

      a. een afschrift van de statuten dan wel de reglementen van de subsidieaanvrager, zoals deze laatstelijk zijn
      vastgesteld of gewijzigd en

      b. de meest recente jaarrekening dan wel een overzicht van de financiële situatie van de subsidieaanvrager.


      [ref1]: https://wetten.overheid.nl/BWBR0018039#Artikel26
    url: https://wetten.overheid.nl/BWBR0018039/2013-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0018039
        artikel: '26'
        paragraaf: '8'
  - number: '30'
    text: |-
      1 Onze Minister beslist binnen dertien weken na ontvangst van de aanvraag. Onze Minister kan deze termijn verlengen
      tot ten hoogste:

      a. tweeëntwintig weken indien de activiteiten mede worden bekostigd door de Europese Unie of met het oog op de
      beslissing advies wordt ingewonnen dan wel een nader onderzoek plaatsvindt, of

      b. veertig weken indien met het oog op de beslissing internationaal advies wordt ingewonnen.

      2 Indien [artikel 7, eerste lid][ref1], van toepassing is en de aanvraag eerder dan dertien weken voor aanvang van
      het subsidietijdvak waarin de activiteiten zullen aanvangen wordt ingediend, schort Onze Minister de behandeling
      van de aanvraag op tot dertien weken voor aanvang van het subsidietijdvak en geldt als datum van ontvangst van de
      aanvraag de dag waarop de termijn van dertien weken aanvangt.

      3 Het eerste en het tweede lid zijn niet van toepassing indien [artikel 7, tweede lid][ref2], van toepassing is.

      4 Met het oog op de toepassing van [artikel 8, eerste lid][ref3], kan Onze Minister in afwijking van
      [artikel 7, eerste lid][ref4], de beslissing op de aanvraag aanhouden, onverminderd het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0018039#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0018039#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0018039#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0018039#Artikel7
    url: https://wetten.overheid.nl/BWBR0018039/2013-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0018039
        artikel: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0018039
        artikel: '7'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0018039
        artikel: '8'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0018039
        artikel: '7'
        paragraaf: '3'
  - number: '31'
    text: |-
      1 De aanvraag tot vaststelling van een activiteitensubsidie geschiedt binnen zes maanden na afloop van het tijdvak
      waarvoor subsidie werd verleend dan wel na afloop van de activiteiten dan wel, indien toepassing is gegeven aan
      [artikel 4:44, eerste lid, onder b of c, van de Algemene wet bestuursrecht][ref1], telkens binnen zes maanden na
      afloop van elk kalenderjaar.

      2 Onze Minister beslist binnen dertien weken na ontvangst van de aanvraag. Onze Minister kan deze termijn verlengen
      tot ten hoogste tweeëntwintig weken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel444
    url: https://wetten.overheid.nl/BWBR0018039/2013-07-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:44
  - number: '32'
    text: |-
      Indien toepassing is gegeven aan [artikel 4:5 van de Algemene wet bestuursrecht][ref1], vangt de termijn om op een
      aanvraag tot verlening of vaststelling te beslissen aan zodra de aanvraag is aangevuld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel45
    url: https://wetten.overheid.nl/BWBR0018039/2013-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:5
  - number: '33'
    text: |-
      Betaling van voorschotten vindt plaats in termijnen waarvan hoogte en betalingstijdstip in de beschikking tot
      subsidieverlening worden vastgelegd.
    url: https://wetten.overheid.nl/BWBR0018039/2013-07-01#Artikel33
  - number: '39'
    text: |-
      1 Subsidies voor een bedrag lager dan € 25.000 worden als vast bedrag verstrekt.

      2 De subsidie wordt:

      a. direct vastgesteld zonder voorafgaande beschikking tot subsidieverlening of

      b. ambtshalve vastgesteld, uiterlijk op een in een voorafgaande beschikking tot subsidieverlening vermelde datum,
      doch niet later dan tweeëntwintig weken nadat de activiteiten op grond van de beschikking moeten zijn verricht.

      3 Een subsidie als bedoeld in het tweede lid, onder a, wordt binnen zes weken na vaststelling in één termijn
      betaald, doch niet eerder dan na aanvang van het subsidietijdvak.
    url: https://wetten.overheid.nl/BWBR0018039/2013-07-01#Artikel39
  - number: '40'
    text: |-
      1 Indien een beschikking tot subsidieverlening als bedoeld in [artikel 39, tweede lid, onder b][ref1], wordt
      gegeven, vermeldt de beschikking de datum waarop de activiteiten uiterlijk moeten zijn verricht.

      2 Bij de subsidieverlening wordt bepaald dat de subsidieontvanger desgevraagd op in de beschikking vermelde wijze
      aantoont dat de activiteiten waarvoor de subsidie is verleend, zijn verricht en dat is voldaan aan de aan de
      subsidie verbonden verplichtingen.

      3 Bevoorschotting vindt plaats tot honderd procent van het verleende bedrag in termijnen waarvan hoogte en
      betalingstijdstip in de beschikking tot subsidieverlening worden vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0018039#Artikel39
    url: https://wetten.overheid.nl/BWBR0018039/2013-07-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0018039
        artikel: '39'
        paragraaf: '9'
  - number: '41'
    text: |-
      1 Subsidies voor een bedrag van ten minste € 25.000 tot ten hoogste € 125.000 worden verstrekt in de vorm van een
      vast bedrag of een vast bedrag overeenkomstig een in de beschikking te bepalen grondslag die is gerelateerd aan de
      gerealiseerde resultaten.

      2 Bij de subsidieverstrekking wordt bepaald dat de subsidieontvanger op in de beschikking vermelde wijze aantoont
      dat de activiteiten waarvoor de subsidie is verleend, zijn verricht en dat is voldaan aan de aan de subsidie
      verbonden verplichtingen.

      3 Indien de kosten en opbrengsten in verband met de aard van de activiteiten zodanig ongewis zijn dat een
      realistische begroting niet kan worden vereist, kan in de beschikking worden bepaald dat de subsidieontvanger op
      basis van een verklaring inzake werkelijke kosten en opbrengsten aantoont dat de activiteiten zijn verricht.
    url: https://wetten.overheid.nl/BWBR0018039/2013-07-01#Artikel41
