        artikel: '2'
  - number: 5a
    text: |-
      Gelatine - is verkregen uit inrichtingen die voldoen aan de bijlage, hoofdstuk 4, onder I, van beschikking 99/724/
      EG,
        - wordt vervaardigd van grondstoffen die voldoen aan de bijlage, hoofdstuk 4, onder II, van beschikking 99/724/EG,
      met uitzondering van het tweede lid,
        - wordt vervaardigd van grondstoffen die zijn vervoerd en opgeslagen overeenkomstig de bijlage, hoofdstuk 4, onder
      III, van beschikking 99/724/EG,
        - wordt vervaardigd overeenkomstig de bijlage, hoofdstuk 4, onder IV, van beschikking 99/724/EG, met uitzondering
      van het eerste lid, eerste gedachtestreepje,
        - voldoet aan eisen inzake de eindproducten in de bijlage, hoofdstuk 4, onder V, van beschikking 99/724/EG,
        - is verpakt en wordt opgeslagen en vervoerd overeenkomstig de bijlage, hoofdstuk 4, onder VI, van beschikking
      99/724/EG.
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel5a
  - number: '6.1'
    text: |-
      De exploitant of beheerder van de inrichting of van het herverpakkingscentrum treft alle nodige maatregelen om
      ervoor te zorgen dat de relevante voorschriften van dit besluit in alle stadia van de produktie of de herverpakking
      worden nageleefd. Daartoe draagt hij zorg voor: - identificatie van de kritieke punten in zijn inrichting aan de
      hand van de gebruikte procédés;
        - opstelling en tenuitvoerlegging van methoden om toezicht en controle uit te oefenen op deze kritieke punten;
        - monsterneming voor analyse in een door Onze Minister goedgekeurd laboratorium met het oog op de controle van de
      reinigings- en ontsmettingsmethoden en om na te gaan of de in dit besluit vastgestelde normen worden nageleefd;
        - bewaring van de uit hoofde van de voorgaande punten verlangde gegevens op schrift of op een andere wijze
      geregistreerd, ten einde deze aan de bevoegde autoriteit te kunnen voorleggen. De resultaten van de verschillende
      controles en tests worden gedurende ten minste twee jaar bewaard, behalve voor de in het tweede lid bedoelde
      produkten waarvoor deze termijn kan worden teruggebracht tot zes maanden na de datum van minimale houdbaarheid van
      het produkt;
        - garanties ten aanzien van het beheer van de keurmerken, bedoeld in [artikel 2, eerste lid, onder G][ref1], met
      name van de etiketten waarop het keurmerk is aangebracht;
        - het informeren van de bevoegde autoriteit indien op grond van het laboratoriumonderzoek of van andere gegevens
      waarover hij beschikt een ernstig gevaar voor de gezondheid wordt vastgesteld;
        - in geval van onmiddellijk gevaar voor de menselijke gezondheid, het uit de handel nemen van de hoeveelheid
      produkten die zijn verkregen onder technologisch vergelijkbare omstandigheden, die hetzelfde gevaar kunnen
      opleveren. Deze uit de handel genomen hoeveelheid blijft onder toezicht en onder verantwoordelijkheid van de
      bevoegde autoriteit, totdat zij wordt vernietigd, voor andere doeleinden dan menselijke consumptie wordt gebruikt,
      dan wel na toestemming van deze bevoegde autoriteit op passende wijze opnieuw worden behandeld om de veiligheid
      ervan te waarborgen;
        - de bij het eerste en tweede streepje bedoelde eisen worden samen met de bevoegde autoriteit opgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006293#Artikel2
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006293
        artikel: '2'
  - number: '6.2'
    text: |-
      Voor vleesprodukten die niet bij kamertemperatuur bewaard kunnen worden vermeldt de exploitant of de beheerder
      van de inrichting of het herverpakkingscentrum, ten behoeve van de controle, op de eindverpakking van het produkt
      zichtbaar en leesbaar bij welke temperaturen het produkt moet worden vervoerd en/of opgeslagen alsmede de datum
      van minimale houdbaarheid of, in geval van uit microbiologisch oogpunt bederfelijke produkten, de uiterste
      verbruiksdatum.
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel6
  - number: '6.3'
    text: |-
      De exploitant of de beheerder van de inrichting moet een opleidingsprogramma verstrekken of opzetten dat het
      personeel in staat stelt te voldoen aan de voorschriften inzake hygiënische produktie, die zijn aangepast aan de
      produktiestructuur. De bevoegde autoriteit die voor de inrichting verantwoordelijk is, wordt bij het opzetten en de
      uitvoering van dit programma betrokken.
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel6
  - number: '7.1'
    text: |-
      Onze Minister kan inrichtingen die vleesprodukten vervaardigen, erkennen indien zij voldoen aan de bij of krachtens
      dit besluit vastgestelde eisen met betrekking tot de aard van de activiteiten die er worden uitgevoerd. Indien een
      uit hoofde van dit besluit te erkennen inrichting geïntegreerd is in een uit hoofde van de [richtlijnen 64/433/EEG]
      (31964L0433), [91/493/EEG](31991L0493) of [91/495/EEG](31991L0495) erkende inrichting, mogen de voor het personeel
      bestemde lokalen, apparatuur en installaties, alsmede alle lokalen waar geen gevaar bestaat voor besmetting van
      grondstoffen of produkten zonder onmiddellijke verpakking, voor deze inrichtingen gemeenschappelijk zijn.
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel7
  - number: '7.2'
    text: |-
      Wanneer de hygiënische voorschriften niet worden nageleefd, dan wel een adequate keuring wordt belemmerd kan de
      bevoegde autoriteit ingrijpen in het gebruik van apparatuur of lokalen en alle nodige maatregelen treffen, zelfs
      het produktietempo verlagen of produktieproces tijdelijk stil leggen.
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel7
  - number: '7.3'
    text: |-
      Wanneer de in het tweede lid bedoelde maatregelen of de in [artikel 6, eerste lid][ref1], voorlaatste streepje,
      bedoelde maatregelen onvoldoende zijn gebleken om de situatie te verbeteren, schort Onze Minister de erkenning
      tijdelijk op, eventueel voor het in geding zijnde produktietype.


      [ref1]: https://wetten.overheid.nl/BWBR0006293#Artikel6
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006293
        artikel: '6'
  - number: '7.4'
    text: |-
      Wanneer de exploitant of de beheerder van de inrichting de geconstateerde gebreken niet binnen een door Onze
      Minister vastgestelde termijn herstelt, trekt Onze Minister de erkenning in.
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel7
  - number: '8.1'
    text: Onze Minister kan inrichtingen die vleesprodukten vervaardigen en
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel8
  - number: 8.1.a
    text: geen industriële produktiestructuur en -capaciteit bezitten, of
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel8
  - number: 8.1.b
    text: |-
      zijn bedoeld in artikel 4, punt A, onder a, en i, en de punten C, D en E van [richtlijn 64/433/EEG](31964L0433),
      ontheffing verlenen van de in artikel 7, eerste lid, bedoelde eisen voor zover het betreft - [bijlage B][ref1],
      [hoofdstuk I][ref2] en [bijlage A][ref3], [hoofdstuk I][ref4], [punt 2][ref5], [onder ][ref6], wat kranen betreft,
      en punt 11, met dien verstande dat kan worden volstaan met kasten in plaats van kleedlokalen.
        - [bijlage A][ref7], [hoofdstuk I][ref8], [punt 3][ref9], met betrekking tot de lokalen voor opslag van
      grondstoffen en eindprodukten. Daartoe beschikt de inrichting evenwel ten minste over: 1e. een lokaal of een
      voorziening, eventueel gekoeld, voor het opslaan van grondstoffen, indien deze aldaar wordt opgeslagen; 2e.
      een lokaal of een voorziening, eventueel gekoeld, voor het opslaan van eindprodukten, indien deze aldaar worden
      opgeslagen, met dien verstande dat de behandeling van de produkten in deze inrichtingen voldoet aan de andere eisen
      van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0006293
      [ref2]: https://wetten.overheid.nl/BWBR0006293
      [ref3]: https://wetten.overheid.nl/BWBR0006293
      [ref4]: https://wetten.overheid.nl/BWBR0006293
      [ref5]: https://wetten.overheid.nl/BWBR0006293
      [ref6]: https://wetten.overheid.nl/BWBR0006293
      [ref7]: https://wetten.overheid.nl/BWBR0006293
      [ref8]: https://wetten.overheid.nl/BWBR0006293
      [ref9]: https://wetten.overheid.nl/BWBR0006293
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006293
      - id: ref2
        bwb_id: BWBR0006293
      - id: ref3
        bwb_id: BWBR0006293
      - id: ref4
        bwb_id: BWBR0006293
      - id: ref5
        bwb_id: BWBR0006293
      - id: ref6
        bwb_id: BWBR0006293
      - id: ref7
        bwb_id: BWBR0006293
      - id: ref8
        bwb_id: BWBR0006293
      - id: ref9
        bwb_id: BWBR0006293
  - number: '8.2'
    text: |-
      [Bijlage B][ref1], [hoofdstuk VII][ref2], is niet van toepassing op de opslag in de in eerste lid, onder *a*,
      bedoelde inrichtingen, noch op het vervoer van andere produkten dan die bedoeld in [artikel 6, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006293
      [ref2]: https://wetten.overheid.nl/BWBR0006293
      [ref3]: https://wetten.overheid.nl/BWBR0006293#Artikel6
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel8
    references:
