  - number: '2.2'
    text: |-
      Vleesprodukten mogen niet onderworpen zijn geweest aan ioniserende straling, onverminderd de wettelijke
      voorschriften inzake ionisatie voor medische doeleinden.
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel2
  - number: '2.3'
    text: |-
      Voor de toepassing van dit artikel wordt een ter uitvoering van de artikelen 8 onderscheidenlijk 11 van de
      richtlijn door een andere lid-staat van de Europese Gemeenschappen en de Europese Ruimte erkende inrichting
      gelijkgesteld met een inrichting, overeenkomstig de [artikelen 7][ref1] onderscheidenlijk [9][ref2] van dit
      besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0006293#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006293#Artikel9
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel2
