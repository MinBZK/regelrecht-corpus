    text: |-
      wanneer zij van een onmiddellijke verpakking, een eindverpakking of een etiket zijn voorzien, verpakt of
      geëtiketteerd zijn overeenkomstig [bijlage B][ref1], [hoofdstuk V][ref2], en wel ter plaatse of in speciaal daartoe
      door Onze Minister erkende herverpakkingscentra.


