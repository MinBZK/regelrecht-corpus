        bwb_id: BWBR0006293
      - id: ref2
        bwb_id: BWBR0006293
      - id: ref3
        bwb_id: BWBR0006293
        artikel: '6'
  - number: '9.1'
    text: |-
      Onze Minister kan inrichtingen, niet zijnde inrichtingen, erkend overeenkomstig [artikel 7][ref1], die andere
      produkten van dierlijke oorsprong produceren, erkennen. Wanneer de produktie evenwel in een lokaal naast een
      slachthuis plaatsvindt, geldt de erkenning daarvan ook voor dat lokaal mits aan de eisen van dit besluit wordt
      voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006293#Artikel7
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006293
        artikel: '7'
  - number: '9.2'
    text: |-
      [Artikel 7, tweede tot en met vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006293#Artikel7
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel9
