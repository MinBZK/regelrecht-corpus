  - number: '3.1'
    text: Vleesprodukten zijn
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel3
  - number: 3.1.a
    text: |-
      bereid door middel van verhitten, doorzouten, marineren of drogen, welke procédés kunnen worden gecombineerd met
      roken of rijpen, in voorkomend geval onder bijzondere microklimatologische omstandigheden. De vleesprodukten mogen
      ook met andere levensmiddelen en kruiderijen worden gecombineerd; Onze Minister kan ten aanzien van additieven
      nadere regels stellen;
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel3
  - number: 3.1.b
    text: in voorkomend geval verkregen uit een vleesprodukt of een vleesbereiding.
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel3
  - number: '3.2'
    text: |-
      Lokalen, werktuigen en materieel die gebruikt worden voor de vervaardiging van vleesprodukten van of met vlees
      met EEG-keurmerk, mogen, tot het verstrijken van de in de [richtlijn nr. 91/498/EEG](31991L0498) vastgestelde
      termijn, slechts voor de vervaardiging van vleesprodukten van of met vlees zonder dit keurmerk gebruikt worden,
      met instemming van de bevoegde autoriteit en mits, te zijner genoegen, alle voorzorgen zijn genomen om verwarring
      tussen die vleesprodukten te voorkomen.
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel3
  - number: '4'
    text: |-
      Tenzij Onze Minister anders heeft bepaald, voldoen andere kant- en klaargerechten dan die bedoeld in
      [artikel 1, eerste lid, onder ][ref1], die zijn verkregen van grondstoffen van dierlijke oorsprong die niet onder
      dit besluit vallen, aan de hygiënische voorschriften van [bijlage A][ref2], [hoofdstuk II][ref3], voor zover zij
      zijn vervaardigd in een inrichting als omschreven in [artikel 1, onder ][ref4], van dit besluit; hiernaast dienen
      deze gerechten eveneens te voldoen aan de specifieke eisen van [bijlage B][ref5], [hoofdstuk IX][ref6], en te
      worden gekeurd overeenkomstig [artikel 6][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0006293#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006293
      [ref3]: https://wetten.overheid.nl/BWBR0006293
      [ref4]: https://wetten.overheid.nl/BWBR0006293#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0006293
      [ref6]: https://wetten.overheid.nl/BWBR0006293
      [ref7]: https://wetten.overheid.nl/BWBR0006293#Artikel6
