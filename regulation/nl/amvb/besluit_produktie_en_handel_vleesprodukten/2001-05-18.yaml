preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 24 mei 1993, DGVgz/VVP/V-
    93844, gedaan in overeenstemming met Onze Minister van Landbouw, Natuurbeheer en Visserij;

    Gelet op richtlijn nr. 92/5/EEG van de Raad van de Europese Gemeenschappen van 10 februari 1992 tot wijziging en
    bijwerking van richtlijn nr. 77/99/EEG inzake gezondheidsvraagstukken op het gebied van het intracommunautaire
    handelsverkeer in vleesprodukten alsmede tot wijziging van richtlijn nr. 64/433/EEG (PbEG L 57), op richtlijn
    nr. 92/118/EEG van de Raad van de Europese Gemeenschappen van 17 december 1992 tot vaststelling van de
    veterinairrechtelijke en de gezondheidsvoorschriften voor het handelsverkeer en de invoer in de Gemeenschap
    van produkten waarvoor ten aanzien van deze voorschriften geen specifieke communautaire regelgeving geldt als
    bedoeld in bijlage A, hoofdstuk I, van richtlijn 89/662/EEG, en, wat ziekteverwekkers betreft, van richtlijn
    90/425/EEG (PbEG L 62) en op richtlijn nr. 92/120/EEG van de Raad van de Europese Gemeenschappen van 17 december
    1992, houdende vaststelling van de voorschriften voor het toestaan van tijdelijke en beperkte afwijkingen op
    de specifieke communautaire gezondheidsvoorschriften voor de produktie en het in de handel brengen van bepaalde
    produkten van dierlijke oorsprong (PbEG L 62), alsmede op de artikelen 2, eerste lid, onder b, 19, 19a, 25 en 30a
    van de Vleeskeuringswet;

    Gezien het advies van de Adviescommissie Vleeskeuringswet (advies van 12 maart 1993, nr. ACVW/U-93002);

    De Raad van State gehoord (advies van 26 augustus 1993, No. W.13.93.0318);

    Gezien het nader rapport van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 23 november 1993,
    DGVgz/VVP/V-931987, uitgebracht in overeenstemming met Onze Minister van Landbouw, Natuurbeheer en Visserij;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Welzijn, Volksgezondheid en Cultuur;'
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel1
  - number: 1.1.b
    text: |-
      de wet: de [Vleeskeuringswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001896
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001896
  - number: 1.1.c
    text: 'bevoegde autoriteit: ambtenaar als bedoeld in artikel 31, eerste lid, van de wet;'
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel1
  - number: 1.1.d
    text: |-
      de richtlijn: [richtlijn nr. 77/99/EEG](31977L0099) van de Raad van de Europese Gemeenschappen betreffende de
      gezondheidsvoorschriften voor de produktie en het in handel brengen van vleesprodukten en bepaalde andere produkten
      van dierlijke oorsprong (*PbEG* L 26, 1977);
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel1
  - number: 1.1.e
    text: |-
      vleesprodukten: produkten vervaardigd van of met zodanig behandeld vlees dat, aan de hand van het snijvlak van
      de hartdoorsnijding, de verdwijning van de kenmerken van vers vlees kan worden geconstateerd. Als vleesprodukten
      worden evenwel niet beschouwd:
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel1
  - number: 1.1.e.1e
    text: vlees dat alleen een koudebehandeling heeft ondergaan;
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel1
  - number: 1.1.e.2e
    text: produkten die vallen onder [richtlijn 94/65/EG](31994L0065);
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel1
  - number: 1.1.f
    text: 'andere produkten van dierlijke oorsprong:'
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel1
  - number: 1.1.f.1e
    text: vleesextract;
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel1
  - number: 1.1.f.2e
    text: |-
      gesmolten dierlijke vetten, dat wil zeggen voor menselijke consumptie bestemde vetten die afkomstig zijn van het
      smelten van vlees, met inbegrip van de beenderen;
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel1
  - number: 1.1.f.3e
    text: kanen, dat wil zeggen eiwithoudend residu van het smeltproces, na gedeeltelijke afscheiding van vet en water;
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel1
  - number: 1.1.f.4e
    text: vleesmeel, zwoerd in poeder, gezouten of gedroogd bloed, gezouten of gedroogd bloedplasma;
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel1
  - number: 1.1.f.5e
    text: gereinigde magen, blazen en darmen, gezouten of gedroogd en/of verhit;
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel1
  - number: 1.1.g
    text: |-
      kant-en-klaargerechten op basis van vlees: vleesprodukten die overeenstemmen met gekookte of voorgekookte culinaire
      bereidingen, in onmiddellijke verpakking, en door koude geconserveerd;
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel1
  - number: 1.1.h
    text: |-
      vlees: alle voor menselijke consumptie geschikte delen van als landbouwhuisdier gehouden runderen (de soorten
      Bubalus bubalis en Bison bison daaronder begrepen), varkens, schapen, geiten en eenhoevigen en niet gedomesticeerde
      landzoogdieren, niet zijnde lagomorfen, die in gevangenschap zijn gekweekt, gehouden en geslacht alsmede vrij wild
      als bedoeld in [artikel 1 van het Besluit produktie en handel vlees van vrij wild][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006813#Artikel1
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006813
        artikel: '1'
  - number: 1.1.i
    text: |-
      grondstoffen: produkten van dierlijke oorsprong die als ingrediënt worden gebruikt voor het verkrijgen van de onder
      *e*. en *f*. bedoelde produkten, of die worden gebruikt voor de bereiding van kant-en-klaargerechten;
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel1
  - number: 1.1.j
    text: |-
      behandeling: chemisch of fysisch procédé, zoals het verhitten, roken, zouten, marineren, doorzouten of drogen, om
      het vlees of de produkten van dierlijke oorsprong al dan niet samen met andere levensmiddelen, langer te kunnen
      conserveren, of een combinatie van deze verschillende procédés;
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel1
  - number: 1.1.k
    text: 'verhitten: gebruikmaking van droge of vochtige warmte;'
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel1
  - number: 1.1.l
    text: 'zouten: gebruikmaking van zout;'
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel1
  - number: 1.1.m
    text: 'doorzouten: het doen intrekken van zout in de massa van het produkt;'
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel1
  - number: 1.1.n
    text: |-
      rijpen: behandeling van gezouten rauw vlees, toegepast onder klimatologische omstandigheden die tijdens een trage
      en geleidelijke vermindering van de vochtigheid de ontwikkeling van natuurlijke enzymatische of gistingsprocessen
      kunnen veroorzaken, met in de tijd wijzigingen die het produkt typische organoleptische kenmerken verlenen en de
      houdbaarheid en de hygiëne in een normale situatie bij kamertemperatuur garanderen;
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel1
  - number: 1.1.o
    text: 'drogen: natuurlijke of kunstmatige vermindering van de hoeveelheid water;'
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel1
  - number: 1.1.p
    text: 'partij: hoeveelheid vleesprodukt waarvoor een zelfde begeleidend handelsdocument of keuringscertificaat geldt;'
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel1
  - number: 1.1.q
    text: |-
      onmiddellijke verpakking: het beschermen van de onder *e.* en *f.* bedoelde produkten door middel van een eerste
      omhulsel of een eerste bergingsmiddel dat rechtstreeks in contact komt met het betrokken produkt, alsmede het
      eerste omhulsel of het eerste bergingsmiddel zelf;
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel1
  - number: 1.1.r
    text: |-
      eindverpakking: het plaatsen van een of meer van de onder *e.* en *f.* bedoelde produkten, die al dan niet van een
      onmiddellijke verpakking zijn voorzien, in een bergingsmiddel, alsmede het bergingsmiddel zelf;
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel1
  - number: 1.1.s
    text: |-
      hermetisch gesloten recipiënt: bergingsmiddel dat geen lucht doorlaat en bestemd is om de inhoud tijdens en na de
      hittebehandeling te beschermen tegen het binnendringen van micro-organismen;
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel1
  - number: 1.1.t
    text: 'inrichting: ieder bedrijf dat de onder *e., f.* en *g.* bedoelde produkten vervaardigt;'
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel1
  - number: 1.1.u
    text: |-
      herverpakkingscentrum: een werkplaats of een opslagplaats waar produkten, bestemd om in de handel te worden
      gebracht, opnieuw worden bijeengebracht of worden voorzien van een nieuwe onmiddellijke verpakking;
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel1
  - number: 1.1.v
    text: |-
      in de handel brengen: het verkopen, te koop aanbieden of uitstallen met het oog op verkoop, het afleveren, het ten
      geschenke geven of op enige andere wijze afstaan, het tot vervoer of aflevering voorhanden hebben, het in voorraad
      hebben, het vervoeren of doen vervoeren, anders dan ter naleving van enig wettelijk voorschrift;
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel1
  - number: 1.1.w
    text: |-
      vlees van gekweekt grof wild: alle voor menselijke consumptie geschikte delen van niet-gedomesticeerde
      landzoogdieren, niet zijnde lagomorfen, als landbouwhuisdier gehouden runderen (de soorten Bubalus bubalis en Bison
      bison daaronder begrepen), varkens, schapen, geiten en eenhoevigen, die in gevangenschap zijn gekweekt, gehouden
      en geslacht;
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel1
  - number: 1.1.x
    text: |-
      [richtlijn 91/495/EEG](31991L0495): de [richtlijn nr. 91/495/EEG](31991L0495) van de Raad van de Europese
      Gemeenschappen van 27 november 1990 inzake gezondheidsvoorschriften en veterinairrechtelijke voorschriften voor de
      produktie en het in de handel brengen van konijnevlees en vlees van gekweekt wild (*PbEG* L 268);
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel1
  - number: 1.1.ij
    text: |-
      [richtlijn 80/215/EEG](31980L0215): de [richtlijn nr. 80/215/EEG](31980L0215) van de Raad van de Europese
      Gemeenschappen van 22 januari 1980 inzake veterinairrechtelijke vraagstukken op het gebied van het
      intracommunautaire handelsverkeer in vleesprodukten (*PbEG* L 47);
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel1
  - number: 1.1.z
    text: |-
      [richtlijn 91/498/EEG](31991L0498): de [richtlijn nr. 91/498/EEG](31991L0498) van de Raad van de Europese
      Gemeenschappen van 29 juli 1991 houdende vaststelling van de voorschriften voor het toestaan van tijdelijke en
      beperkte afwijkingen op de specifieke communautaire gezondheidsvoorschriften voor de produktie en het in de handel
      brengen van vers vlees (*PbEG* L 268);
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel1
  - number: 1.1.aa
    text: |-
      [richtlijn 64/433/EEG](31964L0433): de [richtlijn nr. 64/433/EEG](31964L0433) van de Raad van de Europese
      Gemeenschappen betreffende de produktie en het in de handel brengen van vers vlees (*PbEG* L 121);
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel1
  - number: 1.1.bb
    text: |-
      [richtlijn 91/493/EEG](31991L0493): de [richtlijn nr. 91/493/EEG](31991L0493) van de Raad van de Europese
      Gemeenschappen van 22 juli 1991 tot vaststelling van gezondheidsvoorschriften voor de produktie en het in de handel
      brengen van visserijprodukten (*PbEG* L 268);
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel1
  - number: 1.1.cc
    text: |-
      [richtlijn 92/120/EEG](31992L0120): de [richtlijn nr. 92/120/EEG](31992L0120) van de Raad van de Europese
      Gemeenschappen van 17 december 1992 houdende vaststelling van de voorschriften voor het toestaan van tijdelijke en
      beperkte afwijkingen op de specifieke communautaire gezondheidsvoorschriften voor de produktie en het in de handel
      brengen van bepaalde produkten van dierlijke oorsprong (*PbEG* L 62);
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel1
  - number: 1.1.dd
    text: |-
      [richtlijn 94/65/EG](31994L0065): de [richtlijn nr. 94/65/EG](31994L0065) van de Raad van de Europese Unie van 14
      december 1994 tot vaststelling van voorschriften voor de productie en het in de handel brengen van gehakt vlees en
      vleesbereidingen (PbEG L 368);
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel1
  - number: 1.1.ee
    text: |-
      [richtlijn 80/778/EEG](31980L0778): de [richtlijn nr. 80/778/EEG](31980L0778) van de Raad van de Europese
      Gemeenschappen van 15 juli 1980 betreffende de kwaliteit van voor menselijke consumptie bestemd water (*PbEG*
      L 229);
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel1
  - number: 1.1.ff
    text: |-
      [richtlijn 89/109/EEG](31989L0109): de [richtlijn nr. 89/109/EEG](31989L0109) van de Raad van de Europese
      Gemeenschappen van 21 december 1988 betreffende de onderlinge aanpassing van de wetgevingen der lid-staten inzake
      materialen en voorwerpen bestemd om met levensmiddelen in aanraking te komen (*PbEG* L 40);
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel1
  - number: 1.1.gg
    text: |-
      [richtlijn 79/112/EEG](31979L0112): de [richtlijn nr. 79/112/EEG](31979L0112) van de Raad van de Europese
      Gemeenschappen van 18 december 1978 betreffende de onderlinge aanpassing van de wetgevingen der lid-staten inzake
      etikettering en presentatie van levensmiddelen bestemd voor de eindverbruiker alsmede inzake de daarvoor gemaakte
      reclame (*PbEG* L 33);
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel1
  - number: 1.1.gh
    text: |-
      beschikking 99/724/EG: beschikking nr. 1999/724/EG van Commissie van de Europese Gemeenschappen van 28 oktober
      1999 tot wijziging van bijlage II bij [Richtlijn 92/118/EEG](31992L0118) van de Raad tot vaststelling van
      deveterinairrechtelijke en de gezondheidsvoorschriften voor het handelsverkeer en de invoer in de Gemeenschap van
      producten waarvoor ten aanzien van deze voorschriften geen specifieke communautaire regelgeving geldt als bedoeld
      in bijlage A, hoofdstuk I, van [Richtlijn 89/662/EEG](31989L0662), en, wat ziekteverwekkers betreft, van [Richtlijn
      90/425/EEG](31990L0425) (PbEG L 290);
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel1
  - number: 1.1.gi
    text: |-
      gelatine: voor menselijke consumptie bestemd natuurlijk, oplosbaar eiwit, gelerend of niet-gelerend, verkregen door
      gedeeltelijke hydrolyse van collageen uit beenderen, huiden, ligamenten en pezen van dieren.
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel1
  - number: '1.2'
    text: |-
      Dit besluit is niet van toepassing op de bereiding en opslag van voor menselijke consumptie bestemde vleesprodukten
      alsmede van andere voor menselijke consumptie bestemde produkten van dierlijke oorsprong in detailhandelszaken of
      in lokalen die aan verkooppunten grenzen, waar de bereiding en de opslag uitsluitend met het oog op rechtstreekse
      verkoop aan de consument geschieden.
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel1
  - number: '2.1'
    text: |-
      Met betrekking tot de produktie en het in handel brengen van vleesprodukten wordt voldaan aan de eisen dat deze
      produkten:
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel2
  - number: 2.1.A
    text: |-
      bereid en opgeslagen zijn in een inrichting die is erkend en gecontroleerd: - overeenkomstig [artikel 7][ref1] en
      die voldoet aan de eisen, gesteld bij of krachtens dit besluit, met name [Bijlage A][ref2] en [Bijlage B][ref3],
      [hoofdstukken I][ref4] en [II][ref5]; of
        - overeenkomstig [artikel 8, eerste lid][ref6], indien de inrichting geen industriële produktiestructuur of
      -capaciteit heeft;
        - of geregistreerd en gecontroleerd zijn overeenkomstig [artikel 8, tweede lid][ref7];


      [ref1]: https://wetten.overheid.nl/BWBR0006293#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006293
      [ref3]: https://wetten.overheid.nl/BWBR0006293
      [ref4]: https://wetten.overheid.nl/BWBR0006293
      [ref5]: https://wetten.overheid.nl/BWBR0006293
      [ref6]: https://wetten.overheid.nl/BWBR0006293#Artikel8
      [ref7]: https://wetten.overheid.nl/BWBR0006293#Artikel8
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006293
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0006293
      - id: ref3
        bwb_id: BWBR0006293
      - id: ref4
        bwb_id: BWBR0006293
      - id: ref5
        bwb_id: BWBR0006293
      - id: ref6
        bwb_id: BWBR0006293
        artikel: '8'
      - id: ref7
        bwb_id: BWBR0006293
        artikel: '8'
  - number: 2.1.B
    text: |-
      bereid zijn van vlees als omschreven in [artikel 1, onder ][ref1], met dien verstande dat


      [ref1]: https://wetten.overheid.nl/BWBR0006293#Artikel1
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006293
        artikel: '1'
  - number: 2.1.B.1e
    text: |-
      overeenkomstig artikel 17, tweede alinea, van [richtlijn nr. 91/495/EEG](31991L0495) ingevoerd vlees van gekweekt
      grof wild slechts mag worden gebruikt indien: - de van dit vlees verkregen produkten voldoen aan de eisen van dit
      besluit,
        - deze produkten niet worden voorzien van het keurmerk, bedoeld in [bijlage B][ref1], [hoofdstuk VI][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0006293
      [ref2]: https://wetten.overheid.nl/BWBR0006293
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006293
      - id: ref2
        bwb_id: BWBR0006293
  - number: 2.1.B.2e
    text: |-
      geen gebruik wordt gemaakt van vlees dat met inachtneming van de eisen van de artikelen 5 en 6 van [richtlijn nr.
      64/433/EEG](31964L0433) voor de consumptie ongeschikt is verklaard, en van:
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel2
  - number: 2.1.B.2e.a
    text: de organen van het genitaal apparaat van vrouwelijke of mannelijke dieren, met uitzondering van de testikels,
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel2
  - number: 2.1.B.2e.b
    text: de organen van het urinair apparaat, met uitzondering van de nieren en de blaas,
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel2
  - number: 2.1.B.2e.c
    text: kraakbeen van het strottehoofd, de luchtpijp en de extralobulaire bronchiën,
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel2
  - number: 2.1.B.2e.d
    text: ogen en oogleden,
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel2
  - number: 2.1.B.2e.e
