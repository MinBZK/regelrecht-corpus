      voor zover het betreft: - de voorwaarden inzake erkenning van de inrichtingen als bedoeld in bijlage A, hoofdstuk I
      en in [bijlage B][ref2], [hoofdstuk I][ref3];
        - de voorwaarden inzake inspectie als bedoeld in [bijlage B][ref4], [hoofdstuk IV][ref5];
        - de eisen betreffende het keurmerk als bedoeld in [bijlage B][ref6], [hoofdstuk VI][ref7], niet van toepassing
      zijn op vleesprodukten die andere levensmiddelen bevatten en die voor een gering percentage uit vlees,
      vleesprodukten of vleesbereidingen bestaan.


