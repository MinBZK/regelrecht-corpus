  - number: 2.1.G
    text: |-
      onverminderd de in [richtlijn nr. 80/215/EEG](31980L0215) vastgestelde eisen inzake het aanbrengen van het merk,
      onder verantwoordelijkheid van de exploitant of de beheerder van de inrichting, worden gemerkt door middel van:
        - een nationaal keurmerk wanneer de gebruikte grondstof met dat merk in de handel is gebracht; het model van het
      keurmerk wordt door Onze Minister vastgesteld;
        - een door Onze Minister vast te stellen merk, indien het gebruikte vlees en de daarmee vervaardigde vleesprodukten
      uitsluitend bestemd mogen worden voor de lokale handel;
        - een keurmerk als bedoeld in bijlage B, hoofdstuk VI, in de andere gevallen. Deze merken worden gedrukt op het
      etiket dan wel worden aangebracht op het produkt of de onmiddellijke verpakking, met dien verstande dat voor het
      drukken of herdrukken van etiketten of merken toestemming van de bevoegde autoriteit is vereist;
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel2
  - number: 2.1.H
    text: |-
      gehanteerd, opgeslagen en vervoerd zijn overeenkomstig [bijlage B][ref1], [hoofdstuk VII][ref2]; indien zij in
      een niet bij de inrichting behorend koel- of vrieshuis zijn opgeslagen, moet dit koel- of vrieshuis overeenkomstig
      [artikel 9 van het Besluit produktie en handel vers vlees][ref3] erkend en gecontroleerd zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0006293
      [ref2]: https://wetten.overheid.nl/BWBR0006293
      [ref3]: https://wetten.overheid.nl/BWBR0006294#Artikel9
