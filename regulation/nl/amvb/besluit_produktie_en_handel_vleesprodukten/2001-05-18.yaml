  - number: '12.1'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad*, waarin het
      wordt geplaatst, met dien verstande dat vleesprodukten, afkomstig van inrichtingen als bedoeld in artikel 10 van
      de richtlijn, die op de voet van dat artikel een verzoek tot indeling hebben ingediend, waarop nog niet is beslist,
      tot 1 januari 1996 of zoveel eerder als op dat verzoek is beslist, moeten zijn voorzien van een door Onze Minister
      vastgesteld keurmerk.
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel12
  - number: '12.2'
    text: |-
      In afwijking van het eerste lid treedt dit besluit voor inrichtingen waaraan door Onze Minister, op de voet van
      [richtlijn nr. 92/120/EEG](31992L0120) van 17 december 1992, een afwijking is toegestaan van sommige van de in
      bijlage A, hoofdstuk I en in [bijlage C][ref1], [hoofdstuk II][ref2], [onder A][ref3], en [hoofdstuk III][ref4]
      van genoemde richtlijn gestelde structurele eisen, voor wat betreft die punten in werking met ingang van 1 januari
      1996;


      [ref1]: https://wetten.overheid.nl/BWBR0006293
      [ref2]: https://wetten.overheid.nl/BWBR0006293
      [ref3]: https://wetten.overheid.nl/BWBR0006293
      [ref4]: https://wetten.overheid.nl/BWBR0006293
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006293
      - id: ref2
        bwb_id: BWBR0006293
      - id: ref3
        bwb_id: BWBR0006293
      - id: ref4
        bwb_id: BWBR0006293
  - number: '12.3'
    text: |-
      Wijziging van de in dit besluit genoemde richtlijnen treedt voor de toepassing van de artikelen van dit besluit,
      waarin naar die onderdelen van die richtlijnen wordt verwezen, in werking met ingang van de dag waarop aan de
      betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel12
  - number: '13'
    text: 'Dit besluit wordt aangehaald als: Besluit produktie en handel vleesprodukten.'
    url: https://wetten.overheid.nl/BWBR0006293/2001-05-18#Artikel13
