        artikel: '6'
  - number: '5'
    text: |-
      Andere produkten van dierlijke oorsprong - zijn verkregen uit inrichtingen, welke voldoen aan de eisen
      van [artikel 6][ref1], die een vergunning hebben verkregen en voorkomen in het register overeenkomstig
      [artikel 9][ref2] die voldoen aan de normen van [bijlage A][ref3] en worden gecontroleerd overeenkomstig
      [artikel 7][ref4],
        - worden vervaardigd overeenkomstig de specifieke voorwaarden van [bijlage C][ref5],
        - worden onderworpen aan de controles van [bijlage B][ref6], [hoofdstuk IV][ref7],
        - zijn vergezeld van een handelsdocument overeenkomstig [artikel 2, eerste lid, onder I][ref8], waarin de oorsprong
      van genoemde produkten wordt aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0006293#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0006293#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0006293
      [ref4]: https://wetten.overheid.nl/BWBR0006293#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0006293
      [ref6]: https://wetten.overheid.nl/BWBR0006293
      [ref7]: https://wetten.overheid.nl/BWBR0006293
      [ref8]: https://wetten.overheid.nl/BWBR0006293#Artikel2
