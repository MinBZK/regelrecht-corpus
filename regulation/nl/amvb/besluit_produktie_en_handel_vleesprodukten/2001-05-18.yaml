  - number: 2.1.I
    text: |-
      gedurende het vervoer vergezeld gaan van een begeleidend handelsdocument, waarvan de vorm en inhoud door Onze
      Minister, in overeenstemming met de Minister van Landbouw, Natuurbeheer en Visserij, zal worden vastgesteld.
      Deze verplichting geldt niet voor vleesprodukten in hermetisch gesloten recipiënten die de in [Bijlage B][ref1],
      [hoofdstuk VIII][ref2], [punt B][ref3], eerste streepje, bedoelde behandeling hebben ondergaan, indien het keurmerk
      onuitwisbaar op de recipiënt is aangebracht, overeenkomstig de door Onze Minister vast te stellen voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0006293
      [ref2]: https://wetten.overheid.nl/BWBR0006293
      [ref3]: https://wetten.overheid.nl/BWBR0006293
