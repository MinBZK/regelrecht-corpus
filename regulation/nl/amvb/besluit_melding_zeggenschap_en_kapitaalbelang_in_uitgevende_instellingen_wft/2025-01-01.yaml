  - number: '8'
    text: |-
      Bij een melding als bedoeld in [artikel 5:43 van de wet][ref1] verstrekt de meldingsplichtige de volgende gegevens:

      a. de naam van de meldingsplichtige;

      b. het adres en de woonplaats van de meldingsplichtige;

      c. de naam van de desbetreffende aandeelhouder, ook indien deze niet zelf meldingsplichtig is;

      d. de datum waarop de meldingsplicht is ontstaan;

      e. de naam van de uitgevende instelling;

      f. het aantal en de soort aandelen en stemmen in de uitgevende instelling waarover hij beschikte op het tijdstip
      waarop de meldingsplicht is ontstaan;

      g. indien hij op het tijdstip waarop de meldingsplicht is ontstaan beschikte over een of meer aandelen
      met een bijzonder statutair recht inzake de zeggenschap in de uitgevende instelling, en voor zover
      [artikel 5:43, eerste lid, van de wet][ref2] van toepassing is: het aantal en de soort aandelen, alsmede de aard
      van het bijzondere recht;

      h. voor zover [artikel 5:45, derde lid, eerste volzin, van de wet][ref3] van toepassing is: de naam van de
      desbetreffende dochtermaatschappij. Indien de aandelen en de daaraan verbonden stemmen worden gehouden door
      middel van een keten van een of meer dochtermaatschappijen vermeldt de meldingsplichtige ook de naam van deze
      dochtermaatschappij of dochtermaatschappijen;

      i. indien de melding tevens strekt ter voldoening aan [artikel 5:48, vierde lid, eerste volzin, van de wet][ref4]:

      1°. de namen van de gelieerde uitgevende instellingen;

      2°. het aantal en de soort aandelen en stemmen in de gelieerde uitgevende instellingen waarover hij beschikte op
      het tijdstip waarop de meldingsplicht is ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel543
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel543
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel545
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel548
