  - number: '12'
    text: |-
      1 Ten behoeve van een melding als bedoeld in de [artikelen 5:38, eerste en tweede lid][ref1], en
      [5:39, eerste lid, van de wet][ref2] wordt het aantal aandelen of het aantal stemmen waarover iemand beschikt
      berekend op het totale nominale bedrag van de onderliggende aandelen van het financieel instrument, tenzij het
      financieel instrument uitsluitend recht geeft op een afwikkeling in contanten, in welk geval het aantal aandelen
      of het aantal stemmen waarover iemand beschikt wordt berekend op naar delta gecorrigeerde basis door het nominale
      bedrag van de onderliggende aandelen te vermenigvuldigen met de delta van het financieel instrument.

      2 De berekening van het aantal stemmen, bedoeld in het eerste lid, voldoet aan de ingevolge artikel 13, eerste lid
      bis, van de richtlijn transparantie gestelde eisen. De berekening van het aantal aandelen, bedoeld in het eerste
      lid, geschiedt op overeenkomstige wijze.


