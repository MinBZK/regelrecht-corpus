  - number: 5a
    text: |-
      Een meldingsplichtige behoort uiterlijk twee handelsdagen nadat hij de beschikking heeft verkregen of verloren over
      aandelen dan wel stemmen te weten dat hij een drempelwaarde bereikt, overschrijdt dan wel onderschrijdt.
    url: https://wetten.overheid.nl/BWBR0020416/2025-01-01#Artikel5a
  - number: '6'
    text: |-
      1 Bij een melding als bedoeld in [artikel 5:40, eerste volzin, van de wet][ref1] verstrekt de meldingsplichtige de
      volgende gegevens:

      a. de naam van de meldingsplichtige;

      b. het adres en de woonplaats van de meldingsplichtige;

      c. de naam van de desbetreffende aandeelhouder, indien deze niet zelf meldingsplichtig is;

      d. de datum waarop de meldingsplicht is ontstaan;

      e. de naam van de uitgevende instelling; en

      f. het aantal en de soort aandelen met een bijzonder statutair recht inzake de zeggenschap in de uitgevende
      instelling, alsmede de aard van dit bijzondere recht, waarover hij beschikte op het tijdstip waarop de
      meldingsplicht is ontstaan;

      2 Bij een melding als bedoeld in [artikel 5:40, eerste volzin, van de wet][ref2] verstrekt de meldingsplichtige,
      indien deze melding tevens strekt ter voldoening aan [artikel 5:45, derde lid, eerste volzin, van de wet][ref3],
      tevens het volgende gegeven: de naam van de desbetreffende dochtermaatschappij;

      3 Bij een melding als bedoeld in [artikel 5:40, eerste volzin, van de wet][ref4], verstrekt de meldingsplichtige,
      indien de melding betrekking heeft op aandelen in een uitgevende instelling en tevens strekt ter voldoening aan
      [artikel 5:48, zesde lid, eerste volzin, van de wet][ref5], tevens de volgende gegevens:

      a. het aantal en de soort aandelen waarop de wijziging, bedoeld in
      [artikel 5:48, zesde lid, eerste volzin, van de wet][ref6] betrekking had;

      b. de waarde waartegen hij de beschikking over de desbetreffende aandelen heeft verkregen onderscheidenlijk
      verloren; en

      c. indien van toepassing: het feit dat de wijziging voortvloeit uit een transactie die is verricht door een
      gevolmachtigde aan wie hij door middel van een schriftelijke overeenkomst van lastgeving het vrije beheer van de
      financiële instrumentenportefeuille heeft overgedragen.

      4 Bij een melding als bedoeld in [artikel 5:40, eerste volzin, van de wet][ref7] verstrekt de meldingsplichtige,
      indien de melding betrekking heeft op aandelen in een gelieerde uitgevende instelling en tevens strekt ter
      voldoening aan [artikel 5:48, zesde lid, eerste volzin, van de wet][ref8], de volgende gegevens:

      a. de gegevens, bedoeld in het eerste lid, onderdelen a tot en met e;

      b. het aantal en de soort aandelen met een bijzonder statutair recht inzake de zeggenschap in de gelieerde
      uitgevende instelling, waarover hij beschikte op het tijdstip waarop de meldingsplicht is ontstaan, alsmede de aard
      van dit bijzondere recht;

      c. het aantal en de soort aandelen waarop de wijziging, bedoeld in
      [artikel 5:48, zesde lid, eerste volzin, van de wet][ref9] betrekking had;

      d. de waarde waartegen hij de beschikking over de desbetreffende aandelen heeft verkregen onderscheidenlijk
      verloren;

      e. indien van toepassing: het feit dat de wijziging voortvloeit uit een transactie die is verricht door een
      gevolmachtigde aan wie hij door middel van een schriftelijke overeenkomst van lastgeving het vrije beheer van de
      financiële instrumentenportefeuille heeft overgedragen;

      f. de naam van de gelieerde uitgevende instelling; en

      g. voor zover [artikel 5:45, derde lid, eerste volzin, van de wet][ref10] van toepassing is: de naam van de
      desbetreffende dochtermaatschappij. Indien de aandelen en de daaraan verbonden stemmen worden gehouden door
      middel van een keten van een of meer dochtermaatschappijen van de desbetreffende dochtermaatschappij vermeldt de
      meldingsplichtige ook de naam van deze dochtermaatschappij of dochtermaatschappijen.


