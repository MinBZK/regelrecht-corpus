    text: |-
      De gegevens die ingevolge dit besluit bij een melding als bedoeld in de [artikelen 5:34][ref1], [5:35][ref2],
      [5:36][ref3], [5:38 tot en met 5:43][ref4], of [5:48 van de wet][ref5] of [artikel 8b][ref6] of [8d][ref7] moeten
