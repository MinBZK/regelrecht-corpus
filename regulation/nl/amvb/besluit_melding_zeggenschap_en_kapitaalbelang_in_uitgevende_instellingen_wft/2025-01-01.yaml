  - number: 8c
    text: |-
      Onder een korte periode als bedoeld in [artikel 5:46, eerste lid, aanhef, van de wet][ref1] wordt een periode
      verstaan van ten hoogste drie handelsdagen nadat de beschikking is verkregen of verloren over aandelen en de
      daaraan verbonden stemmen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel546
    url: https://wetten.overheid.nl/BWBR0020416/2025-01-01#Artikel8c
    references:
