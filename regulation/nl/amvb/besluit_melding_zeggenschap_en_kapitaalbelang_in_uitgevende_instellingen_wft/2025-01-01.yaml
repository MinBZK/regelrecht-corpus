preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Financiën van 20 april 2006, nr. FM 2006-00968M;

    Gelet op de artikelen 9 tot en met 15 van Richtlijn nr. 2004/109/EG van het Europees Parlement en de Raad van de
    Europese Unie van 15 december 2004 betreffende de transparantievereisten die gelden voor uitgevende instellingen
    waarvan effecten tot de handel op een gereglementeerde markt zijn toegelaten en tot wijziging van Richtlijn
    2001/34/EG (PbEU L 390/38), en de artikelen 5:34, tweede lid, tweede volzin, 5:35, tweede lid, tweede volzin, en
    vierde lid, tweede volzin, 5:37, 5:44, 5:45, tiende lid, 5:48, tiende lid, en 1:107 van de Wet op het financieel
    toezicht;

    De Raad van State gehoord (advies van 19 mei 2006, No. W06.06.0134/IV);

    Gezien het nader rapport van Onze Minister van Financiën van 9 oktober 2006, nr. FM 2006-1299U;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0020416/2025-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder wet: [Wet op het financieel toezicht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0020416/2025-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: '2'
    text: |-
      Een melding als bedoeld in [artikel 5:34, tweede lid][ref1], of
      [artikel 5:35, tweede of vierde lid, van de wet][ref2] heeft betrekking op een kalenderkwartaal en vindt plaats
      binnen acht dagen na afloop van het desbetreffende kalenderkwartaal.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel534
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel535
    url: https://wetten.overheid.nl/BWBR0020416/2025-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 5:34
      - id: ref2
        bwb_id: BWBR0020368
        artikel: 5:35
  - number: '3'
    text: |-
      1 Bij een melding als bedoeld in [artikel 5:34][ref1] of [5:35 van de wet][ref2] verstrekt de meldingsplichtige de
      volgende gegevens:

      a. de naam van de uitgevende instelling;

      b. voor zover van toepassing: het nummer van inschrijving van de uitgevende instelling in het handelsregister,
      bedoeld in [artikel 2 van de Handelsregisterwet 1996][ref3]; en

      c. de datum waarop de meldingsplicht is ontstaan.

      2 Bij een melding als bedoeld in [artikel 5:34 van de wet][ref4] verstrekt de meldingsplichtige tevens de volgende
      gegevens:

      a. de omvang van het kapitaal op het tijdstip waarop de meldingsplicht is ontstaan; en

      b. het aantal en de soort aandelen, bedoeld in [artikel 5:33, eerste lid, onderdeel b, onder 1°, van de wet][ref5],
      waarin het kapitaal is verdeeld op het tijdstip waarop de meldingsplicht is ontstaan.

      3 Bij een melding als bedoeld in [artikel 5:34, tweede lid, eerste volzin, van de wet][ref6] van wijzigingen die
      zich hebben voorgedaan in een kalendermaand die niet de laatste maand is van het desbetreffende kalenderkwartaal,
      verstrekt de meldingsplichtige tevens de volgende gegevens: de omvang van het kapitaal en het aantal en de soort
      aandelen, bedoeld in het tweede lid, onderdeel b, aan het eind van die kalendermaand.

      4 Bij een melding als bedoeld in
      [artikel 5:35, eerste lid, eerste volzin, of tweede lid, eerste volzin, van de wet][ref7] verstrekt de
      meldingsplichtige tevens de volgende gegevens: het aantal en de soort stemmen op het tijdstip waarop de
      meldingsplicht is ontstaan.

      5 Bij een melding als bedoeld in [artikel 5:35, tweede lid, eerste volzin, van de wet][ref8] verstrekt de
      meldingsplichtige tevens de volgende gegevens:

      a. het aantal en de soort stemmen op het tijdstip waarop de meldingsplicht is ontstaan; en

      b. indien de wijzigingen zich hebben voorgedaan in een kalendermaand die niet de laatste maand is van het
      desbetreffende kalenderkwartaal: het aantal en de soort stemmen aan het eind van die kalendermaand.

      6 Bij een melding als bedoeld in [artikel 5:35, derde lid, van de wet][ref9] verstrekt de
      meldingsplichtige tevens de volgende gegevens: het aantal en de soort aandelen, bedoeld in
      [artikel 5:33, eerste lid, onderdeel b, onder 2°, van de wet][ref10] op het tijdstip waarop de meldingsplicht
      is ontstaan.

      7 Bij een melding als bedoeld in [artikel 5:35, vierde lid, eerste volzin, van de wet][ref11] verstrekt de
      meldingsplichtige tevens de volgende gegevens:

      a. het aantal en de soort aandelen, bedoeld in [artikel 5:33, eerste lid, onderdeel b, onder 2°, van de wet][ref12]
      op het tijdstip waarop de meldingsplicht is ontstaan; en

      b. indien de wijzigingen zich hebben voorgedaan in een kalendermaand die niet de laatste
      maand is van het desbetreffende kalenderkwartaal: het aantal en de soort aandelen, bedoeld in
      [artikel 5:33, eerste lid, onderdeel b, onder 2°, van de wet][ref13] aan het eind van die kalendermaand.


