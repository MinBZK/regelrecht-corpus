  - number: 8a
    text: |-
      De Autoriteit Financiële Markten kan regels stellen met betrekking tot de handelsdagen die gelden op een
      gereglementeerde markt in Nederland.
    url: https://wetten.overheid.nl/BWBR0020416/2025-01-01#Artikel8a
  - number: 8b
    text: |-
      1 De in [artikel 5:45, elfde lid, aanhef, van de wet][ref1] genoemde gecontroleerde onderneming dient de stemmen
      die zijn verbonden aan de door haar beheerde aandelen onafhankelijk van haar moedermaatschappij of degene die
      overwegende zeggenschap over haar kan uitoefenen, te kunnen uitoefenen.

      2 Degene wiens gecontroleerde onderneming aandelen beheert in een naamloze vennootschap naar Nederlands recht
      waarvan aandelen zijn toegelaten tot de handel op een gereglementeerde markt of in een rechtspersoon die is
      opgericht naar het recht van een staat die geen lidstaat is, voor welke rechtspersoon Nederland de lidstaat van
      herkomst is en waarvan aandelen zijn toegelaten tot de handel op een gereglementeerde markt in Nederland, meldt
      onverwijld aan de Autoriteit Financiële Markten, of, indien het aandelen betreft in een rechtspersoon die is
      opgericht naar het recht van een staat die geen lidstaat is en voor welke rechtspersoon Nederland een lidstaat
      van ontvangst is waarvan aandelen zijn toegelaten tot de handel op een gereglementeerde markt in Nederland, aan de
      toezichthoudende instantie van de lidstaat van herkomst van die rechtspersoon:

      a. de naam van de in dat lid genoemde gecontroleerde onderneming die de betreffende aandelen beheert;

      b. de naam van de toezichthoudende instantie dan wel, indien van toepassing, het feit dat er geen toezichthoudende
      instantie is op die gecontroleerde onderneming; en

      c. tenzij zijn gecontroleerde onderneming uitsluitend opties als bedoeld in
      [artikel 5:33, eerste lid, onderdeel b, onder 4, van de wet][ref2] beheert: een verklaring dat die gecontroleerde
      onderneming naar eigen goeddunken de stemmen kan uitbrengen die zijn verbonden aan de aandelen die zij beheert.

      3 De persoon, bedoeld in het tweede lid, werkt de in de onderdelen a tot en met c van dat lid gemelde gegevens
      voortdurend bij.

      4 De persoon, bedoeld in het tweede lid, toont aan de in dat lid genoemde toezichthoudende instantie op haar
      verzoek aan dat:

      a. haar organisatorische structuur en die van de gecontroleerde onderneming zodanig zijn dat de gecontroleerde
      onderneming de stemmen die zijn verbonden aan de door haar beheerde aandelen naar eigen goeddunken kan uitbrengen;

      b. de personen die beslissen over de wijze waarop de stemrechten worden uitgeoefend onafhankelijk opereren;

      c. indien zij een cliënt is van haar gecontroleerde onderneming dan wel een deelneming heeft in een uitgevende
      instelling waarvan aandelen worden beheerd door de gecontroleerde onderneming: het feit dat er een duidelijk en
      schriftelijk mandaat is voor een onafhankelijke cliëntenrelatie tussen haar en de gecontroleerde onderneming; en

      d. zij met de gecontroleerde onderneming is overeengekomen dat zij geen informatie zullen uitwisselen met
      betrekking tot de uitoefening van de stemrechten die zijn verbonden aan de door de gecontroleerde onderneming
      beheerde aandelen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel545
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel533
    url: https://wetten.overheid.nl/BWBR0020416/2025-01-01#Artikel8b
