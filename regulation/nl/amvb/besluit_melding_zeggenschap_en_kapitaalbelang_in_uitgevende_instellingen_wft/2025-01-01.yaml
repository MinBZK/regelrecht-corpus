  - number: '9'
    text: |-
      1 Bij een melding als bedoeld in [artikel 5:48 van de wet][ref1] verstrekt de meldingsplichtige, onverminderd de
      [artikelen 5 tot en met 8][ref2], de volgende gegevens:

      a. de naam van de meldingsplichtige;

      b. het adres en de woonplaats van de meldingsplichtige;

      c. de datum waarop de meldingsplicht is ontstaan; en

      d. de naam van de uitgevende instelling en, voor zover van toepassing, van de gelieerde uitgevende instellingen.

      2 Bij een melding als bedoeld in
      [artikel 5:48, derde lid, eerste volzin, vierde lid, eerste volzin, of vijfde lid, eerste volzin, van de wet][ref3]
      verstrekt de meldingsplichtige tevens de volgende gegevens: het aantal en de soort aandelen en stemmen in de
      uitgevende instelling of in de gelieerde uitgevende instellingen waarover hij beschikte op het tijdstip waarop de
      meldingsplicht is ontstaan.

      3 Bij een melding als bedoeld in [artikel 5:48, zesde lid, eerste volzin, van de wet][ref4] verstrekt de
      meldingsplichtige tevens de volgende gegevens:

      a. het aantal en de soort aandelen in de uitgevende instelling of de gelieerde uitgevende instelling waarop de
      wijziging betrekking had;

      b. de waarde waartegen hij de beschikking over deze aandelen heeft verkregen onderscheidenlijk verloren;

      c. indien van toepassing: het feit dat de wijziging voortvloeit uit een transactie die is verricht door een
      gevolmachtigde aan wie hij door middel van een schriftelijke overeenkomst van lastgeving het vrije beheer van de
      financiële instrumentenportefeuille heeft overgedragen; en

      d. het aantal en de soort aandelen in de uitgevende instelling of de gelieerde uitgevende instelling waarover hij
      na de wijziging beschikt.

      4 Bij een melding als bedoeld in [artikel 5:48, zevende lid, eerste volzin, van de wet][ref5] verstrekt de
      meldingsplichtige tevens de volgende gegevens:

      a. het aantal en de soort stemmen in de uitgevende instelling of de gelieerde uitgevende instelling waarop de
      wijziging betrekking had;

      b. de waarde waartegen hij de beschikking over deze stemmen heeft verkregen onderscheidenlijk verloren;

      c. indien van toepassing: het feit dat de wijziging voortvloeit uit een transactie die is verricht door een
      gevolmachtigde aan wie hij door middel van een schriftelijke overeenkomst van lastgeving het vrije beheer van de
      financiële instrumentenportefeuille heeft overgedragen; en

      d. het aantal en de soort stemmen in de uitgevende instelling of de gelieerde uitgevende instelling waarover hij na
      de wijziging beschikt.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel548
