      Bij een melding als bedoeld in [artikel 5:41][ref1] of [5:42 van de wet][ref2] verstrekt de meldingsplichtige de
      volgende gegevens:

      a. de naam van de meldingsplichtige;

      b. het adres en de woonplaats van de meldingsplichtige;

      c. de naam van de desbetreffende aandeelhouder, indien deze niet zelf meldingsplichtig is;

      d. de datum waarop de meldingsplicht is ontstaan;

      e. de naam van de uitgevende instelling;

      f. het aantal en de soort aandelen en stemmen in de uitgevende instelling waarover hij beschikte op het tijdstip
      waarop de meldingsplicht is ontstaan;

      g. indien hij op het tijdstip waarop de meldingsplicht is ontstaan beschikte over een of meer aandelen met
      een bijzonder statutair recht inzake de zeggenschap: het aantal en de soort aandelen, alsmede de aard van het
      bijzondere recht; en

      h. voor zover [artikel 5:45, derde lid, eerste volzin, van de wet][ref3] van toepassing is: de naam van de
      desbetreffende dochtermaatschappij. Indien de aandelen en de daaraan verbonden stemmen worden gehouden door
      middel van een keten van een of meer dochtermaatschappijen van de desbetreffende dochtermaatschappij vermeldt de
      meldingsplichtige ook de naam van deze dochtermaatschappij of dochtermaatschappijen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel541
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel542
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel545
