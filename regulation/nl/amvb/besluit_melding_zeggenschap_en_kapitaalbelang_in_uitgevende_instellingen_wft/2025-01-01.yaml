      [Artikel 5:45, derde lid, eerste volzin, van de wet][ref1] is niet van toepassing op degene wiens
      dochtermaatschappij een vermogensbeheerder is, die zijn diensten op het gebied van het beheren van individuele
      vermogens onafhankelijk verricht van andere door hem verrichte diensten.


