  - number: '5'
    text: |-
      1 Bij een melding als bedoeld in [artikel 5:38, eerste, tweede of derde lid][ref1], of
      [5:39, eerste of tweede lid, van de wet][ref2] verstrekt de meldingsplichtige de volgende gegevens:

      a. de naam van de meldingsplichtige;

      b. het adres en de woonplaats van de meldingsplichtige;

      c. voor zover [artikel 5:38, eerste of tweede lid][ref3], of [5:39, eerste lid, van de wet][ref4] van toepassing
      is: de naam van de desbetreffende aandeelhouder, indien deze niet zelf meldingsplichtig is;

      d. de datum waarop de meldingsplicht is ontstaan;

      e. de naam van de uitgevende instelling;

      f. voor zover [artikel 5:38, eerste of tweede lid][ref5], of [5:39, eerste lid, van de wet][ref6] van toepassing
      is: het aantal en de soort aandelen en stemmen in de uitgevende instelling waarover hij beschikte op het tijdstip
      waarop de meldingsplicht is ontstaan; en

      g. voor zover het een optie betreft als bedoeld in
      [artikel 5:33, eerste lid, onderdeel b, onder 4°, eerste volzin, van de wet][ref7]: de datum waarop of de termijn
      waarbinnen het in het eerste lid, onderdeel b, onder 1° of 2°, van dat artikel genoemde aandeel of aandeelbewijs
      kan worden verworven, alsmede de vervaldatum van het desbetreffende financiële instrument;

      h. voor zover [artikel 5:38, derde lid, van de wet][ref8] van toepassing is: het totaal aantal equivalente
      aandelen;

      i. voor zover [artikel 5:45, derde lid, eerste volzin, van de wet][ref9] van toepassing is: de naam van de
      desbetreffende dochtermaatschappij. Indien de aandelen en de daaraan verbonden stemmen worden gehouden door
      middel van een keten van een of meer dochtermaatschappijen van de desbetreffende dochtermaatschappij vermeldt de
      meldingsplichtige ook de naam van deze dochtermaatschappij of dochtermaatschappijen;

      j. voor zover [artikel 5:45, tiende lid, van de wet][ref10] van toepassing is: de soort financiële
      instrumenten of contracten op grond waarvan hij werd geacht over aandelen als bedoeld in
      [artikel 5:33, eerste lid, onderdeel b, van de wet][ref11], alsmede de daaraan verbonden stemmen te beschikken, de
      vervaldatum van de desbetreffende financiële instrumenten of contracten alsmede het aantal aandelen en de daaraan
      verbonden stemmen in de uitgevende instelling waarop de desbetreffende financiële instrumenten of contracten
      betrekking hebben;

      k. voor zover [artikel 5:45, tiende lid, onderdeel b, van de wet][ref12] van toepassing is: de
      datum waarop of de termijn waarbinnen de verplichting tot het kopen van aandelen als bedoeld in
      [artikel 5:33, eerste lid, onderdeel b, van de wet][ref13], kan ontstaan;

      l. het totale percentage van het kapitaal of de stemmen waarover de meldingsplichtige beschikt,
      waarbij een onderscheid wordt gemaakt tussen financiële instrumenten of contracten als bedoeld in
      [artikel 5:45, tiende lid, onderdeel c, van de wet][ref14], die recht geven op een afwikkeling door middel van
      materiële levering en financiële instrumenten of contracten als bedoeld in artikel 5:45, tiende lid, onderdeel c,
      van de wet, die recht geven op een afwikkeling in contanten.

      2 Bij een melding als bedoeld in [artikel 5:38, tweede lid][ref15], of
      [artikel 5:39, eerste lid, van de wet][ref16], die het gevolg is van het kunnen beschikken over stemmen die de
      meldingsplichtige als gevolmachtigde voor een algemene vergadering van aandeelhouders van een uitgevende instelling
      naar eigen goeddunken kan uitbrengen, kan worden volstaan met een enkele melding indien in die melding, naast de
      gegevens genoemd in het eerste lid indien en voor zover die van toepassing zijn, tevens de volgende gegevens worden
      verstrekt:

      a. de datum van de algemene vergadering van aandeelhouders waarvoor de meldingsplichtige gevolmachtigde is; en

      b. het aantal stemmen waarover de meldingsplichtige beschikt na deze algemene vergadering van aandeelhouders.

      3 Bij een melding als bedoeld in [artikel 5:38, eerste lid, van de wet][ref17] vermeldt de meldingsplichtige,
      indien de melding tevens strekt ter voldoening aan [artikel 5:40, eerste volzin, van de wet][ref18], tevens het
      volgende gegeven: de aard van het bijzondere recht.

      4 Bij een melding als bedoeld in [artikel 5:38, eerste lid, van de wet][ref19] verstrekt de meldingsplichtige,
      indien de melding betrekking heeft op aandelen in een uitgevende instelling en tevens strekt ter voldoening aan
      [artikel 5:48, zesde lid, eerste volzin, van de wet][ref20], tevens de volgende gegevens:

      a. het aantal en de soort aandelen waarop de wijziging, bedoeld in
      [artikel 5:48, zesde lid, eerste volzin, van de wet][ref21] betrekking had;

      b. de waarde waartegen hij de beschikking over de desbetreffende aandelen heeft verkregen onderscheidenlijk
      verloren; en

      c. indien van toepassing: het feit dat de wijziging voortvloeit uit een transactie die is verricht door een
      gevolmachtigde aan wie hij door middel van een schriftelijke overeenkomst van lastgeving het vrije beheer van de
      financiële instrumentenportefeuille heeft overgedragen.

      5 Bij een melding als bedoeld in [artikel 5:38, eerste lid, van de wet][ref22] verstrekt de meldingsplichtige,
      indien de melding betrekking heeft op aandelen in een gelieerde uitgevende instelling en tevens strekt ter
      voldoening aan [artikel 5:48, zesde lid, eerste volzin, van de wet][ref23], de volgende gegevens:

      a. de gegevens, bedoeld in het eerste lid, onderdelen a tot en met e;

      b. het aantal en de soort aandelen in de gelieerde uitgevende instelling waarover hij beschikte op het tijdstip
      waarop de meldingsplicht is ontstaan;

      c. het aantal en de soort aandelen waarop de wijziging, bedoeld in
      [artikel 5:48, zesde lid, eerste volzin, van de wet][ref24] betrekking had;

      d. de waarde waartegen hij de beschikking over de desbetreffende aandelen heeft verkregen onderscheidenlijk
      verloren;

      e. indien van toepassing: het feit dat de wijziging voortvloeit uit een transactie die is verricht door een
      gevolmachtigde aan wie hij door middel van een schriftelijke overeenkomst van lastgeving het vrije beheer van de
      financiële instrumentenportefeuille heeft overgedragen;

      f. de naam van de gelieerde uitgevende instelling; en

      g. voor zover [artikel 5:45, derde lid, eerste volzin, van de wet][ref25] van toepassing is: de naam van de
      desbetreffende dochtermaatschappij.

      6 Bij een melding als bedoeld in [artikel 5:38, tweede lid, van de wet][ref26], verstrekt de meldingsplichtige,
      indien de melding betrekking heeft op stemmen in een uitgevende instelling en tevens strekt ter voldoening aan
      [artikel 5:48, zevende lid, eerste volzin, van de wet][ref27], tevens de volgende gegevens:

      a. het aantal en de soort stemmen waarop de wijziging, bedoeld in [artikel 5:48, zevende lid, van de wet][ref28]
      betrekking had;

      b. de waarde waartegen hij de beschikking over de desbetreffende stemmen heeft verkregen onderscheidenlijk
      verloren; en

      c. indien van toepassing: het feit dat de wijziging voortvloeit uit een transactie die is verricht door een
      gevolmachtigde aan wie hij door middel van een schriftelijke overeenkomst van lastgeving het vrije beheer van de
      financiële instrumentenportefeuille heeft overgedragen.

      7 Bij een melding als bedoeld in [artikel 5:38, tweede lid, van de wet][ref29], verstrekt de meldingsplichtige,
      indien de melding betrekking heeft op stemmen in een gelieerde instelling en tevens strekt ter voldoening aan
      [artikel 5:48, zevende lid, eerste volzin, van de wet][ref30], de volgende gegevens:

      a. de gegevens, bedoeld in het eerste lid, onderdelen a tot en met e;

      b. het aantal en de soort stemmen in de gelieerde uitgevende instelling waarover hij beschikte op het tijdstip
      waarop de meldingsplicht is ontstaan;

      c. het aantal en de soort stemmen waarop de wijziging, bedoeld in [artikel 5:48, zevende lid, van de wet][ref31]
      betrekking had;

      d. de waarde waartegen hij de beschikking over de desbetreffende stemmen heeft verkregen onderscheidenlijk
      verloren;

      e. indien van toepassing: het feit dat de wijziging voortvloeit uit een transactie die is verricht door een
      gevolmachtigde aan wie hij door middel van een schriftelijke overeenkomst van lastgeving het vrije beheer van de
      financiële instrumentenportefeuille heeft overgedragen;

      f. de naam van de gelieerde uitgevende instelling; en

      g. voor zover [artikel 5:45, derde lid, eerste volzin, van de wet][ref32] van toepassing is: de naam van de
      desbetreffende dochtermaatschappij.


