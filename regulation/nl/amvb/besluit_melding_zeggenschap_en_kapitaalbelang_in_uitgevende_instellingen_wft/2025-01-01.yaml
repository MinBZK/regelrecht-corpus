  - number: '4'
    text: |-
      Bij een melding als bedoeld in [artikel 5:36 van de wet][ref1] verstrekt de meldingsplichtige de volgende gegevens:

      a. de naam van de uitgevende instelling;

      b. voor zover van toepassing: het nummer van inschrijving van de uitgevende instelling in het handelsregister,
      bedoeld in [artikel 2 van de Handelsregisterwet 1996][ref2];

      c. de datum waarop de meldingsplicht is ontstaan;

      d. de omvang van het kapitaal op het tijdstip waarop de meldingsplicht is ontstaan;

      e. het aantal en de soort aandelen, bedoeld in [artikel 5:33, eerste lid, onderdeel b, onder 1°, van de wet][ref3]
      waarin het kapitaal is verdeeld op het tijdstip waarop de meldingsplicht is ontstaan;

      f. het aantal en de soort stemmen op het tijdstip waarop de meldingsplicht is ontstaan; en

      g. voor zover van toepassing: het aantal en de soort aandelen, bedoeld in
      [artikel 5:33, eerste lid, onderdeel b, onder 2°, van de wet][ref4] op het tijdstip waarop de meldingsplicht is
      ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel536
