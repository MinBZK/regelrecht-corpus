        bwb_id: BWBR0020368
        artikel: 5:46
  - number: 8d
    text: |-
      1 Een persoon als bedoeld in [artikel 5:46, tweede lid, onderdeel b, van de wet][ref1] meldt onverwijld, indien
      het aandelen betreft in een naamloze vennootschap naar Nederlands recht waarvan aandelen zijn toegelaten tot de
      handel op een gereglementeerde markt of in een rechtspersoon die is opgericht naar het recht van een staat die geen
      lidstaat is, voor welke rechtspersoon Nederland de lidstaat van herkomst is en waarvan aandelen zijn toegelaten
      tot de handel op een gereglementeerde markt in Nederland, aan de Autoriteit Financiële Markten dat hij met
      betrekking tot de desbetreffende uitgevende instelling de werkzaamheden verricht of wil verrichten als bedoeld in
      de onderdelen c en f van de definitie van het verlenen van een beleggingsdienst in [artikel 1:1 van de wet][ref2].

      2 Een persoon als bedoeld in [artikel 5:46, tweede lid, onderdeel b, van de wet][ref3] meldt onverwijld, indien
      het aandelen betreft in een rechtspersoon die is opgericht naar het recht van een staat die geen lidstaat is,
      voor welke rechtspersoon Nederland lidstaat van ontvangst is en waarvan aandelen zijn toegelaten tot de handel
      op een gereglementeerde markt in Nederland, aan de toezichthoudende instantie van de lidstaat van herkomst van
      die rechtspersoon dat hij met betrekking tot de desbetreffende uitgevende instelling de werkzaamheden verricht
      of wil verrichten als bedoeld in onderdeel a van de definitie van verrichten van een beleggingsactiviteit in
      [artikel 1:1 van de wet][ref4].

      3 Een persoon als bedoeld in het eerste of tweede lid die de in die leden genoemde werkzaamheden beëindigt, meldt
      dit, indien het betreft een naamloze vennootschap naar Nederlands recht waarvan aandelen zijn toegelaten tot de
      handel op een gereglementeerde markt of een rechtspersoon opgericht naar het recht van een staat die geen lidstaat
      is, voor welke rechtspersoon Nederland de lidstaat van herkomst is en waarvan aandelen zijn toegelaten tot de
      handel op een gereglementeerde markt in Nederland, onverwijld aan de Autoriteit Financiële Markten, of, indien
      het een rechtspersoon betreft die is opgericht naar het recht van een staat die geen lidstaat is, voor welke
      rechtspersoon Nederland een lidstaat van ontvangst is en waarvan aandelen zijn toegelaten tot de handel op een
      gereglementeerde markt in Nederland, onverwijld aan de toezichthoudende instantie van de staat van herkomst van
      die rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel546
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel546
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel11
