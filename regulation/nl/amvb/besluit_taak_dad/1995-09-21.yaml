preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Financiën van 22 mei 1995, nr. DAR 95/160m, Directoraat-Generaal van
    de Rijksbegroting, Directie Accountancy Rijksoverheid, en Centrale Directie Wetgeving, Juridische en Bestuurlijke
    Zaken;

    Gelet op artikel 32, aanhef en onder b, van de Comptabiliteitswet;

    Gezien het advies van de Algemene Rekenkamer van 1 maart 1995, kenmerk 223 R;

    De Raad van State gehoord (advies van 5 juli 1995, nr. W06.95.0271);

    Gezien het nader rapport van de Staatssecretaris van Financiën van 22 augustus 1995, nr. DAR 95/394m, Directoraat-
    Generaal van de Rijksbegroting, Directie Accountancy Rijksoverheid, en Centrale Directie Wetgeving, Juridische en
    Bestuurlijke Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0007535/1995-09-21#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van dit besluit wordt verstaan onder:

      a. DAD: de accountantsdienst, bedoeld in [artikel 22, eerste lid, van de Comptabiliteitswet][ref1];

      b. Onze Minister: de minister onder wie de betrokken DAD ressorteert.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel22
    url: https://wetten.overheid.nl/BWBR0007535/1995-09-21#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '22'
  - number: '2'
    text: |-
      1 De DAD staat onder leiding van een accountant bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1].

      2 De DAD is in de organisatie van het ministerie rechtstreeks geplaatst onder de secretaris-generaal en rapporteert
      aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0007535/1995-09-21#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '3'
    text: |-
      Naast de controle, bedoeld in [artikel 22, eerste lid, van de Comptabiliteitswet][ref1] is de DAD belast met de
      volgende controle- en adviestaken:

      a. de controle op het beheer van niet-geldelijke zaken, bedoeld in
      [artikel 19, derde lid, van de Comptabiliteitswet][ref2];

      b. bijzondere controletaken in opdracht van Onze Minister;

      c. het adviseren ter zake van de maatregelen ter opheffing van onvolkomenheden die bij de uitgevoerde controles
      zijn geconstateerd;

      d. het adviseren ter zake van het te voeren beleid op het gebied van de financiële verslaggeving en de
      accountantscontrole bij het ministerie;

      e. bijzondere adviestaken in opdracht van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0003075#Artikel19
    url: https://wetten.overheid.nl/BWBR0007535/1995-09-21#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0003075
        artikel: '19'
  - number: '4'
    text: |-
      1 De controle, bedoeld in [artikel 22, eerste lid, van de Comptabiliteitswet][ref1] is gericht op het geven van:

      a. oordelen over de ordelijkheid en de controleerbaarheid van het gevoerde financiële beheer en van de
      administraties die ten behoeve van dat beheer en de jaarlijkse financiële verantwoordingen worden gevoerd;

      b. een accountantsverklaring omtrent de getrouwheid van de financiële verantwoording, bedoeld in
      [artikel 65 van de Comptabiliteitswet][ref2]; ten behoeve van de accountantsverklaring omtrent de getrouwheid van
      deze financiële verantwoording wordt ook een accountantsverklaring gegeven omtrent de getrouwheid van de financiële
      verantwoording van een agentschap, bedoeld in [artikel 72 van de Comptabiliteitswet][ref3], en over de door Onze
      Minister aangewezen verantwoordingen van andere delen van het ministerie.

      2 De oordelen over de ordelijkheid en controleerbaarheid van het gevoerde financiële beheer en van de
      administraties, bedoeld in het eerste lid, hebben in ieder geval betrekking op de toereikendheid van de maatregelen
      van interne controle.

      3 De accountantsverklaringen omtrent de getrouwheid van financiële verantwoordingen, bedoeld in het eerste
      lid, hebben betrekking op de inrichting van de verantwoording overeenkomstig de voorschriften, op de getrouwe
      weergave in de verantwoording van de uitkomsten van het financiële beheer en op de rechtmatigheid van de in de
      verantwoording opgenomen uitkomsten van het financiële beheer.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0003075#Artikel65
      [ref3]: https://wetten.overheid.nl/BWBR0003075#Artikel72
    url: https://wetten.overheid.nl/BWBR0007535/1995-09-21#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0003075
        artikel: '65'
      - id: ref3
        bwb_id: BWBR0003075
        artikel: '72'
  - number: '5'
    text: |-
      1 De directeur DAD en het personeel van de DAD zijn bevoegd bij alle onderdelen van het ministerie inlichtingen
      in te winnen, kassen en voorraden op te nemen en administraties en daartoe behorende boeken, bescheiden en andere
      gegevensdragers te onderzoeken voor zover de directeur DAD dit voor de uitvoering van de controletaken noodzakelijk
      acht.

      2 De directeur DAD en het personeel van de DAD zijn bevoegd bij derden rechtstreeks inlichtingen in te winnen dan
      wel controlewerkzaamheden te verrichten voor zover de bevoegdheid daartoe bij of krachtens de wet of anderszins aan
      Onze Minister is verleend.
    url: https://wetten.overheid.nl/BWBR0007535/1995-09-21#Artikel5
  - number: '6'
    text: |-
      1 De directeur DAD draagt zorg voor een systematische, duidelijke, toereikende en tijdige rapportering van de
      uitkomsten van de controlewerkzaamheden van de DAD aan Onze Minister.

      2 Elk jaar wordt het samenvattende rapport bedoeld in [artikel 22, vijfde lid, van de Comptabiliteitswet][ref1],
      tijdig voor de wettelijke datum waarop de jaarlijkse financiële verantwoording aan Onze Minister van Financiën moet
      worden toegezonden, aan Onze Minister ter beschikking gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003075#Artikel22
    url: https://wetten.overheid.nl/BWBR0007535/1995-09-21#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003075
        artikel: '22'
  - number: '7'
    text: |-
      1 De directeur DAD doet van de door de DAD uitgebrachte rapporten rechtstreeks een exemplaar toekomen aan de
      directeur van de Centrale Directie Financieel-Economische Zaken van het ministerie en verstrekt laatstgenoemde op
      diens verzoek de nadere gegevens die deze voor de uitoefening van zijn taak nodig heeft.

      2 De directeur DAD draagt er zorg voor dat de rapporten van de DAD ter beschikking worden gesteld van de
      functionarissen en de instanties die daartoe bij of krachtens de wet of bij besluit van Onze Minister zijn
      aangewezen.
    url: https://wetten.overheid.nl/BWBR0007535/1995-09-21#Artikel7
  - number: '8'
    text: |-
      Binnen een ministerie vindt in een commissie onder leiding van de secretaris-generaal, mede aan de hand van de
      rapporten van de DAD, overleg plaats over de controle-aangelegenheden van het ministerie. In deze commissie hebben
      in ieder geval zitting de directeur DAD en de directeur van de Centrale Directie Financieel-Economische Zaken.
    url: https://wetten.overheid.nl/BWBR0007535/1995-09-21#Artikel8
  - number: '9'
    text: |-
      1 De directeur DAD neemt deel aan het interdepartementale overleg van de directeuren DAD en de directeur van de
      Directie Accountancy Rijksoverheid van het ministerie van Financiën.

      2 Onze Minister van Financiën kan met betrekking tot dit overleg en de deelneming daaraan regels stellen.
    url: https://wetten.overheid.nl/BWBR0007535/1995-09-21#Artikel9
  - number: '10'
    text: |-
      Onze Minister van Financiën kan, gehoord het interdepartementale overleg bedoeld in
      [artikel 9, eerste lid][ref1], nadere regels stellen met betrekking tot de controle, bedoeld in
      [artikel 22, eerste lid, van de Comptabiliteitswet][ref2] en met betrekking tot de controle van het beheer van
      niet-geldelijke zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0007535#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003075#Artikel22
    url: https://wetten.overheid.nl/BWBR0007535/1995-09-21#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007535
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0003075
        artikel: '22'
  - number: '11'
    text: |-
      1 Het Besluit taak departementale accountantsdienst wordt ingetrokken.

      2 Dit besluit treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad* waarin
      het wordt geplaatst.

      3 Het besluit wordt aangehaald als: "Besluit taak DAD".
    url: https://wetten.overheid.nl/BWBR0007535/1995-09-21#Artikel11
