        artikel: '3'
  - number: '2.3'
    text: |-
      Het is verboden te handelen in strijd met de krachtens artikel 20, tweede lid, van verordening (EG) 1223/2009
      gestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0029746/2014-03-01#Artikel2
  - number: '3.1'
    text: |-
      Het productinformatiedossier, bedoeld in artikel 11, eerste lid, van [verordening (EG) 1223/2009](32009R1223) is in
      ieder geval gesteld in de Nederlandse of Engelse taal.
    url: https://wetten.overheid.nl/BWBR0029746/2014-03-01#Artikel3
  - number: '3.2'
    text: |-
      De aanduidingen, bedoeld in artikel 19, eerste lid, onder b, c, d en f, en tweede tot en met vierde lid, van
      [verordening (EG) 1223/2009](32009R1223) zijn in ieder geval gesteld in de Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0029746/2014-03-01#Artikel3
  - number: '3.3'
    text: |-
      De aanduidingen, bedoeld in artikel 19, eerste lid, van [verordening (EG) 1223/2009](32009R1223) worden bij niet-
      voorverpakte cosmetische producten of bij cosmetische producten die op de plaats van verkoop op verzoek van de
      koper worden verpakt of worden voorverpakt met het oog op de onmiddellijke verkoop daarvan, aangebracht op een
      mededeling in de onmiddellijke nabijheid van het te koop aangeboden product dan wel op een informatieblad of folder
      die aan de koper wordt meegegeven.
    url: https://wetten.overheid.nl/BWBR0029746/2014-03-01#Artikel3
  - number: '4'
    text: |-
      Als nationale bevoegde autoriteit, bedoeld in artikel 34, eerste lid, van [verordening (EG) 1223/2009](32009R1223)
      wordt aangewezen de Nederlandse Voedsel- en Warenautoriteit.
    url: https://wetten.overheid.nl/BWBR0029746/2014-03-01#Artikel4
  - number: '9'
    text: |-
      Het [Warenwetbesluit cosmetische producten][ref1] wordt ingetrokken.


