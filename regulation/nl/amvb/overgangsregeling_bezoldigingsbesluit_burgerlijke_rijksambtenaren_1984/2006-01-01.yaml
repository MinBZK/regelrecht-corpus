preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken van 25 mei 1983, nr. AB83/U578, Directoraat-Generaal voor
    Overheidspersoneelsbeleid, Directie Overheidspersoneelszaken, Hoofdafdeling Financiële Arbeidsvoorwaarden;

    Gelet op artikel 125, eerste lid, van de Ambtenarenwet 1929 (Stb. 530);

    De Raad van State gehoord (advies van 2 augustus 1983, nr. W04.83.0322/10.3.30);

    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken, van 25 oktober 1983, nr. AB83/1436,
    Directoraat-Generaal voor Overheidspersoneelsbeleid, Directie Overheidspersoneelszaken, Hoofdafdeling Financiële
    Arbeidsvoorwaarden;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003631/2006-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Het [Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1] treedt, met inachtneming van de bij of krachtens
      dit besluit gegeven regelen van overgangsrecht, in werking met ingang van 1 januari 1984.


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0003631/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: '2'
    text: |-
      Het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1948 (*Stb.* J 261) is, behoudens het bepaalde bij of krachtens
      de volgende artikelen, ingetrokken.
    url: https://wetten.overheid.nl/BWBR0003631/2006-01-01#Artikel2
  - number: '3'
    text: |-
      Voor zover toepassing van het bepaalde in
      [artikel 5, tweede en derde lid van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1] niet kan
      geschieden met ingang van 1 januari 1984 zal zulks plaatsvinden ingaande een later tijdstip, doch uiterlijk binnen
      vier jaren na vorengenoemde datum.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel5
    url: https://wetten.overheid.nl/BWBR0003631/2006-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: '5'
  - number: '4.1'
    text: |-
      Voor zover en voor zolang aan het bepaalde in
      [artikel 5, tweede en derde lid van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1] geen toepassing
      is gegeven geldt voor de ambtenaar voor wie op 31 december 1983 een salarisschaal geldt, genoemd onder *a* van het
      hierna volgende schema, de daarnaast onder *b* genoemde salarisschaal:


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel5
    url: https://wetten.overheid.nl/BWBR0003631/2006-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: '5'
  - number: 4.1.a
    text: (salarisschalen opgenomen in de bijlagen AI en AII van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1948)
    url: https://wetten.overheid.nl/BWBR0003631/2006-01-01#Artikel4
  - number: 4.1.b
    text: |-
      (salarisschalen opgenomen in de [bijlage B van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1])


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0003631/2006-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: '4.2'
    text: |-
      Het salaris van de ambtenaar wordt in de nieuwe schaal vastgesteld op het bedrag dat gelijk is aan het salaris dat
      voor hem op 1 januari 1984 in de oude schaal zou hebben gegolden. Het tijdstip waarop het salaris van de ambtenaar
      periodiek wordt verhoogd blijft als gevolg van de overgang naar de nieuwe schaal onverlet.
    url: https://wetten.overheid.nl/BWBR0003631/2006-01-01#Artikel4
  - number: '4.3'
    text: |-
      Het salaris van de ambtenaar die op 1 januari 1984 voor de toepassing van het Bezoldigingsbesluit Burgerlijke
      Rijksambtenaren 1948 als volwassene zou worden aangemerkt wordt, indien in de nieuwe schaal een gelijk bedrag
      ontbreekt, vastgesteld op het op die datum voor hem geldende bedrag, welk bedrag geacht wordt in de nieuwe schaal
      te zijn opgenomen. In die gevallen waarin het salaris dat op genoemde datum in de oude schaal voor de ambtenaar
      zou gelden minder bedraagt dan het bedrag behorende bij salarisnummer 0 van de nieuwe schaal, wordt het salaris
      op laatstbedoeld bedrag vastgesteld. Het tijdstip waarop het salaris van de ambtenaar periodiek wordt verhoogd
      blijft als gevolg van de overgang naar de nieuwe schaal onverlet, met dien verstande dat in die gevallen waarin
      het salaris wordt vastgesteld op het bedrag behorende bij salarisnummer 0 van de nieuwe schaal, het salaris voor de
      eerste maal op 1 januari 1985 periodiek wordt verhoogd.
    url: https://wetten.overheid.nl/BWBR0003631/2006-01-01#Artikel4
  - number: '4.4'
    text: |-
      Het salaris van de ambtenaar die op 1 januari 1984 voor de toepassing van het Bezoldigingsbesluit Burgerlijke
      Rijksambtenaren 1948 als niet-volwassene zou worden aangemerkt wordt, indien in de nieuwe schaal een gelijk bedrag
      ontbreekt, vastgesteld op het bedrag in de nieuwe schaal behorende bij het salarisnummer, bestaande uit de letter
      J en het getal dat overeenkomt met zijn leeftijd. Het tijdstip waarop het salaris van de ambtenaar periodiek wordt
      verhoogd blijft als gevolg van de overgang naar de nieuwe schaal onverlet.
    url: https://wetten.overheid.nl/BWBR0003631/2006-01-01#Artikel4
  - number: '4.5'
    text: |-
      In afwijking van het bepaalde in [artikel 7 van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1]
      wordt het op grond van de vorige leden geldende salaris van de ambtenaar voor wie een van de oude schalen 70, 72,
      73, 86, 87*a* of 90 gold, binnen de nieuwe schaal jaarlijks verhoogd overeenkomstig het verloop van de oude schaal.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel7
    url: https://wetten.overheid.nl/BWBR0003631/2006-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: '7'
  - number: '4.6'
    text: |-
      Binnen drie maanden na de datum van inwerkingtreding van dit besluit wordt de in het eerste lid bedoelde ambtenaar
      in kennis gesteld van de salarisschaal, het salarisnummer of het voor hem geldende salaris op grond van de eerste
      volzin van het derde lid en het tijdstip van de eerstvolgende periodieke salarisverhoging, welke voor hem gelden.
      Bovendien wordt de in het vijfde lid bedoelde ambtenaar binnen dezelfde termijn in kennis gesteld van het verloop
      van de jaarlijkse salarisverhogingen.
    url: https://wetten.overheid.nl/BWBR0003631/2006-01-01#Artikel4
  - number: '5.1'
    text: |-
      Voor zover en voor zolang aan het bepaalde in
      [artikel 5, tweede en derde lid van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1] geen
      toepassing is gegeven blijven voor de desbetreffende ambtenaren de schalen 35, 36, 38, 39, 40, 41, 42, 49,
      50, 51, 52, 53, 55, 61, 62, 63, 64, 65, 67, 74, 74*a*, 76, 78, 81, 82, 83, 84, 91, 93, 96, 96*a*, 97, 106,
      107, 108, 109, 118, 119, 121, 122, 122*a*, 123, 124, 127, 134, 135, 136, 138, 140, 141, 142, 145 en 147 van
      de bijlagen AI en AII van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1948 gehandhaafd en worden deze
      schalen voor de toepassing van de overige bepalingen van eerstgenoemd besluit geacht te zijn opgenomen in de
      [bijlage B van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0003631/2006-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0003630
  - number: '5.2'
    text: |-
      De in het vorige lid genoemde schaal 93 blijft tevens gehandhaafd voor de in het [eerste lid van artikel 4][ref1]
      bedoelde ambtenaar voor wie op 31 december 1983 schaal 70 geldt en die op genoemde datum uitzicht heeft op
      bevordering naar schaal 93.


      [ref1]: https://wetten.overheid.nl/BWBR0003631#Artikel4
    url: https://wetten.overheid.nl/BWBR0003631/2006-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003631
        artikel: '4'
  - number: '6.1'
    text: |-
      Voor de ambtenaar die op 31 december 1983 was ingedeeld in een salarisschaal opgenomen in de bijlagen BI en BII van
      het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1948, geldt de daarmede overeenkomende salarisschaal opgenomen
      in de [bijlage C van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0003631/2006-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: '6.2'
    text: |-
      Het salaris van de ambtenaar wordt in de nieuwe schaal vastgesteld op het bedrag dat gelijk is aan het salaris dat
      voor hem op 1 januari 1984 in de oude schaal zou hebben gegolden. Het tijdstip waarop het salaris van de ambtenaar
      periodiek wordt verhoogd blijft als gevolg van de overgang naar de nieuwe schaal onverlet.
    url: https://wetten.overheid.nl/BWBR0003631/2006-01-01#Artikel6
  - number: '6.3'
    text: |-
      Binnen drie maanden na de datum van inwerkingtreding van dit besluit wordt de in het eerste lid bedoelde ambtenaar
      in kennis gesteld van de salarisschaal, het salarisnummer en het tijdstip van de eerstvolgende periodieke
      salarisverhoging, welke voor hem gelden.
    url: https://wetten.overheid.nl/BWBR0003631/2006-01-01#Artikel6
  - number: '8'
    text: |-
      Zolang de nadere regels als bedoeld in
      [artikel 13, tweede lid, van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1] nog niet zijn
      vastgesteld, geschiedt de toekenning van een toelage op grond van het [eerste lid van dat artikel][ref2] op de
      wijze zoals is aangegeven in de leden 1 en 2 van artikel 40 van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren
      1948.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0003630#Artikel13
    url: https://wetten.overheid.nl/BWBR0003631/2006-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0003630
        artikel: '13'
  - number: '9'
    text: |-
      Ten aanzien van de ambtenaar die op 31 december 1983 een garantietoelage als bedoeld in artikel
      20a van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1948 genoot en die ambtenaar is in de
      zin van de Algemene burgerlijke pensioenwet (*Stb.* 1979, 679) wordt voor de toepassing van het
      [eerste lid van artikel 16 van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1] het salaris niet
      vermeerderd met 7,1%.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel16
    url: https://wetten.overheid.nl/BWBR0003631/2006-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: '16'
  - number: '10'
    text: |-
      Ten aanzien van de in het [artikel 5][ref1] van dit besluit bedoelde ambtenaren zijn de [artikelen 17][ref2] en
      [23 van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref3] van toepassing, voor zover voor hen een
      salarisschaal geldt met een lager maximumsalaris dan dat van [schaal 11 van bijlage B van dat besluit][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003631#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003630#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0003630#Artikel23
      [ref4]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0003631/2006-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003631
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0003630
        artikel: '17'
      - id: ref3
        bwb_id: BWBR0003630
        artikel: '23'
      - id: ref4
        bwb_id: BWBR0003630
  - number: '11.1'
    text: |-
      Regelen, tot stand gekomen door toepassing van artikel 23 van het Bezoldigingsbesluit
      Burgerlijke Rijksambtenaren 1948, alsmede regelingen welke hiermede rechtstreeks verband
      houden, blijven van kracht zolang en voor zover zij niet zijn ingetrokken of met toepassing van
      [artikel 26 van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1] door andere zijn vervangen.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel26
    url: https://wetten.overheid.nl/BWBR0003631/2006-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: '26'
  - number: '11.2'
    text: |-
      Bij overgang van een ambt, waaraan een regeling van prestatiebeloning, als bedoeld in artikel 23, tweede
      lid, van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1948, is verbonden naar een ambt waaraan
      geen prestatiebeloning is verbonden, wordt het bedrag waarmede de tot dusver genoten bezoldiging de in
      het nieuwe ambt te genieten bezoldiging te boven mocht gaan, als een toelage toegekend. Het bepaalde in de
      [tweede, vierde en vijfde volzin van het vijfde lid van artikel 17][ref1] van genoemd besluit blijft van kracht.


      [ref1]: https://wetten.overheid.nl/BWBR0003631#Artikel17
    url: https://wetten.overheid.nl/BWBR0003631/2006-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003631
        artikel: '17'
  - number: '12.1'
    text: |-
      Regelingen, gegrond op of vastgesteld met toepassing van de artikelen 22a, vierde lid, 24, vierde lid, 25, vierde
      lid, 26, eerste lid, en 42 van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1948, blijven gedurende ten
      hoogste twee jaren na de inwerkingtreding van dit besluit van kracht zolang en voor zover zij niet zijn ingetrokken
      of vervallen.
    url: https://wetten.overheid.nl/BWBR0003631/2006-01-01#Artikel12
  - number: '12.2'
    text: |-
      Salarissen en toelagen, toegekend op grond van regelingen, vastgesteld met toepassing van artikel 42 van het
      Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1948 worden voor zover zij zijn aan te merken als wedde in de zin
      van dat besluit, voor de toepassing van het [Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1] aangemerkt
      als bezoldiging in de zin van [artikel 2, sub f, van laatstgenoemd besluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003630
      [ref2]: https://wetten.overheid.nl/BWBR0003630#Artikel2
    url: https://wetten.overheid.nl/BWBR0003631/2006-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003630
      - id: ref2
        bwb_id: BWBR0003630
        artikel: '2'
  - number: '13.1'
    text: |-
      Toelagen, toegekend op grond van artikel 17, vijfde lid, van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren
      1948 blijven gehandhaafd, met dien verstande dat het bepaalde in de vijfde volzin van het vijfde lid van genoemd
      artikel van kracht blijft.
    url: https://wetten.overheid.nl/BWBR0003631/2006-01-01#Artikel13
  - number: '13.2'
    text: |-
      Toelagen, toegekend op grond van de artikelen 18 en 19a van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren
      1948 blijven gedurende ten hoogste twee jaren na de inwerkingtreding van dit besluit gehandhaafd
      zolang en voor zover zij niet zijn ingetrokken dan wel op grond van een der [artikelen 13][ref1] of
      [19 van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref2] opnieuw zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0003630#Artikel19
    url: https://wetten.overheid.nl/BWBR0003631/2006-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0003630
        artikel: '19'
  - number: '13.3'
    text: |-
      Toelagen, toegekend op grond van artikel 19 van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1948, alsmede
      de toelagen en salarisverhogingen genoemd in voetnoten in de bijlagen A en B van dat besluit blijven gehandhaafd
      tot het tijdstip waarop een salarisschaal gaat gelden met een hoger maximum-salaris dan dat van de voor de
      desbetreffende ambtenaar geldende salarisschaal.
    url: https://wetten.overheid.nl/BWBR0003631/2006-01-01#Artikel13
  - number: '13.4'
    text: |-
      De in de voorgaande leden bedoelde toelagen worden voor de toepassing van het
      [Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1] aangemerkt als bezoldiging in de zin van
      [artikel 2, sub f, van dat besluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003630
      [ref2]: https://wetten.overheid.nl/BWBR0003630#Artikel2
    url: https://wetten.overheid.nl/BWBR0003631/2006-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003630
      - id: ref2
        bwb_id: BWBR0003630
        artikel: '2'
  - number: '14.1'
    text: |-
      De hoofdstukken VII en IX van de bijlage G van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1948 blijven van
      kracht zolang en voor zover zij niet worden vervangen of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0003631/2006-01-01#Artikel14
  - number: '14.2'
    text: |-
      In afwijking van het bepaalde in [hoofdstuk II van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1]
      wordt het salaris van de leerkrachten aan inrichtingen voor militair onderwijs als bedoeld in hoofdstuk IX van de
      bijlage G van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1948 vastgesteld overeenkomstig het bepaalde in
      laatstbedoeld hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0003631/2006-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003630
        hoofdstuk: II
  - number: '16'
    text: |-
      Bevorderingen en toelagen, voor zover die betrekking hebben op een tijdvak, gelegen vóór 1 januari 1984, en die
      op deze datum nog niet tot stand zijn gekomen, kunnen tot 1 januari 1986 tot stand worden gebracht op grond van de
      desbetreffende bepalingen van het BBRA 1948, met inachtneming van de daarmee samenhangende nadere regels.
    url: https://wetten.overheid.nl/BWBR0003631/2006-01-01#Artikel16
  - number: '17'
    text: |-
      Zolang Ons Besluit van 17 maart 1982 (*Stb.* nr. 94) niet is vervallen of ingetrokken, vindt de toepassing van
      [artikel 21 van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1] plaats met inachtneming van de
      bepalingen van het eerstgenoemde besluit, zoals dit laatstelijk is gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel21
    url: https://wetten.overheid.nl/BWBR0003631/2006-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: '21'
  - number: '18'
    text: 'Dit besluit kan worden aangehaald als: Overgangsregeling Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984.'
    url: https://wetten.overheid.nl/BWBR0003631/2006-01-01#Artikel18
  - number: '19'
    text: Dit besluit treedt in werking met ingang van 1 januari 1984.
    url: https://wetten.overheid.nl/BWBR0003631/2006-01-01#Artikel19
