$id: besluit_opleiding_rechters_en_officieren_van_justitie
regulatory_layer: AMVB
publication_date: '2016-12-16'
valid_from: '2017-01-01'
bwb_id: BWBR0038892
url: https://wetten.overheid.nl/BWBR0038892/2017-01-01
preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Veiligheid en Justitie van 10 augustus 2016, nr.785326;

    Gelet op de artikelen 5d, tweede lid, 5f, vierde lid en 54 van de Wet rechtspositie rechterlijke ambtenaren en
    artikel 145, tweede lid, van de Wet op de rechterlijke organisatie;

    De Afdeling advisering van de Raad van State gehoord (advies van 14 september 2016, nr.W03.16.0225/II);

    Gezien het nader rapport van Onze Minister van Veiligheid en Justitie, Directie wetgeving en Juridische Zaken van 5
    december 2016, nr. 2001324;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0038892/2017-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

        - *Betrokkene:* degene die benoembaar is als rechter in opleiding of officier in opleiding;
        - *Opleiding:* de opleiding, bedoeld in [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0038892#Artikel2
    url: https://wetten.overheid.nl/BWBR0038892/2017-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0038892
        artikel: '2'
        paragraaf: '2'
  - number: '2'
    text: |-
      Er is een opleiding die ten doel heeft toekomstige rechters en officieren van justitie de kennis, de vaardigheden
      en de ervaring te verschaffen, die nodig zijn om het ambt van rechter dan wel het ambt van officier van justitie te
      kunnen uitoefenen. De opleiding omvat een introductiefase en een opleidingsfase.
    url: https://wetten.overheid.nl/BWBR0038892/2017-01-01#Artikel2
  - number: '3'
    text: |-
      De rechter in opleiding en de officier in opleiding volgen de opleiding overeenkomstig hetgeen daaromtrent met hen
      is afgesproken. Zij houden zich daarbij aan door of namens diens functionele autoriteit gegeven aanwijzingen.
    url: https://wetten.overheid.nl/BWBR0038892/2017-01-01#Artikel3
  - number: '4'
    text: |-
      Onze Minister, indien het een opleiding tot officier van justitie betreft, respectievelijk het gerechtsbestuur,
      indien het een opleiding tot rechter betreft, laat geen andere kandidaat toe tot de opleiding dan op aanbeveling
      van een door het College van procureurs-generaal respectievelijk de Raad voor de rechtspraak in te stellen
      selectiecommissie.
    url: https://wetten.overheid.nl/BWBR0038892/2017-01-01#Artikel4
  - number: '5'
    text: |-
      1 De duur van de opleiding is afhankelijk van de voorervaring en competenties van betrokkene en bedraagt maximaal
      4 jaar.

      2 De opleidingsfase duurt minimaal één jaar.
    url: https://wetten.overheid.nl/BWBR0038892/2017-01-01#Artikel5
  - number: '6'
    text: |-
      1 Voordat betrokkene kan worden benoemd tot rechter in opleiding of officier in opleiding, wordt door de beoogde
      functionele autoriteit een prognose vastgesteld van de benodigde duur van de opleiding. Zoveel mogelijk wordt
      daarbij vermeld wat de locatie is waar de opleiding wordt genoten, en tevens worden zoveel mogelijk de perioden van
      de verschillende onderdelen van de opleiding vermeld.

      2 In uitzonderlijke gevallen kan tijdens de introductiefase de duur van de opleiding door de functionele autoriteit
      worden bekort of verlengd.
    url: https://wetten.overheid.nl/BWBR0038892/2017-01-01#Artikel6
  - number: '7'
    text: |-
      1 Wanneer de rechter in opleiding of officier in opleiding aan het eind van de opleiding niet geheel aan de
      eindtermen voldoet of zal kunnen voldoen door objectiveerbare omstandigheden die de ontwikkeling van de rechter in
      opleiding onderscheidenlijk officier in opleiding hebben verstoord, kan de functionele autoriteit de duur van de
      opleiding verlengen. De verlenging bedraagt niet meer dan een jaar.

      2 De opleiding kan eenmalig voor een periode van maximaal drie maanden worden onderbroken voor buitengewoon verlof
      op verzoek van de betrokkene.
    url: https://wetten.overheid.nl/BWBR0038892/2017-01-01#Artikel7
  - number: '8'
    text: |-
      1 De rechter in opleiding onderscheidenlijk officier in opleiding wordt regelmatig beoordeeld. Daarbij wordt
      de wijze waarop hij de hem opgedragen werkzaamheden heeft uitgevoerd beoordeeld tegen de achtergrond van zijn
      toekomstige functie. Bij de beoordeling wordt rekening gehouden met het stadium van de opleiding waarin hij zich
      bevindt.

      2 Ten behoeve van de beoordeling van de rechter in opleiding en officier in opleiding stelt de Raad
      voor de rechtspraak onderscheidenlijk het College van procureurs-generaal een beoordelingsreglement
      vast, waarin het beoordelingssysteem wordt uitgewerkt. Over de beoordelingsreglementen wordt als ware
      [hoofdstuk 8 van de Wet rechtspositie rechterlijke ambtenaren][ref1] van toepassing overleg gevoerd met de
      Sectorcommissie rechterlijke macht.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0038892/2017-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008365
        hoofdstuk: '8'
  - number: '9'
    text: |-
      Indien Onze Minister, indien het een officier in opleiding betreft, respectievelijk het gerechtsbestuur, indien
      het een rechter in opleiding betreft, in de loop van de opleiding op grond van een beoordeling, bedoeld in
      [artikel 8][ref1], dan wel op andere gronden tot het oordeel komt dat de opleiding niet met gunstig resultaat zal
      kunnen worden afgesloten of de officier in opleiding respectievelijk de rechter in opleiding niet geschikt is voor
      de functie waartoe hij wordt opgeleid, beëindigt hij diens opleiding, met inachtneming van de in [artikel 2da,
      derde lid, van het Besluit rechtspositie rechterlijke ambtenaren](onbekend) bedoelde verlengingsduur.


      [ref1]: https://wetten.overheid.nl/BWBR0038892#Artikel8
    url: https://wetten.overheid.nl/BWBR0038892/2017-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0038892
        artikel: '8'
        paragraaf: '4'
  - number: '10'
    text: |-
      1 De rechter in opleiding of de officier in opleiding die de opleiding met een positieve beoordeling heeft
      afgesloten, wordt voorgedragen voor benoeming in de functie van rechter onderscheidenlijk officier van justitie.

      2 Voordat de in het eerste lid bedoelde rechter in opleiding of officier in opleiding kan worden benoemd
      tot rechter respectievelijk officier van justitie, heeft deze na het afsluitend examen, bedoeld in
      [artikel 5, eerste lid, van de Wet rechtspositie rechterlijke ambtenaren][ref1], minimaal twee jaar relevante
      juridische ervaring verworven buiten de rechterlijke organisatie, tenzij zwaarwegende gronden aanleiding tot
      afwijking geven.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel5
    url: https://wetten.overheid.nl/BWBR0038892/2017-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '5'
  - number: '11'
    text: |-
      Ten behoeve van de opleiding van de rechter in opleiding onderscheidenlijk officier in opleiding stelt de Raad
      voor de rechtspraak onderscheidenlijk het College van procureurs-generaal een opleidingsreglement vast waarin de
      opleiding wordt uitgewerkt.
    url: https://wetten.overheid.nl/BWBR0038892/2017-01-01#Artikel11
  - number: '12'
    text: |-
      Het studiecentrum rechtspleging kan worden belast met de uitvoering van een deel van de opleiding voor rechters
      in opleiding en officieren in opleiding. Het studiecentrum rechtspleging is een onder de Raad voor de rechtspraak
      ressorterende dienst als bedoeld in [artikel 40 van het Besluit financiering rechtspraak 2005][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017975#Artikel40
    url: https://wetten.overheid.nl/BWBR0038892/2017-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0017975
        artikel: '40'
  - number: '13'
    text: |-
      De Raad voor de rechtspraak en het College van procureurs-generaal kunnen gezamenlijk algemene en bijzondere
      aanwijzingen geven aan het studiecentrum rechtspleging.
    url: https://wetten.overheid.nl/BWBR0038892/2017-01-01#Artikel13
  - number: '14'
    text: |-
      1 Het [Besluit opleiding rechterlijke ambtenaren][ref1] wordt ingetrokken.

      2 Op rechterlijke ambtenaren in opleiding die op de dag voorafgaand aan de dag van inwerkingtreding van dit besluit
      als zodanig zijn benoemd, blijven de artikelen van het [Besluit opleiding rechterlijke ambtenaren][ref2] en de
      daarop berustende bepalingen, zoals deze luidden op de dag vóór het tijdstip van inwerkingtreding van dit besluit,
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003871
      [ref2]: https://wetten.overheid.nl/BWBR0003871
    url: https://wetten.overheid.nl/BWBR0038892/2017-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003871
      - id: ref2
        bwb_id: BWBR0003871
  - number: '15'
    text: |-
      Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende
      artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0038892/2017-01-01#Artikel15
  - number: '16'
    text: 'Dit besluit wordt aangehaald als: Besluit opleiding rechters en officieren van justitie.'
    url: https://wetten.overheid.nl/BWBR0038892/2017-01-01#Artikel16
