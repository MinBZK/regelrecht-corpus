  - number: 31B
    text: |-
      1 Indien toepassing is gegeven aan [artikel 22B, tweede lid, van de Rijksoctrooiwet][ref1], moet de beschrijving
      van de uitvinding:

      a. de van belang zijnde gegevens ten aanzien van de kenmerken van het micro-organisme bevatten waarover de
      aanvrager beschikt;

      b. de instelling waarbij, het nummer waaronder en de datum waarop de cultuur van het micro-organisme is gedeponeerd
      vermelden.

      2 Bij de aanvrage moet worden overgelegd:

      a. een verklaring inhoudende dat de aanvrager onherroepelijk toestemming verleent tot het overeenkomstig
      [artikel 31F][ref2] verstrekken van monsters van de door hem gedeponeerde cultuur van het micro-organisme;

      b. een afschrift van het door de instelling, waarbij de cultuur van het micro-organisme is gedeponeerd, afgegeven
      ontvangstbewijs;

      c. een afschrift van de in [artikel 31D][ref3] bedoelde verklaring.

      3 Het in het eerste lid, onder *b,* bedoelde nummer en het in het tweede lid, onder *b,* bedoelde afschrift kunnen
      ook worden verstrekt binnen een termijn van één maand na het indienen van de aanvrage.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22B
      [ref2]: https://wetten.overheid.nl/BWBR0001908#Artikel31F
      [ref3]: https://wetten.overheid.nl/BWBR0001908#Artikel31D
