  - number: 31C
    text: |-
      1 Het depot van culturen van micro-organismen overeenkomstig [artikel 22B, tweede lid, van de Rijksoctrooiwet][ref1]
      kan geschieden bij:

      a. een instelling die, in overeenstemming met artikel 7 van het Verdrag inzake de internationale erkenning van
      het depot van micro-organismen ten dienste van de octrooiverlening (*Trb.* 1978, 90), de status van internationale
      depositaris bezit of

      b. een door de Octrooiraad aangewezen instelling.

      2 Voor een aanwijzing als bedoeld in het eerste lid, onder *b,* is vereist dat de desbetreffende instelling in
      staat en bereid is:

      a. culturen van micro-organismen onder afgifte van een ontvangstbewijs in bewaring te nemen en onder behoud
      van hun eigenschappen en het treffen van toereikende veiligheidsmaatregelen en in overeenstemming met
      [artikel 31E, eerste lid][ref2], op te slaan;

      b. in overeenstemming met [artikel 31F][ref3] monsters te verstrekken van gedeponeerde culturen van micro-
      organismen;

      c. onverminderd het onder *a* en *b* bepaalde gedeponeerde culturen van micro-organismen beschikbaar te houden
      en beschikbaar te stellen door daarvan monsters te verstrekken, gedurende een tijdvak van ten minste vijf jaar
      na het tijdstip waarop het laatste verzoek om verstrekking van een monster van de desbetreffende cultuur door
      de instelling werd ontvangen, en in ieder geval gedurende een tijdvak van ten minste 30 jaar na de datum van het
      depot.

      3 Een aanwijzing als bedoeld in het eerste lid, onder *b,* kan worden gedaan voor alle of voor bepaalde soorten van
      culturen van micro-organismen.

      4 De Octrooiraad trekt een aanwijzing als bedoeld in het eerste lid, onder *b,* in, indien de desbetreffende
      instelling niet meer voldoet aan het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22B
      [ref2]: https://wetten.overheid.nl/BWBR0001908#Artikel31E
      [ref3]: https://wetten.overheid.nl/BWBR0001908#Artikel31F
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel31C
