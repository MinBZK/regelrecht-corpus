  - number: '30'
    text: |-
      1 De Octrooiraad kan modellen en monsters weigeren, indien deze gevaar voor de omgeving opleveren.

      2 De Octrooiraad is niet verplicht tot bewaring van modellen en monsters na afloop van de behandeling van de
      aanvrage, waarop zij betrekking hebben. Zij behoeven slechts te worden teruggegeven, indien bij de indiening daarom
      is verzocht.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel30
  - number: '31'
    text: |-
      Aan de Octrooiraad aangeboden stukken betreffende een aanvrage om octrooi, niet zijnde stukken als bedoeld in
      [paragraaf 6A][ref1], alsmede hem aangeboden modellen en monsters moeten zijn voorzien van een opschrift, dat de
      naam en de woonplaats van de aanvrager en het volgnummer van de aanvrage of van de openbaarmaking van de aanvrage
      bevat; indien geen van deze beide nummers bekend is, moet uit het opschrift blijken, bij welke aanvrage een en
      ander behoort. Een stuk als in dit artikel bedoeld alsmede een model en een monster mogen slechts op één aanvrage
      betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0001908#HoofdstukI
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel31
