  - number: '16'
    text: |-
      1 Aanvragen om octrooi worden ingeschreven in het octrooiregister.

      2 De inschrijving geschiedt door vermelding in het octrooiregister van:

      a. de datum van de indiening en het volgnummer van de aanvrage, alsmede, indien het betreft een afzonderlijke
      aanvrage als in [artikel 8A van de Rijksoctrooiwet][ref1] bedoeld, de datum van de indiening en het volgnummer van
      de oorspronkelijke aanvrage en voorts, in voorkomend geval, het feit dat het een omgezette aanvrage als bedoeld in
      [artikel 29H van de Rijksoctrooiwet][ref2] of een internationale aanvrage betreft;

      b. de naam en de woonplaats van de aanvrager, alsmede, indien een gemachtigde is gesteld, de naam van deze
      gemachtigde;

      c. de naam en de woonplaats van degene, die de uitvinding heeft gedaan, tenzij deze schriftelijk heeft verklaard
      geen prijs te stellen op vermelding als uitvinder;

      d. de korte aanduiding van de uitvinding en de aanduiding van de klasse, welke aan de aanvrage is toegekend
      overeenkomstig de internationale classificatie van octrooien, bedoeld in de op 24 maart 1971 tot stand gekomen
      Overeenkomst van Straatsburg betreffende de internationale classificatie van octrooien (*Trb.* 1972, 81);

      e. de volledige tekst van het uittreksel, behorende bij een octrooiaanvrage;

      f. indien toepassing is gegeven aan [artikel 22B, tweede lid, van de Rijksoctrooiwet][ref3], de instelling waarbij,
      het nummer waaronder en de datum waarop de cultuur van het desbetreffende micro-organisme is gedeponeerd;

      g. het beroep op een recht van voorrang als in [artikel 7 van de Rijksoctrooiwet][ref4] bedoeld, met vermelding
      van de datum en het nummer van de aanvrage, waarop de aanvrager dit beroep doet steunen, en het land, waarin of
      waarvoor deze aanvrage werd ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel8A
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel29H
      [ref3]: https://wetten.overheid.nl/BWBR0001879#Artikel22B
      [ref4]: https://wetten.overheid.nl/BWBR0001879#Artikel7
