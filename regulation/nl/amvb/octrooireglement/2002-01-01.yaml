  - number: '17'
    text: |-
      1 Het bedrag, hetwelk krachtens artikel 17A, derde lid, van de [Rijksoctrooiwet][ref1] bij de indiening van een
      verzoekschrift tot herstel in de vorige toestand moet worden betaald, is € 161.

      2 Het bedrag, hetwelk krachtens [artikel 21 van de Rijksoctrooiwet][ref2] bij de indiening van een aanvrage om
      octrooi moet zijn gestort, is € 127.

      3 Het bedrag, hetwelk krachtens artikel 22A, vierde lid, van de [Rijksoctrooiwet][ref3] voor iedere bladzijde van
      de bij de aanvrage behorende beschrijving en tekeningen en het uittreksel moet worden betaald, is € 3.

      4 Het bedrag, hetwelk krachtens artikel 22D, eerste lid, van de [Rijksoctrooiwet][ref4] ter zake van een aanvrage,
      zolang daarop geen octrooi is verleend, twee jaar na de indiening op de laatste dag van de maand waarin deze heeft
      plaatsgevonden en verder elk volgend jaar op die dag moet worden betaald, is € 122.

      5 Het bedrag, hetwelk krachtens onderscheidenlijk de artikelen 22G, eerste lid, 22H, eerste lid, 22I, vierde en
      tiende lid, en 22J, eerste lid, van de [Rijksoctrooiwet][ref5] bij de indiening van een in die artikelen bedoeld
      verzoekschrift moet worden betaald, is, indien het betreft:

      een verzoekschrift, ertoe strekkende dat wordt bepaald, dat een aanspraak op octrooi aan de verzoeker of mede aan
      de verzoeker toekomt: € 161;

      een verzoekschrift tot het houden van een voorlopig getuigenverhoor: € 161;

      een verzoekschrift tot het instellen of het voortzetten van een onderzoek naar de stand van de techniek, niet
      zijnde een nieuwheidsonderzoek van internationaal type: € 544;

      een verzoekschrift tot het doen onderwerpen van een aanvrage aan een nieuwheidsonderzoek van internationaal type:
      € 1 089;

      een verzoekschrift tot het nemen van een beslissing omtrent de verlening van octrooi op de aanvrage: € 283.

      De bovenvermelde bedragen betreffende onderzoeken naar de stand van de techniek worden teruggegeven, indien binnen
      de in artikel 22I, zevende lid, van de [Rijksoctrooiwet][ref6] bedoelde termijn het resultaat wordt overgelegd van
      een reeds eerder door het Europees Octrooibureau of de Octrooiraad op een overeenkomstige octrooiaanvrage ingesteld
      onderzoek naar de stand van de techniek.

      De bovenvermelde bedragen betreffende onderzoeken naar de stand van de techniek behoeven niet te worden betaald
      voor:

      a. een verzoekschrift tot het instellen van een onderzoek naar de stand van de techniek met betrekking tot een
      omgezette aanvrage als bedoeld in artikel 29H van de [Rijksoctrooiwet][ref7], indien bij die aanvrage een verslag
      van het Europese nieuwheidsonderzoek is gevoegd dan wel een verslag van het internationale nieuwheidsonderzoek
      vergezeld van een aanvullend verslag van het Europese nieuwheidsonderzoek voor zover nodig op grond van artikel
      157, tweede en derde lid, van het Europees Octrooiverdrag;

      b. een verzoekschrift tot het voortzetten van een onderzoek naar de stand van de techniek, indien het verzoek
      betrekking heeft op enig gedeelte van een omgezette aanvrage dat voorwerp is geweest van een onder *a* bedoeld
      verslag;

      c. een verzoekschrift tot het instellen van een onderzoek naar de stand van de techniek, indien bij het
      verzoekschrift het resultaat wordt overgelegd van een reeds eerder door het Europees Octrooibureau of de
      Octrooiraad op een overeenkomstige octrooiaanvrage ingesteld onderzoek naar de stand van de techniek.

      6 Het bedrag, hetwelk krachtens [artikel 25, eerste lid, van de Rijksoctrooiwet][ref8] moet zijn gestort alvorens
      tot openbaarmaking van de aanvrage wordt overgegaan, is € 174.

      7 Het bedrag, hetwelk krachtens artikel 29P, eerste en zevende lid, van de [Rijksoctrooiwet][ref9] moet worden
      betaald ter zake van de indiening van de vertaling in het Nederlands van een Europees octrooischrift of, indien
      het Europees octrooi in oppositie is gewijzigd, van een nieuw Europees octrooischrift, onderscheidenlijk van een
      verbeterde vertaling van een Europees octrooischrift of een nieuw Europees octrooischrift, is € 25.

      8 Het bedrag dat krachtens [artikel 35, eerste of tweede lid, van de Rijksoctrooiwet][ref10] ter zake van een
