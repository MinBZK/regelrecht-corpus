  - number: '7'
    text: |-
      1 Een aanvraagafdeling bestaat uit één lid of uit drie leden.

      2 Ingeval een aanvraagafdeling uit één lid bestaat, zal dit een technisch lid van de Octrooiraad zijn; ingeval zij
      uit drie leden bestaat, zullen daarin twee technische leden en één rechtsgeleerd lid van die raad zitting hebben.
      Wanneer evenwel naar het oordeel van de centrale afdeling bij de te behandelen zaak hoofdzakelijk rechtsvragen te
      beslissen zijn, zal in het eerste geval een rechtsgeleerd lid van de Octrooiraad en zullen in het laatste geval
      twee rechtsgeleerde leden en één technisch lid van die raad zitting hebben.

      3 Indien een aanvraagafdeling uit één technisch of rechtsgeleerd lid van de Octrooiraad bestaat, kan de centrale
      afdeling op verzoek van de aanvraagafdeling een rechtsgeleerd, onderscheidenlijk technisch lid van die raad
      aanwijzen om, hetzij over een bepaalde vraag, hetzij over de aanvrage in haar geheel te adviseren.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel7
  - number: '8'
    text: |-
      1 Een afdeling van beroep bestaat uit drie leden. Zij kan uit vijf leden bestaan, ingeval de aard van de te
      behandelen zaak daartoe naar het oordeel van de centrale afdeling aanleiding geeft.

      2 Ingeval een afdeling van beroep uit drie leden bestaat, zullen twee technische leden en één rechtsgeleerd lid
      van de Octrooiraad, ingeval zij uit vijf leden bestaat, zullen drie technische en twee rechtsgeleerde leden van
      die raad daarin zitting hebben. Wanneer evenwel naar het oordeel van de centrale afdeling bij de te behandelen zaak
      hoofdzakelijk rechtsvragen te beslissen zijn, zullen in het eerste geval twee rechtsgeleerde leden en één technisch
      lid, en in het laatste geval drie rechtsgeleerde en twee technische leden van die raad zitting hebben.

      3 De Voorzitter van de Octrooiraad heeft ambtshalve zitting in de afdelingen van beroep.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel8
  - number: '9'
    text: |-
      1 Een bijzondere afdeling, die is belast met werkzaamheden als bedoeld in [artikel 17A, vierde lid][ref1], of
      [29L, eerste lid, van de Rijksoctrooiwet][ref2], bestaat uit één rechtsgeleerd lid van de Octrooiraad. In alle
      overige gevallen bestaat een bijzondere afdeling uit drie leden.

      2 Ingeval een bijzondere afdeling uit drie leden bestaat, zullen daarin twee technische leden en één rechtsgeleerd
      lid van die raad zitting hebben. Wanneer evenwel naar het oordeel van de centrale afdeling bij de te behandelen
      zaak hoofdzakelijk rechtsvragen te beslissen zijn, zullen daarin twee rechtsgeleerde leden en één technisch lid van
      die raad zitting hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel17A
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel29L
