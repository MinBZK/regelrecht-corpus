        artikel: 29L
  - number: '10'
    text: |-
      1 De Voorzitter van de Octrooiraad regelt de werkzaamheden van de afdelingen. Hij is voorzitter van de afdelingen,
      waarin hij zitting heeft.

      2 Onverminderd het eerste lid, eerste volzin, worden afdelingen, waarin de Voorzitter van de Octrooiraad niet
      zitting heeft, voorgezeten:

      a. door de eerstbenoemde, in de afdeling zitting hebbende ondervoorzitter van de Octrooiraad en bij
      gelijktijdigheid van benoeming door de oudste;

      b. indien geen ondervoorzitter van de Octrooiraad in de afdeling zitting heeft, door het eerstbenoemde, in de
      afdeling zitting hebbende gewone lid van de Octrooiraad en bij gelijktijdigheid van benoeming door het oudste;

      c. indien geen gewoon lid van de Octrooiraad in de afdeling zitting heeft, door een door de leden van de afdeling
      uit hun midden gekozen lid.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel10
  - number: '11'
    text: |-
      Als secretaris van iedere afdeling treedt op een door de Voorzitter van de Octrooiraad aangewezen ambtenaar van het
      Bureau voor de industriële eigendom of anders een door de leden van de afdeling uit hun midden gekozen gewoon of
      plaatsvervangend lid van de Octrooiraad.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel11
  - number: 11A
    text: |-
      Met het verrichten van werkzaamheden, die bij de [Rijksoctrooiwet][ref1] of dit reglement aan de Octrooiraad, doch
      niet aan een bepaalde afdeling, zijn opgedragen, is de voorzitter belast.


      [ref1]: https://wetten.overheid.nl/BWBR0001879
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel11A
    references:
      - id: ref1
        bwb_id: BWBR0001879
  - number: '12'
    text: |-
      Bij afwezigheid of ontstentenis wordt de Voorzitter van de Octrooiraad in zijn hem bij de [Rijksoctrooiwet][ref1]
      of bij dit reglement opgedragen werkzaamheden vervangen door de ondervoorzitters in een door de Minister aangewezen
      volgorde.


      [ref1]: https://wetten.overheid.nl/BWBR0001879
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0001879
  - number: '13'
    text: De Voorzitter van de Octrooiraad verstrekt aan de Minister alle door deze gevraagde inlichtingen.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel13
  - number: '14'
    text: |-
      1 De oproepingen ter uitvoering van de [Rijksoctrooiwet][ref1] van aanvragers, opposanten en andere
      belanghebbenden, zomede van getuigen en deskundigen, geschieden bij aangetekende brief of schriftelijk tegen
      ontvangstbewijs, met opgave van de dag en het uur voor de verschijningen bepaald.

      2 Bij oproeping van de in het eerste lid genoemde personen moet tussen de dag van de verzending van de oproeping en
      die van de verschijning van de opgeroepene een termijn van ten minste drie dagen gelaten worden.

      3 Van het verhoor van getuigen en deskundigen wordt een proces-verbaal opgemaakt.

      4 De geldelijke vergoeding, aan getuigen en deskundigen toe te kennen, wordt berekend op de voet van het als
      bijlage bij dit reglement gevoegde tarief.

      5 De toelegging van de daar bedoelde vacatiegelden en vergoedingen voor de reis- en verblijfkosten en tijdverzuim,
      geschiedt in geval van verschijning in een vergadering van een afdeling door deze afdeling, in andere gevallen door
      de Voorzitter van de Octrooiraad.


      [ref1]: https://wetten.overheid.nl/BWBR0001879
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001879
  - number: '15'
    text: |-
      1 De Octrooiraad houdt een register ingevolge de bepalingen van de [Rijksoctrooiwet][ref1], genaamd
      octrooiregister.

      2 De Octrooiraad stelt, met inachtneming van de [artikelen 16 tot en met 16B][ref2], de inrichting van het in het
      eerste lid genoemde register vast.


      [ref1]: https://wetten.overheid.nl/BWBR0001879
      [ref2]: https://wetten.overheid.nl/BWBR0001908#Artikel16
