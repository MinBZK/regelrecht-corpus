  - number: '6.3'
    text: Zij regelt de vervanging van de leden van die afdelingen in geval van hun verhindering of ontstentenis.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel6
  - number: '7.1'
    text: Een aanvraagafdeling bestaat uit één lid of uit drie leden.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel7
  - number: '7.2'
    text: |-
      Ingeval een aanvraagafdeling uit één lid bestaat, zal dit een technisch lid van de Octrooiraad zijn; ingeval zij
      uit drie leden bestaat, zullen daarin twee technische leden en één rechtsgeleerd lid van die raad zitting hebben.
      Wanneer evenwel naar het oordeel van de centrale afdeling bij de te behandelen zaak hoofdzakelijk rechtsvragen te
      beslissen zijn, zal in het eerste geval een rechtsgeleerd lid van de Octrooiraad en zullen in het laatste geval
      twee rechtsgeleerde leden en één technisch lid van die raad zitting hebben.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel7
  - number: '7.3'
    text: |-
      Indien een aanvraagafdeling uit één technisch of rechtsgeleerd lid van de Octrooiraad bestaat, kan de centrale
      afdeling op verzoek van de aanvraagafdeling een rechtsgeleerd, onderscheidenlijk technisch lid van die raad
      aanwijzen om, hetzij over een bepaalde vraag, hetzij over de aanvrage in haar geheel te adviseren.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel7
  - number: '8.1'
    text: |-
      Een afdeling van beroep bestaat uit drie leden. Zij kan uit vijf leden bestaan, ingeval de aard van de te
      behandelen zaak daartoe naar het oordeel van de centrale afdeling aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel8
  - number: '8.2'
    text: |-
      Ingeval een afdeling van beroep uit drie leden bestaat, zullen twee technische leden en één rechtsgeleerd lid van
      de Octrooiraad, ingeval zij uit vijf leden bestaat, zullen drie technische en twee rechtsgeleerde leden van die
      raad daarin zitting hebben. Wanneer evenwel naar het oordeel van de centrale afdeling bij de te behandelen zaak
      hoofdzakelijk rechtsvragen te beslissen zijn, zullen in het eerste geval twee rechtsgeleerde leden en één technisch
      lid, en in het laatste geval drie rechtsgeleerde en twee technische leden van die raad zitting hebben.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel8
  - number: '8.3'
    text: De Voorzitter van de Octrooiraad heeft ambtshalve zitting in de afdelingen van beroep.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel8
  - number: '9.1'
    text: |-
      Een bijzondere afdeling, die is belast met werkzaamheden als bedoeld in [artikel 17A, vierde lid][ref1], of
      [29L, eerste lid, van de Rijksoctrooiwet][ref2], bestaat uit één rechtsgeleerd lid van de Octrooiraad. In alle
      overige gevallen bestaat een bijzondere afdeling uit drie leden.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel17A
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel29L
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 17A
      - id: ref2
        bwb_id: BWBR0001879
        artikel: 29L
  - number: '9.2'
    text: |-
      Ingeval een bijzondere afdeling uit drie leden bestaat, zullen daarin twee technische leden en één rechtsgeleerd
      lid van die raad zitting hebben. Wanneer evenwel naar het oordeel van de centrale afdeling bij de te behandelen
      zaak hoofdzakelijk rechtsvragen te beslissen zijn, zullen daarin twee rechtsgeleerde leden en één technisch lid van
      die raad zitting hebben.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel9
  - number: '10.1'
    text: |-
      De Voorzitter van de Octrooiraad regelt de werkzaamheden van de afdelingen. Hij is voorzitter van de afdelingen,
      waarin hij zitting heeft.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel10
  - number: '10.2'
    text: |-
      Onverminderd het eerste lid, eerste volzin, worden afdelingen, waarin de Voorzitter van de Octrooiraad niet zitting
      heeft, voorgezeten:
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel10
  - number: 10.2.a
    text: |-
      door de eerstbenoemde, in de afdeling zitting hebbende ondervoorzitter van de Octrooiraad en bij gelijktijdigheid
      van benoeming door de oudste;
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel10
  - number: 10.2.b
    text: |-
      indien geen ondervoorzitter van de Octrooiraad in de afdeling zitting heeft, door het eerstbenoemde, in de afdeling
      zitting hebbende gewone lid van de Octrooiraad en bij gelijktijdigheid van benoeming door het oudste;
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel10
  - number: 10.2.c
    text: |-
      indien geen gewoon lid van de Octrooiraad in de afdeling zitting heeft, door een door de leden van de afdeling uit
      hun midden gekozen lid.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel10
  - number: '11'
    text: |-
      Als secretaris van iedere afdeling treedt op een door de Voorzitter van de Octrooiraad aangewezen ambtenaar van het
      Bureau voor de industriële eigendom of anders een door de leden van de afdeling uit hun midden gekozen gewoon of
      plaatsvervangend lid van de Octrooiraad.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel11
  - number: 11A
    text: |-
      Met het verrichten van werkzaamheden, die bij de [Rijksoctrooiwet][ref1] of dit reglement aan de Octrooiraad, doch
      niet aan een bepaalde afdeling, zijn opgedragen, is de voorzitter belast.


      [ref1]: https://wetten.overheid.nl/BWBR0001879
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel11A
    references:
      - id: ref1
        bwb_id: BWBR0001879
  - number: '12'
    text: |-
      Bij afwezigheid of ontstentenis wordt de Voorzitter van de Octrooiraad in zijn hem bij de [Rijksoctrooiwet][ref1]
      of bij dit reglement opgedragen werkzaamheden vervangen door de ondervoorzitters in een door de Minister aangewezen
      volgorde.


      [ref1]: https://wetten.overheid.nl/BWBR0001879
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0001879
  - number: '13'
    text: De Voorzitter van de Octrooiraad verstrekt aan de Minister alle door deze gevraagde inlichtingen.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel13
  - number: '14.1'
    text: |-
      De oproepingen ter uitvoering van de [Rijksoctrooiwet][ref1] van aanvragers, opposanten en andere belanghebbenden,
      zomede van getuigen en deskundigen, geschieden bij aangetekende brief of schriftelijk tegen ontvangstbewijs, met
      opgave van de dag en het uur voor de verschijningen bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0001879
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001879
  - number: '14.2'
    text: |-
      Bij oproeping van de in het eerste lid genoemde personen moet tussen de dag van de verzending van de oproeping en
      die van de verschijning van de opgeroepene een termijn van ten minste drie dagen gelaten worden.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel14
  - number: '14.3'
    text: Van het verhoor van getuigen en deskundigen wordt een proces-verbaal opgemaakt.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel14
  - number: '14.4'
    text: |-
      De geldelijke vergoeding, aan getuigen en deskundigen toe te kennen, wordt berekend op de voet van het als bijlage
      bij dit reglement gevoegde tarief.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel14
  - number: '14.5'
    text: |-
      De toelegging van de daar bedoelde vacatiegelden en vergoedingen voor de reis- en verblijfkosten en tijdverzuim,
      geschiedt in geval van verschijning in een vergadering van een afdeling door deze afdeling, in andere gevallen door
      de Voorzitter van de Octrooiraad.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel14
  - number: '15.1'
    text: |-
      De Octrooiraad houdt een register ingevolge de bepalingen van de [Rijksoctrooiwet][ref1], genaamd octrooiregister.


      [ref1]: https://wetten.overheid.nl/BWBR0001879
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0001879
  - number: '15.2'
    text: |-
      De Octrooiraad stelt, met inachtneming van de [artikelen 16 tot en met 16B][ref1], de inrichting van het in het
      eerste lid genoemde register vast.


      [ref1]: https://wetten.overheid.nl/BWBR0001908#Artikel16
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0001908
        artikel: '16'
        hoofdstuk: I
        paragraaf: '5'
  - number: '16.1'
    text: Aanvragen om octrooi worden ingeschreven in het octrooiregister.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel16
  - number: '16.2'
    text: 'De inschrijving geschiedt door vermelding in het octrooiregister van:'
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel16
  - number: 16.2.a
    text: |-
      de datum van de indiening en het volgnummer van de aanvrage, alsmede, indien het betreft een afzonderlijke aanvrage
      als in [artikel 8A van de Rijksoctrooiwet][ref1] bedoeld, de datum van de indiening en het volgnummer van de
      oorspronkelijke aanvrage en voorts, in voorkomend geval, het feit dat het een omgezette aanvrage als bedoeld in
      [artikel 29H van de Rijksoctrooiwet][ref2] of een internationale aanvrage betreft;


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel8A
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel29H
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 8A
      - id: ref2
        bwb_id: BWBR0001879
        artikel: 29H
  - number: 16.2.b
    text: |-
      de naam en de woonplaats van de aanvrager, alsmede, indien een gemachtigde is gesteld, de naam van deze
      gemachtigde;
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel16
  - number: 16.2.c
    text: |-
      de naam en de woonplaats van degene, die de uitvinding heeft gedaan, tenzij deze schriftelijk heeft verklaard geen
      prijs te stellen op vermelding als uitvinder;
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel16
  - number: 16.2.d
    text: |-
      de korte aanduiding van de uitvinding en de aanduiding van de klasse, welke aan de aanvrage is toegekend
      overeenkomstig de internationale classificatie van octrooien, bedoeld in de op 24 maart 1971 tot stand gekomen
      Overeenkomst van Straatsburg betreffende de internationale classificatie van octrooien (*Trb.* 1972, 81);
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel16
  - number: 16.2.e
    text: de volledige tekst van het uittreksel, behorende bij een octrooiaanvrage;
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel16
  - number: 16.2.f
    text: |-
      indien toepassing is gegeven aan [artikel 22B, tweede lid, van de Rijksoctrooiwet][ref1], de instelling waarbij,
      het nummer waaronder en de datum waarop de cultuur van het desbetreffende micro-organisme is gedeponeerd;


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22B
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 22B
  - number: 16.2.g
    text: |-
      het beroep op een recht van voorrang als in [artikel 7 van de Rijksoctrooiwet][ref1] bedoeld, met vermelding van de
      datum en het nummer van de aanvrage, waarop de aanvrager dit beroep doet steunen, en het land, waarin of waarvoor
      deze aanvrage werd ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel7
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '7'
  - number: 16A.1
    text: |-
      Onverminderd het in [artikel 17, eerste lid, van de Rijksoctrooiwet][ref1] bepaalde, worden in het octrooiregister
      voorts ingeschreven:


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel17
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel16A
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '17'
  - number: 16A.1.a
    text: |-
      de in de [Rijksoctrooiwet][ref1] bedoelde verzoekschriften, bezwaarschriften en memories van grieven;


      [ref1]: https://wetten.overheid.nl/BWBR0001879
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel16A
    references:
      - id: ref1
        bwb_id: BWBR0001879
  - number: 16A.1.b
    text: |-
      aan de Octrooiraad aangeboden stukken, niet zijnde stukken als onder *a* bedoeld, waarvan ingevolge de
      [Rijksoctrooiwet][ref1] ambtshalve of op verzoek inschrijving in de registers moet geschieden;


      [ref1]: https://wetten.overheid.nl/BWBR0001879
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel16A
    references:
      - id: ref1
        bwb_id: BWBR0001879
  - number: 16A.1.c
    text: |-
      aan die raad aangeboden stukken, niet zijnde stukken als onder *a* en *b* bedoeld, waarin sprake is van rechten
      of verplichtingen van een octrooiaanvrager, een octrooihouder of een derde, betrekking hebbende op een aanvrage om
      octrooi of een octrooi;
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel16A
  - number: 16A.1.d
    text: |-
      aan die raad aangeboden stukken, waaruit blijkt van de naamswijziging van een rechthebbende met betrekking tot een
      aanvrage om octrooi of een octrooi.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel16A
  - number: 16A.2
    text: |-
      De inschrijving geschiedt door vermelding van de aard en het onderwerp van het stuk, de datum van de indiening van
      het stuk, alsmede, voor wat verzoekschriften, bezwaarschriften en memories van grieven betreft, de naam van degene,
      die het stuk heeft ingediend.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel16A
  - number: 16B.1
    text: 'In het octrooiregister wordt aantekening gedaan van:'
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel16B
  - number: 16B.1.a
    text: |-
      feiten, waarvan ingevolge de [Rijksoctrooiwet][ref1] ambtshalve aantekening in de registers moet geschieden;


      [ref1]: https://wetten.overheid.nl/BWBR0001879
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel16B
    references:
      - id: ref1
        bwb_id: BWBR0001879
  - number: 16B.1.b
    text: |-
      de terinzagelegging van de aanvrage of de indiening van andere dan de in [artikel 16A][ref1] bedoelde stukken,
      alsmede andere dan de onder *a* bedoelde feiten, waarvan de aantekening naar het oordeel van de Octrooiraad nodig
      is voor een duidelijk overzicht van al hetgeen geschiedt ten aanzien van aanvragen om octrooi en octrooien.


      [ref1]: https://wetten.overheid.nl/BWBR0001908#Artikel16A
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel16B
    references:
      - id: ref1
        bwb_id: BWBR0001908
        artikel: 16A
        hoofdstuk: I
        paragraaf: '5'
  - number: 16B.2
    text: |-
      De aantekening geschiedt door vermelding van de aard en de datum van het feit alsmede, indien het een aantekening
      van de indiening of terinzagelegging van een stuk betreft, van de aard van dat stuk.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel16B
  - number: 16B.3
    text: |-
      De aantekening van de verlening van een octrooi geschiedt onder het nummer van de openbaarmaking van de aanvrage,
      welke tot het octrooi heeft geleid.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel16B
  - number: '17.1'
    text: |-
      Het bedrag, hetwelk krachtens artikel 17A, derde lid, van de [Rijksoctrooiwet][ref1] bij de indiening van een
      verzoekschrift tot herstel in de vorige toestand moet worden betaald, is € 161.


      [ref1]: https://wetten.overheid.nl/BWBR0001879
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001879
  - number: '17.2'
    text: |-
      Het bedrag, hetwelk krachtens [artikel 21 van de Rijksoctrooiwet][ref1] bij de indiening van een aanvrage om
      octrooi moet zijn gestort, is € 127.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel21
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '21'
  - number: '17.3'
    text: |-
      Het bedrag, hetwelk krachtens artikel 22A, vierde lid, van de [Rijksoctrooiwet][ref1] voor iedere bladzijde van de
      bij de aanvrage behorende beschrijving en tekeningen en het uittreksel moet worden betaald, is € 3.


      [ref1]: https://wetten.overheid.nl/BWBR0001879
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001879
  - number: '17.4'
    text: |-
      Het bedrag, hetwelk krachtens artikel 22D, eerste lid, van de [Rijksoctrooiwet][ref1] ter zake van een aanvrage,
      zolang daarop geen octrooi is verleend, twee jaar na de indiening op de laatste dag van de maand waarin deze heeft
      plaatsgevonden en verder elk volgend jaar op die dag moet worden betaald, is € 122.


      [ref1]: https://wetten.overheid.nl/BWBR0001879
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001879
  - number: '17.5'
    text: |-
      Het bedrag, hetwelk krachtens onderscheidenlijk de artikelen 22G, eerste lid, 22H, eerste lid, 22I, vierde en
      tiende lid, en 22J, eerste lid, van de [Rijksoctrooiwet][ref1] bij de indiening van een in die artikelen bedoeld
      verzoekschrift moet worden betaald, is, indien het betreft: een verzoekschrift, ertoe strekkende dat wordt bepaald,
      dat een aanspraak op octrooi aan de verzoeker of mede aan de verzoeker toekomt: € 161; een verzoekschrift tot het
      houden van een voorlopig getuigenverhoor: € 161; een verzoekschrift tot het instellen of het voortzetten van een
      onderzoek naar de stand van de techniek, niet zijnde een nieuwheidsonderzoek van internationaal type: € 544; een
      verzoekschrift tot het doen onderwerpen van een aanvrage aan een nieuwheidsonderzoek van internationaal type: €
      1 089; een verzoekschrift tot het nemen van een beslissing omtrent de verlening van octrooi op de aanvrage: € 283.
      De bovenvermelde bedragen betreffende onderzoeken naar de stand van de techniek worden teruggegeven, indien binnen
      de in artikel 22I, zevende lid, van de [Rijksoctrooiwet][ref2] bedoelde termijn het resultaat wordt overgelegd van
      een reeds eerder door het Europees Octrooibureau of de Octrooiraad op een overeenkomstige octrooiaanvrage ingesteld
      onderzoek naar de stand van de techniek. De bovenvermelde bedragen betreffende onderzoeken naar de stand van de
      techniek behoeven niet te worden betaald voor:


      [ref1]: https://wetten.overheid.nl/BWBR0001879
      [ref2]: https://wetten.overheid.nl/BWBR0001879
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001879
      - id: ref2
        bwb_id: BWBR0001879
  - number: 17.5.a
    text: |-
      een verzoekschrift tot het instellen van een onderzoek naar de stand van de techniek met betrekking tot een
      omgezette aanvrage als bedoeld in artikel 29H van de [Rijksoctrooiwet][ref1], indien bij die aanvrage een verslag
      van het Europese nieuwheidsonderzoek is gevoegd dan wel een verslag van het internationale nieuwheidsonderzoek
      vergezeld van een aanvullend verslag van het Europese nieuwheidsonderzoek voor zover nodig op grond van artikel
      157, tweede en derde lid, van het Europees Octrooiverdrag;


      [ref1]: https://wetten.overheid.nl/BWBR0001879
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001879
  - number: 17.5.b
    text: |-
      een verzoekschrift tot het voortzetten van een onderzoek naar de stand van de techniek, indien het verzoek
      betrekking heeft op enig gedeelte van een omgezette aanvrage dat voorwerp is geweest van een onder *a* bedoeld
      verslag;
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel17
  - number: 17.5.c
    text: |-
      een verzoekschrift tot het instellen van een onderzoek naar de stand van de techniek, indien bij het verzoekschrift
      het resultaat wordt overgelegd van een reeds eerder door het Europees Octrooibureau of de Octrooiraad op een
      overeenkomstige octrooiaanvrage ingesteld onderzoek naar de stand van de techniek.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel17
  - number: '17.6'
    text: |-
      Het bedrag, hetwelk krachtens [artikel 25, eerste lid, van de Rijksoctrooiwet][ref1] moet zijn gestort alvorens tot
      openbaarmaking van de aanvrage wordt overgegaan, is € 174.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel25
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '25'
  - number: '17.7'
    text: |-
      Het bedrag, hetwelk krachtens artikel 29P, eerste en zevende lid, van de [Rijksoctrooiwet][ref1] moet worden
      betaald ter zake van de indiening van de vertaling in het Nederlands van een Europees octrooischrift of, indien
      het Europees octrooi in oppositie is gewijzigd, van een nieuw Europees octrooischrift, onderscheidenlijk van een
      verbeterde vertaling van een Europees octrooischrift of een nieuw Europees octrooischrift, is € 25.


      [ref1]: https://wetten.overheid.nl/BWBR0001879
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001879
  - number: '17.8'
    text: |-
      Het bedrag dat krachtens [artikel 35, eerste of tweede lid, van de Rijksoctrooiwet][ref1] ter zake van een octrooi
      onderscheidenlijk een Europees octrooi elk jaar moet worden betaald, is:






                    de eerste maal


                    € 222




                    de tweede maal


                    € 256




                    de derde maal


                    € 292




                    de vierde maal


                    € 324




                    de vijfde maal


                    € 358




                    de zesde maal


                    € 406




                    de zevende maal


                    € 451




                    de achtste maal


                    € 496




                    de negende maal


                    € 533




                    de tiende maal


                    € 567




                    de elfde maal


                    € 601




                    de twaalfde maal


                    € 648




                    de dertiende maal


                    € 739




                    de veertiende maal


                    € 787




                    de vijftiende maal


                    € 821




                    de zestiende maal


                    € 855




                    de zeventiende maal


                    € 903




                    de achttiende en volgende malen


                    € 937.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel35
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '35'
  - number: '17.9'
    text: |-
      De verhoging die krachtens [artikel 22D, eerste lid, van de Rijksoctrooiwet][ref1] verschuldigd is bij betaling na
      de vervaldag is gelijk aan 50 procent van het overeenkomstig het vierde lid voor dat jaar te betalen bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22D
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 22D
  - number: '17.10'
    text: |-
      De verhoging die krachtens [artikel 35, vierde lid, van de Rijksoctrooiwet][ref1] verschuldigd is bij betaling na
      de vervaldag is gelijk aan 50 procent van het overeenkomstig het achtste lid voor dat jaar te betalen bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel35
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '35'
  - number: '17.11'
    text: |-
      Voor iedere verlenging van een krachtens de [Rijksoctrooiwet][ref1] gestelde termijn is een bedrag van € 5
      verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0001879
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001879
  - number: 17A
    text: |-
      De bedragen, die krachtens [artikel 19B, tweede lid, van de Rijksoctrooiwet][ref1] voor de werkzaamheden van de
      Octrooiraad als ontvangend bureau moeten worden betaald, zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel19B
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel17A
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 19B
  - number: 17A.a
    text: 'de toezendingstaks, bedoeld in Regel 14.1 van het bij het Samenwerkingsverdrag behorende Reglement: € 50;'
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel17A
  - number: 17A.b
    text: |-
      de taks, bedoeld in Regel 20.9 van het onder a bedoelde Reglement:  € 5 voor elk gewaarmerkt afschrift, vermeerderd
      met een bedrag van  € 1 per bladzijde.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel17A
  - number: '18.1'
    text: |-
      Voor de inschrijving van de memories van grieven, bedoeld in de [artikelen 24A, eerste lid][ref1],
      en [27, eerste lid, van de Rijksoctrooiwet][ref2], een bezwaarschrift als bedoeld in
      [artikel 25, derde lid, van die rijkswet][ref3], en de verzoekschriften, bedoeld in de
      [artikelen 10, tweede lid][ref4], [32, derde lid][ref5], en [34, vijfde en negende lid, van die rijkswet][ref6], is
      een bedrag van € 161 verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel24A
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0001879#Artikel25
      [ref4]: https://wetten.overheid.nl/BWBR0001879#Artikel10
      [ref5]: https://wetten.overheid.nl/BWBR0001879#Artikel32
      [ref6]: https://wetten.overheid.nl/BWBR0001879#Artikel34
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 24A
      - id: ref2
        bwb_id: BWBR0001879
        artikel: '27'
      - id: ref3
        bwb_id: BWBR0001879
        artikel: '25'
      - id: ref4
        bwb_id: BWBR0001879
        artikel: '10'
      - id: ref5
        bwb_id: BWBR0001879
        artikel: '32'
      - id: ref6
        bwb_id: BWBR0001879
        artikel: '34'
  - number: '18.2'
    text: |-
      Voor de inschrijving van een verzoekschrift als bedoeld in [artikel 22F, tweede lid, van de Rijksoctrooiwet][ref1]
      is een bedrag van € 22 verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22F
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 22F
  - number: '18.3'
    text: |-
      Voor de inschrijving van een verzoekschrift als bedoeld in [artikel 25, vierde lid, van de Rijksoctrooiwet][ref1]
      is een bedrag van € 161 verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel25
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '25'
  - number: '18.4'
    text: |-
      Het bedrag, hetwelk krachtens [artikel 33, tweede lid][ref1], onderscheidenlijk
      [artikel 37, derde lid, van de Rijksoctrooiwet][ref2] is verschuldigd voor de inschrijving van de titel van een
      licentie onderscheidenlijk de akte, houdende overdracht of andere overgang van een octrooi, of van het recht
      voortvloeiende uit een aanvrage om octrooi, is € 27 voor ieder octrooi en iedere aanvrage waarop de betreffende
      akte betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel37
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '33'
      - id: ref2
        bwb_id: BWBR0001879
        artikel: '37'
  - number: '18.5'
    text: |-
      Voor de inschrijving van een stuk, waaruit blijkt van de naamswijziging van een rechthebbende met betrekking tot
      een aanvrage om octrooi of een octrooi, is een bedrag van € 11 per octrooi en per aanvrage verschuldigd. Betreft
      de naamswijziging meer dan vijf octrooien of aanvragen om octrooi, dan is voor ieder volgend octrooi en iedere
      volgende aanvrage een bedrag van € 5 verschuldigd.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel18
  - number: '18.6'
    text: |-
      Voor de inschrijving van andere dan in de vorige leden bedoelde stukken, welke ter inschrijving worden aangeboden,
      is € 27 per stuk verschuldigd met dien verstande, dat, indien een stuk betrekking heeft op meer dan één octrooi of
      aanvrage om octrooi, even zovele malen dit bedrag is verschuldigd.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel18
  - number: 18A.1
    text: |-
      Het bij de indiening van een verzoekschrift tot instelling van een onderzoek naar de stand van de techniek
      onderscheidenlijk tot voortzetting van het onderzoek betaalde bedrag wordt teruggegeven, indien datgene,
      waarover het onderzoek zich blijkens het verzoekschrift moet uitstrekken, reeds eerder met juiste toepassing
      van [artikel 5A van de Rijksoctrooiwet][ref1] voorwerp is geweest dan wel bij juiste toepassing van dat artikel
      voorwerp had moeten zijn van een volledig onderzoek ingevolge [artikel 22I van die rijkswet][ref2]. Over de
      teruggave beslist de Octrooiraad, nadat de belanghebbende een daartoe strekkend gemotiveerd verzoekschrift heeft
      ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel5A
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel22I
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel18A
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 5A
      - id: ref2
        bwb_id: BWBR0001879
        artikel: 22I
  - number: 18A.2
    text: |-
      Indien bij een internationale aanvrage, waarvoor een verzoekschrift tot instelling of voortzetting van een
      onderzoek naar de stand van de techniek is ingediend, een in artikel 18 van het Samenwerkingsverdrag bedoeld
      verslag van het internationale nieuwheidsonderzoek is gevoegd, wordt van het bedrag, dat bij de indiening van
      zo'n verzoekschrift is betaald, 25%, 50%, 75% of 100% teruggegeven, al naar het nut dat de Octrooiraad bij het
      aanvullend onderzoek, bedoeld in [artikel 29K, zesde lid, van de Rijksoctrooiwet][ref1], heeft van het verslag van
      het internationale nieuwheidsonderzoek. De tweede volzin van het vorige lid is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel29K
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel18A
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 29K
  - number: '19.1'
    text: Onvoldoend gefrankeerde stukken worden geweigerd.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel19
  - number: '19.2'
    text: |-
      Bij betalingen moet uitdrukkelijk en volledig het doel van de betaling schriftelijk worden vermeld, met splitsing,
      indien deze nodig is, van het totale bedrag.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel19
  - number: '19.3'
    text: De ondertekeningen van stukken moeten, indien dit door de Octrooiraad geëist wordt, gelegaliseerd worden.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel19
  - number: '21'
    text: |-
      De in [artikel 22A, derde lid, van de Rijksoctrooiwet][ref1] bedoelde overige vormvoorschriften voor een aanvrage
      om octrooi zijn de volgende:


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22A
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 22A
  - number: 21.1°
    text: 'De aanvrage moet worden ingediend in tweevoud en vermelden:'
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel21
  - number: 21.1°.a
    text: |-
      de naam, de voornamen en de woonplaats - of, indien het een rechtspersoon betreft, de naam en de woonplaats - van
      de aanvrager, alsmede, indien geen gemachtigde is gesteld, zijn adres;
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel21
  - number: 21.1°.b
    text: |-
      de naam, de voornamen en de woonplaats van de uitvinder, tenzij deze heeft verklaard geen prijs te stellen op
      vermelding als uitvinder in het octrooi;
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel21
  - number: 21.1°.c
    text: indien een gemachtigde is gesteld, diens naam, woonplaats en adres;
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel21
  - number: 21.1°.d
    text: |-
      indien het een afzonderlijke aanvrage als bedoeld in [artikel 8A van de Rijksoctrooiwet][ref1] betreft, de datum
      van de indiening en het volgnummer van de oorspronkelijke aanvrage.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel8A
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 8A
  - number: 21.2°
    text: |-
      De korte aanduiding, bedoeld in [artikel 22A, eerste lid, onder ][ref1], mag geen fantasienaam bevatten. Indien de
      bij de aanvrage behorende beschrijving aan het slot conclusies van verschillende categorieën bevat (voortbrengsel,
      werkwijze, inrichting of gebruik), moet dit duidelijk uit de korte aanduiding blijken.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22A
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 22A
  - number: 21.3°
    text: De aanvrage moet een opsomming van de bijlagen bevatten met vermelding van de aard van ieder stuk.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel21
  - number: 21.4°
    text: |-
      Indien de aanvrage door meer dan één persoon is ingediend, moet zij een voor de aanvragers gemeenschappelijk
      domicilie vermelden. Voorts moet worden aangegeven, indien geen gemachtigde is gesteld, door welke aanvrager zij
      gemeenschappelijk vertegenwoordigd worden.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel21
  - number: '22'
    text: |-
      De in [artikel 22A, derde lid, van de Rijksoctrooiwet][ref1] bedoelde overige vormvoorschriften voor de bij een
      aanvrage om octrooi behorende beschrijving zijn de volgende:


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22A
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 22A
  - number: 22.1°
    text: |-
      De beschrijving moet worden ingediend in drievoud en zijn gesteld op één zijde van één of meer bladen buigzaam,
      sterk, wit, glad, niet-glanzend en duurzaam papier van het formaat A 4 (29,7 * 21 cm).
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel22
  - number: 22.2°
    text: |-
      De beschrijving dient met een donkere onuitwisbare inkt getypt of gedrukt te zijn, dit zodanig dat zij in een
      onbeperkt aantal exemplaren rechtstreeks kan worden gereproduceerd door middel van fotografie, elektrostatische
      werkwijzen, foto-offset en microfilm. De bladen dienen ongekreukt en ongescheurd te zijn; zij mogen niet gevouwen
      zijn.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel22
  - number: 22.3°
    text: |-
      Grafische symbolen en tekens, en chemische of wiskundige formules kunnen zo nodig met de hand worden geschreven of
      getekend. In getypte of gedrukte tekst dient 1 ½ regelafstand te worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel22
  - number: 22.4°
    text: |-
      Aan het hoofd van de beschrijving moet de korte aanduiding, bedoeld in [artikel 22A, eerste lid, onder ][ref1],
      zijn vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22A
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 22A
  - number: 22.5°
    text: |-
      De conclusies als bedoeld in [artikel 22A, eerste lid, onder ][ref1] moeten beginnen op een nieuw blad en
      doorlopend genummerd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22A
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 22A
  - number: 22.6°
    text: |-
      Elke vijfde regel van elk blad van de beschrijving behoort te worden genummerd, waarbij de nummers moeten worden
      aangebracht op de linkerzijde, aan de rechterzijde van de marge.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel22
  - number: 22.7°
    text: |-
      De bladen van de beschrijving moeten doorlopend genummerd zijn in Arabische cijfers. De nummers van de bladen
      moeten worden geplaatst boven aan de bladzijden in het midden, doch niet in de bovenmarge.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel22
  - number: 22.8°
    text: |-
      De bladen van de beschrijving moeten rondom onbeschreven randen hebben van ten minste de volgende afmetingen:
      bovenmarge 2 cm; rechtermarge 2 cm; linkermarge 2,5 cm; benedenmarge 2 cm.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel22
  - number: 22.9°
    text: |-
      Elk blad van de beschrijving dient redelijk vrij te zijn van raderingen en vrij te zijn van veranderingen en van
      boven elkaar geschreven en tussengeschreven woorden.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel22
  - number: '23'
    text: |-
      De in [artikel 22A, derde lid, van de Rijksoctrooiwet][ref1] bedoelde overige vormvoorschriften voor de bij een
      aanvrage om octrooi behorende tekeningen zijn de volgende:


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22A
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 22A
  - number: 23.1°
    text: |-
      De tekeningen moeten worden ingediend in drievoud en zijn gesteld op één zijde van één of meer bladen buigzaam,
      sterk, wit, glad, niet-glanzend en duurzaam papier van het formaat A 4 (29,7 * 21 cm).
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel23
  - number: 23.2°
    text: |-
      De tekeningen moeten in al haar onderdelen zijn uitgevoerd in krachtige en gelijkmatig getrokken duurzame lijnen
      van een enkele donkere kleur, dit zodanig, dat zij in een onbeperkt aantal exemplaren rechtstreeks kunnen worden
      gereproduceerd door middel van fotografie, elektrostatische werkwijzen, foto-offset en microfilm. De bladen dienen
      ongekreukt en ongescheurd te zijn.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel23
  - number: 23.3°
    text: |-
      De tekeningen moeten binnen de spiegel van 26,2 cm en 17 cm worden gehouden. De bladen van de tekeningen mogen geen
      rand rond de te gebruiken of gebruikte bladspiegel hebben. De minimummarges dienen als volgt te zijn: bovenmarge
      2,5 cm; rechtermarge 1,5 cm; linkermarge 2,5 cm; benedenmarge 1 cm.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel23
  - number: 23.4°
    text: De afzonderlijke figuren moeten duidelijk van elkaar gescheiden en doorlopend genummerd zijn.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel23
  - number: 23A
    text: 'Het bij een aanvrage om octrooi behorende uittreksel mag ten hoogste één figuur bevatten en dient:'
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel23A
  - number: 23A.a
    text: |-
      in tweevoud te worden ingediend en met een donkere, onuitwisbare inkt getypt of gedrukt te zijn op één blad
      duurzaam wit papier van het formaat A4 (29,7 * 21 cm);
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel23A
  - number: 23A.b
    text: |-
      in de Nederlandse taal te zijn gesteld en ten minste 50 woorden en ten hoogste 250 dan wel, indien het uittreksel
      een figuur bevat, ten hoogste 150 woorden te bevatten.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel23A
  - number: '24'
    text: |-
      De in [artikel 22B, derde lid, van de Rijksoctrooiwet][ref1] bedoelde nadere vormvoorschriften voor de bij een
      aanvrage om octrooi behorende beschrijving en de in dat lid bedoelde nadere voorschriften voor de inrichting van
      die beschrijving zijn de volgende:


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22B
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 22B
  - number: 24.1°
    text: |-
      De beschrijving moet aangeven welke uitkomst op het gebied van de nijverheid met de uitvinding wordt beoogd, met
      afbakening van het nieuwe ten opzichte van de stand van de techniek.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel24
  - number: 24.2°
    text: |-
      De tot de beschrijving behorende conclusies moeten datgene wat nieuw is en waarvoor het uitsluitend recht verlangd
      wordt, nauwkeurig en afzonderlijk aanwijzen.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel24
  - number: 24.3°
    text: |-
      De beschrijving en de conclusies, behorende bij een afzonderlijke aanvrage als in
      [artikel 8A van de Rijksoctrooiwet][ref1] bedoeld, moeten kunnen worden begrepen zonder raadpleging van de
      oorspronkelijke aanvrage.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel8A
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 8A
  - number: 24.4°
    text: De beschrijving moet nauwkeurig en juist zijn gesteld, zo kort mogelijk en zonder nutteloze herhalingen.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel24
  - number: 24.5°
    text: |-
      Maten en gewichten moeten in de beschrijving zijn aangegeven volgens het metrieke stelsel, temperaturen in graden
      Celsius, scheikundige elementen, -verbindingen en -grootheden, alsook natuurkundige en technische grootheden op een
      wijze als in de internationale praktijk is aanvaard.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel24
  - number: 24.6°
    text: |-
      De beschrijving mag geen andere figuren bevatten dan natuurwetenschappelijke, wiskundige of technische formules en
      tekens. Indien deze bij het drukken te veel ruimte in beslag zouden nemen of andere moeilijkheden zouden opleveren,
      moeten zij afzonderlijk als tekening worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel24
  - number: '25'
    text: |-
      De in [artikel 22B, derde lid, van de Rijksoctrooiwet][ref1] bedoelde nadere vormvoorschriften voor de bij een
      aanvrage om octrooi behorende tekeningen en de in dat lid bedoelde nadere voorschriften voor de inrichting van die
      tekeningen zijn de volgende:


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22B
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 22B
  - number: 25.1°
    text: |-
      De tekeningen moeten duidelijk zijn en mogen niet meer bevatten dan voor een juist begrip van de uitvinding nodig
      is.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel25
  - number: 25.2°
    text: |-
      Dwarsdoorsneden moeten zijn aangegeven door schuine arceringen; een en ander mag niet het duidelijk onderscheiden
      van verwijzingstekens en lijnen verhinderen.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel25
  - number: 25.3°
    text: |-
      De schaal van de tekeningen moet worden bepaald rekening houdende met de graad van ingewikkeldheid der figuren; zij
      is voldoende indien een fotografische reproduktie op twee derde van de grootte veroorlooft de bijzonderheden zonder
      moeite te zien.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel25
  - number: 25.4°
    text: |-
      Verwijzingstekens ter aanduiding van de onderdelen der figuren mogen alleen worden gebruikt voor zover een goed
      begrip van de beschrijving zulks vereist; zij moeten overeenkomen met die, welke in de beschrijving voorkomen.
      Dezelfde onderdelen in verschillende figuren moeten overal aangegeven zijn door dezelfde verwijzingstekens. Ingeval
      in de beschrijving varianten van de uitvinding worden beschreven, mag in met deze varianten overeenkomende figuren
      gebruik worden gemaakt van een systeem, waarbij dezelfde kenmerken in verschillende figuren worden aangeduid door
      samenhangende verwijzingscijfers (bijvoorbeeld algemeen kenmerk "15" wordt in figuur 1 aangeduid met "115", in
      figuur 2 met "215", enz.). Een verwijzingsteken mag niet voor verschillende onderdelen worden gebezigd, ook niet
      in verschillende figuren; bijvoeging van accenten of cijfers bij de verwijzingstekens moet zoveel mogelijk worden
      vermeden.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel25
  - number: 25.5°
    text: |-
      De tekeningen mogen geen verklaring bevatten met uitzondering van aanduidingen als "water", "stoom", "doorsnede II-
      II", "open", "dicht" en, voor wat elektrische blokschema's of fabricageschema's betreft, de aanduidingen nodig voor
      een goed begrip daarvan. Deze aanduidingen moeten in de Nederlandse taal zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel25
  - number: '26'
    text: |-
      Een aanvrage om octrooi en de daarbij behorende beschrijving dienen bij voorkeur te zijn ingericht overeenkomstig
      door de Octrooiraad daarvoor vastgestelde standaardformulieren. Exemplaren van deze standaardformulieren
      zijn verkrijgbaar bij het Bureau voor de industriële eigendom en worden door dit bureau toegezonden aan de in
      [artikel 59 van de Rijksoctrooiwet][ref1] bedoelde bureaus.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel59
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '59'
  - number: '27.1'
    text: |-
      Aan de Octrooiraad aangeboden stukken betreffende een aanvrage om octrooi of een octrooi, niet zijnde stukken
      als bedoeld in [paragraaf 6A][ref1], moeten duidelijk leesbaar zijn en, behoudens voor wat de in het tweede lid
      bedoelde stukken betreft, in de Nederlandse taal zijn gesteld of van een desverlangd gewaarmerkte Nederlandse
      vertaling zijn voorzien. De Octrooiraad is bevoegd op verzoek al dan niet tijdelijk ontheffing te verlenen van het
      voorschrift betreffende een Nederlandse vertaling.


      [ref1]: https://wetten.overheid.nl/BWBR0001908#HoofdstukI
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0001908
        hoofdstuk: I
        paragraaf: 6A
  - number: '27.2'
    text: |-
      De in [artikel 7, zesde lid, van de Rijksoctrooiwet][ref1] bedoelde bewijzen van het recht van voorrang en van
      overgang van dit recht moeten in de Nederlandse, Franse, Duitse of Engelse taal zijn gesteld of van een desverlangd
      gewaarmerkte vertaling in een van die talen zijn voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel7
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '7'
  - number: '28'
    text: |-
      De in de [Rijksoctrooiwet][ref1] bedoelde verzoekschriften, bezwaarschriften en memories van grieven moeten door de
      inzender of diens gemachtigde zijn ondertekend en vermelden:


      [ref1]: https://wetten.overheid.nl/BWBR0001879
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0001879
  - number: 28.a
    text: |-
      de naam, de voornamen en de woonplaats - of, indien het een rechtspersoon betreft, de naam en de woonplaats - van
      de inzender, alsmede, indien geen gemachtigde is gesteld, zijn adres;
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel28
  - number: 28.b
    text: indien een gemachtigde is gesteld, diens naam, woonplaats en adres;
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel28
  - number: 28.c
    text: |-
      tenzij het een verzoekschrift als bedoeld in de [artikelen 22I][ref1] en [22J van de Rijksoctrooiwet][ref2]
      betreft, de gronden, waarop het verzoek, het bezwaar of het beroep berust, en wel zo volledig mogelijk en voor
      zover nodig door bewijzen gestaafd.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22I
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel22J
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 22I
      - id: ref2
        bwb_id: BWBR0001879
        artikel: 22J
  - number: '29.1'
    text: |-
      Behoudens het in de volgende leden bepaalde moeten aan de Octrooiraad aangeboden stukken, niet zijnde stukken als
      bedoeld in [paragraaf 6A][ref1], in tweevoud worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0001908#HoofdstukI
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0001908
        hoofdstuk: I
        paragraaf: 6A
  - number: '29.2'
    text: |-
      De in de [Rijksoctrooiwet][ref1] met uitzondering van de [artikelen 17A][ref2], [22I][ref3] en [22J][ref4] bedoelde
      verzoekschriften, alsmede de in die rijkswet bedoelde bezwaarschriften en memories van grieven moeten in vijfvoud
      worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0001879
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel17A
      [ref3]: https://wetten.overheid.nl/BWBR0001879#Artikel22I
      [ref4]: https://wetten.overheid.nl/BWBR0001879#Artikel22J
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0001879
      - id: ref2
        bwb_id: BWBR0001879
        artikel: 17A
      - id: ref3
        bwb_id: BWBR0001879
        artikel: 22I
      - id: ref4
        bwb_id: BWBR0001879
        artikel: 22J
  - number: '29.3'
    text: |-
      De inzender van een memorie van grieven als in [artikel 24A van de Rijksoctrooiwet][ref1] bedoeld is verplicht vijf
      exemplaren van de beschrijving, waarop de beslissing in beroep wordt gevraagd, over te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel24A
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 24A
  - number: '29.4'
    text: |-
      De Octrooiraad zendt afschrift van een ingekomen verzoekschrift als bedoeld in de
      [artikelen 22G, eerste lid][ref1], [22H, eerste lid][ref2], [25, vierde lid][ref3], [32, vierde lid][ref4],
      en [34, vijfde lid, van de Rijksoctrooiwet][ref5], alsmede van een ingekomen bezwaarschrift aan de aanvrager
      onderscheidenlijk de octrooihouder. Van een memorie van grieven als bedoeld in [artikel 27 van die rijkswet][ref6],
      die is ingediend door de aanvrager, zendt de Octrooiraad een afschrift aan alle belanghebbenden bij de beslissing
      dienaangaande, van wier bestaan uit het octrooiregister blijkt. Van een memorie van grieven als bedoeld in
      [artikel 27 van die rijkswet][ref7], die niet is ingediend door de aanvrager, zendt de Octrooiraad een afschrift
      aan de aanvrager. Bij de toezending van de in dit lid bedoelde afschriften deelt de Octrooiraad tevens de termijn
      mede binnen welke de betrokkene zijn schriftelijke opmerkingen ter zake aan de Octrooiraad kan doen toekomen. Deze
      opmerkingen moeten in vijfvoud worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22G
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel22H
      [ref3]: https://wetten.overheid.nl/BWBR0001879#Artikel25
      [ref4]: https://wetten.overheid.nl/BWBR0001879#Artikel32
      [ref5]: https://wetten.overheid.nl/BWBR0001879#Artikel34
      [ref6]: https://wetten.overheid.nl/BWBR0001879#Artikel27
      [ref7]: https://wetten.overheid.nl/BWBR0001879#Artikel27
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 22G
      - id: ref2
        bwb_id: BWBR0001879
        artikel: 22H
      - id: ref3
        bwb_id: BWBR0001879
        artikel: '25'
      - id: ref4
        bwb_id: BWBR0001879
        artikel: '32'
      - id: ref5
        bwb_id: BWBR0001879
        artikel: '34'
      - id: ref6
        bwb_id: BWBR0001879
        artikel: '27'
      - id: ref7
        bwb_id: BWBR0001879
        artikel: '27'
  - number: '29.5'
    text: |-
      Indien de Octrooiraad zulks verlangt, dient de inzender een groter aantal van de in de vorige leden bedoelde
      stukken dan in die leden is voorgeschreven over te leggen.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel29
  - number: '30.1'
    text: De Octrooiraad kan modellen en monsters weigeren, indien deze gevaar voor de omgeving opleveren.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel30
  - number: '30.2'
    text: |-
      De Octrooiraad is niet verplicht tot bewaring van modellen en monsters na afloop van de behandeling van de
      aanvrage, waarop zij betrekking hebben. Zij behoeven slechts te worden teruggegeven, indien bij de indiening daarom
      is verzocht.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel30
  - number: '31'
    text: |-
      Aan de Octrooiraad aangeboden stukken betreffende een aanvrage om octrooi, niet zijnde stukken als bedoeld in
      [paragraaf 6A][ref1], alsmede hem aangeboden modellen en monsters moeten zijn voorzien van een opschrift, dat de
      naam en de woonplaats van de aanvrager en het volgnummer van de aanvrage of van de openbaarmaking van de aanvrage
      bevat; indien geen van deze beide nummers bekend is, moet uit het opschrift blijken, bij welke aanvrage een en
      ander behoort. Een stuk als in dit artikel bedoeld alsmede een model en een monster mogen slechts op één aanvrage
      betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0001908#HoofdstukI
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0001908
        hoofdstuk: I
        paragraaf: 6A
  - number: 31A.1
    text: |-
      De Octrooiraad kan met betrekking tot hem aan te bieden stukken betreffende een aanvrage om octrooi of een octrooi,
      niet zijnde stukken als bedoeld in [paragraaf 6A][ref1], alsmede met betrekking tot hem aan te bieden modellen
      en monsters nadere voorschriften vaststellen. Deze voorschriften kunnen standaardformulieren voor vorenbedoelde
      stukken inhouden.


      [ref1]: https://wetten.overheid.nl/BWBR0001908#HoofdstukI
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel31A
    references:
      - id: ref1
        bwb_id: BWBR0001908
        hoofdstuk: I
        paragraaf: 6A
  - number: 31A.2
    text: |-
      De in het eerste lid bedoelde voorschriften worden bekendgemaakt in het in [artikel 38][ref1] bedoelde blad,
      behoudens voor wat standaardformulieren betreft. Exemplaren daarvan zijn bij het Bureau voor de industriële
      eigendom verkrijgbaar en worden door dit bureau toegezonden aan de in [artikel 59 van de Rijksoctrooiwet][ref2]
      bedoelde bureaus.


      [ref1]: https://wetten.overheid.nl/BWBR0001908#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel59
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel31A
    references:
      - id: ref1
        bwb_id: BWBR0001908
        artikel: '38'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0001879
        artikel: '59'
  - number: 31B.1
    text: |-
      Indien toepassing is gegeven aan [artikel 22B, tweede lid, van de Rijksoctrooiwet][ref1], moet de beschrijving van
      de uitvinding:


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22B
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel31B
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 22B
  - number: 31B.1.a
    text: |-
      de van belang zijnde gegevens ten aanzien van de kenmerken van het micro-organisme bevatten waarover de aanvrager
      beschikt;
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel31B
  - number: 31B.1.b
    text: |-
      de instelling waarbij, het nummer waaronder en de datum waarop de cultuur van het micro-organisme is gedeponeerd
      vermelden.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel31B
  - number: 31B.2
    text: 'Bij de aanvrage moet worden overgelegd:'
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel31B
  - number: 31B.2.a
    text: |-
      een verklaring inhoudende dat de aanvrager onherroepelijk toestemming verleent tot het overeenkomstig
      [artikel 31F][ref1] verstrekken van monsters van de door hem gedeponeerde cultuur van het micro-organisme;


      [ref1]: https://wetten.overheid.nl/BWBR0001908#Artikel31F
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel31B
    references:
      - id: ref1
        bwb_id: BWBR0001908
        artikel: 31F
        hoofdstuk: I
        paragraaf: 6C
  - number: 31B.2.b
    text: |-
      een afschrift van het door de instelling, waarbij de cultuur van het micro-organisme is gedeponeerd, afgegeven
      ontvangstbewijs;
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel31B
  - number: 31B.2.c
    text: |-
      een afschrift van de in [artikel 31D][ref1] bedoelde verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0001908#Artikel31D
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel31B
    references:
      - id: ref1
        bwb_id: BWBR0001908
        artikel: 31D
        hoofdstuk: I
        paragraaf: 6C
  - number: 31B.3
    text: |-
      Het in het eerste lid, onder *b,* bedoelde nummer en het in het tweede lid, onder *b,* bedoelde afschrift kunnen
      ook worden verstrekt binnen een termijn van één maand na het indienen van de aanvrage.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel31B
  - number: 31C.1
    text: |-
      Het depot van culturen van micro-organismen overeenkomstig [artikel 22B, tweede lid, van de Rijksoctrooiwet][ref1]
      kan geschieden bij:


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22B
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel31C
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 22B
  - number: 31C.1.a
    text: |-
      een instelling die, in overeenstemming met artikel 7 van het Verdrag inzake de internationale erkenning van het
      depot van micro-organismen ten dienste van de octrooiverlening (*Trb.* 1978, 90), de status van internationale
      depositaris bezit of
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel31C
  - number: 31C.1.b
    text: een door de Octrooiraad aangewezen instelling.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel31C
  - number: 31C.2
    text: |-
      Voor een aanwijzing als bedoeld in het eerste lid, onder *b,* is vereist dat de desbetreffende instelling in staat
      en bereid is:
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel31C
  - number: 31C.2.a
    text: |-
      culturen van micro-organismen onder afgifte van een ontvangstbewijs in bewaring te nemen en onder behoud
      van hun eigenschappen en het treffen van toereikende veiligheidsmaatregelen en in overeenstemming met
      [artikel 31E, eerste lid][ref1], op te slaan;


      [ref1]: https://wetten.overheid.nl/BWBR0001908#Artikel31E
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel31C
    references:
      - id: ref1
        bwb_id: BWBR0001908
        artikel: 31E
        hoofdstuk: I
        paragraaf: 6C
  - number: 31C.2.b
    text: |-
      in overeenstemming met [artikel 31F][ref1] monsters te verstrekken van gedeponeerde culturen van micro-organismen;


      [ref1]: https://wetten.overheid.nl/BWBR0001908#Artikel31F
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel31C
    references:
      - id: ref1
        bwb_id: BWBR0001908
        artikel: 31F
        hoofdstuk: I
        paragraaf: 6C
  - number: 31C.2.c
    text: |-
      onverminderd het onder *a* en *b* bepaalde gedeponeerde culturen van micro-organismen beschikbaar te houden en
      beschikbaar te stellen door daarvan monsters te verstrekken, gedurende een tijdvak van ten minste vijf jaar na
      het tijdstip waarop het laatste verzoek om verstrekking van een monster van de desbetreffende cultuur door de
      instelling werd ontvangen, en in ieder geval gedurende een tijdvak van ten minste 30 jaar na de datum van het
      depot.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel31C
  - number: 31C.3
    text: |-
      Een aanwijzing als bedoeld in het eerste lid, onder *b,* kan worden gedaan voor alle of voor bepaalde soorten van
      culturen van micro-organismen.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel31C
  - number: 31C.4
    text: |-
      De Octrooiraad trekt een aanwijzing als bedoeld in het eerste lid, onder *b,* in, indien de desbetreffende
      instelling niet meer voldoet aan het tweede lid.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel31C
  - number: 31D
    text: |-
      Bij een overeenkomstig [artikel 22B van de Rijksoctrooiwet][ref1] verricht depot dient een schriftelijke verklaring
      van de bewaargever te worden gevoegd, inhoudende:


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22B
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel31D
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 22B
  - number: 31D.a
    text: |-
      een uiteenzetting omtrent de omstandigheden alsmede de eigenschappen van het micro-organisme, die van belang zijn
      voor het kweken, de opslag, de hantering en de levensvatbaarheid van het micro-organisme;
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel31D
  - number: 31D.b
    text: een aanduiding van de methode waarmee de aanwezigheid van het micro-organisme kan worden vastgesteld;
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel31D
  - number: 31D.c
    text: |-
      een identificatieaanduiding en, zo mogelijk, de wetenschappelijke beschrijving en de voorgestelde taxonomische
      aanduiding van het micro-organisme.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel31D
  - number: 31E.1
    text: |-
      De cultuur van een micro-organisme, die is gedeponeerd overeenkomstig
      [artikel 22B, tweede lid, van de Rijksoctrooiwet][ref1], dient vanaf de dag van indiening van de desbetreffende
      aanvrage om octrooi beschikbaar te zijn voor het verstrekken van monsters overeenkomstig [artikel 31F][ref2], tot
      de datum waarop vaststaat dat op die aanvrage geen octrooi verleend wordt, dan wel tot de datum waarop het op die
      aanvrage verleende octrooi zijn kracht verliest.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22B
      [ref2]: https://wetten.overheid.nl/BWBR0001908#Artikel31F
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel31E
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 22B
      - id: ref2
        bwb_id: BWBR0001908
        artikel: 31F
        hoofdstuk: I
        paragraaf: 6C
  - number: 31E.2
    text: |-
      Indien de cultuur van een micro-organisme ophoudt beschikbaar te zijn bij de instelling waarbij de cultuur is
      opgeslagen, omdat het micro-organisme niet meer levensvatbaar is of de instelling om andere redenen niet in staat
      is monsters van die cultuur af te geven en de cultuur niet is overgedragen aan een andere instelling als bedoeld
      in [artikel 31C][ref1], eerste lid, waarbij zij toegankelijk blijft, wordt zij niettemin aangemerkt als beschikbaar
      te zijn gebleven, indien, binnen een termijn van drie maanden na de datum waarop de instelling of de Octrooiraad
      het niet meer beschikbaar zijn van de cultuur ter kennis heeft gebracht van de bewaargever daarvan, een nieuw depot
      van een cultuur van het desbetreffende micro-organisme wordt verricht en een afschrift van het door de betrokken
      instelling afgegeven ontvangstbewijs van het nieuwe depot, met aanduiding van het nummer van de octrooiaanvrage of
      van het octrooi, aan de Octrooiraad is toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0001908#Artikel31C
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel31E
    references:
      - id: ref1
        bwb_id: BWBR0001908
        artikel: 31C
        hoofdstuk: I
        paragraaf: 6C
  - number: 31E.3
    text: |-
      Het tweede lid is van overeenkomstige toepassing, indien de instelling waarbij de cultuur is opgeslagen de
      uitoefening van haar functies ten aanzien van de gedeponeerde culturen van micro-organismen heeft gestaakt of
      niet meer voldoet aan de omschrijving in [artikel 31C, eerste lid][ref1], met dien verstande dat de in het tweede
      lid bedoelde termijn van drie maanden begint op de datum waarop dat feit is vermeld in het in [artikel 38][ref2]
      bedoelde blad.


      [ref1]: https://wetten.overheid.nl/BWBR0001908#Artikel31C
      [ref2]: https://wetten.overheid.nl/BWBR0001908#Artikel38
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel31E
    references:
      - id: ref1
        bwb_id: BWBR0001908
        artikel: 31C
        hoofdstuk: I
        paragraaf: 6C
      - id: ref2
        bwb_id: BWBR0001908
        artikel: '38'
        hoofdstuk: II
  - number: 31E.4
    text: |-
      Ieder nieuw depot als bedoeld in het tweede lid dient te zijn vergezeld van een door de bewaargever ondertekende
      verklaring dat de opnieuw gedeponeerde cultuur van het micro-organisme gelijk is aan de oorspronkelijk
      gedeponeerde.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel31E
  - number: 31E.5
    text: |-
      Indien zich een feit als bedoeld in het derde lid voordoet, doet de Octrooiraad hiervan zo spoedig mogelijk
      mededeling in het in [artikel 38][ref1] bedoelde blad.


      [ref1]: https://wetten.overheid.nl/BWBR0001908#Artikel38
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel31E
    references:
      - id: ref1
        bwb_id: BWBR0001908
        artikel: '38'
        hoofdstuk: II
  - number: 31F.1
    text: |-
      Een ieder die op grond van [artikel 28A van de Rijksoctrooiwet][ref1] het recht heeft tot kennisneming van de in
      dat artikel bedoelde stukken met betrekking tot een aanvrage om octrooi of een octrooi, kan verzoeken om afgifte
      van een monster van een overeenkomstig [artikel 22B, tweede lid, van de Rijksoctrooiwet][ref2] gedeponeerde cultuur
      van een micro-organisme waarop die aanvrage of dat octrooi betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel28A
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel22B
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel31F
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 28A
      - id: ref2
        bwb_id: BWBR0001879
        artikel: 22B
  - number: 31F.2
    text: |-
      Het verzoek dient te worden gericht aan de Octrooiraad door middel van een door de Octrooiraad vastgesteld
      formulier. Het dient vergezeld te gaan van een schriftelijke verklaring van de verzoeker, dat hij zich er jegens
      de aanvrager of de houder van het octrooi toe verplicht de gedeponeerde cultuur of een daarvan afgeleide cultuur,
      tot de datum waarop vaststaat dat op de octrooiaanvrage geen octrooi verleend wordt dan wel, indien octrooi is
      verleend, zolang dit van kracht is:
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel31F
  - number: 31F.2.a
    text: niet aan derden ter beschikking te stellen;
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel31F
  - number: 31F.2.b
    text: |-
      alleen voor proefnemingen te gebruiken, tenzij de verzoeker de cultuur gebruikt als houder van een overeenkomstig
      [artikel 34][ref1] of [34B van de Rijksoctrooiwet][ref2] ontstane licentie, dan wel als gerechtigde ingevolge
      [artikel 34A van die rijkswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel34B
      [ref3]: https://wetten.overheid.nl/BWBR0001879#Artikel34A
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel31F
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0001879
        artikel: 34B
      - id: ref3
        bwb_id: BWBR0001879
        artikel: 34A
  - number: 31F.3
    text: |-
      De aanvrager om octrooi kan, tot de datum waarop de aanvrage overeenkomstig
      [artikel 22C van de Rijksoctrooiwet][ref1] ter inzage wordt gelegd of, indien dit eerder plaatsvindt, tot de
      datum van openbaarmaking van de aanvrage overeenkomstig [artikel 25 van die rijkswet][ref2], de Octrooiraad op
      een daartoe door de raad vastgesteld formulier mededelen dat tot de datum waarop octrooi wordt verleend of tot de
      datum, waarop vaststaat dat op de octrooiaanvrage geen octrooi verleend wordt, de afgifte overeenkomstig het eerste
      lid van monsters van de door hem gedeponeerde cultuur van een micro-organisme, alleen kan geschieden aan een door
      de verzoeker aangewezen deskundige. De in het tweede lid, tweede volzin, bedoelde verklaring dient in dat geval
      door de desbetreffende deskundige te worden medeondertekend.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22C
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel25
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel31F
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 22C
      - id: ref2
        bwb_id: BWBR0001879
        artikel: '25'
  - number: 31F.4
    text: 'Als deskundige kan worden aangewezen:'
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel31F
  - number: 31F.4.a
    text: |-
      iedere natuurlijke persoon ten aanzien van wie de verzoeker bij de indiening van het verzoek aantoont dat de
      aanvrager van het octrooi heeft ingestemd met zijn aanwijzing;
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel31F
  - number: 31F.4.b
    text: iedere natuurlijke persoon die door de Voorzitter van de Octrooiraad als deskundige wordt erkend.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel31F
  - number: 31F.5
    text: |-
      Onder afgeleide cultuur wordt voor de toepassing van het tweede lid verstaan iedere cultuur die nog die kenmerken
      van de gedeponeerde cultuur bezit welke essentieel zijn voor de toepassing van de uitvinding. De verplichtingen,
      bedoeld in het tweede lid, vormen geen beletsel voor het deponeren van een afgeleide cultuur, noodzakelijk voor
      een octrooiverleningsprocedure.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel31F
  - number: 31F.6
    text: |-
      De Octrooiraad zendt het verzoek aan de instelling. Daarbij vermeldt de raad of een octrooiaanvrage, die een
      vermelding bevat van het depot van het micro-organisme, is ingediend en of de verzoeker recht heeft op de afgifte
      van een monster van dat micro-organisme. Aan de aanvrager of aan de houder van het octrooi zendt de Octrooiraad een
      afschrift van het verzoek.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel31F
  - number: 31G
    text: |-
      Indien het depot, bedoeld in de [artikelen 31C, eerste lid][ref1], en [31E, tweede lid][ref2], is geschied
      overeenkomstig het in [artikel 31C, eerste lid, onder ][ref3] bedoelde verdrag, zijn in geval van strijdigheid van
      de bepalingen van deze paragraaf met dat verdrag, de bepalingen van dat verdrag doorslaggevend.


      [ref1]: https://wetten.overheid.nl/BWBR0001908#Artikel31C
      [ref2]: https://wetten.overheid.nl/BWBR0001908#Artikel31E
      [ref3]: https://wetten.overheid.nl/BWBR0001908#Artikel31C
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel31G
    references:
      - id: ref1
        bwb_id: BWBR0001908
        artikel: 31C
        hoofdstuk: I
        paragraaf: 6C
      - id: ref2
        bwb_id: BWBR0001908
        artikel: 31E
        hoofdstuk: I
        paragraaf: 6C
      - id: ref3
        bwb_id: BWBR0001908
        artikel: 31C
        hoofdstuk: I
        paragraaf: 6C
  - number: 31H.1
    text: |-
      De bij [artikel 17A, onder ][ref1], vastgestelde toezendingstaks moet binnen een maand na de datum van ontvangst
      van de aanvrage bij de Octrooiraad zijn gestort bij het Bureau voor de industriële eigendom.


      [ref1]: https://wetten.overheid.nl/BWBR0001908#Artikel17A
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel31H
    references:
      - id: ref1
        bwb_id: BWBR0001908
        artikel: 17A
        hoofdstuk: I
        paragraaf: 5A
  - number: 31H.2
    text: |-
      De internationale taks en de taks voor het nieuwheidsonderzoek, bedoeld in Regel 15 onderscheidenlijk Regel 16 van
      het bij het Samenwerkingsverdrag behorende Reglement, moeten aan het Bureau voor de industriële eigendom worden
      betaald in euro.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel31H
  - number: 31H.3
    text: |-
      Indien op de datum van ontvangst van de aanvrage geen basistaks of taks voor het nieuwheidsonderzoek is ontvangen
      of het ontvangen bedrag niet toereikend is, stelt de Octrooiraad de aanvrager daarvan in kennis en deelt hem mede,
      dat de betrokken taks alsnog binnen een maand na de datum van ontvangst kan worden betaald zonder tenietgaan van de
      dagtekening van het internationale depot.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel31H
  - number: 31I.1
    text: |-
      De termijn, waarbinnen krachtens [artikel 29P, eerste lid, van de Rijksoctrooiwet][ref1] na verlening van een
      Europees octrooi een vertaling in het Nederlands van de tekst van het octrooischrift moet zijn ingediend, is drie
      maanden vanaf de dag, waarop overeenkomstig artikel 97, vierde lid, van het Europees Octrooiverdrag de vermelding
      van de verlening is gepubliceerd.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel29P
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel31I
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 29P
  - number: 31I.2
    text: |-
      De termijn, waarbinnen een vertaling van de tekst van een nieuw octrooischrift, indien in het Europees octrooi
      tijdens de oppositieprocedure wijziging is gekomen, moet zijn ingediend, is drie maanden vanaf de dag, waarop
      overeenkomstig artikel 103 van het Europees Octrooiverdrag de vermelding van de beslissing ten aanzien van de
      oppositie is gepubliceerd.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel31I
  - number: 31I.3
    text: |-
      Het in [artikel 17, zevende lid][ref1], bedoelde bedrag ter zake van de indiening van een vertaling als in het
      eerste of tweede lid bedoeld moet worden betaald uiterlijk voor afloop van de in het eerste lid onderscheidenlijk
      tweede lid bedoelde termijn van drie maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0001908#Artikel17
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel31I
    references:
      - id: ref1
        bwb_id: BWBR0001908
        artikel: '17'
        hoofdstuk: I
        paragraaf: 5A
  - number: 31I.4
    text: |-
      De [artikelen 22][ref1] en [23][ref2] zijn van overeenkomstige toepassing op de in
      [artikel 29P van de Rijksoctrooiwet][ref3] bedoelde vertalingen van Europese octrooischriften en nieuwe
      Europese octrooischriften en op de verbeterde vertalingen daarvan. Aan het hoofd van deze vertalingen moet het
      publikatienummer van de Europese octrooiaanvrage, die tot verlening van het Europees octrooi heeft geleid, worden
      vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0001908#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0001908#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0001879#Artikel29P
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel31I
    references:
      - id: ref1
        bwb_id: BWBR0001908
        artikel: '22'
        hoofdstuk: I
        paragraaf: 6A
      - id: ref2
        bwb_id: BWBR0001908
        artikel: '23'
        hoofdstuk: I
        paragraaf: 6A
      - id: ref3
        bwb_id: BWBR0001879
        artikel: 29P
  - number: 31I.5
    text: |-
      De waarmerking van de vertaling geschiedt in de vorm van een verklaring, dat de vertaling naar beste weten van de
      octrooigemachtigde volledig en getrouw is. Deze verklaring dient door de gemachtigde te zijn ondertekend.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel31I
  - number: '32.1'
    text: |-
      Het in [artikel 28, derde lid, van de Rijksoctrooiwet][ref1] bedoelde bewijs moet, behalve de verklaring, dat
      octrooi is verleend, bevatten:


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel28
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '28'
  - number: 32.1.a
    text: |-
      de naam, de voornamen en de woonplaats - of, indien het een rechtspersoon betreft, de naam en de woonplaats - van
      de octrooihouder;
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel32
  - number: 32.1.b
    text: de korte aanduiding van de uitvinding;
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel32
  - number: 32.1.c
    text: |-
      de dagtekening van het octrooi en het nummer, waaronder van de verlening daarvan aantekening in het octrooiregister
      is gedaan;
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel32
  - number: 32.1.d
    text: |-
      het volgnummer en het tijdstip van indiening van de aanvrage, alsmede, indien het betreft een octrooi, verleend
      ingevolge een afzonderlijke aanvrage als in [artikel 8A van de Rijksoctrooiwet][ref1] bedoeld, de vorenbedoelde
      gegevens van de oorspronkelijke aanvrage;


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel8A
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 8A
  - number: 32.1.e
    text: de vermelding van het recht van voorrang;
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel32
  - number: 32.1.f
    text: |-
      de datum, waarop de termijn, bedoeld in [artikel 47 van de Rijksoctrooiwet][ref1], eindigt.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel47
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '47'
  - number: '32.2'
    text: Het octrooibewijs moet door de Voorzitter van de Octrooiraad worden ondertekend.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel32
  - number: '32.3'
    text: |-
      Bij het octrooibewijs wordt een exemplaar van het in [artikel 28, tweede lid, van de Rijksoctrooiwet][ref1]
      bedoelde octrooischrift gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel28
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '28'
  - number: '34.1'
    text: |-
      Het octrooiregister en de op een aanvrage om octrooi of octrooi betrekking hebbende stukken als bedoeld in
      [artikel 28A van de Rijksoctrooiwet][ref1] kunnen door een ieder die op grond van dat artikel gerechtigd is daarvan
      kennis te nemen, kosteloos worden ingezien.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel28A
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 28A
  - number: '34.2'
    text: |-
      Aan personen als bedoeld in het eerste lid worden op daartoe strekkend verzoek uit het octrooiregister alsmede met
      betrekking tot de in het eerste lid bedoelde stukken schriftelijk inlichtingen verstrekt tegen betaling van een
      bedrag van € 3, indien de inlichtingen op één octrooi of aanvrage om octrooi betrekking hebben, vermeerderd met een
      bedrag van € 2 voor ieder volgend octrooi of iedere volgende aanvrage om octrooi, waarover de inlichtingen gevraagd
      worden.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel34
  - number: '34.3'
    text: |-
      Aan personen als bedoeld in het eerste lid worden op daartoe strekkend verzoek uit het octrooiregister alsmede
      met betrekking tot de in het eerste lid bedoelde stukken gewaarmerkte uittreksels verstrekt tegen betaling van een
      bedrag van € 5 voor iedere aanvrage om octrooi en ieder octrooi waarop het verlangde uittreksel betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel34
  - number: '35'
    text: |-
      De in de Nederlandse taal gestelde tekst van de beschrijving en het uittreksel, alsmede de tekeningen, welke
      behoren bij een krachtens [artikel 22C van de Rijksoctrooiwet][ref1] ter inzage te leggen aanvrage om octrooi,
      worden met vermelding van het tijdstip, waarop de terinzagelegging zal plaatsvinden, alsmede van de in artikel 16
      van dit reglement bedoelde gegevens, reprografisch vermenigvuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22C
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 22C
  - number: '36.1'
    text: |-
      De terinzagelegging van een aanvrage om octrooi met de bijbehorende beschrijving en tekeningen en het bijbehorende
      uittreksel krachtens [artikel 22C van de Rijksoctrooiwet][ref1] geschiedt door een bij het Bureau voor de
      industriële eigendom voor een ieder ter kennisneming gereed leggen van een exemplaar van de aanvrage en van de
      ingevolge [artikel 35][ref2] van dit reglement vermenigvuldigde bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22C
      [ref2]: https://wetten.overheid.nl/BWBR0001908#Artikel35
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 22C
      - id: ref2
        bwb_id: BWBR0001908
        artikel: '35'
        hoofdstuk: I
        paragraaf: '10'
  - number: '36.2'
    text: |-
      De terinzagelegging van de in [artikel 43B van de Rijksoctrooiwet][ref1] bedoelde vertalingen geschiedt door
      het bij het Bureau voor de industriële eigendom voor een ieder ter kennisneming gereed leggen van een exemplaar
      daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel43B
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 43B
  - number: 36B.1
    text: |-
      De uitgifte van de bij een openbaargemaakte aanvrage om octrooi behorende beschrijving en tekeningen krachtens
      [artikel 25, tweede lid, van de Rijksoctrooiwet][ref1] geschiedt met vermelding van het tijdstip en het volgnummer
      van de openbaarmaking, van het tijdstip van de terinzagelegging krachtens [artikel 22C van die rijkswet][ref2] en
      van de in [artikel 16][ref3] van dit reglement bedoelde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel22C
      [ref3]: https://wetten.overheid.nl/BWBR0001908#Artikel16
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel36B
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0001879
        artikel: 22C
      - id: ref3
        bwb_id: BWBR0001908
        artikel: '16'
        hoofdstuk: I
        paragraaf: '5'
  - number: 36B.2
    text: |-
      De uitgifte van het octrooischrift krachtens [artikel 28, tweede lid, van de Rijksoctrooiwet][ref1] geschiedt met
      vermelding van de dagtekening van het octrooi en het nummer, waaronder van de verlening daarvan aantekening in het
      octrooiregister is gedaan, alsmede van de in het eerste lid bedoelde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel28
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel36B
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '28'
  - number: 36C
    text: |-
      Aan de in [artikel 59 van de Rijksoctrooiwet][ref1] bedoelde bureaus wordt zo spoedig mogelijk een exemplaar van de
      in [artikel 35][ref2] en [36B][ref3] bedoelde bescheiden toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0001908#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0001908#Artikel36B
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel36C
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '59'
      - id: ref2
        bwb_id: BWBR0001908
        artikel: '35'
        hoofdstuk: I
        paragraaf: '10'
      - id: ref3
        bwb_id: BWBR0001908
        artikel: 36B
        hoofdstuk: I
        paragraaf: '10'
  - number: 36D.1
    text: |-
      Met inachtneming van het in [artikel 28A van de Rijksoctrooiwet][ref1] bepaalde, worden aan een ieder, op een
      daartoe strekkend verzoek waarbij wordt aangegeven op welke aanvrage om octrooi of welk octrooi en welke stukken
      dat verzoek betrekking heeft, tegen betaling van een door de Octrooiraad voor elk voor verstrekking in aanmerking
      komend soort afschrift te bepalen bedrag van ten hoogste € 1 per bladzijde, afschriften verstrekt van in dat
      artikel bedoelde stukken.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel28A
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel36D
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 28A
  - number: 36D.2
    text: |-
      De krachtens de vorige leden bepaalde bedragen worden bekendgemaakt in het in [artikel 38][ref1] bedoelde blad.


      [ref1]: https://wetten.overheid.nl/BWBR0001908#Artikel38
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel36D
    references:
      - id: ref1
        bwb_id: BWBR0001908
        artikel: '38'
        hoofdstuk: II
  - number: 36E
    text: |-
      Op verzoek worden aan daarop rechthebbenden bewijzen van het recht van voorrang, berustend op een in Nederland
      ingediende aanvrage, verstrekt tegen betaling van een bedrag van € 5 per bewijs, vermeerderd met een met
      inachtneming van het in [artikel 36D, eerste lid][ref1], bepaalde vastgesteld bedrag, indien een afschrift van de
      bij een aanvrage om octrooi behorende beschrijving en tekeningen deel uitmaakt van het bewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0001908#Artikel36D
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel36E
    references:
      - id: ref1
        bwb_id: BWBR0001908
        artikel: 36D
        hoofdstuk: I
        paragraaf: 10A
  - number: '37'
    text: |-
      Het Bureau voor de industriële eigendom is ten dienste van de uitvoering van de
      [Rijksoctrooiwet][ref1] voor het publiek opengesteld op alle tijden, waarop het volgens
      [artikel 7 van het Besluit Bureau industriële eigendom 1970][ref2] (*Stb.* 587) voor het publiek is geopend.
      Bedoelde tijden worden bekendgemaakt in het in artikel 38 bedoelde blad.


      [ref1]: https://wetten.overheid.nl/BWBR0001879
      [ref2]: https://wetten.overheid.nl/BWBR0002737#Artikel7
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0001879
      - id: ref2
        bwb_id: BWBR0002737
        artikel: '7'
  - number: '38.1'
    text: |-
      Het in [artikel 25, eerste lid, van de Rijksoctrooiwet][ref1] bedoelde blad draagt de naam "De Industriële
      Eigendom" en verschijnt regelmatig op door de Octrooiraad te bepalen tijdstippen.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel25
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '25'
  - number: '38.2'
    text: |-
      De Octrooiraad draagt zorg voor de samenstelling van het blad met inachtneming van het in [artikel 39][ref1]
      bepaalde en stelt de prijs ervan vast, welke in het blad wordt bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0001908#Artikel39
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0001908
        artikel: '39'
        hoofdstuk: II
  - number: '39.1'
    text: |-
      In het blad "De Industriële Eigendom" worden, behalve de in de [Rijksoctrooiwet][ref1] en dit reglement
      voorgeschreven bekendmakingen, gegevens bekendgemaakt ten aanzien van stukken waarvan een ieder op grond van
      het bepaalde in [artikel 28A, eerste lid, van de Rijksoctrooiwet][ref2] gerechtigd is kennis te nemen en waarvan
      bekendmaking naar het oordeel van de Octrooiraad nodig is voor een duidelijk overzicht van al hetgeen geschiedt ten
      aanzien van aanvragen om octrooi en octrooien daaronder begrepen Europese octrooien.


      [ref1]: https://wetten.overheid.nl/BWBR0001879
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel28A
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0001879
      - id: ref2
        bwb_id: BWBR0001879
        artikel: 28A
  - number: '39.2'
    text: |-
      De Octrooiraad doet in het blad "De Industriële Eigendom" voorts die gegevens vermelden, welke naar zijn oordeel
      met het oog op een zo doeltreffend mogelijke voorlichting van het publiek omtrent onderwerpen betreffende de
      octrooiverlening daarvoor in aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel39
  - number: '39.3'
    text: |-
      In het blad "De Industriële Eigendom" of het daarbij behorende Bijblad worden tevens vermeld
      inschrijvingen en doorhalingen in het register van octrooigemachtigden als bedoeld in
      [artikel 3 van het Octrooigemachtigden-reglement][ref1] (*Stb.* 1968, 595).


      [ref1]: https://wetten.overheid.nl/BWBR0001975#Artikel3
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0001975
        artikel: '3'
  - number: '40'
    text: |-
      De staten, bedoeld in [artikel 34, tweede lid, van de Rijksoctrooiwet][ref1], zijn de lid-staten van de Europese
      Gemeenschappen alsmede de overige staten die partij zijn bij de Overeenkomst betreffende de Europese Economische
      Ruimte.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel34
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '34'
  - number: '50'
    text: |-
      Aanvragen om octrooi, ingediend bij een bureau voor de industriële eigendom als bedoeld in
      [artikel 59 van de Rijksoctrooiwet][ref1], worden na ontvangst bij de Octrooiraad ingeschreven in het
      octrooiregister.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel59
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '59'
  - number: '52'
    text: |-
      Het tijdstip van indiening van een stuk betreffende een aanvrage om octrooi bij een bureau voor de industriële
      eigendom als bedoeld in [artikel 59 van de Rijksoctrooiwet][ref1] geldt als tijdstip van indiening bij de
      Octrooiraad.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel59
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '59'
  - number: '53'
    text: Dit reglement kan worden aangehaald onder de titel "Octrooireglement".
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel53
