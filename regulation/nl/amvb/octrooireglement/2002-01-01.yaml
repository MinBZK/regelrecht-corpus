      - id: ref3
        bwb_id: BWBR0001879
  - number: 16B
    text: |-
      1 In het octrooiregister wordt aantekening gedaan van:

      a. feiten, waarvan ingevolge de [Rijksoctrooiwet][ref1] ambtshalve aantekening in de registers moet geschieden;

      b. de terinzagelegging van de aanvrage of de indiening van andere dan de in [artikel 16A][ref2] bedoelde stukken,
      alsmede andere dan de onder *a* bedoelde feiten, waarvan de aantekening naar het oordeel van de Octrooiraad nodig
      is voor een duidelijk overzicht van al hetgeen geschiedt ten aanzien van aanvragen om octrooi en octrooien.

      2 De aantekening geschiedt door vermelding van de aard en de datum van het feit alsmede, indien het een aantekening
      van de indiening of terinzagelegging van een stuk betreft, van de aard van dat stuk.

      3 De aantekening van de verlening van een octrooi geschiedt onder het nummer van de openbaarmaking van de aanvrage,
      welke tot het octrooi heeft geleid.


      [ref1]: https://wetten.overheid.nl/BWBR0001879
      [ref2]: https://wetten.overheid.nl/BWBR0001908#Artikel16A
