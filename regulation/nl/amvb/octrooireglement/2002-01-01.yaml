  - number: '32'
    text: |-
      1 Het in [artikel 28, derde lid, van de Rijksoctrooiwet][ref1] bedoelde bewijs moet, behalve de verklaring, dat
      octrooi is verleend, bevatten:

      a. de naam, de voornamen en de woonplaats - of, indien het een rechtspersoon betreft, de naam en de woonplaats -
      van de octrooihouder;

      b. de korte aanduiding van de uitvinding;

      c. de dagtekening van het octrooi en het nummer, waaronder van de verlening daarvan aantekening in het
      octrooiregister is gedaan;

      d. het volgnummer en het tijdstip van indiening van de aanvrage, alsmede, indien het betreft een octrooi, verleend
      ingevolge een afzonderlijke aanvrage als in [artikel 8A van de Rijksoctrooiwet][ref2] bedoeld, de vorenbedoelde
      gegevens van de oorspronkelijke aanvrage;

      e. de vermelding van het recht van voorrang;

      f. de datum, waarop de termijn, bedoeld in [artikel 47 van de Rijksoctrooiwet][ref3], eindigt.

      2 Het octrooibewijs moet door de Voorzitter van de Octrooiraad worden ondertekend.

      3 Bij het octrooibewijs wordt een exemplaar van het in [artikel 28, tweede lid, van de Rijksoctrooiwet][ref4]
      bedoelde octrooischrift gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel8A
      [ref3]: https://wetten.overheid.nl/BWBR0001879#Artikel47
      [ref4]: https://wetten.overheid.nl/BWBR0001879#Artikel28
