      1 Voor de inschrijving van de memories van grieven, bedoeld in de [artikelen 24A, eerste lid][ref1],
      en [27, eerste lid, van de Rijksoctrooiwet][ref2], een bezwaarschrift als bedoeld in
      [artikel 25, derde lid, van die rijkswet][ref3], en de verzoekschriften, bedoeld in de
      [artikelen 10, tweede lid][ref4], [32, derde lid][ref5], en [34, vijfde en negende lid, van die rijkswet][ref6], is
      een bedrag van € 161 verschuldigd.

      2 Voor de inschrijving van een verzoekschrift als bedoeld in [artikel 22F, tweede lid, van de Rijksoctrooiwet][ref7]
      is een bedrag van € 22 verschuldigd.

      3 Voor de inschrijving van een verzoekschrift als bedoeld in [artikel 25, vierde lid, van de Rijksoctrooiwet][ref8]
      is een bedrag van € 161 verschuldigd.

      4 Het bedrag, hetwelk krachtens [artikel 33, tweede lid][ref9], onderscheidenlijk
      [artikel 37, derde lid, van de Rijksoctrooiwet][ref10] is verschuldigd voor de inschrijving van de titel van
      een licentie onderscheidenlijk de akte, houdende overdracht of andere overgang van een octrooi, of van het recht
      voortvloeiende uit een aanvrage om octrooi, is € 27 voor ieder octrooi en iedere aanvrage waarop de betreffende
      akte betrekking heeft.

      5 Voor de inschrijving van een stuk, waaruit blijkt van de naamswijziging van een rechthebbende met betrekking tot
      een aanvrage om octrooi of een octrooi, is een bedrag van € 11 per octrooi en per aanvrage verschuldigd. Betreft
      de naamswijziging meer dan vijf octrooien of aanvragen om octrooi, dan is voor ieder volgend octrooi en iedere
      volgende aanvrage een bedrag van € 5 verschuldigd.

      6 Voor de inschrijving van andere dan in de vorige leden bedoelde stukken, welke ter inschrijving worden
      aangeboden, is € 27 per stuk verschuldigd met dien verstande, dat, indien een stuk betrekking heeft op meer dan één
      octrooi of aanvrage om octrooi, even zovele malen dit bedrag is verschuldigd.


