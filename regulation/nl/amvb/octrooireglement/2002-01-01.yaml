  - number: 31I
    text: |-
      1 De termijn, waarbinnen krachtens [artikel 29P, eerste lid, van de Rijksoctrooiwet][ref1] na verlening van een
      Europees octrooi een vertaling in het Nederlands van de tekst van het octrooischrift moet zijn ingediend, is drie
      maanden vanaf de dag, waarop overeenkomstig artikel 97, vierde lid, van het Europees Octrooiverdrag de vermelding
      van de verlening is gepubliceerd.

      2 De termijn, waarbinnen een vertaling van de tekst van een nieuw octrooischrift, indien in het Europees octrooi
      tijdens de oppositieprocedure wijziging is gekomen, moet zijn ingediend, is drie maanden vanaf de dag, waarop
      overeenkomstig artikel 103 van het Europees Octrooiverdrag de vermelding van de beslissing ten aanzien van de
      oppositie is gepubliceerd.

      3 Het in [artikel 17, zevende lid][ref2], bedoelde bedrag ter zake van de indiening van een vertaling als in het
      eerste of tweede lid bedoeld moet worden betaald uiterlijk voor afloop van de in het eerste lid onderscheidenlijk
      tweede lid bedoelde termijn van drie maanden.

      4 De [artikelen 22][ref3] en [23][ref4] zijn van overeenkomstige toepassing op de in
      [artikel 29P van de Rijksoctrooiwet][ref5] bedoelde vertalingen van Europese octrooischriften en nieuwe
      Europese octrooischriften en op de verbeterde vertalingen daarvan. Aan het hoofd van deze vertalingen moet het
      publikatienummer van de Europese octrooiaanvrage, die tot verlening van het Europees octrooi heeft geleid, worden
      vermeld.

      5 De waarmerking van de vertaling geschiedt in de vorm van een verklaring, dat de vertaling naar beste weten van de
      octrooigemachtigde volledig en getrouw is. Deze verklaring dient door de gemachtigde te zijn ondertekend.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel29P
      [ref2]: https://wetten.overheid.nl/BWBR0001908#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0001908#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0001908#Artikel23
      [ref5]: https://wetten.overheid.nl/BWBR0001879#Artikel29P
