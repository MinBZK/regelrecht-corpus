        bwb_id: BWBR0001879
        artikel: 22J
  - number: '29'
    text: |-
      1 Behoudens het in de volgende leden bepaalde moeten aan de Octrooiraad aangeboden stukken, niet zijnde stukken als
      bedoeld in [paragraaf 6A][ref1], in tweevoud worden ingediend.

      2 De in de [Rijksoctrooiwet][ref2] met uitzondering van de [artikelen 17A][ref3], [22I][ref4] en [22J][ref5]
      bedoelde verzoekschriften, alsmede de in die rijkswet bedoelde bezwaarschriften en memories van grieven moeten in
      vijfvoud worden ingediend.

      3 De inzender van een memorie van grieven als in [artikel 24A van de Rijksoctrooiwet][ref6] bedoeld is verplicht
      vijf exemplaren van de beschrijving, waarop de beslissing in beroep wordt gevraagd, over te leggen.

      4 De Octrooiraad zendt afschrift van een ingekomen verzoekschrift als bedoeld in de
      [artikelen 22G, eerste lid][ref7], [22H, eerste lid][ref8], [25, vierde lid][ref9], [32, vierde lid][ref10],
      en [34, vijfde lid, van de Rijksoctrooiwet][ref11], alsmede van een ingekomen bezwaarschrift
      aan de aanvrager onderscheidenlijk de octrooihouder. Van een memorie van grieven als bedoeld in
      [artikel 27 van die rijkswet][ref12], die is ingediend door de aanvrager, zendt de Octrooiraad een afschrift aan
      alle belanghebbenden bij de beslissing dienaangaande, van wier bestaan uit het octrooiregister blijkt. Van een
      memorie van grieven als bedoeld in [artikel 27 van die rijkswet][ref13], die niet is ingediend door de aanvrager,
      zendt de Octrooiraad een afschrift aan de aanvrager. Bij de toezending van de in dit lid bedoelde afschriften deelt
      de Octrooiraad tevens de termijn mede binnen welke de betrokkene zijn schriftelijke opmerkingen ter zake aan de
      Octrooiraad kan doen toekomen. Deze opmerkingen moeten in vijfvoud worden ingediend.

      5 Indien de Octrooiraad zulks verlangt, dient de inzender een groter aantal van de in de vorige leden bedoelde
      stukken dan in die leden is voorgeschreven over te leggen.


