  - number: 36D
    text: |-
      1 Met inachtneming van het in [artikel 28A van de Rijksoctrooiwet][ref1] bepaalde, worden aan een ieder, op een
      daartoe strekkend verzoek waarbij wordt aangegeven op welke aanvrage om octrooi of welk octrooi en welke stukken
      dat verzoek betrekking heeft, tegen betaling van een door de Octrooiraad voor elk voor verstrekking in aanmerking
      komend soort afschrift te bepalen bedrag van ten hoogste € 1 per bladzijde, afschriften verstrekt van in dat
      artikel bedoelde stukken.

      2 De krachtens de vorige leden bepaalde bedragen worden bekendgemaakt in het in [artikel 38][ref2] bedoelde blad.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel28A
      [ref2]: https://wetten.overheid.nl/BWBR0001908#Artikel38
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel36D
