  - number: '1'
    text: In dit reglement wordt verstaan onder *de Minister:* Onze Minister van Economische Zaken.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel1
  - number: '2'
    text: |-
      1 De Octrooiraad bestaat uit:

      a. ten hoogste negentig gewone leden en plaatsvervangende leden, te onderscheiden in rechtsgeleerde en technische
      leden; het aantal gewone leden bedraagt ten hoogste veertig, daaronder begrepen de voorzitter en ten hoogste vier
      ondervoorzitters;

      b. een of meer buitengewone leden.

      2 De buitengewone leden worden ieder voor een tijdvak van vijf jaren benoemd; zij zijn telkens voor een volgend
      tijdvak van vijf jaren herbenoembaar.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel2
  - number: '3'
    text: |-
      De gewone, de buitengewone en de plaatsvervangende leden mogen niet deelnemen aan de behandeling van zaken, waarbij
      zij een middellijk of onmiddellijk belang hebben, of waarbij zij in enig opzicht betrokken zijn.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel3
  - number: '4'
    text: |-
      De belofte, bedoeld in [artikel 14, derde lid, van de Rijksoctrooiwet][ref1], luidt als volgt:

      "Ik beloof, dat ik ijverig, nauwgezet en onpartijdig de plichten zal vervullen, welke het ambt van voorzitter
      (ondervoorzitter, gewoon lid, buitengewoon lid, plaatsvervangend lid) van de Octrooiraad medebrengt, en met
      name aan de in de afdelingen te nemen beslissingen naar eigen overtuiging zal medewerken en geheim zal houden,
      hetgeen mij uit hoofde van mijn ambt bij de Octrooiraad bekend is van de octrooiaanvragen voor zover deze niet
      overeenkomstig het bij de [Rijksoctrooiwet][ref2] bepaalde zijn ter inzage gelegd of openbaargemaakt en stiptelijk
      zal helpen uitvoeren de in aanmerking komende wetten en algemene maatregelen van bestuur, en dat ik om iets
      hoegenaamd in dit ambt te doen of te laten, van niemand middellijk of onmiddellijk enige belofte of enig geschenk
      zal aannemen.

      Dat beloof ik.

      Ik verklaar, dat ik middellijk noch onmiddellijk, onder welke naam of voorwendsel voor het verkrijgen mijner
      aanstelling, aan iemand wie het ook zij, iets heb gegeven of beloofd.

      Dat verklaar ik."


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0001879
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel4
    references:
