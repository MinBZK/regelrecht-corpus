  - number: 31D
    text: |-
      Bij een overeenkomstig [artikel 22B van de Rijksoctrooiwet][ref1] verricht depot dient een schriftelijke verklaring
      van de bewaargever te worden gevoegd, inhoudende:

      a. een uiteenzetting omtrent de omstandigheden alsmede de eigenschappen van het micro-organisme, die van belang
      zijn voor het kweken, de opslag, de hantering en de levensvatbaarheid van het micro-organisme;

      b. een aanduiding van de methode waarmee de aanwezigheid van het micro-organisme kan worden vastgesteld;

      c. een identificatieaanduiding en, zo mogelijk, de wetenschappelijke beschrijving en de voorgestelde taxonomische
      aanduiding van het micro-organisme.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22B
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel31D
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 22B
  - number: 31E
    text: |-
      1 De cultuur van een micro-organisme, die is gedeponeerd overeenkomstig
      [artikel 22B, tweede lid, van de Rijksoctrooiwet][ref1], dient vanaf de dag van indiening van de desbetreffende
      aanvrage om octrooi beschikbaar te zijn voor het verstrekken van monsters overeenkomstig [artikel 31F][ref2], tot
      de datum waarop vaststaat dat op die aanvrage geen octrooi verleend wordt, dan wel tot de datum waarop het op die
      aanvrage verleende octrooi zijn kracht verliest.

      2 Indien de cultuur van een micro-organisme ophoudt beschikbaar te zijn bij de instelling waarbij de cultuur is
      opgeslagen, omdat het micro-organisme niet meer levensvatbaar is of de instelling om andere redenen niet in staat
      is monsters van die cultuur af te geven en de cultuur niet is overgedragen aan een andere instelling als bedoeld
      in [artikel 31C][ref3], eerste lid, waarbij zij toegankelijk blijft, wordt zij niettemin aangemerkt als beschikbaar
      te zijn gebleven, indien, binnen een termijn van drie maanden na de datum waarop de instelling of de Octrooiraad
      het niet meer beschikbaar zijn van de cultuur ter kennis heeft gebracht van de bewaargever daarvan, een nieuw depot
      van een cultuur van het desbetreffende micro-organisme wordt verricht en een afschrift van het door de betrokken
      instelling afgegeven ontvangstbewijs van het nieuwe depot, met aanduiding van het nummer van de octrooiaanvrage of
      van het octrooi, aan de Octrooiraad is toegezonden.

      3 Het tweede lid is van overeenkomstige toepassing, indien de instelling waarbij de cultuur is opgeslagen de
      uitoefening van haar functies ten aanzien van de gedeponeerde culturen van micro-organismen heeft gestaakt of
      niet meer voldoet aan de omschrijving in [artikel 31C, eerste lid][ref4], met dien verstande dat de in het tweede
      lid bedoelde termijn van drie maanden begint op de datum waarop dat feit is vermeld in het in [artikel 38][ref5]
      bedoelde blad.

      4 Ieder nieuw depot als bedoeld in het tweede lid dient te zijn vergezeld van een door de bewaargever ondertekende
      verklaring dat de opnieuw gedeponeerde cultuur van het micro-organisme gelijk is aan de oorspronkelijk
      gedeponeerde.

      5 Indien zich een feit als bedoeld in het derde lid voordoet, doet de Octrooiraad hiervan zo spoedig mogelijk
      mededeling in het in [artikel 38][ref6] bedoelde blad.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22B
      [ref2]: https://wetten.overheid.nl/BWBR0001908#Artikel31F
      [ref3]: https://wetten.overheid.nl/BWBR0001908#Artikel31C
      [ref4]: https://wetten.overheid.nl/BWBR0001908#Artikel31C
      [ref5]: https://wetten.overheid.nl/BWBR0001908#Artikel38
      [ref6]: https://wetten.overheid.nl/BWBR0001908#Artikel38
