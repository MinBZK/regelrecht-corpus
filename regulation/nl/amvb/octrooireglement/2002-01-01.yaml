        paragraaf: 6A
  - number: 31A
    text: |-
      1 De Octrooiraad kan met betrekking tot hem aan te bieden stukken betreffende een aanvrage om octrooi of een
      octrooi, niet zijnde stukken als bedoeld in [paragraaf 6A][ref1], alsmede met betrekking tot hem aan te bieden
      modellen en monsters nadere voorschriften vaststellen. Deze voorschriften kunnen standaardformulieren voor
      vorenbedoelde stukken inhouden.

      2 De in het eerste lid bedoelde voorschriften worden bekendgemaakt in het in [artikel 38][ref2] bedoelde blad,
      behoudens voor wat standaardformulieren betreft. Exemplaren daarvan zijn bij het Bureau voor de industriële
      eigendom verkrijgbaar en worden door dit bureau toegezonden aan de in [artikel 59 van de Rijksoctrooiwet][ref3]
      bedoelde bureaus.


      [ref1]: https://wetten.overheid.nl/BWBR0001908#HoofdstukI
