  - number: '21'
    text: |-
      De in [artikel 22A, derde lid, van de Rijksoctrooiwet][ref1] bedoelde overige vormvoorschriften voor een aanvrage
      om octrooi zijn de volgende:

      1°. De aanvrage moet worden ingediend in tweevoud en vermelden:

      a. de naam, de voornamen en de woonplaats - of, indien het een rechtspersoon betreft, de naam en de woonplaats -
      van de aanvrager, alsmede, indien geen gemachtigde is gesteld, zijn adres;

      b. de naam, de voornamen en de woonplaats van de uitvinder, tenzij deze heeft verklaard geen prijs te stellen op
      vermelding als uitvinder in het octrooi;

      c. indien een gemachtigde is gesteld, diens naam, woonplaats en adres;

      d. indien het een afzonderlijke aanvrage als bedoeld in [artikel 8A van de Rijksoctrooiwet][ref2] betreft, de datum
      van de indiening en het volgnummer van de oorspronkelijke aanvrage.

      2°. De korte aanduiding, bedoeld in [artikel 22A, eerste lid, onder ][ref3], mag geen fantasienaam bevatten.
      Indien de bij de aanvrage behorende beschrijving aan het slot conclusies van verschillende categorieën bevat
      (voortbrengsel, werkwijze, inrichting of gebruik), moet dit duidelijk uit de korte aanduiding blijken.

      3°. De aanvrage moet een opsomming van de bijlagen bevatten met vermelding van de aard van ieder stuk.

      4°. Indien de aanvrage door meer dan één persoon is ingediend, moet zij een voor de aanvragers gemeenschappelijk
      domicilie vermelden. Voorts moet worden aangegeven, indien geen gemachtigde is gesteld, door welke aanvrager zij
      gemeenschappelijk vertegenwoordigd worden.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22A
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel8A
      [ref3]: https://wetten.overheid.nl/BWBR0001879#Artikel22A
