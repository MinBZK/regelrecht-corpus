      De bedragen, die krachtens [artikel 19B, tweede lid, van de Rijksoctrooiwet][ref1] voor de werkzaamheden van de
      Octrooiraad als ontvangend bureau moeten worden betaald, zijn:

      a. de toezendingstaks, bedoeld in Regel 14.1 van het bij het Samenwerkingsverdrag behorende Reglement: € 50;

      b. de taks, bedoeld in Regel 20.9 van het onder a bedoelde Reglement:  € 5 voor elk gewaarmerkt afschrift,
      vermeerderd met een bedrag van  € 1 per bladzijde.


