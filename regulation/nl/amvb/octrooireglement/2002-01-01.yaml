        artikel: '14'
      - id: ref2
        bwb_id: BWBR0001879
  - number: '5'
    text: |-
      1 De centrale afdeling bestaat uit vijf leden.

      2 De Voorzitter van de Octrooiraad heeft ambtshalve zitting in de centrale afdeling. De vier overige leden daarvan,
      alsmede vijf plaatsvervangende leden, worden door de Minister uit de gewone leden van de Octrooiraad aangewezen in
      dier voege, dat de centrale afdeling steeds één rechtsgeleerd lid telt en een passende verdeling van de technische
      leden over de onderscheiden gebieden van de techniek wordt in acht genomen.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel5
  - number: '6'
    text: |-
      1 De centrale afdeling stelt met inachtneming van [artikel 7][ref1] voor de behandeling van iedere octrooiaanvrage
      een aanvraagafdeling samen uit de gewone, buitengewone en plaatsvervangende leden van de Octrooiraad. Zij stelt met
      inachtneming van [artikel 8][ref2] voor de behandeling van ieder beroep een afdeling van beroep samen uit de gewone
      en buitengewone leden van die raad.

      2 Zij stelt met inachtneming van [artikel 9][ref3] voor het verrichten van de werkzaamheden
      bij de [artikelen 10, tweede lid][ref4], [17A, vierde lid][ref5], [18, vierde lid][ref6],
      [22G, derde lid][ref7],[ 22H, derde lid][ref8], [29L, eerste lid][ref9], [34, zesde en negende lid][ref10],
      [34A, tweede lid][ref11], [34B, derde lid][ref12], en [57, eerste lid, van de Rijksoctrooiwet][ref13] aan de
      Octrooiraad opgedragen, telkens een bijzondere afdeling samen uit de gewone, buitengewone en plaatsvervangende
      leden van die raad.

      3 Zij regelt de vervanging van de leden van die afdelingen in geval van hun verhindering of ontstentenis.


