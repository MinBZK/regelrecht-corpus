  - number: 36C
    text: |-
      Aan de in [artikel 59 van de Rijksoctrooiwet][ref1] bedoelde bureaus wordt zo spoedig mogelijk een exemplaar van de
      in [artikel 35][ref2] en [36B][ref3] bedoelde bescheiden toegezonden.


