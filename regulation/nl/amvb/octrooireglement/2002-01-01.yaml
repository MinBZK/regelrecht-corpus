  - number: 16A
    text: |-
      1 Onverminderd het in [artikel 17, eerste lid, van de Rijksoctrooiwet][ref1] bepaalde, worden in het
      octrooiregister voorts ingeschreven:

      a. de in de [Rijksoctrooiwet][ref2] bedoelde verzoekschriften, bezwaarschriften en memories van grieven;

      b. aan de Octrooiraad aangeboden stukken, niet zijnde stukken als onder *a* bedoeld, waarvan ingevolge de
      [Rijksoctrooiwet][ref3] ambtshalve of op verzoek inschrijving in de registers moet geschieden;

      c. aan die raad aangeboden stukken, niet zijnde stukken als onder *a* en *b* bedoeld, waarin sprake is van rechten
      of verplichtingen van een octrooiaanvrager, een octrooihouder of een derde, betrekking hebbende op een aanvrage om
      octrooi of een octrooi;

      d. aan die raad aangeboden stukken, waaruit blijkt van de naamswijziging van een rechthebbende met betrekking tot
      een aanvrage om octrooi of een octrooi.

      2 De inschrijving geschiedt door vermelding van de aard en het onderwerp van het stuk, de datum van de indiening
      van het stuk, alsmede, voor wat verzoekschriften, bezwaarschriften en memories van grieven betreft, de naam van
      degene, die het stuk heeft ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0001879
      [ref3]: https://wetten.overheid.nl/BWBR0001879
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel16A
    references:
