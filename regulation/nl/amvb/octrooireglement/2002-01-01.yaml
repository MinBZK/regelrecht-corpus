  - number: '22'
    text: |-
      De in [artikel 22A, derde lid, van de Rijksoctrooiwet][ref1] bedoelde overige vormvoorschriften voor de bij een
      aanvrage om octrooi behorende beschrijving zijn de volgende:

      1°. De beschrijving moet worden ingediend in drievoud en zijn gesteld op één zijde van één of meer bladen buigzaam,
      sterk, wit, glad, niet-glanzend en duurzaam papier van het formaat A 4 (29,7 * 21 cm).

      2°. De beschrijving dient met een donkere onuitwisbare inkt getypt of gedrukt te zijn, dit zodanig dat zij in een
      onbeperkt aantal exemplaren rechtstreeks kan worden gereproduceerd door middel van fotografie, elektrostatische
      werkwijzen, foto-offset en microfilm. De bladen dienen ongekreukt en ongescheurd te zijn; zij mogen niet gevouwen
      zijn.

      3°. Grafische symbolen en tekens, en chemische of wiskundige formules kunnen zo nodig met de hand worden geschreven
      of getekend. In getypte of gedrukte tekst dient 1 ½ regelafstand te worden gebruikt.

      4°. Aan het hoofd van de beschrijving moet de korte aanduiding, bedoeld in [artikel 22A, eerste lid, onder ][ref2],
      zijn vermeld.

      5°. De conclusies als bedoeld in [artikel 22A, eerste lid, onder ][ref3] moeten beginnen op een nieuw blad en
      doorlopend genummerd zijn.

      6°. Elke vijfde regel van elk blad van de beschrijving behoort te worden genummerd, waarbij de nummers moeten
      worden aangebracht op de linkerzijde, aan de rechterzijde van de marge.

      7°. De bladen van de beschrijving moeten doorlopend genummerd zijn in Arabische cijfers. De nummers van de bladen
      moeten worden geplaatst boven aan de bladzijden in het midden, doch niet in de bovenmarge.

      8°. De bladen van de beschrijving moeten rondom onbeschreven randen hebben van ten minste de volgende afmetingen:

      bovenmarge 2 cm; rechtermarge 2 cm; linkermarge 2,5 cm; benedenmarge 2 cm.

      9°. Elk blad van de beschrijving dient redelijk vrij te zijn van raderingen en vrij te zijn van veranderingen en
      van boven elkaar geschreven en tussengeschreven woorden.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22A
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel22A
      [ref3]: https://wetten.overheid.nl/BWBR0001879#Artikel22A
