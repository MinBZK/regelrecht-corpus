articles:
  - number: '1'
    text: In dit reglement wordt verstaan onder *de Minister:* Onze Minister van Economische Zaken.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel1
  - number: '2.1'
    text: 'De Octrooiraad bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel2
  - number: 2.1.a
    text: |-
      ten hoogste negentig gewone leden en plaatsvervangende leden, te onderscheiden in rechtsgeleerde en technische
      leden; het aantal gewone leden bedraagt ten hoogste veertig, daaronder begrepen de voorzitter en ten hoogste vier
      ondervoorzitters;
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel2
  - number: 2.1.b
    text: een of meer buitengewone leden.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel2
  - number: '2.2'
    text: |-
      De buitengewone leden worden ieder voor een tijdvak van vijf jaren benoemd; zij zijn telkens voor een volgend
      tijdvak van vijf jaren herbenoembaar.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel2
  - number: '3'
    text: |-
      De gewone, de buitengewone en de plaatsvervangende leden mogen niet deelnemen aan de behandeling van zaken, waarbij
      zij een middellijk of onmiddellijk belang hebben, of waarbij zij in enig opzicht betrokken zijn.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel3
  - number: '4'
    text: |-
      De belofte, bedoeld in [artikel 14, derde lid, van de Rijksoctrooiwet][ref1], luidt als volgt: "Ik beloof, dat
      ik ijverig, nauwgezet en onpartijdig de plichten zal vervullen, welke het ambt van voorzitter (ondervoorzitter,
      gewoon lid, buitengewoon lid, plaatsvervangend lid) van de Octrooiraad medebrengt, en met name aan de in de
      afdelingen te nemen beslissingen naar eigen overtuiging zal medewerken en geheim zal houden, hetgeen mij uit hoofde
      van mijn ambt bij de Octrooiraad bekend is van de octrooiaanvragen voor zover deze niet overeenkomstig het bij
      de [Rijksoctrooiwet][ref2] bepaalde zijn ter inzage gelegd of openbaargemaakt en stiptelijk zal helpen uitvoeren
      de in aanmerking komende wetten en algemene maatregelen van bestuur, en dat ik om iets hoegenaamd in dit ambt te
      doen of te laten, van niemand middellijk of onmiddellijk enige belofte of enig geschenk zal aannemen. Dat beloof
      ik. Ik verklaar, dat ik middellijk noch onmiddellijk, onder welke naam of voorwendsel voor het verkrijgen mijner
      aanstelling, aan iemand wie het ook zij, iets heb gegeven of beloofd. Dat verklaar ik."


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0001879
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0001879
  - number: '5.1'
    text: De centrale afdeling bestaat uit vijf leden.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel5
  - number: '5.2'
    text: |-
      De Voorzitter van de Octrooiraad heeft ambtshalve zitting in de centrale afdeling. De vier overige leden daarvan,
      alsmede vijf plaatsvervangende leden, worden door de Minister uit de gewone leden van de Octrooiraad aangewezen in
      dier voege, dat de centrale afdeling steeds één rechtsgeleerd lid telt en een passende verdeling van de technische
      leden over de onderscheiden gebieden van de techniek wordt in acht genomen.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel5
  - number: '6.1'
    text: |-
      De centrale afdeling stelt met inachtneming van [artikel 7][ref1] voor de behandeling van iedere octrooiaanvrage
      een aanvraagafdeling samen uit de gewone, buitengewone en plaatsvervangende leden van de Octrooiraad. Zij stelt met
      inachtneming van [artikel 8][ref2] voor de behandeling van ieder beroep een afdeling van beroep samen uit de gewone
      en buitengewone leden van die raad.


      [ref1]: https://wetten.overheid.nl/BWBR0001908#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0001908#Artikel8
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001908
        artikel: '7'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001908
        artikel: '8'
        hoofdstuk: I
        paragraaf: '2'
  - number: '6.2'
    text: |-
      Zij stelt met inachtneming van [artikel 9][ref1] voor het verrichten van de werkzaamheden
      bij de [artikelen 10, tweede lid][ref2], [17A, vierde lid][ref3], [18, vierde lid][ref4],
      [22G, derde lid][ref5],[ 22H, derde lid][ref6], [29L, eerste lid][ref7], [34, zesde en negende lid][ref8],
      [34A, tweede lid][ref9], [34B, derde lid][ref10], en [57, eerste lid, van de Rijksoctrooiwet][ref11] aan de
      Octrooiraad opgedragen, telkens een bijzondere afdeling samen uit de gewone, buitengewone en plaatsvervangende
      leden van die raad.


      [ref1]: https://wetten.overheid.nl/BWBR0001908#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0001879#Artikel17A
