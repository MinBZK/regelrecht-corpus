  - number: '23'
    text: |-
      De in [artikel 22A, derde lid, van de Rijksoctrooiwet][ref1] bedoelde overige vormvoorschriften voor de bij een
      aanvrage om octrooi behorende tekeningen zijn de volgende:

      1°. De tekeningen moeten worden ingediend in drievoud en zijn gesteld op één zijde van één of meer bladen buigzaam,
      sterk, wit, glad, niet-glanzend en duurzaam papier van het formaat A 4 (29,7 * 21 cm).

      2°. De tekeningen moeten in al haar onderdelen zijn uitgevoerd in krachtige en gelijkmatig getrokken duurzame
      lijnen van een enkele donkere kleur, dit zodanig, dat zij in een onbeperkt aantal exemplaren rechtstreeks kunnen
      worden gereproduceerd door middel van fotografie, elektrostatische werkwijzen, foto-offset en microfilm. De bladen
      dienen ongekreukt en ongescheurd te zijn.

      3°. De tekeningen moeten binnen de spiegel van 26,2 cm en 17 cm worden gehouden. De bladen van de tekeningen mogen
      geen rand rond de te gebruiken of gebruikte bladspiegel hebben. De minimummarges dienen als volgt te zijn:

      bovenmarge 2,5 cm; rechtermarge 1,5 cm; linkermarge 2,5 cm; benedenmarge 1 cm.

      4°. De afzonderlijke figuren moeten duidelijk van elkaar gescheiden en doorlopend genummerd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22A
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 22A
  - number: 23A
    text: |-
      Het bij een aanvrage om octrooi behorende uittreksel mag ten hoogste één figuur bevatten en dient:

      a. in tweevoud te worden ingediend en met een donkere, onuitwisbare inkt getypt of gedrukt te zijn op één blad
      duurzaam wit papier van het formaat A4 (29,7 * 21 cm);

      b. in de Nederlandse taal te zijn gesteld en ten minste 50 woorden en ten hoogste 250 dan wel, indien het
      uittreksel een figuur bevat, ten hoogste 150 woorden te bevatten.
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel23A
  - number: '24'
    text: |-
      De in [artikel 22B, derde lid, van de Rijksoctrooiwet][ref1] bedoelde nadere vormvoorschriften voor de bij een
      aanvrage om octrooi behorende beschrijving en de in dat lid bedoelde nadere voorschriften voor de inrichting van
      die beschrijving zijn de volgende:

      1°. De beschrijving moet aangeven welke uitkomst op het gebied van de nijverheid met de uitvinding wordt beoogd,
      met afbakening van het nieuwe ten opzichte van de stand van de techniek.

      2°. De tot de beschrijving behorende conclusies moeten datgene wat nieuw is en waarvoor het uitsluitend recht
      verlangd wordt, nauwkeurig en afzonderlijk aanwijzen.

      3°. De beschrijving en de conclusies, behorende bij een afzonderlijke aanvrage als in
      [artikel 8A van de Rijksoctrooiwet][ref2] bedoeld, moeten kunnen worden begrepen zonder raadpleging van de
      oorspronkelijke aanvrage.

      4°. De beschrijving moet nauwkeurig en juist zijn gesteld, zo kort mogelijk en zonder nutteloze herhalingen.

      5°. Maten en gewichten moeten in de beschrijving zijn aangegeven volgens het metrieke stelsel, temperaturen in
      graden Celsius, scheikundige elementen, -verbindingen en -grootheden, alsook natuurkundige en technische grootheden
      op een wijze als in de internationale praktijk is aanvaard.

      6°. De beschrijving mag geen andere figuren bevatten dan natuurwetenschappelijke, wiskundige of technische formules
      en tekens. Indien deze bij het drukken te veel ruimte in beslag zouden nemen of andere moeilijkheden zouden
      opleveren, moeten zij afzonderlijk als tekening worden overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22B
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel8A
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 22B
      - id: ref2
        bwb_id: BWBR0001879
        artikel: 8A
  - number: '25'
    text: |-
      De in [artikel 22B, derde lid, van de Rijksoctrooiwet][ref1] bedoelde nadere vormvoorschriften voor de bij een
      aanvrage om octrooi behorende tekeningen en de in dat lid bedoelde nadere voorschriften voor de inrichting van die
      tekeningen zijn de volgende:

      1°. De tekeningen moeten duidelijk zijn en mogen niet meer bevatten dan voor een juist begrip van de uitvinding
      nodig is.

      2°. Dwarsdoorsneden moeten zijn aangegeven door schuine arceringen; een en ander mag niet het duidelijk
      onderscheiden van verwijzingstekens en lijnen verhinderen.

      3°. De schaal van de tekeningen moet worden bepaald rekening houdende met de graad van ingewikkeldheid der figuren;
      zij is voldoende indien een fotografische reproduktie op twee derde van de grootte veroorlooft de bijzonderheden
      zonder moeite te zien.

      4°. Verwijzingstekens ter aanduiding van de onderdelen der figuren mogen alleen worden gebruikt voor zover een
      goed begrip van de beschrijving zulks vereist; zij moeten overeenkomen met die, welke in de beschrijving voorkomen.
      Dezelfde onderdelen in verschillende figuren moeten overal aangegeven zijn door dezelfde verwijzingstekens. Ingeval
      in de beschrijving varianten van de uitvinding worden beschreven, mag in met deze varianten overeenkomende figuren
      gebruik worden gemaakt van een systeem, waarbij dezelfde kenmerken in verschillende figuren worden aangeduid door
      samenhangende verwijzingscijfers (bijvoorbeeld algemeen kenmerk "15" wordt in figuur 1 aangeduid met "115", in
      figuur 2 met "215", enz.). Een verwijzingsteken mag niet voor verschillende onderdelen worden gebezigd, ook niet
      in verschillende figuren; bijvoeging van accenten of cijfers bij de verwijzingstekens moet zoveel mogelijk worden
      vermeden.

      5°. De tekeningen mogen geen verklaring bevatten met uitzondering van aanduidingen als "water", "stoom", "doorsnede
      II-II", "open", "dicht" en, voor wat elektrische blokschema's of fabricageschema's betreft, de aanduidingen nodig
      voor een goed begrip daarvan. Deze aanduidingen moeten in de Nederlandse taal zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel22B
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: 22B
  - number: '26'
    text: |-
      Een aanvrage om octrooi en de daarbij behorende beschrijving dienen bij voorkeur te zijn ingericht overeenkomstig
      door de Octrooiraad daarvoor vastgestelde standaardformulieren. Exemplaren van deze standaardformulieren
      zijn verkrijgbaar bij het Bureau voor de industriële eigendom en worden door dit bureau toegezonden aan de in
      [artikel 59 van de Rijksoctrooiwet][ref1] bedoelde bureaus.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel59
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '59'
  - number: '27'
    text: |-
      1 Aan de Octrooiraad aangeboden stukken betreffende een aanvrage om octrooi of een octrooi, niet zijnde stukken
      als bedoeld in [paragraaf 6A][ref1], moeten duidelijk leesbaar zijn en, behoudens voor wat de in het tweede lid
      bedoelde stukken betreft, in de Nederlandse taal zijn gesteld of van een desverlangd gewaarmerkte Nederlandse
      vertaling zijn voorzien. De Octrooiraad is bevoegd op verzoek al dan niet tijdelijk ontheffing te verlenen van het
      voorschrift betreffende een Nederlandse vertaling.

      2 De in [artikel 7, zesde lid, van de Rijksoctrooiwet][ref2] bedoelde bewijzen van het recht van voorrang en van
      overgang van dit recht moeten in de Nederlandse, Franse, Duitse of Engelse taal zijn gesteld of van een desverlangd
      gewaarmerkte vertaling in een van die talen zijn voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0001908#HoofdstukI
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel7
    url: https://wetten.overheid.nl/BWBR0001908/2002-01-01#Artikel27
