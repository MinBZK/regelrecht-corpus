articles:
  - number: '1'
    text: |-
      Er zijn twee diploma's in de archivistiek:

      a. het diploma archivistiek A en

      b. het diploma archivistiek B.
    url: https://wetten.overheid.nl/BWBR0007749/1999-09-17#Artikel1
  - number: '2'
    text: |-
      1 Tot en met het studiejaar 2005–2006 wordt het diploma archivistiek A verkregen door met goed gevolg het
      afsluitende examen af te leggen, verbonden aan een aangewezen opleiding als bedoeld in het tweede lid.

      2 Op aanvraag van een instelling voor wetenschappelijk onderwijs wijst Onze Minister van Onderwijs, Cultuur en
      Wetenschappen een opleiding in de zin van de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] op
      het terrein van de boek- en informatiewetenschap met 168 studiepunten aan als een opleiding ter verkrijging van
      het diploma archivistiek A, indien de onderwijseenheden van die opleiding naar zijn oordeel de archivistiek in
      voldoende mate betreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0007749/1999-09-17#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: '3'
    text: |-
      1 Tot en met het studiejaar 2005–2006 wordt het diploma archivistiek B verkregen door met goed gevolg het
      afsluitende examen af te leggen, verbonden aan een aangewezen opleiding als bedoeld in het tweede lid.

      2 Op aanvraag van een instelling voor hoger beroepsonderwijs wijst Onze Minister van Onderwijs, Cultuur en
      Wetenschappen een opleiding in de zin van de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] op
      het terrein van bibliotheek en documentaire informatie met 168 studiepunten aan als een opleiding ter verkrijging
      van het diploma archivistiek B, indien de onderwijseenheden van die opleiding naar zijn oordeel de archivistiek in
      voldoende mate betreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0007749/1999-09-17#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005682
  - number: '4'
    text: |-
      De bevoegdheid van Onze Minister van Onderwijs, Cultuur en Wetenschappen, bedoeld in de
      [artikelen 2, tweede lid][ref1], en [3, tweede lid][ref2], vervalt met ingang van het studiejaar 2001–2002.


      [ref1]: https://wetten.overheid.nl/BWBR0007749#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007749#Artikel3
    url: https://wetten.overheid.nl/BWBR0007749/1999-09-17#Artikel4
    references:
