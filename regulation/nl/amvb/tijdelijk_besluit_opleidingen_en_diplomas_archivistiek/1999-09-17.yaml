        artikel: '2'
      - id: ref2
        bwb_id: BWBR0007749
        artikel: '3'
  - number: '5'
    text: |-
      1 Onverminderd de [artikelen 2][ref1] en [3][ref2] wordt het diploma archivistiek A of het diploma archivistiek B
      tot en met het studiejaar 2000–2001 tevens verkregen door het met goed gevolg afleggen van een examen ten overstaan
      van een examencommissie waarvan de leden door Onze Minister van Onderwijs, Cultuur en Wetenschappen worden benoemd.

      2 Bij ministeriële regeling worden in ieder geval regels gesteld omtrent:

      a. de vakken die geëxamineerd worden;

      b. de vaststelling van de tijdstippen en de plaats van de examens of herexamens;

      c. de wijze van aanmelding;

      d. de wijze van afnemen en de duur van het examen voor elk vak;

      e. het overleggen van een werkstuk en van een verklaring betreffende praktische werkzaamheid;

      f. de hoogte van het examengeld;

      g. het instellen van beroep tegen besluiten van de examencommissie.

      3 Bij ministeriële regeling worden regels gesteld omtrent de samenstelling en werkwijze van de examencommissie.

      4 Tot het examen ter verkrijging van het diploma archivistiek A wordt toegelaten degene die:

      a. in het bezit is van het getuigschrift van een aan een Nederlandse universiteit met goed gevolg afgelegd
      afsluitend examen verbonden aan een opleiding op het gebied van het recht, op het gebied van taal en cultuur, dan
      wel een met één van deze getuigschriften bij of krachtens enige wet gelijkgesteld getuigschrift, en

      b. gedurende ten minste één jaar praktisch werkzaam is geweest bij één of meer archiefbewaarplaatsen, waarvan de
      beheerder in het bezit is van de hoedanigheid van hoger archiefambtenaar, bedoeld in [artikel 9 van de Archiefwet
      1962](onbekend), dan wel van het diploma archivistiek A;

      5 Onze Minister van Onderwijs, Cultuur en Wetenschappen kan in bijzondere gevallen ontheffing verlenen van het
      vierde lid, onderdeel *a*, aan degene die in het bezit is van het getuigschrift van een aan een Nederlandse
      universiteit met goed gevolg afgelegd afsluitend examen verbonden aan een andere opleiding dan genoemd in het
      vierde lid, onderdeel *a*, dan wel van een met zo'n getuigschrift bij of krachtens enige wet gelijkgesteld
      getuigschrift.

      6 Tot het examen ter verkrijging van het diploma archivistiek B wordt toegelaten degene die:

      a. in het bezit is van een getuigschrift van een met goed gevolg afgelegd eindexamen aan een school voor
      voorbereidend wetenschappelijk onderwijs, dan wel van een met dit getuigschrift bij of krachtens enige wet
      gelijkgesteld getuigschrift, en

      b. gedurende ten minste één jaar praktisch werkzaam is geweest bij één of meer archiefbewaarplaatsen,
      waarvan de beheerder in het bezit is van de hoedanigheid van middelbaar archiefambtenaar, bedoeld in
      [artikel 9 van de Archiefwet][ref3] 1962, dan wel van het diploma archivistiek B, of praktisch werkzaam is geweest
      onder toezicht van een provinciaal inspecteur als bedoeld in [artikel 28 van de Archiefwet 1995][ref4].

      7 Onze Minister van Onderwijs, Cultuur en Wetenschappen kan in bijzondere gevallen ontheffing verlenen van het
      zesde lid, onderdeel *a*.

      8 Onverminderd het vierde en het zesde lid wordt na 31 december 1999 slechts toegelaten tot het examen ter
      verkrijging van het diploma archivistiek A onderscheidenlijk archivistiek B degene die reeds voor die datum tot dat
      examen is toegelaten en tenminste een onderdeel daarvan heeft afgelegd.


