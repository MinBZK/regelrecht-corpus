preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 7 november 1997,
    nr. MJZ97570259, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Gelet op de artikelen 6, 15, 17, 65, 67, 70, 71, 92, 97 en 98 van de Wet bodembescherming;

    De Raad van State gehoord (advies van 26 november 1997, nr. W08.97.0725);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 3
    december 1997, nr. MJZ 97579463, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:






                  wet:


                  de [Wet bodembescherming][ref1];








                  lozing in de bodem:


                  het definitief in de bodem brengen of doen brengen van vloeistoffen;








                  bestaande lozing in de bodem:


                  lozing in de bodem die voor 1 juli 1990 regelmatig plaatsvond in het kader van een op die datum reeds
      bestaande activiteit en waarvan het aantal lozingseenheden - indien het een omvangrijke lozing van huishoudelijk
      afvalwater in de bodem betreft - sedert 1 juli 1990 met ten hoogste 20 procent is toegenomen;








                  gemiddeld hoogste grondwaterstand:


                  het gemiddeld hoogste niveau van de grondwaterstand gemeten over een tijdvak van ten minste 8 jaar;








                  riolering:


                  een gemeentelijk rioolstelsel;








                  woonruimte:


                  een ruimte die blijkens haar inrichting bestemd is als een afzonderlijk geheel te voorzien in
      woongelegenheid;








                  lozingseenheid:


                  berekeningseenheid voor de hoeveelheid huishoudelijk afvalwater die per dag in de bodem wordt geloosd;








                  beperkte lozing in de bodem:


                  lozing in de bodem van 10 lozingseenheden of minder per dag;








                  omvangrijke lozing in de bodem:


                  lozing in de bodem van meer dan 10 lozingseenheden per dag;








                  huishoudelijk afvalwater:


                  afvalwater afkomstig van particuliere huishoudens en ander afvalwater dat naar zijn aard en
      samenstelling overeenkomt met afvalwater afkomstig van een particulier huishouden;








                  koelwater:


                  water dat uitsluitend is gebruikt voor koelingsdoeleinden, indien daaraan geen verontreinigende stoffen
      zijn toegevoegd en de concentratie van verontreinigende stoffen in het water niet door een bewerking van het water
      is toegenomen;








                  overige vloeistoffen:


                  vloeistoffen niet zijnde huishoudelijk afvalwater of koelwater;




                  omgevingsvergunning:


                  omgevingsvergunning voor een activiteit met betrekking tot een inrichting als bedoeld in
      [artikel 2.1, eerste lid, onder e, van de Wet algemene bepalingen omgevingsrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003994
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003994
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
  - number: '2.1'
    text: 'Dit besluit is niet van toepassing op een lozing in de bodem:'
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel2
  - number: 2.1.a
    text: |-
      van water onttrokken uit een oppervlaktewaterlichaam, indien daaraan, na de onttrekking, geen verontreinigende
      stoffen zijn toegevoegd, de concentratie van verontreinigende stoffen niet door een bewerking is toegenomen en
      daaraan geen warmte is toegevoegd;
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel2
  - number: 2.1.b
    text: |-
      van hemelwater of drinkwater, indien daaraan geen verontreinigende stoffen zijn toegevoegd, de concentratie van
      verontreinigende stoffen niet door een bewerking is toegenomen en daaraan geen warmte is toegevoegd;
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel2
  - number: 2.1.c
    text: |-
      van ter plaatse opgepompt grondwater in dezelfde laag als waar het werd opgepompt, indien daaraan, na de
      onttrekking, geen verontreinigende stoffen zijn toegevoegd, de concentratie van verontreinigende stoffen niet door
      een bewerking is toegenomen en daaraan geen warmte is toegevoegd;
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel2
  - number: 2.1.d
    text: 'indien het een beregenen, bevloeien of besproeien met uitsluitend grondwater betreft met het oog op:'
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel2
  - number: 2.1.d.1
    text: de vochtvoorziening van gewassen;
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel2
  - number: 2.1.d.2
    text: het schoonmaken van gewassen op het veld;
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel2
  - number: 2.1.d.3
    text: het voorkomen van verstuiving van op de bodem gebrachte materialen;
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel2
  - number: 2.1.e
    text: via een vloeiveld, bezinkveld, biezenveld of rietveld;
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel2
  - number: 2.1.f
    text: |-
      indien het water betreft afkomstig van het reinigen van voertuigen op landbouwbedrijven, die niet zijn gebruikt
      voor het toepassen van gewasbeschermingsmiddelen of biociden;
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel2
  - number: 2.1.g
    text: bij het stomen van de bodem met het oog op de bestrijding van ziekten en plagen;
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel2
  - number: 2.1.h
    text: |-
      voor zover sprake is van [artikel 15, eerste, dan wel tweede lid, van de Wet op de openluchtrecreatie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006548#Artikel15
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006548
        artikel: '15'
  - number: 2.1.i
    text: indien het een opspuiten van terreinen betreft met het oog op het bouwrijp maken daarvan;
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel2
  - number: 2.1.k
    text: voor zover het plaatsvindt in het kader van een toediening van kunstmeststoffen met het oog op de gewasproduktie.
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel2
  - number: '2.2'
    text: 'Dit besluit is voorts niet van toepassing op een lozing in de bodem:'
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel2
  - number: 2.2.a
    text: |-
      binnen inrichtingen waarvoor ingevolge een besluit op grond van [artikel 8.40][ref1] ter zake van lozingen in de
      bodem in het belang van de bescherming van de bodem voorschriften gelden;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 2.2.b
    text: |-
      voor zover daaromtrent in het belang van de bescherming van de bodem voorschriften gelden die krachtens
      [artikel 7 van de wet][ref1] zijn gesteld met betrekking tot het gebruik van dierlijke mest of zuiveringsslib;


      [ref1]: https://wetten.overheid.nl/BWBR0003994#Artikel7
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003994
        artikel: '7'
  - number: 2.2.c
    text: vanuit een particulier huishouden;
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel2
  - number: 2.2.d
    text: |-
      waarop het [Besluit lozen buiten inrichtingen][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0029789
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0029789
  - number: '3.1'
    text: |-
      Behoudens het bepaalde in het tweede tot en met zesde lid zijn voor de toepassing van dit besluit burgemeester en
      wethouders van de gemeente waar de lozing in de bodem plaatsvindt, het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel3
  - number: '3.2'
    text: |-
      Gedeputeerde staten van de provincie waar een lozing in de bodem plaatsvindt, zijn het bevoegd gezag, indien het
      een lozing in de bodem betreft:
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel3
  - number: 3.2.a
    text: |-
      binnen een inrichting die is aangewezen krachtens [artikel 1.1, derde of vijfde lid, van de Wet milieubeheer][ref1]
      en waarvoor krachtens [artikel 2.4, tweede lid, van de Wet algemene bepalingen omgevingsrecht][ref2], gedeputeerde
      staten voor de vergunningverlening krachtens die wet bevoegd gezag zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 3.2.b
    text: |-
      van grondwater dat ter plaatse is onttrokken krachtens een vergunning als bedoeld in
      [artikel 6.4 van de Waterwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
  - number: 3.2.c
    text: |-
      die plaatsvindt op een diepte van meer dan 10 meter beneden het maaiveld en ten aanzien waarvan niet ingevolge het
      vierde lid Onze Minister van Economische Zaken het bevoegd gezag is.
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel3
  - number: '3.3'
    text: |-
      Onze Minister is het bevoegd gezag, indien het een lozing in de bodem betreft binnen een inrichting die
      is aangewezen krachtens [artikel 1.1, derde lid, van de Wet milieubeheer][ref1] en waarvoor krachtens
      [artikel 2.4, derde lid, van de Wet algemene bepalingen omgevingsrecht][ref2], Onze Minister voor de
      vergunningverlening krachtens die wet bevoegd gezag is.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
  - number: '3.4'
    text: |-
      Onze Minister van Economische Zaken is het bevoegd gezag indien dit besluit bij of krachtens een algemene
      maatregel van bestuur als bedoeld in [artikel 49 van de Mijnbouwwet][ref1] geheel of gedeeltelijk van toepassing
      wordt verklaard op mijnbouwwerken als bedoeld in [artikel 1, onder n, van de Mijnbouwwet][ref2], die krachtens
      [artikel 1.1, derde lid, van de Wet milieubeheer][ref3] aangewezen inrichtingen zijn, waarvoor op grond van het
      bepaalde bij of krachtens [artikel 2.4, derde lid, van de Wet algemene bepalingen omgevingsrecht][ref4] Onze
      Minister van Economische Zaken het bevoegd gezag is voor de verlening van een omgevingsvergunning, dan wel waarvoor
      een vergunning krachtens [artikel 40 van de Mijnbouwwet][ref5] is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0014168#Artikel40
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '49'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref5
        bwb_id: BWBR0014168
        artikel: '40'
  - number: '3.5'
    text: |-
      Met betrekking tot een lozing in de bodem in een gebied dat niet deel uitmaakt van een provincie, is het
      bestuursorgaan dat is aangewezen krachtens [artikel 21.5 van de Wet milieubeheer][ref1], het bevoegd gezag en
      worden de door dit gezag daartoe aan te wijzen ambtenaren belast met het toezicht op de naleving van het bij of
      krachtens dit besluit bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel21
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '21'
  - number: '3.6'
    text: |-
      Het bestuur van het waterschap in wiens beheergebied een lozing in de bodem plaatsvindt, is het bevoegd gezag,
      indien het een lozing in de bodem betreft van grondwater dat ter plaatse is onttrokken krachtens een door dat
      bestuur verleende vergunning als bedoeld in [artikel 6.5 van de Waterwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
  - number: '4.1'
    text: |-
      Voor de berekening van het aantal lozingseenheden van een lozing van huishoudelijk afvalwater in de bodem wordt
      voor de toepassing van dit besluit uitgegaan van:
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel4
  - number: 4.1.a
    text: 3 lozingseenheden voor een woonruimte;
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel4
  - number: 4.1.b
    text: |-
      1 lozingseenheid per slaapplaats voor een hotel, pension, kazerne, ziekenhuis, internaat en daarmee gelijk te
      stellen instellingen;
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel4
  - number: 4.1.c
    text: |-
      7 lozingseenheden voor zover een vrijstelling is verleend op grond van
      [artikel 8, tweede lid, aanhef en onder a, van de Wet op de openluchtrecreatie][ref1] en 4 lozingseenheden voor
      zover een vrijstelling is verleend op grond van [artikel 8, tweede lid, aanhef en onder b of c, van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0006548#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0006548#Artikel8
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006548
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0006548
        artikel: '8'
  - number: 4.1.d
    text: 1 lozingseenheid per 50 m3 water dat jaarlijks wordt gebruikt in de overige gevallen.
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel4
  - number: '4.2'
    text: |-
      Indien meer dan 20 procent van het gebruikte water niet in de bodem wordt geloosd, of wordt geloosd op een wijze
      als bedoeld in [artikel 2][ref1], bepaalt het bevoegd gezag op daartoe strekkende aanvraag dat in afwijking van het
      bepaalde in het eerste lid, onder d, in plaats van de hoeveelheid gebruikt water wordt uitgegaan van de hoeveelheid
      geloosd water.


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel2
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009092
        artikel: '2'
        hoofdstuk: I
  - number: '5.1'
    text: |-
      Het is verboden een beperkte lozing van huishoudelijk afvalwater in de bodem - niet zijnde een bestaande lozing in
      de bodem - uit te voeren.
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel5
  - number: '5.2'
    text: |-
      Het verbod geldt niet, indien de afstand van de kadastrale grens van het perceel waar het huishoudelijk
      afvalwater vrijkomt, tot de dichtstbijzijnde riolering meer is dan 40 meter en tevens wordt voldaan aan de
      [artikelen 6 tot en met 9][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel6
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009092
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
  - number: '5.3'
    text: |-
      Het bevoegd gezag kan voor een lozing in de bodem, anders dan binnen een inrichting waarvoor een
      omgevingsvergunning is vereist, op een daartoe strekkende aanvraag voor een door hem vast te stellen termijn,
      gebaseerd op het nog niet verstreken deel van een redelijke afschrijvingstermijn van het bij de aanleg van de
      riolering reeds bestaande zuiveringssysteem en van de bij die aanleg reeds bestaande infiltratievoorziening,
      ontheffing verlenen van het in het eerste lid bedoelde verbod, indien:
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel5
  - number: 5.3.a
    text: |-
      de afstand van de kadastrale grens van het perceel waar het huishoudelijk afvalwater vrijkomt, tot de
      dichtstbijzijnde riolering 40 meter of minder is, en
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel5
  - number: 5.3.b
    text: |-
      wordt voldaan aan de [artikelen 6 tot en met 9][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel6
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009092
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
  - number: '5.4'
    text: |-
      Voor de toepassing van het tweede en derde lid wordt de afstand tot de dichtstbijzijnde riolering berekend langs de
      kortste lijn waar de afvoerleidingen zonder overwegende bezwaren kunnen worden aangelegd.
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel5
  - number: 5a.1
    text: |-
      Ten aanzien van een lozing in de bodem binnen een inrichting waarvoor een omgevingsvergunning is vereist,
      kan het bestuursorgaan dat bevoegd is die vergunning te verlenen, bij de vergunning bepalen dat in afwijking
      van het verbod, bedoeld in [artikel 5, eerste lid][ref1], een lozing in de bodem is toegestaan indien het in
      [artikel 5, derde lid][ref2], bedoelde geval zich binnen de inrichting voordoet.


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009092#Artikel5
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0009092
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009092
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
  - number: 5a.2
    text: |-
      [Artikel 5, vierde lid][ref1], en de [artikelen 6 tot en met 9][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009092#Artikel6
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0009092
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009092
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
  - number: '6.1'
    text: |-
      Voorafgaand aan een lozing in de bodem als bedoeld in [artikel 5][ref1] moet het huishoudelijk afvalwater door een
      zuiveringssysteem bestaande uit een septic tank worden geleid.


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel5
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009092
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
  - number: '6.2'
    text: |-
      Een lozing in de bodem als bedoeld in [artikel 5][ref1] moet worden uitgevoerd in een zakput, infiltratiebed,
      infiltratiekanaal, dan wel opgehoogd infiltratiebed.


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel5
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009092
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
  - number: '6.3'
    text: |-
      De onderzijde van een infiltratievoorziening als bedoeld in het tweede lid moet boven de gemiddeld hoogste
      grondwaterstand zijn gelegen.
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel6
  - number: '6.4'
    text: |-
      Voorafgaande aan de lozing in de bodem moet door middel van een onderzoek, uitgevoerd overeenkomstig door
      Onze Minister vast te stellen regels, de gemiddeld hoogste grondwaterstand ter plaatse van de lozing en de
      dimensionering van de infiltratievoorziening zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel6
  - number: '7.1'
    text: |-
      Een zuiveringssysteem, een infiltratievoorziening alsmede de daarbij behorende leidingen moeten van een zodanige
      constructie zijn en van zodanige materialen zijn vervaardigd, dat zij duurzaam bestand zijn tegen vervorming en
      corrosie.
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel7
  - number: '7.2'
    text: |-
      Een zuiveringssysteem, een infiltratievoorziening alsmede de daarbij behorende leidingen moeten zodanig zijn
      aangelegd en uitgevoerd dat:
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel7
  - number: 7.2.a
    text: zij te allen tijde bereikbaar zijn,
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel7
  - number: 7.2.b
    text: alle onderdelen gemakkelijk te herstellen en te vervangen zijn en
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel7
  - number: 7.2.c
    text: alle vorstgevoelige onderdelen tegen vorst zijn beschermd.
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel7
  - number: '7.3'
    text: |-
      Een infiltratievoorziening en de afgesloten onderdelen van een zuiveringssysteem moeten zodanig zijn uitgevoerd,
      dat een voldoende en ongehinderde afvoer van gevormde gassen kan plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel7
  - number: '8.1'
    text: |-
      Een zuiveringssysteem en de daarmee verbonden leidingen moeten vloeistofdicht zijn uitgevoerd en moeten
      vloeistofdicht zijn verbonden met een infiltratievoorziening.
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel8
  - number: '8.2'
    text: |-
      Een zuiveringssysteem en een infiltratievoorziening moeten in dimensionering en uitvoering op elkaar zijn
      afgestemd.
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel8
  - number: '8.3'
    text: Onze Minister stelt nadere regels met betrekking tot zuiveringssystemen en infiltratievoorzieningen.
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel8
  - number: '9'
    text: |-
      Zuiveringssystemen en infiltratievoorzieningen moeten, zolang zij in gebruik zijn voor lozingen in de bodem,
      zodanig worden onderhouden, dat hun goede werking gewaarborgd is.
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel9
  - number: '10'
    text: |-
      Indien een beperkte lozing van huishoudelijk afvalwater in de bodem definitief wordt beëindigd, moeten het
      zuiveringssysteem en de infiltratievoorziening worden verwijderd, of na volledige verwijdering van het erin
      aanwezige slib, worden opgevuld met schoon bodemmateriaal.
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel10
  - number: 10a.1
    text: |-
      Bij een aanvraag om een ontheffing als bedoeld in [artikel 5, derde lid][ref1], worden de gegevens verstrekt die
      in de bij dit besluit behorende [bijlage I][ref2] zijn aangegeven. Onze Minister kan nadere regels stellen met
      betrekking tot de te verstrekken gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009092
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0009092
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009092
  - number: 10a.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op een aanvraag om een vergunning als bedoeld in
      [artikel 5a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel5a
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0009092
        artikel: 5a
        hoofdstuk: II
        paragraaf: '1'
  - number: '11.1'
    text: Het is verboden een bestaande beperkte lozing van huishoudelijk afvalwater in de bodem uit te voeren.
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel11
  - number: '11.2'
    text: |-
      Het verbod geldt niet indien de afstand van het dichtstbijzijnde gebouw waar het huishoudelijk afvalwater vrijkomt
      tot de dichtstbijzijnde riolering meer is dan 40 meter.
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel11
  - number: '11.3'
    text: |-
      De afstand tot de dichtstbijzijnde riolering als bedoeld in het tweede en vierde lid wordt berekend langs de
      kortste lijn waar de afvoerleidingen zonder overwegende bezwaren kunnen worden aangelegd.
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel11
  - number: '11.4'
    text: |-
      [Artikel 5, derde lid][ref1], is ten aanzien van het in het eerste lid bedoelde verbod van overeenkomstige
      toepassing, met dien verstande dat het in [artikel 5, derde lid, onder a][ref2], gestelde voor de toepassing van
      dit lid wordt vervangen door: de afstand van het dichtstbijzijnde gebouw waar het huishoudelijk afvalwater vrijkomt
      tot de dichtstbijzijnde riolering 40 meter of minder is.


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009092#Artikel5
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009092
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009092
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
  - number: 11a.1
    text: |-
      Ten aanzien van een lozing in de bodem binnen een inrichting waarvoor een omgevingsvergunning is vereist,
      kan het bestuursorgaan dat bevoegd is die vergunning te verlenen, bij de vergunning bepalen dat in afwijking
      van het verbod, bedoeld in [artikel 11, eerste lid][ref1], een lozing in de bodem is toegestaan indien het in
      [artikel 11, vierde lid][ref2], juncto [artikel 5, derde lid][ref3], bedoelde geval zich binnen de inrichting
      voordoet.


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0009092#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0009092#Artikel5
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0009092
        artikel: '11'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009092
        artikel: '11'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0009092
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
  - number: 11a.2
    text: |-
      [Artikel 11, derde lid][ref1], is op het eerste lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel11
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0009092
        artikel: '11'
        hoofdstuk: II
        paragraaf: '2'
  - number: '12.1'
    text: |-
      Met ingang van 1 januari 2005 zijn de [artikelen 6 tot en met 9][ref1] voor een bestaande beperkte lozing van
      huishoudelijk afvalwater in de bodem van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel6
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009092
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
  - number: '12.2'
    text: |-
      In afwijking van het eerste lid zijn de [artikelen 6 tot en met 9][ref1] voor een bestaande beperkte lozing van
      huishoudelijk afvalwater in de bodem van overeenkomstige toepassing met ingang van 1 juli 1995, indien de lozing
      plaatsvindt bij een horecabedrijf als bedoeld in het [Besluit horecabedrijven milieubeheer](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel6
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009092
        artikel: '6'
        hoofdstuk: II
        paragraaf: '1'
  - number: '13'
    text: |-
      Indien een bestaande beperkte lozing van huishoudelijk afvalwater in de bodem definitief wordt beëindigd is
      [artikel 10][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel10
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009092
        artikel: '10'
        hoofdstuk: II
        paragraaf: '1'
  - number: 13a.1
    text: |-
      Bij een aanvraag om een ontheffing als bedoeld in [artikel 11, vierde lid][ref1], juncto
      [artikel 5, derde lid][ref2], worden de gegevens verstrekt die in de bij dit besluit behorende [bijlage I][ref3]
      zijn aangegeven. Onze Minister kan nadere regels stellen met betrekking tot de te verstrekken gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0009092#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0009092
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0009092
        artikel: '11'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009092
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0009092
  - number: 13a.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op een in [artikel 11a][ref1] bedoelde aanvraag om afwijking van
      het in [artikel 11, eerste lid][ref2], bedoelde verbod.


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel11a
      [ref2]: https://wetten.overheid.nl/BWBR0009092#Artikel11
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0009092
        artikel: 11a
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009092
        artikel: '11'
        hoofdstuk: II
        paragraaf: '2'
  - number: '14.1'
    text: |-
      Het is verboden een omvangrijke lozing van huishoudelijk afvalwater in de bodem - niet zijnde een bestaande lozing
      in de bodem - uit te voeren.
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel14
  - number: '14.2'
    text: |-
      Het bevoegd gezag kan, voor een lozing in de bodem anders dan binnen een inrichting waarvoor een
      omgevingsvergunning is vereist, op daartoe strekkende aanvraag voor een door hem vast te stellen termijn van ten
      hoogste tien jaar, ontheffing verlenen van het in het eerste lid bedoelde verbod indien:
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel14
  - number: 14.2.a
    text: |-
      de afstand van de kadastrale grens van het perceel waar het huishoudelijk afvalwater vrijkomt tot de
      dichtstbijzijnde riolering, afhankelijk van het aantal lozingseenheden, ten minste bedraagt: - tot 25
      lozingseenheden 100 meter
        - van 25 tot 50 lozingseenheden 600 meter
        - van 50 tot 100 lozingseenheden 1500 meter
        - van 100 tot en met 200 lozingseenheden 3000 meter,
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel14
  - number: 14.2.b
    text: het een lozing in de bodem betreft van ten hoogste 200 lozingseenheden,
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel14
  - number: 14.2.c
    text: |-
      uit een onderzoek, verricht met grondboringen, uitgevoerd overeenkomstig door Onze Minister vast te stellen regels,
      de gemiddeld hoogste grondwaterstand ter plaatse van de lozing en de dimensionering van de infiltratievoorziening
      is vastgesteld en
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel14
  - number: 14.2.d
    text: |-
      een aansluiting op de riolering of een andere wijze van afvoer van het huishoudelijk afvalwater redelijkerwijs niet
      mogelijk is.
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel14
  - number: '14.3'
    text: |-
      Aan een ontheffing worden ten minste de voorschriften verbonden, bedoeld in de [artikelen 15 tot en met 19][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel15
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009092
        artikel: '15'
        hoofdstuk: III
        paragraaf: '1'
  - number: '14.4'
    text: |-
      Het bevoegd gezag kan tevens voor een lozing in de bodem, anders dan binnen een inrichting waarvoor een
      omgevingsvergunning is vereist, op een daartoe strekkende aanvraag, voor een door hem vast te stellen termijn,
      gebaseerd op het nog niet verstreken deel van een redelijke afschrijvingstermijn van het bij de aanleg van de
      riolering reeds bestaande zuiveringssysteem, bedoeld in [artikel 15][ref1] , en van de infiltratievoorziening,
      bedoeld in [artikel 16][ref2], ontheffing verlenen van het in het eerste lid bedoelde verbod, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0009092#Artikel16
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009092
        artikel: '15'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009092
        artikel: '16'
        hoofdstuk: III
        paragraaf: '1'
  - number: 14.4.a
    text: |-
      de afstand van het dichtstbijzijnde gebouw waar het huishoudelijk afvalwater vrijkomt tot de dichtstbijzijnde
      riolering kleiner is dan de afstand die ingevolge het tweede lid, onder a, vereist is, en
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel14
  - number: 14.4.b
    text: |-
      wordt voldaan aan het tweede lid, onder b en c, en aan de [artikelen 15 tot en met 19][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel15
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009092
        artikel: '15'
        hoofdstuk: III
        paragraaf: '1'
  - number: '14.5'
    text: |-
      Voor de toepassing van het tweede en vierde lid wordt de afstand tot de dichtstbijzijnde riolering berekend langs
      de kortste lijn waar de afvoerleidingen zonder overwegende bezwaren kunnen worden aangelegd.
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel14
  - number: 14a.1
    text: |-
      Ten aanzien van een lozing in de bodem binnen een inrichting waarvoor een omgevingsvergunning is vereist,
      kan het bestuursorgaan dat bevoegd is die vergunning te verlenen, bij de vergunning bepalen dat in afwijking
      van het verbod, bedoeld in [artikel 14, eerste lid][ref1], een lozing in de bodem is toegestaan in gevallen
      als bedoeld in [artikel 14, tweede lid, onder a tot en met d][ref2], dan wel in gevallen als bedoeld in
      [artikel 14, vierde lid, onder a en b][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0009092#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0009092#Artikel14
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0009092
        artikel: '14'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009092
        artikel: '14'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0009092
        artikel: '14'
        hoofdstuk: III
        paragraaf: '1'
  - number: 14a.2
    text: |-
      Indien ingevolge het eerste lid een lozing in de bodem is toegestaan en het in [artikel 14, tweede lid][ref1],
      bedoelde geval zich binnen de inrichting voordoet, zijn [artikel 14, derde en vijfde lid][ref2], alsmede de
      [artikelen 15 tot en met 19][ref3] van overeenkomstige toepassing. Indien ingevolge het eerste lid een lozing in de
      bodem is toegestaan en het in [artikel 14, vierde lid][ref4], bedoelde geval zich binnen de inrichting voordoet, is
      [artikel 14, vijfde lid][ref5], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0009092#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0009092#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0009092#Artikel14
      [ref5]: https://wetten.overheid.nl/BWBR0009092#Artikel14
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0009092
        artikel: '14'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009092
        artikel: '14'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0009092
        artikel: '15'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0009092
        artikel: '14'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0009092
        artikel: '14'
        hoofdstuk: III
        paragraaf: '1'
  - number: '15.1'
    text: |-
      Het huishoudelijk afvalwater moet, alvorens een lozing in de bodem als bedoeld in [artikel 14][ref1] plaatsvindt
      worden gezuiverd door middel van:


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel14
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009092
        artikel: '14'
        hoofdstuk: III
        paragraaf: '1'
  - number: 15.1.a
    text: een opgehoogd infiltratiebedsysteem,
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel15
  - number: 15.1.b
    text: een opgehoogd filtratiebedsysteem,
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel15
  - number: 15.1.c
    text: een zandfiltersysteem,
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel15
  - number: 15.1.d
    text: een oxydatiebedsysteem of
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel15
  - number: 15.1.e
    text: een biorotorsysteem.
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel15
  - number: '15.2'
    text: |-
      Bij toepassing van een opgehoogd infiltratiebed - een opgehoogd filtratiebed - dan wel een zandfiltersysteem moet
      het huishoudelijk afvalwater achtereenvolgens worden voorbehandeld en biologisch behandeld.
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel15
  - number: '15.3'
    text: |-
      Bij toepassing van een oxydatiebed - dan wel een biorotorsysteem moet het huishoudelijk afvalwater achtereenvolgens
      worden voorbehandeld, biologisch behandeld en nabehandeld.
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel15
  - number: '16.1'
    text: |-
      Een lozing in de bodem als bedoeld in [artikel 14][ref1] dient te worden uitgevoerd in een zakput, infiltratiebed,
      infiltratiekanaal, dan wel opgehoogd infiltratiebed.


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel14
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009092
        artikel: '14'
        hoofdstuk: III
        paragraaf: '1'
  - number: '16.2'
    text: |-
      De onderzijde van een infiltratievoorziening als bedoeld in het eerste lid moet boven de gemiddeld hoogste
      grondwaterstand zijn gelegen.
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel16
  - number: '17'
    text: |-
      Met betrekking tot zuiveringssystemen bedoeld in [artikel 15][ref1] en infiltratievoorzieningen bedoeld in
      [artikel 16][ref2] zijn de [artikelen 7 tot met 9][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0009092#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0009092#Artikel7
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0009092
        artikel: '15'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009092
        artikel: '16'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0009092
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
  - number: '18.1'
    text: |-
      Degene die een lozing in de bodem als bedoeld in [artikel 14][ref1] uitvoert, moet het zuiveringssysteem vóór
      in gebruikname en vervolgens tenminste eenmaal per twee jaar, door een deskundig bedrijf doen keuren op de goede
      werking ervan.


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel14
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0009092
        artikel: '14'
        hoofdstuk: III
        paragraaf: '1'
  - number: '18.2'
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent de in het eerste lid genoemde keuring en
      het deskundig bedrijf.
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel18
  - number: '18.3'
    text: |-
      De schriftelijke resultaten van een keuring als bedoeld in het eerste lid moeten door degene die de lozing in de
      bodem uitvoert gedurende ten minste vijf jaar worden bewaard.
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel18
  - number: '19'
    text: |-
      Indien een lozing in de bodem als bedoeld in [artikel 14][ref1] definitief wordt beëindigd, moeten het
      zuiveringssysteem en de infiltratievoorziening worden verwijderd of, na volledige verwijdering van het erin
      aanwezige slib, worden opgevuld met schoon bodemmateriaal.


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel14
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0009092
        artikel: '14'
        hoofdstuk: III
        paragraaf: '1'
  - number: '20'
    text: |-
      Bij een aanvraag om een ontheffing als bedoeld in [artikel 14][ref1] en bij een in [artikel 14a][ref2] bedoelde
      aanvraag om afwijking van het in [artikel 14, eerste lid][ref3], bedoelde verbod worden de gegevens verstrekt die
      in de bij dit besluit behorende [bijlage I][ref4] zijn aangegeven. Onze Minister kan nadere regels stellen met
      betrekking tot de te verstrekken gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0009092#Artikel14a
      [ref3]: https://wetten.overheid.nl/BWBR0009092#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0009092
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0009092
        artikel: '14'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009092
        artikel: 14a
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0009092
        artikel: '14'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0009092
  - number: '21.1'
    text: Het is verboden een omvangrijke bestaande lozing van huishoudelijk afvalwater in de bodem uit te voeren.
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel21
  - number: '21.2'
    text: 'Het verbod geldt niet indien:'
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel21
  - number: 21.2.a
    text: |-
      de afstand van het dichtstbijzijnde gebouw waar het huishoudelijk afvalwater vrijkomt tot de dichtstbijzijnde
      riolering, afhankelijk van het aantal lozingseenheden, ten minste bedraagt: - tot 25 lozingseenheden 100 meter
        - van 25 tot 50 lozingseenheden 600 meter
        - van 50 tot 100 lozingseenheden 1500 meter
        - van 100 tot en met 200 lozingseenheden 3000 meter,
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel21
  - number: 21.2.b
    text: het een lozing in de bodem betreft van ten hoogste 200 lozingseenheden,
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel21
  - number: 21.2.c
    text: |-
      uit een onderzoek, verricht met grondboringen, uitgevoerd overeenkomstig door Onze Minister vast te stellen
      regels, de gemiddeld hoogste grondwaterstand ter plaatse van de lozing in de bodem en de dimensionering van de
      infiltratievoorziening is vastgesteld en
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel21
  - number: 21.2.d
    text: |-
      wordt voldaan aan de voorschriften, vermeld in de [artikelen 15 tot en met 18][ref1], en de krachtens
      [artikel 30][ref2] gestelde nadere eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0009092#Artikel30
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0009092
        artikel: '15'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009092
        artikel: '30'
        hoofdstuk: V
  - number: '21.3'
    text: |-
      Het bevoegd gezag kan op een daartoe strekkende aanvraag voor een door hem vast te stellen termijn, gebaseerd
      op het nog niet verstreken deel van een redelijke afschrijvingstermijn van de bij de aanleg van de riolering
      reeds bestaande zuiveringssystemen, bedoeld in [artikel 15][ref1], en de infiltratievoorziening, bedoeld in
      [artikel 16][ref2], ontheffing verlenen van het in het eerste lid bedoelde verbod, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0009092#Artikel16
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0009092
        artikel: '15'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009092
        artikel: '16'
        hoofdstuk: III
        paragraaf: '1'
  - number: 21.3.a
    text: |-
      de afstand van het dichtstbijzijnde gebouw waar het huishoudelijk afvalwater vrijkomt tot de dichtstbijzijnde
      riolering kleiner is dan de afstand die ingevolge het tweede lid, onder a, vereist is, en
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel21
  - number: 21.3.b
    text: wordt voldaan aan het tweede lid, onder b, c en d.
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel21
  - number: '21.4'
    text: |-
      [Artikel 20][ref1] is op een aanvraag om een ontheffing als bedoeld in het derde lid van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel20
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0009092
        artikel: '20'
        hoofdstuk: III
        paragraaf: '1'
  - number: '21.5'
    text: |-
      Voor de toepassing van het tweede en derde lid wordt de afstand tot de dichtstbijzijnde riolering berekend langs de
      kortste lijn waar de afvoerleidingen zonder overwegende bezwaren kunnen worden aangelegd.
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel21
  - number: 21a.1
    text: |-
      Ten aanzien van een lozing in de bodem binnen een inrichting waarvoor een omgevingsvergunning is vereist,
      kan het bestuursorgaan dat bevoegd is die vergunning te verlenen, bij de vergunning bepalen dat in afwijking
      van het verbod, bedoeld in [artikel 21, eerste lid][ref1], een lozing in de bodem is toegestaan indien het in
      [artikel 21, derde lid][ref2], bedoelde geval zich binnen de inrichting voordoet.


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0009092#Artikel21
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0009092
        artikel: '21'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009092
        artikel: '21'
        hoofdstuk: III
        paragraaf: '2'
  - number: 21a.2
    text: |-
      De [artikelen 15 tot en met 20][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel15
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0009092
        artikel: '15'
        hoofdstuk: III
        paragraaf: '1'
  - number: '22.1'
    text: |-
      Degene die een lozing in de bodem als bedoeld in [artikel 21][ref1] uitvoert en die voornemens is de gebezigde
      lozingswijze te wijzigen, geeft hiervan zo spoedig mogelijk kennis aan het bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel21
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0009092
        artikel: '21'
        hoofdstuk: III
        paragraaf: '2'
  - number: '22.2'
    text: |-
      Bij een kennisgeving als bedoeld in het eerste lid worden de gegevens verstrekt die in de bij dit besluit
      behorende [bijlage II][ref1] zijn aangegeven. De kennisgeving wordt gedaan op een formulier waarvan het model
      wordt vastgesteld door Onze Minister. Onze Minister kan daarbij nadere regels stellen met betrekking tot de in
      [bijlage II][ref2] bedoelde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0009092
      [ref2]: https://wetten.overheid.nl/BWBR0009092
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0009092
      - id: ref2
        bwb_id: BWBR0009092
  - number: '23'
    text: |-
      Ter zake van het definitief beëindigen van een lozing in de bodem als bedoeld in [artikel 21][ref1] is
      [artikel 19][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0009092#Artikel19
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0009092
        artikel: '21'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009092
        artikel: '19'
        hoofdstuk: III
        paragraaf: '1'
  - number: '24.1'
    text: Het is verboden een lozing van koelwater in de bodem uit te voeren.
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel24
  - number: '24.2'
    text: |-
      Het bevoegd gezag kan, voor een lozing in de bodem anders dan binnen een inrichting waarvoor een
      omgevingsvergunning is vereist, op daartoe strekkende aanvraag voor een door hem vast te stellen termijn van ten
      hoogste tien jaar, ontheffing verlenen van het in het eerste lid bedoelde verbod.
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel24
  - number: 24a.1
    text: |-
      Ten aanzien van een lozing in de bodem binnen een inrichting waarvoor een omgevingsvergunning is vereist, kan het
      bestuursorgaan dat bevoegd is die vergunning te verlenen, bij die vergunning bepalen dat, in afwijking van het
      verbod, bedoeld in [artikel 24, eerste lid][ref1], een lozing in de bodem is toegestaan voor een door hem vast te
      stellen termijn van ten hoogste tien jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel24
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0009092
        artikel: '24'
        hoofdstuk: IV
  - number: 24a.2
    text: |-
      [Artikel 26][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel26
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0009092
        artikel: '26'
        hoofdstuk: IV
  - number: '25.1'
    text: Het is verboden een lozing van overige vloeistoffen in de bodem uit te voeren.
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel25
  - number: '25.2'
    text: |-
      Het bevoegd gezag kan, voor een lozing in de bodem anders dan binnen een inrichting waarvoor een
      omgevingsvergunning is vereist, op daartoe strekkende aanvraag, voor een door hem vast te stellen termijn van ten
      hoogste vier jaar, ontheffing verlenen van het in het eerste lid bedoelde verbod, indien wordt aangetoond dat:
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel25
  - number: 25.2.a
    text: een aansluiting op de riolering of een andere wijze van afvoer van de vloeistof niet mogelijk is en
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel25
  - number: 25.2.b
    text: |-
      in de overige vloeistoffen geen stoffen voorkomen als bedoeld in de bij dit besluit behorende [bijlage III][ref1],
      of deze stoffen daarin voorkomen met een - wat betreft de stoffen van lijst I zodanig geringe toxiciteit,
      persistentie en (bio)accumulatie, of - wat betreft de stoffen van lijst II - zodanig geringe schadelijke werking
      dat ook op de lange termijn geen gevaar voor verontreiniging van de bodem bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0009092
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0009092
  - number: '25.3'
    text: |-
      Indien Onze Minister van Economische Zaken op grond van [artikel 3, vierde lid][ref1], dient te beslissen
      over een besluit inzake een ontheffing, stelt hij de directeur-generaal Milieubeheer van het Ministerie van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer in de gelegenheid ter zake advies uit te brengen. De
      directeur-generaal Milieubeheer brengt een advies uit binnen vier weken nadat hij daartoe in de gelegenheid is
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel3
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0009092
        artikel: '3'
        hoofdstuk: I
  - number: 25a.1
    text: |-
      Ten aanzien van een lozing in de bodem binnen een inrichting waarvoor een omgevingsvergunning is vereist, kan het
      bestuursorgaan dat bevoegd is die vergunning te verlenen, bij die vergunning bepalen dat, in afwijking van het
      verbod, bedoeld in [artikel 25, eerste lid][ref1], een lozing in de bodem is toegestaan in gevallen als bedoeld in
      [artikel 25, tweede lid, onder a en b][ref2], voor een door hem vast te stellen termijn van ten hoogste vier jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0009092#Artikel25
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0009092
        artikel: '25'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0009092
        artikel: '25'
        hoofdstuk: IV
  - number: 25a.2
    text: |-
      [Artikel 25, derde lid][ref1], en [artikel 26][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0009092#Artikel26
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0009092
        artikel: '25'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0009092
        artikel: '26'
        hoofdstuk: IV
  - number: '26.1'
    text: |-
      Aan een ontheffing als bedoeld in de [artikelen 24][ref1] en [25][ref2] worden ten minste voorschriften verbonden
      met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0009092#Artikel25
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0009092
        artikel: '24'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0009092
        artikel: '25'
        hoofdstuk: IV
  - number: 26.1.a
    text: |-
      de wijze waarop en de frequentie waarmee onderzoek moet worden verricht naar de samenstelling van de vloeistof die
      in de bodem wordt geloosd en naar de hoedanigheden van de bodem ter plaatse,
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel26
  - number: 26.1.b
    text: de samenstelling en de hoeveelheid van de vloeistof die in de bodem wordt geloosd,
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel26
  - number: 26.1.c
    text: de wijze waarop de lozing in de bodem plaats moet vinden en
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel26
  - number: 26.1.d
    text: |-
      voor zover het geen lozing in de bodem van koelwater betreft, de wijze van definitieve beëindiging van de lozing in
      de bodem.
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel26
  - number: '26.2'
    text: |-
      Bij een aanvraag om een ontheffing worden de gegevens verstrekt die in de bij dit besluit behorende
      [bijlage I][ref1] zijn aangegeven. Onze Minister kan nadere regels stellen met betrekking tot de te verstrekken
      gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0009092
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0009092
  - number: '27.1'
    text: |-
      Degene die ingevolge de uitvoering van de [artikelen 14, tweede lid][ref1], [14a, eerste lid][ref2],
      juncto [artikel 14, tweede lid][ref3], [21, tweede lid][ref4], [24a, tweede lid][ref5], juncto [26][ref6]
      en [25a, tweede lid][ref7], juncto [26][ref8], [26, eerste lid][ref9], dan wel [34, eerste lid][ref10],
      onderzoek dient te verrichten op of in een gedeelte van de bodem ten aanzien waarvan hem de nodige bevoegdheid
      ontbreekt, kan het bevoegd gezag verzoeken de rechthebbenden een gedoogplicht op te leggen als bedoeld in
      [artikel 70 van de wet][ref11].


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0009092#Artikel14a
      [ref3]: https://wetten.overheid.nl/BWBR0009092#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0009092#Artikel21
      [ref5]: https://wetten.overheid.nl/BWBR0009092#Artikel24a
      [ref6]: https://wetten.overheid.nl/BWBR0009092#Artikel26
      [ref7]: https://wetten.overheid.nl/BWBR0009092#Artikel25a
      [ref8]: https://wetten.overheid.nl/BWBR0009092#Artikel26
      [ref9]: https://wetten.overheid.nl/BWBR0009092#Artikel26
      [ref10]: https://wetten.overheid.nl/BWBR0009092#Artikel34
      [ref11]: https://wetten.overheid.nl/BWBR0003994#Artikel70
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel27
