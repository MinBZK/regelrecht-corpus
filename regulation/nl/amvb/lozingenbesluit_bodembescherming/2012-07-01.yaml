      - id: ref11
        bwb_id: BWBR0003994
        artikel: '70'
  - number: '27.2'
    text: 'Een verzoek als bedoeld in het eerste lid bevat:'
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel27
  - number: 27.2.a
    text: de vermelding van de naam en het adres van de aanvrager en de rechthebbenden;
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel27
  - number: 27.2.b
    text: de vermelding van de plaats waar het onderzoek moet plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel27
  - number: 27.2.c
    text: de vermelding van de aard, de omvang en het tijdstip van het voorgenomen onderzoek;
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel27
  - number: 27.2.d
    text: de vermelding van de handelingen die de rechthebbenden in het belang van het onderzoek moeten nalaten.
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel27
  - number: '27.3'
    text: |-
      Het bevoegd gezag kan, indien een verzoek als bedoeld in het eerste lid is gedaan, de rechthebbenden ten aanzien
      van het betrokken gedeelte van de bodem de in dat lid bedoelde verplichting opleggen.
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel27
  - number: '28.1'
    text: |-
      Het bestuursorgaan dat in het gebied waar de lozing in de bodem geheel of gedeeltelijk plaatsvindt of zal
      plaatsvinden, bevoegd is tot verlening van vergunning krachtens [artikel 6.2 van de Waterwet][ref1], wordt in
      de gelegenheid gesteld advies uit te brengen omtrent het ontwerp van de beschikking op de aanvraag om ontheffing
      krachtens de [artikelen 14][ref2], [24][ref3], en [25][ref4], en omtrent het voorlopige voornemen tot het
      geven van een beschikking krachtens [artikel 66 van de wet][ref5], anders dan op verzoek van de houder van
      de ontheffing, alsmede omtrent een beslissing tot afwijken van in dit besluit gestelde verboden krachtens de
      [artikelen 14a][ref6], [24a][ref7], en [25a][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0009092#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0009092#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0009092#Artikel25
      [ref5]: https://wetten.overheid.nl/BWBR0003994
      [ref6]: https://wetten.overheid.nl/BWBR0009092#Artikel14a
      [ref7]: https://wetten.overheid.nl/BWBR0009092#Artikel24a
      [ref8]: https://wetten.overheid.nl/BWBR0009092#Artikel25a
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0009092
        artikel: '14'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0009092
        artikel: '24'
        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0009092
        artikel: '25'
        hoofdstuk: IV
      - id: ref5
        bwb_id: BWBR0003994
      - id: ref6
        bwb_id: BWBR0009092
        artikel: 14a
        hoofdstuk: III
        paragraaf: '1'
      - id: ref7
        bwb_id: BWBR0009092
        artikel: 24a
        hoofdstuk: IV
      - id: ref8
        bwb_id: BWBR0009092
        artikel: 25a
        hoofdstuk: IV
  - number: '28.2'
    text: |-
      Indien burgemeester en wethouders van een gemeente waar de lozing in de bodem plaatsvindt of zal plaatsvinden,
      ingevolge [artikel 3][ref1] niet het bevoegd gezag zijn worden zij in de gelegenheid gesteld advies uit te brengen
      omtrent de onderwerpen bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel3
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0009092
        artikel: '3'
        hoofdstuk: I
  - number: '29'
    text: |-
      In gevallen waarin een verzoek om ontheffing of afwijking als bedoeld in de [artikelen 14][ref1], [24][ref2]
      of [25][ref3], onderscheidenlijk [14a][ref4], [24a][ref5] of [25a][ref6] wordt ingediend, waarbij het lozen
      in de bodem gevolgen kan hebben voor de hoedanigheden van de bodem van een andere lidstaat van de Europese
      Gemeenschappen, wordt desgevraagd met de betrokken lidstaat overleg gevoerd alvorens ontheffing wordt verleend, of
      afwijking wordt toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0009092#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0009092#Artikel25
      [ref4]: https://wetten.overheid.nl/BWBR0009092#Artikel14a
      [ref5]: https://wetten.overheid.nl/BWBR0009092#Artikel24a
      [ref6]: https://wetten.overheid.nl/BWBR0009092#Artikel25a
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0009092
        artikel: '14'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009092
        artikel: '24'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0009092
        artikel: '25'
        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0009092
        artikel: 14a
        hoofdstuk: III
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0009092
        artikel: 24a
        hoofdstuk: IV
      - id: ref6
        bwb_id: BWBR0009092
        artikel: 25a
        hoofdstuk: IV
  - number: '30.1'
    text: |-
      Het bevoegd gezag kan, ten aanzien van de voorschriften, bedoeld in [de artikelen 14, derde lid][ref1],
      [15 tot en met 19][ref2], [21, tweede lid, onder d, en 23 en 26, eerste lid][ref3], nadere eisen stellen. Degene
      tot wie een nadere eis wordt gericht, is verplicht daaraan te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0009092#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0009092#Artikel21
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0009092
        artikel: '14'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009092
        artikel: '15'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0009092
        artikel: '21'
        hoofdstuk: III
        paragraaf: '2'
  - number: '30.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van voorschriften, gesteld krachtens de
      [artikelen 14a, tweede lid][ref1], [24a, tweede lid][ref2], of [25a, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel14a
      [ref2]: https://wetten.overheid.nl/BWBR0009092#Artikel24a
      [ref3]: https://wetten.overheid.nl/BWBR0009092#Artikel25a
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0009092
        artikel: 14a
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009092
        artikel: 24a
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0009092
        artikel: 25a
        hoofdstuk: IV
  - number: '33.1'
    text: |-
      De [artikelen 11][ref1], [13][ref2], [21][ref3] juncto [15 tot en met 18][ref4], [22][ref5] en [23][ref6] zijn niet
      van toepassing gedurende drie jaar na 1 juli 1990.


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0009092#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0009092#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0009092#Artikel15
      [ref5]: https://wetten.overheid.nl/BWBR0009092#Artikel22
      [ref6]: https://wetten.overheid.nl/BWBR0009092#Artikel23
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0009092
        artikel: '11'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0009092
        artikel: '13'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0009092
        artikel: '21'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0009092
        artikel: '15'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0009092
        artikel: '22'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0009092
        artikel: '23'
        hoofdstuk: III
        paragraaf: '2'
  - number: '33.2'
    text: |-
      De [artikelen 24 tot en met 26][ref1] zijn, voor zover deze betrekking hebben op bestaande lozingen in de bodem,
      niet van toepassing gedurende twee jaar na 1 juli 1990.


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel24
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0009092
        artikel: '24'
        hoofdstuk: IV
  - number: '33.3'
    text: |-
      Indien binnen de in het tweede lid bedoelde periode een verzoek om ontheffing als bedoeld in [artikel 24][ref1] of
      [artikel 25][ref2] is ingediend, gelden de onderscheidenlijk in die artikelen gestelde verboden niet tot 3 maanden
      nadat het besluit, waarbij op dat verzoek is beslist, van kracht is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0009092#Artikel25
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0009092
        artikel: '24'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0009092
        artikel: '25'
        hoofdstuk: IV
  - number: '33.4'
    text: |-
      De [artikelen 25][ref1] en [26][ref2] zijn gedurende twee jaar na 1 juli 1990 niet van toepassing met betrekking
      tot lozingen in de bodem tengevolge van de substraatteelt binnen inrichtingen, die tot een in het Hinderbesluit
      (Stb. 1980, 445) aangewezen categorie behoren.


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0009092#Artikel26
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0009092
        artikel: '25'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0009092
        artikel: '26'
        hoofdstuk: IV
  - number: '34.1'
    text: |-
      Degene die een omvangrijke bestaande lozing van huishoudelijk afvalwater in de bodem uitvoert, die voldoet aan de
      vereisten vermeld in [artikel 21, tweede lid, onder a en b][ref1], dient binnen drie jaar na 1 juli 1990:


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel21
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0009092
        artikel: '21'
        hoofdstuk: III
        paragraaf: '2'
  - number: 34.1.a
    text: |-
      een onderzoek, verricht met grondboringen, overeenkomstig door Onze Minister vast te stellen regels, te doen
      uitvoeren naar de gemiddeld hoogste grondwaterstand ter plaatse van de lozing in de bodem en de dimensionering van
      de infiltratievoorziening en
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel34
  - number: 34.1.b
    text: van deze lozing in de bodem een kennisgeving te doen aan het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel34
  - number: '34.2'
    text: |-
      Bij een kennisgeving als bedoeld in het eerste lid worden de gegevens verstrekt, die in de bij dit besluit
      behorende [bijlage II][ref1] zijn aangegeven. De kennisgeving wordt gedaan op een formulier waarvan het model
      wordt vastgesteld door Onze Minister. Onze Minister kan daarbij nadere regels stellen met betrekking tot de in
      [bijlage II][ref2] bedoelde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0009092
      [ref2]: https://wetten.overheid.nl/BWBR0009092
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0009092
      - id: ref2
        bwb_id: BWBR0009092
  - number: '35'
    text: |-
      Na de inwerkingtreding van dit besluit worden de krachtens het Lozingenbesluit bodembescherming (Stb. 1990, 217)
      vastgestelde regels en andere besluiten gelijkgesteld met regels onderscheidenlijk besluiten, vastgesteld met
      toepassing van dit besluit.
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel35
  - number: '36'
    text: Het Lozingenbesluit bodembescherming (Stb. 1990, 217) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel36
  - number: '37'
    text: |-
      Dit besluit treedt in werking met ingang van de dag waarop vier weken zijn verstreken sedert de dag van uitgifte
      van het Staatsblad waarin het wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel37
  - number: '38'
    text: 'Dit besluit wordt aangehaald als: Lozingenbesluit bodembescherming.'
    url: https://wetten.overheid.nl/BWBR0009092/2012-07-01#Artikel38
