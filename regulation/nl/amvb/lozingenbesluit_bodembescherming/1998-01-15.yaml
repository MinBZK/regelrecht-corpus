  - number: '18'
    text: |-
      1 Degene die een lozing in de bodem als bedoeld in [artikel 14][ref1] uitvoert, moet het zuiveringssysteem vóór
      in gebruikname en vervolgens tenminste eenmaal per twee jaar, door een deskundig bedrijf doen keuren op de goede
      werking ervan.

      2 Bij regeling van Onze Minister kunnen nadere regels worden gesteld omtrent de in het eerste lid genoemde keuring
      en het deskundig bedrijf.

      3 De schriftelijke resultaten van een keuring als bedoeld in het eerste lid moeten door degene die de lozing in de
      bodem uitvoert gedurende ten minste vijf jaar worden bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel14
    url: https://wetten.overheid.nl/BWBR0009092/1998-01-15#Artikel18
