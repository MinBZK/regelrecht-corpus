  - number: '17'
    text: |-
      Met betrekking tot zuiveringssystemen bedoeld in [artikel 15][ref1] en infiltratievoorzieningen bedoeld in
      [artikel 16][ref2] zijn de [artikelen 7 tot met 9][ref3] van overeenkomstige toepassing.


