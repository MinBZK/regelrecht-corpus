articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:








                  wet:


                  de [Wet bodembescherming][ref1];








                  lozing in de bodem:


                  het definitief in de bodem brengen of doen brengen van vloeistoffen;








                  bestaande lozing in de bodem:


                  lozing in de bodem die voor 1 juli 1990 regelmatig plaatsvond in het kader van een op die datum reeds
      bestaande activiteit en waarvan het aantal lozingseenheden - indien het een omvangrijke lozing van huishoudelijk
      afvalwater in de bodem betreft - sedert 1 juli 1990 met ten hoogste 20 procent is toegenomen;








                  gemiddeld hoogste grondwaterstand:


                  het gemiddeld hoogste niveau van de grondwaterstand gemeten over een tijdvak van ten minste 8 jaar;








                  riolering:


                  een gemeentelijk rioolstelsel;








                  woonruimte:


                  een ruimte die blijkens haar inrichting bestemd is als een afzonderlijk geheel te voorzien in
      woongelegenheid;








                  lozingseenheid:


                  berekeningseenheid voor de hoeveelheid huishoudelijk afvalwater die per dag in de bodem wordt geloosd;








                  beperkte lozing in de bodem:


                  lozing in de bodem van 10 lozingseenheden of minder per dag;








                  omvangrijke lozing in de bodem:


                  lozing in de bodem van meer dan 10 lozingseenheden per dag;








                  huishoudelijk afvalwater:


                  afvalwater afkomstig van particuliere huishoudens en ander afvalwater dat naar zijn aard en
      samenstelling overeenkomt met afvalwater afkomstig van een particulier huishouden;








                  koelwater:


                  water dat uitsluitend is gebruikt voor koelingsdoeleinden, indien daaraan geen verontreinigende stoffen
      zijn toegevoegd en de concentratie van verontreinigende stoffen in het water niet door een bewerking van het water
      is toegenomen;








                  overige vloeistoffen:


                  vloeistoffen niet zijnde huishoudelijk afvalwater of koelwater.


      [ref1]: https://wetten.overheid.nl/BWBR0003994
    url: https://wetten.overheid.nl/BWBR0009092/1998-01-15#Artikel1
