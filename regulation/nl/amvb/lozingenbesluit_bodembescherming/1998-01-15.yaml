  - number: '29'
    text: |-
      Als betrokken bestuursorgaan, bedoeld in [artikel 8.7, eerste lid, onder c, van de Wet milieubeheer][ref1]
      wordt, voor de gevallen waarin een verzoek om ontheffing of afwijking als bedoeld in de [artikelen 14][ref2],
      [24][ref3] of [25][ref4], onderscheidenlijk [14a][ref5], [24a][ref6] of [25a][ref7] wordt ingediend, waarbij het
      lozen in de bodem gevolgen kan hebben voor de hoedanigheden van de bodem van een andere lid-staat van de Europese
      Gemeenschappen, tevens die andere lid-staat aangewezen. Met de betrokken lid-staat wordt, desgevraagd, alvorens
      ontheffing wordt verleend, of afwijking wordt toegestaan, overleg gevoerd.


