    text: |-
      1 Behoudens het bepaalde in het tweede tot en met het vijfde lid zijn voor de toepassing van dit besluit
      burgemeester en wethouders van de gemeente waar de lozing in de bodem plaatsvindt, het bevoegd gezag.

      2 Gedeputeerde staten van de provincie waar een lozing in de bodem plaatsvindt, zijn het bevoegd gezag, indien het
      een lozing in de bodem betreft:

      a. binnen een inrichting die is aangewezen krachtens
      [artikel 1.1, derde of vijfde lid, van de Wet milieubeheer][ref1] en waarvoor krachtens artikel 8.2, tweede lid,
      van die wet, gedeputeerde staten voor de vergunningverlening krachtens die wet bevoegd gezag zijn;

      b. van grondwater dat ter plaatse is onttrokken krachtens een vergunning als bedoeld in
      [artikel 14 van de Grondwaterwet][ref2];

      c. die plaatsvindt op een diepte van meer dan 10 meter beneden het maaiveld en ten aanzien waarvan niet ingevolge
      het vierde lid Onze Minister van Economische Zaken het bevoegd gezag is.

      3 Onze Minister is het bevoegd gezag, indien het een lozing in de bodem betreft binnen een inrichting die is
      aangewezen krachtens [artikel 1.1, derde lid, van de Wet milieubeheer][ref3] en waarvoor krachtens artikel 8.2,
      tweede lid, van die wet, Onze Minister voor de vergunningverlening krachtens die wet bevoegd gezag is.

      4 Onze Minister van Economische Zaken is het bevoegd gezag, indien:

      a. het een lozing in de bodem betreft binnen een inrichting die is aangewezen krachtens
      [artikel 1.1, derde lid, van de Wet milieubeheer][ref4] en waarvoor krachtens artikel 8.2, derde lid, van die wet,
      Onze Minister van Economische Zaken voor de vergunningverlening krachtens die wet bevoegd gezag is;

      b. het een lozing in de bodem betreft als bedoeld in [artikel 1a][ref5].

      5 Met betrekking tot een lozing in de bodem in een gebied dat niet deel uitmaakt van een provincie, is het
      bestuursorgaan dat is aangewezen krachtens [artikel 21.5 van de Wet milieubeheer][ref6], het bevoegd gezag en
      worden de door dit gezag daartoe aan te wijzen ambtenaren belast met het toezicht op de naleving van het bij of
      krachtens dit besluit bepaalde.


