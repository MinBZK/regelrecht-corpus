  - number: '23'
    text: |-
      Ter zake van het definitief beëindigen van een lozing in de bodem als bedoeld in [artikel 21][ref1] is
      [artikel 19][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0009092#Artikel19
