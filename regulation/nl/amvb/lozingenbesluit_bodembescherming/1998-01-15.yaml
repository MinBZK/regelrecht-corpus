  - number: '7'
    text: |-
      1 Een zuiveringssysteem, een infiltratievoorziening alsmede de daarbij behorende leidingen moeten van een zodanige
      constructie zijn en van zodanige materialen zijn vervaardigd, dat zij duurzaam bestand zijn tegen vervorming en
      corrosie.

      2 Een zuiveringssysteem, een infiltratievoorziening alsmede de daarbij behorende leidingen moeten zodanig zijn
      aangelegd en uitgevoerd dat:

      a. zij te allen tijde bereikbaar zijn,

      b. alle onderdelen gemakkelijk te herstellen en te vervangen zijn en

      c. alle vorstgevoelige onderdelen tegen vorst zijn beschermd.

      3 Een infiltratievoorziening en de afgesloten onderdelen van een zuiveringssysteem moeten zodanig zijn uitgevoerd,
      dat een voldoende en ongehinderde afvoer van gevormde gassen kan plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0009092/1998-01-15#Artikel7
  - number: '8'
    text: |-
      1 Een zuiveringssysteem en de daarmee verbonden leidingen moeten vloeistofdicht zijn uitgevoerd en moeten
      vloeistofdicht zijn verbonden met een infiltratievoorziening.

      2 Een zuiveringssysteem en een infiltratievoorziening moeten in dimensionering en uitvoering op elkaar zijn
      afgestemd.

      3 Onze Minister stelt nadere regels met betrekking tot zuiveringssystemen en infiltratievoorzieningen.
    url: https://wetten.overheid.nl/BWBR0009092/1998-01-15#Artikel8
  - number: '9'
    text: |-
      Zuiveringssystemen en infiltratievoorzieningen moeten, zolang zij in gebruik zijn voor lozingen in de bodem,
      zodanig worden onderhouden, dat hun goede werking gewaarborgd is.
    url: https://wetten.overheid.nl/BWBR0009092/1998-01-15#Artikel9
  - number: '10'
    text: |-
      Indien een beperkte lozing van huishoudelijk afvalwater in de bodem definitief wordt beëindigd, moeten het
      zuiveringssysteem en de infiltratievoorziening worden verwijderd, of na volledige verwijdering van het erin
      aanwezige slib, worden opgevuld met schoon bodemmateriaal.
    url: https://wetten.overheid.nl/BWBR0009092/1998-01-15#Artikel10
  - number: 10a
    text: |-
      1 Bij een aanvraag om een ontheffing als bedoeld in [artikel 5, derde lid][ref1], worden de gegevens verstrekt
      die in de bij dit besluit behorende [bijlage I][ref2] zijn aangegeven. Onze Minister kan nadere regels stellen met
      betrekking tot de te verstrekken gegevens.

      2 Het eerste lid is van overeenkomstige toepassing op een aanvraag om een vergunning als bedoeld in
      [artikel 5a][ref3].


