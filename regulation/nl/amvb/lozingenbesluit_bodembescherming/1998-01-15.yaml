  - number: 1a
    text: |-
      Dit besluit is mede van toepassing op een lozing in de bodem:

      a. binnen bij een mijn behorende ondergronds gelegen werken of inrichtingen, waarop de [Mijnwet 1903][ref1] van
      toepassing is;

      b. binnen werken of inrichtingen, waarop de [Mijnwet continentaal plat][ref2] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0001870
      [ref2]: https://wetten.overheid.nl/BWBR0002504
    url: https://wetten.overheid.nl/BWBR0009092/1998-01-15#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0001870
      - id: ref2
        bwb_id: BWBR0002504
  - number: '2'
    text: |-
      1 Dit besluit is niet van toepassing op een lozing in de bodem:

      a. van oppervlaktewater, indien daaraan, na de onttrekking, geen verontreinigende stoffen zijn toegevoegd,
      de concentratie van verontreinigende stoffen niet door een bewerking is toegenomen en daaraan geen warmte is
      toegevoegd;

      b. van hemelwater of drinkwater, indien daaraan geen verontreinigende stoffen zijn toegevoegd, de concentratie van
      verontreinigende stoffen niet door een bewerking is toegenomen en daaraan geen warmte is toegevoegd;

      c. van ter plaatse opgepompt grondwater in dezelfde laag als waar het werd opgepompt, indien daaraan, na de
      onttrekking, geen verontreinigende stoffen zijn toegevoegd, de concentratie van verontreinigende stoffen niet door
      een bewerking is toegenomen en daaraan geen warmte is toegevoegd;

      d. indien het een beregenen, bevloeien of besproeien met uitsluitend grondwater betreft met het oog op:

      1. de vochtvoorziening van gewassen;

      2. het schoonmaken van gewassen op het veld;

      3. het voorkomen van verstuiving van op de bodem gebrachte materialen;

      e. via een vloeiveld, bezinkveld, biezenveld of rietveld;

      f. indien het water betreft afkomstig van het reinigen van voertuigen op landbouwbedrijven, die niet zijn gebruikt
      voor het toepassen van bestrijdingsmiddelen;

      g. bij het stomen van de bodem met het oog op de bestrijding van ziekten en plagen;

      h. voor zover sprake is van [artikel 15, eerste, dan wel tweede lid, van de Wet op de openluchtrecreatie][ref1];

      i. indien het een opspuiten van terreinen betreft met het oog op het bouwrijp maken daarvan;

      j. ten behoeve van het realiseren van een boorgat binnen een werk of inrichting als bedoeld in de
      [Mijnwet 1903][ref2] (Stb. 1904, 73);

      k. voor zover het plaatsvindt in het kader van een toediening van kunstmeststoffen met het oog op de
      gewasproduktie.

      2 Dit besluit is voorts niet van toepassing op een lozing in de bodem:

      a. binnen inrichtingen waarvoor ingevolge een besluit op grond van [artikel 8.40][ref3] of
      [8.44 van de Wet milieubeheer][ref4] ter zake van lozingen in de bodem in het belang van de bescherming van de
      bodem voorschriften gelden;

      b. voor zover daaromtrent in het belang van de bescherming van de bodem voorschriften gelden die krachtens
      [artikel 7][ref5] van de wet zijn gesteld met betrekking tot het gebruik van dierlijke mest of zuiveringsslib.


      [ref1]: https://wetten.overheid.nl/BWBR0006548#Artikel15
