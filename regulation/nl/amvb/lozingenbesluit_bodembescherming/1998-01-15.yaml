  - number: '25'
    text: |-
      1 Het is verboden een lozing van overige vloeistoffen in de bodem uit te voeren.

      2 Het bevoegd gezag kan, voor een lozing in de bodem anders dan binnen een inrichting waarvoor een vergunning als
      bedoeld in [artikel 8.1 van de Wet milieubeheer][ref1] is vereist, op daartoe strekkende aanvraag, voor een door
      hem vast te stellen termijn van ten hoogste vier jaar, ontheffing verlenen van het in het eerste lid bedoelde
      verbod, indien wordt aangetoond dat:

      a. een aansluiting op de riolering of een andere wijze van afvoer van de vloeistof niet mogelijk is en

      b. in de overige vloeistoffen geen stoffen voorkomen als bedoeld in de bij dit besluit behorende
      [bijlage III][ref2], of deze stoffen daarin voorkomen met een - wat betreft de stoffen van lijst I zodanig
      geringe toxiciteit, persistentie en (bio)accumulatie, of - wat betreft de stoffen van lijst II - zodanig geringe
      schadelijke werking dat ook op de lange termijn geen gevaar voor verontreiniging van de bodem bestaat.

      3 Een besluit inzake een ontheffing waaromtrent ingevolge [artikel 3, vierde lid][ref3], Onze Minister van
      Economische Zaken dient te beslissen, wordt niet genomen dan in overeenstemming met Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8.1
      [ref2]: https://wetten.overheid.nl/BWBR0009092
      [ref3]: https://wetten.overheid.nl/BWBR0009092#Artikel3
