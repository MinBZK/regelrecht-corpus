  - number: '11'
    text: |-
      1 Het is verboden een bestaande beperkte lozing van huishoudelijk afvalwater in de bodem uit te voeren.

      2 Het verbod geldt niet indien de afstand van het dichtstbijzijnde gebouw waar het huishoudelijk afvalwater
      vrijkomt tot de dichtstbijzijnde riolering meer is dan 40 meter.

      3 De afstand tot de dichtstbijzijnde riolering als bedoeld in het tweede en vierde lid wordt berekend langs de
      kortste lijn waar de afvoerleidingen zonder overwegende bezwaren kunnen worden aangelegd.

      4 [Artikel 5, derde lid][ref1], is ten aanzien van het in het eerste lid bedoelde verbod van overeenkomstige
      toepassing, met dien verstande dat het in [artikel 5, derde lid, onder a][ref2], gestelde voor de toepassing van
      dit lid wordt vervangen door: de afstand van het dichtstbijzijnde gebouw waar het huishoudelijk afvalwater vrijkomt
      tot de dichtstbijzijnde riolering 40 meter of minder is.


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009092#Artikel5
