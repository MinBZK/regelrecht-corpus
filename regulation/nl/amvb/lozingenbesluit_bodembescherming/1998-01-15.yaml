  - number: '26'
    text: |-
      1 Aan een ontheffing als bedoeld in de [artikelen 24][ref1] en [25][ref2] worden ten minste voorschriften verbonden
      met betrekking tot:

      a. de wijze waarop en de frequentie waarmee onderzoek moet worden verricht naar de samenstelling van de vloeistof
      die in de bodem wordt geloosd en naar de hoedanigheden van de bodem ter plaatse,

      b. de samenstelling en de hoeveelheid van de vloeistof die in de bodem wordt geloosd,

      c. de wijze waarop de lozing in de bodem plaats moet vinden en

      d. voor zover het geen lozing in de bodem van koelwater betreft, de wijze van definitieve beëindiging van de lozing
      in de bodem.

      2 Bij een aanvraag om een ontheffing worden de gegevens verstrekt die in de bij dit besluit behorende
      [bijlage I][ref3] zijn aangegeven.

      Onze Minister kan nadere regels stellen met betrekking tot de te verstrekken gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0009092#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0009092
