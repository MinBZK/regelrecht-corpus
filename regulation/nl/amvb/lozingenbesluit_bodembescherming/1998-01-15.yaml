  - number: '21'
    text: |-
      1 Het is verboden een omvangrijke bestaande lozing van huishoudelijk afvalwater in de bodem uit te voeren.

      2 Het verbod geldt niet indien:

      a. de afstand van het dichtstbijzijnde gebouw waar het huishoudelijk afvalwater vrijkomt tot de dichtstbijzijnde
      riolering, afhankelijk van het aantal lozingseenheden, ten minste bedraagt:

        - tot 25 lozingseenheden 100 meter
        - van 25 tot 50 lozingseenheden 600 meter
        - van 50 tot 100 lozingseenheden 1500 meter
        - van 100 tot en met 200 lozingseenheden 3000 meter,

      b. het een lozing in de bodem betreft van ten hoogste 200 lozingseenheden,

      c. uit een onderzoek, verricht met grondboringen, uitgevoerd overeenkomstig door Onze Minister vast te stellen
      regels, de gemiddeld hoogste grondwaterstand ter plaatse van de lozing in de bodem en de dimensionering van de
      infiltratievoorziening is vastgesteld en

      d. wordt voldaan aan de voorschriften, vermeld in de [artikelen 15 tot en met 18][ref1], en de krachtens
      [artikel 30][ref2] gestelde nadere eisen.

      3 Het bevoegd gezag kan op een daartoe strekkende aanvraag voor een door hem vast te stellen termijn, gebaseerd
      op het nog niet verstreken deel van een redelijke afschrijvingstermijn van de bij de aanleg van de riolering
      reeds bestaande zuiveringssystemen, bedoeld in [artikel 15][ref3], en de infiltratievoorziening, bedoeld in
      [artikel 16][ref4], ontheffing verlenen van het in het eerste lid bedoelde verbod, indien:

      a. de afstand van het dichtstbijzijnde gebouw waar het huishoudelijk afvalwater vrijkomt tot de dichtstbijzijnde
      riolering kleiner is dan de afstand die ingevolge het tweede lid, onder a, vereist is, en

      b. wordt voldaan aan het tweede lid, onder b, c en d.

      4 [Artikel 20][ref5] is op een aanvraag om een ontheffing als bedoeld in het derde lid van overeenkomstige
      toepassing.

      5 Voor de toepassing van het tweede en derde lid wordt de afstand tot de dichtstbijzijnde riolering berekend langs
      de kortste lijn waar de afvoerleidingen zonder overwegende bezwaren kunnen worden aangelegd.


