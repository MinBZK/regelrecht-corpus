  - number: '6'
    text: |-
      1 Voorafgaand aan een lozing in de bodem als bedoeld in [artikel 5][ref1] moet het huishoudelijk afvalwater door
      een zuiveringssysteem bestaande uit een septic tank worden geleid.

      2 Een lozing in de bodem als bedoeld in [artikel 5][ref2] moet worden uitgevoerd in een zakput, infiltratiebed,
      infiltratiekanaal, dan wel opgehoogd infiltratiebed.

      3 De onderzijde van een infiltratievoorziening als bedoeld in het tweede lid moet boven de gemiddeld hoogste
      grondwaterstand zijn gelegen.

      4 Voorafgaande aan de lozing in de bodem moet door middel van een onderzoek, uitgevoerd overeenkomstig door
      Onze Minister vast te stellen regels, de gemiddeld hoogste grondwaterstand ter plaatse van de lozing en de
      dimensionering van de infiltratievoorziening zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009092#Artikel5
    url: https://wetten.overheid.nl/BWBR0009092/1998-01-15#Artikel6
