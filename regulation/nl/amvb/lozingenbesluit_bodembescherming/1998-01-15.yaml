  - number: 25a
    text: |-
      1 Ten aanzien van een lozing in de bodem binnen een inrichting waarvoor een vergunning als bedoeld in
      [artikel 8.1 van de Wet milieubeheer][ref1] is vereist, kan het bestuursorgaan dat bevoegd is een vergunning
      krachtens de [Wet milieubeheer][ref2] te verlenen, bij die vergunning bepalen dat, in afwijking van het verbod,
      bedoeld in [artikel 25, eerste lid][ref3], een lozing in de bodem is toegestaan in gevallen als bedoeld in
      [artikel 25, tweede lid, onder a en b][ref4], voor een door hem vast te stellen termijn van ten hoogste vier jaar.

      2 [Artikel 25, derde lid][ref5], en [artikel 26][ref6] zijn van overeenkomstige toepassing.


