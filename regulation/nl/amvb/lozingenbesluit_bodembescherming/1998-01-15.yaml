        artikel: '19'
        hoofdstuk: III
        paragraaf: '1'
  - number: '24'
    text: |-
      1 Het is verboden een lozing van koelwater in de bodem uit te voeren.

      2 Het bevoegd gezag kan, voor een lozing in de bodem anders dan binnen een inrichting waarvoor een vergunning als
      bedoeld in [artikel 8.1 van de Wet milieubeheer][ref1] is vereist, op daartoe strekkende aanvraag voor een door hem
      vast te stellen termijn van ten hoogste tien jaar, ontheffing verlenen van het in het eerste lid bedoelde verbod.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8.1
    url: https://wetten.overheid.nl/BWBR0009092/1998-01-15#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8.1'
  - number: 24a
    text: |-
      1 Ten aanzien van een lozing in de bodem binnen een inrichting waarvoor een vergunning als bedoeld in
      [artikel 8.1 van de Wet milieubeheer][ref1] is vereist, kan het bestuursorgaan dat bevoegd is een vergunning
      krachtens de [Wet milieubeheer][ref2] te verlenen, bij die vergunning bepalen dat, in afwijking van het verbod,
      bedoeld in [artikel 24, eerste lid][ref3], een lozing in de bodem is toegestaan voor een door hem vast te stellen
      termijn van ten hoogste tien jaar.

      2 [Artikel 26][ref4] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8.1
      [ref2]: https://wetten.overheid.nl/BWBR0003245
      [ref3]: https://wetten.overheid.nl/BWBR0009092#Artikel24
