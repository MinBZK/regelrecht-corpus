      1 De [artikelen 11][ref1], [13][ref2], [21][ref3] juncto [15 tot en met 18][ref4], [22][ref5] en [23][ref6] zijn
      niet van toepassing gedurende drie jaar na 1 juli 1990.

      2 De [artikelen 24 tot en met 26][ref7] zijn, voor zover deze betrekking hebben op bestaande lozingen in de bodem,
      niet van toepassing gedurende twee jaar na 1 juli 1990.

      3 Indien binnen de in het tweede lid bedoelde periode een verzoek om ontheffing als bedoeld in [artikel 24][ref8]
      of [artikel 25][ref9] is ingediend, gelden de onderscheidenlijk in die artikelen gestelde verboden niet tot 3
      maanden nadat het besluit, waarbij op dat verzoek is beslist, van kracht is geworden.

      4 De [artikelen 25][ref10] en [26][ref11] zijn gedurende twee jaar na 1 juli 1990 niet van toepassing met
      betrekking tot lozingen in de bodem tengevolge van de substraatteelt binnen inrichtingen, die tot een in het
      Hinderbesluit (Stb. 1980, 445) aangewezen categorie behoren.


