  - number: 5a
    text: |-
      1 Ten aanzien van een lozing in de bodem binnen een inrichting waarvoor een vergunning als bedoeld in
      [artikel 8.1 van de Wet milieubeheer][ref1] is vereist, kan het bestuursorgaan dat bevoegd is een vergunning
      krachtens de [Wet milieubeheer][ref2] te verlenen, bij de vergunning bepalen dat in afwijking van het
      verbod, bedoeld in [artikel 5, eerste lid][ref3], een lozing in de bodem is toegestaan indien het in
      [artikel 5, derde lid][ref4], bedoelde geval zich binnen de inrichting voordoet.

      2 [Artikel 5, vierde lid][ref5], en de [artikelen 6 tot en met 9][ref6] zijn van overeenkomstige toepassing.


