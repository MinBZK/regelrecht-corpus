  - number: '22'
    text: |-
      1 Degene die een lozing in de bodem als bedoeld in [artikel 21][ref1] uitvoert en die voornemens is de gebezigde
      lozingswijze te wijzigen, geeft hiervan zo spoedig mogelijk kennis aan het bevoegd gezag.

      2 Bij een kennisgeving als bedoeld in het eerste lid worden de gegevens verstrekt die in de bij dit besluit
      behorende [bijlage II][ref2] zijn aangegeven. De kennisgeving wordt gedaan op een formulier waarvan het model
      wordt vastgesteld door Onze Minister. Onze Minister kan daarbij nadere regels stellen met betrekking tot de in
      [bijlage II][ref3] bedoelde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0009092
      [ref3]: https://wetten.overheid.nl/BWBR0009092
    url: https://wetten.overheid.nl/BWBR0009092/1998-01-15#Artikel22
    references:
