  - number: '27'
    text: |-
      1 Degene die ingevolge de uitvoering van de [artikelen 14, tweede lid][ref1], [14a, eerste lid][ref2],
      juncto [artikel 14, tweede lid][ref3], [21, tweede lid][ref4], [24a, tweede lid][ref5], juncto [26][ref6]
      en [25a, tweede lid][ref7], juncto [26][ref8], [26, eerste lid][ref9], dan wel [34, eerste lid][ref10],
      onderzoek dient te verrichten op of in een gedeelte van de bodem ten aanzien waarvan hem de nodige bevoegdheid
      ontbreekt, kan het bevoegd gezag verzoeken de rechthebbenden een gedoogplicht op te leggen als bedoeld in
      [artikel 70 van de wet][ref11].

      2 Een verzoek als bedoeld in het eerste lid bevat:

      a. de vermelding van de naam en het adres van de aanvrager en de rechthebbenden;

      b. de vermelding van de plaats waar het onderzoek moet plaatsvinden;

      c. de vermelding van de aard, de omvang en het tijdstip van het voorgenomen onderzoek;

      d. de vermelding van de handelingen die de rechthebbenden in het belang van het onderzoek moeten nalaten.

      3 Het bevoegd gezag kan, indien een verzoek als bedoeld in het eerste lid is gedaan, de rechthebbenden ten aanzien
      van het betrokken gedeelte van de bodem de in dat lid bedoelde verplichting opleggen.


