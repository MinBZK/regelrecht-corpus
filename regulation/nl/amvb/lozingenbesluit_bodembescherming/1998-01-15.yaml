  - number: '4'
    text: |-
      1 Voor de berekening van het aantal lozingseenheden van een lozing van huishoudelijk afvalwater in de bodem wordt
      voor de toepassing van dit besluit uitgegaan van:

      a. 3 lozingseenheden voor een woonruimte;

      b. 1 lozingseenheid per slaapplaats voor een hotel, pension, kazerne, ziekenhuis, internaat en daarmee gelijk te
      stellen instellingen;

      c. 7 lozingseenheden voor zover een vrijstelling is verleend op grond van
      [artikel 8, tweede lid, aanhef en onder a, van de Wet op de openluchtrecreatie][ref1] en 4 lozingseenheden voor
      zover een vrijstelling is verleend op grond van [artikel 8, tweede lid, aanhef en onder b of c, van die wet][ref2];

      d. 1 lozingseenheid per 50 m3 water dat jaarlijks wordt gebruikt in de overige gevallen.

      2 Indien meer dan 20 procent van het gebruikte water niet in de bodem wordt geloosd, of wordt geloosd op een wijze
      als bedoeld in [artikel 2][ref3], bepaalt het bevoegd gezag op daartoe strekkende aanvraag dat in afwijking van het
      bepaalde in het eerste lid, onder d, in plaats van de hoeveelheid gebruikt water wordt uitgegaan van de hoeveelheid
      geloosd water.


      [ref1]: https://wetten.overheid.nl/BWBR0006548#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0006548#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0009092#Artikel2
    url: https://wetten.overheid.nl/BWBR0009092/1998-01-15#Artikel4
