  - number: '34'
    text: |-
      1 Degene die een omvangrijke bestaande lozing van huishoudelijk afvalwater in de bodem uitvoert, die voldoet aan de
      vereisten vermeld in [artikel 21, tweede lid, onder a en b][ref1], dient binnen drie jaar na 1 juli 1990:

      a. een onderzoek, verricht met grondboringen, overeenkomstig door Onze Minister vast te stellen regels, te doen
      uitvoeren naar de gemiddeld hoogste grondwaterstand ter plaatse van de lozing in de bodem en de dimensionering van
      de infiltratievoorziening en

      b. van deze lozing in de bodem een kennisgeving te doen aan het bevoegd gezag.

      2 Bij een kennisgeving als bedoeld in het eerste lid worden de gegevens verstrekt, die in de bij dit besluit
      behorende [bijlage II][ref2] zijn aangegeven. De kennisgeving wordt gedaan op een formulier waarvan het model
      wordt vastgesteld door Onze Minister. Onze Minister kan daarbij nadere regels stellen met betrekking tot de in
      [bijlage II][ref3] bedoelde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0009092
      [ref3]: https://wetten.overheid.nl/BWBR0009092
    url: https://wetten.overheid.nl/BWBR0009092/1998-01-15#Artikel34
