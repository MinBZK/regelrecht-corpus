  - number: '15'
    text: |-
      1 Het huishoudelijk afvalwater moet, alvorens een lozing in de bodem als bedoeld in [artikel 14][ref1] plaatsvindt
      worden gezuiverd door middel van:

      a. een opgehoogd infiltratiebedsysteem,

      b. een opgehoogd filtratiebedsysteem,

      c. een zandfiltersysteem,

      d. een oxydatiebedsysteem of

      e. een biorotorsysteem.

      2 Bij toepassing van een opgehoogd infiltratiebed - een opgehoogd filtratiebed - dan wel een zandfiltersysteem moet
      het huishoudelijk afvalwater achtereenvolgens worden voorbehandeld en biologisch behandeld.

      3 Bij toepassing van een oxydatiebed - dan wel een biorotorsysteem moet het huishoudelijk afvalwater
      achtereenvolgens worden voorbehandeld, biologisch behandeld en nabehandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel14
    url: https://wetten.overheid.nl/BWBR0009092/1998-01-15#Artikel15
