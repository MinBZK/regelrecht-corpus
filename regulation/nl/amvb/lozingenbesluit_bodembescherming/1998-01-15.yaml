        hoofdstuk: III
        paragraaf: '1'
  - number: '16'
    text: |-
      1 Een lozing in de bodem als bedoeld in [artikel 14][ref1] dient te worden uitgevoerd in een zakput,
      infiltratiebed, infiltratiekanaal, dan wel opgehoogd infiltratiebed.

      2 De onderzijde van een infiltratievoorziening als bedoeld in het eerste lid moet boven de gemiddeld hoogste
      grondwaterstand zijn gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel14
