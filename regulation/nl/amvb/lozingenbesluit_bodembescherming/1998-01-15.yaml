  - number: 14a
    text: |-
      1 Ten aanzien van een lozing in de bodem binnen een inrichting waarvoor een vergunning als bedoeld in
      [artikel 8.1 van de Wet milieubeheer][ref1] is vereist, kan het bestuursorgaan dat bevoegd is een vergunning
      krachtens de [Wet milieubeheer][ref2] te verlenen, bij de vergunning bepalen dat in afwijking van het
      verbod, bedoeld in [artikel 14, eerste lid][ref3], een lozing in de bodem is toegestaan in gevallen
      als bedoeld in [artikel 14, tweede lid, onder a tot en met d][ref4], dan wel in gevallen als bedoeld in
      [artikel 14, vierde lid, onder a en b][ref5].

      2 Indien ingevolge het eerste lid een lozing in de bodem is toegestaan en het in [artikel 14, tweede lid][ref6],
      bedoelde geval zich binnen de inrichting voordoet, zijn [artikel 14, derde en vijfde lid][ref7], alsmede de
      [artikelen 15 tot en met 19][ref8] van overeenkomstige toepassing. Indien ingevolge het eerste lid een lozing in de
      bodem is toegestaan en het in [artikel 14, vierde lid][ref9], bedoelde geval zich binnen de inrichting voordoet, is
      [artikel 14, vijfde lid][ref10], van overeenkomstige toepassing.


