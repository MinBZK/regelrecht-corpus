  - number: '5'
    text: |-
      1 Het is verboden een beperkte lozing van huishoudelijk afvalwater in de bodem - niet zijnde een bestaande lozing
      in de bodem - uit te voeren.

      2 Het verbod geldt niet, indien de afstand van de kadastrale grens van het perceel waar het huishoudelijk
      afvalwater vrijkomt, tot de dichtstbijzijnde riolering meer is dan 40 meter en tevens wordt voldaan aan de
      [artikelen 6 tot en met 9][ref1].

      3 Het bevoegd gezag kan voor een lozing in de bodem, anders dan binnen een inrichting waarvoor een vergunning als
      bedoeld in [artikel 8.1 van de Wet milieubeheer][ref2] is vereist, op een daartoe strekkende aanvraag voor een
      door hem vast te stellen termijn, gebaseerd op het nog niet verstreken deel van een redelijke afschrijvingstermijn
      van het bij de aanleg van de riolering reeds bestaande zuiveringssysteem en van de bij die aanleg reeds bestaande
      infiltratievoorziening, ontheffing verlenen van het in het eerste lid bedoelde verbod, indien:

      a. de afstand van de kadastrale grens van het perceel waar het huishoudelijk afvalwater vrijkomt, tot de
      dichtstbijzijnde riolering 40 meter of minder is, en

      b. wordt voldaan aan de [artikelen 6 tot en met 9][ref3].

      4 Voor de toepassing van het tweede en derde lid wordt de afstand tot de dichtstbijzijnde riolering berekend langs
      de kortste lijn waar de afvoerleidingen zonder overwegende bezwaren kunnen worden aangelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0009092#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8.1
      [ref3]: https://wetten.overheid.nl/BWBR0009092#Artikel6
