  - number: '28'
    text: |-
      1 Het bestuursorgaan dat in het gebied waar de lozing in de bodem geheel of gedeeltelijk plaatsvindt of zal
      plaatsvinden, bevoegd is tot verlening van vergunning krachtens [artikel 3, tweede lid][ref1], onderscheidenlijk
      [artikel 6, eerste lid, van de Wet verontreiniging oppervlaktewateren][ref2], wordt in de gelegenheid gesteld
      advies uit te brengen omtrent het ontwerp van de beschikking op de aanvraag om ontheffing krachtens de
      [artikelen 14][ref3], [24][ref4], en [25][ref5], en omtrent het voorlopige voornemen tot het geven van een
      beschikking krachtens [artikel 66 van de wet][ref6], anders dan op verzoek van de houder van de ontheffing, alsmede
      omtrent een beslissing tot afwijken van in dit besluit gestelde verboden krachtens de [artikelen 14a][ref7],
      [24a][ref8], en [25a][ref9].

      2 Indien burgemeester en wethouders van een gemeente waar de lozing in de bodem plaatsvindt of zal plaatsvinden,
      ingevolge [artikel 3][ref10] niet het bevoegd gezag zijn worden zij in de gelegenheid gesteld advies uit te brengen
      omtrent de onderwerpen bedoeld in het eerste lid.


