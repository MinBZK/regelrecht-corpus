      [artikel 5, derde lid][ref2], worden de gegevens verstrekt die in de bij dit besluit behorende [bijlage I][ref3]
      zijn aangegeven. Onze Minister kan nadere regels stellen met betrekking tot de te verstrekken gegevens.

      2 Het eerste lid is van overeenkomstige toepassing op een in [artikel 11a][ref4] bedoelde aanvraag om afwijking van
