  - number: '14'
    text: |-
      1 Het is verboden een omvangrijke lozing van huishoudelijk afvalwater in de bodem - niet zijnde een bestaande
      lozing in de bodem - uit te voeren.

      2 Het bevoegd gezag kan, voor een lozing in de bodem anders dan binnen een inrichting waarvoor een vergunning als
      bedoeld in [artikel 8.1 van de Wet milieubeheer][ref1] is vereist, op daartoe strekkende aanvraag voor een door hem
      vast te stellen termijn van ten hoogste tien jaar, ontheffing verlenen van het in het eerste lid bedoelde verbod
      indien:

      a. de afstand van de kadastrale grens van het perceel waar het huishoudelijk afvalwater vrijkomt tot de
      dichtstbijzijnde riolering, afhankelijk van het aantal lozingseenheden, ten minste bedraagt:

        - tot 25 lozingseenheden 100 meter
        - van 25 tot 50 lozingseenheden 600 meter
        - van 50 tot 100 lozingseenheden 1500 meter
        - van 100 tot en met 200 lozingseenheden 3000 meter,

      b. het een lozing in de bodem betreft van ten hoogste 200 lozingseenheden,

      c. uit een onderzoek, verricht met grondboringen, uitgevoerd overeenkomstig door Onze Minister vast te
      stellen regels, de gemiddeld hoogste grondwaterstand ter plaatse van de lozing en de dimensionering van de
      infiltratievoorziening is vastgesteld en

      d. een aansluiting op de riolering of een andere wijze van afvoer van het huishoudelijk afvalwater redelijkerwijs
      niet mogelijk is.

      3 Aan een ontheffing worden ten minste de voorschriften verbonden, bedoeld in de
      [artikelen 15 tot en met 19][ref2].

      4 Het bevoegd gezag kan tevens voor een lozing in de bodem, anders dan binnen een inrichting waarvoor een
      vergunning als bedoeld in [artikel 8.1 van de Wet milieubeheer][ref3] is vereist, op een daartoe strekkende
      aanvraag, voor een door hem vast te stellen termijn, gebaseerd op het nog niet verstreken deel van een redelijke
      afschrijvingstermijn van het bij de aanleg van de riolering reeds bestaande zuiveringssysteem, bedoeld in
      [artikel 15][ref4] , en van de infiltratievoorziening, bedoeld in [artikel 16][ref5], ontheffing verlenen van het
      in het eerste lid bedoelde verbod, indien:

      a. de afstand van het dichtstbijzijnde gebouw waar het huishoudelijk afvalwater vrijkomt tot de dichtstbijzijnde
      riolering kleiner is dan de afstand die ingevolge het tweede lid, onder a, vereist is, en

      b. wordt voldaan aan het tweede lid, onder b en c, en aan de [artikelen 15 tot en met 19][ref6].

      5 Voor de toepassing van het tweede en vierde lid wordt de afstand tot de dichtstbijzijnde riolering berekend langs
      de kortste lijn waar de afvoerleidingen zonder overwegende bezwaren kunnen worden aangelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8.1
      [ref2]: https://wetten.overheid.nl/BWBR0009092#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel8.1
      [ref4]: https://wetten.overheid.nl/BWBR0009092#Artikel15
      [ref5]: https://wetten.overheid.nl/BWBR0009092#Artikel16
      [ref6]: https://wetten.overheid.nl/BWBR0009092#Artikel15
