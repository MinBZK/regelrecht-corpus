valid_from: '2005-02-25'
bwb_id: BWBR0008877
url: https://wetten.overheid.nl/BWBR0008877/2005-02-25
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 6 februari
    1996, nr. MJZ 96007796, Centrale Directie Juridische Zaken, Afdeling Wetgeving, gedaan in overeenstemming met Onze
    Minister van Verkeer en Waterstaat;

    Gelet op de artikelen 1.1, derde lid, 8.19, eerste lid, 8.40 en 8.42, eerste lid van de Wet milieubeheer en artikel
    2a van de Wet verontreiniging oppervlaktewateren;

    De Raad van State gehoord (advies van 12 september 1996, nr. W08.96.0053);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van
    14 augustus 1997, nr. MJZ 97119 630, Centrale Directie Juridische Zaken, Afdeling Wetgeving, uitgebracht in
    overeenstemming met Onze Minister van Verkeer en Waterstaat;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008877/2005-02-25#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008877/2005-02-25#Artikel1
  - number: 1.a
    text: |-
      tandartspraktijk: praktijk van een of meer tandartsen-algemene practici of van een of meer tandheelkundige
      specialisten, die niet is gevestigd in een algemeen, academisch of categoriaal ziekenhuis als
      bedoeld in artikel 1, onder *n*, van het koninklijk besluit van 4 november 1983, *Stb.* 577, houdende
      aanwijzing van soorten van inrichtingen als bedoeld in de [artikelen 1][ref1], tweede lid, en
      [31, vierde lid, van de Wet verontreiniging oppervlaktewateren][ref2] (*Stb.* 1981, 573);


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002682#Artikel31
    url: https://wetten.overheid.nl/BWBR0008877/2005-02-25#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002682
        artikel: '31'
  - number: 1.b
    text: |-
      bevoegd gezag: bestuursorgaan dat bevoegd is of zou zijn een vergunning krachtens
      [artikel 8.1 van de Wet milieubeheer][ref1] voor de tandartspraktijk te verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0008877/2005-02-25#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: '2'
    text: |-
      Degene die een inrichting drijft, die tot een krachtens [artikel 1.1, derde lid, van de Wet milieubeheer][ref1]
      aangewezen categorie behoort, en waar een tandartspraktijk wordt uitgeoefend, dient te voldoen aan de voorschriften
      die zijn opgenomen in de bij dit besluit behorende [bijlage I][ref2], alsmede aan de krachtens deze voorschriften
      door het bevoegd gezag gestelde nadere eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008877
    url: https://wetten.overheid.nl/BWBR0008877/2005-02-25#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0008877
  - number: '3'
    text: |-
      Indien een inrichting tot een krachtens [artikel 1.1, derde lid, van de Wet milieubeheer][ref1] aangewezen
      categorie van inrichtingen behoort, niet uitsluitend omdat daarin een tandartspraktijk wordt uitgeoefend, geldt
      een voor de inrichting krachtens [artikel 8.1 van de Wet milieubeheer][ref2] verleende vergunning ook voor het
      oprichten, in werking hebben of veranderen van de inrichting, dan wel het veranderen van de werking daarvan,
      voor zover dit oprichten, in werking hebben of veranderen van de inrichting, dan wel veranderen van de werking
      betrekking heeft op het uitoefenen van de tandartspraktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0008877/2005-02-25#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
  - number: '4.1'
    text: |-
      Degene die voornemens is een inrichting op te richten, voor zover dit oprichten betrekking heeft op het uitoefenen
      van een tandartspraktijk, meldt dit ten minste vier weken voor het oprichten aan het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0008877/2005-02-25#Artikel4
  - number: '4.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing met betrekking tot het uitbreiden of wijzigen van een inrichting,
      dan wel met betrekking tot het veranderen van de werking daarvan, voor zover dat betrekking heeft op het uitoefenen
      van een tandartspraktijk. Deze melding is niet vereist indien eerder een melding overeenkomstig het bepaalde in dit
      artikel is gedaan en door dit uitbreiden, wijzigen of veranderen van de werking van de inrichting geen afwijking
      ontstaat van de bij die melding verstrekte gegevens.
    url: https://wetten.overheid.nl/BWBR0008877/2005-02-25#Artikel4
  - number: '4.3'
    text: |-
      Bij een melding als bedoeld in het eerste en tweede lid, wordt in ieder geval het tijdstip vermeld waarop de
      inrichting of de uitbreiding of wijziging daarvan in werking zal worden gebracht, dan wel de verandering van
      de werking daarvan verwezenlijkt zal zijn, en worden de gegevens verstrekt die in de bij dit besluit behorende
      [bijlage II][ref1] zijn aangegeven. De melding wordt gedaan op een formulier waarvan het model wordt vastgesteld
      door Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0008877
    url: https://wetten.overheid.nl/BWBR0008877/2005-02-25#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008877
  - number: '4.4'
    text: |-
      Degene die een melding heeft gedaan als bedoeld in het eerste of het tweede lid, stelt het bevoegd gezag zo
      tijdig in kennis van een wijziging van het in het derde lid bedoelde tijdstip, dat het bevoegd gezag in staat
      is voorafgaand aan dat tijdstip te controleren of aan de in [bijlage I][ref1] opgenomen voorschriften kan worden
      voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0008877
    url: https://wetten.overheid.nl/BWBR0008877/2005-02-25#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008877
  - number: '5.1'
    text: |-
      Gedurende één jaar vanaf het tijdstip waarop dit besluit van toepassing wordt op een inrichting waar een
      tandartspraktijk wordt uitgeoefend, zijn de in [bijlage I][ref1] opgenomen voorschriften 3.2.3 tot en met 3.2.5
      en de voorschriften met betrekking tot geluidhinder niet van toepassing. Gedurende dat jaar blijven van toepassing
      de desbetreffende voorschriften van een krachtens [artikel 8.1 van de Wet milieubeheer][ref2] verleende vergunning
      zoals die golden tot aan het in de eerste volzin genoemde tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0008877
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0008877/2005-02-25#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008877
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
  - number: '5.2'
    text: |-
      In een geval als bedoeld in het eerste lid, meldt degene die de inrichting drijft, ten hoogste twaalf
      weken na het in dat lid bedoelde tijdstip aan het bevoegd gezag dat hij de inrichting in werking heeft.
      [Artikel 4, derde lid, tweede volzin][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008877#Artikel4
    url: https://wetten.overheid.nl/BWBR0008877/2005-02-25#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008877
        artikel: '4'
  - number: '5.3'
    text: |-
      Een melding is niet vereist indien voor de inrichting een vergunning krachtens
      [artikel 8.1 van de Wet milieubeheer][ref1] is verleend, dan wel een melding is gedaan overeenkomstig het
      Lozingenbesluit Wvo tandartspraktijken.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0008877/2005-02-25#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: '6'
    text: Het Lozingenbesluit Wvo tandartspraktijken wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0008877/2005-02-25#Artikel6
  - number: '8'
    text: |-
      Dit besluit treedt in werking met ingang van de eerste dag van de derde kalendermaand na de datum van uitgifte van
      het *Staatsblad* waarin het wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0008877/2005-02-25#Artikel8
  - number: '9'
    text: 'Dit besluit wordt aangehaald als: Besluit tandartspraktijken milieubeheer.'
    url: https://wetten.overheid.nl/BWBR0008877/2005-02-25#Artikel9
