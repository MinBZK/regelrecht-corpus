      1 De in de [artikelen 14 tot en met 17][ref1] opgenomen verplichtingen rusten op alle subsidie-ontvangers, met dien
      verstande dat de in de [artikelen 15, tweede lid][ref2], en [16][ref3] opgenomen verplichtingen ten aanzien van een
      kennisconsortium dat geen rechtspersoonlijkheid bezit slechts rusten op de penvoerende aanvrager.

      2 De in de [artikelen 15, tweede lid][ref4], en [16][ref5] opgenomen verplichtingen zijn van overeenkomstige
      toepassing op een regieorgaan.

      3 De in de [artikelen 14][ref6], [15][ref7] en [16][ref8] opgenomen verplichtingen gelden tot aan de dag waarop de
      subsidie wordt vastgesteld. De in [artikel 17][ref9] opgenomen verplichtingen gelden totdat vijf jaren na die dag
      zijn verstreken.


