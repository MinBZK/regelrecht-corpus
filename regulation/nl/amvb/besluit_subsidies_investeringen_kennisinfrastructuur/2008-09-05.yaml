  - number: '9'
    text: |-
      1 De bevoegde minister kan, in overeenstemming met de andere ministers die het aangaat, op met redenen omkleed
      verzoek van een kennisconsortium erin toestemmen dat van dat kennisconsortium geen ondernemer deel uitmaakt, indien
      het naar zijn oordeel aannemelijk is dat het kennisconsortium op vergelijkbare wijze als andere kennisconsortia
      voldoende kwaliteit en voldoende middelen heeft om een kennisproject uit te voeren en er op het desbetreffende
      kennisgebied geen ondernemers zijn die desgevraagd kunnen of willen deelnemen in het kennisconsortium.

      2 De bevoegde minister kan, in overeenstemming met de andere ministers die het aangaat, op met redenen omkleed
      verzoek van een kennisconsortium toestemming verlenen voor een looptijd van het kennisproject die meer bedraagt dan
      vier jaar, maar niet meer dan acht jaar, indien het belang van het kennisproject een langere looptijd dan vier jaar
      rechtvaardigt en het naar zijn oordeel aannemelijk is dat het kennisproject binnen de in het verzoek aangegeven
      looptijd kan worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0014472/2008-09-05#Artikel9
  - number: '10'
    text: |-
      1 De bevoegde minister geeft een beschikking op een aanvraag om subsidie op grond van dit besluit binnen 40 weken
      na afloop van de periode, bedoeld in [artikel 7, eerste lid][ref1].

      2 Indien op de aanvraag niet afwijzend wordt beslist, en deze een kennisproject betreft dat wordt uitgevoerd door
      een kennisconsortium dat geen rechtspersoonlijkheid bezit, vermeldt de beschikking tot subsidieverlening een raming
      van de projectkosten per deelnemer aan het kennisconsortium.

      3 Elke deelnemer aan het kennisconsortium is tot ten hoogste het naar rato van de voor hem geraamde projectkosten
      berekende bedrag aansprakelijk voor terugbetaling van de subsidie, voor zover de subsidie-ontvangers daartoe
      verplicht zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0014472#Artikel7
    url: https://wetten.overheid.nl/BWBR0014472/2008-09-05#Artikel10
