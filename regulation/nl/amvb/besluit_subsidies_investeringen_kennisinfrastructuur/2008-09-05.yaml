  - number: '23'
    text: |-
      Indien op grond van [artikel 14, vierde lid][ref1], bij de subsidieverlening de verplichting is opgelegd tot
      het houden van een evaluatie door een externe evaluatiecommissie, geeft de bevoegde minister de beschikking tot
      subsidievaststelling binnen dertien weken na ontvangst van het evaluatieverslag, dan wel nadat de voor het indienen
      ervan geldende termijn is verstreken. Indien geen verplichting tot evaluatie is opgelegd, geeft de bevoegde
      minister de beschikking tot subsidievaststelling binnen dertien weken na ontvangst van de aanvraag daartoe dan wel
      nadat de voor het indienen ervan geldende termijn is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0014472#Artikel14
