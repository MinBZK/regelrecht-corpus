  - number: '5'
    text: |-
      1 Er is een Commissie van Wijzen ICES/KIS die tot taak heeft de ministers die het aangaat te adviseren omtrent
      aanvragen om subsidie op grond van dit besluit.

      2 De adviezen van de commissie gaan vergezeld van een deugdelijke motivering en de in
      [artikel 12, eerste lid][ref1], bedoelde beoordeling van de Koninklijke Nederlandse Academie van Wetenschappen en
      de in dat lid genoemde organisaties. Indien de commissie een advies geeft dat afwijkt van de beoordeling, wordt
      zulks met de redenen voor de afwijking in de motivering vermeld.

      3 De commissie bestaat uit een voorzitter en ten minste zes andere leden. De leden zijn deskundig op het
      kennisgebied waarop de commissie een taak heeft en zijn geen ambtenaren, werkzaam bij de Ministeries van
      Economische Zaken, van Onderwijs, Cultuur en Wetenschap, van Landbouw, Natuur en Voedselkwaliteit, van Verkeer en
      Waterstaat, van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer of van Volksgezondheid, Welzijn en Sport.

      4 De voorzitter en de leden worden door de Minister van Economische Zaken in overeenstemming met de andere
      ministers die het aangaat voor een termijn van ten hoogste vijf jaar benoemd. Zij zijn te allen tijde opnieuw
      benoembaar.

      5 De commissie stelt haar eigen werkwijze bij reglement schriftelijk vast en zendt dat, alsmede elke wijziging
      daarvan, ter goedkeuring aan de Minister van Economische Zaken. De Minister van Economische Zaken kan, in
      overeenstemming met de andere ministers die het aangaat, zijn goedkeuring onthouden aan het reglement of een
      wijziging daarvan, indien het bepalingen bevat die in strijd zijn met het recht of het algemeen belang.

      6 Een lid van de commissie neemt niet deel aan de voorbereiding en vaststelling van een advies, indien hij een
      persoonlijk belang heeft bij de beschikking op de aanvraag.

      7 De Minister van Economische Zaken kan in overeenstemming met de andere ministers die het aangaat waarnemers
      aanwijzen, die het recht hebben de vergaderingen van de commissie bij te wonen.

      8 In het secretariaat van de commissie wordt door de Minister van Economische Zaken voorzien.

      9 Het beheer van de bescheiden betreffende de werkzaamheden van de commissie geschiedt op overeenkomstige wijze als
      bij het Ministerie van Economische Zaken. De bescheiden worden na beëindiging van de werkzaamheden van de commissie
      bewaard in het archief van dat ministerie.

      10 De commissie verstrekt desgevraagd aan de bevoegde minister die het aangaat de voor de uitoefening van zijn taak
      benodigde inlichtingen. De bevoegde minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover
      dat voor de vervulling van zijn taak redelijkerwijs nodig is.

      11 De commissie stelt jaarlijks voor 1 april een verslag op van haar werkzaamheden in het afgelopen kalenderjaar.
      Op verzoek van de Minister van Economische Zaken, maar in ieder geval nadat de laatste subsidie is verleend op
      de aanvragen ontvangen op grond van dit besluit in de periode, bedoeld in [artikel 7, eerste lid][ref2], stelt de
      commissie tevens een evaluatieverslag op, waarin zij aandacht besteedt aan de doelmatigheid en doeltreffendheid van
      haar taakvervulling. Het jaarverslag en het evaluatieverslag worden aan de ministers die het aangaat toegezonden en
      algemeen verkrijgbaar gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0014472#Artikel12
