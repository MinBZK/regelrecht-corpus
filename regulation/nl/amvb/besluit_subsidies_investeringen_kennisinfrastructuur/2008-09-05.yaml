  - number: '6'
    text: |-
      Bij ministeriële regeling stelt de Minister van Economische Zaken, in overeenstemming met de andere ministers
      die het aangaat, een subsidieplafond vast voor het verlenen van subsidies op in een periode als bedoeld in
      [artikel 7, eerste lid][ref1], ontvangen aanvragen op grond van dit besluit, alsmede de wijze van verdeling ervan.
      Daarbij kan hij afzonderlijke subsidieplafonds vaststellen voor verschillende kennisgebieden.


      [ref1]: https://wetten.overheid.nl/BWBR0014472#Artikel7
