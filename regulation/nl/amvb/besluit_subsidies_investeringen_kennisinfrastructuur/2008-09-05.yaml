  - number: '2'
    text: |-
      1 De bevoegde minister verleent op aanvraag een subsidie aan:

      a. een kennisconsortium dat rechtspersoonlijkheid bezit en dat voor eigen rekening en risico een kennisproject
      uitvoert, of

      b. de deelnemers aan een kennisconsortium dat geen rechtspersoonlijkheid bezit, die voor gezamenlijke rekening en
      risico een kennisproject uitvoeren.

      2 Indien de aanvragers deelnemers zijn in een kennisconsortium dat geen rechtspersoonlijkheid bezit, wordt de
      subsidie verstrekt aan de deelnemers gezamenlijk en betaald aan de penvoerende aanvrager.

      3 Indien de aanvragers kennisconsortia zijn wier aanvragen door een regieorgaan worden gebundeld, wordt de
      subsidie verstrekt aan de kennisconsortia en betaald aan het regieorgaan, dat zorgdraagt voor de uitbetaling aan de
      kennisconsortia van de bedragen waarop zij recht hebben.

      4 Geen subsidie wordt verstrekt indien voor het kennisproject reeds door de bevoegde minister subsidie is
      verstrekt, behoudens voor zover die subsidie door hem is aangemerkt als basissubsidie of doelsubsidie.
    url: https://wetten.overheid.nl/BWBR0014472/2008-09-05#Artikel2
  - number: '3'
    text: |-
      1 De subsidie bedraagt ten hoogste 50 procent van de projectkosten.

      2 Indien ter zake van de projectkosten of een deel daarvan reeds door een ander bestuursorgaan of door de Commissie
      van de Europese Gemeenschappen subsidie is of wordt verstrekt, wordt slechts een zodanig bedrag aan subsidie
      verleend, dat het totale bedrag aan subsidies niet meer bedraagt dan:

      a. het ingevolge het eerste lid geldende percentage, dan wel

      b. 65 procent van de projectkosten in het geval het kennisproject aansluit bij de doelstellingen van een project of
      een specifiek programma dat is opgesteld ingevolge het communautaire kaderprogramma op het gebied van onderzoek en
      ontwikkeling dat ten uitvoer wordt gelegd op het tijdstip van het verlenen van de subsidie, dan wel

      c. 75 procent van de projectkosten indien het kennisproject aan onderdeel b voldoet en daarnaast wordt uitgevoerd
      op basis van grensoverschrijdende samenwerking waarbij ondernemingen, universiteiten en onderzoeksinstellingen of
      ten minste twee onafhankelijke partners uit twee lidstaten van de Europese Unie daadwerkelijk samenwerken en het
      kennisproject gepaard gaat met een ruime verspreiding en publicatie van de resultaten, met inachtneming van de
      daarop rustende rechten van intellectuele eigendom.

      3 Het tweede lid is niet van toepassing voor zover de in dat lid bedoelde verstrekte subsidie een basissubsidie
      betreft.

      4 In het geval van het niet vervullen van de voorwaarde, bedoeld in
      [artikel 4:34, eerste lid, van de Algemene wet bestuursrecht][ref1], worden de op grond van dit besluit verleende
      subsidiebedragen verlaagd tot het bedrag van de subsidie dat na de vaststelling of goedkeuring van de begroting ter
      beschikking staat, een en ander voor zover van toepassing naar rato van het aantal subsidie-ontvangers en van de
      hoogte van de verleende subsidiebedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel434
    url: https://wetten.overheid.nl/BWBR0014472/2008-09-05#Artikel3
