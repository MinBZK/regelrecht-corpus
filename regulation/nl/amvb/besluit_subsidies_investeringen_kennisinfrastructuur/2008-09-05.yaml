  - number: '8'
    text: |-
      1 Indien krachtens [artikel 1, vierde lid][ref1], een regieorgaan is aangewezen, worden aanvragen van
      kennisconsortia om subsidie die betrekking hebben op de desbetreffende zwaartepunten gebundeld ingediend door het
      regieorgaan.

      2 Het regieorgaan deelt aan de kennisconsortia die aanvragen willen indienen op het desbetreffende zwaartepunt
      vooraf de criteria mee op grond waarvan het beoordeelt of die aanvragen gebundeld zullen worden ingediend. De
      criteria mogen niet in strijd zijn met de criteria, bedoeld in de [artikelen 11][ref2] en [12][ref3].

      3 Indien het regieorgaan een bij hem ingediende aanvraag niet opneemt in de bundeling van aanvragen, wordt zulks
      aan de aanvrager meegedeeld met de redenen voor het niet opnemen in de bundeling.

      4 Een aanvraag die met toepassing van dit artikel niet wordt opgenomen in een bundeling van aanvragen, kan
      afzonderlijk worden ingediend in de periode, bedoeld in [artikel 7, eerste lid][ref4], indien de aanvrager bij zijn
      aanvraag de in het derde lid bedoelde mededeling voegt en daarbij aangeeft waarom naar zijn mening en in afwijking
      van de mening van het regieorgaan de aanvraag wel voldoet aan de criteria, bedoeld in de [artikelen 11][ref5] en
      [12][ref6].

      5 Aanvragen dienen uiterlijk op een door de Minister van Economische Zaken bij ministeriële regeling te bepalen
      datum door het regieorgaan te zijn ontvangen.


