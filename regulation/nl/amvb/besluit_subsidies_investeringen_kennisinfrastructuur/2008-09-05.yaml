  - number: '24'
    text: |-
      De Minister van Economische Zaken publiceert, in overeenstemming met de andere ministers die het aangaat, binnen
      vijf jaar na inwerkingtreding van dit besluit een verslag over de doeltreffendheid en de effecten van dit besluit.
    url: https://wetten.overheid.nl/BWBR0014472/2008-09-05#Artikel24
  - number: '25'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0014472/2008-09-05#Artikel25
  - number: '26'
    text: 'Dit besluit wordt aangehaald als: Besluit subsidies investeringen kennisinfrastructuur.'
    url: https://wetten.overheid.nl/BWBR0014472/2008-09-05#Artikel26
