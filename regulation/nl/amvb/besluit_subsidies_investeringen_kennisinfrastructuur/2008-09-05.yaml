  - number: '12'
    text: |-
      1 De Minister van Economische Zaken wint in overeenstemming met de andere ministers die het aangaat omtrent de
      aanvragen waarop niet met toepassing van [artikel 11][ref1] afwijzend is beslist, het advies in van de Commissie
      van Wijzen ICES/KIS en verzoekt om een wetenschappelijke en maatschappelijk-economische beoordeling van de
      aanvragen door de Koninklijke Nederlandse Academie van Wetenschappen, het Centraal planbureau, het Sociaal-
      cultureel planbureau, het Milieu- en Natuurplanbureau en het Rathenau Instituut.

      2 De commissie geeft in ieder geval een negatief advies indien:

      a. het aannemelijk is dat het kennisproject ook zonder de subsidie zonder belangrijke vertraging zou worden
      uitgevoerd;

      b. het aannemelijk is dat de doelen van het kennisproject bereikt kunnen worden op een andere wijze die
      aanmerkelijk minder kosten met zich brengt of waarbij geen overheidsbijdrage nodig is;

      c. onvoldoende vertrouwen bestaat dat het kennisproject op een doelmatige en economisch verantwoorde wijze kan
      worden uitgevoerd, mede gelet op de stand van de techniek en de financiering van het kennisproject;

      d. onvoldoende vertrouwen bestaat dat de organisatie van het kennisconsortium zodanig is ingericht en de deelnemers
      aan het kennisconsortium zodanige kwaliteiten bezitten dat het kennisproject naar behoren kan worden uitgevoerd;

      e. het kennisproject niet aansluit bij kwalitatief hoogstaand fundamenteel of industrieel onderzoek in Nederland;

      f. het in de aanvraag geplande onderzoek geen betrekking heeft op een van de kennisgebieden;

      g. het kennisproject niet binnen vier jaar kan worden uitgevoerd en het door de aanvrager ingediende verzoek om
      toestemming, bedoeld in [artikel 9, tweede lid][ref2], naar de mening van de commissie geweigerd moet worden, dan
      wel reeds door de bevoegde minister geweigerd is.

      3 De commissie rangschikt voor ieder kennisgebied de aanvragen waarover zij positief adviseert zodanig, dat een
      kennisproject hoger gerangschikt wordt naar mate het voor dat kennisgebied:

      a. meer bijdraagt aan kwalitatief hoogstaand fundamenteel of industrieel onderzoek of de kwaliteit van de
      kennisinfrastructuur in Nederland;

      b. meer baten in de vorm van wetenschappelijk inzicht, technologische of maatschappelijke concepten, innovatieve
      toepassingen daarvan dan wel competenties zal opleveren, welke onderzoeksresultaten toegepast kunnen worden in
      producten, processen, competenties of diensten;

      c. op een betere wijze leidt tot verspreiding en overdracht van de kennis en de resultaten die worden verkregen
      door het kennisproject;

      d. meer positieve maatschappelijke of economische gevolgen in Nederland zal hebben en beter aansluit op het
      regeringsbeleid;

      e. beter is ingebed in de kennisketen van fundamenteel onderzoek naar onderzoek gericht op toepasbaarheid;

      f. waardevoller is vanwege samenwerking met een nationale uitstraling, doordat het fundamenteel of industrieel
      onderzoek landelijk of regionaal wordt gebundeld.

      4 De Koninklijke Nederlandse Academie van Wetenschappen en het Centraal planbureau kunnen de aanvragers op basis
      van het conceptoordeel verzoeken schriftelijk of mondeling hun aanvraag nader toe te lichten of hun zienswijze
      te geven over bedenkingen ten aanzien van de aanvraag. Hiervan wordt een verslag gemaakt, dat ten behoeve van de
      commissie bij de beoordeling wordt gevoegd.

      5 De commissie rangschikt de aanvragen overeenkomstig het derde lid met inachtneming van de beoordeling door
      de Koninklijke Nederlandse Academie van Wetenschappen en de in het eerste lid genoemde organisaties en door
      afweging per kennisgebied van het wetenschappelijke en het maatschappelijk-economische belang van de aanvragen die
      betrekking hebben op dat kennisgebied.

      6 De bevoegde minister voegt het advies van de Commissie van Wijzen met de beoordeling door de Koninklijke
      Nederlandse Academie van Wetenschappen en de in het eerste lid genoemde organisaties bij de beschikking tot
      subsidieverlening.


      [ref1]: https://wetten.overheid.nl/BWBR0014472#Artikel11
