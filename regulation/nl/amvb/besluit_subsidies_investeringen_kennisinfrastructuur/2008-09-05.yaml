  - number: '14'
    text: |-
      1 De subsidie-ontvangers voeren het kennisproject uit overeenkomstig het projectplan waarop de subsidieverlening
      betrekking heeft. Zij starten het kennisproject binnen zes maanden na de verlening van de subsidie en voltooien
      het uiterlijk op het bij de verlening bepaalde tijdstip, behoudens voorafgaande schriftelijke ontheffing van de
      bevoegde minister voor het vertragen, het essentieel wijzigen of het stopzetten van het kennisproject.

      2 De subsidie-ontvangers voeren het kennisproject in Nederland uit, behoudens voorafgaande schriftelijke ontheffing
      van de bevoegde minister voor gedeeltelijke uitvoering buiten Nederland.

      3 De subsidie-ontvangers dienen gedurende het tijdvak van de subsidieverlening jaarlijks voor een bij de
      subsidieverlening te bepalen tijdstip een activiteitenplan voor dat jaar met bijbehorende begroting in, tenzij de
      bevoegde minister in de beschikking tot subsidieverlening anders bepaalt.

      4 Bij de subsidieverlening kan de bevoegde minister een verplichting opleggen tot het houden van een evaluatie
      van de uitvoering van het kennisproject door een externe evaluatiecommissie. In dat geval verleent de subsidie-
      ontvanger de daaraan gewenste medewerking.

      5 De bevoegde minister kan aan een ontheffing als bedoeld in het eerste of tweede lid voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0014472/2008-09-05#Artikel14
  - number: '15'
    text: |-
      1 Elke subsidie-ontvanger voert een administratie die zodanig is ingericht, dat daaruit te allen tijde op
      eenvoudige en duidelijke wijze alle projectkosten kunnen worden afgelezen, gespecificeerd overeenkomstig de in
      [artikel 4, eerste lid][ref1], onderscheiden kostensoorten, met dien verstande dat ter zake van de loonkosten een
      urenverantwoording per werknemer aanwezig dient te zijn.

      2 Indien het kennisconsortium dat het kennisproject uitvoert geen rechtspersoonlijkheid bezit, voert de penvoerende
      aanvrager een administratie van het kennisproject die zodanig is ingericht, dat daaruit te allen tijde op
      eenvoudige en duidelijke wijze alle door de deelnemers aan het kennisconsortium gemaakte en door hen aan hem
      opgegeven projectkosten kunnen worden afgelezen.

      3 Elke subsidie-ontvanger doet onverwijld mededeling aan de bevoegde minister van de indiening bij de rechtbank
      van een verzoek tot het op hem van toepassing verklaren van de schuldsaneringsregeling natuurlijke personen, tot
      verlening van surseance van betaling aan hem of tot faillietverklaring van hem.


      [ref1]: https://wetten.overheid.nl/BWBR0014472#Artikel4
    url: https://wetten.overheid.nl/BWBR0014472/2008-09-05#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0014472
        artikel: '4'
        paragraaf: '1'
  - number: '16'
    text: |-
      1 De subsidie-ontvanger brengt steeds na afloop van een periode van twaalf maanden aan de bevoegde minister
      schriftelijk verslag uit omtrent de uitvoering van het kennisproject, met inbegrip van een vergelijking van die
      uitvoering met het projectplan en de bij de subsidieverlening vermelde raming van de projectkosten. Het verslag
      gaat vergezeld van een jaarrekening.

      2 De subsidie-ontvanger beschrijft voor aanvang van het kennisproject de situatie met betrekking tot het onderzoek
      dat in het kennisproject zal worden uitgevoerd en zendt deze beschrijving aan de bevoegde minister.
    url: https://wetten.overheid.nl/BWBR0014472/2008-09-05#Artikel16
  - number: '17'
    text: |-
      1 De subsidie-ontvanger draagt, behoudens voorafgaande schriftelijke ontheffing van de bevoegde minister, met
      betrekking tot de resultaten van het kennisproject zorg voor:

      a. de tenaamstelling en de verwerving van rechten van intellectuele eigendom op de daarvoor in aanmerking komende
      resultaten door een deelnemer aan het kennisconsortium, zijnde:

      1°. een universiteit of kennisinstelling of

      2°. een ondernemer, mits deze daarvoor aan de deelnemende universiteiten en onderzoeksinstellingen een vergoeding
      betaalt die, rekening houdend met zijn eigen inbreng in het kennisproject, gelijk is aan de marktprijs;

      b. de instandhouding van de onder a bedoelde rechten;

      c. de instandhouding van andere voor de uitvoering van het kennisproject van belang zijnde en door de uitvoering
      van het kennisproject opgedane kennis.

      2 De universiteit of onderzoeksinstelling stelt, behoudens voorafgaande schriftelijke ontheffing van de bevoegde
      minister, niet ter beschikking van derden:

      a. rechten van intellectuele eigendom op de resultaten van het kennisproject;

      b. aanspraken op een intellectueel eigendomsrecht op de resultaten van het kennisproject;

      c. rechten die voortvloeien uit een aanvraag om een intellectueel eigendomsrecht op de resultaten van het
      kennisproject.

      3 De universiteit of onderzoeksinstelling kan aan de andere deelnemers van het kennisconsortium op hun verzoek
      licenties op de rechten van intellectuele eigendom op de resultaten van het project verlenen, indien zij daarvoor
      een vergoeding ontvangt die, rekening houdend met hun eigen inbreng in het kennisproject, gelijk is aan de
      marktprijs.

      4 De subsidie-ontvanger brengt desgevraagd aan de bevoegde minister verslag uit omtrent de toepassing van de
      resultaten van het kennisproject. Onverminderd de verplichtingen, bedoeld in het eerste tot en met het derde lid,
      draagt de subsidie-ontvanger zorg voor de openbaarmaking en verspreiding van de resultaten van het kennisproject.

      5 De subsidie-ontvanger zal, behoudens voorafgaande schriftelijke ontheffing van de bevoegde minister, niet:

      a. indien hij een rechtspersoon is, de rechtspersoon ontbinden of geheel of gedeeltelijk vervreemden, dan wel de
      statuten wijzigen;

      b. indien hij deelnemer is in een kennisconsortium in de vorm van een commanditaire vennootschap, een vennootschap
      onder firma, een maatschap of een stichting, meewerken aan de ontbinding ervan of aan het uittreden van een of meer
      deelnemers ervan, dan wel de statuten wijzigen;

      c. indien hij deelnemer is in een kennisconsortium en onderdeel b niet van toepassing is, de overeenkomst wijzigen
      waarin de samenwerking tussen de deelnemers aan het kennisconsortium is geregeld.

      6 De bevoegde minister kan aan een ontheffing als bedoeld in het eerste, tweede of vijfde lid voorschriften
      verbinden.
    url: https://wetten.overheid.nl/BWBR0014472/2008-09-05#Artikel17
  - number: '18'
    text: |-
      De Minister van Economische Zaken stelt, in overeenstemming met de andere ministers die het aangaat,
      bij ministeriële regeling nadere regels voor de inrichting van het activiteitenplan en de begroting,
      bedoeld in [artikel 14, derde lid][ref1], of het verslag van de uitvoering en de jaarrekening, bedoeld in
      [artikel 16, eerste lid][ref2]. Tevens kan hij bij ministeriële regeling nadere regels stellen voor de evaluatie,
      bedoeld in [artikel 14, vierde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0014472#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0014472#Artikel16
