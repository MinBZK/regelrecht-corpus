preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Economische Zaken van 26 maart 2002, nr. WJZ 02015947, gedaan in
    overeenstemming met Onze Ministers van Financiën, van Onderwijs, Cultuur en Wetenschappen, van Landbouw,
    Natuurbeheer en Visserij, van Verkeer en Waterstaat en van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

    Gelet op de artikelen 5 van de Wet Fonds economische structuurversterking, 3 van de Kaderwet EZ-subsidies, 4 van de
    Wet overige OCenW-subsidies, 4 van de Kaderwet LNV-subsidies, 3 van de Kaderwet subsidies Verkeer en Waterstaat en
    15.13 van de Wet milieubeheer;

    De Raad van State gehoord (advies van 30 mei 2002, nr. W10.02.0150/II);

    Gezien het nader rapport van Onze Minister van Economische Zaken van 12 december 2002, nr. WJZ 02062562, gedaan
    in overeenstemming met Onze Ministers van Financiën, van Onderwijs, Cultuur en Wetenschappen, van Landbouw,
    Natuurbeheer en Visserij, van Verkeer en Waterstaat en van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0014472/2008-09-05#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit wordt verstaan onder:

      a. bevoegde minister: de Minister van Economische Zaken, van Onderwijs, Cultuur en Wetenschap, van Landbouw,
      Natuur en Voedselkwaliteit, van Verkeer en Waterstaat, van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer
      en van Volksgezondheid, Welzijn en Sport die op grond van het tweede lid of in [artikel 11][ref1] als bevoegd
      bestuursorgaan is aangewezen;

      b. universiteit: een [onder a of b van de bijlage van de Wet op het hoger onderwijs en wetenschappelijk onderzoek]
      (onbekend) genoemde instelling voor hoger onderwijs, alsmede een [onder i van de bijlage van die wet](onbekend)
      genoemd academisch ziekenhuis;

      c. onderzoeksinstelling: een openbare instelling zonder winstoogmerk die zelf kwalitatief hoogstaand onderzoek
      uitvoert;

      d. ondernemer: een natuurlijke persoon of rechtspersoon, niet zijnde een rechtspersoon die krachtens publiekrecht
      is ingesteld, die een onderneming in stand houdt;

      e. kennisconsortium: een samenwerkingsverband zonder winstoogmerk van natuurlijke personen of rechtspersonen dat
      de ontwikkeling en verspreiding van kennis in een kennisgebied ten doel heeft, dat blijkens zijn statuten of de
      samenwerkingsovereenkomst open staat voor een ieder en toegankelijk is onder niet-discriminerende voorwaarden, en
      waarvan ten minste een universiteit of onderzoeksinstelling en een ondernemer deel uitmaken, behoudens het geval,
      bedoeld in [artikel 9, eerste lid][ref2];

      f. kennisgebied: een gebied, aangewezen in de ministeriële regeling, bedoeld in het derde lid;

      g. kennisproject: een voor Nederland nieuw planmatig en met elkaar samenhangend geheel van activiteiten van een
      kennisconsortium, gericht op de ontwikkeling van nieuwe kennis in een kennisgebied door middel van het uitvoeren
      van fundamenteel of industrieel onderzoek:

      1°. dat aansluit bij kwalitatief hoogstaand en, indien nodig, multidisciplinair onderzoek dat al in Nederland wordt
      uitgevoerd,

      2°. dat een opzet heeft waarbij rekening is gehouden met de toepasbaarheid van de te ontwikkelen kennis,

      3°. dat een looptijd heeft van ten hoogste vier jaar, behoudens het geval, bedoeld in
      [artikel 9, tweede lid][ref3],

      4°. dat leidt tot het ontwikkelen van wetenschappelijk inzicht, technologische of maatschappelijke concepten,
      innovatieve toepassingen, dan wel competenties, en

      5°. waarvan de kennis die daarmee wordt verkregen op niet-discriminerende basis aan ondernemingen in de Europese
      Unie wordt verspreid of overgedragen;

      h. fundamenteel onderzoek: het uitbreiden van de algemene wetenschappelijke en technische kennis, zonder
      industriële of commerciële doelstellingen;

      i. industrieel onderzoek: het opdoen van nieuwe kennis met het doel deze te gebruiken bij de ontwikkeling van
      nieuwe producten, processen, competenties of diensten of om bestaande producten, processen, competenties of
      diensten aanmerkelijk te verbeteren;

      j. preconcurrentiële ontwikkeling: de omzetting van de resultaten van industrieel onderzoek in plannen, schema's
      of ontwerpen voor nieuwe, gewijzigde, verbeterde of alternatieve producten, processen, competenties of diensten,
      met inbegrip van de fabricage van een eerste prototype, demonstratie- of modelproject dat niet voor commerciële
      doeleinden kan worden aangewend;

      k. penvoerende aanvrager: de deelnemer aan een kennisconsortium zonder rechtspersoonlijkheid die mede namens de
      andere deelnemers als indiener van de aanvraag om subsidie in de zin van dit besluit is opgetreden en die het
      kennisconsortium vertegenwoordigt bij het contact met de bevoegde minister omtrent de aanvraag en de verdere
      uitvoering van dit besluit;

      l. regieorgaan: een instantie, aangewezen in de ministeriële regeling, bedoeld in het vierde lid;

      m. basissubsidie: de geldmiddelen die een minister onder door hem gestelde voorschriften ter beschikking stelt als
      bijdrage in de exploitatie- en investeringskosten van een universiteit of onderzoeksinstelling;

      n. doelsubsidie: de geldmiddelen die een minister ter beschikking stelt als vergoeding voor de exploitatie-
      en investeringskosten die een universiteit of onderzoeksinstelling maakt voor door de minister aangegeven
      activiteiten.

      2 De ministerraad wijst voor elke aanvraag de bevoegde minister aan die de besluiten neemt tot subsidieverlening
      behoudens in het geval, bedoeld in [artikel 11][ref4], tot voorschotverstrekking en tot subsidievaststelling en die
      de andere in dit besluit aan hem toegekende bevoegdheden heeft.

      3 Bij ministeriële regeling wijst de Minister van Economische Zaken, in overeenstemming met de andere ministers die
      het aangaat, de kennisgebieden aan waarop het onderzoek dat in de kennisprojecten zal worden uitgevoerd, betrekking
      heeft.

      4 Bij ministeriële regeling kan de Minister van Economische Zaken, in overeenstemming met de andere ministers
      die het aangaat, een instantie aanwijzen die aanvragen van kennisconsortia om subsidie voor kennisprojecten
      die betrekking hebben op bij de ministeriële regeling te bepalen zwaartepunten binnen een daarbij aan te geven
      kennisgebied, gebundeld indient en de desbetreffende kennisconsortia vertegenwoordigt bij het contact met de
      bevoegde minister omtrent de aanvraag en de verdere uitvoering van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0014472#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0014472#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0014472#Artikel9
