  - number: '11'
    text: |-
      De Minister van Economische Zaken beslist in ieder geval afwijzend op een aanvraag indien:

      a. de aanvraag niet voldoet aan de [artikelen 1][ref1] en [2][ref2] en [7][ref3] en [8 van dit besluit][ref4];

      b. de aanvraag is ontvangen na de periode, bedoeld in [artikel 7, eerste lid][ref5];

      c. de aanvraag een kennisproject betreft dat betrekking heeft op een krachtens [artikel 1, vierde lid][ref6],
      aangewezen zwaartepunt:

      1°. en de aanvraag door het desbetreffende regieorgaan is ontvangen na de datum, bedoeld in
      [artikel 8, vijfde lid][ref7], of

      2°. waarbij het desbetreffende regieorgaan de aanvraag niet heeft ingediend en de aanvrager bij zijn aanvraag niet
      de in [artikel 8, derde lid][ref8], bedoelde mededeling alsmede zijn gemotiveerde reactie daarop heeft gevoegd;

      d. hij het onaannemelijk acht dat het kennisproject binnen vier jaar kan worden uitgevoerd en de aanvrager geen
      toestemming voor een langere looptijd als bedoeld in [artikel 9, tweede lid][ref9], heeft gevraagd;

      e. hij de projectkosten raamt op minder dan een door de Minister van Economische Zaken bij ministeriële regeling te
      bepalen bedrag.


