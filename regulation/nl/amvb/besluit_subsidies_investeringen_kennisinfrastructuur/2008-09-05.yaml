        artikel: '16'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0014472
        artikel: '7'
        paragraaf: '2'
  - number: '21'
    text: |-
      De bevoegde minister kan afwijzend beschikken op een aanvraag, indien de subsidie-ontvanger niet heeft voldaan aan
      ingevolge de subsidieverlening voor hem geldende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0014472/2008-09-05#Artikel21
  - number: '22'
    text: |-
      1 De subsidie-ontvanger dient zijn aanvraag om subsidievaststelling bij de bevoegde minister in binnen dertien
      weken na het tijdstip waarop het kennisproject ingevolge [artikel 14, eerste lid][ref1], moet zijn voltooid.
      [Artikel 20, vierde lid][ref2], is van overeenkomstige toepassing.

      2 De aanvraag wordt ingediend met gebruikmaking van het origineel van een ondertekend formulier, dat is opgenomen
      in bijlage 3 bij de ministeriële regeling, bedoeld in [artikel 7, eerste lid][ref3].

      3 De aanvraag gaat vergezeld van een eindverslag omtrent de uitvoering en de resultaten van het kennisproject,
      overeenkomstig hetgeen in het formulier is vermeld.

      4 De aanvraag gaat tevens vergezeld van een accountantsverklaring. De Minister van Economische Zaken kan, in
      overeenstemming met de andere ministers die het aangaat, bij ministeriële regeling regels stellen met betrekking
      tot het onderzoek op grond waarvan een accountant een verklaring afgeeft of de te onderzoeken aspecten betreffende
      de uitvoering en de resultaten van het kennisproject.

      5 Indien op grond van [artikel 14, vierde lid][ref4], bij de subsidieverlening de verplichting is opgelegd tot het
      houden van een evaluatie door een externe evaluatiecommissie, kan de subsidie-ontvanger in de aanvraag aangeven dat
      evaluatieverslag te beschouwen als zijn eindverslag, bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0014472#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0014472#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0014472#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0014472#Artikel14
    url: https://wetten.overheid.nl/BWBR0014472/2008-09-05#Artikel22
