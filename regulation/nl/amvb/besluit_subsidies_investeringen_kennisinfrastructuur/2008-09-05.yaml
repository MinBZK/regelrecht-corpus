  - number: '7'
    text: |-
      1 Aanvragen om subsidie op grond van dit besluit moeten zijn ontvangen in een door de Minister van Economische
      Zaken bij ministeriële regeling te bepalen periode.

      2 De aanvraag gaat, overeenkomstig hetgeen in het formulier, vastgesteld in bijlage 1 bij de ministeriële regeling,
      bedoeld in het eerste lid, is vermeld, vergezeld van:

      a. een projectplan,

      b. een begroting voor het kennisproject,

      c. de statuten of reglementen van het kennisconsortium, dan wel de overeenkomst waarin de samenwerking tussen de
      deelnemers aan het kennisconsortium is geregeld,

      d. in voorkomend geval een draagkrachtige motivering voor het verzoek om toestemming, bedoeld in
      [artikel 9, eerste of tweede lid][ref1], en

      e. andere in de ministeriële regeling aangegeven bescheiden.

      3 Het projectplan en de begroting zijn in het Nederlands of het Engels opgesteld. Indien zij in het Nederlands zijn
      opgesteld, gaan zij vergezeld van een Engelse vertaling.

      4 Het projectplan bevat in ieder geval:

      a. een opgave van de deelnemers aan het kennisconsortium;

      b. een beschrijving van de situatie aan het begin van de uitvoering van het kennisproject, van het doel van het
      kennisproject, van de wijze waarop het doel van het kennisproject zal worden bereikt, van de opzet van het daartoe
      uit te voeren onderzoek, waarbij de gehele looptijd van het kennisproject wordt beschreven, van de kennis, ervaring
      of andere middelen die elk van de deelnemers aan het kennisconsortium inbrengt om dat doel te bereiken en van de
      wijze waarop de voortgang en het resultaat van het kennisproject getoetst worden;

      c. een met redenen omklede verklaring dat het uit te voeren onderzoek als fundamenteel of industrieel onderzoek
      aangemerkt kan worden, alsmede in voorkomend geval een beschrijving van het deel van het kennisproject dat
      betrekking heeft op preconcurrentiële ontwikkeling;

      d. een beschrijving van de wijze waarop de kennis en de resultaten die worden verkregen door het kennisproject,
      worden verspreid en op anderen overgedragen, en van de wijze waarop ten aanzien van de rechten van intellectuele
      eigendom [artikel 17][ref2] zal worden toegepast;

      e. een beschrijving van de overige gegevens die nodig zijn om te beoordelen of de aanvraag niet op grond van
      [artikel 12, tweede lid][ref3], wordt afgewezen dan wel om te bepalen in hoeverre de aanvraag voldoet aan de
      criteria, bedoeld in [artikel 12, derde lid][ref4].

      5 In de begroting wordt in ieder geval aangegeven:

      a. welke projectkosten kunnen worden toegerekend aan fundamenteel of industrieel onderzoek en welke aan
      preconcurrentiële ontwikkeling en

      b. wat gedurende de looptijd van het kennisproject de jaarlijkse bijdrage is van de deelnemers aan het
      kennisconsortium als totaal en uitgesplitst per afzonderlijke deelnemer.

      6 Indien de aanvraag een kennisproject betreft dat wordt uitgevoerd door een kennisconsortium dat geen
      rechtspersoonlijkheid bezit, dient de penvoerende aanvrager de aanvraag mede namens de andere deelnemers in.


