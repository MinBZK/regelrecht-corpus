  - number: '19'
    text: |-
      1 Op een subsidie ter zake waarvan een beschikking tot subsidieverlening geldt, kunnen op aanvraag van de subsidie-
      ontvanger door de bevoegde minister voorschotten worden verstrekt.

      2 De bevoegde Minister verstrekt op aanvraag van de subsidie-ontvanger aan hem een voorschot naar rato van
      de gemaakte en betaalde kosten vermeerderd met het bedrag aan verplichtingen die door subsidie-ontvanger zijn
      aangegaan en die naar verwachting in het kalenderjaar waarin de aanvraag wordt gedaan tot uitbetaling zullen
      leiden, voor zover over deze betaalde kosten en verplichtingen niet reeds eerder een voorschot is verstrekt. Geen
      voorschot wordt verstrekt voor zover het totaal van het gevraagde voorschot en de reeds verstrekte voorschotten,
      gemiddeld per kalenderjaar meer zou bedragen dan 20 procent van het bij subsidieverlening vermelde maximale
      subsidiebedrag. In totaal bedraagt het bedrag aan voorschotten ten hoogste 80 procent van het bij subsidieverlening
      vermelde maximale subsidiebedrag. Ten behoeve van de subsidiëring van een deelnemer aan een kennisconsortium wiens
      activiteiten geheel zijn afgerond, kan de Minister afwijken van het laatstgenoemde percentage.

      3 Bij de toepassing van het tweede lid wordt de opslag, bedoeld in [artikel 4, eerste lid, onder b][ref1], geacht
      gemaakt en betaald te zijn voor zover de kosten waarover hij wordt berekend gemaakt en betaald zijn.

      4 Een voorschot wordt slechts verstrekt, indien het bedrag aan voorschot ten minste een door de Minister van
      Economische Zaken bij ministeriële regeling te bepalen bedrag bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0014472#Artikel4
    url: https://wetten.overheid.nl/BWBR0014472/2008-09-05#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0014472
        artikel: '4'
        paragraaf: '1'
  - number: '20'
    text: |-
      1 Het kennisconsortium dient een aanvraag om een voorschot in gelijktijdig met het uitbrengen van een verslag als
      bedoeld in [artikel 16, eerste lid][ref1].

      2 Indien het kennisconsortium binnen een kalenderjaar meer dan één aanvraag om een voorschot indient en de aanvraag
      om die reden niet overeenkomstig het eerste lid wordt ingediend, dan wordt bij die aanvraag een kort verslag
      gevoegd omtrent de uitvoering van het kennisproject, met inbegrip van een vergelijking van die uitvoering met het
      projectplan en de bij de subsidieverlening vermelde raming van de projectkosten.

      3 De aanvraag wordt ingediend met gebruikmaking van het origineel van een ondertekend formulier, dat is opgenomen
      in bijlage 2 bij de ministeriële regeling, bedoeld in [artikel 7, eerste lid][ref2].

      4 Indien de aanvraag een kennisproject betreft dat wordt uitgevoerd door een kennisconsortium dat geen
      rechtspersoonlijkheid bezit, dient de penvoerende aanvrager de aanvraag mede namens de andere deelnemers in.


      [ref1]: https://wetten.overheid.nl/BWBR0014472#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0014472#Artikel7
    url: https://wetten.overheid.nl/BWBR0014472/2008-09-05#Artikel20
    references:
