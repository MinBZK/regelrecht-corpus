  - number: '4'
    text: |-
      1 Als projectkosten worden uitsluitend in aanmerking genomen:

      a. de volgende rechtstreeks aan de uitvoering van het kennisproject toe te rekenen, na de indiening van de aanvraag
      door de subsidie-ontvanger gemaakte en betaalde kosten:

      1°. loonkosten, met dien verstande dat wordt uitgegaan van een uurloon, berekend op basis van het jaarloon bij
      een volledige dienstbetrekking volgens de kolom «loon voor de loonbelasting» van de loonstaat van het direct
      bij het kennisproject betrokken personeel, verhoogd met de wettelijke dan wel de op grond van een individuele of
      collectieve arbeidsovereenkomst verschuldigde opslagen voor sociale lasten, en van 1650 productieve uren per jaar;

      2°. kosten van de voor het kennisproject aangeschafte machines en apparatuur;

      3°. kosten van het gebruik voor het kennisproject van machines en apparatuur die in het bezit zijn van een
      deelnemer aan het kennisproject of van derden;

      4°. kosten van verbruikte materialen en hulpmiddelen, gebaseerd op historische aanschafprijzen;

      5°. kosten die worden gemaakt voor de verspreiding en overdracht van de kennis die door middel van het
      kennisproject wordt verkregen en voor de verwerving en instandhouding van intellectuele eigendomsrechten op de
      resultaten van het kennisproject die daarvoor in aanmerking komen, behoudens voor intellectuele eigendomsrechten
      die met toepassing van [artikel 17, eerste lid, onder a][ref1], rechtstreeks door een ondernemer worden verworven;

      b. een opslag voor overige algemene kosten, groot ten hoogste 50 procent van de onder a, onder 1°, bedoelde kosten.

      2 Kosten van machines en apparatuur die niet uitsluitend voor het kennisproject zijn aangeschaft of worden
      gebruikt, worden slechts als projectkosten op de voet van het eerste lid, onderdeel a, onder 2° en 3°, in
      aanmerking genomen indien een door middel van een sluitende tijdschrijving vastgestelde urenverantwoording per
      machine respectievelijk van de apparatuur aanwezig is.

      3 Indien geen loonkosten als bedoeld in het eerste lid, onder a, onder 1°, worden gemaakt, maar niettemin arbeid
      ten behoeve van het kennisproject wordt verricht, wordt voor de berekening van de projectkosten uitgegaan van een
      door de Minister van Economische Zaken bij ministeriële regeling vast te stellen uurtarief.

      4 Als projectkosten worden niet in aanmerking genomen de in het eerste lid genoemde kosten die kunnen worden
      toegerekend aan het onderdeel van het kennisproject dat betrekking heeft op preconcurrentiële ontwikkeling.

      5 Voor de toepassing van het eerste lid worden winstopslagen bij transacties binnen een groep alleen in aanmerking
      genomen voor zover het gebruikelijk is die winstopslagen ook bij soortgelijke transacties buiten de groep in
      rekening te brengen.

      6 De kosten worden in aanmerking genomen met inbegrip van omzetbelasting, indien de subsidie-ontvanger die de
      kosten heeft gemaakt omzetbelasting niet in aftrek kan brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0014472#Artikel17
