$id: besluit_uitvoering_eg_ozonrichtlijn
regulatory_layer: AMVB
publication_date: '2007-11-01'
valid_from: '1997-11-19'
bwb_id: BWBR0007562
url: https://wetten.overheid.nl/BWBR0007562/1997-11-19
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 18 april 1995,

    nr. MJZ 128495033, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Gelet op richtlijn nr. 92/72/EEG van de Raad van de Europese Gemeenschappen van 21 september 1992 betreffende de
    verontreiniging van de lucht door ozon (PbEG L 297) en op de artikelen 53, in samenhang met artikel 48, derde lid,
    en 59, eerste lid, van de Wet inzake de luchtverontreiniging;

    De Raad van State gehoord (advies van 11 juli 1995, nr. W08.95.0196);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 11
    september 1995, nr. MJZ 95007593, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0007562/1997-11-19#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. wet: [Wet inzake de luchtverontreiniging][ref1];

      b. richtlijn: [richtlijn nr. 92/72/EEG](31992L0072) van de Raad van de Europese Gemeenschappen van 21 september
      1992 betreffende de verontreiniging van de lucht door ozon (*PbEG* L 297);

      c. rijksinstituut: Rijksinstituut voor volksgezondheid en milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0002731
    url: https://wetten.overheid.nl/BWBR0007562/1997-11-19#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002731
  - number: '2'
    text: |-
      1 Het rijksinstituut is belast met de uitvoering van de [artikelen 4, eerste lid][ref1], uitgezonderd de tweede
      volzin, en tweede lid, en 6 van de richtlijn.

      2 Het eerste lid is niet van toepassing op de verplichting, bedoeld in artikel 6, eerste lid, van de richtlijn,
      tot het jaarlijks aan de Europese Commissie verstrekken van de in dat lid bedoelde informatie. Onze Minister van
      Volkhuisvesting, Ruimtelijke Ordening en Milieubeheer draagt zorg voor de uitvoering van de in de eerste volzin
      bedoelde verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0007562#Artikel4
    url: https://wetten.overheid.nl/BWBR0007562/1997-11-19#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007562
        artikel: '4'
  - number: '3'
    text: |-
      1 De meetstations, bedoeld in artikel 3 van de richtlijn, zijn de meetstations voor meting van ozonconcentraties op
      leefniveau van het Landelijk Meetnet Luchtkwaliteit, in beheer bij het rijksinstituut.

      2 Onze Minister maakt de locaties van de in het eerste lid bedoelde meetstations bekend in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0007562/1997-11-19#Artikel3
  - number: '4'
    text: |-
      Voor de meting van ozonconcentraties als bedoeld in artikel 4, eerste lid, van de richtlijn gebruikt het
      rijksinstituut de in bijlage V bij de richtlijn aangegeven referentiemethode.
    url: https://wetten.overheid.nl/BWBR0007562/1997-11-19#Artikel4
  - number: '5'
    text: |-
      De berekening door het rijksinstituut van de gegevens, bedoeld in artikel 6, eerste lid, eerste gedachtenstreepje,
      van de richtlijn, geschiedt overeenkomstig bijlage III bij de richtlijn.
    url: https://wetten.overheid.nl/BWBR0007562/1997-11-19#Artikel5
  - number: '6'
    text: |-
      1 Bij overschrijding van de drempelwaarde voor het informeren van de bevolking, bedoeld in artikel 1, tweede lid,
      derde gedachtenstreepje, van de richtlijn, en bij overschrijding van de drempelwaarde voor de alarmering van de
      bevolking, bedoeld in artikel 1, tweede lid, vierde gedachtenstreepje, van de richtlijn, laat Onze Commissaris in
      de provincie waarin de overschrijding is geconstateerd daarvan mededeling doen, overeenkomstig artikel 48, derde
      lid, van de wet.

      2 Mededelingen als bedoeld in het eerste lid, bevatten in ieder geval de informatie, bedoeld in bijlage IV bij
      de richtlijn.
    url: https://wetten.overheid.nl/BWBR0007562/1997-11-19#Artikel6
  - number: '7'
    text: |-
      Een wijziging van de richtlijn of bijlage bij de richtlijn treedt voor de toepassing van dit besluit in werking met
      ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uiterlijk uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0007562/1997-11-19#Artikel7
  - number: '8'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0007562/1997-11-19#Artikel8
  - number: '9'
    text: 'Dit besluit wordt aangehaald als: Besluit uitvoering EG-ozonrichtlijn.'
    url: https://wetten.overheid.nl/BWBR0007562/1997-11-19#Artikel9
