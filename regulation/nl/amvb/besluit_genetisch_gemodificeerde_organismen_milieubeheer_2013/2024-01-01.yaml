  - number: '6.18'
    text: |-
      Onze Minister publiceert jaarlijks langs elektronische weg een overzicht van de beschikkingen, besluiten,
      aanbevelingen en adviezen van de Raad van de Europese Unie of van de Europese Commissie die van belang zijn voor de
      toepassing van dit besluit.
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel6.18
  - number: '6.19'
    text: Het Besluit genetisch gemodificeerde organismen milieubeheer wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel6.19
  - number: '6.20'
    text: |-
      Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende
      artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel6.20
