  - number: '2.9'
    text: |-
      1 In aanvulling op [artikel 4:5 van de Algemene wet bestuursrecht][ref1] verstrekt de gebruiker desverzocht aan
      Onze Minister binnen de daartoe door Onze Minister gestelde termijn nadere informatie ter voorbereiding van het
      besluit op een verzoek als bedoeld in [artikel 2.8][ref2].

      2 Indien Onze Minister om nadere informatie heeft verzocht, wordt de termijn, bedoeld in
      [artikel 2.8, zesde lid][ref3], opgeschort totdat Onze Minister de nadere gegevens heeft ontvangen.
      Indien een verzoek op grond van artikel 2.8, eerste of tweede lid, is gedaan in combinatie met
      een kennisgeving of een aanvraag van een vergunning als bedoeld in titel 2.2, wordt de termijn,
      bedoeld in [artikel 2.17, eerste of derde lid][ref4], onderscheidenlijk de termijn, bedoeld in
      [artikel 2.37, eerste lid][ref5], mede opgeschort totdat Onze Minister de nadere gegevens heeft ontvangen.

      3 Indien de gevraagde nadere informatie niet binnen de gestelde termijn is ontvangen, kan Onze Minister besluiten
      het verzoek op grond van [artikel 2.8][ref6] niet of niet verder te behandelen. Onze Minister kan tevens besluiten
      om de kennisgeving die in combinatie met het verzoek op grond van artikel 2.8 is gedaan, aan te merken als niet
      gedaan, dan wel de aanvraag om een vergunning die in combinatie met het verzoek op grond van artikel 2.8 is gedaan,
      niet of niet verder te behandelen.

      4 Onze Minister stelt de verzoeker onverwijld op de hoogte van een besluit als bedoeld in het derde lid.


