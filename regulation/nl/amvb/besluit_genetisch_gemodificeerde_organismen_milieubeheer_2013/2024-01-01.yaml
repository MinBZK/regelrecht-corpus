    text: |-
      1 Op de aanvraag om wijziging van een vergunning op grond van [artikel 3.21, eerste lid][ref1], zijn de
      [artikelen 3.7 tot en met 3.9][ref2] en [3.11][ref3] van overeenkomstige toepassing, met dien verstande dat
      de gegevens, aangewezen bij of krachtens [artikel 3.7, tweede en derde lid][ref4], slechts behoeven te worden
      overgelegd voor zover deze gegevens van betekenis zijn voor de wijziging.

      2 Onze Minister beslist op de aanvraag tot wijziging of intrekking van de vergunning binnen acht weken na ontvangst
      van het verzoek.

      3 Tenzij de vereiste spoed zich daartegen verzet, wordt de houder van de vergunning gehoord alvorens een ambtshalve
      besluit op grond van [artikel 3.21, eerste lid][ref5], wordt genomen.

      4 Een ambtshalve besluit tot het wijzigen of intrekken van een vergunning als bedoeld in
      [artikel 3.21, tweede lid][ref6], wordt zo spoedig mogelijk genomen.

      5 Het besluit wordt bekendgemaakt in een van overheidswege uitgegeven blad of een dag-, nieuws- of huis-aan-huis-
      blad, dan wel op een andere geschikte wijze.


