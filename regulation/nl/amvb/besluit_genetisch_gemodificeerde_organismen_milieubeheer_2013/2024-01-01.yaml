  - number: '6.10'
    text: |-
      Een op het tijdstip van inwerkingtreding van dit besluit geldende vergunning krachtens
      [artikel 23, eerste lid, van het Besluit genetisch gemodificeerde organismen milieubeheer][ref1], zoals dit
      laatstelijk gold, wordt aangemerkt als:

      a. een vergunning als bedoeld in [artikel 3.2][ref2] van dit besluit, indien de vergunning betrekking heeft op de
      doelbewuste introductie voor overige doeleinden;

      b. een vergunning als bedoeld in [artikel 4.2][ref3] van dit besluit, indien de vergunning betrekking heeft op de
      doelbewuste introductie door het in de handel brengen.


