  - number: '2.30'
    text: |-
      1 Indien op basis van de risicobeoordeling inperkingsniveau I wordt toegekend in plaats van inperkingsniveau II,
      stelt de gebruiker Onze Minister daarvan onmiddellijk op de hoogte.

      2 De categorie van fysische inperking op inperkingsniveau II blijft van toepassing totdat Onze Minister
      heeft ingestemd met de verlaging van het inperkingsniveau. De instemming is een besluit als bedoeld in
      [artikel 20.3, tweede lid, onderdeel b, van de wet][ref1].

      3 Onze Minister kan aan zijn instemming voorschriften verbinden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel20.3
