  - number: '3.25'
    text: |-
      1 [Afdeling 3.4 van de Algemene wet bestuursrecht][ref1] en [afdeling 13.2 van de wet][ref2] zijn niet van
      toepassing op de voorbereiding van de beschikking op de aanvraag voor andere toepassingen dan genetisch
      gemodificeerde planten.

      2

      3 Bij regeling van Onze Minister worden regels gesteld over de inhoud van de aanvraag om een vergunning.

      4 Onze Minister kan toestaan dat een enkele aanvraag wordt ingediend voor hetzelfde genetisch gemodificeerde
      organisme dat op dezelfde plaats of op verschillende plaatsen voor hetzelfde doel en binnen een beperkte periode
      doelbewust wordt geïntroduceerd.

      5 Onze Minister tekent de datum van ontvangst aan op de aanvraag en zendt de aanvrager onverwijld een bewijs van
      ontvangst waarin die datum is vermeld.

      6 Onze Minister kan de aanvrager opdragen nadere gegevens te verstrekken.
      [Artikel 3.8, tweede tot en met vierde lid][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
