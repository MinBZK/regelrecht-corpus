  - number: 3.26a
    text: |-
      1 Dit artikel is van toepassing op een aanvraag voor toepassingen van medicinale stoffen en preparaten die
      bestaan uit genetisch gemodificeerde organismen of die deze bevatten, voor gebruik door de mens waarvoor een
      gestandaardiseerde milieurisicobeoordeling is vastgesteld en die bij ministeriële regeling zijn aangewezen.

      2 Onze Minister zendt zo spoedig mogelijk na ontvangst van de aanvraag een samenvatting van de aanvraag naar de
      Europese Commissie.

      3 Onze Minister beslist op een aanvraag als bedoeld in het eerste lid binnen 56 dagen na ontvangst van de aanvraag.
      De beslissing is een besluit als bedoeld in [artikel 20.3, tweede lid, onderdeel b, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel20.3
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel3.26a
    references:
