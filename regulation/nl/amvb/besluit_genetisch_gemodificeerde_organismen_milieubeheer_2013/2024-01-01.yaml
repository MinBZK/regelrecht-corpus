        artikel: '20.3'
  - number: 3.10a
    text: |-
      1 [Afdeling 3.4 van de Algemene wet bestuursrecht][ref1], [afdeling 13.2 van de wet][ref2] en [artikel 3.10][ref3]
      zijn niet van toepassing op de voorbereiding van de beslissing op een aanvraag voor toepassingen van medicinale
      stoffen en preparaten die bestaan uit genetisch gemodificeerde organismen of die deze bevatten, voor gebruik
      door de mens indien voor de aanvraag uitsluitend gebruik wordt gemaakt van gegevens of resultaten van een eerdere
      aanvraag om een vergunning van een andere aanvrager als bedoeld in [artikel 3.7, zesde lid][ref4], die is verleend.

      2 Onze Minister zendt binnen 30 dagen na ontvangst van een aanvraag als bedoeld in het eerste lid een samenvatting
      van de aanvraag aan de Europese Commissie.

      3 Onze Minister beslist op een aanvraag als bedoeld in het eerste lid binnen 28 dagen na ontvangst van de aanvraag.
      De beslissing is een besluit als bedoeld in [artikel 20.3, tweede lid, onderdeel b, van de wet][ref5].


