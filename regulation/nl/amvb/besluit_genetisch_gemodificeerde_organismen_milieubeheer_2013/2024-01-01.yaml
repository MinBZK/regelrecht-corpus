  - number: 4.9a
    text: |-
      1 Onze Minister besluit een aanvraag om een vergunning niet of niet verder te behandelen indien die aanvraag
      niet ontvankelijk is op grond van artikel 32 ter, vierde lid, eerste alinea, of vijfde lid, eerste alinea, van
      [verordening 178/2002](32002R0178).

      2 De aanvraag kan niet worden aangevuld en [artikel 4.9][ref1] blijft buiten toepassing tenzij binnen een door
      Onze Minister gegeven termijn een geldige reden wordt gegeven voor het niet aan de Europese Autoriteit voor
      voedselveiligheid melden of niet opnemen in de aanvraag van studies die dienen ter ondersteuning van die aanvraag.

      3 De termijn van 90 dagen in [artikel 4.11, eerste lid][ref2], gaat voor een nieuwe aanvraag lopen met ingang
      van de dag waarop 6 maanden zijn verstreken na de kennisgeving of overlegging van de studies als bedoeld in
      artikel 32 ter, vierde lid, tweede alinea, onderscheidenlijk vijfde lid, tweede alinea, van [verordening 178/2002]
      (32002R0178).


      [ref1]: https://wetten.overheid.nl/BWBR0035090#Artikel4.9
      [ref2]: https://wetten.overheid.nl/BWBR0035090#Artikel4.11
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel4.9a
