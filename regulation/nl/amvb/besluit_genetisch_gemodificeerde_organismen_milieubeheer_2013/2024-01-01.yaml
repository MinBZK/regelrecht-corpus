        artikel: '3.15'
        hoofdstuk: '3'
        paragraaf: 3.2.4
        afdeling: '3.2'
  - number: '3.17'
    text: |-
      Onze Minister kan een vergunning wijzigen op een daartoe strekkende aanvraag van de houder van de vergunning,
      indien deze aanvraag betrekking heeft op een geval dat behoort tot de categorieën van gevallen, aangewezen
      krachtens:

      a. [artikel 3.15, onder a][ref1], en de verandering bestaat uit het vervangen of toevoegen van een of meer locaties
      voor de doelbewuste introductie voor overige doeleinden;

      b. [artikel 3.15, onder b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0035090#Artikel3.15
      [ref2]: https://wetten.overheid.nl/BWBR0035090#Artikel3.15
