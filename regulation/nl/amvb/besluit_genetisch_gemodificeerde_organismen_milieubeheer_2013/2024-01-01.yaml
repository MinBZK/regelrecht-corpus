  - number: '1.5'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

        - *categorie van fysische inperking:* een specifieke combinatie van inperkingsmaatregelen overeenkomstig
      [bijlage 4][ref1] en door Onze Minister krachtens [artikel 2.2][ref2] gestelde regels;
        - *doelbewuste introductie voor overige doeleinden:* doelbewuste introductie anders dan het in de handel brengen;
        - *eindverbruiker:* uiteindelijke verbruiker die het product niet in het kader van een zakelijke transactie of
      activiteit gebruikt;
        - *genetisch materiaal:* desoxyribonucleïnezuur (DNA) en ribonucleïnezuur (RNA);
        - *ggo-gebied:* deel van een locatie waarop milieubelastende activiteiten als bedoeld in
      [artikel 3.246 van het Besluit activiteiten leefomgeving][ref3] worden verricht, waar categorieën van fysische
      inperking liggen en die beperkt toegankelijk is;
        - *in de handel brengen:* het ter beschikking stellen van genetisch gemodificeerde organismen aan derden;
        - *inperkingsmaatregelen:* maatregelen van fysische, chemische of biologische aard die aanwezig zijn of worden
      toegepast, in combinatie met andere beschermingsmaatregelen om het contact van genetisch gemodificeerde organismen
      met mens en milieu te beperken, overeenkomstig door Onze Minister krachtens [artikel 2.2][ref4] gestelde regels;
        - *inperkingsniveau I:* combinaties van inperkingsmaatregelen die een passende bescherming bieden voor het
      ingeperkt gebruik met genetisch gemodificeerde organismen die geen of een verwaarloosbaar risico voor de gezondheid
      van de mens en het milieu inhouden, overeenkomstig door Onze Minister krachtens [artikel 2.2][ref5] gestelde
      regels;
        - *inperkingsniveau II:* combinaties van inperkingsmaatregelen die een passende bescherming bieden voor het
      ingeperkt gebruik met genetisch gemodificeerde organismen die weinig risico voor de gezondheid van de mens en het
      milieu inhouden, overeenkomstig door Onze Minister krachtens [artikel 2.2][ref6] gestelde regels;
        - *inperkingsniveau III:* combinaties van maatregelen die een passende bescherming bieden voor het ingeperkt
      gebruik met genetisch gemodificeerde organismen die enig risico voor de gezondheid van de mens en het milieu
      inhouden, overeenkomstig door Onze Minister krachtens [artikel 2.2][ref7] gestelde regels;
        - *inperkingsniveau IV:* combinaties van maatregelen die een passende bescherming bieden voor het ingeperkt gebruik
      met genetisch gemodificeerde organismen die veel risico voor de gezondheid van de mens en het milieu inhouden,
      overeenkomstig door Onze Minister krachtens [artikel 2.2][ref8] gestelde regels;
        - *insertie:* genetisch materiaal dat door middel van technieken van genetische modificatie aan het genetisch
      materiaal van de gastheer wordt of is toegevoegd;
        - *lidstaat:* lidstaat van de Europese Unie alsmede een andere staat die partij is bij de Overeenkomst betreffende
      de Europese Economische Ruimte;
        - *micro-organisme:* elke cellulaire of niet-cellulaire micro-biologische entiteit met het vermogen tot replicatie
      of tot overbrenging van genetisch materiaal, met inbegrip van virussen, viroïden en dierlijke en plantencellen
      in cultuur;
        - *milieurisicobeoordeling:* beoordeling, overeenkomstig bijlage II bij [richtlijn 2001/18](32001L0018), zoals
      aangevuld met daarop betrekking hebbende besluiten of aanbevelingen van de Raad van de Europese Unie of van
      de Europese Commissie, van zowel directe als indirecte, onmiddellijk of vertraagd optredende risico’s voor de
      menselijke gezondheid en het milieu welke de doelbewuste introductie van genetisch gemodificeerde organismen met
      zich mee kan brengen;
        - *organisme:* micro-organisme of andere biologische entiteit met het vermogen tot replicatie of tot overbrenging
      van genetisch materiaal;
        - *richtlijn 2001/18:* [richtlijn nr. 2001/18/EG](32001L0018) van het Europees Parlement en de Raad van de Europese
      Unie van 12 maart 2001 inzake de doelbewuste introductie van genetisch gemodificeerde organismen in het milieu en
      tot intrekking van [richtlijn nr. 90/220/EEG](31990L0220) van de Raad van de Europese Gemeenschappen van 23 april
      1990 (PbEU L 106);
        - *richtlijn 2009/41:* [richtlijn nr. 2009/41/EG](32009L0041) van het Europees Parlement en de Raad van de Europese
      Unie van 6 mei 2009 inzake het ingeperkt gebruik van genetisch gemodificeerde micro-organismen (PbEU L 125);
        - *risicobeoordeling:* beoordeling van risico’s voor de gezondheid van de mens of het milieu welke ingeperkt
      gebruik van genetisch gemodificeerde organismen met zich mee kan brengen;
        - *vector:* nucleïnezuur dat gebruikt wordt om genetisch materiaal aan een gastheer toe te voegen, dan wel om het
      genetisch materiaal van de gastheer op andere wijze te modificeren;
        - *verordening 178/2002:* [verordening (EG) 178/2002](32002R0178) van het Europees Parlement en de Raad van
      28 januari 2002 tot vaststelling van de algemene beginselen en voorschriften van de levensmiddelenwetgeving,
      tot oprichting van een Europese Autoriteit voor voedselveiligheid en tot vaststelling van procedures voor
      voedselveiligheidsaangelegenheden (PbEG 2002, L 31);
        - *verordening 726/2004:* [Verordening (EG) nr. 726/2004](32004R0726) van het Europees Parlement en de Raad van
      31 maart 2004, tot vaststelling van communautaire procedures voor het verlenen van vergunningen en het toezicht op
      geneesmiddelen voor menselijk en diergeneeskundig gebruik en tot oprichting van een Europees Geneesmiddelenbureau
      (PbEU 2004, L 136);
        - *verordening 1829/2003:* [verordening (EG) nr. 1829/2003](32003R1829) van het Europees Parlement en de Raad van
      de Europese Unie van 22 september 2003 inzake genetisch gemodificeerde levensmiddelen en diervoeders (PbEU L 268);
        - *verordening 1830/2003:* [verordening (EG) nr. 1830/2003](32003R1830) van het Europees Parlement en de Raad van
      de Europese Unie van 22 september 2003 betreffende de traceerbaarheid en etikettering van genetisch gemodificeerde
      organismen en de traceerbaarheid van met genetisch gemodificeerde organismen geproduceerde levensmiddelen en
      diervoeders en tot wijziging van [richtlijn 2001/18/EG](32001L0018) (PbEU L 268);
        - *verordening 1946/2003:* [verordening (EG) nr. 1946/2003](32003R1946) van het Europees Parlement en de Raad van
      de Europese Unie van 15 juli 2003 betreffende de grensoverschrijdende verplaatsing van genetisch gemodificeerde
      organismen (PbEU L 287);
        - *verordening 2020/1043:* [verordening (EU) 2020/1043](32943R2020) van het Europees Parlement en de Raad
      betreffende de uitvoering van klinische proeven met geneesmiddelen voor menselijk gebruik die geheel of
      gedeeltelijk uit genetisch gemodificeerde organismen bestaan en die bestemd zijn voor de behandeling of de
      voorkoming van de coronavirusziekte, alsmede de levering van die geneesmiddelen (PbEU 2020, L 231);
        - *wet:* [Wet milieubeheer][ref9].

      2 In dit besluit wordt verstaan onder bijlage: bij dit besluit behorende bijlage, voor zover niet anders is
      aangegeven.

      3 In [hoofdstuk 2][ref10] van dit besluit en de daarop berustende bepalingen wordt onder «gebruiker» verstaan
      elke natuurlijke of rechtspersoon die verantwoordelijk is voor het ingeperkt gebruik van genetisch gemodificeerde
      organismen, daaronder mede begrepen degene die voornemens is om ingeperkt gebruik te verrichten en die voor dat
      ingeperkt gebruik verantwoordelijk zal zijn.

      4 Tot het toekennen van een categorie van fysische inperking en een inperkingsniveau behoort tevens het aangeven
      van beschermingsmaatregelen, indien deze bij de risicobeoordeling in de beschouwing zijn betrokken.

      5 Onder «besluiten of aanbevelingen van de Raad van de Europese Unie of van de Europese Commissie» worden mede
      verstaan beschikkingen of adviezen van de Raad van de Europese Unie of van de Europese Commissie. Onder «besluit
      van de Raad van de Europese Unie of van de Europese Commissie» wordt mede verstaan een beschikking van de Raad van
      de Europese Unie of van de Europese Commissie.


