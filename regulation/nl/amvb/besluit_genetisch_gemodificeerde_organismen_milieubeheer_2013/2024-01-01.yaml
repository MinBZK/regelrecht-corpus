  - number: '4.21'
    text: |-
      1 De houder van een vergunning draagt zorg voor monitoring en rapportage overeenkomstig de in de vergunning
      opgenomen voorschriften.

      2 Hij dient de rapportage, bedoeld in het eerste lid, in bij Onze Minister, de Europese Commissie en de bevoegde
      instanties van de andere lidstaten van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel4.21
  - number: '4.22'
    text: |-
      1 Indien de houder van een vergunning kennis neemt van nieuwe informatie ten aanzien van de risico’s die de
      genetisch gemodificeerde organismen of de handelingen daarmee kunnen opleveren voor de gezondheid van de mens of
      het milieu, zorgt hij ervoor dat:

      a. daarvan onmiddellijk mededeling wordt gedaan aan Onze Minister, en

      b. onmiddellijk de maatregelen worden getroffen die in verband met die risico’s nodig zijn ter bescherming van de
      gezondheid van de mens of het milieu.

      2 De houder van de vergunning geeft zo nodig aan tot welke wijziging van de gegevens die bij de aanvraag om de
      vergunning zijn overgelegd, de nieuwe informatie leidt.

      3 Onze Minister tekent de datum van ontvangst aan op de mededeling en zendt aan de houder van de vergunning
      onverwijld een bewijs van ontvangst waarop de datum van ontvangst is vermeld.

      4 De houder van de vergunning vraagt zo nodig binnen vier weken na het doen van de mededeling een wijziging van de
      vergunning aan.

      5 [Artikel 4.9][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0035090#Artikel4.9
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel4.22
