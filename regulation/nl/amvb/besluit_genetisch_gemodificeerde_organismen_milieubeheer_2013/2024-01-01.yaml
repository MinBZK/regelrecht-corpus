  - number: '2.23'
    text: |-
      1 De gebruiker doet een kennisgeving aan Onze Minister indien de activiteiten blijkens de risicobeoordeling,
      bedoeld in [artikel 2.22, eerste lid][ref1], na wijziging zullen worden verricht:

      a. op inperkingsniveau I, in een categorie van fysische inperking die niet eerder aan Onze Minister is
      kennisgegeven, of

      b. op inperkingsniveau II.

      2 [Artikel 2.15, tweede tot en met vijfde lid][ref2], is van overeenkomstige toepassing, met dien verstande dat
      eerder door de gebruiker overgelegde gegevens niet opnieuw behoeven te worden overgelegd.

      3 Indien de activiteiten zullen worden verricht op inperkingsniveau III of IV, dient de gebruiker een aanvraag om
      een vergunning in bij Onze Minister overeenkomstig [afdeling 2.2.3][ref3].


