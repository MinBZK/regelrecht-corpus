        afdeling: 2.2.3
  - number: '2.52'
    text: |-
      Indien op basis van de risicobeoordeling inperkingsniveau I of II wordt toegekend, blijft de vergunning van
      toepassing totdat de vergunning dienovereenkomstig is gewijzigd of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel2.52
  - number: '2.53'
    text: |-
      1 Indien vijf jaren zijn verstreken sinds de laatste volledige risicobeoordeling, dan wel sinds de laatste
      toepassing van dit lid, beziet de gebruiker of de uitkomst van de risicobeoordeling, al dan niet vastgesteld met
      toepassing van [artikel 2.8][ref1], nog passend is.

      2 Indien blijkt dat mogelijk een andere categorie van fysische inperking of een ander inperkingsniveau
      moet worden toegepast, voert de gebruiker een risicobeoordeling als bedoeld in [artikel 2.5][ref2] uit. De
      [artikelen 2.6 tot en met 2.9][ref3] en [2.49 tot en met 2.52][ref4] zijn van overeenkomstige toepassing.

      3 Zo nodig vraagt de gebruiker een wijziging van zijn vergunning aan.


      [ref1]: https://wetten.overheid.nl/BWBR0035090#Artikel2.8
      [ref2]: https://wetten.overheid.nl/BWBR0035090#Artikel2.5
      [ref3]: https://wetten.overheid.nl/BWBR0035090#Artikel2.6
      [ref4]: https://wetten.overheid.nl/BWBR0035090#Artikel2.49
