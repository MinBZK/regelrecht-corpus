  - number: '2.2'
    text: |-
      1 Onze Minister stelt ter uitvoering van [richtlijn 2009/41](32009L0041) nadere regels met betrekking tot het
      ingeperkt gebruik.

      2 De regels hebben in elk geval betrekking op de beginselen van de risicobeoordeling en de inperkings- en andere
      beschermingsmaatregelen als bedoeld in de bijlagen III en IV bij [richtlijn 2009/41](32009L0041).
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel2.2
  - number: '2.3'
    text: |-
      Ingeperkt gebruik van genetisch gemodificeerde organismen is verboden, indien dit geschiedt in afwijking van het
      bepaalde bij of krachtens deze titel of titel 2.2.
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel2.3
  - number: '2.4'
    text: |-
      1 Als gegevens waarvoor de in [artikel 19.3, eerste lid, van de wet][ref1] bedoelde bevoegdheid tot het overleggen
      van een tweede tekst eveneens geldt, worden aangewezen de gegevens die krachtens dit hoofdstuk aan Onze Minister
      worden overgelegd.

      2 Het eerste lid is niet van toepassing op de gegevens, genoemd in artikel 18, tweede lid, van [richtlijn 2009/41]
      (32009L0041).


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel19.3
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '19.3'
  - number: '2.5'
    text: |-
      De gebruiker maakt voorafgaand aan het ingeperkt gebruik een risicobeoordeling met betrekking tot dat ingeperkt
      gebruik, overeenkomstig de daartoe door Onze Minister krachtens [artikel 2.2][ref1] gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0035090#Artikel2.2
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0035090
        artikel: '2.2'
        hoofdstuk: '2'
  - number: '2.6'
    text: |-
      1 De gebruiker bewaart een verslag van de risicobeoordeling als bedoeld in [artikel 2.5][ref1] en stelt dit in een
      passende vorm ter beschikking van Onze Minister, hetzij als onderdeel van een kennisgeving of een aanvraag om een
      vergunning als bedoeld in deze titel, hetzij op verzoek.

      2 Onze Minister kan nadere regels stellen met betrekking tot de inhoud en vorm van het verslag, alsmede met
      betrekking tot de termijn gedurende welke het verslag wordt bewaard.

      3 De gebruiker verstrekt desverzocht aan Onze Minister binnen de daartoe door Onze Minister gestelde termijn nadere
      informatie met betrekking tot de risicobeoordeling.


      [ref1]: https://wetten.overheid.nl/BWBR0035090#Artikel2.5
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0035090
        artikel: '2.5'
        hoofdstuk: '2'
        afdeling: 2.2.1
  - number: '2.7'
    text: |-
      1 De risicobeoordeling als bedoeld in [artikel 2.5][ref1] leidt, overeenkomstig de daartoe door Onze Minister
      krachtens [artikel 2.2][ref2] gestelde regels, tot de toekenning van een categorie van fysische inperking en een
      inperkingsniveau dat de gezondheid van de mens en het milieu passende bescherming biedt, al dan niet tezamen met
      beschermende maatregelen die bij de risicobeoordeling in de beschouwing zijn betrokken.

      2 Het toekennen van een categorie van fysische inperking en een inperkingsniveau geschiedt door de gebruiker met
      toepassing van door Onze Minister gestelde regels, voor zover elders in dit besluit niet anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0035090#Artikel2.5
      [ref2]: https://wetten.overheid.nl/BWBR0035090#Artikel2.2
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel2.7
    references:
