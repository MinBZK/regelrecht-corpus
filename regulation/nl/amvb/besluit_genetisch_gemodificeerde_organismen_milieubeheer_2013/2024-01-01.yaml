  - number: '2.22'
    text: |-
      1 Indien de gebruiker voornemens is activiteiten te wijzigen die eerder bij de kennisgeving zijn aangegeven, voert
      hij tevoren een risicobeoordeling als bedoeld in [artikel 2.5][ref1] uit die is gericht op de beoogde wijziging van
      die activiteiten. Onder wijziging van de activiteiten wordt mede verstaan het toevoegen van activiteiten aan het
      eerder in de kennisgeving beschreven onderzoek.

      2 Het eerste lid is niet van toepassing op activiteiten met betrekking waartoe:

      a. [artikel 2.10, derde lid][ref2], van toepassing is, voor zover artikel 2.10, vijfde lid, in acht wordt genomen,
      of

      b. [artikel 2.11, tweede lid][ref3], van toepassing is, voor zover artikel 2.11, vierde lid, in acht wordt genomen.

      3 Indien Onze Minister op grond van [artikel 2.13, eerste en derde lid][ref4], een vaststelling heeft gedaan die in
      overeenstemming is met artikel 2.13, zevende lid, heeft het tweede lid ten aanzien van degene op wiens verzoek die
      vaststelling is gedaan, mede betrekking op het gastheerorganisme, de vector onderscheidenlijk de insertie waarop
      die vaststelling betrekking heeft.

      4 De [artikelen 2.6 tot en met 2.9][ref5] zijn van overeenkomstige toepassing.


