        bwb_id: BWBR0003245
        artikel: '20.3'
  - number: '3.27'
    text: |-
      1 De houder van een vergunning stuurt jaarlijks uiterlijk op 1 januari aan Onze Minister een verslag over de
      resultaten van de doelbewuste introductie voor overige doeleinden in het voorafgaande kalenderjaar. Onze Minister
      kan bij ministeriële regeling voor daarbij aangewezen categorieën van gevallen een andere datum dan 1 januari
      aanwijzen.

      2 Het verslag, bedoeld in het eerste lid, wordt gemaakt overeenkomstig de door Onze Minister te stellen regels.

      3 De houder van een vergunning stuurt uiterlijk drie maanden na voltooiing van de introductie aan Onze Minister een
      verslag over de resultaten van de doelbewuste introductie.

      4 Het verslag, bedoeld in het derde lid, wordt gemaakt overeenkomstig daarop betrekking hebbende besluiten of
      aanbevelingen van de Raad van de Europese Unie of van de Europese Commissie. In het verslag worden de eventuele
      risico’s voor de gezondheid van mens of het milieu vermeld en wordt aandacht besteed aan producten die de houder
      van de vergunning nog in de handel wil brengen.
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel3.27
  - number: '3.28'
    text: |-
      1 Indien Onze Minister de beschikking krijgt over gegevens die belangrijke gevolgen kunnen hebben voor de
      beoordeling van de risico’s die aan de doelbewuste introductie voor overige doeleinden verbonden zijn, of indien
      sprake is van een wijziging of onbedoelde verandering in de doelbewuste introductie voor overige doeleinden die
      zodanige gevolgen kan hebben, kan hij – onverminderd het elders in dit hoofdstuk bepaalde – de betrokkene bevelen
      de doelbewuste introductie voor overige doeleinden te schorsen of te beëindigen of de omstandigheden ervan te
      wijzigen.

      2 Een besluit als bedoeld in het eerste lid wordt bekendgemaakt in een van overheidswege uitgegeven blad of een
      dag-, nieuws- of huis-aan-huis-blad, dan wel op een andere geschikte wijze.

      3 Degene tot wie het besluit is gericht, voldoet onmiddellijk aan het bevel.

      4 Indien een bevel is gegeven om het ingeperkt gebruik te schorsen of te beëindigen, worden de voorhanden zijnde
      genetisch gemodificeerde organismen vernietigd, dan wel opgeslagen overeenkomstig de bij ministeriële regeling voor
      de opslag van deze organismen gestelde regels.
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel3.28
  - number: '4.1'
    text: |-
      1 Dit hoofdstuk is niet van toepassing op het ter beschikking stellen van genetisch gemodificeerde organismen aan
      derden voor ingeperkt gebruik of voor doelbewuste introductie voor overige doeleinden.

      2 Dit hoofdstuk is niet van toepassing op het in de handel brengen van een toegelaten product door een ander dan
      de houder van de vergunning op grond van dit hoofdstuk, voor zover die ander daarbij de uit [artikel 5.1][ref1]
      voortvloeiende verplichtingen in acht neemt.

      3 Dit hoofdstuk is niet van toepassing op de doelbewuste introductie door het in de handel brengen van medicinale
      stoffen en preparaten, die bestaan uit genetisch gemodificeerde organismen of die deze bevatten, voor gebruik door
      de mens, in de gevallen als bedoeld in artikel 3, eerste lid, van [verordening 2020/1043](32943R2020).


      [ref1]: https://wetten.overheid.nl/BWBR0035090#Artikel5.1
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0035090
        artikel: '5.1'
        hoofdstuk: '5'
  - number: '4.2'
    text: |-
      1 Het in de handel brengen zonder vergunning van Onze Minister is verboden.

      2 In dit hoofdstuk wordt verstaan onder «vergunning»: een vergunning als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel4.2
  - number: '4.3'
    text: |-
      De houder van een vergunning op grond van dit hoofdstuk neemt de aan de vergunning verbonden voorschriften mede in
      acht wanneer hij het betrokken product na het in de handel brengen gebruikt.
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel4.3
  - number: '4.4'
    text: |-
      Het is verboden materiaal in de handel te brengen dat is afgeleid van genetisch gemodificeerde organismen waarvoor
      een vergunning is verleend voor doelbewuste introductie voor overige doeleinden of waarvoor voor die doeleinden
      op andere wijze door een bevoegde instantie van een andere lidstaat van de Europese Unie schriftelijk toestemming
      is verleend, tenzij hiervoor door Onze Minister een vergunning voor het in de handel brengen of door een bevoegde
      instantie van een andere lidstaat van de Europese Unie schriftelijk toestemming is verleend.
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel4.4
  - number: '4.5'
    text: |-
      1 Als gegevens waarvoor de in [artikel 19.3, eerste lid, van de wet][ref1] bedoelde bevoegdheid tot het overleggen
      van een tweede tekst eveneens geldt, worden aangewezen de gegevens die krachtens dit hoofdstuk aan Onze Minister
      worden overgelegd.

      2 Het eerste lid is uitsluitend van toepassing op de gegevens, bedoeld in artikel 25, derde lid, van [richtlijn
      2001/18](32001L0018).


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel19.3
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '19.3'
  - number: '4.6'
    text: |-
      [Afdeling 3.4 van de Algemene wet bestuursrecht][ref1], en [afdeling 13.2 van de wet][ref2] zijn niet van
      toepassing op een aanvraag om een vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Afdeling13.2
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel4.6
