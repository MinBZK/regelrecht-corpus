  - number: '3.12'
    text: |-
      1 Indien:

      1°. sprake is van een onbedoelde verandering in de doelbewuste introductie voor overige doeleinden, of

      2°. de houder van een vergunning kennis neemt van nieuwe informatie ten aanzien van de risico’s die de genetisch
      gemodificeerde organismen of de handelingen daarmee kunnen opleveren voor de gezondheid van de mens of het milieu,
      zorgt de houder van de vergunning er voor dat:

      a. daarvan onmiddellijk mededeling wordt gedaan aan Onze Minister, en

      b. onmiddellijk de maatregelen worden getroffen die in verband met die risico’s nodig zijn ter bescherming van de
      gezondheid van mens of het milieu.

      2 De houder van de vergunning geeft zo nodig aan tot welke wijziging van de gegevens die bij de aanvraag om de
      vergunning zijn overgelegd, de onbedoelde verandering of de nieuwe informatie leidt.

      3 Onze Minister tekent de datum van ontvangst aan op de mededeling en zendt aan houder van de vergunning onverwijld
      een bewijs van ontvangst waarin die datum is vermeld.

      4 De houder van de vergunning vraagt zo nodig binnen vier weken na het doen van de mededeling een wijziging van de
      vergunning aan.
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel3.12
  - number: '3.13'
    text: |-
      1 Onze Minister kan ambtshalve of op verzoek een vergunning wijzigen of intrekken op grond van nieuwe informatie
      die gevolgen kan hebben voor de risico’s van de betrokken genetisch gemodificeerde organismen voor de gezondheid
      van de mens of het milieu.

      2 Een ambtshalve besluit naar aanleiding van een mededeling als bedoeld in [artikel 3.12][ref1], wordt genomen
      binnen 12 weken nadat Onze Minister de mededeling heeft ontvangen. [Artikel 3.8][ref2] is van overeenkomstige
      toepassing.

      3 Op de aanvraag om wijziging van een vergunning zijn de [artikelen 3.7 tot en met 3.9][ref3] en
      [3.11][ref4] van overeenkomstige toepassing, met dien verstande dat de gegevens, aangewezen bij of krachtens
      [artikel 3.7, tweede en derde lid][ref5], slechts behoeven te worden overgelegd voor zover deze gegevens van
      betekenis zijn voor de wijziging.

      4 Onze Minister beslist op de aanvraag tot wijziging van de vergunning binnen acht weken na ontvangst van het
      verzoek.

      5 Een besluit als bedoeld in het tweede lid en een beslissing als bedoeld in het vierde lid zijn besluiten
      als bedoeld in [artikel 20.3, tweede lid, onderdeel b, van de wet][ref6] en worden bekendgemaakt in een van
      overheidswege uitgegeven blad of een dag-, nieuws- of huis-aan-huis-blad, dan wel op een andere geschikte wijze.

      6 Onverminderd [artikel 3.28][ref7], mag de houder van de vergunning na het doen van de mededeling als bedoeld in
      [artikel 3.12][ref8] zijn werkzaamheden in afwachting van de beslissing van Onze Minister voortzetten, indien hij
      heeft voldaan aan artikel 3.12, eerste lid, onder b, en vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0035090#Artikel3.12
