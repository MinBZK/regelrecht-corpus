        paragraaf: 2.2.2.2
        afdeling: 2.2.2
  - number: '2.40'
    text: |-
      Indien het belang van de gezondheid van de mens en van het milieu zich daartegen niet verzet, kan Onze
      Minister bij de voorschriften die hij aan de vergunning verbindt, afwijken van de regels die gelden krachtens
      [artikel 2.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035090#Artikel2.2
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel2.40
