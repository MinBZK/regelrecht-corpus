  - number: '2.27'
    text: |-
      1 De gebruiker voert onmiddellijk een risicobeoordeling als bedoeld in [artikel 2.5][ref1] uit indien:

      a. een onbedoelde wijziging van de gegevens of de omstandigheden van het ingeperkt gebruik optreedt, die ertoe
      leidt of kan leiden dat het ingeperkt gebruik moet worden verricht op een ander inperkingsniveau of een andere
      categorie van fysische inperking, of

      b. de gebruiker de beschikking krijgt over nieuwe ter zake doende gegevens, waaruit blijkt dat mogelijk een ander
      inperkingsniveau of een andere categorie van fysische inperking moet worden toegekend.

      2 De [artikelen 2.6 tot en met 2.9][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0035090#Artikel2.5
      [ref2]: https://wetten.overheid.nl/BWBR0035090#Artikel2.6
