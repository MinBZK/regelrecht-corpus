  - number: '2.37'
    text: |-
      1 Op de aanvraag om een vergunning beslist Onze Minister:

      a. uiterlijk 45 dagen na ontvangst van de aanvraag indien de aanvraag betrekking heeft op ingeperkt gebruik op
      inperkingsniveau III;

      b. uiterlijk 90 dagen na ontvangst van de aanvraag indien de aanvraag betrekking heeft op ingeperkt gebruik op
      inperkingsniveau IV.

      2 [Afdeling 3.4 van de Algemene wet bestuursrecht][ref1] en [afdeling 13.2 van de wet][ref2] zijn niet van
      toepassing op de voorbereiding van de beslissing op de aanvraag.

      3 Een beslissing als bedoeld in het eerste lid is een besluit als bedoeld in
      [artikel 20.3, tweede lid, onderdeel b, van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
