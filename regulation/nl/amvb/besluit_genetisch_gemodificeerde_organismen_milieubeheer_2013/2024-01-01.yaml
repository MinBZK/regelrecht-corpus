  - number: '3.23'
    text: |-
      1 Onze Minister kan een vergunning verlenen of wijzigen overeenkomstig een procedure die bij besluit van de Raad
      van de Europese Unie of van de Europese Commissie op grond van artikel 7 van [richtlijn 2001/18](32001L0018) is
      vastgesteld.

      2 In geval van toepassing van het eerste lid zijn de [paragrafen 3.2.2][ref1] en [3.2.4][ref2] niet van toepassing.

      3 Indien het besluit, bedoeld in het eerste lid, uitsluitend betrekking heeft op de verlening van de vergunning,
      is, in afwijking van het tweede lid, [paragraaf 3.2.4][ref3] wel van toepassing, tenzij het bedoelde besluit
      wijziging van de vergunning uitsluit.

      4 Onze Minister kan regels stellen met betrekking tot de bij de aanvraag over te leggen gegevens.

      5 Een besluit als bedoeld in het eerste lid wordt bekendgemaakt in een van overheidswege uitgegeven blad of een
      dag-, nieuws- of huis-aan-huis-blad, dan wel op een andere geschikte wijze.

      6 In de gevallen waarin de betrokken procedure dit toestaat, kan de houder van een vergunning die is verleend
      overeenkomstig een procedure als bedoeld in het eerste lid, een verandering in de doelbewuste introductie voor
      overige doeleinden melden aan Onze Minister. Het vierde lid is van overeenkomstige toepassing.

      7 De vergunning geldt tevens voor een verandering in de doelbewuste introductie voor overige doeleinden die
      overeenkomstig het zesde lid is gemeld.

      8 Indien de melding betrekking heeft op het vervangen of toevoegen van een of meer locaties voor de doelbewuste
      introductie voor overige doeleinden, mag de introductie, in afwijking van het zevende lid, eerst overeenkomstig
      de melding plaatsvinden, nadat Onze Minister schriftelijk aan de vergunninghouder heeft verklaard dat hij kan
      instemmen met de melding.

      9 Een verklaring als bedoeld in het achtste lid wordt bekendgemaakt in een van overheidswege uitgegeven blad of een
      dag-, nieuws- of huis-aan-huis-blad, dan wel op een andere geschikte wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0035090#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0035090#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0035090#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel3.23
