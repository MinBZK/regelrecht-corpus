  - number: '2.41'
    text: |-
      De [artikelen 2.20][ref1] en [2.21][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0035090#Artikel2.20
      [ref2]: https://wetten.overheid.nl/BWBR0035090#Artikel2.21
