        afdeling: '4.2'
  - number: '4.10'
    text: |-
      Indien de aanvrager van een vergunning tijdens de behandeling van de aanvraag kennis neemt van nieuwe informatie
      ten aanzien van de risico’s die de genetisch gemodificeerde organismen of de handelingen daarmee kunnen opleveren
      voor de gezondheid van de mens of het milieu, doet hij daarvan onmiddellijk mededeling aan Onze Minister, en past
      hij zo nodig de bij de aanvraag overgelegde gegevens aan.
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel4.10
  - number: '4.11'
    text: |-
      1 Onze Minister stelt binnen 90 dagen na ontvangst van een aanvraag om een vergunning, overeenkomstig bijlage VI
      bij [richtlijn 2001/18](32001L0018) een beoordelingsrapport op.

      2 Indien het beoordelingsrapport inhoudt dat het genetisch gemodificeerde organisme in de handel mag worden
      gebracht, vermeldt het de voorschriften waaronder dat mag gebeuren. Onze Minister zendt het beoordelingsrapport en
      een afschrift van de aanvraag onverwijld aan de Europese Commissie. Hij zendt het beoordelingsrapport, samen met de
      informatie waarop het is gebaseerd, onverwijld aan de aanvrager.

      3 Indien het beoordelingsrapport inhoudt dat het genetisch gemodificeerde organisme niet in de handel mag worden
      gebracht, zendt Onze Minister ten vroegste 15 dagen na toezending van het beoordelingsrapport aan de aanvrager en
      uiterlijk 105 dagen na ontvangst van de aanvraag, het beoordelingsrapport, samen met de informatie waarop het is
      gebaseerd, aan de Europese Commissie.
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel4.11
  - number: '4.12'
    text: |-
      Indien Onze Minister na toezending van het beoordelingsrapport maar vóór vergunningverlening kennis neemt van
      nieuwe informatie die van invloed kan zijn op de risico’s van de betrokken genetisch gemodificeerde organismen
      voor de gezondheid van mens of het milieu, zendt hij die informatie onverwijld aan de Europese Commissie en aan de
      bevoegde instanties van de andere lidstaten van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel4.12
  - number: '4.13'
    text: |-
      1 Onze Minister beslist op een aanvraag om een vergunning:

      a. indien door de Europese Commissie of de bevoegde instanties van de andere lidstaten geen bezwaar is gemaakt
      ingevolge artikel 15 van [richtlijn 2001/18](32001L0018): binnen 30 dagen na het verstrijken van de termijn
      waarbinnen bezwaar had kunnen worden gemaakt;

      b. indien door de Europese Commissie of de bevoegde instanties van de andere lidstaten bezwaar is gemaakt ingevolge
      artikel 15 van [richtlijn 2001/18](32001L0018), en geen van deze bezwaren is gehandhaafd binnen de termijn
      waarbinnen bezwaar kon worden gemaakt: binnen 30 dagen na het verstrijken van de termijn waarbinnen bezwaar kon
      worden gemaakt;

      c. indien door de Europese Commissie of de bevoegde instanties van de andere lidstaten bezwaar is gemaakt ingevolge
      artikel 15 van [richtlijn 2001/18](32001L0018), en geen van de bezwaren is gehandhaafd binnen de termijn bedoeld in
      artikel 15, eerste lid, derde alinea, van [richtlijn 2001/18](32001L0018): binnen 30 dagen na het verstrijken van
      de termijn bedoeld in artikel 15, eerste lid, derde alinea, van [richtlijn 2001/18](32001L0018);

      d. indien door de Europese Commissie of de bevoegde instanties van de andere lidstaten bezwaar is gemaakt ingevolge
      artikel 15 van [richtlijn 2001/18](32001L0018), en een of meer bezwaren zijn gehandhaafd: binnen 30 dagen nadat
      Onze Minister het besluit van de Commissie met toepassing van artikel 18 van [richtlijn 2001/18](32001L0018) heeft
      ontvangen, dan wel binnen 30 dagen nadat de bezwarenprocedure op een andere wijze is afgerond.

      2 Onze Minister zendt zijn besluit onverwijld aan de aanvrager en stelt de Europese Commissie en de andere
      lidstaten van de Europese Unie binnen 30 dagen in kennis van het besluit.

      3 Een besluit als bedoeld in het eerste lid is een besluit als bedoeld in
      [artikel 20.3, tweede lid, onderdeel b, van de wet][ref1] en wordt bekendgemaakt in een van overheidswege
      uitgegeven blad of een dag-, nieuws- of huis-aan-huis-blad, dan wel op een andere geschikte wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel20.3
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel4.13
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '20.3'
  - number: '4.14'
    text: |-
      1 Een vergunning wordt voor ten hoogste tien jaren verleend.

      2 Een vergunning voor een genetisch gemodificeerd organisme of een nakomeling van dat organisme uitsluitend
      met als doel het in de handel brengen van hun zaden overeenkomstig de daarop betrekking hebbende communautaire
      voorschriften, wordt verleend voor een periode van ten hoogste tien jaren na de datum waarop het eerste plantenras
      afkomstig van het genetisch gemodificeerde organisme, voor het eerst op een officiële nationale lijst van
      plantenrassen is opgenomen overeenkomstig richtlijn nr. 2002/53/EG van de Raad van 13 juni 2002 betreffende de
      gemeenschappelijke rassenlijst voor landbouwgewassen (PbEG L 193) en [richtlijn 2002/55/EG](32002L0055) van de Raad
      van 13 juni 2002 betreffende het in de handel brengen van groentezaad (PbEG L 193).

      3 Een vergunning voor bosbouwkundig teeltmateriaal wordt verleend voor een periode van ten hoogste tien jaren
      na de datum waarop uitgangsmateriaal afkomstig van het genetisch gemodificeerde organisme voor het eerst op een
      officiële nationale lijst is opgenomen overeenkomstig richtlijn nr. 1999/105/EG van de Raad van de Europese Unie
      van 22 december 1999 betreffende het in de handel brengen van bosbouwkundig teeltmateriaal (PbEG L 11).
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel4.14
  - number: '4.15'
    text: |-
      1 In een vergunning wordt ten minste vermeld:

      a. de reikwijdte, daaronder mede begrepen de identiteit van de genetisch gemodificeerde organismen die als product
      of in producten in de handel worden gebracht en het unieke bijbehorende identificatiesymbool;

      b. de geldigheidsduur;

      c. de voorschriften die worden gesteld aan het in de handel brengen van de genetisch gemodificeerde organismen
      als product of in producten, daaronder mede begrepen voorschriften voor gebruik, behandeling en de verpakking en
      voorschriften voor de bescherming van specifieke ecosystemen, milieus of geografische gebieden waarin het product
      volgens plan zal worden gebruikt;

      d. de verplichting om op verzoek van Onze Minister controlesteekproeven beschikbaar te stellen;

      e. de voorschriften met betrekking tot etikettering, overeenkomstig bijlage IV bij [richtlijn 2001/18](32001L0018)
      en de daarop betrekking hebbende besluiten of aanbevelingen van de Raad van de Europese Unie of van de Europese
      Commissie op grond van artikel 27 van [richtlijn 2001/18](32001L0018), en

      f. de monitoringvoorschriften overeenkomstig bijlage VII bij [richtlijn 2001/18](32001L0018) en overeenkomstig
      daarop betrekking hebbende besluiten of aanbevelingen van de Raad van de Europese Unie of van de Europese
      Commissie.

      2 Onder de monitoringvoorschriften, bedoeld in het eerste lid, onder f, worden mede verstaan de rapportage, de
      termijn van het monitoringplan en, voor zover van toepassing, voorschriften voor degenen die het product verkopen
      of gebruiken waaronder voor geteelde genetisch gemodificeerde organismen, de informatie die over de teeltlocatie
      moet worden verschaft.
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel4.15
  - number: '4.16'
    text: |-
      De voorschriften met betrekking tot de etikettering, bedoeld in [artikel 4.15, eerste lid, onder e][ref1], zijn
      niet van toepassing:

      a. ten aanzien van producten waarin onvoorziene of technisch niet te voorkomen sporen van toegelaten genetisch
      gemodificeerde organismen niet zijn uit te sluiten, indien de sporen in het product een daartoe bij besluit van de
      Raad van de Europese Unie of van de Europese Commissie krachtens artikel 21, tweede lid, van [richtlijn 2001/18]
      (32001L0018) vastgestelde drempelwaarde niet overschrijden, of

      b. indien het product bestemd is voor rechtstreekse bewerking of verwerking, en daarin sporen als bedoeld onder
      a aanwezig zijn in een verhouding van ten hoogste 0,9% of een lagere bij besluit van de Raad van de Europese Unie
      of van de Europese Commissie krachtens artikel 21, tweede lid, van [richtlijn 2001/18](32001L0018) vastgestelde
      drempelwaarde.


      [ref1]: https://wetten.overheid.nl/BWBR0035090#Artikel4.15
