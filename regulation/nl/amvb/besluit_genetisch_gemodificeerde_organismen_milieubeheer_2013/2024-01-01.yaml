  - number: '5.2'
    text: |-
      De houder van een schriftelijke toestemming voor het in de handel brengen, overeenkomstig [richtlijn 2001/18]
      (32001L0018) verleend door de bevoegde instantie van een andere lidstaat, dient een afschrift van de door
      hem ingevolge genoemde richtlijn opgestelde monitoringrapporten in bij Onze Minister, voor zover deze
      monitoringrapporten betrekking hebben op genetisch gemodificeerde organismen die de houder van de schriftelijke
      toestemming in Nederland in de handel brengt.
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel5.2
  - number: '5.3'
    text: |-
      1 Onze Minister kan het in de handel brengen of het gebruik van genetisch gemodificeerde organismen als
      product of in een product in Nederland tijdelijk beperken of verbieden, indien hij als gevolg van nieuwe of
      aanvullende informatie of als gevolg van herbeoordeling van bestaande informatie aan de hand van nieuwe of nadere
      wetenschappelijke kennis duidelijke redenen heeft om aan te nemen dat de betrokken genetisch gemodificeerde
      organismen als product, of in een product waarvoor hij voor het in de handel brengen een vergunning heeft verleend
      of de bevoegde instantie van een andere lidstaat van de Europese Unie schriftelijke toestemming heeft gegeven,
      gevaar opleveren voor de gezondheid van de mens of het milieu.

      2 Onze Minister zendt een besluit als bedoeld in het eerste lid, alsmede een nieuwe milieurisicobeoordeling, een
      omschrijving van de daaraan naar zijn mening te verbinden gevolgen en, indien aanwezig, bijkomende informatie,
      onverwijld aan de Europese Commissie en aan de bevoegde instanties van de andere lidstaten van de Europese Unie.

      3 Bij een besluit als bedoeld in het eerste lid bepaalt Onze Minister tevens in hoeverre de voorhanden zijnde
      genetisch gemodificeerde organismen worden vernietigd, dan wel worden opgeslagen overeenkomstig de bij ministeriële
      regeling voor de opslag van deze organismen gestelde regels.
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel5.3
  - number: '5.4'
    text: |-
      1 Onze Minister kan bij ministeriële regeling een register instellen waarin door hem aangewezen gegevens worden
      opgenomen met betrekking tot de teeltlocatie van toegelaten producten.

      2 Degene die de toegelaten producten teelt, meldt de door Onze Minister daartoe aangewezen gegevens, op de door
      Onze Minister aangegeven wijze.
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel5.4
  - number: '6.1'
    text: |-
      1 Een gedraging in strijd met het bepaalde bij of krachtens [artikel 1.6][ref1], [1.8][ref2],
      [3.28, derde lid][ref3], [5.1, eerste lid][ref4], [5.2][ref5], [5.3, eerste en derde lid][ref6], of
      [5.4, tweede lid][ref7], is verboden.

      2 Indien [artikel 3.12][ref8] van toepassing is, is doelbewuste introductie voor overige doeleinden verboden,
      indien niet onmiddellijk een mededeling is gedaan als bedoeld in artikel 3.12, eerste lid, onder a, dan wel indien
      niet onmiddellijk de maatregelen zijn getroffen, bedoeld in artikel 3.12, eerste lid, onder b.

      3 Indien [artikel 4.22][ref9] van toepassing is, is het in de handel brengen verboden, indien niet onmiddellijk
      een mededeling is gedaan als bedoeld in artikel 4.22, eerste lid, onder a, dan wel indien niet onmiddellijk de
      maatregelen zijn getroffen, bedoeld in artikel 4.22, eerste lid, onder b.


