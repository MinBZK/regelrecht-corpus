  - number: '3.1'
    text: |-
      1 Dit hoofdstuk is niet van toepassing op doelbewuste introductie voor overige doeleinden van medicinale stoffen
      en preparaten, die bestaan uit genetisch gemodificeerde organismen of die deze bevatten, voor gebruik door de mens,
      voor zover die handelingen krachtens door Onze Minister aangewezen communautaire regelgeving zijn toegelaten.

      2 Dit hoofdstuk is voorts niet van toepassing op de doelbewuste introductie voor overige doeleinden van een
      toegelaten product, voor zover daarbij de uit [hoofdstuk 4][ref1] voortvloeiende voorschriften of de uit
      [artikel 5.1][ref2] voortvloeiende verplichtingen in acht worden genomen.

      3 Dit hoofdstuk is voorts niet van toepassing op de doelbewuste introductie voor overige doeleinden van medicinale
      stoffen en preparaten, die bestaan uit genetisch gemodificeerde organismen of die deze bevatten, voor gebruik
      door de mens indien het betreft de uitvoering van klinische proeven als bedoeld in artikel 2, eerste lid, van
      [verordening 2020/1043](32943R2020).


      [ref1]: https://wetten.overheid.nl/BWBR0035090#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0035090#Artikel5.1
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0035090
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0035090
        artikel: '5.1'
        hoofdstuk: '5'
  - number: '3.2'
    text: |-
      1 Doelbewuste introductie voor overige doeleinden zonder vergunning van Onze Minister is verboden.

      2 In dit hoofdstuk wordt verstaan onder «vergunning»: een vergunning als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel3.2
  - number: '3.3'
    text: |-
      Een vergunning geldt tevens voor ingeperkt gebruik van genetisch gemodificeerde organismen waarop de vergunning
      betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel3.3
  - number: '3.4'
    text: |-
      1 Onze Minister kan regels stellen over de doelbewuste introductie voor overige doeleinden. Deze regels kunnen
      verschillend zijn voor verschillende genetisch gemodificeerde organismen en verschillende werkzaamheden met die
      genetisch gemodificeerde organismen.

      2 Onze Minister kan bepalen dat de regels geheel of gedeeltelijk in de plaats treden van voorschriften, verbonden
      aan een vergunning.

      3 Onze Minister kan van de regels ontheffing verlenen, indien het belang van de bescherming van de gezondheid van
      de mens en het milieu zich daartegen niet verzet. Hij kan een andere maatregel voorschrijven waarmee ten minste een
      gelijkwaardig niveau van bescherming van het milieu wordt bereikt.
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel3.4
  - number: '3.5'
    text: |-
      1 Als gegevens waarvoor de in [artikel 19.3, eerste lid, van de wet][ref1] bedoelde bevoegdheid tot het overleggen
      van een tweede tekst eveneens geldt, worden aangewezen de gegevens die krachtens dit hoofdstuk aan Onze Minister
      worden overgelegd.

      2 Het eerste lid is uitsluitend van toepassing op de gegevens, bedoeld in artikel 25, derde lid, van [richtlijn
      2001/18](32001L0018).


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel19.3
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '19.3'
  - number: '3.6'
    text: |-
      Voorafgaand aan de aanvraag om verlening van een vergunning voert degene die voornemens is de doelbewuste
      introductie voor overige doeleinden uit te voeren een milieurisicobeoordeling uit.
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel3.6
  - number: '3.7'
    text: |-
      1 Bij de aanvraag om een vergunning wordt gebruik gemaakt van gestandaardiseerde gegevensformaten als bedoeld in
      artikel 39 septies van [verordening 178/2002](32002R0178) dan wel, bij afwezigheid daarvan, van formaten waarmee
      kan worden voldaan aan de openbaarmaking, bedoeld artikel 28, vierde lid, van [richtlijn 2001/18](32001L0018).

      2 De aanvraag bevat:

      a. een technisch dossier met informatie overeenkomstig bijlage III bij [richtlijn 2001/18](32001L0018), en de
      daarbij behorende Europese beschikkingen, die nodig is om een milieurisicobeoordeling uit te voeren, daaronder in
      ieder geval begrepen:

      1°. informatie over algemene zaken, en informatie over personeel en opleiding;

      2°. informatie over het genetisch gemodificeerde organisme;

      3°. informatie over de omstandigheden van de introductie en het potentiële milieu waarin doelbewust wordt
      geïntroduceerd;

      4°. informatie over de interactie tussen het genetisch gemodificeerde organisme en het milieu;

      5°. een monitoringplan overeenkomstig bijlage IIIA, onderdeel V, of bijlage IIIB, onderdeel G, bij [richtlijn
      2001/18](32001L0018);

      6°. informatie over plannen voor monitoring, herstelmethoden, afvalstoffenbehandeling en noodmaatregelen;

      7°. een samenvatting van het dossier als bedoeld in artikel 11 van [richtlijn 2001/18](32001L0018) gebruikmakende
      van het model dat volgens de procedure van artikel 30, tweede lid, van [richtlijn 2001/18](32001L0018) is
      vastgesteld;

      b. Een milieurisicobeoordeling, voorzien van alle bibliografische verwijzingen en indicaties over de gebruikte
      methoden.

      3 Onze Minister kan bij ministeriële regeling andere voor de behandeling noodzakelijke gegevens aanwijzen die bij
      de aanvraag overgelegd dienen te worden. Onze Minister kan tevens nadere regels stellen omtrent de over te leggen
      gegevens.

      4 De aanvrager kan ter voldoening aan het bepaalde bij of krachtens het tweede en derde lid verwijzen naar gegevens
      of resultaten van een eerdere door hem ingediende aanvraag om een vergunning.

      5 De aanvrager kan door hem relevant geachte aanvullende informatie indienen.

      6 De aanvrager kan ter voldoening aan het bepaalde bij of krachtens het tweede en derde lid verwijzen naar gegevens
      of resultaten van een eerdere aanvraag om een vergunning van een andere aanvrager, voor zover die informatie,
      gegevens of resultaten niet vertrouwelijk zijn of de andere vergunninghouder daarvoor schriftelijk toestemming
      heeft verleend.

      7 Onze Minister kan toestaan dat een enkele aanvraag wordt ingediend voor hetzelfde genetisch gemodificeerde
      organisme dat op dezelfde plaats of op verschillende plaatsen voor hetzelfde doel en binnen een beperkte periode
      doelbewust wordt geïntroduceerd.

      8 Onze Minister tekent de datum van ontvangst aan op de aanvraag en zendt de aanvrager onverwijld een bewijs van
      ontvangst waarin die datum is vermeld.
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel3.7
  - number: '3.8'
    text: |-
      1 In aanvulling op [artikel 4:5 van de Algemene wet bestuursrecht][ref1] verstrekt de aanvrager desverzocht aan
      Onze Minister binnen de daartoe door Onze Minister gestelde termijn nadere informatie ter voorbereiding van het
      besluit op een aanvraag als bedoeld in [artikel 3.7][ref2]. Bij zijn verzoek geeft Onze Minister de redenen aan die
      aan het verzoek ten grondslag liggen.

      2 Indien Onze Minister om nadere informatie heeft verzocht, wordt de termijn, bedoeld in
      [artikel 3.10, eerste en tweede lid][ref3], en [artikel 3.10a, tweede en derde lid][ref4], opgeschort totdat Onze
      Minister de nadere gegevens heeft ontvangen.

      3 Indien de gevraagde nadere informatie niet binnen de gestelde termijn is ontvangen, kan Onze Minister besluiten
      de aanvraag niet of niet verder te behandelen.

      4 Onze Minister stelt de aanvrager onverwijld op de hoogte van een besluit als bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0035090#Artikel3.7
      [ref3]: https://wetten.overheid.nl/BWBR0035090#Artikel3.10
      [ref4]: https://wetten.overheid.nl/BWBR0035090#Artikel3.10a
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:5
      - id: ref2
        bwb_id: BWBR0035090
        artikel: '3.7'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
      - id: ref3
        bwb_id: BWBR0035090
        artikel: '3.10'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
      - id: ref4
        bwb_id: BWBR0035090
        artikel: 3.10a
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: '3.9'
    text: |-
      Indien de aanvrager van een vergunning tijdens de behandeling van de aanvraag kennis neemt van nieuwe informatie
      ten aanzien van de risico’s die de genetisch gemodificeerde organismen of de handelingen daarmee kunnen opleveren
      voor de gezondheid van mens of het milieu, zorgt hij ervoor dat de in de aanvraag om een vergunning vermelde
      informatie zo spoedig mogelijk wordt herzien en bij Onze Minister wordt ingediend.
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel3.9
  - number: '3.10'
    text: |-
      1 Onze Minister zendt binnen 30 dagen na ontvangst van de aanvraag een samenvatting van de aanvraag aan de Europese
      Commissie.

      2 Onze Minister beslist op de aanvraag binnen 120 dagen na ontvangst van de aanvraag. Hij neemt daarbij in
      aanmerking de opmerkingen die andere lidstaten van de Europese Unie hebben gemaakt. De beslissing is een besluit
      als bedoeld in [artikel 20.3, tweede lid, onderdeel b, van de wet][ref1].

      3 Een besluit als bedoeld in het tweede lid wordt bekendgemaakt in een van overheidswege uitgegeven blad of een
      dag-, nieuws- of huis-aan-huis-blad, dan wel op een andere geschikte wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel20.3
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel3.10
    references:
