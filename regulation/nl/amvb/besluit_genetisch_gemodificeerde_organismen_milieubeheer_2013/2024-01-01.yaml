        hoofdstuk: '2'
        paragraaf: 2.2.3.2
        afdeling: 2.2.3
  - number: '2.47'
    text: |-
      1 Onze Minister kan de vergunning ambtshalve wijzigen in het belang van de bescherming van de gezondheid van de
      mens of het milieu.

      2 De gebruiker verstrekt aan Onze Minister op diens verzoek binnen de daartoe door Onze Minister gestelde termijn
      informatie ten behoeve van een voorgenomen ambtshalve wijziging van de vergunning.

      3 De [artikelen 2.39][ref1] en [2.40][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0035090#Artikel2.39
      [ref2]: https://wetten.overheid.nl/BWBR0035090#Artikel2.40
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel2.47
