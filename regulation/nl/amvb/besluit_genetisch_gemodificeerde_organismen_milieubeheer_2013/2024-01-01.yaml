  - number: '2.42'
    text: |-
      1 Indien de gebruiker voornemens is activiteiten te wijzigen waarop de vergunning betrekking heeft, voert hij
      tevoren een risicobeoordeling als bedoeld in [artikel 2.5][ref1] uit die is gericht op de beoogde wijziging van
      die activiteiten.

      Onder wijziging van de activiteiten wordt mede verstaan het toevoegen van activiteiten aan het eerder in de
      aanvraag om de vergunning beschreven onderzoek.

      2 De [artikelen 2.6 tot en met 2.9][ref2] zijn van overeenkomstige toepassing.

      3 Zo nodig vraagt de gebruiker een wijziging van zijn vergunning aan.


      [ref1]: https://wetten.overheid.nl/BWBR0035090#Artikel2.5
      [ref2]: https://wetten.overheid.nl/BWBR0035090#Artikel2.6
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel2.42
    references:
      - id: ref1
        bwb_id: BWBR0035090
        artikel: '2.5'
        hoofdstuk: '2'
        afdeling: 2.2.1
      - id: ref2
        bwb_id: BWBR0035090
        artikel: '2.6'
        hoofdstuk: '2'
        afdeling: 2.2.1
  - number: '2.43'
    text: |-
      Onze Minister kan op aanvraag van de houder van de vergunning de vergunning wijzigen, daaronder mede begrepen het
      toevoegen van activiteiten aan het eerder in de vergunning beschreven onderzoek.
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel2.43
  - number: '2.44'
    text: |-
      Op de aanvraag om een wijziging van de vergunning zijn de [artikelen 2.36 tot en met 2.40][ref1] van
      overeenkomstige toepassing, met dien verstande dat eerder overgelegde gegevens niet opnieuw behoeven te worden
      overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0035090#Artikel2.36
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel2.44
    references:
      - id: ref1
        bwb_id: BWBR0035090
        artikel: '2.36'
        hoofdstuk: '2'
        paragraaf: 2.2.3.2
        afdeling: 2.2.3
  - number: '2.45'
    text: |-
      1 Indien een aanvraag tot wijziging van een vergunning wordt ingediend, kan Onze Minister uit eigen beweging of op
      verzoek bepalen dat:

      a. op basis van de aanvraag een vergunning zal worden verleend ter vervanging van de eerder verleende vergunning of
      vergunningen, of

      b. een aanvraag moet worden ingediend voor een vergunning ter vervanging van de eerder verleende vergunning of
      vergunningen.

      2 Onze Minister kan de rechten die de houder van de vergunning aan de al eerder verleende vergunning of
      vergunningen ontleende, niet wijzigen, tenzij dat noodzakelijk is in het belang van de bescherming van de
      gezondheid van de mens of het milieu.

      3 Een met toepassing van het eerste lid verleende vergunning vervangt de eerder verleende vergunning of
      vergunningen. De eerder verleende vergunning of vergunningen vervalt onderscheidenlijk vervallen op het tijdstip
      waarop de met toepassing van het eerste lid verleende vergunning in werking treedt.
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel2.45
  - number: '2.46'
    text: |-
      1 Onze Minister kan bij ministeriële regeling categorieën van gevallen aanwijzen, waarin kan worden volstaan met
      een melding in plaats van een aanvraag tot wijziging van een vergunning.

      2 In gevallen als bedoeld in het eerste lid, mag het ingeperkt gebruik overeenkomstig de melding plaatsvinden,
      zodra Onze Minister schriftelijk aan de houder van de vergunning heeft verklaard dat hij kan instemmen met de
      melding.

      3 Een besluit inzake een verklaring wordt genomen uiterlijk 28 dagen na de melding en is een besluit als bedoeld in
      [artikel 20.3, tweede lid, onderdeel b, van de wet][ref1].

      4 [Artikel 2.40][ref2] is van overeenkomstige toepassing op de verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel20.3
      [ref2]: https://wetten.overheid.nl/BWBR0035090#Artikel2.40
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel2.46
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '20.3'
      - id: ref2
