  - number: '2.12'
    text: |-
      1 De gebruiker voert onmiddellijk een risicobeoordeling als bedoeld in [artikel 2.5][ref1] uit indien
      [artikel 2.10, derde en vierde lid][ref2], of [artikel 2.11, tweede en derde lid][ref3], als gevolg van een
      wijziging van een lijst, bedoeld in artikel 2.10, eerste lid, onderscheidenlijk artikel 2.11, eerste lid, niet
      langer van toepassing is op het ingeperkt gebruik.

      2 De [artikelen 2.6 tot en met 2.9][ref4] zijn van overeenkomstige toepassing.


