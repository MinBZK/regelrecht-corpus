  - number: '3.26'
    text: |-
      1 Onze Minister zendt zo spoedig mogelijk na ontvangst van de aanvraag een samenvatting van de aanvraag aan de
      Europese Commissie.

      2 Onze Minister neemt het besluit op de aanvraag voor toepassingen met genetisch gemodificeerde planten binnen 120
      dagen en voor overige toepassingen, niet zijnde toepassingen als bedoeld in [artikel 3.26a][ref1], binnen 90 dagen
      na ontvangst van de aanvraag. Hij neemt daarbij in aanmerking de opmerkingen die andere lidstaten van de Europese
      Unie hebben gemaakt.

      3 Een besluit als bedoeld in het tweede lid is een besluit als bedoeld in
      [artikel 20.3, tweede lid, onderdeel b, van de wet][ref2] en wordt bekendgemaakt in een van overheidswege
      uitgegeven blad of een dag-, nieuws- of huis-aan-huis-blad, dan wel op een andere geschikte wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0035090#Artikel3.26a
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel20.3
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel3.26
