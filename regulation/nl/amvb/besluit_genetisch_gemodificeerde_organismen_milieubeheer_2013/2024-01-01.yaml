  - number: '1.8'
    text: |-
      1 Degene die genetisch gemodificeerde organismen aan een ander ter beschikking stelt, draagt er zorg voor dat op
      het etiket van de verpakking van of het bijgevoegde document bij de genetisch gemodificeerde organismen duidelijk
      zichtbaar is aangegeven dat het genetisch gemodificeerde organismen betreft.

      2 Hij handelt daarbij overeenkomstig:

      a. de toepasselijke delen van bijlage IV bij [richtlijn 2001/18](32001L0018), en

      b. de besluiten of aanbevelingen van de Raad van de Europese Unie of van de Europese Commissie op grond van artikel
      26, tweede lid, van [richtlijn 2001/18](32001L0018).

      3 Onze Minister kan nadere regels stellen met betrekking tot het bepaalde in het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel1.8
  - number: '1.9'
    text: |-
      1 Onze Minister maakt het ontwerp van de regels die krachtens dit besluit worden gesteld, bekend in de
      Staatscourant. Aan eenieder wordt de gelegenheid geboden gedurende een bij die bekendmaking vast te stellen termijn
      opmerkingen over het ontwerp schriftelijk ter kennis van Onze Minister te brengen.

      2 Het eerste lid blijft buiten toepassing indien:

      a. de vereiste spoed zich verzet tegen toepassing van dat lid, of

      b. het ontwerp van de regels naar het oordeel van Onze Minister slechts bepalingen van ondergeschikte betekenis
      bevat.
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel1.9
  - number: '1.10'
    text: |-
      Onze Minister kan regels stellen over de wijze waarop uitvoering wordt gegeven aan de [bijlagen][ref1] bij dit
      besluit, bij [richtlijn 2001/18](32001L0018) of bij [richtlijn 2009/41](32009L0041).


      [ref1]: https://wetten.overheid.nl/BWBR0035090
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel1.10
    references:
      - id: ref1
        bwb_id: BWBR0035090
  - number: '1.11'
    text: |-
      Dit besluit en de daarop berustende bepalingen zijn mede van toepassing op activiteiten verricht binnen de
      exclusieve economische zone.
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel1.11
  - number: '2.1'
    text: |-
      1 Dit hoofdstuk is niet van toepassing op:

      a. genetisch gemodificeerde organismen die zijn vervaardigd met behulp van de in [bijlage 3][ref1] genoemde
      technieken en methoden;

      b. ingeperkt gebruik van uitsluitend de typen van genetisch gemodificeerde micro-organismen die worden opgesomd in
      bijlage II, deel C, bij [richtlijn 2009/41](32009L0041).

      2 Hoofdstuk 2 is voorts ten aanzien van een gebruiker niet van toepassing op ingeperkt gebruik van genetisch
      gemodificeerde organismen die door hem doelbewust zijn geïntroduceerd in het milieu voor overige doeleinden, indien
      die doelbewuste introductie door hem geschiedt in overeenstemming met:

      a. de eisen, gesteld bij of krachtens [hoofdstuk 3][ref2], of

      b. door Onze Minister op grond van [artikel 3.1, eerste lid][ref3], aangewezen communautaire regelgeving, alsmede
      daarbij door Onze Minister gestelde nadere eisen.

      3 Dit hoofdstuk is voorts niet van toepassing op ingeperkt gebruik van een toegelaten product, voor zover:

      a. de houder van de betrokken vergunning als bedoeld in [artikel 4.2][ref4], dan wel de houder van het toegelaten
      product daarbij de aan die vergunning onderscheidenlijk toelating verbonden voorschriften in acht neemt, dan wel

      b. de gebruiker van het product daarbij de uit [artikel 5.1][ref5] voortvloeiende verplichtingen in acht neemt.


