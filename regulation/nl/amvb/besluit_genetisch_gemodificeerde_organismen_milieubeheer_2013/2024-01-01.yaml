  - number: '3.24'
    text: |-
      1 Onze Minister wijst bij ministeriële regeling categorieën van genetisch gemodificeerde organismen aan waarvoor:

      a. de gegevens of resultaten van aanvragen om een vergunning voor de doelbewuste introductie beschikbaar zijn, en

      b. milieurisicobeoordelingen beschikbaar zijn, die overeenkomstig bijlage II bij [richtlijn 2001/18](32001L0018)
      zijn opgesteld, waaruit is gebleken dat aan de werkzaamheden met deze categorieën van genetisch gemodificeerde
      organismen verwaarloosbare risico’s voor de gezondheid van de mens en het milieu verbonden zijn.

      2 Indien de aanvraag om een vergunning betrekking heeft op een of meer genetisch gemodificeerde organismen,
      behorende tot een categorie die is aangewezen krachtens het eerste lid, wordt het besluit op de aanvraag op verzoek
      van de aanvrager genomen met toepassing van de procedure, aangegeven in de [artikelen 3.25][ref1] en [3.26][ref2]
      of in de artikelen 3.25 en [3.26a][ref3].

      3 Onze Minister kan de toepassing van de procedure, aangegeven in de [artikelen 3.25][ref4] en [3.26][ref5] of in
      de artikelen 3.25 en [3.26a][ref6], bij de ministeriële regeling beperken tot bepaalde werkzaamheden met de daarbij
      aangewezen categorieën van genetisch gemodificeerd organismen.

      4 Indien deze paragraaf van toepassing is, is [paragraaf 3.2.2][ref7] niet van toepassing.


