  - number: '2.32'
    text: |-
      1 Indien vijf jaren zijn verstreken sinds de laatste volledige risicobeoordeling, dan wel sinds de laatste
      toepassing van dit lid, beziet de gebruiker of de uitkomst van de risicobeoordeling, al dan niet vastgesteld met
      toepassing van [artikel 2.8][ref1], nog passend is.

      2 Het eerste lid is niet van toepassing op activiteiten die betrekking hebben op genetisch gemodificeerde
      organismen met betrekking waartoe:

      a. [artikel 2.10, derde lid][ref2], van toepassing is, voor zover artikel 2.10, vijfde lid, in acht wordt genomen,
      of

      b. [artikel 2.11, tweede lid][ref3], van toepassing is, voor zover artikel 2.11, vierde lid, in acht wordt genomen.

      3 Het eerste lid is voorts niet van toepassing op de gebruiker ten aanzien van wie Onze Minister op grond van
      [artikel 2.13, eerste en derde lid][ref4], een vaststelling heeft gedaan die in overeenstemming is met artikel
      2.13, zevende lid, mits de gebruiker uitsluitend activiteiten verricht waarop die vaststelling betrekking heeft.

      4 Indien blijkt dat mogelijk een andere categorie van fysische inperking of een ander inperkingsniveau
      moet worden toegepast, voert de gebruiker een risicobeoordeling als bedoeld in [artikel 2.5][ref5] uit. De
      [artikelen 2.6 tot en met 2.9][ref6] en [2.28 tot en met 2.31][ref7] zijn van overeenkomstige toepassing.


