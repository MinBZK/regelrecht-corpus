  - number: '2.19'
    text: |-
      1 Onze Minister kan:

      a. besluiten tot het aan het ingeperkt gebruik toekennen van een andere categorie van fysische inperking dan in de
      kennisgeving is aangegeven;

      b. besluiten tot het aan het ingeperkt gebruik toekennen van een ander inperkingsniveau dan in de kennisgeving is
      aangegeven, waarbij tevens de passende categorie van fysische inperking wordt aangegeven;

      c. besluiten dat hij niet kan instemmen met het ingeperkt gebruik.

      2 Een besluit als bedoeld in het eerste lid, onder c, kan worden genomen:

      a. indien een kennisgeving voor inperkingsniveau I is gedaan: binnen 45 dagen na de datum van ontvangst van de
      kennisgeving;

      b. indien een kennisgeving voor inperkingsniveau II is gedaan: binnen de termijn, bedoeld in
      [artikel 2.17, eerste lid][ref1], onderscheidenlijk bij de beslissing, bedoeld in artikel 2.17, derde lid.

      3 In het geval, bedoeld in het eerste lid, onder a, wordt het ingeperkt gebruik uitgevoerd met toepassing van de
      door Onze Minister toegekende categorie van fysische inperking.

      4 In het geval, bedoeld in het eerste lid, onder b, wordt het ingeperkt gebruik uitgevoerd op het door Onze
      Minister toegekende inperkingsniveau, met toepassing van de door Onze Minister aangegeven categorie van fysische
      inperking. De termijn, genoemd in [artikel 2.17, eerste lid][ref2], is niet van toepassing.

      5 In het geval, bedoeld in het eerste lid, onder c, wordt niet met het ingeperkt gebruik begonnen of, indien het
      ingeperkt gebruik op inperkingsniveau I reeds is aangevangen, wordt het ingeperkt gebruik onmiddellijk beëindigd.

      6 Indien Onze Minister van oordeel is dat inperkingsniveau III of IV moet worden toegekend, kan hij de kennisgeving
      aanmerken als een aanvraag om een vergunning. Onze Minister doet hiervan mededeling aan de gebruiker.

      7 In aanvulling op [artikel 4:5 van de Algemene wet bestuursrecht][ref3] verstrekt de gebruiker desverzocht aan
      Onze Minister binnen de daartoe door Onze Minister gestelde termijn de nadere informatie waarom Onze Minister heeft
      verzocht.

      8 Indien Onze Minister een verzoek als bedoeld in het zevende lid heeft gedaan binnen de van toepassing zijnde
      termijn, bedoeld in het tweede lid, wordt die termijn opgeschort totdat Onze Minister de nadere gegevens heeft
      ontvangen. Onze Minister kan besluiten de kennisgeving aan te merken als niet gedaan, indien de gevraagde nadere
      informatie niet binnen de op grond van het zevende lid gestelde termijn is ontvangen. Onze Minister stelt de
      gebruiker onverwijld op de hoogte van een besluit als bedoeld in de vorige volzin.

      9 De besluiten, bedoeld in het eerste lid, onderdelen a tot en met c, en het achtste lid, zijn besluiten als
      bedoeld in [artikel 20.3, tweede lid, onderdeel b, van de wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0035090#Artikel2.17
      [ref2]: https://wetten.overheid.nl/BWBR0035090#Artikel2.17
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel45
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel20.3
