  - number: '2.14'
    text: |-
      1 De gebruiker die ingeperkt gebruik verricht op inperkingsniveau I en II past de categorie van fysische inperking
      en het inperkingsniveau toe die bij of krachtens dit besluit aan de desbetreffende werkzaamheden zijn toegekend.
      De gebruiker neemt daarbij de beschermingsmaatregelen in acht die bij de risicobeoordeling in de beschouwing zijn
      betrokken.

      2 Alle categorieën van fysische inperking bevinden zich in het ggo-gebied.

      3 Onverminderd het eerste en tweede lid, wordt het ingeperkt gebruik verricht overeenkomstig de bij of krachtens
      dit besluit gestelde regels, dan wel overeenkomstig de voorschriften die, in aanvulling daarop of in afwijking
      daarvan, krachtens de [artikelen 2.19 tot en met 2.21][ref1] of [artikel 2.25][ref2] zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0035090#Artikel2.19
      [ref2]: https://wetten.overheid.nl/BWBR0035090#Artikel2.25
