  - number: '2.13'
    text: |-
      1 De gebruiker kan Onze Minister verzoeken vast te stellen dat een gastheer of vector in aanmerking komt
      voor opname op een lijst die is vastgesteld op grond van [artikel 2.10, eerste lid][ref1], onderscheidenlijk
      [artikel 2.11, eerste lid][ref2].

      2 Een gastheer of vector ten aanzien waarvan Onze Minister een vaststelling heeft gedaan als bedoeld in het eerste
      lid, wordt ten aanzien van de verzoeker aangemerkt als een gastheer onderscheidenlijk een vector welke is opgenomen
      op de desbetreffende lijst die is vastgesteld op grond van [artikel 2.10, eerste lid][ref3], onderscheidenlijk
      [artikel 2.11, eerste lid][ref4].

      3 De gebruiker kan Onze Minister tevens verzoeken vast te stellen dat een insertie niet behoort tot de inserties
      die zijn opgenomen op een lijst die is vastgesteld op grond van [artikel 2.10, eerste lid][ref5], onderscheidenlijk
      [artikel 2.11, eerste lid][ref6].

      4

      5 Onze Minister kan bij ministeriële regeling voor de behandeling noodzakelijke gegevens aanwijzen die bij het
      verzoek overgelegd dienen te worden. Onze Minister kan tevens nadere regels stellen omtrent de over te leggen
      gegevens.

      6 Onze Minister beslist binnen 45 dagen op een verzoek als bedoeld in het eerste of derde lid.
      [Artikel 2.9][ref7] is van overeenkomstige toepassing. De beslissing is een besluit als bedoeld in
      [artikel 20.3, tweede lid, onderdeel b, van de wet][ref8].

      7 [Artikel 2.10, derde tot en met vijfde lid][ref9], is ten aanzien van de verzoeker van overeenkomstige
      toepassing, indien Onze Minister een vaststelling heeft gedaan als bedoeld in het eerste en derde lid, en de
      desbetreffende lijsten behoren tot dezelfde combinatie van lijsten.


