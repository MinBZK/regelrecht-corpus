  - number: '5.1'
    text: |-
      1 De gebruiker van een toegelaten product neemt bij het gebruik in acht, voor zover deze mede tot hem zijn gericht:

      a. indien de Europese Commissie krachtens [richtlijn 2001/18](32001L0018) een besluit heeft genomen met betrekking
      tot het in de handel brengen van het betrokken genetisch gemodificeerd organisme: de voorwaarden voor het in de
      handel brengen die zijn opgenomen in dat besluit;

      b. indien de Europese Commissie geen besluit als bedoeld onder a heeft genomen en een vergunning krachtens
      [hoofdstuk 4][ref1] is verleend met betrekking tot het in de handel brengen van het betrokken genetisch
      gemodificeerd organisme: de aan de vergunning krachtens hoofdstuk 4 verbonden voorschriften;

      c. indien de Europese Commissie geen besluit als bedoeld onder a heeft genomen en door de bevoegde instantie van
      een andere lidstaat met toepassing van deel C van [richtlijn 2001/18](32001L0018) toestemming is verleend met
      betrekking tot het in de handel brengen van het betrokken genetisch gemodificeerd organisme: de aan die toestemming
      verbonden voorwaarden;

      d. indien een toestemming met betrekking tot het in de handel brengen van het betrokken genetisch gemodificeerd
      organisme is verleend krachtens [artikel 1.4, eerste lid, onder b, dan wel onder c][ref2], door Onze Minister
      aangegeven regelgeving: de aan die toestemming verbonden voorwaarden.

      2 Onze Minister maakt de voorschriften ten behoeve van de gebruikers, bedoeld in het eerste lid, onder b, c en d,
      elektronisch bekend.


      [ref1]: https://wetten.overheid.nl/BWBR0035090#Hoofdstuk4
