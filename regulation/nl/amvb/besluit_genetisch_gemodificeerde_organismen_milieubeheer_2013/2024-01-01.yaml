  - number: '3.20'
    text: |-
      1 Onze Minister beslist op de aanvraag tot wijziging van de vergunning:

      a. binnen vier weken na ontvangst van het verzoek indien de betrokken verandering geen gevolgen heeft voor een
      milieurisicobeoordeling;

      b. binnen acht weken na ontvangst van het verzoek in andere gevallen.

      2 Een besluit als bedoeld in het eerste lid wordt bekendgemaakt in een van overheidswege uitgegeven blad of een
      dag-, nieuws- of huis-aan-huis-blad, dan wel op een andere geschikte wijze.
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel3.20
  - number: '3.21'
    text: |-
      1 Onze Minister kan ambtshalve of op verzoek een vergunning wijzigen of intrekken op andere gronden dan die genoemd
      in de [paragrafen 3.2.3][ref1] en [3.2.4][ref2].

      2 Tot deze andere gronden behoort in elk geval de uitvoering van besluiten of aanbevelingen van de Raad van de
      Europese Unie of van de Europese Commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0035090#Hoofdstuk3
