      1

      2 Bij de aanvraag worden in elk geval de gegevens, genoemd in [bijlage 5][ref1], overgelegd.

      3 Onze Minister kan bij ministeriële regeling andere voor de behandeling noodzakelijke gegevens aanwijzen die bij
      de aanvraag overgelegd dienen te worden. Onze Minister kan tevens nadere regels stellen omtrent de over te leggen
      gegevens.

      4 Onze Minister tekent de datum van ontvangst aan op de aanvraag en zendt aan de aanvrager onverwijld een bewijs
      van ontvangst waarin die datum is vermeld.


