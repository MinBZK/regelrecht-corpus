  - number: '6.11'
    text: |-
      1 Het [Besluit genetisch gemodificeerde organismen milieubeheer][ref1] en de daarop gebaseerde regelgeving
      zoals deze gold voor het tijdstip van inwerkingtreding van dit besluit, blijft van toepassing op de onderstaande
      besluiten, totdat deze onherroepelijk zijn geworden:

      a. een besluit omtrent het verlenen, wijzigen, verlengen of intrekken van een vergunning als bedoeld in
      [artikel 23, eerste lid, van genoemd besluit][ref2];

      b. een besluit als bedoeld in [artikel 24a, eerste lid, onder f, van genoemd besluit][ref3].

      2 Nadat het onherroepelijk is geworden, wordt een besluit als bedoeld in het eerste lid, onder a, aangemerkt als
      een besluit omtrent het verlenen, wijzigen, verlengen onderscheidenlijk intrekken van:

      a. een vergunning als bedoeld in [artikel 3.2][ref4] van dit besluit, indien de vergunning betrekking heeft op de
      doelbewuste introductie voor overige doeleinden;

      b. een vergunning als bedoeld in [artikel 4.2][ref5] van dit besluit, indien de vergunning betrekking heeft op de
      doelbewuste introductie door het in de handel brengen.

      3 Nadat het onherroepelijk is geworden, wordt een besluit als bedoeld in het eerste lid, onder b, aangemerkt als
      een besluit omtrent het wijzigen van een vergunning als bedoeld in [artikel 3.2][ref6] van dit besluit.


