  - number: '1.6'
    text: |-
      Onze Minister stelt regels met betrekking tot het vervoeren van:

      a. genetisch gemodificeerde organismen, niet zijnde een micro-organisme en niet zijnde een toegelaten product;

      b. genetisch gemodificeerde organismen, niet zijnde een micro-organisme, in associatie met een al dan niet
      genetisch gemodificeerd micro-organisme;

      c. organismen, niet zijnde een micro-organisme, in associatie met een genetisch gemodificeerd micro-organisme.
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel1.6
  - number: '1.7'
    text: |-
      1 De [hoofdstukken 2][ref1], [3][ref2] en [4][ref3] zijn niet van toepassing op:

      a. het vervoeren van genetisch gemodificeerde organismen waarop [artikel 1.6][ref4] van toepassing is, indien is
      voldaan aan de regels, gesteld krachtens dat artikel;

      b. het vervoeren van genetisch gemodificeerde organismen waarop [artikel 1.6][ref5] niet van toepassing is.

      2 In afwijking van het eerste lid zijn van toepassing op het vervoeren van een toegelaten product door de houder
      van een vergunning krachtens [hoofdstuk 4][ref6]: de aan die vergunning verbonden voorschriften, voor zover deze
      betrekking hebben op het vervoer.


