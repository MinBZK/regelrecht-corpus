  - number: '3.14'
    text: |-
      In deze paragraaf wordt onder het wijzigen van een vergunning mede verstaan het wijzigen of uitbreiden van het
      bereik van de vergunning, waaronder het vervangen of toevoegen van een of meer locaties voor de doelbewuste
      introductie voor overige doeleinden.
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel3.14
  - number: '3.15'
    text: |-
      Onze Minister kan bij ministeriële regeling categorieën van gevallen aanwijzen, waarin een verandering in de
      doelbewuste introductie voor overige doeleinden wordt aangemerkt als een verandering die:

      a. geen gevolgen heeft voor een met betrekking tot die introductie uitgevoerde milieurisicobeoordeling, of

      b. geen significante gevolgen heeft voor een met betrekking tot die introductie uitgevoerde
      milieurisicobeoordeling.
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel3.15
  - number: '3.16'
    text: |-
      1 Een vergunning geldt tevens voor een verandering in de doelbewuste introductie voor overige doeleinden die
      behoort tot de categorieën van gevallen, aangewezen krachtens [artikel 3.15, onder a][ref1], onder voorwaarde dat
      het voornemen tot het uitvoeren van de verandering schriftelijk aan Onze Minister is gemeld overeenkomstig de bij
      of krachtens het tweede en derde lid gestelde regels, en vijf werkdagen zijn verstreken, gerekend vanaf:

      a. de dag van aangetekende verzending van de melding, of

      b. de dag waarop het bewijs van ontvangst van de melding degene die de melding heeft gedaan, heeft bereikt.

      2

      3 Onze Minister stelt regels met betrekking tot de bij de melding over te leggen gegevens.

      4 Het eerste lid is niet van toepassing op een verandering die bestaat uit het vervangen of toevoegen van een of
      meer locaties voor de doelbewuste introductie voor overige doeleinden.


      [ref1]: https://wetten.overheid.nl/BWBR0035090#Artikel3.15
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel3.16
    references:
