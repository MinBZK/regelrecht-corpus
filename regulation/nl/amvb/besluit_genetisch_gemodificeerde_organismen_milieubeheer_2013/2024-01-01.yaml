  - number: '2.10'
    text: |-
      1 Bij ministeriële regeling stelt Onze Minister op basis van een door hem uitgevoerde risicobeoordeling een of meer
      combinaties van lijsten vast, waarbij een combinatie lijsten omvat van:

      a. gastheren die bij gebruik onder laboratoriumcondities geschikt zijn voor de vervaardiging van genetisch
      gemodificeerde organismen van inperkingsniveau I in een of meer daarbij aangegeven categorieën van fysische
      inperking,

      b. vectoren die bij gebruik onder laboratoriumcondities geschikt zijn voor de vervaardiging van genetisch
      gemodificeerde organismen van inperkingsniveau I in een of meer daarbij aangegeven categorieën van fysische
      inperking, en

      c. inserties die bij gebruik onder laboratoriumcondities niet geschikt zijn voor de vervaardiging van genetisch
      gemodificeerde organismen van inperkingsniveau I in een of meer daarbij aangegeven categorieën van fysische
      inperking.

      2 De lijsten die behoren tot dezelfde combinatie van lijsten, hebben betrekking op dezelfde categorie of
      categorieën van fysische inperking.

      3 De gebruiker die voornemens is onder laboratoriumcondities een genetisch gemodificeerd organisme te vervaardigen:

      a. dat is samengesteld uit een gastheer en een of meer vectoren, die zijn opgenomen op een lijst als bedoeld in het
      eerste lid, aanhef en onder a onderscheidenlijk b, en

      b. waarvan de insertie of inserties, voor zover deze niet behoort of behoren tot een vector, niet is of zijn
      vermeld op een lijst, bedoeld in het eerste lid, aanhef en onder c,

      behoeft met betrekking tot dat ingeperkt gebruik, in afwijking van [artikel 2.5][ref1], geen risicobeoordeling uit
      te voeren, mits alle betrokken lijsten behoren tot dezelfde combinatie van lijsten.

      4 De gebruiker die voornemens is onder laboratoriumcondities handelingen te verrichten met een genetisch
      gemodificeerd organisme als bedoeld in het derde lid, behoeft met betrekking tot dat ingeperkt gebruik evenmin een
      risicobeoordeling uit te voeren.

      5 Het ingeperkt gebruik als bedoeld in het derde en vierde lid geschiedt op inperkingsniveau I in de daarbij
      aangegeven categorie van fysische inperking, dan wel in een van de daarbij aangegeven categorieën van fysische
      inperking.


      [ref1]: https://wetten.overheid.nl/BWBR0035090#Artikel2.5
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel2.10
