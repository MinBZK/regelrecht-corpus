  - number: '2.17'
    text: |-
      1 Met het ingeperkt gebruik op inperkingsniveau II mag worden begonnen 45 dagen na de datum van ontvangst van de
      kennisgeving.

      2 De gebruiker kan Onze Minister bij de kennisgeving om een beschikking inzake toestemming verzoeken.

      3 Onze Minister beslist binnen 45 dagen na ontvangst van een verzoek als bedoeld in het tweede lid. De beslissing
      is een besluit als bedoeld in [artikel 20.3, tweede lid, onderdeel b, van de wet][ref1].

      4 Onze Minister kan bij ministeriële regeling voor daarbij aangewezen activiteiten:

      a. een kortere termijn aangeven dan de termijn, bedoeld in het eerste lid, of

      b. bepalen dat de termijn, bedoeld in het eerste lid, niet geldt.

      5 De termijn, genoemd in het eerste lid, is niet van toepassing indien Onze Minister bij een beschikking
      toestemming heeft gegeven als bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel20.3
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel2.17
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '20.3'
  - number: '2.18'
    text: |-
      1 In aanvulling op [artikel 4:5 van de Algemene wet bestuursrecht][ref1] verstrekt de gebruiker desverzocht aan
      Onze Minister binnen de daartoe door Onze Minister gestelde termijn de nadere informatie waarom Onze Minister naar
      aanleiding van de kennisgeving heeft verzocht.

      2 Indien Onze Minister een verzoek als bedoeld in het eerste lid heeft gedaan binnen de termijn, bedoeld
      in [artikel 2.17, eerste of derde lid][ref2], wordt die termijn opgeschort totdat Onze Minister de
      nadere gegevens heeft ontvangen. Indien in combinatie met de kennisgeving een verzoek op grond van
      [artikel 2.8, eerste of tweede lid][ref3], is gedaan, wordt de termijn, bedoeld in artikel 2.8, zesde lid, mede
      opgeschort totdat Onze Minister de nadere gegevens heeft ontvangen.

      3 In een geval als bedoeld in het eerste lid kan Onze Minister besluiten de kennisgeving aan te merken als niet
      gedaan, indien de gevraagde nadere informatie niet binnen de gestelde termijn is ontvangen. Onze Minister kan
      tevens besluiten het verzoek op grond van [artikel 2.8][ref4] dat in combinatie met de kennisgeving is gedaan, niet
      of niet verder te behandelen.

      4 Onze Minister stelt de gebruiker onverwijld op de hoogte van een besluit als bedoeld in het derde lid, dat een
      besluit is als bedoeld in [artikel 20.3, tweede lid, onderdeel b, van de wet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0035090#Artikel2.17
      [ref3]: https://wetten.overheid.nl/BWBR0035090#Artikel2.8
      [ref4]: https://wetten.overheid.nl/BWBR0035090#Artikel2.8
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Artikel20.3
