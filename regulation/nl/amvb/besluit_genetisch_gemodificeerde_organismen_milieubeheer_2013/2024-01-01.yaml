  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Infrastructuur en Milieu van 29 juni 2012 nr. IENM/BSK-2012/120140,
    gedaan in overeenstemming met Onze Staatssecretaris van Economische Zaken, Landbouw en Innovatie;

    Gelet op:

    De Afdeling advisering van de Raad van State gehoord (advies van 28 september 2012, nr. W14.12.0231/IV);

    Gezien het nader rapport van de Staatssecretaris van Infrastructuur en Milieu van 27 maart 2014 nr. IenM/BSK-
    2013/271662, uitgebracht in overeenstemming met Onze Minister van Economische Zaken, Landbouw en Innovatie;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder genetisch gemodificeerd organisme:
      organisme, met uitzondering van menselijke wezens, waarvan het genetisch materiaal is veranderd op een wijze die
      van nature niet mogelijk is door voortplanting of natuurlijke recombinatie.

      2 Als genetisch gemodificeerd organisme worden in elk geval aangemerkt organismen die zijn verkregen door middel
      van technieken als genoemd in [bijlage 1][ref1].

      3 Als genetisch gemodificeerd organisme worden niet aangemerkt organismen die zijn verkregen door middel van
      technieken als genoemd in [bijlage 2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0035090
      [ref2]: https://wetten.overheid.nl/BWBR0035090
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0035090
      - id: ref2
        bwb_id: BWBR0035090
  - number: '1.2'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder ingeperkt gebruik: elke activiteit waarbij
      genetisch gemodificeerde organismen worden vervaardigd, in Nederland ingevoerd, toegepast, vervoerd, vernietigd
      of vermeerderd, dan wel waarbij het betreft het voorhanden hebben, aan een ander ter beschikking stellen of zich
      ontdoen van genetisch gemodificeerde organismen, indien bij die activiteit inperkingsmaatregelen worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel1.2
  - number: '1.3'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder doelbewuste introductie: het op enigerlei
      wijze opzettelijk in het milieu brengen van een genetisch gemodificeerd organisme of een combinatie van genetisch
      gemodificeerde organismen zonder dat inperkingsmaatregelen aanwezig zijn of worden toegepast.

      2 Onder «doelbewuste introductie» worden in elk geval mede verstaan het vervaardigen, in Nederland invoeren,
      toepassen, voorhanden hebben, aan een ander ter beschikking stellen, vervoeren, zich ontdoen, vernietigen en
      vermeerderen van een genetisch gemodificeerde organisme of een combinatie van genetisch gemodificeerde organismen.
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel1.3
  - number: '1.4'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

        - *product:* een in de handel gebracht product, bestaande uit een genetisch gemodificeerd organisme, een combinatie
      van genetisch gemodificeerde organismen, of deze bevattende;
        - *toegelaten product:* een genetisch gemodificeerd organisme dat als product of in producten in de handel is
      gebracht in overeenstemming met: a. [hoofdstuk 4][ref1], b. [verordening 1829/2003](32003R1829) of [verordening
      726/2004](32004R0726), en een specifieke milieurisicobeoordeling overeenkomstig [hoofdstuk 4][ref2], c. andere door
      Onze Minister aangewezen communautaire regelgeving, of d. de schriftelijke toestemming, overeenkomstig deel C van
      [richtlijn 2001/18](32001L0018) verleend door de bevoegde instantie van een andere lidstaat;
        - *gebruik van een toegelaten product:* ingeperkt gebruik of doelbewuste introductie van een toegelaten product;
        - *gebruiker van een toegelaten product:* degene die een toegelaten product gebruikt, niet zijnde de houder van een
      vergunning voor dat product op grond van [hoofdstuk 4][ref3] of de eindverbruiker van het product.

      2 Bij een aanwijzing als bedoeld in het eerste lid, onder c, kan Onze Minister bepalen dat een product slechts als
      een toegelaten product wordt aangemerkt, indien het product mede in overeenstemming met door Onze Minister gestelde
      eisen in de handel is gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0035090#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0035090#Hoofdstuk4
