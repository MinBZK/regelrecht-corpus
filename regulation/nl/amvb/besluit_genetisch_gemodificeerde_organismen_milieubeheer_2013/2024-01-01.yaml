        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0003245
        afdeling: '13.2'
  - number: '4.7'
    text: |-
      Voorafgaand aan de aanvraag om verlening van een vergunning voert degene die voornemens is een doelbewuste
      introductie uit te voeren door een genetisch gemodificeerd organisme in de handel te brengen een
      milieurisicobeoordeling uit.
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel4.7
  - number: '4.8'
    text: |-
      1 Bij de aanvraag om een vergunning wordt gebruik gemaakt van gestandaardiseerde gegevensformaten als bedoeld in
      artikel 39 septies van [verordening 178/2002](32002R0178) dan wel, bij afwezigheid daarvan, van formaten waarmee
      kan worden voldaan aan de openbaarmaking, bedoeld artikel 28, vierde lid, van [richtlijn 2001/18](32001L0018).

      2 De aanvraag bevat:

      a. informatie overeenkomstig bijlage III en IV bij [richtlijn 2001/18](32001L0018);

      b. een milieurisicobeoordeling;

      c. voorschriften voor het in de handel brengen van de genetisch gemodificeerde organismen als product of in
      producten, daaronder begrepen voorschriften inzake gebruik en behandeling;

      d. de gewenste geldigheidsduur van de vergunning, met dien verstande dat deze niet meer dan tien jaar mag bedragen;

      e. een monitoringplan overeenkomstig bijlage VII bij [richtlijn 2001/18](32001L0018) en overeenkomstig daarop
      betrekking hebbende besluiten of aanbevelingen van de Raad van de Europese Unie of van de Europese Commissie,
      daaronder mede begrepen een voorstel voor de duur van het plan;

      f. een voorstel met betrekking tot de etikettering en de verpakking overeenkomstig bijlage IV bij [richtlijn
      2001/18](32001L0018);

      g. een samenvatting van het dossier overeenkomstig daarop betrekking hebbende besluiten of aanbevelingen van de
      Raad van de Europese Unie of van de Europese Commissie, en

      h. indien van toepassing, informatie over gegevens of resultaten van de introducties van dezelfde genetisch
      gemodificeerde organismen, waarvoor reeds eerder of tegelijkertijd een vergunning dan wel toestemming is
      aangevraagd of verleend of informatie over gegevens of resultaten van de introducties van dezelfde genetisch
      gemodificeerde organismen, die op dat moment worden verricht binnen of buiten de Europese Unie.

      3 Onze Minister kan bij ministeriële regeling andere voor de behandeling noodzakelijke gegevens aanwijzen die bij
      de aanvraag overgelegd dienen te worden. Onze Minister kan tevens nadere regels stellen omtrent de over te leggen
      gegevens.

      4 Onze Minister kan ter uitvoering van besluiten of aanbevelingen van de Raad van de Europese Unie of van de
      Europese Commissie, voor bij die beschikkingen aangegeven soorten genetisch gemodificeerde organismen als product
      of in producten, van het eerste en tweede lid afwijkende regels stellen.

      5 Onze Minister kan op verzoek van de aanvrager toestaan dat de over te leggen gegevens overeenkomstig onderdeel
      B van bijlage IV bij [richtlijn 2001/18](32001L0018) niet of slechts ten dele behoeven te worden verstrekt, indien
      de aanvrager aannemelijk kan maken dat het in de handel brengen en het gebruik van die genetisch gemodificeerde
      organismen als product of in producten geen risico’s met zich meebrengt voor de gezondheid van mens of het milieu.

      6 De aanvrager kan ter voldoening aan het bepaalde bij of krachtens het tweede en derde lid verwijzen naar gegevens
      of resultaten van een eerdere door hem ingediende aanvraag om een vergunning.

      7 De aanvrager kan door hem relevant geachte aanvullende informatie indienen.

      8 De aanvrager kan ter voldoening aan het bepaalde bij of krachtens het tweede en derde lid verwijzen naar gegevens
      of resultaten van een eerdere aanvraag om een vergunning van een andere aanvrager, voor zover die gegevens of
      resultaten niet vertrouwelijk zijn of de andere vergunninghouder daarvoor schriftelijk toestemming heeft verleend.

      9 Onze Minister tekent de datum van ontvangst aan op de aanvraag en zendt de aanvrager onverwijld een bewijs van
      ontvangst waarin die datum is vermeld.

      10 Onze Minister zendt onverwijld de in het tweede lid bedoelde samenvatting aan de bevoegde instanties van de
      andere lidstaten van de Europese Unie en aan de Europese Commissie.
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel4.8
  - number: '4.9'
    text: |-
      1 In aanvulling op [artikel 4:5 van de Algemene wet bestuursrecht][ref1] verstrekt de aanvrager desverzocht aan
      Onze Minister binnen de daartoe door Onze Minister gestelde termijn nadere informatie ter voorbereiding van het
      besluit op een aanvraag als bedoeld in [artikel 4.8][ref2].

      2 Indien Onze Minister om nadere informatie heeft verzocht, wordt de termijn, bedoeld in
      [artikel 4.11, eerste lid][ref3], opgeschort totdat Onze Minister de nadere gegevens heeft ontvangen.

      3 Indien de gevraagde nadere informatie niet binnen de gestelde termijn is ontvangen, kan Onze Minister besluiten
      de aanvraag niet of niet verder te behandelen.

      4 Onze Minister stelt de aanvrager onverwijld op de hoogte van een besluit als bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0035090#Artikel4.8
      [ref3]: https://wetten.overheid.nl/BWBR0035090#Artikel4.11
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel4.9
