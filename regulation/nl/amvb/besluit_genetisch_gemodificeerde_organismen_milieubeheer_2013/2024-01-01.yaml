  - number: '2.39'
    text: |-
      1 In de vergunning wordt in elk geval bepaald dat op het ingeperkt gebruik de categorie van fysische inperking
      en het inperkingsniveau worden toegepast die met toepassing van dit hoofdstuk aan de desbetreffende werkzaamheden
      zijn toegekend.

      2 In afwijking van het eerste lid kan Onze Minister bij de vergunning een ander inperkingsniveau of een andere
      categorie van fysische inperking aan het ingeperkt gebruik toekennen dan bij de aanvraag is aangegeven.

      3 Indien Onze Minister van oordeel is dat inperkingsniveau I of II moet worden toegekend, kan hij de aanvraag
      om een vergunning aanmerken als een kennisgeving. Onze Minister doet hiervan mededeling aan de gebruiker, onder
      vermelding van het van toepassing zijnde inperkingsniveau en de categorie van fysische inperking. De termijn,
      genoemd in [artikel 2.17, eerste lid][ref1], is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0035090#Artikel2.17
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel2.39
