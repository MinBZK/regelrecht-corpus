  - number: '2.33'
    text: |-
      1 Voorafgaand aan het ingeperkt gebruik stelt de gebruiker veiligheidsprocedures op voor de bij ongewone voorvallen
      te nemen maatregelen.

      2 Indien zich een ongewoon voorval voordoet waarbij genetisch gemodificeerde organismen buiten de toegekende
      categorie van fysische inperking van inperkingsniveau I of II terecht zijn gekomen of kunnen zijn gekomen, doet de
      gebruiker daarvan onmiddellijk mededeling aan Onze Minister.

      3 In geval een situatie als beschreven in het tweede lid zich voordoet, neemt de gebruiker maatregelen om de
      risico’s voor de gezondheid van de mens en het milieu zo veel mogelijk te beperken.
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel2.33
  - number: '2.34'
    text: |-
      1 Indien Onze Minister de beschikking krijgt over gegevens waaruit blijkt dat mogelijk een ander inperkingsniveau
      of een andere categorie van fysische inperking moet worden toegekend, kan hij de gebruiker bevelen het ingeperkt
      gebruik te schorsen of te beëindigen of de omstandigheden ervan te wijzigen.

      2 De gebruiker voldoet onmiddellijk aan het bevel.

      3 Indien een bevel is gegeven om het ingeperkt gebruik te schorsen of te beëindigen, worden de voorhanden zijnde
      genetisch gemodificeerde organismen vernietigd, dan wel opgeslagen overeenkomstig de bij ministeriële regeling voor
      de opslag van deze organismen gestelde regels.
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel2.34
  - number: '2.35'
    text: |-
      1 Ingeperkt gebruik op inperkingsniveau III of IV zonder vergunning van Onze Minister is verboden.

      2 In deze afdeling wordt onder «vergunning» verstaan: een vergunning als bedoeld in het eerste lid.

      3 Alle categorieën van fysische inperking bevinden zich in het ggo-gebied.

      4 Het ingeperkt gebruik wordt verricht overeenkomstig:

      a. het bij of krachtens dit besluit bepaalde;

      b. de voorschriften die, in aanvulling op of in afwijking van de door Onze Minister gestelde regels, zijn
      vastgesteld krachtens [artikel 2.41][ref1] in verbinding met [artikel 2.20][ref2] en [2.21][ref3], en

      c. de aan de vergunning verbonden voorschriften, met inbegrip van de voorschriften die, krachtens
      [artikel 2.39][ref4], [2.40][ref5], [2.44][ref6] of [2.47][ref7] zijn vastgesteld in aanvulling op of in afwijking
      van de door Onze Minister gestelde regels.


