  - number: '4.27'
    text: |-
      1 Het besluit tot het wijzigen of intrekken van een vergunning als bedoeld in [artikel 4.26, tweede lid][ref1],
      wordt zo spoedig mogelijk genomen. Tenzij de vereiste spoed zich daartegen verzet, wordt de houder van de
      vergunning gehoord alvorens het besluit wordt genomen.

      2 Op het wijzigen van een vergunning op verzoek is [afdeling 4.2][ref2] van overeenkomstige toepassing, met dien
      verstande dat de gegevens, aangewezen bij of krachtens [artikel 4.8, tweede en derde lid][ref3], slechts behoeven
      te worden overgelegd voor zover deze gegevens van betekenis zijn voor de wijziging.

      3 Het besluit wordt bekendgemaakt in een van overheidswege uitgegeven blad of een dag-, nieuws- of huis-aan-huis-
      blad, dan wel op een andere geschikte wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0035090#Artikel4.26
      [ref2]: https://wetten.overheid.nl/BWBR0035090#Hoofdstuk4
