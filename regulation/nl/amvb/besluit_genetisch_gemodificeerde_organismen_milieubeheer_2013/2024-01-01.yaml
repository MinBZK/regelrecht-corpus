  - number: '4.17'
    text: |-
      1 Onze Minister kan op aanvraag van de houder van de vergunning de geldigheidsduur van een vergunning verlengen,
      indien deze verlenging uiterlijk negen maanden voor het verstrijken van de geldigheidsduur van de vergunning is
      aangevraagd.

      2 Een vergunning blijft, indien de verlenging tijdig is aangevraagd, geldig tot het moment waarop op de aanvraag om
      verlenging is beslist.

      3 Een aanvraag om verlenging wordt schriftelijk bij Onze Minister ingediend en bevat:

      a. een afschrift van de vergunning voor het in de handel brengen;

      b. een rapportage als bedoeld in [artikel 4.21, tweede lid][ref1], indien monitoring in de oorspronkelijke
      vergunning is voorgeschreven;

      c. nieuwe informatie die over de risico’s van de genetisch gemodificeerde organismen als product of in producten
      voor de gezondheid van mens of het milieu beschikbaar is gekomen;

      d. zo nodig een voorstel tot wijziging of aanvulling van de aan de vergunning verbonden voorschriften, waaronder de
      voorschriften die verband houden met de toekomstige monitoring en de geldigheidsduur van de vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0035090#Artikel4.21
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel4.17
