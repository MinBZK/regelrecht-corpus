  - number: '2.20'
    text: |-
      1 Indien bij of krachtens dit besluit een daarbij aangegeven maatregel ter bescherming van de gezondheid van de
      mens en het milieu is vastgesteld, kan een andere maatregel worden toegepast indien Onze Minister heeft beslist dat
      met die maatregel ten minste een gelijkwaardig niveau van bescherming van de gezondheid van de mens en het milieu
      wordt bereikt.

      2 De gebruiker dient een aanvraag in tot het kunnen treffen van andere maatregelen bij Onze Minister, welke
      aanvraag gegevens bevat waaruit blijkt dat met die andere maatregelen ten minste een gelijkwaardig niveau van
      bescherming van het milieu wordt bereikt.

      3 Onze Minister beslist binnen acht weken over de gelijkwaardigheid van de andere maatregelen. Hij kan deze termijn
      eenmaal met ten hoogste zes weken verlengen.
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel2.20
  - number: '2.21'
    text: |-
      1 Onze Minister kan op verzoek van de gebruiker of ambtshalve de verplichting opleggen te voldoen aan voorschriften
      met betrekking tot:

      a. specifieke handelingen met genetisch gemodificeerde organismen;

      b. de maatregelen die het betreft;

      c. de werkruimten waarop de maatregelen, bedoeld onder b, betrekking hebben;

      d. de duur van het ingeperkt gebruik.

      2 De voorschriften kunnen afwijken van de krachtens [artikel 2.2][ref1] gestelde regels.

      3 Onze Minister kan de voorschriften op verzoek of ambtshalve aanvullen, wijzigen of intrekken.

      4 Onze Minister beslist binnen acht weken op een verzoek tot het vaststellen, aanvullen, wijzigen of intrekken van
      voorschriften als bedoeld in het eerste lid. Hij kan deze termijn eenmaal met ten hoogste zes weken verlengen. De
      beslissing is een besluit als bedoeld in [artikel 20.3, tweede lid, onderdeel b, van de wet][ref2].

      5 Op verzoek van Onze Minister legt de gebruiker de gegevens over die nodig zijn om te kunnen vaststellen of
      toepassing moet of kan worden gegeven aan het eerste of derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0035090#Artikel2.2
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel20.3
