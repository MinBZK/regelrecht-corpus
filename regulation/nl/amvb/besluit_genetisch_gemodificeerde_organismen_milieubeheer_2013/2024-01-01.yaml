  - number: '6.2'
    text: |-
      1 Het is verboden te handelen in strijd met artikel 4, eerste, tweede, vierde en zesde lid, van [verordening
      1830/2003](32003R1830).

      2 Het verbod, bedoeld in het eerste lid, geldt niet indien artikel 4, zevende of achtste lid, van toepassing is.

      3 Het is verboden te handelen in strijd met artikel 4, eerste en tweede lid, van [verordening 1830/2003]
      (32003R1830).

      4 Het verbod, bedoeld in het derde lid, geldt niet indien artikel 6 van [verordening 1830/2003](32003R1830) van
      toepassing is.
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel6.2
  - number: '6.3'
    text: |-
      Het is verboden te handelen in strijd met het bepaalde bij:

      a. artikel 5, eerste lid, tweede volzin, en derde lid, van [verordening 1946/2003](32003R1946),

      b. artikel 4, tweede en derde volzin, van [verordening 1946/2003](32003R1946),

      c. artikel 6, eerste alinea, van [verordening 1946/2003](32003R1946), en

      d. artikel 8, derde lid, van [verordening 1946/2003](32003R1946), voor zover er geen adequate maatregelen zijn
      genomen.
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel6.3
  - number: '6.4'
    text: |-
      Het is verboden te handelen in strijd met het bepaalde bij:

      a. artikel 10, derde lid, tweede volzin, van [verordening 1946/2003](32003R1946),

      b. artikel 10, eerste en tweede lid, van [verordening 1946/2003](32003R1946).
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel6.4
  - number: '6.5'
    text: |-
      Het is verboden te handelen in strijd met de voorschriften gesteld bij de artikelen 12 en 13 van [verordening
      1946/2003](32003R1946).
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel6.5
  - number: '6.6'
    text: |-
      1 Onze Minister is de bevoegde instantie, bedoeld in artikel 3, negentiende lid, van [verordening 1946/2003]
      (32003R1946) en treedt op als nationaal contactpunt, bedoeld in artikel 3, twintigste lid, van [verordening
      1946/2003](32003R1946).

      2 Onze Minister draagt zorg voor de taken die in [verordening 1946/2003](32003R1946) aan de lidstaten zijn
      opgedragen.
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel6.6
  - number: '6.7'
    text: |-
      1 Een wijziging van een artikel van of een bijlage bij [richtlijn 2001/18](32001L0018) of [richtlijn 2009/41]
      (32009L0041), waarnaar in dit besluit wordt verwezen, treedt voor de toepassing van dit besluit in werking met
      ingang van de dag waarop uitvoering moet zijn gegeven:

      a. aan de betrokken wijzigingsrichtlijn, dan wel

      b. aan het betrokken wijzigingsbesluit dat is genomen met toepassing van een procedure als bedoeld in:

      1°. artikel 30, tweede of derde lid, van [richtlijn 2001/18](32001L0018), of

      2°. artikel 20, tweede en derde lid, van [richtlijn 2009/41](32009L0041).

      2 Een besluit of aanbeveling van de Raad van de Europese Unie of de Europese Commissie waarnaar wordt verwezen in
      dit besluit, treedt voor de toepassing van dit besluit in werking met ingang van de dag waarop aan dat besluit of
      die aanbeveling uitvoering moet zijn gegeven. De eerste volzin is van overeenkomstige toepassing op een wijziging
      van een besluit of een aanbeveling als bedoeld in die volzin.
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel6.7
  - number: '6.8'
    text: |-
      1 Een op het tijdstip van inwerkingtreding van dit besluit geldende vergunning krachtens
      [artikel 8, eerste lid][ref1], [9, eerste lid][ref2], [10, eerste lid][ref3], [11, eerste lid][ref4] of
      [17, eerste lid, van het Besluit genetisch gemodificeerde organismen milieubeheer][ref5], zoals dit laatstelijk
      gold, wordt aangemerkt als:

      a. een kennisgeving, als bedoeld in [artikel 2.15][ref6], voor zover de vergunning betrekking heeft op het
      verrichten van ingeperkt gebruik op ten hoogste inperkingsniveau I of II-k;

      b. een vergunning als bedoeld in [artikel 2.35][ref7], voor zover de vergunning betrekking heeft op het verrichten
      van ingeperkt gebruik op inperkingsniveau II-v, III of IV.

      2 Indien het eerste lid, onder a, van toepassing is, worden de aan de vergunning verbonden voorschriften en
      beperkingen aangemerkt als voorschriften als bedoeld in [artikel 2.21][ref8].

      3 Indien het eerste lid, onder b, van toepassing is, worden de aan de vergunning verbonden voorschriften
      en beperkingen, voor zover nodig, aangemerkt als voorschriften die zijn vastgesteld met toepassing van
      [artikel 2.40][ref9].

      4 Een besluit krachtens
      [artikel 2, vierde lid, van het Besluit genetisch gemodificeerde organismen milieubeheer][ref10], zoals dit
      laatstelijk gold, wordt aangemerkt als een besluit op grond van [artikel 2.13, zesde lid][ref11], waarbij de
      lijsten, vastgesteld op grond van artikel 2, vierde lid, van het Besluit genetisch gemodificeerde organismen
      milieubeheer, worden aangemerkt als een combinatie van lijsten als bedoeld in [artikel 2.10][ref12].

      5 Een besluit krachtens
      [artikel 9, derde lid, van het Besluit genetisch gemodificeerde organismen milieubeheer][ref13], zoals dit
      laatstelijk gold, wordt aangemerkt als deel uitmakend van:

      a. de kennisgeving, bedoeld in het eerste lid, onder a , indien het een handeling betreft op inperkingsniveau I of
      II-k;

      b. de vergunning, bedoeld in het eerste lid, onder b, indien het een handeling betreft op inperkingsniveau II-v,
      III of IV.

      6 Het vijfde lid is van overeenkomstige toepassing op een vaststelling van rechtswege als bedoeld in
      [artikel 9, vierde lid, van genoemd besluit][ref14].


