  - number: '4.25'
    text: |-
      Onze Minister kan het monitoringplan op verzoek of ambtshalve wijzigen, mits deze wijziging niet in strijd is met
      de aan de vergunning verbonden voorschriften.
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel4.25
  - number: '4.26'
    text: |-
      1 Onze Minister kan ambtshalve of op verzoek een vergunning wijzigen of intrekken op andere gronden dan die genoemd
      in [afdeling 4.3][ref1] en [afdeling 4.4][ref2].

      2 Tot deze andere gronden behoort in elk geval de uitvoering van besluiten of aanbevelingen van de Raad van de
      Europese Unie of van de Europese Commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0035090#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0035090#Hoofdstuk4
