  - number: '2.24'
    text: |-
      1 Indien de gebruiker een kennisgeving heeft gedaan als bedoeld in [artikel 2.23, eerste lid][ref1], mag met het
      gewijzigde ingeperkt gebruik worden begonnen op het eerste van de volgende twee tijdstippen:

      a. het tijdstip waarop het bewijs van ontvangst, bedoeld in [artikel 2.15, vijfde lid][ref2], de gebruiker heeft
      bereikt;

      b. de tweede dag na de dag van aangetekende verzending van de kennisgeving.

      2 Indien de gebruiker geen kennisgeving behoeft te doen ingevolge [artikel 2.23, eerste lid][ref3], mag met het
      gewijzigde ingeperkt gebruik direct na afronding van de risicobeoordeling worden begonnen, mits het ingeperkt
      gebruik geschiedt op het passende inperkingsniveau en in de passende categorie van fysische inperking.

      3 Indien de gebruiker ingevolge [artikel 2.23, derde lid][ref4], een vergunning nodig heeft, mag met het gewijzigde
      ingeperkt gebruik eerst worden begonnen, zodra dat ingevolge de vergunning is toegestaan.


