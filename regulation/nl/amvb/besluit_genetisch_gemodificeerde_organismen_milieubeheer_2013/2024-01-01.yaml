  - number: '4.18'
    text: |-
      1 Onze Minister tekent de datum van ontvangst aan op de aanvraag om verlenging van een vergunning en zendt de
      houder van de vergunning onverwijld een bewijs van ontvangst waarin die datum is vermeld.

      2 Onze Minister stelt na ontvangst van de aanvraag overeenkomstig bijlage VI bij [richtlijn 2001/18](32001L0018)
      een beoordelingsrapport op.

      3 Onze Minister zendt het beoordelingsrapport aan de houder van de vergunning en zendt het beoordelingsrapport en
      een afschrift van de aanvraag onverwijld aan de Europese Commissie.
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel4.18
  - number: '4.19'
    text: |-
      1 Onze Minister beslist op een aanvraag om verlenging van een vergunning:

      a. indien door de Europese Commissie of de bevoegde instanties van de andere lidstaten geen bezwaar is gemaakt
      ingevolge artikel 17 van [richtlijn 2001/18](32001L0018): binnen 30 dagen na het verstrijken van de termijn
      waarbinnen bezwaar had kunnen worden gemaakt;

      b. indien door de Europese Commissie of de bevoegde instanties van de andere lidstaten bezwaar is gemaakt ingevolge
      artikel 17 van [richtlijn 2001/18](32001L0018), en geen van deze bezwaren is gehandhaafd binnen de termijn
      waarbinnen bezwaar kon worden gemaakt: binnen 30 dagen na het verstrijken van de termijn waarbinnen bezwaar kon
      worden gemaakt;

      c. indien door de Europese Commissie of de bevoegde instanties van de andere lidstaten bezwaar is gemaakt ingevolge
      artikel 17 van [richtlijn 2001/18](32001L0018) en geen van de bezwaren is gehandhaafd binnen de termijn bedoeld
      in artikel 17, zevende lid, van [richtlijn 2001/18](32001L0018): binnen 30 dagen na het verstrijken van de termijn
      bedoeld in artikel 17, zevende lid, van [richtlijn 2001/18](32001L0018);

      d. indien door de Europese Commissie of de bevoegde instanties van de andere lidstaten bezwaar is gemaakt ingevolge
      artikel 17 van [richtlijn 2001/18](32001L0018), en een of meer bezwaren zijn gehandhaafd: binnen 30 dagen nadat
      Onze Minister het besluit van de Commissie met toepassing van artikel 18 van [richtlijn 2001/18](32001L0018) heeft
      ontvangen, dan wel binnen 30 dagen nadat de bezwarenprocedure op een andere wijze is afgerond.

      2 Indien er overeenkomstig artikel 15 van [richtlijn 2001/18](32001L0018) geen met redenen omklede bezwaren
      van een lidstaat van de Europese Unie of de Europese Commissie zijn binnengekomen, verlengt Onze Minister de
      geldigheidsduur van de vergunning met tien jaar. In bijzondere gevallen kan de geldigheidsduur van de vergunning
      voor een daarbij aangegeven kortere of langere termijn worden verlengd.

      3 Indien er overeenkomstig artikel 15 van [richtlijn 2001/18](32001L0018) wel met redenen omklede bezwaren van
      een lidstaat van de Europese Unie of de Europese Commissie zijn binnengekomen, maar daarover binnen 75 dagen
      na de verspreiding van het beoordelingsrapport alsnog overeenstemming wordt bereikt, verlengt Onze Minister de
      geldigheidsduur van de vergunning met ten hoogste tien jaar.

      4 Onze Minister zendt het besluit aan de houder van de vergunning. Hij stelt de Europese Commissie en de bevoegde
      instanties van de andere lidstaten van de Europese Unie binnen 30 dagen in kennis van het besluit.

      5 Een besluit als bedoeld in het eerste lid is een besluit als bedoeld
      in[ artikel 20.3, tweede lid, onderdeel b, van de wet][ref1] en wordt bekendgemaakt in een van overheidswege
      uitgegeven blad of een dag-, nieuws- of huis-aan-huis-blad, dan wel op een andere geschikte wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel20.3
