  - number: '4.24'
    text: |-
      1 Onze Minister beslist omtrent wijziging of intrekking van een vergunning als bedoeld in [artikel 4.23][ref1]:

      a. indien door de Europese Commissie of de bevoegde instanties van de andere lidstaten geen bezwaar is gemaakt
      ingevolge artikel 20 van [richtlijn 2001/18](32001L0018): binnen 30 dagen na het verstrijken van de termijn
      waarbinnen bezwaar had kunnen worden gemaakt;

      b. indien door de Europese Commissie of de bevoegde instanties van de andere lidstaten bezwaar is gemaakt ingevolge
      artikel 20 van [richtlijn 2001/18](32001L0018), en geen van deze bezwaren is gehandhaafd binnen de termijn
      waarbinnen bezwaar kon worden gemaakt: binnen 30 dagen na het verstrijken van de termijn waarbinnen bezwaar had
      kunnen worden gemaakt;

      c. indien door de Europese Commissie of de bevoegde instanties van de andere lidstaten bezwaar is gemaakt ingevolge
      artikel 20 van [richtlijn 2001/18](32001L0018), en geen van de bezwaren is gehandhaafd binnen de termijn bedoeld in
      artikel 15, eerste lid, derde alinea, van [richtlijn 2001/18](32001L0018): binnen 30 dagen na het verstrijken van
      de termijn bedoeld in artikel 20, derde lid, derde alinea, van [richtlijn 2001/18](32001L0018);

      d. indien door de Europese Commissie of de bevoegde instanties van de andere lidstaten bezwaar is gemaakt ingevolge
      artikel 20 van [richtlijn 2001/18](32001L0018), en een of meer bezwaren zijn gehandhaafd: binnen 30 dagen nadat
      Onze Minister het besluit van de Commissie met toepassing van artikel 18 van [richtlijn 2001/18](32001L0018) heeft
      ontvangen, dan wel binnen 30 dagen nadat de bezwarenprocedure op een andere wijze is afgerond.

      2 Onze Minister stelt binnen 60 dagen na ontvangst van de nieuwe informatie overeenkomstig bijlage VI bij
      [richtlijn 2001/18](32001L0018) een beoordelingsrapport op.

      3 Onze Minister zendt het beoordelingsrapport onverwijld aan de houder van de vergunning en aan de Europese
      Commissie.

      4 Onze Minister zendt het besluit onverwijld aan de houder van de vergunning. Hij stelt de Europese Commissie en de
      andere lidstaten van de Europese Unie binnen 30 dagen in kennis van het besluit.

      5 Een besluit als bedoeld in het eerste lid is een besluit als bedoeld in
      [artikel 20.3, tweede lid, onderdeel b, van de wet][ref2] en wordt bekendgemaakt in een van overheidswege
      uitgegeven blad of een dag-, nieuws- of huis-aan-huis-blad, dan wel op een andere geschikte wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0035090#Artikel4.23
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel20.3
