        afdeling: 2.2.1
      - id: ref2
        bwb_id: BWBR0035090
        artikel: '2.2'
        hoofdstuk: '2'
  - number: '2.8'
    text: |-
      1 Indien bij de gebruiker twijfel bestaat omtrent de uitkomst van de risicobeoordeling als bedoeld in
      [artikel 2.5][ref1] en omtrent de vraag welk van meer dan één inperkingsniveau passend is voor het voorgestelde
      ingeperkt gebruik, geldt het hoogste van die inperkingsniveaus, tenzij door Onze Minister desverzocht wordt
      besloten dat een lager inperkingsniveau, in combinatie met een categorie van fysische inperking, gerechtvaardigd
      is.

      2 Indien de risicobeoordeling als bedoeld in [artikel 2.5][ref2] met betrekking tot bepaalde werkzaamheden
      overeenkomstig de daartoe door Onze Minister krachtens [artikel 2.2][ref3] gestelde regels leidt tot een hoger
      inperkingsniveau dan voor een passende bescherming noodzakelijk is, kan de gebruiker aan Onze Minister verzoeken om
      een lager inperkingsniveau, in combinatie met een categorie van fysische inperking, aan de betrokken werkzaamheden
      toe te kennen.

      3 Indien de risicobeoordeling als bedoeld in [artikel 2.5][ref4] met betrekking tot bepaalde werkzaamheden niet
      overeenkomstig de daartoe door Onze Minister krachtens [artikel 2.2][ref5] gestelde regels kan worden uitgevoerd,
      verzoekt de gebruiker aan Onze Minister om een categorie van fysische inperking en een inperkingsniveau aan de
      betrokken werkzaamheden toe te kennen.

      4

      5 Onze Minister kan bij ministeriële regeling voor de behandeling noodzakelijke gegevens aanwijzen die bij het
      verzoek overgelegd dienen te worden. Onze Minister kan tevens nadere regels stellen omtrent de over te leggen
      gegevens.

      6 Onze Minister beslist binnen 45 dagen op een verzoek als bedoeld in het eerste, tweede of derde lid. De
      beslissing is een besluit als bedoeld in [artikel 20.3, tweede lid, onderdeel b, van de wet][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0035090#Artikel2.5
