  - number: '2.28'
    text: |-
      1 Indien de gebruiker op basis van de risicobeoordeling een andere categorie van fysische inperking toekent binnen
      het toegekende inperkingsniveau I of II, stelt hij Onze Minister daarvan onmiddellijk op de hoogte.

      2 De gebruiker voert het ingeperkt gebruik vanaf dat tijdstip uit in de laatst toegekende categorie van fysische
      inperking.

      3 Het eerste lid is van overeenkomstige toepassing indien op basis van de risicobeoordeling inperkingsniveau II
      wordt toegekend in plaats van inperkingsniveau I.

      4 De gebruiker voert het ingeperkt gebruik vanaf dat tijdstip uit in de toegekende categorie van fysische inperking
      op inperkingsniveau II.
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel2.28
  - number: '2.29'
    text: |-
      1 Indien de gebruiker op basis van de risicobeoordeling inperkingsniveau III of IV toekent in plaats van
      inperkingsniveau I of II:

      a. stelt de gebruiker Onze Minister daarvan onmiddellijk op de hoogte, en

      b. voert de gebruiker het ingeperkt gebruik voortaan uit overeenkomstig de daarvoor geldende regels en
      voorschriften in de toegekende categorie van fysische inperking op onderscheidenlijk inperkingsniveau III of IV.

      2 Indien de gebruiker binnen 14 dagen, gerekend vanaf de datum van het verslag van de risicobeoordeling, een
      aanvraag om een vergunning als bedoeld in [artikel 2.35][ref1] indient, blijft het eerste lid, onder b, van
      toepassing totdat op de aanvraag is beslist, en mag de gebruiker het ingeperkt gebruik voortzetten.

      3 De gebruiker staakt onmiddellijk het ingeperkt gebruik:

      a. indien hij niet kan voldoen aan het eerste lid, onder b, of

      b. indien hij niet binnen de termijn, bedoeld in het tweede lid, een aanvraag om een vergunning als bedoeld in
      [artikel 2.35][ref2] heeft ingediend.

      4 Indien toepassing is gegeven aan het derde lid, worden de voorhanden zijnde genetisch gemodificeerde organismen
      vernietigd, dan wel opgeslagen overeenkomstig de bij ministeriële regeling voor de opslag van deze organismen
      gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0035090#Artikel2.35
      [ref2]: https://wetten.overheid.nl/BWBR0035090#Artikel2.35
