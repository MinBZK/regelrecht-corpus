  - number: 2.13a
    text: |-
      1 De gebruiker kan Onze Minister verzoeken vast te stellen dat een micro-organisme, een plant of een
      genetisch gemodificeerd organisme in aanmerking komt voor opname op een lijst die is vastgesteld op grond van
      [artikel 2.2][ref1].

      2 Een micro-organisme, een plant of een genetisch gemodificeerd organisme ten aanzien waarvan Onze Minister een
      vaststelling heeft gedaan als bedoeld in het eerste lid, wordt ten aanzien van de verzoeker aangemerkt als een
      micro-organisme, een plant of een genetisch gemodificeerd organisme welke is opgenomen op de desbetreffende lijst
      die is vastgesteld op grond van [artikel 2.2][ref2].

      3 [Artikel 2.13, vijfde en zesde lid][ref3], is van overeenkomstige toepassing.


