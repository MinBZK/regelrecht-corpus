        afdeling: '4.2'
  - number: '4.23'
    text: |-
      1 Onze Minister kan ambtshalve of op verzoek een vergunning wijzigen of intrekken op grond van nieuwe informatie
      die van invloed kan zijn op de risico’s van de betrokken genetisch gemodificeerde organismen voor de gezondheid van
      de mens of het milieu.

      2 Op de aanvraag om wijziging van een vergunning is [afdeling 4.2][ref1] van overeenkomstige toepassing, met dien
      verstande dat de gegevens, aangewezen bij of krachtens [artikel 4.8, tweede en derde lid][ref2], slechts behoeven
      te worden overgelegd voor zover deze gegevens van betekenis zijn voor de wijziging.


      [ref1]: https://wetten.overheid.nl/BWBR0035090#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0035090#Artikel4.8
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel4.23
