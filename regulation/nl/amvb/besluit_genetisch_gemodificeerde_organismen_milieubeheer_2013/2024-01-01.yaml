  - number: '2.26'
    text: |-
      1 Onverminderd [artikel 2.18][ref1] verstrekt de gebruiker aan Onze Minister op diens verzoek binnen de daartoe
      door Onze Minister gestelde termijn een volledige beschrijving van het ingeperkt gebruik op het door Onze Minister
      aangegeven inperkingsniveau.

      2 De gebruiker kan Onze Minister bij een kennisgeving als bedoeld in [artikel 2.23, eerste lid, onder b][ref2],
      verzoeken om een beschikking inzake toestemming voor het gewijzigde ingeperkt gebruik op inperkingsniveau
      II. Hij kan ook verzoeken om een beschikking inzake toestemming voor het volledige ingeperkt gebruik op
      inperkingsniveau II. Onze Minister geeft aan het verzoek gevolg. De beschikking is een besluit als bedoeld in
      [artikel 20.3, tweede lid, onderdeel b, van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0035090#Artikel2.18
      [ref2]: https://wetten.overheid.nl/BWBR0035090#Artikel2.23
