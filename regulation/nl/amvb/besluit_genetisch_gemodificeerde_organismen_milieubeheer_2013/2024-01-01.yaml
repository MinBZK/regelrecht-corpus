  - number: '2.54'
    text: |-
      1 Indien Onze Minister de beschikking krijgt over gegevens waaruit blijkt dat mogelijk een ander inperkingsniveau
      of een andere categorie van fysische inperking moet worden toegekend, kan hij de gebruiker bevelen het ingeperkt
      gebruik te schorsen of te beëindigen of de omstandigheden ervan te wijzigen.

      2 De gebruiker voldoet onmiddellijk aan het bevel.

      3 Indien een bevel is gegeven om het ingeperkt gebruik te schorsen of te beëindigen, worden de voorhanden zijnde
      genetisch gemodificeerde organismen vernietigd, dan wel opgeslagen overeenkomstig de bij ministeriële regeling voor
      de opslag van deze organismen gestelde regels.
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel2.54
  - number: '2.56'
    text: |-
      Onze Minister is het bevoegd gezag dat beslist op aanvragen om toestemming tot het treffen van een gelijkwaardige
      maatregel als bedoeld in [artikel 4.7 van de Omgevingswet][ref1], in plaats van een maatregel die op grond van het
      bepaalde bij of krachtens dit besluit moet worden getroffen.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel4.7
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel2.56
    references:
      - id: ref1
        bwb_id: BWBR0037885
        artikel: '4.7'
  - number: '2.57'
    text: |-
      1 Onze Minister kan een maatwerkvoorschrift als bedoeld in [artikel 4.5 van de Omgevingswet][ref1] stellen met
      betrekking tot:

      a. specifieke handelingen met genetisch gemodificeerde organismen;

      b. de maatregelen die het betreft;

      c. de werkruimten waarop de maatregelen, bedoeld onder b, betrekking hebben;

      d. de duur van het ingeperkt gebruik.

      2 Met een maatwerkvoorschrift kan worden afgeweken van de krachtens [artikel 2.2][ref2] gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel4.5
      [ref2]: https://wetten.overheid.nl/BWBR0035090#Artikel2.2
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel2.57
    references:
