  - number: '3.11'
    text: |-
      1 De vergunning wordt verleend voor onbepaalde tijd dan wel voor een bij de vergunning aangegeven periode.

      2 Indien het belang van de gezondheid van de mens en van het milieu zich daartegen niet verzet, kan Onze Minister
      bij de vergunning afwijken van de regels die zijn gesteld krachtens [artikel 3.4][ref1].

      3 De geldigheidsduur van de vergunning kan worden gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0035090#Artikel3.4
