  - number: '2.48'
    text: |-
      1 De gebruiker voert onmiddellijk een risicobeoordeling als bedoeld in [artikel 2.5][ref1] uit indien:

      a. een onbedoelde wijziging van de gegevens of de omstandigheden van het ingeperkt gebruik optreedt, die ertoe
      leidt of kan leiden dat het ingeperkt gebruik moet worden verricht op een ander inperkingsniveau of een andere
      categorie van fysische inperking, of

      b. de gebruiker de beschikking krijgt over nieuwe ter zake doende gegevens, waaruit blijkt dat mogelijk een ander
      inperkingsniveau of een andere categorie van fysische inperking moet worden toegekend.

      2 De [artikelen 2.6 tot en met 2.9][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0035090#Artikel2.5
      [ref2]: https://wetten.overheid.nl/BWBR0035090#Artikel2.6
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel2.48
    references:
      - id: ref1
        bwb_id: BWBR0035090
        artikel: '2.5'
        hoofdstuk: '2'
        afdeling: 2.2.1
      - id: ref2
        bwb_id: BWBR0035090
        artikel: '2.6'
        hoofdstuk: '2'
        afdeling: 2.2.1
  - number: '2.49'
    text: |-
      1 Indien op basis van de risicobeoordeling een andere categorie van fysische inperking wordt toegekend binnen het
      toegekende inperkingsniveau III of IV:

      a. stelt de gebruiker Onze Minister onmiddellijk op de hoogte, en

      b. voert de gebruiker het ingeperkt gebruik vanaf dat tijdstip uit overeenkomstig de daarvoor geldende regels en
      voorschriften in de laatst toegekende categorie van fysische inperking.

      2 Indien op basis van de risicobeoordeling inperkingsniveau IV wordt toegekend in plaats van inperkingsniveau III:

      a. stelt de gebruiker Onze Minister onmiddellijk op de hoogte, en

      b. voert de gebruiker het ingeperkt gebruik vanaf dat tijdstip uit in de toegekende categorie van fysische
      inperking op onderscheidenlijk inperkingsniveau III of IV.

      3 Indien de gebruiker binnen 14 dagen, gerekend vanaf de datum van het verslag van de risicobeoordeling, een
      aanvraag om wijziging van de vergunning indient, blijft het eerste lid, onder b, onderscheidenlijk het tweede lid,
      onder b, van toepassing totdat op de aanvraag is beslist, en mag de gebruiker het ingeperkt gebruik voortzetten.

      4 De gebruiker staakt onmiddellijk het ingeperkt gebruik:

      a. indien hij niet kan voldoen aan het eerste lid, onder b, onderscheidenlijk het tweede lid, onder b, of

      b. indien hij niet binnen de termijn, bedoeld in het derde lid, een aanvraag om wijziging van de vergunning heeft
      ingediend.

      5 Indien toepassing is gegeven aan het vierde lid worden de voorhanden zijnde genetisch gemodificeerde organismen
      vernietigd, dan wel opgeslagen overeenkomstig de bij ministeriële regeling voor de opslag van deze organismen
      gestelde regels.
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel2.49
  - number: '2.50'
    text: |-
      Indien op basis van de risicobeoordeling inperkingsniveau III wordt toegekend in plaats van inperkingsniveau IV,
      blijft de vergunning van toepassing totdat deze is gewijzigd.
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel2.50
  - number: '2.51'
    text: |-
      1 In het geval, bedoeld in [artikel 2.49, eerste en tweede lid][ref1], kan Onze Minister de gebruiker bevelen het
      ingeperkt gebruik te schorsen of te beëindigen of de omstandigheden ervan te wijzigen.

      2 De gebruiker voldoet onmiddellijk aan het bevel.

      3 Indien een bevel is gegeven om het ingeperkt gebruik te schorsen of te beëindigen, worden de voorhanden zijnde
      genetisch gemodificeerde organismen vernietigd, dan wel opgeslagen overeenkomstig de bij ministeriële regeling voor
      de opslag van deze organismen gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0035090#Artikel2.49
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel2.51
    references:
