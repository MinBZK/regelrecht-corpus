        afdeling: 2.2.1
  - number: '2.11'
    text: |-
      1 Bij ministeriële regeling kan Onze Minister op basis van een door hem uitgevoerde risicobeoordeling een lijst
      vaststellen van:

      a. gastheren die bij gebruik onder laboratoriumcondities geschikt zijn voor de vervaardiging van genetisch
      gemodificeerde organismen van inperkingsniveau II en in categorie van fysische inperking ML-II zoals opgenomen
      in [bijlage 4][ref1],

      b. vectoren die bij gebruik onder laboratoriumcondities geschikt zijn voor de vervaardiging van genetisch
      gemodificeerde organismen van inperkingsniveau II en in categorie van fysische inperking ML-II zoals opgenomen in
      [bijlage 4][ref2], en

      c. inserties die bij gebruik onder laboratoriumcondities niet geschikt zijn voor de vervaardiging van genetisch
      gemodificeerde organismen van inperkingsniveau II en in categorie van fysische inperking ML-II zoals opgenomen
      in [bijlage 4][ref3].

      2 De gebruiker die voornemens is onder laboratoriumcondities een genetisch gemodificeerd organisme te vervaardigen:

      a. dat is samengesteld uit een gastheer en een of meer vectoren, die zijn opgenomen op een lijst als bedoeld in het
      eerste lid, en

      b. waarvan de insertie of inserties, voor zover deze niet behoort of behoren tot een vector, niet is of zijn
      vermeld op een lijst als bedoeld in het eerste lid,

      behoeft met betrekking tot dat ingeperkt gebruik, in afwijking van [artikel 2.5][ref4], geen risicobeoordeling uit
      te voeren.

      3 De gebruiker die voornemens is onder laboratoriumcondities handelingen te verrichten met een genetisch
      gemodificeerd organisme als bedoeld in het tweede lid, behoeft met betrekking tot dat ingeperkt gebruik evenmin een
      risicobeoordeling uit te voeren.

      4 Het ingeperkt gebruik als bedoeld in het tweede en derde lid geschiedt op inperkingsniveau II in de categorie van
      fysische inperking ML-II zoals opgenomen in [bijlage 4][ref5].


