  - number: '2.38'
    text: |-
      1 In aanvulling op [artikel 4:5 van de Algemene wet bestuursrecht][ref1] verstrekt de gebruiker desverzocht aan
      Onze Minister binnen de daartoe door Onze Minister gestelde termijn de nadere informatie waarom Onze Minister naar
      aanleiding van de aanvraag heeft verzocht.

      2 Indien Onze Minister een verzoek als bedoeld in het eerste lid heeft gedaan, wordt de termijn, bedoeld in
      [artikel 2.37, eerste lid][ref2], opgeschort totdat Onze Minister de nadere gegevens heeft ontvangen. Indien in
      combinatie met de aanvraag een verzoek op grond van [artikel 2.8, eerste of tweede lid][ref3], is gedaan, wordt
      de termijn, bedoeld in artikel 2.8, zesde lid, mede opgeschort totdat Onze Minister de nadere gegevens heeft
      ontvangen.

      3 Indien de gevraagde nadere informatie niet binnen de gestelde termijn is ontvangen, kan Onze Minister
      besluiten de aanvraag niet of niet verder te behandelen. Onze Minister kan tevens besluiten het verzoek op grond
      van [artikel 2.8][ref4] dat in combinatie met de aanvraag om de vergunning is gedaan, niet of niet verder te
      behandelen.

      4 Onze Minister stelt de aanvrager onverwijld op de hoogte van een besluit als bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0035090#Artikel2.37
      [ref3]: https://wetten.overheid.nl/BWBR0035090#Artikel2.8
      [ref4]: https://wetten.overheid.nl/BWBR0035090#Artikel2.8
