  - number: '2.15'
    text: |-
      1 Voorafgaand aan ingeperkt gebruik op inperkingsniveau I of II geeft de gebruiker aan Onze Minister kennis van
      zijn voornemen om ingeperkt gebruik te verrichten.

      2

      3 De kennisgeving bevat de gegevens, genoemd in [bijlage 5][ref1].

      4 Onze Minister kan bij ministeriële regeling andere voor de behandeling noodzakelijke gegevens aanwijzen die bij
      de kennisgeving overgelegd dienen te worden. Onze Minister kan tevens nadere regels stellen omtrent de over te
      leggen gegevens.

      5 Onze Minister tekent de datum van ontvangst aan op de kennisgeving en zendt aan de gebruiker onverwijld een
      bewijs van ontvangst waarin die datum is vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0035090
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel2.15
    references:
      - id: ref1
        bwb_id: BWBR0035090
  - number: '2.16'
    text: |-
      Met het ingeperkt gebruik op inperkingsniveau I mag worden begonnen op het eerste van de volgende twee tijdstippen:

      a. het tijdstip waarop het bewijs van ontvangst, bedoeld in [artikel 2.15, vijfde lid][ref1], de gebruiker heeft
      bereikt;

      b. de tweede dag na de dag van aangetekende verzending van de kennisgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0035090#Artikel2.15
    url: https://wetten.overheid.nl/BWBR0035090/2024-01-01#Artikel2.16
