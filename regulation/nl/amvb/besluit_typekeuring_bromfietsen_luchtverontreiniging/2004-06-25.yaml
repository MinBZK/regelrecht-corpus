preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, Centrale Directie
    Juridische Zaken, Afdeling Wetgeving van 8 mei 1984, nr. MJZ 0854023, gedaan in overeenstemming met onze Ministers
    van Verkeer en Waterstaat en van Economische Zaken;

    Overwegende dat het wenselijk is om naast de regelen die zijn gesteld ter voorkoming of beperking van
    luchtverontreiniging door motorrijtuigen op ten minste vier wielen, ter uitvoering van Reglement 47, behorende bij
    de Overeenkomst van 20 maart 1958 betreffende het aannemen van eenvormige goedkeuringvoorwaarden en de wederzijdse
    erkenning van goedkeuring van uitrustingsstukken en onderdelen van motorrijtuigen (Trb. 1959, 83) thans met
    hetzelfde oogmerk regelen te stellen inzake de typekeuring van bromfietsen;

    Gelet op de artikelen 13, 15, 17 en 88, eerste, derde en vierde lid, van de Wet inzake de luchtverontreiniging
    (Stb. 1981, 411);

    Gehoord de Centrale raad voor de milieuhygiëne, advies van 17 oktober 1983, nr. 737;

    De Raad van State gehoord, advies van 18 juli 1984, nr. W08.84.0257/19.4.28;

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 22
    oktober 1984, nr. MJZ 2204051, uitgebracht in overeenstemming met Onze Ministers van Verkeer en Waterstaat en van
    Economische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003722/2004-06-25#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Voor de toepassing van het bij of krachtens dit besluit bepaalde wordt verstaan onder:

      bromfiets: bromfiets als bedoeld in [artikel 1.1, onder ][ref1];

      Onze Ministers: Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer en Onze Minister van
      Verkeer en Waterstaat tezamen.

      2 Voor de toepassing van het bij of krachtens dit besluit bepaalde worden bromfietsen geacht tot éénzelfde type
      te behoren indien zij - afgezien van veranderingen, opgetreden door normaal gebruik - onderling geen wezenlijke
      verschillen vertonen wat betreft de eigenschappen of onderdelen die bepalend zijn voor door bromfietsen
      veroorzaakte luchtverontreiniging.


      [ref1]: https://wetten.overheid.nl/BWBR0006746#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0003722/2004-06-25#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006746
        artikel: '1.1'
  - number: '2'
    text: |-
      1 Het is verboden bromfietsen in te voeren of bedrijfsmatig te vervaardigen, die niet behoren tot een type dat:

      a. hetzij is goedgekeurd bij een keuring, door de Dienst Wegverkeer of een andere door Onze Minister van Verkeer
      en Waterstaat aangewezen instantie verricht aan de hand van de bij of krachtens [hoofdstuk III][ref1] vastgestelde
      voorschriften;

      b. hetzij blijkens een typegoedkeuringsverklaring als bedoeld in artikel 4, vierde lid, van [richtlijn nr.
      2002/24/EG](32002L0024) van het Europees Parlement en de Raad van de Europese Unie van 18 maart 2002 (PbEG L 124)
      betreffende de goedkeuring van twee- of driewielige motorvoertuigen en de intrekking van [richtlijn nr. 92/61/EEG]
      (31992L0061) van de Raad voldoet aan de voorschriften van hoofdstuk 5 van de [richtlijn nr. 97/24/EG](31997L0024)
      van het Europees Parlement en de Raad van de Europese Unie van 17 juni 1997 betreffende bepaalde onderdelen of
      eigenschappen van motorvoertuigen op twee of drie wielen (PbEG L 226).

      2 Het is verboden een bromfiets die niet of niet langer behoort tot een goedgekeurd type, ten verkoop in voorraad
      te hebben, ten verkoop aan te bieden, te verkopen, af te leveren of te vervoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0003722#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0003722/2004-06-25#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003722
        hoofdstuk: III
  - number: '3'
    text: |-
      1 [Artikel 2][ref1] geldt niet, indien de handelingen geschieden met het oog op het buiten Nederland in de handel
      brengen van de bromfiets.

      2 [Artikel 2][ref2] geldt niet ten aanzien van bromfietsen:

      a. die zich in het kader van bedrijfsmatige vervaardiging nog bevinden in het stadium van beproeving of onderzoek;

      b. die dienen als monster bij een ingevolge dit besluit te verrichten keuring;

      c. waarvoor door of vanwege Onze Minister ontheffing is verleend. Aan een ontheffing kunnen voorschriften worden
      verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0003722#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003722#Artikel2
    url: https://wetten.overheid.nl/BWBR0003722/2004-06-25#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003722
        artikel: '2'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003722
        artikel: '2'
        hoofdstuk: II
  - number: '4'
    text: |-
      1 Onze Ministers stellen de voorschriften vast, aan de hand waarvan de in [artikel 2, eerste lid][ref1],
      bedoelde keuringen worden verricht. De voorschriften met betrekking tot de meetapparatuur worden vastgesteld in
      overeenstemming met Onze Minister van Economische Zaken.

      2 [Artikel 22, eerste en derde lid, van de Wegenverkeerswet 1994][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003722#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel22
    url: https://wetten.overheid.nl/BWBR0003722/2004-06-25#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003722
        artikel: '2'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '22'
  - number: '9'
    text: |-
      In geval van wijziging in de keuringsvoorschriften, bedoeld in [artikel 4][ref1], die ten grondslag hebben
      gelegen aan een goedkeuring als bedoeld in [artikel 2, eerste lid][ref2], kunnen Onze Ministers in hun besluit tot
      wijziging van die voorschriften bepalen dat bij het verstrijken van een daarbij te stellen termijn die goedkeuring
      ophoudt te gelden. Deze termijn dient voor de toepassing van de onderscheidene in [artikel 2][ref3] genoemde
      handelingen verschillend te zijn, zulks in een met het onderscheid, te dien aanzien gemaakt in [artikel 10][ref4],
      overeenkomstige zin.


      [ref1]: https://wetten.overheid.nl/BWBR0003722#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003722#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003722#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0003722#Artikel10
