  - number: '10'
    text: |-
      Met betrekking tot bromfietsen die voor het tijdstip van inwerkingtreding van dit besluit vervaardigd en hier te
      lande aanwezig zijn, is [artikel 2, eerste lid][ref1], voor zover het anders dan bedrijfsmatig invoeren betreft, en
      tweede lid, pas met ingang van 1 januari 1995 van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003722#Artikel2
    url: https://wetten.overheid.nl/BWBR0003722/2004-06-25#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003722
        artikel: '2'
        hoofdstuk: II
  - number: 10a
    text: |-
      Het in [artikel 2, eerste lid, onder b][ref1], gestelde verbod is tot 17 juni 1999 niet van toepassing op
      bromfietsen die behoren tot een type dat is goedgekeurd blijkens een certificaat als bedoeld in bijlage 2
      van Reglement 47 behorende bij de Overeenkomst van 20 maart 1958 betreffende het aannemen van eenvormige
      goedkeuringsvoorwaarden en de wederzijdse erkenning van goedkeuring van uitrustingsstukken en onderdelen van
      motorrijtuigen (Trb.1959, 83).


      [ref1]: https://wetten.overheid.nl/BWBR0003722#Artikel2
    url: https://wetten.overheid.nl/BWBR0003722/2004-06-25#Artikel10a
