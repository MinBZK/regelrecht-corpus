  - number: '5'
    text: |-
      1 De persoon die een veiligheidsfunctie uitoefent is ten minste 18 jaar oud.

      2 De persoon die een veiligheidsfunctie uitoefent beheerst de Nederlandse taal of een door de beheerder
      voorgeschreven taal zodanig dat hij de voor de uitoefening van de betrokken functie gebruikelijke
      procescommunicatie kan voeren en begrijpen.

      3 In afwijking van het tweede lid kunnen bij regeling van Onze Minister baanvakken voor grensoverschrijdende
      treindiensten worden aangewezen waar, op aanvraag van een spoorwegonderneming en met inachtneming van de in punt 8,
      derde lid, van bijlage VI bij [richtlijn 2007/59/EG](32007L0059) genoemde procedure, machinisten door de beheerder
      kunnen worden vrijgesteld van de taaleis, bedoeld in punt 8, eerste en tweede lid, van die bijlage.
    url: https://wetten.overheid.nl/BWBR0030006/2021-12-17#Artikel5
  - number: '6'
    text: |-
      1 Onze Minister stelt ten behoeve van een beoordeling als bedoeld in
      [artikel 50, tweede lid, onder a, van de wet][ref1], een examenprogramma vast dat voldoet aan de in bijlage IV van
      [richtlijn 2007/59/EG](32007L0059) gestelde eisen inzake algemene kennis en vaardigheden.

      2 Degene onder wiens gezag de veiligheidsfunctie van machinist met volledige bevoegdheid of van
      machinist met beperkte bevoegdheid wordt uitgeoefend, stelt ten behoeve van de beoordeling, bedoeld in
      [artikel 51a, vierde lid, onder b, van de wet][ref2], een examenprogramma vast dat voldoet aan de in bijlage V
      en VI van [richtlijn 2007/59/EG](32007L0059) gestelde eisen inzake specifieke vakkennis inzake spoorvoertuigen
      en hoofdspoorweginfrastructuur.

      3 Onze Minister stelt voor de veiligheidsfunctie van rangeerder, wagencontroleur, treindienstleider met volledige
      bevoegdheid en treindienstleider met minimale bevoegdheid een examenprogramma vast dat voldoet aan de geldende
      paragrafen en aanhangsels van de TSI Exploitatie en verkeersleiding inzake algemene kennis, bekwaamheid en
      ervaring.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel51a
