  - number: '9'
    text: |-
      1 Bij regeling van Onze Minister worden met inachtneming van bijlage II van [richtlijn 2007/59/EG](32007L0059) de
      eisen vastgesteld inzake medische en psychologische geschiktheid voor de machinist met volledige bevoegdheid en de
      machinist met beperkte bevoegdheid.

      2 Bij regeling van Onze Minister worden met inachtneming van de geldende paragrafen en aanhangsels van de TSI
      Exploitatie en verkeersleiding de eisen vastgesteld inzake medische en psychologische geschiktheid voor de
      rangeerder, de treindienstleider met volledige bevoegdheid en de treindienstleider met minimale bevoegdheid.

      3 Het vereiste om te beschikken over een geldige verklaring van medische geschiktheid en een geldige verklaring
      van psychologische geschiktheid als bedoeld in [artikel 50, eerste lid, onderdeel a, van de wet][ref1], geldt niet
      voor:

      a. een persoon die de veiligheidsfunctie van wagencontroleur uitoefent;

      b. een persoon die de veiligheidsfunctie van rangeerder uitoefent, in dienst van een in het buitenland gevestigde
      spoorwegonderneming, die zijn standplaats heeft in het buitenland, mits hij voldoet aan de in het land van zijn
      standplaats voor de uitoefening van zijn functie in overeenstemming met de geldende paragrafen en aanhangsels van
      de TSI Exploitatie en verkeersleiding geldende medische en psychologische eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel50
    url: https://wetten.overheid.nl/BWBR0030006/2021-12-17#Artikel9
    references:
      - id: ref1
