  - number: '19'
    text: |-
      1 Onze Minister erkent op aanvraag een keuringsinstituut voor de afgifte van een verklaring
      van medische geschiktheid respectievelijk psychologische geschiktheid als bedoeld in
      [artikel 50, eerste en tweede lid, van de wet][ref1], indien het beschikt over de voor de keuring van personeel met
      een veiligheidsfunctie vereiste onafhankelijke organisatie en expertise.

      2 Onze Minister kan aan een erkenning als bedoeld in het eerste lid voorschriften en beperkingen verbinden.

      3 Onze Minister kan een erkenning schorsen of intrekken indien het keuringsinstituut niet meer voldoet aan de voor
      de erkenning gestelde eisen.

      4 Bij regeling van Onze Minister kunnen nadere eisen worden gesteld met betrekking tot de onafhankelijke
      organisatie en expertise van een keuringsinstituut.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel50
