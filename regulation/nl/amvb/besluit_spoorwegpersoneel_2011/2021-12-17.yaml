  - number: '21'
    text: |-
      1 Verklaringen van medische geschiktheid, verklaringen van psychologische geschiktheid en certificaten van
      bekwaamheid die op basis van het [Besluit spoorwegpersoneel][ref1] aan een machinist met volledige bevoegdheid of
      een machinist met beperkte bevoegdheid zijn afgegeven, blijven geldig voor de duur dat deze zijn afgegeven.

      2 Certificaten van bekwaamheid die op basis van het [Besluit spoorwegpersoneel][ref2] aan een rangeerder met
      volledige bevoegdheid, wagencontroleur, treindienstleider met volledige bevoegdheid of treindienstleider met
      minimale bevoegdheid zijn afgegeven, worden gelijkgesteld met beoordelingen van Onze Minister waaruit blijkt dat
      de rangeerder, wagencontroleur, treindienstleider met volledige bevoegdheid of treindienstleider met minimale
      bevoegdheid voldoet aan de krachtens [artikel 49, eerste lid, van de wet][ref3], vastgestelde eisen inzake algemene
      kennis, bekwaamheid en ervaring.

      3 Verklaringen van medische geschiktheid en verklaringen van psychologische geschiktheid die op basis van het
      [Besluit spoorwegpersoneel][ref4] aan een rangeerder met volledige bevoegdheid, treindienstleider met volledige
      bevoegdheid of treindienstleider met minimale bevoegdheid zijn afgegeven:

      a. worden gelijkgesteld met verklaringen van medische geschiktheid en verklaringen van psychologische geschiktheid
      afgegeven aan een rangeerder, treindienstleider met volledige bevoegdheid of treindienstleider met minimale
      bevoegdheid op basis van dit besluit;

      b. blijven geldig voor de duur waarvoor deze zijn afgegeven.

      4 Een bedrijfspas die op basis van het [Besluit spoorwegpersoneel][ref5] aan een rangeerder met volledige
      bevoegdheid of een wagencontroleur is afgegeven, wordt gelijkgesteld met een bedrijfspas afgegeven aan een
      rangeerder of wagencontroleur op basis van dit besluit.


