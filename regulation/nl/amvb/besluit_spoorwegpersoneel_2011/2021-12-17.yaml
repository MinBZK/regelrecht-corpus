  - number: 7a
    text: |-
      1 Onze Minister erkent een persoon als examinator indien deze persoon:

      a. in het bezit is van een beoordeling waaruit blijkt dat de kandidaat voldoet aan het bepaalde in hoofdstuk 3 van
      het Besluit 2011/765/EU; of

      b. in het bezit is van een erkenning van beroepskwalificaties als bedoeld in
      [artikel 5 van de Algemene wet erkenning EU-beroepskwalificaties][ref1].

      2 Bij de aanvraag, verlening, schorsing of intrekking van een erkenning, alsmede de registratie van examinatoren,
      wordt gehandeld overeenkomstig de aanbevelingen 26 tot en met 39 en 41 tot en met 48 van Aanbeveling 2011/766/EU.

      3 Bij regeling van Onze Minister kunnen aanvullende eisen worden gesteld als bedoeld in artikel 8, vierde lid, van
      Besluit 2011/765/EU.

      4 Onze Minister houdt een register van examinatoren bij. Gegevens van examinatoren als bedoeld in aanwijzing 38 van
      Aanbeveling 2011/766/EU worden op verzoek verstrekt aan personen die hier redelijkerwijs belang bij hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel5
