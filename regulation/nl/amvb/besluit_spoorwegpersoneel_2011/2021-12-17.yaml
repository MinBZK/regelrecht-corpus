      2 Het register van bevoegdheidsbewijzen, bedoeld in [artikel 51a, vijfde lid, van de wet][ref2], voldoet aan het
      daaromtrent bepaalde in de beschikking van de Commissie van de Europese Gemeenschappen van 29 oktober 2009 tot
      vaststelling van de basisparameters voor registers van machinistenvergunningen en aanvullende bevoegdheidsbewijzen
      als bedoeld in [Richtlijn 2007/59/EG](32007L0059) van het Europees Parlement en de Raad (2010/17/EG; PbEU L 8/17).


