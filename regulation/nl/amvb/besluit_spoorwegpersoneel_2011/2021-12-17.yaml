    text: |-
      1 Onze Minster erkent op aanvraag een opleidingsinstituut als bedoeld in
      [artikel 51b, eerste lid, van de wet][ref1], overeenkomstig het bepaalde in de hoofdstukken 1 en 2 van het Besluit
      2011/765/EU en de artikelen 2 tot en met 25 van de Aanbeveling 2011/766/EU. Van de erkenningen wordt door Onze
      Minister een register bijgehouden.

      2 Onze Minister kan aan een erkenning als bedoeld in het eerste lid voorschriften en beperkingen verbinden.

      3 Onze Minister kan een erkenning schorsen of intrekken indien het opleidingsinstituut niet meer voldoet aan de
      voor de erkenning gestelde eisen.


