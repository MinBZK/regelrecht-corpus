preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Infrastructuur en Milieu van 8 december 2010, nr. VENW/BSK-2010/181313,
    Hoofddirectie Juridische Zaken;

    Gelet op richtlijn nr. 2007/59/EG van het Europees Parlement en de Raad van de Europese Unie van 23 oktober 2007
    inzake de certificering van machinisten die locomotieven en treinen op het spoorwegsysteem van de gemeenschap
    besturen (PbEU L 315) en de artikelen 1, onderdeel j, 36, tweede lid, 49, 50, 51, 51a, achtste lid, 51b, derde lid
    en 52 van de Spoorwegwet;

    De Afdeling advisering van de Raad van State gehoord (advies van 14 januari 2011, nr. W14.10.0554/IV);

    Gezien het nader rapport van Onze Minister van Infrastructuur en Milieu van 27 april 2011, nr. IENM/BSK-2011/51548,
    Hoofddirectie Bestuurlijke en Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0030006/2021-12-17#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

        - *Aanbeveling 2011/766/EU:* Aanbeveling 2011/766/EU van de Commissie van 22 november 2011 betreffende de procedure
      voor de erkenning van opleidingscentra en examinatoren voor treinbestuurders overeenkomstig Richtlijn 2007/59/EG
      van het Europees Parlement en de Raad (PbEU 2011, L 314/41);
        - *Besluit 2011/765/EU:* Besluit 2011/765/EU van de Commissie van 22 november 2011 inzake criteria voor de
      erkenning van examinatoren van treinbestuurders en inzake criteria voor de organisatie van examens overeenkomstig
      Richtlijn 2007/59/EG van het Europees Parlement en de Raad (PbEU 2011, L 314/36);
        - *categorie A:* rangeerlocomotieven, werktreinen, onderhoudsspoorwagens en alle andere locomotieven die gebruikt
      worden voor het rangeren;
        - *categorie B:* vervoer van reizigers, vervoer van goederen;
        - *locomotief:* spoorvoertuig met eigen voortbewegingsinrichting, hoofdzakelijk bestemd en ingericht om andere
      spoorvoertuigen voort te bewegen;
        - *treinstel:* treinstel als bedoeld in [artikel 1 van het Besluit spoorverkeer][ref1];
        - *TSI Exploitatie en verkeersleiding:* Uitvoerings[verordening (EU) 2019/773](32673R2019) van de Commissie van
      16 mei 2019 betreffende de technische specificaties inzake interoperabiliteit van het subsysteem exploitatie en
      verkeersleiding van het spoorwegsysteem in de Europese Unie en tot intrekking van Besluit 2012/757/EU (PbEU 2019,
      L 139I);
        - *wet:* [Spoorwegwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017624#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0015007
    url: https://wetten.overheid.nl/BWBR0030006/2021-12-17#Artikel1
