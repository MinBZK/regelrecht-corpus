  - number: '7'
    text: |-
      1 Onze Minister geeft een beoordeling als bedoeld in
      [artikel 50, eerste lid, onder a, en tweede lid, onder a, van de wet][ref1], aan degene die bij een
      door Onze Minister afgenomen onderzoek voldoet aan de voor de betrokken veiligheidsfunctie krachtens
      [artikel 6, eerste en derde lid][ref2], in het examenprogramma vastgestelde eisen.

      2 Degene onder wiens gezag de veiligheidsfunctie van machinist met volledige bevoegdheid of
      van machinist met beperkte bevoegdheid wordt uitgeoefend geeft een beoordeling als bedoeld in
      [artikel 51a, vierde lid, onder b, van de wet][ref3], aan degene die bij een door hem afgenomen onderzoek voldoet
      aan de voor de betrokken veiligheidsfunctie krachtens [artikel 6, tweede lid][ref4], in het examenprogramma
      vastgestelde eisen.

      3 Een persoon wordt ten aanzien van de veiligheidsfunctie van machinist met volledige bevoegdheid of machinist met
      beperkte bevoegdheid toegelaten tot de onderzoeken, bedoeld in het eerste en tweede lid, indien hij een opleiding
      voor de betrokken veiligheidsfunctie heeft gevolgd bij een krachtens [artikel 51b, eerste lid, van de wet][ref5],
      door Onze Minister erkend opleidingsinstituut.

      4 Het onderzoek ten behoeve van een beoordeling, bedoeld in [artikel 50, tweede lid, onder a, van de wet][ref6],
      omvat een theoriegedeelte en een gedeelte waarbij gebruik wordt gemaakt van een simulator.

      5 Het onderzoek ten behoeve van een beoordeling, bedoeld in [artikel 50, eerste lid, onder a][ref7], en
      [artikel 51a, vierde lid, onder b, van de wet][ref8], omvat een theoriegedeelte en een praktijkgedeelte en kan
      tevens onderzoeken omvatten waarbij gebruik wordt gemaakt van een simulator.

      6 Bij de beoordelingen, bedoeld in het eerste en tweede lid, wordt gebruik gemaakt van door Onze Minister erkende
      examinatoren.

      7 De beoordelingen bevatten ten minste de volgende gegevens:

      a. datum van het onderzoek;

      b. naam en geboortedatum van de onderzochte persoon;

      c. de veiligheidsfunctie waarop de beoordeling betrekking heeft, en

      d. de examenuitslag, uitgedrukt in voldoende dan wel onvoldoende.

      8 De beoordelingen zijn voor onbepaalde tijd geldig.


