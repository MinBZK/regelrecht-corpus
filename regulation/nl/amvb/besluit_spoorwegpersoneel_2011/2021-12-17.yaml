  - number: '11'
    text: |-
      1 De verklaring van medische geschiktheid, afgegeven aan een machinist met volledige bevoegdheid of machinist met
      beperkte bevoegdheid, die de leeftijd van:

      a. 55 jaar nog niet heeft bereikt, is geldig voor de duur van drie jaar, gerekend vanaf de datum van afgifte;

      b. 55 jaar heeft bereikt, is geldig voor de duur van een jaar, gerekend vanaf de datum van afgifte.

      2 De verklaring van medische geschiktheid, afgegeven aan een rangeerder, een treindienstleider met volledige
      bevoegdheid of treindienstleider met minimale bevoegdheid, die de leeftijd van:

      a. 40 jaar nog niet heeft bereikt, is geldig voor de duur van vijf jaar, gerekend vanaf de datum van afgifte;

      b. 40 jaar doch nog niet de leeftijd van 63 jaar heeft bereikt, is geldig voor de duur van drie jaar, gerekend
      vanaf de datum van afgifte;

      c. 63 jaar heeft bereikt, is geldig voor de duur van een jaar, gerekend vanaf de datum van afgifte.

      3 De verklaring van psychologische geschiktheid is geldig voor de duur van:

      a. vijf jaar gerekend vanaf de datum van uitgifte indien die is afgegeven aan een machinist met volledige
      bevoegdheid of machinist met beperkte bevoegdheid;

      b. onbepaalde tijd indien die is afgegeven aan een rangeerder, een treindienstleider met volledige bevoegdheid of
      treindienstleider met minimale bevoegdheid.

      4 De verklaring van medische geschiktheid respectievelijk van psychologische geschiktheid verliest
      haar geldigheid indien bij een tussentijdse keuring door een keuringsinstituut als bedoeld in
      [artikel 50, vierde lid, van de wet][ref1], blijkt dat de betrokkene niet langer voldoet aan de krachtens
      [artikel 9][ref2] voor de uitoefening van de betrokken veiligheidsfunctie vastgestelde eisen inzake medische
      geschiktheid respectievelijk psychologische geschiktheid.

      5 Een tussentijdse keuring als bedoeld in het vierde lid vindt plaats indien bij degene onder wiens gezag de
      veiligheidsfunctie wordt uitgeoefend of bij de bij besluit van Onze Minister aangewezen personen, bedoeld in
      [artikel 69, eerste lid, van de wet][ref3], het vermoeden bestaat dat de betrokkene niet langer voldoet aan de
      voor de uitoefening van die veiligheidsfunctie vastgestelde eisen inzake medische geschiktheid respectievelijk
      psychologische geschiktheid.


