  - number: '8'
    text: |-
      1 De voor de machinist met volledige bevoegdheid of machinist met beperkte bevoegdheid vereiste bedrijfsgebonden
      kennis en bekwaamheid, bedoeld in [artikel 51a, vierde lid, onderdeel c, van de wet][ref1], betreft de kennis van
      de bedrijfsorganisatie en het veiligheidsbeheersysteem van de betrokken spoorwegonderneming.

      2 De voor de veiligheidsfunctie van rangeerder vereiste specifieke, taakgebonden en bedrijfsgebonden kennis en
      bekwaamheid, bedoeld in [artikel 51, eerste lid, van de wet][ref2], betreft:

      a. wegbekendheid op de locatie waarop hij als rangeerder wordt ingezet;

      b. kennis van lokale voorschriften;

      c. kennis van de spoorvoertuigen die hij begeleidt;

      d. kennis van de bedrijfsorganisatie en het veiligheidsbeheersysteem van de betrokken spoorwegonderneming.

      3 De voor de veiligheidsfunctie van wagencontroleur vereiste specifieke, taakgebonden en bedrijfsgebonden kennis en
      bekwaamheid, bedoeld in [artikel 51, eerste lid, van de wet][ref3], betreft:

      a. kennis van wagentypen en beladingen die hij controleert;

      b. kennis van de bedrijfsorganisatie en het veiligheidsbeheersysteem van de betrokken spoorwegonderneming.

      4 De voor de veiligheidsfunctie van treindienstleider met volledige bevoegdheid of treindienstleider met
      minimale bevoegdheid vereiste specifieke, taakgebonden en bedrijfsgebonden kennis en bekwaamheid, bedoeld in
      [artikel 51, eerste lid, van de wet][ref4], betreft:

      a. kennis van de inrichting van de gedeelten van het hoofdspoorwegnet waarvoor hij als treindienstleider dienst
      doet;

      b. kennis van lokale voorschriften;

      c. kennis van de bedrijfsorganisatie en het veiligheidsbeheersysteem;

      d. kennis van de schriftelijke, digitale en mondelinge communicatie als bedoeld in de geldende paragrafen en
      aanhangsels van de TSI Exploitatie en verkeersleiding.

      5 De beoordeling van de kennis en bekwaamheid, bedoeld in het eerste tot en met vierde lid, geschiedt door een
      vakinhoudelijk leidinggevende als bedoeld in [artikel 15, tweede lid][ref5].


