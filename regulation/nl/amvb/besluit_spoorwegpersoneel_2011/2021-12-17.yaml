        artikel: '51'
  - number: '15'
    text: |-
      1 Degene onder wiens gezag een veiligheidsfunctie wordt uitgeoefend, draagt zorg voor vakinhoudelijke leiding over
      de persoon door wie die functie wordt uitgeoefend.

      2 Een vakinhoudelijk leidinggevende dient te beschikken over zodanige kennis van en inzicht in de
      uitoefening van de betrokken veiligheidsfunctie en zodanige kennis van de processen en de techniek binnen het
      hoofdspoorwegverkeerssysteem, dat hij personen die de betrokken veiligheidsfunctie uitoefenen kan instrueren,
      beoordelen en corrigeren ten aanzien van de goede uitoefening van die functie.
    url: https://wetten.overheid.nl/BWBR0030006/2021-12-17#Artikel15
  - number: '16'
    text: |-
      1 Degene onder wiens gezag een veiligheidsfunctie wordt uitgeoefend, draagt er zorg voor dat de persoon door
      wie die functie wordt uitgeoefend periodiek een herinstructie volgt ten aanzien van de juiste uitvoering van de
      functie.

      2 Het periodieke onderzoek van de machinist met volledige bevoegdheid en de machinist met beperkte bevoegdheid,
      bedoeld in [artikel 51a, zesde lid, van de wet][ref1], vindt plaats met inachtneming van het bepaalde in bijlage
      VII van [richtlijn 2007/59/EG](32007L0059).


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel51a
