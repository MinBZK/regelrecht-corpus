        artikel: '69'
  - number: '12'
    text: |-
      1 Een aanvraag tot verlening, wijziging of verlenging van een machinistenvergunning wordt ingediend bij Onze
      Minister en gaat vergezeld van de bij regeling van Onze Minister vast te stellen documenten.

      2 Onze Minister besluit op een aanvraag binnen één maand nadat voldaan is aan het bepaalde in het eerste lid en de
      vergoeding voor het in behandeling nemen van de aanvraag is voldaan.

      3 De machinistenvergunning voldoet aan de daaromtrent bij of krachtens artikel 4 en bijlage I van [richtlijn
      2007/59/EG](32007L0059) gestelde regels.

      4 De machinistenvergunning is geldig voor de duur van tien jaar gerekend vanaf de datum van afgifte.

      5 Onze Minister verlengt een machinistenvergunning slechts indien de aanvrager beschikt over een geldige
      verklaring van medische geschiktheid en een geldige verklaring van psychologische geschiktheid als bedoeld in
      [artikel 11][ref1].

      6 Een machinistenvergunning door Onze Minister verleend aan een persoon met de leeftijd van 18 of 19 jaar is
      slechts geldig voor het besturen en begeleiden van spoorvoertuigen op hoofdspoorwegen in Nederland.

      7 Onze Minister kan op aanvraag van de houder een duplicaat afgeven van de machinistenvergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0030006#Artikel11
    url: https://wetten.overheid.nl/BWBR0030006/2021-12-17#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0030006
        artikel: '11'
  - number: '13'
    text: |-
      1 Het bevoegdheidsbewijs, bedoeld in [artikel 51a, vierde lid, van de wet][ref1], voldoet aan de daaromtrent bij of
      krachtens artikel 4 en bijlage I van [richtlijn 2007/59/EG](32007L0059) gestelde regels.

      2 Het bevoegdheidsbewijs vermeldt de spoorvoertuigen en de hoofdspoorweginfrastructuur waarop het betrekking heeft.

      3 Het bevoegdheidsbewijs vermeldt slechts de spoorvoertuigen en de hoofdspoorweginfrastructuur ten aanzien
      waarvan de machinist met volledige bevoegdheid of de machinist met beperkte bevoegdheid beschikt over een geldige
      beoordeling als bedoeld in [artikel 51a, vierde lid, onderdeel b, van de wet][ref2].

      4 Het bevoegdheidsbewijs voor de machinist met beperkte bevoegdheid vermeldt de beperking tot het besturen en
      begeleiden van spoorvoertuigen met een maximumsnelheid van 40 km per uur.

      5 De bevoegdheid als rangeerder of wagencontroleur kan bij machinisten met volledige of beperkte bevoegdheid worden
      aangetekend op het bevoegdheidsbewijs.

      6 Indien een vrijstelling als bedoeld in [artikel 5, derde lid][ref3], is verleend, wordt dit vermeld op het
      bevoegdheidsbewijs.

      7 Het bevoegdheidsbewijs is voor onbepaalde tijd geldig.

      8 Het bevoegdheidsbewijs verliest zijn geldigheid indien betrokkene de veiligheidsfunctie van machinist met
      volledige bevoegdheid of machinist met beperkte bevoegdheid niet meer uitoefent onder het gezag van degene die het
      bevoegdheidsbewijs heeft verstrekt of door schorsing of intrekking van het bevoegdheidsbewijs door degene die het
      bevoegdheidsbewijs heeft verstrekt.

      9 Degene onder wiens gezag de veiligheidsfunctie van machinist met volledige bevoegdheid of van machinist met
      beperkte bevoegdheid wordt uitgeoefend, verstrekt bij de beëindiging van het dienstverband aan de betrokken
      machinist een gewaarmerkte kopie van alle documenten waaruit zijn opleiding, zijn kwalificaties, zijn ervaring en
      zijn vakbekwaamheden blijken.

      10 Degene onder wiens gezag de veiligheidsfunctie van machinist met volledige bevoegdheid of van machinist met
      beperkte bevoegdheid wordt uitgeoefend, voorziet in een geschillenregeling omtrent de verstrekking, schorsing en
      intrekking van een bevoegdheidsbewijs, overeenkomstig artikel 15 van [richtlijn 2007/59/EG](32007L0059).


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel51a
      [ref2]: https://wetten.overheid.nl/BWBR0015007#Artikel51a
      [ref3]: https://wetten.overheid.nl/BWBR0030006#Artikel5
