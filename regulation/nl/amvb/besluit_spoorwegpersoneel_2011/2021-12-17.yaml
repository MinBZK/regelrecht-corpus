  - number: '2'
    text: |-
      Als veiligheidsfuncties binnen het hoofdspoorwegverkeerssysteem worden aangewezen de functies van:

      a. machinist met volledige bevoegdheid;

      b. machinist met beperkte bevoegdheid;

      c. rangeerder;

      d. wagencontroleur;

      e. treindienstleider met volledige bevoegdheid;

      f. treindienstleider met minimale bevoegdheid.
    url: https://wetten.overheid.nl/BWBR0030006/2021-12-17#Artikel2
  - number: '3'
    text: |-
      1 De machinist met volledige bevoegdheid is bevoegd tot het op hoofdspoorwegen besturen en begeleiden van alle
      typen spoorvoertuigen van categorie A en B.

      2 De machinist met beperkte bevoegdheid is bevoegd tot het op hoofdspoorwegen besturen en begeleiden van een of
      meerdere typen spoorvoertuigen van categorie A.

      3 De machinist met volledige bevoegdheid of de machinist met beperkte bevoegdheid is tevens bevoegd tot het
      koppelen en ontkoppelen van locomotieven en treinstellen voor zover hij voor die handelingen is opgeleid.

      4 De rangeerder is bevoegd tot het samenstellen en begeleiden van treinen en het begeleiden van spoorvoertuigen op
      hoofdspoorwegen met een maximumsnelheid van 40 km per uur.

      5 De wagencontroleur is bevoegd tot het controleren op kenbare gebreken van goederenwagens en de belading daarvan.

      6 De treindienstleider met volledige bevoegdheid is bevoegd tot:

      a. het ter beschikking stellen van veilige rijwegen; en

      b. het treffen van veiligheidsmaatregelen bij storingen en werkzaamheden aan hoofdspoorwegen of in de nabijheid
      daarvan.

      7 De treindienstleider met minimale bevoegdheid is bevoegd tot:

      a. het ter beschikking stellen van veilige rijwegen op emplacementen of gedeelten daarvan, die niet zijn voorzien
      van een technische beveiliging;

      b. het treffen van veiligheidsmaatregelen bij storingen en bij werkzaamheden aan of in de nabijheid van
      hoofdspoorwegen, op emplacementen of gedeelten daarvan, die niet zijn voorzien van een technische beveiliging.
    url: https://wetten.overheid.nl/BWBR0030006/2021-12-17#Artikel3
  - number: '4'
    text: |-
      1 Een persoon die uitsluitend tot taak heeft het besturen van als gereedschap dienende spoorvoertuigen
      tijdens het gebruik daarvan bij werkzaamheden aan of nabij de hoofdspoorweg ten behoeve van de
      hoofdspoorweginfrastructuur, op hoofdspoorwegen die buiten dienst zijn gesteld, is geen machinist als bedoeld in
      [artikel 2, onderdelen a en b][ref1].

      2 Een persoon die uitsluitend tot taak heeft het samenstellen en begeleiden van treinen en het begeleiden
      van spoorvoertuigen op hoofdspoorwegen die buiten dienst zijn gesteld, is geen rangeerder als bedoeld in
      [artikel 2, onderdeel c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030006#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0030006#Artikel2
