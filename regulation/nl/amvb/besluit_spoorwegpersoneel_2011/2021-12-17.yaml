  - number: '14'
    text: |-
      1 Het bezit van een bedrijfspas als bedoeld in [artikel 51, eerste lid, van de wet][ref1] is niet vereist voor:

      a. de treindienstleider met volledige bevoegdheid en treindienstleider met minimale bevoegdheid;

      b. rangeerders en wagencontroleurs, in dienst van een in het buitenland gevestigde spoorwegonderneming, die hun
      standplaats hebben in het buitenland en die slechts dienst doen op een nabij de rijksgrens gelegen station vanwege
      het rijden naar de rijksgrens, mits zij voldoen aan de in het land van hun standplaats geldende eisen betreffende
      de voor uitoefening van hun functie vereiste bevoegdheid.

      2 De bedrijfspas bevat ten minste de volgende gegevens:

      a. naam en geboortedatum van de houder;

      b. aanduiding van de veiligheidsfunctie of veiligheidsfuncties waarop de bedrijfspas betrekking heeft;

      c. datum van afgifte;

      d. eventuele beperkingen of voorwaarden ten aanzien van de medische en psychologische geschiktheid en

      e. naam van degene onder wiens gezag de veiligheidsfunctie waarvoor de bedrijfspas is afgegeven, wordt uitgeoefend.

      3 Een bedrijfspas is voor onbepaalde tijd geldig.

      4 Een bedrijfspas verliest zijn geldigheid:

      a. door schorsing of intrekking van de bedrijfspas door degene die de bedrijfspas heeft verstrekt;

      b. gedurende de tijd dat de houder niet beschikt over een geldige verklaring van medische geschiktheid en een
      geldige verklaring van psychologische geschiktheid;

      c. bij wijziging van de op de bedrijfspas vermelde gegevens, bedoeld in het tweede lid, onderdelen b, d en e;

      d. indien de houder de veiligheidsfunctie niet meer uitoefent onder het gezag van degene die de bedrijfspas heeft
      verstrekt.

      5 In de gevallen, bedoeld in het vierde lid, neemt degene die de bedrijfspas heeft afgegeven, de pas in.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel51
