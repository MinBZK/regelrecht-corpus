        artikel: '50'
  - number: '10'
    text: |-
      1 Het keuringsinstituut, bedoeld in [artikel 50, eerste en tweede lid, van de wet][ref1], geeft de verklaring van
      medische geschiktheid respectievelijk van psychologische geschiktheid af indien de keuring:

      a. heeft plaatsgevonden volgens een door Onze Minister goedgekeurd keuringsreglement, en

      b. doet blijken dat de aanvrager voldoet aan de krachtens [artikel 9][ref2] voor de betrokken veiligheidsfunctie
      vastgestelde eisen inzake medische en psychologische geschiktheid.

      2 Het keuringsreglement, bedoeld in het eerste lid, onderdeel a, voorziet in de mogelijkheid van een herkeuring
      indien de aanvrager bezwaar heeft tegen de uitslag van de keuring in eerste instantie.

      3 Bij regeling van Onze Minister kunnen eisen worden gesteld aan de inhoud van de verklaring van medische
      geschiktheid respectievelijk van psychologische geschiktheid.


      [ref1]: https://wetten.overheid.nl/BWBR0015007#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0030006#Artikel9
