preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties van 19 september 2005, nr. 2005-
    0000225119, gedaan mede namens Onze Minister van Buitenlandse Zaken en de Staatssecretaris van Defensie;

    Gelet op artikel 125, eerste lid, onder m, van de Ambtenarenwet, artikel 12, eerste lid, onder r, van de Militaire
    ambtenarenwet en artikel 50, eerste lid, van de Politiewet 1993;

    De Raad van State gehoord (advies van 11 november 2005, nr. W04.05.0411/I);

    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties van 25 januari 2006, nr.
    2006-0000010175, uitgebracht mede namens Onze Minister van Buitenlandse Zaken en de Staatssecretaris van Defensie;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0019525/2009-08-27#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0019525/2009-08-27#Artikel1
  - number: 1.a
    text: |-
      commissie: de Commissie integriteit overheid, bedoeld in [artikel 2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019525#Artikel2
    url: https://wetten.overheid.nl/BWBR0019525/2009-08-27#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0019525
        artikel: '2'
  - number: 1.b
    text: |-
      betrokkene: de ambtenaar in de zin van het [Algemeen Rijksambtenarenreglement][ref1], het
      [Besluit algemene rechtspositie politie][ref2], het [Besluit rechtspositie vrijwillige politie][ref3], het
      [Burgerlijk Ambtenarenreglement Defensie][ref4], het [Algemeen Militair Ambtenarenreglement][ref5], het
      [Ambtenarenreglement Staten-Generaal][ref6] en het [Reglement Dienst Buitenlandse Zaken][ref7] of degene die anders
      dan op basis van een aanstelling werkzaam is onder het bevoegd gezag en op wie het bevoegd gezag de desbetreffende
      regeling met betrekking tot het melden van een vermoeden van een misstand van overeenkomstige toepassing heeft
      verklaard;


      [ref1]: https://wetten.overheid.nl/BWBR0001950
      [ref2]: https://wetten.overheid.nl/BWBR0006516
      [ref3]: https://wetten.overheid.nl/BWBR0007321
      [ref4]: https://wetten.overheid.nl/BWBR0006040
      [ref5]: https://wetten.overheid.nl/BWBR0003482
      [ref6]: https://wetten.overheid.nl/BWBR0003229
      [ref7]: https://wetten.overheid.nl/BWBR0004052
