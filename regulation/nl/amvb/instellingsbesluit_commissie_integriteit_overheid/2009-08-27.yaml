  - number: 1.c
    text: |-
      vermoeden van een misstand: een op redelijke gronden gebaseerd vermoeden van het zich voordoen in de organisatie
      waar de betrokkene werkzaam is van een grove schending van wettelijke voorschriften of beleidsregels, een groot
      gevaar voor de gezondheid, de veiligheid of het milieu, dan wel een zeer onbehoorlijke wijze van functioneren, die
      het goed functioneren van de openbare dienst in gevaar kan brengen.
    url: https://wetten.overheid.nl/BWBR0019525/2009-08-27#Artikel1
  - number: '2.1'
    text: Er is een Commissie integriteit overheid.
    url: https://wetten.overheid.nl/BWBR0019525/2009-08-27#Artikel2
  - number: '2.2'
    text: |-
      De commissie heeft tot taak een door een betrokkene gemeld vermoeden van een misstand te onderzoeken en het bevoegd
      gezag naar aanleiding van dat onderzoek te adviseren.
    url: https://wetten.overheid.nl/BWBR0019525/2009-08-27#Artikel2
  - number: '3.1'
    text: |-
      De commissie bestaat uit drie leden, onder wie de voorzitter. Voorts kunnen een plaatsvervangend voorzitter en
      plaatsvervangende leden worden benoemd. De plaatsvervangend voorzitter wordt uit de leden benoemd.
    url: https://wetten.overheid.nl/BWBR0019525/2009-08-27#Artikel3
  - number: '3.2'
    text: |-
      De leden en de plaatsvervangende leden worden door Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      benoemd en ontslagen. Zij worden benoemd voor een periode van ten hoogste vier jaar. Herbenoeming kan twee maal en
      telkens voor ten hoogste vier jaar plaatsvinden. Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt
      de centrales van verenigingen die zijn toegelaten tot het arbeidsvoorwaardenoverleg van de sectoren Rijk, Politie
      en Defensie in de gelegenheid terzake voorstellen te doen.
    url: https://wetten.overheid.nl/BWBR0019525/2009-08-27#Artikel3
  - number: '4'
    text: |-
      De commissie wordt bijgestaan door een secretaris en een plaatsvervangend secretaris, die door Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties worden benoemd en ontslagen.
    url: https://wetten.overheid.nl/BWBR0019525/2009-08-27#Artikel4
  - number: '5'
    text: De commissie besluit bij meerderheid van stemmen.
    url: https://wetten.overheid.nl/BWBR0019525/2009-08-27#Artikel5
  - number: '6.1'
    text: 'De betrokkene kan het vermoeden van een misstand schriftelijk melden bij de commissie indien:'
    url: https://wetten.overheid.nl/BWBR0019525/2009-08-27#Artikel6
  - number: 6.1.a
    text: |-
      de betrokkene het vermoeden van een misstand heeft gemeld binnen de organisatie waar hij werkzaam is en hij zich
      niet kan vinden in het standpunt dat het bevoegd gezag naar aanleiding van de melding heeft ingenomen;
    url: https://wetten.overheid.nl/BWBR0019525/2009-08-27#Artikel6
  - number: 6.1.b
    text: |-
      de betrokkene het vermoeden van een misstand heeft gemeld binnen de organisatie waar hij werkzaam is en hij van
      het bevoegd gezag geen standpunt heeft ontvangen binnen de daarvoor in de desbetreffende rechtspositionele regeling
      gestelde termijn of binnen de verdaagde termijn of
    url: https://wetten.overheid.nl/BWBR0019525/2009-08-27#Artikel6
  - number: 6.1.c
    text: het bevoegd gezag de termijn, bedoeld in onderdeel b, onredelijk lang heeft verdaagd.
    url: https://wetten.overheid.nl/BWBR0019525/2009-08-27#Artikel6
  - number: '6.2'
    text: |-
      De betrokkene meldt het vermoeden van een misstand schriftelijk rechtstreeks bij de commissie, indien zwaarwegende
      redenen in de weg staan aan een melding binnen de organisatie waar hij werkzaam is.
    url: https://wetten.overheid.nl/BWBR0019525/2009-08-27#Artikel6
  - number: '6.3'
    text: 'De melding bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0019525/2009-08-27#Artikel6
  - number: 6.3.a
    text: naam en adres van de betrokkene;
    url: https://wetten.overheid.nl/BWBR0019525/2009-08-27#Artikel6
  - number: 6.3.b
    text: de organisatie waar de betrokkene werkzaam is;
    url: https://wetten.overheid.nl/BWBR0019525/2009-08-27#Artikel6
  - number: 6.3.c
    text: een omschrijving van de misstand die wordt vermoed;
    url: https://wetten.overheid.nl/BWBR0019525/2009-08-27#Artikel6
  - number: 6.3.d
    text: de reden van de melding aan de commissie en de motivering daarvan.
    url: https://wetten.overheid.nl/BWBR0019525/2009-08-27#Artikel6
  - number: '6.4'
    text: |-
      De betrokkene verschaft voorts de gegevens en bescheiden die voor het advies nodig zijn en waarover de betrokkene
      redelijkerwijs de beschikking kan krijgen.
    url: https://wetten.overheid.nl/BWBR0019525/2009-08-27#Artikel6
  - number: '6.5'
    text: |-
      De commissie waarborgt de anonimiteit van de betrokkene tegenover anderen dan de commissie, indien de betrokkene
      daarom met vermelding van redenen heeft verzocht.
    url: https://wetten.overheid.nl/BWBR0019525/2009-08-27#Artikel6
  - number: '7'
    text: |-
      De commissie bevestigt schriftelijk aan betrokkene de ontvangst van de melding en geeft van de melding zo spoedig
      mogelijk schriftelijk kennis aan het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0019525/2009-08-27#Artikel7
  - number: '8.1'
    text: |-
      De commissie kan de melding niet-ontvankelijk verklaren, indien niet is voldaan aan
      [artikel 6, eerste tot en met derde lid][ref1]. Indien niet is voldaan aan [artikel 6, derde lid][ref2], kan de
      niet-ontvankelijkverklaring eerst plaatsvinden nadat de betrokkene de gelegenheid heeft gehad binnen een door de
      commissie gestelde termijn de melding aan te vullen.


      [ref1]: https://wetten.overheid.nl/BWBR0019525#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0019525#Artikel6
    url: https://wetten.overheid.nl/BWBR0019525/2009-08-27#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0019525
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0019525
        artikel: '6'
  - number: '8.2'
    text: |-
      De commissie doet van deze verklaring zo spoedig mogelijk schriftelijk gemotiveerd mededeling aan de betrokkene en
      aan het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0019525/2009-08-27#Artikel8
  - number: '9.1'
    text: |-
      De commissie stelt een onderzoek in naar de vermoede misstand. De kosten van het onderzoek komen voor rekening van
      de desbetreffende organisatie.
    url: https://wetten.overheid.nl/BWBR0019525/2009-08-27#Artikel9
  - number: '9.2'
    text: |-
      De commissie informeert de persoon of de personen op wie de vermoede misstand betrekking heeft, dat een melding is
      gedaan, tenzij dit het onderzoeksbelang kan schaden.
    url: https://wetten.overheid.nl/BWBR0019525/2009-08-27#Artikel9
  - number: '9.3'
    text: |-
      De commissie kan bij het bevoegd gezag alle inlichtingen inwinnen die zij voor de vorming van haar advies nodig
      acht. Het bevoegd gezag verschaft de commissie de gevraagde inlichtingen.
    url: https://wetten.overheid.nl/BWBR0019525/2009-08-27#Artikel9
  - number: '9.4'
    text: |-
      Wanneer bepaalde door het bevoegd gezag verstrekte inlichtingen vanwege het vertrouwelijke karakter uitsluitend ter
      kennisneming van de commissie dienen te blijven, wordt dit aan de commissie meegedeeld. De commissie behandelt deze
      inlichtingen overeenkomstig de daarvoor geldende regels.
    url: https://wetten.overheid.nl/BWBR0019525/2009-08-27#Artikel9
  - number: '9.5'
    text: De commissie kan het onderzoek opdragen aan één van haar leden.
    url: https://wetten.overheid.nl/BWBR0019525/2009-08-27#Artikel9
  - number: '10.1'
    text: |-
      Indien de melding ontvankelijk is, adviseert de commissie het bevoegd gezag binnen drie maanden na ontvangst
      daarvan. De commissie kan het uitbrengen van het advies verdagen met een nader te bepalen termijn. Zij stelt de
      betrokkene en het bevoegd gezag daarvan schriftelijk gemotiveerd op de hoogte.
    url: https://wetten.overheid.nl/BWBR0019525/2009-08-27#Artikel10
  - number: '10.2'
    text: |-
      De commissie zendt de betrokkene een afschrift van het advies met inachtneming van het mogelijk vertrouwelijke
      karakter van aan de commissie verstrekte inlichtingen.
    url: https://wetten.overheid.nl/BWBR0019525/2009-08-27#Artikel10
  - number: '10.3'
    text: |-
      Het advies wordt in geanonimiseerde vorm en met inachtneming van het mogelijk vertrouwelijke karakter van aan de
      commissie verstrekte inlichtingen openbaar gemaakt, tenzij zwaarwegende redenen aan openbaarmaking in de weg staan.
      Openbaarmaking geschiedt in ieder geval door publicatie in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0019525/2009-08-27#Artikel10
  - number: '11'
    text: |-
      De commissie zendt jaarlijks aan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties een verslag
      betreffende haar werkzaamheden, waarin in elk geval in geanonimiseerde vorm en met inachtneming van de terzake
      geldende wettelijke bepalingen met betrekking tot het eventueel vertrouwelijke karakter, worden vermeld het aantal
      en de aard van de meldingen van een vermoeden van een misstand, het aantal meldingen dat niet tot een onderzoek
      heeft geleid, het aantal door de commissie verrichte onderzoeken en het aantal en de aard van de uitgebrachte
      adviezen.
    url: https://wetten.overheid.nl/BWBR0019525/2009-08-27#Artikel11
  - number: '12'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0019525/2009-08-27#Artikel12
