      betrekking staat tot in de derde graad en voor wie deze niet eerder werkzaamheden heeft verricht;
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel3.3
  - number: 3.3.a.2°
    text: kost en inwoning geniet van het gastgezin;
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel3.3
  - number: 3.3.a.3°
    text: |-
      maximaal 8 uur per dag tot een maximum van 30 uur per week in het gastgezin slechts lichte ondersteunende
      huishoudelijke werkzaamheden mag verrichten, waarvoor een aantoonbaar alternatief voorhanden is;
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel3.3
  - number: 3.3.a.4°
    text: minimaal 2 dagen per week vrij heeft;
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel3.3
  - number: 3.3.a.5°
    text: |-
      een dagindeling met het gastgezin schriftelijk en in een voor de au pair begrijpelijke taal heeft vastgesteld op
      grond waarvan de au pair licht ondersteunende huishoudelijke werkzaamheden verricht; en
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel3.3
  - number: 3.3.a.6°
    text: |-
      kan aantonen dat een verklaring is ondertekend, waaruit blijkt dat het gastgezin zich er van bewust is, dat de
      toezichthouders de bevoegdheid, bedoeld in [artikel 17 van de wet][ref1], hebben;


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel17
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '17'
  - number: 3.3.b
    text: |-
      er sprake is van werkzaamheden in het kader van een Working Holiday Scheme (WHS) of een Working Holiday Programme
      (WHP), dat in een Memorandum of Understanding geformuleerd is dat is goedgekeurd door Onze Minister van Sociale
      Zaken en Werkgelegenheid en Onze Minister van Justitie en Veiligheid;
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel3.3
  - number: 3.3.c
    text: |-
      er sprake is van werkzaamheden in het kader van een door het Nederlands Jeugdinstituut goedgekeurd European
      Voluntary Service-programme; of
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel3.3
  - number: 3.3.d
    text: |-
      er sprake is van deelname aan een door Onze Minister van Justitie en Veiligheid goedgekeurd uitwisselingsprogramma
      van een particuliere uitwisselingsorganisatie en verblijft in het gastgezin, bestaande uit minimaal 2 personen voor
      wie de vreemdeling niet eerder werkzaamheden heeft verricht.
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel3.3
  - number: '3.4'
    text: |-
      Het verbod is niet van toepassing met betrekking tot een vreemdeling die tot Nederland wordt toegelaten om arbeid
      te verrichten in het kader van een actieprogramma van de Europese Unie dat bekend gemaakt is in het publicatieblad
      van de Europese Unie voor de duur zoals is bepaald in het programma.
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel3.4
  - number: 4.1.1
    text: |-
      Het verbod is niet van toepassing met betrekking tot een vreemdeling die zijn hoofdverblijf buiten Nederland heeft
      en arbeid verricht met een maximale duur van 12 aaneengesloten weken binnen een tijdbestek van 36 weken uitsluitend
      bestaande uit:
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel4.1
  - number: 4.1.1.a
    text: |-
      het monteren of repareren van door zijn, buiten Nederland gevestigde, werkgever geleverde werktuigen, machines
      of apparatuur, dan wel het installeren en aanpassen van zijn, buiten Nederland gevestigde, werkgever geleverde
      software of uit het instrueren in het gebruik daarvan;
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel4.1
  - number: 4.1.1.b
    text: |-
      het voorbereiden, inrichten, houden of afbreken van een tentoonstelling of stand voor een buiten Nederland
      gevestigde opdrachtgever;
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel4.1
  - number: 4.1.1.c
    text: |-
      het in opdracht van een buitenlandse autoriteit controleren van in Nederland vervaardigde goederen, geproduceerde
      levensmiddelen of diervoerders ten behoeve van de invoer daarvan in het land van die buitenlandse autoriteit, of
      het in opdracht van een buitenlandse autoriteit opstellen, of afgeven van certificaten die vereist zijn voor de
      invoer van in Nederland vervaardigde goederen, geproduceerde levensmiddelen of diervoeders in het land van die
      buitenlandse autoriteit; of
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel4.1
  - number: 4.1.1.d
    text: |-
      het ontvangen van trainingen, dan wel instructies met betrekking tot het gebruik van in Nederland vervaardigde
      goederen en in Nederland te verrichten diensten.
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel4.1
  - number: 4.1.2
    text: |-
      Indien een vreemdeling wordt vervangen door een andere vreemdeling die op dezelfde plaats hetzelfde of
      vergelijkbaar werk uitvoert, is de maximale duur van arbeid, bedoeld in het eerste lid, de totale duur van de
      perioden van arbeid van de afzonderlijke vreemdelingen gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel4.1
  - number: 4.2.1
    text: |-
      Het verbod is niet van toepassing met betrekking tot een vreemdeling die zijn hoofdverblijf buiten Nederland heeft
      en arbeid verricht met een maximale duur van 13 weken binnen een tijdsbestek van 52 weken uitsluitend bestaande uit
      het voeren van zakelijke besprekingen of het sluiten van overeenkomsten met bedrijven en instellingen.
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel4.2
  - number: 4.2.2
    text: |-
      Indien een vreemdeling wordt vervangen door een andere vreemdeling die op dezelfde plaats hetzelfde of
      vergelijkbaar werk uitvoert, is de maximale duur van arbeid, bedoeld in het eerste lid, de totale duur van de
      perioden van arbeid van de afzonderlijke vreemdelingen gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel4.2
  - number: 4.3.1
    text: |-
      Het verbod is niet van toepassing met betrekking tot een vreemdeling die zijn hoofdverblijf buiten Nederland heeft
      en arbeid verricht met een maximale duur van 6 aaneengesloten weken binnen een tijdbestek van 13 weken uitsluitend
      bestaande uit:
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel4.3
  - number: 4.3.1.a
    text: |-
      het verzorgen van rapportages of het maken van documentaires voor een buiten Nederland gevestigd
      publiciteitsmedium;
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel4.3
  - number: 4.3.1.b
    text: |-
      het werkzaam zijn als artiest, vaste persoonlijk begeleider van een artiest, musicus, vaste persoonlijk begeleider
      van een musicus, beeldend kunstenaar, conservator of restaurator;
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel4.3
  - number: 4.3.1.c
    text: |-
      het deelnemen aan sportwedstrijden, dan wel het werkzaam zijn als vaste persoonlijke begeleider van een deelnemer
      aan sportwedstrijden; of
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel4.3
  - number: 4.3.1.d
    text: het werkzaam zijn in de huishouding van toeristen.
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel4.3
  - number: 4.3.2
    text: |-
      Het verbod is niet van toepassing met betrekking tot een vreemdeling die zijn hoofdverblijf buiten Nederland heeft
      en arbeid verricht met een maximale duur van 4 aaneengesloten weken binnen een tijdsbestek van 52 weken uitsluitend
      bestaande uit het onbeloond deelnemen aan proeftrainingen, die in het kader van een sollicitatieprocedure met een
      werkgever in het betaald voetbal schriftelijk zijn overeengekomen en waarvan de exacte periode voorafgaande aan de
      feitelijke deelname aan de proeftrainingen eveneens schriftelijk is vastgelegd. Dit lid is niet van toepassing met
      betrekking tot een vreemdeling die de leeftijd van 17 jaar nog niet heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel4.3
  - number: 4.3.3
    text: |-
      Indien een vreemdeling wordt vervangen door een andere vreemdeling die op dezelfde plaats hetzelfde of
      vergelijkbaar werk uitvoert, is de maximale duur van arbeid, bedoeld in het eerste en tweede lid, de totale duur
      van de perioden van arbeid van de afzonderlijke vreemdelingen gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel4.3
  - number: '4.4'
    text: |-
      Het verbod is niet van toepassing met betrekking tot een vreemdeling die in het kader van een
      ontwikkelingssamenwerkingsproject voor maximaal vier aaneengesloten weken per kalenderjaar naar Nederland komt om
      in samenwerking met Nederlandse ondernemers, vakspecialisten of experts van het project uitzending managers kennis
      en ervaring op te doen inzake de bedrijfsvoering van bedrijven, en zich door hen laat adviseren.
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel4.4
  - number: '4.5'
    text: |-
      Het verbod is niet van toepassing met betrekking tot een vreemdeling die zijn hoofdverblijf buiten Nederland heeft
      en:
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel4.5
  - number: 4.5.a
    text: |-
      geen arbeidsovereenkomst heeft met een in Nederland gevestigde werkgever en uitsluitend arbeid verricht op buiten
      Nederland geregistreerde vervoermiddelen in het internationale verkeer, niet zijnde een zeeschip als bedoeld in
      [artikel 2, eerste lid, van Boek 8 van het Burgerlijk Wetboek;][ref1] of


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel2
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '2'
  - number: 4.5.b
    text: |-
      als lid van de bemanning schepelingendienst verricht aan boord van een zeeschip als bedoeld in
      [artikel 2 van de Zeebrievenwet][ref1], voor zover het zeeschip niet uitsluitend als binnenschip wordt
      geëxploiteerd op de Nederlandse binnenwateren, dan wel als werktuig voor weg en waterbouw binnen Nederland en voor
      zover de vreemdeling niet behoort tot de categorie vreemdelingen, bedoeld in [artikel 4.5a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001933#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0046078#Artikel4
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0001933
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0046078
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.5a.1
    text: |-
      Het verbod is niet van toepassing met betrekking tot de vreemdeling die zijn hoofdverblijf buiten Nederland heeft
      en arbeid verricht:
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel4.5a
  - number: 4.5a.1.a
    text: |-
      op een bij ministeriële regeling aangewezen zeeschip als bedoeld in
      [artikel 2, eerste lid, van Boek 8, van het Burgerlijk Wetboek][ref1],
      voor zover het zeeschip als tijdelijk opvangcentrum als bedoeld in
      [artikel 1, aanhef en onderdeel d, van de Wet Centraal Orgaan opvang asielzoekers][ref2], wordt geëxploiteerd;


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006685#Artikel1
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel4.5a
    references:
      - id: ref1
        bwb_id: BWBR0005034
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0006685
        artikel: '1'
  - number: 4.5a.1.b
    text: |-
      waarbij de arbeid bestaat uit dienstverlening in de basisvoorzieningen in het kader van de taken, die zijn gesteld
      bij of krachtens [artikel 3, eerste lid, van de Wet Centraal Orgaan opvang asielzoekers][ref1], aan boord van het
      zeeschip;


      [ref1]: https://wetten.overheid.nl/BWBR0006685#Artikel3
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel4.5a
    references:
      - id: ref1
        bwb_id: BWBR0006685
        artikel: '3'
  - number: 4.5a.1.c
    text: |-
      waarvoor het overeengekomen, vaste, naar tijdruimte en in geld vastgestelde loon als vergoeding voor zijn arbeid
      dat hij van de werkgever ontvangt over de periode van ten hoogste een maand, en dat wordt bijgeschreven op een
      bankrekening, bestemd voor girale betaling, op naam van de vreemdeling, ten minste gelijk is aan het wettelijk
      minimumloon, bedoeld in [artikel 8, eerste lid, van de Wet minimumloon en minimumvakantiebijslag][ref1], waartoe
      niet wordt gerekend de door de werkgever te betalen vakantiebijslag, en waarvoor [artikel 12 van die wet][ref2] van
      overeenkomstige toepassing is, waarbij een normale arbeidsduur van 40 uren per week in aanmerking wordt genomen; en


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel12
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel4.5a
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '12'
  - number: 4.5a.1.d
    text: waarvoor de werkgever zorgdraagt voor behoorlijke en veilige accommodatie voor de vreemdeling.
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel4.5a
  - number: 4.5a.2
    text: 'Bij ministeriële regeling kunnen in ieder geval nadere regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel4.5a
  - number: 4.5a.2.a
    text: |-
      een limiet voor de toepassing van dit artikel voor categorieën van werkzaamheden of voor bepaalde categorieën
      vreemdelingen per aangewezen zeeschip;
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel4.5a
  - number: 4.5a.2.b
    text: de invulling van de werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel4.5a
  - number: 4.5a.2.c
    text: de administratie die aanwezig is op het zeeschip.
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel4.5a
  - number: '4.6'
    text: |-
      Het verbod is niet van toepassing met betrekking tot een vreemdeling die in het kader van grensoverschrijdende
      dienstverlening tijdelijk in Nederland arbeid verricht in dienst van een werkgever die buiten Nederland is
      gevestigd in een andere lidstaat van de Europese Unie, een andere staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte of Zwitserland, mits:
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel4.6
  - number: 4.6.a
    text: |-
      de vreemdeling voldoet aan alle voorschriften inzake verblijf, werkvergunning en sociale zekerheid om als werknemer
      van de werkgever arbeid te verrichten in het land waar de werkgever gevestigd is;
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel4.6
  - number: 4.6.b
    text: |-
      de vreemdeling arbeid verricht die gelijksoortig is aan de arbeid waartoe de vreemdeling gerechtigd is in het land
      waar de werkgever gevestigd is;
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel4.6
  - number: 4.6.c
    text: |-
      de totale duur van de overeengekomen dienstverrichting niet wordt overschreden indien de vreemdeling een andere
      vreemdeling die gelijksoortige arbeid heeft verricht vervangt; en
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel4.6
  - number: 4.6.d
    text: |-
      de werkgever daadwerkelijk substantiële activiteiten verricht als bedoeld in
      [artikel 6, derde lid, onder a, van de Wet arbeidsvoorwaarden gedetacheerde werknemers in de Europese Unie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0038054#Artikel6
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0038054
        artikel: '6'
  - number: '5.1'
    text: 'Het verbod is niet van toepassing met betrekking tot een vreemdeling die:'
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel5.1
  - number: 5.1.a
    text: houder is van een door Onze Minister van Buitenlandse Zaken afgegeven legitimatiebewijs;
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel5.1
  - number: 5.1.b
    text: |-
      als correspondent werkzaam is in dienst van een publiciteitsmedium dat zijn hoofdzetel buiten Nederland gevestigd
      heeft;
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel5.1
  - number: 5.1.c
    text: als militair behoort tot de krijgsmacht van een vreemde mogendheid;
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel5.1
  - number: 5.1.d
    text: die als burger werkzaam is in dienst van een Geallieerd Hoofdkwartier of de Noordatlantische Verdragsorganisatie;
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel5.1
  - number: 5.1.e
    text: |-
      die als burger werkzaam is in dienst van een vreemde mogendheid ten behoeve van een Geallieerd Hoofdkwartier, de
      Noordatlantische Verdragsorganisatie dan wel een vreemde krijgsmacht;
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel5.1
  - number: 5.1.f
    text: |-
      die als burger werkzaam is in dienst van een vreemde mogendheid ten behoeve van een instelling die in verband met
      de aanwezigheid van een Geallieerd Hoofdkwartier in Nederland is gevestigd.
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel5.1
  - number: 5.2.1
    text: |-
      Het verbod is niet van toepassing met betrekking tot de vreemdeling die werkzaamheden verricht binnen een traject
      in het kader van het internationale handelsverkeer, waarbij de vreemdeling de werkzaamheden uitoefent in de
      hoedanigheid van:
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel5.2
  - number: 5.2.1.a
    text: directeur-grootaandeelhouder van een in het buitenland gevestigde onderneming;
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel5.2
  - number: 5.2.1.b
    text: opdrachtnemer van een in het buitenland gevestigde onderneming; of
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel5.2
  - number: 5.2.1.c
    text: werknemer van een in het buitenland gevestigde werkgever.
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel5.2
  - number: 5.2.2
    text: |-
      De werkgever die gebruik wil maken van dit artikel dient daartoe een schriftelijke aanvraag in bij het
      Uitvoeringsinstituut werknemersverzekeringen. Bij het verzoek worden het traject, de bijbehorende werkzaamheden,
      evenals de duur van het traject gemeld, en wordt door de werkgever aangetoond dat hij aan de voorwaarden van dit
      artikel voldoet.
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel5.2
  - number: 5.2.3
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen beslist binnen vijf weken op het verzoek tot toelating van het
      traject, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel5.2
  - number: 5.2.4
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen verleent de toelating van het traject, bedoeld in het tweede lid,
      voor het traject voor de duur van maximaal drie jaar.
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel5.2
  - number: 5.2.5
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen kan de toelating van het traject, bedoeld in het tweede lid,
      weigeren:
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel5.2
  - number: 5.2.5.a
    text: |-
      indien de activiteit naar het oordeel van het Uitvoeringsinstituut werknemersverzekeringen concurrentie oplevert
      met het prioriteitgenietend aanbod, waarbij wordt meegewogen:
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel5.2
  - number: 5.2.5.a.1°
    text: de aard van het traject;
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel5.2
  - number: 5.2.5.a.2°
    text: de aard van de werkzaamheden die de vreemdeling binnen het traject zal uitvoeren;
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel5.2
  - number: 5.2.5.a.3°
    text: de duur van het traject;
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel5.2
  - number: 5.2.5.a.4°
