  - number: '7.8'
    text: 'Het verbod is niet van toepassing met betrekking tot een vreemdeling die:'
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel7.8
  - number: 7.8.a
    text: |-
      rechtmatig in Nederland verblijft, in de zin van [artikel 8, onder a of l, van de Vreemdelingenwet 2000][ref1], dan
      wel rechtmatig in Nederland verblijft, in de zin van artikel 8, onder f, g of h, van de Vreemdelingenwet 2000, in
      verband met een aanvraag van een verblijfsvergunning asiel of een aanvraag om voortgezette toelating; en


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel7.8
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 7.8.b
    text: |-
      naar het oordeel van het Uitvoeringsinstituut werknemersverzekeringen als vrijwilliger deelneemt aan arbeid die
      gebruikelijk onbetaald wordt verricht, geen winstoogmerk heeft en een algemeen maatschappelijk doel dient.
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel7.8
  - number: '7.9'
    text: |-
      Het verbod is niet van toepassing met betrekking tot een vreemdeling die rechtmatig verblijf heeft op grond van
      [artikel 8 van de Vreemdelingenwet 2000][ref1], en die:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel7.9
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 7.9.a
    text: |-
      gedetineerd is en deelneemt aan de in de inrichting beschikbare arbeid als bedoeld in
      [artikel 47, eerste lid, van de Penitentiaire beginselenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel47
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel7.9
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '47'
  - number: 7.9.b
    text: |-
      deelneemt aan een penitentiair programma als bedoeld in [artikel 4 van de Penitentiaire beginselenwet][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel4
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel7.9
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '4'
  - number: 7.9.c
    text: |-
      arbeid verricht in het kader van een taakstraf in de zin van [artikel 9 van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel9
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel7.9
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '9'
  - number: 7.10.1
    text: |-
      Bij ministeriële regeling kan worden bepaald dat het verbod niet van toepassing is met betrekking tot een
      vreemdeling die beschikt over:
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel7.10
  - number: 7.10.1.a
    text: |-
      een verblijfsvergunning regulier voor bepaalde tijd als bedoeld in
      [artikel 3.4, vierde lid, van het Vreemdelingenbesluit 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel7.10
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
  - number: 7.10.1.b
    text: |-
      een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 14 van de Vreemdelingenwet 2000][ref1],
      onder een beperking verband houdend met verblijf als familie- of gezinslid van een vreemdeling
      die beschikt over een verblijfsvergunning regulier voor bepaalde tijd als bedoeld in
      [artikel 3.4, vierde lid, van het Vreemdelingenbesluit 2000][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel7.10
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
  - number: 7.10.2
    text: |-
      In de ministeriële regeling, bedoeld in het eerste lid, kunnen regels worden gesteld omtrent de omstandigheden
      waaronder dit verbod niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel7.10
  - number: '8.1'
    text: |-
      Een tewerkstellingsvergunning of gecombineerde vergunning wordt geweigerd voor werkzaamheden geheel of ten dele
      bestaande in het verrichten van seksuele handelingen met derden of voor derden.
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel8.1
  - number: 8.2.1
    text: |-
      Ten behoeve van vreemdelingen met de Noord-Koreaanse nationaliteit worden geen tewerkstellingsvergunningen of
      gecombineerde vergunningen verleend.
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel8.2
  - number: 8.2.2
    text: |-
      Het eerste lid is niet van toepassing indien het Sanctiecomité, bedoeld in Resolutie 1718 (2006) van de
      Veiligheidsraad van de Verenigde Naties, vooraf per geval goedkeuring geeft voor de tewerkstelling van
      vreemdelingen met de Noord-Koreaanse nationaliteit omdat het dit nodig acht voor de verstrekking van humanitaire
      bijstand, denuclearisatie, of enig ander doel dat verenigbaar is met de doelstellingen van de resoluties van de
      Veiligheidsraad van de Verenigde Naties 1718 (2006), 1874 (2009), 2087 (2013), 2094 (2013), 2270 (2016), 2321
      (2016), 2356 (2017) of 2371 (2017).
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel8.2
  - number: 8.2.3
    text: |-
      Het verbod met betrekking tot de vreemdeling met de Noord-Koreaanse nationaliteit is van toepassing op
      [artikelen 2.1][ref1], [2.2][ref2], [2.3][ref3], [2.4][ref4], [2.5][ref5], [3.1][ref6], [3.3][ref7], [3.4][ref8],
      [4.1][ref9], [4.2][ref10], [4.3][ref11], met uitzondering van artikel 4.3, eerste lid, onder c, en daarnaast op
      de [artikelen 4.4][ref12], [5.1][ref13], [5.2][ref14], [6.3][ref15], [6.4][ref16], [7.1][ref17], [7.2][ref18],
      [7.3][ref19], [7.4][ref20], [7.5][ref21], [7.6][ref22] en [7.7][ref23].


