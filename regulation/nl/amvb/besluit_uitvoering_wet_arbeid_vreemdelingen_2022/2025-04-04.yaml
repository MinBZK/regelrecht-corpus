  - number: '9.1'
    text: |-
      Als bij de beoordeling tot het afgeven van een tewerkstellingsvergunning een volledige toetsing plaatsvindt van
      [artikel 8, eerste lid, van de wet][ref1], wordt een tewerkstellingsvergunning voor ten hoogste twee jaar verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel8
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '8'
  - number: 10.1.1
    text: |-
      Na een herhaling van een overtreding of soortgelijke overtreding wordt een waarschuwing gegeven als bedoeld in
      [artikel 17b, eerste lid, van de wet][ref1] en indien een herhaling van die of een soortgelijke overtreding is
      geconstateerd als bedoeld in dat artikel van de wet, wordt een bevel opgelegd door de daartoe aangewezen ambtenaar
      dat de door hem aangewezen werkzaamheden voor een daarbij aangegeven periode worden stilgelegd dan wel niet mogen
      aanvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel17b
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel10.1
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: 17b
  - number: 10.1.2
    text: |-
      Indien een ernstige overtreding is geconstateerd, wordt in afwijking van het eerste lid, een waarschuwing als
      bedoeld in [artikel 17b, eerste lid, van de wet][ref1] gegeven bij de eerste overtreding en wordt, indien opnieuw
      dezelfde of een soortgelijke overtreding is geconstateerd die eveneens ernstig is, een bevel opgelegd door de
      daartoe aangewezen ambtenaar dat de door hem aangewezen werkzaamheden voor een daarbij aangegeven periode worden
      stilgelegd dan wel niet mogen aanvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel17b
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel10.1
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: 17b
  - number: 10.1.3
    text: |-
      Als een ernstige overtreding als bedoeld in het eerste of tweede lid wordt aangemerkt de overtreding waarbij ten
      minste 20 werkenden zijn betrokken.
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel10.1
  - number: 10.1.4
    text: |-
      Indien de aard van de overtreding of de met de overtreding samenhangende omstandigheden dan wel de gevolgen van
      een stillegging van de werkzaamheden daartoe aanleiding geven, kan worden afgezien van een waarschuwing als bedoeld
      in het eerste en tweede lid en kan worden afgezien van een bevel als bedoeld in het eerste en tweede lid. Een
      dergelijke waarschuwing wordt niet gegeven of een dergelijk bevel wordt niet opgelegd, indien de overtreding een
      handelen of nalaten betreft in strijd met de [artikelen 2a, eerste lid][ref1], en [15 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0007149#Artikel15
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel10.1
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: 2a
      - id: ref2
        bwb_id: BWBR0007149
        artikel: '15'
  - number: 10.1.5
    text: Bij ministeriële regeling kan het aantal werkenden, bedoeld in het derde lid, worden aangepast.
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel10.1
  - number: '10.2'
    text: |-
      Als ernstige overtreding in de zin van [artikel 19d, derde en vijfde lid, van de wet][ref1] wordt aangemerkt de
      overtreding, genoemd in [artikel 10.1, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel19d
      [ref2]: https://wetten.overheid.nl/BWBR0046078#Artikel10
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel10.2
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: 19d
      - id: ref2
        bwb_id: BWBR0046078
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.3.1
    text: |-
      Als soortgelijke verplichtingen en verboden als bedoeld in [artikel 19d, tweede en vierde lid, van de wet][ref1]
      worden aangewezen de verplichtingen en verboden op grond van de [artikelen 2, eerste lid][ref2], [15a][ref3] en
      [18, tweede lid, zoals dat artikel luidde op 30 juni 2015, van de wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel19d
      [ref2]: https://wetten.overheid.nl/BWBR0007149#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0007149#Artikel15a
      [ref4]: https://wetten.overheid.nl/BWBR0007149#Artikel18
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel10.3
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: 19d
      - id: ref2
        bwb_id: BWBR0007149
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0007149
        artikel: 15a
      - id: ref4
        bwb_id: BWBR0007149
        artikel: '18'
  - number: 10.3.2
    text: |-
      Als een soortgelijke overtreding als bedoeld in [artikel 10.1, eerste en tweede lid][ref1], wordt beschouwd een
      overtreding van de [artikelen 2, eerste lid][ref2], [15a][ref3] en [18, tweede lid][ref4], zoals dat artikel luidde
      op 30 juni 2015, van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0046078#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0007149#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0007149#Artikel15a
      [ref4]: https://wetten.overheid.nl/BWBR0007149#Artikel18
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel10.3
    references:
      - id: ref1
        bwb_id: BWBR0046078
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0007149
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0007149
        artikel: 15a
      - id: ref4
        bwb_id: BWBR0007149
        artikel: '18'
  - number: 11.1.1
    text: |-
      De gegevens, bedoeld in [artikel 19g van de wet][ref1], worden door de toezichthouder of de door Onze Minister
      aangewezen ambtenaren geplaatst op een website met informatie van de toezichthouder of de door Onze Minister
      aangewezen ambtenaren, bedoeld in artikel 19g, eerste lid, van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel19g
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel11.1
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: 19g
  - number: 11.1.2
    text: |-
      De gegevens, bedoeld in [artikel 19g, eerste lid, van de wet][ref1], blijven drie jaar na de datum van bekendmaking
      van het besluit, bedoeld 19g, eerste lid, van de wet, dan wel na verzending van een brief met de mededeling dat er
      geen overtreding is geconstateerd, beschikbaar op de website.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel19g
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel11.1
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: 19g
  - number: 11.2.1
    text: |-
      De gegevens, bedoeld in [artikel 19g van de wet][ref1], betreffen:


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel19g
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel11.2
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: 19g
  - number: 11.2.1.a
    text: de punten waarop is gecontroleerd en de wet of wetten die de grondslag daarvoor bieden;
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel11.2
  - number: 11.2.1.b
    text: de locatie waar het onderzoek heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel11.2
  - number: 11.2.1.c
    text: de datum of periode waarop het onderzoek heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel11.2
  - number: 11.2.1.d
    text: de naam en vestigingsplaats van de betreffende normadressaat;
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel11.2
  - number: 11.2.1.e
    text: |-
      het nummer waaronder de betreffende normadressaat is ingeschreven in een register van het land van vestiging, dan
      wel de unieke code die naar de betreffende normadressaat te herleiden is; en
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel11.2
  - number: 11.2.1.f
    text: de sector of branche waarin deze normadressaat zijn economische activiteit verricht.
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel11.2
  - number: 11.2.2
    text: |-
      Indien na afronding van een onderzoek geen overtreding is geconstateerd die leidt tot de besluiten, genoemd in
      [artikel 11.3][ref1], wordt bij de gegevens, genoemd in het eerste lid, de opmerking geplaatst dat geen overtreding
      is geconstateerd.


      [ref1]: https://wetten.overheid.nl/BWBR0046078#Artikel11
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel11.2
    references:
      - id: ref1
        bwb_id: BWBR0046078
        artikel: '11'
        hoofdstuk: '11'
  - number: 11.3.1
    text: |-
      In aanvulling op [artikel 11.2, eerste lid][ref1], worden indien een onderzoek door de toezichthouder
      of de door Onze Minister aangewezen ambtenaren, bedoeld in de [artikelen 14, eerste lid][ref2], en
      [19a, eerste lid, van de wet][ref3], wordt gevolgd door een besluit tot het opleggen van een bestuurlijke boete
      als bedoeld in artikel 19a, dan wel door een besluit tot bevel tot staken van de werkzaamheden als bedoeld in
      [artikel 17b, tweede lid, van de wet][ref4], de volgende inspectiegegevens over dat besluit openbaar gemaakt:


      [ref1]: https://wetten.overheid.nl/BWBR0046078#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0007149#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0007149#Artikel19a
      [ref4]: https://wetten.overheid.nl/BWBR0007149#Artikel17b
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel11.3
    references:
      - id: ref1
        bwb_id: BWBR0046078
        artikel: '11'
        hoofdstuk: '11'
      - id: ref2
        bwb_id: BWBR0007149
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0007149
        artikel: 19a
      - id: ref4
        bwb_id: BWBR0007149
        artikel: 17b
  - number: 11.3.1.a
    text: welk besluit is genomen, de artikelen van de wet die de grondslag daarvoor bieden en de datum van dat besluit; en
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel11.3
  - number: 11.3.1.b
    text: |-
      welke rechtsmiddelen tegen het besluit zijn of kunnen worden aangewend en wat hiervan de uitkomst was, of dat het
      besluit onherroepelijk is geworden.
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel11.3
  - number: 11.3.2
    text: |-
      Indien het besluit geheel of gedeeltelijk bestaat uit een bevel tot staken van de werkzaamheden, bedoeld in
      [artikel 17b van de wet][ref1], bevat de openbaarmaking tevens de periode waarin de werkzaamheden zijn gestaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel17b
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel11.3
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: 17b
  - number: 11.4.1
    text: |-
      De openbaarmaking van de gegevens, bedoeld in de [artikelen 11.2][ref1] en [11.3][ref2], geschiedt niet eerder dan
      tien werkdagen, doch uiterlijk dertig werkdagen na de datum waarop het besluit tot openbaarmaking van deze gegevens
      aan belanghebbende bekend is gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0046078#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0046078#Artikel11
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel11.4
    references:
      - id: ref1
        bwb_id: BWBR0046078
        artikel: '11'
        hoofdstuk: '11'
      - id: ref2
        bwb_id: BWBR0046078
        artikel: '11'
        hoofdstuk: '11'
  - number: 11.4.2
    text: |-
      Indien wordt verzocht om een voorlopige voorziening als bedoeld in [artikel 19g, zevende lid, van de wet][ref1],
      wordt de termijn van dertig werkdagen, bedoeld in het eerste lid, overeenkomstig opgeschort.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel19g
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel11.4
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: 19g
  - number: 11.5.1
    text: |-
      Op verzoek van de belanghebbende kan een schriftelijke reactie over de openbaarmaking van de gegevens, bedoeld in
      de [artikelen 11.2][ref1] en [11.3][ref2], van ten hoogste 2.000 leestekens worden gegeven, die zal worden gevoegd
      bij de openbaar te maken gegevens op de website met informatie van de toezichthouder of de door Onze Minister
      aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0046078#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0046078#Artikel11
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel11.5
    references:
      - id: ref1
        bwb_id: BWBR0046078
        artikel: '11'
        hoofdstuk: '11'
      - id: ref2
        bwb_id: BWBR0046078
        artikel: '11'
        hoofdstuk: '11'
  - number: 11.5.2
    text: |-
      Onderdelen van de schriftelijke reactie die persoonsgegevens, bedrijfsnamen of bedrijfsgegevens van derden dan wel
      strafbare of aanstootgevende uitlatingen bevatten, worden niet op de website gepubliceerd.
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel11.5
  - number: '11.6'
    text: |-
      Indien in verband met een beslissing op bezwaar, beroep of hoger beroep wordt vastgesteld dat de gegevens, die
      op grond van [artikel 19g van de wet][ref1], en de [artikelen 11.2][ref2] en [11.3][ref3] zijn gemaakt, niet meer
      juist of volledig zijn, worden deze gegevens aangepast, binnen tien werkdagen na ontvangst van de desbetreffende
      beslissing door Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel19g
      [ref2]: https://wetten.overheid.nl/BWBR0046078#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0046078#Artikel11
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel11.6
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: 19g
      - id: ref2
        bwb_id: BWBR0046078
        artikel: '11'
        hoofdstuk: '11'
      - id: ref3
        bwb_id: BWBR0046078
        artikel: '11'
        hoofdstuk: '11'
  - number: '13.1'
    text: |-
      Het [Besluit uitvoering Wet arbeid vreemdelingen][ref1] en het Besluit van 22 maart 2019 tot
      wijziging van het Besluit uitvoering Wet arbeid vreemdelingen, het [Besluit inburgering][ref2] en het
      [Vreemdelingenbesluit 2000][ref3] om enkele regelingen te treffen in verband met de terugtrekking van het Verenigd
      Koninkrijk uit de Europese Unie (Stb. 2019, 125) worden ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0007523
      [ref2]: https://wetten.overheid.nl/BWBR0020674
      [ref3]: https://wetten.overheid.nl/BWBR0011825
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel13.1
    references:
      - id: ref1
        bwb_id: BWBR0007523
      - id: ref2
        bwb_id: BWBR0020674
      - id: ref3
        bwb_id: BWBR0011825
  - number: '13.2'
    text: |-
      Na de inwerkingtreding van dit besluit berust mede de [Regeling uitvoering Wet arbeid vreemdelingen][ref1] op de
      [artikelen 6.2, tweede lid][ref2], en [10.1, vijfde lid][ref3], van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0034570
      [ref2]: https://wetten.overheid.nl/BWBR0046078#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0046078#Artikel10
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel13.2
    references:
      - id: ref1
        bwb_id: BWBR0034570
      - id: ref2
        bwb_id: BWBR0046078
        artikel: '6'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0046078
        artikel: '10'
        hoofdstuk: '10'
  - number: 13.3.1
    text: |-
      Dit besluit treedt in werking op het tijdstip waarop de
      __REF000___________________________________________________________________________________________________________
      _____________________________________ (Stb. 2021, 505) in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0045741
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel13.3
    references:
      - id: ref1
        bwb_id: BWBR0045741
  - number: 13.3.2
    text: |-
      De [artikelen 2.7][ref1] en [7.1, onder a, subonderdeel 6°][ref2], met vervanging van de
      puntkomma aan het slot van subonderdeel 4° door «; of» en met vervanging van «; of» aan het slot
      van subonderdeel 5° door een punt, van het Besluit uitvoering Wet arbeid vreemdelingen 2022 en
      [artikel 3.31, zesde lid, van het Vreemdelingenbesluit 2000][ref3] vervallen met ingang van 1 juni 2025.


      [ref1]: https://wetten.overheid.nl/BWBR0046078#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0046078#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel13.3
    references:
      - id: ref1
        bwb_id: BWBR0046078
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0046078
        artikel: '7'
        hoofdstuk: '7'
      - id: ref3
        bwb_id: BWBR0011825
        artikel: '3'
  - number: 13.3.3
    text: 'Het tweede lid geldt met dien verstande dat:'
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel13.3
  - number: 13.3.3.a
    text: |-
      [artikel 2.7][ref1] van het Besluit uitvoering Wet arbeid vreemdelingen 2022 en
      [artikel 3.31, zesde lid, van het Vreemdelingenbesluit 2000][ref2], zoals die luidden op 31 mei 2025, tot en met
      31 mei 2026 van toepassing blijven met betrekking tot de vreemdeling die op basis van [artikel 2.7][ref3] van het
      Besluit uitvoering Wet arbeid vreemdelingen 2022 werkzaamheden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0046078#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0046078#Artikel2
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel13.3
    references:
      - id: ref1
        bwb_id: BWBR0046078
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0046078
        artikel: '2'
        hoofdstuk: '2'
  - number: 13.3.3.b
    text: |-
      [Artikel 7.1, onder a, subonderdeel 6°][ref1], van het Besluit uitvoering Wet arbeid vreemdelingen 2022, zoals dat
      luidde op 31 mei 2025, tot en met 31 mei 2026 van toepassing blijft met betrekking tot het familie- of gezinslid
      van de vreemdeling, bedoeld onder a.


      [ref1]: https://wetten.overheid.nl/BWBR0046078#Artikel7
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel13.3
    references:
      - id: ref1
        bwb_id: BWBR0046078
        artikel: '7'
        hoofdstuk: '7'
  - number: 13.3.4
    text: |-
      [Artikel 6.5][ref1] vervalt op een bij koninklijk besluit te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0046078#Artikel6
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel13.3
    references:
      - id: ref1
        bwb_id: BWBR0046078
        artikel: '6'
        hoofdstuk: '6'
  - number: 13.3.5
    text: |-
      [Artikel 4.5a][ref1] en de zinsnede «en voor zover de vreemdeling niet behoort tot de categorie vreemdelingen,
      bedoeld in artikel 4.5a» in artikel 4.5, onderdeel b, vervallen op een bij koninklijk besluit te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0046078#Artikel4
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel13.3
    references:
      - id: ref1
        bwb_id: BWBR0046078
        artikel: '4'
        hoofdstuk: '4'
  - number: '13.4'
    text: 'Dit besluit wordt aangehaald als: Besluit uitvoering Wet arbeid vreemdelingen 2022.'
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel13.4
