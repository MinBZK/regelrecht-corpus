    text: |-
      Het eerste lid is van toepassing op de vreemdeling die in Nederland een beroepsopleiding volgt bij een
      instelling als bedoeld in [artikel 1.1.1 van de Wet educatie en beroepsonderwijs][ref1] of een instelling die een
      beroepsopleiding verzorgt waarvan op grond van [artikel 1.4.1. Wet educatie en beroepsonderwijs][ref2] aan de met
      goed gevolg afgelegde examens of onderdelen van examens een diploma of certificaat is verbonden, en in het kader
      van die beroepsopleiding te werk wordt gesteld op grond van een beroepspraktijkvormingsovereenkomst als bedoeld in
      [artikel 7.2.8. van de Wet educatie en beroepsonderwijs][ref3], dan wel in Nederland in het kader van een opleiding
      aan een hogeschool in de zin van de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref4] te werk wordt
      gesteld op de grond van een stageovereenkomst, gesloten tussen de hogeschool, de werkgever en hemzelf.


