preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 12 juli 2021, nr. 2021-
    0000112895, gedaan in overeenstemming met de Staatssecretaris van Justitie en Veiligheid;

    Gelet op de artikelen 3, eerste lid, onder c, 4, tweede lid, onder c, 5a, 8, eerste lid, onderdeel g en tweede lid,
    11, derde lid, 17b, eerste en zevende lid, 19d, tweede, derde, vierde en vijfde lid en 19g, derde lid, van de Wet
    arbeid vreemdelingen, 14, vierde lid, van de Vreemdelingenwet 2000;

    De Afdeling advisering van de Raad van State gehoord (advies van 8 september 2021, nr.W12.21.0222/III);

    Gezien het nader rapport van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 6 december 2021,
    nr. 2021-0000151328, uitgebracht in overeenstemming met de Staatssecretaris van Justitie en Veiligheid;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - *verbod:* het verbod, bedoeld in
      [artikel 2, eerste lid, van de Wet arbeid vreemdelingen][ref1];
        - *wet:* [Wet arbeid vreemdelingen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007149
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0007149
  - number: 2.1.1
    text: |-
      Het verbod is niet van toepassing met betrekking tot een vreemdeling die rechtmatig in Nederland verblijft op grond
      van [artikel 8, onderdelen a, b, d, e, k of l, van de Vreemdelingenwet 2000][ref1] of een vreemdeling die in het
      bezit is van een machtiging tot voorlopig verblijf die overeenkomt met het verblijfsdoel «kennismigrant» waarvoor
      een verblijfsvergunning voor bepaalde tijd als bedoeld in [artikel 14 van de Vreemdelingenwet 2000][ref2] is
      aangevraagd en die:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 2.1.1.a
    text: |-
      als kennismigrant als bedoeld in [artikel 3.4, eerste lid, van het Vreemdelingenbesluit 2000][ref1] in Nederland
      wordt tewerkgesteld op basis van een arbeidsovereenkomst of een ambtelijke aanstelling en:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
  - number: 2.1.1.a.1°
    text: |-
      van wie het overeengekomen vaste, naar tijdruimte en in geld vastgestelde loon als vergoeding voor zijn arbeid dat
      hij van de werkgever ontvangt, indien hij de leeftijd van dertig jaar niet heeft bereikt, ten minste € 4.171 per
      maand bedraagt, waartoe niet wordt gerekend de door de werkgever te betalen vakantiebijslag, dan wel indien hij
      dertig jaar of ouder is, ten minste € 5.688 per maand bedraagt, waartoe niet wordt gerekend de door de werkgever te
      betalen vakantiebijslag; of
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.1
  - number: 2.1.1.a.2°
    text: |-
      die voldoet aan de voorwaarden voor een verblijfsvergunning regulier voor bepaalde tijd onder
      de beperking «het zoeken naar en verrichten van arbeid al dan niet in loondienst» op grond van
      [artikel 3.42 van het Vreemdelingenbesluit 2000][ref1] en van wie het overeengekomen vaste, naar tijdruimte en in
      geld vastgestelde loon als vergoeding voor zijn arbeid dat hij van de werkgever ontvangt, ten minste € 2.989 per
      maand bedraagt, waartoe niet wordt gerekend de door de werkgever te betalen vakantiebijslag;


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
  - number: 2.1.1.b
    text: |-
      in Nederland wordt tewerkgesteld in het kader van het doen van wetenschappelijk onderzoek bij een bekostigde of
      aangewezen onderwijsinstelling of een van overheidswege direct of indirect, geheel of gedeeltelijke bekostigde of
      gesubsidieerde onderzoeksinstelling;
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.1
  - number: 2.1.1.c
    text: |-
      in Nederland wordt tewerkgesteld als arts in opleiding tot specialist aan een door de Medisch Specialisten
      Registratie Commissie, de Sociaal-Geneeskundigen Registratie Commissie of de Huisarts en Verpleeghuisarts
      Registratie Commissie aangewezen opleidingsinstituut; of
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.1
  - number: 2.1.1.d
    text: |-
      als gastdocent onder de beperking «arbeid als kennismigrant» als bedoeld in
      [artikel 3.4, eerste lid, van het Vreemdelingenbesluit 2000][ref1] in Nederland wordt tewerkgesteld bij een
      universiteit, hogeschool of instelling voor hoger internationaal onderwijs die erkende referent is als bedoeld
      in [artikel 1, onder t, van de Vreemdelingenwet 2000][ref2] en die beschikt over een gastovereenkomst met
      de vreemdeling, of bij een onderzoeksinstelling die gelieerd is aan of werkzaam is op het terrein van een
      universiteit, hogeschool of instelling voor hoger internationaal onderwijs, die erkende referent is en die beschikt
      over een gastovereenkomst met de vreemdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel1
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '1'
  - number: 2.1.2
    text: |-
      Het eerste lid is van toepassing indien de werkgever door Onze Minister van Justitie en Veiligheid krachtens
      [artikel 2c van de Vreemdelingenwet 2000][ref1] is erkend als referent ten behoeve van het verblijf van
      vreemdelingen die in Nederland verblijven of willen verblijven voor het verrichten van arbeid in loondienst, als
      kennismigrant of voor onderzoek in de zin van [richtlijn (EU) 2016/801](32016L0801) van het Europees Parlement
      en de Raad van 11 mei 2016 betreffende de voorwaarden voor toegang en verblijf van derdelanders met het oog op
      onderzoek, studie, stages, vrijwilligerswerk, scholierenuitwisseling, educatieve projecten of au-pairactiviteiten
      (herschikking) (PbEU 2016, L 132).


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel2c
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: 2c
  - number: 2.1.3
    text: |-
      Het verbod is eveneens niet van toepassing met betrekking tot een vreemdeling die arbeid verricht als bedoeld in
      het eerste lid, onder a, b, c of d, en daarnaast arbeid als zelfstandige verricht.
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.1
  - number: 2.1.4
    text: |-
      In afwijking van het eerste lid, aanhef en onder a, blijft het verbod van toepassing met betrekking tot de
      vreemdeling die:
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.1
  - number: 2.1.4.a
    text: werkzaam is als beroepssporter in het betaald voetbal;
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.1
  - number: 2.1.4.b
    text: werkzaam is als geestelijke; of
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.1
  - number: 2.1.4.c
    text: |-
      werkzaamheden als bedoeld in [artikel 8.1][ref1] verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0046078#Artikel8
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0046078
        artikel: '8'
        hoofdstuk: '8'
  - number: 2.1.5
    text: |-
      De in het eerste lid, onder a, genoemde bedragen worden jaarlijks met ingang van 1 januari gewijzigd met het
      percentage waarmee het indexcijfer van de CAO-lonen over de maand oktober daaraan voorafgaand, gepubliceerd door
      het Centraal Bureau voor de Statistiek, afwijkt van het indexcijfer waarop de laatste vaststelling van de bedragen
      is gebaseerd. De gewijzigde bedragen worden door of namens Onze Minister medegedeeld in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.1
  - number: 2.1.6
    text: |-
      Het loon, bedoeld in het eerste lid, aanhef en onder a, is ten minste marktconform als bedoeld in
      [artikel 3.30a van het Vreemdelingenbesluit 2000][ref1] en wordt door de werkgever over een periode van ten hoogste
      een maand, bijgeschreven op een bankrekening, bestemd voor girale betaling, op naam van de vreemdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
  - number: 2.2.1
    text: |-
      Het verbod is niet van toepassing met betrekking tot een vreemdeling die houder is van een door Onze Minister van
      Justitie en Veiligheid ter uitvoering van artikel 9 van [Richtlijn (EU) 2021/1883](32021L1883) van het Europees
      Parlement en de Raad van 20 oktober 2021 betreffende de voorwaarden voor toegang en verblijf van onderdanen van
      derde landen met het oog op een hooggekwalificeerde baan, en tot intrekking van [Richtlijn 2009/50/EG](32009L0050)
      van de Raad (PbEU 2021, L 382/1) afgegeven Europese blauwe kaart, dan wel van een geldige machtiging tot voorlopig
      verblijf onder een beperking verband houdend met verblijf als houder van een Europese blauwe kaart, voor zover
      die vreemdeling:
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.2
  - number: 2.2.1.a
    text: beschikt over relevante hogere beroepskwalificaties; en
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.2
  - number: 2.2.1.b
    text: |-
      van de werkgever een vast brutoloon voor de arbeid ontvangt van ten minste € 5.688 per maand, waartoe niet wordt
      gerekend de door de werkgever te betalen vakantiebijslag, dan wel ten minste € 4.551 per maand, waartoe niet wordt
      gerekend de door de werkgever te betalen vakantiebijslag, indien hij niet meer dan drie jaar voor de aanvraag voor
      een Europese blauwe kaart, een getuigschrift van hoger onderwijs heeft behaald.
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.2
  - number: 2.2.2
    text: |-
      Het verbod is eveneens niet van toepassing met betrekking tot een vreemdeling die arbeid verricht als bedoeld in
      het eerste lid, en daarnaast arbeid als zelfstandige verricht.
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.2
  - number: 2.2.3
    text: |-
      Het verbod is eveneens niet van toepassing op een vreemdeling die houder is van een door een andere lidstaat van
      de Europese Unie afgegeven Europese blauwe kaart en die gedurende maximaal 90 dagen in een periode van 180 dagen in
      een of meer tweede lidstaten binnenkomt en verblijft om er een werkactiviteit uit te oefenen bestaande uit:
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.2
  - number: 2.2.3.a
    text: het bijwonen van interne of externe bedrijfsvergaderingen;
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.2
  - number: 2.2.3.b
    text: het sluiten van overeenkomsten met bedrijven en instellingen;
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.2
  - number: 2.2.3.c
    text: het bijwonen van conferenties of seminars;
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.2
  - number: 2.2.3.d
    text: het onderhandelen over zakelijke transacties;
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.2
  - number: 2.2.3.e
    text: het verrichten van verkoop- of marketingactiviteiten;
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.2
  - number: 2.2.3.f
    text: het onderzoeken van bedrijfsopportuniteiten; of
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.2
  - number: 2.2.3.g
    text: het bijwonen en volgen van een opleiding.
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.2
  - number: 2.2.4
    text: |-
      Het verbod is eveneens niet van toepassing met betrekking tot een vreemdeling die 30 dagen of meer in afwachting
      is van de beslissing op een aanvraag voor een Europese blauwe kaart en tevens houder is van een door een andere
      lidstaat van de Europese Unie afgegeven Europese blauwe kaart.
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.2
  - number: 2.2.5
    text: |-
      Het derde lid is van overeenkomstige toepassing op een houder van een door een andere lidstaat van de Europese
      Unie afgegeven verblijfsvergunning voor langdurig ingezetenen met de vermelding «voormalig houder van een Europese
      blauwe kaart».
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.2
  - number: 2.2.6
    text: |-
      Indien tijdens de periode van drie jaar de geldigheidsduur van de afgegeven Europese blauwe kaart wordt verlengd,
      blijft het in het eerste lid, onder b, genoemde bedrag van ten minste € 4.551 per maand van toepassing indien:
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.2
  - number: 2.2.6.a
    text: de eerste periode van drie jaar niet is verstreken, of
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.2
  - number: 2.2.6.b
    text: er na de afgifte van de eerste Europese blauwe kaart nog geen 24 maanden zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.2
  - number: 2.2.7
    text: |-
      De in het eerste lid, onder b genoemde bedragen worden jaarlijks met ingang van 1 januari gewijzigd met het
      percentage waarmee het indexcijfer van de CAO-lonen over de maand oktober daaraan voorafgaand, gepubliceerd door
      het Centraal Bureau voor de Statistiek, afwijkt van het indexcijfer waarop de laatste vaststelling van de bedragen
      is gebaseerd. De gewijzigde bedragen worden door of namens Onze Minister medegedeeld in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.2
  - number: 2.2.8
    text: |-
      Het loon, bedoeld in het eerste lid, aanhef en onder b, wordt door de werkgever over een periode van ten hoogste
      een maand, bijgeschreven op een bankrekening, bestemd voor girale betaling, op naam van de vreemdeling.
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.2
  - number: 2.3.1
    text: |-
      Het verbod is niet van toepassing met betrekking tot een vreemdeling die houder is van een verblijfsvergunning
      voor bepaalde tijd, als bedoeld in [artikel 14 van de Vreemdelingenwet 2000][ref1], verleend onder een beperking
      verband houdend met onderzoek in de zin van [richtlijn (EU) 2016/801](32016L0801) van het Europees Parlement
      en de Raad van 11 mei 2016 betreffende de voorwaarden voor toegang en verblijf van derdelanders met het oog op
      onderzoek, studie, stages, vrijwilligerswerk, scholierenuitwisseling, educatieve projecten of au-pairactiviteiten
      (herschikking) (PbEU 2016, L 132) of een vreemdeling die in het bezit is van een machtiging tot voorlopig
      verblijf die overeenkomt met voornoemd verblijfsdoel, die in Nederland wordt tewerkgesteld bij een krachtens
      [artikel 2c van de Vreemdelingenwet 2000][ref2] als referent erkende onderzoeksinstelling in de zin van die
      richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel2c
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 2c
  - number: 2.3.2
    text: |-
      Het verbod is eveneens niet van toepassing met betrekking tot een vreemdeling die in Nederland verblijft
      op grond van [artikel 3.3, vierde lid, onder a, van het Vreemdelingenbesluit 2000][ref1] en onderwijs
      geeft of onderzoek verricht aan een krachtens [artikel 2c van de Vreemdelingenwet 2000][ref2] als referent
      erkende onderzoeksinstelling die geen universiteit, hogeschool of gelieerde instelling is, bedoeld in
      [artikel 2.4, onder b][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel2c
      [ref3]: https://wetten.overheid.nl/BWBR0046078#Artikel2
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: 2c
      - id: ref3
        bwb_id: BWBR0046078
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.3.3
    text: |-
      Het tweede lid is van overeenkomstige toepassing op een vreemdeling die in afwachting is van de beslissing op een
      aanvraag tot het verlenen van de verblijfsvergunning regulier voor bepaalde tijd voor onderzoek in de zin van de
      richtlijn, bedoeld in het eerste lid, en tevens houder is van een door een andere lidstaat van de Europese Unie
      afgegeven verblijfsvergunning voor onderzoek in de zin van die richtlijn.
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.3
  - number: '2.4'
    text: 'Het verbod is niet van toepassing met betrekking tot een vreemdeling die:'
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.4
  - number: 2.4.a
    text: |-
      met een door of vanwege de Europese Unie, een instituut of instelling voor internationaal onderwijs of onderzoek
      dat door het Ministerie van Onderwijs, Cultuur en Wetenschappen wordt gesubsidieerd, de Nederlandse overheid, of
      een Nederlandse onderwijs- of onderzoeksinstelling verstrekte beurs in Nederland tijdelijk onderzoek verricht voor
      de duur van de beurs en degene die in het kader van een bilaterale of multilaterale overeenkomst waarbij Nederland
      partij is onderzoek verricht voor de duur zoals is bepaald in de bilaterale of multilaterale overeenkomst; of
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.4
  - number: 2.4.b
    text: |-
      onderwijs geeft of onderzoek verricht aan een universiteit, hogeschool of instelling die gelieerd is aan of
      werkzaam is op het terrein van een universiteit, hogeschool of instelling voor hoger internationaal onderwijs.
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.4
  - number: 2.5.1
    text: |-
      Het verbod is niet van toepassing met betrekking tot een vreemdeling die beschikt over
      een verblijfsvergunning regulier onder de beperking in verband met studie als bedoeld in
      [artikel 3.4, eerste lid, van het Vreemdelingenbesluit 2000][ref1] of die rechtmatig verblijf heeft op grond van
      [artikel 8, onder e, van de Vreemdelingenwet 2000][ref2], en arbeid verricht die noodzakelijk is voor het opdoen
      van werkervaring in het kader van een opleiding aan een Academie van Bouwkunst waarbij werk en studie worden
      gecombineerd, mits:


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 2.5.1.a
    text: |-
      de tewerkstelling plaatsvindt op grond van een arbeidsovereenkomst waarin in ieder geval het aantal te werken uren
      per week, de ingangsdatum en duur van het contract en de beloning worden vermeld;
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.5
  - number: 2.5.1.b
    text: een tripartiete overeenkomst wordt gesloten tussen de onderwijsinstelling, de werkgever, en de student;
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.5
  - number: 2.5.1.c
    text: de tripartiete overeenkomst en arbeidsovereenkomst aanwezig is bij de werkgever op de werkplek;
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.5
  - number: 2.5.1.d
    text: de arbeid verricht wordt voor de duur van maximaal 32 uur per week; en
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.5
  - number: 2.5.1.e
    text: de student loon ontvangt dat marktconform is.
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.5
  - number: 2.5.2
    text: |-
      Dit artikel is van toepassing op de instroom van de eerste 50 studenten per studiejaar voor de Academies van
      Bouwkunst gezamenlijk, die niet de nationaliteit bezitten van een staat die partij is bij het Verdrag betreffende
      de werking van de Europese Unie of bij de Overeenkomst betreffende de Europese Economische Ruimte, dan wel van
      Zwitserland.
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.5
  - number: 2.6.1
    text: |-
      Het verbod is niet van toepassing met betrekking tot een vreemdeling, voor zover die arbeid verricht in het kader
      van een overplaatsing binnen een onderneming, indien hij:
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.6
  - number: 2.6.1.a
    text: |-
      houder is van de verblijfsvergunning regulier voor bepaalde tijd, verleend onder de beperking «overplaatsing binnen
      een onderneming» in de zin van [artikel 3.30d van het Vreemdelingenbesluit 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
  - number: 2.6.1.b
    text: |-
      ten hoogste 90 dagen in Nederland verblijft op grond van
      [artikel 3.3, eerste lid, onder c, Vreemdelingenbesluit 2000][ref1] en houder is van een door een andere lidstaat
      van de Europese Unie afgegeven verblijfsvergunning met de vermelding «ICT», die is afgegeven ter uitvoering van
      [richtlijn 2014/66](32014L0066)/EU van het Europees Parlement en de Raad van 15 mei 2014 betreffende de voorwaarden
      voor toegang en verblijf van onderdanen van derde landen in het kader van een overplaatsing binnen een onderneming
      (PbEU 2014, L 157); of


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
  - number: 2.6.1.c
    text: |-
      in afwachting is van de beslissing op een aanvraag tot het verlenen van de onder a bedoelde verblijfsvergunning en
      tevens houder is van de onder b bedoelde door een andere lidstaat afgegeven verblijfsvergunning.
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.6
  - number: 2.6.2
    text: |-
      Het verbod is eveneens niet van toepassing met betrekking tot een vreemdeling die arbeid verricht als bedoeld in
      het eerste lid, en daarnaast arbeid als zelfstandige verricht.
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.6
  - number: 2.7.1
    text: |-
      Het verbod is niet van toepassing met betrekking tot een vreemdeling die op basis van een arbeidsovereenkomst
      werkzaamheden verricht voor een onderneming die naar het oordeel van onze Minister van Justitie en Veiligheid
      startend en innovatief is met schaalbare bedrijfsactiviteiten, en:
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.7
  - number: 2.7.1.a
    text: |-
      van wie het overeengekomen vaste, naar tijdruimte en in geld vastgestelde loon als vergoeding voor zijn arbeid dat
      hij van de werkgever ontvangt, ten minste € 2.989 bruto per maand bedraagt, waartoe niet wordt gerekend de door de
      werkgever te betalen vakantiebijslag; en
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.7
  - number: 2.7.1.b
    text: |-
      die een medewerkersparticipatie van een door Onze Minister van Justitie en Veiligheid in overeenstemming met Onze
      Minister van Economische Zaken en Klimaat bij ministeriële regeling vast te stellen percentage in de onderneming,
      bedoeld in het eerste lid, aanhef, ontvangt.
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.7
  - number: 2.7.2
    text: |-
      De beoordeling of sprake is van een onderneming als bedoeld in het eerste lid geschiedt aan de hand van
      een door Onze Minister van Justitie en Veiligheid bij ministeriële regeling in overeenstemming met Onze
      Minister van Economische Zaken en Klimaat vastgesteld toetsingskader. Er is in ieder geval geen sprake
      van een onderneming als bedoeld in het eerste lid indien de onderneming op het moment van de beoordeling
      arbeid laat verrichten door meer dan vijftien werknemers, die krachtens arbeidsovereenkomst als bedoeld in
      [artikel 610 van Boek 7 van het Burgerlijk Wetboek][ref1] werkzaam zijn. De beoordeling heeft een geldigheidsduur
      van drie jaar na ingang van de eerste verblijfsvergunning ten behoeve van werkzaamheden in het kader van dit
      artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel610
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '610'
  - number: 2.7.3
    text: |-
      Bij ministeriële regeling, bedoeld in het eerste lid, onder b, worden nadere regels gesteld over de
      medewerkersparticipatie.
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.7
  - number: 2.7.4
    text: |-
      Dit artikel is van toepassing op ten hoogste vijf vreemdelingen die werkzaamheden verrichten voor de onderneming,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.7
  - number: 2.7.5
    text: |-
      Het in het eerste lid, onder a, genoemde bedrag wordt jaarlijks met ingang van 1 januari gewijzigd met het
      percentage waarmee het indexcijfer van de CAO-lonen over de maand oktober daaraan voorafgaand, gepubliceerd door
      het Centraal Bureau voor de Statistiek, afwijkt van het indexcijfer waarop de laatste vaststelling van de bedragen
      is gebaseerd. De gewijzigde bedragen worden door of namens Onze Minister medegedeeld in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.7
  - number: 2.7.6
    text: |-
      Het loon, bedoeld in het eerste lid, aanhef en onder a, wordt door de werkgever over een periode van ten hoogste
      een maand, bijgeschreven op een bankrekening, bestemd voor girale betaling, op naam van de vreemdeling.
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel2.7
