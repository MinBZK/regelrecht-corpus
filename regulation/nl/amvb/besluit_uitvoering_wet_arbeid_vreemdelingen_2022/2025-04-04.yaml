  - number: '7.4'
    text: |-
      Een aantekening als bedoeld in [artikel 4, eerste lid, van de wet][ref1] wordt afgegeven aan een
      vreemdeling die beschikt over een verblijfsvergunning regulier voor bepaalde tijd onder de beperking
      «het zoeken naar en verrichten van arbeid al dan niet in loondienst» die is verleend op grond van
      [artikel 3.42 van het Vreemdelingenbesluit 2000][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel7.4
