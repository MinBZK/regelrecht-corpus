  - number: '7.7'
    text: |-
      Een aantekening als bedoeld in [artikel 4, eerste lid, van de wet][ref1] wordt afgegeven aan een vreemdeling die
      rechtmatig in Nederland verblijft in de zin van [artikel 8, onder a, van de Vreemdelingenwet 2000][ref2], onder de
      beperking «het afwachten van een verzoek op grond van [artikel 17 van de Rijkswet op het Nederlanderschap][ref3]»,
      genoemd in [artikel 3.4, eerste lid, van het Vreemdelingenbesluit 2000][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003738#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0011825#Artikel3
