    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel5.2
  - number: '6.1'
    text: |-
      Het verbod is niet van toepassing met betrekking tot een vreemdeling, die beschikt over een vergunning tot verblijf
      op grond van [artikel 28 van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
  - number: 6.2.1
    text: |-
      In afwijking van [artikel 8, eerste lid, onderdelen a, b, e en g, van de wet][ref1] mag een vreemdeling als bedoeld
      in artikel 8, tweede lid, van die wet arbeid verrichten indien:


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel8
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '8'
  - number: 6.2.1.a
    text: |-
      die vreemdeling een verblijfsvergunning voor bepaalde tijd, bedoeld in
      [artikel 28 van de Vreemdelingenwet 2000][ref1], heeft aangevraagd en welke aanvraag blijkens een verklaring
      van Onze Minister van Justitie en Veiligheid ten minste zes maanden in behandeling is, aanspraken op
      voorzieningen geniet voorzien bij of krachtens de [Wet Centraal Orgaan opvang asielzoekers][ref2] of
      een ander wettelijk voorschrift dat aanspraken op voorzieningen regelt en de vreemdeling op basis van
      [artikel 8, onderdelen f of h, van de Vreemdelingenwet 2000][ref3] rechtmatig in Nederland verblijft;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0006685
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0006685
      - id: ref3
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 6.2.1.b
    text: |-
      de vreemdeling, bedoeld in onderdeel a, de in de vergunningsaanvraag aangegeven werkzaamheden onder marktconforme
      voorwaarden zal verrichten; en
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel6.2
  - number: 6.2.1.c
    text: |-
      de vreemdeling, bedoeld in onderdeel a, binnen een tijdsbestek van 52 weken vanaf de aanvang van de werkzaamheden
      een arbeidsperiode van in totaal 24 weken, waarin ten hoogste een arbeidsperiode van 14 weken is gelegen waarin
      werkzaamheden worden verricht als artiest, musicus, filmmedewerker of in de vorm van technische ondersteuning van
      optredens van een artiest of musicus, niet overschrijdt.
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel6.2
  - number: 6.2.2
    text: Bij ministeriële regeling worden nadere regels gesteld met betrekking tot het eerste lid, onder a.
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel6.2
  - number: '6.3'
    text: |-
      Het verbod is niet van toepassing met betrekking tot een vreemdeling van wie de krachtens de
      [Vreemdelingenwet 2000][ref1] afgegeven vergunning met daarop de aantekening, bedoeld in artikel 4, eerste lid, van
      de wet, is ingetrokken en die met instemming van Onze Minister van Justitie en Veiligheid in Nederland verblijft en
      beschikt over een geldige sticker in het paspoort met de aantekening «arbeid is vrij toegestaan».


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: '6.4'
    text: 'Het verbod is niet van toepassing met betrekking tot een vreemdeling:'
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel6.4
  - number: 6.4.a
    text: |-
      die in afwachting is van de beslissing op een aanvraag tot het verlengen van de geldigheidsduur van de
      gecombineerde vergunning voor dezelfde werkzaamheden bij dezelfde werkgever;
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel6.4
  - number: 6.4.b
    text: |-
      van wie de aanvraag is ontvangen uiterlijk op de dag voor de dag waarop de geldigheidsduur van de gecombineerde
      vergunning verstrijkt, dan wel, indien deze later is ontvangen, indien de termijnoverschrijding de vreemdeling niet
      kan worden toegerekend;
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel6.4
  - number: 6.4.c
    text: |-
      die dezelfde werkzaamheden verricht bij dezelfde werkgever als waarvoor de vreemdeling reeds voor de
      verlengingsaanvraag in het bezit is gesteld van een gecombineerde vergunning; en
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel6.4
  - number: 6.4.d
    text: |-
      die beschikt over een door Onze Minister van Justitie en Veiligheid afgegeven geldige sticker in het paspoort met
      de aantekening «TWV niet vereist voor specifieke arbeid, andere arbeid toegestaan mits TWV is verleend».
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel6.4
  - number: 6.5.1
    text: |-
      Het verbod is niet van toepassing met betrekking tot de vreemdeling, bedoeld in
      [artikel 3.1a, eerste lid, aanhef en onderdelen a tot en met e, van het Vreemdelingenbesluit 2000][ref1], die in
      Nederland wordt tewerkgesteld op basis van een arbeidsovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel6.5
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
  - number: 6.5.2
    text: |-
      Bij ministeriële regeling kan worden bepaald dat het verbod eveneens niet van toepassing is op de vreemdeling,
      bedoeld in het eerste lid, die als zelfstandige arbeid verricht, en kunnen regels worden gesteld omtrent de
      omstandigheden waaronder dit verbod niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel6.5
  - number: '7.1'
    text: |-
      Een aantekening als bedoeld in [artikel 4, eerste lid, van de wet][ref1] wordt afgegeven aan:


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel4
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '4'
  - number: 7.1.a
    text: |-
      een vreemdeling die beschikt over een verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 14 van de Vreemdelingenwet 2000][ref1], onder een beperking verband houdend met verblijf als familie- of
      gezinslid van:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
  - number: 7.1.a.1°
    text: |-
      een kennismigrant als bedoeld in [artikel 3.4, eerste lid, van het Vreemdelingenbesluit 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
  - number: 7.1.a.2°
    text: |-
      een houder van een door Onze Minister van Justitie en Veiligheid afgegeven Europese blauwe kaart als bedoeld in
      [artikel 2.2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0046078#Artikel2
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0046078
        artikel: '2'
        hoofdstuk: '2'
  - number: 7.1.a.3°
    text: |-
      een houder van een verblijfsvergunning voor langdurig ingezetene met de vermelding «voormalig houder van een
      Europese blauwe kaart»;
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel7.1
  - number: 7.1.a.4°
    text: |-
      een houder van de verblijfsvergunning regulier voor bepaalde tijd, verleend onder de beperking «overplaatsing
      binnen een onderneming» op grond van [artikel 3.30d van het Vreemdelingenbesluit 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
  - number: 7.1.a.5°
    text: |-
      een zelfstandige als bedoeld in [artikel 3.4, eerste lid, van het Vreemdelingenbesluit 2000][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0011825
        artikel: '3'
  - number: 7.1.a.6°
    text: |-
      een vreemdeling als bedoeld in [artikel 2.7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0046078#Artikel2
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0046078
        artikel: '2'
        hoofdstuk: '2'
  - number: 7.1.b
    text: |-
      een vreemdeling die rechtmatig in Nederland verblijft, in de zin van
      [artikel 8, onder a, van de Vreemdelingenwet 2000][ref1], en is toegelaten voor verblijf bij:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 7.1.b.1°
    text: |-
      een in Nederland woonachtige Nederlander of gemeenschapsonderdaan die rechtmatig in Nederland verblijft, in de zin
      van [artikel 8, onder e, van de Vreemdelingenwet 2000][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 7.1.b.2°
    text: |-
      een vreemdeling aan wie een aantekening als bedoeld in [artikel 4, eerste lid, van de wet][ref1], is afgegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel4
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0007149
        artikel: '4'
  - number: 7.1.c
    text: |-
      een vreemdeling die beschikt over een verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 14 van de Vreemdelingenwet 2000][ref1], onder een beperking verband houdend met verblijf als familie- of
      gezinslid van een vreemdeling die is toegelaten onder een beperking verband houdend met onderzoek als bedoeld in
      [artikel 3.4, eerste lid, van het Vreemdelingenbesluit 2000][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011825#Artikel3
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0011825
        artikel: '3'
  - number: 7.1.d
    text: |-
      de afhankelijke gezinsleden van de in [artikel 7.5][ref1] genoemde vreemdelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0046078#Artikel7
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0046078
        artikel: '7'
        hoofdstuk: '7'
  - number: '7.2'
    text: |-
      Een aantekening als bedoeld in [artikel 4, eerste lid, van de wet][ref1] wordt afgegeven aan een vreemdeling, met
      uitzondering van de vreemdeling, genoemd in de [artikelen 7.1, onder a][ref2], en [7.4][ref3], die in het verleden
      heeft beschikt over een krachtens de [Vreemdelingenwet of Vreemdelingenwet 2000][ref4] afgegeven vergunning met
      daarop een aantekening als bedoeld in [artikel 4, eerste lid, van de wet][ref5], die is afgegeven op grond van het
      tweede lid van dat artikel en die nadien zijn hoofdverblijf niet buiten Nederland heeft gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0046078#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0046078#Artikel7
