  - number: '7.3'
    text: |-
      Een aantekening als bedoeld in [artikel 4, eerste lid, van de wet][ref1] wordt afgegeven aan een vreemdeling
      die rechtmatig in Nederland verblijft, in de zin van [artikel 8, onder a, van de Vreemdelingenwet 2000][ref2],
      indien de vreemdeling gedurende ononderbroken periode van zeven jaar direct voorafgaande aan de
      vergunning tot verblijf werkzaam is geweest op zeeschepen die onder Nederlandse vlag varen en in
      Nederland zijn geregistreerd of op mijnbouwinstallaties op het continentaal plat als bedoeld in
      [artikel 1, onderdelen o en c, van de Mijnbouwwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007149#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0014168#Artikel1
    url: https://wetten.overheid.nl/BWBR0046078/2025-04-04#Artikel7.3
