$id: warenwetbesluit_verpakkingen_en_gebruiksartikelen
regulatory_layer: AMVB
publication_date: '2021-06-30'
valid_from: '2021-07-01'
bwb_id: BWBR0018370
url: https://wetten.overheid.nl/BWBR0018370/2021-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volksgezondheid, Welzijn en Sport van 14 maart 2005, VGP/P&L 2566277,
    gedaan in overeenstemming met Onze Ministers van Landbouw, Natuur en Voedselkwaliteit, van Economische Zaken en
    van Justitie;

    Gelet op:

    – verordening (EG) nr. 1935/2004 van het Europees Parlement en de Raad van de Europese Unie van 27 oktober 2004
    inzake materialen en voorwerpen bestemd om met levensmiddelen in contact te komen en houdende intrekking van de
    richtlijnen 80/590/EEG en 89/109/EEG (PbEU L 338);

    – artikel 1, 4, eerste lid, 8, eerste lid, onder c, 13, onder a, en 32b van de Warenwet;

    De Raad van State gehoord (advies van 6 april 2005, nr. W13.05.0080/III);

    Gezien het nader rapport van Onze Minister van Volksgezondheid, Welzijn en Sport van 20 mei 2005, VGP/P&L 2584706,
    uitgebracht in overeenstemming met Onze Ministers van Landbouw, Natuur en Voedselkwaliteit, van Economische Zaken
    en van Justitie;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0018370/2021-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: In dit besluit en de daarop berustende bepalingen wordt verstaan onder
    url: https://wetten.overheid.nl/BWBR0018370/2021-07-01#Artikel1
  - number: 1.a
    text: 'verpakking: artikel dat'
    url: https://wetten.overheid.nl/BWBR0018370/2021-07-01#Artikel1
  - number: 1.a.1°
    text: |-
      wordt gebruikt voor het verpakken, het anderszins geheel of gedeeltelijk omhullen dan wel het op enige wijze
      aanbieden van eet- of drinkwaren, hetzij in rechtstreekse aanraking met die waren, hetzij zodanig dat onder normale
      omstandigheden stoffen aan die waren kunnen worden afgegeven;
    url: https://wetten.overheid.nl/BWBR0018370/2021-07-01#Artikel1
  - number: 1.a.2°
    text: is bestemd voor gebruik overeenkomstig het onder 1° bepaalde; of
    url: https://wetten.overheid.nl/BWBR0018370/2021-07-01#Artikel1
  - number: 1.a.3°
    text: |-
      redelijkerwijs kan worden geacht bij normaal of te verwachten gebruik met levensmiddelen in contact te komen of aan
      levensmiddelen hun bestanddelen af te geven;
    url: https://wetten.overheid.nl/BWBR0018370/2021-07-01#Artikel1
  - number: 1.b
    text: 'gebruiksartikel: technisch voortbrengsel dat'
    url: https://wetten.overheid.nl/BWBR0018370/2021-07-01#Artikel1
  - number: 1.b.1°
    text: wordt gebruikt in rechtstreekse aanraking met eet- of drinkwaren;
    url: https://wetten.overheid.nl/BWBR0018370/2021-07-01#Artikel1
  - number: 1.b.2°
    text: is bestemd voor gebruik overeenkomstig het onder 1° bepaalde; of
    url: https://wetten.overheid.nl/BWBR0018370/2021-07-01#Artikel1
  - number: 1.b.3°
    text: |-
      redelijkerwijs kan worden geacht bij normaal of te verwachten gebruik met levensmiddelen in contact te komen of aan
      levensmiddelen hun bestanddelen af te geven;
    url: https://wetten.overheid.nl/BWBR0018370/2021-07-01#Artikel1
  - number: 1.c
    text: |-
      [verordening (EG) 1935/2004](32004R1935): [verordening (EG) nr. 1935/2004](32004R1935) van het Europees Parlement
      en de Raad van de Europese Unie van 27 oktober 2004 inzake materialen en voorwerpen bestemd om met levensmiddelen
      in contact te komen en houdende intrekking van de [richtlijnen 80/590/EEG](31980L0590) en [89/109/EEG](31989L0109)
      (PbEU L 338);
    url: https://wetten.overheid.nl/BWBR0018370/2021-07-01#Artikel1
  - number: 1.d
    text: |-
      verordening (EU) 284/2011: verordening (EU) nr. 284/2011 van de Commissie van 22 maart 2011 tot vaststelling
      van specifieke voorwaarden en gedetailleerde procedures voor de invoer van keukengerei van polyamide- of
      melaminekunststof van oorsprong of verzonden uit de Volksrepubliek China en de Speciale Administratieve Regio
      Hongkong van de Volksrepubliek China (PbEU 2011, L 77).
    url: https://wetten.overheid.nl/BWBR0018370/2021-07-01#Artikel1
  - number: '2.1'
    text: |-
      Het is verboden te handelen in strijd met [artikel 3, eerste lid][ref1], en [artikel 5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018370#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018370#Artikel5
    url: https://wetten.overheid.nl/BWBR0018370/2021-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0018370
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0018370
        artikel: '5'
  - number: '2.2'
    text: |-
      Het is verboden te handelen in strijd met de krachtens [artikel 4, eerste lid][ref1], gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0018370#Artikel4
    url: https://wetten.overheid.nl/BWBR0018370/2021-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0018370
        artikel: '4'
  - number: '2.3'
    text: |-
      Het is verboden te handelen in strijd met de bij artikel 3, eerste en tweede lid, artikel 4, tweede tot en met
      zesde lid, artikel 15, eerste, derde, vierde, zevende, achtste en negende lid, artikel 17 en de krachtens artikel
      5, eerste lid, van verordening (EG) 1935/2004 gestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0018370/2021-07-01#Artikel2
  - number: '2.4'
    text: |-
      Het is verboden te handelen in strijd met de bij artikel 3, eerste en derde lid, 4 en 8 van verordening (EU)
      284/2011 gestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0018370/2021-07-01#Artikel2
  - number: '3.1'
    text: 'Een verpakking of gebruiksartikel:'
    url: https://wetten.overheid.nl/BWBR0018370/2021-07-01#Artikel3
  - number: 3.1.a
    text: |-
      is vervaardigd uit materialen die op grond van hun uit het oogpunt van volksgezondheid goede hoedanigheid zijn
      aangewezen door Onze Minister zulks onder het stellen van regels omtrent de stoffen, waaruit die materialen zijn
      vervaardigd;
    url: https://wetten.overheid.nl/BWBR0018370/2021-07-01#Artikel3
  - number: 3.1.b
    text: |-
      is niet zodanig vervaardigd, dat die verpakking of dat gebruiksartikel uit het oogpunt van volksgezondheid gevaar
      oplevert of kan opleveren; en
    url: https://wetten.overheid.nl/BWBR0018370/2021-07-01#Artikel3
  - number: 3.1.c
    text: bevindt zich in zindelijke staat.
    url: https://wetten.overheid.nl/BWBR0018370/2021-07-01#Artikel3
  - number: '3.2'
    text: |-
      Stoffen, afkomstig van materialen als bedoeld in het eerste lid, onder a, worden niet gerekend tot de in eet-
      of drinkwaren aanwezige stoffen voor zover deze aan die waren zijn afgegeven door een verpakking bedoeld in
      [artikel 1, onder a, 1°][ref1], of een gebruiksartikel, bedoeld in artikel 1, onder b, 1°.


      [ref1]: https://wetten.overheid.nl/BWBR0018370#Artikel1
    url: https://wetten.overheid.nl/BWBR0018370/2021-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0018370
        artikel: '1'
  - number: '4.1'
    text: |-
      Onze Minister kan regels stellen met betrekking tot de afgifte van bestanddelen van materialen en voorwerpen die: -
      een gevaar voor de gezondheid van de mens kunnen opleveren;
        - tot een onaanvaardbare wijziging in de samenstelling van de levensmiddelen kunnen leiden; of
        - tot een aantasting van de organoleptische eigenschappen ervan kunnen leiden.
    url: https://wetten.overheid.nl/BWBR0018370/2021-07-01#Artikel4
  - number: '4.2'
    text: |-
      Voor de beoordeling of de waren, als bedoeld in dit besluit, voldoen aan de bij of krachtens dit besluit gestelde
      eisen moet worden gebruik gemaakt van de ter zake door Onze Minister vastgestelde onderzoekingsmethoden.
    url: https://wetten.overheid.nl/BWBR0018370/2021-07-01#Artikel4
  - number: '5.1'
    text: |-
      Verpakkingen of gebruiksartikelen zijn, indien bij het gebruik daarvan bijzondere voorwaarden in acht moeten worden
      genomen, voorzien van een gebruiksaanwijzing, gesteld in de Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0018370/2021-07-01#Artikel5
  - number: '5.2'
    text: |-
      De vermeldingen, bedoeld in artikel 15, vijfde lid, van [verordening (EG) 1935/2004](32004R1935), geschieden in de
      Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0018370/2021-07-01#Artikel5
  - number: '6'
    text: |-
      Als nationale bevoegde autoriteit, bedoeld in artikel 13 van [verordening (EG) 1935/2004](32004R1935), wordt
      aangewezen Onze Minister van Volksgezondheid, Welzijn en Sport.
    url: https://wetten.overheid.nl/BWBR0018370/2021-07-01#Artikel6
  - number: '7'
    text: Dit besluit is niet van toepassing op
    url: https://wetten.overheid.nl/BWBR0018370/2021-07-01#Artikel7
  - number: 7.a
    text: verpakkingen uitsluitend bestaande uit eetwaar;
    url: https://wetten.overheid.nl/BWBR0018370/2021-07-01#Artikel7
  - number: 7.b
    text: op de korst van kaas aangebrachte bedekkingsmiddelen die niet van de korst kunnen worden gescheiden;
    url: https://wetten.overheid.nl/BWBR0018370/2021-07-01#Artikel7
  - number: 7.c
    text: op vleeswaren of fruit aangebrachte bedekkingsmiddelen die niet hiervan kunnen worden gescheiden;
    url: https://wetten.overheid.nl/BWBR0018370/2021-07-01#Artikel7
  - number: 7.d
    text: natuurprodukten die als zodanig worden gebruikt als verpakking of bestemd zijn voor dat gebruik;
    url: https://wetten.overheid.nl/BWBR0018370/2021-07-01#Artikel7
  - number: 7.e
    text: antiquiteiten.
    url: https://wetten.overheid.nl/BWBR0018370/2021-07-01#Artikel7
  - number: '8'
    text: |-
      Na de inwerkingtreding van dit besluit, berust de [Regeling Verpakkingen- en gebruiksartikelen (Warenwet)][ref1] op
      [artikel 3, eerste lid, onder a][ref2] en [artikel 4][ref3] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0003276
      [ref2]: https://wetten.overheid.nl/BWBR0018370#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0018370#Artikel4
    url: https://wetten.overheid.nl/BWBR0018370/2021-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003276
      - id: ref2
        bwb_id: BWBR0018370
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0018370
        artikel: '4'
  - number: '12'
    text: |-
      Het [Verpakkingen- en gebruiksartikelenbesluit (Warenwet)][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0003267
    url: https://wetten.overheid.nl/BWBR0018370/2021-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003267
  - number: '13'
    text: |-
      Dit besluit treedt in werking met ingang van de eerste dag na de datum van uitgifte van het Staatsblad waarin het
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0018370/2021-07-01#Artikel13
  - number: '14'
    text: 'Dit besluit wordt aangehaald als: Warenwetbesluit verpakkingen en gebruiksartikelen.'
    url: https://wetten.overheid.nl/BWBR0018370/2021-07-01#Artikel14
