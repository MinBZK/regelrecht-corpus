preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 9 maart 2007, nr.
    DJZ2007015932, Directie Juridische Zaken, Afdeling Wetgeving;

    Gelet op artikel 5.16, vierde lid, van de Wet milieubeheer;

    De Raad van State gehoord (advies van 4 mei 2007, no. W08.07.0061/IV);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 26
    oktober 2007, nr. DJZ2007104761, Directie Juridische Zaken, Afdeling Wetgeving;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0022815/2007-11-15#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In dit besluit en de daarop berustend bepalingen wordt verstaan onder: *3% grens:* 3% van de grenswaarde voor de
      jaargemiddelde concentratie van zwevende deeltjes (PM) of stikstofdioxide; *bedrijfslocatie:* locatie, bestemd
      voor de vestiging van twee of meer inrichtingen, met inbegrip van de bijbehorende ontsluitingsinfrastructuur en
      eventuele bedrijfswoningen; *infrastructuur:* voor het openbaar verkeer openstaande weg, spoorweg of vaarweg, met
      inbegrip van de daarin liggende bruggen en duikers en de daartoe behorende paden en bermen of zijkanten alsmede
      de werken of bouwwerken die met die weg, spoorweg of vaarweg zijn verbonden en dienen voor de instandhouding
      dan wel het veilig en doelmatig gebruik daarvan; *kantoorlocatie:* locatie, bestemd voor de bouw van een of meer
      kantoorgebouwen, met inbegrip van de bijbehorende ontsluitingsinfrastructuur; *niet in betekenende mate bijdragen:*
      niet in betekenende mate bijdragen als bedoeld in [artikel 5.16, eerste lid, onder c, van de wet][ref1];
      *ontsluitingsinfrastructuur:* infrastructuur, voor zover deze geheel of hoofdzakelijk wordt of zal worden
      gebruikt voor de ontsluiting van een bedrijfslocatie, inrichting, kantoorlocatie, woningbouwlocatie of
      andere locatie; *tijdelijke 1% grens:* 1% van de grenswaarde voor de jaargemiddelde concentratie van
      zwevende deeltjes (PM) of stikstofdioxide; *uitoefening van een bevoegdheid of toepassing van een wettelijk
      voorschrift:* uitoefening van een bevoegdheid of toepassing van een wettelijk voorschrift als bedoeld
      in [artikel 5.16, eerste lid, aanhef en onder c, van de wet][ref2]; *wet:* [Wet milieubeheer][ref3];
      *woningbouwlocatie:* locatie, bestemd voor woningbouw, met inbegrip van de bijbehorende ontsluitingsinfrastructuur.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0022815/2007-11-15#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0003245
  - number: '1.2'
    text: |-
      Dit besluit is uitsluitend van toepassing voor zover de uitoefening van een bevoegdheid of toepassing van een
      wettelijk voorschrift:
    url: https://wetten.overheid.nl/BWBR0022815/2007-11-15#Artikel1
  - number: 1.2.a
    text: |-
      betrekking heeft op een bedrijfslocatie, inrichting, infrastructuur, kantoorlocatie, woningbouwlocatie dan wel
      andere locatie, handeling of activiteit die nieuw is dan wel voor zover daarbij een uitbreiding of wijziging wordt
      gerealiseerd, en
    url: https://wetten.overheid.nl/BWBR0022815/2007-11-15#Artikel1
  - number: 1.2.b
    text: plaatsvindt na de inwerkingtreding van dit besluit.
    url: https://wetten.overheid.nl/BWBR0022815/2007-11-15#Artikel1
  - number: '1.3'
    text: |-
      Voor de toepassing van dit besluit en de daarop berustende bepalingen wordt onder «inrichting» mede begrepen de
      bijbehorende ontsluitingsinfrastructuur en eventuele bedrijfswoningen.
    url: https://wetten.overheid.nl/BWBR0022815/2007-11-15#Artikel1
  - number: '2.1'
    text: |-
      Met ingang van het tijdstip dat een programma als bedoeld in [artikel 5.12, eerste lid, van de wet][ref1], voor
      de eerste maal is vastgesteld, draagt de uitoefening van een of meer bevoegdheden of de toepassing van een of
      meer wettelijke voorschriften niet in betekenende mate bij indien aannemelijk is gemaakt dat, als gevolg van die
      uitoefening of toepassing, de toename van de concentraties in de buitenlucht van zowel zwevende deeltjes (PM) als
      stikstofdioxide niet de 3% grens overschrijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5
    url: https://wetten.overheid.nl/BWBR0022815/2007-11-15#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '5'
  - number: '2.2'
    text: |-
      Tot het tijdstip, bedoeld in het eerste lid, draagt de uitoefening van een of meer bevoegdheden of de toepassing
      van een of meer wettelijke voorschriften niet in betekenende mate bij indien aannemelijk is gemaakt dat, als gevolg
      van die uitoefening of toepassing, de toename van de concentraties in de buitenlucht van zowel zwevende deeltjes
      (PM) als stikstofdioxide niet de tijdelijke 1% grens overschrijdt.
    url: https://wetten.overheid.nl/BWBR0022815/2007-11-15#Artikel2
  - number: '3.1'
    text: |-
      In gevallen waarin een uitoefening of toepassing als bedoeld in [artikel 2][ref1] betrekking heeft op een
      bedrijfslocatie, worden bij het bepalen van de toename, bedoeld in [dat artikel][ref2], in beschouwing genomen
      de concentraties afkomstig van zowel het gemotoriseerde verkeer van en naar die bedrijfslocatie, als van de daar
      redelijkerwijs te verwachten inrichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0022815#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022815#Artikel2
    url: https://wetten.overheid.nl/BWBR0022815/2007-11-15#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0022815
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0022815
        artikel: '2'
  - number: '3.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing in gevallen waarin een uitoefening of toepassing als bedoeld in
      [artikel 2][ref1] betrekking heeft op een inrichting, met dien verstande dat in dat geval voor «bedrijfslocatie»
      wordt gelezen «inrichting» en voor «de daar redelijkerwijs te verwachten inrichtingen»: die inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0022815#Artikel2
    url: https://wetten.overheid.nl/BWBR0022815/2007-11-15#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0022815
        artikel: '2'
  - number: '3.3'
    text: |-
      In andere gevallen dan bedoeld in het eerste of tweede lid worden bij het bepalen van de toename in beschouwing
      genomen de concentraties afkomstig van het gemotoriseerde verkeer van en naar de betreffende locatie, activiteit of
      handeling dan wel afkomstig van het gemotoriseerde verkeer op of in de betreffende infrastructuur.
    url: https://wetten.overheid.nl/BWBR0022815/2007-11-15#Artikel3
  - number: '4.1'
    text: |-
      Bij ministeriële regeling kunnen categorieën van gevallen worden aangewezen, waarin de uitoefening van een of
      meer bevoegdheden of toepassing van een of meer wettelijke voorschriften in ieder geval niet in betekenende mate
      bijdraagt.
    url: https://wetten.overheid.nl/BWBR0022815/2007-11-15#Artikel4
  - number: '4.2'
    text: |-
      De aanwijzing, bedoeld in het eerste lid, kan onder meer betrekking hebben op de uitoefening van een of meer
      bevoegdheden of toepassing van een of meer wettelijke voorschriften met betrekking tot een of meer daarbij genoemde
      categorieën van:
    url: https://wetten.overheid.nl/BWBR0022815/2007-11-15#Artikel4
  - number: 4.2.a
    text: inrichtingen;
    url: https://wetten.overheid.nl/BWBR0022815/2007-11-15#Artikel4
  - number: 4.2.b
    text: infrastructuur;
    url: https://wetten.overheid.nl/BWBR0022815/2007-11-15#Artikel4
  - number: 4.2.c
    text: kantoorlocaties;
    url: https://wetten.overheid.nl/BWBR0022815/2007-11-15#Artikel4
  - number: 4.2.d
    text: woningbouwlocaties.
    url: https://wetten.overheid.nl/BWBR0022815/2007-11-15#Artikel4
  - number: '4.3'
    text: |-
      Bij de aanwijzing, bedoeld in het eerste lid, kunnen voor daarbij genoemde categorieën van gevallen nadere
      begrenzingen worden gegeven en kan de aanwijzing afhankelijk worden gesteld van de aanwezigheid van daarbij
      genoemde voorzieningen of de uitvoering van daarbij genoemde maatregelen ter verbetering van de luchtkwaliteit, dan
      wel van daarbij genoemde omstandigheden of voorwaarden.
    url: https://wetten.overheid.nl/BWBR0022815/2007-11-15#Artikel4
  - number: '4.4'
    text: |-
      Ten aanzien van de vaststelling van een ministeriële regeling als bedoeld in het eerste lid zijn de
      [artikelen 2][ref1] en [3][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022815#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0022815#Artikel3
    url: https://wetten.overheid.nl/BWBR0022815/2007-11-15#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0022815
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0022815
        artikel: '3'
  - number: '5'
    text: |-
      Bedrijfslocaties, kantoorlocaties, woningbouwlocaties, locaties voor inrichtingen en locaties voor infrastructuur
      ten aanzien waarvan redelijkerwijs voorzienbaar is dat deze met toepassing van dit besluit worden of zullen worden
      gerealiseerd gedurende de periode, waar het programma, bedoeld in [artikel 5.12, eerste lid, van de wet][ref1],
      betrekking op heeft, worden voor de toepassing van dit besluit en de daarop berustende bepalingen als één locatie
      beschouwd, voor zover die locaties:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5
    url: https://wetten.overheid.nl/BWBR0022815/2007-11-15#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '5'
  - number: 5.a
    text: gebruikmaken of zullen maken van dezelfde ontsluitingsinfrastructuur, en
    url: https://wetten.overheid.nl/BWBR0022815/2007-11-15#Artikel5
  - number: 5.b
    text: |-
      aan elkaar grenzen of zullen grenzen dan wel in elkaars directe nabijheid zijn gelegen of zullen zijn gelegen, tot
      een afstand van ten hoogste 1000 meter vanaf de grens van de betreffende locatie of inrichting, met dien verstande
      dat locaties en inrichtingen buiten beschouwing blijven voor zover de toename van de concentraties ter plaatse niet
      meer bedraagt dan 0,1 microgram/m3.
    url: https://wetten.overheid.nl/BWBR0022815/2007-11-15#Artikel5
  - number: '6.1'
    text: |-
      Bij ministeriële regeling kunnen, indien noodzakelijk voor een goede uitvoering van [artikel 1, tweede lid][ref1],
      [2][ref2], [3][ref3] of [5][ref4], nadere regels worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0022815#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0022815#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0022815#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0022815#Artikel5
    url: https://wetten.overheid.nl/BWBR0022815/2007-11-15#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0022815
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0022815
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0022815
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0022815
        artikel: '5'
  - number: '6.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden gegeven als bedoeld in
      [artikel 5.15, eerste lid, onder a, b of c, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5
    url: https://wetten.overheid.nl/BWBR0022815/2007-11-15#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '5'
  - number: '7'
    text: |-
      Dit besluit treedt in werking op het tijdstip waarop de
      [Wet tot wijziging van de Wet milieubeheer (luchtkwaliteitseisen)][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0022750
    url: https://wetten.overheid.nl/BWBR0022815/2007-11-15#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0022750
  - number: '8'
    text: 'Dit besluit wordt aangehaald als: Besluit niet in betekenende mate bijdragen (luchtkwaliteitseisen).'
    url: https://wetten.overheid.nl/BWBR0022815/2007-11-15#Artikel8
