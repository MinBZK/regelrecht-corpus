---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_borgstelling_scheepsnieuwbouw
regulatory_layer: AMVB
publication_date: '2008-12-09'
valid_from: '2007-01-01'
bwb_id: BWBR0019103
url: https://wetten.overheid.nl/BWBR0019103/2007-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Economische Zaken van 25 april 2005, nr. WJZ 5022793;

    Gelet op artikel 3 van de Kaderwet EZ-subsidies;

    De Raad van State gehoord (advies van 22 juli 2005, nr. W10.05.0157/II);

    Gezien het nader rapport van de Staatssecretaris van Economische Zaken van 21 november 2005, nr. WJZ 5716536;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Economische Zaken;'
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel1
  - number: 1.b
    text: |-
      ondernemer: natuurlijke persoon of rechtspersoon, niet zijnde een rechtspersoon die krachtens publiekrecht is
      ingesteld, die een onderneming in stand houdt;
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel1
  - number: 1.c
    text: 'groep: een economische eenheid, waarin organisatorisch zijn verbonden:'
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel1
  - number: 1.c.1°
    text: |-
      een natuurlijke persoon of privaatrechtelijke rechtspersoon, die direct of indirect: - meer dan de helft van het
      geplaatste kapitaal verschaft aan,
        - volledig aansprakelijk vennoot is van, of
        - overwegende zeggenschap heeft over, een of meer rechtspersonen of vennootschappen, en
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel1
  - number: 1.c.2°
    text: laatstbedoelde rechtspersonen of vennootschappen;
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel1
  - number: 1.d
    text: |-
      scheepswerf: een ondernemer die schepen ontwerpt, ontwikkelt, bouwt en uitrust, hetzij zelfstandig, hetzij deel
      uitmakend van een groep;
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel1
  - number: 1.e
    text: 'bank:'
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel1
  - number: 1.e.1°
    text: |-
      bank als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1] waaraan een vergunning
      is verleend op grond van [artikel 2:11][ref2] of [artikel 2:16 van die wet][ref3] of die op grond van
      [artikel 2:15 van die wet][ref4] haar bedrijf in Nederland kan uitoefenen, niet zijnde een bank die tevens
      beleggingsonderneming is;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 1.e.2°
    text: |-
      bank als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1] niet zijnde een bank die tevens
      beleggingsonderneming is, die beschikt over een vergunning als bedoeld in artikel 4 van richtlijn nr. 2000/12/
      EG van het Europees Parlement en de Raad van de Europese Unie van 20 maart 2000 betreffende de toegang tot en de
      uitoefening van de werkzaamheden van kredietinstellingen (PbEG L 275);


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 1.f
    text: |-
      schip: een zichzelf voortstuwend schip, met een minimaal vermogen van 365 kW of een minimaal tonnage van 500 bruto
      ton, niet zijnde een schip dat overeenkomstig zijn fundamentele en technisch vermogen is bedoeld om voor militaire
      doeleinden te worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel1
  - number: 1.g
    text: |-
      contractprijs: de tussen opdrachtgever en scheepswerf overeengekomen prijs voor de bouw van een schip, met inbegrip
      van stelposten voor zover daarvoor in het contract vaste of geschatte bedragen zijn opgenomen en met uitzondering
      van de eventueel verschuldigde omzetbelasting;
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel1
  - number: 1.h
    text: |-
      kredietovereenkomst: schriftelijke overeenkomst tussen een scheepswerf en een bank waarbij de bank krediet
      verstrekt aan de scheepswerf voor de bouw in Nederland van een nieuw schip;
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel1
  - number: 1.i
    text: |-
      kredietbedrag: het bedrag dat op grond van de kredietovereenkomst als krediet wordt verstrekt voor de bouw in
      Nederland van een nieuw schip;
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel1
  - number: 1.j
    text: 'opdrachtgever: natuurlijke persoon of rechtspersoon die opdracht heeft gegeven tot de bouw van een schip.'
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel1
  - number: '2'
    text: |-
      Onze Minister kan ten behoeve van de financiering van de bouw in Nederland van een nieuw schip op aanvraag van een
      bank een subsidie verlenen aan een bank in de vorm van een borgstelling voor de terugbetaling van een krediet dat
      de bank op grond van een kredietovereenkomst aan een in Nederland gevestigde scheepswerf heeft verstrekt.
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel2
  - number: '3.1'
    text: Er wordt borg gestaan voor 80 procent van het kredietbedrag, of voor zoveel minder als door de bank is aangevraagd.
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel3
  - number: '3.2'
    text: |-
      Er wordt geen borg gestaan voor de kosten die de bank in rekening brengt aan de scheepswerf, met uitzondering van
      de kosten van de financiering van de bouw van het schip.
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel3
  - number: '4.1'
    text: |-
      Onze Minister stelt bij ministeriële regeling een plafond vast voor het in een jaar of een gedeelte van een jaar
      verlenen van borgstellingen op grond van dit besluit.
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel4
  - number: '4.2'
    text: Het plafond voor het in 2006 verlenen van borgstellingen bedraagt € 1.000.000.000.
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel4
  - number: '5.1'
    text: |-
      Een aanvraag om borgstelling als bedoeld in [artikel 2][ref1] wordt ingediend met gebruikmaking van een formulier,
      dat bij ministeriële regeling wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0019103#Artikel2
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0019103
        artikel: '2'
        paragraaf: '1'
  - number: '5.2'
    text: 'De aanvraag gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel5
  - number: 5.2.a
    text: de kredietovereenkomst waarover borgstelling wordt aangevraagd;
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel5
  - number: 5.2.b
    text: |-
      een analyse en beoordeling door de bank van de kredietwaardigheid van de scheepswerf met het oog op de
      kredietovereenkomst;
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel5
  - number: 5.2.c
    text: een contract tussen enerzijds de opdrachtgever en anderzijds de scheepswerf die de opdracht zal uitvoeren;
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel5
  - number: 5.2.d
    text: andere bescheiden, vermeld in het formulier.
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel5
  - number: '5.3'
    text: De aanvraag geschiedt binnen zeven werkdagen na het sluiten van de kredietovereenkomst.
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel5
  - number: '6.1'
    text: Onze Minister stuurt de bank en de scheepswerf binnen vijf werkdagen een bevestiging van ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel6
  - number: '6.2'
    text: Onze Minister geeft een beschikking binnen zes weken na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel6
  - number: '7'
    text: 'Onze Minister beslist in ieder geval afwijzend op een aanvraag indien:'
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel7
  - number: 7.a
    text: de aanvraag niet voldoet aan dit besluit;
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel7
  - number: 7.b
    text: |-
      de Staat ten behoeve van de scheepswerf reeds een garantie, borgstelling, verzekering of herverzekering voor de
      financiering van de bouw van het schip heeft afgegeven;
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel7
  - number: 7.c
    text: de contractprijs minder dan € 3.000.000 of meer dan € 100.000.000 bedraagt;
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel7
  - number: 7.d
    text: onvoldoende vertrouwen bestaat in de technische en economische haalbaarheid van de bouw van het schip;
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel7
  - number: 7.e
    text: het kredietbedrag meer dan 80 procent van de contractprijs betreft;
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel7
  - number: 7.f
    text: de kredietovereenkomst ten aanzien van het kredietbedrag een looptijd heeft van meer dan 36 maanden;
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel7
  - number: 7.g
    text: |-
      de bank onvoldoende de naar normaal bankgebruik maximaal mogelijke zekerheden heeft gevestigd of zal vestigen bij
      de verstrekking van het kredietbedrag aan de scheepswerf;
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel7
  - number: 7.h
    text: |-
      de bank op het moment van het verstrekken van het kredietbedrag waarvoor de Staat borg staat een lopende
      financieringsfaciliteit verlaagt;
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel7
  - number: 7.i
    text: |-
      door de verlening van de borgstelling het totaal van de op grond van dit besluit verleende borgstellingen ten
      behoeve van de scheepswerf of van de groep, waartoe deze scheepswerf behoort, meer zou bedragen dan 30 procent van
      het bij of krachtens [artikel 4][ref1] vastgestelde bedrag;


      [ref1]: https://wetten.overheid.nl/BWBR0019103#Artikel4
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0019103
        artikel: '4'
        paragraaf: '1'
  - number: 7.j
    text: gegronde vrees bestaat dat de scheepswerf zich in financiële moeilijkheden bevindt;
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel7
  - number: 7.k
    text: |-
      onvoldoende vertrouwen bestaat dat de scheepswerf de capaciteiten heeft om de bouw van het schip naar behoren uit
      te voeren;
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel7
  - number: 7.l
    text: |-
      uit het contract, bedoeld in [artikel 5, tweede lid, onderdeel c][ref1], niet blijkt dat de opdrachtgever, terzake
      van de opdracht waarvoor de scheepswerf een kredietovereenkomst heeft afgesloten, voorafgaand aan een uitbetaling
      van krediet op grond van de kredietovereenkomst, een of meer aanbetalingen doet ter hoogte van tenminste 5 procent
      van de contractprijs;


      [ref1]: https://wetten.overheid.nl/BWBR0019103#Artikel5
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0019103
        artikel: '5'
        paragraaf: '2'
  - number: 7.m
    text: |-
      uit het contract, bedoeld in [artikel 5, tweede lid, onderdeel c][ref1], niet blijkt dat de aanbetaling door de
      opdrachtgever, terzake van de opdracht waarvoor de scheepswerf een kredietovereenkomst heeft afgesloten, oploopt
      tot tenminste 20 procent van de contractprijs tot aflevering van het schip;


      [ref1]: https://wetten.overheid.nl/BWBR0019103#Artikel5
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0019103
        artikel: '5'
        paragraaf: '2'
  - number: 7.n
    text: van de bouw van het schip onvoldoende positieve gevolgen voor de Nederlandse economie te verwachten zijn.
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel7
  - number: '8'
    text: |-
      Onze Minister verdeelt het bij of krachtens [artikel 4][ref1] vastgestelde bedrag in de volgorde
      van ontvangst van de aanvragen, met dien verstande dat indien een aanvrager niet heeft voldaan
      aan enig wettelijk voorschrift voor het in behandeling nemen van de aanvraag en met toepassing van
      [artikel 4:5 van de Algemene wet bestuursrecht][ref2] de gelegenheid heeft gehad de aanvraag aan te vullen, de dag
      waarop de aanvraag voldoet aan de wettelijke voorschriften met betrekking tot de verdeling als datum van ontvangst
      geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0019103#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0019103
        artikel: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '9'
    text: |-
      De beschikking tot het verlenen van een borgstelling bevat de opschortende voorwaarde dat binnen twee weken
      na de beschikking een overeenkomst van borgtocht, overeenkomstig het model, bedoeld in [artikel 10][ref1],
      tot stand is gekomen tussen de Staat en de bank. Daartoe wordt een aanbod overeenkomstig het model, bedoeld in
      [artikel 10][ref2], bij de beschikking tot het verlenen van een borgstelling gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0019103#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0019103#Artikel10
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0019103
        artikel: '10'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0019103
        artikel: '10'
        paragraaf: '3'
  - number: '10.1'
    text: Onze Minister stelt bij ministeriële regeling een model voor de overeenkomst van borgtocht vast.
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel10
  - number: '10.2'
    text: 'De overeenkomst van borgtocht bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel10
  - number: 10.2.a
    text: |-
      de bepaling dat uitsluitend tot borgstelling zal worden overgegaan, indien wordt voldaan aan de bij of krachtens
      dit besluit gestelde eisen;
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel10
  - number: 10.2.b
    text: |-
      de eisen waaraan de kredietovereenkomst, waarvan de te sluiten overeenkomst van borgtocht afhankelijk is, moet
      voldoen;
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel10
  - number: 10.2.c
    text: de wijze waarop de omvang van de borgstelling wordt bepaald;
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel10
  - number: 10.2.d
    text: de voorwaarden waaronder de borgstelling kan worden ingeroepen;
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel10
  - number: 10.2.e
    text: bepalingen met betrekking tot betalingen door de Staat aan de bank;
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel10
  - number: 10.2.f
    text: een bepaling inzake de duur en beëindiging van de overeenkomst tot borgtocht;
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel10
  - number: 10.2.g
    text: |-
      een bepaling, dat de bank uiterlijk tien weken na de beschikking tot het verlenen van een borgstelling, behoudens
      voorafgaande schriftelijke verlenging door Onze Minister, aantoont dat de opdrachtgever en de scheepswerf terzake
      van de opdracht een contract hebben zonder opschortende voorwaarden en dat de opdrachtgever terzake van de opdracht
      een of meer betalingen heeft gedaan;
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel10
  - number: 10.2.h
    text: de wijze van vaststelling van de subsidie.
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel10
  - number: '10.3'
    text: 'De overeenkomst van borgtocht bevat voor de kredietinstelling verplichtingen ter zake van:'
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel10
  - number: 10.3.a
    text: |-
      de betaling van een provisie met inachtneming van een bij ministeriële regeling vast te stellen tarief als bedoeld
      in [artikel 11][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019103#Artikel11
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0019103
        artikel: '11'
        paragraaf: '3'
  - number: 10.3.b
    text: het verschaffen van inlichtingen omtrent het beheer van de kredieten;
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel10
  - number: 10.3.c
    text: de terugvordering van de kredieten en de uitwinning van zekerheden;
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel10
  - number: 10.3.d
    text: aanvragen tot betaling;
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel10
  - number: 10.3.e
    text: |-
      melding aan Onze Minister van een verzoek tot verlening van surséance van betaling of tot faillietverklaring van de
      bank, de scheepswerf of de opdrachtgever.
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel10
  - number: '11.1'
    text: Onze Minister stelt bij ministeriële regeling de tarieven voor de provisie vast.
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel11
  - number: '11.2'
    text: 'Deze tarieven:'
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel11
  - number: 11.2.a
    text: houden rekening met een realistische risicowaardering;
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel11
  - number: 11.2.b
    text: dekken zowel de met de borgstellingstoekenning verbonden risico’s als de beheerkosten van het besluit.
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel11
  - number: '12'
    text: |-
      Onze Minister beziet eenmaal per jaar of de bij of krachtens dit besluit gestelde voorwaarden moeten worden
      herzien.
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel12
  - number: '13'
    text: Dit besluit treedt in werking met ingang van 1 januari 2006.
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel13
  - number: '14'
    text: 'Dit besluit wordt aangehaald als: Besluit borgstelling scheepsnieuwbouw.'
    url: https://wetten.overheid.nl/BWBR0019103/2007-01-01#Artikel14
