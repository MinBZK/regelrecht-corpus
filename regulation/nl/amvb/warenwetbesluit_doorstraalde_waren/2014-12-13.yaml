        artikel: '18'
  - number: '8'
    text: >-
      1 Eet- en drinkwaren die als zodanig kennelijk zijn bestemd voor de eindverbruiker moeten, alvorens zij aan een
      behandeling met ioniserende stralen worden onderworpen, aanwezig zijn in de verpakking waarin de betrokken waar aan
      de eindverbruiker wordt afgeleverd.


      2 Doorstraalde eet- en drinkwaren die als zodanig kennelijk bestemd zijn voor de eindverbruiker mogen uitsluitend
      in een verpakking worden verhandeld.


      3 Het voor de verpakking van door te stralen eet- of drinkwaren en grondstoffen te gebruiken materiaal is geschikt
      voor dit doel.
    url: https://wetten.overheid.nl/BWBR0005465/2014-12-13#Artikel8
  - number: '9'
    text: |-
      1 Doorstraalde eet- en drinkwaren en grondstoffen mogen uitsluitend binnen Nederlands grondgebied worden gebracht,
      indien voldaan is aan de volgende voorschriften:

      a. de behandeling moet hebben plaatsgevonden in een installatie

      - die, indien zij in een andere lid-staat van de Europese Unie is gevestigd, daartoe is erkend door de betrokken
      autoriteit in de desbetreffende Lid-Staat;
      - die, indien zij is gevestigd in een derde land, voorkomt op de door de Commissie van de Europese Gemeenschappen
      opgestelde lijst, bedoeld in artikel 9, tweede lid, onder a, van [richtlijn nr. 1999/2/EG](31999L0002) van het
      Europees Parlement en de Raad van de Europese Unie van 22 februari 1999 betreffende de onderlinge aanpassing van de
      wetgevingen van de lid-staten inzake de behandeling van voedsel met ioniserende straling (PbEG L 66);

      b. bij iedere zending moet zijn vermeld de naam en het adres van de installatie waar de doorstraling is verricht.

      2 Onze Minister kan nader vaststellen wat moet worden verstaan onder erkenning als bedoeld in het eerste lid.
      Voor zover krachtens het Verdrag tot oprichting van de Europese Economische Gemeenschap een maatregel ter zake is
      vastgesteld, geschiedt zodanige vaststelling ter uitvoering van die maatregel.

      3 Onverminderd het eerste en tweede lid, mogen doorstraalde eet- en drinkwaren en grondstoffen uitsluitend worden
      ingevoerd, indien voldaan is aan de volgende voorwaarden:

      a. voldaan moet zijn aan [artikel 6, eerste lid][ref1] en

      b. bij iedere zending moeten de gegevens, bedoeld in [artikel 4, eerste lid][ref2], zijn vermeld.

      4 Voor de toepassing van het derde lid wordt onder invoer verstaan het plaatsen van de goederen onder de
      douaneregeling in het vrije verkeer brengen, dan wel het plaatsen onder de douaneregeling actieve veredeling,
      behandeling onder douanetoezicht, tijdelijke invoer of passieve veredeling als bedoeld in [verordening (EEG) nr.
      2913/92](31992R2913) van de Raad van de Europese Unie van 12 oktober 1992 tot vaststelling van het communautair
      douanewetboek (PbEG L 302).


      [ref1]: https://wetten.overheid.nl/BWBR0005465#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005465#Artikel4
