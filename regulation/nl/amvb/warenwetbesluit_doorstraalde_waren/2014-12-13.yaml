  - number: '10'
    text: |-
      1 Bij de verhandeling van doorstraalde eet- en drinkwaren en grondstoffen die niet zijn bestemd voor de
      eindverbruiker of een instelling, moet worden gebezigd de vermelding van de naam en het adres van de installatie
      waar de behandeling met ioniserende stralen is uitgevoerd.

      2 De volgende onderdelen van het [Warenwetbesluit informatie levensmiddelen][ref1] zijn van overeenkomstige
      toepassing op de in het eerste lid bedoelde verhandeling:

      a. [artikel 4, eerste lid][ref2], inzake het vermelden van de partij waartoe een levensmiddel behoort; en

      b. [artikel 6][ref3] inzake het vermelden van de behandeling van een levensmiddel of ingrediënt van een
      levensmiddel, indien dat levensmiddel onderscheidenlijk ingrediënt met ioniserende stralen is behandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0033323
      [ref2]: https://wetten.overheid.nl/BWBR0033323#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0033323#Artikel6
