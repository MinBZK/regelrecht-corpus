  - number: '4'
    text: |-
      1 De overeenkomstig [artikel 3][ref1] erkende installatie houdt voor elke gebruikte ioniserende stralingsbron
      alsmede voor iedere partij behandelde eet- of drinkwaren of grondstoffen een register bij met de volgende gegevens:

      a. aard en hoeveelheid van de doorstraalde eet- of drinkwaren of grondstoffen;

      b het nummer van de partij;

      c. de naam van degene die opdracht heeft gegeven tot de behandeling;

      d. de naam van degene voor wie de doorstraalde waren zijn bestemd;

      e. de datum van doorstraling;

      f. het verpakkingsmateriaal dat tijdens de doorstraling gebruikt;

      g. de gegevens betreffende de controle op het doorstralingsprocédé volgens de bijlage, de verrichte
      stralingsmetingen en de gevonden uitkomsten met nadere gegevens over de boven- en ondergrens van de geabsorbeerde
      dosis en het soort ioniserende straling; en

      h. vermelding van de voorbereidende valideringsmetingen.

      2 Onze Minister kan nadere regels vaststellen met betrekking tot het bepaalde in het eerste lid.

      3 De in het eerste lid bedoelde gegevens moeten door de beheerder van de installatie ten minste vijf jaren worden
      bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0005465#Artikel3
    url: https://wetten.overheid.nl/BWBR0005465/2014-12-13#Artikel4
