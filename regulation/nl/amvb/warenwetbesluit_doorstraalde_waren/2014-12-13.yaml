  - number: '11'
    text: >-
      1 Als methoden van onderzoek welke bij uitsluiting beslissend zijn voor de vaststelling of al dan niet is voldaan
      aan de bij of krachtens dit besluit gestelde regels, worden aangewezen microbiologische onderzoekingsmethoden,
      alsmede detectiemethoden.


      2 Onze Minister kan omtrent de in het eerste lid bedoelde methoden nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0005465/2014-12-13#Artikel11
  - number: '14'
    text: |-
      1 Dit besluit treedt in werking met ingang van de derde maand na de datum van uitgifte van het Staatsblad waarin
      het wordt geplaatst. Het is niet van toepassing op waren waarvan kan worden aangetoond dat zij voor bedoelde datum
      met ioniserende stralen zijn behandeld.

      2 In afwijking van het eerste lid treden de [artikelen 10, tweede lid, sub c, en derde lid, sub c][ref1],
      [12][ref2] en [13][ref3] in werking met ingang van de zevende maand na de in dat lid bedoelde datum.


