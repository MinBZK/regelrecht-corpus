preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 13 augustus 1991, VVP/L-
    691449, gedaan in overeenstemming met Onze Minister van Economische Zaken en de Staatssecretaris van Landbouw,
    Natuurbeheer en Visserij;


    Overwegende, dat uit oogpunt van volksgezondheid de behandeling van eet- en drinkwaren en andere roerende zaken met
    ioniserende stralen tot een dosis van 10 kGy als veilig beschouwd kan worden;


    Overwegende, dat het evenwel als ongewenst moet worden beschouwd dat eet- en drinkwaren zonder aantoonbare noodzaak
    aan een dergelijke behandeling zouden worden onderworpen;


    Overwegende, dat bovendien voorkomen moet worden dat voor de bereiding van eet- en drinkwaren gebruik zou worden
    gemaakt van oorspronkelijk ondeugdelijke grondstoffen die evenwel na een behandeling met ioniserende stralen alsnog
    in overeenstemming zijn gebracht met de van toepassing zijnde eisen;


    Overwegende, dat het Algemeen Aanduidingenbesluit (Warenwet) (Stb. 1981, 621) en het Warenwetbesluit Etikettering
    van levensmiddelen (Stb. 1992, 14) moeten worden aangevuld met specifieke voorschriften ten behoeve van de
    informatie aan eindverbruikers, betreffende de vermelding van een eventuele behandeling met ioniserende stralen van
    eet- en drinkwaren en ingrediënten daarvan;


    Overwegende, dat daarnaast ook bereiders van eet- en drinkwaren moeten worden ingelicht over een eventuele
    behandeling van grondstoffen met ioniserende stralen;


    Gelet op de artikelen 1, vijfde lid, 4, eerste lid,5, eerste lid, onderdelen a, 1°, en b, vierde en zesde lid,
    6, onderdeel d, 8, onderdeel c, 9, 12 en 16 van de Warenwet (Stb. 1988, 360) en op artikel II, eerste lid, van de
    Wijzigingswet 1988 Warenwet (Stb. 358), jo artikel 14 van de Warenwet (Stb. 1935, 793);


    Gehoord de Adviescommissie Warenwet (advies van 12 juli 1985, nr. 13516/115);


    Gezien het advies van de Gezondheidsraad (advies van 28 april 1983, nr. U 2802/LG/AR);


    De Raad van State gehoord (advies van 29 oktober 1991, nr. W13.91.0426);


    Gezien het nader rapport van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 20 maart 1992, VVP/L-
    692641, uitgebracht in overeenstemming met Onze Minister van Economische Zaken en de Staatssecretaris van Landbouw,
    Natuurbeheer en Visserij;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0005465/2014-12-13#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. ioniserende stralen: hetgeen daaronder in de [Kernenergiewet][ref1] (*Stb.* 1963, 82) wordt verstaan;

      b. installatie: een onderneming waaraan krachtens de [Kernenergiewet][ref2] een vergunning is verleend voor
      het voorhanden hebben en toepassen van radioactieve stoffen, of voor het gebruiken van een ioniserende stralen
      uitzendend toestel, waarmee een behandeling van waren met ioniserende stralen kan worden uitgevoerd;

      c. doorstraalde waren: waren die met ioniserende stralen zijn behandeld;

      d. grondstoffen: grondstoffen bestemd voor de bereiding van eet- en drinkwaren.

      2 Dit besluit is niet van toepassing op eet- en drinkwaren en grondstoffen die zijn blootgesteld aan ioniserende
      straling die is opgewekt door meet- of controle-instrumenten, mits de geabsorbeerde dosis niet hoger is dan 0,01 Gy
      voor controle-instrumenten die gebruik maken van neutronen, en 0,5 Gy in andere gevallen, bij een energieniveau van
      ten hoogste 10 MeV in het geval van röntgenstraling, 14 MeV in het geval van neutronen en 5 MeV in andere gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0002402
      [ref2]: https://wetten.overheid.nl/BWBR0002402
    url: https://wetten.overheid.nl/BWBR0005465/2014-12-13#Artikel1
