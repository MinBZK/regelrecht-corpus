  - number: '2'
    text: >-
      1 Het is verboden eet- of drinkwaren en grondstoffen met ioniserende stralen te behandelen anders dan met
      inachtneming van de in dit besluit gestelde voorschriften.


      2 Het is verboden voor de behandeling met ioniserende stralen eet- of drinkwaren en grondstoffen te bezigen, die
      niet voldoen aan de in dit besluit gestelde eisen.


      3 Het is verboden eet- en drinkwaren te verhandelen anders dan met inachtneming van de voorschriften in dit besluit
      gesteld met betrekking tot het bezigen van vermeldingen.


      4 Het is verboden doorstraalde waren binnen Nederlands grondgebied te brengen anders dan met inachtneming van de in
      dit besluit gestelde voorschriften.
    url: https://wetten.overheid.nl/BWBR0005465/2014-12-13#Artikel2
  - number: '3'
    text: |-
      1 Voor de behandeling van waren met ioniserende stalen mag uitsluitend van de volgende bronnen gebruik worden
      gemaakt:

      a. gammastralen afkomstig van radionucliden 60Co of 137Cs;

      b. röntgenstralen opgewekt door machinale bronnen, met een energieniveau van ten hoogste 5 Mev;

      c. elektronen opgewekt door machinale bronnen, met een energieniveau van ten hoogste 10 Mev.

      2 De behandeling van waren met ioniserende stralen mag uitsluitend plaatsvinden in een installatie als bedoeld in
      [artikel 1, eerste lid, onder b][ref1], waarvoor een erkenning voor het mogen uitvoeren van die behandeling door
      Onze Minister is afgegeven.

      3 Onverminderd het bepaalde in het vierde lid wordt, voor zover het betreft het behandelen met ioniserende stralen
      van eet- en drinkwaren en grondstoffen de in het tweede lid bedoelde erkenning verleend indien de installatie
      voldoet aan de Recommended International Code of Practice for the Operation of Irradiation Facilities Used for the
      Treatment of Foods (FAO/WHO CAC/Vol. XV, Ed.1.CAC/RCP 10-1979 (Rev. 1) van de Codex Alimentarius, en een persoon is
      aangewezen die instaat voor de naleving van alle eisen die met betrekking tot dit procédé noodzakelijk zijn.

      4 Onze Minister kan nadere eisen vaststellen met betrekking tot de voorwaarden voor het verlenen van een erkenning
      als bedoeld in het tweede lid.

      5 Aanvragen voor een erkenning als bedoeld in het tweede lid moeten worden ingediend bij Onze Minister.
      Deel van zodanige aanvraag moet in elk geval uitmaken een afschrift van de krachtens [artikel 29][ref2] of
      [34 van de Kernenergiewet][ref3] verleende vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0005465#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0002402#Artikel34
