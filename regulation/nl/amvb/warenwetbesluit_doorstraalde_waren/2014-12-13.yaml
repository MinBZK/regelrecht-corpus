  - number: '5'
    text: >-
      1 Eet- en drinkwaren en grondstoffen verkeren op het moment van behandelen met ioniserende stralen in een
      behoorlijke staat van hygiëne.


      2 Het behandelen van eet- of drinkwaren en grondstoffen met ioniserende stralen:


      a. voorziet technologisch gezien in een aanvaardbare behoefte;


      b. levert geen gevaar op voor de volksgezondheid en wordt uitgevoerd volgens de desbetreffende voorwaarden;


      c. is nuttig voor de consument; en


      d. wordt niet toegepast ter vervanging van slechte hygiëne- en gezondheidspraktijken of van behoorlijke productie-
      en landbouwprocessen.


      3 Eet- en drinkwaren en grondstoffen worden slechts behandeld met ioniserende stralen teneinde:


      a. het risico van door voedsel veroorzaakte ziektes te verminderen, door vernietiging van ziektekiemen;


      b. bederf van eet- of drinkwaren of grondstoffen te verminderen, door het vertragen of stoppen van
      rottingsprocessen en het vernietigen van bederf-veroorzakende organismen;


      c. het verloren gaan van eet- of drinkwaren of grondstoffen als gevolg van voortijdig rijpen, kiemen of uitlopen,
      te beperken; of


      d. eet- of drinkwaren of grondstoffen te ontdoen van organismen die schadelijk zijn voor de gewassen en de daarvan
      afgeleide waren.
    url: https://wetten.overheid.nl/BWBR0005465/2014-12-13#Artikel5
  - number: '6'
    text: |-
      1 Uitsluitend de volgende eet- of drinkwaren en grondstoffen mogen met ioniserende stralen worden of zijn
      behandeld. Zij mogen slechts worden behandeld met een geabsorbeerde stralingsdosis die gemiddeld niet meer mag
      bedragen dan de waarde zoals die voor de desbetreffende waar is aangegeven.








                    eet- of drinkwaar, c.q. grondstof


                    gemiddeld geabsorbeerde stralingsdosis




                    Gedroogde vruchten


                    1 kGy;






                    Peulvruchten


                    1 kGy;




                    Gedehydrateerde groenten


                    10 kGy;




                    Graanvlokken


                    1 kGy;




                    Gedroogde aromatische kruiden, specerijen en plantaardige kruiden


                    10 kGy;




                    Garnalen


                    3 kGy;




                    Vlees van pluimvee


                    7 kGy;




                    Kikkerdelen


                    5 kGy;




                    Het verdikkingsmiddel: Arabische gom (E 414)


                    10 kGy;




                    Diepgevroren maaltijden (voor patiënten, die op medisch voorschrift steriele voeding nodig hebben)


                    75 kGy;




                    eiproducten


                    6 kGy.






      2 De totale dosis die nodig is voor een specifieke technische functie mag met betrekking tot de in het eerste lid
      bedoelde waren, over meer dan één behandeling worden verdeeld. De grootste geabsorbeerde stralingsdosis mag niet
      groter zijn dan 150% van de waarde die voor de desbetreffende waar is vastgesteld.

      3 Eet- en drinkwaren en grondstoffen mogen tot het niveau van de desbetreffende vastgestelde gemiddeld
      geabsorbeerde stralingsdosis, slechts éénmaal met ioniserende stralen zijn of worden behandeld. De behandeling mag
      niet worden gecombineerd met een chemisch proces dat hetzelfde oogmerk heeft als genoemde behandeling.
    url: https://wetten.overheid.nl/BWBR0005465/2014-12-13#Artikel6
  - number: '7'
    text: |-
      De tweede volzin van [artikel 1, derde lid, van de Warenwet][ref1] (*Stb.* 1988, 360), voor zover het betreft het
      afleveren van eet- en drinkwaren en grondstoffen om deze door middel van een behandeling met ioniserende stralen
      kennelijk in overeenstemming te brengen met het bepaalde in of krachtens die wet, is niet van toepassing op eet- en
      drinkwaren en grondstoffen die niet in overeenstemming zijn met [artikel 18][ref2] van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0001969#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001969#Artikel18
    url: https://wetten.overheid.nl/BWBR0005465/2014-12-13#Artikel7
