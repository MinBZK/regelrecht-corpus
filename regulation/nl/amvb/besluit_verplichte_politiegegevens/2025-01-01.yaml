  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Veiligheid en Justitie van 18 november 2011, nr. 5716361/11/6;

    Gelet op de artikelen 21, 24 en 54 van de Politiewet 2012 en de artikelen 6, zesde lid, 11, derde lid, 15, tweede
    lid, van de Wet politiegegevens;

    De Afdeling advisering van de Raad van State gehoord (advies van 13 januari 2012, nr. W03.11.0501/II);

    Gezien het nader rapport van Onze Minister van Veiligheid en Justitie van 28 september 2012, nr. 251196;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0032083/2025-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. *centrale verwijzingsindex:* de door Onze Minister aangewezen systeem- en toepassingsprogrammatuur met behulp
      waarvan een overzicht kan worden verkregen van de herkenningsdienstgegevens van de politie of diensten waarin
      een geregistreerde voorkomt en met behulp waarvan rechtstreekse toegang tot die onderlinge gegevensverwerking kan
      worden verkregen;

      b. *signalering:* een in verband met de uitvoering van de politietaak noodzakelijke kennisgeving over een persoon
      of een goed;

      c. *criminele-inlichtingeneenheid:* een onderdeel van een regionale of landelijke eenheid,
      onderscheidenlijk van de rijksrecherche, belast met het, ten behoeve van de recherchefunctie,
      verwerken van gegevens die noodzakelijk zijn voor de opsporing van misdrijven als bedoeld in
      [artikel 10, eerste lid, onderdeel a, van de Wet politiegegevens][ref1];

      d. *nationale criminele-inlichtingeneenheid:* een dienst van de Eenheid landelijke opsporing en interventies,
      belast met het, ten behoeve van de recherchefunctie, verwerken van gegevens die noodzakelijk zijn voor de opsporing
      van misdrijven als bedoeld in [artikel 10, eerste lid, onderdeel a, van de Wet politiegegevens][ref2];

      e. *informantgegevens:* gegevens omtrent een persoon als bedoeld in
      [artikel 12, zevende lid, van de Wet politiegegevens][ref3];

      f. *criminele-inlichtingen:* gegevens die in aanmerking komen voor verwerking op grond van
      [artikel 10, eerste lid, onderdeel a, van de Wet politiegegevens][ref4];

      g. *verwerkingsverantwoordelijke:* de verwerkingsverantwoordelijke, bedoeld in
      [artikel 1, onderdeel f, onder 1° en 2°, van de Wet politiegegevens][ref5].


