        artikel: 77e
  - number: '3'
    text: |-
      De politie verwerkt terstond gegevens omtrent signaleringen met het oog op de informatievoorziening in het kader
      van de uitvoering van de politietaak in verband met:

      a. de identificatie, verificatie en bejegening van gesignaleerde personen;

      b. de identificatie en verificatie van goederen;

      c. de juiste uitvoering van de met de signalering verbonden taakopdracht.
    url: https://wetten.overheid.nl/BWBR0032083/2025-01-01#Artikel3
  - number: '4'
    text: |-
      De politie verwerkt terstond dactyloscopische signalementen, dactyloscopische sporen en gedeelten daarvan met het
      oog op de informatievoorziening in het kader van de uitvoering van de politietaak in verband met:

      a. de opsporing en vervolging van verdachten van strafbare feiten,

      b. de bewijsvoering in strafzaken;

      c. de identificatie van overleden personen of personen die anderszins niet in staat zijn inlichtingen omtrent hun
      identiteit te verschaffen.
    url: https://wetten.overheid.nl/BWBR0032083/2025-01-01#Artikel4
  - number: '5'
    text: |-
      1 De criminele-inlichtingeneenheden verrichten met het oog op het verkrijgen van inzicht
      in de betrokkenheid van personen bij het beramen of plegen van misdrijven als bedoeld in
      [artikel 10, eerste lid, onderdeel a, van de Wet politiegegevens][ref1] in ieder geval de volgende werkzaamheden:

      a. het verzamelen en verifiëren van criminele-inlichtingen;

      b. het verwerken van criminele-inlichtingen in een bestand, als bedoeld in
      [artikel 2, eerste lid, van de Wet politiegegevens][ref2];

      c. het bevorderen van het gericht inwinnen en aanvullen van criminele-inlichtingen en andere gegevens die in het
      kader van de strafrechtelijke handhaving van de rechtsorde in aanmerking komen voor verwerking op grond van de
      [Wet politiegegevens][ref3];

      d. het analyseren van criminele-inlichtingen en het aan de hand daarvan:

      1°. signaleren van criminaliteitsontwikkelingen, voor zover het betreft misdrijven als bedoeld in
      [artikel 10, eerste lid, onderdeel a, van de Wet politiegegevens][ref4];

      2° periodiek verslag doen ten behoeve van criminaliteitsbeelden;

      e. het ter beschikking stellen van criminele-inlichtingen overeenkomstig
      [artikel 10, vijfde lid, van de Wet politiegegevens][ref5].

      2 Ten behoeve van de werkzaamheden, bedoeld in het eerste lid, maken criminele-inlichtingeneenheden gebruik van de
      centrale verwijzingsindex.

      3 De uitvoering van de werkzaamheden, bedoeld in het eerste lid, onderdeel c, met medewerking van informanten
      als bedoeld in [artikel 12, zevende lid, van de Wet politiegegevens][ref6] wordt uitsluitend verricht door de
      criminele-inlichtingeneenheid.


