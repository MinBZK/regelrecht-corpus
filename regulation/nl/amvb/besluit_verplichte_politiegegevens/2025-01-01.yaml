        bwb_id: BWBR0022463
        artikel: '12'
  - number: '7'
    text: |-
      1 Criminele-inlichtingeneenheden wisselen onderling, gevraagd en ongevraagd, criminele-inlichtingen uit voor zover
      zij deze behoeven voor de uitvoering van hun taak. Daartoe wordt gebruikgemaakt van het modelformulier, bedoeld in
      [bijlage 1][ref1] van dit besluit.

      2 Twee ambtenaren van de criminele-inlichtingeneenheid worden aangewezen met het oog op de autorisatie als bedoeld
      in [artikel 2:5, eerste lid, van het Besluit politiegegevens][ref2] ten aanzien van het bestand met criminele-
      inlichtingen bij de overige criminele-inlichtingeneenheden.

      3 De verwerkingsverantwoordelijke draagt ervoor zorg dat aan de ingevolge het tweede lid aangewezen en hem
      bekendgemaakte ambtenaren van andere criminele-inlichtingeneenheden autorisatie wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0032083
      [ref2]: https://wetten.overheid.nl/BWBR0023086#Artikel25
    url: https://wetten.overheid.nl/BWBR0032083/2025-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0032083
      - id: ref2
        bwb_id: BWBR0023086
        artikel: 2:5
  - number: '8'
    text: |-
      1 Criminele-inlichtingeneenheden stellen de nationale criminele-inlichtingeneenheid in kennis van:

      a. criminele-inlichtingen die van nationale of internationale betekenis zijn;

      b. personalia of bedrijfsgegevens van overeenkomstig
      [artikel 10, tweede lid, onderdelen a en b, van de Wet politiegegevens][ref1] geregistreerde personen in de door
      Onze Minister aangewezen geautomatiseerde verwijzingsindex;

      c. codes als bedoeld in [artikel 6][ref2];

      d. overige informatie die van belang kan zijn voor de landelijke en internationale coördinatie en ondersteuning
      door de nationale criminele-inlichtingeneenheid.

      2 Ter uitvoering van het eerste lid, onderdeel b, en met het oog op de verstrekking van de gegevens als
      opgenomen in [bijlage 2][ref3] van dit besluit maken de criminele-inlichtingeneenheden gebruik van de centrale
      verwijzingsindex.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0032083#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0032083
    url: https://wetten.overheid.nl/BWBR0032083/2025-01-01#Artikel8
