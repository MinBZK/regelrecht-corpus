  - number: '6'
    text: |-
      Criminele-inlichtingeneenheden verwerken informantgegevens als bedoeld in
      [artikel 12 van de Wet politiegegevens][ref1] onder gelijktijdige codetoekenning.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel12
    url: https://wetten.overheid.nl/BWBR0032083/2025-01-01#Artikel6
    references:
