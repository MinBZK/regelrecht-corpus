  - number: '10'
    text: |-
      1 De ambtenaar die deel uitmaakt van een criminele-inlichtingeneenheid voldoet aan de
      kwalificatie van een door Onze Minister aan te wijzen politieopleiding als bedoeld in
      [artikel 1, eerste lid, onder s, van de Politiewet 2012][ref1].

      2 De verwerkingsverantwoordelijke draagt ervoor zorg dat de kennis en vaardigheden van hem ondergeschikte
      ambtenaren die deel uitmaken van een criminele-inlichtingeneenheid, worden onderhouden op minimaal het niveau van
      de aan de in het eerste lid bedoelde kwalificaties.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel1
    url: https://wetten.overheid.nl/BWBR0032083/2025-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '1'
  - number: '11'
    text: |-
      1 De verwerkingsverantwoordelijke bepaalt de termijn gedurende welke de ambtenaar die is belast met de
      werkzaamheden, bedoeld in [artikel 5, eerste lid, onderdeel c][ref1], ononderbroken deel uitmaakt van een
      criminele-inlichtingeneenheid.

      2 De termijn, bedoeld in het eerste lid, is ten hoogste vier jaar en kan tweemaal met twee jaar worden verlengd.

      3 Voor de ambtenaar die voor de datum van inwerkingtreding van dit besluit is aangesteld, gaat de termijn, bedoeld
      in het eerste lid, in op die datum.


      [ref1]: https://wetten.overheid.nl/BWBR0032083#Artikel5
    url: https://wetten.overheid.nl/BWBR0032083/2025-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0032083
        artikel: '5'
  - number: '12'
    text: |-
      1 De bij de criminele-inlichtingeneenheid in gebruik zijnde vertrekken zijn afsluitbaar en beveiligd. Tot deze
      vertrekken hebben slechts toegang ambtenaren die deel uitmaken van de criminele-inlichtingeneenheid, personen die
      door deze ambtenaren worden begeleid en de als zodanig aangewezen officier van justitie die verantwoordelijk is
      voor de taakuitoefening van de criminele-inlichtingeneenheid.

      2 In afwijking van het eerste lid, tweede volzin, kan de korpschef aan anderen toegang zonder begeleiding
      toestaan, indien het betreden van de vertrekken alleen kan plaatsvinden nadat identiteitsgegevens elektronisch
      zijn vastgelegd en de toegang noodzakelijk is vanuit de verantwoordelijkheid voor de ambtenaren van de criminele-
      inlichtingeneenheid.

      3 Bij afwezigheid van ambtenaren van de criminele-inlichtingeneenheid zijn de vertrekken deugdelijk afgesloten.
    url: https://wetten.overheid.nl/BWBR0032083/2025-01-01#Artikel12
