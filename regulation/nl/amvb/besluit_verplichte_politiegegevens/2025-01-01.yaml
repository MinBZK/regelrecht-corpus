        artikel: '1'
  - number: '2'
    text: |-
      1 De politie verwerkt gegevens met het oog op de informatievoorziening in het kader van de uitvoering van de
      politietaak in verband met:

      a. de opsporing en vervolging van verdachten van misdrijven;

      b. de verificatie van namen van verdachten van misdrijven;

      c. het vaststellen van de mate van recidive van verdachten van misdrijven;

      d. het vaststellen van de mate van recidive van verdachten van misdrijven of overtredingen,
      die in aanmerking komen voor een voorstel tot deelneming aan een project als bedoeld in
      [artikel 77e, eerste lid, van het Wetboek van Strafrecht][ref1];

      e. het opsporen van vermiste- of ontvreemde goederen;

      f. het opsporen van vermiste personen;

      g. de identificatie van onbekende personen;

      h. de bejegening van personen ter voorkoming van ernstig gevaar voor leven en gezondheid voor henzelf of bij de
      uitoefening van de politietaak betrokken personen.

      2 De korpschef draagt ervoor zorg dat de krachtens het eerste lid verwerkte gegevens langs geautomatiseerde weg
      aan de Koninklijke marechaussee beschikbaar kunnen worden gesteld. Daarbij wordt gebruik gemaakt van de centrale
      verwijzingsindex.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77e
    url: https://wetten.overheid.nl/BWBR0032083/2025-01-01#Artikel2
    references:
