  - number: '9'
    text: |-
      1 De nationale criminele-inlichtingeneenheid verwerkt:

      a. criminele-inlichtingen, voor zover deze gegevens van nationale of internationale betekenis zijn;

      b. personalia of bedrijfsgegevens van overeenkomstig
      [artikel 10, tweede lid, onderdelen a en b, van de Wet politiegegevens][ref1] geregistreerde personen in de
      centrale verwijzingsindex;

      c. codes die zijn toegewezen in het kader van de verwerking, bedoeld in [artikel 6][ref2].

      2 De nationale criminele-inlichtingeneenheid analyseert de gegevens, bedoeld in het eerste lid, onderdeel a, en
      verstrekt mede aan de hand daarvan de gegevens, bedoeld in het eerste lid, onderdelen a en b, aan hen die daarop
      bij of krachtens de [Wet politiegegevens][ref3] aanspraak kunnen maken.


      [ref1]: https://wetten.overheid.nl/BWBR0022463#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0032083#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0022463
    url: https://wetten.overheid.nl/BWBR0032083/2025-01-01#Artikel9
