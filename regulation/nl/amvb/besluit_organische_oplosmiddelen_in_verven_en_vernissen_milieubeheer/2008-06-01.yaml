preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van
    23 september 2005, nr. DJZ2005181912, Directie Juridische Zaken, Afdeling Wetgeving, gedaan mede namens de
    Staatssecretaris van Sociale Zaken en Werkgelegenheid en Onze Minister van Volksgezondheid, Welzijn en Sport;

    Gelet op richtlijn nr. 2004/42/EG van het Europees Parlement en de Raad van de Europese Unie van 21 april 2004
    inzake de beperking van emissies van vluchtige organische stoffen ten gevolge van het gebruik van organische
    oplosmiddelen in bepaalde verven en vernissen en producten voor het overspuiten van voertuigen, en tot wijziging
    van Richtlijn 1999/13/EG (PbEU L 143), op de artikelen 24 en 39, derde lid, van de Wet milieugevaarlijke stoffen en
    op artikel 8.44 van de Wet milieubeheer;

    De Raad van State gehoord (advies van 13 oktober 2005, nr. W08.05.0417/V);

    Gezien het nader rapport van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van
    21 november 2005, nr. DJZ2005202959, Directie Juridische Zaken, Afdeling Wetgeving, uitgebracht mede namens de
    Staatssecretaris van Sociale Zaken en Werkgelegenheid en Onze Minister van Volksgezondheid, Welzijn en Sport;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0019122/2008-06-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. [richtlijn 2004/42](32004L0042): [richtlijn nr. 2004/42/EG](32004L0042) van het Europees Parlement en de
      Raad van de Europese Unie van 21 april 2004 inzake de beperking van emissies van vluchtige organische stoffen
      ten gevolge van het gebruik van organische oplosmiddelen in bepaalde verven en vernissen en producten voor het
      overspuiten van voertuigen, en tot wijziging van [Richtlijn 1999/13/EG](31999L0013) (PbEU L 143);

      b. VOS: vluchtige organische stof (VOS) als bedoeld in artikel 2, onderdeel 5, van de richtlijn;

      c. VOS-gehalte: VOS-gehalte als bedoeld in artikel 2, onderdeel 6, van [richtlijn 2004/42](32004L0042);

      d. oplosmiddel: oplosmiddel als bedoeld in artikel 2, onderdeel 7, van [richtlijn 2004/42](32004L0042).
    url: https://wetten.overheid.nl/BWBR0019122/2008-06-01#Artikel1
  - number: '2'
    text: |-
      1 Het is verboden de producten, genoemd in de bij [richtlijn 2004/42](32004L0042) behorende bijlage I na de data,
      genoemd in de bij die richtlijn behorende bijlage II, in Nederland in te voeren of aan een ander ter beschikking te
      stellen, indien zij een VOS-gehalte hebben dat de grenswaarde, genoemd in die bijlage II, te boven gaat.

      2 Producten, genoemd in de bij [richtlijn 2004/42](32004L0042) behorende bijlage I, die niet onder het verbod van
      het eerste lid vallen, zijn voorzien van een etiket waarop worden vermeld:

      a. de subcategorie van het product en de betrokken VOS-grenswaarden in gram/liter, bedoeld in de bij [richtlijn
      2004/42](32004L0042) behorende bijlage II, en

      b. het maximale VOS-gehalte in gram/liter van het product in gebruiksklare vorm.

      3 Het eerste lid is van overeenkomstige toepassing op de producten, genoemd in de bij [richtlijn 2004/42]
      (32004L0042) behorende bijlage I, waaraan oplosmiddelen of andere bestanddelen die oplosmiddelen bevatten, worden
      toegevoegd om het product gebruiksklaar te maken.
    url: https://wetten.overheid.nl/BWBR0019122/2008-06-01#Artikel2
  - number: '3'
    text: |-
      1 Het verbod, bedoeld in [artikel 2][ref1], geldt niet voor producten die worden verhandeld om uitsluitend te
      worden gebruikt bij een activiteit die wordt verricht in een installatie die zich bevindt in een vergunningplichtige
      inrichting als bedoeld in [artikel 2 van het Oplosmiddelenbesluit omzetting EG-VOS-richtlijn milieubeheer][ref2].

      2 Het verbod, bedoeld in [artikel 2][ref3] geldt, tot de dag met ingang waarvan een jaar is verstreken na de data,
      genoemd in de bij [richtlijn 2004/42](32004L0042) behorende bijlage II, niet voor producten die niet voldoen aan de
      voorwaarden, bedoeld in [artikel 2][ref4] en die kennelijk zijn geproduceerd vóór die data.


      [ref1]: https://wetten.overheid.nl/BWBR0019122#Artikel2
