$id: besluit_organische_oplosmiddelen_in_verven_en_vernissen_milieubeheer
regulatory_layer: AMVB
publication_date: '2020-10-28'
valid_from: '2024-01-01'
bwb_id: BWBR0019122
url: https://wetten.overheid.nl/BWBR0019122/2024-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van
    23 september 2005, nr. DJZ2005181912, Directie Juridische Zaken, Afdeling Wetgeving, gedaan mede namens de
    Staatssecretaris van Sociale Zaken en Werkgelegenheid en Onze Minister van Volksgezondheid, Welzijn en Sport;

    Gelet op richtlijn nr. 2004/42/EG van het Europees Parlement en de Raad van de Europese Unie van 21 april 2004
    inzake de beperking van emissies van vluchtige organische stoffen ten gevolge van het gebruik van organische
    oplosmiddelen in bepaalde verven en vernissen en producten voor het overspuiten van voertuigen, en tot wijziging
    van Richtlijn 1999/13/EG (PbEU L 143), op de artikelen 24 en 39, derde lid, van de Wet milieugevaarlijke stoffen en
    op artikel 8.44 van de Wet milieubeheer;

    De Raad van State gehoord (advies van 13 oktober 2005, nr. W08.05.0417/V);

    Gezien het nader rapport van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van
    21 november 2005, nr. DJZ2005202959, Directie Juridische Zaken, Afdeling Wetgeving, uitgebracht mede namens de
    Staatssecretaris van Sociale Zaken en Werkgelegenheid en Onze Minister van Volksgezondheid, Welzijn en Sport;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0019122/2024-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0019122/2024-01-01#Artikel1
  - number: 1.a
    text: |-
      [richtlijn 2004/42](32004L0042): [richtlijn nr. 2004/42/EG](32004L0042) van het Europees Parlement en de Raad van
      de Europese Unie van 21 april 2004 inzake de beperking van emissies van vluchtige organische stoffen ten gevolge
      van het gebruik van organische oplosmiddelen in bepaalde verven en vernissen en producten voor het overspuiten van
      voertuigen, en tot wijziging van [Richtlijn 1999/13/EG](31999L0013) (PbEU L 143);
    url: https://wetten.overheid.nl/BWBR0019122/2024-01-01#Artikel1
  - number: 1.b
    text: 'VOS: vluchtige organische stof (VOS) als bedoeld in artikel 2, onderdeel 5, van de richtlijn;'
    url: https://wetten.overheid.nl/BWBR0019122/2024-01-01#Artikel1
  - number: 1.c
    text: 'VOS-gehalte: VOS-gehalte als bedoeld in artikel 2, onderdeel 6, van [richtlijn 2004/42](32004L0042);'
    url: https://wetten.overheid.nl/BWBR0019122/2024-01-01#Artikel1
  - number: 1.d
    text: 'oplosmiddel: oplosmiddel als bedoeld in artikel 2, onderdeel 7, van [richtlijn 2004/42](32004L0042);'
    url: https://wetten.overheid.nl/BWBR0019122/2024-01-01#Artikel1
  - number: 1.e
    text: 'marktdeelnemer: marktdeelnemer als bedoeld in artikel 3, onderdeel 13, van de EU-verordening markttoezicht;'
    url: https://wetten.overheid.nl/BWBR0019122/2024-01-01#Artikel1
  - number: 1.e
    text: |-
      installatie: vaste technische eenheid waarbinnen een of meer van de activiteiten, genoemd in
      [tabel 4.438a van het Besluit activiteiten leefomgeving][ref1], plaatsvinden en alle andere daar rechtstreeks mee
      samenhangende activiteiten die technisch verband houden met de binnen die eenheid verrichte activiteiten en van
      invloed kunnen zijn op emissies;


      [ref1]: https://wetten.overheid.nl/BWBR0041330#Artikel4
    url: https://wetten.overheid.nl/BWBR0019122/2024-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0041330
        artikel: '4'
  - number: 1.f
    text: |-
      aanbieder van diensten van de informatiemaatschappij: aanbieder van een dienst zoals gedefinieerd in artikel
      1, eerste lid, onderdeel b, van [Richtlijn (EU) 2015/1535](32015L1535) van het Europees Parlement en de Raad
      van 9 september 2015 betreffende een informatieprocedure op het gebied van technische voorschriften en regels
      betreffende de diensten van de informatiemaatschappij (PbEU 2015, L 241);
    url: https://wetten.overheid.nl/BWBR0019122/2024-01-01#Artikel1
  - number: 1.g
    text: |-
      op de markt aanbieden: op de markt aanbieden als bedoeld in artikel 3, onderdeel 1, van de EU-verordening
      markttoezicht.
    url: https://wetten.overheid.nl/BWBR0019122/2024-01-01#Artikel1
  - number: '2.1'
    text: |-
      Het is verboden de producten, genoemd in de bij [richtlijn 2004/42](32004L0042) behorende bijlage I na de data,
      genoemd in de bij die richtlijn behorende bijlage II, in Nederland in te voeren of aan een ander ter beschikking te
      stellen, indien zij een VOS-gehalte hebben dat de grenswaarde, genoemd in die bijlage II, te boven gaat.
    url: https://wetten.overheid.nl/BWBR0019122/2024-01-01#Artikel2
  - number: '2.2'
    text: |-
      Producten, genoemd in de bij [richtlijn 2004/42](32004L0042) behorende bijlage I, die niet onder het verbod van het
      eerste lid vallen, zijn voorzien van een etiket waarop worden vermeld:
    url: https://wetten.overheid.nl/BWBR0019122/2024-01-01#Artikel2
  - number: 2.2.a
    text: |-
      de subcategorie van het product en de betrokken VOS-grenswaarden in gram/liter, bedoeld in de bij [richtlijn
      2004/42](32004L0042) behorende bijlage II, en
    url: https://wetten.overheid.nl/BWBR0019122/2024-01-01#Artikel2
  - number: 2.2.b
    text: het maximale VOS-gehalte in gram/liter van het product in gebruiksklare vorm.
    url: https://wetten.overheid.nl/BWBR0019122/2024-01-01#Artikel2
  - number: '2.3'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de producten, genoemd in de bij [richtlijn 2004/42](32004L0042)
      behorende bijlage I, waaraan oplosmiddelen of andere bestanddelen die oplosmiddelen bevatten, worden toegevoegd om
      het product gebruiksklaar te maken.
    url: https://wetten.overheid.nl/BWBR0019122/2024-01-01#Artikel2
  - number: '3.1'
    text: |-
      Het verbod, bedoeld in [artikel 2][ref1], geldt niet voor producten die worden verhandeld om uitsluitend te worden
      gebruikt bij een activiteit die wordt verricht in een installatie die zich bevindt op een locatie waarop een
      milieubelastende activiteit die is aangewezen in [hoofdstuk 3 van het Besluit activiteiten leefomgeving][ref2]
      wordt verricht, voor zover zich op die locatie een installatie bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0019122#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0041330#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0019122/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0019122
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0041330
        hoofdstuk: '3'
  - number: '3.2'
    text: |-
      Het verbod, bedoeld in [artikel 2][ref1] geldt, tot de dag met ingang waarvan een jaar is verstreken na de data,
      genoemd in de bij [richtlijn 2004/42](32004L0042) behorende bijlage II, niet voor producten die niet voldoen aan de
      voorwaarden, bedoeld in artikel 2 en die kennelijk zijn geproduceerd vóór die data.


      [ref1]: https://wetten.overheid.nl/BWBR0019122#Artikel2
    url: https://wetten.overheid.nl/BWBR0019122/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0019122
        artikel: '2'
  - number: 3a.1
    text: |-
      Het is marktdeelnemers die betrokken zijn of zijn geweest bij het op de markt aanbieden van producten, bedoeld in
      artikel 2, verboden te handelen in strijd met artikel 7, eerste lid, van de EU-verordening markttoezicht.
    url: https://wetten.overheid.nl/BWBR0019122/2024-01-01#Artikel3a
  - number: 3a.2
    text: |-
      Het is een aanbieder van diensten van de informatiemaatschappij die betrokken is of is geweest bij het online te
      koop aanbieden van producten, bedoeld in artikel 2, verboden te handelen in strijd met artikel 7, tweede lid, van
      de EU-verordening markttoezicht.
    url: https://wetten.overheid.nl/BWBR0019122/2024-01-01#Artikel3a
  - number: '4'
    text: |-
      De methoden, genoemd in de bij [richtlijn 2004/42](32004L0042) behorende bijlage III, worden gebruikt om vast te
      stellen of het VOS-gehalte van de producten, genoemd in de bij die richtlijn behorende bijlage I, voldoet aan de
      grenswaarden, genoemd in de bij die richtlijn behorende bijlage II.
    url: https://wetten.overheid.nl/BWBR0019122/2024-01-01#Artikel4
  - number: '5.1'
    text: |-
      Een wijziging van [richtlijn 2004/42](32004L0042) gaat voor de toepassing van [artikel 1][ref1] gelden met ingang
      van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij ministerieel
      besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0019122#Artikel1
    url: https://wetten.overheid.nl/BWBR0019122/2024-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0019122
        artikel: '1'
  - number: '5.2'
    text: |-
      Een wijziging van een van de bijlagen bij [richtlijn 2004/42](32004L0042) gaat voor de toepassing van dit besluit
      gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij
      ministerieel besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0019122/2024-01-01#Artikel5
  - number: 6a
    text: |-
      Dit besluit berust mede op de [artikelen 9.2.2.1][ref1] en [9.2.3.2 van de Wet milieubeheer][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0019122/2024-01-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '9'
  - number: '7'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0019122/2024-01-01#Artikel7
  - number: '8'
    text: 'Dit besluit wordt aangehaald als: Besluit organische oplosmiddelen in verven en vernissen milieubeheer.'
    url: https://wetten.overheid.nl/BWBR0019122/2024-01-01#Artikel8
