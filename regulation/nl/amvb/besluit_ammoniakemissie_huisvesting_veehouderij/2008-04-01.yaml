articles:
  - number: '1'
    text: |-
      1 In dit besluit wordt verstaan onder:

      *ammoniakemissie*: emissie van ammoniak, uitgedrukt in kg NH per jaar;

      *bouwvergunning*: vergunning krachtens [artikel 40, eerste lid, van de Woningwet][ref1];

      *bijlage*: bij dit besluit behorende [bijlage][ref2];

      *diercategorie*: in de [bijlagen][ref3] gehanteerde aanduiding, binnen hoofdcategorieën, van dieren;

      *dierenverblijf*: al dan niet overdekte ruimte waarbinnen dieren worden gehouden;

      *dierplaats*: deel van een huisvestingssysteem, bestemd voor het houden van één dier;

      *emissiefactor*: ammoniakemissie per dierplaats, zoals bepaald krachtens
      [artikel 1, eerste lid, van de Wet ammoniak en veehouderij][ref4];

      *Groen-Labelstalsysteem*: huisvestingssysteem dat voldoet aan de omschrijving van een stalsysteem waarvoor een
      Groen Label als bedoeld in artikel 1, eerste lid, onder a, van het Convenant Groen Label (Stcrt. 1993, 21) is
      verleend;

      *huisvestingssysteem*: gedeelte van een dierenverblijf waarin dieren van één diercategorie op dezelfde wijze worden
      gehouden;

      *veehouderij*: inrichting die tot een krachtens [artikel 1.1, derde lid, van de Wet milieubeheer ][ref5]aangewezen
      categorie behoort en is bestemd voor het kweken, fokken, mesten, houden, verhandelen, verladen of wegen van dieren;

      *vergunning*: vergunning krachtens [artikel 8.1, eerste lid, van de Wet milieubeheer][ref6].

      2 Voor de toepassing van dit besluit wordt onder een bestaand huisvestingssysteem verstaan:

      a. een huisvestingssysteem dat op het tijdstip van inwerkingtreding van dit besluit in de veehouderij aanwezig was;

      b. een huisvestingssysteem dat op het tijdstip van inwerkingtreding van dit besluit nog niet in de veehouderij
      aanwezig was, maar waarvoor op dat tijdstip wel een vergunning of, indien geen vergunning vereist was, een
      bouwvergunning was verleend;

      c. een huisvestingssysteem dat ontstaat door verandering van een huisvestingssysteem als bedoeld onder a of b,
      mits de emissiefactor van dat systeem niet hoger is dan die van het oorspronkelijke huisvestingssysteem en slechts
      voorzover het aantal dierplaatsen niet wordt uitgebreid;

      d. een huisvestingssysteem dat ontstaat door verandering van een huisvestingssysteem als bedoeld onder a of b,
      waarbij die verandering bestaat uit aanpassing van het systeem in verband met de wettelijke voorschriften op het
      gebied van dierenwelzijn en slechts voorzover het aantal dierplaatsen niet wordt uitgebreid; of

      e. een huisvestingssysteem dat ontstaat door verandering van een huisvestingssysteem als bedoeld onder a of
      b, waarbij die verandering bestaat uit het huisvesten van dieren van een andere diercategorie die tot dezelfde
      hoofdcategorie behoort, op voorwaarde dat de ammoniakemissie niet toeneemt en slechts voorzover het vloeroppervlak
      niet wordt vergroot.


