  - number: '3'
    text: |-
      1 Voor de diercategorie melk- en kalfkoeien ouder dan 2 jaar is [artikel 2][ref1] niet van toepassing ten
      aanzien van een bestaand huisvestingssysteem en evenmin ten aanzien van de uitbreiding daarvan, zolang het aantal
      dierplaatsen als gevolg van de uitbreiding met niet meer dan 20 toeneemt ten opzichte van het aantal dat aanwezig
      was op het tijdstip van inwerkingtreding van dit besluit.

      2 [Artikel 2][ref2] is evenmin van toepassing voorzover het betreft een diercategorie waarvan in de veehouderij
      niet meer dieren worden gehouden dan het aantal dat in [bijlage 1][ref3] voor die diercategorie is aangegeven.

      3 [Artikel 2][ref4] is voorts niet van toepassing indien de dieren worden gehouden overeenkomstig de biologische
      productiemethoden, zoals bedoeld in het Landbouwkwaliteitsbesluit biologische productiemethode, of overeenkomstig
      de Algemene Voorwaarden PVV-regeling scharrelvarkens.


      [ref1]: https://wetten.overheid.nl/BWBR0019211#Artikel2
