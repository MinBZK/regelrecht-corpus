        artikel: 2a
  - number: 2a
    text: |-
      1 Indien tot een in [artikel 2, eerste lid][ref1], bedoelde veehouderij een gpbv-installatie behoort en met de in
      [artikel 2, eerste lid][ref2], bedoelde maximale emissiewaarde niet wordt voldaan aan de [artikelen 8.8][ref3] en
      [8.11, derde lid, van de Wet milieubeheer][ref4], stelt het bevoegd gezag voor een tot de gpbv-installatie behorend
      huisvestingssysteem een strengere emissiewaarde vast.

      2 Indien tot een in [artikel 2, eerste lid][ref5], bedoelde veehouderij een gpbv-installatie behoort en met de in
      [artikel 4, eerste lid][ref6], bedoelde tijdstippen voor de aanpassing van een bestaand huisvestingssysteem niet
      wordt voldaan aan de [artikelen 8.8][ref7] en [8.11, derde lid, van de Wet milieubeheer][ref8], stelt het bevoegd
      gezag voor een tot de gpbv-installatie behorend huisvestingssysteem een eerder tijdstip vast.


