  - number: '4'
    text: |-
      1 Onverminderd [artikel 3 ][ref1]is voor de in [bijlage 2][ref2] vermelde diercategorieën
      [artikel 2, eerste lid][ref3], ten aanzien van een bestaand huisvestingssysteem niet van toepassing tot 1 januari
      2010, tenzij in die bijlage anders is aangegeven, dan wel tot het tijdstip dat het bevoegd gezag heeft vastgesteld
      op grond van [artikel 2a, tweede lid][ref4].

      2 Zolang van een diercategorie niet meer dieren worden gehouden dan het aantal dat in [bijlage 2 ][ref5]voor die
      diercategorie is aangegeven, geldt in afwijking van het eerste lid voor die diercategorie als datum 1 januari 2013.


