  - number: '2'
    text: |-
      1 Indien in een veehouderij dieren worden gehuisvest van een diercategorie waarvoor in [bijlage 1][ref1]
      een maximale emissiewaarde is aangegeven, worden voor die dieren geen huisvestingssystemen toegepast met een
      emissiefactor die hoger is dan deze maximale emissiewaarde dan wel de emissiewaarde die het bevoegd gezag heeft
      vastgesteld op grond van [artikel 2a, eerste lid][ref2].

      2 Aan het eerste lid wordt ook voldaan indien de som van de ammoniakemissies uit de tot de veehouderij behorende
      huisvestingssystemen niet groter is dan de som van de ammoniakemissies die deze huisvestingssystemen zouden
      veroorzaken indien voldaan wordt aan het eerste lid. Een huisvestingssysteem dat op 1 januari 2007 nog niet in de
      veehouderij aanwezig was, voldoet afzonderlijk aan het eerste lid.

      3 In afwijking van het eerste lid geldt ten aanzien van een bestaand Groen-Labelstalsysteem waarvan de
      emissiefactor hoger is dan de maximale emissiewaarde bedoeld in het eerste lid en waarvoor een vergunning of,
      indien geen vergunning vereist was, een bouwvergunning is verleend voor 8 mei 2002, die emissiefactor als maximale
      emissiewaarde.

      4 Het derde lid is van overeenkomstige toepassing ten aanzien van een huisvestingssysteem waarvoor een bijzondere
      emissiefactor is vastgesteld als bedoeld in artikel 4a, eerste lid, van de Uitvoeringsregeling ammoniak en
      veehouderij.


      [ref1]: https://wetten.overheid.nl/BWBR0019211
      [ref2]: https://wetten.overheid.nl/BWBR0019211#Artikel2a
