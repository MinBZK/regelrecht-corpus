    Gelet op artikel 8.44 van de Wet milieubeheer;

    De Raad van State gehoord (advies van 27 juli 2004, nr. W08.04.0181/V);

    Gezien het nader rapport van Onze Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van
    6 december 2005, nr. DJZ 2005210447, Directie Juridische Zaken, afdeling Wetgeving, uitgebracht in overeenstemming
    met Onze Minister van Landbouw, Natuur en Voedselkwaliteit;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0019211/2014-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In dit besluit wordt verstaan onder: *ammoniakemissie*: emissie van ammoniak, uitgedrukt in kg NH per jaar;
      *bouwvergunning*: vergunning krachtens [artikel 40, eerste lid, van de Woningwet][ref1]; *bijlage*: bij dit besluit
      behorende [bijlage][ref2]; *diercategorie*: in de [bijlagen][ref3] gehanteerde aanduiding, binnen hoofdcategorieën,
      van dieren; *dierenverblijf*: al dan niet overdekte ruimte waarbinnen dieren worden gehouden; *dierplaats*:
      deel van een huisvestingssysteem, bestemd voor het houden van één dier; *emissiefactor*: ammoniakemissie
      per dierplaats, zoals bepaald krachtens [artikel 1, eerste lid, van de Wet ammoniak en veehouderij][ref4];
      *Groen-Labelstalsysteem*: huisvestingssysteem dat voldoet aan de omschrijving van een stalsysteem
      waarvoor een Groen Label als bedoeld in artikel 1, eerste lid, onder a, van het Convenant Groen Label
      (Stcrt. 1993, 21) is verleend; *huisvestingssysteem*: gedeelte van een dierenverblijf waarin dieren van
      één diercategorie op dezelfde wijze worden gehouden; *veehouderij*: inrichting die tot een krachtens
      [artikel 1.1, derde lid, van de Wet milieubeheer ][ref5]aangewezen categorie behoort en is bestemd voor het kweken,
      fokken, mesten, houden, verhandelen, verladen of wegen van dieren; *vergunning*: omgevingsvergunning voor een
      inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0019211
      [ref3]: https://wetten.overheid.nl/BWBR0019211
      [ref4]: https://wetten.overheid.nl/BWBR0013402#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0019211/2014-07-01#Artikel1
    references:
