  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 27 april
    2004, nr. MJZ2004041833, Centrale Directie Juridische Zaken, Afdeling Wetgeving, gedaan in overeenstemming met Onze
