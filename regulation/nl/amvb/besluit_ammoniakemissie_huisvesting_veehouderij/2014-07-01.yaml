        artikel: '1'
  - number: '1.2'
    text: 'Voor de toepassing van dit besluit wordt onder een bestaand huisvestingssysteem verstaan:'
    url: https://wetten.overheid.nl/BWBR0019211/2014-07-01#Artikel1
  - number: 1.2.a
    text: een huisvestingssysteem dat op het tijdstip van inwerkingtreding van dit besluit in de veehouderij aanwezig was;
    url: https://wetten.overheid.nl/BWBR0019211/2014-07-01#Artikel1
  - number: 1.2.b
    text: |-
      een huisvestingssysteem dat op het tijdstip van inwerkingtreding van dit besluit nog niet in de veehouderij
      aanwezig was, maar waarvoor op dat tijdstip wel een vergunning of, indien geen vergunning vereist was, een
      bouwvergunning was verleend;
    url: https://wetten.overheid.nl/BWBR0019211/2014-07-01#Artikel1
  - number: 1.2.c
    text: |-
      een huisvestingssysteem dat ontstaat door verandering van een huisvestingssysteem als bedoeld onder a of b, mits
      de emissiefactor van dat systeem niet hoger is dan die van het oorspronkelijke huisvestingssysteem en slechts
      voorzover het aantal dierplaatsen niet wordt uitgebreid;
    url: https://wetten.overheid.nl/BWBR0019211/2014-07-01#Artikel1
  - number: 1.2.d
    text: |-
      een huisvestingssysteem dat ontstaat door verandering van een huisvestingssysteem als bedoeld onder a of b, waarbij
      die verandering bestaat uit aanpassing van het systeem in verband met de wettelijke voorschriften op het gebied van
      dierenwelzijn en slechts voorzover het aantal dierplaatsen niet wordt uitgebreid; of
    url: https://wetten.overheid.nl/BWBR0019211/2014-07-01#Artikel1
  - number: 1.2.e
    text: |-
      een huisvestingssysteem dat ontstaat door verandering van een huisvestingssysteem als bedoeld onder a of b, waarbij
      die verandering bestaat uit het huisvesten van dieren van een andere diercategorie die tot dezelfde hoofdcategorie
      behoort, op voorwaarde dat de ammoniakemissie niet toeneemt en slechts voorzover het vloeroppervlak niet wordt
      vergroot.
    url: https://wetten.overheid.nl/BWBR0019211/2014-07-01#Artikel1
  - number: '2.1'
    text: |-
      Indien in een veehouderij dieren worden gehuisvest van een diercategorie waarvoor in [bijlage 1][ref1] een maximale
      emissiewaarde is aangegeven, worden voor die dieren geen huisvestingssystemen toegepast met een emissiefactor die
      hoger is dan deze maximale emissiewaarde dan wel de emissiewaarde die het bevoegd gezag heeft vastgesteld op grond
      van [artikel 2a, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019211
      [ref2]: https://wetten.overheid.nl/BWBR0019211#Artikel2a
    url: https://wetten.overheid.nl/BWBR0019211/2014-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0019211
      - id: ref2
        bwb_id: BWBR0019211
        artikel: 2a
  - number: '2.2'
    text: |-
      Aan het eerste lid wordt ook voldaan indien de som van de ammoniakemissies uit de tot de veehouderij behorende
      huisvestingssystemen niet groter is dan de som van de ammoniakemissies die deze huisvestingssystemen zouden
      veroorzaken indien voldaan wordt aan het eerste lid. Een huisvestingssysteem dat op 1 januari 2007 nog niet in de
      veehouderij aanwezig was, voldoet afzonderlijk aan het eerste lid.
    url: https://wetten.overheid.nl/BWBR0019211/2014-07-01#Artikel2
  - number: '2.3'
    text: |-
      In afwijking van het eerste lid geldt ten aanzien van een bestaand Groen-Labelstalsysteem waarvan de emissiefactor
      hoger is dan de maximale emissiewaarde bedoeld in het eerste lid en waarvoor een vergunning of, indien
      geen vergunning vereist was, een bouwvergunning is verleend voor 8 mei 2002, die emissiefactor als maximale
      emissiewaarde.
    url: https://wetten.overheid.nl/BWBR0019211/2014-07-01#Artikel2
  - number: '2.4'
    text: |-
      Het derde lid is van overeenkomstige toepassing ten aanzien van een huisvestingssysteem waarvoor een bijzondere
      emissiefactor is vastgesteld als bedoeld in artikel 4a, eerste lid, van de Uitvoeringsregeling ammoniak en
      veehouderij.
    url: https://wetten.overheid.nl/BWBR0019211/2014-07-01#Artikel2
  - number: 2a.1
    text: |-
      Indien tot een in [artikel 2, eerste lid][ref1], bedoelde veehouderij een IPPC-installatie behoort en met de in
      [artikel 2, eerste lid][ref2], bedoelde maximale emissiewaarde niet wordt voldaan aan het bepaalde bij of krachtens
      de [artikelen 2.14][ref3] en [2.22 van de Wet algemene bepalingen omgevingsrecht][ref4], stelt het bevoegd gezag
      voor een tot de IPPC-installatie behorend huisvestingssysteem een strengere emissiewaarde vast.


      [ref1]: https://wetten.overheid.nl/BWBR0019211#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019211#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0019211/2014-07-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0019211
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0019211
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 2a.2
    text: |-
      Indien tot een in [artikel 2, eerste lid][ref1], bedoelde veehouderij een IPPC-installatie behoort
      en met de in [artikel 4, eerste lid][ref2], bedoelde tijdstippen voor de aanpassing van een bestaand
      huisvestingssysteem niet wordt voldaan aan het bepaalde bij of krachtens de [artikelen 2.14][ref3] en
      [2.22 van de Wet algemene bepalingen omgevingsrecht][ref4], stelt het bevoegd gezag voor een tot de IPPC-
      installatie behorend huisvestingssysteem een eerder tijdstip vast.


      [ref1]: https://wetten.overheid.nl/BWBR0019211#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019211#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0019211/2014-07-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0019211
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0019211
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0024779
        artikel: '2'
  - number: '3.1'
    text: |-
      Voor de diercategorie melk- en kalfkoeien ouder dan 2 jaar is [artikel 2][ref1] niet van toepassing ten aanzien van
      een bestaand huisvestingssysteem en evenmin ten aanzien van de uitbreiding daarvan, zolang het aantal dierplaatsen
      als gevolg van de uitbreiding met niet meer dan 20 toeneemt ten opzichte van het aantal dat aanwezig was op het
      tijdstip van inwerkingtreding van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0019211#Artikel2
    url: https://wetten.overheid.nl/BWBR0019211/2014-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0019211
        artikel: '2'
  - number: '3.2'
    text: |-
      [Artikel 2][ref1] is evenmin van toepassing voorzover het betreft een diercategorie waarvan in de veehouderij niet
      meer dieren worden gehouden dan het aantal dat in [bijlage 1][ref2] voor die diercategorie is aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0019211#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019211
    url: https://wetten.overheid.nl/BWBR0019211/2014-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0019211
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0019211
  - number: '3.3'
    text: |-
      [Artikel 2][ref1] is voorts niet van toepassing indien de dieren worden gehouden overeenkomstig de biologische
      productiemethoden, zoals bedoeld in het Landbouwkwaliteitsbesluit biologische productiemethode, of overeenkomstig
      de Algemene Voorwaarden PVV-regeling scharrelvarkens.


      [ref1]: https://wetten.overheid.nl/BWBR0019211#Artikel2
    url: https://wetten.overheid.nl/BWBR0019211/2014-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0019211
        artikel: '2'
  - number: '4.1'
    text: |-
      Onverminderd [artikel 3 ][ref1]is voor de in [bijlage 2][ref2] vermelde diercategorieën
      [artikel 2, eerste lid][ref3], ten aanzien van een bestaand huisvestingssysteem niet van toepassing tot 1 januari
      2010, tenzij in die bijlage anders is aangegeven, dan wel tot het tijdstip dat het bevoegd gezag heeft vastgesteld
      op grond van [artikel 2a, tweede lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0019211#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0019211
      [ref3]: https://wetten.overheid.nl/BWBR0019211#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0019211#Artikel2a
    url: https://wetten.overheid.nl/BWBR0019211/2014-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0019211
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0019211
      - id: ref3
        bwb_id: BWBR0019211
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0019211
        artikel: 2a
  - number: '4.2'
    text: |-
      Zolang van een diercategorie niet meer dieren worden gehouden dan het aantal dat in [bijlage 2 ][ref1]voor die
      diercategorie is aangegeven, geldt in afwijking van het eerste lid voor die diercategorie als datum 1 januari 2013.


      [ref1]: https://wetten.overheid.nl/BWBR0019211
    url: https://wetten.overheid.nl/BWBR0019211/2014-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0019211
  - number: '5'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0019211/2014-07-01#Artikel5
  - number: '6'
    text: 'Dit besluit wordt aangehaald als: Besluit ammoniakemissie huisvesting veehouderij.'
    url: https://wetten.overheid.nl/BWBR0019211/2014-07-01#Artikel6
