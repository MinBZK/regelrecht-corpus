articles:
  - number: '1.1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - *bemeterd leverpunt:* punt voor levering
      van gasvormige brandstof of elektriciteit voorzien van een voertuigaansluiting en een meter die de hoeveelheid van
      de levering meet;
        - *dubbeltellingverificateur:* verificateur als bedoeld in [artikel 9.7.4.8, tweede lid, van de wet][ref1];
        - *dubbeltellingverificatie:* verificatie als bedoeld in [artikel 9.7.4.8, tweede lid, van de wet][ref2];
        - *dubbeltellingverklaring:* verklaring als bedoeld in [artikel 9.7.4.8, tweede lid, van de wet][ref3];
        - *inboekverificateur:* verificateur als bedoeld in [artikel 9.7.4.12, eerste lid, van de wet][ref4];
        - *inboekverificatie:* verificatie als bedoeld in [artikel 9.7.4.12, eerste lid, van de wet][ref5];
        - *inboekverificatieverklaring:* verklaring als bedoeld in [artikel 9.7.4.12, eerste lid, van de wet][ref6];
        - *materiële onjuistheid:* onjuistheid die volgens de verificateur, afzonderlijk of in combinatie met andere
      onjuistheden, de gestelde materialiteitsgrens overschrijdt;
        - *materialiteitsgrens:* kwantitatieve drempel of grenswaarde waarboven onjuistheden, afzonderlijk of in combinatie
      met andere onjuistheden, door de verificateur als materieel worden beschouwd;
        - *Raad voor Accreditatie:* Raad voor Accreditatie als bedoeld in
      [artikel 1, onderdeel e, van de Wet aanwijzing nationale accreditatie-instantie][ref7];
        - *rekeninghouder:* onderneming die beschikt over een rekening als bedoeld in [artikel 9.7.5.3 van de wet][ref8];
        - *verificateur hernieuwbare brandstof:* verificateur als bedoeld in
      [artikel 9.7.4.4, tweede lid, van de wet][ref9];
        - *verificatie hernieuwbare brandstof:* verificatie als bedoeld in [artikel 9.7.4.4, tweede lid, van de wet][ref10];
        - *verificatieverklaring hernieuwbare brandstof:* verklaring als bedoeld in
      [artikel 9.7.4.4, tweede lid, van de wet][ref11];
        - *wet:* [Wet milieubeheer][ref12].


