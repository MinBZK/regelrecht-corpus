  - number: '1.2'
    text: |-
      De in [titel 9.7 van de wet][ref1] opgenomen bepalingen met betrekking tot de leverancier tot eindverbruik
      zijn niet van toepassing op de leverancier tot eindverbruik over het kalenderjaar dat hij minder dan 500.000
      liter benzine, diesel, vloeibare biobrandstof en vloeibare hernieuwbare brandstof tot eindverbruik levert aan
      wegvoertuigen of spoorvoertuigen in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '2.1'
    text: |-
      Het gedeelte, bedoeld in [artikel 9.7.2.1 van de wet][ref1], is voor het kalenderjaar:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel2.1
    references:
