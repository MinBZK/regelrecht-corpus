    text: 2020 10 procent.
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel2.1
  - number: 2.2.1
    text: |-
      Een ambtshalve inschatting als bedoeld in [artikel 9.7.2.4, eerste of tweede lid, van de wet][ref1], wordt gemaakt
      op basis van een redelijke inschatting, waarbij het bestuur van de emissieautoriteit zich in ieder geval baseert
      op de gegevens van de rijksbelastingdienst over de hoeveelheid benzine, diesel, vloeibare biobrandstof of vloeibare
      hernieuwbare brandstof die is vermeld in de aangifte, bedoeld in [artikel 53 van de Wet op de accijns][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel53
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '53'
  - number: 2.2.2
    text: |-
      Voor de toepassing van [artikel 9.7.2.4 van de wet][ref1] wordt een hoeveelheid benzine, diesel, vloeibare
      biobrandstof of vloeibare hernieuwbare brandstof, die is uitgeslagen tot verbruik als bedoeld in de Wet op de
      accijns aangemerkt als geleverd aan wegvoertuigen of spoorvoertuigen in Nederland, tenzij de leverancier tot
      eindverbruik aantoont dat die hoeveelheid is uitgeslagen tot verbruik voor andere doeleinden.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: 3.1.1
    text: |-
      Vloeibare biobrandstof die wordt ingeboekt in het register voldeed op het tijdstip van leveren aan de Nederlandse
      markt voor vervoer aan de geldende duurzaamheidseisen, genoemd in artikel 17, tweede tot en met zesde lid, van de
      richtlijn hernieuwbare energie.
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel3.1
  - number: 3.1.2
    text: |-
      In afwijking van het eerste lid voldeed vloeibare biobrandstof die vervaardigd is uit niet van landbouw,
      aquacultuur, visserij of bosbouw afkomstige afvalstoffen en residuen op het tijdstip van leveren aan de Nederlandse
      markt voor vervoer aan de geldende duurzaamheidseisen, genoemd in artikel17, tweede lid, van de richtlijn
      hernieuwbare energie.
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel3.1
  - number: 3.2.1
    text: |-
      Gasvormige biobrandstof die wordt ingeboekt in het register voldeed op het tijdstip van leveren aan vervoer in
      Nederland aan de geldende duurzaamheidseisen, genoemd in artikel 17, tweede tot en met zesde lid, van de richtlijn
      hernieuwbare energie.
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel3.2
  - number: 3.2.2
    text: |-
      In afwijking van het eerste lid voldeed gasvormige biobrandstof die vervaardigd is uit niet van landbouw,
      aquacultuur, visserij of bosbouw afkomstige afvalstoffen en residuen op het tijdstip van leveren aan vervoer in
      Nederland aan de geldende duurzaamheidseisen, genoemd in artikel 17, tweede lid, van de richtlijn hernieuwbare
      energie.
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel3.2
  - number: 3.2.3
    text: Voor gasvormige biobrandstof die wordt ingeboekt in het register is geen subsidie betaald.
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel3.2
  - number: 3.2.4
    text: |-
      De gasvormige biobrandstof die wordt ingeboekt in het register is geleverd via een bemeterd leverpunt dat gekoppeld
      is aan de aansluiting, bedoeld in [artikel 3.3, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035839#Artikel3
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0035839
        artikel: '3'
        paragraaf: '3'
  - number: 3.3.1
    text: |-
      Aan vervoer in Nederland geleverde gasvormige biobrandstof kan slechts worden ingeboekt in het register door de
      afnemer als bedoeld in [artikel 1, eerste lid, onderdeel o, van de Gaswet][ref1] die een aansluiting als bedoeld
      in artikel 1, eerste lid, onderdeel m, van die wet heeft die uitsluitend bestemd is voor de levering van gas aan
      vervoer in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel1
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: '1'
  - number: 3.3.2
    text: |-
      Aan wegvoertuigen in Nederland geleverde elektriciteit kan slechts worden ingeboekt in het register door de afnemer
      als bedoeld in [artikel 1, eerste lid, onderdeel c, van de Elektriciteitswet 1998][ref1] die een aansluiting als
      bedoeld in artikel 1, eerste lid, onderdeel b, van die wet heeft die uitsluitend bestemd is voor de levering van
      elektriciteit aan wegvoertuigen in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel1
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '1'
  - number: 3.4.1
    text: |-
      Voor vloeibare hernieuwbare brandstof die wordt ingeboekt in het register en voor de energie uit hernieuwbare bron
      met behulp waarvan die hernieuwbare brandstof is geproduceerd, is geen subsidie betaald.
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel3.4
  - number: 3.4.2
    text: |-
      Vloeibare hernieuwbare brandstof die niet door de producent wordt ingeboekt in het register is door de producent
      direct geleverd aan de inboeker.
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel3.4
  - number: '3.5'
    text: |-
      Elektriciteit die wordt ingeboekt in het register is geleverd via een bemeterd leverpunt dat is gekoppeld aan de
      aansluiting, bedoeld in [artikel 3.3, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035839#Artikel3
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0035839
        artikel: '3'
        paragraaf: '3'
  - number: 3.6.1
    text: |-
      De energie-inhoud van biobrandstof die is geproduceerd uit afval, residuen, non-food cellulosemateriaal of
      lignocellulosisch materiaal wordt in het register bij inboeking vermenigvuldigd met een bij ministeriële regeling
      bepaalde factor die verschillend kan zijn voor de verschillende grondstoffen.
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel3.6
  - number: 3.6.2
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld over afval, residuen, non-food cellulose materiaal en
      lignocellulosisch materiaal als bedoeld in het eerste lid,
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel3.6
  - number: 3.7.1
    text: |-
      Het bestuur van de emissieautoriteit kan met toepassing van [artikel 9.7.4.11, eerste lid, van de wet][ref1] het
      bijschrijven van hernieuwbare brandstofeenheden voor ten hoogste vier weken opschorten. Het bestuur doet van de
      opschorting onmiddellijk mededeling aan de inboeker.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: 3.7.2
    text: |-
      Het bestuur van de emissieautoriteit beslist binnen de termijn, bedoeld in het eerste lid, over de bijschrijving
      van de hernieuwbare brandstofeenheden. Indien niet binnen die termijn is beslist, schrijft het bestuur de
      hernieuwbare brandstofeenheden bij op de rekening van de inboeker.
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel3.7
  - number: 3.7.3
    text: |-
      De termijn, bedoeld in het eerste lid, kan eenmaal met ten hoogste vier weken worden verlengd. Het tweede lid is
      van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel3.7
  - number: '4.1'
    text: |-
      De verificateur hernieuwbare brandstof voert de verificatiewerkzaamheden op een onbevangen en onpartijdige wijze
      uit en is voor het onderdeel hernieuwbare brandstof van het werkveld hernieuwbare energie vervoer:
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel4.1
  - number: 4.1.a
    text: geaccrediteerd door de Raad voor Accreditatie;
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel4.1
  - number: 4.1.b
    text: |-
      geaccrediteerd door een nationale accreditatie-instantie als bedoeld in artikel 4, eerste lid, van verordening
      (EG) nr. 765/2008 van het Europees Parlement en de Raad van de Europese Unie van 9 juli 2008 tot vaststelling
      van de eisen inzake accreditatie en markttoezicht betreffende het verhandelen van producten en tot intrekking van
      [Verordening (EEG) 339/93](31993R0339) (PbEU 2008, L 218), of
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel4.1
  - number: 4.1.c
    text: |-
      aantoonbaar een accreditatieprocedure gestart bij een instelling als bedoeld in onderdeel a of b maar waarvoor de
      procedure nog niet is afgerond.
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel4.1
  - number: 4.2.1
    text: |-
      De verificateur hernieuwbare brandstof verkrijgt een redelijke mate van zekerheid dat de in de
      verificatieverklaring hernieuwbare brandstof verantwoorde hernieuwbare brandstof geen materiële afwijkingen
      bevat. De verificateur hernieuwbare brandstof verzamelt hiervoor toereikende controle-informatie en zorgt voor een
      aanvaardbaar laag controlerisico.
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel4.2
  - number: 4.2.2
    text: 'De verificateur hernieuwbare brandstof toetst met een materialiteitsgrens van twee procent:'
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel4.2
  - number: 4.2.2.a
    text: het hernieuwbare karakter van de bij de productie van de brandstof gebruikte bronnen, en
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel4.2
  - number: 4.2.2.b
    text: |-
      dat de hoeveelheid ingeboekte hernieuwbare brandstof niet groter is dan de hoeveelheid door de producent aan de
      inboeker geleverde hernieuwbare brandstof.
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel4.2
  - number: '4.3'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld over de verificatie hernieuwbare brandstof.
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel4.3
  - number: '4.4'
    text: |-
      De dubbeltellingverificateur voert de verificatiewerkzaamheden op een onbevangen en onpartijdige wijze uit en is
      voor het onderdeel dubbeltelling van het werkveld hernieuwbare energie vervoer:
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel4.4
  - number: 4.4.a
    text: geaccrediteerd door de Raad voor Accreditatie;
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel4.4
  - number: 4.4.b
    text: |-
      geaccrediteerd door een nationale accreditatie-instantie als bedoeld in artikel 4, eerste lid, van verordening
      (EG) nr. 765/2008 van het Europees Parlement en de Raad van de Europese Unie van 9 juli 2008 tot vaststelling
      van de eisen inzake accreditatie en markttoezicht betreffende het verhandelen van producten en tot intrekking van
      [Verordening (EEG) 339/93](31993R0339) (PbEU 2008, L 218), of
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel4.4
  - number: 4.4.c
    text: |-
      aantoonbaar een accreditatieprocedure gestart bij een instelling als bedoeld in onderdeel a of b maar waarvoor de
      procedure nog niet is afgerond.
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel4.4
  - number: 4.5.1
    text: |-
      De dubbeltellingverificateur verkrijgt een redelijke mate van zekerheid dat de in de dubbeltellingverklaring
      verantwoorde biobrandstof geen materiële afwijkingen bevat. De dubbeltellingverificateur verzamelt hiervoor
      toereikende controle-informatie en zorgt voor een aanvaardbaar laag controlerisico.
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel4.5
  - number: 4.5.2
    text: |-
      De dubbeltellingverificateur hernieuwbare brandstof toetst met een materialiteitsgrens van twee procent de aard
      van de gebruikte grondstof in relatie tot de dubbeltelling van de biobrandstof, alsmede de totale hoeveelheid
      gebruikte grondstof in relatie tot de hoeveelheid geproduceerde dubbel tellende biobrandstof waarop de
      dubbeltellingverklaring vetrekking heeft.
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel4.5
  - number: '4.6'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld over de dubbeltellingverificatie.
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel4.6
  - number: 4.7.1
    text: |-
      De inboekverificateur voert de verificatiewerkzaamheden op een onbevangen en onpartijdige wijze uit en is voor het
      onderdeel inboekverificatie van het werkveld hernieuwbare energie vervoer:
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel4.7
  - number: 4.7.1.a
    text: geaccrediteerd door de Raad voor Accreditatie;
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel4.7
  - number: 4.7.1.b
    text: |-
      geaccrediteerd door een nationale accreditatie-instantie als bedoeld in artikel 4, eerste lid, van verordening
      (EG) nr. 765/2008 van het Europees Parlement en de Raad van de Europese Unie van 9 juli 2008 tot vaststelling
      van de eisen inzake accreditatie en markttoezicht betreffende het verhandelen van producten en tot intrekking van
      [Verordening (EEG) 339/93](31993R0339) (PbEU 2008, L 218), of
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel4.7
  - number: 4.7.1.c
    text: |-
      aantoonbaar een accreditatieprocedure gestart bij een instelling als bedoeld in onderdeel a of b maar waarvoor de
      procedure nog niet is afgerond.
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel4.7
  - number: 4.7.2
    text: |-
      Het bestuur van de emissieautoriteit kan een instelling als bedoeld in het eerste lid die voldoet aan de eisen,
      gesteld in dat lid, opnemen in het register.
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel4.7
  - number: 4.8.1
    text: |-
      De inboekverificateur verkrijgt een redelijke mate van zekerheid dat de in de inboekverificatieverklaring
      verantwoorde inboekingen in het register geen materiële afwijkingen bevatten.
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel4.8
  - number: 4.8.2
    text: |-
      De inboekverificateur toetst met een materialiteitsgrens van twee procent van de totale hoeveelheid ingeboekte
      hernieuwbare energie vervoer per soort hernieuwbare energie vervoer waarop de verificatieverklaring betrekking
      heeft:
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel4.8
  - number: 4.8.2.a
    text: de hoeveelheid ingeboekte hernieuwbare energie vervoer naar energie-inhoud;
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel4.8
  - number: 4.8.2.b
    text: de overname van de kenmerken van en gegevens over de ingeboekte hernieuwbare energie vervoer,
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel4.8
  - number: 4.8.2.c
    text: |-
      de levering aan de Nederlandse markt voor vervoer, aan vervoer in Nederland onderscheidenlijk aan wegvoertuigen in
      Nederland zoals die blijkt uit de bedrijfsadministratie, en
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel4.8
  - number: 4.8.2.d
    text: |-
      het ontbreken van een doorlevering als duurzaam voor zover dat uit massabalans van het gehanteerde
      duurzaamheidssysteem of de gehanteerde duurzaamheidssystemen en de bedrijfsadministratie blijkt.
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel4.8
  - number: 4.8.3
    text: Indien de inboekverificateur geen inboekverificatieverklaring afgeeft, stelt hij een rapport van bevindingen op.
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel4.8
  - number: '4.9'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld over de inboekverificatie.
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel4.9
  - number: '5.1'
    text: |-
      Als categorie als bedoeld in [artikel 9.7.5.3, derde lid, van de wet][ref1] worden aangewezen de
      ondernemingen die houder zijn van een vergunning voor een accijnsgoederenplaats als bedoeld in
      [artikel 1a, eerste lid, onderdeel b, van de Wet op de accijns][ref2] voor minerale oliën als bedoeld in
      [artikel 25 van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel1a
      [ref3]: https://wetten.overheid.nl/BWBR0005251#Artikel25
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: 1a
      - id: ref3
        bwb_id: BWBR0005251
        artikel: '25'
  - number: '5.2'
    text: |-
      Aan de eisen, bedoeld in [artikel 9.7.5.4, eerste lid, aanhef, van de wet][ref1] is in ieder geval niet voldaan
      indien de aanvrager niet:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: 5.2.a
    text: heeft aangetoond de voor de aangevraagde rekening vereiste hoedanigheid te bezitten;
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel5.2
  - number: 5.2.b
    text: de vereiste gegevens heeft overgelegd.
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel5.2
  - number: '5.3'
    text: 'Redenen om aan te nemen dat er sprake is van fraude of misbruik van een rekening, zijn in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel5.3
  - number: 5.3.a
    text: |-
      de handelingen met betrekking tot die rekening wijken af van het gebruikelijke patroon van handelingen met
      betrekking tot die rekening;
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel5.3
  - number: 5.3.b
    text: het vermoeden dat derden zich toegang tot de rekening hebben verschaft, of
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel5.3
  - number: 5.3.c
    text: de rekeninghouder heeft een vermoeden van fraude of misbruik geuit.
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel5.3
  - number: 5.4.1
    text: 'Het bestuur van de emissieautoriteit kan een rekening in elk geval ambtshalve opeheffen indien:'
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel5.4
  - number: 5.4.1.a
    text: de rekeninghouder niet langer de hoedanigheid bezit op basis waarvan hij een rekening heeft gekregen;
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel5.4
  - number: 5.4.1.b
    text: ondanks herhaalde kennisgevingen de gronden voor de blokkering niet binnen een redelijke termijn zijn opgeheven;
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel5.4
  - number: 5.4.1.c
    text: er twaalf maanden geen activiteit is geweest op de rekening.
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel5.4
  - number: 5.4.2
    text: |-
      Een rekening met inboekfaciliteit of een rekening met uitsluitend overboekfaciliteit kan op verzoek van de
      rekeninghouder worden opgeheven.
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel5.4
  - number: 5.4.3
    text: |-
      Een rekening wordt niet opgeheven als op de rekeninghouder nog een verplichting rust als bedoeld in de
      [artikelen 9.7.2.1][ref1], [9.7.2.5, derde lid][ref2], of [9.7.4.13, vierde lid, van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '9'
  - number: 5.5.1
    text: |-
      Het gedeelte, bedoeld in [artikel 9.7.5.6, eerste lid, van de wet][ref1], komt overeen met ten hoogste 2.000
      hernieuwbare brandstofeenheden of indien toepassing van het tweede of derde lid leidt tot meer dan 2.000
      hernieuwbare brandstofeenheden het in dat lid genoemde percentage. Indien een onderneming zowel leverancier tot
      eindverbruik als inboeker is, geldt de voor die onderneming gunstigste bepaling.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: 5.5.2
    text: |-
      Voor de leverancier tot eindverbruik: 25 procent van het aantal hernieuwbare brandstofeenheden
      dat hij verschuldigd is over het kalenderjaar dat direct voorafgaat aan de datum, bedoeld in
      [artikel 9.7.5.6, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: 5.5.3
    text: |-
      Voor de inboeker: 10 procent van het aantal hernieuwbare brandstofeenheden dat door het bestuur van de
      emissieautoriteit op zijn rekening is bijgeschreven voor hernieuwbare energie vervoer die hij heeft geleverd in het
      kalenderjaar dat direct voorafgaat aan de datum, bedoeld in [artikel 9.7.5.6, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: '6.1'
    text: |-
      Het bestuur van de emissieautoriteit rapporteert over het laatst verstreken kalenderjaar jaarlijks aan Onze
      Minister:
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel6.1
  - number: 6.1.a
    text: de soorten en de totale hoeveelheid ingeboekte hernieuwbare energie vervoer;
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel6.1
  - number: 6.1.b
    text: |-
      de aard en herkomst van de grondstof van de totale hoeveelheid ingeboekte vloeibare en gasvormige biobrandstof,
      alsmede de gehanteerde duurzaamheidsystemen;
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel6.1
  - number: 6.1.c
    text: de totale energiehoeveelheid van de ingeboekte dubbel tellende biobrandstof.
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel6.1
  - number: '6.2'
    text: |-
      Het overzicht, bedoeld in [artikel 9.7.4.7, eerste lid, van de wet][ref1], vermeldt met betrekking tot het gedeelte
      van het kalenderjaar of het kalenderjaar waarop het overzicht betrekking heeft:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: 6.2.a
    text: het aantal tot de datum van publicatie op rekeningen in het register bijgeschreven hernieuwbare brandstofeenheden;
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel6.2
  - number: 6.2.b
    text: het aantal in dat kalenderjaar gespaarde hernieuwbare brandstofeenheden.
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel6.2
  - number: '6.3'
    text: |-
      Het overzicht, bedoeld in [artikel 9.7.4.14, eerste lid, van de wet][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: 6.3.a
    text: wordt langs elektronische weg bekendgemaakt;
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel6.3
  - number: 6.3.b
    text: heeft betrekking op het laatste kalenderjaar dat is verstreken voor de datum van openbaarmaking, en
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel6.3
  - number: 6.3.c
    text: 'vermeldt in afzonderlijke overzichten:'
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel6.3
  - number: 6.3.a
    text: de aard van de grondstoffen;
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel6.3
  - number: 6.3.b
    text: de herkomst van de grondstoffen, en
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel6.3
  - number: 6.3.c
    text: de gehanteerde duurzaamheidssystemen.
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel6.3
  - number: 7.1.1
    text: |-
      De hoeveelheid, bedoeld in [artikel 9.7.6.1 van de wet][ref1], is het kleinste getal dat volgt uit het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: 7.1.2
    text: |-
      De hoeveelheid, bedoeld in [artikel 9.7.6.1 van de wet][ref1] is:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: 7.1.2.a
    text: het getal van de administratieve eindvoorraad zoals dat blijkt uit de biobrandstoffenbalans over 2014, dan wel
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel7.1
  - number: 7.1.2.b
    text: 'de som van:'
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel7.1
  - number: 7.1.2.b.1°
    text: |-
      de in 2014 tot verbruik uitgeslagen onderscheidenlijk geleverde hoeveelheid biobrandstoffen die voldeed aan
      de eisen van [artikel 3, derde lid, van het Besluit hernieuwbare energie vervoer][ref1] en de in 2014 aan
      wegvoertuigen en mobiele machines geleverde hoeveelheid elektriciteit uit hernieuwbare bronnen, zoals blijkt uit de
      biobrandstoffenbalans als bedoeld in [artikel 1 van de Regeling hernieuwbare energie][ref2] zoals die luidde op 31
      december 2014, vermenigvuldigd met 0,25, en


      [ref1]: https://wetten.overheid.nl/BWBR0029926#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0029954#Artikel1
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0029926
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0029954
        artikel: '1'
  - number: 7.1.2.b.2°
    text: |-
      de verplichting voor het jaar 2014 op grond van artikel 3, eerste lid, van het
      [Besluit hernieuwbare energie vervoer][ref1], zoals blijkt uit die biobrandstoffenbalans, vermenigvuldigd met 0,25.


      [ref1]: https://wetten.overheid.nl/BWBR0029926
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0029926
  - number: 7.2.1
    text: |-
      De hoeveelheid, bedoeld in [artikel 9.7.6.1 van de wet][ref1], wordt bijgeschreven op de rekening van de inboeker
      of leverancier, bedoeld in dat artikel, op het moment van opening van die rekening.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel9
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '9'
  - number: 7.2.2
    text: De bijschrijving, bedoeld in het eerste lid, geschiedt niet meer na 29 februari 2016.
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel7.2
  - number: '8.1'
    text: |-
      Een wijziging van de richtlijn hernieuwbare energie gaat voor de toepassing van dit besluit en daarop berustende
      bepalingen gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven,
      tenzij bij ministerieel besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel8.1
  - number: '8.2'
    text: |-
      Het [Besluit hernieuwbare energie vervoer][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0029926
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0029926
  - number: '8.3'
    text: 'Dit besluit wordt aangehaald als: Besluit hernieuwbare energie vervoer 2015.'
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel8.3
  - number: '8.4'
    text: |-
      De wet van 26 september 2014 tot wijziging van de Wet milieubeheer (jaarverplichting hernieuwbare energie vervoer,
      hernieuwbare brandstofeenheden en elektronisch register hernieuwbare energie vervoer) (Stb. 2014, 455) en dit
      besluit treden in werking met ingang van 1 januari 2015.
    url: https://wetten.overheid.nl/BWBR0035839/2018-01-01#Artikel8.4
