$id: besluit_milieueffectrapportage
regulatory_layer: AMVB
publication_date: '2005-06-28'
valid_from: '2003-02-20'
bwb_id: BWBR0006788
url: https://wetten.overheid.nl/BWBR0006788/2003-02-20
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, gedaan mede namens
    de Staatssecretaris van Landbouw, Natuurbeheer en Visserij, van 13 mei 1993, nr. MJZ13593014, Centrale Directie
    Juridische Zaken, afdeling Wetgeving;

    Gelet op het op 25 februari 1991 te Espoo tot stand gekomen Verdrag inzake milieu-effectrapportage in
    grensoverschrijdend verband met aanhangsel (Trb. 1991, 104 en 174);

    Gelet op richtlijn nr. 85/337/EEG van de Raad van de Europese Gemeenschappen van 27 juni 1985 betreffende milieu-
    effectbeoordeling van bepaalde openbare en particuliere projecten (PbEG, L 175/40);

    Gelet op artikel II van de wet van 23 april 1986 houdende uitbreiding van de Wet algemene bepalingen milieuhygiëne
    (Regelen met betrekking tot milieu-effectrapportage) en op de artikelen 7.2, 7.4, 7.5, achtste lid, 7.8e en 7.35,
    vierde lid, van de Wet milieubeheer;

    Gezien de adviezen van de Raad voor het milieubeheer (25 november 1992, kenmerk ABJ-92/1108), de
    Natuurbeschermingsraad (9 november 1992, kenmerk 92814), en de Raad van advies voor de ruimtelijke ordening (27
    november 1992, kenmerk CL/362);

    De Raad van State gehoord (advies van 28 maart 1994, no. W08.93 0297);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, uitgebracht
    mede namens de Staatssecretaris van Landbouw, Natuurbeheer en Visserij, van 24 juni 1994, nr. MJZ 24694038,
    Centrale Directie Juridische Zaken, afdeling Wetgeving;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006788/2003-02-20#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder: de wet: de [Wet milieubeheer][ref1]; de bijlage: de bij dit besluit behorende
      bijlage.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0006788/2003-02-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '2.1'
    text: |-
      Als activiteiten als bedoeld in [artikel 7.2, eerste lid, van de wet][ref1] worden aangewezen de activiteiten die
      behoren tot een categorie die in onderdeel C van de bijlage is omschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0006788/2003-02-20#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
  - number: '2.2'
    text: |-
      Als activiteiten als bedoeld in [artikel 7.4, eerste lid, van de wet][ref1] worden aangewezen de activiteiten die
      behoren tot een categorie die in onderdeel D van de bijlage is omschreven. Indien een activiteit behoort tot een
      categorie van activiteiten die zowel in onderdeel C als in onderdeel D van de bijlage omschreven is en zij tevens
      voldoet aan de in de daarbij aangegeven categorieën van gevallen genoemde criteria, behoort zij tot de in onderdeel
      C omschreven categorie van activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0006788/2003-02-20#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
  - number: '2.3'
    text: |-
      Als de besluiten van bestuursorganen ter zake van de activiteiten, bij de voorbereiding waarvan een milieu-
      effectrapport moet worden gemaakt of de [artikelen 7.8][ref1]moeten worden toegepast, worden aangewezen de
      besluiten die in onderdeel C onderscheidenlijk onderdeel D van de bijlage bij de betrokken categorie van
      activiteiten zijn vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0006788/2003-02-20#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
  - number: '2.4'
    text: |-
      Voor zover in de bijlage bij een categorie van activiteiten categorieën van gevallen zijn aangegeven, geldt
      de verplichting tot het maken van een milieu-effectrapport of de verplichting tot het toepassen van de
      [artikelen 7.8][ref1]slechts in zodanige gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0006788/2003-02-20#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
  - number: '3'
    text: |-
      Er wordt een milieu-effectrapport gemaakt dan wel de [artikelen 7.8][ref1]worden toegepast in gevallen waarin met
      het oog op het nemen van een beslissing op hoofdlijnen met betrekking tot de plaats van een activiteit, behorende
      tot een categorie die is omschreven in onderdeel C onderscheidenlijk onderdeel D van de bijlage:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0006788/2003-02-20#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
  - number: 3.a
    text: |-
      een plan als bedoeld in [artikel 2][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel2a
    url: https://wetten.overheid.nl/BWBR0006788/2003-02-20#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: 2a
  - number: 3.b
    text: |-
      een gehele of gedeeltelijke herziening of intrekking van een plan als bedoeld in [artikel 2][ref1], dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel2b
    url: https://wetten.overheid.nl/BWBR0006788/2003-02-20#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: 2b
  - number: 3.c
    text: |-
      een door een of meer van Onze ministers aan de Tweede Kamer der Staten-Generaal toe te zenden nota wordt
      voorbereid.
    url: https://wetten.overheid.nl/BWBR0006788/2003-02-20#Artikel3
  - number: '4.1'
    text: |-
      Een verzoek om ontheffing ingevolge [artikel 7.5 van de wet][ref1] wordt gericht tot Onze Ministers.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0006788/2003-02-20#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
  - number: '4.2'
    text: |-
      Het wordt in tweevoud ingediend bij Onze Minister, die voor doorzending van een exemplaar aan Onze Minister van
      Landbouw, Natuurbeheer en Visserij zorg draagt.
    url: https://wetten.overheid.nl/BWBR0006788/2003-02-20#Artikel4
  - number: '5.1'
    text: |-
      Een verzoek om een ontheffing ingevolge [artikel 7.5, eerste lid, van de wet][ref1] bevat in elk geval:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0006788/2003-02-20#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
  - number: 5.1.a
    text: een beschrijving van de voorgenomen activiteit;
    url: https://wetten.overheid.nl/BWBR0006788/2003-02-20#Artikel5
  - number: 5.1.b
    text: een beschrijving van de omstandigheden waaronder de activiteit zal worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0006788/2003-02-20#Artikel5
  - number: 5.1.c
    text: de redenen voor het verzoek, en
    url: https://wetten.overheid.nl/BWBR0006788/2003-02-20#Artikel5
  - number: 5.1.d
    text: |-
      ingeval de ontheffing wordt gevraagd ingevolge [artikel 7.5, eerste lid, onder c, van de wet][ref1], een aanduiding
      van de mogelijke nadelige gevolgen voor het milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0006788/2003-02-20#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
  - number: '5.2'
    text: |-
      Een verzoek om een ontheffing ingevolge [artikel 7.5, tweede lid, van de wet ][ref1]bevat in elk geval gegevens als
      bedoeld in het eerste lid, onder *a* en *c*, alsmede omtrent het stadium van voorbereiding van de activiteit of van
      het daarover te nemen besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0006788/2003-02-20#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
  - number: '5.3'
    text: |-
      Indien in een verzoek als bedoeld in het eerste of tweede lid wordt verwezen naar stukken, gaat het verzoek
      vergezeld van een exemplaar van die stukken.
    url: https://wetten.overheid.nl/BWBR0006788/2003-02-20#Artikel5
  - number: '6.1'
    text: |-
      Onze Ministers doen van een verzoek als bedoeld in [artikel 5, eerste of tweede lid][ref1], onverwijld mededeling
      door:


      [ref1]: https://wetten.overheid.nl/BWBR0006788#Artikel5
    url: https://wetten.overheid.nl/BWBR0006788/2003-02-20#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006788
        artikel: '5'
        hoofdstuk: '3'
  - number: 6.1.a
    text: |-
      kennisgeving in één of meer dag-, nieuws- of huis-aan-huis-bladen op zodanige wijze dat het daarmee beoogde doel zo
      goed mogelijk wordt bereikt;
    url: https://wetten.overheid.nl/BWBR0006788/2003-02-20#Artikel6
  - number: 6.1.b
    text: kennisgeving in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0006788/2003-02-20#Artikel6
  - number: '6.2'
    text: 'Een kennisgeving als bedoeld in het eerste lid vermeldt ten minste:'
    url: https://wetten.overheid.nl/BWBR0006788/2003-02-20#Artikel6
  - number: 6.2.a
    text: de zakelijke inhoud van het verzoek;
    url: https://wetten.overheid.nl/BWBR0006788/2003-02-20#Artikel6
  - number: 6.2.b
    text: |-
      het tijdstip waarop een exemplaar van het verzoek ter inzage wordt gelegd, alsmede de uren waarop en de plaats waar
      het ter inzage ligt;
    url: https://wetten.overheid.nl/BWBR0006788/2003-02-20#Artikel6
  - number: 6.2.c
    text: |-
      de termijn waarbinnen door een ieder bij Onze Ministers schriftelijk bedenkingen naar voren kunnen worden gebracht
      tegen het verlenen van de gevraagde ontheffing;
    url: https://wetten.overheid.nl/BWBR0006788/2003-02-20#Artikel6
  - number: 6.2.d
    text: |-
      dat degene die schriftelijk bedenkingen naar voren brengt, kan verzoeken zijn persoonlijke gegevens niet bekend
      te maken.
    url: https://wetten.overheid.nl/BWBR0006788/2003-02-20#Artikel6
  - number: '6.3'
    text: |-
      Een exemplaar van het verzoek wordt in ieder geval ter inzage gelegd op de Ministeries van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer en van Landbouw, Natuurbeheer en Visserij, op de griffie van de provincie,
      waarbinnen de gemeente of gemeenten waar de activiteit zal worden ondernomen gelegen is of gelegen zijn, en op de
      secretarie van die gemeente of gemeenten.
    url: https://wetten.overheid.nl/BWBR0006788/2003-02-20#Artikel6
  - number: '6.4'
    text: |-
      Met een exemplaar van het verzoek wordt tevens ter inzage gelegd een exemplaar van de stukken, die redelijkerwijs
      nodig kunnen zijn voor de beoordeling van dat verzoek, voor zover deze stukken Onze Ministers bekend zijn.
    url: https://wetten.overheid.nl/BWBR0006788/2003-02-20#Artikel6
  - number: '6.5'
    text: |-
      Vanaf de dag waarop het verzoek ter inzage is gelegd, kan een ieder de ter inzage liggende stukken tijdens de
      werkuren alsmede desgevraagd ten minste gedurende drie aaneengesloten uren per week buiten de werkuren kosteloos
      inzien tot het einde van de termijn waarbinnen bedenkingen naar voren kunnen worden gebracht tegen het verlenen van
      de gevraagde ontheffing.
    url: https://wetten.overheid.nl/BWBR0006788/2003-02-20#Artikel6
  - number: '6.6'
    text: |-
      Onze Ministers, gedeputeerde staten en burgemeester en wethouders verstrekken een ieder desgevraagd, tegen betaling
      van de kosten, voor zover mogelijk een exemplaar van de ter inzage liggende stukken.
    url: https://wetten.overheid.nl/BWBR0006788/2003-02-20#Artikel6
  - number: '6.7'
    text: |-
      Gedurende ten minste twee weken en ten hoogste vier weken vanaf de dag waarop het verzoek ter inzage is gelegd, kan
      een ieder bij Onze Ministers tegen het verlenen van de gevraagde ontheffing schriftelijke bedenkingen naar voren
      brengen.
    url: https://wetten.overheid.nl/BWBR0006788/2003-02-20#Artikel6
  - number: '6.8'
    text: |-
      Onze Ministers zenden van ieder stuk waarbij bedenkingen naar voren worden gebracht zo spoedig
      mogelijk een exemplaar aan de aanvrager, het bevoegd gezag en de commissie, voor zover deze ingevolge
      [artikel 7.5, zesde lid, van de wet][ref1] in de gelegenheid wordt gesteld advies uit te brengen omtrent het
      verzoek. Voor zover mogelijk wordt telkens een exemplaar van een stuk als vorenbedoeld gevoegd bij de reeds ter
      inzage liggende stukken.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0006788/2003-02-20#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
  - number: '6.9'
    text: |-
      De persoonlijke gegevens van degene die schriftelijk bedenkingen naar voren heeft gebracht, worden, indien hij
      daarom verzoekt, niet bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0006788/2003-02-20#Artikel6
  - number: '6.10'
    text: |-
      Een exemplaar van een ingevolge [artikel 7.5, zesde lid, van de wet][ref1] uitgebracht advies wordt zo spoedig
      mogelijk gevoegd bij de reeds ter inzage liggende stukken.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0006788/2003-02-20#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
  - number: '7'
    text: |-
      Uiterlijk twee weken na de mededeling, bedoeld in [artikel 7.5, zevende lid, van de wet][ref1], doen Onze Ministers
      gelijktijdig mededeling van de beslissing op het verzoek, bedoeld in [artikel 5, eerste of tweede lid][ref2] door:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006788#Artikel5
    url: https://wetten.overheid.nl/BWBR0006788/2003-02-20#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0006788
        artikel: '5'
        hoofdstuk: '3'
  - number: 7.a
    text: |-
      kennisgeving van de strekking van de beslissing met overeenkomstige toepassing van [artikel 6, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006788#Artikel6
    url: https://wetten.overheid.nl/BWBR0006788/2003-02-20#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006788
        artikel: '6'
        hoofdstuk: '3'
  - number: 7.b
    text: |-
      terinzagelegging van een exemplaar van de beslissing met overeenkomstige toepassing van
      [artikel 6, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006788#Artikel6
    url: https://wetten.overheid.nl/BWBR0006788/2003-02-20#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006788
        artikel: '6'
        hoofdstuk: '3'
  - number: 7.c
    text: |-
      toezending van een exemplaar van de beslissing aan degenen die ingevolge [artikel 6, vijfde lid][ref1],
      schriftelijk bedenkingen naar voren hebben gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006788#Artikel6
    url: https://wetten.overheid.nl/BWBR0006788/2003-02-20#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006788
        artikel: '6'
        hoofdstuk: '3'
  - number: '8'
    text: |-
      In gevallen waarin achter een activiteit onder de categorie-omschrijving in de onderdelen C en D
      van de bijlage meer dan één besluit waarop [afdeling 3.5 van de Algemene wet bestuursrecht][ref1] en
      [afdeling 13.2 van de wet][ref2] van toepassing zijn, als besluit is vermeld, bij de voorbereiding waarvan een
      milieu-effectrapport moet worden gemaakt, en tot die besluiten behoort:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.5
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Afdeling13.2
    url: https://wetten.overheid.nl/BWBR0006788/2003-02-20#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.5'
      - id: ref2
        bwb_id: BWBR0003245
        afdeling: '13.2'
  - number: 8.a
    text: |-
      de beslissing omtrent het verlenen van de vergunning, bedoeld in de [artikelen 15][ref1] en
      [29 van de Kernenergiewet][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel29
    url: https://wetten.overheid.nl/BWBR0006788/2003-02-20#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0002402
        artikel: '29'
  - number: 8.b
    text: |-
      de beslissing omtrent het verlenen van de vergunning, krachtens [artikel 8.1 van de wet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0006788/2003-02-20#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 8.c
    text: |-
      de beslissing omtrent het verlenen van de vergunning, bedoeld in
      [artikel 3 van de Wet verontreiniging oppervlaktewateren][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel3
    url: https://wetten.overheid.nl/BWBR0006788/2003-02-20#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '3'
  - number: '13'
    text: |-
      Een verzoek als bedoeld in artikel 5, eerste of tweede lid, van het Besluit milieu-effectrapportage dat is
      ingediend voor het tijdstip waarop dit besluit in werking treedt, wordt gelijkgesteld met een verzoek dat wordt
      ingediend op grond van artikel 5, eerste of tweede lid, van dit besluit.
    url: https://wetten.overheid.nl/BWBR0006788/2003-02-20#Artikel13
  - number: '15'
    text: Het Besluit milieu-effectrapportage wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006788/2003-02-20#Artikel15
  - number: '16'
    text: Dit besluit treedt in werking met ingang van 1 september 1994.
    url: https://wetten.overheid.nl/BWBR0006788/2003-02-20#Artikel16
  - number: '17'
    text: 'Dit besluit wordt aangehaald als: Besluit milieu-effectrapportage 1994.'
    url: https://wetten.overheid.nl/BWBR0006788/2003-02-20#Artikel17
