$id: besluit_milieueffectrapportage
regulatory_layer: AMVB
publication_date: '2005-06-28'
valid_from: '2020-12-18'
bwb_id: BWBR0006788
url: https://wetten.overheid.nl/BWBR0006788/2020-12-18
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, gedaan mede namens
    de Staatssecretaris van Landbouw, Natuurbeheer en Visserij, van 13 mei 1993, nr. MJZ13593014, Centrale Directie
    Juridische Zaken, afdeling Wetgeving;

    Gelet op het op 25 februari 1991 te Espoo tot stand gekomen Verdrag inzake milieu-effectrapportage in
    grensoverschrijdend verband met aanhangsel (Trb. 1991, 104 en 174);

    Gelet op richtlijn nr. 85/337/EEG van de Raad van de Europese Gemeenschappen van 27 juni 1985 betreffende milieu-
    effectbeoordeling van bepaalde openbare en particuliere projecten (PbEG, L 175/40);

    Gelet op artikel II van de wet van 23 april 1986 houdende uitbreiding van de Wet algemene bepalingen milieuhygiëne
    (Regelen met betrekking tot milieu-effectrapportage) en op de artikelen 7.2, 7.4, 7.5, achtste lid, 7.8e en 7.35,
    vierde lid, van de Wet milieubeheer;

    Gezien de adviezen van de Raad voor het milieubeheer (25 november 1992, kenmerk ABJ-92/1108), de
    Natuurbeschermingsraad (9 november 1992, kenmerk 92814), en de Raad van advies voor de ruimtelijke ordening (27
    november 1992, kenmerk CL/362);

    De Raad van State gehoord (advies van 28 maart 1994, no. W08.93 0297);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, uitgebracht
    mede namens de Staatssecretaris van Landbouw, Natuurbeheer en Visserij, van 24 juni 1994, nr. MJZ 24694038,
    Centrale Directie Juridische Zaken, afdeling Wetgeving;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006788/2020-12-18#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder: de wet: de [Wet milieubeheer][ref1]; de bijlage: de bij dit besluit behorende
      bijlage.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0006788/2020-12-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '2.1'
    text: |-
      Als activiteiten als bedoeld in [artikel 7.2, eerste lid, onder a, van de wet][ref1] worden aangewezen de
      activiteiten die behoren tot een categorie die in onderdeel C van de bijlage is omschreven, met uitzondering van
      activiteiten die uitsluitend of hoofdzakelijk dienen voor het ontwikkelen en beproeven van nieuwe methoden of
      producten en die niet langer dan twee jaar worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0006788/2020-12-18#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
  - number: '2.2'
    text: |-
      Als activiteiten als bedoeld in [artikel 7.2, eerste lid, onder b, van de wet][ref1] worden aangewezen de
      activiteiten die behoren tot een categorie die in onderdeel D van de bijlage is omschreven, alsmede activiteiten
      die in onderdeel C van de bijlage zijn omschreven en die uitsluitend of hoofdzakelijk dienen voor het ontwikkelen
      en beproeven van nieuwe methoden of producten en die niet langer dan twee jaar worden gebruikt. Indien een
      activiteit behoort tot een categorie van activiteiten die zowel in onderdeel C als in onderdeel D van de bijlage
      omschreven is en zij tevens voldoet aan de in de daarbij aangegeven categorieën van gevallen genoemde criteria,
      behoort zij tot de in onderdeel C omschreven categorie van activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0006788/2020-12-18#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
  - number: '2.3'
    text: |-
      Als categorieën van plannen als bedoeld in [artikel 7.2, tweede lid, van de wet][ref1], worden aangewezen de
      categorieën die in kolom 3 van onderdeel C onderscheidenlijk onderdeel D van de bijlage zijn omschreven, voor zover
      die plannen een kader vormen voor een besluit dat behoort tot een categorie die is aangewezen op grond van het
      vierde lid, en voor zover die plannen niet zijn aangewezen als categorieën van besluiten als bedoeld in dat lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0006788/2020-12-18#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
  - number: '2.4'
    text: |-
      Als categorieën van besluiten als bedoeld in [artikel 7.2, derde en vierde lid, van de wet][ref1], worden
      aangewezen de categorieën die in kolom 4 van onderdeel C onderscheidenlijk onderdeel D van de bijlage zijn
      omschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0006788/2020-12-18#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
  - number: '2.5'
    text: |-
      Voor zover in de bijlage, onderdeel C, bij een categorie van activiteiten categorieën van gevallen zijn aangegeven,
      geldt de verplichting tot het maken van een milieueffectrapport in zodanige gevallen. Voor zover in de bijlage,
      onderdeel D, bij een categorie van activiteiten categorieën van gevallen zijn aangegeven, geldt:
    url: https://wetten.overheid.nl/BWBR0006788/2020-12-18#Artikel2
  - number: 2.5.a
    text: |-
      de verplichting tot het toepassen van de [artikelen 7.16 tot en met 7.19][ref1] en [7.20a van de wet][ref2] in
      zodanige gevallen, en


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0006788/2020-12-18#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
  - number: 2.5.b
    text: |-
      de verplichting tot het toepassen van de [artikelen 7.16][ref1], [7.17, eerste tot en met vierde lid][ref2],
      [7.18][ref3], [7.19, eerste en tweede lid][ref4], en [7.20a van de wet][ref5] in overige gevallen, uitgezonderd de
      gevallen, bedoeld in de categorieën D 49.1, D 49.2 en D 49.3 van de bijlage bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0006788/2020-12-18#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '7'
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '7'
      - id: ref5
        bwb_id: BWBR0003245
        artikel: '7'
  - number: '2.6'
    text: |-
      Voor de vaststelling of een activiteit valt binnen de in het vijfde lid bedoelde categorieën van gevallen, wordt de
      totale activiteit beschouwd, inclusief eventuele grensoverschrijdende onderdelen.
    url: https://wetten.overheid.nl/BWBR0006788/2020-12-18#Artikel2
  - number: '3.1'
    text: |-
      Als categorieën van gevallen als bedoeld in [artikel 7.2a, tweede lid, van de wet][ref1], worden aangewezen de
      vaststelling of wijziging van een plan waarvoor bij de voorbereiding een passende beoordeling moet worden gemaakt
      op grond van [artikel 2.8, eerste lid, van de Wet natuurbescherming][ref2] en:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0037552#Artikel2
    url: https://wetten.overheid.nl/BWBR0006788/2020-12-18#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0037552
        artikel: '2'
  - number: 3.1.a
    text: 'dat het gebruik bepaalt van kleine gebieden indien:'
    url: https://wetten.overheid.nl/BWBR0006788/2020-12-18#Artikel3
  - number: 3.1.a.1°
    text: voor dat plan een bestuursorgaan van een gemeente het bevoegd gezag is;
    url: https://wetten.overheid.nl/BWBR0006788/2020-12-18#Artikel3
  - number: 3.1.a.2°
    text: de omvang van het gebied in verhouding tot het totale grondgebied van de gemeente klein is; en
    url: https://wetten.overheid.nl/BWBR0006788/2020-12-18#Artikel3
  - number: 3.1.a.3°
    text: |-
      het bevoegd gezag heeft beoordeeld dat de vaststelling of wijziging van dat plan geen aanzienlijke milieueffecten
      heeft; of
    url: https://wetten.overheid.nl/BWBR0006788/2020-12-18#Artikel3
  - number: 3.1.b
    text: |-
      waarbij sprake is van kleine wijzigingen van een plan en het bevoegd gezag heeft beoordeeld dat die wijzigingen
      geen aanzienlijke milieueffecten hebben.
    url: https://wetten.overheid.nl/BWBR0006788/2020-12-18#Artikel3
  - number: '3.2'
    text: |-
      Het eerste lid is niet van toepassing op een plan dat betrekking heeft op een activiteit, aangewezen krachtens
      [artikel 7.2, eerste lid, onder a, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0006788/2020-12-18#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
  - number: '3.3'
    text: |-
      Het bevoegd gezag houdt bij de beoordeling, bedoeld in het eerste lid, onder a, onder 3°, en onder b, rekening
      met de criteria van bijlage II bij Richtlĳn 2001/42/EG van het Europees Parlement en de Raad van 27 juni 2001
      betreffende de beoordeling van de gevolgen voor het milieu van bepaalde plannen en programma's (PbEG 2001, L 197)
      en raadpleegt daarvoor:
    url: https://wetten.overheid.nl/BWBR0006788/2020-12-18#Artikel3
  - number: 3.3.a
    text: |-
      de bestuursorganen en instanties die op grond van een wettelijk voorschrift adviseren over de besluiten, aangewezen
      op grond van [artikel 7.2, derde of vierde lid, van de wet][ref1] waarop het plan betrekking heeft; en


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0006788/2020-12-18#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
  - number: 3.3.b
    text: |-
      Onze Minister van Infrastructuur en Waterstaat, Onze Minister van Landbouw, Natuur en Voedselkwaliteit, Onze
      Minister van Onderwijs, Cultuur en Wetenschap of in plaats van de betrokken minister een door hem aangewezen
      bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0006788/2020-12-18#Artikel3
  - number: '3.4'
    text: |-
      Het bevoegd gezag betrekt bij de beoordeling, bedoeld in het eerste lid, onder b, de context van het plan dat wordt
      gewijzigd en de mate van waarschijnlijkheid dat de wijzigingen aanzienlijke milieueffecten zullen hebben.
    url: https://wetten.overheid.nl/BWBR0006788/2020-12-18#Artikel3
  - number: '3.5'
    text: |-
      Het bevoegd gezag neemt het resultaat van de beoordeling, bedoeld in het eerste lid, onder a, onder 3°, en onder b,
      met de bijbehorende motivering op in het plan.
    url: https://wetten.overheid.nl/BWBR0006788/2020-12-18#Artikel3
  - number: '4'
    text: |-
      In of bij een verzoek om ontheffing als bedoeld in [artikel 7.5, eerste lid, van de wet][ref1] verstrekt degene die
      de activiteit wil ondernemen in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel7
    url: https://wetten.overheid.nl/BWBR0006788/2020-12-18#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '7'
  - number: 4.a
    text: een beschrijving van de voorgenomen activiteit,
    url: https://wetten.overheid.nl/BWBR0006788/2020-12-18#Artikel4
  - number: 4.b
    text: een beschrijving van de omstandigheden waaronder de activiteit zal worden uitgevoerd,
    url: https://wetten.overheid.nl/BWBR0006788/2020-12-18#Artikel4
  - number: 4.c
    text: de redenen voor het verzoek, en
    url: https://wetten.overheid.nl/BWBR0006788/2020-12-18#Artikel4
  - number: 4.d
    text: een aanduiding van de mogelijke belangrijke nadelige gevolgen voor het milieu.
    url: https://wetten.overheid.nl/BWBR0006788/2020-12-18#Artikel4
  - number: '8'
    text: |-
      In gevallen waarin achter een activiteit onder de categorie-omschrijving in de onderdelen C en D
      van de bijlage meer dan één besluit waarop [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] en
      [afdeling 13.2 van de wet][ref2] van toepassing zijn, als besluit is vermeld, bij de voorbereiding waarvan een
      milieueffectrapport moet worden gemaakt, en tot die besluiten behoort:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Afdeling13.2
    url: https://wetten.overheid.nl/BWBR0006788/2020-12-18#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0003245
        afdeling: '13.2'
  - number: 8.a
    text: |-
      de beslissing omtrent het verlenen van de vergunning, bedoeld in de [artikelen 15][ref1] en
      [29 van de Kernenergiewet][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel29
    url: https://wetten.overheid.nl/BWBR0006788/2020-12-18#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0002402
        artikel: '29'
  - number: 8.b
    text: de beslissing omtrent het verlenen van de omgevingsvergunning voor een inrichting of mijnbouwwerk,
    url: https://wetten.overheid.nl/BWBR0006788/2020-12-18#Artikel8
  - number: 8.c
    text: |-
      de beslissing omtrent het verlenen van de vergunning, bedoeld in [artikel 6.2 van de Waterwet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0006788/2020-12-18#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0025458
        artikel: '6'
  - number: '13'
    text: |-
      Een verzoek als bedoeld in artikel 5, eerste of tweede lid, van het Besluit milieu-effectrapportage dat is
      ingediend voor het tijdstip waarop dit besluit in werking treedt, wordt gelijkgesteld met een verzoek dat wordt
      ingediend op grond van artikel 5, eerste of tweede lid, van dit besluit.
    url: https://wetten.overheid.nl/BWBR0006788/2020-12-18#Artikel13
  - number: '15'
    text: Het Besluit milieu-effectrapportage wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006788/2020-12-18#Artikel15
  - number: '16'
    text: Dit besluit treedt in werking met ingang van 1 september 1994.
    url: https://wetten.overheid.nl/BWBR0006788/2020-12-18#Artikel16
  - number: '17'
    text: 'Dit besluit wordt aangehaald als: Besluit milieueffectrapportage.'
    url: https://wetten.overheid.nl/BWBR0006788/2020-12-18#Artikel17
