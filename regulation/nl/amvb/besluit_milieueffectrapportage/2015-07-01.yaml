  - number: '3'
    text: |-
      Dit besluit is in afwijking van [artikel 2][ref1] niet van toepassing op activiteiten, plannen of onderdelen van
      plannen en besluiten die uitsluitend defensiedoeleinden betreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0006788#Artikel2
    url: https://wetten.overheid.nl/BWBR0006788/2015-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006788
        artikel: '2'
        hoofdstuk: '2'
  - number: '8'
    text: |-
      In gevallen waarin achter een activiteit onder de categorie-omschrijving in de onderdelen C en D
      van de bijlage meer dan één besluit waarop [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] en
      [afdeling 13.2 van de wet][ref2] van toepassing zijn, als besluit is vermeld, bij de voorbereiding waarvan een
      milieueffectrapport moet worden gemaakt, en tot die besluiten behoort:

      a. de beslissing omtrent het verlenen van de vergunning, bedoeld in de [artikelen 15][ref3] en
      [29 van de Kernenergiewet][ref4],

      b. de beslissing omtrent het verlenen van de omgevingsvergunning voor een inrichting,

      c. de beslissing omtrent het verlenen van de vergunning, bedoeld in [artikel 6.2 van de Waterwet][ref5],

      is [artikel 7.35, derde lid, van de wet][ref6] bij uitsluiting van toepassing op de eerste van de onder *a* tot en
      met *c* genoemde beslissingen die in het desbetreffende geval nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
