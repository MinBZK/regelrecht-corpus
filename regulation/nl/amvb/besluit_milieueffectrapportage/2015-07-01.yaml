  - number: '13'
    text: |-
      Een verzoek als bedoeld in artikel 5, eerste of tweede lid, van het Besluit milieu-effectrapportage dat is
      ingediend voor het tijdstip waarop dit besluit in werking treedt, wordt gelijkgesteld met een verzoek dat wordt
      ingediend op grond van artikel 5, eerste of tweede lid, van dit besluit.
    url: https://wetten.overheid.nl/BWBR0006788/2015-07-01#Artikel13
  - number: '15'
    text: Het Besluit milieu-effectrapportage wordt ingetrokken.
