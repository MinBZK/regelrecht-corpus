preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, gedaan mede namens
    de Staatssecretaris van Landbouw, Natuurbeheer en Visserij, van 13 mei 1993, nr. MJZ13593014, Centrale Directie
    Juridische Zaken, afdeling Wetgeving;

    Gelet op het op 25 februari 1991 te Espoo tot stand gekomen Verdrag inzake milieu-effectrapportage in
    grensoverschrijdend verband met aanhangsel (Trb. 1991, 104 en 174);

    Gelet op richtlijn nr. 85/337/EEG van de Raad van de Europese Gemeenschappen van 27 juni 1985 betreffende milieu-
    effectbeoordeling van bepaalde openbare en particuliere projecten (PbEG, L 175/40);

    Gelet op artikel II van de wet van 23 april 1986 houdende uitbreiding van de Wet algemene bepalingen milieuhygiëne
    (Regelen met betrekking tot milieu-effectrapportage) en op de artikelen 7.2, 7.4, 7.5, achtste lid, 7.8e en 7.35,
    vierde lid, van de Wet milieubeheer;

    Gezien de adviezen van de Raad voor het milieubeheer (25 november 1992, kenmerk ABJ-92/1108), de
    Natuurbeschermingsraad (9 november 1992, kenmerk 92814), en de Raad van advies voor de ruimtelijke ordening (27
    november 1992, kenmerk CL/362);

    De Raad van State gehoord (advies van 28 maart 1994, no. W08.93 0297);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, uitgebracht
    mede namens de Staatssecretaris van Landbouw, Natuurbeheer en Visserij, van 24 juni 1994, nr. MJZ 24694038,
    Centrale Directie Juridische Zaken, afdeling Wetgeving;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006788/2015-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      de wet: de [Wet milieubeheer][ref1];

      de bijlage: de bij dit besluit behorende bijlage.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0006788/2015-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: '2'
    text: |-
      1 Als activiteiten als bedoeld in [artikel 7.2, eerste lid, onder a, van de wet][ref1] worden aangewezen de
      activiteiten die behoren tot een categorie die in onderdeel C van de bijlage is omschreven, met uitzondering van
      activiteiten die uitsluitend of hoofdzakelijk dienen voor het ontwikkelen en beproeven van nieuwe methoden of
      producten en die niet langer dan twee jaar worden gebruikt.

      2 Als activiteiten als bedoeld in [artikel 7.2, eerste lid, onder b, van de wet][ref2] worden aangewezen de
      activiteiten die behoren tot een categorie die in onderdeel D van de bijlage is omschreven, alsmede activiteiten
      die in onderdeel C van de bijlage zijn omschreven en die uitsluitend of hoofdzakelijk dienen voor het ontwikkelen
      en beproeven van nieuwe methoden of producten en die niet langer dan twee jaar worden gebruikt.

      Indien een activiteit behoort tot een categorie van activiteiten die zowel in onderdeel C als in onderdeel D van
      de bijlage omschreven is en zij tevens voldoet aan de in de daarbij aangegeven categorieën van gevallen genoemde
      criteria, behoort zij tot de in onderdeel C omschreven categorie van activiteiten.

      3 Als categorieën van plannen als bedoeld in [artikel 7.2, tweede lid, van de wet][ref3], worden aangewezen de
      categorieën die in kolom 3 van onderdeel C onderscheidenlijk onderdeel D van de bijlage zijn omschreven, voor zover
      die plannen een kader vormen voor een besluit dat behoort tot een categorie die is aangewezen op grond van het
      vierde lid, en voor zover die plannen niet zijn aangewezen als categorieën van besluiten als bedoeld in dat lid.

      4 Als categorieën van besluiten als bedoeld in [artikel 7.2, derde en vierde lid, van de wet][ref4], worden
      aangewezen de categorieën die in kolom 4 van onderdeel C onderscheidenlijk onderdeel D van de bijlage zijn
      omschreven.

      5 Voor zover in de bijlage, onderdeel C, bij een categorie van activiteiten categorieën van gevallen zijn
      aangegeven, geldt de verplichting tot het maken van een milieueffectrapport in zodanige gevallen. Voor zover in
      de bijlage, onderdeel D, bij een categorie van activiteiten categorieën van gevallen zijn aangegeven, geldt de
      verplichting tot het toepassen van de [artikelen 7.16 tot en met 7.19 van de wet][ref5]:

      a. in zodanige gevallen en

      b. in overige gevallen waarin op grond van selectiecriteria als bedoeld in bijlage III bij de EEG-richtlijn milieu-
      effectbeoordeling niet kan worden uitgesloten dat de activiteit belangrijke nadelige gevolgen voor het milieu kan
      hebben. Hiervan zijn uitgezonderd de categorieën D 49.1, D 49.2 en D 49.3 van de bijlage bij dit besluit.

      6 Voor de vaststelling of een activiteit valt binnen de in het vijfde lid bedoelde categorieën van gevallen, wordt
      de totale activiteit beschouwd, inclusief eventuele grensoverschrijdende onderdelen.


