preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Sociale Zaken en Werkgelegenheid, L. de Graaf van 30 juli 1985,
    Directoraat-Generaal Sociale Zekerheid, Directie Sociale Verzekeringen, Hoofdafdeling Volksverzekeringen, nr. SZ/
    SV/85/2687;

    Gelet op de artikelen 57, onderdeel a, en 60, onderdeel a, van de Algemene Ouderdomswet;

    De Raad van State gehoord (advies van 7 oktober 1985, nr. W 12.85.0435/18.5.41);

    Gezien het nader rapport van voornoemde Staatssecretaris van 31 oktober 1985, Directoraat-Generaal Sociale
    Zekerheid, Nr. SZ/SV/VV/85/3583;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003880/2013-03-30#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Voor de toepassing van [artikel 56 van de Algemene Ouderdomswet][ref1] (*Stb.* 1985, 181) worden, zolang zij binnen
      het Rijk wonen, met Nederlanders gelijkgesteld niet-Nederlanders, die na het bereiken van de twintigjarige leeftijd
      gedurende ten minste vijftien jaren al dan niet onafgebroken binnen het Rijk hebben gewoond, mits zij gedurende de
      vijf aan het bereiken van de 65-jarige leeftijd onmiddellijk voorafgaande jaren onafgebroken binnen het Rijk hebben
      gewoond.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel56
    url: https://wetten.overheid.nl/BWBR0003880/2013-03-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '56'
  - number: '1.2'
    text: |-
      Voor de toepassing van het bepaalde in het eerste lid wordt het wonen van een lid van de bemanning aan boord van
      een schip dat binnen het Rijk zijn thuishaven heeft, niet als wonen binnen het Rijk beschouwd.
    url: https://wetten.overheid.nl/BWBR0003880/2013-03-30#Artikel1
  - number: '2'
    text: |-
      Voor de toepassing van [artikel 56 van de Algemene Ouderdomswet][ref1] worden, zolang zij binnen het Rijk wonen,
      met Nederlanders gelijkgesteld vluchtelingen in de zin van het op 28 juli 1951 te Genève tot stand gekomen Verdrag
      betreffende de status van vluchtelingen (*Trb.* 1951, 131) en van artikel 1, eerste lid, van het protocol van
      31 januari 1967, behorend bij dit Verdrag, met inachtneming van de bij de ondertekening afgelegde verklaring als
      bedoeld in artikel I, Afdeling B, van dat Verdrag.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel56
    url: https://wetten.overheid.nl/BWBR0003880/2013-03-30#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '56'
  - number: '3'
    text: |-
      Voor de toepassing van [artikel 56 van de Algemene Ouderdomswet][ref1] worden, zolang zij binnen het Rijk wonen,
      voorts met Nederlanders gelijkgesteld niet-Nederlanders, afkomstig uit Indonesië, het voormalige Nederlands Nieuw-
      Guinea of het voormalige Westelijk Nieuw-Guinea, die zich vóór 1 januari 1968 met toestemming van de Nederlandse
      regering in Nederland hebben gevestigd en die op het tijdstip van hun vestiging in Nederland 50 jaar of ouder
      waren.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel56
    url: https://wetten.overheid.nl/BWBR0003880/2013-03-30#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '56'
  - number: '4'
    text: |-
      Voor de toepassing van [artikel 56 van de Algemene Ouderdomswet][ref1] worden met Nederlanders gelijkgesteld
      staatsburgers van de Verenigde Staten van Amerika, die gedurende de zes aan het bereiken van de 65-jarige leeftijd
      onmiddellijk voorafgaande jaren onafgebroken binnen het Rijk hebben gewoond.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel56
    url: https://wetten.overheid.nl/BWBR0003880/2013-03-30#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '56'
  - number: '5'
    text: |-
      Voor de toepassing van [artikel 56 van de Algemene Ouderdomswet][ref1] worden met Nederlanders gelijkgesteld
      onderdanen van een land, dat het op 22 juni 1935 te Genève tot stand gekomen Verdrag (nr. 48) van de Internationale
      Arbeidsorganisatie betreffende behoud van pensioenrechten van migranten, 1935, heeft bekrachtigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel56
    url: https://wetten.overheid.nl/BWBR0003880/2013-03-30#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '56'
  - number: '6'
    text: |-
      Voor de toepassing van [artikel 56 van de Algemene Ouderdomswet][ref1] worden met Nederlanders gelijkgesteld niet-
      Nederlanders, die de Surinaamse nationaliteit bezitten.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel56
    url: https://wetten.overheid.nl/BWBR0003880/2013-03-30#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '56'
  - number: 6a.1
    text: |-
      Voor de toepassing van [artikel 56 van de Algemene Ouderdomswet][ref1] worden met Nederlanders gelijkgesteld
      personen die op 31 december 1984 Nederlander waren en het Nederlanderschap nadien als gevolg van
      [artikel 15, onderdeel c, van de Rijkswet op het Nederlanderschap][ref2] hebben verloren.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0003738#Artikel15
    url: https://wetten.overheid.nl/BWBR0003880/2013-03-30#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '56'
      - id: ref2
        bwb_id: BWBR0003738
        artikel: '15'
  - number: 6a.2
    text: |-
      Het eerste lid is van toepassing indien het ouderdomspensioen van de pensioengerechtigde vóór 1 januari 2000 is
      ingegaan.
    url: https://wetten.overheid.nl/BWBR0003880/2013-03-30#Artikel6a
  - number: '7.1'
    text: |-
      Voor de toepassing van [artikel 56 van de Algemene Ouderdomswet][ref1] worden, zolang zij in Oostenrijk wonen, met
      Nederlanders gelijkgesteld Oostenrijkers, die na het bereiken van de twintigjarige leeftijd gedurende ten minste
      vijftien jaren al dan niet onafgebroken binnen het Rijk hebben gewoond, mits zij gedurende de vijf aan het bereiken
      van de 65-jarige leeftijd onmiddellijk voorafgaande jaren onafgebroken binnen het Rijk hebben gewoond.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel56
    url: https://wetten.overheid.nl/BWBR0003880/2013-03-30#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '56'
  - number: '7.2'
    text: |-
      Voor de toepassing van het bepaalde in het eerste lid is het bepaalde in [artikel 1, tweede lid][ref1], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003880#Artikel1
    url: https://wetten.overheid.nl/BWBR0003880/2013-03-30#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003880
        artikel: '1'
  - number: '8'
    text: |-
      Uitsluitend voor de vaststelling van de toeslag, bedoeld in [artikel 8 van de Algemene Ouderdomswet][ref1] met
      toepassing van het bepaalde in artikel 13, tweede lid, onderdeel *a*, van die wet, wordt - indien dit tot een voor
      de betrokkene gunstiger beslissing leidt - de jongere echtgenoot van de pensioengerechtigde:


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel8
    url: https://wetten.overheid.nl/BWBR0003880/2013-03-30#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '8'
  - number: 8.a
    text: |-
      voor de toepassing van de [artikelen 1][ref1], [4][ref2] en [7][ref3] geacht het 65ste levensjaar te hebben
      voleindigd op dezelfde dag als die pensioengerechtigde;


      [ref1]: https://wetten.overheid.nl/BWBR0003880#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003880#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0003880#Artikel7
    url: https://wetten.overheid.nl/BWBR0003880/2013-03-30#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003880
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0003880
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0003880
        artikel: '7'
  - number: 8.b
    text: |-
      voor de toepassing van [artikel 3][ref1] geacht het 50ste levensjaar te hebben voleindigd op dezelfde dag als die
      pensioengerechtigde.


      [ref1]: https://wetten.overheid.nl/BWBR0003880#Artikel3
    url: https://wetten.overheid.nl/BWBR0003880/2013-03-30#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003880
        artikel: '3'
  - number: '9'
    text: |-
      Het koninklijk besluit van 18 december 1956 (*Stb.* 627) tot vaststelling van een algemene maatregel van
      bestuur als bedoeld in de artikelen 45, onder *a*, en 48, onder *a*, van de [Algemene Ouderdomswet][ref1], wordt
      ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0003880/2013-03-30#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: '10'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na plaatsing in het *Staatsblad* en werkt terug tot 1
      april 1985.
    url: https://wetten.overheid.nl/BWBR0003880/2013-03-30#Artikel10
