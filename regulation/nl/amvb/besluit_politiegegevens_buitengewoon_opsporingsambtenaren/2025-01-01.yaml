  - number: '3'
    text: |-
      1 De verwerkingsverantwoordelijke kan voor specifieke vormen van de verwerking van politiegegevens een beroep doen
      op een persoon die onder zijn beheer valt en die geen buitengewoon opsporingsambtenaar is.

      2 In de autorisatie worden vastgelegd het onderwerp en de duur van de verwerking, de aard en het doel van de
      verwerking, het soort persoonsgegevens en de categorieën van betrokkenen.
    url: https://wetten.overheid.nl/BWBR0041971/2025-01-01#Artikel3
  - number: '4'
    text: |-
      Onverminderd [artikel 2:13, eerste lid, van het Besluit politiegegevens][ref1] kan de verwerkingsverantwoordelijke
      het ter beschikking stellen van politiegegevens over toezicht aan ambtenaren van politie of buitengewoon
      opsporingsambtenaren die onder een andere verwerkingsverantwoordelijke ressorteren, weigeren of aan beperkende
      voorwaarden onderwerpen, indien dit noodzakelijk is voor een goede uitvoering van de opsporingstaak.


      [ref1]: https://wetten.overheid.nl/BWBR0023086#Artikel213
    url: https://wetten.overheid.nl/BWBR0041971/2025-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0023086
        artikel: 2:13
  - number: '5'
    text: |-
      Onverminderd [artikel 2:12 van het Besluit politiegegevens][ref1] kan de bevoegde functionaris politiegegevens
      over toezicht voorzien van de code vertrouwelijke verwerking, op zodanige wijze dat de overeenkomende gegevens
      gedeeltelijk zichtbaar zijn en de andere gerelateerde gegevens zichtbaar zijn na instemming van de daartoe bevoegde
      functionaris.


      [ref1]: https://wetten.overheid.nl/BWBR0023086#Artikel212
    url: https://wetten.overheid.nl/BWBR0041971/2025-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0023086
        artikel: 2:12
  - number: '6'
    text: |-
      1 De verwerkingsverantwoordelijke kan, voor zover verenigbaar met de opsporingstaak en in overeenstemming met het
      bevoegd gezag, bedoeld in [artikel 148, tweede lid, van het Wetboek van Strafvordering][ref1], beslissen tot de
      verstrekking van politiegegevens die door een buitengewoon opsporingsambtenaar zijn verzameld en worden verwerkt
      overeenkomstig de [artikelen 8][ref2], [9][ref3] en [13 van de wet][ref4], aan personen of instanties, voor zover
      zij deze behoeven voor een goede uitvoering van hun taak.

      2 De verstrekking van politiegegevens die worden verwerkt overeenkomstig [artikel 9 van de wet][ref5] vindt
      uitsluitend plaats indien dit strikt noodzakelijk is voor het doel van de verstrekking, na overleg met een bevoegde
      functionaris.

      3 In de beslissing, bedoeld in het eerste lid, wordt vastgelegd ten behoeve van welk zwaarwegend algemeen belang de
      verstrekking noodzakelijk is, de persoon of instantie aan wie de gegevens worden verstrekt, de taak ter uitvoering
      waarvan de gegevens worden verstrekt, de gegevens die worden verstrekt, de voorwaarden waaronder de gegevens
      worden verstrekt en, indien van toepassing, de motivering van de strikte noodzaak, bedoeld in het tweede lid. De
      beslissing wordt gepubliceerd in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel148
      [ref2]: https://wetten.overheid.nl/BWBR0022463#Artikel8
