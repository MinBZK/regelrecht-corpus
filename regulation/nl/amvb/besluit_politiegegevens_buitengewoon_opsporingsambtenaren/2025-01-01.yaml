  - number: '2'
    text: |-
      1 Onverminderd [artikel 46, eerste lid, van de wet][ref1] is het bij die [wet][ref2] bepaalde met betrekking tot
      de verwerking van politiegegevens van overeenkomstige toepassing op de verwerking van persoonsgegevens door een
      buitengewoon opsporingsambtenaar, met uitzondering van de [artikelen 10][ref3], [11, tweede lid][ref4], [12][ref5],
      [16, eerste lid, onderdeel b, eerste indent][ref6], [34][ref7] en [36a tot en met 45][ref8].

      2 Onverminderd [artikel 46, eerste lid, van de wet][ref9] is het in het [Besluit politiegegevens][ref10]
      bepaalde met betrekking tot de verwerking van politiegegevens van overeenkomstige toepassing op de
      verwerking van persoonsgegevens door een buitengewoon opsporingsambtenaar, met uitzondering van de
      [artikelen 2:2, tweede en derde lid][ref11], [2:3 tot en met 2:7][ref12], [2:10, tweede lid][ref13],
      [2:13, tweede lid][ref14], [3:1][ref15], [3:2][ref16], [4:1, eerste lid, onderdeel b, en tweede lid][ref17],
      [4:2, eerste lid, de onderdelen a, c, d, e, i, k, q en y, tweede en derde lid][ref18], [6:1][ref19], [6:6][ref20],
      en [6a:1 tot en met 6a:7 van het Besluit politiegegevens][ref21].


