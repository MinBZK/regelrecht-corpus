  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister voor Rechtsbescherming, gedaan mede namens Onze Minister van Defensie, van
    10 oktober 2018, nr. 2382477, directie Wetgeving en Juridische Zaken;

    Gelet op de artikelen 6, zesde lid, 11, derde lid, 15, tweede lid, 18, eerste lid, en 46, eerste lid, van de Wet
    politiegegevens;

    De Afdeling advisering van de Raad van State gehoord (advies van 19 december 2018, nr. W16.18.0311/II);

    Gezien het nader rapport van Onze Minister voor Rechtsbescherming, mede namens Onze Minister van Defensie, van
    1 februari 2019, nr.2473765, directie Wetgeving en Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0041971/2025-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. *wet:* [Wet politiegegevens][ref1];

      b. *buitengewoon opsporingsambtenaar:* de personen, bedoeld in
      [artikel 142, eerste lid, onderdelen a tot en met c, van het Wetboek van Strafvordering][ref2];

      c. *verwerkingsverantwoordelijke:* de werkgever, bedoeld in
      [artikel 1, onderdeel h, van het Besluit buitengewoon opsporingsambtenaar][ref3];

      d. *de opsporingstaak:* de opsporing van de strafbare feiten, bedoeld in de akte of aanwijzing van
      opsporingsbevoegdheid, bedoeld in [artikel 142, tweede lid, van het Wetboek van Strafvordering][ref4];

      e. *ambtenaar van politie:* de ambtenaar, bedoeld in [artikel 1, onderdeel k, van de wet][ref5];

      f. *bevoegde functionaris:* functionaris, bedoeld in
      [artikel 2:10, eerste lid, van het Besluit politiegegevens][ref6] of een andere daartoe aangewezen buitengewoon
      opsporingsambtenaar die beschikt over voldoende kennis en vaardigheden;

      g. *politiegegevens over toezicht:* politiegegevens die betrekking hebben op het toezicht op de naleving van
      wetgeving of de uitvoering van wettelijke voorschriften;

      h. *domein:* het in de akte vermelde maatschappelijke deelterrein waarop de buitengewoon opsporingsambtenaar
      werkzaam is, als aangewezen in de domeinlijsten zoals opgenomen in de [bijlage bij de Regeling domeinlijsten
      buitengewoon opsporingsambtenaar](onbekend).


