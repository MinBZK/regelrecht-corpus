  - number: '7'
    text: |-
      1 De verwerkingsverantwoordelijke kan, in overeenstemming met het bevoegd gezag, bedoeld in
      [artikel 148, tweede lid, van het Wetboek van Strafvordering][ref1] beslissen tot de verstrekking van
      politiegegevens die door een buitengewoon opsporingsambtenaar zijn verzameld en worden verwerkt overeenkomstig
      de [artikelen 8][ref2], [9][ref3] en [13 van de wet][ref4], aan een bestuursorgaan dat of aan personen die bij
      of krachtens wetgeving is of zijn belast met het houden van toezicht op de naleving dan wel de uitvoering van
      wetgeving op het betreffende domein, voor zover dat noodzakelijk is voor een goede uitvoering van zijn of hun taak.

      2 De verstrekking van politiegegevens overeenkomstig het eerste lid vindt, voor zover die gegevens worden verwerkt
      overeenkomstig [artikel 9 van de wet][ref5], uitsluitend plaats indien dit strikt noodzakelijk is voor het doel van
      de verstrekking, na overleg met een bevoegde functionaris.

      3 In bijzondere gevallen kan de verwerkingsverantwoordelijke beslissen tot de verstrekking van politiegegevens
      als bedoeld in het eerste lid, aan een bestuursorgaan dat of aan personen die bij of krachtens wetgeving is of
      zijn belast met het houden van toezicht op de naleving dan wel de uitvoering van wetgeving op een ander domein,
      voor zover dat noodzakelijk is voor een goede uitvoering van het toezicht. Het bepaalde in het tweede lid is van
      overeenkomstige toepassing. In de beslissing wordt vastgelegd ten behoeve van welk zwaarwegend algemeen belang de
      verstrekking noodzakelijk is, de persoon of instantie aan wie de gegevens worden verstrekt, de taak ter uitvoering
      waarvan de gegevens worden verstrekt, de gegevens die worden verstrekt, de voorwaarden waaronder de gegevens worden
      verstrekt en, indien van toepassing, de motivering van de strikte noodzaak, bedoeld in het tweede lid.


