  - number: '6'
    text: |-
      1 Onverminderd [artikel 5][ref1] worden de verplichtingen op grond van de [WW][ref2] en de [IOW][ref3] ingedeeld in
      de derde categorie voor zover zij betrekking hebben op:

      a. het voorkomen werkloos te zijn of te blijven door in onvoldoende mate te trachten passende of
      algemeen geaccepteerde arbeid te verkrijgen of door in verband met de te verrichten arbeid eisen te
      stellen die het aanvaarden of verkrijgen van passende of algemeen geaccepteerde arbeid belemmeren,
      bedoeld in [artikel 24, eerste lid, onderdeel b, ten eerste en ten vierde, van de WW][ref4] en
      [artikel 15, onderdelen b en d, van de IOW][ref5]; of

      b. het nakomen van op grond van [hoofdstuk VI van de WW][ref6] opgelegde verplichtingen, bedoeld in
      [artikel 26, eerste lid, onderdeel i, van die wet][ref7].

      2 Onverminderd [artikel 5 worden de verplichtingen op grond van de ZW][ref8] ingedeeld in de derde categorie voor
      zover zij betrekking hebben op:

      a. het meewerken aan door zijn werkgever of door een door die werkgever aangewezen deskundige gegeven redelijke
      voorschriften of getroffen maatregelen, die erop gericht zijn de verzekerde in staat te stellen passende arbeid te
      verrichten, bedoeld in [artikel 45, eerste lid, onderdeel m, van die wet][ref9];

      b. het verrichten van voldoende re-integratie-inspanningen in de periode voorafgaand aan de
      aangifte door de werkgever van de ongeschiktheid tot werken van de verzekerde, bedoeld in
      [artikel 45, eerste lid, onderdeel m, van die wet][ref10]; of

      c. het trachten te verkrijgen van passende arbeid door de zieke werknemer, bedoeld in
      [artikel 30, eerste lid, van die wet][ref11].

      3 Onverminderd [artikel 5][ref12] wordt ingedeeld in de derde categorie de verplichting op grond van
      [artikel 28, onderdeel h, van de WAO][ref13], die betrekking heeft op:

      a. het meewerken aan door zijn werkgever of door een door die werkgever aangewezen deskundige gegeven redelijke
      voorschriften of getroffen maatregelen, die erop gericht zijn de belanghebbende in staat te stellen passende arbeid
      te verrichten; of

      b. het verrichten van voldoende re-integratie-inspanningen in de periode voorafgaand aan de aanvraag voor
      toekenning van WAO-uitkering.

      4 De verplichtingen op grond van de [Wet WIA][ref14] en de [IOW][ref15] worden ingedeeld in de derde categorie voor
      zover zij betrekking hebben op:

      a. het voorkomen van het ontstaan en bestaan van een recht op uitkering, bedoeld in
      [artikel 28 van de Wet WIA][ref16];

      b. het vergroten van de mogelijkheden tot het verrichten van arbeid, bedoeld in [artikel 29 van de Wet WIA][ref17]
      en [artikel 14, tweede lid, onderdeel c, van de IOW][ref18]; of

      c. inschakeling in de arbeid, bedoeld in [artikel 30, eerste lid, van de Wet WIA][ref19].

      5 Onverminderd [artikel 5][ref20] wordt ingedeeld in de derde categorie de verplichting om het
      bestaan van arbeidsongeschiktheid of verminderde arbeidsgeschiktheid te beperken, bedoeld in
      [artikel 2:8, eerste lid, van de Wet Wajong][ref21].


