  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 2 juli 2007, nr. SV/R&S/07/21943;

    Gelet op de artikelen 27, tiende lid, van de Werkloosheidswet, 45, zesde lid, van de Ziektewet, 29, vijfde
    lid, van de Wet op de arbeidsongeschiktheidsverzekering, 90, derde lid, van de Wet werk en inkomen naar
    arbeidsvermogen, 47, vijfde lid, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen, 39, vijfde lid, van
    de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten, 14, zesde lid, van de Toeslagenwet, 17b, zesde lid,
    van de Algemene Ouderdomswet, 38, zesde lid, van de Algemene nabestaandenwet, en 17, zesde lid, van de Algemene
    Kinderbijslagwet;

    De Raad van State gehoord (advies van 25 juli 2007, nummer W12.07.0188/III);

    Gezien het nader rapport van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 17 augustus 2007,
    Directie Sociale Verzekeringen, nr. SV/R&S/07/26337;

    Hebben goedgevonden en verstaan:
