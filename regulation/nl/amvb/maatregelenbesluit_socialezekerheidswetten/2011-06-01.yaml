  - number: '5'
    text: |-
      De verplichtingen, op grond van de in [artikel 1, onderdelen b tot en met d, f, g en m][ref1], genoemde wetten,
      worden ingedeeld in de derde categorie voor zover zij betrekking hebben op:

      a. het meewerken aan scholing, opleiding of activiteiten, bedoeld in de [hoofdstukken VI][ref2] en
      [XA van de WW][ref3], gericht op inschakeling in de arbeid, alsmede het beschikbaar zijn voor de voorzieningen,
      bedoeld in [artikel 7, eerste lid, onderdeel a, van de Wet werk en bijstand][ref4] en het meewerken aan het
      verkrijgen van die voorzieningen, bedoeld in de [artikelen 26, eerste lid, onderdelen e en f, van de WW][ref5],
      [45, eerste lid, onderdeel l, van de ZW][ref6], [28, onderdeel g, van de WAO][ref7],
      [46, onderdeel g, van de WAZ][ref8], 3:38, eerste lid, onderdeel g, van de Wet Wajong en
      [14, tweede lid, onderdeel b, van de IOW][ref9];

      b. het meewerken aan het opstellen van het plan van aanpak, de re-integratievisie, het re-integratieplan
      of het participatieplan, bedoeld in de [artikelen 26, eerste lid, onderdeel k, van de WW][ref10],
      [45, eerste lid, onderdeel o, van de ZW][ref11], [28, onderdeel i, van de WAO][ref12],
      [29, tweede lid, onderdeel d, van de Wet WIA][ref13], [46, onderdeel h, van de WAZ][ref14],
      [2:8, tweede lid, onderdeel a][ref15], [2:31, tweede lid, onderdeel b][ref16], en
      [3:38, eerste lid, onderdeel h, van de Wet Wajong][ref17] en [14, tweede lid, onderdeel d, van de IOW][ref18];

      c. het nakomen van de plichten die zijn opgenomen in het plan van aanpak, de re-integratievisie
      of het re-integratieplan, bedoeld in de [artikelen 26, eerste lid, onderdeel l, van de WW][ref19],
      [45, eerste lid, onderdeel p, van de ZW][ref20], [28, onderdeel j, van de WAO][ref21],
      [29, tweede lid, onderdeel e, van de Wet WIA][ref22], [46, onderdeel i, van de WAZ][ref23],
      [2:31, tweede lid, onderdeel c][ref24], en [3:38, eerste lid, onderdeel i, van de Wet Wajong][ref25] en
      [14, tweede lid, onderdeel e, van de IOW][ref26];

      d. het binnen redelijke termijn geneeskundige hulp inroepen en het zich gedurende het gehele verloop
      van ziekte of arbeidsongeschiktheid onder behandeling blijven stellen of de voorschriften van de
      behandelend arts op volgen, bedoeld in de [artikelen 45, eerste lid, onderdeel a, van de ZW][ref27],
      [28, onderdeel b, van de WAO][ref28], [46, onderdeel b, van de WAZ][ref29], [2:8, tweede lid, onderdeel b][ref30],
      [2:31, tweede lid, onderdeel a][ref31], en [3:38, eerste lid, onderdeel b, van de Wet Wajong][ref32] en
      [14, tweede lid, onderdeel a, van de IOW][ref33];

      e. het zich niet schuldig maken aan gedragingen waardoor de genezing wordt belemmerd of het meewerken om aanpassing
      aan zijn ziekte of gebrek te verkrijgen, bedoeld in de [artikelen 45, eerste lid, onderdeel b, van de ZW][ref34],
      [artikel 28, onderdeel c, van de WAO][ref35], [46, onderdeel c, van de WAZ][ref36] en
      [2:31, tweede lid, onderdeel a, en 3:38, eerste lid, onderdeel c, van de Wet Wajong][ref37]; of

      f. het opvolgen van door het UWV of de door hem daartoe aangewezen deskundige gegeven voorschriften in het belang
      van de behandeling of genezing of tot behoud, herstel of bevordering van de mogelijkheid tot het verrichten van
      arbeid, bedoeld in de [artikelen 28, onderdeel a, van de WAO][ref38], [46, onderdeel a, van de WAZ][ref39] en
      [2:31, tweede lid, onderdeel a][ref40], en [3:38, eerste lid, onderdeel a, van de Wet Wajong][ref41].


