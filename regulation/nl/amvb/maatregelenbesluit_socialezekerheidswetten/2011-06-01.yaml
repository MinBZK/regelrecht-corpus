  - number: '4'
    text: |-
      De verplichtingen op grond van de in [artikel 1, onderdelen b tot en met h, j, k, l en m][ref1], genoemde wetten,
      worden ingedeeld in de tweede categorie voor zover zij betrekking hebben op:

      a. het meewerken aan een onderzoek, al dan niet van geneeskundige aard, bedoeld in de
      [artikelen 26, eerste lid, onderdeel g, van de WW][ref2], [45, eerste lid, onderdeel c, van de ZW][ref3],
      [25, eerste lid, onderdeel b, van de WAO][ref4], [27, tweede lid, onderdeel c, van de Wet WIA][ref5],
      [45, eerste lid, onderdeel b, van de WAZ][ref6], [2:7, tweede lid, onderdeel c, en vierde lid][ref7], en
      [3:37, eerste lid, onderdeel b, van de Wet Wajong][ref8], [15 van de AOW][ref9], [37 van de Anw][ref10],
      [16 van de AKW][ref11] en [12, tweede lid, onderdeel c, van de IOW][ref12];

      b. het voldoen aan een voorschrift, gegeven door het UWV of de door hem daartoe aangewezen deskundige,
      om zich ter observatie te doen opnemen of te verblijven in een aangewezen inrichting, bedoeld in de
      [artikelen 25, eerste lid, onderdeel c, van de WAO][ref13], [27, vijfde lid, van de Wet WIA][ref14],
      [45, eerste lid, onderdeel c, van de WAZ][ref15], en [2:7, zesde lid][ref16], en
      [3:37, eerste lid, onderdeel c, van de Wet Wajong][ref17];

      c. het voldoen aan elke oproep om aanwezig te zijn of het beantwoorden van vragen die door het UWV in verband met
      het recht op uitkering worden gesteld, bedoeld in de [artikelen 45, eerste lid, onderdeel c, van de ZW][ref18],
      [25 van de WAO][ref19], [27, tweede lid, onderdelen a en b, van de Wet WIA][ref20], [45 van de WAZ][ref21],
      [artikel 2:7, tweede lid, onderdelen a en b, vierde lid][ref22], en [3:37 van de Wet Wajong][ref23],
      [15 van de AOW][ref24], [16 van de AKW][ref25] en [12, tweede lid, onderdelen a en b, van de IOW][ref26];

      d. het, bij deelname aan een re-integratietraject, onmiddellijk mededelen van de reden van
      het niet naleven van re-integratieverplichtingen aan het re-integratiebedrijf, bedoeld in de
      [artikelen 26, eerste lid, onderdeel m, van de WW][ref27], [28, onderdeel k, van de WAO][ref28],
      [27, vierde lid, van de Wet WIA][ref29], [46, onderdeel j, van de WAZ][ref30], [2:7, vijfde lid][ref31], en
      [3:38, eerste lid, onderdeel j, van de Wet Wajong][ref32] en [12, vierde lid, van de IOW][ref33];

      e. registratie als werkzoekende en het tijdig verlengen van die registratie, bedoeld in de
      [artikelen 26, eerste lid, onderdeel d, van de WW][ref34], [30, derde lid, van de ZW][ref35],
      [28, onderdeel a, van de WAO][ref36], [30, tweede lid, van de Wet WIA][ref37], [46, onderdeel a, van de WAZ][ref38],
      [2:32, eerste lid][ref39], en [3:38, eerste lid, onderdeel a, van de Wet Wajong][ref40] en
      [15, onderdeel a, van de IOW][ref41]; of

      f. het vergezeld laten gaan van de aanvraag van de uitkering van een re-integratieverslag, bedoeld in
      [artikel 34a, eerste lid, eerste zin, van de WAO][ref42] en [artikel 65, eerste zin, van de Wet WIA][ref43]
      dan wel het voldoen aan het verzoek tot verstrekken van het re-integratieverslag aan het UWV, bedoeld in
      [artikel 38, tweede lid, derde volzin van de ZW][ref44].


