  - number: '3'
    text: |-
      De verplichtingen op grond van de in [artikel 1, onderdelen b tot en met n][ref1], genoemde wetten, worden
      ingedeeld in de eerste categorie voor zover zij betrekking hebben op:

      a. het tijdig aanvragen van de uitkering, bedoeld in de [artikelen 26, eerste lid, onderdeel b, van de WW][ref2],
      [34, derde lid][ref3], en [34a, vierde lid, van de WAO][ref4], [64, derde lid, van de Wet WIA][ref5],
      [35, vierde lid, van de WAZ][ref6] en [28, vierde lid, van de Wet Wajong][ref7];

      b. het tijdig doen van aangifte van werkloosheid en het tijdig melden van ziekte, bedoeld in
      de [artikelen 26, eerste lid, onderdeel a, van de WW][ref8] en [38a, eerste lid][ref9], en
      [38ab, eerste lid, van de ZW][ref10];

      c. het naleven van vastgestelde controlevoorschriften die noodzakelijk zijn voor een juiste
      uitvoering van deze wetten, bedoeld in de [artikelen 26, eerste lid, onderdeel c, van de WW][ref11],
      [12, tweede lid, onderdeel d][ref12], juncto [artikel 17, eerste lid, onderdeel a, van de IOW][ref13],
      [45, eerste lid, onderdeel e, van de ZW][ref14], [28, onderdeel d, van de WAO][ref15],
      [27, tweede lid, onderdeel d, van de Wet WIA][ref16], [46, onderdeel d, van de WAZ][ref17],
      [2:7, tweede lid, onderdeel d, en vierde lid][ref18], en [3:38, eerste lid, onderdeel d, van de Wet Wajong][ref19],
      [13 van de TW][ref20], [15, tweede lid, van de AOW][ref21], [36, tweede lid, van de Anw][ref22] en
      [16, tweede lid, van de AKW][ref23], behoudens voor zover de controlevoorschriften betrekking hebben op de in
      [artikel 4, onderdeel a of c][ref24], genoemde verplichtingen;

      d. het binnen de vastgestelde termijn gevolg geven aan een verzoek om alle feiten en omstandigheden mede te
      delen waarvan redelijkerwijs duidelijk is dat zij van invloed kunnen zijn op het recht op uitkering, het geldend
      maken van het recht op uitkering, de hoogte of de duur van de uitkering, of het bedrag dat wordt betaald,
      bedoeld in de [artikelen 25 van de WW][ref25], [12, eerste lid, van de IOW][ref26], [31, eerste lid][ref27], en
      [49 van de ZW][ref28], [27, eerste lid, van de Wet WIA][ref29], [80 van de WAO][ref30], [70 van de WAZ][ref31],
      [2:7, eerste en vierde lid][ref32], en [3:74 van de Wet Wajong][ref33], [12 van de TW][ref34],
      [49 van de AOW][ref35], [35 van de Anw][ref36] en [15 van de AKW][ref37]. Onder uitkering wordt tevens verstaan
      toeslag als bedoeld in [artikel 11, tweede lid, van de TW][ref38], ouderdomspensioen en toeslag als bedoeld in de
      [artikelen 7][ref39] en [8 van de AOW][ref40], alsmede kinderbijslag als bedoeld in [artikel 7 van de AKW][ref41]
      en onder feiten en omstandigheden wordt onder meer verstaan informatie in het kader van re-integratie;

      e. het onverwijld op verzoek inzage verstrekken in een document als bedoeld
      in [artikel 1 van de Wet op de Identificatieplicht][ref42], bedoeld in
      [artikel 55, tweede lid, van de Wet SUWI][ref43];

      f. het voldoen aan de andere voorwaarden die het UWV op grond van [artikel 101, tweede lid, van de WW][ref44]
      en [artikel 17, eerste lid, onderdeel c, van de IOW][ref45] stelt, bedoeld in
      [artikel 26, eerste lid, onderdeel h, van de WW][ref46] en [artikel 12, tweede lid, onderdeel d][ref47], juncto
      [artikel 17, eerste lid, onderdeel c, van de IOW][ref48];

      g. het opvolgen van voorschriften van het UWV in verband met het genieten van vakantie tijdens de duur van
      de uitkering op grond van de [WW][ref49], bedoeld in [artikel 26, eerste lid, onderdeel j, van de WW][ref50]
      en op grond van de [IOW][ref51], bedoeld in [artikel 12, tweede lid, onderdeel d][ref52], juncto
      [artikel 17, eerste lid, onderdeel b, van de IOW][ref53].


