  - number: '8'
    text: |-
      Indien aan de belanghebbende een maatregel is opgelegd en binnen twee jaar na de bekendmaking daarvan opnieuw
      dezelfde verplichting niet of niet behoorlijk wordt nagekomen worden het percentage van de op te leggen maatregel
      alsmede het minimumbedrag, genoemd in [artikel 2, eerste lid][ref1], met 50% verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0022445#Artikel2
    url: https://wetten.overheid.nl/BWBR0022445/2011-06-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0022445
        artikel: '2'
  - number: '9'
    text: |-
      Indien sprake is van het niet of niet behoorlijk nakomen van meer dan één verplichting, bedoeld in de
      [artikelen 3 tot en met 8][ref1], en het niet nakomen van deze verplichtingen voortkomt uit één oorzaak wordt
      slechts één maatregel opgelegd, bij verschil die uit de hoogste categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0022445#Artikel3
    url: https://wetten.overheid.nl/BWBR0022445/2011-06-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0022445
        artikel: '3'
  - number: '10'
    text: |-
      Het [Maatregelenbesluit UWV][ref1], het [Maatregelbesluit AOW][ref2], het [Maatregelbesluit Anw][ref3] en het
      [Maatregelbesluit AKW][ref4], zoals die luidden op de dag voorafgaande aan de dag van inwerkingtreding van dit
      besluit, blijven van toepassing op de niet, niet behoorlijke of niet tijdige nakoming van de desbetreffende
      verplichtingen, die voorafgaat aan 1 mei 2008.


      [ref1]: https://wetten.overheid.nl/BWBR0017084
      [ref2]: https://wetten.overheid.nl/BWBR0007873
      [ref3]: https://wetten.overheid.nl/BWBR0008018
