  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 2 juli 2007, nr. SV/R&S/07/21943;

    Gelet op de artikelen 27, tiende lid, van de Werkloosheidswet, 45, zesde lid, van de Ziektewet, 29, vijfde
    lid, van de Wet op de arbeidsongeschiktheidsverzekering, 90, derde lid, van de Wet werk en inkomen naar
    arbeidsvermogen, 47, vijfde lid, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen, 39, vijfde lid, van
    de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten, 14, zesde lid, van de Toeslagenwet, 17b, zesde lid,
    van de Algemene Ouderdomswet, 38, zesde lid, van de Algemene nabestaandenwet, en 17, zesde lid, van de Algemene
    Kinderbijslagwet;

    De Raad van State gehoord (advies van 25 juli 2007, nummer W12.07.0188/III);

    Gezien het nader rapport van de Staatssecretaris van Sociale Zaken en Werkgelegenheid van 17 augustus 2007,
    Directie Sociale Verzekeringen, nr. SV/R&S/07/26337;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0022445/2022-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. maatregel: een besluit waarmee een uitkering op grond van een in onderdelen b tot en met m genoemde wet,
      onderscheidenlijk een remigratievoorziening op grond van de in onderdeel n genoemde wet, gedeeltelijk of geheel
      wordt onthouden wegens het niet naleven van een wettelijke verplichting;

      b. WW: [Werkloosheidswet][ref1];

      c. ZW: [Ziektewet][ref2];

      d. WAO: [Wet op de arbeidsongeschiktheidsverzekering][ref3];

      e. Wet WIA: [Wet werk en inkomen naar arbeidsvermogen][ref4];

      f. WAZ: [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref5];

      g. Wajong: [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref6];

      h. Wazo: [Wet arbeid en zorg][ref7];

      i. TW: [Toeslagenwet][ref8];

      j. AOW: [Algemene Ouderdomswet][ref9];

      k. Anw: [Algemene nabestaandenwet][ref10];

      l. AKW: [Algemene Kinderbijslagwet][ref11];

      m. *IOW:* [Wet inkomensvoorziening oudere werklozen][ref12];

      n. *RW:* [Remigratiewet][ref13];

      o. Wet SUWI: [Wet structuur uitvoeringsorganisatie werk en inkomen][ref14];

      p. UWV: Uitvoeringsinstituut werknemersverzekeringen, genoemd in [hoofdstuk 5 van de Wet SUWI][ref15];

      q. SVB: Sociale verzekeringsbank, genoemd in [hoofdstuk 6 van de Wet SUWI][ref16].


