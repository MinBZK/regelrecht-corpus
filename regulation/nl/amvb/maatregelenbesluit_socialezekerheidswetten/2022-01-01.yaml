  - number: '3'
    text: |-
      De verplichtingen op grond van de in [artikel 1, onderdelen b tot en met o][ref1], genoemde wetten, worden
      ingedeeld in de eerste categorie voor zover zij betrekking hebben op:

      a. het tijdig aanvragen van de uitkering, bedoeld in de [artikelen 26, eerste lid, onderdeel b, van de WW][ref2],
      [34, derde lid][ref3], en [34a, vierde lid, van de WAO][ref4], [64, derde lid, van de Wet WIA][ref5],
      [35, vierde lid, van de WAZ][ref6], [28, vierde lid, van de WAJONG][ref7] en
      [artikel 3:22, eerste lid, van de Wet arbeid en zorg][ref8];

      b. het tijdig doen van aangifte van werkloosheid en het tijdig melden van ziekte, bedoeld in de
      [artikelen 38a, eerste lid][ref9], en [38ab, eerste lid, van de ZW][ref10];

      c. het naleven van vastgestelde controlevoorschriften die noodzakelijk zijn voor een juiste
      uitvoering van deze wetten, bedoeld in de [artikelen 26, eerste lid, onderdeel c, van de WW][ref11],
      [12, tweede lid, onderdeel d][ref12], juncto [artikel 17, eerste lid, onderdeel a, van de IOW][ref13],
      [45, eerste lid, onderdeel e, van de ZW][ref14], [28, onderdeel d, van de WAO][ref15],
      [27, tweede lid, onderdeel d, van de Wet WIA][ref16], [46, onderdeel d, van de WAZ][ref17],
      [2:7, tweede lid, onderdeel d, en vierde lid][ref18], en [3:38, eerste lid, onderdeel d, van de Wajong][ref19],
      [13, eerste lid, van de TW][ref20], [15, tweede lid, van de AOW][ref21], [36, tweede lid, van de Anw][ref22],
      [16, tweede lid, van de AKW][ref23] en [8g, tweede lid, van de RW][ref24], behoudens voor zover de
      controlevoorschriften betrekking hebben op de in [artikel 4, onderdeel a of c][ref25], genoemde verplichtingen;

      d. het binnen de vastgestelde termijn gevolg geven aan een verzoek om alle feiten en omstandigheden mede te
      delen waarvan redelijkerwijs duidelijk is dat zij van invloed kunnen zijn op het recht op uitkering, het geldend
      maken van het recht op uitkering, de hoogte of de duur van de uitkering, of het bedrag dat wordt betaald,
      bedoeld in de [artikelen 25 van de WW][ref26], [12, eerste lid, van de IOW][ref27], [31, eerste lid][ref28], en
      [49 van de ZW][ref29], [27, eerste lid, van de Wet WIA][ref30], [80 van de WAO][ref31], [70 van de WAZ][ref32],
      [2:7, eerste en vierde lid][ref33], en [3:74 van de Wajong][ref34], [12 van de TW][ref35], [49 van de AOW][ref36],
      [35 van de Anw][ref37] en [15 van de AKW][ref38]. Onder uitkering wordt tevens verstaan toeslag als bedoeld in
      [artikel 11, tweede lid, van de TW][ref39], ouderdomspensioen en toeslag als bedoeld in de [artikelen 7][ref40]
      en [8 van de AOW][ref41], alsmede kinderbijslag als bedoeld in [artikel 7 van de AKW][ref42] en onder feiten en
      omstandigheden wordt onder meer verstaan informatie in het kader van re-integratie;

      e. het onverwijld op verzoek inzage verstrekken in een document als bedoeld
      in [artikel 1 van de Wet op de Identificatieplicht][ref43], bedoeld in
      [artikel 55, tweede lid, van de Wet SUWI][ref44];

      f. het voldoen aan de andere voorwaarden die het UWV op grond van [artikel 101, tweede lid, van de WW][ref45]
      en [artikel 17, eerste lid, onderdeel c, van de IOW][ref46] stelt, bedoeld in
      [artikel 26, eerste lid, onderdeel h, van de WW][ref47] en [artikel 12, tweede lid, onderdeel d][ref48], juncto
      [artikel 17, eerste lid, onderdeel c, van de IOW][ref49];

      g. het opvolgen van voorschriften van het UWV in verband met het genieten van vakantie tijdens de duur van
      de uitkering op grond van de [WW][ref50], bedoeld in [artikel 26, eerste lid, onderdeel j, van de WW][ref51]
      en op grond van de [IOW][ref52], bedoeld in [artikel 12, tweede lid, onderdeel d][ref53], juncto
      [artikel 17, eerste lid, onderdeel b, van de IOW][ref54];

      h. het gevolg geven aan een verzoek om alle feiten en omstandigheden mede te delen of dit onverwijld uit
      eigen beweging te doen waarvan redelijkerwijs duidelijk is dat zij van invloed kunnen zijn op het recht
      op remigratievoorzieningen, het geldend maken van het recht op remigratievoorzieningen, de hoogte van de
      remigratievoorzieningen, of het bedrag dat wordt betaald, bedoeld in de [artikelen 2a][ref55], [2b][ref56],
      [4][ref57], [5][ref58], [6][ref59], [6a][ref60] en [11 van de RW][ref61].


