  - number: '2'
    text: |-
      1 De hoogte en duur van een, op grond van de in [artikel 1, onderdelen b tot en met n][ref1], genoemde wetten, op
      te leggen maatregel wordt, met dien verstande dat de hoogte van de maatregel ten minste € 25 bedraagt, vastgesteld
      op:

      a. 5 procent van het uitkeringsbedrag, met een mogelijkheid van afwijking tot ten minste 2 procent of ten hoogste
      20 procent van het uitkeringsbedrag, gedurende ten minste een maand bij verplichtingen uit de eerste categorie,
      bedoeld in [artikel 3][ref2];

      b. 10 procent van het uitkeringsbedrag, met een mogelijkheid van afwijking tot ten minste 5 procent of ten hoogste
      30 procent van het uitkeringsbedrag, gedurende ten minste twee maanden bij verplichtingen uit de tweede categorie,
      bedoeld in [artikel 4][ref3];

      c. 25 procent van het uitkeringsbedrag, met een mogelijkheid van afwijking tot ten minste 15 procent of ten hoogste
      100 procent van het uitkeringsbedrag, gedurende ten minste vier maanden bij verplichtingen uit de derde categorie,
      bedoeld in de [artikelen 5][ref4] en [6][ref5];

      d. een blijvend gehele weigering van de uitkering bij verplichtingen uit de vierde categorie, bedoeld in
      [artikel 7][ref6], tenzij het niet nakomen van de verplichting de belanghebbende niet in overwegende mate kan
      worden verweten, in welk geval onderdeel c van toepassing is; of

      e. een gehele of gedeeltelijke weigering van het uitkeringsbedrag gedurende ten hoogste drie maanden bij
      verplichtingen uit de vijfde categorie, bedoeld in [artikel 7a][ref7], tenzij het niet nakomen van de verplichting
      de belanghebbende niet in overwegende mate kan worden verweten, in welk geval er geen maatregel wordt opgelegd.

      2 Onder uitkering als bedoeld in het eerste lid wordt tevens verstaan de inkomensondersteuning, bedoeld in
      [artikel 2:39, eerste lid, van de Wajong][ref8] de toeslag, bedoeld in [artikel 11, tweede lid, van de TW][ref9],
      het ouderdomspensioen en de toeslag, bedoeld in de [artikelen 7][ref10] en [8 van de AOW][ref11], de kinderbijslag,
      bedoeld in [artikel 7 van de AKW][ref12], en de remigratievoorzieningen, bedoeld in de [RW][ref13].

      3 Voor de toepassing van het eerste lid wordt het bedrag aan kinderbijslag in aanmerking genomen waarop op grond
      van [artikel 12 van de AKW][ref14] recht bestaat ten behoeve van het kind of de kinderen ten aanzien van wie de
      overtreding is begaan en wordt de periode van een maand vervangen door een periode van een kwartaal.

      4 Indien een verplichting op grond van [artikel 30, eerste lid, onderdeel a, of derde lid van de Wet WIA][ref15] of
      [artikel 2:32, tweede lid, van de Wajong][ref16] niet is nagekomen legt het UWV, voor de toepassing van het eerste
      lid, onderdelen c en d, de maatregel op over dat deel van het uitkeringsbedrag dat niet zou zijn uitbetaald indien
      die verplichting wel zou zijn nagekomen.

      5 Voor de toepassing van het eerste lid, onderdeel d, wordt bij overtreding van de verplichting, bedoeld in
      [artikel 24, vijfde lid, van de WW][ref17], onder «blijvend gehele» verstaan:

      a. de gehele uitkering voor de duur dat de verzekerde de aanspraak op loon zou hebben kunnen doen gelden, dan wel
      de dienstbetrekking zou hebben kunnen voortduren; of

      b. dat deel van de uitkering dat niet tot uitbetaling zou komen, indien de benadelingshandeling niet had
      plaatsgevonden.

      6 Voor de toepassing van het eerste lid, onderdeel d, wordt bij overtreding van de verplichting, bedoeld in
      [artikel 45, eerste lid, onderdeel j, van de ZW][ref18], onder «blijvend» verstaan: voor de duur dat de verzekerde
      aanspraak op loon zou kunnen doen gelden.

      7 Voor de toepassing van het eerste lid, onderdeel d, wordt bij overtreding van de verplichting, bedoeld in
      [artikel 88, eerste lid, onderdeel d, van de Wet WIA][ref19], onder «blijvend» verstaan: voor de duur van het
      verlengde tijdvak, bedoeld in [artikel 25, negende lid, van die wet][ref20].

      8 Indien het niet nakomen van de verplichting, bedoeld in [artikel 30, derde lid, van de Wet WIA][ref21], de
      werknemer niet in overwegende mate kan worden verweten weigert het UWV de uitkering over een periode van ten
      hoogste 26 weken gedeeltelijk door de uitkering te halveren.

      9 Indien het niet nakomen van de verplichtingen, bedoeld in
      [artikel 2:32, tweede lid, onderdelen a en b, van de Wajong][ref22], de jonggehandicapte niet in overwegende mate
      kan worden verweten, weigert het UWV de uitkering over een periode van ten hoogste 26 weken gedeeltelijk door het
      bedrag aan uitkering te halveren.


