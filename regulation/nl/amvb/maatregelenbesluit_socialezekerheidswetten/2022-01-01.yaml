  - number: '5'
    text: |-
      De verplichtingen, op grond van de in [artikel 1, onderdelen b tot en met d, f, g en m][ref1], genoemde wetten,
      worden ingedeeld in de derde categorie voor zover zij betrekking hebben op:

      a. het meewerken aan scholing, opleiding of activiteiten, bedoeld in de [hoofdstukken VI][ref2] en
      [XA van de WW][ref3], gericht op inschakeling in de arbeid, alsmede het beschikbaar zijn voor de voorzieningen,
      bedoeld in [artikel 7, eerste lid, onderdeel a, van de Participatiewet][ref4] en het meewerken aan het
      verkrijgen van die voorzieningen, bedoeld in de [artikelen 26, eerste lid, onderdelen e en f, van de WW][ref5],
      [45, eerste lid, onderdeel l, van de ZW][ref6], [28, onderdeel g, van de WAO][ref7],
      [46, onderdeel g, van de WAZ][ref8], [3:38, onderdeel g, van de Wajong][ref9] en
      [14, tweede lid, onderdeel b, van de IOW][ref10];

      b. het meewerken aan het opstellen van het plan van aanpak, de re-integratievisie, het re-integratieplan
      of het participatieplan, bedoeld in de [artikelen 26, eerste lid, onderdeel k, van de WW][ref11],
      [45, eerste lid, onderdeel o, van de ZW][ref12], [28, onderdeel i, van de WAO][ref13],
      [29, tweede lid, onderdeel d, van de Wet WIA][ref14], [46, onderdeel h, van de WAZ][ref15],
      [2:8, tweede lid, onderdeel a][ref16], [2:31, tweede lid, onderdeel b][ref17], en
      [3:38, onderdeel h, van de Wajong][ref18] en [14, tweede lid, onderdeel d, van de IOW][ref19] zoals dat luidde op
      30 juni 2012;

      c. het nakomen van de plichten die zijn opgenomen in het plan van aanpak, de re-integratievisie
      of het re-integratieplan, bedoeld in de [artikelen 26, eerste lid, onderdeel l, van de WW][ref20],
      [45, eerste lid, onderdeel p, van de ZW][ref21], [28, onderdeel j, van de WAO][ref22],
      [29, tweede lid, onderdeel e, van de Wet WIA][ref23], [46, onderdeel i, van de WAZ][ref24],
      [2:31, tweede lid, onderdeel c][ref25], en [3:38, onderdeel i, van de Wajong][ref26] en
      [14, tweede lid, onderdeel e, van de IOW][ref27] zoals dat luidde op 30 juni 2012;

      d. het binnen redelijke termijn geneeskundige hulp inroepen en het zich gedurende het gehele verloop van ziekte
      of arbeidsongeschiktheid onder behandeling blijven stellen of de voorschriften van de behandelend arts op volgen,
      bedoeld in de [artikelen 45, eerste lid, onderdeel a, van de ZW][ref28], [28, onderdeel b, van de WAO][ref29],
      [46, onderdeel b, van de WAZ][ref30], [2:8, tweede lid, onderdeel b][ref31], [2:31, tweede lid, onderdeel a][ref32],
      en [3:38, onderdeel b, van de Wajong][ref33] en [14, tweede lid, onderdeel a, van de IOW][ref34];

      e. het zich niet schuldig maken aan gedragingen waardoor de genezing wordt belemmerd of het meewerken om aanpassing
      aan zijn ziekte of gebrek te verkrijgen, bedoeld in de [artikelen 45, eerste lid, onderdeel b, van de ZW][ref35],
      [artikel 28, onderdeel c, van de WAO][ref36], [46, onderdeel c, van de WAZ][ref37] en
      [2:31, tweede lid, onderdeel a, en 3:38, onderdeel c, van de Wajong][ref38]; of

      f. het opvolgen van door het UWV of de door hem daartoe aangewezen deskundige gegeven voorschriften in het belang
      van de behandeling of genezing of tot behoud, herstel of bevordering van de mogelijkheid tot het verrichten van
      arbeid, bedoeld in de [artikelen 28, onderdeel a, van de WAO][ref39], [46, onderdeel a, van de WAZ][ref40] en
      [2:31, tweede lid, onderdeel a][ref41], en [3:38, onderdeel a, van de Wajong][ref42].


