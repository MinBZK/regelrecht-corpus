  - number: '7'
    text: |-
      De verplichtingen op grond van de in [artikel 1, onderdelen b tot en met h][ref1], genoemde wetten, worden
      ingedeeld in de vierde categorie voor zover zij betrekking hebben op:

      a. het zich zodanig gedragen dat de belanghebbende door zijn doen en laten het Algemeen Werkloosheidsfonds,
      het Uitvoeringsfonds voor de overheid, de Werkhervattingskas, de eigenrisicodrager of het Toeslagenfonds
      niet benadeelt of zou kunnen benadelen, bedoeld in de [artikelen 24, vijfde lid, van de WW][ref2],
      [45, eerste lid, onderdeel j, van de ZW][ref3] en [13, eerste lid, van de IOW][ref4];

      b. het nalaten de arbeidsongeschiktheid opzettelijk te veroorzaken, bedoeld in de
      [artikelen 45, eerste lid, onderdeel g, van de ZW][ref5], [28, onderdeel e, van de WAO][ref6],
      [28, eerste lid][ref7], juncto [88, tweede lid, van de Wet WIA][ref8], [46, onderdeel e, van de WAZ][ref9],
      [3:38, onderdeel e, van de Wajong][ref10];

      c. het zich onthouden van verwijtbaar gedrag dat aangemerkt kan worden als een dringende reden in
      de zin van [artikel 678 van boek 7 van het Burgerlijk Wetboek][ref11] of het op zijn verzoek laten
      beëindigen van de dienstbetrekking zonder dat aan de voortzetting ervan zodanige bezwaren waren
      verbonden, dat deze voortzetting redelijkerwijs niet kon worden gevergd, door een verzekerde die
      recht heeft op de loongerelateerde uitkering van de WGA-uitkering en die arbeid in dienstbetrekking
      verricht, bedoeld in [artikel 30, derde lid, van de Wet WIA][ref12] , of door een jonggehandicapte
      die recht heeft op arbeidsondersteuning en arbeid in dienstbetrekking verricht, bedoeld in
      [artikel 2:32, tweede lid, onderdelen a en b, van de Wajong][ref13]; of

      d. het, tijdens het tijdvak, bedoeld in [artikel 25, negende lid, van de Wet WIA][ref14], zonder deugdelijke
      grond nalaten verweer te voeren tegen of instemmen met een beëindiging van de dienstbetrekking, bedoeld in
      [artikel 88, eerste lid, onderdeel d, van de Wet WIA][ref15].


