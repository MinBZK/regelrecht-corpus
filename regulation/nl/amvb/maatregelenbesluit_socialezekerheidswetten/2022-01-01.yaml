    text: |-
      De verplichtingen op grond van de in [artikel 1, onderdelen b tot en met g en i tot en met m][ref1], genoemde
      wetten, worden ingedeeld in de vijfde categorie voor zover zij betrekking hebben op het zich onthouden
      van zeer ernstige misdragingen als bedoeld in de [artikelen 26, eerste lid, onderdeel a, van de WW][ref2],
      [45, eerste lid, onderdeel r, van de ZW][ref3], [28, onderdeel l, van de WAO][ref4],
      [27, tweede lid, onderdeel f, van de Wet WIA][ref5], [46, eerste lid, onderdeel k, van de WAZ][ref6],
