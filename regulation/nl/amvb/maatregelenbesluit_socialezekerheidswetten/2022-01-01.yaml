    text: |-
      De verplichtingen op grond van de in [artikel 1, onderdelen b tot en met h, j, k, l en m][ref1], genoemde wetten,
      worden ingedeeld in de tweede categorie voor zover zij betrekking hebben op:

      a. het meewerken aan een onderzoek, al dan niet van geneeskundige aard, bedoeld in de
      [artikelen 26, eerste lid, onderdeel g, van de WW][ref2], [45, eerste lid, onderdeel c, van de ZW][ref3],
      [25, eerste lid, onderdeel b, van de WAO][ref4], [27, tweede lid, onderdeel c, van de Wet WIA][ref5],
      [45, eerste lid, onderdeel b, van de WAZ][ref6], [2:7, tweede lid, onderdeel c, en vierde lid][ref7],
      en [3:37, eerste lid, onderdeel b, van de Wajong][ref8], [15, eerste en tweede lid, van de AOW][ref9],
      [36, eerste en tweede lid, van de Anw][ref10], [16, eerste en tweede lid, van de AKW][ref11] en
      [12, tweede lid, onderdeel c, van de IOW][ref12];

      b. het voldoen aan een voorschrift, gegeven door het UWV of de door hem daartoe aangewezen deskundige,
      om zich ter observatie te doen opnemen of te verblijven in een aangewezen inrichting, bedoeld in de
      [artikelen 25, eerste lid, onderdeel c, van de WAO][ref13], [27, vijfde lid, van de Wet WIA][ref14],
      [45, eerste lid, onderdeel c, van de WAZ][ref15], en [2:7, zesde lid][ref16], en
      [3:37, eerste lid, onderdeel c, van de Wajong][ref17];

      c. het voldoen aan elke oproep om aanwezig te zijn of het beantwoorden van vragen die
      door de SVB of het UWV in verband met het recht op uitkering worden gesteld, bedoeld in
      de [artikelen 45, eerste lid, onderdeel c, van de ZW][ref18], [25 van de WAO][ref19],
      [27, tweede lid, onderdelen a en b, van de Wet WIA][ref20], [45 van de WAZ][ref21],
      [2:7, tweede lid, onderdelen a en b, vierde lid][ref22], en [3:37 van de Wajong][ref23],
      [15, eerste en tweede lid, van de AOW][ref24], [36, eerste en tweede lid, van de Anw][ref25],
      [16, eerste en tweede lid, van de AKW][ref26] en [12, tweede lid, onderdelen a en b, van de IOW][ref27];

      d. het, bij deelname aan een re-integratietraject, onmiddellijk mededelen van de reden van
      het niet naleven van re-integratieverplichtingen aan het re-integratiebedrijf, bedoeld in de
      [artikelen 26, eerste lid, onderdeel m, van de WW][ref28], [28, onderdeel k, van de WAO][ref29],
      [27, vierde lid, van de Wet WIA][ref30], [46, onderdeel j, van de WAZ][ref31], [2:7, vijfde lid][ref32], en
      [3:38, onderdeel j, van de Wajong][ref33] en [12, vierde lid, van de IOW][ref34];

      e. registratie als werkzoekende en het tijdig verlengen van die registratie, bedoeld in de
      [artikelen 26, eerste lid, onderdeel d, van de WW][ref35], [30, derde lid, van de ZW][ref36],
      [28, onderdeel a, van de WAO][ref37], [30, tweede lid, van de Wet WIA][ref38],
      [46, onderdeel a, van de WAZ][ref39], [2:32, eerste lid][ref40], en [3:38, onderdeel a, van de Wajong][ref41] en
      [15, onderdeel a, van de IOW][ref42]; of

      f. het vergezeld laten gaan van de aanvraag van de uitkering van een re-integratieverslag, bedoeld in
      [artikel 34a, eerste lid, eerste zin, van de WAO][ref43] en [artikel 65, eerste zin, van de Wet WIA][ref44]
      dan wel het voldoen aan het verzoek tot verstrekken van het re-integratieverslag aan het UWV, bedoeld in
      [artikel 38, tweede lid, derde volzin van de ZW][ref45].


