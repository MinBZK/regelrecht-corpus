    text: |-
      Voor de toepassing van het eerste lid wordt het bedrag aan kinderbijslag in aanmerking genomen waarop op grond
      van [artikel 12 van de AKW][ref1] recht bestaat ten behoeve van het kind of de kinderen ten aanzien van wie de
      overtreding is begaan en wordt de periode van een maand vervangen door een periode van een kwartaal.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel12
    url: https://wetten.overheid.nl/BWBR0022445/2026-01-01#Artikel2
