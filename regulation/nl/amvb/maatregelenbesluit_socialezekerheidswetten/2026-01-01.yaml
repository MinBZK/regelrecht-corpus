    text: |-
      de gehele uitkering voor de duur dat de verzekerde de aanspraak op loon zou hebben kunnen doen gelden, dan wel de
      dienstbetrekking zou hebben kunnen voortduren; of
    url: https://wetten.overheid.nl/BWBR0022445/2026-01-01#Artikel2
  - number: 2.5.b
    text: |-
      dat deel van de uitkering dat niet tot uitbetaling zou komen, indien de benadelingshandeling niet had
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0022445/2026-01-01#Artikel2
  - number: '2.6'
    text: |-
      Voor de toepassing van het eerste lid, onderdeel d, wordt bij overtreding van de verplichting, bedoeld in
      [artikel 45, eerste lid, onderdeel j, van de ZW][ref1], onder «blijvend» verstaan: voor de duur dat de verzekerde
      aanspraak op loon zou kunnen doen gelden.


