    text: |-
      5 procent van het uitkeringsbedrag, met een mogelijkheid van afwijking tot ten minste 2 procent of ten hoogste
      20 procent van het uitkeringsbedrag, gedurende ten minste een maand bij verplichtingen uit de eerste categorie,
      bedoeld in [artikel 3][ref1];


