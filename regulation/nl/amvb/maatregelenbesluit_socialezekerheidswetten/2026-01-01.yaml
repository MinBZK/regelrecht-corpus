      [artikel 2:32, tweede lid, van de Wajong][ref2] niet is nagekomen legt het UWV, voor de toepassing van het eerste
      lid, onderdelen c en d, de maatregel op over dat deel van het uitkeringsbedrag dat niet zou zijn uitbetaald indien
      die verplichting wel zou zijn nagekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Artikel2
