  - number: '8.1'
    text: |-
      Indien aan de belanghebbende een maatregel is opgelegd en binnen twee jaar na de bekendmaking daarvan opnieuw
      dezelfde verplichting niet of niet behoorlijk wordt nagekomen worden het percentage van de op te leggen maatregel
      alsmede het minimumbedrag, genoemd in [artikel 2, eerste lid][ref1], met 50% verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0022445#Artikel2
    url: https://wetten.overheid.nl/BWBR0022445/2026-01-01#Artikel8
    references:
