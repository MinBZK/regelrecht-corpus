      het ouderdomspensioen en de toeslag, bedoeld in de [artikelen 7][ref3] en [8 van de AOW][ref4], de kinderbijslag,
      bedoeld in [artikel 7 van de AKW][ref5], en de remigratievoorzieningen, bedoeld in de [RW][ref6].


