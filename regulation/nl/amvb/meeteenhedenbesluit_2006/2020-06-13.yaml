preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Economische Zaken van 5 september 2006, nr. WJZ 6066164;

    Gelet op richtlijn 80/181/EEG van de Raad van 20 december 1979 (PbEG L 39) inzake de onderlinge aanpassing van
    de wetgevingen der Lid-Staten op het gebied van de meeteenheden, en tot intrekking van Richtlijn 71/354/EEG, op
    richtlijn 76/766/EEG van de Raad van 27 juli 1976 betreffende de onderlinge aanpassing van de wetgevingen van de
    Lid-Staten inzake alcoholtabellen (PbEG L 262), op richtlijn 71/347/EEG van de Raad van 12 oktober 1971 betreffende
    de onderlinge aanpassing van de wetgevingen der Lid-Staten inzake de meting van het natuurgewicht van granen (PbEG
    L 239) en artikel 2 van de Metrologiewet;

    De Raad van State gehoord (advies van 14 september 2006, no. W10.06.0379/II);

    Gezien het nader rapport van Onze Minister van Economische Zaken van 9 oktober 2006, nr. WJZ 6074955;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0020422/2020-06-13#ArtikelAanhef
