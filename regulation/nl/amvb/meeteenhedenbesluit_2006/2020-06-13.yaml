  - number: '3.2'
    text: 'Verstaan wordt onder:'
    url: https://wetten.overheid.nl/BWBR0020422/2020-06-13#Artikel3
  - number: 3.2.a
    text: |-
      de seconde: de eenheid die volgt uit de vaste numerieke waarde van de cesiumfrequentie , de frequentie van de
      onverstoorde hyperfijnovergang van het cesium-133-atoom in grondtoestand, die is vastgesteld op 9 192 631 770,
      uitgedrukt in de eenheid Hz, die gelijk is aan s-1;
    url: https://wetten.overheid.nl/BWBR0020422/2020-06-13#Artikel3
  - number: 3.2.b
    text: |-
      de meter: de eenheid die volgt uit de vaste numerieke waarde van de snelheid van het licht in vacuüm *c*, die is
      vastgesteld op 299 792 458, uitgedrukt in m•s-1, waarbij de seconde volgt uit ;
    url: https://wetten.overheid.nl/BWBR0020422/2020-06-13#Artikel3
  - number: 3.2.c
    text: |-
      de kilogram: de eenheid die volgt uit de vaste numerieke waarde van de constante van Planck *h*, die is vastgesteld
      op 6,626 070 15 × 10-34, uitgedrukt in de eenheid J•s, waarbij J•s gelijk is aan kg•m2•s-1 en de meter en de
      seconde volgen uit *c* en ;
    url: https://wetten.overheid.nl/BWBR0020422/2020-06-13#Artikel3
  - number: 3.2.d
    text: |-
      de ampère: de eenheid die volgt uit de vaste numerieke waarde van de elementaire lading *e*, die is vastgesteld op
      1,602 176 634 × 10-19, uitgedrukt in de eenheid C, waarbij C gelijk is aan A•s en de seconde volgt uit ;
    url: https://wetten.overheid.nl/BWBR0020422/2020-06-13#Artikel3
  - number: 3.2.e
    text: |-
      de kelvin: de eenheid die volgt uit de vaste numerieke waarde van de constante van Boltzmann *k*, die is
      vastgesteld op 1,380 649 × 10-23, uitgedrukt in de eenheid J•K-1, waarbij J•K-1 gelijk is aan kg•m2•s-2•K-1 en de
      kilogram, de meter en de seconde volgen uit *h*, *c* en ;
    url: https://wetten.overheid.nl/BWBR0020422/2020-06-13#Artikel3
  - number: 3.2.f
    text: |-
      de mol: de hoeveelheid stof van een systeem dat exact 6,022 140 76 × 1023 elementaire entiteiten bevat, welk getal,
      uitgedrukt in de eenheid mol-1, de vaste numerieke waarde van de constante van Avogadro *N* is en het getal van
      Avogrado wordt genoemd;
    url: https://wetten.overheid.nl/BWBR0020422/2020-06-13#Artikel3
  - number: 3.2.g
    text: |-
      de candela: de eenheid die volgt uit de vaste numerieke waarde van het lichtrendement van monochromatische straling
      met een frequentie van 540 × 1012 Hz, *K*, die is vastgesteld op 683, uitgedrukt in de eenheid lm•W-1, waarbij
      lm•W-1 gelijk is aan cd•sr•W-1 of cd•sr•kg-1•m-2•s3 en de kilogram, de meter en de seconde volgen uit *h*, *c* en
      en sr (steradiaal) de SI-eenheid voor ruimtehoek is.
    url: https://wetten.overheid.nl/BWBR0020422/2020-06-13#Artikel3
  - number: '3.3'
    text: |-
      De in het tweede lid, onder f, bedoelde hoeveelheid stof, symbool *n,*van een systeem is een maat voor het
      aantal gespecificeerde elementaire entiteiten. Een elementaire entiteit kan een atoom, een molecuul, een ion, een
      elektron, elk ander deeltje of elke andere gespecificeerde groep van deeltjes zijn.
    url: https://wetten.overheid.nl/BWBR0020422/2020-06-13#Artikel3
