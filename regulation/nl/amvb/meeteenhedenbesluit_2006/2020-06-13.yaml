      van voorvoegsels aan het woord «gram» en van hun symbolen aan het symbool g.
    url: https://wetten.overheid.nl/BWBR0020422/2020-06-13#Artikel12
  - number: '12.4'
    text: Het honderdvoud van de are wordt aangeduid met de naam hectare.
    url: https://wetten.overheid.nl/BWBR0020422/2020-06-13#Artikel12
  - number: '13'
    text: 'Er worden nationale meetstandaarden beheerd of verwezenlijkt van de volgende grootheden:'
    url: https://wetten.overheid.nl/BWBR0020422/2020-06-13#Artikel13
  - number: 13.a
    text: lengte;
    url: https://wetten.overheid.nl/BWBR0020422/2020-06-13#Artikel13
  - number: 13.b
    text: massa;
    url: https://wetten.overheid.nl/BWBR0020422/2020-06-13#Artikel13
  - number: 13.c
    text: tijd;
    url: https://wetten.overheid.nl/BWBR0020422/2020-06-13#Artikel13
  - number: 13.d
    text: elektrische spanning;
    url: https://wetten.overheid.nl/BWBR0020422/2020-06-13#Artikel13
  - number: 13.e
    text: elektrische weerstand;
    url: https://wetten.overheid.nl/BWBR0020422/2020-06-13#Artikel13
  - number: 13.f
    text: thermodynamische temperatuur;
    url: https://wetten.overheid.nl/BWBR0020422/2020-06-13#Artikel13
  - number: 13.g
    text: lichtsterkte.
    url: https://wetten.overheid.nl/BWBR0020422/2020-06-13#Artikel13
  - number: '14'
    text: |-
      De verwezenlijking van de nationale meetstandaard van lengte vindt plaats met een methode, gebaseerd op een
      golflengte van een gestabiliseerde lichtbron die vastgelegd is in aanbeveling 1 uit 2002, aanbeveling 1 uit 2003
      dan wel aanbeveling 3 uit 2005 van het Comité international des Poids et Mesures.
    url: https://wetten.overheid.nl/BWBR0020422/2020-06-13#Artikel14
  - number: '15'
    text: |-
      Als nationale meetstandaard van massa geldt de massa vastgesteld door het Bureau international des Poids et Mesures
      van het platina-iridium massastuk nr. 53.
    url: https://wetten.overheid.nl/BWBR0020422/2020-06-13#Artikel15
  - number: '16'
    text: |-
      De verwezenlijking van de nationale meetstandaard van tijd vindt plaats met een methode gebaseerd op de aanwijzing
      van drie cesiumatoomklokken.
    url: https://wetten.overheid.nl/BWBR0020422/2020-06-13#Artikel16
  - number: '17'
    text: |-
      De verwezenlijking van de nationale meetstandaard van elektrische spanning vindt plaats met een methode gebaseerd
      op het Josephson effect conform aanbeveling 1 uit 1988 van het Comité international des Poids et Mesures.
    url: https://wetten.overheid.nl/BWBR0020422/2020-06-13#Artikel17
  - number: '18'
    text: |-
      De verwezenlijking van de nationale meetstandaard van elektrische weerstand vindt plaats met een methode gebaseerd
      op het quantum Hall effect conform aanbeveling 2 uit 1988 van het Comité international des Poids et Mesures.
    url: https://wetten.overheid.nl/BWBR0020422/2020-06-13#Artikel18
  - number: '19'
    text: |-
      De verwezenlijking van de nationale meetstandaard van thermodynamische temperatuur vindt plaats met een methode
      gebaseerd op de Internationale Temperatuurschaal van 1990 (ITS-90) conform aanbeveling 5 uit 1989 van het Comité
      international des Poids et Mesures.
    url: https://wetten.overheid.nl/BWBR0020422/2020-06-13#Artikel19
  - number: '20'
    text: |-
      De verwezenlijking van de nationale meetstandaard voor lichtsterkte is gebaseerd op de meting van het
      stralingsvermogen met een Absolute Cryogene Radiometer.
    url: https://wetten.overheid.nl/BWBR0020422/2020-06-13#Artikel20
  - number: 20a
    text: |-
      Dit besluit, met uitzondering van [artikel 9][ref1] alsmede [paragraaf 3][ref2], is mede van toepassing in
      de openbare lichamen Bonaire, Sint Eustatius en Saba en berust voor de toepassing in die openbare lichamen op
      [artikel 2 van de IJkwet BES 2014][ref3].


