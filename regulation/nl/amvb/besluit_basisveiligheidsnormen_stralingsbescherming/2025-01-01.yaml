  - number: '10.9'
    text: |-
      1 In afwijking van [artikel 10.8][ref1] zendt een ondernemer een niet meer in gebruik zijnde
      hoogactieve bron, tenzij dit anders met de Autoriteit is overeengekomen, overeenkomstig
      [artikel 3.15, eerste lid, aanhef en onderdeel g][ref2], onmiddellijk na beëindiging van het gebruik naar:

      a. de fabrikant of leverancier van de bron die bevoegd is de bron te ontvangen, of een andere daartoe gemachtigde
      ondernemer, of

      b. een erkende ophaaldienst als bedoeld in [artikel 10.6, zesde lid][ref3], die gerechtigd is de bron te ontvangen.

      2 De ondernemer vergewist zich er vóór een overdracht van dat de ontvanger als bedoeld in het eerste lid, onder a
      of b, een toereikende vergunning heeft.

      3 De ondernemer doet bij beëindiging van het gebruik onmiddellijk een kennisgeving van beëindiging overeenkomstig
      [artikel 3.6, achtste lid][ref4].


