  - number: '7.28'
    text: >-
      1 Een ondernemer zorgt voor passende opleidings- en voorlichtingsprogramma’s voor werknemers, in voorkomend geval
      toegespitst op hoogactieve bronnen.


      2 De ondernemer zorgt ervoor dat de werknemers meewerken aan de voor hen georganiseerde informatiebijeenkomsten en
      trainingen en de instructies naleven die hen ingevolge dit besluit worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel7.28
  - number: '7.29'
    text: >-
      1 De ondernemer zorgt ervoor dat vrouwelijke werknemers die bij de arbeid kunnen worden blootgesteld aan
      ioniserende straling, voor aanvang van het verrichten van de handeling passend worden geïnformeerd over:


      a. de noodzaak om een zwangerschap in een vroeg stadium te melden met het oog op de risico’s van blootstelling aan
      ioniserende straling voor het ongeboren kind; en


      b. de risico’s die een kind dat borstvoeding krijgt, loopt door besmetting van het lichaam van de moeder.


      2 Wat betreft externe werknemers zorgt de werkgever dat de informatie, genoemd in het eerste lid, onder a en b, aan
      hen wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel7.29
  - number: '7.30'
    text: |-
      De bedrijfsleiding van een onderneming als bedoeld in [artikel 5.12, tweede lid][ref1], waarvan het aannemelijk is
      dat er weesbronnen worden aangetroffen of verwerkt, draagt er zoveel mogelijk zorg voor dat een werknemer die in
      die onderneming kan worden blootgesteld aan een weesbron, onverminderd artikel 5.12:

      a. passend geïnformeerd is over de elementaire eigenschappen van ioniserende straling en de effecten daarvan;

      b. passend geïnformeerd en getraind is met betrekking tot het visueel herkennen van weesbronnen en broncontainers;
      en

      c. passend geïnformeerd en getraind is met betrekking tot de maatregelen die ter plaatse getroffen moeten worden
      wanneer een weesbron of een vermoedelijke weesbron wordt aangetroffen.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel5.12
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel7.30
