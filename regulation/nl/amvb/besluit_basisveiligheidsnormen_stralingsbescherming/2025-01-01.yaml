  - number: '3.11'
    text: |-
      1 Een ondernemer is verplicht tot kennisgeving aan de Autoriteit van een handeling, maatregel of
      blootstellingsituatie behorend tot een categorie die is genoemd in [artikel 3.8][ref1], [3.10][ref2] of
      [3.13][ref3].

      2 Een aanvraag om een vergunning als bedoeld in [artikel 3.5][ref4] of een aanvraag om een registratie als bedoeld
      in [artikel 3.9][ref5] geldt als kennisgeving.

      3 Een ondernemer is voorts verplicht tot kennisgeving aan de Autoriteit van een bestaande blootstellingsituatie als
      bedoeld in [artikel 7.38, vierde lid][ref6].

      4 Een kennisgeving vindt plaats:

      a. in geval van een geplande blootstellingsituatie waarvoor geen vergunning of registratie wordt vereist: ten
      minste drie weken voorafgaand aan de desbetreffende handeling;

      b. in geval van een bestaande blootstellingsituatie: binnen drie maanden na het constateren ervan, dan wel
      overeenkomstig [artikel 12.11, tweede lid][ref7].

      5 Indien geen kennisgevingsplichtige handelingen meer worden verricht of indien een bestaande blootstellingsituatie
      is geëindigd, is de ondernemer verplicht tot kennisgeving van beëindiging aan de Autoriteit. De kennisgeving van
      beëindiging wordt zo spoedig mogelijk gedaan, doch uiterlijk binnen zes weken na het beëindigen van de handelingen
      of blootstellingsituatie.

      6 Het vijfde lid is niet van toepassing indien een verplichting tot kennisgeving van beëindiging als bedoeld in
      [artikel 3.6, achtste lid][ref8], of [3.9, tweede lid][ref9], van toepassing is.

      7 Het eerste tot en met zesde lid zijn niet van toepassing in geval van bij verordening van de Autoriteit
      aangewezen handelingen met natuurlijke bronnen waarvoor een registratieplicht geldt, indien van de desbetreffende
      handeling reeds is kennisgegeven door een andere ondernemer en aan bij die verordening gestelde regels wordt
      voldaan.


