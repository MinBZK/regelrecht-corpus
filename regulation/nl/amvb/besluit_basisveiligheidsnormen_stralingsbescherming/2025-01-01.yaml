        afdeling: '7.2'
  - number: '7.38'
    text: |-
      1 Het referentieniveau voor het jaargemiddelde van radonconcentratie in de lucht op werkplekken bedraagt
      100 becquerel/m3.

      2 De werkgever zorgt ervoor dat metingen voor het bepalen van de radonconcentratie worden uitgevoerd:

      a. op werkplekken die zich bevinden op de benedenverdieping of in de kelder in gebieden genoemd in het nationaal
      actieprogramma radon, bedoeld in [artikel 6.20][ref1]; en

      b. op specifieke soorten werkplekken als bedoeld in het nationaal actieprogramma radon, bedoeld in
      [artikel 6.20][ref2].

      3 Indien de radonconcentratie op de werkplekken, bedoeld in het tweede lid, het referentieniveau, bedoeld in het
      eerste lid of in het achtste lid indien daaraan uitvoering is gegeven, overschrijdt, neemt de werkgever maatregelen
      om te zorgen dat de radonconcentratie wordt teruggebracht tot onder dit referentieniveau.

      4 Indien de radonconcentratie op werkplekken ondanks de maatregelen, bedoeld in het derde lid, het
      referentieniveau, bedoeld in het eerste lid of in het achtste lid indien daaraan uitvoering is gegeven, blijft
      overschrijden, is de werkgever verplicht tot kennisgeving hiervan aan de Autoriteit.

      5 Op de werkplekken, bedoeld in het tweede, derde en vierde lid, is dit hoofdstuk, met uitzondering van dit
      artikel, niet van toepassing, met dien verstande dat voor de werkplekken, bedoeld in het vierde lid, bij regeling
      van Onze Minister van Sociale Zaken en Werkgelegenheid een of meer artikelen van dit hoofdstuk van toepassing
      kunnen worden verklaard.

      6 De werkgever zorgt ervoor dat voor de werkplekken waarbij het referentieniveau genoemd in het eerste lid,
      blijvend wordt overschreden:

      a. de blootstelling van de werknemers aan radon wordt vastgesteld en met passende frequentie wordt gemonitord en de
      gegevens geregistreerd;

      b. maatregelen worden genomen om de blootstelling van de werknemers aan radon tot een minimum te beperken; en

      c. op daarvoor geschikte plaatsen doelmatige en duidelijke waarschuwingsborden of waarschuwingstekens en
      opschriften worden aangebracht.

      7 De werkgever bewaart de geregistreerde gegevens in ieder geval totdat de persoon op wie de gegevens betrekking
      hebben, de leeftijd van vijfenzeventig jaar heeft bereikt of zou hebben bereikt, maar ten minste dertig jaar nadat
      deze persoon de handelingen heeft beëindigd.

      8 Bij regeling van Onze Minister van Sociale Zaken en Werkgelegenheid kan in afwijking van het eerste lid voor bij
      die regeling aangewezen werkplekken als bedoeld in het vierde lid, een referentieniveau worden vastgesteld van ten
      hoogste 300 becquerel/m3 als jaargemiddelde van de radonconcentratie in de lucht, en kunnen nadere regels worden
      gesteld met betrekking tot het tweede, derde, vierde en zesde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel6.20
      [ref2]: https://wetten.overheid.nl/BWBR0040179#Artikel6.20
