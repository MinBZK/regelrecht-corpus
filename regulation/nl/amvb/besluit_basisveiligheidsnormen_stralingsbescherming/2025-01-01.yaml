  - number: '7.7'
    text: |-
      1 De ondernemer zorgt ervoor dat, indien dat nodig is met het oog op de bescherming tegen ioniserende straling:

      a. een ruimte wordt aangemerkt als gecontroleerde zone, indien:

      1°. de mogelijke door een werknemer in de ruimte te ontvangen effectieve dosis groter is dan 6 millisievert in
      een kalenderjaar;

      2°. de mogelijke door een werknemer in de ruimte te ontvangen equivalente dosis voor de ooglensdosis groter is dan
      15 millisievert in een kalenderjaar;

      3°. de mogelijke door een werknemer in de ruimte te ontvangen equivalente dosis voor de huid, gemiddeld over enig
      blootgesteld huidoppervlak van 1 cm2, groter is dan 150 millisievert in een kalenderjaar;

      4°. de mogelijke door een werknemer in de ruimte te ontvangen equivalente dosis voor de extremiteiten groter is dan
      150 millisievert in een kalenderjaar; of

      5°. er een mogelijkheid is van verspreiding van radioactieve stoffen vanuit de ruimte zodanig dat personen een
      dosis hoger dan de effectieve of equivalente dosis, genoemd in [artikel 7.3, eerste lid][ref1], kunnen ontvangen;

      b. een ruimte wordt aangemerkt als bewaakte zone, indien:

      1°. de mogelijke door een werknemer in de ruimte te ontvangen effectieve dosis groter is dan 1 millisievert in een
      kalenderjaar en kleiner of gelijk is aan 6 millisievert in een kalenderjaar;

      2°. de mogelijke door een werknemer in de ruimte te ontvangen equivalente dosis voor de huid, gemiddeld over enig
      blootgesteld huidoppervlak van 1 cm2, groter is dan 50 millisievert in een kalenderjaar en kleiner of gelijk is aan
      150 millisievert in een kalenderjaar; of

      3°. de mogelijke door een werknemer in de ruimte te ontvangen equivalente dosis voor de extremiteiten groter is dan
      50 millisievert in een kalenderjaar en kleiner of gelijk is aan 150 millisievert in een kalenderjaar.

      2 De ondernemer zorgt ervoor dat in een gecontroleerde en een bewaakte zone passend toezicht wordt gehouden op de
      arbeidsomstandigheden met het oog op de bescherming tegen ioniserende straling.

      3 De ondernemer zorgt ervoor dat de omvang en kwaliteit van de maatregelen ten behoeve van de bescherming tegen
      ioniserende straling zijn afgestemd op de risico’s die aan de bronnen en de betrokken handeling verbonden zijn.

      4 Bij regeling van Onze Minister van Sociale Zaken en Werkgelegenheid kunnen nadere regels worden gesteld met
      betrekking tot het eerste, tweede en derde lid.

      5 Indien blijkt dat een ruimte niet langer voldoet aan de kenmerken, bedoeld in het eerste lid, onder a of b, om
      als gecontroleerde zone dan wel bewaakte zone te worden aangemerkt, zorgt de ondernemer ervoor dat de betrokken
      ruimte niet langer wordt aangemerkt als gecontroleerde zone dan wel bewaakte zone.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel7.3
