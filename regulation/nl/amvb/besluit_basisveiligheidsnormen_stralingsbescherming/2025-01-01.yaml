  - number: '4.13'
    text: |-
      1 De ondernemer zorgt ervoor dat door middel van passende tests, zoals lektests, op basis van internationale
      normen, de integriteit van hoogactieve bronnen door of onder toezicht van een stralingsbeschermingsdeskundige of
      een toezichthoudend medewerker stralingsbescherming in elk geval op de volgende momenten wordt gecontroleerd:

      a. ten minste eenmaal per jaar, en

      b. na elke gebeurtenis waarbij de bron of bronhouder beschadigd is of kan zijn.

      2 De ondernemer zorgt er ten aanzien van een hoogactieve bron en haar toebehoren voor dat, door of onder toezicht
      van een stralingsbeschermingsdeskundige of een toezichthoudend medewerker stralingsbescherming:

      a. wordt gecontroleerd of de bron en in voorkomend geval de uitrusting die de bron bevat, feitelijk aanwezig is op
      de plaats waar deze wordt toegepast of is opgeslagen:

      1°. elke drie maanden, indien de bron minder dan eens per drie maanden wordt toegepast;

      2°. eenmaal per jaar, indien de bron een keer of meer dan een keer per drie maanden wordt toegepast;

      b. eenmaal per jaar wordt gecontroleerd of de bron en de bronhouder nog in goede staat zijn.

      3 De ondernemer:

      a. zorgt ervoor dat ten aanzien van elke vast opgestelde of mobiele hoogactieve bron schriftelijke instructies
      worden vastgesteld ter voorkoming van ongeoorloofde toegang tot de bron, verlies of diefstal van de bron of
      beschadiging van de bron door brand;

      b. stelt de Autoriteit overeenkomstig [artikel 6.3][ref1] onmiddellijk in kennis van verlies, diefstal, lekkage of
      ongeoorloofd gebruik van een bron, en

      c. laat na elke gebeurtenis, inclusief brand, waarbij de bron beschadigd kan zijn, de integriteit van elke bron
      controleren en informeert de Autoriteit indien een van de genoemde omstandigheden zich heeft voorgedaan en over de
      genomen maatregelen.

      4 Bij verordening van de Autoriteit kunnen met het oog op een goede uitvoering nadere regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel6.3
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel4.13
