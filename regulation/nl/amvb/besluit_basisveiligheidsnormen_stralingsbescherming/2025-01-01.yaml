  - number: '12.7'
    text: |-
      1 Met ingang van het tijdstip van inwerkingtreding van dit besluit geldt een indeling als bedoeld in
      [artikel 79, eerste lid, van het Besluit stralingsbescherming][ref1] als een indeling als bedoeld in
      [artikel 7.11][ref2].

      2 Met ingang van het tijdstip van inwerkingtreding van dit besluit geldt een ontheffing als bedoeld in
      [artikel 81 van het Besluit stralingsbescherming][ref3] als een ontheffing als bedoeld in [artikel 7.31][ref4].

      3 Met ingang van het tijdstip van inwerkingtreding van dit besluit geldt het aanmerken als gecontroleerde of
      bewaakte zone als bedoeld in [artikel 83, eerste lid, van het Besluit stralingsbescherming][ref5] als het aanmerken
      van een dergelijke zone als bedoeld in [artikel 7.7][ref6].

      4 Met ingang van het tijdstip van inwerkingtreding van dit besluit geldt een ontheffing als bedoeld in
      [artikel 88 van het Besluit stralingsbescherming][ref7] als een ontheffing als bedoeld in [artikel 7.13][ref8].

      5 Met ingang van het tijdstip van inwerkingtreding van dit besluit:

      a. geldt een dosisregistratiesysteem als bedoeld in
      [artikel 91, eerste lid, van het Besluit stralingsbescherming][ref9] als een registratiesysteem als bedoeld in
      [artikel 7.17, eerste lid][ref10];

      b. geldt een aanwijzing van een instelling als bedoeld in
      [artikel 91, tweede lid, van het Besluit stralingsbescherming][ref11] als een aanwijzing als bedoeld in
      [artikel 7.17, tweede lid][ref12].


