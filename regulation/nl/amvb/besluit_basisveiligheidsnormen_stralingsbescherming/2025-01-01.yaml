  - number: '7.10'
    text: |-
      1 Ten behoeve van het toezicht, bedoeld in de [artikelen 7.8][ref1] en [7.9][ref2], zorgt de ondernemer ervoor dat
      op passende wijze, meting of monitoring plaatsvindt binnen de gecontroleerde en de bewaakte zone van:

      a. de relevante dosistempi, met opgave van de aard en kwaliteit van de desbetreffende ioniserende straling; en

      b. bij de aanwezigheid van een open bron, de activiteitsconcentratie in de lucht en de oppervlaktebesmetting met
      opgave van de aard en fysische en chemische toestand en vorm ervan.

      2 De resultaten van een meting als bedoeld in het eerste lid, worden geregistreerd door de ondernemer en kunnen
      waar nodig gebruikt worden voor het schatten van de individuele doses, bedoeld in [artikel 7.13, tweede lid][ref3].


