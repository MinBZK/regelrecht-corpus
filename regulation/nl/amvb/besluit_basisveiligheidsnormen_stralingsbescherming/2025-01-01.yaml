  - number: '9.8'
    text: >-
      1 Bij regeling van Onze Minister worden:


      a. een of meer referentieniveaus vastgesteld voor blootstelling van leden van de bevolking in een radiologische
      noodsituatie, en


      b. een of meer referentieniveaus vastgesteld voor blootstelling van leden van de bevolking in de transitie van
      een radiologische noodsituatie naar een bestaande blootstellingsituatie, in het bijzonder bij de beëindiging van
      langetermijnbeschermingsmaatregelen zoals vestiging elders.


      2 Een referentieniveau voor blootstelling van leden van de bevolking in een radiologische noodsituatie is gelijk
      aan of hoger dan 20 millisievert en niet hoger dan 100 millisievert als acute effectieve dosis of effectieve dosis
      in een jaar, en onverminderd de bij de regeling, bedoeld in het eerste lid, vast te stellen referentieniveaus voor
      equivalente doses.


      3 Voor specifieke radiologische noodsituaties kunnen bij verordening of beschikking van de Autoriteit
      referentieniveaus lager dan de in het eerste lid genoemde maximumwaarden worden vastgesteld. In ieder geval kan een
      referentieniveau lager dan 20 millisievert worden vastgesteld voor radiologische noodsituaties waarbij een passende
      bescherming kan worden geboden zonder dat als gevolg van de maatregelen onevenredig hoge schade of excessief hoge
      kosten ontstaan.


      4 Bij de vaststelling van een waarde voor een referentieniveau als bedoeld in het eerste lid wordt zowel rekening
      gehouden met de kenmerken van de radiologische noodsituatie als met maatschappelijke omstandigheden.


      5 Onze Minister zorgt voor informatievoorziening aan de bevolking in een radiologische noodsituatie:


      a. in geval van blootstelling van lager dan of gelijk aan 1 millisievert in een jaar: algemene
      informatievoorziening over het blootstellingsniveau, zonder specifiek rekening te houden met individuele
      blootstelling;


      b. in geval van blootstelling hoger dan 1 millisievert maar lager dan of gelijk aan 20 millisievert in een jaar:
      specifieke informatievoorziening om individuele personen in staat te stellen om zo mogelijk de eigen blootstelling
      te beheren;


      c. in geval van blootstelling hoger dan 20 millisievert maar lager dan of gelijk aan 100 millisievert in een
      jaar: een raming van individuele doses en specifieke informatievoorziening over stralingsrisico’s en beschikbare
      maatregelen om blootstelling te beperken.
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel9.8
  - number: '9.9'
    text: |-
      In geval van interventie in een radiologische noodsituatie is [artikel 7.37][ref1] van overeenkomstige toepassing
      op hulpverleners, niet zijnde werknemers die als hulpverlener optreden als bedoeld in dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel7.37
