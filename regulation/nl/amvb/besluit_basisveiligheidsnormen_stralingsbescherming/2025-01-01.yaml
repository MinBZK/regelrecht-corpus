  - number: '4.2'
    text: |-
      1 Een ondernemer houdt van alle bronnen waarvoor hij verantwoordelijk is dossiers bij waarin ten minste worden
      bijgehouden gegevens met betrekking tot:

      a. het type, aard en plaats van de bron;

      b. de wijze van toepassing ervan, en

      c. de wijze van overdracht van de bron of het zich ontdoen ervan na beëindiging van het gebruik.

      2 De ondernemer die handelingen met de bron verricht, houdt een administratie bij van die handelingen.

      3 De administratie en dossiers als bedoeld in het eerste en tweede lid worden ondergebracht in een beheersysteem.

      4 De administratie bevat ten minste:

      a. de naam van de rechtspersoon en van de verantwoordelijke stralingsbeschermingsdeskundige en toezichthoudend
      medewerker stralingsbescherming;

      b. de plaats waar de handelingen worden verricht;

      c. een omschrijving van de aard en de omvang van de handelingen; en

      d. de beoordeling van de risico’s, bedoeld in [artikel 7.1][ref1].

      5 Bij verordening van de Autoriteit kunnen nadere regels worden gesteld over de uitvoering van het eerste tot en
      met vierde lid, waaronder de bewaartermijnen van de administratie en de dossiers.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel7.1
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel4.2
    references:
