  - number: '4.11'
    text: |-
      1 De leverancier graveert in, of stempelt op, de bronhouder van elke door hem te leveren hoogactieve bron een code
      die als volgt is samengesteld:

      a. de aanduiding: NL,

      b. gevolgd door een aan de leverancier door de Autoriteit toegekende vaste code,

      c. gevolgd door een door de leverancier te bepalen voor de bron onderscheidende code in Romeinse letters of
      Arabische cijfers.

      2 Het eerste lid is niet van toepassing, indien:

      a. op de bronhouder van een hoogactieve bron reeds de in [artikel 4.10, eerste lid][ref1], bedoelde code, of een
      andere unieke code in Romeinse letters of Arabische cijfers is aangebracht;

      b. de afmeting van de bronhouder voor de in het eerste lid bedoelde handeling te klein is, of deze houder bedoeld
      is voor hergebruik als behuizing van een bron.

      3 In het in het tweede lid, onder b, bedoelde geval is [artikel 4.10, vijfde lid, tweede volzin][ref2], van
      overeenkomstige toepassing.

      4 [Artikel 4.10, tweede, zesde en zevende lid][ref3], is van overeenkomstige toepassing, met dien verstande dat
      voor «fabrikant» steeds wordt gelezen: leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel4.10
      [ref2]: https://wetten.overheid.nl/BWBR0040179#Artikel4.10
