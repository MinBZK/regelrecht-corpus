  - number: '3.20'
    text: |-
      1 [Afdeling 3.2][ref1] is niet van toepassing op handelingen met radioactieve materialen bestemd voor verwijdering,
      recycling, hergebruik of verbranding:

      a. waarvan de activiteitsconcentratie van de radionucliden in de betrokken radioactieve stof niet hoger is dan:

      1°. de desbetreffende in [bijlage 3, onderdeel B, tabel A, deel 1][ref2] opgenomen vrijgavewaarde voor kunstmatige
      radionucliden, of

      2°. de desbetreffende in [bijlage 3, onderdeel B, tabel A, deel 2][ref3] opgenomen vrijgavewaarde voor van nature
      voorkomende radionucliden, of

      b. waarvan de activiteitsconcentratie van de radionucliden in de betrokken radioactieve stof niet hoger is dan de
      desbetreffende krachtens het vierde lid of [artikel 3.21][ref4] vastgestelde vrijgavewaarde.

      2 [Artikel 3.17, tweede, zesde en negende lid][ref5], is van overeenkomstige toepassing.

      3 [Afdeling 3.2][ref6] is voorts niet van toepassing in de gevallen, bedoeld in de [artikelen 10.3][ref7],
      [10.4][ref8] en [10.6][ref9].

      4 Bij regeling van Onze Minister kunnen, indien het belang van de stralingsbescherming zich daar niet tegen verzet,
      voor andere radionucliden dan bedoeld in het eerste lid, onder a, onder 1° of 2°, vrijgavewaarden op basis van de
      activiteitsconcentratie worden vastgesteld en kunnen daarmee verbonden regels worden vastgesteld.

      5 Bij de toepassing van het vierde lid worden de algemene criteria, opgenomen in
      [bijlage 3, onderdeel A, onderdeel 3][ref10], en het bepaalde bij en krachtens [hoofdstuk 10][ref11] in acht
      genomen en worden bij de beoordeling van de wenselijkheid van de vrijgave de met het oog op stralingsbescherming
      relevante factoren in aanmerking genomen. De krachtens [artikel 3.17, achtste lid][ref12], gestelde regels zijn
      van toepassing.


