  - number: '7.12'
    text: |-
      1 De ondernemer zorgt ervoor dat aan de volgende blootgestelde werknemers een passend persoonlijk
      dosiscontrolemiddel ter beschikking wordt gesteld, dat wordt betrokken van een dosimetrische dienst als bedoeld
      in [artikel 7.15][ref1]:

      a. iedere A-werknemer; en

      b. iedere blootgestelde werknemer die bij de arbeid een blootstelling kan ondergaan die kan leiden tot een dosis
      hoger dan de dosislimiet, genoemd in [artikel 7.3, eerste lid, onder a][ref2].

      2 De ondernemer zorgt ervoor dat een passend persoonlijk dosiscontrolemiddel door de blootgestelde werknemer
      gedurende de tijden van mogelijke blootstelling op de juiste plaats wordt gedragen en dat het dosiscontrolemiddel
      periodiek wordt uitgelezen.

      3 De ondernemer zorgt ervoor dat de dosimetrische dienst periodiek, met behulp van de met een passend
      dosiscontrolemiddel verkregen gegevens, bepaalt in welke mate de werknemer aan ioniserende straling blootgesteld
      is geweest.

      4 De ondernemer zorgt ervoor dat voor gevallen waarin een blootgestelde werknemer onder voor de werksituatie
      normale condities een aanzienlijke inwendige besmetting kan ondergaan, een passend monitoringsysteem is.

      5 De ondernemer zorgt ervoor dat voor gevallen waarin een blootgestelde werknemer, die geen A-werknemer is, onder
      voor de werksituatie normale condities een blootstelling van de ooglens of extremiteiten kan ondergaan, er een
      passend monitoringsysteem is waarmee in ieder geval kan worden aangetoond dat de blootstelling niet hoger is dan de
      doses, genoemd in [artikel 7.11, tweede lid, onder 2°, 3° en 4°][ref3].

      6 Onze Minister van Sociale Zaken en Werkgelegenheid kan nadere regels stellen met betrekking tot dit artikel.


