  - number: '8.2'
    text: >-
      1 Een medische blootstelling vindt uitsluitend plaats indien zij gerechtvaardigd is.


      2 Een medische blootstelling is gerechtvaardigd indien zij per saldo voldoende voordeel oplevert wanneer het totale
      potentiële diagnostische of therapeutische voordeel, waaronder de gezondheidsvoordelen voor de persoon die de
      behandeling ondergaat en het maatschappelijk voordeel, opweegt tegen de gezondheidsschade die de persoon die de
      blootstelling ondergaat, kan ondervinden, rekening houdend met de doeltreffendheid, de voordelen en de risico’s
      van beschikbare alternatieve technieken die hetzelfde doel hebben maar geen of minder blootstelling aan ioniserende
      straling met zich meebrengen.
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel8.2
  - number: '8.3'
    text: >-
      1 Alle doses ten gevolge van medische blootstellingen voor radiodiagnostiek, interventieradiologie en planning,
      sturing en verificatiedoeleinden, worden zo laag gehouden als redelijkerwijs mogelijk is, gelet op de noodzaak om
      de vereiste medische gegevens te verkrijgen en rekening houdend met economische en sociale factoren.


      2 De optimalisatie, bedoeld in het eerste lid:


      a. omvat, met inachtneming van economische en sociale factoren, de keuze van de apparatuur, de consistente
      productie van adequate diagnostische gegevens of behandelingsresultaten, de praktische aspecten van medisch-
      radiologische procedures, de kwaliteitsborging, de beoordeling en evaluatie van patiëntdoses en de controle van
      toegediende activiteit;


      b. heeft betrekking op de omvang van de individuele doses en hangt samen met het medische doel van de
      blootstelling;


      c. wordt, indien dat passend is, tevens toegepast op orgaandoses.


      3 De medisch deskundige, de klinisch fysicus en de personen die bevoegd zijn om de praktische aspecten van de
      medisch-radiologische procedure uit te voeren, worden betrokken bij de optimalisatie, bedoeld in het eerste lid.


      4 Onze Minister van Volksgezondheid, Welzijn en Sport bevordert de vaststelling, de regelmatige herziening
      en het gebruik van diagnostische referentieniveaus voor radiodiagnostisch onderzoek, indien gepast voor
      interventieradiologische procedures, en de beschikbaarheid van richtlijnen op dit gebied.
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel8.3
  - number: '8.4'
    text: |-
      1 De ondernemer draagt ervoor zorg dat elke medische blootstelling plaatsvindt onder de verantwoordelijkheid van
      een medisch deskundige die voldoet aan [artikel 5.14][ref1].

      2 De ondernemer of de medisch deskundige kan de praktische aspecten van medisch-
      radiologische procedures delegeren, indien gepast en in overeenstemming met
      [artikel 38 van de Wet op de beroepen in de individuele gezondheidszorg][ref2], aan een of meer personen die
      bevoegd zijn om ter zake werkzaam te zijn op een erkend specialisatiegebied.

      3 Voorts draagt de ondernemer ervoor zorg dat de medisch deskundige of de persoon die in opdracht van die
      deskundige de blootstellingen, bedoeld in [artikel 8.16, eerste lid][ref3], verricht, hiervoor een passende
      opleiding heeft gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel5.14
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0040179#Artikel8.16
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel8.4
