  - number: '2.5'
    text: |-
      1 Bij een aanvraag om een vergunning als bedoeld in [artikel 3.5][ref1], een aanvraag om een registratie als
      bedoeld in [artikel 3.9][ref2] of bij een kennisgeving als bedoeld in [artikel 3.11][ref3], voor een handeling
      behorend tot een categorie of soort die krachtens [artikel 2.3][ref4] generiek is gerechtvaardigd, wordt in de
      aanvraag of kennisgeving verwezen naar de desbetreffende categorie of soort handelingen.

      2 Indien een aanvraag om een vergunning of registratie of een kennisgeving betrekking heeft op een handeling
      behorend tot een categorie of soort die niet eerder generiek is gerechtvaardigd of die generiek als niet-
      gerechtvaardigd is aangewezen, wordt bij die aanvraag of kennisgeving tevens een verzoek om rechtvaardiging gedaan.

      3 Een verzoek als bedoeld in het tweede lid wordt afgewezen indien:

      a. de handeling waarop de aanvraag of kennisgeving betrekking heeft na beoordeling niet kan worden gerechtvaardigd;

      b. de handeling behoort tot een soort of categorie die generiek kan worden gerechtvaardigd, maar waarbij de
      specifieke handeling of toepassing gelet op [artikel 2.2, vierde lid][ref5], niet kan worden gerechtvaardigd, of

      c. indien de voor de beoordeling van de rechtvaardiging noodzakelijke gegevens niet of niet tijdig door de
      ondernemer zijn overgelegd.

      4 Een verzoek bevat de voor de beoordeling van de rechtvaardiging noodzakelijke gegevens met betrekking tot:

      a. de individuele en maatschappelijke voordelen van de betrokken handeling, en

      b. de gezondheidsschade die deze kan veroorzaken.

      5 Bij verordening van de Autoriteit kunnen nadere regels worden gesteld met betrekking tot een verzoek als bedoeld
      in het tweede lid en de voor de beoordeling van de rechtvaardiging noodzakelijke gegevens, bedoeld in het vierde
      lid.


