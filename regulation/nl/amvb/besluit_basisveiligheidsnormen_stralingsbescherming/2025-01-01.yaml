  - number: '6.23'
    text: >-
      Onze Minister in overeenstemming met Onze Minister die het mede aangaat zorgt er in overleg met bewoners en andere
      belanghebbenden voor dat in besmette gebieden waarvoor bewoning en sociale en economische activiteiten weer worden
      toegestaan, voor zover nodig voorzieningen worden getroffen voor een zodanige en voortgaande beheersing van de
      blootstelling dat normale leefomstandigheden mogelijk worden, met inbegrip van:


      a. de vaststelling van passende referentieniveaus;


      b. de totstandkoming van voorzieningen ter ondersteuning van door leden van de bevolking zelf te nemen
      beschermingsmaatregelen in de getroffen gebieden, zoals informatieverstrekking, advies en monitoring;


      c. indien passend, remediëringsmaatregelen;


      d. indien passend, begrenzing van de vrij te geven getroffen gebieden.
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel6.23
  - number: '6.24'
    text: >-
      1 Onze Minister zorgt voor een passend milieumonitoringprogramma.


      2 Een of meer door Onze Minister aangewezen diensten of instanties is of zijn belast met de coördinatie en het
      uitvoeren of mede uitvoeren van het programma, bedoeld in het eerste lid.


      3 Bij verordening van de Autoriteit worden regels gesteld betreffende de opzet en inhoud van het
      milieumonitoringprogramma, de taakverdeling en de wijze van uitvoering.
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel6.24
  - number: '7.1'
    text: |-
      1 De ondernemer is verplicht, met het oog op de bescherming van werknemers en leden van de bevolking tegen
      ioniserende straling, de stralingsbeschermingsdeskundige toezicht te laten uitvoeren dan wel deze te raadplegen en
      stelt hem de middelen ter beschikking die hij nodig heeft om zijn taken goed te kunnen vervullen.

      2 Het toezicht, bedoeld in het eerste lid, heeft betrekking op de volgende onderwerpen, die voor een handeling van
      belang zijn:

      a. het onderzoeken en testen van beschermingsmiddelen en technieken en meetinstrumenten ter waarborging van de
      bescherming van personen;

      b. de kritische beoordeling van de plannen voor handelingen en nieuwe of aangepaste bronnen in relatie tot
      ontwerpkenmerken, veiligheidskenmerken, waarschuwingsmiddelen en technieken, voorafgaand aan de uitvoering ervan;

      c. de kritische beoordeling van de risico’s van de plannen, bedoeld in onderdeel b, en het verlenen van toestemming
      voordat met de handelingen wordt aangevangen;

      d. de inhoud van de acceptatietest, bedoeld in het vijfde lid;

      e. de periodieke controle van de doeltreffendheid en het juiste gebruik van beschermingsmiddelen en -technieken ter
      waarborging van de bescherming van personen; en

      f. de periodieke controle van de goede werking en het juiste gebruik van bronnen en meetinstrumenten voor de meting
      van ioniserende straling en de periodieke kalibratie van deze instrumenten.

      3 De raadpleging, bedoeld in het eerste lid, heeft, voor zover van toepassing, in ieder geval betrekking op de
      volgende onderwerpen:

      a. de optimalisatie, en de vaststelling van passende dosisbeperkingen en de blootstellingsituaties waarin kan
      worden afgeweken van de referentieniveaus, bedoeld in [artikel 7.37, tweede en derde lid][ref1];

      b. waar nodig de indeling van ruimten in gecontroleerde of bewaakte zone en de inrichting van deze ruimten;

      c. de indeling van de werknemers;

      d. de werkplekgerelateerde en individuele monitoringsprogramma’s en de bijhorende persoonlijke dosimetrie;

      e. de kwaliteitsborging;

      f. het milieumonitoringprogramma;

      g. de afspraken betreffende het beheer van radioactieve afvalstoffen;

      h. de afspraken betreffende de preventie van ongevallen en incidenten;

      i. de voorbereiding en reactie op ongevallen en stralingsincidenten en blootstelling in radiologische
      noodsituaties;

      j. de programma’s voor opleiding en bij- en nascholing van werknemers;

      k. het onderzoek en de analyse van ongevallen en incidenten en passende herstelmaatregelen;

      l. de arbeidsomstandigheden van zwangere werknemers en werknemers die borstvoeding geven; en

      m. passende documentatie zoals een voorafgaande beoordeling van de risico’s en schriftelijke procedures.

      4 Daar waar nodig werkt de stralingsbeschermingsdeskundige samen met en onderhoudt hij contact met de
      toezichthoudend medewerker stralingsbescherming en de klinisch fysicus.

      5 De ondernemer zorgt ervoor dat een nieuwe of aangepaste bron niet in gebruik wordt genomen dan na een
      acceptatietest, anders dan die genoemd in de [artikelen 8.8][ref2] en [8.15][ref3], verricht door of onder toezicht
      van een stralingsbeschermingsdeskundige, gevolgd door diens toestemming om de bron in gebruik te nemen.

      6 De ondernemer legt de toedeling van taken, bevoegdheden, verantwoordelijkheden en middelen met
      betrekking tot de stralingsbeschermingsdeskundige schriftelijk vast. Dit document is toegankelijk
      voor alle in de onderneming werkzame werknemers en de externe hulpverleningsorganisaties, bedoeld in
      [artikel 3, eerste lid, onder e, van de Arbeidsomstandighedenwet][ref4].

      7 De ondernemer zorgt ervoor dat alle bevindingen van de stralingsbeschermingsdeskundige ten aanzien van de
      onderwerpen, genoemd in het tweede, derde, vierde, vijfde en zesde lid, worden vastgelegd in een beheerssysteem.

      8 Bij regeling van Onze Minister kunnen met het oog op een goede uitvoering nadere regels worden gesteld met
      betrekking tot het tweede, derde, vierde en vijfde lid, voor zover dit niet betreft de veiligheid en gezondheid van
      werknemers, en het zevende lid.

      9 Bij regeling van Onze Minister van Sociale Zaken en Werkgelegenheid kunnen nadere regels worden gesteld met
      betrekking tot het tweede, derde, vierde en vijfde lid, voor zover dit de veiligheid en gezondheid van werknemers
      betreft.


