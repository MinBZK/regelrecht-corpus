  - number: '10.10'
    text: |-
      De vergunninghouder die op grond van [artikel 10.6, zevende lid][ref1], door de Autoriteit is aangewezen, stelt
      de kosten, die hij in rekening brengt voor het in werking houden van een installatie en voor het beheer van
      radioactieve afvalstoffen, vast op een transparante, objectieve en niet-discriminerende wijze. Tot de kosten
      behoren ook de kosten die de vergunninghouder maakt voor onderzoek en ontwikkeling voor het beheer van radioactieve
      afvalstoffen, zoals dit in het nationaal programma, bedoeld in [artikel 10.1][ref2], is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel10.6
