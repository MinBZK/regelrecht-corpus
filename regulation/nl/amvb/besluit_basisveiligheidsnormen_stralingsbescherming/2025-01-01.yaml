  - number: '6.8'
    text: |-
      1 De ondernemer zorgt ervoor dat voorzieningen worden getroffen ter voorbereiding op het verrichten van een
      interventie voor het geval dat zich binnen de locatie een ongeval of radiologische noodsituatie voordoet.
      Indien hij op grond van [artikel 6.7][ref1] over een bedrijfsnoodplan dient te beschikken neemt hij in het
      bedrijfsnoodplan een onderdeel «interventies» op, dat hij regelmatig test.

      2 Indien zich binnen de locatie een ongeval of radiologische noodsituatie voordoet, treft de ondernemer
      onmiddellijk alle passende maatregelen om de gevolgen daarvan te beperken.

      3 Naast de melding, bedoeld in [artikel 6.1, eerste lid][ref2], brengt de ondernemer het ongeval of de
      radiologische noodsituatie onmiddellijk ter kennis van de burgemeester van de gemeente waar die situatie zich
      voordoet.

      4 De ondernemer maakt onmiddellijk een voorlopige beoordeling van de omstandigheden en de gevolgen van die situatie
      en meldt deze aan de burgemeester en de Autoriteit.

      5 De ondernemer zorgt ervoor dat alle medewerking wordt verleend aan een interventie die door een bestuursorgaan
      wordt verricht.

      6 Onverminderd [artikel 6.2][ref3] treft de ondernemer, indien zich binnen de locatie een ongeval of radiologische
      noodsituatie voordoet, onmiddellijk beschermingsmaatregelen met betrekking tot:

      a. de stralingsbron, om de straling evenals de lozing van radionucliden te beperken of te beëindigen;

      b. het milieu, om de blootstelling van personen aan radioactieve stoffen via relevante blootstellingsroutes te
      beperken;

      c. personen, om hun blootstelling te beperken.

      7 Bij verordening van de Autoriteit kunnen met het oog op een goede uitvoering nadere regels worden gesteld met
      betrekking tot het eerste tot en met zesde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel6.7
      [ref2]: https://wetten.overheid.nl/BWBR0040179#Artikel6.1
      [ref3]: https://wetten.overheid.nl/BWBR0040179#Artikel6.2
