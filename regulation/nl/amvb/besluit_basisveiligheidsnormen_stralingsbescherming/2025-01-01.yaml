  - number: '4.17'
    text: |-
      1 De ondernemer verstrekt voordat hij een hoogactieve bron verwerft, aan de Autoriteit:

      a. informatie over het volume van de verworven bron, de bronhouder en de vaste afscherming van die bron;

      b. schriftelijk bewijs dat de krachtens [artikel 4.15, eerste lid][ref1], vereiste financiële zekerheid is gesteld,
      en

      c. schriftelijk bewijs van de overeenkomst die met de leverancier of fabrikant van de bron is gesloten ten aanzien
      van:

      1°. de overbrenging van de niet meer in gebruik zijnde bron naar de leverancier, fabrikant of andere ondernemer die
      bevoegd is de bron te ontvangen, of

      2°. de plaatsing van de niet meer in gebruik zijnde bron in een voorziening voor opslag of verwijdering.

      2 Het eerste lid is niet van toepassing indien de daarin bedoelde gegevens reeds bij een aanvraag om een vergunning
      voor de desbetreffende bron of handeling zijn verstrekt.

      3 Bij verordening van de Autoriteit kunnen nadere eisen worden gesteld met betrekking tot de te verstrekken
      gegevens en de wijze van verstrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel4.15
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel4.17
