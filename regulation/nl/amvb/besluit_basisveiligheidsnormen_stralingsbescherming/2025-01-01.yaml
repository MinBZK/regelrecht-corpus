  - number: '3.12'
    text: |-
      1 Kennisgeving vindt plaats overeenkomstig bij verordening van de Autoriteit gestelde regels.

      2 Bij de kennisgeving worden gegevens verstrekt met betrekking tot:

      a. het soort handeling of maatregel, het type blootstellingsituatie alsmede het voorgenomen tijdstip en de wijze
      van uitvoering daarvan;

      b. het type, aard en plaats van de bron;

      c. het besluit of de regeling waarbij de handeling of maatregel gerechtvaardigd is of een krachtens
      [artikel 2.3][ref1] of [2.5][ref2] ingediend verzoek om rechtvaardiging van de handeling of maatregel;

      d. de naam en het adres van de rechtspersoon of natuurlijke persoon die verantwoordelijk is voor de
      blootstellingsituatie of onder wiens verantwoordelijkheid de handeling of maatregel wordt uitgevoerd, en

      e. overige noodzakelijke, bij verordening van de Autoriteit aangewezen gegevens van administratieve of technische
      aard.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing op een kennisgeving van beëindiging als bedoeld in
      [artikel 3.6, achtste lid][ref3], [artikel 3.9, tweede lid][ref4], of [artikel 3.11, vijfde lid][ref5], met dien
      verstande dat bij die kennisgeving tevens de datum van beëindiging en de wijze van verwijdering van een bron worden
      vermeld.


