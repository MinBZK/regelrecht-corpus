  - number: '4.1'
    text: |-
      1 Een ondernemer zorgt ervoor dat, in situaties waar ten gevolge van een handeling een in [artikel 7.3][ref1] of
      [9.1][ref2] genoemde dosislimiet kan worden overschreden, op daarvoor geschikte plaatsen doelmatige en duidelijke
      waarschuwingsborden of waarschuwingstekens en opschriften worden aangebracht.

      2 Bij regeling van Onze Minister van Sociale Zaken en Werkgelegenheid kunnen regels worden gesteld met betrekking
      tot het model, de opschriften en de minimale grootte van de waarschuwingsborden of waarschuwingstekens en waar en
      op welke wijze deze moeten worden aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel7.3
      [ref2]: https://wetten.overheid.nl/BWBR0040179#Artikel9.1
