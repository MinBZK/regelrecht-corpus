  - number: '12.4'
    text: |-
      Met ingang van het tijdstip van inwerkingtreding van dit besluit berust het programma, bedoeld in
      [artikel 20h van het Besluit stralingsbescherming][ref1], voor zover op dat artikel berustend, op
      [artikel 10.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel20h
