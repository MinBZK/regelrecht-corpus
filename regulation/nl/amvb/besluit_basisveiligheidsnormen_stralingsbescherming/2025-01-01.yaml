  - number: '11.3'
    text: |-
      1 Indien op de voorbereiding van een beschikking ter zake van een aanvraag om een vergunning voor het verrichten
      van een handeling met radioactieve stoffen [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing
      is, worden betrokken:

      a. het college van gedeputeerde staten van de provincie, het bestuur van de veiligheidsregio en het college van
      burgemeester en wethouders van de gemeente waar de handeling wordt of zal worden verricht of,

      b. indien het een lozing in oppervlaktewateren betreft, het orgaan dat belast is met het kwaliteitsbeheer van het
      oppervlaktewaterlichaam waarin wordt of zal worden geloosd.

      2 Indien op de voorbereiding van een beschikking ter zake van een aanvraag om een vergunning voor een handeling
      met een toestel [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] van toepassing is, wordt, anders dan als
      adviseur, betrokken het college van burgemeester en wethouders van de gemeente waar de handeling wordt of zal
      worden verricht.

      3 Van een besluit op een aanvraag om een vergunning op de voorbereiding waarvan
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref3] niet van toepassing is, wordt door de Autoriteit mededeling
      gedaan in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
