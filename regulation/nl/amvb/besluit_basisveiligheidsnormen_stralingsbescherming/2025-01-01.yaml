  - number: '10.4'
    text: |-
      1 In afwijking van [artikel 10.3][ref1] is het in het eerste lid van dat artikel bedoelde verbod niet van
      toepassing indien:

      a. het een lozing betreft van radioactieve stoffen die vrijkomen als gevolg van handelingen met van nature
      voorkomende radionucliden, en

      b. de activiteit van de totaal in een kalenderjaar te lozen radionucliden, bij het verlaten van de locatie, lager
      is dan de in [bijlage 3, onderdeel B, tabel C][ref2], opgenomen vrijgavewaarde.

      2 [Artikel 3.17, derde, zesde en negende lid][ref3], is van overeenkomstige toepassing.

      3 Bij regeling van Onze Minister kunnen, indien het belang van de stralingsbescherming zich daar niet tegen verzet,
      voor andere radionucliden dan bedoeld in het eerste lid, onder b, vrijgavewaarden worden vastgesteld en kunnen
      daarmee verbonden regels worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel10.3
      [ref2]: https://wetten.overheid.nl/BWBR0040179
      [ref3]: https://wetten.overheid.nl/BWBR0040179#Artikel3.17
