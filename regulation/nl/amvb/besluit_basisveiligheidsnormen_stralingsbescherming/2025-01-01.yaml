  - number: '3.7'
    text: |-
      Een vergunning wordt geweigerd indien:

      a. ten aanzien van de handeling waarop de aanvraag betrekking heeft, niet wordt voldaan aan het bepaalde in:

      1°. [hoofdstuk 2][ref1], [7][ref2] of [8][ref3], met betrekking tot rechtvaardiging, optimalisatie en
      dosislimitering, of

      2°. [hoofdstuk 5][ref4], met betrekking tot deskundigheid;

      b. voor een lid van de bevolking dat zich op enig punt buiten de locatie bevindt, als gevolg van de handeling
      waarop de aanvraag betrekking heeft en ten gevolge van alle toegestane handelingen die onder verantwoordelijkheid
      van de ondernemer worden verricht, een effectieve dosis van 0,1 millisievert in een kalenderjaar wordt overschreden
      of kan worden overschreden;

      c. voor een lid van de bevolking dat zich buiten de locatie bevindt, ten gevolge van de handeling waarop de
      aanvraag betrekking heeft en ten gevolge van andere handelingen binnen en buiten deze locatie, een van de volgende
      doses wordt overschreden of kan worden overschreden:

      1°. een effectieve dosis van 1 millisievert in een kalenderjaar en, met inachtneming daarvan:

      2°. een equivalente dosis van 50 millisievert in een kalenderjaar voor de huid, gemiddeld over enig huidoppervlak
      van 1 cm2;

      d. de handeling waarop de aanvraag betrekking heeft behoort tot een soort of categorie die op grond van
      [paragraaf 2.2][ref5] generiek is gerechtvaardigd, maar het specifieke karakter van die handeling op grond van het
      bepaalde in die paragraaf niet gerechtvaardigd is;

      e. niet is aangetoond dat een krachtens dit besluit vereiste financiële zekerheid is gesteld;

      f. geen, of een ontoereikend, beveiligingsplan als bedoeld in [artikel 4.7][ref6], bedrijfsnoodplan als bedoeld in
      [artikel 6.7][ref7] of beëindigingsplan als bedoeld in [artikel 10.8][ref8] bij de aanvraag is gevoegd, voor zover
      vereist krachtens [artikel 3.6, derde lid][ref9], aanhef en onder e;

      g. niet wordt voldaan aan bij of krachtens [de wet][ref10] met het oog op stralingsbescherming gestelde regels of
      voorschriften; of

      h. internationale verplichtingen tot het weigeren van de vergunning noodzaken.


