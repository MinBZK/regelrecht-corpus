  - number: '12.2'
    text: |-
      1 Een onmiddellijk voor het tijdstip van inwerkingtreding van dit besluit krachtens
      [artikel 4, eerste en tweede lid, van het Besluit stralingsbescherming][ref1] als gerechtvaardigd
      aangewezen, bestaande handeling of maatregel, die met ingang van dat tijdstip niet langer krachtens
      [artikel 2.3, eerste lid][ref2], generiek als gerechtvaardigd is aangewezen, mag tot 1 januari 2019 worden
      voortgezet.

      2 Een op het tijdstip van inwerkingtreding van dit besluit krachtens
      [artikel 4, zevende lid, eerste volzin, van het Besluit stralingsbescherming][ref3] als gerechtvaardigd aangewezen
      handeling of maatregel geldt met ingang van dat tijdstip als een krachtens [artikel 2.3, derde lid][ref4],
      gerechtvaardigde handeling of maatregel.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel4
