  - number: '5.2'
    text: |-
      1 Degene die apparatuur die radioactieve bronnen bevat, of een toestel of versneller waardoor ioniserende straling
      wordt uitgezonden of kan worden uitgezonden op de markt brengt of overdraagt aan een ondernemer zorgt ervoor dat
      aan de ondernemer aan wie een toestel of versneller wordt overgedragen passende voorlichting wordt verstrekt over
      de mogelijke radiologische gevaren en het juiste gebruik ervan alsmede het testen en het onderhoud ervan, met
      inbegrip van een document waaruit blijkt dat het ontwerp het mogelijk maakt de blootstelling te beperken tot een
      niveau dat zo laag als redelijkerwijs mogelijk is.

      2 Onverminderd het eerste lid, zorgt degene die medisch-radiologische apparatuur, toestellen
      of versnellers op de markt brengt of overdraagt aan een andere ondernemer er overeenkomstig
      [artikel 6, eerste lid, van het Besluit medische hulpmiddelen][ref1] voor, dat aan elke ondernemer aan wie de
      overdracht plaatsvindt passende voorlichting wordt verstrekt over de risicobeoordeling voor patiënten, en over de
      beschikbare elementen van de klinische evaluatie.

      3 Bij verordening van de Autoriteit kunnen met het oog op een goede uitvoering nadere regels worden gesteld met
      betrekking tot het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007307#Artikel6
