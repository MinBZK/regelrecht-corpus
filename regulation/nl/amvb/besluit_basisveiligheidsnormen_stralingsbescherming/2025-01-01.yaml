  - number: '12.3'
    text: |-
      1 Met ingang van het tijdstip van inwerkingtreding van dit besluit:

      a. geldt een inschrijving krachtens [artikel 7, eerste lid, van het Besluit stralingsbescherming][ref1] of een
      aanvraag daartoe, als inschrijving krachtens [artikel 7.22, eerste lid][ref2], of aanvraag als bedoeld in het
      vijfde lid van dat artikel;

      b. geldt het register, bedoeld in [artikel 7, eerste lid, van het Besluit stralingsbescherming][ref3] als register
      als bedoeld in [artikel 7.22, eerste lid][ref4];

      c. geldt een inschrijving als bedoeld in [artikel 7a van het Besluit stralingsbescherming][ref5] of een aanvraag
      daartoe, als een inschrijving als bedoeld in [artikel 7.23, eerste lid][ref6], of een aanvraag om een inschrijving
      als bedoeld in dat lid.

      2 Met ingang van het tijdstip van inwerkingtreding van dit besluit:

      a. geldt een algemeen coördinerend of coördinerend deskundige als bedoeld in
      [artikel 7b, eerste lid, van het Besluit stralingsbescherming][ref7] als een stralingsbeschermingsdeskundige als
      bedoeld in [artikel 5.4][ref8], van het krachtens het derde lid van dat artikel bepaalde niveau;

      b. geldt een voor het genoemde tijdstip bij een erkende instelling als bedoeld in
      [artikel 7f van het Besluit stralingsbescherming][ref9] behaald diploma, certificaat of getuigschrift voor een
      opleiding tot coördinerend of algemeen coördinerend deskundige als een diploma voor een dergelijke deskundige als
      bedoeld in [artikel 5.5, vierde lid][ref10];

      c. geldt een inschrijving van een algemeen coördinerend of coördinerend deskundige als bedoeld in
      [artikel 7b, eerste lid, van het Besluit stralingsbescherming][ref11] of een aanvraag daartoe, als een inschrijving
      als stralingsbeschermingsdeskundige als bedoeld in [artikel 5.5, eerste lid][ref12], of aanvraag als bedoeld in
      dat lid;

      d. geldt een inschrijving als bedoeld in [artikel 7d van het Besluit stralingsbescherming][ref13] of een aanvraag
      daartoe, als een inschrijving als bedoeld in [artikel 5.6][ref14] of aanvraag als bedoeld in dat artikel.

      3 Met ingang van het tijdstip van inwerkingtreding van dit besluit geldt:

      a. een toezichthoudend deskundige als bedoeld in [artikel 7c van het Besluit stralingsbescherming][ref15] als een
      toezichthoudend medewerker stralingsbescherming als bedoeld in [artikel 5.7][ref16], van het krachtens het zesde
      lid van dat artikel bepaalde niveau;

      b. een diploma, certificaat of getuigschrift als bedoeld in [artikel 7c van het Besluit stralingsbescherming][ref17]
      als een diploma, certificaat of getuigschrift als bedoeld in [artikel 5.8][ref18].

      4 Met ingang van het tijdstip van inwerkingtreding van dit besluit geldt een erkenning als bedoeld in
      [artikel 7f van het Besluit stralingsbescherming][ref19] of een aanvraag daartoe, als een erkenning als bedoeld in
      [artikel 5.11, eerste lid][ref20], of aanvraag als bedoeld in het derde lid van dat artikel.

      5 Met ingang van het tijdstip van inwerkingtreding van dit besluit geldt een erkenning als bedoeld in
      [artikel 8, eerste lid, van het Besluit stralingsbescherming][ref21] of een aanvraag daartoe, als een erkenning
      krachtens [artikel 7.15, tweede lid][ref22], of een aanvraag als bedoeld in dat artikel.

      6 Met ingang van het tijdstip van inwerkingtreding van dit besluit geldt de schriftelijke vastlegging, bedoeld in
      [artikel 9, vijfde lid, van het Besluit stralingsbescherming][ref23], als schriftelijke vastlegging, bedoeld in
      [artikel 7.1, vierde lid][ref24], of [artikel 7.2, vierde lid][ref25].

      7 Met ingang van het tijdstip van inwerkingtreding van dit besluit geldt een beheerssysteem als bedoeld in
      [artikel 10, vierde lid, van het Besluit stralingsbescherming][ref26] als een beheerssysteem als bedoeld in
      [artikel 7.1, zesde lid][ref27].

      8 Met ingang van het tijdstip van inwerkingtreding van dit besluit:

      a. gelden maatregelen als bedoeld in [artikel 11, eerste lid, van het Besluit stralingsbescherming][ref28] als
      maatregelen als bedoeld in [artikel 4.4, eerste lid][ref29];

      b. geldt een overeenkomst als bedoeld in [artikel 11, zesde lid, van het Besluit stralingsbescherming][ref30] als
      een overeenkomst als bedoeld in [artikel 10.9, eerste lid][ref31].

      9 Met ingang van het tijdstip van inwerkingtreding van dit besluit geldt een toestemming als bedoeld in
      [artikel 12, derde lid, van het Besluit stralingsbescherming][ref32], of een verzoek daartoe, als een toestemming
      als bedoeld in [artikel 5.9, derde lid][ref33], of een verzoek om toestemming als bedoeld in dat artikel.

      10 Met ingang van het tijdstip van inwerkingtreding van dit besluit gelden de documentatie en instructies als
      bedoeld in [artikel 15, derde en vijfde lid, van het Besluit stralingsbescherming][ref34], als documentatie en
      instructies als bedoeld in [artikel 4.14][ref35].


