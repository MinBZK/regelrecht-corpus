  - number: '4.27'
    text: |-
      1 Gerechtvaardigde handelingen met blootstelling bij niet-medische beeldvorming, waarbij medisch-radiologische
      apparatuur wordt gebruikt, kunnen bij regeling van Onze Minister worden vrijgesteld van:

      a. dosisbeperkingen voor blootstelling van een lid van de bevolking, opgenomen in [artikel 9.5][ref1];

      b. dosislimieten voor blootstelling van een lid van de bevolking, opgenomen in [artikel 9.1][ref2].

      2 De Autoriteit stelt bij verordening of beschikking regels of voorschriften vast voor handelingen ten behoeve van
      niet-medische beeldvorming, met inbegrip van criteria voor de individuele toepassing.

      3 Bij procedures waarbij medisch-radiologische apparatuur wordt gebruikt zorgt de ondernemer voor:

      a. naleving van de relevante bepalingen inzake medische blootstelling als bedoeld in [hoofdstuk 8][ref3], waaronder
      in elk geval worden begrepen de bepalingen met betrekking tot:

      1°. de apparatuur;

      2°. optimalisatie;

      3°. de verantwoordelijkheden;

      4°. de opleidingsvereisten;

      5°. bijzondere bescherming tijdens zwangerschap;

      b. een passende betrokkenheid van een klinisch fysicus;

      c. het toepassen van specifieke protocollen al naar gelang het doel van de blootstelling en de vereiste
      beeldkwaliteit;

      d. het voldoen aan de op grond van [artikel 4.28][ref4] vastgestelde specifieke diagnostische referentieniveaus,
      indien redelijkerwijs uitvoerbaar.

      4 Voor procedures waarbij geen medisch-radiologische apparatuur wordt gebruikt zorgt de ondernemer ervoor dat de
      dosisbeperkingen zo ruim mogelijk onder de dosislimieten voor blootstelling van leden van de bevolking, opgenomen
      in [artikel 9.1][ref5], liggen.

      5 De ondernemer zorgt ervoor dat adequate informatie wordt verstrekt aan, en toestemming wordt gevraagd aan een
      persoon die de blootstelling zal ondergaan.

      6 Het vijfde lid is niet van toepassing voor zover in het kader van de rechtshandhaving een instemming niet bij of
      krachtens [de wet][ref6] wordt vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel9.5
