    text: |-
      1 Het is verboden om een handeling, behorend tot een in [artikel 3.10][ref1] genoemde categorie, te verrichten:

      a. zonder daartoe door de Autoriteit verleende registratie, of

      b. in strijd met de bij of krachtens [de wet][ref2] met het oog op stralingsbescherming ten aanzien van de
      desbetreffende handeling of bron gestelde regels en voorschriften.

      2 [Artikel 3.6, eerste tot en met vierde lid en zesde tot en met achtste lid][ref3], en [artikel 3.7][ref4] zijn
      van overeenkomstige toepassing, met dien verstande dat voor «vergunning» steeds wordt gelezen: registratie.


