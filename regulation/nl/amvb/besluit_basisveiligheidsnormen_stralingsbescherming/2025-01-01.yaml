  - number: '7.11'
    text: |-
      1 De ondernemer deelt, voor aanvang van het verrichten van de handelingen, ten behoeve van de individuele
      monitoring en het gezondheidskundig toezicht elke blootgestelde werknemer in als A- of B-werknemer. Voor elke
      externe werknemer geschiedt de indeling in samenspraak tussen de ondernemer en de werkgever.

      2 Een A-werknemer is een blootgestelde werknemer, die:

      1°. een effectieve dosis kan ontvangen die groter is dan 6 millisievert in een kalenderjaar;

      2°. een equivalente dosis kan ontvangen die groter is dan 15 millisievert in een kalenderjaar voor de ooglens;

      3°. een equivalente dosis kan ontvangen die groter is dan 150 millisievert in een kalenderjaar voor de huid,
      gemiddeld over enig blootgesteld huidoppervlak van 1 cm2; of

      4°. een equivalente dosis kan ontvangen die groter is dan 150 millisievert in een kalenderjaar voor de
      extremiteiten.

      3 Een B-werknemer is een blootgestelde werknemer die niet als A-werknemer wordt ingedeeld.

      4 De indeling wordt met passende frequentie heroverwogen en in ieder geval opnieuw uitgevoerd, indien de
      omstandigheden zijn gewijzigd of wanneer de resultaten van het gezondheidskundig onderzoek, bedoeld in
      [artikel 7.21][ref1], dit nodig maken.

      5 Bij regeling van Onze Minister van Sociale Zaken en Werkgelegenheid kunnen nadere regels worden gesteld met
      betrekking tot het eerste en vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel7.21
