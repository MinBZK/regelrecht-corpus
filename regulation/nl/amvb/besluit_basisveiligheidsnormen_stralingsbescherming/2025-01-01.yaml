  - number: '3.13'
    text: |-
      Onder de kennisgevingsplicht in gevallen waarin geen vergunning of registratie is vereist, vallen de
      blootstellingsituaties, handelingen en maatregelen, behorend tot een onder a, b of c genoemde categorie:

      a. krachtens [artikel 6.17][ref1] aangewezen bestaande blootstellingsituaties waarop het bepaalde bij of krachtens
      dit besluit met betrekking tot geplande blootstellingsituaties van toepassing is en handelingen in die situaties
      die leiden tot invoering of wijziging van een blootstellingsroute;

      b. maatregelen in andere bestaande blootstellingsituaties dan bedoeld onder a, die leiden tot invoering of
      wijziging van een blootstellingsroute;

      c. blootstellingsituaties ten gevolge van krachtens [artikel 3.2, vierde lid][ref2], aangewezen handelingen met
      natuurlijke bronnen.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel6.17
      [ref2]: https://wetten.overheid.nl/BWBR0040179#Artikel3.2
