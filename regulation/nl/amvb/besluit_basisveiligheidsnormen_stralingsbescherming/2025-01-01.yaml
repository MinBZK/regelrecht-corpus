  - number: '7.23'
    text: |-
      1 De Autoriteit schrijft op aanvraag een persoon die onderdaan is van een betrokken staat als bedoeld in
      [artikel 1 van de Algemene wet erkenning EU-beroepskwalificaties][ref1] in in het register, bedoeld in
      [artikel 7.22, eerste lid][ref2], indien op grond van de [Algemene wet erkenning EU-beroepskwalificaties][ref3] en
      met toepassing van de op grond van [artikel 33 van die wet][ref4] gestelde regels is aangetoond dat deze persoon
      over kwalificaties bezit die gelijkwaardig zijn aan de kwalificaties waaraan ingevolge artikel 7.22, derde lid,
      moet worden voldaan om als stralingsarts in het register te worden ingeschreven.

      2 [Artikel 7.22, zesde lid][ref5], is van overeenkomstige toepassing op de aanvraag tot inschrijving als bedoeld in
      de eerste volzin.

      3 Bij regeling van Onze Minister kunnen nadere regels worden gesteld met betrekking tot het eerste lid.


