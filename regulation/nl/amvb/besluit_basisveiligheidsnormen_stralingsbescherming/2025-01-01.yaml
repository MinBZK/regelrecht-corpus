  - number: '4.23'
    text: |-
      In afwijking van het in [artikel 3.5, tweede lid][ref1], in samenhang met [artikel 3.8, derde lid, onder c][ref2],
      bedoelde verbod, op het zonder of in strijd met een vergunning toevoegen van radioactieve stoffen aan
      consumentenproducten, is het verboden:

      a. voor verlichtingsdoeleinden radionucliden toe te voegen aan een aanwijsinstrument;

      b. handelingen te verrichten met een aanwijsinstrument waaraan voor verlichtingsdoeleinden radionucliden zijn
      toegevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel3.5
      [ref2]: https://wetten.overheid.nl/BWBR0040179#Artikel3.8
