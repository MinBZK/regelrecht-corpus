  - number: '8.1'
    text: |-
      Bij regeling van Onze Minister van Volksgezondheid, Welzijn en Sport, kunnen nadere regels worden gesteld ten
      aanzien van:

      a. de kwaliteitsborging, bedoeld in [artikel 8.8, tweede lid, onderdeel b][ref1];

      b. het bepaalde in [artikel 8.8, tweede lid][ref2];

      c. de maatregelen, bedoeld in [artikel 8.11, vierde lid][ref3];

      d. het bepaalde in [artikel 8.12, tweede lid][ref4];

      e. het bepaalde in [artikel 8.13, tweede volzin][ref5];

      f. de behandelingsparameters, bedoeld in [artikel 8.15, onderdeel f][ref6].


