  - number: '2.8'
    text: |-
      1 Op de vaststelling van referentieniveaus voor bestaande blootstellingsituaties krachtens [artikel 7.38][ref1] of
      [9.10][ref2] en referentieniveaus voor radiologische noodsituaties krachtens [artikel 7.37][ref3] of [9.8][ref4],
      zijn het tweede en derde lid van toepassing.

      2 De waarde voor een referentieniveau is afhankelijk van het type blootstellingsituatie. Bij de bepaling van de
      waarde voor een referentieniveau wordt rekening gehouden met zowel de eisen inzake stralingsbescherming als met de
      relevante maatschappelijke omstandigheden.

      3 Voor bestaande blootstellingsituaties van zowel werknemers als voor leden van de bevolking die blootstelling aan
      radon met zich brengen, wordt het referentieniveau vastgesteld als radonactiviteitsconcentratie in de lucht.

      4 In een bestaande blootstellingsituatie of radiologische noodsituatie wordt voorrang gegeven aan de optimalisatie
      van de stralingsbescherming bij een blootstelling gelijk aan of hoger dan het desbetreffende referentieniveau.

      5 In een bestaande blootstellingsituatie of radiologische noodsituatie met een blootstelling tot het desbetreffende
      referentieniveau wordt de optimalisatie van de stralingsbescherming voortgezet.


