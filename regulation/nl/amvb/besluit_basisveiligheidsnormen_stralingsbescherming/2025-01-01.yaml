  - number: '3.16'
    text: |-
      1 Onverminderd de [artikelen 3.5 tot en met 3.7][ref1] en [3.15][ref2] wordt een vergunning voor een handeling
      waarbij een hoogactieve bron is betrokken uitsluitend verleend indien:

      a. overeenkomstig het bepaalde in [artikel 4.17, eerste lid, aanhef en onder c][ref3], overeenkomsten zijn gesloten
      voor het veilig beheer en controle van de betrokken hoogactieve bronnen, ook wanneer deze bronnen niet meer in
      gebruik zijn. Deze overeenkomsten kunnen in ieder geval betrekking hebben op:

      1°. overbrenging van de niet meer in gebruik zijnde bron naar de fabrikant, leverancier of een andere ondernemer
      die bevoegd is de bron te ontvangen;

      2°. plaatsing in een voorziening voor opslag of verwijdering, of

      3°. een verplichting voor de fabrikant of leverancier om deze in ontvangst te nemen;

      b. er door middel van financiële zekerheid overeenkomstig de [artikelen 4.15 tot en met 4.17][ref4] of op andere
      geschikte wijze voorzien wordt in het veilig beheer van de bron wanneer deze buiten gebruik wordt gesteld, mede met
      het oog op de situatie dat een ondernemer insolvent wordt of zijn activiteiten beëindigt.

      2 Bij verordening van de Autoriteit kunnen met het oog op een goede uitvoering nadere regels worden gesteld met
      betrekking tot de financiële zekerheidsstelling en het borgen van een veilige afvoer van een hoogactieve bron bij
      beëindiging van het gebruik ervan.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel3.5
      [ref2]: https://wetten.overheid.nl/BWBR0040179#Artikel3.15
      [ref3]: https://wetten.overheid.nl/BWBR0040179#Artikel4.17
      [ref4]: https://wetten.overheid.nl/BWBR0040179#Artikel4.15
