  - number: '4.25'
    text: |-
      1 Het is verboden buiten Nederland vervaardigde aanwijsinstrumenten waaraan voor verlichtingsdoeleinden
      radionucliden zijn toegevoegd, voorhanden te hebben met het doel deze binnen Nederland in de handel te brengen,
      indien deze instrumenten niet voldoen aan de bij of krachtens de [artikelen 4.23][ref1] en [4.24][ref2] gestelde
      regels.

      2 Onze Minister van Defensie kan ontheffing verlenen van de in het eerste lid en [artikel 4.23][ref3] gestelde
      verboden indien het aanwijsinstrumenten betreft waaraan voor verlichtingsdoeleinden radionucliden zijn toegevoegd
      en die in gebruik zijn dan wel bestemd zijn voor gebruik bij de krijgsmacht onder operationele omstandigheden.

      3 Bij verordening van de Autoriteit kunnen nadere regels worden gesteld met betrekking tot aanwijsinstrumenten.


