    text: |-
      1 Bij beschikking of verordening van de Autoriteit kunnen in afwijking van
      [artikel 3.17, eerste lid, aanhef en onderdeel a, b of c, of vijfde lid][ref1], of [artikel 3.18][ref2], voor
      daarbij aangewezen specifieke bronnen of handelingen specifieke vrijstellingswaarden en daarmee verbonden regels
      worden vastgesteld, indien naar het oordeel van de Autoriteit vrijstelling de voorkeur heeft en het belang van de
      stralingsbescherming zich daar niet tegen verzet.

      2 Bij een vrijstelling als bedoeld in het eerste lid worden de algemene criteria, opgenomen in
      [bijlage 3, onderdeel A, onderdeel 3][ref3], in acht genomen en worden bij de beoordeling van de wenselijkheid
      van vrijstelling de met het oog op stralingsbescherming relevante factoren in aanmerking genomen. De krachtens
      [artikel 3.17, achtste lid][ref4], gestelde regels zijn van toepassing.


