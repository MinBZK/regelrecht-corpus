  - number: '3.22'
    text: |-
      1 [Afdeling 3.2][ref1] is niet van toepassing op handelingen met radioactieve materialen die van nature
      voorkomende radionucliden bevatten welke het resultaat zijn van handelingen waarvoor een vergunning krachtens
      [artikel 15 van de wet][ref2] is vereist en waarbij natuurlijke radionucliden worden verwerkt vanwege hun
      eigenschappen als splijtstof of kweekstof, welke materialen bestemd zijn voor verwijdering, recycling of
      hergebruik, en het voorhanden hebben daarvan:

      a. waarvan de activiteitsconcentratie van de radionucliden in de betrokken radioactieve stof niet hoger is dan de
      desbetreffende in [bijlage 3, onderdeel B, tabel A, deel 1][ref3], opgenomen vrijgavewaarde, of

      b. waarvan de activiteitsconcentratie van de radionucliden in de betrokken radioactieve stof niet hoger is dan de
      desbetreffende krachtens het derde lid vastgestelde vrijgavewaarde.

      2 [Artikel 3.17, tweede lid, zesde lid en negende lid][ref4], is van overeenkomstige toepassing.

      3 Bij regeling van Onze Minister kunnen, indien het belang van de stralingsbescherming zich daar niet tegen verzet,
      voor andere radionucliden dan bedoeld in het eerste lid, onderdeel a, vrijgavewaarden en daarmee verbonden regels
      worden vastgesteld.

      4 Bij de vaststelling van de in het derde lid bedoelde vrijgavewaarden en daarmee verbonden regels worden de
      algemene criteria voor kunstmatige radionucliden, opgenomen in [bijlage 3, onderdeel A, onderdeel 3][ref5], in acht
      genomen en worden bij de beoordeling van de wenselijkheid van de vrijgave de met het oog op stralingsbescherming
      relevante factoren in aanmerking genomen. De krachtens [artikel 3.17, achtste lid][ref6], gestelde regels zijn
      van toepassing.


