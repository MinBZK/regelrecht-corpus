  - number: '5.1'
    text: |-
      1 Onze Ministers die het aangaat en de Autoriteit zorgen ervoor dat aan leden van de bevolking, ondernemers,
      werknemers alsmede patiënten en andere personen die medische blootstelling ondergaan, informatie ter beschikking
      wordt gesteld met betrekking tot:

      a. categorieën of soorten handelingen die gerechtvaardigd zijn overeenkomstig de [paragrafen 2.1][ref1] en
      [2.2][ref2];

      b. de regelgeving met betrekking tot bronnen en stralingsbescherming.

      2 De informatie wordt ter beschikking gesteld overeenkomstig de vereisten van nationaal en internationaal recht,
      tenzij dat strijdig zou zijn met een nationaal of internationaal erkend belang, waaronder in ieder geval worden
      begrepen de belangen inzake veiligheid en beveiliging.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0040179#Hoofdstuk2
