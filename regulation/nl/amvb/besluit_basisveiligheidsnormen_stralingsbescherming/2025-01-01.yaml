  - number: '6.11'
    text: >-
      1 Een interventie wordt slechts verricht indien de daarvan verwachte beperking van de schade en de nadelige sociale
      en maatschappelijke gevolgen, veroorzaakt door ioniserende straling, voldoende is om de schade, de nadelige sociale
      en maatschappelijke gevolgen en de kosten van de interventie te rechtvaardigen.


      2 De vorm, de omvang en de duur van de interventie zijn zodanig, dat het voordeel van de daarmee te bereiken
      beperking van de gezondheidsschade, rekening houdend met de schade die aan de interventie is verbonden, zo groot is
      als redelijkerwijs mogelijk is.
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel6.11
  - number: '6.12'
    text: |-
      Onze Ministers die het aangaat als bedoeld in [artikel 6.10, eerste lid][ref1], zorgen ervoor dat er voorzieningen
      voor technische en medische interventie en voor het verwijderen van radioactieve besmetting beschikbaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel6.10
