  - number: '7.14'
    text: |-
      1 Indien sprake is of kan zijn van een overmatige blootstelling meldt de ondernemer dit zo spoedig mogelijk, doch
      uiterlijk binnen 24 uur, aan Onze Minister van Sociale Zaken en Werkgelegenheid of, indien het inrichtingen betreft
      waarvoor een vergunning krachtens [artikel 15, onder b, van de wet][ref1] is verleend, de Autoriteit of, indien het
      mijnbouw betreft, Onze Minister van Economische Zaken.

      2 Indien er sprake is of kan zijn van een overmatige blootstelling, zorgt de ondernemer ervoor dat de effectieve en
      equivalente doses worden bepaald die door de betrokken werknemer zijn ontvangen.

      3 Indien er sprake is van een stralingsincident, zorgt de ondernemer ervoor dat de effectieve en equivalente doses
      worden bepaald die door de betrokken werknemer zijn ontvangen.

      4 Indien een werknemer of hulpverlener bij een radiologische noodsituatie aan ioniserende straling kan worden
      blootgesteld, zorgt de ondernemer, die voor de handeling die de radiologische noodsituatie heeft veroorzaakt
      verantwoordelijk is, ervoor dat passende individuele monitoring wordt uitgevoerd en dat de effectieve en
      equivalente doses worden bepaald die door de betrokken werknemer of hulpverlener zijn ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
