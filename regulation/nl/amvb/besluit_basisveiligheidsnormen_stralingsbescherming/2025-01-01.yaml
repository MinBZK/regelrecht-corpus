  - number: '2.2'
    text: |-
      1 De volgende handelingen en maatregelen dienen voorafgaand aan het uitvoeren ervan te worden gerechtvaardigd:

      a. handelingen in geplande blootstellingsituaties;

      b. handelingen die leiden tot invoering of wijziging van een blootstellingsroute in krachtens
      [artikel 6.17, tweede lid][ref1], aangewezen bestaande blootstellingsituaties, waarop het bepaalde bij en krachtens
      dit besluit met betrekking tot geplande blootstellingsituaties van toepassing is;

      c. maatregelen die leiden tot invoering of wijziging van een blootstellingsroute in:

      1°. andere bestaande blootstellingsituaties dan bedoeld onder b;

      2°. radiologische noodsituaties.

      2 Rechtvaardiging van een handeling of maatregel geschiedt:

      a. generiek, als categorie of soort, bij ministeriële regeling op grond van [artikel 2.3][ref2], en

      b. specifiek, als toepassing, bij een aanvraag of verzoek als bedoeld in het tweede lid van dat artikel.

      3 Het uitvoeren van een handeling of maatregel als bedoeld in het eerste lid die niet voorafgaand is
      gerechtvaardigd is verboden. Het verbod geldt niet voor een maatregel in een radiologische noodsituatie, indien een
      voorafgaande rechtvaardiging vanwege de vereiste spoed niet mogelijk is.

      4 Een handeling in een geplande blootstellingsituatie als bedoeld in het eerste lid, onder a, of in een bestaande
      blootstellingsituatie als bedoeld in dat lid, onder b, kan worden gerechtvaardigd indien de individuele of
      maatschappelijke voordelen van de handeling opwegen tegen de gezondheidsschade die deze kan veroorzaken.

      5 Maatregelen in blootstellingsituaties als bedoeld in het eerste lid, onder c, kunnen worden gerechtvaardigd
      indien deze meer individuele of maatschappelijke voordelen dan nadelen met zich brengen.

      6 Als criteria met betrekking tot de afweging van voordelen ten opzichte van de gezondheidsschade of andere
      nadelen, bedoeld in het vierde of vijfde lid, worden in ieder geval maatschappelijke, economische, sociale en
      ecologische effecten in beschouwing genomen en afgewogen ten opzichte van de gezondheidsschade die een beoogde
      handeling of maatregel met zich kan brengen. Bij regeling van Onze Ministers kunnen met het oog op een goede
      uitvoering nadere regels worden gesteld met betrekking tot de criteria en wijze van afweging. Voorts kunnen bij
      regeling van Onze Ministers regels worden gesteld omtrent de wijze waarop in een radiologische noodsituatie om
      rechtvaardiging van een maatregel kan worden verzocht.

      7 Onverminderd het [Warenwetbesluit Doorstraalde waren][ref3] worden handelingen waarbij de activering van
      materiaal een toename van de activiteit in een consumentenproduct tot gevolg heeft, die op het moment van het
      op de markt brengen vanuit het oogpunt van stralingsbescherming niet verwaarloosbaar is, niet gerechtvaardigd.
      In afwijking hiervan kan in specifieke gevallen een handeling worden gerechtvaardigd na een beoordeling door de
      Autoriteit overeenkomstig [artikel 2.3, tweede lid][ref4].


