  - number: '10.7'
    text: |-
      1 Een radioactieve stof kan door de Autoriteit of de ondernemer als radioactieve afvalstof worden aangemerkt,
      indien voor deze stof geen gebruik of product- of materiaalhergebruik is voorzien door de Autoriteit of door de
      ondernemer en er geen sprake is van lozing van de stof.

      2 Een afvalstof wordt niet als radioactieve afvalstof aangemerkt, indien de activiteitsconcentratie van die
      afvalstof lager is dan de desbetreffende bij of krachtens [artikel 3.20][ref1] of [3.21][ref2] vastgestelde
      vrijgavewaarde en [artikel 10.6, eerste lid][ref3], van toepassing is.

      3 Radioactieve afvalstoffen worden zo snel als redelijkerwijs mogelijk afgevoerd doch in ieder geval binnen een
      door de Autoriteit bij verordening of beschikking gestelde termijn.

      4 De in het derde lid gestelde verplichting geldt niet indien de radioactieve afvalstoffen een fysische
      halveringstijd hebben van minder dan 100 dagen en maximaal twee jaar worden opgeslagen in een daartoe geschikte
      ruimte met het oog op fysisch verval tot afvalstoffen met een activiteitsconcentratie van niet meer dan de in
      [artikel 10.6, eerste lid][ref4], bedoelde waarde.

      5 Het is verboden radioactieve afvalstoffen te mengen met het doel de activiteitsconcentratie van de stoffen
      beneden de desbetreffende ingevolge [paragraaf 3.3.2][ref5] vastgestelde vrijgavewaarden te brengen, als gevolg
      waarvan handelingen met deze radioactieve afvalstoffen niet meer onder de vergunningplicht of registratieplicht
      vallen.

      6 Het in het vijfde lid gestelde verbod geldt niet ten aanzien van radioactieve afvalstoffen afkomstig van
      handelingen met van nature voorkomende radionucliden, indien door de ondernemer ten genoegen van de Autoriteit
      wordt aangetoond dat het mengen geen groter gevaar, schade of hinder veroorzaakt dan in het geval deze radioactieve
      afvalstoffen niet zouden worden gemengd.

      7 De Autoriteit kan bij verordening nadere regels stellen met betrekking tot de technische en administratieve
      vereisten waaraan het aantonen als bedoeld in het zesde lid moet voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel3.20
