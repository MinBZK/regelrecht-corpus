  - number: '4.26'
    text: |-
      1 De Autoriteit inventariseert handelingen ten behoeve van niet-medische beeldvorming die leiden tot blootstelling.

      2 Bij de inventarisatie van handelingen waarbij medisch-radiologische apparatuur wordt gebruikt wordt in het
      bijzonder gelet op de volgende handelingen:

      a. radiologische keuringen, onder andere bij aanstelling, immigratie of verzekering;

      b. radiologisch onderzoek met betrekking tot de fysieke ontwikkeling van kinderen en adolescenten, met het oog op
      een loopbaan;

      c. radiologische leeftijdsbepaling;

      d. het gebruik van ioniserende straling voor het opsporen van verborgen voorwerpen in het menselijk lichaam.

      3 Bij de inventarisatie van handelingen waarbij geen medisch-radiologische apparatuur wordt gebruikt wordt in het
      bijzonder gelet op:

      a. gebruik van ioniserende straling voor het opsporen van verborgen voorwerpen aan of op het menselijk lichaam;

      b. het gebruik van ioniserende straling bij controles van vracht en laadruimten voor het opsporen van
      verstekelingen;

      c. het gebruik van ioniserende straling voor wettelijke of beveiligingsdoeleinden.

      4 Onverminderd [artikel 2.4][ref1] wordt elke procedure van individuele niet-medische beeldvorming gerechtvaardigd
      met inachtneming van de specifieke doelstellingen van die procedure en de kenmerken van de betrokken persoon.

      5 De generieke en specifieke rechtvaardiging van handelingen met blootstelling bij niet-medische beeldvorming kan
      worden herzien overeenkomstig [artikel 2.3][ref2].

      6 De omstandigheden voor blootstelling bij niet-medische beeldvorming worden regelmatig door de ondernemer
      geëvalueerd.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel2.4
      [ref2]: https://wetten.overheid.nl/BWBR0040179#Artikel2.3
