  - number: '3.17'
    text: |-
      1 [Afdeling 3.2][ref1] is niet van toepassing op handelingen binnen een locatie met radioactieve materialen:

      a. waarvan de totale activiteit van de radionucliden in de betrokken radioactieve stof niet hoger is dan de
      desbetreffende in [bijlage 3, onderdeel B, tabel B, kolom 3][ref2], opgenomen vrijstellingswaarde; of

      b. waarvan de activiteitsconcentratie van de radionucliden in de betrokken radioactieve stof niet hoger is dan:

      1°. de desbetreffende in [bijlage 3, onderdeel B, tabel A, deel 1][ref3] opgenomen vrijstellingswaarde voor
      kunstmatige radionucliden, of

      2°. de desbetreffende in [bijlage 3, onderdeel B, tabel A, deel 2][ref4] opgenomen vrijstellingswaarde voor van
      nature voorkomende radionucliden; of

      c. indien het handelingen met matige hoeveelheden, tot 1.000 kg, van elk type materiaal betreft, waarvan
      de activiteitsconcentratie van de radionucliden in de betrokken radioactieve stof niet hoger is dan de in
      [bijlage 3, onderdeel B, tabel B, kolom 2][ref5], opgenomen vrijstellingswaarden. Deze vrijstellingswaarden zijn
      van toepassing in plaats van de in onderdeel b bedoelde vrijstellingswaarden. Bij regeling van Onze Minister kunnen
      voor de toepassing van dit onderdeel lagere hoeveelheidsgrenzen worden vastgesteld dan het maximum van 1.000 kg; of

      d. waarvan de totale activiteit of activiteitsconcentratie van de radionucliden in de betrokken radioactieve stof
      niet hoger is dan de krachtens het vijfde lid of [artikel 3.19][ref6] vastgestelde vrijstellingswaarde die met de
      betrokken handeling is gemoeid.

      2 Indien radioactief materiaal:

      a. meerdere soorten kunstmatige radionucliden bevat, of

      b. meerdere soorten kunstmatige of van nature voorkomende radionucliden bevat waarvoor krachtens
      [artikel 3.19][ref7] een of meer specifieke vrijstellingswaarden zijn vastgesteld,

      wordt de activiteitsconcentratie van de radionucliden gewogen gesommeerd met overeenkomstige toepassing van
      [artikel 3.4, vijfde lid][ref8]. Aan de in het eerste lid, onderdeel b, c of d, bedoelde waarde wordt voldaan
      indien de uitkomst van de sommatie kleiner dan of gelijk is aan 1.

      3 Indien binnen een locatie op enig moment meerdere handelingen plaatsvinden, worden de activiteiten van de
      kunstmatige radionucliden in de bij die handelingen betrokken radioactieve materialen gewogen gesommeerd volgens
      de in het tweede lid bedoelde methode. Aan de in het eerste lid, aanhef en onderdeel a of d, bedoelde waarde wordt
      voldaan indien de uitkomst van de sommatie kleiner dan of gelijk is aan 1.

      4 Bij verordening van de Autoriteit kunnen handelingen waarbij radioactieve stoffen worden toegevoegd aan
      consumentenproducten, bestemd voor gebruik op of in de directe omgeving van personen, worden aangewezen:

      a. waarbij de aan deze producten toegevoegde radionucliden niet worden betrokken bij een sommatie als bedoeld in
      het tweede lid, en

      b. waarbij de aan deze producten toegevoegde radionucliden niet worden betrokken bij een sommatie als bedoeld in
      het derde lid.

      5 Bij regeling van Onze Minister kunnen, indien het belang van de stralingsbescherming zich daar niet tegen verzet:

      a. voor andere radionucliden dan bedoeld in het eerste lid, onderdeel a of b, vrijstellingswaarden op basis van
      de totale activiteit of activiteitsconcentratie worden vastgesteld en kunnen daarmee verbonden regels worden
      vastgesteld;

      b. vrijstellingswaarden voor handelingen met matige hoeveelheden van elk type materiaal voor andere radionucliden
      dan bedoeld in het eerste lid, onderdeel c, worden vastgesteld. De tweede en derde volzin van dat onderdeel zijn
      van toepassing.

      6 Bij verordening van de Autoriteit kunnen andere methoden dan bedoeld in het tweede of derde lid worden
      aangewezen voor het bepalen en toetsen van de gezondheidsschade in gevallen waarin de in het eerste lid bedoelde
      activiteitsconcentratie, in combinatie met de in dat lid bedoelde activiteit, geen juiste indicatie geeft van de
      gezondheidsschade die de bij de handeling betrokken radioactieve materialen kunnen veroorzaken.

      7 Bij de toepassing van het vierde, vijfde of zesde lid worden de algemene criteria, opgenomen in
      [bijlage 3, onderdeel A, onderdeel 3][ref9], in acht genomen en worden bij de beoordeling van de wenselijkheid van
      de vrijstelling de met het oog op stralingsbescherming relevante factoren in aanmerking genomen.

      8 Bij regeling van Onze Ministers kunnen nadere regels worden gesteld met betrekking tot de factoren, bedoeld in
      het zevende lid.

      9 Bij verordening van de Autoriteit kan:

      a. in afwijking van het eerste lid worden bepaald dat [afdeling 3.2][ref10] van toepassing is op bij die
      verordening aangewezen handelingen, indien deze een te hoog risico van blootstelling van werknemers of leden van de
      bevolking met zich brengen of kunnen brengen;

      b. in afwijking van [artikel 3.5][ref11] of [3.9][ref12] worden bepaald dat de in die artikelen opgenomen verboden
      niet van toepassing zijn op bij die verordening aangewezen handelingen die een beperkt risico van blootstelling van
      werknemers of leden van de bevolking met zich brengen of kunnen brengen.

      10 De vrijstelling, bedoeld in het eerste lid, is niet van toepassing op:

      a. het toedienen van radioactieve stoffen aan personen en, voor zover het de bescherming van mensen tegen
      ioniserende straling betreft, aan dieren voor het stellen van medische of veterinaire diagnoses;

      b. het toedienen van radioactieve stoffen aan personen en, voor zover het de bescherming van mensen tegen
      ioniserende straling betreft, aan dieren voor therapie of medisch of biomedisch onderzoek;

      c. het toevoegen van radioactieve stoffen aan consumentenproducten.


