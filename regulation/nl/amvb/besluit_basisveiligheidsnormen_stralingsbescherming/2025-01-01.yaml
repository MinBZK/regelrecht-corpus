  - number: '7.33'
    text: >-
      1 Met het oog op beroepsmatige blootstelling stelt de ondernemer de dosisbeperking vast als operationeel instrument
      voor optimalisatie van de bescherming van de werknemers.


      2 Voor externe werknemers wordt de dosisbeperking, bedoeld in het eerste lid, in samenspraak tussen de ondernemer
      en hun werkgever vastgesteld.


      3 Bij regeling van Onze Minister van Sociale Zaken en Werkgelegenheid kunnen nadere regels worden gesteld met
      betrekking tot het eerste lid, waaronder de methode ter bepaling van de dosisbeperking en de vaststelling van
      dosisbeperkingen voor de daarbij genoemde handelingen, functies of taken.
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel7.33
  - number: '7.34'
    text: |-
      1 De dosislimieten voor beroepsmatige blootstelling zijn van toepassing op de som van de beroepsmatige
      blootstelling van een werknemer bij elke geplande handeling, bij blootstelling aan radon als bedoeld in
      [artikel 7.38, zesde lid][ref1], en elke andere beroepsmatige blootstelling aan bestaande blootstellingsituaties.

      2 De ondernemer zorgt ervoor dat voor een blootgestelde werknemer ten gevolge van een handeling die onder zijn
      verantwoordelijkheid wordt verricht, de volgende doses niet worden overschreden:

      a. een effectieve dosis van 20 millisievert in een kalenderjaar, en met inachtneming daarvan:

      b. een equivalente dosis van:

      1°. 20 millisievert in een kalenderjaar voor de ooglens;

      2°. 500 millisievert in een kalenderjaar voor de huid, gemiddeld over enig blootgesteld huidoppervlak van 1 cm2; of

      3°. 500 millisievert in een kalenderjaar voor de extremiteiten.

      3 In geval van inwendige besmetting wordt de effectieve volgdosis toegewezen aan het jaar van inname.

      4 Indien een van de dosislimieten, genoemd in het tweede lid, overschreden wordt, rapporteert de ondernemer dit
      aan Onze Minister van Sociale Zaken en Werkgelegenheid of, indien het inrichtingen betreft waarvoor een vergunning
      krachtens [artikel 15, onder b, van de wet][ref2] is verleend, de Autoriteit of, indien het mijnbouw betreft, Onze
      Minister van Economische Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel7.38
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel7.34
