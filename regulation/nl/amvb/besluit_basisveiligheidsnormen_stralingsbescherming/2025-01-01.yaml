  - number: '2.6'
    text: >-
      1 Een ondernemer zorgt voor optimalisatie van de stralingsbescherming van individuele personen die beroepsmatige
      blootstelling of blootstelling als lid van de bevolking ondergaan of kunnen ondergaan.


      2 Optimalisatie als bedoeld in deze paragraaf is er op gericht de grootte van de effectieve of equivalente doses
      van individuele personen, de kans op het optreden van blootstelling en het aantal blootgestelde personen zo beperkt
      te houden als redelijkerwijs mogelijk is, rekening houdend met de actuele stand van de techniek en met economische
      en sociale factoren.


      3 Bij regeling van Onze Ministers kunnen met het oog op een goede uitvoering nadere regels worden gesteld ter
      uitwerking van het begrip: zo laag als redelijkerwijs mogelijk, rekening houdend met de actuele stand van de
      techniek en met economische en sociale factoren.
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel2.6
  - number: '2.7'
    text: |-
      1 Met het oog op blootstelling in geplande blootstellingsituaties zijn dosisbeperkingen, vastgesteld overeenkomstig
      de [hoofdstukken 7][ref1], [8][ref2] en [9][ref3], van toepassing.

      2 Een dosisbeperking in een geplande blootstellingsituatie, vastgesteld bij of krachtens dit besluit, heeft
      betrekking op de individuele effectieve of equivalente dosis voor een daarbij genoemde passende periode.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0040179#Hoofdstuk8
      [ref3]: https://wetten.overheid.nl/BWBR0040179#Hoofdstuk9
