      1 Rechtvaardiging, optimalisatie en dosislimitering van beroepsmatige blootstelling vinden onverminderd het
      bepaalde in [hoofdstuk 7][ref1] plaats overeenkomstig de [paragrafen 2.2][ref2], [2.3][ref3] en [2.4][ref4].

      2 Rechtvaardiging van medische blootstelling vindt onverminderd het bepaalde in [hoofdstuk 8][ref5] plaats
      overeenkomstig [paragraaf 2.2][ref6].

      3 Optimalisatie van medische blootstelling vindt uitsluitend plaats overeenkomstig het bepaalde in
