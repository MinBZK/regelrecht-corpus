  - number: '7.17'
    text: |-
      1 Er is een dosisregistratiesysteem voor individuele radiologische controle ten behoeve van het bewaren van
      de resultaten van de individuele monitoring, bepaald overeenkomstig de [artikelen 7.12][ref1], [7.13][ref2],
      [7.14][ref3] en [7.31][ref4].

      2 Onze Minister van Sociale Zaken en Werkgelegenheid wijst een instelling aan die belast is met het beheren van het
      in het eerste lid bedoelde systeem.

      3 De in het tweede lid bedoelde instelling bewaart de geregistreerde gegevens in ieder geval totdat de persoon op
      wie de gegevens betrekking hebben, de leeftijd van vijfenzeventig jaar heeft bereikt of zou hebben bereikt, maar
      ten minste dertig jaar nadat deze persoon de handelingen heeft beëindigd.

      4 Bij de verwerking van persoonsgegevens in het systeem als bedoeld in het eerste lid, maakt de instelling, bedoeld
      in het tweede lid, in voorkomend geval gebruik van het burgerservicenummer met het oog op de vaststelling van de
      identiteit van de persoon, bedoeld in het derde lid.

      5 Bij regeling van Onze Minister van Sociale Zaken en Werkgelegenheid kunnen nadere regels worden gesteld over de
      inrichting, toegankelijkheid, werkwijze en het beheer, waaronder wijziging van het gegevenssysteem.


