  - number: '4.20'
    text: >-
      1 De ondernemer zorgt ervoor dat ruimten en plaatsen waar handelingen met open bronnen worden verricht, de
      inrichting daarvan of daarin gebruikte voorwerpen, regelmatig volgens door hem schriftelijk vastgestelde procedures
      op basis van internationale normen worden gecontroleerd op besmetting.


      2 Bij verordening van de Autoriteit kunnen in het belang van de stralingsbescherming regels worden gesteld met
      betrekking tot de uitvoering van daarbij aangewezen handelingen met open bronnen, waaronder regels met betrekking
      tot de frequentie en de uitvoering van de controles, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel4.20
  - number: '4.21'
    text: |-
      1 Bij verordening van de Autoriteit kunnen in het belang van de stralingsbescherming regels worden gesteld met
      betrekking tot de uitvoering van daarbij aangewezen handelingen met van nature voorkomende radionucliden waarvoor
      op grond van [afdeling 3.2][ref1] een vergunning, registratie of kennisgeving is vereist.

      2 Bij verordening van de Autoriteit kunnen regels worden gesteld met betrekking tot het hergebruik van producten
      of materialen of de opslag van afval afkomstig van handelingen met van nature voorkomende radionucliden, voor
      categorieën van gevallen waarin de activiteitsconcentratie van de betrokken van nature voorkomende radionucliden
      hoger is dan de desbetreffende krachtens [artikel 3.20][ref2] of [3.21][ref3] vastgestelde vrijgavewaarde.


