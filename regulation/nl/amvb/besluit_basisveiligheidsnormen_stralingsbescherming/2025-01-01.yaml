  - number: '6.9'
    text: >-
      Bij een ongeval of radiologische noodsituatie binnen zijn locatie zorgt de ondernemer ervoor dat, indien een lid
      van de bevolking binnen of buiten die locatie, ten gevolge daarvan is of kan worden blootgesteld, individuele
      monitoring wordt uitgevoerd of dat de effectieve of equivalente doses die door de betrokken persoon zijn ontvangen
      op een andere passende wijze worden bepaald.
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel6.9
  - number: '6.10'
    text: |-
      1 Onze Ministers die het aangaat stellen regels met betrekking tot het uitvoeren van interventies, bedoeld in
      [artikel 6.11][ref1], en passende beschermingsmaatregelen.

      2 Bij het vaststellen van regels als bedoeld in het eerste lid wordt rekening gehouden met de feitelijke kenmerken
      van het ongeval of de radiologische noodsituatie. De regels zijn voorts in overeenstemming met de geoptimaliseerde
      beschermingsstrategie die deel uitmaakt van het nationale crisisplan, bedoeld in [artikel 6.5][ref2].

      3 In geval van een ongeval of radiologische noodsituatie binnen of buiten het Nederlandse grondgebied nemen
      de ondernemer, het bestuur van de veiligheidsregio en Onze in het eerste lid bedoelde Ministers, passende
      beschermingsmaatregelen overeenkomstig het toepasselijke nationale crisisplan. Daarbij wordt rekening
      gehouden met de feitelijke kenmerken van het ongeval of de radiologische noodsituatie en de geoptimaliseerde
      beschermingsstrategie, opgenomen in het nationale crisisplan.

      4 Degene onder wiens verantwoordelijkheid een interventie wordt verricht, zorgt ervoor dat de gevolgen en de
      doeltreffendheid van een interventie worden beoordeeld en geregistreerd.

      5 Onze in het eerste lid bedoelde Ministers zorgen voor de organisatie van de medische behandeling van personen die
      getroffen zijn door het ongeval of de radiologische noodsituatie.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel6.11
      [ref2]: https://wetten.overheid.nl/BWBR0040179#Artikel6.5
