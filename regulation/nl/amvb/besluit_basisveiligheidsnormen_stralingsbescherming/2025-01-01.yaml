  - number: '3.23'
    text: >-
      1 Het verdunnen of mengen van radioactieve stoffen of materialen met andere niet-radioactieve stoffen of materialen
      met het doel de radioactieve stoffen of materialen onder de desbetreffende vrijstellingswaarde of vrijgavewaarde te
      brengen, is verboden.


      2 Het verbod, bedoeld in het eerste lid, geldt niet voor verdunning of vermenging van stoffen of materialen bij een
      normale bedrijfsvoering bij processen waarbij radioactiviteit geen rol speelt.


      3 Bij beschikking of verordening van de Autoriteit kan voor specifieke omstandigheden de verdunning of vermenging
      van radioactieve stoffen of materialen met niet-radioactieve stoffen of materialen worden toegestaan met het oog op
      hergebruik of recycling.
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel3.23
  - number: '3.24'
    text: |-
      1 Krachtens [paragraaf 3.3.1][ref1], [3.3.2][ref2] of [10.2][ref3] vrijgestelde of vrijgegeven bronnen of
      handelingen omvatten mede bronnen en handelingen behorend tot een categorie als genoemd in het tweede of derde lid.

      2 Aanwijsinstrumenten als bedoeld in [artikel 4.24][ref4] waaraan uitsluitend H-3 in lichtcellen of
      Pm-147 in lichtgevende verf wordt, respectievelijk is, toegevoegd voor verlichtingsdoeleinden, en
      waarvan het aanwijsinstrument in totaal een lagere activiteit bevat dan de desbetreffende krachtens
      [artikel 3.17, eerste lid, onder a][ref5], vastgestelde waarde voor H-3, respectievelijk Pm-147, en er per locatie
      op enig moment niet meer dan 500 aanwijsinstrumenten voorhanden zijn.

      3 Overige onder a tot en met d genoemde handelingen of blootstellingsituaties:

      a. menselijke activiteiten met:

      1°. radioactieve stoffen of radioactief materiaal dat afkomstig is van lozingen waarvoor krachtens
      [artikel 10.3][ref6] of [10.4][ref7] een vergunning is vereist, of

      2°. radioactieve stoffen of radioactief materiaal, vrijgesteld of vrijgegeven overeenkomstig afdeling 3.3;

      b. het lozen van radioactieve stoffen in de bodem als bedoeld in [artikel 10.5, tweede lid][ref8], wanneer de
      in een kalenderjaar totaal geloosde hoeveelheid radioactieve stoffen bij het verlaten van het lozingspunt minder
      bedraagt dan 10-6 RE als bedoeld in [bijlage 2][ref9];

      c. het lozen van productiewater bij mijnbouw als bedoeld in [artikel 10.5, derde lid][ref10], indien dit geschiedt
      door middel van injecteren naar een soortgelijke bodemformatie en diepte als waaruit het water afkomstig is en op
      een zodanige wijze dat het water niet in andere watervoerende lagen terechtkomt;

      d. handelingen met materialen die van nature voorkomende radionucliden bevatten, welke het resultaat zijn van het
      mengen van radioactieve afvalstoffen als bedoeld in [artikel 10.7, zesde lid][ref11].


