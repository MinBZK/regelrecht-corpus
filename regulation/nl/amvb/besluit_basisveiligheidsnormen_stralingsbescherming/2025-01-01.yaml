  - number: '12.8'
    text: |-
      1 Met ingang van het tijdstip van inwerkingtreding van dit besluit geldt een werkzaamheid als bedoeld in
      [artikel 101 van het Besluit stralingsbescherming][ref1] als een handeling met natuurlijke bronnen als bedoeld in
      [artikel 1.2][ref2] juncto [bijlage 1][ref3].

      2 Met ingang van het tijdstip van inwerkingtreding van dit besluit geldt een lijst van werkzaamheden als bedoeld
      in [artikel 102, eerste lid, van het Besluit stralingsbescherming][ref4] als een aanwijzing als bedoeld in
      [artikel 3.2][ref5].

      3 Met ingang van het tijdstip van inwerkingtreding van dit besluit geldt een melding als bedoeld in
      [artikel 103, eerste lid, van het Besluit stralingsbescherming][ref6] als een kennisgeving als bedoeld in
      [artikel 3.11, eerste lid][ref7], en een melding als bedoeld in artikel 103, zesde lid, van het Besluit
      stralingsbescherming als een kennisgeving als bedoeld in artikel 3.11, vijfde lid.

      4 Met ingang van het tijdstip van inwerkingtreding van dit besluit geldt een melding als bedoeld
      in [artikel 104 van het Besluit stralingsbescherming][ref8] als een kennisgeving als bedoeld in
      [artikel 3.6, achtste lid][ref9], [3.9, tweede lid][ref10], of [3.11, vijfde lid][ref11].

      5 Met ingang van het tijdstip van inwerkingtreding van dit besluit geldt een vergunning verleend krachtens
      [artikel 107, eerste lid][ref12], of [108, eerste lid, van het Besluit stralingsbescherming][ref13], of een
      aanvraag daartoe:

      a. indien betrekking hebbend op een handeling behorend tot een categorie als genoemd in [artikel 3.8][ref14], als
      een vergunning verleend krachtens [artikel 3.5][ref15] of een aanvraag als bedoeld in dat artikel;

      b. indien betrekking hebbend op een handeling behorend tot een categorie als genoemd in [artikel 3.10][ref16] als
      een registratie verleend krachtens [artikel 3.9][ref17] of een aanvraag als bedoeld in dat artikel.

      6 Met ingang van het tijdstip van inwerkingtreding van dit besluit geldt het aantonen als bedoeld in
      [artikel 110a, tweede lid, van het Besluit stralingsbescherming][ref18] als het aantonen als bedoeld in
      [artikel 10.7, zesde lid][ref19].

      7 Met ingang van het tijdstip van inwerkingtreding van dit besluit geldt een methode als bedoeld in
      [artikel 111, onderdeel b, van het Besluit stralingsbescherming][ref20] als een methode als bedoeld in
      [artikel 7.5, tweede lid, onder b][ref21].


