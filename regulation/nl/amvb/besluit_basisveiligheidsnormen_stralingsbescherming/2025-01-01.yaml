        artikel: '5.11'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: '5.9'
    text: |-
      1 Bij regeling van Onze Minister kunnen soorten ondernemingen of locaties waar zeer diverse of omvangrijke
      handelingen worden uitgevoerd of handelingen die een uitgebreide bescherming tegen ioniserende straling vereisen
      worden aangewezen, waarin de aanwezigheid van een stralingsbeschermingseenheid is vereist, waarin tevens
      een stralingsbeschermingsdeskundige van een krachtens [artikel 5.5][ref1] vereist niveau van deskundigheid
      beschikbaar is. Daartoe behoren in elk geval gevallen waarin op grond van [artikel 3.4, vierde lid][ref2], een
      complexvergunning is vereist. Bij de regeling kunnen nadere regels worden gesteld met betrekking tot de taken,
      bevoegdheden en werkwijze van een stralingsbeschermingseenheid als bedoeld in het tweede tot en met vierde lid, het
      op peil blijven van de expertise van de eenheid en de taken van de stralingsbeschermingsdeskundige in die eenheid.

      2 Indien op grond van het eerste lid de aanwezigheid van een stralingsbeschermingseenheid is vereist, zorgt de
      ondernemer ervoor dat deze operationeel is en dat in ieder geval:

      a. daarbij een stralingsbeschermingsdeskundige aanwezig of beschikbaar is en daarin voldoende ondersteunend
      personeel werkzaam is;

      b. daarin het krachtens [artikel 5.5][ref3] vereiste niveau van deskundigheid met betrekking tot
      stralingsbescherming aanwezig is;

      c. de stralingsbeschermingseenheid functioneel en organisatorisch gescheiden is van productie- en technische
      eenheden;

      d. de stralingsbeschermingseenheid aan hem adviezen verstrekt met betrekking tot de bescherming tegen ioniserende
      straling, en

      e. de stralingsbeschermingsdeskundige in die afdeling toestemming geeft voor een handeling.

      3 Bij beschikking van de Autoriteit kan worden toegestaan dat een stralingsbeschermingseenheid
      als bedoeld in het eerste lid voor meerdere ondernemers taken verricht. Met
      toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref4] is
      [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref5] niet van toepassing op de aanvraag om een beschikking
      als bedoeld in de eerste volzin.

      4 Een stralingsbeschermingseenheid kan de taken van een toezichthoudend medewerker stralingsbescherming verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel5.5
