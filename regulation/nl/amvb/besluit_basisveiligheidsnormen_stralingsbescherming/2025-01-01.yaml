    text: |-
      1 Afdeling 3.2 is van toepassing op handelingen, maatregelen of blootstellingsituaties waarvoor op grond van
      [artikel 3.11, eerste of derde lid][ref1], een verplichting tot kennisgeving geldt.

      2 Afdeling 3.2 is niet van toepassing voor zover een vrijstelling overeenkomstig [paragraaf 3.3.1][ref2]
      of [paragraaf 10.2][ref3] dan wel een vrijgave overeenkomstig [paragraaf 3.3.2][ref4] van toepassing is, en
      wordt voldaan aan de bij of krachtens [de wet][ref5] met het oog op stralingsbescherming gestelde regels en
      voorschriften.

      3 Afdeling 3.2 is niet van toepassing voor zover het een situatie betreft waarbij het gaat om blootstelling van
      vliegtuigbemanning veroorzaakt door kosmische straling als bedoeld in [artikel 7.5][ref6], en wordt voldaan aan de
      bij of krachtens [de wet][ref7] met het oog op stralingsbescherming gestelde regels en voorschriften.


