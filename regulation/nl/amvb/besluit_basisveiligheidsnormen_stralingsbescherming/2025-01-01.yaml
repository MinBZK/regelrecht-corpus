  - number: '4.12'
    text: |-
      [Artikel 4.10, tweede, zesde en zevende lid, onderdelen a en c][ref1], en
      [artikel 4.11, eerste tot en met derde lid][ref2], zijn van overeenkomstige toepassing op de ondernemer die een
      handeling verricht met een hoogactieve bron, met dien verstande dat voor «fabrikant» en «leverancier» steeds wordt
      gelezen: ondernemer.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel4.10
