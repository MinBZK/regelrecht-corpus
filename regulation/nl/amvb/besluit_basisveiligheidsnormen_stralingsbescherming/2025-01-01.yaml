  - number: '8.11'
    text: >-
      1 De verwijzende persoon of de medisch deskundige informeert bij een vrouw die een medische blootstelling ondergaat
      of zij zwanger is of borstvoeding geeft, tenzij dat om duidelijke redenen kan worden uitgesloten of niet relevant
      is voor de radiologische procedure.


      2 Indien zwangerschap niet kan worden uitgesloten, wordt afhankelijk van de medisch-radiologische procedure en met
      name wanneer het gaat om de buik- en bekkenstreek, bijzondere aandacht geschonken aan:


      a. de rechtvaardiging van de blootstelling, met name in verband met de urgentie van het uitvoeren van de procedure;


      b. de optimalisatie van de stralingsbescherming, waarbij rekening wordt gehouden met zowel de vrouw als met het
      ongeboren kind.


      3 Indien de vrouw die een medische blootstelling ondergaat borstvoeding geeft, wordt in de nucleaire geneeskunde
      bijzondere aandacht geschonken aan:


      a. de rechtvaardiging van de blootstelling, met name in verband met de urgentie van het uitvoeren van de procedure;


      b. de optimalisatie van de stralingsbescherming, waarbij rekening wordt gehouden met zowel de vrouw als met het
      kind.


      4 De ondernemer neemt maatregelen die bijdragen tot bewustmaking van de vrouwen, bedoeld in het eerste lid, over
      medische blootstellingen als bedoeld in dit artikel.
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel8.11
  - number: '8.12'
    text: >-
      1 De ondernemer draagt ervoor zorg dat:


      a. alle redelijke maatregelen worden genomen om de waarschijnlijkheid en de omvang van toevallige of onbedoelde
      blootstellingen van personen die medische blootstelling ondergaan tot een minimum te beperken;


      b. bij radiotherapeutische handelingen het programma voor kwaliteitsborging een onderzoek naar het risico van
      toevallige of onbedoelde blootstellingen bevat;


      c. voor alle medische blootstellingen een passend systeem wordt ingevoerd ten behoeve van de registratie en analyse
      van gebeurtenissen die tot toevallige of onbedoelde blootstellingen leiden of kunnen leiden, dat in verhouding
      staat tot het radiologische risico van de handeling;


      d. maatregelen worden getroffen om de verwijzende persoon en de medisch deskundige alsmede de patiënt of zijn
      vertegenwoordiger in te lichten over een klinisch significante toevallige of onbedoelde blootstelling en over de
      resultaten van de analyse.


      2 Voorts draagt de ondernemer ervoor zorg dat de Inspectie gezondheidszorg en jeugd:


      a. zo spoedig mogelijk op de hoogte wordt gebracht van significante gebeurtenissen;


      b. binnen redelijke termijn na de gebeurtenissen op de hoogte wordt gebracht van de onderzoeksresultaten en de
      genomen maatregelen om dergelijke gebeurtenissen in de toekomst te vermijden.


      3 De Inspectie gezondheidszorg en jeugd publiceert tijdig informatie als bedoeld in artikel 63, onderdeel f, van
      de richtlijn.
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel8.12
  - number: '8.13'
    text: >-
      1 Onze Minister van Volksgezondheid, Welzijn en Sport draagt zorg voor de verdeling van individuele
      dosisschattingen als gevolg van medische blootstelling voor radiodiagnostiek en interventieradiologie. Indien
      nodig, wordt rekening gehouden met de leeftijdsverdeling en het geslacht van de blootgestelde populatie.


      2 Een ondernemer verstrekt aan Onze Minister van Volksgezondheid, Welzijn en Sport desgevraagd de gegevens die
      noodzakelijk zijn om de verdeling van individuele dosisschattingen als gevolg van medische blootstellingen voor
      radiodiagnostiek en interventieradiologie te bepalen.
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel8.13
  - number: '8.14'
    text: >-
      1 De ondernemer draagt ervoor zorg dat:


      a. schriftelijke protocollen worden uitgewerkt voor elk soort standaard medisch-radiologische procedure, voor elke
      apparatuuropstelling en voor relevante categorieën patiënten;


      b. informatie over de blootstelling van de patiënt deel uitmaakt van het verslag over de medisch-radiologische
      procedure;


      c. passende controle wordt uitgevoerd en zo nodig passende maatregelen worden getroffen bij een stelselmatige
      overschrijding van de diagnostische referentieniveaus;


      d. klinische audits plaatsvinden in overeenstemming met de nationale procedures.


      2 Voorts draagt de ondernemer ervoor zorg dat een klinisch fysicus:


      a. nauw wordt betrokken bij radiotherapeutische handelingen, met uitzondering van standaard therapeutische
      nucleairgeneeskundige handelingen;


      b. wordt betrokken bij standaard therapeutische nucleairgeneeskundige handelingen, alsmede radiodiagnostische en
      interventieradiologische handelingen met hoge doses;


      c. wordt betrokken voor advies over aangelegenheden betreffende stralingsbescherming in verband met medische
      blootstelling bij overige medisch-radiologische handelingen.


      3 Onze Minister van Volksgezondheid, Welzijn en Sport, draagt zorg voor de beschikbaarstelling van
      verwijzingsrichtsnoeren voor medische beeldvorming aan verwijzende personen, waarbij rekening is gehouden met
      stralingsdoses.


      4 Na de klinische audit, bedoeld in het eerste lid, onderdeel d, worden, indien nodig, de betreffende handelingen
      gewijzigd of worden nieuwe normen toegepast.
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel8.14
  - number: '8.15'
    text: >-
      De ondernemer draagt ervoor zorg dat:


      a. op alle radiologische apparatuur die in gebruik is streng toezicht wordt uitgeoefend inzake de
      stralingsbescherming;


      b. voor elke medisch-radiologische instelling een bijgewerkte inventaris van medisch-radiologische apparatuur ter
      beschikking wordt gehouden van de Autoriteit en van de Inspectie gezondheidszorg en jeugd;


      c. passende programma’s voor kwaliteitsborging en evaluaties van doses en toegediende hoeveelheden worden
      toegepast;


      d. acceptatietests worden uitgevoerd voor de ingebruikneming van de apparatuur voor klinische doeleinden en daarna
      periodiek en na elke onderhoudsprocedure die de werking kan aantasten prestatietests worden uitgevoerd;


      e. de nodige maatregelen worden getroffen om de werking van medisch-radiologische apparatuur te verbeteren die
      in gebruik is en die niet voldoet aan bij regeling van Onze Minister voor Medische Zorg gestelde eisen aan het
      functioneren van die apparatuur;


      f. apparatuur voor uitwendige bestraling met een nominale stralingsenergie van meer dan 1 mega-elektronvolt is
      voorzien van een voorziening om de belangrijkste behandelingsparameters te controleren;


      g. alle voor interventieradiologie gebruikte apparatuur is voorzien van een voorziening of een functie die
      de medisch deskundige en de personen die onderdelen van de medische procedures uitvoeren, informeert over de
      hoeveelheid straling die door de apparatuur tijdens de procedure wordt uitgezonden;


      h. alle voor interventieradiologie en computertomografie gebruikte apparatuur en nieuwe apparatuur voor planning,
      sturing en verificatiedoeleinden zijn voorzien van een voorziening of een functie die de medisch deskundige aan
      het einde van de procedure informeert over de relevante parameters voor het bepalen van de patiëntdosis en die deze
      informatie doorstuurt naar het onderzoeksdossier;


      i. onverminderd het bepaalde in de onderdelen g en h, nieuwe medische radiodiagnostische apparatuur die ioniserende
      straling uitzendt, is voorzien van een voorziening of functie die de medisch deskundige in staat stelt de voor het
      bepalen van de patiëntdosis relevante parameters te kennen en die, indien nodig, deze informatie doorstuurt naar
      het onderzoeksdossier;


      j. geen gebruik gemaakt wordt van fluoroscopie-apparatuur zonder voorziening voor de automatische regeling van het
      dosistempo of zonder beeldversterker, dan wel van een soortgelijk toestel.
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel8.15
  - number: '8.16'
    text: >-
      1 De ondernemer draagt ervoor zorg dat passende medisch-radiologische apparatuur, technieken en randapparatuur
      worden gebruikt voor medische blootstellingen:


      a. van kinderen;


      b. in het kader van een bevolkingsonderzoek;


      c. waarbij de patiënt hoge doses krijgt toegediend.


      2 Bij de blootstellingen, bedoeld in het eerste lid, wordt bijzondere aandacht besteed aan de programma’s voor
      kwaliteitsborging en de evaluatie of verificatie van doses en toegediende hoeveelheden activiteit voor deze
      handelingen.
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel8.16
  - number: '8.17'
    text: >-
      Onze Minister van Volksgezondheid, Welzijn en Sport kan regels stellen om onnodige verspreiding van medisch-
      radiologische apparatuur te voorkomen.
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel8.17
  - number: '9.1'
    text: |-
      1 Dosislimieten voor blootstelling van leden van de bevolking als bedoeld in het tweede of derde lid hebben
      betrekking op de som van de jaarlijkse blootstellingen van een lid van de bevolking ten gevolge van alle ingevolge
      dit besluit toegestane handelingen.

      2 Voor blootstelling van leden van de bevolking geldt een individuele effectieve dosislimiet van 1 millisievert in
      een kalenderjaar.

      3 Naast de dosislimiet, bedoeld in het tweede lid, gelden de volgende individuele equivalente dosislimieten:

      a. een equivalente dosislimiet van 15 millisievert in een kalenderjaar voor de ooglens;

      b. een equivalente dosislimiet van 50 millisievert in een kalenderjaar voor de huid, gemiddeld over enig
      huidoppervlak van 1 cm2 en ongeacht welk deel van de huid is blootgesteld.

      4 In het geval van besmetting die leidt tot inwendige blootstelling wordt de effectieve volgdosis toegewezen aan
      het jaar van inname.

      5 Dit artikel is niet van toepassing ten aanzien van personen, voor zover zij hulp en bijstand verlenen als bedoeld
      in [artikel 7.37][ref1] of [9.9][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel7.37
      [ref2]: https://wetten.overheid.nl/BWBR0040179#Artikel9.9
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel9.1
