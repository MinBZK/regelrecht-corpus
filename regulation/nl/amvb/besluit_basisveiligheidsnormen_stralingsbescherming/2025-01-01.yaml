  - number: '4.22'
    text: |-
      1 Een ondernemer die consumentenproducten wil vervaardigen of deze binnen Nederlands grondgebied brengt of doet
      brengen, waarvan het beoogde gebruik kan leiden tot een nieuwe categorie of soort handelingen, verstrekt aan de
      Autoriteit de met het oog op rechtvaardiging benodigde gegevens met betrekking tot:

      a. het beoogde gebruik van het consumentenproduct;

      b. de technische kenmerken van het consumentenproduct;

      c. de middelen om de bron vast te zetten in geval van consumentenproducten die radioactieve stoffen bevatten;

      d. dosistempo’s op relevante afstanden voor het gebruik van het consumentenproduct, met inbegrip van dosistempo’s
      op 0,1 m van enig toegankelijk oppervlak, en

      e. de verwachte doses voor regelmatige gebruikers van het product.

      2 Bij de beoordeling met het oog op rechtvaardiging wordt in het bijzonder gelet op de vereisten dat:

      a. de prestaties van het consumentenproduct het beoogde gebruik ervan rechtvaardigen;

      b. het ontwerp volstaat om blootstellingen bij normaal gebruik en de kans op en de gevolgen van misbruik of
      toevallige blootstellingen te minimaliseren, dan wel of voorwaarden moeten worden opgelegd met betrekking tot de
      technische en fysieke eigenschappen van het product;

      c. het consumentenproduct qua ontwerp voldoet aan de vrijstellingscriteria, bedoeld in [paragraaf 3.3.1][ref1],
      en in voorkomend geval, of het van een erkend type is en geen specifieke voorzorgsmaatregelen vereist zijn voor de
      verwijdering ervan wanneer het niet langer in gebruik is, en

      d. het consumentenproduct van een correct etiket is voorzien en er passende documentatie aan de klant is verstrekt
      met instructies voor een correct gebruik en verwijdering.

      3 Indien een verzoek met gegevens als bedoeld in het eerste lid is ontvangen wordt dit door de Autoriteit
      medegedeeld aan de bevoegde autoriteiten van de overige lidstaten van de Europese Unie. Op verzoek wordt voorts
      mededeling gedaan van de beslissing omtrent rechtvaardiging en de daaraan ten grondslag liggende redenen.

      4 Het aan consumenten verkopen of ter beschikking stellen van consumentenproducten waarvan het gebruik niet
      is gerechtvaardigd of die niet of niet langer voldoen aan de voorwaarden voor vrijstelling als bedoeld in
      [paragraaf 3.3.1][ref2] is verboden.

      5 Bij verordening van de Autoriteit kunnen nadere regels worden gesteld met betrekking tot vereisten voor
      handelingen met gerechtvaardigde consumentenproducten als bedoeld in het tweede lid. Daartoe kunnen in elk geval
      behoren regels met betrekking tot het gebruik en de verwijdering van die producten.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0040179#Hoofdstuk3
