  - number: '11.6'
    text: |-
      1 Degene die handelingen verricht voldoet aan nadere eisen ter zake van de bij of krachtens dit besluit gestelde
      regels.

      2 Nadere eisen die uitsluitend betrekking hebben op de bescherming van werknemers tegen ioniserende straling ten
      gevolge van handelingen worden gesteld:

      a. indien het mijnbouw betreft: door Onze Minister van Economische Zaken;

      b. indien het een inrichting betreft, waarvoor een vergunning krachtens [artikel 15, onder b, van de wet][ref1] is
      verleend, door de Autoriteit;

      c. indien het andere handelingen betreft: door een daartoe door Onze Minister van Sociale Zaken en Werkgelegenheid
      aangewezen ambtenaar.

      3 Nadere eisen die geen betrekking hebben op de bescherming van werknemers tegen ioniserende straling ten gevolge
      van handelingen worden gesteld:

      a. door de Autoriteit, of

      b. voor zover het de onder hem ressorterende belangen betreft: door Onze Minister van Volksgezondheid, Welzijn en
      Sport, of

      c. indien het mijnbouw op het continentaal plat betreft: door Onze Minister van Economische Zaken.

      4 Nadere eisen die zowel de in het tweede als in het derde lid bedoelde belangen betreffen, worden gesteld door de
      in die leden genoemde bestuursorganen gezamenlijk.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel11.6
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: '11.7'
    text: |-
      1 In bijzondere gevallen kan Onze Minister, Onze Minister van Sociale Zaken en Werkgelegenheid, Onze Minister van
      Volksgezondheid, Welzijn en Sport, de Autoriteit, Onze Minister van Defensie indien het de krijgsmacht betreft,
      of Onze Minister van Economische Zaken indien het mijnbouw betreft, ontheffing verlenen van het bepaalde bij
      of krachtens [hoofdstuk 3][ref1], voor zover betrekking hebbend op blootstelling aan natuurlijke bronnen, of
      [hoofdstuk 4][ref2], [5][ref3], [7][ref4], [8][ref5], [9][ref6] of [10][ref7].

      2 Aan de ontheffing kunnen voorschriften worden verbonden.

      3 Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref8] is
      [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref9] niet van toepassing op de aanvraag om een ontheffing.


