  - number: '7.13'
    text: |-
      1 Onze Minister van Sociale Zaken en Werkgelegenheid of, indien het inrichtingen betreft waarvoor een vergunning
      krachtens [artikel 15, onder b, van de wet][ref1] is verleend, de Autoriteit of, indien het mijnbouw betreft,
      Onze Minister van Economische Zaken, een door Onze Minister van Defensie aan te wijzen autoriteit, kan, indien
      het meten van blootstelling aan ioniserende straling aan de hand van het persoonlijk controlemiddel, bedoeld in
      [artikel 7.12, eerste lid][ref2], niet of niet goed mogelijk is of als de effectieve of equivalente dosis op andere
      passende wijze wordt bepaald, ontheffing verlenen van het bepaalde in artikel 7.12.

      2 Aan de ontheffing, bedoeld in het eerste lid, worden voorschriften verbonden die inhouden dat de effectieve of
      equivalente dosis geschat wordt aan de hand van de individuele metingen bij andere blootgestelde werknemers, of aan
      de hand van de zonemonitoring, bedoeld in [artikel 7.10][ref3], of in het geval van een vliegtuigbemanning op een
      wijze als bedoeld in [artikel 7.5][ref4].


