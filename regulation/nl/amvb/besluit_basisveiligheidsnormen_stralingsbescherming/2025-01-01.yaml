  - number: '6.15'
    text: |-
      1 De Autoriteit in overeenstemming met Onze Minister die het aangaat is belast met het inventariseren van
      mogelijke bestaande blootstellingsituaties met een blootstelling die niet veronachtzaamd kan worden vanuit het
      oogpunt van stralingsbescherming, alsmede het bepalen van die blootstelling. Hij kan daartoe gebruik maken van het
      monitoringprogramma, bedoeld in [artikel 6.24][ref1].

      2 Bij de inventarisatie wordt rekening gehouden met alle mogelijke bestaande blootstellingsituaties, genoemd in
      [bijlage 7][ref2].

      3 Bij regeling van Onze Minister en Onze Minister die het mede aangaat kunnen specifieke gevallen of specifieke
      categorieën van bestaande blootstellingsituaties met een blootstelling lager dan 1 millisievert in een kalenderjaar
      worden aangewezen die niet veronachtzaamd kunnen worden.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel6.24
      [ref2]: https://wetten.overheid.nl/BWBR0040179
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel6.15
    references:
      - id: ref1
        bwb_id: BWBR0040179
        artikel: '6.24'
        hoofdstuk: '6'
        afdeling: '6.4'
      - id: ref2
        bwb_id: BWBR0040179
  - number: '6.16'
    text: |-
      1 Indien uit de inventarisatie, bedoeld in [artikel 6.15, eerste lid][ref1], aannemelijk wordt of vast komt
      te staan dat sprake is van een of meer bestaande blootstellingsituaties waarvoor vanuit het oogpunt van de
      stralingsbescherming bezorgdheid bestaat, stelt Onze Minister in overeenstemming met Onze Minister die het mede
      aangaat een programma van maatregelen vast, om deze blootstellingsituaties te beoordelen en de blootstelling te
      bepalen.

      2 [Artikel 6.15, tweede lid][ref2], is van overeenkomstige toepassing.

      3 De Autoriteit is belast met de gecoördineerde voorbereiding, het opstellen en het mede uitvoeren van een
      programma als bedoeld in het eerste lid.

      4 In geval van een bestaande blootstellingsituatie als bedoeld in het eerste lid kunnen Onze in dat lid bedoelde
      Ministers, gelet op het risico en het vereiste van rechtvaardiging, bedoeld in de [paragrafen 2.1][ref3] en
      [2.2][ref4], besluiten dat die blootstellingsituatie geen grond is voor het nemen van beschermingsmaatregelen of
      remediëringsmaatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel6.15
