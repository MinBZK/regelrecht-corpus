  - number: '7.15'
    text: |-
      1 Er zijn een of meer dosimetrische diensten die tot taak hebben:

      a. het bepalen van de inwendige of uitwendige doses voor blootgestelde werknemers die een individuele monitoring
      ondergaan;

      b. het verstrekken van persoonlijke dosiscontrolemiddelen als bedoeld in [artikel 7.12, eerste lid][ref1], en het,
      door het uitlezen van deze persoonlijke dosiscontrolemiddelen bepalen in welke mate de betreffende werknemers aan
      ioniserende straling blootgesteld zijn geweest.

      2 De taak, bedoeld in het eerste lid, wordt alleen verricht door een dienst die als zodanig is erkend door
      de Autoriteit. Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref2] is
      [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref3] niet van toepassing op de aanvraag om erkenning als
      bedoeld in de eerste volzin.

      3 Bij regeling van Onze Minister van Sociale Zaken en Werkgelegenheid worden eisen vastgesteld met betrekking tot
      de kwaliteit van de dienstverlening, de werkwijze en deskundigheid van de dienst, waaraan moet worden voldaan om
      krachtens het tweede lid te kunnen worden erkend.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel7.12
      [ref2]: https://wetten.overheid.nl/BWBR0026759#Artikel28
