  - number: '7.32'
    text: |-
      1 De ondernemer zorgt ervoor dat een werknemer voor wie een ontheffing als bedoeld in [artikel 7.31][ref1] is
      verleend, indien ten gevolge van de in dat artikel bedoelde blootstelling een van de dosislimieten, genoemd in
      [artikel 7.34][ref2], is overschreden, niet eerder weer aan ioniserende straling ten gevolge van een handeling die
      onder zijn verantwoordelijkheid wordt verricht, wordt blootgesteld dan nadat door de arbodienst, in samenspraak met
      de stralingsarts, is verklaard dat daartegen geen bezwaar bestaat.

      2 Tenzij de arbodienst, in samenspraak met de stralingsarts, hiertoe op grond van dringende medische redenen
      adviseert, wordt de werknemer niet vanwege de in het eerste lid bedoelde overschrijding van een dosislimiet zonder
      diens toestemming van zijn normale beroepsbezigheden uitgesloten of op een andere plaats te werk gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel7.31
      [ref2]: https://wetten.overheid.nl/BWBR0040179#Artikel7.34
