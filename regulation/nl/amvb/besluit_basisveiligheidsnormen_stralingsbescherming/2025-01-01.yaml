  - number: '5.3'
    text: >-
      1 Onze Ministers in overeenstemming met Onze Minister die het mede aangaat zorgen ervoor dat lokaal en nationaal
      informatie beschikbaar is over:


      a. de blootstelling aan radon in woningen en andere gebouwen en de bijbehorende gezondheidsrisico’s;


      b. over het belang van radonmetingen, en


      c. over de beschikbare technische middelen om bestaande radonconcentraties terug te dringen.


      2 De Autoriteit is belast met de gecoördineerde voorbereiding en uitvoering van de verplichtingen, bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel5.3
  - number: '5.4'
    text: |-
      1 Ten aanzien van de stralingsbeschermingsdeskundige zijn naast de algemene bepalingen van deze paragraaf de
      specifieke bepalingen van de [hoofdstukken 6][ref1], [7][ref2], [8][ref3] en [9][ref4] van toepassing.

      2 De ondernemer die een handeling uitvoert of laat uitvoeren waarvoor een vergunning, registratie of kennisgeving
      is vereist, zorgt ervoor dat een stralingsbeschermingsdeskundige hem adviseert over, dan wel toezicht uitoefent op,
      de naleving van de bij of krachtens [de wet][ref5] en dit besluit gestelde regels en voorschriften met betrekking
      tot die handeling, indien deze beroepsmatige blootstelling of blootstelling van een lid van de bevolking met zich
      brengt of kan brengen. De eerste volzin is mede van toepassing op een maatregel of blootstellingsituatie waarvoor
      een kennisgeving is vereist.

      3 Ten aanzien van handelingen als bedoeld in het tweede lid is deskundigheid vereist overeenkomstig een bij
      regeling van Onze Ministers vastgesteld passend niveau, welke in verhouding staat tot de aard en zwaarte van de
      betrokken risico’s.

      4 Bij de regeling, bedoeld in het derde lid, kunnen nadere eisen worden gesteld ten aanzien van de passende niveaus
      van deskundigheid, bedoeld in dat lid.

      5 Aan een stralingsbeschermingsdeskundige kan door een in [artikel 58 van de wet][ref6] aangewezen ambtenaar worden
      opgedragen om werknemers en leden van de bevolking te beschermen tegen ioniserende straling.


