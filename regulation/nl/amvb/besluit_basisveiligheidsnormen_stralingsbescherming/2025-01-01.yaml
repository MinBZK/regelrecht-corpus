  - number: '9.2'
    text: |-
      1 De ondernemer zorgt ervoor dat voor een lid van de bevolking als gevolg van handelingen als bedoeld in
      [artikel 9.1, eerste lid][ref1], die onder zijn verantwoordelijkheid worden verricht, op enig punt buiten de
      locatie ten gevolge van die handelingen een effectieve dosis van 0,1 millisievert in een kalenderjaar niet wordt
      overschreden.

      2 De ondernemer zorgt ervoor dat voor een lid van de bevolking die zich binnen de locatie bevindt, als gevolg van
      handelingen, die onder zijn verantwoordelijkheid worden verricht, de in [artikel 9.1, tweede en derde lid][ref2],
      genoemde individuele dosislimieten niet worden overschreden.

      3 [Artikel 9.1, vierde en vijfde lid][ref3], is mede van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel9.1
      [ref2]: https://wetten.overheid.nl/BWBR0040179#Artikel9.1
      [ref3]: https://wetten.overheid.nl/BWBR0040179#Artikel9.1
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel9.2
