    text: |-
      1 Met ingang van het tijdstip van inwerkingtreding van dit besluit geldt een team als bedoeld in
      [artikel 113 van het Besluit stralingsbescherming][ref1] als een voorziening als bedoeld in [artikel 6.12][ref2].

      2 Met ingang van het tijdstip van inwerkingtreding van dit besluit geldt een krachtens een vergunning vereist
      noodplan als een bedrijfsnoodplan als bedoeld in [artikel 6.7][ref3] en een interventieplan als bedoeld in
      [artikel 115 van het Besluit stralingsbescherming][ref4] als het onderdeel «interventies» van een bedrijfsnoodplan,
      vereist krachtens [artikel 6.8][ref5], voor zover aan de daarop betrekking hebbende eisen wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel113
      [ref2]: https://wetten.overheid.nl/BWBR0040179#Artikel6.12
