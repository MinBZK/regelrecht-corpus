  - number: '7.21'
    text: |-
      1 De ondernemer zorgt ervoor dat de stralingsarts, bedoeld in [artikel 7.22][ref1], gezondheidskundig toezicht op
      een A-werknemer uitoefent.

      2 Voor zover de A-werknemer een externe werknemer is rust de verplichting, bedoeld in het eerste lid, mede op zijn
      werkgever. Indien nodig werken de ondernemer en werkgever samen bij de uitvoering van het eerste lid.

      3 De ondernemer zorgt ervoor dat aan de arbodienst en stralingsarts alle gegevens worden verstrekt die zij nodig
      hebben om inzicht te krijgen in de gezondheidstoestand van de onder hun toezicht staande werknemers en om zich
      een oordeel te vormen over de omstandigheden op de arbeidsplaats voor zover deze van invloed kunnen zijn op de
      gezondheidstoestand van die werknemers. Het tweede lid is van overeenkomstige toepassing.

      4 Het gezondheidskundig toezicht, bedoeld in het eerste lid, omvat:

      a. de medisch onderzoeken door de stralingsarts die plaatsvinden ten behoeve van de indeling als A-werknemer
      en voor aanvang van de arbeid als A-werknemer en hebben ten doel na te gaan of de werknemer geschikt is voor de
      functie, bedoeld in [artikel 7.25][ref2];

      b. periodieke keuringen waarbij zo vaak als de stralingsarts dit nodig acht en ten minste eenmaal per jaar wordt
      nagegaan of de A-werknemer nog geschikt is voor het uitvoeren van de betreffende functie; en

      c. het medisch onderzoek door de stralingsarts van werknemers die niet langer arbeid verrichten als A-werknemer.

      5 Een medisch onderzoek van elke werknemer door een stralingsarts vindt voorts plaats indien daartoe door een
      blootstelling waarbij de dosislimieten, genoemd in [artikel 7.34][ref3], [7.35][ref4] of [7.36][ref5], zijn
      overschreden of wanneer door een blootstelling door een stralingsincident, een radiologische noodsituatie of een
      andere gebeurtenis daartoe aanleiding bestaat.

      6 Indien de arbodienst, in samenspraak met de stralingsarts, dat noodzakelijk acht, wordt een onderzoek gevolgd
      door maatregelen van de ondernemer of werkgever in verband met de bescherming van de gezondheid van de werknemer.
      Voor zover de A-werknemer een externe werknemer is, geldt het bepaalde in de eerste zin mede voor zijn werkgever.
      Indien nodig werken de ondernemer en de werkgever samen bij de uitvoering van dit lid.

      7 De stralingsarts deelt de uitslag van een onderzoek of keuring als bedoeld in het vierde of vijfde lid,
      onverwijld schriftelijk mee aan degene die het onderzoek of de keuring heeft ondergaan.

      8 Bij regeling van Onze Minister van Sociale Zaken en Werkgelegenheid worden regels gesteld betreffende de
      inschakeling van de arbodienst, de door deze ten aanzien van een blootgestelde werknemer te nemen aanvullende
      maatregelen en de door deze, in samenspraak met de stralingsarts, te verlenen toestemming bij verdere
      blootstellingsvoorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel7.22
      [ref2]: https://wetten.overheid.nl/BWBR0040179#Artikel7.25
      [ref3]: https://wetten.overheid.nl/BWBR0040179#Artikel7.34
      [ref4]: https://wetten.overheid.nl/BWBR0040179#Artikel7.35
