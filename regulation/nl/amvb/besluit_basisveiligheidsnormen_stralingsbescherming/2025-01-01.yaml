articles:
  - number: '1.1'
    text: >-
      1 Dit besluit strekt tot bescherming van de gezondheid van personen die beroepsmatige of medische blootstelling of
      blootstelling als lid van de bevolking ondergaan, tegen de gevaren van die blootstelling en bevat daartoe:


      a. basisveiligheidsnormen en daarmee verband houdende bepalingen;


      b. een controlestelsel met een systeem van stralingsbescherming voor alle blootstellingsituaties als bedoeld
      in het tweede lid, gebaseerd op de beginselen rechtvaardiging, optimalisatie en dosislimitering en een graduele
      benadering.


      2 Dit besluit is van toepassing op iedere geplande blootstellingsituatie, bestaande blootstellingsituatie of
      radiologische noodsituatie waarvan het risico op blootstelling niet-verwaarloosbaar is vanuit het oogpunt van:


      a. stralingsbescherming of,


      b. milieubescherming, met het oog op de gezondheidsbescherming op lange termijn.


      3 Dit besluit is niet van toepassing op:


      a. blootstellingsituaties met blootstelling aan natuurlijke stralingsniveaus, waaronder in ieder geval wordt
      begrepen blootstelling:


      1°. ten gevolge van radionucliden die van nature in het menselijk lichaam aanwezig zijn;


      2°. aan kosmische straling ter hoogte van het aardoppervlak;


      b. blootstelling aan kosmische straling tijdens de vlucht van een luchtvaartuig of ruimtevaartuig van leden van de
      bevolking of werknemers die niet behoren tot de bemanning;


      c. bovengrondse blootstelling aan radionucliden in de onverstoorde aardkorst;


      d. het vervoeren van een toestel of versneller, indien niet gebruikt tijdens het vervoer en voor zover het toestel
      of de versneller geen radioactieve stoffen, al dan niet ten gevolge van activering, bevat;


      e. het vervoeren van radioactieve stoffen buiten een locatie en het binnen of buiten Nederlands grondgebied brengen
      of doen brengen daarvan.
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel1.1
