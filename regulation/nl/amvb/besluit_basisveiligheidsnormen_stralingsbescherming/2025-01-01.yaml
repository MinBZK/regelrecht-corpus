  - number: '5.10'
    text: >-
      De ondernemer stelt financiële middelen en faciliteiten voor een passende bescherming tegen ioniserende straling
      ter beschikking aan de stralingsbeschermingsdeskundige, de toezichthoudend medewerker stralingsbescherming en de
      stralingsbeschermingseenheid, die met de uitvoering van die stralingsbescherming zijn belast.
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel5.10
  - number: '5.11'
    text: |-
      1 Instellingen waar personen overeenkomstig [artikel 5.5][ref1], [5.8][ref2] of [8.4, derde lid][ref3],
      een diploma, certificaat of een ander getuigschrift ter afsluiting van een opleiding op het gebied van
      stralingsbescherming kunnen behalen dienen te zijn erkend door de Autoriteit. De erkenning geldt voor een tijdvak
      van vijf jaar en kan daarna telkens voor een tijdvak van vijf jaar worden verlengd indien aan de met het oog op
      erkenning gestelde eisen, bedoeld in het derde lid, wordt voldaan. Van een erkenning of verlenging daarvan wordt
      mededeling gedaan in de Staatscourant.

      2 De erkenning kan worden geschorst of ingetrokken door de Autoriteit indien de opleiding ook na herhaalde
      waarschuwing niet, of niet langer, voldoet aan een of meer krachtens het derde lid gestelde eisen.

      3 Bij regeling van Onze Ministers worden regels gesteld met betrekking tot:

      a. eisen aan de kwaliteit en kwaliteitsborging van de opleiding;

      b. eisen aan de examinering, toetsing en het vaststellen van eindtermen;

      c. eisen voor beroep en klachten.

      4 Bij verordening van de Autoriteit worden eisen gesteld met betrekking tot de aanvraag van een erkenning en kunnen
      nadere regels worden gesteld met betrekking tot het eerste tot en met derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel5.5
      [ref2]: https://wetten.overheid.nl/BWBR0040179#Artikel5.8
