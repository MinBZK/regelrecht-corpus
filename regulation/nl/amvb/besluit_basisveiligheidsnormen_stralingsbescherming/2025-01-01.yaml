  - number: '13.11'
    text: |-
      1 Indien een in [afdeling 12.2][ref1] opgenomen overgangsrechtelijke bepaling een verwijzing bevat naar een
      bepaling van dit besluit waarnaar in [artikel 13.2][ref2] wordt verwezen of die in dat artikel van toepassing of
      overeenkomstige toepassing wordt verklaard, is de desbetreffende overgangsrechtelijke bepaling van afdeling 12.2
      van overeenkomstige toepassing.

      2 Met ingang van het tijdstip van inwerkingtreding van dit besluit geldt een melding, respectievelijk globale
      melding als bedoeld in het [Besluit vervoer splijtstoffen, ertsen en radioactieve stoffen][ref3] als een
      kennisgeving, respectievelijk jaarkennisgeving als bedoeld in dat besluit.

      3 Een jaarkennisgeving als bedoeld in het tweede lid vervalt van rechtswege op het tijdstip waarop de globale
      kennisgeving, waarvan het de voortzetting is, zou zijn vervallen.


