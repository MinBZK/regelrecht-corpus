  - number: '3.8'
    text: |-
      1 Onder de vergunningplicht, bedoeld in [artikel 3.5, eerste of tweede lid][ref1], vallen handelingen, behorend tot
      een in het tweede, derde of vierde lid genoemde categorie.

      2 De hierna genoemde categorieën van handelingen met een toestel of versneller:

      a. handelingen met een versneller, met uitzondering van een elektronenmicroscoop, inclusief de onderdelen van de
      installatie en bouwdelen waarin zich radioactieve stoffen bevinden die door activering zijn of kunnen ontstaan
      vanwege het gebruik van de versneller;

      b. handelingen met een toestel voor industriële radiografie;

      c. handelingen met een toestel voor de bewerking van consumentenproducten;

      d. handelingen met een toestel voor onderwijsdoeleinden, tenzij voor de specifieke handeling een registratieplicht
      geldt of de handeling is vrijgesteld van kennisgeving;

      e. handelingen met een toestel waarbij blootstelling van personen en dieren plaatsvindt voor therapeutische
      doeleinden;

      f. handelingen met een toestel waarbij blootstelling van personen en dieren plaatsvindt voor diagnostische
      doeleinden, tenzij voor de specifieke handeling een registratieplicht geldt;

      g. handelingen met een toestel waarbij opzettelijke blootstelling van personen plaatsvindt ten behoeve van niet-
      medische beeldvorming;

      h. het verrichten van onderzoeks- en ontwikkelingswerk aan een toestel of een versneller;

      i. het installeren, het ontmantelen en het verrichten van reparaties, onderhoud en kwaliteitscontrole aan een
      toestel of versneller;

      j. alle overige handelingen met een toestel, tenzij voor de specifieke handeling een registratieplicht geldt of de
      handeling is vrijgesteld van kennisgeving.

      3 De hierna genoemde categorieën van handelingen met radioactieve stoffen:

      a. het toedienen van radioactieve stoffen aan personen en, voor zover het de bescherming van mensen tegen
      ioniserende straling betreft, aan dieren voor het stellen van medische of veterinaire diagnoses;

      b. het toedienen van radioactieve stoffen aan personen en, voor zover het de bescherming van mensen tegen
      ioniserende straling betreft, aan dieren voor therapie of medisch of biomedisch onderzoek;

      c. het toevoegen van radioactieve stoffen aan consumentenproducten;

      d. handelingen met radioactieve stoffen voor industriële radiografie;

      e. handelingen met radioactieve stoffen voor de bewerking van consumentenproducten;

      f. handelingen met radioactieve stoffen voor onderwijsdoeleinden en wetenschappelijk onderzoek;

      g. handelingen met een hoogactieve bron;

      h. handelingen met open bronnen, met van nature voorkomende radionucliden, waarvan de activiteitsconcentratie
      gelijk is aan of hoger is dan tienmaal de krachtens [artikel 3.17][ref2] vastgestelde waarde;

      i. overige handelingen met radioactieve stoffen, tenzij voor de specifieke handeling een registratieplicht geldt of
      de handeling is vrijgesteld van kennisgeving.

      4 De hierna genoemde overige categorieën van handelingen:

      a. handelingen met radioactieve stoffen of radioactief materiaal en het bergen van bronnen of weesbronnen
      op locaties van derden, als gevolg van het verlenen van bijstand bij het afwikkelen van gevallen waarin de
      radioactieve stoffen of radioactieve materialen in niet-geautoriseerde omstandigheden aanwezig zijn, of als gevolg
      van ongevallen, stralingsincidenten of radiologische noodsituaties;

      b. het zich ontdoen van radioactieve stoffen voor product- of materiaalhergebruik of als radioactieve afvalstof,
      behoudens [artikel 10.6][ref3];

      c. handelingen waarbij door de lucht verspreide of vloeibare radioactieve stoffen in de omgeving vrijkomen,
      waarbij de hoeveelheid vrijgekomen radioactieve stoffen gelijk is aan of hoger is dan de krachtens
      [artikel 10.3, eerste lid][ref4], of [10.4, eerste lid, onder b][ref5], vastgestelde waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel3.5
      [ref2]: https://wetten.overheid.nl/BWBR0040179#Artikel3.17
