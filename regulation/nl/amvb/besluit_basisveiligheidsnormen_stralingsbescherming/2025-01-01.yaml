  - number: '6.14'
    text: |-
      1 Door Onze Ministers, bedoeld in [artikel 6.12][ref1], of de ondernemer kan een situatie worden aangemerkt als
      een situatie die leidt tot langdurige blootstelling als gevolg van een radiologische noodsituatie of een vroegere
      handeling.

      2 Onze Ministers, bedoeld in [artikel 6.12][ref2], kunnen in het geval dat de situatie als bedoeld in het eerste
      lid onder de verantwoordelijkheid van een ondernemer valt, de ondernemer verplichten een interventie uit te voeren.

      3 In een geval als bedoeld in het eerste lid, zorgt degene onder wiens verantwoordelijkheid de interventie wordt
      verricht, voor zover noodzakelijk met het oog op het gevaar van blootstelling, voor:

      a. de afbakening van het desbetreffende gebied;

      b. de invoering van een bewakingssysteem voor de blootstelling;

      c. de uitvoering van de interventie, overeenkomstig een door Onze Ministers als bedoeld goedgekeurd plan van
      aanpak;

      d. het regelen van de toegang tot of het gebruik van de locaties, woningen of andere gebouwen, die zich in het
      afgebakende gebied bevinden.

      4 Met betrekking tot interventie in een geval als bedoeld in het eerste lid zijn [afdeling 3.2][ref3], met
      uitzondering van [artikel 3.7, aanhef en onder b][ref4], en de [artikelen 6.9][ref5], [6.11 tot en met 6.13][ref6]
      en [9.2][ref7], niet van toepassing.


