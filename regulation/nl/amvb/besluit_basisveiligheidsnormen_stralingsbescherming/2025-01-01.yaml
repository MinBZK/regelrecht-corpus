  - number: '4.19'
    text: |-
      1 De Autoriteit houdt een register bij van alle ondernemers die op grond van [artikel 3.5][ref1] een vergunning
      hebben voor het uitvoeren van handelingen met hoogactieve bronnen en van de hoogactieve bronnen waar zij over
      beschikken.

      2 In het register worden, naast gegevens omtrent de ondernemer en de vergunning, de volgende gegevens omtrent de
      bron opgenomen:

      a. het soort radionuclide;

      b. de activiteit op het moment van productie, of, indien deze onbekend is,

      c. de activiteit op het tijdstip waarop de bron voor het eerst op de markt is gebracht of door de ondernemer is
      verworven, en

      d. het type bron.

      3 De Autoriteit houdt het register bij op basis van de hem bekende gegevens, bedoeld in de [artikelen 4.9][ref2]
      en [4.18][ref3].

      4 Het register staat ter beschikking aan krachtens [artikel 58, eerste lid, van de wet][ref4], aangewezen
      ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel3.5
