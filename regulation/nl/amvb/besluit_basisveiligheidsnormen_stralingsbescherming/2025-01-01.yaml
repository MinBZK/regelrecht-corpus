  - number: '2.3'
    text: |-
      1 Bij regeling van Onze Ministers worden categorieën of soorten handelingen of maatregelen als bedoeld in
      [artikel 2.2][ref1] generiek als gerechtvaardigd of als niet-gerechtvaardigd aangewezen.

      2 De specifieke rechtvaardiging van een handeling vindt plaats bij de beslissing op een aanvraag om een vergunning
      of registratie of op een daartoe strekkend verzoek bij een kennisgeving, met toepassing van [artikel 2.5][ref2].
      De specifieke rechtvaardiging van een maatregel vindt plaats bij beschikking van de Autoriteit, op een daartoe
      strekkend verzoek.

      3 Bij regeling van Onze Minister van Defensie, die wordt bekendgemaakt op een bij die regeling te bepalen wijze,
      kunnen met het oog op het belang dat de krijgsmacht dient:

      a. andere handelingen of maatregelen als gerechtvaardigd worden aangewezen dan die, aangewezen op grond van het
      eerste lid;

      b. in afwijking van het eerste lid, handelingen of maatregelen als gerechtvaardigd worden aangewezen die op grond
      van dat lid als niet gerechtvaardigd zijn aangewezen.

      4 De rechtvaardiging van een categorie of soort handelingen of maatregelen of van een specifieke toepassing kan
      worden herzien in geval van:

      a. nieuwe, relevante onderzoeksgegevens over de doeltreffendheid of over de mogelijke gevolgen van de
      desbetreffende handelingen of maatregelen;

      b. nieuwe, relevante informatie over andere technieken en technologieën voor die handelingen of maatregelen.

      5 Bij verordening van de Autoriteit kunnen regels worden gesteld met betrekking tot een verzoek als bedoeld in het
      tweede lid, tweede volzin, en de daarbij te overleggen gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel2.2
      [ref2]: https://wetten.overheid.nl/BWBR0040179#Artikel2.5
