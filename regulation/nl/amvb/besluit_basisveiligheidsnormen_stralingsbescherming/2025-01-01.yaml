        paragraaf: '5.3'
  - number: '7.31'
    text: |-
      1 In uitzonderlijke omstandigheden, met uitzondering van radiologische noodsituaties, kan Onze Minister
      van Sociale Zaken en Werkgelegenheid of, indien het inrichtingen betreft waarvoor een vergunning krachtens
      [artikel 15, onder b, van de wet][ref1] is verleend, de Autoriteit of, indien het mijnbouw betreft, Onze
      Minister van Economische Zaken, op verzoek van een ondernemer ontheffing van de dosislimieten, genoemd in
      [artikel 7.34][ref2], verlenen, mits:

      a. het een A-werknemer betreft of een bemanningslid van een ruimtevaartuig;

      b. de betrokken werknemer zijn toestemming heeft gegeven;

      c. de blootstelling beperkt is in tijd;

      d. de blootstelling alleen in nader vast te stellen ruimten plaatsvindt;

      e. het geen leerling of studerende, of zwangere werknemer betreft;

      f. het geen werknemer betreft die borstvoeding geeft, terwijl er risico bestaat op besmetting van het lichaam;

      g. de blootstelling van te voren door de ondernemer wordt gemotiveerd en de blootstelling en de risico’s
      van te voren door de ondernemer worden besproken met de betrokken werknemer, de ondernemingsraad of
      personeelsvertegenwoordiging, de arbodienst, de stralingsarts en de stralingsbeschermingsdeskundige; en

      h. de betrokken werknemers vooraf door de ondernemer worden ingelicht over de tijdens de handeling te nemen
      voorzorgsmaatregelen.

      2 Met betrekking tot de blootstelling, bedoeld in het eerste lid, kunnen bij regeling van Onze Minister van Sociale
      Zaken en Werkgelegenheid nadere regels worden gesteld met betrekking tot de maximale te ontvangen effectieve en
      equivalente dosis en de wijze waarop deze worden vastgesteld.

      3 Aan de ontheffing kunnen voorschriften worden verbonden.

      4 Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref3] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref4] niet van toepassing op de aanvraag om een ontheffing.

      5 In de situatie, bedoeld in het eerste lid, rapporteert de ondernemer na afloop aan Onze Minister van
      Sociale Zaken en Werkgelegenheid of, indien het inrichtingen betreft waarvoor een vergunning krachtens
      [artikel 15, onder b, van de wet][ref5] is verleend, de Autoriteit of, indien het mijnbouw betreft, Onze Minister
      van Economische Zaken, over de uitgevoerde handelingen, de wijze waarop bescherming tegen ioniserende straling is
      uitgevoerd en de door de werknemer ontvangen effectieve en equivalente dosis.

      6 De met deze blootstelling verband houdende dosis wordt afzonderlijk opgenomen in het medisch dossier, bedoeld
      in [artikel 7.26][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0040179#Artikel7.34
      [ref3]: https://wetten.overheid.nl/BWBR0026759#Artikel28
