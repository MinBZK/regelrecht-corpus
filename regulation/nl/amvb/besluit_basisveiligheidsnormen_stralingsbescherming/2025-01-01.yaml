  - number: '4.18'
    text: |-
      1 In afwijking van [artikel 4.2][ref1] legt de ondernemer die de beschikking krijgt over een hoogactieve bron
      onmiddellijk na de verwerving daarvan het in dat artikel bedoelde dossier aan van die bron, en houdt daarin
      de informatie bij als bedoeld in, en overeenkomstig het model van het informatieformulier, opgenomen in
      [bijlage 5][ref2].

      2 De ondernemer stelt een schriftelijke of digitale kopie van de door hem beheerde dossiers ter beschikking aan
      de Autoriteit:

      a. onmiddellijk na het aanleggen van een dossier;

      b. op de bij verordening van de Autoriteit bepaalde vaste data;

      c. bij wijziging van de op het informatieformulier beschreven situatie;

      d. op een daartoe strekkend verzoek van de Autoriteit;

      e. bij het afsluiten van het dossier voor een bron, wanneer de ondernemer deze niet langer in zijn bezit heeft,
      waarbij de naam en het adres worden vermeld van:

      1°. de onderneming waaraan de bron is overgedragen, en

      2°. de voorziening voor opslag of verwijdering waaraan de bron is overgedragen;

      f. bij het afsluiten van het dossier, als de ondernemer geen bronnen meer in zijn bezit heeft.

      3 De krachtens [artikel 58, eerste lid, van de wet][ref3] aangewezen ambtenaren hebben te allen tijde toegang tot
      en inzage in de dossiers.

      4 Bij verordening van de Autoriteit kunnen nadere regels worden gesteld omtrent de uitvoering van het eerste en
      tweede lid, waaronder de te verstrekken gegevens en de wijze van verstrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel4.2
      [ref2]: https://wetten.overheid.nl/BWBR0040179
      [ref3]: https://wetten.overheid.nl/BWBR0002402#Artikel58
