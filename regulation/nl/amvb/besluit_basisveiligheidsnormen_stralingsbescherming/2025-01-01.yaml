  - number: '3.1'
    text: >-
      1 Het is verboden om bij de productie of vervaardiging van levensmiddelen, speelgoed, sieraden, cosmetische
      producten en diervoeder opzettelijk radioactieve stoffen toe te voegen.


      2 Handelingen waardoor materialen die worden gebruikt in speelgoed of sieraden worden geactiveerd en waarbij, op
      het moment van het op de markt brengen of het vervaardigen van deze producten, sprake is van een toename van de
      activiteit die vanuit het oogpunt van stralingsbescherming niet kan worden verwaarloosd, zijn verboden.
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel3.1
  - number: '3.2'
    text: |-
      1 Bij regeling van Onze Minister en Onze Minister van Sociale Zaken en Werkgelegenheid worden categorieën of
      soorten handelingen aangewezen waarbij van nature voorkomend radioactief materiaal is betrokken en werknemers
      of leden van de bevolking daardoor een blootstelling ondergaan of kunnen ondergaan die vanuit het oogpunt van
      stralingsbescherming niet kan worden verwaarloosd.

      2 Voordat een ondernemer een krachtens het eerste lid aangewezen handeling gaat verrichten gaat hij na of van deze
      handeling moet worden kennisgegeven of dat daarvoor een registratie of vergunning moet worden aangevraagd.

      3 De aanwijzing, bedoeld in het eerste lid, vindt uitsluitend plaats indien een krachtens [afdeling 3.3][ref1]
      vastgestelde vrijstellingsgrens of vrijgavegrens voor de desbetreffende handeling of het desbetreffende materiaal
      is of kan worden overschreden.

      4 Bij regeling van Onze Minister worden handelingen met natuurlijke bronnen aangewezen, waarvoor vanuit het oogpunt
      van stralingsbescherming bezorgdheid bestaat dat een handeling kan leiden tot de aanwezigheid van in de natuur
      voorkomende radionucliden in het water, waardoor de kwaliteit van het drinkwater of andere blootstellingsroutes
      wordt of worden beïnvloed. Het tweede lid is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Hoofdstuk3
