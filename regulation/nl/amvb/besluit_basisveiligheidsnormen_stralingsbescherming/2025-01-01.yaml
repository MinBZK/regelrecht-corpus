  - number: '11.1'
    text: |-
      [Afdeling 3.4 van de Algemene wet bestuursrecht][ref1] en [afdeling 13.2 van de Wet milieubeheer][ref2] zijn
      van toepassing op de voorbereiding van een beschikking op een aanvraag om vergunning voor een handeling met een
      versneller, tenzij:

      a. het toestel uitsluitend voor medisch-radiologische procedures is bestemd;

      b. het toestel zich bevindt in een voertuig of aan boord van een vaartuig of luchtvaartuig, dat als zodanig wordt
      gebruikt;

      c. het toestel zich bevindt op steeds wisselende locaties, en naar het oordeel van de Autoriteit
      het belang van de toepassing van [afdeling 3.4 van de Algemene wet bestuursrecht][ref3], alsmede
      [afdeling 13.2 van de Wet milieubeheer][ref4] niet opweegt tegen de daaraan verbonden bezwaren;

      d. al eerder een vergunning voor een toestel van hetzelfde type met betrekking tot dezelfde plaats is verleend en
      naar het oordeel van de Autoriteit niet te verwachten is dat door gebruikmaking van de gevraagde vergunning meer
      schade kan ontstaan dan bij de eerder verleende vergunning in aanmerking is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Afdeling13.2
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Afdeling13.2
