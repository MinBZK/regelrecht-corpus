    text: |-
      Indien een in [afdeling 12.2][ref1] opgenomen overgangsrechtelijke bepaling een verwijzing bevat naar een
      bepaling van dit besluit waarnaar in [artikel 13.1][ref2] wordt verwezen of die in dat artikel van toepassing of
      overeenkomstige toepassing wordt verklaard, is de desbetreffende overgangsrechtelijke bepaling van afdeling 12.2
      van overeenkomstige toepassing.


