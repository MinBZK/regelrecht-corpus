  - number: '14.1'
    text: >-
      Indien dit in het belang van de bescherming tegen ioniserende straling naar het oordeel van Onze Minister en Onze
      Minister van Sociale Zaken en Werkgelegenheid dringend noodzakelijk is en naar hun oordeel een wijziging van dit
      besluit niet kan worden afgewacht, kunnen bij regeling van Onze genoemde Ministers regels worden gesteld, die van
      dit besluit afwijken maar met een strekking als bedoeld in dit besluit. Een zodanige regeling vervalt een jaar
      nadat zij in werking is getreden, of, indien binnen die termijn een wijziging van de betrokken bepaling van dit
      besluit in werking is getreden, op het tijdstip waarop die wijziging in werking treedt. Onze genoemde Ministers
      kunnen de termijn bij ministeriële regeling eenmaal met ten hoogste een jaar verlengen.
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel14.1
  - number: '14.2'
    text: >-
      Een wijziging van [richtlijn 2013/59](32013L0059)/Euratom gaat voor de toepassing van dit besluit gelden met
      ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij ministerieel
      besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel14.2
  - number: '14.3'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel14.3
  - number: '14.4'
    text: 'Dit besluit wordt aangehaald als: Besluit basisveiligheidsnormen stralingsbescherming.'
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel14.4
