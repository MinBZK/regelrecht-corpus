  - number: '4.14'
    text: |-
      1 Onverminderd [artikel 7.28][ref1] zorgt de ondernemer ervoor dat degene die een handeling met een hoogactieve
      bron verricht, en degene die daaraan leiding geeft of daarop toezicht houdt, is voorgelicht en geïnstrueerd over:

      a. de voorschriften voor het veilig beheer van hoogactieve bronnen;

      b. de noodzakelijke veiligheidsvoorschriften, en

      c. de mogelijke gevolgen van het wegvallen van een passende controle op hoogactieve bronnen.

      2 De in het eerste lid genoemde onderwerpen worden beschreven. Deze documentatie wordt ter beschikking gesteld
      aan degene die een handeling met een hoogactieve bron verricht en aan degene die daaraan leiding geeft of daarop
      toezicht houdt.

      3 Voorlichting en instructies als bedoeld in het eerste lid worden ten minste elke twee jaar herhaald.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel7.28
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel4.14
