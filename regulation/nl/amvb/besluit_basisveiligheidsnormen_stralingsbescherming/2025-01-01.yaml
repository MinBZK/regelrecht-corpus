  - number: '12.11'
    text: |-
      1 Ten aanzien van een handeling die ingevolge [artikel 21 van het Besluit stralingsbescherming][ref1]
      meldingsplichtig was en die ingevolge [3.5][ref2] vergunningplichtig of ingevolge [artikel 3.9][ref3]
      registratieplichtig wordt, wordt binnen twee jaar na de inwerkingtreding van dit besluit een daartoe strekkende
      aanvraag ingediend. Tot het tijdstip waarop de beslissing op de aanvraag onherroepelijk van kracht is geworden
      geldt de melding als tijdelijke vergunning of tijdelijke registratie.

      2 Ten aanzien van een handeling of blootstellingsituatie waarvoor ingevolge
      [artikel 21 van het Besluit stralingsbescherming][ref4] geen meldingsplicht gold en waarvoor ingevolge
      [artikel 3.11][ref5] een kennisgevingsplicht geldt, wordt binnen drie maanden na de inwerkingtreding van dit
      besluit een kennisgeving gedaan.

      3 Ten aanzien van de verplichtingen met betrekking tot een beëindigingsplan als bedoeld in [artikel 10.8][ref6]
      wordt voor de eerste maal gevolg gegeven uiterlijk op 1 januari 2020.


