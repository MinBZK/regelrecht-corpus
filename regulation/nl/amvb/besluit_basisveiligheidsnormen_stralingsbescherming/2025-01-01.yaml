  - number: '7.2'
    text: |-
      1 De ondernemer zorgt ervoor dat een handeling wordt uitgevoerd door of onder toezicht van een toezichthoudend
      medewerker stralingsbescherming en stelt hem de middelen ter beschikking die hij nodig heeft om zijn uitvoerende en
      toezichthoudende taken goed te kunnen vervullen.

      2 Bij regeling van Onze Minister van Sociale Zaken en Werkgelegenheid kunnen nadere regels worden gesteld met
      betrekking tot het aanwijzen van een toezichthoudend medewerker stralingsbescherming door werkgevers van externe
      werknemers om relevante stralingsbeschermingstaken met betrekking tot de bescherming van hun werknemers te
      verrichten.

      3 De toezichthoudend medewerker stralingsbescherming rapporteert periodiek en rechtstreeks aan de ondernemer over
      de uitvoering van de taken, genoemd in het vierde lid, en legt de rapportage schriftelijk vast.

      4 Afhankelijk van de aard van de handeling bevatten de uitvoerende en toezichthoudende taken van de toezichthoudend
      medewerker stralingsbescherming voor zover van toepassing, in ieder geval de volgende elementen:

      a. het ervoor zorgen dat de handelingen die blootstelling aan ioniserende straling met zich brengen of met zich
      kunnen brengen, worden uitgevoerd overeenkomstig de toepasselijke vastgestelde procedures en ter plekke geldende
      regelgeving;

      b. het toezien op de uitvoering van het werkplekgerelateerde monitoringsprogramma;

      c. het bijhouden van een adequate administratie betreffende alle bronnen;

      d. het uitvoeren van periodieke beoordelingen van de toestand van de van belang zijnde veiligheids- en
      waarschuwingssystemen;

      e. het toezien op de uitvoering van het individuele monitoringsprogramma;

      f. het toezien op de uitvoering van het gezondheidskundig toezicht, bedoeld in [artikel 7.21][ref1];

      g. het voorlichten van werknemers over de toepasselijke vastgestelde procedures en ter plekke geldende regelgeving;

      h. het geven van advies en commentaar bij werkplannen;

      i. het opstellen van werkplannen;

      j. het regelmatig rapporteren betreffende de uitvoering van de taken, genoemd in dit lid, aan het lokale
      management, en het schriftelijk vastleggen ervan;

      k. het deelnemen aan afspraken betreffende de preventie, voorbereiding en reactie op blootstelling in
      noodsituaties;

      l. het verzorgen van opleiding en bij- en nascholing van werknemers; en

      m. het samenwerken met en onderhouden van contact met de stralingsbeschermingsdeskundige.

      5 De ondernemer legt de toedeling van taken, bevoegdheden, verantwoordelijkheden en middelen met betrekking
      tot de toezichthoudend medewerker stralingsbescherming schriftelijk vast. Dit document is toegankelijk
      voor alle in de onderneming werkzame werknemers en de externe hulpverleningsorganisaties, bedoeld in
      [artikel 3, eerste lid, onder e, van de Arbeidsomstandighedenwet][ref2].

      6 Bij regeling van Onze Minister kunnen met het oog op een goede uitvoering nadere regels worden gesteld met
      betrekking tot het derde en het vierde lid, voor zover dit niet betreft de veiligheid en gezondheid van werknemers.

      7 Bij regeling van Onze Minister van Sociale Zaken en Werkgelegenheid kunnen met het oog op een goede uitvoering
      nadere regels worden gesteld met betrekking tot het derde en vierde lid, voor zover dit de veiligheid en gezondheid
      van werknemers betreft.


