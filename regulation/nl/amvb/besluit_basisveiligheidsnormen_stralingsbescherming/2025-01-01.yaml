  - number: '4.29'
    text: |-
      1 Bij verordening van de Autoriteit worden methoden aangewezen of vastgesteld:

      a. ter bepaling van de omgevingsdosisequivalenten;

      b. ter bepaling van de equivalente en de effectieve doses, met inachtneming van passende standaardwaarden en
      standaardrelaties;

      c. ter bepaling van de waarden voor de activiteitsconcentratie en de totale activiteit of de waarden voor de
      activiteit per oppervlakte-eenheid ten gevolge van radionucliden;

      d. betreffende de aanwijzing van radionucliden die bij de toetsing van van nature voorkomende radionucliden zijn
      vrijgesteld van sommatie;

      e. voor de bepaling van de activiteitsconcentratie, de activiteit per oppervlakte-eenheid en de totale activiteit
      voor radionucliden.

      2 Bij de verordening kunnen in elk geval:

      a. methoden worden aangewezen voor de wijze waarop de in het eerste lid, onder b, bedoelde doses worden getoetst
      aan de in dit besluit opgenomen dosislimieten, dosisbeperkingen of referentieniveaus;

      b. regels worden gesteld voor de meetmethoden van activiteiten, activiteitsconcentratie of activiteit per
      oppervlakte-eenheid.

      3 Ter bepaling van doses worden alle effectieve of equivalente doses gesommeerd die een persoon ontvangt ten
      gevolge van handelingen waarop dit besluit, het [Besluit kerninstallaties, splijtstoffen en ertsen][ref1], het
      [Besluit vervoer splijtstoffen, ertsen en radioactieve stoffen][ref2] of een ander besluit dat betrekking heeft
      op handelingen met een risico op blootstelling aan ioniserende straling, van toepassing is, met uitzondering van
      medisch-radiologische procedures.

      4 Ten behoeve van de toetsing aan waarden voor de activiteitsconcentratie, de totale activiteit of de waarden voor
      de activiteit per oppervlakte-eenheid ten gevolge van radionucliden, worden alle activiteiten die zich op enig
      moment binnen een locatie bevinden of worden geloosd, gewogen en gesommeerd overeenkomstig de methoden, bedoeld in
      [artikel 3.4, vijfde lid][ref3].

      5 In afwijking van het vierde lid worden de activiteiten of activiteitsconcentratie in natuurlijke bronnen niet
      gesommeerd met de activiteiten of activiteitsconcentratie in kunstmatige bronnen.


      [ref1]: https://wetten.overheid.nl/BWBR0002667
      [ref2]: https://wetten.overheid.nl/BWBR0002668
      [ref3]: https://wetten.overheid.nl/BWBR0040179#Artikel3.4
