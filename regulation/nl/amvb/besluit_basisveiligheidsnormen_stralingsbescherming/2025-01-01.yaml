        artikel: '7.1'
        hoofdstuk: '7'
        paragraaf: 7.1.1
        afdeling: '7.1'
  - number: '4.3'
    text: >-
      1 De ondernemer die op wisselende plaatsen handelingen verricht ten behoeve van industriële radiografie, houdt per
      locatie een administratie bij van die handelingen.


      2 Een administratie als bedoeld in het eerste lid wordt ondergebracht in een beheersysteem.


      3 De ondernemer die een administratie als bedoeld in het eerste lid bijhoudt, bewaart de gegevens waaruit die
      administratie bestaat gedurende een periode van ten minste drie jaar na het kalenderjaar waarop deze gegevens
      betrekking hebben.


      4 Bij verordening van de Autoriteit kunnen met het oog op een goede uitvoering nadere regels worden gesteld met
      betrekking tot de administratie.


      5 De in het eerste lid bedoelde verplichting geldt niet indien het aantal tevoren geschatte opnamen per locatie per
      kalenderjaar minder dan 100 bedraagt.
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel4.3
  - number: '4.4'
    text: |-
      1 De ondernemer stelt, na raadpleging van een stralingsbeschermingsdeskundige of toezichthoudend medewerker
      stralingsbescherming, maatregelen vast om schade tegen te gaan en zorgt ervoor dat deze worden uitgevoerd.

      2 De ondernemer zorgt er ten aanzien van bronnen, beveiligingsmiddelen en meetinstrumenten waarvoor hij
      verantwoordelijk is, voor dat:

      a. daaraan het noodzakelijke onderhoud wordt verricht;

      b. de noodzakelijke maatregelen worden genomen om inadequate of defecte onderdelen daarvan te verbeteren of te
      vervangen, en

      c. indien nodig, tot buitengebruikstelling van een bron wordt overgegaan.

      3 De ondernemer zorgt ervoor dat zoveel als redelijkerwijs mogelijk wordt voorkomen dat een bron zoekraakt, wordt
      ontvreemd of ongewild wordt verspreid en neemt, indien zich een zodanige situatie voordoet, alle noodzakelijke
      maatregelen om de bron weer onder zijn controle of beheer te brengen en een eventuele besmetting te verwijderen of
      verdere blootstelling van personen te voorkomen.

      4 De ondernemer zorgt ervoor dat bronnen, zoveel als redelijkerwijs mogelijk is, beveiligd zijn tegen brand.

      5 Regels als bedoeld in dit hoofdstuk gelden onverminderd het bepaalde bij en krachtens de [hoofdstukken 7][ref1]
      en [8][ref2] met betrekking tot bronnen en de betrokkenheid van een stralingsbeschermingsdeskundige of
      toezichthoudend medewerker stralingsbescherming bij handelingen met die bronnen.

      6 De ondernemer zorgt ervoor dat met betrekking tot de bronnen waarvoor hij verantwoordelijk is voldaan wordt
      aan bij verordening van de Autoriteit gestelde nadere regels met betrekking tot de eisen waaraan degene die een
      handeling verricht met een bron moet voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0040179#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0040179
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0040179
        hoofdstuk: '8'
  - number: '4.5'
    text: >-
      De ondernemer zorgt ervoor dat met betrekking tot toestellen en versnellers waarvoor hij verantwoordelijk is
      voldaan wordt aan de bij verordening van de Autoriteit gestelde regels met betrekking tot:


      a. het testen van een toestel of versneller voor de ingebruikname daarvan;


      b. de afscherming van een toestel of versneller tegen ioniserende straling;


      c. de opstelling van een toestel of versneller en de bijbehorende hulpmiddelen en beveiligingsmiddelen;


      d. de werkwijze van een toestel of versneller;


      e. maatregelen ter voorkoming van gebruik van een toestel of versneller door onbevoegden;


      f. de controle op de werking van een toestel of versneller; en


      g. het omgevingsdosisequivalenttempo dat een toestel of versneller mag veroorzaken.
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel4.5
  - number: '4.6'
    text: >-
      1 De ondernemer zorgt ervoor dat wanneer open en ingekapselde bronnen niet worden gebruikt, deze worden opgeborgen
      in een daartoe geschikte bergplaats.


      2 Bij verordening van de Autoriteit kunnen met het oog op een goede uitvoering nadere regels worden gesteld met
      betrekking tot het eerste lid. Daartoe kunnen behoren regels die een vrijstelling inhouden of een bevoegdheid tot
      ontheffingverlening met het oog op gevallen waarin redelijkerwijs niet aan het eerste lid kan worden voldaan.
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel4.6
  - number: '4.7'
    text: |-
      1 De ondernemer zorgt in gevallen, behorend tot een bij regeling van Onze Minister aangewezen categorie, voor een
      beveiligingsplan waarin wordt beschreven welke voorzieningen met betrekking tot de beveiliging van een bron zijn
      getroffen.

      2 De aanwijzing, bedoeld in het eerste lid, staat in een passende verhouding tot de aard en zwaarte van de
      betrokken risico’s, overeenkomstig de graduele benadering, bedoeld in [artikel 1.1][ref1]. Bij verordening van
      de Autoriteit kunnen afhankelijk van de aard en zwaarte van de betrokken risico’s, eisen aan de vorm, inhoud en
      kwaliteit van het beveiligingsplan en de wijze van uitvoering ervan worden gesteld. Deze eisen kunnen een plicht
      tot rapportage aan de Autoriteit omvatten.

      3 Bij verordening van de Autoriteit kunnen in het belang van de stralingsbescherming en beveiliging nadere regels
      worden gesteld ten aanzien van het beveiligingsplan en de beveiliging van het voorhanden hebben van radioactieve
      stoffen, bestemd voor handelingen waarvoor krachtens [de wet][ref2] of dit besluit een vergunning is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel1.1
      [ref2]: https://wetten.overheid.nl/BWBR0002402
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0040179
        artikel: '1.1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0002402
  - number: '4.8'
    text: >-
      1 De ondernemer zorgt ervoor dat met betrekking tot ingekapselde bronnen voldaan wordt aan de bij verordening van
      de Autoriteit gestelde regels.


      2 Hiertoe behoren in ieder geval regels met betrekking tot:


      a. maatregelen bij de binnenkomst van de bron op de locatie;


      b. eisen aan de constructie en verpakking van de bron;


      c. maatregelen ter voorkoming van gebruik van een bron door onbevoegden;


      d. de controle op de werking van een bron;


      e. het omgevingsdosisequivalenttempo dat een bron mag veroorzaken; en


      f. het verrichten van een lek- of besmettingstest.
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel4.8
  - number: '4.9'
    text: >-
      1 Van iedere overdracht van een hoogactieve bron wordt op een bij verordening van de Autoriteit te bepalen wijze
      kennisgegeven aan de Autoriteit.


      2 Bij verordening van de Autoriteit kan de verplichting, bedoeld in het eerste lid, worden uitgebreid
      tot andere daarbij aangewezen ingekapselde bronnen indien dat noodzakelijk wordt geacht met het oog op de
      stralingsbescherming.


      3 Bij de verordening kunnen regels worden gesteld omtrent de kennisgeving en het systeem van registratie en het
      bijhouden van de kennisgevingen.
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel4.9
  - number: '4.10'
    text: |-
      1 De fabrikant graveert in of stempelt op elke door hem gefabriceerde hoogactieve bron een code die als volgt is
      samengesteld:

      a. de aanduiding: NL;

      b. gevolgd door een aan de fabrikant door de Autoriteit toegekende vaste code;

      c. gevolgd door een door de fabrikant te bepalen, voor de bron onderscheidende code in Romeinse letters of
      Arabische cijfers.

      2 Een aanvraag om de toekenning van de in het eerste lid, onder b, bedoelde code wordt ingediend bij de Autoriteit.
      De aanvraag bevat de nummers van de krachtens [artikel 15, onder a][ref1], of [29, eerste lid, van de wet][ref2],
      aan de aanvrager verleende vergunningen.

      3 Het eerste lid is niet van toepassing, indien de afmeting van de bron voor de in dat lid bedoelde handeling te
      klein is.

      4 De fabrikant graveert de in het eerste lid bedoelde code tevens in de bronhouder van de desbetreffende bron of
      stempelt die code op die bronhouder.

      5 Het vierde lid is niet van toepassing indien de afmeting van de bronhouder voor de in het eerste lid bedoelde
      handeling te klein is, of indien de bronhouder bedoeld is voor hergebruik als behuizing van een bron. In dat
      laatste geval brengt de fabrikant informatie over ten minste de aard van de hoogactieve bron aan op, of aan, de
      bronhouder.

      6 De fabrikant brengt op, of aan, de broncontainer informatie aan over de aard van de hoogactieve bron.

      7 De fabrikant van een hoogactieve bron zorgt ervoor dat:

      a. de bron wordt vergezeld van:

      1°. schriftelijke informatie die bevestigt dat de bron voldoet aan het eerste lid en aan de krachtens
      [artikel 4.1, tweede lid][ref3], met betrekking tot de bron of de bronhouder gestelde regels;

      2°. kleurenfoto’s van het ontwerp van de bron en de bijbehorende bronhouder, en, voor zover van toepassing, van het
      ontwerp van de bijbehorende broncontainer en de bijbehorende apparatuur;

      b. de onder a bedoelde informatie en foto’s bij de levering van de bron worden verstrekt aan degene aan wie die
      bron wordt geleverd;

      c. de in het eerste en vierde lid bedoelde code en de krachtens [artikel 4.1, tweede lid][ref4], op de bron,
      bronhouder of broncontainer aangebrachte waarschuwingstekens en opschriften zo goed mogelijk leesbaar blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0040179#Artikel4.1
      [ref4]: https://wetten.overheid.nl/BWBR0040179#Artikel4.1
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel4.10
