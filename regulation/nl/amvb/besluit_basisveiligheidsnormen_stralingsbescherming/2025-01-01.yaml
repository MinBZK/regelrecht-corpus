  - number: '6.3'
    text: >-
      1 De ondernemer meldt de volgende gebeurtenissen en maatregelen onmiddellijk aan de Autoriteit:


      a. een verlies, diefstal of significante lekkage van een bron die leidt of kan leiden tot een blootstelling die
      niet mag worden verwaarloosd, of ongeoorloofd gebruik of de ongewilde verspreiding van die bron;


      b. de getroffen maatregelen na een verlies, diefstal, significante lekkage, ongeoorloofd gebruik of ongewilde
      verspreiding als bedoeld onder a of elke gebeurtenis waarbij een bron kan zijn beschadigd.


      2 Bij verordening van de Autoriteit kunnen met het oog op een goede uitvoering nadere regels worden gesteld omtrent
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel6.3
  - number: '6.4'
    text: |-
      1 De krachtens [artikel 9.8][ref1] vastgestelde referentieniveaus zijn van toepassing in een radiologische
      noodsituatie.

      2 Bij regeling van Onze Ministers kunnen nadere regels worden gesteld met betrekking tot optimalisatie in een
      radiologische noodsituatie.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel9.8
