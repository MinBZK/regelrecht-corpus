  - number: '6.18'
    text: |-
      1 Krachtens de [artikelen 6.15][ref1] en [6.16][ref2] geïnventariseerde en beoordeelde bestaande
      blootstellingsituaties die vanuit het oogpunt van stralingsbescherming aanleiding geven tot bezorgdheid en waarvoor
      niet een ondernemer verantwoordelijk is, worden bij regeling van Onze Ministers aangewezen.

      2 Voor krachtens het eerste lid aangewezen blootstellingsituaties stellen Onze Ministers een strategie vast die
      voorziet in een passend beheer van die blootstellingsituaties.

      3 Een strategie als bedoeld in het tweede lid staat in een redelijke verhouding tot de risico’s en doeltreffendheid
      van de te nemen beschermingsmaatregelen.

      4 Een strategie omvat in ieder geval:

      a. doelstellingen;

      b. bij of krachtens de [artikelen 7.38][ref3] en [9.10, eerste lid][ref4], vastgestelde referentieniveaus.

      5 De Autoriteit is belast met de gecoördineerde voorbereiding en het opstellen van een strategie als bedoeld in het
      tweede lid.

      6 Een strategie kan worden opgenomen in een programma als bedoeld in [artikel 6.19][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel6.15
