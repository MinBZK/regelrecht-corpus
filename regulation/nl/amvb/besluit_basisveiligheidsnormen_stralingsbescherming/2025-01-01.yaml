  - number: '5.7'
    text: |-
      1 Ten aanzien van de toezichthoudend medewerker stralingsbescherming zijn naast de algemene bepalingen van deze
      paragraaf de specifieke bepalingen van de [hoofdstukken 6][ref1] en [7][ref2] van toepassing.

      2 De ondernemer die een handeling uitvoert of laat uitvoeren die beroepsmatige blootstelling of blootstelling van
      een lid van de bevolking met zich brengt of kan brengen, zorgt ervoor dat deze handeling wordt uitgevoerd door of
      onder toezicht van een toezichthoudend medewerker stralingsbescherming.

      3 De taken van een toezichthoudend medewerker stralingsbescherming kunnen worden uitgevoerd door een
      stralingsbeschermingsdeskundige of een stralingsbeschermingseenheid.

      4 De ondernemer zorgt ervoor dat aan een in zijn onderneming werkzame toezichthoudend medewerker
      stralingsbescherming:

      a. adequate opleiding, training en voorlichting op het gebied van de stralingsbescherming specifiek voor de
      toepassing wordt gegeven, en

      b. regelmatig toepassingspecifieke bij- en nascholing wordt gegeven.

      5 De ondernemer houdt een administratie bij waarin de wijze van uitvoering van het vierde lid wordt gedocumenteerd
      en houdt deze ter beschikking van de krachtens [artikel 58 van de wet][ref3] aangewezen ambtenaren.

      6 Bij regeling van Onze Ministers kunnen eisen worden vastgesteld met betrekking tot de kennis, vaardigheden en
      bekwaamheden van een toezichthoudend medewerker stralingsbescherming voor daarbij genoemde toepassingen en de
      opleiding, training en voorlichting, bedoeld in het vierde lid. Daartoe kunnen behoren eisen met betrekking tot het
      volgen van opleidingen.

      7 Bij verordening van de Autoriteit kunnen met het oog op een goede uitvoering nadere regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0040179#Hoofdstuk7
      [ref3]: https://wetten.overheid.nl/BWBR0002402#Artikel58
