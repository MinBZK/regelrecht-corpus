  - number: '9.3'
    text: >-
      Dosisbeperkingen voor blootstelling van leden van de bevolking zijn in overeenstemming met de dosislimiet voor de
      som van de doses voor eenzelfde persoon uit alle ingevolge dit besluit toegestane handelingen.
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel9.3
  - number: '9.4'
    text: |-
      De ondernemer zorgt ervoor dat bij het verrichten van een handeling, behorend tot een categorie als genoemd in
      [artikel 3.10, tweede lid][ref1], waarvoor een registratie is vereist, voor personen op enig punt buiten de locatie
      ten gevolge van die handelingen tezamen een dosisbeperking van 10 microsievert effectieve dosis in een kalenderjaar
      wordt gehanteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel3.10
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel9.4
    references:
      - id: ref1
        bwb_id: BWBR0040179
        artikel: '3.10'
        hoofdstuk: '3'
        paragraaf: 3.2.3
        afdeling: '3.2'
  - number: '9.5'
    text: >-
      Met het oog op blootstelling van leden van de bevolking kunnen bij regeling van Onze Minister in overeenstemming
      met Onze Minister die het mede aangaat voor specifieke gevallen dosisbeperkingen worden vastgesteld voor de
      individuele dosis die leden van de bevolking ontvangen uit het geplande gebruik van bij die regeling aangewezen
      stralingsbronnen.
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel9.5
  - number: '9.6'
    text: >-
      Een ondernemer zorgt voor:


      a. de totstandkoming en instandhouding van een optimale bescherming van leden van de bevolking tegen blootstelling
      als gevolg van handelingen die onder zijn verantwoordelijkheid worden verricht;


      b. de acceptatie en goedkeuring voor ingebruikneming van adequate apparatuur en methoden voor het meten en bepalen
      van de blootstelling van leden van de bevolking en de radioactieve besmetting van het milieu;


      c. de controle van de effectiviteit en het onderhoud van de in onderdeel b bedoelde apparatuur en het toezicht op
      de periodieke kalibratie van meetinstrumenten, en


      d. advisering door de stralingsbeschermingsdeskundige bij de uitvoering van de in de onderdelen a tot en met c
      bedoelde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel9.6
  - number: '9.7'
    text: |-
      1 De ondernemer zorgt ervoor dat in omstandigheden waar een lid van de bevolking als gevolg van handelingen, die
      onder zijn verantwoordelijkheid worden verricht, aan besmetting of ioniserende straling binnen of buiten de locatie
      kan worden blootgesteld, voor de daarvoor in aanmerking komende plaatsen ramingen van de effectieve of equivalente
      doses worden gemaakt, met inachtneming van [artikel 4.29][ref1], en zo nodig metingen worden verricht.

      2 De ondernemer houdt een administratie bij waarin hij de resultaten aantekent van de metingen en de ramingen en
      gebruikt deze, indien nodig, voor het bepalen van de doses, bedoeld in het eerste lid en [artikel 9.2][ref2].

      3 Bij verordening van de Autoriteit kunnen nadere regels worden gesteld met betrekking tot de handelingen waarin de
      door de leden van de bevolking ontvangen doses moeten worden geraamd en of deze raming op basis van een «screening»
      dan wel op basis van een realistische berekening moet plaatsvinden.

      4 Bij verordening van de Autoriteit kunnen nadere regels worden gesteld met betrekking tot de inhoud, het beheer en
      de bewaartermijn van de administratie, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel4.29
      [ref2]: https://wetten.overheid.nl/BWBR0040179#Artikel9.2
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel9.7
