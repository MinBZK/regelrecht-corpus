  - number: '7.22'
    text: |-
      1 Als stralingsarts kan uitsluitend optreden een persoon die door de Autoriteit als stralingsarts is ingeschreven
      in een door de Autoriteit gehouden register.

      2 Een inschrijving als bedoeld in het eerste lid, geldt als erkenning in de zin van artikel 79, eerste lid, aanhef
      en onderdeel a, van de richtlijn.

      3 Bij regeling van Onze Minister van Sociale Zaken en Werkgelegenheid worden eisen vastgesteld met betrekking tot
      de kennis, vaardigheden en bekwaamheden waaraan moet worden voldaan om als stralingsarts in het register, bedoeld
      in het eerste lid, te worden ingeschreven en de gronden waarop en de gevallen waarin de inschrijving kan worden
      geweigerd of doorgehaald, met dien verstande dat alvorens een inschrijving wordt geweigerd of doorgehaald de
      desbetreffende persoon in de gelegenheid wordt gesteld om binnen een bij de regeling gestelde termijn aan te tonen
      dat alsnog aan de eisen wordt voldaan.

      4 Een inschrijving in een register als bedoeld in het eerste lid, kan worden geweigerd of doorgehaald, indien niet
      of niet volledig is voldaan aan de bij of krachtens [de wet][ref1] of dit besluit gestelde eisen.

      5 Bij verordening van de Autoriteit worden nadere regels gesteld omtrent:

      a. de wijze van inschrijving;

      b. de gegevens en bescheiden die bij een aanvraag tot inschrijving worden verstrekt.

      6 Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref2] is
      [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref3] niet van toepassing op een aanvraag tot inschrijving
      als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002402
      [ref2]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
