  - number: '7.6'
    text: |-
      1 De ondernemer zorgt ervoor dat in het kader van de risico-inventarisatie en -evaluatie, bedoeld
      in [artikel 5 van de Arbeidsomstandighedenwet][ref1], de beoordeling van de risico’s en alle overige
      bevindingen van de stralingsbeschermingsdeskundige ten aanzien van de onderwerpen, genoemd in
      [artikel 7.1, tweede, derde en vijfde lid][ref2], voor zover die de veiligheid en gezondheid van de werknemers
      betreffen, worden meegenomen en vastgelegd.

      2 Bij regeling van Onze Minister van Sociale Zaken en Werkgelegenheid kunnen nadere eisen
      worden vastgesteld met betrekking tot de risico-inventarisatie en -evaluatie, bedoeld in
      [artikel 5 van de Arbeidsomstandighedenwet][ref3].


