  - number: '12.6'
    text: |-
      1 Met ingang van het tijdstip van inwerkingtreding van dit besluit gelden protocollen als
      bedoeld in [artikel 65 van het Besluit stralingsbescherming][ref1] als protocollen als bedoeld in
      [artikel 8.14, eerste lid, onderdeel a][ref2].

      2 Met ingang van het tijdstip van inwerkingtreding van dit besluit gelden programma’s als bedoeld in
      [artikel 67, tweede lid, onderdeel b, van het Besluit stralingsbescherming][ref3] als programma’s voor
      kwaliteitsborging als bedoeld in [artikel 8.15, onderdeel c][ref4].

      3 De eisen aan de apparatuur, bedoeld in [artikel 8.15, onderdelen f en g][ref5], en de eis aan voor
      interventieradiologie en computertomografie gebruikte apparatuur om de informatie, bedoeld in artikel 8.15,
      onderdeel h, overeenkomstig dat onderdeel door te sturen naar het onderzoeksdossier, zijn niet van toepassing op
      apparatuur die is geïnstalleerd voor het tijdstip van inwerkingtreding van dit besluit.


