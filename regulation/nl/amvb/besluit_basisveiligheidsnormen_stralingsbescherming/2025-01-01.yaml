  - number: '7.16'
    text: |-
      1 De ondernemer zorgt ervoor dat afzonderlijk van iedere blootgestelde werknemer wordt geregistreerd:

      a. de naam, voornaam, geboortedatum, nationaliteit en het geslacht;

      b. gegevens omtrent het dienstverband van de werknemer;

      c. de indeling in categorie A- of B- werknemer;

      d. de resultaten van de individuele monitoring, bepaald overeenkomstig de [artikelen 7.12][ref1], [7.13][ref2],
      [7.14][ref3] en [7.31][ref4], inclusief de begin- en indien beschikbaar de einddatum van de individuele monitoring;

      e. de resultaten van de zonemonitoring, bedoeld in [artikel 7.13, tweede lid][ref5], die zijn gebruikt bij de
      bepaling van de effectieve of equivalente doses;

      f. in het geval van de in de [artikelen 7.14][ref6] en [7.31][ref7] bedoelde blootstellingen, rapporten met
      betrekking tot de omstandigheden en genomen maatregelen.

      2 De ondernemer zorgt ervoor dat de gegevens, bedoeld in het eerste lid, in ieder geval worden bewaard totdat
      de persoon op wie de gegevens betrekking hebben, de leeftijd van vijfenzeventig jaar heeft bereikt of zou hebben
      bereikt, maar ten minste dertig jaar nadat deze persoon de handelingen heeft beëindigd.

      3 Wat betreft externe werknemers rust de verplichting, bedoeld in het eerste en tweede lid, op hun werkgever.

      4 Indien nodig werken de ondernemer en de werkgever samen bij de uitvoering van dit artikel.


