  - number: '3.18'
    text: |-
      1 [Afdeling 3.2][ref1] is niet van toepassing op handelingen:

      a. met apparaten die een ingekapselde bron bevatten, op voorwaarde dat:

      1°. het apparaat behoort tot een bij verordening of beschikking van de Autoriteit goedgekeurd type;

      2°. het apparaat onder normale bedrijfsomstandigheden op 0,1 m van enige bereikbare buitenzijde daarvan geen hoger
      omgevingsdosisequivalenttempo veroorzaakt dan 1 microsievert per uur, en

      3°. de Autoriteit bij verordening of beschikking voorwaarden voor recycling of verwijdering heeft vastgesteld;

      b. met ieder toestel, mits:

      1°. deze een elektronenstraalbuis is voor visuele beeldweergave, of een ander elektrisch toestel dat werkt bij een
      potentiaalverschil van niet meer dan 30 kilovolt (kV), of behoort tot een bij verordening of beschikking van de
      Autoriteit goedgekeurd type, en

      2°. het toestel onder normale bedrijfsomstandigheden op 0,1 m van enige bereikbare buitenzijde van het toestel geen
      hoger omgevingsdosisequivalenttempo veroorzaakt dan 1 microsievert per uur;

      c. elektrische apparatuur die ioniserende straling uitzendt, en onderdelen bevat die bij een potentiaalverschil van
      niet meer dan 5 kV werken.

      2 Bij verordening van de Autoriteit kunnen met het oog op een goede uitvoering nadere regels worden gesteld met
      betrekking tot:

      a. de goedkeuring, bedoeld in het eerste lid, onderdeel a of b;

      b. de opslag en de verwijdering van ingekapselde bronnen als bedoeld in het eerste lid, onderdeel a.


