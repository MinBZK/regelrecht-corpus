  - number: '6.19'
    text: |-
      1 Ter uitvoering van een strategie als bedoeld in [artikel 6.18, tweede lid][ref1], stelt Onze Minister in
      overeenstemming met Onze Minister die het mede aangaat een uitvoeringsprogramma vast.

      2 De Autoriteit is belast met de gecoördineerde voorbereiding, het opstellen en het uitvoeren of mede uitvoeren
      van een uitvoeringsprogramma. Een strategie en uitvoeringsprogramma kunnen tegelijk worden voorbereid, vastgesteld
      en uitgevoerd.

      3 Bij de vaststelling van een strategie en uitvoeringsprogramma worden belanghebbenden betrokken met
      overeenkomstige toepassing van [afdeling 3.4 van de Algemene wet bestuursrecht][ref2].

      4 In een uitvoeringsprogramma wordt in ieder geval opgenomen een beschrijving van:

      a. de te nemen maatregelen en de verantwoordelijkheidsverdeling, met zo nodig een werkwijze om daartoe te komen;

      b. de wijze van coördinatie tussen de bestuursorganen en andere instanties die betrokken zijn bij de uitvoering van
      remediëringsmaatregelen en beschermingsmaatregelen.

      5 De vorm, omvang en duur van de in het vierde lid bedoelde beschermingsmaatregelen ter uitvoering van de strategie
      worden geoptimaliseerd.

      6 De gerealiseerde doses ten gevolge van de uitvoering van de strategie worden bepaald en beoordeeld door
      de Autoriteit en andere betrokken bestuursorganen. Daarbij worden, indien daar vanuit het oogpunt van
      stralingsbescherming aanleiding toe is, volgens een in het uitvoeringsprogramma vastgestelde of aangewezen methode
      verdere maatregelen overwogen om de bescherming te optimaliseren en blootstelling boven de referentieniveaus te
      verminderen.

      7 De voor de uitvoering van een strategie verantwoordelijke bestuursorganen en andere instanties:

      a. beoordelen periodiek op een in het uitvoeringsprogramma beschreven wijze de mate waarin de beschikbare
      corrigerende en beschermingsmaatregelen bijdragen aan het bereiken van de doelstellingen, alsmede de
      doeltreffendheid van geplande en toegepaste maatregelen;

      b. zorgen voor het verstrekken van informatie aan leden van blootgestelde bevolkingsgroepen over de mogelijke
      gezondheidsrisico’s en over de beschikbare middelen om hun eigen blootstelling te beperken;

      c. verschaffen leidraden voor het beheer van blootstellingen op individueel of lokaal niveau, en

      d. verschaffen informatie aan ondernemingen over passende manieren om concentraties en blootstellingen te
      controleren en om beschermingsmaatregelen te treffen in blootstellingsituaties met handelingen waarbij van nature
      voorkomend radioactief materiaal betrokken is en die niet als geplande blootstellingsituaties worden beheerd.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel6.18
