  - number: '7.20'
    text: |-
      1 De ondernemer zorgt ervoor dat de resultaten van de individuele monitoring, bepaald overeenkomstig de
      [artikelen 7.12][ref1], [7.13][ref2], [7.14][ref3] en [7.31][ref4] en desgevraagd de gegevens van onderliggende
      metingen worden verstrekt aan:

      a. de betrokken werknemer;

      b. de stralingsbeschermingsdeskundige en de toezichthoudend medewerker stralingsbescherming;

      c. de arbodienst en de stralingsarts, indien het een A-werknemer betreft;

      d. de werkgever, indien het een externe werknemer betreft.

      2 De ondernemer rapporteert de resultaten van de individuele monitoring, bepaald overeenkomstig
      [artikel 7.14, tweede, derde en vierde lid][ref5], onverwijld aan de in het eerste lid bedoelde personen en
      arbodienst en aan Onze Minister van Sociale Zaken en Werkgelegenheid of, indien het inrichtingen betreft waarvoor
      een vergunning krachtens [artikel 15, onder b, van de wet][ref6] is verleend, de Autoriteit of, indien het mijnbouw
      betreft, Onze Minister van Economische Zaken.

      3 Wat betreft externe werknemers rust de verplichting tot het verstrekken van de resultaten van de individuele
      monitoring, bedoeld in het eerste lid onder a, op de werkgever.

      4 Wat betreft externe werknemers werken de ondernemer en de werkgever samen bij de uitvoering van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel7.12
