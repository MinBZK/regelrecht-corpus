  - number: '8.5'
    text: |-
      1 De verwijzende persoon en de medisch deskundige beoordelen ieder op grond van hun specifieke verantwoordelijkheid
      en vooraf of een individuele medische blootstelling gerechtvaardigd is, met inachtneming van het specifieke doel
      van de blootstelling en de kenmerken van de betrokken persoon.

      2 In afwijking van [artikel 8.2, tweede lid][ref1], kan een medische blootstelling van een soort die ingevolge dat
      lid verboden is, in bijzondere omstandigheden en in afzonderlijk te beoordelen specifieke gevallen gerechtvaardigd
      worden. De afzonderlijke beoordeling van de rechtvaardiging, bedoeld in het eerste lid, wordt geregistreerd in het
      dossier van de betrokkene.

      3 De verwijzende persoon en de medisch deskundige verkrijgen, indien dat uitvoerbaar is, eerdere diagnostische of
      medische gegevens met betrekking tot de voorgenomen blootstelling en houden rekening met deze gegevens om onnodige
      blootstelling te voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel8.2
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel8.5
    references:
      - id: ref1
        bwb_id: BWBR0040179
        artikel: '8.2'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: '8.6'
    text: >-
      Een medisch-radiologische procedure bij een asymptomatische persoon die vroege opsporing van een ziekte tot doel
      heeft, vindt uitsluitend plaats nadat bijzondere aandacht is besteed aan de voorlichting van deze persoon en:


      a. in het kader van een bevolkingsonderzoek; of


      b. indien er een specifieke, gedocumenteerde rechtvaardiging aanwezig is die is opgesteld door de medisch
      deskundige in samenspraak met de verwijzende persoon en in overeenstemming met de toepasselijke richtlijnen van de
      beroepsgroep en met het bepaalde bij regeling van Onze Minister van Volksgezondheid, Welzijn en Sport.
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel8.6
  - number: '8.7'
    text: |-
      1 De medisch deskundige laat de blootstelling van een verzorger uitsluitend toe indien die blootstelling per saldo
      voldoende voordeel oplevert, waarbij hij rekening houdt met het directe gezondheidsvoordeel voor de patiënt, het
      voordeel voor de verzorger en de schade die de blootstelling kan veroorzaken.

      2 De medisch deskundige verstrekt een verzorger voorafgaand aan de blootstelling adequate informatie over de
      voordelen en de risico’s van de stralingsdosis bij medische blootstelling.

      3 Onze Minister van Volksgezondheid, Welzijn en Sport kan dosisbeperkingen en nadere regels vaststellen voor:

      a. blootstellingen van verzorgers;

      b. blootstellingen van personen die worden betrokken bij wetenschappelijk onderzoek als bedoeld in
      [artikel 1, eerste lid, van de Wet medisch-wetenschappelijk onderzoek met mensen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009408#Artikel1
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel8.7
    references:
      - id: ref1
        bwb_id: BWBR0009408
        artikel: '1'
  - number: '8.8'
    text: |-
      1 De klinisch fysicus:

      a. treedt op inzake aangelegenheden betreffende stralingsfysica of brengt daarover specialistisch advies uit met
      het oog op de uitvoering van de bepalingen van dit hoofdstuk en van [artikel 4.27, derde lid, onderdeel b][ref1];

      b. werkt samen en onderhoudt contact met de stralingsbeschermingsdeskundige.

      2 Afhankelijk van de medisch-radiologische handeling, neemt de klinisch fysicus de verantwoordelijkheid voor
      de dosimetrie op zich, met inbegrip van fysische metingen voor de beoordeling van de door de patiënt en andere
      personen die een medische blootstelling ondergaan ontvangen dosis, adviseert hij over medisch-radiologische
      apparatuur en draagt hij in het bijzonder bij tot:

      a. de optimalisatie van de stralingsbescherming van patiënten en andere personen die een medische blootstelling
      ondergaan, met inbegrip van de toepassing en het gebruik van diagnostische referentieniveaus;

      b. de bepaling en uitvoering van kwaliteitsborging van de medisch-radiologische apparatuur;

      c. acceptatietests voor medisch-radiologische apparatuur;

      d. de uitwerking van technische specificaties voor medisch-radiologische apparatuur en het ontwerp van de inbouw en
      opstelling daarvan;

      e. het toezicht op het medisch-radiologische ontwerp van de inbouw en opstelling van medisch-radiologische
      apparatuur;

      f. de analyse van gebeurtenissen die tot toevallige of onbedoelde blootstellingen leiden of kunnen leiden;

      g. de selectie van noodzakelijke apparatuur om metingen ten behoeve van stralingsbescherming uit te voeren;

      h. de opleiding van medische deskundigen en ander personeel in relevante aspecten van stralingsbescherming.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel4.27
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel8.8
    references:
      - id: ref1
        bwb_id: BWBR0040179
        artikel: '4.27'
        hoofdstuk: '4'
        paragraaf: 4.4.3
        afdeling: '4.4'
  - number: '8.9'
    text: >-
      1 De ondernemer draagt ervoor zorg dat voor medische blootstellingen voor radiotherapeutische doeleinden de te
      bestralen doelvolumes individueel worden gepland en de toediening op passende wijze wordt gecontroleerd, ermee
      rekening houdend dat de doses voor niet-doelvolumes en -weefsels zo laag zijn als redelijkerwijs mogelijk is,
      zonder aan het beoogde radiotherapeutische effect afbreuk te doen.


      2 De ondernemer draagt ervoor zorg dat aan een patiënt die een behandeling of diagnose met radionucliden ondergaat
      of diens vertegenwoordiger:


      a. informatie wordt verstrekt over de risico’s van ioniserende straling; en


      b. passende instructies worden verstrekt om de doses voor personen die met de patiënt in contact komen zo laag te
      houden als redelijkerwijs mogelijk is.


      3 De instructies, bedoeld in het tweede lid, onderdeel b, worden verstrekt voordat de betrokkene het ziekenhuis,
      kliniek of een vergelijkbare instelling verlaat waar de behandeling of diagnose heeft plaatsgevonden. Bij een
      behandeling met radionucliden worden de instructies schriftelijk verstrekt.
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel8.9
  - number: '8.10'
    text: |-
      Onverminderd [artikel 8.7, derde lid, onderdeel b][ref1], en het bepaalde bij of krachtens de
      [Wet medisch-wetenschappelijk onderzoek met mensen][ref2]:

      a. draagt de ondernemer er zorg voor dat een dosisbeperking wordt vastgesteld
      voor personen die worden betrokken bij wetenschappelijk onderzoek als bedoeld in
      [artikel 1, eerste lid, van de Wet medisch-wetenschappelijk onderzoek met mensen][ref3], voor wie geen direct
      medisch voordeel van de blootstelling verwacht wordt;

      b. beschouwt de medisch deskundige voordat de blootstelling plaatsvindt de betrokken dosisniveaus op individuele
      basis, in het geval van patiënten die toestemming hebben gegeven om een experimentele medische behandeling te
      ondergaan en die naar verwachting hiervan diagnostisch of therapeutisch voordeel zullen ondervinden.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel8.7
      [ref2]: https://wetten.overheid.nl/BWBR0009408
      [ref3]: https://wetten.overheid.nl/BWBR0009408#Artikel1
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel8.10
