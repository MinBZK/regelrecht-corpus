      1 De Autoriteit of Onze Minister die het aangaat zorgt er, onverminderd [artikel 7.30][ref1], voor dat de
      bedrijfsleiding van ondernemingen waarvan het aannemelijk is dat er weesbronnen worden aangetroffen of verwerkt,
      geïnformeerd wordt over de mogelijkheid van een confrontatie met een weesbron.

      2 Onder ondernemingen als bedoeld in het eerste lid worden in ieder geval verstaan locaties en installaties
      waar aanzienlijke hoeveelheden metaalfabricaten, metaalafval of schroot worden opgeslagen, bewerkt, verwerkt of
      overgeslagen.

      3 De Autoriteit of Onze Minister die het aangaat zorgt ervoor dat:

      a. informatie beschikbaar wordt gesteld waarmee de bevolking bewust wordt gemaakt van de mogelijke aanwezigheid van
      weesbronnen en de risico’s daarvan;

      b. richtsnoeren worden uitgevaardigd voor werknemers en leden van de bevolking over de te nemen maatregelen bij het
      aantreffen van een weesbron of vermoeden daarvan, waaronder het informeren van de Autoriteit.

      4 De Autoriteit of Onze Minister die het aangaat zorgt voor het onmiddellijk na een aangifte als bedoeld in
      [artikel 22][ref2] of [33 van de wet][ref3] ter beschikking stellen van specifieke technische adviezen en
      assistentie in situaties als bedoeld in het derde lid, onder b.


