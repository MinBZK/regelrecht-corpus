  - number: '6.20'
    text: |-
      1 Met toepassing van [artikel 6.16][ref1] stelt Onze Minister in overeenstemming met Onze
      Minister die het mede aangaat een nationaal actieprogramma radon vast. Op de voorbereiding is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] van toepassing. Het programma wordt geactualiseerd indien
      daar vanuit het oogpunt van stralingsbescherming aanleiding toe is.

      2 Het nationale actieprogramma radon heeft als doel het overeenkomstig de referentieniveaus, bedoeld in
      [artikel 9.10, zesde of zevende lid][ref3], respectievelijk [artikel 7.38, eerste of zevende lid][ref4], beheersen
      van langetermijnrisico’s door blootstelling aan radon, waaronder radon dat vrijkomt uit de bodem, bouwmaterialen of
      water in woningen, in gebouwen met toegang voor het publiek, respectievelijk op werkplekken.

      3 De Autoriteit is belast met de gecoördineerde voorbereiding, het opstellen en het mede uitvoeren van het
      nationaal actieprogramma radon.

      4 Het nationaal actieprogramma radon bevat in ieder geval de volgende elementen en kan indien passend een of meer
      van de overige elementen, genoemd in [bijlage 8][ref5], omvatten:

      a. het identificeren van gebieden waar de radonconcentratie als jaargemiddelde het nationale referentieniveau,
      bedoeld in het tweede lid, in een significant aantal woningen en voor het publiek toegankelijke gebouwen of
      werkplekken kan overschrijden;

      b. het identificeren van woningen, gebouwen met toegang voor het publiek en werkplekken in deze gebieden waar de
      radonconcentratie als jaargemiddelde hoger is dan het toepasselijke nationale referentieniveau, bedoeld in het
      tweede lid;

      c. waar nodig, voorstellen voor maatregelen gericht op het verlagen van de radonconcentratie in deze woningen,
      gebouwen en werkplekken met technische en andere maatregelen;

      d. het waar nodig, nemen of laten nemen van passende maatregelen om zoveel mogelijk te voorkomen dat radon nieuwe
      woningen, gebouwen met toegang voor het publiek en werkplekken binnendringt.

      5 Het nationale actieprogramma radon bevat voorts de volgende elementen:

      a. het beschikbaar stellen van informatie over de blootstelling aan radon in woningen, gebouwen met toegang voor
      het publiek en werkplekken en over de bijbehorende gezondheidsrisico’s;

      b. het beschikbaar stellen van informatie over het belang van radonmetingen;

      c. het beschikbaar stellen van informatie over de beschikbare technische middelen om bestaande radonconcentraties
      in woningen en gebouwen met toegang voor het publiek en op de werkplek terug te dringen.


