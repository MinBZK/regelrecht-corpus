  - number: '6.1'
    text: De ondernemer meldt elk stralingsincident, ongeval of radiologische noodsituatie onmiddellijk aan de Autoriteit.
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel6.1
  - number: '6.2'
    text: |-
      1 De ondernemer zorgt ervoor dat een handeling waarbij er een te voorzien risico is dat personen
      onbedoeld aan overmatige blootstelling kunnen worden blootgesteld, slechts wordt verricht nadat een
      stralingsbeschermingsdeskundige hierover is geraadpleegd.

      2 Indien naar het oordeel van een stralingsbeschermingsdeskundige of toezichthoudend medewerker
      stralingsbescherming de blootstelling, bedoeld in het eerste lid, zich voordoet of dreigt voor te doen, zorgt de
      ondernemer ervoor dat onmiddellijk:

      a. de handeling wordt gestaakt;

      b. gevaarlijke plaatsen worden ontruimd, en

      c. deze situatie overeenkomstig [artikel 6.1][ref1] wordt gemeld.

      3 De Autoriteit stelt de krachtens [artikel 58][ref2] of [65 van de wet][ref3] aangewezen toezichthouders en andere
      betrokken instanties zo spoedig mogelijk op de hoogte van een melding als bedoeld in [artikel 6.1][ref4]. Onze
      Minister kan instanties als bedoeld in de eerste volzin aanwijzen.

      4 De ondernemer beëindigt de maatregelen als bedoeld in het tweede lid, onder a of b, slechts in overeenstemming
      met de stralingsbeschermingsdeskundige of toezichthoudend medewerker stralingsbescherming en niet eerder dan
      een week nadat de melding is gedaan, tenzij de Autoriteit of een ander bevoegd bestuursorgaan of instantie die
      ingevolge het derde lid van de melding op de hoogte is gebracht, binnen die termijn een andere termijn voor het
      beëindigen van de maatregelen heeft gesteld.

      5 De ondernemer neemt de maatregelen die nodig zijn om nieuwe stralingsincidenten, ongevallen of radiologische
      noodsituaties te voorkomen en doet zo nodig onderzoek. Zo spoedig mogelijk na de melding wordt de Autoriteit of
      het andere bevoegde bestuursorgaan of de instantie in kennis gesteld van de onderzoeksresultaten en corrigerende
      maatregelen.

      6 In gevallen behorend tot een bij regeling van Onze Ministers aangewezen categorie, is de ondernemer verplicht
      tot het invoeren en in werking houden van een systeem voor het registreren en analyseren van stralingsincidenten,
      ongevallen of radiologische noodsituaties.

      7 Bij verordening van de Autoriteit kunnen met het oog op een goede uitvoering nadere regels worden gesteld met
      betrekking tot de uitvoering van [artikel 6.1][ref5] en het eerste tot en met zesde lid.


