  - number: '2.4'
    text: |-
      1 Bij handelingen of maatregelen die zowel beroepsmatige blootstelling als blootstelling van leden van de bevolking
      met zich brengen, worden bij de beslissing omtrent rechtvaardiging beide vormen van blootstelling in aanmerking
      genomen.

      2 Bij de rechtvaardiging van een categorie of soort handelingen die medische blootstelling met zich brengen
      wordt rekening gehouden met medische blootstelling en, voor zover relevant, de daaraan gerelateerde beroepsmatige
      blootstelling en blootstelling van leden van de bevolking.

      3 De rechtvaardiging van handelingen die medische blootstelling met zich brengen vindt voorts plaats op het niveau
      van de individuele medische blootstelling, overeenkomstig de [artikelen 8.2][ref1] en [8.5][ref2].

      4 Bij regeling van Onze Ministers kunnen met het oog op een goede uitvoering nadere regels worden gesteld met
      betrekking tot het eerste, tweede of derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel8.2
      [ref2]: https://wetten.overheid.nl/BWBR0040179#Artikel8.5
