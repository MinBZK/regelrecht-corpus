  - number: '5.8'
    text: |-
      De ingevolge dit besluit door een toezichthoudend medewerker stralingsbescherming te verrichten taken worden
      uitsluitend uitgevoerd door een persoon die beschikt over een diploma, certificaat of een ander getuigschrift ter
      afsluiting van een opleiding op het gebied van stralingsbescherming, specifiek voor de toepassing, behaald bij:

      a. een erkende instelling als bedoeld in [artikel 5.11][ref1], of

      b. een door een andere lidstaat van de Europese Unie of andere staat die partij is bij de Overeenkomst betreffende
      de Europese Economische Ruimte of Zwitserland erkende of aangewezen instelling of opleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel5.11
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel5.8
