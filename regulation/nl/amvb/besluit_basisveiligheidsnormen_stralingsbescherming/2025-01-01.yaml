  - number: '6.21'
    text: |-
      1 Bij regeling van Onze Minister in overeenstemming met Onze Minister die het mede aangaat kunnen, rekening houdend
      met de in [bijlage 9][ref1] genoemde materialen, bouwmaterialen worden aangewezen die aandacht behoeven vanuit het
      oogpunt van de stralingsbescherming, vanwege de door deze materialen uitgezonden gammastraling, die bij toepassing
      van deze bouwmaterialen kan leiden tot een overschrijding van het referentieniveau van 1 millisievert binnenshuis
      in een kalenderjaar, bedoeld in [artikel 9.10, achtste lid][ref2].

      2 Alvorens krachtens het eerste lid aangewezen bouwmaterialen in de handel te brengen bepaalt de ondernemer met
      toepassing van een bij verordening van de Autoriteit aangewezen methode of de door deze bouwmaterialen uitgezonden
      gammastraling, bovenop de externe blootstelling buitenshuis, binnenshuis het referentieniveau van 1 millisievert in
      een kalenderjaar, bedoeld in het eerste lid, niet overschrijdt.

      3 Bij regeling van Onze Minister in overeenstemming met Onze Minister die het mede aangaat wordt, in geval van de
      kans dat het referentieniveau van 1 millisievert in een kalenderjaar mogelijkerwijs wordt overschreden, bepaald hoe
      de ondernemer kan voorkomen dat het referentieniveau wordt overschreden ten gevolge van de externe blootstelling
      binnenshuis aan door bouwmaterialen uitgezonden gammastraling.

      4 Op verzoek van de Autoriteit of een ander bevoegd bestuursorgaan verstrekt de ondernemer de resultaten van de
      krachtens het tweede lid uitgevoerde bepaling alsmede de overige bij verordening van de Autoriteit of door een
      ander bevoegd bestuursorgaan aangewezen gegevens.

      5 Bij verordening van de Autoriteit kunnen nadere regels worden gesteld met het oog op een goede uitvoering van het
      eerste tot en met vierde lid.


