  - number: '7.19'
    text: |-
      1 De ondernemer zorgt ervoor dat de resultaten van de individuele monitoring, bepaald overeenkomstig de
      [artikelen 7.12][ref1], [7.13][ref2], [7.14][ref3] en [7.31][ref4], aan de in [artikel 7.17, tweede lid][ref5]
      bedoelde instelling wordt gezonden.

      2 De ondernemer zorgt ervoor dat een blootgestelde werknemer bij handelingen buiten Nederland zijn persoonlijk
      dosiscontrolemiddel, bedoeld in [artikel 7.12][ref6], gebruikt tijdens die handelingen.

      3 Een werkgever zorgt ervoor dat zijn blootgestelde werknemer bij handelingen onder de verantwoordelijkheid van een
