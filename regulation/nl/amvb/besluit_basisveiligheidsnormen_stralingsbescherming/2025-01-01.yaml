  - number: '3.4'
    text: |-
      1 Met betrekking tot een in [artikel 3.8][ref1], [3.10][ref2] of [3.13][ref3] genoemde categorie van handelingen,
      maatregelen of blootstellingsituaties waarvoor een vergunningplicht, registratieplicht of kennisgevingsplicht
      geldt, kunnen bij regeling van Onze Ministers de tot die categorie behorende specifieke handelingen, maatregelen of
      blootstellingsituaties worden aangewezen.

      2 In gevallen waarin:

      a. een nieuw type handeling of maatregel of een nieuwe soort blootstellingsituatie niet kan worden aangewezen onder
      een categorie als bedoeld in het eerste lid, of

      b. de bestaande indeling van een categorie niet of niet langer in een redelijke verhouding tot de aard en omvang
      van het risico staat,

      en de totstandkoming van een wijziging van dit besluit niet kan worden afgewacht, kan in afwijking van het eerste
      lid bij regeling van Onze Ministers een categorie worden toegevoegd of de bestaande indeling van een categorie
      worden gewijzigd.

      3 Onze Ministers zorgen ervoor dat tegelijk met de vaststelling van een regeling als bedoeld in het tweede lid
      het ontwerp van een algemene maatregel van bestuur met dezelfde inhoud ter beoordeling aan de ministerraad wordt
      aangeboden. De regeling blijft, behoudens eerdere intrekking, van kracht totdat de algemene maatregel van bestuur
      in werking treedt, doch uiterlijk tot twee jaar na het tijdstip van inwerkingtreding van de regeling.

      4 Indien binnen een locatie, onder verantwoordelijkheid van een ondernemer, meerdere handelingen plaatsvinden
      die tot verschillende in [artikel 3.8][ref4] of [3.10][ref5] genoemde categorieën van handelingen behoren, is in
      afwijking van het eerste lid een vergunning voor het geheel van die handelingen vereist, waarbij de zwaarste bron
      bepalend is voor de op de aanvraag van toepassing zijnde procedure. Onze Minister kan met het oog op een goede
      uitvoering nadere regels stellen en bepalen dat in daarbij aangewezen gevallen een complexvergunning wordt vereist.

      5 Indien binnen een locatie, onder verantwoordelijkheid van een ondernemer, op enig moment handelingen met meerdere
      bronnen plaatsvinden vindt sommatie plaats volgens een bij verordening van de Autoriteit aan te wijzen of vast te
      stellen methode.

      6 Indien binnen een locatie in opdracht van degene die voor die locatie verantwoordelijk is handelingen worden
      verricht door een andere persoon die in het bezit is van een eigen vergunning of registratie voor het verrichten
      van de betrokken handelingen, is degene die verantwoordelijk is voor die locatie gehouden tot medewerking aan de
      met het oog op stralingsbescherming voor die handelingen gestelde regels en voorschriften. Bij verordening van de
      Autoriteit kunnen met het oog op een goede uitvoering nadere regels worden gesteld.


