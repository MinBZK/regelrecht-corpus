    text: |-
      1 Het is verboden om een handeling met betrekking tot een toestel of versneller, behorend tot een in
      [artikel 3.8][ref1] genoemde categorie, te verrichten:

      a. zonder daartoe door de Autoriteit verleende vergunning;

      b. in strijd met een aan de vergunning verbonden voorschrift of beperking of met de bij of krachtens [de wet][ref2]
      met het oog op stralingsbescherming ten aanzien van de desbetreffende handeling dan wel toestel of versneller
      gestelde regels en voorschriften.

      2 Als krachtens [artikel 29 van de wet][ref3] als vergunningplichtig aangewezen radioactieve stoffen en gevallen
      van handelingen met die stoffen worden aangewezen de radioactieve stoffen en handelingen, behorend tot een in
      [artikel 3.8][ref4] genoemde categorie.


