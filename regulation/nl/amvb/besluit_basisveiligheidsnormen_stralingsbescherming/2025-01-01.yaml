  - number: '5.13'
    text: |-
      1 De Autoriteit zorgt ervoor dat de hulpverleners die zijn opgenomen in een nationaal crisisplan als bedoeld in
      [artikel 6.5][ref1]:

      a. worden voorgelicht over stralingsbescherming, over de risico’s die hun inzet voor hun gezondheid met zich brengt
      en over de bij een stralingsincident, radiologische noodsituatie of ongeval te nemen voorzorgsmaatregelen,

      b. regelmatig een passende opleiding met betrekking tot stralingsbescherming volgen;

      c. regelmatig een passende opleiding met betrekking tot rampenbestrijding volgen overeenkomstig de afspraken,
      bedoeld in [artikel 40 van de wet][ref2].

      2 Het eerste lid is van overeenkomstige toepassing voor de ondernemer die verantwoordelijk is voor hulpverleners
      die zijn opgenomen in een bedrijfsnoodplan als bedoeld in [artikel 6.7][ref3].

      3 Zodra zich een stralingsincident, radiologische noodsituatie of ongeval voordoet wordt specifieke en passende
      informatie omtrent het stralingsincident, de radiologische noodsituatie of het ongeval en de omstandigheden daarvan
      aan de hulpverleners verstrekt.

      4 De voorlichting, bedoeld in het eerste en tweede lid, betreft in elk geval de verschillende mogelijke
      stralingsincidenten, radiologische noodsituaties of ongevallen en het soort inzet.

      5 Bij regeling van Onze Minister en Onze Minister die het aangaat kunnen nadere regels worden gesteld met
      betrekking tot de aard en inhoud van de voorlichting en opleiding, bedoeld in het eerste lid, en de specifieke
      informatie, bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel6.5
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel40
      [ref3]: https://wetten.overheid.nl/BWBR0040179#Artikel6.7
