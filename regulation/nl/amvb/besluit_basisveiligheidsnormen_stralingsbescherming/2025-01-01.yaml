  - number: '7.35'
    text: |-
      1 [Artikel 7.4][ref1] is niet van toepassing op leerlingen en studerenden die ten minste 16 jaar, maar nog geen
      18 jaar zijn, en die uit hoofde van hun opleiding verplicht zijn een handeling te verrichten en die daarbij een
      blootstelling kunnen ondergaan die hoger is dan een van de dosislimieten, genoemd in [artikel 7.3][ref2].

      2 De ondernemer zorgt ervoor dat voor de leerlingen en studerenden, bedoeld in het eerste lid, ten gevolge
      van handelingen die onder zijn verantwoordelijkheid worden verricht, de volgende individuele doses niet worden
      overschreden:

      a. een effectieve dosis van 6 millisievert in een kalenderjaar, en met inachtneming daarvan:

      b. een equivalente dosis van:

      1°. 15 millisievert in een kalenderjaar voor de ooglens;

      2°. 150 millisievert in een kalenderjaar voor de huid, gemiddeld over enig blootgesteld huidoppervlak van 1 cm2; of

      3°. 150 millisievert in een kalenderjaar voor de extremiteiten.

      3 In geval van inwendige besmetting wordt de effectieve volgdosis toegewezen aan het jaar van inname.

      4 Indien een van de dosislimieten, genoemd in het tweede lid, overschreden wordt, rapporteert de ondernemer dit
      aan Onze Minister van Sociale Zaken en Werkgelegenheid of, indien het inrichtingen betreft waarvoor een vergunning
      krachtens [artikel 15, onder b, van de wet][ref3] is verleend, de Autoriteit of, indien het mijnbouw betreft, Onze
      Minister van Economische Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel7.4
      [ref2]: https://wetten.overheid.nl/BWBR0040179#Artikel7.3
      [ref3]: https://wetten.overheid.nl/BWBR0002402#Artikel15
