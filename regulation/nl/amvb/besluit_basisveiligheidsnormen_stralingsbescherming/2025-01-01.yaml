  - number: '3.14'
    text: >-
      1 Bij een vergunning voor het lozen van radioactieve stoffen in de lucht, het openbare riool of het
      oppervlaktewater ten gevolge van handelingen met radioactieve stoffen of radioactieve materialen, worden
      emissiegrenswaarden vastgesteld voor het lozen en worden voorwaarden gesteld die:


      a. rekening houden met de resultaten van de optimalisatie van stralingsbescherming, en


      b. aansluiten bij de goede praktijken in vergelijkbare situaties.


      2 Bij de vergunning wordt een verplichting opgelegd om het lozen van radioactieve stoffen in de lucht of het water
      op basis van metingen of berekeningen te beoordelen en de resultaten daarvan aan de Autoriteit kenbaar te maken.


      3 Bij regeling van Onze Minister kunnen met het oog op een goede uitvoering nadere regels worden gesteld met
      betrekking tot het eerste of tweede lid.
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel3.14
  - number: '3.15'
    text: |-
      1 Onverminderd de [artikelen 3.5 tot en met 3.7][ref1] omvat een vergunning voor een handeling waarbij een
      hoogactieve bron is betrokken voorschriften of beperkingen met betrekking tot:

      a. de toedeling van verantwoordelijkheden;

      b. de vereisten ten aanzien van voorlichting en opleiding;

      c. de prestatie-eisen voor de bron, de bronhouder, de broncontainer en aanvullende uitrusting;

      d. de eisen ten aanzien van noodprocedures en communicatieverbindingen of -kanalen;

      e. de te volgen operationele procedures;

      f. het onderhoud van de uitrusting, de bron en de broncontainer; en

      g. een toereikend beheer van niet meer in gebruik zijnde bronnen, met inbegrip van overeenkomsten als bedoeld in
      [artikel 3.16][ref2], met het oog op de overdracht van een dergelijke bron aan een fabrikant, een leverancier,
      een andere daartoe gemachtigde ondernemer of een voorziening voor opslag of verwijdering, overeenkomstig
      [artikel 10.9][ref3].

      2 Bij de beslissing op de aanvraag om vergunning wordt tevens in aanmerking genomen de constructieve veiligheid van
      de desbetreffende locatie of het bouwwerk en de wijze van plaatsing van een bron, mede met het oog op calamiteiten.


