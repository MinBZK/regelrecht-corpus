  - number: '5.14'
    text: |-
      1 De ondernemer zorgt ervoor dat medisch deskundigen en andere personen die betrokken zijn bij de praktische
      onderdelen van medisch-radiologische procedures, een passende opleiding, training en voorlichting krijgen met
      het oog op medisch-radiologische handelingen en passende bekwaamheden met betrekking tot stralingsbescherming
      ontwikkelen. Medisch deskundigen volgen deze opleiding, training en voorlichting bij een erkende instelling als
      bedoeld in [artikel 5.11][ref1].

      2 Personen die opleidingen en trainingen als bedoeld in het eerste lid volgen, kunnen deelnemen aan de toepassing
      in de praktijk van de in [hoofdstuk 8][ref2] genoemde medisch-radiologische procedures.

      3 Deskundigen en personen als bedoeld in het eerste lid volgen passende bij- en nascholing.

      4 Bij regeling van Onze Minister van Volksgezondheid, Welzijn en Sport kunnen met het oog op een goede uitvoering
      nadere regels worden gesteld met betrekking tot de uitvoering van het eerste tot en met derde lid. Daartoe kunnen
      behoren regels omtrent de organisatie van een opleiding in verband met het klinische gebruik van nieuwe technieken
      en de relevante eisen op het gebied van de stralingsbescherming.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel5.11
      [ref2]: https://wetten.overheid.nl/BWBR0040179#Hoofdstuk8
