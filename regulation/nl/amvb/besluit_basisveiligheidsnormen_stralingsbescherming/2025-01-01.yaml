  - number: '3.6'
    text: |-
      1 Een aanvraag maakt deel uit van de vergunning, voor zover dat in de vergunning is bepaald.

      2 Een aanvraag om een vergunning voor een of meer handelingen binnen een locatie heeft geen betrekking op de
      handelingen die binnen die locatie worden verricht door een andere persoon dan de aanvrager die in het bezit is van
      een eigen vergunning voor het verrichten van de betrokken handelingen.

      3 Een aanvraag vindt plaats langs elektronische of schriftelijke weg. Onverminderd
      [artikel 4:2 van de Algemene wet bestuursrecht][ref1] worden bij de aanvraag de voor de beoordeling van de
      handeling noodzakelijke gegevens verstrekt, waaronder in ieder geval worden verstaan gegevens met betrekking tot:

      a. het soort handeling en het voorgenomen tijdstip en de wijze van uitvoering;

      b. het type, de aard en de plaats van de bron;

      c. het besluit of de regeling waarbij de handeling gerechtvaardigd is of een krachtens [artikel 2.5][ref2]
      ingediend verzoek om rechtvaardiging van die handeling;

      d. de naam en het adres van de ondernemer onder wiens verantwoordelijkheid de handeling wordt uitgevoerd;

      e. een beveiligingsplan als bedoeld in [artikel 4.7][ref3], een bedrijfsnoodplan als bedoeld in [artikel 6.7][ref4]
      of een beëindigingsplan als bedoeld in [artikel 10.8][ref5] in gevallen, behorend tot een bij regeling van Onze
      Minister aangewezen categorie. De aanwijzing staat in een passende verhouding tot de aard en zwaarte van de
      betrokken risico’s, overeenkomstig de graduele benadering, bedoeld in [artikel 1.1][ref6].

      4 Bij verordening van de Autoriteit kunnen nadere regels worden gesteld over de wijze van aanvragen, de te
      verstrekken gegevens en de wijze van verstrekking. Onverminderd [artikel 68 van de wet][ref7] worden als
      gegevens als bedoeld in [artikel 19.3, eerste lid, laatste volzin, van de Wet milieubeheer][ref8] aangewezen: een
      beveiligingsplan als bedoeld in [artikel 4.7][ref9], een bedrijfsnoodplan als bedoeld in [artikel 6.7][ref10],
      een beëindigingsplan als bedoeld in [artikel 10.8][ref11], een risico-inventarisatie en evaluatie als bedoeld in
      [artikel 5 van de Arbeidsomstandighedenwet][ref12] en overige gegevens waarvan de openbaarmaking in strijd is met
      het belang van de veiligheid of beveiliging. Indien toepassing wordt gegeven aan de bevoegdheid, bedoeld in artikel
      19.3 van de Wet milieubeheer, wordt een aangepast rapport beschikbaar gesteld, dat ten minste algemene informatie
      over risico’s van ongevallen, de mogelijke gevolgen voor de menselijke gezondheid en het milieu bij een ongeval en
      in voorkomende gevallen de bevindingen bevat.

      5 Een vergunning kan onder beperkingen worden verleend. Aan de vergunning kunnen voorschriften worden verbonden.

      6 Onverminderd de [artikelen 18a][ref13], [31, vierde lid][ref14], en [34, zevende lid, van de wet][ref15], kan een
      vergunning geheel of gedeeltelijk worden ingetrokken indien er gedurende twee jaar geen handelingen zijn verricht
      met gebruikmaking van de vergunning.

      7 De houder van een vergunning is verplicht zo mogelijk voorafgaand doch in elk geval binnen vier weken na
      een wijziging van gegevens ten opzichte van de gegevens, opgenomen in de documenten die deel uitmaken van de
      vergunning, aan de Autoriteit kennis te geven van die wijziging. Bij verordening van de Autoriteit kunnen met het
      oog op een goede uitvoering nadere regels worden gesteld over de wijze van kennisgeving, de te verstrekken gegevens
      en de wijze van verstrekking.

      8 Indien handelingen waarvoor een vergunning is verleend niet meer worden verricht, wordt door de ondernemer
      zo spoedig mogelijk, doch uiterlijk binnen zes weken na het beëindigen van de handelingen, een kennisgeving van
      beëindiging aan de Autoriteit gedaan.


