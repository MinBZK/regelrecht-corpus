  - number: '5.5'
    text: |-
      1 De ingevolge dit besluit door een stralingsbeschermingsdeskundige te verrichten taken worden uitsluitend
      uitgevoerd door een persoon die als een zodanige deskundige voor de uitvoering van de betrokken taken op aanvraag
      door de Autoriteit is ingeschreven in het register, bedoeld in [artikel 69, tweede lid, van de wet][ref1].

      2 Een inschrijving als bedoeld in het eerste lid geldt als erkenning in de zin van artikel 79, eerste lid, aanhef
      en onderdeel c, van de richtlijn.

      3 Bij regeling van Onze Ministers worden eisen vastgesteld met betrekking tot de kennis, vaardigheden en
      bekwaamheden waaraan moet worden voldaan om als stralingsbeschermingsdeskundige in het register te worden
      ingeschreven. De eisen kunnen verschillen voor de verschillende niveaus van deskundigheid, bedoeld in
      [artikel 5.4, derde lid][ref2], afhankelijk van de taken van de stralingsbeschermingsdeskundige, of de specifieke
      toepassing. Bij de regeling worden tevens eisen gesteld met betrekking tot de herregistratie. Daartoe kunnen
      behoren eisen met betrekking tot het volgen van opleidingen.

      4 Bij verordening van de Autoriteit worden regels gesteld omtrent:

      a. de wijze van inschrijving;

      b. de gegevens en bescheiden die bij een aanvraag tot inschrijving worden verstrekt, waaronder in elk
      geval kan worden verstaan een diploma van een erkende instelling als bedoeld in [artikel 5.11][ref3] met
      betrekking tot een opleiding tot coördinerend deskundige of algemeen coördinerend deskundige als bedoeld in
      [artikel 7b van het Besluit stralingsbescherming][ref4], zoals dat luidde voor de inwerkingtreding van dit besluit.

      5 Een inschrijving kan worden geweigerd of doorgehaald, indien niet of niet volledig voldaan wordt aan de bij of
      krachtens [de wet][ref5] of dit besluit gestelde eisen, met dien verstande dat alvorens een inschrijving wordt
      geweigerd of doorgehaald de aanvrager in de gelegenheid wordt gesteld om binnen een daarbij gestelde redelijke
      termijn aan te tonen dat alsnog aan de eisen wordt voldaan.

      6 Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref6] is
      [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref7] niet van toepassing op een aanvraag tot een
      inschrijving als bedoeld in het eerste lid.


