  - number: '3.10'
    text: |-
      1 Onder de registratieplicht, bedoeld in [artikel 3.9, eerste lid][ref1], vallen handelingen, behorend tot een in
      het tweede of derde lid genoemde categorie.

      2 De hierna genoemde categorieën van handelingen met een toestel of versneller:

      a. handelingen met een elektronenmicroscoop;

      b. het uitsluitend in opslag hebben van een toestel of versneller ten behoeve van handel, distributie en het in- en
      uitbouwen ervan, zonder dat het toestel of de versneller onder hoogspanning gebruikt wordt;

      c. handelingen met een toestel dat gebruikt wordt voor onderwijsdoeleinden, welk toestel onder normale
      bedrijfsomstandigheden op 0,1 meter afstand van enig bereikbare buitenzijde van het toestel geen hoger
      omgevingsdosisequivalenttempo veroorzaakt dan 1 microsievert per uur en dat behoort tot een type dat bij
      verordening van de Autoriteit is goedgekeurd, overeenkomstig bij die verordening gestelde regels;

      d. handelingen met een toestel dat gebruikt wordt voor diergeneeskundige diagnostiek, uitsluitend voor zover het
      veterinaire toepassingen betreft, met een verticaal neerwaarts gerichte bundel met een vaste focus-film afstand op
      een vaste locatie;

      e. handelingen met een toestel dat gebruikt wordt voor tandheelkundige diagnostiek, uitsluitend voor zover het
      tandheelkundige toepassingen betreft waarbij blootstelling van personen of dieren plaatsvindt, op een vaste
      locatie, met uitzondering van een toestel dat gebruik maakt van computertomografietechniek;

      f. handelingen met een toestel dat gebruikt wordt in het kader van een bevolkingsonderzoek, met uitzondering van
      een toestel dat gebruik maakt van computertomografietechniek;

      g. handelingen met een toestel dat gebruikt wordt voor röntgendiffractie of spectrografie, toegepast in een
      gesloten veiligheidskabinet;

      h. handelingen met een toestel in een vaste opstelling dat gebruikt wordt voor de controle van vracht, bagage en
      andere goederen;

      i. handelingen met een toestel dat gebruikt wordt voor kwaliteitscontrole van levensmiddelen en andere producten.

      3 De hierna genoemde categorieën van handelingen met radioactieve stoffen:

      a. handelingen met open bronnen met van nature voorkomende radionucliden, waarvan de activiteitsconcentratie lager
      is dan tienmaal de krachtens [artikel 3.17][ref2] vastgestelde waarde;

      b. handelingen met een ingekapselde bron waarvoor geldt dat de A/D waarde van die bron lager is dan 0,01, tenzij de
      specifieke handeling met betrekking tot de bron vergunningplichtig is of de handeling vrijgesteld is overeenkomstig
      [afdeling 3.3][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel3.9
