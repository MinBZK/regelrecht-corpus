  - number: '6.6'
    text: |-
      1 Onze Minister en Onze Minister van Veiligheid en Justitie zorgen voor samenwerking met andere lidstaten en andere
      betrokken landen met het oog op de aanpak van mogelijke radiologische noodsituaties op Nederlands grondgebied die
      deze staten kunnen treffen.

      2 In geval van een radiologische noodsituatie op het grondgebied van een andere lidstaat of ander betrokken land
      zorgen Onze Minister en Onze Minister van Veiligheid en Justitie voor samenwerking met die lidstaat of dat land met
      het oog op de stralingsbescherming op Nederlands grondgebied.

      3 In geval van een radiologische noodsituatie op het eigen grondgebied of een radiologische noodsituatie
      die radiologische gevolgen op het eigen grondgebied kan hebben, zorgen Onze Minister en Onze Minister van
      Veiligheid en Justitie ervoor dat de andere betrokken lidstaten en andere landen die betrokken kunnen zijn of
      kunnen worden getroffen onmiddellijk worden geïnformeerd en dat met hen contact wordt opgenomen, teneinde de
      blootstellingsituatie gezamenlijk te beoordelen en de beschermingsmaatregelen alsmede de voorlichting van leden van
      de bevolking te coördineren. Deze coördinatieactiviteiten mogen niet leiden tot belemmering of vertraging van de
      noodzakelijke op nationaal niveau te nemen maatregelen.

      4 De uitvoering van het derde lid vindt in voorkomende gevallen plaats overeenkomstig de toepasselijke
      internationaalrechtelijke verplichtingen en [artikel 14 van het Besluit informatie rampen en crisis][ref1].

      5 Onze in het eerste lid genoemde Ministers zorgen ervoor dat in geval van verlies, diefstal of ontdekking van
      hoogactieve ingekapselde bronnen, van andere radioactieve bronnen of van tot bezorgdheid aanleiding gevende
      radioactieve stoffen, voor zover dat verenigbaar is met nationale regels inzake geheimhouding, veiligheid en
      beveiliging:

      a. informatie onmiddellijk wordt gedeeld en dat wordt samengewerkt met andere betrokken lidstaten, andere betrokken
      landen en betrokken internationale organisaties, en

      b. dat verdere informatie en onderzoeksresultaten worden gedeeld.

      6 Onze Minister en Onze Minister die het aangaat zorgen waar nodig voor samenwerking met andere lidstaten en andere
      betrokken landen bij de transitie van een noodsituatie naar een bestaande blootstellingsituatie.


      [ref1]: https://wetten.overheid.nl/BWBR0006755#Artikel14
