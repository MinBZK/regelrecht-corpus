  - number: '10.8'
    text: |-
      1 In gevallen behorend tot een bij regeling van Onze Minister aangewezen categorie zorgt de ondernemer voor een
      beëindigingsplan waarin wordt beschreven welke voorzieningen met betrekking tot de beëindiging van het gebruik en
      het zich ontdoen van de bron zijn getroffen, waaronder in elk geval financiële voorzieningen.

      2 De aanwijzing, bedoeld in het eerste lid, vindt uitsluitend plaats voor zover niet bij of krachtens de
      [Mijnbouwwet][ref1] of andere wet een vergelijkbare voorziening wordt of kan worden vereist. De aanwijzing staat
      in een passende verhouding tot de aard en zwaarte van de betrokken risico’s, overeenkomstig de graduele benadering,
      bedoeld in [artikel 1.1][ref2]. Bij verordening van de Autoriteit kunnen afhankelijk van de aard en zwaarte van
      de betrokken risico’s, eisen aan de vorm, inhoud en kwaliteit van het beëindigingsplan en de wijze van uitvoering
      ervan worden gesteld. Deze eisen kunnen een plicht tot rapportage aan de Autoriteit omvatten.

      3 Nadat handelingen ten aanzien van het bereiden, bewerken of toepassen van een bron definitief zijn beëindigd,
      zorgt de ondernemer er voor dat, waar van toepassing overeenkomstig het beëindigingsplan:

      a. hiervan overeenkomstig [artikel 3.6, achtste lid][ref3], [3.9, tweede lid][ref4], of [3.11, vijfde lid][ref5],
      een kennisgeving van beëindiging aan de Autoriteit wordt gedaan, en

      b. hij zich, binnen twee jaar na die beëindiging, van de bron ontdoet door afgifte aan:

      1°. degene die de bron heeft vervaardigd of geleverd,

      2°. een persoon die gerechtigd is met het oog op gebruik, product- of materiaalhergebruik van bronnen, of
      inzameling van bronnen, de bron te ontvangen, of

      3°. een krachtens [artikel 10.6, vijfde of zevende lid][ref6], aangewezen instelling, of een krachtens artikel
      10.6, zesde lid, erkende ophaaldienst die gerechtigd is de bron te ontvangen, of

      c. indien de bron een toestel of versneller betreft, binnen twee jaar na die beëindiging het desbetreffende toestel
      of de versneller wordt verschroot, met uitzondering van de onderdelen van de versneller waarin zich radioactieve
      stoffen bevinden die door activering zijn ontstaan vanwege het gebruik van de versneller.


      [ref1]: https://wetten.overheid.nl/BWBR0014168
