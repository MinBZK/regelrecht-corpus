  - number: '6.7'
    text: |-
      1 De ondernemer zorgt in gevallen, behorend tot een bij regeling van Onze Minister en Onze Minister van Sociale
      Zaken en Werkgelegenheid aangewezen categorie, voor een bedrijfsnoodplan voor:

      a. de door hem geïnventariseerde risico’s op voorzienbare ongevallen en radiologische noodsituaties, en

      b. de voor zijn onderneming relevante voorzienbare ongevallen en radiologische noodsituaties die zijn
      geïnventariseerd in het kader van het crisisplan, bedoeld in [artikel 16 van de Wet veiligheidsregio’s][ref1] en
      de nationale crisisafspraken, bedoeld in [artikel 6.5, eerste lid][ref2].

      2 De aanwijzing, bedoeld in het eerste lid, staat in een passende verhouding tot de aard en zwaarte van de
      betrokken risico’s, overeenkomstig de graduele benadering, bedoeld in [artikel 1.1][ref3]. Bij verordening van
      de Autoriteit kunnen afhankelijk van de aard en zwaarte van de betrokken risico’s, eisen aan de vorm, inhoud en
      kwaliteit van het bedrijfsnoodplan worden gesteld en aan de wijze van uitvoering ervan. Deze eisen kunnen een
      plicht tot rapportage aan de Autoriteit omvatten.

      3 Een bedrijfsnoodplan bevat in ieder geval:

      a. voor zover betrekking hebbend op, of relevant voor, de onderneming, de in [bijlage 6, onderdeel B][ref4],
      genoemde elementen en de elementen van de nationale crisisafspraken;

      b. maatregelen voor de overgang van een radiologische noodsituatie naar een bestaande blootstellingsituatie.

      4 [Artikel 6.5, vijfde en zesde lid][ref5], is van overeenkomstige toepassing, met dien verstande dat voor
      «nationaal crisisplan» wordt gelezen: bedrijfsnoodplan.

      5 Bij regeling van Onze Minister en Onze Minister van Sociale Zaken en Werkgelegenheid kunnen met het oog op een
      goede uitvoering nadere regels worden gesteld met betrekking tot het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0040179#Artikel6.5
