  - number: '10.6'
    text: |-
      1 Een verbod als bedoeld in [artikel 3.5][ref1] in samenhang met [artikel 3.8, vierde lid, onder b][ref2], om zich
      zonder vergunning te ontdoen van radioactieve stoffen voor product- of materiaalhergebruik of als radioactieve
      afvalstof, is niet van toepassing indien de activiteitsconcentratie van die stof of afvalstof lager is dan de
      desbetreffende bij of krachtens [artikel 3.20][ref3] of [3.21][ref4] vastgestelde vrijgavewaarde.

      2 [Artikel 3.17, tweede, zesde en negende lid][ref5] is van overeenkomstige toepassing.

      3 Het verbod, bedoeld in het eerste lid, is onverminderd het bepaalde in de [artikelen 10.8][ref6] en [10.9][ref7],
      tevens niet van toepassing indien het ingekapselde bronnen betreft, die worden teruggenomen door degene die de bron
      heeft vervaardigd of geleverd.

      4 Het verbod is tevens niet van toepassing indien het een feitelijke levering betreft van radioactieve stoffen of
      afvalstoffen door enkele overgave aan een derde met het oog op:

      a. product- of materiaalhergebruik van radioactieve stoffen, of

      b. inzameling van radioactieve afvalstoffen.

      5 Het verbod is tevens niet van toepassing op afgifte aan een krachtens [artikel 33, vierde lid, van de wet][ref8]
      aangewezen instelling voor ontvangst van in bezit genomen radioactieve stoffen of afvalstoffen.

      6 Het verbod is tevens niet van toepassing op het zich ontdoen van radioactieve afvalstoffen door afgifte aan een
      door de Autoriteit erkende ophaaldienst voor radioactieve afvalstoffen.

      7 Het verbod is tevens niet van toepassing op afgifte aan door de Autoriteit aangewezen instellingen voor de
      ontvangst van radioactieve afvalstoffen.

      8 Het derde tot en met zevende lid zijn uitsluitend van toepassing indien de ondernemer zich ervan heeft vergewist
      dat de ontvanger in het bezit is van een vergunning of registratie voor de desbetreffende handeling of anderszins
      gerechtigd is deze stoffen te ontvangen en door de ondernemer wordt voldaan aan de bij en krachtens [de wet][ref9]
      ten aanzien van de bron en het zich ontdoen gestelde regels en voorschriften.

      9 Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref10] is
      [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref11] niet van toepassing op de aanvraag om een aanwijzing
      als bedoeld in het vijfde of zevende lid en de aanvraag om een erkenning als bedoeld in het zesde lid.


