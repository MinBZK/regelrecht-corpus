  - number: '7.37'
    text: |-
      1 In geval van beroepsmatige blootstelling in radiologische noodsituaties gelden voor zover mogelijk voor
      werknemers die als hulpverlener optreden de dosislimieten, genoemd in [artikel 7.34][ref1].

      2 Voor radiologische noodsituaties waarin niet aan het bepaalde in het eerste lid kan worden voldaan, geldt voor
      werknemers die als hulpverlener optreden een referentieniveau van 100 millisievert voor de effectieve dosis.

      3 In afwijking van het bepaalde in het tweede lid, geldt in uitzonderlijke situaties een referentieniveau van:

      a. 250 millisievert voor de effectieve dosis voor uitwendige bestraling van werknemers die als hulpverlener
      optreden voor het redden van uitermate belangrijke materiële belangen; en

      b. 500 millisievert voor de effectieve dosis voor uitwendige bestraling van werknemers die als hulpverlener
      optreden voor levensreddend werk, het voorkomen van ernstige gezondheidseffecten door straling of om de
      ontwikkeling van catastrofale omstandigheden te voorkomen.

      4 De ondernemer zorgt ervoor dat een werknemer die als hulpverlener optreedt en die activiteiten zou kunnen
      ondernemen waarbij een effectieve dosis van meer dan 100 millisievert kan worden ontvangen van tevoren duidelijk en
      uitvoerig is ingelicht over de bijbehorende gezondheidsrisico’s en de betreffende activiteiten vrijwillig uitvoert.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel7.34
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel7.37
