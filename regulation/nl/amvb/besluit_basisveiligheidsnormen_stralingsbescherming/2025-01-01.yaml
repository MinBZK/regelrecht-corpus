  - number: '6.22'
    text: |-
      1 Bij regeling van Onze Minister in overeenstemming met Onze Minister die het mede aangaat kunnen besmette gebieden
      worden aangewezen.

      2 Voor het beheer van een besmet gebied stelt Onze Minister in overeenstemming met Onze Minister die het mede
      aangaat een programma met een geoptimaliseerde beschermingsstrategie vast.

      3 De Autoriteit is belast met de gecoördineerde voorbereiding, het opstellen en het mede uitvoeren van het
      programma.

      4 Het programma wordt afgestemd met omringende landen en waar nodig geactualiseerd op grond van nieuwe
      internationale inzichten op dit gebied.

      5 Met het oog op blootstelling in radiologische noodsituaties in een besmet gebied en bestaande
      blootstellingsituaties omvat een programma in ieder geval de volgende elementen:

      a. doelstellingen, met inbegrip van langetermijndoelen, alsook de overeenkomstige referentieniveaus, vastgesteld op
      grond van de [paragrafen 2.4][ref1] en [9.2][ref2] voor:

      1°. blootstelling in radiologische noodsituaties;

      2°. bestaande blootstellingsituaties;

      3°. het vrijgeven van besmette gebieden voor bewoning en voor het hervatten van de sociale en economische
      activiteiten;

      b. te nemen maatregelen om de begrenzing van de getroffen gebieden te bepalen en getroffen leden van de bevolking
      te kunnen identificeren;

      c. bepaling van de noodzaak, aard en omvang van beschermingsmaatregelen die in de getroffen gebieden en voor de
      getroffen leden van de bevolking moeten worden genomen;

      d. bepaling van de noodzaak om de toegang tot de getroffen gebieden te verhinderen of te controleren, dan wel om
      beperkingen op te leggen aan de leefomstandigheden in deze gebieden;

      e. bepaling en beoordeling van de blootstelling van verschillende bevolkingsgroepen en van de middelen die
      individuele personen ter beschikking hebben om hun eigen blootstelling te beheren.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0040179#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel6.22
