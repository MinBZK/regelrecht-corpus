  - number: '7.26'
    text: |-
      1 De ondernemer zorgt ervoor dat de stralingsarts een medisch dossier bijhoudt van elke A-werknemer en werknemer
      als bedoeld in [artikel 7.21, vijfde lid][ref1], en dat dit in ieder geval wordt bewaard totdat de persoon op wie
      de gegevens betrekking hebben de leeftijd van vijfenzeventig jaar heeft bereikt of zou hebben bereikt, maar ten
      minste dertig jaar nadat deze persoon de handelingen heeft beëindigd.

      2 In het medisch dossier, bedoeld in het eerste lid, wordt ten minste geregistreerd:

      a. de aard van het werk;

      b. de uitslagen van de onderzoeken, bedoeld in de [artikelen 7.21][ref2] en [7.24][ref3];

      c. de resultaten van de individuele monitoring, bepaald overeenkomstig de [artikelen 7.12][ref4], [7.13][ref5],
      [7.14][ref6] en [7.31][ref7];

      d. indien van toepassing, de gegevens met betrekking tot de omstandigheden waarbij het gaat om
      blootstellingsituaties als bedoeld in [artikel 7.14][ref8]; en

      e. overige relevante medische onderzoeken, uitgevoerd voorafgaand aan en tijdens de tewerkstelling als A-werknemer.

      3 Wat betreft externe werknemers werken de ondernemer en de werkgever samen bij de uitvoering van dit artikel.

      4 De werknemer heeft inzage in zijn medisch dossier en ontvangt hiervan op zijn verzoek een afschrift.


