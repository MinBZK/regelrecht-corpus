  - number: '6.5'
    text: |-
      1 Onze Ministers, bedoeld in [artikel 40, eerste lid, van de wet][ref1], betrekken bij de voorbereiding van de
      organisatie van de ongevallenbestrijding met categorie A-objecten en de nationale crisisafspraken, bedoeld in dat
      lid, de in [bijlage 6, onderdeel A][ref2], genoemde elementen.

      2 Het bestuur van een veiligheidsregio:

      a. betrekt bij de voorbereiding overeenkomstig [paragraaf 3 van de Wet veiligheidsregio’s][ref3]
      van de bestrijding van ongevallen met categorie A-objecten en categorie B-objecten als bedoeld in de
      [artikelen 40, tweede lid, eerste volzin][ref4], en [41 van de wet][ref5], de in [bijlage 6, onderdeel A][ref6],
      genoemde elementen;

      b. houdt bij de planmatige voorbereiding overeenkomstig de [artikelen 15][ref7], [16][ref8] en
      [17 van de Wet veiligheidsregio’s][ref9] van de bestrijding van ongevallen en radiologische noodsituaties
      rekening met de algemene beginselen van stralingsbescherming van [hoofdstuk 2][ref10] en de referentieniveaus,
      vastgesteld krachtens [artikel 9.8][ref11].

      3 Onze Minister en Onze Minister die het aangaat zorgen voor een of meer nationale crisisplannen voor ongevallen
      of radiologische noodsituaties, rekening houdend met de algemene beginselen van stralingsbescherming van
      [hoofdstuk 2][ref12] en de referentieniveaus, vastgesteld krachtens [artikel 9.8][ref13].

      4 Een nationaal crisisplan bevat de in [bijlage 6, onderdeel B][ref14], genoemde elementen en, voor zover van
      toepassing, de elementen, bedoeld in het eerste lid. Een nationaal crisisplan heeft tevens betrekking op de
      overgang van een radiologische noodsituatie naar een bestaande blootstellingsituatie.

      5 Een nationaal crisisplan maakt deel uit van de ongevallenbestrijding en de nationale crisisafspraken, bedoeld in
      [artikel 40, eerste lid, van de wet][ref15].

      6 Een nationaal crisisplan wordt regelmatig getest, geëvalueerd en, voor zover de resultaten daartoe aanleiding
      vormen, verbeterd. Daarbij wordt rekening gehouden met inzichten en ervaringen uit eerdere blootstellingsituaties
      bij ongevallen en in radiologische noodsituaties en de resultaten van oefeningen met ongevallen en radiologische
      noodsituaties op nationaal en internationaal niveau.

      7 Bij regeling van Onze Minister kunnen met het oog op een goede uitvoering nadere regels worden gesteld met
      betrekking tot het derde, vierde en zesde lid.


