  - number: '6.17'
    text: |-
      1 Op krachtens de [artikelen 6.15][ref1] en [6.16][ref2] geïnventariseerde en beoordeelde bestaande
      blootstellingsituaties die vanuit het oogpunt van stralingsbescherming aanleiding geven tot bezorgdheid en waarvoor
      een ondernemer verantwoordelijk is, is in afwijking van de [artikelen 6.18][ref3] en [6.19][ref4] het bepaalde
      bij en krachtens de [hoofdstukken 2][ref5] en [3][ref6] met betrekking tot de rechtvaardiging, autorisatie en het
      beheer van geplande blootstellingsituaties van toepassing.

      2 Bij regeling van Onze Minister in overeenstemming met Onze Minister die het mede aangaat kunnen met het oog op
      een goede uitvoering bestaande blootstellingsituaties als bedoeld in het eerste lid worden aangewezen en kunnen
      nadere regels worden gesteld.


