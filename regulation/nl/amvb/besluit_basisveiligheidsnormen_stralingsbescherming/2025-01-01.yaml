  - number: '7.27'
    text: |-
      1 De werkgever van de externe werknemer ziet er op toe dan wel zorgt ervoor dat:

      a. ten aanzien van de externe werknemer de individuele monitoring, bepaald overeenkomstig [artikelen 7.12][ref1],
      [7.13][ref2], [7.14][ref3] en [7.31][ref4], en de dosislimieten en referentieniveaus, genoemd in de
      [artikelen 7.3][ref5] en [7.34 tot en met 7.38][ref6], in acht worden genomen;

      b. de externe werknemer passende voorlichting en opleiding over stralingsbescherming als bedoeld in
      [paragraaf 7.1.5][ref7], wordt verstrekt;

      c. de externe werknemer op juiste wijze is ingedeeld als bedoeld in [artikel 7.24][ref8], en aan het bijbehorende
      gezondheidskundig toezicht, bedoeld in [artikel 7.21][ref9], is onderworpen.

      2 Bij regeling van Onze Minister van Sociale Zaken en Werkgelegenheid wordt vastgesteld welke gegevens door
      de werkgever van de externe werknemer aan de ondernemer ter beschikking worden gesteld voorafgaand aan de te
      verrichten arbeid.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel7.12
