  - number: '12.5'
    text: |-
      1 Met ingang van het tijdstip van inwerkingtreding van dit besluit geldt een melding krachtens
      [artikel 21 van het Besluit stralingsbescherming][ref1] als een kennisgeving krachtens [artikel 3.11][ref2], tenzij
      [artikel 12.11][ref3] van toepassing is.

      2 Met ingang van het tijdstip van inwerkingtreding van dit besluit geldt een melding krachtens
      [artikel 22 van het Besluit stralingsbescherming][ref4] als een kennisgeving van beëindiging krachtens
      [artikel 3.6, achtste lid][ref5], [3.9, tweede lid][ref6], of [3.11, vijfde lid][ref7], al naar gelang de bepaling
      die van toepassing is.

      3 Met ingang van het tijdstip van inwerkingtreding van dit besluit geldt een
      vergunning verleend [krachtens artikel 23, eerste of tweede lid][ref8], [24][ref9] of
      [25, eerste lid, van het Besluit stralingsbescherming][ref10], of een aanvraag daartoe:

      a. indien betrekking hebbend op een handeling behorend tot een categorie als genoemd in [artikel 3.8][ref11], als
      een vergunning verleend krachtens [artikel 3.5][ref12], of een aanvraag als bedoeld in dat artikel;

      b. indien betrekking hebbend op een handeling behorend tot een categorie als genoemd in [artikel 3.10][ref13] als
      een registratie verleend krachtens [artikel 3.9][ref14], of een aanvraag als bedoeld in dat artikel;

      c. indien betrekking hebbend op een handeling of blootstellingsituatie behorend tot een categorie als genoemd in
      [artikel 3.13][ref15] als een kennisgeving.

      4 Met ingang van het tijdstip van inwerkingtreding van dit besluit geldt een goedkeuring, verleend krachtens
      [artikel 26, eerste lid, onderdeel a, van het Besluit stralingsbescherming][ref16], of een aanvraag daartoe,
      als een goedkeuring, verleend krachtens [artikel 3.18, eerste lid, onderdeel a of b][ref17], of een aanvraag als
      bedoeld in dat lid.

      5 Met ingang van het tijdstip van inwerkingtreding van dit besluit geldt een ontheffing, verleend krachtens
      [artikel 29, tweede lid, van het Besluit stralingsbescherming][ref18], of een aanvraag daartoe, als een ontheffing,
      verleend krachtens [artikel 4.25, tweede lid][ref19], of een aanvraag om een ontheffing als bedoeld in dat lid.

      6 Met ingang van het tijdstip van inwerkingtreding van dit besluit geldt een vergunning, verleend krachtens
      [artikel 35, eerste lid][ref20], of [37, eerste lid, van het Besluit stralingsbescherming][ref21], of een aanvraag
      daartoe:

      a. indien betrekking hebbend op een handeling behorend tot een categorie als genoemd in [artikel 3.8][ref22], als
      een vergunning verleend krachtens [artikel 3.5][ref23] of een aanvraag als bedoeld in dat artikel;

      b. indien betrekking hebbend op een handeling behorend tot een categorie als genoemd in [artikel 3.10][ref24], als
      een registratie verleend krachtens [artikel 3.9][ref25] of een aanvraag als bedoeld in dat artikel.

      7 Met ingang van het tijdstip van inwerkingtreding van dit besluit:

      a. geldt een aanwijzing als bedoeld in [artikel 37, zesde lid, van het Besluit stralingsbescherming][ref26] of
      een aanvraag daartoe als een aanwijzing als bedoeld in [artikel 10.6, vijfde lid][ref27], of een aanvraag om een
      aanwijzing als bedoeld in dat lid;

      b. geldt een erkenning als bedoeld in [artikel 37, zevende lid, van het Besluit stralingsbescherming][ref28] of
      een aanvraag daartoe als een erkenning als bedoeld in [artikel 10.6, zesde lid][ref29], of een aanvraag om een
      erkenning als bedoeld in dat lid;

      c. geldt een aanwijzing als bedoeld in [artikel 37, achtste lid, van het Besluit stralingsbescherming][ref30] of
      een aanvraag daartoe, als een aanwijzing als bedoeld in [artikel 10.6, zevende lid][ref31], of een aanvraag om een
      aanwijzing als bedoeld in dat lid.

      8 Met ingang van het tijdstip van inwerkingtreding van dit besluit geldt het aanmerken van een radioactieve stof
      als radioactieve afvalstof als bedoeld in [artikel 38, eerste lid, van het Besluit stralingsbescherming][ref32] als
      het aanmerken, bedoeld in [artikel 10.7][ref33].

      9 Met ingang van het tijdstip van inwerkingtreding van dit besluit geldt een weigering van een aanvraag om
      vergunning als bedoeld in [artikel 39 van het Besluit stralingsbescherming][ref34] als een weigering als bedoeld
      in [artikel 3.7][ref35].

      10 Met ingang van het tijdstip van inwerkingtreding van dit besluit geldt een intrekking van een vergunning
      als bedoeld in [artikel 39a van het Besluit stralingsbescherming][ref36] als een intrekking als bedoeld in
      [artikel 3.6, zesde lid][ref37].

      11 Met ingang van het tijdstip van inwerkingtreding van dit besluit geldt een kennisgeving als bedoeld in
      [artikel 44, eerste lid, van het Besluit stralingsbescherming][ref38] als een kennisgeving als bedoeld in
      [artikel 3.6, zevende lid][ref39].

      12 Met ingang van het tijdstip van inwerkingtreding van dit besluit geldt een oordeel van Onze Minister als
      bedoeld in [artikel 45, onderdelen c en d, van het Besluit stralingsbescherming][ref40] als oordeel als bedoeld in
      [artikel 11.1, onderdelen c en d][ref41].


