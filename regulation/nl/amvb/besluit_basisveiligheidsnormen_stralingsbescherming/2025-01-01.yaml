  - number: '3.25'
    text: |-
      [Artikel 3.4, eerste lid][ref1], is van overeenkomstige toepassing ten aanzien van bronnen of handelingen behorend
      tot een bij of krachtens afdeling 3.3 vrijgestelde of vrijgegeven categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel3.4
