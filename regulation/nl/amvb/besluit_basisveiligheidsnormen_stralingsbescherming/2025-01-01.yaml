        artikel: '7.37'
        hoofdstuk: '7'
        afdeling: '7.3'
  - number: '9.10'
    text: >-
      1 Bij regeling van Onze Minister worden een of meer referentieniveaus vastgesteld voor blootstelling van leden van
      de bevolking in een bestaande blootstellingsituatie.


      2 Een referentieniveau als bedoeld in het eerste lid is, onverminderd de bij regeling van Onze Minister
      vastgestelde referentieniveaus voor equivalente doses, gelijk aan of hoger dan 1 millisievert in een kalenderjaar
      en niet hoger dan 20 millisievert in een kalenderjaar.


      3 Voor specifieke bestaande blootstellingsituaties kan bij verordening of beschikking van de Autoriteit als
      referentieniveau een lagere dan een krachtens het eerste lid vastgestelde waarde worden vastgesteld. In ieder
      geval kan een referentieniveau onder 1 millisievert in een kalenderjaar worden vastgesteld voor bestaande
      blootstellingsituaties met specifieke brongerelateerde blootstelling of blootstellingsroutes.


      4 Bij de vaststelling van een waarde voor een referentieniveau krachtens dit artikel wordt rekening gehouden met
      zowel de kenmerken van de bestaande blootstellingsituatie als met maatschappelijke omstandigheden.


      5 Onze Minister zorgt als volgt voor informatievoorziening aan de bevolking in een blootstellingsituatie als
      bedoeld in het vierde lid:


      a. in geval van blootstelling van ten hoogste 1 millisievert in een kalenderjaar: algemene informatievoorziening
      over het blootstellingsniveau, zonder specifiek rekening te houden met de individuele blootstelling;


      b. in geval van blootstelling hoger dan 1 millisievert in een kalenderjaar en lager dan of gelijk aan
      20 millisievert in een kalenderjaar: specifieke informatievoorziening om individuele personen in staat te stellen
      om zo mogelijk de eigen blootstelling te beheren.


      6 Voor radonconcentraties binnenshuis in woningen en voor de bevolking toegankelijke gebouwen is een
      referentieniveau van ten hoogste 100 becquerel/m3 als jaargemiddelde van de activiteitsconcentratie in de lucht
      van toepassing.


      7 Bij regeling van Onze Minister in overeenstemming met Onze Minister die het mede aangaat kan, in afwijking van
      het zesde lid, voor bij de regeling aangewezen specifieke categorieën van voor het publiek toegankelijke gebouwen,
      waarin ook met redelijkerwijs haalbare maatregelen niet aan het referentieniveau, bedoeld in het zesde lid, kan
      worden voldaan, een referentieniveau worden vastgesteld van ten hoogste 300 becquerel/m3 als jaargemiddelde van de
      activiteitsconcentratie in de lucht.


      8 Voor de externe blootstelling in het binnenmilieu aan door bouwmaterialen uitgezonden gammastraling, bovenop de
      externe blootstelling buitenshuis, geldt een referentieniveau van 1 millisievert in een kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel9.10
  - number: '10.1'
    text: >-
      1 Onze Minister stelt een programma voor het beheer van radioactieve afvalstoffen vast als bedoeld in artikel 5,
      eerste lid, onderdeel a, van [richtlijn 2011/70](32011L0070)/Euratom.


      2 Het programma bevat een uitwerking van de volgende uitgangspunten:


      a. de beperking van het ontstaan van radioactieve afvalstoffen tot het praktisch haalbare minimum, zowel wat de
      activiteit als het volume betreft;


      b. de onderlinge afhankelijkheden van alle stappen in het ontstaan en het beheer van radioactieve afvalstoffen;


      c. het veilig beheer van radioactieve afvalstoffen;


      d. voor de lange termijn passieve veiligheidsmaatregelen;


      e. een graduele aanpak bij de uitvoering van de maatregelen;


      f. de kosten voor het beheer van radioactieve afvalstoffen komen ten laste van degene die deze afvalstoffen hebben
      laten ontstaan;


      g. een empirisch onderbouwd en gedocumenteerd besluitvormingsproces in alle stadia van het beheer van radioactieve
      afvalstoffen.


      3 Het programma bevat tevens:


      a. de beleidsdoelstelling ten aanzien van het beheer van alle typen radioactieve afvalstoffen;


      b. de mijlpalen die voor de uitvoering van het programma nodig zijn en het tijdpad voor het bereiken van deze
      mijlpalen;


      c. een inventarisatie van alle radioactieve afvalstoffen en ramingen van toekomstige hoeveelheden;


      d. concepten, plannen en technische oplossingen voor het beheer van radioactieve afvalstoffen, van ontstaan tot
      eindberging;


      e. concepten of plannen voor de periode na de sluiting van een inrichting voor eindberging;


      f. onderzoeks-, ontwikkelings- en demonstratieactiviteiten die nodig zijn om oplossingen voor het beheer van
      radioactieve afvalstoffen toe te passen;


      g. de verantwoordelijkheid voor de uitvoering van het programma en de essentiële prestatie-indicatoren voor
      toezicht op de voortgang van de uitvoering van het programma;


      h. een beoordeling van de kosten van het nationale programma en de onderliggende basis en hypothesen voor deze
      beoordeling, met inbegrip van een tijdsprofiel;


      i. de financieringsregelingen ter uitvoering van het programma;


      j. het beleid ten aanzien van het verstrekken van informatie met betrekking tot het beheer van radioactieve
      afvalstoffen aan werknemers en het publiek;


      k. een overzicht van met andere lidstaten en derde landen gesloten overeenkomsten over het beheer van radioactieve
      afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel10.1
  - number: '10.2'
    text: >-
      1 De ondernemer die een handeling verricht, zorgt ervoor dat, zoveel als redelijkerwijs mogelijk is:


      a. het ontstaan van radioactieve afvalstoffen en het lozen van radioactieve stoffen wordt voorkomen of beperkt,


      b. bronnen na gebruik als zodanig opnieuw worden gebruikt,


      c. radioactieve stoffen en materialen waaruit een bron bestaat, na het gebruik ervan opnieuw worden gebruikt, of


      d. voorwerpen, stoffen en materialen die met radioactieve stoffen zijn besmet of geactiveerd, na het gebruik ervan
      zodanig worden bewerkt dat ze opnieuw kunnen worden gebruikt.


      2 Bij het vervaardigen van bronnen wordt gebruik gemaakt van stoffen en materialen die na het gebruik van de bron
      geen of zo min mogelijk nadelige gevolgen voor het milieu veroorzaken.


      3 De ondernemer zorgt er voor dat een handeling zoveel als mogelijk wordt verricht op een wijze waarbij
      blootstelling van werknemers en de bevolking wordt vermeden.
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel10.2
  - number: '10.3'
    text: |-
      1 Een verbod als bedoeld in [artikel 3.5][ref1] in samenhang met [artikel 3.8, vierde lid, onder c][ref2], op
      het handelen zonder vergunning waarbij door de lucht verspreide of vloeibare radioactieve stoffen in de omgeving
      vrijkomen, is niet van toepassing indien:

      a. bij lozing in de lucht, de activiteit van de in totaal in een kalenderjaar geloosde hoeveelheid radioactieve
      stoffen bij het verlaten van de locatie via een lozingspunt lager is dan 1 radiotoxiciteitsequivalent voor
      inhalatie als bedoeld in [bijlage 2][ref3];

      b. bij lozing in het openbare riool, de activiteit van de in totaal in een kalenderjaar geloosde hoeveelheid
      radioactieve stoffen bij het verlaten van de locatie via een lozingspunt lager is dan 10 radiotoxiciteitsequivalent
      voor ingestie als bedoeld in [bijlage 2][ref4];

      c. bij lozing in het oppervlaktewater, de activiteit van de in totaal in een kalenderjaar geloosde
      hoeveelheid radioactieve stoffen bij het verlaten van de locatie via een lozingspunt lager is dan
      0,1 radiotoxiciteitsequivalent voor ingestie als bedoeld in [bijlage 2][ref5].

      2 De geloosde hoeveelheden, uitgedrukt in radiotoxiciteitsequivalenten, worden gecorrigeerd voor fysisch verval
      door middel van de correctiefactoren zoals opgenomen in [bijlage 2][ref6].


