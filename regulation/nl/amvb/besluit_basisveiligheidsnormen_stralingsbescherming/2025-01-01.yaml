  - number: '7.5'
    text: |-
      1 Voor zover het een situatie betreft waarbij het gaat om blootstelling van vliegtuigbemanning veroorzaakt door
      kosmische straling, zijn dit hoofdstuk en de daarop berustende bepalingen alleen van toepassing voor zover zulks in
      dit artikel is bepaald.

      2 De ondernemer zorgt ervoor dat met betrekking tot een blootgestelde werknemer die deel uitmaakt van een
      vliegtuigbemanning:

      a. deze voor zijn indiensttreding of tewerkstelling wordt ingelicht omtrent de risico’s van blootstelling aan
      kosmische straling;

      b. de grootte van de door hem ontvangen effectieve dosis ten gevolge van kosmische straling wordt bepaald door
      middel van een bij regeling van Onze Minister van Sociale Zaken en Werkgelegenheid vastgestelde berekeningsmethode;

      c. ter voldoening aan de in [artikel 2.6][ref1] gestelde verplichting, dat er rekening wordt gehouden met de
      blootstelling bij het opstellen van de werkroosters teneinde de doses van A-werknemers te beperken; en

      d. de door hem ten gevolge van kosmische straling ontvangen effectieve dosis tezamen met de effectieve doses ten
      gevolge van handelingen die onder verantwoordelijkheid van de ondernemer worden verricht, niet hoger is dan 20
      millisievert in een kalenderjaar.

      3 De [artikelen 7.1, eerste en derde lid, onder c, l en m, zesde, zevende en negende lid][ref2],
      [7.2, eerste, tweede en derde lid, vierde lid, onder e, f, g, j en m, vijfde en zevende lid][ref3],
      [7.3, eerste lid, onder a][ref4], [7.4][ref5], [7.11][ref6], [7.12][ref7],
      [7.13][ref8], [7.21][ref9], [7.24][ref10], [7.25][ref11], [7.28][ref12], [7.29][ref13],
      [7.35, eerste lid, tweede lid onder a, en vierde lid][ref14], en [7.36, eerste en derde lid][ref15], zijn van
      toepassing. [Artikel 7.16][ref16], [7.17][ref17], [7.19, eerste lid][ref18], [7.20][ref19] en [7.26][ref20]
      zijn van toepassing, met dien verstande dat in plaats van «de resultaten van de individuele monitoring, bepaald
      overeenkomstig de [artikelen 7.12][ref21], [7.13][ref22], [7.14][ref23] en [7.31][ref24]» wordt gelezen: de
      resultaten van de individuele monitoring, bepaald overeenkomstig [artikel 7.5, tweede lid, onder b][ref25].
      [Artikel 7.27][ref26] is van toepassing, met dien verstande dat in plaats van «de individuele monitoring,
      bepaald overeenkomstig de [artikelen 7.12][ref27], [7.13][ref28], [7.14][ref29] en [7.31][ref30], en de
      dosislimieten en referentieniveaus, genoemd in de [artikelen 7.3][ref31] en [7.34 tot en met 7.38][ref32]» wordt
      gelezen: de individuele monitoring, bepaald overeenkomstig [artikel 7.5, tweede lid, onder b][ref33], en de
      dosislimieten, genoemd in de [artikelen 7.5, tweede lid, onder d][ref34], [7.35, tweede lid, onder a][ref35] en
      [7.36, eerste lid][ref36].

      4 Indien de dosislimiet, genoemd in het tweede lid, onder d, overschreden wordt, meldt de ondernemer dit aan Onze
      Minister van Sociale Zaken en Werkgelegenheid.

      5 Onze Minister van Sociale Zaken en Werkgelegenheid kan nadere regels stellen met betrekking tot het bepaalde in
      dit artikel.


