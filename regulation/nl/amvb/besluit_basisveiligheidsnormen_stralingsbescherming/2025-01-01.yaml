  - number: '7.36'
    text: |-
      1 De ondernemer zorgt ervoor dat de arbeidsomstandigheden voor de zwangere werknemer zodanig zijn dat de
      equivalente dosis ten gevolge van het werk voor het ongeboren kind zo laag is als redelijkerwijs mogelijk is en dat
      het onwaarschijnlijk is dat de dosis vanaf het moment van melding van de zwangerschap aan de ondernemer tot aan het
      einde van de zwangerschap hoger zal zijn dan 1 millisievert.

      2 De ondernemer zorgt ervoor dat een werknemer, indien zij hem in kennis heeft gesteld dat zij borstvoeding geeft,
      gedurende deze periode geen arbeid verricht waarbij op basis van de risico-inventarisatie en -evaluatie, bedoeld in
      [artikel 5 van de Arbeidsomstandighedenwet][ref1], een relevant risico bestaat op besmetting van het lichaam.

      3 Indien de dosis, genoemd in het eerste lid, wordt overschreden rapporteert de ondernemer dit aan Onze Minister
      van Sociale Zaken en Werkgelegenheid of, indien het inrichtingen betreft waarvoor een vergunning krachtens
      [artikel 15, onder b, van de wet][ref2] is verleend, de Autoriteit of, indien het mijnbouw betreft, Onze Minister
      van Economische Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel15
