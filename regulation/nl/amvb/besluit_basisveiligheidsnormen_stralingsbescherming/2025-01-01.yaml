  - number: '11.2'
    text: |-
      1 [Afdeling 3.4 van de Algemene wet bestuursrecht][ref1] en [afdeling 13.2 van de Wet milieubeheer][ref2] zijn
      niet van toepassing op de voorbereiding van een beschikking op een aanvraag om een vergunning voor een handeling
      behorend tot een in [artikel 3.8][ref3] genoemde categorie, indien het betreft:

      a. het verrichten van handelingen met open bronnen en de uitkomst van de gewogen sommatie van de activiteiten van
      de op enig moment aanwezige hoeveelheid radionucliden in de bij die handelingen betrokken radioactieve stoffen
      volgens de in [artikel 4.29, vierde lid][ref4], bedoelde methode niet meer bedraagt dan 104, of

      b. de radioactieve stoffen zich bevinden op steeds wisselende locaties, en naar het oordeel van de
      Autoriteit het belang van de toepassing van [afdeling 3.4 van de Algemene wet bestuursrecht][ref5], alsmede
      [afdeling 13.2 van de Wet milieubeheer][ref6] niet opweegt tegen de daaraan verbonden bezwaren.

      2 Het eerste lid is van overeenkomstige toepassing op ingekapselde bronnen, met dien verstande dat:

      a. de uitkomst van de in dat lid bedoelde sommatie niet meer bedraagt dan 107, of

      b. de ingekapselde bron zich bevindt op steeds wisselende locaties, en naar het oordeel van de Autoriteit
      het belang van de toepassing van [afdeling 3.4 van de Algemene wet bestuursrecht][ref7], alsmede
      [afdeling 13.2 van de Wet milieubeheer][ref8] niet opweegt tegen de daaraan verbonden bezwaren.


