  - number: '4.24'
    text: |-
      1 Het verbod, bedoeld in [artikel 4.23][ref1], is niet van toepassing voor zover:

      a. het product een aanwijsinstrument betreft;

      b. uitsluitend H-3 in lichtcellen of Pm-147 in lichtgevende verf is of wordt toegevoegd voor
      verlichtingsdoeleinden;

      c. het aanwijsinstrument in totaal een lagere activiteit bevat dan de desbetreffende krachtens
      [artikel 3.17, eerste lid, onder a][ref2], vastgestelde waarde voor H-3, onderscheidenlijk Pm-147;

      d. het aanwijsinstrument voldoet aan in het belang van de bescherming tegen ioniserende straling bij verordening
      van de Autoriteit gestelde regels met betrekking tot de constructie;

      e. op het aanwijsinstrument de bij verordening van de Autoriteit aangewezen merk- of waarschuwingstekens zijn
      aangebracht;

      f. herstel- en onderhoudswerkzaamheden aan het aanwijsinstrument worden verricht overeenkomstig de bij verordening
      van de Autoriteit vastgestelde regels, en

      g. er per locatie op enig moment niet meer dan 500 aanwijsinstrumenten waaraan voor verlichtingsdoeleinden H-3 in
      lichtcellen of Pm-147 in lichtgevende verf is toegevoegd, voorhanden zijn.

      2 Bij verordening van de Autoriteit kunnen met het oog op een goede uitvoering nadere regels worden gesteld met
      betrekking tot [artikel 4.23][ref3] en het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel4.23
      [ref2]: https://wetten.overheid.nl/BWBR0040179#Artikel3.17
      [ref3]: https://wetten.overheid.nl/BWBR0040179#Artikel4.23
