  - number: '7.24'
    text: |-
      1 De ondernemer zorgt ervoor dat de arbodienst, in samenspraak met de stralingsarts, met betrekking tot de
      geschiktheid van A-werknemers voorafgaand aan de aanwijzing als A-werknemer op basis van het gezondheidskundig
      onderzoek de volgende indeling toepast:

      a. geschikt;

      b. onder bepaalde omstandigheden geschikt, of

      c. ongeschikt.

      2 De stralingsarts deelt de indeling van de geschiktheid, bedoeld in het eerste lid, onverwijld schriftelijk mee
      aan degene die het onderzoek heeft ondergaan.

      3 Degene die het onderzoek heeft ondergaan kan binnen zes weken na ontvangst van de mededeling, bedoeld in het
      tweede lid, een nieuw onderzoek verzoeken aan Onze Minister van Sociale Zaken en Werkgelegenheid of, indien het
      inrichtingen betreft waarvoor een vergunning krachtens [artikel 15, onder b, van de wet][ref1] is verleend, de
      Autoriteit of, indien het mijnbouw betreft, Onze Minister van Economische Zaken. Onze betrokken Minister deelt
      de uitslag van het nieuwe onderzoek onverwijld schriftelijk mee aan de onderzochte persoon, de arbodienst, de
      stralingsarts en de ondernemer.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel7.24
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: '7.25'
    text: |-
      Een werknemer wordt niet in een specifieke functie als A-werknemer tewerkgesteld indien hij blijkens de uitslag van
      het gezondheidskundig onderzoek, bedoeld in [artikel 7.24, eerste lid][ref1], ongeschikt is voor die functie.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel7.24
