  - number: '7.3'
    text: |-
      1 De ondernemer zorgt ervoor dat voor een werknemer die geen blootgestelde werknemer is, ten gevolge van een
      handeling die onder zijn verantwoordelijkheid wordt verricht, de volgende dosislimieten niet worden overschreden:

      a. een effectieve dosis van 1 millisievert in een kalenderjaar, en met inachtneming daarvan:

      b. een equivalente dosis van:

      1°. 15 millisievert in een kalenderjaar voor de ooglens;

      2°. 50 millisievert in een kalenderjaar voor de huid, gemiddeld over enig blootgesteld huidoppervlak van 1 cm2; en

      3°. 50 millisievert in een kalenderjaar voor de extremiteiten.

      2 In geval van inwendige besmetting wordt de effectieve volgdosis toegewezen aan het jaar van inname.

      3 Indien een van de in het eerste lid genoemde dosislimieten overschreden wordt, rapporteert de ondernemer dit
      aan Onze Minister van Sociale Zaken en Werkgelegenheid of, indien het inrichtingen betreft waarvoor een vergunning
      krachtens [artikel 15, onder b, van de wet][ref1] is verleend, de Autoriteit of, indien het mijnbouw betreft, Onze
      Minister van Economische Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: '7.4'
    text: |-
      De ondernemer zorgt ervoor dat voor werknemers die jonger zijn dan 18 jaar geen arbeid krijgen toegewezen
      of verrichten waarbij de mogelijkheid bestaat dat de dosislimieten, genoemd in [artikel 7.3][ref1], worden
      overschreden, tenzij [artikel 7.35, eerste lid][ref2], van toepassing is.


