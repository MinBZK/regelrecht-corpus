  - number: '7.8'
    text: >-
      1 Met betrekking tot een gecontroleerde zone zorgt de ondernemer ervoor dat:


      a. deze is afgebakend en de toegang ertoe beperkt blijft tot door hem daartoe aangewezen werknemers die passende
      schriftelijke instructies hebben ontvangen, en dat zij worden gecontroleerd overeenkomstig de door hem daartoe
      vastgestelde schriftelijke procedures;


      b. specifieke afspraken zijn gemaakt voor die gevallen waarin een aanzienlijk risico op verspreiding van
      radioactieve stoffen bestaat. Deze afspraken omvatten ook maatregelen betreffende de toegang tot en het verlaten
      van de zone door werknemers en goederen en het monitoren van de besmetting in de zone en, in voorkomend geval, de
      aangrenzende zone;


      c. er, met inachtneming van de aard en omvang van de stralingsrisico’s in de zone, toezicht op de werkomgeving is;


      d. op de daarvoor geschikte plaatsen waarschuwingsborden en -tekens als bedoeld in I zijn aangebracht;


      e. de betrokken werknemers passende schriftelijke werkinstructies zijn gegeven, toegesneden op de met de binnen de
      zone aanwezige bron en de aan de daar te verrichten handeling verbonden risico’s van ioniserende straling;


      f. de werknemer een specifieke opleiding ontvangt toegesneden op de bijzonderheden van werkplek en de handeling; en


      g. de werknemer de beschikking heeft over passende beschermingsmiddelen en deze gebruikt overeenkomstig de
      gebruiksaanwijzing en de overigens gegeven instructies.


      2 Bij regeling van Onze Minister van Sociale Zaken en Werkgelegenheid kunnen nadere regels worden gesteld met
      betrekking tot de gecontroleerde zone, bedoeld in het eerste lid.


      3 Indien blijkt dat niet aan alle criteria, genoemd in het eerste lid, wordt voldaan, zorgt de ondernemer ervoor
      dat de betrokken ruimte niet langer wordt aangemerkt als gecontroleerde zone en worden de verrichte handelingen met
      bronnen, voor zover die plaats dienen te vinden in een gecontroleerde zone, in die ruimte gestaakt.
    url: https://wetten.overheid.nl/BWBR0040179/2025-01-01#Artikel7.8
  - number: '7.9'
    text: |-
      1 Met betrekking tot een bewaakte zone zorgt de ondernemer ervoor dat er:

      a. met inachtneming van de aard en omvang van de stralingsrisico’s in de zone, toezicht op de werkomgeving is;

      b. op de daarvoor geschikte plaatsen waarschuwingsborden en -tekens als bedoeld in [artikel 4.1][ref1] zijn
      aangebracht; en

      c. passende schriftelijke werkinstructies zijn gegeven, toegesneden op de met de binnen de zone aanwezige bron en
      aan de daar te verrichten handeling verbonden risico’s van ioniserende straling.

      2 Bij regeling van Onze Minister van Sociale Zaken en Werkgelegenheid kunnen nadere regels worden gesteld met
      betrekking tot de bewaakte zone, bedoeld in het eerste lid.

      3 Indien blijkt dat niet aan alle criteria, genoemd in het eerste lid, wordt voldaan, zorgt de ondernemer ervoor
      dat de betrokken ruimte niet langer wordt aangemerkt als bewaakte zone en worden de verrichte handelingen met
      bronnen, voor zover die plaats dienen te vinden in een bewaakte zone, in die ruimte gestaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0040179#Artikel4.1
