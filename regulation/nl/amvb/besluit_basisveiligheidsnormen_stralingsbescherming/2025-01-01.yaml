  - number: '10.5'
    text: |-
      1 Het is verboden radioactieve stoffen te lozen op of in de bodem.

      2 Het verbod, bedoeld in het eerste lid, is niet van toepassing op het lozen in de bodem, wanneer de in een
      kalenderjaar totaal geloosde hoeveelheid radioactieve stoffen bij het verlaten van het lozingspunt minder bedraagt
      dan 10-6 radiotoxiciteitsequivalent voor ingestie als bedoeld in [bijlage 2][ref1].

      3 Het verbod, bedoeld in het eerste lid, is voorts niet van toepassing op het lozen van productiewater bij
      mijnbouw, indien dit geschiedt door middel van injecteren naar een soortgelijke bodemformatie en diepte als waaruit
      het water afkomstig is en op zodanige wijze dat het water niet in andere watervoerende lagen komt.

      4 De geloosde hoeveelheden, uitgedrukt in radiotoxiciteitsequivalenten, worden gecorrigeerd voor fysisch verval
      door middel van de correctiefactoren zoals aangegeven in [bijlage 2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0040179
      [ref2]: https://wetten.overheid.nl/BWBR0040179
