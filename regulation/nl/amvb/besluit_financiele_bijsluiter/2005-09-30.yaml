      1 Het bedrag van de boete, bedoeld in [artikel 33d, eerste lid, van de Wet toezicht beleggingsinstellingen][ref1],
      wordt bepaald op de wijze, voorzien in [bijlage A][ref2].

      2 Het bedrag van de boete, bedoeld in [artikel 48d, vijfde lid, van de Wet toezicht effectenverkeer 1995][ref3],
      wordt bepaald op de wijze, voorzien in [bijlage B][ref4].

      3 Het bedrag van de boete, bedoeld in
      [artikel 90d, vijfde lid, eerste volzin, van de Wet toezicht kredietwezen 1992][ref5], wordt bepaald op de wijze,
      voorzien in [bijlage C][ref6].

      4 Het bedrag van de boete, bedoeld in
      [artikel 93d, vijfde lid, eerste volzin, van de Wet toezicht natura-uitvaartverzekeringsbedrijf][ref7], wordt
      bepaald op de wijze, voorzien in [bijlage D][ref8].

      5 Het bedrag van de boete, bedoeld in
      [artikel 188d, vijfde lid, eerste volzin, van de Wet toezicht verzekeringsbedrijf 1993][ref9], wordt bepaald op de
      wijze, voorzien in [bijlage E][ref10].

      6 De toezichthoudende autoriteit kan het bedrag van de boete lager stellen dan in de bijlage is bepaald, indien het
      bedrag van de boete in een bepaald geval op grond van bijzondere omstandigheden onevenredig hoog is.


