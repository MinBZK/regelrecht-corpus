  - number: '2'
    text: |-
      1 Een financiële onderneming draagt er zorg voor dat voor complexe producten die zij aanbiedt een actuele
      financiële bijsluiter beschikbaar is en dat deze aan een afnemer voor of bij het sluiten van een overeenkomst
      inzake een complex product, kosteloos ter beschikking wordt gesteld.

      2 De toezichthoudende autoriteit stelt regels omtrent de wijze waarop een financiële bijsluiter ter beschikking
      wordt gesteld en wordt gehouden.

      3 De toezichthoudende autoriteit kan met betrekking tot door haar aan te wijzen complexe producten geheel
      of gedeeltelijk vrijstelling of ontheffing verlenen van het eerste lid of van de op grond van het tweede lid
      vastgestelde regels, indien de in het eerste lid genoemde verplichtingen of de op grond van het tweede lid
      vastgestelde regels de handel in het betreffende complexe product onevenredig zou belemmeren of de belangen die met
      de financiële bijsluiter worden beoogd te beschermen anderszins voldoende worden gewaarborgd. Aan een vrijstelling
      en een ontheffing kunnen beperkingen worden gesteld en voorschriften worden verbonden. Van een op grond van dit lid
      verleende vrijstelling of ontheffing zal mededeling worden gedaan in de Staatscourant.

      4 Indien de vrijstelling of ontheffing betrekking heeft op het tijdstip van het ter beschikking stellen van een
      financiële bijsluiter, draagt een financiële onderneming er zorg voor dat een afnemer voor of bij het sluiten
      van een overeenkomst inzake een complex product, er van in kennis wordt gesteld dat hem desgevraagd, onverwijld
      en kosteloos een financiële bijsluiter ter beschikking wordt gesteld. In ieder geval wordt aan de afnemer in
      een dergelijk geval binnen vier weken na het sluiten van de overeenkomst kosteloos een financiële bijsluiter ter
      beschikking gesteld.

      5 De toezichthoudende autoriteit kan een andere financiële dienst of financieel product dan bedoeld in
      [artikel 1, onderdeel c][ref1], eveneens aanwijzen als een complex product, indien dit ten behoeve van de
      vergelijkbaarheid van complexe producten met deze financiële dienst of financieel product in verband met de
      goede informatieverstrekking aan afnemers wenselijk is. Van deze aanwijzing zal mededeling worden gedaan in de
      Staatscourant.

      6 Op de financiële dienst of het financiële product dat ingevolge het vijfde lid is aangewezen is het eerste
      lid van toepassing met ingang van de eerste dag van de vierde kalendermaand na de datum van uitgifte van de
      Staatscourant waarin van deze aanwijzing mededeling wordt gedaan.

      7 Dit artikel is niet van toepassing op het aanbieden van rechten van deelneming in een beleggingsinstelling
      terzake waarvan wordt voldaan aan [artikel 3, eerste lid, van de Wet toezicht effectenverkeer 1995][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013263#Artikel1
