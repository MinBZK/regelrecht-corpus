  - number: '3'
    text: |-
      1 In de financiële bijsluiter worden, onverminderd het derde lid, in duidelijke en voor de afnemer begrijpelijke
      bewoordingen, uitsluitend de volgende onderwerpen behandeld:

      a. de vermelding dat het een financiële bijsluiter betreft, welk product het betreft en de naam en het adres van de
      financiële onderneming;

      b. informatie over de doelstellingen van de financiële bijsluiter en over het toezicht op de financiële
      onderneming;

      c. de aard en het doel van het product;

      d. informatie over de met het product samenhangende financiële risico's;

      e. de verplichtingen voor de afnemer;

      f. informatie over het voorbeeldrendement en de voor de afnemer aan het product verbonden kosten;

      g. de mogelijkheid of onmogelijkheid voor de afnemer om de overeenkomst binnen een korte periode na het sluiten van
      de overeenkomst of anderszins tussentijds op te zeggen, de daaraan verbonden kosten en de overige gevolgen;

      h. fiscale aspecten van het product;

      i. de op de overeenkomst van toepassing zijnde klachtenregeling of klachtenregelingen;

      j. de op de overeenkomst van toepassing zijnde garantieregeling of garantieregelingen.

      2 De toezichthoudende autoriteit stelt regels inzake de informatie die in ieder van de in het eerste lid bedoelde
      onderdelen van de financiële bijsluiter wordt opgenomen en inzake de wijze waarop die informatie wordt vermeld.

      3 De toezichthoudende autoriteit kan, in het belang van een goede informatieverstrekking aan afnemers, regels
      stellen inzake de informatie die naast de in het eerste lid genoemde informatie in de financiële bijsluiter wordt
      opgenomen en inzake de wijze waarop die informatie wordt vermeld.

      4 De in het tweede en derde lid bedoelde regels kunnen voor verschillende complexe producten verschillend luiden.
    url: https://wetten.overheid.nl/BWBR0013263/2005-09-30#Artikel3
  - number: 3a
    text: |-
      1 In afwijking van [artikel 3, eerste lid][ref1], worden in de financiële bijsluiter die
      betrekking heeft op een beleggingsinstelling als bedoeld in [artikel 12, eerste lid][ref2], of
      [artikel 17c, eerste lid, van de Wet toezicht beleggingsinstellingen][ref3] in duidelijke en voor de afnemer
      begrijpelijke bewoordingen, uitsluitend de volgende onderwerpen behandeld:

      a. de vermelding dat het een financiële bijsluiter betreft, welke beleggingsinstelling het betreft en een korte
      omschrijving van de beleggingsinstelling;

      b. de doelstellingen van de financiële bijsluiter en het toezicht op de financiële onderneming;

      c. de aard en het doel van de beleggingsinstelling;

      d. de met de beleggingsinstelling samenhangende financiële risico’s;

      e. de verplichtingen voor de afnemer;

      f. indien beschikbaar: informatie over het historisch rendement en de voor de afnemer aan de deelnemingsrechten in
      de beleggingsinstelling verbonden kosten;

      g. de mogelijkheid of onmogelijkheid voor de afnemer om de overeenkomst na het sluiten van de overeenkomst
      tussentijds op te zeggen, de daaraan verbonden kosten en de overige gevolgen; en

      h. fiscale aspecten van de beleggingsinstelling.

      2 Het tweede en derde lid van [artikel 3][ref4] zijn van overeenkomstige toepassing. Indien het een financiële
      bijsluiter betreft die betrekking heeft op rechten van deelneming in een beleggingsinstelling als bedoeld in
      [artikel 12, derde lid, van de Wet toezicht beleggingsinstellingen][ref5] kan de toezichthouder regels stellen
      voor zover deze strekken tot het uitvoeren van [richtlijn nr. 85/611/EEG](31985L0611) van de Raad van de
      Europese Gemeenschappen van 20 december 1985 tot coördinatie van de wettelijke en bestuursrechtelijke bepalingen
      betreffende bepaalde instellingen voor collectieve belegging in effecten (icbe’s) met het oog op reglementering van
      beheermaatschappijen en vereenvoudigde prospectussen (PbEG L 41).


