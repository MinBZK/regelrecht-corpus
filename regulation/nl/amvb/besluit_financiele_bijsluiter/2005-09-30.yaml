  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Financiën van 5 juni 2001, no. FM 2001-888-M, Generale Thesaurie, Directie
    Financiële Markten, Afdeling Marktgedrag;

    Gelet op artikel 26, eerste lid, van de Wet op het consumentenkrediet, artikel 12, eerste lid, van de Wet toezicht
    beleggingsinstellingen, artikel 11, eerste lid, aanhef en onderdeel d, van de Wet toezicht effectenverkeer 1995,
    artikel 85a, eerste lid, van de Wet toezicht kredietwezen 1992, artikel 25, eerste lid, van de Wet toezicht natura-
    uitvaartverzekeringsbedrijf en artikel 51, eerste lid, van de Wet toezicht verzekeringsbedrijf 1993;

    De Raad van State gehoord (advies van 30 juli 2001, no. W06.01.0266/IV);

    Gezien het nader rapport van Onze Minister van Financiën van 13 december 2001, no. FM 2001-2080-M;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0013263/2005-09-30#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. financiële onderneming:

      1°. een kredietgever, een leverancier of een kredietbemiddelaar als bedoeld in
      [artikel 26, eerste lid, van de Wet op het consumentenkrediet][ref1];

      2°. een beheerder van een beleggingsinstelling als bedoeld in
      [artikel 12, eerste lid, van de Wet toezicht beleggingsinstellingen][ref2];

      3°. een beleggingsinstelling als bedoeld in
      [artikel 17c, eerste lid, van de Wet toezicht beleggingsinstellingen][ref3];

      4°. een effecteninstelling als bedoeld in
      [artikel 11, eerste en vijfde lid, van de Wet toezicht effectenverkeer 1995][ref4];

      5°. een kredietinstelling of een financiële instelling als bedoeld in
      [artikel 85a, eerste lid, van de Wet toezicht kredietwezen 1992][ref5];

      6°. een verzekeraar als bedoeld in
      [artikel 25, eerste lid, van de Wet toezicht natura-uitvaartverzekeringsbedrijf][ref6];

      7°. een verzekeraar als bedoeld in [artikel 51, eerste lid, van de Wet toezicht verzekeringsbedrijf 1993][ref7].

      b. afnemer: een afnemer of een potentiële afnemer van een door een financiële onderneming verstrekte of aangeboden
      financiële dienst of financieel product, voorzover die geacht kan worden niet te handelen in de uitoefening van een
      beroep of bedrijf;

      c. complex product: een financiële dienst of een financieel product, opgebouwd uit componenten die behoren tot
      verschillende soorten financiële diensten of financiële producten en waarvan de waarde van ten minste een der
      componenten afhankelijk is van de ontwikkeling op financiële markten of andere markten;

      d. financiële bijsluiter: een door een financiële onderneming aan een afnemer ter beschikking te stellen document
      waarin met betrekking tot een complex product informatie wordt gegeven over de essentiële kenmerken van het
      desbetreffende product;

      e. toezichthoudende autoriteit: Onze Minister of een rechtspersoon waaraan ingevolge
      [artikel 29, eerste lid, van de Wet toezicht beleggingsinstellingen][ref8],
      [artikel 40, eerste lid, van de Wet toezicht effectenverkeer 1995][ref9],
      [artikel 25, vierde lid, van de Wet toezicht natura-uitvaartverzekeringsbedrijf][ref10] en
      [artikel 51, vierde lid, van de Wet toezicht verzekeringsbedrijf 1993][ref11], taken en bevoegdheden zijn
      overgedragen voor zover het die taken en bevoegdheden betreft, dan wel een rechtspersoon waaraan ingevolge
      de [artikelen 14, derde lid][ref12], en [85a, vierde lid, van de Wet toezicht kredietwezen 1992][ref13]
      taken en bevoegdheden zijn overgedragen voor zover het die taken en bevoegdheden betreft, alsmede de taken
      en bevoegdheden inzake het toezicht op de naleving van het bij of krachtens dit besluit bepaalde ingevolge
      [artikel 26 van de Wet op het Consumentenkrediet][ref14].


