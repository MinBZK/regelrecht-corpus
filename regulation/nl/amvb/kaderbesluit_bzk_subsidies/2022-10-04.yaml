preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, mede namens Onze Minister voor
    Wonen en Rijksdienst van 18 januari 2913, nr. 2013-0000031583;

    Gelet op de artikelen 3 en 4 van de Kaderwet overige BZK-subsidies;

    De Afdeling advisering van de Raad van State gehoord (advies van 13 maart 2013, nr. W04.13.0018/I);

    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, mede namens Onze Minister
    voor Wonen en Rijksdienst van 24 mei 2013, nr. 2013-0000260522;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - *aanvrager:* natuurlijk persoon of
      rechtspersoon die een subsidie aanvraagt op grond van een ministeriële regeling als bedoeld in [artikel 2][ref1];
        - *algemene groepsvrijstellingsverordening:* [verordening (EG) nr. 800/2008](32008R0800) van de Commissie
      van de Europese Gemeenschappen van 6 augustus 2008 waarbij bepaalde categorieën steun op grond van de
      artikelen 87 en 88 van het Verdrag met de gemeenschappelijke markt verenigbaar worden verklaard («de algemene
      groepsvrijstellingsverordening») (PbEU 9.8.2008, L 214/3), dan wel later daarvoor in de plaats tredende Europese
      regelgeving;
        - *de-minimis verordening:* [verordening (EG) nr. 1998/2006](32006R1998) van de Commissie van Europese
      Gemeenschappen van 15 december 2006 betreffende de toepassing van de artikelen 87 en 88 van het Verdrag op de-
      minimissteun (PbEU L379) ), [verordening (EG) nr. 1535/2007](32007R1535) van de Commissie van de Europese
      Gemeenschappen van 20 december 2007 betreffende de toepassing van de artikelen 87 en 88 van het Verdrag op de-
      minimissteun in de landbouwproductiesector (PbEU L 337) en [verordening (EG) nr. 875/2007](32007R0875) van de
      Commissie van de Europese Gemeenschappen van 24 juli 2007 betreffende de toepassing van de artikelen 87 en 88 van
      het Verdrag op de-minimissteun in de landbouwsector en de visserijsector (PbEU L 193), dan wel later daarvoor in de
      plaats tredende Europese regelgeving;
        - *Europees steunkader:* een mededeling, richtsnoer, kaderregeling, beschikking of vrijstellingsverordening op het
      gebied van staatssteun die de Commissie van de Europese Gemeenschappen, gelet op de artikelen 106, derde lid, 107
      en 108 van het Verdrag betreffende de werking van de Europese Unie (VWEU) heeft vastgesteld;
        - *wet:* [Kaderwet overige BZK-subsidies][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0033530#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019756
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0033530
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0019756
  - number: '2.1'
    text: |-
      Subsidies die worden verstrekt krachtens een ministeriële regeling op de gebieden, genoemd in
      [artikel 2 van de wet][ref1], worden verstrekt volgens de regels van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0019756#Artikel2
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0019756
        artikel: '2'
  - number: '2.2'
    text: |-
      [Artikel 25][ref1] van dit besluit is tevens van toepassing op subsidieverstrekking door Onze Minister die niet op
      een wettelijk voorschrift berust.


      [ref1]: https://wetten.overheid.nl/BWBR0033530#Artikel25
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0033530
        artikel: '25'
        hoofdstuk: '13'
  - number: '3'
    text: |-
      Geen subsidie wordt verstrekt aan een provincie, gemeente, waterschap of openbaar lichaam als bedoeld in de
      [Wet gemeenschappelijke regelingen][ref1], tenzij bij ministeriële regeling is bepaald dat daaraan wel subsidie
      wordt verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: '4.1'
    text: |-
      Indien reeds door een bestuursorgaan of de Commissie van de Europese Unie subsidie is verstrekt voor de
      subsidiabele kosten of een deel daarvan, wordt slechts een zodanig bedrag aan subsidie verstrekt dat het totale
      bedrag aan subsidies niet meer bedraagt dan het bedrag dat krachtens dit besluit kan worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel4
  - number: '4.2'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat bepaalde subsidieregelingen of bijdragen van de Commissie van de
      Europese Unie bij de toepassing van het eerste lid buiten beschouwing blijven.
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel4
  - number: '4.3'
    text: |-
      Indien bij ministeriële regeling is bepaald dat toepassing is gegeven aan een de-minimis verordening of de algemene
      groepsvrijstellingsverordening, wordt het bedrag van de subsidie verlaagd voor zover dit nodig is op basis van
      deze verordening.
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel4
  - number: '5.1'
    text: |-
      Een subsidie lager dan € 25 000, die op grond van de artikelen 107 en 108 van het Verdrag betreffende de werking
      van de Europese Unie is aan te merken als staatssteun, wordt voor zover mogelijk verstrekt met toepassing van de
      desbetreffende de-minimis verordening.
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel5
  - number: '5.2'
    text: |-
      Het eerste lid is niet van toepassing indien de subsidie kan worden verstrekt met goedkeuring van de Commissie van
      de Europese Unie of onder de werking van een vrijstellingsverordening.
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel5
  - number: '6.1'
    text: |-
      Voor subsidie komen in aanmerking de redelijk te maken kosten die direct verbonden zijn met de uitvoering van de
      activiteiten waarvoor de subsidie wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel6
  - number: '6.2'
    text: |-
      De subsidiabele kosten worden door de aanvrager berekend op basis van een voor de aanvrager gebruikelijke en voor
      Onze Minister controleerbare methode, die is gebaseerd op bedrijfseconomische grondslagen en normen die in het
      maatschappelijk verkeer als aanvaardbaar worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel6
  - number: '6.3'
    text: De subsidiabele kosten worden door Onze Minister op hun aannemelijkheid en redelijkheid getoetst.
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel6
  - number: '6.4'
    text: |-
      Tenzij bij ministeriële regeling anders is bepaald, wordt geen subsidie verstrekt voor activiteiten voor zover die
      uit andere hoofde zijn of worden gesubsidieerd of gefinancierd.
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel6
  - number: '6.5'
    text: Vóór indiening van de aanvraag door de aanvrager gemaakte kosten komen niet voor subsidie in aanmerking, tenzij
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel6
  - number: 6.5.a
    text: |-
      het een subsidie lager dan € 25.000 betreft waarbij met toepassing van [artikel 16, tweede lid, onderdeel a][ref1],
      direct een beschikking tot subsidievaststelling wordt gegeven; of


      [ref1]: https://wetten.overheid.nl/BWBR0033530#Artikel16
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0033530
        artikel: '16'
        hoofdstuk: '8'
  - number: 6.5.b
    text: bij ministeriële regeling anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel6
  - number: '6.6'
    text: |-
      Verschuldigde btw komt uitsluitend voor subsidie in aanmerking ingeval de aanvrager de btw niet kan verrekenen met
      de door hem af te dragen omzetbelasting.
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel6
  - number: '6.7'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld over de kosten die voor subsidie in aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel6
  - number: '7.1'
    text: |-
      Indien in het kader van de berekening van de hoogte van de subsidiabele kosten uurtarieven worden
      gehanteerd, worden deze door de aanvrager berekend aan de hand van één of meer in het tweede lid genoemde
      standaardberekeningswijzen.
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel7
  - number: '7.2'
    text: 'Als standaardberekeningswijzen voor de berekening van uurtarieven worden gehanteerd:'
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel7
  - number: 7.2.1
    text: berekening op basis van integrale kosten;
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel7
  - number: 7.2.2
    text: |-
      berekening op basis van kosten per kostendrager vermeerderd met een forfaitair vastgestelde opslag voor indirecte
      kosten; of
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel7
  - number: 7.2.3
    text: een forfaitair vastgesteld uurtarief.
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel7
  - number: '7.3'
    text: |-
      Bij ministeriële regeling wordt bepaald welke van de in het tweede lid genoemde standaardberekeningswijzen in dat
      geval van toepassing is.
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel7
  - number: '7.4'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over de toepassing van de standaardberekeningswijzen
      genoemd in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel7
  - number: '8.1'
    text: |-
      Bij ministeriële regeling wordt een subsidieplafond vastgesteld voor het verstrekken van subsidies op in een
      bepaalde periode ontvangen aanvragen op grond van die ministeriële regeling. Daarbij kunnen afzonderlijke
      subsidieplafonds worden vastgesteld voor bepaalde categorieën van aanvragers of activiteiten of voor bepaalde
      thema’s of voor bepaalde vormen van subsidie.
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel8
  - number: '8.2'
    text: 'Bij ministeriële regeling als bedoeld in het eerste lid wordt gekozen voor:'
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel8
  - number: 8.2.a
    text: verdeling van het subsidieplafond op volgorde van binnenkomst van de aanvragen,
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel8
  - number: 8.2.b
    text: evenredige verdeling van het subsidieplafond over de ingediende aanvragen, of
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel8
  - number: 8.2.c
    text: verdeling van het subsidieplafond op volgorde van rangschikking van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel8
  - number: '8.3'
    text: |-
      Indien wordt gekozen voor verdeling van het subsidieplafond op volgorde van binnenkomst, kan bij ministeriële
      regeling worden bepaald op welke wijze wordt omgegaan met meerdere aanvragen van één aanvrager of aanvragers binnen
      één groep.
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel8
  - number: '9.1'
    text: |-
      Indien het subsidieplafond wordt verdeeld op volgorde van binnenkomst van de aanvragen verdeelt Onze Minister het
      beschikbare bedrag in de volgorde van ontvangst van de aanvragen, met dien verstande dat indien een aanvrager niet
      heeft voldaan aan enig wettelijk voorschrift voor het in behandeling nemen van de aanvraag en met toepassing van
      [artikel 4:5 van de Algemene wet bestuursrecht][ref1] de gelegenheid heeft gehad de aanvraag aan te vullen, de dag
      waarop de aanvraag voldoet aan de wettelijke voorschriften met betrekking tot de verdeling als datum van ontvangst
      geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '9.2'
    text: |-
      Indien het subsidieplafond wordt verdeeld op volgorde van binnenkomst en Onze Minister op de dag dat het
      subsidieplafond wordt bereikt meer dan één aanvraag ontvangt, stelt hij de onderlinge rangschikking van die
      aanvragen vast door middel van loting, tenzij bij ministeriële regeling een andere wijze van vaststelling van die
      rangschikking is bepaald.
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel9
  - number: '9.3'
    text: |-
      Indien het subsidieplafond wordt verdeeld op volgorde van binnenkomst en het subsidieplafond is bereikt, doet Onze
      Minister daarvan onverwijld mededeling in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel9
  - number: '10'
    text: |-
      Indien het subsidieplafond wordt verdeeld op volgorde van rangschikking van de aanvragen worden bij ministeriële
      regeling rangschikkingscriteria vastgesteld en, indien meerdere rangschikkingscriteria worden vastgesteld, de
      onderlinge weging daarvan. Indien Onze Minister zich bij de rangschikking van aanvragen laat adviseren door een
      persoon die of een college dat niet onder zijn verantwoordelijkheid werkzaam is, wordt bij ministeriële regeling
      bepaald door wie en op welke wijze het advies wordt uitgebracht.
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel10
  - number: '11.1'
    text: |-
      Een aanvraag om subsidie wordt ingediend met gebruikmaking van een daartoe beschikbaar gesteld formulier. Bij
      ministeriële regeling kan worden bepaald dat gebruik moet worden gemaakt van een door Onze Minister elektronisch
      beschikbaar gesteld formulier.
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel11
  - number: '11.2'
    text: Bij ministeriële regeling kunnen regels worden gesteld over de periode waarbinnen de aanvraag wordt ingediend.
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel11
  - number: '11.3'
    text: |-
      De aanvraag bevat, tenzij bij ministeriële regeling anders is bepaald, in ieder geval de volgende gegevens en
      bescheiden:
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel11
  - number: 11.3.a
    text: een overzicht van de activiteiten waarvoor subsidie wordt gevraagd;
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel11
  - number: 11.3.b
    text: |-
      een toelichting op de wijze waarop en de mate waarin de activiteiten waarvoor subsidie wordt gevraagd een bijdrage
      leveren aan de doelstellingen van de betreffende subsidieregeling;
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel11
  - number: 11.3.c
    text: |-
      een gespecificeerde begroting, die een goed inzicht geeft in de geraamde inkomsten en uitgaven, voor zover deze
      betrekking hebben op de activiteiten waarvoor subsidie wordt gevraagd;
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel11
  - number: 11.3.d
    text: een tijdsplanning van de activiteit;
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel11
  - number: 11.3.e
    text: |-
      indien voorschotten worden aangevraagd, een weergave van de liquiditeitsbehoefte gedurende het tijdvak waarvoor
      subsidie wordt gevraagd, zo mogelijk per tijdvak van drie maanden;
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel11
  - number: 11.3.f
    text: |-
      het bankrekeningnummer waarop het subsidiebedrag dient te worden gestort, inclusief een bewijs dat de bankrekening
      op naam van de aanvrager staat;
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel11
  - number: 11.3.g
    text: indien van toepassing, het inschrijfnummer van de aanvrager bij de Kamer van Koophandel.
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel11
  - number: '12'
    text: |-
      Onze Minister beslist afwijzend op een aanvraag om subsidie indien de aanvraag niet voldoet aan de bij of krachtens
      dit besluit gestelde regels.
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel12
  - number: '13'
    text: 'Onze Minister beslist voorts afwijzend op een aanvraag om subsidie voor zover:'
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel13
  - number: 13.a
    text: |-
      door de toepassing van een de-minimis verordening, een bedrag aan de-minimis steun zou worden verstrekt dat hoger
      is dan geoorloofd op grond van deze verordening;
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel13
  - number: 13.b
    text: onvoldoende vertrouwen bestaat dat de betrokkenen de activiteiten kunnen financieren;
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel13
  - number: 13.c
    text: |-
      het onaannemelijk wordt geacht dat de activiteiten binnen een bij ministeriële regeling gestelde termijn kunnen
      worden voltooid;
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel13
  - number: 13.d
    text: aannemelijk is dat de activiteiten ook zonder subsidie zonder belangrijke vertraging zouden worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel13
  - number: 13.e
    text: onvoldoende vertrouwen bestaat in de technische haalbaarheid van de activiteiten;
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel13
  - number: 13.f
    text: onvoldoende vertrouwen bestaat in de economische haalbaarheid van de activiteiten;
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel13
  - number: 13.g
    text: de activiteiten onvoldoende bijdragen aan de doelstellingen van de subsidie;
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel13
  - number: 13.h
    text: |-
      onvoldoende vertrouwen bestaat dat de betrokkenen de capaciteiten hebben om de activiteiten naar behoren uit te
      voeren.
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel13
  - number: '14'
    text: |-
      Bij ministeriële regeling kunnen andere afwijzingsgronden dan de afwijzingsgronden, bedoeld in de
      [artikelen 12][ref1] en [13][ref2], worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0033530#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0033530#Artikel13
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0033530
        artikel: '12'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0033530
        artikel: '13'
        hoofdstuk: '7'
  - number: '15'
    text: |-
      Tenzij bij ministeriële regeling anders is bepaald, wordt een subsidie ten laste van een begroting die nog niet is
      vastgesteld verleend onder de voorwaarde dat voldoende gelden ter beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel15
  - number: '16.1'
    text: |-
      Een subsidie lager dan € 25.000 wordt verstrekt in de vorm van een vast bedrag dat in de ministeriële regeling
      wordt vastgelegd of dat wordt bepaald op basis van gegevens die worden ingediend bij de aanvraag.
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel16
  - number: '16.2'
    text: 'Indien een subsidie lager dan € 25.000 wordt verstrekt, wordt:'
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel16
  - number: 16.2.a
    text: direct een beschikking tot subsidievaststelling gegeven, of
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel16
  - number: 16.2.b
    text: |-
      een beschikking tot subsidieverlening gegeven, met vermelding van de datum waarop de activiteiten uiterlijk moeten
      zijn verricht en van de datum waarop de subsidie uiterlijk ambtshalve wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel16
  - number: '16.3'
    text: 'In het geval bedoeld in het tweede lid, onderdeel b, is de subsidieontvanger verplicht om:'
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel16
  - number: 16.3.a
    text: |-
      onverwijld een schriftelijke melding te doen zodra aannemelijk is dat de activiteiten waarvoor de subsidie is
      verleend niet, niet tijdig of niet geheel zullen worden verricht of dat niet, niet tijdig of niet geheel aan de aan
      de subsidie verbonden verplichtingen zal worden voldaan; en
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel16
  - number: 16.3.b
    text: |-
      desgevraagd, op door Onze Minister van tevoren in de beschikking of in de betrokken ministeriële regeling
      aangegeven wijze, aan te tonen dat de activiteiten waarvoor de subsidie is verleend, zijn verricht en dat is
      voldaan aan de aan de subsidie verbonden verplichtingen.
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel16
  - number: '17.1'
    text: |-
      Een subsidie van € 25.000 tot € 125.000 wordt verstrekt in de vorm van een vast bedrag of een vast bedrag voor een
      nog te verrichten prestatie-eenheid, dat in de ministeriële regeling wordt vastgelegd of dat wordt bepaald op basis
      van gegevens die worden ingediend bij de aanvraag.
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel17
  - number: '17.2'
    text: |-
      Indien een subsidie van € 25.000 tot € 125.000 wordt verstrekt, wordt een beschikking tot subsidieverlening
      gegeven, met vermelding van de datum waarop de activiteiten uiterlijk moeten zijn verricht en het tijdstip waarop
      een aanvraag van een beschikking tot subsidievaststelling moet worden gedaan.
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel17
  - number: '17.3'
    text: 'In geval van een subsidie van € 25.000 tot € 125.000 is de subsidieontvanger verplicht om:'
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel17
  - number: 17.3.a
    text: |-
      onverwijld een schriftelijke melding te doen zodra aannemelijk is dat de activiteiten waarvoor de subsidie is
      verleend niet, niet tijdig of niet geheel zullen worden verricht of dat niet, niet tijdig of niet geheel aan de aan
      de subsidie verbonden verplichtingen zal worden voldaan; en
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel17
  - number: 17.3.b
    text: |-
      op door Onze Minister van tevoren in de beschikking of in de betrokken ministeriële regeling aangegeven wijze,
      aan te tonen dat de activiteiten waarvoor de subsidie is verleend, zijn verricht en dat is voldaan aan de aan de
      subsidie verbonden verplichtingen.
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel17
  - number: '18.1'
    text: |-
      Een subsidie van € 125.000 of meer wordt verstrekt in de vorm van een maximumbedrag voor een nog te verrichten
      prestatie-eenheid, dat in de ministeriële regeling wordt vastgelegd of dat wordt bepaald op basis van gegevens die
      worden ingediend bij de aanvraag.
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel18
  - number: '18.2'
    text: |-
      Indien een subsidie van € 125.000 of meer wordt verstrekt, wordt een beschikking tot subsidieverlening gegeven, met
      vermelding van de datum waarop de activiteiten uiterlijk moeten zijn verricht en het tijdstip waarop een aanvraag
      van een beschikking tot subsidievaststelling moet worden gedaan.
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel18
  - number: '18.3'
    text: |-
      In geval van een subsidie van € 125.000 of meer is de subsidieontvanger verplicht om onverwijld een schriftelijke
      melding te doen zodra aannemelijk is dat de activiteiten waarvoor de subsidie is verleend niet, niet tijdig
      of niet geheel zullen worden verricht of dat niet, niet tijdig of niet geheel aan de aan de subsidie verbonden
      verplichtingen zal worden voldaan.
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel18
  - number: '19'
    text: |-
      Indien de periode van uitvoering van de activiteiten waarvoor subsidie van € 25.000 of meer wordt verstrekt meer
      dan twaalf maanden bedraagt, is de subsidieontvanger tevens verplicht om één keer per periode van twaalf maanden
      via een voortgangsverslag inzicht te geven in de voortgang van de activiteiten.
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel19
  - number: '20'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat de regels inzake een subsidie lager dan € 25.000 van toepassing
      zijn op een subsidie van € 25.000 of meer of dat de regels inzake een subsidie van € 25.000 tot € 125.000 van
      toepassing zijn op subsidies van € 125.000 of meer.
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel20
  - number: '21'
    text: 'De subsidieontvanger is verplicht:'
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel21
  - number: 21.a
    text: |-
      de activiteit uit te voeren overeenkomstig de omschrijving van die activiteit in de beschikking tot
      subsidieverlening, of, indien direct een beschikking tot subsidievaststelling wordt gegeven, overeenkomstig de
      omschrijving van die activiteit in de subsidievaststelling;
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel21
  - number: 21.b
    text: te voldoen aan de verplichtingen die door Onze Minister aan de subsidie zijn verbonden;
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel21
  - number: 21.c
    text: |-
      op verzoek van Onze Minister medewerking te verlenen aan openbaarmaking van de gegevens en de resultaten van de
      gesubsidieerde activiteit, tenzij openbaarmaking daarvan redelijkerwijs niet kan worden gevergd;
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel21
  - number: 21.d
    text: |-
      op verzoek van Onze Minister alle medewerking te verlenen aan een door Onze Minister terzake van de toepassing
      en de effecten van dit besluit ingesteld evaluatieonderzoek, die Onze Minister redelijkerwijs nodig heeft bij de
      uitvoering van dat evaluatieonderzoek;
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel21
  - number: 21.e
    text: indien een egalisatiereserve is gevormd, deze zo veilig mogelijk te beheren;
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel21
  - number: 21.f
    text: |-
      onverwijld schriftelijk mededeling te doen aan Onze Minister van de indiening bij de rechtbank van een verzoek
      tot het op hem van toepassing verklaren van de schuldsaneringsregeling natuurlijke personen, tot verlening van
      surseance van betaling aan hem of tot faillietverklaring van hem;
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel21
  - number: 21.g
    text: |-
      voor de activiteiten waarvoor subsidie wordt ontvangen en voor de overige activiteiten een gescheiden administratie
      te voeren;
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel21
  - number: 21.h
    text: |-
      de in het kader van de subsidieverstrekking gevoerde administratie te bewaren tot vijf jaar na de datum van de
      beschikking tot subsidievaststelling of, indien sprake is van staatssteun, gedurende een andere bij ministeriële
      regeling of bij beschikking aangegeven termijn;
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel21
  - number: 21.i
    text: |-
      op verzoek van Onze Minister nadere informatie aan te leveren ten behoeve van nadere verantwoording aan de Europese
      Commissie, op basis van de artikelen 106, tweede en derde lid, 107 en 108 van het Verdrag betreffende de Werking
      van de Europese Unie dan wel een van de Europese steunkaders.
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel21
  - number: '22.1'
    text: |-
      Een beschikking tot subsidieverlening wordt gegeven binnen dertien weken na ontvangst van de aanvraag of,
      indien sprake is van een subsidieplafond en de verdeling plaatsvindt in volgorde van rangschikking of evenredige
      verdeling, binnen dertien weken na afloop van de periode waarbinnen aanvragen kunnen worden ingediend. Indien
      sprake is van cofinanciering, over de aanvraag advies wordt ingewonnen of een nader onderzoek is ingesteld dan
      geldt een termijn van 22 weken.
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel22
  - number: '22.2'
    text: |-
      Een beschikking tot subsidievaststelling als bedoeld in [artikel 16, tweede lid, onderdeel a][ref1], wordt gegeven
      binnen dertien weken na ontvangst van de aanvraag van de subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0033530#Artikel16
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0033530
        artikel: '16'
        hoofdstuk: '8'
  - number: '22.3'
    text: |-
      Een ambtshalve beschikking tot subsidievaststelling als bedoeld in [artikel 16, tweede lid, onderdeel b][ref1],
      wordt gegeven binnen 22 weken na de in de verleningsbeschikking opgenomen datum waarop de activiteiten waarvoor de
      subsidie wordt verleend moeten zijn verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0033530#Artikel16
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0033530
        artikel: '16'
        hoofdstuk: '8'
  - number: '22.4'
    text: |-
      Een aanvraag van een beschikking tot subsidievaststelling vindt plaats binnen dertien weken na het
      verricht zijn van de activiteiten waarvoor de subsidie is verleend. Bij ministeriële regeling of bij de
      beschikking tot subsidieverlening kan een andere termijn worden bepaald. Als sprake is van een subsidie
      waarbij verantwoord wordt volgens het principe van Single information Single audit als bedoeld in
      [artikel 17a van de Financiële-verhoudingswet][ref1], vindt vaststelling plaatst op basis van die verantwoording.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 17a
  - number: '22.5'
    text: Een beschikking tot subsidievaststelling wordt gegeven binnen 22 weken na ontvangst van de aanvraag daarvan.
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel22
  - number: '23.1'
    text: |-
      In het geval van een subsidie als bedoeld in [artikel 16, tweede lid, onderdeel a][ref1], vindt de betaling van het
      vastgestelde subsidiebedrag in één keer plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0033530#Artikel16
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0033530
        artikel: '16'
        hoofdstuk: '8'
  - number: '23.2'
    text: |-
      Indien een beschikking tot subsidieverlening als bedoeld in [artikel 16, tweede lid, onderdeel b][ref1], wordt
      gegeven wordt een voorschot uitgekeerd van 100%.


      [ref1]: https://wetten.overheid.nl/BWBR0033530#Artikel16
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0033530
        artikel: '16'
        hoofdstuk: '8'
  - number: '23.3'
    text: |-
      Bij subsidies als bedoeld in de [artikelen 17][ref1] en [18][ref2] wordt in de beschikking tot subsidieverlening de
      wijze van bevoorschotting opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0033530#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0033530#Artikel18
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0033530
        artikel: '17'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0033530
        artikel: '18'
        hoofdstuk: '8'
  - number: '24.1'
    text: |-
      De aanvraag tot subsidievaststelling wordt ingediend met gebruikmaking van een daartoe beschikbaar gesteld
      formulier. De aanvraag gaat vergezeld van de in het formulier aangegeven bescheiden, waaronder in elk geval:
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel24
  - number: 24.1.a
    text: een eindverslag omtrent de uitvoering van en de resultaten van de activiteiten, en
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel24
  - number: 24.1.b
    text: |-
      indien het een subsidie als bedoeld in [artikel 18][ref1] betreft, een controleverklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0033530#Artikel18
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0033530
        artikel: '18'
        hoofdstuk: '8'
  - number: '24.2'
    text: |-
      Indien sprake van een subsidieverlening in de vorm van een vast bedrag dan vindt verantwoording plaats van het
      totaal van de geleverde prestaties.
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel24
  - number: '24.3'
    text: |-
      Indien sprake is van een subsidieverlening in de vorm van een vast bedrag per prestatie-eenheid, dan vindt
      verantwoording plaats per prestatie-eenheid.
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel24
  - number: '24.4'
    text: |-
      Indien sprake is van een subsidieverlening in de vorm van een maximumbedrag voor een nog te verrichten prestatie-
      eenheid dan vindt verantwoording plaats van het totaal van de geleverde prestaties en gerealiseerde kosten.
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel24
  - number: '24.5'
    text: |-
      Bij ministeriële regeling of bij de subsidieverlening kan worden bepaald dat, in afwijking van het eerste lid,
      onderdeel b, de aanvraag tot subsidievaststelling niet vergezeld hoeft te gaan van een controleverklaring.
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel24
  - number: '25.1'
    text: 'Onze Minister houdt ter voorkoming van misbruik van subsidie een registratie bij waarin wordt vastgelegd:'
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel25
  - number: 25.1.a
    text: |-
      het opleggen van een boete aan een subsidieontvanger op grond van de
      [Wet bestuurlijke boete meldingsplichten door ministers verstrekte subsidies][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0032155
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0032155
  - number: 25.1.b
    text: |-
      het lager vaststellen van de subsidie op grond van
      [artikel 4:46, tweede lid, van de Algemene wet bestuursrecht][ref1], het intrekken
      of ten nadele van de subsidieontvanger wijzigen van de subsidieverlening op grond van
      [artikel 4:48 van de Algemene wet bestuursrecht][ref2] en het intrekken of ten nadele van de subsidieontvanger
      wijzigen van de subsidievaststelling op grond van [artikel 4:49 van de Algemene wet bestuursrecht][ref3], indien de
      subsidieontvanger een verwijt kan worden gemaakt van de lagere vaststelling, intrekking of wijziging als hiervoor
      bedoeld;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 25.1.c
    text: |-
      de aard van de gedragingen die tot de maatregelen bedoeld in de onderdelen a en b hebben geleid en, in geval van
      maatregelen als bedoeld in onderdeel b, het subsidiebedrag dat daarmee is gemoeid;
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel25
  - number: 25.1.d
    text: |-
      de naam- en adresgegevens van de subsidieontvanger jegens wie maatregelen bedoeld in de onderdelen a en b zijn
      getroffen.
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel25
  - number: '25.2'
    text: |-
      De registratie kan worden geraadpleegd door daartoe door Onze Minister aangewezen ambtenaren die zich bezighouden
      met het verstrekken van subsidies op het terrein van het ministerie van Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel25
  - number: '25.3'
    text: |-
      De gegevens worden gedurende drie jaren geregistreerd vanaf de datum waarop een besluit als bedoeld in het eerste
      lid, onderdelen a of b, is genomen, waarna de betreffende gegevens uit de registratie worden verwijderd. De
      gegevens worden eveneens uit de registratie verwijderd indien het besluit bij een onherroepelijke beslissing op
      bezwaar is herroepen of bij een onherroepelijke rechterlijke uitspraak is vernietigd.
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel25
  - number: '25.4'
    text: |-
      Indien blijkt dat een aanvrager in de in het eerste lid bedoelde registratie is opgenomen kan Onze Minister aan
      de geregistreerde gegevens gevolgtrekkingen verbinden bij de beoordeling van de aanvraag, de in het kader van de
      subsidieverstrekking op te leggen verplichtingen en de controle op de naleving van die verplichtingen.
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel25
  - number: '26'
    text: |-
      Het [Subsidiebesluit experimenten en kennisoverdracht wonen][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0020333
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0020333
  - number: '27'
    text: |-
      De artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel27
  - number: '28'
    text: 'Dit besluit wordt aangehaald als: Kaderbesluit BZK-subsidies.'
    url: https://wetten.overheid.nl/BWBR0033530/2022-10-04#Artikel28
