$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: uitvoeringsbesluit_ex_artikel_11_en_12_grondwaterwet
regulatory_layer: AMVB
publication_date: '2009-11-24'
valid_from: '2006-12-20'
bwb_id: BWBR0003837
url: https://wetten.overheid.nl/BWBR0003837/2006-12-20
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 12 oktober 1984, nr. RRW 45949, Hoofddirectie van
    de Waterstaat, Hoofdafdeling Bestuurlijke en Juridische Zaken;

    Gelet op de artikelen 11, tweede lid, en 12, eerste lid, van de Grondwaterwet (Stb. 1981, 392);

    Gehoord de Commissie Grondwaterbeheer;

    De Raad van State gehoord (advies van 14 juni 1985, nr. W09.84.0613/12.5.23);

    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 19 augustus 1985, nr. RRW 30211,
    Hoofddirectie van de Waterstaat, Hoofdafdeling Bestuurlijke en Juridische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003837/2006-12-20#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Bij de opgave bedoeld in [artikel 11, eerste lid, onder ][ref1] (*Stb.* 1981, 392) dienen de volgende gegevens te
      worden verstrekt:


      [ref1]: https://wetten.overheid.nl/BWBR0003406#Artikel11
    url: https://wetten.overheid.nl/BWBR0003837/2006-12-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003406
        artikel: '11'
  - number: 1.1.a
    text: |-
      een aanduiding van de inrichting op een kaart, getekend op een zodanige schaal dat een duidelijk beeld wordt
      verkregen van de plaats en de omvang van de inrichting;
    url: https://wetten.overheid.nl/BWBR0003837/2006-12-20#Artikel1
  - number: 1.1.b
    text: een beschrijving van de inrichting;
    url: https://wetten.overheid.nl/BWBR0003837/2006-12-20#Artikel1
  - number: 1.1.c
    text: een raming van de hoeveelheden grondwater, die maximaal per maand en gemiddeld per jaar worden onttrokken;
    url: https://wetten.overheid.nl/BWBR0003837/2006-12-20#Artikel1
  - number: 1.1.d
    text: het doel waarvoor het onttrokken grondwater wordt gebruikt.
    url: https://wetten.overheid.nl/BWBR0003837/2006-12-20#Artikel1
  - number: '1.2'
    text: |-
      De in het eerste lid bedoelde gegevens behoeven niet te worden verstrekt voorzover zij in overeenstemming zijn met
      gegevens die reeds bij een aanvraag om een vergunning op grond van [artikel 14 van de Grondwaterwet][ref1] zijn
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0003406#Artikel14
    url: https://wetten.overheid.nl/BWBR0003837/2006-12-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003406
        artikel: '14'
  - number: '2.1'
    text: |-
      De onttrokken hoeveelheid grondwater dient op zodanige wijze te worden gemeten dat het meetresultaat in enig
      kwartaal niet meer dan vijf procent afwijkt van de werkelijk onttrokken hoeveelheid.
    url: https://wetten.overheid.nl/BWBR0003837/2006-12-20#Artikel2
  - number: '2.2'
    text: |-
      Voor inrichtingen die zijn opgericht voor een beperkte tijd, kunnen gedeputeerde staten - in door hen aan te wijzen
      gevallen - het in het eerste lid vermelde percentage op tien stellen.
    url: https://wetten.overheid.nl/BWBR0003837/2006-12-20#Artikel2
  - number: '2.3'
    text: |-
      Voor inrichtingen waarmee per jaar niet meer dan 50 000 kubieke meter grondwater wordt onttrokken alsmede voor
      inrichtingen die uitsluitend worden gebruikt voor beregenings- of bevloeiingsdoeleinden, kunnen gedeputeerde staten
        - op een daartoe strekkend verzoek - goedkeuren dat de onttrokken hoeveelheid wordt bepaald door vermeningvuldiging
      van de gemiddelde volumestroom met de gemeten tijd dat de inrichting in werking is. De gemiddelde volumestroom
      wordt door of vanwege gedeputeerde staten vastgesteld en geeft de hoeveelheid water in kubieke meters aan, die
      onder bedrijfsomstandigheden per uur door de inrichting stroomt.
    url: https://wetten.overheid.nl/BWBR0003837/2006-12-20#Artikel2
  - number: '2.4'
    text: |-
      Bij inrichtingen als bedoeld in [artikel 1, tweede lid, van de wet][ref1] kunnen gedeputeerde staten voorschrijven
      dat de verschillende onttrekkingen afzonderlijk worden gemeten.


      [ref1]: https://wetten.overheid.nl/BWBR0003406#Artikel1
    url: https://wetten.overheid.nl/BWBR0003837/2006-12-20#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003406
        artikel: '1'
  - number: '2.5'
    text: |-
      De plaats van meting en het type meetinstrument behoeven de goedkeuring van of vanwege gedeputeerde staten.
      Gedeputeerde staten kunnen een periodieke ijking van een meetinstrument voorschrijven en een instrument doen
      verzegelen.
    url: https://wetten.overheid.nl/BWBR0003837/2006-12-20#Artikel2
  - number: '3.1'
    text: |-
      Degene, die grondwater onttrekt, dient na afloop van ieder kwartaal de onttrokken hoeveelheid grondwater vast te
      stellen en op een meetstaat aan te tekenen. Gedeputeerde staten kunnen - afhankelijk van de wijze van meten - een
      hogere frequentie voorschrijven.
    url: https://wetten.overheid.nl/BWBR0003837/2006-12-20#Artikel3
  - number: '3.2'
    text: |-
      Op de in het eerste lid bedoelde meetstaat wordt - onder opgave van de datum - eveneens melding gemaakt van
      voorvallen, die van invloed kunnen zijn op de meting.
    url: https://wetten.overheid.nl/BWBR0003837/2006-12-20#Artikel3
  - number: '3.3'
    text: |-
      De in het eerste en tweede lid bedoelde gegevens dienen minstens vijf jaren voor het bevoegd gezag beschikbaar te
      worden gehouden.
    url: https://wetten.overheid.nl/BWBR0003837/2006-12-20#Artikel3
  - number: '4.1'
    text: |-
      Bij de opgave bedoeld in [artikel 11, tweede lid, eerste volzin][ref1], juncto
      [artikel 11, eerste lid, onder ][ref2] dienen de volgende gegevens te worden verstrekt:


      [ref1]: https://wetten.overheid.nl/BWBR0003406#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0003406#Artikel11
    url: https://wetten.overheid.nl/BWBR0003837/2006-12-20#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003406
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0003406
        artikel: '11'
  - number: 4.1.a
    text: |-
      een aanduiding van de infiltratie-werken op een kaart, getekend op een zodanige schaal dat een duidelijk beeld
      wordt verkregen van de plaats en de omvang van die werken;
    url: https://wetten.overheid.nl/BWBR0003837/2006-12-20#Artikel4
  - number: 4.1.b
    text: een beschrijving van de wijze waarop water wordt geïnfiltreerd;
    url: https://wetten.overheid.nl/BWBR0003837/2006-12-20#Artikel4
  - number: 4.1.c
    text: een raming van de hoeveelheden water, die maximaal per maand en gemiddeld per jaar worden geïnfiltreerd;
    url: https://wetten.overheid.nl/BWBR0003837/2006-12-20#Artikel4
  - number: 4.1.d
    text: de herkomst van het te infiltreren water;
    url: https://wetten.overheid.nl/BWBR0003837/2006-12-20#Artikel4
  - number: 4.1.e
    text: of en zo ja op welke wijze het te infiltreren water wordt voorgezuiverd.
    url: https://wetten.overheid.nl/BWBR0003837/2006-12-20#Artikel4
  - number: '4.2'
    text: |-
      [Artikel 1, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003837#Artikel1
    url: https://wetten.overheid.nl/BWBR0003837/2006-12-20#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003837
        artikel: '1'
        afdeling: I
  - number: '5.1'
    text: |-
      Bij het infiltreren van water dient de aangevoerde hoeveelheid water op zodanige wijze te worden gemeten dat het
      meetresultaat in enig kwartaal niet meer dan vijf procent afwijkt van de werkelijk aangevoerde hoeveelheid.
    url: https://wetten.overheid.nl/BWBR0003837/2006-12-20#Artikel5
  - number: '5.2'
    text: |-
      Voor gevallen waarin het infiltreren van water voor een beperkte tijd plaats vindt, kunnen gedeputeerde staten het
      in het eerste lid vermelde percentage op tien stellen.
    url: https://wetten.overheid.nl/BWBR0003837/2006-12-20#Artikel5
  - number: '5.3'
    text: |-
      [Artikel 2, vierde lid][ref1], is van toepassing; [artikel 3][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003837#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003837#Artikel3
    url: https://wetten.overheid.nl/BWBR0003837/2006-12-20#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003837
        artikel: '2'
        afdeling: I
      - id: ref2
        bwb_id: BWBR0003837
        artikel: '3'
        afdeling: I
  - number: 6.1.a
    text: |-
      Het meten van de kwaliteit van het te infiltreren water dient te geschieden door het nemen van representatieve
      monsters en het analyseren daarvan.
    url: https://wetten.overheid.nl/BWBR0003837/2006-12-20#Artikel6
  - number: 6.1.b
    text: |-
      De parameters die moeten worden bepaald en de frequentie van bemonstering en analyse zijn vermeld in de bij dit
      besluit behorende bijlage.
    url: https://wetten.overheid.nl/BWBR0003837/2006-12-20#Artikel6
  - number: 6.1.c
    text: |-
      De analyse van de monsters vindt plaats volgens de bepalingen van [artikel 7 van het Waterleidingbesluit][ref1]
      (*Stb.* 1960, 345).


      [ref1]: https://wetten.overheid.nl/BWBR0002339#Artikel7
    url: https://wetten.overheid.nl/BWBR0003837/2006-12-20#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002339
        artikel: '7'
  - number: '6.2'
    text: |-
      Afhankelijk van de mate van de te verwachten beïnvloeding van de kwaliteit van het grondwater en de bodem door het
      te infiltreren water kunnen gedeputeerde staten het aantal parameters alsmede de frequentie van bemonstering en
      analyse verhogen of verlagen.
    url: https://wetten.overheid.nl/BWBR0003837/2006-12-20#Artikel6
  - number: '6.3'
    text: |-
      Gedeputeerde staten bepalen op welke wijze de meetresultaten moeten worden opgetekend en op welk tijdstip de
      verkregen resultaten, eventueel in samengevatte vorm, aan hen moeten worden ingezonden.
    url: https://wetten.overheid.nl/BWBR0003837/2006-12-20#Artikel6
  - number: '6.4'
    text: |-
      De in het derde lid bedoelde meetresultaten dienen minstens vijf jaren voor het bevoegde gezag beschikbaar te
      worden gehouden.
    url: https://wetten.overheid.nl/BWBR0003837/2006-12-20#Artikel6
  - number: '7'
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na de datum van uitgifte van het Staatsblad waarin het
      is geplaatst.
    url: https://wetten.overheid.nl/BWBR0003837/2006-12-20#Artikel7
