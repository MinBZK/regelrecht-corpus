---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_werving_reclame_en_verslavingspreventie_kansspelen
regulatory_layer: AMVB
publication_date: '2025-11-14'
valid_from: '2026-01-01'
bwb_id: BWBR0033412
url: https://wetten.overheid.nl/BWBR0033412/2026-01-01
preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Veiligheid en Justitie van 11 januari 2013, nr. 340031;

    Gelet op de artikelen 4a, vijfde lid, en 30d, vierde lid, onder b, van de Wet op de Kansspelen;

    De Afdeling advisering van Raad van State gehoord (advies van 25 februari 2013, nr. W03.13.0005/II);

    Gezien het nader rapport van de Staatssecretaris van Veiligheid en Justitie van 25 april 2013, nr. 380347;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel1
  - number: 1.a
    text: |-
      *wet:* de [Wet op de kansspelen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002469
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002469
  - number: 1.b
    text: '*Onze Minister:* Onze Minister voor Rechtsbescherming;'
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel1
  - number: 1.c
    text: |-
      *raad van bestuur:* de raad van bestuur van de kansspelautoriteit, bedoeld in [artikel 33a van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33a
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33a
  - number: 1.d
    text: |-
      *vergunninghouders:* houders van een vergunning op grond van de [wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002469
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002469
  - number: 1.e
    text: |-
      *wervings- en reclameactiviteiten:* iedere vorm van communicatie waarmee vergunninghouders, al dan niet met behulp
      van derden, direct of indirect hun diensten of goederen aanprijzen;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel1
  - number: 1.f
    text: |-
      *bonus:* een goed of een dienst, waaronder gratis speeltegoed, aangeboden om spelers voor de vergunde kansspelen te
      werven of te behouden of om reclame voor die kansspelen te maken;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel1
  - number: 1.g
    text: '*leidinggevenden:*'
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel1
  - number: 1.g.1º
    text: de natuurlijke personen of de bestuurders van een rechtspersoon die de vergunning houden, of hun gevolmachtigden;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel1
  - number: 1.g.2º
    text: |-
      de natuurlijke personen die algemene leiding geven aan een onderneming waarin de vergunning in een of meer
      inrichtingen of op afstand wordt geëxploiteerd;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel1
  - number: 1.g.3º
    text: |-
      de natuurlijke personen die onmiddellijk leiding geven aan de bedrijfsvoering in een dergelijke onderneming of
      inrichting;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel1
  - number: 1.h
    text: |-
      *het register:* het register, bedoeld in [artikel 33h van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33h
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33h
  - number: 1.i
    text: |-
      *burgerservicenummer:* het burgerservicenummer, bedoeld in
      [artikel 1, onder b, van de Wet algemene bepalingen burgerservicenummer][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel1
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '1'
  - number: 1.j
    text: |-
      *kansspelen op afstand:* kansspelen als bedoeld in [artikel 31a, eerste lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel31a
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 31a
  - number: 1.k
    text: |-
      *speelautomatenhal:* inrichting als bedoeld in [artikel 30c, eerste lid, onder b, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel30c
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 30c
  - number: 1.l
    text: |-
      *speelcasino:* inrichting als bedoeld in [artikel 27g, tweede lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel27g
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 27g
  - number: '2.1'
    text: |-
      Wervings- en reclameactiviteiten van vergunninghouders zetten niet aan tot onmatige deelneming aan kansspelen.
      Onder onmatige deelneming wordt verstaan risicovol spelgedrag dat kan leiden tot kansspelverslaving.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel2
  - number: '2.2'
    text: 'Onder aanzetten tot onmatige deelneming wordt in ieder geval verstaan:'
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel2
  - number: 2.2.a
    text: het tot voorbeeld stellen van onmatige deelneming;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel2
  - number: 2.2.b
    text: het bagatelliseren van de gevolgen van onmatige deelneming;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel2
  - number: 2.2.c
    text: |-
      het wekken van de indruk dat deelneming aan kansspelen een oplossing kan vormen voor financiële of andere
      persoonlijke problemen.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel2
  - number: '2.3'
    text: |-
      Vergunninghouders richten hun wervings- en reclameactiviteiten voor kansspelen niet op maatschappelijk kwetsbare
      groepen van personen. Onder kwetsbare groepen van personen wordt in ieder geval verstaan minderjarigen en personen
      die kenmerken van risicovol spelgedrag vertonen.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel2
  - number: '2.4'
    text: |-
      Onverminderd het eerste tot en met derde lid, richt de houder van een vergunning tot het organiseren van een
      speelcasino, tot het aanwezig hebben van een of meer kansspelautomaten in een speelautomatenhal of tot het
      organiseren van kansspelen op afstand zijn wervings- en reclameactiviteiten voor kansspelen niet op personen:
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel2
  - number: 2.4.a
    text: in de leeftijdscategorie tussen 18 en 24 jaar;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel2
  - number: 2.4.b
    text: die zich hebben uitgesloten van deelname aan door hem georganiseerde kansspelen.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel2
  - number: '2.5'
    text: |-
      Wervings- en reclameactiviteiten van vergunninghouders voor kansspelen hebben geen betrekking op diensten of
      goederen van derden indien die diensten of goederen specifiek zijn gericht op maatschappelijk kwetsbare groepen
      van personen.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel2
  - number: '2.6'
    text: |-
      Bij de wervings- en reclameactiviteiten van vergunninghouders is het aanprijzen van andere diensten of goederen
      van vergunninghouders dan kansspelen toegestaan, mits voldoende duidelijk uit de betreffende wervings- of
      reclameactiviteit blijkt dat deze andere diensten of goederen worden aangeboden door een vergunninghouder.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel2
  - number: '2.7'
    text: |-
      Het is houders van een vergunning op grond van [artikel 30c, eerste lid, onder a, van de wet][ref1] niet toegestaan
      om wervings- en reclameactiviteiten te ontplooien ten aanzien van de door hen aangeboden kansspelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel30c
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 30c
  - number: '2.8'
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld betreffende de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel2
  - number: 2a.1
    text: |-
      De houder van een vergunning tot het organiseren van een speelcasino, tot het aanwezig hebben van een of meer
      kansspelautomaten in een speelautomatenhal of tot het organiseren van kansspelen op afstand biedt een speler geen
      bonus aan:
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel2a
  - number: 2a.1.a
    text: tijdens diens deelname aan een door hem georganiseerd kansspel;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel2a
  - number: 2a.1.b
    text: |-
      binnen een bij regeling van Onze Minister vastgestelde termijn nadat hij jegens die speler een interventiemaatregel
      als bedoeld in [artikel 18, eerste lid][ref1], heeft getroffen.


      [ref1]: https://wetten.overheid.nl/BWBR0033412#Artikel18
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0033412
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '5'
        afdeling: '2'
  - number: 2a.2
    text: |-
      De vergunninghouder stemt het moment waarop hij een bonus aanbiedt of de aard van de bonus niet af op het
      individuele speelgedrag van de speler.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel2a
  - number: 2a.3
    text: |-
      De vergunninghouder informeert de speler op passende, duidelijke en begrijpelijke wijze over de bonus, de
      voorwaarden voor de verstrekking van de bonus en voor de uitkering van eventueel daarmee verkregen speelwinst. Hij
      verstrekt geen bonus aan een speler die de voorwaarden niet uitdrukkelijk heeft aanvaard.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel2a
  - number: 2a.4
    text: |-
      De vergunninghouder stelt de speler in de gelegenheid te allen tijde aan te geven dat hij niet meer in aanmerking
      wil komen voor een bonus.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel2a
  - number: 2a.5
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld met betrekking tot het aanbieden en verstrekken
      van bonussen.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel2a
  - number: 2ab.1
    text: 'De houder van een vergunning tot het organiseren van kansspelen op afstand ontplooit voor die kansspelen:'
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel2ab
  - number: 2ab.1.a
    text: |-
      alleen zodanig specifiek gerichte wervings- en reclameactiviteiten dat deze geen personen bereiken als bedoeld in
      [artikel 2, derde en vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0033412#Artikel2
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel2ab
    references:
      - id: ref1
        bwb_id: BWBR0033412
        artikel: '2'
        hoofdstuk: '2'
  - number: 2ab.1.b
    text: 'geen wervings- en reclameactiviteiten:'
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel2ab
  - number: 2ab.1.b.1°
    text: |-
      via een omroepdienst als bedoeld in [artikel 1.1, eerste lid, van de Mediawet 2008][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel1
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel2ab
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '1'
  - number: 2ab.1.b.2°
    text: in kranten, tijdschriften of andere gedrukte, algemeen toegankelijke communicatiemiddelen;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel2ab
  - number: 2ab.1.b.3°
    text: |-
      die zijn waar te nemen op een openbare plaats als bedoeld in [artikel 1 van de Wet openbare manifestaties][ref1],
      in een voor het publiek toegankelijk gebouw als bedoeld in [artikel 174, eerste lid, van de Gemeentewet][ref2] of
      op een daarbij behorend erf.


      [ref1]: https://wetten.overheid.nl/BWBR0004318#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel174
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel2ab
    references:
      - id: ref1
        bwb_id: BWBR0004318
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '174'
  - number: 2ab.2
    text: |-
      Het eerste lid is niet van toepassing op wervings- en reclameactiviteiten via het internet of via een mediadienst
      op aanvraag als bedoeld in [artikel 1.1, eerste lid, van de Mediawet 2008][ref1], indien de houder van de
      vergunning:


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel1
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel2ab
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '1'
  - number: 2ab.2.a
    text: |-
      personen gelegenheid heeft gegeven aan te geven dat zij door de wervings- en reclameactiviteiten niet willen worden
      bereikt;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel2ab
  - number: 2ab.2.b
    text: |-
      de best beschikbare maatregelen treft om te voorkomen dat een wervings- of reclameactiviteit een persoon zal
      bereiken, als bedoeld in onderdeel a of in [artikel 2, derde of vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0033412#Artikel2
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel2ab
    references:
      - id: ref1
        bwb_id: BWBR0033412
        artikel: '2'
        hoofdstuk: '2'
  - number: 2ab.2.c
    text: |-
      met behulp van de best beschikbare technieken aantoont dat ten minste 95% van de personen die door een wervings- of
      reclameactiviteit zijn bereikt, de leeftijd van 24 jaar had bereikt.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel2ab
  - number: 2ab.3
    text: |-
      De houder van een andere vergunning op grond van de wet dan een vergunning tot het organiseren van kansspelen op
      afstand, ontplooit voor die andere kansspelen geen wervings- en reclameactiviteiten die:
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel2ab
  - number: 2ab.3.a
    text: |-
      door vorm, context of doel sterke gelijkenis vertonen met wervings- en reclameactiviteiten voor kansspelen op
      afstand;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel2ab
  - number: 2ab.3.b
    text: bij het publiek redelijkerwijs de indruk geven dat zij kansspelen op afstand aanprijzen of mede aanprijzen;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel2ab
  - number: 2ab.3.c
    text: |-
      het publiek via een URL of website of op enigerlei andere wijze direct of indirect verwijzen naar kansspelen op
      afstand.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel2ab
  - number: 2ab.4
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld betreffende de toepassing van het tweede en
      derde lid.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel2ab
  - number: '3.1'
    text: |-
      Agressieve en misleidende wervings- en reclameactiviteiten van vergunninghouders voor kansspelen zijn niet
      toegestaan.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel3
  - number: '3.2'
    text: |-
      Wervings- en reclameactiviteiten van vergunninghouders voor kansspelen door middel van huis-aan-huisbezoeken zijn
      verboden. Dit verbod geldt niet voor wervings- en reclameactiviteiten van houders van vergunningen op grond van
      [artikel 3, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel3
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: '3'
  - number: '3.3'
    text: |-
      Onverminderd het tweede lid is het persoonlijk benaderen van consumenten toegestaan, tenzij een consument aan de
      vergunninghouder of bij een daartoe bestemd meldpunt te kennen heeft gegeven zulks niet op prijs te stellen.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel3
  - number: '3.4'
    text: |-
      Het is houders van een vergunning op grond van [artikel 15][ref1], [23][ref2] of [31 van de wet][ref3] niet
      toegestaan tijdens sportwedstrijden, paardenrennen en harddraverijen, anders dan op de door hem geëxploiteerde
      kansspelinterface, reclame- en wervingsactiviteiten voor weddenschappen op die wedstrijden te ontplooien die
      gericht zijn op de toeschouwers van of kijkers naar de desbetreffende wedstrijd.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0002469#Artikel31
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0002469
        artikel: '23'
      - id: ref3
        bwb_id: BWBR0002469
        artikel: '31'
  - number: '3.5'
    text: 'Het is vergunninghouders verboden:'
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel3
  - number: 3.5.a
    text: |-
      wervings- en reclameactiviteiten voor kansspelen te ontplooien in andere spelen, niet zijnde kansspelen, die op
      afstand met elektronische communicatiemiddelen worden georganiseerd;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel3
  - number: 3.5.b
    text: |-
      met gebruikmaking van de elektronische communicatiemiddelen waarmee zij kansspelen aanbieden, wervings- en
      reclameactiviteiten voor andere spelen als bedoeld onder a te ontplooien;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel3
  - number: 3.5.c
    text: |-
      wervings- en reclameactiviteiten voor andere spelen als bedoeld onder a met gebruikmaking van de elektronische
      communicatiemiddelen waarmee zij kansspelen aanbieden, toe te staan.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel3
  - number: '3.6'
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld over de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel3
  - number: 3a.1
    text: |-
      De houder van een vergunning tot het organiseren een speelcasino, tot het aanwezig hebben van een of meer
      kansspelautomaten in een speelautomatenhal of tot het organiseren van kansspelen op afstand stemt zijn wervings- en
      reclameactiviteiten af op de uitkomsten van de risicoanalyse, bedoeld in [artikel 7, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033412#Artikel7
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0033412
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: 3a.2
    text: |-
      De vergunninghouder draagt er zorg voor dat hij te allen tijde verantwoording kan afleggen over de wijze waarop hij
      uitvoering heeft gegeven aan het eerste lid.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel3a
  - number: 3a.3
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel3a
  - number: '4.1'
    text: |-
      Vergunninghouders rapporteren in hun periodieke verslaggeving aan de raad van bestuur over hun wervings- en
      reclameactiviteiten.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel4
  - number: '4.2'
    text: |-
      Het eerste lid is niet van toepassing op houders van vergunningen die door burgemeester en wethouders zijn verleend
      op grond van [artikel 3, eerste lid, van de wet][ref1], alsmede op houders van vergunningen verleend op grond van
      [Titel Ia][ref2] en de [artikelen 30c, eerste lid, onder a][ref3], en [30h, eerste lid, van de wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002469
      [ref3]: https://wetten.overheid.nl/BWBR0002469#Artikel30c
      [ref4]: https://wetten.overheid.nl/BWBR0002469#Artikel30h
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002469
      - id: ref3
        bwb_id: BWBR0002469
        artikel: 30c
      - id: ref4
        bwb_id: BWBR0002469
        artikel: 30h
  - number: '4.3'
    text: |-
      Bij regeling van Onze Minister worden regels gesteld betreffende de frequentie waarmee vergunninghouders
      rapporteren aan de kansspelautoriteit, alsmede betreffende de specifieke onderwerpen waarover in de periodieke
      verslaggeving wordt gerapporteerd.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel4
  - number: '5.1'
    text: |-
      Bij wervings- en reclameactiviteiten voor kansspelen wordt de consument volledig geïnformeerd over deelneming aan
      kansspelen. Onverminderd [artikel 4a, derde lid, van de wet][ref1] wordt de consument in ieder geval geïnformeerd
      over:


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel4a
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 4a
  - number: 5.1.a
    text: de specifieke kenmerken van aangeboden kansspelen;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel5
  - number: 5.1.b
    text: de winstbepaling of de eventuele prijzen en de inhouding van kansspelbelasting;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel5
  - number: 5.1.c
    text: de kosten van deelneming;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel5
  - number: 5.1.d
    text: overige verplichtingen die verbonden zijn aan deelneming of het winnen van een prijs;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel5
  - number: 5.1.e
    text: de categorieën personen aan wie geen kansspelen mogen worden aangeboden;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel5
  - number: 5.1.f
    text: verantwoorde deelneming aan kansspelen, de gevaren van kansspelverslaving en de toegang tot verslavingszorg;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel5
  - number: 5.1.g
    text: het waarborgen van de privacy van deelnemers;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel5
  - number: 5.1.h
    text: de wijze waarop deelneming aan kansspelen kan worden beëindigd;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel5
  - number: 5.1.i
    text: de omvang en de bestemming van de opbrengsten van kansspelen.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel5
  - number: '5.2'
    text: |-
      Bij regeling van Onze Minister worden regels gesteld betreffende de wijze waarop uitvoering wordt gegeven aan het
      eerste lid, met inbegrip van de mogelijkheid om de informatieplicht nader aan te vullen, alsmede de wijze waarop:
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel5
  - number: 5.2.a
    text: wordt gewezen op de risico’s van onmatige deelneming aan kansspelen;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel5
  - number: 5.2.b
    text: wordt aangegeven wat de statistische kans is op het winnen van een prijs;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel5
  - number: 5.2.c
    text: |-
      wordt aangegeven of er sprake is van eenmalige deelneming dan wel van een abonnement of doorlopende deelneming
      tot wederopzegging.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel5
  - number: '5.3'
    text: |-
      Het eerste lid, aanhef en onder i, is niet van toepassing op wervings- en reclameactiviteiten van houders van
      vergunningen verleend op grond van de [artikelen 30c][ref1] en [30h van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel30c
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel30h
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 30c
      - id: ref2
        bwb_id: BWBR0002469
        artikel: 30h
  - number: '5.4'
    text: |-
      Het is niet toegestaan om bij de wervings- en reclameactiviteiten aan te geven, dan wel de suggestie te wekken,
      dat deelnemers of prijswinnaars verplicht zijn medewerking te verlenen aan enige vorm van werving of reclame door
      de vergunninghouder.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel5
  - number: '6.1'
    text: |-
      Leidinggevenden en personen op sleutelposities binnen de onderneming van de vergunninghouder beschikken over
      de kennis en het inzicht die nodig zijn om de vergunning te exploiteren met inachtneming van de bijzondere
      maatschappelijke verantwoordelijkheid die dat met zich brengt.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel6
  - number: '6.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op personen werkzaam in speelcasino’s, speelautomatenhallen en bij
      het organiseren van kansspelen op afstand, die zijn belast met het toelaten van personen tot het speelcasino, de
      speelautomatenhal of de spelersinterface, bedoeld in [artikel 1.1 van het Besluit kansspelen op afstand][ref1], met
      het toezicht op spelers en met de uitvoering van het verslavingspreventiebeleid.


      [ref1]: https://wetten.overheid.nl/BWBR0044773#Artikel1
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0044773
        artikel: '1'
  - number: '6.3'
    text: 'De in het eerste lid bedoelde kennis en inzicht heeft in ieder geval betrekking op:'
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel6
  - number: 6.3.a
    text: de aan de op grond van de vergunning aangeboden kansspelen verbonden risico’s van kansspelverslaving;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel6
  - number: 6.3.b
    text: kansspelverslaving, de negatieve gevolgen van kansspelverslaving en de gedragskenmerken van kansspelverslaafden;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel6
  - number: 6.3.c
    text: hulpverlening bij kansspelverslaving;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel6
  - number: 6.3.d
    text: de wet en andere regelgeving die verband houdt met kansspelen, en
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel6
  - number: 6.3.e
    text: de binnen de branche geldende gedragscodes.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel6
  - number: '6.4'
    text: 'Het eerste lid is niet van toepassing op personen, werkzaam binnen de onderneming van:'
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel6
  - number: 6.4.a
    text: |-
      de houder van een vergunning die door burgemeester en wethouders is verleend op grond van
      [artikel 3, eerste lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel3
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: '3'
  - number: 6.4.b
    text: |-
      de houder van een vergunning verleend, op grond van [artikel 3, eerste lid, van de wet][ref1] met een
      geldigheidsduur van maximaal zes maanden per jaar, en


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel3
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: '3'
  - number: 6.4.c
    text: |-
      de houder van een vergunning verleend op grond van [Titel Ia van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002469
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002469
  - number: '6.5'
    text: |-
      Bij regeling van Onze Minister worden nadere regels gesteld met betrekking tot de nadere invulling van dit artikel
      en worden eisen gesteld aan de bewijsstukken waaruit blijkt dat aan de in dit artikel gestelde eisen wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel6
  - number: '7.1'
    text: |-
      De houder van een vergunning tot het organiseren een speelcasino, tot het aanwezig hebben van een of meer
      kansspelautomaten in een speelautomatenhal of tot het organiseren van kansspelen op afstand draagt er voor zorg dat
      in zijn organisatie in samenwerking met deskundigen op het gebied van verslavingszorg en ervaringsdeskundigen op
      het gebied van kansspelen een doeltreffend verslavingspreventiebeleid wordt ontwikkeld, toegepast en onderhouden,
      dat ten minste voldoet aan de bij of krachtens dit hoofdstuk gestelde bepalingen en dat aansluit op het Nederlandse
      stelsel van verslavingszorg. In het verslavingspreventiebeleid wordt in ieder geval bijzondere aandacht geschonken
      aan:
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel7
  - number: 7.1.a
    text: |-
      de beschikbare maatregelen en voorzieningen ter preventie van kansspelverslaving en de gevallen waarin en de wijze
      waarop die instrumenten worden ingezet;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel7
  - number: 7.1.b
    text: de kwaliteitsborging van dat beleid;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel7
  - number: 7.1.c
    text: verslavingspreventie bij jongvolwassenen in de leeftijdscategorie tussen 18 en 24 jaar.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel7
  - number: '7.2'
    text: |-
      De houder van een vergunning tot het organiseren een speelcasino, tot het aanwezig hebben van een of meer
      kansspelautomaten in een speelautomatenhal of tot het organiseren van kansspelen op afstand beschikt te allen
      tijde over een actuele, deugdelijke en wetenschappelijk verantwoorde analyse van de verslavingsrisico’s van de
      door hem georganiseerde kansspelen. Hij stemt het verslavingspreventiebeleid, bedoeld in het eerste lid, af op de
      geconstateerde risico’s.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel7
  - number: '7.3'
    text: |-
      De vergunninghouder draagt er zorg voor dat de risico-analyses, bedoeld in het tweede lid, op onafhankelijke
      wijze worden uitgevoerd door een of meer functionarissen die beschikken over de nodige deskundigheid, kennis en
      bevoegdheden om die analyses goed en volledig uit te voeren. Hij treft waarborgen voor de functionele scheiding van
      zijn bestuur en de uitvoering van de risico-analyses.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel7
  - number: '7.4'
    text: |-
      De vergunninghouder rapporteert aan de raad van bestuur over het door hem gevoerde verslavingspreventiebeleid,
      bedoeld in het eerste lid, en de analyses, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel7
  - number: '7.5'
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld met betrekking tot het
      verslavingspreventiebeleid, bedoeld in het eerste lid, de analyses, bedoeld in het tweede lid, en de frequentie en
      inhoud van de rapportage, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel7
  - number: '8.1'
    text: |-
      De houder van een vergunning tot het organiseren van een speelcasino, tot het aanwezig hebben van een of meer
      kansspelautomaten in een speelautomatenhal of tot het organiseren van kansspelen op afstand verstrekt de consument
      op passende, duidelijke en begrijpelijke wijze informatie over ten minste de volgende onderwerpen:
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel8
  - number: 8.1.a
    text: de categorieën personen aan wie geen kansspelen mogen worden aangeboden;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel8
  - number: 8.1.b
    text: de specifieke kenmerken van de door hem georganiseerde kansspelen;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel8
  - number: 8.1.c
    text: de aan deelname aan de door hem georganiseerde kansspelen verbonden risico’s van kansspelverslaving;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel8
  - number: 8.1.d
    text: verantwoord speelgedrag;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel8
  - number: 8.1.e
    text: het door hem gevoerde verslavingspreventiebeleid;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel8
  - number: 8.1.f
    text: |-
      de registratie en analyse van het speelgedrag en het door hem gevoerde beleid met betrekking tot de verwerking van
      persoonsgegevens en de bescherming van de privacy van spelers;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel8
  - number: 8.1.g
    text: in Nederland beschikbare verslavingszorg en anonieme hulp;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel8
  - number: 8.1.h
    text: |-
      de mogelijkheden voor de speler om zich uit te sluiten van deelname aan de door die vergunninghouder georganiseerde
      kansspelen;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel8
  - number: 8.1.i
    text: |-
      de mogelijkheden voor de speler om zich door inschrijving in het register uit te sluiten van deelname aan
      kansspelen, georganiseerd in speelautomatenhallen, in speelcasino’s en op afstand;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel8
  - number: 8.1.j
    text: |-
      het doen van de kennisgeving, bedoeld in [artikel 27ja, vierde lid][ref1], [artikel 30v, vierde lid][ref2], en
      [artikel 31m, vierde lid, van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel27ja
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel30v
      [ref3]: https://wetten.overheid.nl/BWBR0002469#Artikel31m
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 27ja
      - id: ref2
        bwb_id: BWBR0002469
        artikel: 30v
      - id: ref3
        bwb_id: BWBR0002469
        artikel: 31m
  - number: '8.2'
    text: 'De vergunninghouder biedt tevens op duidelijke en begrijpelijke wijze toegang tot:'
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel8
  - number: 8.2.a
    text: |-
      de websites van een of meer online werkzame instellingen voor verslavingszorg, van een of meer online werkzame
      instellingen voor anonieme hulp bij kansspelverslaving, van een of meer fysiek in Nederland werkzame instellingen
      voor verslavingszorg en van een of meer fysiek in Nederland werkzame instellingen voor anonieme hulp bij
      kansspelverslaving;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel8
  - number: 8.2.b
    text: een voorziening waarmee de speler op eenvoudige wijze inzicht in zijn speelgedrag kan verkrijgen;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel8
  - number: 8.2.c
    text: |-
      een voorziening waarmee de speler zich kan uitsluiten van deelname aan de door die vergunninghouder georganiseerde
      kansspelen;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel8
  - number: 8.2.d
    text: |-
      een voorziening waarmee de speler zich door inschrijving in het register kan uitsluiten van deelname aan
      kansspelen, georganiseerd in speelautomatenhallen, in speelcasino’s en op afstand;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel8
  - number: 8.2.e
    text: de website van de kansspelautoriteit.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel8
  - number: '9.1'
    text: |-
      De houder van een vergunning tot het organiseren van kansspelen op afstand verstrekt de toegang tot de informatie,
      bedoeld in [artikel 8, eerste lid][ref1], op het voor een ieder toegankelijke deel van de kansspelinterface en
      op de spelersinterface, bedoeld in [artikel 1.1 van het Besluit kansspelen op afstand][ref2]. Hij verstrekt op
      het beginscherm van de spelersinterface tevens de datum en het tijdstip van de spelers voorlaatste aanmelding als
      bedoeld in artikel 1.1 van het Besluit kansspelen op afstand.


      [ref1]: https://wetten.overheid.nl/BWBR0033412#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0044773#Artikel1
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0033412
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0044773
        artikel: '1'
  - number: '9.2'
    text: |-
      De houder van een vergunning tot het organiseren van kansspelen op afstand biedt de toegang, bedoeld
      in [artikel 8, tweede lid][ref1], op iedere pagina of ieder scherm van de spelersinterface. Daarbij
      biedt hij tevens toegang tot een voorziening waarmee de speler zijn spelersprofiel, bedoeld in
      [artikel 1.1 van het Besluit kansspelen op afstand][ref2], kan wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0033412#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0044773#Artikel1
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0033412
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0044773
        artikel: '1'
  - number: '9.3'
    text: |-
      Onverminderd [artikel 8][ref1] maakt de houder van een vergunning tot het organiseren van kansspelen op afstand op
      de spelersinterface voor de speler voortdurend inzichtelijk:


      [ref1]: https://wetten.overheid.nl/BWBR0033412#Artikel8
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0033412
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '2'
        afdeling: '2'
  - number: 9.3.a
    text: hoe laat het in Nederland is;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel9
  - number: 9.3.b
    text: de sedert diens laatste aanmelding verstreken tijd, en
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel9
  - number: 9.3.c
    text: het saldo op diens speelrekening.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel9
  - number: '10'
    text: |-
      Bij regeling van Onze Minister worden nadere regels gesteld met betrekking tot de door de houder van een
      vergunning tot het organiseren van een speelcasino, tot het aanwezig hebben van een of meer kansspelautomaten in
      een speelautomatenhal of tot het organiseren van kansspelen op afstand in het belang van verslavingspreventie te
      verstrekken informatie en te treffen maatregelen.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel10
  - number: '11.1'
    text: |-
      Voordat de houder van een vergunning tot het organiseren van een speelcasino of tot het aanwezig hebben van een of
      meer kansspelautomaten in een speelautomatenhal een persoon toegang verleent tot dat speelcasino of die inrichting:
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel11
  - number: 11.1.a
    text: identificeert hij die persoon en verifieert hij diens identiteit, en
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel11
  - number: 11.1.b
    text: onderzoekt hij of deze persoon is ingeschreven in het register.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel11
  - number: '11.2'
    text: |-
      Verificatie als bedoeld in het eerste lid, onder a, kan in ieder geval geschieden aan de hand van een
      identiteitsbewijs als bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref1], dan wel, voor zover de
      persoon niet beschikt over een identiteitsbewijs, aan de hand van een of meer andere documenten uit betrouwbare
      bron waaruit diens identiteit blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '11.3'
    text: |-
      Het onderzoek, bedoeld in eerste lid, onder b, geschiedt aan de hand van de naam, de voornamen, de geboortedatum
      en de geboorteplaats van de betrokken persoon, alsmede, voor zover die persoon daarover beschikt, diens
      burgerservicenummer, zoals die zijn opgenomen op het identiteitsdocument van die persoon.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel11
  - number: '11.4'
    text: |-
      Het resultaat van het onderzoek kan worden gebruikt bij de vaststelling van de identiteit van degene die tot het
      speelcasino of de inrichting wil worden toegelaten.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel11
  - number: '11.5'
    text: |-
      De raad van bestuur verstrekt de vergunninghouder na raadpleging van het register een code die op unieke wijze aan
      de speler is verbonden. De vergunninghouder neemt deze code op in zijn administratie.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel11
  - number: '11.6'
    text: |-
      In afwijking van het eerste lid, onder b, kan de vergunninghouder een persoon toegang verlenen tot een speelcasino
      of inrichting als bedoeld in het eerste lid, indien het register als gevolg van een technische storing van het
      register niet kan worden geraadpleegd. In dat geval is het vijfde lid niet van toepassing en:
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel11
  - number: 11.6.a
    text: stelt de vergunninghouder de raad van bestuur onverwijld in kennis van de storing en de gevolgen daarvan;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel11
  - number: 11.6.b
    text: raadpleegt de vergunninghouder het register zo spoedig mogelijk nadat de storing is opgeheven, en
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel11
  - number: 11.6.c
    text: |-
      ontzegt de vergunninghouder de in het register ingeschreven en tijdens de storing toegelaten speler onverwijld de
      verdere toegang tot het speelcasino, onderscheidenlijk de inrichting.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel11
  - number: '11.7'
    text: |-
      De vergunninghouder verstrekt degene aan wie hij toegang tot het speelcasino of de inrichting verleent een bewijs
      van toegang.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel11
  - number: '11.8'
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld met betrekking tot het eerste, tweede, zesde en
      zevende lid.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel11
  - number: '12'
    text: |-
      De houder van een vergunning tot het organiseren van een speelcasino of tot het aanwezig hebben van een of meer
      kansspelautomaten in een speelautomatenhal kan een speler een unieke identificator toekennen ten behoeve van
      het verlenen van toegang tot dat speelcasino of die inrichting. In dat geval treft de vergunninghouder passende
      technische en organisatorische maatregelen ter voorkoming van het gebruik van de unieke identificator door anderen
      dan de speler aan wie deze is toegekend.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel12
  - number: '13.1'
    text: |-
      De houder van een vergunning tot het organiseren van een speelcasino, tot het aanwezig hebben van een of meer
      kansspelautomaten in een speelautomatenhal of tot het organiseren van kansspelen op afstand registreert ten aanzien
      van iedere deelnemer aan de door hem georganiseerde kansspelen ten minste:
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel13
  - number: 13.1.a
    text: |-
      interne en externe signalen wijzend op onmatige deelneming aan de vergunde kansspelen of risico’s op
      kansspelverslaving, en
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel13
  - number: 13.1.b
    text: |-
      hetgeen hij heeft ondernomen ter uitvoering van [artikel 18][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0033412#Artikel18
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0033412
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '5'
        afdeling: '2'
  - number: '13.2'
    text: |-
      Onverminderd het eerste lid, registreren de houder van een vergunning tot het organiseren van een speelcasino,
      tot het aanwezig hebben van een of meer kansspelautomaten in een speelautomatenhal of tot het organiseren
      van kansspelen op afstand tevens de frequentie waarmee de speler het speelcasino of de speelautomatenhal
      bezoekt, onderscheidenlijk de frequentie waarmee de speler zich aanmeldt ter verkrijging van toegang tot de
      spelersinterface, bedoeld in [artikel 1.1 van het Besluit kansspelen op afstand][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044773#Artikel1
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0044773
        artikel: '1'
  - number: '13.3'
    text: |-
      De vergunninghouders, bedoeld in het eerste en tweede lid, registreren de daar bedoelde gegevens op zodanige wijze
      dat onmatige deelname aan de door hen georganiseerde kansspelen en risico’s op kansspelverslaving vroegtijdig
      kunnen worden onderkend.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel13
  - number: '13.4'
    text: |-
      De vergunninghouders registreren de gegevens, bedoeld in het eerste en tweede lid, op zodanige wijze dat deze zijn
      terug te voeren tot de gegevens van de speler, bedoeld in [artikel 11, derde lid][ref1], of tot de aan die speler
      verbonden code, bedoeld in artikel 11, vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0033412#Artikel11
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0033412
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: '14'
    text: |-
      Onverminderd [artikel 13][ref1] registreert de houder van een vergunning tot het organiseren van kansspelen op
      afstand ten aanzien van iedere deelnemer aan de door hem georganiseerde kansspelen in ieder geval gegevens met
      betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0033412#Artikel13
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0033412
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '2'
  - number: 14.a
    text: |-
      de inschrijving, bedoeld in [artikel 1.1 van het Besluit kansspelen op afstand][ref1], en de beëindiging daarvan;


      [ref1]: https://wetten.overheid.nl/BWBR0044773#Artikel1
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0044773
        artikel: '1'
  - number: 14.b
    text: |-
      de aanmelding, bedoeld in [artikel 1.1 van het Besluit kansspelen op afstand][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0044773#Artikel1
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0044773
        artikel: '1'
  - number: 14.c
    text: de leeftijd, voor zover de speler de leeftijd van 24 jaar nog niet heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel14
  - number: 14.d
    text: de duur van de deelname aan de kansspelen;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel14
  - number: 14.e
    text: de frequentie van de deelname aan de kansspelen;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel14
  - number: 14.f
    text: de kansspelen waaraan de speler deelneemt;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel14
  - number: 14.g
    text: |-
      de grenzen van het speelgedrag, bedoeld in [artikel 4.14, eerste lid, van het Besluit kansspelen op afstand][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0044773#Artikel4
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0044773
        artikel: '4'
  - number: 14.h
    text: de aanpassing van het de grenzen van het speelgedrag;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel14
  - number: 14.i
    text: de overschrijding van de grenzen van het speelgedrag;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel14
  - number: 14.j
    text: de inzetten en speluitkomsten;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel14
  - number: 14.k
    text: de betalingstransacties met de speler;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel14
  - number: 14.l
    text: |-
      de mutaties op de speelrekening, bedoeld in [artikel 1.1 van het Besluit kansspelen op afstand][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0044773#Artikel1
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0044773
        artikel: '1'
  - number: 14.m
    text: de schorsing van de mogelijkheid tot deelname.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel14
  - number: '15'
    text: |-
      De analyse, bedoeld in de [artikelen 27ja][ref1], [30v][ref2] en [31m van de wet][ref3], is gericht op de
      vroegtijdige onderkenning van signalen die kunnen duiden op onmatige deelname aan de door de vergunninghouder
      georganiseerde kansspelen en risico’s op kansspelverslaving.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel27ja
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel30v
      [ref3]: https://wetten.overheid.nl/BWBR0002469#Artikel31m
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 27ja
      - id: ref2
        bwb_id: BWBR0002469
        artikel: 30v
      - id: ref3
        bwb_id: BWBR0002469
        artikel: 31m
  - number: '16'
    text: |-
      Bij regeling van Onze Minister worden in het belang van verslavingspreventie nadere regels gesteld met betrekking
      tot de registratie van gegevens met betrekking tot het speelgedrag van de speler en de analyse daarvan.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel16
  - number: '17.1'
    text: |-
      De houder van een vergunning tot het organiseren van kansspelen op afstand verstrekt op verzoek van een
      onderzoeksinstelling overeenkomstig door de raad van bestuur gestelde regels geanonimiseerde gegevens als bedoeld
      in [artikel 31m, vijfde lid, van de wet][ref1], ten behoeve van wetenschappelijk onderzoek naar kansspelverslaving.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel31m
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 31m
  - number: '17.2'
    text: De raad van bestuur kan voorwaarden verbinden aan de verstrekking, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel17
  - number: '18.1'
    text: |-
      Indien de analyse, bedoeld in [artikel 15][ref1], duidt op onmatige deelname aan kansspelen of risico’s
      op kansspelverslaving, treft de houder van een vergunning tot het organiseren van een speelcasino, tot
      het aanwezig hebben van een of meer kansspelautomaten in een speelautomatenhal of tot het organiseren
      van kansspelen op afstand passende interventiemaatregelen om onmatige deelname en kansspelverslaving
      zoveel mogelijk te voorkomen. De houder van een vergunning tot het organiseren van kansspelen
      op afstand treft dergelijke maatregelen in ieder geval indien de speler een grens als bedoeld in
      [artikel 4.14, tweede lid, onder a of b, van het Besluit kansspelen op afstand][ref2] overschrijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0033412#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0044773#Artikel4
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0033412
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0044773
        artikel: '4'
  - number: '18.2'
    text: |-
      Bij een redelijk vermoeden van onmatige deelname aan kansspelen of kansspelverslaving voert de vergunninghouder een
      persoonlijk onderhoud met de speler, waarin:
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel18
  - number: 18.2.a
    text: |-
      hij die speler wijst op diens speelgedrag, zo mogelijk de ontwikkeling daarvan, en op de gevaren van
      kansspelverslaving;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel18
  - number: 18.2.b
    text: |-
      hij die speler adviseert over de voorzieningen gericht op beperking van diens deelname aan kansspelen en over de
      beschikbare hulpverlening door instellingen voor verslavingszorg, en hem stimuleert hiervan gebruik te maken;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel18
  - number: 18.2.c
    text: |-
      hij onderzoekt of die speler door onmatige deelname aan kansspelen of kansspelverslaving schade kan berokkenen aan
      zichzelf of aan zijn naasten.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel18
  - number: '18.3'
    text: |-
      Bij het onderzoek, bedoeld in tweede lid, onder c, betrekt de vergunninghouder in ieder geval de gevolgen van de
      deelname aan kansspelen voor de financiële situatie van de speler, diens gezinssituatie, diens gezondheid en diens
      werksituatie.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel18
  - number: '18.4'
    text: |-
      Bij regeling van Onze Minister worden nadere regels gesteld met betrekking tot de interventie door de
      vergunninghouder in het speelgedrag van de speler. Deze regels hebben in ieder geval betrekking op de passende
      maatregelen, bedoeld in het eerste lid, en de toepassing daarvan.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel18
  - number: '19.1'
    text: |-
      Bij de kennisgeving, bedoeld in de [artikelen 27ja, vierde lid][ref1], [30v, vierde lid][ref2], en
      [31m, vierde lid][ref3], van de wet, verstrekt de houder van een vergunning tot het organiseren van een speelcasino
      tot het aanwezig hebben van een of meer kansspelautomaten in een speelautomatenhal of tot het organiseren van
      kansspelen op afstand overeenkomstig door de raad van bestuur gestelde regels in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel27ja
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel30v
      [ref3]: https://wetten.overheid.nl/BWBR0002469#Artikel31m
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 27ja
      - id: ref2
        bwb_id: BWBR0002469
        artikel: 30v
      - id: ref3
        bwb_id: BWBR0002469
        artikel: 31m
  - number: 19.1.a
    text: |-
      de door de raad van bestuur verstrekte code, bedoeld in [artikel 11, vijfde lid][ref1], dan wel, indien de
      vergunninghouder daarover niet beschikt, de gegevens van die speler, bedoeld in artikel 11, derde lid;


      [ref1]: https://wetten.overheid.nl/BWBR0033412#Artikel11
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0033412
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: 19.1.b
    text: de contactgegevens van de betrokken speler;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel19
  - number: 19.1.c
    text: |-
      de gegevens, bedoeld in de [artikelen 13][ref1], [14][ref2] en [15][ref3], en, voor zover aanwezig, de overige
      gegevens die ten grondslag liggen aan zijn redelijke vermoeden dat de speler door onmatige deelname aan kansspelen
      of door kansspelverslaving schade kan berokkenen aan zichzelf of zijn naasten;


      [ref1]: https://wetten.overheid.nl/BWBR0033412#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0033412#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0033412#Artikel15
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0033412
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0033412
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0033412
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '4'
        afdeling: '2'
  - number: 19.1.d
    text: |-
      overige gegevens die de raad van bestuur redelijkerwijs nodig heeft voor de toepassing van
      [artikel 33da van de wet][ref1], voor zover de vergunninghouder daarover redelijkerwijs kan beschikken.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33da
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33da
  - number: '19.2'
    text: |-
      De vergunninghouder maakt de kennisgeving, bedoeld in het eerste lid, en de daarbij aan de raad van
      bestuur verstrekte gegevens, met uitzondering van de door de raad van bestuur verstrekte code, bedoeld in
      [artikel 11, vijfde lid][ref1], bekend aan de betrokken speler.


      [ref1]: https://wetten.overheid.nl/BWBR0033412#Artikel11
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0033412
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '3'
        afdeling: '2'
  - number: '19.3'
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld met betrekking tot het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel19
  - number: '20.1'
    text: |-
      De houder van een vergunning tot het organiseren van een speelcasino gebruikt het burgerservicenummer uitsluitend
      voor de raadpleging van het register en de vaststelling van de identiteit van de speler.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel20
  - number: '20.2'
    text: |-
      De houder van een vergunning tot het aanwezig hebben van een of meer kansspelautomaten in een speelautomatenhal
      gebruikt het burgerservicenummer uitsluitend voor de raadpleging van het register en de vaststelling van de
      identiteit van de speler.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel20
  - number: '20.3'
    text: |-
      De houder van een vergunning tot het organiseren van kansspelen op afstand gebruikt het burgerservicenummer
      uitsluitend voor de raadpleging van het register en de vaststelling van de identiteit van de speler bij de
      inschrijving, bedoeld in [artikel 4.11 van het Besluit kansspelen op afstand][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044773#Artikel4
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0044773
        artikel: '4'
  - number: '20.4'
    text: |-
      Tenzij uit enig wettelijk voorschrift anders voortvloeit, vernietigt de houder van een vergunning tot het
      organiseren van een speelcasino, tot het aanwezig hebben van een of meer kansspelautomaten in een speelautomatenhal
      of tot het organiseren van kansspelen op afstand het burgerservicenummer onverwijld na het gebruik daarvan.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel20
  - number: '20.5'
    text: |-
      De houder van een vergunning tot het organiseren van een speelcasino of tot het aanwezig hebben van een of
      meer kansspelautomaten in een speelautomatenhal draagt er voor zorg dat ter beveiliging van de persoonsgegevens
      die worden verwerkt ter uitvoering van het verslavingspreventiebeleid, bedoeld in [artikel 7][ref1], in zijn
      organisatie wordt ontwikkeld, toegepast en onderhouden een informatiebeveiligingssysteem dat voldoet aan de bij
      regeling van Onze Minister gestelde vereisten. Hij rapporteert de raad van bestuur overeenkomstig door de raad van
      bestuur gestelde regels over dat informatiebeveiligingssysteem en de werking daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0033412#Artikel7
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0033412
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
        afdeling: '2'
  - number: '20.6'
    text: |-
      De houder van een vergunning tot het organiseren van een speelcasino tot het aanwezig hebben van een of meer
      kansspelautomaten in een speelautomatenhal of tot het organiseren van kansspelen op afstand beschikt over een
      privacyreglement waarin de gevolgen voor de gegevensbescherming op gestructureerde en transparante wijze in kaart
      zijn gebracht en waarin in ieder geval regels zijn gesteld met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel20
  - number: 20.6.a
    text: de soort persoonsgegevens die worden verwerkt;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel20
  - number: 20.6.b
    text: de soort verwerkingen van persoonsgegevens;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel20
  - number: 20.6.c
    text: het doel van de verwerkingen van persoonsgegevens;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel20
  - number: 20.6.d
    text: de koppeling van persoonsgegevens en profilering;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel20
  - number: 20.6.e
    text: de instanties die betrokken zijn bij de verwerking van persoonsgegevens;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel20
  - number: 20.6.f
    text: de systemen die gebruikt worden bij de verwerking van persoonsgegevens;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel20
  - number: 20.6.g
    text: de bewaring en vernietiging van de persoonsgegevens;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel20
  - number: 20.6.h
    text: de rechten van degene wiens persoonsgegevens worden verwerkt.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel20
  - number: '20.7'
    text: De vergunninghouder handelt overeenkomstig het reglement, bedoeld in het zesde lid.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel20
  - number: '20.8'
    text: Bij regeling van Onze Minister kunnen nadere regels worden gesteld met betrekking tot de voorgaande leden.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel20
  - number: '20.9'
    text: De vergunninghouder is verwerkingsverantwoordelijke.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel20
  - number: '21.1'
    text: |-
      De in [artikel 33h, derde lid, aanhef en onder a, van de wet][ref1] bedoelde gegevens zijn het burgerservicenummer
      van de ingeschrevene, dan wel, indien de ingeschrevene niet beschikt over een burgerservicenummer of het
      burgerservicenummer niet bekend is, diens naam, voornamen, geboortedatum en geboorteplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33h
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33h
  - number: '21.2'
    text: |-
      Indien de ingeschrevene niet beschikt over een burgerservicenummer of diens burgerservicenummer onbekend is, kunnen
      naast diens naam, voornamen, geboortedatum en geboorteplaats, andere bij regeling van Onze Minister vast te stellen
      gegevens worden opgenomen, voor zover dit noodzakelijk is voor de identificatie van de ingeschrevene.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel21
  - number: '21.3'
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld met betrekking tot de gegevens die krachtens
      [artikel 33h, derde lid, van de wet][ref1] in het register worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel33h
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 33h
  - number: '22.1'
    text: |-
      Aan de houder van een vergunning tot het organiseren van een speelcasino, tot het aanwezig hebben van een of
      meer kansspelautomaten in een speelautomatenhal, of tot het organiseren van kansspelen op afstand worden slechts
      gegevens verstrekt waaruit blijkt of een persoon in het register is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel22
  - number: '22.2'
    text: De gegevens, bedoeld in het eerste lid, worden rechtstreeks langs geautomatiseerde weg verstrekt.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel22
  - number: '22.3'
    text: |-
      De vergunninghouder treft passende maatregelen die waarborgen dat de gegevens, bedoeld in het eerste lid, slechts
      kunnen worden geraadpleegd door door hem geautoriseerde personen. De vergunninghouder verleent autorisatie slechts
      aan personen, die:
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel22
  - number: 22.3.a
    text: |-
      die gegevens nodig hebben voor de toelating van personen tot speelcasino’s, tot speelautomatenhallen en tot
      deelname aan kansspelen op afstand;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel22
  - number: 22.3.b
    text: |-
      in het bezit zijn van een verklaring omtrent het gedrag op grond van de
      [Wet justitiële en strafvorderlijke gegevens][ref1] of een vergelijkbaar document;


      [ref1]: https://wetten.overheid.nl/BWBR0014194
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0014194
  - number: 22.3.c
    text: |-
      zich hebben verplicht het burgerservicenummer en andere persoonsgegevens waarvan hij kennis kan nemen, geheim
      te houden, welke geheimhoudingsplicht ook van kracht blijft indien de betrokkene niet langer met de opgedragen
      werkzaamheden is belast, en
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel22
  - number: 22.3.d
    text: op de hoogte zijn gesteld van de relevante op de vergunninghouder rustende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel22
  - number: '22.4'
    text: |-
      De vergunninghouder treft passende maatregelen met betrekking tot het toezicht op de naleving van de op hem
      rustende verplichtingen door de door hem geautoriseerde personen.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel22
  - number: '22.5'
    text: |-
      Van een verstrekking als bedoeld in het eerste lid, die er toe strekt dat een persoon in het register
      is ingeschreven, wordt een aantekening gemaakt met betrekking tot de datum en het tijdstip waarop en de
      vergunninghouder aan wie de gegevens zijn verstrekt. Deze aantekening wordt bewaard voor de duur van de
      inschrijving van de betrokken persoon.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel22
  - number: '22.6'
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld met betrekking tot verstrekking van gegevens
      aan de vergunninghouder. Daarbij kunnen technische en operationele eisen worden gesteld met betrekking tot de
      elektronische middelen waarmee het register wordt bevraagd en de bevraging van het register.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel22
  - number: '23'
    text: |-
      Gegevens in het register worden namens de raad van bestuur slechts verwerkt door personen, voor zover die
      verwerking voor de uitvoering van de hen opgedragen taken noodzakelijk is en zij daartoe door de raad van bestuur
      zijn gemachtigd.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel23
  - number: '24.1'
    text: |-
      De raad van bestuur treft passende technische en organisatorische maatregelen ter beveiliging van de in het
      register opgenomen gegevens tegen verlies of aantasting van deze gegevens en tegen onbevoegde kennisneming,
      wijziging of verstrekking van deze gegevens.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel24
  - number: '24.2'
    text: 'De maatregelen, bedoeld in het eerste lid, omvatten ten minste:'
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel24
  - number: 24.2.a
    text: maatregelen gericht op de toegang tot gebouwen en ruimten waar in het register opgenomen gegevens aanwezig zijn;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel24
  - number: 24.2.b
    text: maatregelen gericht op een deugdelijke werking en beveiliging van de apparatuur en programmatuur;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel24
  - number: 24.2.c
    text: maatregelen voor het geval de geheimhouding of integriteit van in het register opgenomen gegevens is geschaad;
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel24
  - number: 24.2.d
    text: maatregelen bij calamiteiten, en
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel24
  - number: 24.2.e
    text: maatregelen gericht op de tijdige en deugdelijke vernietiging van persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel24
  - number: '24.3'
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld met betrekking tot de maatregelen, bedoeld in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel24
  - number: '25.1'
    text: |-
      De raad van bestuur verricht periodiek een onderzoek naar de inrichting, de werking en de beveiliging van
      het register en naar de verwerking van gegevens in het register voor zover hij verantwoordelijk is voor die
      gegevensverwerking.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel25
  - number: '25.2'
    text: |-
      Bij regeling van Onze Minister worden nadere regels gesteld met betrekking tot de periodiciteit en de uitvoering
      van het onderzoek, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel25
  - number: '26'
    text: |-
      Dit besluit berust mede op de [artikelen 27j][ref1], [27ja][ref2], [30u][ref3], [30v][ref4], [31m][ref5],
      [33da][ref6] en [33h van de wet][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0002469#Artikel27j
      [ref2]: https://wetten.overheid.nl/BWBR0002469#Artikel27ja
      [ref3]: https://wetten.overheid.nl/BWBR0002469#Artikel30u
      [ref4]: https://wetten.overheid.nl/BWBR0002469#Artikel30v
      [ref5]: https://wetten.overheid.nl/BWBR0002469#Artikel31m
      [ref6]: https://wetten.overheid.nl/BWBR0002469#Artikel33da
      [ref7]: https://wetten.overheid.nl/BWBR0002469#Artikel33h
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002469
        artikel: 27j
      - id: ref2
        bwb_id: BWBR0002469
        artikel: 27ja
      - id: ref3
        bwb_id: BWBR0002469
        artikel: 30u
      - id: ref4
        bwb_id: BWBR0002469
        artikel: 30v
      - id: ref5
        bwb_id: BWBR0002469
        artikel: 31m
      - id: ref6
        bwb_id: BWBR0002469
        artikel: 33da
      - id: ref7
        bwb_id: BWBR0002469
        artikel: 33h
  - number: '27'
    text: |-
      Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende
      artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel27
  - number: '28'
    text: 'Dit besluit wordt aangehaald als: Besluit werving, reclame en verslavingspreventie kansspelen.'
    url: https://wetten.overheid.nl/BWBR0033412/2026-01-01#Artikel28
