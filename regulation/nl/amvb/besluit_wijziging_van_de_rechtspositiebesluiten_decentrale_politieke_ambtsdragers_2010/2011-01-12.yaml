preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties van 11 november 2010, 2010-
    0000708842, CZW/WVOB;


    Gelet op de artikelen 44, eerste, tweede en achtste lid, 66, eerste, tweede en zevende lid, 73, 95, vierde lid, en
    96, derde lid, van de Gemeentewet, de artikelen 43, eerste, tweede en negende lid, 65, eerste, tweede en achtste
    lid, 72, 93, vierde lid, en 94, derde lid, van de Provinciewet en de artikelen 32a, eerste lid, 44, eerste en
    achtste lid, 48, zevende lid, 49, eerste lid, van de Waterschapswet en artikel 193, eerste, tweede en achtste lid,
    van de Wet openbare lichamen Bonaire, Sint Eustatius en Saba;


    De Raad van State gehoord (advies van 3 december 2010, nr. W04.10.0516/I);


    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties van 23 december 2010, nr.
    2010-0000770789;


    Hebben goedgevonden en verstaan:
