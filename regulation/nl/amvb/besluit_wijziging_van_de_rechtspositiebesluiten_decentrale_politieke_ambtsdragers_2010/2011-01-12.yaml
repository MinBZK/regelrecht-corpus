    text: |-
      1 [Artikel I, onderdelen A, onder 2, B, D, E, F en R][ref1], [artikel II, onderdelen A, D, N, O, P en U][ref2],
      [artikel III][ref3], [artikel IV][ref4], [artikel V, onderdelen A, B, C, D, E, onder 1 en 2, en F][ref5],
      [artikel VI, onderdelen A, B, C, D, E, F, H en I][ref6], [artikel VII, onderdelen A, B, C, E, F, M en N][ref7],
      en [artikel VIII][ref8] treden in werking met ingang van 1 januari 2011. Indien het Staatsblad waarin dit besluit
      wordt geplaatst, wordt uitgegeven na 1 januari 2011, treden de in de vorige zin genoemde artikelonderdelen in
      werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin dit besluit wordt geplaatst, en
      werken terug tot en met 1 januari 2011.

      2 [Artikel I, onderdelen A, onder 1 en 3, G, H, I, J, K, L, M, O, P en S][ref9],
      [artikel II, onderdelen B, C, E, G, H, I, J, K, L, Q, S, V en W][ref10], [artikel V, onderdeel E, onder 3][ref11],
      [artikel VI, onderdeel G][ref12], [artikel VII, onderdelen D, G, H, I, L en O][ref13], en [artikel IX][ref14]
      treden in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin zij worden geplaatst.

      3 [Artikel I, onderdelen N en Q][ref15], [artikel II, onderdelen F, R en T][ref16], en
      [artikel VII, onderdeel K][ref17], treden in werking met ingang van de dag na de datum van uitgifte van het
      Staatsblad waarin zij worden geplaatst en werken terug tot en met 27 februari 2010.

      4 [Artikel I, onderdeel C][ref18], [artikel II, onderdeel M][ref19], en [artikel VII, onderdeel J][ref20], treden
      in werking met ingang van 1 januari 2015.


