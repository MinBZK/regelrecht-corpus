preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onzen Minister van Waterstaat van 30 October 1925, n°. 315, Afdeeling Waterstaat T.;

    Gelet op artikel 3 der Zuiderzeesteunwet 1925 (Staatsblad n°. 290);

    Den Raad van State gehoord (advies van 24 November 1925, n°. 25);

    Gezien het nader rapport van Onzen voornoemden Minister van 14 December 1925, n°. 311, Afdeeling Waterstaat T.;

    Hebben goedgevonden en verstaan: Met ingang van het tijdstip, waarop artikel 3 der Zuiderzeesteunwet 1925
    (Staatsblad n°. 290) zal in werking treden, in te stellen de in dat artikel bedoelde Generale Commissie, en voor
    die Commissie de volgende bepalingen vast te stellen alsmede bepalingen vast te stellen voor de in artikel I van de
    wet van 27 Maart 1931 (Staatsblad n°. 129) bedoelde plaatselijke commissiën:
  url: https://wetten.overheid.nl/BWBR0001929/1939-01-09#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 De Generale Commissie bestaat uit ten hoogste 15 leden, die door Ons worden benoemd en ontslagen.

      2 Uit de leden worden door Ons een Voorzitter en een Ondervoorzitter aangewezen.

      3 De Generale Commissie wordt bijgestaan door een secretaris.
    url: https://wetten.overheid.nl/BWBR0001929/1939-01-09#Artikel1
  - number: '2'
    text: |-
      1 De leden der Generale Commissie hebben zitting gedurende 4 jaren.

      2 De afgetreden leden zijn terstond weder benoembaar.
    url: https://wetten.overheid.nl/BWBR0001929/1939-01-09#Artikel2
  - number: '3'
    text: |-
      1 De secretaris wordt door Ons benoemd en ontslagen. Hij geniet een bezoldiging, welke door Ons wordt vastgesteld.

      2 De betrekking van secretaris van de Generale Commissie is niet vereenigbaar met die van dienstdoend ambtenaar van
      den Rijksdienst ter uitvoering van de [Zuiderzeesteunwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001925
    url: https://wetten.overheid.nl/BWBR0001929/1939-01-09#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001925
  - number: '4'
    text: |-
      1 Desgevraagd dient de Generale Commissie Onzen Minister van Waterstaat van advies met betrekking tot de
      ingevolge de [Zuiderzeesteunwet 1925][ref1] (*Staatsblad* n°. 290) te nemen maatregelen ter tegemoetkoming aan
      de Zuiderzeevisschersbevolking en andere personen, wegens de schade, welke de afsluiting der Zuiderzee hun mocht
      berokkenen, en verleent zij bijstand in de uitvoering daarvan.

      2 Zij vestigt harerzijds de aandacht op hetgeen strekken kan tot bevordering van de voorbereiding en uitvoering van
      zoodanige maatregelen.

      3 Omtrent den door de Generale Commissie te verleenen bijstand in de uitvoering van maatregelen, als hiervoor
      bedoeld, worden door Onzen Minister van Waterstaat de vereischte instructies vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001925
    url: https://wetten.overheid.nl/BWBR0001929/1939-01-09#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001925
  - number: '5'
    text: |-
      1 De Generale Commissie vergadert zoo dikwijls de Voorzitter dit noodig acht of het door ten minste drie leden met
      opgave van redenen wordt gevraagd. In het laatste geval moet de vergadering gehouden worden uiterlijk binnen 14
      dagen, nadat het verzoek ter kennis van den Voorzitter is gekomen.

      2 De vergaderingen worden gehouden ter plaatse, door den Voorzitter voor elke vergadering aan te wijzen.
    url: https://wetten.overheid.nl/BWBR0001929/1939-01-09#Artikel5
  - number: '6'
    text: |-
      De Generale Commissie kan geen besluiten nemen, indien niet meer dan de helft van hare leden aanwezig is. Alle
      besluiten worden bij meerderheid van stemmen van de aanwezige leden genomen. Bij staking der stemmen beslist,
      indien mondeling gestemd wordt, de stem van den Voorzitter, en, indien schriftelijk gestemd wordt, het lot.
    url: https://wetten.overheid.nl/BWBR0001929/1939-01-09#Artikel6
  - number: '7'
    text: |-
      De Generale Commissie stelt een reglement van orde vast. Dit reglement en de daarin aan te brengen wijzigingen
      treden niet in werking, dan nadat daarop de goedkeuring van Onzen Minister van Waterstaat is verkregen.
    url: https://wetten.overheid.nl/BWBR0001929/1939-01-09#Artikel7
  - number: '8'
    text: |-
      1 Met inachtneming van het bepaalde in het derde lid van dit artikel is de Generale Commissie, alsmede haar
      Voorzitter, bevoegd de voorbereiding van de uitvoering van aangelegenheden, waaromtrent zij van advies en bijstand
      heeft te dienen, op te dragen aan subcommissies uit haar midden, waarvan de leden door den Voorzitter worden
      aangewezen, tenzij de Generale Commissie de aanwijzing aan zich wenscht te houden.

      2 Als Voorzitter van eene subcommissie treedt de Voorzitter der Generale Commissie op, dan wel de Ondervoorzitter.

      3 De behandeling van bezwaarschriften wordt opgedragen aan een subcommissie, welker leden door de Generale
      Commissie worden aangewezen. De leden van de Generale Commissie, die geen lid zijn van deze subcommissie, zijn
      bevoegd hare vergaderingen bij te wonen; zij worden geacht alsdan lid der subcommissie te zijn.

      4 De subcommissie voor de bezwaarschriften brengt zelfstandig en rechtstreeks advies uit aan Onzen Minister van
      Waterstaat omtrent de in hare handen gestelde bezwaarschriften, tenzij zij aanleiding mocht vinden om eenig advies
      door de Generale Commissie te doen vaststellen.

      5 De subcommissie voor de bezwaarschriften stelt haar advies in eenige zaak niet vast dan nadat zij den betrokkene
      in de gelegenheid heeft gesteld om door haar te worden gehoord. Indien de betrokkene woont in een gemeente, waarin
      een plaatselijke commissie is ingesteld of welke gelegen is in het gebied, waarover een plaatselijke commissie zich
      mede uitstrekt, roept de subcommissie mede op den voorzitter van de betrokken plaatselijke commissie, tenzij zij
      daartoe geen voldoende aanleiding mocht vinden. De voorzitter van de plaatselijke commissie kan zich door een lid
      dier commissie doen vervangen.
    url: https://wetten.overheid.nl/BWBR0001929/1939-01-09#Artikel8
  - number: '9'
    text: Alle stukken, welke van de Generale Commissie uitgaan, worden door den Voorzitter en den Secretaris onderteekend.
    url: https://wetten.overheid.nl/BWBR0001929/1939-01-09#Artikel9
  - number: '10'
    text: |-
      De Secretaris is de Generale Commissie, den Voorzitter, de subcommissies en de leden in alles wat de hun opgedragen
      taak betreft, behulpzaam.

      Hij is belast met de zorg voor het archief der Generale Commissie.

      De Generale Commissie regelt zijne vervanging bij afwezigheid of ontstentenis en stelt zijne instructie vast. Deze
      instructie behoeft de goedkeuring van den Minister van Waterstaat.
    url: https://wetten.overheid.nl/BWBR0001929/1939-01-09#Artikel10
  - number: '11'
    text: |-
      De Generale Commissie is bevoegd zich met alle openbare besturen, colleges, autoriteiten of andere personen
      rechtstreeks in verbinding te stellen.

      Zij, alsmede haar Voorzitter en de door haar of door haren Voorzitter ingestelde subcommissies zijn bevoegd
      ambtenaren, deskundigen of andere personen, op wier voorlichting prijs wordt gesteld, tot het geven daarvan uit
      te noodigen.

      Overleg met Hoofden van Departementen van Algemeen bestuur geschiedt door tusschenkomst van Onzen Minister van
      Waterstaat.
    url: https://wetten.overheid.nl/BWBR0001929/1939-01-09#Artikel11
  - number: '12'
    text: |-
      De Generale Commissie, benevens de uit haar midden gevormde subcommissies kunnen van den directeur van den
      Rijksdienst ter uitvoering van de [Zuiderzeesteunwet][ref1], ingesteld bij Koninklijk besluit van 7 Januari 1932
      (*Staatsblad* n°. 4), schriftelijk of mondeling de gegevens verlangen, welke zij noodig hebben voor de uitvoering
      van haar taak.


      [ref1]: https://wetten.overheid.nl/BWBR0001925
    url: https://wetten.overheid.nl/BWBR0001929/1939-01-09#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0001925
  - number: '13'
    text: |-
      De Generale Commissie brengt jaarlijks voor 1 Juli aan Onzen Minister van Waterstaat een beknopt verslag uit
      omtrent de hoofdzaken harer verrichtingen in het afgeloopen kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0001929/1939-01-09#Artikel13
  - number: '14'
    text: |-
      Door Onzen Minister kunnen in de gemeenten *Amsterdam, Bunschoten, Edam, Elburg, Enkhuizen, Harderwijk, Harlingen,
      Den Helder, Hoorn, Huizen, Kampen, Lemsterland, Marken, Medemblik, Monnikendam, Stad Vollenhove, Stavoren, Texel,
      Urk* en *Wieringen*, den Burgemeester gehoord, plaatselijke commissiën worden ingesteld.

      Door Onzen Minister kan worden bepaald, dat het gebied van een plaatselijke commissie zich mede uitstrekt over een
      of meer naburige gemeenten.
    url: https://wetten.overheid.nl/BWBR0001929/1939-01-09#Artikel14
  - number: '15'
    text: |-
      1 Een plaatselijke commissie bestaat uit vijf leden, die door Onzen Minister worden benoemd en ontslagen.
      Voor de benoeming van drie dezer leden wordt het advies ingewonnen van plaatselijke organisaties van personen,
      werkzaam in de Zuiderzeevisscherij of in op de Zuiderzeevisscherij gegronde bedrijven, welke organisaties door
      Onzen Minister tot dit doel worden aangewezen, de Generale Commissie gehoord. Deze drie personen moeten zijn
      ingezetenen van de gemeente, waarin de plaatselijke commissie gevestigd is of in het geval, bedoeld in het
      [tweede lid van artikel 14][ref1], ingezetenen dier naburige gemeenten.

      2 Uit de leden worden door Onzen Minister een Voorzitter en een Secretaris aangewezen.

      3 De Secretaris geniet een door Onzen Minister, met medewerking van Onzen Minister van Financiën, vast te stellen
      vergoeding voor de verrichte werkzaamheden.

      4 De leden der plaatselijke commissiën hebben zitting gedurende 2 jaar.

      5 De afgetreden leden zijn terstond weder benoembaar.


      [ref1]: https://wetten.overheid.nl/BWBR0001929#Artikel14
    url: https://wetten.overheid.nl/BWBR0001929/1939-01-09#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0001929
        artikel: '14'
  - number: '16'
    text: |-
      1 Desgevraagd dient een plaatselijke commissie de Generale Commissie van advies met betrekking tot de ingevolge de
      [Zuiderzeesteunwet 1925][ref1] (*Staatsblad* n°. 290) te nemen maatregelen.

      2 Zij vestigt harerzijds de aandacht van de Generale Commissie op hetgeen strekken kan tot bevordering van de voor
      bereiding en uitvoering van zoodanige maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0001925
    url: https://wetten.overheid.nl/BWBR0001929/1939-01-09#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001925
  - number: '17'
    text: |-
      1 De plaatselijke commissiën vergaderen zoo dikwijls de Voorzitter dit noodig acht of het door ten minste 3 leden
      met opgave van redenen wordt verlangd.

      2 De vergaderingen worden gehouden ter plaatse, waar de commissie gevestigd is.

      3 Alle besluiten worden bij meerderheid van stemmen genomen.

      4 Alle stukken, welke van of namens de plaatselijke commissie uitgaan, worden door den voorzitter en den secretaris
      onderteekend.

      5 Door Onzen Minister wordt voor eene plaatselijke commissie een ambtenaar van den Rijksdienst, bedoeld in
      [artikel 12][ref1], aangewezen, die in hare vergaderingen de inlichtingen verstrekt, welke zij behoeft voor de
      uitoefening van haar taak. Deze ambtenaar wordt tijdig uitgenoodigd voor de bijwoning van iedere vergadering,
      waarin de voorzitter zijne aanwezigheid gewenscht acht.


      [ref1]: https://wetten.overheid.nl/BWBR0001929#Artikel12
    url: https://wetten.overheid.nl/BWBR0001929/1939-01-09#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001929
        artikel: '12'
  - number: '18'
    text: |-
      De leden en de secretaris van de Generale Commissie ontvangen vergoeding voor reis- en verblijfkosten. De leden
      hebben, met inachtneming van het Koninklijk besluit van 29 December 1921 (*Staatsblad* n°. 1452), aanspraak op een
      door Onzen Minister van Waterstaat, met medewerking van Onzen Minister van Financiën, vast te stellen vergoeding
      voor tijdverzuim voor elken dag, waarop zij eene vergadering van de Generale Commissie of van een sub-commissie
      hebben bijgewoond.

      Het in het eerste lid bepaalde vindt overeenkomstige toepassing ten aanzien van de in [artikel 11][ref1] bedoelde
      personen.


      [ref1]: https://wetten.overheid.nl/BWBR0001929#Artikel11
    url: https://wetten.overheid.nl/BWBR0001929/1939-01-09#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001929
        artikel: '11'
  - number: 18a
    text: |-
      De leden der plaatselijke commissiën ontvangen vergoeding voor reis- en verblijfkosten, alsmede een door Onzen
      Minister van Waterstaat, met medewerking van Onzen Minister van Financiën, vast te stellen presentiegeld voor elke
      vergadering der plaatselijke comissiën, welke zij hebben bijgewoond.

      Indien op denzelfden dag meer dan één vergadering plaats heeft, wordt slechts éénmaal presentiegeld ontvangen.

      De secretarissen - lid der commissie zijnde - die reeds een vaste vergoeding genieten, ontvangen geen
      presentiegeld.
    url: https://wetten.overheid.nl/BWBR0001929/1939-01-09#Artikel18a
  - number: '19'
    text: |-
      De leden en de secretaris van de Generale Commissie, alsmede de leden der plaatselijke commissiën, zijn verplicht
      tot geheimhouding van al hetgeen zij in hun hoedanigheid vernemen, voor zooverre mededeeling daarvan niet bij of
      krachtens de wet is voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0001929/1939-01-09#Artikel19
