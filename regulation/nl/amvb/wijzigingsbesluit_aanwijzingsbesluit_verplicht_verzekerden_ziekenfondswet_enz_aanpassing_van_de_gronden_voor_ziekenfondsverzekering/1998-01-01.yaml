preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Volksgezondheid, Welzijn en Sport van 12 november 1997, VPZ/V-97.4100,
    gedaan in overeenstemming met de Staatssecretaris van Sociale Zaken en Werkgelegenheid;


    Gelet op de artikelen 3, eerste lid, onder d, en negende lid, 5, tweede en vierde lid, 8, tweede lid, 15, 17,
    eerste en zevende lid, 18, eerste lid, en 19, eerste en tweede lid, van de Ziekenfondswet;


    De Raad van State gehoord (advies van 11 december 1997, nummer W13.97.0727);


    Gezien het nader rapport van Onze Minister van Volksgezondheid, Welzijn en Sport van 12 december 1997, VPZ/V-
    97.4553, gedaan in overeenstemming met de Staatssecretaris van Sociale Zaken en Werkgelegenheid;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0009172/1998-01-01#ArtikelAanhef
articles:
  - number: IX
    text: |-
      Degenen die op de datum van inwerkingtreding van dit besluit verzekerd waren op grond van
      [artikel 15b van het Aanwijzingsbesluit verzekerden Zfw][ref1] zoals dat artikel luidde onmiddellijk
      voor de datum van inwerkingtreding van dit besluit, worden geacht te hebben voldaan aan de in
      [artikel 3, eerste lid, onder c, en zevende lid, van de Ziekenfondswet][ref2] genoemde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0002516#Artikel15b
