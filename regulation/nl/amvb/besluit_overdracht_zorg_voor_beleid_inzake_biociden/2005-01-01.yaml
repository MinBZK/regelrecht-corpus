preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister-President, Minister van Algemene Zaken, d.d. 9 december 2004, nr. 04M470416;


    Gelet op artikel 44, eerste lid, van de Grondwet;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0017702/2005-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Behoudens de zorg voor het beleid voortvloeiende uit [artikel 3, eerste lid, aanhef en onder c][ref1], en
      [artikel 3a, tweede lid, aanhef en onder b, van de Bestrijdingsmiddelenwet 1962][ref2], gaat de zorg voor het
      beleid dat op grond van [die wet][ref3] door Onze Minister van Volksgezondheid, Welzijn en Sport in overeenstemming
      met Onze Minister van Landbouw, Natuur en Voedselkwaliteit, Onze Minister van Volkshuisvesting, Ruimtelijke
      Ordening en Milieubeheer en Onze Minister van Sociale Zaken en Werkgelegenheid wordt uitgevoerd, over naar Onze
      Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer.

      2 Het beleid, bedoeld in het eerste lid, wordt uitgevoerd in overeenstemming met Onze Minister van Landbouw,
      Natuur en Voedselkwaliteit, Onze Minister van Volksgezondheid, Welzijn en Sport en Onze Minister van Sociale Zaken
      en Werkgelegenheid.


