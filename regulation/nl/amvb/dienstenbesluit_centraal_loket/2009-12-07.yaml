---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: dienstenbesluit_centraal_loket
regulatory_layer: AMVB
publication_date: '2009-12-04'
valid_from: '2009-12-07'
bwb_id: BWBR0026761
url: https://wetten.overheid.nl/BWBR0026761/2009-12-07
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Economische Zaken van 15 mei 2009, nr. WJZ / 9082391;

    Gelet op de artikelen 6, 8 en 21 van richtlijn nr. 2006/123/EG van het Europees Parlement en de Raad van de
    Europese Unie van 12 december 2006 betreffende de diensten op de interne markt (PbEU L 376), en artikel 5, derde
    lid, van de Dienstenwet;

    De Raad van State gehoord (advies van 3 juni 2009, nr. W10.09.0158/III);

    Gezien het nader rapport van Onze Minister van Economische Zaken van 23 november 2009, nr. WJZ / 9207240;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0026761/2009-12-07#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder: - *bijstandsbericht:* een informatieverzoek als bedoeld in
      [artikel 23 van de Dienstenwet][ref1] of een bericht dat tot afhandeling daarvan dient;
        - *procedurebericht:* een bericht dat op procedures en formaliteiten betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel23
    url: https://wetten.overheid.nl/BWBR0026761/2009-12-07#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '23'
  - number: '2'
    text: 'Het centraal loket is zodanig ingericht dat:'
    url: https://wetten.overheid.nl/BWBR0026761/2009-12-07#Artikel2
  - number: 2.a
    text: |-
      een bevoegde instantie of een dienstverrichter kan beschikken over een aansluiting op dat loket met behulp waarvan
      procedureberichten via dat loket verzonden en ontvangen kunnen worden;
    url: https://wetten.overheid.nl/BWBR0026761/2009-12-07#Artikel2
  - number: 2.b
    text: |-
      een bevoegde instantie of een dienstverrichter via het centraal loket ook een procedurebericht kan verzenden of
      ontvangen, indien door die bevoegde instantie of dienstverrichter daaraan een functionaliteit is verbonden die de
      betrouwbaarheid of vertrouwelijkheid van dat bericht vergroot;
    url: https://wetten.overheid.nl/BWBR0026761/2009-12-07#Artikel2
  - number: 2.c
    text: |-
      de ononderbroken werking van het centraal loket zo goed mogelijk wordt gewaarborgd, ook tijdens werkzaamheden
      betreffende onderhoud, vervanging of uitbreiding van voorzieningen die van het centraal loket deel uitmaken;
    url: https://wetten.overheid.nl/BWBR0026761/2009-12-07#Artikel2
  - number: 2.d
    text: |-
      de kans op onvoorziene storingen in de werking van het centraal loket zo klein mogelijk is en de gevolgen daarvan
      zo spoedig mogelijk ongedaan worden gemaakt;
    url: https://wetten.overheid.nl/BWBR0026761/2009-12-07#Artikel2
  - number: 2.e
    text: |-
      indien op grond van [artikel 13, tweede lid, van de Dienstenwet][ref1], bij ministeriële regeling regels worden
      gesteld inzake vernietigingstermijnen van via het centraal loket verzonden berichten, die binnen dit loket
      aanwezige berichten na het verstrijken van de daarop toepasselijke termijnen onverwijld worden vernietigd;


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel13
    url: https://wetten.overheid.nl/BWBR0026761/2009-12-07#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '13'
  - number: 2.f
    text: doorzending van berichten tussen bevoegde instanties via dat loket mogelijk is.
    url: https://wetten.overheid.nl/BWBR0026761/2009-12-07#Artikel2
  - number: '3'
    text: |-
      Het centraal loket is zodanig ingericht dat de aansluiting van een dienstverrichter op dat loket een uitsluitend
      voor hem toegankelijke elektronische omgeving biedt waar in ieder geval:
    url: https://wetten.overheid.nl/BWBR0026761/2009-12-07#Artikel3
  - number: 3.a
    text: ieder via het centraal loket verzonden en aan hem geadresseerd procedurebericht wordt ontvangen;
    url: https://wetten.overheid.nl/BWBR0026761/2009-12-07#Artikel3
  - number: 3.b
    text: een afschrift aanwezig is van elk door de dienstverrichter via het centraal loket verzonden procedurebericht;
    url: https://wetten.overheid.nl/BWBR0026761/2009-12-07#Artikel3
  - number: 3.c
    text: |-
      de berichten, bedoeld onder a en b, door hem kunnen worden ingezien, kunnen worden vernietigd of ongewijzigd
      kunnen worden overgebracht naar een systeem voor gegevensverwerking buiten het centraal loket, zolang een
      vernietigingstermijn als bedoeld in [artikel 2, onder e][ref1], niet is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0026761#Artikel2
    url: https://wetten.overheid.nl/BWBR0026761/2009-12-07#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0026761
        artikel: '2'
        paragraaf: '2'
  - number: '4.1'
    text: |-
      Het centraal loket is zodanig ingericht dat de aansluiting van een bevoegde instantie op dat loket haar in staat
      stelt via het loket verzonden of ontvangen procedureberichten te verwerken.
    url: https://wetten.overheid.nl/BWBR0026761/2009-12-07#Artikel4
  - number: '4.2'
    text: |-
      Het centraal loket is zodanig ingericht dat een door een bevoegde instantie vastgesteld formulier dat op procedures
      en formaliteiten betrekking heeft binnen dit loket voor verzending door dienstverrichters toegankelijk wordt
      gemaakt, indien:
    url: https://wetten.overheid.nl/BWBR0026761/2009-12-07#Artikel4
  - number: 4.2.a
    text: |-
      dienstverrichters bij de afwikkeling van procedures en formaliteiten op het gebruik van het formulier zijn
      aangewezen doordat een bevoegde instantie het gebruik er van heeft voorgeschreven, en
    url: https://wetten.overheid.nl/BWBR0026761/2009-12-07#Artikel4
  - number: 4.2.b
    text: |-
      een bevoegde instantie het formulier zelf elektronisch toegankelijk heeft gemaakt voor gebruik, maar niet op
      zodanige wijze dat verzending daarvan op enigerlei wijze via het centraal loket mogelijk is.
    url: https://wetten.overheid.nl/BWBR0026761/2009-12-07#Artikel4
  - number: '5.1'
    text: 'Het centraal loket is zodanig ingericht dat het tijdstip wordt geregistreerd waarop een procedurebericht:'
    url: https://wetten.overheid.nl/BWBR0026761/2009-12-07#Artikel5
  - number: 5.1.a
    text: |-
      een binnen het centraal loket voor een dienstverrichter respectievelijk een bevoegde instantie toegankelijke
      elektronische omgeving bereikt, indien een dienstverrichter respectievelijk een bevoegde instantie het
      procedurebericht daarnaar heeft verzonden;
    url: https://wetten.overheid.nl/BWBR0026761/2009-12-07#Artikel5
  - number: 5.1.b
    text: |-
      het centraal loket verlaat, indien een dienstverrichter het procedurebericht via het centraal loket heeft verzonden
      naar een systeem voor gegevensverwerking buiten het centraal loket.
    url: https://wetten.overheid.nl/BWBR0026761/2009-12-07#Artikel5
  - number: '5.2'
    text: |-
      Het centraal loket is zodanig ingericht dat het geregistreerde tijdstip, bedoeld in het eerste lid, onder a of b,
      op een voor de ontvanger toegankelijke wijze aan het procedurebericht wordt gehecht.
    url: https://wetten.overheid.nl/BWBR0026761/2009-12-07#Artikel5
  - number: '5.3'
    text: |-
      Het centraal loket is zodanig ingericht dat aan de ontvanger van een procedurebericht, bedoeld in het eerste lid,
      onder a, onverwijld mededeling wordt gedaan van de aanwezigheid van dat bericht in de elektronische omgeving binnen
      het centraal loket die het na verzending heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0026761/2009-12-07#Artikel5
  - number: '5.4'
    text: |-
      Het centraal loket is zodanig ingericht dat het eerste tot en met derde lid van overeenkomstige toepassing is op
      het doorzenden van berichten tussen bevoegde instanties.
    url: https://wetten.overheid.nl/BWBR0026761/2009-12-07#Artikel5
  - number: '6'
    text: |-
      De [artikelen 2][ref1], [3 ][ref2]en [5][ref3], zijn tevens van toepassing op het via het centraal loket kunnen
      verzenden en ontvangen van een bijstandsbericht, met dien verstande dat voor «een bevoegde instantie» telkens wordt
      gelezen: 'Onze Minister, voor «dienstverrichter»: zakelijke afnemer, en voor «procedurebericht»: bijstandsbericht.'


      [ref1]: https://wetten.overheid.nl/BWBR0026761#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0026761#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0026761#Artikel5
    url: https://wetten.overheid.nl/BWBR0026761/2009-12-07#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0026761
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0026761
        artikel: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0026761
        artikel: '5'
        paragraaf: '2'
  - number: '7.1'
    text: |-
      Het centraal loket is zodanig ingericht dat de nodige maatregelen van technische en organisatorische aard zijn
      getroffen ter beveiliging van de in het centraal loket opgenomen gegevens tegen verlies of aantasting van deze
      gegevens en tegen onbevoegde kennisneming, opneming, wijziging, verwijdering of verstrekking van deze gegevens.
    url: https://wetten.overheid.nl/BWBR0026761/2009-12-07#Artikel7
  - number: '7.2'
    text: |-
      Het centraal loket is zodanig ingericht dat de nodige maatregelen van technische en organisatorische aard zijn
      getroffen ter beveiliging van het centraal loket tegen onbevoegd gebruik en belemmering van de goede werking van
      dat loket.
    url: https://wetten.overheid.nl/BWBR0026761/2009-12-07#Artikel7
  - number: '7.3'
    text: 'De maatregelen, bedoeld in het eerste en tweede lid, hebben in ieder geval betrekking op:'
    url: https://wetten.overheid.nl/BWBR0026761/2009-12-07#Artikel7
  - number: 7.3.a
    text: de personen die werkzaam zijn voor Onze Minister;
    url: https://wetten.overheid.nl/BWBR0026761/2009-12-07#Artikel7
  - number: 7.3.b
    text: de toegang tot het centraal loket, met inbegrip van verbindingen die tot het centraal loket toegang bieden;
    url: https://wetten.overheid.nl/BWBR0026761/2009-12-07#Artikel7
  - number: 7.3.c
    text: |-
      de toegang tot gebouwen en ruimten waar apparatuur en programmatuur die van het centraal loket deel uitmaken,
      aanwezig zijn;
    url: https://wetten.overheid.nl/BWBR0026761/2009-12-07#Artikel7
  - number: 7.3.d
    text: de apparatuur en de programmatuur van het centraal loket;
    url: https://wetten.overheid.nl/BWBR0026761/2009-12-07#Artikel7
  - number: 7.3.e
    text: de gegevens en het beheer van de gegevens die in het centraal loket zijn opgenomen;
    url: https://wetten.overheid.nl/BWBR0026761/2009-12-07#Artikel7
  - number: 7.3.f
    text: het voorkomen van calamiteiten en het afhandelen daarvan.
    url: https://wetten.overheid.nl/BWBR0026761/2009-12-07#Artikel7
  - number: '7.4'
    text: |-
      Het centraal loket is zodanig ingericht dat indien de maatregelen, bedoeld in het eerste tot en met het derde lid,
      tot gevolg hebben dat verzending of ontvangst van een procedure- of bijstandsbericht via het centraal loket wordt
      verhinderd, daarvan onverwijld mededeling wordt gedaan aan de afzender van het bericht.
    url: https://wetten.overheid.nl/BWBR0026761/2009-12-07#Artikel7
  - number: '7.5'
    text: |-
      De maatregelen, bedoeld in het eerste tot en met het derde lid, strekken niet tot het herstellen van een procedure-
      of bijstandsbericht dat wordt aangetast of verloren dreigt te raken door andere van datzelfde bericht deel
      uitmakende gegevens.
    url: https://wetten.overheid.nl/BWBR0026761/2009-12-07#Artikel7
  - number: '7.6'
    text: |-
      Indien Onze Minister constateert dat de ononderbroken of goede werking van het centraal loket als voorziening in
      gevaar is of dreigt te komen, wordt daarvan zo spoedig mogelijk mededeling gedaan aan alle op het centraal loket
      aangesloten dienstverrichters en bevoegde instanties.
    url: https://wetten.overheid.nl/BWBR0026761/2009-12-07#Artikel7
  - number: '8'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de inrichting van het centraal
      loket, bedoeld in de [artikelen 2 tot en met 6][ref1], en [7 eerste tot en met vijfde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0026761#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0026761#Artikel7
    url: https://wetten.overheid.nl/BWBR0026761/2009-12-07#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0026761
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0026761
        artikel: '7'
        paragraaf: '4'
  - number: '9'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0026761/2009-12-07#Artikel9
  - number: '10'
    text: 'Dit besluit wordt aangehaald als: Dienstenbesluit centraal loket.'
    url: https://wetten.overheid.nl/BWBR0026761/2009-12-07#Artikel10
