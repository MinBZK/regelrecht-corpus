  - number: 2b
    text: |-
      1 Van de verzekering ingevolge [artikel 3, eerste lid, onder a, van de Ziekenfondswet][ref1], is uitgezonderd degene
      die bij of krachtens [artikel 8a van de Ziektewet][ref2], als werknemer in de zin van die wet wordt beschouwd, en
      die recht heeft, dan wel op de dag, voorafgaande aan de dag waarop dat artikel op hem van toepassing werd, recht
      had op medische zorg krachtens een regeling van een op grond van [artikel 3, eerste lid, onder d][ref3], dan wel
      [artikel 14, tweede lid, van het Besluit uitbreiding en beperking kring verzekerden volksverzekeringen 1999][ref4]
      aangewezen volkenrechtelijke organisatie.

      2 Van de verzekering ingevolge [artikel 3, eerste lid, onder b, van de Ziekenfondswet][ref5], zijn uitgezonderd:

      a. degene die recht heeft op een arbeidsongeschiktheidsuitkering ingevolge de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref6], indien hij recht heeft, dan wel op
      de dag, voorafgaande aan de dag waarop zijn recht op die uitkering ingaat, recht had op medische
      zorg krachtens een regeling van een op grond van [artikel 3, eerste lid, onder d][ref7], dan wel
      [artikel 14, tweede lid, van het Besluit uitbreiding en beperking kring verzekerden volksverzekeringen 1999][ref8]
      aangewezen volkenrechtelijke organisatie;

      b. degene die recht heeft op een uitkering op grond van de [Algemene nabestaandenwet][ref9],
      indien degene op grond van wiens overlijden recht op die uitkering bestaat, op de dag,
      voorafgaande aan de dag waarop het recht op die uitkering ingaat, recht had op medische zorg
      krachtens een regeling van een op grond van [artikel 3, eerste lid, onder d][ref10], dan wel
      [artikel 14, tweede lid, van het Besluit uitbreiding en beperking kring verzekerden volksverzekeringen 1999][ref11]
      aangewezen volkenrechtelijke organisatie;

      c. degene die recht heeft op een uitkering op grond van de [Algemene nabestaandenwet][ref12], indien hij
      recht heeft dan wel op de dag, voorafgaande aan de dag waarop het recht op die uitkering ingaat, recht had
      op medische zorg krachtens een regeling van een op grond van [artikel 3, eerste lid, onder d][ref13], dan wel
      [artikel 14, tweede lid, van het Besluit uitbreiding en beperking kring verzekerden volksverzekeringen 1999][ref14]
      aangewezen volkenrechtelijke organisatie.


