      de periode in enig kalenderjaar, waarin geen belastingplicht bestaat in de zin van de
      [Wet op de inkomstenbelasting 2001][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0004093/2004-09-29#Artikel4
