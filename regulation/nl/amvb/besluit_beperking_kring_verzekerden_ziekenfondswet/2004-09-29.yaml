  - number: 2.1.b
    text: |-
      degene die bij of krachtens [artikel 8a, van de Ziektewet][ref1] als werknemer in de zin van die wet wordt
      beschouwd en die uit hoofde van de dienstbetrekking waarin hij niet meer of nog slechts ten dele werkzaam
      is vanwege de arbeidsongeschiktheid ter zake waarvan hij recht heeft op een arbeidsongeschiktheidsuitkering
      op grond van de verplichte verzekering ingevolge de [Wet op de arbeidsongeschiktheidsverzekering][ref2],
      overeengekomen vaste, naar tijdsruimte en in geld vastgestelde inkomsten of invaliditeitspensioen ontvangt,
      indien deze inkomsten en dit pensioen tezamen met de arbeidsongeschiktheidsuitkering op jaarbasis meer bedragen
      dan het in [artikel 3, eerste lid, onder a, van de Ziekenfondswet][ref3] genoemde bedrag en indien zijn
      arbeidsongeschiktheidsuitkering ingevolge de [Wet op de arbeidsongeschiktheidsverzekering][ref4] wordt berekend
      naar het maximum dagloon, bedoeld in [artikel 9, eerste lid, van de Coördinatiewet Sociale Verzekering][ref5],
      tenzij hij op de dag, voorafgaande aan die, waarop dit het geval is, verzekerd was op grond van de
      [Ziekenfondswet][ref6];


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel8a
      [ref2]: https://wetten.overheid.nl/BWBR0002524
      [ref3]: https://wetten.overheid.nl/BWBR0002460#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0002524
      [ref5]: https://wetten.overheid.nl/BWBR0002126#Artikel9
      [ref6]: https://wetten.overheid.nl/BWBR0002460
