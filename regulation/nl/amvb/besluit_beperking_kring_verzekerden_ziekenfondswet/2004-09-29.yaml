    text: |-
      de periode in enig kalenderjaar, waarin buitenlandse belastingplicht bestaat in de zin van de
      [Wet inkomstenbelasting 2001][ref1] gedurende de periode waarin nog geen winst wordt genoten uit een Nederlandse
      onderneming, bedoeld in [afdeling 7.2 van de Wet inkomstenbelasting 2001][ref2], die feitelijk voor eigen rekening
      wordt gedreven;


