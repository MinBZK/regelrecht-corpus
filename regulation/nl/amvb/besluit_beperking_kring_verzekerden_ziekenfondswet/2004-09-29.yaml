      [ref6]: https://wetten.overheid.nl/BWBR0002126#Artikel9
      [ref7]: https://wetten.overheid.nl/BWBR0002460
    url: https://wetten.overheid.nl/BWBR0004093/2004-09-29#Artikel2
    references:
      - id: ref1
