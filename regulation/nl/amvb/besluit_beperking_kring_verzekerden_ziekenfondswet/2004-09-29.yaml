        artikel: 8a
      - id: ref2
        bwb_id: BWBR0002460
  - number: 2.1.d
    text: |-
      degene die bij of krachtens [artikel 8a van de Ziektewet][ref1] als werknemer in de zin van die wet wordt beschouwd
      en uitsluitend uit hoofde van zijn arbeidsverhouding, bedoeld in artikel 8b, eerste lid, onder b, van die Wet,
      waarin hij niet of slechts nog ten dele werkzaam is, een arbeidsongeschiktheidsuitkering ontvangt op grond van de
      verplichte verzekering ingevolge de [Wet op de arbeidsongeschiktheidsverzekering][ref2], berekend naar een mate van
      arbeidsongeschiktheid van minder dan 45%.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel8a
      [ref2]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0004093/2004-09-29#Artikel2
    references:
      - id: ref1
