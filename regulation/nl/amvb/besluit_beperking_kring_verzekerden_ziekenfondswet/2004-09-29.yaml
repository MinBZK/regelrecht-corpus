  - number: 2d
    text: |-
      Van de verzekering ingevolge [artikel 3, eerste lid, onder a, van de Ziekenfondswet][ref1] is uitgezonderd degene
      wiens arbeidsverhouding met inachtneming van [artikel 3 van de Ziektewet][ref2] juncto een algemene maatregel van
      bestuur als bedoeld in [artikel 8b van de Ziektewet][ref3] wordt aangemerkt als dienstbetrekking in de zin van de
      [Ziektewet][ref4] en die tevens,

      a. ambtenaar is in de zin van de [Ambtenarenwet][ref5], dan wel

      b. behoort tot het personeel, bedoeld in de[ titels 12][ref6] en
      [13 van hoofdstuk 1 van het Rechtspositiebesluit WPO/WEC][ref7], dan wel

      c. bij een bijzondere instelling voor hoger beroepsonderwijs, bedoeld in de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref8], behoort tot het onderwijspersoneel, benoemd in
      een functie met een maximumschaal van 10 of hoger, of tot de leden van het college van bestuur of tot de centrale
      directie, dan wel

      d. bij een door het Rijk bekostigde bijzondere school voor voortgezet onderwijs als bedoeld in de
      [Wet op het voortgezet onderwijs][ref9], behoort tot het onderwijzend personeel of tot de leden van de directie of
      tot de centrale directie, dan wel

      e. bij een door het Rijk bekostigde bijzondere instelling als bedoeld in
      [artikel 1.1.1, onderdeel b,][ref10][12.3.8][ref11] of [12.3.9 van de Wet educatie en beroepsonderwijs][ref12],
      behoort tot het onderwijzend personeel of tot de leden van het college van bestuur of tot de centrale directie,
      dan wel

      f. bij een innovatie- en praktijkcentrum als bedoeld in
      [artikel 1.1.1, onderdeel b1, van de Wet educatie en beroepsonderwijs][ref13], behoort tot het onderwijzend
      personeel of tot de leden van het college van bestuur of tot de centrale directie, dan wel

      g. bij een kenniscentrum beroepsonderwijs bedrijfsleven als bedoeld in
      [artikel 1.1.1, onderdeel b2, van de Wet educatie en beroepsonderwijs][ref14], behoort tot de consulenten of de
      directie, dan wel

      h. behoort tot door Onze Minister van Volksgezondheid, Welzijn en Sport, in voorkomend geval in overeenstemming met
      Onze Minister die het mede aangaat aan te wijzen groepen van personen.


