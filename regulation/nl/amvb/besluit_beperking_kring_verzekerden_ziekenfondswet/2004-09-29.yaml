  - number: 2e
    text: |-
      Van de verzekering ingevolge [artikel 3, eerste lid, onder a, van de Ziekenfondswet][ref1] is uitgezonderd
      degene die uitsluitend uit hoofde van een arbeidsverhouding als overheidswerknemer in de zin van
      [artikel 1, onderdeel l, van de Wet overheidspersoneel onder de werknemersverzekeringen][ref2] een uitkering op
      grond van de [Werkloosheidswet][ref3] ontvangt, tenzij hij op grond van die arbeidsverhouding verplicht verzekerd
      was, of uitsluitend in verband met overschrijding van de voor de verplichte ziekenfondsverzekering geldende
      loongrens niet verplicht verzekerd was.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009267#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0004093/2004-09-29#Artikel2e
    references:
      - id: ref1
