    text: |-
      1 Van de verzekering ingevolge [artikel 3, eerste lid, onder a, van de Ziekenfondswet][ref1] zijn uitgezonderd:

      a. degene die bij of krachtens [artikel 7 van de Ziektewet][ref2] als werknemer in de zin van die wet
      wordt beschouwd en die uit hoofde van de dienstbetrekking ter zake van de beëindiging waarvan hij recht
      heeft op een uitkering op grond van de verplichte verzekering ingevolge de [Werkloosheidswet][ref3],
      overeengekomen vaste, naar tijdsruimte en in geld vastgestelde inkomsten ontvangt, indien deze
      inkomsten tezamen met de uitkering ingevolge de [Werkloosheidswet][ref4] op jaarbasis meer bedragen
      dan het in [artikel 3, eerste lid, onder a, van de Ziekenfondswet][ref5] genoemde bedrag en indien zijn
      uitkering ingevolge de [Werkloosheidswet][ref6] wordt berekend naar het maximum dagloon, bedoeld in
      [artikel 9, eerste lid, van de Coördinatiewet Sociale Verzekering][ref7], tenzij hij op de dag, voorafgaande aan
      die, waarop dit het geval is, verzekerd was op grond van de [Ziekenfondswet][ref8];

      b. degene die bij of krachtens [artikel 8a, van de Ziektewet][ref9] als werknemer in de zin van die wet wordt
      beschouwd en die uit hoofde van de dienstbetrekking waarin hij niet meer of nog slechts ten dele werkzaam
      is vanwege de arbeidsongeschiktheid ter zake waarvan hij recht heeft op een arbeidsongeschiktheidsuitkering
      op grond van de verplichte verzekering ingevolge de [Wet op de arbeidsongeschiktheidsverzekering][ref10],
      overeengekomen vaste, naar tijdsruimte en in geld vastgestelde inkomsten of invaliditeitspensioen ontvangt,
      indien deze inkomsten en dit pensioen tezamen met de arbeidsongeschiktheidsuitkering op jaarbasis meer bedragen
      dan het in [artikel 3, eerste lid, onder a, van de Ziekenfondswet][ref11] genoemde bedrag en indien zijn
      arbeidsongeschiktheidsuitkering ingevolge de [Wet op de arbeidsongeschiktheidsverzekering][ref12] wordt berekend
      naar het maximum dagloon, bedoeld in [artikel 9, eerste lid, van de Coördinatiewet Sociale Verzekering][ref13],
      tenzij hij op de dag, voorafgaande aan die, waarop dit het geval is, verzekerd was op grond van de
      [Ziekenfondswet][ref14];

      c. degene die bij of krachtens [artikel 8a van de Ziektewet][ref15] als werknemer in de zin van die wet wordt
      beschouwd, en die deelneemt, dan wel op de dag, voorafgaande aan de dag waarop dat artikel op hem van toepassing
      werd, deelnam aan een publiekrechtelijke ziektekostenregeling voor ambtenaren, bedoeld in artikel 4, zestiende lid,
      onder b, van de [Ziekenfondswet][ref16].

      d. degene die bij of krachtens [artikel 8a van de Ziektewet][ref17] als werknemer in de zin van die wet wordt
      beschouwd en uitsluitend uit hoofde van zijn arbeidsverhouding, bedoeld in artikel 8b, eerste lid, onder b, van die
      Wet, waarin hij niet of slechts nog ten dele werkzaam is, een arbeidsongeschiktheidsuitkering ontvangt op grond van
      de verplichte verzekering ingevolge de [Wet op de arbeidsongeschiktheidsverzekering][ref18], berekend naar een mate
      van arbeidsongeschiktheid van minder dan 45%.

      2 Bij de toepassing van het eerste lid, onder a en b, wordt tot het einde van een kalenderjaar geen rekening
      gehouden met wijzigingen van het dagloon, welke na 1 november van het voorafgaande kalenderjaar plaatsvinden of
      hebben plaatsgevonden.

      3 Ten aanzien van de in het eerste lid, onder a of b, bedoelde persoon die recht heeft op een vervolguitkering
      ingevolge de [Werkloosheidswet][ref19] onderscheidenlijk de [Wet op de arbeidsongeschiktheidsverzekering][ref20],
      wordt onder dagloon verstaan, het dagloon waarnaar voor hem de loondervingsuitkering ingevolge die wetten zou zijn
      berekend indien de duur daarvan nog niet zou zijn verstreken.


