articles:
  - number: '1'
    text: |-
      Van de verzekering ingevolge [artikel 3, eerste lid, onder a, van de Ziekenfondswet][ref1] zijn uitgezonderd:


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3
    url: https://wetten.overheid.nl/BWBR0004093/2004-09-29#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '3'
  - number: 1.a
    text: |-
      degene die loon of uitkering ontvangt, in aanvulling op een uitkering op grond van de verplichte verzekering
      ingevolge de [Wet op de arbeidsongeschiktheidsverzekering][ref1], en die niet uit hoofde van laatstgenoemde
      uitkering verzekerd is of wordt ingevolge de [Ziekenfondswet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0002460
    url: https://wetten.overheid.nl/BWBR0004093/2004-09-29#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0002460
  - number: 1.b
    text: |-
      degene die bij of krachtens [artikel 7 van de Ziektewet][ref1] als werknemer in de zin van die wet wordt
      beschouwd met ingang van de dag nadat dat artikel een jaar op hem van toepassing is of zoveel eerder als de
      werkloosheidsuitkering is gedaald tot minder dan 70% van het dagloon, en die zijn woonplaats heeft buiten het Rijk,
      op het grondgebied van een staat waar hij noch krachtens de Verordening van de Raad van de Europese Gemeenschappen,
      dan wel de toepassing van zodanige verordening krachtens de Overeenkomst betreffende de Europese Economische
      Ruimte noch krachtens een verdrag recht heeft op verstrekkingen, welke in beginsel worden verleend ten laste van de
      Algemene Kas bedoeld in [artikel 1q van de Ziekenfondswet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel1q
    url: https://wetten.overheid.nl/BWBR0004093/2004-09-29#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0002460
        artikel: 1q
  - number: 1.c
    text: |-
      degene die bij of krachtens [artikel 8][ref1] als werknemer in de zin van die wet wordt beschouwd en die zijn
      woonplaats heeft buiten het Rijk, op het grondgebied van een staat waar hij noch krachtens de Verordening van
      de Raad van de Europese Gemeenschappen, dan wel de toepassing van zodanige verordening krachtens de Overeenkomst
      betreffende de Europese Economische Ruimte, noch krachtens een verdrag recht heeft op verstrekkingen welke in
      beginsel worden verleend ten laste van de Algemene Kas bedoeld in [artikel 1q van de Ziekenfondswet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel8a
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel1q
    url: https://wetten.overheid.nl/BWBR0004093/2004-09-29#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: 8a
      - id: ref2
        bwb_id: BWBR0002460
        artikel: 1q
  - number: 1.d
    text: |-
      degene die bij of krachtens [artikel 7 van de Ziektewet][ref1] als werknemer in de zin van die wet wordt beschouwd
      en aan wie door toepassing van [artikel 16, derde lid, van de Werkloosheidswet][ref2] geen uitkering ingevolge die
      wet wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel16
    url: https://wetten.overheid.nl/BWBR0004093/2004-09-29#Artikel1
