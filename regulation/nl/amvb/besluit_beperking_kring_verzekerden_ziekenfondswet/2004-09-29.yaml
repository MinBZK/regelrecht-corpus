  - number: '3'
    text: |-
      De verzekering ingevolge [artikel 3d, eerste lid, van de Ziekenfondswet][ref1] eindigt met ingang van de eerste dag
      van de maand waarin de verzekerde de leeftijd van 65 jaar bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3d
    url: https://wetten.overheid.nl/BWBR0004093/2004-09-29#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 3d
  - number: '4'
    text: |-
      1 Van de verzekeringsduur, genoemd in [artikel 3d, eerste lid, van de Ziekenfondswet][ref1] is uitgezonderd:

      a. de periode in enig kalenderjaar, waarin geen belastingplicht bestaat in de zin van de
      [Wet op de inkomstenbelasting 2001][ref2];

      b. de periode in enig kalenderjaar, waarin buitenlandse belastingplicht bestaat in de zin van de
      [Wet inkomstenbelasting 2001][ref3] gedurende de periode waarin nog geen winst wordt genoten uit een Nederlandse
      onderneming, bedoeld in [afdeling 7.2 van de Wet inkomstenbelasting 2001][ref4], die feitelijk voor eigen rekening
      wordt gedreven;

      c. de periode in enig kalenderjaar, waarin binnenlandse belastingplicht bestaat in de zin van de
      [Wet inkomstenbelasting 2001][ref5] zonder dat op enig moment in die periode winst wordt genoten uit een
      onderneming als bedoeld in [paragraaf 3.2.1. van de Wet inkomstenbelasting 2001][ref6], die feitelijk voor eigen
      rekening wordt gedreven.

      2 Onze Minister kan in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid en Onze Minister van
      Financiën, nadere regels stellen ter uitvoering van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3d
