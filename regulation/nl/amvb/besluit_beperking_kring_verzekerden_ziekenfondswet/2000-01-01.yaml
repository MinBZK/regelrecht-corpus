preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Welzijn, Volksgezondheid en Cultuur van 11 november 1986, DGVGZ/VTA/
    VZ/VV, nr. 36172;

    Gelet op artikel 3, negende lid, van de Ziekenfondswet;

    Gehoord de Ziekenfondsraad (adviezen van 2 april 1986 nr. SVV/VERZ/4670, 26 juni 1986, nr.SVV/VERZ/17 832 en 8
    augustus 1986 nr. JA/16 386);

    De Raad van State gehoord (advies van 19 december 1986 nr. W13.86.0589);

    Gezien het nader rapport van Onze Minister van Welzijn, Volksgezondheid en Cultuur van 23 december 1986, DGVGZ/VTA/
    VZ/VV, nr. 36850;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004093/2000-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Van de verzekering ingevolge [artikel 3, eerste lid, onder a, van de Ziekenfondswet][ref1] zijn uitgezonderd:


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3
    url: https://wetten.overheid.nl/BWBR0004093/2000-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '3'
  - number: 1.a
    text: |-
      degene die loon of uitkering ontvangt, in aanvulling op een uitkering op grond van de verplichte verzekering
      ingevolge de [Wet op de arbeidsongeschiktheidsverzekering][ref1], en die niet uit hoofde van laatstgenoemde
      uitkering verzekerd is of wordt ingevolge de [Ziekenfondswet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0002460
    url: https://wetten.overheid.nl/BWBR0004093/2000-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0002460
  - number: 1.b
    text: |-
      degene die bij of krachtens [artikel 7 van de Ziektewet][ref1] als werknemer in de zin van die wet wordt
      beschouwd met ingang van de dag nadat dat artikel een jaar op hem van toepassing is of zoveel eerder als de
      werkloosheidsuitkering is gedaald tot minder dan 70% van het dagloon, en die zijn woonplaats heeft buiten het Rijk,
      op het grondgebied van een staat waar hij noch krachtens de Verordening van de Raad van de Europese Gemeenschappen,
      dan wel de toepassing van zodanige verordening krachtens de Overeenkomst betreffende de Europese Economische
      Ruimte noch krachtens een verdrag recht heeft op verstrekkingen, welke in beginsel worden verleend ten laste van de
      Algemene Kas bedoeld in [artikel 1q van de Ziekenfondswet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel1q
    url: https://wetten.overheid.nl/BWBR0004093/2000-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0002460
        artikel: 1q
  - number: 1.c
    text: |-
      degene die bij of krachtens [artikel 8][ref1] als werknemer in de zin van die wet wordt beschouwd en die zijn
      woonplaats heeft buiten het Rijk, op het grondgebied van een staat waar hij noch krachtens de Verordening van
      de Raad van de Europese Gemeenschappen, dan wel de toepassing van zodanige verordening krachtens de Overeenkomst
      betreffende de Europese Economische Ruimte, noch krachtens een verdrag recht heeft op verstrekkingen welke in
      beginsel worden verleend ten laste van de Algemene Kas bedoeld in [artikel 1q van de Ziekenfondswet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel8a
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel1q
    url: https://wetten.overheid.nl/BWBR0004093/2000-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: 8a
      - id: ref2
        bwb_id: BWBR0002460
        artikel: 1q
  - number: 1.d
    text: |-
      degene die bij of krachtens [artikel 7 van de Ziektewet][ref1] als werknemer in de zin van die wet wordt beschouwd
      en aan wie door toepassing van [artikel 16, derde lid, van de Werkloosheidswet][ref2] geen uitkering ingevolge die
      wet wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel16
    url: https://wetten.overheid.nl/BWBR0004093/2000-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '16'
  - number: '2.1'
    text: |-
      Van de verzekering ingevolge [artikel 3, eerste lid, onder a, van de Ziekenfondswet][ref1] zijn uitgezonderd:


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3
    url: https://wetten.overheid.nl/BWBR0004093/2000-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '3'
  - number: 2.1.a
    text: |-
      degene die bij of krachtens [artikel 7 van de Ziektewet][ref1] als werknemer in de zin van die wet
      wordt beschouwd en die uit hoofde van de dienstbetrekking ter zake van de beëindiging waarvan hij recht
      heeft op een uitkering op grond van de verplichte verzekering ingevolge de [Werkloosheidswet][ref2],
      overeengekomen vaste, naar tijdsruimte en in geld vastgestelde inkomsten ontvangt, indien deze
      inkomsten tezamen met de uitkering ingevolge de [Werkloosheidswet][ref3] op jaarbasis meer bedragen
      dan het in [artikel 3, eerste lid, onder a, van de Ziekenfondswet][ref4] genoemde bedrag en indien zijn
      uitkering ingevolge de [Werkloosheidswet][ref5] wordt berekend naar het maximum dagloon, bedoeld in
      [artikel 9, eerste lid, van de Coördinatiewet Sociale Verzekering][ref6], tenzij hij op de dag, voorafgaande aan
      die, waarop dit het geval is, verzekerd was op grond van de [Ziekenfondswet][ref7];


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0004045
      [ref3]: https://wetten.overheid.nl/BWBR0004045
      [ref4]: https://wetten.overheid.nl/BWBR0002460#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0004045
      [ref6]: https://wetten.overheid.nl/BWBR0002126#Artikel9
      [ref7]: https://wetten.overheid.nl/BWBR0002460
    url: https://wetten.overheid.nl/BWBR0004093/2000-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0004045
      - id: ref3
        bwb_id: BWBR0004045
      - id: ref4
        bwb_id: BWBR0002460
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0004045
      - id: ref6
        bwb_id: BWBR0002126
        artikel: '9'
      - id: ref7
        bwb_id: BWBR0002460
  - number: 2.1.b
    text: |-
      degene die bij of krachtens [artikel 8a, van de Ziektewet][ref1] als werknemer in de zin van die wet wordt
      beschouwd en die uit hoofde van de dienstbetrekking waarin hij niet meer of nog slechts ten dele werkzaam
      is vanwege de arbeidsongeschiktheid ter zake waarvan hij recht heeft op een arbeidsongeschiktheidsuitkering
      op grond van de verplichte verzekering ingevolge de [Wet op de arbeidsongeschiktheidsverzekering][ref2],
      overeengekomen vaste, naar tijdsruimte en in geld vastgestelde inkomsten of invaliditeitspensioen ontvangt,
      indien deze inkomsten en dit pensioen tezamen met de arbeidsongeschiktheidsuitkering op jaarbasis meer bedragen
      dan het in [artikel 3, eerste lid, onder a, van de Ziekenfondswet][ref3] genoemde bedrag en indien zijn
      arbeidsongeschiktheidsuitkering ingevolge de [Wet op de arbeidsongeschiktheidsverzekering][ref4] wordt berekend
      naar het maximum dagloon, bedoeld in [artikel 9, eerste lid, van de Coördinatiewet Sociale Verzekering][ref5],
      tenzij hij op de dag, voorafgaande aan die, waarop dit het geval is, verzekerd was op grond van de
      [Ziekenfondswet][ref6];


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel8a
      [ref2]: https://wetten.overheid.nl/BWBR0002524
      [ref3]: https://wetten.overheid.nl/BWBR0002460#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0002524
      [ref5]: https://wetten.overheid.nl/BWBR0002126#Artikel9
      [ref6]: https://wetten.overheid.nl/BWBR0002460
    url: https://wetten.overheid.nl/BWBR0004093/2000-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: 8a
      - id: ref2
        bwb_id: BWBR0002524
      - id: ref3
        bwb_id: BWBR0002460
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0002524
      - id: ref5
        bwb_id: BWBR0002126
        artikel: '9'
      - id: ref6
        bwb_id: BWBR0002460
  - number: 2.1.c
    text: |-
      degene die bij of krachtens [artikel 8a van de Ziektewet][ref1] als werknemer in de zin van die wet wordt
      beschouwd, en die deelneemt, dan wel op de dag, voorafgaande aan de dag waarop dat artikel op hem van toepassing
      werd, deelnam aan een publiekrechtelijke ziektekostenregeling voor ambtenaren, bedoeld in artikel 4, zestiende lid,
      onder b, van de [Ziekenfondswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel8a
      [ref2]: https://wetten.overheid.nl/BWBR0002460
    url: https://wetten.overheid.nl/BWBR0004093/2000-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: 8a
      - id: ref2
        bwb_id: BWBR0002460
  - number: '2.2'
    text: |-
      Bij de toepassing van het eerste lid, onder a en b, wordt tot het einde van een kalenderjaar geen rekening gehouden
      met wijzigingen van het dagloon, welke na 1 november van het voorafgaande kalenderjaar plaatsvinden of hebben
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0004093/2000-01-01#Artikel2
  - number: '2.3'
    text: |-
      Ten aanzien van de in het eerste lid, onder a of b, bedoelde persoon die recht heeft op een vervolguitkering
      ingevolge de [Werkloosheidswet][ref1] onderscheidenlijk de [Wet op de arbeidsongeschiktheidsverzekering][ref2],
      wordt onder dagloon verstaan, het dagloon waarnaar voor hem de loondervingsuitkering ingevolge die wetten zou zijn
      berekend indien de duur daarvan nog niet zou zijn verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0004093/2000-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0002524
  - number: 2a.1
    text: |-
      Van de verzekering ingevolge [artikel 3, eerste lid, onder a, b en d, van de Ziekenfondswet][ref1]
      is uitgezonderd degene wiens vaste, naar tijdsruimte en in geld vastgestelde inkomen uit een of
      meer rechtsverhoudingen die afzonderlijk bezien rechtsgrond zouden vormen voor verzekering ingevolge
      [artikel 3, eerste lid, onder b of d, van de Ziekenfondswet][ref2], in voorkomend geval vermeerderd met het
      loon, bedoeld in [artikel 3, vierde en vijfde lid, van de Ziekenfondswet][ref3], meer bedraagt dan het in
      [artikel 3, eerste lid, onder a, van de Ziekenfondswet][ref4] bedoelde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002460#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002460#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0002460#Artikel3
    url: https://wetten.overheid.nl/BWBR0004093/2000-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002460
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0002460
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0002460
        artikel: '3'
  - number: 2a.2
    text: |-
      Voor de toepassing van het eerste lid is
      [artikel 3, vierde lid, onder b, c, d en e en e, van de Ziekenfondswet][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3
    url: https://wetten.overheid.nl/BWBR0004093/2000-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '3'
  - number: 2b.1
    text: |-
      Van de verzekering ingevolge [artikel 3, eerste lid, onder a, van de Ziekenfondswet][ref1], is uitgezonderd degene
      die bij of krachtens [artikel 8a van de Ziektewet][ref2], als werknemer in de zin van die wet wordt beschouwd,
      en die recht heeft, dan wel op de dag, voorafgaande aan de dag waarop dat artikel op hem van toepassing werd,
      recht had op medische zorg krachtens een regeling van een op grond van artikel 3, derde lid, dan wel artikel
      13, tweede lid, van het Besluit uitbreiding en beperking kring verzekerden volksverzekeringen 1989 aangewezen
      volkenrechtelijke organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel8a
    url: https://wetten.overheid.nl/BWBR0004093/2000-01-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: 8a
  - number: 2b.2
    text: |-
      Van de verzekering ingevolge [artikel 3, eerste lid, onder b, van de Ziekenfondswet][ref1], zijn uitgezonderd:


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3
    url: https://wetten.overheid.nl/BWBR0004093/2000-01-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '3'
  - number: 2b.2.a
    text: |-
      degene die recht heeft op een arbeidsongeschiktheidsuitkering ingevolge de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1], indien hij recht heeft, dan wel op de dag,
      voorafgaande aan de dag waarop zijn recht op die uitkering ingaat, recht had op medische zorg krachtens een
      regeling van een op grond van artikel 3, derde lid, dan wel artikel 13, tweede lid, van het Besluit uitbreiding en
      beperking kring verzekerden volksverzekeringen 1989 aangewezen volkenrechtelijke organisatie;


      [ref1]: https://wetten.overheid.nl/BWBR0008656
    url: https://wetten.overheid.nl/BWBR0004093/2000-01-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0008656
  - number: 2b.2.b
    text: |-
      degene die recht heeft op een uitkering op grond van de [Algemene nabestaandenwet][ref1], indien degene op grond
      van wiens overlijden recht op die uitkering bestaat, op de dag, voorafgaande aan de dag waarop het recht op die
      uitkering ingaat, recht had op medische zorg krachtens een regeling van een op grond van artikel 3, derde lid,
      dan wel artikel 13, tweede lid, van het Besluit uitbreiding en beperking kring verzekerden volksverzekeringen 1989
      aangewezen volkenrechtelijke organisatie;


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0004093/2000-01-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: 2b.2.c
    text: |-
      degene die recht heeft op een uitkering op grond van de [Algemene nabestaandenwet][ref1], indien hij recht heeft
      dan wel op de dag, voorafgaande aan de dag waarop het recht op die uitkering ingaat, recht had op medische zorg
      krachtens een regeling van een op grond van artikel 3, derde lid, dan wel artikel 13, tweede lid, van het Besluit
      uitbreiding en beperking kring verzekerden volksverzekeringen 1989 aangewezen volkenrechtelijke organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0004093/2000-01-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0007795
  - number: 2c
    text: |-
      Van de verzekering ingevolge [artikel 3, eerste lid, onder a, van de Ziekenfondswet][ref1] is uitgezonderd
      degene die onmiddellijk voorafgaand aan 1 januari 1994 een invaliditeitspensioen in de zin van
      [artikel 7, eerste lid, onder b, van de Wet privatisering Spoorwegpensioenfonds][ref2] genoot en die
      onmiddellijk voorafgaand aan de inwerkingtreding van dit artikel ingevolge artikel 2, achtste, tiende of elfde
      lid, van het Aanwijzingsbesluit verplicht-verzekerden [Ziekenfondswet][ref3] niet verzekerd was ingevolge de
      [Ziekenfondswet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006319#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0002460
      [ref4]: https://wetten.overheid.nl/BWBR0002460
    url: https://wetten.overheid.nl/BWBR0004093/2000-01-01#Artikel2c
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0006319
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0002460
      - id: ref4
        bwb_id: BWBR0002460
  - number: '3'
    text: |-
      De verzekering ingevolge [artikel 3d, eerste lid, van de Ziekenfondswet][ref1] eindigt met ingang van de eerste dag
      van de maand waarin de verzekerde de leeftijd van 65 jaar bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3d
    url: https://wetten.overheid.nl/BWBR0004093/2000-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 3d
  - number: '4.1'
    text: |-
      Van de verzekeringsduur als genoemd in [artikel 3d, eerste lid, van de Ziekenfondswet][ref1] is uitgezonderd:


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel3d
    url: https://wetten.overheid.nl/BWBR0004093/2000-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: 3d
  - number: 4.1.a
    text: |-
      de periode in enig kalenderjaar, waarin geen belastingplicht bestaat in de zin van de Wet op de inkomstenbelasting
      1964;
    url: https://wetten.overheid.nl/BWBR0004093/2000-01-01#Artikel4
  - number: 4.1.b
    text: |-
      de periode in enig kalenderjaar, waarin buitenlandse belastingplicht bestaat in de zin van
      de Wet op de inkomstenbelasting 1964 gedurende de periode dat geen verzekering ingevolge
      [artikel 3, eerste lid, aanhef en onder a, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1]
      bestaat;


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel3
    url: https://wetten.overheid.nl/BWBR0004093/2000-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '3'
  - number: 4.1.c
    text: |-
      de periode in enig kalenderjaar, waarin binnenlandse belastingplicht bestaat in de zin van de
      Wet op de inkomstenbelasting 1964 zonder dat op enig moment in die periode verzekering ingevolge
      [artikel 3, eerste lid, aanhef en onder a, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref1]
      bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0008656#Artikel3
    url: https://wetten.overheid.nl/BWBR0004093/2000-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008656
        artikel: '3'
  - number: '4.2'
    text: |-
      Onze Minister kan in overeenstemming met Onze Minister van Sociale Zaken en Werkgelegenheid en Onze Minister van
      Financiën, nadere regels stellen ter uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0004093/2000-01-01#Artikel4
  - number: '5'
    text: 'Dit besluit kan worden aangehaald als: Besluit beperking kring verzekerden Ziekenfondswet.'
    url: https://wetten.overheid.nl/BWBR0004093/2000-01-01#Artikel5
