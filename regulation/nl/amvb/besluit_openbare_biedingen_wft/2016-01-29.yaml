  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel1
  - number: 1.a
    text: |-
      wet: [Wet op het financieel toezicht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: 1.b
    text: |-
      volledig bod: openbaar bod dat de geboden prijs of ruilverhouding vermeldt en dat strekt tot verwerving van alle
      effecten van de doelvennootschap van dezelfde categorie of klasse, niet zijnde een verplicht bod;
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel1
  - number: 1.c
    text: |-
      partieel bod: openbaar bod dat de geboden prijs of ruilverhouding vermeldt en dat strekt tot verwerving van minder
      dan 30 procent van de stemrechten in de algemene vergadering van de doelvennootschap;
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel1
  - number: 1.d
    text: |-
      tenderbod: openbaar bod waarbij de bieder de rechthebbenden van effecten van de doelvennootschap uitnodigt om die
      effecten tegen een door de rechthebbenden te bepalen tegenprestatie aan de bieder aan te bieden en dat strekt tot
      verwerving van minder dan 30 procent van de stemrechten in de algemene vergadering van de doelvennootschap;
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel1
  - number: 1.e
    text: |-
      verplicht bod: openbaar bod dat op grond van [artikel 5:70, eerste lid van de wet][ref1], wordt uitgebracht
      of dient te worden uitgebracht of een openbaar bod dat op grond van het recht van een andere lidstaat wordt
      uitgebracht of dient te worden uitgebracht en terzake waarvan de Autoriteit Financiële Markten op grond van
      [artikel 5:74, tweede lid, van de wet][ref2] het biedingsbericht kan goedkeuren.


