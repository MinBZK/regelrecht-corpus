        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0022511
        artikel: '22'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: '32.1'
    text: |-
      Indien voorafgaand aan de inwerkingtreding van dit besluit een openbaar bod is aangekondigd, blijft op dat openbaar
      bod het recht van toepassing zoals dat gold op het tijdstip waarop het bod is aangekondigd. Het in de vorige volzin
      bedoelde recht blijft van toepassing tot en met het tijdstip waarop een openbare mededeling omtrent het besluit van
      de bieder om het openbaar bod niet uit te brengen wordt gedaan of het tijdstip waarop een op grond van dat recht
      uitgebracht openbaar bod met inachtneming van dat recht gestand is gedaan en levering en betaling van de aangeboden
      effecten heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel32
  - number: '32.2'
    text: |-
      Indien voorafgaand aan de inwerkingtreding van dit besluit een openbaar bod is aangekondigd en na de
      inwerkingtreding van dit besluit door een derde een openbaar bod wordt aangekondigd, of na het aankondigen van
      dat openbaar bod door deze bieder of die derde een nieuw openbaar bod wordt aangekondigd op dezelfde effecten van
      een doelvennootschap, is op ieder, hiervoor genoemd (aangekondigd) openbaar bod het recht van toepassing zoals dat
      gold op het tijdstip waarop het eerstbedoelde bod is aangekondigd. Het in de vorige volzin bedoelde recht blijft
      van toepassing tot en met het tijdstip waarop met betrekking tot ieder hiervoor genoemd (aangekondigd) openbaar
      bod een openbare mededeling is gedaan omtrent het besluit van de bieder om het openbaar bod niet uit te brengen
      of met inachtneming van het op dat openbaar bod toepasselijke recht gestanddoening en levering en betaling van de
      aangeboden effecten heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel32
  - number: '33'
    text: |-
      De bedragen, bedoeld in [artikel 28][ref1] worden in afwijking van
      [artikel 9 van het Besluit bekostiging financieel toezicht][ref2] in het jaar 2007 vastgesteld binnen vier weken na
      inwerkingtreding van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0022511#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0007708#Artikel9
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel33
    references:
