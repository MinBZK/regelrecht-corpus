  - number: 2a.1
    text: |-
      Op verzoek van een uitgevende instelling waarvan effecten zijn toegelaten tot de handel op een gereglementeerde
      markt waarvoor een vergunning als bedoeld in [artikel 5:26, eerste lid, van de wet][ref1] is verleend, kan de
      Autoriteit Financiële Markten degene die terzake van de uitgevende instelling informatie openbaar heeft gemaakt
      waaruit de indruk kan ontstaan dat hij overweegt om een openbaar bod op die effecten voor te bereiden, ertoe
      verplichten:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel5
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '5'
  - number: 2a.1.a
    text: |-
      binnen 6 weken nadat hij door de Autoriteit Financiële Markten van de verplichting in kennis is gesteld een
      openbare mededeling te doen waarin hij een openbaar bod, niet zijnde een verplicht bod, aankondigt als bedoeld in
      [artikel 5, eerste of tweede lid][ref1], op die effecten of binnen diezelfde termijn een openbare mededeling te
      doen die inhoudt dat hij geen voornemen heeft tot het aankondigen of uitbrengen van een openbaar bod; en


      [ref1]: https://wetten.overheid.nl/BWBR0022511#Artikel5
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0022511
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2a.1.b
    text: |-
      onverwijld nadat hij door de Autoriteit Financiële Markten in kennis is gesteld van de verplichting, bedoeld in
      onderdeel a, hierover een openbare mededeling te doen.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel2a
  - number: 2a.2
    text: |-
      Indien de openbare mededeling, bedoeld in het eerste lid, onderdeel a, inhoudt dat degene die de mededeling doet
      geen voornemen heeft tot het aankondigen of uitbrengen van een openbaar bod, is het hem en de personen met wie hij
      in onderling overleg handelt, gedurende 6 maanden na die openbare mededeling niet toegestaan een openbaar bod aan
      te kondigen of uit te brengen op de in het eerste lid bedoelde effecten.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel2a
  - number: 2a.3
    text: |-
      De Autoriteit Financiële Markten geeft gevolg aan het verzoek, bedoeld in het eerste lid, indien de verzoeker
      nadelige gevolgen ondervindt van het uitblijven van duidelijkheid omtrent het al dan niet aankondigen of uitbrengen
      van een openbaar bod.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel2a
  - number: 2a.4
    text: |-
      Indien gedurende de termijn, bedoeld in het tweede lid, door een derde een openbaar bod wordt aangekondigd op de in
      het eerste lid bedoelde effecten, is het in het tweede lid bedoelde verbod niet langer van toepassing.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel2a
  - number: 2a.5
    text: |-
      Indien degene die verplicht is tot het doen van de openbare mededeling, bedoeld in het eerste lid, onderdeel a,
      niet aan die verplichting voldoet, is het hem en de personen met wie hij in onderling overleg handelt gedurende
      9 maanden niet toegestaan een openbaar bod aan te kondigen of uit te brengen op de in het eerste lid bedoelde
      effecten.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel2a
  - number: 2a.6
    text: |-
      De termijn, bedoeld in het vijfde lid, vangt aan 6 weken nadat degene die verplicht is tot het doen van de openbare
      mededeling, bedoeld in het eerste lid, onderdeel a, daarvan door de Autoriteit Financiële Markten in kennis is
      gesteld.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel2a
  - number: 2a.7
    text: |-
      Indien gedurende de termijn, bedoeld in het vijfde lid, door een derde een openbaar bod wordt aangekondigd op de in
      het eerste lid bedoelde effecten is het in het vijfde lid bedoelde verbod niet langer van toepassing.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel2a
  - number: 2a.8
    text: |-
      Het is degene die verplicht is tot het doen van de openbare mededelingen en personen met wie hij in onderling
      overleg handelt niet toegestaan zich gedurende de periode, bedoeld in het tweede en vijfde lid, in de positie te
      brengen dat zij overwegende zeggenschap verkrijgen in de uitgevende instelling.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel2a
  - number: 2a.9
    text: |-
      Indien het achtste lid wordt overtreden kan de ondernemingskamer van gerechtshof Amsterdam op verzoek van
      de doelvennootschap een bevel geven aan degene op wie de overwegende zeggenschap rust om binnen een door de
      ondernemingskamer te bepalen periode het belang dat hem de overwegende zeggenschap verschaft af te bouwen.
      [Artikel 5:73, tweede lid, vierde, vijfde en zesde lid, van de wet][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel5
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '5'
  - number: '3.1'
    text: |-
      Een openbaar bod is, onder gelijke voorwaarden, gericht tot alle rechthebbenden van effecten van eenzelfde
      categorie of klasse.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel3
  - number: '3.2'
    text: |-
      De bieder kan van het openbaar bod uitsluiten effecten van de desbetreffende categorie of klasse die op
      het tijdstip van de aankondiging van het bod nog niet waren toegelaten tot de handel op de desbetreffende
      gereglementeerde markt.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel3
  - number: '3.3'
    text: |-
      Vanaf het tijdstip waarop een openbaar bod is aangekondigd tot en met het tijdstip waarop een openbare mededeling
      is gedaan omtrent de gestanddoening, is het de bieder of personen met wie hij in onderling overleg handelt niet
      toegestaan een ander openbaar bod aan te kondigen of uit te brengen op dezelfde categorie of klasse effecten van
      de doelvennootschap.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel3
  - number: '3.4'
    text: |-
      Een openbaar bod is onherroepelijk vanaf het tijdstip waarop de bieder het bod heeft uitgebracht overeenkomstig
      [artikel 10, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022511#Artikel10
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0022511
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '4.1'
    text: |-
      Indien ingevolge dit besluit een openbare mededeling is vereist wordt deze openbare mededeling
      onverwijld en overeenkomstig het bij of krachtens [artikel 5:25i, tweede lid][ref1],
      juncto a[rtikel 5:25m, eerste, tweede, derde en zesde lid, van de wet][ref2] bepaalde
      gedaan. [Artikel 5:25i, derde en vierde lid, van de wet][ref3] en [artikel 4][ref4] en
      [5 van het Besluit uitvoeringsrichtlijn transparantie uitgevende instellingen Wft][ref5] zijn van overeenkomstige
      toepassing.


