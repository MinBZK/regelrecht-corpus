  - number: '5.1'
    text: |-
      Een bieder en een doelvennootschap kondigen, ieder voor zover het hem of haar aangaat, een openbaar bod, niet
      zijnde een verplicht bod, aan door middel van een openbare mededeling, uiterlijk zodra tussen de bieder en de
      doelvennootschap, al dan niet voorwaardelijke, overeenstemming is bereikt over het uit te brengen openbaar bod. De
      mededeling bevat de namen van de bieder en de doelvennootschap en, voor zover van toepassing, de voorgenomen prijs
      of ruilverhouding en de op dat moment reeds vastgestelde voorwaarden waarvan de verplichting tot het uitbrengen of
      nakomen van het openbaar bod afhankelijk zal worden gesteld.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel5
  - number: '5.2'
    text: |-
      Een openbaar bod, niet zijnde een verplicht bod, is aangekondigd indien een bieder zonder, al dan niet
      voorwaardelijke, overeenstemming te hebben bereikt, concrete informatie over de inhoud van het voorgenomen openbaar
      bod openbaar heeft gemaakt, tenzij de instelling die de effecten heeft uitgegeven waarop het voorgenomen openbaar
      bod betrekking heeft onverwijld na openbaarmaking van de concrete informatie door de bieder door middel van een
      openbare mededeling meedeelt dat zij met de bieder overleg voert. Voor de toepassing van dit lid is in ieder
      geval concrete informatie openbaar gemaakt indien de bieder de naam noemt van de instelling die de effecten heeft
      uitgegeven waarop het voorgenomen openbaar bod betrekking heeft in combinatie met:
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel5
  - number: 5.2.a
    text: een voorgenomen prijs of ruilverhouding; of
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel5
  - number: 5.2.b
    text: een concreet omschreven voorgenomen tijdschema voor het verloop van het voorgenomen openbaar bod.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel5
  - number: '5.3'
    text: 'Een verplicht bod is aangekondigd, indien:'
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel5
  - number: 5.3.a
    text: |-
      een aankondiging als bedoeld in [artikel 5:70, eerste lid, van de wet][ref1] is gedaan;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel5
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '5'
  - number: 5.3.b
    text: |-
      een door de ondernemingskamer van gerechtshof Amsterdam getroffen maatregel als bedoeld in
      [artikel 5:73, eerste lid, van de wet][ref1], onherroepelijk is geworden; of


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel5
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '5'
  - number: 5.3.c
    text: |-
      naar het recht van een andere lidstaat vaststaat dat een openbaar bod verplicht dient te worden
      uitgebracht en daarover door de doelvennootschap een openbare mededeling is gedaan op grond van
      [artikel 5:25i, tweede lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel5
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '5'
  - number: '5.4'
    text: |-
      Vanaf het tijdstip waarop een openbaar bod is aangekondigd tot en met het tijdstip waarop het is uitgebracht
      of waarop een openbare mededeling is gedaan omtrent het niet uitbrengen van het bod, doen de bieder en de
      doelvennootschap, ieder met betrekking tot door henzelf verrichte transacties, een openbare mededeling over iedere
      door hen verrichte transactie in de effecten waarop het openbaar bod betrekking heeft of de effecten die in ruil
      worden aangeboden en van iedere met betrekking tot die effecten door hen gesloten overeenkomst. De mededeling
      bevat informatie over de hoeveelheid en categorie of klasse van deze effecten, de daarvoor geldende voorwaarden,
      waaronder de prijs of ruilverhouding, en de omvang van de bestaande onderlinge rechtstreekse of middellijke
      kapitaaldeelnemingen.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel5
  - number: '5.5'
    text: |-
      De mededeling, bedoeld in het vierde lid, wordt telkens onverwijld gedaan nadat de betrokken transactie of
      overeenkomst is verricht onderscheidenlijk is gesloten, met dien verstande dat ten hoogste een keer per dag een
      mededeling hoeft te worden gedaan.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel5
  - number: 5a
    text: |-
      Uiterlijk bij de aankondiging van een verplicht bod doet de bieder een openbare mededeling over de wijze van
      berekenen en de hoogte van de te verwachten billijke prijs, bedoeld in [artikel 5:80a van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel5
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '5'
  - number: 5b.1
    text: |-
      Indien een verplicht bod is aangekondigd, vervalt een reeds door de bieder uitgebracht openbaar bod op dezelfde
      categorie of klasse effecten van rechtswege, tenzij de bieder door middel van een openbare mededeling meedeelt dat
      het uitgebrachte bod wordt voortgezet als een verplicht bod.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel5b
  - number: 5b.2
    text: |-
      Indien in de openbare mededeling, bedoeld in het eerste lid, is vermeld dat het uitgebrachte bod wordt voortgezet
      als een verplicht bod vervallen van rechtswege de voorwaarden, bedoeld in [artikel 12][ref1]. Indien de billijke
      prijs, bedoeld in [artikel 5:80a van de wet][ref2], hoger is dan de voorgenomen of geboden prijs of ruilverhouding
      van het oorspronkelijke openbaar bod, verhoogt de bieder de prijs of ruilverhouding tot de billijke prijs.
      [Artikel 15, vierde lid, tweede volzin][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022511#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0022511#Artikel15
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0022511
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0022511
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 5b.3
    text: |-
      Indien de in het oorspronkelijk uitgebrachte openbaar bod geboden prijs hoger is dan de billijke prijs, vindt geen
      aanpassing van de prijs plaats.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel5b
  - number: 5b.4
    text: |-
      Indien de bieder een openbare mededeling doet als bedoeld in het eerste lid, vangt de in
      [artikel 14, eerste lid][ref1], bedoelde aanmeldingstermijn in afwijking van artikel 14, tweede lid, niet eerder
      aan dan op de eerste werkdag volgend op het doen van de openbare mededeling.


      [ref1]: https://wetten.overheid.nl/BWBR0022511#Artikel14
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0022511
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 5b.5
    text: |-
      Rechthebbenden op effecten die voorafgaand aan de openbare mededeling, bedoeld in het eerste lid, hun effecten
      hebben aangemeld kunnen deze aanmelding binnen zeven werkdagen na de openbare mededeling herroepen.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel5b
  - number: 5b.6
    text: |-
      De openbare mededeling, bedoeld in het eerste lid, bevat in elk geval een opsomming van feiten, omstandigheden en
      gebeurtenissen die tot het verplichte bod hebben geleid en, voor zover van toepassing,:
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel5b
  - number: 5b.6.a
    text: informatie over het vervallen van voorwaarden;
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel5b
  - number: 5b.6.b
    text: de aangepaste geboden prijs of ruilverhouding;
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel5b
  - number: 5b.6.c
    text: |-
      de wijze waarop de bieder zorg draagt dat hij zal voldoen aan [artikel 15, vierde lid, tweede volzin][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0022511#Artikel15
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0022511
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 5b.6.d
    text: de aangepaste aanmeldingstermijn.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel5b
  - number: '6.1'
    text: |-
      Indien de voorgenomen prijs of ruilverhouding of, in geval van een partieel bod of een tenderbod, het voorgenomen
      percentage of aantal van de effecten tot de verkrijging waarvan het openbaar bod strekt, na aankondiging definitief
      is vastgesteld of gewijzigd, doen de bieder en de doelvennootschap, ieder voor zover het hem of haar aangaat, een
      openbare mededeling hierover, onder vermelding van deze prijs of ruilverhouding of dit percentage of aantal.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel6
  - number: '6.2'
    text: |-
      Indien door een doelvennootschap na aankondiging van een openbaar bod effecten worden uitgegeven of rechten tot het
      nemen of verkrijgen van door de doelvennootschap uit te geven effecten worden toegekend, doet de doelvennootschap
      een openbare mededeling hierover, onder vermelding van de naam van degene die de bedoelde effecten of rechten
      verwerft, voorzover deze naam bij haar bekend is, het nominale bedrag daarvan en de prijs of uitgiftekoers. De
      eerste volzin is van toepassing tot en met het tijdstip waarop overeenkomstig [artikel 16][ref1] een openbare
      mededeling wordt gedaan over de gestanddoening of de niet-gestanddoening van het openbaar bod, dan wel waarop
      overeenkomstig [artikel 7, eerste lid][ref2], een openbare mededeling wordt gedaan over het niet indienen van een
      aanvraag tot goedkeuring van het biedingsbericht.


      [ref1]: https://wetten.overheid.nl/BWBR0022511#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0022511#Artikel7
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0022511
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2.5'
      - id: ref2
        bwb_id: BWBR0022511
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '7.1'
    text: 'De bieder doet binnen vier weken na de aankondiging van het bod een openbare mededeling, inhoudende dat:'
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel7
  - number: 7.1.a
    text: |-
      hij binnen een door hem te bepalen en te noemen periode een aanvraag tot goedkeuring van het biedingsbericht
      indient bij de Autoriteit Financiële Markten; of
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel7
  - number: 7.1.b
    text: hij geen aanvraag tot goedkeuring van het biedingsbericht zal indienen.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel7
  - number: '7.2'
    text: |-
      Ingeval van een verplicht bod, doet de bieder, in afwijking van het eerste lid, binnen vier weken na de
      aankondiging van het bod een openbare mededeling inhoudende dat hij binnen een door hem te bepalen en te noemen
      periode een aanvraag tot goedkeuring van het biedingsbericht indient bij de Autoriteit Financiële Markten.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel7
  - number: '7.3'
    text: |-
      De in het eerste lid, onderdeel a, en in het tweede lid bedoelde door de bieder te bepalen en te benoemen
      periode bedraagt, gerekend vanaf de aankondiging van het bod, ten hoogste 12 weken. Indien de bieder er
      niet in slaagt binnen de door hem benoemde periode de aanvraag tot goedkeuring van het biedingsbericht in
      te dienen, doet hij daarvan onverwijld een openbare mededeling. De in de eerste volzin genoemde uiterste
      termijn blijft onverkort van toepassing. Aan de verplichting tot het doen van de openbare mededeling, bedoeld
      in de tweede volzin, is voldaan, indien terzake van hetzelfde feit door de bieder een mededeling is gedaan
      op grond van [artikel 4, derde lid][ref1], of informatie algemeen verkrijgbaar is gesteld op grond van
      [artikel 5:25i van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022511#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel5
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0022511
        artikel: '4'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '5'
  - number: '7.4'
    text: |-
      De bieder draagt er zorg voor dat hij uiterlijk op het tijdstip van indiening van de aanvraag tot goedkeuring van
      het biedingsbericht, bedoeld in het eerste en tweede lid, een vergoeding in geld kan opbrengen of alle redelijke
      maatregelen heeft getroffen om enige andere vorm van vergoeding te kunnen verstrekken om het bod gestand te kunnen
      doen. Wanneer de bieder de genoemde vergoeding kan opbrengen of de genoemde maatregelen heeft getroffen, doet hij
      een openbare mededeling hierover. In de mededeling omschrijft de bieder nauwkeurig op welke wijze door hem zorg
      wordt gedragen voor het kunnen opbrengen van de vergoeding of welke maatregelen door hem zijn getroffen om enige
      andere vorm van vergoeding te kunnen verstrekken.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel7
  - number: '7.5'
    text: |-
      De bieder die in verband met de vergoeding, bedoeld in het vierde lid, een algemene vergadering dient te houden,
      heeft de in het vorige lid genoemde maatregelen getroffen, indien hij uiterlijk op het tijdstip van indiening van
      de aanvraag tot goedkeuring van het biedingsbericht een openbare mededeling doet dat een algemene vergadering zal
      plaatsvinden. De vergadering wordt ten minste zeven werkdagen voor het einde van de aanmeldingstermijn gehouden.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel7
  - number: '7.6'
    text: |-
      Indien de algemene vergadering, bedoeld in het vijfde lid, heeft plaatsgevonden, doet de bieder een openbare
      mededeling over de uitkomsten daarvan en over de gevolgen van deze uitkomsten voor het openbaar bod. Indien de
      bieder in verband met de in de eerste volzin bedoelde uitkomsten gelijktijdig een openbare mededeling als bedoeld
      in [artikel 12, derde lid][ref1], doet, kan de in de eerste volzin bedoelde mededeling achterwege blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0022511#Artikel12
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0022511
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '7.7'
    text: |-
      Indien de bieder een openbare mededeling als bedoeld in het eerste lid, onderdeel a, heeft gedaan maar geen bod
      uitbrengt overeenkomstig [artikel 10, eerste lid][ref1], is het hem en personen met wie hij in onderling overleg
      handelt gedurende 6 maanden na het uiterlijke tijdstip voor indiening van de aanvraag tot goedkeuring van het
      biedingsbericht niet toegestaan een openbaar bod aan te kondigen of uit te brengen op effecten van dezelfde
      uitgevende instelling Artikel 2a, vierde lid, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022511#Artikel10
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0022511
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '7.8'
    text: |-
      Indien de bieder een openbare mededeling als bedoeld in het eerste lid, onderdeel b, heeft gedaan, is het
      hem en personen met wie hij in onderling overleg handelt gedurende 6 maanden na de openbare mededeling niet
      toegestaan een openbaar bod aan te kondigen of uit te brengen op effecten van dezelfde uitgevende instelling
      [Artikel 2a, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022511#Artikel2a
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0022511
        artikel: 2a
        hoofdstuk: '1'
  - number: '7.9'
    text: |-
      Indien de bieder na de aankondiging van het bod geen aanvraag tot goedkeuring van het biedingsbericht indient,
      is het hem en personen met wie hij in onderling overleg handelt gedurende 6 maanden na het uiterlijke tijdstip
      voor indiening van de aanvraag tot goedkeuring van het biedingsbericht niet toegestaan een openbaar bod aan te
      kondigen of uit te brengen op effecten van dezelfde uitgevende instelling. [Artikel 2a, vierde lid][ref1], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022511#Artikel2a
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0022511
        artikel: 2a
        hoofdstuk: '1'
  - number: '7.10'
    text: |-
      Het is de bieder en personen met wie hij in onderling overleg handelt niet toegestaan zich gedurende de periode,
      bedoeld in het zevende, achtste en negende lid, in de positie te brengen dat zij overwegende zeggenschap verkrijgen
      in de uitgevende instelling.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel7
  - number: '7.11'
    text: |-
      Indien het tiende lid wordt overtreden kan de ondernemingskamer van gerechtshof Amsterdam op verzoek van
      de doelvennootschap een bevel geven aan degene op wie de overwegende zeggenschap rust om binnen een door de
      ondernemingskamer te bepalen periode het belang dat hem de overwegende zeggenschap verschaft af te bouwen.
      [Artikel 5:73, tweede lid, vierde, vijfde en zesde lid, van de wet][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel5
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '5'
  - number: '8.1'
    text: |-
      De Autoriteit Financiële Markten keurt het biedingsbericht goed, indien in het biedingsbericht alle gegevens zijn
      opgenomen die voor een redelijk geïnformeerde en zorgvuldig handelende persoon van belang zijn voor het vormen van
      een verantwoord oordeel over het openbaar bod, waaronder:
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel8
  - number: 8.1.a
    text: |-
      in geval van een volledig bod, de gegevens, bedoeld in de [bijlagen A][ref1] en [B][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0022511
      [ref2]: https://wetten.overheid.nl/BWBR0022511
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0022511
      - id: ref2
        bwb_id: BWBR0022511
  - number: 8.1.b
    text: |-
      in geval van een partieel bod, de gegevens, bedoeld in de [bijlagen A][ref1] en [C][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0022511
      [ref2]: https://wetten.overheid.nl/BWBR0022511
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0022511
      - id: ref2
        bwb_id: BWBR0022511
  - number: 8.1.c
    text: |-
      in geval van een tenderbod, de gegevens, bedoeld in de [bijlagen A][ref1] en [D][ref2]; of


      [ref1]: https://wetten.overheid.nl/BWBR0022511
      [ref2]: https://wetten.overheid.nl/BWBR0022511
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0022511
      - id: ref2
        bwb_id: BWBR0022511
  - number: 8.1.d
    text: |-
      in geval van een verplicht bod, de gegevens, bedoeld in de [bijlagen A][ref1] en [E][ref2]; en


      [ref1]: https://wetten.overheid.nl/BWBR0022511
      [ref2]: https://wetten.overheid.nl/BWBR0022511
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0022511
      - id: ref2
        bwb_id: BWBR0022511
  - number: '8.2'
    text: |-
      Indien een bod uitsluitend of mede strekt tot overneming van effecten in ruil voor door de bieder of door een
      andere vennootschap dan de bieder uitgegeven effecten, keurt de Autoriteit Financiële Markten het biedingsbericht
      goed, indien het naast de toepasselijke gegevens, bedoeld in het eerste lid, de in [bijlage F][ref1] opgenomen
      gegevens bevat en de gegevens niet met elkaar in strijd zijn of in tegenspraak zijn met andere bij de Autoriteit
      Financiële Markten aanwezige informatie omtrent de doelvennootschap of de bieder en worden gepresenteerd in een
      vorm die voor een redelijk geïnformeerde en zorgvuldig handelende persoon begrijpelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0022511
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0022511
  - number: '9.1'
    text: |-
      Indien de Autoriteit Financiële Markten het biedingsbericht heeft goedgekeurd, verstrekt zij op verzoek van de
      bieder aan de toezichthoudende instantie van een andere lidstaat waar de desbetreffende effecten tot de handel op
      een gereglementeerde markt zijn toegelaten, een verklaring dat het biedingsbericht is opgesteld in overeenstemming
      met [richtlijn nr. 2004/25/EG](32004L0025) van het Europees Parlement en de Raad van de Europese Unie van 21 april
      2004 betreffende het openbaar overnamebod (PbEU L 142), alsmede een afschrift van het goedgekeurde biedingsbericht.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel9
  - number: '9.2'
    text: |-
      De Autoriteit Financiële Markten verstrekt de verklaring, bedoeld in het eerste lid, en het afschrift van het
      goedgekeurde biedingsbericht binnen drie werkdagen na ontvangst van het verzoek. Indien het verzoek wordt gedaan
      voordat goedkeuring is verleend, verstrekt de Autoriteit Financiële Markten de verklaring binnen een werkdag nadat
      de goedkeuring is verleend.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel9
  - number: 9a
    text: |-
      Indien de Autoriteit Financiële Markten het biedingsbericht heeft goedgekeurd, maar de bieder geen bod
      uitbrengt overeenkomstig [artikel 10, eerste lid][ref1], is het hem en personen met wie hij in onderling
      overleg handelt gedurende 6 maanden na de openbare mededeling, bedoeld in [artikel 5:78 van de wet][ref2], niet
      toegestaan een openbaar bod aan te kondigen of uit te brengen op effecten van dezelfde uitgevende instelling
      [Artikel 2a, vierde lid][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022511#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0022511#Artikel2a
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0022511
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0022511
        artikel: 2a
        hoofdstuk: '1'
  - number: '10.1'
    text: |-
      De bieder brengt zijn bod uit door het goedgekeurde biedingsbericht algemeen verkrijgbaar te stellen door middel
      van:
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel10
  - number: 10.1.a
    text: een bekendmaking in een landelijk verspreid dagblad;
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel10
  - number: 10.1.b
    text: |-
      een drukwerk dat kosteloos kan worden verkregen ten kantore van de houder van iedere gereglementeerde markt waar de
      effecten waarop het openbaar bod wordt gedaan, tot de handel zijn toegelaten;
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel10
  - number: 10.1.c
    text: plaatsing op zijn website of op die van de doelvennootschap;
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel10
  - number: 10.1.d
    text: |-
      plaatsing op de website van de houder van iedere gereglementeerde markt waar de effecten tot de handel zijn
      toegelaten; of
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel10
  - number: 10.1.e
    text: plaatsing op de website van de Autoriteit Financiële Markten, indien deze mogelijkheid wordt geboden.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel10
  - number: '10.2'
    text: |-
      Indien het biedingsbericht op andere wijze dan als bedoeld in het eerste lid, aanhef en onderdeel b, algemeen
      verkrijgbaar is gesteld, verstrekt de bieder aan een ieder die daarom verzoekt kosteloos een afschrift van het
      biedingsbericht.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel10
  - number: '10.3'
    text: |-
      De bieder doet een openbare mededeling over het algemeen verkrijgbaar stellen van het biedingsbericht, onder
      vermelding van de vindplaats.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel10
  - number: '10.4'
    text: |-
      De bieder stelt onverwijld na de algemeenverkrijgbaarstelling van het biedingsbericht de vertegenwoordigers van
      haar werknemers of, bij ontstentenis van die vertegenwoordigers, de werknemers zelf van het openbaar bod in kennis,
      onder gelijktijdige terbeschikkingstelling van het biedingsbericht.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel10
  - number: '11.1'
    text: |-
      Indien een bieder voornemens is een openbaar bod uit te brengen op effecten welke zijn toegelaten tot de handel
      op een in Nederland gelegen of functionerende gereglementeerde markt en de Autoriteit Financiële Markten niet
      ingevolge [artikel 5:74, tweede lid, van de wet][ref1] bevoegd is tot goedkeuring van een biedingsbericht, zendt
      de bieder voorafgaand aan het uitbrengen van het bod een door de toezichthoudende instantie van een andere lidstaat
      goedgekeurd biedingsbericht toe aan de Autoriteit Financiële Markten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel5
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '5'
  - number: '11.2'
    text: |-
      Terzake van een openbaar bod als bedoeld in het eerste lid kan de Autoriteit Financiële Markten de bieder door het
      geven van een aanwijzing verplichten aanvullende informatie in het biedingsbericht of in een aanvullend document
      op te nemen, indien die informatie specifiek is voor de Nederlandse financiële markten en betrekking heeft op de
      formaliteiten die moeten worden vervuld om het openbaar bod te aanvaarden of om de tegenprestatie te ontvangen
      die bij de gestanddoening van het openbaar bod verschuldigd is, dan wel betrekking heeft op voorschriften van
      belastingrecht die van toepassing zullen zijn op de tegenprestatie die aan de houders van effecten wordt geboden.
      De Autoriteit Financiële Markten besluit hiertoe uiterlijk vijf werkdagen na ontvangst van het biedingsbericht.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel11
  - number: '11.3'
    text: |-
      Indien het biedingsbericht, bedoeld in het eerste lid, is opgesteld in een andere dan de Nederlandse of de Engelse
      taal, stelt de bieder gelijktijdig met het uitbrengen van het openbaar bod een Nederlandse vertaling algemeen
      verkrijgbaar overeenkomstig artikel 10. Indien het biedingsbericht is opgesteld in de Engelse taal, stelt de bieder
      gelijktijdig met het uitbrengen van het openbaar bod een Nederlandse samenvatting, die ten minste een verwijzing
      bevat naar het onderliggende biedingsbericht en de gegevens, bedoeld in de onderdelen 4, 5, 6, 9 en 10 van
      paragraaf 1 van [bijlage A][ref1], algemeen verkrijgbaar overeenkomstig [artikel 10][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022511
      [ref2]: https://wetten.overheid.nl/BWBR0022511#Artikel10
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0022511
      - id: ref2
        bwb_id: BWBR0022511
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '12.1'
    text: |-
      De bieder deelt de voorwaarden waarvan hij de nakoming van het openbaar bod afhankelijk stelt, uiterlijk
      gelijktijdig met het uitbrengen van het bod openbaar mede. Deze voorwaarden maken onderdeel uit van het openbaar
      bod.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel12
  - number: '12.2'
    text: |-
      De bieder stelt de verplichting tot nakoming niet afhankelijk van een voorwaarde waarvan de vervulling afhankelijk
      is van zijn wil. De bieder formuleert met het oog daarop een voorwaarde op zodanige wijze dat deze duidelijk en,
      waar mogelijk, objectief meetbaar is.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel12
  - number: '12.3'
    text: |-
      Zodra is komen vast te staan dat een door de bieder gestelde voorwaarde niet wordt vervuld, doet de bieder een
      openbare mededeling hierover, alsmede over zijn beslissing of op grond van het niet vervullen van de voorwaarde het
      openbaar bod vervalt.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel12
  - number: '12.4'
    text: |-
      Indien de openbare mededeling, bedoeld in het derde lid, het besluit bevat dat het openbaar bod vervalt, is het
      de bieder en personen met wie hij in onderling overleg handelt gedurende 6 maanden na de openbare mededeling niet
      toegestaan een openbaar bod aan te kondigen of uit te brengen op effecten van dezelfde uitgevende instelling.
      [Artikel 2a, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022511#Artikel2a
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0022511
        artikel: 2a
        hoofdstuk: '1'
  - number: '13.1'
    text: |-
      Vanaf het tijdstip waarop het openbaar bod is uitgebracht tot en met het tijdstip waarop een openbare
      mededeling is gedaan omtrent de gestanddoening of het tijdstip waarop een mededeling als bedoeld in
      [artikel 17, vierde lid][ref1], is gedaan, doen de bieder en de doelvennootschap, ieder met betrekking tot door
      henzelf verrichte transacties, een openbare mededeling over iedere door hen verrichte transactie in de effecten
      waarop het openbaar bod betrekking heeft of de effecten die in ruil worden aangeboden en van iedere met betrekking
      tot die effecten door hen gesloten overeenkomst. In de mededeling wordt melding gedaan van de hoeveelheid en
      categorie of klasse van deze effecten, de daarvoor geldende voorwaarden, waaronder de prijs of ruilverhouding, en
      de omvang van de bestaande onderlinge rechtstreekse of middellijke kapitaaldeelnemingen.


      [ref1]: https://wetten.overheid.nl/BWBR0022511#Artikel17
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0022511
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: '13.2'
    text: |-
      Op de mededeling, bedoeld in het eerste lid, is [artikel 5, vijfde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022511#Artikel5
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0022511
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '14.1'
    text: De bieder die een openbaar bod uitbrengt, stelt een aanmeldingstermijn.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel14
  - number: '14.2'
    text: |-
      De aanmeldingstermijn vangt niet eerder aan dan op de eerste werkdag volgend op het uitbrengen van het openbaar
      bod. De aanmeldingstermijn vangt niet later aan dan op de derde werkdag volgend op de termijn, bedoeld in
      [artikel 5:78 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel5
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '5'
  - number: '14.3'
    text: |-
      De aanmeldingstermijn van een volledig bod of een verplicht bod is, gerekend van de dag waarop de gelegenheid tot
      aanmelding is opengesteld tot en met de dag waarop de gelegenheid tot aanmelding wordt gesloten, niet korter dan
      acht weken.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel14
  - number: '14.4'
    text: |-
      De aanmeldingstermijn van een partieel bod of een tenderbod is, gerekend vanaf de dag waarop de gelegenheid tot
      aanmelding is opengesteld tot en met de dag waarop de gelegenheid tot aanmelding wordt gesloten, niet korter dan
      twee weken.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel14
  - number: '14.5'
    text: |-
      De aanmeldingstermijn is niet langer dan tien weken, gerekend van de dag waarop de gelegenheid tot aanmelding is
      opengesteld tot en met de dag waarop de gelegenheid tot aanmelding wordt gesloten.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel14
  - number: '15.1'
    text: |-
      De bieder kan de aanmeldingstermijn eenmaal verlengen. De verlenging bedraagt, onverminderd het tweede lid, ten
      minste twee weken en niet meer dan tien weken, gerekend vanaf de einddatum van de oorspronkelijke termijn.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel15
  - number: '15.2'
    text: |-
      De bieder kan uiterlijk op de derde werkdag na het einde van de oorspronkelijke termijn besluiten tot verlenging
      van de aanmeldingstermijn en doet na dit besluit een openbare mededeling hierover, onder vermelding van de
      einddatum van de aldus verlengde termijn.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel15
  - number: '15.3'
    text: |-
      Rechthebbenden van effecten die vóór het einde van de oorspronkelijke termijn hun effecten hebben aangemeld kunnen
      tijdens de verlengingsperiode deze aanmelding herroepen.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel15
  - number: '15.4'
    text: |-
      De bieder kan gedurende de, al dan niet overeenkomstig het eerste, tweede of vijfde lid verlengde,
      aanmeldingstermijn de geboden prijs verhogen. De bieder draagt er zorg voor dat hij voor de verhoging van
      de geboden prijs een vergoeding in geld kan opbrengen of alle redelijke maatregelen heeft getroffen om enige
      andere vorm van vergoeding te kunnen verstrekken om het bod gestand te kunnen doen. De bieder doet een openbare
      mededeling over de verhoging van de geboden prijs en over de wijze waarop hij zal voldoen aan de tweede volzin.
      Indien de verhoging van de prijs meebrengt dat de samenstelling van de geboden prijs wijzigt en de verhoging niet
      alleen bestaat uit geld, vindt verhoging van de prijs plaats door middel van algemeenverkrijgbaarstelling van een
      document.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel15
  - number: '15.5'
    text: |-
      Indien voor het tijdstip waarop de aanmeldingstermijn eindigt door een derde een openbaar bod op dezelfde
      categorie of klasse van effecten wordt aangekondigd of uitgebracht, kan de bieder de, al dan niet verlengde,
      aanmeldingstermijn verlengen tot het einde van de aanmeldingstermijn van dat openbaar bod.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel15
  - number: '15.6'
    text: |-
      Indien een verzoek als bedoeld in [artikel 5:80b van de wet][ref1] is gedaan wordt de, al dan niet verlengde,
      aanmeldingstermijn, indien deze is aangevangen, opgeschort tot en met het tijdstip waarop de beslissing van de
      ondernemingskamer uitvoerbaar bij voorraad is verklaard of, indien de beslissing niet uitvoerbaar bij voorraad
      wordt verklaard, tot en met het tijdstip waarop deze onherroepelijk is geworden. Indien het verzoek is gedaan
      voorafgaand aan de aanvang van de aanmeldingstermijn, wordt de aanvang van de aanmeldingstermijn opgeschort tot en
      met het tijdstip, bedoeld in de vorige volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel5
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '5'
  - number: '15.7'
    text: |-
      De bieder doet een openbare mededeling over een opschorting of herleving van de aanmeldingstermijn als bedoeld in
      het zesde lid.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel15
  - number: '15.8'
    text: |-
      Rechthebbenden van effecten die hun effecten hebben aangemeld voordat een verzoekschrift is ingediend, houdende een
      verzoek als bedoeld in [artikel 5:80b van de wet][ref1], kunnen indien het verzoek is toegewezen deze aanmelding
      binnen zeven werkdagen herroepen, nadat de beslissing van de ondernemingskamer uitvoerbaar bij voorraad is
      verklaard of onherroepelijk is geworden en voor het einde van de aanmeldingstermijn. Het negende lid, derde volzin,
      is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel5
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '5'
  - number: '15.9'
    text: |-
      Indien de geboden prijs is verhoogd en de resterende, al dan niet verlengde, aanmeldingstermijn korter is
      dan zeven werkdagen, komt aan de rechthebbenden op de effecten een periode van zeven werkdagen toe waarbinnen
      zij hun effecten kunnen aanmelden. De aanmeldingstermijn wordt van rechtswege verlengd met de resterende
      duur van de periode van zeven werkdagen indien deze periode zich uitstrekt tot na de, al dan niet verlengde,
      aanmeldingstermijn. De bieder kan gedurende de van rechtswege verlengde aanmeldingstermijn, bedoeld in de vorige
      volzin, geen beroep doen op het vierde lid.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel15
  - number: '15.10'
    text: |-
      Indien de geboden prijs is verhoogd op of binnen zeven werkdagen voor het einde van de oorspronkelijke
      aanmeldingstermijn en de bieder besluit tot verlenging van de aanmeldingstermijn als bedoeld in het tweede lid,
      wordt de duur van een van rechtswege verlengde aanmeldingstermijn als bedoeld in het negende lid, tweede volzin, in
      mindering gebracht op de duur van de verlengde aanmeldingstermijn.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel15
  - number: 15a.1
    text: |-
      Het document, bedoeld in [artikel 15, vierde lid, laatste volzin][ref1], bevat alle gegevens die voor een redelijk
      geïnformeerde en zorgvuldig handelende persoon van belang zijn voor het vormen van een verantwoord oordeel over de
      verhoging van de geboden prijs, waaronder in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0022511#Artikel15
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0022511
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 15a.1.a
    text: |-
      een beschrijving van de verhoging van de prijs waaruit de gewijzigde samenstelling en verhoging van de prijs tot
      uitdrukking komt;
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel15a
  - number: 15a.1.b
    text: |-
      ingeval van verhoging van de prijs met een vergoeding in effecten, de informatie, bedoeld in [bijlage F][ref1],
      met uitzondering van de informatie bedoeld in subonderdeel 1.4 van bijlage F, tenzij deze informatie reeds is
      opgenomen in het prospectus voor uitgifte van nieuwe effecten. Indien dit het geval is, kan worden volstaan met een
      verwijzing naar de informatie, bedoeld in de vorige volzin;


      [ref1]: https://wetten.overheid.nl/BWBR0022511
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0022511
  - number: 15a.1.c
    text: |-
      de wijze waarop de bieder zorg draagt dat hij zal voldoen aan [artikel 15, vierde lid, tweede volzin][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0022511#Artikel15
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0022511
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 15a.1.d
    text: de aangepaste aanmeldingstermijn.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel15a
  - number: 15a.2
    text: |-
      Het document wordt algemeen verkrijgbaar gesteld overeenkomstig [artikel 10][ref1]. Het document maakt na de
      algemeenverkrijgbaarstelling deel uit van het biedingsbericht.


      [ref1]: https://wetten.overheid.nl/BWBR0022511#Artikel10
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0022511
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 15a.3
    text: |-
      Rechthebbenden op effecten die hun effecten hebben aangemeld voordat het document algemeen verkrijgbaar is gesteld,
      kunnen binnen zeven werkdagen na de algemeenverkrijgbaarstelling van het document deze aanmelding herroepen.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel15a
  - number: '16.1'
    text: |-
      De bieder doet uiterlijk op de derde werkdag na het einde van de aanmeldingstermijn een openbare mededeling of
      hij het openbaar bod gestand doet. Indien de bieder het bod niet gestand doet, deelt hij de reden hiervan openbaar
      mede.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel16
  - number: '16.2'
    text: |-
      De bieder vermeldt de totale waarde, het aantal en het daarbij behorende percentage van de ingevolge het openbaar
      bod aangemelde effecten, alsmede het totale aantal en het corresponderende percentage van effecten dat na de
      aanmeldingstermijn in zijn bezit is.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel16
  - number: '16.3'
    text: |-
      De bieder kan het openbaar bod gestand doen indien effecten tot een geringer bedrag, aantal of percentage zijn
      aangemeld dan het bedrag, aantal onderscheidenlijk percentage van welker aanbieding binnen de aanmeldingstermijn
      hij zijn verplichting tot gestanddoening van het bod afhankelijk stelde.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel16
  - number: '16.4'
    text: |-
      Indien de openbare mededeling, bedoeld in het eerste lid, inhoudt dat de bieder het bod niet gestand doet, is het
      de bieder en de personen met wie hij in onderling overleg handelt gedurende 6 maanden na de openbare mededeling
      niet toegestaan een openbaar bod aan te kondigen of uit te brengen op effecten van dezelfde uitgevende instelling.
      [Artikel 2a, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022511#Artikel2a
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0022511
        artikel: 2a
        hoofdstuk: '1'
  - number: '17.1'
    text: |-
      De bieder kan binnen drie werkdagen na gestanddoening van het openbaar bod aan de rechthebbenden van de effecten
      waarop het openbaar bod betrekking had en die hun effecten niet hebben aangemeld de mogelijkheid geven om deze
      effecten aan te bieden tegen dezelfde voorwaarden die golden voor het gestand gedane openbaar bod. De bieder doet
      hierover een openbare mededeling waarin ten minste wordt vermeld:
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel17
  - number: 17.1.a
    text: de reden waarom de bieder overgaat tot het geven van deze mogelijkheid;
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel17
  - number: 17.1.b
    text: de termijn waarbinnen de effecten aangemeld kunnen worden; en
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel17
  - number: 17.1.c
    text: dat het oorspronkelijke biedingsbericht van toepassing is.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel17
  - number: '17.2'
    text: |-
      De in het eerste lid, onder b, bedoelde termijn vangt aan op de eerste werkdag volgend op die van de openbare
      mededeling, bedoeld in de aanhef van het eerste lid, en is niet langer dan twee weken.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel17
  - number: '17.3'
    text: |-
      Vanaf het tijdstip waarop de openbare mededeling over de gestanddoening wordt gedaan tot en met het tijdstip waarop
      de in het eerste lid, onder b, bedoelde termijn eindigt is [artikel 13][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022511#Artikel13
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0022511
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '17.4'
    text: |-
      De bieder doet uiterlijk op de derde werkdag na het einde van de in het eerste lid, onder b, bedoelde termijn een
      openbare mededeling over het aantal en het percentage van de effecten dat aangeboden is binnen deze termijn en het
      totale aantal en het totale percentage van de effecten dat in zijn bezit is.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel17
  - number: '18.1'
    text: |-
      De doelvennootschap met zetel in Nederland waarop een volledig bod is uitgebracht roept haar aandeelhouders op voor
      een na de openbare mededeling van de verkrijgbaarstelling van het biedingsbericht en ten minste zes werkdagen voor
      het einde van de aanmeldingstermijn te houden algemene vergadering ter bespreking van het uitgebrachte openbaar
      bod.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel18
  - number: '18.2'
    text: |-
      De doelvennootschap stelt uiterlijk vier werkdagen voor de in het eerste lid bedoelde vergadering een bericht voor
      haar aandeelhouders algemeen verkrijgbaar dat ten minste de in [bijlage G][ref1] bedoelde informatie inhoudt.


      [ref1]: https://wetten.overheid.nl/BWBR0022511
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0022511
  - number: '18.3'
    text: |-
      Over de algemeenverkrijgbaarstelling van het bericht, bedoeld in het tweede lid, doet de doelvennootschap een
      openbare mededeling.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel18
  - number: '18.4'
    text: |-
      Indien voor het einde van de aanmeldingstermijn door een derde een openbaar bod op dezelfde effecten wordt
      uitgebracht, behoeft de doelvennootschap niet opnieuw toepassing te geven aan het eerste tot en met het derde lid,
      maar doet zij een openbare mededeling van haar standpunt met betrekking tot het door de derde uitgebrachte openbaar
      bod.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel18
  - number: '18.5'
    text: |-
      Indien de Autoriteit Financiële Markten niet ingevolge [artikel 5:74, tweede lid, van de wet][ref1] bevoegd is tot
      goedkeuring van het biedingsbericht, zendt de doelvennootschap het bericht, bedoeld in het tweede lid, gelijktijdig
      met de algemeenverkrijgbaarstelling van het bericht toe aan de Autoriteit Financiële Markten.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel5
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '5'
  - number: 18a
    text: |-
      Indien een volledig bod is uitgebracht op een doelvennootschap met zetel buiten Nederland en de Autoriteit
      Financiële Markten ingevolge [artikel 5:74, tweede lid, van de wet][ref1] bevoegd is tot goedkeuring van het
      biedingsbericht, stelt de doelvennootschap uiterlijk tien werkdagen voor het einde van de aanmeldingstermijn een
      bericht voor haar aandeelhouders algemeen verkrijgbaar dat ten minste de in bijlage G bedoelde informatie inhoudt.
      [Artikel 18, derde en vierde lid][ref2], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0022511#Artikel18
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0022511
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '19.1'
    text: |-
      De bieder betaalt, indien hij het volledig bod gestand doet, steeds voor alle ingevolge dat volledig
      bod aangemelde effecten de hoogste prijs die op grond van het biedingsbericht, al dan niet verhoogd
      op grond van [artikel 15, vierde lid][ref1], is geboden of op grond van een transactie als bedoeld in
      [artikel 5, vierde lid][ref2], of [13, eerste lid][ref3], met uitzondering van in regelmatig verkeer op een
      gereglementeerde markt of een met een gereglementeerde markt vergelijkbaar systeem uit een staat die geen lidstaat
      is tot stand gekomen transacties, is betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0022511#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0022511#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0022511#Artikel13
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0022511
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0022511
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref3
        bwb_id: BWBR0022511
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '19.2'
    text: |-
      Het is de bieder niet toegestaan zich gedurende de van rechtswege verlengde aanmeldingstermijn, bedoeld in
      [artikel 15, negende lid, tweede volzin][ref1], in de positie te brengen dat hij in verband met een transactie als
      bedoeld in [artikel 5, vierde lid][ref2], of [13, eerste lid][ref3], een hogere vergoeding dient te voldoen dan de
      prijs die als gevolg van de toepasselijkheid van artikel 15, vierde of zesde lid, is verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0022511#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0022511#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0022511#Artikel13
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0022511
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0022511
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref3
        bwb_id: BWBR0022511
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '20.1'
    text: |-
      De doelvennootschap met zetel in Nederland waarop een partieel bod is uitgebracht stelt uiterlijk vier werkdagen
      voor het einde van de aanmeldingstermijn een bericht voor haar aandeelhouders verkrijgbaar dat ten minste de in
      [bijlage G][ref1] bedoelde informatie inhoudt.


      [ref1]: https://wetten.overheid.nl/BWBR0022511
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0022511
  - number: '20.2'
    text: |-
      [Artikel 18, derde tot en met vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022511#Artikel18
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0022511
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 20a
    text: |-
      Indien een partieel bod is uitgebracht op een doelvennootschap met zetel buiten Nederland en de Autoriteit
      Financiële Markten ingevolge [artikel 5:74, tweede lid, van de wet][ref1] bevoegd is tot goedkeuring van het
      biedingsbericht, stelt de doelvennootschap uiterlijk tien werkdagen voor het einde van de aanmeldingstermijn een
      bericht voor haar aandeelhouders algemeen verkrijgbaar dat ten minste de in [bijlage G][ref2] bedoelde informatie
      inhoudt. [Artikel 18, derde en vierde lid][ref3], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0022511
      [ref3]: https://wetten.overheid.nl/BWBR0022511#Artikel18
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0022511
      - id: ref3
        bwb_id: BWBR0022511
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '21.1'
    text: |-
      Indien de bieder na verkrijging van de naar aanleiding van het partieel bod aangeboden effecten direct of indirect
      ten minste over 30 procent van de stemrechten in de algemene vergadering van de doelvennootschap zal beschikken,
      doet hij zijn partieel bod gestand met hantering van een non-discriminatoire systematiek, waarbij ten hoogste 30
      procent minus één stem van de stemrechten kan worden verkregen. Bij ministeriële regeling kunnen regels worden
      gesteld omtrent de systematiek van gestanddoening.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel21
  - number: '21.2'
    text: |-
      [Artikel 19][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022511#Artikel19
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0022511
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '22.1'
    text: |-
      De doelvennootschap met zetel in Nederland waarop een tenderbod is uitgebracht stelt, uiterlijk vier werkdagen
      voor het einde van de aanmeldingstermijn een bericht voor haar aandeelhouders verkrijgbaar dat ten minste de in
      [bijlage G][ref1] bedoelde informatie inhoudt.


      [ref1]: https://wetten.overheid.nl/BWBR0022511
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0022511
  - number: '22.2'
    text: |-
      [Artikel 18, derde tot en met vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022511#Artikel18
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0022511
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 22a
    text: |-
      Indien een tenderbod is uitgebracht op een doelvennootschap met zetel buiten Nederland en de Autoriteit Financiële
      Markten ingevolge [artikel 5:74, tweede lid, van de wet][ref1] bevoegd is tot goedkeuring van het biedingsbericht,
      stelt de doelvennootschap uiterlijk tien werkdagen voor het einde van de aanmeldingstermijn een bericht voor
      haar aandeelhouders algemeen verkrijgbaar dat ten minste de in [bijlage G][ref2] bedoelde informatie inhoudt.
      [Artikel 18, derde en vierde lid][ref3], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0022511
      [ref3]: https://wetten.overheid.nl/BWBR0022511#Artikel18
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0022511
      - id: ref3
        bwb_id: BWBR0022511
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '23.1'
    text: |-
      De bieder doet het tenderbod gestand indien de beoogde verkrijging mogelijk is tegen een door de bieder in het
      biedingsbericht te vermelden prijs per aandeel.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel23
  - number: '23.2'
    text: |-
      Indien de bieder na verkrijging van de naar aanleiding van het tenderbod aangeboden effecten direct of indirect ten
      minste 30 procent van de stemrechten in de algemene vergadering van de doelvennootschap zal vertegenwoordigen, doet
      hij zijn bod gestand met hantering van een non-discriminatoire systematiek, waarbij ten hoogste 30 procent minus
      één stem van deze stemrechten kan worden verkregen. Bij ministeriële regeling kunnen regels worden gesteld omtrent
      de systematiek van gestanddoening.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel23
  - number: '23.3'
    text: |-
      De bieder betaalt, bij gestanddoening voor alle aangeboden effecten van dezelfde categorie of klasse de hoogste
      prijs waartegen enig effect van de desbetreffende categorie of klasse is aangeboden.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel23
  - number: '24.1'
    text: De bieder stelt de gestanddoening van een verplicht bod niet afhankelijk van voorwaarden.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel24
  - number: '24.2'
    text: |-
      Indien een verplicht bod is uitgebracht op een doelvennootschap met zetel in Nederland, stelt de
      doelvennootschap uiterlijk tien werkdagen voor het einde van de aanmeldingstermijn een bericht voor haar
      aandeelhouders algemeen verkrijgbaar dat ten minste de in [bijlage G][ref1] bedoelde informatie inhoudt.
      [Artikel 18, derde tot en met vijfde lid][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022511
      [ref2]: https://wetten.overheid.nl/BWBR0022511#Artikel18
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0022511
      - id: ref2
        bwb_id: BWBR0022511
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '24.3'
    text: |-
      Indien een verplicht bod is uitgebracht op een doelvennootschap met zetel buiten Nederland en de Autoriteit
      Financiële Markten ingevolge [artikel 5:74, tweede lid, van de wet][ref1] bevoegd is tot goedkeuring van het
      biedingsbericht, stelt de doelvennootschap uiterlijk tien werkdagen voor het einde van de aanmeldingstermijn een
      bericht voor haar aandeelhouders algemeen verkrijgbaar dat ten minste de in [bijlage G][ref2] bedoelde informatie
      inhoudt. [Artikel 18, derde en vierde lid][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0022511
      [ref3]: https://wetten.overheid.nl/BWBR0022511#Artikel18
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0022511
      - id: ref3
        bwb_id: BWBR0022511
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '25.1'
    text: |-
      Indien na de aankondiging van het verplicht bod en voor het einde van de aanmeldingstermijn, bedoeld in
      [artikel 14][ref1], of, voor zover van toepassing, voor het einde van de verlengde aanmeldingstermijn, bedoeld
      in [artikel 15][ref2], door de bieder of de personen waarmee deze in onderling overleg handelt effecten worden
      verkregen voor een hogere prijs dan de billijke prijs, bedoeld in [artikel 5:80a van de wet][ref3], verhoogt de
      bieder de prijs tot ten minste de hoogste prijs die is betaald voor de aldus verworven effecten. Artikel 15, vierde
      lid, tweede en derde volzin, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0022511#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0022511#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel5
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0022511
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0022511
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '5'
  - number: '25.2'
    text: |-
      Indien de bieder in de periode van een jaar voorafgaand aan de aankondiging van het verplichte bod geen effecten
      heeft verworven van dezelfde categorie of klasse als waarop het verplicht bod betrekking heeft, is de billijke
      prijs gelijk aan de prijs van de gemiddelde beurskoers van die effecten op een gereglementeerde markt waarop de
      effecten in die periode toegelaten waren tot de handel.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel25
  - number: '25.3'
    text: |-
      Indien een op grond van [artikel 5:80b van de wet][ref1] gedaan verzoek tot het vaststellen van de billijke prijs
      door de ondernemingskamer van gerechtshof Amsterdam is toegewezen, wordt die billijke prijs geacht de in het
      biedingsbericht vermelde billijke prijs te vervangen, op het moment dat de beslissing van de ondernemingskamer
      uitvoerbaar bij voorraad is verklaard of onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel5
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '5'
  - number: '25.4'
    text: |-
      De bieder doet een openbare mededeling over de toewijzing door de ondernemingskamer van het verzoek tot
      vaststelling van de billijke prijs. De bieder vermeldt daarbij de hoogte van de vastgestelde billijke prijs en de
      gevolgen die deze prijs heeft voor de financiering van het bod, en in geval van een ruilbod, de gevolgen die deze
      prijs heeft voor de financiële stabiliteit van de vennootschap waarvan effecten in ruil worden aangeboden.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel25
  - number: '26.1'
    text: De billijke prijs luidt in effecten, geld of een combinatie van effecten en geld.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel26
  - number: '26.2'
    text: |-
      De billijke prijs kan uitsluitend in effecten luiden, indien het een categorie of klasse van effecten betreft die
      liquide is en tot de handel op een gereglementeerde markt is toegelaten.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel26
  - number: '26.3'
    text: |-
      De billijke prijs luidt in elk geval ook in geld indien de bieder, alleen of gezamenlijk met de personen waarmee
      deze in onderling overleg handelt, gedurende de in [artikel 25, tweede lid][ref1], bedoelde periode, tegen
      contante betaling effecten waaraan vijf procent of meer van de stemrechten in de algemene vergadering van de
      doelvennootschap is verbonden, heeft verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0022511#Artikel25
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0022511
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: '27.1'
    text: |-
      De doelvennootschap met zetel in Nederland stelt onverwijld na de algemeenverkrijgbaarstelling van het
      biedingsbericht de vertegenwoordigers van haar werknemers of, bij ontstentenis van die vertegenwoordigers, de
      werknemers zelf van het openbaar bod in kennis, onder gelijktijdige terbeschikkingstelling van het biedingsbericht.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel27
  - number: '27.2'
    text: |-
      Een bericht als bedoeld in [artikel 18, tweede lid][ref1], [20, eerste lid][ref2] of [22, eerste lid][ref3], wordt
      gelijktijdig met het algemeen verkrijgbaar stellen ervan verstrekt aan de vertegenwoordigers van de werknemers van
      de doelvennootschap of, bij ontstentenis van zodanige vertegenwoordigers, aan de werknemers van de doelvennootschap
      zelf.


      [ref1]: https://wetten.overheid.nl/BWBR0022511#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0022511#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0022511#Artikel22
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel27
    references:
