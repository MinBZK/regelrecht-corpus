        artikel: '28'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0007708
        artikel: '9'
  - number: '35'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel35
  - number: '36'
    text: 'Dit besluit wordt aangehaald als: Besluit openbare biedingen Wft.'
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel36
