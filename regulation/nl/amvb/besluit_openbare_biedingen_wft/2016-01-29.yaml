        artikel: '5'
  - number: '4.2'
    text: |-
      Indien op grond van [artikel 5:25i, tweede lid, van de wet][ref1], informatie openbaar is gemaakt kan een op grond
      van dit besluit vereiste openbare mededeling omtrent dezelfde informatie achterwege blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel5
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '5'
  - number: '4.3'
    text: |-
      Een bieder doet een openbare mededeling over informatie als bedoeld in [artikel 5:53, eerste lid, van de wet][ref1]
      voor zover die rechtstreeks op hem betrekking heeft of verband houdt met het voorgenomen, aangekondigde of
      uitgebrachte openbaar bod.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel5
    url: https://wetten.overheid.nl/BWBR0022511/2016-01-29#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '5'
  - number: '4.4'
    text: |-
      Ter zake van het uitstellen van de openbaarmaking van informatie als bedoeld in
      [artikel 2a, eerste lid, onderdeel a][ref1], [5, eerste, tweede of vierde lid][ref2], [5a][ref3],
      [5b, eerste lid][ref4], [6, eerste lid][ref5], [7, eerste tot en met vierde en zesde lid][ref6],
      [10, derde lid][ref7], [13, eerste lid][ref8], [15, tweede, vierde lid][ref9] en
      [16, eerste lid][ref10] of [17, eerste lid][ref11], bestaat geen rechtmatig belang als bedoeld in
      [artikel 5:25i, derde lid, onder a, van de wet][ref12].


