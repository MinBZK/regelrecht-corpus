  - number: '13'
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden gegeven inzake de verstrekking van de gegevens die
      noodzakelijk zijn voor de berekening, vaststelling en verantwoording van de in de [artikelen 10][ref1] tot en met
      [12][ref2] bedoelde rijksbijdragen.


      [ref1]: https://wetten.overheid.nl/BWBR0009768#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0009768#Artikel12
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel13
    references:
