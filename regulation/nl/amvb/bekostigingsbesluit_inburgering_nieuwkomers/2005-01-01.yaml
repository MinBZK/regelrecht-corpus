        artikel: '2'
  - number: '12.1'
    text: |-
      In afwijking van [artikel 2, derde lid][ref1], wat de rijksbijdrage voor het jaar 2001 betreft, worden de
      berekeningsgrondslagen, bedoeld onder de letters a en b van de in dat lid genoemde formule, voor zover de
      desbetreffende gegevens nog niet in het jaar 1999 beschikbaar kunnen zijn, vervangen door overeenkomstige
      berekeningsgrondslagen, en in elk geval door de berekeningsgrondslagen van respectievelijk: - letter a: het aantal
      nieuwkomer-deelnemers dat in 1999 in de gemeente de toets heeft afgelegd of met goed gevolg het examen heeft
      afgelegd, bedoeld in de Onderwijsregeling;
        - letter b: het landelijk aantal nieuwkomer-deelnemers dat in 1999 de toets heeft afgelegd of met goed gevolg het
      examen heeft afgelegd, bedoeld in de Onderwijsregeling;


      [ref1]: https://wetten.overheid.nl/BWBR0009768#Artikel2
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel12
    references:
