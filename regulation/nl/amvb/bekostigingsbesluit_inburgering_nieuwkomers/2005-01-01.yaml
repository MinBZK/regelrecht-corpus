preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Onderwijs, Cultuur en Wetenschappen van 20 februari 1998, nr. 1998/6108
    (3713), directie Wetgeving en Juridische Zaken, mede namens de Minister van Volksgezondheid, Welzijn en Sport en na
    overleg met Onze Minister van Binnenlandse Zaken;

    Gelet op artikel 2.3.1, tweede lid, van de Wet educatie en beroepsonderwijs, en artikel 16 van de Wet inburgering
    nieuwkomers;

    De Raad van State gehoord (advies van 15 mei 1998, nr. W05.98 0072);

    Gezien het nader rapport van Onze Minister van Onderwijs, Cultuur en Wetenschappen van 2 juli 1998, nr.
    1998/27101 (3713), directie Wetgeving en Juridische Zaken, mede namens de Staatssecretaris van Volksgezondheid,
    Welzijn en Sport en na overleg met Onze Minister van Binnenlandse Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel1
  - number: 1.a
    text: |-
      de wet: de [Wet inburgering nieuwkomers][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009544
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009544
  - number: 1.b
    text: 'Onze Minister: Onze Minister voor Vreemdelingenzaken en Integratie;'
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel1
  - number: 1.c
    text: |-
      inburgeringsprogramma: een programma als bedoeld in [artikel 6, eerste lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009544#Artikel6
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009544
        artikel: '6'
  - number: 1.d
    text: |-
      educatief programma: een programma als bedoeld in [artikel 6, eerste lid, onder a, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009544#Artikel6
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009544
        artikel: '6'
  - number: 1.e
    text: |-
      welzijnscomponent: het geheel van de activiteiten, bedoeld in [artikel 16 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009544#Artikel16
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009544
        artikel: '16'
  - number: 1.f
    text: |-
      nieuwkomer: de nieuwkomer, bedoeld in [artikel 1, onder a, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009544#Artikel1
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009544
        artikel: '1'
  - number: 1.g
    text: |-
      beschikking omtrent een inburgeringsprogramma: zowel de vaststelling van een inburgeringsprogramma op grond van
      [artikel 5, eerste lid, van de wet][ref1], als het besluit het vaststellen van een inburgeringsprogramma achterwege
      te laten, op grond van [artikel 5, tweede lid, van de wet][ref2], tenzij uit het besluit anders blijkt;


      [ref1]: https://wetten.overheid.nl/BWBR0009544#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009544#Artikel5
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009544
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0009544
        artikel: '5'
  - number: 1.h
    text: |-
      verklaring: de door het bevoegd gezag van een instelling uitgereikte verklaring, bedoeld in
      [artikel 7.4.15, eerste lid, van de Wet educatie en beroepsonderwijs][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 1.i
    text: |-
      Onderwijsregeling: de [Onderwijsregeling inburgering nieuwkomers 1998][ref1], d.d. 8 november 1997, BVE/
      DenR/1997/25041(Uitleg OCenW-Regelingen 1997, nr. 28).


      [ref1]: https://wetten.overheid.nl/BWBR0009005
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009005
  - number: '2.1'
    text: |-
      De rijksbijdrage voor een gemeente ten behoeve van de educatieve programma's en de rijksbijdrage ten behoeve van de
      welzijnscomponent worden elk berekend op de grondslag van:
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel2
  - number: 2.1.a
    text: |-
      het aantal door het college van burgemeester en wethouders ontvangen afschriften van verklaringen, uitgereikt in
      het tweede jaar voorafgaand aan het jaar waarop de rijksbijdrage betrekking heeft, en
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel2
  - number: 2.1.b
    text: |-
      het aantal nieuwkomers ten aanzien van wie het college van burgemeester en wethouders in dat tweede jaar een
      beschikking omtrent een inburgeringsprogramma heeft genomen.
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel2
  - number: '2.2'
    text: |-
      Onze Minister voor Vreemdelingenzaken en Integratie stelt de verhouding vast waarin de onderdelen a en b van het
      eerste lid worden betrokken bij de verdeling van de middelen voor inburgeringsprogramma's die zijn opgenomen in het
      desbetreffende voorstel voor de rijksbegroting.
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel2
  - number: '2.3'
    text: |-
      De in het eerste lid bedoelde rijksbijdragen voor een gemeente worden elk berekend met de formule [ (a:b) x c +
      (d:e) x f ] waarin wordt voorgesteld: - met de letter a: het aantal door het college van burgemeester en wethouders
      ontvangen afschriften van verklaringen die zijn uitgereikt in het tweede jaar voorafgaand aan het jaar waarop de
      rijksbijdrage betrekking heeft;
        - met de letter b: het landelijke aantal door de colleges van burgemeester en wethouders ontvangen afschriften van
      verklaringen die zijn uitgereikt in het tweede jaar voorafgaand aan het jaar waarop de rijksbijdrage betrekking
      heeft;
        - met de letter c: het bedrag dat met inachtneming van het tweede lid beschikbaar is voor de gemeenten met
      het oog op de in het eerste lid onder a bedoelde maatstaf verklaringen, ten aanzien van educatieve programma's
      respectievelijk de welzijnscomponent;
        - met de letter d: het aantal nieuwkomers ten aanzien van wie in het tweede jaar voorafgaand aan het jaar
      waarop de rijksbijdrage betrekking heeft, het college van burgemeester en wethouders een beschikking omtrent een
      inburgeringsprogramma heeft genomen;
        - met de letter e: het landelijke aantal nieuwkomers ten aanzien van wie de colleges van burgemeester en wethouders
      beschikkingen omtrent een inburgeringsprogramma hebben genomen in het tweede jaar voorafgaand aan het jaar waarop
      de rijksbijdrage betrekking heeft;
        - met de letter f: het bedrag dat met inachtneming van het tweede lid beschikbaar is voor de gemeenten
      met het oog op de toepassing van de in het eerste lid onder b bedoelde maatstaf beschikkingen omtrent een
      inburgeringsprogramma, ten aanzien van educatieve programma's respectievelijk de welzijnscomponent.
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel2
  - number: '2.4'
    text: |-
      De rijksbijdragen worden vastgesteld onder voorbehoud van goedkeuring van de beschikbare middelen door de
      begrotingswetgever. De vastgestelde rijksbijdragen kunnen worden verhoogd of verlaagd in verband met wijzigingen
      van de rijksbegroting voor het desbetreffende jaar.
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel2
  - number: 2a.1
    text: De rijksbijdrage, bedoeld in artikel 2, voor 2004 kan eenmalig worden verhoogd.
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel2a
  - number: 2a.2
    text: |-
      Deze verhoging is afhankelijk van de door de gemeente opgebouwde reserve, bedoeld in artikel 3, derde lid,
      onderdeel c, op 31 december 2002 en wordt berekend met de formule: X = Y – ½ Z waarin wordt voorgesteld: - met de
      letter X: het bedrag van de eenmalige verhoging van de rijksbijdrage voor 2004;
        - met de letter Y: het verschil tussen de rijksbijdrage op grond van de meerjarenraming in de rijksbegroting voor
      2003 en de rijksbijdrage die voor 2004 is toegekend;
        - met de letter Z: de door de gemeente opgebouwde reserve, bedoeld in artikel 3, derde lid, onderdeel c, op 31
      december 2002.
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel2a
  - number: 2a.3
    text: |-
      Het bedrag van de eenmalige verhoging van de rijksbijdrage, bedoeld in het tweede lid, wordt verstrekt uiterlijk 1
      juni 2004.
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel2a
  - number: '3.1'
    text: |-
      Voor zover de in [artikel 2][ref1] bedoelde rijksbijdrage voor educatieve programma's niet wordt aangewend voor
      deze programma's, kan de gemeente die rijksbijdrage geheel of gedeeltelijk aanwenden voor de welzijnscomponent.


      [ref1]: https://wetten.overheid.nl/BWBR0009768#Artikel2
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009768
        artikel: '2'
  - number: '3.2'
    text: |-
      Voor zover de in [artikel 2][ref1] bedoelde rijksbijdrage voor de welzijnscomponent niet wordt aangewend voor deze
      component, kan de gemeente die rijksbijdrage geheel of gedeeltelijk aanwenden voor educatieve programma's.


      [ref1]: https://wetten.overheid.nl/BWBR0009768#Artikel2
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009768
        artikel: '2'
  - number: '3.3'
    text: |-
      Voor zover in enig jaar de in [artikel 2][ref1] bedoelde rijksbijdragen niet worden aangewend voor educatieve
      programma's of voor de welzijnscomponent, kan de gemeente de desbetreffende bedragen:


      [ref1]: https://wetten.overheid.nl/BWBR0009768#Artikel2
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009768
        artikel: '2'
  - number: 3.3.a
    text: |-
      bestemmen voor opleidingen educatie als bedoeld in [artikel 7.3.1 van de Wet educatie en beroepsonderwijs][ref1]
      voor ten hoogste het bedrag dat overeenkomt met het bedrag van het procentuele aandeel dat de rijksbijdrage voor de
      educatieve programma's heeft in de som van de beide in dit besluit geregelde rijksbijdragen voor de gemeente;


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 3.3.b
    text: |-
      bestemmen voor activiteiten als bedoeld in [artikel 2, onderdeel k, van de Welzijnswet 1994][ref1], voor ten
      hoogste het bedrag dat overeenkomt met het bedrag van het procentuele aandeel dat de rijksbijdrage voor de
      welzijnscomponent heeft in de som van de beide in dit besluit geregelde rijksbijdragen voor de gemeente;


      [ref1]: https://wetten.overheid.nl/BWBR0006705#Artikel2
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006705
        artikel: '2'
  - number: 3.3.c
    text: |-
      voor het gedeelte waarvoor onderdeel a of onderdeel b niet is toegepast, reserveren ten behoeve van educatieve
      programma's of ten behoeve van de welzijnscomponent.
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel3
  - number: '4.1'
    text: |-
      Het college van burgemeester en wethouders deelt Onze Minister voor 1 juli van het jaar voorafgaand aan het jaar
      waarvoor de rijksbijdrage wordt vastgesteld het in [artikel 2, eerste lid][ref1], bedoelde aantal verklaringen
      en beschikkingen mede. De gegevens zijn voorzien van een verklaring omtrent de getrouwheid, afgegeven door een
      accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0009768#Artikel2
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009768
        artikel: '2'
  - number: '4.2'
    text: |-
      Indien de in het eerste lid bedoelde gegevens en verklaring van getrouwheid niet binnen de in het eerste lid
      genoemde termijn zijn verstrekt, stelt Onze Minister het college van burgemeester en wethouders in de gelegenheid
      deze binnen 3 weken alsnog te verstrekken.
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel4
  - number: '4.3'
    text: |-
      Indien het college van burgemeester en wethouders de in het eerste lid bedoelde gegevens en verklaring omtrent
      de getrouwheid niet binnen de in het tweede lid bedoelde termijn verstrekt, wordt de rijksbijdrage volgens
      [artikel 2][ref1] berekend, met dien verstande dat wordt uitgegaan van de helft van het aantal verklaringen en
      beschikkingen op grond waarvan de rijksbijdrage voor die gemeente is berekend in het derde jaar voorafgaand aan het
      jaar waarop de rijksbijdrage betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0009768#Artikel2
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009768
        artikel: '2'
  - number: '4.4'
    text: Onze Minister stelt de rijksbijdrage vast in september voorafgaand aan het jaar waarop zij betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel4
  - number: '4.5'
    text: |-
      Indien het college van burgemeester en wethouders de in het eerste lid bedoelde gegevens en verklaring omtrent
      de getrouwheid niet verstrekt voor 1 januari van het jaar waarop de rijksbijdrage betrekking heeft, trekt Onze
      Minister de met toepassing van het derde lid vastgestelde rijksbijdrage in.
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel4
  - number: '4.6'
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden gegeven voor het verstrekken van de in het eerste lid
      bedoelde gegevens.
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel4
  - number: '4.7'
    text: |-
      Ten behoeve van de verklaring omtrent de getrouwheid stelt Onze Minister een controleprotocol vast. Aan Onze
      Minister wordt op diens verzoek inzicht gegeven in de gegevens die bij de controle op enigerlei wijze een rol
      spelen, en in de controlerapporten van de accountant.
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel4
  - number: '5.1'
    text: |-
      Het college van burgemeester en wethouders kan de in dit besluit geregelde rijksbijdrage aanwenden tezamen met de
      colleges van burgemeester en wethouders van een of meer andere gemeenten, indien tevens de andere in dit besluit
      geregelde rijksbijdrage voor datzelfde jaar tezamen met die andere gemeente of gemeenten wordt aangewend.
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel5
  - number: '5.2'
    text: |-
      In geval van samenwerking als bedoeld in het eerste lid, dragen de samenwerkende gemeenten aan een van hen de
      bevoegdheid over tot het ontvangen van de rijksbijdragen, het indienen van een financiële verantwoording en het
      inzenden van een schriftelijk verslag over de activiteiten waarvoor de rijksbijdragen zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel5
  - number: '5.3'
    text: |-
      In geval van samenwerking als bedoeld in het eerste lid, stellen de colleges van burgemeester en wethouders van
      de samenwerkende gemeenten Onze Minister daarvan in kennis voor 1 december voorafgaand aan het jaar waarop de
      rijksbijdrage betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel5
  - number: '5.4'
    text: 'De melding, bedoeld in het derde lid, bevat van de betrokken gemeenten:'
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel5
  - number: 5.4.a
    text: de namen van die gemeenten,
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel5
  - number: 5.4.b
    text: de naam van de gemeente waaraan de in het tweede lid genoemde bevoegdheid is overgedragen, en
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel5
  - number: 5.4.c
    text: |-
      een verklaring van elke gemeente waaruit de in het tweede lid bedoelde overdracht van bevoegdheid aan de daar
      bedoelde gemeente blijkt.
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel5
  - number: '6'
    text: |-
      Het college van burgemeester en wethouders zendt jaarlijks voor 1 juli van het jaar volgend op het jaar waarvoor
      de rijksbijdrage is verstrekt, aan Onze Minister een schriftelijk verslag over de activiteiten waarvoor de
      rijksbijdrage is verstrekt. Bij ministeriële regeling worden voorschriften gegeven voor de inrichting van het
      verslag.
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel6
  - number: '7.1'
    text: |-
      Het college van burgemeester en wethouders dient bij Onze Minister voor 1 juli van het jaar volgend op het jaar
      waarvoor de rijksbijdrage is verstrekt een financiële verantwoording in waaruit blijkt:
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel7
  - number: 7.1.a
    text: dat de rijksbijdrage die is vastgesteld voor het voorafgaande jaar, rechtmatig is aangewend,
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel7
  - number: 7.1.b
    text: |-
      of, en zo ja op welke wijze, ten aanzien van het voorafgaande jaar toepassing is gegeven aan [artikel 3][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0009768#Artikel3
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009768
        artikel: '3'
  - number: 7.1.c
    text: in voorkomende gevallen de stand van de reserveringen en de toevoegingen en onttrekkingen aan de reserve, alsmede
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel7
  - number: 7.1.d
    text: |-
      in voorkomende gevallen dat het college van burgemeester en wethouders middelen die zijn verstrekt op grond van
      de [Welzijnswet 1994][ref1] of op grond van de [Wet educatie en beroepsonderwijs][ref2] wat opleidingen educatie
      betreft, heeft aangewend voor inburgering van nieuwkomers.


      [ref1]: https://wetten.overheid.nl/BWBR0006705
      [ref2]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006705
      - id: ref2
        bwb_id: BWBR0007625
  - number: '7.2'
    text: |-
      De financiële verantwoording wordt ingericht volgens een door Onze Minister vastgesteld model en
      is voorzien van een verklaring omtrent de getrouwheid, afgegeven door een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1]. [Artikel 4, zevende lid][ref2], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
      [ref2]: https://wetten.overheid.nl/BWBR0009768#Artikel4
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
      - id: ref2
        bwb_id: BWBR0009768
        artikel: '4'
  - number: '7.3'
    text: |-
      In geval toepassing is gegeven aan [artikel 5][ref1], vermeldt de gemeente die de rijksbijdragen verantwoordt, in
      de financiële verantwoording de verdeling van de in [artikel 2][ref2] bedoelde aantallen verklaringen en genomen
      beschikkingen omtrent een inburgeringsprogramma over de samenwerkende gemeenten.


      [ref1]: https://wetten.overheid.nl/BWBR0009768#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009768#Artikel2
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009768
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0009768
        artikel: '2'
  - number: '7.4'
    text: |-
      In geval toepassing is gegeven aan de [artikelen 5][ref1] en
      [6 van het Uitvoeringsbesluit inburgering nieuwkomers][ref2], vermeldt de gemeente in de financiële verantwoording
      de bedragen die zijn overgedragen aan dan wel ontvangen van de andere gemeente, bedoeld in dat artikel. Het college
      van burgemeester en wethouders dat de beschikking omtrent het inburgeringsprogramma heeft genomen, neemt dit als
      telgegeven op in de financiële verantwoording. Het college van burgemeester en wethouders dat het afschrift van de
      verklaring heeft ontvangen, neemt dit gegeven op in de financiële verantwoording.


      [ref1]: https://wetten.overheid.nl/BWBR0009734#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009734#Artikel6
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009734
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0009734
        artikel: '6'
  - number: '8.1'
    text: |-
      Onze Minister kan de vastgestelde rijksbijdrage binnen een periode van 5 jaar na de bekendmaking intrekken of ten
      nadele van de gemeente wijzigen:
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel8
  - number: 8.1.a
    text: |-
      op grond van feiten of omstandigheden waarvan Onze Minister bij de vaststelling van de rijksbijdrage redelijkerwijs
      niet op de hoogte kon zijn en op grond waarvan de rijksbijdrage lager zou zijn vastgesteld;
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel8
  - number: 8.1.b
    text: indien de vaststelling van de rijksbijdrage onjuist was en de gemeente dit wist of behoorde te weten;
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel8
  - number: 8.1.c
    text: |-
      indien de gemeente na de vaststelling van de rijksbijdrage niet heeft voldaan aan de voorschriften, vastgesteld bij
      en krachtens dit besluit.
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel8
  - number: '8.2'
    text: |-
      De intrekking of wijziging werkt terug tot en met het tijdstip waarop de rijksbijdrage is vastgesteld, tenzij bij
      de intrekking of wijziging anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel8
  - number: '9.1'
    text: |-
      Bij het geheel of gedeeltelijk intrekken van de rijksbijdrage op grond van [artikel 8][ref1] besluit Onze Minister
      tot:


      [ref1]: https://wetten.overheid.nl/BWBR0009768#Artikel8
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009768
        artikel: '8'
  - number: 9.1.a
    text: het onmiddellijk terugvorderen van de middelen bij de desbetreffende gemeente, of
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel9
  - number: 9.1.b
    text: |-
      het verrekenen van de middelen met de rijksbijdrage aan de gemeente in het jaar nadat tot geheel of gedeeltelijk
      intrekken is besloten.
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel9
  - number: '9.2'
    text: |-
      Indien Onze Minister toepassing geeft aan het eerste lid, onderdeel a, worden de middelen binnen een termijn van 4
      weken nadat een daartoe strekkend besluit aan de gemeente is verzonden, door de gemeente terugbetaald.
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel9
  - number: '9.3'
    text: |-
      Na het verstrijken van de termijn, bedoeld in het tweede lid, is de gemeente zonder aanmaning of rechterlijke
      tussenkomst de wettelijke rente verschuldigd.
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel9
  - number: '10.1'
    text: |-
      De rijksbijdrage voor het jaar 1999 wordt in afwijking van [artikel 2, eerste tot en met derde lid][ref1],
      berekend door een bij ministeriële regeling vast te stellen bedrag per nieuwkomer te vermenigvuldigen
      met een aantal nieuwkomers. Het aantal nieuwkomers wordt berekend met de formule [ (a:b) x c ], waarin
      wordt voorgesteld: - met de letter a: de som van het aantal personen van 18 jaar en ouder, bedoeld in
      [artikel 1, eerste lid, onderdeel i, onder 4° en 5°, van het Bekostigingsbesluit welzijnsbeleid][ref2]
      zoals luidend tot het tijdstip van inwerkingtreding van de wet, die zich volgens het Centraal Bureau voor
      de Statistiek gedurende het jaar 1997 in de betreffende gemeente hebben gevestigd, en het geraamde aantal
      feitelijk in het jaar 1999 in de betreffende gemeente te huisvesten personen van 18 jaar en ouder, bedoeld in
      [artikel 1, eerste lid, onderdeel i, onder 1° en 2°, van het Bekostigingsbesluit welzijnsbeleid][ref3] zoals
      luidend tot het tijdstip van inwerkingtreding van de wet;
        - met de letter b: de som van de uitkomsten van de berekeningen voor alle gemeenten van letter a;
        - met de letter c: het geraamde aantal nieuwkomers dat gezien de omvang van het beschikbare budget, in 1999 in
      aanmerking komt voor deelname aan een inburgeringsprogramma.


      [ref1]: https://wetten.overheid.nl/BWBR0009768#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007133#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0007133#Artikel1
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009768
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0007133
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0007133
        artikel: '1'
  - number: '10.2'
    text: |-
      Aan de in het eerste lid bij letter a bedoelde aantallen gevestigde personen van 18 jaar en ouder wordt toegevoegd
      het aantal in Nederland gevestigde personen, bedoeld in [artikel 1, onderdeel a][ref1] ten 2°, van de wet, voor
      zover niet reeds onder letter a begrepen en voor zover niet afkomstig uit een lidstaat van de Europese Unie.


      [ref1]: https://wetten.overheid.nl/BWBR0009768#Artikel1
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009768
        artikel: '1'
  - number: '10.3'
    text: |-
      Aan de in het eerste lid bij letter a bedoelde aantallen gevestigde en geraamde personen van 18 jaar en ouder wordt
      toegevoegd het aantal gevestigde respectievelijk geraamde personen van 16 en 17 jaar waarop de omschrijving bij
      letter a, met uitzondering van de leeftijd, en zoals aangevuld ingevolge het tweede lid, van toepassing is.
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel10
  - number: '11.1'
    text: |-
      In afwijking van [artikel 2, derde lid][ref1], wat de rijksbijdrage voor het jaar 2000 betreft, worden de
      berekeningsgrondslagen, bedoeld onder de letters a, b, d en e van de in dat lid genoemde formule, voor zover de
      desbetreffende gegevens nog niet in het jaar 1998 beschikbaar kunnen zijn, vervangen door de berekeningsgrondslagen
      van respectievelijk: - letter a: het aantal nieuwkomer-deelnemers dat in 1998 in de gemeente de toets heeft
      afgelegd of met goed gevolg het examen heeft afgelegd, bedoeld in de Onderwijsregeling;
        - letter b: het landelijk aantal nieuwkomer-deelnemers dat in 1998 de toets heeft afgelegd of met goed gevolg het
      examen heeft afgelegd, bedoeld in de Onderwijsregeling;
        - letter d: het aantal in 1998 door het college van burgemeester en wethouders gemaakte schriftelijke afspraken als
      bedoeld in [artikel 52, vierde lid, onder b, van het Bekostigingsbesluit welzijnsbeleid][ref2] zoals luidend tot
      het tijdstip van inwerkingtreding van de wet, omtrent het volgen van een inburgeringsprogramma;
        - letter e: het landelijk aantal in 1998 door het college van burgemeester en wethouders gemaakte schriftelijke
      afspraken als bedoeld in [artikel 52, vierde lid, onder b, van het Bekostigingsbesluit welzijnsbeleid][ref3] zoals
      luidend tot het tijdstip van inwerkingtreding van de wet, omtrent het volgen van een inburgeringsprogramma.


      [ref1]: https://wetten.overheid.nl/BWBR0009768#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007133#Artikel52
      [ref3]: https://wetten.overheid.nl/BWBR0007133#Artikel52
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009768
        artikel: '2'
      - id: ref2
