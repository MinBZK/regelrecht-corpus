        bwb_id: BWBR0009768
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0009768
        artikel: '12'
  - number: '14.2'
    text: |-
      De in het eerste lid bedoelde vervallen bepalingen blijven gelden voor de tot de datum van inwerkingtreding van het
      Bekostigingsbesluit inburgering nieuwkomers verleende uitkeringen.
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel14
  - number: '15'
    text: |-
      Dit besluit treedt in werking op het tijdstip waarop de [Wet inburgering nieuwkomers][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0009544
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009544
  - number: '16'
    text: 'Dit besluit wordt aangehaald als: Bekostigingsbesluit inburgering nieuwkomers.'
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel16
