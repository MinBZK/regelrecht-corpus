        artikel: '52'
      - id: ref3
        bwb_id: BWBR0007133
        artikel: '52'
  - number: '11.2'
    text: |-
      [Artikel 2, eerste en tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009768#Artikel2
    url: https://wetten.overheid.nl/BWBR0009768/2005-01-01#Artikel11
    references:
