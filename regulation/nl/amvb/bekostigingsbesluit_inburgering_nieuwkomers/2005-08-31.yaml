$id: bekostigingsbesluit_inburgering_nieuwkomers
regulatory_layer: AMVB
publication_date: '2005-05-31'
valid_from: '2005-08-31'
bwb_id: BWBR0009768
url: https://wetten.overheid.nl/BWBR0009768/2005-08-31
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Onderwijs, Cultuur en Wetenschappen van 20 februari 1998, nr. 1998/6108
    (3713), directie Wetgeving en Juridische Zaken, mede namens de Minister van Volksgezondheid, Welzijn en Sport en na
    overleg met Onze Minister van Binnenlandse Zaken;

    Gelet op artikel 2.3.1, tweede lid, van de Wet educatie en beroepsonderwijs, en artikel 16 van de Wet inburgering
    nieuwkomers;

    De Raad van State gehoord (advies van 15 mei 1998, nr. W05.98 0072);

    Gezien het nader rapport van Onze Minister van Onderwijs, Cultuur en Wetenschappen van 2 juli 1998, nr.
    1998/27101 (3713), directie Wetgeving en Juridische Zaken, mede namens de Staatssecretaris van Volksgezondheid,
    Welzijn en Sport en na overleg met Onze Minister van Binnenlandse Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel1
  - number: 1.a
    text: |-
      de wet: de [Wet inburgering nieuwkomers][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009544
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009544
  - number: 1.b
    text: 'Onze Minister: Onze Minister voor Vreemdelingenzaken en Integratie;'
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel1
  - number: 1.c
    text: |-
      inburgeringsprogramma: een programma als bedoeld in [artikel 6, eerste lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009544#Artikel6
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009544
        artikel: '6'
  - number: 1.d
    text: |-
      nieuwkomer: de nieuwkomer, bedoeld in [artikel 1, onder a, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009544#Artikel1
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009544
        artikel: '1'
  - number: 1.e
    text: |-
      beschikking omtrent een inburgeringsprogramma: zowel de vaststelling van een inburgeringsprogramma op grond van
      [artikel 5, eerste lid, van de wet][ref1], als het besluit het vaststellen van een inburgeringsprogramma achterwege
      te laten, op grond van [artikel 5, tweede lid, van de wet][ref2], tenzij uit het besluit anders blijkt;


      [ref1]: https://wetten.overheid.nl/BWBR0009544#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009544#Artikel5
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009544
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0009544
        artikel: '5'
  - number: 1.f
    text: |-
      verklaring: de door het bevoegd gezag van een instelling uitgereikte verklaring, bedoeld in
      [artikel 7.4.15, eerste lid, van de Wet educatie en beroepsonderwijs][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 1.g
    text: |-
      rijksbijdrage: de bijdrage die Onze Minister aan een gemeente verstrekt ten behoeve van educatieve programma’s,
      bedoeld in [artikel 6, eerste lid, onder a, van de wet][ref1] en ten behoeve van het geheel van de activiteiten,
      bedoeld in [artikel 16 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009544#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0009544#Artikel16
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009544
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0009544
        artikel: '16'
  - number: '2.1'
    text: 'De rijksbijdrage voor een gemeente wordt berekend op de grondslag van:'
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel2
  - number: 2.1.a
    text: |-
      het aantal door het college van burgemeester en wethouders ontvangen afschriften van verklaringen uitgereikt in het
      jaar waarop de rijksbijdrage betrekking heeft, en
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel2
  - number: 2.1.b
    text: |-
      het aantal nieuwkomers ten aanzien van wie het college van burgemeester en wethouders in dat jaar een beschikking
      omtrent een inburgeringsprogramma heeft genomen.
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel2
  - number: '2.2'
    text: |-
      Onze Minister bepaalt de hoogte van het bedrag dat beschikbaar is per verklaring, respectievelijk beschikking
      omtrent een inburgeringsprogramma.
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel2
  - number: '2.3'
    text: |-
      De in het eerste lid bedoelde rijksbijdrage voor een gemeente wordt berekend met de formule [ ( a x b ) + ( c
      x d ) ] waarin wordt voorgesteld: - met de letter a: het aantal door het college van burgemeester en wethouders
      ontvangen afschriften van verklaringen die zijn uitgereikt in het jaar waarop de rijksbijdrage betrekking heeft;
        - met de letter b: het bedrag dat met inachtneming van het bepaalde in het tweede lid beschikbaar is per
      verklaring;
        - met de letter c: het aantal nieuwkomers ten aanzien van wie in het jaar waarop de rijksbijdrage betrekking heeft,
      het college van burgemeester en wethouders een beschikking omtrent een inburgeringsprogramma heeft genomen;
        - met de letter d: het bedrag dat met inachtneming van het bepaalde in het tweede lid beschikbaar is per
      beschikking omtrent een inburgeringsprogramma.
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel2
  - number: '2.4'
    text: |-
      De in het eerste lid bedoelde rijksbijdragen zijn in afwijking van het derde lid, nihil voor een gemeente als
      bedoeld in [artikel 1, onderdeel b, van het Besluit brede doeluitkering sociaal, integratie en veiligheid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018238#Artikel1
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0018238
        artikel: '1'
  - number: 2a.1
    text: De rijksbijdrage, bedoeld in artikel 2, voor 2004 kan eenmalig worden verhoogd.
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel2a
  - number: 2a.2
    text: |-
      Deze verhoging is afhankelijk van de door de gemeente opgebouwde reserve, bedoeld in artikel 3, derde lid,
      onderdeel c, op 31 december 2002 en wordt berekend met de formule: X = Y – ½ Z waarin wordt voorgesteld: - met de
      letter X: het bedrag van de eenmalige verhoging van de rijksbijdrage voor 2004;
        - met de letter Y: het verschil tussen de rijksbijdrage op grond van de meerjarenraming in de rijksbegroting voor
      2003 en de rijksbijdrage die voor 2004 is toegekend;
        - met de letter Z: de door de gemeente opgebouwde reserve, bedoeld in artikel 3, derde lid, onderdeel c, op 31
      december 2002.
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel2a
  - number: 2a.3
    text: |-
      Het bedrag van de eenmalige verhoging van de rijksbijdrage, bedoeld in het tweede lid, wordt verstrekt uiterlijk 1
      juni 2004.
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel2a
  - number: '3.1'
    text: Onze Minister verleent jaarlijks een voorschot op de rijksbijdrage aan een gemeente.
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel3
  - number: '3.2'
    text: 'Het voorschot wordt berekend op de grondslag van:'
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel3
  - number: 3.2.a
    text: |-
      het aantal door het college van burgemeester en wethouders ontvangen afschriften van verklaringen, uitgereikt in
      het tweede jaar voorafgaand aan het jaar waarop de rijksbijdrage betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel3
  - number: 3.2.b
    text: |-
      het aantal nieuwkomers ten aanzien van wie het college van burgemeester en wethouders in dat tweede jaar een
      beschikking omtrent een inburgeringsprogramma heeft genomen.
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel3
  - number: '3.3'
    text: |-
      Het voorschot voor een gemeente wordt berekend met de formule [ ( e × f ) + ( g × h ) ] × i waarin wordt
      voorgesteld: '- met de letter e: het aantal door het college van burgemeester en wethouders ontvangen afschriften'
      van verklaringen die zijn uitgereikt in het tweede jaar voorafgaand aan het jaar waarop de rijksbijdrage betrekking
      heeft;
        - met de letter f: het bedrag dat met inachtneming van het bepaalde in [artikel 2, tweede lid][ref1], beschikbaar
      is per verklaring;
        - met de letter g: het aantal nieuwkomers ten aanzien van wie in het tweede jaar voorafgaand aan het jaar
      waarop de rijksbijdrage betrekking heeft het college van burgemeester en wethouders een beschikking omtrent een
      inburgeringsprogramma heeft genomen;
        - met de letter h: het bedrag dat met inachtneming van het bepaalde in [artikel 2, tweede lid][ref2], beschikbaar
      is per beschikking omtrent een inburgeringsprogramma;
        - met de letter i: de jaarlijks door Onze Minister vastgestelde correctiefactor.


      [ref1]: https://wetten.overheid.nl/BWBR0009768#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009768#Artikel2
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009768
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0009768
        artikel: '2'
  - number: '3.4'
    text: Het voorschot wordt vastgesteld voor 1 oktober voorafgaande aan het jaar waarop de rijksbijdrage betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel3
  - number: '3.5'
    text: |-
      Het voorschot wordt vastgesteld onder voorbehoud van goedkeuring van de beschikbare middelen door de
      begrotingswetgever. Het voorschot kan worden verhoogd of verlaagd in verband met wijzigingen van de rijksbegroting
      voor het jaar waarin het voorschot wordt verleend.
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel3
  - number: '4.1'
    text: |-
      Het college van burgemeester en wethouders deelt Onze Minister voor 1 april van het jaar volgend op het jaar
      waarop de rijksbijdrage betrekking heeft het in [artikel 2, eerste lid][ref1], bedoelde aantal verklaringen en
      beschikkingen mede. De gegevens zijn voorzien van een verklaring omtrent de getrouwheid en rechtmatigheid, afgegeven
      door een accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009768#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009768
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '4.2'
    text: |-
      Indien de in het eerste lid bedoelde gegevens en verklaring van getrouwheid en rechtmatigheid niet voor de in het
      eerste lid genoemde termijn door Onze Minister zijn ontvangen, wordt het college van burgemeester en wethouders
      binnen een door Onze Minister te bepalen termijn in de gelegenheid gesteld dit verzuim te herstellen.
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel4
  - number: '4.3'
    text: |-
      Indien Onze Minister de in het eerste lid bedoelde gegevens en verklaring omtrent de getrouwheid en rechtmatigheid
      niet voor 1 juli van het in het eerste lid bedoelde jaar heeft ontvangen, stelt Onze Minister de rijksbijdrage vast
      op nihil.
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel4
  - number: '4.4'
    text: |-
      Onverminderd het bepaalde in het derde lid, stelt Onze Minister de rijksbijdrage vast voor 1 oktober van het jaar
      volgend op het jaar waarop de rijksbijdrage betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel4
  - number: '4.5'
    text: |-
      De rijksbijdrage wordt vastgesteld onder voorbehoud van goedkeuring van de beschikbare middelen door de
      begrotingswetgever. De vastgestelde rijksbijdrage kan worden verhoogd of verlaagd in verband met wijzigingen van de
      rijksbegroting voor het desbetreffende jaar.
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel4
  - number: '4.6'
    text: |-
      Het bedrag van de vastgestelde rijksbijdrage wordt binnen twaalf maanden na de vaststelling ervan aan een gemeente
      betaald onder verrekening van het ingevolge [artikel 3, eerste lid][ref1], aan die gemeente verleende voorschot.


      [ref1]: https://wetten.overheid.nl/BWBR0009768#Artikel3
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009768
        artikel: '3'
  - number: '4.7'
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden gegeven voor het verstrekken van de in het eerste lid
      bedoelde gegevens.
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel4
  - number: '4.8'
    text: |-
      Ten behoeve van de verklaring omtrent de getrouwheid en rechtmatigheid stelt Onze Minister een controleprotocol
      vast. Aan Onze Minister wordt op diens verzoek inzicht gegeven in de gegevens die bij de controle op enigerlei
      wijze een rol spelen, en in de controlerapporten van de accountant.
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel4
  - number: '5.1'
    text: |-
      Het college van burgemeester en wethouders kan de in dit besluit geregelde rijksbijdrage aanwenden tezamen met de
      colleges van burgemeester en wethouders van een of meer andere gemeenten, indien tevens de andere in dit besluit
      geregelde rijksbijdrage voor datzelfde jaar tezamen met die andere gemeente of gemeenten wordt aangewend.
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel5
  - number: '5.2'
    text: |-
      In geval van samenwerking als bedoeld in het eerste lid, dragen de samenwerkende gemeenten aan een van hen de
      bevoegdheid over tot het ontvangen van de rijksbijdragen, het inzenden van een schriftelijk verslag over de
      activiteiten waarvoor de rijksbijdragen zijn verstrekt en de verstrekking van de in [artikel 4, eerste lid][ref1],
      bedoelde gegevens en de in [artikel 7, eerste lid][ref2], bedoelde aanvullende inlichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0009768#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009768#Artikel7
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009768
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0009768
        artikel: '7'
  - number: '5.3'
    text: |-
      In geval van samenwerking als bedoeld in het eerste lid, stellen de colleges van burgemeester en wethouders van
      de samenwerkende gemeenten Onze Minister daarvan in kennis voor 1 december voorafgaand aan het jaar waarop de
      rijksbijdrage betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel5
  - number: '5.4'
    text: 'De melding, bedoeld in het derde lid, bevat van de betrokken gemeenten:'
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel5
  - number: 5.4.a
    text: de namen van die gemeenten,
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel5
  - number: 5.4.b
    text: de naam van de gemeente waaraan de in het tweede lid genoemde bevoegdheid is overgedragen, en
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel5
  - number: 5.4.c
    text: |-
      een verklaring van elke gemeente waaruit de in het tweede lid bedoelde overdracht van bevoegdheid aan de daar
      bedoelde gemeente blijkt.
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel5
  - number: '6'
    text: |-
      Het college van burgemeester en wethouders zendt jaarlijks voor 1 april van het jaar volgend op het jaar waarvoor
      de rijksbijdrage is verstrekt, aan Onze Minister een schriftelijk verslag over de activiteiten waarvoor de
      rijksbijdrage is verstrekt. Bij ministeriële regeling worden voorschriften gegeven voor de inrichting van het
      verslag.
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel6
  - number: '7.1'
    text: |-
      Het college van burgemeester en wethouders van een gemeente verstrekt desgevraagd aan Onze Minister aanvullende
      inlichtingen omtrent de in [artikel 4, eerste lid][ref1], bedoelde gegevens en het gemeentelijk verslag
      inburgeringsactiviteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0009768#Artikel4
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009768
        artikel: '4'
  - number: '7.2'
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden gegeven inzake de verstrekking van de in het eerste lid
      bedoelde inlichtingen.
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel7
  - number: '8.1'
    text: |-
      Onze Minister kan de vastgestelde rijksbijdrage binnen een periode van 5 jaar na de bekendmaking intrekken of ten
      nadele van de gemeente wijzigen:
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel8
  - number: 8.1.a
    text: |-
      op grond van feiten of omstandigheden waarvan Onze Minister bij de vaststelling van de rijksbijdrage redelijkerwijs
      niet op de hoogte kon zijn en op grond waarvan de rijksbijdrage lager zou zijn vastgesteld;
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel8
  - number: 8.1.b
    text: indien de vaststelling van de rijksbijdrage onjuist was en de gemeente dit wist of behoorde te weten;
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel8
  - number: 8.1.c
    text: |-
      indien de gemeente na de vaststelling van de rijksbijdrage niet heeft voldaan aan de voorschriften, vastgesteld bij
      en krachtens dit besluit.
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel8
  - number: '8.2'
    text: |-
      De intrekking of wijziging werkt terug tot en met het tijdstip waarop de rijksbijdrage is vastgesteld, tenzij bij
      de intrekking of wijziging anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel8
  - number: '9.1'
    text: |-
      Bij het geheel of gedeeltelijk intrekken van de rijksbijdrage op grond van [artikel 8][ref1] besluit Onze Minister
      tot:


      [ref1]: https://wetten.overheid.nl/BWBR0009768#Artikel8
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009768
        artikel: '8'
  - number: 9.1.a
    text: het onmiddellijk terugvorderen van de middelen bij de desbetreffende gemeente, of
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel9
  - number: 9.1.b
    text: |-
      het verrekenen van de middelen met de rijksbijdrage aan de gemeente in het jaar nadat tot geheel of gedeeltelijk
      intrekken is besloten.
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel9
  - number: '9.2'
    text: |-
      Indien Onze Minister toepassing geeft aan het eerste lid, onderdeel a, worden de middelen binnen een termijn van 4
      weken nadat een daartoe strekkend besluit aan de gemeente is verzonden, door de gemeente terugbetaald.
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel9
  - number: '9.3'
    text: |-
      Na het verstrijken van de termijn, bedoeld in het tweede lid, is de gemeente zonder aanmaning of rechterlijke
      tussenkomst de wettelijke rente verschuldigd.
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel9
  - number: '10.1'
    text: |-
      In afwijking van het bepaalde in [artikel 3, tweede lid][ref1], wordt het voorschot voor het jaar 2005 voor een
      gemeente berekend op de grondslag van:


      [ref1]: https://wetten.overheid.nl/BWBR0009768#Artikel3
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009768
        artikel: '3'
  - number: 10.1.a
    text: |-
      het aantal door het college van burgemeester en wethouders ontvangen afschriften van verklaringen, uitgereikt in
      2003;
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel10
  - number: 10.1.b
    text: |-
      het aantal nieuwkomers ten aanzien van wie het college van burgemeester en wethouders in 2003 een beschikking
      omtrent een inburgeringsprogramma heeft genomen;
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel10
  - number: 10.1.c
    text: |-
      de door Onze Minister geraamde door een gemeente opgebouwde reserve aan niet bestede rijksbijdragen per 31 december
      2004.
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel10
  - number: '10.2'
    text: |-
      Het in het eerste lid bedoelde voorschot wordt berekend met de formule a = { [ ( b × c ) + ( d × e ) ] × f } – ½ g
      waarin wordt voorgesteld: - met de letter a: het voorschot voor het jaar 2005 voor een gemeente;
        - met de letter b: het aantal door het college van burgemeester en wethouders ontvangen afschriften van
      verklaringen die zijn uitgereikt in 2003;
        - met de letter c: het bedrag dat met inachtneming van het bepaalde in [artikel 2, tweede lid][ref1], beschikbaar
      is per verklaring;
        - met de letter d: het aantal nieuwkomers ten aanzien van wie in 2003 het college van burgemeester en wethouders
      een beschikking omtrent een inburgeringsprogramma heeft genomen;
        - met de letter e: het bedrag dat met inachtneming van het bepaalde in [artikel 2, tweede lid][ref2], beschikbaar
      is per beschikking omtrent een inburgeringsprogramma;
        - met de letter f: de door Onze Minister vastgestelde correctiefactor voor het jaar 2005;
        - met de letter g: de door Onze Minister geraamde door een gemeente opgebouwde reserve aan niet bestede
      rijksbijdragen per 31 december 2004.


      [ref1]: https://wetten.overheid.nl/BWBR0009768#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009768#Artikel2
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009768
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0009768
        artikel: '2'
  - number: '10.3'
    text: In de formule, bedoeld in het tweede lid, kunnen a en g niet kleiner zijn dan nul.
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel10
  - number: '10.4'
    text: |-
      Het voorschot voor het jaar 2005 wordt in afwijking van het bepaalde in [artikel 3, vierde lid][ref1], vastgesteld
      een maand na plaatsing van dit besluit in het Staatsblad.


      [ref1]: https://wetten.overheid.nl/BWBR0009768#Artikel3
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009768
        artikel: '3'
  - number: '11.1'
    text: |-
      In afwijking van het bepaalde in [artikel 2, eerste lid][ref1], wordt de rijksbijdrage voor het jaar 2005 voor een
      gemeente berekend op de grondslag van:


      [ref1]: https://wetten.overheid.nl/BWBR0009768#Artikel2
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009768
        artikel: '2'
  - number: 11.1.a
    text: |-
      het aantal door het college van burgemeester en wethouders ontvangen afschriften van verklaringen uitgereikt in
      2005;
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel11
  - number: 11.1.b
    text: |-
      het aantal nieuwkomers ten aanzien van wie het college van burgemeester en wethouders in 2005 een beschikking
      omtrent een inburgeringsprogramma heeft genomen, en
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel11
  - number: 11.1.c
    text: de door een gemeente opgebouwde reserve aan niet bestede rijksbijdragen per 31 december 2004.
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel11
  - number: '11.2'
    text: |-
      De in het eerste lid bedoelde rijksbijdrage wordt berekend met de formule h = [ ( i × j ) + ( k × l ) ] – ½ m
      waarin wordt voorgesteld: - met de letter h: de rijksbijdrage voor het jaar 2005 voor een gemeente;
        - met de letter i: het aantal door het college van burgemeester en wethouders ontvangen afschriften van
      verklaringen die zijn uitgereikt in 2005;
        - met de letter j: het bedrag dat met inachtneming van het bepaalde in [artikel 2, tweede lid][ref1], beschikbaar
      is per verklaring;
        - met de letter k: het aantal nieuwkomers ten aanzien van wie in 2005 het college van burgemeester en wethouders
      een beschikking omtrent een inburgeringsprogramma heeft genomen;
        - met de letter l: het bedrag dat met inachtneming van het bepaalde in [artikel 2, tweede lid][ref2], beschikbaar
      is per beschikking omtrent een inburgeringsprogramma;
        - met de letter m: de door een gemeente opgebouwde reserve aan niet bestede rijksbijdragen per 31 december 2004.


      [ref1]: https://wetten.overheid.nl/BWBR0009768#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009768#Artikel2
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009768
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0009768
        artikel: '2'
  - number: '11.3'
    text: In de formule, bedoeld in het tweede lid, kunnen h en m niet kleiner zijn dan nul.
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel11
  - number: '12.1'
    text: |-
      Onverminderd het bepaalde in [artikel 4][ref1] verstrekt Onze Minister uiterlijk 1 april 2006 aan een gemeente een
      eenmalige aanvullende rijksbijdrage. Deze rijksbijdrage wordt berekend op de grondslag van:


      [ref1]: https://wetten.overheid.nl/BWBR0009768#Artikel4
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009768
        artikel: '4'
  - number: 12.1.a
    text: |-
      het aantal door het college van burgemeester en wethouders ontvangen afschriften van verklaringen, uitgereikt in
      2003 en 2004;
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel12
  - number: 12.1.b
    text: |-
      het aantal nieuwkomers ten aanzien van wie het college van burgemeester en wethouders in 2003 en 2004 een
      beschikking omtrent een inburgeringsprogramma heeft genomen;
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel12
  - number: 12.1.c
    text: de door een gemeente per 31 december 2004 opgebouwde reserve aan niet bestede rijksbijdragen; en
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel12
  - number: 12.1.d
    text: |-
      het verschil tussen het totaal aan rijksbijdragen aan gemeenten op grond van de meerjarenraming in de
      rijksbegroting voor 2003 en de rijksbijdrage aan een gemeente voor 2004, verminderd met de in [artikel 2a][ref1]
      bedoelde rijksbijdrage aan die gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0009768#Artikel2a
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009768
        artikel: 2a
  - number: '12.2'
    text: |-
      De in het eerste lid bedoelde rijksbijdrage voor een gemeente wordt berekend met de formule: n = [ { ( o x p ) +
      ( q x r ) } – ( s + t ) ] – ½ u waarin wordt voorgesteld: - met de letter n: de rijksbijdrage als bedoeld in het
      eerste lid;
        - met de letter o: het door het college van burgemeester en wethouders ontvangen aantal afschriften van
      verklaringen in 2003 en 2004;
        - met de letter p: het bedrag dat met inachtneming van het bepaalde in [artikel 2, tweede lid][ref1], beschikbaar
      is per verklaring;
        - met de letter q: het aantal nieuwkomers ten aanzien van wie het college van burgemeester en wethouders in 2003 en
      2004 een beschikking heeft genomen;
        - met de letter r: het bedrag dat met inachtneming van het bepaalde in [artikel 2, tweede lid][ref2], beschikbaar
      is per beschikking omtrent een inburgeringsprogramma;
        - met de letter s: de som van de verleende rijksbijdragen voor de jaren 2003 en 2004 voor een gemeente;
        - met de letter t: het verschil tussen het totaal aan rijksbijdragen aan gemeenten op grond van de meerjarenraming
      in de rijksbegroting voor 2003 en de rijksbijdrage die voor het jaar 2004 aan een gemeente is toegekend, verminderd
      met de in [artikel 2a][ref3] bedoelde rijksbijdrage voor die gemeente; en
        - met de letter u: de door Onze Minister geraamde door een gemeente opgebouwde reserve aan niet bestede
      rijksbijdragen per 31 december 2004.


      [ref1]: https://wetten.overheid.nl/BWBR0009768#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009768#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0009768#Artikel2a
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009768
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0009768
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0009768
        artikel: 2a
  - number: '12.3'
    text: In de formule, bedoeld in het tweede lid, kunnen n en u niet kleiner zijn dan nul.
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel12
  - number: '13.1'
    text: |-
      In afwijking van het bepaalde in [artikel 6][ref1], zendt het college van burgemeester en wethouders voor 1 juli
      2005 aan Onze Minister een schriftelijk verslag over de activiteiten waarvoor de rijksbijdrage is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0009768#Artikel6
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009768
        artikel: '6'
  - number: '13.2'
    text: |-
      In afwijking van het bepaalde in [artikel 4, eerste lid][ref1], deelt het college van burgemeester
      en wethouders Onze Minister het in [artikel 2, eerste lid][ref2], bedoelde aantal verklaringen en
      beschikkingen met betrekking tot het jaar 2004 mede voor 1 juli 2005. De gegevens zijn voorzien van
      een verklaring omtrent de getrouwheid en rechtmatigheid, afgegeven door een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009768#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009768#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009768
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0009768
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '13.3'
    text: |-
      Indien de in het eerste lid bedoelde gegevens en verklaring van getrouwheid en rechtmatigheid niet binnen de in het
      eerste lid genoemde termijn zijn verstrekt, stelt Onze Minister het college van burgemeester en wethouders in de
      gelegenheid deze binnen drie weken alsnog te verstrekken.
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel13
  - number: '13.4'
    text: |-
      Indien het college van burgemeester en wethouders de in het eerste lid bedoelde gegevens en verklaring van
      getrouwheid en rechtmatigheid niet binnen de in het tweede lid bedoelde termijn verstrekt, wordt de rijksbijdrage
      voor het jaar 2004 volgens [artikel 2][ref1] berekend, met dien verstande dat wordt uitgegaan van de helft van het
      aantal verklaringen en beschikkingen omtrent een inburgeringsprogramma op grond waarvan de rijksbijdrage voor die
      gemeente is berekend in 2001.


      [ref1]: https://wetten.overheid.nl/BWBR0009768#Artikel2
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009768
        artikel: '2'
  - number: '13.5'
    text: |-
      Het college van burgemeester en wethouders dient bij Onze Minister voor 1 juli 2005 een financiële verantwoording
      in waaruit blijkt:
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel13
  - number: 13.5.a
    text: dat de rijksbijdrage voor het jaar 2004 rechtmatig is aangewend;
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel13
  - number: 13.5.b
    text: |-
      of, en zo ja op welke wijze, het deel van de rijksbijdrage 2004 dat was bestemd voor educatieve programma’s als
      bedoeld in [artikel 6, eerste lid, onder a, van de wet][ref1] geheel of gedeeltelijk is aangewend voor het geheel
      van de activiteiten als bedoeld in [artikel 16 van de wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0009544#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0009544#Artikel16
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009544
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0009544
        artikel: '16'
  - number: 13.5.c
    text: |-
      of, en zo ja op welke wijze, het deel van de rijksbijdrage 2004 dat was bestemd voor het geheel van de activiteiten
      als bedoeld in [artikel 16 van de wet][ref1] geheel of gedeeltelijk is aangewend voor educatieve programma’s als
      bedoeld in [artikel 6, eerste lid, onder a, van de wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0009544#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0009544#Artikel6
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009544
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0009544
        artikel: '6'
  - number: 13.5.d
    text: |-
      of, en zo ja op welke wijze, een gedeelte van de rijksbijdrage 2004 is bestemd voor opleidingen educatie als
      bedoeld in [artikel 7.3.1. van de Wet educatie en beroepsonderwijs][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 13.5.e
    text: |-
      of, en zo ja op welke wijze, een gedeelte van de rijksbijdrage 2004 is bestemd voor activiteiten als bedoeld in
      [artikel 2, onderdeel k, van de Welzijnswet 1994][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006705#Artikel2
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006705
        artikel: '2'
  - number: 13.5.f
    text: |-
      of, en zo ja op welke wijze, een gedeelte van de rijksbijdrage 2004 is gereserveerd ten behoeve van educatieve
      programma’s als bedoeld in [artikel 6, eerste lid, onder a, van de wet][ref1] of ten behoeve van het geheel van de
      activiteiten als bedoeld in [artikel 16 van de wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0009544#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0009544#Artikel16
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009544
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0009544
        artikel: '16'
  - number: 13.5.g
    text: in voorkomende gevallen de stand van de reserveringen en de toevoegingen en onttrekkingen aan de reserve, alsmede,
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel13
  - number: 13.5.h
    text: |-
      in voorkomende gevallen dat het college van burgemeester en wethouders middelen die zijn verstrekt op grond van
      de [Welzijnswet 1994][ref1] of op grond van de [Wet educatie en beroepsonderwijs][ref2] wat opleidingen educatie
      betreft, heeft aangewend voor inburgering van nieuwkomers.


      [ref1]: https://wetten.overheid.nl/BWBR0006705
      [ref2]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006705
      - id: ref2
        bwb_id: BWBR0007625
  - number: '13.6'
    text: |-
      De financiële verantwoording wordt ingericht volgens een door Onze Minister vastgesteld model en is voorzien
      van een verklaring omtrent de getrouwheid en rechtmatigheid, afgegeven door een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1]. [Artikel 4, achtste lid][ref2], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
      [ref2]: https://wetten.overheid.nl/BWBR0009768#Artikel4
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
      - id: ref2
        bwb_id: BWBR0009768
        artikel: '4'
  - number: '13.7'
    text: |-
      In geval toepassing is gegeven aan [artikel 5][ref1] vermeldt de gemeente die de rijksbijdragen voor het jaar
      2004 verantwoordt in de financiële verantwoording de verdeling van de in [artikel 2][ref2] bedoelde aantallen
      verklaringen en genomen beschikkingen omtrent een inburgeringsprogramma over de samenwerkende gemeenten.


      [ref1]: https://wetten.overheid.nl/BWBR0009768#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009768#Artikel2
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009768
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0009768
        artikel: '2'
  - number: '13.8'
    text: |-
      In geval toepassing is gegeven aan [artikel 5][ref1] vermeldt de in het zevende lid bedoelde gemeente in de
      financiële verantwoording de bedragen die zijn ontvangen van de andere gemeente of gemeenten alsmede de in de
      [artikel 2, eerste lid][ref2], bedoelde gegevens met betrekking tot die andere gemeente of gemeenten.


      [ref1]: https://wetten.overheid.nl/BWBR0009768#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009768#Artikel2
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009768
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0009768
        artikel: '2'
  - number: '13.9'
    text: |-
      Het bepaalde in [artikel 4, vierde lid][ref1], is niet van toepassing met betrekking tot de voor een gemeente
      vastgestelde rijksbijdrage voor het jaar 2004.


      [ref1]: https://wetten.overheid.nl/BWBR0009768#Artikel4
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009768
        artikel: '4'
  - number: '14.2'
    text: |-
      De in het eerste lid bedoelde vervallen bepalingen blijven gelden voor de tot de datum van inwerkingtreding van het
      Bekostigingsbesluit inburgering nieuwkomers verleende uitkeringen.
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel14
  - number: '15'
    text: |-
      Dit besluit treedt in werking op het tijdstip waarop de [Wet inburgering nieuwkomers][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0009544
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009544
  - number: '16'
    text: 'Dit besluit wordt aangehaald als: Bekostigingsbesluit inburgering nieuwkomers.'
    url: https://wetten.overheid.nl/BWBR0009768/2005-08-31#Artikel16
