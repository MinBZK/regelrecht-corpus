  - number: '11'
    text: |-
      1 De takenboeken worden door de directeur van de school tijdig vóór de aanvang van het derde studiejaar aan de
      leerlingen, die naar dat studiejaar zijn bevorderd, ter hand gesteld.

      Gelijktijdig doet de inspecteur van het nautisch onderwijs een opgave van de naar dat studiejaar bevorderde
      leerlingen toekomen aan Onze Minister.

      2 De leerling die zijn dienst aan boord is aangevangen, richt zich bij de uitvoering van de in het takenboek
      vervatte opdrachten in de eerste plaats naar de in [artikel 10, eerste lid][ref1], bedoelde richtlijnen en naar de
      in [het vijfde lid van dit artikel][ref2] bedoelde aanwijzingen welke hem eventueel gedurende zijn diensttijd door
      de deskundige en de leraar worden gegeven, en voor het overige naar de aanwijzingen van de mentor.

      3 De leerling zendt met regelmatige tussenpozen, niet langer dan twee maanden, door tussenkomst van de mentor, de
      kapitein en de reder een door hem behandeld deel van het takenboek toe aan de directeur van de school, waar hij als
      leerling is ingeschreven; hij bewaart zelf een doorslag van het betreffende deel aan boord.

      4 De directeur van de school stelt de deskundige na ontvangst in het bezit van een copie van het ingezonden deel
      van het takenboek of stelt de deskundige in staat daarvan inzage en, indien gewenst, copie te nemen.

      5 De deskundige en de leraar geven de leerling zo nodig aanwijzingen naar aanleiding van de door hem ingezonden
      delen van het takenboek.

      6 Nadat het laatste deel van het takenboek is ontvangen, adviseert de deskundige zo spoedig mogelijk Onze Minister,
      die de leerling, door tussenkomst van de directeur van de school, in kennis stelt van zijn eindoordeel.

      7 Het takenboek wordt bewaard in het archief van de school.


      [ref1]: https://wetten.overheid.nl/BWBR0003046#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003046#Artikel11
