        artikel: '9'
        hoofdstuk: III
  - number: '10'
    text: |-
      1 Het takenboek, bedoeld in de [artikelen 4][ref1] en [7][ref2], bevat een aantal opdrachten, die door de leerling
      overeenkomstig de in het takenboek gegeven richtlijnen gedurende zijn diensttijd aan boord dienen te worden
      uitgevoerd. De richtlijnen geven tevens aan de wijze, waarop door hem in het takenboek verslag dient te worden
      gedaan over de uitvoering van die opdrachten.

      2 De in het takenboek genoemde opdrachten dienen onder andere betrekking te hebben op de onderwerpen, die Onze
      Minister, vooral met het oog op de veiligheid van het schip en de doelmatigheid van de bedrijfsvoering aan boord,
      voor de vorming van de leerling van bijzonder belang acht.

      3 In het takenboek wordt eveneens een plaats ingeruimd voor de vermelding van zakelijke gegevens zoals personalia,
      duur van de diensttijd, samenvatting der verrichte werkzaamheden en andere daarvoor in aanmerking komende
      onderwerpen; het takenboek wordt dubbelbladig uitgevoerd.

      4 Onze Minister stelt in overeenstemming met Onze Minister van Onderwijs en Wetenschappen het model, de richtlijnen
      en de inhoud van het takenboek vast.


      [ref1]: https://wetten.overheid.nl/BWBR0003046#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003046#Artikel7
    url: https://wetten.overheid.nl/BWBR0003046/1973-05-01#Artikel10
