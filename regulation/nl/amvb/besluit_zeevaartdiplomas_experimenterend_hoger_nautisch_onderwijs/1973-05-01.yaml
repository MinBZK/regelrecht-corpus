        bwb_id: BWBR0003046
        artikel: '4'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003046
        artikel: '7'
        hoofdstuk: III
  - number: '17'
    text: >-
      Ter zake van de afgifte van krachtens dit besluit uit te reiken diploma's is een vergoeding verschuldigd volgens
      een door Onze Minister vast te stellen tarief, te voldoen door degene die zulk een diploma verlangt op de door Onze
      Minister aan te geven wijze.
    url: https://wetten.overheid.nl/BWBR0003046/1973-05-01#Artikel17
  - number: '18'
    text: |-
      1 Alvorens krachtens dit besluit een diploma als derde, tweede of eerste stuurman voor de grote handelsvaart
      onderscheidenlijk een diploma A, B of C als scheepswerktuigkundige wordt uitgereikt, dient de gegadigde aan Onze
      Minister de navolgende bescheiden over te leggen.

      a. het diploma van een school, afdeling navigatie of afdeling scheepswerktuigkunde;

      b. de verklaring inzake de behaalde diensttijd, als bedoeld in [artikel 2][ref1];

      c. een uittreksel te zijnen name uit het geboorteregister of een ander geldig identiteitbewijs;

      d. een pasfoto in drievoud;

      e. het bewijs van storting of overschrijving van het in [artikel 17][ref2] bedoelde bedrag.

      2 De gegadigde dient bovendien aan Onze Minister over te leggen:

      a. voor het diploma als tweede stuurman voor de grote handelsvaart: het krachtens dit besluit uitgereikte diploma
      als derde stuurman voor de grote handelsvaart;

      b. voor het diploma als eerste stuurman voor de grote handelsvaart:

      - het krachtens dit besluit uitgereikte diploma als tweede stuurman voor de grote handelsvaart;
      - de in [artikel 6, vierde lid][ref3], bedoelde verklaringen;

      c. voor het diploma B als scheepswerktuigkundige: het krachtens dit besluit uitgereikte diploma A als
      scheepswerktuigkundige;

      d. voor het diploma C als scheepswerktuigkundige:

      - het krachtens dit besluit uitgereikte diploma B als scheepswerktuigkundige;
      - de in [artikel 9, vierde lid][ref4], bedoelde verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0003046#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003046#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0003046#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0003046#Artikel9
    url: https://wetten.overheid.nl/BWBR0003046/1973-05-01#Artikel18
