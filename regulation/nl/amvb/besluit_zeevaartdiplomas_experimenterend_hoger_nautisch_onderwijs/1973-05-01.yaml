  - number: '3'
    text: >-
      Aan bezitters van een diploma van een school - afdeling navigatie of afdeling scheepswerktuigkunde - wordt op
      hun verzoek door Onze Minister een diploma als derde, tweede of eerste stuurman voor de grote handelsvaart,
      onderscheidenlijk een diploma A, B of C als scheepswerktuigkundige uitgereikt op de in dit besluit gestelde
      voorwaarden.
    url: https://wetten.overheid.nl/BWBR0003046/1973-05-01#Artikel3
  - number: '4'
    text: >-
      1 Ter verkrijging van het diploma als derde stuurman voor de grote handelsvaart dient de bezitter van een diploma
      van een school, afdeling navigatie, tussen het tweede en het vierde studiejaar van die school te hebben dienst
      gedaan als stuurmansleerling, en moet hij gedurende die diensttijd onder begeleiding en toezicht van een mentor en
      ten genoege van de deskundige een takenboek hebben bijgehouden.


      2 De in het voorgaande lid bedoelde diensttijd bedraagt ten minste 365 dagen en moet zijn behaald:


      a. hetzij aan boord van een zeeschip voor de grote handelsvaart, onder toezicht van een mentor in het bezit van ten
      minste het diploma als tweede stuurman voor de grote handelsvaart;


      b. hetzij aan boord van een zeeschip voor de grote sleepvaart met een lengte van meer dan 40 meter, onder toezicht
      van een mentor in het bezit van ten minste het diploma als stuurman voor de grote sleepvaart.


      3 In afwijking van het bepaalde in het tweede lid mag van de aldaar bedoelde diensttijd een gedeelte van ten
      hoogste 30 dagen worden vervangen door dienst buitengaats als stuurmansleerling aan boord van een ten behoeve van
      het onderwijs aan de school gebezigd opleidingsschip, en kan, zulks ter beoordeling van Onze Minister, daarenboven
      een gedeelte van ten hoogste 30 dagen worden vervangen door andere dienst.


      Op de dienst aan boord van een opleidingsschip vindt het bepaalde in dit besluit met betrekking tot het bijhouden
      van een takenboek geen toepassing.


      4 Indien de gegadigde minder diensttijd heeft behaald dan aangegeven in de vorige leden of indien het takenboek
      onvoldoende wordt geoordeeld of onvolledig is bijgehouden, kan Onze Minister toestaan, dat de gegadigde door
      middel van een aanvullende diensttijd alsnog in staat wordt gesteld in het ontbrekende te voorzien, tenzij de hier
      bedoelde tekortkomingen van dien aard zijn, dat deze naar het oordeel van de deskundige niet binnen een termijn van
      drie maanden naar behoren kunnen worden hersteld.


      De gegadigde kan slechts één maal van de in dit lid geboden mogelijkheid gebruik maken.
    url: https://wetten.overheid.nl/BWBR0003046/1973-05-01#Artikel4
  - number: '5'
    text: >-
      Ter verkrijging van het diploma als tweede stuurman voor de grote handelsvaart dient de bezitter van een diploma
      van een school, afdeling navigatie, in het bezit van een krachtens dit besluit uitgereikt diploma als derde
      stuurman voor de grote handelsvaart gedurende ten minste twee jaren te hebben dienstgedaan als wachtdoend stuurman
      aan boord van zeeschepen in de handelsvaart met een lengte van meer dan 60 meter, dan wel op zeeschepen in de grote
      sleepvaart met een lengte van meer dan 40 meter, met dien verstande dat deze diensttijd voor ten hoogste een jaar
      mag worden vervangen door diensttijd als wachtdoend stuurman op andere zeeschepen.
    url: https://wetten.overheid.nl/BWBR0003046/1973-05-01#Artikel5
  - number: '6'
    text: |-
      1 Ter verkrijging van het diploma als eerste stuurman voor de grote handelsvaart dient de bezitter van een diploma
      van een school, afdeling navigatie:

      a. in het bezit van een krachtens dit besluit uitgereikt diploma als tweede stuurman voor de grote handelsvaart
      gedurende ten minste twee jaren te hebben dienst gedaan als wachtdoend stuurman, hetzij aan boord van zeeschepen
      in de handelsvaart met een lengte van meer dan 60 meter, hetzij aan boord van zeeschepen in de grote sleepvaart met
      een lengte van meer dan 40 meter;

      b. na het behalen van [de onder ][ref1] bedoelde diensttijd een door of vanwege de school gegeven cursus
      scheepvaartkunde te hebben gevolgd, welke door middel van een discussie tussen de docent of docenten en de
      kandidaat zal worden afgesloten;

      c. Na het behalen van [de onder ][ref2] bedoelde diensttijd met goed gevolg een proeve van kennis en bekwaamheid te
      hebben afgelegd op het gebied van de radarnavigatie.

      2 De in het voorgaande lid onder *b* bedoelde cursus scheepvaartkunde omvat ten minste de verantwoordelijkheids- en
      beleidsaspecten, samenhangend met de functie van gezagvoerder.

      Onze Minister en Onze Minister van Onderwijs en Wetenschappen stellen bij gezamenlijke beschikking een uitgewerkt
      programma voor de cursus vast.

      3 De in het eerste lid onder *b* bedoelde discussie vindt plaats in tegenwoordigheid van een of meer door Onze
      Minister aangewezen personen, die desverlangd daaraan kunnen deelnemen.

      De in het eerste lid onder *c* bedoelde proeve wordt afgenomen door de school, onder toezicht van een of meer door
      Onze Minister aangewezen personen.

      4 Indien aan het gestelde in het eerste lid onder *b* en *c* is voldaan, ontvangt de gegadigde daarvan een
      verklaring, af te geven door de school en mede ondertekend door de krachtens het voorgaande lid aangewezen
      personen.

      Onze Minister stelt in overeenstemming met Onze Minister van Onderwijs en Wetenschappen een model voor deze
      verklaringen vast.


      [ref1]: https://wetten.overheid.nl/BWBR0003046#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003046#Artikel6
    url: https://wetten.overheid.nl/BWBR0003046/1973-05-01#Artikel6
