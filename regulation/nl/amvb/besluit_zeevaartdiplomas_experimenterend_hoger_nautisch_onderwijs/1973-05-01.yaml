  text: >-
    Wij Juliana, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.


    Op de gemeenschappelijke voordracht van de Staatssecretaris van Verkeer en Waterstaat en de Staatssecretaris van
    Onderwijs en Wetenschappen, dr. G. Klein, van 27 april 1976, nr. S/S-21409, Directoraat-Generaal van Scheepvaart;


    Gelet op artikel 2, derde lid, van de Wet op de Zeevaartdiploma's 1935, Stb. 456;


    De Raad van State gehoord (advies van 16 juni 1976, nr. 11);


    Gezien het nader rapport van de voornoemde Staatssecretarissen van 16 juli 1976, nr. S/S-22292, Directoraat-
