  - number: '7'
    text: |-
      1 Ter verkrijging van het diploma A als scheepswerktuigkundige dient de bezitter van een diploma van een school,
      afdeling scheepswerktuigkunde, tussen het tweede en het vierde studiejaar van die school te hebben dienst gedaan
      als leerling scheepswerktuigkundige, en moet hij gedurende die diensttijd onder begeleiding en toezicht van een
      mentor en ten genoege van de deskundige een takenboek hebben bijgehouden.

      2 De in het voorgaande lid bedoelde diensttijd bedraagt ten minste 365 dagen en moet zijn behaald aan boord van een
      zeeschip in de handelsvaart of een zeeschip in de grote sleepvaart, met een voortstuwingsvermogen van ten minste
      4000 pk en onder toezicht van een mentor in het bezit van ten minste het diploma B als scheepswerktuigkundige.

      3 In afwijking van het bepaalde in het tweede lid mag van de aldaar bedoelde diensttijd een gedeelte van ten
      hoogste 30 dagen worden vervangen door dienst buitengaats als leerling scheepswerktuigkundige aan boord van een ten
      behoeve van het onderwijs aan de school gebezigd opleidingsschip en kan, zulks ter beoordeling van Onze Minister,
      daarenboven een gedeelte van ten hoogste 90 dagen worden vervangen door andere dienst.

      Op de dienst aan boord van een opleidingsschip vindt het bepaalde in dit besluit met betrekking tot het bijhouden
      van een takenboek geen toepassing.

      4 Het bepaalde in [het vierde lid van artikel 4][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003046#Artikel4
    url: https://wetten.overheid.nl/BWBR0003046/1973-05-01#Artikel7
