  - number: '19'
    text: >-
      Onze Minister stelt de modellen vast van de krachtens dit besluit uit te reiken diploma's als derde, tweede en
      eerste stuurman voor de grote handelsvaart, en van de diploma's A, B en C als scheepswerktuigkundige.
    url: https://wetten.overheid.nl/BWBR0003046/1973-05-01#Artikel19
  - number: '20'
    text: >-
      Onze Minister kan, hetzij in een incidenteel geval, hetzij algemeen, vrijstelling verlenen van het bepaalde in
      de [artikelen 4 tot en met 9 ](onbekend)van dit besluit, onder zo nodig door hem te stellen voorwaarden en op te
      leggen beperkingen.
    url: https://wetten.overheid.nl/BWBR0003046/1973-05-01#Artikel20
  - number: '21'
    text: >-
      Een duplicaat van een uitgereikt diploma wordt slechts afgegeven indien belanghebbende aannemelijk kan maken, dat
      het oorspronkelijke diploma verloren is geraakt.


      Voor een duplikaat is een door Onze Minister vast te stellen bedrag verschuldigd ten bate van 's Rijks schatkist,
      tenzij het oorspronkelijke diploma verloren is geraakt ten gevolge van een oorlogsdaad of van een scheepsramp.
    url: https://wetten.overheid.nl/BWBR0003046/1973-05-01#Artikel21
  - number: '22'
    text: Dit besluit kan worden aangehaald als "Besluit zeevaartdiploma's experimenterend hoger nautisch onderwijs".
    url: https://wetten.overheid.nl/BWBR0003046/1973-05-01#Artikel22
  - number: '23'
    text: >-
      Dit besluit treedt in werking met ingang van de tweede dag na de datum van uitgifte van het *Staatsblad* waarin het
      wordt geplaatst en werkt terug tot 1 mei 1973.
    url: https://wetten.overheid.nl/BWBR0003046/1973-05-01#Artikel23
