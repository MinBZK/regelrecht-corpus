      - id: ref2
        bwb_id: BWBR0003046
        artikel: '7'
        hoofdstuk: III
  - number: '15'
    text: >-
      1 De deskundige streeft, bij de formulering van de aanwijzingen voor het bijhouden van het takenboek en voor de
      uitvoering van de daaruit voortvloeiende werkzaamheden, een nauwe samenwerking na met de door de directeur van de
      school aangewezen leraar of leraren.


      2 Voor het beoordelen van in de school aanwezige takenboeken heeft de deskundige gedurende de normale uren van
      openstelling van de school toegang tot het schoolgebouw.


      De directeur van de school bevordert, dat de deskundige in het schoolgebouw een werkvertrek ter beschikking staat,
      en dat hem de verder nodige faciliteiten en medewerking worden verleend.


      3 De deskundigen ontvangen uit 's Rijks kas een vergoeding, voor zover de door hen aldus te verrichten
      werkzaamheden hun oorzaak niet vinden in het ambt dat zij bekleden.


      4 Onze Minister kan een instructie voor de deskundigen vaststellen, waaraan deze bij de uitoefening van hun functie
      gebonden zijn.
    url: https://wetten.overheid.nl/BWBR0003046/1973-05-01#Artikel15
  - number: '16'
    text: |-
      Voor zover de bepalingen van dit besluit niet voorzien in, dan wel niet rechtstreeks toepassing kunnen vinden
      op vervangende of aanvullende diensttijd, als bedoeld in de [artikelen 4, derde en vierde lid][ref1], en
      [7, derde en vierde lid][ref2], kan Onze Minister daaromtrent nadere voorschriften geven.


      [ref1]: https://wetten.overheid.nl/BWBR0003046#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003046#Artikel7
    url: https://wetten.overheid.nl/BWBR0003046/1973-05-01#Artikel16
    references:
