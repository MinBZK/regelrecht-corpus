  - number: '14'
    text: |-
      De reder, die iemand in de gelegenheid stelt als stuurmansleerling of leerling scheepswerktuigkundige op zijn schip
      of schepen de ingevolge [artikel 4][ref1], onderscheidenlijk [artikel 7][ref2], vereiste diensttijd te behalen,
      draagt er zorg voor, dat de betrokkene gedurende die diensttijd praktisch wordt bekwaamd voor zijn toekomstige
      functie en dat hij, alsmede de mentor en de kapitein, in de gelegenheid worden gesteld op de juiste wijze
      uitvoering te geven aan het bij of krachtens dit besluit bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0003046#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003046#Artikel7
    url: https://wetten.overheid.nl/BWBR0003046/1973-05-01#Artikel14
