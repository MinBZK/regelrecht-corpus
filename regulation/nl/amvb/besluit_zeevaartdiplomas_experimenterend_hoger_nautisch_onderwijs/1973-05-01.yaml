articles:
  - number: '1'
    text: >-
      Dit besluit verstaat onder:


      "Onze Minister": Onze Minister van Verkeer en Waterstaat;


      "school": een school als bedoeld in artikel 1 van het Eindexamenbesluit experimenterend hoger nautisch onderwijs
      (Besluit van 7 oktober 1975, *Stb.* 577);


      "deskundige": degene, die door Onze Minister is aangewezen om namens hem toezicht uit te oefenen op de wijze,
      waarop de ingevolge dit besluit vereiste diensttijd wordt doorgebracht door de gegadigde voor het diploma als derde
      stuurman voor de grote handelsvaart of voor het diploma A als scheepswerktuigkundige;


      "lengte": de lengte als bedoeld in artikel 1, eerste lid, van de Wet op de Zeevaartdiploma's 1935, *Stb.* 456.
    url: https://wetten.overheid.nl/BWBR0003046/1973-05-01#Artikel1
  - number: '2'
    text: |-
      1 Onverminderd het in [het derde lid van dit artikel][ref1] bepaalde wordt onder de diensttijd, bedoeld in de
      [artikelen 4][ref2], [5][ref3], [6, eerste lid][ref4], [7][ref5], [8][ref6] en [9, eerste lid][ref7], verstaan
      de tijd, doorgebracht aan boord van een in de vaart zijnd schip, begrepen tussen de data van aan- en afmonstering,
      blijkende uit verklaringen van de ambtenaren, ten overstaan van wie de aan- en afmonstering heeft plaatsgehad, of
      uit zodanige andere bescheiden, als daartoe door of vanwege Onze Minister voldoende worden geoordeeld.

      2 Indien de data van aan- en afmonstering ontbreken, wordt onder diensttijd aan boord van een in de vaart zijnd
      schip verstaan de tijd, begrepen tussen data, die door of vanwege Onze Minister worden geoordeeld voldoende
      overeenkomst te vertonen met die van aan- en afmonstering.

      3 Onder de in de [artikelen 4, derde lid][ref8], en [7, derde lid][ref9], bedoelde vervangende diensttijd,
      anders dan die welke is doorgebracht aan boord van een opleidingsschip, wordt verstaan de leertijd, met
      voorafgaande toestemming van Onze Minister doorgebracht in een bedrijf of onderneming, begrepen tussen de data van
      indiensttreding en ontslag, blijkende uit een verklaring van de directie van dat bedrijf of die onderneming.


