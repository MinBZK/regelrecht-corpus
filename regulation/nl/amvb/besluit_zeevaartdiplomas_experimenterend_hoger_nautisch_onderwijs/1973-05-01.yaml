  - number: '12'
    text: >-
      1 De kapitein van het schip, waarop de leerling in dienst is, wijst de scheepsofficier aan, die als mentor zal
      optreden.


      Hij draagt er zorg voor, dat de leerling en de mentor in staat worden gesteld, de uit dit besluit voor hen
      voortvloeiende taken naar behoren te verrichten.


      2 De kapitein ziet er voorts op toe, dat de leerling op tijd de onderscheidene delen van het takenboek aan hem
      doet toekomen.


      Na het betreffend deel van het takenboek van zijn handtekening te hebben voorzien, doet hij dit aan de reder
      toekomen, ter doorzending aan de directeur van de school.
    url: https://wetten.overheid.nl/BWBR0003046/1973-05-01#Artikel12
  - number: '13'
    text: |-
      1 De mentor ziet er op toe, dat de leerling de in het takenboek vervatte opdrachten uitvoert en het takenboek
      bijhoudt overeenkomstig de daarin opgenomen richtlijnen en de tussentijds door de deskundige of de door of vanwege
      de school verstrekte aanwijzingen.

      2 Voor zover de in het vorige lid bedoelde richtlijnen en aanwijzingen niet voorzien in de wijze van uitvoering van
      de door de leerling te verrichten werkzaamheden, geeft de mentor de leerling nadere aanwijzingen daaromtrent.

      3 Indien de mentor van oordeel is, dat het opvolgen van de in het eerste lid bedoelde aanwijzingen in verband met
      de werksituatie of de arbeidsverdeling aan boord op praktische bezwaren stuit, overlegt hij met de deskundige en de
      desbetreffende leraar van de school, in hoeverre een wijziging van de aanwijzing toelaatbaar en uitvoerbaar is.

      4 Indien de mentor blijkt dat de leerling, hoewel de werksituatie op de arbeidsverdeling aan boord daartoe geen
      aanleiding geeft, onvoldoende in staat wordt gesteld de uit het takenboek voortvloeiende werkzaamheden naar behoren
      uit te voeren, brengt hij [dit onder][ref1] de aandacht van de kapitein, onderscheidenlijk de hoofdwerktuigkundige,
      indien deze niet zelf als mentor is aangewezen, en geeft de mogelijkheden aan om daarin verbetering te brengen.

      5 Onze Minister kan de reder aanwijzingen geven omtrent de wijze, waarop de mentor zijn taak dient te vervullen.


      [ref1]: https://wetten.overheid.nl/BWBR0003046#Artikel13
    url: https://wetten.overheid.nl/BWBR0003046/1973-05-01#Artikel13
    references:
