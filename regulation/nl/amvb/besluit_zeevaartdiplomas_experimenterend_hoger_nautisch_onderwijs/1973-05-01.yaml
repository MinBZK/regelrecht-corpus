        hoofdstuk: II
  - number: '8'
    text: >-
      Ter verkrijging van het diploma B als scheepswerktuigkundige dient de bezitter van een diploma van een
      school, afdeling scheepswerktuigkunde, in het bezit van een krachtens dit besluit uitgereikt diploma A als
      scheepswerktuigkundige gedurende ten minste twee jaren te hebben dienst gedaan als scheepswerktuigkundige aan boord
      van zeeschepen in de handelsvaart of in de grote sleepvaart, met een voortstuwingsvermogen van ten minste 2500 pk.
    url: https://wetten.overheid.nl/BWBR0003046/1973-05-01#Artikel8
  - number: '9'
    text: |-
      1 Ter verkrijging van het diploma C als scheepswerktuigkundige dient de bezitter van een diploma van een school,
      afdeling scheepswerktuigkunde:

      a. in het bezit van een krachtens dit besluit uitgereikt diploma B als scheepswerktuigkundige gedurende ten minste
      twee jaren te hebben dienst gedaan als scheepswerktuigkundige aan boord van zeeschepen in de handelsvaart of in de
      grote sleepvaart, met een voortstuwingsvermogen van ten minste 4000 pk;

      b. na het behalen van [de onder ][ref1] bedoelde diensttijd een door of vanwege de school gegeven cursus
      scheepvaartkunde te hebben gevolgd, welke door middel van een discussie tussen de docent of docenten en de
      kandidaat zal worden afgesloten.

      2 De in het voorgaande lid onder *b* bedoelde cursus scheepvaartkunde omvat ten minste de verantwoordelijkheids- en
      beleidsaspecten, samenhangend met de functie van hoofdwerktuigkundige.

      Onze Minister en Onze Minister van Onderwijs en Wetenschappen stellen bij gezamenlijke beschikking een uitgewerkt
      programma voor de cursus vast.

      3 De in het eerste lid onder *b* bedoelde discussie vindt plaats in tegenwoordigheid van een of meer door Onze
      Minister aangewezen personen, die desverlangd daaraan kunnen deelnemen.

      4 Indien aan het gestelde in het eerste lid onder *b* is voldaan, ontvangt de gegadigde daarvan een verklaring, af
      te geven door de school en mede ondertekend door de krachtens het voorgaande lid aangewezen personen.

      Onze Minister stelt in overeenstemming met Onze Minister van Onderwijs en Wetenschappen een model voor deze
      verklaring vast.


      [ref1]: https://wetten.overheid.nl/BWBR0003046#Artikel9
    url: https://wetten.overheid.nl/BWBR0003046/1973-05-01#Artikel9
