        bwb_id: BWBR0011440
        artikel: '2'
  - number: '4.1'
    text: |-
      De beheerder maakt geen deel uit van een groep als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1] waartoe ook een rechtspersoon of vennootschap behoort die
      in Nederland gas produceert of levert of daarin handelt.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: '4.2'
    text: |-
      Rechtspersonen en vennootschappen die deel uitmaken van een groep als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1] waartoe ook een rechtspersoon of vennootschap behoort
      die in Nederland gas produceert of levert of daarin handelt, houden geen aandelen in de beheerder of in een
      rechtspersoon die deel uitmaakt van een groep waartoe ook de beheerder behoort en nemen niet deel in een
      vennootschap die deel uitmaakt van een groep waartoe ook de beheerder behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: '4.3'
    text: |-
      De beheerder en met de beheerder verbonden groepsmaatschappijen als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: 4.3.a)
    text: |-
      houden geen aandelen in een rechtspersoon die in Nederland gas produceert of levert of daarin handelt of in een
      rechtspersoon die deel uitmaakt van een groep waartoe ook een rechtspersoon behoort die in Nederland gas produceert
      of levert of daarin handelt;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel4
  - number: 4.3.b)
    text: |-
      nemen niet deel in een vennootschap die in Nederland gas produceert of levert of daarin handelt of in een
      vennootschap die deel uitmaakt van een groep waartoe ook een rechtspersoon of vennootschap behoort die in Nederland
      gas produceert of levert of daarin handelt.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel4
  - number: '4.4'
    text: |-
      De beheerder informeert Autoriteit Consument en Markt bij wijzigingen van de vennootschapsstructuur,
      zeggenschapsstructuur, of wijzigingen van een andere aard, die van invloed zijn op het bepaalde in dit artikel.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel4
  - number: '6.1'
    text: |-
      De beheerder heeft tot taak het in evenwicht houden van het net op basis van de door hem opgestelde
      balanceringsregels.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel6
  - number: '6.2'
    text: |-
      De balanceringsregels worden ontworpen op eerlijke, niet-discriminatoire en transparante wijze, zij zijn gebaseerd
      op objectieve criteria. De balanceringsregels zijn een afspiegeling van de werkelijke systeembehoeften, rekening
      houdend met de voor de beheerder beschikbare hulpmiddelen. Balanceringsregels zijn marktgericht.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel6
  - number: '6.3'
    text: De beheerder publiceert op een geschikte wijze en op een voor ieder toegankelijke website de balanceringsregels.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel6
  - number: '7.1'
    text: |-
      De beheerder en de netbeheerder van het landelijk gastransportnet sluiten met inachtneming van de
      [artikelen 9 tot en met 13][ref1] een overeenkomst en nemen daarbij in ieder geval op:


      [ref1]: https://wetten.overheid.nl/BWBR0042110#Artikel9
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0042110
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 7.1.a)
    text: voorschriften voor het beheersen van de gasstroom;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel7
  - number: 7.1.b)
    text: meetbeginselen ter bepaling van gashoeveelheden en -kwaliteit;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel7
  - number: 7.1.c)
    text: regels voor de toewijzing van gashoeveelheden;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel7
  - number: 7.1.d)
    text: communicatieprocedures in het geval van uitzonderlijke gebeurtenissen;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel7
  - number: 7.1.e)
    text: beslechting van geschillen in het kader van de overeenkomst;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel7
  - number: 7.1.f)
    text: wijzigingsprocedure voor de overeenkomst.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel7
  - number: '7.2'
    text: |-
      De in het eerste lid genoemde voorwaarden en bepalingen van de overeenkomst, of alle wijzigingen daarvan, worden
      binnen tien dagen na de sluiting of wijziging van de overeenkomst door de beheerder medegedeeld aan Autoriteit
      Consument en Markt.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel7
  - number: '7.3'
    text: Op verzoek van Onze Minister deelt de beheerder binnen een termijn van tien dagen de overeenkomst mee.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel7
  - number: '8'
    text: |-
      Voor uitvoering van de taak genoemd in [artikel 52a Gaswet][ref1], kan Onze Minister verlangen van de beheerder
      dat hij hem gegevens en inlichtingen verstrekt binnen een door hem te bepalen termijn en op een door hem te bepalen
      wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel52a
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 52a
  - number: '9.1'
    text: |-
      Met betrekking tot het beheersen van de gasstroom zorgen de beheerder en de netbeheerder van het landelijk
      gastransportnet ervoor dat in de overeenkomst, bedoeld in [artikel 7, eerste lid][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0042110#Artikel7
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0042110
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 9.1.a)
    text: |-
      voorschriften worden vastgesteld om een gecontroleerde, nauwkeurige, voorspelbare en efficiënte gasstroom over het
      punt mogelijk te maken;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel9
  - number: 9.1.b)
    text: |-
      voorschriften worden vastgesteld voor de sturing van de gasstroom over het punt en voor het minimaliseren van
      verstoringen van de stroom volgend uit het matchingsproces;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel9
  - number: 9.1.c)
    text: |-
      de beheerder of de netbeheerder van het landelijk gastransportnet wordt aangewezen voor het sturen van de gasstroom
      over het punt;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel9
  - number: 9.1.d)
    text: |-
      wanneer de beheerder en de netbeheerder van het landelijk gastransportnet er niet in slagen overeenstemming
      over deze aanwijzing te bereiken, wordt de beheerder danwel de netbeheerder van het landelijk gastransportnet,
      voor zover hij de apparatuur voor het beheersen van de gasstroom onder zijn hoede heeft, in samenwerking met de
      beheerder danwel de netbeheerder van het landelijk gastransportnet, voor zover hij de apparatuur voor het beheersen
      van de gasstroom niet onder zijn hoede heeft, belast met het sturen van de gasstroom over het punt.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel9
  - number: '9.2'
    text: |-
      Om de gasstroom te sturen, beslist de beheerder of de netbeheerder van het landelijk gastransportnet, die
      overeenkomstig het eerste lid, onderdeel c, is aangewezen, over de hoeveelheid en de richting van de gasstroom
      voor het punt en voor elk uur van de gasdag en waakt ervoor dat de beheerder of de netbeheerder van het landelijk
      gastransportnet, die niet overeenkomstig het eerste lid, onderdeel c, is aangewezen, de contractuele verplichtingen
      inzake druk in acht neemt:
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel9
  - number: 9.2.a)
    text: op een niveau van nauwkeurigheid dat voldoende hoog ligt om de stuurafwijking te minimaliseren; en
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel9
  - number: 9.2.b)
    text: |-
      op een niveau van stabiliteit dat in overeenstemming is met een efficiënt gebruik van het net en het landelijk
      gastransportnet.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel9
  - number: '9.3'
    text: |-
      De hoeveelheid en richting van de gasstroom die de beheerder en de netbeheerder van het landelijk gastransportnet
      zijn overeengekomen, weerspiegelen:
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel9
  - number: 9.3.a)
    text: het resultaat van het matchingsproces;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel9
  - number: 9.3.b)
    text: de correctie van de lopende verschilrekening;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel9
  - number: 9.3.c)
    text: |-
      alle efficiënte regelingen voor het beheersen van de gasstroom tussen de beheerder en de netbeheerder van het
      landelijk gastransportnet met het oog op het op- en afregelen (ramp-up, ramp-down), de minimumstroomwaarde, het
      splitsen van de stroom in een virtueel punt, als dat aanwezig is, en/of de wisseling van stroomrichting of de
      efficiëntie van de operationele kosten;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel9
  - number: 9.3.d)
    text: |-
      alle regelingen voor het beheer van grensoverschrijdende handelsbeperkingen ten gevolge van
      gaskwaliteitsverschillen overeenkomstig [artikel 14][ref1] en/of odorisatiepraktijken overeenkomstig
      [artikel 15][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0042110#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0042110#Artikel15
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0042110
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0042110
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '9.4'
    text: |-
      De beheerder of de netbeheerder van het landelijk gastransportnet kan ertoe besluiten de hoeveelheid gas of de
      richting van de gasstroom, of beide, te wijzigen wanneer dit nodig is om:
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel9
  - number: 9.4.a)
    text: te voldoen aan de bepalingen van de voor het punt geldende nationale veiligheidswetgeving;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel9
  - number: 9.4.b)
    text: te voldoen aan de voorschriften die zijn neergelegd in de noodplannen en preventieve actieplannen;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel9
  - number: 9.4.c)
    text: te reageren wanneer het net of het landelijk gastransportnet getroffen wordt door een uitzonderlijke gebeurtenis.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel9
  - number: '10.1'
    text: |-
      Met betrekking tot de meetbeginselen voor volume, energie en gaskwaliteit zorgen de beheerder en de netbeheerder
      van het landelijk gastransportnet ervoor dat de voor het punt geldende meetnormen duidelijk zijn vastgesteld en
      omschreven in de overeenkomst, bedoeld in [artikel 7, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0042110#Artikel7
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0042110
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '10.2'
    text: |-
      De beheerder is belast met de installatie, het beheer en het onderhoud van de meetapparatuur. Op de beheerder
      berust de verplichting om alle informatie en gegevens met betrekking tot de meting van gasstromen in het punt
      tijdig en met een vastgestelde frequentie ter beschikking te stellen aan de netbeheerder van het landelijk
      gastransportnet en de netbeheerder van het aangrenzende landelijk gastransportnet.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel10
  - number: '10.3'
    text: |-
      Bij de installatie, het beheer en het onderhoud van de meetapparatuur in een punt wordt rekening gehouden
      met de technische eisen die bij nationale regelgeving aan de beheerder en de netbeheerder van het landelijk
      gastransportnet zijn opgelegd.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel10
  - number: '10.4'
    text: |-
      De beheerder sluit een overeenkomst met de netbeheerder van het landelijk gastransportnet, en streeft
      ernaar een overeenkomst te sluiten met de netbeheerder van het aangrenzende landelijk gastransportnet, over
      basismeetbeginselen, die minimaal de volgende elementen omvatten:
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel10
  - number: 10.4.a)
    text: |-
      een beschrijving van het meetstation, met onder meer een beschrijving van de te gebruiken meet- en
      analyseapparatuur en nadere bijzonderheden over reserveapparatuur die bij storingen van de hoofdapparatuur kan
      worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel10
  - number: 10.4.b)
    text: |-
      de gaskwaliteitsparameters en het te meten volume en de te meten energie-inhoud, alsook het meetbereik en de
      maximaal toegestane fout of onzekerheidsmarge waarbinnen de meetapparatuur werkt, de meetfrequentie, de gebruikte
      eenheden en overeenkomstig welke normen de metingen gebeuren, en de eventueel te gebruiken conversiefactoren;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel10
  - number: 10.4.c)
    text: de procedures en methoden die zullen worden gebruikt om de niet rechtstreeks gemeten parameters te berekenen;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel10
  - number: 10.4.d)
    text: |-
      een beschrijving van de methode die wordt gebruikt voor de berekening van de maximaal toegestane fout of
      onzekerheid bij de bepaling van de getransporteerde energie;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel10
  - number: 10.4.e)
    text: een beschrijving van het voor de te meten parameters gebruikte proces van gegevensvalidatie;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel10
  - number: 10.4.f)
    text: |-
      de regelingen voor de validatie van de meting en de kwaliteitsborging, inclusief de verificatie- en
      aanpassingsprocedures;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel10
  - number: 10.4.g)
    text: |-
      de manier waarop gegevens, inclusief frequentie en inhoud, worden uitgewisseld tussen de beheerder, de netbeheerder
      van het landelijk gastransportnet en de netbeheerder van het aangrenzende landelijk gastransportnet wat de gemeten
      parameters betreft;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel10
  - number: 10.4.h)
    text: |-
      de specifieke lijst van signalen en alarmen die door de beheerder die de meetapparatuur beheert, moet worden
      doorgegeven aan de netbeheerder van het landelijk gastransportnet en de netbeheerder van het aangrenzende landelijk
      gastransportnet;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel10
  - number: 10.4.i)
    text: |-
      de methode voor de bepaling van een meetcorrectie en alle daaropvolgende procedures die vereist kunnen zijn in een
      tijdelijke situatie waarin de meetapparatuur foutief blijkt te hebben gewerkt (een te lage of een te hoge meting
      die buiten het vastgestelde onzekerheidsbereik valt). De netbeheerder van het landelijk gastransportnet neemt dan
      passende actie om deze situatie te beëindigen;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel10
  - number: 10.4.j)
    text: voor de beheerder geldende regels in het geval van storing van de meetapparatuur;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel10
  - number: 10.4.k)
    text: 'voor de beheerder geldende regels voor:'
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel10
  - number: 10.4.k).i)
    text: toegang tot de meetfaciliteit;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel10
  - number: 10.4.k).ii)
    text: aanvullende verificaties van de meetfaciliteit;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel10
  - number: 10.4.k).iii)
    text: aanpassing van de meetfaciliteit;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel10
  - number: 10.4.k).iv)
    text: aanwezigheid tijdens kalibratie- en onderhoudswerkzaamheden aan de meetfaciliteit.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel10
  - number: '11.1'
    text: |-
      Met betrekking tot de toewijzing van gashoeveelheden waarborgen de beheerder en de netbeheerder van het landelijk
      gastransportnet in de overeenkomst, bedoeld in[ artikel 7, eerste lid][ref1], de consistentie tussen de toegewezen
      hoeveelheden aan beide zijden van het punt.


      [ref1]: https://wetten.overheid.nl/BWBR0042110#Artikel7
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0042110
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '11.2'
    text: |-
      Tenzij door de beheerder en de netbeheerder van het landelijk gastransportnet in hun overeenkomst anderszins
      is overeengekomen, gebruiken de beheerder en de netbeheerder van het landelijk gastransportnet een lopende
      verschilrekening. De beheerder of de netbeheerder van het landelijk gastransportnet die de meetapparatuur onder
      zijn hoede heeft, herberekent de lopende verschilrekening op basis van de gevalideerde hoeveelheden en deelt het
      resultaat mede aan de beheerder of de netbeheerder van het landelijk gastransportnet.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel11
  - number: '11.3'
    text: 'Wanneer een lopende verschilrekening wordt gebruikt:'
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel11
  - number: 11.3.a)
    text: |-
      wordt de stuurafwijking gealloceerd aan een lopende verschilrekening van de beheerder en de netbeheerder van
      het landelijk gastransportnet en zijn de toewijzingen die door de beheerder en de netbeheerder van het landelijk
      gastransportnet aan gebruikers danwel netgebruikers van het landelijk gastransportnet, moeten worden toegekend,
      gelijk aan de bevestigde hoeveelheden;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel11
  - number: 11.3.b)
    text: |-
      handhaven de beheerder en de netbeheerder van het landelijk gastransportnet een balans van de lopende
      verschilrekening die zo dicht mogelijk bij nul ligt;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel11
  - number: 11.3.c)
    text: |-
      wordt bij de vaststelling van de grenzen van de lopende verschilrekening rekening gehouden met de kenmerken van het
      punt, en met name met:
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel11
  - number: 11.3.c).i)
    text: de fysieke kenmerken van het punt;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel11
  - number: 11.3.c).ii)
    text: de leidingbuffercapaciteit van het net en het landelijk gastransportnet;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel11
  - number: 11.3.c).iii)
    text: de totale technische capaciteiten in het punt;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel11
  - number: 11.3.c).iv)
    text: |-
      de dynamiek van de gasstroom van het net en het landelijk gastransportnet. Wanneer de vastgestelde grenzen van de
      lopende verschilrekening zijn bereikt, kunnen de beheerder en de netbeheerder van het landelijk gastransportnet
      overeenkomen de desbetreffende grenswaarden te verhogen teneinde toewijzingen aan gebruikers danwel netgebruikers
      van het landelijk gastransportnet toe te kennen die gelijk zijn aan hun bevestigde hoeveelheden, dan wel kunnen
      zij hoeveelheden aan gebruikers danwel netgebruikers van het landelijk gastransportnet toewijzen die op evenredige
      wijze zijn gebaseerd op de gemeten hoeveelheid gas die overeenkomstig de meetapparatuur van de beheerder per
      tijdsperiode fysiek over het punt heeft gestroomd.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel11
  - number: '11.4'
    text: |-
      De beheerder en de netbeheerder van het landelijk gastransportnet kunnen overeenkomen om een andere
      toewijzingsregel dan de lopende verschilrekening te handhaven of toe te passen, op voorwaarde dat deze regel
      gepubliceerd is en dat gebruikers danwel netgebruikers van het landelijk gastransportnet zijn uitgenodigd om binnen
      een termijn van ten minste twee maanden na publicatie van de toewijzingsregel hun opmerkingen over de voorgestelde
      toewijzingsregel te maken.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel11
  - number: '12.1'
    text: |-
      De beheerder stelt communicatieprocedures met de netbeheerder van het landelijk gastransport vast in de
      overeenkomst, bedoeld in [artikel 7, eerste lid][ref1], en streeft naar vaststelling van communicatieprocedures
      met de netbeheerder van het aangrenzende landelijk gastransportnet. Deze communicatieprocedures dienen snelle en
      gelijktijdige communicatie in het geval van uitzonderlijke gebeurtenissen te vergemakkelijken.


      [ref1]: https://wetten.overheid.nl/BWBR0042110#Artikel7
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0042110
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '12.2'
    text: |-
      Op de beheerder rust de verplichting om, als zij getroffen wordt door een uitzonderlijke gebeurtenis, de
      netbeheerder van het landelijk gastransportnet en de netbeheerder van het aangrenzende landelijk gastransportnet in
      kennis te stellen van deze uitzonderlijke gebeurtenis en alle nodige informatie te verstrekken over:
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel12
  - number: 12.2.a)
    text: het eventuele effect op de hoeveelheden en kwaliteit van het gas dat door het punt kan worden getransporteerd;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel12
  - number: 12.2.b)
    text: het verwachte en feitelijke einde van de uitzonderlijke gebeurtenis.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel12
  - number: '13.1'
    text: |-
      De beheerder en de netbeheerder van het landelijk gastransportnet werken met elkaar samen en werken samen
      met de netbeheerder van het aangrenzende landelijk gastransportnet om beperkingen van de grensoverschrijdende
      handel tussen Nederland en het Verenigd Koninkrijk ten gevolge van gaskwaliteitsverschillen te voorkomen. De
      desbetreffende acties, door de beheerder en de netbeheerder van het landelijk gastransportnet bij de uitvoering van
      hun standaardactiviteiten geïnitieerd en uitgevoerd, kunnen onder meer uitruil (swapping) en menging (co-mingling)
      omvatten.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel13
  - number: '13.2'
    text: |-
      Wanneer een beperking van de grensoverschrijdende handel ten gevolge van gaskwaliteitsverschillen niet kan worden
      vermeden, informeren de beheerder en de netbeheerder van het landelijk gastransportnet Autoriteit Consument en
      Markt en Onze Minister.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel13
  - number: '13.3'
    text: |-
      Autoriteit Consument en Markt kan de beheerder en de netbeheerder van het landelijk gastransportnet opdragen
      om binnen een tijdsbestek van twaalf maanden successievelijk de onder a) tot en met e) bedoelde maatregelen te
      treffen:
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel13
  - number: 13.3.a)
    text: |-
      samenwerking en uitwerking van technisch haalbare opties, zonder een wijziging van de gaskwaliteitsspecificaties,
      wat nadere afspraken over de gasstroom en gasbehandeling kan inhouden met als doel een einde te maken aan de
      erkende beperking;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel13
  - number: 13.3.b)
    text: |-
      gezamenlijke uitvoering van een kosten-batenanalyse inzake de technisch haalbare opties, met als doel in
      economische zin doeltreffende oplossingen uit te werken met daarbij een uitsplitsing van de kosten en baten onder
      de categorieën van betrokken partijen;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel13
  - number: 13.3.c)
    text: opstelling van een raming van de uitvoeringstijd voor elke potentiële optie;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel13
  - number: 13.3.d)
    text: |-
      uitvoering van een openbare raadpleging over de geïdentificeerde haalbare oplossingen, en vervolgens rekening
      houden met de resultaten van die raadpleging;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel13
  - number: 13.3.e)
    text: |-
      indiening van een gezamenlijk voorstel om een einde te maken aan de erkende beperking, met inbegrip van een
      tijdschema voor de tenuitvoerlegging, gebaseerd op de kosten-batenanalyse en de resultaten van de openbare
      raadpleging.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel13
  - number: '13.4'
    text: |-
      Wanneer de beheerder en de netbeheerder van het landelijk gastransportnet geen overeenstemming over een oplossing
      bereiken, stellen de beheerder en de netbeheerder van het landelijk gastransportnet Autoriteit Consument en Markt
      daarvan onverwijld in kennis.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel13
  - number: '13.5'
    text: |-
      De beheerder en de netbeheerder van het landelijk gastransportnet voeren het voorstel, bedoeld in het derde lid,
      onderdeel e, uit, indien Autoriteit Consument en Markt daarmee heeft ingestemd.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel13
  - number: '14.1'
    text: |-
      De beheerder en de netbeheerder van het landelijk gastransportnet streven naar samenwerking met de netbeheerder van
      het aangrenzende landelijk gastransportnet om beperkingen van de grensoverschrijdende handel tussen Nederland en
      het Verenigd Koninkrijk ten gevolge van onderling verschillende odorisatiepraktijken te vermijden.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel14
  - number: '14.2'
    text: |-
      Wanneer een beperking van de grensoverschrijdende handel tussen Nederland en het Verenigd Koninkrijk, ten
      gevolge van onderling verschillende odorisatiepraktijken niet kan worden vermeden informeren de beheerder en de
      netbeheerder van het landelijk gastransportnet Autoriteit Consument en Markt en Onze Minister.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel14
  - number: '15.1'
    text: De beheerder gebruikt het in dit artikel gedefinieerde gemeenschappelijk stelsel van eenheden.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel15
  - number: '15.2'
    text: |-
      Voor de parameters druk, temperatuur, volume, calorische bovenwaarde, energie en Wobbe-index gebruikt de beheerder
      de volgende eenheden:
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel15
  - number: 15.2.a)
    text: 'druk: bar'
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel15
  - number: 15.2.b)
    text: 'temperatuur: °C (graden Celsius)'
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel15
  - number: 15.2.c)
    text: 'volume: m3'
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel15
  - number: 15.2.d)
    text: 'calorische bovenwaarde (GCV): kWh/m3'
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel15
  - number: 15.2.e)
    text: 'energie: kWh (gebaseerd op de GCV)'
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel15
  - number: 15.2.f)
    text: 'Wobbe-index: kWh/m3 (gebaseerd op de GCV).'
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel15
  - number: '15.3'
    text: |-
      De beheerder en de netbeheerder van het landelijk gastransportnet kunnen met instemming van Autoriteit Consument en
      Markt overeenkomen andere referentieomstandigheden voor de uitwisseling van gegevens te gebruiken.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel15
  - number: '16.1'
    text: 'De beheerder gebruikt één of meer van de volgende types van gegevensuitwisseling:'
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel16
  - number: 16.1.a)
    text: |-
      op documenten gebaseerde gegevensuitwisseling: de gegevens worden in de vorm van een bestand en automatisch
      uitgewisseld tussen de respectieve IT-systemen;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel16
  - number: 16.1.b)
    text: |-
      geïntegreerde gegevensuitwisseling: de gegevens worden uitgewisseld tussen twee applicaties die zich direct op de
      respectieve IT-systemen bevinden;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel16
  - number: 16.1.c)
    text: |-
      interactieve gegevensuitwisseling: de gegevens worden op interactieve wijze uitgewisseld met behulp van een
      webapplicatie via een browser.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel16
  - number: '16.2'
    text: |-
      De gemeenschappelijke oplossingen voor de uitwisseling van gegevens omvatten het protocol, het gegevensformaat
      en het netwerk. Voor elk van de in het eerste lid genoemde types van gegevensuitwisseling worden de volgende
      gemeenschappelijke oplossingen voor de uitwisseling van gegevens gebruikt:
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel16
  - number: 16.2.a)
    text: 'voor de op documenten gebaseerde gegevensuitwisseling:'
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel16
  - number: 16.2.a).i)
    text: 'protocol: AS4;'
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel16
  - number: 16.2.a).ii)
    text: |-
      gegevensformaat: Edig@s-XML of een equivalent gegevensformaat dat een identieke mate van interoperabiliteit
      waarborgt;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel16
  - number: 16.2.b)
    text: 'voor de geïntegreerde gegevensuitwisseling:'
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel16
  - number: 16.2.b).i)
    text: 'protocol: HTTP/S-SOAP;'
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel16
  - number: 16.2.b).ii)
    text: |-
      gegevensformaat: Edig@s-XML of een equivalent gegevensformaat dat een identieke mate van interoperabiliteit
      waarborgt;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel16
  - number: 16.2.c)
    text: 'voor de interactieve gegevensuitwisseling: protocol HTTP/S.'
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel16
  - number: '17.1'
    text: 'De beheerder is belast met de invoering en handhaving van passende beveiligingsmaatregelen. Meer in het bijzonder:'
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel17
  - number: 17.1.a)
    text: |-
      beveiligt hij de communicatieketen teneinde een beveiligde en betrouwbare communicatie te waarborgen, waaronder
      begrepen ook de bescherming van de vertrouwelijkheid via encryptie, de integriteit en authenticiteit via
      ondertekening door de afzender en de niet-weerlegbaarheid via een ondertekende bevestiging;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel17
  - number: 17.1.b)
    text: legt hij afdoende beveiligingsmaatregelen ten uitvoer om onbevoegde toegang tot hun IT-infrastructuur te voorkomen;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel17
  - number: 17.1.c)
    text: |-
      stelt hij de andere partijen waarmee hij communiceert onverwijld in kennis van elke onbevoegde toegang die tot hun
      eigen systeem heeft plaatsgevonden of kan hebben plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel17
  - number: '17.2'
    text: 'De beheerder is belast met het waarborgen van de beschikbaarheid van zijn eigen systeem, en:'
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel17
  - number: 17.2.a)
    text: |-
      neemt passende maatregelen om te voorkomen dat een probleem op één punt in het systeem, inclusief de
      netwerkverbinding(en) met de aanbieder(s) van internetdiensten, het hele gegevensuitwisselingssysteem onbeschikbaar
      maakt;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel17
  - number: 17.2.b)
    text: verwerft de passende diensten en ondersteuning van zijn aanbieder(s) van internetdiensten;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel17
  - number: 17.2.c)
    text: |-
      minimaliseert de tijd waarin het systeem niet beschikbaar is ten gevolge van geplande IT-onderhoudswerkzaamheden en
      informeert zijn wederpartijen tijdig van dergelijke geplande perioden waarin het systeem niet beschikbaar is.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel17
  - number: '18'
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder: - *«de beheerder»:* de beheerder van een
      landsgrensoverschrijdend net dat de grens met het Verenigd Koninkrijk overschrijdt en waardoor elektriciteit wordt
      getransporteerd;
        - *«net»:* landsgrensoverschrijdend net dat de grens met het Verenigd Koninkrijk overschrijdt en waardoor
      elektriciteit wordt getransporteerd;
        - *«netbeheerder van het landelijk hoogspanningsnet»:* de netbeheerder van het landelijk hoogspanningsnet, als
      bedoeld in [artikel 10, eerste lid, van de Elektriciteitswet 1998][ref1];
        - *«netbeheerder van het aangrenzende, landelijk hoogspanningsafbmnet»:* de beheerder van het landelijk
      hoogspanningsnet in het Verenigd Koninkrijk;
        - *«UIOSI» («use-it-or-sell-it»):* beginsel op basis waarvan de capaciteit op het net van aangekochte en
      niet-genomineerde fysieke transmissierechten automatisch ter beschikking wordt gesteld voor de dag-vooruit-
      capaciteitstoewijzing en de houder van deze rechten een vergoeding van de beheerder ontvangt;
        - *«UIOLI» («use-it-or-lose-it»):* beginsel op basis waarvan de capaciteit op het net van aangekochte en niet-
      genomineerde fysieke transmissierechten automatisch ter beschikking wordt gesteld aan de beheerder voor gebruik van
      de eerstvolgende beschikbare veiling van capaciteitstoewijzing en de houder van deze rechten geen vergoeding van de
      beheerder ontvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel10
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '10'
  - number: '19'
    text: |-
      De beheerder is geen tarief verschuldigd voor het transport van elektriciteit, als bedoeld in
      [artikel 29, eerste lid, van de Elektriciteitswet 1998][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel29
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '29'
  - number: '20.1'
    text: |-
      De beheerder maakt geen deel uit van een groep als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1] waartoe ook een rechtspersoon of vennootschap behoort die
      in Nederland elektriciteit produceert of levert of daarin handelt.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: '20.2'
    text: |-
      Rechtspersonen en vennootschappen die deel uitmaken van een groep als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1] waartoe ook een rechtspersoon of vennootschap behoort
      die in Nederland elektriciteit produceert of levert of daarin handelt, houden geen aandelen in de beheerder of
      in een rechtspersoon die deel uitmaakt van een groep waartoe ook de beheerder behoort en nemen niet deel in een
      vennootschap die deel uitmaakt van een groep waartoe ook de beheerder behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: '20.3'
    text: |-
      De beheerder en met de beheerder verbonden groepsmaatschappijen als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: 20.3.a)
    text: |-
      houden geen aandelen in een rechtspersoon die in Nederland elektriciteit produceert of levert of daarin handelt
      of in een rechtspersoon die deel uitmaakt van een groep waartoe ook een rechtspersoon behoort die in Nederland
      elektriciteit produceert of levert of daarin handelt;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel20
  - number: 20.3.b)
    text: |-
      nemen niet deel in een vennootschap die in Nederland elektriciteit produceert of levert of daarin handelt of in een
      vennootschap die deel uitmaakt van een groep waartoe ook een rechtspersoon of vennootschap behoort die in Nederland
      elektriciteit produceert of levert of daarin handelt.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel20
  - number: '20.4'
    text: |-
      De beheerder informeert Autoriteit Consument en Markt bij wijzigingen van de vennootschapsstructuur,
      zeggenschapsstructuur, of wijzigingen van een andere aard, die van invloed zijn op het bepaalde in dit artikel.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel20
  - number: '21.1'
    text: |-
      Een beheerder draagt er zorg voor dat de netbeheerder van het landelijk hoogspanningsnet op geen enkele wijze,
      waaronder financieel, aansprakelijk kan zijn voor handelingen van de beheerder of zijn aandeelhouders en
      dochtermaatschappijen.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel21
  - number: '21.2'
    text: |-
      Een beheerder draagt er zorg voor dat netbeheerder van het landelijk hoogspanningsnet op geen enkele wijze
      financieel zal bijdragen aan de exploitatie van het net.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel21
  - number: '22.1'
    text: |-
      Voordat de beheerder van het net congestiebeheersprocedures hanteert, legt hij deze procedures ter goedkeuring voor
      aan de Autoriteit Consument en Markt.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel22
  - number: '22.2'
    text: |-
      De Autoriteit Consument en Markt verleent de goedkeuring indien uit toetsing blijkt dat de methoden en voorwaarden
      redelijk, objectief, marktconform, niet-discriminatoir, transparant en in het belang van een goede marktwerking
      zijn.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel22
  - number: '22.3'
    text: |-
      De beheerder rapporteert aan Autoriteit Consument en Markt over alle overeenkomsten die tussen hem en de
      netbeheerder van het landelijk hoogspanningsnet voor elektriciteit met betrekking tot het net zijn en worden
      aangegaan. De beheerder zal de definitieve overeenkomsten ter inzage overleggen aan de Autoriteit Consument en
      Markt.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel22
  - number: '22.4'
    text: |-
      De beheerder publiceert zijn goedgekeurde voorstel voor zijn congestiebeheersprocedures, bedoeld in het eerste lid,
      op een voor eenieder toegankelijke website.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel22
  - number: '22.5'
    text: |-
      De beheerder en zijn aandeelhouders en dochtermaatschappijen zullen zich onthouden van iedere bemoeiing met de
      uitvoering van de taken die op grond van [artikel 17a van de Elektriciteitswet 1998][ref1] aan de netbeheerder van
      het landelijk hoogspanningsnet zijn opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel17a
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 17a
  - number: '22.6'
    text: |-
      De beheerder handelt overeenkomstig de goedgekeurde congestiebeheersprocedures en meldt de Autoriteit Consument en
      Markt indien hij daarvan is afgeweken.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel22
  - number: '23.1'
    text: De beheerder maakt de maximale capaciteit van het net beschikbaar voor de markt.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel23
  - number: '23.2'
    text: |-
      De beheerder past een UIOLI of UIOSI systeem toe dat transparant en niet-discriminatoir is bij de toewijzing van
      capaciteit op het net.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel23
  - number: '24.1'
    text: |-
      De beheerder zal de hierna gespecificeerde informatie met betrekking tot de beschikbaarheid van de capaciteit, het
      toegepaste allocatiemechanisme en de allocatieresultaten publiceren op een voor eenieder toegankelijke website.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel24
  - number: '24.2'
    text: 'De beheerder publiceert:'
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel24
  - number: 24.2.a)
    text: jaarlijks de berekende veilig beschikbare transportcapaciteit voor het volgend kalenderjaar op uurbasis;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel24
  - number: 24.2.b)
    text: |-
      ten hoogste twee dagen voor de dag van transport een zo nauwkeurig mogelijke waarde voor de veilig beschikbare
      transportcapaciteit voor de betreffende dag van transport op uurbasis;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel24
  - number: 24.2.c)
    text: zo spoedig mogelijk eventuele wijzigingen van de onder a en b genoemde veilig beschikbare transportcapaciteit;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel24
  - number: 24.2.d)
    text: dagelijks de beschikbare capaciteit voor dag-vooruit-transporten voor de volgende dag op uurbasis.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel24
  - number: '24.3'
    text: 'De beheerder publiceert, wanneer hij gebruik maakt van een expliciete veilingmethodiek:'
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel24
  - number: 24.3.a)
    text: een duidelijke uitleg van de werking van de toegepaste allocatiemethodiek voor de expliciete veiling;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel24
  - number: 24.3.b)
    text: onmiddellijk na het uitvoeren van een expliciete veiling de hoeveelheid toegewezen capaciteit en de prijs daarvan.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel24
  - number: '24.4'
    text: 'De beheerder publiceert, wanneer hij gebruik maakt van een impliciete veilingmethodiek:'
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel24
  - number: 24.4.a)
    text: een duidelijke uitleg van de werking van de toegepaste allocatiemethodiek voor de impliciete veiling;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel24
  - number: 24.4.b)
    text: |-
      voor zover mogelijk en noodzakelijk voor de Nederlandse elektriciteitsbeurs marktprijzen en verhandelde volumes op
      uurbasis binnen een redelijke termijn.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel24
  - number: '25.1'
    text: |-
      De beheerder stuurt binnen een redelijke termijn na de dag waarop het tien jaar geleden is dat het net voor het
      eerst in gebruik is genomen een financieel verslag aan de Autoriteit Consument en Markt. Het financieel verslag
      bevat:
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel25
  - number: 25.1.a)
    text: |-
      de werkelijke gemaakte kosten en behaalde omzetten tot aan de dag waarop het tien jaar is geleden dat het net voor
      het eerst in gebruik is genomen;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel25
  - number: 25.1.b)
    text: |-
      een bijgestelde raming van de verwachte kosten en opbrengsten voor de periode van vijftien jaar na de dag waarop
      het tien jaar geleden is dat het net voor het eerst in gebruik is genomen;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel25
  - number: 25.1.c)
    text: |-
      een bijgestelde raming van de interne rentabiliteit van de investering gebaseerd op de informatie bedoeld onder a)
      en b);
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel25
  - number: 25.1.d)
    text: |-
      een vergelijking van de gegevens bedoeld onder a) tot en met c) met de equivalenten daarvan uit de
      ontheffingsaanvraag van de beheerder;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel25
  - number: 25.1.e)
    text: |-
      een verklaring waarmee de beheerder aantoont dat het financiële verslag alle relevante informatie bevat die
      noodzakelijk is om de totale kosten en baten van het project en het interne rendement van de investering nauwkeurig
      te controleren.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel25
  - number: '25.2'
    text: |-
      Indien de bijgestelde raming van de interne rentabiliteit zoals genoemd in het financiële verslag meer dan een
      procentpunt hoger is dan de ten tijde van de indiening van de ontheffingsaanvraag geraamde interne rentabiliteit,
      staan voor de beheerder de volgende twee opties open:
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel25
  - number: 25.2.a)
    text: |-
      de beheerder gebruikt het bedrag van de additionele winsten voor de financiering van een uitbreiding van de
      capaciteit van het net. Daarbij dient de uitbreiding van de capaciteit in gebruik te zijn genomen en beschikbaar te
      zijn voor energietransporten over het net voor 1 april 2036; of
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel25
  - number: 25.2.b)
    text: |-
      de beheerder stemt ermee in dat het bedrag van de additionele winsten voor 1 april 2036 in twee gelijke delen
      wordt gesplitst. Deze delen worden betaald aan de landelijk netbeheerders wier netten het net is gekoppeld. De
      netbeheerder van het landelijk hoogspanningsnet gebruikt dit bedrag voor de financiering van de gereguleerde activa
      in Nederland.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel25
  - number: '25.3'
    text: |-
      Onder additionele winsten, bedoeld in het tweede lid, wordt verstaan: het bedrag dat bij de werkelijke kosten over
      25 jaar had moeten worden opgeteld om de interne rentabiliteit te verminderen tot een rentabiliteit die niet meer
      dan een procentpunt hoger ligt dan de in de ontheffingsaanvraag geraamde interne rentabiliteit.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel25
  - number: '26.1'
    text: 'De beheerder heeft in het kader van het beheer van het net tot taak:'
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel26
  - number: 26.1.a)
    text: het door hem beheerde net in werking te hebben, te onderhouden en te repareren;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel26
  - number: 26.1.b)
    text: |-
      de veiligheid en betrouwbaarheid van het net en van het transport van elektriciteit over de net op de meest
      doelmatige wijze te waarborgen;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel26
  - number: 26.1.c)
    text: |-
      onverminderd [artikel 31][ref1] op een geschikte wijze gegevens te publiceren over zijn koppelingen met netten, het
      gebruik van het net en de toewijzing van transportcapaciteit;


      [ref1]: https://wetten.overheid.nl/BWBR0042110#Artikel31
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0042110
        artikel: '31'
        hoofdstuk: '4'
  - number: 26.1.d)
    text: |-
      gebruikers van het net alle gegevens te verstrekken die zij voor een efficiënte toegang tot het net inclusief
      gebruik ervan nodig hebben.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel26
  - number: '26.2'
    text: 'In aanvulling op de taken, bedoeld in het eerste lid, heeft de beheerder tevens tot taak:'
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel26
  - number: 26.2.a)
    text: |-
      de netbeheerder van het landelijk hoogspanningsnet voor elektriciteit de gegevens te verschaffen die nodig zijn om
      een betrouwbare en efficiënte werking, alsmede de samenhangende ontwikkeling en interoperabiliteit, van de netten
      te waarborgen;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel26
  - number: 26.2.b)
    text: |-
      tijdig en doeltreffend gegevens uit te wisselen over het functioneren van het net met de netbeheerder van het
      landelijk hoogspanningsnet en de netbeheerder van het aangrenzende landelijk hoogspanningsnet, in overeenstemming
      met de door de netbeheerder van het landelijk hoogspanningsnet vast te stellen minimale voorwaarden en
      verplichtingen inzake de operationele netwerkveiligheid;
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel26
  - number: 26.2.c)
    text: |-
      onverminderd [artikel 31][ref1] het openbaar maken van informatie die nodig is voor doeltreffende mededinging en
      een efficiënte werking van de markt.


      [ref1]: https://wetten.overheid.nl/BWBR0042110#Artikel31
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0042110
        artikel: '31'
        hoofdstuk: '4'
  - number: '27'
    text: |-
      In aanvulling op de [artikelen 24 tot en met 26][ref1] kan Autoriteit Consument en Markt aanvullende voorwaarden
      aan de informatievoorziening stellen, die moeten worden opgenomen in het voorstel, bedoeld in [artikel 22][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0042110#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0042110#Artikel22
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0042110
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0042110
        artikel: '22'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '28'
    text: |-
      Voor uitvoering van de taak genoemd in [artikel 4a Elektriciteitswet][ref1], kan Onze Minister verlangen van de
      beheerder dat hij hem gegevens en inlichtingen verstrekt binnen een door hem te bepalen termijn en op een door hem
      te bepalen wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel4a
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 4a
  - number: '29'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over de wijze waarop de beheerder en de netbeheerder
      van het landelijk hoogspanningsnet zich jegens elkaar gedragen ten aanzien van het in werking hebben van het net
      en het landelijk hoogspanningsnet, alsmede de samenwerking tussen de beheerder en de netbeheerder van het landelijk
      hoogspanningsnet.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel29
  - number: '30.1'
    text: |-
      Onze Minister kan verlangen dat een beheerder van een landsgrensoverschrijdend net dat de grens met het Verenigd
      Koninkrijk overschrijdt hem inzage geeft in gegevens en bescheiden, onderscheidenlijk gegevens en inlichtingen
      verstrekt die hij nodig heeft voor de uitvoering van de hem in de [Gaswet][ref1] en [Verordening 715/2009]
      (32009R0715) dan wel de [Elektriciteitswet 1998][ref2] en [Verordening 714/2009](32009R0714) opgedragen taken.


      [ref1]: https://wetten.overheid.nl/BWBR0011440
      [ref2]: https://wetten.overheid.nl/BWBR0009755
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0011440
      - id: ref2
        bwb_id: BWBR0009755
  - number: '30.2'
    text: |-
      Degene aan wie een verzoek is gedaan inzage te geven in gegevens en bescheiden, onderscheidenlijk gegevens en
      inlichtingen te verstrekken, is verplicht binnen de door Onze Minister gestelde redelijke termijn alle medewerking
      te verlenen die deze redelijkerwijze kan vorderen bij de uitoefening van zijn bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel30
  - number: '30.3'
    text: |-
      Onze Minister gebruikt bescheiden, gegevens of inlichtingen over de beheerder van een landgrensoverschrijdend net
      dat de grens met het Verenigd Koninkrijk overschrijdt welke hij heeft verkregen in verband met enige werkzaamheid
      ten behoeve van de uitvoering van een van zijn taken op grond van de [Gaswet][ref1] en [Verordening 715/2009]
      (32009R0715) dan wel de [Elektriciteitswet 1998][ref2] en [Verordening 714/2009](32009R0714), uitsluitend voor de
      toepassing van de Gaswet en [Verordening 715/2009](32009R0715) dan wel de Elektriciteitswet 1998 en [Verordening
      714/2009](32009R0714).


      [ref1]: https://wetten.overheid.nl/BWBR0011440
      [ref2]: https://wetten.overheid.nl/BWBR0009755
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0011440
      - id: ref2
        bwb_id: BWBR0009755
  - number: '31.1'
    text: |-
      Wanneer een beheerder van een landgrensoverschrijdend net dat de grens met het Verenigd Koninkrijk overschrijdt
      bij de uitvoering van zijn taak de beschikking krijgt over gegevens waarvan hij het vertrouwelijke karakter kent of
      redelijkerwijs moet vermoeden, draagt hij er zorg voor dat die gegevens niet ter beschikking komen of kunnen komen
      van derden, tenzij enig wettelijk voorschrift anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel31
  - number: '31.2'
    text: |-
      Indien een beheerder van een landsgrensoverschrijdend net dat de grens met het Verenigd Koninkrijk overschrijdt
      gegevens over zijn bedrijfsvoering die commercieel voordeel kunnen opleveren ter beschikking stelt aan anderen,
      doet hij dit op niet-discriminatoire wijze.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel31
  - number: '31.3'
    text: |-
      Een beheerder van een landsgrensoverschrijdend net dat de grens met het Verenigd Koninkrijk overschrijdt maakt alle
      informatie openbaar die bijdraagt aan een doeltreffende mededinging en een efficiënte werking van de markt, voor
      zover deze redelijkerwijs te genereren is uit de informatie waarover hij beschikt op basis van de uitvoering van de
      op grond van dit besluit aan hem toegekende taken.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel31
  - number: '32'
    text: 'De Autoriteit Consument en Markt kan in geval van overtreding van het bepaalde bij of krachtens:'
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel32
  - number: 32.a)
    text: |-
      de [artikelen 4][ref1] en [5][ref2] een bestuurlijke boete opleggen overeenkomstig
      [artikel 60ad, eerste lid, onderdeel b, van de Gaswet][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0042110#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0042110#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0011440#Artikel60ad
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0042110
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
