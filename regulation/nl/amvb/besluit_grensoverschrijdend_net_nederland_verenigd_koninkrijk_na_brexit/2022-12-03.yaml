        artikel: '2'
  - number: '2.1'
    text: |-
      Een landsgrensoverschrijdend net dat de grens met het Verenigd Koninkrijk overschrijdt is eigendom van een
      natuurlijke of rechtspersoon die in elk geval qua rechtsvorm gescheiden is van de landelijk netbeheerder van het
      landelijk hoogspanningsnet dan wel het landelijk gastransportnet, waar het aan gekoppeld is.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel2
  - number: '2.2'
    text: |-
      Een beheerder van een landsgrensoverschrijdend net dat de grens met het Verenigd Koninkrijk overschrijdt handelt
      onafhankelijk van een landelijk netbeheerder.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel2
  - number: '2.3'
    text: |-
      De overeenkomsten tussen een beheerder van een landsgrensoverschrijdend net dat de grens met het Verenigd
      Koninkrijk overschrijdt en een landelijk netbeheerder zullen een goed netbeheer door de landelijk netbeheerder niet
      schaden, zijn niet-discriminatoir en marktconform.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel2
  - number: '2.4'
    text: |-
      De exploitatie van een landsgrensoverschrijdend net dat de grens met het Verenigd Koninkrijk overschrijdt gaat niet
      ten koste van de mededinging of de efficiënte werking van de elektriciteits- dan wel gasmarkt, en is niet nadelig
      voor de efficiënte werking van het net van een landelijk netbeheerder.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel2
  - number: '3'
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder: - *«de beheerder»:* de beheerder van
      een landsgrensoverschrijdend net dat de grens met het Verenigd Koninkrijk overschrijdt en waardoor gas wordt
      getransporteerd;
        - *«net»:* landsgrensoverschrijdend net dat de grens met het Verenigd Koninkrijk overschrijdt en waardoor gas wordt
      getransporteerd op en vanaf het punt waar het gas op Nederlands grondgebied wordt ingevoed of onttrokken tot de
      plek waar het gas het Nederlands grondgebied verlaat of binnenkomt;
        - *«netbeheerder van het aangrenzende landelijk gastransportnet»:* de beheerder van het landelijk gastransportnet
      in het Verenigd Koninkrijk;
        - *«netbeheerder van het landelijk gastransportnet»:* de netbeheerder van het landelijk gastransportnet, als
      bedoeld in [artikel 2, eerste lid, van de Gaswet][ref1];
        - *«punt»:* het fysieke punt waar het gas wordt ingevoed in of onttrokken aan het landsgrensoverschrijdend net dat
      de grens met het Verenigd Koninkrijk overschrijdt;
        - *«gebruiker»:* degene voor wie met behulp van het net het transport van gas wordt verricht;
        - *«uitzonderlijke gebeurtenis»:* elke niet-geplande gebeurtenis die niet redelijkerwijs te controleren of
      te voorkomen is en die gedurende een beperkte periode een capaciteitsvermindering kan veroorzaken waardoor de
      hoeveelheid of de kwaliteit van het gas in het punt wordt beïnvloed, met mogelijke effecten op de interacties
      tussen de beheerder en de netbeheerder van het landelijk gastransportnet en tussen de beheerder, de netbeheerder
      van het landelijk gastransportnet en gebruikers;
        - *«lopende verschilrekening»:* een rekening tussen de beheerder en de netbeheerder van het landelijk
      gastransportnet, te gebruiken om de stuurafwijkingen in een punt te beheren teneinde de allocatie van capaciteit
      aan gebruikers te vereenvoudigen;
        - *«gemeten hoeveelheid»:* de hoeveelheid gas die overeenkomstig de meetapparatuur van de beheerder per
      tijdsperiode fysiek over het punt heeft gestroomd;
        - *«stuurafwijking»:* het verschil tussen de hoeveelheid gas die de beheerder en de netbeheerder van het landelijk
      gastransportnet voornemens waren te doen stromen, en de gemeten hoeveelheid.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel2
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel3
    references:
