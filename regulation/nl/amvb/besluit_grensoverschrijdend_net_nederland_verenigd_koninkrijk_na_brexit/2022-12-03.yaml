  - number: '33.1'
    text: |-
      Een partij die een geschil heeft met een beheerder van een landsgrensoverschrijdend net dat de grens met het
      Verenigd Koninkrijk overschrijdt over de wijze waarop deze zijn taken en bevoegdheden op grond van dit besluit
      uitoefent, dan wel aan zijn verplichtingen op grond van dit besluit voldoet, kan een klacht bij de Autoriteit
      Consument en Markt indienen.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel33
  - number: '33.2'
    text: |-
      De Autoriteit Consument en Markt beslist op een klacht binnen twee maanden na ontvangst van de klacht. De
      Autoriteit Consument en Markt kan de in de eerste volzin genoemde termijn met twee maanden verlengen als zij
      aanvullende gegevens nodig heeft. Indien de klager daarmee instemt, is verdere verlenging mogelijk.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel33
  - number: '33.3'
    text: |-
      De geschilbeslechtingswerkzaamheden worden niet verricht door personen die betrokken zijn bij werkzaamheden op
      grond van [hoofdstuk 3, paragrafen 4 tot en met 6, van de Elektriciteitswet 1998][ref1] dan wel op grond van
      [hoofdstuk 2, paragrafen 2.2. en 2.3, van de Gaswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Paragraaf4
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Paragraaf2.2
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0009755
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0011440
        paragraaf: '2.2'
  - number: '33.4'
    text: De beslissing van de Autoriteit Consument en Markt is bindend.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel33
  - number: '33.5'
    text: |-
      Het indienen van een klacht als bedoeld in het eerste lid, laat onverlet elke mogelijkheid voor de desbetreffende
      partij een hem ter beschikking staand rechtsmiddel aan te wenden.
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel33
  - number: '34'
    text: 'Dit besluit kan worden aangehaald als: Besluit grensoverschrijdend net Nederland – Verenigd Koninkrijk na Brexit.'
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel34
  - number: '35'
    text: |-
      Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende
      artikelen of onderdelen daarvan verschillend kan worden vastgesteld, en met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel35
  - number: 35.a)
    text: |-
