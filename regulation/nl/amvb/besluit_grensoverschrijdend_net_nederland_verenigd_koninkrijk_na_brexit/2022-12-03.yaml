  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Economische Zaken en Klimaat van 4 februari 2019, nr. WJZ / 19028033;

    Gelet op de artikelen 10Aa, achtste lid, van de Elektriciteitswet 1998 en 2b, zevende lid, van de Gaswet;

    De Raad van State gehoord (advies van 28 februari 2019, nr. No.W18.19.0032/IV);

    Gezien het nader rapport van Onze Minister van Economische Zaken en Klimaat van 12 maart 2019, nr. WJZ / 19061962;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - *«Landsgrensoverschrijdend net dat
      de grens met het Verenigd Koninkrijk overschrijdt»:* een landsgrensoverschrijdend net dat de grens met een
      derde land overschrijdt als bedoeld in [artikel 10Aa, achtste lid, van de Elektriciteitswet 1998][ref1] dan wel
      [artikel 2b, zevende lid, van de Gaswet][ref2];
        - *«Beheerder van een landsgrensoverschrijdend net dat de grens met het Verenigd Koninkrijk overschrijdt»:* de
      beheerder als bedoeld in [artikel 3][ref3] dan wel [artikel 18][ref4];
        - *«landelijk netbeheerder»:* de netbeheerder van het landelijk hoogspanningsnet, als bedoeld in
      [artikel 10, eerste lid, van de Elektriciteitswet 1998][ref5], dan wel de netbeheerder van het landelijk
      gastransportnet, als bedoeld in [artikel 2, eerste lid, van de Gaswet][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel10Aa
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel2b
      [ref3]: https://wetten.overheid.nl/BWBR0042110#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0042110#Artikel18
      [ref5]: https://wetten.overheid.nl/BWBR0009755#Artikel10
      [ref6]: https://wetten.overheid.nl/BWBR0011440#Artikel2
    url: https://wetten.overheid.nl/BWBR0042110/2022-12-03#Artikel1
