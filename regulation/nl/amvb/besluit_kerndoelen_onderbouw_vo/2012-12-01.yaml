articles:
  - number: '1'
    text: |-
      De kerndoelen, bedoeld in de [artikelen 11b][ref1] en [11e van de Wet op het voortgezet onderwijs][ref2], worden
      vastgesteld als aangegeven in de bij dit besluit behorende bijlage.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel11b
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel11e
    url: https://wetten.overheid.nl/BWBR0019945/2012-12-01#Artikel1
    references:
      - id: ref1
