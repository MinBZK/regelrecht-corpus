        artikel: 11b
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 11e
  - number: '3'
    text: |-
      Een vrijstelling die is verleend op grond van [artikel 11e van de Wet op het voortgezet onderwijs][ref1]
      geldt met ingang van de inwerkingtreding van dit besluit als een ontheffing die is verleend op grond van
      [artikel 11d van de Wet op het voortgezet onderwijs][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel11e
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel11d
