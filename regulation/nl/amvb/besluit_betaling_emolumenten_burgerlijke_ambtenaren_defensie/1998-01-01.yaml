preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Defensie van 1 februari 1993, nr. PAV2210/93002671;


    Gelet op de artikelen 125, eerste lid, en 134, eerste lid, van de Ambtenarenwet 1929;


    De Raad van State gehoord (advies van 29 maart 1993, nr. W07.93.0071;


    Gezien het nader rapport van Onze Minister van Defensie van 16 juni 1993, nr. PAV2210/93008953;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006037/1998-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. ambtenaar: degene die ambtenaar is in de zin van het [Burgerlijk ambtenarenreglement defensie][ref1];

      b. bezoldigingsbesluit: [Bezoldigingsbesluit burgerlijke ambtenaren defensie][ref2];

      c. berekeningsbasis: de bezoldiging in de zin van het bezoldigingsbesluit met uitzondering van de toelagen als
      genoemd in artikelen 15, 17 en 18 van dat besluit, met dien verstande dat de bezoldiging bij een onvolledige
      werktijd herleid wordt tot de bezoldiging, geldende bij een volledige werktijd;

      d. Onze Minister: Onze Minister van Defensie;

      e. dienstauto: auto die ten behoeve van zakelijk gebruik eigendom is van het Rijk of vanwege het Rijk is gehuurd
      of geleast;

      f. plaats van tewerkstelling: de gebruikelijke ingang van het gebouw, gebouwencomplex of terrein waar de ambtenaar
      gewoonlijk zijn werkzaamheden verricht, dan wel indien de uitoefening van het ambt zich uitstrekt over een
      ambtsgebied, de door het bevoegde gezag aangewezen plaats;

      g. privé-kilometers: alle door de ambtenaar met de dienstauto verreden kilometers verminderd met

      - het aantal kilometers tijdens dienstreizen,
      - het aantal woon-/werkverkeerkilometers.


      [ref1]: https://wetten.overheid.nl/BWBR0006040
      [ref2]: https://wetten.overheid.nl/BWBR0006038
    url: https://wetten.overheid.nl/BWBR0006037/1998-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006040
      - id: ref2
        bwb_id: BWBR0006038
  - number: '2'
    text: |-
      1 De ambtenaar is voor het van rijkswege verstrekte genot van kost en inwoning, anders dan bij een dienstreis
      als bedoeld in [artikel 1, onderdeel ](onbekend), aan het Rijk een bedrag verschuldigd overeenkomende met
      respectievelijk 12% en 8% van zijn berekeningsbasis, zulks met inachtneming van door Onze Minister aan te geven
      maxima.

      2 Voor de ambtenaar, wiens berekeningsbasis gelijk aan of lager is dan het maandbedrag van het minimumloon dat
      krachtens de [artikelen 7][ref1], 8 en [14 van de Wet minimumloon en minimumvakantiebijslag][ref2] geldt voor
      werknemers in de leeftijd van 23 jaar of ouder vindt het eerste lid geen toepassing, maar worden de verschuldigde
      bedragen voor de emolumenten kost en inwoning door Onze Minister vastgesteld.

      3 Bij geoorloofde afwezigheid wordt het bedrag dat voor het genot van kost verschuldigd zou zijn voor elke dag dat
      dit emolument niet wordt genoten, verminderd met een bedrag dat door Onze Minister wordt vastgesteld aan de hand
      van het in het tweede lid bedoelde bedrag dat voor het emolument kost verschuldigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel14
    url: https://wetten.overheid.nl/BWBR0006037/1998-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '14'
  - number: '3'
    text: >-
      1 De ambtenaar is voor het van rijkswege verstrekte genot van woning en verdere verstrekkingen in die woning aan
      het Rijk een bedrag verschuldigd overeenkomende met de hierna genoemde percentages van zijn berekeningsbasis:


      a. voor woning: 12%;


      b. voor verwarming van de woning: 2,4%;


      c. voor energie voor kookdoeleinden: 0,9%;


      d. voor elektrische energie, anders dan voor verwarming van de woning en voor kookdoeleinden: 0,9%;


      e. voor leidingwater: 0,4%,


      zulks met inachtneming van door Onze Minister aan te geven maxima voor de verstrekkingen bedoeld onder *b* tot en
      met *e*.


      2 Indien de ambtenaar aantoont dat de huurwaarde van de woning voor de heffing van de inkomsten- en loonbelasting
      minder bedraagt dan het op grond van het bepaalde in het eerste lid geldende bedrag wegens het genot van woning,
      wordt het verschuldigde bedrag op dat van die huurwaarde gesteld.


      3 Voor het genot van de emolumenten genoemd in het eerste lid, onder *b* tot en met *e*, is geen bedrag
      verschuldigd in het geval, bedoeld in het tweede lid, en in de gevallen waarin tevens kost en inwoning wordt
      genoten.
    url: https://wetten.overheid.nl/BWBR0006037/1998-01-01#Artikel3
  - number: '4'
    text: >-
      1 De ambtenaar aan wie door Onze Minister toestemming is verleend om een dienstauto voor het afleggen van privé-
      kilometers te gebruiken, is daarvoor per verreden kilometer een door Onze Minister vast te stellen bedrag aan het
      Rijk verschuldigd.


      2 Op basis van een zo nauwkeurig mogelijke inschatting van de af te leggen privé-kilometers wordt bij wijze van
      voorschot een maandelijks verschuldigd bedrag vastgesteld.


      3 De op grond van het eerste lid verschuldigde bedragen worden verrekend met reeds betaalde voorschotten. De
      verrekening geschiedt binnen drie maanden na door Onze Minister te bepalen tijdstippen.


      4 De navolgende kosten die verband houden met het onderhoud en gebruik van een voor het afleggen van privé-
      kilometers ter beschikking gestelde dienstauto zijn voor rekening van de ambtenaar:


      a. kosten voor boetes en bekeuringen;


      b. kosten voor reiniging van de auto;


      c. kosten voor aanpassingen aan of in de auto, tenzij Onze Minister te kennen heeft gegeven dat de aanpassingen in
      verband met de dienstuitoefening noodzakelijk zijn;


      d. parkeer-, veer- en tolgelden bij privé-gebruik van de auto.


      5 De ambtenaar kan worden verplicht tot gehele of gedeeltelijke vergoeding van de door de dienst geleden
      schade verband houdende met het gebruik van een voor het afleggen van privé-kilometers ter beschikking gestelde
      dienstauto, voor zover deze aan hem is te wijten dan wel is veroorzaakt door een persoon wiens handelen aan de
      ambtenaar kan worden toegerekend.


      6 De kosten die verband houden met een tussentijdse beëindiging van een leasecontract voor een dienstauto kunnen
      geheel of gedeeltelijk op de ambtenaar worden verhaald volgens de door Onze Minister te stellen regels.


      7 De meerkosten voor zowel het privé-gebruik als het zakelijk gebruik van de op verzoek van de ambtenaar ter
      beschikking gestelde dienstauto waarvan de cataloguswaarde uitgaat boven het door Onze Minister vastgestelde
      gebruikelijke bedrag worden op de ambtenaar verhaald volgens de door Onze Minister te stellen regels.
    url: https://wetten.overheid.nl/BWBR0006037/1998-01-01#Artikel4
  - number: '5'
    text: >-
      1 In bijzondere gevallen kan door Onze Minister een regeling worden getroffen, die afwijkt van de bij of krachtens
      dit besluit gestelde regels.


      2 In geval andere dan de in dit besluit genoemde voordelen worden genoten, kan door Onze Minister een regeling
      worden getroffen waarbij de hiervoor door de ambtenaar verschuldigde bedragen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006037/1998-01-01#Artikel5
  - number: '6'
    text: >-
      1 De op grond van de bepalingen van dit besluit door de ambtenaar verschuldigde bedragen worden verrekend bij de
      uitbetaling van het salaris of het loon, dan wel, indien dit niet mogelijk is, afzonderlijk in rekening gebracht.


      2 Wanneer de verschuldigde bedragen moeten worden berekend over een gedeelte van een kalendermaand, wordt het
      bedrag per dag vastgesteld door een maandbedrag te delen door het aantal dagen van de desbetreffende kalendermaand.


      3 Van het bepaalde in het tweede lid kan worden afgeweken in geval daartoe op grond van bijzondere omstandigheden
      aanleiding bestaat.
    url: https://wetten.overheid.nl/BWBR0006037/1998-01-01#Artikel6
  - number: '8'
    text: |-
      Na de inwerkingtreding van dit besluit gelden ten aanzien van de ambtenaar als genoemd in [artikel 1][ref1] van
      dit besluit de krachtens het [Besluit betaling emolumenten burgerlijk rijkspersoneel][ref2] vastgestelde nadere
      regels, de regeling van de Minister van Binnenlandse Zaken van 16 maart 1993, houdende wijziging vergoedingen
      Besluit betaling emolumenten rijkspersoneel, als nadere regels berustende op dit besluit voor zover zij daarmede
      niet in strijd zijn. Zij blijven gedurende één jaar na het in werking treden van dit besluit van toepassing op de
      in [artikel 1][ref3] genoemde ambtenaar tenzij Onze Minister anders bepaalt.


      [ref1]: https://wetten.overheid.nl/BWBR0006037#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003632
      [ref3]: https://wetten.overheid.nl/BWBR0006037#Artikel1
