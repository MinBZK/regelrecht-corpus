  - number: '9'
    text: |-
      1 De aansluitende uitkering bedraagt tot uiterlijk twee maanden na de dag waarop het ontslag ingaat 85%, gedurende
      de daaropvolgende tien maanden 80%, gedurende de daaropvolgende zes maanden 75% en vervolgens 70% van het voor
      betrokkene geldende dagloon.

      2 Gedurende de verlenging, bedoeld in [artikel 2, vijfde lid][ref1], is de uitkering gelijk aan 70% van het voor
      betrokkene geldende dagloon.

      3 In afwijking van het tweede lid is de uitkering van de betrokkene, bedoeld in [artikel 2, vijfde lid][ref2],
      gelijk aan 50% van het voor betrokkene geldende dagloon vanaf het moment dat hij de leeftijd van 63 jaar en
      twee maanden heeft bereikt. De uitkering is in ieder geval gelijk aan het minimumloon in evenredigheid met de
      betrekkingsomvang van betrokkene op het moment van het ontslag.

      4 Bij de toepassing van het eerste lid wordt rekening gehouden met de termijn waarin de betrokkene reeds recht
      heeft gehad op aanvullende uitkering.

      5 Ten aanzien van de hoogte van de aansluitende uitkering is
      [artikel 47, tweede en derde lid, van de Werkloosheidswet][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012022#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012022#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel47
