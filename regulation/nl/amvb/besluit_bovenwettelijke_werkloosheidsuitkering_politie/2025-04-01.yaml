  - number: 26a
    text: |-
      Indien de betrokkene van wie de eerste werkloosheidsdag is gelegen voor 1 januari 2005 uitsluitend als
      gevolg van de Wet van 19 december 2003 tot wijziging van de Werkloosheidswet in verband met afschaffing
      van de vervolguitkering (Stb. 546) geen aanspraak meer heeft op een vervolguitkering ingevolge de
      [Werkloosheidswet][ref1], en de voor hem met toepassing van [artikel 8, vijfde lid][ref2], vastgestelde
      duur van de aansluitende uitkering korter is dan de duur van de afgeschafte vervolguitkering krachtens de
      [Werkloosheidwet][ref3], wordt in afwijking van [artikel 8, vijfde lid][ref4], de duur van de aansluitende
      uitkering gesteld op de duur van die afgeschafte vervolguitkering.


