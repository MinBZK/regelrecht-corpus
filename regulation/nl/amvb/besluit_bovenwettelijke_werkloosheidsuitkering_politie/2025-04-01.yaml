  - number: '5'
    text: |-
      1 Indien de betrokkene gedurende de periode dat hij recht heeft op een WW-uitkering wegens ziekte verhinderd is
      arbeid te verrichten en deswege een ZW-uitkering geniet, wordt de ZW-uitkering aangevuld tot de percentages van het
      dagloon, genoemd in [artikel 4][ref1], met inachtneming van de daaraan voorafgaande termijn waarover de betrokkene
      recht op een aanvullende uitkering op grond van dit besluit heeft gehad.

      2 Indien het recht op de WW-uitkering na afloop van de periode waarin de [Ziektewet][ref2] op de betrokkene van
      toepassing is geweest, herleeft, telt zowel de termijn waarover de betrokkene voorafgaand aan deze periode recht
      heeft gehad op een WW-uitkering als de termijn waarin de [Ziektewet][ref3] op hem van toepassing is geweest, mee
      voor het vaststellen van de hoogte van de aanvullende uitkering, bedoeld in [artikel 4][ref4].

      3 Voor de toepassing van dit artikel worden de WW-uitkering en de ZW-uitkering steeds geacht onverminderd door de
      betrokkene te zijn genoten.


