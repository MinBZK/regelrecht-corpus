  - number: 26cc
    text: |-
      1 De betrokkene, bedoeld in [artikel 26cb][ref1], heeft bij het bereiken van de leeftijd van 65 jaar:

      a. vóór 1 april 2017, recht op de financiële compensatie als bedoeld in het tweede lid;

      b. op of na 1 april 2017, recht op de tegemoetkoming als bedoeld in het derde lid.

      2 De financiële compensatie wordt berekend door het aantal maanden dat de AOW-gerechtigde
      leeftijd van de betrokkene later ligt dan de datum waarop deze de leeftijd van 65 jaar
      heeft bereikt te vermenigvuldigen met 70% van het bedrag van het minimumloon, bedoeld in
      [artikel 8, eerste lid, onderdeel b, van de Wet minimumloon en minimumvakantiebijslag][ref2].

      3 De tegemoetkoming bestaat uit:

      a. een uitkering die netto een bedrag oplevert dat gelijk is aan het ouderdomspensioen, verhoogd met de
      vakantiebijslag, dat de betrokkene op grond van de Algemene ouderdomswet had ontvangen, indien die wet al op hem
      van toepassing was geweest;

      b. een financiële compensatie voor de verlaging van het ouderdomspensioen, als bedoeld in hoofdstuk 5 van het
      pensioenreglement, wegens het eerder ingaan van dit pensioen dan de op dat moment geldende pensioenrekenleeftijd,
      als bedoeld in de bijlage 2 bij het pensioenreglement, waarbij voor de vaststelling van de omvang van de verlaging
      wordt uitgegaan van een ingang van het ouderdomspensioen bij het bereiken van de leeftijd van 65 jaar door de
      betrokkene;

      c. een aanvullend bedrag voor zover de op grond van de onderdelen a en b vastgestelde aanspraken tezamen minder
      bedragen dan 90 procent van de gerechtvaardigde aanspraak.

      4 De tegemoetkoming wordt met ingang van het bereiken van de leeftijd van 65 jaar maandelijks uitgekeerd en eindigt
      met ingang van de dag waarop de betrokkene de AOW-gerechtigde leeftijd heeft bereikt, waarbij geldt dat het op
      grond van het derde lid, onderdeel b, berekende totaal in die periode wordt uitgekeerd. Indien de betrokkene
      overlijdt voordat hij de AOW-gerechtigde leeftijd bereikt, eindigt de tegemoetkoming met ingang van de dag volgend
      op de dag van overlijden.

      5 De aan de in het eerste lid, onderdeel a, bedoelde betrokkene op grond van
      __REF000___________________________________________________________________________________________________________
      ________________________________________________________________________________________________________ van 5 juni
      2015 eerder uitbetaalde financiële compensatie, wordt geacht op grond van het tweede lid te zijn toegekend.

      6 De in het derde lid bedoelde tegemoetkoming wordt verminderd met de financiële compensatie
      die de betrokkene, bedoeld in het eerste lid, onderdeel b, heeft ontvangen op grond van
      __REF000___________________________________________________________________________________________________________
      ________________________________________________________________________________________________________ van 5 juni
      2015.


