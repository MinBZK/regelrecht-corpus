  - number: '6'
    text: |-
      1 Zo spoedig mogelijk na het overlijden van de betrokkene wordt de uitkering, bedoeld in [artikel 35][ref1] of
      [36 van de Ziektewet][ref2], aangevuld tot 100% van het voor de betrokkene geldende dagloon over drie maanden.

      2 Voor de toepassing van het eerste lid wordt de betrokkene geacht steeds onverminderd ziekengeld te hebben
      genoten.


