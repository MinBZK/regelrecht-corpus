  - number: '15'
    text: |-
      Aan de betrokkene die buiten de sector politie arbeid gaat verrichten, kan inzake de kosten
      die voor hem aan een daartoe noodzakelijke verhuizing zijn verbonden, op zijn aanvraag een
      tegemoetkoming worden toegekend tot ten hoogste het bedrag van een vergoeding volgens de normen van
      [hoofdstuk IV van het Besluit reis-, verblijf-, en verhuiskosten politie][ref1] onder verrekening van een
      tegemoetkoming in verhuiskosten door derden.


      [ref1]: https://wetten.overheid.nl/BWBR0024064#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0012022/2025-04-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0024064
        hoofdstuk: IV
  - number: '16'
    text: |-
      Het recht op de bovenwettelijke uitkering kan op aanvraag van de betrokkene worden afgekocht tegen 30% van de
      nominale waarde.
    url: https://wetten.overheid.nl/BWBR0012022/2025-04-01#Artikel16
  - number: '17'
    text: |-
      Het bevoegd gezag kan de betrokkene op zijn aanvraag tegemoetkomen in de pensioenopbouw tijdens de duur van de
      werkloosheid, bedoeld in artikel 5.4 van het pensioenreglement, zodanig dat de duur van de werkloosheid niet
      voor de helft maar voor driekwart zal meetellen. In dat geval dient de betrokkene met het Pensioenfonds een
      aanvullende individuele regeling overeen te komen krachtens artikel 16.2 van het pensioenreglement en is de in het
      pensioenreglement vastgestelde premieverdeling tussen het bevoegd gezag en de betrokkene van toepassing.
    url: https://wetten.overheid.nl/BWBR0012022/2025-04-01#Artikel17
  - number: '18'
    text: |-
      Indien het niveau van de WW-uitkering een algemene verlaging ondergaat, wordt deze verlaging, behoudens indien Onze
      Minister van Veiligheid en Justitie met de Commissie voor georganiseerd overleg in politie-ambtenarenzaken, bedoeld
      in [artikel 2 van het Besluit overleg en medezeggenschap politie 1994][ref1], overeenstemming bereikt binnen de
      looptijd van het vigerende arbeidsvoorwaardenakkoord, op overeenkomstige wijze doorgevoerd ten aanzien van het
      totaal aan wettelijke en bovenwettelijke aanspraken van de betrokkene, vanaf de in het Staatsblad vermelde datum
      van inwerkingtreding van bedoelde verlaging, doch niet eerder dan de eerste dag na de einddatum van het vigerende
      arbeidsvoorwaardenakkoord.


      [ref1]: https://wetten.overheid.nl/BWBR0006518#Artikel2
    url: https://wetten.overheid.nl/BWBR0012022/2025-04-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006518
        artikel: '2'
  - number: '19'
    text: Het dagloon wordt aangepast overeenkomstig een algemene salarismaatregel in de sector Politie.
    url: https://wetten.overheid.nl/BWBR0012022/2025-04-01#Artikel19
  - number: '20'
    text: |-
      1 Het bevoegd gezag is belast met de uitvoering van dit besluit.

      2 Het bevoegd gezag kan ter uitvoering van dit besluit nadere voorschriften van administratieve aard stellen.
    url: https://wetten.overheid.nl/BWBR0012022/2025-04-01#Artikel20
  - number: '26'
    text: |-
      Ontslaguitkeringen die zijn toegekend op de voet van de bepalingen van het [Rijkswachtgeldbesluit 1959][ref1] en de
      [Uitkeringsregeling 1966][ref2], zoals die luidden op 1 januari 1998, blijven uitsluitend voor wat betreft hoogte,
      duur en voor wat betreft de anticumulatie, indien de betrokkene in de zes maanden voorafgaand aan 1 januari 2001
      gedurende ten minste drie maanden neveninkomsten uit arbeid of bedrijf heeft genoten, gedurende tien jaren dan wel,
      indien betrokkene op 31 december 2000 50 jaar of ouder is, gedurende maximaal 15 jaar, behouden gedurende de duur
      van de uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0002326
      [ref2]: https://wetten.overheid.nl/BWBR0002537
