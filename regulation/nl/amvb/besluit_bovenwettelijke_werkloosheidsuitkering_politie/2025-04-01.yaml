    text: |-
      De [artikelen 2, vierde lid][ref1], en [8, vierde lid][ref2], zoals die luidden op 30 juni 2016, blijven van
      toepassing ingeval de betrokkene:

      a. op 1 juli 2016 gebruik maakt van de regelingen vervat in die artikelonderdelen, of

      b. in de periode op of na 1 januari 2013 tot uiterlijk 1 juli 2016 gebruik heeft gemaakt van die regelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0012022#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012022#Artikel8
