  - number: '4'
    text: |-
      1 Indien de duur van de bovenwettelijke uitkering, berekend op basis van [artikel 2][ref1], ten
      minste gelijk is aan de duur van de WW-uitkering, berekend op basis van de artikelen [42][ref2] of
      [52g van de Werkloosheidswet][ref3], wordt de WW-uitkering gedurende de eerste twee maanden tot 85%, gedurende de
      daaropvolgende tien maanden tot 80%, gedurende de daaropvolgende zes maanden tot 75% en vervolgens tot 70% van het
      voor de betrokkene geldende dagloon aangevuld.

      2 Indien de duur van de bovenwettelijke uitkering, berekend op basis van [artikel 2][ref4], korter is dan de duur
      van de WW-uitkering, berekend op basis van de artikelen [42][ref5] of [52g van de Werkloosheidswet][ref6], wordt
      de uitkering, bedoeld in de artikelen [42][ref7] of [52g van de Werkloosheidswet][ref8], gedurende de eerste twee
      maanden tot 85%, gedurende de daaropvolgende tien maanden tot 80%, gedurende de daarop volgende zes maanden tot 75%
      en vervolgens tot 70% aangevuld.

      3 Voor de toepassing van dit artikel wordt de WW-uitkering steeds geacht door de betrokkene onverminderd te zijn
      genoten.


