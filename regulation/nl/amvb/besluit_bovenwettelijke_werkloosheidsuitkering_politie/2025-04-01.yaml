  - number: 9a
    text: |-
      1 In afwijking van [artikel 8, derde lid][ref1], zijn de [artikelen 20, eerste lid, onder b][ref2], [35a][ref3]
      en [35aa van de Werkloosheidswet][ref4] niet van overeenkomstige toepassing op de betrokkene, op wie
      [artikel 9, derde lid][ref5] van toepassing is.

      2 De inkomsten die de betrokkene, op wie [artikel 9, derde lid][ref6], van toepassing is, geniet of gaat genieten
      uit of in verband met arbeid of bedrijf, worden in mindering gebracht op de uitkering.

      3 De in het tweede lid bedoelde vermindering is gelijk aan het bedrag waarmee de onverminderde uitkering van 50%
      van het voor hem geldende dagloon, vermeerderd met het totaalbedrag van de inkomsten, het voor hem geldende dagloon
      te boven gaat.

      4 Inkomsten als bedoeld in het tweede lid, die geacht worden op één maand betrekking te hebben of geacht kunnen
      worden te hebben, worden in mindering gebracht op de uitkering over die maand.


