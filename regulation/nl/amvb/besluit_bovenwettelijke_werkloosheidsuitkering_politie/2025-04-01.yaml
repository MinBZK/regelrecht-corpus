  - number: '2'
    text: |-
      1 Met ingang van de dag waarop het ontslag ingaat heeft de betrokkene recht op een bovenwettelijke uitkering, zoals
      neergelegd in [hoofdstuk 2][ref1] en [hoofdstuk 3][ref2] van dit besluit.

      2 De maximale duur van de uitkering is drie maanden, vermeerderd voor de betrokkene, die op de dag waarop het
      ontslag ingaat:

      a. de leeftijd van 21 jaar nog niet heeft bereikt: met een duur gelijk aan 18% van de diensttijd;

      b. 21 jaar of ouder is: met een duur van 19,5% van de diensttijd en vervolgens per leeftijdsjaar vermeerderd met
      1,5%;

      c. 60 jaar of ouder is: met een duur gelijk aan 78% van de diensttijd.

      3 Indien uitgaande van het moment van ontslag de maximale uitkeringsduur, berekend op grond van het tweede lid,
      langer is dan de duur van de WW-uitkering, wordt het verschil in duur tot een maximum van twee jaar in mindering
      gebracht op de maximale uitkeringsduur. Vervolgens wordt:

      a. voor elk jaar dat de diensttijd langer is dan tien jaar de duur verminderd met een halve maand, tot een maximum
      van 14 maanden, en

      b. voor elk jaar dat de diensttijd langer is dan achttien jaar de duur verminderd met een maand tot een maximum
      van 22 maanden.

      Bij het berekenen van de vermindering van de maximale uitkeringsduur worden de maanden en de halve maanden bij
      elkaar opgeteld en wanneer die berekening niet leidt tot een aantal gehele maanden, telt een halve maand voor 15
      kalenderdagen.

      4 De vermindering van de maximale duur van de uitkering, berekend op grond van het derde lid, kan er niet toe
      leiden dat de duur van de uitkering korter wordt dan de duur van de WW-uitkering.

      5 De duur van de uitkering van de betrokkene die ten tijde van het ontslag maximaal 7,5 jaar jonger is dan de op
      dat moment voor betrokkene van toepassing zijnde AOW-gerechtigde leeftijd en een diensttijd, voor zover geldig
      voor pensioen, van ten minste tien jaar heeft volbracht, wordt na afloop van de termijn die op basis van het
      tweede en derde lid is toegekend, verlengd tot de eerste dag van de kalendermaand volgend op die waarin hij de AOW-
      gerechtigde leeftijd heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0012022#Hoofdstuk2
