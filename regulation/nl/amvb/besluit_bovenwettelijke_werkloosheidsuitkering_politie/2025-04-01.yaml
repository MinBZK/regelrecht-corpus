  - number: '14'
    text: |-
      1 De betrokkene die een nieuwe dienstbetrekking aanvaardt, kan op zijn aanvraag gedurende de op basis van
      [artikel 2][ref1] voor hem vastgestelde uitkeringsduur een loonaanvulling krijgen, indien de door hem ontvangen
      WW-uitkering, bovenwettelijke uitkering en het inkomen uit de nieuwe dienstbetrekking per maand tezamen minder
      bedragen dan het maandloon.

      2 Het maximum bedrag tot waaraan loonaanvulling plaatsvindt, wordt als volgt berekend:

      a. (B/C) x (D x E) = F

      b. (G/C) x E – H = I

      c. F + H + I = J

      Hierbij staat voor:

      B het aantal uren werkloosheid dat zou resteren, indien het recht zou zijn beëindigd op basis van het aantal uren
      van de nieuwe dienstbetrekking;

      C het aantal arbeidsuren dat betrokkene gemiddeld per week in de politiedienstbetrekking werkzaam was in de 26
      weken onmiddellijk voorafgaand aan de kalenderweek waarin de eerste werkloosheidsdag is gelegen;

      D het voor betrokkene geldende uitkeringspercentage van de bovenwettelijke uitkering;

      E het maandloon;

      F het bedrag van de uitkering waarop bij urenverrekening aanspraak had bestaan;

      G het aantal uren van de nieuwe dienstbetrekking, waarbij geldt dat indien G groter is dan C, G wordt gemaximeerd
      op C;

      H het inkomen per maand uit de nieuwe dienstbetrekking;

      I de loonsuppletie waarop bij urenverrekening aanspraak had bestaan;

      J het maximum bedrag tot waaraan per maand loonaanvulling plaatsvindt.

      3 De loonaanvulling eindigt:

      a. zodra de nieuwe dienstbetrekking eindigt;

      b. zodra het totaal aan WW-uitkering, bovenwettelijke uitkering en inkomen uit de nieuwe dienstbetrekking per maand
      gelijk aan of hoger is dan het maandloon; of

      c. zodra de voor betrokkene op basis van [artikel 2][ref2] vastgestelde uitkeringsduur is verstreken.

      4 Betrokkene dient een aanvraag om loonaanvulling in binnen drie maanden na het aanvaarden van de nieuwe
      dienstbetrekking door middel van een daarvoor bestemd formulier. Bij overschrijding van deze termijn wordt de
      loonaanvulling toegekend vanaf het moment dat de aanvraag is ingediend.

      5 De loonaanvulling telt niet mee voor de berekening van het pensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0012022#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0012022#Artikel2
