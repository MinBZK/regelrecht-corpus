      Voor de ambtenaar die voor 1 januari 2006 recht had op een arbeidsongeschiktheidsuitkering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref1], blijft het Besluit bovenwettelijke werkloosheidsuitkering
      politie gelden, zoals dat luidde op 28 december 2005.


