  - number: '3'
    text: |-
      1 De betrokkene heeft gedurende de periode dat recht bestaat op een WW-uitkering, recht op een aanvullende
      uitkering, met dien verstande dat het recht op een aanvullende uitkering niet eerder ingaat dan de dag waarop het
      ontslag in werking treedt.

      2 Op de aanvullende uitkering zijn de [artikelen 22 tot en met 33][ref1], [36 tot en met 40][ref2],
      [47, tweede en derde lid][ref3], [75][ref4], [76][ref5] en [78 van de Werkloosheidswet][ref6] van overeenkomstige
      toepassing.

      3 De [artikelen 34][ref7] en [35 van de Werkloosheidswet][ref8] zijn slechts van overeenkomstige toepassing op
      de aanvullende uitkering indien de hoogte van de in mindering te brengen inkomsten de uitkering krachtens de
      [Werkloosheidswet][ref9] overstijgen.


