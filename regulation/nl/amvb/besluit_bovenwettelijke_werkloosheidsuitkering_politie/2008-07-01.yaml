  - number: '2'
    text: |-
      1 Met ingang van de dag waarop het ontslag ingaat heeft de betrokkene recht op een bovenwettelijke uitkering, zoals
      neergelegd in [hoofdstuk 2][ref1] en [hoofdstuk 3][ref2] van dit besluit.

      2 De maximale duur van de uitkering is drie maanden, vermeerderd voor de betrokkene, die op de dag waarop het
      ontslag ingaat:

      a. de leeftijd van 21 jaar nog niet heeft bereikt: met een duur gelijk aan 18% van de diensttijd;

      b. 21 jaar of ouder is: met een duur van 19,5% van de diensttijd en vervolgens per leeftijdsjaar vermeerderd met
      1,5%;

      c. 60 jaar of ouder is: met een duur gelijk aan 78% van de diensttijd.

      3 Indien uitgaande van het moment van ontslag de maximale duur van de uitkering, berekend op grond van het tweede
      lid, langer is dan de duur van de WW-uitkering, wordt het verschil in duur tot een maximum van twee jaar in
      mindering gebracht op de maximale duur.

      4 De duur van de uitkering van de betrokkene die ten tijde van het ontslag 57,5 jaar of ouder is en een diensttijd,
      voor zover geldig voor pensioen, van ten minste tien jaar heeft volbracht, wordt na afloop van de termijn die op
      basis van het tweede en derde lid is toegekend, verlengd tot de eerste dag van de kalendermaand volgend op die
      waarin hij de leeftijd van 65 jaar heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0012022#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0012022#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0012022/2008-07-01#Artikel2
