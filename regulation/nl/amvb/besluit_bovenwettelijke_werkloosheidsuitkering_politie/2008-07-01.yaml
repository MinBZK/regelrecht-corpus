  - number: '10'
    text: |-
      1 Zo spoedig mogelijk na het overlijden van de betrokkene wordt onder overeenkomstige toepassing van
      [artikel 35 van de Ziektewet][ref1] een overlijdensuitkering toegekend met een hoogte van 100% van het voor de
      betrokkene geldende dagloon over drie maanden.

      2 Op het uit te keren bedrag, bedoeld in het eerste lid, wordt in mindering gebracht het bedrag van de uitkering
      waarop de nabestaanden van de betrokkene ter zake van zijn overlijden aanspraak kunnen maken op grond van een of
      meer werkloosheidsuitkeringen, arbeidsongeschiktheidsuitkeringen, uitkeringen op grond van de [Ziektewet][ref2]
      dan wel uitkeringen die naar aard en strekking overeenkomen met laatstgenoemde uitkeringen, waarop de betrokkene
      recht had.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0001888
    url: https://wetten.overheid.nl/BWBR0012022/2008-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001888
        artikel: '35'
      - id: ref2
        bwb_id: BWBR0001888
  - number: '11'
    text: |-
      1 De betrokkene die ter zake van ontslag recht heeft op een suppletie als bedoeld in het
      [Besluit suppletieregeling gedeeltelijk arbeidsongeschikten sector politie][ref1], heeft gedurende de termijn dat
      hij recht heeft op die suppletie, geen recht op een bovenwettelijke uitkering krachtens dit besluit.

      2 De betrokkene, bedoeld in het eerste lid, heeft met ingang van de eerste dag volgende op die waarop de duur van
      de suppletie is geëindigd, recht op een bovenwettelijke uitkering krachtens dit besluit, indien de duur van de
      bovenwettelijke uitkering waarop betrokkene krachtens dit besluit recht zou hebben gehad indien hij geen recht op
      suppletie zou hebben gehad, langer is dan de duur van de suppletie.

      3 Ter bepaling van de hoogte en de duur van de bovenwettelijke uitkering, wordt de uitkering geacht te zijn
      ingegaan vanaf de datum van het ontslag, bedoeld in het eerste lid.

      4 Het recht op bovenwettelijke uitkering eindigt na ommekomst van de duur van de bovenwettelijke uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0008099
    url: https://wetten.overheid.nl/BWBR0012022/2008-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008099
  - number: '12'
    text: |-
      1 De betrokkene die ter zake van ontslag wegens ongeschiktheid tot het verrichten van zijn arbeid wegens
      ziekte recht heeft op een uitkering krachtens de [Wet op de arbeidsongeschiktheidsverzekering][ref1],
      berekend naar een arbeidsongeschiktheid van 80% of meer, heeft recht op een bovenwettelijke uitkering
      krachtens dit besluit op het moment dat de mate van arbeidsongeschiktheid op een lager percentage wordt
      vastgesteld dan 80% en hij daardoor recht heeft op een WW-uitkering. Indien de uitkering krachtens de
      [Wet op de arbeidsongeschiktheidsverzekering][ref2], bedoeld in de eerste volzin, is ontstaan uit twee of
      meer dienstbetrekkingen wordt het recht op bovenwettelijke uitkering krachtens dit besluit toegerekend aan de
      dienstbetrekking ter zake waarvan hij betrokkene is in de zin van dit besluit, naar rato van de feitelijk genoten
      inkomsten op grond van de desbetreffende dienstbetrekkingen.

      2 Ter bepaling van de hoogte en de duur van de bovenwettelijke uitkering, wordt uitgegaan van de datum van het
      ontslag, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0012022/2008-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0002524
  - number: '13'
    text: |-
      1 Indien het recht op een bovenwettelijke uitkering geheel of gedeeltelijk is geëindigd wegens het
      aanvaarden van een nieuwe dienstbetrekking en de betrokkene wederom werkloos is geworden in de zin van de
      [Werkloosheidswet][ref1], herleeft op zijn aanvraag het recht op een bovenwettelijke uitkering voor zover een nieuw
      recht op een WW-uitkering is ontstaan.

      2 De betrokkene die onmiddellijk aansluitend aan zijn ontslag een nieuwe dienstbetrekking heeft aanvaard en die
      werkloos is geworden in de zin van de [Werkloosheidswet][ref2], heeft op zijn aanvraag recht op een bovenwettelijke
      uitkering krachtens dit besluit voor zover een recht op een WW-uitkering zou zijn ontstaan op het moment van
      ontslagverlening en voor zover een recht op WW-uitkering bestaat op het moment van werkloos worden, met ingang van
      de eerste dag waarop recht op WW-uitkering is ontstaan.

      3 De betrokkene die binnen twee jaar nadat hem wegens privatisering van zijn dienstonderdeel ontslag
      uit de politiedienst is verleend, wordt ontslagen als gevolg van de opheffing van zijn betrekking bij de
      privaatrechtelijke organisatie of als gevolg van overtolligheid van personeel door verandering of inkrimping
      van die organisatie, en op die grond recht heeft op een WW-uitkering, heeft op zijn aanvraag recht op een
      bovenwettelijke uitkering. De duur en de hoogte van de bovenwettelijke uitkering zijn gelijk aan de duur en de
      hoogte van de bovenwettelijke uitkering waarop de betrokkene op de ingangsdatum van zijn privatiseringsontslag
      recht zou hebben gehad, met dien verstande dat in afwijking van [artikel 2, eerste en tweede lid][ref3], het recht
      op de bovenwettelijke uitkering ingaat op het moment van het ontslag bij de privaatrechtelijke organisatie.

      4 De duur en hoogte van de bovenwettelijke uitkering als bedoeld in het eerste en tweede lid zijn gelijk aan de
      resterende duur en de daarbij behorende hoogte van de uitkering waarop de betrokkene op grond van dit besluit recht
      zou hebben gehad, indien hij voor het ontslag als betrokkene onafgebroken werkloos zou zijn geweest.

      5 Een recht op bovenwettelijke uitkering, als bedoeld in het eerste en tweede lid, kan slechts ontstaan gedurende
      de termijn welke betrokkene in het geval dat hij onafgebroken werkloos zou zijn geweest, een bovenwettelijke
      uitkering terzake van dat ontslag zou hebben genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004045
      [ref3]: https://wetten.overheid.nl/BWBR0012022#Artikel2
    url: https://wetten.overheid.nl/BWBR0012022/2008-07-01#Artikel13
