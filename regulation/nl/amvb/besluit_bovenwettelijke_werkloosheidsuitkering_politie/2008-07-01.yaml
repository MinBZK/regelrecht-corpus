  - number: '6'
    text: |-
      1 Zo spoedig mogelijk na het overlijden van de betrokkene wordt de uitkering, bedoeld in
      [artikel 35 van de Ziektewet][ref1], aangevuld tot 100% van het voor de betrokkene geldende dagloon over drie
      maanden.

      2 Voor de toepassing van het eerste lid wordt de uitkering krachtens de [Ziektewet][ref2] steeds geacht
      onverminderd door de betrokkene te zijn genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0001888#Artikel35
