  - number: '7'
    text: |-
      Indien ten aanzien van de WW-uitkering of de ZW-uitkering een verplichting of een sanctie wordt opgelegd, wordt die
      verplichting eveneens opgelegd dan wel die sanctie op overeenkomstige wijze toegepast op de aanvullende uitkering.
    url: https://wetten.overheid.nl/BWBR0012022/2008-07-01#Artikel7
  - number: '8'
    text: |-
      1 Indien op het moment van ontslag de duur van de uitkering berekend op basis van [artikel 2][ref1], langer is
      dan de duur van de uitkering berekend op basis van de [Werkloosheidswet][ref2], heeft de betrokkene die het einde
      van de uitkeringsduur krachtens de [Werkloosheidswet][ref3] heeft bereikt, met ingang van dat moment recht op een
      aansluitende uitkering.

      2 Het eerste lid vindt uitzondering, indien de betrokkene gedurende de periode van werkloosheid recht heeft gehad
      op een aanvullende uitkering bij ziekte op grond van [artikel 5][ref4].

      3 Op de aansluitende uitkering zijn de [artikelen 19 tot en met 40][ref5], [47, tweede en derde lid][ref6],
      [75][ref7], [76][ref8] en [78 van de Werkloosheidswet][ref9] van overeenkomstige toepassing.

      4 Het recht op aansluitende uitkering eindigt na ommekomst van de duur van de aansluitende uitkering, maar
      uiterlijk op de eerste dag van de kalendermaand volgend op die waarin de betrokkene de leeftijd van 65 jaar heeft
      bereikt.

      5 De duur van de aansluitende uitkering is de op het moment van ontslag berekende uitkeringsduur op basis van
      [artikel 2 verminderd met de terzake van dat ontslag berekende uitkeringsduur krachtens de Werkloosheidswet][ref10]
      .


