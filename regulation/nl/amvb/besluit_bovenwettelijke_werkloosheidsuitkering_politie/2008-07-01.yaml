  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, Directoraat-Generaal Openbare
    Orde en Veiligheid van 24 november 2000, nummer EA2000/U98287;

    Gelet op artikel 50, eerste lid, en 53 d, eerste lid, van de Politiewet 1993 en artikel 9, zesde lid, van de LSOP-
    wet;

    De Raad van State gehoord (advies van 14 december 2000, nr. W04.00.0556/I);

    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties van 15 december 2000, nr.
    EA2000/U102388, Directoraat-Generaal Openbare Orde en Veiligheid;

    Hebben goedgevonden en verstaan:
