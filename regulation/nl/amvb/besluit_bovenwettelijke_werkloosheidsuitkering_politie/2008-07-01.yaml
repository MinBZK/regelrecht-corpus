  - number: '9'
    text: |-
      1 De aansluitende uitkering bedraagt tot uiterlijk twaalf maanden na de dag waarop het ontslag ingaat 80%,
      gedurende de daaropvolgende zes maanden 75% en vervolgens 70% van het voor hem geldende dagloon. Gedurende de
      verlenging, bedoeld in [artikel 2, derde lid][ref1], is de uitkering gelijk aan 70% van het dagloon.

      2 Bij de toepassing van het eerste lid wordt rekening gehouden met de termijn waarin de betrokkene reeds recht
      heeft gehad op aanvullende uitkering.

      3 Ten aanzien van de hoogte van de aansluitende uitkering zijn de [artikelen 45][ref2] en
      [47, tweede en derde lid, van de Werkloosheidswet][ref3] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012022#Artikel2
