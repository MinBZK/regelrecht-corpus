articles:
  - number: '1'
    text: |-
      1 In dit besluit wordt verstaan onder:

      a. bevoegd gezag: het bevoegd gezag, bedoeld in
      [artikel 1, eerste lid, onderdeel l, van het Besluit algemene rechtspositie politie][ref1];

      b. betrokkene: de ambtenaar, bedoeld in
      [artikel 1, eerste lid, onderdeel i, van het Besluit algemene rechtspositie politie][ref2], die als gevolg
      van ontslag verleend op grond van de [artikelen 89, eerste tot en met het vierde lid en zesde lid][ref3],
      [90, eerste en derde tot en met elfde lid][ref4], [91, eerste lid][ref5], [92][ref6],
      of [94, eerste lid, onderdelen e, f of g, van het Besluit algemene rechtspositie politie][ref7] werkloos is
      geworden in de zin van de [Werkloosheidswet][ref8];

      c. aanvullende uitkering: de aanvullende uitkering bedoeld in [hoofdstuk 2][ref9];

      d. aansluitende uitkering: de aansluitende uitkering bedoeld in [hoofdstuk 3][ref10];

      e. bovenwettelijke uitkering: de aanvullende en aansluitende uitkering gezamenlijk;

      f. dagloon: het dagloon in de zin van de [Werkloosheidswet][ref11], met uitzondering van het bedrag, bedoeld in
      [artikel 17 van de Wet financiering sociale verzekeringen][ref12] met betrekking tot een loontijdvak van een dag,
      waarbij, in het geval sprake is van partieel uittreden of ouderschapsverlof als bedoeld in [artikel 13a][ref13]
      respectievelijk [41 van het Besluit algemene rechtspositie politie][ref14], wordt uitgegaan van het feitelijke
      inkomen onmiddellijk voorafgaand aan het uittreden respectievelijk het verlof;

      g. diensttijd:

      voor zover gelegen voor 1 januari 1996:

      de tijd die voor de betrokkene per 31 december 1995 meetelt voor de pensioenberekening, bedoeld in de [Algemene
      burgerlijke pensioenwet](onbekend);

      voor zover gelegen op of na 1 januari 1996: de tijd gedurende welke de betrokkene overheidswerknemer is in de zin
      van de [Wet privatisering ABP][ref15];

      in beide gevallen met uitzondering van de tijd:

      1°. die voorafgaat aan een ontslag uit een betrekking, bedoeld in de [artikelen 88][ref16] en
      [88a van het Besluit algemene rechtspositie politie][ref17], mits op grond van dat ontslag een uitkering is
      toegekend;

      2°. die in aanmerking is genomen bij de berekening van de duur van een wachtgeld of van een uitkering ter zake van
      onvrijwillige werkloosheid ten laste van de overheid;

      3°. die voorafgaat aan een onderbreking in de diensttijd door ontslag van langer dan een jaar;

      4°. bedoeld in artikel 5.4 van het pensioenreglement;

      5°. in een aangehouden betrekking;

      h. minimumloon: het minimumloon, bedoeld in de [Wet minimumloon en minimumvakantiebijslag][ref18];

      i. pensioenreglement: het pensioenreglement van de Stichting Pensioenfonds ABP;

      j. pensioen: een pensioen in de zin van het pensioenreglement;

      k. privatiseringsoperatie: het uitbesteden of overdragen van werkzaamheden van de overheid aan een bestaande of
      voor dat doel opgerichte privaatrechtelijke organisatie;

      l. privaatrechtelijke organisatie: de privaatrechtelijke organisatie die de werkzaamheden uitvoert die in het kader
      van een privatiseringsoperatie door de overheid zijn uitbesteed of overgedragen;

      m. privatiseringsontslag: het ontslag uit een overheidsbetrekking in het kader van een privatiseringsoperatie;

      n. WW-uitkering: een uitkering krachtens de [Werkloosheidswet][ref19];

      o. ZW-uitkering: een uitkering krachtens de [Ziektewet][ref20].

      2 Bij de bepaling van diensttijd in een aangehouden betrekking wordt in voorkomend geval de diensttijd, bedoeld
      in [artikel D1, tweede lid, van de Algemene burgerlijke pensioenwet](onbekend) zoals dat luidde op 31 december
      1995, mede in aanmerking genomen. Het verzoek, bedoeld in [artikel D2 van genoemde wet](onbekend), wordt daarbij
      geacht te zijn gedaan. Indien voor diensttijd die bij de berekening van de bovenwettelijke uitkering in aanmerking
      is genomen recht op een overheidspensioen anders dan ten laste van de Stichting Pensioenfonds ABP bestaat, worden
      de duur en het bedrag van de bovenwettelijke uitkering met ingang van de dag waarop dit pensioen is ingegaan
      herberekend, waarbij die diensttijd buiten beschouwing wordt gelaten.


