        artikel: '1.1'
  - number: 2a
    text: |-
      1 De werknemer is bevoegd om schriftelijke volmacht te verlenen aan de werkgever om uit het uit te betalen
      minimumloon in zijn naam betalingen te verrichten aan de verhuurder ter zake van de huur van woonruimte van
      de huurprijs, de kosten voor nutsvoorzieningen met een individuele meter en de servicekosten, bedoeld in
      [artikel 237 van Boek 7, derde lid, van het Burgerlijk Wetboek][ref1], indien:

      a. de huurprijs, de kosten voor nutsvoorzieningen met een individuele meter en de servicekosten voor het gedeelte
      van het uit te betalen minimumloon gezamenlijk per betalingstermijn ten hoogste 25% bedraagt van het voor de
      werknemer voor die termijn geldende minimumloon; en

      b. de verhuurder:

      1°. een toegelaten instelling is als bedoeld in [artikel 19, eerste lid, van de Woningwet][ref2]; of

      2°. gecertificeerd is overeenkomstig de bij collectieve arbeidsovereenkomst vastgestelde normen betreffende de
      kwaliteit van huisvesting van werknemers na een conformiteitsbeoordeling van een instelling die door de Raad voor
      Accreditatie, bedoeld in [artikel 2, eerste lid, van de Wet aanwijzing nationale accreditatie-instantie][ref3], is
      geaccrediteerd op grond van deze vastgestelde norm.

      2 Een schriftelijke volmacht als bedoeld in het eerste lid is nietig indien de
      schriftelijke volmacht wordt verleend ten aanzien van kosten voor huisvesting als
      bedoeld in het eerste lid, indien de werknemer als gedetacheerde werknemer als bedoeld in
      [artikel 1, eerste lid, van de Wet arbeidsvoorwaarden gedetacheerde werknemers in de Europese Unie][ref4],
      tijdelijk in Nederland arbeid verricht.

      3 Bij de schriftelijke volmacht, bedoeld in het eerste lid, overlegt de werknemer de afschriften van de
      huurovereenkomst en van de bescheiden, waaruit blijkt dat wordt voldaan aan de vereisten, bedoeld in het eerste
      lid, onderdeel b, aan de werkgever.

      4 De werkgever is bevoegd de betalingen, bedoeld in het eerste lid, te verrichten, indien hij aan de hand van
      de afschriften van de huurovereenkomst en van de bescheiden, bedoeld in het derde lid, heeft vastgesteld dat is
      voldaan aan de eisen, gesteld in het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel237
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0026591#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0038054#Artikel1
