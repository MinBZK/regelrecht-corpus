  - number: 6d
    text: |-
      1 De openbaarmaking van de gegevens, bedoeld in de [artikelen 6b][ref1] en [6c][ref2], geschiedt niet eerder dan
      tien werkdagen, doch uiterlijk dertig werkdagen na de datum waarop het besluit tot openbaarmaking van deze gegevens
      aan belanghebbende bekend is gemaakt.

      2 Indien wordt verzocht om een voorlopige voorziening als bedoeld in [artikel 18pa, zevende lid, van de wet][ref3],
      wordt de termijn van dertig werkdagen, bedoeld in het eerste lid, overeenkomstig opgeschort.


      [ref1]: https://wetten.overheid.nl/BWBR0008222#Artikel6b
      [ref2]: https://wetten.overheid.nl/BWBR0008222#Artikel6c
