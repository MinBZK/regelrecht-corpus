  - number: 2b
    text: |-
      1 De werknemer is bevoegd om als verzekeringnemer schriftelijke volmacht te verlenen aan de werkgever om uit het uit
      te betalen minimumloon in zijn naam betalingen te verrichten aan de zorgverzekeraar ter zake van de verschuldigde
      premie voor zijn zorgverzekering als bedoeld in [artikel 1, onderdeel d, van de Zorgverzekeringswet][ref1] en de
      verschuldigde premie voor een verzekering uitsluitend ter afdekking van zijn verplicht eigen risico, bedoeld in
      artikel 1, onderdeel g, van de Zorgverzekeringswet. De betalingen voor de verzekeringen, bedoeld in de vorige zin,
      bedragen gezamenlijk per betalingstermijn van het loon ten hoogste het bedrag van de geraamde gemiddelde nominale
      premie die een verzekerde voor een zorgverzekering betaalt, vermeerderd met 10 procent, gedeeld door het aantal
      betalingstermijnen voor het betrokken kalenderjaar.

      2 Bij regeling van Onze Minister van Volksgezondheid, Welzijn en Sport wordt jaarlijks uiterlijk 1 november van het
      kalenderjaar het bedrag van de geraamde gemiddelde nominale premie, bedoeld in het eerste lid, vastgesteld voor het
      volgende kalenderjaar.

      3 Bij de schriftelijke volmacht, bedoeld in het eerste lid, overlegt de werknemer de afschriften van de zorgpolis,
      bedoeld in [artikel 1, onderdeel i, van de Zorgverzekeringswet][ref2], en van de verzekeringspolis van de
      verzekering, bedoeld in het eerste lid, aan de werkgever.

      4 De werkgever is bevoegd de betalingen, bedoeld in het eerste lid, te verrichten, indien hij aan de hand van de
      afschriften van de zorgpolis en de verzekeringspolis, bedoeld in het derde lid, heeft vastgesteld dat is voldaan
      aan de eisen, gesteld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel1
