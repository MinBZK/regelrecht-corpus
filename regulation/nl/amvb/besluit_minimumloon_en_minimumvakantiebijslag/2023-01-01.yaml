articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder wet:
      [Wet minimumloon en minimumvakantiebijslag][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002638
    url: https://wetten.overheid.nl/BWBR0008222/2023-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002638
  - number: 1a
    text: |-
      1 Voor de toepassing van het bij of krachtens de wet bepaalde wordt onder dienstbetrekking als bedoeld in
      [artikel 2, eerste lid, van de wet][ref1] mede verstaan de arbeidsverhouding van degene die, anders dan krachtens
      een overeenkomst van opdracht als bedoeld in [artikel 400 van Boek 7 van het Burgerlijk Wetboek][ref2], arbeid
      tegen beloning verricht, tenzij deze arbeid wordt verricht in de uitoefening van een bedrijf of in de zelfstandige
      uitoefening van een beroep.

      2 In het geval, bedoeld in het eerste lid, wordt onder werkgever verstaan de wederpartij met wie de overeenkomst,
      die ten grondslag ligt aan de arbeidsverhouding, is aangegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel400
    url: https://wetten.overheid.nl/BWBR0008222/2023-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '400'
  - number: '2'
    text: |-
      Voor de toepassing van het bij of krachtens de wet bepaalde wordt onder dienstbetrekking als bedoeld in
      [artikel 2, tweede lid, van de wet][ref1] niet verstaan de arbeidsverhouding van degene die krachtens
      een overeenkomst tegen beloning kinderen opvangt in het kader van gastouderopvang als bedoeld in
      [artikel 1.1, eerste lid, van de Wet kinderopvang en kwaliteitseisen peuterspeelzalen][ref2], waarbij de opvang
      plaatsvindt op het woonadres van de gastouder.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0008222/2023-01-01#Artikel2
