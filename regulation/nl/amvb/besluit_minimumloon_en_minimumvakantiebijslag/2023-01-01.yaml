  - number: 2c
    text: |-
      1 De werknemer, die een arbeidsbeperkte is als bedoeld in
      [artikel 38b, eerste en tweede lid, van de Wet financiering sociale verzekeringen][ref1], of van wie
      het college van burgemeester en wethouders heeft vastgesteld dat hij uitsluitend in een beschutte
      omgeving onder aangepaste omstandigheden mogelijkheden tot arbeidsparticipatie heeft als bedoeld in
      [artikel 10b, eerste lid, van de Participatiewet][ref2] is bevoegd om schriftelijke volmacht te verlenen aan de
      werkgever om uit het uit te betalen minimumloon in zijn naam betalingen te verrichten ter zake van:

      1°. de huurprijs, de kosten voor nutsvoorzieningen met een individuele meter en de servicekosten, bedoeld in
      [artikel 237, derde lid, van Boek 7 van het Burgerlijk Wetboek][ref3], aan de verhuurder;

      2°. kosten voor nutsvoorzieningen met een individuele meter aan de nutsbedrijven, die de bedoelde voorzieningen
      leveren;

      3°. de premie voor zijn zorgverzekering waarvan hij verzekeringnemer is als bedoeld in
      [artikel 1, onderdeel d, van de Zorgverzekeringswet][ref4], aan een zorgverzekeraar, de premie voor een
      zorgverzekering ter aanvulling van een zorgverzekering waarvan hij verzekeringnemer is, aan een zorgverzekeraar
      en de verschuldigde premie voor een verzekering uitsluitend ter afdekking van zijn verplicht eigen risico, bedoeld
      in artikel 1, onderdeel g, van de Zorgverzekeringswet, alsmede de premie voor deze verzekeringen, waarbij hij
      hoofdverzekerde is, ten behoeve van zijn meeverzekerde gezinsleden overeenkomstig de vermelding op zijn zorgpolis;
      en

      4°. de rioolheffing, bedoeld in [artikel 228a van de Gemeentewet][ref5], de heffing,
      bedoeld in [artikel 15.33 van de Wet milieubeheer][ref6], de onroerende-zaakbelasting,
      bedoeld in [artikel 220 van de Gemeentewet][ref7], en de waterschapsbelasting, bedoeld in
      [artikel 110 van de Waterschapswet][ref8] aan het orgaan dat bevoegd is tot inning van de heffing of de belasting.

      2 Bij de schriftelijke volmacht, bedoeld in het eerste lid, overlegt de werknemer de afschriften van de
      huurovereenkomst en van de bescheiden waaruit de betalingsverplichtingen, bedoeld in het eerste lid blijken, aan
      de werkgever.

      3 De werkgever is bevoegd de betalingen, bedoeld in het eerste lid, te verrichten, indien hij aan de hand van de
      afschriften, bedoeld in het tweede lid, heeft vastgesteld dat is voldaan aan de eisen, gesteld in het eerste lid.

      4 Dit artikel is van overeenkomstige toepassing op werknemers in bepaalde soorten
      dienstbetrekkingen die gelijkgesteld zijn met arbeidsbeperkten op grond van
      [artikel 38f, vijfde lid, van de Wet financiering sociale verzekeringen][ref9].


