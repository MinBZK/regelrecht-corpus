  - number: 6a
    text: |-
      1 De gegevens, bedoeld in [artikel 18pa van de wet][ref1], worden door de toezichthouder of de door Onze Minister
      aangewezen ambtenaren geplaatst op een website met informatie van de toezichthouder of de door Onze Minister
      aangewezen ambtenaren, bedoeld in artikel 18pa, eerste lid, van de wet.

      2 De gegevens, bedoeld in [artikel 18pa van de wet][ref2], blijven drie jaar na de datum van bekendmaking van het
      besluit, bedoeld in 18pa, eerste lid, van de wet, dan wel na verzending van een brief met de mededeling dat er geen
      overtreding is geconstateerd, beschikbaar op de website.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel18pa
