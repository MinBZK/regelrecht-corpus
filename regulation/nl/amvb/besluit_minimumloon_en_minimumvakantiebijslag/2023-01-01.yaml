  - number: '6'
    text: |-
      1 Als een soortgelijke verplichting als bedoeld in [artikel 18f, tweede en vierde lid, van de wet][ref1] worden
      aangewezen de verplichtingen op grond van:

      a. de [artikelen 7][ref2], [15][ref3], [16][ref4] en [18b, tweede lid, van de wet][ref5];

      b. [artikel 13 van de wet][ref6], tenzij de werkgever na een schriftelijke volmacht van de werknemer het ingehouden
      bedrag heeft voldaan aan een derde, niet zijnde de werkgever zelf, ter voldoening van een betalingsverplichting van
      de werknemer en anderszins geen bedrag heeft ingehouden of verrekend; en

      c. [artikel 13a van de wet][ref7], met uitzondering van het derde lid van dat artikel.

      2 Als een soortgelijke overtreding als bedoeld in [artikel 3, eerste en tweede lid][ref8], wordt beschouwd het door
      de werkgever niet of onvoldoende nakomen van de op hem op grond van:

      a. de [artikelen 7][ref9], [15][ref10], [16][ref11] en [18b, tweede lid, van de wet][ref12] rustende
      verplichtingen;

      b. [artikel 13 van de wet][ref13] rustende verplichting, tenzij de werkgever na een schriftelijke volmacht van de
      werknemer het ingehouden bedrag heeft voldaan aan een derde, niet zijnde de werkgever zelf, ter voldoening van een
      betalingsverplichting van de werknemer en anderszins geen bedrag heeft ingehouden of verrekend; en

      c. [artikel 13a van de wet][ref14] rustende verplichting, tenzij de werkgever slechts in strijd met het derde lid
      van dat artikel heeft gehandeld.


