  - number: 6g
    text: |-
      De gegevens, bedoeld in [artikel 18p, zevende lid, van de wet][ref1], betreffen:

      a. de naam van de werkgever;

      b. de vestigingsplaats van de werkgever;

      c. de locatie waar het onderzoek heeft plaatsgevonden;

      d. het aantal werknemers dat tot de werkgever in dienstbetrekking staat; en

      e. indien sprake is van het ter beschikking stellen van arbeidskrachten of payrolling als bedoeld in
      [artikel 1 van de Wet allocatie arbeidskrachten door intermediairs][ref2], of indien arbeid wordt verricht op basis
      van een arbeidsverhouding als bedoeld in [artikel 2, tweede lid, van de wet][ref3] of [1a][ref4] van dit besluit:
      de naam en vestigingsplaats van de onderneming waar de ter beschikkingstelling plaatsvindt onderscheidenlijk
      van de opdrachtgever, en het aantal werknemers dat tot deze onderneming onderscheidenlijk de opdrachtgever in
      dienstbetrekking staat.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel18p
