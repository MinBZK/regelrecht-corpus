  - number: 6f
    text: |-
      Indien in verband met een beslissing op bezwaar, beroep of hoger beroep wordt vastgesteld dat de gegevens, die op
      grond van [artikel 18pa van de wet][ref1], en de [artikelen 6b][ref2] en [6c][ref3] openbaar zijn gemaakt, niet
      meer juist of volledig zijn, worden deze gegevens aangepast, binnen tien werkdagen na vaststelling of na ontvangst
      van de desbetreffende beslissing door Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel18pa
      [ref2]: https://wetten.overheid.nl/BWBR0008222#Artikel6b
