  - number: '3'
    text: |-
      1 Na een herhaling van een overtreding of soortgelijke overtreding wordt een waarschuwing gegeven als bedoeld in
      [artikel 18i, eerste lid, van de wet][ref1] en indien een herhaling van die of een soortgelijke overtreding is
      geconstateerd als bedoeld in dat artikel van de wet, wordt een bevel opgelegd door de daartoe aangewezen ambtenaar
      dat de door hem aangewezen werkzaamheden voor een daarbij aangegeven periode worden stilgelegd dan wel niet mogen
      aanvangen.

      2 Indien een ernstige overtreding is geconstateerd, wordt in afwijking van het eerste lid, een waarschuwing als
      bedoeld in [artikel 18i, eerste lid, van de wet][ref2] gegeven bij de eerste overtreding en wordt, indien opnieuw
      dezelfde of een soortgelijke overtreding is geconstateerd die eveneens ernstig is, een bevel opgelegd door de
      daartoe aangewezen ambtenaar dat de door hem aangewezen werkzaamheden voor een daarbij aangegeven periode worden
      stilgelegd dan wel niet mogen aanvangen.

      3 Als een ernstige overtreding als bedoeld in het tweede lid wordt aangemerkt de overtreding waarbij:

      a. de onderbetaling, inhouding of verrekening in strijd met [artikel 13 van de wet][ref3] of het niet compenseren
      of niet uitbetalen van de langere arbeidsduur in strijd met [artikel 13a van de wet][ref4]:

      1°. als soortgelijke overtreding is aangemerkt in [artikel 6, tweede lid][ref5];

      2°. de overtreding of voornoemde overtredingen gezamenlijk per werknemer ten minste 25 procent van het wettelijk
      minimumloon bedraagt; en

      3°. ten minste 20 werknemers zijn betrokken; of

      b. de onderbetaling, inhouding of verrekening in strijd met [artikel 13 van de wet][ref6] of het niet compenseren
      of uitbetalen van de langere arbeidsduur in strijd met [artikel 13a][ref7]:

      1°. als soortgelijke overtreding is aangemerkt in artikel 6, tweede lid; en

      2°. de overtreding of voornoemde overtredingen gezamenlijk ten minste 50 procent van het wettelijk minimumloon
      bedraagt; of

      c. [artikel 18b, tweede lid, van de wet][ref8] niet is nageleefd.

      4 Indien de aard van de overtreding of de met de overtreding samenhangende omstandigheden dan wel de gevolgen van
      een stillegging van de werkzaamheden daartoe aanleiding geven, kan worden afgezien van een waarschuwing als bedoeld
      in het eerste en tweede lid en kan worden afgezien van een bevel als bedoeld in het eerste en tweede lid.


