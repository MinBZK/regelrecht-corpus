articles:
  - number: '1'
    text: |-
      1 Voor de toepassing van het bij of krachtens de [Wet minimumloon en minimumvakantiebijslag][ref1] bepaalde wordt
      onder dienstbetrekking als bedoeld in artikel 2, eerste lid, van die wet mede verstaan de arbeidsverhouding van
      degene die krachtens een overeenkomst tegen beloning arbeid verricht voor ten hoogste twee anderen, tenzij deze
      overeenkomst is aangegaan in beroep en bedrijf.

      2 De in het eerste lid bedoelde persoon verricht de aldaar bedoelde arbeid persoonlijk dan wel uitsluitend met
      behulp van zijn echtgenoot of bij hem inwonende bloedverwanten of aanverwanten of pleegkinderen.

      3 In dit besluit wordt als echtgenoot mede aangemerkt degene met wie de in het eerste lid bedoelde persoon een
      gezamenlijke huishouding voert.

      4 Van een gezamenlijke huishouding is sprake indien twee personen hun hoofdverblijf in dezelfde woning hebben
      en zij blijk geven zorg te dragen voor elkaar door middel van het leveren van een bijdrage in de kosten van de
      huishouding dan wel anderszins.

      5 De duur van de in het eerste lid bedoelde arbeidsverhouding bedraagt ten minste drie maanden, waarbij de periode
      gedurende welke geen arbeid wordt verricht, minder dan 31 dagen bedraagt.

      6 De duur van de in het eerste lid bedoelde arbeid bedraagt gemiddeld ten minste vijf uren per week.


