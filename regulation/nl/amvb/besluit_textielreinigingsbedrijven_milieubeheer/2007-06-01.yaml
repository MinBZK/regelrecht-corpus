        bwb_id: BWBR0003245
        artikel: '1'
  - number: 3.h
    text: in de inrichting textiel wordt gereinigd of gewassen die met radioactiviteit is besmet;
    url: https://wetten.overheid.nl/BWBR0012328/2007-06-01#Artikel3
  - number: 3.i
    text: indien de inrichting of een onderdeel daarvan is ingericht voor de opslag van vuurwerk.
    url: https://wetten.overheid.nl/BWBR0012328/2007-06-01#Artikel3
  - number: '4.1'
    text: |-
      De voorschriften die zijn opgenomen in [bijlage 1][ref1] en 2, gelden voor een ieder die de inrichting drijft. Deze
      draagt er zorg voor dat de voorschriften worden nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0012328
    url: https://wetten.overheid.nl/BWBR0012328/2007-06-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0012328
  - number: '4.2'
    text: |-
      Indien een voorschrift dat is opgenomen in [bijlage 1][ref1], [hoofdstukken 1][ref2] tot en met [3][ref3], of
      [bijlage 2][ref4] inhoudt dat daarbij aangegeven middelen ter bescherming van het milieu moeten worden toegepast,
      meldt degene die de inrichting drijft en die voornemens is andere middelen toe te passen, dit voornemen ten
      minste vier weken voordat hij die andere middelen wil toepassen aan het bevoegd gezag, onder overlegging van de
      in [artikel 6, negende lid][ref5], bedoelde gegevens. Het bevoegd gezag beslist over de juistheid van een gekozen
      middel.


      [ref1]: https://wetten.overheid.nl/BWBR0012328
      [ref2]: https://wetten.overheid.nl/BWBR0012328
      [ref3]: https://wetten.overheid.nl/BWBR0012328
      [ref4]: https://wetten.overheid.nl/BWBR0012328
      [ref5]: https://wetten.overheid.nl/BWBR0012328#Artikel6
    url: https://wetten.overheid.nl/BWBR0012328/2007-06-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0012328
      - id: ref2
        bwb_id: BWBR0012328
      - id: ref3
        bwb_id: BWBR0012328
      - id: ref4
        bwb_id: BWBR0012328
      - id: ref5
        bwb_id: BWBR0012328
        artikel: '6'
  - number: '5.1'
    text: 'Het bevoegd gezag kan nadere eisen stellen met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0012328/2007-06-01#Artikel5
  - number: 5.1.a
    text: |-
      de in [bijlage 1][ref1] opgenomen voorschriften ten aanzien van geluid, trilling, energie, afvalstoffen,
      afvalwater, waterbesparing, lucht, verlichting en bodembescherming, voorzover dat in [hoofdstuk 4][ref2] van
      [bijlage 1][ref3] is aangegeven, of


      [ref1]: https://wetten.overheid.nl/BWBR0012328
      [ref2]: https://wetten.overheid.nl/BWBR0012328
      [ref3]: https://wetten.overheid.nl/BWBR0012328
    url: https://wetten.overheid.nl/BWBR0012328/2007-06-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012328
      - id: ref2
        bwb_id: BWBR0012328
      - id: ref3
        bwb_id: BWBR0012328
  - number: 5.1.b
    text: |-
      de aanwezigheid van brandbestrijdingsmiddelen, de veiligheid van toestellen en installaties voor gas of
      elektriciteit, de veiligheid van de opslag van stoffen, het verbruik van grondstoffen, de gevolgen van het verkeer
      van personen of goederen van en naar de inrichting, en de nadelige gevolgen voor het milieu die de inrichting kan
      veroorzaken waarop voorschrift 1.9.1 van [bijlage 1][ref1] betrekking heeft, indien dat bijzonder is aangewezen in
      het belang van de bescherming van het milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0012328
    url: https://wetten.overheid.nl/BWBR0012328/2007-06-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012328
  - number: '5.2'
    text: |-
      De nadere eisen gelden voor een ieder die de inrichting drijft. Deze draagt er zorg voor dat de nadere eisen worden
      nageleefd.
    url: https://wetten.overheid.nl/BWBR0012328/2007-06-01#Artikel5
  - number: '5.3'
    text: |-
      Het bevoegd gezag kan nadere eisen wijzigen of aanvullen in het belang van de bescherming van het milieu, of
      wijzigen of intrekken indien het belang van de bescherming van het milieu zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0012328/2007-06-01#Artikel5
  - number: '6.1'
    text: Degene die een inrichting opricht, meldt dit ten minste vier weken voor de oprichting aan het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0012328/2007-06-01#Artikel6
  - number: '6.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing met betrekking tot het veranderen van een inrichting en het
      veranderen van de werking daarvan. De melding is niet vereist, indien eerder een melding overeenkomstig dit artikel
      is gedaan en door dit veranderen geen afwijking ontstaat van de bij die melding verstrekte gegevens.
    url: https://wetten.overheid.nl/BWBR0012328/2007-06-01#Artikel6
  - number: '6.3'
    text: 'Bij de melding wordt vermeld:'
    url: https://wetten.overheid.nl/BWBR0012328/2007-06-01#Artikel6
  - number: 6.3.a
    text: het adres van de inrichting;
    url: https://wetten.overheid.nl/BWBR0012328/2007-06-01#Artikel6
  - number: 6.3.b
    text: |-
      de naam en het adres van degene die de inrichting opricht dan wel verandert of de werking daarvan verandert, en,
      indien dit iemand anders is, van degene die de inrichting drijft of zal drijven;
    url: https://wetten.overheid.nl/BWBR0012328/2007-06-01#Artikel6
  - number: 6.3.c
    text: de aard en omvang van de activiteiten of processen in de inrichting;
    url: https://wetten.overheid.nl/BWBR0012328/2007-06-01#Artikel6
  - number: 6.3.d
    text: de indeling en uitvoering van de inrichting en
    url: https://wetten.overheid.nl/BWBR0012328/2007-06-01#Artikel6
  - number: 6.3.e
    text: |-
      het tijdstip waarop de inrichting of de verandering daarvan in werking zal worden gebracht, dan wel de verandering
      van de werking daarvan verwezenlijkt zal zijn.
    url: https://wetten.overheid.nl/BWBR0012328/2007-06-01#Artikel6
  - number: '6.4'
    text: |-
      Bij de melding wordt de rapportage van een onderzoek naar de nulsituatie van de bodem gevoegd. Het onderzoek naar
      de nulsituatie richt zich uitsluitend op de stoffen die door de werkzaamheden ter plaatste een bedreiging voor de
      bodemkwaliteit vormen en op de plaatsen waar bodembedreigende handelingen plaatsvinden dan wel zullen plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0012328/2007-06-01#Artikel6
  - number: '6.5'
    text: |-
      Indien bij de melding geen rapport van een onderzoek naar de nulsituatie van de bodem is gevoegd, kan het bevoegd
      gezag besluiten dat een zodanig onderzoek niet is vereist, indien aannemelijk is dat de kans op toekomstige
      bodemverontreiniging afwezig is.
    url: https://wetten.overheid.nl/BWBR0012328/2007-06-01#Artikel6
  - number: '6.6'
    text: |-
      Bij de melding voor een inrichting waarin wordt gereinigd, wordt een onderzoek naar de dampdoorlaatbaarheid van de
      bouwkundige scheidingsconstructies tussen de inrichting en niet tot de inrichting behorende ruimten van gevoelige
      objecten, gevoegd.
    url: https://wetten.overheid.nl/BWBR0012328/2007-06-01#Artikel6
  - number: '6.7'
    text: |-
      De in het derde, vierde en zesde lid bedoelde gegevens behoeven niet te worden verstrekt indien degene die de
      inrichting drijft, deze gegevens reeds aan het bevoegd gezag heeft verschaft en het bevoegd gezag over die gegevens
      beschikt.
    url: https://wetten.overheid.nl/BWBR0012328/2007-06-01#Artikel6
  - number: '6.8'
    text: |-
      Degene die de melding doet, geeft bij de melding aan welke gegevens hij reeds aan het bevoegd gezag heeft
      verschaft.
    url: https://wetten.overheid.nl/BWBR0012328/2007-06-01#Artikel6
  - number: '6.9'
    text: |-
      Bij de melding overeenkomstig [artikel 4, tweede lid][ref1], worden aan het bevoegd gezag gegevens verstrekt
      waaruit blijkt dat met de volgens die melding toe te passen andere middelen een ten minste gelijkwaardige
      bescherming voor het milieu wordt bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0012328#Artikel4
    url: https://wetten.overheid.nl/BWBR0012328/2007-06-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0012328
        artikel: '4'
  - number: '7.1'
    text: |-
      Voor een inrichting die op het tijdstip van inwerkingtreding van dit besluit reeds was opgericht en waarvoor
      onmiddellijk daaraan voorafgaand een vergunning in werking en onherroepelijk was, blijven de voorschriften van
      die vergunning in verbinding met de gegevens die behoren bij de aanvraag, alsmede de aanvraag voorzover die deel
      uitmaakt van de vergunning en gegevens bevat die zich lenen voor opname of omzetting in voorschriften, gelden
      als nadere eis, bedoeld in [artikel 5][ref1], behoudens eerdere wijziging of intrekking van die voorschriften,
      gedurende drie jaar na het tijdstip van het van toepassing worden van dit besluit op die inrichting, mits het
      voorschrift betrekking heeft op een onderwerp dat is genoemd in [artikel 5, eerste lid, onder a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012328#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0012328#Artikel5
    url: https://wetten.overheid.nl/BWBR0012328/2007-06-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0012328
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0012328
        artikel: '5'
  - number: '7.2'
    text: |-
      De nadere eisen die onmiddellijk voorafgaande aan de inwerkingtreding van dit besluit golden krachtens de
      vergunning dan wel krachtens het Besluit chemische wasserijen milieubeheer blijven gelden als nadere eis, bedoeld
      in [artikel 5][ref1], na het tijdstip van de inwerkingtreding van dit besluit, mits het voorschrift betrekking
      heeft op een onderwerp dat is genoemd in [artikel 5, eerste lid, onder a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012328#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0012328#Artikel5
    url: https://wetten.overheid.nl/BWBR0012328/2007-06-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0012328
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0012328
        artikel: '5'
  - number: '8.1'
    text: |-
      Indien op het tijdstip waarop dit besluit in werking treedt, een inrichting reeds is opgericht en voor die
      inrichting onmiddellijk voor dat tijdstip geen vergunning in werking en onherroepelijk was of geen melding was
      gedaan krachtens het Besluit chemische wasserijen milieubeheer, meldt degene die de inrichting drijft, aan het
      bevoegd gezag dat hij de inrichting in werking heeft.
    url: https://wetten.overheid.nl/BWBR0012328/2007-06-01#Artikel8
  - number: '8.2'
    text: |-
      De melding geschiedt binnen twaalf weken na het tijdstip waarop dit besluit in werking treedt.
      [Artikel 6, derde tot en met het achtste lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012328#Artikel6
    url: https://wetten.overheid.nl/BWBR0012328/2007-06-01#Artikel8
