  - number: '8.3'
    text: |-
      Indien op het tijdstip waarop dit besluit in werking treedt, bij het bevoegd gezag een aanvraag om een vergunning
      is ingediend voor het oprichten van een inrichting waarop dit besluit van toepassing is of zal zijn, zijn het
      eerste en tweede lid niet van toepassing. De aanvraag wordt in dat geval aangemerkt als een melding overeenkomstig
      [artikel 6][ref1].


