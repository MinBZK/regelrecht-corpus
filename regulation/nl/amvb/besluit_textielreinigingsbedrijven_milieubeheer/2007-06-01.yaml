  - number: '2.1'
    text: |-
      Dit besluit is van toepassing op inrichtingen waarin uitsluitend of in hoofdzaak sprake is van het reinigen,
      wassen, persen, mangelen, strijken of drogen van textiel.
    url: https://wetten.overheid.nl/BWBR0012328/2007-06-01#Artikel2
  - number: '2.2'
    text: |-
      Dit besluit is eveneens van toepassing op inrichtingen waarin uitsluitend of in hoofdzaak sprake is van een
      samenstel van bedrijvigheden als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0012328/2007-06-01#Artikel2
  - number: '3'
    text: |-
      Dit besluit is niet van toepassing op een inrichting als bedoeld in [artikel 2][ref1], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0012328#Artikel2
    url: https://wetten.overheid.nl/BWBR0012328/2007-06-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012328
        artikel: '2'
  - number: 3.a
    text: de totale capaciteit van de inrichting voor het reinigen en wassen groter is dan 25 000 kg per dag;
    url: https://wetten.overheid.nl/BWBR0012328/2007-06-01#Artikel3
  - number: 3.b
    text: de individuele beladingscapaciteit van de opgestelde machines voor het reinigen groter is dan 50 kg;
    url: https://wetten.overheid.nl/BWBR0012328/2007-06-01#Artikel3
  - number: 3.c
    text: |-
      in de inrichting een installatie aanwezig is, die geschikt is voor de verbranding van andere brandstoffen dan
      aardgas, propaangas, butaangas of gasolie;
    url: https://wetten.overheid.nl/BWBR0012328/2007-06-01#Artikel3
  - number: 3.d
    text: |-
      in de inrichting één of meer stooktoestellen voor verwarming of warmtekrachtopwekking aanwezig zijn met een
      thermisch vermogen per toestel van 7 500 kW of meer;
    url: https://wetten.overheid.nl/BWBR0012328/2007-06-01#Artikel3
  - number: 3.e
    text: in de inrichting textiel wordt geverfd;
    url: https://wetten.overheid.nl/BWBR0012328/2007-06-01#Artikel3
  - number: 3.f
    text: |-
      de inrichting of een onderdeel daarvan is ingericht voor het opslaan van vloeibare gevaarlijke stoffen, vloeibare
      gevaarlijke afvalstoffen of brandbare vloeistoffen in tanks, tenzij sprake is van:
    url: https://wetten.overheid.nl/BWBR0012328/2007-06-01#Artikel3
  - number: 3.f.1°
    text: |-
      opslaan in ondergrondse tanks waarop het [Besluit opslaan in ondergrondse tanks 1998][ref1] van toepassing is,


      [ref1]: https://wetten.overheid.nl/BWBR0009747
    url: https://wetten.overheid.nl/BWBR0012328/2007-06-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009747
  - number: 3.f.2°
    text: opslaan van brandbare vloeistoffen in bovengrondse tanks, en
    url: https://wetten.overheid.nl/BWBR0012328/2007-06-01#Artikel3
  - number: 3.f.3°
    text: opslaan van vloeistoffen die voor de in de inrichting toegepaste was- en reinigingsmethoden noodzakelijk zijn;
    url: https://wetten.overheid.nl/BWBR0012328/2007-06-01#Artikel3
  - number: 3.g
    text: |-
      van buiten de inrichting afkomstige verontreinigde poetsdoeken, voorzover deze zijn aangewezen als gevaarlijke
      afvalstof ingevolge [artikel 1.1, eerste lid, van de Wet milieubeheer][ref1], worden gewassen of gereinigd, of


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0012328/2007-06-01#Artikel3
    references:
