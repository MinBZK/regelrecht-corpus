  - number: 131.d
    text: |-
      de Regeling aanwijzing Elektronenmicroscopen Kernenergiewet 1998 op [artikel 21, tweede lid, onder d][ref1], van
      dit besluit;


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel21
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel131
    references:
      - id: ref1
