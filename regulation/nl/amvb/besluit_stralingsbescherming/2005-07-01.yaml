      [ref12]: https://wetten.overheid.nl/BWBR0012702#Artikel89
      [ref13]: https://wetten.overheid.nl/BWBR0012702#Artikel111
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel111
