  - number: 131.e
    text: |-
      de Regeling aanwijzing rookmelders Kernenergiewet 2000-II op [artikel 26, tweede lid][ref1], van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel26
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel131
