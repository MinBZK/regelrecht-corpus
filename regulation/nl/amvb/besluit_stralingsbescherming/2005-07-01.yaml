  - number: '1.2'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt onder «voorhanden hebben» mede verstaan: het vervaardigen,
      bewerken, hanteren en opslaan, met uitzondering van opslag in verband met vervoer.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel1
  - number: '1.3'
    text: |-
      Met betrekking tot dit besluit en de daarop berustende bepalingen worden bij de bepaling van wat «redelijkerwijs
      mogelijk» is de economische en sociale factoren in aanmerking genomen. Daarnaast wordt ingeval van blootstelling
      in aanmerking genomen de mate waarin een blootstelling en de kans van optreden van die blootstelling kunnen worden
      beperkt.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel1
  - number: '2'
    text: 'Dit besluit is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel2
  - number: 2.a
    text: |-
      lozing of het zich ontdoen van radioactieve stoffen waarvoor de in de [artikelen 35][ref1], [37][ref2] en
      [108][ref3] gestelde verboden niet gelden;


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0012702#Artikel108
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '4.4'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '37'
        hoofdstuk: '4'
        paragraaf: '4.4'
      - id: ref3
        bwb_id: BWBR0012702
        artikel: '108'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: 2.b
    text: |-
      het vervoeren van radioactieve stoffen en het binnen of buiten Nederlands grondgebied brengen of doen brengen
      daarvan;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel2
  - number: 2.c
    text: het vervoeren van toestellen, die tijdens vervoer niet gebruikt worden;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel2
  - number: 2.d
    text: handelingen met een toestel met een maximale hoogspanning van 5 kV;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel2
  - number: 2.e
    text: |-
      blootstelling aan radon en dochternucliden, afkomstig uit de onverstoorde aardkorst of uit bouwmaterialen gebruikt
      in gebouwen;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel2
  - number: 2.f
    text: |-
      bovengrondse blootstelling aan radionucliden die zich bevinden in de onverstoorde aardkorst of in bouwmaterialen
      gebruikt in gebouwen;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel2
  - number: 2.g
    text: straling ten gevolge van radionucliden die van nature in het menselijk lichaam aanwezig zijn;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel2
  - number: 2.h
    text: kosmische straling ter hoogte van het aardoppervlak;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel2
  - number: 2.i
    text: |-
      kosmische straling in een vliegtuig voor leden van de bevolking en voor werknemers, die niet behoren tot de
      vliegtuigbemanning;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel2
  - number: 2.j
    text: blootstelling aan radon en dochternucliden die vrijkomen bij het verbranden of afblazen van aardgas.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel2
  - number: '3.1'
    text: |-
      De bepaling van de omgevingsdosisequivalenten, de equivalente en de effectieve doses geschiedt op de wijze, vermeld
      in de bijlagen 2, 3 en 4.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel3
  - number: '3.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld voor methoden van bepaling van de doses, bedoeld in het
      eerste lid, die gelijkwaardig zijn aan die bedoeld in het eerste lid en in plaats daarvan kunnen worden toegepast.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel3
  - number: '3.3'
    text: 'Bij regeling van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer kunnen:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel3
  - number: 3.3.a
    text: regels worden gesteld voor de bepaling van de in het eerste lid bedoelde doses;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel3
  - number: 3.3.b
    text: methoden worden aangewezen voor de wijze waarop deze doses worden getoetst aan de in dit besluit genoemde doses.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel3
  - number: '3.4'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld voor de meetmethoden van activiteit, activiteitsconcentratie
      of oppervlaktebesmetting.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel3
  - number: '3.5'
    text: |-
      Ten behoeve van de bepaling van doses worden alle effectieve of equivalente doses gesommeerd
      die een persoon ontvangt ten gevolge van handelingen en werkzaamheden, voor zover geregeld
      bij of krachtens dit besluit, met uitzondering van een radiologische verrichting, bij of
      krachtens het [Besluit kerninstallaties, splijtstoffen en ertsen][ref1] en bij of krachtens het
      [Besluit vervoer splijtstoffen, ertsen en radioactieve stoffen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002667
      [ref2]: https://wetten.overheid.nl/BWBR0002668
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002667
      - id: ref2
        bwb_id: BWBR0002668
  - number: '3.6'
    text: |-
      Ten behoeve van de toetsing aan de in bijlage 1, tabel 1 en tabel 2, vermelde waarden worden alle activiteiten
      die zich op enig moment binnen een locatie bevinden gewogen en gesommeerd voor zover geregeld bij of krachtens dit
      besluit, bij of krachtens het [Besluit kerninstallaties, splijtstoffen en ertsen][ref1] en bij of krachtens het
      [Besluit vervoer splijtstoffen, ertsen en radioactieve stoffen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002667
      [ref2]: https://wetten.overheid.nl/BWBR0002668
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002667
      - id: ref2
        bwb_id: BWBR0002668
  - number: '3.7'
    text: |-
      In afwijking van het zesde lid worden de activiteiten of activiteitsconcentraties in natuurlijke bronnen niet
      gesommeerd met de activiteiten of activiteitsconcentraties in kunstmatige bronnen.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel3
  - number: '4.1'
    text: |-
      Een handeling is slechts toegestaan indien zij door Onze Ministers is gerechtvaardigd, dan wel behoort tot een
      categorie van handelingen die door Onze Ministers is gerechtvaardigd. Onze Ministers rechtvaardigen een handeling
      of een categorie van handelingen slechts indien de economische, sociale en andere voordelen van de betrokken
      handeling of categorie van handelingen opwegen tegen de gezondheidsschade die hierdoor kan worden toegebracht.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel4
  - number: '4.2'
    text: 'Bij ministeriële regeling worden regels gesteld met betrekking tot de bekendmaking van:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel4
  - number: 4.2.a
    text: welke handelingen of categorieën daarvan overeenkomstig het eerste lid zijn gerechtvaardigd, en
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel4
  - number: 4.2.b
    text: welke handelingen of categorieën daarvan overeenkomstig het eerste lid niet zijn gerechtvaardigd.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel4
  - number: '4.3'
    text: |-
      Indien nieuwe, belangrijke gegevens over de doeltreffendheid of de gevolgen van de daarin opgenomen handelingen
      daartoe aanleiding geven kan de rechtvaardiging van de handeling worden herzien. Een wijziging als bedoeld in de
      vorige volzin wordt zo spoedig als redelijkerwijs mogelijk is van kracht.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel4
  - number: '4.4'
    text: |-
      Indien een vergunning wordt aangevraagd of een melding wordt gedaan voor een handeling die als gerechtvaardigd is
      bekendgemaakt, wordt in de melding of de vergunningaanvraag verwezen naar die bekendmaking.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel4
  - number: '4.5'
    text: |-
      Indien een vergunning wordt aangevraagd of een melding wordt gedaan voor een handeling die niet of als niet-
      gerechtvaardigd is bekendgemaakt, omvat de vergunningsaanvraag, onderscheidenlijk de melding tevens een verzoek
      om rechtvaardiging van die handeling. De vergunningsaanvraag of de melding bevat dan tevens de gegevens met
      betrekking tot de economische, sociale en andere voordelen van de betrokken handeling en met betrekking tot
      de gezondheidsschade die erdoor kan worden toegebracht, die nodig zijn met het oog op de beoordeling van de
      gerechtvaardigdheid van de handeling.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel4
  - number: '4.6'
    text: Dit artikel is niet van toepassing op de rechtvaardiging, bedoeld in de artikelen 55, 56 en 57.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel4
  - number: '4.7'
    text: |-
      Naast de handelingen of categorieën van handelingen die door Onze Ministers volgens het eerste lid zijn
      gerechtvaardigd, kan Onze Minister van Defensie, met het oog op het belang dat de krijgsmacht dient, een andere
      handeling of categorie van handelingen rechtvaardigen. Deze handeling of categorie van handelingen wordt door Onze
      Minister van Defensie bekendgemaakt op een bij regeling van deze Minister bepaalde wijze.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel4
  - number: '5.1'
    text: |-
      De ondernemer zorgt ervoor dat de effectieve of equivalente doses van individuele personen, in samenhang met het
      aantal blootgestelde personen, ten gevolge van een handeling zo laag zijn als redelijkerwijs mogelijk is.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel5
  - number: '5.2'
    text: |-
      De ondernemer zorgt ervoor dat met betrekking tot potentiële blootstellingen zowel de dosis bij een blootstelling
      als de kans op een blootstelling zo laag als redelijkerwijs mogelijk is.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel5
  - number: '6.1'
    text: |-
      Onverminderd artikel 48, zorgt de ondernemer ervoor dat plaatsen binnen een locatie waar handelingen worden
      verricht, zodanig zijn ingericht dat voor personen die zich daarbuiten bevinden, ten gevolge van de handelingen
      tezamen een dosisbeperking van 1 mSv effectieve dosis in een kalenderjaar wordt gehanteerd.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel6
  - number: '6.2'
    text: |-
      Indien het redelijkerwijs niet mogelijk is met bouwkundige voorzieningen te voldoen aan de verplichting, bedoeld in
      het eerste lid, wordt deze verkregen door middel van organisatorische maatregelen.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel6
  - number: '6.3'
    text: |-
      De ondernemer zorgt ervoor dat bij het verrichten van handelingen die overeenkomstig artikel 21 worden gemeld,
      voor personen op enig punt buiten de locatie ten gevolge van die handelingen tezamen een dosisbeperking van 10 µSv
      effectieve dosis in een kalenderjaar wordt gehanteerd.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel6
  - number: '6.4'
    text: |-
      Bij ministeriële regeling kunnen andere dosisbeperkingen worden vastgesteld voor daarbij aangegeven categorieën van
      handelingen, taken of functies.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel6
  - number: '7.1'
    text: |-
      De ingevolge dit besluit door een stralingsarts te verrichten taken worden slechts uitgevoerd door een
      persoon die als stralingsarts is ingeschreven in het door Onze Minister van Sociale Zaken en Werkgelegenheid
      aan te wijzen register en zijn taken uitvoert in overeenstemming met een persoon als bedoeld in
      [artikel 14, eerste lid, van de Arbeidsomstandighedenwet 1998][ref1] die belast is met de taken, bedoeld in
      [artikel 14, eerste lid, onderdelen b of c, van die wet][ref2] of de arbodienst.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel14
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '14'
  - number: '7.2'
    text: |-
      De ingevolge dit besluit door een deskundige te verrichten taken worden slechts uitgevoerd door een persoon die
      als deskundige voor de uitvoering van de betrokken taak is ingeschreven in een door Onze Ministers aan te wijzen
      register.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel7
  - number: '7.3'
    text: |-
      Bij regeling van Onze Minister van Sociale Zaken en Werkgelegenheid worden eisen vastgesteld met betrekking tot
      de kennis en bekwaamheden, waaraan moet worden voldaan om als stralingsarts in het register, bedoeld in het eerste
      lid, te worden ingeschreven.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel7
  - number: '7.4'
    text: |-
      Bij ministeriële regeling worden eisen vastgesteld met betrekking tot vaardigheden en bekwaamheden, waaraan moet
      worden voldaan om als deskundige in een register als bedoeld in het tweede lid, te worden ingeschreven. De eisen
      kunnen verschillend worden vastgesteld voor de verschillende taken.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel7
  - number: '7.5'
    text: |-
      Een inschrijving in een register als bedoeld in het eerste en tweede lid, kan worden geweigerd of ingetrokken,
      indien niet of niet volledig voldaan is aan de bij of krachtens de [wet][ref1] of dit besluit gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0002402
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002402
  - number: '7.6'
    text: 'Bij ministeriële regeling worden regels gesteld voor:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel7
  - number: 7.6.a
    text: de aanwijzing en het beheer van registers als bedoeld in het eerste en tweede lid;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel7
  - number: 7.6.b
    text: de wijze van inschrijving;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel7
  - number: 7.6.c
    text: de gegevens en bescheiden die bij een aanvraag tot inschrijving worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel7
  - number: 7.6.d
    text: de vergoeding die ten hoogste voor de inschrijving is verschuldigd;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel7
  - number: 7.6.e
    text: de gronden waarop en de gevallen waarin de inschrijving kan worden geweigerd of doorgehaald.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel7
  - number: '7.7'
    text: 'Bij ministeriële regeling kunnen regels worden gesteld voor:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel7
  - number: 7.7.a
    text: |-
      de aanwijzing van een instelling als bedoeld in [artikel 69a van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel69a
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: 69a
  - number: 7.7.b
    text: de gronden waarop die instelling kan worden aangewezen of de aanwijzing kan worden gewijzigd of ingetrokken;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel7
  - number: 7.7.c
    text: |-
      de gegevens en het verslag, bedoeld in [artikel 69b van de wet][ref1], die de instelling aan Onze Ministers
      verstrekt en de wijze waarop die informatie wordt verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel69b
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: 69b
  - number: '8.1'
    text: |-
      Een dosimetrische dienst heeft tot taak het verstrekken van persoonlijke controlemiddelen aan de ondernemer ten
      behoeve van A- of B-werknemers en het, door het uitlezen van deze controlemiddelen, bepalen in welke mate de A- of
      B-werknemers aan ioniserende straling blootgesteld zijn geweest. Deze taak wordt slechts verricht door een dienst
      die als zodanig is erkend door Onze Minister van Sociale Zaken en Werkgelegenheid.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel8
  - number: '8.2'
    text: |-
      Bij regeling van Onze Minister van Sociale Zaken en Werkgelegenheid worden eisen vastgesteld met betrekking tot de
      kwaliteit van de dienstverlening, de werkwijze en de deskundigheid van de dienst, waaraan moet worden voldaan om
      krachtens het eerste lid te kunnen worden erkend.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel8
  - number: '9.1'
    text: De ondernemer zorgt ervoor dat een handeling wordt uitgevoerd door of onder toezicht van een deskundige.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel9
  - number: '9.2'
    text: Bij ministeriële regeling kan voor bepaalde handelingen een bepaald niveau van deskundigheid worden geëist.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel9
  - number: '9.3'
    text: |-
      De bepalingen in dit besluit met betrekking tot de deskundigheid gelden niet voor handelingen die volgens dit
      besluit niet meldingsplichtig of vergunningplichtig zijn.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel9
  - number: '9.4'
    text: |-
      De ondernemer legt de toedeling van bevoegdheden en verantwoordelijkheden met betrekking tot de bescherming tegen
      ioniserende straling schriftelijk vast.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel9
  - number: '10.1'
    text: |-
      De ondernemer zorgt ervoor dat door of onder toezicht van een deskundige, met het oog op de bescherming tegen
      ioniserende straling, ten minste:
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel10
  - number: 10.1.a
    text: |-
      de plannen voor handelingen voorafgaand aan de uitvoering ervan kritisch worden bestudeerd, de risico's ervan
      geïnventariseerd en geëvalueerd en toestemming verleend, voordat met de handeling wordt aangevangen;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel10
  - number: 10.1.b
    text: |-
      wordt geadviseerd over de beveiligingsmiddelen en technieken ter waarborging van een doelmatige bescherming van
      personen;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel10
  - number: 10.1.c
    text: |-
      regelmatig, maar ten minste eenmaal per jaar de doeltreffendheid en het juiste gebruik van de beveiligingsmiddelen
      en technieken worden geverifieerd;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel10
  - number: 10.1.d
    text: |-
      regelmatig, maar ten minste eenmaal per jaar de goede werking en het juiste gebruik van bronnen en instrumenten
      voor meting van ioniserende straling worden gecontroleerd;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel10
  - number: 10.1.e
    text: deze instrumenten regelmatig worden gekalibreerd.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel10
  - number: '10.2'
    text: |-
      De ondernemer zorgt ervoor dat een nieuwe of gewijzigde bron niet in gebruik wordt genomen dan na een
      acceptatietest door de deskundige, gevolgd door diens toestemming om de bron in gebruik te nemen.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel10
  - number: '10.3'
    text: |-
      Voor zover het de bescherming van de blootgestelde werknemer betreft worden de bevindingen van
      de deskundige vastgelegd in het kader van de risico-inventarisatie en -evaluatie, bedoeld in
      [artikel 5 van de Arbeidsomstandighedenwet 1998][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel5
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '5'
  - number: '11.1'
    text: |-
      De ondernemer stelt, na overleg met de deskundige, maatregelen vast om schade tegen te gaan en zorgt ervoor dat
      deze worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel11
  - number: '11.2'
    text: 'De ondernemer zorgt ervoor ten aanzien van bronnen, beveiligingsmiddelen en meetinstrumenten dat:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel11
  - number: 11.2.a
    text: daaraan het noodzakelijke onderhoud wordt verricht;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel11
  - number: 11.2.b
    text: |-
      de noodzakelijke maatregelen worden genomen om inadequate of defecte onderdelen daarvan te verbeteren of te
      vervangen, en
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel11
  - number: 11.2.c
    text: indien nodig, tot buitengebruikstelling van bronnen wordt overgegaan.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel11
  - number: '11.3'
    text: |-
      De ondernemer stelt financiële middelen en faciliteiten voor een passende bescherming tegen ioniserende straling
      ter beschikking aan de personen of de stralingsbeschermingseenheid, bedoeld in artikel 12, die met de uitvoering
      van die bescherming zijn belast.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel11
  - number: '12.1'
    text: |-
      Bij ministeriële regeling worden ondernemers, soorten ondernemingen of locaties aangewezen, waarin een
      stralingsbeschermingseenheid, waarin tevens de deskundige werkzaam is, aanwezig is en worden regels gesteld voor de
      taken, bevoegdheden en werkwijze van een stralingsbeschermingseenheid.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel12
  - number: '12.2'
    text: |-
      Indien een stralingsbeschermingseenheid op grond van het eerste lid is voorgeschreven, zorgt de ondernemer ervoor
      dat de stralingsbeschermingseenheid operationeel is en in ieder geval:
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel12
  - number: 12.2.a
    text: daarin voldoende deskundige personen werkzaam zijn;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel12
  - number: 12.2.b
    text: functioneel en organisatorisch gescheiden is van productie- en technische eenheden;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel12
  - number: 12.2.c
    text: aan hem adviezen verstrekt met betrekking tot de bescherming tegen ioniserende straling;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel12
  - number: 12.2.d
    text: toestemming geeft voor een handeling.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel12
  - number: '12.3'
    text: |-
      Onze Ministers kunnen toestaan dat een stralingsbeschermingseenheid als bedoeld in het eerste lid, voor
      verscheidene ondernemers taken verricht.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel12
  - number: '13.1'
    text: |-
      De ondernemer zorgt ervoor dat een handeling waarbij het voorzienbaar is dat personen onbedoeld aan overmatige
      uitwendige bestraling of overmatige inwendige besmetting kunnen worden blootgesteld, slechts wordt verricht nadat
      een deskundige is geraadpleegd.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel13
  - number: '13.2'
    text: |-
      Indien naar het oordeel van een deskundige de blootstelling, bedoeld in het eerste lid, zich voordoet of dreigt
      voor te doen, zorgt de ondernemer ervoor dat onmiddellijk:
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel13
  - number: 13.2.a
    text: de handeling wordt gestaakt;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel13
  - number: 13.2.b
    text: de gevaarlijke plaatsen worden ontruimd;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel13
  - number: 13.2.c
    text: 'worden verwittigd:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel13
  - number: 13.2.c.1°
    text: |-
      de betrokken stralingsarts, indien overmatige uitwendige bestraling of overmatige inwendige besmetting van een
      werknemer heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel13
  - number: 13.2.c.2°
    text: indien het een radiologische verrichting betreft, de ter plaatse bevoegde Inspecteur voor de Gezondheidszorg;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel13
  - number: 13.2.c.3°
    text: indien het arbeidsaspecten betreft, de bedrijfstakdirecteur;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel13
  - number: 13.2.c.4°
    text: indien het milieuaspecten betreft, de inspecteur;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel13
  - number: 13.2.c.5°
    text: indien het mijnbouw betreft, de Inspecteur-Generaal der Mijnen.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel13
  - number: '13.3'
    text: |-
      De ondernemer beëindigt een maatregel als bedoeld in het tweede lid, onder a of b, niet dan in overeenstemming met
      de deskundige of met toestemming van de in het tweede lid, onder c, bedoelde personen.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel13
  - number: '14.1'
    text: |-
      De ondernemer zorgt ervoor dat zoveel als redelijkerwijs mogelijk wordt voorkomen dat radioactieve stoffen of
      toestellen zoekraken, worden ontvreemd of ongewild worden verspreid.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel14
  - number: '14.2'
    text: |-
      De ondernemer doet bij zoekraken, ontvreemding of ongewilde verspreiding van een bron onmiddellijk mededeling
      in ieder geval aan de inspecteur en aan de bedrijfstakdirecteur en, indien het mijnbouw betreft, tevens aan de
      Inspecteur-Generaal der Mijnen.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel14
  - number: '14.3'
    text: |-
      De ondernemer zorgt ervoor dat radioactieve stoffen of toestellen zoveel als redelijkerwijs mogelijk zijn beveiligd
      tegen brand.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel14
  - number: '15.1'
    text: |-
      De ondernemer zorgt ervoor dat degene die een handeling verricht, en degene die daaraan leiding geeft of daarop
      toezicht houdt, met betrekking tot de werkplek:
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel15
  - number: 15.1.a
    text: voldoende is onderricht met betrekking tot de risico's die verbonden zijn aan ioniserende straling;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel15
  - number: 15.1.b
    text: |-
      is geïnformeerd over de algemeen gangbare methoden ter bescherming tegen ioniserende straling en de te nemen
      voorzorgsmaatregelen zowel voor de handeling in het algemeen, als voor de taak die hem wordt toegewezen en voor
      elke werkplek waar de handeling wordt verricht;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel15
  - number: 15.1.c
    text: is geïnformeerd over het belang zich aan de technische, gezondheids- en administratieve voorschriften te houden.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel15
  - number: '15.2'
    text: |-
      De ondernemer stelt met betrekking tot de in het eerste lid genoemde onderwerpen schriftelijke instructies vast en
      verstrekt deze instructies aan personen als bedoeld in het eerste lid en aan anderen die kunnen worden blootgesteld
      door de handelingen.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel15
  - number: '16'
    text: |-
      De ondernemer zorgt ervoor dat vrouwen die ten gevolge van een handeling kunnen worden blootgesteld aan ioniserende
      straling voor aanvang van het verrichten van handelingen zijn geïnformeerd over:
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel16
  - number: 16.a
    text: de noodzaak om een zwangerschap in een vroeg stadium te melden;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel16
  - number: 16.b
    text: |-
      de risico's van blootstelling aan ioniserende straling voor het ongeboren kind door uitwendige bestraling of
      besmetting;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel16
  - number: 16.c
    text: de risico's die een kind dat borstvoeding krijgt, loopt bij besmetting van de moeder.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel16
  - number: '17'
    text: |-
      De ondernemer zorgt ervoor dat de werknemers meewerken aan het voor hen georganiseerde onderricht en de instructies
      naleven die hen ingevolge dit besluit worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel17
  - number: '18.1'
    text: 'De ondernemer zorgt ervoor dat met betrekking tot toestellen:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel18
  - number: 18.1.a
    text: |-
      een zodanige afscherming is aangebracht dat de straling die naar buiten treedt, uitgezonderd op de plaats van de
      opening bestemd voor het naar buiten treden van de nuttige stralenbundel, zo weinig als redelijkerwijs mogelijk
      schade kan toebrengen. Deze afschermingseisen gelden niet:
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel18
  - number: 18.1.a.1°
    text: voor het testen van een toestel;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel18
  - number: 18.1.a.2°
    text: |-
      voor röntgenbuizen tot een maximale hoogspanning van meer dan 300 kV, indien deze worden gebruikt in een speciaal
      daarvoor ingerichte plaats, of
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel18
  - number: 18.1.a.3°
    text: |-
      tijdens reparatie, onderhoud of onderzoek met röntgenbuizen opgesteld in laboratoria of beproevingsruimten, mits
      maatregelen zijn genomen waardoor schade ten gevolge van uitwendige bestraling zoveel als redelijkerwijs mogelijk
      wordt voorkomen;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel18
  - number: 18.1.b
    text: |-
      een tubus of een ander middel dat de grootte van de nuttige stralenbundel bepaalt, dezelfde mate van bescherming
      tegen straling waarborgt als het omhulsel van een toestel;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel18
  - number: 18.1.c
    text: |-
      een toestel en de bijbehorende hulp- en beveiligingsmiddelen zodanig zijn opgesteld en afgeschermd dat personen
      zich niet aan de primaire stralenbundel behoeven bloot te stellen, tenzij bij het ondergaan van een radiologische
      verrichting;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel18
  - number: 18.1.d
    text: |-
      tenzij dit redelijkerwijs niet kan worden gevergd, maatregelen worden getroffen ten aanzien van de opstelling en
      werkwijze van een toestel om te voorkomen dat door verstrooide straling schade wordt toegebracht;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel18
  - number: 18.1.e
    text: een toestel niet door onbevoegden in werking kan worden gesteld;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel18
  - number: 18.1.f
    text: |-
      regelmatig van ieder toestel de goede werking met het oog op de bescherming tegen ioniserende straling wordt
      gecontroleerd;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel18
  - number: '18.2'
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid kan nadere regels stellen met betrekking tot het bepaalde in
      dit artikel.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel18
  - number: '19.1'
    text: |-
      Onverminderd [artikel 18][ref1] zorgt de ondernemer er ter bescherming van werknemers en van leden van de
      bevolking voor dat toestellen voor diagnostisch of therapeutisch gebruik voor radiologische verrichtingen of in
      de veterinaire praktijk voldoen aan de eis dat bij gesloten opening het omgevingsdosisequivalenttempo van de door
      het omhulsel naar buiten tredende straling, gemeten bij een maximale hoogspanning en de daarbij behorende continu
      toelaatbare stroom op een meter afstand van het focus, niet meer bedraagt dan 1 mSv per uur bij toestellen voor
      diagnostisch gebruik of 10 mSv per uur bij toestellen voor therapeutisch gebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel18
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: '19.2'
    text: |-
      De ondernemer zorgt ervoor dat personen tijdens een radiologische verrichting of bij een veterinaire diagnostische
      of therapeutische verrichting met ioniserende straling, uitgezonderd degene die de verrichting ondergaat, zich
      achter een afscherming van voldoende stralenverzwakkend vermogen of buiten de ruimte waar het onderzoek plaatsvindt
      bevinden of dat aan hen doelmatige persoonlijke beschermingsmiddelen ter beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel19
  - number: '20.1'
    text: |-
      De ondernemer zorgt ervoor dat, in situaties waar ten gevolge van handelingen of werkzaamheden de in artikel
      49 of 76 genoemde doses kunnen worden overschreden, op daarvoor geschikte plaatsen doelmatige en duidelijke
      waarschuwingsborden of -tekens en opschriften worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel20
  - number: '20.2'
    text: |-
      De ondernemer zorgt ervoor dat ruimten en plaatsen waar handelingen met open bronnen worden verricht, de inrichting
      daarvan of daarin gebruikte voorwerpen regelmatig volgens door hem schriftelijk vastgestelde procedures worden
      gecontroleerd op besmetting.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel20
  - number: '20.3'
    text: |-
      De ondernemer zorgt ervoor dat wanneer open en ingekapselde bronnen niet worden gebruikt, deze, indien dit
      redelijkerwijs mogelijk is, worden opgeborgen in een daartoe geschikte bergplaats.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel20
  - number: '20.4'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot het model, de opschriften en de minimale
      grootte van de waarschuwingsborden of -tekens, bedoeld in het eerste lid, en waar en op welke wijze deze moeten
      worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel20
  - number: '21.1'
    text: |-
      De ondernemer die een handeling verricht met een toestel meldt dit ten minste drie weken tevoren overeenkomstig de
      artikelen 40 en 41.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel21
  - number: '21.2'
    text: 'Deze verplichting geldt niet indien het een handeling betreft met:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel21
  - number: 21.2.a
    text: een toestel waarvoor ingevolge dit besluit een vergunning is vereist;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel21
  - number: 21.2.b
    text: een elektronenstraalbuis voor visuele beeldweergave;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel21
  - number: 21.2.c
    text: |-
      een ander toestel dan bedoeld onder a of b met een maximale hoogspanning van niet meer dan 30 kV, dat onder
      normale bedrijfsomstandigheden op 0,1 meter afstand van enig bereikbare buitenzijde van het toestel geen hoger
      omgevingsdosisequivalenttempo veroorzaakt dan 1 µSv per uur;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel21
  - number: 21.2.d
    text: |-
      een ander toestel dan bedoeld onder a, b of c, dat onder normale bedrijfsomstandigheden op 0,1 meter afstand van
      enig bereikbare buitenzijde van het toestel geen hoger omgevingsdosisequivalenttempo veroorzaakt dan 1 µSv per uur
      en dat behoort tot een type dat door Onze Ministers is goedgekeurd op grond van bij ministeriële regeling gestelde
      regels.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel21
  - number: '22'
    text: |-
      Indien met een toestel geen handelingen meer worden verricht die zijn gemeld overeenkomstig [artikel 21][ref1],
      meldt de ondernemer dit overeenkomstig de [artikelen 40][ref2] en [42][ref3] binnen drie weken na het beëindigen
      van de handeling.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel40
      [ref3]: https://wetten.overheid.nl/BWBR0012702#Artikel42
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '21'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '40'
        hoofdstuk: '4'
        paragraaf: '4.6'
      - id: ref3
        bwb_id: BWBR0012702
        artikel: '42'
        hoofdstuk: '4'
        paragraaf: '4.6'
  - number: '23.1'
    text: 'Het is verboden zonder vergunning een handeling te verrichten met:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel23
  - number: 23.1.a
    text: 'een toestel voor:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel23
  - number: 23.1.a.1°
    text: industriële radiografie;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel23
  - number: 23.1.a.2°
    text: bewerking van producten;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel23
  - number: 23.1.a.3°
    text: onderwijsdoeleinden;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel23
  - number: 23.1.a.4°
    text: blootstelling van personen en dieren voor therapeutische doeleinden;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel23
  - number: 23.1.b
    text: een ander toestel dan bedoeld onder a met een maximale hoogspanning van 100 kV of meer;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel23
  - number: 23.1.c
    text: een toestel dat deeltjes versnelt en ioniserende straling met een energie van meer dan 1 MeV kan uitzenden.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel23
  - number: '23.2'
    text: Het is voorts verboden zonder vergunning onderzoeks- en ontwikkelingswerk te verrichten aan een toestel.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel23
  - number: '23.3'
    text: 'Het verbod, bedoeld in het eerste lid, geldt niet voor:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel23
  - number: 23.3.a
    text: handelingen met elektronenmicroscopen;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel23
  - number: 23.3.b
    text: het uitsluitend in opslag hebben van toestellen ten behoeve van de handel in deze toestellen;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel23
  - number: 23.3.c
    text: |-
      een toestel dat wordt gebruikt voor onderwijsdoeleinden, dat onder normale bedrijfsomstandigheden op 0,1 meter
      afstand van enig bereikbare buitenzijde van het toestel geen hoger omgevingsdosisequivalenttempo veroorzaakt dan
      1 µSv per uur en dat behoort tot een type dat door Onze Ministers is goedgekeurd op grond van bij ministeriële
      regeling gestelde regels.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel23
  - number: '24'
    text: 'Het is verboden zonder vergunning:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel24
  - number: 24.a
    text: |-
      radioactieve stoffen toe te dienen aan personen en, voor zover het de bescherming van mensen tegen ioniserende
      straling betreft, aan dieren voor:
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel24
  - number: 24.a.1°
    text: het stellen van medische of veterinaire diagnoses;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel24
  - number: 24.a.2°
    text: therapie of (bio)medisch onderzoek;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel24
  - number: 24.b
    text: radioactieve stoffen toe te voegen aan producten, bestemd voor gebruik op of in de directe omgeving van personen;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel24
  - number: 24.c
    text: 'met radioactieve stoffen handelingen te verrichten voor:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel24
  - number: 24.c.1°
    text: industriële radiografie;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel24
  - number: 24.c.2°
    text: bewerking van producten;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel24
  - number: 24.c.3°
    text: onderwijsdoeleinden en wetenschappelijk onderzoek.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel24
  - number: '25.1'
    text: |-
      Het is verboden zonder vergunning een andere handeling dan bedoeld in artikel 24 of 37, niet zijnde een lozing, met
      een radioactieve stof te verrichten.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel25
  - number: '25.2'
    text: 'Het verbod, bedoeld in het eerste lid en in artikel 24, onder c, geldt niet indien binnen een locatie:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel25
  - number: 25.2.a
    text: |-
      de activiteit van de radionucliden in de betrokken radioactieve stof lager is dan de in bijlage 1, tabel 1,
      genoemde waarde, of
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel25
  - number: 25.2.b
    text: de activiteitsconcentratie van die stof lager is dan de in bijlage 1, tabel 1, genoemde waarde.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel25
  - number: '25.3'
    text: |-
      Indien een radioactieve stof meer soorten radionucliden bevat, wordt de activiteitsconcentratie van de
      radionucliden gewogen gesommeerd volgens de in bijlage 3 aangegeven methode. Aan het tweede lid, onder b, wordt
      voldaan indien de uitkomst van deze sommatie kleiner of gelijk aan 1 is.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel25
  - number: '25.4'
    text: |-
      Indien binnen een locatie op enig moment meer handelingen plaatsvinden, worden de activiteiten van de radionucliden
      in de bij die handelingen betrokken radioactieve stoffen gewogen gesommeerd volgens de in bijlage 3 aangegeven
      methode. Aan het tweede lid, onder a, wordt voldaan indien de uitkomst van deze sommatie kleiner of gelijk aan
      1 is.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel25
  - number: '25.5'
    text: |-
      Onze Ministers kunnen bij ministeriële regeling handelingen met producten als bedoeld in artikel 24, onder b,
      aanwijzen, waarbij de aan deze producten toegevoegde radionucliden niet worden betrokken bij een sommatie als
      bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel25
  - number: '25.6'
    text: |-
      De verboden, bedoeld in het eerste lid en in de artikelen 23 en 24, gelden niet voor bij ministeriële regeling
      aangewezen handelingen die een beperkt risico van blootstelling van mensen tot gevolg hebben.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel25
  - number: '25.7'
    text: |-
      Bij ministeriële regeling kunnen andere methoden worden aangewezen voor het bepalen en het toetsen van de schade
      in gevallen waarin de in het tweede lid bedoelde activiteitsconcentratie in combinatie met de in het tweede lid
      bedoelde activiteit geen juiste indicatie geeft van de schade die de bij de handeling betrokken radioactieve
      stoffen kunnen veroorzaken.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel25
  - number: '25.8'
    text: |-
      Bij ministeriële regeling kan in afwijking van het tweede lid, het eerste lid van toepassing worden verklaard in
      geval er sprake is van een te hoog risico van blootstelling van werknemers en leden van de bevolking.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel25
  - number: '26.1'
    text: |-
      Het in artikel 25, eerste lid, gestelde verbod geldt tevens niet voor handelingen met een ingekapselde bron waarbij
      de in bijlage 1, tabel 1, genoemde waarden voor de activiteit en de activiteitsconcentratie worden overschreden,
      indien:
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel26
  - number: 26.1.a
    text: deze van een door Onze Ministers goedgekeurd type is, en
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel26
  - number: 26.1.b
    text: |-
      deze onder normale bedrijfsomstandigheden op 0,1 meter van enige bereikbare buitenzijde daarvan geen hogere
      omgevingsdosisequivalent kan geven dan 1 µSv per uur.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel26
  - number: '26.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot keuringen als bedoeld in het eerste lid,
      onder a, en voor de opslag en de verwijdering van ingekapselde bronnen als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel26
  - number: '27'
    text: |-
      In afwijking van de [artikelen 24, onder b][ref1], en [25][ref2] is het verboden:


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel25
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '25'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 27.a
    text: voor verlichtingsdoeleinden radionucliden toe te voegen aan een aanwijsinstrument;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel27
  - number: 27.b
    text: |-
      handelingen te verrichten met het aanwijsinstrument waaraan voor verlichtingsdoeleinden radionucliden zijn
      toegevoegd.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel27
  - number: '28'
    text: 'De in de artikelen 24, onder b, en 27, gestelde verboden gelden niet indien:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel28
  - number: 28.a
    text: het een aanwijsinstrument betreft;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel28
  - number: 28.b
    text: |-
      uitsluitend H-3 in lichtcellen of Pm-147 in lichtgevende verf wordt, onderscheidenlijk is toegevoegd voor
      verlichtingsdoeleinden;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel28
  - number: 28.c
    text: het aanwijsinstrument in totaal een lagere activiteit bevat dan 1 GBq H-3 of 10 MBq Pm-147;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel28
  - number: 28.d
    text: |-
      het aanwijsinstrument voldoet aan in het belang van de bescherming tegen ioniserende straling bij ministeriële
      regeling gestelde voorschriften met betrekking tot de constructie;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel28
  - number: 28.e
    text: |-
      geen herstel- of onderhoudswerkzaamheden worden verricht, waarbij een onderdeel van het aanwijsinstrument, waaraan
      voor verlichtingsdoeleinden H-3 in lichtcellen of Pm-147 in lichtgevende verf is toegevoegd, van zijn omhulsel
      wordt ontdaan; en
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel28
  - number: 28.f
    text: |-
      niet meer dan 100 aanwijsinstrumenten waaraan voor verlichtingsdoeleinden H-3 in lichtcellen of Pm-147 in
      lichtgevende verf is toegevoegd, voorhanden zijn.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel28
  - number: '29.1'
    text: 'De in artikel 27 gestelde verboden gelden niet indien:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel29
  - number: 29.1.a
    text: het een aanwijsinstrument betreft;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel29
  - number: 29.1.b
    text: |-
      uitsluitend H-3 in lichtcellen of Pm-147 in lichtgevende verf wordt, onderscheidenlijk is toegevoegd voor
      verlichtingsdoeleinden;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel29
  - number: 29.1.c
    text: het aanwijsinstrument in totaal een lagere activiteit bevat dan 3 GBq H-3 of 30 MBq Pm-147, en
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel29
  - number: 29.1.d
    text: |-
      voldoet aan in het belang van de bescherming tegen ioniserende straling bij ministeriële regeling gestelde
      voorschriften met betrekking tot de constructie.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel29
  - number: '29.2'
    text: |-
      Onze Minister van Defensie kan ontheffing verlenen van de in de artikelen 24, onder b, 25, eerste lid, en 27
      gestelde verboden, indien het aanwijsinstrumenten betreft waaraan voor verlichtingsdoeleinden radionucliden zijn
      toegevoegd en die in gebruik zijn dan wel bestemd zijn voor gebruik bij de krijgsmacht en die zijn bedoeld voor
      gebruik onder operationele omstandigheden.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel29
  - number: '30.1'
    text: |-
      De in de artikelen 25 en 27, onder b, gestelde verboden gelden niet voor het voorhanden hebben, toepassen of zich
      ontdoen van een aanwijsinstrument dat voor verlichtingsdoeleinden minder dan 56 kBq Ra-226+ of minder dan 0,93
      GBq H-3 in lichtgevende verf bevat door detailhandelaren of particulieren, noch voor het herstellen of onderhouden
      van zodanige instrumenten door de ondernemer, voor zover die instrumenten voor het tijdstip waarop dit verbod in
      werking treedt, zijn vervaardigd en in Nederland in de handel zijn gebracht.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel30
  - number: '30.2'
    text: |-
      De ondernemer zorgt ervoor dat na herstel- of onderhoudswerkzaamheden aan een aanwijsinstrument als bedoeld in het
      eerste lid:
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel30
  - number: 30.2.a
    text: |-
      een bij ministeriële regeling vast te stellen waarschuwingsteken voor ioniserende straling is aangebracht op een
      vanaf de buitenzijde van het instrument zichtbare plaats;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel30
  - number: 30.2.b
    text: |-
      het merkteken T 25 of Ra 1,5 onderscheidenlijk voor H-3 en Ra-226+ in lichtgevende verf, is aangebracht op een
      vanaf de buitenzijde van het instrument zichtbare plaats.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel30
  - number: '30.3'
    text: |-
      Het in artikel 27, onder b, gestelde verbod geldt niet voor aanwijsinstrumenten, waaraan radioactieve nucliden zijn
      toegevoegd voor verlichtingsdoeleinden, indien dit aanwijsinstrument voorhanden is voor een tentoonstelling of de
      ondernemer zich ervan ontdoet na een tentoonstelling.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel30
  - number: '30.4'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de voorschriften die kunnen worden
      verbonden aan een vergunning voor handelingen als bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel30
  - number: '31.1'
    text: |-
      De ondernemer controleert na het voor verlichtingsdoeleinden toevoegen van radioactieve stoffen aan
      aanwijsinstrumenten of deze aanwijsinstrumenten voldoen aan de bij en krachtens de artikelen 28 of 29 gestelde
      voorschriften.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel31
  - number: '31.2'
    text: |-
      De ondernemer tekent de uitvoering van de in het eerste lid bedoelde controles en de resultaten daarvan aan in een
      daartoe bestemde administratie.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel31
  - number: '31.3'
    text: |-
      Onze Ministers kunnen van de in het eerste en tweede lid gestelde verplichtingen ontheffing verlenen, indien
      de ondernemer ten genoegen van Onze Ministers aantoont dat de in het eerste en tweede lid bedoelde controles en
      administratie door een ander worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel31
  - number: '31.4'
    text: De in het tweede en derde lid bedoelde administratie wordt ten minste vijf jaar bewaard.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel31
  - number: '31.5'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld met betrekking tot het bepaalde in het eerste, tweede en
      derde lid.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel31
  - number: '32'
    text: |-
      De ondernemer zorgt ervoor dat op een aanwijsinstrument waaraan H-3 in lichtcellen of Pm-147 in lichtgevende
      verf voor verlichtingsdoeleinden is toegevoegd, op een vanaf de buitenzijde van het instrument zichtbare plaats
      is aangebracht:
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel32
  - number: 32.a
    text: |-
      een waarschuwingsteken als bedoeld in [artikel 30, tweede lid, onder a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel30
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '30'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 32.b
    text: |-
      indien het betreft een aanwijsinstrument als bedoeld in [artikel 29][ref1] het merkteken voor T 3 GBq of Pm 30 MBq
      onderscheidenlijk voor H-3 in lichtcellen en Pm-147 in lichtgevende verf.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel29
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '29'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '33'
    text: |-
      De ondernemer zorgt ervoor dat na herstel- of onderhoudswerkzaamheden aan een aanwijsinstrument waaraan
      radionucliden voor verlichtingsdoeleinden zijn toegevoegd:
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel33
  - number: 33.a
    text: |-
      ten gevolge van die herstel- en onderhoudswerkzaamheden geen afwijkingen van de bij en krachtens de
      [artikelen 28][ref1] en [29][ref2] gestelde voorschriften zijn ontstaan;


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel29
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '28'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '29'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 33.b
    text: |-
      het krachtens [artikel 30, tweede lid, onder a][ref1], vastgestelde waarschuwingsteken voor ioniserende straling is
      aangebracht op een vanaf de buitenzijde van het instrument zichtbare plaats;


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel30
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '30'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 33.c
    text: |-
      het in de [artikelen 30, tweede lid, onder b][ref1], onderscheidenlijk [32, onder b][ref2], genoemde merkteken
      is aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel32
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '30'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '32'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '34'
    text: |-
      Het is verboden buiten Nederland vervaardigde aanwijsinstrumenten, waaraan voor verlichtingsdoeleinden
      radionucliden zijn toegevoegd, voorhanden te hebben met het doel deze binnen Nederland in de handel te brengen,
      indien deze niet voldoen aan de bij en krachtens de [artikelen 28][ref1], [29][ref2], [31][ref3] en [32][ref4]
      gestelde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0012702#Artikel31
      [ref4]: https://wetten.overheid.nl/BWBR0012702#Artikel32
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '28'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '29'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref3
        bwb_id: BWBR0012702
        artikel: '31'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref4
        bwb_id: BWBR0012702
        artikel: '32'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '35.1'
    text: |-
      Het is verboden zich zonder vergunning te ontdoen van radioactieve stoffen door middel van lozing in de lucht, in
      het openbare riool of in het oppervlaktewater.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel35
  - number: '35.2'
    text: 'Dit verbod geldt niet indien:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel35
  - number: 35.2.a
    text: |-
      bij lozing in de lucht, de activiteit van de in totaal in een kalenderjaar geloosde hoeveelheid radioactieve
      stoffen bij het verlaten van de locatie via een lozingspunt lager is dan 1 radiotoxiciteitsequivalent voor
      inhalatie als bedoeld in bijlage 2;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel35
  - number: 35.2.b
    text: |-
      bij lozing in het openbare riool, de activiteit van de in totaal in een kalenderjaar geloosde hoeveelheid
      radioactieve stoffen bij het verlaten van de locatie via een lozingspunt lager is dan 10 radiotoxiciteitsequivalent
      voor ingestie als bedoeld in bijlage 2;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel35
  - number: 35.2.c
    text: |-
      bij lozing in het oppervlaktewater, de activiteit van de in totaal in een kalenderjaar geloosde
      hoeveelheid radioactieve stoffen bij het verlaten van de locatie via een lozingspunt lager is dan 0,1
      radiotoxiciteitsequivalent voor ingestie als bedoeld in bijlage 2.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel35
  - number: '35.3'
    text: Het is verboden radioactieve stoffen te lozen in de bodem.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel35
  - number: '35.4'
    text: |-
      Het verbod, bedoeld in het derde lid, geldt niet voor het lozen in de bodem, wanneer de geloosde hoeveelheid
      radioactieve stoffen bij het verlaten van het lozingspunt minder bedraagt dan 10-6 radiotoxiciteitsequivalent voor
      ingestie als bedoeld in bijlage 2.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel35
  - number: '35.5'
    text: |-
      Het verbod, bedoeld in het derde lid, geldt niet voor het lozen van productiewater bij mijnbouw, indien dit
      geschiedt door middel van injecteren naar een soortgelijke bodemformatie en diepte als waaruit het water afkomstig
      is en op zodanige wijze dat het water niet in andere watervoerende lagen komt.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel35
  - number: '35.6'
    text: |-
      De geloosde hoeveelheden, uitgedrukt in radiotoxiciteitsequivalenten, worden gecorrigeerd voor fysisch verval door
      middel van de correctiefactoren zoals aangegeven in bijlage 2.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel35
  - number: '36.1'
    text: 'De ondernemer die een handeling verricht, zorgt ervoor dat, zoveel als redelijkerwijs mogelijk is:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel36
  - number: 36.1.a
    text: het ontstaan van radioactieve afvalstoffen wordt voorkomen of beperkt,
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel36
  - number: 36.1.b
    text: bronnen na gebruik als zodanig opnieuw worden gebruikt,
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel36
  - number: 36.1.c
    text: radioactieve stoffen en materialen waaruit een bron bestaat, na gebruik ervan opnieuw worden gebruikt, of
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel36
  - number: 36.1.d
    text: |-
      voorwerpen, stoffen en materialen die met radioactieve stoffen zijn besmet of geactiveerd, na gebruik ervan zodanig
      worden bewerkt dat ze opnieuw kunnen worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel36
  - number: '36.2'
    text: |-
      Bij het vervaardigen van bronnen wordt gebruik gemaakt van stoffen en materialen die na gebruik van de bron geen of
      zo min mogelijk nadelige gevolgen voor het milieu veroorzaken.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel36
  - number: '36.3'
    text: |-
      De ondernemer zorgt er voor dat een handeling zoveel als mogelijk is wordt verricht op een wijze waardoor de
      bescherming tegen schade is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel36
  - number: '37.1'
    text: |-
      Het is verboden zich zonder vergunning te ontdoen van radioactieve stoffen voor product- of materiaalhergebruik of
      van radioactieve afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel37
  - number: '37.2'
    text: 'Het verbod geldt niet indien:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel37
  - number: 37.2.a
    text: |-
      de activiteit van de radionucliden in de betrokken radioactieve stoffen in een kalenderjaar in totaal lager is dan
      de in bijlage 1, tabel 1, genoemde waarde, of
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel37
  - number: 37.2.b
    text: de activiteitsconcentratie van die stof lager is dan de in bijlage 1, tabel 1, genoemde waarde.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel37
  - number: '37.3'
    text: Artikel 25, derde, vierde, zesde en zevende lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel37
  - number: '37.4'
    text: |-
      Het verbod geldt tevens niet indien het ingekapselde bronnen betreft, die worden teruggenomen door degene die de
      bron heeft vervaardigd of geleverd.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel37
  - number: '37.5'
    text: |-
      Het verbod geldt tevens niet indien het een feitelijke levering betreft van radioactieve stoffen door enkele
      overgave aan een derde met het oog op:
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel37
  - number: 37.5.a
    text: gebruik, product- of materiaalhergebruik van radioactieve stoffen, of
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel37
  - number: 37.5.b
    text: inzameling van radioactieve afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel37
  - number: '37.6'
    text: |-
      Het verbod geldt tevens niet voor afgifte aan een door Onze Ministers aangewezen instelling voor ontvangst van in
      bezit genomen radioactieve stoffen als bedoeld in [artikel 33, vierde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel33
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '33'
  - number: '37.7'
    text: |-
      Het verbod geldt tevens niet voor het zich ontdoen van radioactieve afvalstoffen door afgifte aan een door Onze
      Ministers erkende ophaaldienst voor radioactieve afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel37
  - number: '37.8'
    text: |-
      Het verbod geldt tevens niet voor afgifte aan door Onze Ministers aangewezen instellingen voor de ontvangst van
      radioactieve afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel37
  - number: '37.9'
    text: |-
      Het vierde tot en met achtste lid gelden alleen indien de ondernemer zich ervan heeft vergewist dat de ontvanger
      in het bezit is van een vergunning voor de desbetreffende handeling of anderszins gerechtigd is deze stoffen te
      ontvangen.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel37
  - number: '38.1'
    text: |-
      Een radioactieve stof kan door Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer of
      de ondernemer als radioactieve afvalstof worden aangemerkt, indien voor deze stof geen gebruik of product- of
      materiaalhergebruik is voorzien door Onze Minister of door de ondernemer en er geen sprake is van lozing van de
      stof.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel38
  - number: '38.2'
    text: Een afvalstof wordt niet als radioactieve afvalstof aangemerkt, indien artikel 37, tweede lid, van toepassing is.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel38
  - number: '38.3'
    text: Radioactieve afvalstoffen worden zo snel als redelijkerwijs mogelijk afgevoerd.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel38
  - number: '38.4'
    text: |-
      De in het derde lid gestelde verplichting geldt niet indien de radioactieve afvalstoffen een fysische
      halveringstijd hebben van minder dan 100 dagen en maximaal 2 jaar worden opgeslagen in een daartoe geschikte ruimte
      met het oog op fysisch verval tot afvalstoffen als bedoeld in artikel 37, tweede lid.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel38
  - number: '38.5'
    text: |-
      Het is verboden radioactieve afvalstoffen te mengen met het doel de activiteitsconcentratie van de stoffen beneden
      de in bijlage 1, tabel 1, bedoelde waarden te brengen.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel38
  - number: '39'
    text: 'Geen vergunning krachtens dit hoofdstuk wordt verleend indien:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel39
  - number: 39.a
    text: |-
      niet aan de voorwaarden van de artikelen 4, 5, 6 en 48 betreffende rechtvaardiging, optimalisatie en dosislimieten
      is voldaan;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel39
  - number: 39.b
    text: |-
      voor een lid van de bevolking dat zich buiten de locatie bevindt, als gevolg van de handeling waarvoor de
      vergunning is aangevraagd en ten gevolge van andere handelingen binnen en buiten deze locatie, een van de volgende
      doses wordt overschreden:
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel39
  - number: 39.b.1°
    text: 'een effectieve dosis van 1 mSv in een kalenderjaar en met inachtneming daarvan:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel39
  - number: 39.b.2°
    text: een equivalente dosis van 50 mSv in een kalenderjaar voor de huid gemiddeld over enig huidoppervlak van 1 cm2;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel39
  - number: 39.c
    text: |-
      de handeling waarvoor de vergunning is aangevraagd behoort tot een categorie die op grond van de ministeriële
      regeling, bedoeld in artikel 4, tweede lid, als gerechtvaardigd is bekend gemaakt, maar het specifieke karakter van
      deze handeling op grond van artikel 4, eerste lid, niet gerechtvaardigd is.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel39
  - number: '40.1'
    text: De melding, bedoeld in de artikelen 21 en 22, wordt beoordeeld door Onze Ministers, en
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel40
  - number: 40.1.a
    text: |-
      indien de in die artikelen bedoelde handelingen betrekking hebben op medische stralingstoepassingen, Onze Minister
      van Volksgezondheid, Welzijn en Sport;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel40
  - number: 40.1.b
    text: indien de in die artikelen bedoelde handelingen betrekking hebben op mijnbouw, Onze Minister van Economische Zaken.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel40
  - number: '40.2'
    text: Bij regeling van Onze Ministers, en
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel40
  - number: 40.2.a
    text: indien het medische stralingstoepassingen betreft, Onze Minister van Volksgezondheid Welzijn en Sport;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel40
  - number: 40.2.b
    text: |-
      indien het mijnbouw betreft, Onze Minister van Economische Zaken; kunnen nadere regels worden gesteld met
      betrekking tot de melding, bedoeld in het eerste lid
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel40
  - number: '41.1'
    text: 'De melding, bedoeld in artikel 21, bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel41
  - number: 41.1.a
    text: de naam en het adres van degene die de melding ondertekent;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel41
  - number: 41.1.b
    text: de naam en het adres van de ondernemer;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel41
  - number: 41.1.c
    text: het adres of de kadastrale gegevens van de locatie;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel41
  - number: 41.1.d
    text: een omschrijving van de handeling, de plaats van de handeling en van het doel;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel41
  - number: 41.1.e
    text: |-
      de maximale effectieve dosis die een persoon in een kalenderjaar kan ontvangen op enig punt buiten de locatie ten
      gevolge van de toestellen die zich binnen twee meter van enig punt buiten de locatie bevinden.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel41
  - number: '41.2'
    text: De melding bevat voorts een beschrijving van het toestel waarmee de gemelde handeling wordt verricht.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel41
  - number: '41.3'
    text: |-
      Indien de in het eerste lid, onder e, bedoelde dosis hoger is dan 10 µSv, bevat de melding tevens een beschrijving
      van de maatregelen ter voorkoming van en bescherming tegen schade in en buiten de locatie.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel41
  - number: '41.4'
    text: |-
      Indien de handeling uitsluitend het in opslag hebben van een toestel betreft, worden slechts de in het eerste lid,
      onder a tot en met d, genoemde gegevens verstrekt en wordt vermeld welk soort toestel het betreft.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel41
  - number: '41.5'
    text: |-
      Degene die de handeling meldt, is verplicht aan Onze Ministers kennis te geven van een na de melding opgetreden
      wijziging in een van de gegevens die bij de melding zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel41
  - number: '41.6'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de gegevens die een melding bevat
      en tot de situaties waarin een nieuwe melding is vereist.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel41
  - number: '42'
    text: |-
      De melding, bedoeld in [artikel 22][ref1], bevat in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel22
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '22'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 42.a
    text: de naam en het adres van degene die de melding ondertekent;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel42
  - number: 42.b
    text: de naam en het adres van de ondernemer;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel42
  - number: 42.c
    text: het adres of de kadastrale gegevens van de locatie;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel42
  - number: 42.d
    text: een aanduiding van de handeling;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel42
  - number: 42.e
    text: indien van toepassing de wijze waarop de ondernemer zich van het toestel heeft ontdaan;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel42
  - number: 42.f
    text: |-
      indien van toepassing een wijziging van de effectieve dosis als bedoeld in [artikel 41, eerste lid, onder e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel41
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '41'
        hoofdstuk: '4'
        paragraaf: '4.6'
  - number: '43.1'
    text: |-
      De ondernemer dient de aanvraag om een vergunning voor een handeling als bedoeld in de artikelen 23, eerste en
      tweede lid, 24, 25, eerste lid, 35, eerste lid, en 37, eerste lid, in bij Onze Minister van Sociale Zaken en
      Werkgelegenheid.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel43
  - number: '43.2'
    text: Bij regeling van Onze Ministers, en
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel43
  - number: 43.2.a
    text: indien het medische stralingstoepassingen betreft, Onze Minister van Volksgezondheid, Welzijn en Sport;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel43
  - number: 43.2.b
    text: indien het mijnbouw betreft, Onze Minister van Economische Zaken;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel43
  - number: 43.2.c
    text: indien het lozing in het oppervlaktewater betreft, Onze Minister van Verkeer en Waterstaat;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel43
  - number: 43.2.d
    text: |-
      indien het lozing in het oppervlaktewater of lozing in de lucht betreft, Onze Minister van Landbouw, Natuurbeheer
      en Visserij;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel43
  - number: '43.3'
    text: |-
      Een aanvraag als bedoeld in het eerste lid betreft niet de handelingen die binnen de locatie worden verricht
      door de persoon die in het bezit is van een vergunning voor het op steeds wisselende plaatsen verrichten van de
      betrokken handelingen.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel43
  - number: '43.4'
    text: |-
      Op de aanvraag om een vergunning voor een handeling als bedoeld in artikel 23, eerste en tweede lid, wordt beslist
      door Onze Ministers, en
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel43
  - number: 43.4.a
    text: |-
      indien de in die artikelen bedoelde handelingen betrekking hebben op medische stralingstoepassingen, Onze Minister
      van Volksgezondheid, Welzijn en Sport;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel43
  - number: 43.4.b
    text: indien de in die artikelen bedoelde handelingen betrekking hebben op mijnbouw, Onze Minister van Economische Zaken;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel43
  - number: '44.1'
    text: 'De aanvraag om een vergunning voor een handeling als bedoeld in dit besluit bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel44
  - number: 44.1.a
    text: de naam en het adres van degene die de aanvraag ondertekent;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel44
  - number: 44.1.b
    text: de naam en het adres van de ondernemer;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel44
  - number: 44.1.c
    text: |-
      een omschrijving van de locatie en het adres of de kadastrale gegevens daarvan, bij wisselende locaties wordt een
      zo goed mogelijke aanduiding hiervan gegeven;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel44
  - number: 44.1.d
    text: een omschrijving van de handeling waarvoor vergunning wordt gevraagd en het doel daarvan;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel44
  - number: 44.1.e
    text: |-
      de maximale totale effectieve dosis zowel ten gevolge van lozingen als ten gevolge van externe straling op basis
      van omgevingsdosisequivalenten, die een persoon in een kalenderjaar kan ontvangen op enig punt buiten de locatie
      van alle meldings- en vergunningplichtige handelingen tezamen binnen de locatie waarop de vergunningaanvraag van
      toepassing is;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel44
  - number: 44.1.f
    text: |-
      de maximale effectieve of equivalente dosis die de bij de handelingen betrokken werknemers in een kalenderjaar
      kunnen ontvangen;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel44
  - number: 44.1.g
    text: |-
      een beschrijving van de stralingsbeschermingsorganisatie en van de aanwezige deskundigheid met betrekking tot de
      handeling;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel44
  - number: 44.1.h
    text: een opgave van de tijdsduur van de handeling;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel44
  - number: 44.1.i
    text: |-
      een overzicht van alle meldingsplichtige en vergunningplichtige handelingen binnen de locatie, gespecificeerd naar
      aard en omvang.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel44
  - number: '44.2'
    text: |-
      Indien de aanvraag betrekking heeft op een handeling met een toestel, bevat zij voorts een beschrijving van het
      toestel onder vermelding van de gegevens betreffende de ioniserende straling die het toestel kan uitzenden.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel44
  - number: '44.3'
    text: 'Indien de aanvraag betrekking heeft op een handeling met radioactieve stoffen, bevat zij voorts:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel44
  - number: 44.3.a
    text: een opgave van de radionucliden, waarvoor vergunning wordt gevraagd;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel44
  - number: 44.3.b
    text: |-
      een opgave van de ten gevolge van alle vergunningplichtige handelingen maximaal in de lucht, in het openbare riool,
      het oppervlaktewater, of in de bodem te lozen radiotoxiciteitsequivalenten voor de locatie waarop de aanvraag
      betrekking heeft, uitgedrukt in radiotoxiciteitsequivalenten voor inhalatie, respectievelijk ingestie en gewogen
      voor inhalatie en ingestie;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel44
  - number: 44.3.c
    text: de radiotoxiciteitsequivalenten waarvoor de vergunning om te lozen wordt aangevraagd.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel44
  - number: '44.4'
    text: |-
      Indien de aanvraag betrekking heeft op een handeling met een ingekapselde bron, bevat zij voorts een opgave van de
      chemische en fysische toestand en vorm waardoor deze radioactieve stoffen een ingekapselde bron vormen alsmede een
      aanduiding van de constructie en de kwaliteit van de bron.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel44
  - number: '44.5'
    text: |-
      Indien het een handeling met radioactieve stoffen betreft, bevat de aanvraag voorts een opgave van de
      overeenkomstig bijlage 3 gewogen en gesommeerde activiteit van de radionucliden in de radioactieve stoffen, die op
      de in het eerste lid, onder c, bedoelde locatie ten hoogste aanwezig zal zijn.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel44
  - number: '44.6'
    text: |-
      Indien de omgevingsdosisequivalent, bedoeld in het eerste lid, onder e, hoger is dan 10 µSv of de
      radiotoxiciteitsequivalenten van de geloosde activiteiten een dosis vertegenwoordigen die gelijk aan of hoger is
      dan 1 µSv, in een kalenderjaar op enig punt buiten de locatie, bevat de aanvraag tevens een beschrijving van de
      maatregelen ter voorkoming van en bescherming tegen schade in en buiten de locatie.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel44
  - number: '44.7'
    text: |-
      De houder van een vergunning is verplicht aan Onze Ministers kennis te geven van een na het verlenen van de
      vergunning opgetreden wijziging in een der gegevens vermeld bij de aanvraag om de vergunning.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel44
  - number: '44.8'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de gegevens van de aanvraag van
      de vergunning.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel44
  - number: '45'
    text: |-
      [Afdeling 3.4 van de Algemene wet bestuursrecht][ref1], alsmede [afdeling 13.2 van de Wet milieubeheer][ref2]
      zijn van toepassing op de voorbereiding van een beschikking ter zake van een vergunning als bedoeld in artikel 23,
      eerste lid, onder c, behoudens indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Afdeling13.2
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0003245
        afdeling: '13.2'
  - number: 45.a
    text: het toestel uitsluitend voor radiologische verrichtingen is bestemd;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel45
  - number: 45.b
    text: |-
      het toestel zich bevindt in een voertuig of aan boord van een vaartuig of luchtvaartuig, dat als zodanig wordt
      gebruikt;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel45
  - number: 45.c
    text: |-
      het toestel zich bevindt op steeds wisselende locaties, en naar het oordeel van Onze Ministers
      het belang van de toepassing van [afdeling 3.4 van de Algemene wet bestuursrecht][ref1], alsmede
      [afdeling 13.2 van de Wet milieubeheer][ref2] niet opweegt tegen de daaraan verbonden bezwaren;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Afdeling13.2
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0003245
        afdeling: '13.2'
  - number: 45.d
    text: |-
      indien al eerder vergunning voor een toestel van hetzelfde type met betrekking tot dezelfde plaats is verleend en
      naar het oordeel van Onze Ministers niet te verwachten is dat door gebruikmaking van de gevraagde vergunning meer
      schade kan ontstaan dan bij de eerder verleende vergunning in aanmerking is genomen.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel45
  - number: '46.1'
    text: |-
      [Afdeling 3.4 van de Algemene wet bestuursrecht][ref1], alsmede [afdeling 13.2 van de Wet milieubeheer][ref2]
      zijn niet van toepassing op de voorbereiding van een beschikking ter zake van een vergunning voor het verrichten
      van handelingen met open bronnen, indien de uitkomst van de gewogen sommatie van de activiteiten van de op enig
      moment aanwezige hoeveelheid radionucliden in de bij die handelingen betrokken radioactieve stoffen volgens de in
      [bijlage 3][ref3] aangegeven methode niet meer bedraagt dan 104.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Afdeling13.2
      [ref3]: https://wetten.overheid.nl/BWBR0012702
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0003245
        afdeling: '13.2'
      - id: ref3
        bwb_id: BWBR0012702
  - number: '46.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing voor ingekapselde bronnen met dien verstande dat de uitkomst niet
      meer bedraagt dan 107.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel46
  - number: '47.1'
    text: |-
      Indien op de voorbereiding van een beschikking terzake van een vergunning voor het verrichten van een handeling
      met radioactieve stoffen [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing is, worden, anders
      dan als adviseurs, betrokken: het bestuur van de provincie, het bestuur van de gemeente waar de handeling wordt
      of zal worden verricht of, indien het een lozing in oppervlaktewateren betreft, het orgaan dat belast is met het
      kwalitatieve beheer van het oppervlaktewater waarin wordt of zal worden geloosd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '47.2'
    text: |-
      Indien op de voorbereiding van een beschikking terzake van een vergunning voor een handeling met een toestel
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing is, wordt, anders dan als adviseur, betrokken
      het bestuur van de gemeente waar de handeling wordt of zal worden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '47.3'
    text: |-
      Van de besluiten op aanvragen van vergunningen op de voorbereiding waarvan
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] niet van toepassing is, wordt door Onze Minister van Sociale
      Zaken en Werkgelegenheid mededeling gedaan in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '48.1'
    text: |-
      De ondernemer zorgt ervoor dat voor een lid van de bevolking als gevolg van handelingen, die onder zijn
      verantwoordelijkheid worden verricht, op enig punt buiten de locatie ten gevolge van die handelingen een effectieve
      dosis van 0,1 mSv in een kalenderjaar niet wordt overschreden.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel48
  - number: '48.2'
    text: |-
      Dit artikel is niet van toepassing voor personen, voor zover zij hulp en bijstand verlenen als bedoeld in
      [artikel 53, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel53
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '53'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: '49.1'
    text: |-
      De ondernemer zorgt ervoor dat voor een lid van de bevolking die zich binnen de locatie bevindt, als gevolg
      van handelingen, die onder zijn verantwoordelijkheid worden verricht, de volgende individuele doses niet worden
      overschreden:
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel49
  - number: 49.1.a
    text: 'een effectieve dosis van 1 mSv in een kalenderjaar en met inachtneming daarvan:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel49
  - number: 49.1.b
    text: 'een equivalente dosis van:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel49
  - number: 49.1.b.1°
    text: 15 mSv in een kalenderjaar in de ooglens, of
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel49
  - number: 49.1.b.2°
    text: 50 mSv in een kalenderjaar voor de huid gemiddeld over enig huidoppervlak van 1 cm2.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel49
  - number: '49.2'
    text: In het geval van inwendige besmetting wordt de effectieve volgdosis toegewezen aan het jaar van inname.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel49
  - number: '49.3'
    text: |-
      Dit artikel is niet van toepassing voor personen, voor zover zij hulp en bijstand verlenen als bedoeld in
      [artikel 53, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel53
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '53'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: '50.1'
    text: |-
      De ondernemer zorgt ervoor dat in omstandigheden waar een lid van de bevolking als gevolg van handelingen, die
      onder zijn verantwoordelijkheid worden verricht, aan besmetting of ioniserende straling binnen of buiten de
      locatie kan worden blootgesteld, voor de daarvoor in aanmerking komende plaatsen berekeningen van de effectieve of
      equivalente doses worden gemaakt en zo nodig metingen worden verricht.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel50
  - number: '50.2'
    text: |-
      De ondernemer houdt een administratie bij waarin hij de resultaten aantekent van de metingen en gebruikt deze,
      indien nodig, voor het bepalen van de doses, bedoeld in het eerste lid en de artikelen 48 en 49.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel50
  - number: '50.3'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld voor de inhoud, het beheer en de bewaartermijn van
      de administratie.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel50
  - number: '51'
    text: |-
      Bij een ongeval of radiologische noodsituatie binnen zijn locatie zorgt de ondernemer ervoor dat, indien een
      lid van de bevolking, binnen of buiten de betrokken locatie, ten gevolge daarvan is of kan zijn blootgesteld,
      individuele monitoring wordt uitgevoerd of dat de effectieve of equivalente doses die door de betrokken persoon
      zijn ontvangen op een andere wijze worden bepaald.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel51
  - number: '52'
    text: 'In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel52
  - number: 52.a
    text: |-
      apparatuur: toestellen, ingekapselde bronnen en open bronnen alsmede bijbehorende apparaten zoals ontwikkelmachines
      en gammacamera's;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel52
  - number: 52.b
    text: |-
      behandelend arts: een arts of een tandarts onder wiens medische verantwoordelijkheid een blootstelling aan
      ioniserende straling plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel52
  - number: 52.c
    text: |-
      bevolkingsonderzoek: onderzoek onder risicogroepen van de bevolking waarbij ioniserende straling wordt toegepast
      met het doel een vroegtijdige diagnose te verkrijgen;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel52
  - number: 52.d
    text: |-
      diagnostische referentieniveaus: dosisniveaus in de medische radiodiagnostiek en bij gebruik van radiofarmaca,
      hoeveelheden toe te dienen radioactiviteit, voor karakteristieke onderzoeken van groepen patiënten van
      standaardgrootte of standaardfantomen voor globaal gedefinieerde soorten toestellen of apparaten;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel52
  - number: 52.e
    text: |-
      kwaliteitsborging: de geplande en systematische verrichtingen die noodzakelijk zijn om voldoende zekerheid te geven
      dat een structuur, systeem, onderdeel of procedure naar behoren en in overeenstemming met algemeen aanvaarde normen
      functioneren;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel52
  - number: 52.f
    text: |-
      medisch radiologische procedure: de procedure vanaf aanvrage tot en met uitvoering en resultaatbeschouwing van de
      radiologische verrichting;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel52
  - number: 52.g
    text: |-
      medisch juridisch onderzoek: radiologische verrichting zonder medische indicatie, uitsluitend ten behoeve van
      verzekeringstechnische of juridische doeleinden;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel52
  - number: 52.h
    text: |-
      medische verantwoordelijkheid: de verantwoordelijkheid van een arts of tandarts betreffende individuele
      radiologische verrichtingen, met name de rechtvaardiging, de optimalisatie en de klinische evaluatie van het
      resultaat;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel52
  - number: 52.i
    text: 'Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel52
  - number: 52.j
    text: |-
      patiëntdosis: de dosis die betrekking heeft op een persoon die een blootstelling als bedoeld in artikel 53, eerste
      lid, ondergaat;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel52
  - number: 52.k
    text: |-
      praktische aspecten: de feitelijke uitvoering van een blootstelling als bedoeld in artikel 53, eerste lid,
      waaronder te verstaan: hanteren en gebruiken van radiologische apparatuur, beoordelen van technisch, fysische
      parameters, alsmede het beoordelen van patiëntdoses, ijking, onderhoud van apparatuur, bereiding en toediening van
      radiofarmaceutica en ontwikkeling van films;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel52
  - number: 52.l
    text: |-
      radiodiagnostisch: betrekking hebbend op in vivo diagnostische nucleaire geneeskunde, diagnostische en
      tandheelkundige radiologie;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel52
  - number: 52.m
    text: |-
      radiologisch: betrekking hebbend op radiodiagnostische en radiotherapeutische procedures en interventie-radiologie
      of andere plannings- of geleideradiologie;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel52
  - number: 52.n
    text: |-
      radiotherapeutisch: betrekking hebbend op radiotherapie, waaronder mede begrepen nucleaire geneeskunde voor
      therapeutische doeleinden;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel52
  - number: 52.o
    text: |-
      verwijzend arts: een arts of een tandarts die een verrichting aanvraagt waarbij gebruik wordt gemaakt van
      ioniserende straling.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel52
  - number: '53.1'
    text: 'Dit hoofdstuk is van toepassing op radiologische verrichtingen voor personen die:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel53
  - number: 53.1.a
    text: als patiënt een blootstelling ondergaan;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel53
  - number: 53.1.b
    text: deelnemen aan een bevolkingsonderzoek;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel53
  - number: 53.1.c
    text: arbeidsgeneeskundig onderzoek ondergaan;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel53
  - number: 53.1.d
    text: medisch juridisch onderzoek ondergaan;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel53
  - number: 53.1.e
    text: vrijwillig deelnemen aan medische of biomedische onderzoeksprogramma's.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel53
  - number: '53.2'
    text: |-
      Dit hoofdstuk is tevens van toepassing op personen die willens en wetens- doch niet beroepshalve- hulp en bijstand
      verlenen aan diegene die, als bedoeld in het eerste lid, een blootstelling ondergaat.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel53
  - number: '54'
    text: |-
      De ondernemer zorgt ervoor dat een radiologische verrichting uitsluitend geschiedt onder
      medische verantwoordelijkheid van een behandelend arts die is ingeschreven in een krachtens
      [artikel 14 van de Wet op de beroepen in de individuele gezondheidszorg][ref1] ingesteld register en die voldoet
      aan de bij ministeriële regeling vastgestelde deskundigheidseisen.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel14
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '14'
  - number: '55.1'
    text: |-
      Een type radiologische verrichting is niet gerechtvaardigd, indien het totale mogelijke diagnostische of
      therapeutische voordeel, waaronder begrepen het directe nut voor de gezondheid van de persoon die de blootstelling
      ondergaat, en het maatschappelijk nut, niet opweegt tegen de gezondheidsschade die de persoon die de blootstelling
      ondergaat, kan ondervinden, mede in aanmerking genomen de doeltreffendheid, de voordelen en risico's van de
      beschikbare alternatieve technieken die hetzelfde oogmerk hebben maar geen of minder blootstelling met zich
      meebrengen.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel55
  - number: '55.2'
    text: |-
      Onze Minister kan in de Staatscourant bekend maken welke typen van radiologische verrichtingen die blootstelling
      ingevolge het eerste lid niet rechtvaardigen, verboden zijn.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel55
  - number: '56.1'
    text: |-
      De verwijzend arts en de behandelend arts beoordelen ieder op grond van hun specifieke verantwoordelijkheid of
      een individuele radiologische verrichting gerechtvaardigd is, met inachtneming van de specifieke oogmerken van de
      blootstelling en de kenmerken van de betrokken persoon.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel56
  - number: '56.2'
    text: |-
      In afwijking van [artikel 55, tweede lid][ref1], kan een radiologische verrichting die ingevolge dat lid
      verboden is, onder speciale omstandigheden, in afzonderlijk te beoordelen gevallen, toch gerechtvaardigd zijn.
      De afzonderlijke beoordeling van de hiervoor genoemde rechtvaardiging wordt geregistreerd in het dossier van
      betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel55
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '55'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '56.3'
    text: |-
      Een behandelend arts laat geen blootstelling van de persoon, bedoeld in [artikel 53, tweede lid][ref1], toe indien
      dit niet voldoende voordeel oplevert, rekening houdend met de schade voor de gezondheid van de persoon die de
      blootstelling ondergaat, het directe nut voor de gezondheid van de persoon, bedoeld in artikel 53, eerste lid, het
      maatschappelijk nut en de gezondheidsschade die de blootstelling kan veroorzaken.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel53
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '53'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: '57'
    text: 'De ondernemer zorgt ervoor dat de behandelend arts specifiek aandacht geeft aan de rechtvaardiging van:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel57
  - number: 57.a
    text: medisch juridisch onderzoek;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel57
  - number: 57.b
    text: medisch en biomedisch onderzoek.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel57
  - number: '58'
    text: |-
      De ondernemer zorgt ervoor dat voor blootstelling als bedoeld in [artikel 53, eerste lid][ref1], voor
      radiotherapeutische doeleinden de patiëntdosis op klinisch fysisch verantwoorde wijze in het doelvolume individueel
      wordt berekend en toegediend, in aanmerking nemende dat de patiëntdosis in het weefsel buiten het doelvolume zo
      laag mogelijk dient te zijn, maar zonder aan het beoogde radiotherapeutische effect van de blootstelling afbreuk
      te doen.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel53
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '53'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: '59'
    text: |-
      Onze Minister bevordert de vaststelling en het gebruik van diagnostische referentieniveaus voor radiodiagnostische
      verrichtingen als bedoeld in artikel 53, eerste lid, alsmede het opstellen van protocollen terzake.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel59
  - number: '60'
    text: |-
      De ondernemer zorgt ervoor dat onverminderd het bepaalde in de
      [Wet medisch wetenschappelijk onderzoek met mensen][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0009408
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0009408
  - number: 60.a
    text: |-
      voor proefpersonen die zelf geen direct voordeel kunnen verwachten van de radiologische verrichting, een
      patiëntdosisbeperking wordt vastgesteld;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel60
  - number: 60.b
    text: |-
      indien de experimentele radiologische verrichting voor proefpersonen een voordeel beoogt, een op de proefpersoon
      gerichte planning van de experimentele verrichting plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel60
  - number: '61.1'
    text: Onze Minister kan dosisbeperkingen vaststellen voor blootstellingen als bedoeld in artikel 53, tweede lid.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel61
  - number: '61.2'
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer,
      regels geven voor de blootstellingen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel61
  - number: '62'
    text: |-
      De ondernemer zorgt ervoor dat, ingeval een persoon een onderzoek of behandeling met behulp van toegediende
      radionucliden ondergaat, aan de persoon of zijn wettelijk vertegenwoordiger in voorkomende gevallen schriftelijke
      instructies worden meegegeven. Tevens worden zij geïnformeerd over de risico's van de ioniserende straling voordat
      de betrokken persoon de locatie verlaat, teneinde de dosis voor anderen in contact met deze persoon zoveel als
      redelijkerwijs mogelijk is te beperken.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel62
  - number: '63'
    text: 'De ondernemer zorgt ervoor dat:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel63
  - number: 63.a
    text: |-
      personen die een opleiding volgen op het gebied van stralingstoepassingen en stralingsbescherming participeren in
      onderdelen van praktische aspecten ervan;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel63
  - number: 63.b
    text: |-
      indien de hiervoor genoemde participatie plaatsvindt onder verantwoordelijkheid van een arts, dit een arts is als
      bedoeld in [artikel 54][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel54
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '54'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 63.c
    text: |-
      voorafgaand aan de onder a genoemde participatie, schriftelijke instructies worden gegeven aan degene die de
      opleiding volgt, over de aard en de omvang van de deelname aan de praktische aspecten.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel63
  - number: '64.1'
    text: |-
      De ondernemer zorgt ervoor dat de toe te dienen activiteit bij nucleair geneeskundig onderzoek en therapie wordt
      gemeten met een dosiskalibrator.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel64
  - number: '64.2'
    text: Onze Minister kan normen aanwijzen voor de nauwkeurigheid van de in het eerste lid bedoelde kalibrator.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel64
  - number: '65'
    text: |-
      De ondernemer zorgt ervoor dat voor elke standaard radiologische verrichting voor elke apparatuuropstelling
      schriftelijke protocollen worden opgesteld.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel65
  - number: '66'
    text: 'De ondernemer zorgt ervoor dat:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel66
  - number: 66.a
    text: bij radiotherapeutische verrichtingen een klinisch fysicus nauw wordt betrokken;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel66
  - number: 66.b
    text: |-
      bij standaard therapeutisch nucleairgeneeskundige verrichtingen en bij de diagnostische nucleairgeneeskundige
      verrichtingen een klinisch fysicus beschikbaar is;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel66
  - number: 66.c
    text: |-
      bij de overige radiologische verrichtingen een klinisch fysicus bereikbaar is voor advies over
      stralingsbeschermingsaspecten bij radiologische verrichtingen.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel66
  - number: '67.1'
    text: |-
      De ondernemer zorgt ervoor dat de radiologische apparatuur die wordt gebruikt bij radiologische verrichtingen op
      een verantwoorde wijze wordt gebruikt. Onze Minister kan daartoe regels stellen.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel67
  - number: '67.2'
    text: 'De ondernemer zorgt ervoor dat op alle radiologische apparatuur die in gebruik is:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel67
  - number: 67.2.a
    text: streng toezicht wordt uitgeoefend inzake de stralingsbescherming;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel67
  - number: 67.2.b
    text: programma's voor kwaliteitsborging worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel67
  - number: 67.2.c
    text: |-
      noodzakelijke maatregelen worden genomen om inadequate of defecte onderdelen van radiologische apparatuur te
      repareren of te vervangen.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel67
  - number: '68'
    text: 'De ondernemer zorgt ervoor dat:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel68
  - number: 68.a
    text: |-
      indien nieuwe apparatuur in gebruik wordt genomen, deze, indien uitvoerbaar, een voorziening heeft die de
      stralingsdosis tijdens een radiologische verrichting aangeeft;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel68
  - number: 68.b
    text: |-
      bij een röntgentoestel waarmee radiodiagnostische verrichtingen worden toegepast, een filter wordt gebruikt
      teneinde de stralingsbelasting van de patiënt te beperken;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel68
  - number: 68.c
    text: |-
      een röntgentoestel beschikt over een vaste of automatische diafragma-instelling zodat de randen van de
      röntgenbundel zichtbaar zijn op de beelddrager, tenzij het mammografisch of tandheelkundig onderzoek betreft;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel68
  - number: 68.d
    text: |-
      een röntgentoestel waarmee radiodiagnostische verrichtingen worden toegepast is voorzien van een diafragma of tubus
      met het doel de röntgenbundel te beperken tot het juiste gebied;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel68
  - number: 68.e
    text: het diafragma een middel bevat om afmetingen van de bundel vooraf te kunnen aangeven.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel68
  - number: '69'
    text: 'De ondernemer zorgt ervoor dat:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel69
  - number: 69.a
    text: |-
      bij het onderzoeken met gebruikmaking van fluoroscopie een beeldversterker of gelijkwaardige techniek wordt
      gebruikt;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel69
  - number: 69.b
    text: |-
      fluoroscopische onderzoeken zonder voorzieningen voor de regeling van het dosistempo beperkt blijven tot de
      gevallen die de omstandigheden rechtvaardigen;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel69
  - number: 69.c
    text: toestellen, geschikt voor doorlichting, na elke vijf minuten cumulatief doorlichten een akoestisch signaal geven.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel69
  - number: '70'
    text: |-
      De ondernemer zorgt ervoor dat passende radiologische apparatuur, technieken en randapparatuur worden gebruikt voor
      radiologische verrichtingen bij:
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel70
  - number: 70.a
    text: kinderen;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel70
  - number: 70.b
    text: bevolkingsonderzoek;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel70
  - number: 70.c
    text: toediening aan de patiënt van een hoge dosis ioniserende straling.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel70
  - number: '71'
    text: |-
      De verwijzende en de behandelend arts informeren bij een vrouw of er sprake is van zwangerschap en of er
      borstvoeding wordt gegeven, voordat een radiologische verrichting wordt uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel71
  - number: '72'
    text: |-
      Als zwangerschap niet kan worden uitgesloten of als een vrouw borstvoeding geeft, wordt, afhankelijk van het type
      blootstelling, speciale aandacht besteed aan:
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel72
  - number: 72.a
    text: de rechtvaardiging van de blootstelling, met name in verband met de urgentie;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel72
  - number: 72.b
    text: |-
      de optimalisatie van de stralingsbescherming, waarbij rekening wordt gehouden met de patiëntdosis voor zowel de
      vrouw als ook voor het ongeboren kind.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel72
  - number: '73.1'
    text: |-
      De ondernemer zorgt er voor dat zowel de kans op alsmede de gevolgen van een ongeval of een onbedoelde dosis van
      een radiologische verrichting zo klein als redelijkerwijs mogelijk zijn.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel73
  - number: '73.2'
    text: |-
      De ondernemer zorgt er voor dat ter beperking van risico's als bedoeld in het eerste lid, bij de apparatuur
      schriftelijke instructies en protocollen aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel73
  - number: '74.1'
    text: |-
      De ondernemer verstrekt aan Onze Minister gegevens die nodig zijn om het gemiddelde en de spreiding van
      de effectieve of equivalente dosis bij radiologische verrichtingen voor de bevolking en andere relevante
      referentiegroepen te kunnen schatten.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel74
  - number: '74.2'
    text: Onze Minister stelt regels ten aanzien van de verstrekking van de in het eerste lid bedoelde gegevens.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel74
  - number: '75'
    text: Onze Minister kan regels stellen om onnodige verspreiding van radiologische apparatuur te voorkomen.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel75
  - number: '76.1'
    text: |-
      De ondernemer zorgt ervoor dat voor werknemers ten gevolge van handelingen die onder zijn verantwoordelijkheid
      worden verricht, de volgende doses niet worden overschreden:
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel76
  - number: 76.1.a
    text: 'een effectieve dosis van 1 mSv in een kalenderjaar, en met inachtneming daarvan:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel76
  - number: 76.1.b
    text: 'een equivalente dosis van:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel76
  - number: 76.1.b.1°
    text: 15 mSv in een kalenderjaar voor de ooglens, of
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel76
  - number: 76.1.b.2°
    text: 50 mSv in een kalenderjaar voor de huid, gemiddeld over enig blootgesteld huidoppervlak van 1 cm2.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel76
  - number: '76.2'
    text: In het geval van inwendige besmetting wordt de effectieve volgdosis toegewezen aan het jaar van inname.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel76
  - number: '77.1'
    text: |-
      De ondernemer zorgt ervoor dat voor blootgestelde werknemers ten gevolge van handelingen die onder zijn
      verantwoordelijkheid worden verricht, de volgende doses niet worden overschreden:
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel77
  - number: 77.1.a
    text: 'een effectieve dosis van 20 mSv in een kalenderjaar, en met inachtneming daarvan:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel77
  - number: 77.1.b
    text: 'een equivalente dosis van:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel77
  - number: 77.1.b.1°
    text: 150 mSv in een kalenderjaar voor de ooglens,
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel77
  - number: 77.1.b.2°
    text: 500 mSv in een kalenderjaar voor de huid, gemiddeld over enig blootgesteld huidoppervlak van 1 cm2, of
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel77
  - number: 77.1.b.3°
    text: 500 mSv in een kalenderjaar voor handen, onderarmen, voeten en enkels.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel77
  - number: '77.2'
    text: In het geval van inwendige besmetting wordt de effectieve volgdosis toegewezen aan het jaar van inname.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel77
  - number: '78.1'
    text: |-
      De ondernemer zorgt ervoor dat werknemers die jonger zijn dan 18 jaar geen werk krijgen toegewezen of verrichten,
      waardoor zij als blootgestelde werknemer worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel78
  - number: '78.2'
    text: |-
      Het eerste lid geldt niet indien deze werknemers ouder zijn dan 15 jaar en uit hoofde van hun opleiding verplicht
      zijn handelingen te verrichten en daarbij een blootstelling ondergaan die hoger is dan een der in artikel 76
      genoemde dosislimieten.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel78
  - number: '78.3'
    text: |-
      De ondernemer zorgt ervoor dat voor de in het tweede lid bedoelde personen ten gevolge van handelingen die onder
      zijn verantwoordelijkheid worden verricht, de volgende individuele doses niet worden overschreden:
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel78
  - number: 78.3.a
    text: 'een effectieve dosis van 6 mSv per kalenderjaar, en met inachtneming daarvan:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel78
  - number: 78.3.b
    text: 'een equivalente dosis van:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel78
  - number: 78.3.b.1°
    text: 50 mSv in een kalenderjaar voor de ooglens;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel78
  - number: 78.3.b.2°
    text: 150 mSv in een kalenderjaar voor de huid, gemiddeld over enig blootgesteld huidoppervlak van 1 cm2, of
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel78
  - number: 78.3.b.3°
    text: 150 mSv in een kalenderjaar voor handen, onderarmen, voeten en enkels.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel78
  - number: '79.1'
    text: |-
      De ondernemer deelt ten behoeve van de individuele monitoring en het toezicht blootgestelde werknemers in als A- of
      B-werknemer.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel79
  - number: '79.2'
    text: |-
      Een A-werknemer is een blootgestelde werknemer, die een effectieve dosis kan ontvangen die groter is dan 6 mSv
      in een kalenderjaar, of een equivalente dosis die groter is dan drie tiende van de in [artikel 77][ref1] genoemde
      dosislimieten.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel77
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '77'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '80.1'
    text: |-
      De ondernemer zorgt ervoor dat de arbeidsomstandigheden voor de zwangere werknemer zodanig zijn dat de equivalente
      dosis ten gevolge van het werk voor het ongeboren kind zo laag is als redelijkerwijs mogelijk is en dat het
      onwaarschijnlijk is dat deze dosis vanaf het moment van melding van de zwangerschap aan de ondernemer tot aan het
      einde van de zwangerschap 1 mSv zal overschrijden.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel80
  - number: '80.2'
    text: |-
      De ondernemer zorgt ervoor dat een werknemer, indien zij borstvoeding geeft, gedurende de periode dat zij
      borstvoeding geeft, vrij van handelingen wordt gesteld waarbij een meer dan gering risico bestaat op radioactieve
      besmetting van het lichaam.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel80
  - number: '81.1'
    text: |-
      In uitzonderlijke omstandigheden, met uitzondering van radiologische noodsituaties, kan de bedrijfstakdirecteur,
      of bij mijnbouw, de Inspecteur-Generaal der Mijnen, op verzoek van de ondernemer ontheffing van de in
      [artikel 77][ref1] genoemde dosislimieten verlenen, mits


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel77
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '77'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 81.1.a
    text: het een A-werknemer betreft;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel81
  - number: 81.1.b
    text: de blootstelling geschiedt op basis van vrijwilligheid;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel81
  - number: 81.1.c
    text: de blootstelling beperkt is in tijd;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel81
  - number: 81.1.d
    text: de blootstelling alleen in nader vast te stellen ruimten plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel81
  - number: 81.1.e
    text: |-
      de mogelijk te ontvangen effectieve of equivalente dosis niet hoger is dan vijfmaal de in
      [artikel 77, eerste lid, onder a][ref1], respectievelijk tweemaal de in [artikel 77, eerste lid, onder b][ref2],
      vermelde waarden;


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel77
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel77
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '77'
        hoofdstuk: '7'
        paragraaf: '7.1'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '77'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 81.1.f
    text: het geen blootgestelde leerling of studerende, of zwangere vrouw betreft;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel81
  - number: 81.1.g
    text: het geen vrouw betreft die borstvoeding geeft terwijl er kans bestaat op besmetting van het lichaam;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel81
  - number: 81.1.h
    text: |-
      de blootstelling van te voren door de ondernemer wordt gemotiveerd en de blootstelling en de risico's
      van te voren door de ondernemer worden besproken met de betrokken werknemers, de ondernemingsraad of
      personeelsvertegenwoordiging, de stralingsarts en de deskundige, en
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel81
  - number: 81.1.i
    text: |-
      de betrokken werknemers tevoren door de ondernemer worden geïnformeerd over de tijdens de handelingen te nemen
      voorzorgsmaatregelen.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel81
  - number: '81.2'
    text: |-
      In de situatie, bedoeld in het eerste lid, rapporteert de ondernemer na afloop aan de bedrijfstakdirecteur, of bij
      mijnbouw aan de Inspecteur-Generaal der Mijnen, over de uitgevoerde handelingen, de wijze waarop bescherming tegen
      ioniserende straling is uitgevoerd en de door de werknemer ontvangen effectieve of equivalente dosis.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel81
  - number: '81.3'
    text: |-
      De ondernemer verstrekt de uitslag van de in het tweede lid berekende of bepaalde dosis aan de in
      [artikel 91, tweede lid][ref1], bedoelde instelling en aan de betrokken werknemer.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel91
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '91'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: '82.1'
    text: |-
      De ondernemer zorgt ervoor dat een persoon voor wie een ontheffing, als bedoeld in [artikel 81][ref1], is
      verleend indien ten gevolge van de in dat artikel bedoelde blootstelling een van de in [artikel 77][ref2] genoemde
      dosislimieten is overschreden, niet eerder weer aan ioniserende straling ten gevolge van handelingen die onder
      zijn verantwoordelijkheid worden verricht wordt blootgesteld, dan nadat door een stralingsarts is verklaard dat
      daartegen geen bezwaar bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel77
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '81'
        hoofdstuk: '7'
        paragraaf: '7.1'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '77'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '82.2'
    text: |-
      Tenzij de stralingsarts hiertoe adviseert, wordt de werknemer niet vanwege de in het eerste lid bedoelde
      overschrijding van de dosislimieten zonder diens toestemming van zijn normale beroepsbezigheden uitgesloten of op
      een andere plaats te werk gesteld.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel82
  - number: '83.1'
    text: 'De ondernemer zorgt ervoor dat, indien dat nodig is met het oog op de bescherming tegen ioniserende straling:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel83
  - number: 83.1.a
    text: 'een ruimte wordt aangemerkt als gecontroleerde zone, indien:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel83
  - number: 83.1.a.1°
    text: |-
      de mogelijk door een werknemer te ontvangen dosis gelijk is aan een effectieve dosis die hoger is dan 6
      mSv in een kalenderjaar of een equivalente dosis die hoger is dan drie tiende van de dosis, genoemd in
      [artikel 77, eerste lid, onder b][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel77
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '77'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 83.1.a.2°
    text: |-
      er een mogelijkheid is van verspreiding van radioactieve stoffen vanuit de ruimte zodanig dat personen een dosis
      hoger dan een effectieve of equivalente dosis, genoemd in [artikel 76][ref1], kunnen ontvangen;


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel76
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '76'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 83.1.b
    text: |-
      een ruimte wordt aangemerkt als bewaakte zone, indien de mogelijk door een werknemer te ontvangen effectieve dosis
      hoger is dan 1 mSv in een kalenderjaar en lager dan 6 mSv in een kalenderjaar of de equivalente dosis hoger is dan
      die genoemd in [artikel 76, onder b][ref1], en lager dan die genoemd onder a, ten eerste.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel76
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '76'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '83.2'
    text: |-
      De ondernemer houdt in een gecontroleerde en in een bewaakte zone passend toezicht op de arbeidsomstandigheden met
      het oog op de bescherming tegen ioniserende straling.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel83
  - number: '83.3'
    text: |-
      De ondernemer zorgt ervoor dat de omvang en de kwaliteit van de maatregelen ten behoeve van de bescherming tegen
      ioniserende straling zijn afgestemd op de risico's die aan de bronnen en de betrokken handelingen verbonden zijn.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel83
  - number: '84.1'
    text: 'Met betrekking tot een gecontroleerde zone zorgt de ondernemer ervoor dat:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel84
  - number: 84.1.a
    text: |-
      de zone is afgebakend en de toegang ertoe beperkt blijft tot door hem daartoe aangewezen personen en dat de zone
      wordt gecontroleerd overeenkomstig de door hem daartoe vastgestelde procedures;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel84
  - number: 84.1.b
    text: |-
      maatregelen zijn getroffen voor die gevallen waarin een aanzienlijk risico van verspreiding van radioactieve
      stoffen bestaat; deze maatregelen betreffen ook de toegang tot en het verlaten van de zone door personen en
      goederen;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel84
  - number: 84.1.c
    text: |-
      met inachtneming van de aard van de aanwezige bronnen en betrokken handelingen er een systeem van monitoring van de
      werkplek is;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel84
  - number: 84.1.d
    text: |-
      op de daarvoor geschikte plaatsen duidelijke waarschuwingsborden en -tekens met betrekking tot de zone en de
      risico's van ioniserende straling zijn aangebracht;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel84
  - number: 84.1.e
    text: |-
      aan personen die in de zone werkzaam zijn schriftelijke werkinstructies zijn gegeven, toegesneden op de risico's
      van ioniserende straling die aan de binnen de zone aanwezige bronnen en de aldaar te verrichten handelingen
      verbonden zijn.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel84
  - number: '84.2'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot een gecontroleerde zone als
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel84
  - number: '85.1'
    text: 'Met betrekking tot een bewaakte zone zorgt de ondernemer ervoor dat:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel85
  - number: 85.1.a
    text: |-
      met inachtneming van de aard van de aanwezige bronnen en betrokken handelingen er een systeem van monitoring van de
      werkplek is;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel85
  - number: 85.1.b
    text: |-
      op de daarvoor geschikte plaatsen duidelijke waarschuwingsborden en -tekens en opschriften met betrekking tot de
      zone en de risico's van ioniserende straling zijn aangebracht;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel85
  - number: 85.1.c
    text: |-
      aan personen die in de zone werkzaam zijn schriftelijke werkinstructies zijn gegeven, toegesneden op de risico's
      van ioniserende straling die aan de bronnen en de betrokken handelingen verbonden zijn.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel85
  - number: '85.2'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot een bewaakte zone als bedoeld in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel85
  - number: '86'
    text: |-
      Ten behoeve van de uitvoering van de [artikelen 84][ref1] en [85][ref2] verricht de ondernemer, indien van
      toepassing, metingen binnen de bewaakte en gecontroleerde zone van:


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel84
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel85
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '84'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '85'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: 86.a
    text: de dosistempi, met opgave van de aard en de kwaliteit van de desbetreffende straling, of
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel86
  - number: 86.b
    text: |-
      bij de aanwezigheid van open bronnen, de activiteitsconcentratie in de lucht en de oppervlaktebesmetting met opgave
      van de aard en de fysische en chemische toestand en vorm ervan.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel86
  - number: '87.1'
    text: |-
      De ondernemer stelt aan een blootgestelde werknemer een passend, persoonlijk dosiscontrolemiddel ter beschikking,
      die door de ondernemer wordt betrokken van een dosimetrische dienst als bedoeld in [artikel 8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel8
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '87.2'
    text: |-
      De ondernemer zorgt ervoor dat de persoonlijke dosiscontrolemiddelen door de blootgestelde werknemer
      gedurende de tijden van mogelijke blootstelling op de juiste plaats of plaatsen worden gedragen en dat deze
      dosiscontrolemiddelen periodiek ter uitlezing aan de, in het eerste lid bedoelde, dosimetrische dienst worden
      gezonden.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel87
  - number: '87.3'
    text: |-
      De ondernemer zorgt ervoor dat de dosimetrische dienst periodiek, met behulp van de met deze dosiscontrolemiddelen
      verkregen gegevens, bepaalt in welke mate deze personen aan ioniserende straling blootgesteld zijn geweest.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel87
  - number: '87.4'
    text: |-
      De ondernemer zorgt ervoor dat voor gevallen waarin blootgestelde werknemers onder voor de werksituatie normale
      condities een relevante inwendige besmetting kunnen ontvangen, er een passend systeem voor de dosiscontrole is.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel87
  - number: '87.5'
    text: |-
      De ondernemer doet bij overbestraling van een werknemer onmiddellijk mededeling aan de bedrijfstakdirecteur en,
      indien het mijnbouw betreft, de Inspecteur-Generaal der Mijnen.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel87
  - number: '87.6'
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid kan nadere regels stellen met betrekking tot het bepaalde in
      dit artikel.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel87
  - number: '88.1'
    text: |-
      De bedrijfstakdirecteur of, bij mijnbouw, de Inspecteur-Generaal der Mijnen, of, indien het de krijgsmacht
      betreft een door Onze Minister van Defensie aan te wijzen autoriteit, kan, indien het meten van blootstelling aan
      ioniserende straling aan de hand van persoonlijke controlemiddelen niet of niet goed mogelijk is, of als op andere
      wijze de effectieve of equivalente dosis wordt bepaald, ontheffing verlenen van het bepaalde in [artikel 87][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel87
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '87'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: '88.2'
    text: |-
      Aan de ontheffing, bedoeld in het eerste lid, worden voorschriften verbonden die inhouden dat de effectieve of
      equivalente dosis geschat wordt aan de hand van de individuele metingen bij andere blootgestelde werknemers, of
      aan de hand van de in [artikel 86][ref1] bedoelde ruimtemonitoring, of in het geval van vliegtuigbemanningen op een
      wijze als bedoeld in [artikel 111, eerste lid, onder b][ref2], of op andere wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel86
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel111
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '86'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '111'
        hoofdstuk: '8'
        paragraaf: '8.3'
  - number: '89.1'
    text: |-
      Indien een werknemer bij een ongeval aan ioniserende straling in het kader van een handeling is of kan zijn
      blootgesteld, zorgt de ondernemer ervoor dat de effectieve of equivalente doses worden bepaald, die door de
      betrokken werknemer zijn ontvangen.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel89
  - number: '89.2'
    text: |-
      Indien een werknemer bij een radiologische noodsituatie aan ioniserende straling is of kan zijn blootgesteld,
      zorgt de ondernemer die voor de handeling die de radiologische noodsituatie heeft veroorzaakt verantwoordelijk is,
      ervoor dat individuele monitoring wordt uitgevoerd of dat de effectieve of equivalente doses die door de betrokken
      werknemer zijn ontvangen, op een andere wijze worden bepaald.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel89
  - number: '90'
    text: 'De ondernemer zorgt ervoor dat afzonderlijk van iedere blootgestelde werknemer wordt geregistreerd:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel90
  - number: 90.a
    text: de naam, de geboortedatum en het geslacht;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel90
  - number: 90.b
    text: indeling in categorie A- of B- werknemer;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel90
  - number: 90.c
    text: |-
      de gemeten of bepaalde doses op grond van de [artikelen 87 tot en met 89][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel87
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '87'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: 90.d
    text: de resultaten van de ruimtemonitoring die zijn gebruikt bij de berekening van de effectieve of equivalente doses;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel90
  - number: 90.e
    text: |-
      in het geval van de in de [artikelen 81][ref1] en [89][ref2] bedoelde blootstelling, de rapporten met betrekking
      tot de omstandigheden en de genomen maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel89
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '81'
        hoofdstuk: '7'
        paragraaf: '7.1'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '89'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: '91.1'
    text: |-
      Er is een dosisregistratiesysteem voor het bewaren van de uitslagen van de gemeten of bepaalde doses, bedoeld in de
      [artikelen 87][ref1], [88][ref2] en [89][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel87
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel88
      [ref3]: https://wetten.overheid.nl/BWBR0012702#Artikel89
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '87'
        hoofdstuk: '7'
        paragraaf: '7.3'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '88'
        hoofdstuk: '7'
        paragraaf: '7.3'
      - id: ref3
        bwb_id: BWBR0012702
        artikel: '89'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: '91.2'
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid wijst een instelling aan die belast is met het beheer van het in
      het eerste lid bedoelde systeem en kan nadere regels stellen met betrekking tot de inrichting van het systeem.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel91
  - number: '91.3'
    text: |-
      De in het tweede lid bedoelde instelling bewaart de geregistreerde gegevens in ieder geval totdat de persoon op
      wie de gegevens betrekking hebben de leeftijd van vijfenzeventig jaar heeft bereikt of zou hebben bereikt, maar ten
      minste dertig jaar nadat deze persoon de handelingen heeft beëindigd.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel91
  - number: '91.4'
    text: |-
      Bij de verwerking van persoonsgegevens in het systeem, bedoeld in het eerste lid, kan de in
      het tweede lid bedoelde instelling gebruik maken van het sociaal-fiscaalnummer, bedoeld in
      [artikel 2, derde lid, onderdeel j, van de Algemene wet inzake rijksbelastingen][ref1] met het oog op de
      vaststelling van de identiteit van de persoon, bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel2
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '2'
  - number: '91.5'
    text: |-
      Bij regeling van Onze Minister van Sociale Zaken en Werkgelegenheid kunnen nadere regels worden gesteld voor de
      toegankelijkheid en het beheer van het registratiesysteem.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel91
  - number: '92.1'
    text: |-
      De ondernemer zorgt ervoor dat de uitslag van de individuele monitoring, bedoeld in de [artikelen 87][ref1],
      [88][ref2] en [89][ref3], onverwijld aan de in [artikel 91][ref4] bedoelde instelling wordt gezonden. De ondernemer
      geeft daarbij aan waar de individuele dosismeter is gedragen of op welke wijze de inwendige besmetting is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel87
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel88
      [ref3]: https://wetten.overheid.nl/BWBR0012702#Artikel89
      [ref4]: https://wetten.overheid.nl/BWBR0012702#Artikel91
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '87'
        hoofdstuk: '7'
        paragraaf: '7.3'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '88'
        hoofdstuk: '7'
        paragraaf: '7.3'
      - id: ref3
        bwb_id: BWBR0012702
        artikel: '89'
        hoofdstuk: '7'
        paragraaf: '7.3'
      - id: ref4
        bwb_id: BWBR0012702
        artikel: '91'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: '92.2'
    text: De werknemer heeft inzage in de gegevens die zijn blootstelling betreffen.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel92
  - number: '93.1'
    text: |-
      De ondernemer zorgt ervoor dat de uitslag van de individuele monitoring, bedoeld in de [artikelen 87][ref1],
      [88][ref2] en [89][ref3], wordt verstrekt aan:


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel87
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel88
      [ref3]: https://wetten.overheid.nl/BWBR0012702#Artikel89
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '87'
        hoofdstuk: '7'
        paragraaf: '7.3'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '88'
        hoofdstuk: '7'
        paragraaf: '7.3'
      - id: ref3
        bwb_id: BWBR0012702
        artikel: '89'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: 93.1.a
    text: |-
      de persoon als bedoeld in [artikel 14, eerste lid, van de Arbeidsomstandighedenwet 1998][ref1] die belast is met de
      taken, bedoeld in [artikel 14, eerste lid, onderdelen b of c, van die wet][ref2] of de arbodienst;


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel14
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '14'
  - number: 93.1.b
    text: de betrokken werknemer;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel93
  - number: 93.1.c
    text: de deskundige;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel93
  - number: 93.1.d
    text: indien het een A-werknemer betreft, de stralingsarts.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel93
  - number: '93.2'
    text: |-
      De ondernemer meldt de uitslag van de individuele monitoring, bedoeld in [artikel 89][ref1], onverwijld aan de
      in het eerste lid bedoelde personen of dienst en aan de bedrijfstakdirecteur of, indien het mijnbouw betreft, de
      Inspecteur-Generaal der Mijnen in wiens werkgebied het ongeval of de noodsituatie is opgetreden.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel89
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '89'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: '94.1'
    text: |-
      Het is de ondernemer van een in Nederland gevestigde onderneming verboden een werknemer, die niet in het bezit is
      van een geldig stralingspaspoort en een persoonlijk controlemiddel, in een andere lidstaat van de Europese Unie
      handelingen als A-werknemer te laten verrichten.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel94
  - number: '94.2'
    text: |-
      Het stralingspaspoort wordt op aanvraag door Onze Minister van Sociale Zaken en Werkgelegenheid, of een door hem
      daartoe aangewezen instelling, afgegeven aan een ondernemer ten behoeve van diens werknemer.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel94
  - number: '94.3'
    text: |-
      Bij terugkeer van de werknemer in Nederland meldt de ondernemer onverwijld de gegevens uit het stralingspaspoort
      aan de in [artikel 91][ref1] bedoelde instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel91
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '91'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: '94.4'
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid kan met betrekking tot het bepaalde in dit artikel nadere regels
      stellen die onder meer betrekking hebben op het model van het stralingspaspoort en op de aanvraag, de kosten, het
      verlies of het in het ongerede raken van het stralingspaspoort.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel94
  - number: '95.1'
    text: |-
      Het is de ondernemer verboden om een externe werknemer onder zijn verantwoordelijkheid in Nederland of op
      het Nederlands continentaal plat te laten werken, indien deze werknemer niet in het bezit is van een geldig
      stralingspaspoort, verstrekt door een overheidsinstantie van de lidstaat van de ondernemer van de externe werknemer
      in wiens opdracht de externe werknemer handelingen verricht.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel95
  - number: '95.2'
    text: |-
      De ondernemer registreert de uitslag van de individuele monitoring, bedoeld in de [artikelen 81][ref1], [87][ref2],
      [88][ref3] en [89][ref4], onverwijld na beëindiging van de handelingen of werkzaamheden in het stralingspaspoort.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel87
      [ref3]: https://wetten.overheid.nl/BWBR0012702#Artikel88
      [ref4]: https://wetten.overheid.nl/BWBR0012702#Artikel89
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '81'
        hoofdstuk: '7'
        paragraaf: '7.1'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '87'
        hoofdstuk: '7'
        paragraaf: '7.3'
      - id: ref3
        bwb_id: BWBR0012702
        artikel: '88'
        hoofdstuk: '7'
        paragraaf: '7.3'
      - id: ref4
        bwb_id: BWBR0012702
        artikel: '89'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: '96.1'
    text: De ondernemer zorgt ervoor dat een stralingsarts het medisch toezicht op A-werknemers uitoefent.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel96
  - number: '96.2'
    text: |-
      De ondernemer zorgt er voor dat aan de stralingsarts alle tot zijn beschikking staande gegevens worden verstrekt
      die deze nodig heeft om inzicht te krijgen in de gezondheidstoestand van de onder zijn toezicht staande personen en
      om zich een oordeel te vormen over de omstandigheden op de arbeidsplaats voor zover deze van invloed kunnen zijn op
      hun gezondheidstoestand.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel96
  - number: '96.3'
    text: 'Het in het eerste lid bedoelde medisch toezicht omvat:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel96
  - number: 96.3.a
    text: |-
      een medisch onderzoek dat plaatsvindt voor de aanwijzing als A-werknemer en ten doel heeft na te gaan of de
      werknemer geschikt is voor zijn functie;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel96
  - number: 96.3.b
    text: |-
      periodieke keuringen waarbij ten minste eenmaal per jaar wordt nagegaan of de A-werknemer nog geschikt is voor het
      uitvoeren van zijn functie;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel96
  - number: 96.3.c
    text: |-
      onderzoek van personen die niet langer werkzaam zijn als A-werknemer, indien en zolang de stralingsarts dit
      noodzakelijk acht.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel96
  - number: '96.4'
    text: |-
      Indien de stralingsarts dat noodzakelijk acht, wordt een medisch onderzoek gevolgd door maatregelen van de
      ondernemer in verband met de bescherming van de gezondheid van de werknemer.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel96
  - number: '97.1'
    text: |-
      De ondernemer zorgt ervoor dat een stralingsarts met betrekking tot de geschiktheid van A-werknemers voor de
      aanwijzing als A-werknemer op basis van het medisch onderzoek de volgende indeling toepast:
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel97
  - number: 97.1.a
    text: geschikt;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel97
  - number: 97.1.b
    text: onder bepaalde omstandigheden geschikt, of
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel97
  - number: 97.1.c
    text: ongeschikt.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel97
  - number: '97.2'
    text: |-
      De stralingsarts deelt de indeling van de geschiktheid, bedoeld in het eerste lid, onverwijld schriftelijk mee aan
      degene die het onderzoek heeft ondergaan.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel97
  - number: '97.3'
    text: |-
      Degene die het onderzoek heeft ondergaan kan binnen zes weken na de ontvangst van de mededeling bedoeld in
      het tweede lid een nieuw onderzoek verzoeken aan Onze Minister van Sociale Zaken en Werkgelegenheid, of bij
      mijnbouw aan Onze Minister van Economische Zaken. De betrokken minister deelt de uitslag van het nieuwe onderzoek
      schriftelijk mee aan de onderzochte persoon, aan de stralingsarts en aan de ondernemer.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel97
  - number: '98'
    text: |-
      Een werknemer wordt niet in een specifieke functie als A-werknemer tewerkgesteld indien hij blijkens de uitslag van
      het in [artikel 97, eerste lid][ref1], bedoelde medisch onderzoek ongeschikt is voor deze functie.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel97
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '97'
        hoofdstuk: '7'
        paragraaf: '7.5'
  - number: '99'
    text: |-
      Een medisch onderzoek door een stralingsarts vindt voorts plaats indien daartoe door een blootstelling waarbij
      dosislimieten zijn overschreden of door een blootstelling door een ongeval of een radiologische noodsituatie
      aanleiding bestaat.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel99
  - number: '100.1'
    text: |-
      De ondernemer zorgt ervoor dat er een medisch dossier wordt bijgehouden waarin van elke A-werknemer ten minste
      wordt geregistreerd:
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel100
  - number: 100.1.a
    text: de aard van het werk;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel100
  - number: 100.1.b
    text: |-
      de uitslagen van de onderzoeken, bedoeld in de [artikelen 96][ref1] en [97][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel96
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel97
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '96'
        hoofdstuk: '7'
        paragraaf: '7.5'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '97'
        hoofdstuk: '7'
        paragraaf: '7.5'
  - number: 100.1.c
    text: |-
      de resultaten van de individuele monitoring, bedoeld in [artikel 95, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel95
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '95'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: 100.1.d
    text: indien van toepassing de gegevens met betrekking tot een radiologische noodsituatie.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel100
  - number: '100.2'
    text: |-
      De ondernemer zorgt ervoor dat het medisch dossier, bedoeld in het eerste lid, in ieder geval wordt bewaard totdat
      de persoon op wie de gegevens betrekking hebben de leeftijd van vijfenzeventig jaar heeft bereikt of zou hebben
      bereikt, maar ten minste dertig jaar nadat deze persoon de handelingen heeft beëindigd.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel100
  - number: '101'
    text: |-
      Met betrekking tot werkzaamheden zijn de bepalingen van dit besluit die betrekking hebben op handelingen met
      radioactieve stoffen, met uitzondering van de [artikelen 27 tot en met 34][ref1] en [hoofdstuk 6][ref2], van
      overeenkomstige toepassing, voor zover daarvan in dit hoofdstuk niet wordt afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '27'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0012702
        hoofdstuk: '6'
  - number: '102.1'
    text: |-
      Onze Ministers maken in de Staatscourant een lijst van werkzaamheden bekend, waarvan het mogelijk is dat bij het
      verrichten van die werkzaamheden de in [bijlage 1, tabel 1 en 2][ref1], vermelde waarden worden overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0012702
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0012702
  - number: '102.2'
    text: |-
      Voordat een ondernemer een werkzaamheid gaat verrichten die op de in het eerste lid bedoelde lijst staat vermeld,
      gaat hij na of deze werkzaamheid overeenkomstig [artikel 103][ref1] moet worden gemeld dan wel dat daarvoor
      overeenkomstig de [artikelen 107][ref2] en [108][ref3] een vergunning is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel103
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel107
      [ref3]: https://wetten.overheid.nl/BWBR0012702#Artikel108
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '103'
        hoofdstuk: '8'
        paragraaf: '8.2'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '107'
        hoofdstuk: '8'
        paragraaf: '8.2'
      - id: ref3
        bwb_id: BWBR0012702
        artikel: '108'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: '103.1'
    text: |-
      De ondernemer meldt een werkzaamheid, niet zijnde een lozing, voordat met de uitvoering daarvan wordt begonnen,
      overeenkomstig artikel 40.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel103
  - number: '103.2'
    text: 'Deze verplichting geldt niet, indien binnen een locatie:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel103
  - number: 103.2.a
    text: 'het een werkzaamheid betreft waarbij:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel103
  - number: 103.2.a.1°
    text: |-
      de activiteit van de radionucliden in de betrokken natuurlijke bronnen steeds lager is dan de in bijlage 1, tabel
      1, vermelde waarde, of
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel103
  - number: 103.2.a.2°
    text: |-
      de activiteitsconcentratie van de betrokken natuurlijke bronnen lager is dan de in bijlage 1, tabel 1, vermelde
      waarde;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel103
  - number: 103.2.b
    text: het een werkzaamheid betreft waarvoor ingevolge artikel 107 een vergunning is vereist.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel103
  - number: '103.3'
    text: Artikel 25, derde, vierde, zesde, zevende en achtste lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel103
  - number: '103.4'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat in daarbij aangegeven gevallen met het oog op de
      stralingsbescherming het tweede lid niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel103
  - number: '103.5'
    text: |-
      De in het eerste lid gestelde verplichting geldt niet voor werkzaamheden met natuurlijke bronnen indien de aanvraag
      om een vergunning als bedoeld in dit besluit gegevens als bedoeld in artikel 105 omtrent deze bronnen bevat.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel103
  - number: '103.6'
    text: |-
      Bij ministeriële regeling kan worden bepaald in welke gevallen vrijstelling geldt van de in het eerste lid gestelde
      verplichting met betrekking tot daarbij aangewezen werkzaamheden, indien een zodanige werkzaamheid al is gemeld
      door een andere ondernemer en aan bij de regeling gestelde regels is voldaan.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel103
  - number: '104'
    text: |-
      Indien een werkzaamheid, die overeenkomstig artikel 103 is gemeld, niet meer wordt verricht, meldt de ondernemer
      dit binnen vier weken na het beëindigen van de werkzaamheid overeenkomstig artikel 40.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel104
  - number: '105.1'
    text: 'De melding, bedoeld in artikel 103, bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel105
  - number: 105.1.a
    text: de naam en het adres van degene die de melding ondertekent;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel105
  - number: 105.1.b
    text: de naam en het adres van de ondernemer;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel105
  - number: 105.1.c
    text: het adres of de kadastrale gegevens van de locatie;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel105
  - number: 105.1.d
    text: een omschrijving van de werkzaamheid, de plaats van de werkzaamheid en van het doel;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel105
  - number: 105.1.e
    text: |-
      bij product- of materiaalhergebruik of bestemming als afval de eindbestemming van het materiaal en een schatting
      van de effectieve doses in een kalenderjaar, die personen ten gevolge van die eindbestemming en van het
      verwerkingspad kunnen ontvangen;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel105
  - number: 105.1.f
    text: een opgave van de betrokken natuurlijke bronnen en de daarin voorkomende radionucliden.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel105
  - number: '105.2'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de gegevens die een melding bevat
      en tot de situaties waarin een nieuwe melding is vereist.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel105
  - number: '106.1'
    text: 'De melding van een werkzaamheid, bedoeld in artikel 104, bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel106
  - number: 106.1.a
    text: de naam en het adres van degene die de melding ondertekent;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel106
  - number: 106.1.b
    text: de naam en het adres van de ondernemer;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel106
  - number: 106.1.c
    text: het adres of de kadastrale gegevens van de locatie;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel106
  - number: 106.1.d
    text: een aanduiding van de werkzaamheid;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel106
  - number: 106.1.e
    text: indien van toepassing een wijziging van de gegevens als bedoeld in artikel 105, eerste lid, onder e.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel106
  - number: '106.2'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de gegevens die deze melding
      bevat.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel106
  - number: '107.1'
    text: Het is verboden zonder vergunning een werkzaamheid, niet zijnde een lozing, te verrichten.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel107
  - number: '107.2'
    text: 'Het in het eerste lid gestelde verbod geldt binnen een locatie niet, indien:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel107
  - number: 107.2.a
    text: |-
      de activiteit van de radionucliden in de bij die werkzaamheid betrokken natuurlijke bronnen lager is dan de in
      bijlage 1, tabel 1, vermelde waarde, of
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel107
  - number: 107.2.b
    text: |-
      de activiteitsconcentratie van de bij die werkzaamheid betrokken natuurlijke bronnen lager is dan tienmaal de in
      bijlage 1, tabel 1, vermelde waarde.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel107
  - number: '107.3'
    text: Artikel 25, derde, vierde, zesde, zevende en achtste lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel107
  - number: '107.4'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat in daarbij aangegeven gevallen met het oog op de
      stralingsbescherming, het tweede lid niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel107
  - number: '108.1'
    text: |-
      Het is verboden zonder vergunning natuurlijke bronnen te lozen of een werkzaamheid te verrichten ten gevolge
      waarvan natuurlijke bronnen worden geloosd.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel108
  - number: '108.2'
    text: |-
      Het in het eerste lid gestelde verbod geldt niet indien de activiteit van de in een kalenderjaar te lozen
      radionucliden die in bijlage 1, tabel 2, zijn vermeld, bij het verlaten van de locatie lager is dan de daarbij in
      die tabel aangegeven waarde.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel108
  - number: '108.3'
    text: Artikel 25, derde, vierde, zesde, zevende en achtste lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel108
  - number: '108.4'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat in daarbij aangegeven gevallen met het oog op de
      stralingsbescherming, het tweede lid niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel108
  - number: '109.1'
    text: |-
      Op de aanvraag om een vergunning, bedoeld in de artikelen 107 en 108, is artikel 43 van overeenkomstige toepassing.
      De aanvraag bevat in ieder geval:
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel109
  - number: 109.1.a
    text: de naam en het adres van degene die de aanvraag ondertekent;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel109
  - number: 109.1.b
    text: de naam en het adres van de ondernemer;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel109
  - number: 109.1.c
    text: het adres of de kadastrale gegevens van de locatie;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel109
  - number: 109.1.d
    text: een omschrijving van de werkzaamheid, de plaats van de werkzaamheid en van het doel;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel109
  - number: 109.1.e
    text: |-
      bij product- of materiaalhergebruik de eindbestemming van het materiaal en een schatting van de effectieve doses in
      een kalenderjaar, die personen ten gevolge van die eindbestemming en van het verwerkingspad kunnen ontvangen;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel109
  - number: 109.1.f
    text: een opgave van de betrokken natuurlijke bronnen en de daarin voorkomende radionucliden.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel109
  - number: '109.2'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de gegevens die een aanvraag
      bevat.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel109
  - number: '110.1'
    text: |-
      Bij ministeriële regeling kunnen, indien dat naar het oordeel van Onze Ministers met het oog op rechtvaardiging
      en optimalisatie noodzakelijk is, regels worden gesteld met betrekking tot de uitvoering van daarbij aangegeven
      werkzaamheden die overeenkomstig artikel 103 worden gemeld.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel110
  - number: '110.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot product- of materiaalhergebruik en opslag
      van afval van natuurlijke bronnen, voor categorieën van gevallen waarin de activiteitsconcentratie in combinatie
      met de totale activiteit van de betrokken natuurlijke bronnen hoger is dan de in bijlage 1, tabel 1, aangegeven
      waarde.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel110
  - number: '110.3'
    text: Artikel 25, derde, vierde, zevende en achtste lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel110
  - number: '111.1'
    text: |-
      In afwijking van de [artikelen 102 tot en met 110][ref1] zorgt de ondernemer ervoor dat met betrekking tot een
      blootgestelde werknemer die deel uitmaakt van een vliegtuigbemanning:


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel102
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '102'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: 111.1.a
    text: |-
      deze voor zijn indiensttreding of tewerkstelling als zodanig wordt voorgelicht omtrent de risico's van kosmische
      straling;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel111
  - number: 111.1.b
    text: |-
      de grootte van de door hem ontvangen effectieve dosis ten gevolge van kosmische straling wordt bepaald door middel
      van een door Onze Minister van Sociale Zaken en Werkgelegenheid vastgestelde methode;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel111
  - number: 111.1.c
    text: |-
      indien een effectieve dosis van 6 mSv in een kalenderjaar kan worden overschreden, ter voldoening aan de
      in [artikel 5][ref1] gestelde verplichting een aangepast werkrooster wordt vastgesteld en uitgevoerd en de
      desbetreffende werknemer wordt ingedeeld als A-werknemer;


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel5
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '5'
        hoofdstuk: '2'
  - number: 111.1.d
    text: |-
      de door hem ten gevolge van kosmische straling ontvangen effectieve dosis tezamen met de effectieve doses
      ten gevolge van handelingen die onder verantwoordelijkheid van de ondernemer worden verricht, 20 mSv in een
      kalenderjaar niet overschrijdt.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel111
  - number: '111.2'
    text: |-
      De [artikelen 15][ref1], [16][ref2], [79][ref3], [80][ref4], [90][ref5], [91][ref6], [92, tweede lid][ref7],
      en [96 tot en met 100][ref8] zijn van overeenkomstige toepassing. [Artikel 92, eerste lid][ref9], is van
      overeenkomstige toepassing, met dien verstande dat in plaats van «de uitslag van de individuele monitoring, bedoeld
      in de [artikelen 87][ref10], [88][ref11] en [89][ref12]» wordt gelezen: de uitslag van de individuele monitoring,
      bedoeld in [artikel 111, eerste lid][ref13].


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0012702#Artikel79
