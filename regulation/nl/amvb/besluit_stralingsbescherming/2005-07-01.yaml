      - id: ref2
        bwb_id: BWBR0012702
        artikel: '94'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: 131.c
    text: |-
      de beschikkingen krachtens artikel 25, eerste lid, juncto artikel 81, eerste lid van het Besluit
      stralenbescherming Kernenergiewet, zoals dat besluit luidde tot de datum van inwerkingtreding van dit besluit, op
      [artikel 8, eerste lid][ref1], van dit besluit;


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel8
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel131
    references:
      - id: ref1
