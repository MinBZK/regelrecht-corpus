  - number: '115'
    text: |-
      De ondernemer zorgt ervoor dat voorzieningen worden getroffen ter voorbereiding op het verrichten van een
      interventie voor het geval dat zich binnen de locatie een radiologische noodsituatie voordoet. Hij stelt voor
      iedere locatie een interventieplan op, dat hij regelmatig test.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel115
  - number: '116.1'
    text: |-
      De ondernemer treft, indien zich binnen de locatie een radiologische noodsituatie voordoet, onverwijld alle
      passende maatregelen om de gevolgen daarvan te beperken.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel116
  - number: '116.2'
    text: |-
      De ondernemer brengt de radiologische noodsituatie onverwijld ter kennis van de burgemeester van de gemeente waar
      die situatie zich voordoet.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel116
  - number: '116.3'
    text: |-
      De ondernemer maakt onverwijld een voorlopige beoordeling van de omstandigheden en de gevolgen van die situatie en
      meldt deze aan de burgemeester en aan Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel116
  - number: '116.4'
    text: |-
      De ondernemer zorgt ervoor dat alle medewerking wordt verleend aan een interventie die door een bestuursorgaan
      wordt verricht.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel116
  - number: '117.1'
    text: |-
      Onze in [artikel 113][ref1] genoemde Ministers stellen, ieder voor zover het het in dat artikel genoemde belang
      betreft, regels met betrekking tot de uitvoering van interventies.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel113
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '113'
        hoofdstuk: '9'
  - number: '117.2'
    text: |-
      Degene onder wiens verantwoordelijkheid de interventie wordt verricht, zorgt ervoor dat de gevolgen en de
      doeltreffendheid van een interventie worden bepaald en geregistreerd.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel117
  - number: '118.1'
    text: |-
      De [artikelen 48][ref1], [49][ref2], [76][ref3] en [77][ref4] zijn in geval van interventie in een radiologische
      noodsituatie niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0012702#Artikel76
      [ref4]: https://wetten.overheid.nl/BWBR0012702#Artikel77
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '48'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '49'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0012702
        artikel: '76'
        hoofdstuk: '7'
        paragraaf: '7.1'
      - id: ref4
        bwb_id: BWBR0012702
        artikel: '77'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '118.2'
    text: |-
      In geval van interventie in een radiologische noodsituatie gelden voor werknemers en hulpverleners als
      dosisbeperking voor de effectieve dosis voor: levensreddend werk: 750 mSv redden van belangrijke materiële
      belangen: 250 mSv ondersteuning of uitvoering van metingen, evacuatie, jodiumprofylaxe, openbare orde en
      veiligheid: 100 mSv
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel118
  - number: '118.3'
    text: |-
      De in het tweede lid aangegeven waarden voor levensreddend werk worden slechts overschreden, indien dat
      noodzakelijk is om mensenlevens te redden of belangrijke materiële belangen veilig te stellen, de betrokken
      werknemer of hulpverlener door de ondernemer is geïnformeerd over de risico's van de interventie en de interventie
      vrijwillig wordt uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel118
  - number: '118.4'
    text: |-
      [Artikel 113, tweede lid][ref1], en [artikel 114][ref2], zijn van overeenkomstige toepassing voor werknemers en
      hulpverleners die bij een interventie belast zijn met de in het tweede lid genoemde taken.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel113
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel114
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '113'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '114'
        hoofdstuk: '9'
  - number: '119.1'
    text: |-
      Onze in [artikel 113][ref1] genoemde Ministers, ieder voor zover het het in dat artikel genoemde belang betreft, of
      de ondernemer kunnen een situatie aanmerken als een situatie die leidt tot langdurige blootstelling als gevolg van
      een radiologische noodsituatie of van een vroegere handeling of werkzaamheid.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel113
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '113'
        hoofdstuk: '9'
  - number: '119.2'
    text: |-
      Onze Ministers kunnen in het geval dat de situatie als bedoeld in het eerste lid onder de verantwoordelijkheid van
      een ondernemer valt, de ondernemer verplichten de interventie uit te voeren.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel119
  - number: '119.3'
    text: |-
      In een geval als bedoeld in het eerste lid, draagt degene onder wiens verantwoordelijkheid de interventie wordt
      verricht, voor zover dat nodig is met het oog op het gevaar van blootstelling, zorg voor:
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel119
  - number: 119.3.a
    text: de afbakening van het desbetreffende gebied;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel119
  - number: 119.3.b
    text: de invoering van een bewakingssysteem voor de blootstelling;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel119
  - number: 119.3.c
    text: de uitvoering van de interventie, overeenkomstig een door Onze betrokken Minister goedgekeurd plan van aanpak;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel119
  - number: 119.3.d
    text: |-
      het regelen van de toegang tot of het gebruik van de locaties of gebouwen, die zich in het afgebakende gebied
      bevinden.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel119
  - number: '119.4'
    text: |-
      Met betrekking tot interventie in een geval als bedoeld in het eerste lid is dit besluit, met uitzondering
      van de [paragrafen 4.2 tot en met 4.4][ref1] en de [artikelen 39, onder b][ref2], [48][ref3], en
      [114 tot en met 118][ref4], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0012702#Artikel48
      [ref4]: https://wetten.overheid.nl/BWBR0012702#Artikel114
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0012702
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '39'
        hoofdstuk: '4'
        paragraaf: '4.5'
      - id: ref3
        bwb_id: BWBR0012702
        artikel: '48'
        hoofdstuk: '5'
      - id: ref4
        bwb_id: BWBR0012702
        artikel: '114'
        hoofdstuk: '9'
  - number: '120.1'
    text: De ondernemer die handelingen verricht, houdt een administratie bij van die handelingen.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel120
  - number: '120.2'
    text: 'De administratie bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel120
  - number: 120.2.a
    text: de naam van de rechtspersoon en de verantwoordelijke deskundige;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel120
  - number: 120.2.b
    text: de plaats waar de handelingen worden verricht;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel120
  - number: 120.2.c
    text: een omschrijving van de aard en de omvang van de handelingen.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel120
  - number: '120.3'
    text: |-
      Bij ministeriële regeling worden nadere regels voor de inhoud en regels voor de bewaartermijnen van de
      administratie gesteld.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel120
  - number: '121.1'
    text: |-
      Degene die binnen een locatie handelingen verricht als bedoeld in artikel 43, derde lid, houdt een administratie
      bij van die handelingen.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel121
  - number: '121.2'
    text: 'De administratie bevat:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel121
  - number: 121.2.a
    text: de naam van de houder van de vergunning en het nummer van de voor de betrokken handelingen verleende vergunning;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel121
  - number: 121.2.b
    text: het tijdstip waarop of de periode binnen een kalenderjaar waarin de handelingen zijn verricht;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel121
  - number: 121.2.c
    text: de plaats, de aard en de omvang van de handelingen;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel121
  - number: 121.2.d
    text: |-
      de aan de handelingen toe te rekenen maximale toename van de effectieve dosis die personen op enig punt buiten de
      locatie kunnen ontvangen.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel121
  - number: '121.3'
    text: |-
      Indien degene die binnen een locatie handelingen gaat verrichten als bedoeld in artikel 43, derde lid, opnamen
      maakt of radioscopie toepast in het kader van niet destructief onderzoek wordt in de administratie tevens het
      totaal aantal opnamen en uren radioscopie binnen dezelfde locatie vermeld. Voor de toepassing van deze bepaling
      wordt het aantal opnamen gelijk gesteld aan het aantal voor dat doel gebruikte films.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel121
  - number: '121.4'
    text: |-
      Indien degene die binnen een locatie handelingen gaat verrichten als bedoeld in het derde lid, een redelijk
      vermoeden heeft dat het totaal aantal opnamen dat binnen de locatie zal worden gemaakt, het aantal van 3300 in
      een kalenderjaar zal overschrijden, meldt hij dit onverwijld aan Onze Minister van Volkshuisvesting, Ruimtelijke
      Ordening en Milieubeheer en de opdrachtgever. Voor de toepassing van deze bepaling wordt acht uur radioscopie
      gelijk gesteld met een opname.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel121
  - number: '121.5'
    text: |-
      Degene die een administratie als bedoeld in het eerste lid voert, bewaart de bescheiden waaruit die administratie
      bestaat, ten minste gedurende vijf jaar na het kalenderjaar waarop zij betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel121
  - number: '121.6'
    text: |-
      In dit artikel en de daarop berustende bepalingen wordt onder radioscopie verstaan: het door middel van ioniserende
      straling vanuit een toestel of apparaat via een stralingsdetector produceren van een visueel waarneembaar beeld
      door het geproduceerde signaal om te zetten naar een videosignaal, dat wordt weergegeven door een monitor.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel121
  - number: '121.7'
    text: Het eerste lid geldt niet indien het aantal tevoren geschatte opnamen per kalenderjaar minder dan 100 is.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel121
  - number: '122.1'
    text: |-
      Degene die handelingen verricht voldoet aan nadere eisen terzake van de bij of krachtens dit besluit gestelde
      regels.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel122
  - number: '122.2'
    text: |-
      Nadere eisen die uitsluitend betrekking hebben op de bescherming van werknemers tegen ioniserende straling ten
      gevolge van handelingen worden gesteld:
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel122
  - number: 122.2.a
    text: 'indien het mijnbouw betreft: door de Inspecteur-Generaal der Mijnen;'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel122
  - number: 122.2.b
    text: |-
      indien het andere handelingen betreft: door een daartoe door Onze Minister van Sociale Zaken en Werkgelegenheid
      aangewezen ambtenaar.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel122
  - number: '122.3'
    text: |-
      Indien deze nadere eisen die geen betrekking hebben op de bescherming van werknemers tegen ioniserende straling
      bij door hen te verrichten handelingen, worden ze gesteld door de inspecteur, of de Inspecteur-Generaal voor
      de Gezondheidszorg, voor zover het de onder hen ressorterende belangen betreft of indien het de mijnbouw op het
      continentaal plat betreft, de Inspecteur-Generaal der Mijnen.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel122
  - number: '122.4'
    text: |-
      Nadere eisen die zowel de in het tweede als in het derde lid bedoelde belangen betreffen, worden gesteld door de in
      die leden genoemde bestuursorganen gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel122
  - number: '123.1'
    text: |-
      In bijzondere gevallen kunnen Onze Ministers en Onze Ministers van Volksgezondheid, Welzijn en Sport, indien het
      radiologische verrichtingen betreft, van Defensie, indien het de krijgsmacht betreft en van Economische Zaken,
      indien het mijnbouw betreft, ontheffing verlenen van de voorschriften in paragraaf 3.3, en de artikelen 120 en 121.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel123
  - number: '123.2'
    text: Aan de ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel123
  - number: '124.1'
    text: |-
      Indien dit in het belang van de bescherming tegen ioniserende straling naar het oordeel van Onze Ministers
      dringend noodzakelijk is en naar hun oordeel een wijziging van dit besluit niet kan worden afgewacht, kunnen bij
      ministeriële regeling regels worden gesteld, die van dit besluit afwijken maar met een strekking als bedoeld in
      dit besluit. Een zodanige regeling vervalt een jaar nadat zij in werking is getreden, of, indien binnen die termijn
      een wijziging van de betrokken bepaling van dit besluit inwerking is getreden, op het tijdstip waarop die wijziging
      in werking treedt. Onze Ministers kunnen de termijn bij ministeriële regeling eenmaal met ten hoogste een jaar
      verlengen.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel124
  - number: '124.2'
    text: |-
      De waarden van bijlage 1, de tabellen 1, 2 en 3, en van bijlage 4 kunnen bij ministeriële regeling worden
      gewijzigd.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel124
  - number: '125'
    text: |-
      Het Besluit stralenbescherming Kernenergiewet en het Besluit registratie radioactieve stoffen en kosten
      keuringsdiensten Kernenergiewet worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel125
  - number: '127.1'
    text: 'Een vergunning, die voor de datum van inwerkingtreding van dit besluit is verleend krachtens:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel127
  - number: 127.1.a
    text: |-
      [artikel 29 van de wet][ref1], juncto artikel 6 en 7 van het Besluit stralenbescherming Kernenergiewet zoals dat
      besluit luidde tot de datum van inwerkingtreding van dit besluit;


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel29
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '29'
  - number: 127.1.b
    text: |-
      [artikel 34 van de wet][ref1], juncto artikel 8 van het Besluit stralenbescherming Kernenergiewet zoals dat besluit
      luidde tot de datum van inwerkingtreding van dit besluit, of


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel34
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '34'
  - number: 127.1.c
    text: |-
      [artikel 26 van de Mijnwet continentaal plat][ref1], juncto
      [artikel 167 van het Mijnreglement continentaal plat][ref2], zoals dat besluit luidde tot de datum
      van inwerkingtreding van dit besluit, berust na de datum van inwerkingtreding van dit besluit op de
      [artikelen 23][ref3], [24][ref4], [25][ref5] of [108][ref6] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0002504#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0002564#Artikel167
      [ref3]: https://wetten.overheid.nl/BWBR0012702#Artikel23
      [ref4]: https://wetten.overheid.nl/BWBR0012702#Artikel24
      [ref5]: https://wetten.overheid.nl/BWBR0012702#Artikel25
      [ref6]: https://wetten.overheid.nl/BWBR0012702#Artikel108
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0002504
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0002564
        artikel: '167'
      - id: ref3
        bwb_id: BWBR0012702
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref4
        bwb_id: BWBR0012702
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref5
        bwb_id: BWBR0012702
        artikel: '25'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref6
        bwb_id: BWBR0012702
        artikel: '108'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: '127.2'
    text: |-
      Een handeling met een toestel waarvoor voor de datum van inwerkingtreding van dit besluit vergunning is
      verleend bij of krachtens [artikel 34 van de wet][ref1], juncto artikel 8, eerste lid, onder b, van het Besluit
      stralenbescherming Kernenergiewet zoals dat besluit luidde tot de datum van inwerkingtreding van dit besluit, wordt
      geacht te zijn gemeld overeenkomstig [artikel 21][ref2] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel21
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '21'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '127.3'
    text: |-
      De ondernemer die een handeling of een werkzaamheid met een radioactieve stof verricht waarvoor krachtens
      [artikel 29 van de wet][ref1], juncto artikel 6, eerste en tweede lid, en artikel 7, eerste en tweede lid, van
      het Besluit stralenbescherming Kernenergiewet, zoals dat besluit luidde tot de datum van inwerkingtreding van dit
      besluit of krachtens [artikel 34 van de wet][ref2], geen vergunning is vereist maar waarvoor hij bij of krachtens
      dit besluit wel een vergunning behoeft, dient binnen 12 maanden na inwerkingtreding van dit besluit een aanvraag in
      overeenkomstig [artikel 43][ref3] van dit besluit. Totdat Onze Ministers hebben beslist op die aanvraag, wordt de
      handeling aangemerkt te zijn verricht overeenkomstig dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0012702#Artikel43
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0002402
        artikel: '34'
      - id: ref3
        bwb_id: BWBR0012702
        artikel: '43'
        hoofdstuk: '4'
        paragraaf: '4.7'
  - number: '127.4'
    text: |-
      De ondernemer die een werkzaamheid verricht waarvoor krachtens de wet tot de datum van inwerkingtreding van dit
      besluit geen melding of vergunning is vereist, maar waarvoor krachtens [hoofdstuk 8][ref1] van dit besluit melding
      is vereist, meldt de werkzaamheid voor een door Onze Ministers nader te bepalen tijdstip. Tot dat tijdstip wordt de
      werkzaamheid geacht te zijn gemeld overeenkomstig dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0012702
        hoofdstuk: '8'
  - number: '127.5'
    text: |-
      De ondernemer die een werkzaamheid verricht waarvoor krachtens de wet tot de datum van inwerkingtreding van dit
      besluit een vergunning is verleend, maar waarvoor krachtens [hoofdstuk 8][ref1] van dit besluit een melding is
      vereist, wordt geacht de werkzaamheid te hebben gemeld overeenkomstig [artikel 103][ref2] van dit besluit. De aan
      de vergunning verbonden voorschriften blijven na de datum van inwerkingtreding van [hoofdstuk 8][ref3] van dit
      besluit gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel103
      [ref3]: https://wetten.overheid.nl/BWBR0012702#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0012702
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '103'
        hoofdstuk: '8'
        paragraaf: '8.2'
      - id: ref3
        bwb_id: BWBR0012702
        hoofdstuk: '8'
  - number: '127.6'
    text: |-
      Een toestel als bedoeld in [artikel 34 van de wet][ref1], juncto artikel 4, tweede lid, van het Besluit
      stralenbescherming Kernenergiewet, zoals dat besluit luidde tot de datum van inwerkingtreding van dit
      besluit, respectievelijk een handeling met een radioactieve stof als bedoeld in [artikel 29 van de wet][ref2],
      juncto artikel 6, derde lid, van het Besluit stralenbescherming Kernenergiewet, zoals dat besluit luidde
      tot de datum van inwerkingtreding van dit besluit, worden aangemerkt als een toestel dat ingevolge
      [artikel 21, tweede lid, onder d][ref3], van dit besluit is goedgekeurd, onderscheidenlijk een handeling van een
      type, dat ingevolge [artikel 26, eerste lid, onder a][ref4], van dit besluit is goedgekeurd.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0012702#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0012702#Artikel26
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0002402
        artikel: '29'
      - id: ref3
        bwb_id: BWBR0012702
