  - number: '111.3'
    text: |-
      Dit artikel is niet van toepassing op vluchten die uitsluitend op een hoogte van minder dan acht kilometer
      plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel111
  - number: '111.4'
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid kan nadere regels stellen met betrekking tot het bepaalde in
      dit artikel.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel111
  - number: '112.1'
    text: |-
      Een interventie wordt slechts verricht indien de daarvan verwachte beperking van de schade en de nadelige
      sociale en maatschappelijke gevolgen veroorzaakt door straling, voldoende is om de schade, de nadelige sociale en
      maatschappelijke gevolgen en de kosten van de interventie te rechtvaardigen.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel112
  - number: '112.2'
    text: |-
      De vorm, de omvang en de duur van de interventie zijn zodanig, dat het voordeel van de daarmee te bereiken
      beperking van de gezondheidsschade, rekening houdend met de schade die aan de interventie is verbonden, zo groot is
      als redelijkerwijs mogelijk is.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel112
  - number: '113.1'
    text: 'Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, en:'
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel113
  - number: 113.1.a
    text: indien het de krijgsmacht betreft, Onze Minister van Defensie;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel113
  - number: 113.1.b
    text: indien het medische stralingstoepassingen betreft, Onze Minister van Volksgezondheid, Welzijn en Sport;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel113
  - number: 113.1.c
    text: indien het arbeidsbescherming betreft, Onze Minister van Sociale Zaken en Werkgelegenheid,
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel113
  - number: 113.1.d
    text: indien het mijnbouw betreft, Onze Minister van Economische Zaken;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel113
  - number: 113.1.e
    text: indien het lozing in het oppervlaktewater betreft, Onze Minister van Verkeer en Waterstaat;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel113
  - number: 113.1.f
    text: |-
      indien het lozing in het oppervlaktewater of lozing in de lucht betreft, Onze Minister van Landbouw, Natuurbeheer
      en Visserij;
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel113
  - number: '113.2'
    text: De leden van deze teams zijn voldoende opgeleid voor de uitvoering van hun taken.
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel113
  - number: '114'
    text: |-
      De [artikelen 87][ref1], [89][ref2], [90][ref3], [92][ref4], [93][ref5] en [96][ref6] zijn van overeenkomstige
      toepassing voor de teams bedoeld in [artikel 113, eerste lid][ref7], met dien verstande dat de daar bedoelde
      verplichtingen rusten op degene onder wiens verantwoordelijkheid de interventie wordt verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel87
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel89
      [ref3]: https://wetten.overheid.nl/BWBR0012702#Artikel90
      [ref4]: https://wetten.overheid.nl/BWBR0012702#Artikel92
      [ref5]: https://wetten.overheid.nl/BWBR0012702#Artikel93
      [ref6]: https://wetten.overheid.nl/BWBR0012702#Artikel96
      [ref7]: https://wetten.overheid.nl/BWBR0012702#Artikel113
    url: https://wetten.overheid.nl/BWBR0012702/2005-07-01#Artikel114
