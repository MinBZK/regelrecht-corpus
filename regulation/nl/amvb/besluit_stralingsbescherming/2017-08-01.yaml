preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Sociale Zaken en Werkgelegenheid, J. F. Hoogervorst van 20
    december 2000, Directie Arbeidsomstandigheden, nr. Arbo/Amil/00/84346, gedaan mede namens Onze Minister van
    Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer en Onze Minister van Volksgezondheid, Welzijn en Sport, in
    overeenstemming met Onze Minister van Economische Zaken;

    Gelet op de artikelen, 28, 29, eerste lid, 30, 31, 32, eerste en vierde lid, 34, 35, 37, eerste lid, 37a, 38a,
    67, 69, vierde en vijfde lid, 69a, 69b, 73 en 76 van de Kernenergiewet, artikel 16 van de Arbeidsomstandighedenwet
    1998, artikel 37, tweede lid, van de Wet op de beroepen in de individuele gezondheidszorg alsmede op richtlijn
    nr. 96/29/Euratom van de Raad van de Europese Unie van 13 mei 1996 tot vaststelling van de basisnormen voor de
    bescherming van de gezondheid van de bevolking en der werkers tegen de aan ioniserende straling verbonden gevaren
    (PbEG L 159) en richtlijn nr. 97/43/Euratom van de Raad van de Europese Unie van 30 juni 1997 betreffende de
    bescherming van personen tegen de gevaren van ioniserende straling in verband met medische blootstelling en tot
    intrekking van richtlijn 84/466/Euratom (PbEG L 180);

    De Raad van State gehoord (advies van 27 maart 2001, no. W12.01.0024/IV);

    Gezien het nader rapport van de Staatssecretaris van Sociale Zaken en Werkgelegenheid, J. F. Hoogervorst van
    2 juli 2001, Directie Arbeidsomstandigheden, nr. Arbo/Amil/01/41134, gedaan mede namens Onze Minister van
    Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer en Onze Minister van Volksgezondheid, Welzijn en Sport, in
    overeenstemming met Onze Minister van Economische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: *aanwijsinstrument:* instrument
      voor tijd- of plaatsbepaling, dan wel voor het meten, bepalen of aangeven van andere grootheden, bestemd
      voor gebruik op of in de directe omgeving van personen; *activiteit:*activiteit als bedoeld in de bijlage;
      *activiteitsconcentratie:*activiteitsconcentratie als bedoeld in de bijlage; *afgedankte hoogactieve bron*:
      hoogactieve bron die niet langer wordt gebruikt, noch bestemd is om te worden gebruikt voor de handeling waarvoor
      een vergunning is verleend; *algemeen coördinerend deskundige:* stralingsbeschermingsdeskundige die namens de
      ondernemer ervoor zorgt dat handelingen of werkzaamheden plaatsvinden binnen het kader van de regels bij of
      krachtens de wet, die daarop toezicht houdt en controle uitoefent, die andere zaken die betrekking hebben op
      stralingsbescherming coördineert en die namens de ondernemer intern toestemming verleent voor handelingen en
      werkzaamheden; *arbodienst:*een dienst als bedoeld in de [Arbeidsomstandighedenwet][ref1]; *A-werknemer:*de
      blootgestelde werknemer, bedoeld in [artikel 79, tweede lid][ref2]; *beheer van radioactieve afvalstoffen:*
      alle activiteiten die te maken hebben met het hanteren, de voorbehandeling, de behandeling, het conditioneren,
      de opslag of de eindberging van radioactieve afvalstoffen, met uitzondering van het vervoer buiten het terrein
      van de inrichting; *beheersysteem:* systeem dat gegevens en documenten bevat die betrekking hebben op de
      stralingsbescherming binnen de onderneming; *besmetting:*de aanwezigheid van radioactieve stoffen in een
      materiaal, in of op een oppervlak, in een omgeving, of uitwendig op of inwendig in een persoon; *blootgestelde
      werknemer:*werknemer die gedurende zijn werktijd ten gevolge van handelingen een blootstelling ondergaat die kan
      leiden tot een dosis die hoger is dan een der in [artikel 76][ref3] genoemde dosislimieten; *blootstelling:*het
      blootgesteld zijn aan ioniserende straling; *bron:* toestel dan wel radioactieve stof; *broncontainer*: insluiting
      van een bron die geen geïntegreerd onderdeel van die bron is, maar uitsluitend is bedoeld voor tijdelijke behuizing
      van die bron voor transport, verlading en dergelijke; *bronhouder*: behuizing van een ingekapselde bron, die
      ter plaatse van het uittredevenster van de bronhouder is voorzien van een voorziening, waarmee de uittredende
      stralenbundel kan worden onderbroken en waaruit de bron niet zonder hulpgereedschap kan worden verwijderd; *B-
      werknemer:*andere blootgestelde werknemer dan een A-werknemer; *bijlage:* bij dit besluit behorende bijlage;
      *coördinerend deskundige:* stralingsbeschermingsdeskundige die namens de ondernemer ervoor zorgt dat handelingen
      of werkzaamheden plaatsvinden binnen het kader van de regels bij of krachtens de [wet][ref4], die daarop toezicht
      houdt en controle uitoefent en die andere zaken die betrekking hebben op stralingsbescherming coördineert;
      *deskundige:* een persoon die een diploma, certificaat, of een ander getuigschrift ter afsluiting van een opleiding
      op het gebied van stralingsbescherming heeft behaald bij een instelling als bedoeld in [artikel 7f][ref5];
      *dosisbeperking:*dosiswaarde die bij de planning van handelingen wordt vastgesteld als plafondwaarde voor het
      optimaliseringsproces van de bescherming tegen ioniserende straling bij een handeling, taak of beroep of een
      categorie daarvan; *effectieve dosis:*effectieve dosis als bedoeld in de bijlage; *effectieve volgdosis:*effectieve
      volgdosis als bedoeld in de bijlage; *eindberging:* de plaatsing van radioactieve afvalstoffen of verbruikte
      splijtstoffen in een inrichting zonder de bedoeling die afvalstoffen of splijtstoffen terug te halen; *equivalente
      dosis:*equivalente dosis als bedoeld in de bijlage; *externe werknemer:*A-werknemer die onder verantwoordelijkheid
      van een ondernemer die in een andere lidstaat van de Europese Unie of een derde land is gevestigd, werkzaam is
      op Nederlands grondgebied in een zone als bedoeld in [artikel 83, eerste lid, onder a, onderdeel 1°][ref6];
      *gezondheidsschade:*de geschatte kans op een kortere levensduur en verminderde kwaliteit van leven voor een
      persoon door de negatieve effecten van lichamelijke afwijkingen, kanker, en ernstige genetische effecten als
      gevolg van blootstelling aan ioniserende straling; *handeling:*het bereiden, voorhanden hebben, toepassen
      of zich ontdoen van een kunstmatige bron of van een natuurlijke bron, voor zover deze natuurlijke bron is of
      wordt bewerkt met het oog op zijn radioactieve eigenschappen dan wel het gebruiken of voorhanden hebben van een
      toestel, uitgezonderd bij een interventie, een ongeval of een radiologische noodsituatie; *hoogactieve bron:*
      ingekapselde bron die een radionuclide bevat waarvan de activiteit een waarde overstijgt die gelijk is aan of
      hoger is dan het voor die bron krachtens [artikel 3, eerste lid][ref7], geldende activiteitsniveau; *industriële
      radiografie:* het door middel van ioniserende straling vanuit een toestel of apparaat via een stralingsdetector
      produceren van een visueel waarneembaar beeld door het geproduceerde signaal om te zetten naar een videosignaal,
      dat wordt weergegeven door een monitor dan wel een methode waarbij de projectie van het te onderzoeken object
      wordt vastgelegd op filmmateriaal; *ingekapselde bron:*radioactieve stoffen die zijn ingebed in of gehecht aan vast
      dragermateriaal of zijn omgeven door een omhulling van materiaal met dien verstande dat hetzij het dragermateriaal
      hetzij de omhulling voldoende weerstand biedt om onder normale gebruiksomstandigheden elke verspreiding van
      radioactieve stoffen te voorkomen; *kunstmatige bron:*bron, niet zijnde een natuurlijke bron en niet zijnde een
      toestel; *leverancier*: natuurlijke of rechtspersoon die een hoogactieve bron levert of ter beschikking stelt;
      *lid van de bevolking:*een persoon uit de bevolking binnen of buiten een locatie, niet zijnde een werknemer
      gedurende zijn werktijd of een persoon die een radiologische verrichting ondergaat; *locatie:*inrichting als
      aangewezen krachtens [artikel 1.1, derde lid, van de Wet milieubeheer][ref8] of plaats, waar een handeling of
      werkzaamheid wordt verricht; *lozing:* lozing op of in de bodem, in de lucht, in het openbare riool of in het
      oppervlaktewater; *lozing op of in de bodem:* het definitief op of in de bodem brengen of doen brengen van
      vloeibare of in vloeistof opgeloste radioactieve stoffen dan wel van in een vloeistofstroom meegevoerde deeltjes
      van radioactieve stoffen, of het op de bodem brengen van deze stoffen indien daarbij vloeistof voor een deel in de
      bodem treedt, niet zijnde meststoffen als bedoeld in [artikel 1, eerste lid, van de Meststoffenwet][ref9]; *lozing
      in het openbare riool:*het in het openbare riool ontsnappen of laten ontsnappen van vloeibare of in vloeistof
      opgeloste radioactieve stoffen dan wel van in een vloeistofstroom meegevoerde deeltjes van radioactieve stoffen;
      *lozing in de lucht:*het in de lucht ontsnappen van of laten ontsnappen van gasvormige radioactieve stoffen dan
      wel van in een gasstroom meegevoerde deeltjes van radioactieve stoffen; *lozing in het oppervlaktewater:*het
      in het oppervlaktewater ontsnappen of laten ontsnappen van vloeibare of in vloeistof opgeloste radioactieve
      stoffen dan wel van in een vloeistofstroom meegevoerde deeltjes van radioactieve stoffen; *meet-, regel- of
      ijkbron:* bron die uitsluitend wordt gebruikt in een al dan niet vaste meet-, regel- of ijkopstelling; *meldpunt
      stralingsincidenten:* meldpunt als bedoeld in [artikel 12a][ref10]; *mijnbouw:*handelingen of werkzaamheden in
      het kader van het verrichten van verkenningsonderzoek, het opsporen of het winnen van delfstoffen of aardwarmte,
      dan wel het opslaan van stoffen; *natuurlijke bron:*kosmische straling of bron van natuurlijke oorsprong,
      niet zijnde een toestel; *omgevingsdosisequivalent:*omgevingsdosisequivalent als bedoeld in de bijlage;
      *omgevingsdosisequivalenttempo:*omgevingsdosisequivalenttempo als bedoeld in de bijlage; *ondernemer:*degene
      onder wiens verantwoordelijkheid een handeling of werkzaamheid wordt verricht; *ongewilde verspreiding:* ongewilde
      verspreiding van een radioactieve stof als gevolg van een handeling of werkzaamheid die onder verantwoordelijkheid
      van een ondernemer is verricht en die niet meer onder controle van de betrokken ondernemer is; *Onze Minister:*
      Onze Minister van Infrastructuur en Milieu; *Onze Ministers:* Onze Ministers van Infrastructuur en Milieu en
      van Sociale Zaken en Werkgelegenheid; *open bron:*bron, niet zijnde een ingekapselde bron en niet zijnde een
      toestel; *oppervlaktebesmetting:*oppervlaktebesmetting als bedoeld in de bijlage; *overbestraling:* blootstelling,
      waarbij de in de [artikelen 76][ref11], [77][ref12] en [78][ref13] genoemde effectieve dosis of equivalente
      dosis wordt overschreden; *overmatige blootstelling:* blootstelling die plaats vindt bij een onvoorzienbare
      of onbedoelde gebeurtenis, die kan leiden tot een blootstelling die hoger is dan bepaald in de risicoanalyse;
      *potentiële blootstelling:*blootstelling die niet met zekerheid zal optreden maar waarvan de waarschijnlijkheid
      van optreden en de grootte van de daarbij eventueel optredende blootstelling van tevoren kunnen worden geschat
      en die voor de aanvang van de handelingen en werkzaamheden met behulp van een risicoanalyse is bepaald;
      *radioactieve afvalstof:*radioactieve stof die krachtens [artikel 38][ref14] als zodanig is aangemerkt en die
      niet wordt geloosd; *radiologische verrichting:*medische handeling met gebruikmaking van ioniserende straling
      als bedoeld in [artikel 53, eerste lid][ref15]; *radiotoxiciteitsequivalent:*de activiteit die bij inname leidt
      tot een effectieve volgdosis van 1 sievert voor een volwassen referentiepersoon; *reguliere blootstelling:*
      blootstelling onder normale bedrijfsomstandigheden, welke voor de aanvang van de handelingen of werkzaamheden
      met behulp van een risicoanalyse is geschat; *richtlijn 2011/77/Euratom:* richtlijn 2011/70/Euratom van de Raad
      van 19 juli 2011 tot vaststelling van een communautair kader voor een verantwoord en veilig beheer van verbruikte
      splijtstof en radioactief afval (Pb EU 2011, L 199); *risicoanalyse:* risico-inventarisatie en -evaluatie als
      bedoeld in [artikel 5, eerste lid, van de Arbeidsomstandighedenwet][ref16]; *schade:*nadelige gevolgen van
      ioniserende straling voor mensen, dieren, planten en goederen; *stralingsarts:*een persoon, die als stralingsarts
      is ingeschreven in het register, bedoeld in [artikel 7, eerste lid][ref17]; *stralingsincident:* onvoorziene
      gebeurtenis, situatie of ongewilde verspreiding waarbij gevaar bestaat, dan wel gevaar is opgetreden, anders dan
      een reguliere of potentiële blootstelling, voor: - een blootstelling aan ioniserende straling van leden van de
      bevolking van meer dan 0,1 mSv per jaar,
        - een lozing op of in de bodem, in het riool, in het oppervlaktewater of in de lucht boven een door Onze Minister
      vastgestelde waarde, of
        - een overmatige blootstelling of overbestraling van werknemers; *toezichthoudend deskundige:* deskundige die
      een handeling of werkzaamheid uitvoert, of onder wiens toezicht een handeling of werkzaamheid wordt uitgevoerd;
      *werknemer:*persoon die, hetzij in dienst of onder gezag van een ondernemer, hetzij als zelfstandige, arbeid
      verricht; *werkzaamheid:*het bereiden, voorhanden hebben, toepassen van of zich ontdoen van een natuurlijke bron
      voor zover die niet wordt of is bewerkt wegens zijn radioactieve eigenschappen, uitgezonderd bij een interventie,
      een ongeval of een radiologische noodsituatie; *wet:* [Kernenergiewet][ref18].


