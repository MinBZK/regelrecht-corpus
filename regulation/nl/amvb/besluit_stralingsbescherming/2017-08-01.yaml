        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: '127.2'
    text: |-
      Een handeling met een toestel waarvoor voor de datum van inwerkingtreding van dit besluit vergunning is
      verleend bij of krachtens [artikel 34 van de wet][ref1], juncto artikel 8, eerste lid, onder b, van het Besluit
      stralenbescherming Kernenergiewet zoals dat besluit luidde tot de datum van inwerkingtreding van dit besluit, wordt
      geacht te zijn gemeld overeenkomstig [artikel 21][ref2] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel21
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '21'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '127.3'
    text: |-
      De ondernemer die een handeling of een werkzaamheid met een radioactieve stof verricht waarvoor krachtens
      [artikel 29 van de wet][ref1], juncto artikel 6, eerste en tweede lid, en artikel 7, eerste en tweede lid, van
      het Besluit stralenbescherming Kernenergiewet, zoals dat besluit luidde tot de datum van inwerkingtreding van dit
      besluit of krachtens [artikel 34 van de wet][ref2], geen vergunning is vereist maar waarvoor hij bij of krachtens
      dit besluit wel een vergunning behoeft, dient binnen 12 maanden na inwerkingtreding van dit besluit een aanvraag in
      overeenkomstig [artikel 43][ref3] van dit besluit. Totdat Onze Ministers hebben beslist op die aanvraag, wordt de
      handeling aangemerkt te zijn verricht overeenkomstig dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0012702#Artikel43
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0002402
        artikel: '34'
      - id: ref3
        bwb_id: BWBR0012702
        artikel: '43'
        hoofdstuk: '4'
        paragraaf: '4.7'
  - number: '127.4'
    text: |-
      De ondernemer die een werkzaamheid verricht waarvoor krachtens de wet tot de datum van inwerkingtreding van dit
      besluit geen melding of vergunning is vereist, maar waarvoor krachtens [hoofdstuk 8][ref1] van dit besluit melding
      is vereist, meldt de werkzaamheid voor een door Onze Ministers nader te bepalen tijdstip. Tot dat tijdstip wordt de
      werkzaamheid geacht te zijn gemeld overeenkomstig dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0012702
        hoofdstuk: '8'
  - number: '127.5'
    text: |-
      De ondernemer die een werkzaamheid verricht waarvoor krachtens de wet tot de datum van inwerkingtreding van dit
      besluit een vergunning is verleend, maar waarvoor krachtens [hoofdstuk 8][ref1] van dit besluit een melding is
      vereist, wordt geacht de werkzaamheid te hebben gemeld overeenkomstig [artikel 103][ref2] van dit besluit. De aan
      de vergunning verbonden voorschriften blijven na de datum van inwerkingtreding van [hoofdstuk 8][ref3] van dit
      besluit gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel103
      [ref3]: https://wetten.overheid.nl/BWBR0012702#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0012702
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '103'
        hoofdstuk: '8'
        paragraaf: '8.2'
      - id: ref3
        bwb_id: BWBR0012702
        hoofdstuk: '8'
  - number: '127.6'
    text: |-
      Een toestel als bedoeld in [artikel 34 van de wet][ref1], juncto artikel 4, tweede lid, van het Besluit
      stralenbescherming Kernenergiewet, zoals dat besluit luidde tot de datum van inwerkingtreding van dit
      besluit, respectievelijk een handeling met een radioactieve stof als bedoeld in [artikel 29 van de wet][ref2],
      juncto artikel 6, derde lid, van het Besluit stralenbescherming Kernenergiewet, zoals dat besluit luidde
      tot de datum van inwerkingtreding van dit besluit, worden aangemerkt als een toestel dat ingevolge
      [artikel 21, tweede lid, onder d][ref3], van dit besluit is goedgekeurd, onderscheidenlijk een handeling van een
      type, dat ingevolge [artikel 26, eerste lid, onder a][ref4], van dit besluit is goedgekeurd.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0012702#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0012702#Artikel26
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0002402
        artikel: '29'
      - id: ref3
        bwb_id: BWBR0012702
        artikel: '21'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref4
        bwb_id: BWBR0012702
        artikel: '26'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '127.7'
    text: |-
      De handelingen waarvoor het eerste en tweede lid van toepassing zijn en die op grond van [artikel 4][ref1]
      niet-gerechtvaardigd zijn, of behoren tot een categorie die niet-gerechtvaardigd zijn, worden op de datum van
      inwerkingtreding van dit besluit aangemerkt als gerechtvaardigd.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel4
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '4'
        hoofdstuk: '2'
  - number: '127.8'
    text: |-
      Handelingen die voor het in werking treden van dit besluit zijn gemeld overeenkomstig het Besluit
      stralenbescherming Kernenergiewet, en die niet overeenkomstig [artikel 4][ref1] zijn gerechtvaardigd, of behoren
      tot een categorie die niet overeenkomstig artikel 4 gerechtvaardigd is, worden gelijkgesteld met overeenkomstig
      artikel 4 gerechtvaardigde handelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel4
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '4'
        hoofdstuk: '2'
  - number: '128'
    text: |-
      Op de aanvragen voor een vergunning krachtens [artikel 29 van de wet][ref1], juncto de artikelen 6 en 7 van het
      Besluit stralenbescherming Kernenergiewet, zoals dat besluit luidde tot de datum van inwerkingtreding van dit
      besluit, en aangiften van een toestel krachtens artikel 72 van het Besluit stralenbescherming Kernenergiewet, die
      zijn gedaan voor de datum van inwerkingtreding van dit besluit wordt beslist overeenkomstig de regels krachtens
      het Besluit stralenbescherming Kernenergiewet, zoals dat besluit luidde tot de datum van inwerkingtreding van dit
      besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel29
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '29'
  - number: '129'
    text: |-
      Voor de behandeling van bezwaar of beroep, ingesteld voor de datum van inwerkingtreding van dit besluit tegen
      vergunningen als bedoeld in [artikel 127][ref1], die overeenkomstig de artikelen van het Besluit stralenbescherming
      Kernenergiewet, zoals dat besluit luidde tot de datum van inwerkingtreding van dit besluit, zijn verleend of
      geweigerd, blijven die artikelen van dit Besluit stralenbescherming Kernenergiewet en de krachtens die artikelen
      gestelde regels van toepassing, met dien verstande, dat in het geval na de datum van inwerkingtreding van dit
      besluit een bezwaar of beroep leidt tot vernietiging van het besluit tot verlening van een vergunning, een nieuw
      besluit wordt genomen met toepassing van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel127
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '127'
        hoofdstuk: '11'
  - number: '130.1'
    text: |-
      Voor degene voor wie op de datum van inwerkingtreding van dit besluit een verplichting gold tot het voldoen aan
      een nadere eis als bedoeld in artikel 75 juncto artikel 82b van het Besluit stralenbescherming Kernenergiewet,
      zoals dat besluit luidde tot de datum van inwerkingtreding van dit besluit, is artikel 122 van dit besluit van
      toepassing; die nadere eis berust na de datum van inwerkingtreding van dit besluit op artikel 122.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel130
  - number: '130.2'
    text: |-
      Op de ontheffing, die voor de datum van inwerkingtreding van dit besluit is gegeven krachtens artikel 77
      juncto artikel 82d van het Besluit stralenbescherming Kernenergiewet, zoals dat besluit luidde tot de datum van
      inwerkingtreding van dit besluit, is artikel 123 van dit besluit van toepassing; die ontheffing berust na de datum
      van inwerkingtreding van dit besluit op artikel 123.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel130
  - number: '131'
    text: 'Na de inwerkingtreding van dit besluit berusten:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel131
  - number: 131.a
    text: |-
      de beschikking van 31 augustus 1987 inzake erkenning Centrale Organisatie voor Radioactief Afval N.V. als
      ophaaldienst, op [artikel 37, zevende lid][ref1], van dit besluit;


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel37
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel131
    references:
      - id: ref1
