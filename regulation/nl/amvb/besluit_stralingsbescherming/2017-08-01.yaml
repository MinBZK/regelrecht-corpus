  - number: 39.b
    text: |-
      voor een lid van de bevolking dat zich buiten de locatie bevindt, als gevolg van de handeling waarvoor de
      vergunning is aangevraagd en ten gevolge van andere handelingen binnen en buiten deze locatie, een van de volgende
      doses wordt overschreden:
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel39
  - number: 39.b.1°
    text: 'een effectieve dosis van 1 mSv in een kalenderjaar en met inachtneming daarvan:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel39
  - number: 39.b.2°
    text: een equivalente dosis van 50 mSv in een kalenderjaar voor de huid gemiddeld over enig huidoppervlak van 1 cm2;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel39
  - number: 39.c
    text: |-
      de handeling waarvoor de vergunning is aangevraagd behoort tot een categorie die op grond van de ministeriële
      regeling, bedoeld in [artikel 4, tweede lid][ref1], als gerechtvaardigd is bekend gemaakt, maar het specifieke
      karakter van deze handeling op grond van [artikel 4, eerste lid][ref2], niet gerechtvaardigd is;


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel4
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '4'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '4'
        hoofdstuk: '2'
  - number: 39.d
    text: |-
      niet is aangetoond dat de krachtens [artikel 20d, eerste lid][ref1], vereiste financiële zekerheid is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel20d
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: 20d
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 39a
    text: |-
      Onverminderd de [artikelen 18a][ref1], [31, vierde lid][ref2], en [34, zevende lid, van de wet][ref3] kan een
      vergunning die krachtens dit hoofdstuk is verleend, geheel of gedeeltelijk worden ingetrokken indien er gedurende
      twee jaar geen handelingen zijn verricht met gebruikmaking van de vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel18a
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0002402#Artikel34
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel39a
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: 18a
      - id: ref2
        bwb_id: BWBR0002402
        artikel: '31'
      - id: ref3
        bwb_id: BWBR0002402
        artikel: '34'
  - number: '40.1'
    text: |-
      De ondernemer doet een melding als bedoeld in de [artikelen 21][ref1], [22][ref2] en [103][ref3] bij de Autoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0012702#Artikel103
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '21'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '22'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref3
        bwb_id: BWBR0012702
        artikel: '103'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: '40.2'
    text: |-
      Bij verordening van de Autoriteit kunnen nadere regels worden gesteld met betrekking tot een melding als bedoeld in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel40
  - number: '43.1'
    text: |-
      Bij verordening van de Autoriteit kunnen nadere regels worden gesteld over de aanvraag van een vergunning voor
      een handeling als bedoeld in de [artikelen 23, eerste en tweede lid][ref1], [24][ref2], [25, eerste lid][ref3],
      [35, eerste lid][ref4], en [37, eerste lid][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0012702#Artikel25
      [ref4]: https://wetten.overheid.nl/BWBR0012702#Artikel35
      [ref5]: https://wetten.overheid.nl/BWBR0012702#Artikel37
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref3
        bwb_id: BWBR0012702
        artikel: '25'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref4
        bwb_id: BWBR0012702
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '4.4'
      - id: ref5
        bwb_id: BWBR0012702
        artikel: '37'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: '43.2'
    text: |-
      Een aanvraag als bedoeld in het eerste lid betreft niet de handelingen die binnen de locatie worden verricht
      door de persoon die in het bezit is van een vergunning voor het op steeds wisselende plaatsen verrichten van de
      betrokken handelingen.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel43
  - number: '44.1'
    text: |-
      De houder van een vergunning is verplicht aan de Autoriteit kennis te geven van een na het verlenen van de
      vergunning opgetreden wijziging in een der gegevens vermeld bij de aanvraag om de vergunning.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel44
  - number: '44.2'
    text: |-
      Bij verordening van de Autoriteit kunnen nadere regels worden gesteld met betrekking tot de gegevens van de
      aanvraag van de vergunning.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel44
  - number: '45'
    text: |-
      [Afdeling 3.4 van de Algemene wet bestuursrecht][ref1], alsmede [afdeling 13.2 van de Wet milieubeheer][ref2]
      zijn van toepassing op de voorbereiding van een beschikking ter zake van een vergunning als bedoeld in
      [artikel 23, eerste lid, onder c][ref3], behoudens indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Afdeling13.2
      [ref3]: https://wetten.overheid.nl/BWBR0012702#Artikel23
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0003245
        afdeling: '13.2'
      - id: ref3
        bwb_id: BWBR0012702
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 45.a
    text: het toestel uitsluitend voor radiologische verrichtingen is bestemd;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel45
  - number: 45.b
    text: |-
      het toestel zich bevindt in een voertuig of aan boord van een vaartuig of luchtvaartuig, dat als zodanig wordt
      gebruikt;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel45
  - number: 45.c
    text: |-
      het toestel zich bevindt op steeds wisselende locaties, en naar het oordeel van de Autoriteit
      het belang van de toepassing van [afdeling 3.4 van de Algemene wet bestuursrecht][ref1], alsmede
      [afdeling 13.2 van de Wet milieubeheer][ref2] niet opweegt tegen de daaraan verbonden bezwaren;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Afdeling13.2
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0003245
        afdeling: '13.2'
  - number: 45.d
    text: |-
      indien al eerder vergunning voor een toestel van hetzelfde type met betrekking tot dezelfde plaats is verleend en
      naar het oordeel van de Autoriteit niet te verwachten is dat door gebruikmaking van de gevraagde vergunning meer
      schade kan ontstaan dan bij de eerder verleende vergunning in aanmerking is genomen.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel45
  - number: '46.1'
    text: |-
      [Afdeling 3.4 van de Algemene wet bestuursrecht][ref1], alsmede [afdeling 13.2 van de Wet milieubeheer][ref2] zijn
      niet van toepassing op de voorbereiding van een beschikking ter zake van een vergunning voor het verrichten van
      handelingen met open bronnen, indien de uitkomst van de gewogen sommatie van de activiteiten van de op enig moment
      aanwezige hoeveelheid radionucliden in de bij die handelingen betrokken radioactieve stoffen volgens de in de
      regeling, bedoeld in [artikel 3, eerste lid, aanhef en onder a][ref3], genoemde methode niet meer bedraagt dan 104.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Afdeling13.2
      [ref3]: https://wetten.overheid.nl/BWBR0012702#Artikel3
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0003245
        afdeling: '13.2'
      - id: ref3
        bwb_id: BWBR0012702
        artikel: '3'
        hoofdstuk: '1'
  - number: '46.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing voor ingekapselde bronnen met dien verstande dat de uitkomst niet
      meer bedraagt dan 107.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel46
  - number: '47.1'
    text: |-
      Indien op de voorbereiding van een beschikking terzake van een vergunning voor het verrichten van een handeling
      met radioactieve stoffen [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing is, worden, anders
      dan als adviseurs, betrokken: het college van gedeputeerde staten van de provincie, het college van burgemeester
      en wethouders van de gemeente waar de handeling wordt of zal worden verricht of, indien het een lozing in
      oppervlaktewateren betreft, het orgaan dat belast is met het kwalitatieve beheer van het oppervlaktewater waarin
      wordt of zal worden geloosd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '47.2'
    text: |-
      Indien op de voorbereiding van een beschikking terzake van een vergunning voor een handeling met een toestel
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing is, wordt, anders dan als adviseur, betrokken
      het college van burgemeester en wethouders van de gemeente waar de handeling wordt of zal worden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '47.3'
    text: |-
      Van de besluiten op aanvragen van vergunningen op de voorbereiding waarvan
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] niet van toepassing is, wordt door de Autoriteit mededeling
      gedaan in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 47a
    text: |-
      Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op de aanvraag om een
      vergunning als bedoeld in de [artikelen 23, eerste en tweede lid][ref3], [24][ref4], [25, eerste lid][ref5],
      [35, eerste lid][ref6], en [37, eerste lid][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
      [ref3]: https://wetten.overheid.nl/BWBR0012702#Artikel23
      [ref4]: https://wetten.overheid.nl/BWBR0012702#Artikel24
      [ref5]: https://wetten.overheid.nl/BWBR0012702#Artikel25
      [ref6]: https://wetten.overheid.nl/BWBR0012702#Artikel35
      [ref7]: https://wetten.overheid.nl/BWBR0012702#Artikel37
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel47a
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
      - id: ref3
        bwb_id: BWBR0012702
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref4
        bwb_id: BWBR0012702
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref5
        bwb_id: BWBR0012702
        artikel: '25'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref6
        bwb_id: BWBR0012702
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '4.4'
      - id: ref7
        bwb_id: BWBR0012702
        artikel: '37'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: '48.1'
    text: |-
      De ondernemer zorgt ervoor dat voor een lid van de bevolking als gevolg van handelingen, die onder zijn
      verantwoordelijkheid worden verricht, op enig punt buiten de locatie ten gevolge van die handelingen een effectieve
      dosis van 0,1 mSv in een kalenderjaar niet wordt overschreden.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel48
  - number: '48.2'
    text: |-
      Dit artikel is niet van toepassing voor personen, voor zover zij hulp en bijstand verlenen als bedoeld in
      [artikel 53, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel53
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '53'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: '49.1'
    text: |-
      De ondernemer zorgt ervoor dat voor een lid van de bevolking die zich binnen de locatie bevindt, als gevolg
      van handelingen, die onder zijn verantwoordelijkheid worden verricht, de volgende individuele doses niet worden
      overschreden:
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel49
  - number: 49.1.a
    text: 'een effectieve dosis van 1 mSv in een kalenderjaar en met inachtneming daarvan:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel49
  - number: 49.1.b
    text: 'een equivalente dosis van:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel49
  - number: 49.1.b.1°
    text: 15 mSv in een kalenderjaar in de ooglens, of
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel49
  - number: 49.1.b.2°
    text: 50 mSv in een kalenderjaar voor de huid gemiddeld over enig huidoppervlak van 1 cm2.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel49
  - number: '49.2'
    text: In het geval van inwendige besmetting wordt de effectieve volgdosis toegewezen aan het jaar van inname.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel49
  - number: '49.3'
    text: |-
      Dit artikel is niet van toepassing voor personen, voor zover zij hulp en bijstand verlenen als bedoeld in
      [artikel 53, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel53
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '53'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: '50.1'
    text: |-
      De ondernemer zorgt ervoor dat in omstandigheden waar een lid van de bevolking als gevolg van handelingen, die
      onder zijn verantwoordelijkheid worden verricht, aan besmetting of ioniserende straling binnen of buiten de
      locatie kan worden blootgesteld, voor de daarvoor in aanmerking komende plaatsen berekeningen van de effectieve of
      equivalente doses worden gemaakt en zo nodig metingen worden verricht.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel50
  - number: '50.2'
    text: |-
      De ondernemer houdt een administratie bij waarin hij de resultaten aantekent van de metingen en de berekeningen en
      gebruikt deze, indien nodig, voor het bepalen van de doses, bedoeld in het eerste lid en de [artikelen 48][ref1]
      en [49][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel49
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '48'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '49'
        hoofdstuk: '5'
  - number: '50.3'
    text: |-
      Bij verordening van de Autoriteit kunnen nadere regels worden gesteld voor de inhoud, het beheer en de
      bewaartermijn van de administratie.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel50
  - number: '51'
    text: |-
      Bij een ongeval of radiologische noodsituatie binnen zijn locatie zorgt de ondernemer ervoor dat, indien een
      lid van de bevolking, binnen of buiten de betrokken locatie, ten gevolge daarvan is of kan zijn blootgesteld,
      individuele monitoring wordt uitgevoerd of dat de effectieve of equivalente doses die door de betrokken persoon
      zijn ontvangen op een andere wijze worden bepaald.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel51
  - number: '52'
    text: 'In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel52
  - number: 52.a
    text: |-
      apparatuur: toestellen, ingekapselde bronnen en open bronnen alsmede bijbehorende apparaten zoals
      ontwikkelmachines, diagnostische monitoren, PET/CT-scanners en gammacamera's;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel52
  - number: 52.b
    text: |-
      behandelend arts: een arts of een tandarts onder wiens medische verantwoordelijkheid een blootstelling aan
      ioniserende straling plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel52
  - number: 52.c
    text: |-
      bevolkingsonderzoek: onderzoek onder risicogroepen van de bevolking waarbij ioniserende straling wordt toegepast
      met het doel een vroegtijdige diagnose te verkrijgen;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel52
  - number: 52.d
    text: |-
      diagnostische referentieniveaus: dosisniveaus in de medische radiodiagnostiek en bij gebruik van radiofarmaca,
      hoeveelheden toe te dienen radioactiviteit, voor karakteristieke onderzoeken van groepen patiënten van
      standaardgrootte of standaardfantomen voor globaal gedefinieerde soorten toestellen of apparaten;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel52
  - number: 52.e
    text: |-
      kwaliteitsborging: de geplande en systematische verrichtingen die noodzakelijk zijn om voldoende zekerheid te geven
      dat een structuur, systeem, onderdeel of procedure naar behoren en in overeenstemming met algemeen aanvaarde normen
      functioneren;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel52
  - number: 52.f
    text: |-
      medisch radiologische procedure: de procedure vanaf aanvrage tot en met uitvoering en resultaatbeschouwing van de
      radiologische verrichting;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel52
  - number: 52.g
    text: |-
      medisch juridisch onderzoek: radiologische verrichting zonder medische indicatie, uitsluitend ten behoeve van
      verzekeringstechnische of juridische doeleinden;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel52
  - number: 52.h
    text: |-
      medische verantwoordelijkheid: de verantwoordelijkheid van een arts of tandarts betreffende individuele
      radiologische verrichtingen, met name de rechtvaardiging, de optimalisatie en de klinische evaluatie van het
      resultaat;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel52
  - number: 52.i
    text: |-
      patiëntdosis: de dosis die betrekking heeft op een persoon die een blootstelling als bedoeld in
      [artikel 53, eerste lid][ref1], ondergaat;


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel53
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '53'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 52.j
    text: |-
      praktische aspecten: de feitelijke uitvoering van een blootstelling als bedoeld in [artikel 53, eerste lid][ref1],
      waaronder te verstaan: hanteren en gebruiken van radiologische apparatuur, beoordelen van technisch, fysische
      parameters, alsmede het beoordelen van patiëntdoses, ijking, onderhoud van apparatuur, bereiding en toediening van
      radiofarmaceutica en ontwikkeling van films;


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel53
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '53'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 52.k
    text: |-
      radiodiagnostisch: betrekking hebbend op in vivo diagnostische nucleaire geneeskunde, diagnostische en
      tandheelkundige radiologie;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel52
  - number: 52.l
    text: |-
      radiologisch: betrekking hebbend op radiodiagnostische en radiotherapeutische procedures en interventie-radiologie
      of andere plannings- of geleideradiologie;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel52
  - number: 52.m
    text: |-
      radiotherapeutisch: betrekking hebbend op radiotherapie, waaronder mede begrepen nucleaire geneeskunde voor
      therapeutische doeleinden;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel52
  - number: 52.n
    text: |-
      verwijzend beroepsbeoefenaar: een medisch beroepsbeoefenaar waaronder in ieder geval begrepen een arts, tandarts,
      verpleegkundig specialist of physician assistant, die een verrichting aanvraagt waarbij gebruik wordt gemaakt van
      ioniserende straling.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel52
  - number: '53.1'
    text: 'Dit hoofdstuk is van toepassing op radiologische verrichtingen voor personen die:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel53
  - number: 53.1.a
    text: als patiënt een blootstelling ondergaan;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel53
  - number: 53.1.b
    text: deelnemen aan een bevolkingsonderzoek;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel53
  - number: 53.1.c
    text: arbeidsgeneeskundig onderzoek ondergaan;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel53
  - number: 53.1.d
    text: medisch juridisch onderzoek ondergaan;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel53
  - number: 53.1.e
    text: vrijwillig deelnemen aan medische of biomedische onderzoeksprogramma's.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel53
  - number: '53.2'
    text: |-
      Dit hoofdstuk is tevens van toepassing op personen die willens en wetens- doch niet beroepshalve- hulp en bijstand
      verlenen aan diegene die, als bedoeld in het eerste lid, een blootstelling ondergaat.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel53
  - number: '54.1'
    text: |-
      De ondernemer zorgt ervoor dat een radiologische verrichting uitsluitend geschiedt onder medische
      verantwoordelijkheid van een behandelend arts die:
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel54
  - number: 54.1.a
    text: |-
      voldoet aan de bij regeling van Onze Minister van Volksgezondheid, Welzijn en Sport vastgestelde
      deskundigheidseisen, en
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel54
  - number: 54.1.b
    text: |-
      indien deze geen tandarts is, is ingeschreven in het krachtens
      [artikel 14 van de Wet op de beroepen in de individuele gezondheidszorg][ref1] ingesteld register voor medische
      specialisten.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel14
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '14'
  - number: '54.2'
    text: |-
      De deskundigheid, bedoeld in het eerste lid, onderdeel a, wordt behaald bij een erkende instelling als bedoeld in
      [artikel 7c, onderdeel a][ref1], dan wel een erkende of aangewezen instelling of opleiding als bedoeld in artikel
      7c, onderdeel b.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel7c
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: 7c
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '55.1'
    text: |-
      Een type radiologische verrichting is niet gerechtvaardigd, indien het totale mogelijke diagnostische of
      therapeutische voordeel, waaronder begrepen het directe nut voor de gezondheid van de persoon die de blootstelling
      ondergaat, en het maatschappelijk nut, niet opweegt tegen de gezondheidsschade die de persoon die de blootstelling
      ondergaat, kan ondervinden, mede in aanmerking genomen de doeltreffendheid, de voordelen en risico's van de
      beschikbare alternatieve technieken die hetzelfde oogmerk hebben maar geen of minder blootstelling met zich
      meebrengen.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel55
  - number: '55.2'
    text: |-
      Bij regeling van Onze Minister van Volksgezondheid, Welzijn en Sport kan worden vastgesteld welke typen van
      radiologische verrichtingen die blootstelling ingevolge het eerste lid niet rechtvaardigen, verboden zijn.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel55
  - number: '56.1'
    text: |-
      De verwijzend beroepsbeoefenaar en de behandelend arts beoordelen ieder op grond van hun specifieke
      verantwoordelijkheid of een individuele radiologische verrichting gerechtvaardigd is, met inachtneming van de
      specifieke oogmerken van de blootstelling en de kenmerken van de betrokken persoon.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel56
  - number: '56.2'
    text: |-
      In afwijking van [artikel 55, tweede lid][ref1], kan een radiologische verrichting die ingevolge dat lid
      verboden is, onder speciale omstandigheden, in afzonderlijk te beoordelen gevallen, toch gerechtvaardigd zijn.
      De afzonderlijke beoordeling van de hiervoor genoemde rechtvaardiging wordt geregistreerd in het dossier van
      betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel55
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '55'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '56.3'
    text: |-
      Een behandelend arts laat geen blootstelling van de persoon, bedoeld in [artikel 53, tweede lid][ref1], toe indien
      dit niet voldoende voordeel oplevert, rekening houdend met de schade voor de gezondheid van de persoon die de
      blootstelling ondergaat, het directe nut voor de gezondheid van de persoon, bedoeld in artikel 53, eerste lid, het
      maatschappelijk nut en de gezondheidsschade die de blootstelling kan veroorzaken.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel53
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '53'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: '57'
    text: 'De ondernemer zorgt ervoor dat de behandelend arts specifiek aandacht geeft aan de rechtvaardiging van:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel57
  - number: 57.a
    text: medisch juridisch onderzoek;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel57
  - number: 57.b
    text: medisch en biomedisch onderzoek.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel57
  - number: '58'
    text: |-
      De ondernemer zorgt ervoor dat voor blootstelling als bedoeld in [artikel 53, eerste lid][ref1], voor
      radiotherapeutische doeleinden de te bestralen doelvolumes op klinisch fysisch verantwoorde wijze individueel
      zullen worden gepland, in aanmerking nemende dat de patiëntdosis in het weefsel buiten het doelvolume zo laag als
      redelijkerwijs mogelijk dient te zijn, maar zonder aan het beoogde radiotherapeutische effect van de blootstelling
      afbreuk te doen.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel53
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '53'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: '59'
    text: |-
      Onze Minister van Volksgezondheid, Welzijn en Sport bevordert de vaststelling en het gebruik van diagnostische
      referentieniveaus voor radiodiagnostische verrichtingen als bedoeld in [artikel 53, eerste lid][ref1], alsmede het
      opstellen van protocollen terzake.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel53
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '53'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: '60'
    text: |-
      De ondernemer zorgt ervoor dat onverminderd het bepaalde in de
      [Wet medisch wetenschappelijk onderzoek met mensen][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0009408
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0009408
  - number: 60.a
    text: |-
      voor proefpersonen die zelf geen direct voordeel kunnen verwachten van de radiologische verrichting, een
      patiëntdosisbeperking wordt vastgesteld;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel60
  - number: 60.b
    text: |-
      indien de experimentele radiologische verrichting voor proefpersonen een voordeel beoogt, een op de proefpersoon
      gerichte planning van de experimentele verrichting plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel60
  - number: '61.1'
    text: |-
      Onze Minister van Volksgezondheid, Welzijn en Sport kan dosisbeperkingen vaststellen voor blootstellingen als
      bedoeld in [artikel 53, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel53
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '53'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: '61.2'
    text: |-
      Bij regeling van Onze Minister van Volksgezondheid, Welzijn en Sport kunnen, in overeenstemming met Onze Minister,
      regels worden gesteld voor de blootstellingen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel61
  - number: '62'
    text: |-
      De ondernemer zorgt ervoor dat, ingeval een persoon een onderzoek of behandeling met behulp van toegediende
      radionucliden ondergaat, aan de persoon of zijn wettelijk vertegenwoordiger in voorkomende gevallen schriftelijke
      instructies worden meegegeven. Tevens worden zij geïnformeerd over de risico's van de ioniserende straling voordat
      de betrokken persoon de locatie verlaat, teneinde de dosis voor anderen in contact met deze persoon zoveel als
      redelijkerwijs mogelijk is te beperken.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel62
  - number: '63'
    text: 'De ondernemer zorgt ervoor dat:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel63
  - number: 63.a
    text: |-
      personen die een opleiding volgen op het gebied van stralingstoepassingen en stralingsbescherming participeren in
      onderdelen van praktische aspecten ervan;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel63
  - number: 63.b
    text: |-
      indien de hiervoor genoemde participatie plaatsvindt onder verantwoordelijkheid van een arts, dit een arts is als
      bedoeld in [artikel 54][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel54
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '54'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 63.c
    text: |-
      voorafgaand aan de onder a genoemde participatie, schriftelijke instructies worden gegeven aan degene die de
      opleiding volgt, over de aard en de omvang van de deelname aan de praktische aspecten.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel63
  - number: '64.1'
    text: |-
      De ondernemer zorgt ervoor dat de toe te dienen activiteit bij nucleair geneeskundig onderzoek en therapie wordt
      gemeten met een dosiskalibrator.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel64
  - number: '64.2'
    text: |-
      Onze Minister van Volksgezondheid, Welzijn en Sport kan normen aanwijzen voor de nauwkeurigheid van de in het
      eerste lid bedoelde kalibrator.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel64
  - number: '65'
    text: |-
      De ondernemer zorgt ervoor dat voor elke standaard radiologische verrichting voor elke apparatuuropstelling
      schriftelijke protocollen worden opgesteld.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel65
  - number: '66'
    text: 'De ondernemer zorgt ervoor dat:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel66
  - number: 66.a
    text: bij radiotherapeutische verrichtingen een klinisch fysicus nauw wordt betrokken;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel66
  - number: 66.b
    text: |-
      bij standaard therapeutisch nucleairgeneeskundige verrichtingen en bij de diagnostische nucleairgeneeskundige
      verrichtingen een klinisch fysicus beschikbaar is;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel66
  - number: 66.c
    text: |-
      bij de overige radiologische verrichtingen een klinisch fysicus bereikbaar is voor advies over
      stralingsbeschermingsaspecten bij radiologische verrichtingen.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel66
  - number: '67.1'
    text: |-
      De ondernemer zorgt ervoor dat de radiologische apparatuur die wordt gebruikt bij radiologische verrichtingen
      op een verantwoorde wijze wordt gebruikt. Onze Minister van Volksgezondheid, Welzijn en Sport kan daartoe regels
      stellen.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel67
  - number: '67.2'
    text: 'De ondernemer zorgt ervoor dat op alle radiologische apparatuur die in gebruik is:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel67
  - number: 67.2.a
    text: streng toezicht wordt uitgeoefend inzake de stralingsbescherming;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel67
  - number: 67.2.b
    text: programma's voor kwaliteitsborging worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel67
  - number: 67.2.c
    text: |-
      noodzakelijke maatregelen worden genomen om inadequate of defecte onderdelen van radiologische apparatuur te
      repareren of te vervangen.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel67
  - number: '68'
    text: 'De ondernemer zorgt ervoor dat:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel68
  - number: 68.a
    text: |-
      indien nieuwe apparatuur in gebruik wordt genomen, deze, indien uitvoerbaar, een voorziening heeft die de
      stralingsdosis tijdens een radiologische verrichting aangeeft;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel68
  - number: 68.b
    text: |-
      bij een röntgentoestel waarmee radiodiagnostische verrichtingen worden toegepast, een filter wordt gebruikt
      teneinde de stralingsbelasting van de patiënt te beperken;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel68
  - number: 68.c
    text: |-
      een röntgentoestel beschikt over een vaste of automatische diafragma-instelling zodat de randen van de
      röntgenbundel zichtbaar zijn op de beelddrager, tenzij het mammografisch of tandheelkundig onderzoek betreft;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel68
  - number: 68.d
    text: |-
      een röntgentoestel waarmee radiodiagnostische verrichtingen worden toegepast is voorzien van een diafragma of tubus
      met het doel de röntgenbundel te beperken tot het juiste gebied;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel68
  - number: 68.e
    text: het diafragma een middel bevat om afmetingen van de bundel vooraf te kunnen aangeven.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel68
  - number: '69'
    text: 'De ondernemer zorgt ervoor dat:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel69
  - number: 69.a
    text: |-
      bij het onderzoeken met gebruikmaking van fluoroscopie een beeldversterker of gelijkwaardige techniek wordt
      gebruikt;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel69
  - number: 69.b
    text: |-
      fluoroscopische onderzoeken zonder voorzieningen voor de regeling van het dosistempo beperkt blijven tot de
      gevallen die de omstandigheden rechtvaardigen;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel69
  - number: 69.c
    text: toestellen, geschikt voor doorlichting, na elke vijf minuten cumulatief doorlichten een akoestisch signaal geven.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel69
  - number: '70'
    text: |-
      De ondernemer zorgt ervoor dat passende radiologische apparatuur, technieken en randapparatuur worden gebruikt voor
      radiologische verrichtingen bij:
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel70
  - number: 70.a
    text: kinderen;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel70
  - number: 70.b
    text: bevolkingsonderzoek;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel70
  - number: 70.c
    text: toediening aan de patiënt van een hoge dosis ioniserende straling.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel70
  - number: '71'
    text: |-
      De verwijzend beroepsbeoefenaar en de behandelend arts informeren bij een vrouw of er sprake is van zwangerschap en
      of er borstvoeding wordt gegeven, voordat een radiologische verrichting wordt uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel71
  - number: '72'
    text: |-
      Als zwangerschap niet kan worden uitgesloten of als een vrouw borstvoeding geeft, wordt, afhankelijk van het type
      blootstelling, speciale aandacht besteed aan:
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel72
  - number: 72.a
    text: de rechtvaardiging van de blootstelling, met name in verband met de urgentie;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel72
  - number: 72.b
    text: |-
      de optimalisatie van de stralingsbescherming, waarbij rekening wordt gehouden met de patiëntdosis voor zowel de
      vrouw als ook voor het ongeboren kind.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel72
  - number: '73.1'
    text: |-
      De ondernemer zorgt er voor dat zowel de kans op alsmede de gevolgen van een ongeval of een onbedoelde dosis van
      een radiologische verrichting zo klein als redelijkerwijs mogelijk zijn.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel73
  - number: '73.2'
    text: |-
      De ondernemer zorgt er voor dat ter beperking van risico's als bedoeld in het eerste lid, bij de apparatuur
      schriftelijke instructies en protocollen aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel73
  - number: '74.1'
    text: |-
      De ondernemer verstrekt aan Onze Minister van Volksgezondheid, Welzijn en Sport gegevens die nodig zijn om het
      gemiddelde en de spreiding van de effectieve of equivalente dosis bij radiologische verrichtingen voor de bevolking
      en andere relevante referentiegroepen te kunnen schatten.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel74
  - number: '74.2'
    text: |-
      Onze Minister van Volksgezondheid, Welzijn en Sport stelt regels ten aanzien van de verstrekking van de in het
      eerste lid bedoelde gegevens.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel74
  - number: '75'
    text: |-
      Onze Minister van Volksgezondheid, Welzijn en Sport kan regels stellen om onnodige verspreiding van radiologische
      apparatuur te voorkomen.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel75
  - number: '76.1'
    text: |-
      De ondernemer zorgt ervoor dat voor werknemers ten gevolge van handelingen die onder zijn verantwoordelijkheid
      worden verricht, de volgende doses niet worden overschreden:
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel76
  - number: 76.1.a
    text: 'een effectieve dosis van 1 mSv in een kalenderjaar, en met inachtneming daarvan:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel76
  - number: 76.1.b
    text: 'een equivalente dosis van:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel76
  - number: 76.1.b.1°
    text: 15 mSv in een kalenderjaar voor de ooglens, of
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel76
  - number: 76.1.b.2°
    text: 50 mSv in een kalenderjaar voor de huid, gemiddeld over enig blootgesteld huidoppervlak van 1 cm2.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel76
  - number: '76.2'
    text: In het geval van inwendige besmetting wordt de effectieve volgdosis toegewezen aan het jaar van inname.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel76
  - number: '77.1'
    text: |-
      De ondernemer zorgt ervoor dat voor blootgestelde werknemers ten gevolge van handelingen die onder zijn
      verantwoordelijkheid worden verricht, de volgende doses niet worden overschreden:
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel77
  - number: 77.1.a
    text: 'een effectieve dosis van 20 mSv in een kalenderjaar, en met inachtneming daarvan:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel77
  - number: 77.1.b
    text: 'een equivalente dosis van:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel77
  - number: 77.1.b.1°
    text: 150 mSv in een kalenderjaar voor de ooglens,
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel77
  - number: 77.1.b.2°
    text: 500 mSv in een kalenderjaar voor de huid, gemiddeld over enig blootgesteld huidoppervlak van 1 cm2, of
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel77
  - number: 77.1.b.3°
    text: 500 mSv in een kalenderjaar voor handen, onderarmen, voeten en enkels.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel77
  - number: '77.2'
    text: In het geval van inwendige besmetting wordt de effectieve volgdosis toegewezen aan het jaar van inname.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel77
  - number: '78.1'
    text: |-
      De ondernemer zorgt ervoor dat werknemers die jonger zijn dan 18 jaar geen werk krijgen toegewezen of verrichten,
      waardoor zij als blootgestelde werknemer worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel78
  - number: '78.2'
    text: |-
      Het eerste lid geldt niet indien deze werknemers ouder zijn dan 15 jaar en uit hoofde van hun opleiding verplicht
      zijn handelingen te verrichten en daarbij een blootstelling ondergaan die hoger is dan een der in artikel 76
      genoemde dosislimieten.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel78
  - number: '78.3'
    text: |-
      De ondernemer zorgt ervoor dat voor de in het tweede lid bedoelde personen ten gevolge van handelingen die onder
      zijn verantwoordelijkheid worden verricht, de volgende individuele doses niet worden overschreden:
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel78
  - number: 78.3.a
    text: 'een effectieve dosis van 6 mSv per kalenderjaar, en met inachtneming daarvan:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel78
  - number: 78.3.b
    text: 'een equivalente dosis van:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel78
  - number: 78.3.b.1°
    text: 50 mSv in een kalenderjaar voor de ooglens;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel78
  - number: 78.3.b.2°
    text: 150 mSv in een kalenderjaar voor de huid, gemiddeld over enig blootgesteld huidoppervlak van 1 cm2, of
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel78
  - number: 78.3.b.3°
    text: 150 mSv in een kalenderjaar voor handen, onderarmen, voeten en enkels.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel78
  - number: '78.4'
    text: In het geval van inwendige besmetting wordt de effectieve volgdosis toegewezen aan het jaar van inname.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel78
  - number: '79.1'
    text: |-
      De ondernemer deelt ten behoeve van de individuele monitoring en het toezicht blootgestelde werknemers in als A- of
      B-werknemer.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel79
  - number: '79.2'
    text: |-
      Een A-werknemer is een blootgestelde werknemer, die een effectieve dosis kan ontvangen die groter is dan 6 mSv
      in een kalenderjaar, of een equivalente dosis die groter is dan drie tiende van de in [artikel 77][ref1] genoemde
      dosislimieten.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel77
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '77'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '80.1'
    text: |-
      De ondernemer zorgt ervoor dat de arbeidsomstandigheden voor de zwangere werknemer zodanig zijn dat de equivalente
      dosis ten gevolge van het werk voor het ongeboren kind zo laag is als redelijkerwijs mogelijk is en dat het
      onwaarschijnlijk is dat deze dosis vanaf het moment van melding van de zwangerschap aan de ondernemer tot aan het
      einde van de zwangerschap 1 mSv zal overschrijden.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel80
  - number: '80.2'
    text: |-
      De ondernemer zorgt ervoor dat een werknemer, indien zij hem in kennis heeft gesteld dat zij borstvoeding geeft,
      gedurende deze periode geen handelingen verricht waarbij op basis van een risicoanalyse een relevant risico bestaat
      op radioactieve besmetting van het lichaam.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel80
  - number: '81.1'
    text: |-
      In uitzonderlijke omstandigheden, met uitzondering van radiologische noodsituaties, kan Onze Minister van Sociale
      Zaken en Werkgelegenheid, of bij mijnbouw, Onze Minister van Economische Zaken, op verzoek van de ondernemer
      ontheffing van de in [artikel 77][ref1] genoemde dosislimieten verlenen, mits


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel77
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '77'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 81.1.a
    text: het een A-werknemer betreft;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel81
  - number: 81.1.b
    text: de blootstelling geschiedt op basis van vrijwilligheid;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel81
  - number: 81.1.c
    text: de blootstelling beperkt is in tijd;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel81
  - number: 81.1.d
    text: de blootstelling alleen in nader vast te stellen ruimten plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel81
  - number: 81.1.e
    text: |-
      de mogelijk te ontvangen effectieve of equivalente dosis niet hoger is dan vijfmaal de in
      [artikel 77, eerste lid, onder a][ref1], respectievelijk tweemaal de in [artikel 77, eerste lid, onder b][ref2],
      vermelde waarden;


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel77
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel77
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '77'
        hoofdstuk: '7'
        paragraaf: '7.1'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '77'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 81.1.f
    text: het geen blootgestelde leerling of studerende, of zwangere vrouw betreft;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel81
  - number: 81.1.g
    text: het geen vrouw betreft die borstvoeding geeft terwijl er kans bestaat op besmetting van het lichaam;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel81
  - number: 81.1.h
    text: |-
      de blootstelling van te voren door de ondernemer wordt gemotiveerd en de blootstelling en de risico's
      van te voren door de ondernemer worden besproken met de betrokken werknemers, de ondernemingsraad of
      personeelsvertegenwoordiging, de stralingsarts en de deskundige, en
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel81
  - number: 81.1.i
    text: |-
      de betrokken werknemers tevoren door de ondernemer worden geïnformeerd over de tijdens de handelingen te nemen
      voorzorgsmaatregelen.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel81
  - number: '81.2'
    text: |-
      In de situatie, bedoeld in het eerste lid, rapporteert de ondernemer na afloop aan Onze Minister van Sociale Zaken
      en Werkgelegenheid, of bij mijnbouw aan Onze Minister van Economische Zaken, over de uitgevoerde handelingen, de
      wijze waarop bescherming tegen ioniserende straling is uitgevoerd en de door de werknemer ontvangen effectieve of
      equivalente dosis.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel81
  - number: '81.3'
    text: |-
      De ondernemer verstrekt de uitslag van de in het tweede lid berekende of bepaalde dosis aan de in
      [artikel 91, tweede lid][ref1], bedoelde instelling en aan de betrokken werknemer.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel91
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '91'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: '82.1'
    text: |-
      De ondernemer zorgt ervoor dat een persoon voor wie een ontheffing, als bedoeld in [artikel 81][ref1], is
      verleend indien ten gevolge van de in dat artikel bedoelde blootstelling een van de in [artikel 77][ref2] genoemde
      dosislimieten is overschreden, niet eerder weer aan ioniserende straling ten gevolge van handelingen die onder
      zijn verantwoordelijkheid worden verricht wordt blootgesteld, dan nadat door een stralingsarts is verklaard dat
      daartegen geen bezwaar bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel77
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '81'
        hoofdstuk: '7'
        paragraaf: '7.1'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '77'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '82.2'
    text: |-
      Tenzij de stralingsarts hiertoe adviseert, wordt de werknemer niet vanwege de in het eerste lid bedoelde
      overschrijding van de dosislimieten zonder diens toestemming van zijn normale beroepsbezigheden uitgesloten of op
      een andere plaats te werk gesteld.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel82
  - number: '83.1'
    text: 'De ondernemer zorgt ervoor dat, indien dat nodig is met het oog op de bescherming tegen ioniserende straling:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel83
  - number: 83.1.a
    text: 'een ruimte wordt aangemerkt als gecontroleerde zone, indien:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel83
  - number: 83.1.a.1°
    text: |-
      de mogelijk door een werknemer in de ruimte te ontvangen dosis gelijk is aan een effectieve dosis die hoger is
      dan 6 mSv in een kalenderjaar of een equivalente dosis die hoger is dan drie tiende van de dosis, genoemd in
      [artikel 77, eerste lid, onder b][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel77
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '77'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 83.1.a.2°
    text: |-
      er een mogelijkheid is van verspreiding van radioactieve stoffen vanuit de ruimte zodanig dat personen een dosis
      hoger dan een effectieve of equivalente dosis, genoemd in [artikel 76][ref1], kunnen ontvangen;


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel76
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '76'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 83.1.b
    text: |-
      een ruimte wordt aangemerkt als bewaakte zone, indien de mogelijk door een werknemer in de ruimte te ontvangen
      effectieve dosis hoger is dan 1 mSv in een kalenderjaar en lager dan 6 mSv in een kalenderjaar of de equivalente
      dosis hoger is dan die genoemd in [artikel 76, onder b][ref1], en lager dan die genoemd onder a, ten eerste.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel76
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '76'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '83.2'
    text: |-
      De ondernemer houdt in een gecontroleerde en in een bewaakte zone passend toezicht op de arbeidsomstandigheden met
      het oog op de bescherming tegen ioniserende straling.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel83
  - number: '83.3'
    text: |-
      De ondernemer zorgt ervoor dat de omvang en de kwaliteit van de maatregelen ten behoeve van de bescherming tegen
      ioniserende straling zijn afgestemd op de risico's die aan de bronnen en de betrokken handelingen verbonden zijn.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel83
  - number: '83.4'
    text: |-
      Indien uit een risicoanalyse blijkt dat een ruimte niet langer voldoet aan de criteria, bedoeld in het eerste
      lid, onder a of b, om als gecontroleerde zone, onderscheidenlijk bewaakte zone, te worden aangemerkt, zorgt de
      ondernemer ervoor dat de betrokken ruimte niet langer wordt aangemerkt als gecontroleerde zone, onderscheidenlijk
      bewaakte zone en dienen de handelingen met bronnen, voor zover deze plaats dienen te vinden in een gecontroleerde
      zone of bewaakte zone, in die ruimte te worden gestaakt.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel83
  - number: '84.1'
    text: 'Met betrekking tot een gecontroleerde zone zorgt de ondernemer ervoor dat:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel84
  - number: 84.1.a
    text: |-
      de zone is afgebakend en de toegang ertoe beperkt blijft tot door hem daartoe aangewezen personen en dat de zone
      wordt gecontroleerd overeenkomstig de door hem daartoe vastgestelde procedures;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel84
  - number: 84.1.b
    text: |-
      maatregelen zijn getroffen voor die gevallen waarin een aanzienlijk risico van verspreiding van radioactieve
      stoffen bestaat; deze maatregelen betreffen ook de toegang tot en het verlaten van de zone door personen en
      goederen;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel84
  - number: 84.1.c
    text: |-
      met inachtneming van de aard van de aanwezige bronnen en betrokken handelingen er een systeem van monitoring van de
      werkplek is;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel84
  - number: 84.1.d
    text: |-
      op de daarvoor geschikte plaatsen duidelijke waarschuwingsborden en -tekens met betrekking tot de zone en de
      risico's van ioniserende straling zijn aangebracht;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel84
  - number: 84.1.e
    text: |-
      aan personen die in de zone werkzaam zijn schriftelijke werkinstructies zijn gegeven, toegesneden op de risico's
      van ioniserende straling die aan de binnen de zone aanwezige bronnen en de aldaar te verrichten handelingen
      verbonden zijn.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel84
  - number: '84.2'
    text: |-
      Bij regeling van Onze Minister van Sociale Zaken en Werkgelegenheid kunnen nadere regels worden gesteld met
      betrekking tot een gecontroleerde zone als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel84
  - number: '85.1'
    text: 'Met betrekking tot een bewaakte zone zorgt de ondernemer ervoor dat:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel85
  - number: 85.1.a
    text: |-
      met inachtneming van de aard van de aanwezige bronnen en betrokken handelingen er een systeem van monitoring van de
      werkplek is;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel85
  - number: 85.1.b
    text: |-
      op de daarvoor geschikte plaatsen duidelijke waarschuwingsborden en -tekens en opschriften met betrekking tot de
      zone en de risico's van ioniserende straling zijn aangebracht;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel85
  - number: 85.1.c
    text: |-
      aan personen die in de zone werkzaam zijn schriftelijke werkinstructies zijn gegeven, toegesneden op de risico's
      van ioniserende straling die aan de bronnen en de betrokken handelingen verbonden zijn.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel85
  - number: '85.2'
    text: |-
      Bij regeling van Onze Minister van Sociale Zaken en Werkgelegenheid kunnen nadere regels worden gesteld met
      betrekking tot een bewaakte zone als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel85
  - number: '86'
    text: |-
      Ten behoeve van de uitvoering van de [artikelen 84][ref1] en [85][ref2] verricht de ondernemer, indien van
      toepassing, metingen binnen de bewaakte en gecontroleerde zone van:


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel84
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel85
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '84'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '85'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: 86.a
    text: de dosistempi, met opgave van de aard en de kwaliteit van de desbetreffende ioniserende straling, of
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel86
  - number: 86.b
    text: |-
      bij de aanwezigheid van open bronnen, de activiteitsconcentratie in de lucht en de oppervlaktebesmetting met opgave
      van de aard en de fysische en chemische toestand en vorm ervan.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel86
  - number: '87.1'
    text: |-
      De ondernemer stelt aan een blootgestelde werknemer een passend, persoonlijk dosiscontrolemiddel ter beschikking,
      die door de ondernemer wordt betrokken van een dosimetrische dienst als bedoeld in [artikel 8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel8
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '87.2'
    text: |-
      De ondernemer zorgt ervoor dat de persoonlijke dosiscontrolemiddelen door de blootgestelde werknemer
      gedurende de tijden van mogelijke blootstelling op de juiste plaats of plaatsen worden gedragen en dat deze
      dosiscontrolemiddelen periodiek worden uitgelezen.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel87
  - number: '87.3'
    text: |-
      De ondernemer zorgt ervoor dat de dosimetrische dienst periodiek, met behulp van de met deze dosiscontrolemiddelen
      verkregen gegevens, bepaalt in welke mate deze personen aan ioniserende straling blootgesteld zijn geweest.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel87
  - number: '87.4'
    text: |-
      De ondernemer zorgt ervoor dat voor gevallen waarin blootgestelde werknemers onder voor de werksituatie normale
      condities een relevante inwendige besmetting kunnen ontvangen, er een passend systeem voor de dosiscontrole is.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel87
  - number: '87.5'
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid kan nadere regels stellen met betrekking tot het bepaalde in
      dit artikel.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel87
  - number: '88.1'
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid of, bij mijnbouw, Onze Minister van Economische Zaken, of,
      indien het de krijgsmacht betreft een door Onze Minister van Defensie aan te wijzen autoriteit, kan, indien het
      meten van blootstelling aan ioniserende straling aan de hand van persoonlijke controlemiddelen niet of niet goed
      mogelijk is, of als op andere wijze de effectieve of equivalente dosis wordt bepaald, ontheffing verlenen van het
      bepaalde in [artikel 87][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel87
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '87'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: '88.2'
    text: |-
      Aan de ontheffing, bedoeld in het eerste lid, worden voorschriften verbonden die inhouden dat de effectieve of
      equivalente dosis geschat wordt aan de hand van de individuele metingen bij andere blootgestelde werknemers, of
      aan de hand van de in [artikel 86][ref1] bedoelde ruimtemonitoring, of in het geval van vliegtuigbemanningen op een
      wijze als bedoeld in [artikel 111, eerste lid, onder b][ref2], of op andere wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel86
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel111
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '86'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '111'
        hoofdstuk: '8'
        paragraaf: '8.3'
  - number: '88.3'
    text: |-
      Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op de aanvraag om een ontheffing
      als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '89.1'
    text: |-
      Indien een werknemer bij een ongeval aan ioniserende straling in het kader van een handeling is of kan zijn
      blootgesteld, zorgt de ondernemer ervoor dat de effectieve of equivalente doses worden bepaald, die door de
      betrokken werknemer zijn ontvangen.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel89
  - number: '89.2'
    text: |-
      Indien een werknemer bij een radiologische noodsituatie aan ioniserende straling is of kan zijn blootgesteld,
      zorgt de ondernemer die voor de handeling die de radiologische noodsituatie heeft veroorzaakt verantwoordelijk is,
      ervoor dat individuele monitoring wordt uitgevoerd of dat de effectieve of equivalente doses die door de betrokken
      werknemer zijn ontvangen, op een andere wijze worden bepaald.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel89
  - number: '90.1'
    text: 'De ondernemer zorgt ervoor dat afzonderlijk van iedere blootgestelde werknemer wordt geregistreerd:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel90
  - number: 90.1.a
    text: de naam, de geboortedatum en het geslacht;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel90
  - number: 90.1.b
    text: indeling in categorie A- of B- werknemer;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel90
  - number: 90.1.c
    text: |-
      de gemeten of bepaalde doses op grond van de [artikelen 87 tot en met 89][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel87
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '87'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: 90.1.d
    text: de resultaten van de ruimtemonitoring die zijn gebruikt bij de berekening van de effectieve of equivalente doses;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel90
  - number: 90.1.e
    text: |-
      in het geval van de in de [artikelen 81][ref1] en [89][ref2] bedoelde blootstelling, de rapporten met betrekking
      tot de omstandigheden en de genomen maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel89
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '81'
        hoofdstuk: '7'
        paragraaf: '7.1'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '89'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: '90.2'
    text: |-
      De ondernemer zorgt ervoor dat de gegevens, bedoeld in het eerste lid, onder c en d, in ieder geval ten minste
      dertig jaar nadat deze persoon de handelingen heeft beëindigd, worden bewaard of zoveel langer totdat de persoon op
      wie de gegevens betrekking hebben de leeftijd van vijfenzeventig jaar heeft bereikt of zou hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel90
  - number: '91.1'
    text: |-
      Er is een dosisregistratiesysteem voor het bewaren van de uitslagen van de gemeten of bepaalde doses, bedoeld in de
      [artikelen 87][ref1], [88][ref2] en [89][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel87
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel88
      [ref3]: https://wetten.overheid.nl/BWBR0012702#Artikel89
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '87'
        hoofdstuk: '7'
        paragraaf: '7.3'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '88'
        hoofdstuk: '7'
        paragraaf: '7.3'
      - id: ref3
        bwb_id: BWBR0012702
        artikel: '89'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: '91.2'
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid wijst een instelling aan die belast is met het beheer van het in
      het eerste lid bedoelde systeem en kan nadere regels stellen met betrekking tot de inrichting van het systeem.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel91
  - number: '91.3'
    text: |-
      De in het tweede lid bedoelde instelling bewaart de geregistreerde gegevens in ieder geval totdat de persoon op
      wie de gegevens betrekking hebben de leeftijd van vijfenzeventig jaar heeft bereikt of zou hebben bereikt, maar ten
      minste dertig jaar nadat deze persoon de handelingen heeft beëindigd.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel91
  - number: '91.4'
    text: |-
      Bij de verwerking van persoonsgegevens in het systeem, bedoeld in het eerste lid, kan de in het tweede lid bedoelde
      instelling gebruik maken van het burgerservicenummer of, bij het ontbreken daarvan, het sociaal-fiscaalnummer met
      het oog op de vaststelling van de identiteit van de persoon, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel91
  - number: '91.5'
    text: |-
      Bij regeling van Onze Minister van Sociale Zaken en Werkgelegenheid kunnen nadere regels worden gesteld over de
      werkwijze, de toegankelijkheid en het beheer van het registratiesysteem.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel91
  - number: '92.1'
    text: |-
      De ondernemer zorgt ervoor dat de uitslag van de individuele monitoring, bedoeld in de [artikelen 87][ref1],
      [88][ref2] en [89][ref3], aan de in [artikel 91][ref4] bedoelde instelling wordt gezonden. De ondernemer geeft
      daarbij aan waar de individuele dosismeter is gedragen of op welke wijze de inwendige besmetting is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel87
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel88
      [ref3]: https://wetten.overheid.nl/BWBR0012702#Artikel89
      [ref4]: https://wetten.overheid.nl/BWBR0012702#Artikel91
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '87'
        hoofdstuk: '7'
        paragraaf: '7.3'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '88'
        hoofdstuk: '7'
        paragraaf: '7.3'
      - id: ref3
        bwb_id: BWBR0012702
        artikel: '89'
        hoofdstuk: '7'
        paragraaf: '7.3'
      - id: ref4
        bwb_id: BWBR0012702
        artikel: '91'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: '92.2'
    text: De werknemer heeft inzage in de gegevens die zijn blootstelling betreffen.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel92
  - number: '93.1'
    text: |-
      De ondernemer zorgt ervoor dat de uitslag van de individuele monitoring, bedoeld in de [artikelen 87][ref1],
      [88][ref2] en [89][ref3], wordt verstrekt aan:


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel87
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel88
      [ref3]: https://wetten.overheid.nl/BWBR0012702#Artikel89
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '87'
        hoofdstuk: '7'
        paragraaf: '7.3'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '88'
        hoofdstuk: '7'
        paragraaf: '7.3'
      - id: ref3
        bwb_id: BWBR0012702
        artikel: '89'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: 93.1.a
    text: de betrokken werknemer;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel93
  - number: 93.1.b
    text: de algemeen coördinerend deskundige, coördinerend deskundige of toezichthoudend deskundige;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel93
  - number: 93.1.c
    text: indien het een A-werknemer betreft, de stralingsarts.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel93
  - number: '93.2'
    text: |-
      De ondernemer meldt de uitslag van de individuele monitoring, bedoeld in [artikel 89][ref1], onverwijld aan de in
      het eerste lid bedoelde personen of dienst en aan Onze Minister van Sociale Zaken en Werkgelegenheid of, indien het
      mijnbouw betreft, Onze Minister van Economische Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel89
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '89'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: '94.1'
    text: |-
      Het is de ondernemer van een in Nederland gevestigde onderneming verboden een werknemer, die niet in het bezit is
      van een geldig stralingspaspoort en een persoonlijk controlemiddel, in een andere lidstaat van de Europese Unie
      handelingen als A-werknemer te laten verrichten.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel94
  - number: '94.2'
    text: |-
      Het stralingspaspoort wordt op aanvraag door Onze Minister van Sociale Zaken en Werkgelegenheid, of een door hem
      daartoe aangewezen instelling, afgegeven aan een ondernemer ten behoeve van diens werknemer.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel94
  - number: '94.3'
    text: |-
      De ondernemer zorgt ervoor dat een werknemer de blootstellingsgegevens afkomstig van de handelingen als A-werknemer
      in het buitenland door de buitenlandse ondernemer in zijn stralingspaspoort laat aantekenen en dat hij zijn
      persoonlijk controlemiddel gebruikt tijdens deze handelingen in het buitenland.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel94
  - number: '94.4'
    text: |-
      Bij terugkeer van de werknemer in Nederland meldt de ondernemer onverwijld de gegevens uit het stralingspaspoort
      aan de in [artikel 91][ref1] bedoelde instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel91
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '91'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: '94.5'
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid kan met betrekking tot het bepaalde in dit artikel nadere regels
      stellen die onder meer betrekking hebben op het model van het stralingspaspoort en op de aanvraag, de kosten, het
      verlies of het in het ongerede raken van het stralingspaspoort.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel94
  - number: '95.1'
    text: |-
      Het is de ondernemer verboden om een externe werknemer onder zijn verantwoordelijkheid in Nederland of op het
      Nederlands continentaal plat handelingen te laten verrichten, indien deze werknemer niet in het bezit is van een
      geldig stralingspaspoort, verstrekt door een overheidsinstantie van de lidstaat van de ondernemer van de externe
      werknemer in wiens opdracht de externe werknemer handelingen verricht.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel95
  - number: '95.2'
    text: |-
      De ondernemer registreert de uitslag van de individuele monitoring, bedoeld in de [artikelen 81][ref1], [87][ref2],
      [88][ref3] en [89][ref4], onverwijld na beëindiging van de handelingen in het stralingspaspoort.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel87
      [ref3]: https://wetten.overheid.nl/BWBR0012702#Artikel88
      [ref4]: https://wetten.overheid.nl/BWBR0012702#Artikel89
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '81'
        hoofdstuk: '7'
        paragraaf: '7.1'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '87'
        hoofdstuk: '7'
        paragraaf: '7.3'
      - id: ref3
        bwb_id: BWBR0012702
        artikel: '88'
        hoofdstuk: '7'
        paragraaf: '7.3'
      - id: ref4
        bwb_id: BWBR0012702
        artikel: '89'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: '96.1'
    text: De ondernemer zorgt ervoor dat een stralingsarts het medisch toezicht op A-werknemers uitoefent.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel96
  - number: '96.2'
    text: |-
      De ondernemer zorgt er voor dat aan de stralingsarts alle tot zijn beschikking staande gegevens worden verstrekt
      die deze nodig heeft om inzicht te krijgen in de gezondheidstoestand van de onder zijn toezicht staande personen en
      om zich een oordeel te vormen over de omstandigheden op de arbeidsplaats voor zover deze van invloed kunnen zijn op
      hun gezondheidstoestand.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel96
  - number: '96.3'
    text: 'Het in het eerste lid bedoelde medisch toezicht omvat:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel96
  - number: 96.3.a
    text: |-
      een medisch onderzoek dat plaatsvindt voor de aanwijzing als A-werknemer en ten doel heeft na te gaan of de
      werknemer geschikt is voor zijn functie;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel96
  - number: 96.3.b
    text: |-
      periodieke keuringen waarbij ten minste eenmaal per jaar wordt nagegaan of de A-werknemer nog geschikt is voor het
      uitvoeren van zijn functie;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel96
  - number: 96.3.c
    text: |-
      onderzoek van personen die niet langer werkzaam zijn als A-werknemer, indien en zolang de stralingsarts dit
      noodzakelijk acht.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel96
  - number: '96.4'
    text: |-
      Indien de stralingsarts dat noodzakelijk acht, wordt een medisch onderzoek gevolgd door maatregelen van de
      ondernemer in verband met de bescherming van de gezondheid van de werknemer.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel96
  - number: '97.1'
    text: |-
      De ondernemer zorgt ervoor dat een stralingsarts met betrekking tot de geschiktheid van A-werknemers voor de
      aanwijzing als A-werknemer op basis van het medisch onderzoek de volgende indeling toepast:
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel97
  - number: 97.1.a
    text: geschikt;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel97
  - number: 97.1.b
    text: onder bepaalde omstandigheden geschikt, of
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel97
  - number: 97.1.c
    text: ongeschikt.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel97
  - number: '97.2'
    text: |-
      De stralingsarts deelt de indeling van de geschiktheid, bedoeld in het eerste lid, onverwijld schriftelijk mee aan
      degene die het onderzoek heeft ondergaan.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel97
  - number: '97.3'
    text: |-
      Degene die het onderzoek heeft ondergaan kan binnen zes weken na de ontvangst van de mededeling bedoeld in
      het tweede lid een nieuw onderzoek verzoeken aan Onze Minister van Sociale Zaken en Werkgelegenheid, of bij
      mijnbouw aan Onze Minister van Economische Zaken. De betrokken minister deelt de uitslag van het nieuwe onderzoek
      schriftelijk mee aan de onderzochte persoon, aan de stralingsarts en aan de ondernemer.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel97
  - number: '98'
    text: |-
      Een werknemer wordt niet in een specifieke functie als A-werknemer tewerkgesteld indien hij blijkens de uitslag van
      het in [artikel 97, eerste lid][ref1], bedoelde medisch onderzoek ongeschikt is voor deze functie.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel97
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '97'
        hoofdstuk: '7'
        paragraaf: '7.5'
  - number: '99'
    text: |-
      Een medisch onderzoek door een stralingsarts vindt voorts plaats indien daartoe door een blootstelling waarbij
      dosislimieten zijn overschreden of door een blootstelling door een ongeval of een radiologische noodsituatie
      aanleiding bestaat.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel99
  - number: '100.1'
    text: |-
      De ondernemer zorgt ervoor dat er een medisch dossier wordt bijgehouden waarin van elke A-werknemer ten minste
      wordt geregistreerd:
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel100
  - number: 100.1.a
    text: de aard van het werk;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel100
  - number: 100.1.b
    text: |-
      de uitslagen van de onderzoeken, bedoeld in de [artikelen 96][ref1], [97][ref2] en [99][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel96
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel97
      [ref3]: https://wetten.overheid.nl/BWBR0012702#Artikel99
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '96'
        hoofdstuk: '7'
        paragraaf: '7.5'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '97'
        hoofdstuk: '7'
        paragraaf: '7.5'
      - id: ref3
        bwb_id: BWBR0012702
        artikel: '99'
        hoofdstuk: '7'
        paragraaf: '7.5'
  - number: 100.1.c
    text: |-
      de resultaten van de individuele monitoring, bedoeld in de [artikelen 81][ref1], [87][ref2], [88][ref3] en
      [89][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel87
      [ref3]: https://wetten.overheid.nl/BWBR0012702#Artikel88
      [ref4]: https://wetten.overheid.nl/BWBR0012702#Artikel89
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '81'
        hoofdstuk: '7'
        paragraaf: '7.1'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '87'
        hoofdstuk: '7'
        paragraaf: '7.3'
      - id: ref3
        bwb_id: BWBR0012702
        artikel: '88'
        hoofdstuk: '7'
        paragraaf: '7.3'
      - id: ref4
        bwb_id: BWBR0012702
        artikel: '89'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: 100.1.d
    text: indien van toepassing de gegevens met betrekking tot een radiologische noodsituatie.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel100
  - number: '100.2'
    text: |-
      De ondernemer zorgt ervoor dat het medisch dossier, bedoeld in het eerste lid, in ieder geval wordt bewaard totdat
      de persoon op wie de gegevens betrekking hebben de leeftijd van vijfenzeventig jaar heeft bereikt of zou hebben
      bereikt, maar ten minste dertig jaar nadat deze persoon de handelingen heeft beëindigd.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel100
  - number: '101'
    text: |-
      Met betrekking tot werkzaamheden zijn de bepalingen van dit besluit die betrekking hebben op handelingen met
      radioactieve stoffen, met uitzondering van de [artikelen 27 tot en met 29][ref1] en [hoofdstuk 6][ref2], van
      overeenkomstige toepassing, voor zover daarvan in dit hoofdstuk niet wordt afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '27'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0012702
        hoofdstuk: '6'
  - number: '102.1'
    text: |-
      De Autoriteit maakt in de Staatscourant een lijst van werkzaamheden bekend, waarvan het mogelijk is dat bij het
      verrichten van die werkzaamheden de krachtens [artikel 3, eerste lid, aanhef en onder c][ref1], vastgestelde
      waarden worden overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel3
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '3'
        hoofdstuk: '1'
  - number: '102.2'
    text: |-
      Voordat een ondernemer een werkzaamheid gaat verrichten die op de in het eerste lid bedoelde lijst staat vermeld,
      gaat hij na of deze werkzaamheid overeenkomstig [artikel 103][ref1] moet worden gemeld dan wel dat daarvoor
      overeenkomstig de [artikelen 107][ref2] en [108][ref3] een vergunning is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel103
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel107
      [ref3]: https://wetten.overheid.nl/BWBR0012702#Artikel108
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '103'
        hoofdstuk: '8'
        paragraaf: '8.2'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '107'
        hoofdstuk: '8'
        paragraaf: '8.2'
      - id: ref3
        bwb_id: BWBR0012702
        artikel: '108'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: '103.1'
    text: |-
      De ondernemer meldt aan de Autoriteit een werkzaamheid, niet zijnde een lozing, voordat met de uitvoering daarvan
      wordt begonnen.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel103
  - number: '103.2'
    text: 'Deze verplichting geldt niet, indien binnen een locatie:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel103
  - number: 103.2.a
    text: 'het een werkzaamheid betreft waarbij:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel103
  - number: 103.2.a.1°
    text: |-
      de activiteit van de radionucliden in de betrokken natuurlijke bronnen steeds lager is dan de krachtens
      [artikel 3, eerste lid, aanhef en onder c][ref1], vastgestelde waarde, of


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel3
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '3'
        hoofdstuk: '1'
  - number: 103.2.a.2°
    text: |-
      de activiteitsconcentratie van de betrokken natuurlijke bronnen lager is dan de krachtens
      [artikel 3, eerste lid, aanhef en onder c][ref1], vastgestelde waarde;


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel3
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '3'
        hoofdstuk: '1'
  - number: 103.2.b
    text: |-
      het een werkzaamheid betreft waarvoor ingevolge [artikel 107][ref1] een vergunning is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel107
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '107'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: '103.3'
    text: |-
      [Artikel 25, derde, vierde, zesde, zevende en achtste lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel25
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '25'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '103.4'
    text: |-
      Bij regeling van Onze Minister kan worden bepaald dat in daarbij aangegeven gevallen met het oog op de
      stralingsbescherming het tweede lid niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel103
  - number: '103.5'
    text: |-
      De in het eerste lid gestelde verplichting geldt niet voor werkzaamheden indien de aanvraag om een vergunning als
      bedoeld in dit besluit gegevens als bedoeld bij of krachtens [artikel 40, tweede lid][ref1], omtrent deze bronnen
      bevat.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel40
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '40'
        hoofdstuk: '4'
        paragraaf: '4.6'
  - number: '103.6'
    text: |-
      Bij regeling van Onze Minister kan worden bepaald in welke gevallen vrijstelling geldt van de in het eerste lid
      gestelde verplichting met betrekking tot daarbij aangewezen werkzaamheden, indien een zodanige werkzaamheid al is
      gemeld door een andere ondernemer en aan bij de regeling gestelde regels is voldaan.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel103
  - number: '104'
    text: |-
      Indien een werkzaamheid niet meer wordt verricht, meldt de ondernemer dit aan de Autoriteit zo spoedig mogelijk na
      het beëindigen van de werkzaamheid.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel104
  - number: '107.1'
    text: Het is verboden zonder vergunning van de Autoriteit een werkzaamheid, niet zijnde een lozing, te verrichten.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel107
  - number: '107.2'
    text: 'Het in het eerste lid gestelde verbod geldt binnen een locatie niet, indien:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel107
  - number: 107.2.a
    text: |-
      de activiteit van de radionucliden in de bij die werkzaamheid betrokken natuurlijke bronnen lager is dan de
      krachtens [artikel 3, eerste lid, aanhef en onder c][ref1], vastgestelde waarde, of


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel3
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '3'
        hoofdstuk: '1'
  - number: 107.2.b
    text: |-
      de activiteitsconcentratie van de bij die werkzaamheid betrokken natuurlijke bronnen lager is dan tienmaal de
      krachtens [artikel 3, eerste lid, aanhef en onder c][ref1], vastgestelde waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel3
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '3'
        hoofdstuk: '1'
  - number: '107.3'
    text: |-
      [Artikel 25, derde, vierde, zesde, zevende en achtste lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel25
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '25'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '107.4'
    text: |-
      Bij regeling van Onze Minister kan worden bepaald dat in daarbij aangegeven gevallen met het oog op de
      stralingsbescherming, het tweede lid niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel107
  - number: '107.5'
    text: |-
      Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op de aanvraag om een vergunning
      als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '108.1'
    text: |-
      Het is verboden zonder vergunning van de Autoriteit natuurlijke bronnen te lozen of een werkzaamheid te verrichten
      ten gevolge waarvan natuurlijke bronnen worden geloosd.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel108
  - number: '108.2'
    text: |-
      Het in het eerste lid gestelde verbod geldt niet indien de activiteit van de in een kalenderjaar te lozen
      radionucliden die in de regeling, bedoeld in [artikel 3, eerste lid][ref1], zijn aangewezen, bij het verlaten van
      de locatie lager is dan de daarbij in die regeling aangegeven waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel3
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '3'
        hoofdstuk: '1'
  - number: '108.3'
    text: |-
      [Artikel 25, derde, vierde, zesde, zevende en achtste lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel25
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '25'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '108.4'
    text: |-
      Bij regeling van Onze Minister kan worden bepaald dat in daarbij aangegeven gevallen met het oog op de
      stralingsbescherming, het tweede lid niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel108
  - number: '108.5'
    text: |-
      Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op de aanvraag om een vergunning
      als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '109'
    text: |-
      Bij verordening van de Autoriteit worden regels gesteld over de aanvraag van een vergunning voor een werkzaamheid
      als bedoeld in de [artikelen 107][ref1] en [108][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel107
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel108
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel109
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '107'
        hoofdstuk: '8'
        paragraaf: '8.2'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '108'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: '110.1'
    text: |-
      Bij verordening van de Autoriteit kunnen, indien dat naar het oordeel van de Autoriteit met het oog op
      rechtvaardiging en optimalisatie noodzakelijk is, regels worden gesteld met betrekking tot de uitvoering van
      daarbij aangegeven werkzaamheden die overeenkomstig [artikel 103][ref1] worden gemeld.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel103
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '103'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: '110.2'
    text: |-
      Bij verordening van de Autoriteit kunnen regels worden gesteld met betrekking tot product- of materiaalhergebruik
      en opslag van afval van natuurlijke bronnen, voor categorieën van gevallen waarin de activiteitsconcentratie
      in combinatie met de totale activiteit van de betrokken natuurlijke bronnen hoger is dan de krachtens
      [artikel 3][ref1] vastgestelde waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel3
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '3'
        hoofdstuk: '1'
  - number: '110.3'
    text: |-
      [Artikel 25, derde, vierde, zevende en achtste lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel25
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '25'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 110a.1
    text: |-
      Het is verboden radioactieve afvalstoffen afkomstig van natuurlijke bronnen te mengen zodanig dat de
      activiteitsconcentratie van die afvalstoffen gebracht wordt:
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel110a
  - number: 110a.1.a
    text: |-
      beneden tienmaal de krachtens [artikel 3, eerste lid, aanhef en onder c][ref1], aangewezen waarden, of


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel3
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel110a
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '3'
        hoofdstuk: '1'
  - number: 110a.1.b
    text: |-
      beneden de krachtens [artikel 3, eerste lid, aanhef en onder c][ref1], aangewezen waarden.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel3
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel110a
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '3'
        hoofdstuk: '1'
  - number: 110a.2
    text: |-
      Onverminderd het bepaalde in de [artikelen 103][ref1] en [107][ref2] geldt het verbod, bedoeld in het eerste lid,
      niet, indien wordt aangetoond dat het mengen geen groter gevaar, grotere schade of meer hinder veroorzaakt dan in
      het geval de radioactieve afvalstoffen afkomstig van natuurlijke bronnen niet zouden worden gemengd.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel103
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel107
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel110a
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '103'
        hoofdstuk: '8'
        paragraaf: '8.2'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '107'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: '111.1'
    text: |-
      In afwijking van de [artikelen 102 tot en met 110][ref1] zorgt de ondernemer ervoor dat met betrekking tot een
      blootgestelde werknemer die deel uitmaakt van een vliegtuigbemanning:


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel102
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '102'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: 111.1.a
    text: |-
      deze voor zijn indiensttreding of tewerkstelling als zodanig wordt voorgelicht omtrent de risico's van kosmische
      straling;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel111
  - number: 111.1.b
    text: |-
      de grootte van de door hem ontvangen effectieve dosis ten gevolge van kosmische straling wordt bepaald door middel
      van een door Onze Minister van Sociale Zaken en Werkgelegenheid vastgestelde methode;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel111
  - number: 111.1.c
    text: |-
      indien een effectieve dosis van 6 mSv in een kalenderjaar kan worden overschreden, ter voldoening aan de
      in [artikel 5][ref1] gestelde verplichting een aangepast werkrooster wordt vastgesteld en uitgevoerd en de
      desbetreffende werknemer wordt ingedeeld als A-werknemer;


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel5
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '5'
        hoofdstuk: '2'
  - number: 111.1.d
    text: |-
      de door hem ten gevolge van kosmische straling ontvangen effectieve dosis tezamen met de effectieve doses ten
      gevolge van handelingen en werkzaamheden die onder verantwoordelijkheid van de ondernemer worden verricht, 20 mSv
      in een kalenderjaar niet overschrijdt.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel111
  - number: '111.2'
    text: |-
      De [artikelen 15, eerste en vijfde lid][ref1], [16][ref2], [17][ref3], [79][ref4], [80][ref5], [90][ref6],
      [91][ref7], [92, tweede lid][ref8], en [96 tot en met 100][ref9] zijn van overeenkomstige toepassing.
      [Artikel 92, eerste lid][ref10], is van overeenkomstige toepassing, met dien verstande dat in plaats van «de
      uitslag van de individuele monitoring, bedoeld in de [artikelen 87][ref11], [88][ref12] en [89][ref13]» wordt
      gelezen: de uitslag van de individuele monitoring, bedoeld in [artikel 111, eerste lid][ref14].


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel15
