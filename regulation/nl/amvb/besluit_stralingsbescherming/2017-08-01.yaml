        paragraaf: '7.4'
  - number: 131.c
    text: |-
      de beschikkingen krachtens artikel 25, eerste lid, juncto artikel 81, eerste lid van het Besluit stralenbescherming
      Kernenergiewet, zoals dat besluit luidde tot 1 maart 2002, op [artikel 8, eerste lid][ref1], van dit besluit;


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel8
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 131.d
    text: |-
      de Regeling aanwijzing Elektronenmicroscopen Kernenergiewet 1998 op [artikel 21, tweede lid, onder d][ref1], van
      dit besluit;


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel21
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel131
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '21'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 131.e
    text: |-
      de Regeling aanwijzing rookmelders Kernenergiewet 2000-II op [artikel 26, tweede lid][ref1], van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel26
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel131
    references:
      - id: ref1
