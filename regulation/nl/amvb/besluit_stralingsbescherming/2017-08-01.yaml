  - number: 2.b
    text: |-
      het vervoeren van radioactieve stoffen buiten een locatie en het binnen of buiten Nederlands grondgebied brengen of
      doen brengen daarvan;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel2
  - number: 2.c
    text: het vervoeren van toestellen, die tijdens vervoer niet gebruikt worden;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel2
  - number: 2.d
    text: handelingen met een toestel met een maximale hoogspanning van 5 kV;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel2
  - number: 2.e
    text: |-
      blootstelling aan radon en dochternucliden, afkomstig uit de onverstoorde aardkorst of uit bouwmaterialen gebruikt
      in gebouwen;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel2
  - number: 2.f
    text: |-
      bovengrondse blootstelling aan radionucliden die zich bevinden in de onverstoorde aardkorst of in bouwmaterialen
      gebruikt in gebouwen;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel2
  - number: 2.g
    text: ioniserende straling ten gevolge van radionucliden die van nature in het menselijk lichaam aanwezig zijn;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel2
  - number: 2.h
    text: kosmische straling ter hoogte van het aardoppervlak;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel2
  - number: 2.i
    text: |-
      kosmische straling in een vliegtuig voor leden van de bevolking en voor werknemers, die niet behoren tot de
      vliegtuigbemanning;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel2
  - number: 2.j
    text: blootstelling aan radon en dochternucliden die vrijkomen bij het verbranden of afblazen van aardgas.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel2
  - number: '3.1'
    text: 'Bij verordening van de Autoriteit worden regels gesteld:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel3
  - number: 3.1.a
    text: voor de bepaling van de omgevingsdosisequivalenten;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel3
  - number: 3.1.b
    text: voor de bepaling van de equivalente en de effectieve doses;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel3
  - number: 3.1.c
    text: met betrekking tot de waarden voor de activiteitsconcentraties en de totale activiteit voor radionucliden;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel3
  - number: 3.1.d
    text: |-
      betreffende de aanwijzing van radionucliden die bij de toetsing van natuurlijke bronnen zijn vrijgesteld van
      sommatie;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel3
  - number: 3.1.e
    text: voor de bepaling van het activiteitsniveau van radionucliden.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel3
  - number: '3.2'
    text: 'Bij verordening van de Autoriteit kunnen:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel3
  - number: 3.2.a
    text: |-
      methoden worden aangewezen voor de wijze waarop de in het eerste lid, onder b, bedoelde doses worden getoetst aan
      de in dit besluit genoemde doses;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel3
  - number: 3.2.b
    text: regels worden gesteld voor de meetmethoden van activiteiten, activiteitsconcentraties of oppervlaktebesmetting.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel3
  - number: '3.3'
    text: |-
      Ten behoeve van de bepaling van doses worden alle effectieve of equivalente doses gesommeerd
      die een persoon ontvangt ten gevolge van handelingen en werkzaamheden, voor zover geregeld
      bij of krachtens dit besluit, met uitzondering van een radiologische verrichting, bij of
      krachtens het [Besluit kerninstallaties, splijtstoffen en ertsen][ref1] en bij of krachtens het
      [Besluit vervoer splijtstoffen, ertsen en radioactieve stoffen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002667
      [ref2]: https://wetten.overheid.nl/BWBR0002668
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002667
      - id: ref2
        bwb_id: BWBR0002668
  - number: '3.4'
    text: |-
      Ten behoeve van de toetsing aan de krachtens het eerste lid, onder c, vastgestelde waarden worden alle activiteiten
      die zich op enig moment binnen een locatie bevinden of worden geloosd, gewogen en gesommeerd voor zover geregeld
      bij of krachtens dit besluit, bij of krachtens het [Besluit kerninstallaties, splijtstoffen en ertsen][ref1] en bij
      of krachtens het [Besluit vervoer splijtstoffen, ertsen en radioactieve stoffen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002667
      [ref2]: https://wetten.overheid.nl/BWBR0002668
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002667
      - id: ref2
        bwb_id: BWBR0002668
  - number: '3.5'
    text: |-
      In afwijking van het vierde lid worden de activiteiten of activiteitsconcentraties in natuurlijke bronnen niet
      gesommeerd met de activiteiten of activiteitenconcentraties in kunstmatige bronnen.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel3
  - number: '4.1'
    text: |-
      Een handeling is slechts toegestaan indien zij door de Autoriteit is gerechtvaardigd, dan wel behoort tot een
      categorie van handelingen die bij regeling van Onze Minister is gerechtvaardigd. De Autoriteit, respectievelijk
      Onze Minister, rechtvaardigt een handeling, respectievelijk een categorie van handelingen, slechts indien de
      economische, sociale en andere voordelen van de betrokken handeling of categorie van handelingen opwegen tegen de
      gezondheidsschade die hierdoor kan worden toegebracht.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel4
  - number: '4.2'
    text: 'Bij regeling van Onze Minister worden regels gesteld met betrekking tot de bekendmaking van:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel4
  - number: 4.2.a
    text: welke handelingen of categorieën daarvan overeenkomstig het eerste lid zijn gerechtvaardigd, en
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel4
  - number: 4.2.b
    text: welke handelingen of categorieën daarvan overeenkomstig het eerste lid niet zijn gerechtvaardigd.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel4
  - number: '4.3'
    text: |-
      Indien nieuwe, belangrijke gegevens over de doeltreffendheid of de gevolgen van de daarin opgenomen handelingen
      daartoe aanleiding geven kan de rechtvaardiging van de handeling worden herzien. Een wijziging als bedoeld in de
      vorige volzin wordt zo spoedig als redelijkerwijs mogelijk is van kracht.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel4
  - number: '4.4'
    text: |-
      Indien een vergunning wordt aangevraagd of een melding wordt gedaan voor een handeling die als gerechtvaardigd is
      bekendgemaakt, wordt in de melding of de vergunningaanvraag verwezen naar die bekendmaking.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel4
  - number: '4.5'
    text: |-
      Indien een vergunning wordt aangevraagd of een melding wordt gedaan voor een handeling die niet of als niet-
      gerechtvaardigd is bekendgemaakt, omvat de vergunningsaanvraag, onderscheidenlijk de melding tevens een verzoek
      om rechtvaardiging van die handeling. De vergunningsaanvraag of de melding bevat dan tevens de gegevens met
      betrekking tot de economische, sociale en andere voordelen van de betrokken handeling en met betrekking tot
      de gezondheidsschade die erdoor kan worden toegebracht, die nodig zijn met het oog op de beoordeling van de
      gerechtvaardigdheid van de handeling.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel4
  - number: '4.6'
    text: |-
      Dit artikel is niet van toepassing op de rechtvaardiging, bedoeld in de [artikelen 55][ref1], [56][ref2] en
      [57][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel56
      [ref3]: https://wetten.overheid.nl/BWBR0012702#Artikel57
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '55'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '56'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref3
        bwb_id: BWBR0012702
        artikel: '57'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '4.7'
    text: |-
      Naast de handelingen of categorieën van handelingen die krachtens het eerste lid zijn gerechtvaardigd, kan Onze
      Minister van Defensie, met het oog op het belang dat de krijgsmacht dient, een andere handeling of categorie van
      handelingen rechtvaardigen. Deze handeling of categorie van handelingen wordt door Onze Minister van Defensie
      bekendgemaakt op een bij regeling van deze Minister bepaalde wijze.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel4
  - number: '4.8'
    text: |-
      Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op het verzoek om rechtvaardiging
      als bedoeld in het eerste en zevende lid.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '5.1'
    text: |-
      De ondernemer zorgt ervoor dat de effectieve of equivalente doses van individuele personen, in samenhang met het
      aantal blootgestelde personen, ten gevolge van een handeling zo laag zijn als redelijkerwijs mogelijk is.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel5
  - number: '5.2'
    text: |-
      De ondernemer zorgt ervoor dat met betrekking tot potentiële blootstellingen zowel de dosis bij een blootstelling
      als de kans op een blootstelling zo laag als redelijkerwijs mogelijk is.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel5
  - number: '6.1'
    text: |-
      Onverminderd [artikel 48][ref1], zorgt de ondernemer ervoor dat plaatsen binnen een locatie waar handelingen worden
      verricht, zodanig zijn ingericht dat voor personen die zich daarbuiten bevinden, ten gevolge van de handelingen
      tezamen een dosisbeperking van 1 mSv effectieve dosis in een kalenderjaar wordt gehanteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel48
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '48'
        hoofdstuk: '5'
  - number: '6.2'
    text: |-
      De ondernemer zorgt ervoor dat bij het verrichten van handelingen die overeenkomstig [artikel 21][ref1] worden
      gemeld, voor personen op enig punt buiten de locatie ten gevolge van die handelingen tezamen een dosisbeperking van
      10 µSv effectieve dosis in een kalenderjaar wordt gehanteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel21
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '21'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '6.3'
    text: |-
      Indien het redelijkerwijs niet mogelijk is met bouwkundige voorzieningen te voldoen aan de verplichting, bedoeld in
      het eerste lid, wordt deze verkregen door middel van organisatorische maatregelen.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel6
  - number: '6.4'
    text: |-
      Bij regeling van Onze Minister of Onze Minister van Sociale Zaken en Werkgelegenheid kunnen andere dosisbeperkingen
      worden vastgesteld voor daarbij aangegeven categorieën van handelingen, taken of functies.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel6
  - number: '7.1'
    text: |-
      De ingevolge dit besluit door een stralingsarts te verrichten taken worden slechts uitgevoerd door
      een persoon die door de Autoriteit als stralingsarts is ingeschreven in een door de Autoriteit
      gehouden register en die zijn taken uitvoert in overeenstemming met een persoon als bedoeld in
      [artikel 14, eerste lid, van de Arbeidsomstandighedenwet][ref1] die belast is met de taken, bedoeld in artikel 14,
      eerste lid, onderdelen b of c, van die wet of de arbodienst.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '14'
  - number: '7.2'
    text: |-
      Bij regeling van Onze Minister van Sociale Zaken en Werkgelegenheid worden eisen vastgesteld met betrekking tot de
      kennis, vaardigheden en bekwaamheden, waaraan moet worden voldaan om als stralingsarts in het register, bedoeld in
      het eerste lid, te worden ingeschreven.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel7
  - number: '7.3'
    text: |-
      Een inschrijving in een register als bedoeld in het eerste lid, kan worden geweigerd of doorgehaald, indien niet of
      niet volledig voldaan is aan de bij of krachtens de [wet][ref1] of dit besluit gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0002402
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002402
  - number: '7.4'
    text: 'Bij regeling van Onze Minister van Sociale Zaken en Werkgelegenheid worden regels gesteld voor:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel7
  - number: 7.4.a
    text: de wijze van inschrijving;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel7
  - number: 7.4.b
    text: de gegevens en bescheiden die bij een aanvraag tot inschrijving worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel7
  - number: 7.4.c
    text: de gronden waarop en de gevallen waarin de inschrijving kan worden geweigerd of doorgehaald.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel7
  - number: '7.5'
    text: |-
      Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op de aanvraag tot inschrijving
      als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: 7a
    text: |-
      De Autoriteit schrijft op aanvraag een persoon die onderdaan is van een betrokken staat als bedoeld
      in [artikel 1 van de Algemene wet erkenning EU-beroepskwalificaties][ref1] in het register, bedoeld in
      [artikel 7, eerste lid][ref2], indien op grond van de [Algemene wet erkenning EU-beroepskwalificaties][ref3] is
      aangetoond dat deze persoon over kwalificaties bezit die gelijkwaardig zijn aan de kwalificaties waaraan ingevolge
      het bepaalde krachtens artikel 7, tweede lid, moet worden voldaan om als stralingsarts in het register te worden
      ingeschreven. Artikel 7, vijfde lid, is van overeenkomstige toepassing op de aanvraag tot inschrijving als bedoeld
      in de eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0023066
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref3
        bwb_id: BWBR0023066
  - number: 7b.1
    text: |-
      De ingevolge dit besluit door een algemeen coördinerend deskundige of coördinerend deskundige te verrichten taken
      worden slechts uitgevoerd door een persoon die als een zodanige deskundige voor de uitvoering van de betrokken taak
      is ingeschreven in het register, bedoeld in [artikel 69, tweede lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel69
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '69'
  - number: 7b.2
    text: |-
      Bij regeling van Onze Ministers worden eisen vastgesteld met betrekking tot de kennis, vaardigheden en bekwaamheden
      waaraan moet worden voldaan om als algemeen coördinerend deskundige of coördinerend deskundige in het register,
      bedoeld in het eerste lid, te worden ingeschreven. De eisen kunnen verschillend worden vastgesteld voor de
      verschillende taken.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel7b
  - number: 7b.3
    text: |-
      Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op de aanvraag tot inschrijving
      als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: 7c
    text: |-
      De ingevolge dit besluit door een toezichthoudend deskundige te verrichten taken worden slechts uitgevoerd door een
      persoon die beschikt over een diploma, certificaat of een ander getuigschrift ter afsluiting van een opleiding op
      het gebied van stralingsbescherming behaald bij:
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel7c
  - number: 7c.a
    text: |-
      een door de Autoriteit erkende instelling als bedoeld in [artikel 7f, eerste lid][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel7f
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: 7f
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 7c.b
    text: |-
      een door een andere lidstaat van de Europese Unie of andere staat die partij is bij de Overeenkomst betreffende de
      Europese Economische Ruimte of Zwitserland erkende of aangewezen instelling of opleiding.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel7c
  - number: 7d
    text: |-
      De Autoriteit schrijft op aanvraag een persoon die onderdaan is van een betrokken staat als bedoeld
      in [artikel 1 van de Algemene wet erkenning EU-beroepskwalificaties][ref1] in het register, bedoeld in
      [artikel 7b, eerste lid][ref2], indien op grond van de [Algemene wet erkenning EU-beroepskwalificaties][ref3] is
      aangetoond dat deze persoon over kwalificaties bezit die gelijkwaardig zijn aan de kwalificaties waaraan ingevolge
      het bepaalde krachtens artikel 7b, tweede lid, moet worden voldaan om als deskundige in het register te worden
      ingeschreven. Artikel 7b, derde lid, is van overeenkomstige toepassing op de aanvraag tot inschrijving als bedoeld
      in de eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel7b
      [ref3]: https://wetten.overheid.nl/BWBR0023066
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel7d
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: 7b
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref3
        bwb_id: BWBR0023066
  - number: 7e.1
    text: |-
      Een inschrijving in het register, bedoeld in [artikel 69, tweede lid, van de wet][ref1], kan worden geweigerd of
      doorgehaald, indien niet of niet volledig voldaan is aan de bij of krachtens de wet of bij of krachtens dit besluit
      gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel69
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel7e
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '69'
  - number: 7e.2
    text: |-
      Bij regeling van Onze Ministers en Onze Minister van Volksgezondheid, Welzijn en Sport kunnen regels worden gesteld
      voor:
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel7e
  - number: 7e.2.a
    text: de wijze van inschrijving;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel7e
  - number: 7e.2.b
    text: de gegevens en bescheiden die bij een aanvraag tot inschrijving worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel7e
  - number: 7e.2.c
    text: de vergoeding die ten hoogste voor de inschrijving is verschuldigd;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel7e
  - number: 7e.2.d
    text: de gronden waarop en de gevallen waarin de inschrijving kan worden geweigerd of doorgehaald.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel7e
  - number: 7f.1
    text: |-
      De Autoriteit erkent instellingen waar personen een diploma, certificaat of een ander getuigschrift ter afsluiting
      van een opleiding op het gebied van stralingsbescherming kunnen behalen.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel7f
  - number: 7f.2
    text: |-
      Bij regeling van Onze Ministers en Onze Minister van Volksgezondheid, Welzijn en Sport kunnen regels worden gesteld
      betreffende:
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel7f
  - number: 7f.2.a
    text: eisen aan de aanvraag van een erkenning;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel7f
  - number: 7f.2.b
    text: eisen aan de kwaliteit van de opleiding;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel7f
  - number: 7f.2.c
    text: eisen aan de examinering, toetsing en het vaststellen van eindtermen;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel7f
  - number: 7f.2.d
    text: eisen voor beroep en klachten;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel7f
  - number: 7f.2.e
    text: |-
      de wijze waarop Onze Ministers en Onze Minister van Volksgezondheid, Welzijn en Sport zich kunnen laten adviseren
      over het verlenen van een erkenning.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel7f
  - number: 7f.3
    text: De erkenning, bedoeld in het eerste lid, wordt bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel7f
  - number: '8.1'
    text: |-
      Een dosimetrische dienst heeft tot taak het verstrekken van persoonlijke controlemiddelen aan de
      ondernemer ten behoeve van A- of B-werknemers en het, door het uitlezen van deze controlemiddelen,
      bepalen in welke mate de A- of B-werknemers aan ioniserende straling blootgesteld zijn geweest.
      Deze taak wordt slechts verricht door een dienst die als zodanig is erkend door de Autoriteit.
      Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op de aanvraag om een erkenning
      als bedoeld in de tweede volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '8.2'
    text: |-
      Bij regeling van Onze Minister van Sociale Zaken en Werkgelegenheid worden eisen vastgesteld met betrekking tot de
      kwaliteit van de dienstverlening, de werkwijze en de deskundigheid van de dienst, waaraan moet worden voldaan om
      krachtens het eerste lid te kunnen worden erkend.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel8
  - number: '9.1'
    text: |-
      De ondernemer zorgt ervoor dat een handeling wordt uitgevoerd door of onder toezicht van een toezichthoudend
      deskundige.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel9
  - number: '9.2'
    text: |-
      De ondernemer zorgt ervoor dat een in zijn onderneming werkzame toezichthoudend deskundige adequate bij- en
      nascholing op het gebied van stralingsbescherming geniet.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel9
  - number: '9.3'
    text: |-
      Bij regeling van Onze Ministers kan voor bepaalde handelingen een bepaald niveau van deskundigheid en bij- en
      nascholing worden geëist.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel9
  - number: '9.4'
    text: |-
      De bepalingen in dit besluit met betrekking tot de deskundigheid gelden voor handelingen die volgens dit besluit
      meldingsplichtig of vergunningplichtig zijn.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel9
  - number: '9.5'
    text: |-
      De ondernemer legt de toedeling van bevoegdheden en verantwoordelijkheden met betrekking tot de bescherming tegen
      ioniserende straling schriftelijk vast.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel9
  - number: '10.1'
    text: |-
      De ondernemer zorgt ervoor dat door of onder toezicht van een coördinerend deskundige, met het oog op de
      bescherming tegen ioniserende straling, ten minste:
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel10
  - number: 10.1.a
    text: |-
      de plannen voor handelingen voorafgaand aan de uitvoering ervan kritisch worden bestudeerd, de risico's ervan
      geïnventariseerd en geëvalueerd en toestemming verleend, voordat met de handeling wordt aangevangen;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel10
  - number: 10.1.b
    text: |-
      wordt geadviseerd over de inhoud van de acceptatietest, bedoeld in het tweede lid, en de beveiligingsmiddelen en
      technieken ter waarborging van een doelmatige bescherming van personen;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel10
  - number: 10.1.c
    text: |-
      regelmatig, maar ten minste eenmaal per jaar de doeltreffendheid en het juiste gebruik van de beveiligingsmiddelen
      en technieken worden geverifieerd;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel10
  - number: 10.1.d
    text: |-
      regelmatig, maar ten minste eenmaal per jaar de goede werking en het juiste gebruik van bronnen en instrumenten
      voor meting van ioniserende straling worden gecontroleerd;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel10
  - number: 10.1.e
    text: deze instrumenten regelmatig worden gekalibreerd.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel10
  - number: '10.2'
    text: |-
      De ondernemer zorgt ervoor dat een nieuwe of gewijzigde bron niet in gebruik wordt genomen dan na een
      acceptatietest verricht door een toezichthoudend of coördinerend deskundige, gevolgd door diens toestemming om de
      bron in gebruik te nemen.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel10
  - number: '10.3'
    text: |-
      Voor zover het de bescherming van de blootgestelde werknemer, de werknemer of de omgeving betreft worden de
      bevindingen van de coördinerend deskundige vastgelegd in het kader van een risicoanalyse.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel10
  - number: '10.4'
    text: |-
      De ondernemer zorgt ervoor dat de bevindingen ten aanzien van de taken, genoemd in het eerste en derde lid, worden
      vastgelegd in een beheersysteem.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel10
  - number: '10.5'
    text: |-
      Bij regeling van Onze Minister van Sociale Zaken en Werkgelegenheid kunnen nadere regels worden gesteld met
      betrekking tot de vorm en inhoud van een risicoanalyse.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel10
  - number: '11.1'
    text: |-
      De ondernemer stelt, na overleg met een coördinerend of toezichthoudend deskundige, maatregelen vast om schade
      tegen te gaan en zorgt ervoor dat deze worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel11
  - number: '11.2'
    text: 'De ondernemer zorgt ervoor ten aanzien van bronnen, beveiligingsmiddelen en meetinstrumenten dat:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel11
  - number: 11.2.a
    text: daaraan het noodzakelijke onderhoud wordt verricht;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel11
  - number: 11.2.b
    text: |-
      de noodzakelijke maatregelen worden genomen om inadequate of defecte onderdelen daarvan te verbeteren of te
      vervangen, en
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel11
  - number: 11.2.c
    text: indien nodig, tot buitengebruikstelling van bronnen wordt overgegaan.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel11
  - number: '11.3'
    text: |-
      De ondernemer zorgt ervoor dat de integriteit van hoogactieve bronnen door of onder toezicht van een coördinerend
      of toezichthoudend deskundige wordt gecontroleerd:
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel11
  - number: 11.3.a
    text: ten minste een maal per jaar en
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel11
  - number: 11.3.b
    text: na elke gebeurtenis waarbij de bron of bronhouder beschadigd kan zijn.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel11
  - number: '11.4'
    text: |-
      Bij verordening van de Autoriteit kunnen regels worden gesteld met betrekking tot de controle van de integriteit
      van hoogactieve bronnen.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel11
  - number: '11.5'
    text: |-
      De ondernemer zorgt er ten aanzien van een hoogactieve bron en haar toebehoren voor dat, door of onder toezicht van
      een coördinerend of toezichthoudend deskundige:
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel11
  - number: 11.5.a
    text: 'wordt gecontroleerd of de bron aanwezig is op de plaats waar deze wordt toegepast of is opgeslagen:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel11
  - number: 11.5.a.1°
    text: elke drie maanden, indien de bron minder dan een keer per drie maanden wordt toegepast;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel11
  - number: 11.5.a.2°
    text: een maal per jaar, indien de bron een keer of meer dan een keer per drie maanden wordt toegepast;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel11
  - number: 11.5.b
    text: een maal per jaar wordt gecontroleerd of de bron en de bronhouder nog in goede staat zijn.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel11
  - number: '11.6'
    text: |-
      Een ondernemer zendt een afgedankte hoogactieve bron, tenzij dit anders met de Autoriteit is overeengekomen,
      onmiddellijk naar:
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel11
  - number: 11.6.a
    text: de leverancier van de bron die bevoegd is de bron te ontvangen,
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel11
  - number: 11.6.b
    text: |-
      een krachtens [artikel 37, achtste lid][ref1], daartoe aangewezen instelling voor de ontvangst van radioactieve
      afvalstoffen, of


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel37
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '37'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 11.6.c
    text: een andere ondernemer die bevoegd is de bron te ontvangen.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel11
  - number: 11a
    text: |-
      De ondernemer stelt financiële middelen en faciliteiten voor een passende bescherming tegen ioniserende straling
      ter beschikking aan de algemeen coördinerend deskundige, de coördinerend deskundige, de toezichthoudend deskundige
      of de stralingsbeschermingseenheid, bedoeld in [artikel 12, eerste, tweede of derde lid][ref1], die met de
      uitvoering van die bescherming is belast.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel12
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '12.1'
    text: |-
      Een ondernemer zorgt ervoor dat een stralingsbeschermingseenheid, waarin tevens de algemeen coördinerend deskundige
      werkzaam is, aanwezig is in een onderneming en op locaties indien in verschillende organisatie-onderdelen of op
      verschillende plaatsen door de ondernemer verschillende handelingen of werkzaamheden met in totaal meer dan 100
      bronnen waarvoor een vergunning is vereist worden verricht.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel12
  - number: '12.2'
    text: |-
      Een ondernemer zorgt ervoor dat een stralingsbeschermingseenheid aanwezig is binnen inrichtingen als bedoeld in
      [artikel 15, onder b, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: '12.3'
    text: |-
      De vergunning van een andere soort ondernemer dan die een onderneming heeft als bedoeld in het eerste of tweede lid
      kan het voorschrift bevatten dat deze zorgt voor de aanwezigheid van een stralingsbeschermingseenheid, indien in
      zijn onderneming:
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel12
  - number: 12.3.a
    text: |-
      handelingen of werkzaamheden worden verricht die overeenkomen met die in de in het eerste of tweede lid bedoelde
      ondernemingen of op de in het eerste lid bedoelde locaties; en
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel12
  - number: 12.3.b
    text: |-
      naar het oordeel van de Autoriteit in het belang van de bescherming tegen ioniserende straling een beheersysteem is
      vereist, dat vergelijkbaar is met dat in de ondernemingen, bedoeld in het eerste of tweede lid.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel12
  - number: '12.4'
    text: Bij verordening van de Autoriteit worden regels gesteld over de werkwijze van een stralingsbeschermingseenheid.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel12
  - number: '12.5'
    text: |-
      Indien een stralingsbeschermingseenheid op grond van het eerste, tweede of derde lid is voorgeschreven, zorgt de
      ondernemer ervoor dat de stralingsbeschermingseenheid operationeel is en in ieder geval:
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel12
  - number: 12.5.a
    text: daarin een algemeen coördinerend deskundige en voldoende ondersteunend personeel werkzaam zijn;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel12
  - number: 12.5.b
    text: daarin voldoende stralingsbeschermingsdeskundigheid aanwezig is;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel12
  - number: 12.5.c
    text: functioneel en organisatorisch gescheiden is van productie- en technische eenheden;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel12
  - number: 12.5.d
    text: aan hem adviezen verstrekt met betrekking tot de bescherming tegen ioniserende straling;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel12
  - number: 12.5.e
    text: de algemeen coördinerend deskundige toestemming geeft voor een handeling.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel12
  - number: '12.6'
    text: |-
      De Autoriteit kan toestaan dat een stralingsbeschermingseenheid als bedoeld in
      het eerste, tweede of derde lid, voor verscheidene ondernemers taken verricht. Met
      toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op de aanvraag om een beschikking
      als bedoeld in de eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: 12a.1
    text: |-
      Er is een meldpunt stralingsincidenten voor het melden van stralingsincidenten, ongevallen en radiologische
      noodsituaties.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel12a
  - number: 12a.2
    text: De Autoriteit beheert het meldpunt.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel12a
  - number: '13.1'
    text: |-
      De ondernemer zorgt ervoor dat een stralingsincident, een ongeval of een radiologische noodsituatie onmiddellijk
      wordt gemeld bij:
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel13
  - number: 13.1.1°
    text: het meldpunt stralingsincidenten; en
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel13
  - number: 13.1.2°
    text: de betrokken stralingsarts indien overbestraling of besmetting van een A-werknemer heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel13
  - number: '13.2'
    text: |-
      De ondernemer zorgt ervoor dat een handeling waarbij het voorzienbaar is dat personen onbedoeld aan overmatige
      uitwendige bestraling of overmatige inwendige besmetting kunnen worden blootgesteld, slechts wordt verricht nadat
      een coördinerend of toezichthoudend deskundige hierover is geraadpleegd.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel13
  - number: '13.3'
    text: |-
      Indien naar het oordeel van een coördinerend of toezichthoudend deskundige de blootstelling, bedoeld in het tweede
      lid, zich voordoet of dreigt voor te doen, zorgt de ondernemer ervoor dat onmiddellijk:
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel13
  - number: 13.3.a
    text: de handeling wordt gestaakt,
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel13
  - number: 13.3.b
    text: de gevaarlijke plaatsen worden ontruimd, en
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel13
  - number: 13.3.c
    text: 'deze situatie wordt gemeld bij:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel13
  - number: 13.3.c.1°
    text: |-
      de betrokken stralingsarts, indien overmatige uitwendige bestraling of overmatige inwendige besmetting van een
      werknemer heeft plaatsgevonden; en
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel13
  - number: 13.3.c.2°
    text: het meldpunt stralingsincidenten.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel13
  - number: '13.4'
    text: |-
      Het meldpunt stralingsincidenten stelt de bij regeling van Onze Minister aangewezen instanties zo spoedig mogelijk
      op de hoogte van de meldingen, bedoeld in het eerste en derde lid.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel13
  - number: '13.5'
    text: |-
      De ondernemer beëindigt de maatregelen als bedoeld in het derde lid, onder a of b, slechts na overeenstemming
      met de coördinerend deskundige of de toezichthoudend deskundige en niet eerder dan een week nadat overeenkomstig
      het derde lid melding is gedaan, tenzij de instantie die ingevolge dat lid of het vierde lid van de melding op de
      hoogte is gebracht, binnen die termijn een andere termijn voor het beëindigen van de maatregelen voorschrijft.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel13
  - number: '14.1'
    text: |-
      De ondernemer zorgt ervoor dat zoveel als redelijkerwijs mogelijk wordt voorkomen dat een bron zoekraakt, wordt
      ontvreemd of ongewild wordt verspreid en dat hij, indien zich een zodanige situatie voordoet, alle noodzakelijke
      maatregelen neemt om de bron weer onder zijn controle of beheer te brengen en een eventuele besmetting te
      verwijderen of verdere blootstelling van personen te voorkomen.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel14
  - number: '14.2'
    text: 'De ondernemer stelt bij een handeling met een hoogactieve bron schriftelijke instructies vast ter voorkoming van:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel14
  - number: 14.2.a
    text: ongeoorloofde toegang tot de bron,
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel14
  - number: 14.2.b
    text: verlies of diefstal van de bron, of
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel14
  - number: 14.2.c
    text: beschadiging door brand van de bron.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel14
  - number: '14.3'
    text: 'De ondernemer meldt de volgende situaties of maatregelen onmiddellijk bij het meldpunt stralingsincidenten:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel14
  - number: 14.3.a
    text: het zoekraken, de ontvreemding of de ongewilde verspreiding van een bron;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel14
  - number: 14.3.b
    text: een ongeoorloofde handeling met een bron;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel14
  - number: 14.3.c
    text: 'de getroffen maatregelen na:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel14
  - number: 14.3.c.1°
    text: het zoekraken, de ontvreemding of een ongeoorloofde handeling met een bron, of
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel14
  - number: 14.3.c.2°
    text: elke gebeurtenis waarbij een bron kan zijn beschadigd;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel14
  - number: 14.3.d
    text: |-
      elk stralingsincident of ongeval met een bron dat leidt tot onopzettelijke blootstelling van een werknemer of een
      lid van de bevolking.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel14
  - number: '14.4'
    text: De ondernemer zorgt ervoor dat bronnen zoveel als redelijkerwijs mogelijk zijn beveiligd tegen brand.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel14
  - number: 14a
    text: 'Nadat handelingen met een ingekapselde bron definitief zijn beëindigd, zorgt de ondernemer er voor dat:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel14a
  - number: 14a.a
    text: hiervan zo spoedig mogelijk mededeling wordt gedaan aan de Autoriteit, en
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel14a
  - number: 14a.b
    text: 'hij zich, binnen twee jaar na die beëindiging, van de ingekapselde bron ontdoet door afgifte aan:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel14a
  - number: 14a.b.1°
    text: degene die de bron heeft vervaardigd of geleverd,
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel14a
  - number: 14a.b.2°
    text: |-
      een persoon die gerechtigd is met het oog op gebruik, product- of materiaalhergebruik van radioactieve stoffen, of
      inzameling van radioactieve afvalstoffen de stoffen te ontvangen, of
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel14a
  - number: 14a.b.3°
    text: |-
      een krachtens [artikel 37, zesde of zevende lid][ref1], aangewezen instelling, of krachtens artikel 37, achtste
      lid, erkende ophaaldienst die gerechtigd is de stoffen te ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel37
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '37'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 14b
    text: 'Nadat handelingen met een toestel definitief zijn beëindigd, zorgt de ondernemer ervoor dat:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel14b
  - number: 14b.a
    text: hiervan zo spoedig mogelijk mededeling wordt gedaan aan de Autoriteit, en
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel14b
  - number: 14b.b
    text: 'hij zich binnen twee jaar na die beëindiging van dat toestel ontdoet door afgifte aan:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel14b
  - number: 14b.b.1°
    text: degene die het toestel heeft vervaardigd of geleverd, of
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel14b
  - number: 14b.b.2°
    text: een persoon die gerechtigd is met het oog op gebruik, product- of materiaalhergebruik het toestel te ontvangen, of
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel14b
  - number: 14b.c
    text: binnen twee jaar na die beëindiging het toestel is verschroot.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel14b
  - number: '15.1'
    text: |-
      De ondernemer zorgt ervoor dat degene die een handeling verricht, en degene die daaraan leiding geeft of daarop
      toezicht houdt, met betrekking tot de werkplek:
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel15
  - number: 15.1.a
    text: voldoende is onderricht met betrekking tot de risico's die verbonden zijn aan ioniserende straling;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel15
  - number: 15.1.b
    text: |-
      is geïnformeerd over de algemeen gangbare methoden ter bescherming tegen ioniserende straling en de te nemen
      voorzorgsmaatregelen zowel voor de handeling in het algemeen, als voor de taak die hem wordt toegewezen en voor
      elke werkplek waar de handeling wordt verricht;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel15
  - number: 15.1.c
    text: is geïnformeerd over het belang zich aan de technische, gezondheids- en administratieve voorschriften te houden.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel15
  - number: '15.2'
    text: |-
      Indien de in het eerste lid bedoelde handeling betrekking heeft op een hoogactieve bron, wordt tevens onderricht
      gegeven over:
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel15
  - number: 15.2.a
    text: de voorschriften voor het veilig beheer van hoogactieve bronnen;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel15
  - number: 15.2.b
    text: de noodzakelijke veiligheidsvoorschriften;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel15
  - number: 15.2.c
    text: de mogelijke gevolgen van het wegvallen van een passende controle op hoogactieve bronnen.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel15
  - number: '15.3'
    text: |-
      De in het tweede lid genoemde onderwerpen worden beschreven. Deze documentatie wordt ter beschikking gesteld
      aan degene die een handeling met een hoogactieve bron verricht en aan degene die daaraan leiding geeft of daarop
      toezicht houdt.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel15
  - number: '15.4'
    text: Het onderricht over de in het tweede lid genoemde onderwerpen wordt ten minste elke twee jaar herhaald.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel15
  - number: '15.5'
    text: |-
      De ondernemer stelt met betrekking tot de in het eerste lid genoemde onderwerpen schriftelijke instructies vast en
      verstrekt deze instructies aan personen als bedoeld in het eerste lid en aan anderen die kunnen worden blootgesteld
      door de handelingen.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel15
  - number: '15.6'
    text: |-
      De ondernemer zorgt ervoor dat de in het vijfde lid bedoelde instructies zijn opgesteld in de Nederlandse of
      in een voor de betrokken werknemer begrijpelijke taal. Zo nodig worden in plaats van schriftelijke instructies
      afbeeldingen of symbolen gebruikt.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel15
  - number: '16'
    text: |-
      De ondernemer zorgt ervoor dat vrouwen die ten gevolge van een handeling kunnen worden blootgesteld aan ioniserende
      straling voor aanvang van het verrichten van handelingen zijn geïnformeerd over:
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel16
  - number: 16.a
    text: de noodzaak om een zwangerschap in een vroeg stadium te melden;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel16
  - number: 16.b
    text: |-
      de risico's van blootstelling aan ioniserende straling voor het ongeboren kind door uitwendige bestraling of
      besmetting;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel16
  - number: 16.c
    text: de risico's die een kind dat borstvoeding krijgt, loopt bij besmetting van de moeder.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel16
  - number: '17'
    text: |-
      De ondernemer zorgt ervoor dat de werknemers meewerken aan het voor hen georganiseerde onderricht en de instructies
      naleven die hen ingevolge dit besluit worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel17
  - number: '18.1'
    text: De Autoriteit kan bij verordening regels stellen met betrekking tot toestellen.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel18
  - number: '18.2'
    text: 'Hiertoe behoren in ieder geval regels met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel18
  - number: 18.2.a
    text: het testen van een toestel voor de ingebruikname daarvan;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel18
  - number: 18.2.b
    text: de afscherming van een toestel tegen ioniserende straling;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel18
  - number: 18.2.c
    text: de opstelling van een toestel en de bijbehorende hulp- en beveiligingsmiddelen;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel18
  - number: 18.2.d
    text: de werkwijze van een toestel;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel18
  - number: 18.2.e
    text: maatregelen ter voorkoming van gebruik van een toestel door onbevoegden;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel18
  - number: 18.2.f
    text: de controle op de werking van een toestel;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel18
  - number: 18.2.h
    text: het omgevingsdosisequivalenttempo dat een toestel mag veroorzaken;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel18
  - number: 18.2.i
    text: eisen waaraan degene die het toestel gebruikt moet voldoen.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel18
  - number: '19.1'
    text: De Autoriteit kan bij verordening regels stellen met betrekking tot ingekapselde bronnen.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel19
  - number: '19.2'
    text: 'Hiertoe behoren in ieder geval regels met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel19
  - number: 19.2.a
    text: maatregelen bij de binnenkomst van de bron op de locatie;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel19
  - number: 19.2.b
    text: eisen aan de constructie en verpakking van de bron;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel19
  - number: 19.2.c
    text: maatregelen ter voorkoming van gebruik van een bron door onbevoegden;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel19
  - number: 19.2.d
    text: de controle op de werking van een bron;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel19
  - number: 19.2.e
    text: het omgevingsdosisequivalenttempo dat een bron mag veroorzaken;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel19
  - number: 19.2.f
    text: het verrichten van een lek- of besmettingstest;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel19
  - number: 19.2.g
    text: eisen waaraan degene die de bron gebruikt moet voldoen.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel19
  - number: '20.1'
    text: |-
      De ondernemer zorgt ervoor dat, in situaties waar ten gevolge van handelingen de in [artikel 49][ref1] of
      [76][ref2] genoemde doses kunnen worden overschreden, op daarvoor geschikte plaatsen doelmatige en duidelijke
      waarschuwingsborden of -tekens en opschriften worden aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel76
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '49'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '76'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '20.2'
    text: |-
      De ondernemer zorgt ervoor dat ruimten en plaatsen waar handelingen met open bronnen worden verricht, de inrichting
      daarvan of daarin gebruikte voorwerpen regelmatig volgens door hem schriftelijk vastgestelde procedures worden
      gecontroleerd op besmetting.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20
  - number: '20.3'
    text: |-
      De ondernemer zorgt ervoor dat wanneer open en ingekapselde bronnen niet worden gebruikt, deze, indien dit
      redelijkerwijs mogelijk is, worden opgeborgen in een daartoe geschikte bergplaats.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20
  - number: '20.4'
    text: |-
      Bij regeling van Onze Minister van Sociale Zaken en Werkgelegenheid kunnen regels worden gesteld met betrekking tot
      het model, de opschriften en de minimale grootte van de waarschuwingsborden of -tekens, bedoeld in het eerste lid,
      en waar en op welke wijze deze moeten worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20
  - number: 20a.1
    text: |-
      De fabrikant graveert in of stempelt op elke door hem gefabriceerde hoogactieve bron een code die als volgt is
      samengesteld:
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20a
  - number: 20a.1.a
    text: 'de aanduiding: NL,'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20a
  - number: 20a.1.b
    text: gevolgd door een aan de fabrikant door de Autoriteit toegekende vaste code,
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20a
  - number: 20a.1.c
    text: |-
      gevolgd door een door de fabrikant te bepalen voor de bron onderscheidende code in Romeinse letters of Arabische
      cijfers.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20a
  - number: 20a.2
    text: |-
      Een aanvraag om de toekenning van de in het eerste lid, onder b, bedoelde code wordt ingediend bij
      de Autoriteit. De aanvraag bevat de nummers van de krachtens de [artikelen 15, onder a][ref1], of
      [29, eerste lid, van de wet][ref2] aan de aanvrager verleende vergunningen.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel29
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0002402
        artikel: '29'
  - number: 20a.3
    text: |-
      Het eerste lid is niet van toepassing, indien de afmeting van de bron voor de in het eerste lid bedoelde handeling
      te klein is.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20a
  - number: 20a.4
    text: |-
      De fabrikant graveert de in het eerste lid bedoelde code tevens in de bronhouder van de desbetreffende bron of
      stempelt die code op die bronhouder.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20a
  - number: 20a.5
    text: |-
      Het vierde lid is niet van toepassing indien de afmeting van de bronhouder voor de in het eerste lid bedoelde
      handeling te klein is, of indien de bronhouder bedoeld is voor hergebruik als behuizing van een bron. In dat
      laatste geval brengt de fabrikant informatie aan over ten minste de aard van de hoogactieve bron op of aan de
      bronhouder.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20a
  - number: 20a.6
    text: De fabrikant brengt op of aan de broncontainer informatie aan over de aard van de hoogactieve bron.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20a
  - number: 20a.7
    text: 'De fabrikant van een hoogactieve bron zorgt ervoor dat:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20a
  - number: 20a.7.a
    text: 'de bron wordt vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20a
  - number: 20a.7.a.1°
    text: |-
      schriftelijke informatie die bevestigt dat de bron voldoet aan het eerste lid en aan de krachtens
      [artikel 20, vierde lid][ref1], met betrekking tot de bron of de bronhouder gestelde regels;


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel20
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 20a.7.a.2°
    text: |-
      kleurenfoto’s van het ontwerp van de bron en de bijbehorende bronhouder, en, voorzover van toepassing, van het
      ontwerp van de bijbehorende broncontainer en de bijbehorende apparatuur;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20a
  - number: 20a.7.b
    text: |-
      de onder a bedoelde informatie en foto’s bij de levering van de bron worden verstrekt aan degene aan wie die bron
      wordt geleverd;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20a
  - number: 20a.7.c
    text: |-
      de in het eerste en vierde lid bedoelde code en de krachtens [artikel 20, vierde lid][ref1], op de bron, bronhouder
      of broncontainer aangebrachte waarschuwingstekens en opschriften zo goed mogelijk leesbaar blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel20
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 20b.1
    text: |-
      De leverancier graveert in of stempelt op de bronhouder van elke door hem te leveren hoogactieve bron een code die
      als volgt is samengesteld:
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20b
  - number: 20b.1.a
    text: 'de aanduiding: NL,'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20b
  - number: 20b.1.b
    text: gevolgd door een aan de leverancier door de Autoriteit toegekende vaste code,
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20b
  - number: 20b.1.c
    text: |-
      gevolgd door een door de leverancier te bepalen voor de bron onderscheidende code in Romeinse letters of Arabische
      cijfers.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20b
  - number: 20b.2
    text: 'Het eerste lid is niet van toepassing, indien:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20b
  - number: 20b.2.a
    text: |-
      op de bronhouder van een hoogactieve bron reeds de in [artikel 20a, eerste lid][ref1], bedoelde code, of een andere
      unieke code in Romeinse letters of Arabische cijfers is aangebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel20a
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20b
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: 20a
        hoofdstuk: '3'
        paragraaf: 3.3a
  - number: 20b.2.b
    text: |-
      de afmeting van de bronhouder voor de in het eerste lid bedoelde handeling te klein is, of deze houder bedoeld is
      voor hergebruik als behuizing van een bron.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20b
  - number: 20b.3
    text: |-
      In het in het tweede lid, onder b, bedoelde geval is [artikel 20a, vijfde lid, tweede volzin][ref1], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel20a
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20b
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: 20a
        hoofdstuk: '3'
        paragraaf: 3.3a
  - number: 20b.4
    text: |-
      [Artikel 20a, tweede, zesde en zevende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel20a
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20b
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: 20a
        hoofdstuk: '3'
        paragraaf: 3.3a
  - number: 20c
    text: |-
      [Artikel 20b, eerste tot en met derde lid][ref1], en [artikel 20a, tweede, zesde en zevende lid, onder a en c][ref2],
      zijn van overeenkomstige toepassing op de ondernemer die een handeling verricht met een hoogactieve bron.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel20b
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel20a
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20c
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: 20b
        hoofdstuk: '3'
        paragraaf: 3.3a
      - id: ref2
        bwb_id: BWBR0012702
        artikel: 20a
        hoofdstuk: '3'
        paragraaf: 3.3a
  - number: 20ca
    text: |-
      De Autoriteit kan bij verordening regels stellen ten aanzien van de beveiliging van het voorhanden hebben van
      radioactieve stoffen, bestemd voor handelingen waarvoor ingevolge [artikel 24][ref1] of [artikel 25][ref2] een
      vergunning is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel25
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20ca
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '25'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 20d.1
    text: |-
      De ondernemer stelt financiële zekerheid ter dekking van de kosten van het nakomen van de voor hem geldende
      verplichtingen met betrekking tot het veilig afvoeren van een afgedankte hoogactieve bron voor het geval:
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20d
  - number: 20d.1.a
    text: hij failliet gaat of anderszins zijn bedrijfsactiviteiten beëindigt;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20d
  - number: 20d.1.b
    text: |-
      degene met wie een overeenkomst was gesloten om de afgedankte hoogactieve bronnen af te nemen, niet meer tot die
      afname in staat is.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20d
  - number: 20d.2
    text: 'De financiële zekerheid wordt gesteld op een of meer van de volgende wijzen:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20d
  - number: 20d.2.a
    text: een borgtocht of een bankgarantie;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20d
  - number: 20d.2.b
    text: het sluiten van een verzekeringsovereenkomst;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20d
  - number: 20d.2.c
    text: |-
      het deelnemen aan een daartoe ingesteld fonds dat naar het oordeel van Onze Minister en van Onze Minister van
      Financiën voldoende waarborg biedt dat de in het eerste lid bedoelde kosten zijn gedekt;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20d
  - number: 20d.2.d
    text: |-
      het treffen van enige andere voorziening, waarbij de financiële zekerheid naar het oordeel van Onze Minister en van
      Onze Minister van Financiën voldoende waarborg biedt dat de in het eerste lid bedoelde kosten zijn gedekt.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20d
  - number: 20d.3
    text: |-
      Bij regeling van Onze Minister wordt een minimumbedrag vastgesteld waarvoor per volume-eenheid af te voeren bron,
      de daarbijbehorende bronhouder en de vaste afscherming financiële zekerheid wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20d
  - number: 20d.4
    text: De financiële zekerheid wordt gesteld ten behoeve van de Staat der Nederlanden.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20d
  - number: 20e
    text: |-
      De financiële zekerheid wordt in stand gehouden tot het moment waarop de hoogactieve bron waarvoor de financiële
      zekerheid wordt gesteld, door de ondernemer:
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20e
  - number: 20e.a
    text: |-
      wordt overgedragen aan een andere ondernemer die met betrekking tot die bron de vereiste financiële zekerheid heeft
      gesteld,
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20e
  - number: 20e.b
    text: |-
      wordt afgegeven aan een krachtens [artikel 37, zevende lid][ref1], erkende ophaaldienst voor radioactieve
      afvalstoffen, of


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel37
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20e
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '37'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 20e.c
    text: |-
      wordt afgegeven aan een krachtens [artikel 37, achtste lid][ref1], daartoe aangewezen instelling voor de ontvangst
      van radioactieve afvalstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel37
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20e
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '37'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 20f.1
    text: 'De ondernemer verstrekt voordat hij een hoogactieve bron verwerft, aan de Autoriteit:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20f
  - number: 20f.1.a
    text: informatie over het volume van de verworven bron, bronhouder en vaste afscherming van die bron;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20f
  - number: 20f.1.b
    text: |-
      schriftelijk bewijs dat de krachtens [artikel 20d, eerste lid][ref1], vereiste financiële zekerheid is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel20d
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20f
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: 20d
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 20f.2
    text: |-
      Het eerste lid is niet van toepassing indien de daarin bedoelde gegevens reeds bij een aanvraag om een vergunning
      voor een handeling als bedoeld in de [artikelen 24][ref1], en [25, eerste lid][ref2], zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel25
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20f
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '25'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 20f.3
    text: Bij verordening van de Autoriteit kunnen nadere eisen worden gesteld met betrekking tot de te verstrekken gegevens.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20f
  - number: 20g
    text: |-
      De vergunninghouder stelt de kosten die hij in rekening brengt voor het in werking houden van een inrichting
      waarin splijtstoffen worden opgeslagen als bedoeld in [artikel 15, onder b, van de wet][ref1], die op grond
      van [artikel 37, achtste lid][ref2], door de Autoriteit is aangewezen, vast op een transparante, objectieve en
      niet-discriminerende wijze. Tot de kosten behoren ook de kosten die de vergunninghouder maakt voor onderzoek
      en ontwikkeling voor het beheer van radioactieve afvalstoffen, zoals dit in het nationaal programma, bedoeld in
      [artikel 20h][ref3], is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0012702#Artikel20h
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20g
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '37'
        hoofdstuk: '4'
        paragraaf: '4.4'
      - id: ref3
        bwb_id: BWBR0012702
        artikel: 20h
        hoofdstuk: 3a
  - number: 20h.1
    text: |-
      Onze Minister stelt een programma als bedoeld in artikel 5, eerste lid, onderdeel a, van richtlijn 2011/70/Euratom,
      vast voor het beheer van radioactieve afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20h
  - number: 20h.2
    text: 'Het programma bevat een uitwerking van de volgende uitgangspunten:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20h
  - number: 20h.2.a
    text: |-
      de beperking van het ontstaan van radioactieve afvalstoffen tot het praktisch haalbare minimum, zowel wat de
      activiteit als het volume betreft;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20h
  - number: 20h.2.b
    text: de onderlinge afhankelijkheden van alle stappen in het ontstaan en het beheer van radioactieve afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20h
  - number: 20h.2.c
    text: het veilig beheer van radioactieve afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20h
  - number: 20h.2.d
    text: voor de lange termijn passieve veiligheidsmaatregelen;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20h
  - number: 20h.2.e
    text: een graduele aanpak bij de uitvoering van de maatregelen;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20h
  - number: 20h.2.f
    text: |-
      de kosten voor het beheer van radioactieve afvalstoffen komen ten laste van degene die deze afvalstoffen hebben
      laten ontstaan;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20h
  - number: 20h.2.g
    text: |-
      een empirisch onderbouwd en gedocumenteerd besluitvormingsproces in alle stadia van het beheer van radioactieve
      afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20h
  - number: 20h.3
    text: 'Het programma bevat tevens:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20h
  - number: 20h.3.a
    text: de beleidsdoelstelling ten aanzien van het beheer van alle typen radioactieve afvalstoffen;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20h
  - number: 20h.3.b
    text: |-
      de mijlpalen die voor de uitvoering van het programma nodig zijn en het tijdpad voor het bereiken van deze
      mijlpalen;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20h
  - number: 20h.3.c
    text: een inventarisatie van alle radioactieve afvalstoffen en ramingen van toekomstige hoeveelheden;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20h
  - number: 20h.3.d
    text: |-
      concepten, plannen en technische oplossingen voor het beheer van radioactieve afvalstoffen, van ontstaan tot
      eindberging;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20h
  - number: 20h.3.e
    text: concepten of plannen voor de periode na de sluiting van een inrichting voor eindberging;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20h
  - number: 20h.3.f
    text: |-
      onderzoeks-, ontwikkelings- en demonstratieactiviteiten die nodig zijn om oplossingen voor het beheer van
      radioactieve afvalstoffen toe te passen;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20h
  - number: 20h.3.g
    text: |-
      de verantwoordelijkheid voor de uitvoering van het programma en de essentiële prestatie-indicatoren voor toezicht
      op de voortgang van de uitvoering van het programma;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20h
  - number: 20h.3.h
    text: |-
      een beoordeling van de kosten van het nationale programma en de onderliggende basis en hypothesen voor deze
      beoordeling, met inbegrip van een tijdsprofiel;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20h
  - number: 20h.3.i
    text: de financieringsregelingen ter uitvoering van het programma;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20h
  - number: 20h.3.j
    text: |-
      het beleid ten aanzien van het verstrekken van informatie met betrekking tot het beheer van radioactieve
      afvalstoffen aan werknemers en het publiek;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20h
  - number: 20h.3.k
    text: |-
      een overzicht van met andere lidstaten en derde landen gesloten overeenkomsten over het beheer van radioactieve
      afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel20h
  - number: '21.1'
    text: |-
      De ondernemer die een handeling met een toestel of een radioactieve stof verricht, meldt dit ten minste drie weken
      voor aanvang van deze handeling aan de Autoriteit.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel21
  - number: '21.2'
    text: 'Deze verplichting geldt niet indien het een handeling betreft met:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel21
  - number: 21.2.a
    text: een toestel of radioactieve stof waarvoor ingevolge dit besluit een vergunning is vereist;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel21
  - number: 21.2.b
    text: een elektronenstraalbuis voor visuele beeldweergave;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel21
  - number: 21.2.c
    text: |-
      een ander toestel dan bedoeld onder a of b met een maximale hoogspanning van niet meer dan 30 kV, dat onder
      normale bedrijfsomstandigheden op 0,1 meter afstand van enig bereikbare buitenzijde van het toestel geen hoger
      omgevingsdosisequivalenttempo veroorzaakt dan 1 µSv per uur;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel21
  - number: 21.2.d
    text: |-
      een ander toestel dan bedoeld onder a, b of c, dat onder normale bedrijfsomstandigheden op 0,1 meter afstand van
      enig bereikbare buitenzijde van het toestel geen hoger omgevingsdosisequivalenttempo veroorzaakt dan 1 µSv per uur
      en dat behoort tot een type dat door de Autoriteit is goedgekeurd op grond van bij verordening van de Autoriteit
      gestelde regels.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel21
  - number: '21.3'
    text: |-
      De verplichting, bedoeld in het eerste lid, geldt niet voor handelingen met bronnen indien in de aanvraag om
      een vergunning voor een handeling als bedoeld in de [artikelen 23, eerste en tweede lid][ref1], [24][ref2],
      [25, eerste lid][ref3], [35, eerste lid][ref4], en [37, eerste lid][ref5], dan wel in het jaarverslag behorende bij
      deze vergunning reeds melding is gedaan van de handelingen met deze bronnen.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0012702#Artikel25
      [ref4]: https://wetten.overheid.nl/BWBR0012702#Artikel35
      [ref5]: https://wetten.overheid.nl/BWBR0012702#Artikel37
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref3
        bwb_id: BWBR0012702
        artikel: '25'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref4
        bwb_id: BWBR0012702
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '4.4'
      - id: ref5
        bwb_id: BWBR0012702
        artikel: '37'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: '22'
    text: |-
      Indien met een toestel of radioactieve stof geen handelingen meer worden verricht die zijn gemeld overeenkomstig
      [artikel 21][ref1], meldt de ondernemer dit zo spoedig mogelijk na het beëindigen van de handeling aan de
      Autoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel21
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '21'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '23.1'
    text: 'Het is verboden zonder vergunning van de Autoriteit een handeling te verrichten met:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel23
  - number: 23.1.a
    text: 'een toestel voor:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel23
  - number: 23.1.a.1°
    text: industriële radiografie;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel23
  - number: 23.1.a.2°
    text: bewerking van producten;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel23
  - number: 23.1.a.3°
    text: onderwijsdoeleinden;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel23
  - number: 23.1.a.4°
    text: blootstelling van personen en dieren voor therapeutische doeleinden;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel23
  - number: 23.1.b
    text: een ander toestel dan bedoeld onder a met een maximale hoogspanning van 100 kV of meer;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel23
  - number: 23.1.c
    text: een toestel dat deeltjes versnelt en ioniserende straling met een energie van meer dan 1 MeV kan uitzenden.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel23
  - number: '23.2'
    text: |-
      Het is voorts verboden zonder vergunning van de Autoriteit onderzoeks- en ontwikkelingswerk te verrichten aan een
      toestel.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel23
  - number: '23.3'
    text: 'Het verbod, bedoeld in het eerste lid, geldt niet voor:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel23
  - number: 23.3.a
    text: handelingen met elektronenmicroscopen;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel23
  - number: 23.3.b
    text: het uitsluitend in opslag hebben van toestellen ten behoeve van de handel in deze toestellen;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel23
  - number: 23.3.c
    text: |-
      een toestel dat wordt gebruikt voor onderwijsdoeleinden, dat onder normale bedrijfsomstandigheden op 0,1 meter
      afstand van enig bereikbare buitenzijde van het toestel geen hoger omgevingsdosisequivalenttempo veroorzaakt dan 1
      µSv per uur en dat behoort tot een type dat door de Autoriteit is goedgekeurd op grond van bij verordening van de
      Autoriteit gestelde regels;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel23
  - number: 23.3.d
    text: 'handelingen met toestellen die zijn bestemd en worden gebruikt ten behoeve van de volgende toepassingen:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel23
  - number: 23.3.d.1°
    text: |-
      diergeneeskundige diagnostiek, uitsluitend voor zover het veterinaire toepassingen betreft met een toestel met
      alleen een verticaal neerwaarts gerichte bundel met een vaste focus- film afstand;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel23
  - number: 23.3.d.2°
    text: röntgendiffractie of spectrografie toegepast in een gesloten veiligheidskabinet;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel23
  - number: 23.3.d.3°
    text: |-
      bagagecontrole met een vaste opstelling, met uitzondering van een toestel dat deeltjes versnelt en ioniserende
      straling met een energie van meer dan 1 MeV kan uitzenden;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel23
  - number: 23.3.d.4°
    text: kwaliteitscontrole van levensmiddelen en andere producten.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel23
  - number: '24'
    text: 'Het is verboden zonder vergunning van de Autoriteit:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel24
  - number: 24.a
    text: |-
      radioactieve stoffen toe te dienen aan personen en, voor zover het de bescherming van mensen tegen ioniserende
      straling betreft, aan dieren voor:
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel24
  - number: 24.a.1°
    text: het stellen van medische of veterinaire diagnoses;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel24
  - number: 24.a.2°
    text: therapie of (bio)medisch onderzoek;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel24
  - number: 24.b
    text: radioactieve stoffen toe te voegen aan producten, bestemd voor gebruik op of in de directe omgeving van personen;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel24
  - number: 24.c
    text: 'met radioactieve stoffen handelingen te verrichten voor:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel24
  - number: 24.c.1°
    text: industriële radiografie;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel24
  - number: 24.c.2°
    text: bewerking van producten;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel24
  - number: 24.c.3°
    text: onderwijsdoeleinden en wetenschappelijk onderzoek.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel24
  - number: '25.1'
    text: |-
      Het is verboden zonder vergunning van de Autoriteit een andere handeling dan bedoeld in [artikel 24][ref1] of
      [37][ref2], niet zijnde een lozing, met een radioactieve stof te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel37
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '37'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: '25.2'
    text: |-
      Het verbod, bedoeld in het eerste lid en in [artikel 24, onder c][ref1], geldt niet indien binnen een locatie:


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel24
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 25.2.a
    text: |-
      de activiteit van de radionucliden in de betrokken radioactieve stof lager is dan de krachtens
      [artikel 3, eerste lid, aanhef en onder c][ref1], daarvoor vastgestelde waarde,


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel3
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '3'
        hoofdstuk: '1'
  - number: 25.2.b
    text: |-
      de activiteitsconcentratie van die stof lager is dan de krachtens [artikel 3, eerste lid, aanhef en onder c][ref1],
      daarvoor vastgestelde waarde, of


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel3
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '3'
        hoofdstuk: '1'
  - number: 25.2.c
    text: 'een handeling wordt verricht met:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel25
  - number: 25.2.c.1°
    text: een Nikkel-63 bron die onderdeel is van analyseapparatuur met een maximale activiteit van 1 GBq, of
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel25
  - number: 25.2.c.2°
    text: |-
      een meet-, regel- of ijkbron in een vaste opstelling met een activiteit van de gebruikte nuclide van minder dan 100
      maal de activiteit van de krachtens artikel 3 daarvoor vastgestelde waarde.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel25
  - number: '25.3'
    text: |-
      Indien een radioactieve stof meer soorten radionucliden bevat, wordt de activiteitsconcentratie van de
      radionucliden gewogen gesommeerd volgens de bij verordening van de Autoriteit aan te wijzen methode. Aan het tweede
      lid, onder b, wordt voldaan indien de uitkomst van deze sommatie kleiner of gelijk aan 1 is.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel25
  - number: '25.4'
    text: |-
      Indien binnen een locatie op enig moment meer handelingen plaatsvinden, worden de activiteiten van de radionucliden
      in de bij die handelingen betrokken radioactieve stoffen gewogen gesommeerd volgens de bij verordening van de
      Autoriteit aan te wijzen methode. Aan het tweede lid, onder a, wordt voldaan indien de uitkomst van deze sommatie
      kleiner of gelijk aan 1 is.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel25
  - number: '25.5'
    text: |-
      Bij verordening van de Autoriteit kunnen handelingen met producten als bedoeld in [artikel 24, onder b][ref1],
      worden aangewezen, waarbij de aan deze producten toegevoegde radionucliden niet worden betrokken bij een sommatie
      als bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel24
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '25.6'
    text: |-
      De verboden, bedoeld in het eerste lid en in de [artikelen 23][ref1] en [24][ref2], gelden niet voor bij regeling
      van Onze Minister aangewezen handelingen die een beperkt risico van blootstelling van mensen tot gevolg hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel24
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '25.7'
    text: |-
      Bij verordening van de Autoriteit kunnen andere methoden worden aangewezen voor het bepalen en het toetsen van de
      schade in gevallen waarin de in het tweede lid bedoelde activiteitsconcentratie in combinatie met de in het tweede
      lid bedoelde activiteit geen juiste indicatie geeft van de schade die de bij de handeling betrokken radioactieve
      stoffen kunnen veroorzaken.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel25
  - number: '25.8'
    text: |-
      Bij regeling van Onze Minister kan in afwijking van het tweede lid, het eerste lid van toepassing worden verklaard
      in geval er sprake is van een te hoog risico van blootstelling van werknemers en leden van de bevolking.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel25
  - number: '26.1'
    text: |-
      Het in [artikel 25, eerste lid][ref1], gestelde verbod geldt tevens niet voor handelingen met een ingekapselde
      bron waarbij de krachtens [artikel 3, aanhef en onder c][ref2], vastgestelde waarde voor de activiteit en de
      activiteitsconcentratie worden overschreden, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel3
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '25'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '3'
        hoofdstuk: '1'
  - number: 26.1.a
    text: deze van een door de Autoriteit goedgekeurd type is, en
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel26
  - number: 26.1.b
    text: |-
      deze onder normale bedrijfsomstandigheden op 0,1 meter van enige bereikbare buitenzijde daarvan geen hogere
      omgevingsdosisequivalent kan geven dan 1 µSv per uur.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel26
  - number: '26.2'
    text: |-
      Bij verordening van de Autoriteit kunnen regels worden gesteld met betrekking tot keuringen als bedoeld in het
      eerste lid, onder a, en voor de opslag en de verwijdering van ingekapselde bronnen als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel26
  - number: '27'
    text: |-
      In afwijking van de [artikelen 24, onder b][ref1], en [25][ref2] is het verboden:


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel25
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '25'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 27.a
    text: voor verlichtingsdoeleinden radionucliden toe te voegen aan een aanwijsinstrument;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel27
  - number: 27.b
    text: |-
      handelingen te verrichten met het aanwijsinstrument waaraan voor verlichtingsdoeleinden radionucliden zijn
      toegevoegd.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel27
  - number: '28'
    text: |-
      De in de [artikelen 24, onder b][ref1], en [27][ref2], gestelde verboden gelden niet indien:


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel27
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '27'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 28.a
    text: het een aanwijsinstrument betreft;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel28
  - number: 28.b
    text: |-
      uitsluitend H-3 in lichtcellen of Pm-147 in lichtgevende verf wordt, onderscheidenlijk is toegevoegd voor
      verlichtingsdoeleinden;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel28
  - number: 28.c
    text: het aanwijsinstrument in totaal een lagere activiteit bevat dan 1 GBq H-3 of 10 MBq Pm-147;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel28
  - number: 28.d
    text: |-
      het aanwijsinstrument voldoet aan in het belang van de bescherming tegen ioniserende straling bij verordening van
      de Autoriteit gestelde voorschriften met betrekking tot de constructie;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel28
  - number: 28.e
    text: |-
      op het aanwijsinstrument de bij verordening van de Autoriteit aangewezen merk- of waarschuwingstekens zijn
      aangebracht;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel28
  - number: 28.f
    text: |-
      herstel- en onderhoudswerkzaamheden aan het aanwijsinstrument worden verricht overeenkomstig de door de Autoriteit
      bij verordening vastgestelde regels; en
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel28
  - number: 28.g
    text: |-
      niet meer dan 500 aanwijsinstrumenten waaraan voor verlichtingsdoeleinden H-3 in lichtcellen of Pm-147 in
      lichtgevende verf is toegevoegd, voorhanden zijn.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel28
  - number: '29.1'
    text: |-
      Het is verboden buiten Nederland vervaardigde aanwijsinstrumenten waaraan voor verlichtingsdoeleinden radionucliden
      zijn toegevoegd, voorhanden te hebben met het doel deze binnen Nederland in de handel te brengen, indien deze
      instrumenten niet voldoen aan de bij of krachtens de [artikelen 27][ref1] en [28][ref2] gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel28
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '27'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '28'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '29.2'
    text: |-
      Onze Minister van Defensie kan ontheffing verlenen van de in de [artikelen 24, onder b][ref1], en
      [25, eerste lid][ref2], en [27][ref3] gestelde verboden indien het aanwijsinstrumenten betreft waaraan voor
      verlichtingsdoeleinden radionucliden zijn toegevoegd en die in gebruik zijn dan wel bestemd zijn voor gebruik bij
      de krijgsmacht en die bedoeld zijn voor gebruik onder operationele omstandigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0012702#Artikel27
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '25'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref3
        bwb_id: BWBR0012702
        artikel: '27'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: '29.3'
    text: Bij verordening van de Autoriteit kunnen nadere regels worden gesteld met betrekking tot aanwijsinstrumenten.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel29
  - number: '35.1'
    text: |-
      Het is verboden zich zonder vergunning van de Autoriteit te ontdoen van radioactieve stoffen door middel van lozing
      in de lucht, in het openbare riool of in het oppervlaktewater.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel35
  - number: '35.2'
    text: 'Dit verbod geldt niet indien:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel35
  - number: 35.2.a
    text: |-
      bij lozing in de lucht, de activiteit van de in totaal in een kalenderjaar geloosde hoeveelheid radioactieve
      stoffen bij het verlaten van de locatie via een lozingspunt lager is dan 1 radiotoxiciteitsequivalent voor
      inhalatie als bedoeld in de bijlage;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel35
  - number: 35.2.b
    text: |-
      bij lozing in het openbare riool, de activiteit van de in totaal in een kalenderjaar geloosde hoeveelheid
      radioactieve stoffen bij het verlaten van de locatie via een lozingspunt lager is dan 10 radiotoxiciteitsequivalent
      voor ingestie als bedoeld in de bijlage;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel35
  - number: 35.2.c
    text: |-
      bij lozing in het oppervlaktewater, de activiteit van de in totaal in een kalenderjaar geloosde
      hoeveelheid radioactieve stoffen bij het verlaten van de locatie via een lozingspunt lager is dan 0,1
      radiotoxiciteitsequivalent voor ingestie als bedoeld in de bijlage.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel35
  - number: '35.3'
    text: Het is verboden radioactieve stoffen te lozen op of in de bodem.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel35
  - number: '35.4'
    text: |-
      Het verbod, bedoeld in het derde lid, geldt niet voor het lozen in de bodem, wanneer de in een kalenderjaar
      totaal geloosde hoeveelheid radioactieve stoffen bij het verlaten van het lozingspunt minder bedraagt dan 10-6
      radiotoxiciteitsequivalent voor ingestie als bedoeld in de bijlage.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel35
  - number: '35.5'
    text: |-
      Het verbod, bedoeld in het derde lid, geldt niet voor het lozen van productiewater bij mijnbouw, indien dit
      geschiedt door middel van injecteren naar een soortgelijke bodemformatie en diepte als waaruit het water afkomstig
      is en op zodanige wijze dat het water niet in andere watervoerende lagen komt.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel35
  - number: '35.6'
    text: |-
      De geloosde hoeveelheden, uitgedrukt in radiotoxiciteitsequivalenten, worden gecorrigeerd voor fysisch verval door
      middel van de correctiefactoren zoals aangegeven in de bijlage.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel35
  - number: '36.1'
    text: 'De ondernemer die een handeling verricht, zorgt ervoor dat, zoveel als redelijkerwijs mogelijk is:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel36
  - number: 36.1.a
    text: het ontstaan van radioactieve afvalstoffen wordt voorkomen of beperkt,
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel36
  - number: 36.1.b
    text: bronnen na gebruik als zodanig opnieuw worden gebruikt,
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel36
  - number: 36.1.c
    text: radioactieve stoffen en materialen waaruit een bron bestaat, na gebruik ervan opnieuw worden gebruikt, of
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel36
  - number: 36.1.d
    text: |-
      voorwerpen, stoffen en materialen die met radioactieve stoffen zijn besmet of geactiveerd, na gebruik ervan zodanig
      worden bewerkt dat ze opnieuw kunnen worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel36
  - number: '36.2'
    text: |-
      Bij het vervaardigen van bronnen wordt gebruik gemaakt van stoffen en materialen die na gebruik van de bron geen of
      zo min mogelijk nadelige gevolgen voor het milieu veroorzaken.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel36
  - number: '36.3'
    text: |-
      De ondernemer zorgt er voor dat een handeling zoveel als mogelijk is wordt verricht op een wijze waardoor de
      bescherming tegen schade is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel36
  - number: '37.1'
    text: |-
      Het is verboden zich zonder vergunning van de Autoriteit te ontdoen van radioactieve stoffen voor product- of
      materiaalhergebruik of van radioactieve afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel37
  - number: '37.2'
    text: 'Het verbod geldt niet indien:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel37
  - number: 37.2.a
    text: |-
      de activiteit van de radionucliden in de betrokken radioactieve stoffen in een kalenderjaar in totaal lager is
      dan de waarde die voor die radioactieve stoffen krachtens [artikel 3, eerste lid, aanhef en onder c][ref1], is
      vastgesteld, of


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel3
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '3'
        hoofdstuk: '1'
  - number: 37.2.b
    text: |-
      de activiteitsconcentratie van die stof lager is dan de daarvoor krachtens
      [artikel 3, eerste lid, aanhef en onder c][ref1], vastgestelde waarde.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel3
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '3'
        hoofdstuk: '1'
  - number: '37.3'
    text: |-
      [Artikel 25, derde, vierde, zesde en zevende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel25
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '25'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '37.4'
    text: |-
      Het verbod geldt, onverminderd het bepaalde in [artikel 11, zesde lid][ref1], tevens niet indien het ingekapselde
      bronnen betreft, die worden teruggenomen door degene die de bron heeft vervaardigd of geleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel11
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '37.5'
    text: |-
      Het verbod geldt tevens niet indien het een feitelijke levering betreft van radioactieve stoffen door enkele
      overgave aan een derde met het oog op:
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel37
  - number: 37.5.a
    text: product- of materiaalhergebruik van radioactieve stoffen, of
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel37
  - number: 37.5.b
    text: inzameling van radioactieve afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel37
  - number: '37.6'
    text: |-
      Het verbod geldt tevens niet voor afgifte aan een door de Autoriteit aangewezen instelling voor ontvangst van in
      bezit genomen radioactieve stoffen als bedoeld in [artikel 33, vierde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel33
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '33'
  - number: '37.7'
    text: |-
      Het verbod geldt tevens niet voor het zich ontdoen van radioactieve afvalstoffen door afgifte aan een door de
      Autoriteit erkende ophaaldienst voor radioactieve afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel37
  - number: '37.8'
    text: |-
      Het verbod geldt tevens niet voor afgifte aan door de Autoriteit aangewezen instellingen voor de ontvangst van
      radioactieve afvalstoffen.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel37
  - number: '37.9'
    text: |-
      Het vierde tot en met achtste lid gelden alleen indien de ondernemer zich ervan heeft vergewist dat de ontvanger
      in het bezit is van een vergunning voor de desbetreffende handeling of anderszins gerechtigd is deze stoffen te
      ontvangen.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel37
  - number: '37.10'
    text: |-
      Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op de aanvraag om een aanwijzing
      als bedoeld in het zesde en achtste lid en de aanvraag om een erkenning als bedoeld in het zevende lid.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '38.1'
    text: |-
      Een radioactieve stof kan door de Autoriteit of de ondernemer als radioactieve afvalstof worden aangemerkt, indien
      voor deze stof geen gebruik of product- of materiaalhergebruik is voorzien door de Autoriteit of door de ondernemer
      en er geen sprake is van lozing van de stof.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel38
  - number: '38.2'
    text: |-
      Een afvalstof wordt niet als radioactieve afvalstof aangemerkt, indien [artikel 37, tweede lid][ref1], van
      toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel37
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '37'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: '38.3'
    text: Radioactieve afvalstoffen worden zo snel als redelijkerwijs mogelijk afgevoerd.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel38
  - number: '38.4'
    text: |-
      De in het derde lid gestelde verplichting geldt niet indien de radioactieve afvalstoffen een fysische
      halveringstijd hebben van minder dan 100 dagen en maximaal 2 jaar worden opgeslagen in een daartoe geschikte ruimte
      met het oog op fysisch verval tot afvalstoffen als bedoeld in [artikel 37, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel37
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '37'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: '38.5'
    text: |-
      Het is verboden radioactieve afvalstoffen te mengen met het doel de activiteitsconcentratie van de stoffen beneden
      de krachtens [artikel 3, eerste lid, aanhef en onder a][ref1], daarvoor vastgestelde waarden te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel3
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '3'
        hoofdstuk: '1'
  - number: '39'
    text: 'Geen vergunning krachtens dit hoofdstuk wordt verleend indien:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel39
  - number: 39.a
    text: |-
      niet aan de voorwaarden van de [artikelen 4][ref1], [5][ref2], [6][ref3], [9][ref4], [10][ref5], [11][ref6],
      [12][ref7], [48][ref8], [76][ref9], [77][ref10] en [78][ref11] betreffende rechtvaardiging, deskundigheid,
      optimalisatie en dosislimieten is voldaan;


