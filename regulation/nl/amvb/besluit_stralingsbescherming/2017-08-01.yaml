  - number: '115'
    text: |-
      De ondernemer zorgt ervoor dat voorzieningen worden getroffen ter voorbereiding op het verrichten van een
      interventie voor het geval dat zich binnen de locatie een radiologische noodsituatie voordoet. Hij stelt voor
      iedere locatie een interventieplan op, dat hij regelmatig test.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel115
  - number: '116.1'
    text: |-
      De ondernemer treft, indien zich binnen de locatie een radiologische noodsituatie voordoet, onverwijld alle
      passende maatregelen om de gevolgen daarvan te beperken.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel116
  - number: '116.2'
    text: |-
      De ondernemer brengt de radiologische noodsituatie onverwijld ter kennis van de burgemeester van de gemeente waar
      die situatie zich voordoet.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel116
  - number: '116.3'
    text: |-
      De ondernemer maakt onverwijld een voorlopige beoordeling van de omstandigheden en de gevolgen van die situatie en
      meldt deze aan de burgemeester en aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel116
  - number: '116.4'
    text: |-
      De ondernemer zorgt ervoor dat alle medewerking wordt verleend aan een interventie die door een bestuursorgaan
      wordt verricht.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel116
  - number: '117.1'
    text: |-
      Onze in [artikel 113][ref1] genoemde Ministers stellen, ieder voor zover het het in dat artikel genoemde belang
      betreft, regels met betrekking tot de uitvoering van interventies.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel113
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '113'
        hoofdstuk: '9'
  - number: '117.2'
    text: |-
      Degene onder wiens verantwoordelijkheid de interventie wordt verricht, zorgt ervoor dat de gevolgen en de
      doeltreffendheid van een interventie worden bepaald en geregistreerd.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel117
  - number: '118.1'
    text: |-
      De [artikelen 48][ref1], [49][ref2], [76][ref3] en [77][ref4] zijn in geval van interventie in een radiologische
      noodsituatie niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0012702#Artikel76
      [ref4]: https://wetten.overheid.nl/BWBR0012702#Artikel77
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '48'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '49'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0012702
        artikel: '76'
        hoofdstuk: '7'
        paragraaf: '7.1'
      - id: ref4
        bwb_id: BWBR0012702
        artikel: '77'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '118.2'
    text: |-
      In geval van interventie in een radiologische noodsituatie gelden voor werknemers en hulpverleners als
      dosisbeperking voor de effectieve dosis voor: levensreddend werk: 750 mSv redden van belangrijke materiële
      belangen: 250 mSv ondersteuning of uitvoering van metingen, evacuatie, jodiumprofylaxe, openbare orde en
      veiligheid: 100 mSv
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel118
  - number: '118.3'
    text: |-
      De in het tweede lid aangegeven waarden voor levensreddend werk worden slechts overschreden, indien dat
      noodzakelijk is om mensenlevens te redden of belangrijke materiële belangen veilig te stellen, de betrokken
      werknemer of hulpverlener door de ondernemer is geïnformeerd over de risico's van de interventie en de interventie
      vrijwillig wordt uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel118
  - number: '118.4'
    text: |-
      [Artikel 113, tweede lid][ref1], en [artikel 114][ref2], zijn van overeenkomstige toepassing voor werknemers en
      hulpverleners die bij een interventie belast zijn met de in het tweede lid genoemde taken.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel113
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel114
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel118
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '113'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '114'
        hoofdstuk: '9'
  - number: '119.1'
    text: |-
      Onze in [artikel 113][ref1] genoemde Ministers, ieder voor zover het het in dat artikel genoemde belang betreft, of
      de ondernemer kunnen een situatie aanmerken als een situatie die leidt tot langdurige blootstelling als gevolg van
      een radiologische noodsituatie of van een vroegere handeling of werkzaamheid.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel113
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '113'
        hoofdstuk: '9'
  - number: '119.2'
    text: |-
      Onze in [artikel 113][ref1] genoemde Ministers kunnen in het geval dat de situatie als bedoeld in het eerste lid
      onder de verantwoordelijkheid van een ondernemer valt, de ondernemer verplichten de interventie uit te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel113
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '113'
        hoofdstuk: '9'
  - number: '119.3'
    text: |-
      In een geval als bedoeld in het eerste lid, draagt degene onder wiens verantwoordelijkheid de interventie wordt
      verricht, voor zover dat nodig is met het oog op het gevaar van blootstelling, zorg voor:
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel119
  - number: 119.3.a
    text: de afbakening van het desbetreffende gebied;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel119
  - number: 119.3.b
    text: de invoering van een bewakingssysteem voor de blootstelling;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel119
  - number: 119.3.c
    text: de uitvoering van de interventie, overeenkomstig een door Onze betrokken Minister goedgekeurd plan van aanpak;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel119
  - number: 119.3.d
    text: |-
      het regelen van de toegang tot of het gebruik van de locaties of gebouwen, die zich in het afgebakende gebied
      bevinden.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel119
  - number: '119.4'
    text: |-
      Met betrekking tot interventie in een geval als bedoeld in het eerste lid is dit besluit, met uitzondering
      van de [paragrafen 4.2 tot en met 4.4][ref1] en de [artikelen 39, onder b][ref2], [48][ref3], en
      [114 tot en met 118][ref4], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0012702#Artikel48
      [ref4]: https://wetten.overheid.nl/BWBR0012702#Artikel114
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0012702
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '39'
        hoofdstuk: '4'
        paragraaf: '4.5'
      - id: ref3
        bwb_id: BWBR0012702
        artikel: '48'
        hoofdstuk: '5'
      - id: ref4
        bwb_id: BWBR0012702
        artikel: '114'
        hoofdstuk: '9'
  - number: '120.1'
    text: |-
      De ondernemer die handelingen verricht, houdt een administratie bij van die handelingen. Deze administratie wordt
      ondergebracht in een beheersysteem.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel120
  - number: '120.2'
    text: 'De administratie bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel120
  - number: 120.2.a
    text: |-
      de naam van de rechtspersoon en de verantwoordelijke algemeen coördinerend deskundige, coördinerend deskundige of
      toezichthoudend deskundige;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel120
  - number: 120.2.b
    text: de plaats waar de handelingen worden verricht;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel120
  - number: 120.2.c
    text: een omschrijving van de aard en de omvang van de handelingen;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel120
  - number: 120.2.d
    text: de risicoanalyse.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel120
  - number: '120.3'
    text: |-
      Bij verordening van de Autoriteit worden nadere regels voor de inhoud en regels voor de bewaartermijnen van de
      administratie gesteld.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel120
  - number: 120a.1
    text: |-
      De ondernemer die handelingen verricht met een hoogactieve bron, verstrekt de Autoriteit schriftelijk de relevante
      gegevens met betrekking tot die bron.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel120a
  - number: 120a.2
    text: |-
      Bij verordening van de Autoriteit worden nadere regels gesteld met betrekking tot die gegevens en de tijdstippen
      waarop deze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel120a
  - number: '121.1'
    text: |-
      Degene die op wisselende plaatsen handelingen verricht in het kader van industriële radiografie, houdt per locatie
      een administratie bij van die handelingen.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel121
  - number: '121.2'
    text: Een administratie als bedoeld in het eerste lid wordt ondergebracht in een beheersysteem.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel121
  - number: '121.3'
    text: |-
      Degene die een administratie als bedoeld in het eerste lid voert, bewaart de gegevens waaruit die administratie
      bestaat, tenminste gedurende drie jaar na het kalenderjaar waarop zij betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel121
  - number: '121.4'
    text: |-
      Bij verordening van de Autoriteit worden nadere eisen gesteld waaraan de administratie, bedoeld in het eerste lid,
      moet voldoen.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel121
  - number: '121.5'
    text: |-
      De in het eerste lid gestelde verplichting geldt niet indien het aantal tevoren geschatte opnamen per kalenderjaar
      minder dan 100 is.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel121
  - number: '122.1'
    text: |-
      Degene die handelingen verricht voldoet aan nadere eisen terzake van de bij of krachtens dit besluit gestelde
      regels.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel122
  - number: '122.2'
    text: |-
      Nadere eisen die uitsluitend betrekking hebben op de bescherming van werknemers tegen ioniserende straling ten
      gevolge van handelingen worden gesteld:
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel122
  - number: 122.2.a
    text: 'indien het mijnbouw betreft: door Onze Minister van Economische Zaken;'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel122
  - number: 122.2.b
    text: |-
      indien het een inrichting betreft, waarvoor een vergunning krachtens [artikel 15, onder b, van de wet][ref1] is
      verleend, door de Autoriteit;


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel122
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: 122.2.c
    text: |-
      indien het andere handelingen betreft: door een daartoe door Onze Minister van Sociale Zaken en Werkgelegenheid
      aangewezen ambtenaar.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel122
  - number: '122.3'
    text: |-
      Nadere eisen die geen betrekking hebben op de bescherming van werknemers tegen ioniserende straling ten gevolge van
      handelingen worden gesteld:
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel122
  - number: 122.3.a
    text: door de Autoriteit, of
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel122
  - number: 122.3.b
    text: |-
      voor zover het de onder hem ressorterende belangen betreft: door Onze Minister van Volksgezondheid, Welzijn en
      Sport, of
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel122
  - number: 122.3.c
    text: 'indien het mijnbouw op het continentaal plat betreft: door Onze Minister van Economische Zaken.'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel122
  - number: '122.4'
    text: |-
      Nadere eisen die zowel de in het tweede als in het derde lid bedoelde belangen betreffen, worden gesteld door de in
      die leden genoemde bestuursorganen gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel122
  - number: '123.1'
    text: |-
      In bijzondere gevallen kan ontheffing worden verleend van de voorschriften in de [hoofdstukken 3][ref1],
      [5][ref2], [6][ref3], [7][ref4], [8][ref5] en [10][ref6] van dit besluit. De ontheffing wordt verleend door:


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Hoofdstuk5
      [ref3]: https://wetten.overheid.nl/BWBR0012702#Hoofdstuk6
      [ref4]: https://wetten.overheid.nl/BWBR0012702#Hoofdstuk7
      [ref5]: https://wetten.overheid.nl/BWBR0012702#Hoofdstuk8
      [ref6]: https://wetten.overheid.nl/BWBR0012702#Hoofdstuk10
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0012702
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0012702
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0012702
        hoofdstuk: '6'
      - id: ref4
        bwb_id: BWBR0012702
        hoofdstuk: '7'
      - id: ref5
        bwb_id: BWBR0012702
        hoofdstuk: '8'
      - id: ref6
        bwb_id: BWBR0012702
        hoofdstuk: '10'
  - number: 123.1.a
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid, indien het de bescherming van werknemers betreft,
      tenzij het de bescherming betreft van werknemers in inrichtingen waarvoor een vergunning krachtens
      [artikel 15, onder b, van de Kernenergiewet][ref1] is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: 123.1.b
    text: Onze Minister van Volksgezondheid, Welzijn en Sport, indien het de bescherming van patiënten betreft;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel123
  - number: 123.1.c
    text: Onze Minister van Defensie indien het de krijgsmacht betreft;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel123
  - number: 123.1.d
    text: Onze Minister van Economische Zaken indien het mijnbouw betreft;
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel123
  - number: 123.1.e
    text: de Autoriteit in de overige gevallen.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel123
  - number: '123.2'
    text: Aan de ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel123
  - number: '123.3'
    text: |-
      Met toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op de aanvraag om een ontheffing
      als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '124'
    text: |-
      Indien dit in het belang van de bescherming tegen ioniserende straling naar het oordeel van Onze Ministers dringend
      noodzakelijk is en naar hun oordeel een wijziging van dit besluit niet kan worden afgewacht, kunnen bij regeling
      van Onze Ministers regels worden gesteld, die van dit besluit afwijken maar met een strekking als bedoeld in dit
      besluit. Een zodanige regeling vervalt een jaar nadat zij in werking is getreden, of, indien binnen die termijn
      een wijziging van de betrokken bepaling van dit besluit inwerking is getreden, op het tijdstip waarop die wijziging
      in werking treedt. Onze Ministers kunnen de termijn bij ministeriële regeling eenmaal met ten hoogste een jaar
      verlengen.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel124
  - number: '125'
    text: |-
      Het Besluit stralenbescherming Kernenergiewet en het Besluit registratie radioactieve stoffen en kosten
      keuringsdiensten Kernenergiewet worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel125
  - number: '127.1'
    text: 'Een vergunning, die voor de datum van inwerkingtreding van dit besluit is verleend krachtens:'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel127
  - number: 127.1.a
    text: |-
      [artikel 29 van de wet][ref1], juncto artikel 6 en 7 van het Besluit stralenbescherming Kernenergiewet zoals dat
      besluit luidde tot de datum van inwerkingtreding van dit besluit;


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel29
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '29'
  - number: 127.1.b
    text: |-
      [artikel 34 van de wet][ref1], juncto artikel 8 van het Besluit stralenbescherming Kernenergiewet zoals dat besluit
      luidde tot de datum van inwerkingtreding van dit besluit, of


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel34
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '34'
  - number: 127.1.c
    text: |-
      [artikel 26 van de Mijnwet continentaal plat][ref1], juncto
      [artikel 167 van het Mijnreglement continentaal plat][ref2], zoals dat besluit luidde tot de datum
      van inwerkingtreding van dit besluit, berust na de datum van inwerkingtreding van dit besluit op de
      [artikelen 23][ref3], [24][ref4], [25][ref5] of [108][ref6] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0002504#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0002564#Artikel167
      [ref3]: https://wetten.overheid.nl/BWBR0012702#Artikel23
      [ref4]: https://wetten.overheid.nl/BWBR0012702#Artikel24
      [ref5]: https://wetten.overheid.nl/BWBR0012702#Artikel25
      [ref6]: https://wetten.overheid.nl/BWBR0012702#Artikel108
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel127
    references:
