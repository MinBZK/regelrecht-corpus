      het besluit houdende instelling gecentraliseerd systeem voor opslag radiologische gegevens en vaststelling
      stralingspaspoort, op de [artikelen 91][ref1] en [94][ref2] van dit besluit;


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel91
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel94
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel131
