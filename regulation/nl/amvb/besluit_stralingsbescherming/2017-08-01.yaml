        paragraaf: '4.2'
  - number: '132.1'
    text: |-
      Tot een bij regeling van Onze Ministers te bepalen datum wordt een persoon, die in het bezit is van een diploma
      van een opleiding op de niveaus, bedoeld in de Regeling erkenning opleidingen deskundigen radioactieve stoffen
      en toestellen zoals deze regeling luidde tot de datum van inwerkingtreding van dit besluit en de richtlijn van 20
      november 1984 voor erkenning van opleidingen deskundigen radioactieve stoffen en toestellen, aangemerkt als een
      deskundige die is ingeschreven in een register als bedoeld in [artikel 7, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel7
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '132.2'
    text: |-
      Tot een bij regeling van Onze Ministers te bepalen datum wordt een opleiding, die overeenkomstig de Regeling
      erkenning opleidingen deskundigen radioactieve stoffen en toestellen zoals deze regeling luidde tot de datum van
      inwerkingtreding van dit besluit en de richtlijn van 20 november 1984 voor erkenning van opleidingen deskundigen
      radioactieve stoffen en toestellen is erkend, aangemerkt als een opleiding als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel132
  - number: '132.3'
    text: |-
      Tot een bij ministeriële regeling te bepalen datum kunnen Onze Ministers en Onze Minister van Volksgezondheid,
      Welzijn en Sport een opleiding als bedoeld in het tweede lid erkennen.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel132
  - number: '136'
    text: |-
      Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende
      artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel136
  - number: '137'
    text: 'Dit besluit wordt aangehaald als: Besluit stralingsbescherming.'
    url: https://wetten.overheid.nl/BWBR0012702/2017-08-01#Artikel137
