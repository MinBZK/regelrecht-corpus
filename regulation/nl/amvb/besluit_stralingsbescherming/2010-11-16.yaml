  - number: '26'
    text: |-
      1 Het in artikel 25, eerste lid, gestelde verbod geldt tevens niet voor handelingen met een ingekapselde bron
      waarbij de in bijlage 1, tabel 1, genoemde waarden voor de activiteit en de activiteitsconcentratie worden
      overschreden, indien:

      a. deze van een door Onze Ministers goedgekeurd type is, en

      b. deze onder normale bedrijfsomstandigheden op 0,1 meter van enige bereikbare buitenzijde daarvan geen hogere
      omgevingsdosisequivalent kan geven dan 1 µSv per uur.

      2 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot keuringen als bedoeld in het eerste
      lid, onder a, en voor de opslag en de verwijdering van ingekapselde bronnen als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel26
  - number: '27'
    text: |-
      In afwijking van de [artikelen 24, onder b][ref1], en [25][ref2] is het verboden:

      a. voor verlichtingsdoeleinden radionucliden toe te voegen aan een aanwijsinstrument;

      b. handelingen te verrichten met het aanwijsinstrument waaraan voor verlichtingsdoeleinden radionucliden zijn
      toegevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel25
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel27
