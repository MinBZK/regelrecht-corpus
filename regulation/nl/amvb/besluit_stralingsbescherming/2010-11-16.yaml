  - number: '96'
    text: |-
      1 De ondernemer zorgt ervoor dat een stralingsarts het medisch toezicht op A-werknemers uitoefent.

      2 De ondernemer zorgt er voor dat aan de stralingsarts alle tot zijn beschikking staande gegevens worden verstrekt
      die deze nodig heeft om inzicht te krijgen in de gezondheidstoestand van de onder zijn toezicht staande personen en
      om zich een oordeel te vormen over de omstandigheden op de arbeidsplaats voor zover deze van invloed kunnen zijn op
      hun gezondheidstoestand.

      3 Het in het eerste lid bedoelde medisch toezicht omvat:

      a. een medisch onderzoek dat plaatsvindt voor de aanwijzing als A-werknemer en ten doel heeft na te gaan of de
      werknemer geschikt is voor zijn functie;

      b. periodieke keuringen waarbij ten minste eenmaal per jaar wordt nagegaan of de A-werknemer nog geschikt is voor
      het uitvoeren van zijn functie;

      c. onderzoek van personen die niet langer werkzaam zijn als A-werknemer, indien en zolang de stralingsarts dit
      noodzakelijk acht.

      4 Indien de stralingsarts dat noodzakelijk acht, wordt een medisch onderzoek gevolgd door maatregelen van de
      ondernemer in verband met de bescherming van de gezondheid van de werknemer.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel96
  - number: '97'
    text: |-
      1 De ondernemer zorgt ervoor dat een stralingsarts met betrekking tot de geschiktheid van A-werknemers voor de
      aanwijzing als A-werknemer op basis van het medisch onderzoek de volgende indeling toepast:

      a. geschikt;

      b. onder bepaalde omstandigheden geschikt, of

      c. ongeschikt.

      2 De stralingsarts deelt de indeling van de geschiktheid, bedoeld in het eerste lid, onverwijld schriftelijk mee
      aan degene die het onderzoek heeft ondergaan.

      3 Degene die het onderzoek heeft ondergaan kan binnen zes weken na de ontvangst van de mededeling bedoeld in
      het tweede lid een nieuw onderzoek verzoeken aan Onze Minister van Sociale Zaken en Werkgelegenheid, of bij
      mijnbouw aan Onze Minister van Economische Zaken. De betrokken minister deelt de uitslag van het nieuwe onderzoek
      schriftelijk mee aan de onderzochte persoon, aan de stralingsarts en aan de ondernemer.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel97
  - number: '98'
    text: |-
      Een werknemer wordt niet in een specifieke functie als A-werknemer tewerkgesteld indien hij blijkens de uitslag van
      het in [artikel 97, eerste lid][ref1], bedoelde medisch onderzoek ongeschikt is voor deze functie.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel97
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '97'
        hoofdstuk: '7'
        paragraaf: '7.5'
  - number: '99'
    text: |-
      Een medisch onderzoek door een stralingsarts vindt voorts plaats indien daartoe door een blootstelling waarbij
      dosislimieten zijn overschreden of door een blootstelling door een ongeval of een radiologische noodsituatie
      aanleiding bestaat.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel99
  - number: '100'
    text: |-
      1 De ondernemer zorgt ervoor dat er een medisch dossier wordt bijgehouden waarin van elke A-werknemer ten minste
      wordt geregistreerd:

      a. de aard van het werk;

      b. de uitslagen van de onderzoeken, bedoeld in de [artikelen 96][ref1] en [97][ref2];

      c. de resultaten van de individuele monitoring, bedoeld in [artikel 95, tweede lid][ref3];

      d. indien van toepassing de gegevens met betrekking tot een radiologische noodsituatie.

      2 De ondernemer zorgt ervoor dat het medisch dossier, bedoeld in het eerste lid, in ieder geval wordt bewaard
      totdat de persoon op wie de gegevens betrekking hebben de leeftijd van vijfenzeventig jaar heeft bereikt of zou
      hebben bereikt, maar ten minste dertig jaar nadat deze persoon de handelingen heeft beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel96
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel97
      [ref3]: https://wetten.overheid.nl/BWBR0012702#Artikel95
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel100
