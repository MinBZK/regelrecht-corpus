  - number: '115'
    text: |-
      De ondernemer zorgt ervoor dat voorzieningen worden getroffen ter voorbereiding op het verrichten van een
      interventie voor het geval dat zich binnen de locatie een radiologische noodsituatie voordoet. Hij stelt voor
      iedere locatie een interventieplan op, dat hij regelmatig test.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel115
  - number: '116'
    text: |-
      1 De ondernemer treft, indien zich binnen de locatie een radiologische noodsituatie voordoet, onverwijld alle
      passende maatregelen om de gevolgen daarvan te beperken.

      2 De ondernemer brengt de radiologische noodsituatie onverwijld ter kennis van de burgemeester van de gemeente waar
      die situatie zich voordoet.

      3 De ondernemer maakt onverwijld een voorlopige beoordeling van de omstandigheden en de gevolgen van die situatie
      en meldt deze aan de burgemeester en aan Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer.

      4 De ondernemer zorgt ervoor dat alle medewerking wordt verleend aan een interventie die door een bestuursorgaan
      wordt verricht.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel116
  - number: '117'
    text: |-
      1 Onze in [artikel 113][ref1] genoemde Ministers stellen, ieder voor zover het het in dat artikel genoemde belang
      betreft, regels met betrekking tot de uitvoering van interventies.

      2 Degene onder wiens verantwoordelijkheid de interventie wordt verricht, zorgt ervoor dat de gevolgen en de
      doeltreffendheid van een interventie worden bepaald en geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel113
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '113'
        hoofdstuk: '9'
  - number: '118'
    text: |-
      1 De [artikelen 48][ref1], [49][ref2], [76][ref3] en [77][ref4] zijn in geval van interventie in een radiologische
      noodsituatie niet van toepassing.

      2 In geval van interventie in een radiologische noodsituatie gelden voor werknemers en hulpverleners als
      dosisbeperking voor de effectieve dosis voor:

      levensreddend werk: 750 mSv

      redden van belangrijke materiële belangen: 250 mSv

      ondersteuning of uitvoering van metingen, evacuatie,

      jodiumprofylaxe, openbare orde en veiligheid: 100 mSv

      3 De in het tweede lid aangegeven waarden voor levensreddend werk worden slechts overschreden, indien dat
      noodzakelijk is om mensenlevens te redden of belangrijke materiële belangen veilig te stellen, de betrokken
      werknemer of hulpverlener door de ondernemer is geïnformeerd over de risico's van de interventie en de interventie
      vrijwillig wordt uitgevoerd.

      4 [Artikel 113, tweede lid][ref5], en [artikel 114][ref6], zijn van overeenkomstige toepassing voor werknemers en
      hulpverleners die bij een interventie belast zijn met de in het tweede lid genoemde taken.


