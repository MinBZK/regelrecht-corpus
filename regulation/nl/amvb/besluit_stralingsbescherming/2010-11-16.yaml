  - number: '94'
    text: |-
      1 Het is de ondernemer van een in Nederland gevestigde onderneming verboden een werknemer, die niet in het bezit
      is van een geldig stralingspaspoort en een persoonlijk controlemiddel, in een andere lidstaat van de Europese Unie
      handelingen als A-werknemer te laten verrichten.

      2 Het stralingspaspoort wordt op aanvraag door Onze Minister van Sociale Zaken en Werkgelegenheid, of een door hem
      daartoe aangewezen instelling, afgegeven aan een ondernemer ten behoeve van diens werknemer.

      3 Bij terugkeer van de werknemer in Nederland meldt de ondernemer onverwijld de gegevens uit het stralingspaspoort
      aan de in [artikel 91][ref1] bedoelde instelling.

      4 Onze Minister van Sociale Zaken en Werkgelegenheid kan met betrekking tot het bepaalde in dit artikel nadere
      regels stellen die onder meer betrekking hebben op het model van het stralingspaspoort en op de aanvraag, de
      kosten, het verlies of het in het ongerede raken van het stralingspaspoort.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel91
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel94
    references:
      - id: ref1
