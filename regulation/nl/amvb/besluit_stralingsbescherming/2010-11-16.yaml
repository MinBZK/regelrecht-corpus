  - number: 20f
    text: |-
      1 De ondernemer verstrekt voordat hij een hoogactieve bron verwerft, aan Onze Minister van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer:

      a. informatie over het volume van de verworven bron, bronhouder en vaste afscherming van die bron;

      b. schriftelijk bewijs dat de krachtens [artikel 20d, eerste lid][ref1], vereiste financiële zekerheid is gesteld.

      2 Het eerste lid is niet van toepassing indien de daarin bedoelde gegevens reeds op grond van
      [artikel 44, zevende lid][ref2], bij de aanvraag om een vergunning zijn verstrekt.

      3 De ondernemer doet van iedere wijziging met betrekking tot de gestelde financiële zekerheid uiterlijk vier
      weken na die wijziging schriftelijk mededeling aan Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en
      Milieubeheer.

      4 Bij ministeriële regeling kunnen nadere eisen worden gesteld met betrekking tot de te verstrekken gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel20d
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel44
