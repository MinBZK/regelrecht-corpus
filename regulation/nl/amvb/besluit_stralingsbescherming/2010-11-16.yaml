      1 Bij regeling van Onze Ministers, en

      a. indien het medische stralingstoepassingen betreft, Onze Minister van Volksgezondheid, Welzijn en Sport;

      b. indien het mijnbouw betreft, Onze Minister van Economische Zaken;

      c. indien het lozing in het oppervlaktewater betreft, Onze Minister van Verkeer en Waterstaat;

      d. indien het lozing in het oppervlaktewater of lozing in de lucht betreft, Onze Minister van Landbouw, Natuur
      en Voedselkwaliteit;

      kunnen nadere regels worden gesteld met betrekking tot de aanvraag om een vergunning voor een handeling als bedoeld
      in de [artikelen 23, eerste en tweede lid][ref1], [24][ref2], [25, eerste lid][ref3], [35, eerste lid][ref4], en
      [37, eerste lid][ref5].

      2 Een aanvraag als bedoeld in het eerste lid betreft niet de handelingen die binnen de locatie worden verricht
      door de persoon die in het bezit is van een vergunning voor het op steeds wisselende plaatsen verrichten van de
      betrokken handelingen.


