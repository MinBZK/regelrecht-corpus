  - number: '8'
    text: |-
      1 Een dosimetrische dienst heeft tot taak het verstrekken van persoonlijke controlemiddelen aan de ondernemer ten
      behoeve van A- of B-werknemers en het, door het uitlezen van deze controlemiddelen, bepalen in welke mate de A- of
      B-werknemers aan ioniserende straling blootgesteld zijn geweest. Deze taak wordt slechts verricht door een dienst
      die als zodanig is erkend door Onze Minister van Sociale Zaken en Werkgelegenheid.

      2 Bij regeling van Onze Minister van Sociale Zaken en Werkgelegenheid worden eisen vastgesteld met betrekking tot
      de kwaliteit van de dienstverlening, de werkwijze en de deskundigheid van de dienst, waaraan moet worden voldaan om
      krachtens het eerste lid te kunnen worden erkend.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel8
  - number: '9'
    text: |-
      1 De ondernemer zorgt ervoor dat een handeling wordt uitgevoerd door of onder toezicht van een deskundige.

      2 Bij ministeriële regeling kan voor bepaalde handelingen een bepaald niveau van deskundigheid worden geëist.

      3 De bepalingen in dit besluit met betrekking tot de deskundigheid gelden niet voor handelingen die volgens dit
      besluit niet meldingsplichtig of vergunningplichtig zijn.

      4 De ondernemer legt de toedeling van bevoegdheden en verantwoordelijkheden met betrekking tot de bescherming tegen
      ioniserende straling schriftelijk vast.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel9
  - number: '10'
    text: |-
      1 De ondernemer zorgt ervoor dat door of onder toezicht van een deskundige, met het oog op de bescherming tegen
      ioniserende straling, ten minste:

      a. de plannen voor handelingen voorafgaand aan de uitvoering ervan kritisch worden bestudeerd, de risico's ervan
      geïnventariseerd en geëvalueerd en toestemming verleend, voordat met de handeling wordt aangevangen;

      b. wordt geadviseerd over de beveiligingsmiddelen en technieken ter waarborging van een doelmatige bescherming
      van personen;

      c. regelmatig, maar ten minste eenmaal per jaar de doeltreffendheid en het juiste gebruik van de
      beveiligingsmiddelen en technieken worden geverifieerd;

      d. regelmatig, maar ten minste eenmaal per jaar de goede werking en het juiste gebruik van bronnen en instrumenten
      voor meting van ioniserende straling worden gecontroleerd;

      e. deze instrumenten regelmatig worden gekalibreerd.

      2 De ondernemer zorgt ervoor dat een nieuwe of gewijzigde bron niet in gebruik wordt genomen dan na een
      acceptatietest door de deskundige, gevolgd door diens toestemming om de bron in gebruik te nemen.

      3 Voor zover het de bescherming van de blootgestelde werknemer betreft worden de bevindingen
      van de deskundige vastgelegd in het kader van de risico-inventarisatie en -evaluatie, bedoeld in
      [artikel 5 van de Arbeidsomstandighedenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel5
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '5'
  - number: '11'
    text: |-
      1 De ondernemer stelt, na overleg met de deskundige, maatregelen vast om schade tegen te gaan en zorgt ervoor dat
      deze worden uitgevoerd.

      2 De ondernemer zorgt ervoor ten aanzien van bronnen, beveiligingsmiddelen en meetinstrumenten dat:

      a. daaraan het noodzakelijke onderhoud wordt verricht;

      b. de noodzakelijke maatregelen worden genomen om inadequate of defecte onderdelen daarvan te verbeteren of te
      vervangen, en

      c. indien nodig, tot buitengebruikstelling van bronnen wordt overgegaan.

      3 De ondernemer zorgt ervoor dat de integriteit van hoogactieve bronnen door of onder toezicht van een deskundige
      wordt gecontroleerd:

      a. ten minste een maal per jaar en

      b. na elke gebeurtenis waarbij de bron of bronhouder beschadigd kan zijn.

      4 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de controle van de integriteit van
      hoogactieve bronnen.

      5 De ondernemer zorgt er ten aanzien van een hoogactieve bron en haar toebehoren voor dat, door of onder toezicht
      van een deskundige:

      a. wordt gecontroleerd of de bron aanwezig is op de plaats waar deze wordt toegepast of is opgeslagen:

      1°. elke twee maanden, indien de bron minder dan een keer per twee maanden wordt toegepast;

      2°. een maal per jaar, indien de bron een keer of meer dan een keer per twee maanden wordt toegepast;

      b. een maal per jaar wordt gecontroleerd of de bron en de bronhouder nog in goede staat zijn.

      6 Een ondernemer zendt een afgedankte hoogactieve bron, tenzij dit anders met Onze Minister van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer is overeengekomen, onmiddellijk naar:

      a. de leverancier van de bron die bevoegd is de bron te ontvangen,

      b. een krachtens [artikel 37, achtste lid][ref1], daartoe aangewezen instelling voor de ontvangst van radioactieve
      afvalstoffen, of

      c. een andere ondernemer die bevoegd is de bron te ontvangen.

      7 De ondernemer stelt financiële middelen en faciliteiten voor een passende bescherming tegen ioniserende straling
      ter beschikking aan de personen of de stralingsbeschermingseenheid, bedoeld in [artikel 12][ref2], die met de
      uitvoering van die bescherming zijn belast.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel12
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '37'
        hoofdstuk: '4'
        paragraaf: '4.4'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '12'
    text: |-
      1 Bij ministeriële regeling worden ondernemers, soorten ondernemingen of locaties aangewezen, waarin een
      stralingsbeschermingseenheid, waarin tevens de deskundige werkzaam is, aanwezig is en worden regels gesteld voor de
      taken, bevoegdheden en werkwijze van een stralingsbeschermingseenheid.

      2 Indien een stralingsbeschermingseenheid op grond van het eerste lid is voorgeschreven, zorgt de ondernemer ervoor
      dat de stralingsbeschermingseenheid operationeel is en in ieder geval:

      a. daarin voldoende deskundige personen werkzaam zijn;

      b. functioneel en organisatorisch gescheiden is van productie- en technische eenheden;

      c. aan hem adviezen verstrekt met betrekking tot de bescherming tegen ioniserende straling;

      d. toestemming geeft voor een handeling.

      3 Onze Ministers kunnen toestaan dat een stralingsbeschermingseenheid als bedoeld in het eerste lid, voor
      verscheidene ondernemers taken verricht.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel12
  - number: '13'
    text: |-
      1 De ondernemer zorgt ervoor dat een handeling waarbij het voorzienbaar is dat personen onbedoeld aan overmatige
      uitwendige bestraling of overmatige inwendige besmetting kunnen worden blootgesteld, slechts wordt verricht nadat
      een deskundige is geraadpleegd.

      2 Indien naar het oordeel van een deskundige de blootstelling, bedoeld in het eerste lid, zich voordoet of dreigt
      voor te doen, zorgt de ondernemer ervoor dat onmiddellijk:

      a. de handeling wordt gestaakt;

      b. de gevaarlijke plaatsen worden ontruimd;

      c. worden verwittigd:

      1°. de betrokken stralingsarts, indien overmatige uitwendige bestraling of overmatige inwendige besmetting van een
      werknemer heeft plaatsgevonden;

      2°. indien het een radiologische verrichting betreft, de ter plaatse bevoegde Inspecteur voor de Gezondheidszorg;

      3°. indien het arbeidsaspecten betreft, de bedrijfstakdirecteur;

      4°. indien het milieuaspecten betreft, de inspecteur;

      5°. indien het mijnbouw betreft, de Inspecteur-Generaal der Mijnen.

      3 De ondernemer beëindigt een maatregel als bedoeld in het tweede lid, onder a of b, niet dan in overeenstemming
      met de deskundige of met toestemming van de in het tweede lid, onder c, bedoelde personen.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel13
  - number: '14'
    text: |-
      1 De ondernemer zorgt ervoor dat zoveel als redelijkerwijs mogelijk wordt voorkomen dat radioactieve stoffen of
      toestellen zoekraken, worden ontvreemd of ongewild worden verspreid.

      2 De ondernemer stelt schriftelijke instructies vast ter voorkoming van:

      a. ongeoorloofde toegang tot een hoogactieve bron,

      b. verlies of diefstal van een hoogactieve bron, of

      c. beschadiging door brand van een hoogactieve bron.

      3 De ondernemer doet onmiddellijk mededeling aan in ieder geval de inspecteur en de bedrijfstakdirecteur en, indien
      het mijnbouw betreft, tevens aan de Inspecteur-Generaal der Mijnen, van:

      a. het zoekraken, de ontvreemding of de ongewilde verspreiding van een bron;

      b. een ongeoorloofde handeling met een hoogactieve bron;

      c. de getroffen maatregelen na:

      1°. het zoekraken, de ontvreemding of een ongeoorloofde handeling met een hoogactieve bron, of

      2°. elke gebeurtenis waarbij een hoogactieve bron kan zijn beschadigd;

      d. elk incident of ongeval met een hoogactieve bron dat leidt tot onopzettelijke blootstelling van een werknemer of
      een lid van de bevolking.

      4 De ondernemer zorgt ervoor dat radioactieve stoffen of toestellen zoveel als redelijkerwijs mogelijk zijn
      beveiligd tegen brand.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel14
  - number: '15'
    text: |-
      1 De ondernemer zorgt ervoor dat degene die een handeling verricht, en degene die daaraan leiding geeft of daarop
      toezicht houdt, met betrekking tot de werkplek:

      a. voldoende is onderricht met betrekking tot de risico's die verbonden zijn aan ioniserende straling;

      b. is geïnformeerd over de algemeen gangbare methoden ter bescherming tegen ioniserende straling en de te nemen
      voorzorgsmaatregelen zowel voor de handeling in het algemeen, als voor de taak die hem wordt toegewezen en voor
      elke werkplek waar de handeling wordt verricht;

      c. is geïnformeerd over het belang zich aan de technische, gezondheids- en administratieve voorschriften te houden.

      2 Indien de in het eerste lid bedoelde handeling betrekking heeft op een hoogactieve bron, wordt tevens onderricht
      gegeven over:

      a. de voorschriften voor het veilig beheer van hoogactieve bronnen;

      b. de noodzakelijke veiligheidsvoorschriften;

      c. de mogelijke gevolgen van het wegvallen van een passende controle op hoogactieve bronnen.

      3 De in het tweede lid genoemde onderwerpen worden beschreven. Deze documentatie wordt ter beschikking gesteld
      aan degene die een handeling met een hoogactieve bron verricht en aan degene die daaraan leiding geeft of daarop
      toezicht houdt.

      4 Het onderricht over de in het tweede lid genoemde onderwerpen wordt ten minste elke twee jaar herhaald.

      5 De ondernemer stelt met betrekking tot de in het eerste lid genoemde onderwerpen schriftelijke instructies
      vast en verstrekt deze instructies aan personen als bedoeld in het eerste lid en aan anderen die kunnen worden
      blootgesteld door de handelingen.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel15
  - number: '16'
    text: |-
      De ondernemer zorgt ervoor dat vrouwen die ten gevolge van een handeling kunnen worden blootgesteld aan ioniserende
      straling voor aanvang van het verrichten van handelingen zijn geïnformeerd over:

      a. de noodzaak om een zwangerschap in een vroeg stadium te melden;

      b. de risico's van blootstelling aan ioniserende straling voor het ongeboren kind door uitwendige bestraling of
      besmetting;

      c. de risico's die een kind dat borstvoeding krijgt, loopt bij besmetting van de moeder.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel16
  - number: '17'
    text: |-
      De ondernemer zorgt ervoor dat de werknemers meewerken aan het voor hen georganiseerde onderricht en de instructies
      naleven die hen ingevolge dit besluit worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel17
  - number: '18'
    text: |-
      1 De ondernemer zorgt ervoor dat met betrekking tot toestellen:

      a. een zodanige afscherming is aangebracht dat de straling die naar buiten treedt, uitgezonderd op de plaats van
      de opening bestemd voor het naar buiten treden van de nuttige stralenbundel, zo weinig als redelijkerwijs mogelijk
      schade kan toebrengen. Deze afschermingseisen gelden niet:

      1°. voor het testen van een toestel;

      2°. voor röntgenbuizen tot een maximale hoogspanning van meer dan 300 kV, indien deze worden gebruikt in een
      speciaal daarvoor ingerichte plaats, of

      3°. tijdens reparatie, onderhoud of onderzoek met röntgenbuizen opgesteld in laboratoria of beproevingsruimten,
      mits maatregelen zijn genomen waardoor schade ten gevolge van uitwendige bestraling zoveel als redelijkerwijs
      mogelijk wordt voorkomen;

      b. een tubus of een ander middel dat de grootte van de nuttige stralenbundel bepaalt, dezelfde mate van bescherming
      tegen straling waarborgt als het omhulsel van een toestel;

      c. een toestel en de bijbehorende hulp- en beveiligingsmiddelen zodanig zijn opgesteld en afgeschermd dat personen
      zich niet aan de primaire stralenbundel behoeven bloot te stellen, tenzij bij het ondergaan van een radiologische
      verrichting;

      d. tenzij dit redelijkerwijs niet kan worden gevergd, maatregelen worden getroffen ten aanzien van de opstelling en
      werkwijze van een toestel om te voorkomen dat door verstrooide straling schade wordt toegebracht;

      e. een toestel niet door onbevoegden in werking kan worden gesteld;

      f. regelmatig van ieder toestel de goede werking met het oog op de bescherming tegen ioniserende straling wordt
      gecontroleerd;

      2 Onze Minister van Sociale Zaken en Werkgelegenheid kan nadere regels stellen met betrekking tot het bepaalde in
      dit artikel.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel18
  - number: '19'
    text: |-
      1 Onverminderd [artikel 18][ref1] zorgt de ondernemer er ter bescherming van werknemers en van leden van de
      bevolking voor dat toestellen voor diagnostisch of therapeutisch gebruik voor radiologische verrichtingen of in
      de veterinaire praktijk voldoen aan de eis dat bij gesloten opening het omgevingsdosisequivalenttempo van de door
      het omhulsel naar buiten tredende straling, gemeten bij een maximale hoogspanning en de daarbij behorende continu
      toelaatbare stroom op een meter afstand van het focus, niet meer bedraagt dan 1 mSv per uur bij toestellen voor
      diagnostisch gebruik of 10 mSv per uur bij toestellen voor therapeutisch gebruik.

      2 De ondernemer zorgt ervoor dat personen tijdens een radiologische verrichting of bij een veterinaire
      diagnostische of therapeutische verrichting met ioniserende straling, uitgezonderd degene die de verrichting
      ondergaat, zich achter een afscherming van voldoende stralenverzwakkend vermogen of buiten de ruimte waar het
      onderzoek plaatsvindt bevinden of dat aan hen doelmatige persoonlijke beschermingsmiddelen ter beschikking worden
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel18
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: '20'
    text: |-
      1 De ondernemer zorgt ervoor dat, in situaties waar ten gevolge van handelingen of werkzaamheden de in artikel
      49 of 76 genoemde doses kunnen worden overschreden, op daarvoor geschikte plaatsen doelmatige en duidelijke
      waarschuwingsborden of -tekens en opschriften worden aangebracht.

      2 De ondernemer zorgt ervoor dat ruimten en plaatsen waar handelingen met open bronnen worden verricht, de
      inrichting daarvan of daarin gebruikte voorwerpen regelmatig volgens door hem schriftelijk vastgestelde procedures
      worden gecontroleerd op besmetting.

      3 De ondernemer zorgt ervoor dat wanneer open en ingekapselde bronnen niet worden gebruikt, deze, indien dit
      redelijkerwijs mogelijk is, worden opgeborgen in een daartoe geschikte bergplaats.

      4 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot het model, de opschriften en de
      minimale grootte van de waarschuwingsborden of -tekens, bedoeld in het eerste lid, en waar en op welke wijze deze
      moeten worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel20
  - number: 20a
    text: |-
      1 De fabrikant graveert in of stempelt op elke door hem gefabriceerde hoogactieve bron een code die als volgt is
      samengesteld:

      a. de aanduiding: NL,

      b. gevolgd door een aan de fabrikant door Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer
      toegekende vaste code,

      c. gevolgd door een door de fabrikant te bepalen voor de bron onderscheidende code in Romeinse letters of Arabische
      cijfers.

      2 Een aanvraag om de toekenning van de in het eerste lid, onder b, bedoelde code wordt ingediend bij Onze Minister
      van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer. De aanvraag bevat de nummers van de krachtens de
      [artikelen 15, onder a][ref1], of [29, eerste lid, van de wet][ref2] aan de aanvrager verleende vergunningen.

      3 Het eerste lid is niet van toepassing, indien de afmeting van de bron voor de in het eerste lid bedoelde
      handeling te klein is.

      4 De fabrikant graveert de in het eerste lid bedoelde code tevens in de bronhouder van de desbetreffende bron of
      stempelt die code op die bronhouder.

      5 Het vierde lid is niet van toepassing indien de afmeting van de bronhouder voor de in het eerste lid bedoelde
      handeling te klein is, of indien de bronhouder bedoeld is voor hergebruik als behuizing van een bron. In dat
      laatste geval brengt de fabrikant informatie aan over ten minste de aard van de hoogactieve bron op of aan de
      bronhouder.

      6 De fabrikant brengt op of aan de broncontainer informatie aan over de aard van de hoogactieve bron.

      7 De fabrikant van een hoogactieve bron zorgt ervoor dat:

      a. de bron wordt vergezeld van:

      1°. schriftelijke informatie die bevestigt dat de bron voldoet aan het eerste lid en aan de krachtens
      [artikel 20, vierde lid][ref3], met betrekking tot de bron of de bronhouder gestelde regels;

      2°. kleurenfoto’s van het ontwerp van de bron en de bijbehorende bronhouder, en, voorzover van toepassing, van het
      ontwerp van de bijbehorende broncontainer en de bijbehorende apparatuur;

      b. de onder a bedoelde informatie en foto’s bij de levering van de bron worden verstrekt aan degene aan wie die
      bron wordt geleverd;

      c. de in het eerste en vierde lid bedoelde code en de krachtens [artikel 20, vierde lid][ref4], op de bron,
      bronhouder of broncontainer aangebrachte waarschuwingstekens en opschriften leesbaar blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0012702#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0012702#Artikel20
