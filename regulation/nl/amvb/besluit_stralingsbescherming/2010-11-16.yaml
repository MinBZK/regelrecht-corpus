  - number: '87'
    text: |-
      1 De ondernemer stelt aan een blootgestelde werknemer een passend, persoonlijk dosiscontrolemiddel ter beschikking,
      die door de ondernemer wordt betrokken van een dosimetrische dienst als bedoeld in [artikel 8][ref1].

      2 De ondernemer zorgt ervoor dat de persoonlijke dosiscontrolemiddelen door de blootgestelde werknemer
      gedurende de tijden van mogelijke blootstelling op de juiste plaats of plaatsen worden gedragen en dat deze
      dosiscontrolemiddelen periodiek ter uitlezing aan de, in het eerste lid bedoelde, dosimetrische dienst worden
      gezonden.

      3 De ondernemer zorgt ervoor dat de dosimetrische dienst periodiek, met behulp van de met deze
      dosiscontrolemiddelen verkregen gegevens, bepaalt in welke mate deze personen aan ioniserende straling blootgesteld
      zijn geweest.

      4 De ondernemer zorgt ervoor dat voor gevallen waarin blootgestelde werknemers onder voor de werksituatie normale
      condities een relevante inwendige besmetting kunnen ontvangen, er een passend systeem voor de dosiscontrole is.

      5 De ondernemer doet bij overbestraling van een werknemer onmiddellijk mededeling aan de bedrijfstakdirecteur en,
      indien het mijnbouw betreft, de Inspecteur-Generaal der Mijnen.

      6 Onze Minister van Sociale Zaken en Werkgelegenheid kan nadere regels stellen met betrekking tot het bepaalde in
      dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel8
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel87
