  - number: '92'
    text: |-
      1 De ondernemer zorgt ervoor dat de uitslag van de individuele monitoring, bedoeld in de [artikelen 87][ref1],
      [88][ref2] en [89][ref3], onverwijld aan de in [artikel 91][ref4] bedoelde instelling wordt gezonden. De ondernemer
      geeft daarbij aan waar de individuele dosismeter is gedragen of op welke wijze de inwendige besmetting is bepaald.

      2 De werknemer heeft inzage in de gegevens die zijn blootstelling betreffen.


