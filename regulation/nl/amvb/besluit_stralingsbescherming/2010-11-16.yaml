  - number: '3'
    text: |-
      1 De bepaling van de omgevingsdosisequivalenten, de equivalente en de effectieve doses geschiedt op de wijze,
      vermeld in de bijlagen 2, 3 en 4.

      2 Bij ministeriële regeling kunnen regels worden gesteld voor methoden van bepaling van de doses, bedoeld in het
      eerste lid, die gelijkwaardig zijn aan die bedoeld in het eerste lid en in plaats daarvan kunnen worden toegepast.

      3 Bij regeling van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer kunnen:

      a. regels worden gesteld voor de bepaling van de in het eerste lid bedoelde doses;

      b. methoden worden aangewezen voor de wijze waarop deze doses worden getoetst aan de in dit besluit genoemde doses.

      4 Bij ministeriële regeling kunnen regels worden gesteld voor de meetmethoden van activiteit,
      activiteitsconcentratie of oppervlaktebesmetting.

      5 Ten behoeve van de bepaling van doses worden alle effectieve of equivalente doses gesommeerd
      die een persoon ontvangt ten gevolge van handelingen en werkzaamheden, voor zover geregeld
      bij of krachtens dit besluit, met uitzondering van een radiologische verrichting, bij of
      krachtens het [Besluit kerninstallaties, splijtstoffen en ertsen][ref1] en bij of krachtens het
      [Besluit vervoer splijtstoffen, ertsen en radioactieve stoffen][ref2].

      6 Ten behoeve van de toetsing aan de in bijlage 1, tabel 1 en tabel 2, vermelde waarden worden alle activiteiten
      die zich op enig moment binnen een locatie bevinden gewogen en gesommeerd voor zover geregeld bij of krachtens dit
      besluit, bij of krachtens het [Besluit kerninstallaties, splijtstoffen en ertsen][ref3] en bij of krachtens het
      [Besluit vervoer splijtstoffen, ertsen en radioactieve stoffen][ref4].

      7 In afwijking van het zesde lid worden de activiteiten of activiteitsconcentraties in natuurlijke bronnen niet
      gesommeerd met de activiteiten of activiteitsconcentraties in kunstmatige bronnen.


