      over gelijkwaardige kwalificaties beschikt als de stralingsarts respectievelijk deskundige, bedoeld in
      [artikel 1][ref5].

      2 De krachtens het eerste lid ingeschreven persoon beheerst de Nederlandse taal op een zodanig niveau dat
