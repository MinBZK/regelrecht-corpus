  - number: '132'
    text: |-
      1 Tot een bij ministeriële regeling te bepalen datum wordt een persoon, die krachtens artikel 34, eerste lid,
      van het Besluit stralenbescherming Kernenergiewet, zoals dat besluit luidde tot de datum van inwerkingtreding
      van dit besluit, is erkend als arts die belast is met het medisch toezicht aangemerkt als stralingsarts, die is
      ingeschreven in het register, bedoeld in artikel 7, eerste lid.

      2 Tot een bij ministeriële regeling te bepalen datum wordt een persoon, die in het bezit is van een diploma van
      een opleiding op de niveaus, bedoeld in de Regeling erkenning opleidingen deskundigen radioactieve stoffen en
      toestellen zoals deze regeling luidde tot de datum van inwerkingtreding van dit besluit en de richtlijn van 20
      november 1984 voor erkenning van opleidingen deskundigen radioactieve stoffen en toestellen, aangemerkt als een
      deskundige die is ingeschreven in een register als bedoeld in artikel 7, tweede lid.

      3 Tot een bij ministeriële regeling te bepalen datum wordt een opleiding, die overeenkomstig de Regeling
      erkenning opleidingen deskundigen radioactieve stoffen en toestellen zoals deze regeling luidde tot de datum van
      inwerkingtreding van dit besluit en de richtlijn van 20 november 1984 voor erkenning van opleidingen deskundigen
      radioactieve stoffen en toestellen is erkend, aangemerkt als een opleiding als bedoeld in het tweede lid.

      4 Tot een bij ministeriële regeling te bepalen datum kunnen Onze Ministers en Onze Minister van Volksgezondheid,
      Welzijn en Sport een opleiding als bedoeld in het tweede lid erkennen.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel132
  - number: '136'
    text: |-
      Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende
      artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel136
  - number: '137'
    text: 'Dit besluit wordt aangehaald als: Besluit stralingsbescherming.'
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel137
