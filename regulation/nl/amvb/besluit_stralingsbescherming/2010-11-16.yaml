  - number: '82'
    text: |-
      1 De ondernemer zorgt ervoor dat een persoon voor wie een ontheffing, als bedoeld in [artikel 81][ref1], is
      verleend indien ten gevolge van de in dat artikel bedoelde blootstelling een van de in [artikel 77][ref2] genoemde
      dosislimieten is overschreden, niet eerder weer aan ioniserende straling ten gevolge van handelingen die onder
      zijn verantwoordelijkheid worden verricht wordt blootgesteld, dan nadat door een stralingsarts is verklaard dat
      daartegen geen bezwaar bestaat.

      2 Tenzij de stralingsarts hiertoe adviseert, wordt de werknemer niet vanwege de in het eerste lid bedoelde
      overschrijding van de dosislimieten zonder diens toestemming van zijn normale beroepsbezigheden uitgesloten of op
      een andere plaats te werk gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel77
