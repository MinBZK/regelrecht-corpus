        artikel: '91'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: '95'
    text: |-
      1 Het is de ondernemer verboden om een externe werknemer onder zijn verantwoordelijkheid in Nederland of op
      het Nederlands continentaal plat te laten werken, indien deze werknemer niet in het bezit is van een geldig
      stralingspaspoort, verstrekt door een overheidsinstantie van de lidstaat van de ondernemer van de externe werknemer
      in wiens opdracht de externe werknemer handelingen verricht.

      2 De ondernemer registreert de uitslag van de individuele monitoring, bedoeld in de [artikelen 81][ref1],
      [87][ref2], [88][ref3] en [89][ref4], onverwijld na beëindiging van de handelingen of werkzaamheden in het
      stralingspaspoort.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel81
