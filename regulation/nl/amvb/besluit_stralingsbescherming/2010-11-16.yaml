  - number: '38'
    text: |-
      1 Een radioactieve stof kan door Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer of
      de ondernemer als radioactieve afvalstof worden aangemerkt, indien voor deze stof geen gebruik of product- of
      materiaalhergebruik is voorzien door Onze Minister of door de ondernemer en er geen sprake is van lozing van de
      stof.

      2 Een afvalstof wordt niet als radioactieve afvalstof aangemerkt, indien artikel 37, tweede lid, van toepassing is.

      3 Radioactieve afvalstoffen worden zo snel als redelijkerwijs mogelijk afgevoerd.

      4 De in het derde lid gestelde verplichting geldt niet indien de radioactieve afvalstoffen een fysische
      halveringstijd hebben van minder dan 100 dagen en maximaal 2 jaar worden opgeslagen in een daartoe geschikte ruimte
      met het oog op fysisch verval tot afvalstoffen als bedoeld in artikel 37, tweede lid.

      5 Het is verboden radioactieve afvalstoffen te mengen met het doel de activiteitsconcentratie van de stoffen
      beneden de in bijlage 1, tabel 1, bedoelde waarden te brengen.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel38
  - number: '39'
    text: |-
      Geen vergunning krachtens dit hoofdstuk wordt verleend indien:

      a. niet aan de voorwaarden van de [artikelen 4][ref1], [5][ref2], [6][ref3] en [48][ref4] betreffende
      rechtvaardiging, optimalisatie en dosislimieten is voldaan;

      b. voor een lid van de bevolking dat zich buiten de locatie bevindt, als gevolg van de handeling waarvoor de
      vergunning is aangevraagd en ten gevolge van andere handelingen binnen en buiten deze locatie, een van de volgende
      doses wordt overschreden:

      1°. een effectieve dosis van 1 mSv in een kalenderjaar en met inachtneming daarvan:

      2°. een equivalente dosis van 50 mSv in een kalenderjaar voor de huid gemiddeld over enig huidoppervlak van 1 cm2;

      c. de handeling waarvoor de vergunning is aangevraagd behoort tot een categorie die op grond van de ministeriële
      regeling, bedoeld in [artikel 4, tweede lid][ref5], als gerechtvaardigd is bekend gemaakt, maar het specifieke
      karakter van deze handeling op grond van [artikel 4, eerste lid][ref6], niet gerechtvaardigd is;

      d. niet is aangetoond dat de krachtens [artikel 20d, eerste lid][ref7], vereiste financiële zekerheid is gesteld.


