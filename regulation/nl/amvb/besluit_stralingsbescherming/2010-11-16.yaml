  - number: '23'
    text: |-
      1 Het is verboden zonder vergunning van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer
      een handeling te verrichten met:

      a. een toestel voor:

      1°. industriële radiografie;

      2°. bewerking van producten;

      3°. onderwijsdoeleinden;

      4°. blootstelling van personen en dieren voor therapeutische doeleinden;

      b. een ander toestel dan bedoeld onder a met een maximale hoogspanning van 100 kV of meer;

      c. een toestel dat deeltjes versnelt en ioniserende straling met een energie van meer dan 1 MeV kan uitzenden.

      2 Het is voorts verboden zonder vergunning van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en
      Milieubeheer onderzoeks- en ontwikkelingswerk te verrichten aan een toestel.

      3 Het verbod, bedoeld in het eerste lid, geldt niet voor:

      a. handelingen met elektronenmicroscopen;

      b. het uitsluitend in opslag hebben van toestellen ten behoeve van de handel in deze toestellen;

      c. een toestel dat wordt gebruikt voor onderwijsdoeleinden, dat onder normale bedrijfsomstandigheden op 0,1 meter
      afstand van enig bereikbare buitenzijde van het toestel geen hoger omgevingsdosisequivalenttempo veroorzaakt dan
      1 µSv per uur en dat behoort tot een type dat door Onze Ministers is goedgekeurd op grond van bij ministeriële
      regeling gestelde regels.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel23
  - number: '24'
    text: |-
      Het is verboden zonder vergunning van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer:

      a. radioactieve stoffen toe te dienen aan personen en, voor zover het de bescherming van mensen tegen ioniserende
      straling betreft, aan dieren voor:

      1°. het stellen van medische of veterinaire diagnoses;

      2°. therapie of (bio)medisch onderzoek;

      b. radioactieve stoffen toe te voegen aan producten, bestemd voor gebruik op of in de directe omgeving van
      personen;

      c. met radioactieve stoffen handelingen te verrichten voor:

      1°. industriële radiografie;

      2°. bewerking van producten;

      3°. onderwijsdoeleinden en wetenschappelijk onderzoek.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel24
  - number: '25'
    text: |-
      1 Het is verboden zonder vergunning van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer
      een andere handeling dan bedoeld in [artikel 24][ref1] of [37][ref2], niet zijnde een lozing, met een radioactieve
      stof te verrichten.

      2 Het verbod, bedoeld in het eerste lid en in [artikel 24, onder c][ref3], geldt niet indien binnen een locatie:

      a. de activiteit van de radionucliden in de betrokken radioactieve stof lager is dan de in
      [bijlage 1, tabel 1][ref4], genoemde waarde, of

      b. de activiteitsconcentratie van die stof lager is dan de in [bijlage 1, tabel 1][ref5], genoemde waarde.

      3 Indien een radioactieve stof meer soorten radionucliden bevat, wordt de activiteitsconcentratie van de
      radionucliden gewogen gesommeerd volgens de in [bijlage 3][ref6] aangegeven methode. Aan het tweede lid, onder b,
      wordt voldaan indien de uitkomst van deze sommatie kleiner of gelijk aan 1 is.

      4 Indien binnen een locatie op enig moment meer handelingen plaatsvinden, worden de activiteiten van de
      radionucliden in de bij die handelingen betrokken radioactieve stoffen gewogen gesommeerd volgens de in
      [bijlage 3][ref7] aangegeven methode. Aan het tweede lid, onder a, wordt voldaan indien de uitkomst van deze
      sommatie kleiner of gelijk aan 1 is.

      5 Onze Ministers kunnen bij ministeriële regeling handelingen met producten als bedoeld in
      [artikel 24, onder b][ref8], aanwijzen, waarbij de aan deze producten toegevoegde radionucliden niet worden
      betrokken bij een sommatie als bedoeld in het derde lid.

      6 De verboden, bedoeld in het eerste lid en in de [artikelen 23][ref9] en [24][ref10], gelden niet voor bij
      ministeriële regeling aangewezen handelingen die een beperkt risico van blootstelling van mensen tot gevolg hebben.

      7 Bij ministeriële regeling kunnen andere methoden worden aangewezen voor het bepalen en het toetsen van de schade
      in gevallen waarin de in het tweede lid bedoelde activiteitsconcentratie in combinatie met de in het tweede lid
      bedoelde activiteit geen juiste indicatie geeft van de schade die de bij de handeling betrokken radioactieve
      stoffen kunnen veroorzaken.

      8 Bij ministeriële regeling kan in afwijking van het tweede lid, het eerste lid van toepassing worden verklaard in
      geval er sprake is van een te hoog risico van blootstelling van werknemers en leden van de bevolking.


