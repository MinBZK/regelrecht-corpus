  - number: '93'
    text: |-
      1 De ondernemer zorgt ervoor dat de uitslag van de individuele monitoring, bedoeld in de [artikelen 87][ref1],
      [88][ref2] en [89][ref3], wordt verstrekt aan:

      a. de persoon als bedoeld in [artikel 14, eerste lid, van de Arbeidsomstandighedenwet][ref4] die belast is met de
      taken, bedoeld in [artikel 14, eerste lid, onderdelen b of c, van die wet][ref5] of de arbodienst;

      b. de betrokken werknemer;

      c. de deskundige;

      d. indien het een A-werknemer betreft, de stralingsarts.

      2 De ondernemer meldt de uitslag van de individuele monitoring, bedoeld in [artikel 89][ref6], onverwijld aan de
      in het eerste lid bedoelde personen of dienst en aan de bedrijfstakdirecteur of, indien het mijnbouw betreft, de
      Inspecteur-Generaal der Mijnen in wiens werkgebied het ongeval of de noodsituatie is opgetreden.


