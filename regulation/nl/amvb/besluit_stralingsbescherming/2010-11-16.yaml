  - number: '48'
    text: |-
      1 De ondernemer zorgt ervoor dat voor een lid van de bevolking als gevolg van handelingen, die onder zijn
      verantwoordelijkheid worden verricht, op enig punt buiten de locatie ten gevolge van die handelingen een effectieve
      dosis van 0,1 mSv in een kalenderjaar niet wordt overschreden.

      2 Dit artikel is niet van toepassing voor personen, voor zover zij hulp en bijstand verlenen als bedoeld in
      [artikel 53, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel53
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '53'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: '49'
    text: |-
      1 De ondernemer zorgt ervoor dat voor een lid van de bevolking die zich binnen de locatie bevindt, als gevolg
      van handelingen, die onder zijn verantwoordelijkheid worden verricht, de volgende individuele doses niet worden
      overschreden:

      a. een effectieve dosis van 1 mSv in een kalenderjaar en met inachtneming daarvan:

      b. een equivalente dosis van:

      1°. 15 mSv in een kalenderjaar in de ooglens, of

      2°. 50 mSv in een kalenderjaar voor de huid gemiddeld over enig huidoppervlak van 1 cm2.

      2 In het geval van inwendige besmetting wordt de effectieve volgdosis toegewezen aan het jaar van inname.

      3 Dit artikel is niet van toepassing voor personen, voor zover zij hulp en bijstand verlenen als bedoeld in
      [artikel 53, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel53
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '53'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: '50'
    text: |-
      1 De ondernemer zorgt ervoor dat in omstandigheden waar een lid van de bevolking als gevolg van handelingen,
      die onder zijn verantwoordelijkheid worden verricht, aan besmetting of ioniserende straling binnen of buiten de
      locatie kan worden blootgesteld, voor de daarvoor in aanmerking komende plaatsen berekeningen van de effectieve of
      equivalente doses worden gemaakt en zo nodig metingen worden verricht.

      2 De ondernemer houdt een administratie bij waarin hij de resultaten aantekent van de metingen en gebruikt deze,
      indien nodig, voor het bepalen van de doses, bedoeld in het eerste lid en de artikelen 48 en 49.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld voor de inhoud, het beheer en de bewaartermijn van
      de administratie.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel50
  - number: '51'
    text: |-
      Bij een ongeval of radiologische noodsituatie binnen zijn locatie zorgt de ondernemer ervoor dat, indien een
      lid van de bevolking, binnen of buiten de betrokken locatie, ten gevolge daarvan is of kan zijn blootgesteld,
      individuele monitoring wordt uitgevoerd of dat de effectieve of equivalente doses die door de betrokken persoon
      zijn ontvangen op een andere wijze worden bepaald.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel51
  - number: '52'
    text: |-
      In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:

      a. apparatuur: toestellen, ingekapselde bronnen en open bronnen alsmede bijbehorende apparaten zoals
      ontwikkelmachines en gammacamera's;

      b. behandelend arts: een arts of een tandarts onder wiens medische verantwoordelijkheid een blootstelling aan
      ioniserende straling plaatsvindt;

      c. bevolkingsonderzoek: onderzoek onder risicogroepen van de bevolking waarbij ioniserende straling wordt toegepast
      met het doel een vroegtijdige diagnose te verkrijgen;

      d. diagnostische referentieniveaus: dosisniveaus in de medische radiodiagnostiek en bij gebruik van radiofarmaca,
      hoeveelheden toe te dienen radioactiviteit, voor karakteristieke onderzoeken van groepen patiënten van
      standaardgrootte of standaardfantomen voor globaal gedefinieerde soorten toestellen of apparaten;

      e. kwaliteitsborging: de geplande en systematische verrichtingen die noodzakelijk zijn om voldoende zekerheid te
      geven dat een structuur, systeem, onderdeel of procedure naar behoren en in overeenstemming met algemeen aanvaarde
      normen functioneren;

      f. medisch radiologische procedure: de procedure vanaf aanvrage tot en met uitvoering en resultaatbeschouwing van
      de radiologische verrichting;

      g. medisch juridisch onderzoek: radiologische verrichting zonder medische indicatie, uitsluitend ten behoeve van
      verzekeringstechnische of juridische doeleinden;

      h. medische verantwoordelijkheid: de verantwoordelijkheid van een arts of tandarts betreffende individuele
      radiologische verrichtingen, met name de rechtvaardiging, de optimalisatie en de klinische evaluatie van het
      resultaat;

      i. Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;

      j. patiëntdosis: de dosis die betrekking heeft op een persoon die een blootstelling als bedoeld in artikel 53,
      eerste lid, ondergaat;

      k. praktische aspecten: de feitelijke uitvoering van een blootstelling als bedoeld in artikel 53, eerste lid,
      waaronder te verstaan: hanteren en gebruiken van radiologische apparatuur, beoordelen van technisch, fysische
      parameters, alsmede het beoordelen van patiëntdoses, ijking, onderhoud van apparatuur, bereiding en toediening van
      radiofarmaceutica en ontwikkeling van films;

      l. radiodiagnostisch: betrekking hebbend op in vivo diagnostische nucleaire geneeskunde, diagnostische en
      tandheelkundige radiologie;

      m. radiologisch: betrekking hebbend op radiodiagnostische en radiotherapeutische procedures en interventie-
      radiologie of andere plannings- of geleideradiologie;

      n. radiotherapeutisch: betrekking hebbend op radiotherapie, waaronder mede begrepen nucleaire geneeskunde voor
      therapeutische doeleinden;

      o. verwijzend arts: een arts of een tandarts die een verrichting aanvraagt waarbij gebruik wordt gemaakt van
      ioniserende straling.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel52
  - number: '53'
    text: |-
      1 Dit hoofdstuk is van toepassing op radiologische verrichtingen voor personen die:

      a. als patiënt een blootstelling ondergaan;

      b. deelnemen aan een bevolkingsonderzoek;

      c. arbeidsgeneeskundig onderzoek ondergaan;

      d. medisch juridisch onderzoek ondergaan;

      e. vrijwillig deelnemen aan medische of biomedische onderzoeksprogramma's.

      2 Dit hoofdstuk is tevens van toepassing op personen die willens en wetens- doch niet beroepshalve- hulp en
      bijstand verlenen aan diegene die, als bedoeld in het eerste lid, een blootstelling ondergaat.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel53
  - number: '54'
    text: |-
      De ondernemer zorgt ervoor dat een radiologische verrichting uitsluitend geschiedt onder
      medische verantwoordelijkheid van een behandelend arts die is ingeschreven in een krachtens
      [artikel 14 van de Wet op de beroepen in de individuele gezondheidszorg][ref1] ingesteld register en die voldoet
      aan de bij ministeriële regeling vastgestelde deskundigheidseisen.


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel14
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '14'
  - number: '55'
    text: |-
      1 Een type radiologische verrichting is niet gerechtvaardigd, indien het totale mogelijke diagnostische of
      therapeutische voordeel, waaronder begrepen het directe nut voor de gezondheid van de persoon die de blootstelling
      ondergaat, en het maatschappelijk nut, niet opweegt tegen de gezondheidsschade die de persoon die de blootstelling
      ondergaat, kan ondervinden, mede in aanmerking genomen de doeltreffendheid, de voordelen en risico's van de
      beschikbare alternatieve technieken die hetzelfde oogmerk hebben maar geen of minder blootstelling met zich
      meebrengen.

      2 Onze Minister kan in de Staatscourant bekend maken welke typen van radiologische verrichtingen die blootstelling
      ingevolge het eerste lid niet rechtvaardigen, verboden zijn.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel55
  - number: '56'
    text: |-
      1 De verwijzend arts en de behandelend arts beoordelen ieder op grond van hun specifieke verantwoordelijkheid of
      een individuele radiologische verrichting gerechtvaardigd is, met inachtneming van de specifieke oogmerken van de
      blootstelling en de kenmerken van de betrokken persoon.

      2 In afwijking van [artikel 55, tweede lid][ref1], kan een radiologische verrichting die ingevolge dat lid
      verboden is, onder speciale omstandigheden, in afzonderlijk te beoordelen gevallen, toch gerechtvaardigd zijn.
      De afzonderlijke beoordeling van de hiervoor genoemde rechtvaardiging wordt geregistreerd in het dossier van
      betrokkene.

      3 Een behandelend arts laat geen blootstelling van de persoon, bedoeld in [artikel 53, tweede lid][ref2], toe
      indien dit niet voldoende voordeel oplevert, rekening houdend met de schade voor de gezondheid van de persoon die
      de blootstelling ondergaat, het directe nut voor de gezondheid van de persoon, bedoeld in artikel 53, eerste lid,
      het maatschappelijk nut en de gezondheidsschade die de blootstelling kan veroorzaken.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel53
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '55'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '53'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: '57'
    text: |-
      De ondernemer zorgt ervoor dat de behandelend arts specifiek aandacht geeft aan de rechtvaardiging van:

      a. medisch juridisch onderzoek;

      b. medisch en biomedisch onderzoek.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel57
  - number: '58'
    text: |-
      De ondernemer zorgt ervoor dat voor blootstelling als bedoeld in [artikel 53, eerste lid][ref1], voor
      radiotherapeutische doeleinden de patiëntdosis op klinisch fysisch verantwoorde wijze in het doelvolume individueel
      wordt berekend en toegediend, in aanmerking nemende dat de patiëntdosis in het weefsel buiten het doelvolume zo
      laag mogelijk dient te zijn, maar zonder aan het beoogde radiotherapeutische effect van de blootstelling afbreuk
      te doen.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel53
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '53'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: '59'
    text: |-
      Onze Minister bevordert de vaststelling en het gebruik van diagnostische referentieniveaus voor radiodiagnostische
      verrichtingen als bedoeld in artikel 53, eerste lid, alsmede het opstellen van protocollen terzake.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel59
  - number: '60'
    text: |-
      De ondernemer zorgt ervoor dat onverminderd het bepaalde in de
      [Wet medisch wetenschappelijk onderzoek met mensen][ref1]:

      a. voor proefpersonen die zelf geen direct voordeel kunnen verwachten van de radiologische verrichting, een
      patiëntdosisbeperking wordt vastgesteld;

      b. indien de experimentele radiologische verrichting voor proefpersonen een voordeel beoogt, een op de proefpersoon
      gerichte planning van de experimentele verrichting plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0009408
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0009408
  - number: '61'
    text: |-
      1 Onze Minister kan dosisbeperkingen vaststellen voor blootstellingen als bedoeld in artikel 53, tweede lid.

      2 Onze Minister kan, in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en
      Milieubeheer, regels geven voor de blootstellingen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel61
  - number: '62'
    text: |-
      De ondernemer zorgt ervoor dat, ingeval een persoon een onderzoek of behandeling met behulp van toegediende
      radionucliden ondergaat, aan de persoon of zijn wettelijk vertegenwoordiger in voorkomende gevallen schriftelijke
      instructies worden meegegeven. Tevens worden zij geïnformeerd over de risico's van de ioniserende straling voordat
      de betrokken persoon de locatie verlaat, teneinde de dosis voor anderen in contact met deze persoon zoveel als
      redelijkerwijs mogelijk is te beperken.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel62
  - number: '63'
    text: |-
      De ondernemer zorgt ervoor dat:

      a. personen die een opleiding volgen op het gebied van stralingstoepassingen en stralingsbescherming participeren
      in onderdelen van praktische aspecten ervan;

      b. indien de hiervoor genoemde participatie plaatsvindt onder verantwoordelijkheid van een arts, dit een arts is
      als bedoeld in [artikel 54][ref1];

      c. voorafgaand aan de onder a genoemde participatie, schriftelijke instructies worden gegeven aan degene die de
      opleiding volgt, over de aard en de omvang van de deelname aan de praktische aspecten.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel54
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '54'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '64'
    text: |-
      1 De ondernemer zorgt ervoor dat de toe te dienen activiteit bij nucleair geneeskundig onderzoek en therapie wordt
      gemeten met een dosiskalibrator.

      2 Onze Minister kan normen aanwijzen voor de nauwkeurigheid van de in het eerste lid bedoelde kalibrator.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel64
  - number: '65'
    text: |-
      De ondernemer zorgt ervoor dat voor elke standaard radiologische verrichting voor elke apparatuuropstelling
      schriftelijke protocollen worden opgesteld.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel65
  - number: '66'
    text: |-
      De ondernemer zorgt ervoor dat:

      a. bij radiotherapeutische verrichtingen een klinisch fysicus nauw wordt betrokken;

      b. bij standaard therapeutisch nucleairgeneeskundige verrichtingen en bij de diagnostische nucleairgeneeskundige
      verrichtingen een klinisch fysicus beschikbaar is;

      c. bij de overige radiologische verrichtingen een klinisch fysicus bereikbaar is voor advies over
      stralingsbeschermingsaspecten bij radiologische verrichtingen.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel66
  - number: '67'
    text: |-
      1 De ondernemer zorgt ervoor dat de radiologische apparatuur die wordt gebruikt bij radiologische verrichtingen op
      een verantwoorde wijze wordt gebruikt. Onze Minister kan daartoe regels stellen.

      2 De ondernemer zorgt ervoor dat op alle radiologische apparatuur die in gebruik is:

      a. streng toezicht wordt uitgeoefend inzake de stralingsbescherming;

      b. programma's voor kwaliteitsborging worden uitgevoerd;

      c. noodzakelijke maatregelen worden genomen om inadequate of defecte onderdelen van radiologische apparatuur te
      repareren of te vervangen.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel67
  - number: '68'
    text: |-
      De ondernemer zorgt ervoor dat:

      a. indien nieuwe apparatuur in gebruik wordt genomen, deze, indien uitvoerbaar, een voorziening heeft die de
      stralingsdosis tijdens een radiologische verrichting aangeeft;

      b. bij een röntgentoestel waarmee radiodiagnostische verrichtingen worden toegepast, een filter wordt gebruikt
      teneinde de stralingsbelasting van de patiënt te beperken;

      c. een röntgentoestel beschikt over een vaste of automatische diafragma-instelling zodat de randen van de
      röntgenbundel zichtbaar zijn op de beelddrager, tenzij het mammografisch of tandheelkundig onderzoek betreft;

      d. een röntgentoestel waarmee radiodiagnostische verrichtingen worden toegepast is voorzien van een diafragma of
      tubus met het doel de röntgenbundel te beperken tot het juiste gebied;

      e. het diafragma een middel bevat om afmetingen van de bundel vooraf te kunnen aangeven.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel68
  - number: '69'
    text: |-
      De ondernemer zorgt ervoor dat:

      a. bij het onderzoeken met gebruikmaking van fluoroscopie een beeldversterker of gelijkwaardige techniek wordt
      gebruikt;

      b. fluoroscopische onderzoeken zonder voorzieningen voor de regeling van het dosistempo beperkt blijven tot de
      gevallen die de omstandigheden rechtvaardigen;

      c. toestellen, geschikt voor doorlichting, na elke vijf minuten cumulatief doorlichten een akoestisch signaal
      geven.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel69
  - number: '70'
    text: |-
      De ondernemer zorgt ervoor dat passende radiologische apparatuur, technieken en randapparatuur worden gebruikt voor
      radiologische verrichtingen bij:

      a. kinderen;

      b. bevolkingsonderzoek;

      c. toediening aan de patiënt van een hoge dosis ioniserende straling.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel70
  - number: '71'
    text: |-
      De verwijzende en de behandelend arts informeren bij een vrouw of er sprake is van zwangerschap en of er
      borstvoeding wordt gegeven, voordat een radiologische verrichting wordt uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel71
  - number: '72'
    text: |-
      Als zwangerschap niet kan worden uitgesloten of als een vrouw borstvoeding geeft, wordt, afhankelijk van het type
      blootstelling, speciale aandacht besteed aan:

      a. de rechtvaardiging van de blootstelling, met name in verband met de urgentie;

      b. de optimalisatie van de stralingsbescherming, waarbij rekening wordt gehouden met de patiëntdosis voor zowel de
      vrouw als ook voor het ongeboren kind.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel72
  - number: '73'
    text: |-
      1 De ondernemer zorgt er voor dat zowel de kans op alsmede de gevolgen van een ongeval of een onbedoelde dosis van
      een radiologische verrichting zo klein als redelijkerwijs mogelijk zijn.

      2 De ondernemer zorgt er voor dat ter beperking van risico's als bedoeld in het eerste lid, bij de apparatuur
      schriftelijke instructies en protocollen aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel73
  - number: '74'
    text: |-
      1 De ondernemer verstrekt aan Onze Minister gegevens die nodig zijn om het gemiddelde en de spreiding van
      de effectieve of equivalente dosis bij radiologische verrichtingen voor de bevolking en andere relevante
      referentiegroepen te kunnen schatten.

      2 Onze Minister stelt regels ten aanzien van de verstrekking van de in het eerste lid bedoelde gegevens.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel74
  - number: '75'
    text: Onze Minister kan regels stellen om onnodige verspreiding van radiologische apparatuur te voorkomen.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel75
  - number: '76'
    text: |-
      1 De ondernemer zorgt ervoor dat voor werknemers ten gevolge van handelingen die onder zijn verantwoordelijkheid
      worden verricht, de volgende doses niet worden overschreden:

      a. een effectieve dosis van 1 mSv in een kalenderjaar, en met inachtneming daarvan:

      b. een equivalente dosis van:

      1°. 15 mSv in een kalenderjaar voor de ooglens, of

      2°. 50 mSv in een kalenderjaar voor de huid, gemiddeld over enig blootgesteld huidoppervlak van 1 cm2.

      2 In het geval van inwendige besmetting wordt de effectieve volgdosis toegewezen aan het jaar van inname.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel76
  - number: '77'
    text: |-
      1 De ondernemer zorgt ervoor dat voor blootgestelde werknemers ten gevolge van handelingen die onder zijn
      verantwoordelijkheid worden verricht, de volgende doses niet worden overschreden:

      a. een effectieve dosis van 20 mSv in een kalenderjaar, en met inachtneming daarvan:

      b. een equivalente dosis van:

      1°. 150 mSv in een kalenderjaar voor de ooglens,

      2°. 500 mSv in een kalenderjaar voor de huid, gemiddeld over enig blootgesteld huidoppervlak van 1 cm2, of

      3°. 500 mSv in een kalenderjaar voor handen, onderarmen, voeten en enkels.

      2 In het geval van inwendige besmetting wordt de effectieve volgdosis toegewezen aan het jaar van inname.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel77
  - number: '78'
    text: |-
      1 De ondernemer zorgt ervoor dat werknemers die jonger zijn dan 18 jaar geen werk krijgen toegewezen of verrichten,
      waardoor zij als blootgestelde werknemer worden aangemerkt.

      2 Het eerste lid geldt niet indien deze werknemers ouder zijn dan 15 jaar en uit hoofde van hun opleiding verplicht
      zijn handelingen te verrichten en daarbij een blootstelling ondergaan die hoger is dan een der in artikel 76
      genoemde dosislimieten.

      3 De ondernemer zorgt ervoor dat voor de in het tweede lid bedoelde personen ten gevolge van handelingen die onder
      zijn verantwoordelijkheid worden verricht, de volgende individuele doses niet worden overschreden:

      a. een effectieve dosis van 6 mSv per kalenderjaar, en met inachtneming daarvan:

      b. een equivalente dosis van:

      1°. 50 mSv in een kalenderjaar voor de ooglens;

      2°. 150 mSv in een kalenderjaar voor de huid, gemiddeld over enig blootgesteld huidoppervlak van 1 cm2, of

      3°. 150 mSv in een kalenderjaar voor handen, onderarmen, voeten en enkels.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel78
  - number: '79'
    text: |-
      1 De ondernemer deelt ten behoeve van de individuele monitoring en het toezicht blootgestelde werknemers in als A-
      of B-werknemer.

      2 Een A-werknemer is een blootgestelde werknemer, die een effectieve dosis kan ontvangen die groter is dan 6 mSv
      in een kalenderjaar, of een equivalente dosis die groter is dan drie tiende van de in [artikel 77][ref1] genoemde
      dosislimieten.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel77
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0012702
        artikel: '77'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '80'
    text: |-
      1 De ondernemer zorgt ervoor dat de arbeidsomstandigheden voor de zwangere werknemer zodanig zijn dat de
      equivalente dosis ten gevolge van het werk voor het ongeboren kind zo laag is als redelijkerwijs mogelijk is en dat
      het onwaarschijnlijk is dat deze dosis vanaf het moment van melding van de zwangerschap aan de ondernemer tot aan
      het einde van de zwangerschap 1 mSv zal overschrijden.

      2 De ondernemer zorgt ervoor dat een werknemer, indien zij borstvoeding geeft, gedurende de periode dat zij
      borstvoeding geeft, vrij van handelingen wordt gesteld waarbij een meer dan gering risico bestaat op radioactieve
      besmetting van het lichaam.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel80
  - number: '81'
    text: |-
      1 In uitzonderlijke omstandigheden, met uitzondering van radiologische noodsituaties, kan de bedrijfstakdirecteur,
      of bij mijnbouw, de Inspecteur-Generaal der Mijnen, op verzoek van de ondernemer ontheffing van de in
      [artikel 77][ref1] genoemde dosislimieten verlenen, mits

      a. het een A-werknemer betreft;

      b. de blootstelling geschiedt op basis van vrijwilligheid;

      c. de blootstelling beperkt is in tijd;

      d. de blootstelling alleen in nader vast te stellen ruimten plaatsvindt;

      e. de mogelijk te ontvangen effectieve of equivalente dosis niet hoger is dan vijfmaal de in
      [artikel 77, eerste lid, onder a][ref2], respectievelijk tweemaal de in [artikel 77, eerste lid, onder b][ref3],
      vermelde waarden;

      f. het geen blootgestelde leerling of studerende, of zwangere vrouw betreft;

      g. het geen vrouw betreft die borstvoeding geeft terwijl er kans bestaat op besmetting van het lichaam;

      h. de blootstelling van te voren door de ondernemer wordt gemotiveerd en de blootstelling en de risico's
      van te voren door de ondernemer worden besproken met de betrokken werknemers, de ondernemingsraad of
      personeelsvertegenwoordiging, de stralingsarts en de deskundige, en

      i. de betrokken werknemers tevoren door de ondernemer worden geïnformeerd over de tijdens de handelingen te nemen
      voorzorgsmaatregelen.

      2 In de situatie, bedoeld in het eerste lid, rapporteert de ondernemer na afloop aan de bedrijfstakdirecteur, of
      bij mijnbouw aan de Inspecteur-Generaal der Mijnen, over de uitgevoerde handelingen, de wijze waarop bescherming
      tegen ioniserende straling is uitgevoerd en de door de werknemer ontvangen effectieve of equivalente dosis.

      3 De ondernemer verstrekt de uitslag van de in het tweede lid berekende of bepaalde dosis aan de in
      [artikel 91, tweede lid][ref4], bedoelde instelling en aan de betrokken werknemer.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel77
