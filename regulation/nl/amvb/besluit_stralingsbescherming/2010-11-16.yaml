  - number: '28'
    text: |-
      De in de artikelen 24, onder b, en 27, gestelde verboden gelden niet indien:

      a. het een aanwijsinstrument betreft;

      b. uitsluitend H-3 in lichtcellen of Pm-147 in lichtgevende verf wordt, onderscheidenlijk is toegevoegd voor
      verlichtingsdoeleinden;

      c. het aanwijsinstrument in totaal een lagere activiteit bevat dan 1 GBq H-3 of 10 MBq Pm-147;

      d. het aanwijsinstrument voldoet aan in het belang van de bescherming tegen ioniserende straling bij ministeriële
      regeling gestelde voorschriften met betrekking tot de constructie;

      e. geen herstel- of onderhoudswerkzaamheden worden verricht, waarbij een onderdeel van het aanwijsinstrument,
      waaraan voor verlichtingsdoeleinden H-3 in lichtcellen of Pm-147 in lichtgevende verf is toegevoegd, van zijn
      omhulsel wordt ontdaan; en

      f. niet meer dan 100 aanwijsinstrumenten waaraan voor verlichtingsdoeleinden H-3 in lichtcellen of Pm-147 in
      lichtgevende verf is toegevoegd, voorhanden zijn.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel28
  - number: '29'
    text: |-
      1 De in artikel 27 gestelde verboden gelden niet indien:

      a. het een aanwijsinstrument betreft;

      b. uitsluitend H-3 in lichtcellen of Pm-147 in lichtgevende verf wordt, onderscheidenlijk is toegevoegd voor
      verlichtingsdoeleinden;

      c. het aanwijsinstrument in totaal een lagere activiteit bevat dan 3 GBq H-3 of 30 MBq Pm-147, en

      d. voldoet aan in het belang van de bescherming tegen ioniserende straling bij ministeriële regeling gestelde
      voorschriften met betrekking tot de constructie.

      2 Onze Minister van Defensie kan ontheffing verlenen van de in de artikelen 24, onder b, 25, eerste lid, en 27
      gestelde verboden, indien het aanwijsinstrumenten betreft waaraan voor verlichtingsdoeleinden radionucliden zijn
      toegevoegd en die in gebruik zijn dan wel bestemd zijn voor gebruik bij de krijgsmacht en die zijn bedoeld voor
      gebruik onder operationele omstandigheden.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel29
  - number: '30'
    text: |-
      1 De in de artikelen 25 en 27, onder b, gestelde verboden gelden niet voor het voorhanden hebben, toepassen of
      zich ontdoen van een aanwijsinstrument dat voor verlichtingsdoeleinden minder dan 56 kBq Ra-226+ of minder dan 0,93
      GBq H-3 in lichtgevende verf bevat door detailhandelaren of particulieren, noch voor het herstellen of onderhouden
      van zodanige instrumenten door de ondernemer, voor zover die instrumenten voor het tijdstip waarop dit verbod in
      werking treedt, zijn vervaardigd en in Nederland in de handel zijn gebracht.

      2 De ondernemer zorgt ervoor dat na herstel- of onderhoudswerkzaamheden aan een aanwijsinstrument als bedoeld in
      het eerste lid:

      a. een bij ministeriële regeling vast te stellen waarschuwingsteken voor ioniserende straling is aangebracht op een
      vanaf de buitenzijde van het instrument zichtbare plaats;

      b. het merkteken T 25 of Ra 1,5 onderscheidenlijk voor H-3 en Ra-226+ in lichtgevende verf, is aangebracht op een
      vanaf de buitenzijde van het instrument zichtbare plaats.

      3 Het in artikel 27, onder b, gestelde verbod geldt niet voor aanwijsinstrumenten, waaraan radioactieve nucliden
      zijn toegevoegd voor verlichtingsdoeleinden, indien dit aanwijsinstrument voorhanden is voor een tentoonstelling of
      de ondernemer zich ervan ontdoet na een tentoonstelling.

      4 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de voorschriften die kunnen worden
      verbonden aan een vergunning voor handelingen als bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel30
  - number: '31'
    text: |-
      1 De ondernemer controleert na het voor verlichtingsdoeleinden toevoegen van radioactieve stoffen aan
      aanwijsinstrumenten of deze aanwijsinstrumenten voldoen aan de bij en krachtens de artikelen 28 of 29 gestelde
      voorschriften.

      2 De ondernemer tekent de uitvoering van de in het eerste lid bedoelde controles en de resultaten daarvan aan in
      een daartoe bestemde administratie.

      3 Onze Ministers kunnen van de in het eerste en tweede lid gestelde verplichtingen ontheffing verlenen, indien
      de ondernemer ten genoegen van Onze Ministers aantoont dat de in het eerste en tweede lid bedoelde controles en
      administratie door een ander worden uitgevoerd.

      4 De in het tweede en derde lid bedoelde administratie wordt ten minste vijf jaar bewaard.

      5 Bij ministeriële regeling worden nadere regels gesteld met betrekking tot het bepaalde in het eerste, tweede en
      derde lid.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel31
  - number: '32'
    text: |-
      De ondernemer zorgt ervoor dat op een aanwijsinstrument waaraan H-3 in lichtcellen of Pm-147 in lichtgevende
      verf voor verlichtingsdoeleinden is toegevoegd, op een vanaf de buitenzijde van het instrument zichtbare plaats
      is aangebracht:

      a. een waarschuwingsteken als bedoeld in [artikel 30, tweede lid, onder a][ref1];

      b. indien het betreft een aanwijsinstrument als bedoeld in [artikel 29][ref2] het merkteken voor T 3 GBq of Pm 30
      MBq onderscheidenlijk voor H-3 in lichtcellen en Pm-147 in lichtgevende verf.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel29
