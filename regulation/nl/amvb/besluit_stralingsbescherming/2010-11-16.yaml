        artikel: '27'
        hoofdstuk: '4'
        paragraaf: '4.3'
      - id: ref2
        bwb_id: BWBR0012702
        hoofdstuk: '6'
  - number: '102'
    text: |-
      1 Onze Ministers maken in de Staatscourant een lijst van werkzaamheden bekend, waarvan het mogelijk is dat bij het
      verrichten van die werkzaamheden de in [bijlage 1, tabel 1 en 2][ref1], vermelde waarden worden overschreden.

      2 Voordat een ondernemer een werkzaamheid gaat verrichten die op de in het eerste lid bedoelde lijst staat vermeld,
      gaat hij na of deze werkzaamheid overeenkomstig [artikel 103][ref2] moet worden gemeld dan wel dat daarvoor
      overeenkomstig de [artikelen 107][ref3] en [108][ref4] een vergunning is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0012702
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel103
      [ref3]: https://wetten.overheid.nl/BWBR0012702#Artikel107
      [ref4]: https://wetten.overheid.nl/BWBR0012702#Artikel108
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0012702
      - id: ref2
        bwb_id: BWBR0012702
        artikel: '103'
        hoofdstuk: '8'
        paragraaf: '8.2'
      - id: ref3
        bwb_id: BWBR0012702
        artikel: '107'
        hoofdstuk: '8'
        paragraaf: '8.2'
      - id: ref4
        bwb_id: BWBR0012702
        artikel: '108'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: '103'
    text: |-
      1 De ondernemer meldt een werkzaamheid, niet zijnde een lozing, voordat met de uitvoering daarvan wordt begonnen,
      overeenkomstig artikel 40.

      2 Deze verplichting geldt niet, indien binnen een locatie:

      a. het een werkzaamheid betreft waarbij:

      1°. de activiteit van de radionucliden in de betrokken natuurlijke bronnen steeds lager is dan de in bijlage 1,
      tabel 1, vermelde waarde, of

      2°. de activiteitsconcentratie van de betrokken natuurlijke bronnen lager is dan de in bijlage 1, tabel 1, vermelde
      waarde;

      b. het een werkzaamheid betreft waarvoor ingevolge artikel 107 een vergunning is vereist.

      3 Artikel 25, derde, vierde, zesde, zevende en achtste lid, is van overeenkomstige toepassing.

      4 Bij ministeriële regeling kan worden bepaald dat in daarbij aangegeven gevallen met het oog op de
      stralingsbescherming het tweede lid niet van toepassing is.

      5 De in het eerste lid gestelde verplichting geldt niet voor werkzaamheden met natuurlijke bronnen indien de
      aanvraag om een vergunning als bedoeld in dit besluit gegevens als bedoeld in artikel 105 omtrent deze bronnen
      bevat.

      6 Bij ministeriële regeling kan worden bepaald in welke gevallen vrijstelling geldt van de in het eerste lid
      gestelde verplichting met betrekking tot daarbij aangewezen werkzaamheden, indien een zodanige werkzaamheid al is
      gemeld door een andere ondernemer en aan bij de regeling gestelde regels is voldaan.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel103
  - number: '104'
    text: |-
      Indien een werkzaamheid, die overeenkomstig artikel 103 is gemeld, niet meer wordt verricht, meldt de ondernemer
      dit binnen vier weken na het beëindigen van de werkzaamheid overeenkomstig artikel 40.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel104
  - number: '105'
    text: |-
      1 De melding, bedoeld in artikel 103, bevat in ieder geval:

      a. de naam en het adres van degene die de melding ondertekent;

      b. de naam en het adres van de ondernemer;

      c. het adres of de kadastrale gegevens van de locatie;

      d. een omschrijving van de werkzaamheid, de plaats van de werkzaamheid en van het doel;

      e. bij product- of materiaalhergebruik of bestemming als afval de eindbestemming van het materiaal en een
      schatting van de effectieve doses in een kalenderjaar, die personen ten gevolge van die eindbestemming en van het
      verwerkingspad kunnen ontvangen;

      f. een opgave van de betrokken natuurlijke bronnen en de daarin voorkomende radionucliden.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de gegevens die een melding
      bevat en tot de situaties waarin een nieuwe melding is vereist.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel105
  - number: '106'
    text: |-
      1 De melding van een werkzaamheid, bedoeld in artikel 104, bevat in ieder geval:

      a. de naam en het adres van degene die de melding ondertekent;

      b. de naam en het adres van de ondernemer;

      c. het adres of de kadastrale gegevens van de locatie;

      d. een aanduiding van de werkzaamheid;

      e. indien van toepassing een wijziging van de gegevens als bedoeld in artikel 105, eerste lid, onder e.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de gegevens die deze melding
      bevat.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel106
  - number: '107'
    text: |-
      1 Het is verboden zonder vergunning van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer
      een werkzaamheid, niet zijnde een lozing, te verrichten.

      2 Het in het eerste lid gestelde verbod geldt binnen een locatie niet, indien:

      a. de activiteit van de radionucliden in de bij die werkzaamheid betrokken natuurlijke bronnen lager is dan de in
      [bijlage 1, tabel 1][ref1], vermelde waarde, of

      b. de activiteitsconcentratie van de bij die werkzaamheid betrokken natuurlijke bronnen lager is dan tienmaal de in
      [bijlage 1, tabel 1][ref2], vermelde waarde.

      3 [Artikel 25, derde, vierde, zesde, zevende en achtste lid][ref3], is van overeenkomstige toepassing.

      4 Bij ministeriële regeling kan worden bepaald dat in daarbij aangegeven gevallen met het oog op de
      stralingsbescherming, het tweede lid niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0012702
      [ref2]: https://wetten.overheid.nl/BWBR0012702
      [ref3]: https://wetten.overheid.nl/BWBR0012702#Artikel25
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0012702
      - id: ref2
        bwb_id: BWBR0012702
      - id: ref3
        bwb_id: BWBR0012702
        artikel: '25'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '108'
    text: |-
      1 Het is verboden zonder vergunning van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer
      natuurlijke bronnen te lozen of een werkzaamheid te verrichten ten gevolge waarvan natuurlijke bronnen worden
      geloosd.

      2 Het in het eerste lid gestelde verbod geldt niet indien de activiteit van de in een kalenderjaar te lozen
      radionucliden die in [bijlage 1, tabel 2][ref1], zijn vermeld, bij het verlaten van de locatie lager is dan de
      daarbij in die tabel aangegeven waarde.

      3 [Artikel 25, derde, vierde, zesde, zevende en achtste lid][ref2], is van overeenkomstige toepassing.

      4 Bij ministeriële regeling kan worden bepaald dat in daarbij aangegeven gevallen met het oog op de
      stralingsbescherming, het tweede lid niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0012702
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel25
