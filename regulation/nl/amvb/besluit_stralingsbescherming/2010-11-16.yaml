  - number: '91'
    text: |-
      1 Er is een dosisregistratiesysteem voor het bewaren van de uitslagen van de gemeten of bepaalde doses, bedoeld in
      de [artikelen 87][ref1], [88][ref2] en [89][ref3].

      2 Onze Minister van Sociale Zaken en Werkgelegenheid wijst een instelling aan die belast is met het beheer van het
      in het eerste lid bedoelde systeem en kan nadere regels stellen met betrekking tot de inrichting van het systeem.

      3 De in het tweede lid bedoelde instelling bewaart de geregistreerde gegevens in ieder geval totdat de persoon op
      wie de gegevens betrekking hebben de leeftijd van vijfenzeventig jaar heeft bereikt of zou hebben bereikt, maar ten
      minste dertig jaar nadat deze persoon de handelingen heeft beëindigd.

      4 Bij de verwerking van persoonsgegevens in het systeem, bedoeld in het eerste lid, kan de in het tweede lid
      bedoelde instelling gebruik maken van het burgerservicenummer of, bij het ontbreken daarvan, het sociaal-
      fiscaalnummer met het oog op de vaststelling van de identiteit van de persoon, bedoeld in het derde lid.

      5 Bij regeling van Onze Minister van Sociale Zaken en Werkgelegenheid kunnen nadere regels worden gesteld voor de
      toegankelijkheid en het beheer van het registratiesysteem.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel87
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel88
      [ref3]: https://wetten.overheid.nl/BWBR0012702#Artikel89
