  - number: '4'
    text: |-
      1 Een handeling is slechts toegestaan indien zij door Onze Ministers is gerechtvaardigd, dan wel behoort tot een
      categorie van handelingen die door Onze Ministers is gerechtvaardigd. Onze Ministers rechtvaardigen een handeling
      of een categorie van handelingen slechts indien de economische, sociale en andere voordelen van de betrokken
      handeling of categorie van handelingen opwegen tegen de gezondheidsschade die hierdoor kan worden toegebracht.

      2 Bij ministeriële regeling worden regels gesteld met betrekking tot de bekendmaking van:

      a. welke handelingen of categorieën daarvan overeenkomstig het eerste lid zijn gerechtvaardigd, en

      b. welke handelingen of categorieën daarvan overeenkomstig het eerste lid niet zijn gerechtvaardigd.

      3 Indien nieuwe, belangrijke gegevens over de doeltreffendheid of de gevolgen van de daarin opgenomen handelingen
      daartoe aanleiding geven kan de rechtvaardiging van de handeling worden herzien. Een wijziging als bedoeld in de
      vorige volzin wordt zo spoedig als redelijkerwijs mogelijk is van kracht.

      4 Indien een vergunning wordt aangevraagd of een melding wordt gedaan voor een handeling die als gerechtvaardigd is
      bekendgemaakt, wordt in de melding of de vergunningaanvraag verwezen naar die bekendmaking.

      5 Indien een vergunning wordt aangevraagd of een melding wordt gedaan voor een handeling die niet of als niet-
      gerechtvaardigd is bekendgemaakt, omvat de vergunningsaanvraag, onderscheidenlijk de melding tevens een verzoek
      om rechtvaardiging van die handeling. De vergunningsaanvraag of de melding bevat dan tevens de gegevens met
      betrekking tot de economische, sociale en andere voordelen van de betrokken handeling en met betrekking tot
      de gezondheidsschade die erdoor kan worden toegebracht, die nodig zijn met het oog op de beoordeling van de
      gerechtvaardigdheid van de handeling.

      6 Dit artikel is niet van toepassing op de rechtvaardiging, bedoeld in de artikelen 55, 56 en 57.

      7 Naast de handelingen of categorieën van handelingen die door Onze Ministers volgens het eerste lid zijn
      gerechtvaardigd, kan Onze Minister van Defensie, met het oog op het belang dat de krijgsmacht dient, een andere
      handeling of categorie van handelingen rechtvaardigen. Deze handeling of categorie van handelingen wordt door Onze
      Minister van Defensie bekendgemaakt op een bij regeling van deze Minister bepaalde wijze.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel4
  - number: '5'
    text: |-
      1 De ondernemer zorgt ervoor dat de effectieve of equivalente doses van individuele personen, in samenhang met het
      aantal blootgestelde personen, ten gevolge van een handeling zo laag zijn als redelijkerwijs mogelijk is.

      2 De ondernemer zorgt ervoor dat met betrekking tot potentiële blootstellingen zowel de dosis bij een blootstelling
      als de kans op een blootstelling zo laag als redelijkerwijs mogelijk is.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel5
  - number: '6'
    text: |-
      1 Onverminderd artikel 48, zorgt de ondernemer ervoor dat plaatsen binnen een locatie waar handelingen worden
      verricht, zodanig zijn ingericht dat voor personen die zich daarbuiten bevinden, ten gevolge van de handelingen
      tezamen een dosisbeperking van 1 mSv effectieve dosis in een kalenderjaar wordt gehanteerd.

      2 Indien het redelijkerwijs niet mogelijk is met bouwkundige voorzieningen te voldoen aan de verplichting, bedoeld
      in het eerste lid, wordt deze verkregen door middel van organisatorische maatregelen.

      3 De ondernemer zorgt ervoor dat bij het verrichten van handelingen die overeenkomstig artikel 21 worden gemeld,
      voor personen op enig punt buiten de locatie ten gevolge van die handelingen tezamen een dosisbeperking van 10 µSv
      effectieve dosis in een kalenderjaar wordt gehanteerd.

      4 Bij ministeriële regeling kunnen andere dosisbeperkingen worden vastgesteld voor daarbij aangegeven categorieën
      van handelingen, taken of functies.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel6
  - number: '7'
    text: |-
      1 De ingevolge dit besluit door een stralingsarts te verrichten taken worden slechts uitgevoerd door
      een persoon die als stralingsarts is ingeschreven in het door Onze Minister van Sociale Zaken en
      Werkgelegenheid aan te wijzen register en zijn taken uitvoert in overeenstemming met een persoon als bedoeld
      in [artikel 14, eerste lid, van de Arbeidsomstandighedenwet][ref1] die belast is met de taken, bedoeld in
      [artikel 14, eerste lid, onderdelen b of c, van die wet][ref2] of de arbodienst.

      2 De ingevolge dit besluit door een deskundige te verrichten taken worden slechts uitgevoerd door een persoon die
      als deskundige voor de uitvoering van de betrokken taak is ingeschreven in een door Onze Ministers aan te wijzen
      register.

      3 Bij regeling van Onze Minister van Sociale Zaken en Werkgelegenheid worden eisen vastgesteld met betrekking tot
      de kennis en bekwaamheden, waaraan moet worden voldaan om als stralingsarts in het register, bedoeld in het eerste
      lid, te worden ingeschreven.

      4 Bij ministeriële regeling worden eisen vastgesteld met betrekking tot vaardigheden en bekwaamheden, waaraan moet
      worden voldaan om als deskundige in een register als bedoeld in het tweede lid, te worden ingeschreven. De eisen
      kunnen verschillend worden vastgesteld voor de verschillende taken.

      5 Een inschrijving in een register als bedoeld in het eerste en tweede lid, kan worden geweigerd of ingetrokken,
      indien niet of niet volledig voldaan is aan de bij of krachtens de [wet][ref3] of dit besluit gestelde eisen.

      6 Bij ministeriële regeling worden regels gesteld voor:

      a. de aanwijzing en het beheer van registers als bedoeld in het eerste en tweede lid;

      b. de wijze van inschrijving;

      c. de gegevens en bescheiden die bij een aanvraag tot inschrijving worden verstrekt;

      d. de vergoeding die ten hoogste voor de inschrijving is verschuldigd;

      e. de gronden waarop en de gevallen waarin de inschrijving kan worden geweigerd of doorgehaald.

      7 Bij ministeriële regeling kunnen regels worden gesteld voor:

      a. de aanwijzing van een instelling als bedoeld in [artikel 69a van de wet][ref4];

      b. de gronden waarop die instelling kan worden aangewezen of de aanwijzing kan worden gewijzigd of ingetrokken;

      c. de gegevens en het verslag, bedoeld in [artikel 69b van de wet][ref5], die de instelling aan Onze Ministers
      verstrekt en de wijze waarop die informatie wordt verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
