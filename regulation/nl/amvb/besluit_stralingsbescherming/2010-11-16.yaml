  - number: 20d
    text: |-
      1 De ondernemer stelt financiële zekerheid ter dekking van de kosten van het nakomen van de voor hem geldende
      verplichtingen met betrekking tot het veilig afvoeren van een afgedankte hoogactieve bron voor het geval:

      a. hij failliet gaat of anderszins zijn bedrijfsactiviteiten beëindigt;

      b. degene met wie een overeenkomst was gesloten om de afgedankte hoogactieve bronnen af te nemen, niet meer tot die
      afname in staat is.

      2 De financiële zekerheid wordt gesteld op een of meer van de volgende wijzen:

      a. een borgtocht of een bankgarantie;

      b. het sluiten van een verzekeringsovereenkomst;

      c. het deelnemen aan een daartoe ingesteld fonds dat naar het oordeel van Onze Ministers en van Onze Minister van
      Financiën voldoende waarborg biedt dat de in het eerste lid bedoelde kosten zijn gedekt;

      d. het treffen van enige andere voorziening, waarbij de financiële zekerheid naar het oordeel van Onze Ministers en
      van Onze Minister van Financiën voldoende waarborg biedt dat de in het eerste lid bedoelde kosten zijn gedekt.

      3 Bij ministeriële regeling wordt een minimumbedrag vastgesteld waarvoor per volume-eenheid af te voeren bron, de
      daarbijbehorende bronhouder en de vaste afscherming financiële zekerheid wordt gesteld.

      4 De financiële zekerheid wordt gesteld ten behoeve van de Staat der Nederlanden.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel20d
  - number: 20e
    text: |-
      De financiële zekerheid wordt in stand gehouden tot het moment waarop de hoogactieve bron waarvoor de financiële
      zekerheid wordt gesteld, door de ondernemer:

      a. wordt overgedragen aan een andere ondernemer die met betrekking tot die bron de vereiste financiële zekerheid
      heeft gesteld,

      b. wordt afgegeven aan een krachtens [artikel 37, zevende lid][ref1], erkende ophaaldienst voor radioactieve
      afvalstoffen, of

      c. wordt afgegeven aan een krachtens [artikel 37, achtste lid][ref2], daartoe aangewezen instelling voor de
      ontvangst van radioactieve afvalstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel37
