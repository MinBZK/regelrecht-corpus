  - number: '44'
    text: |-
      1 De aanvraag om een vergunning voor een handeling als bedoeld in dit besluit bevat in ieder geval:

      a. de naam en het adres van degene die de aanvraag ondertekent;

      b. de naam en het adres van de ondernemer;

      c. een omschrijving van de locatie en het adres of de kadastrale gegevens daarvan, bij wisselende locaties wordt
      een zo goed mogelijke aanduiding hiervan gegeven;

      d. een omschrijving van de handeling waarvoor vergunning wordt gevraagd en het doel daarvan;

      e. de maximale totale effectieve dosis zowel ten gevolge van lozingen als ten gevolge van externe straling op basis
      van omgevingsdosisequivalenten, die een persoon in een kalenderjaar kan ontvangen op enig punt buiten de locatie
      van alle meldings- en vergunningplichtige handelingen tezamen binnen de locatie waarop de vergunningaanvraag van
      toepassing is;

      f. de maximale effectieve of equivalente dosis die de bij de handelingen betrokken werknemers in een kalenderjaar
      kunnen ontvangen;

      g. een beschrijving van de stralingsbeschermingsorganisatie en van de aanwezige deskundigheid met betrekking tot
      de handeling;

      h. een opgave van de tijdsduur van de handeling;

      i. een overzicht van alle meldingsplichtige en vergunningplichtige handelingen binnen de locatie, gespecificeerd
      naar aard en omvang.

      2 Indien de aanvraag betrekking heeft op een handeling met een toestel, bevat zij voorts een beschrijving van het
      toestel onder vermelding van de gegevens betreffende de ioniserende straling die het toestel kan uitzenden.

      3 Indien de aanvraag betrekking heeft op een handeling met radioactieve stoffen, bevat zij voorts:

      a. een opgave van de radionucliden, waarvoor vergunning wordt gevraagd;

      b. een opgave van de ten gevolge van alle vergunningplichtige handelingen maximaal in de lucht, in het openbare
      riool, het oppervlaktewater, of in de bodem te lozen radiotoxiciteitsequivalenten voor de locatie waarop de
      aanvraag betrekking heeft, uitgedrukt in radiotoxiciteitsequivalenten voor inhalatie, respectievelijk ingestie en
      gewogen voor inhalatie en ingestie;

      c. de radiotoxiciteitsequivalenten waarvoor de vergunning om te lozen wordt aangevraagd.

      4 Indien de aanvraag betrekking heeft op een handeling met een ingekapselde bron, bevat zij voorts een opgave van
      de chemische en fysische toestand en vorm waardoor deze radioactieve stoffen een ingekapselde bron vormen alsmede
      een aanduiding van de constructie en de kwaliteit van de bron.

      5 Indien het een handeling met radioactieve stoffen betreft, bevat de aanvraag voorts een opgave van de
      overeenkomstig [bijlage 3][ref1] gewogen en gesommeerde activiteit van de radionucliden in de radioactieve stoffen,
      die op de in het eerste lid, onder c, bedoelde locatie ten hoogste aanwezig zal zijn.

      6 Indien de omgevingsdosisequivalent, bedoeld in het eerste lid, onder e, hoger is dan 10 µSv of de
      radiotoxiciteitsequivalenten van de geloosde activiteiten een dosis vertegenwoordigen die gelijk aan of hoger is
      dan 1 µSv, in een kalenderjaar op enig punt buiten de locatie, bevat de aanvraag tevens een beschrijving van de
      maatregelen ter voorkoming van en bescherming tegen schade in en buiten de locatie.

      7 Indien het een handeling met een hoogactieve bron betreft, bevat de aanvraag voorts:

      a. informatie over het volume van de bron, de bronhouder en de vaste afscherming van die bron;

      b. schriftelijk bewijs dat de krachtens [artikel 20d, eerste lid][ref2], vereiste financiële zekerheid is gesteld.

      8 De houder van een vergunning is verplicht aan Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en
      Milieubeheer kennis te geven van een na het verlenen van de vergunning opgetreden wijziging in een der gegevens
      vermeld bij de aanvraag om de vergunning.

      9 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de gegevens van de aanvraag van
      de vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0012702
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel20d
