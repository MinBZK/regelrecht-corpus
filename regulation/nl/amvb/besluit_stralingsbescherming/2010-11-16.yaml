  - number: '84'
    text: |-
      1 Met betrekking tot een gecontroleerde zone zorgt de ondernemer ervoor dat:

      a. de zone is afgebakend en de toegang ertoe beperkt blijft tot door hem daartoe aangewezen personen en dat de zone
      wordt gecontroleerd overeenkomstig de door hem daartoe vastgestelde procedures;

      b. maatregelen zijn getroffen voor die gevallen waarin een aanzienlijk risico van verspreiding van radioactieve
      stoffen bestaat; deze maatregelen betreffen ook de toegang tot en het verlaten van de zone door personen en
      goederen;

      c. met inachtneming van de aard van de aanwezige bronnen en betrokken handelingen er een systeem van monitoring van
      de werkplek is;

      d. op de daarvoor geschikte plaatsen duidelijke waarschuwingsborden en -tekens met betrekking tot de zone en de
      risico's van ioniserende straling zijn aangebracht;

      e. aan personen die in de zone werkzaam zijn schriftelijke werkinstructies zijn gegeven, toegesneden op de risico's
      van ioniserende straling die aan de binnen de zone aanwezige bronnen en de aldaar te verrichten handelingen
      verbonden zijn.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot een gecontroleerde zone als
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel84
  - number: '85'
    text: |-
      1 Met betrekking tot een bewaakte zone zorgt de ondernemer ervoor dat:

      a. met inachtneming van de aard van de aanwezige bronnen en betrokken handelingen er een systeem van monitoring van
      de werkplek is;

      b. op de daarvoor geschikte plaatsen duidelijke waarschuwingsborden en -tekens en opschriften met betrekking tot de
      zone en de risico's van ioniserende straling zijn aangebracht;

      c. aan personen die in de zone werkzaam zijn schriftelijke werkinstructies zijn gegeven, toegesneden op de risico's
      van ioniserende straling die aan de bronnen en de betrokken handelingen verbonden zijn.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot een bewaakte zone als bedoeld in
      het eerste lid.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel85
  - number: '86'
    text: |-
      Ten behoeve van de uitvoering van de [artikelen 84][ref1] en [85][ref2] verricht de ondernemer, indien van
      toepassing, metingen binnen de bewaakte en gecontroleerde zone van:

      a. de dosistempi, met opgave van de aard en de kwaliteit van de desbetreffende straling, of

      b. bij de aanwezigheid van open bronnen, de activiteitsconcentratie in de lucht en de oppervlaktebesmetting met
      opgave van de aard en de fysische en chemische toestand en vorm ervan.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel84
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel85
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel86
