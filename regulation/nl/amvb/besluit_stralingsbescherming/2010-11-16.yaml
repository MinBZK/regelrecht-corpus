articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      *aanwijsinstrument:* instrument voor tijd- of plaatsbepaling, dan wel voor het meten, bepalen of aangeven van
      andere grootheden, bestemd voor gebruik op of in de directe omgeving van personen;

      *activiteit:*activiteit als bedoeld in [bijlage 2][ref1];

      *activiteitsconcentratie:*activiteitsconcentratie als bedoeld in [bijlage 2][ref2];

      *afgedankte hoogactieve bron*: hoogactieve bron die niet langer wordt gebruikt, noch bestemd is om te worden
      gebruikt voor de handeling waarvoor een vergunning is verleend;

      *arbodienst:*een dienst als bedoeld in de [Arbeidsomstandighedenwet][ref3];

      *A-werknemer:*de blootgestelde werknemer, bedoeld in [artikel 79, tweede lid][ref4];

      *besmetting:*de aanwezigheid van radioactieve stoffen in een materiaal, in of op een oppervlak, in een omgeving, of
      uitwendig op of inwendig in een persoon;

      *blootgestelde werknemer:*werknemer die gedurende zijn werktijd ten gevolge van handelingen een blootstelling
      ondergaat die kan leiden tot een dosis die hoger is dan een der in [artikel 76][ref5] genoemde dosislimieten;

      *blootstelling:*het blootgesteld zijn aan ioniserende straling;

      *bron:* toestel dan wel radioactieve stof;

      *broncontainer*: insluiting van een bron die geen geïntegreerd onderdeel van die bron is, maar uitsluitend is
      bedoeld voor tijdelijke behuizing van die bron voor transport, verlading en dergelijke;

      *bronhouder*: behuizing van een ingekapselde bron, die ter plaatse van het uittredevenster van de bronhouder is
      voorzien van een voorziening, waarmee de uittredende stralenbundel kan worden onderbroken en waaruit de bron niet
      zonder hulpgereedschap kan worden verwijderd;

      *B-werknemer:*andere blootgestelde werknemer dan een A-werknemer;

      *bijlage:* bij dit besluit behorende bijlage;

      *deskundige:*een persoon, die met het oog op de betrokken taak als deskundige is ingeschreven in een register als
      bedoeld in [artikel 7, tweede lid][ref6];

      *dosisbeperking:*dosiswaarde die bij de planning van handelingen wordt vastgesteld als plafondwaarde voor het
      optimaliseringsproces van de bescherming tegen ioniserende straling bij een handeling, taak of beroep of een
      categorie daarvan;

      *effectieve dosis:*effectieve dosis als bedoeld in [bijlage 2][ref7];

      *effectieve volgdosis:*effectieve volgdosis als bedoeld in [bijlage 2][ref8];

      *equivalente dosis:*equivalente dosis als bedoeld in [bijlage 2][ref9];

      *externe werknemer:*A-werknemer die onder verantwoordelijkheid van een ondernemer die in een andere
      lidstaat van de Europese Unie is gevestigd, werkzaam is op Nederlands grondgebied in een zone als bedoeld in
      [artikel 83, eerste lid, onder a, onderdeel 1°][ref10];

      *gezondheidsschade:*de geschatte kans op een kortere levensduur en verminderde kwaliteit van leven voor een persoon
      door de negatieve effecten van lichamelijke afwijkingen, kanker, en ernstige genetische effecten als gevolg van
      blootstelling aan ioniserende straling;

      *handeling:*het bereiden, voorhanden hebben, toepassen of zich ontdoen van een kunstmatige bron of van een
      natuurlijke bron, voor zover deze natuurlijke bron is of wordt bewerkt met het oog op zijn radioactieve
      eigenschappen dan wel het gebruiken of voorhanden hebben van een toestel, uitgezonderd bij een interventie, een
      ongeval of een radiologische noodsituatie;

      *hoogactieve bron*: ingekapselde bron die een radionuclide bevat waarvan de activiteit op het tijdstip waarop de
      bron is gefabriceerd, of indien dit niet bekend is, voor het eerst op de markt wordt gebracht, gelijk is aan of
      hoger is dan het desbetreffende activiteitsniveau in [bijlage 5][ref11], zolang de activiteit van dat radionuclide
      niet lager is dan het activiteitsniveau dat voor dat nuclide is opgenomen in [bijlage 1, tabel 1][ref12];

      *ingekapselde bron:*radioactieve stoffen die zijn ingebed in of gehecht aan vast dragermateriaal of zijn omgeven
      door een omhulling van materiaal met dien verstande dat hetzij het dragermateriaal hetzij de omhulling voldoende
      weerstand biedt om onder normale gebruiksomstandigheden elke verspreiding van radioactieve stoffen te voorkomen;

      *inspecteur:* als zodanig bij besluit van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer
      aangewezen ambtenaar;

      *kunstmatige bron:*bron, niet zijnde een natuurlijke bron en niet zijnde een toestel;

      *leverancier*: natuurlijke of rechtspersoon die een hoogactieve bron levert of ter beschikking stelt;

      *lid van de bevolking:*een persoon uit de bevolking binnen of buiten een locatie, niet zijnde een werknemer
      gedurende zijn werktijd of een persoon die een radiologische verrichting ondergaat;

      *locatie:*inrichting als aangewezen krachtens [artikel 1.1, derde lid, van de Wet milieubeheer][ref13] of plaats,
      waar een handeling of werkzaamheid wordt verricht;

      *lozing:*lozing in de bodem, in de lucht, in het openbare riool of in het oppervlaktewater;

      *lozing in de bodem:*het definitief in de bodem brengen of doen brengen teneinde deze aldaar te laten, van
      vloeibare of in water opgeloste radioactieve stoffen dan wel van in een waterstroom meegevoerde deeltjes van
      radioactieve stoffen, of het op de bodem brengen van deze stoffen indien daarbij de vloeistof voor een deel in de
      bodem treedt, met uitzondering van meststoffen in de zin van de [Meststoffenwet][ref14];

      *lozing in het openbare riool:*het in het openbare riool ontsnappen of laten ontsnappen van vloeibare of in water
      opgeloste radioactieve stoffen dan wel van in een waterstroom meegevoerde deeltjes van radioactieve stoffen;

      *lozing in de lucht:*het in de lucht ontsnappen van of laten ontsnappen van gasvormige radioactieve stoffen dan wel
      van in een luchtstroom meegevoerde deeltjes van radioactieve stoffen;

      *lozing in het oppervlaktewater:*het in het oppervlaktewater ontsnappen of laten ontsnappen van vloeibare of in
      water opgeloste radioactieve stoffen dan wel van in een waterstroom meegevoerde deeltjes van radioactieve stoffen;

      *mijnbouw:*handelingen of werkzaamheden in het kader van het verrichten van verkenningsonderzoek, het opsporen of
      het winnen van delfstoffen of aardwarmte, dan wel het opslaan van stoffen;

      *natuurlijke bron:*kosmische straling of bron van natuurlijke oorsprong, niet zijnde een toestel;

      *omgevingsdosisequivalent:*omgevingsdosisequivalent als bedoeld in [bijlage 2][ref15];

      *omgevingsdosisequivalenttempo:*omgevingsdosisequivalenttempo als bedoeld in [bijlage 2][ref16];

      *ondernemer:*degene onder wiens verantwoordelijkheid een handeling of werkzaamheid wordt verricht;

      *Onze Ministers:*Onze Ministers van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, en van Sociale Zaken
      en Werkgelegenheid;

      *open bron:*bron, niet zijnde een ingekapselde bron en niet zijnde een toestel;

      *oppervlaktebesmetting:*oppervlaktebesmetting als bedoeld in [bijlage 2][ref17];

      *potentiële blootstelling:*blootstelling die niet met zekerheid zal optreden maar waarvan de waarschijnlijkheid van
      optreden en de grootte van de daarbij eventueel optredende blootstelling van tevoren kunnen worden geschat;

      *radioactieve afvalstof:*radioactieve stof die krachtens [artikel 38][ref18] als zodanig is aangemerkt en die niet
      wordt geloosd;

      *radiologische verrichting:*medische handeling met gebruikmaking van ioniserende straling als bedoeld in
      [artikel 53, eerste lid][ref19];

      *radiotoxiciteitsequivalent:*de activiteit die bij inname leidt tot een effectieve volgdosis van 1 sievert voor een
      volwassen referentiepersoon;

      *bedrijfstakdirecteur:* bevoegde bedrijfstakdirecteur van de Arbeidsinspectie;

      *schade:*nadelige gevolgen van ioniserende straling voor mensen, dieren, planten en goederen;

      *stralingsarts:*een persoon, die als stralingsarts is ingeschreven in het register, bedoeld in
      [artikel 7, eerste lid][ref20];

      *werknemer:*persoon die, hetzij in dienst of onder gezag van een ondernemer, hetzij als zelfstandige, arbeid
      verricht;

      *werkzaamheid:*het bereiden, voorhanden hebben, toepassen van of zich ontdoen van een natuurlijke bron voor zover
      die niet wordt of is bewerkt wegens zijn radioactieve eigenschappen, uitgezonderd bij een interventie, een ongeval
      of een radiologische noodsituatie;

      *wet:* [Kernenergiewet][ref21].

      2 In dit besluit en de daarop berustende bepalingen wordt onder «voorhanden hebben» mede verstaan: het
      vervaardigen, bewerken, hanteren en opslaan, met uitzondering van opslag in verband met vervoer.

      3 Met betrekking tot dit besluit en de daarop berustende bepalingen worden bij de bepaling van wat «redelijkerwijs
      mogelijk» is de economische en sociale factoren in aanmerking genomen. Daarnaast wordt ingeval van blootstelling
      in aanmerking genomen de mate waarin een blootstelling en de kans van optreden van die blootstelling kunnen worden
      beperkt.


