  - number: '47'
    text: |-
      1 Indien op de voorbereiding van een beschikking terzake van een vergunning voor het verrichten van een handeling
      met radioactieve stoffen [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing is, worden, anders
      dan als adviseurs, betrokken: het gedeputeerde staten van de provincie, het college van burgemeester en wethouders
      van de gemeente waar de handeling wordt of zal worden verricht of, indien het een lozing in oppervlaktewateren
      betreft, het orgaan dat belast is met het kwalitatieve beheer van het oppervlaktewater waarin wordt of zal worden
      geloosd.

      2 Indien op de voorbereiding van een beschikking terzake van een vergunning voor een handeling met een toestel
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] van toepassing is, wordt, anders dan als adviseur, betrokken
      het college van burgemeester en wethouders van de gemeente waar de handeling wordt of zal worden verricht.

      3 Van de besluiten op aanvragen van vergunningen op de voorbereiding waarvan
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref3] niet van toepassing is, wordt door Onze Minister van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer mededeling gedaan in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
