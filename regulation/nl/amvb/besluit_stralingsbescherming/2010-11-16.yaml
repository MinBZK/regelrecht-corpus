  - number: '83'
    text: |-
      1 De ondernemer zorgt ervoor dat, indien dat nodig is met het oog op de bescherming tegen ioniserende straling:

      a. een ruimte wordt aangemerkt als gecontroleerde zone, indien:

      1°. de mogelijk door een werknemer te ontvangen dosis gelijk is aan een effectieve dosis die hoger is dan
      6 mSv in een kalenderjaar of een equivalente dosis die hoger is dan drie tiende van de dosis, genoemd in
      [artikel 77, eerste lid, onder b][ref1], of

      2°. er een mogelijkheid is van verspreiding van radioactieve stoffen vanuit de ruimte zodanig dat personen een
      dosis hoger dan een effectieve of equivalente dosis, genoemd in [artikel 76][ref2], kunnen ontvangen;

      b. een ruimte wordt aangemerkt als bewaakte zone, indien de mogelijk door een werknemer te ontvangen effectieve
      dosis hoger is dan 1 mSv in een kalenderjaar en lager dan 6 mSv in een kalenderjaar of de equivalente dosis hoger
      is dan die genoemd in [artikel 76, onder b][ref3], en lager dan die genoemd onder a, ten eerste.

      2 De ondernemer houdt in een gecontroleerde en in een bewaakte zone passend toezicht op de arbeidsomstandigheden
      met het oog op de bescherming tegen ioniserende straling.

      3 De ondernemer zorgt ervoor dat de omvang en de kwaliteit van de maatregelen ten behoeve van de bescherming tegen
      ioniserende straling zijn afgestemd op de risico's die aan de bronnen en de betrokken handelingen verbonden zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel77
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel76
      [ref3]: https://wetten.overheid.nl/BWBR0012702#Artikel76
