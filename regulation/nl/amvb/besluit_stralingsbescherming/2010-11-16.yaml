    text: |-
      De ondernemer zorgt ervoor dat na herstel- of onderhoudswerkzaamheden aan een aanwijsinstrument waaraan
      radionucliden voor verlichtingsdoeleinden zijn toegevoegd:

      a. ten gevolge van die herstel- en onderhoudswerkzaamheden geen afwijkingen van de bij en krachtens de
      [artikelen 28][ref1] en [29][ref2] gestelde voorschriften zijn ontstaan;

      b. het krachtens [artikel 30, tweede lid, onder a][ref3], vastgestelde waarschuwingsteken voor ioniserende straling
      is aangebracht op een vanaf de buitenzijde van het instrument zichtbare plaats;

      c. het in de [artikelen 30, tweede lid, onder b][ref4], onderscheidenlijk [32, onder b][ref5], genoemde merkteken
      is aangebracht.


