  - number: '45'
    text: |-
      [Afdeling 3.4 van de Algemene wet bestuursrecht][ref1], alsmede [afdeling 13.2 van de Wet milieubeheer][ref2]
      zijn van toepassing op de voorbereiding van een beschikking ter zake van een vergunning als bedoeld in artikel 23,
      eerste lid, onder c, behoudens indien:

      a. het toestel uitsluitend voor radiologische verrichtingen is bestemd;

      b. het toestel zich bevindt in een voertuig of aan boord van een vaartuig of luchtvaartuig, dat als zodanig wordt
      gebruikt;

      c. het toestel zich bevindt op steeds wisselende locaties, en naar het oordeel van Onze Minister
      van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer het belang van de toepassing van
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref3], alsmede [afdeling 13.2 van de Wet milieubeheer][ref4] niet
      opweegt tegen de daaraan verbonden bezwaren;

      d. indien al eerder vergunning voor een toestel van hetzelfde type met betrekking tot dezelfde plaats is verleend
      en naar het oordeel van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer niet te verwachten
      is dat door gebruikmaking van de gevraagde vergunning meer schade kan ontstaan dan bij de eerder verleende
      vergunning in aanmerking is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Afdeling13.2
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Afdeling13.2
