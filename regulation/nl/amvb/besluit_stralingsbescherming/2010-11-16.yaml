  - number: '40'
    text: |-
      1 De melding, bedoeld in de artikelen 21 en 22, wordt beoordeeld door Onze Ministers, en

      a. indien de in die artikelen bedoelde handelingen betrekking hebben op medische stralingstoepassingen, Onze
      Minister van Volksgezondheid, Welzijn en Sport;

      b. indien de in die artikelen bedoelde handelingen betrekking hebben op mijnbouw, Onze Minister van Economische
      Zaken.

      De ondernemer dient de melding in bij Onze Minister van Sociale Zaken en Werkgelegenheid.

      2 Bij regeling van Onze Ministers, en

      a. indien het medische stralingstoepassingen betreft, Onze Minister van Volksgezondheid Welzijn en Sport;

      b. indien het mijnbouw betreft, Onze Minister van Economische Zaken;

      kunnen nadere regels worden gesteld met betrekking tot de melding, bedoeld in het eerste lid
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel40
  - number: '41'
    text: |-
      1 De melding, bedoeld in artikel 21, bevat in ieder geval:

      a. de naam en het adres van degene die de melding ondertekent;

      b. de naam en het adres van de ondernemer;

      c. het adres of de kadastrale gegevens van de locatie;

      d. een omschrijving van de handeling, de plaats van de handeling en van het doel;

      e. de maximale effectieve dosis die een persoon in een kalenderjaar kan ontvangen op enig punt buiten de locatie
      ten gevolge van de toestellen die zich binnen twee meter van enig punt buiten de locatie bevinden.

      2 De melding bevat voorts een beschrijving van het toestel waarmee de gemelde handeling wordt verricht.

      3 Indien de in het eerste lid, onder e, bedoelde dosis hoger is dan 10 µSv, bevat de melding tevens een
      beschrijving van de maatregelen ter voorkoming van en bescherming tegen schade in en buiten de locatie.

      4 Indien de handeling uitsluitend het in opslag hebben van een toestel betreft, worden slechts de in het eerste
      lid, onder a tot en met d, genoemde gegevens verstrekt en wordt vermeld welk soort toestel het betreft.

      5 Degene die de handeling meldt, is verplicht aan Onze Ministers kennis te geven van een na de melding opgetreden
      wijziging in een van de gegevens die bij de melding zijn vermeld.

      6 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de gegevens die een melding
      bevat en tot de situaties waarin een nieuwe melding is vereist.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel41
  - number: '42'
    text: |-
      De melding, bedoeld in [artikel 22][ref1], bevat in ieder geval:

      a. de naam en het adres van degene die de melding ondertekent;

      b. de naam en het adres van de ondernemer;

      c. het adres of de kadastrale gegevens van de locatie;

      d. een aanduiding van de handeling;

      e. indien van toepassing de wijze waarop de ondernemer zich van het toestel heeft ontdaan;

      f. indien van toepassing een wijziging van de effectieve dosis als bedoeld in
      [artikel 41, eerste lid, onder e][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel22
