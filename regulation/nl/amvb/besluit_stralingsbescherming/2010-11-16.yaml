        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '88'
    text: |-
      1 De bedrijfstakdirecteur of, bij mijnbouw, de Inspecteur-Generaal der Mijnen, of, indien het de krijgsmacht
      betreft een door Onze Minister van Defensie aan te wijzen autoriteit, kan, indien het meten van blootstelling aan
      ioniserende straling aan de hand van persoonlijke controlemiddelen niet of niet goed mogelijk is, of als op andere
      wijze de effectieve of equivalente dosis wordt bepaald, ontheffing verlenen van het bepaalde in [artikel 87][ref1].

      2 Aan de ontheffing, bedoeld in het eerste lid, worden voorschriften verbonden die inhouden dat de effectieve of
      equivalente dosis geschat wordt aan de hand van de individuele metingen bij andere blootgestelde werknemers, of
      aan de hand van de in [artikel 86][ref2] bedoelde ruimtemonitoring, of in het geval van vliegtuigbemanningen op een
      wijze als bedoeld in [artikel 111, eerste lid, onder b][ref3], of op andere wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel87
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel86
      [ref3]: https://wetten.overheid.nl/BWBR0012702#Artikel111
