    text: |-
      1 [Afdeling 3.4 van de Algemene wet bestuursrecht][ref1], alsmede [afdeling 13.2 van de Wet milieubeheer][ref2]
      zijn niet van toepassing op de voorbereiding van een beschikking ter zake van een vergunning voor het verrichten
      van handelingen met open bronnen, indien de uitkomst van de gewogen sommatie van de activiteiten van de op enig
      moment aanwezige hoeveelheid radionucliden in de bij die handelingen betrokken radioactieve stoffen volgens de in
      [bijlage 3][ref3] aangegeven methode niet meer bedraagt dan 104.

      2 Het eerste lid is van overeenkomstige toepassing voor ingekapselde bronnen met dien verstande dat de uitkomst
      niet meer bedraagt dan 107.


