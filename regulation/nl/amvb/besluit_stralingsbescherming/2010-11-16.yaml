  - number: '111'
    text: |-
      1 In afwijking van de [artikelen 102 tot en met 110][ref1] zorgt de ondernemer ervoor dat met betrekking tot een
      blootgestelde werknemer die deel uitmaakt van een vliegtuigbemanning:

      a. deze voor zijn indiensttreding of tewerkstelling als zodanig wordt voorgelicht omtrent de risico's van kosmische
      straling;

      b. de grootte van de door hem ontvangen effectieve dosis ten gevolge van kosmische straling wordt bepaald door
      middel van een door Onze Minister van Sociale Zaken en Werkgelegenheid vastgestelde methode;

      c. indien een effectieve dosis van 6 mSv in een kalenderjaar kan worden overschreden, ter voldoening aan de
      in [artikel 5][ref2] gestelde verplichting een aangepast werkrooster wordt vastgesteld en uitgevoerd en de
      desbetreffende werknemer wordt ingedeeld als A-werknemer;

      d. de door hem ten gevolge van kosmische straling ontvangen effectieve dosis tezamen met de effectieve doses
      ten gevolge van handelingen die onder verantwoordelijkheid van de ondernemer worden verricht, 20 mSv in een
      kalenderjaar niet overschrijdt.

      2 De [artikelen 15, eerste en vijfde lid][ref3], [16][ref4], [79][ref5], [80][ref6], [90][ref7],
      [91][ref8], [92, tweede lid][ref9], en [96 tot en met 100][ref10] zijn van overeenkomstige toepassing.
      [Artikel 92, eerste lid][ref11], is van overeenkomstige toepassing, met dien verstande dat in plaats van «de
      uitslag van de individuele monitoring, bedoeld in de [artikelen 87][ref12], [88][ref13] en [89][ref14]» wordt
      gelezen: de uitslag van de individuele monitoring, bedoeld in [artikel 111, eerste lid][ref15].

      3 Dit artikel is niet van toepassing op vluchten die uitsluitend op een hoogte van minder dan acht kilometer
      plaatsvinden.

      4 Onze Minister van Sociale Zaken en Werkgelegenheid kan nadere regels stellen met betrekking tot het bepaalde in
      dit artikel.


