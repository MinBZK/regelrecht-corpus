  - number: '36'
    text: |-
      1 De ondernemer die een handeling verricht, zorgt ervoor dat, zoveel als redelijkerwijs mogelijk is:

      a. het ontstaan van radioactieve afvalstoffen wordt voorkomen of beperkt,

      b. bronnen na gebruik als zodanig opnieuw worden gebruikt,

      c. radioactieve stoffen en materialen waaruit een bron bestaat, na gebruik ervan opnieuw worden gebruikt, of

      d. voorwerpen, stoffen en materialen die met radioactieve stoffen zijn besmet of geactiveerd, na gebruik ervan
      zodanig worden bewerkt dat ze opnieuw kunnen worden gebruikt.

      2 Bij het vervaardigen van bronnen wordt gebruik gemaakt van stoffen en materialen die na gebruik van de bron geen
      of zo min mogelijk nadelige gevolgen voor het milieu veroorzaken.

      3 De ondernemer zorgt er voor dat een handeling zoveel als mogelijk is wordt verricht op een wijze waardoor de
      bescherming tegen schade is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel36
  - number: '37'
    text: |-
      1 Het is verboden zich zonder vergunning van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en
      Milieubeheer te ontdoen van radioactieve stoffen voor product- of materiaalhergebruik of van radioactieve
      afvalstoffen.

      2 Het verbod geldt niet indien:

      a. de activiteit van de radionucliden in de betrokken radioactieve stoffen in een kalenderjaar in totaal lager is
      dan de in [bijlage 1, tabel 1][ref1], genoemde waarde, of

      b. de activiteitsconcentratie van die stof lager is dan de in [bijlage 1, tabel 1][ref2], genoemde waarde.

      3 [Artikel 25, derde, vierde, zesde en zevende lid][ref3], is van overeenkomstige toepassing.

      4 Het verbod geldt tevens niet indien het ingekapselde bronnen betreft, die worden teruggenomen door degene die de
      bron heeft vervaardigd of geleverd.

      5 Het verbod geldt tevens niet indien het een feitelijke levering betreft van radioactieve stoffen door enkele
      overgave aan een derde met het oog op:

      a. gebruik, product- of materiaalhergebruik van radioactieve stoffen, of

      b. inzameling van radioactieve afvalstoffen.

      6 Het verbod geldt tevens niet voor afgifte aan een door Onze Ministers aangewezen instelling voor ontvangst van in
      bezit genomen radioactieve stoffen als bedoeld in [artikel 33, vierde lid, van de wet][ref4].

      7 Het verbod geldt tevens niet voor het zich ontdoen van radioactieve afvalstoffen door afgifte aan een door Onze
      Ministers erkende ophaaldienst voor radioactieve afvalstoffen.

      8 Het verbod geldt tevens niet voor afgifte aan door Onze Ministers aangewezen instellingen voor de ontvangst van
      radioactieve afvalstoffen.

      9 Het vierde tot en met achtste lid gelden alleen indien de ondernemer zich ervan heeft vergewist dat de ontvanger
      in het bezit is van een vergunning voor de desbetreffende handeling of anderszins gerechtigd is deze stoffen te
      ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0012702
      [ref2]: https://wetten.overheid.nl/BWBR0012702
