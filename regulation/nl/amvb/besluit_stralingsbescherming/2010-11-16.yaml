  - number: '128'
    text: |-
      Op de aanvragen voor een vergunning krachtens [artikel 29 van de wet][ref1], juncto de artikelen 6 en 7 van het
      Besluit stralenbescherming Kernenergiewet, zoals dat besluit luidde tot de datum van inwerkingtreding van dit
      besluit, en aangiften van een toestel krachtens artikel 72 van het Besluit stralenbescherming Kernenergiewet, die
      zijn gedaan voor de datum van inwerkingtreding van dit besluit wordt beslist overeenkomstig de regels krachtens
      het Besluit stralenbescherming Kernenergiewet, zoals dat besluit luidde tot de datum van inwerkingtreding van dit
      besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel29
