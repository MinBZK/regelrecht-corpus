  - number: '35'
    text: |-
      1 Het is verboden zich zonder vergunning van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en
      Milieubeheer te ontdoen van radioactieve stoffen door middel van lozing in de lucht, in het openbare riool of in
      het oppervlaktewater.

      2 Dit verbod geldt niet indien:

      a. bij lozing in de lucht, de activiteit van de in totaal in een kalenderjaar geloosde hoeveelheid radioactieve
      stoffen bij het verlaten van de locatie via een lozingspunt lager is dan 1 radiotoxiciteitsequivalent voor
      inhalatie als bedoeld in [bijlage 2][ref1];

      b. bij lozing in het openbare riool, de activiteit van de in totaal in een kalenderjaar geloosde hoeveelheid
      radioactieve stoffen bij het verlaten van de locatie via een lozingspunt lager is dan 10 radiotoxiciteitsequivalent
      voor ingestie als bedoeld in [bijlage 2][ref2];

      c. bij lozing in het oppervlaktewater, de activiteit van de in totaal in een kalenderjaar geloosde
      hoeveelheid radioactieve stoffen bij het verlaten van de locatie via een lozingspunt lager is dan 0,1
      radiotoxiciteitsequivalent voor ingestie als bedoeld in [bijlage 2][ref3].

      3 Het is verboden radioactieve stoffen te lozen in de bodem.

      4 Het verbod, bedoeld in het derde lid, geldt niet voor het lozen in de bodem, wanneer de geloosde hoeveelheid
      radioactieve stoffen bij het verlaten van het lozingspunt minder bedraagt dan 10-6 radiotoxiciteitsequivalent voor
      ingestie als bedoeld in [bijlage 2][ref4].

      5 Het verbod, bedoeld in het derde lid, geldt niet voor het lozen van productiewater bij mijnbouw, indien dit
      geschiedt door middel van injecteren naar een soortgelijke bodemformatie en diepte als waaruit het water afkomstig
      is en op zodanige wijze dat het water niet in andere watervoerende lagen komt.

      6 De geloosde hoeveelheden, uitgedrukt in radiotoxiciteitsequivalenten, worden gecorrigeerd voor fysisch verval
      door middel van de correctiefactoren zoals aangegeven in [bijlage 2][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0012702
      [ref2]: https://wetten.overheid.nl/BWBR0012702
      [ref3]: https://wetten.overheid.nl/BWBR0012702
      [ref4]: https://wetten.overheid.nl/BWBR0012702
      [ref5]: https://wetten.overheid.nl/BWBR0012702
