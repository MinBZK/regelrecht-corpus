  - number: '89'
    text: |-
      1 Indien een werknemer bij een ongeval aan ioniserende straling in het kader van een handeling is of kan zijn
      blootgesteld, zorgt de ondernemer ervoor dat de effectieve of equivalente doses worden bepaald, die door de
      betrokken werknemer zijn ontvangen.

      2 Indien een werknemer bij een radiologische noodsituatie aan ioniserende straling is of kan zijn blootgesteld,
      zorgt de ondernemer die voor de handeling die de radiologische noodsituatie heeft veroorzaakt verantwoordelijk is,
      ervoor dat individuele monitoring wordt uitgevoerd of dat de effectieve of equivalente doses die door de betrokken
      werknemer zijn ontvangen, op een andere wijze worden bepaald.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel89
  - number: '90'
    text: |-
      De ondernemer zorgt ervoor dat afzonderlijk van iedere blootgestelde werknemer wordt geregistreerd:

      a. de naam, de geboortedatum en het geslacht;

      b. indeling in categorie A- of B- werknemer;

      c. de gemeten of bepaalde doses op grond van de [artikelen 87 tot en met 89][ref1];

      d. de resultaten van de ruimtemonitoring die zijn gebruikt bij de berekening van de effectieve of equivalente
      doses;

      e. in het geval van de in de [artikelen 81][ref2] en [89][ref3] bedoelde blootstelling, de rapporten met betrekking
      tot de omstandigheden en de genomen maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0012702#Artikel87
      [ref2]: https://wetten.overheid.nl/BWBR0012702#Artikel81
      [ref3]: https://wetten.overheid.nl/BWBR0012702#Artikel89
