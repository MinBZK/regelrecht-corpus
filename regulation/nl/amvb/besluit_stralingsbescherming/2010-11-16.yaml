  - number: '112'
    text: |-
      1 Een interventie wordt slechts verricht indien de daarvan verwachte beperking van de schade en de nadelige
      sociale en maatschappelijke gevolgen veroorzaakt door straling, voldoende is om de schade, de nadelige sociale en
      maatschappelijke gevolgen en de kosten van de interventie te rechtvaardigen.

      2 De vorm, de omvang en de duur van de interventie zijn zodanig, dat het voordeel van de daarmee te bereiken
      beperking van de gezondheidsschade, rekening houdend met de schade die aan de interventie is verbonden, zo groot is
      als redelijkerwijs mogelijk is.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel112
  - number: '113'
    text: |-
      1 Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, en:

      a. indien het de krijgsmacht betreft, Onze Minister van Defensie;

      b. indien het medische stralingstoepassingen betreft, Onze Minister van Volksgezondheid, Welzijn en Sport;

      c. indien het arbeidsbescherming betreft, Onze Minister van Sociale Zaken en Werkgelegenheid,

      d. indien het mijnbouw betreft, Onze Minister van Economische Zaken;

      e. indien het lozing in het oppervlaktewater betreft, Onze Minister van Verkeer en Waterstaat;

      f. indien het lozing in het oppervlaktewater of lozing in de lucht betreft, Onze Minister van Landbouw, Natuur
      en Voedselkwaliteit;

      zorgen ervoor dat er teams voor technische en medische interventie en voor het verwijderen van radioactieve
      besmetting beschikbaar zijn, die voor de uitvoering daarvan voldoende zijn toegerust.

      2 De leden van deze teams zijn voldoende opgeleid voor de uitvoering van hun taken.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel113
  - number: '114'
    text: |-
      De [artikelen 87][ref1], [89][ref2], [90][ref3], [92][ref4], [93][ref5] en [96][ref6] zijn van overeenkomstige
      toepassing voor de teams bedoeld in [artikel 113, eerste lid][ref7], met dien verstande dat de daar bedoelde
      verplichtingen rusten op degene onder wiens verantwoordelijkheid de interventie wordt verricht.


