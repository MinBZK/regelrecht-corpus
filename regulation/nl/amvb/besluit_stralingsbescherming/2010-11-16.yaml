  - number: '119'
    text: |-
      1 Onze in [artikel 113][ref1] genoemde Ministers, ieder voor zover het het in dat artikel genoemde belang betreft,
      of de ondernemer kunnen een situatie aanmerken als een situatie die leidt tot langdurige blootstelling als gevolg
      van een radiologische noodsituatie of van een vroegere handeling of werkzaamheid.

      2 Onze Ministers kunnen in het geval dat de situatie als bedoeld in het eerste lid onder de verantwoordelijkheid
      van een ondernemer valt, de ondernemer verplichten de interventie uit te voeren.

      3 In een geval als bedoeld in het eerste lid, draagt degene onder wiens verantwoordelijkheid de interventie wordt
      verricht, voor zover dat nodig is met het oog op het gevaar van blootstelling, zorg voor:

      a. de afbakening van het desbetreffende gebied;

      b. de invoering van een bewakingssysteem voor de blootstelling;

      c. de uitvoering van de interventie, overeenkomstig een door Onze betrokken Minister goedgekeurd plan van aanpak;

      d. het regelen van de toegang tot of het gebruik van de locaties of gebouwen, die zich in het afgebakende gebied
      bevinden.

      4 Met betrekking tot interventie in een geval als bedoeld in het eerste lid is dit besluit, met uitzondering
      van de [paragrafen 4.2 tot en met 4.4][ref2] en de [artikelen 39, onder b][ref3], [48][ref4], en
      [114 tot en met 118][ref5], van overeenkomstige toepassing.


