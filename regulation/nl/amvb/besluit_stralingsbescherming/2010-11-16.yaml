  - number: '109'
    text: |-
      1 Op de aanvraag om een vergunning, bedoeld in de artikelen 107 en 108, is artikel 43 van overeenkomstige
      toepassing. De aanvraag bevat in ieder geval:

      a. de naam en het adres van degene die de aanvraag ondertekent;

      b. de naam en het adres van de ondernemer;

      c. het adres of de kadastrale gegevens van de locatie;

      d. een omschrijving van de werkzaamheid, de plaats van de werkzaamheid en van het doel;

      e. bij product- of materiaalhergebruik de eindbestemming van het materiaal en een schatting van de effectieve doses
      in een kalenderjaar, die personen ten gevolge van die eindbestemming en van het verwerkingspad kunnen ontvangen;

      f. een opgave van de betrokken natuurlijke bronnen en de daarin voorkomende radionucliden.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de gegevens die een aanvraag
      bevat.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel109
  - number: '110'
    text: |-
      1 Bij ministeriële regeling kunnen, indien dat naar het oordeel van Onze Ministers met het oog op rechtvaardiging
      en optimalisatie noodzakelijk is, regels worden gesteld met betrekking tot de uitvoering van daarbij aangegeven
      werkzaamheden die overeenkomstig artikel 103 worden gemeld.

      2 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot product- of materiaalhergebruik en
      opslag van afval van natuurlijke bronnen, voor categorieën van gevallen waarin de activiteitsconcentratie in
      combinatie met de totale activiteit van de betrokken natuurlijke bronnen hoger is dan de in bijlage 1, tabel 1,
      aangegeven waarde.

      3 Artikel 25, derde, vierde, zevende en achtste lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel110
  - number: 110a
    text: |-
      1 Het is verboden radioactieve afvalstoffen afkomstig van natuurlijke bronnen te mengen zodanig dat de
      activiteitsconcentratie van die afvalstoffen gebracht wordt:

      a. beneden tienmaal de in [bijlage 1, tabel 1][ref1], bedoelde waarden, of

      b. beneden de in [bijlage 1, tabel 1][ref2], bedoelde waarden.

      2 Onverminderd het bepaalde in de [artikelen 103][ref3] en [107][ref4] geldt het verbod, bedoeld in het eerste lid,
      niet, indien wordt aangetoond dat het mengen geen groter gevaar, grotere schade of meer hinder veroorzaakt dan in
      het geval de radioactieve afvalstoffen afkomstig van natuurlijke bronnen niet zouden worden gemengd.


