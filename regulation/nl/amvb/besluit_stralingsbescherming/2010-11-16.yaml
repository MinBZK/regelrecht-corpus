  - number: '2'
    text: |-
      Dit besluit is niet van toepassing op:

      a. lozing of het zich ontdoen van radioactieve stoffen waarvoor de in de [artikelen 35][ref1], [37][ref2] en
      [108][ref3] gestelde verboden niet gelden;

      b. het vervoeren van radioactieve stoffen en het binnen of buiten Nederlands grondgebied brengen of doen brengen
      daarvan;

      c. het vervoeren van toestellen, die tijdens vervoer niet gebruikt worden;

      d. handelingen met een toestel met een maximale hoogspanning van 5 kV;

      e. blootstelling aan radon en dochternucliden, afkomstig uit de onverstoorde aardkorst of uit bouwmaterialen
      gebruikt in gebouwen;

      f. bovengrondse blootstelling aan radionucliden die zich bevinden in de onverstoorde aardkorst of in bouwmaterialen
      gebruikt in gebouwen;

      g. straling ten gevolge van radionucliden die van nature in het menselijk lichaam aanwezig zijn;

      h. kosmische straling ter hoogte van het aardoppervlak;

      i. kosmische straling in een vliegtuig voor leden van de bevolking en voor werknemers, die niet behoren tot de
      vliegtuigbemanning;

      j. blootstelling aan radon en dochternucliden die vrijkomen bij het verbranden of afblazen van aardgas.


