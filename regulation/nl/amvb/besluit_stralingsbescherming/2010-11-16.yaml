  - number: '120'
    text: |-
      1 De ondernemer die handelingen verricht, houdt een administratie bij van die handelingen.

      2 De administratie bevat ten minste:

      a. de naam van de rechtspersoon en de verantwoordelijke deskundige;

      b. de plaats waar de handelingen worden verricht;

      c. een omschrijving van de aard en de omvang van de handelingen.

      3 Bij ministeriële regeling worden nadere regels voor de inhoud en regels voor de bewaartermijnen van de
      administratie gesteld.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel120
  - number: 120a
    text: |-
      1 De ondernemer die handelingen verricht met een hoogactieve bron, verstrekt Onze Minister van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer schriftelijk de relevante gegevens met betrekking tot die bron.

      2 Bij ministeriële regeling worden nadere regels gesteld met betrekking tot die gegevens en de tijdstippen waarop
      deze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel120a
  - number: '121'
    text: |-
      1 Degene die binnen een locatie handelingen verricht als bedoeld in artikel 43, derde lid, houdt een administratie
      bij van die handelingen.

      2 De administratie bevat:

      a. de naam van de houder van de vergunning en het nummer van de voor de betrokken handelingen verleende vergunning;

      b. het tijdstip waarop of de periode binnen een kalenderjaar waarin de handelingen zijn verricht;

      c. de plaats, de aard en de omvang van de handelingen;

      d. de aan de handelingen toe te rekenen maximale toename van de effectieve dosis die personen op enig punt buiten
      de locatie kunnen ontvangen.

      3 Indien degene die binnen een locatie handelingen gaat verrichten als bedoeld in artikel 43, derde lid, opnamen
      maakt of radioscopie toepast in het kader van niet destructief onderzoek wordt in de administratie tevens het
      totaal aantal opnamen en uren radioscopie binnen dezelfde locatie vermeld. Voor de toepassing van deze bepaling
      wordt het aantal opnamen gelijk gesteld aan het aantal voor dat doel gebruikte films.

      4 Indien degene die binnen een locatie handelingen gaat verrichten als bedoeld in het derde lid, een redelijk
      vermoeden heeft dat het totaal aantal opnamen dat binnen de locatie zal worden gemaakt, het aantal van 3300 in
      een kalenderjaar zal overschrijden, meldt hij dit onverwijld aan Onze Minister van Volkshuisvesting, Ruimtelijke
      Ordening en Milieubeheer en de opdrachtgever. Voor de toepassing van deze bepaling wordt acht uur radioscopie
      gelijk gesteld met een opname.

      5 Degene die een administratie als bedoeld in het eerste lid voert, bewaart de bescheiden waaruit die administratie
      bestaat, ten minste gedurende vijf jaar na het kalenderjaar waarop zij betrekking hebben.

      6 In dit artikel en de daarop berustende bepalingen wordt onder radioscopie verstaan: het door middel van
      ioniserende straling vanuit een toestel of apparaat via een stralingsdetector produceren van een visueel
      waarneembaar beeld door het geproduceerde signaal om te zetten naar een videosignaal, dat wordt weergegeven door
      een monitor.

      7 Het eerste lid geldt niet indien het aantal tevoren geschatte opnamen per kalenderjaar minder dan 100 is.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel121
  - number: '122'
    text: |-
      1 Degene die handelingen verricht voldoet aan nadere eisen terzake van de bij of krachtens dit besluit gestelde
      regels.

      2 Nadere eisen die uitsluitend betrekking hebben op de bescherming van werknemers tegen ioniserende straling ten
      gevolge van handelingen worden gesteld:

      a. indien het mijnbouw betreft: door de Inspecteur-Generaal der Mijnen;

      b. indien het andere handelingen betreft: door een daartoe door Onze Minister van Sociale Zaken en Werkgelegenheid
      aangewezen ambtenaar.

      3 Indien deze nadere eisen die geen betrekking hebben op de bescherming van werknemers tegen ioniserende straling
      bij door hen te verrichten handelingen, worden ze gesteld door de inspecteur, of de Inspecteur-Generaal voor
      de Gezondheidszorg, voor zover het de onder hen ressorterende belangen betreft of indien het de mijnbouw op het
      continentaal plat betreft, de Inspecteur-Generaal der Mijnen.

      4 Nadere eisen die zowel de in het tweede als in het derde lid bedoelde belangen betreffen, worden gesteld door de
      in die leden genoemde bestuursorganen gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel122
  - number: '123'
    text: |-
      1 In bijzondere gevallen kunnen Onze Ministers en Onze Ministers van Volksgezondheid, Welzijn en Sport, indien
      het radiologische verrichtingen betreft, van Defensie, indien het de krijgsmacht betreft en van Economische Zaken,
      indien het mijnbouw betreft, ontheffing verlenen van de voorschriften in paragraaf 3.3, en de artikelen 120 en 121.

      2 Aan de ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel123
  - number: '124'
    text: |-
      1 Indien dit in het belang van de bescherming tegen ioniserende straling naar het oordeel van Onze Ministers
      dringend noodzakelijk is en naar hun oordeel een wijziging van dit besluit niet kan worden afgewacht, kunnen bij
      ministeriële regeling regels worden gesteld, die van dit besluit afwijken maar met een strekking als bedoeld in
      dit besluit. Een zodanige regeling vervalt een jaar nadat zij in werking is getreden, of, indien binnen die termijn
      een wijziging van de betrokken bepaling van dit besluit inwerking is getreden, op het tijdstip waarop die wijziging
      in werking treedt. Onze Ministers kunnen de termijn bij ministeriële regeling eenmaal met ten hoogste een jaar
      verlengen.

      2 De waarden van bijlage 1, de tabellen 1, 2 en 3, en van bijlage 4 kunnen bij ministeriële regeling worden
      gewijzigd.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel124
  - number: '125'
    text: |-
      Het Besluit stralenbescherming Kernenergiewet en het Besluit registratie radioactieve stoffen en kosten
      keuringsdiensten Kernenergiewet worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0012702/2010-11-16#Artikel125
  - number: '127'
    text: |-
      1 Een vergunning, die voor de datum van inwerkingtreding van dit besluit is verleend krachtens:

      a. [artikel 29 van de wet][ref1], juncto artikel 6 en 7 van het Besluit stralenbescherming Kernenergiewet zoals dat
      besluit luidde tot de datum van inwerkingtreding van dit besluit;

      b. [artikel 34 van de wet][ref2], juncto artikel 8 van het Besluit stralenbescherming Kernenergiewet zoals dat
      besluit luidde tot de datum van inwerkingtreding van dit besluit, of

      c. [artikel 26 van de Mijnwet continentaal plat][ref3], juncto
      [artikel 167 van het Mijnreglement continentaal plat][ref4], zoals dat besluit luidde tot de datum
      van inwerkingtreding van dit besluit, berust na de datum van inwerkingtreding van dit besluit op de
      [artikelen 23][ref5], [24][ref6], [25][ref7] of [108][ref8] van dit besluit.

      2 Een handeling met een toestel waarvoor voor de datum van inwerkingtreding van dit besluit vergunning is
      verleend bij of krachtens [artikel 34 van de wet][ref9], juncto artikel 8, eerste lid, onder b, van het Besluit
      stralenbescherming Kernenergiewet zoals dat besluit luidde tot de datum van inwerkingtreding van dit besluit, wordt
      geacht te zijn gemeld overeenkomstig [artikel 21][ref10] van dit besluit.

      3 De ondernemer die een handeling of een werkzaamheid met een radioactieve stof verricht waarvoor krachtens
      [artikel 29 van de wet][ref11], juncto artikel 6, eerste en tweede lid, en artikel 7, eerste en tweede lid, van
      het Besluit stralenbescherming Kernenergiewet, zoals dat besluit luidde tot de datum van inwerkingtreding van dit
      besluit of krachtens [artikel 34 van de wet][ref12], geen vergunning is vereist maar waarvoor hij bij of krachtens
      dit besluit wel een vergunning behoeft, dient binnen 12 maanden na inwerkingtreding van dit besluit een aanvraag in
      overeenkomstig [artikel 43][ref13] van dit besluit. Totdat Onze Ministers hebben beslist op die aanvraag, wordt de
      handeling aangemerkt te zijn verricht overeenkomstig dit besluit.

      4 De ondernemer die een werkzaamheid verricht waarvoor krachtens de wet tot de datum van inwerkingtreding van dit
      besluit geen melding of vergunning is vereist, maar waarvoor krachtens [hoofdstuk 8][ref14] van dit besluit melding
      is vereist, meldt de werkzaamheid voor een door Onze Ministers nader te bepalen tijdstip. Tot dat tijdstip wordt de
      werkzaamheid geacht te zijn gemeld overeenkomstig dit besluit.

      5 De ondernemer die een werkzaamheid verricht waarvoor krachtens de wet tot de datum van inwerkingtreding van dit
      besluit een vergunning is verleend, maar waarvoor krachtens [hoofdstuk 8][ref15] van dit besluit een melding is
      vereist, wordt geacht de werkzaamheid te hebben gemeld overeenkomstig [artikel 103][ref16] van dit besluit. De aan
      de vergunning verbonden voorschriften blijven na de datum van inwerkingtreding van [hoofdstuk 8][ref17] van dit
      besluit gelden.

      6 Een toestel als bedoeld in [artikel 34 van de wet][ref18], juncto artikel 4, tweede lid, van het Besluit
      stralenbescherming Kernenergiewet, zoals dat besluit luidde tot de datum van inwerkingtreding van dit besluit,
      respectievelijk een handeling met een radioactieve stof als bedoeld in [artikel 29 van de wet][ref19],
      juncto artikel 6, derde lid, van het Besluit stralenbescherming Kernenergiewet, zoals dat besluit luidde
      tot de datum van inwerkingtreding van dit besluit, worden aangemerkt als een toestel dat ingevolge
      [artikel 21, tweede lid, onder d][ref20], van dit besluit is goedgekeurd, onderscheidenlijk een handeling van een
      type, dat ingevolge [artikel 26, eerste lid, onder a][ref21], van dit besluit is goedgekeurd.

      7 De handelingen waarvoor het eerste en tweede lid van toepassing zijn en die op grond van [artikel 4][ref22]
      niet-gerechtvaardigd zijn, of behoren tot een categorie die niet-gerechtvaardigd zijn, worden op de datum van
      inwerkingtreding van dit besluit aangemerkt als gerechtvaardigd.

      8 Handelingen die voor het in werking treden van dit besluit zijn gemeld overeenkomstig het Besluit
      stralenbescherming Kernenergiewet, en die niet overeenkomstig [artikel 4][ref23] zijn gerechtvaardigd, of behoren
      tot een categorie die niet overeenkomstig artikel 4 gerechtvaardigd is, worden gelijkgesteld met overeenkomstig
      artikel 4 gerechtvaardigde handelingen.


