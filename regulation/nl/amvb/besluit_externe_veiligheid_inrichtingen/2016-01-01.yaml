        artikel: '18'
        paragraaf: '7'
  - number: 22.1.c
    text: |-
      in afwijking van [artikel 18, tweede lid][ref1], een afstand geldt die gelijk is aan de afstand tot een kwetsbaar
      object, die aanwezig is op het tijdstip waarop de aanwijzing plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel18
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '18'
        paragraaf: '7'
  - number: '22.2'
    text: 'Onze Minister wijst geen gebieden als bedoeld in het eerste lid aan:'
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel22
  - number: 22.2.a
    text: |-
      waarin het plaatsgebonden risico voor een kwetsbaar object hoger is dan 10–5 per jaar of met de daarmede
      overeenkomende bij regeling van Onze Minister vastgestelde afstand;
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel22
  - number: 22.2.b
    text: |-
      waarvoor onvoldoende aannemelijk is dat het plaatsgebonden risico niet kan worden verminderd door toepassing van
      het bepaalde bij of krachtens [artikel 2.22 van de Wet algemene bepalingen omgevingsrecht][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 22.2.c
    text: |-
      waarvoor onvoldoende is aangetoond dat een zwaarwegend belang overschrijding van de grenswaarde, genoemd in
      [artikel 18, eerste lid][ref1], en bedoeld in [artikel 18, derde lid][ref2], of het niet in acht nemen van de
      afstanden, bedoeld in [artikel 18, tweede lid][ref3], noodzakelijk maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0016767#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0016767#Artikel18
