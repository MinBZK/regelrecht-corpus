  - number: '4.2'
    text: |-
      Het bevoegd gezag houdt bij de beslissing op een aanvraag als bedoeld in het eerste lid rekening met de
      richtwaarde, genoemd in [artikel 6, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel6
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel4
