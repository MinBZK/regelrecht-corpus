        artikel: '7'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0016767
        artikel: '24'
        paragraaf: '9'
  - number: '4.4'
    text: |-
      Het bevoegd gezag houdt bij de beslissing op een aanvraag als bedoeld in het derde lid, indien de aanvraag
      betrekking heeft op een verandering die nadelige gevolgen heeft voor het plaatsgebonden risico, rekening met de
      richtwaarde, genoemd in [artikel 7, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel7
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '7'
        paragraaf: '4'
  - number: '4.5'
    text: |-
      Het bevoegd gezag neemt bij de beslissing op een aanvraag, in afwijking van het eerste en derde lid, de bij
      regeling van Onze Minister vastgestelde afstanden tot al dan niet geprojecteerde kwetsbare objecten in acht en
      houdt bij die beslissing, in afwijking van het tweede en vierde lid, rekening met de bij die regeling vastgestelde
      afstanden tot al dan niet geprojecteerde beperkt kwetsbare objecten, indien die aanvraag betrekking heeft op:
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel4
  - number: 4.5.a
    text: |-
      een LPG-tankstation als bedoeld in [artikel 2, eerste lid, onderdeel e][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel2
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '2'
        paragraaf: '2'
  - number: 4.5.b
    text: |-
      een inrichting als bedoeld in [artikel 2, eerste lid, onderdeel f][ref1], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel2
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '2'
        paragraaf: '2'
  - number: 4.5.b.1°
    text: |-
      tot de inrichting geen opslagvoorziening voor de opslag van stoffen als bedoeld in
      [artikel 2, eerste lid, onderdeel f][ref1], behoort met een oppervlak van meer dan 2500 m2, en


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel2
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '2'
        paragraaf: '2'
  - number: 4.5.b.2°
    text: |-
      geen verpakkingseenheden van meer dan 100 kg met gevaarlijke stoffen of preparaten die bij of krachtens het
      [Besluit verpakking en aanduiding milieugevaarlijke stoffen][ref1] en preparaten zijn ingedeeld als zeer vergiftig,
      of gevaarlijke stoffen van ADR klasse 6.1, verpakkingsgroep I, in de open lucht worden gelost en geladen;


      [ref1]: https://wetten.overheid.nl/BWBR0004220
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004220
  - number: 4.5.c
    text: |-
      een inrichting waarin een koel- of vriesinstallatie aanwezig is als bedoeld in
      [artikel 2, eerste lid, onderdeel g][ref1], met een inhoud van minder dan 10.000 kg ammoniak, waarvan de diameter
      van de vloeistofleiding naar de verdamper 80 DN of minder bedraagt, of


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel2
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '2'
        paragraaf: '2'
  - number: 4.5.d
    text: |-
      een inrichting als bedoeld in [artikel 2, eerste lid, onderdeel h][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel2
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '2'
        paragraaf: '2'
  - number: '4.6'
    text: |-
      Bij regeling van Onze Minister kunnen categorieën van inrichtingen worden aangewezen waarvoor het plaatsgebonden
      risico, in afwijking van het vijfde lid, ter voldoening aan de grenswaarden, bedoeld in het eerste en derde lid,
      of ter voldoening aan de richtwaarde, bedoeld in het tweede en vierde lid, volgens bij die regeling gestelde regels
      mag worden berekend, indien naar het oordeel van het bevoegd gezag aan die grenswaarden of aan die richtwaarde
      wordt voldaan door het in acht nemen, onderscheidenlijk het zoveel mogelijk in acht nemen, van een kleinere afstand
      dan de afstand die door Onze Minister voor de categorie van inrichtingen waartoe de desbetreffende inrichting
      behoort, overeenkomstig het vijfde lid is vastgesteld. Het bevoegd gezag betrekt bij zijn oordeel als bedoeld
      in de eerste zin de aard van de in de desbetreffende inrichting toegestane gevaarlijke stoffen en de toegepaste
      maatregelen ter beperking van het plaatsgebonden risico.
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel4
  - number: '4.7'
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld met betrekking tot de afstand die in een geval
      als bedoeld in het zesde lid tot al dan niet geprojecteerde kwetsbare en beperkt kwetsbare objecten in elk geval
      wordt aangehouden.
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel4
  - number: '4.8'
    text: |-
      Indien een aanvraag als bedoeld in het eerste en derde lid betrekking heeft op een inrichting waarop het
      [Besluit risico’s zware ongevallen 2015][ref1] van toepassing is, betrekt het bevoegd gezag bij de beslissing
      op die aanvraag, onverminderd [artikel 2.14, eerste lid, van de Wet algemene bepalingen omgevingsrecht][ref2], de
      gevolgen voor de externe veiligheid die de inrichting veroorzaakt voor personen die gebruikmaken van een hoofdweg
      of landelijke spoorweg als bedoeld in [artikel 1, eerste lid, van de Tracéwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0036791
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0006147#Artikel1
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0036791
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0006147
        artikel: '1'
  - number: '5.1'
    text: |-
      Het bevoegd gezag neemt bij de vaststelling van een besluit als bedoeld in de
      [artikelen 3.1, eerste tot en met derde lid][ref1], [3.6, eerste lid][ref2],
      [3.26, eerste lid][ref3], [3.28, eerste lid][ref4], [4.2, eerste lid][ref5],
      of [4.4, eerste lid, onder a, van de Wet ruimtelijke ordening][ref6] en
      bij het verlenen van een omgevingsvergunning waarbij met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 2° of 3°, van de Wet algemene bepalingen omgevingsrecht][ref7] van het
      bestemmingsplan of de beheersverordening wordt afgeweken dan wel krachtens [artikel 11 van de Woningwet][ref8] van
      de bouwverordening wordt afgeweken, op grond waarvan de bouw of vestiging van kwetsbare objecten wordt toegelaten,
      de grenswaarde, genoemd in [artikel 8, eerste lid][ref9], in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0020449#Artikel4
      [ref6]: https://wetten.overheid.nl/BWBR0020449#Artikel4
      [ref7]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref8]: https://wetten.overheid.nl/BWBR0005181#Artikel11
      [ref9]: https://wetten.overheid.nl/BWBR0016767#Artikel8
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020449
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0020449
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0020449
        artikel: '4'
      - id: ref6
        bwb_id: BWBR0020449
        artikel: '4'
      - id: ref7
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref8
        bwb_id: BWBR0005181
        artikel: '11'
      - id: ref9
        bwb_id: BWBR0016767
        artikel: '8'
        paragraaf: '4'
  - number: '5.2'
    text: |-
      Het bevoegd gezag houdt bij de vaststelling van een besluit als bedoeld in het eerste lid op grond waarvan
      de bouw of vestiging van beperkt kwetsbare objecten wordt toegelaten, rekening met de richtwaarde, genoemd in
      [artikel 8, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel8
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '8'
        paragraaf: '4'
  - number: '5.3'
    text: |-
      Het bevoegd gezag neemt bij de vaststelling van een besluit als bedoeld in het eerste lid, in afwijking van het
      eerste lid, de bij regeling van Onze Minister vastgestelde afstanden tot kwetsbare objecten in acht en houdt
      bij de vaststelling van een besluit als bedoeld in het tweede lid, in afwijking van het tweede lid, rekening
      met de bij die regeling vastgestelde afstanden tot beperkt kwetsbare objecten, indien dat besluit betrekking
      heeft op een gebied dat geheel of gedeeltelijk ligt binnen het invloedsgebied van een inrichting als bedoeld in
      [artikel 4, vijfde lid, onderdelen a tot en met d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel4
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '4'
        paragraaf: '3'
  - number: '5.4'
    text: |-
      Bij regeling van Onze Minister kunnen categorieën van gevallen worden aangewezen waarvoor het plaatsgebonden
      risico, in afwijking van het derde lid, ter voldoening aan de grenswaarde, bedoeld in het eerste lid, of ter
      voldoening aan de richtwaarde, bedoeld in het tweede lid, volgens bij die regeling gestelde regels mag worden
      berekend, indien naar het oordeel van het bevoegd gezag aan die grenswaarde of aan die richtwaarde wordt voldaan
      door het in acht nemen, onderscheidenlijk het zoveel mogelijk in acht nemen, van een kleinere afstand dan de
      afstand die door Onze Minister voor die categorie van gevallen overeenkomstig het derde lid is vastgesteld. Het
      bevoegd gezag betrekt bij zijn oordeel als bedoeld in de eerste zin de aard van de gevaarlijke stoffen die in de
      inrichting die het plaatsgebonden risico veroorzaakt, toegestaan zijn en de toegepaste maatregelen ter beperking
      van dat risico.
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel5
  - number: '5.5'
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld met betrekking tot de afstand die in een geval
      als bedoeld in het vierde lid tot kwetsbare objecten en beperkt kwetsbare objecten in elk geval wordt aangehouden.
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel5
  - number: '5.6'
    text: |-
      De gemeenteraad geeft geen toepassing aan [artikel 3.1, derde lid, van de Wet ruimtelijke ordening][ref1] voor
      zover het bestemmingsplan de bouw of vestiging van kwetsbare objecten of beperkt kwetsbare objecten toelaat ten
      aanzien waarvan niet wordt voldaan aan de grenswaarde of de afstanden, bedoeld in het eerste lid, onderscheidenlijk
      onvoldoende rekening wordt gehouden met de richtwaarde of de afstanden, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
  - number: '5.7'
    text: |-
      Het bevoegd gezag betrekt bij de vaststelling van een tracébesluit als bedoeld in de [Tracéwet][ref1], voor zover
      dat besluit betrekking heeft op de aanleg of wijziging van een hoofdweg of landelijke spoorweg als bedoeld in
      [artikel 1, eerste lid, van die wet][ref2], de gevolgen voor de externe veiligheid die worden veroorzaakt door een
      inrichting waarop het [Besluit risico’s zware ongevallen 2015][ref3] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0006147
      [ref2]: https://wetten.overheid.nl/BWBR0006147#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0036791
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006147
      - id: ref2
        bwb_id: BWBR0006147
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0036791
  - number: '6.1'
    text: |-
      De grenswaarde, bedoeld in [artikel 4, eerste lid][ref1], voor al dan niet geprojecteerde kwetsbare objecten is 10–
      6 per jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel4
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '4'
        paragraaf: '3'
  - number: '6.2'
    text: |-
      De richtwaarde, bedoeld in [artikel 4, tweede lid][ref1], voor al dan niet geprojecteerde beperkt kwetsbare
      objecten is 10–6 per jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel4
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '4'
        paragraaf: '3'
  - number: '7.1'
    text: |-
      De grenswaarde, bedoeld in [artikel 4, derde lid][ref1], voor al dan niet geprojecteerde kwetsbare objecten is 10–6
      per jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel4
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '4'
        paragraaf: '3'
  - number: '7.2'
    text: |-
      De richtwaarde, bedoeld in [artikel 4, vierde lid][ref1], voor al dan niet geprojecteerde beperkt kwetsbare
      objecten is 10–6 per jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel4
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '4'
        paragraaf: '3'
  - number: '8.1'
    text: |-
      De grenswaarde voor kwetsbare objecten in een gebied waarvoor een besluit als bedoeld in
      [artikel 5, eerste lid][ref1], wordt vastgesteld, is 10–6 per jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel5
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '5'
        paragraaf: '3'
  - number: '8.2'
    text: |-
      De richtwaarde voor beperkt kwetsbare objecten in een gebied waarvoor een besluit als bedoeld in
      [artikel 5, tweede lid][ref1], wordt vastgesteld, is 10–6 per jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel5
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '5'
        paragraaf: '3'
  - number: '8.3'
    text: |-
      Indien bij de vaststelling van een besluit als bedoeld in het eerste lid zodanige voorschriften aan
      dat besluit zijn verbonden of op zodanige wijze toepassing is gegeven aan [artikel 2.30][ref1] jo.
      [2.31, eerste en tweede lid, onder b, van de Wet algemene bepalingen omgevingsrecht][ref2], dat binnen drie jaar na
      vaststelling van dat besluit aan de grenswaarde, genoemd in het eerste lid, wordt voldaan, is, in afwijking van dat
      lid, de grenswaarde gedurende die drie jaar 10–5 per jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
  - number: '9'
    text: |-
      [Artikel 5.2, derde lid, eerste zin, van de wet][ref1] is niet van toepassing op de grenswaarden, genoemd in de
      [artikelen 6, eerste lid][ref2], [7, eerste lid][ref3], en [8, eerste en derde lid][ref4], en op de richtwaarden,
      genoemd in de [artikelen 6, tweede lid][ref5], [7, tweede lid][ref6], en [8, tweede lid][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0016767#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0016767#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0016767#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0016767#Artikel6
      [ref6]: https://wetten.overheid.nl/BWBR0016767#Artikel7
      [ref7]: https://wetten.overheid.nl/BWBR0016767#Artikel8
