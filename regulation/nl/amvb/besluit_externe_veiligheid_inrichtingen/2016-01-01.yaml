  - number: '10.2'
    text: |-
      Indien toepassing is gegeven aan [artikel 14][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel14
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '14'
        paragraaf: '6'
  - number: 10.2.a
    text: |-
      draagt het bevoegd gezag, bedoeld in [artikel 4, eerste en derde lid][ref1], in afwijking van het eerste lid,
      ervoor zorg dat bij de vaststelling van een besluit als bedoeld in [artikel 4, eerste en derde lid][ref2], op de
      vastgestelde veiligheidscontour aan de desbetreffende grenswaarde wordt voldaan, en


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0016767#Artikel4
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0016767
        artikel: '4'
        paragraaf: '3'
  - number: 10.2.b
    text: |-
      draagt het bevoegd gezag, bedoeld in artikel 5, eerste en tweede lid, ervoor zorg dat bij de vaststelling van een
      besluit als bedoeld in [artikel 5, eerste en tweede lid][ref1], binnen de veiligheidscontour:


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel5
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '5'
        paragraaf: '3'
  - number: 10.2.b.1
    text: de bouw of vestiging van kwetsbare objecten niet is toegelaten, en
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel10
  - number: 10.2.b.2
    text: |-
      geen mogelijkheden ontstaan voor de bouw of vestiging van beperkt kwetsbare objecten, waar deze mogelijkheden tot
      de vaststelling van het besluit niet bestonden.
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel10
  - number: '10.3'
    text: 'Het tweede lid, onderdeel b, is niet van toepassing op objecten die:'
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel10
  - number: 10.3.1
    text: |-
      een functionele binding hebben met een binnen de veiligheidscontour gelegen inrichting als bedoeld in
      [artikel 2, eerste lid, onderdelen a tot en met h][ref1], of met het gebied waarvoor de veiligheidscontour is
      vastgesteld, of


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel2
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '2'
        paragraaf: '2'
  - number: 10.3.2
    text: |-
      tevens binnen een andere veiligheidscontour zijn gelegen en een functionele binding hebben met een inrichting als
      bedoeld in [artikel 2, eerste lid, onderdelen a tot en met h][ref1], binnen die veiligheidscontour, of met het
      gebied waarvoor die veiligheidscontour is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel2
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '2'
        paragraaf: '2'
  - number: '10.4'
    text: |-
      In een geval als bedoeld in het tweede lid, aanhef en onderdeel a, is
      [artikel 4, eerste tot en met zevende lid][ref1], niet van toepassing op al dan niet geprojecteerde kwetsbare
      objecten, onderscheidenlijk al dan niet geprojecteerde beperkt kwetsbare objecten, binnen de veiligheidscontour en
      in een geval als bedoeld in het tweede lid, aanhef en onderdeel b, is [artikel 5, eerste en tweede lid][ref2], niet
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0016767#Artikel5
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0016767
        artikel: '5'
        paragraaf: '3'
  - number: '11'
    text: |-
      De afstanden tot al dan niet geprojecteerde kwetsbare en beperkt kwetsbare objecten, bedoeld in
      [artikel 4, vijfde lid][ref1], en de afstanden tot kwetsbare en beperkt kwetsbare objecten, bedoeld in
      [artikel 5, derde lid][ref2], worden in acht genomen, onderscheidenlijk zoveel mogelijk in acht genomen, op de bij
      regeling van Onze Minister vastgestelde referentiepunten.


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0016767#Artikel5
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0016767
        artikel: '5'
        paragraaf: '3'
  - number: '12.1'
    text: |-
      Indien het bevoegd gezag een besluit als bedoeld in [artikel 4, eerste tot en met vijfde lid][ref1], vaststelt,
      wordt in de motivering van het desbetreffende besluit in elk geval vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel4
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '4'
        paragraaf: '3'
  - number: 12.1.a
    text: |-
      de aanwezige dichtheid van personen in het invloedsgebied van de desbetreffende inrichting op het tijdstip waarop
      dat besluit wordt vastgesteld;
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel12
  - number: 12.1.b
    text: |-
      het groepsrisico van de inrichting waarop dat besluit betrekking heeft en in een geval als bedoeld in
      [artikel 4, derde lid][ref1], tevens de bijdrage van de verandering van de inrichting aan het totale groepsrisico
      van de inrichting, vergeleken met de kans op een ongeval met 10 of meer dodelijke slachtoffers van ten hoogste 10–5
      per jaar, met de kans op een ongeval met 100 of meer dodelijke slachtoffers van ten hoogste 10–7 per jaar en met de
      kans op een ongeval met 1000 of meer dodelijke slachtoffers van ten hoogste 10–9 per jaar;


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel4
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '4'
        paragraaf: '3'
  - number: 12.1.c
    text: de mogelijkheden en de voorgenomen maatregelen tot beperking van het groepsrisico in de nabije toekomst;
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel12
  - number: 12.1.d
    text: |-
      de mogelijkheden tot voorbereiding van bestrijding en beperking van de omvang van een ramp of zwaar ongeval in de
      inrichting waarop dat besluit betrekking heeft, en
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel12
  - number: 12.1.e
    text: |-
      de mogelijkheden voor personen die zich bevinden in het invloedsgebied van de inrichting waarop dat besluit
      betrekking heeft, om zich in veiligheid te brengen indien zich in die inrichting een ramp of zwaar ongeval
      voordoet.
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel12
  - number: '12.2'
    text: |-
      Alvorens het bevoegd gezag een besluit als bedoeld in het eerste lid vaststelt, voert dat bevoegd gezag overleg
      met burgemeester en wethouders van de gemeenten waarvan het grondgebied geheel of gedeeltelijk ligt binnen het
      invloedsgebied van de desbetreffende inrichting.
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel12
  - number: '12.3'
    text: |-
      Voorafgaand aan de vaststelling van een besluit als bedoeld in het eerste lid stelt het bevoegd gezag, bedoeld
      in het eerste lid, het bestuur van de veiligheidsregio waarin de inrichting ligt waarop dat besluit betrekking
      heeft, in de gelegenheid om in verband met het groepsrisico advies uit te brengen over de mogelijkheden tot
      voorbereiding van bestrijding en beperking van de omvang van een ramp en over de zelfredzaamheid van personen in
      het invloedsgebied van de inrichting.
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel12
  - number: '13.1'
    text: |-
      Indien het bevoegd gezag een besluit vaststelt als bedoeld in [artikel 3.1, eerste tot en met derde lid][ref1],
      [3.26, eerste lid][ref2], of [3.28, eerste lid, van de Wet ruimtelijke ordening][ref3]
      of een omgevingsvergunning verleent waarbij met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 2° of 3°, van de Wet algemene bepalingen omgevingsrecht][ref4] van
      het bestemmingsplan of de beheersverordening wordt afgeweken dan wel krachtens [artikel 11 van de Woningwet][ref5]
      van de bouwverordening wordt afgeweken, op grond waarvan de bouw of vestiging van kwetsbare of beperkt kwetsbare
      objecten wordt toegelaten, wordt in de toelichting bij of in de ruimtelijke onderbouwing van het desbetreffende
      besluit, behoudens het vierde lid, in elk geval vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0005181#Artikel11
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020449
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref5
        bwb_id: BWBR0005181
        artikel: '11'
  - number: 13.1.a
    text: |-
      de aanwezige en de op grond van dat besluit te verwachten dichtheid van personen in het invloedsgebied van de
      inrichting of inrichtingen die het groepsrisico mede veroorzaakt of veroorzaken, voorzover het invloedsgebied ligt
      binnen het gebied waarop dat besluit betrekking heeft, op het tijdstip waarop dat besluit wordt vastgesteld;
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel13
  - number: 13.1.b
    text: |-
      het groepsrisico per inrichting op het tijdstip waarop dat besluit wordt vastgesteld en de bijdrage van de in dat
      besluit toegelaten kwetsbare en beperkt kwetsbare objecten aan de hoogte van het groepsrisico, vergeleken met de
      kans op een ongeval met 10 of meer dodelijke slachtoffers van ten hoogste 10–5 per jaar, met de kans op een ongeval
      met 100 of meer dodelijke slachtoffers van ten hoogste 10–7 per jaar en met de kans op een ongeval met 1000 of meer
      dodelijke slachtoffers van ten hoogste 10–9 per jaar;
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel13
  - number: 13.1.c
    text: |-
      indien mogelijk, de maatregelen ter beperking van het groepsrisico die worden toegepast door degene
      die de inrichting drijft, die dat risico mede veroorzaakt en, indien van toepassing, de voorschriften
      die zijn of worden verbonden aan de voor die inrichting geldende omgevingsvergunning, bedoeld in
      [artikel 2.1, eerste lid, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 13.1.d
    text: indien mogelijk, de maatregelen ter beperking van het groepsrisico die in dat besluit zijn opgenomen;
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel13
  - number: 13.1.e
    text: |-
      de voorschriften ter beperking van het groepsrisico die het bevoegd gezag voornemens is te
      verbinden aan de voor een inrichting, die behoort tot een categorie van inrichtingen ten
      behoeve waarvan dat besluit wordt vastgesteld, te verlenen omgevingsvergunning, bedoeld in
      [artikel 2.1, eerste lid, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 13.1.f
    text: de voor- en nadelen van andere mogelijkheden voor ruimtelijke ontwikkelingen met een lager groepsrisico;
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel13
  - number: 13.1.g
    text: de mogelijkheden en de voorgenomen maatregelen tot beperking van het groepsrisico in de nabije toekomst;
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel13
  - number: 13.1.h
    text: |-
      de mogelijkheden tot voorbereiding van bestrijding en beperking van de omvang van een ramp in de inrichting die het
      groepsrisico veroorzaakt of mede veroorzaakt, waarvan de gevolgen zich uitstrekken buiten die inrichting, en
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel13
  - number: 13.1.i
    text: |-
      de mogelijkheden voor personen die zich bevinden in het invloedsgebied van de inrichting die het groepsrisico
      veroorzaakt of mede veroorzaakt, om zich in veiligheid te brengen indien zich in die inrichting een ramp voordoet.
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel13
  - number: '13.2'
    text: |-
      Alvorens het bevoegd gezag een besluit als bedoeld in het eerste lid vaststelt, voert dat bevoegd gezag overleg
      met het bestuursorgaan dat bevoegd is tot het verlenen van een omgevingsvergunning voor een inrichting die mede
      bepalend is voor de hoogte van het groepsrisico in het gebied waarop dat besluit betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel13
  - number: '13.3'
    text: |-
      Voorafgaand aan de vaststelling van een besluit als bedoeld in het eerste lid stelt het bevoegd gezag, bedoeld in
      het eerste lid, het bestuur van de veiligheidsregio waarin het gebied ligt waarop dat besluit betrekking heeft, in
      de gelegenheid om in verband met het groepsrisico advies uit te brengen over de mogelijkheden tot voorbereiding van
      bestrijding en beperking van de omvang van een ramp en over de zelfredzaamheid van personen in het invloedsgebied
      van de inrichting.
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel13
  - number: '13.4'
    text: |-
      In afwijking van het eerste lid kan het bevoegd gezag in de toelichting bij of in de ruimtelijke onderbouwing
      van een besluit als bedoeld in het eerste lid, verwijzen naar een gemeentelijke, regionale of provinciale
      structuurvisie als bedoeld in de [Wet ruimtelijke ordening][ref1], indien in die structuurvisie een samenhangende
      visie is opgenomen over de gewenste planologische ontwikkeling van een breder gebied in relatie tot voorkoming of
      bestrijding van een ramp en in die structuurvisie ten minste aandacht is besteed aan de onderwerpen, bedoeld in het
      eerste lid, onderdelen f tot en met i.


      [ref1]: https://wetten.overheid.nl/BWBR0020449
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020449
  - number: '14.1'
    text: |-
      Het bevoegd gezag, bedoeld in [artikel 4, eerste tot en met vierde lid][ref1], kan in overeenstemming
      met het bevoegd gezag, bedoeld in [artikel 5, eerste en tweede lid][ref2], voor inrichtingen
      als bedoeld in [artikel 2, eerste lid, onderdelen a tot en met h][ref3], of voor een gebied
      waarin die inrichtingen zijn gelegen, de ligging van de veiligheidscontour vaststellen waar het
      plaatsgebonden risico op het tijdstip van vaststelling van die contour, op grond van de krachtens
      [artikel 2.1, eerste lid, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref4] voor de
      desbetreffende inrichting of de desbetreffende afzonderlijke inrichtingen geldende omgevingsvergunning, ten hoogste
      10–6 is.


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0016767#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0016767#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0016767
        artikel: '5'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0016767
        artikel: '2'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0024779
        artikel: '2'
  - number: '14.2'
    text: |-
      De berekening van het plaatsgebonden risico, bedoeld in het eerste lid, wordt uitgevoerd volgens bij regeling van
      Onze Minister gestelde regels.
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel14
  - number: '14.3'
    text: 'Bij de vaststelling van een veiligheidscontour als bedoeld in het eerste lid kunnen worden betrokken:'
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel14
  - number: 14.3.a
    text: |-
      de met betrekking tot de desbetreffende inrichting en het gebied waarin die inrichting is gelegen, redelijkerwijs
      te verwachten ontwikkelingen die van belang zijn met het oog op de externe veiligheid;
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel14
  - number: 14.3.b
    text: de mogelijke cumulatie van het plaatsgebonden risico in verband met de aanwezigheid van andere inrichtingen, en
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel14
  - number: 14.3.c
    text: de mogelijkheden om het groepsrisico zoveel mogelijk te beperken.
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel14
  - number: '14.4'
    text: |-
      Indien toepassing wordt gegeven aan het eerste of derde lid, wordt de veiligheidscontour zodanig vastgesteld dat
      binnen die contour, voor zover het kwetsbare objecten betreft, uitsluitend kwetsbare objecten die een functionele
      binding hebben met een inrichting als bedoeld in [artikel 2, eerste lid, onderdelen a tot en met h][ref1],
      of met het gebied waarvoor de veiligheidscontour wordt vastgesteld, aanwezig of geprojecteerd zijn. De
      eerste volzin geldt niet met betrekking tot kwetsbare objecten binnen de veiligheidscontour die tevens zijn
      gelegen in een andere veiligheidscontour en een functionele binding hebben met een inrichting als bedoeld in
      [artikel 2, eerste lid, onderdelen a tot en met h][ref2], binnen die veiligheidscontour, of met het gebied waarvoor
      die veiligheidscontour is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0016767#Artikel2
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0016767
        artikel: '2'
        paragraaf: '2'
  - number: '14.5'
    text: |-
      Op de voorbereiding van een besluit tot vaststelling van de veiligheidscontour, bedoeld in het eerste lid, is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '14.6'
    text: |-
      Degene die een inrichting drijft binnen het gebied waarvoor het bevoegd gezag, bedoeld in het eerste lid,
      voornemens is toepassing te geven aan het eerste lid, verstrekt op verzoek van dat bevoegd gezag de gegevens
      benodigd voor de vaststelling van de veiligheidscontour, met dien verstande dat geen gegevens hoeven te worden
      verstrekt indien daarvoor berekeningen nodig zijn.
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel14
  - number: '14.7'
    text: Het zesde lid blijft buiten toepassing indien de gegevens eerder aan het bevoegd gezag zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel14
  - number: '14.8'
    text: |-
      Het verzoek van het bevoegd gezag, bedoeld in het zesde lid, wordt schriftelijk gedaan en vermeldt een termijn van
      ten hoogste drie maanden waarbinnen aan dat verzoek wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel14
  - number: '15.1'
    text: |-
      Het bevoegd gezag draagt bij de vaststelling van een besluit als bedoeld in
      [artikel 4, eerste tot en met vierde lid][ref1], ervoor zorg dat dat besluit steunt op een berekening van het
      plaatsgebonden risico en het groepsrisico, die is uitgevoerd volgens bij regeling van Onze Minister gestelde
      regels, indien dat besluit betrekking heeft op:


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel4
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '4'
        paragraaf: '3'
  - number: 15.1.a
    text: |-
      een inrichting als bedoeld in [artikel 2, eerste lid, onderdelen a tot en met d][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel2
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '2'
        paragraaf: '2'
  - number: 15.1.b
    text: |-
      een inrichting als bedoeld in [artikel 2, eerste lid, onderdeel f][ref1], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel2
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '2'
        paragraaf: '2'
  - number: 15.1.b.1°
    text: |-
      tot de inrichting een of meer opslagvoorzieningen voor de opslag van stoffen als bedoeld in
      [artikel 2, eerste lid, onderdeel f][ref1], behoren met een vloeroppervlak van meer dan 2500 m2, of


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel2
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '2'
        paragraaf: '2'
  - number: 15.1.b.2°
    text: |-
      in die inrichting gevaarlijke stoffen of preparaten die bij of krachtens het
      [Besluit verpakking en aanduiding milieugevaarlijke stoffen en preparaten][ref1] zijn ingedeeld als zeer vergiftig,
      of gevaarlijke stoffen van ADR klasse 6.1, verpakkingsgroep I, in verpakkingseenheden van meer dan 100 kg, in de
      open lucht worden gelost en geladen, of


      [ref1]: https://wetten.overheid.nl/BWBR0004220
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004220
  - number: 15.1.c
    text: |-
      een inrichting waarin een koel- of vriesinstallatie aanwezig is als bedoeld in
      [artikel 2, eerste lid, onderdeel g][ref1], met een inhoud van 10.000 kg ammoniak of meer, of waarvan de diameter
      van de vloeistofleiding naar de verdamper meer dan 80 DN bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel2
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '2'
        paragraaf: '2'
  - number: '15.2'
    text: |-
      Het bevoegd gezag, bedoeld in het eerste lid, maakt geen gebruik van gegevens met betrekking tot het plaatsgebonden
      risico en het groepsrisico die aan hem zijn verstrekt door degene die de inrichting drijft, indien die gegevens
      meer dan vijf jaar voor het tijdstip van de vaststelling van een besluit als bedoeld in het eerste lid voor de
      laatste maal zijn geactualiseerd.
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel15
  - number: '16'
    text: |-
      [Artikel 15][ref1] is van overeenkomstige toepassing op een besluit als bedoeld in
      [artikel 5, eerste en tweede lid][ref2], dat betrekking heeft op een gebied dat geheel of gedeeltelijk ligt binnen
      het invloedsgebied van een inrichting als bedoeld in artikel 15, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0016767#Artikel5
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '15'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0016767
        artikel: '5'
        paragraaf: '3'
  - number: '17.1'
    text: |-
      Indien op het tijdstip van inwerkingtreding van dit besluit het plaatsgebonden risico voor een kwetsbaar object,
      veroorzaakt door een inrichting als bedoeld in [artikel 15, eerste lid][ref1], hoger is dan 10–5 per jaar, draagt
      het bevoegd gezag, bedoeld in de [artikelen 4][ref2] en [5][ref3], ervoor zorg dat binnen drie jaar na dat
      tijdstip het plaatsgebonden risico die grenswaarde niet meer overschrijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0016767#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0016767#Artikel5
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '15'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0016767
        artikel: '4'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0016767
        artikel: '5'
        paragraaf: '3'
  - number: '17.2'
    text: |-
      Indien op het tijdstip van inwerkingtreding van dit besluit de afstand van een inrichting als bedoeld in
      [artikel 4, vijfde lid, onderdelen a tot en met d][ref1], tot een kwetsbaar object kleiner is dan de bij regeling
      van Onze Minister vastgestelde afstand tot kwetsbare objecten, draagt het bevoegd gezag, bedoeld in de artikelen 4
      en [5][ref2], ervoor zorg dat binnen drie jaar na dat tijdstip wordt voldaan aan de bij die regeling vastgestelde
      afstand.


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0016767#Artikel5
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0016767
        artikel: '5'
        paragraaf: '3'
  - number: '17.3'
    text: |-
      Het eerste en tweede lid zijn van toepassing op een op het tijdstip van inwerkingtreding van dit besluit
      geprojecteerd kwetsbaar object, met dien verstande dat de termijn, genoemd in het eerste en tweede
      lid, aanvangt op het tijdstip waarop een voor dat object verleende omgevingsvergunning als bedoeld in
      [artikel 2.1, eerste lid, aanhef en onder a, van de Wet algemene bepalingen omgevingsrecht][ref1] onherroepelijk
      is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: '17.4'
    text: |-
      In de gevallen, bedoeld in het eerste lid en derde lid, voorzover het derde lid betrekking heeft op het eerste lid,
      wordt het plaatsgebonden risico berekend volgens bij regeling van Onze Minister gestelde regels.
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel17
  - number: '17.5'
    text: |-
      [Artikel 10, eerste lid][ref1], is van overeenkomstige toepassing op de grenswaarde, genoemd in het eerste lid, en
      bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel10
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '10'
        paragraaf: '4'
  - number: '17.6'
    text: |-
      [Artikel 11][ref1] is van overeenkomstige toepassing op de bij regeling van Onze Minister vastgestelde afstanden,
      bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel11
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '11'
        paragraaf: '4'
  - number: '17.7'
    text: |-
      Dit artikel is niet van toepassing op een kwetsbaar object binnen een gebied waarvoor overeenkomstig
      [artikel 14][ref1] een veiligheidscontour is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel14
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '14'
        paragraaf: '6'
  - number: '18.1'
    text: |-
      Onverminderd [artikel 17, eerste lid][ref1], draagt het bevoegd gezag, bedoeld in de [artikelen 4][ref2]
      en [5][ref3], indien het plaatsgebonden risico wordt veroorzaakt door een inrichting als bedoeld in
      [artikel 15, eerste lid][ref4], ervoor zorg dat ten aanzien van een kwetsbaar object op het tijdstip van
      inwerkingtreding van dit besluit zo spoedig mogelijk na dat tijdstip doch uiterlijk 1 januari 2010 wordt voldaan
      aan de grenswaarde 10–6 per jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0016767#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0016767#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0016767#Artikel15
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '17'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0016767
        artikel: '4'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0016767
        artikel: '5'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0016767
        artikel: '15'
        paragraaf: '6'
  - number: '18.2'
    text: |-
      Indien op het tijdstip van inwerkingtreding van dit besluit de afstand van een inrichting als bedoeld in
      [artikel 4, vijfde lid, onderdelen a tot en met d][ref1], tot een kwetsbaar object kleiner is dan de bij regeling
      van Onze Minister vastgestelde afstand tot kwetsbare objecten, draagt het bevoegd gezag, bedoeld in de artikelen
      4 en [5][ref2], onverminderd [artikel 17, tweede lid][ref3], ervoor zorg dat zo spoedig mogelijk na dat tijdstip
      doch uiterlijk 1 januari 2010 wordt voldaan aan de bij die regeling vastgestelde afstand.


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0016767#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0016767#Artikel17
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0016767
        artikel: '5'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0016767
        artikel: '17'
        paragraaf: '7'
  - number: '18.3'
    text: |-
      Onverminderd [artikel 17, derde lid][ref1], zijn het eerste en tweede lid van toepassing op een op het tijdstip van
      inwerkingtreding van dit besluit geprojecteerd kwetsbaar object, met dien verstande dat de verplichting, bedoeld
      in het eerste en tweede lid, geldt vanaf het tijdstip waarop een voor dat object verleende omgevingsvergunning
      als bedoeld in [artikel 2.1, eerste lid, aanhef en onder a, van de Wet algemene bepalingen omgevingsrecht][ref2]
      onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '17'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '2'
  - number: '18.4'
    text: |-
      In de gevallen, bedoeld in het eerste lid en derde lid, voorzover het derde lid betrekking heeft op het eerste lid,
      wordt het plaatsgebonden risico berekend volgens bij regeling van Onze Minister gestelde regels.
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel18
  - number: '18.5'
    text: |-
      [Artikel 10, eerste lid][ref1], is van overeenkomstige toepassing op de grenswaarde, genoemd in het eerste lid, en
      bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel10
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '10'
        paragraaf: '4'
  - number: '18.6'
    text: |-
      [Artikel 11][ref1] is van overeenkomstige toepassing op de bij regeling van Onze Minister vastgestelde afstanden,
      bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel11
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '11'
        paragraaf: '4'
  - number: '18.7'
    text: |-
      Dit artikel is niet van toepassing op een kwetsbaar object binnen een gebied waarvoor overeenkomstig
      [artikel 14][ref1] een veiligheidscontour is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel14
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '14'
        paragraaf: '6'
  - number: '19'
    text: |-
      Het bevoegd gezag, bedoeld in [artikel 4, eerste tot en met vierde lid][ref1], stelt na overleg met
      het bevoegd gezag, bedoeld in [artikel 5, eerste en tweede lid][ref2], een programma vast waarin
      is aangegeven op welke wijze uitvoering wordt gegeven aan [artikel 18, eerste en tweede lid][ref3],
      en, voorzover aannemelijk is dat voor 1 januari 2010 een vergunning als bedoeld in
      [artikel 2.1, eerste lid, aanhef en onder a, van de Wet algemene bepalingen omgevingsrecht][ref4] wordt verleend,
      aan [artikel 18, derde lid][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0016767#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0016767#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0016767#Artikel18
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0016767
        artikel: '5'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0016767
        artikel: '18'
        paragraaf: '7'
      - id: ref4
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref5
        bwb_id: BWBR0016767
        artikel: '18'
        paragraaf: '7'
  - number: '20.1'
    text: |-
      Indien op grond van een gewijzigd inzicht met betrekking tot het plaatsgebonden risico blijkt dat het door een
      inrichting als bedoeld in [artikel 2, eerste lid, onderdelen a tot en met h][ref1], veroorzaakte plaatsgebonden
      risico voor een al dan niet geprojecteerd kwetsbaar object hoger is dan 10–6 per jaar en dat inzicht leidt
      tot bij regeling van Onze Minister te stellen nadere regels met betrekking tot de vaststelling van dat risico,
      draagt het bevoegd gezag, bedoeld in de [artikelen 4][ref2] en [5][ref3], ervoor zorg dat, in afwijking van
      [artikel 18][ref4], binnen vijf jaar na het tijdstip van inwerkingtreding van die regels, het plaatsgebonden risico
      de desbetreffende grenswaarde niet meer overschrijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0016767#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0016767#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0016767#Artikel18
