  - number: '3.1'
    text: |-
      Dit besluit is niet van toepassing op de besluiten, bedoeld in [artikel 4, eerste tot en met vierde lid][ref1], met
      betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel4
