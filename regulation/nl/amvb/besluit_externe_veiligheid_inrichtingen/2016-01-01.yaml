        bwb_id: BWBR0016767
        artikel: '6'
        paragraaf: '4'
  - number: '4.3'
    text: |-
      Het bevoegd gezag neemt bij de beslissing op een aanvraag om een omgevingsvergunning voor
      een activiteit als bedoeld in [artikel 2.1, eerste lid, onder e, onder 2°][ref1], en
      [2.6 van de Wet algemene bepalingen omgevingsrecht][ref2], indien de aanvraag betrekking heeft op een
      verandering die nadelige gevolgen heeft voor het plaatsgebonden risico, de grenswaarden, genoemd in de
      [artikelen 7, eerste lid][ref3], en [24, eerste lid][ref4], in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0016767#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0016767#Artikel24
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
