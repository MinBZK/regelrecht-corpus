      stoffen geladen voorwerpen, niet zijnde consumentenvuurwerk, professioneel vuurwerk of pyrotechnische
      artikelen voor theatergebruik als bedoeld in het [Vuurwerkbesluit][ref1], tenzij op die inrichting het
      [Besluit risico’s zware ongevallen 2015][ref2] van toepassing is.


