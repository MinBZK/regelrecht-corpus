      [artikelen 4][ref1] en [5][ref2], ervoor zorg dat op het tijdstip, bedoeld in dat onderdeel, voor het bij regeling
      van Onze Minister aangewezen gebied wordt voldaan aan de grenswaarde, genoemd in [artikel 18, eerste lid][ref3], en
      bedoeld in [artikel 18, derde lid][ref4], of aan de afstanden, bedoeld in [artikel 18, tweede lid][ref5].


