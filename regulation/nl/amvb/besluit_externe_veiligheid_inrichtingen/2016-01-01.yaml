      Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel26
  - number: '26.2'
    text: |-
      Indien het tijdstip waarop [artikel 18][ref1] voor een categorie van inrichtingen als bedoeld in
      [artikel 2, eerste lid, onderdelen b tot en met h][ref2], in werking treedt, ertoe leidt dat het redelijkerwijs
      niet mogelijk is om met betrekking tot een tot die categorie behorende inrichting voor 1 januari 2010 aan
      [artikel 18, eerste of tweede lid][ref3], te voldoen, wordt in [artikel 18, eerste en tweede lid][ref4], «1 januari
      2010» telkens vervangen door: binnen vijf jaar na het tijdstip waarop [artikel 18][ref5] met betrekking tot de
      desbetreffende inrichting in werking is getreden,.


