  - number: '4.1'
    text: |-
      Het bevoegd gezag neemt bij de beslissing op een aanvraag om een omgevingsvergunning voor een activiteit als
      bedoeld in [artikel 2.1, eerste lid, onder e, onder 1°, van de Wet algemene bepalingen omgevingsrecht][ref1] de
      grenswaarde, genoemd in [artikel 6, eerste lid][ref2], in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0016767#Artikel6
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel4
