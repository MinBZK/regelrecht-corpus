  - number: '23'
    text: |-
      Een regeling van Onze Minister als bedoeld in dit besluit wordt vastgesteld in overeenstemming met Onze ministers
      die het mede aangaat.
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel23
  - number: '24.1'
    text: |-
      Indien voor een inrichting voor het tijdstip van inwerkingtreding van dit besluit een vergunning
      als bedoeld in [artikel 8.1, eerste lid][ref1], of [artikel 8.1, tweede lid][ref2], juncto
      [artikel 8.1, eerste lid, van de wet][ref3] is verleend, is, in afwijking van [artikel 7, eerste lid][ref4], de
      grenswaarde, bedoeld in [artikel 4, derde lid][ref5], voor al dan niet geprojecteerde kwetsbare objecten zoveel
      hoger als overeenkomt met de waarde die gelijk is aan het plaatsgebonden risico dat door de desbetreffende
      inrichting op het tijdstip van de aanvraag om een vergunning werd veroorzaakt, met dien verstande dat die waarde
      niet hoger is dan 10–5 per jaar. Indien de waarde, bedoeld in de eerste zin, hoger is dan of gelijk aan 10–5 per
      jaar, dan is de grenswaarde, bedoeld in [artikel 4, derde lid][ref6], 10–5 per jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
