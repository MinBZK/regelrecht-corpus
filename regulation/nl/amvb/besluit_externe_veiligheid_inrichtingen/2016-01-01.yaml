  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 5 februari 2003,
    nr. MJZ2003008449, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Gelet op artikel 12 van richtlijn nr. 96/82/EG van de Raad van de Europese Unie van 9 december 1996 betreffende
    de beheersing van de gevaren van zware ongevallen waarbij gevaarlijke stoffen zijn betrokken (PbEG L 10), zoals
    deze is gewijzigd bij richtlijn nr. 2003/105/EG van het Europees Parlement en de Raad van de Europese Unie van 16
    december 2003 (PbEG L 345);

    Gelet op de artikelen 5.1, eerste en vierde lid, 5.2, eerste lid, 5.3, eerste en tweede lid, 8.7, eerste lid, 8.44
    en 21.8 van de Wet milieubeheer en 19a, twaalfde lid, en 36 van de Wet op de Ruimtelijke Ordening;

    De Raad van State gehoord (advies van 8 juli 2003, nr. W08.03.0060/V);

    Gezien het nader rapport van de Staatssecretaris van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 19
    mei 2004, nr. MJZ2004049663, Centrale Directie Juridische Zaken, Afdeling Wetgeving;

    Hebben goedgevonden en verstaan:
