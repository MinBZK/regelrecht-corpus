        artikel: '18'
        paragraaf: '7'
  - number: 22.1.b
    text: |-
      in afwijking van [artikel 18, eerste lid][ref1], een grenswaarde geldt die gelijk is aan de waarde voor het
      plaatsgebonden risico voor een kwetsbaar object, die aanwezig is op het tijdstip waarop de aanwijzing plaatsvindt,
      of


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel18
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel22
    references:
