  - number: '21'
    text: |-
      Onze Minister geeft voor 1 januari 2009 aan of de bij dit besluit gestelde grens- en richtwaarden herziening
      behoeven.
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel21
  - number: '22.1'
    text: 'Bij regeling van Onze Minister kunnen gebieden worden aangewezen waarvoor:'
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel22
  - number: 22.1.a
    text: |-
      op een later tijdstip dan genoemd in [artikel 18, eerste en tweede lid][ref1], wordt voldaan aan de grenswaarde,
      genoemd in [artikel 18, eerste lid][ref2], en bedoeld in [artikel 18, derde lid][ref3], of aan de afstanden,
      bedoeld in [artikel 18, tweede lid][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0016767#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0016767#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0016767#Artikel18
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel22
