  - number: '20.2'
    text: |-
      [Artikel 10, eerste lid][ref1], is van overeenkomstige toepassing op de grenswaarden, genoemd in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel10
