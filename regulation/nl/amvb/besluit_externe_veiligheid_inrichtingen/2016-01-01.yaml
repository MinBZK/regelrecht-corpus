        artikel: '8'
        paragraaf: '4'
  - number: '10.1'
    text: |-
      De grenswaarden, genoemd in de [artikelen 6, eerste lid][ref1], [7, eerste lid][ref2],
      [8, eerste en derde lid][ref3], en [24, eerste lid][ref4], en de richtwaarden, genoemd in de
      [artikelen 6, tweede lid][ref5], [7, tweede lid][ref6], en [8, tweede lid][ref7], worden in acht genomen,
      onderscheidenlijk zoveel mogelijk in acht genomen, op de bij regeling van Onze Minister vastgestelde
      referentiepunten.


      [ref1]: https://wetten.overheid.nl/BWBR0016767#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0016767#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0016767#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0016767#Artikel24
      [ref5]: https://wetten.overheid.nl/BWBR0016767#Artikel6
      [ref6]: https://wetten.overheid.nl/BWBR0016767#Artikel7
      [ref7]: https://wetten.overheid.nl/BWBR0016767#Artikel8
    url: https://wetten.overheid.nl/BWBR0016767/2016-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0016767
        artikel: '6'
