articles:
  - number: X
    text: |-
      Dit besluit treedt in werking met ingang van 1 januari 2013, met uitzondering van:

      a. [artikel VI, onderdeel B, onder 7][ref1], dat in werking treedt met ingang van 1 april 2013;

      b. [artikel I, onderdelen BB, II en JJ][ref2], en de [artikelen IV][ref3] en [V, onderdelen H, I, J en L][ref4],
      die in werking treden met ingang van 1 juli 2013;

      c. [artikel I, onderdeel E][ref5], dat in werking treedt op een bij koninklijk besluit te bepalen tijdstip;

      d. [artikel VIII][ref6], dat, indien het bij koninklijke boodschap van 19 april 2012 ingediende voorstel van wet
      tot wijziging van de Wet ter voorkoming van witwassen en financieren van terrorisme en de Wet ter voorkoming van
      witwassen en financieren van terrorisme BES in verband met de implementatie van aanbevelingen van de Financial
      Action Task Force () tot wet is of wordt verheven, in werking treedt op het tijdstip waarop artikel I van die wet
      in werking treedt.


