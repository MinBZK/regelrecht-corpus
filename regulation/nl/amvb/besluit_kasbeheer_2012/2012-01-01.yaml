preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Financiën van 9 mei 2011, nr. BZ/2011/319M, Directoraat-Generaal van de
    Rijksbegroting, Directie Begrotingszaken;

    Gelet op artikel 37, aanhef onder b van de Comptabiliteitswet 2001;

    Gezien het advies van de Algemene Rekenkamer van 21 maart 2011, nr. 11001164 R;

    De Afdeling advisering van de Raad van State gehoord (advies van 8 juni 2011, no. W06.11.0176/III);

    Gezien het nader rapport van Onze Minister van Financiën van 6 september 2011, nr. BZ/2011/422U;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0030604/2012-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In dit besluit wordt verstaan onder: - *kasbeheer:* de zorg voor: 1. de vorderingen van het Rijk; 2. de betalingen
      van het Rijk; 3. het geld en de geldswaardige papieren bij het Rijk; 4. het administreren van de beheershandelingen
      die volgen uit de onderdelen 1., 2. en 3.
        - *Onze Minister:* Onze Minister van Financiën;
    url: https://wetten.overheid.nl/BWBR0030604/2012-01-01#Artikel1
  - number: '1.2'
    text: 'Tot de geldswaardige papieren worden gerekend:'
    url: https://wetten.overheid.nl/BWBR0030604/2012-01-01#Artikel1
  - number: 1.2.a
    text: |-
      financiële instrumenten als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0030604/2012-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 1.2.b
    text: bankpassen, creditkaarten en contantgeldkaarten;
    url: https://wetten.overheid.nl/BWBR0030604/2012-01-01#Artikel1
  - number: 1.2.c
    text: andere door Onze Minister aan te wijzen papieren of stukken.
    url: https://wetten.overheid.nl/BWBR0030604/2012-01-01#Artikel1
  - number: '2'
    text: |-
      Onze Ministers dragen zorg voor een adequate administratieve organisatie waarin is voorzien in voldoende interne
      beheersingsmaatregelen en functiescheiding voor het kasbeheer.
    url: https://wetten.overheid.nl/BWBR0030604/2012-01-01#Artikel2
  - number: '3.1'
    text: Onze Minister voert het kasbeleid van het Rijk.
    url: https://wetten.overheid.nl/BWBR0030604/2012-01-01#Artikel3
  - number: '3.2'
    text: Onze Minister kan nadere regels stellen met betrekking tot het kasbeheer.
    url: https://wetten.overheid.nl/BWBR0030604/2012-01-01#Artikel3
  - number: '3.3'
    text: Onze Minister kan Onze overige Ministers aanwijzingen geven met betrekking tot het kasbeheer.
    url: https://wetten.overheid.nl/BWBR0030604/2012-01-01#Artikel3
  - number: '3.4'
    text: Onze Minister draagt de zorg voor de bewaring van de aan het Rijk toebehorende en toevertrouwde effecten.
    url: https://wetten.overheid.nl/BWBR0030604/2012-01-01#Artikel3
  - number: '4.1'
    text: Onze Minister bepaalt bij welke bankinstellingen het Rijk bankrekeningen aanhoudt.
    url: https://wetten.overheid.nl/BWBR0030604/2012-01-01#Artikel4
  - number: '4.2'
    text: Onze Minister sluit namens het Rijk overeenkomsten met de bankinstellingen waar het Rijk bankrekeningen aanhoudt.
    url: https://wetten.overheid.nl/BWBR0030604/2012-01-01#Artikel4
  - number: '4.3'
    text: |-
      Onze Ministers houden bij bankinstellingen bankrekeningen aan die in euro’s luiden, met dien verstande dat zij bij
      bankinstellingen in de openbare lichamen Bonaire, Sint Eustatius en Saba rekeningen mogen aanhouden die luiden in
      de munteenheid van die openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0030604/2012-01-01#Artikel4
  - number: '4.4'
    text: |-
      Onze Ministers vragen de instemming van Onze Minister voor het aanhouden van bankrekeningen die luiden in andere
      valuta dan in euro's. Aan het verlenen van zijn instemming kan Onze Minister voorwaarden verbinden.
    url: https://wetten.overheid.nl/BWBR0030604/2012-01-01#Artikel4
  - number: '5.1'
    text: |-
      Het [Besluit kasbeheer 1998][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0009347
    url: https://wetten.overheid.nl/BWBR0030604/2012-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009347
  - number: '5.2'
    text: |-
      Besluiten en overeenkomsten die tot stand zijn gekomen op grond van
      [artikel 8 van het Besluit kasbeheer 1998][ref1], behouden hun werking, tenzij zij op grond van dit besluit worden
      vervangen.


      [ref1]: https://wetten.overheid.nl/BWBR0009347#Artikel8
    url: https://wetten.overheid.nl/BWBR0030604/2012-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009347
        artikel: '8'
  - number: '5.3'
    text: Dit besluit treedt in werking met ingang van 1 januari 2012.
    url: https://wetten.overheid.nl/BWBR0030604/2012-01-01#Artikel5
  - number: '5.4'
    text: Dit besluit wordt aangehaald als «Besluit kasbeheer 2012».
    url: https://wetten.overheid.nl/BWBR0030604/2012-01-01#Artikel5
