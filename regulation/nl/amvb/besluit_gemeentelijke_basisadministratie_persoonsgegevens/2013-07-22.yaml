  - number: '78'
    text: |-
      De verantwoordelijke voor de verwerking van gegevens in het vestigingsregister kan weigeren aan een
      buitengemeentelijke afnemer op systematische wijze gegevens uit het vestigingsregister te verstrekken op een andere
      wijze dan bedoeld in [artikel 77][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006933#Artikel77
