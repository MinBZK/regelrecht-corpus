  - number: 68c
    text: |-
      1 Bijzondere derde als bedoeld in [artikel 99, tweede lid, van de wet][ref1] is de Stichting Interkerkelijke Leden-
      Administratie, voor zover de behoefte van de stichting aan gegevens uit de basisadministraties haar grond vindt in
      de verwerking van persoonsgegevens als bedoeld in de [Wet bescherming persoonsgegevens][ref2] betreffende de leden
      van de kerkgenootschappen en andere genootschappen op geestelijke grondslag, die gebruik maken van de in het tweede
      lid, onderdeel *a*, bedoelde faciliteiten.

      2 Onze Minister maakt ten aanzien van de bijzondere derde, genoemd in het eerste lid, slechts gebruik van de in
      [artikel 68a][ref3] bedoelde bevoegdheid indien:

      a. de bijzondere derde haar faciliteiten waarmee kerkgenootschappen of andere genootschappen op geestelijke
      grondslag in staat worden gesteld hun ledenadministraties met behulp van gegevens uit de basisadministraties bij
      te houden, op gelijke voet ter beschikking stelt aan ieder kerkgenootschap of ander genootschap op geestelijke
      grondslag, dat van die faciliteiten gebruik wenst te maken;

      b. de kerkgenootschappen en andere genootschappen op geestelijke grondslag die gebruik maken van de in onderdeel
      *a* bedoelde faciliteiten, op gelijke voet deel uit kunnen maken van de organen van de bijzondere derde indien zij
      daartoe de wens uiten;

      c. in de statuten van de bijzondere derde de in de onderdelen *a* en *b* genoemde voorwaarden zijn vastgelegd; en

      d. een zodanig aantal kerkgenootschappen of andere genootschappen op geestelijke grondslag gebruik maakt van de
      in onderdeel *a* bedoelde faciliteiten van de bijzondere derde, dat de ten behoeve van de gegevensverstrekking aan
      de bijzondere derde te plaatsen codering op de persoonslijst van een ingeschrevene niet is te herleiden tot het
      kerkgenootschap of ander genootschap op geestelijke grondslag, waartoe de ingeschrevene behoort.

      3 Onze Minister beperkt zich bij de bepaling van de algemene gegevens en de verwijsgegevens
      die worden verstrekt aan de bijzondere derde, bedoeld in het eerste lid, tot de gegevens die in
      [artikel 99, tweede lid, van de wet][ref4] zijn omschreven.


