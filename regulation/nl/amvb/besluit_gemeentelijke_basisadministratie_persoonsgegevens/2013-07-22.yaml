  - number: 68d1
    text: |-
      1 Bijzondere derden als bedoeld in [artikel 99, vijfde lid, van de wet][ref1] zijn:

      a. de Stichting Bureau Krediet Registratie;

      b. de Stichting Landelijk Informatiesysteem Schulden,

      voor zover de behoefte van deze stichtingen aan gegevens uit de basisadministratie haar grond vindt in de
      verwerking van persoonsgegevens met het oog op de verificatie van de identiteit van een betrokkene bij het aangaan
      van nieuwe financiële verplichtingen of een traject van schuldhulpverlening.

      2 Onze Minister maakt ten aanzien van een bijzondere derde als bedoeld in het eerste lid, slechts gebruik van de in
      [artikel 68a][ref2] bedoelde bevoegdheid indien de bijzondere derde ten aanzien van de verwerking, bedoeld in het
      eerste lid, een regeling heeft getroffen ter bescherming van de persoonlijke levenssfeer.

      3 Onze Minister beperkt zich bij de bepaling van de algemene en de verwijsgegevens die worden verstrekt aan een
      bijzondere derde als bedoeld in het eerste lid, tot de gegevens betreffende de naam, de geboortedatum en het adres.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0006933#Artikel68a
