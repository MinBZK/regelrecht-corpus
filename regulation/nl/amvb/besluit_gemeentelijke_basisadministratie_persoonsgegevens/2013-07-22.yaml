  - number: 63a
    text: |-
      Op de persoonslijst van een ingeschreven vreemdeling die geen ingezetene is in verband met het vertrek uit
      Nederland, worden nieuwe algemene gegevens over het verblijfsrecht opgenomen betreffende feiten die zich hebben
      voorgedaan in de tijd dat hij geen ingezetene meer is.
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel63a
  - number: 63b
    text: |-
      Aan de in [artikel 113, eerste lid, onder b, van de wet][ref1] bedoelde mededeling van een verantwoordelijke
      voor de verwerking van gegevens in de basisadministratie in Aruba, Curaçao, Sint Maarten of een van de openbare
      lichamen, worden de noodzakelijke gegevens ontleend voor de inschrijving als ingezetene in de basisadministratie.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel113
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel63b
