        afdeling: '4'
  - number: '35'
    text: |-
      De buitengemeentelijke afnemer stelt Onze Minister op de hoogte van voorvallen die optreden bij de verzending en de
      ontvangst van berichten, bedoeld in de [artikelen 32][ref1] en [33][ref2], voor zover de voorvallen op grond van de
      systeembeschrijving voor melding in aanmerking komen.


      [ref1]: https://wetten.overheid.nl/BWBR0006933#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0006933#Artikel33
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel35
