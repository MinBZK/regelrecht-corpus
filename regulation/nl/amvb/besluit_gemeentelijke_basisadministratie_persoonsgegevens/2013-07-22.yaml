        artikel: '99'
  - number: '90'
    text: |-
      Onze Minister kan, in overeenstemming met Onze Minister van Financiën, regels stellen omtrent de uitwisseling van
      gegevens tussen een afnemer of een bijzondere derde enerzijds en Onze Minister van Financiën anderzijds, in verband
      met de afstemming van de gegevens van de afnemer of de bijzondere derde op de gegevens in de basisadministraties.
      Daarbij kunnen regels gesteld worden omtrent de verrekening van de kosten van deze gegevensuitwisseling.
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel90
  - number: '91'
    text: |-
      1 Het college van burgemeester en wethouders draagt ten behoeve van de uitvoering van de wet zorg voor het
      persoonsregister en het archiefregister tot de datum die is gelegen vijfenzeventig jaar na de datum van
      inwerkingtreding van dit besluit.

      2 De op grond van [artikel 141 van de wet][ref1] aan het college van burgemeester en wethouders verstrekte gegevens
      worden toegevoegd aan het persoonsregister.

      3 Onze Minister kan regels stellen omtrent de zorg voor het persoonsregister en het archiefregister.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel141
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '141'
  - number: '92'
    text: |-
      1 Onze Minister draagt ten behoeve van de uitvoering van de wet zorg voor het centraal bevolkingsregister, bedoeld
      in [artikel 138 van de wet][ref1], tot de datum die is gelegen vijfenzeventig jaar na de datum van inwerkingtreding
      van dit besluit.

      2 Onze Minister kan regels stellen omtrent de zorg voor het centraal bevolkingsregister.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel138
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '138'
  - number: '93'
    text: |-
      1 Onze Minister draagt ten behoeve van de uitvoering van de wet zorg voor het persoonskaartenarchief en het
      schakelregister, bedoeld in [artikel 139 van de wet][ref1], tot de datum die is gelegen vijfenzeventig jaar na de
      datum van inwerkingtreding van dit besluit.

      2 Onze Minister kan regels stellen omtrent de zorg voor het persoonskaartenarchief en het schakelregister.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel139
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '139'
  - number: '94'
    text: |-
      1 Onze Minister stelt regels omtrent heffingen in verband met de verstrekking van gegevens uit:

      a. het centraal bevolkingsregister;

      b. het persoonskaartenarchief;

      c. het schakelregister;

      d. het centraal archief van overledenen.

      2 De regels, bedoeld in het eerste lid, worden gesteld voor zover Onze Minister verantwoordelijk is voor de
      verwerking van persoonsgegevens in die registraties en betreffen slechts heffingen in verband met de verstrekking
      van gegevens aan derden, anders dan overeenkomstig [artikel 99][ref1] en [100a van de wet][ref2], en de
      verstrekking aan de betrokkene van hem betreffende gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel100a
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '99'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: 100a
  - number: '97'
    text: |-
      1 De tabelgegevens worden in ieder geval op de volgende wijzen bekend gemaakt:

      a. door verstrekking van deze gegevens over het netwerk op een wijze die overeenstemt met de systeembeschrijving;

      b. door terinzagelegging van deze gegevens door Onze Minister.

      2 Van de terinzagelegging wordt mededeling gedaan in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel97
  - number: '98'
    text: |-
      De verplichtingen, bedoeld in [artikel 146b, eerste en tweede lid, van de wet][ref1], zijn tot de in dat artikel
      genoemde datum alleen van toepassing op de door Onze Minister aangewezen afnemers of categorieën van afnemers.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel146b
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: 146b
  - number: 98a
    text: |-
      1 Voor de toepassing van [artikel 6][ref1] wordt wat betreft het vaststellen van de abonnementsstructuur voor het
      jaar 2012 onder «het volgende jaar» verstaan «het jaar 2012» en onder «het vorige jaar»: het jaar 2010.

      2 In afwijking van [artikel 6, vierde lid][ref2], deelt Onze Minister de abonnementsstructuur voor het jaar 2012
      mee aan betrokkenen in januari 2012.


      [ref1]: https://wetten.overheid.nl/BWBR0006933#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0006933#Artikel6
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel98a
