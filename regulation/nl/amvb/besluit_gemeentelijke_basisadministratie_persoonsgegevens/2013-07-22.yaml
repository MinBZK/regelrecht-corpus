        artikel: '33'
        hoofdstuk: '1'
        paragraaf: '4'
        afdeling: '4'
  - number: '36'
    text: |-
      De buitengemeentelijke afnemer draagt zorg dat wordt voldaan aan de in de systeembeschrijving beschreven minimale
      eisen ten aanzien van de beschikbaarheid en de verwerkingstijden van het geautomatiseerde systeem van de afnemer.
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel36
  - number: '37'
    text: |-
      1 Het geautomatiseerde systeem van de afnemer stelt de buitengemeentelijke afnemer in staat om in overeenstemming
      met de systeembeschrijving uitvoering te geven aan de in de [artikelen 32 tot en met 36][ref1] bedoelde taken.

      2 Indien ten aanzien van de afnemer geen autorisatiebesluit is genomen en de afnemer een formulier als bedoeld in
      [artikel 66][ref2] heeft ingediend, zijn de eisen aan het geautomatiseerde systeem met betrekking tot de uitvoering
      van de in [artikel 32, eerste en tweede lid][ref3], en [artikel 33, eerste lid][ref4], bedoelde taken slechts
      van toepassing voor zover de desbetreffende wijzen van verzending en ontvangst van berichten en de desbetreffende
      wijzen van systematische gegevensverstrekking in het formulier zijn aangegeven.

      3 Indien ten aanzien van de afnemer geen autorisatiebesluit is genomen en de afnemer niet een formulier als
      bedoeld in [artikel 66][ref5] heeft ingediend, zijn de eisen aan het geautomatiseerde systeem met betrekking tot
      de uitvoering van de in [artikel 32, eerste en tweede lid][ref6], en [artikel 33, eerste lid][ref7], bedoelde taken
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006933#Artikel32
