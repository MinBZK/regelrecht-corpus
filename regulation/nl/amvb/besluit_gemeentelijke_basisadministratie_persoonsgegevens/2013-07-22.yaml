  - number: '71'
    text: |-
      1 De verantwoordelijke voor de verwerking van gegevens in het vestigingsregister draagt zorg dat het
      geautomatiseerde systeem van het vestigingsregister in overeenstemming met de systeembeschrijving geautomatiseerd
      berichten over het netwerk verzendt en ontvangt ten behoeve van:

      a. de inschrijving in de basisadministratie;

      b. de verwerking van verwijsgegevens en van administratieve gegevens in verband met de verwijsgegevens;

      c. de op grond van [artikel 12, tweede lid, onder b][ref1], beschreven verstrekkingen uit het vestigingsregister.

      2 De verantwoordelijke voor de verwerking van gegevens in het vestigingsregister draagt zorg dat het
      geautomatiseerde systeem van het vestigingsregister in overeenstemming met de systeembeschrijving geautomatiseerde
      berichten verzendt en ontvangt, ten behoeve van de in [artikel 12, vijfde lid][ref2], bedoelde verstrekkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006933#Artikel12
