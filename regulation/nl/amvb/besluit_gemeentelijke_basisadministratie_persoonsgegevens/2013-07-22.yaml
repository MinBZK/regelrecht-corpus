  - number: '39'
    text: |-
      1 Onze Minister stelt regels omtrent het verschaffen van inlichtingen door:

      a. de verantwoordelijke voor de verwerking van gegevens in een basisadministratie in verband met het aanbrengen van
      een verandering in de wijze van uitvoering van de regels, bedoeld in [artikel 6 van de wet][ref1];

      b. de buitengemeentelijke afnemer in verband met het aanbrengen van een verandering in de wijze van uitvoering van
      de regels, bedoeld in [artikel 16 van de wet][ref2].

      2 Daarbij regelt hij in ieder geval de verplichtingen om inlichtingen te verschaffen omtrent het aanbrengen
      van wijzigingen in de apparatuur en programmatuur die het gemeentelijke geautomatiseerde systeem of het
      geautomatiseerde systeem van de afnemer vormen.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel16
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel39
