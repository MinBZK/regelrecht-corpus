  - number: '7'
    text: |-
      1 De bijdrage van een betrokkene bestaat uit een jaarlijkse betaling. Hiertoe brengt Onze Minister het
      abonnementstarief voor het lopende jaar in rekening dat behoort bij de abonnementsklasse waarin de betrokkene valt,
      gelet op het aantal netwerkberichten dat in het voorafgaande jaar ten laste van hem kwam.

      2 Indien het aantal netwerkberichten over het lopende jaar dat ten laste van de betrokkene komt, valt in een hogere
      abonnementsklasse dan de in het eerste lid bedoelde klasse, brengt Onze Minister, in afwijking van het eerste lid,
      het abonnementstarief voor het lopende jaar in rekening dat behoort bij die hogere klasse.

      3 Onze Minister stelt het jaarlijks in rekening te brengen bedrag voor een betrokkene op nul vast, voor zover een
      voorziening is getroffen in de begroting van het Ministerie van Binnenlandse Zaken die in plaats treedt van de
      bijdrage van de betrokkene.
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel7
  - number: '8'
    text: |-
      1 Categorieën van kosten, als bedoeld in [artikel 5, tweede lid, van de wet][ref1] zijn tevens kosten in verband
      met de afstemming van de gegevens van een betrokkene op de gegevens in de basisadministratie.

      2 De bijdrage van een betrokkene in de in het eerste lid bedoelde kosten wordt vastgesteld op basis van
      [artikel 69][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006933#Artikel69
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel8
