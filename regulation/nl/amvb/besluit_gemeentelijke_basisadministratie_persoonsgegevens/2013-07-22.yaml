        bwb_id: BWBR0006933
        artikel: '22'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '4'
  - number: '49'
    text: |-
      Bij de indiening van een verzoek om toestemming als bedoeld in [artikel 13][ref1] of [artikel 22 van de wet][ref2]
      maakt het college van burgemeester en wethouders, de buitengemeentelijke afnemer of de bijzondere derde gebruik van
      een door Onze Minister vastgesteld formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel22
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '22'
  - number: '50'
    text: |-
      In deze afdeling en de daarop berustende bepalingen wordt verstaan onder persoonsgegevens: de door de
      verantwoordelijke voor de verwerking van persoonsgegevens in een basisadministratie aan de bewerker voor het
      verrichten van de werkzaamheden ter beschikking gestelde persoonsgegevens en de door de bewerker daaruit afgeleide
      persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel50
  - number: '51'
    text: |-
      1 De door de bewerker te verrichten werkzaamheden worden vastgelegd in een door het college van burgemeester en
      wethouders en de bewerker te sluiten schriftelijke overeenkomst.

      2 De bewerker verbindt zich in de overeenkomst te handelen in overeenstemming met de in de [artikelen 52][ref1] en
      [53][ref2] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0006933#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0006933#Artikel53
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0006933
        artikel: '52'
        hoofdstuk: '1'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0006933
        artikel: '53'
        hoofdstuk: '1'
        afdeling: '6'
  - number: '52'
    text: |-
      De bewerker voldoet in ieder geval aan de volgende eisen:

      a. de bewerker maakt de persoonsgegevens uitsluitend dienstbaar aan de in de overeenkomst vastgelegde
      werkzaamheden;

      b. bij het verrichten van de werkzaamheden handelt de bewerker in overeenstemming met de in en krachtens de wet
      gegeven voorschriften;

      c. de bewerker stelt het college van burgemeester en wethouders in de gelegenheid toezicht op het naleven van de
      overeenkomst uit te oefenen, waarbij hij de medewerking verleent die hem door dat college wordt verzocht;

      d. op vordering van het college van burgemeester en wethouders schort de bewerker de werkzaamheden op en stelt hij
      de persoonsgegevens ter beschikking van dat college;

      e. indien de bewerker werkzaamheden voor een college van burgemeester en wethouders verricht, besteedt hij deze
      slechts uit aan een andere bewerker, voor zover de aan dat college verleende machtiging dit uitdrukkelijk toestaat.
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel52
  - number: '53'
    text: |-
      1 De bewerker draagt tevens zorg voor de nodige voorzieningen van technische en organisatorische aard ter
      verzekering van de deugdelijke uitvoering van zijn werkzaamheden, de beveiliging van de gegevensbestanden en de
      bescherming van de persoonlijke levenssfeer. Deze voorzieningen omvatten ten minste de volgende onderwerpen:

      a. maatregelen gericht op personen die werkzaam zijn voor de bewerker;

      b. maatregelen gericht op de toegang tot gebouwen en ruimten, in gebruik bij de bewerker, waar persoonsgegevens
      aanwezig zijn;

      c. maatregelen gericht op een deugdelijke werking en beveiliging van de apparatuur en programmatuur die het
      gemeentelijke geautomatiseerde systeem vormen;

      d. maatregelen gericht op het beheer van persoonsgegevens;

      e. maatregelen voor het geval de geheimhouding van de persoonsgegevens is geschaad;

      f. maatregelen bij calamiteiten.

      2 Onze Minister stelt nadere eisen aan de in het eerste lid bedoelde voorzieningen.
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel53
  - number: 53a
    text: |-
      1 Onze Minister draagt ten behoeve van de uitvoering van de audit zorg voor een evenwichtige verdeling van de
      gemeenten over twaalf tijdvakken van elk drie maanden.

      2 Het college van burgemeester en wethouders laat de audit uitvoeren binnen het voor de desbetreffende gemeente
      vastgestelde tijdvak.

      3 De verdeling van de gemeenten ingevolge het eerste lid, wordt niet vastgesteld dan nadat de betrokken gemeenten
      de gelegenheid hebben gehad hun zienswijze omtrent het desbetreffende voorstel naar voren te brengen. De verdeling
      wordt bekend gemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel53a
  - number: 53b
    text: |-
      1 Bij ministeriële regeling worden de vereisten vastgesteld, waaraan een bedrijf, bedoeld in
      [artikel 120a, tweede lid, van de wet][ref1], moet voldoen.

      2 De vereisten betreffen in ieder geval:

      a. de organisatorische en administratieve inrichting van het bedrijf;

      b. de voor het uitvoeren van de audit benodigde kennis.

      3 Voordat een aanwijzing, bedoeld in [artikel 120a, tweede lid, van de wet][ref2], wordt gegeven, wordt getoetst of
      aan de krachtens het eerste lid gestelde vereisten is voldaan. Periodiek wordt getoetst of een aangewezen bedrijf
      nog voldoet aan de gestelde vereisten.

      4 De aan een toets verbonden kosten komen voor rekening van het desbetreffende bedrijf.

      5 Een aanwijzing wordt ingetrokken indien blijkt dat een bedrijf niet langer voldoet aan de gestelde vereisten.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel120a
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel120a
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel53b
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: 120a
      - id: ref2
        bwb_id: BWBR0006723
        artikel: 120a
  - number: 53c
    text: |-
      1 Bij ministeriële regeling wordt omtrent de audit in ieder geval bepaald:

      a. de wijze van uitvoering van het inhoudelijke deel van de audit, betreffende de in de basisadministratie
      opgenomen persoonsgegevens;

      b. de wijze van uitvoering van het procesdeel van de audit, betreffende de procedures voor het bewaren en het
      herstellen van gegevens en de beveiliging van de basisadministratie;

      c. de wijze van uitvoering van het privacydeel van de audit, betreffende de wijze waarop de gemeente aan de
      privacybescherming van de ingeschrevenen in de basisadministratie vorm geeft;

      d. de beoordelingscriteria en de maximaal toegestane afwijkingspercentages;

      e. in welke gevallen, op welke onderdelen en op welke wijze een heraudit moet worden uitgevoerd;

      f. de wijze van rapporteren aan het college van burgemeester en wethouders.

      2 De auditresultaten worden opgenomen in een rapportage waarvan de bij ministeriële regeling bepaalde onderdelen
      door het college van burgemeester en wethouders in afschrift aan Onze Minister worden gezonden. De vergoeding,
      bedoeld in [artikel 120a, vierde lid, van de wet][ref1], vindt niet plaats dan nadat het afschrift door Onze
      Minister is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel120a
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel53c
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: 120a
  - number: 53d
    text: |-
      Onze Minister kan nadere regels van technische en administratieve aard stellen in verband met de uitvoering van
      de audit.
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel53d
  - number: '54'
    text: |-
      1 Niet voor inschrijving in aanmerking komen:

      a. de in Nederland hun dienst uitoefenende militairen behorend tot de krijgsmacht van een vreemde mogendheid,
      aangesloten bij de Noord-Atlantische Verdragsorganisatie;

      b. de in Nederland hun dienst uitoefenende leden van het burgerpersoneel, die in dienst zijn bij de krijgsmacht
      van een vreemde mogendheid als bedoeld onder *a*, of die in dienst zijn van een hoofdkwartier als bedoeld in
      artikel 3 van het Protocol nopens de rechtspositie van internationale militaire hoofdkwartieren, ingesteld uit
      hoofde van het Noord-Atlantische Verdrag (*Trb.* 1953, 11) en beschikken over een door het hoofdkwartier afgegeven
      identiteitsbewijs;

      c. de echtgenoten van personen op wie onderdeel *a* of *b* van toepassing is;

      d. de inwonende minderjarige kinderen van personen op wie onderdeel *a*, *b* of *c* van toepassing is.

      2 Het eerste lid is niet van toepassing ten aanzien van personen die de Nederlandse nationaliteit bezitten.

      3 Het eerste lid, aanhef en onder *b*, *c*, en *d* is niet van toepassing ten aanzien van:

      a. personen die reeds gedurende een jaar als ingezetene zijn ingeschreven;

      b. personen die geen onderdaan zijn van een staat welke is aangesloten bij de Noord-Atlantische
      Verdragsorganisatie;

      c. staatloze personen.
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel54
  - number: '55'
    text: |-
      1 Gedurende de eerste zes maanden van het verblijf in Nederland komen niet voor inschrijving in aanmerking
      vreemdelingen die geen toelating hebben tot Nederland en verblijven in een opvangcentrum.

      2 Het eerste lid is niet van toepassing indien het verblijf in Nederland aanvangt door geboorte en omtrent
      betrokkene door een ambtenaar van de burgerlijke stand in Nederland een geboorteakte is opgemaakt.

      3 Onder een opvangcentrum als bedoeld in het eerste lid wordt verstaan: een door het Rijk beschikbaar gestelde
      accommodatie die uitsluitend bestemd is voor het bieden van tijdelijke opvang aan vreemdelingen.
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel55
  - number: '56'
    text: |-
      Een persoon ten aanzien van wie het college van burgemeester en wethouders kennis heeft gekregen van de
      omstandigheid dat hij behoort tot een categorie als bedoeld in [artikel 54][ref1] of [artikel 55][ref2], wordt
      niet ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0006933#Artikel54
      [ref2]: https://wetten.overheid.nl/BWBR0006933#Artikel55
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0006933
        artikel: '54'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0006933
        artikel: '55'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '57'
    text: |-
      Een persoon ten aanzien van wie het college van burgemeester en wethouders kennis heeft gekregen van de
      omstandigheid dat hij behoort tot een categorie als bedoeld in [artikel 54][ref1], terwijl hij reeds is
      ingeschreven, wordt aangemerkt als een ingeschrevene die wegens zijn vertrek uit Nederland niet als ingezetene
      is ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0006933#Artikel54
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0006933
        artikel: '54'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '58'
    text: |-
      1 Niet verplicht tot het doen van aangifte van vertrek is de ingezetene die vanaf het tijdstip van het vertrek uit
      Nederland naar redelijke verwachting niet langer dan twee jaar buiten Nederland verblijft en die gedurende zijn
      verblijf buiten Nederland vaart aan boord van een schip dat in Nederland de thuishaven heeft.

      2 Het eerste lid is alleen van toepassing indien de betrokkene gedurende zijn verblijf buiten Nederland beschikt
      over een adres in Nederland.
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel58
  - number: 58a
    text: |-
      De in [artikel 3a van de wet][ref1] bedoelde gegevens zijn vermeld in [bijlage 1d][ref2] bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0006933
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel58a
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: 3a
      - id: ref2
        bwb_id: BWBR0006933
  - number: '59'
    text: |-
      1 De in [artikel 34, eerste lid, onder ][ref1] bedoelde bijzondere gegevens zijn vermeld in [bijlage 2][ref2] bij
      dit besluit.

      2 De in [artikel 34, eerste lid, onder ][ref3] bedoelde administratieve gegevens zijn vermeld in [bijlage 3][ref4]
      bij dit besluit.

      3 De in [artikel 35, eerste lid, onder ][ref5] bedoelde administratieve gegevens in verband met de verwijsgegevens
      zijn vermeld in [bijlage 4][ref6] bij dit besluit.

      4 De bijzondere gegevens, de administratieve gegevens en de administratieve gegevens in verband met de
      verwijsgegevens worden vernietigd of uit de basisadministratie verwijderd in de gevallen, beschreven in de
      systeembeschrijving.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0006933
      [ref3]: https://wetten.overheid.nl/BWBR0006723#Artikel34
      [ref4]: https://wetten.overheid.nl/BWBR0006933
      [ref5]: https://wetten.overheid.nl/BWBR0006723#Artikel35
      [ref6]: https://wetten.overheid.nl/BWBR0006933
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel59
