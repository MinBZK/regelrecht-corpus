  - number: 79c
    text: |-
      Onze Minister stelt bij ministeriële regeling regels over de wijze van verstrekking van gegevens uit het
      vestigingsregister aan een verantwoordelijke voor de verwerking van gegevens in een basisadministratie in Aruba,
      Curaçao, Sint Maarten of een van de openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel79c
  - number: '80'
    text: |-
      1 Onze Minister stelt regels over heffingen in verband met de verstrekking uit het vestigingsregister van gegevens
      aan derden, anders dan overeenkomstig [artikel 99][ref1] of [100a van de wet][ref2], en van hem betreffende
      gegevens aan de betrokkene.

      2 De regels, bedoeld in het eerste lid, vervallen indien de verantwoordelijkheid voor de verwerking van gegevens
      in het vestigingsregister op grond van [artikel 119 van de wet][ref3] door Onze Minister wordt overgedragen aan het
      college van burgemeester en wethouders van een gemeente.

      3 Verstrekking van gegevens uit het vestigingsregister aan een verantwoordelijke voor de verwerking van
      gegevens in een basisadministratie in Aruba, Curaçao, Sint Maarten of een van de openbare lichamen, bedoeld in
      [artikel 100a van de wet][ref4], is vrij van heffingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel100a
      [ref3]: https://wetten.overheid.nl/BWBR0006723#Artikel119
