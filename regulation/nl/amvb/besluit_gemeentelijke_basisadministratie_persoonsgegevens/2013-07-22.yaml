      De wijze van systematisch verstrekken van gegevens uit het vestigingsregister aan buitengemeentelijke
      afnemers die alleen kan geschieden op grond van een autorisatiebesluit betreft de wijze die op grond van
      [artikel 12, tweede lid, onder b][ref1], is beschreven in de systeembeschrijving.


      [ref1]: https://wetten.overheid.nl/BWBR0006933#Artikel12
