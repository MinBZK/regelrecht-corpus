  - number: '4'
    text: |-
      Categorieën van kosten, als bedoeld in [artikel 5, tweede lid, van de wet][ref1] zijn de kosten in verband met:

      a. de verzending en ontvangst van netwerkberichten;

      b. het beheer van het stelsel van basisadministraties en het beheer en gebruik van de verstrekkingsvoorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel5
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '5'
  - number: '5'
    text: |-
      1 Netwerkberichten tussen basisadministraties komen ten laste van de betrokkene die het bericht verzendt.

      2 Netwerkberichten aan of van een buitengemeentelijke afnemer of een bijzondere derde, behoudens berichten ter
      uitvoering van [artikel 62][ref1], komen ten laste van die afnemer of derde.


      [ref1]: https://wetten.overheid.nl/BWBR0006933#Artikel62
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel5
    references:
      - id: ref1
