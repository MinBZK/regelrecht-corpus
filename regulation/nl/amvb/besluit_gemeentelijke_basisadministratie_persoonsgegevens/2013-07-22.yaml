preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken van 2 juni 1994, nummer GBA94/U69, gedaan in
    overeenstemming met Onze Ministers van Financiën en Economische Zaken;

    Gelet op de Wet gemeentelijke basisadministratie persoonsgegevens;

    Gezien het advies van de Raad voor de gemeentefinanciën van 23 maart 1994, nummer Rgf 02.20/002.003;

    Gezien het advies van de Registratiekamer van 23 maart 1994, nummer 94.A.002;

    Gezien het advies van de Raad voor het Cultuurbeheer van 26 april 1994, nummer RCB/II-94-128;

    De Raad van State gehoord (advies van 28 juli 1994, nummer W04.94.0350);

    Gezien het nader rapport van Staatssecretaris J. Kohnstamm van Binnenlandse Zaken van 30 augustus 1994, nummer
    GBA94/101, uitgebracht in overeenstemming met Onze Ministers van Financiën en Economische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

        - de wet: de [Wet gemeentelijke basisadministratie persoonsgegevens][ref1];
        - Onze Minister: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;
        - het netwerk: het netwerk, bedoeld in [artikel 4 van de wet][ref2];
        - een autorisatiebesluit: een besluit als bedoeld in [artikel 91, eerste lid, van de wet][ref3] of in
      [artikel 99, zevende lid, van de wet][ref4];
        - een bijzondere derde: een derde als bedoeld in [artikel 99 van de wet][ref5];
        - het vestigingsregister: het register, bedoeld in [artikel 112 van de wet][ref6];
        - de verstrekkingsvoorziening: de voorziening, bedoeld in [artikel 66a][ref7];
        - de systeembeschrijving: de beschrijving, bedoeld in [artikel 11][ref8];
        - de tabelgegevens: de inhoud van de tabellen, bedoeld in [artikel 13][ref9];
        - het gemeentelijke geautomatiseerde systeem: het geautomatiseerde systeem waarmee de verantwoordelijke voor de
      verwerking van persoonsgegevens in de basisadministratie uitvoering wil geven, of uitvoering geeft, aan de regels,
      bedoeld in [artikel 6, eerste lid, van de wet][ref10];
        - het geautomatiseerde systeem van de afnemer: het geautomatiseerde systeem waarmee de buitengemeentelijke afnemer
      uitvoering wil geven, of uitvoering geeft, aan de regels, bedoeld in [artikel 16 van de wet][ref11];
        - het geautomatiseerde systeem van het vestigingsregister: het geautomatiseerde systeem waarmee de
      verantwoordelijke voor de verwerking van persoonsgegevens in het vestigingsregister uitvoering geeft aan de regels,
      bedoeld in [artikel 117 van de wet][ref12];
        - een vrij bericht: een in de systeembeschrijving beschreven bericht dat over het netwerk wordt verzonden of
      ontvangen, waarbij de informatie die het bericht bevat niet in de systeembeschrijving is vastgelegd;
        - het vreemdelingenadministratiesysteem: het geautomatiseerde systeem waarmee de mededelingen van Onze Minister
      voor Immigratie en Asiel ter uitvoering van [artikel 58 van de wet][ref13] worden ontvangen en verzonden;
        - het gebruikersoverleg: het overleg, bedoeld in [artikel 23a, van de wet][ref14];
        - de audit: de controle, bedoeld in [artikel 120a, eerste lid, van de wet][ref15];
        - de heraudit: de hercontrole, bedoeld in [artikel 120a, vijfde lid, van de wet][ref16].


