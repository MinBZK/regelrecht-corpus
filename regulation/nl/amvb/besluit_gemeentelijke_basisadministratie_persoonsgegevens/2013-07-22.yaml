  - number: '65'
    text: |-
      1 De verantwoordelijke voor de verwerking van gegevens in een basisadministratie weigert de verstrekking van
      gegevens uit de basisadministratie aan een buitengemeentelijke afnemer als de verstrekking geen grond vindt in een
      autorisatiebesluit en het de verstrekking op een van de volgende wijzen betreft:

      a. de verstrekking van gegevens zodra zich een wijziging voordoet in gegevens over door de afnemer aangegeven
      personen;

      b. de eenmalige of periodieke verstrekking van gegevens over personen waarvan de gegevens voldoen aan door de
      afnemer aangegeven voorwaarden.

      2 De verantwoordelijke voor de verwerking van gegevens in een basisadministratie kan weigeren gegevens uit de
      basisadministratie te verstrekken aan een buitengemeentelijke afnemer als de verstrekking geen grond vindt in
      een autorisatiebesluit en het aantal verstrekkingen per jaar aan de afnemer, naar redelijke verwachting van die
      verantwoordelijke, boven een door Onze Minister te bepalen maatstaf zal liggen.
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel65
  - number: '66'
    text: |-
      Bij de indiening van een verzoek tot het nemen van een autorisatiebesluit maakt de buitengemeentelijke afnemer
      gebruik van een door Onze Minister vastgesteld formulier.
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel66
  - number: 66a
    text: |-
      1 Er is een verstrekkingsvoorziening ten behoeve van systematische verstrekking van gegevens uit de
      basisadministraties aan buitengemeentelijke afnemers en bijzondere derden.

      2 De verstrekkingsvoorziening bevat hiertoe een kopie van de persoonslijsten, die in een basisadministratie zijn
      opgenomen.

      3 De systematische verstrekking van gegevens uit de basisadministraties geschiedt met behulp van de
      verstrekkingsvoorziening voor zover dit in de systeembeschrijving is bepaald, op de daarin voorgeschreven wijze.
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel66a
  - number: 66b
    text: |-
      1 Onze Minister beheert de verstrekkingsvoorziening en draagt er zorg voor dat de inrichting en de werking van de
      voorziening in overeenstemming zijn met de systeembeschrijving.

      2 Het beheer omvat in ieder geval:

      a. het in de verstrekkingsvoorziening opnemen van tabelgegevens;

      b. het beschikbaar houden van de in de verstrekkingsvoorziening opgenomen gegevens, totdat zij op grond van
      het bepaalde bij of krachtens de wet moeten worden vernietigd of uit de verstrekkingsvoorziening moeten worden
      verwijderd;

      c. het vernietigen of uit de verstrekkingsvoorziening verwijderen van de daarin opgenomen gegevens;

      d. het verzenden en ontvangen van berichten over het netwerk;

      e. het ontvangen van berichten die op een opslagmedium zijn vastgelegd;

      f. het voldoen aan de eisen ten aanzien van de beschikbaarheid en de verwerkingstijden van de
      verstrekkingsvoorziening;

      g. de uitvoering van de procedures voor het bewaren en het herstellen van gegevens in de verstrekkingsvoorziening;

      h. het houden van aantekening van het gebruik dat van de verstrekkingsvoorziening is gemaakt;

      i. het doen van mededeling aan de verantwoordelijke voor de verwerking van gegevens in de basisadministratie
      waaruit de verstrekte gegevens afkomstig zijn, zodanig dat deze in overeenstemming met de systeembeschrijving
      uitvoering kan geven aan de [artikelen 103][ref1] en [104 van de wet][ref2].

      3 [Artikel 31][ref3] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel103
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel104
      [ref3]: https://wetten.overheid.nl/BWBR0006933#Artikel31
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel66b
