        artikel: '62'
        hoofdstuk: '2'
        paragraaf: '7'
  - number: '6'
    text: |-
      1 Onze Minister stelt elk jaar de abonnementsstructuur vast die hij in het volgende jaar zal hanteren. De
      abonnementsstructuur bestaat uit verschillende abonnementsklassen met daarbij behorende bandbreedten van aantallen
      netwerkberichten en het daarbij behorende tarief in euro’s.

      2 Onze Minister bepaalt de abonnementsstructuur, gelet op:

      a. de voor het volgende jaar te verwachten kosten als bedoeld in [artikel 4][ref1], verminderd met het saldo over
      het vorige jaar;

      b. het voor het volgende jaar te verwachten aantal netwerkberichten dat ten laste van de betrokkenen komt.

      3 Het saldo over het vorige jaar wordt gevonden door de in [artikel 7, eerste tot en met derde lid][ref2], bedoelde
      bijdragen over dat jaar te verminderen met de kosten, bedoeld in [artikel 4][ref3], in dat jaar.

      4 Onze Minister deelt de abonnementsstructuur in september van elk jaar mede aan de betrokkenen.


      [ref1]: https://wetten.overheid.nl/BWBR0006933#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0006933#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0006933#Artikel4
