  - number: '38'
    text: |-
      Het geautomatiseerde systeem van de afnemer biedt de in de systeembeschrijving beschreven voorzieningen ten behoeve
      van een onderzoek als bedoeld in de [artikelen 18][ref1] en [20][ref2] van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel20
