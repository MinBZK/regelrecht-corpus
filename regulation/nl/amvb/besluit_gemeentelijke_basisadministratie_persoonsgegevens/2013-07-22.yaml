  - number: '10'
    text: |-
      1 Categorieën van kosten, als bedoeld in [artikel 5, tweede lid, van de wet][ref1] zijn tevens kosten in verband
      met de schriftelijke verstrekking van gegevens.

      2 Een college van burgemeester en wethouders dat schriftelijk gegevens verstrekt, kan bij de betrokkene aan wie de
      gegevens worden verstrekt in verband met de kosten, bedoeld in het eerste lid, een bijdrage in rekening brengen.
      Bij ministeriële regeling wordt vastgesteld welke bijdragen ten hoogste in rekening kunnen worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel5
