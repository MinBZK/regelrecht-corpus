  - number: '15'
    text: |-
      De verantwoordelijke voor de verwerking van gegevens in een basisadministratie neemt de in de basisadministratie
      op te nemen gegevens op in het gemeentelijke geautomatiseerde systeem, op een wijze die overeenstemt met de
      systeembeschrijving.
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel15
  - number: '16'
    text: |-
      De verantwoordelijke voor de verwerking van persoonsgegevens in een basisadministratie neemt de door Onze Minister
      aan hem verstrekte tabelgegevens op in het gemeentelijke geautomatiseerde systeem op een wijze die overeenkomt met
      de systeembeschrijving.
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel16
  - number: '17'
    text: |-
      1 De verantwoordelijke voor de verwerking van gegevens in een basisadministratie draagt zorg dat de gegevens
      die ter uitvoering van het bepaalde bij of krachtens de wet in het gemeentelijke geautomatiseerde systeem zijn
      opgenomen, met behulp van het geautomatiseerde systeem beschikbaar blijven op een wijze die overeenstemt met de
      systeembeschrijving, totdat zij op grond van het bepaalde bij of krachtens de wet moeten worden vernietigd of uit
      de basisadministratie moeten worden verwijderd.

      2 De verantwoordelijke, bedoeld in het eerste lid, vernietigt de gegevens, of verwijdert deze uit de
      basisadministratie, op een wijze die overeenstemt met de systeembeschrijving.
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel17
  - number: '18'
    text: |-
      De verantwoordelijke voor de verwerking van gegevens in een basisadministratie draagt zorg dat het gemeentelijke
      geautomatiseerde systeem in overeenstemming met de systeembeschrijving geautomatiseerd berichten over het netwerk
      verzendt en ontvangt ten behoeve van:

      a. de inschrijving en de uitschrijving;

      b. de verwerking van algemene gegevens en van administratieve gegevens;

      c. de verwerking van verwijsgegevens en van administratieve gegevens in verband met de verwijsgegevens;

      d. de op grond van [artikel 12, tweede lid][ref1], beschreven verstrekkingen uit de basisadministratie.


      [ref1]: https://wetten.overheid.nl/BWBR0006933#Artikel12
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006933
        artikel: '12'
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '4'
  - number: '19'
    text: |-
      1 De verantwoordelijke voor de verwerking van persoonsgegevens in een basisadministratie draagt zorg dat het
      gemeentelijke geautomatiseerde systeem in overeenstemming met de systeembeschrijving in verband met de verzending
      en de ontvangst van berichten ten behoeve van de in [artikel 18, onder ][ref1], bedoelde handelingen:

      a. geautomatiseerd berichten op optische schijf of magneetschijf vastlegt;

      b. geautomatiseerd berichten ontvangt die op optische schijf of magneetschijf zijn vastgelegd.

      2 De verantwoordelijke, bedoeld in het eerste lid, draagt zorg dat hij de optische schijf of de magneetschijf
      verzendt of in ontvangst neemt op een wijze die overeenstemt met de systeembeschrijving.


      [ref1]: https://wetten.overheid.nl/BWBR0006933#Artikel18
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006933
        artikel: '18'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '4'
  - number: '20'
    text: |-
      De verantwoordelijke voor de verwerking van gegevens in een basisadministratie draagt zorg dat het gemeentelijke
      geautomatiseerde systeem een vrij bericht over het netwerk verzendt en ontvangt op een wijze die overeenstemt met
      de systeembeschrijving.
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel20
  - number: '21'
    text: |-
      De verantwoordelijke voor de verwerking van gegevens in een basisadministratie stelt Onze Minister op
      de hoogte van de voorvallen die optreden bij de verzending en de ontvangst van berichten, bedoeld in de
      [ artikelen 18 tot en met 20][ref1], voor zover de voorvallen op grond van de systeembeschrijving voor melding in
      aanmerking komen.


      [ref1]: https://wetten.overheid.nl/BWBR0006933#Artikel18
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0006933
        artikel: '18'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '4'
  - number: '22'
    text: |-
      De verantwoordelijke voor de verwerking van gegevens in een basisadministratie draagt zorg dat wordt voldaan aan de
      in de systeembeschrijving beschreven minimale eisen ten aanzien van de beschikbaarheid en de verwerkingstijden van
      het gemeentelijke geautomatiseerde systeem.
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel22
  - number: '23'
    text: |-
      De verantwoordelijke voor de verwerking van gegevens in een basisadministratie draagt zorg voor de uitvoering van
      de in de systeembeschrijving beschreven procedures voor het bewaren en het herstellen van gegevens.
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel23
  - number: '24'
    text: |-
      De verantwoordelijke voor de verwerking van gegevens in een basisadministratie draagt zorg dat in overeenstemming
      met de systeembeschrijving aantekening wordt gehouden van het gebruik dat van het gemeentelijke geautomatiseerde
      systeem is gemaakt.
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel24
  - number: '25'
    text: |-
      De verantwoordelijke voor de verwerking van gegevens in een basisadministratie draagt zorg dat in overeenstemming
      met de systeembeschrijving uitvoering wordt gegeven aan de [artikelen 78, eerste en vijfde lid][ref1],
      [79, eerste, tweede en derde lid][ref2], [88, derde lid][ref3], [103, tweede en derde lid][ref4] en
      [104, eerste lid, van de wet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel78
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel79
      [ref3]: https://wetten.overheid.nl/BWBR0006723#Artikel88
      [ref4]: https://wetten.overheid.nl/BWBR0006723#Artikel103
      [ref5]: https://wetten.overheid.nl/BWBR0006723#Artikel104
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel25
