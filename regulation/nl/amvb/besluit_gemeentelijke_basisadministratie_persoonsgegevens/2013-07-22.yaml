      - id: ref3
        bwb_id: BWBR0006933
        artikel: '70'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '89'
    text: |-
      Onze Minister kan regels stellen omtrent:

      a. de technische en administratieve inrichting en werking en de beveiliging van de basisadministratie van een
      college van burgemeester en wethouders van een gemeente dat niet in het bezit is van een toestemming als bedoeld in
      [artikel 7][ref1] of [artikel 13 van de wet][ref2];

      b. de systematische verstrekking van gegevens op grond van de [artikelen 91][ref3] en [99 van de wet][ref4] door
      een college van burgemeester en wethouders van een gemeente als bedoeld onder *a*;

      c. de aanleg, de instandhouding en de werking van voorzieningen ten behoeve van de overdracht van berichten in
      verband met de uitvoering van de bepalingen bij of krachtens de wet omtrent de gemeentelijke basisadministratie van
      persoonsgegevens, voor zover de berichten niet over het netwerk worden verzonden of ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0006723#Artikel91
      [ref4]: https://wetten.overheid.nl/BWBR0006723#Artikel99
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel89
    references:
      - id: ref1
