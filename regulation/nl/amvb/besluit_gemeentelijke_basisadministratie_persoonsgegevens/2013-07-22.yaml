        bwb_id: BWBR0006933
  - number: '60'
    text: |-
      Onze Minister bepaalt de gevallen waarin de in [artikel 35, eerste lid, onderdeel a, onder 3°, van de wet][ref1]
      bedoelde gegevens over het burgerservicenummer niet in de basisadministratie worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel35
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '35'
  - number: '61'
    text: |-
      1 Het college van burgemeester en wethouders zendt een afschrift van een beslissing als bedoeld in
      [artikel 83 van de wet][ref1] om op grond van [artikel 37, tweede lid, van de wet][ref2] gegevens over een
      huwelijk, een geregistreerd partnerschap, een erkenning, of de geboortedatum van de betrokken persoon niet in de
      basisadministratie op te nemen, aan de korpschef in de zin van de Vreemdelingenwet.

      2 Het eerste lid is slechts van toepassing indien de in dat lid bedoelde gegevens betrekking hebben op een
      vreemdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel83
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel37
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '83'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '37'
  - number: '62'
    text: |-
      1 Een afnemer die een mededeling doet als bedoeld in [artikel 62, eerste lid, van de wet][ref1], alsmede een
      afnemer die op grond van [artikel 62, tweede of vierde lid, van de wet][ref2] is aangewezen, doet mededeling aan
      het college van burgemeester en wethouders van door hem geconstateerde afwijkingen tussen:

      a. gegevens verstrekt uit de basisadministratie en gegevens waarvan hij op andere wijze kennis heeft gekregen;

      b. gegevens verstrekt uit verschillende basisadministraties.

      2 Onze Minister kan regels stellen omtrent de gevallen waarin en de wijze waarop de mededeling, bedoeld in
      [artikel 62 van de wet][ref3], wordt gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel62
      [ref3]: https://wetten.overheid.nl/BWBR0006723#Artikel62
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '62'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '62'
      - id: ref3
        bwb_id: BWBR0006723
        artikel: '62'
  - number: '63'
    text: |-
      1 Het college van burgemeester en wethouders stelt de afnemer die een mededeling als bedoeld in [artikel 62][ref1]
      heeft gedaan, zo spoedig mogelijk doch binnen vijf werkdagen na de ontvangst van de mededeling er van in kennis of
      naar aanleiding van de mededeling gegevens in de basisadministratie zijn verbeterd, aangevuld of verwijderd, dan
      wel bij het gegeven een aantekening als bedoeld in [artikel 54 van de wet][ref2] is geplaatst.

      2 Indien het college van burgemeester en wethouders besluit een aantekening als bedoeld in
      [artikel 54 van de wet][ref3] te plaatsen in verband met het doen van een onderzoek naar de juistheid van het
      gegeven, stelt het de afnemer die de mededeling heeft gedaan na afloop van het onderzoek in kennis of naar
      aanleiding van de mededeling gegevens in de basisadministratie zijn verbeterd, aangevuld of verwijderd.

      3 Onze Minister kan nadere regels stellen omtrent de wijze waarop de kennisgevingen, bedoeld in het eerste en
      tweede lid, worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006933#Artikel62
