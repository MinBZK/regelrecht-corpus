  - number: '11'
    text: Onze Minister stelt een systeembeschrijving vast.
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel11
  - number: '12'
    text: |-
      1 De systeembeschrijving geeft een beschrijving van:

      a. de inrichting en werking van de basisadministraties;

      b. de inrichting en werking van de verstrekkingsvoorziening;

      c. de inrichting en werking van het vestigingsregister;

      d. de verzending en de ontvangst van berichten als bedoeld in [artikel 16 van de wet][ref1];

      e. de verzending en ontvangst van berichten als bedoeld in [artikel 62 van de wet][ref2].

      2 De systeembeschrijving geeft tevens een beschrijving van de volgende wijzen van systematisch verstrekken van
      gegevens aan buitengemeentelijke afnemers op grond van de desbetreffende autorisatiebesluiten:

      a. verstrekkingen uit de basisadministraties:

      1°. de eenmalige verstrekking van de in een autorisatiebesluit vermelde gegevens over de door de afnemer
      aangegeven personen welke deel uitmaken van de in het autorisatiebesluit aangegeven categorie van personen, of
      over personen waarvan de in de basisadministratie vermelde gegevens voldoen aan de in het autorisatiebesluit
      genoemde voorwaarden, gevolgd door de verstrekking van de wijzigingen die zich voordoen in deze gegevens (spontane
      verstrekkingen);

      2°. de eenmalige of periodieke verstrekking van de in een autorisatiebesluit vermelde gegevens over personen
      waarvan de in de basisadministratie vermelde gegevens voldoen aan de in het autorisatiebesluit genoemde voorwaarden
      (selectie- en conditionele verstrekkingen);

      3°. de verstrekking op verzoek van de afnemer, van gegevens welke deel uitmaken van de in een autorisatiebesluit
      vermelde gegevens over, per verzoek, ten hoogste tien personen die deel uitmaken van de in het autorisatiebesluit
      bepaalde categorie van personen en van wie de gegevens of een deel van de gegevens voldoen aan de gegevens die in
      het verzoek van de afnemer zijn vermeld (verstrekkingen ad-hoc op basis van een zoekvraag).

      b. verstrekkingen uit het vestigingsregister: de verstrekking op verzoek van de afnemer, van gegevens welke
      deel uitmaken van de in een autorisatiebesluit vermelde gegevens over personen die deel uitmaken van de in het
      autorisatiebesluit bepaalde categorie van personen (verstrekkingen ad hoc).

      3 De systeembeschrijving geeft tevens een beschrijving van de gevallen waarin bijzondere gegevens, administratieve
      gegevens of administratieve gegevens in verband met de verwijsgegevens worden vernietigd, of worden verwijderd uit
      de basisadministratie, uit de verstrekkingsvoorziening of uit het vestigingsregister.

      4 De systeembeschrijving geeft tevens een beschrijving van de verzending en de ontvangst van berichten over het
      netwerk in verband met de in [artikel 58 van de wet][ref3] bedoelde mededeling over het verblijfsrecht.

      5 De systeembeschrijving geeft tevens een beschrijving van:

      a. de verzending en ontvangst van de algemene, bijzondere en verwijsgegevens aan een verantwoordelijke voor de
      verwerking van gegevens in een basisadministratie in Aruba, Curaçao, Sint Maarten of een van de openbare lichamen,
      bedoeld in [artikel 100a van de wet][ref4].

      b. de verwerking van mededelingen van een verantwoordelijke voor de verwerking van gegevens in
      een basisadministratie in Aruba, Curaçao, Sint Maarten of een van de openbare lichamen, bedoeld in
      [artikel 113, eerste lid, onder b, van de wet][ref5].

      6 De beschrijving omvat in ieder geval de in [artikel 13][ref6] en in de [paragrafen 2][ref7], [4][ref8], en
      [6][ref9] van deze afdeling genoemde onderwerpen.


