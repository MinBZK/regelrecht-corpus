        paragraaf: '3'
  - number: '9'
    text: |-
      1 Categorieën van kosten, als bedoeld in [artikel 5, tweede lid, van de wet][ref1] zijn tevens kosten in verband
      met de verzending van berichten met behulp van optische schijf of magneetschijf, tenzij deze kosten vallen onder
      [artikel 8][ref2] of de verzending verband houdt met een infrastructurele wijziging ten aanzien van een gemeente.

      2 Een college van burgemeester en wethouders kan bij de betrokkene aan wie de berichten worden verzonden in verband
      met de kosten, bedoeld in het eerste lid, een bijdrage in rekening brengen voor zover de verzending geschiedt ter
      uitvoering van een autorisatiebesluit. Bij ministeriële regeling wordt vastgesteld welke bijdragen ten hoogste in
      rekening kunnen worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006933#Artikel8
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel9
