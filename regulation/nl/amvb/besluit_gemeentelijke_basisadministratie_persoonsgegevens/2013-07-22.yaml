  - number: '67'
    text: |-
      1 Uit een basisadministratie en uit het vestigingsregister worden slechts gegevens voor historische, statistische
      of wetenschappelijke doeleinden verstrekt voor zover:

      a. het verzoek daartoe is gedaan door een instelling, bedoeld in
      [artikel 1.2 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], een onderzoeksafdeling van een
      bestuursorgaan of een onderzoeksbureau,

      b. het onderzoek een algemeen belang dient,

      c. de verwerking voor het betreffende onderzoek noodzakelijk is,

      d. de verzoeker heeft aangetoond dat de nodige voorzieningen zijn getroffen ten einde te verzekeren dat de verdere
      verwerking van de verstrekte gegevens uitsluitend geschiedt ten behoeve van het onderzoek en dat ook overigens is
      voorzien in zodanige waarborgen dat de persoonlijke levenssfeer van de betrokkene niet onevenredig wordt geschaad,
      en

      e. de gegevens slechts in geanonimiseerde vorm aan derden beschikbaar worden gesteld, tenzij de ingeschrevene
      uitdrukkelijk met de voorgenomen openbaarmaking van de hem betreffende gegevens heeft ingestemd.

      2 Onze Minister kan in een autorisatiebesluit bepalen dat de verstrekking van gegevens als bedoeld in het
      eerste lid op systematische wijze plaatsvindt. De verstrekking geschiedt in dat geval overeenkomstig hetgeen
      bij en krachtens [de wet][ref2] is bepaald ten aanzien van de systematische verstrekking van gegevens aan
      buitengemeentelijke afnemers.

      3 Onze Minister maakt slechts gebruik van zijn bevoegdheid, bedoeld in het tweede lid, voor zover:

      a. het bureau of de instelling heeft aangetoond dat het voor een goede uitvoering van het onderzoek noodzakelijk is
      dat de verstrekking op systematische wijze plaatsvindt,

      b. aan de voorwaarden, genoemd in het eerste lid, is voldaan, en

      c. het College bescherming persoonsgegevens over het verzoek is gehoord.

      4 De verstrekking van gegevens uit de basisadministratie en uit het vestigingsregister aan het Centraal Bureau
      voor de Statistiek geschiedt overeenkomstig hetgeen bij en krachtens [de wet][ref3] is bepaald ten aanzien van
      buitengemeentelijke afnemers.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1.2
      [ref2]: https://wetten.overheid.nl/BWBR0006723
      [ref3]: https://wetten.overheid.nl/BWBR0006723
