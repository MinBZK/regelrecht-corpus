  - number: '13'
    text: |-
      1 Onze Minister stelt de inhoud vast van de in de systeembeschrijving beschreven tabellen ten behoeve van de
      ordening en de codering van de gegevens in de basisadministraties, in de verstrekkingsvoorziening en in het
      vestigingsregister.

      2 Onze Minister stelt de inhoud vast van de in de systeembeschrijving beschreven tabel ten behoeve van:

      a. de op grond van [artikel 12, tweede lid][ref1], beschreven verstrekkingen uit de basisadministraties en uit
      het vestigingsregister;

      b. de in [artikel 115, tweede lid, van de wet][ref2] bedoelde verstrekking van inlichtingen door de colleges van
      burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0006933#Artikel12
