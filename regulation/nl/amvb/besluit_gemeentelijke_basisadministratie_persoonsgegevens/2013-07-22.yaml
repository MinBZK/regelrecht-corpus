  - number: '3'
    text: |-
      In deze afdeling en de daarop berustende bepalingen wordt verstaan onder:

      a. de betrokkene: de betrokkene, bedoeld in [artikel 5, eerste lid, van de wet][ref1];

      b. de bijdrage: de bijdrage van de betrokkene, bedoeld in [artikel 5, tweede lid, van de wet][ref2];

      c. een jaar: een kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel5
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel3
