        bwb_id: BWBR0006723
        artikel: '113'
  - number: '64'
    text: |-
      1 De in [artikel 91, eerste lid, van de wet][ref1] bedoelde wijzen van systematisch verstrekken van gegevens uit
      de basisadministraties aan buitengemeentelijke afnemers betreffen, behoudens het tweede lid, de wijzen die op grond
      van [artikel 12, tweede lid][ref2], zijn beschreven in de systeembeschrijving.

      2 Op grond van een gezamenlijk verzoek van gemeenten en van een buitengemeentelijke afnemer, kan Onze Minister
      bepalen dat de systematische verstrekking van gegevens uit de basisadministraties door deze gemeenten aan
      de afnemer op een andere wijze plaatsvindt. Het autorisatiebesluit bepaalt in dat geval op welke wijze de
      systematische verstrekking plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel91
      [ref2]: https://wetten.overheid.nl/BWBR0006933#Artikel12
