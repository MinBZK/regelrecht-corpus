        afdeling: '3'
  - number: '99'
    text: |-
      De artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel99
  - number: '100'
    text: 'Dit besluit wordt aangehaald als: Besluit gemeentelijke basisadministratie persoonsgegevens.'
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel100
