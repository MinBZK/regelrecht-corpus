  - number: 68e
    text: |-
      De systematische verstrekking van gegevens uit de basisadministraties op grond van [artikel 99 van de wet][ref1]
      vindt slechts plaats op de wijzen die op grond van [artikel 12, tweede lid][ref2], zijn beschreven in
      de systeembeschrijving. Onze Minister kan, in afwijking van het hiervoor gestelde, ten aanzien van de in
      [artikel 68b, onder e tot en met h][ref3], [artikel 68c1, onder b][ref4], en [artikel 68d1][ref5] bedoelde
      bijzondere derden, bij het nemen van een autorisatiebesluit bepalen dat de systematische verstrekking van gegevens
      uit de basisadministratie op een in dat besluit beschreven andere wijze plaatsvindt.


