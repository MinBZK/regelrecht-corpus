  - number: '69'
    text: |-
      1 Onze Minister bepaalt welke berichten voor de toepassing van dit artikel worden aangemerkt als
      afstemmingsberichten.

      2 Als afstemmingsbericht wordt slechts aangemerkt een bericht:

      a. dat benodigd is voor de verstrekking van gegevens ter afstemming van de gegevens van een buitengemeentelijke
      afnemer of bijzondere derde op de gegevens in de basisadministratie,

      b. waarvan de verzending en ontvangst geschiedt op een wijze die op grond van
      [artikel 12, eerste lid, onder c][ref1], is beschreven in de systeembeschrijving, en

      c. dat als doel heeft de in het vierde lid bedoelde verstrekking van gegevens mogelijk te maken.

      3 Voor afstemmingsberichten brengt Onze Minister in afwijking van [hoofdstuk 1, afdeling 3][ref2], bij de
      afnemers en bijzondere derden een tarief per geregistreerde persoon in rekening. Voor afstemmingsberichten
      met gebruikmaking van optische schijf of magneet schijf, brengt de betrokken gemeente in afwijking van
      [hoofdstuk 1, afdeling 3][ref3], bij de afnemers en bijzondere derden een bijzonder tarief in rekening.

      4 Onder geregistreerde persoon als bedoeld in het derde lid wordt verstaan de persoon over wie de
      afnemer of bijzondere derde verzoekt gegevens verstrekt te krijgen op de wijze die op grond van
      [artikel 12, tweede lid, onderdeel a, onder 1°][ref4], is beschreven in de systeembeschrijving.

      5 De kosten in verband met de afstemming bestaan uit:

      a. de kosten die naar verwachting zijn verbonden aan de verzending en ontvangst van afstemmingsberichten over het
      netwerk, en

      b. de kosten in verband met een vergoeding per bij de afstemming betrokken gemeente voor de verzending en ontvangst
      van afstemmingsberichten op optische schijf of magneetschijf.

      6 Het tarief wordt vastgesteld bij regeling van Onze Minister. Het tarief wordt op een zodanige wijze vastgesteld
      dat door het totaal van de in rekening te brengen tarieven de kosten, bedoeld in het vijfde lid, worden gedekt.

      7 De regeling, bedoeld in het zesde lid, wordt niet vastgesteld dan nadat de gemeenten en de betrokken afnemers en
      bijzondere derden de mogelijkheid is geboden hun zienswijze naar voren te brengen.

      8 Het autorisatiebesluit bepaalt met betrekking tot de afnemer of bijzondere derde het aantal geregistreerde
      personen als bedoeld in het vierde lid en het aantal afstemmingsberichten dat door de afnemer of bijzondere derde
      over het netwerk wordt verzonden en ontvangen.

      9 Onze Minister stelt een raming vast van de verwachte kosten, alsmede van het verwachte aantal
      afstemmingsberichten.


      [ref1]: https://wetten.overheid.nl/BWBR0006933#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0006933#Hoofdstuk1
      [ref3]: https://wetten.overheid.nl/BWBR0006933#Hoofdstuk1
      [ref4]: https://wetten.overheid.nl/BWBR0006933#Artikel12
