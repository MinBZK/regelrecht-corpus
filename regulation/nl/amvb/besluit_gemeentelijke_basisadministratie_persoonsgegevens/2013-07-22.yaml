  - number: '68'
    text: |-
      1 De ambtenaar van de burgerlijke stand bij wie aangifte is gedaan van een levenloos geboren of voor de aangifte
      overleden kind verstrekt, indien ten aanzien van dat kind geen geboorteakte wordt opgemaakt, aan het college van
      burgemeester en wethouders van zijn gemeente zo spoedig mogelijk de door het Centraal Bureau voor de Statistiek
      benodigde gegevens betreffende dat kind.

      2 De ambtenaar van de burgerlijke stand maakt bij de in het eerste lid bedoelde gegevensverstrekking gebruik van
      een formulier, waarvan het model als [bijlage 5][ref1] bij dit besluit is gevoegd.

      3 Onze Minister kan, in overeenstemming met Onze Minister van Economische Zaken, Landbouw en Innovatie, regels
      stellen omtrent de verzending van de gegevens aan het Centraal Bureau voor de Statistiek.


      [ref1]: https://wetten.overheid.nl/BWBR0006933
