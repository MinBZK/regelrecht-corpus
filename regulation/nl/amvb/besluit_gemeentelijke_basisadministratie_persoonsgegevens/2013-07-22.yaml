        artikel: '103'
      - id: ref5
        bwb_id: BWBR0006723
        artikel: '104'
  - number: '26'
    text: |-
      [De artikelen 27][ref1] en [28][ref2] zijn uitsluitend van toepassing op de verantwoordelijke voor de verwerking
      van gegevens in een basisadministratie van een gemeente ten aanzien waarvan een herindelingsregeling als bedoeld in
      [artikel 1, onder ][ref3] is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006933#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0006933#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0003718#Artikel1
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0006933
        artikel: '27'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0006933
        artikel: '28'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0003718
        artikel: '1'
  - number: '27'
    text: |-
      De verantwoordelijke voor de verwerking van gegevens in een basisadministratie draagt zorg dat de uitschrijving en
      de inschrijving, bedoeld in [artikel 71, eerste lid, van de Wet algemene regels herindeling][ref1], geschieden op
      een wijze die overeenstemt met de systeembeschrijving.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel71
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '71'
  - number: '28'
    text: |-
      De verantwoordelijke voor de verwerking van gegevens in een basisadministratie van een gemeente die op grond van
      een herindelingsregeling wordt opgeheven, draagt zorg dat:

      a. de in de basisadministratie opgenomen persoonslijsten van personen die anders dan als ingezetene zijn
      ingeschreven,

      b. de in de basisadministratie opgenomen persoonslijsten van personen die als ingezetene zonder adres zijn
      ingeschreven, en

      c. de in de basisadministratie opgenomen verwijsgegevens,

      worden overgedragen aan de gemeente, bedoeld in
      [artikel 71, derde lid, van de Wet algemene regels herindeling][ref1], op een wijze die overeenstemt met de
      systeembeschrijving.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel71
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '71'
  - number: '29'
    text: |-
      Het gemeentelijke geautomatiseerde systeem stelt de verantwoordelijke voor de verwerking van gegevens in een
      basisadministratie in staat om in overeenstemming met de systeembeschrijving uitvoering te geven aan de in de
      [artikelen 15 tot en met 28][ref1] bedoelde taken.


      [ref1]: https://wetten.overheid.nl/BWBR0006933#Artikel15
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0006933
        artikel: '15'
        hoofdstuk: '1'
        paragraaf: '2'
        afdeling: '4'
  - number: '30'
    text: |-
      Het gemeentelijke geautomatiseerde systeem biedt de in de systeembeschrijving beschreven voorzieningen ten behoeve
      van een onderzoek als bedoeld in de [artikelen 9][ref1], [11][ref2] en [13 van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0006723#Artikel13
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0006723
        artikel: '13'
  - number: '31'
    text: |-
      De verantwoordelijke voor de verwerking van gegevens in een basisadministratie draagt zorg voor de nodige
      voorzieningen van technische en organisatorische aard ter beveiliging van de in de basisadministratie vermelde
      gegevens tegen verlies of aantasting van deze gegevens en tegen onbevoegde kennisneming, wijziging of verstrekking
      van deze gegevens. Deze voorzieningen omvatten ten minste de volgende onderwerpen:

      a. maatregelen gericht op personen die werkzaam zijn voor de verantwoordelijke;

      b. maatregelen gericht op de toegang tot gebouwen en ruimten waar in de basisadministratie vermelde gegevens
      aanwezig zijn;

      c. maatregelen gericht op een deugdelijke werking en beveiliging van de apparatuur en programmatuur die het
      gemeentelijke geautomatiseerde systeem vormen;

      d. maatregelen gericht op het beheer van de gegevens die in de basisadministratie zijn vermeld;

      e. maatregelen voor het geval de geheimhouding van in de basisadministratie vermelde gegevens is geschaad;

      f. maatregelen bij calamiteiten.
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel31
  - number: '32'
    text: |-
      1 De buitengemeentelijke afnemer draagt zorg dat zijn geautomatiseerde systeem in overeenstemming met de
      systeembeschrijving geautomatiseerd berichten over het netwerk verzendt en ontvangt ten behoeve van de op grond van
      [artikel 12, tweede lid][ref1], beschreven verstrekkingen uit de basisadministraties en uit het vestigingsregister.

      2 De buitengemeentelijke afnemer draagt zorg dat zijn geautomatiseerde systeem een vrij bericht over het netwerk
      verzendt en ontvangt op een wijze die overeenstemt met de systeembeschrijving.

      3 De in het eerste en het tweede lid bedoelde verplichtingen zijn slechts van toepassing indien
      de buitengemeentelijke afnemer een toestemming heeft tot uitvoering van de regels, bedoeld in
      [artikel 16, eerste lid, van de wet][ref2] en voor zover de desbetreffende wijzen van systematische
      gegevensverstrekking zijn vastgelegd in het autorisatiebesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0006933#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel16
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0006933
        artikel: '12'
        hoofdstuk: '1'
        paragraaf: '1'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '16'
  - number: '33'
    text: |-
      1 De buitengemeentelijke afnemer draagt zorg dat zijn geautomatiseerde systeem in overeenstemming met de
      systeembeschrijving ten behoeve van de op grond van [artikel 12, tweede lid][ref1], beschreven verstrekkingen uit
      de basisadministraties:

      a. geautomatiseerd berichten op optische schijf of magneetschijf vastlegt;

      b. geautomatiseerd berichten ontvangt die op optische schijf of magneetschijf zijn vastgelegd.

      2 De buitengemeentelijke afnemer draagt zorg dat hij de optische schijf of de magneetschijf verzendt of in
      ontvangst neemt op een wijze die overeenstemt met de systeembeschrijving.

      3 De verplichtingen, bedoeld in het eerste en het tweede lid, zijn slechts van toepassing voor zover de in deze
      leden bedoelde wijze van verzending en ontvangst van berichten en de desbetreffende wijzen van systematische
      gegevensverstrekking in het autorisatiebesluit zijn vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0006933#Artikel12
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel33
    references:
