  - number: '81'
    text: |-
      1 De aanleg van een persoonslijst op grond van [hoofdstuk 5, afdeling 2, paragraaf 1, van de wet](onbekend),
      geschiedt op een wijze die overeenstemt met de systeembeschrijving.

      2 De systeembeschrijving omvat tevens het in het eerste lid genoemde onderwerp.
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel81
  - number: '82'
    text: |-
      Bij de aanleg van een persoonslijst in een geval als bedoeld in het [eerste lid van artikel 123 van de wet][ref1]
      behoeven, in afwijking van dat lid, de in [bijlage 7][ref2] bij dit besluit vermelde bijzondere en administratieve
      gegevens niet op de persoonslijst te worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel123
      [ref2]: https://wetten.overheid.nl/BWBR0006933
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '123'
      - id: ref2
        bwb_id: BWBR0006933
  - number: '83'
    text: |-
      De in [artikel 127, eerste lid, van de wet][ref1] bedoelde verwijsgegevens en administratieve gegevens in verband
      met de verwijsgegevens van de in dat lid bedoelde personen, worden verwerkt in het vestigingsregister.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel127
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '127'
  - number: '84'
    text: |-
      1 De verantwoordelijke voor de verwerking van gegevens in een basisadministratie draagt zorg dat het gemeentelijke
      geautomatiseerde systeem ten behoeve van de uitvoering van [artikel 83][ref1] in overeenstemming met de
      systeembeschrijving:

      a. geautomatiseerd berichten op optische schijf of magneetschijf vastlegt;

      b. geautomatiseerd berichten over het netwerk verzendt en ontvangt.

      2 De verantwoordelijke, bedoeld in het eerste lid, draagt zorg dat hij de optische schijf of de magneetschijf
      verzendt op een wijze die overeenstemt met de systeembeschrijving.

      3 Het gemeentelijke geautomatiseerde systeem stelt de verantwoordelijke, bedoeld in het eerste lid, in staat om in
      overeenstemming met de systeembeschrijving uitvoering te geven aan de in het eerste lid bedoelde taken.


      [ref1]: https://wetten.overheid.nl/BWBR0006933#Artikel83
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0006933
        artikel: '83'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '85'
    text: |-
      1 De verantwoordelijke voor de verwerking van gegevens in het vestigingsregister draagt zorg dat het
      geautomatiseerde systeem van het vestigingsregister ten behoeve van de uitvoering van [artikel 83][ref1] in
      overeenstemming met de systeembeschrijving:

      a. geautomatiseerd berichten op optische schijf of magneetschijf ontvangt;

      b. geautomatiseerd berichten over het netwerk verzendt en ontvangt.

      2 De verantwoordelijke, bedoeld in het eerste lid, draagt zorg dat hij de optische schijf of de magneetschijf in
      ontvangst neemt op een wijze die overeenstemt met de systeembeschrijving.

      3 Het geautomatiseerde systeem van het vestigingsregister stelt de verantwoordelijke, bedoeld in het eerste lid, in
      staat om in overeenstemming met de systeembeschrijving uitvoering te geven aan de in het eerste lid bedoelde taken.


      [ref1]: https://wetten.overheid.nl/BWBR0006933#Artikel83
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0006933
        artikel: '83'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '86'
    text: |-
      De systeembeschrijving omvat tevens de in de [artikelen 84][ref1] en [85][ref2] genoemde onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0006933#Artikel84
      [ref2]: https://wetten.overheid.nl/BWBR0006933#Artikel85
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0006933
        artikel: '84'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006933
        artikel: '85'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '87'
    text: |-
      De in [artikel 127, eerste lid, van de wet][ref1] bedoelde gegevens over de gemeente van inschrijving blijven
      opgenomen naar de juiste staat van die gegevens bij de inwerkingtreding van [artikel 121 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel127
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel121
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '127'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '121'
  - number: '88'
    text: |-
      1 De in [artikel 127, eerste lid, onder ][ref1] bedoelde administratieve gegevens in verband met de verwijsgegevens
      zijn vermeld in [bijlage 6][ref2] bij dit besluit.

      2 [Artikel 70, tweede lid][ref3], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel127
      [ref2]: https://wetten.overheid.nl/BWBR0006933
      [ref3]: https://wetten.overheid.nl/BWBR0006933#Artikel70
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel88
    references:
      - id: ref1
