  - number: 68a
    text: |-
      1 Onze Minister kan in een autorisatiebesluit bepalen dat op systematische wijze gegevens worden verstrekt uit de
      basisadministratie aan een bijzondere derde.

      2 Onze Minister maakt slechts gebruik van zijn bevoegdheid voor zover:

      a. de gegevens noodzakelijk zijn voor de vervulling van de taak van de bijzondere derde, en

      b. het voor de goede vervulling van de taak noodzakelijk is dat de verstrekking op systematische wijze plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel68a
  - number: 68b
    text: |-
      Bijzondere derde als bedoeld in [artikel 99, eerste lid, van de wet][ref1] is:

      a. een pensioenfonds als bedoeld in [bijlage 5a, onder a][ref2], bij dit besluit, voor zover de behoefte van
      het fonds aan gegevens uit de basisadministraties haar grond vindt in de uitvoering van een algemeen verbindend
      voorschrift met betrekking tot een pensioenregeling;

      b. een premiepensioeninstelling als bedoeld in [bijlage 5a, onder b][ref3], bij dit besluit, voor zover de behoefte
      van de instelling aan gegevens uit de basisadministraties haar grond vindt in de uitvoering van pensioenregelingen,
      waarmee de premiepensioeninstelling overeenkomstig een wettelijke regeling is belast;

      c. een verzekeraar als bedoeld in [bijlage 5a, onder c][ref4], bij dit besluit, voor zover de behoefte van de
      verzekeraar aan gegevens uit de basisadministraties haar grond vindt in de uitvoering van pensioenregelingen,
      waarmee de verzekeraar overeenkomstig een wettelijke regeling betreffende pensioenregelingen is belast;

      d. een spaarfonds als bedoeld in [bijlage 5a, onder d][ref5], bij dit besluit, voor zover de behoefte van het fonds
      aan gegevens uit de basisadministraties haar grond vindt in de uitvoering van een algemeen verbindend voorschrift
      met betrekking tot een spaarregeling die is gericht op een uitkering bij wijze van oudedagsvoorziening;

      e. een fonds tot uitvoering van een regeling inzake vervroegd uittreden, als bedoeld in
      [bijlage 5a, onder e][ref6], bij dit besluit, voor zover de behoefte van het fonds aan gegevens uit de
      basisadministraties voortvloeit uit:

      1°. de uitvoering van een algemeen verbindend voorschrift inzake vervroegd uittreden, of

      2°. De verwerking van persoonsgegevens als bedoeld in de [Wet bescherming persoonsgegevens][ref7] met betrekking
      tot een regeling inzake vervroegd uittreden;

      f. een bank als bedoeld in [bijlage 5a, onder f][ref8], bij dit besluit, voor zover de behoefte van de bank aan
      gegevens uit de basisadministraties haar grond vindt in het honoreren van aanspraken van gerechtigden op, al dan
      niet op termijn, opvorderbare gelden;

      g. een effecteninstelling als bedoeld in [bijlage 5a, onder g][ref9], bij dit besluit, voor zover de behoefte
      van de instelling aan gegevens uit de basisadministraties haar grond vindt in het honoreren van aanspraken van
      gerechtigden op geld of effecten;

      h. een verzekeraar als bedoeld in [bijlage 5a, onder h][ref10], bij dit besluit, voor zover de behoefte van
      de verzekeraar aan gegevens uit de basisadministraties haar grond vindt in het honoreren van aanspraken van
      gerechtigden op een uitkering of dienst;

      i. een beleggingsinstelling als bedoeld in [bijlage 5a, onder i][ref11], bij dit besluit, voor zover de behoefte
      van de instelling aan gegevens uit de basisadministraties haar grond vindt in het honoreren van aanspraken van
      gerechtigden op geld of effecten;

      j. een zorgverzekeraar als bedoeld in [bijlage 5a, onder j][ref12], bij dit besluit, voor zover de behoefte
      van de verzekeraar aan gegevens uit de basisadministraties haar grond vindt in de uitvoering van de
      [Zorgverzekeringswet][ref13].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel99
