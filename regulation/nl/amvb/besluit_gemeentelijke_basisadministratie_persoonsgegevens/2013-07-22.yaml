  - number: 68c1
    text: |-
      Bijzondere derden als bedoeld in [artikel 99, derde lid, van de wet][ref1] zijn:

      a. een rechtspersoon die van Onze Minister van Volksgezondheid, Welzijn en Sport subsidie ontvangt voor
      bevolkingsonderzoek naar borstkanker of baarmoederhalskanker, voor zover de behoefte van de rechtspersoon aan
      gegevens uit de basisadministraties haar grond vindt in de verwerking van persoonsgegevens ten behoeve van de
      uitvoering van dat bevolkingsonderzoek;

      b. een rechtspersoon die in verband met zijn werkzaamheden op het terrein van de maatschappelijke zorg, bedoeld
      in [artikel 2, onderdeel d, van de Kaderwet VWS-subsidies][ref2] van rijkswege subsidie ontvangt, voor zover
      de behoefte van de rechtspersoon aan gegevens uit de basisadministraties haar grond vindt in de verwerking van
      persoonsgegevens ten behoeve van het opsporen van personen in het kader van de gesubsidieerde werkzaamheden.

      c. een instelling als bedoeld in [artikel 1, onderdeel f, van de Wet toelating zorginstellingen][ref3], voor
      zover de behoefte van de instelling aan gegevens uit de basisadministratie haar grond vindt in de verwerking van
      persoonsgegevens ten behoeve van de gezondheidszorgverlening aan patiënten in die instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel99
      [ref2]: https://wetten.overheid.nl/BWBR0009455#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0018906#Artikel1
