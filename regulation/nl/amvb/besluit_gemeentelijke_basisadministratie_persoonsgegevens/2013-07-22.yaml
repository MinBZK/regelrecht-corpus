  - number: 68d
    text: |-
      1 De bijzondere derde, genoemd in [artikel 99, vierde lid, van de wet][ref1] is slechts bijzondere derde, voor
      zover de behoefte van de derde aan gegevens uit de basisadministraties haar grond vindt in de verwerking van
      persoonsgegevens betreffende overleden personen.

      2 Onze Minister maakt ten aanzien van de bijzondere derde, bedoeld in het eerste lid, slechts gebruik van de in
      [artikel 68a][ref2] bedoelde bevoegdheid indien:

      a. de bijzondere derde ten aanzien van de verwerking, bedoeld in het eerste lid, een regeling heeft getroffen ter
      bescherming van de persoonlijke levenssfeer;

      b. de verwerking van de uit de basisadministratie verkregen gegevens van een in leven zijnde persoon op
      schriftelijk verzoek onverwijld door de bijzondere derde wordt beëindigd; en

      c. in de regeling, bedoeld in onderdeel *a*, de in onderdeel *b* genoemde voorwaarde is vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel99
