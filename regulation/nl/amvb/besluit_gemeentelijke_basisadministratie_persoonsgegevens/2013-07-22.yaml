        artikel: '16'
  - number: '40'
    text: |-
      De verantwoordelijke voor de verwerking van gegevens in het vreemdelingenadministratiesysteem, draagt zorg dat de
      in [artikel 58 van de wet][ref1] bedoelde mededeling over het verblijfsrecht van de vreemdeling in overeenstemming
      met de systeembeschrijving geautomatiseerd over het netwerk wordt ontvangen en verzonden.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel58
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '58'
  - number: 40a
    text: |-
      De in [artikel 34, tweede lid][ref1], en [bijlage I, onderdeel 5, van de wet](onbekend) bedoelde algemene gegevens
      over het verblijfsrecht van een vreemdeling zijn vermeld in [bijlage 1a][ref2] bij dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0006933
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel40a
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0006933
  - number: '41'
    text: Onze Minister kan nadere regels stellen omtrent de onderwerpen die geregeld zijn in deze afdeling.
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel41
  - number: '42'
    text: |-
      De regels, bedoeld in [artikel 41][ref1] en de systeembeschrijving worden niet vastgesteld dan nadat de deelnemers
      aan het gebruikersoverleg de gelegenheid is geboden hun zienswijze omtrent het desbetreffende voorstel naar voren
      te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0006933#Artikel41
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0006933
        artikel: '41'
        hoofdstuk: '1'
        paragraaf: '7'
        afdeling: '4'
  - number: '43'
    text: |-
      1 De systeembeschrijving wordt niet gewijzigd dan nadat door Onze Minister na overleg met de deelnemers aan het
      gebruikersoverleg overeenkomstig [bijlage 1b][ref1] een tegemoetkoming is vastgesteld in de kosten die de gemeenten
      in verband met de wijziging moeten maken, voor zover deze kosten in redelijkheid niet ten laste van de gemeenten
      kunnen komen.

      2 De ingevolge het eerste lid vastgestelde tegemoetkoming in de kosten wordt overeenkomstig [bijlage 1c][ref2] in
      rekening gebracht bij de betrokken afnemers, tenzij reeds anderszins in vergoeding van de kosten is voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0006933
      [ref2]: https://wetten.overheid.nl/BWBR0006933
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0006933
      - id: ref2
        bwb_id: BWBR0006933
  - number: '44'
    text: |-
      Van de bevoegdheid tot het wijzigen van de systeembeschrijving, met uitzondering van wijzigingen waarbij toepassing
      wordt gegeven aan [artikel 13][ref1] of [22 van de wet][ref2], kan mandaat worden verleend aan een functionaris van
      het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel22
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '22'
  - number: '45'
    text: |-
      De bepalingen in deze afdeling over een buitengemeentelijke afnemer zijn van overeenkomstige toepassing op
      een bijzondere derde, met dien verstande dat als de bepaling spreekt over het geautomatiseerde systeem van de
      afnemer, dit betrekking heeft op het geautomatiseerde systeem waarmee de bijzondere derde uitvoering wil geven, of
      uitvoering geeft, aan de regels, bedoeld in [artikel 16 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel16
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '16'
  - number: '46'
    text: |-
      Onze Minister kan regels stellen omtrent de bewaring van geschriften en andere bescheiden, ongeacht hun vorm, die
      de verantwoordelijke voor de verwerking van gegevens in de basisadministratie gebruikt of heeft gebruikt in verband
      met de verwerking van gegevens in de basisadministratie.
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel46
  - number: '47'
    text: |-
      1 Onze Minister stelt de tijdstippen vast, bedoeld in de [artikelen 6, tweede lid][ref1], en
      [8, eerste lid, van de wet][ref2].

      2 Onze Minister gaat niet over tot vaststelling van een tijdstip dan nadat de deelnemers aan het gebruikersoverleg
      de gelegenheid is geboden hun zienswijze omtrent het desbetreffende voorstel naar voren te brengen.

      3 Een tijdstip wordt bekendgemaakt in de *Staatscourant*.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel8
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '8'
  - number: '48'
    text: |-
      1 Bij de indiening van een verzoek om toestemming als bedoeld in [artikel 7][ref1] of [artikel 17 van de wet][ref2]
      maakt het college van burgemeester en wethouders, de buitengemeentelijke afnemer of de bijzondere derde gebruik van
      een door Onze Minister vastgesteld formulier.

      2 Een verzoek om toestemming dat op grond van
      [artikel 22 van het Besluit voorbereiding gemeentelijke basisadministratie persoonsgegevens][ref3] is ingediend,
      wordt aangemerkt als een verzoek dat is ingediend overeenkomstig het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0006933#Artikel22
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel48
    references:
      - id: ref1
