    text: |-
      Bij de indiening van een verzoek tot het nemen van een autorisatiebesluit maakt de bijzondere derde gebruik van een
      door Onze Minister vastgesteld formulier.
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel68f
  - number: 68g
    text: |-
      De bijzondere derde gebruikt de uit de basisadministraties afkomstige gegevens slechts ter uitvoering van de taak,
      waarvoor ze krachtens het autorisatiebesluit zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel68g
  - number: 68h
    text: |-
      1 Indien een persoon aangifte van vertrek heeft gedaan en daarbij meldt te gaan verblijven in Aruba, Curaçao,
      Sint Maarten of een van de openbare lichamen, verstrekt de verantwoordelijke voor de verwerking van gegevens in de
      basisadministratie waar de betrokken persoon laatstelijk als ingezetene was ingeschreven, de gegevens als bedoeld
      in [artikel 114a, eerste lid, van de wet][ref1] aan de verantwoordelijke voor de verwerking van gegevens in het
      vestigingsregister.

      2 De verstrekking, bedoeld in het eerste lid, geschiedt op de wijze als beschreven in de systeembeschrijving.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel114a
    url: https://wetten.overheid.nl/BWBR0006933/2013-07-22#Artikel68h
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: 114a
  - number: 68i
    text: |-
      1 Over de verstrekking van gegevens uit de basisadministratie aan de onder a en b bedoelde afnemers wordt geen
      informatie verstrekt aan een andere afnemer, een derde of de ingeschrevene, voor zover dit noodzakelijk is in het
      belang van de veiligheid van de staat of de voorkoming, opsporing en vervolging van strafbare feiten en het een
      verstrekking van gegevens betreft aan:

      a. de politie voor zover de verstrekking noodzakelijk is voor de strafrechtelijke handhaving van de rechtsorde of
      de handhaving van de openbare orde als bedoeld in [artikel 3 van de Politiewet 2012][ref1];

      b. de Koninklijke marechaussee voor zover de verstrekking noodzakelijk is voor de uitvoering van de in
      [artikel 4, eerste lid, van de Politiewet 2012][ref2] bedoelde taken.

      2 De verantwoordelijke voor de verwerking van gegevens in de basisadministratie draagt zorg dat over verstrekkingen
      als bedoeld in het eerste lid geen aantekening wordt gehouden.

      3 De verantwoordelijke voor de verwerking van gegevens in de basisadministratie draagt er zorg voor dat van
      degenen, die zijn belast met de verwerking van de in het eerste lid bedoelde gegevens in zijn basisadministratie,
      uitsluitend die personen kennis kunnen nemen van de desbetreffende gegevens, die daartoe uitdrukkelijk zijn
      geautoriseerd en voor zover die kennisneming noodzakelijk is voor:

      a. de uitoefening van een recht van de burger als bedoeld in de [artikelen 78][ref3] en [79 van de wet][ref4],

      b. het verrichten van werkzaamheden in het kader van het technische beheer van de basisadministratie, of

      c. de uitvoering van andere taken die zijn of worden vastgesteld bij een ministeriële regeling, over het ontwerp
      waarvan het College bescherming persoonsgegevens is gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0006723#Artikel78
      [ref4]: https://wetten.overheid.nl/BWBR0006723#Artikel79
