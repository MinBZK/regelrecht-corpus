        bwb_id: BWBR0003835
        artikel: '2'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003835
        artikel: '2'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0003835
        artikel: '3'
        hoofdstuk: II
  - number: '11'
    text: |-
      In geval van wijziging van de voorschriften, bedoeld in [artikel 5][ref1], die ten grondslag hebben gelegen aan
      een goedkeuring als bedoeld in [artikel 2, onder a][ref2], of in [artikel 3, onder a][ref3], kunnen Onze Ministers
      bepalen dat bij het verstrijken van een door hen te stellen termijn die goedkeuring ophoudt te gelden. In een
      dergelijk geval wordt een overgangsregeling getroffen op dezelfde wijze als is voorzien in [artikel 12][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0003835#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003835#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003835#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0003835#Artikel12
    url: https://wetten.overheid.nl/BWBR0003835/2007-01-01#Artikel11
