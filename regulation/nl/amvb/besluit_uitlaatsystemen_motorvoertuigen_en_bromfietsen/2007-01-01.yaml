        artikel: '2'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003835
        artikel: '3'
        hoofdstuk: II
  - number: 12a
    text: |-
      Het in [artikel 3, onder b][ref1], gestelde verbod is tot 17 juni 1999 niet van toepassing op uitlaatsystemen die
      behoren tot een type dat blijkens een certificaat als bedoeld in [artikel 3][ref2] van [richtlijn nr. 78/1015/EEG]
      (31978L1015) van de Raad van de Europese Gemeenschappen van 23 november 1978 inzake de onderlinge aanpassing van
      de wetgevingen der Lid-Staten betreffende het toegestane geluidsniveau en de uitlaatinrichting van motorrijwielen
      (PbEG L 349) voldoet aan de voorschriften van die richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003835#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003835#Artikel3
    url: https://wetten.overheid.nl/BWBR0003835/2007-01-01#Artikel12a
