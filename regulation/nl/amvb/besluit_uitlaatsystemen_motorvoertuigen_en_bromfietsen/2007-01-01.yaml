        artikel: '12'
        hoofdstuk: VII
  - number: '12'
    text: |-
      1 Met betrekking tot uitlaatsystemen behorende tot een type dat reeds voor het in werking treden van dit besluit in
      de handel was, gelden de [artikelen 2][ref1] en [3][ref2] voor wat betreft het verbod om:

      a. te vervaardigen of in te voeren, behoudens het in het tweede lid bepaalde, met ingang van 1 april 1986;

      b. in voorraad te hebben, te koop aan te bieden, af te leveren of te vervoeren, met ingang van 1 oktober 1987
      voor wat betreft fabrikanten, importeurs en groothandel en met ingang van 1 oktober 1988 voor wat betreft de
      detailhandel.

      2 Voor uitlaatsystemen als bedoeld in de aanhef van het eerste lid, geldt het verbod om in te voeren van voor 1
      april 1986 vervaardigde uitlaatsystemen met ingang van 1 oktober 1987.


      [ref1]: https://wetten.overheid.nl/BWBR0003835#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003835#Artikel3
    url: https://wetten.overheid.nl/BWBR0003835/2007-01-01#Artikel12
    references:
      - id: ref1
