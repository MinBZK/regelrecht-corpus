        hoofdstuk: II
  - number: '5'
    text: |-
      Onze Minister stelt voorschriften vast, aan de hand waarvan de in [artikel 2, onder a][ref1], en de in
      [artikel 3][ref2] bedoelde keuring wordt verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0003835#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003835#Artikel3
    url: https://wetten.overheid.nl/BWBR0003835/2007-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003835
        artikel: '2'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003835
        artikel: '3'
        hoofdstuk: II
  - number: '6'
    text: |-
      De aanvraag voor een keuring als bedoeld in [artikel 2, onder a][ref1], of [artikel 3, onder a][ref2], wordt
      slechts in behandeling genomen, indien de aanvrager de bepalingen van het in [artikel 10][ref3] bedoelde, voor die
      keuring geldende reglement in acht neemt.


      [ref1]: https://wetten.overheid.nl/BWBR0003835#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003835#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0003835#Artikel10
    url: https://wetten.overheid.nl/BWBR0003835/2007-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003835
        artikel: '2'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003835
        artikel: '3'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0003835
        artikel: '10'
        hoofdstuk: V
  - number: '7'
    text: |-
      Goedkeuring van een type wordt geweigerd indien het uitlaatsysteem niet beantwoordt aan de krachtens
      [artikel 5][ref1] met betrekking tot de keuring van de betrokken categorie uitlaatsystemen geldende voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0003835#Artikel5
    url: https://wetten.overheid.nl/BWBR0003835/2007-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003835
        artikel: '5'
        hoofdstuk: III
  - number: '10'
    text: |-
      1 Onze Ministers stellen voor elke der door hen op grond van [artikel 2, onder a, of 3][ref1] aangewezen
      keuringsinstanties een reglement vast ter zake van de ingevolge dit besluit te verrichten keuringen.

      2 Een reglement als bedoeld in het eerste lid bevat in elk geval bepalingen omtrent:

      a. de bij de aanvraag voor een keuring als bedoeld in [artikel 2, onder a][ref2], of [artikel 3, onder a][ref3], te
      verstrekken gegevens;

      b. de wijze waarop en de staat waarin het uitlaatsysteem tot de keuring ter beschikking dient te worden gesteld;

      c. de voor de keuring verschuldigde vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0003835#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003835#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003835#Artikel3
    url: https://wetten.overheid.nl/BWBR0003835/2007-01-01#Artikel10
    references:
