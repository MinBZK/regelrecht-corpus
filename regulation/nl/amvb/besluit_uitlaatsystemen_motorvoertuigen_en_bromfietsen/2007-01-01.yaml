$id: besluit_uitlaatsystemen_motorvoertuigen_en_bromfietsen
regulatory_layer: AMVB
publication_date: '2015-09-04'
valid_from: '2007-01-01'
bwb_id: BWBR0003835
url: https://wetten.overheid.nl/BWBR0003835/2007-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 25 januari 1985,
    MJZ 2515017, gedaan in overeenstemming met de Staatssecretaris van Verkeer en Waterstaat en Onze Minister van
    Economische Zaken;

    Gelet op de artikelen 10 en 147a van de Wet geluidhinder (Stb. 1979, 99);

    Overwegende dat het, mede ter uitvoering van de Richtlijn van de Commissie van de Europese Gemeenschappen van 13
    april 1981, nr. 81/334/EEG (PbEG L 131), houdende aanpassing aan de stand van de techniek van Richtlijn 70/157/
    EEG van de Raad inzake de onderlinge aanpassing van de wetgevingen van de Lid-Staten betreffende het toegestane
    geluidsniveau en de uitlaatinrichting van motorvoertuigen, wenselijk is regelen te stellen met betrekking tot de
    uitlaatsystemen van motorvoertuigen en bromfietsen;

    Gehoord de Centrale Raad voor de Milieuhygiëne (advies van 7 juni 1982, no. 460);

    De Raad van State gehoord (advies van 22 april 1985, no. W08.85.0052/20.5.16.);

    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer a.i. van 7
    augustus 1985, nr. MJZ 0785029, uitgebracht in overeenstemming met de Staatssecretaris van Verkeer en Waterstaat en
    Onze Minister van Economische Zaken;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003835/2007-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Voor de toepassing van dit besluit wordt verstaan onder Onze Ministers: Onze Ministers van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer, van Verkeer en Waterstaat en van Economische Zaken te zamen.

      2 Onder een uitlaatsysteem wordt verstaan een uitlaatinrichting in de zin van de wegenverkeerswetgeving, of een
      onderdeel van zodanige uitlaatinrichting, bestemd voor een motorvoertuig of voor een bromfiets.

      3 Onder bromfiets wordt verstaan: een bromfiets als bedoeld in
      [artikel 1, onderdeel e, van de Wegenverkeerswet 1994][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel1
    url: https://wetten.overheid.nl/BWBR0003835/2007-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '1'
  - number: '2'
    text: |-
      Het is verboden uitlaatsystemen voor motorvoertuigen op ten minste vier wielen te vervaardigen, in te voeren, in
      voorraad te hebben, te koop aan te bieden, af te leveren of te vervoeren die niet behoren tot een type:

      a. waarvoor een goedkeuring geldt ingevolge een keuring, door een door Onze Minister aangewezen instantie verricht
      aan de hand van de krachtens [artikel 5][ref1] geldende voorschriften, of

      b. dat blijkens een door een andere Lid-Staat van de Europese Gemeenschappen of een andere staat die
      partij is bij de Overeenkomst betreffende de Europese Economische Ruimte afgegeven document als bedoeld in
      [artikel 10, eerste lid][ref2], derde streepje, van de richtlijn van de Raad van de Europese Gemeenschappen van
      6 februari 1970, nr. 70/156/EEG (*PbEG* L 42), inzake de onderlinge aanpassing van de wetgevingen van de Lid-
      Staten betreffende de goedkeuring van motorvoertuigen en aanhangwagens daarvan, voldoet aan de voorschriften van
      de richtlijn van de Raad van de Europese Gemeenschappen van 6 februari 1970, nr. 70/157/EEG (*PbEG* L 42), inzake
      de onderlinge aanpassing van de wetgevingen van de Lid-Staten betreffende het toegestane geluidsniveau en de
      uitlaatinrichting van motorvoertuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0003835#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003835#Artikel10
    url: https://wetten.overheid.nl/BWBR0003835/2007-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003835
        artikel: '5'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003835
        artikel: '10'
        hoofdstuk: V
  - number: '3'
    text: |-
      Het is verboden uitlaatsystemen voor motorvoertuigen op minder dan vier wielen of voor bromfietsen te vervaardigen,
      in te voeren, in voorraad te hebben, te koop aan te bieden, af te leveren of te vervoeren, die niet behoren tot
      een type:

      a. waarvoor een goedkeuring geldt ingevolge een keuring, door een door Onze Minister aangewezen instantie verricht
      aan de hand van de krachtens [artikel 5][ref1] geldende voorschriften, of

      b. dat blijkens een typegoedkeuringsverklaring als bedoeld in artikel 4, vierde lid, van [richtlijn nr. 2002/24/EG]
      (32002L0024) van het Europees Parlement en de Raad van de Europese Unie van 18 maart 2002 (PbEG L 124) betreffende
      de goedkeuring van twee- of driewielige motorvoertuigen en de intrekking van [richtlijn nr. 92/61/EEG](31992L0061)
      van de Raad voldoet aan de voorschriften van hoofdstuk 9 van [richtlijn nr. 97/24/EG](31997L0024) van het Europees
      Parlement en de Raad van de Europese Unie van 17 juni 1997 betreffende bepaalde onderdelen of eigenschappen van
      motorvoertuigen op twee of drie wielen (PbEG L 226).


      [ref1]: https://wetten.overheid.nl/BWBR0003835#Artikel5
    url: https://wetten.overheid.nl/BWBR0003835/2007-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003835
        artikel: '5'
        hoofdstuk: III
  - number: '4'
    text: |-
      1 De[ artikelen 2][ref1] en [3][ref2] gelden niet indien de handelingen geschieden met het oog op het buiten
      Nederland in de handel brengen van uitlaatsystemen.

      2 De [artikelen 2][ref3] en [3][ref4] gelden voorts niet ten aanzien van uitlaatsystemen:

      a. die zich in het kader van bedrijfsmatige vervaardiging nog bevinden in het stadium van beproeving of onderzoek;

      b. die dienen als monster bij een ingevolge dit besluit te verrichten keuring.


      [ref1]: https://wetten.overheid.nl/BWBR0003835#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003835#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0003835#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0003835#Artikel3
    url: https://wetten.overheid.nl/BWBR0003835/2007-01-01#Artikel4
    references:
