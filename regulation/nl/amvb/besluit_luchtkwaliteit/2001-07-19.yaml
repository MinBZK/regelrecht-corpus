      1 Onze Minister wijst voor de toepassing van dit besluit zones onderscheidenlijk agglomeraties aan.

      2 Onze Minister overweegt ten minste eenmaal in de vijf jaar in hoeverre de indeling van zones en agglomeraties
      voor de meting van de luchtverontreiniging overeenkomstig [artikel 19][ref1] aanpassing behoeft.

      3 Aan het tweede lid wordt voor de eerste maal gevolg gegeven voor 19 juli 2006.


      [ref1]: https://wetten.overheid.nl/BWBR0012550#Artikel19
