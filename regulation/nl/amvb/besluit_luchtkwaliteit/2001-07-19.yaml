  - number: '3'
    text: |-
      Onze Minister overweegt ten minste eenmaal in de acht jaar in hoeverre de in de[ artikelen 5 tot en met 17][ref1]
      genoemde waarden herziening behoeven en stelt de Staten-Generaal in kennis van zijn bevindingen daaromtrent.


      [ref1]: https://wetten.overheid.nl/BWBR0012550#Artikel5
