  - number: '22'
    text: |-
      1 Gedeputeerde staten inventariseren eenmaal in de drie jaar de plaatsen waar naar hun redelijke verwachting
      mensen worden blootgesteld aan luchtverontreiniging, die in overwegende mate wordt veroorzaakt door één of meer
      inrichtingen die:

      a. voor zwaveldioxide meer dan 24 maal per kalenderjaar hoger is dan 350 microgram per m3 als uurgemiddelde
      concentratie;

      b. voor zwaveldioxide meer dan 3 maal per kalenderjaar hoger is dan 125 microgram per m3 als 24 uurgemiddelde
      concentratie;

      c. voor lood hoger is dan 0,5 microgram per m3 als jaargemiddelde concentratie.

      2 Gedeputeerde staten stellen op plaatsen, die ingevolge het eerste lid zijn geïnventariseerd, de
      luchtverontreiniging door zwaveldioxide, onderscheidenlijk lood vast. De vaststelling vindt plaats in hetzelfde
      jaar als waarin de inventarisatie is verricht. De vaststelling op de in [de eerste volzin][ref1] bedoelde plaatsen
      geschiedt daar waar de luchtverontreiniging naar redelijke verwachting van gedeputeerde staten het hoogst is.

      3 Gedeputeerde staten stellen op plaatsen, die ingevolge het eerste lid zijn geïnventariseerd, in elk van de twee
      jaren die volgen op een jaar waarin laatstelijk een vaststelling heeft plaatsgevonden, de luchtverontreiniging
      door zwaveldioxide vast waar die luchtverontreiniging naar hun redelijke verwachting de toepasselijke in
      de[ artikelen 5][ref2] en [15][ref3], genoemde waarden overschrijdt. Het tweede lid, derde volzin, is van
      overeenkomstige toepassing.

      4 De vaststelling voor zwaveldioxide, bedoeld in het tweede en derde lid, vindt plaats door middel van:

      a. metingen, overeenkomstig [artikel 19, derde lid][ref4], dan wel

      b. een andere methode met behulp waarvan concentraties op een zodanige wijze vastgesteld kunnen worden, dat deze
      niet meer dan 60 procent van de werkelijke uurgemiddelde concentraties afwijken.

      5 De vaststelling voor lood, bedoeld in het tweede en derde lid, vindt plaats door middel van:

      a. metingen, overeenkomstig [artikel 19, zevende lid][ref5], dan wel

      b. een andere methode met behulp waarvan concentraties op een zodanige wijze vastgesteld kunnen worden, dat deze
      niet meer dan 50 procent van de werkelijke jaargemiddelde concentraties afwijken.

      6 Een inventarisatie als bedoeld in het eerste lid, vindt voor de eerste maal in 2002 plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0012550#Artikel22
