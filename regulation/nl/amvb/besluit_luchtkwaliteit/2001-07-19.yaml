  - number: '4'
    text: >-
      Bij ministeriële regeling worden voor de toepassing van dit besluit regels vastgesteld aangaande de wijze van meten
      en de frequentie daarvan.
    url: https://wetten.overheid.nl/BWBR0012550/2001-07-19#Artikel4
  - number: '5'
    text: >-
      Bestuursorganen nemen bij de uitoefening van bevoegdheden die gevolgen voor de luchtkwaliteit ten aanzien van
      zwaveldioxide kunnen hebben, behoudens voorzover de betrokken wettelijke regeling zich daartegen verzet, de
      volgende grenswaarden voor zwaveldioxide in acht:


      a. 350 microgram per m3 als uurgemiddelde concentratie, waarbij geldt dat deze maximaal 24 maal per kalenderjaar
      mag worden overschreden;


      b. 125 microgram per m3 als 24 uurgemiddelde concentratie, waarbij geldt dat deze maximaal drie maal per
      kalenderjaar mag worden overschreden.
    url: https://wetten.overheid.nl/BWBR0012550/2001-07-19#Artikel5
  - number: '6'
    text: >-
      Bestuursorganen nemen bij de uitoefening van bevoegdheden die gevolgen voor de luchtkwaliteit ten aanzien van
      zwaveldioxide kunnen hebben, in gebieden met een oppervlakte van ten minste 1000 km2 die gelegen zijn op een
      afstand van ten minste 20 km van agglomeraties of op een afstand van ten minste 5 km van andere gebieden met
      bebouwing, van inrichtingen of van autosnelwegen, behoudens voorzover de betrokken wettelijke regeling zich
      daartegen verzet, als grenswaarden voor zwaveldioxide in acht:


      a. 20 microgram per m3 als jaargemiddelde concentratie;


      b. 20 microgram per m3 als winterhalfjaargemiddelde concentratie.
    url: https://wetten.overheid.nl/BWBR0012550/2001-07-19#Artikel6
  - number: '7'
    text: >-
      Bestuursorganen nemen voor zwaveldioxide een alarmdrempel in acht van 500 microgram per m3 als uurgemiddelde
      concentratie gedurende drie achtereenvolgende uren, in gebieden van ten minste 100 km2.
    url: https://wetten.overheid.nl/BWBR0012550/2001-07-19#Artikel7
  - number: '8'
    text: |-
      1 Bestuursorganen nemen bij de uitoefening van bevoegdheden die gevolgen voor de luchtkwaliteit ten aanzien van
      stikstofdioxide kunnen hebben, behoudens voorzover de betrokken wettelijke regeling zich daartegen verzet, de
      volgende grenswaarden voor stikstofdioxide in acht:

      a. 200 microgram per m3 als uurgemiddelde concentratie, waarbij geldt dat deze maximaal achttien maal per
      kalenderjaar mag worden overschreden, en

      b. 40 microgram per m3 als jaargemiddelde concentratie, uiterlijk op 1 januari 2010.

      2 Het eerste lid, onder a, is met ingang van 1 januari 2010 van toepassing bij wegen waarvan ten minste 40 000
      motorvoertuigen per etmaal gebruik maken.

      3 Bestuursorganen nemen bij de uitoefening van bevoegdheden die gevolgen voor de luchtkwaliteit ten aanzien van
      stikstofdioxide kunnen hebben, behoudens voorzover de betrokken wettelijke regeling zich daartegen verzet, tot
      1 januari 2010 bij de wegen, bedoeld in het tweede lid, voor stikstofdioxide een grenswaarde in acht van 290
      microgram per m3 als uurgemiddelde concentratie, waarbij geldt dat deze maximaal achttien maal per kalenderjaar mag
      worden overschreden.

      4 Indien ten gevolge van maatregelen die door één of meer bestuursorganen zijn genomen met het oog op het
      voorkomen of beperken van luchtverontreiniging bij de wegen, bedoeld in het tweede lid, in een kalenderjaar voor
      het jaar 2010 de grenswaarde wordt bereikt van 200 microgram per m3 als uurgemiddelde concentratie, met maximaal
      18 overschrijdingen per kalenderjaar, nemen bestuursorganen, in afwijking van het tweede en derde lid, behoudens
      voorzover de betrokken wettelijke regeling zich daartegen verzet, bij de uitoefening van bevoegdheden die gevolgen
      voor de luchtkwaliteit ten aanzien van stikstofdioxide kunnen hebben, deze grenswaarde met ingang van het jaar
      volgend op het jaar waarin de grenswaarde, bedoeld in [de eerste volzin][ref1] is bereikt, in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0012550#Artikel8
