  - number: '29'
    text: |-
      1 Omtrent het nemen van maatregelen ter handhaving van de in de[ artikelen 5][ref1], [8][ref2], [13][ref3],
      [15][ref4], [16][ref5] en [17][ref6] genoemde waarden, bevorderen gedeputeerde staten een regelmatig overleg met de
      betrokken andere bestuursorganen binnen het gebied van de provincie en met de inspecteur.

      2 Indien overschrijding van de in de[ artikelen 5 tot en met 8][ref7], [11][ref8], [12][ref9] en [13][ref10]
      genoemde waarden plaatsvindt dan wel dreigt plaats te vinden, geschiedt het verstrekken van informatie aan het
      publiek mede overeenkomstig de Smogregeling 2001.

      3 Indien overschrijding van de in de[ artikelen 7][ref11] en [11][ref12] genoemde alarmdrempels plaatsvindt dan wel
      dreigt plaats te vinden, geschiedt het nemen van maatregelen mede overeenkomstig de Smogregeling 2001.


