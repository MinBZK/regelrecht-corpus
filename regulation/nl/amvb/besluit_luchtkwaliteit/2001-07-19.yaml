  - number: '21'
    text: |-
      1 De vaststelling voor stikstofdioxide bij wegen, bedoeld in
      [artikel 20, tweede, derde, vierde en vijfde lid][ref1], vindt plaats door middel van:

      a. metingen, overeenkomstig [artikel 19, vierde lid][ref2], dan wel

      b. een andere methode met behulp waarvan concentraties op een zodanige wijze vastgesteld kunnen worden, dat deze
      niet meer dan 30 procent van de werkelijke jaargemiddelde concentraties afwijken.

      2 De vaststelling voor stikstofdioxide bij inrichtingen, bedoeld in [artikel 20, vierde lid][ref3], vindt plaats
      door middel van:

      a. metingen, overeenkomstig [artikel 19, vierde lid][ref4], dan wel

      b. een andere methode met behulp waarvan concentraties op een zodanige wijze vastgesteld kunnen worden, dat deze
      niet meer dan 60 procent van de werkelijke uurgemiddelde concentraties afwijken.

      3 De vaststelling voor zwevende deeltjes (PM), bedoeld in [artikel 20, tweede, derde, vierde en vijfde lid][ref5],
      vindt plaats door middel van:

      a. metingen, overeenkomstig [artikel 19, zesde lid][ref6], dan wel

      b. een andere methode met behulp waarvan concentraties op een zodanige wijze vastgesteld kunnen worden, dat deze
      niet meer dan 50 procent van de werkelijke jaargemiddelde concentraties en niet meer dan een factor twee van de
      werkelijke 24 uurgemiddelde concentraties afwijken.

      4 De vaststelling voor koolmonoxide, bedoeld in [artikel 20, tweede, derde, vierde en vijfde lid][ref7], vindt
      plaats door middel van:

      a. een meetmethode waarvan de bovenste analysegrens ten minste 60.000 microgram per m3 bedraagt en waarbij de
      onder operationele condities verkregen meetwaarden zodanig zijn dat met een waarschijnlijkheid van 95 procent de
      totale afwijking tussen de gemeten en de werkelijke concentratie niet meer is dan 15 procent voor uurgemiddelde
      concentraties groter dan 10. 000 microgram per m3, en de systematische afwijking tussen de gemeten en de werkelijke
      concentratie niet meer is dan 15 procent voor uurgemiddelde concentraties groter dan 4.000 microgram per m3, dan
      wel

      b. een andere methode met behulp waarvan concentraties op een zodanige wijze vastgesteld kunnen worden, dat deze
      niet meer dan 30 procent van de werkelijke uurgemiddelde en 8 uurgemiddelde concentraties afwijken.

      5 De vaststelling voor benzeen, bedoeld in [artikel 20, tweede, derde, vierde en vijfde lid][ref8], vindt plaats
      door middel van:

      a. een meetmethode waarvan de onderste analysegrens ten hoogste 0,5 microgram per m3 bedraagt, de bovenste
      analysegrens ten minste 3.600 microgram per m3 bedraagt en waarbij de onder operationele condities verkregen
      meetwaarden zodanig zijn dat met een waarschijnlijkheid van 95 procent in monsters met concentraties hoger dan 1
      microgram per m3, de totale afwijking tussen de gemeten en de werkelijke concentratie niet meer is dan 20 procent
      en de systematische afwijking tussen de gemeten en de werkelijke concentratie niet meer is dan 10 procent, dan wel

      b. een andere methode met behulp waarvan concentraties op een zodanige wijze vastgesteld kunnen worden, dat deze
      niet meer dan 30 procent van de werkelijke jaargemiddelde concentraties afwijken.


