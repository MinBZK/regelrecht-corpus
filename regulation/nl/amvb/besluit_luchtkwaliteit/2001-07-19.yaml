preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 20 februari 2001,
    nr. MJZ2001020 595, Centrale Directie Juridische Zaken, Afdeling Wetgeving;


    Gelet op richtlijn 1999/30/EG van de Raad van de Europese Unie van 22 april 1999, betreffende grenswaarden voor
    zwaveldioxide, stikstofdioxide en stikstofoxiden, zwevende deeltjes en lood in de lucht (PbEG L 163), alsmede
    op de artikelen 6, 7, 8, 10 van richtlijn 96/62/EG van de Raad van de Europese Unie van 27 september 1996 inzake
    de beoordeling en het beheer van de luchtkwaliteit (PbEG L 296), de artikelen 53, 59 en89 van de Wet inzake de
    luchtverontreiniging en de artikelen 5.1,5.2, 5.2a en 5.3 van de Wet milieubeheer;


    De Raad van State gehoord (advies van 17 april 2001, nr W08.01.0107/V);


    Gezien het nader rapport van Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 8 juni
    2001, nr. MJZ 2001060667, Centrale Directie Juridische Zaken, Afdeling Wetgeving;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0012550/2001-07-19#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. wet:[ Wet milieubeheer][ref1];

      b. grenswaarde: grenswaarde als bedoeld in [artikel 5.1 van de wet][ref2] ten aanzien van het kwaliteitsniveau van
      de buitenlucht;

      c. richtwaarde: richtwaarde als bedoeld in [artikel 5.1 van de wet][ref3] ten aanzien van het kwaliteitsniveau van
      de buitenlucht;

      d. alarmdrempel: kwaliteitsniveau van de buitenlucht dat bij kortstondige overschrijding risico's voor de
      gezondheid van de mens inhoudt;

      e. plandrempel: een kwaliteitsniveau van de buitenlucht dat bij overschrijden aanleiding geeft tot het opstellen
      van een plan als bedoeld in [artikel 25][ref4] of [26][ref5];

      f. stikstofoxiden: het totale aantal volumedelen stikstofmonoxide en stikstofdioxide per miljard volumedelen,
      uitgedrukt in microgrammen stikstofdioxide per m3;

      g. zwevende deeltjes: in de buitenlucht voorkomende stofdeeltjes;

      h. PM: zwevende deeltjes die een op grootte selecterende instroomopening passeren met een efficiencygrens van 50
      procent bij een aërodynamische diameter van 10 micrometer;

      i. uurgemiddelde concentratie: concentratie in de buitenlucht, gemiddeld over een heel uur, uitgedrukt in microgram
      per m3 lucht bij een temperatuur van 293 K en een druk van 101,3 kiloPascal;

      j. 8 uurgemiddelde concentratie: concentratie in de buitenlucht, gemiddeld over acht achtereenvolgende
      uurgemiddelde concentraties, uitgedrukt in microgram per m3 lucht bij een temperatuur van 293 K en een druk van
      101,3 kiloPascal;

      k. 24 uurgemiddelde concentratie: concentratie in de buitenlucht, gemiddeld over het tijdvak van 0.00 uur tot 24.00
      uur Midden-Europese-Tijd, uitgedrukt in microgram per m3 lucht bij een temperatuur van 293 K en een druk van 101,3
      kiloPascal voor zwaveldioxide en bij heersende temperatuur en druk voor PM;

      l. winterhalfjaargemiddelde concentratie: concentratie in de buitenlucht, gemiddeld over 24 uurgemiddelde
      concentraties van 1 oktober tot en met 31 maart, uitgedrukt in microgram per m3 lucht bij een temperatuur van 293 K
      en een druk van 101,3 kilo Pascal;

      m. jaargemiddelde concentratie: concentratie in de buitenlucht, gemiddeld over 24 uurgemiddelde concentraties
      in een kalenderjaar, uitgedrukt in microgram per m3 lucht bij een temperatuur van 293 K en een druk van 101,3
      kiloPascal voor zwaveldioxide, stikstofdioxide, stikstofoxiden, lood en benzeen en bij heersende temperatuur en
      druk voor PM;

      n. P-percentiel: concentratiewaarde waarvoor geldt dat P procent van de in een kalenderjaar beschikbare
      uurgemiddelde dan wel 8 uurgemiddelde concentraties (N) van koolmonoxide lager is dan die concentratiewaarde, met
      dien verstande, dat indien P procent van N geen heel getal is naar beneden wordt afgerond;

      o. meetmethode: procedure van het bemonsteren van de buitenlucht, het analyseren van aldus verkregen luchtmonsters,
      het kalibreren van daartoe te gebruiken apparatuur, alsmede de verwerking van het signaal tot uurgemiddelde, dan
      wel 8 uurgemiddelde onderscheidenlijk 24 uurgemiddelde concentraties;

      p. meetperiode: periode van 1 januari tot en met 31 december in een kalenderjaar;

      q. vangstrendement: de verhouding tussen de door het filter afgevangen massa lood en de werkelijke massa lood in
      het luchtvolume voor bemonstering;

      r. bebouwde kom: de bebouwde kom, zoals vastgesteld krachtens [artikel 20a van de Wegenverkeerswet 1994][ref6];

      s. motorvoertuig: een motorvoertuig in de zin van
      [artikel 1 van het Reglement verkeersregels en verkeerstekens 1990;][ref7]

      t. inrichting: een inrichting die behoort tot een krachtens [artikel 1.1, derde lid, van de wet ][ref8]aangewezen
      categorie;

      u. zone: een gedeelte van het Nederlandse grondgebied;

      v. agglomeratie: een stedelijk gebied met ten minste 250 000 inwoners.

      2 Dit besluit is niet van toepassing op een arbeidsplaats als bedoeld in
      [artikel 1, derde lid, onder g, van de Arbeidsomstandighedenwet 1998][ref9].


