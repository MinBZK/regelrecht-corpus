    text: >-
      Bestuursorganen nemen voor stikstofdioxide de volgende plandrempels, gedefinieerd als jaargemiddelde concentraties,
      in acht:


      a. tot 1 januari 2002, 58 microgram per m3;


      b. in 2002, 56 microgram per m3;


      c. in 2003, 54 microgram per m3;


      d. in 2004, 52 microgram per m3;


      e. in 2005, 50 microgram per m3;


      f. in 2006, 48 microgram per m3;


      g. in 2007, 46 microgram per m3;


      h. in 2008, 44 microgram per m3;


      i. in 2009, 42 microgram per m3.
    url: https://wetten.overheid.nl/BWBR0012550/2001-07-19#Artikel9
  - number: '10'
    text: |-
      Bestuursorganen nemen voor stikstofdioxide bij de wegen, bedoeld in [artikel 8, tweede lid][ref1], de volgende
      plandrempels, gedefinieerd als uurgemiddelde concentraties waarbij geldt dat deze maximaal achttien maal per
      kalenderjaar mogen worden overschreden, in acht:

      a. tot 1 januari 2002, 290 microgram per m3;

      b. in 2002, 280 microgram per m3;

      c. in 2003, 270 microgram per m3;

      d. in 2004, 260 microgram per m3;

      e. in 2005, 250 microgram per m3;

      f. in 2006, 240 microgram per m3;

      g. in 2007, 230 microgram per m3;

      h. in 2008, 220 microgram per m3;

      i. in 2009, 210 microgram per m3.


      [ref1]: https://wetten.overheid.nl/BWBR0012550#Artikel8
    url: https://wetten.overheid.nl/BWBR0012550/2001-07-19#Artikel10
