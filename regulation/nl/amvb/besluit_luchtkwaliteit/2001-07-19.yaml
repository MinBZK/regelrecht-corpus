  - number: '27'
    text: |-
      1 Burgemeester en wethouders doen van een inventarisatie als bedoeld in [artikel 20, eerste lid][ref1], voor 1 mei
      van het jaar waarin die inventarisatie is verricht, aan gedeputeerde staten schriftelijk verslag.

      2 Burgemeester en wethouders doen op basis van de vaststelling van de luchtverontreiniging door stikstofdioxide,
      zwevende deeltjes (PM), koolmonoxide en benzeen bedoeld in [artikel 20, tweede tot en met vijfde lid][ref2], voor 1
      mei van het jaar waarin de vaststelling heeft plaatsgevonden aan gedeputeerde staten schriftelijk verslag van:

      a. de plaatsen waar overschrijding van de in de[ artikelen 8][ref3], [13][ref4], [16][ref5] en [17][ref6] genoemde
      waarden is opgetreden, alsmede van de hoogte van de luchtverontreiniging op die plaatsen;

      b. de plaatsen waar overschrijding van de in de[ artikelen 9][ref7] en [10][ref8], genoemde plandrempels voor
      stikstofdioxide onderscheidenlijk de in [artikel 14][ref9], genoemde plandrempels voor zwevende deeltjes (PM) is
      opgetreden alsmede van de hoogte van de luchtverontreiniging op die plaatsen;

      c. de reden van de overschrijding van de in onderdeel a of b, bedoelde waarden of plandrempels;

      d. de gebruikte meetmethode, de data waarop of de periode waarin de overschrijding van de in onderdeel a of b,
      bedoelde waarden of plandrempels is opgetreden ingeval de vaststelling van de luchtverontreiniging door middel van
      metingen is verricht;

      e. de aan deze vaststelling ten grondslag liggende gegevens ingeval de vaststelling van de luchtverontreiniging
      door middel van een andere methode is verricht, en

      f. de maatregelen die zij hebben genomen of nog zullen nemen om de in de[ artikelen 8][ref10], [13][ref11],
      [16][ref12] en [17][ref13] genoemde waarden te bereiken of te handhaven.


      [ref1]: https://wetten.overheid.nl/BWBR0012550#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0012550#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0012550#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0012550#Artikel13
