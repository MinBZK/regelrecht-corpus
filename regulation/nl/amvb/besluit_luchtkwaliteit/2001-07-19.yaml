  - number: '20'
    text: |-
      1 Burgemeester en wethouders inventariseren eenmaal in de drie jaar de plaatsen binnen de bebouwde kom, waar naar
      hun redelijke verwachting mensen worden blootgesteld aan luchtverontreiniging:

      a. door stikstofdioxide die meer dan achttien maal per kalenderjaar hoger is dan 200 microgram per m3 als
      uurgemiddelde concentratie;

      b. door stikstofdioxide die hoger is dan 40 microgram per m3 als jaargemiddelde concentratie;

      c. door zwevende deeltjes (PM) die hoger is dan 125 microgram per m3 als jaargemiddelde concentratie tot 1 januari
      2005;

      d. door zwevende deeltjes (PM) die meer dan achttien maal per kalenderjaar hoger is dan 250 microgram per m3 als 24
      uurgemiddelde concentratie tot 1 januari 2005;

      e. door zwevende deeltjes (PM) die hoger is dan 40 microgram per m3 als jaargemiddelde concentratie;

      f. door zwevende deeltjes (PM) die meer dan 35 maal per kalenderjaar hoger is dan 50 microgram per m3 als 24
      uurgemiddelde concentratie;

      g. door koolmonoxide die hoger is dan 4800 microgram per m3 als 98-percentiel van 8 uurgemiddelde concentraties;

      h. door benzeen die hoger is dan 10 microgram per m3 als jaargemiddelde concentratie.

      2 Burgemeester en wethouders stellen bij wegen, die ingevolge het eerste lid zijn geïnventariseerd,
      de luchtverontreiniging door stikstofdioxide, zwevende deeltjes (PM), koolmonoxide en benzeen vast. De
      vaststelling vindt plaats in hetzelfde jaar als waarin de inventarisatie is verricht. De vaststelling op de in
      [de eerste volzin][ref1] bedoelde wegen geschiedt daar waar de luchtverontreiniging naar redelijke verwachting van
      burgemeester en wethouders het hoogst is.

      3 Onze Minister van Verkeer en Waterstaat stelt op verzoek van burgemeester en wethouders, bij wegen die ingevolge
      het eerste lid zijn geïnventariseerd en onder het beheer van het Rijk vallen, de luchtverontreiniging door
      stikstofdioxide, zwevende deeltjes (PM), koolmonoxide en benzeen vast en rapporteert omtrent de resultaten daarvan
      voor 1 april van het jaar waarin de inventarisatie is verricht, aan burgemeester en wethouders. Het tweede lid,
      derde volzin, is van overeenkomstige toepassing.

      4 Gedeputeerde staten stellen op verzoek van burgemeester en wethouders, bij inrichtingen die ingevolge het eerste
      lid zijn geïnventariseerd, en bij wegen die ingevolge het eerste lid zijn geïnventariseerd en onder het beheer van
      de provincie vallen, de luchtverontreiniging door stikstofdioxide, zwevende deeltjes (PM), koolmonoxide en benzeen
      vast en rapporteren omtrent de resultaten daarvan voor 1 april van het jaar waarin de inventarisatie is verricht
      aan burgemeester en wethouders. Het tweede lid, derde volzin, is van overeenkomstige toepassing.

      5 Burgemeester en wethouders dienen een verzoek om vaststelling van de luchtverontreiniging, als bedoeld in het
      derde en vierde lid, in voor 1 februari van het jaar waarin de inventarisatie is verricht.

      6 Burgemeester en wethouders stellen in elk van de twee jaren, die volgen op een jaar waarin laatstelijk een
      vaststelling als bedoeld in het tweede lid heeft plaatsgevonden, de luchtverontreiniging door stikstofdioxide,
      zwevende deeltjes (PM), koolmonoxide en benzeen, bedoeld in het eerste lid, vast bij wegen waar mensen aan die
      luchtverontreiniging worden blootgesteld en waar die luchtverontreiniging naar hun redelijke verwachting de
      toepasselijke in [de artikelen 8, eerste en derde lid][ref2], [13][ref3], [16][ref4] onderscheidenlijk [17][ref5],
      genoemde waarden overschrijdt. Het tweede lid, derde volzin, en het derde, vierde en vijfde lid zijn van
      overeenkomstige toepassing.

      7 Een inventarisatie als bedoeld in het eerste lid vindt voor de eerste maal in 2002 plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0012550#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0012550#Artikel8
