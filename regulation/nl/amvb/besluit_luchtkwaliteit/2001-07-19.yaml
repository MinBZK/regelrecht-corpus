  - number: '23'
    text: |-
      1 Voorzover Onze Minister met overeenkomstige toepassing van de[ artikelen 19][ref1], [20][ref2] en [22][ref3] de
      luchtverontreiniging vast stelt en de in de[ artikelen 20, eerste lid][ref4], en [22, eerste lid][ref5], bedoelde
      plaatsen inventariseert, zijn Onze Minister van Verkeer en Waterstaat, onderscheidenlijk gedeputeerde staten en
      burgemeester en wethouders, daartoe niet verplicht.

      2 Het bestuursorgaan dat de in de[ artikelen 20, eerste lid][ref6], en [22, eerste lid][ref7], bedoelde plaatsen
      inventariseert en krachtens de[ artikelen 19][ref8], [20][ref9] en [22][ref10] de luchtverontreiniging vaststelt,
      draagt zorg voor de bekostiging daarvan.


