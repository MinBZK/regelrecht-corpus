  - number: '24'
    text: |-
      1 Onze Minister kan door middel van metingen overeenkomstig dit besluit een toetsing doen plaatsvinden
      van de naleving van de[ artikelen 19][ref1], [20][ref2] en [22][ref3] en, indien hij toepassing
      heeft gegeven aan [artikel 59, vijfde lid, van de Wet inzake de luchtverontreiniging][ref4], en
      [artikel 5.3, tweede lid, van de wet][ref5], van de naleving van door hem gestelde nadere regelen.

      2 De bij deze toetsing gebleken hoogte van de luchtverontreiniging treedt in de plaats van een anderszins
      vastgestelde hoogte van de luchtverontreiniging.


