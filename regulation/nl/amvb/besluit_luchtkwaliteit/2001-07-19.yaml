        artikel: '8'
        paragraaf: '3'
  - number: '11'
    text: >-
      Bestuursorganen nemen voor stikstofdioxide een alarmdrempel in acht van 400 microgram per m3 als uurgemiddelde
      concentratie gedurende drie achtereenvolgende uren, in gebieden met een oppervlakte van ten minste 100 km2.
    url: https://wetten.overheid.nl/BWBR0012550/2001-07-19#Artikel11
  - number: '12'
    text: >-
      Bestuursorganen nemen bij de uitoefening van bevoegdheden die gevolgen voor de luchtkwaliteit ten aanzien van
      stikstofoxiden kunnen hebben, in gebieden met een oppervlakte van ten minste 1000 km2 die gelegen zijn op een
      afstand van ten minste 20 km van agglomeraties of op een afstand van ten minste 5 km van andere gebieden met
      bebouwing, van inrichtingen of van autosnelwegen, behoudens voorzover de betrokken wettelijke regeling zich
      daartegen verzet, als grenswaarde voor stikstofoxiden 30 microgram per m3 als jaargemiddelde concentratie in acht.
    url: https://wetten.overheid.nl/BWBR0012550/2001-07-19#Artikel12
  - number: '13'
    text: >-
      Bestuursorganen nemen bij de uitoefening van bevoegdheden die gevolgen voor de luchtkwaliteit ten aanzien van
      zwevende deeltjes (PM) kunnen hebben, behoudens voorzover de betrokken wettelijke regeling zich daartegen verzet,
      de volgende grenswaarden voor zwevende deeltjes (PM) in acht:


      a. tot 1 januari 2005, 125 microgram per m3 als jaargemiddelde concentratie;


      b. tot 1 januari 2005, 250 microgram per m3 als 24 uurgemiddelde concentratie, waarbij geldt dat deze maximaal
      achttien maal per kalenderjaar mag worden overschreden;


      c. uiterlijk met ingang van 1 januari 2005, 40 microgram per m3 als jaargemiddelde concentratie;


      d. uiterlijk met ingang van 1 januari 2005, 50 microgram per m3 als 24 uurgemiddelde concentratie, waarbij geldt
      dat deze maximaal 35 maal per kalenderjaar mag worden overschreden.
    url: https://wetten.overheid.nl/BWBR0012550/2001-07-19#Artikel13
  - number: '14'
    text: >-
      1 Bestuursorganen nemen voor zwevende deeltjes (PM) de volgende plandrempels, gedefinieerd als 24 uurgemiddelde
      concentraties die maximaal 35 maal per kalenderjaar mogen worden overschreden, in acht:


      a. tot 1 januari 2002, 70 microgram per m3;


      b. in 2002, 65 microgram per m3;


      c. in 2003, 60 microgram per m3;


      d. in 2004, 55 microgram per m3.


      2 Bestuursorganen nemen voor zwevende deeltjes (PM) de volgende plandrempels, gedefinieerd als jaargemiddelde
      concentraties in acht:


      a. tot 1 januari 2002, 46 microgram per m3;


      b. in 2002, 45 microgram per m3;


      c. in 2003, 43 microgram per m3;


      d. in 2004, 42 microgram per m3.
    url: https://wetten.overheid.nl/BWBR0012550/2001-07-19#Artikel14
  - number: '15'
    text: >-
      Bestuursorganen nemen bij de uitoefening van bevoegdheden die gevolgen voor de luchtkwaliteit ten aanzien van lood
      kunnen hebben, behoudens voorzover de betrokken wettelijke regeling zich daartegen verzet voor lood een grenswaarde
      van 0,5 microgram per m3 als jaargemiddelde concentratie in acht.
    url: https://wetten.overheid.nl/BWBR0012550/2001-07-19#Artikel15
  - number: '16'
    text: >-
      Bestuursorganen nemen bij de uitoefening van bevoegdheden die gevolgen voor de luchtkwaliteit ten aanzien van
      koolmonoxide kunnen hebben, behoudens voorzover de betrokken wettelijke regeling zich daartegen verzet, de volgende
      grenswaarden voor koolmonoxide in acht:


      a. 6.000 microgram per m3 als 98-percentiel van 8 uurgemiddelde concentraties, en


      b. 40.000 microgram per m3 als 99,9-percentiel van uurgemiddelde concentraties.
    url: https://wetten.overheid.nl/BWBR0012550/2001-07-19#Artikel16
  - number: '17'
    text: >-
      Bestuursorganen nemen bij de uitoefening van bevoegdheden die gevolgen voor de luchtkwaliteit ten aanzien van
      benzeen kunnen hebben, behoudens voorzover de betrokken wettelijke regeling zich daartegen verzet, een grenswaarde
      van 10 microgram per m3 als jaargemiddelde concentratie in acht.
    url: https://wetten.overheid.nl/BWBR0012550/2001-07-19#Artikel17
  - number: '18'
    text: >-
      Bestuursorganen houden bij de uitoefening van bevoegdheden die gevolgen voor de luchtkwaliteit ten aanzien van
      benzeen kunnen hebben, behoudens voorzover de betrokken wettelijke regeling zich daartegen verzet, rekening met een
      richtwaarde van 5 microgram per m3 als jaargemiddelde concentratie.
    url: https://wetten.overheid.nl/BWBR0012550/2001-07-19#Artikel18
  - number: '19'
    text: |-
      1 Gedeputeerde staten stellen in zones en agglomeraties de luchtverontreiniging door zwaveldioxide,
      stikstofdioxide, stikstofoxiden, zwevende deeltjes (PM) en lood vast met gebruikmaking van vaste meetpunten.

      2 Voor de meting van de luchtverontreiniging door zwaveldioxide wordt gebruik gemaakt van een meetmethode waarvan
      de bovenste analysegrens ten minste 1.000 microgram per m3 bedraagt en waarbij de onder operationele condities
      verkregen meetwaarden zodanig zijn dat met een waarschijnlijkheid van 95 procent de totale afwijking tussen de
      gemeten en de werkelijke concentratie minder is dan 15 procent voor uurgemiddelde concentraties, groter dan 75
      microgram per m3. Het in de eerste volzin bepaalde is niet van toepassing in de in [artikel 6][ref1], bedoelde
      gebieden.

      3 Voor de meting van de luchtverontreiniging door zwaveldioxide wordt in de in [artikel 6][ref2], bedoelde gebieden
      gebruik gemaakt van een meetmethode waarvan de bovenste analysegrens ten minste 500 microgram per m3 bedraagt
      en waarbij de onder operationele condities verkregen meetwaarden zodanig zijn dat met een waarschijnlijkheid
      van 95 procent de totale afwijking tussen de gemeten en de werkelijke concentratie minder is dan 15 procent voor
      jaargemiddelde concentraties, groter dan 12 microgram per m3.

      4 Voor de meting van de luchtverontreiniging door stikstofdioxide wordt gebruik gemaakt van een meetmethode waarvan
      de bovenste analysegrens ten minste 500 microgram per m3 bedraagt en waarbij de onder operationele condities
      verkregen meetwaarden zodanig zijn dat met een waarschijnlijkheid van 95 procent de totale afwijking tussen de
      gemeten en de werkelijke concentratie minder is dan 15 procent voor uurgemiddelde concentraties, groter dan 32
      microgram per m3.

      5 Voor de meting van de luchtverontreiniging door stikstofoxiden wordt gebruik gemaakt van een meetmethode waarvan
      de bovenste analysegrens ten minste 500 microgram per m3 bedraagt en waarbij de onder operationele condities
      verkregen meetwaarden zodanig zijn dat met een waarschijnlijkheid van 95 procent de totale afwijking tussen de
      gemeten en de werkelijke concentratie minder is dan 15 procent voor jaargemiddelde concentraties, groter dan 24
      microgram per m3.

      6 Voor de meting van de luchtverontreiniging door zwevende deeltjes (PM) wordt gebruik gemaakt van een meetmethode
      waarvan de bovenste analysegrens ten minste 400 microgram per m3 bedraagt en waarbij de onder operationele
      condities verkregen meetwaarden zodanig zijn dat met een waarschijnlijkheid van 95 procent de totale afwijking
      tussen de gemeten en de werkelijke concentratie minder is dan 25 procent voor 24 uurgemiddelde concentraties,
      groter dan 30 microgram per m3.

      7 Voor de meting van de luchtverontreiniging door lood wordt gebruik gemaakt van een meetmethode waarvan de
      bovenste analysegrens ten minste 1 microgram per m3 bedraagt en waarbij de onder operationele condities verkregen
      meetwaarden zodanig zijn dat met een waarschijnlijkheid van 95 procent de totale afwijking tussen de gemeten en de
      werkelijke concentratie minder is dan 50 procent voor concentraties, groter dan 0,25 microgram per m3.


      [ref1]: https://wetten.overheid.nl/BWBR0012550#Artikel6
