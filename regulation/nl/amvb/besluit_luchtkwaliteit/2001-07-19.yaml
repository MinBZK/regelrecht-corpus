      1 Onze Minister stelt voor plaatsen waar de in [artikel 14][ref1], genoemde plandrempels voor zwevende
      deeltjes (PM) worden overschreden, een plan op waarin wordt aangegeven op welke wijze voldaan wordt aan de in
      [artikel 13, onder c en d][ref2], genoemde waarden, binnen de daarvoor gestelde termijnen.

      2 Het plan bevat ten minste de in de bijlage, behorende bij dit besluit genoemde gegevens.

      3 Het plan wordt vastgesteld voor 1 september van het jaar volgend op het jaar waarin de overschrijding van de
      plandrempels ingevolge [artikel 19][ref3] en 20 is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0012550#Artikel14
