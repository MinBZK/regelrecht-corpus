  - number: '28'
    text: |-
      1 Gedeputeerde staten doen in een jaar waarin een inventarisatie als bedoeld in
      [artikel 20, eerste lid][ref1], onderscheidenlijk [22, eerste lid ][ref2]of een vaststelling
      als bedoeld in [artikel 20, tweede, derde, vierde of vijfde lid][ref3] onderscheidenlijk
      [22, eerste, tweede of derde lid ][ref4]heeft plaatsgevonden, voor 1 juli schriftelijk verslag aan Onze Minister
      van de luchtverontreiniging door zwaveldioxide, stikstofdioxide, stikstofoxiden, zwevende deeltjes (PM), lood,
      koolmonoxide en benzeen in de provincie alsmede van de maatregelen en plannen om de in de[ artikelen 5][ref5],
      [8][ref6], [13][ref7], [15][ref8], [16][ref9] en [17][ref10] genoemde waarden te bereiken of te handhaven. Zij
      betrekken in hun verslag de resultaten van de ingevolge [artikel 20][ref11] verrichte metingen, de ingevolge
      [artikel 27][ref12] opgestelde verslagen en de ingevolge [artikel 25][ref13], bedoelde plannen. In het verslag
      wordt melding gemaakt van overschrijding van de in [artikelen 6][ref14] en [12][ref15] genoemde waarden.

      2 In het in het eerste lid bedoelde verslag geven gedeputeerde staten een overzicht van de luchtverontreiniging
      door zwaveldioxide, stikstofdioxide, stikstofoxiden en zwevende deeltjes (PM) in de binnen de provincie gelegen
      agglomeraties, alsmede van de maatregelen en plannen om de toepasselijke in de[ artikelen 5][ref16], [8][ref17],
      [13][ref18], [15][ref19], [16][ref20] en [17][ref21] genoemde waarden te bereiken of te handhaven. De tweede volzin
      van het eerste lid is van overeenkomstige toepassing.


