  - number: '25'
    text: |-
      1 Burgemeester en wethouders stellen voor plaatsen waar de in de [ artikelen 9][ref1] en [10][ref2], genoemde
      plandrempels voor stikstofdioxide worden overschreden, een plan op waarin wordt aangegeven op welke wijze voldaan
      zal gaan worden aan de in [artikel 8, eerste lid, onder b en tweede lid][ref3], genoemde waarden, binnen de in dat
      artikel gestelde termijnen.

      2 Het plan bevat ten minste de in de bijlage, behorende bij dit besluit genoemde gegevens.

      3 Burgemeester en wethouders stellen gedeputeerde staten in kennis van het plan voor 1 mei van het jaar volgend
      op het jaar waarin de overschrijding van de plandrempels voor stikstofdioxide ingevolge [artikel 20][ref4] is
      vastgesteld en ingevolge [artikel 27, tweede lid, onder b][ref5], is gerapporteerd.

      4 Burgemeester en wethouders rapporteren eenmaal in de drie jaar voor 1 mei aan gedeputeerde staten omtrent de
      voortgang van de uitvoering van het plan.


