preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Justitie van 25 november 1996, Directie Wetgeving, nr. 593087/96/6;


    Gelet op de artikelen 36e en 36f van het Wetboek van Strafrecht, de artikelen 572, tweede lid, en 577b, eerste lid,
    van het Wetboek van Strafvordering en op artikel 2 van het Besluit Instelling Centraal Justitieel Incassobureau;


    De Raad van State gehoord (advies van 16 januari 1997, nr. W03.96.0565);


    Gezien het nader rapport van Onze Minister van Justitie van 24 januari 1997, Directie Wetgeving, nr. 604301/97/6;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008537/2013-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. CJIB: Centraal Justitieel Incassobureau, bedoeld in
      [artikel 1 van het Besluit Instelling Centraal Justitieel Incassobureau][ref1];

      b. Onze Minister: Onze Minister van Veiligheid en Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0006713#Artikel1
    url: https://wetten.overheid.nl/BWBR0008537/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006713
        artikel: '1'
  - number: '2'
    text: |-
      Het CJIB heeft tot taak het openbaar ministerie te ondersteunen bij zijn taak met betrekking tot de inning van het
      geldbedrag, bedoeld in [artikel 36][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel36e
    url: https://wetten.overheid.nl/BWBR0008537/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 36e
  - number: '3'
    text: |-
      Het CJIB heeft tot taak het openbaar ministerie te ondersteunen bij zijn taak met betrekking tot de inning van de
      som geld ten behoeve van het slachtoffer, of diens nabestaanden, alsmede met betrekking tot de uitkering van het
      resterende bedrag, bedoeld in [artikel 36f van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel36f
    url: https://wetten.overheid.nl/BWBR0008537/2013-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 36f
  - number: '4'
    text: |-
      Het CJIB verricht de werkzaamheden die Onze Minister of het openbaar ministerie van hem in verband met de
      uitoefening van hun in [artikel 2][ref1] en 3 genoemde taken verlangen.


      [ref1]: https://wetten.overheid.nl/BWBR0008537#Artikel2
    url: https://wetten.overheid.nl/BWBR0008537/2013-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008537
        artikel: '2'
        paragraaf: '1'
  - number: '5'
    text: |-
      1 De betaling van het geldbedrag bedoeld in [artikel 36e ][ref1] en van de som geld bedoeld in
      [artikel 36f van het Wetboek van Strafrecht][ref2], geschiedt door storting of overschrijving op een daartoe
      bestemde giro- of bankrekening van het CJIB. In bijzondere gevallen kan de betaling geschieden op een door het CJIB
      aan te wijzen plaats, dan wel aan een door het CJIB aan te wijzen persoon.

      2 De betaling, bedoeld in het eerste lid, eerste volzin, geschiedt binnen dertig dagen na de dagtekening van de
      acceptgiro die de persoon aan wie de desbetreffende maatregel is opgelegd van het Centraal Justitieel Incassobureau
      ontvangt.

      3 In het geval de rechter ingevolge [artikel 24a van het Wetboek van Strafrecht][ref3] of ingeval het openbaar
      ministerie ingevolge [artikel 561, derde lid, van het Wetboek van Strafvordering][ref4], een betaling in termijnen
      heeft toegestaan, worden de in die artikelen bedoelde termijnen bepaald vanaf de dagtekening van de acceptgiro die
      de persoon aan wie de desbetreffende maatregel is opgelegd van het Centraal Justitieel Incassobureau ontvangt.

      4 De betaling van het ingevolge [artikel 24b van het Wetboek van Strafrecht][ref5] verhoogde bedrag geschiedt
      binnen dertig dagen na de dagtekening van de eerstvolgende acceptgiro die de persoon aan wie de desbetreffende
      maatregel is opgelegd van het Centraal Justitieel Incassobureau ontvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel36e
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel36f
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel24a
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel561
      [ref5]: https://wetten.overheid.nl/BWBR0001854#Artikel24b
    url: https://wetten.overheid.nl/BWBR0008537/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 36e
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 36f
      - id: ref3
        bwb_id: BWBR0001854
        artikel: 24a
      - id: ref4
        bwb_id: BWBR0001903
        artikel: '561'
      - id: ref5
        bwb_id: BWBR0001854
        artikel: 24b
  - number: '6'
    text: >-
      1 Degene die betaalt, maakt daarbij op een door het CJIB aan te geven wijze melding van de zaak waar de betaling
      betrekking op heeft.


      2 Ingeval geen melding is gemaakt op de wijze bedoeld in het eerste lid van de zaak waar de betaling betrekking
      op heeft, kan het CJIB het aan hem betaalde bedrag terugstorten op de rekening waarvan het bedrag afkomstig is, of
      anderszins het bedrag terugbetalen aan de persoon die betaald heeft.
    url: https://wetten.overheid.nl/BWBR0008537/2013-01-01#Artikel6
  - number: '7'
    text: |-
      1 In het belang van een juiste taakuitoefening bij de inning van een opgelegde ontnemings- of
      schadevergoedingsmaatregel wordt in de gevallen, bedoeld in [artikel 5, eerste lid, tweede volzin][ref1],
      onverwijld een betalingsbewijs uitgereikt dat door de persoon aan wie wordt voldaan, is gedagtekend en ondertekend.

      2 In de gevallen, bedoeld in [artikel 5, eerste lid, tweede volzin][ref2], wordt van de inning aantekening gehouden
      op de wijze zoals door het CJIB is aangegeven.

      3 De aantekeningen worden, uiterlijk een jaar nadat zij zijn opgemaakt, desverlangd getoond aan de personen die met
      het toezicht op de inning van de genoemde maatregelen zijn belast.


      [ref1]: https://wetten.overheid.nl/BWBR0008537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0008537#Artikel5
    url: https://wetten.overheid.nl/BWBR0008537/2013-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008537
        artikel: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008537
        artikel: '5'
        paragraaf: '2'
  - number: '8'
    text: |-
      Een ieder die betrokken is bij de inning en incasso van een opgelegde ontnemings- of schadevergoedingsmaatregel
      verstrekt het CJIB en het openbaar ministerie de gegevens die zij behoeven in verband met de uitoefening van hun in
      de [artikelen 2][ref1] en [3][ref2] bedoelde taken.


      [ref1]: https://wetten.overheid.nl/BWBR0008537#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008537#Artikel3
    url: https://wetten.overheid.nl/BWBR0008537/2013-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008537
        artikel: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008537
        artikel: '3'
        paragraaf: '1'
  - number: '9'
    text: >-
      1 Het Hoofd van de Directie Financieel Economische Zaken van het Ministerie van Veiligheid en Justitie draagt
      zorg voor de opening van een of meer afzonderlijke giro- of bankrekeningen van het CJIB welke rekeningen
      bestemd zijn voor de betaling van gelden voortvloeiend uit de tenuitvoerlegging van opgelegde ontnemings- of
      schadevergoedingsmaatregelen.


      2 De directeur van het CJIB is belast met het beheer van de in het eerste lid bedoelde giro- of bankrekeningen.


      3 Onze Minister stelt nadere voorschriften vast omtrent het beheer van de in het eerste lid bedoelde giro- of
      bankrekeningen en de in verband daarmee te voeren administratie.
    url: https://wetten.overheid.nl/BWBR0008537/2013-01-01#Artikel9
  - number: '10'
    text: |-
      1 Onze Minister stelt het formulier vast van het door de in [artikel 7, eerste lid][ref1], bedoelde personen uit te
      reiken betalingsbewijs.

      2 De ontvangen gelden worden regelmatig op de door het CJIB aangegeven wijze overgemaakt op de daartoe bestemde
      giro- of bankrekeningen van het CJIB.

      3 Onze Minister stelt nadere voorschriften vast omtrent de verstrekking en het beheer van de betalingswijzen, de
      afrekening en de verantwoording van de ontvangen gelden alsmede de in verband daarmee te voeren administratie.


      [ref1]: https://wetten.overheid.nl/BWBR0008537#Artikel7
    url: https://wetten.overheid.nl/BWBR0008537/2013-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008537
        artikel: '7'
        paragraaf: '2'
  - number: '11'
    text: |-
      De korpschef doet op de door Onze Minister te bepalen wijze jaarlijks opgave van de uitvoering van de in
      [artikel 10, derde lid][ref1], bedoelde voorschriften en van de met het oog op de toepassing van dit besluit
      verrichte accountantscontrole.


      [ref1]: https://wetten.overheid.nl/BWBR0008537#Artikel10
    url: https://wetten.overheid.nl/BWBR0008537/2013-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008537
        artikel: '10'
        paragraaf: '3'
  - number: 11a
    text: |-
      De kosten van het verhaal van een opgelegde ontnemings- of schadevergoedingsmaatregel worden op gelijke
      voet als de ontnemings- of schadevergoedingsmaatregel verhaald op degene aan wie deze maatregel is
      opgelegd. Onder de kosten van verhaal zijn begrepen de invorderingskosten. De kosten van verhaal,
      voor zover zij niet betreffen de invorderingskosten, worden berekend overeenkomstig de bij het
      [Besluit tarieven ambtshandelingen gerechtsdeurwaarders][ref1] vastgestelde tarieven. De omvang van de
      invorderingskosten wordt bepaald bij ministeriële regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0012638
    url: https://wetten.overheid.nl/BWBR0008537/2013-01-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0012638
  - number: '12'
    text: 'Dit besluit wordt aangehaald als: Besluit tenuitvoerlegging ontnemings- en schadevergoedingsmaatregelen.'
    url: https://wetten.overheid.nl/BWBR0008537/2013-01-01#Artikel12
  - number: '13'
    text: >-
      Dit besluit treedt in werking met ingang van dag na de datum van uitgifte van het *Staatsblad* waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0008537/2013-01-01#Artikel13
