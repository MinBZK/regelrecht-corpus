    text: >-
      Bij regeling van Onze Minister, in overeenstemming met Onze Ministers van Sociale Zaken en Werkgelegenheid en
      Veiligheid en Justitie, worden regels gesteld met betrekking tot de gegevens die de exploitant na een zwaar ongeval
      verstrekt aan de toezichthouder en met betrekking tot het door hem uit te oefenen toezicht.
    url: https://wetten.overheid.nl/BWBR0036791/2015-07-08#Artikel14
  - number: '15'
    text: |-
      1 Als gegevens als bedoeld in [artikel 19.3, eerste lid, laatste volzin, van de Wet milieubeheer][ref1] worden
      aangewezen:

      a. de actuele lijst met de in de inrichting aanwezige gevaarlijke stoffen, bedoeld in [artikel 12][ref2];

      b. het inspectierapport, zijnde het rapport met de bevindingen van de toezichthouder;

      c. de lijst van de gevaarlijke stoffen; en

      d. het veiligheidsrapport.

      2 Indien de toezichthouder ten aanzien van het inspectierapport, bedoeld in het eerste lid, onderdeel a,
      of het bevoegd gezag ten aanzien van het veiligheidsrapport toepassing geeft aan de bevoegdheid, bedoeld in
      [artikel 19.3, eerste lid, eerste volzin, van de Wet milieubeheer][ref3], wordt een aangepast rapport beschikbaar
      gesteld, die ten minste algemene informatie over risico’s van zware ongevallen, de mogelijke gevolgen op de
      menselijke gezondheid en het milieu bij een zwaar ongeval en in voorkomende gevallen de bevindingen bevat.

      3 Indien ingevolge het eerste en tweede lid een aangepast veiligheidsrapport is overgelegd waaruit de beschrijving
      van bepaalde stoffen is weggelaten, blijft vermelding van die stoffen op de lijst van de gevaarlijke stoffen
      eveneens achterwege.


