  - number: '27'
    text: |-
      1 Op de voorafgaand aan de dag van inwerkingtreding van dit besluit door een toezichthouder
      geconstateerde en aan de overtreder meegedeelde strafbare feiten en overtredingen als bedoeld in
      [artikel 25 van het Besluit risico's zware ongevallen 1999][ref1], blijven van toepassing de regelen geldend ten
      tijde van de constatering van het strafbare feit, onderscheidenlijk de overtreding.

      2 Op de voorafgaand aan de dag van inwerkingtreding van dit besluit ter zake van een strafbaar feit of overtreding
      als bedoeld in [artikel 25 van het Besluit risico's zware ongevallen 1999][ref2], door een toezichthouder opgelegde
      bestuurlijke boete waartegen nog bezwaar openstaat, en door een rechter in beroep of hoger beroep opgelegde straf
      waartegen nog hoger beroep of cassatie openstaat, blijven van toepassing de regelen geldend ten tijde van het
      opleggen van de bestuurlijke boete, onderscheidenlijk de straf.

      3 Op de voorafgaand aan de dag van inwerkingtreding van dit besluit aanhangige bezwaarschriften,
      beroepen, hoger beroepen en cassatie betreffende een strafbaar feit of overtreding als bedoeld in
      [artikel 25 van het Besluit risico's zware ongevallen 1999][ref3], door een toezichthouder opgelegde bestuurlijke
      boete en door een rechter opgelegde straf blijven van toepassing de regelen geldend ten tijde van het indienen van
      het bezwaarschrift onderscheidenlijk het instellen van het beroep, het hoger beroep, onderscheidenlijk de cassatie.


      [ref1]: https://wetten.overheid.nl/BWBR0010475#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0010475#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0010475#Artikel25
