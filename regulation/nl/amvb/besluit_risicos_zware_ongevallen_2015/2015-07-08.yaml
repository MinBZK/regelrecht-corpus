  - number: '3'
    text: >-
      1 Het bij of krachtens dit besluit bepaalde is van overeenkomstige toepassing op de werkgever, niet zijnde de
      exploitant, voor zover het betreft de bescherming van de veiligheid en gezondheid van zijn in de inrichting
      werkzame werknemers.


      2 Het bij of krachtens dit besluit bepaalde is van overeenkomstige toepassing op de in de inrichting werkzame
      zelfstandige en werkgever die de arbeid zelf verricht voor zover het betreft hun eigen veiligheid en gezondheid.


      3 De exploitant, de werkgever, bedoeld in eerste lid, en de zelfstandige en werkgever, bedoeld in tweede lid, geven
      onverminderd hun eigen verantwoordelijkheid gezamenlijk en in overleg uitvoering aan het bepaalde bij of krachtens
      dit besluit met betrekking tot de bescherming van de veiligheid en gezondheid van:


      a. de in de inrichting werkzame werknemers;


      b. de zelfstandige, bedoeld in tweede lid; en


      c. de werkgever, bedoeld in tweede lid.
    url: https://wetten.overheid.nl/BWBR0036791/2015-07-08#Artikel3
  - number: '4'
    text: >-
      1 Het bevoegd gezag draagt zorg voor de coördinatie in de uitoefening van bevoegdheden verleend bij of krachtens
      dit besluit.


      2 De instanties die zijn belast met de uitvoering of handhaving van het bepaalde bij of krachtens dit besluit
      verstrekken elkaar onverwijld de gegevens waarover zij beschikken, voor zover deze gegevens noodzakelijk zijn voor
      een goede vervulling van hun taken.


      3 Elke uitoefening van bevoegdheden, bedoeld in het eerste lid, wordt onderling afgestemd met de instanties,
      bedoeld in het tweede lid.


      4 De exploitant kan ter voldoening aan het bepaalde bij of krachtens dit besluit gegevens die zijn verzameld ter
      voldoening aan andere wettelijke voorschriften indienen, voor zover die gegevens voldoen aan het bepaalde bij of
      krachtens dit besluit.


      5 Bij regeling van Onze Minister, in overeenstemming met Onze Ministers van Sociale Zaken en Werkgelegenheid en
      Veiligheid en Justitie, kunnen nadere regels worden gesteld met betrekking tot het eerste tot en met vierde lid.
    url: https://wetten.overheid.nl/BWBR0036791/2015-07-08#Artikel4
  - number: '5'
    text: >-
      1 De exploitant treft alle maatregelen die nodig zijn om zware ongevallen te voorkomen en de gevolgen daarvan voor
      de menselijke gezondheid en het milieu te beperken.


      2 De exploitant kan te allen tijde aantonen aan de aangewezen toezichthouders dat hij alle noodzakelijke
      maatregelen heeft getroffen.


      3 Het is verboden de inrichting of een gedeelte daarvan in werking te hebben wanneer de bij of krachtens dit
      besluit te nemen maatregelen niet zijn getroffen of deze duidelijk onvoldoende zijn uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0036791/2015-07-08#Artikel5
  - number: '6'
    text: |-
      1 De exploitant zendt het bevoegd gezag een kennisgeving met daarin:

      a. de naam of handelsnaam van de exploitant;

      b. het volledige adres van de inrichting;

      c. de zetel van de exploitant en het adres ervan, indien dat afwijkt van onderdeel b;

      d. de naam en functie van de met de feitelijke leiding van de inrichting belaste persoon, indien die persoon niet
      de exploitant is;

      e. de gegevens die nodig zijn om de gevaarlijke stoffen en de categorie van stoffen te identificeren die in de
      inrichting aanwezig zijn of kunnen zijn;

      f. een lijst met de hoeveelheden, aard en fysische vormen van de gevaarlijke stoffen die aanwezig kunnen zijn in
      de inrichting;

      g. de activiteiten die in de inrichting worden uitgeoefend;

      h. informatie over de onmiddellijke omgeving van de inrichting en de factoren die een zwaar ongeval kunnen
      veroorzaken of de gevolgen ervan ernstiger kunnen maken.

      2 De exploitant van een hogedrempelinrichting neemt in de kennisgeving
      tevens het groepsrisico en het plaatsgebonden risico, bedoeld in
      __REF000___________________________________________________________________________________________________________
      _______, van de inrichting op.

      3 De kennisgeving, bedoeld in het eerste lid, of de actualisering ervan wordt door de exploitant aan het bevoegd
      gezag gezonden:

      a. voor nieuwe inrichtingen, bij de aanvraag om een omgevingsvergunning;

      b. voor bestaande inrichtingen en andere inrichtingen, binnen één jaar, gerekend vanaf de datum waarop dit besluit
      van toepassing is geworden op de inrichting.

      4 Het derde lid is niet van toepassing indien:

      a. de exploitant reeds voor de dag van inwerkingtreding van dit besluit een kennisgeving heeft verzonden of de
      gegevens, bedoeld in het eerste en tweede lid, reeds heeft ingediend bij het bevoegd gezag bij de aanvraag om een
      omgevingsvergunning;

      b. de daarin vervatte gegevens voldoen aan het eerste en tweede lid; en

      c. die gegevens ongewijzigd zijn.

      5 De exploitant stelt het bevoegd gezag in kennis van:

      a. een significante verhoging of verlaging van de hoeveelheid gevaarlijke stof die is opgenomen in de lijst van de
      gevaarlijke stoffen;

      b. een significante wijziging van:

      1°. de aard of de fysische vorm van een gevaarlijke stof die is opgenomen in de lijst van de gevaarlijke stoffen;

      2°. de processen waarbij een gevaarlijke stof die is opgenomen in de lijst van de gevaarlijke stoffen wordt
      gebruikt;

      c. wijzigingen van een inrichting of een installatie die aanzienlijke gevolgen kunnen hebben voor de gevaren van
      zware ongevallen;

      d. de definitieve sluiting van de inrichting of de ontmanteling ervan; of

      e. wijzigingen van de gegevens, bedoeld in het eerste lid, onderdelen a tot en met d.

      6 De exploitant stelt het bevoegd gezag in kennis van de wijzigingen, bedoeld in het vijfde lid, bij de aanvraag om
      een omgevingsvergunning of ruim voordat de wijziging plaatsvindt.

      7 De exploitant zorgt er voor dat de lijst met de gevaarlijke stoffen door een ieder kan worden geraadpleegd.

      8 Bij regeling van Onze Minister, in overeenstemming met Onze Ministers van Sociale Zaken en Werkgelegenheid en
      Veiligheid en Justitie, kunnen nadere regels worden gesteld met betrekking tot het eerste en vijfde tot en met
      zevende lid.


