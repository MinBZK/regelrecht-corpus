articles:
  - number: '1'
    text: |-
      1 In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      - *aanwezigheid van gevaarlijke stoffen:* werkelijke of verwachte aanwezigheid van gevaarlijke stoffen in de
      inrichting of van gevaarlijke stoffen waarvan redelijkerwijs kan worden voorzien dat deze kunnen ontstaan bij
      verlies van controle over de processen, met inbegrip van opslagactiviteiten, in installaties binnen de inrichting,
      in hoeveelheden gelijk aan of groter dan de drempelwaarden, genoemd in deel 1 of deel 2 van bijlage I bij de
      richtlijn;
      - *andere inrichting:* a. inrichting waarop op 31 mei 2015 het [Besluit risico’s zware ongevallen 1999][ref1]
      niet van toepassing was en waarop dit besluit op of na de dag van inwerkingtreding van dit besluit van toepassing
      is; of b. lagedrempelinrichting die op of na de dag van inwerkingtreding van dit besluit een hogedrempelinrichting
      wordt of omgekeerd, om redenen anders dan door wijzigingen van installaties of activiteiten die leiden tot een
      wijziging van de lijst van de gevaarlijke stoffen;
      - *bestaande inrichting:* inrichting waarop op 31 mei 2015 het [Besluit risico’s zware ongevallen 1999][ref2] van
      toepassing was en waarop dit besluit op de dag van inwerkingtreding van dit besluit van toepassing is, zonder dat
      een wijziging van de indeling als lagedrempelinrichting of hogedrempelinrichting heeft plaatsgevonden;
      - *bevoegd gezag:* bestuursorgaan als bedoeld in
      [artikel 1.1, eerste lid, van de Wet algemene bepalingen omgevingsrecht][ref3];
      - *delfstoffen:* stoffen als bedoeld in [artikel 1, onderdeel a, van de Mijnbouwwet][ref4];
      - *exploitant:* degene die de inrichting drijft;
      - *gevaarlijke stof:* onder deel 1 van bijlage I bij de richtlijn vallende of in deel 2 van bijlage I bij de
      richtlijn opgenomen stof of mengsel;
      - *hogedrempelinrichting:* inrichting waar gevaarlijke stoffen in hoeveelheden gelijk aan of groter dan de
      hoeveelheden, genoemd in de kolom 3 van deel 1 of kolom 3 van deel 2 van bijlage I bij de richtlijn, aanwezig zijn
      of mogen zijn, in voorkomend geval gebruikmakend van de sommatieregel, bedoeld in aantekening 4 bij bijlage I bij
      de richtlijn;
      - *inrichting:* inrichting als bedoeld in [artikel 1.1, eerste lid, van de Wet milieubeheer][ref5], zijnde een
      lagedrempelinrichting of een hogedrempelinrichting;
      - *installatie:* technische eenheid binnen een inrichting waar gevaarlijke stoffen worden geproduceerd, gebruikt,
      verwerkt of opgeslagen;
      - *intern noodplan:* plan als bedoeld in [artikel 11, eerste lid][ref6];
      - *lagedrempelinrichting:* inrichting waar gevaarlijke stoffen aanwezig zijn of mogen zijn in hoeveelheden gelijk
      aan of groter dan de hoeveelheden, genoemd in kolom 2 van deel 1 of kolom 2 van deel 2 van bijlage I bij de
      richtlijn, die evenwel niet gelijk zijn aan of niet groter zijn dan de hoeveelheden, genoemd in kolom 3 van deel
      1 of in kolom 3 van deel 2 van bijlage I bij de richtlijn, in voorkomend geval gebruikmakend van de sommatieregel,
      bedoeld in aantekening 4 bij bijlage I bij de richtlijn;
      - *lijst van de gevaarlijke stoffen:* lijst als bedoeld in [artikel 6, eerste lid, onderdeel f][ref7];
      - *nieuwe inrichting:* a. inrichting die in bedrijf wordt gesteld of wordt gebouwd op of
      na de dag van inwerkingtreding van dit besluit; b. inrichting waarop op 31 mei 2015 het
      [Besluit risico’s zware ongevallen 1999][ref8] niet van toepassing was en waarop dit besluit op of na de dag van
      inwerkingtreding van dit besluit van toepassing is door wijzigingen van installaties of activiteiten die leiden
      tot een wijziging van de lijst van de gevaarlijke stoffen; of c. lagedrempelinrichting die op of na de dag van
      inwerkingtreding van dit besluit een hogedrempelinrichting wordt of omgekeerd, door wijzigingen van installaties of
      activiteiten die leiden tot een wijziging van de lijst van de gevaarlijke stoffen;
      - *omgevingsvergunning:* omgevingsvergunning voor een activiteit als bedoeld in
      [artikel 2.1, eerste lid, onder e, van de Wet algemene bepalingen omgevingsrecht][ref9];
      - *Onze Minister:* Onze Minister van Infrastructuur en Milieu;
      - *opslag:* aanwezigheid van een hoeveelheid gevaarlijke stoffen voor opslag, veilige bewaring of voorraadbewaring;
      - *preventiebeleid voor zware ongevallen:* preventiebeleid als bedoeld in [artikel 7, eerste en tweede lid][ref10];
      - *rampbestrijdingsplan:* plan als bedoeld in [artikel 6.1.1. van het Besluit veiligheidsregio's][ref11];
      - *richtlijn:* [Richtlijn 2012/18](32012L0018)/EU van het Europees Parlement en de Raad van 4 juli 2012 betreffende
      de beheersing van de gevaren van zware ongevallen waarbij gevaarlijke stoffen zijn betrokken, houdende wijziging en
      vervolgens intrekking van [Richtlijn 96/82/EG](31996L0082) van de Raad (PbEU 2012, L 197);
      - *toezichthouder:* door het bevoegd gezag daartoe aangewezen personen, de toezichthouder, bedoeld
      in [artikel 1, derde lid, onderdeel d, van de Arbeidsomstandighedenwet][ref12], of de op basis van
      [artikel 61, eerste lid, van de Wet veiligheidsregio’s][ref13] aangewezen personen;
      - *veiligheidsbeheerssysteem:* beheerssysteem als bedoeld in [artikel 7, zesde lid][ref14];
      - *veiligheidsrapport:* rapport als bedoeld in [artikel 10, eerste tot en met derde lid][ref15];
      - *zwaar ongeval:* gebeurtenis als gevolg van ongecontroleerde ontwikkelingen tijdens de bedrijfsuitoefening in een
      inrichting, waardoor onmiddellijk of na verloop van tijd ernstig gevaar voor de menselijke gezondheid of het milieu
      binnen of buiten de inrichting ontstaat en waarbij één of meer gevaarlijke stoffen betrokken zijn.

      2 Een wijziging van bijlagen I tot en met IV bij de richtlijn gaat voor de toepassing van dit besluit en de daarop
      berustende bepalingen gelden met ingang van de dag waarop aan de betrokken wijziging uitvoering moet zijn gegeven,
      tenzij bij ministerieel besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.


