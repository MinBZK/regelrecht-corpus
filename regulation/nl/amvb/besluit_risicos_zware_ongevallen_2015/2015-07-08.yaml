preamble:
  text: >-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van de Staatssecretaris van Infrastructuur en Milieu van 17 februari 2015, nr. IenM/BSK-
    2015/16340, Hoofddirectie Bestuurlijke en Juridische Zaken, mede namens de Minister van Sociale Zaken en
    Werkgelegenheid en de Minister van Veiligheid en Justitie;


    Gelet op Richtlijn 2012/18/EU van het Europees Parlement en de Raad van 4 juli 2012 betreffende de beheersing
    van de gevaren van zware ongevallen waarbij gevaarlijke stoffen zijn betrokken, houdende wijziging en vervolgens
    intrekking van Richtlijn 96/82/EG van de Raad (PbEU 2012, L 197) en op de artikelen 8.40, 8.41, 8.42, 19.3,
    eerste lid, en 21.8 van de Wet milieubeheer, de artikelen 2.8 en 2.22, derde lid, van de Wet algemene bepalingen
    omgevingsrecht, de artikelen 6, eerste lid, 7, eerste lid, 16, eerste, zevende, achtste en tiende lid, 27, vijfde
    lid, 28a, eerste en zevende lid, 33, tweede en derde lid, en 34, vierde, vijfde, zesde, zevende en negende lid, van
    de Arbeidsomstandighedenwet en de artikelen 31, vierde lid, 48, zesde lid, 49, eerste lid, en 61, tweede lid, van
    de Wet veiligheidsregio’s;


    De Afdeling advisering van de Raad van State gehoord (advies van 7 mei 2015, nr. W14.15.0034/IV);


    Gezien het nader rapport van de Staatssecretaris van Infrastructuur en Milieu van 23 juni 2015, nr. IenM/
    BSK-2015/114865, Hoofddirectie Bestuurlijke en Juridische Zaken, mede namens de Minister van Sociale Zaken en
    Werkgelegenheid en de Minister van Veiligheid en Justitie;


    Hebben goedgevonden en verstaan:
