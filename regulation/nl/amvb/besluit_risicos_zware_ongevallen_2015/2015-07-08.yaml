  - number: '7'
    text: |-
      1 De exploitant stelt een schriftelijk document op waarin het preventiebeleid inzake de beheersing van risico’s op
      zware ongevallen wordt omschreven. Het preventiebeleid bevat:

      a. de algemene doelen van het handelen van de exploitant;

      b. de beginselen voor het handelen van de exploitant;

      c. de rol en de verantwoordelijkheid van het management; en

      d. de verbintenis om de beheersing van gevaren van zware ongevallen continu te verbeteren en hoge
      beschermingsniveaus te waarborgen.

      2 Het preventiebeleid voor zware ongevallen staat borg voor een hoog beschermingsniveau van de menselijke
      gezondheid en het milieu, en is evenredig aan de gevaren van zware ongevallen.

      3 Het preventiebeleid voor zware ongevallen wordt opgesteld:

      a. voor nieuwe inrichtingen, bij de aanvraag om een omgevingsvergunning;

      b. voor bestaande inrichtingen en andere inrichtingen, binnen één jaar, gerekend vanaf de datum waarop dit besluit
      van toepassing is geworden op de inrichting.

      4 Het derde lid is niet van toepassing indien:

      a. de exploitant reeds voor de dag van inwerkingtreding van dit besluit een preventiebeleid voor zware ongevallen
      heeft opgesteld;

      b. de daarin vervatte gegevens voldoen aan het eerste en tweede lid; en

      c. die gegevens ongewijzigd zijn.

      5 Onverminderd [artikel 9][ref1], beziet de exploitant het preventiebeleid voor zware ongevallen ten minste om de
      vijf jaar opnieuw. Indien nodig, werkt de exploitant het preventiebeleid bij.

      6 De exploitant draagt zorg voor de correcte uitvoering van het preventiebeleid voor zware ongevallen. Het
      preventiebeleid voor zware ongevallen wordt uitgevoerd met een veiligheidsbeheerssysteem dat voldoet aan de
      elementen, genoemd in bijlage III bij de richtlijn, en met passende middelen en structuren die evenredig zijn aan
      de gevaren van zware ongevallen en de complexiteit van de organisatie of de activiteiten van de inrichting.

      7 Bij regeling van Onze Minister, in overeenstemming met Onze Ministers van Sociale Zaken en Werkgelegenheid en
      Veiligheid en Justitie, kunnen nadere regels worden gesteld met betrekking tot het eerste, tweede, vijfde en zesde
      lid.


