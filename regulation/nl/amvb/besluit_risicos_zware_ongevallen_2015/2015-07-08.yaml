  - number: '10'
    text: |-
      1 De exploitant van een hogedrempelinrichting stelt een veiligheidsrapport op en zorgt ervoor dat in de inrichting
      een veiligheidsrapport aanwezig is dat de actuele stand van zaken met betrekking tot de veiligheid van de betrokken
      inrichting weergeeft.

      2 Het veiligheidsrapport bevat ten minste de gegevens en beschrijvingen, bedoeld in bijlage II bij de richtlijn, op
      zodanige wijze dat wordt aangetoond dat:

      a. een preventiebeleid voor zware ongevallen en een veiligheidsbeheerssysteem zijn ingevoerd;

      b. de gevaren van zware ongevallen en ongevalscenario’s zijn geïdentificeerd en de nodige maatregelen zijn
      getroffen om die zware ongevallen te voorkomen en de gevolgen daarvan voor de menselijke gezondheid en het milieu
      te beperken;

      c. het ontwerp, de constructie, de exploitatie en het onderhoud van alle met de werking van de inrichting
      samenhangende installaties, opslagplaatsen, apparatuur en infrastructuur die in verband staan met de gevaren van
      een zwaar ongeval binnen de inrichting, voldoende veilig en betrouwbaar zijn; en

      d. een intern noodplan is ingevoerd.

      3 Het veiligheidsrapport bevat tevens de namen van de organisaties die betrokken zijn geweest bij het opstellen van
      dat rapport en toont aan dat de gegevens die nodig zijn om een rampbestrijdingsplan op te stellen beschikbaar zijn.

      4 Het veiligheidsrapport wordt door de exploitant opgesteld en aan het bevoegd gezag gezonden:

      a. voor nieuwe inrichtingen, bij de aanvraag om een omgevingsvergunning;

      b. voor bestaande inrichtingen, voor 1 juni 2016;

      c. voor andere inrichtingen, binnen twee jaar, gerekend vanaf de datum waarop dit besluit van toepassing is
      geworden op de inrichting.

      5 Het vierde lid is niet van toepassing indien:

      a. de exploitant reeds voor de dag van inwerkingtreding van dit besluit een veiligheidsrapport heeft verzonden;

      b. de daarin vervatte gegevens voldoen aan het tweede tot en met vierde lid; en

      c. die gegevens ongewijzigd zijn.

      6 Indien ingevolge het eerste tot en met derde lid slechts delen van het veiligheidsrapport wijziging behoeven,
      verstrekt de exploitant die gewijzigde delen in een begrijpelijke vorm, met inachtneming van het vierde lid.

      7 Onverminderd [artikel 9][ref1], beziet de exploitant het veiligheidsrapport ten minste iedere vijf jaar opnieuw.
      Indien nodig, werkt de exploitant het veiligheidsrapport bij.

      8 Onverminderd het zevende lid, beziet de exploitant het veiligheidsrapport ook opnieuw en werkt het indien nodig
      bij na een zwaar ongeval in zijn inrichting en op enig ander tijdstip op initiatief van de exploitant of op verzoek
      van het bevoegd gezag, indien nieuwe feiten zulks rechtvaardigen of om rekening te houden met nieuwe technische
      kennis aangaande veiligheid.

      9 Het veiligheidsrapport dat overeenkomstig het zevende of achtste lid is bijgewerkt of bijgewerkte delen daarvan
      worden door de exploitant onverwijld aan het bevoegd gezag toegezonden.

      10 Het bevoegd gezag beoordeelt het veiligheidsrapport en stelt de exploitant binnen redelijke termijn in kennis
      van zijn conclusies naar aanleiding van het veiligheidsrapport.

      11 Het veiligheidsrapport en wijzigingen daarvan, voor zover het betreft de onderdelen 1, 2, sub b en d, 3, 4, en
      5 van bijlage II bij de richtlijn, voor zover die onderdelen verband houden met de bescherming van de veiligheid
      en gezondheid van de in de inrichting werkzame werknemers, worden voorafgaand aan de toezending aan het bevoegd
      gezag, bij het ontbreken van een ondernemingsraad of personeelsvertegenwoordiging, opgesteld met raadpleging van
      belanghebbende werknemers.

      12 De exploitant zorgt ervoor dat desgewenst kennis kunnen nemen van de in het tweede lid genoemde onderdelen van
      het veiligheidsrapport:

      a. de in de inrichting werkzame werknemers;

      b. de bedrijfshulpverleners, bedoeld in [artikel 15, eerste lid, van de Arbeidsomstandighedenwet][ref2];

      c. de externe hulpverleningsorganisaties, bedoeld in
      [artikel 3, eerste lid, onderdeel e, van de Arbeidsomstandighedenwet][ref3];

      d. de deskundigen, genoemd in [artikel 13, tweede lid, van de Arbeidsomstandighedenwet][ref4];

      e. de deskundigen of arbodiensten, genoemd in de [artikelen 14][ref5] en
      [14a van de Arbeidsomstandighedenwet][ref6]; en

      f. de in de inrichting werkzame personen, genoemd in [artikel 3, tweede lid][ref7].

      13 Bij regeling van Onze Minister, in overeenstemming met Onze Ministers van Sociale Zaken en Werkgelegenheid en
      Veiligheid en Justitie, kunnen nadere regels worden gesteld met betrekking tot het eerste tot en met derde lid en
      het zesde tot en met tiende lid.


