  - number: '12'
    text: >-
      1 De exploitant van een hogedrempelinrichting houdt een actuele lijst van de in de inrichting aanwezige gevaarlijke
      stoffen bij en zorgt dat deze lijst ten allen tijde in de inrichting aanwezig is. Deze lijst bevat:


      a. een beschrijving van de gevaarlijke stoffen die in de inrichting aanwezig zijn;


      b. de aard en de fysische vorm van deze stoffen onder de in de inrichting geldende omstandigheden en bij een
      voorzienbaar ongeval; en


      c. de hoeveelheden waarin deze stoffen in de inrichting voorkomen.


      2 De exploitant zorgt er voor dat hulpverleningsdiensten van de overheid voor elke installatie direct toegang
      hebben tot de lijst, bedoeld in het eerste lid.


      3 Bij regeling van Onze Minister, in overeenstemming met Onze Ministers van Sociale Zaken en Werkgelegenheid en
      Veiligheid en Justitie, kunnen nadere regels worden gesteld ter uitwerking van het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0036791/2015-07-08#Artikel12
  - number: '13'
    text: |-
      1 De toezichthouders zorgen gezamenlijk voor het opstellen en het beheren van een inspectiesysteem.

      2 Inspecties worden afgestemd op het soort inrichting en zijn niet afhankelijk van de ontvangst van het
      veiligheidsrapport of van andere ingediende rapporten.

      3 Inspecties zijn zodanig opgezet dat een planmatig en systematisch, technisch, organisatorisch en bedrijfskundig
      onderzoek van de in de inrichting gebruikte systemen kan worden uitgevoerd om na te gaan of:

      a. de exploitant kan aantonen dat de passende maatregelen zijn getroffen teneinde zware ongevallen te voorkomen;

      b. de exploitant kan aantonen dat in passende middelen is voorzien teneinde de gevolgen van zware ongevallen binnen
      en buiten de inrichting te beperken; en

      c. de gegevens en informatie vervat in het veiligheidsrapport of in een ander ingediend rapport, de situatie in de
      inrichting adequaat weergeven.

      4 De toezichthouders stellen gezamenlijk een inspectieplan op voor alle inrichtingen.

      5 Het inspectieplan bevat ten minste:

      a. een algemene beoordeling van de relevante veiligheidskwesties;

      b. het geografische gebied dat het inspectieplan bestrijkt;

      c. een lijst van de inrichtingen die onder het plan vallen;

      d. een lijst van de inrichtingen, aangewezen overeenkomstig [artikel 8, eerste lid][ref1];

      e. een lijst van de inrichtingen waar specifieke externe risico's of gevarenbronnen het risico voor of de gevolgen
      van een zwaar ongeval kunnen vergroten;

      f. procedures voor routinematige inspecties, waaronder de programma's voor dergelijke inspecties, bedoeld in het
      zevende lid;

      g. procedures voor niet-routinematige inspecties als bedoeld in het twaalfde lid; en

      h. bepalingen inzake de samenwerking tussen de verschillende inspectiediensten.

      6 De toezichthouders bezien het inspectieplan regelmatig. Indien nodig, werken de toezichthouders het inspectieplan
      bij.

      7 De toezichthouders stellen gezamenlijk op basis van de inspectieplannen regelmatig programma’s voor routinematige
      en niet-routinematige inspecties voor alle inrichtingen op.

      8 De programma’s, bedoeld in het zevende lid, vermelden in ieder geval de frequentie van de inspecties ter plaatse
      voor de verschillende soorten inrichtingen. De periode tussen twee opeenvolgende inspecties ter plaatse bedraagt
      ten hoogste:

      a. één jaar voor hogedrempelinrichtingen;

      b. drie jaar voor lagedrempelinrichtingen.

      9 Het achtste lid, tweede volzin, is niet van toepassing indien de toezichthouders een inspectieprogramma
      hebben opgesteld op grond van een systematische evaluatie van de gevaren van zware ongevallen bij de betrokken
      inrichtingen.

      10 De systematische evaluatie van de gevaren van de betrokken inrichtingen wordt in ieder geval gebaseerd op:

      a. de mogelijke effecten van de betrokken inrichtingen op de menselijke gezondheid en het milieu;

      b. gegevens betreffende de naleving van het bij of krachtens dit besluit bepaalde.

      11 Onverminderd het tiende lid wordt, indien relevant, rekening gehouden met bevindingen van inspecties die zijn
      uitgevoerd krachtens andere wettelijke voorschriften.

      12 Niet-routinematige inspecties worden uitgevoerd om ernstige klachten, ernstige ongevallen en bijna-ongevallen,
      incidenten en gevallen van niet-naleving zo spoedig mogelijk te onderzoeken.

      13 De toezichthouders delen de exploitant binnen vier maanden na iedere inspectie de conclusies van de inspectie
      mede.

      14 De toezichthouders zien erop toe dat de exploitant binnen een redelijke termijn na ontvangst van de mededeling,
      bedoeld in het dertiende lid, de noodzakelijke acties neemt.

      15 Als bij een inspectie een belangrijke overtreding van het bij of krachtens dit besluit bepaalde wordt
      geconstateerd, wordt binnen zes maanden een aanvullende inspectie verricht.

      16 De inspecties worden zoveel mogelijk gecoördineerd en, voor zover mogelijk, gecombineerd verricht met inspecties
      krachtens andere wettelijke voorschriften.

      17 Het bevoegd gezag verschaft aan een ieder in ieder geval:

      a. de datum van de laatste routinematige inspectie ter plaatse bij een inrichting of een verwijzing naar de plaats
      waar die informatie elektronisch kan worden geraadpleegd; en

      b. inlichtingen over de wijze waarop er op verzoek meer gedetailleerde gegevens over de inspectie en het
      inspectieplan kunnen worden verkregen.

      18 Bij regeling van Onze Minister, in overeenstemming met Onze Ministers van Sociale Zaken en Werkgelegenheid en
      Veiligheid en Justitie, kunnen nadere regels worden gesteld met betrekking tot het derde, zesde tot en met achtste,
      tiende tot en met twaalfde en het veertiende tot en met zeventiende lid.


      [ref1]: https://wetten.overheid.nl/BWBR0036791#Artikel8
