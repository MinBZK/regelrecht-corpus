    text: |-
      1 De exploitant van een hogedrempelinrichting stelt een intern noodplan op voor bij een zwaar ongeval
      binnen de inrichting ten uitvoer te leggen maatregelen, gericht op het indammen, beheersen en zo
      veel mogelijk beperken van zware ongevallen en de gevolgen ervan voor de in de inrichting werkzame
      personen, genoemd in [artikel 3, eerste of tweede lid][ref1], het milieu en de zaken, genoemd in
      [artikel 10, tweede lid, onderdeel c][ref2], en voor de externe communicatie ter zake wanneer zich een zwaar
      ongeval voordoet. Het intern noodplan bevat ten minste de gegevens en beschrijvingen, opgenomen in bijlage IV bij
      de richtlijn.

      2 De exploitant beziet het intern noodplan ten minste iedere drie jaar. Indien nodig werkt de
      exploitant het intern noodplan bij. Daarbij houdt de exploitant rekening met in de inrichting
      toegepaste werk- en productiemethoden en de bij de externe hulpverleningsorganisaties, bedoeld in
      [artikel 3, eerste lid, onderdeel e, van de Arbeidsomstandighedenwet][ref3], aangebrachte veranderingen van
      technische of organisatorische aard en veranderingen in het veiligheidsinzicht die voor de risico's van een zwaar
      ongeval belangrijke gevolgen kunnen hebben.

      3 Het intern noodplan en de wijziging daarvan worden, bij het ontbreken van een ondernemingsraad of
      personeelsvertegenwoordiging, opgesteld met raadpleging van belanghebbende werknemers. Over het intern noodplan
      en de wijziging daarvan worden tevens geraadpleegd de werknemers van andere werkgevers die op basis van een
      langlopende overeenkomst tot aanneming van werk mede in de inrichting werkzaam zijn.

      4 De exploitant zorgt ervoor dat desgewenst kennis kunnen nemen van het intern noodplan:

      a. in de inrichting werkzame werknemers;

      b. de bedrijfshulpverleners, bedoeld in [artikel 15, eerste lid, van de Arbeidsomstandighedenwet][ref4];

      c. de externe hulpverleningsorganisaties, bedoeld in
      [artikel 3, eerste lid, onderdeel e, van de Arbeidsomstandighedenwet][ref5];

      d. de deskundigen, genoemd in [artikel 13, tweede lid, van de Arbeidsomstandighedenwet][ref6];

      e. de deskundigen of arbodiensten, genoemd in de [artikelen 14][ref7] en
      [14a van de Arbeidsomstandighedenwet][ref8]; en

      f. de in inrichting werkzame personen, genoemd in [artikel 3, tweede lid][ref9].

      5 Het intern noodplan wordt opgesteld:

      a. voor nieuwe inrichtingen, binnen een redelijke termijn vóór de inbedrijfstelling, of vóór wijzigingen die leiden
      tot een aanpassing van de lijst van de gevaarlijke stoffen;

      b. voor bestaande hogedrempelinrichtingen, voor 1 juni 2016;

      c. voor andere inrichtingen, binnen twee jaar, gerekend vanaf de datum waarop dit besluit van toepassing is
      geworden op de inrichting.

      6 Het vijfde lid, onder b, is niet van toepassing indien:

      a. de exploitant reeds voor de dag van inwerkingtreding van dit besluit een intern noodplan heeft opgesteld;

      b. de daarin vervatte gegevens voldoen aan het tweede lid; en

      c. die gegevens ongewijzigd zijn.

      7 Bij regeling van Onze Minister, in overeenstemming met Onze Ministers van Sociale Zaken en Werkgelegenheid en
      Veiligheid en Justitie, kunnen nadere regels worden gesteld ter uitwerking van het eerste lid.


