  - number: '9'
    text: |-
      1 In geval van wijziging van een installatie, inrichting, opslagplaats of proces of van de aard, de fysische vorm
      of de hoeveelheden gevaarlijke stoffen die belangrijke gevolgen kan hebben voor de gevaren van zware ongevallen,
      of die ertoe kan leiden dat een lagedrempelinrichting een hogedrempelinrichting wordt of omgekeerd, en waarvoor
      geen omgevingsvergunning is vereist op grond van [artikel 2.4 van het Besluit omgevingsrecht][ref1], werkt de
      exploitant, indien nodig, de kennisgeving, het preventiebeleid voor zware ongevallen, het veiligheidsbeheerssysteem
      en het veiligheidsrapport bij, indien dat niet reeds ter voldoening aan voorschriften bij of krachtens dit besluit
      is gedaan.

      2 De exploitant licht het bevoegd gezag in over de bijzonderheden van de wijzigingen, bedoeld in het eerste lid,
      voordat de wijziging plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel2.4
