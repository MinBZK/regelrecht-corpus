    text: |-
      1 Handelen of nalaten door de werkgever, zijnde exploitant, of de werkgever,
      bedoeld in [artikel 3, eerste lid][ref1], in strijd met het bij of krachtens
      [artikel 6, eerste lid, tweede zin, van de Arbeidsomstandighedenwet][ref2] bij of krachtens de
      [artikelen 3, eerste en derde lid][ref3], [5][ref4], [6, eerste, derde, vijfde tot en met achtste lid][ref5],
      [7, eerste, tweede, derde, vijfde, zesde en zevende lid][ref6], [8, derde tot en met vijfde lid][ref7],
      [9][ref8], [10, eerste tot en met vierde, zesde tot en met negende, elfde tot en met dertiende lid][ref9],
      [11, eerste tot en met vijfde en zevende lid][ref10], [12][ref11], [13, derde lid][ref12],
      [14][ref13] of [15, tweede lid][ref14], bepaalde, is een strafbaar feit als bedoeld in
      [artikel 6, derde lid, van de Arbeidsomstandighedenwet][ref15].

      2 Als overtreding waarvoor een bestuurlijke boete kan worden opgelegd, wordt aangemerkt het handelen of
      nalaten door de werkgever, zijnde exploitant, de werkgever, bedoeld in [artikel 3, eerste lid][ref16], of
      de in de inrichting werkzame zelfstandige of werkgever die de arbeid zelf verricht, in strijd met het bij of
      krachtens artikel 3, tweede lid, of de in het eerste lid genoemde artikelen bepaalde, met uitzondering van
      [artikel 5, derde lid][ref17].

      3 Als ernstige overtreding in de zin van [artikel 34, zesde en negende lid, van de Arbeidsomstandighedenwet][ref18]
      wordt aangemerkt een overtreding waardoor de werkgever, zijnde exploitant, de werkgever, bedoeld in
      [artikel 3, eerste lid][ref19], of de in de inrichting werkzame zelfstandige of werkgever die de arbeid zelf
      verricht, weet of redelijkerwijs moet weten, dat levensgevaar of ernstige schade aan de gezondheid van een of meer
      werknemers dan wel van de in de inrichting werkzame zelfstandige of werkgever die de arbeid verricht, ontstaat of
      te verwachten is.

      4 Als soortgelijke verplichtingen en verboden als bedoeld in
      [artikel 34, vijfde en zevende lid, van de Arbeidsomstandighedenwet][ref20] worden aangewezen verplichtingen
      en verboden die voortvloeien uit het bij of krachtens een ander lid of onderdeel van de in het eerste lid
      genoemde artikelen en artikelleden bepaalde, mits het boetenormbedrag voor de bestuurlijke boete op overtreding
      van deze verplichting of dat verbod op grond van de beleidsregels, bedoeld in artikel 34, tiende lid, van de
      Arbeidsomstandighedenwet, hoger is dan 12.500 euro.

      5 In afwijking van het vierde lid wordt een overtreding van [artikel 5, eerste lid][ref21],
      of [artikel 7, zesde lid][ref22], aangemerkt als een soortgelijke overtreding indien
      het boetenormbedrag op deze overtreding op grond van de beleidsregels, bedoeld in
      [artikel 34, tiende lid, van de Arbeidsomstandighedenwet][ref23], is ingedeeld in dezelfde boetecategorie als het
      boetenormbedrag van de eerdere overtreding.

      6 Ten behoeve van de naleving van het bij of krachtens de in het eerste lid genoemde artikelen bepaalde kan een
      last onder bestuursdwang worden opgelegd.


