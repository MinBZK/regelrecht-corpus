  - number: '18'
    text: |-
      1 Na een herhaling van een overtreding of een soortgelijke overtreding kan een waarschuwing als bedoeld in
      [artikel 28a, eerste lid, van de Arbeidsomstandighedenwet][ref1], worden gegeven en indien opnieuw dezelfde of een
      soortgelijke overtreding is geconstateerd als bedoeld in dat artikel, kan de werkgever, zijnde exploitant, of de
      werkgever, bedoeld in [artikel 3, eerste lid][ref2], een bevel worden opgelegd door de daartoe aangewezen ambtenaar
      dat de door hem aangewezen werkzaamheden voor een daarbij aangegeven periode van ten hoogste drie maanden worden
      stilgelegd dan wel niet mogen aanvangen.

      2 Indien de aard van de overtreding of de met de overtreding samenhangende omstandigheden, dan wel de gevolgen
      van een stillegging van de werkzaamheden daartoe aanleiding geven, kan worden afgezien van een waarschuwing en een
      bevel als bedoeld in het eerste lid.

      3 Van een soortgelijke overtreding als bedoeld in het eerste en tweede lid, is sprake als het een overtreding
      van het bij of krachtens een ander lid of onderdeel van de in [artikel 17, eerste lid][ref3], genoemd artikelen
      bepaalde betreft, mits het boetenormbedrag voor de bestuurlijke boete op deze overtreding op grond van de
      beleidsregels, bedoeld in [artikel 34, tiende lid, van de Arbeidsomstandighedenwet][ref4], hoger dan 50.000 euro
      is.

      4 In afwijking van het derde lid wordt een overtreding van [artikel 5, eerste lid][ref5],
      en [artikel 7, zesde lid][ref6], aangemerkt als een soortgelijke overtreding indien
      het boetenormbedrag van deze overtreding op grond van de beleidsregels, bedoeld in
      [artikel 34, tiende lid, van de Arbeidsomstandighedenwet][ref7] is ingedeeld in dezelfde boetecategorie als het
      boetenormbedrag van de eerdere overtreding.


