  - number: '2'
    text: |-
      1 Dit besluit is niet van toepassing op:

      a. militaire inrichtingen, installaties of opslagplaatsen;

      b. vervoer van gevaarlijke stoffen over de weg, per spoor, over binnenwateren, over zee of door de lucht en
      rechtstreeks aan dit vervoer gerelateerde tijdelijke opslag, tenzij de activiteiten onderdeel zijn van een
      inrichting;

      c. vervoer van gevaarlijke stoffen door buisleidingen als bedoeld in
      [artikel 12.11, eerste lid, onderdeel d, van de Wet milieubeheer][ref1], tenzij de buisleidingen onderdeel zijn van
      een inrichting;

      d. exploitatie, zijnde de exploratie, winning en verwerking, van delfstoffen in mijnen, groeven of met behulp van
      boorgaten;

      e. offshore exploratie en exploitatie van delfstoffen;

      f. offshore ondergrondse gasopslag, waaronder in ieder geval specifieke opslaglocaties en locaties waar eveneens
      aan exploratie en exploitatie van delfstoffen wordt gedaan;

      g. stortplaatsen voor afval, waaronder ondergrondse opslag van afval.

      2 In afwijking van het eerste lid, onderdelen d en g, is dit besluit van toepassing op:

      a. onshore ondergrondse gasopslag in natuurlijke aardlagen, waterhoudende grondlagen, zoutholtes en niet meer
      gebruikte mijnen; en

      b. chemische en thermische verwerkingsactiviteiten en opslag die samenhangt met die activiteiten, waarbij
      gevaarlijke stoffen betrokken zijn, alsook operationele voorzieningen voor het zich ontdoen van residuen, waaronder
      residuvijvers of residubekkens, die gevaarlijke stoffen bevatten.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel12.11
