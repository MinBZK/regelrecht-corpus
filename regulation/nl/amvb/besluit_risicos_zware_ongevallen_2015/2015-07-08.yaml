  - number: '28'
    text: |-
      1 Op een voorafgaand aan de dag van inwerkingtreding van dit besluit in verband met de niet-nakoming van een bij of
      krachtens het [Besluit risico's zware ongevallen 1999][ref1] gestelde verplichting uitgevaardigde beschikking tot
      oplegging van een last onder bestuursdwang of dwangsom, onderscheidenlijk opgelegde eis tot naleving als bedoeld in
      [artikel 27 van de Arbeidsomstandighedenwet][ref2], blijven daarop van toepassing de regelen geldend ten tijde van
      uitvaardiging van de beschikking tot oplegging van een last onder bestuursdwang of dwangsom, onderscheidenlijk het
      opleggen van de eis tot naleving.

      2 Op de voorafgaand aan de dag van inwerkingtreding van dit besluit in verband met de niet-nakoming van een bij
      of krachtens het [Besluit risico's zware ongevallen 1999][ref3] gestelde verplichting uitgevaardigde beschikking
      tot oplegging van een last onder bestuursdwang of dwangsom, onderscheidenlijk opgelegde eis tot naleving als
      bedoeld in [artikel 27 van de Arbeidsomstandighedenwet][ref4], waartegen nog bezwaar, beroep of hoger beroep
      openstaat, blijven van toepassing de bij of krachtens het [Besluit risico’s zware ongevallen 1999][ref5] gestelde
      voorschriften, zoals die luidden voorafgaand aan de dag van inwerkingtreding van dit besluit.

      3 Op de voorafgaand aan de dag van inwerkingtreding van dit besluit aanhangige bezwaarschriften,
      beroepen en hoger beroepen tegen een in verband met de niet-nakoming van een bij of krachtens het
      [Besluit risico's zware ongevallen 1999][ref6] gestelde verplichting uitgevaardigde beschikking tot oplegging
      van een last onder bestuursdwang of dwangsom, onderscheidenlijk opgelegde eis tot naleving als bedoeld in
      [artikel 27 van de Arbeidsomstandighedenwet][ref7], blijven van toepassing de regelen geldend ten tijde van het
      indienen van het bezwaarschrift onderscheidenlijk het instellen van het beroep, onderscheidenlijk het hoger beroep.


