  - number: '8'
    text: |-
      1 Op grond van alle beschikbare gegevens wijst het bevoegd gezag inrichtingen of groepen inrichtingen aan
      waarvoor het risico op een zwaar ongeval of de gevolgen daarvan, ten gevolge van de geografische ligging van die
      inrichtingen ten opzichte van elkaar en de aanwezigheid van gevaarlijke stoffen in die inrichtingen, groter kunnen
      zijn dan op grond van de in die afzonderlijke inrichtingen aanwezige hoeveelheden kan worden verwacht.

      2 Wanneer het bevoegd gezag beschikt over gegevens als bedoeld in [artikel 6, eerste lid, onderdeel h][ref1], die
      niet zijn verstrekt door de exploitant, worden deze gegevens ter beschikking gesteld van die exploitant, voor zover
      dit nodig is voor de toepassing van dit artikel.

      3 De exploitanten van de inrichtingen, bedoeld in het eerste lid, wisselen gegevens die noodzakelijk zijn
      om rekening te houden met de aard en de omvang van het risico van een zwaar ongeval uit, ten behoeve van
      het preventiebeleid voor zware ongevallen, het veiligheidsbeheerssysteem, en indien van toepassing, het
      veiligheidsrapport en het intern noodplan.

      4 De exploitanten van de inrichtingen, bedoeld in het eerste lid, werken samen met het oog op de voorlichting van
      het publiek en de nabijgelegen bedrijven die buiten het toepassingsbereik van dit besluit vallen en met het oog op
      het verstrekken van informatie ten behoeve van het opstellen van het rampbestrijdingsplan door het bestuur van de
      veiligheidsregio, bedoeld in [artikel 6.1.1. van het Besluit veiligheidsregio’s][ref2].

      5 Bij regeling van Onze Minister, in overeenstemming met Onze Ministers van Sociale Zaken en Werkgelegenheid en
      Veiligheid en Justitie, kunnen nadere regels worden gesteld met betrekking tot het eerste tot en met vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0036791#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0027844#Artikel6.1.1
