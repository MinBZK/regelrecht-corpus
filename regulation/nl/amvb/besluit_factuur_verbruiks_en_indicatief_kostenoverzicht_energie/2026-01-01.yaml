preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Economische Zaken van 3 februari 2015, nr. WJZ / 15008591;

    Gelet op de artikelen 10 en 11 van Richtlijn (EU) nr. 2012/27/EU van het Europees Parlement en de Raad van
    25 oktober 2012 betreffende energie-efficiëntie, tot wijziging van de Richtlijnen 2009/125/EG en 2010/30/EU en
    houdende intrekking van de Richtlijnen 2004/8/EG en 2006/32/EG (PbEU 2012, L 315), de artikelen 4 en 5 van de
    Wet implementatie EU-richtlijnen energie-efficiëntie, de artikelen 95lb en 95lc van de Elektriciteitswet 1998, de
    artikelen 42b en 42c van de Gaswet, artikel 8b van de Warmtewet en artikel 3 van de Kaderwet EZ-subsidies;

    De Afdeling advisering van de Raad van State gehoord (advies van 12 maart 2015, nr. W15.15.0023/IV);

    Gezien het nader rapport van Onze Minister van Economische Zaken van 19 mei 2015, nr. WJZ / 15037098;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder: - *doorleverancier:* een natuurlijke persoon of rechtspersoon die een
      overeenkomst heeft afgesloten met een energieleverancier ten behoeve van verbruik van warmte of koude door een
      eindgebruiker;
        - *eindafnemer:* een afnemer als bedoeld in
      [artikel 1, onder f, van de Wet uitvoering EU-handelingen energie-efficiëntie][ref1];
        - *eindgebruiker:* een natuurlijke persoon of rechtspersoon die warmte of koude verbruikt en voor wie een
      doorleverancier een overeenkomst heeft afgesloten met een energieleverancier;
        - *energieleverancier:* leverancier van warmte als bedoeld in [artikel 1, eerste lid van de Warmtewet][ref2], of
      van koude;
        - *leverancier van brandstof:* leverancier van brandstof, niet zijnde een energieleverancier of een leverancier als
      bedoeld in [artikel 1.1. van de Energiewet][ref3];
        - *richtlijn meetinstrumenten:* [richtlijn 2014/32/EU](32014L0032) van het Europees Parlement en de Raad van
      26 februari 2014 betreffende de harmonisatie van de wetgevingen van de lidstaten inzake het op de markt aanbieden
      van meetinstrumenten;
        - *warmtemeter:* meter als bedoeld in bijlage VI van de richtlijn meetinstrumenten.


      [ref1]: https://wetten.overheid.nl/BWBR0029672#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0033729#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0050714#Artikel1
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0029672
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0033729
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0050714
        artikel: '1'
  - number: '2.1'
    text: |-
      Een energieleverancier of een leverancier van brandstof verstrekt ten minste eenmaal per jaar een factuur aan een
      eindafnemer of een doorleverancier voor de afgenomen energie of voor de afgenomen brandstof.
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel2
  - number: '2.2'
    text: |-
      Een doorleverancier verstrekt ten minste eenmaal per jaar een factuur aan een eindgebruiker voor de afgenomen
      warmte of koude.
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel2
  - number: '3.1'
    text: |-
      Een energieleverancier, een leverancier van brandstof of een doorleverancier stelt de factuur op in duidelijke en
      begrijpelijke taal.
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel3
  - number: '3.2'
    text: |-
      Op verzoek van een eindafnemer of een doorleverancier verstrekt een energieleverancier of een leverancier van
      brandstof nadere uitleg over de totstandkoming van de factuur.
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel3
  - number: '3.3'
    text: Op verzoek van een eindgebruiker verstrekt een doorleverancier nadere uitleg over de totstandkoming van de factuur.
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel3
  - number: '4.1'
    text: 'Een factuur van een energieleverancier of een doorleverancier bevat:'
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel4
  - number: 4.1.a
    text: de periode waarop de factuur betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel4
  - number: 4.1.b
    text: de totale hoeveelheid afgenomen energie in de betreffende periode;
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel4
  - number: 4.1.c
    text: de totale kosten voor de afgenomen energie in de betreffende periode;
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel4
  - number: 4.1.d
    text: de verbruiksafhankelijke kosten voor de afgenomen energie in de betreffende periode;
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel4
  - number: 4.1.e
    text: de verbruiksonafhankelijke kosten voor de afname van energie in de betreffende periode;
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel4
  - number: 4.1.f
    text: in voorkomend geval de netto hoeveelheid door een eindafnemer verbruikte energie in de betreffende periode;
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel4
  - number: 4.1.g
    text: in voorkomend geval de kosten voor de netto hoeveelheid afgenomen energie in de betreffende periode.
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel4
  - number: '4.2'
    text: |-
      Het eerste lid, onderdelen a, b, en c, is van overeenkomstige toepassing op een factuur van een leverancier van
      brandstof, voor zover de desbetreffende gegevens beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel4
  - number: '5.1'
    text: |-
      Een energieleverancier of een leverancier van brandstof die een factuur baseert op meetgegevens die door een
      eindafnemer of een doorleverancier worden uitgelezen, baseert een factuur alleen op het geschatte verbruik als een
      eindafnemer of een doorleverancier niet tijdig de meetgegevens mededeelt.
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel5
  - number: '5.2'
    text: |-
      Een doorleverancier die een factuur baseert op meetgegevens die door een eindgebruiker worden uitgelezen, baseert
      een factuur alleen op het geschatte verbruik als een eindgebruiker niet tijdig de meetgegevens mededeelt.
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel5
  - number: '6.1'
    text: |-
      Een energieleverancier verstrekt ten minste een keer per jaar een verbruiks- en indicatief kostenoverzicht aan een
      eindafnemer of een doorleverancier.
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel6
  - number: '6.2'
    text: |-
      Een doorleverancier verstrekt ten minste een keer per jaar een verbruiks- en indicatief kostenoverzicht aan een
      eindgebruiker.
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel6
  - number: '7.1'
    text: |-
      Een leverancier van warmte of van koude verstrekt ten minste iedere maand een verbruiks- en indicatief
      kostenoverzicht aan een eindafnemer van warmte of van koude die beschikt over een op afstand uitleesbare warmte- of
      koudemeter die op afstand wordt uitgelezen door middel van een signaal dat verder draagt dan 250 meter. Op verzoek
      van een eindafnemer kan de frequentie worden verlaagd.
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel7
  - number: '7.2'
    text: |-
      Een doorleverancier verstrekt ten minste iedere maand een verbruiks- en indicatief kostenoverzicht aan een
      eindgebruiker die beschikt over een op afstand uitleesbare warmte- of koudemeter die op afstand wordt uitgelezen
      door middel van een signaal dat verder draagt dan 250 meter. Op verzoek van een eindgebruiker kan de frequentie
      worden verlaagd.
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel7
  - number: '8'
    text: |-
      Een leverancier van brandstof verstrekt voor zover dit mogelijk is een verbruiks- en indicatief kostenoverzicht bij
      een factuur, bij een overeenkomst, bij een transactie of bij een ontvangstbewijs aan een eindafnemer.
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel8
  - number: '9.1'
    text: |-
      Een energieleverancier, een leverancier van brandstof of een doorleverancier stelt het verbruiks- en indicatief
      kostenoverzicht op in duidelijke en begrijpelijke taal.
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel9
  - number: '9.2'
    text: |-
      Een verbruiks- en indicatief kostenoverzicht heeft betrekking op de individuele situatie van een eindafnemer een
      doorleverancier of een eindgebruiker.
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel9
  - number: '9.3'
    text: |-
      Op verzoek van een eindafnemer of een doorleverancier verstrekt een energieleverancier of een leverancier van
      brandstof nadere uitleg over de totstandkoming van een verbruiks- en indicatief kostenoverzicht.
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel9
  - number: '9.4'
    text: |-
      Op verzoek van een eindgebruiker verstrekt een doorleverancier nadere uitleg over de totstandkoming van een
      verbruiks- en indicatief kostenoverzicht.
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel9
  - number: '9.5'
    text: Een verbruiks- en indicatief kostenoverzicht bevat geen betalingsverzoek.
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel9
  - number: '10.1'
    text: |-
      Indien één keer per jaar een verbruiks- en indicatief kostenoverzicht wordt verstrekt, bevat het verbruiks- en
      indicatief kostenoverzicht:
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel10
  - number: 10.1.a
    text: de periode waarop het verbruiks- en indicatief kostenoverzicht betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel10
  - number: 10.1.b
    text: |-
      de gegevens, bedoeld in [artikel 4, eerste lid, onder b tot en met g][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0036646#Artikel4
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0036646
        artikel: '4'
        paragraaf: '2'
  - number: 10.1.c
    text: het standaard jaarverbruik van de eindafnemer, de doorleverancier of de eindgebruiker;
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel10
  - number: 10.1.d
    text: |-
      indien dit mogelijk en nuttig is een vergelijking van het energieverbruik met het energieverbruik van een
      gemiddelde eindafnemer, doorleverancier of eindgebruiker uit een vergelijkbare verbruikerscategorie;
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel10
  - number: 10.1.e
    text: |-
      indien dit mogelijk is een vergelijking, bij voorkeur in grafische vorm, van de onder
      [artikel 4, eerste lid, onder b][ref1] bedoelde gegevens, met dezelfde gegevens uit dezelfde periode van het
      voorgaande jaar;


      [ref1]: https://wetten.overheid.nl/BWBR0036646#Artikel4
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0036646
        artikel: '4'
        paragraaf: '2'
  - number: 10.1.f
    text: |-
      de contactinformatie en de internetadressen van consumentenorganisaties of soortgelijke organisaties die informatie
      verstrekken over energiebesparende maatregelen, over vergelijkende verbruiksprofielen of over objectieve technische
      specificaties van energieverbruikende apparatuur.
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel10
  - number: '10.2'
    text: |-
      Indien meer dan één keer per jaar een verbruiks- en indicatief kostenoverzicht wordt verstrekt, bevat het
      verbruiks- en indicatief kostenoverzicht:
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel10
  - number: 10.2.a
    text: de periode waarop het verbruiks- en indicatief kostenoverzicht betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel10
  - number: 10.2.b
    text: de gegevens, bedoeld in het eerste lid, onder c tot en met f;
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel10
  - number: 10.2.c
    text: |-
      de gegevens, bedoeld in [artikel 4, eerste lid, onder b en f][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0036646#Artikel4
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0036646
        artikel: '4'
        paragraaf: '2'
  - number: 10.2.d
    text: |-
      de kosten, bedoeld in [artikel 4, eerste lid, onderdeel c, d, en g][ref1], gebaseerd op de actuele hoogtes van
      de verbruiksafhankelijke en verbruiksonafhankelijke kosten voor de afgenomen energie en de actuele kosten voor de
      netto hoeveelheid afgenomen energie van de eindafnemer, de doorleverancier of de eindgebruiker in de periode waarop
      het verbruiks- en indicatief kostenoverzicht betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0036646#Artikel4
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0036646
        artikel: '4'
        paragraaf: '2'
  - number: '10.3'
    text: |-
      Het eerste en het tweede lid zijn niet van toepassing op een verbruiks- en indicatief kostenoverzicht van een
      leverancier van brandstof, indien de desbetreffende gegevens niet beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel10
  - number: '10.4'
    text: 'Een verbruiks- en indicatief kostenoverzicht hoeft niet te bestaan uit:'
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel10
  - number: 10.4.a
    text: |-
      het standaard jaarverbruik van de eindafnemer, de doorleverancier of de eindgebruiker, indien het verbruiks- en
      indicatief kostenoverzicht gelijktijdig met een factuur wordt verzonden;
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel10
  - number: 10.4.b
    text: |-
      het standaard jaarverbruik van de eindafnemer, de doorleverancier of de eindgebruiker, de periode waarop het
      verbruiks- en indicatief kostenoverzicht betrekking heeft en de gegevens bedoeld in het eerste lid, onder b, of het
      tweede lid, onder a, c en d, indien dit overzicht gelijktijdig met de factuur wordt verzonden en betrekking heeft
      op dezelfde periode als de factuur.
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel10
  - number: '10.5'
    text: |-
      In aanvulling op het eerste en het tweede lid bevat het verbruiks- en indicatief kostenoverzicht van een
      eindafnemer van warmte of koude, een doorleverancier of een eindgebruiker:
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel10
  - number: 10.5.a
    text: |-
      informatie over de gebruikte brandstofmix en de bijbehorende jaarlijkse uitstoot van broeikasgassen en een
      beschrijving van de verschillende belastingen, heffingen en tarieven indien sprake is van warmte uit warmtenetten
      die geleverd wordt door vergunninghouders;
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel10
  - number: 10.5.b
    text: informatie over relevante klachtenprocedures, ombudsmandiensten of alternatieve geschillenbeslechtingsmechanismen;
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel10
  - number: 10.5.c
    text: in alle gevallen de gegevens bedoeld in het eerste lid, onderdelen d en e;
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel10
  - number: 10.5.d
    text: een klimaatcorrectie voor verwarming en koeling voor de gegevens, bedoeld in het eerste lid, onderdeel e;
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel10
  - number: 10.5.e
    text: |-
      informatie over het jaarlijkse aandeel door de leverancier geleverde energie uit hernieuwbare bronnen middels het
      warmtenet of koudenet en de jaarlijkse primaire fossiele energie-inzet per eenheid geleverde warmte of koude.
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel10
  - number: '10.6'
    text: |-
      In afwijking van het eerste en tweede lid bevat een verbruiks- en indicatief kostenoverzicht van een eindafnemer,
      een doorleverancier of een eindgebruiker waarvan de factuur niet gebaseerd is op het werkelijke verbruik een
      duidelijke en begrijpelijke uitleg over de wijze waarop het in de factuur genoemde bedrag is berekend en de
      informatie bedoeld in het eerste lid, onderdeel f, en in het vijfde lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel10
  - number: 11a.1
    text: |-
      De leverancier kan op het verbruiks- en indicatief kostenoverzicht aan de eindafnemer een advies verstrekken
      over de energiebesparende maatregelen die de desbetreffende eindafnemer kan nemen om zijn energieverbruik te
      verminderen.
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel11a
  - number: 11a.2
    text: |-
      Het advies, bedoeld in het eerste lid, is gebaseerd op de verbruiksgegevens van de desbetreffende
      eindafnemer, waar de leverancier toegang tot heeft ter voldoening van zijn verplichtingen als bedoeld in de
      [artikelen 2 tot en met 10][ref1] en indien nuttig openbare gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0036646#Artikel2
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0036646
        artikel: '2'
        paragraaf: '2'
  - number: '12.1'
    text: |-
      Een energieleverancier of een leverancier van brandstof verzendt een factuur en een verbruiks- en indicatief
      kostenoverzicht naar de desbetreffende eindafnemer of de doorleverancier langs elektronische weg, tenzij de
      eindafnemer of de doorleverancier verzoekt om verzending van een verbruiks- en indicatief kostenoverzicht per post
      of verzending langs elektronische weg niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel12
  - number: '12.2'
    text: |-
      Een doorleverancier verzendt een factuur en een verbruiks- en indicatief kostenoverzicht naar de desbetreffende
      eindgebruiker langs elektronische weg, tenzij de eindgebruiker verzoekt om verzending van een verbruiks- en
      indicatief kostenoverzicht per post of verzending langs elektronische weg niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel12
  - number: '12.3'
    text: |-
      In aanvulling van het eerste en tweede lid kan ingeval van elektronische facturering een energieleverancier of
      een doorleverancier ervoor kiezen de vergelijkingen bedoeld in [artikel 10, eerste lid, onderdeel d][ref1], online
      beschikbaar te stellen en daar in de factuur naar de verwijzen.


      [ref1]: https://wetten.overheid.nl/BWBR0036646#Artikel10
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0036646
        artikel: '10'
        paragraaf: '3'
  - number: '13.1'
    text: |-
      Op verzoek van de eindafnemer van brandstof, warmte of koude of de doorleverancier verstrekt een energieleverancier
      of leverancier van brandstof de beschikbare facturen en de verbruiks- en indicatieve kostenoverzichten aan een door
      een eindafnemer of een doorleverancier aangewezen aanbieder van energiediensten.
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel13
  - number: '13.2'
    text: |-
      Op verzoek van de eindgebruiker verstrekt een doorleverancier de beschikbare factureren en de verbruiks- en
      indicatieve kostenoverzichten aan een door een eindgebruiker aangewezen aanbieder van energiediensten.
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel13
  - number: '14.1'
    text: |-
      Een energieleverancier of een leverancier van brandstof verstrekt een factuur of een verbruiks- en indicatief
      kostenoverzicht kosteloos aan een eindafnemer of een doorleverancier.
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel14
  - number: '14.2'
    text: |-
      Een doorleverancier verstrekt een factuur of een verbruiks- en indicatief kostenoverzicht kosteloos aan een
      eindgebruiker.
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel14
  - number: '14.3'
    text: |-
      Een doorleverancier verstrekt een factuur of een verbruiks- en indicatief kostenoverzicht
      kosteloos aan een eindgebruiker. Aan eindgebruikers kunnen redelijke kosten voor de
      uitvoering van kostenverdeelsystematiek, als bedoeld in [artikelen 2, tiende lid][ref1], en
      [6a, elfde lid, van de Wet implementatie EU-richtlijnen energie-efficiëntie][ref2], zelf worden toegerekend indien
      dit door een ander dan de leverancier geschiedt.


      [ref1]: https://wetten.overheid.nl/BWBR0029672#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0029672#Artikel6a
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0029672
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0029672
        artikel: 6a
  - number: '15'
    text: |-
      Het [Besluit kostenoverzicht energie][ref1] vervalt.


      [ref1]: https://wetten.overheid.nl/BWBR0029673
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel15
    references:
