        paragraaf: '6'
  - number: '17.2'
    text: |-
      [Artikel 16][ref1] treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin dit
      besluit wordt geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0036646#Artikel16
