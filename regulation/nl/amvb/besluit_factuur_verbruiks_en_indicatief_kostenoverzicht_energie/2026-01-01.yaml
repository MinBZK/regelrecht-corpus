        bwb_id: BWBR0029673
  - number: '17.1'
    text: |-
      Dit besluit, met uitzondering van [artikel 16][ref1], treedt in werking met ingang van 1 juli 2015.


      [ref1]: https://wetten.overheid.nl/BWBR0036646#Artikel16
    url: https://wetten.overheid.nl/BWBR0036646/2026-01-01#Artikel17
    references:
