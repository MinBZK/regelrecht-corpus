  - number: '2'
    text: |-
      Voor zoover in dit besluit niet anders wordt bepaald, vinden ten aanzien van de in het voorgaande artikel bedoelde
      misdrijven de bepalingen van het [Wetboek van Militair Strafrecht][ref1] en die ter uitvoering daarvan, alsmede,
      behoudens de afwijkingen bij dat Wetboek vastgesteld, de bepalingen van het gemeene strafrecht toepassing, met dien
      verstande, dat, waar in het [Wetboek van Militair Strafrecht][ref2] gesproken wordt van den militairen rechter of
      de militaire rechtsmacht, daaronder de bij het [Besluit op de Bijzondere Gerechtshoven][ref3] aangewezen rechter
      onderscheidenlijk diens rechtsmacht wordt begrepen.


      [ref1]: https://wetten.overheid.nl/BWBR0001869
      [ref2]: https://wetten.overheid.nl/BWBR0001869
      [ref3]: https://wetten.overheid.nl/BWBR0002007
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001869
      - id: ref2
        bwb_id: BWBR0001869
      - id: ref3
        bwb_id: BWBR0002007
  - number: '3'
    text: |-
      Het bepaalde in [artikel 1 van het Wetboek van Strafrecht][ref1] blijft voor de werking van dit besluit buiten
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel1
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '1'
  - number: '4.1'
    text: |-
      Onverminderd het bepaalde in de artikelen 2-8 van het [Wetboek van Strafrecht][ref1] en in de
      [artikelen 4 en 5 van het Wetboek van Militair Strafrecht][ref2] is de Nederlandsche strafwet toepasselijk op een
      ieder, die zich buiten het Rijk in Europa schuldig heeft gemaakt of maakt aan:


      [ref1]: https://wetten.overheid.nl/BWBR0001854
      [ref2]: https://wetten.overheid.nl/BWBR0001869#Artikel4
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001854
      - id: ref2
        bwb_id: BWBR0001869
        artikel: '4'
  - number: 4.1.1°
    text: |-
      een misdrijf, omschreven in [artikel 278 van het Wetboek van Strafrecht][ref1] of een der [artikelen 26][ref2],
      [27][ref3] en [27][ref4] van dit besluit, of een misdrijf, als bedoeld in [artikel 1, onder 2°][ref5]., van dit
      besluit, indien het feit is gepleegd tegen of met betrekking tot een Nederlander of een Nederlandsch rechtspersoon
      of indien eenig Nederlandsch belang daardoor is of kon worden geschaad;


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel278
      [ref2]: https://wetten.overheid.nl/BWBR0002006#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0002006#Artikel27
      [ref4]: https://wetten.overheid.nl/BWBR0002006#Artikel27a
      [ref5]: https://wetten.overheid.nl/BWBR0002006#Artikel1
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '278'
      - id: ref2
        bwb_id: BWBR0002006
        artikel: '26'
      - id: ref3
        bwb_id: BWBR0002006
        artikel: '27'
      - id: ref4
        bwb_id: BWBR0002006
        artikel: 27a
      - id: ref5
        bwb_id: BWBR0002006
        artikel: '1'
  - number: 4.1.2°
    text: |-
      een misdrijf, omschreven in een der artikelen 131-134*bis,* 189 en 416-417*bis* van het
      [Wetboek van Strafrecht][ref1], met dien verstande, dat, waar in die artikelen van strafbaar feit of misdrijf wordt
      gesproken, daaronder ten deze alleen wordt verstaan een misdrijf, omschreven in een der artikelen 92-96, 97*a*,
      onder 1°., 105 en 108-110 van het [Wetboek van Strafrecht][ref2], of een misdrijf als hiervoor onder 1°. bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0001854
      [ref2]: https://wetten.overheid.nl/BWBR0001854
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001854
      - id: ref2
        bwb_id: BWBR0001854
  - number: '4.2'
    text: |-
      De Nederlandsche strafwet is insgelijks toepasselijk op den Nederlander, die zich buiten het Rijk in Europa
      schuldig heeft gemaakt of maakt aan eenig misdrijf, in [artikel 1][ref1] genoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0002006#Artikel1
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002006
        artikel: '1'
  - number: '6'
    text: |-
      Het bepaalde in [artikel 17 van het Wetboek van Militair Strafrecht][ref1] blijft voor de werking van dit besluit
      buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001869#Artikel17
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001869
        artikel: '17'
  - number: 7a
    text: |-
      In afwijking in zooverre van het bepaalde in [artikel 23, vijfde en zesde lid, van het Wetboek van Strafrecht][ref1]
      is de duur der vervangende hechtenis ten hoogste een jaar en in de gevallen, bedoeld in het zesde lid, ten hoogste
      een jaar en vier maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
  - number: 7b
    text: |-
      Voor de toepassing van [artikel 27 van het Wetboek van Strafrecht][ref1] wordt de bewaring, gelast of verlengd
      ingevolge het [Besluit politieke delinquenten 1945][ref2], gelijkgesteld met voorloopige hechtenis.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0002015
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '27'
      - id: ref2
        bwb_id: BWBR0002015
  - number: '8.1'
    text: |-
      In afwijking in zooverre van het bepaalde in de [artikelen 28][ref1] en [29 van het Wetboek van Strafrecht][ref2]
      en in [artikel 35 van het Wetboek van Militair Strafrecht][ref3] kan ontzetting van de rechten, vermeld in
      [artikel 28, eerste lid, onder 1°., 2°., 3°][ref4]. en 4°., van eerstgenoemd Wetboek, worden uitgesproken in
      alle gevallen van veroordeeling wegens eenig misdrijf, in [artikel 1][ref5] genoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0001869#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0002006#Artikel28
      [ref5]: https://wetten.overheid.nl/BWBR0002006#Artikel1
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '29'
      - id: ref3
        bwb_id: BWBR0001869
        artikel: '35'
      - id: ref4
        bwb_id: BWBR0002006
        artikel: '28'
      - id: ref5
        bwb_id: BWBR0002006
        artikel: '1'
  - number: '8.2'
    text: |-
      Onder het bekleeden van ambten of van bepaalde ambten, als bedoeld in
      [artikel 28, eerste lid, onder 1° van het Wetboek van Strafrecht][ref1], is voor de toepassing van dit besluit
      niet begrepen het verrichten van werkzaamheden krachtens indienstneming op arbeidsovereenkomst naar burgerlijk
      recht door of vanwege het Rijk of eenig openbaar lichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '28'
  - number: '8.3'
    text: |-
      Zoodanige indienstneming op arbeidsovereenkomst naar burgerlijk recht geschiedt alleen in ondergeschikte en niet
      verantwoordelijke functies.
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel8
  - number: '8.4'
    text: |-
      In alle gevallen, bedoeld in het eerste lid, kan de schuldige insgelijks worden ontzet van het recht om bepaalde
      beroepen of groepen van beroepen uit te oefenen of bepaalde functies of groepen van functies te bekleeden, waarvoor
      hij naar het oordeel van den rechter de in het algemeen belang vereischte waardigheid of betrouwbaarheid mist.
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel8
  - number: '9'
    text: |-
      In afwijking van het bepaalde in [artikel 31, eerste lid, van het Wetboek van Strafrecht][ref1] bepaalt de rechter,
      wanneer ontzetting van rechten wordt uitgesproken, den duur als volgt:


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel31
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '31'
  - number: 9.1°
    text: bij veroordeeling tot levenslange gevangenisstraf, voor het leven;
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel9
  - number: 9.2°
    text: |-
      bij veroordeeling tot tijdelijke gevangenisstraf, tot militaire detentie of tot hechtenis, voor een tijd den duur
      der hoofdstraf ten minste vijf jaren te boven gaande en ten hoogste voor het leven;
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel9
  - number: 9.3°
    text: bij veroordeeling tot geldboete, voor den tijd van ten minste drie jaren en ten hoogste voor het leven.
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel9
  - number: 9a.1
    text: |-
      Onverminderd het bepaalde in [artikel 33 van het Wetboek van Strafrecht][ref1] kunnen ook worden verbeurd verklaard
      bepaalde zaken, den veroordeelde toebehoorende, waarvan aannemelijk is dat zij met misbruik van de bijzondere
      omstandigheden zijn verkregen of behouden.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel33
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '33'
  - number: 9a.2
    text: |-
      Indien de zaken den veroordeelde niet of niet meer toebehooren, kan gelijke verbeurdverklaring worden uitgesproken,
      voor zoover dit met eerbiediging van de rechten van derden te goeder trouw mogelijk is.
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel9a
  - number: '10'
    text: |-
      In geval van eenig misdrijf, waarop de bepalingen van dit besluit van toepassing zijn, omdat de schuldige gebruik
      heeft gemaakt of heeft gedreigd te maken van macht, gelegenheid of middel, hem door den vijand of door het feit
      der vijandelijke bezetting geboden, kan de rechter bepalen, dat geen straf wordt toegepast, indien blijkt, dat de
      schuldige het feit heeft begaan om den vijand te benadeelen of door of vanwege den vijand of diens helpers beraamde
      maatregelen te beletten, belemmeren of verijdelen.
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel10
  - number: '11.1'
    text: 'De schuldige aan een misdrijf, waarop de bepalingen van dit besluit van toepassing zijn, kan worden veroordeeld:'
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel11
  - number: 11.1.1°
    text: |-
      indien op dat misdrijf bij het [Wetboek van Strafrecht][ref1] gevangenisstraf van vijftien jaren of meer is
      gesteld, tot levenslange gevangenisstraf of tijdelijke van ten hoogste twintig jaren;


      [ref1]: https://wetten.overheid.nl/BWBR0001854
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001854
  - number: 11.1.2°
    text: |-
      indien op dat misdrijf bij het [Wetboek van Strafrecht][ref1] gevangenisstraf van minder dan vijftien jaren doch
      meer dan zeven jaren en zes maanden is gesteld, gevangenisstraf van ten hoogste twintig jaren;


      [ref1]: https://wetten.overheid.nl/BWBR0001854
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001854
  - number: 11.1.3°
    text: |-
      indien op dat misdrijf bij het [Wetboek van Strafrecht][ref1] gevangenisstraf van niet meer dan zeven jaren en zes
      maanden doch meer dan twee jaren en zes maanden is gesteld, tot het dubbele der daarop gestelde straf;


      [ref1]: https://wetten.overheid.nl/BWBR0001854
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001854
  - number: 11.1.4°
    text: |-
      indien op dat misdrijf bij het [Wetboek van Strafrecht][ref1] gevangenisstraf van twee jaren en zes maanden of
      minder of hechtenis is gesteld, tot gevangenisstraf van ten hoogste vijf jaren;


      [ref1]: https://wetten.overheid.nl/BWBR0001854
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001854
  - number: '11.2'
    text: |-
      Naast of in plaats van andere straffen kan de rechter geldboete opleggen. Het maximum der op te leggen geldboete
      bedraagt van de vijfde categorie. Indien de rechter beslist, dat de schuldige zich met misbruik van de bijzondere
      omstandigheden heeft verrijkt, kan dit bedrag worden verhoogd tot het drievoud van het door den rechter geschatte
      bedrag der verrijking.
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel11
  - number: '12'
    text: |-
      In afwijking van het bepaalde in de [artikelen 45][ref1], tweede en derde lid, en
      [49, eerste en tweede lid, van het Wetboek van Strafrecht][ref2] kunnen bij poging tot of medeplichtigheid aan een
      misdrijf dezelfde hoofdstraffen tot dezelfde maxima worden opgelegd als op het misdrijf zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel49
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '45'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '49'
  - number: '13.1'
    text: |-
      De samenspanning tot eenig misdrijf, in [artikel 1][ref1] genoemd, wordt gestraft gelijk het misdrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0002006#Artikel1
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002006
        artikel: '1'
  - number: '13.2'
    text: |-
      Nochtans is de strafvervolging uitgesloten tegen den deelnemer aan eenige samenspanning, die, vóórdat de overheid
      met het bestaan daarvan bekend is, haar op zoodanige wijze daarvan kennis geeft, dat dientengevolge het plegen van
      het voorgenomen misdrijf wordt voorkomen. Deze bepaling geldt niet voor hem, van wien blijkt, dat hij de aanlegger
      is.
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel13
  - number: '14'
    text: |-
      In afwijking van het bepaalde in artikel 60, onder 1°., van het [Wetboek van Strafrecht][ref1] worden in de daar
      bedoelde gevallen de straffen van ontzetting van dezelfde rechten opgelost in ééne straf, in duur de opgelegde
      hoofdstraf of hoofdstraffen ten minste vijf jaren te boven gaande en ten hoogste voor het leven, of indien geene
      andere hoofdstraf dan geldboete is opgelegd, in ééne straf van ten minste drie jaren en ten hoogste voor het leven.


      [ref1]: https://wetten.overheid.nl/BWBR0001854
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001854
  - number: '15.1'
    text: |-
      Het bepaalde in [artikel 68, eerste lid, van het Wetboek van Strafrecht][ref1] blijft buiten toepassing, tenzij het
      gewijsde van een bij het [Besluit op de Bijzondere Gerechtshoven][ref2] aangewezen rechter of een Nederlandschen
      rechter buiten het Rijk in Europa afkomstig is.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0002007
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '68'
      - id: ref2
        bwb_id: BWBR0002007
  - number: '15.2'
    text: |-
      Het bepaalde in artikel 68, tweede lid, van dat Wetboek is niet toepasselijk dan voor zoover de vervolging strijdig
      zou zijn met den inhoud of de strekking van een overeenkomst, door Ons met een vreemde mogendheid gesloten.
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel15
  - number: '15.3'
    text: |-
      Nochtans kan in de gevallen, waarin het bepaalde in [artikel 68 van het Wetboek van Strafrecht][ref1] voor de
      werking van dit besluit buiten toepassing blijft, bij de rechterlijke uitspraak worden bepaald, dat de tijd der
      vrijheidsstraf of het bedrag der geldboete, door den veroordeelde vóór de tenuitvoerlegging van die uitspraak
      ondergaan of betaald ingevolge diens eerdere veroordeeling wegens hetzelfde feit, bij de uitvoering van de hem
      opgelegde tijdelijke vrijheidsstraf of geldboete geheel of gedeeltelijk in mindering zal worden gebracht; wat de
      geldboete betreft, volgens den zoo noodig in de uitspraak te bepalen maatstaf.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel68
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '68'
  - number: '15.4'
    text: |-
      Hij, aan wien bij uitspraak van een Tribunaal, waarop het fiat executie is verleend, een bijzondere
      maatregel, als bedoeld in [artikel 1 van het Tribunaalbesluit][ref1], is opgelegd, kan ter zake van
      een misdrijf, waarop de bepalingen van dit besluit van toepassing zijn, behoudens het bepaalde in
      [artikel 12 van het Wetboek van Strafvordering][ref2], niet worden vervolgd dan met machtiging van Onzen Minister
      van Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0002009#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel12
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002009
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '12'
  - number: 15a
    text: |-
      Het bepaalde in [artikel 6:1:21 van het Wetboek van Strafvordering][ref1] blijft buiten toepassing ten aanzien van
      de uitvoering van de straf van geldboete en verbeurdverklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel6
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '6'
  - number: '17'
    text: |-
      Waar in eenige wettelijke bepaling van misdrijf in het algemeen of van eenig misdrijf in het bijzonder
      wordt gesproken, wordt daaronder voor de toepassing van dit besluit samenspanning tot dat misdrijf mede
      begrepen, voor zoover dit met de strekking dier bepaling niet onvereenigbaar is; onverminderd het bepaalde in
      [artikel 78 van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel78
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '78'
  - number: '18'
    text: |-
      Waar in het [Wetboek van Strafrecht][ref1] gesproken wordt van "grondwettigen regeeringsvorm", worden daarmede
      gelijkgesteld de bestuursorganen, genoemd in de zevende afdeeling van het Tweede Hoofdstuk en in het Vierde,
      Vijfde, Zesde en Elfde Hoofdstuk der [Grondwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001854
      [ref2]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001854
      - id: ref2
        bwb_id: BWBR0001840
  - number: '19'
    text: |-
      Onder openbaar gezag wordt verstaan het Nederlandsch souverein gezag, waaronder deszelfs organen mede worden
      begrepen.
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel19
  - number: '20'
    text: |-
      Onder een Nederlandsch rechtspersoon wordt verstaan een rechtspersoon, welker plaats van vestiging in het
      Koninkrijk is gelegen, welke uitsluitend of mede door een of meer Nederlanders wordt bestuurd of tot welker
      vermogen een of meer Nederlanders geheel of gedeeltelijk gerechtigd zijn.
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel20
  - number: '21'
    text: |-
      Waar in de [artikelen 44][ref1], [254, eerste lid, onderdeel b, onder 1°][ref2] en
      [365 van het Wetboek van Strafrecht][ref3] van ambtenaar wordt gesproken, wordt daarmede gelijkgesteld ieder
      ambtenaar, beambte of ander persoon, werkzaam voor het burgerlijk of militair gezag van een vijandelijke
      mogendheid, hetzij in vasten of tijdelijken dienst, hetzij in eenig ander dan dienstverband; onverminderd het
      bepaalde in [artikel 84 van het Wetboek van Strafrecht][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel254
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel365
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel84
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '44'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '254'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '365'
      - id: ref4
        bwb_id: BWBR0001854
        artikel: '84'
  - number: '22'
    text: |-
      Onder den vijand hulp verleenen wordt mede begrepen het bevorderen of verspreiden van vijandelijke propaganda, het
      aan den vijand ter beschikking stellen van eenig geld of goed, het verrichten van eenige daad ten voordeele van den
      vijand en het beletten, belemmeren of verijdelen van eenigen tegen den vijand gerichten maatregel.
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel22
  - number: '23.1'
    text: |-
      Onder den tijd van huidigen oorlog wordt verstaan de tijd van den huidigen oorlog tegen het Koninkrijk en mede
      begrepen de tijd, waarin die oorlog dreigende was.
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel23
  - number: '23.2'
    text: |-
      Onder een misdrijf gedurende den tijd van den huidigen oorlog gepleegd, wordt mede begrepen het geval, dat de
      schuldige het misdrijf heeft gepleegd met het oog op den door hem aanstaand geachten huidigen oorlog tegen het
      Koninkrijk.
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel23
  - number: '24.1'
    text: |-
      Waar in de [artikelen 101][ref1] en [205 van het Wetboek van Strafrecht][ref2] van krijgsdienst wordt gesproken,
      wordt daarmede eenige Staats- of publieke dienst gelijkgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel101
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel205
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '101'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '205'
  - number: '24.2'
    text: |-
      Voor zoover betreft artikel 205 van dat Wetboek, wordt voor de toepassing van dit besluit dienst bij een bondgenoot
      van den Staat in den huidigen oorlog onder vreemden krijgs-, staats- of publieken dienst niet begrepen.
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel24
  - number: '25.1'
    text: |-
      Onder een bondgenoot van den Staat in den huidigen, gemeenschappelijken oorlog wordt verstaan elke niet-
      vijandelijke mogendheid, elk ander niet-vijandelijk, door Ons erkend bewind en elke niet aan het gezag van een
      vijandelijke mogendheid onderworpen, georganiseerde krijgsmacht, oorlog voerende of vijandelijkheden verrichtende
      tegen een vijandelijke mogendheid.
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel25
  - number: '25.2'
    text: |-
      In afwijking in zooverre van het bepaalde in [artikel 75 van het Wetboek van Militair Strafrecht][ref1] wordt de
      werking van dat artikel niet beperkt door de voorwaarde, dat bij wet of traktaat wederkeerigheid gewaarborgd zij.


      [ref1]: https://wetten.overheid.nl/BWBR0001869#Artikel75
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0001869
        artikel: '75'
  - number: '26.1'
    text: |-
      Hij, die gedurende den tijd van den huidigen oorlog opzettelijk een ander blootstelt aan opsporing, vervolging,
      vrijheidsberooving of -beperking, eenige straf of eenigen maatregel door of vanwege den vijand, diens helpers of
      een persoon, als in [artikel 21][ref1] bedoeld, wordt gestraft met gevangenisstraf van ten hoogste vijf jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0002006#Artikel21
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002006
        artikel: '21'
  - number: '26.2'
    text: |-
      De schuldige wordt gestraft met gevangenisstraf van ten hoogste tien jaren, indien het feit vrijheidsberooving van
      langer dan een maand ten gevolge heeft gehad.
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel26
  - number: '26.3'
    text: |-
      De schuldige wordt gestraft met gevangenisstraf van ten hoogste twintig jaren, indien het feit zwaar lichamelijk
      letsel ten gevolge heeft gehad.
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel26
  - number: '26.4'
    text: |-
      De schuldige wordt gestraft met levenslange gevangenisstraf of tijdelijke van ten hoogste twintig jaren, indien het
      feit den dood of de vermissing, waaruit redelijkerwijze de dood is af te leiden. ten gevolge heeft gehad.
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel26
  - number: '26.5'
    text: |-
      Niet strafbaar is hij, die een feit heeft gepleegd met het oogmerk om aan door Ons gegeven wettelijke voorschriften
      te beantwoorden of om het algemeen belang te dienen.
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel26
  - number: '27'
    text: |-
      Hij, die gedurende den tijd van den huidigen oorlog opzettelijk gebruik maakt of dreigt te maken van macht,
      gelegenheid of middel, hem door den vijand of door het feit der vijandelijke bezetting geboden, om een ander in
      zijn vermogen wederrechtelijk te benadeelen of om zich of een ander wederrechtelijk te bevoordeelen, wordt gestraft
      met gevangenisstraf van ten hoogste vijftien jaren.
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel27
  - number: 27a.1
    text: |-
      Hij die gedurende den tijd van den huidigen oorlog in krijgs-, staats- of publieken dienst bij of van den vijand
      zich schuldig maakt aan eenig oorlogsmisdrijf of eenig misdrijf tegen de menschelijkheid als bedoeld in artikel
      6 onder *(b)* of *(c)* van het handvest, behoorende bij de overeenkomst van Londen van 8 Augustus 1945, bekend
      gemaakt bij Ons besluit van 4 Januari 1946 (*Staatsblad* no. G 5), wordt, indien zoodanig misdrijf tevens bevat
      de bestanddeelen van een strafbaar feit waarop dit Besluit of het [Wetboek van Militair Strafrecht][ref1] van
      toepassing is, gestraft met de daarop gestelde straf.


      [ref1]: https://wetten.overheid.nl/BWBR0001869
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0001869
  - number: 27a.2
    text: |-
      Indien zoodanig misdrijf niet tevens bevat de bestanddeelen van een strafbaar feit volgens de Nederlandsche wet,
      wordt de dader gestraft met de straf, gesteld op het feit volgens de Nederlandsche wet, waarmede het de meeste
      overeenkomst vertoont.
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel27a
  - number: 27a.3
    text: |-
      Met gelijke straf als bedoeld in het eerste en tweede lid wordt gestraft de meerdere die opzettelijk toelaat, dat
      een zijner minderen zich aan een zoodanig misdrijf schuldig maakt.
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel27a
  - number: '28'
    text: |-
      De bij de [artikelen 26][ref1], [27][ref2] en [27][ref3] strafbaar gestelde feiten worden beschouwd als misdrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0002006#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0002006#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0002006#Artikel27a
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002006
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0002006
        artikel: '27'
      - id: ref3
        bwb_id: BWBR0002006
        artikel: 27a
  - number: '29.1'
    text: |-
      Dit besluit, ten aanzien waarvan de bevoegdheid, bedoeld in artikel 9, tweede lid, van het Besluit op den
      bijzonderen staat van beleg, niet kan worden uitgeoefend, treedt in werking op den dag zijner afkondiging.
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel29
  - number: '29.2'
    text: 'Het kan worden aangehaald onder den titel: Besluit Buitengewoon Strafrecht.'
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel29
