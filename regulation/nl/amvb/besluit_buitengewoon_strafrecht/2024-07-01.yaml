preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Op de voordracht van Onze Ministers voor Algemeene Oorlogvoering van het Koninkrijk, van Algemeene Zaken,
    van Buitenlandsche Zaken, van Justitie, van Binnenlandsche Zaken, van Onderwijs, Kunsten en Wetenschappen,
    van Financiën, van Oorlog, van Marine, van Waterstaat, van Handel, Nijverheid en Scheepvaart, van Landbouw en
    Visscherij, van Sociale Zaken, van Koloniën en van Onze Ministers zonder Portefeuille van 10 December 1943, N°.
    2722/G.92(a);

    Overwegende, dat de veiligheid van den Staat het dringend noodzakelijk maakt buitengewone bepalingen van strafrecht
    vast te stellen voor de berechting van zekere gedurende den tijd van den huidigen oorlog begane feiten, welke in
    zoo ernstige mate strafwaardig zijn, dat hun strafbaarheid daarmede in overeenstemming dient te worden gebracht,
    zonder dat een beroep op het bepaalde in artikel 1 van het Wetboek van Strafrecht bij die berechting dient te
    worden toegelaten;

    Den Buitengewonen Raad van Advies gehoord;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De bepalingen van dit besluit zijn van toepassing op de misdrijven, gedurende den tijd van den huidigen oorlog vóór
      15 Mei 1945 begaan, welke zijn omschreven in:
    url: https://wetten.overheid.nl/BWBR0002006/2024-07-01#Artikel1
