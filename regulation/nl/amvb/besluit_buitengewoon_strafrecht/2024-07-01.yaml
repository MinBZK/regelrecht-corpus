  - number: 1.3°
    text: |-
      een der [artikelen 131 tot en met 134][ref1], [189][ref2] en 416-417*bis* van het [Wetboek van Strafrecht][ref3]
      of een der [artikelen 143][ref4] en [146 van het Wetboek van Militair Strafrecht][ref5], met dien verstande, dat,
      waar in die artikelen van strafbaar feit of misdrijf wordt gesproken, daaronder ten deze alleen wordt verstaan een
      misdrijf, als hiervoor onder 1°. of 2°. bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel131
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel189
      [ref3]: https://wetten.overheid.nl/BWBR0001854
