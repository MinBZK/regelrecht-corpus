preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken van 25 mei 1983, nr. AB83/U577, Directoraat-Generaal voor
    Overheidspersoneelsbeleid, Directie Overheidspersoneelszaken, Hoofdafdeling Financiële Arbeidsvoorwaarden;

    Gelet op artikel 125, eerste lid van de Ambtenarenwet 1929 (Stb. 530);

    De Raad van State gehoord (advies van 3 augustus 1983, nr. W04.83.0323(11.3.30);

    Gezien het nader rapport van Onze Minister van Binnenlandse Zaken van 21 oktober 1983, nr. AB83/1452,
    Directoraat-Generaal voor Overheidspersoneelsbeleid, Directie Overheidspersoneelszaken, Hoofdafdeling Financiële
    Arbeidsvoorwaarden;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Ambtenaar in de zin van dit besluit is hij, die in burgerlijke rijksdienst is aangesteld om tegen bezoldiging
      arbeid te verrichten.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel1
  - number: '1.2'
    text: Dit besluit is niet van toepassing op de ambtenaar, wiens bezoldiging is geregeld
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel1
  - number: 1.2.a
    text: bij de wet;
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel1
  - number: 1.2.b
    text: bij een algemene maatregel van bestuur tot regeling van de bezoldiging van
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel1
  - number: 1.2.b.1°
    text: de ambtenaren van de buitenlandse dienst;
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel1
  - number: 1.2.b.2°
    text: de politie;
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel1
  - number: 1.2.b.3°
    text: |-
      het personeel van de universiteiten en hogescholen, de academische ziekenhuizen, de interuniversitaire instituten
      en de organen voor postacademisch onderwijs;
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel1
  - number: 1.2.b.4°
    text: het personeel bij het voortgezet onderwijs;
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel1
  - number: 1.2.b.5°
    text: het personeel bij het basisonderwijs en bij het speciaal en voortgezet speciaal onderwijs;
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel1
  - number: 1.2.b.6°
    text: leden van het korps van deskundigen voor de technische hulp aan ontwikkelingslanden;
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel1
  - number: 1.2.b.7°
    text: leden van raden, besturen en commissies;
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel1
  - number: 1.2.c
    text: |-
      krachtens [artikel 15 van het Algemeen Rijksambtenarenreglement][ref1] of een daarmee overeenkomende bepaling van
      gelijke strekking.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel15
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '15'
  - number: '1.3'
    text: |-
      Wij behouden Ons voor op de gemeenschappelijke voordracht van Onze Minister, hoofd van het desbetreffende
      departement van algemeen bestuur en Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, andere dan in het
      vorige lid bedoelde ambtenaren of groepen van ambtenaren uit te zonderen van de toepassing van dit besluit.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel1
  - number: '2'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel2
  - number: 2.a
    text: |-
      salaris: het bedrag, dat met inachtneming van de bepalingen van dit besluit voor de ambtenaar is vastgesteld aan de
      hand van een van de bijlagen van dit besluit vermenigvuldigd met de voor de ambtenaar geldende arbeidsduurfactor;
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel2
  - number: 2.b
    text: '*salaris per uur:* 1/156 deel van het salaris bij een volledige werktijd;'
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel2
  - number: 2.c
    text: |-
      *salarisschaal:* een als zodanig in de [bijlage B][ref1] van dit besluit vermelde reeks van genummerde salarissen;


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: 2.d
    text: 'salarisnummer: een aanduiding, bestaande uit een getal, dat in een salarisschaal voor een salaris is vermeld;'
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel2
  - number: 2.e
    text: 'maximumsalaris: het hoogste bedrag van een salarisschaal;'
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel2
  - number: 2.f
    text: |-
      bezoldiging: 'de som van: het salaris; de toelagen, genoemd in [hoofdstuk III][ref1]; de periodieke toeslag, genoemd'
      in [artikel 22a][ref2]; de maandelijkse toeslag, genoemd in [artikel 22b][ref3]; waarop de ambtenaar aanspraak
      heeft;


      [ref1]: https://wetten.overheid.nl/BWBR0003630#HoofdstukIII
      [ref2]: https://wetten.overheid.nl/BWBR0003630#Artikel22a
      [ref3]: https://wetten.overheid.nl/BWBR0003630#Artikel22b
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003630
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003630
        artikel: 22a
        hoofdstuk: IVA
      - id: ref3
        bwb_id: BWBR0003630
        artikel: 22b
        hoofdstuk: IVA
  - number: 2.g
    text: 'volledige arbeidsduur: een arbeidsduur welke gemiddeld zesendertig werkuren per week omvat;'
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel2
  - number: 2.h
    text: |-
      arbeidsduurfactor: de breuk, waarvan de teller bestaat uit de voor de ambtenaar vastgestelde arbeidsduur en de
      noemer bestaat uit het getal 36;
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel2
  - number: 2.i
    text: |-
      *functie:* het samenstel van werkzaamheden door de ambtenaar te verrichten krachtens en overeenkomstig hetgeen hem
      door het daartoe bevoegde gezag is opgedragen;
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel2
  - number: 2.j
    text: |-
      toeslag: een toeslag als bedoeld in [artikel 22a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel22a
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: 22a
        hoofdstuk: IVA
  - number: 2.k
    text: |-
      periodieke toeslag: een toeslag als bedoeld in [artikel 22a][ref1] die maandelijks wordt betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel22a
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: 22a
        hoofdstuk: IVA
  - number: '3.1'
    text: Het salaris, de toelagen, de periodieke toeslag en de vergoedingen voor extra diensten worden maandelijks betaald.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel3
  - number: '3.2'
    text: |-
      Wanneer het salaris, een toelage als bedoeld in de [artikelen 14][ref1], [16][ref2], [17b][ref3],
      [18][ref4], [18a][ref5], een bedrag als bedoeld in [artikel 21, tweede lid][ref6], een toeslag als bedoeld in
      [artikel 22e][ref7] of een periodieke toeslag, moet worden berekend over een gedeelte van de kalendermaand,
      wordt het bedrag per dag vastgesteld door het maandbedrag te delen door het aantal dagen van de desbetreffende
      kalendermaand.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0003630#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0003630#Artikel17b
      [ref4]: https://wetten.overheid.nl/BWBR0003630#Artikel18
      [ref5]: https://wetten.overheid.nl/BWBR0003630#Artikel18a
      [ref6]: https://wetten.overheid.nl/BWBR0003630#Artikel21
      [ref7]: https://wetten.overheid.nl/BWBR0003630#Artikel22e
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: '14'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0003630
        artikel: '16'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0003630
        artikel: 17b
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0003630
        artikel: '18'
        hoofdstuk: III
      - id: ref5
        bwb_id: BWBR0003630
        artikel: 18a
        hoofdstuk: III
      - id: ref6
        bwb_id: BWBR0003630
        artikel: '21'
        hoofdstuk: IV
      - id: ref7
        bwb_id: BWBR0003630
        artikel: 22e
        hoofdstuk: IVA
  - number: '3.3'
    text: |-
      Van het bepaalde in de vorige leden kan worden afgeweken, ingeval daartoe naar het oordeel van het tot het
      vaststellen van het salaris bevoegde gezag op grond van bijzondere omstandigheden aanleiding bestaat.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel3
  - number: '4.1'
    text: |-
      Voor de ambtenaar, wiens ambt is vermeld in de [bijlage A][ref1] van dit besluit, geldt het salaris, dat in die
      bijlage bij zijn ambt is aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: '4.2'
    text: |-
      Indien de ambtenaar bedoeld in het vorige lid anders dan bij wijze van disciplinaire straf als bedoeld in het
      [Algemeen Rijksambtenarenreglement][ref1] of in een soortgelijke regeling en zonder voorafgaand ontslag wordt
      belast met een ander ambt, als gevolg waarvan zijn salaris op grond van de overige bepalingen van dit besluit een
      verlaging zou moeten ondergaan, blijft deze verlaging achterwege.


      [ref1]: https://wetten.overheid.nl/BWBR0001950
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001950
  - number: '5.1'
    text: |-
      Voor de ambtenaar, wiens ambt niet is vermeld in de [bijlage A][ref1] van dit besluit, geldt een salarisschaal.


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: '5.2'
    text: |-
      De salarisschaal welke voor de ambtenaar geldt wordt, tenzij zijn wijze van functioneren zich nog daartegen
      verzet, bepaald met inachtneming van de zwaarte van zijn functie en van bijzondere regelingen, als bedoeld in
      [artikel 13 van het Algemeen Rijksambtenarenreglement][ref1] of in bepalingen van dezelfde strekking in een
      soortgelijke regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel13
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '13'
  - number: '5.3'
    text: |-
      De zwaarte van de functie wordt bepaald binnen de in de [bijlage B][ref1] van dit besluit aangegeven
      indelingsstructuur, met inachtneming van het door of in overeenstemming met Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties vastgestelde normeringsstelsel.


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: '5.4'
    text: |-
      Indien de ambtenaar bij wijze van waarneming tijdelijk een andere functie uitoefent, blijft de voordien voor hem
      geldende salarisschaal van toepassing.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel5
  - number: '5.5'
    text: |-
      Voor de ambtenaar kan uitsluitend in de navolgende gevallen een salarisschaal gaan gelden met een lager
      maximumsalaris dan dat van de voor hem geldende salarisschaal:
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel5
  - number: 5.5.a
    text: |-
      bij wijze van disciplinaire straf, bedoeld in het [Algemeen Rijksambtenarenreglement][ref1] of in een soortgelijke
      regeling;


      [ref1]: https://wetten.overheid.nl/BWBR0001950
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001950
  - number: 5.5.b
    text: |-
      indien bij het bepalen van de salarisschaal, bedoeld in het tweede lid, tevens is bepaald dat zijn functie een
      tijdelijk karakter heeft en de salarisschaal in verband daarmee slechts tijdelijk zal gelden;
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel5
  - number: 5.5.c
    text: |-
      indien hij in verband met ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte wordt herplaatst in een
      andere functie waarvoor een salarisschaal geldt met een lager maximumsalaris;
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel5
  - number: 5.5.d
    text: |-
      indien hem op zijn aanvraag een andere functie wordt opgedragen waarvoor een salarisschaal
      geldt met een lager maximumsalaris, tenzij er sprake is van de omstandigheid, bedoeld in
      [artikel 57b van het Algemeen Rijksambtenarenreglement][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel57b
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 57b
  - number: '5.6'
    text: |-
      Indien de ambtenaar met toepassing van [hoofdstuk VIIbis van het Algemeen Rijksambtenarenreglement][ref1] is
      geplaatst in een andere functie waarvoor een salarisschaal geldt met een lager maximumsalaris dan de voor hem
      geldende salarisschaal in zijn oorspronkelijke functie, geldt voor de ambtenaar de salarisschaal die met toepassing
      van het tweede lid voor die andere functie is bepaald. Van de vorige volzin kan door het bevoegd gezag worden
      afgeweken voor zover toepassing gelet zal leiden tot een onbillijkheid van overwegende aard voor de betrokken
      ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#HoofdstukVIIbis
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001950
        hoofdstuk: VIIbis
  - number: 5a.1
    text: |-
      De ambtenaar die zich niet kan verenigen met de uitkomst van de bepaling van de zwaarte van zijn functie als
      bedoeld in [artikel 5, derde lid][ref1], kan het voor de toepassing van [artikel 5, tweede lid][ref2], bevoegde
      gezag verzoeken die waarderingsuitkomst opnieuw in overweging te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003630#Artikel5
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: '5'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003630
        artikel: '5'
        hoofdstuk: II
  - number: 5a.2
    text: |-
      Indien de toepassing van het bepaalde in [artikel 5, tweede lid][ref1], berust bij Ons, worden Wij vertegenwoordigd
      door Onze Minister wie het aangaat.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel5
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: '5'
        hoofdstuk: II
  - number: 5a.3
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt regels betreffende de behandeling van verzoeken
      als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel5a
  - number: 5a.4
    text: |-
      Het in het eerste lid bepaalde is niet van toepassing indien voor de ambtenaar een bijzondere regeling geldt als
      bedoeld in [artikel 13 van het Algemeen Rijksambtenarenreglement][ref1] of in bepalingen van dezelfde strekking in
      een soortgelijke regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel13
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '13'
  - number: '6.1'
    text: |-
      Bij aanstelling wordt aan de in [artikel 5][ref1] bedoelde ambtenaar het salaris toegekend, dat in de voor hem
      geldende salarisschaal is vermeld achter het salarisnummer 0.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel5
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: '5'
        hoofdstuk: II
  - number: '6.2'
    text: |-
      Van het bepaalde in het vorige lid kan worden afgeweken door het toekennen van een hoger salaris, ingeval daartoe
      naar het oordeel van het bevoegde gezag aanleiding bestaat.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel6
  - number: '7.1'
    text: |-
      Het salaris van de ambtenaar die nog niet het maximumsalaris van de voor hem geldende salarisschaal heeft bereikt,
      wordt jaarlijks verhoogd tot het in de schaal naasthogere bedrag, indien hij naar het oordeel van het bevoegd gezag
      in voldoende mate functioneert.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel7
  - number: '7.2'
    text: |-
      Het salaris van de ambtenaar die nog niet het maximumsalaris van de voor hem geldende salarisschaal heeft bereikt,
      kan worden verhoogd tot een in de schaal vermeld hoger bedrag, indien hij naar het oordeel van het bevoegd gezag
      meer dan in voldoende mate functioneert dan wel indien daartoe naar het oordeel van het bevoegd gezag op andere
      gronden aanleiding bestaat.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel7
  - number: '7.3'
    text: |-
      Indien de ambtenaar naar het oordeel van het bevoegd gezag niet in voldoende mate functioneert, blijft
      salarisverhoging achterwege.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel7
  - number: '7.4'
    text: |-
      De in het eerste en tweede lid bedoelde salarisverhoging wordt toegekend wanneer de ambtenaar het maximumsalaris
      van de voor hem geldende salarisschaal nog niet heeft bereikt, voor de eerste maal met ingang van de eerste dag van
      de maand, waarin sinds zijn aanstelling een jaar is verstreken en nadien telkens na één jaar.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel7
  - number: '7.5'
    text: |-
      Het tijdstip waarop ingevolge het vierde lid een salarisverhoging wordt toegekend kan worden vervroegd indien
      daartoe naar het oordeel van het bevoegde gezag aanleiding bestaat.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel7
  - number: '7.6'
    text: |-
      Indien het functioneren van de ambtenaar niet kan worden beoordeeld omdat hij langdurig zijn functie niet
      uitoefent, kan zijn salaris worden verhoogd tot het in de schaal naasthogere bedrag, indien daartoe naar het
      oordeel van het bevoegd gezag aanleiding bestaat.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel7
  - number: '7.7'
    text: |-
      Het oordeel van het bevoegd gezag over het functioneren van de ambtenaar komt tot stand op basis van een gesprek
      als bedoeld in [artikel 71 van het Algemeen Rijksambtenarenreglement][ref1], voorzover het betreft de in het
      eerste lid van dat artikel onder a en b genoemde onderwerpen, dan wel op basis van een vastgestelde beoordeling als
      bedoeld in [artikel 71a van het Algemeen Rijksambtenarenreglement][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel71a
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '71'
      - id: ref2
        bwb_id: BWBR0001950
        artikel: 71a
  - number: '8.1'
    text: |-
      Het salaris van de ambtenaar, bedoeld in [artikel 5, eerste lid][ref1], die het maximumsalaris van de voor hem
      geldende salarisschaal heeft bereikt, kan worden verhoogd, indien hij naar het oordeel van het bevoegd gezag
      uitstekend functioneert.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel5
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: '5'
        hoofdstuk: II
  - number: '8.2'
    text: 'Bij een salarisverhoging als bedoeld in het eerste lid wordt het salaris:'
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel8
  - number: 8.2.a
    text: |-
      voor de ambtenaar voor wie één der salarisschalen 1 tot en met 17 van de [bijlage B][ref1] geldt, vastgesteld op
      een bedrag vermeld in de naasthogere salarisschaal, met dien verstande dat het maximum van die schaal niet wordt
      overschreden;


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: 8.2.b
    text: |-
      voor de ambtenaar, voor wie salarisschaal 18 van de [bijlage B][ref1] geldt, vastgesteld op één van de volgende
      bedragen: € 8726,88; € 8912,07; € 9098,26.


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: '8.3'
    text: |-
      Indien het functioneren van de ambtenaar niet langer als uitstekend kan worden gekwalificeerd, kan het bevoegd
      gezag de toekenning van de salarisverhoging, bedoeld in het eerste lid, geheel of gedeeltelijk intrekken.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel8
  - number: '8.4'
    text: |-
      Het oordeel van het bevoegd gezag over het functioneren van de ambtenaar komt tot stand op basis van een gesprek
      als bedoeld in [artikel 71 van het Algemeen Rijksambtenarenreglement][ref1], voorzover het betreft de in het eerste
      lid van [dat artikel onder a en b][ref2] genoemde onderwerpen, dan wel op basis van een vastgestelde beoordeling
      als bedoeld in [artikel 71a van het Algemeen Rijksambtenarenreglement][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel71
      [ref3]: https://wetten.overheid.nl/BWBR0001950#Artikel71a
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '71'
      - id: ref2
        bwb_id: BWBR0001950
        artikel: '71'
      - id: ref3
        bwb_id: BWBR0001950
        artikel: 71a
  - number: '11.1'
    text: |-
      Het salaris van de ambtenaar met een onvolledige werktijd wordt vastgesteld op een evenredig deel van het salaris
      bij een volledige werktijd.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel11
  - number: '11.2'
    text: |-
      Het salaris van de ambtenaar van wie de omvang van de arbeidsduur niet vast ligt, wordt, met inachtneming van
      [artikel 5, tweede lid][ref1], vastgesteld op een bedrag, berekend op basis van het aantal uren dat daadwerkelijk
      dienst is verricht. Indien het aantal uren dat daadwerkelijk dienst is verricht minder is dan het voor de ambtenaar
      op grond van [artikel 6b van het Algemeen Rijksambtenarenreglement][ref2] vastgestelde aantal garantie-uren,
      geschiedt de berekening van het salaris op basis van dit laatstbedoelde aantal uren.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel6b
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: '5'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0001950
        artikel: 6b
  - number: '11.3'
    text: |-
      Een teruggebrachte werktijd als bedoeld in [artikel 21][ref1] of een daarmee overeenkomende bepaling in een ander
      rechtspositiereglement is geen onvolledige werktijd in de zin van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel21a
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: 21a
  - number: 11a.1
    text: |-
      Voor de ambtenaar die op oproep werkzaam is, dient bij de in [artikel 11][ref1] geregelde vaststelling van het
      salaris tevens rekening te worden gehouden met [het tweede lid van dit artikel][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0003630#Artikel11a
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: '11'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003630
        artikel: 11a
        hoofdstuk: II
  - number: 11a.2
    text: |-
      Indien de ambtenaar wordt opgeroepen om arbeid te verrichten voor een periode korter dan drie uur heeft hij recht
      op het salaris waarop hij aanspraak zou hebben indien hij drie uur arbeid zou hebben verricht indien:
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel11a
  - number: 11a.2.a
    text: |-
      de arbeidsduur minder bedraagt dan gemiddeld 15 uur per week en tijdstippen waarop de arbeid moet worden verricht
      niet zijn vastgelegd; of
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel11a
  - number: 11a.2.b
    text: de arbeidsduur niet vastligt.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel11a
  - number: 11b.1
    text: |-
      De hoogte van de aanspraak op het salaris kan met toepassing van de [artikelen 2:20][ref1] en
      [3:63 van de Wet werk en arbeidsondersteuning jonggehandicapten][ref2] door het Uitvoeringsinstituut
      werknemersverzekeringen op verzoek van het bevoegd gezag of de ambtenaar naar evenredigheid worden verminderd.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Artikel3
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0008657
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0008657
        artikel: '3'
  - number: 11b.2
    text: |-
      [Artikel 16][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel16
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel11b
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: '16'
        hoofdstuk: III
  - number: '12'
    text: |-
      In bijzondere gevallen kan een regeling worden getroffen, waarbij van de overige bepalingen van dit hoofdstuk kan
      worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel12
  - number: '14.1'
    text: |-
      Aan de ambtenaar, die bij wijze van waarneming tijdelijk een functie uitoefent, welke bij toepassing van
      [artikel 5, tweede lid en derde lid][ref1], zou leiden tot een salarisschaal met een hoger maximumsalaris, kan voor
      de duur van die waarneming een toelage worden toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel5
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: '5'
        hoofdstuk: II
  - number: '14.2'
    text: |-
      De toelage wordt, tenzij bijzondere omstandigheden aanwezig zijn, slechts toegekend wanneer de waarneming tenminste
      een tijdvak van dertig dagen heeft geduurd.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel14
  - number: '14.3'
    text: |-
      Bij volledige waarneming van de functie bedoeld in het eerste lid is het bedrag van de toelage gelijk aan het
      verschil tussen het salaris dat de ambtenaar geniet en het salaris dat hij zou genieten, wanneer de salarisschaal
      met het hogere maximumsalaris met ingang van de dag waarop de waarneming is begonnen voor hem zou hebben gegolden.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel14
  - number: '14.4'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt voor de toepassing van dit artikel nadere regels
      vast.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel14
  - number: '16.1'
    text: |-
      Indien het salaris minder is dan het maandbedrag van het minimumloon, dat krachtens de [artikelen 7][ref1], 8 en
      [14 van de Wet minimumloon en minimumvakantiebijslag][ref2] geldt voor werknemers van dezelfde leeftijd als de
      ambtenaar, wordt aan hem een toelage toegekend ten bedrage van het verschil.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel14
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '14'
  - number: '16.2'
    text: |-
      Voor de ambtenaar met een onvolledige werktijd, wordt het voor werknemers van dezelfde leeftijd geldende
      minimumloon geacht te zijn vastgesteld op een evenredig deel van het minimumloon bij een volledige werktijd.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel16
  - number: '17.1'
    text: |-
      Aan de ambtenaar, die anders dan bij wijze van overwerk, regelmatig of vrij regelmatig arbeid verricht op andere
      tijden dan op de dagen maandag tot en met vrijdag tussen 8 en 18 uur, wordt een toelage toegekend.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel17
  - number: '17.2'
    text: De toelage bedraagt per gewerkt uur een percentage van het voor de ambtenaar geldende salaris per uur en wel
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel17
  - number: 17.2.a
    text: 20% voor de uren op maandag tot en met vrijdag tussen 6 en 8 uur en tussen 18 en 22 uur;
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel17
  - number: 17.2.b
    text: 40% voor de uren op maandag tot en met vrijdag tussen 0 en 6 uur en tussen 22 en 24 uur;
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel17
  - number: 17.2.c
    text: 70% voor de uren op zaterdag;
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel17
  - number: 17.2.d
    text: 70% voor de uren op zondag;
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel17
  - number: 17.2.e
    text: |-
      100% voor de uren op de feestdagen genoemd in
      [artikel 21, zevende lid, onder a, van het Algemeen Rijksambtenarenreglement][ref1], Eerste Paasdag en Eerste
      Pinksterdag,


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel21
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '21'
  - number: '17.3'
    text: |-
      Voor de in het vorige lid onder a genoemde morgen- en avonduren wordt de toelage slechts toegekend, indien de
      arbeid is aangevangen vóór 7 uur, respectievelijk is beëindigd na 20 uur.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel17
  - number: '17.4'
    text: |-
      In afwijking van het bepaalde in het eerste en het tweede lid ontvangt de ambtenaar met ingang van de maand waarin
      hij de leeftijd van 55 jaar bereikt een vaste toelage, mits hij op dat moment gedurende ten minste 5 jaar zonder
      wezenlijke onderbreking een toelage als bedoeld in het eerste lid heeft genoten.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel17
  - number: '17.5'
    text: |-
      De toelage, bedoeld in het vierde lid, wordt vastgesteld op het bedrag dat de ambtenaar over de zesendertig
      kalendermaanden voorafgaande aan de maand waarin hij de leeftijd van 55 jaar bereikt gemiddeld per maand aan
      toelage als bedoeld in het eerste lid heeft genoten. Dit bedrag wordt aangepast aan de algemene salariswijzigingen.
      De toelage wordt naar rato aangepast bij een vermindering van de arbeidsduurfactor.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel17
  - number: '17.6'
    text: |-
      Voor de toepassing van het vierde lid wordt onder wezenlijke onderbreking verstaan een onderbreking van langer dan
      twee maanden.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel17
  - number: '17.7'
    text: |-
      In afwijking van het eerste en tweede lid kan het bevoegd gezag een vaste toelage vaststellen voor een ambtenaar
      die geen aanspraak heeft op een vaste toelage als bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel17
  - number: '17.8'
    text: |-
      De toelage, bedoeld in het zevende lid, wordt vastgesteld aan de hand van het bepaalde in het tweede en derde
      lid, de voor de ambtenaar geldende werktijdregeling en de mate waarin en de wijze waarop van die werktijdregeling
      pleegt te worden afgeweken. De toelage wordt aangepast indien zich wijzigingen voordoen in de berekeningsgrondslag
      daarvan.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel17
  - number: '17.9'
    text: |-
      In bijzondere gevallen kan een regeling worden getroffen, welke het bepaalde in de vorige leden aanvult of daarvan
      afwijkt.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel17
  - number: 17a.1
    text: |-
      Aan de ambtenaar die krachtens een werktijdregeling als bedoeld in
      [artikel 21 van het Algemeen Rijksambtenarenreglement][ref1] of in bepalingen van dezelfde strekking in een
      soortgelijke regeling, anders dan bij wijze van overwerk regelmatig of vrij regelmatig arbeid verricht op andere
      tijden dan op de dagen van maandag tot en met vrijdag tussen 8.00 en 18.00 uur wordt voor het in opdracht van
      het bevoegde gezag verrichten van arbeid op uren die afwijken van het krachtens de werktijdregeling vastgestelde
      rooster een toelage toegekend, voor zover met die uren het totaal van de per werkperiode vastgestelde aantal
      arbeidsuren niet wordt overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel21
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '21'
  - number: 17a.2
    text: |-
      Op de in het eerste lid bedoelde toelage bestaat geen aanspraak indien tussen het geven van de opdracht en het
      verrichten van de arbeid meer dan 72 uur zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel17a
  - number: 17a.3
    text: |-
      De toelage bedraagt voor elk vol uur waarop in afwijking van de werktijdregeling arbeid is verricht 45% van het
      voor de ambtenaar geldende salaris per uur, met dien verstande dat dit percentage wordt berekend over ten hoogste
      het salaris per uur, dat is afgeleid van het salaris behorende bij salarisnummer 10 van salarisschaal 7.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel17a
  - number: 17a.4
    text: |-
      Indien het bevoegd gezag op grond van [artikel 17, zevende lid][ref1], een vaste toelage heeft vastgesteld voor de
      ambtenaar, kan het bevoegd gezag in afwijking van het eerste lid, voor de ambtenaar een vaste maandelijkse toelage
      vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel17
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: '17'
        hoofdstuk: III
  - number: 17a.5
    text: |-
      De toelage, bedoeld in het vierde lid, wordt vastgesteld aan de hand van het bepaalde in het derde lid, de voor de
      ambtenaar geldende werktijdregeling en de mate waarin en de wijze waarop van die werktijdregeling pleegt te worden
      afgeweken. De toelage wordt aangepast indien zich wijzigingen voordoen in de berekeningsgrondslag daarvan.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel17a
  - number: 17b.1
    text: |-
      Aan de ambtenaar die nu en dan, regelmatig of voortdurend onder bezwarende omstandigheden arbeid verricht en wiens
      functie op een functielijst voorkomt, wordt een toelage per maand toegekend.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel17b
  - number: 17b.2
    text: 'Onder bezwarende omstandigheden worden begrepen:'
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel17b
  - number: 17b.2.a
    text: |-
      het werken in een situatie die een zodanige verontreiniging van de huid veroorzaakt dat deze ook na het gebruik van
      speciale wasmiddelen duidelijk waarneembaar blijft;
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel17b
  - number: 17b.2.b
    text: |-
      het werken in een omgeving met sterk onaangename geuren, of werken met onaangenaam aandoende en sterk afkeer
      oproepende materialen;
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel17b
  - number: 17b.2.c
    text: |-
      het werken in een situatie die een zeer hoge mate van huid- en slijmvliesprikkeling teweegbrengt, zodanig dat dit
      effect ook na het werk nog enige tijd voelbaar blijft;
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel17b
  - number: 17b.2.d
    text: het langdurig werken onder zeer onaangename hoge of lage temperatuur of temperatuurswisselingen;
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel17b
  - number: 17b.2.e
    text: |-
      het werken in situaties waarin het gebruik van gehoorbeschermingsmiddelen niet mogelijk of afdoende is, en waarin
      door het aanhoudende lawaai onderling contact nauwelijks mogelijk is of de geluidsterkte gelijk is aan of groter is
      dan 80 dbA;
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel17b
  - number: 17b.2.f
    text: het werken met sterk trillende apparatuur;
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel17b
  - number: 17b.2.g
    text: |-
      het werken met beschermingskleding of -middelen die een ernstige belemmering vormen voor de normale ademhaling,
      voor huidoppervlakte-uitwaseming en voor de bewegingsmogelijkheden;
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel17b
  - number: 17b.2.h
    text: het werken onder omstandigheden welke een verhoogd gevaar voor invaliditeit of overlijden meebrengen.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel17b
  - number: 17b.3
    text: |-
      Het bevoegd gezag geeft voor elke op de functielijst voorkomende functie aan of er nu en dan, regelmatig of
      voortdurend onder één dan wel gelijktijdig onder meer typen bezwarende omstandigheden arbeid wordt verricht. Een
      functielijst wordt jaarlijks door het bevoegd gezag vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel17b
  - number: 17b.4
    text: 'De toelage bedraagt een percentage van het salaris behorende bij salarisnummer 10 van salarisschaal 7 en wel:'
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel17b
  - number: 17b.4.a
    text: |-
      1% indien de ambtenaar nu en dan onder één of gelijktijdig onder twee typen bezwarende omstandigheden dan wel
      regelmatig onder één type bezwarende omstandigheden arbeid verricht;
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel17b
  - number: 17b.4.b
    text: |-
      2% indien de ambtenaar nu en dan gelijktijdig onder drie of meer typen bezwarende omstandigheden dan wel regelmatig
      gelijktijdig onder twee typen bezwarende omstandigheden of voortdurend onder één type bezwarende omstandigheden
      arbeid verricht;
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel17b
  - number: 17b.4.c
    text: |-
      3% indien de ambtenaar regelmatig gelijktijdig onder drie of meer typen bezwarende omstandigheden of voortdurend
      gelijktijdig onder twee of meer typen bezwarende omstandigheden arbeid verricht.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel17b
  - number: 17b.5
    text: De toelage wordt vermenigvuldigd met de voor de ambtenaar geldende arbeidsduurfactor.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel17b
  - number: 17b.6
    text: |-
      In bijzondere gevallen kan een regeling worden getroffen, welke het bepaalde in de vorige leden aanvult of daarvan
      afwijkt.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel17b
  - number: 17b.7
    text: |-
      Het bevoegd gezag kan een vergoeding toekennen indien de ambtenaar incidenteel onder bezwarende omstandigheden
      arbeid verricht.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel17b
  - number: '18.1'
    text: |-
      Aan de ambtenaar wiens bezoldiging, als gevolg van het beëindigen of verminderen van een toelage als bedoeld in
      [artikel 17][ref1], een blijvende verlaging ondergaat, welke tenminste 3% bedraagt van de som van het salaris en
      een periodieke toeslag, wordt een aflopende toelage toegekend, mits hij eerstgenoemde toelage, direct voorafgaande
      aan het tijdstip van vorenbedoelde beëindiging of vermindering ervan, gedurende ten minste 2 jaren zonder
      wezenlijke onderbreking heeft genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel17
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: '17'
        hoofdstuk: III
  - number: '18.2'
    text: |-
      Voor de toepassing van het eerste lid wordt onder wezenlijke onderbreking verstaan een onderbreking van langer dan
      twaalf maanden.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel18
  - number: '18.3'
    text: |-
      Het eerste lid is niet van toepassing indien de verlaging van de bezoldiging het gevolg is van een disciplinaire
      maatregel genoemd in [artikel 81 van het Algemeen Rijksambtenarenreglement][ref1] of een bepaling van dezelfde
      strekking in een soortgelijke regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel81
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '81'
  - number: '18.4'
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt voor de toepassing van dit artikel nadere regels
      vast.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel18
  - number: 18a.1
    text: |-
      Aan de ambtenaar die buiten de werktijden die voor hem gelden krachtens een werktijdregeling als bedoeld in
      [artikel 21 van het Algemeen Rijksambtenarenreglement][ref1] of in bepalingen van dezelfde strekking in een
      soortgelijke regeling, ingevolge een schriftelijke aanwijzing van het bevoegd gezag zich regelmatig of vrij
      regelmatig bereikbaar en beschikbaar moet houden teneinde bij oproep arbeid te gaan verrichten, wordt een toelage
      toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel21
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '21'
  - number: 18a.2
    text: |-
      De toelage bedraagt per uur bereikbaarheid en beschikbaarheid een percentage van het voor de ambtenaar geldende
      salaris per uur en wel
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel18a
  - number: 18a.2.a
    text: 5% voor de uren op maandag tot en met vrijdag;
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel18a
  - number: 18a.2.b
    text: |-
      10% voor de uren op zaterdag en zondag en op de feestdagen genoemd in
      [artikel 21, zevende lid, onderdeel a, van het Algemeen Rijksambtenarenreglement][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel21
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '21'
  - number: 18a.3
    text: |-
      De op basis van het tweede lid berekende toelage wordt verhoogd met 100% over de uren waarop aan de opgedragen
      bereikbaarheid en beschikbaarheid een extra plaatsgebondenheid op of rond de plaats van tewerkstelling is
      verbonden.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel18a
  - number: 18a.4
    text: In afwijking van het tweede en derde lid kan het bevoegd gezag een vaste toelage toekennen.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel18a
  - number: 18a.5
    text: |-
      De toelage, bedoeld in het vierde lid, wordt vastgesteld aan de hand van het bepaalde in het tweede en derde
      lid en de mate waarin de ambtenaar zich ingevolge een schriftelijke aanwijzing van het bevoegd gezag bereikbaar
      en beschikbaar pleegt te moeten houden. De toelage wordt aangepast indien zich wijzigingen voordoen in de
      berekeningsgrondslag daarvan.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel18a
  - number: 18a.6
    text: |-
      In bijzondere gevallen kan een regeling worden getroffen welke het bepaalde in dit artikel aanvult of daarvan
      afwijkt.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel18a
  - number: 18b.1
    text: |-
      Aan de ambtenaar wiens bezoldiging in een periode van twee jaar door het één of meer keer beëindigen of verminderen
      van één of meer toelagen of toeslagen, als genoemd in [artikel 2, onder f][ref1], als gevolg van een reorganisatie
      een blijvende verlaging ondergaat, welke ten minste 3% bedraagt van de som van het salaris en een periodieke
      toeslag, wordt een aflopende toelage toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel2
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: '2'
        hoofdstuk: I
  - number: 18b.2
    text: |-
      De berekeningsbasis voor de aflopende toelage is het bedrag dat de ambtenaar over de 36 kalendermaanden,
      voorafgaande aan de datum waarop de eerste verlaging van zijn bezoldiging intreedt, gemiddeld per maand aan
      toelagen of toeslagen, als genoemd in [artikel 2, onder f][ref1], heeft genoten, verminderd met hetgeen de
      ambtenaar daadwerkelijk aan toelagen of toeslagen, als genoemd in artikel 2, onder f, na de bedoelde verlagingen
      geniet. De in de vorige zin genoemde periode van 36 kalendermaanden wordt verkort voor zover de betrokken ambtenaar
      korter in dienst is geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel2
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: '2'
        hoofdstuk: I
  - number: 18b.3
    text: |-
      De aflopende toelage, bedoeld in het eerste lid, bedraagt gedurende het eerste jaar 100%, het tweede jaar 75%, het
      derde jaar 50% en het vierde jaar 25% van de berekeningsbasis.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel18b
  - number: 18b.4
    text: |-
      De aflopende toelage, bedoeld in het eerste lid, wordt slechts toegekend indien de beëindigde of verminderde
      toelagen of toeslagen, genoemd in [artikel 2, onder f][ref1], direct voorafgaande aan het tijdstip van
      vorenbedoelde beëindiging of vermindering ervan, gedurende tenminste twee jaren zonder onderbreking van langer dan
      twaalf maanden zijn genoten.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel2
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: '2'
        hoofdstuk: I
  - number: 18b.5
    text: |-
      Indien aanspraak bestaat op de aflopende toelage, bedoeld in dit artikel, bestaat geen aanspraak op de aflopende
      toelage, bedoeld in [artikel 18][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel18
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: '18'
        hoofdstuk: III
  - number: 18b.6
    text: Onze Minister kan voor de toepassing van dit artikel nadere regels stellen.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel18b
  - number: 20a.1
    text: De ambtenaar heeft recht op een eindejaarsuitkering ter grootte van 8,3% van het door hem genoten salaris.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel20a
  - number: 20a.2
    text: |-
      De eindejaarsuitkering wordt jaarlijks uitbetaald in de maand november en wordt berekend over de periode van twaalf
      maanden die is aangevangen met de maand december van het voorafgaande kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel20a
  - number: 20a.3
    text: |-
      Voor de duur dat de bezoldiging op grond van
      [artikel 18, tweede lid, van het Algemeen Rijksambtenarenreglement][ref1] of op grond van een bepaling van dezelfde
      strekking in een soortgelijke regeling is teruggebracht tot het bedrag van het op de ambtenaar te verhalen gedeelte
      van de pensioenbijdrage, wordt de ambtenaar voor de toepassing van het eerste lid geacht geen salaris te genieten.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel18
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '18'
  - number: 20a.4
    text: |-
      Bij ontslag van de ambtenaar vindt betaling plaats over het tijdvak gelegen tussen het einde van de laatst
      verstreken periode waarover de eindejaarsuitkering is betaald en de datum van het ontslag.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel20a
  - number: 20a.5
    text: |-
      Voor de berekening van de eindejaarsuitkering wordt uitgegaan van het salaris zonder dat dit is verminderd
      met het bedrag dat als belastingvrije vergoeding is uitgekeerd voor een bestemmingsmogelijkheid als bedoeld in
      [artikel 6, tweede lid, van de IKAP-regeling rijkspersoneel][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015799#Artikel6
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0015799
        artikel: '6'
  - number: '21.1'
    text: De ambtenaar heeft recht op een vakantie-uitkering ten bedrage van 8% van de door hem genoten bezoldiging.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel21
  - number: '21.2'
    text: |-
      De vakantie-uitkering per maand bedraagt ten minste € 164,75 vermenigvuldigd met de voor de ambtenaar geldende
      arbeidsduurfactor. Bij genot van slechts een gedeelte van zijn bezoldiging, op andere gronden dan vermeld in het
      derde lid, wordt de vakantie-uitkering naar evenredigheid verminderd.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel21
  - number: '21.3'
    text: |-
      Wanneer de ambtenaar op grond van de [artikelen 17 tot en met 20d][ref1] of van
      [artikel 37 van het Algemeen Rijksambtenarenreglement][ref2] of op grond van bepalingen van dezelfde strekking in
      een soortgelijke regeling slechts een gedeelte van zijn bezoldiging geniet, wordt hij voor de toepassing van het
      eerste lid geacht in het genot van zijn volle bezoldiging te zijn, met dien verstande dat wanneer het feitelijke
      genot van de bezoldiging is teruggebracht tot het bedrag van het op de ambtenaar te verhalen gedeelte van de
      pensioenbijdrage, hij voor de toepassing van het eerste lid wordt geacht geen bezoldiging te genieten.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel37
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0001950
        artikel: '37'
  - number: '21.4'
    text: |-
      Voor de berekening van de vakantie-uitkering wordt uitgegaan van de bezoldiging zonder dat deze is verminderd
      met het bedrag dat als belastingvrije vergoeding is uitgekeerd voor een bestemmingsmogelijkheid als bedoeld in
      [artikel 6, tweede lid, van de IKAP-regeling rijkspersoneel][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015799#Artikel6
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0015799
        artikel: '6'
  - number: '22.1'
    text: |-
      De vakantie-uitkering wordt eenmaal per jaar betaald over de periode van twaalf maanden, die is aangevangen met de
      maand juni van het voorafgaande kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel22
  - number: '22.2'
    text: |-
      Bij ontslag van de ambtenaar vindt betaling plaats over het tijdvak, gelegen tussen het einde van de laatst
      verstreken periode, waarover de vakantie-uitkering is betaald en de datum van het ontslag.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel22
  - number: 22a.1
    text: Aan een ambtenaar of een groep van ambtenaren kan een eenmalige of periodieke toeslag worden toegekend.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel22a
  - number: 22a.2
    text: Aan de toekenning van een toeslag kunnen voorwaarden worden verbonden.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel22a
  - number: 22a.3
    text: Een periodieke toeslag wordt ingetrokken indien de gronden waarop de toeslag is toegekend niet meer aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel22a
  - number: 22a.4
    text: Een regeling kan worden getroffen, welke dit artikel aanvult.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel22a
  - number: 22b
    text: |-
      De ambtenaar die is benoemd in een functie van secretaris-generaal, genoemd in
      [artikel 7, vierde lid, van het Algemeen Rijksambtenarenreglement][ref1], heeft voor de duur van die benoeming
      aanspraak op een maandelijkse toeslag ter grootte van 5% van zijn salaris.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel7
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel22b
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '7'
  - number: 22c.1
    text: |-
      De ambtenaar aan wie, anders dan krachtens een loopbaanregeling als bedoeld
      in [artikel 13 van het Algemeen Rijksambtenarenreglement][ref1] of in
      bepalingen van dezelfde strekking in een soortgelijke regeling, op grond van
      [artikel 57, eerste lid of tweede lid, onder b, van het Algemeen Rijksambtenarenreglement][ref2] een andere functie
      wordt opgedragen, waarbij het belang van de dienst is gelegen in het opdragen van juist die andere functie, heeft
      recht op een eenmalige mobiliteitstoeslag ter grootte van 50% van zijn salaris, tenzij zijn salaris met ingang van
      de datum waarop die andere functie wordt opgedragen om die reden wordt verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel57
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel22c
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0001950
        artikel: '57'
  - number: 22c.2
    text: |-
      Het eerste lid is niet van toepassing op de ambtenaar die met toepassing van
      [hoofdstuk VIIbis van het Algemeen Rijksambtenarenreglement][ref1] is geplaatst in een andere functie.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#HoofdstukVIIbis
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel22c
    references:
      - id: ref1
        bwb_id: BWBR0001950
        hoofdstuk: VIIbis
  - number: 22e.1
    text: |-
      De ambtenaar aan wie een toelage is toegekend op grond van artikel 17 of op grond van [artikel 7 van het Besluit
      personenchauffeurs Rijksdienst](onbekend) ontvangt een nominale toeslag van € 37,50 per maand. Bedraagt de voor de
      ambtenaar geldende arbeidsduurfactor minder dan 1, dan wordt het bedrag van de toeslag vermenigvuldigd met de voor
      de ambtenaar geldende arbeidsduurfactor.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel22e
  - number: 22e.2
    text: |-
      Geen recht op de in het eerste lid genoemde toeslag bestaat vanaf het tijdstip dat de ambtenaar langer dan vier
      weken geen dienst verricht als bedoeld in artikel 17.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel22e
  - number: '23.1'
    text: |-
      Aan de ambtenaar, voor wie een salarisschaal geldt met een lager maximumsalaris dan dat van schaal 11 en die in
      opdracht van het bevoegde gezag overwerk verricht, wordt, behoudens het bepaalde in het derde lid, een vergoeding
      toegekend.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel23
  - number: '23.2'
    text: |-
      Onder overwerk wordt verstaan arbeid buiten de werktijden geldende voor de ambtenaar krachtens een werktijdregeling
      als bedoeld in [artikel 21 van het Algemeen Rijksambtenarenreglement][ref1] of in bepalingen van dezelfde strekking
      in een soortgelijke regeling, voor zover daardoor het per werkperiode vastgestelde aantal arbeidsuren wordt
      overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel21
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '21'
  - number: '23.3'
    text: |-
      Voor overwerk dat gedurende korter dan een uur aansluitend aan de vastgestelde dagelijkse werktijd wordt verricht,
      wordt geen vergoeding toegekend.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel23
  - number: '23.4'
    text: 'De werkperiode bedoeld in het tweede lid wordt gesteld op:'
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel23
  - number: 23.4.a
    text: één dag, indien aanvang en einde van de werktijd in de regel niet aan wisselingen onderhevig zijn;
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel23
  - number: 23.4.b
    text: |-
      een tijdvak van tenminste zeven dagen, indien de tijdstippen van aanvang en einde van de werktijd volgens een
      tevoren vastgesteld rooster wisselen.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel23
  - number: '23.5'
    text: 'De vergoeding voor overwerk bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel23
  - number: 23.5.a
    text: verlof, gelijk aan het aantal uren overschrijding van het per werkperiode vastgestelde aantal arbeidsuren, en
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel23
  - number: 23.5.b
    text: |-
      Een bedrag in geld, dat voor elk uur van die overschrijding een percentage van het voor de ambtenaar geldende
      salaris per uur bedraagt.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel23
  - number: '23.6'
    text: |-
      De vergoeding in verlof wordt zo spoedig mogelijk toegekend, doch in de regel niet later dan in de kalendermaand
      volgende op die, waarin de overschrijding plaats had, waarbij zoveel mogelijk rekening wordt gehouden met de wensen
      van de ambtenaar.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel23
  - number: '23.7'
    text: |-
      Indien naar het oordeel van het bevoegde gezag het dienstbelang zich verzet tegen het toekennen van verlof, wordt
      in plaats van verlof voor ieder uur een bedrag in geld toegekend gelijk aan het voor de ambtenaar geldende salaris
      per uur.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel23
  - number: '23.8'
    text: 'Het in het vijfde lid, onder b, bedoelde percentage bedraagt:'
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel23
  - number: 23.8.a
    text: |-
      behoudens het gestelde [onder b][ref1], het getal, vermeld in de onderstaande tabel







                        overwerk verricht


                        op zaterdag en zondag


                        op maandag t/m vrijdag






                        tussen 0 en 6 uur


                        100


                        50




                        tussen 6 en 22 uur


                        50


                        25




                        tussen 22 en 24 uur


                        100


                        50


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel23
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: '23'
        hoofdstuk: V
  - number: 23.8.b
    text: |-
      De feestdagen, genoemd in [artikel 21, zevende lid, onder ][ref1], worden voor de vergoeding van overwerk
      gelijkgesteld met een zondag.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel21
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '21'
  - number: '23.9'
    text: |-
      Voor het vaststellen van de duur van de overschrijding gelden de uren waarop krachtens het vijfde lid onder *a*, of
      krachtens het [Algemeen Rijksambtenarenreglement][ref1] dan wel een overeenkomstige regeling vakantie of verlof is
      genoten, als uren waarop is gewerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0001950
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0001950
  - number: '23.10'
    text: |-
      Aan ambtenaren voor wie verschillende salarisschalen gelden, die ingevolge een opdracht als bedoeld in het eerste
      lid gelijke werkzaamheden verrichten kan, in afwijking van het in voorgaande leden bepaalde, naar billijkheid
      een voor alle betrokken ambtenaren gelijke vergoeding worden toegekend. Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties kan voor de toepassing hiervan nadere regels vaststellen.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel23
  - number: '23.11'
    text: |-
      In bijzondere gevallen kan een regeling worden getroffen, welke het bepaalde in de vorige leden aanvult of daarvan
      afwijkt.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel23
  - number: '24'
    text: |-
      Het bepalen van de salarisschaal en het toekennen van het salaris, van een toelage als bedoeld in de
      [artikelen 14 tot en met 18b][ref1], van de eindejaarsuitkering, van de vakantie-uitkering, van een toeslag en van
      de vergoeding voor extra diensten vindt plaats:


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel14
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: '14'
        hoofdstuk: III
  - number: 24.a
    text: wat betreft de ambtenaren, aangesteld bij de Raad van State, door de vicepresident van de Raad van State;
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel24
  - number: 24.b
    text: |-
      wat betreft de ambtenaren, aangesteld bij de Algemene Rekenkamer, de Hoge Raad van Adel, het Kabinet van de Koning,
      de Kanselarij der Nederlandse Orden of de Nationale ombudsman door het tot aanstelling bevoegde gezag;
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel24
  - number: 24.c
    text: wat betreft de overige ambtenaren door Onze minister wie het aangaat.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel24
  - number: '25.1'
    text: |-
      Het vaststellen van een regeling als bedoeld in de [artikelen 12][ref1], [17, negende lid][ref2],
      [17 b, zesde lid][ref3], [18a, zesde lid][ref4], [22a, vierde lid][ref5], en [23, elfde lid][ref6], geschiedt


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0003630#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0003630#Artikel17b
      [ref4]: https://wetten.overheid.nl/BWBR0003630#Artikel18a
      [ref5]: https://wetten.overheid.nl/BWBR0003630#Artikel22a
      [ref6]: https://wetten.overheid.nl/BWBR0003630#Artikel23
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: '12'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003630
        artikel: '17'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0003630
        artikel: 17b
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0003630
        artikel: 18a
        hoofdstuk: III
      - id: ref5
        bwb_id: BWBR0003630
        artikel: 22a
        hoofdstuk: IVA
      - id: ref6
        bwb_id: BWBR0003630
        artikel: '23'
        hoofdstuk: V
  - number: 25.1.a
    text: |-
      voor wat betreft ambtenaren bij de Eerste en de Tweede Kamer der Staten-Generaal, bij de Raad van State, bij
      de Algemene Rekenkamer, bij de Hoge Raad van Adel en bij het Bureau van de Nationale Ombudsman door Ons op de
      voordracht van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties , gehoord het bij het desbetreffende
      College ter zake bevoegde gezag;
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel25
  - number: 25.1.b
    text: |-
      voor wat betreft de overige ambtenaren bij gemeenschappelijk besluit van Onze Minister, hoofd van het
      desbetreffende departement van algemeen bestuur en van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel25
  - number: '25.2'
    text: Het intrekken van een periodieke toeslag geschiedt door het gezag dat bevoegd is deze toeslag toe te kennen.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel25
  - number: '25.3'
    text: |-
      Van de bevoegdheid tot het vaststellen van een regeling, met een sterk technisch karakter, als bedoeld in het
      eerste lid, kunnen Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties en Onze Minister, hoofd van het
      desbetreffende departement van algemeen bestuur, mandaat verlenen.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel25
  - number: 25a.1
    text: |-
      In dit hoofdstuk wordt verstaan onder: - *Rijksschoonmaakorganisatie:* organisatie waarin de
      schoonmaakwerkzaamheden bij het Rijk in eigen beheer worden uitgevoerd;
        - *overkomst:* aanstelling als ambtenaar bij de Rijksschoonmaakorganisatie van een werknemer van een
      schoonmaakbedrijf als gevolg van de verplaatsing van zijn werkzaamheden van het schoonmaakbedrijf naar de
      Rijksschoonmaakorganisatie;
        - *CAO:* Collectieve Arbeidsovereenkomst Schoonmaak- en Glazenwassersbedrijf 2014–2016.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel25a
  - number: 25a.2
    text: |-
      Voor de ambtenaar, die is aangesteld bij de Rijksschoonmaakorganisatie en wiens functie is genoemd in
      [bijlage C][ref1] van dit besluit geldt het in die bijlage bij de genoemde functie, leeftijd en dienstjaren van de
      ambtenaar behorende salaris.


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: 25a.3
    text: |-
      Voor de hoogte van het salaris tellen voor de ambtenaar na zijn overkomst mee de als werknemer doorgebrachte tijd
      in dienst van een schoonmaakbedrijf vóór die overkomst conform artikel 38, derde lid, van de CAO.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel25a
  - number: 25a.4
    text: |-
      Als diensttijd voor een gratificatie bij een ambtsjubileum of een diensttijdgratificatie als bedoeld in
      [artikel 79 van het Algemeen Rijksambtenarenreglement][ref1] telt voor de ambtenaar na zijn overkomst, mee de als
      werknemer doorgebrachte tijd in dienst van een schoonmaakbedrijf vóór die overkomst conform artikel 38, derde lid,
      van de CAO.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel79
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0001950
        artikel: '79'
  - number: 25a.5
    text: |-
      De ambtenaar die niet naar de Rijksschoonmaakorganisatie is overgekomen vanuit een schoonmaakbedrijf, de
      ambtenaar die niet aantoonbaar de basis(vak)- en taalopleidingen met succes heeft afgerond of de ambtenaar die
      wordt aangesteld binnen zes maanden nadat hij de schoonmaakbranche heeft verlaten en die niet kan aantonen dat
      de inleerperiode op het moment van het verlaten van die branche niet op hem van toepassing was, wordt gedurende
      de eerste twaalf maanden van de aanstelling als ambtenaar bij de Rijksschoonmaakorganisatie bezoldigd conform de
      salarissen per functie en leeftijd, zoals genoemd onder inleerperiode in [bijlage C][ref1] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0003630
  - number: 25a.6
    text: |-
      [Artikel 5, eerste tot en met derde lid][ref1], is niet van toepassing op de ambtenaar wiens functie is vermeld in
      de [bijlage C][ref2] van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: '5'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003630
  - number: 25a.7
    text: |-
      De ambtenaar die voor de overkomst op grond van artikel 38, derde lid, van de CAO vóór 31 december 2007 aanspraak
      had op een van de CAO afwijkende reiskostenvergoeding, heeft na de overkomst overeenkomstig deze afspraken recht op
      deze reiskostenvergoeding. De tegemoetkoming in de kosten van het dagelijks reizen per openbaar vervoer tussen de
      woning en de plaats van tewerkstelling wordt op deze reiskostenvergoeding in mindering gebracht. Het recht op deze
      reiskostenvergoeding vervalt op het moment dat de ambtenaar gebruik maakt van de Rijksmobiliteitkaart.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel25a
  - number: 25a.8
    text: |-
      De ambtenaar die voor de overkomst recht had op een vereenvoudigingstoeslag op basis van artikel 38, derde lid,
      van de CAO, heeft na de overkomst recht op een vereenvoudigingstoeslag overeenkomstig hetgeen daarover in de CAO
      is bepaald. Deze vereenvoudigingstoeslag is een periodieke toeslag als bedoeld in [artikel 22a][ref1] van het BBRA
      1984.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel22a
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: 22a
        hoofdstuk: IVA
  - number: 25b
    text: |-
      In afwijking van [artikel 20a, eerste en tweede lid][ref1], heeft de ambtenaar die is aangesteld bij de
      Rijksschoonmaakorganisatie en wiens functie is genoemd in [bijlage C][ref2], recht op een eindejaarsuitkering van
      2,2% van het door hem genoten bruto salaris over twaalf maanden die wordt betaald in november. Voorts wordt 6,5%
      van het genoten bruto salaris maandelijks uitgekeerd boven op het salaris.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel20a
      [ref2]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel25b
    references:
      - id: ref1
        bwb_id: BWBR0003630
        artikel: 20a
        hoofdstuk: IIIA
      - id: ref2
        bwb_id: BWBR0003630
  - number: 25c
    text: |-
      De algemene salarismaatregelen die op de [bijlagen A][ref1] en [B][ref2] worden toegepast worden niet toegepast op
      de [bijlage C][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003630
      [ref2]: https://wetten.overheid.nl/BWBR0003630
      [ref3]: https://wetten.overheid.nl/BWBR0003630
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel25c
    references:
      - id: ref1
        bwb_id: BWBR0003630
      - id: ref2
        bwb_id: BWBR0003630
      - id: ref3
        bwb_id: BWBR0003630
  - number: '26.1'
    text: |-
      Voor gevallen waarin dit besluit niet of niet naar billijkheid voorziet, wordt bij koninklijk besluit een
      bijzondere regeling getroffen op de gemeenschappelijke voordracht van Onze Minister-President, Minister van
      Algemene Zaken, Onze Minister wie het mede aangaat en Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel26
  - number: '26.2'
    text: |-
      Indien een algemene wijziging van het salaris van het burgerlijk rijkspersoneel aanleiding geeft tot het wijzigen
      van een regeling als bedoeld in het eerste lid, geschiedt dit bij een gezamenlijk besluit van Onze Minister wie het
      aangaat en Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel26
  - number: '27'
    text: Dit besluit kan worden aangehaald als Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel27
  - number: '28'
    text: |-
      Bij algemene maatregel van bestuur, regelende het overgangsrecht, wordt het tijdstip van inwerkingtreding van dit
      besluit vastgesteld, waarbij kan worden bepaald dat toepassing van een of meer artikelen of onderdelen daarvan met
      ingang van verschillende tijdstippen zal geschieden.
    url: https://wetten.overheid.nl/BWBR0003630/2016-01-01#Artikel28
