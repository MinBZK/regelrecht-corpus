      1 Voor de ambtenaar, wiens ambt is vermeld in de [bijlage A][ref1] van dit besluit, geldt het salaris, dat in die
      bijlage bij zijn ambt is aangegeven.

      2 Indien de ambtenaar bedoeld in het vorige lid anders dan bij wijze van disciplinaire straf als bedoeld in het
      [Algemeen Rijksambtenarenreglement][ref2] of in een soortgelijke regeling en zonder voorafgaand ontslag wordt
      belast met een ander ambt, als gevolg waarvan zijn salaris op grond van de overige bepalingen van dit besluit een
      verlaging zou moeten ondergaan, blijft deze verlaging achterwege.


      [ref1]: https://wetten.overheid.nl/BWBR0003630
      [ref2]: https://wetten.overheid.nl/BWBR0001950
