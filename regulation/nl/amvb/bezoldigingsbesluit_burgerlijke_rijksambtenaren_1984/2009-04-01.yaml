        artikel: '15'
  - number: '2'
    text: |-
      In dit besluit wordt verstaan onder:

      a. salaris: het bedrag, dat met inachtneming van de bepalingen van dit besluit voor de ambtenaar is vastgesteld
      aan de hand van een van de bijlagen van dit besluit vermenigvuldigd met de voor de ambtenaar geldende
      arbeidsduurfactor;

      b. *salaris per uur:* 1/156 deel van het salaris bij een volledige werktijd;

      c. *salarisschaal:* een als zodanig in de [bijlage B][ref1] van dit besluit vermelde reeks van genummerde
      salarissen;

      d. salarisnummer: een aanduiding, bestaande uit een getal, dat in een salarisschaal voor een salaris is vermeld;

      e. maximumsalaris: het hoogste bedrag van een salarisschaal;

      f. bezoldiging: de som van:

      het salaris;

      de toelagen, genoemd in [hoofdstuk III][ref2];

      de periodieke toeslag, genoemd in [artikel 22a][ref3];

      de maandelijkse toeslag, genoemd in [artikel 22b][ref4];

      waarop de ambtenaar aanspraak heeft;

      g. volledige arbeidsduur: een arbeidsduur welke gemiddeld zesendertig werkuren per week omvat;

      h. arbeidsduurfactor: de breuk, waarvan de teller bestaat uit de voor de ambtenaar vastgestelde arbeidsduur en de
      noemer bestaat uit het getal 36;

      i. *functie:* het samenstel van werkzaamheden door de ambtenaar te verrichten krachtens en overeenkomstig hetgeen
      hem door het daartoe bevoegde gezag is opgedragen;

      j. toeslag: een toeslag als bedoeld in [artikel 22a][ref5];

      k. periodieke toeslag: een toeslag als bedoeld in [artikel 22a][ref6] die maandelijks wordt betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0003630
