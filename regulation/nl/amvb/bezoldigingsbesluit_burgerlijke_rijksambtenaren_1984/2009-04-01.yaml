        artikel: '5'
        hoofdstuk: II
  - number: '7'
    text: |-
      1 Het salaris van de ambtenaar die nog niet het maximumsalaris van de voor hem geldende salarisschaal heeft
      bereikt, wordt jaarlijks verhoogd tot het in de schaal naasthogere bedrag, indien hij naar het oordeel van het
      bevoegd gezag in voldoende mate functioneert.

      2 Het salaris van de ambtenaar die nog niet het maximumsalaris van de voor hem geldende salarisschaal heeft
      bereikt, kan worden verhoogd tot een in de schaal vermeld hoger bedrag, indien hij naar het oordeel van het bevoegd
      gezag meer dan in voldoende mate functioneert dan wel indien daartoe naar het oordeel van het bevoegd gezag op
      andere gronden aanleiding bestaat.

      3 Indien de ambtenaar naar het oordeel van het bevoegd gezag niet in voldoende mate functioneert, blijft
      salarisverhoging achterwege.

      4 De in het eerste en tweede lid bedoelde salarisverhoging wordt toegekend wanneer de ambtenaar het maximumsalaris
      van de voor hem geldende salarisschaal nog niet heeft bereikt, voor de eerste maal met ingang van de eerste dag van
      de maand, waarin sinds zijn aanstelling een jaar is verstreken en nadien telkens na één jaar.

      5 Het tijdstip waarop ingevolge het vierde lid een salarisverhoging wordt toegekend kan worden vervroegd indien
      daartoe naar het oordeel van het bevoegde gezag aanleiding bestaat.

      6 Indien het functioneren van de ambtenaar niet kan worden beoordeeld omdat hij langdurig zijn functie niet
      uitoefent, kan zijn salaris worden verhoogd tot het in de schaal naasthogere bedrag, indien daartoe naar het
      oordeel van het bevoegd gezag aanleiding bestaat.

      7 Het oordeel van het bevoegd gezag over het functioneren van de ambtenaar komt tot stand op basis van een gesprek
      als bedoeld in [artikel 71 van het Algemeen Rijksambtenarenreglement][ref1], voorzover het betreft de in het
      eerste lid van dat artikel onder a en b genoemde onderwerpen, dan wel op basis van een vastgestelde beoordeling als
      bedoeld in [artikel 71a van het Algemeen Rijksambtenarenreglement][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0001950#Artikel71a
