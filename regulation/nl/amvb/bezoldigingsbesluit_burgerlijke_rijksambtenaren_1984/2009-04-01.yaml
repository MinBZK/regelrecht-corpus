  - number: 11a
    text: |-
      1 Voor de ambtenaar die op oproep werkzaam is, dient bij de in [artikel 11][ref1] geregelde vaststelling van het
      salaris tevens rekening te worden gehouden met [het tweede lid van dit artikel][ref2].

      2 Indien de ambtenaar wordt opgeroepen om arbeid te verrichten voor een periode korter dan drie uur heeft hij recht
      op het salaris waarop hij aanspraak zou hebben indien hij drie uur arbeid zou hebben verricht indien:

      a. de arbeidsduur minder bedraagt dan gemiddeld 15 uur per week en tijdstippen waarop de arbeid moet worden
      verricht niet zijn vastgelegd; of

      b. de arbeidsduur niet vastligt.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0003630#Artikel11a
