  - number: '6'
    text: |-
      1 Bij aanstelling wordt aan de in [artikel 5][ref1] bedoelde ambtenaar het salaris toegekend, dat in de voor hem
      geldende salarisschaal is vermeld achter het salarisnummer 0.

      2 Van het bepaalde in het vorige lid kan worden afgeweken door het toekennen van een hoger salaris, ingeval daartoe
      naar het oordeel van het bevoegde gezag aanleiding bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel5
    url: https://wetten.overheid.nl/BWBR0003630/2009-04-01#Artikel6
