  - number: 11b
    text: |-
      Het salaris van de ambtenaar die arbeidsgehandicapt is in de zin van
      [artikel 2 van de Wet op de (re)ïntegratie arbeidsgehandicapten][ref1] kan, met inachtneming van
      [artikel 5, tweede lid][ref2], naar evenredigheid worden verminderd conform de door de uitvoeringsinstelling,
      bedoeld in artikel 41, derde lid, van de Organisatiewet sociale verzekeringen 1997, vastgestelde arbeidsprestatie.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003630#Artikel5
