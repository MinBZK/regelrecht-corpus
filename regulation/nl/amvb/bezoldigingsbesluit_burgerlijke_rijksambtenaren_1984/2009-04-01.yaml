  - number: '24'
    text: |-
      Het bepalen van de salarisschaal en het toekennen van het salaris, van een toelage als bedoeld in de
      [artikelen 14 tot en met 18a][ref1], van de eindejaarsuitkering, van de vakantie-uitkering, van een toeslag en van
      de vergoeding voor extra diensten vindt plaats:

      a. wat betreft de ambtenaren, aangesteld bij de Raad van State, door de vicepresident van de Raad van State;

      b. wat betreft de ambtenaren, aangesteld bij de Algemene Rekenkamer, de Hoge Raad van Adel, het Kabinet der
      Koningin, de Kanselarij der Nederlandse Orden of de Nationale ombudsman door het tot aanstelling bevoegde gezag;

      c. wat betreft de overige ambtenaren door Onze minister wie het aangaat.


