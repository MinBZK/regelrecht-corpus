    text: |-
      1 De ambtenaar aan wie een toelage is toegekend op grond van artikel 17 of op grond van [artikel 7 van het Besluit
      personenchauffeurs Rijksdienst](onbekend) ontvangt een nominale toeslag van € 37,50 per maand. Bedraagt de voor de
      ambtenaar geldende arbeidsduurfactor minder dan 1, dan wordt het bedrag van de toeslag vermenigvuldigd met de voor
      de ambtenaar geldende arbeidsduurfactor.

      2 Geen recht op de in het eerste lid genoemde toeslag bestaat vanaf het tijdstip dat de ambtenaar langer dan vier
      weken geen dienst verricht als bedoeld in artikel 17.
    url: https://wetten.overheid.nl/BWBR0003630/2009-04-01#Artikel22e
  - number: '23'
    text: |-
      1 Aan de ambtenaar, voor wie een salarisschaal geldt met een lager maximumsalaris dan dat van schaal 11 en die in
      opdracht van het bevoegde gezag overwerk verricht, wordt, behoudens het bepaalde in het derde lid, een vergoeding
      toegekend.

      2 Onder overwerk wordt verstaan arbeid buiten de werktijden geldende voor de ambtenaar krachtens een
      werktijdregeling als bedoeld in [artikel 21 van het Algemeen Rijksambtenarenreglement][ref1] of in bepalingen
      van dezelfde strekking in een soortgelijke regeling, voor zover daardoor het per werkperiode vastgestelde aantal
      arbeidsuren wordt overschreden.

      3 Voor overwerk dat gedurende korter dan een uur aansluitend aan de vastgestelde dagelijkse werktijd wordt
      verricht, wordt geen vergoeding toegekend.

      4 De werkperiode bedoeld in het tweede lid wordt gesteld op:

      a. één dag, indien aanvang en einde van de werktijd in de regel niet aan wisselingen onderhevig zijn;

      b. een tijdvak van tenminste zeven dagen, indien de tijdstippen van aanvang en einde van de werktijd volgens een
      tevoren vastgesteld rooster wisselen.

      5 De vergoeding voor overwerk bestaat uit:

      a. verlof, gelijk aan het aantal uren overschrijding van het per werkperiode vastgestelde aantal arbeidsuren, en

      b. Een bedrag in geld, dat voor elk uur van die overschrijding een percentage van het voor de ambtenaar geldende
      salaris per uur bedraagt.

      6 De vergoeding in verlof wordt zo spoedig mogelijk toegekend, doch in de regel niet later dan in de kalendermaand
      volgende op die, waarin de overschrijding plaats had, waarbij zoveel mogelijk rekening wordt gehouden met de wensen
      van de ambtenaar.

      7 Indien naar het oordeel van het bevoegde gezag het dienstbelang zich verzet tegen het toekennen van verlof, wordt
      in plaats van verlof voor ieder uur een bedrag in geld toegekend gelijk aan het voor de ambtenaar geldende salaris
      per uur.

      8 Het in het vijfde lid, onder b, bedoelde percentage bedraagt:

      a. behoudens het gestelde [onder b][ref2], het getal, vermeld in de onderstaande tabel









                        overwerk verricht


                        op zaterdag en zondag


                        op maandag t/m vrijdag






                        tussen 0 en 6 uur


                        100


                        50




                        tussen 6 en 22 uur


                        50


                        25




                        tussen 22 en 24 uur


                        100


                        50






      b. De feestdagen, genoemd in [artikel 21, zevende lid, onder ][ref3], worden voor de vergoeding van overwerk
      gelijkgesteld met een zondag.

      9 Voor het vaststellen van de duur van de overschrijding gelden de uren waarop krachtens het vijfde lid onder *a*,
      of krachtens het [Algemeen Rijksambtenarenreglement][ref4] dan wel een overeenkomstige regeling vakantie of verlof
      is genoten, als uren waarop is gewerkt.

      10 Aan ambtenaren voor wie verschillende salarisschalen gelden, die ingevolge een opdracht als bedoeld in
      het eerste lid gelijke werkzaamheden verrichten kan, in afwijking van het in voorgaande leden bepaalde, naar
      billijkheid een voor alle betrokken ambtenaren gelijke vergoeding worden toegekend. Onze Minister van Binnenlandse
      Zaken en Koninkrijksrelaties kan voor de toepassing hiervan nadere regels vaststellen.

      11 In bijzondere gevallen kan een regeling worden getroffen, welke het bepaalde in de vorige leden aanvult of
      daarvan afwijkt.


