  - number: 22d
    text: |-
      1 De ambtenaar die de spilleeftijd van de Regeling flexibel pensioen en uittreden van 62 jaar heeft bereikt, heeft
      voor elke periode van twaalf maanden dat hij van de regeling geen of geen volledig gebruik maakt recht op een
      eenmalige toeslag. De toeslag bedraagt, na aftrek van de verschuldigde loonbelasting/premies volksverzekeringen
      volgens de tabel bijzondere beloningen ingevolge de [Wet op de loonbelasting 1964][ref1] en eventueel verschuldigde
      (pseudo-)premies ingevolge de sociale werknemersverzekeringen, € 454,00. Bedraagt de voor de ambtenaar
      geldende arbeidsduurfactor minder dan 1 dan wordt het bedrag van de toeslag vermenigvuldigd met de geldende
      arbeidsduurfactor.

      2 Bij de vaststelling van de hoogte van de toeslag wordt de arbeidsduurfactor aan het einde van de periode van
      twaalf maanden gehanteerd.

      3 Het recht op de in het eerste lid genoemde toeslag ontstaat op de dag van het bereiken van de leeftijd van
      respectievelijk 63, 64 en 65 jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002471
