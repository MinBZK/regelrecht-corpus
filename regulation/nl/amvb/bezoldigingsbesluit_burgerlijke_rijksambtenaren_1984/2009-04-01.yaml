  - number: '22'
    text: |-
      1 De vakantie-uitkering wordt eenmaal per jaar betaald over de periode van twaalf maanden, die is aangevangen met
      de maand juni van het voorafgaande kalenderjaar.

      2 Bij ontslag van de ambtenaar vindt betaling plaats over het tijdvak, gelegen tussen het einde van de laatst
      verstreken periode, waarover de vakantie-uitkering is betaald en de datum van het ontslag.
    url: https://wetten.overheid.nl/BWBR0003630/2009-04-01#Artikel22
  - number: 22a
    text: |-
      1 Aan een ambtenaar of een groep van ambtenaren kan een eenmalige of periodieke toeslag worden toegekend.

      2 Aan de toekenning van een toeslag kunnen voorwaarden worden verbonden.

      3 Een periodieke toeslag wordt ingetrokken indien de gronden waarop de toeslag is toegekend niet meer aanwezig
      zijn.

      4 Een regeling kan worden getroffen, welke dit artikel aanvult.
    url: https://wetten.overheid.nl/BWBR0003630/2009-04-01#Artikel22a
  - number: 22b
    text: |-
      De ambtenaar die is benoemd in een functie van secretaris-generaal, genoemd in
      [artikel 7, vierde lid, van het Algemeen Rijksambtenarenreglement][ref1], heeft voor de duur van die benoeming
      aanspraak op een maandelijkse toeslag ter grootte van 5% van zijn salaris.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel7
