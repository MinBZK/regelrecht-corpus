  - number: '12'
    text: |-
      In bijzondere gevallen kan een regeling worden getroffen, waarbij van de overige bepalingen van dit hoofdstuk kan
      worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0003630/2009-04-01#Artikel12
  - number: '14'
    text: |-
      1 Aan de ambtenaar, die bij wijze van waarneming tijdelijk een functie uitoefent, welke bij toepassing van
      [artikel 5, tweede lid en derde lid][ref1], zou leiden tot een salarisschaal met een hoger maximumsalaris, kan voor
      de duur van die waarneming een toelage worden toegekend.

      2 De toelage wordt, tenzij bijzondere omstandigheden aanwezig zijn, slechts toegekend wanneer de waarneming
      tenminste een tijdvak van dertig dagen heeft geduurd.

      3 Bij volledige waarneming van de functie bedoeld in het eerste lid is het bedrag van de toelage gelijk aan het
      verschil tussen het salaris dat de ambtenaar geniet en het salaris dat hij zou genieten, wanneer de salarisschaal
      met het hogere maximumsalaris met ingang van de dag waarop de waarneming is begonnen voor hem zou hebben gegolden.

      4 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt voor de toepassing van dit artikel nadere
      regels vast.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel5
