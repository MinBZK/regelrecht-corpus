  - number: '17'
    text: |-
      1 Aan de ambtenaar, die anders dan bij wijze van overwerk, regelmatig of vrij regelmatig arbeid verricht op andere
      tijden dan op de dagen maandag tot en met vrijdag tussen 8 en 18 uur, wordt een toelage toegekend.

      2 De toelage bedraagt per gewerkt uur een percentage van het voor de ambtenaar geldende salaris per uur en wel

      a. 20% voor de uren op maandag tot en met vrijdag tussen 6 en 8 uur en tussen 18 en 22 uur;

      b. 40% voor de uren op maandag tot en met vrijdag tussen 0 en 6 uur en tussen 22 en 24 uur;

      c. 70% voor de uren op zaterdag;

      d. 70% voor de uren op zondag;

      e. 100% voor de uren op de feestdagen genoemd in
      [artikel 21, zevende lid, onder a, van het Algemeen Rijksambtenarenreglement][ref1], Eerste Paasdag en Eerste
      Pinksterdag,

      met dien verstande dat genoemde percentages worden berekend over ten hoogste het salaris per uur, dat is afgeleid
      van het salaris behorende bij salarisnummer 10 van salarisschaal 7.

      3 Voor de in het vorige lid onder a genoemde morgen- en avonduren wordt de toelage slechts toegekend, indien de
      arbeid is aangevangen vóór 7 uur, respectievelijk is beëindigd na 20 uur.

      4 In afwijking van het bepaalde in het eerste en het tweede lid ontvangt de ambtenaar met ingang van de maand
      waarin hij de leeftijd van 55 jaar bereikt een vaste toelage, mits hij op dat moment gedurende ten minste 5 jaar
      zonder wezenlijke onderbreking een toelage als bedoeld in het eerste lid heeft genoten.

      5 De toelage bedoeld in het vierde lid wordt vastgesteld op het bedrag dat de ambtenaar over de zesendertig
      kalendermaanden voorafgaande aan de maand waarin hij de leeftijd van 55 jaar bereikt gemiddeld per maand aan
      toelage als bedoeld in het eerste lid heeft genoten en wordt aangepast aan algemene salariswijzigingen.

      6 Voor de toepassing van het vierde lid wordt onder wezenlijke onderbreking verstaan een onderbreking van langer
      dan twee maanden.

      7 In afwijking van het eerste en tweede lid kan het bevoegd gezag een vaste toelage vaststellen voor een ambtenaar
      die geen aanspraak heeft op een vaste toelage als bedoeld in het vierde lid.

      8 De toelage, bedoeld in het zevende lid, wordt vastgesteld aan de hand van het bepaalde in het tweede en derde
      lid, de voor de ambtenaar geldende werktijdregeling en de mate waarin en de wijze waarop van die werktijdregeling
      pleegt te worden afgeweken. De toelage wordt aangepast indien zich wijzigingen voordoen in de berekeningsgrondslag
      daarvan.

      9 In bijzondere gevallen kan een regeling worden getroffen, welke het bepaalde in de vorige leden aanvult of
      daarvan afwijkt.


