    text: |-
      1 Ambtenaar in de zin van dit besluit is hij, die in burgerlijke rijksdienst is aangesteld om tegen bezoldiging
      arbeid te verrichten.

      2 Dit besluit is niet van toepassing op de ambtenaar, wiens bezoldiging is geregeld

      a. bij de wet;

      b. bij een algemene maatregel van bestuur tot regeling van de bezoldiging van

      1°. de ambtenaren van de buitenlandse dienst;

      2°. de politie;

      3°. het personeel van de universiteiten en hogescholen, de academische ziekenhuizen, de interuniversitaire
      instituten en de organen voor postacademisch onderwijs;

      4°. het personeel bij het voortgezet onderwijs;

      5°. het personeel bij het basisonderwijs en bij het speciaal en voortgezet speciaal onderwijs;

      6°. leden van het korps van deskundigen voor de technische hulp aan ontwikkelingslanden;

      7°. leden van raden, besturen en commissies;

      c. krachtens [artikel 15 van het Algemeen Rijksambtenarenreglement][ref1] of een daarmee overeenkomende bepaling
      van gelijke strekking.

      3 Wij behouden Ons voor op de gemeenschappelijke voordracht van Onze Minister, hoofd van het desbetreffende
      departement van algemeen bestuur en Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, andere dan in het
      vorige lid bedoelde ambtenaren of groepen van ambtenaren uit te zonderen van de toepassing van dit besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel15
    url: https://wetten.overheid.nl/BWBR0003630/2009-04-01#Artikel1
