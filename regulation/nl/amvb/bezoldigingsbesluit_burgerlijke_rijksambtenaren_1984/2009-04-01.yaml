  - number: 17b
    text: |-
      1 Aan de ambtenaar die nu en dan, regelmatig of voortdurend onder bezwarende omstandigheden arbeid verricht en
      wiens functie op een functielijst voorkomt, wordt een toelage per maand toegekend.

      2 Onder bezwarende omstandigheden worden begrepen:

      a. het werken in een situatie die een zodanige verontreiniging van de huid veroorzaakt dat deze ook na het gebruik
      van speciale wasmiddelen duidelijk waarneembaar blijft;

      b. het werken in een omgeving met sterk onaangename geuren, of werken met onaangenaam aandoende en sterk afkeer
      oproepende materialen;

      c. het werken in een situatie die een zeer hoge mate van huid- en slijmvliesprikkeling teweegbrengt, zodanig dat
      dit effect ook na het werk nog enige tijd voelbaar blijft;

      d. het langdurig werken onder zeer onaangename hoge of lage temperatuur of temperatuurswisselingen;

      e. het werken in situaties waarin het gebruik van gehoorbeschermingsmiddelen niet mogelijk of afdoende is, en
      waarin door het aanhoudende lawaai onderling contact nauwelijks mogelijk is of de geluidsterkte gelijk is aan of
      groter is dan 80 dbA;

      f. het werken met sterk trillende apparatuur;

      g. het werken met beschermingskleding of -middelen die een ernstige belemmering vormen voor de normale ademhaling,
      voor huidoppervlakte-uitwaseming en voor de bewegingsmogelijkheden;

      h. het werken onder omstandigheden welke een verhoogd gevaar voor invaliditeit of overlijden meebrengen.

      3 Het bevoegd gezag geeft voor elke op de functielijst voorkomende functie aan of er nu en dan, regelmatig of
      voortdurend onder één dan wel gelijktijdig onder meer typen bezwarende omstandigheden arbeid wordt verricht. Een
      functielijst wordt jaarlijks door het bevoegd gezag vastgesteld.

      4 De toelage bedraagt een percentage van het salaris behorende bij salarisnummer 10 van salarisschaal 7 en wel:

      a. 1% indien de ambtenaar nu en dan onder één of gelijktijdig onder twee typen bezwarende omstandigheden dan wel
      regelmatig onder één type bezwarende omstandigheden arbeid verricht;

      b. 2% indien de ambtenaar nu en dan gelijktijdig onder drie of meer typen bezwarende omstandigheden dan wel
      regelmatig gelijktijdig onder twee typen bezwarende omstandigheden of voortdurend onder één type bezwarende
      omstandigheden arbeid verricht;

      c. 3% indien de ambtenaar regelmatig gelijktijdig onder drie of meer typen bezwarende omstandigheden of voortdurend
      gelijktijdig onder twee of meer typen bezwarende omstandigheden arbeid verricht.

      5 De toelage wordt vermenigvuldigd met de voor de ambtenaar geldende arbeidsduurfactor.

      6 In bijzondere gevallen kan een regeling worden getroffen, welke het bepaalde in de vorige leden aanvult of
      daarvan afwijkt.

      7 Het bevoegd gezag kan een vergoeding toekennen indien de ambtenaar incidenteel onder bezwarende omstandigheden
      arbeid verricht.
