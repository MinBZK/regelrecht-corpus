  - number: '18'
    text: |-
      1 Aan de ambtenaar wiens bezoldiging, als gevolg van het beëindigen of verminderen van een toelage als bedoeld in
      [artikel 17][ref1], een blijvende verlaging ondergaat, welke tenminste 3% bedraagt van de som van het salaris en
      een periodieke toeslag, wordt een aflopende toelage toegekend, mits hij eerstgenoemde toelage, direct voorafgaande
      aan het tijdstip van vorenbedoelde beëindiging of vermindering ervan, gedurende ten minste 2 jaren zonder
      wezenlijke onderbreking heeft genoten.

      2 Voor de toepassing van het eerste lid wordt onder wezenlijke onderbreking verstaan een onderbreking van langer
      dan twaalf maanden.

      3 Het eerste lid is niet van toepassing indien de verlaging van de bezoldiging het gevolg is van een disciplinaire
      maatregel genoemd in [artikel 81 van het Algemeen Rijksambtenarenreglement][ref2] of een bepaling van dezelfde
      strekking in een soortgelijke regeling.

      4 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt voor de toepassing van dit artikel nadere
      regels vast.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel17
