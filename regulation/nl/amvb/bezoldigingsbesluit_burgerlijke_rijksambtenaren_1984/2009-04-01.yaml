  - number: 20a
    text: |-
      1 De ambtenaar heeft recht op een eindejaarsuitkering ter grootte van 5,4% van het door hem genoten salaris.

      2 De eindejaarsuitkering wordt jaarlijks uitbetaald in de maand november en wordt berekend over de periode van
      twaalf maanden die is aangevangen met de maand december van het voorafgaande kalenderjaar.

      3 Voor de duur dat de bezoldiging op grond van
      [artikel 18, tweede lid, van het Algemeen Rijksambtenarenreglement][ref1] of op grond van een bepaling van dezelfde
      strekking in een soortgelijke regeling is teruggebracht tot het bedrag van het op de ambtenaar te verhalen gedeelte
      van de pensioenbijdrage, wordt de ambtenaar voor de toepassing van het eerste lid geacht geen salaris te genieten.

      4 De ambtenaar die recht heeft op een uitkering op basis van de [Ziektewet][ref2], de [Wet arbeid en zorg][ref3],
      de [Wet werk en inkomen naar arbeidsvermogen][ref4] of de [Wet op de arbeidsongeschiktheidsverzekering][ref5],
      wordt voor de toepassing van het eerste lid geacht het salaris te genieten dat hij zou hebben genoten indien hij
      geen recht zou hebben gehad op een uitkering op basis van genoemde wetten.

      5 Bij ontslag van de ambtenaar vindt betaling plaats over het tijdvak gelegen tussen het einde van de laatst
      verstreken periode waarover de eindejaarsuitkering is betaald en de datum van het ontslag.

      6 Voor de berekening van de eindejaarsuitkering wordt uitgegaan van het salaris zonder dat dit is verminderd
      met het bedrag dat als belastingvrije vergoeding is uitgekeerd voor een bestemmingsmogelijkheid als bedoeld in
      [artikel 6, tweede lid, van de IKAP-regeling rijkspersoneel][ref6].


