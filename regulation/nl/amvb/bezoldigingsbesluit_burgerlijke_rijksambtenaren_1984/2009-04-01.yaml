  - number: 5a
    text: |-
      1 De ambtenaar die zich niet kan verenigen met de uitkomst van de bepaling van de zwaarte van zijn functie als
      bedoeld in [artikel 5, derde lid][ref1], kan het voor de toepassing van [artikel 5, tweede lid][ref2], bevoegde
      gezag verzoeken die waarderingsuitkomst opnieuw in overweging te nemen.

      2 Indien de toepassing van het bepaalde in [artikel 5, tweede lid][ref3], berust bij Ons, worden Wij
      vertegenwoordigd door Onze Minister wie het aangaat.

      3 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties stelt regels betreffende de behandeling van verzoeken
      als bedoeld in het eerste lid.

      4 Het in het eerste lid bepaalde is niet van toepassing indien voor de ambtenaar een bijzondere regeling geldt als
      bedoeld in [artikel 13 van het Algemeen Rijksambtenarenreglement][ref4] of in bepalingen van dezelfde strekking in
      een soortgelijke regeling.


