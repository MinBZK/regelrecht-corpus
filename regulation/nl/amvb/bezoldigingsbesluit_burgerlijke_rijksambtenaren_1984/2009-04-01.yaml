  - number: '8'
    text: |-
      1 Het salaris van de ambtenaar, bedoeld in [artikel 5, eerste lid][ref1], die het maximumsalaris van de voor
      hem geldende salarisschaal heeft bereikt, kan worden verhoogd, indien hij naar het oordeel van het bevoegd gezag
      uitstekend functioneert.

      2 Bij een salarisverhoging als bedoeld in het eerste lid wordt het salaris:

      a. voor de ambtenaar voor wie één der salarisschalen 1 tot en met 17 van de [bijlage B][ref2] geldt, vastgesteld
      op een bedrag vermeld in de naasthogere salarisschaal, met dien verstande dat het maximum van die schaal niet wordt
      overschreden;

      b. voor de ambtenaar, voor wie salarisschaal 18 van de [bijlage B][ref3] geldt, vastgesteld op één van de volgende
      bedragen:

      € 8726,88;

      € 8912,07;

      € 9098,26.

      3 Indien het functioneren van de ambtenaar niet langer als uitstekend kan worden gekwalificeerd, kan het bevoegd
      gezag de toekenning van de salarisverhoging, bedoeld in het eerste lid, geheel of gedeeltelijk intrekken.

      4 Het oordeel van het bevoegd gezag over het functioneren van de ambtenaar komt tot stand op basis van een gesprek
      als bedoeld in [artikel 71 van het Algemeen Rijksambtenarenreglement][ref4], voorzover het betreft de in het eerste
      lid van [dat artikel onder a en b][ref5] genoemde onderwerpen, dan wel op basis van een vastgestelde beoordeling
      als bedoeld in [artikel 71a van het Algemeen Rijksambtenarenreglement][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel5
