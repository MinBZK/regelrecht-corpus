  - number: 18a
    text: |-
      1 Aan de ambtenaar die buiten de werktijden die voor hem gelden krachtens een werktijdregeling als bedoeld in
      [artikel 21 van het Algemeen Rijksambtenarenreglement][ref1] of in bepalingen van dezelfde strekking in een
      soortgelijke regeling, ingevolge een schriftelijke aanwijzing van het bevoegd gezag zich regelmatig of vrij
      regelmatig bereikbaar en beschikbaar moet houden teneinde bij oproep arbeid te gaan verrichten, wordt een toelage
      toegekend.

      2 De toelage bedraagt per uur bereikbaarheid en beschikbaarheid een percentage van het voor de ambtenaar geldende
      salaris per uur en wel

      a. 5% voor de uren op maandag tot en met vrijdag;

      b. 10% voor de uren op zaterdag en zondag en op de feestdagen genoemd in
      [artikel 21, zevende lid, onderdeel a, van het Algemeen Rijksambtenarenreglement][ref2],

      met dien verstande dat genoemde percentages worden berekend over ten hoogste het salaris per uur, dat is afgeleid
      van het salaris behorende bij salarisnummer 10 van salarisschaal 7.

      3 De op basis van het tweede lid berekende toelage wordt verhoogd met 100% over de uren waarop aan de opgedragen
      bereikbaarheid en beschikbaarheid een extra plaatsgebondenheid op of rond de plaats van tewerkstelling is
      verbonden.

      4 In afwijking van het tweede en derde lid kan het bevoegd gezag een vaste toelage toekennen.

      5 De toelage, bedoeld in het vierde lid, wordt vastgesteld aan de hand van het bepaalde in het tweede en derde
      lid en de mate waarin de ambtenaar zich ingevolge een schriftelijke aanwijzing van het bevoegd gezag bereikbaar
      en beschikbaar pleegt te moeten houden. De toelage wordt aangepast indien zich wijzigingen voordoen in de
      berekeningsgrondslag daarvan.

      6 In bijzondere gevallen kan een regeling worden getroffen welke het bepaalde in dit artikel aanvult of daarvan
      afwijkt.


