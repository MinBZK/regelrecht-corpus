  - number: '5'
    text: |-
      1 Voor de ambtenaar, wiens ambt niet is vermeld in de [bijlage A][ref1] van dit besluit, geldt een salarisschaal.

      2 De salarisschaal welke voor de ambtenaar geldt wordt, tenzij zijn wijze van functioneren zich nog daartegen
      verzet, bepaald met inachtneming van de zwaarte van zijn functie en van bijzondere regelingen, als bedoeld in
      [artikel 13 van het Algemeen Rijksambtenarenreglement][ref2] of in bepalingen van dezelfde strekking in een
      soortgelijke regeling.

      3 De zwaarte van de functie wordt bepaald binnen de in de [bijlage B][ref3] van dit besluit aangegeven
      indelingsstructuur, met inachtneming van het door of in overeenstemming met Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties vastgestelde normeringsstelsel.

      4 Indien de ambtenaar bij wijze van waarneming tijdelijk een andere functie uitoefent, blijft de voordien voor hem
      geldende salarisschaal van toepassing.

      5 Voor de ambtenaar kan uitsluitend in de navolgende gevallen een salarisschaal gaan gelden met een lager
      maximumsalaris dan dat van de voor hem geldende salarisschaal:

      a. bij wijze van disciplinaire straf, bedoeld in het [Algemeen Rijksambtenarenreglement][ref4] of in een
      soortgelijke regeling;

      b. indien bij het bepalen van de salarisschaal, bedoeld in het tweede lid, tevens is bepaald dat zijn functie een
      tijdelijk karakter heeft en de salarisschaal in verband daarmee slechts tijdelijk zal gelden;

      c. indien hij in verband met ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte wordt herplaatst in
      een andere functie waarvoor een salarisschaal geldt met een lager maximumsalaris;

      d. indien hem op zijn aanvraag een andere functie wordt opgedragen waarvoor een salarisschaal
      geldt met een lager maximumsalaris, tenzij er sprake is van de omstandigheid, bedoeld in
      [artikel 57b van het Algemeen Rijksambtenarenreglement][ref5].


