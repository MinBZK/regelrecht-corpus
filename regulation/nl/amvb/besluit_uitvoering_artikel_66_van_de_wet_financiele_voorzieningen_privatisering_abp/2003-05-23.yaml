  - number: '2'
    text: |-
      De inhouding die de militair verschuldigd is, wordt geheven over zijn inkomsten en komt voorts
      overeen met het bedrag van het ingevolge de [artikelen 18][ref1] en [19][ref2] in verband met
      [artikel 16, eerste lid, van de wet][ref3] bepaalde vut-bijdrageverhaal.


      [ref1]: https://wetten.overheid.nl/BWBR0007211#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0007211#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0007211#Artikel16
    url: https://wetten.overheid.nl/BWBR0007577/2003-05-23#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007211
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0007211
        artikel: '19'
      - id: ref3
        bwb_id: BWBR0007211
        artikel: '16'
  - number: '3'
    text: |-
      De inhouding is niet verschuldigd door de militair die na het vervullen van de militaire dienstplicht, anders
      dan als beroepsmilitair, vrijwillig nadient en uit dien hoofde wordt bezoldigd in de zin van de voor de militair
      geldende bezoldigingsregeling, bedoeld in [artikel 28, eerste lid, onder ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007211#Artikel28
    url: https://wetten.overheid.nl/BWBR0007577/2003-05-23#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007211
        artikel: '28'
  - number: '4'
    text: |-
      De inhouding die verschuldigd is over een nabetaling aan een ontslagen militair, wordt op dezelfde wijze berekend
      als de inhouding over de laatste uitbetalingstermijn voor het ontslag.
    url: https://wetten.overheid.nl/BWBR0007577/2003-05-23#Artikel4
  - number: '5'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin het wordt
      geplaatst en werkt terug tot en met 1 januari 1995.
    url: https://wetten.overheid.nl/BWBR0007577/2003-05-23#Artikel5
  - number: '6'
    text: |-
      Dit besluit kan worden aangehaald als: Besluit uitvoering
      [artikel 66 van de Wet financiële voorzieningen privatisering ABP][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007211#Artikel66
