preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Defensie van 19 juli 1995, nr. PAV 6204/95013668;

    Gelet op artikel 66 van de Wet financiële voorzieningen privatisering ABP;

    De Raad van State gehoord (advies van 28 augustus 1995, nr. W07.95.0413);

    Gezien het nader rapport van de Staatssecretaris van Defensie van 19 september 1995, nr. PAV6204/95017114;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0007577/2003-05-23#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. wet: [Wet financiële voorzieningen privatisering ABP][ref1];

      b.

      c. Onze Minister: Onze Minister van Defensie;

      d. militair: militair als bedoeld in [artikel 28, eerste lid, onderdeel b, onder 3° van de wet][ref2];

      e. inhouding: inhouding ter uitvoering van [artikel 66 van de wet][ref3], met als doel niet beoogde
      inkomensvoordelen te voorkomen;

      f. inkomsten: inkomstenbestanddelen, die deel uitmaken van de berekeningsgrondslag voor pensioenen ingevolge de
      bij of krachtens de [Kaderwet militaire pensioenen][ref4] vastgestelde regelingen, voorzover deze feitelijk zijn
      genoten, met dien verstande dat de aanspraak op vakantie-uitkering over de maand waarin deze is opgebouwd, tot de
      inkomsten wordt gerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0007211
      [ref2]: https://wetten.overheid.nl/BWBR0007211#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0007211#Artikel66
      [ref4]: https://wetten.overheid.nl/BWBR0011955
    url: https://wetten.overheid.nl/BWBR0007577/2003-05-23#Artikel1
    references:
      - id: ref1
