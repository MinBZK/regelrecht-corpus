$id: uitvoeringsbesluit_voorwaardelijke_veroordeling
regulatory_layer: AMVB
publication_date: '2019-12-24'
valid_from: '2012-04-01'
bwb_id: BWBR0031086
url: https://wetten.overheid.nl/BWBR0031086/2012-04-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Veiligheid en Justitie van 28 september 2011, directie Wetgeving,
    nr. 5710248/11/6;

    Gelet op de artikelen 14d, derde lid, 15a, achtste lid, 15b, derde lid, 22e, 22k en 77ff, vierde lid, van het
    Wetboek van Strafrecht;

    De Afdeling advisering van de Raad van State gehoord (advies van 20 oktober 2011, nr. W03.11.0406/II);

    Gezien het nader rapport van de Staatssecretaris van Veiligheid en Justitie van 8 december 2011, directie
    Wetgeving, nr. 5718315/11/6;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0031086/2012-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0031086/2012-04-01#Artikel1
  - number: 1.a
    text: |-
      *wet:* het [Wetboek van Strafrecht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001854
    url: https://wetten.overheid.nl/BWBR0031086/2012-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001854
  - number: 1.b
    text: |-
      *reclasseringsinstelling:* een reclasseringsinstelling als bedoeld in
      [artikel 1, onderdeel b, van de Reclasseringsregeling 1995][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007120#Artikel1
    url: https://wetten.overheid.nl/BWBR0031086/2012-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007120
        artikel: '1'
  - number: '2'
    text: |-
      Het openbaar ministerie kan de reclasseringsinstelling die belast is met het toezicht, aanwijzingen geven omtrent
      het toezicht op de naleving van de voorwaarden.
    url: https://wetten.overheid.nl/BWBR0031086/2012-04-01#Artikel2
  - number: '3.1'
    text: |-
      De reclasseringsinstelling die belast is met het toezicht, draagt er zorg voor dat de aard en de intensiteit van
      het toezicht en de verplichtingen waaraan de veroordeelde zich in het kader van het toezicht heeft te houden,
      worden vastgelegd.
    url: https://wetten.overheid.nl/BWBR0031086/2012-04-01#Artikel3
  - number: '3.2'
    text: |-
      De reclasseringsinstelling draagt er zorg voor dat het toezicht aanvangt binnen een termijn van dertig dagen na
      het ingaan van de proeftijd, dan wel binnen een termijn van zeven dagen na het ingaan van de proeftijd, indien de
      rechter een bevel als bedoeld in [artikel 14e, eerste lid, van de wet][ref1] heeft gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel14e
    url: https://wetten.overheid.nl/BWBR0031086/2012-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 14e
  - number: '4.1'
    text: |-
      De veroordeelde volgt de aanwijzingen en opdrachten op die door de reclasseringsinstelling worden gegeven in het
      kader van het toezicht.
    url: https://wetten.overheid.nl/BWBR0031086/2012-04-01#Artikel4
  - number: '4.2'
    text: De veroordeelde geeft veranderingen in de woon- of werksituatie onmiddellijk door aan de reclasseringsinstelling.
    url: https://wetten.overheid.nl/BWBR0031086/2012-04-01#Artikel4
  - number: '5'
    text: |-
      Zo spoedig mogelijk na de melding, bedoeld in [artikel 14d, tweede lid, van de wet][ref1], brengt de
      reclasseringsinstelling advies uit aan het openbaar ministerie of de melding naar haar oordeel aanleiding zou
      kunnen geven tot een van de navolgende maatregelen:


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel14d
    url: https://wetten.overheid.nl/BWBR0031086/2012-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 14d
  - number: 5.a
    text: |-
      het indienen van een vordering als bedoeld in [artikel 14f van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel14f
    url: https://wetten.overheid.nl/BWBR0031086/2012-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 14f
  - number: 5.b
    text: |-
      het indienen van een vordering als bedoeld in [artikel 14g, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel14g
    url: https://wetten.overheid.nl/BWBR0031086/2012-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 14g
  - number: '6'
    text: |-
      Met het oog op het beëindigen van het toezicht, stuurt de reclasseringsinstelling zo spoedig mogelijk een
      afloopbericht aan het openbaar ministerie. In het afloopbericht wordt het feitelijk verloop van het toezicht
      aangegeven.
    url: https://wetten.overheid.nl/BWBR0031086/2012-04-01#Artikel6
  - number: '9'
    text: |-
      Dit besluit treedt in werking op het tijdstip waarop de wet van 17 november 2011 tot wijziging van het Wetboek van
      Strafrecht in verband met wijzigingen van de regeling van de voorwaardelijke veroordeling en de regeling van de
      voorwaardelijke invrijheidstelling (Stb. 2011, 545) in werking treedt.
    url: https://wetten.overheid.nl/BWBR0031086/2012-04-01#Artikel9
  - number: '10'
    text: 'Dit besluit wordt aangehaald als: Uitvoeringsbesluit voorwaardelijke veroordeling.'
    url: https://wetten.overheid.nl/BWBR0031086/2012-04-01#Artikel10
