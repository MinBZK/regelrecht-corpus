preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Justitie van 13 juni 1997, nr. 634598/97/6;

    Gelet op richtlijn nr. 83/189/EEG van de Raad van de Europese Gemeenschappen van 28 maart 1983 betreffende een
    informatieprocedure op het gebied van normen en technische voorschriften (PbEG L 109) en op artikel 163, tiende
    lid, van de Wegenverkeerswet 1994;

    De Raad van State gehoord (advies van 19 juni 1997, nr. W03.97.0330);

    Gezien het nader rapport van Onze Minister van Justitie van 1 juli 1997, nr. 637673/97/6;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0008805/2008-12-17#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder: ademanalyse: het vaststellen van het
      alcoholgehalte van uitgeademde lucht door middel van een onderzoek als bedoeld in
      [artikel 8, tweede lid, onderdeel a, en derde lid, onderdeel a, van de Wegenverkeerswet 1994][ref1],
      [artikel 27, tweede lid, onderdeel a, van de Scheepvaartverkeerswet][ref2],
      [artikel 2.12, derde lid, onderdeel a, van de Wet luchtvaart][ref3] of
      [artikel 4, tweede lid, onderdeel a, van de Spoorwegwet][ref4]; ademanalyse-apparaat: een apparaat, bestemd voor
      het verrichten van ademanalyse; bloedafname: het afnemen van een hoeveelheid bloed ten behoeve van een onderzoek
      als bedoeld in [artikel 8, tweede lid, onderdeel b, en derde lid, onderdeel b, van de Wegenverkeerswet 1994][ref5],
      [artikel 27, tweede lid, onderdeel b, van de Scheepvaartverkeerswet][ref6],
      [artikel 2.12, derde lid, onderdeel b, van de Wet luchtvaart][ref7] of
      [artikel 4, tweede lid, onderdeel b, van de Spoorwegwet][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004364#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0015007#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0006622#Artikel8
