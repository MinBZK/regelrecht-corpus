        artikel: '4'
  - number: '2'
    text: |-
      Onze Minister van Justitie wijst de apparatuur aan die voor een voorlopig onderzoek van uitgeademde lucht dient te
      worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0008805/2008-12-17#Artikel2
  - number: '3.1'
    text: |-
      Voor het verrichten van ademanalyse wordt gebruik gemaakt van een ademanalyse-apparaat dat behoort tot een door
      Onze Minister van Justitie aangewezen type.
    url: https://wetten.overheid.nl/BWBR0008805/2008-12-17#Artikel3
  - number: '3.2'
    text: |-
      De aanwijzing van een type geschiedt slechts indien het bij een onderzoek, verricht door een door Onze Minister van
      Justitie aangewezen keuringsinstelling, is goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0008805/2008-12-17#Artikel3
  - number: '4.1'
    text: |-
      Het ademanalyse-apparaat dient te zijn voorzien van een geldige verklaring van goedkeuring, afgegeven door een door
      Onze Minister van Justitie aangewezen keuringsinstelling.
    url: https://wetten.overheid.nl/BWBR0008805/2008-12-17#Artikel4
  - number: '4.2'
    text: |-
      Een verklaring van goedkeuring wordt slechts afgegeven, indien het ademanalyse-apparaat bij een door de
      keuringsinstelling verricht individueel onderzoek is goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0008805/2008-12-17#Artikel4
  - number: '4.3'
    text: Onze Minister van Justitie bepaalt de geldigheidsduur van de verklaring.
    url: https://wetten.overheid.nl/BWBR0008805/2008-12-17#Artikel4
  - number: '5'
    text: |-
      Onze Minister van Justitie stelt nadere regels omtrent de eisen waaraan ademanalyse-apparaten dienen te voldoen en
      de onderzoeken waaraan zij dienen te zijn onderworpen.
    url: https://wetten.overheid.nl/BWBR0008805/2008-12-17#Artikel5
  - number: '6'
    text: |-
      Ademanalyse vindt niet plaats binnen twintig minuten na het moment waarop van de verdachte is gevorderd zijn
      medewerking te verlenen aan een voorlopig onderzoek van uitgeademde lucht dan wel, indien die vordering niet is
      gedaan, binnen twintig minuten na het eerste directe contact dat een opsporingsambtenaar met hem heeft gehad,
      leidend tot de verdenking van een gedraging in strijd met [artikel 8 van de Wegenverkeerswet 1994][ref1],
      [artikel 27 van de Scheepvaartverkeerswet][ref2], [artikel 2.12 van de Wet luchtvaart][ref3] of
      [artikel 4 van de Spoorwegwet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004364#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0015007#Artikel4
    url: https://wetten.overheid.nl/BWBR0008805/2008-12-17#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0004364
        artikel: '27'
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0015007
        artikel: '4'
  - number: '7.1'
    text: |-
      Het ademanalyse-apparaat wordt bediend door een opsporingsambtenaar als bedoeld in
      [artikel 141 van het Wetboek van Strafvordering][ref1], die daartoe door de betrokken korpschef, bedoeld in
      [artikel 24][ref2], onderscheidenlijk [38 van de Politiewet 1993][ref3], of de betrokken brigade-commandant van de
      Koninklijke Marechaussee is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0006299#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0006299#Artikel38
    url: https://wetten.overheid.nl/BWBR0008805/2008-12-17#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0006299
        artikel: '24'
      - id: ref3
        bwb_id: BWBR0006299
        artikel: '38'
  - number: '7.2'
    text: |-
      Een aanwijzing als bedoeld in het eerste lid geschiedt slechts, indien de betrokken ambtenaar heeft getoond de voor
      het bedienen van het ademanalyse-apparaat benodigde kennis en vaardigheden te bezitten.
    url: https://wetten.overheid.nl/BWBR0008805/2008-12-17#Artikel7
  - number: '7.3'
    text: |-
      Onze Minister van Justitie kan in overeenstemming met Onze Minister van Binnenlandse Zaken en Onze Minister van
      Defensie nadere regels stellen omtrent de kennis en vaardigheden van de bedienende ambtenaren.
    url: https://wetten.overheid.nl/BWBR0008805/2008-12-17#Artikel7
  - number: '8.1'
    text: De ademanalyse wordt verricht volgens een door Onze Minister van Justitie vastgestelde procedure.
    url: https://wetten.overheid.nl/BWBR0008805/2008-12-17#Artikel8
  - number: '8.2'
    text: |-
      Op aanwijzing van de opsporingsambtenaar, bedoeld in [artikel 7][ref1], blaast de verdachte, zo nodig viermaal,
      ononderbroken een zodanige hoeveelheid ademlucht in het ademanalyse-apparaat als voor het onderzoek nodig is. Het
      blazen kan worden beëindigd, zodra twee meetresultaten verkregen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0008805#Artikel7
    url: https://wetten.overheid.nl/BWBR0008805/2008-12-17#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008805
        artikel: '7'
        paragraaf: '2'
  - number: '8.3'
    text: |-
      Het alcoholgehalte wordt bepaald door toepassing van een door Onze Minister van Justitie vastgestelde correctie
      op het rekenkundig gemiddelde van de beide meetresultaten, met dien verstande dat het verschil tussen de
      meetresultaten niet groter mag zijn dan een door Onze Minister van Justitie vastgestelde waarde.
    url: https://wetten.overheid.nl/BWBR0008805/2008-12-17#Artikel8
  - number: '9'
    text: |-
      Indien de medewerking van de verdachte niet heeft geleid tot een voltooid ademonderzoek, kan het onderzoek met
      toepassing van [artikel 8][ref1] eenmaal worden herhaald.


      [ref1]: https://wetten.overheid.nl/BWBR0008805#Artikel8
    url: https://wetten.overheid.nl/BWBR0008805/2008-12-17#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008805
        artikel: '8'
        paragraaf: '2'
  - number: '10.1'
    text: Het resultaat van het onderzoek wordt aanstonds aan de verdachte medegedeeld.
    url: https://wetten.overheid.nl/BWBR0008805/2008-12-17#Artikel10
  - number: '10.2'
    text: Een schriftelijke weergave van het onderzoek wordt bij het proces-verbaal gevoegd.
    url: https://wetten.overheid.nl/BWBR0008805/2008-12-17#Artikel10
  - number: 10a.1
    text: |-
      Dadelijk nadat hem het in [artikel 10, eerste lid][ref1], bedoelde resultaat is medegedeeld,
      kan de verdachte de wens kenbaar maken dat tevens een onderzoek wordt verricht als bedoeld in
      [artikel 8, tweede lid, onderdeel b, en derde lid, onderdeel b, van de Wegenverkeerswet 1994][ref2],
      [artikel 27, tweede lid, onderdeel b, van de Scheepvaartverkeerswet][ref3],
      [artikel 2.12, derde lid, onderdeel b, van de Wet luchtvaart][ref4] of
      [artikel 4, tweede lid, onderdeel b, van de Spoorwegwet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0008805#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0004364#Artikel27
      [ref4]: https://wetten.overheid.nl/BWBR0005555#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0015007#Artikel4
    url: https://wetten.overheid.nl/BWBR0008805/2008-12-17#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0008805
        artikel: '10'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0004364
        artikel: '27'
      - id: ref4
        bwb_id: BWBR0005555
        artikel: '2'
      - id: ref5
        bwb_id: BWBR0015007
        artikel: '4'
  - number: 10a.2
    text: |-
      Indien de verdachte dit wenst en het onderzoek daardoor niet wordt vertraagd, geschiedt het afnemen van bloed of
      het opvangen van urine door dan wel onder toezicht van een daartoe door hem aan te wijzen arts.
    url: https://wetten.overheid.nl/BWBR0008805/2008-12-17#Artikel10a
  - number: 10a.3
    text: Het onderzoek geschiedt voor rekening van de verdachte.
    url: https://wetten.overheid.nl/BWBR0008805/2008-12-17#Artikel10a
  - number: '11'
    text: |-
      Onze Minister van Justitie kan nadere regels stellen ten dienste van een goede uitvoering van de ademanalyse en
      omtrent de kosten van een onderzoek als bedoeld in [artikel 10a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008805#Artikel10a
    url: https://wetten.overheid.nl/BWBR0008805/2008-12-17#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008805
        artikel: 10a
        paragraaf: '2'
  - number: '12'
    text: Bloedafname geschiedt door middel van een door een arts verrichte venapunctie.
    url: https://wetten.overheid.nl/BWBR0008805/2008-12-17#Artikel12
  - number: '13'
    text: |-
      Afgenomen wordt een hoeveelheid bloed van ten hoogste 10 milliliter. Onze Minister van Justitie wijst de apparatuur
      aan die voor afname en opvang van het bloed dient te worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0008805/2008-12-17#Artikel13
  - number: '14'
    text: |-
      Bij de bloedafname is een van de in [artikel 141 van het Wetboek van Strafvordering][ref1] bedoelde
      opsporingsambtenaren aanwezig.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0008805/2008-12-17#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '15.1'
    text: |-
      Indien bloedafname heeft plaatsgevonden binnen een uur na het moment waarop van de verdachte is gevorderd zijn
      medewerking te verlenen aan een voorlopig onderzoek van uitgeademde lucht, wordt hem indien hij daarom verzoekt, zo
      spoedig mogelijk na verloop van dat uur een tweede bloedmonster afgenomen.
    url: https://wetten.overheid.nl/BWBR0008805/2008-12-17#Artikel15
  - number: '15.2'
    text: |-
      De verdachte aan wie die vordering niet is gedaan wordt, indien bloedafname heeft plaatsgevonden
      binnen een uur na het eerste directe contact dat een opsporingsambtenaar met hem heeft gehad, leidend
      tot de verdenking van een gedraging in strijd met [artikel 8 van de Wegenverkeerswet 1994][ref1],
      [artikel 27 van de Scheepvaartverkeerswet][ref2], [artikel 2.12 van de Wet luchtvaart][ref3] of
      [artikel 4 van de Spoorwegwet][ref4], op zijn verzoek zo spoedig mogelijk na verloop van dat uur een tweede
      bloedmonster afgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004364#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0015007#Artikel4
    url: https://wetten.overheid.nl/BWBR0008805/2008-12-17#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0004364
        artikel: '27'
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0015007
        artikel: '4'
  - number: '15.3'
    text: |-
      In de gevallen, bedoeld in het eerste en het tweede lid, deelt de opsporingsambtenaar de verdachte mede, dat deze
      laatste een tweede bloedafname kan verzoeken. Deze mededeling wordt in het proces-verbaal opgenomen.
    url: https://wetten.overheid.nl/BWBR0008805/2008-12-17#Artikel15
  - number: '15.4'
    text: |-
      De uitkomst van het onderzoek dat het laagste alcoholgehalte oplevert, is bepalend voor de toepassing
      van [artikel 8, tweede lid, onderdeel b, en derde lid, onderdeel b, van de Wegenverkeerswet 1994][ref1],
      [artikel 27, tweede lid, onderdeel b, van de Scheepvaartverkeerswet][ref2],
      [artikel 2.12, derde lid, onderdeel b, van de Wet luchtvaart][ref3] of
      [artikel 4, tweede lid, onderdeel b, van de Spoorwegwet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004364#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0015007#Artikel4
    url: https://wetten.overheid.nl/BWBR0008805/2008-12-17#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0004364
        artikel: '27'
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0015007
        artikel: '4'
  - number: '16.1'
    text: |-
      Indien de verdachte niet in staat is zijn wil kenbaar te maken, vindt bloedafname niet eerder plaats dan
      na verloop van een uur na het eerste directe contact dat een opsporingsambtenaar met hem heeft gehad,
      leidend tot de verdenking van een gedraging in strijd met [artikel 8 van de Wegenverkeerswet 1994][ref1],
      [artikel 27 van de Scheepvaartverkeerswet][ref2], [artikel 2.12 van de Wet luchtvaart][ref3] of
      [artikel 4 van de Spoorwegwet][ref4]. [Artikel 14][ref5] is van toepassing, tenzij gewichtige omstandigheden zich
      daartegen verzetten.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004364#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0015007#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0008805#Artikel14
    url: https://wetten.overheid.nl/BWBR0008805/2008-12-17#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0004364
        artikel: '27'
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0015007
        artikel: '4'
      - id: ref5
        bwb_id: BWBR0008805
        artikel: '14'
        paragraaf: '3'
  - number: '16.2'
    text: |-
      Indien de verdachte komt te overlijden zonder dat hij in staat is geweest zijn toestemming tot het verrichten
      van een bloedonderzoek te verlenen, wordt het bloedmonster vernietigd, tenzij de officier van justitie hiertegen
      bezwaren maakt.
    url: https://wetten.overheid.nl/BWBR0008805/2008-12-17#Artikel16
  - number: '17.1'
    text: |-
      De opsporingsambtenaar of de arts kan, indien hij vermoedt dat de verdachte onder
      invloed van een andere in [artikel 8, eerste lid, van de Wegenverkeerswet 1994][ref1],
      [artikel 27, eerste lid, van de Scheepvaartverkeerswet][ref2],
      [artikel 2.12, eerste lid, van de Wet luchtvaart][ref3] of [artikel 4, eerste lid, van de Spoorwegwet][ref4]
      bedoelde stof dan alcoholhoudende drank verkeert, de verdachte vragen zijn medewerking te verlenen aan een
      onderzoek van de urine.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004364#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0015007#Artikel4
    url: https://wetten.overheid.nl/BWBR0008805/2008-12-17#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0004364
        artikel: '27'
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0015007
        artikel: '4'
  - number: '17.2'
    text: |-
      De verdachte van wie naar het oordeel van de arts aannemelijk is dat afname van bloed
      bij hem om bijzondere geneeskundige redenen onwenselijk is, kan door de officier van
      justitie, een hulpofficier van justitie of een van de daartoe door Onze Minister van
      Justitie overeenkomstig [artikel 163, achtste lid, van de Wegenverkeerswet 1994][ref1],
      [artikel 28a, negende lid, van de Scheepvaartverkeerswet][ref2],
      [artikel 11.6, achtste lid, van de Wet luchtvaart][ref3] of [artikel 89, achtste lid, van de Spoorwegwet][ref4]
      aangewezen ambtenaren van de politie worden bevolen zijn medewerking te verlenen aan een onderzoek van de urine.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel163
      [ref2]: https://wetten.overheid.nl/BWBR0004364#Artikel28a
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0015007#Artikel89
    url: https://wetten.overheid.nl/BWBR0008805/2008-12-17#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '163'
      - id: ref2
        bwb_id: BWBR0004364
        artikel: 28a
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '11'
      - id: ref4
        bwb_id: BWBR0015007
        artikel: '89'
  - number: '17.3'
    text: |-
      Urine wordt afgestaan onder toezicht van de arts. Hierbij is een van de in
      [artikel 141 van het Wetboek van Strafvordering][ref1] bedoelde opsporingsambtenaren aanwezig.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0008805/2008-12-17#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '18'
    text: Onze Minister van Justitie wijst de apparatuur aan die voor de opvang van de urine dient te worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0008805/2008-12-17#Artikel18
  - number: '19.1'
    text: Het onderzoek van bloed of urine wordt verricht door een door Onze Minister van Justitie aangewezen laboratorium.
    url: https://wetten.overheid.nl/BWBR0008805/2008-12-17#Artikel19
  - number: '19.2'
    text: |-
      Het alcoholgehalte wordt bepaald volgens een van de door Onze Minister van Justitie aangewezen analysemethoden en
      met toepassing van de door hem vastgestelde correcties.
    url: https://wetten.overheid.nl/BWBR0008805/2008-12-17#Artikel19
  - number: '20'
    text: Het resultaat van het onderzoek wordt zo spoedig mogelijk aan de verdachte medegedeeld.
    url: https://wetten.overheid.nl/BWBR0008805/2008-12-17#Artikel20
  - number: '21.1'
    text: |-
      De verdachte kan de officier van justitie de wens kenbaar maken dat een tegenonderzoek naar het alcoholgehalte van
      bloed of urine wordt verricht. Hij kan hiertoe een laboratorium aanwijzen uit een lijst van ten minste drie door
      Onze Minister van Justitie erkende laboratoria.
    url: https://wetten.overheid.nl/BWBR0008805/2008-12-17#Artikel21
  - number: '21.2'
    text: |-
      De officier van justitie geeft het in [artikel 19][ref1] bedoelde laboratorium opdracht een voldoende hoeveelheid
      bloed dan wel urine ter beschikking te stellen van het door de verdachte aangewezen laboratorium.


      [ref1]: https://wetten.overheid.nl/BWBR0008805#Artikel19
    url: https://wetten.overheid.nl/BWBR0008805/2008-12-17#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0008805
        artikel: '19'
        paragraaf: '3'
  - number: '21.3'
    text: |-
      Bij het tegenonderzoek worden de in [artikel 19][ref1] bedoelde analysemethoden en correcties toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0008805#Artikel19
    url: https://wetten.overheid.nl/BWBR0008805/2008-12-17#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0008805
        artikel: '19'
        paragraaf: '3'
  - number: '21.4'
    text: Tegenonderzoek geschiedt voor rekening van de verdachte.
    url: https://wetten.overheid.nl/BWBR0008805/2008-12-17#Artikel21
  - number: '22'
    text: |-
      Onze Minister van Justitie geeft nadere aanwijzingen met betrekking tot de verzending en bewaring van bloed- en
      urinemonsters en de medische en analytische rapportage.
    url: https://wetten.overheid.nl/BWBR0008805/2008-12-17#Artikel22
  - number: '23'
    text: |-
      Regelingen en aanwijzingen van Onze Minister van Justitie ter uitvoering van dit besluit worden in de *Nederlandse
      Staatscourant* bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0008805/2008-12-17#Artikel23
  - number: '24.1'
    text: |-
      Met de in dit besluit bedoelde apparatuur wordt gelijkgesteld apparatuur, die rechtmatig is geproduceerd of in de
      handel is gebracht in een andere lid-staat van de Europese Unie dan wel rechtmatig is geproduceerd in een staat
      die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte, en die ten minste aan gelijkwaardige
      technische eisen voldoet.
    url: https://wetten.overheid.nl/BWBR0008805/2008-12-17#Artikel24
  - number: '24.2'
    text: |-
      Met de in dit besluit bedoelde verklaring van goedkeuring wordt gelijkgesteld een verklaring van goedkeuring
      afgegeven door een onafhankelijke keuringsinstelling in een andere lid-staat van de Europese Unie dan wel een staat
      die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte, welke verklaring is afgegeven op
      basis van onderzoekingen die ten minste aan gelijkwaardige eisen voldoen.
    url: https://wetten.overheid.nl/BWBR0008805/2008-12-17#Artikel24
  - number: '25'
    text: |-
      Na de inwerkingtreding van dit besluit berusten krachtens het Besluit alcoholonderzoeken (*Stb.* 1987, 432)
      vastgestelde regels en andere besluiten op dit besluit.
    url: https://wetten.overheid.nl/BWBR0008805/2008-12-17#Artikel25
  - number: '26'
    text: Het Besluit alcoholonderzoeken (*Stb*. 1987, 432) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0008805/2008-12-17#Artikel26
  - number: '27'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin het wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0008805/2008-12-17#Artikel27
  - number: '28'
    text: 'Dit besluit wordt aangehaald als: Besluit alcoholonderzoeken.'
    url: https://wetten.overheid.nl/BWBR0008805/2008-12-17#Artikel28
