articles:
  - number: '1.1'
    text: |-
      In dit besluit wordt verstaan onder: - *ander geluidsgevoelig gebouw:* gebouw met een onderwijsfunctie of
      gezondheidszorgfunctie als bedoeld in [bijlage I bij het Besluit bouwwerken leefomgeving][ref1];
        - *gebouw:* gebouw als bedoeld in de [bijlage bij de Omgevingswet](onbekend);
        - *geluidscontour:* de lijn die punten verbindt waar de geluidsbelasting een gelijke waarde heeft;
        - *geluidszone:* dat deel van het in [artikel 10.17, eerste lid, van de wet][ref2] bedoelde beperkingengebied, dat
      voortvloeit uit de in [artikel 10.17, tweede lid, van de wet][ref3] bedoelde grenswaarde voor de geluidsbelasting;
        - *grenswaarde voor de geluidsbelasting:* grenswaarde voor de geluidsbelasting als bedoeld in
      [artikel 10.12, tweede lid, van de wet][ref4];
        - *helihaven:* luchthaven die permanent is ingericht en uitgerust voor het uitsluitend gebruik door helikopters;
        - *ligplaats:* plaats in het water, bestemd of aangewezen om door een woonschip bij verblijf te worden ingenomen;
        - *obstakelbeheergebied:* dat deel van het in [artikel 10.17, eerste lid, van de wet][ref5] bedoelde
      beperkingengebied, dat voortvloeit uit de in [artikel 10.17, derde lid, onder b, van de wet][ref6] bedoelde regels
      voor de maximale hoogte van objecten;
        - *Onze Minister:* Onze Minister van Defensie;
        - *omgevingsvergunning voor het bouwen:* vergunning als bedoeld in
      [artikel 40, eerste lid, van de Woningwet][ref7], omgevingsvergunning als bedoeld in
      [artikel 2.1, eerste lid, aanhef en onder a, van de Wet algemene bepalingen omgevingsrecht][ref8], dan wel
      omgevingsvergunning als bedoeld in [artikel 5.1, eerste lid, aanhef en onder a, van de Omgevingswet][ref9] voor een
      omgevingsplanactiviteit bestaande uit een bouwactiviteit;
        - *reguliere openstellingstijden:* openstellingstijden van de militaire luchthaven zoals vastgelegd in het
      luchthavenbesluit of de luchthavenregeling;
        - *standplaats:* kavel, bestemd voor het plaatsen van een woonwagen, waarop voorzieningen aanwezig zijn die op het
      leidingnet van de openbare nutsbedrijven, andere instellingen of van gemeenten kunnen worden aangesloten;
        - *tijdstip van vaststelling van de geluidszone:* tijdstip waarop door Onze Minister voor de betrokken militaire
      luchthaven de geluidszone op grond van [artikel 25a van de Luchtvaartwet][ref10] is vastgesteld dan wel de
      geluidszone als onderdeel van het beperkingengebied op grond van [artikel 10.17 van de wet][ref11] is vastgesteld;
        - *VFR-vlucht:* VFR-vlucht als bedoeld in [artikel 1 van het Besluit luchtverkeer 2014][ref12];
        - *wet:* [Wet luchtvaart][ref13].


