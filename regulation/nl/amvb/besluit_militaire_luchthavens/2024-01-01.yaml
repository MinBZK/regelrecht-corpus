    text: |-
      de woning gebouwd is krachtens een omgevingsvergunning voor het bouwen waarvoor de aanvraag bij burgemeester
      en wethouders is ingediend na 14 februari 1983, en de geluidsbelasting in Kosteneenheden volgens de
      geluidscontouren niet zodanig hoger is dan de geluidsbelasting in Kosteneenheden op de datum waarop de
      omgevingsvergunning voor het bouwen is verleend, dat krachtens de onder a bedoelde regeling een zwaardere
      eis aan de onder a bedoelde geluidwering zou gelden dan de eis die op de laatstbedoelde datum gold bij
      toepassing van artikel 8 van het Besluit geluidwering gebouwen, dan wel van [paragraaf 4.3.1][ref1] of
      [artikel 5.5 van het Besluit bouwwerken leefomgeving][ref2];


