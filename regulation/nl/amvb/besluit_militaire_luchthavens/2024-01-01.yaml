    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel6
  - number: 6.4°
    text: voor woningen die ter plaatse dringend noodzakelijk zijn om redenen van locatie- of bedrijfsgebondenheid.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel6
