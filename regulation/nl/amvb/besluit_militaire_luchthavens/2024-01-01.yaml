    references:
      - id: ref1
        bwb_id: BWBR0041297
        paragraaf: 4.3.1
      - id: ref2
        bwb_id: BWBR0041297
        artikel: '5'
  - number: 11.c
    text: |-
      door Onze Minister een aanbod wordt gedaan voor het treffen van zodanige geluidwerende voorzieningen dat voldaan
      wordt aan de onder a bedoelde waarden; of
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel11
  - number: 11.d
    text: |-
      door de eigenaar geen toestemming wordt gegeven voor het uitvoeren van een akoestisch en bouwtechnisch onderzoek
      als bedoeld in de onder a bedoelde regeling.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel11
  - number: '12'
    text: |-
      De maximaal toelaatbare geluidsbelasting van een standplaats die op het tijdstip van vaststelling van de
      geluidszone daarbinnen reeds aanwezig is, is 40 Kosteneenheden.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel12
  - number: '13'
    text: |-
      De maximaal toelaatbare geluidsbelasting van een ligplaats die op het tijdstip van vaststelling van de geluidszone
      daarbinnen reeds aanwezig is, is 40 Kosteneenheden.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel13
  - number: '14.1'
    text: |-
      Ten aanzien van degene die op het tijdstip van vaststelling van de geluidszone rechtmatig gebruiker is van een
      woning, ander geluidsgevoelig gebouw, standplaats of ligplaats als bedoeld in § 2.3.2, kan beëindiging van dit
      gebruik niet worden gevergd.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel14
  - number: '14.2'
    text: |-
      Van rechtmatig gebruik is sprake indien op het tijdstip van vaststelling van de geluidszone op de desbetreffende
      plaats een woning, ander geluidsgevoelig gebouw, standplaats of ligplaats rechtmatig aanwezig is en overeenkomstig
      de oorspronkelijke functie wordt gebruikt, of vóór dat tijdstip een omgevingsvergunning voor het bouwen daarvoor
      is verleend.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel14
  - number: '15'
    text: |-
      Indien op de in [artikel 2, eerste lid, onderdeel a][ref1], genoemde luchthavens een vergunning voor
      burgermedegebruik door tussenkomst van een burgerexploitant is verleend, bedraagt de grenswaarde voor de maximaal
      toelaatbare geluidsbelasting voor het burgerluchtverkeer 35 Kosteneenheden en voor het militaire luchtverkeer 35
      Kosteneenheden.


      [ref1]: https://wetten.overheid.nl/BWBR0025302#Artikel2
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0025302
        artikel: '2'
        hoofdstuk: '1'
  - number: '16.1'
    text: |-
      De maximaal toelaatbare hoogte van objecten in, op of boven de grond, die op 25 juni 2004 niet in het
      obstakelbeheergebied aanwezig waren is, in verband met de veiligheid van het luchthavenluchtverkeer, in
      overeenstemming met de blijkens een in de Staatscourant bekend gemaakte mededeling van Onze Minister van kracht
      zijnde versie van de NATO Standardization Agreement nr. 3759 inzake NATO Supplement to ICAO DOC 8168-OPS/611,
      Volume II, for the preparation of instrument approach and departure Procedures – AATCP-1(B). De eerste volzin is
      niet van toepassing indien:
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel16
  - number: 16.1.a
    text: de omgevingsvergunning voor het bouwen voor het object vóór 25 juni 2004 is verleend, of
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel16
  - number: 16.1.b
    text: |-
      de bouw van het object is voorzien in het bestemmingsplan zoals dat op 25 juni 2004 gold krachtens de
      [Wet ruimtelijke ordening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020449
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0020449
  - number: '16.2'
    text: |-
      De maximaal toelaatbare hoogte van objecten in, op of boven de grond, die op 1 november 2006 niet in het
      obstakelbeheergebied aanwezig waren, is, in verband met de veiligheid van het landen van luchtvaartuigen met behulp
      van een instrument landingssysteem, in overeenstemming met de blijkens een in de Staatscourant bekend gemaakte
      mededeling van Onze Minister van kracht zijnde versie van de ICAO EUR DOC 015. De eerste volzin is niet van
      toepassing indien:
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel16
  - number: 16.2.a
    text: de omgevingsvergunning voor het bouwen voor het object vóór 1 november 2006 is verleend, of
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel16
  - number: 16.2.b
    text: |-
      de bouw van het object is voorzien in het bestemmingsplan zoals dat op 1 november 2006 gold krachtens de
      [Wet ruimtelijke ordening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020449
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0020449
  - number: '16.3'
    text: |-
      Het beeld van de op de luchthaven aanwezige radar mag niet worden verstoord als gevolg van de hoogte van objecten
      in, op of boven de grond. De eerste volzin is niet van toepassing op objecten:
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel16
  - number: 16.3.a
    text: die op 1 november 2006 reeds in het obstakelbeheergebied aanwezig waren;
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel16
  - number: 16.3.b
    text: waarvoor de omgevingsvergunning voor het bouwen vóór die datum is verleend, of
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel16
  - number: 16.3.c
    text: |-
      waarvan de bouw is voorzien in het bestemmingsplan zoals dat op 1 november 2006 gold krachtens de
      [Wet ruimtelijke ordening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020449
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0020449
  - number: '16.4'
    text: |-
      Afwijking van het tweede en derde lid wordt toegestaan indien uit een daartoe uitgevoerd onderzoek blijkt dat de
      beïnvloeding van het instrument landingssysteem onderscheidenlijk het radarbeeld uit oogpunt van de veiligheid van
      het luchtverkeer aanvaardbaar is.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel16
  - number: '16.5'
    text: Het in het vierde lid genoemde onderzoek wordt op een daartoe strekkende verzoek uitgevoerd door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel16
  - number: '16.6'
    text: |-
      De in het eerste en tweede lid bedoelde versies liggen ter inzage op de bij de betrokken mededeling aangegeven
      locatie.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel16
  - number: '17.1'
    text: |-
      Het militair luchtverkeer op of boven militaire luchthavens mag onder geen omstandigheden worden gehinderd door
      de burgerluchtvaart.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel17
  - number: '17.2'
    text: |-
      De gezagvoerders van landende, opstijgende, taxiënde en parkerende burgerluchtvaartuigen gedragen
      zich stipt overeenkomstig de aanwijzingen die met betrekking tot het luchtverkeer door de plaatselijke
      luchtverkeersleidingsdiensten worden gegeven.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel17
  - number: '18.1'
    text: |-
      In het belang van de uitvoering van de militaire taak kan de commandant van de militaire luchthaven aanwijzingen
      aan de burgerluchtvaart geven omtrent het gebruik van de militaire luchthaven.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel18
  - number: '18.2'
    text: |-
      De commandant kan in geval van militaire oefeningen of onvoorziene omstandigheden bepalen dat de burgerluchtvaart
      tijdelijk geen gebruik maakt van de militaire luchthaven.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel18
  - number: '18.3'
    text: |-
      Het landen, taxiën, parkeren, stallen, opstijgen, experimenteren en demonstreren mag slechts geschieden op of van
      die gedeelten van het terrein die daartoe door de commandant worden aangewezen.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel18
  - number: '18.4'
    text: |-
      Bij niet nakoming van de door de commandant gegeven aanwijzingen kan de commandant de toegang tot de luchthaven
      ontzeggen dan wel beperkingen of een tijdelijk verbod opleggen voor wat betreft het gebruik van de luchthaven.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel18
  - number: '19'
    text: De militaire luchthaven wordt op behoorlijke wijze gebruikt door het burgerluchtverkeer.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel19
  - number: '20'
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel20
  - number: 20.a
    text: |-
      *recreatieve burgerluchtvaart:* het beoefenen van de luchtvaart in de vorm van zweefvliegen, sleepvliegen,
      motorsportvliegen, modelvliegen of zeilvliegen;
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel20
  - number: 20.b
    text: '*zweefvliegen:* vliegen met een zweefvliegtuig of een motorzweefvliegtuig;'
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel20
  - number: 20.c
    text: '*sleepvliegen:* vliegen met een als sleepvliegtuig ingericht motorvliegtuig voor:'
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel20
  - number: 20.c.1°
    text: vluchten voor het opslepen van zweefvliegtuigen;
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel20
  - number: 20.c.2°
    text: controlevluchten die noodzakelijkerwijs vóór de aanvang van het daadwerkelijk sleepvliegen moeten worden verricht;
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel20
  - number: 20.c.3°
    text: |-
      vluchten, al dan niet slepend, van en naar een andere luchthaven dan dat van stationering voor het overslepen van
      zweefvliegtuigen;
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel20
  - number: 20.c.4°
    text: |-
      vluchten voor het overbrengen van het sleepvliegtuig van en naar een andere luchthaven dan dat van stationering
      teneinde het aldaar in te zetten of er onderhoud aan te verrichten;
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel20
  - number: 20.d
    text: |-
      *motorsportvliegen:* niet beroepsmatig vliegen met een vastevleugelvliegtuig met schroefaandrijving, met inbegrip
      van ultralichte vliegtuigen, waarbij de vlucht uitsluitend het karakter van een sportvlucht draagt;
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel20
  - number: 20.e
    text: |-
      *modelvliegen:* gecontroleerd modelvliegen met modelluchtvaartuigen met een totale startmassa van ten hoogste 25
      kg;
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel20
  - number: 20.f
    text: |-
      *zeilvliegen:* vliegen met een zweeftoestel met starre hoofdstructuur, dat kan worden gedragen en slechts kan
      worden gestart en geland door gebruik te maken van de benen van de bestuurder.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel20
  - number: '21.1'
    text: 'Recreatieve burgerluchtvaart is niet toegestaan:'
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel21
  - number: 21.1.a
    text: buiten de uniforme daglichtperiode;
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel21
  - number: 21.1.b
    text: vóór 8:00 uur lokale tijd.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel21
  - number: '21.2'
    text: Sleepvliegen is niet toegestaan vóór 12:00 uur op zondag en op christelijke feestdagen.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel21
  - number: '22.1'
    text: |-
      Recreatieve burgerluchtvaart wordt uitsluitend beoefend in aanwezigheid van een voor de betrokken vorm van
      recreatieve burgerluchtvaart bevoegde coördinator als bedoeld in [artikel 23, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025302#Artikel23
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0025302
        artikel: '23'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '22.2'
    text: |-
      Onverminderd het eerste lid wordt recreatieve burgerluchtvaart buiten de reguliere openstellingstijden van de
      betrokken luchthaven uitsluitend beoefend in aanwezigheid van een hoofdvliegcoördinator.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel22
  - number: '22.3'
    text: |-
      Indien meerdere verenigingen op de luchthaven tegelijkertijd een zelfde vorm van recreatieve burgerluchtvaart
      beoefenen, treedt één van de voor die vorm aangewezen coördinatoren als bedoeld in het eerste lid op als
      coördinator voor het geheel van die vorm van recreatieve burgerluchtvaart.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel22
  - number: '23.1'
    text: |-
      De commandant van de luchthaven wijst afhankelijk van de op de betrokken luchthaven beoefende vormen van
      recreatieve burgerluchtvaart de volgende coördinatoren aan:
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel23
  - number: 23.1.a
    text: 'voor het zweefvliegen met inbegrip van het sleepvliegen: een zweefvliegcoördinator,'
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel23
  - number: 23.1.b
    text: 'voor het motorsportvliegen: een motorsportvliegcoördinator,'
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel23
  - number: 23.1.c
    text: 'voor het modelvliegen: een modelvliegcoördinator,'
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel23
  - number: 23.1.d
    text: 'voor het zeilvliegen: een zeilvliegcoördinator.'
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel23
  - number: '23.2'
    text: |-
      Indien recreatieve burgerluchtvaart wordt beoefend buiten de reguliere openstellingstijden van de betrokken
      luchthaven, wijst de commandant tevens een of meer hoofdvliegcoördinatoren aan.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel23
  - number: '23.3'
    text: |-
      De coördinator is voor de vorm van recreatieve burgerluchtvaart waarvoor hij als coördinator is aangewezen belast
      met:
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel23
  - number: 23.3.a
    text: het houden van toezicht op het juiste en veilige gebruik van de luchthaven,
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel23
  - number: 23.3.b
    text: het geven van leiding aan de beoefening van de recreatieve burgerluchtvaart.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel23
  - number: '23.4'
    text: |-
      De hoofdvliegcoördinator is buiten de openstellingstijden van de luchthaven belast met de algehele leiding over
      en het algemeen toezicht op de totale recreatieve burgerluchtvaart op de militaire luchthaven, alsmede met de
      inzet van hulpdiensten in geval van calamiteiten. Bij zijn taakvervulling neemt hij de door de commandant van de
      luchthaven gegeven aanwijzingen in acht.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel23
  - number: '23.5'
    text: |-
      Voor de functie van coördinator of hoofdvliegcoördinator komt uitsluitend in aanmerking degene die voldoet aan de
      bij regeling van Onze Minister voor de betrokken coördinator gestelde eisen met betrekking tot kennis, ervaring
      en geschiktheid.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel23
  - number: '23.6'
    text: |-
      De commandant van de luchthaven is bevoegd tot intrekking of schorsing van de aanwijzing tot coördinator of
      hoofdvliegcoördinator, indien betrokkene niet meer aan de ingevolge het vijfde lid gestelde eisen voldoet of zich
      schuldig maakt aan wangedrag.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel23
  - number: '24.1'
    text: |-
      De beoefenaars van recreatieve burgerluchtvaart gedragen zich stipt overeenkomstig de aanwijzingen die door de
      betrokken coördinator worden gegeven.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel24
  - number: '24.2'
    text: |-
      De coördinator volgt voor de uitoefening van zijn taak binnen de openstellingtijden de aanwijzingen van de
      commandant. Buiten de openstellingtijden volgt hij voor de uitoefening van zijn taak de aanwijzingen van de
      hoofdvliegcoördinator.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel24
  - number: '24.3'
    text: |-
      Indien slechts één vorm van recreatieve burgerluchtvaart wordt uitgeoefend op de luchthaven, wordt de functie
      van hoofdvliegcoördinator vervuld door de voor de betrokken vorm van recreatieve burgerluchtvaart aangewezen
      coördinator.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel24
  - number: '25'
    text: |-
      Onverminderd [artikel 21][ref1] kan de recreatieve burgerluchtvaart buiten de reguliere openstellingtijden van de
      betrokken luchthaven gebruik maken van de luchthaven, indien wordt voldaan aan de volgende voorwaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0025302#Artikel21
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0025302
        artikel: '21'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 25.a
    text: een hoofdvliegcoördinator is aanwezig;
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel25
  - number: 25.b
    text: |-
      binnen het plaatselijk verkeersgebied wordt uitsluitend gevlogen overeenkomstig de voor VFR-vluchten geldende
      bepalingen van uitvoeringsverordening (EU) nr. 923/2012 van de Commissie van 26 september 2012 tot vaststelling
      van gemeenschappelijke luchtverkeersregels en operationele bepalingen betreffende luchtvaartnavigatiediensten en
      -procedures en tot wijziging van uitvoeringsverordening (EU) nr. 1035/2011 en verordeningen (EG) nr. 1265/2007,
      (EG) 1794/2006, (EG) nr. 730/2006, (EG) nr. 1033/2006 en (EU) nr. 255/2010 (PbEU 2012, L281) en het [Besluit
      luchtverkeer 2014](onbekend);
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel25
  - number: 25.c
    text: |-
      de terreingedeeltes en verkeerscircuits voor zweefvliegen, sleepvliegen, motorsportvliegen, modelvliegen en
      zeilvliegen zijn geheel van elkaar gescheiden, waarbij voor motorsportvliegen het circuit voor ultralichte
      vliegtuigen gescheiden is van de overige motorsportvliegtuigen;
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel25
  - number: 25.d
    text: in een verkeerscircuit voor motorsportvliegen bevinden zich maximaal drie vliegtuigen.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel25
  - number: '26.1'
    text: |-
      Op een militaire luchthaven zijn maximaal twee sleepvliegtuigen gestationeerd. In incidentele gevallen kan,
      na verkregen toestemming van de commandant, het aantal van twee sleepvliegtuigen tijdelijk worden verhoogd tot
      maximaal vier.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel26
  - number: '26.2'
    text: De sleepvlieger volgt de aanwijzingen van de zweefvliegcoördinator betreffende het zweefvliegen.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel26
  - number: '26.3'
    text: |-
      Er wordt niet gestart of geland met een sleepvliegtuig vanaf of op een militaire luchthaven anders dan voor
      sleepvliegen.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel26
  - number: '26.4'
    text: |-
      Tijdens sleepvliegen worden geen passagiers medegevoerd met dien verstande dat het is toegestaan dat tijdens
      controlevluchten als bedoeld in [artikel 20, onder c, onderdeel 2][ref1], een tweede bevoegd sleepvlieger meevliegt
      en dat tijdens de in [artikel 20, eerste lid, onder c, onderdeel 3][ref2], bedoelde vluchten, gedurende het
      vluchtgedeelte dat niet daadwerkelijk wordt gesleept, de bestuurder van het over te slepen zweefvliegtuig wordt
      meegevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0025302#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0025302#Artikel20
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0025302
