      van de geluidszone daarbinnen reeds aanwezig is of nog niet aanwezig is maar waarvoor de omgevingsvergunning voor
      het bouwen is verleend.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel8
