           en waarin het teken «L» staat voor het maximaal geluidsniveau in dB(A) dat voor een passerend luchtvaartuig
      ter plaatse in de buitenlucht wordt of kan worden gemeten.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel3
  - number: '4'
    text: |-
      Voor de in [artikel 2, eerste lid, onderdeel a][ref1], genoemde luchthavens is de grenswaarde voor de maximaal
      toelaatbare geluidsbelasting buiten de geluidszone 35 Kosteneenheden.


      [ref1]: https://wetten.overheid.nl/BWBR0025302#Artikel2
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel4
