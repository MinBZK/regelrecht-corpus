  - number: '27'
    text: |-
      Buiten de reguliere openstellingtijden vinden geen vluchten met motorsportvliegtuigen plaats van of naar militaire
      luchthavens.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel27
  - number: '28'
    text: |-
      Burgerluchtvaart die een algemeen maatschappelijk belang dient, kan buiten de reguliere openstellingtijden van de
      betrokken militaire luchthaven gebruik maken van die luchthaven, indien wordt voldaan aan de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel28
  - number: 28.a
    text: |-
      de vlucht wordt uitgevoerd met een helikopter of met een vaste-vleugelvliegtuig met schroefaandrijving en met een
      massa van ten hoogste 6000 kg;
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel28
  - number: 28.b
    text: |-
      binnen het plaatselijk verkeersgebied wordt uitsluitend gevlogen overeenkomstig de voor VFR-vluchten geldende
      bepalingen van uitvoeringsverordening (EU) nr. 923/2012 van de Commissie van 26 september 2012 tot vaststelling
      van gemeenschappelijke luchtverkeersregels en operationele bepalingen betreffende luchtvaartnavigatiediensten en
      -procedures en tot wijziging van uitvoeringsverordening (EU) nr. 1035/2011 en verordeningen (EG) nr. 1265/2007,
      (EG) 1794/2006, (EG) nr. 730/2006, (EG) nr. 1033/2006 en (EU) nr. 255/2010 (PbEU 2012, L281) en het [Besluit
      luchtverkeer 2014](onbekend);
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel28
  - number: 28.c
    text: gebruik wordt gemaakt van daarvoor door de commandant van de luchthaven aangewezen routes;
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel28
  - number: 28.d
    text: |-
      in het bijzonder wordt rekening gehouden met eventueel op of boven de luchthaven plaats vindende recreatieve
      luchtvaart.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel28
  - number: '29'
    text: |-
      Bij regeling van Onze Minister kunnen met betrekking tot het gebruik van de luchthaven door de burgerluchtvaart
      nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel29
  - number: '30'
    text: |-
      Dit hoofdstuk is van toepassing op de ingevolge [artikel 2, eerste lid, onderdeel b][ref1], aangewezen helihavens.


      [ref1]: https://wetten.overheid.nl/BWBR0025302#Artikel2
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0025302
        artikel: '2'
        hoofdstuk: '1'
  - number: '31.1'
    text: |-
      De aanleg, inrichting en uitrusting van een helihaven zijn zodanig dat helikopters daarvan een veilig gebruik
      kunnen maken.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel31
  - number: '31.2'
    text: De helihaven is vrij van hindernissen en zodanig afgezet dat hij bij gebruik vrij van publiek is.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel31
  - number: '31.3'
    text: |-
      De in- en uitvliegsectoren zijn zodanig dat helikopters veilig kunnen landen en opstijgen en dat de overlast voor
      de omwonenden minimaal is.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel31
  - number: '31.4'
    text: |-
      Op of in de onmiddellijke nabijheid van een helihaven zijn voldoende en deugdelijke reddings- en brandblusmiddelen
      aanwezig voor het redden van mensenlevens en de bestrijding van vliegtuigbranden, alsmede voldoende en ter zake
      kundig personeel voor de bediening van deze middelen.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel31
  - number: '32.1'
    text: |-
      Alvorens een helihaven door een helikopter mag worden gebruikt, moet toestemming zijn verkregen van de beheerder
      van de helihaven.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel32
  - number: '32.2'
    text: 'De beheerder van de helihaven zorgt ervoor dat:'
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel32
  - number: 32.2.a
    text: van de helihaven een veilig gebruik kan worden gemaakt;
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel32
  - number: 32.2.b
    text: |-
      maatregelen worden genomen voor een behoorlijk toezicht op de veiligheid en goede orde op de helihaven tijdens het
      gebruik van helikopters;
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel32
  - number: 32.2.c
    text: het gebruik van helikopters op de helihaven in een register wordt vastgelegd;
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel32
  - number: 32.2.d
    text: passagiers onder geleide van daartoe bevoegd personeel naar en van de helikopter worden geleid;
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel32
  - number: 32.2.e
    text: |-
      de ten behoeve van het gebruik door helikopters op de helihaven voorgeschreven uitrusting in bedrijfszekere
      toestand verkeert en het in te zetten personeel op die helihaven voor haar taak berekend is.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel32
  - number: '32.3'
    text: 'In het register, bedoeld in het tweede lid, onderdeel c, worden in ieder geval de volgende gegevens vermeld:'
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel32
  - number: 32.3.a
    text: het nationaliteits- en inschrijvingskenmerk alsmede het type helikopter;
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel32
  - number: 32.3.b
    text: datum en tijdstip van aankomst en vertrek.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel32
  - number: '32.4'
    text: |-
      Elk kwartaal dient een kopie van het register, bedoeld in het tweede lid, onderdeel c, te worden gezonden aan de
      Militaire Luchtvaart Autoriteit.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel32
  - number: '33.1'
    text: |-
      Het verkeerscircuit, de routering, de snelheid en de hoogte van vertrekkende en binnenkomende helikopters zijn
      zodanig gekozen, dat het optreden van vermijdbare geluidhinder, met name in de bebouwde kommen en in de omgeving
      van bijzondere bebouwing, zoals ziekenhuizen en sanatoria, wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel33
  - number: '33.2'
    text: Het gebruik van de helihaven tussen de uren van 22:00 en 06:00 wordt zoveel mogelijk voorkomen.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel33
  - number: '34'
    text: |-
      Met betrekking tot de geluidsbelasting door militaire luchtvaartuigen zijn de prestatiegegevens met bijbehorend
      geselecteerd motorvermogen van die luchtvaartuigen niet openbaar.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel34
  - number: '35'
    text: |-
      De vergunning voor medegebruik wordt niet verleend aan een rechtspersoon die doelen nastreeft of een relatie heeft
      met organisaties of verbanden die doelen nastreven die niet verenigbaar zijn met de taken van het Ministerie van
      Defensie.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel35
  - number: '36.1'
    text: Het overdragen van een vergunning voor burgermedegebruik behoeft de toestemming van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel36
  - number: '36.2'
    text: Onze Minister beslist binnen vier weken omtrent de toestemming.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel36
  - number: '36.3'
    text: De beslissing kan eenmaal voor ten hoogste vier weken worden verdaagd.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel36
  - number: 36a
    text: |-
      [Artikel 34][ref1] van dit besluit, zoals dat artikel luidde vóór 1 januari 2017, blijft ten aanzien van de in
      dat artikel genoemde gegevens met betrekking tot de geluidsbelasting van toepassing op de periode voorafgaande aan
      dat tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0025302#Artikel34
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0025302
        artikel: '34'
        hoofdstuk: '6'
  - number: '37'
    text: |-
      De artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillenden artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel37
  - number: '38'
    text: 'Dit besluit wordt aangehaald als: Besluit militaire luchthavens.'
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel38
