  - number: '2.2'
    text: Voor de in het eerste lid, onderdeel a, genoemde luchthavens is vaststelling van een luchthavenbesluit vereist.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel2
  - number: '3.1'
    text: |-
      De geluidsbelasting door landende en opstijgende luchtvaartuigen, bedoeld in
      [artikel 10.12, tweede lid, van de wet][ref1], wordt uitgedrukt in Kosteneenheden.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '10'
  - number: '3.2'
    text: |-
      De geluidsbelasting in Kosteneenheden, bedoeld in het eerste lid, op een bepaalde plaats, veroorzaakt door
      de gezamenlijke op een luchthaven landende en opstijgende luchtvaartuigen met een toegelaten totaalmassa van
      ten minste 6000 kg dan wel minder dan 6000 kg maar meer dan 390 kg, voor zover dit vaste-vleugelvliegtuigen
      met straalaandrijving en helikopters betreft, dan wel deze luchtvaartuigen gebruik maken van dezelfde aan- en
      uitvliegroutes als de luchtvaartuigen van ten minste 6000 kg, dan wel de vliegpatronen van deze luchtvaartuigen
      overeenkomen met die van luchtvaartuigen van ten minste 6000 kg, wordt vastgesteld volgens de formule:
      geluidsbelasting = 20xlog(Σ nx10L/15)-157, waarin het teken «Σ » staat voor de optelling van de bijdragen van
      alle luchtvaartuigen die ter plaatse voorbij vliegen in een periode van een jaar en waarin het teken «n» staat
      voor een factor gelijk aan 1 gedurende de periode van 8.00 tot 18.00 uur en voor de verdere tijdsperiode volgens
      onderstaande tabel:







