  - number: '5.1'
    text: |-
      De maximaal toelaatbare geluidsbelasting van woningen en andere geluidsgevoelige gebouwen die op het tijdstip van
      vaststelling van de geluidszone daarbinnen nog niet aanwezig zijn en waarvoor nog geen omgevingsvergunning voor het
      bouwen is verleend, is 35 Kosteneenheden.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel5
  - number: '5.2'
    text: |-
      De maximaal toelaatbare geluidsbelasting van standplaatsen en ligplaatsen die op het tijdstip van vaststelling van
      de geluidszone daarbinnen nog niet aanwezig zijn, is 35 Kosteneenheden.
    url: https://wetten.overheid.nl/BWBR0025302/2024-01-01#Artikel5
  - number: '6'
    text: |-
      In afwijking van [artikel 5, eerste lid][ref1], is de maximaal toelaatbare geluidsbelasting van woningen en andere
      geluidsgevoelige gebouwen als bedoeld in [dat artikel][ref2] 45 Kosteneenheden:


