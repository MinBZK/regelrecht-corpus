preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Binnenlandse Zaken van 13 oktober 1988, nr. CW88/198/U1, Stafafdeling
    Constitutionele Zaken en Wetgeving, gedaan in overeenstemming met het gevoelen van de Ministerraad;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004419/1989-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Bij elk ministerie is een secretaris-generaal die, met inachtneming van de aanwijzingen van Onze Minister, belast
      met de leiding van het ministerie, belast is met de ambtelijke leiding van al hetgeen het ministerie betreft.
    url: https://wetten.overheid.nl/BWBR0004419/1989-01-01#Artikel1
  - number: '2'
    text: Het koninklijk besluit van 14 december 1966, nr. 5 (*Stcrt.* 252) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004419/1989-01-01#Artikel2
