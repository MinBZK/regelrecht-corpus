        paragraaf: '3'
  - number: '8.1'
    text: |-
      Het aspect diagnostiek en behandeling is zo ingericht dat betrokkene in staat is om in het kader van diagnostiek
      en behandeling, volgens de vigerende beroeps- en gezondheidszorgstandaarden, op methodische wijze de volgende
      interventies voor te bereiden, uit te voeren, te evalueren, bij te stellen en af te ronden:
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel8
  - number: 8.1.a
    text: het in het kader van het ergotherapeutische onderzoek bij de patiënt afnemen van een anamnese;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel8
  - number: 8.1.b
    text: het stellen van een ergotherapeutische diagnose;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel8
  - number: 8.1.c
    text: het opstellen van een behandelplan of advies;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel8
  - number: 8.1.d
    text: |-
      het op methodische wijze adviseren aan opdrachtgevers over zorg of begeleiding, hulpmiddelen, voorzieningen of
      arbeidsomstandigheden met als doel de handelingscompetentie van de patiënt te bevorderen en te behouden, zodat op
      indirecte wijze een bijdrage wordt geleverd aan gezondheid en welzijn van de patiënt;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel8
  - number: 8.1.e
    text: |-
      het ontwerpen of vervaardigen of aanpassen van producten, voorzieningen of hulpmiddelen, gericht op wonen, werken,
      zorg, vrije tijdsbesteding en spel, als deze niet leverbaar of in hun oorspronkelijke vorm niet bruikbaar zijn voor
      de patiënt;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel8
  - number: 8.1.f
    text: het met behulp van ICT vastleggen van de aan de patiënt te bieden zorg;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel8
  - number: 8.1.g
    text: het met andere zorgverleners waarborgen van effectieve en efficiënte ergotherapeutische zorg;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel8
  - number: 8.1.h
    text: het zo nodig terugverwijzen naar de arts.
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel8
  - number: '8.2'
    text: 'Het aspect communicatie en samenwerking is zo ingericht dat betrokkene in staat is om:'
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel8
  - number: 8.2.a
    text: |-
      effectief te communiceren met de patiënt en, in daarvoor in aanmerking komende gevallen, met diens naaste
      betrekkingen;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel8
  - number: 8.2.b
    text: |-
      in het kader van formele relaties intern en extern te communiceren met andere beroepsbeoefenaren in de
      gezondheidszorg of instanties in de gezondheidszorg;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel8
  - number: 8.2.c
    text: |-
      een functionele samenwerkingsrelatie met de patiënt en diens naaste betrekkingen aan te gaan, te onderhouden en af
      te ronden;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel8
  - number: 8.2.d
    text: met andere beroepsbeoefenaren in de gezondheidszorg in en buiten de organisatie professioneel samen te werken.
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel8
  - number: '8.3'
    text: 'Het aspect preventie en gezondheidsvoorlichting is zo ingericht dat betrokkene in staat is om:'
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel8
  - number: 8.3.a
    text: in het kader van preventie voorlichting te geven aan de patiënt ter zake van gezondheidsbevorderend gedrag;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel8
  - number: 8.3.b
    text: |-
      in het kader van therapietrouw en gedragsverandering de patiënt tijdens de behandeling op methodische wijze voor
      te lichten.
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel8
  - number: '8.4'
    text: 'Het aspect kwaliteitszorg en innovatie is zo ingericht dat betrokkene in staat is om:'
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel8
  - number: 8.4.a
    text: |-
      de eigen zorg- en dienstverlening op effectiviteit en efficiëntie te analyseren, daaraan conclusies te verbinden en
      deze zo nodig planmatig te verbeteren;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel8
  - number: 8.4.b
    text: aan de patiënt verantwoording af te leggen over effectiviteit en efficiëntie van het eigen professionele handelen;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel8
  - number: 8.4.c
    text: |-
      een bijdrage te leveren aan de kwaliteit van de zorg- en dienstverlening binnen de organisatie en in dat kader de
      zorg- en dienstverlening op effectiviteit en efficiëntie te analyseren en daaraan conclusies te verbinden;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel8
  - number: 8.4.d
    text: algemeen maatschappelijke en beroepsspecifieke innovaties te integreren in het eigen professionele handelen.
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel8
  - number: '8.5'
    text: 'Het aspect praktijk- en bedrijfsvoering is zo ingericht dat betrokkene in staat is om:'
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel8
  - number: 8.5.a
    text: |-
      vanuit een zorgperspectief een bijdrage te leveren aan het zorgbeleid, de praktijkvoering en het beheer van de
      afdeling dan wel organisatie;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel8
  - number: 8.5.b
    text: |-
      met anderen tot een effectieve, efficiënte en hygiënische praktijk- en bedrijfsvoering te komen, zo mogelijk met
      behulp van ICT;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel8
  - number: 8.5.c
    text: |-
      effectief leergedrag bij stagiaires en nieuwe collega’s te stimuleren, zodat beginnende ergotherapeuten op
      professionele wijze bijdragen aan het realiseren van de doelstellingen van de organisatie;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel8
  - number: 8.5.d
    text: |-
      middelen en materialen te beheren, zodat de dienstverlening aan de patiënt vanuit de organisatie effectief en
      efficiënt verloopt;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel8
  - number: 8.5.e
    text: nieuw beleid te volgen en te initiëren zodat de dienstverlening in de toekomst gewaarborgd wordt.
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel8
  - number: '8.6'
    text: 'Het aspect beroepsontwikkeling is zo ingericht dat betrokkene in staat is om:'
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel8
  - number: 8.6.a
    text: |-
      het beroep uit te oefenen overeenkomstig de geldende professionele richtlijnen, de stand van de wetenschap en de
      geldende waarden en opvattingen die patiëntengroepen hebben ten aanzien van ergotherapeutische zorg;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel8
  - number: 8.6.b
    text: ethische vraagstukken die zich voordoen bij de ergotherapeutische handelingen te onderkennen en hanteren;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel8
  - number: 8.6.c
    text: |-
      te handelen vanuit een juist begrip van wettelijke regelingen en andere regelingen betreffende de
      ergotherapeutische beroepsuitoefening;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel8
  - number: 8.6.d
    text: |-
      te handelen vanuit een juist inzicht in de epidemiologie en de behoefte aan ergotherapeutische zorg van de
      bevolking als geheel en de daartoe te hanteren verzorgingsmogelijkheden, zowel collectief als individueel;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel8
  - number: 8.6.e
    text: |-
      prioriteiten te stellen voor het verlenen van ergotherapeutische zorg in overeenstemming met de beschikbare
      middelen, de behandelingsnoodzaak en de eigen vraag naar zorg van de patiënt;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel8
  - number: 8.6.f
    text: |-
      te handelen vanuit een juist inzicht in de structuur en financiering van de gezondheidszorg gericht op de
      ergotherapeutische zorg;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel8
  - number: 8.6.g
    text: |-
      op een wetenschappelijke en effectieve manier informatie te verwerven, te verwerken en toe te passen in het
      beroepsmatige handelen;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel8
  - number: 8.6.h
    text: te reflecteren op het eigen beroepsmatige handelen en dit op basis hiervan verder te ontwikkelen;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel8
  - number: 8.6.i
    text: |-
      de eigen professionaliteit voortdurend te ontwikkelen op basis van nieuwe situaties in de samenleving of het
      beroepsdomein;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel8
  - number: 8.6.j
    text: anderen te begeleiden in hun beroepsontwikkeling;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel8
  - number: 8.6.k
    text: bij te dragen aan de ontwikkeling van de professie.
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel8
  - number: '9'
    text: 'Tot het gebied van deskundigheid van de ergotherapeut wordt gerekend:'
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel9
  - number: 9.a
    text: |-
      het herkennen van risicofactoren en symptomen bij de patiënt die wijzen op de mogelijke aanwezigheid van een
      aandoening waarvoor deskundigheid van een andere discipline gewenst of noodzakelijk is en bij constatering daarvan
      verwijzen naar die andere discipline;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel9
  - number: 9.b
    text: |-
      het onderzoeken van de patiënt of en in hoeverre de vermogens of vaardigheden aanwezig zijn om handelingen te
      verrichten, ontleend aan het dagelijkse leven of aan de arbeid, en het op basis van de verkregen gegevens opstellen
      van een behandelplan;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel9
  - number: 9.c
    text: |-
      het behandelen van de patiënt met als doel het opheffen, verminderen of compenseren van lichamelijke of psychische
      stoornissen, beperkingen of handicaps door het doen verkrijgen of optimaliseren van vaardigheden vereist voor
      het verrichten van handelingen als bedoeld onder a, of door het geven van informatie, instructie en advies aan
      de patiënt en in daarvoor in aanmerking komende gevallen aan diens naaste betrekkingen, strekkende tot het zo
      zelfstandig mogelijk functioneren van de patiënt in diens leef-, woon- of werksituatie;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel9
  - number: 9.d
    text: |-
      het in daarvoor in aanmerking komende gevallen vervaardigen voor de patiënt van hulpmiddelen of het adviseren van
      de patiënt over te treffen voorzieningen in of aanpassingen van diens leef-, woon- of werksituatie, in het kader
      van de behandeling bedoeld onder b;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel9
  - number: 9.e
    text: |-
      het geven van advies, voorlichting en instructie aan een persoon, met als doel belemmeringen in het zelfstandig
      functioneren in leef-, woon- of werksituatie te voorkomen.
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel9
  - number: '10'
    text: |-
      Het recht tot het voeren van de titel van logopedist is voorbehouden aan degene aan wie een getuigschrift is
      uitgereikt waaruit blijkt dat betrokkene met goed gevolg het afsluitende examen heeft afgelegd van een opleiding
      voor logopedie die is opgenomen in de Registratie instellingen en opleidingen en die voldoet aan het in de
      [artikelen 11][ref1] en [12][ref2] gestelde.


      [ref1]: https://wetten.overheid.nl/BWBR0008975#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0008975#Artikel12
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel10
    references:
