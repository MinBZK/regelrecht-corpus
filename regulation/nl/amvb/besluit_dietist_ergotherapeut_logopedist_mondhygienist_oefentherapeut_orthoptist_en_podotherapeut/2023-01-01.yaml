        paragraaf: '2'
  - number: '11.1'
    text: |-
      De opleiding tot logopedist, bedoeld in [artikel 10][ref1], omvat zowel theoretisch als praktisch onderwijs, dat
      gericht is op het verwerven van kennis van en inzicht en vaardigheid in de volgende aspecten van de logopedische
      beroepsuitoefening die betrekking hebben op het gebied van deskundigheid, bedoeld in [artikel 13][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0008975#Artikel10
