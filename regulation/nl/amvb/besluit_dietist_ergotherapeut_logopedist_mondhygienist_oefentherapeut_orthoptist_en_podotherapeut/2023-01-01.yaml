  - number: 1.a
    text: |-
      Registratie instellingen en opleidingen: het register als bedoeld in
      [artikel 6.13 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel1
