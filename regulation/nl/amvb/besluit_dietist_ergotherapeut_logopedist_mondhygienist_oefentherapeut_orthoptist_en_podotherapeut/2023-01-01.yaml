  - number: '19.2'
    text: |-
      Het praktische onderwijs omvat in ieder geval stages in het werkveld inzake het toepassen van tijdens de
      studie verworven kennis, inzicht en vaardigheden met betrekking tot het gebied van deskundigheid, bedoeld in
      [artikel 21][ref1], onder toezicht van een oefentherapeut.


      [ref1]: https://wetten.overheid.nl/BWBR0008975#Artikel21
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0008975
        artikel: '21'
        hoofdstuk: VI
        paragraaf: '3'
  - number: '20.1'
    text: |-
      Het aspect diagnostiek en behandeling is zo ingericht dat betrokkene in staat is om in het kader van diagnostiek
      en behandeling, volgens de vigerende beroeps- en gezondheidszorgstandaarden, op methodische wijze de volgende
      interventies voor te bereiden, uit te voeren, te evalueren, bij te stellen en af te ronden:
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel20
  - number: 20.1.a
    text: het in het kader van het oefentherapeutische onderzoek bij de patiënt afnemen van een anamnese;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel20
  - number: 20.1.b
    text: het stellen van een oefentherapeutische diagnose, opstellen van een behandelplan of behandeladvies;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel20
  - number: 20.1.c
    text: het zo nodig afstemmen met andere disciplines;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel20
  - number: 20.1.d
    text: het registreren en evalueren van behandelgegevens;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel20
  - number: 20.1.e
    text: het met andere zorgverleners waarborgen van effectieve en efficiënte oefentherapeutische zorg;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel20
  - number: 20.1.f
    text: het zo nodig verwijzen naar een andere zorgverlener.
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel20
  - number: '20.2'
    text: 'Het aspect communicatie en samenwerking is zo ingericht dat betrokkene in staat is om:'
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel20
  - number: 20.2.a
    text: |-
      effectief te communiceren met de patiënt en, in daarvoor in aanmerking komende gevallen, met diens naaste
      betrekkingen;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel20
  - number: 20.2.b
    text: |-
      in het kader van formele relaties, intern en extern te communiceren met andere beroepsbeoefenaren in de
      gezondheidszorg of instanties in de gezondheidszorg;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel20
  - number: 20.2.c
    text: een functionele samenwerkingsrelatie met de patiënt aan te gaan, te onderhouden en af te ronden;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel20
  - number: 20.2.d
    text: met andere beroepsbeoefenaren in de gezondheidszorg in en buiten de organisatie professioneel samen te werken.
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel20
  - number: '20.3'
    text: 'Het aspect preventie en gezondheidsvoorlichting is zodanig ingericht dat betrokkene in staat is om:'
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel20
  - number: 20.3.a
    text: |-
      in het kader van preventie en gezondheidsvoorlichting voor diverse doelgroepen adviezen en oefenprogramma’s te
      ontwikkelen, uit te voeren en te evalueren met betrekking tot houdings- en bewegingsgedrag;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel20
  - number: 20.3.b
    text: in het kader van preventie doelgerichte voorlichting te geven aan een persoon met gezondheidsbevordering als doel;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel20
  - number: 20.3.c
    text: |-
      in het kader van therapietrouw en veranderingen ten aanzien van houdings- en bewegingsgedrag de patiënt tijdens de
      behandeling op methodische wijze voor te lichten en te begeleiden.
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel20
  - number: '20.4'
    text: 'Het aspect kwaliteitszorg en innovatie is zo ingericht dat betrokkene in staat is om:'
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel20
  - number: 20.4.a
    text: |-
      de eigen zorg- en dienstverlening op effectiviteit en efficiëntie te analyseren, daaraan conclusies te verbinden,
      en deze zo nodig planmatig te verbeteren;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel20
  - number: 20.4.b
    text: aan de patiënt verantwoording af te leggen over effectiviteit en efficiëntie van het eigen professionele handelen;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel20
  - number: 20.4.c
    text: |-
      een bijdrage te leveren aan de kwaliteit van de zorg- en dienstverlening binnen de organisatie en in dat kader de
      zorg- en dienstverlening op effectiviteit en efficiëntie te analyseren en daaraan conclusies te verbinden;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel20
  - number: 20.4.d
    text: algemeen maatschappelijke en beroepsspecifieke innovaties te integreren in het eigen professionele handelen.
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel20
  - number: '20.5'
    text: 'Het aspect praktijk- en bedrijfsvoering is zo ingericht dat betrokkene in staat is om:'
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel20
  - number: 20.5.a
    text: |-
      vanuit een zorgperspectief een bijdrage te leveren aan het zorgbeleid, de praktijkvoering en het beheer van de
      afdeling of organisatie;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel20
  - number: 20.5.b
    text: al dan niet met anderen tot een effectieve, efficiënte en hygiënische praktijk- en bedrijfsvoering te komen;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel20
  - number: 20.5.c
    text: |-
      effectief leergedrag bij stagiaires en nieuwe collega’s te stimuleren, zodat beginnende oefentherapeuten op
      professionele wijze bijdragen aan het realiseren van de doelstellingen van de organisatie;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel20
  - number: 20.5.d
    text: |-
      middelen en materialen te beheren, zodat de dienstverlening aan de patiënt vanuit de organisatie effectief en
      efficiënt verloopt;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel20
  - number: 20.5.e
    text: nieuw beleid te volgen en te initiëren zodat de dienstverlening in de toekomst gewaarborgd wordt.
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel20
  - number: '20.6'
    text: 'Het aspect beroepsontwikkeling is zo ingericht dat betrokkene in staat is om:'
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel20
  - number: 20.6.a
    text: |-
      het beroep uit te oefenen overeenkomstig de geldende professionele richtlijnen, de stand van de wetenschap en de
      geldende waarden en opvattingen die patiëntengroepen hebben ten aanzien van oefentherapeutische zorg;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel20
  - number: 20.6.b
    text: ethische vraagstukken die zich voordoen bij de oefentherapeutische handelingen te onderkennen en hanteren;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel20
  - number: 20.6.c
    text: |-
      te handelen vanuit een juist begrip van wettelijke regelingen en andere regelingen betreffende de
      oefentherapeutische beroepsuitoefening;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel20
  - number: 20.6.d
    text: |-
      te handelen vanuit een juist inzicht in de epidemiologie en de behoefte aan oefentherapeutische zorg van de
      bevolking als geheel en de daartoe te hanteren verzorgingsmogelijkheden, zowel collectief als individueel;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel20
  - number: 20.6.e
    text: |-
      prioriteiten te stellen voor het verlenen van oefentherapeutische zorg in overeenstemming met de beschikbare
      middelen, de behandelingsnoodzaak en de eigen vraag naar zorg van de patiënt;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel20
  - number: 20.6.f
    text: |-
      te handelen vanuit een juist inzicht in de structuur en financiering van de gezondheidszorg gericht op
      oefentherapeutische zorg;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel20
  - number: 20.6.g
    text: |-
      op een wetenschappelijke en effectieve manier informatie te verwerven, te verwerken en toe te passen in het
      beroepsmatige handelen;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel20
  - number: 20.6.h
    text: te reflecteren op het eigen beroepsmatige handelen en dit op basis hiervan verder te ontwikkelen;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel20
  - number: 20.6.i
    text: |-
      de eigen professionaliteit voortdurend te ontwikkelen op basis van nieuwe situaties in de samenleving of het
      beroepsdomein;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel20
  - number: 20.6.j
    text: anderen te begeleiden in hun beroepsontwikkeling;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel20
  - number: 20.6.k
    text: bij te dragen aan de ontwikkeling van de professie.
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel20
  - number: '21'
    text: 'Tot het gebied van deskundigheid van de oefentherapeut wordt gerekend:'
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel21
  - number: 21.a
    text: |-
      het herkennen van risicofactoren en symptomen bij de patiënt die wijzen op de mogelijke aanwezigheid van een
      aandoening waarvoor deskundigheid van een arts gewenst of noodzakelijk is en bij constatering daarvan verwijzen
      naar een arts;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel21
  - number: 21.b
    text: |-
      onderzoeken van de patiënt op diens houdings- en bewegingsvermogens en -gewoonten en op de aanwezigheid van
      stoornissen en beperkingen van diens steun- en bewegingsapparaat en de functioneel daarbij betrokken organen en
      regelsystemen volgens de oefentherapie, gebaseerd op de bewegingsleer Cesar dan wel de methode Mensendieck, en op
      basis van de verkregen gegevens vaststellen van de diagnose en zo nodig opstellen van een behandelplan;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel21
  - number: 21.c
    text: |-
      behandelen van de patiënt, strekkende tot het opheffen, verminderen of compenseren van stoornissen of beperkingen
      van het steun- en bewegingsapparaat en de daarbij betrokken organen en regelsystemen en het normaliseren van het
      houdings- en bewegingsvermogen, door middel van het doen uitvoeren van oefeningen, ontleend aan en gericht op
      dagelijkse functionele bewegingen en elementaire bewegingsvaardigheden, volgens de bewegingsprincipes en normen
      van de bewegingsleer Cesar, dan wel het door middel van informatie en begeleiding doen oefenen van vaardigheden,
      ontleend aan dagelijkse handelingen, volgens de methode Mensendieck;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel21
  - number: 21.d
    text: |-
      het onderzoeken van een persoon of het geven van advies, voorlichting en instructie op basis van de bewegingsleer
      Cesar dan wel van de methode Mensendieck aan een persoon, met als doel het bevorderen van een goede lichaamshouding
      en lichaamsbeweging in leef-, woon-, werk- en sportsituaties.
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel21
  - number: '22'
    text: |-
      Het recht tot het voeren van de titel van orthoptist is voorbehouden aan degene aan wie een getuigschrift is
      uitgereikt waaruit blijkt dat betrokkene met goed gevolg het afsluitende examen heeft afgelegd van een opleiding
      voor orthoptie die is opgenomen in de Registratie instellingen en opleidingen en die voldoet aan het in de
      [artikelen 23][ref1] en [24][ref2] gestelde.


      [ref1]: https://wetten.overheid.nl/BWBR0008975#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0008975#Artikel24
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0008975
        artikel: '23'
        hoofdstuk: VII
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008975
        artikel: '24'
        hoofdstuk: VII
        paragraaf: '2'
  - number: '23.1'
    text: |-
      De opleiding tot orthoptist, bedoeld in [artikel 22][ref1], omvat zowel theoretisch als praktisch onderwijs, dat
      gericht is op het verwerven van kennis van en inzicht en vaardigheid in de volgende aspecten van de orthoptische
      beroepsuitoefening die betrekking hebben op het gebied van deskundigheid, bedoeld in [artikel 25][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0008975#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0008975#Artikel25
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0008975
        artikel: '22'
        hoofdstuk: VII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008975
        artikel: '25'
        hoofdstuk: VII
        paragraaf: '3'
  - number: 23.1.a
    text: diagnostiek en behandeling;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel23
  - number: 23.1.b
    text: communicatie en samenwerking;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel23
  - number: 23.1.c
    text: preventie en gezondheidsvoorlichting;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel23
  - number: 23.1.d
    text: kwaliteitszorg en innovatie;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel23
  - number: 23.1.e
    text: praktijk- en bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel23
  - number: 23.1.f
    text: beroepsontwikkeling.
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel23
  - number: '23.2'
    text: |-
      Het praktische onderwijs omvat in ieder geval stages in het werkveld inzake het toepassen van tijdens de
      studie verworven kennis, inzicht en vaardigheden met betrekking tot het gebied van deskundigheid, bedoeld in
      [artikel 25][ref1], onder toezicht van een orthoptist.


      [ref1]: https://wetten.overheid.nl/BWBR0008975#Artikel25
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0008975
        artikel: '25'
        hoofdstuk: VII
        paragraaf: '3'
  - number: '24.1'
    text: |-
      Het aspect diagnostiek en behandeling is zodanig ingericht dat betrokkene in staat is om in het kader van
      diagnostiek en behandeling, volgens de vigerende beroeps- en gezondheidszorgstandaarden, op methodische wijze de
      volgende interventies voor te bereiden, uit te voeren, te evalueren, bij te stellen en af te ronden:
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel24
  - number: 24.1.a
    text: |-
      het in het kader van het orthoptische onderzoek, dat verricht wordt met behulp van daartoe geëigende apparatuur of
      door het toedienen van diagnostische oogdruppels, bij de patiënt afnemen van een amnese;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel24
  - number: 24.1.b
    text: het controleren van de brilsterkte;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel24
  - number: 24.1.c
    text: het onderzoeken van oogstand en oogmotoriek;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel24
  - number: 24.1.d
    text: |-
      het met behulp van objectieve en subjectieve onderzoeksmethoden onderzoeken van het motorisch en sensorisch
      functioneren van beide ogen;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel24
  - number: 24.1.e
    text: het vaststellen van de monoculaire en binoculaire gezichtsscherpte;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel24
  - number: 24.1.f
    text: |-
      het met behulp van objectieve en subjectieve onderzoeksmethoden vaststellen van de brekingsafwijking en het
      fixatiepatroon van de ogen;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel24
  - number: 24.1.g
    text: het inspecteren van de fundus op afwijkingen;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel24
  - number: 24.1.h
    text: het stellen van de diagnose ten aanzien van het monoculaire en binoculaire functioneren van de ogen;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel24
  - number: 24.1.i
    text: |-
      het opstellen van een orthoptisch behandelplan dan wel behandeladvies en van een prognose ter zake van het
      optimaliseren van de monoculaire en binoculaire functies van de ogen;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel24
  - number: 24.1.j
    text: |-
      het uitvoeren van een orthoptische behandeling bij patiënten met amblyopie met behulp van occlusiemateriaal,
      brillenglazen, accomodatieverlammende oogdruppels of een combinatie hiervan;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel24
  - number: 24.1.k
    text: |-
      het uitvoeren van een orthoptische behandeling bij patiënten met oogstandafwijkingen dan wel met stoornissen in het
      binoculaire zien of in de oogbewegingen met behulp van oefeningen, brillenglazen, prismata, occlusiemateriaal of
      een combinatie hiervan;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel24
  - number: 24.1.l
    text: het bespreken van de diagnose, het behandelplan en de prognose met de patiënt dan wel diens naaste betrekkingen;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel24
  - number: 24.1.m
    text: het waar nodig overleg plegen met andere disciplines in de zorg bij het bepalen of veranderen van het behandelplan;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel24
  - number: 24.1.n
    text: het motiveren van de patiënt dan wel diens naaste betrekkingen ter zake van de behandeling;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel24
  - number: 24.1.o
    text: |-
      het volgens de geldende paramedische standaarden begeleiden van de patiënt dan wel diens naaste betrekkingen voor,
      tijdens en na de behandeling;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel24
  - number: 24.1.p
    text: |-
      een professionele samenwerkingsrelatie met de patiënt dan wel diens naaste betrekkingen aan te gaan, te onderhouden
      en af te ronden;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel24
  - number: 24.1.q
    text: |-
      het evalueren van de doelmatigheid van de behandeling en het zo nodig bijstellen dan wel afsluiten van de
      behandeling;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel24
  - number: 24.1.r
    text: het bespreken van het behandelresultaat met de patiënt dan wel diens naaste betrekkingen;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel24
  - number: 24.1.s
    text: het uitbrengen van een verslag inzake de behandeling en de resultaten ervan aan de verwijzer;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel24
  - number: 24.1.t
    text: het verwijzen naar de oogarts van de patiënt bij vermoeden van oogheelkundige pathologie;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel24
  - number: 24.1.u
    text: het adviseren van de oogarts over tijdstip, maat en soort van oogspierchirurgie;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel24
  - number: 24.1.v
    text: het vastleggen van de zorg met behulp van ICT en beeldopslag;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel24
  - number: 24.1.w
    text: het met andere zorgverleners waarborgen van effectieve en efficiënte zorg.
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel24
  - number: '24.2'
    text: 'Het aspect communicatie en samenwerking is zodanig ingericht dat de betrokkene in staat is om:'
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel24
  - number: 24.2.a
    text: |-
      in het kader van formele relaties intern en extern te communiceren met andere beroepsbeoefenaren in de
      gezondheidszorg of instanties in de gezondheidszorg;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel24
  - number: 24.2.b
    text: met andere medewerkers in de organisatie professioneel samen te werken.
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel24
  - number: '24.3'
    text: |-
      Het aspect preventie en gezondheidsvoorlichting is zodanig ingericht dat de betrokkene in staat is om in het kader
      van therapietrouw en gedragsverandering de patiënt dan wel diens naaste betrekkingen tijdens de behandeling op
      methodische wijze voor te lichten.
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel24
  - number: '24.4'
    text: 'Het aspect kwaliteitszorg en innovatie is zodanig ingericht dat de betrokkene in staat is om:'
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel24
  - number: 24.4.a
    text: |-
      de eigen zorg- en dienstverlening inhoudelijk en op effectiviteit en efficiëntie te analyseren, daaruit conclusies
      te trekken, op basis daarvan een plan te maken ter verbetering van de zorg- en dienstverlening, dit uit te voeren
      en te evalueren;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel24
  - number: 24.4.b
    text: |-
      aan de patiënt dan wel diens naaste betrekkingen alsmede aan collega’s en management verantwoording af te leggen
      over effectiviteit en efficiëntie van het eigen professionele handelen;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel24
  - number: 24.4.c
    text: |-
      een bijdrage te leveren aan de kwaliteit van de zorg- en dienstverlening binnen de organisatie en in dat kader
      de zorg- en dienstverlening inhoudelijk en op effectiviteit en efficiëntie te analyseren en daaraan conclusies
      te verbinden;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel24
  - number: 24.4.d
    text: |-
      met collega’s veranderingsplannen te maken voor vernieuwing van de zorg- en dienstverlening binnen de afdeling dan
      wel de organisatie en constructief mee te werken aan de uitvoering en evaluatie van deze plannen;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel24
  - number: 24.4.e
    text: een bijdrage te leveren aan de kwaliteitszorg van de werkorganisatie en de arbeidsomstandigheden;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel24
  - number: 24.4.f
    text: |-
      met collega’s veranderingsplannen te ontwikkelen en uit te voeren op basis van toetsing, klachten, nieuwe situaties
      en ontwikkelingen op het gebied van bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel24
  - number: '24.5'
    text: 'Het aspect praktijk- en bedrijfsvoering is zodanig ingericht dat de betrokkene in staat is om:'
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel24
  - number: 24.5.a
    text: |-
      vanuit een zorgperspectief een bijdrage te leveren aan het zorgbeleid, de praktijkvoering en het beheer van de
      afdeling dan wel organisatie;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel24
  - number: 24.5.b
    text: |-
      al dan niet met anderen tot effectieve en efficiënte praktijk- en bedrijfsvoering te komen met behulp van ICT en
      eenvoudige managementtaken uit te voeren.
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel24
  - number: '24.6'
    text: 'Het aspect beroepsontwikkeling is zodanig ingericht dat de betrokkene in staat is om:'
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel24
  - number: 24.6.a
    text: |-
      eigen beroepsmatig handelen, houding en motivatie te beschrijven, erop te reflecteren en te komen tot verdere
      ontwikkeling ter zake;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel24
  - number: 24.6.b
    text: ethische vraagstukken die zich voordoen bij de orthoptische handelingen te onderkennen en hanteren;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel24
  - number: 24.6.c
    text: de eigen beroepsontwikkeling in kaart te brengen, verder uit te stippelen en ter hand te nemen;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel24
  - number: 24.6.d
    text: |-
      een bijdrage te leveren aan intercollegiale kwaliteitszorg en in dat kader aan beroepsgenoten verantwoording af te
      leggen over effectiviteit en efficiëntie van het eigen professionele handelen;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel24
  - number: 24.6.e
    text: |-
      maatschappelijke, wetenschappelijke en beroepsontwikkelingen alsmede veranderingen op het gebied van de
      gezondheidszorg en zorg- en dienstverlening te vertalen naar het beroepsmatige handelen;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel24
  - number: 24.6.f
    text: |-
      systematisch gegevens te verzamelen over de beroepsuitoefening, deze te onderzoeken en de uitkomsten te vertalen
      naar de consequenties voor het beroep;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel24
  - number: 24.6.g
    text: |-
      relevante veranderingen in de samenleving en de regelgeving te signaleren, te onderzoeken en de resultaten hiervan
      te vertalen in een bijdrage aan het beroep en het beroepsmatige handelen;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel24
  - number: 24.6.h
    text: |-
      een bijdrage te leveren aan zo mogelijk multidisciplinair wetenschappelijk onderzoek ten behoeve van de
      ontwikkeling van de zorg en dienstverlening;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel24
  - number: 24.6.i
    text: met beroepsgenoten nieuwe methodieken, richtlijnen en protocollen te ontwikkelen;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel24
  - number: 24.6.j
    text: |-
      de eigen professionaliteit voortdurend te ontwikkelen op basis van nieuwe situaties in de samenleving of het
      beroepsdomein;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel24
  - number: 24.6.k
    text: anderen te begeleiden in hun beroepsontwikkeling.
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel24
  - number: '25'
    text: 'Tot het gebied van deskundigheid van de orthoptist wordt gerekend:'
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel25
  - number: 25.a
    text: |-
      het herkennen van risicofactoren en symptomen bij de patiënt die wijzen op de mogelijke aanwezigheid van een
      aandoening waarvoor deskundigheid van een andere discipline gewenst of noodzakelijk is en bij constatering daarvan
      verwijzen naar die andere discipline;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel25
  - number: 25.b
    text: |-
      het onderzoeken van de patiënt op de aanwezigheid van monoculaire en binoculaire functies en van stoornissen in het
      monoculaire en binoculaire zien met behulp van daartoe geëigende apparatuur of door het toedienen van in het kader
      van het onderzoek passende oogdruppels, en op basis van de verkregen gegevens opstellen van een behandelplan;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel25
  - number: 25.c
    text: 'het behandelen van stoornissen in het monoculaire of binoculaire zien van de patiënt door middel van:'
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel25
  - number: 25.c.1°
    text: het geven van instructie en advies aan de patiënt aangaande het monoculaire en binoculaire zien;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel25
  - number: 25.c.2°
    text: oefentherapie met orthoptische hulpmiddelen en apparatuur;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel25
  - number: 25.c.3°
    text: |-
      amblyopiebehandeling met behulp van occlusiemateriaal, accomodatieverlammende oogdruppels of speciaal daartoe
      voorgeschreven brillenglazen;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel25
  - number: 25.c.4°
    text: het aanmeten van brillenglazen of speciale brilcorrecties;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel25
  - number: 25.d
    text: het adviseren aan de oogarts inzake de indicatiestelling voor operatieve oogspiercorrecties.
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel25
  - number: '26'
    text: |-
      Het recht tot het voeren van de titel van podotherapeut is voorbehouden aan degene aan wie een getuigschrift is
      uitgereikt waaruit blijkt dat betrokkene met goed gevolg het afsluitende examen heeft afgelegd van een opleiding
      voor podotherapie die is opgenomen in de Registratie instellingen en opleidingen en die voldoet aan het in de
      [artikelen 27][ref1] en [28][ref2] gestelde.


      [ref1]: https://wetten.overheid.nl/BWBR0008975#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0008975#Artikel28
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0008975
        artikel: '27'
        hoofdstuk: VIII
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008975
        artikel: '28'
        hoofdstuk: VIII
        paragraaf: '2'
  - number: '27.1'
    text: |-
      De opleiding tot podotherapeut, bedoeld in [artikel 26][ref1], omvat zowel theoretisch als praktisch onderwijs
      en is gericht op het verwerven van kennis van en inzicht en vaardigheid in de volgende aspecten van de
      podotherapeutische beroepsuitoefening die betrekking hebben op het gebied van deskundigheid, bedoeld in
      [artikel 29][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0008975#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0008975#Artikel29
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0008975
        artikel: '26'
        hoofdstuk: VIII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008975
        artikel: '29'
        hoofdstuk: VIII
        paragraaf: '3'
  - number: 27.1.a
    text: diagnostiek en behandeling;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel27
  - number: 27.1.b
    text: communicatie en samenwerking;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel27
  - number: 27.1.c
    text: preventie en gezondheidsvoorlichting;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel27
  - number: 27.1.d
    text: kwaliteitszorg en innovatie;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel27
  - number: 27.1.e
    text: praktijk- en bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel27
  - number: 27.1.f
    text: beroepsontwikkeling.
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel27
  - number: '27.2'
    text: |-
      De opleiding is zo ingericht dat betrokkene bij het toepassen van de in het eerste lid bedoelde competenties
      onderscheid leert maken tussen de volgende categorieën van patiënten:
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel27
  - number: 27.2.a
    text: kinderen;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel27
  - number: 27.2.b
    text: volwassenen;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel27
  - number: 27.2.c
    text: |-
      personen bij wie podotherapeutische problemen of de behandeling daarvan worden beïnvloed door specifieke somatische
      of psychische problematiek.
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel27
  - number: '27.3'
    text: |-
      De student verwerft daarnaast algemene competenties met betrekking tot de beroepsuitoefening op de volgende
      gebieden:
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel27
  - number: 27.3.a
    text: multidisciplinaire integratie;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel27
  - number: 27.3.b
    text: wetenschappelijke toepassing;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel27
  - number: 27.3.c
    text: probleemgericht handelen;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel27
  - number: 27.3.d
    text: methodisch en reflectief denken en handelen;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel27
  - number: 27.3.e
    text: bijdragen aan de professionele ontwikkeling van het beroep.
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel27
  - number: '27.4'
    text: |-
      Het praktische onderwijs omvat in ieder geval stages in het werkveld inzake het toepassen van tijdens de
      studie verworven kennis, inzicht en vaardigheden met betrekking tot het gebied van deskundigheid, bedoeld in
      [artikel 29][ref1], onder toezicht van een podotherapeut.


      [ref1]: https://wetten.overheid.nl/BWBR0008975#Artikel29
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0008975
        artikel: '29'
        hoofdstuk: VIII
        paragraaf: '3'
  - number: '28.1'
    text: |-
      Het aspect diagnostiek en behandeling is zo ingericht dat betrokkene in staat is om in het kader van diagnostiek
      en behandeling, volgens de vigerende beroeps- en gezondheidszorgstandaarden, op methodische wijze de volgende
      interventies voor te bereiden, uit te voeren, te evalueren, bij te stellen en af te ronden:
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel28
  - number: 28.1.a
    text: het podotherapeutische onderzoek en diagnose;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel28
  - number: 28.1.b
    text: het opstellen van een behandelplan;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel28
  - number: 28.1.c
    text: het uitvoeren en evalueren van de behandeling;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel28
  - number: 28.1.d
    text: het volgens de geldende paramedische standaarden coachen van een patiënt voor, tijdens en na de behandeling;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel28
  - number: 28.1.e
    text: het voeren en beheren van een praktijk en de patiëntenadministratie;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel28
  - number: 28.1.f
    text: het met behulp van ICT vastleggen van de zorg;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel28
  - number: 28.1.g
    text: het met andere zorgverleners waarborgen van effectieve en efficiënte zorg;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel28
  - number: 28.1.h
    text: |-
      het in medische noodsituaties zodanig handelen dat de patiënt in een stabiele toestand komt en kan blijven totdat
      adequate hulp beschikbaar is.
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel28
  - number: '28.2'
    text: 'Het aspect communicatie en samenwerking is zo ingericht dat betrokkene in staat is om:'
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel28
  - number: 28.2.a
    text: |-
      effectief te communiceren met de patiënten, in daarvoor in aanmerking komende gevallen, met zijn naaste
      betrekkingen;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel28
  - number: 28.2.b
    text: |-
      in het kader van formele relaties, intern en extern te communiceren met diverse beroepsbeoefenaren in de
      gezondheidszorg of instanties in de gezondheidszorg;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel28
  - number: 28.2.c
    text: een functionele samenwerkingsrelatie met de patiënt aan te gaan, te onderhouden en af te ronden;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel28
  - number: 28.2.d
    text: met andere beroepsbeoefenaren in de gezondheidszorg in en buiten de organisatie professioneel samen te werken.
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel28
  - number: '28.3'
    text: 'Het aspect preventie en gezondheidsvoorlichting is zo ingericht dat betrokkene in staat is om:'
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel28
  - number: 28.3.a
    text: in het kader van preventie voorlichting te geven aan de patiënt met gezondheidsbevordering als doel;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel28
  - number: 28.3.b
    text: |-
      in het kader van therapietrouw en gedragsverandering de patiënt tijdens de behandeling op methodische wijze voor
      te lichten.
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel28
  - number: '28.4'
    text: 'Het aspect kwaliteitszorg en innovatie is zo ingericht dat betrokkene in staat is om:'
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel28
  - number: 28.4.a
    text: |-
      de eigen zorg- en dienstverlening op effectiviteit en efficiëntie te analyseren, daaraan conclusies te verbinden en
      deze zo nodig planmatig te verbeteren;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel28
  - number: 28.4.b
    text: aan de patiënt verantwoording af te leggen over effectiviteit en efficiëntie van het eigen professionele handelen;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel28
  - number: 28.4.c
    text: |-
      een bijdrage te leveren aan de kwaliteit van de zorg- en dienstverlening binnen de organisatie en in dat kader de
      zorg- en dienstverlening op effectiviteit en efficiëntie te analyseren en daaraan conclusies te verbinden.
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel28
  - number: '28.5'
    text: 'Het aspect praktijk- en bedrijfsvoering is zo ingericht dat betrokkene in staat is om:'
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel28
  - number: 28.5.a
    text: |-
      vanuit een zorgperspectief een bijdrage te leveren aan het zorgbeleid, de praktijkvoering en het beheer van de
      afdeling dan wel organisatie;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel28
  - number: 28.5.b
    text: |-
      al dan niet met anderen tot effectieve, efficiënte en hygiënische praktijk- en bedrijfsvoering te komen met behulp
      van ICT.
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel28
  - number: '28.6'
    text: 'Het aspect beroepsontwikkeling is zo ingericht, dat betrokkene in staat is om:'
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel28
  - number: 28.6.a
    text: het beroep uit te oefenen overeenkomstig de geldende professionele richtlijnen en de stand van de wetenschap;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel28
  - number: 28.6.b
    text: ethische vraagstukken die zich voordoen bij de podotherapeutische handelingen te onderkennen en hanteren;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel28
  - number: 28.6.c
    text: |-
      te handelen vanuit een juist begrip van wettelijke regelingen en andere regelingen betreffende de
      podotherapeutische beroepsuitoefening;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel28
  - number: 28.6.d
    text: |-
      te handelen vanuit een juist inzicht in de epidemiologie en de behoefte aan podotherapeutische zorg van de
      bevolking als geheel en de daartoe te hanteren verzorgingsmogelijkheden, zowel collectief als individueel;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel28
  - number: 28.6.e
    text: |-
      prioriteiten te stellen voor te verlenen podotherapeutische zorg in overeenstemming met de beschikbare middelen, de
      behandelingsnoodzaak en de eigen vraag naar zorg van de patiënt;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel28
  - number: 28.6.f
    text: |-
      te handelen vanuit een juist inzicht in de structuur en financiering van de gezondheidszorg gericht op de
      podotherapeutische zorg;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel28
  - number: 28.6.g
    text: |-
      op een wetenschappelijke en effectieve manier informatie te verwerven, te verwerken en toe te passen in het
      beroepsmatige handelen;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel28
  - number: 28.6.h
    text: te reflecteren op het eigen beroepsmatige handelen en dit op basis hiervan verder te ontwikkelen;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel28
  - number: 28.6.i
    text: |-
      de eigen professionaliteit voortdurend te ontwikkelen op basis van nieuwe situaties in de samenleving of het
      beroepsdomein.
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel28
  - number: '29'
    text: 'Tot het gebied van deskundigheid van de podotherapeut wordt gerekend:'
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel29
  - number: 29.a
    text: |-
      het herkennen van risicofactoren en symptomen bij de patiënt die wijzen op de mogelijke aanwezigheid van een
      aandoening waarvoor deskundigheid van een andere discipline gewenst of noodzakelijk is en bij constatering daarvan
      verwijzen naar die andere discipline;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel29
  - number: 29.b
    text: |-
      het onderzoeken van de patiënt of en in hoeverre er sprake is van een afwijking van dan wel een belemmering in de
      stand of de functie van de voet, en op basis van de verkregen gegevens opstellen van een behandelplan;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel29
  - number: 29.c
    text: |-
      het behandelen van de patiënt met als doel het opheffen, verminderen of compenseren van stoornissen in het
      functioneren van het steun- en bewegingsapparaat door middel van orthesen of prothesen of andere hulpmiddelen
      aan de voet, het uitwendig bestrijden van aan de voet aanwezige huidaandoeningen, het voorkomen of bestrijden van
      nagelafwijkingen dan wel het geven van advies.
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel29
  - number: '30'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel30
  - number: '31'
    text: |-
      Dit besluit wordt aangehaald als: Besluit diëtist, ergotherapeut, logopedist, mondhygiënist, oefentherapeut,
      orthoptist en podotherapeut.
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel31
