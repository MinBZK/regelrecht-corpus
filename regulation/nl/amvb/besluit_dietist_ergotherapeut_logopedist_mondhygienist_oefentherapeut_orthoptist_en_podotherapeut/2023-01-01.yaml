  - number: 1.b
    text: |-
      preventieve mondzorg: primaire preventie met betrekking tot de mondzorg en secundaire en tertiaire preventie op het
      gebied van de parodontologie en cariologie.
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel1
  - number: '2'
    text: |-
      Het recht tot het voeren van de titel van diëtist is voorbehouden aan degene aan wie een getuigschrift is
      uitgereikt waaruit blijkt dat betrokkene met goed gevolg het afsluitende examen heeft afgelegd van een opleiding
      voor voeding en diëtetiek die is opgenomen in de Registratie instellingen en opleidingen en die voldoet aan het in
      de [artikelen 3][ref1] en [4][ref2] gestelde.


      [ref1]: https://wetten.overheid.nl/BWBR0008975#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008975#Artikel4
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0008975
        artikel: '3'
