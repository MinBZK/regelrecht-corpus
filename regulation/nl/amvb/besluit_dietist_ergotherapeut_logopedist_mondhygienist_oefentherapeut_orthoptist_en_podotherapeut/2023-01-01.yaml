        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008975
        artikel: '4'
        hoofdstuk: II
        paragraaf: '2'
  - number: '3.1'
    text: |-
      De opleiding tot diëtist, bedoeld in [artikel 2][ref1], omvat zowel theoretisch als praktisch onderwijs,
      dat gericht is op het verwerven van kennis van en inzicht en vaardigheid in de volgende aspecten van
      de beroepsuitoefening van de diëtist die betrekking hebben op het gebied van deskundigheid, bedoeld in
      [artikel 5][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0008975#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008975#Artikel5
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008975
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008975
        artikel: '5'
        hoofdstuk: II
        paragraaf: '3'
  - number: 3.1.a
    text: diagnostiek en behandeling;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel3
  - number: 3.1.b
    text: communicatie en samenwerking;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel3
  - number: 3.1.c
    text: preventie en gezondheidsvoorlichting;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel3
  - number: 3.1.d
    text: kwaliteitszorg en innovatie;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel3
  - number: 3.1.e
    text: praktijk- en bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel3
  - number: 3.1.f
    text: beroepsontwikkeling.
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel3
  - number: '3.2'
    text: |-
      Het praktische onderwijs omvat in ieder geval stages in het werkveld inzake het toepassen van tijdens de
      studie verworven kennis, inzicht en vaardigheden met betrekking tot het gebied van deskundigheid, bedoeld in
      [artikel 5][ref1], onder toezicht van een diëtist.


      [ref1]: https://wetten.overheid.nl/BWBR0008975#Artikel5
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008975
        artikel: '5'
        hoofdstuk: II
        paragraaf: '3'
  - number: '4.1'
    text: |-
      Het aspect diagnostiek en behandeling is zo ingericht dat betrokkene in staat is om in het kader van diagnostiek en
      behandeling van ziekte gerelateerde voedingsproblemen, volgens de vigerende beroeps- en gezondheidszorgstandaarden,
      op methodische wijze de volgende interventies voor te bereiden, uit te voeren, te evalueren, bij te stellen en af
      te ronden:
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel4
  - number: 4.1.a
    text: het in het kader van het diëtistische onderzoek bij de patiënt afnemen van een anamnese;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel4
  - number: 4.1.b
    text: het stellen van een diëtistische diagnose;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel4
  - number: 4.1.c
    text: het opstellen van een behandelplan of advies, zo nodig na afstemming met andere disciplines;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel4
  - number: 4.1.d
    text: het bieden van individuele voedings- en dieetadvisering;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel4
  - number: 4.1.e
    text: het op methodische wijze overdragen van informatie over voeding en diëten;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel4
  - number: 4.1.f
    text: het door middel van begeleiding en coaching bewerkstelligen van therapietrouw en gedragsverandering;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel4
  - number: 4.1.g
    text: het adequaat registreren van verzamelde gegevens;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel4
  - number: 4.1.h
    text: |-
      het uitvoeren van evaluaties, zowel tussentijds als aan het einde van de behandeling, het afsluiten van de
      behandeling en het rapporteren aan de verwijzer;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel4
  - number: 4.1.i
    text: het in het kader van preventie bij een persoon signaleren van ongezond voedingsgedrag en ongezonde leefwijzen;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel4
  - number: 4.1.j
    text: |-
      het in het kader van leefstijlcoaching bij een persoon teweegbrengen van veranderingen in voedingsgedrag en van een
      gezonde leefstijl;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel4
  - number: 4.1.k
    text: het regisseren van gezondheidsbevorderende interventies bij door voeding beïnvloedbare ziekten of klachten;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel4
  - number: 4.1.l
    text: het met andere zorgverleners waarborgen van effectieve en efficiënte voedings- en dieetzorg;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel4
  - number: 4.1.m
    text: zo nodig terugverwijzing naar de arts.
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel4
  - number: '4.2'
    text: 'Het aspect communicatie en samenwerking is zo ingericht dat betrokkene in staat is om:'
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel4
  - number: 4.2.a
    text: |-
      effectief te communiceren met de patiënt en, in daarvoor in aanmerking komende gevallen, met diens naaste
      betrekkingen;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel4
  - number: 4.2.b
    text: |-
      in het kader van formele relaties, intern en extern te communiceren met andere beroepsbeoefenaren in de
      gezondheidszorg en gesprekspartners werkzaam in zowel een preventieve als curatieve setting;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel4
  - number: 4.2.c
    text: een functionele samenwerkingsrelatie met de patiënt aan te gaan, te onderhouden en af te ronden;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel4
  - number: 4.2.d
    text: |-
      met andere beroepsbeoefenaren in de gezondheidszorg en gesprekspartners in en buiten de organisatie professioneel
      overleg te voeren en samen te werken.
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel4
  - number: '4.3'
    text: 'Het aspect preventie en gezondheidsvoorlichting is zo ingericht dat betrokkene in staat is om:'
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel4
  - number: 4.3.a
    text: |-
      in het kader van preventie doelgerichte voedingsvoorlichting en -informatie te geven met gezondheidsbevordering
      als doel;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel4
  - number: 4.3.b
    text: |-
      in het kader van therapietrouw en gedragsverandering de patiënt tijdens de behandeling op methodische wijze voor
      te lichten;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel4
  - number: 4.3.c
    text: bij te dragen aan het opstellen en implementeren van het preventiebeleid van de organisatie.
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel4
  - number: '4.4'
    text: 'Het aspect kwaliteitszorg en innovatie is zo ingericht dat betrokkene in staat is om:'
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel4
  - number: 4.4.a
    text: |-
      de eigen zorg- en dienstverlening op effectiviteit en efficiëntie te analyseren, daaraan conclusies te verbinden en
      deze zo nodig planmatig te verbeteren;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel4
  - number: 4.4.b
    text: aan de patiënt verantwoording af te leggen over effectiviteit en efficiëntie van de zorg- en dienstverlening;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel4
  - number: 4.4.c
    text: kwaliteitsinstrumenten van de beroepsgroep adequaat te gebruiken;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel4
  - number: 4.4.d
    text: |-
      een bijdrage te leveren aan de kwaliteit van de voedingszorg- en dienstverlening binnen een afdeling dan wel
      organisatie en deze op effectiviteit en efficiëntie te analyseren en daaraan conclusies te verbinden;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel4
  - number: 4.4.e
    text: onderzoek te initiëren en uit te voeren naar de effecten van voeding op gezondheid;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel4
  - number: 4.4.f
    text: |-
      nieuwe interventies of nieuwe interventiemethodieken of -producten te ontwikkelen in het kader van voeding en
      gezondheid;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel4
  - number: 4.4.g
    text: nieuw ontwikkelde kennis en innovaties uit te dragen en te publiceren;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel4
  - number: 4.4.h
    text: algemeen maatschappelijke en beroepsspecifieke innovaties te integreren in het eigen professionele handelen.
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel4
  - number: '4.5'
    text: 'Het aspect praktijk- en bedrijfsvoering is zo ingericht dat betrokkene in staat is om:'
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel4
  - number: 4.5.a
    text: |-
      vanuit een gezondheids- en marktperspectief een bijdrage te leveren aan het voedingsbeleid, de praktijkvoering en
      het beheer van de afdeling dan wel organisatie;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel4
  - number: 4.5.b
    text: al dan niet met anderen tot een effectieve en efficiënte praktijk- en bedrijfsvoering te komen;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel4
  - number: 4.5.c
    text: |-
      effectief leergedrag bij stagiaires en nieuwe collega’s te stimuleren, zodat beginnende diëtisten op professionele
      wijze bijdragen aan het realiseren van de doelstellingen van de organisatie;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel4
  - number: 4.5.d
    text: |-
      middelen en materialen te beheren, zodat de dienstverlening aan de cliënt vanuit de organisatie effectief en
      efficiënt verloopt;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel4
  - number: 4.5.e
    text: nieuw beleid te volgen en te initiëren zodat de dienstverlening in de toekomst wordt gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel4
  - number: '4.6'
    text: 'Het aspect beroepsontwikkeling is zo ingericht dat betrokkene in staat is om:'
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel4
  - number: 4.6.a
    text: |-
      het beroep uit te oefenen overeenkomstig de geldende professionele richtlijnen en de stand van de wetenschap en de
      geldende waarden en opvattingen die patiënten hebben ten aanzien van voedings- en dieetzorg;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel4
  - number: 4.6.b
    text: ethische vraagstukken die zich voordoen bij de diëtistische handelingen te onderkennen en hanteren;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel4
  - number: 4.6.c
    text: |-
      te handelen vanuit een juist begrip van wettelijke regelingen en andere regelingen betreffende de
      beroepsuitoefening van de diëtist;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel4
  - number: 4.6.d
    text: |-
      te handelen vanuit een juist inzicht in de epidemiologie en de behoefte aan voedings- en dieetzorg van de bevolking
      als geheel en de daartoe te hanteren verzorgingsmogelijkheden, zowel collectief als individueel;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel4
  - number: 4.6.e
    text: |-
      prioriteiten te stellen voor te verlenen voedings- en dieetzorg in overeenstemming met de beschikbare middelen, de
      behandelingsnoodzaak en de eigen vraag naar zorg van de cliënt;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel4
  - number: 4.6.f
    text: |-
      te handelen vanuit een juist inzicht in de structuur en financiering van de organisatie en de gezondheidszorg
      gericht op de voedings- en dieetzorg;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel4
  - number: 4.6.g
    text: |-
      op een effectieve manier wetenschappelijke informatie te verwerven, te verwerken en toe te passen in het
      beroepsmatige handelen;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel4
  - number: 4.6.h
    text: te reflecteren op het eigen beroepsmatige handelen en dit op basis hiervan verder te ontwikkelen;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel4
  - number: 4.6.i
    text: |-
      de eigen professionaliteit voortdurend te ontwikkelen op basis van nieuwe situaties in de samenleving of het
      beroepsdomein;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel4
  - number: 4.6.j
    text: anderen te begeleiden in hun beroepsontwikkeling;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel4
  - number: 4.6.k
    text: bij te dragen aan de ontwikkeling van de professie.
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel4
  - number: '5'
    text: 'Tot het gebied van deskundigheid van de diëtist wordt gerekend:'
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel5
  - number: 5.a
    text: |-
      het herkennen van risicofactoren en symptomen bij de patiënt die wijzen op de mogelijke aanwezigheid van een
      aandoening waarvoor deskundigheid van een andere discipline gewenst of noodzakelijk is en bij constatering daarvan
      verwijzen naar die andere discipline;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel5
  - number: 5.b
    text: |-
      het onderzoeken van de patiënt, gericht op het bepalen van diens voedingstoestand en op het vaststellen of
      lokaliseren van bepaalde voedingsgerelateerde ziektebeelden, en op basis van de verkregen gegevens opstellen van
      een behandelplan;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel5
  - number: 5.c
    text: |-
      het behandelen van de patiënt door toepassing van diëettherapie of het geven van diëetadvies, gericht op het
      opheffen, verminderen of compenseren van met voeding samenhangende of door voeding beïnvloedbare ziekten of
      klachten;
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel5
  - number: 5.d
    text: |-
      het geven van voedings- en diëetvoorlichting aan een persoon, met als doel het voorkomen van met voeding
      samenhangende of door voeding beïnvloedbare ziekten of klachten.
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel5
  - number: '6'
    text: |-
      Het recht tot het voeren van de titel van ergotherapeut is voorbehouden aan degene aan wie een getuigschrift is
      uitgereikt waaruit blijkt dat betrokkene met goed gevolg het afsluitende examen heeft afgelegd van een opleiding
      voor ergotherapie die is opgenomen in de Registratie instellingen en opleidingen en die voldoet aan het in de
      [artikelen 7][ref1] en [8][ref2] gestelde.


      [ref1]: https://wetten.overheid.nl/BWBR0008975#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0008975#Artikel8
    url: https://wetten.overheid.nl/BWBR0008975/2023-01-01#Artikel6
