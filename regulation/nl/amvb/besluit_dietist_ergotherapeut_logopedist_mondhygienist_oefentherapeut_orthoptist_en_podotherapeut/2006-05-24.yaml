    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel8
  - number: '9.1'
    text: 'Tot het gebied van deskundigheid van de ergotherapeut wordt gerekend:'
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel9
  - number: 9.1.a
    text: 'het op verwijzing van een arts:'
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel9
  - number: 9.1.a.1°
    text: |-
      onderzoeken van de patiënt of en in hoeverre de vermogens of vaardigheden aanwezig zijn om handelingen te
      verrichten, ontleend aan het dagelijkse leven of aan de arbeid, en op basis van de verkregen gegevens opstellen van
      een behandelplan;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel9
  - number: 9.1.a.2°
    text: |-
      behandelen van de patiënt met als doel het opheffen, verminderen of compenseren van lichamelijke of psychische
      stoornissen, beperkingen of handicaps door het doen verkrijgen of optimaliseren van vaardigheden vereist voor
      het verrichten van handelingen als bedoeld onder 1°, of door het geven van informatie, instructie en advies aan
      de patiënt en in daarvoor in aanmerking komende gevallen aan diens naaste betrekkingen, strekkende tot het zo
      zelfstandig mogelijk functioneren van de patiënt in diens leef-, woon- of werksituatie;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel9
  - number: 9.1.a.3°
    text: |-
      in daarvoor in aanmerking komende gevallen vervaardigen voor de patiënt van hulpmiddelen of adviseren van de
      patiënt over te treffen voorzieningen in of aanpassingen van diens leef-, woon- of werksituatie, in het kader van
      de behandeling als bedoeld onder 2°;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel9
  - number: 9.1.b
    text: |-
      het geven van advies, voorlichting en instructie aan een persoon, met als doel belemmeringen in het zelfstandig
      functioneren in leef-, woon- of werksituatie te voorkomen.
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel9
  - number: '9.2'
    text: |-
      De verwijzing, bedoeld in het eerste lid, onder *a*, geschiedt schriftelijk, is gedateerd en ondertekend door de
      betrokken arts en bevat ten minste de door deze, voor het door de ergotherapeut onderzoeken en behandelen van de
      patiënt, relevant geachte diagnostische gegevens.
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel9
  - number: '10'
    text: |-
