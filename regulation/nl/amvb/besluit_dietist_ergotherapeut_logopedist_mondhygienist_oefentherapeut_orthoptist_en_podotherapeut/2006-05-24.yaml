      voor logopedie die is opgenomen in het Centraal register opleidingen hoger onderwijs en die voldoet aan het in
      [de artikelen 11][ref1] en [12][ref2] gestelde.


      [ref1]: https://wetten.overheid.nl/BWBR0008975#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0008975#Artikel12
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel10
