preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van Onze Minister van Volksgezondheid, Welzijn en Sport van 16 juni 1997, CSZ/BO-978517;

    Gelet op artikel 34 van de Wet op de beroepen in de individuele gezondheidszorg;

    Gezien de adviezen van de Raad voor de beroepen in de individuele gezondheidszorg (adviezen van 8 juli 1994, 23
    november 1994 en 4 oktober 1996);

    De Raad van State gehoord (advies van 26 augustus 1997, No. W13.97.348);

    Gezien het nader rapport van Onze Minister van Volksgezondheid, Welzijn en Sport van 14 oktober 1997, CSZ/BO-
    9714 270;

