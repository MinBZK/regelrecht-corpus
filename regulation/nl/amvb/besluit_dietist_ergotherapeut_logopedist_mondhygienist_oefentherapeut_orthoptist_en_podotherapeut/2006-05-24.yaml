        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008975
        artikel: '13'
        hoofdstuk: IV
        paragraaf: '3'
  - number: '12.2'
    text: |-
      De beroepsvoorbereidende periode vindt plaats onder begeleiding van een daartoe door de instelling aangewezen
      docent en wordt doorgebracht onder toezicht van een logopedist.
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel12
  - number: '12.3'
    text: |-
      De beroepsvoorbereidende periode omvat 30 studiepunten die behaald worden in de tweede helft van de hoofdfase en is
      gelijkelijk verdeeld over logopedie binnen de gezondheidszorg en logopedie binnen het onderwijs.
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel12
  - number: '13.1'
    text: 'Tot het gebied van deskundigheid van de logopedist wordt gerekend:'
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel13
  - number: 13.1.a
    text: 'het op verwijzing van een arts of een tandarts:'
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel13
  - number: 13.1.a.1°
    text: |-
      uitwendig onderzoeken van de patiënt of en zo ja in hoeverre: - de vermogens tot het spreken, leren spreken en
      gebruiken van taal aanwezig zijn,
        - de vermogens tot veilig en efficiënt eten, drinken en slikken aanwezig zijn,
        - de gehoor-, stem- of spraakorganen functioneren, daaronder begrepen de invloed van de ademhaling op de
      stemgeving,
        - er mede aan de persoonlijkheid van de patiënt en diens relatie tot zijn omgeving gerelateerde stoornissen in
      het toepassen van taal of het spreken aanwezig zijn, en op basis van de verkregen gegevens opstellen van een
      behandelplan;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel13
  - number: 13.1.a.2°
    text: |-
      behandelen van de patiënt, gericht op: - het herstellen, verbeteren of onderhouden van het functioneren van diens
      gehoor-, stem- of spraakorganen of het voor de stemgeving noodzakelijke reguleren van diens ademhaling;
        - het opheffen van bij de patiënt aanwezige stoornissen in het spreken of leren spreken of in het gebruiken
      van de taal of in het adequaat eten, drinken en slikken, al dan niet in samenhang met de daartoe noodzakelijke
      beïnvloeding van beweging of gedrag;
        - het in het kader van de behandeling begeleiden van de patiënt bij het aanwenden van hulpmiddelen die het
      functioneren van de gehoor-, stem- of spraakorganen bevorderen of die deze organen geheel of ten dele vervangen;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel13
  - number: 13.1.b
    text: |-
      het onderzoeken van een persoon of het geven van logopedisch advies aan een persoon, met als doel het voorkomen van
      stoornissen in het functioneren van de gehoor-, stem- of spraakorganen dan wel in het spreken of in het gebruiken
      van de taal.
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel13
  - number: '13.2'
    text: |-
      De verwijzing, bedoeld in het eerste lid, onder *a*, geschiedt schriftelijk, is gedateerd en ondertekend door de
      betrokken arts of tandarts en bevat ten minste de door deze, voor het door de logopedist onderzoeken en behandelen
      van de patiënt, relevant geachte diagnostische gegevens.
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel13
  - number: '14'
    text: |-
      Het recht tot het voeren van de titel van mondhygiënist is voorbehouden aan degene aan wie een getuigschrift is
      uitgereikt waaruit blijkt dat betrokkene met goed gevolg het afsluitende examen heeft afgelegd van een opleiding
      voor mondzorgkunde die is opgenomen in het Centraal register opleidingen hoger onderwijs en die voldoet aan de
      [artikelen 15][ref1] en [16][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008975#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0008975#Artikel16
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008975
        artikel: '15'
        hoofdstuk: V
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008975
        artikel: '16'
        hoofdstuk: V
        paragraaf: '2'
  - number: '15.1'
    text: |-
      De opleiding, bedoeld in [artikel 14][ref1], omvat zowel theoretisch als praktisch onderwijs, dat gericht
      is op het verwerven van kennis van en inzicht en vaardigheid in de volgende aspecten van de mondzorgkundige
      beroepsuitoefening in het kader van het gebied van deskundigheid, bedoeld in [artikel 17][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0008975#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0008975#Artikel17
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0008975
        artikel: '14'
        hoofdstuk: V
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008975
        artikel: '17'
        hoofdstuk: V
        paragraaf: '3'
  - number: 15.1.a
    text: professionele mondzorgkundige vorming;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel15
  - number: 15.1.b
    text: communicatie en voorlichting;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel15
  - number: 15.1.c
    text: |-
      onderzoek en diagnose van problemen op het gebied van de preventieve mondzorg en het op basis daarvan opstellen en
      uitvoeren van een behandelplan;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel15
  - number: 15.1.d
    text: instellen en handhaven van een optimale mondgezondheid;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel15
  - number: 15.1.e
    text: beginselen van de mondzorg;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel15
  - number: 15.1.f
    text: praktijkvoering.
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel15
  - number: '15.2'
    text: |-
      Het praktische onderwijs omvat in ieder geval stage in het werkveld inzake het toepassen van tijdens de
      studie verworven kennis, inzicht en vaardigheden met betrekking tot het gebied van deskundigheid, bedoeld in
      [artikel 17][ref1], onder toezicht van een tandarts of mondhygiënist.


      [ref1]: https://wetten.overheid.nl/BWBR0008975#Artikel17
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0008975
        artikel: '17'
        hoofdstuk: V
        paragraaf: '3'
  - number: '16.1'
    text: 'Het aspect professionele mondzorgkundige vorming is zodanig ingericht dat de betrokkene in staat is tot:'
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel16
  - number: 16.1.a
    text: het verwerven en verwerken van relevante informatie;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel16
  - number: 16.1.b
    text: |-
      het uitoefenen van het beroep van mondhygiënist overeenkomstig de geldende professionele standaard en de stand van
      de wetenschap;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel16
  - number: 16.1.c
    text: het onderkennen van en omgaan met ethische vraagstukken die zich voordoen bij de mondzorgkundige handeling;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel16
  - number: 16.1.d
    text: het verstrekken van doelgerichte informatie aan de patiënt;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel16
  - number: 16.1.e
    text: |-
      het handelen vanuit een juist begrip van wettelijke regelingen en andere regelingen betreffende de mondzorgkundige
      beroepsuitoefening;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel16
  - number: 16.1.f
    text: de evaluatie van eigen handelen, op grond waarvan eigen beperkingen worden herkend en erkend.
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel16
  - number: '16.2'
    text: 'Het aspect communicatie en voorlichting is zodanig ingericht dat de betrokkene in staat is tot:'
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel16
  - number: 16.2.a
    text: |-
      het effectief communiceren met de patiënt en, in daarvoor in aanmerking komende gevallen, met diens naaste
      betrekkingen;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel16
  - number: 16.2.b
    text: het communiceren met andere beroepsbeoefenaren in de gezondheidszorg;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel16
  - number: 16.2.c
    text: |-
      het geven van voorlichting aan de patiënt met betrekking tot gedrag en behandeling op het gebied van de preventieve
      mondzorg.
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel16
  - number: '16.3'
    text: |-
      Het aspect onderzoek en diagnose van problemen op het gebied van de preventieve mondzorg en het op basis daarvan
      opstellen en uitvoeren van een behandelplan is zodanig ingericht dat de betrokkene in staat is tot:
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel16
  - number: 16.3.a
    text: |-
      het in het kader van het mondzorgkundige onderzoek bij de patiënt afnemen van een anamnese, omvattende diens
      tandheelkundige, medische, persoonlijke en sociaal-culturele achtergronden teneinde de implicaties van algemene
      gezondheidsafwijkingen en geneesmiddelengebruik voor het uitvoeren van de mondzorgkundige behandeling te kunnen
      beoordelen;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel16
  - number: 16.3.b
    text: het diagnostiseren van aandoeningen op het gebied van parodontologie en cariologie;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel16
  - number: 16.3.c
    text: het in de mond signaleren van zichtbare afwijkingen van het normale beeld;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel16
  - number: 16.3.d
    text: |-
      het in opdracht van een tandarts uitvoeren van tandheelkundig beeldvormend diagnostisch onderzoek en het nemen van
      maatregelen gericht op bescherming tegen ioniserende straling;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel16
  - number: 16.3.e
    text: |-
      het opstellen van een behandelplan en het verwijzen van de patiënt naar een tandarts of arts indien dit in het
      belang van diens gezondheid noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel16
  - number: '16.4'
    text: |-
      Het aspect instellen en handhaven van een optimale mondgezondheid is zodanig ingericht dat de betrokkene in staat
      is tot:
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel16
  - number: 16.4.a
    text: het geven van tandheelkundige gezondheidsvoorlichting;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel16
  - number: 16.4.b
    text: het treffen van preventieve maatregelen voor het handhaven of het bevorderen van de mondgezondheid;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel16
  - number: 16.4.c
    text: |-
      het toepassen van mondzorgkundige behandelingen die aandoeningen van het gebit en de het gebit omringende weefsels
      voorkomen, verminderen dan wel opheffen;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel16
  - number: 16.4.d
    text: |-
      het indiceren van de behandeling van primaire cariës en in opdracht van een tandarts restaureren van primaire
      caviteiten met plastische vulmaterialen;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel16
  - number: 16.4.e
    text: |-
      het in opdracht van een tandarts toepassen van lokale anesthesie door het geven van injecties ten behoeve van
      geleidings- of infiltratie-anesthesie.
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel16
  - number: '16.5'
    text: 'Het aspect beginselen van de mondzorg is zodanig ingericht dat de betrokkene:'
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel16
  - number: 16.5.a
    text: |-
      inzicht verwerft in de epidemiologie en de behoefte aan preventieve mondzorg van de bevolking als geheel en de
      daartoe te hanteren interventiemogelijkheden;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel16
  - number: 16.5.b
    text: |-
      in staat is tot het stellen van prioriteiten voor te verlenen preventieve mondzorg in overeenstemming met de
      beschikbare middelen, de behandelingsnoodzaak en de eigen vraag naar zorg van de patiënt;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel16
  - number: 16.5.c
    text: inzicht verwerft in de structuur en financiering van de gezondheidszorg gericht op de mondzorg.
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel16
  - number: '16.6'
    text: 'Het aspect praktijkvoering is zodanig ingericht dat de betrokkene in staat is tot:'
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel16
  - number: 16.6.a
    text: het voeren van overleg en samenwerken binnen het mondzorgteam en andere beroepsbeoefenaren in de gezondheidszorg;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel16
  - number: 16.6.b
    text: het doelmatig vastleggen van relevante gegevens omtrent de patiënt en de behandeling;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel16
  - number: 16.6.c
    text: het treffen van praktijkhygiënische maatregelen;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel16
  - number: 16.6.d
    text: het hanteren van de uitgangspunten voor de organisatie en een doelmatige opzet van een mondzorgpraktijk.
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel16
  - number: '17'
    text: 'Tot het gebied van deskundigheid van de mondhygiënist wordt gerekend:'
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel17
  - number: 17.a
    text: |-
      het onderzoeken en beoordelen van de staat van het gebit van de patiënt en van de weefsels die het gebit omringen
      met betrekking tot plaque-gerelateerde aandoeningen, en het op basis van de verkregen gegevens vaststellen van de
      diagnose en opstellen van een behandelplan;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel17
  - number: 17.b
    text: |-
      het screenen op tandheelkundige afwijkingen of andere afwijkingen betreffende de mondgezondheid en het zo nodig
      verwijzen naar tandarts of arts;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel17
  - number: 17.c
    text: |-
      het met uitzondering van de in onderdeel e, onder 3°, bedoelde preparatie van primaire caviteiten toepassen van
      mondzorgkundige behandelingen, strekkende tot het voorkomen of herstellen van aandoeningen van het gebit en tot het
      opheffen of verminderen van aandoeningen van de weefsels die het gebit omringen;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel17
  - number: 17.d
    text: |-
      het geven van tandheelkundige gezondheidsvoorlichting aan een persoon, met als doel het stimuleren van gedrag dat
      de mondgezondheid bevordert;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel17
  - number: 17.e
    text: 'het bij daarvoor in aanmerking komende patiënten in opdracht van een tandarts:'
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel17
  - number: 17.e.1°
    text: toepassen van ioniserende straling in het kader van het onderzoek, bedoeld onder a;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel17
  - number: 17.e.2°
    text: |-
      toepassen van lokale anesthesie door het geven van injecties met door Onze Minister aan te wijzen middelen ten
      behoeve van geleidings- of infiltratie-anesthesie ter ondersteuning van het onderzoek, bedoeld onder a, of van de
      behandeling, bedoeld onder c, en onder 3°;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel17
  - number: 17.e.3°
    text: |-
      behandelen van primaire caviteiten door middel van preparatie ten behoeve van restauratie met plastische
      vulmaterialen.
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel17
  - number: '18'
    text: |-
      Het recht tot het voeren van de titel van oefentherapeut is voorbehouden aan degene aan wie een getuigschrift is
      uitgereikt waaruit blijkt dat betrokkene met goed gevolg het afsluitende examen heeft afgelegd van een opleiding
      voor oefentherapie-Cesar onderscheidenlijk voor oefentherapie-Mensendieck die is opgenomen in het Centraal register
      opleidingen hoger onderwijs en die voldoet aan het in [de artikelen 19][ref1] en [20][ref2] gestelde.


      [ref1]: https://wetten.overheid.nl/BWBR0008975#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0008975#Artikel20
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0008975
        artikel: '19'
        hoofdstuk: VI
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008975
        artikel: '20'
        hoofdstuk: VI
        paragraaf: '2'
  - number: '19'
    text: |-
      Een opleiding als bedoeld in [artikel 18][ref1] omvat ten minste de volgende onderdelen:


      [ref1]: https://wetten.overheid.nl/BWBR0008975#Artikel18
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0008975
        artikel: '18'
        hoofdstuk: VI
        paragraaf: '1'
  - number: 19.a
    text: 'het centrale vakgebied oefentherapie-Cesar dan wel oefentherapie-Mensendieck, omvattende ten minste:'
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel19
  - number: 19.a.1°
    text: |-
      onderzoeken en behandelen van de patiënt in het kader van het gebied van deskundigheid zoals omschreven in
      [artikel 21][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008975#Artikel21
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0008975
        artikel: '21'
        hoofdstuk: VI
        paragraaf: '3'
  - number: 19.a.2°
    text: theorie en praktijk van de oefentherapie-Cesar dan wel de oefentherapie-Mensendieck;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel19
  - number: 19.a.3°
    text: de bewegingsleer Cesar dan wel de methode Mensendieck;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel19
  - number: 19.b
    text: de beroepsvoorbereidende periode in het werkveld;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel19
  - number: 19.c
    text: het medische vakgebied, waaronder anatomie, fysiologie, algemene en speciële pathologie alsmede biomechanica;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel19
  - number: 19.d
    text: |-
      vakken op het gebied van de gedrags- en maatschappijwetenschappen, waaronder psychologie en psychopathologie,
      sociologie, pedagogiek, gesprekstechnieken, voorlichting en algemene didactiek;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel19
  - number: 19.e
    text: |-
      ondersteunende vakken, waaronder organisatie van de gezondheidszorg, gezondheidsrecht, beroepsoriëntatie
      en praktijkvoering, ethiek met betrekking tot het beroep van oefentherapeut, methoden en technieken van
      wetenschappelijk onderzoek alsmede kwaliteitszorg.
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel19
  - number: '20.1'
    text: |-
      De in [artikel 19, onder b][ref1], bedoelde beroepsvoorbereidende periode omvat het in het werkveld toepassen van
      tijdens de studie verworven kennis, inzicht en vaardigheden met betrekking tot het gebied van deskundigheid van de
      oefentherapeut zoals omschreven in [artikel 21, eerste lid, onder a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008975#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0008975#Artikel21
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0008975
        artikel: '19'
        hoofdstuk: VI
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008975
        artikel: '21'
        hoofdstuk: VI
        paragraaf: '3'
  - number: '20.2'
    text: |-
      De beroepsvoorbereidende periode vindt plaats onder begeleiding van een daartoe door de instelling aangewezen
      docent en wordt doorgebracht onder toezicht van een oefentherapeut.
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel20
  - number: '20.3'
    text: |-
      De beroepsvoorbereidende periode omvat 30 studiepunten die behaald worden in de tweede helft van de opleiding en is
      gelijkelijk verdeeld over twee verschillende instellingen van gezondheidszorg.
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel20
  - number: '21.1'
    text: 'Tot het gebied van deskundigheid van de oefentherapeut wordt gerekend:'
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel21
  - number: 21.1.a
    text: 'het op verwijzing van een arts:'
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel21
  - number: 21.1.a.1°
    text: |-
      onderzoeken van de patiënt op diens houdings- en bewegingsvermogens en -gewoonten en op de aanwezigheid van
      stoornissen en beperkingen van diens steun- en bewegingsapparaat en de functioneel daarbij betrokken organen en
      regelsystemen volgens de oefentherapie, gebaseerd op de bewegingsleer Cesar dan wel de methode Mensendieck, en op
      basis van de verkregen gegevens opstellen van een behandelplan;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel21
  - number: 21.1.a.2°
    text: |-
      behandelen van de patiënt, strekkende tot het opheffen, verminderen of compenseren van stoornissen of beperkingen
      van het steun- en bewegingsapparaat en de daarbij betrokken organen en regelsystemen en het normaliseren van het
      houdings- en bewegingsvermogen, door middel van het doen uitvoeren van oefeningen, ontleend aan en gericht op
      dagelijkse functionele bewegingen en elementaire bewegingsvaardigheden, volgens de bewegingsprincipes en normen
      van de bewegingsleer Cesar, dan wel het door middel van informatie en begeleiding doen oefenen van vaardigheden,
      ontleend aan dagelijkse handelingen, volgens de methode Mensendieck;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel21
  - number: 21.1.b
    text: |-
      het onderzoeken van een persoon of het geven van advies, voorlichting en instructie op basis van de bewegingsleer
      Cesar dan wel van de methode Mensendieck, aan een persoon, met als doel het bevorderen van een goede
      lichaamshouding en lichaamsbeweging in leef-, woon-, werk- en sportsituaties.
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel21
  - number: '21.2'
    text: |-
      De verwijzing, bedoeld in het eerste lid, onder *a*, geschiedt schriftelijk, is gedateerd en ondertekend door de
      betrokken arts en bevat ten minste de door deze, voor het door de oefentherapeut onderzoeken en behandelen van de
      patiënt, relevant geachte diagnostische gegevens.
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel21
  - number: '22'
    text: |-
      Het recht tot het voeren van de titel van orthoptist is voorbehouden aan degene aan wie een getuigschrift is
      uitgereikt waaruit blijkt dat betrokkene met goed gevolg het afsluitende examen heeft afgelegd van een opleiding
      voor orthoptie die is opgenomen in het Centraal register opleidingen hoger onderwijs en die voldoet aan het in
      [de artikelen 23][ref1] en [24][ref2] gestelde.


      [ref1]: https://wetten.overheid.nl/BWBR0008975#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0008975#Artikel24
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0008975
        artikel: '23'
        hoofdstuk: VII
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008975
        artikel: '24'
        hoofdstuk: VII
        paragraaf: '2'
  - number: '23'
    text: |-
      Een opleiding als bedoeld in [artikel 22][ref1] omvat ten minste de volgende onderdelen:


      [ref1]: https://wetten.overheid.nl/BWBR0008975#Artikel22
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0008975
        artikel: '22'
        hoofdstuk: VII
        paragraaf: '1'
  - number: 23.a
    text: |-
      het centrale vakgebied orthoptie, omvattende ten minste onderzoeken en behandelen van de patiënt in het kader van
      het gebied van deskundigheid zoals omschreven in [artikel 25][ref1], alsmede theorie en praktijk van de orthoptie;


      [ref1]: https://wetten.overheid.nl/BWBR0008975#Artikel25
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0008975
        artikel: '25'
        hoofdstuk: VII
        paragraaf: '3'
  - number: 23.b
    text: de beroepsvoorbereidende periode in het werkveld;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel23
  - number: 23.c
    text: |-
      het medische vakgebied, waaronder anatomie, fysiologie, neuro-anatomie en neurofysiologie, algemene en speciële
      pathologie met betrekking tot oogheelkunde en neurologie, zintuigwetenschappen, neuro-ophthalmologie, farmacologie
      en kinderoogheelkunde;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel23
  - number: 23.d
    text: vakken op het gebied van de gedragswetenschappen, waaronder psychologie, gesprekstechnieken en voorlichting;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel23
  - number: 23.e
    text: |-
      ondersteunende vakken, waaronder organisatie van de gezondheidszorg, gezondheidsrecht, beroepsoriëntatie en
      praktijkvoering, ethiek met betrekking tot het beroep van orthoptist, methoden en technieken van wetenschappelijk
      onderzoek alsmede kwaliteitszorg.
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel23
  - number: '24.1'
    text: |-
      De in [artikel 23, onder b][ref1], bedoelde beroepsvoorbereidende periode omvat het in het werkveld toepassen van
      tijdens de studie verworven kennis, inzicht en vaardigheden met betrekking tot het gebied van deskundigheid zoals
      omschreven in [artikel 25, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008975#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0008975#Artikel25
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0008975
        artikel: '23'
        hoofdstuk: VII
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008975
        artikel: '25'
        hoofdstuk: VII
        paragraaf: '3'
  - number: '24.2'
    text: |-
      De beroepsvoorbereidende periode vindt plaats onder begeleiding van een daartoe door de instelling aangewezen
      docent en wordt doorgebracht onder toezicht van een orthoptist.
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel24
  - number: '24.3'
    text: |-
      De beroepsvoorbereidende periode omvat 30 studiepunten die behaald worden in de tweede helft van de opleiding en is
      gelijkelijk verdeeld over twee verschillende instellingen van gezondheidszorg.
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel24
  - number: '25.1'
    text: 'Tot het gebied van deskundigheid van de orthoptist wordt gerekend het op verwijzing van een oogarts of huisarts:'
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel25
  - number: 25.1.a
    text: |-
      onderzoeken van de patiënt op de aanwezigheid van monoculaire en binoculaire functies en van stoornissen in het
      monoculaire en binoculaire zien met behulp van daartoe geëigende apparatuur of door het toedienen van in het kader
      van het onderzoek passende oogdruppels, en op basis van de verkregen gegevens opstellen van een behandelplan;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel25
  - number: 25.1.b
    text: 'het behandelen van stoornissen in het monoculaire of binoculaire zien van de patiënt door middel van:'
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel25
  - number: 25.1.b.1°
    text: het geven van instructie en advies aan de patiënt aangaande het monoculaire en binoculaire zien;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel25
  - number: 25.1.b.2°
    text: oefentherapie met orthoptische hulpmiddelen en apparatuur;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel25
  - number: 25.1.b.3°
    text: |-
      amblyopiebehandeling met behulp van occlusiemateriaal, accomodatieverlammende oogdruppels of speciaal daartoe
      voorgeschreven brillenglazen;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel25
  - number: 25.1.b.4°
    text: het aanmeten van brillenglazen of speciale brilcorrecties;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel25
  - number: 25.1.c
    text: adviseren aan de oogarts inzake de indicatiestelling voor operatieve oogspiercorrecties.
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel25
  - number: '25.2'
    text: |-
      De verwijzing, bedoeld in het eerste lid, geschiedt schriftelijk, is gedateerd en ondertekend door de betrokken
      oogarts of huisarts en bevat ten minste de door deze, voor het door de orthoptist onderzoeken en behandelen van de
      patiënt, relevant geachte diagnostische gegevens.
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel25
  - number: '26'
    text: |-
      Het recht tot het voeren van de titel van podotherapeut is voorbehouden aan degene aan wie een getuigschrift is
      uitgereikt waaruit blijkt dat betrokkene met goed gevolg het afsluitende examen heeft afgelegd van een opleiding
      voor podotherapie die is opgenomen in het Centraal register opleidingen hoger onderwijs en die voldoet aan het in
      [de artikelen 27][ref1] en [28][ref2] gestelde.


      [ref1]: https://wetten.overheid.nl/BWBR0008975#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0008975#Artikel28
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0008975
        artikel: '27'
        hoofdstuk: VIII
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008975
        artikel: '28'
        hoofdstuk: VIII
        paragraaf: '2'
  - number: '27'
    text: |-
      Een opleiding als bedoeld in [artikel 26][ref1] omvat ten minste de volgende onderdelen:


      [ref1]: https://wetten.overheid.nl/BWBR0008975#Artikel26
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0008975
        artikel: '26'
        hoofdstuk: VIII
        paragraaf: '1'
  - number: 27.a
    text: 'het centrale vakgebied podotherapie, omvattende ten minste:'
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel27
  - number: 27.a.1°
    text: |-
      onderzoeken en behandelen van de patiënt in het kader van het gebied van deskundigheid zoals omschreven in
      [artikel 29][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008975#Artikel29
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0008975
        artikel: '29'
        hoofdstuk: VIII
        paragraaf: '3'
  - number: 27.a.2°
    text: theorie en praktijk van de podotherapie;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel27
  - number: 27.a.3°
    text: schoenkennis;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel27
  - number: 27.a.4°
    text: toegepaste biomechanica;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel27
  - number: 27.b
    text: de beroepsvoorbereidende periode in het werkveld en klinische patiëntenbehandeling;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel27
  - number: 27.c
    text: |-
      het medische vakgebied, waaronder anatomie, fysiologie, algemene en speciële pathologie, farmacologie, biomechanica
      en biochemie;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel27
  - number: 27.d
    text: |-
      vakken op het gebied van gedrags- en maatschappijwetenschappen, waaronder gesprekstechnieken en voorlichting,
      gezondheidskunde en hygiëne;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel27
  - number: 27.e
    text: |-
      ondersteunende vakken, waaronder organisatie van de gezondheidszorg, gezondheidsrecht, beroepsoriëntatie
      en praktijkvoering, ethiek met betrekking tot het beroep van podotherapeut, methoden en technieken van
      wetenschappelijk onderzoek alsmede kwaliteitszorg.
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel27
  - number: '28.1'
    text: |-
      De in [artikel 27, onder b][ref1], bedoelde beroepsvoorbereidende periode omvat het in het werkveld toepassen van
      tijdens de studie verworven kennis, inzicht en vaardigheden met betrekking tot het gebied van deskundigheid van de
      podotherapeut zoals omschreven in [artikel 29, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008975#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0008975#Artikel29
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0008975
        artikel: '27'
        hoofdstuk: VIII
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008975
        artikel: '29'
        hoofdstuk: VIII
        paragraaf: '3'
  - number: '28.2'
    text: |-
      De in [artikel 27, onder b][ref1], bedoelde klinische patiëntenbehandeling is een aan de instelling gebonden
      onderwijsactiviteit, waarbij studenten oefenen op patiënten of proefpersonen.


      [ref1]: https://wetten.overheid.nl/BWBR0008975#Artikel27
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0008975
        artikel: '27'
        hoofdstuk: VIII
        paragraaf: '2'
  - number: '28.3'
    text: |-
      De beroepsvoorbereidende periode en de klinische patiëntenbehandeling vinden plaats onder begeleiding van een
      daartoe door de instelling aangewezen docent en worden doorgebracht onder toezicht van een podotherapeut.
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel28
  - number: '28.4'
    text: |-
      De beroepsvoorbereidende periode en de klinische patiëntenbehandeling omvatten 30 studiepunten die behaald
      worden in de tweede helft van de opleiding; de beroepsvoorbereidende periode is gelijkelijk verdeeld over twee
      verschillende instellingen van gezondheidszorg.
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel28
  - number: '29.1'
    text: 'Tot het gebied van deskundigheid van de podotherapeut wordt gerekend het op verwijzing van een arts:'
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel29
  - number: 29.1.a
    text: |-
      onderzoeken van de patiënt of en in hoeverre er sprake is van een afwijking van dan wel een belemmering in de stand
      of de functie van de voet, en op basis van de verkregen gegevens opstellen van een behandelplan;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel29
  - number: 29.1.b
    text: |-
      behandelen van de patiënt met als doel het opheffen, verminderen of compenseren van stoornissen in het functioneren
      van het steun- en bewegingsapparaat door middel van orthesen of prothesen of andere hulpmiddelen aan de voet, het
      uitwendig bestrijden van aan de voet aanwezige huidaandoeningen, het voorkomen of bestrijden van nagelafwijkingen
      dan wel het geven van advies.
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel29
  - number: '29.2'
    text: |-
      De verwijzing, bedoeld in het eerste lid, geschiedt schriftelijk, is gedateerd en ondertekend door de betrokken
      arts en bevat ten minste de door deze, voor het door de podotherapeut onderzoeken en behandelen van de patiënt,
      relevant geachte diagnostische gegevens.
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel29
  - number: '30'
    text: Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel30
  - number: '31'
    text: |-
      Dit besluit wordt aangehaald als: Besluit diëtist, ergotherapeut, logopedist, mondhygiënist, oefentherapeut,
      orthoptist en podotherapeut.
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel31
