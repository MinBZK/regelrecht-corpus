  - number: 1.a
    text: |-
      Centraal register opleidingen hoger onderwijs: het register als bedoeld in
      [artikel 6.13 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel6
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '6'
  - number: 1.b
    text: |-
      instelling: een instelling als bedoeld in [artikel 1.8][ref1] dan wel aangewezen krachtens
      [artikel 1.11 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel1
