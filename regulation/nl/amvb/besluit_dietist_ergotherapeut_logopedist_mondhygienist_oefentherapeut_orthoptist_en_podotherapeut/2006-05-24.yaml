  - number: 7.a.2°
    text: theorie en praktijk van de ergotherapie;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel7
  - number: 7.a.3°
    text: |-
      analyse van activiteiten op het gebied van zelfredzaamheid, productiviteit en ontspanning van de patiënt, met name
      ten aanzien van de zingevende, ergonomische, materiaaltechnische en vormgevingsaspecten;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel7
  - number: 7.a.4°
    text: aanpassingen en voorzieningen in leef-, woon- en werksituatie;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel7
  - number: 7.b
    text: de beroepsvoorbereidende periode in het werkveld;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel7
  - number: 7.c
    text: |-
      het medisch-biologische vakgebied, waaronder kinesiologie, algemene pathologie, speciële pathologie,
      revalidatiegeneeskunde, geriatrie en psychiatrie;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel7
  - number: 7.d
    text: |-
      vakken op het gebied van de gedrags- en maatschappijwetenschappen, waaronder psychologie, agologie, sociologie,
