    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel7
  - number: '8.1'
    text: |-
      De in [artikel 7, onder b][ref1], bedoelde beroepsvoorbereidende periode omvat het in het werkveld toepassen van
      tijdens de studie verworven kennis, inzicht en vaardigheden met betrekking tot het gebied van deskundigheid van de
      ergotherapeut zoals omschreven in [artikel 9, eerste lid, onder a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008975#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0008975#Artikel9
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel8
