        artikel: '4'
        hoofdstuk: II
        paragraaf: '2'
  - number: '3'
    text: |-
      Een opleiding als bedoeld in [artikel 2][ref1] omvat ten minste de volgende onderdelen:


      [ref1]: https://wetten.overheid.nl/BWBR0008975#Artikel2
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008975
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: 3.a
    text: 'het centrale vakgebied diëtetiek en voedingswetenschappen, omvattende ten minste:'
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel3
  - number: 3.a.1°
    text: |-
      onderzoeken en behandelen van de patiënt in het kader van het gebied van deskundigheid zoals omschreven in
      [artikel 5][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008975#Artikel5
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008975
        artikel: '5'
        hoofdstuk: II
        paragraaf: '3'
  - number: 3.a.2°
    text: diëet- en voedingsleer;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel3
  - number: 3.a.3°
    text: theoretische en praktische voedselbereiding;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel3
  - number: 3.a.4°
    text: levensmiddelenleer;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel3
  - number: 3.a.5°
    text: scheikunde;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel3
  - number: 3.b
    text: de beroepsvoorbereidende periode in het werkveld;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel3
  - number: 3.c
    text: |-
      het medisch-biologische vakgebied, waaronder biologie, microbiologie, anatomie, fysiologie, biochemie en patho-
      biochemie, pathologie en gezondheidskunde;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel3
  - number: 3.d
    text: |-
      vakken op het gebied van de gedrags- en maatschappijwetenschappen, waaronder psychologie, sociologie, communicatie
      en voorlichtingskunde, gesprekstechnieken en didactiek;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel3
  - number: 3.e
    text: |-
      ondersteunende vakken, waaronder organisatie van de gezondheidszorg, gezondheidsrecht, beroepsoriëntatie en
      praktijkvoering, ethiek met betrekking tot het beroep van diëtist, methoden en technieken van wetenschappelijk
      onderzoek alsmede kwaliteitszorg.
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel3
  - number: '4.1'
    text: |-
      De in [artikel 3, onder b][ref1], bedoelde beroepsvoorbereidende periode omvat het in het werkveld toepassen van
      tijdens de studie verworven kennis, inzicht en vaardigheden met betrekking tot het gebied van deskundigheid zoals
      omschreven in [artikel 5, eerste lid, onder a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008975#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008975#Artikel5
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008975
        artikel: '3'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008975
        artikel: '5'
        hoofdstuk: II
        paragraaf: '3'
  - number: '4.2'
    text: |-
      De beroepsvoorbereidende periode vindt plaats onder begeleiding van een daartoe door de instelling aangewezen
      docent en wordt doorgebracht onder toezicht van een diëtist.
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel4
  - number: '4.3'
    text: |-
      De beroepsvoorbereidende periode omvat 30 studiepunten die behaald worden in de tweede helft van de hoofdfase en is
      gelijkelijk verdeeld over twee verschillende instellingen van gezondheidszorg.
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel4
  - number: '5.1'
    text: 'Tot het gebied van deskundigheid van de diëtist wordt gerekend:'
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel5
  - number: 5.1.a
    text: 'het op verwijzing van een arts:'
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel5
  - number: 5.1.a.1°
    text: |-
      onderzoeken van de patiënt, gericht op het bepalen van diens voedingstoestand en op het vaststellen of localiseren
      van bepaalde voedingsgerelateerde ziektebeelden, en op basis van de verkregen gegevens opstellen van een
      behandelplan;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel5
  - number: 5.1.a.2°
    text: |-
      behandelen van de patiënt door toepassing van diëettherapie of het geven van diëetadvies, gericht op het opheffen,
      verminderen of compenseren van met voeding samenhangende of door voeding beïnvloedbare ziekten of klachten;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel5
  - number: 5.1.b
    text: |-
      het geven van voedings- en diëetvoorlichting aan een persoon, met als doel het voorkomen van met voeding
      samenhangende of door voeding beïnvloedbare ziekten of klachten.
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel5
  - number: '5.2'
    text: |-
      De verwijzing, bedoeld in het eerste lid, onder*a*, geschiedt schriftelijk, is gedateerd en ondertekend door de
      betrokken arts en bevat ten minste de door deze, voor het door de diëtist onderzoeken en behandelen van de patiënt,
      relevant geachte diagnostische gegevens.
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel5
  - number: '6'
    text: |-
      Het recht tot het voeren van de titel van ergotherapeut is voorbehouden aan degene aan wie een getuigschrift is
      uitgereikt waaruit blijkt dat betrokkene met goed gevolg het afsluitende examen heeft afgelegd van een opleiding
      voor ergotherapie die is opgenomen in het Centraal register opleidingen hoger onderwijs en die voldoet aan het in
      [de artikelen 7][ref1] en [8][ref2] gestelde.


      [ref1]: https://wetten.overheid.nl/BWBR0008975#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0008975#Artikel8
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel6
    references:
