        artikel: '1'
  - number: 1.c
    text: 'studiepunt: 40 uren studie;'
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel1
  - number: 1.d
    text: |-
      hoofdfase: de laatste 84 studiepunten in het geval van een driejarige opleiding dan wel de laatste 126 studiepunten
      in het geval van een vierjarige opleiding;
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel1
  - number: 1.e
    text: |-
      preventieve mondzorg: primaire preventie met betrekking tot de mondzorg en secundaire en tertiaire preventie op het
      gebied van de parodontologie en cariologie.
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel1
  - number: '2'
    text: |-
      Het recht tot het voeren van de titel van diëtist is voorbehouden aan degene aan wie een getuigschrift is
      uitgereikt waaruit blijkt dat betrokkene met goed gevolg het afsluitende examen heeft afgelegd van een opleiding
      voor voeding en diëtetiek die is opgenomen in het Centraal register opleidingen hoger onderwijs en die voldoet aan
      het in [de artikelen 3][ref1] en [4][ref2] gestelde.


      [ref1]: https://wetten.overheid.nl/BWBR0008975#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008975#Artikel4
    url: https://wetten.overheid.nl/BWBR0008975/2006-05-24#Artikel2
    references:
      - id: ref1
