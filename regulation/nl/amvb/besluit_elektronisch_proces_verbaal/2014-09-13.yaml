  - number: '2'
    text: |-
      Een elektronisch proces-verbaal is voorzien van een elektronische dagtekening en een gekwalificeerde elektronische
      handtekening, in een documentformaat dat voldoet aan het bij of krachtens de [Archiefwet 1995][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0007376
    url: https://wetten.overheid.nl/BWBR0029475/2014-09-13#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007376
  - number: '3'
    text: |-
      1 In aanvulling op de gegevens die op grond van [artikel 3 van het Besluit elektronische handtekeningen][ref1] in
      het gekwalificeerd certificaat zijn opgenomen, worden gegevens opgenomen over de organisatie waar de ambtenaar, aan
      wie het betreffende certificaat is afgegeven, werkzaam is.

      2 In afwijking van [artikel 3, onderdeel c, van het Besluit elektronische handtekeningen][ref2] kan van een
      pseudoniem slechts in bijzondere gevallen gebruik worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0015047#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0015047#Artikel3
    url: https://wetten.overheid.nl/BWBR0029475/2014-09-13#Artikel3
    references:
