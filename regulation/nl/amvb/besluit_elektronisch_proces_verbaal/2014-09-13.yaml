      - id: ref2
        bwb_id: BWBR0015047
        artikel: '3'
  - number: '4'
    text: |-
      1 Voor de omzetting langs elektronische weg zijn de eisen van toepassing die in [artikel 6][ref1] en
      [8 van het Archiefbesluit 1995][ref2] en [artikel 26b van de Archiefregeling][ref3] worden gesteld, teneinde het
      proces-verbaal waarvan een reproductie is gemaakt te vernietigen, waarbij de verantwoordelijke de zorgdrager is.

      2 De eisen van [artikel 6 van het Archiefbesluit 1995][ref4] zijn van overeenkomstige toepassing op een digitaal
      afschrift van het proces-verbaal, met dien verstande dat het originele proces-verbaal niet wordt vernietigd.


      [ref1]: https://wetten.overheid.nl/BWBR0007748#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007748#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0027041#Artikel26b
      [ref4]: https://wetten.overheid.nl/BWBR0007748#Artikel6
    url: https://wetten.overheid.nl/BWBR0029475/2014-09-13#Artikel4
