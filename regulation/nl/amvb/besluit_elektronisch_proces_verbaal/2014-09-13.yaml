        artikel: '6'
  - number: '5'
    text: >-
      1 De verantwoordelijke bewaart over de elektronische handtekening en dagtekening de in de bijlage bij dit besluit
      omschreven gegevens met het oog op de validatie.


      2 De gegevens, bedoeld in het eerste lid, worden tezamen met het elektronisch proces-verbaal bewaard gedurende de
      periode van bewaring van het elektronisch proces-verbaal.


      3 De gegevens, bedoeld in het tweede lid, worden op zodanige wijze bewaard dat op ieder moment de ongewijzigde
      staat daarvan kan worden aangetoond.
    url: https://wetten.overheid.nl/BWBR0029475/2014-09-13#Artikel5
  - number: '6'
    text: >-
      1 De verantwoordelijke die een elektronisch proces-verbaal heeft ontvangen verzendt onmiddellijk een bevestiging
      van ontvangst aan de verantwoordelijke die dit proces-verbaal heeft verzonden.


      2 De verantwoordelijke die het elektronisch proces-verbaal heeft verzonden bewaart de bevestiging van ontvangst,
      bedoeld in het eerste lid, gedurende een periode van vijf jaar.


      3 De verantwoordelijke die een elektronisch proces-verbaal heeft ontvangen, zorgt ervoor dat dit onverwijld wordt
      gevalideerd.


      4 Indien de validatie uitwijst dat de gecontroleerde waarden niet overeen komen, dan wordt dit onverwijld bericht
      aan de verantwoordelijke, die het elektronisch proces-verbaal heeft verzonden.


      5 De verantwoordelijke, die een elektronisch proces-verbaal heeft verzonden en aan wie een bericht is verzonden
      dat de gecontroleerde waarden niet overeen komen of dat een digitaal afschrift geen identieke weergave vormt van
      het proces-verbaal, is gehouden te voorzien in een elektronisch proces-verbaal dan wel een digitaal afschrift,
      overeenkomstig de eisen van dit besluit.
    url: https://wetten.overheid.nl/BWBR0029475/2014-09-13#Artikel6
  - number: '7'
    text: |-
      1 De verantwoordelijke treft technische en organisatorische maatregelen om het elektronisch proces-verbaal en de
      gegevens, bedoeld in de [artikelen 5][ref1] en [6][ref2], te beveiligen tegen misbruik, verlies, of onrechtmatige
      verwerking. Deze maatregelen garanderen, rekening houdend met de stand van de techniek en de kosten van de
      tenuitvoerlegging, een passend beveiligingsniveau, gelet op de risico’s die de verwerking en de aard van de
      gegevens met zich meebrengen.

      2 Het elektronisch proces-verbaal en de gegevens, bedoeld in de [artikelen 5][ref3] en [6][ref4], zijn uitsluitend
      toegankelijk voor personen die daarvoor zijn geautoriseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0029475#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0029475#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0029475#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0029475#Artikel6
