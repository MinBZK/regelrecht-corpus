preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Justitie van 29 september 2010, nr. 5669201/10/6;


    Gelet op artikel 153, tweede lid, van het Wetboek van Strafvordering;


    De Raad van State gehoord (advies van 3 december 2010, nr. W03.10.0476/II);


    Gezien het nader rapport van Onze Minister van Veiligheid en Justitie van 22 december 2010, nr. 5678816/10/6;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0029475/2014-09-13#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In dit besluit wordt verstaan onder:

      a. *elektronisch proces-verbaal:* proces-verbaal, bedoeld in [artikel 152][ref1] en
      [153, eerste lid, van het Wetboek van Strafvordering][ref2], dat langs elektronische weg is opgemaakt of dat langs
      elektronische weg is omgezet in een digitaal afschrift;

      b. *validatie:* vaststelling van de geldigheid van een elektronische handtekening, door het verifiëren van de
      geldigheid van het certificaat gerelateerd aan het moment van ondertekening en het verifiëren van de ongewijzigde
      staat van het document aan de hand van de ondertekening;

      c. *elektronische handtekening:* de handtekening, bedoeld in
      [artikel 15a, vierde lid, van Boek 3 van het Burgerlijk Wetboek][ref3];

      d. *gekwalificeerde elektronische handtekening:* elektronische handtekening gebaseerd
      op een gekwalificeerd certificaat en gegenereerd door een veilig middel voor het
      aanmaken van elektronische handtekeningen overeenkomstig de eisen, gesteld in
      [artikel 15a, tweede lid, onderdelen a tot en met f, van Boek 3 van het Burgerlijk Wetboek][ref4];

      e. *elektronische dagtekening:* een tijdstempel dat de datum en het tijdstip vermeldt van het moment van
      ondertekenen van een elektronisch proces-verbaal en dat is afgegeven overeenkomstig geldende normen en standaarden;

      f. *certificaat, gekwalificeerd certificaat, certificatiedienstverlener en veilig middel voor het aanmaken van
      elektronische handtekeningen:* het certificaat, het gekwalificeerd certificaat, de certificatiedienstverlener,
      respectievelijk het veilig middel voor het aanmaken van elektronische handtekeningen, bedoeld in
      [artikel 1.1, onderdelen ss, tt, uu, respectievelijk ww, van de Telecommunicatiewet][ref5].

      g. *verantwoordelijke:* het hoofd van de organisatie waar een ambtenaar werkzaam is die een elektronisch proces-
      verbaal opmaakt, langs elektronische weg omzet of ontvangt.

      2 Onder omzetting langs elektronische weg wordt verstaan het vervangen door een elektronische reproductie, teneinde
      de aldus vervangen bescheiden te vernietigen als bedoeld in [artikel 7 van de Archiefwet 1995][ref6].


