      een eerder aan de aanvrager afgegeven rijbewijs dat hetzij nog geldig is hetzij zijn geldigheid heeft verloren door
      het verstrijken van de geldigheidsduur.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel67d
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 67d.4
    text: |-
      Het derde lid is van overeenkomstige toepassing op aanvragen die betrekking hebben op rijbewijscategorie B met
      het oog op het verkrijgen van de bevoegdheid tot het besturen van een samenstel van een trekkend motorrijtuig van
      de categorie B en een aanhangwagen of oplegger met een toegestane maximum massa van meer dan 750 kg, waarbij de
      toegestane maximum massa van dit samenstel van trekkend motorrijtuig en aanhangwagen of oplegger meer bedraagt dan
      3500 kg, maar niet meer bedraagt dan 4250 kg.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel67d
