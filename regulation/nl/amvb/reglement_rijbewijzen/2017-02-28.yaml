  - number: 156j.1
    text: 'Het gedeelte van het praktijkexamen vakbekwaamheid dat niet op de openbare weg wordt afgelegd, kan worden afgelegd:'
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156j
  - number: 156j.1.a
    text: |-
      door personen die de leeftijd van zeventien jaren hebben bereikt indien het betreft een praktijkexamen
      vakbekwaamheid voor de rijbewijscategorieën C1, E bij C1, C en E bij C, of
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156j
  - number: 156j.1.b
    text: |-
      door personen die de leeftijd van 17 jaren hebben bereikt indien het betreft een praktijkexamen vakbekwaamheid
      voor de rijbewijscategorieën D1 en E bij D1 en door personen die de leeftijd van 20 jaren hebben bereikt indien het
      betreft een praktijkexamen vakbekwaamheid voor de rijbewijscategorieën D en E bij D.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156j
  - number: 156j.2
    text: |-
      Het gedeelte van het praktijkexamen vakbekwaamheid dat op de openbare weg wordt afgelegd kan slechts worden
      afgelegd:
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156j
  - number: 156j.2.a
    text: |-
      door personen die de leeftijd van achttien jaren hebben bereikt indien het betreft een praktijkexamen
      vakbekwaamheid voor rijbewijscategorieën C1, E bij C1, C en E bij C, of
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156j
  - number: 156j.2.b
    text: |-
      door personen die de leeftijd van 18 jaren hebben bereikt indien het betreft een praktijkexamen vakbekwaamheid
      voor de rijbewijscategorieën D1 en E bij D1 en door personen die de leeftijd van 21 jaren hebben bereikt indien het
      betreft een praktijkexamen vakbekwaamheid voor de rijbewijscategorieën D en E bij D.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156j
  - number: 156k.1
    text: |-
      Voor toelating tot het praktijkexamen vakbekwaamheid op de openbare weg zijn de voorwaarden voor toelating
      voor het praktijkexamen voor de rijbewijscategorieën C1, E bij C1, C, E bij C, D1, E bij D1, D en E bij D van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156k
  - number: 156k.2
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld inzake de toegang tot het praktijkexamen
      vakbekwaamheid.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156k
  - number: 156ka.1
    text: |-
      Het praktijkexamen vakbekwaamheid voor rijbewijscategorie C1 bestaat uit een rijproef die geïntegreerd wordt
      afgelegd met het praktijkexamen voor het rijbewijs C1, en uit de praktijktoetsen vakbekwaamheid 1 en 2. De
      praktijktoets vakbekwaamheid 1 bestaat uit een praktische test. De praktijktoets vakbekwaamheid 2 kan op een
      besloten terrein of een simulator worden afgelegd.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156ka
  - number: 156ka.2
    text: |-
      De eisen voor het praktijkexamen vakbekwaamheid voor rijbewijscategorie C1 worden bij ministeriële regeling
      vastgesteld en betreffen in ieder geval:
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156ka
  - number: 156ka.2.a
    text: bedrevenheid in rationeel rijden op basis van veiligheidsvoorschriften;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156ka
  - number: 156ka.2.b
    text: |-
      het kunnen toepassen van voorschriften omtrent de onderwerpen die voor bestuurders van motorvoertuigen van die
      categorie zijn opgenomen in bijlage I van de richtlijn vakbekwaamheid bestuurders;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156ka
  - number: 156ka.2.c
    text: |-
      het op juiste en veilige wijze kunnen toepassen van kennis en vaardigheden met betrekking tot een aantal bijzondere
      onderwerpen die voor bestuurders van motorvoertuigen van die categorie zijn opgenomen in bijlage I van de richtlijn
      vakbekwaamheid bestuurders.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156ka
  - number: 156ka.3
    text: |-
      De aanvrager die reeds beschikt over een rijbewijs van de categorie C1 of C, dat hetzij nog geldig is hetzij zijn
      geldigheid heeft verloren door het verstrijken van de geldigheidsduur, verwerft het praktijkexamen vakbekwaamheid
      voor rijbewijscategorie C1 door in aanvulling op dat rijbewijs met goed gevolg de bij ministeriële regeling
      vastgestelde onderdelen van dat praktijkexamen af te leggen.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156ka
