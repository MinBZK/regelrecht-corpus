      rijbewijscategorie D1 en de aanvrager een op het beroep van chauffeur goederenvervoer gerichte beroepsopleiding als
      bedoeld in de [Wet educatie en beroepsonderwijs][ref1] volgt, met een rijbewijs B gelijkgesteld een ten aanzien van
      de aanvrager in het rijbewijzenregister geregistreerde verklaring van rijvaardigheid voor de rijbewijscategorie B,
      waarbij de datum van registratie niet langer dan drie jaar voor de dag van het examen mag liggen.


