  - number: '186.1'
    text: |-
      Voor de toepassing van [artikel 67, derde lid][ref1], wordt onder een rijbewijs B, al dan niet voorzien van een
      bij ministeriële regeling vastgestelde codering waaruit blijkt dat de houder het praktijkexamen heeft afgelegd
      in een motorrijtuig met automatische schakeling, dat zijn geldigheid heeft verloren door het verstrijken van de
      geldigheidsduur mede verstaan een op basis van de Wegenverkeerswet afgegeven rijbewijs B, al dan niet voorzien van
      een bij ministeriële regeling vastgestelde codering waaruit blijkt dat de houder het praktijkexamen heeft afgelegd
      in een motorrijtuig met automatische schakeling, dat na 30 juni 1985 zijn geldigheid heeft verloren door het
      verstrijken van de geldigheidsduur en dat niet behoort tot een bij ministeriële regeling aangewezen model.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel67
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel186
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '67'
        hoofdstuk: III
        paragraaf: '4'
  - number: '186.2'
    text: |-
      Voor de toepassing van [artikel 67, vierde lid][ref1], wordt onder een rijbewijs voor het trekkende motorrijtuig,
      al dan niet voorzien van een bij ministeriële regeling vastgestelde codering waaruit blijkt dat de houder
      van dat rijbewijs het praktijkexamen heeft afgelegd in een motorrijtuig met automatische schakeling, dat
      zijn geldigheid heeft verloren door het verstrijken van de geldigheidsduur mede verstaan een op basis van de
      [Wegenverkeerswet][ref2] afgegeven rijbewijs voor het trekkende motorrijtuig, al dan niet voorzien van een bij
      ministeriële regeling vastgestelde codering waaruit blijkt dat de houder van dat rijbewijs het praktijkexamen heeft
      afgelegd in een motorrijtuig met automatische schakeling, dat na 30 juni 1985 zijn geldigheid heeft verloren door
      het verstrijken van de geldigheidsduur en dat niet behoort tot een bij ministeriële regeling aangewezen model.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel67
      [ref2]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel186
