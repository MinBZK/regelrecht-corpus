  - number: '55.3'
    text: Het tweede lid, onderdeel a, geldt niet indien de aanvraag langs geautomatiseerde weg wordt ingediend.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel55
  - number: '55.4'
    text: |-
      Bij de aanvraag van een verklaring van rijvaardigheid raadpleegt het CBR de in de basisregistratie personen
      opgenomen persoonsgegevens van de aanvrager.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel55
  - number: '56.1'
    text: |-
      Het theorie-examen voor de rijbewijscategorieën AM en T kan slechts worden afgelegd door personen die de leeftijd
      van vijftien jaren en zes maanden hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel56
  - number: '56.2'
    text: |-
      Het theorie-examen voor de rijbewijscategorie A kan slechts worden afgelegd door personen die de leeftijd van 17
      jaren hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel56
  - number: '56.3'
    text: |-
      Het theorie-examen voor de rijbewijscategorie B kan slechts worden afgelegd door personen die de leeftijd van
      achttien jaren hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel56
  - number: '56.4'
    text: |-
      Het onderdeel rijbewijs/vakbekwaamheid 1 en het onderdeel rijbewijs 2 van het theorie-examen voor de
      rijbewijscategorie C1 kunnen slechts worden afgelegd door personen die de leeftijd van 17 jaren hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel56
  - number: '56.5'
    text: |-
      Het onderdeel rijbewijs/vakbekwaamheid 1 en het onderdeel rijbewijs 2 van het theorie-examen voor de
      rijbewijscategorie C kunnen slechts worden afgelegd door personen die de leeftijd van 17 jaren hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel56
  - number: '56.6'
    text: |-
      Het onderdeel rijbewijs/vakbekwaamheid 1 en het onderdeel rijbewijs 2 van het theorie-examen voor de
      rijbewijscategorie D1 kunnen slechts worden afgelegd door personen die de leeftijd van 17 jaren hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel56
  - number: '56.7'
    text: |-
      Het onderdeel rijbewijs/vakbekwaamheid 1 van het theorie-examen voor de rijbewijscategorie D kan slechts worden
      afgelegd door personen die de leeftijd van 17 jaren hebben bereikt. Het onderdeel rijbewijs 2 van het theorie-
      examen voor de rijbewijscategorie D kan slechts worden afgelegd door personen die de leeftijd van 20 jaren hebben
      bereikt.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel56
  - number: '57'
    text: De kosten van het theorie-examen worden vastgesteld door het CBR onder goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel57
  - number: '58'
    text: |-
      De kosten van het theorie-examen dienen door de aanvrager te worden voldaan door aankoop van een aanvraagkaart
      volgens door het CBR vastgesteld model door het verschuldigde bedrag over te maken op een door het CBR aangewezen
      bankrekening.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel58
  - number: '59.1'
    text: 'Voor toelating tot het theorie-examen dienen te worden overgelegd:'
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel59
  - number: 59.1.a
    text: |-
      een op naam van de aanvrager gesteld identiteitsbewijs als bedoeld in
      [artikel 1, eerste lid, onder 1°, 2° of 3°, van de Wet op de identificatieplicht][ref1] dan wel een eerder
      aan de aanvrager afgegeven rijbewijs dat hetzij nog geldig is hetzij zijn geldigheid heeft verloren door het
      verstrijken van de geldigheidsduur;


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 59.1.b.I
    text: |-
      indien aan de aanvrager in Nederland de status van diplomatiek of consulair ambtenaar is toegekend of de aanvrager
      behoort tot het gezin van een persoon aan wie in Nederland de status van diplomatiek of consulair ambtenaar is
      toegekend, een door Onze Minister van Buitenlandse Zaken afgegeven verklaring waaruit zulks blijkt;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel59
  - number: 59.1.b.II
    text: |-
      indien de aanvrager lid is van een in het kader van het op 19 juni 1951 te Londen gesloten Verdrag tussen de Staten
      die partij zijn bij het Noord-Atlantisch Verdrag, nopens de rechtspositie van hun krijgsmachten, in Nederland
      gelegerde krijgsmacht, lid is van de tot die krijgsmacht behorende civiele dienst of behoort tot het gezin van
      een lid van een krijgsmacht als hiervoor bedoeld of tot het gezin van een tot de civiele dienst van zodanige
      krijgsmacht behorende persoon, een door de betrokken basiscommandant ondertekende verklaring waaruit zulks blijkt;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel59
  - number: 59.1.c
    text: |-
      indien de aanvraag wordt gedaan met het oog op de aanvraag van een rijbewijs, bedoeld
      in [artikel 42a, eerste lid][ref1], dient de aanvrager tevens te overleggen de in
      [artikel 42b, tweede lid, onderdeel b][ref2], bedoelde verklaring;


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel42a
      [ref2]: https://wetten.overheid.nl/BWBR0008074#Artikel42b
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: 42a
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008074
        artikel: 42b
        hoofdstuk: II
        paragraaf: '2'
  - number: 59.1.d
    text: |-
      indien de aanvraag wordt gedaan met het oog op de aanvraag van een rijbewijs, bedoeld in de
      [artikelen 41b, eerste lid][ref1], of [41d, eerste lid][ref2], dient de aanvrager tevens te overleggen de in
      [artikel 42b, tweede lid, onderdeel b][ref3], bedoelde verklaring.


