        bwb_id: BWBR0006073
  - number: 2.1.a.I
    text: |-
      die bestuurder in het bezit is van een niet langer dan een jaar en zes maanden van tevoren afgegeven verklaring dat
      de bestuurder is geslaagd voor het theorie-examen voor de rijbewijscategorie AM;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel2
