  - number: '63.3'
    text: |-
      De aanvrager die aantoont te beschikken over een rijbewijs voor de categorie C1 dat nog geldig is of dat ongeldig
      is geworden door het verstrijken van de geldigheidsduur of een geldig rijbewijs C1, afgegeven door het daartoe
      bevoegde gezag in een andere lidstaat van de Europese Unie of in een andere staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte of Zwitserland, verwerft het theorie-examen voor de categorie C door in
      aanvulling op dat rijbewijs met goed gevolg de bij ministeriële regeling vastgestelde onderdelen van dat theorie-
      examen af te leggen.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel63
  - number: '63.4'
    text: |-
      Het derde lid is niet van toepassing op aanvragers die in het bezit zijn van een rijbewijs C1 dat blijkens de
      daarop aangegeven codering niet de bevoegdheid geeft tot het besturen van een motorrijtuig van de categorie C1
      dat onder Verordening (EEG) nr. 3821/85 valt, respectievelijk een rijbewijs C1 afgegeven door het daartoe bevoegde
      gezag in een andere lidstaat van de Europese Unie of in een staat die partij is bij de Overeenkomst betreffende de
      Europese Economische Ruimte of Zwitserland dat blijkens de daarop aangegeven codering niet de bevoegdheid geeft tot
      het besturen van een motorrijtuig van de categorie C1 dat onder Verordening (EEG) nr. 3821/85 valt.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel63
