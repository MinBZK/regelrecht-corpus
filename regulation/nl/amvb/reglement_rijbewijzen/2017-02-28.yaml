      aanvraag betrekking heeft categorie AM is, dan bestaat het onderzoek naar de rijvaardigheid uit een theorie-examen
      en een praktijkexamen voor de categorie AM.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel42a
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel53a
