  - number: 67g.2
    text: |-
      Voor de toepassing van het eerste lid, onderdeel a, wordt met de registratie dat de aanvrager is geslaagd
      voor het theorie-examen voor de rijbewijscategorie D1 gelijkgesteld een door het daartoe bevoegde militaire
      gezag niet langer dan een jaar en zes maanden voor de dag van het examen afgegeven theoriecertificaat voor de
      rijbewijscategorie D1.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel67g
  - number: 67g.3
    text: |-
