      voor rijbewijscategorie D1 door in aanvulling op dat rijbewijs met goed gevolg de bij ministeriële regeling
      vastgestelde onderdelen van dat praktijkexamen af te leggen.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156la
  - number: 156m.1
    text: |-
      Het praktijkexamen vakbekwaamheid voor rijbewijscategorie D bestaat uit een rijproef die geïntegreerd wordt
      afgelegd met het praktijkexamen voor het rijbewijs D, en uit de praktijktoetsen vakbekwaamheid 1 en 2. De
      praktijktoets vakbekwaamheid 1 bestaat uit een praktische toets. De praktijktoets vakbekwaamheid 2 kan op een
      besloten terrein of een simulator worden afgelegd.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156m
  - number: 156m.2
    text: |-
      De eisen voor het praktijkexamen vakbekwaamheid voor rijbewijscategorie D worden bij ministeriële regeling
      vastgesteld en betreffen in ieder geval:
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156m
  - number: 156m.2.a
    text: bedrevenheid in rationeel rijden op basis van veiligheidsvoorschriften;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156m
  - number: 156m.2.b
    text: |-
      het kunnen toepassen van voorschriften omtrent de onderwerpen die voor bestuurders van motorvoertuigen van die
      categorie zijn opgenomen in bijlage I van de richtlijn vakbekwaamheid bestuurders;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156m
  - number: 156m.2.c
    text: |-
      het op juiste en veilige wijze kunnen toepassen van kennis en vaardigheden met betrekking tot een aantal bijzondere
      onderwerpen die voor bestuurders van motorvoertuigen van die categorie zijn opgenomen in bijlage I van de richtlijn
      vakbekwaamheid bestuurders.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156m
  - number: 156m.3
    text: |-
      De aanvrager die reeds beschikt over een rijbewijs van de categorie D1 of D, dat hetzij nog geldig is hetzij zijn
      geldigheid heeft verloren door het verstrijken van de geldigheidsduur, verwerft het praktijkexamen vakbekwaamheid
      voor rijbewijscategorie D door in aanvulling op dat rijbewijs met goed gevolg de bij ministeriële regeling
      vastgestelde onderdelen van dat praktijkexamen af te leggen.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156m
  - number: 156n.1
    text: |-
      Het CBR kan een rij-instructeur die ingevolge de [Wet rijonderricht motorrijtuigen 1993][ref1] bevoegd is tot
      het geven van rijonderricht en die voldoet aan de door haar opgestelde eisen, aanwijzen tot het afnemen van
      praktijktoetsen vakbekwaamheid 1 en 2 voor de rijbewijscategorieën C1, C, D1 en D.


      [ref1]: https://wetten.overheid.nl/BWBR0006073
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156n
    references:
      - id: ref1
        bwb_id: BWBR0006073
  - number: 156n.2
    text: Een rij-instructeur als bedoeld in het eerste lid neemt de praktijktoetsen af met gebruikmaking van de exameneisen.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156n
  - number: 156n.3
    text: |-
      Een rij-instructeur als bedoeld in het eerste lid meldt aan het CBR binnen de door deze vastgestelde termijn of een
      aanvrager voldoet aan de exameneisen.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156n
  - number: 156o
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld ter uitvoering van de [artikelen 156g tot en met 156n][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel156g
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156o
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: 156g
        hoofdstuk: VIIa
        paragraaf: '4'
  - number: 156p
    text: |-
      Op een praktijktoets vakbekwaamheid bedoeld in hoofdstuk VIIA zijn de [artikelen 78][ref1], [81][ref2],
      [82, eerste lid][ref3], en [84][ref4] van overeenkomstige toepassing met dien verstande dat in plaats van
      «rijproef» telkens wordt gelezen «praktijktoets vakbekwaamheid».


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel78
      [ref2]: https://wetten.overheid.nl/BWBR0008074#Artikel81
      [ref3]: https://wetten.overheid.nl/BWBR0008074#Artikel82
      [ref4]: https://wetten.overheid.nl/BWBR0008074#Artikel84
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156p
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '78'
        hoofdstuk: III
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0008074
        artikel: '81'
        hoofdstuk: III
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0008074
        artikel: '82'
        hoofdstuk: III
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0008074
        artikel: '84'
        hoofdstuk: III
        paragraaf: '4'
  - number: 156q.1
    text: 'De volgende bestuurders zijn vrijgesteld van het behalen van een getuigschrift van vakbekwaamheid:'
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156q
  - number: 156q.1.a
    text: |-
      een bestuurder die houder is van een geldig rijbewijs van één van de categorieën D1, E bij D1, D of E bij D of van
      een als gelijkwaardig erkend rijbewijs, mits dat rijbewijs uiterlijk op 9 september 2008 is afgegeven;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156q
  - number: 156q.1.b
    text: |-
      een bestuurder die houder is van een geldig rijbewijs van één van de categorieën C1, E bij C1, C of E bij C of van
      een als gelijkwaardig erkend rijbewijs, mits dat rijbewijs uiterlijk op 9 september 2009 is afgegeven.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156q
  - number: 156q.2
    text: |-
      Een bestuurder als bedoeld in [artikel 151d, tweede lid, onderdeel a, van de wet][ref1] is bij het behalen van een
      getuigschrift van vakbekwaamheid vrijgesteld van het afleggen van bij ministeriële regeling te bepalen onderdelen
      van het vakbekwaamheidsexamen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel151d
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156q
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 151d
  - number: 156q.3
    text: |-
      Een bestuurder als bedoeld in [artikel 151d, tweede lid, onderdeel b, van de wet][ref1] die een op het beroep van
      chauffeur goederenvervoer gerichte beroepsopleiding als bedoeld in de Wet educatie en beroepsonderwijs of een bij
      ministeriële regeling daaraan gelijkwaardig verklaarde opleiding volgt, is éénmaal voor een aaneengesloten periode
      van maximaal drie jaar voor Nederlands grondgebied vrijgesteld van de verplichting over een getuigschrift van
      vakbekwaamheid te beschikken indien hij:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel151d
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156q
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 151d
  - number: 156q.3.a
    text: |-
      een door het bevoegd gezag van de opleiding gewaarmerkte verklaring kan overleggen waaruit blijkt sinds welke datum
      hij de opleiding volgt, en
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156q
  - number: 156q.3.b
    text: |-
      hij door middel van een geldig bewijs van inschrijving kan aantonen dat hij nog staat ingeschreven bij de
      opleiding.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156q
  - number: 156q.4
    text: |-
      Een bestuurder die houder is van een getuigschrift van vakbekwaamheid voor één van de in het eerste lid, onderdeel
      a, bedoelde rijbewijscategorieën is vrijgesteld van de verplichting een dergelijk getuigschrift te behalen voor de
      overige in genoemd onderdeel vermelde rijbewijscategorieën.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156q
  - number: 156q.5
    text: |-
      Een bestuurder die houder is van een getuigschrift van vakbekwaamheid voor één van de in het eerste lid, onderdeel
      b, bedoelde rijbewijscategorieën is vrijgesteld van de verplichting een dergelijk getuigschrift te behalen voor de
      overige in genoemd onderdeel vermelde rijbewijscategorieën.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156q
  - number: 156r.1
    text: |-
      Het stelsel van nascholing, bedoeld in [hoofdstuk VIIA van de wet][ref1], bevat de verplichting van de bestuurder
      om bij een of meer erkende opleidingscentra per vijf jaren 35 uur nascholingscursussen te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukVIIA
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156r
    references:
      - id: ref1
        bwb_id: BWBR0006622
        hoofdstuk: VIIA
  - number: 156r.2
    text: |-
      Voor bestuurders bedoeld in [artikel 156q, eerste lid][ref1], wordt de periode waarin de eerste nascholing kan
      worden gevolgd verlengd tot zeven jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel156q
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156r
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: 156q
        hoofdstuk: VIIa
        paragraaf: '6'
  - number: 156s.1
    text: |-
      De nascholing bestaat uit nascholingscursussen die worden aangeboden in eenheden van ten minste 7 uur, waarin de
      onderwerpen die zijn opgenomen in bijlage I van de richtlijn vakbekwaamheid bestuurders opnieuw worden bestudeerd
      en uitgediept.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156s
  - number: 156s.2
    text: |-
      Het raamwerk van nascholingscursussen wordt periodiek vastgesteld door het CBR, die daarbij rekening houdt met de
      bij ministeriële regeling vastgestelde eisen voor nascholingscursussen.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156s
  - number: 156s.3
    text: Bij de nascholingscursussen kan gebruik worden gemaakt van simulatoren.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156s
  - number: 156t.1
    text: |-
      Een bestuurder die tegen overlegging van bewijsstukken, afgegeven door bevoegde autoriteiten van andere lidstaten
      van de Europese Gemeenschap, ten genoegen van het CBR kan aantonen dat hij een gedeelte van de nascholing aldaar
      heeft gevolgd, kan het voor hem nog resterende gedeelte van de nascholing in Nederland afronden.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156t
  - number: 156t.2
    text: |-
      Het CBR kan bij de toetsing van de in het eerste lid bedoelde bewijsstukken de hulp van de Dienst Wegverkeer
      inroepen.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156t
  - number: 156t.3
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld inzake de toekenning van de nascholing.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156t
  - number: 156u.1
    text: |-
      Een erkend opleidingscentrum meldt binnen de door het CBR vastgestelde termijn voorafgaand aan de dag waarop een
      nascholingscursus wordt gehouden de voorgenomen cursus aan het CBR. De melding bevat de door het CBR bepaalde
      onderwerpen.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156u
  - number: 156u.2
    text: |-
      Een erkend opleidingscentrum meldt binnen de door het CBR vastgestelde termijn aan deze het feit dat een bestuurder
      een nascholingsonderdeel heeft gevolgd.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156u
  - number: 156v
    text: |-
      Een bestuurder die houder is van een getuigschrift van nascholing voor één van de rijbewijscategorieën C, C1, D,
      D1, E bij C, E bij C1, E bij D of E bij D1 is vrijgesteld van de verplichting een getuigschrift van nascholing te
      behalen voor de overige genoemde rijbewijscategorieën.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156v
  - number: 156w.1
    text: |-
      Het CBR kan aan een natuurlijke persoon of rechtspersoon een erkenning verlenen waardoor deze gerechtigd is
      nascholing te organiseren.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156w
  - number: 156w.2
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden vastgesteld die aan een erkenning worden verbonden en kunnen
      met betrekking tot die voorschriften regels worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156w
  - number: 156x.1
    text: |-
      Een erkenning als opleidingscentrum voor het verrichten van nascholing wordt op aanvraag en tegen betaling, op
      de door het CBR vastgestelde wijze, van het daarvoor door deze instantie vastgestelde tarief verleend indien is
      voldaan aan de bij ministeriële regeling gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156x
  - number: 156x.2
    text: 'De in het eerste lid bedoelde eisen kunnen onder meer betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156x
  - number: 156x.2.a
    text: de certificering van de aangeboden nascholingscursussen;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156x
  - number: 156x.2.b
    text: de kwalificaties en werkterreinen van de nascholingsdocenten en -instructeurs;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156x
  - number: 156x.2.c
    text: de cursuslocaties;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156x
  - number: 156x.2.d
    text: het voor het praktijkgedeelte gebruikte wagenpark, en
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156x
  - number: 156x.2.e
    text: de omvang van het aantal deelnemers per nascholingscursus.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156x
  - number: 156x.3
    text: Een erkenning heeft een geldigheidsduur van maximaal vijf jaren.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156x
  - number: 156x.4
    text: 'Een erkenning als bedoeld in het eerste lid kan door het CBR worden geschorst of ingetrokken indien:'
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156x
  - number: 156x.4.a
    text: de handelingen waarvoor de erkenning is verleend, niet meer worden verricht, of
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156x
  - number: 156x.4.b
    text: niet meer aan de in het tweede lid bedoelde eisen wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156x
  - number: 156x.5
    text: |-
      Bij ministeriële regeling kunnen nadere eisen worden vastgesteld met betrekking tot de aanvraag, schorsing en
      intrekking van een erkenning.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156x
  - number: 156y.1
    text: |-
      Degene die in het kader van [hoofdstuk VIIA van de wet][ref1] onderricht verricht anders dan rijonderricht bedoeld
      in de [Wet rijonderricht motorrijtuigen 1993][ref2], dan wel in het kader van [dat hoofdstuk][ref3] betrokken is
      bij de training, instructie of scholing van bestuurders, voldoet aan:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#HoofdstukVIIA
      [ref2]: https://wetten.overheid.nl/BWBR0006073
      [ref3]: https://wetten.overheid.nl/BWBR0006622#HoofdstukVIIA
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156y
    references:
      - id: ref1
        bwb_id: BWBR0006622
        hoofdstuk: VIIA
      - id: ref2
        bwb_id: BWBR0006073
      - id: ref3
        bwb_id: BWBR0006622
        hoofdstuk: VIIA
  - number: 156y.1.a
    text: de eisen die zijn opgenomen in onderdeel 5.2.3 van bijlage I van de richtlijn vakbekwaamheid bestuurders, en
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156y
  - number: 156y.1.b
    text: de bij ministeriële regeling bepaalde eisen.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156y
  - number: 156y.2
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld aan het toezicht op de in het eerste lid bedoelde
      personen.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156y
  - number: 156z
    text: |-
      Indien bij een praktijkexamen vakbekwaamheid of bij een nascholingscursus gebruik wordt gemaakt van een simulator
      voldoet deze aan de door het CBR gestelde en door Onze Minister goedgekeurde eisen.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156z
  - number: 156aa.1
    text: |-
      Indien de aanvrager naar het oordeel van het CBR de basiskwalificatie heeft behaald, registreert het CBR in het
      rijbewijzenregister ten behoeve van de aanvrager een verklaring van vakbekwaamheid voor de rijbewijscategorieën
      waarvoor de aanvrager de basiskwalificatie heeft behaald.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156aa
  - number: 156aa.2
    text: |-
      Nadat uit de in [artikel 156u][ref1] bedoelde meldingen is gebleken dat een bestuurder de nascholing heeft
      afgerond, registreert het CBR ten behoeve van de aanvrager in het rijbewijzenregister een verklaring van
      nascholing.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel156u
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156aa
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: 156u
        hoofdstuk: VIIa
        paragraaf: '7'
  - number: 156aa.3
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot de in dit artikel bedoelde
      registraties en meldingen.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156aa
  - number: 156ab.1
    text: |-
      Een getuigschrift van vakbekwaamheid behaald voor één van de rijbewijscategorieën C1, E bij C1, C of E bij C wordt
      op het rijbewijs tevens vermeld naast alle andere van deze categorieën voor zover de desbetreffende bestuurder
      daarover beschikt.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156ab
  - number: 156ab.2
    text: |-
      Een getuigschrift van vakbekwaamheid behaald voor één van de rijbewijscategorieën D1, E bij D1, D of E bij D wordt
      op het rijbewijs tevens vermeld naast alle andere van deze categorieën voor zover de desbetreffende bestuurder
      daarover beschikt.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156ab
  - number: 156ab.3
    text: |-
      Een getuigschrift van nascholing behaald voor de rijbewijscategorieën C1, E bij C1, C, E bij C, D1, E bij D1, D of
      E bij D wordt op het rijbewijs tevens vermeld naast alle andere categorieën waarvoor de desbetreffende bestuurder
      over een getuigschrift van vakbekwaamheid beschikt.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156ab
  - number: 156ab.4
    text: Een Nederlands omwisselingscertificaat geeft aan
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156ab
  - number: 156ab.4.a
    text: voor welke rijbewijscategorieën een bestuurder de basiskwalificatie heeft behaald of
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156ab
  - number: 156ab.4.b
    text: dat de bestuurder de nascholing heeft afgerond.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156ab
  - number: 156ac
    text: |-
      Voor de toepassing van hoofdstuk VIIA wordt met een geldig rijbewijs van de rijbewijscategorieën C1, E bij C1, C, E
      bij C, D1, E bij D1, D of E bij D gelijkgesteld een geldig rijbewijs, afgegeven door het daartoe bevoegde gezag in
      een andere lidstaat van de Europese Gemeenschap, in een andere staat die partij is bij de Overeenkomst betreffende
      de Europese Economische Ruimte of in Zwitserland.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156ac
  - number: 156ad
    text: |-
      Een wijziging van bijlage I van de richtlijn vakbekwaamheid bestuurders gaat voor de toepassing van hoofdstuk VIIA
      gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel156ad
  - number: 173i
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - *begeleiderspas:* begeleiderspas als
      bedoeld in [artikel 173k][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel173k
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173i
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: 173k
        hoofdstuk: VIIIb
        paragraaf: '2'
  - number: 173j.1
    text: |-
      Er wordt een experiment gehouden waarbij jongeren die vanaf 1 november 2011 de leeftijd van zeventien jaren hebben
      bereikt, vanaf zeventienjarige leeftijd hun rijbewijs kunnen halen en tot hun achttiende verjaardag alleen onder
      begeleiding mogen rijden.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173j
  - number: 173j.2
    text: |-
      In afwijking van het eerste lid kunnen jongeren die in het kader van een op het beroep van chauffeur
      goederenvervoer of chauffeur personenvervoer gerichte beroepsopleiding volgen, als bedoeld in de
      [Wet educatie en beroepsonderwijs][ref1] en die op het in het eerste lid genoemde tijdstip de leeftijd van
      zeventien jaren hebben bereikt, vanaf de leeftijd van zeventien jaren hun rijbewijs halen en tot hun achttiende
      verjaardag alleen onder begeleiding rijden.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173j
    references:
      - id: ref1
        bwb_id: BWBR0007625
  - number: 173j.3
    text: Het experiment beoogt een gunstig effect op de verkeersveiligheid van jonge beginnende bestuurders.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173j
  - number: 173j.4
    text: Het experiment vindt plaats overeenkomstig hoofdstuk VIIIb.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173j
  - number: 173k.1
    text: |-
      De in [artikel 5, eerste lid, onderdeel f][ref1], vastgestelde minimumleeftijd van 18 jaren voor het besturen van
      motorrijtuigen van de rijbewijscategorie B geldt niet voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel5
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173k
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '5'
        hoofdstuk: I
        paragraaf: '3'
  - number: 173k.1.a
    text: de bestuurder vanaf 1 november 2011 de leeftijd van zeventien jaren heeft bereikt,
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173k
  - number: 173k.1.b
    text: aan de bestuurder een rijbewijs B is afgegeven,
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173k
  - number: 173k.1.c
    text: de bestuurder een motorrijtuig van de rijbewijscategorie B bestuurt, en
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173k
  - number: 173k.1.d
    text: |-
      naast de bestuurder een in de begeleiderspas vermelde begeleider zit ten aanzien van wie de bestuurder weet dat
      deze niet onder zodanige invloed verkeert van een stof, waarvan het gebruik daarvan – al dan niet in combinatie
      met het gebruik van een andere stof – de rijvaardigheid kan verminderen, dat hij niet tot behoorlijk begeleiden in
      staat moet worden geacht.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173k
  - number: 173k.2
    text: 'De begeleiderspas dient:'
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173k
  - number: 173k.2.a
    text: te voldoen aan de bij ministeriële regeling vastgestelde eisen inzake inrichting, uitvoering en invulling,
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173k
  - number: 173k.2.b
    text: zijn geldigheid niet te hebben verloren en
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173k
  - number: 173k.2.c
    text: behoorlijk leesbaar te zijn.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173k
  - number: 173l
    text: |-
      In afwijking van [artikel 110b, eerste lid, aanhef en onder b, van de wet][ref1]
      juncto [artikel 6, eerste lid][ref2], mag degene die rijonderricht in de zin van de
      [Wet rijonderricht motorrijtuigen 1993][ref3] geeft, rijonderricht geven aan degene die de leeftijd van zestien
      jaren en zes maanden heeft bereikt, voor zover het betreft motorrijtuigen van de rijbewijscategorie B.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel110b
      [ref2]: https://wetten.overheid.nl/BWBR0008074#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0006073
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173l
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 110b
      - id: ref2
        bwb_id: BWBR0008074
        artikel: '6'
        hoofdstuk: I
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0006073
  - number: 173m
    text: |-
      In afwijking van [artikel 104a][ref1] juncto [artikel 5, eerste lid, onderdeel f][ref2], wordt een rijbewijs op
      aanvraag en tegen betaling van het daarvoor vastgestelde tarief, afgegeven aan degene die vanaf 1 november 2011 de
      leeftijd van zeventien jaren heeft bereikt voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel104a
      [ref2]: https://wetten.overheid.nl/BWBR0008074#Artikel5
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173m
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: 104a
        hoofdstuk: V
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008074
        artikel: '5'
        hoofdstuk: I
        paragraaf: '3'
  - number: 173m.a
    text: het betreft een rijbewijs voor het besturen van motorrijtuigen van de rijbewijscategorie B, en
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173m
  - number: 173m.b
    text: aan de aanvrager een begeleiderspas is afgegeven.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173m
  - number: 173n
    text: |-
      Het rijbewijs dat overeenkomstig [artikel 173m][ref1] is afgegeven is gedurende de periode dat de houder de
      leeftijd van achttien jaren nog niet heeft bereikt, voor de rijbewijscategorie B slechts geldig:


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel173m
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173n
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: 173m
        hoofdstuk: VIIIb
        paragraaf: '2'
  - number: 173n.a
    text: in combinatie met een aan de houder van het rijbewijs afgegeven begeleiderspas, en
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173n
  - number: 173n.b
    text: in het Europese deel van Nederland.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173n
  - number: 173o.1
    text: |-
      In aanvulling op [artikel 126, tweede lid, van de wet][ref1] verwerkt de Dienst Wegverkeer gegevens omtrent de
      begeleider en de begeleiderspas, voor zover deze gegevens noodzakelijk zijn voor een goede uitvoering van de wet en
      voor de handhaving van de bij of krachtens de wet vastgestelde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel126
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173o
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '126'
  - number: 173o.2
    text: De in het eerste lid bedoelde gegevens worden gedurende een periode van zeven jaar bewaard.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173o
  - number: 173p
    text: |-
      Onverminderd [artikel 33][ref1] dient bij de aanvraag van een rijbewijs van de rijbewijscategorie B door een
      aanvrager die de leeftijd van achttien jaren nog niet heeft bereikt ten aanzien van hem in het rijbewijzenregister
      de afgifte van een begeleiderspas te zijn geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel33
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173p
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '33'
        hoofdstuk: II
        paragraaf: '2'
  - number: 173q
    text: |-
      In afwijking van [artikel 56, derde lid][ref1], kan het theorie-examen voor de rijbewijscategorie B worden afgelegd
      door personen die de leeftijd van zestien jaren hebben bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel56
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173q
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '56'
        hoofdstuk: III
        paragraaf: '3'
  - number: 173r
    text: |-
      Onverminderd [artikel 145][ref1] worden in het rijbewijzenregister de navolgende gegevens opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel145
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173r
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '145'
        hoofdstuk: VII
  - number: 173r.a
    text: |-
      geslachtsnaam, voorvoegsels, eerste voornaam voluit, voorletters van eventuele overige voornamen en
      burgerservicenummer van degenen aan wie een begeleiderspas is afgegeven alsmede geslachtsnaam, eerste voornaam
      voluit, voorletters van eventuele overige voornamen en geboortedatum en geboorteplaats van de in de begeleiderspas
      genoemde begeleiders;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173r
  - number: 173r.b
    text: nummer en datum van afgifte van begeleiderspassen;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173r
  - number: 173r.c
    text: |-
      gegevens omtrent het verlies van geldigheid van begeleiderspassen ingevolge [artikel 173y][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel173y
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173r
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: 173y
        hoofdstuk: VIIIb
        paragraaf: '4'
  - number: 173r.d
    text: |-
      gegevens omtrent de ongeldigverklaring van begeleiderspassen ingevolge [artikel 173z][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel173z
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173r
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: 173z
        hoofdstuk: VIIIb
        paragraaf: '4'
  - number: 173s
    text: |-
      Onverminderd [artikel 152][ref1] verwerkt de Dienst Wegverkeer in het rijbewijzenregister gegevens omtrent de
      aanvraag, afgifte, verlies van geldigheid en ongeldigverklaring van begeleiderspassen.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel152
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173s
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '152'
        hoofdstuk: VII
  - number: 173t
    text: |-
      Onverminderd [artikel 156][ref1] verstrekt de Dienst Wegverkeer inlichtingen aan Onze Minister en aan de Stichting
      Wetenschappelijk Onderzoek Verkeersveiligheid ten behoeve van de monitoring en evaluatie van begeleid rijden.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel156
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173t
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '156'
        hoofdstuk: VII
  - number: 173u.1
    text: |-
      De begeleiderspas kan worden aangevraagd door een persoon die ten tijde van de aanvraag de leeftijd van ten
      minste zestien jaren en zes maanden heeft bereikt en wordt, na betaling van de hiervoor bij ministeriële regeling
      vastgestelde kosten, door de Dienst Wegverkeer aan deze persoon verstrekt.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173u
  - number: 173u.2
    text: |-
      Ten behoeve van de begeleiderspas heeft zich op zijn vroegst zes maanden voor de zeventiende verjaardag van de te
      begeleiden persoon ten minste een begeleider gemeld bij de Dienst Wegverkeer op de door die dienst voorgeschreven
      wijze.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173u
  - number: 173u.3
    text: Het model van de begeleiderspas wordt bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173u
  - number: 173u.4
    text: |-
      De aanvraag van een begeleiderspas, alsmede de wijze van betaling van de daarvoor overeenkomstig het eerste lid
      vastgestelde kosten, geschiedt op de door de Dienst Wegverkeer vastgestelde wijze.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173u
  - number: 173v
    text: 'Ten behoeve van de aanvraag van een begeleiderspas raadpleegt de Dienst Wegverkeer:'
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173v
  - number: 173v.a
    text: de in de basisregistratie personen opgenomen persoonsgegevens van de aanvrager en van de begeleider;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173v
  - number: 173v.b
    text: |-
      ten behoeve van de begeleider, het CBR, teneinde na te gaan of er sprake is van een van de in
      [artikel 173w, onderdelen g, i, j en k][ref1], bedoelde situaties;


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel173w
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173v
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: 173w
        hoofdstuk: VIIIb
        paragraaf: '3'
  - number: 173v.c
    text: |-
      de in het rijbewijzenregister opgenomen gegevens ten aanzien van de begeleider teneinde na te gaan of er sprake is
      van een van de in [artikel 173w, onderdelen a tot en met f en h][ref1], bedoelde situaties.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel173w
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173v
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: 173w
        hoofdstuk: VIIIb
        paragraaf: '3'
  - number: 173w.1
    text: 'Een begeleiderspas wordt slechts afgegeven indien de aanvraag betrekking heeft op een begeleider:'
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173w
  - number: 173w.1.a
    text: |-
      die in het bezit is van een rijbewijs voor categorie B waarvan sinds de datum van eerste afgifte ten minste 5 jaren
      verstreken zijn en die de leeftijd van tenminste 27 jaren heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173w
  - number: 173w.1.b
    text: |-
      van wie de bevoegdheid tot het besturen van motorrijtuigen niet op enig moment binnen een periode van vier jaren
      voorafgaand aan de aanvraag onherroepelijk is ontzegd;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173w
  - number: 173w.1.c
    text: |-
      van wie niet ingevolge [artikel 130, tweede lid, van de wet][ref1] de overgifte van het rijbewijs is gevorderd dan
      wel wiens rijbewijs is ingevorderd en aan wie dat rijbewijs niet is teruggegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel130
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173w
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '130'
  - number: 173w.1.d
    text: |-
      van wie niet ingevolge [artikel 131, het tweede lid, onderdeel a, van de wet][ref1] de geldigheid van het
      rijbewijs voor een of meer categorieën is geschorst;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel131
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173w
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '131'
  - number: 173w.1.e
    text: |-
      van wie niet ingevolge [artikel 164, eerste lid, van de wet][ref1] de overgifte van het rijbewijs is gevorderd dan
      wel het rijbewijs is ingevorderd en aan wie dat rijbewijs niet is teruggegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel164
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173w
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '164'
  - number: 173w.1.f
    text: |-
      van wie het rijbewijs zijn geldigheid niet op enig moment binnen een periode van vier jaren voorafgaand aan de
      aanvraag ingevolge [artikel 123b, eerste lid, van de wet][ref1] heeft verloren, dan wel ten aanzien van wie in die
      periode in het rijbewijzenregister een aantekening is gemaakt als bedoeld in artikel 123b, derde lid, van de wet;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel123b
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173w
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 123b
  - number: 173w.1.g
    text: |-
      aan wie niet op enig moment binnen een periode van vier jaren voorafgaand aan de aanvraag ingevolge
      [artikel 132c, eerste lid, onder d, van de wet][ref1] een rijbewijs is afgegeven waarop de bij ministeriële
      regeling vastgestelde codering voor het rijden met een alcoholslot is vermeld;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132c
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173w
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132c
  - number: 173w.1.h
    text: |-
      van wie niet ingevolge de [Wet administratiefrechtelijke handhaving verkeersvoorschriften][ref1] de inlevering van
      het rijbewijs is gevorderd noch het rijbewijs krachtens die wet is ingenomen, en


      [ref1]: https://wetten.overheid.nl/BWBR0004581
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173w
    references:
      - id: ref1
        bwb_id: BWBR0004581
  - number: 173w.1.i
    text: |-
      aan wie het CBR niet op enig moment binnen een periode van vier jaren voorafgaand aan de aanvraag de verplichting
      heeft opgelegd zich aan een educatieve maatregel ter bevordering van de rijvaardigheid of geschiktheid te
      onderwerpen;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173w
  - number: 173w.1.j
    text: |-
      van wie het rijbewijs niet op enig moment binnen een periode van vier jaren voorafgaand aan de aanvraag ongeldig is
      verklaard op grond van [artikel 134, tweede lid, van de wet][ref1] na een onderzoek naar de rijvaardigheid of een
      onderzoek naar de geschiktheid wegens alcohol of drugs;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel134
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173w
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '134'
  - number: 173w.1.k
    text: |-
      van wie het rijbewijs niet op enig moment binnen een periode van vier jaren voorafgaand aan de aanvraag ongeldig
      is verklaard op grond van [artikel 132, tweede lid, van de wet][ref1] wegens het niet meewerken aan een educatieve
      maatregel of een onderzoek naar de rijvaardigheid of een onderzoek naar de geschiktheid wegens alcohol of drugs.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173w
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '132'
  - number: 173w.2
    text: |-
      De in het eerste lid, onderdeel a, gestelde eis geldt niet, indien de begeleider overeenkomstig
      [artikel 7, eerste lid, van de Wet rijonderricht motorrijtuigen 1993][ref1] over het in dat lid bedoelde
      certificaat beschikt.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel7
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173w
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: '7'
  - number: 173w.3
    text: |-
      Voor de toepassing van dit artikel wordt onder rijbewijs mede verstaan een rijbewijs, afgegeven door het daartoe
      bevoegde gezag in een andere lidstaat van de Europese Unie of in een andere Staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte of Zwitserland, waarvan de houder in Nederland woonachtig is.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173w
  - number: 173x
    text: 'De Dienst Wegverkeer geeft op aanvraag een nieuwe begeleiderspas af:'
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173x
  - number: 173x.a
    text: bij wijziging van de personalia van de houder of de begeleider;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173x
  - number: 173x.b
    text: indien de houder een nieuwe begeleider opgeeft;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173x
  - number: 173x.c
    text: |-
      na ongeldigverklaring van de eerder afgegeven begeleiderspas op grond van [artikel 173z, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel173z
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173x
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: 173z
        hoofdstuk: VIIIb
        paragraaf: '4'
  - number: 173x.d
    text: in geval de eerder afgegeven begeleiderspas versleten of geheel of ten dele onleesbaar is;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173x
  - number: 173x.e
    text: indien de eerder afgegeven begeleiderspas verloren is geraakt of teniet is gegaan.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173x
  - number: 173y
    text: 'De begeleiderspas verliest zijn geldigheid:'
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173y
  - number: 173y.a
    text: door uitreiking van een nieuwe begeleiderspas;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173y
  - number: 173y.b
    text: door het onbevoegd daarin aanbrengen van wijzigingen;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173y
  - number: 173y.c
    text: |-
      door wijziging van de geslachtsnaam, de voornamen, de plaats of datum van geboorte of het geslacht van één van de
      daarop vermelde personen;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173y
  - number: 173y.d
    text: op de dag dat de houder de leeftijd van achttien jaren bereikt.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173y
  - number: 173z
    text: 'Een begeleiderspas wordt door de Dienst Wegverkeer ongeldig verklaard indien:'
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173z
  - number: 173z.a
    text: |-
      de begeleiderspas is afgegeven op grond van door de aanvrager verschafte onjuiste gegevens en hij niet zou zijn
      afgegeven indien de onjuistheid van die gegevens ten tijde van de aanvraag bekend zou zijn geweest;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173z
  - number: 173z.b
    text: na afgifte van de begeleiderspas blijkt dat hij kennelijk abusievelijk aan de houder is afgegeven.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173z
  - number: 173aa.1
    text: |-
      Indien een van de in [artikel 159, onderdeel a, van de wet][ref1] bedoelde personen vaststelt dat de bestuurder
      die nog niet de leeftijd van achttien jaar heeft bereikt, een motorrijtuig bestuurt zonder dat naast hem een in de
      begeleiderspas genoemde begeleider zit, doet hij daarvan zo spoedig mogelijk, doch uiterlijk binnen zes maanden,
      mededeling aan het CBR onder vermelding van de feiten en omstandigheden die aan de vaststelling ten grondslag
      liggen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel159
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173aa
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '159'
  - number: 173aa.2
    text: |-
      De in het eerste lid bedoelde mededeling wordt ook uitgebracht indien naast de bestuurder een op de begeleiderspas
      vermelde begeleider zit ten aanzien van wie de bestuurder weet dat deze onder zodanige invloed verkeert van
      een stof, waarvan het gebruik daarvan – al dan niet in combinatie met het gebruik van een andere stof – de
      rijvaardigheid kan verminderen, dat hij niet tot behoorlijk begeleiden in staat moet worden geacht.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173aa
  - number: 173aa.3
    text: |-
      Op de eerste vordering van de in [artikel 159, onderdeel a, van de wet][ref1] bedoelde personen is de bestuurder
      van een motorrijtuig, ten aanzien van wie het vermoeden bestaat dat hij een motorrijtuig bestuurt zonder begeleider
      of zonder dat naast hem een in de begeleiderspas genoemde begeleider zit, verplicht tot overgifte van het hem
      afgegeven rijbewijs, alsmede van de begeleiderspas.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel159
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173aa
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '159'
  - number: 173aa.4
    text: |-
      [Artikel 130, derde lid, laatste volzin, en vierde lid, van de wet][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel130
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173aa
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '130'
  - number: 173aa.5
    text: |-
      De mededeling, bedoeld in het eerste en tweede lid, wordt schriftelijk gedaan volgens bij ministeriële regeling
      vastgesteld model of op andere wijze, mits daarbij dezelfde gegevens als in het model worden vermeld. Hieronder
      wordt tevens verstaan aanlevering via geautomatiseerde systemen.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173aa
  - number: 173bb.1
    text: |-
      Indien een mededeling als bedoeld in [artikel 173aa, eerste of tweede lid][ref1], is gedaan, verklaart het CBR het
      rijbewijs van betrokkene voor categorie B ongeldig. Dit geldt ook indien de betrokkene inmiddels de leeftijd van 18
      jaren heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel173aa
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173bb
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: 173aa
        hoofdstuk: VIIIb
        paragraaf: '5'
  - number: 173bb.2
    text: |-
      Het besluit is van kracht met ingang van de zevende dag na die waarop het besluit tot ongeldigverklaring aan de
      houder van het rijbewijs is bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173bb
  - number: 173bb.3
    text: |-
      Het CBR doet mededeling aan betrokkene dat hij een rijbewijs voor de categorie AM kan aanvragen of overeenkomstig
      [artikel 173cc][ref1] een rijbewijs voor de categorie B.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel173cc
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173bb
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: 173cc
        hoofdstuk: VIIIb
        paragraaf: '5'
  - number: 173bb.4
    text: |-
      De houder van het ongeldig verklaarde rijbewijs dient dat rijbewijs, zodra de ongeldigverklaring van kracht is
      geworden, in te leveren bij het CBR, ook indien de ongeldigverklaring niet alle categorieën betreft waarvoor het
      rijbewijs geldig was.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173bb
  - number: 173cc.1
    text: |-
      Indien de aanvraag van een rijbewijs betrekking heeft op de afgifte van een rijbewijs dat geldig is voor een
      categorie waarvoor een eerder aan de aanvrager afgegeven rijbewijs door het CBR op grond van [artikel 173bb][ref1]
      ongeldig is verklaard, dient onverminderd [artikel 33][ref2] in het rijbewijzenregister ten behoeve van de
      aanvrager een verklaring van rijvaardigheid te zijn geregistreerd voor iedere rijbewijscategorie waarop de
      ongeldigverklaring betrekking heeft, waarbij de datum van registratie niet langer dan drie jaar vóór de aanvraag
      mag liggen, alsmede een verklaring van geschiktheid waarbij de datum van registratie niet langer dan een jaar vóór
      de aanvraag mag liggen.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel173bb
      [ref2]: https://wetten.overheid.nl/BWBR0008074#Artikel33
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173cc
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: 173bb
        hoofdstuk: VIIIb
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0008074
        artikel: '33'
        hoofdstuk: II
        paragraaf: '2'
  - number: 173cc.2
    text: |-
      [Artikel 173q][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel173q
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel173cc
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: 173q
        hoofdstuk: VIIIb
        paragraaf: '2'
  - number: '174'
    text: |-
      Aanvragen van rijbewijzen die betrekking hebben op de afgifte van een rijbewijs tegen overlegging van een op basis
      van de Wegenverkeerswet aan de aanvrager afgegeven rijbewijs dat na 30 juni 1985 zijn geldigheid heeft verloren
      door het verstrijken van de geldigheidsduur en dat behoort tot een bij ministeriële regeling aangewezen model,
      dienen:
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel174
  - number: 174.a
    text: |-
      indien de aanvrager woonachtig is in Nederland, te zijn gericht tot de Dienst Wegverkeer en te worden ingediend bij
      de burgemeester van de gemeente waar de aanvrager woonachtig is;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel174
  - number: 174.b
    text: |-
      indien de aanvrager niet in Nederland woonachtig is, te zijn gericht tot en te worden ingediend bij de Dienst
      Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel174
  - number: '178'
    text: |-
      Voor de toepassing van [artikel 9, eerste lid, onderdeel d][ref1], wordt onder een rijbewijs B mede verstaan een
      op basis van de Wegenverkeerswet afgegeven rijbewijs B dat op het moment van de aanvraag na 30 juni 1985 zijn
      geldigheid heeft verloren door het verstrijken van de geldigheidsduur en dat niet behoort tot een bij ministeriële
      regeling aangewezen model.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel9
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel178
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '9'
        hoofdstuk: I
        paragraaf: '4'
  - number: 178a
    text: |-
      [Artikel 15][ref1] van het Reglement rijbewijzen zoals dat luidde tot 19 januari 2013, blijft van kracht ten
      aanzien van personen:


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel15
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel178a
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '15'
        hoofdstuk: I
        paragraaf: '6'
  - number: 178a.a
    text: |-
      aan wie voor het in de aanhef bedoelde tijdstip overeenkomstig het tot dat tijdstip bij
      of krachtens de [Wegenverkeerswet 1994][ref1] gestelde een rijbewijs is uitgereikt voor
      een of meer rijbewijscategorieën, tenzij dat rijbewijs ongeldig is verklaard op grond van
      [artikel 124, eerste lid, onderdelen a of b, van de Wegenverkeerswet 1994][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0006622
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel124
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel178a
    references:
      - id: ref1
        bwb_id: BWBR0006622
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '124'
  - number: 178a.b
    text: |-
      ten aanzien van wie het besluit tot afgifte van een rijbewijs voor de rijbewijscategorieën waarop de aanvraag
      betrekking heeft, is genomen voor het in de aanhef bedoelde tijdstip, tenzij dat rijbewijs ongeldig is verklaard op
      grond van [artikel 124, eerste lid, onderdelen a of b, van de Wegenverkeerswet 1994][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel124
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel178a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '124'
  - number: '179.1'
    text: |-
      Voor de toepassing van [artikel 18, tweede lid][ref1], wordt onder een rijbewijs B dat is voorzien van een bij
      ministeriële regeling vastgestelde code waaruit blijkt dat de houder van dat rijbewijs het praktijk-examen heeft
      afgelegd in een motorrijtuig met automatische schakeling mede verstaan een op basis van de Wegenverkeerswet
      afgegeven rijbewijs B met de aanduiding «Automaat».


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel18
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel179
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '18'
        hoofdstuk: I
        paragraaf: '6'
  - number: '179.2'
    text: |-
      Voor de toepassing van [artikel 18, derde lid][ref1], wordt onder een rijbewijs dat zijn geldigheid heeft verloren
      door het verstrijken van de geldigheidsduur mede verstaan een op basis van de Wegenverkeerswet afgegeven rijbewijs
      dat zijn geldigheid heeft verloren door het verstrijken van de geldigheidsduur en dat niet behoort tot een bij
      ministeriële regeling aangewezen model.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel18
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel179
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '18'
        hoofdstuk: I
        paragraaf: '6'
  - number: '179.3'
    text: |-
      Voor de toepassing van [artikel 18, zesde lid, onderdeel a][ref1], wordt onder een rijbewijs B dat zijn geldigheid
      heeft verloren door het verstrijken van de geldigheidsduur mede verstaan een op basis van de Wegenverkeerswet
      afgegeven rijbewijs B dat na 30 juni 1985 zijn geldigheid heeft verloren door het verstrijken van de
      geldigheidsduur.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel18
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel179
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '18'
        hoofdstuk: I
        paragraaf: '6'
  - number: 179a.1
    text: |-
      [Artikel 20][ref1] van het Reglement rijbewijzen, zoals dat luidde tot 19 januari 2013, blijft van toepassing op
      rijbewijzen voor de categorie A:


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel20
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel179a
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '20'
        hoofdstuk: I
        paragraaf: '6'
  - number: 179a.1.a
    text: die zijn uitgereikt voor het in de aanhef genoemde tijdstip;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel179a
  - number: 179a.1.b
    text: ten aanzien waarvan voor het in de aanhef genoemde tijdstip het besluit tot afgifte is genomen.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel179a
  - number: 179a.2
    text: |-
      Het in het eerste lid bedoelde rijbewijs geeft tevens de bevoegdheid tot het besturen van motorfietsen van de
      categorie A1 en A2.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel179a
  - number: 179a.3
    text: |-
      Aan personen ten aanzien van wie voor 19 januari 2013 een verklaring van rijvaardigheid is geregistreerd in het
      rijbewijzenregister die op grond van [artikel 20][ref1] van het Reglement rijbewijzen zoals dat gold tot 19 januari
      2013, recht zou hebben gegeven op een rijbewijs voor de categorie A dat gedurende twee jaren na de datum van
      afgifte slechts geldig is voor het besturen van motorrijtuigen van de categorie A, waarvan het vermogen niet meer
      dan 25 kW en tevens niet meer dan 0,16 kW per kg ledige massa bedraagt, wordt vanaf dat tijdstip een rijbewijs
      afgegeven voor de categorie A2.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel20
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel179a
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '20'
        hoofdstuk: I
        paragraaf: '6'
  - number: 179a.4
    text: |-
      Aan personen aan wie voor 19 januari 2013 een rijbewijs was uitgereikt voor, dan wel het besluit tot afgifte
      was genomen van, de categorie A dat gedurende twee jaar na die afgifte slechts geldig is voor het besturen van
      motorrijtuigen van de categorie A, waarvan het vermogen niet meer is dan 25 kW en tevens niet meer dan 0,16 kW
      per kg ledige massa bedraagt en die na dat tijdstip, maar voordat de beperking als bedoeld in [artikel 20][ref1]
      van het Reglement rijbewijzen zoals dat gold tot 19 januari 2013, is vervallen, een nieuw of vervangend rijbewijs
      aanvragen dat geldig zou zijn geweest voor de in dit lid bedoelde categorie A, wordt een rijbewijs afgegeven dat
      geldig is voor de categorieën A1 en A2, alsmede voor de categorie A vanaf het tijdstip waarop anders overeenkomstig
      artikel 20 van het Reglement rijbewijzen zoals dat gold tot 19 januari 2013, de eerder genoemde beperking zou zijn
      vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel20
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel179a
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '20'
        hoofdstuk: I
        paragraaf: '6'
  - number: 179a.5
    text: |-
      Personen aan wie voor 19 januari 2013 een rijbewijs was uitgereikt voor de categorie A dat gedurende twee jaar
      na die afgifte slechts geldig is voor het besturen van motorrijtuigen van de categorie A, waarvan het vermogen
      niet meer is dan 25 kW en tevens niet meer dan 0,16 kW per kg ledige massa bedraagt en van wie dat rijbewijs na
      dat tijdstip, maar voordat de beperking als bedoeld in [artikel 20][ref1] van het Reglement rijbewijzen zoals dat
      gold tot 19 januari 2013, is vervallen, het rijbewijs ongeldig is verklaard of geworden, leggen om weer in het
      bezit te komen van een rijbewijs het praktijkexamen af op een motorrijwiel van de categorie A2. Aan hen wordt,
      als is voldaan aan de bij of krachtens de [Wegenverkeerswet 1994][ref2] voorgeschreven voorwaarden, een rijbewijs
      afgegeven dat de bevoegdheid geeft voor de rijbewijscategorieën A2 en A1.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel179a
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '20'
        hoofdstuk: I
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0006622
  - number: 179b
    text: |-
      Examenvoertuigen voor de categorie A, die op 31 december 2013 voldoen aan de eisen aan een examenvoertuig van deze
      categorie zoals die golden tot dat tijdstip, kunnen tot uiterlijk 31 december 2018 als zodanig worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel179b
  - number: '183.1'
    text: |-
      Voor de toepassing van de [artikelen 35, aanhef en onderdeel a][ref1], [36][ref2] en [38 tot en met 43][ref3],
      wordt onder een eerder aan de aanvrager afgegeven rijbewijs mede verstaan een eerder op basis van de
      Wegenverkeerswet aan de aanvrager afgegeven rijbewijs dat op het moment van de aanvraag na 30 juni 1985 zijn
      geldigheid heeft verloren door het verstrijken van de geldigheidsduur.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0008074#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0008074#Artikel38
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel183
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '35'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008074
        artikel: '36'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0008074
        artikel: '38'
        hoofdstuk: II
        paragraaf: '2'
  - number: '183.2'
    text: |-
      Voor de toepassing van [artikel 35, onderdeel b, onder III][ref1], wordt onder een rijbewijs waarvan de
      geldigheidsduur verstrijkt op of na de dag waarop hij de leeftijd van 75 jaren bereikt, mede verstaan een op basis
      van de Wegenverkeerswet afgegeven rijbewijs waarvan de geldigheidsduur verstrijkt op of na de dag waarop hij de
      leeftijd van 75 jaren bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel35
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel183
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '35'
        hoofdstuk: II
        paragraaf: '2'
  - number: '183.3'
    text: |-
      Voor de toepassing van de [artikelen 44, derde lid][ref1], [artikel 46, derde en zesde lid][ref2], [107][ref3]
      en [108][ref4] wordt onder een eerder aan de aanvrager afgegeven rijbewijs mede verstaan een eerder op basis van
      de Wegenverkeerswet aan de aanvrager afgegeven rijbewijs dat op het moment van de aanvraag na 30 juni 1985 zijn
      geldigheid heeft verloren door het verstrijken van de geldigheidsduur of door omwisseling tegen een rijbewijs dat
      is afgegeven door het daartoe bevoegde gezag buiten Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0008074#Artikel46
      [ref3]: https://wetten.overheid.nl/BWBR0008074#Artikel107
