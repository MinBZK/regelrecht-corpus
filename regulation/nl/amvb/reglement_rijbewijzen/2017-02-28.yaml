    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel60a
  - number: 60a.a
    text: |-
      grondige kennis van bij en krachtens de wet vastgestelde, voor bestuurders van bromfietsen geldende voorschriften
      en het op juiste wijze toepassen van die kennis alsmede van kennis van bij en krachtens de wet vastgestelde, voor
      andere verkeersdeelnemers dan die bestuurders geldende voorschriften;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel60a
  - number: 60a.b
    text: kennis van de mogelijkheid van conflicteren van eigen belangen en belangen van andere verkeersdeelnemers;
