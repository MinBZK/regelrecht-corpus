        hoofdstuk: II
        paragraaf: '2'
  - number: 53a.15
    text: |-
      Indien het een aanvraag betreft als bedoeld in [artikel 42a, eerste lid][ref1], en de aanvraag uitsluitend de
      categorie T betreft, dan bestaat het onderzoek naar de rijvaardigheid uit een theorie-examen en een praktijkexamen
      voor de categorie T. Indien de aanvraag mede een of meer van de categorieën E bij D, D, E bij D1, D1, E bij B, B,
      A1, A2, A of AM betreft, dan bestaat in aanvulling op de eerste volzin het onderzoek naar de rijvaardigheid mede
      uit een theorie-examen en een praktijkexamen voor de zwaarste categorie overeenkomstig het derde tot en met het
      veertiende lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel42a
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel53a
