      voor de categorie A, waaruit blijkt dat hij het praktijkexamen heeft afgelegd op een motorrijtuig van de categorie
      A, met handschakeling, tevens een rijbewijs voor de categorieën A1 en A2 afgegeven, zonder dat voor die categorieën
      een beperking tot motorrijtuigen met automatische schakeling geldt.


