    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel7
  - number: 7.2.f.4°
    text: |-
      een door het daartoe bevoegde militaire gezag niet langer dan een jaar en zes maanden tevoren afgegeven
      theoriecertificaat ten behoeve van de rijbewijscategorie A;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel7
  - number: 7.2.f.5°
    text: |-
      een geldig rijbewijs A2 dat slechts geldig is voor het besturen van motorrijtuigen van deze categorie met
      automatische schakeling;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel7
  - number: 7.2.f.6°
    text: |-
      een geldig rijbewijs A2, afgegeven door het daartoe bevoegde gezag in een andere lidstaat van de Europese Unie of
