  - number: '191'
    text: |-
      Voor de toepassing van de artikelen 145 tot en met 152 wordt onder rijbewijzen mede verstaan rijbewijzen als
      bedoeld in artikel 9, eerste lid onder [3e, van de Wegenverkeerswet](onbekend).
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel191
  - number: '193'
    text: |-
      Indien de aanvraag van een rijbewijs betrekking heeft op de afgifte van een rijbewijs in verband met het
      verstrijken van de geldigheidsduur van een voor de datum van inwerkingtreding van dit besluit op basis van de
      [Wegenverkeerswet][ref1] afgegeven rijbewijs dat geldig is voor de rijbewijscategorie A wordt, indien de aanvrager
      ten behoeve van het besturen van een motorrijtuig op drie wielen, waarvan de ledige massa niet meer bedraagt
      dan 400 kg, belang heeft bij afgifte van een rijbewijs dat geldig is voor het besturen van motorrijtuigen van de
      rijbewijscategorie B, tegen overlegging van dat eerder afgegeven rijbewijs en een vóór 1 juni 1996 op zijn naam
      gesteld kentekenbewijs dat is afgegeven voor een motorrijtuig als hier bedoeld, een rijbewijs afgegeven voor de
      rijbewijscategorieën A en B, dat voor wat betreft de rijbewijscategorie B slechts geldig is voor het besturen van
      motorrijtuigen op drie wielen, waarvan de ledige massa niet meer bedraagt dan 400 kg. In het rijbewijs is deze
      beperking aangeduid met een bij ministeriële regeling vastgestelde codering.


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel193
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: '194'
    text: |-
      Indien de aanvraag van een rijbewijs betrekking heeft op de afgifte van een rijbewijs tegen overlegging van
      een op basis van de Wegenverkeerswet aan de aanvrager afgegeven rijbewijs dat na 30 juni 1985 zijn geldigheid
      heeft verloren door het verstrijken van de geldigheidsduur en waarin de aanduiding «Automatische gangwissel of
      koppeling», al dan niet in combinatie met de aanduiding «Tot één jaar na datum van afgifte beperkt geldig» is
      geplaatst, wordt een rijbewijs afgegeven zonder die beperkende aanduiding of aanduidingen.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel194
  - number: '195.1'
    text: |-
      Indien de aanvraag van een rijbewijs betrekking heeft op de afgifte van een rijbewijs tegen overlegging van een
      op basis van de Wegenverkeerswet aan de aanvrager afgegeven rijbewijs dat na 30 juni 1985 zijn geldigheid heeft
      verloren door het verstrijken van de geldigheidsduur en waarin vermeldingen of beperkende aantekeningen zijn
      aangebracht, wordt een rijbewijs afgegeven waarin die vermeldingen of beperkende aantekeningen zijn aangeduid met
      een bij ministeriële regeling vastgestelde codering.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel195
  - number: '195.2'
    text: |-
      Indien het op basis van de Wegenverkeerswet aan de aanvrager afgegeven rijbewijs, bedoeld in het eerste lid, niet
      kan worden overgelegd omdat het verloren is geraakt of teniet is gegaan, neemt degene die een rijbewijs afgeeft de
      in het rijbewijzenregister opgenomen vermeldingen of beperkende aantekeningen in de vorm van een bij ministeriële
      regeling vastgestelde codering over in het af te geven rijbewijs.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel195
  - number: '196'
    text: 'Indien de aanvrager van een rijbewijs in het bezit is van:'
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel196
  - number: 196.a
    text: |-
      een op basis van de [Wegenverkeerswet][ref1] afgegeven rijbewijs C met de aanduiding «Automaat», dat na 30
      juni 1985 zijn geldigheid heeft verloren door het verstrijken van de geldigheidsduur en dat niet behoort tot
      een bij ministeriële regeling aangewezen model, en hij ter verkrijging van een rijbewijs D een verklaring
      van rijvaardigheid overlegt waaruit blijkt dat hij het praktijkexamen heeft afgelegd met een motorrijtuig met
      automatische schakeling,


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel196
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: 196.b
    text: |-
      een op basis van de [Wegenverkeerswet][ref1] afgegeven rijbewijs D met de aanduiding «Automaat», dat na 30
      juni 1985 zijn geldigheid heeft verloren door het verstrijken van de geldigheidsduur en dat niet behoort tot
      een bij ministeriële regeling aangewezen model, en hij ter verkrijging van een rijbewijs C een verklaring
      van rijvaardigheid overlegt waaruit blijkt dat hij het praktijkexamen heeft afgelegd met een motorrijtuig met
      automatische schakeling,


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel196
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: 196.c
    text: |-
      een op basis van de [Wegenverkeerswet][ref1] afgegeven rijbewijs C dat na 30 juni 1985 zijn geldigheid heeft
      verloren door het verstrijken van de geldigheidsduur en dat niet behoort tot een bij ministeriële regeling
      aangewezen model, en hij ter verkrijging van een rijbewijs D een verklaring van rijvaardigheid overlegt waaruit
      blijkt dat hij het praktijkexamen heeft afgelegd met een motorrijtuig met automatische schakeling, dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel196
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: 196.d
    text: |-
      een op basis van de [Wegenverkeerswet][ref1] afgegeven rijbewijs D dat na 30 juni 1985 zijn geldigheid heeft
      verloren door het verstrijken van de geldigheidsduur en dat niet behoort tot een bij ministeriële regeling
      aangewezen model, en hij ter verkrijging van een rijbewijs C een verklaring van rijvaardigheid overlegt waaruit
      blijkt dat hij het praktijkexamen heeft afgelegd met een motorrijtuig met automatische schakeling,


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel196
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: '197.1'
    text: |-
      Met ingang van de datum waarop de bevoegdheid van een Nederlands-Antilliaans bestuursorgaan tot afgifte van
      rijbewijzen is overgegaan op een bestuursorgaan van Curaςao of Sint Maarten, worden voor de toepassing van het
      Reglement rijbewijzen, rijbewijzen die op grond van die bevoegdheid vóór het tijdstip van transitie zijn afgegeven
      door het bevoegde gezag op de Nederlandse Antillen, gelijkgesteld met rijbewijzen die vanaf het tijdstip van
      transitie zijn afgegeven door het daartoe bevoegde gezag op Curaςao of Sint Maarten.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel197
  - number: '197.2'
    text: |-
      Onder tijdstip van transitie als bedoeld in het eerste lid wordt verstaan het tijdstip waarop
      [artikel I van de Rijkswet wijziging Statuut in verband met de opheffing van de Nederlandse Antillen][ref1] in
      werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0028249#ArtikelI
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel197
    references:
      - id: ref1
        bwb_id: BWBR0028249
        artikel: I
  - number: 197a.1
    text: |-
      De aanvraag tot omwisseling van het certificaat van vakbekwaamheid, bedoeld in
      [artikel 9.36 van het Arbeidsomstandighedenbesluit][ref1], zoals dat gold tot het tijdstip van inwerkingtreding van
      de__REF001_________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      _________________ (T-rijbewijs; Stb. 2015, 10), in een rijbewijs voor de categorie T geschiedt op de wijze zoals
      bepaald in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0036167
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel197a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0036167
  - number: 197a.2
    text: |-
      Voor de in het eerste lid bedoelde aanvraag dient ten behoeve van de aanvrager in het rijbewijzenregister te zijn
      geregistreerd:
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel197a
  - number: 197a.2.a
    text: |-
      een verklaring van de Dienst Wegverkeer dat aan de aanvrager een certificaat van vakbekwaamheid als bedoeld in het
      eerste lid is afgegeven;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel197a
  - number: 197a.2.b
    text: een verklaring van geschiktheid voor de rijbewijscategorie T.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel197a
  - number: 197a.3
    text: |-
      Een verzoek tot registratie als bedoeld in het tweede lid, onderdeel a, wordt door de aanvrager ingediend bij de
      Dienst Wegverkeer. Bij deze aanvraag worden meegestuurd:
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel197a
  - number: 197a.3.a
    text: een volledig ingevuld aanvraagformulier volgens een door de Dienst Wegverkeer vastgesteld model,
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel197a
  - number: 197a.3.b
    text: het originele eerder aan de aanvrager afgegeven certificaat van vakbekwaamheid, en
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel197a
  - number: 197a.3.c
    text: |-
      een kopie van een op naam van de aanvrager gesteld identiteitsbewijs als bedoeld in
      [artikel 1, eerste lid, onder 1°, 2° of 3°, van de Wet op de identificatieplicht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel197a
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 197a.4
    text: |-
      De Dienst Wegverkeer stelt aan de hand van de volgende criteria vast of er sprake is van een origineel certificaat
      als bedoeld in het derde lid, onderdeel b:
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel197a
  - number: 197a.4.a
    text: |-
      indien het een certificaat van vakbekwaamheid betreft, afgegeven met ingang van 1 januari 1995, moet dit zijn
      geregistreerd bij Aequor;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel197a
  - number: 197a.4.b
    text: |-
      indien het een certificaat van vakbekwaamheid betreft, afgegeven voor 1 januari 1995, betreft het een certificaat
      van vakbekwaamheid van een bij de Dienst Wegverkeer bekend model.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel197a
  - number: 197a.5
    text: |-
      Indien het in het derde lid, onderdeel b, bedoelde certificaat niet kan worden overgelegd, bewijst de aanvrager,
      in aanvulling op de in dat onderdeel opgenomen eis, op naar het oordeel van de Dienst Wegverkeer overtuigende wijze
      dat aan hem een dergelijk certificaat is afgegeven.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel197a
  - number: 197a.6
    text: |-
      Indien het certificaat van vakbekwaamheid is afgegeven voor 1 januari 1995 en niet behoort tot een van de bij
      de Dienst Wegverkeer bekende modellen, bewijst de aanvrager op andere, naar het oordeel van de Dienst Wegverkeer
      overtuigende, wijze dat aan hem een dergelijk certificaat is afgegeven.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel197a
  - number: 197a.7
    text: |-
      Aanvragen worden afgewezen, indien de aanvrager naar het oordeel van de Dienst Wegverkeer niet overtuigend heeft
      aangetoond dat aan hem een certificaat van vakbekwaamheid als bedoeld in het eerste lid is afgegeven.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel197a
  - number: 197a.8
    text: |-
      De Dienst Wegverkeer plaatst een registratie in het rijbewijzenregister indien naar het oordeel van die dienst
      overtuigend is vastgesteld dat het een origineel certificaat van vakbekwaamheid betreft.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel197a
  - number: 197a.9
    text: |-
      Op de aanvraag van een verklaring van geschiktheid als bedoeld in het tweede lid, onderdeel b, zijn de
      [artikelen 97 tot en met 104][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel97
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel197a
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '97'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 197a.10
    text: |-
      Nadat is voldaan aan het tweede lid zijn op de aanvraag van een rijbewijs voor de
      categorie T, bedoeld in het eerste lid, de [artikelen 27][ref1], [29][ref2], [32][ref3],
      [33, eerste lid, onderdelen a, b, subonderdelen I en III, c en d, en tweede lid][ref4], en [34, eerste lid][ref5],
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0008074#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0008074#Artikel32
      [ref4]: https://wetten.overheid.nl/BWBR0008074#Artikel33
      [ref5]: https://wetten.overheid.nl/BWBR0008074#Artikel34
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel197a
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '27'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008074
        artikel: '29'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0008074
        artikel: '32'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0008074
        artikel: '33'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0008074
        artikel: '34'
        hoofdstuk: II
        paragraaf: '2'
  - number: 197b.1
    text: |-
      Bij de aanvraag tot afgifte van een rijbewijs voor de categorieën B en T, bedoeld in
      __REF000___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      ____________________________________________ (T-rijbewijs; Stb. 2015, 10) door een houder van een rijbewijs voor de
      categorie B dat op het tijdstip van de inwerkingtreding van genoemde wet nog geldig is of waarvan de geldigheid is
      verlopen door het verstrijken van de geldigheidsduur, worden op het af te geven rijbewijs de beperkende coderingen
      die zijn geregistreerd ten aanzien van de categorie B eveneens vermeld op het rijbewijs ten aanzien de categorie T.


      [ref1]: https://wetten.overheid.nl/BWBR0036167#ArtikelV
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel197b
    references:
      - id: ref1
        bwb_id: BWBR0036167
        artikel: V
  - number: 197b.2
    text: |-
      Indien op het in het eerste lid bedoelde rijbewijs B de beperkende codering is vermeld die aangeeft dat het examen
      voor de rijbewijscategorie is afgelegd in een motorrijtuig met automatische schakeling, wordt op het af te geven
      rijbewijs deze codering niet overgenomen ten aanzien van de categorie T.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel197b
  - number: 197b.3
    text: |-
      Indien op basis van de aanvraag tot afgifte van een rijbewijs voor de categorieën B en T, bedoeld in
      [artikel V, tweede lid, van de in de eerste lid bedoelde wet][ref1] het rijbewijs voor de categorie B wordt
      afgegeven voor een beperkte geldigheidsduur, wordt ook de categorie T afgegeven voor dezelfde beperkte
      geldigheidsduur.


      [ref1]: https://wetten.overheid.nl/BWBR0036167#ArtikelV
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel197b
    references:
      - id: ref1
        bwb_id: BWBR0036167
        artikel: V
  - number: '198'
    text: |-
      Overtreding van [artikel 2, vijfde lid][ref1], is een strafbaar feit.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel2
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel198
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '2'
        hoofdstuk: I
        paragraaf: '2'
  - number: '199'
    text: |-
      De artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel199
  - number: '200'
    text: 'Dit besluit wordt aangehaald als: Reglement rijbewijzen.'
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel200
