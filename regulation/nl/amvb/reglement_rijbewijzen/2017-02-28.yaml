    text: |-
      Onverminderd [artikel 17][ref1] wordt aan de aanvrager die in het bezit is van een rijbewijs voor de categorie
      A1, dat is voorzien van een bij ministeriële regeling vastgestelde codering waaruit blijkt dat de houder van dat
