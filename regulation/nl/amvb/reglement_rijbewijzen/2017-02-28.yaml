    text: basiskennis met betrekking tot rij- en rusttijdenregelingen;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel64
  - number: 64.2.i
    text: kennis van de kenmerken van de krachtoverbrenging met het oog op optimaal gebruik en
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel64
  - number: 64.2.j
    text: kennis van en inzicht in de werking en defecten van de belangrijkste voertuigonderdelen en vloeistoffen.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel64
  - number: '64.3'
    text: |-
      De aanvrager die aantoont te beschikken over een rijbewijs voor de categorie D1 dat nog geldig is of dat ongeldig
      is geworden door het verstrijken van de geldigheidsduur of een geldig rijbewijs D1, afgegeven door het daartoe
      bevoegde gezag in een andere lidstaat van de Europese Unie of in een andere staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte of Zwitserland, verwerft het theorie-examen voor de categorie D door in
      aanvulling op dat rijbewijs met goed gevolg de bij ministeriële regeling vastgestelde onderdelen van dat theorie-
      examen af te leggen.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel64
  - number: 64a
    text: 'De eisen voor het theorie-examen voor de rijbewijscategorie T betreffen:'
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel64a
  - number: 64a.a
    text: |-
      grondige kennis van bij en krachtens de wet vastgestelde, voor bestuurders van motorrijtuigen van die categorie
      geldende voorschriften en het op juiste wijze toepassen van die kennis, alsmede kennis van bij en krachtens de
      [wet][ref1] vastgestelde, voor andere verkeersdeelnemers dan die bestuurders geldende voorschriften;


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel64a
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: 64a.b
    text: kennis van de mogelijkheid van conflicteren van eigen belangen en belangen van andere verkeersdeelnemers;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel64a
  - number: 64a.c
    text: |-
      inzicht in verkeersrisico’s die relevant zijn voor bestuurders van motorrijtuigen van die categorie, en in factoren
      die de rijvaardigheid kunnen beïnvloeden;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel64a
  - number: 64a.d
    text: |-
      kennis van de hoofdbeginselen van eerste hulp bij ongelukken en van elementaire maatregelen, te treffen bij
      verkeersongevallen;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel64a
  - number: 64a.e
    text: |-
      inzicht in de werking en het elementaire onderhoud van de voor de verkeersveiligheid en voor het milieu van belang
      zijnde voertuigonderdelen, veiligheidsvoorzieningen en uitrustingsstukken;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel64a
  - number: 64a.f
    text: kennis van en inzicht in de invloed van het eigen rijgedrag op de mobiliteits- en milieuproblematiek;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel64a
  - number: 64a.g
    text: kennis van en inzicht in de wijze waarop lading veilig moet worden vervoerd;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel64a
  - number: 64a.h
    text: kennis van en inzicht in de werking en defecten van de belangrijkste voertuigonderdelen en vloeistoffen.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel64a
  - number: '65.1'
    text: |-
      Indien de aanvrager bij het theorie-examen naar het oordeel van het CBR heeft voldaan aan de eisen, registreert het
      CBR ten behoeve van de aanvrager dat hij is geslaagd voor het theorie-examen en draagt het CBR er zorg voor dat het
      resultaat van het examen aan de aanvrager bekend wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel65
  - number: '65.2'
    text: |-
      Ten behoeve van [artikel 7, eerste lid, onderdeel a, en tweede lid, onderdelen e, f en h][ref1], geeft het CBR aan
      de betrokken kandidaat een verklaring af dat deze is geslaagd voor de rijbewijscategorie AM, respectievelijk ten
      behoeve van de rijbewijscategorie A.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel7
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '7'
        hoofdstuk: I
        paragraaf: '4'
  - number: '67'
    text: 'Voor de toelating tot het praktijkexamen voor de rijbewijscategorie AM moet zijn voldaan aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel67
  - number: 67.a
    text: |-
      de aanvrager dient niet langer dan een jaar en zes maanden voor de dag van het praktijkexamen te zijn geslaagd voor
      het theorie-examen voor deze categorie;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel67
  - number: 67.b
    text: |-
      de aanvrager dient bij de aanvraag een op zijn naam gesteld identiteitsbewijs als bedoeld in
      [artikel 1, eerste lid, onder 1°, 2° of 3°, van de Wet op de identificatieplicht][ref1] over te leggen, dan wel
      een eerder aan de aanvrager afgegeven rijbewijs dat hetzij nog geldig is hetzij zijn geldigheid heeft verloren door
      het verstrijken van de geldigheidsduur.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 67a.1
    text: 'Voor de toelating tot het praktijkexamen voor de rijbewijscategorie A1 moet zijn voldaan aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel67a
  - number: 67a.1.a
    text: |-
      de aanvrager dient niet langer dan een jaar en zes maanden voor de dag van het praktijkexamen te zijn geslaagd voor
      het theorie-examen ten behoeve van de rijbewijscategorie A of dient aan te tonen dat hij beschikt over een door
      het daartoe bevoegde militaire gezag niet langer dan een jaar en zes maanden voor de dag van het examen afgegeven
      theoriecertificaat ten behoeve van de rijbewijscategorie A;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel67a
  - number: 67a.1.b
    text: |-
      de aanvrager dient bij de aanvraag een op zijn naam gesteld identiteitsbewijs als bedoeld in
      [artikel 1, eerste lid, onder 1°, 2° of 3°, van de Wet op de identificatieplicht][ref1] over te leggen, dan wel
      een eerder aan de aanvrager afgegeven rijbewijs dat hetzij nog geldig is hetzij zijn geldigheid heeft verloren door
      het verstrijken van de geldigheidsduur.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel67a
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 67a.2
    text: |-
      Indien de aanvraag betrekking heeft op het praktijkexamen verkeersdeelneming voor de rijbewijscategorie A1 moet
      de aanvrager tevens niet langer dan een jaar voor de dag van dat examen zijn geslaagd voor het praktijkexamen
      voertuigbeheersing voor die categorie.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel67a
  - number: 67a.3
    text: |-
      Voor de toepassing van het eerste lid, onderdeel a, wordt, voor zover het de toelating tot het praktijkexamen
      voertuigbeheersing voor de rijbewijscategorie A1 betreft, met de registratie dat de aanvrager is geslaagd voor het
      theorie-examen ten behoeve van de rijbewijscategorie A gelijkgesteld:
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel67a
  - number: 67a.3.a
    text: een geldig rijbewijs B of
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel67a
  - number: 67a.3.b
    text: |-
      een geldig rijbewijs B, afgegeven door het daartoe bevoegde gezag in een andere lidstaat van de Europese Unie of in
      een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel67a
  - number: 67a.4
    text: |-
      Het eerste lid, onderdeel a, geldt niet, indien de aanvrager aantoont dat hij op de datum van het praktijkexamen
      reeds beschikt over:
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel67a
  - number: 67a.4.a
    text: |-
      een geldig rijbewijs A1 dat slechts geldig is voor het besturen van motorrijtuigen van die categorie met
      automatische schakeling, of
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel67a
  - number: 67a.4.b
    text: |-
      een geldig rijbewijs A1, afgegeven door het daartoe bevoegde gezag in een andere lidstaat van de Europese Unie of
      in een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland,
      dat slechts geldig is voor het besturen van motorrijtuigen van die categorie met automatische schakeling.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel67a
  - number: 67a.5
    text: |-
      Het tweede lid geldt niet, indien de aanvrager aantoont dat hij op de datum van het praktijkexamen in het bezit
      is van:
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel67a
  - number: 67a.5.a
    text: |-
      een geldig rijbewijs A1 dat slechts geldig is voor het besturen van motorrijtuigen van die categorie met
      automatische schakeling, of
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel67a
  - number: 67a.5.b
    text: |-
