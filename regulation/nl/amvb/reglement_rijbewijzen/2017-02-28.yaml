      theorie-examen voor de rijbewijscategorie B gelijkgesteld een door het daartoe bevoegde militaire gezag niet langer
      dan een jaar en zes maanden voor de dag van het examen afgegeven theoriecertificaat voor de rijbewijscategorie B.
