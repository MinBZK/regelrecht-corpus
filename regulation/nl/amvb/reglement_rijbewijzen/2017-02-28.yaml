      [47, eerste lid, onderdeel c onder II][ref2], en [48, eerste lid, onderdeel c onder II][ref3], worden in het
      overgelegde rijbewijs omschreven eisen ten aanzien van de inrichting van het voertuig en de eis dat de aanvrager
      corrigerende lenzen draagt, niet aangemerkt als beperkende aantekeningen die niet zijn aangeduid met de
      geharmoniseerde codes van de Europese Gemeenschap.


