        bwb_id: BWBR0006622
        artikel: 123b
  - number: 42b.6
    text: |-
      Het tweede lid, onderdeel c, onder II, is niet van toepassing voor zover de aanvraag, bedoeld in het eerste lid,
      betrekking heeft op de afgifte van een rijbewijs voor de categorie AM.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel42b
  - number: 42b.7
    text: |-
      Indien het rijbewijs wegens vermissing of diefstal niet kan worden overgelegd, worden in plaats daarvan de volgende
      documenten overgelegd:
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel42b
  - number: 42b.7.a
    text: |-
      een proces-verbaal ter zake van vermissing of diefstal, in Nederland op ambtseed opgemaakt door een daartoe bevoegd
      algemeen of buitengewoon opsporingsambtenaar, waarin de omstandigheden waaronder het rijbewijs verloren is geraakt
      of teniet is gegaan, worden omschreven;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel42b
  - number: 42b.7.b
    text: |-
      indien het een rijbewijs betreft afgegeven door het daartoe bevoegde gezag buiten Nederland, een door dat gezag
      afgegeven gewaarmerkte verklaring waaruit van de afgifte en de geldigheid blijkt en waaruit tevens blijkt dat
      door dat gezag tegen de aanvrager geen maatregelen van bestuursrechtelijke of strafrechtelijke aard betreffende de
      beperking, schorsing, intrekking of nietigverklaring van de rijbevoegdheid zijn getroffen en dat bij dat gezag ook
      overigens geen bezwaar tegen afgifte van een rijbewijs bestaat.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel42b
  - number: 42c
    text: |-
      Indien het rijbewijs, bedoeld in [artikel 42a, eerste lid][ref1], een rijbewijs betreft als bedoeld in de
      [artikelen 44, eerste lid][ref2], [45, eerste lid][ref3], [46, eerste lid][ref4], [47, eerste lid][ref5], of
      [48, eerste lid][ref6], dient dit rijbewijs, in aanvulling op [artikel 42b][ref7], te voldoen aan de in de
      artikelen 44, 45, 46, 47 of 48 voor omwisseling gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel42a
      [ref2]: https://wetten.overheid.nl/BWBR0008074#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0008074#Artikel45
      [ref4]: https://wetten.overheid.nl/BWBR0008074#Artikel46
      [ref5]: https://wetten.overheid.nl/BWBR0008074#Artikel47
      [ref6]: https://wetten.overheid.nl/BWBR0008074#Artikel48
      [ref7]: https://wetten.overheid.nl/BWBR0008074#Artikel42b
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel42c
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: 42a
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008074
        artikel: '44'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0008074
        artikel: '45'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0008074
        artikel: '46'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0008074
        artikel: '47'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0008074
        artikel: '48'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref7
        bwb_id: BWBR0008074
        artikel: 42b
        hoofdstuk: II
        paragraaf: '2'
  - number: 42d.1
    text: |-
      Indien de aanvraag voor een rijbewijs, bedoeld in [artikel 42a, eerste lid][ref1], niet op alle categorieën
      als bedoeld in [artikel 42b, tweede lid][ref2], betrekking had en ten aanzien van de aanvrager op basis van de
      procedure van artikel 42b een verklaring van rijvaardigheid is geregistreerd, is [artikel 36][ref3] van toepassing
      op elke aanvraag die betrekking heeft op de afgifte van een rijbewijs dat geldig is voor meer categorieën dan
      vermeld op de verklaring van rijvaardigheid op grond van artikel 42b, eerste lid, dan wel waarvoor het inmiddels
      afgegeven rijbewijs geldig is.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel42a
      [ref2]: https://wetten.overheid.nl/BWBR0008074#Artikel42b
      [ref3]: https://wetten.overheid.nl/BWBR0008074#Artikel36
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel42d
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: 42a
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008074
        artikel: 42b
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0008074
        artikel: '36'
        hoofdstuk: II
        paragraaf: '2'
  - number: 42d.2
    text: |-
      In afwijking van het eerste lid kan de procedure van [artikel 42b][ref1] een tweede keer worden gevolgd, indien de
      eerste aanvraag op basis van [artikel 42a][ref2] uitsluitend betrekking had op een rijbewijs voor de categorie T.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel42b
      [ref2]: https://wetten.overheid.nl/BWBR0008074#Artikel42a
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel42d
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: 42b
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008074
        artikel: 42a
        hoofdstuk: II
        paragraaf: '2'
  - number: 42e.1
    text: |-
      Verklaringen van geschiktheid of verklaringen van rijvaardigheid, geregistreerd voor de registratie van de
      ongeldigheid, bedoeld in [artikel 123b, eerste lid, van de wet][ref1], of de registratie, bedoeld in artikel 123b,
      derde lid, van de wet vervallen op dat tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel123b
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel42e
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 123b
  - number: 42e.2
    text: |-
      Indien aan de aanvrager een ander rijbewijs is of wordt afgegeven na het tijdstip waarop de in
      [artikel 123b, eerste lid, van de wet][ref1] bedoelde rechterlijke uitspraak onherroepelijk is geworden en voor
      het tijdstip waarop de daaraan in dat lid verbonden ongeldigheid in het rijbewijzenregister is geregistreerd, dan
      wel vòòr het tijdstip waarop de in dat artikel bedoelde aantekening in dat register is geplaatst, verliest dat
      andere rijbewijs zijn geldigheid voor alle categorieën waarvoor het is afgegeven en voor de resterende duur van
      de geldigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel123b
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel42e
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 123b
  - number: '43.1'
    text: |-
      Indien de aanvraag betrekking heeft op de afgifte van een rijbewijs ter vervanging van een eerder aan de aanvrager
      afgegeven rijbewijs dat op grond van [artikel 123, eerste lid, onderdeel d, van de wet][ref1] zijn geldigheid heeft
      verloren, dient bij de aanvraag aan de volgende vereisten te worden voldaan:


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel123
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '123'
  - number: 43.1.a
    text: |-
      behoudens de in [artikel 33][ref1] genoemde bescheiden wordt tevens het eerder aan de aanvrager afgegeven,
      ongeldige, rijbewijs overgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel33
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '33'
        hoofdstuk: II
        paragraaf: '2'
  - number: 43.1.b
    text: |-
      in het rijbewijzenregister is ten behoeve van de aanvrager een verklaring van geschiktheid geregistreerd, waarbij
      de datum van registratie niet langer dan een jaar vóór de aanvraag mag liggen, indien
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel43
  - number: 43.1.b.I
    text: |-
      de aanvraag mede betrekking heeft op een der rijbewijscategorieën C, C1, D, D1, E bij C, E bij C1, E bij D of E
      bij D1,
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel43
  - number: 43.1.b.II
    text: de aanvrager de leeftijd van 75 jaren heeft bereikt,
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel43
  - number: 43.1.b.III
    text: |-
      de aanvrager de leeftijd van 70 jaren heeft bereikt en in het bezit is van een rijbewijs waarvan de geldigheidsduur
      verstrijkt op of na de dag waarop hij de leeftijd van 75 jaren bereikt, dan wel
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel43
  - number: 43.1.b.IV
    text: |-
      blijkens een aantekening in het rijbewijzenregister naar het oordeel van het CBR de registratie van een dergelijke
      verklaring noodzakelijk is op grond van de bij het CBR bekend zijnde gegevens met betrekking tot de lichamelijke en
      geestelijke geschiktheid van de aanvrager.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel43
  - number: '43.2'
    text: |-
      Het eerste lid, onderdeel b, is niet van toepassing op aanvragen die betrekking hebben op afgifte van een rijbewijs
      voor de categorie AM.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel43
  - number: '44.1'
    text: |-
      Indien de aanvraag betrekking heeft op de afgifte van een rijbewijs voor een andere categorie dan de categorie T
      tegen overlegging van een rijbewijs, aan de aanvrager afgegeven door het daartoe bevoegde gezag in Aruba, Curaçao,
      Sint Maarten of in de openbare lichamen Bonaire, Sint Eustatius en Saba, dient bij de aanvraag aan de volgende
      vereisten te worden voldaan:
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel44
  - number: 44.1.a
    text: |-
      behoudens de in [artikel 33][ref1] genoemde bescheiden wordt tevens het eerder aan de aanvrager afgegeven rijbewijs
      overgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel33
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '33'
        hoofdstuk: II
        paragraaf: '2'
  - number: 44.1.b
    text: |-
      in het rijbewijzenregister is ten behoeve van de aanvrager een verklaring van geschiktheid geregistreerd voor
      iedere rijbewijscategorie waarop de aanvraag betrekking heeft, waarbij de datum van registratie niet langer dan een
      jaar vóór de aanvraag mag liggen, met uitzondering van de rijbewijscategorie AM.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel44
  - number: '44.2'
    text: 'Het over te leggen rijbewijs dient:'
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel44
  - number: 44.2.a
    text: op het moment van de aanvraag nog geldig te zijn;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel44
  - number: 44.2.b
    text: |-
      aan de aanvrager te zijn afgegeven in een periode van één jaar waarin hij ten minste 185 dagen in Aruba, Curaçao,
      Sint Maarten of in de openbare lichamen Bonaire, Sint Eustatius en Saba woonachtig is geweest.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel44
  - number: '44.3'
    text: 'Het tweede lid, onderdeel a, geldt niet indien:'
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel44
  - number: 44.3.a
    text: het over te leggen rijbewijs is afgegeven door omwisseling tegen een eerder aan de aanvrager afgegeven rijbewijs,
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel44
  - number: 44.3.b
    text: |-
      de aanvraag betrekking heeft op dezelfde rijbewijscategorie of rijbewijscategorieën waarvoor dat eerder aan de
      aanvrager afgegeven rijbewijs geldig was, en
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel44
  - number: 44.3.c
    text: het over te leggen rijbewijs zijn geldigheid heeft verloren door het verstrijken van de geldigheidsduur.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel44
  - number: '44.4'
    text: |-
      Het tweede lid, onderdeel b, geldt niet indien het over te leggen rijbewijs is afgegeven tegen overlegging van
      een eerder aan de aanvrager afgegeven rijbewijs en de aanvraag betrekking heeft op dezelfde rijbewijscategorie of
      rijbewijscategorieën waarvoor dat eerder aan de aanvrager afgegeven rijbewijs geldig was.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel44
  - number: '44.5'
    text: |-
      Indien het rijbewijs wegens vermissing of diefstal niet kan worden overgelegd, worden in plaats daarvan de volgende
      documenten overgelegd:
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel44
  - number: 44.5.a
    text: |-
      een proces-verbaal ter zake van vermissing of diefstal, in Nederland op ambtseed opgemaakt door een daartoe bevoegd
      algemeen of buitengewoon opsporingsambtenaar, waarin de omstandigheden waaronder het rijbewijs verloren is geraakt
      of teniet is gegaan worden omschreven;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel44
  - number: 44.5.b
    text: |-
      een door het gezag dat het rijbewijs heeft afgegeven gewaarmerkte verklaring waaruit van de afgifte en
      de geldigheid blijkt en waaruit tevens blijkt dat door dat gezag tegen de aanvrager geen maatregelen van
      bestuursrechtelijke of strafrechtelijke aard betreffende de beperking, schorsing, intrekking of nietigverklaring
      van de rijbevoegdheid zijn getroffen en dat bij dat gezag ook overigens geen bezwaar tegen afgifte van een
      rijbewijs bestaat.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel44
  - number: '44.6'
    text: |-
      Indien de aanvraag betrekking heeft op een rijbewijs waarop een getuigschrift van vakbekwaamheid of een
      getuigschrift van nascholing wordt vermeld, dient, behoudens aan de in het eerste en tweede lid genoemde vereisten,
      bij de aanvraag aan de volgende vereisten te worden voldaan:
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel44
  - number: 44.6.a
    text: |-
      de aanvrager overlegt een door de bevoegde autoriteit van een lidstaat van de Europese Gemeenschap overeenkomstig
      de richtlijn vakbekwaamheid bestuurders aan de aanvrager afgegeven geldige kwalificatiekaart bestuurder;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel44
  - number: 44.6.b
    text: de aanvrager overlegt een geldig buitenlands omwisselingscertificaat, dan wel
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel44
  - number: 44.6.c
    text: |-
      ten behoeve van de aanvrager is in het rijbewijzenregister een verklaring van vakbekwaamheid of een verklaring van
      nascholing geregistreerd, waarbij de datum van registratie niet langer dan vijf jaren vóór de aanvraag mag liggen.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel44
  - number: '44.7'
    text: |-
      Indien de in het voorgaande lid, onder a of b, genoemde documenten wegens vermissing of diefstal niet kunnen worden
      overgelegd, worden in plaats daarvan de volgende documenten overgelegd:
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel44
  - number: 44.7.a
    text: |-
      een proces-verbaal ter zake van vermissing of diefstal van de kwalificatiekaart bestuurder dan wel het buitenlands
      omwisselingscertificaat, in Nederland op ambtseed is opgemaakt door een daartoe bevoegd algemeen of buitengewoon
      opsporingsambtenaar waarin de omstandigheden waaronder de kwalificatiekaart bestuurder dan wel het buitenlands
      omwisselingscertificaat verloren is geraakt of teniet is gegaan worden omschreven;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel44
  - number: 44.7.b
    text: |-
      een door het gezag dat de kwalificatiekaart bestuurder dan wel het buitenlands omwisselingscertificaat heeft
      afgegeven, gewaarmerkte verklaring waaruit van de afgifte en de geldigheid blijkt en waaruit tevens blijkt dat
      door dat gezag tegen de aanvrager geen maatregelen van bestuursrechtelijke of strafrechtelijke aard betreffende de
      beperking, schorsing, intrekking of nietigverklaring van de kwalificatiekaart bestuurder dan wel het buitenlands
      omwisselingscertificaat zijn getroffen en dat bij dat gezag ook overigens geen bezwaar tegen afgifte van een
      getuigschrift van vakbekwaamheid dan wel een getuigschrift van nascholing bestaat.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel44
  - number: '45.1'
    text: |-
      Indien de aanvraag betrekking heeft op de afgifte van een rijbewijs tegen overlegging van een rijbewijs, aan de
      aanvrager afgegeven door het daartoe bevoegde gezag in een andere lidstaat van de Europese Gemeenschap of in een
      andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, dient bij
      de aanvraag aan de volgende vereisten te worden voldaan:
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel45
  - number: 45.1.a
    text: |-
      behoudens de in [artikel 33][ref1] genoemde bescheiden wordt bij de aanvraag tevens het door dat gezag afgegeven
      rijbewijs overgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel33
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '33'
        hoofdstuk: II
        paragraaf: '2'
  - number: 45.1.b
    text: |-
      in het rijbewijzenregister is ten behoeve van de aanvrager een verklaring van geschiktheid geregistreerd voor
      iedere rijbewijscategorie waarop de aanvraag betrekking heeft, waarbij de datum van registratie niet langer dan een
      jaar vóór de aanvraag mag liggen, met uitzondering van de rijbewijscategorie AM, indien
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel45
  - number: 45.1.b.I
    text: |-
      de aanvraag mede betrekking heeft op een der rijbewijscategorieën C, C1, D, D1, E bij C, E bij C1, E bij D of E
      bij D1,
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel45
  - number: 45.1.b.II
    text: |-
      het overgelegde rijbewijs is afgegeven voor een kortere geldigheidsduur dan de in de staat van afgifte
      gebruikelijke termijn van geldigheid;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel45
  - number: 45.1.b.III
    text: |-
      het overgelegde rijbewijs beperkende aantekeningen bevat die niet zijn aangeduid met de geharmoniseerde codes van
      de Europese Gemeenschap;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel45
  - number: 45.1.b.IV
    text: de aanvrager op het moment van indiening van de aanvraag de leeftijd van 75 jaren heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel45
  - number: 45.1.b.V
    text: |-
      de aanvrager op het moment van indiening de leeftijd van 70 jaren heeft bereikt en in het bezit is van een
      rijbewijs waarvan de geldigheidsduur verstrijkt op of na de dag waarop hij de leeftijd van 75 jaren bereikt;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel45
  - number: 45.1.c
    text: |-
      indien de aanvraag uitsluitend of mede betrekking heeft op de rijbewijscategorie T kan het rijbewijs voor die
      categorie alleen worden omgewisseld indien het om te wisselen rijbewijs voor de categorie T is aangewezen bij
      ministeriële regeling.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel45
  - number: '45.2'
    text: |-
      Het over te leggen rijbewijs dient op het moment van de aanvraag hetzij nog geldig te zijn hetzij, indien het zijn
      geldigheid heeft verloren door het verstrijken van de geldigheidsduur, vergezeld te gaan van een door het gezag
      dat het rijbewijs heeft afgegeven gewaarmerkte verklaring waaruit blijkt dat door dat gezag tegen de aanvrager geen
      maatregelen van bestuursrechtelijke of strafrechtelijke aard betreffende de beperking, schorsing, intrekking of
      nietigverklaring van de rijbevoegdheid zijn getroffen en dat bij dat gezag ook overigens geen bezwaar tegen afgifte
      van een rijbewijs bestaat.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel45
  - number: '45.3'
    text: |-
      Indien het over te leggen rijbewijs op het moment van de aanvraag zijn geldigheid heeft verloren
      doordat in een andere lidstaat van de Europese Unie, een andere staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte of Zwitserland een maatregel met betrekking tot het
      rijbewijs is opgelegd in verband met ontbrekende geschiktheid, respectievelijk rijvaardigheid, is
      [artikel 42, eerste, respectievelijk tweede lid][ref1], van overeenkomstige toepassing, met dien verstande dat,
      als op het tijdstip van de aanvraag dan wel uiterlijk op het tijdstip van uitreiking van dat rijbewijs aan de
      aanvrager blijkt dat er in een andere lidstaat van de Europese Unie, in een andere staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruime of in Zwitserland door het daartoe bevoegde gezag aan
      de aanvrager een verbod is opgelegd om gedurende een bepaalde periode een rijbewijs te verkrijgen, geen afgifte
      plaatsvindt gedurende die termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel42
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '42'
        hoofdstuk: II
        paragraaf: '2'
  - number: '45.4'
    text: |-
      Indien het rijbewijs wegens vermissing of diefstal niet kan worden overgelegd worden in plaats daarvan de volgende
      documenten overgelegd:
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel45
  - number: 45.4.a
    text: |-
      een proces-verbaal ter zake van vermissing of diefstal, in Nederland op ambtseed opgemaakt door een daartoe bevoegd
      algemeen of buitengewoon opsporingsambtenaar, waarin de omstandigheden waaronder het rijbewijs verloren is geraakt
      of teniet is gegaan, worden omschreven;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel45
  - number: 45.4.b
    text: |-
      een door het gezag dat het rijbewijs heeft afgegeven, gewaarmerkte verklaring waaruit van de afgifte en
      de geldigheid blijkt en waaruit tevens blijkt dat door dat gezag tegen de aanvrager geen maatregelen van
      bestuursrechtelijke of strafrechtelijke aard betreffende de beperking, schorsing, intrekking of nietigverklaring
      van de rijbevoegdheid zijn getroffen en dat bij dat gezag ook overigens geen bezwaar tegen afgifte van een
      rijbewijs bestaat.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel45
  - number: '45.5'
    text: |-
      Indien de aanvraag betrekking heeft op de afgifte van een rijbewijs dat geldig is voor meer categorieën dan het
      door de aanvrager overgelegde rijbewijs, dient, behoudens aan de in het eerste lid genoemde vereisten, bij de
      aanvraag aan de volgende vereisten te worden voldaan:
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel45
  - number: 45.5.a
    text: |-
      in het rijbewijzenregister is ten behoeve van de aanvrager een verklaring van rijvaardigheid geregistreerd voor
      iedere rijbewijscategorie waarop de aanvraag betrekking heeft en waarvoor het door de aanvrager overgelegde
      rijbewijs niet geldig is, waarbij de datum van registratie niet langer dan drie jaar vóór de aanvraag mag liggen;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel45
  - number: 45.5.b
    text: |-
      in het rijbewijzenregister is ten behoeve van de aanvrager een verklaring van geschiktheid geregistreerd voor
      iedere rijbewijscategorie waarop de aanvraag betrekking heeft en waarvoor het door de aanvrager overgelegde
      rijbewijs niet geldig is, waarbij de datum van registratie niet langer dan een jaar vóór de aanvraag mag liggen,
      met uitzondering van de rijbewijscategorie AM.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel45
  - number: '45.6'
    text: |-
      Voor de toepassing van het vijfde lid onderdeel a, wordt met een niet langer dan drie jaar vóór de aanvraag in
      het rijbewijzenregister geregistreerde verklaring van rijvaardigheid gelijkgesteld een door het daartoe bevoegde
      militaire gezag niet langer dan drie jaar voor de aanvraag in het rijbewijzenregister geregistreerde verklaring van
      rijvaardigheid voor het besturen van motorrijtuigen.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel45
  - number: '45.7'
    text: |-
      Indien de aanvraag betrekking heeft op een rijbewijs waarop een getuigschrift van vakbekwaamheid of een
      getuigschrift van nascholing wordt vermeld, dient, behoudens aan de in het eerste en tweede lid genoemde vereisten,
      bij de aanvraag aan de volgende vereisten te worden voldaan:
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel45
  - number: 45.7.a
    text: |-
      de aanvrager overlegt een door de bevoegde autoriteit van een lidstaat van de Europese Gemeenschap overeenkomstig
      de richtlijn vakbekwaamheid bestuurders aan de aanvrager afgegeven geldige kwalificatiekaart bestuurder;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel45
  - number: 45.7.b
    text: |-
      het door de aanvrager over te leggen rijbewijs is door de bevoegde autoriteit van een lidstaat van de Europese
      Gemeenschap overeenkomstig de richtlijn vakbekwaamheid bestuurders voorzien van een geldige in die richtlijn
      bedoelde communautaire code,
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel45
  - number: 45.7.c
    text: de aanvrager overlegt een geldig buitenlands omwisselingscertificaat, dan wel
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel45
  - number: 45.7.d
    text: |-
      ten behoeve van de aanvrager is in het rijbewijzenregister een verklaring van vakbekwaamheid of een verklaring van
      nascholing geregistreerd, waarbij de datum van registratie niet langer dan vijf jaren vóór de aanvraag mag liggen.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel45
  - number: '45.8'
    text: |-
      Indien de in het voorgaande lid, onder a of c, genoemde documenten wegens vermissing of diefstal niet kunnen worden
      overgelegd, is [artikel 44, zevende lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel44
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '44'
        hoofdstuk: II
        paragraaf: '2'
  - number: '45.9'
    text: |-
      Indien het in het zevende lid, onder b, genoemde document wegens vermissing of diefstal niet kan worden overgelegd,
      blijkt uit de gewaarmerkte verklaring, bedoeld in het vierde lid, onder b, de vermelding van de communautaire code
      en blijkt tevens dat geen maatregelen van bestuursrechtelijke of strafrechtelijke aard betreffende de beperking,
      schorsing, intrekking of nietigverklaring van die code zijn getroffen en dat bij dat gezag ook overigens geen
      bezwaar tegen afgifte van een getuigschrift van vakbekwaamheid dan wel een getuigschrift van nascholing bestaat.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel45
  - number: '46.1'
    text: |-
      Indien de aanvraag betrekking heeft op de afgifte van een rijbewijs voor een andere categorie dan de categorie T
      tegen overlegging van een rijbewijs, aan de aanvrager afgegeven door het daartoe bevoegde gezag buiten Nederland,
      anders dan in Aruba, Curaçao, Sint Maarten, de openbare lichamen Bonaire, Sint Eustatius en Saba, in een andere
      lidstaat van de Europese Gemeenschap of in een andere staat die partij is bij de Overeenkomst betreffende de
      Europese Economische Ruimte of Zwitserland, dient bij de aanvraag aan de volgende vereisten te worden voldaan:
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel46
  - number: 46.1.a
    text: |-
      behoudens de in [artikel 33][ref1] genoemde bescheiden wordt tevens het door dat gezag afgegeven rijbewijs
      overgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel33
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '33'
        hoofdstuk: II
        paragraaf: '2'
  - number: 46.1.b
    text: |-
      in het rijbewijzenregister is ten behoeve van de aanvrager een verklaring van geschiktheid geregistreerd voor
      iedere rijbewijscategorie waarop de aanvraag betrekking heeft, waarbij de datum van registratie niet langer dan een
      jaar vóór de aanvraag mag liggen, met uitzondering van de rijbewijscategorie AM.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel46
  - number: '46.2'
    text: 'Het over te leggen rijbewijs dient:'
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel46
  - number: 46.2.a
    text: op het moment van de aanvraag nog geldig te zijn;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel46
  - number: 46.2.b
    text: |-
      aan de aanvrager te zijn afgegeven in een periode van één jaar waarin hij ten minste 185 dagen in het land van
      afgifte van dat bewijs woonachtig is geweest.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel46
  - number: '46.3'
    text: 'Het tweede lid, onderdeel a, geldt niet indien:'
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel46
  - number: 46.3.a
    text: het over te leggen rijbewijs is afgegeven door omwisseling tegen een eerder aan de aanvrager afgegeven rijbewijs,
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel46
  - number: 46.3.b
    text: |-
      de aanvraag betrekking heeft op dezelfde rijbewijscategorie of rijbewijscategorieën waarvoor dat eerder aan de
      aanvrager afgegeven rijbewijs geldig was, en
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel46
  - number: 46.3.c
    text: het over te leggen rijbewijs zijn geldigheid heeft verloren door het verstrijken van de geldigheidsduur.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel46
  - number: '46.4'
    text: |-
      Het tweede lid, onderdeel b, geldt niet indien het over te leggen rijbewijs is afgegeven door omwisseling tegen
      een eerder aan de aanvrager afgegeven rijbewijs en de aanvraag betrekking heeft op dezelfde rijbewijscategorie of
      rijbewijscategorieën waarvoor dat eerder aan de aanvrager afgegeven rijbewijs geldig was.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel46
  - number: '46.5'
    text: |-
      Het over te leggen rijbewijs en de wijze van verkrijging daarvan dienen bij ministeriële regeling te zijn
      aangewezen als zijnde ten minste gelijkwaardig aan rijbewijzen en de verkrijging daarvan zoals voorzien in
      richtlijn nr. 2006/126/EG, van het Europees Parlement en de Raad van de Europese Unie van 20 december 2006
      betreffende het rijbewijs (PbEU L 403), dan wel dient het over te leggen rijbewijs bij ministeriële regeling te
      zijn aangewezen als een rijbewijs dat om redenen van algemeen belang voor omwisseling in aanmerking komt.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel46
  - number: '46.6'
    text: |-
      Het vijfde lid geldt niet indien het over te leggen rijbewijs is afgegeven door omwisseling tegen een eerder
      aan de aanvrager afgegeven rijbewijs en de aanvraag betrekking heeft op dezelfde rijbewijscategorie of
      rijbewijscategorieën waarvoor dat eerder aan de aanvrager afgegeven rijbewijs geldig was.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel46
  - number: '46.7'
    text: |-
      Indien de aanvraag betrekking heeft op een rijbewijs waarop een getuigschrift van vakbekwaamheid of een
      getuigschrift van nascholing wordt vermeld, dient, behoudens aan de in het eerste en tweede lid genoemde vereisten,
      bij de aanvraag aan de volgende vereisten te worden voldaan:
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel46
  - number: 46.7.a
    text: |-
      de aanvrager overlegt een door de bevoegde autoriteit van een lidstaat van de Europese Gemeenschap overeenkomstig
      de richtlijn vakbekwaamheid bestuurders aan de aanvrager afgegeven geldige kwalificatiekaart bestuurder;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel46
  - number: 46.7.b
    text: de aanvrager overlegt een geldig buitenlands omwisselingscertificaat, dan wel
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel46
  - number: 46.7.c
    text: |-
      ten behoeve van de aanvrager is in het rijbewijzenregister een verklaring van vakbekwaamheid of een verklaring van
      nascholing geregistreerd, waarbij de datum van registratie niet langer dan vijf jaren vóór de aanvraag mag liggen.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel46
  - number: '46.8'
    text: |-
      Indien de in het voorgaande lid, onder a of b, genoemde documenten wegens vermissing of diefstal niet kunnen worden
      overgelegd, is [artikel 44, zevende lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel44
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '44'
        hoofdstuk: II
        paragraaf: '2'
  - number: '47.1'
    text: |-
      Indien de aanvraag betrekking heeft op de afgifte van een rijbewijs voor een andere categorie dan de categorie T
      tegen overlegging van een rijbewijs, door het daartoe bevoegde gezag buiten Nederland afgegeven aan een aanvrager
      die vreemdeling in de zin van de [Vreemdelingenwet 2000][ref1] is en aan wie op grond van diens hoedanigheid van
      of betrekking tot diplomatiek of consulair personeel dan wel op grond van diens hoedanigheid van of betrekking tot
      personeel in dienst van een in Nederland gevestigde internationale organisatie door Onze Minister van Buitenlandse
      Zaken een identiteitsbewijs voor geprivilegieerden is verstrekt, dient bij de aanvraag aan de volgende vereisten te
      worden voldaan:


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: 47.1.a
    text: |-
      behoudens de in [artikel 33][ref1] genoemde bescheiden wordt tevens het door dat gezag afgegeven rijbewijs
      overgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel33
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '33'
        hoofdstuk: II
        paragraaf: '2'
  - number: 47.1.b
    text: |-
      indien het overgelegde rijbewijs is afgegeven door het daartoe bevoegde gezag buiten Nederland, anders dan in een
      andere lidstaat van de Europese Gemeenschap of in een andere staat die partij is bij de Overeenkomst betreffende
      de Europese Economische Ruimte of Zwitserland, is in het rijbewijzenregister een verklaring van geschiktheid
      geregistreerd voor iedere rijbewijscategorie waarop de aanvraag betrekking heeft, waarbij de datum van registratie
      niet langer dan een jaar vóór de aanvraag mag liggen, met uitzondering van de rijbewijscategorie AM;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel47
  - number: 47.1.c
    text: |-
      indien het overgelegde rijbewijs is afgegeven door het daartoe bevoegde gezag in een andere lidstaat van de
      Europese Gemeenschap of in een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische
      Ruimte of Zwitserland, is in het rijbewijzenregister een verklaring van geschiktheid geregistreerd voor iedere
      rijbewijscategorie waarop de aanvraag betrekking heeft, waarbij de datum van registratie niet langer dan een jaar
      vóór de aanvraag mag liggen, met uitzondering van de rijbewijscategorie AM, indien
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel47
  - number: 47.1.c.I
    text: |-
      de aanvraag mede betrekking heeft op een der rijbewijscategorieën C, C1, D, D1, E bij C, E bij C1, E bij D of E
      bij D1,
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel47
  - number: 47.1.c.II
    text: |-
      het overgelegde rijbewijs is afgegeven voor een kortere geldigheidsduur dan de in de staat van afgifte
      gebruikelijke termijn van geldigheid;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel47
  - number: 47.1.c.III
    text: |-
      het overgelegde rijbewijs beperkende aantekeningen bevat die niet zijn aangeduid met de geharmoniseerde codes van
      de Europese Gemeenschap.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel47
  - number: '47.2'
    text: |-
      Indien het overgelegde rijbewijs is afgegeven door het daartoe bevoegde gezag buiten Nederland, anders dan in een
      andere lidstaat van de Europese Gemeenschap of in een andere staat die partij is bij de Overeenkomst betreffende
      de Europese Economische Ruimte of Zwitserland, dient het op het moment van de aanvraag nog geldig te zijn. Indien
      het overgelegde rijbewijs is afgegeven door het daartoe bevoegde gezag in een andere lidstaat van de Europese
      Gemeenschap of in een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of
      Zwitserland, dient het op het moment van de aanvraag hetzij nog geldig te zijn hetzij, indien het zijn geldigheid
      heeft verloren door het verstrijken van de geldigheidsduur, vergezeld te gaan van een door het gezag dat het
      rijbewijs heeft afgegeven gewaarmerkte verklaring waaruit blijkt dat door dat gezag tegen de aanvrager geen
      maatregelen van bestuursrechtelijke of strafrechtelijke aard betreffende de beperking, schorsing, intrekking of
      nietigverklaring van de rijbevoegdheid zijn getroffen en dat bij dat gezag ook overigens geen bezwaar tegen afgifte
      van een rijbewijs bestaat.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel47
  - number: '47.3'
    text: |-
      Indien de aanvraag betrekking heeft op een rijbewijs waarop een getuigschrift van vakbekwaamheid of een
      getuigschrift van nascholing wordt vermeld, dient, behoudens aan de in het eerste en tweede lid genoemde vereisten,
      bij de aanvraag aan de volgende vereisten te worden voldaan:
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel47
  - number: 47.3.a
    text: |-
      de aanvrager overlegt een door de bevoegde autoriteit van een lidstaat van de Europese Gemeenschap overeenkomstig
      de richtlijn vakbekwaamheid bestuurders aan de aanvrager afgegeven geldige kwalificatiekaart bestuurder;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel47
  - number: 47.3.b
    text: |-
      het door de aanvrager over te leggen rijbewijs is door de bevoegde autoriteit van een lidstaat van de Europese
      Gemeenschap overeenkomstig de richtlijn vakbekwaamheid bestuurders voorzien van een geldige in die richtlijn
      bedoelde communautaire code,
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel47
  - number: 47.3.c
    text: de aanvrager overlegt een geldig buitenlands omwisselingscertificaat, dan wel
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel47
  - number: 47.3.d
    text: |-
      ten behoeve van de aanvrager is in het rijbewijzenregister een verklaring van vakbekwaamheid of een verklaring van
      nascholing geregistreerd, waarbij de datum van registratie niet langer dan vijf jaren vóór de aanvraag mag liggen.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel47
  - number: '47.4'
    text: |-
      Indien de in het voorgaande lid, onder a of c, genoemde documenten wegens vermissing of diefstal niet kunnen worden
      overgelegd, is [artikel 44, zevende lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel44
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '44'
        hoofdstuk: II
        paragraaf: '2'
  - number: '47.5'
    text: |-
      Indien het in het derde lid, onder b, genoemde document wegens vermissing of diefstal niet kan worden overgelegd,
      is [artikel 45, vierde en negende lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel45
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '45'
        hoofdstuk: II
        paragraaf: '2'
  - number: '48.1'
    text: |-
      Indien de aanvraag betrekking heeft op de afgifte van een rijbewijs voor een andere categorie dan de categorie
      T tegen overlegging van een rijbewijs, door het daartoe bevoegde gezag buiten Nederland afgegeven aan een in het
      kader van het op 19 juni 1951 te Londen gesloten Verdrag tussen de Staten die partij zijn bij het Noord-Atlantisch
      Verdrag, nopens de rechtspositie van hun krijgsmachten, in Nederland gelegerd lid van een krijgsmacht, een lid
      van de tot die krijgsmacht behorende civiele dienst of een persoon die behoort tot het gezin van een lid van een
      krijgsmacht als hiervoor bedoeld of tot het gezin van een tot de civiele dienst van zodanige krijgsmacht behorende
      persoon, dient bij de aanvraag aan de volgende vereisten te worden voldaan:
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel48
  - number: 48.1.a
    text: |-
      behoudens de in [artikel 33][ref1] genoemde bescheiden wordt tevens het door dat gezag afgegeven rijbewijs
      overgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel33
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '33'
        hoofdstuk: II
        paragraaf: '2'
  - number: 48.1.b
    text: |-
      indien het overgelegde rijbewijs is afgegeven door het daartoe bevoegde gezag buiten Nederland, anders dan in een
      andere lidstaat van de Europese Gemeenschap of in een andere staat die partij is bij de Overeenkomst betreffende
      de Europese Economische Ruimte of Zwitserland, is in het rijbewijzenregister ten behoeve van de aanvrager een
      verklaring van geschiktheid geregistreerd voor iedere rijbewijscategorie waarop de aanvraag betrekking heeft,
      waarbij de datum van registratie niet langer dan een jaar vóór de aanvraag mag liggen, met uitzondering van de
      rijbewijscategorie AM;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel48
  - number: 48.1.c
    text: |-
      indien het overgelegde rijbewijs is afgegeven door het daartoe bevoegde gezag in een andere lidstaat van de
      Europese Gemeenschap of in een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische
      Ruimte of Zwitserland, is in het rijbewijzenregister ten behoeve van de aanvrager een verklaring van geschiktheid
      geregistreerd voor iedere rijbewijscategorie waarop de aanvraag betrekking heeft, waarbij de datum van registratie
      niet langer dan een jaar vóór de aanvraag mag liggen, met uitzondering van de rijbewijscategorie AM, indien
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel48
  - number: 48.1.c.I
    text: |-
      de aanvraag mede betrekking heeft op een der rijbewijscategorieën C, C1, D, D1, E bij C, E bij C1, E bij D of E
      bij D1,
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel48
  - number: 48.1.c.II
    text: |-
      het overgelegde rijbewijs is afgegeven voor een kortere geldigheidsduur dan de in de staat van afgifte
      gebruikelijke termijn van geldigheid;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel48
  - number: 48.1.c.III
    text: |-
      het overgelegde rijbewijs beperkende aantekeningen bevat die niet zijn aangeduid met de geharmoniseerde codes van
      de Europese Gemeenschap.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel48
  - number: '48.2'
    text: |-
      Indien het overgelegde rijbewijs is afgegeven door het daartoe bevoegde gezag buiten Nederland, anders dan in een
      andere lidstaat van de Europese Gemeenschap of in een andere staat die partij is bij de Overeenkomst betreffende
      de Europese Economische Ruimte of Zwitserland, dient het op het moment van de aanvraag nog geldig te zijn. Indien
      het overgelegde rijbewijs is afgegeven door het daartoe bevoegde gezag in een andere lidstaat van de Europese
      Gemeenschap of in een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of
      Zwitserland, dient het op het moment van de aanvraag hetzij nog geldig te zijn hetzij, indien het zijn geldigheid
      heeft verloren door het verstrijken van de geldigheidsduur, vergezeld te gaan van een door het gezag dat het
      rijbewijs heeft afgegeven gewaarmerkte verklaring waaruit blijkt dat door dat gezag tegen de aanvrager geen
      maatregelen van bestuursrechtelijke of strafrechtelijke aard betreffende de beperking, schorsing, intrekking of
      nietigverklaring van de rijbevoegdheid zijn getroffen en dat bij dat gezag ook overigens geen bezwaar tegen afgifte
      van een rijbewijs bestaat.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel48
  - number: '48.3'
    text: |-
      Indien de aanvraag betrekking heeft op een rijbewijs waarop een getuigschrift van vakbekwaamheid of een
      getuigschrift van nascholing wordt vermeld, dient, behoudens aan de in het eerste en tweede lid genoemde vereisten,
      bij de aanvraag aan de volgende vereisten te worden voldaan:
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel48
  - number: 48.3.a
    text: |-
      de aanvrager overlegt een door de bevoegde autoriteit van een lidstaat van de Europese Gemeenschap overeenkomstig
      de richtlijn vakbekwaamheid bestuurders aan de aanvrager afgegeven geldige kwalificatiekaart bestuurder;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel48
  - number: 48.3.b
    text: |-
      het door de aanvrager over te leggen rijbewijs is door de bevoegde autoriteit van een lidstaat van de Europese
      Gemeenschap overeenkomstig de richtlijn vakbekwaamheid bestuurders voorzien van een geldige in die richtlijn
      bedoelde communautaire code,
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel48
  - number: 48.3.c
    text: de aanvrager overlegt een geldig buitenlands omwisselingscertificaat, dan wel
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel48
  - number: 48.3.d
    text: |-
      ten behoeve van de aanvrager is in het rijbewijzenregister een verklaring van vakbekwaamheid of een verklaring van
      nascholing geregistreerd, waarbij de datum van registratie niet langer dan vijf jaren vóór de aanvraag mag liggen.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel48
  - number: '48.4'
    text: |-
      Indien de in het voorgaande lid, onder a of c, genoemde documenten wegens vermissing of diefstal niet kunnen worden
      overgelegd, is [artikel 44, zesde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel44
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '44'
        hoofdstuk: II
        paragraaf: '2'
  - number: '48.5'
    text: |-
      Indien het in het derde lid, onder b, genoemde document wegens vermissing of diefstal niet kan worden overgelegd,
      is [artikel 45, vierde en negende lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel45
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '45'
        hoofdstuk: II
        paragraaf: '2'
  - number: 48a
    text: |-
      Indien op het moment van uitreiking van het rijbewijs het eerder aan de aanvrager afgegeven rijbewijs verloren
      is geraakt of teniet is gegaan, dient de aanvrager een proces-verbaal over te leggen terzake van verlies of
      tenietgaan van het rijbewijs, in Nederland op ambtseed opgemaakt door een daartoe bevoegd algemeen of buitengewoon
      opsporingsambtenaar. In het proces-verbaal dienen de omstandigheden waaronder het rijbewijs verloren is geraakt of
      teniet is gegaan, te worden omschreven.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel48a
  - number: 48b
    text: |-
      De einddatum van het op het af te geven rijbewijs te vermelden getuigschrift van vakbekwaamheid wordt als volgt
      vastgesteld:
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel48b
  - number: 48b.a
    text: |-
      indien ten behoeve van de aanvrager een verklaring van vakbekwaamheid is geregistreerd en het rijbewijs wordt
      aangevraagd binnen zes maanden nadat de verklaring van vakbekwaamheid is geregistreerd, wordt als einddatum vermeld
      de afgiftedatum van het rijbewijs vermeerderd met vijf jaren;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel48b
  - number: 48b.b
    text: |-
      indien ten behoeve van de aanvrager een verklaring van vakbekwaamheid is geregistreerd en het rijbewijs wordt
      aangevraagd later dan zes maanden nadat de verklaring van vakbekwaamheid is geregistreerd, wordt als einddatum
      vermeld de registratiedatum van de verklaring van vakbekwaamheid vermeerderd met vijf jaren;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel48b
  - number: 48b.c
    text: 'indien de aanvrager een van de volgende documenten overlegt:'
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel48b
  - number: 48b.c.i
    text: |-
      een door de bevoegde autoriteit van een lidstaat van de Europese Gemeenschap overeenkomstig de richtlijn
      vakbekwaamheid bestuurders aan de aanvrager afgegeven geldige kwalificatiekaart bestuurders;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel48b
  - number: 48b.c.ii
    text: een buitenlands omwisselingscertificaat of
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel48b
  - number: 48b.c.iii
    text: |-
      een door de bevoegde autoriteit van een lidstaat van de Europese Gemeenschap aan de aanvrager afgegeven rijbewijs
      die overeenkomstig de richtlijn vakbekwaamheid bestuurders is voorzien van een geldige in die richtlijn bedoelde
      communautaire code,
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel48b
  - number: 48c
    text: |-
      De einddatum van het op het af te geven rijbewijs te vermelden getuigschrift van nascholing wordt als volgt
      vastgesteld:
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel48c
  - number: 48c.a
    text: |-
      indien ten behoeve van de aanvrager in het rijbewijzenregister een verklaring van nascholing is geregistreerd
      voordat de einddatum is verstreken van
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel48c
  - number: 48c.a.i
    text: |-
      een op het eerder aan de aanvrager afgegeven rijbewijs vermelde getuigschrift van vakbekwaamheid of getuigschrift
      van nascholing;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel48c
  - number: 48c.a.ii
    text: |-
      een door de bevoegde autoriteit van een lidstaat van de Europese Gemeenschap overeenkomstig de richtlijn
      vakbekwaamheid bestuurders aan de aanvrager afgegeven geldige kwalificatiekaart bestuurders;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel48c
  - number: 48c.a.iii
    text: een buitenlands omwisselingscertificaat of
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel48c
  - number: 48c.a.iv
    text: |-
      een overeenkomstig de richtlijn vakbekwaamheid bestuurders vermelde code op een door de bevoegde autoriteit van een
      lidstaat van de Europese Gemeenschap aan de aanvrager afgegeven rijbewijs,
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel48c
  - number: 48c.b
    text: |-
      indien ten behoeve van de aanvrager in het rijbewijzenregister een verklaring van nascholing is geregistreerd nadat
      de einddatum is verstreken van de in onderdeel a, sub i tot en met iv, bedoelde documenten, en het rijbewijs wordt
      aangevraagd binnen zes maanden nadat de verklaring van nascholing is geregistreerd, wordt als einddatum vermeld de
      afgiftedatum van het rijbewijs vermeerderd met vijf jaar;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel48c
  - number: 48c.c
    text: |-
      indien ten behoeve van de aanvrager in het rijbewijzenregister een verklaring van nascholing is geregistreerd nadat
      de einddatum is verstreken van de in onderdeel a, sub i tot en met iv, bedoelde documenten, en het rijbewijs wordt
      aangevraagd later dan zes maanden nadat de verklaring van nascholing is geregistreerd, wordt als einddatum vermeld
      de registratiedatum van de verklaring van nascholing vermeerderd met vijf jaren.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel48c
  - number: 48d
    text: |-
      Voor bestuurders als bedoeld in [artikel 156q, vierde lid][ref1], wordt bij de op het af te geven rijbewijs te
      vermelden getuigschriften van nascholing dezelfde einddatum vermeld als bedoeld in [artikel 48c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel156q
      [ref2]: https://wetten.overheid.nl/BWBR0008074#Artikel48c
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel48d
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: 156q
        hoofdstuk: VIIa
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0008074
        artikel: 48c
        hoofdstuk: II
        paragraaf: '2'
  - number: '49.1'
    text: |-
      Indien de aanvraag betrekking heeft op de afgifte van een rijbewijs aan een aanvrager aan wie nog niet eerder
      een rijbewijs is afgegeven, wordt voor het verkrijgen van de nodige zekerheid over de identiteit van de
      aanvrager gebruik gemaakt van het bij de aanvraag overgelegde, op naam van de aanvrager gestelde reis- of
      identiteitsdocument, bedoeld in [artikel 33, eerste lid, onderdeel b, onder I][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel33
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: '33'
        hoofdstuk: II
        paragraaf: '2'
  - number: '49.2'
    text: |-
      In afwijking van het eerste lid wordt, indien de aanvraag betrekking heeft op de afgifte van een rijbewijs tegen
      overlegging van een rijbewijs, aan de aanvrager afgegeven door het daartoe bevoegde gezag in een andere lid-
      staat van de Europese Gemeenschap of in een andere staat die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte of Zwitserland, voor het verkrijgen van de nodige zekerheid over de identiteit van de aanvrager
      gebruik gemaakt van dat rijbewijs, mits het is voorzien van een pasfoto van de houder.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel49
  - number: '49.3'
    text: |-
      Indien de aanvraag betrekking heeft op de afgifte van een rijbewijs aan een aanvrager aan wie reeds eerder een
      rijbewijs is afgegeven, wordt voor het verkrijgen van de nodige zekerheid over de identiteit van de aanvrager
      gebruik gemaakt van het eerder aan de aanvrager afgegeven rijbewijs, mits dat rijbewijs hetzij nog geldig is hetzij
      zijn geldigheid heeft verloren door het verstrijken van de geldigheidsduur, dan wel, indien de aanvrager niet in
      Nederland woonachtig is, een fotokopie van een op naam van de aanvrager gesteld document als bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel49
  - number: '49.4'
    text: |-
      Indien twijfel bestaat aan de juistheid van de in het overgelegde rijbewijs opgenomen gegevens, dan wel
      overigens onvoldoende zekerheid bestaat over de identiteit van de aanvrager, worden de in het rijbewijzenregister
      geregistreerde gegevens van het eerder afgegeven rijbewijs geraadpleegd.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel49
  - number: '50.1'
    text: |-
      Verklaringen van rijvaardigheid worden op aanvraag en tegen betaling van het daarvoor vastgestelde tarief door het
      CBR in het rijbewijzenregister geregistreerd ten behoeve van een ieder die bij een onderzoek naar de rijvaardigheid
      voor het besturen van motorrijtuigen van de rijbewijscategorie waarvoor de verklaring wordt verlangd, aan de
      daarvoor bij ministeriële regeling vastgestelde eisen blijkt te voldoen.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel50
  - number: '50.2'
    text: |-
      In afwijking van het eerste lid wordt ten behoeve van degene wiens rijbewijs op grond van
      [artikel 132, tweede lid, van de wet][ref1] ongeldig is verklaard wegens het niet-verlenen van de vereiste
      medewerking aan de hem opgelegde verplichting zich te onderwerpen aan een educatieve maatregel ter bevordering van
      de rijvaardigheid, gedurende een periode van ten hoogste drie jaren na de ongeldigverklaring van het rijbewijs geen
      verklaring van rijvaardigheid in het rijbewijzenregister geregistreerd zolang hij niet aan die verplichting heeft
      voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '132'
  - number: '51'
    text: |-
      Het voor de aanvraag van verklaringen van rijvaardigheid verschuldigde tarief wordt vastgesteld door het CBR onder
      goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel51
  - number: '53.1'
    text: |-
      Het onderzoek naar de rijvaardigheid voor de rijbewijscategorie AM bestaat uit een theorie-examen en een
      praktijkexamen.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel53
  - number: '53.2'
    text: |-
      Het onderzoek naar de rijvaardigheid voor de rijbewijscategorie A1 bestaat uit een theorie-examen ten behoeve van
      de rijbewijscategorie A, een praktijkexamen voertuigbeheersing en een praktijkexamen verkeersdeelneming.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel53
  - number: '53.3'
    text: 'Het onderzoek naar de rijvaardigheid voor de rijbewijscategorie A2 bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel53
  - number: 53.3.a
    text: |-
      een praktijkexamen waarbij wordt getoetst op zowel voertuigbeheersing als verkeersdeelneming, indien de aanvrager
      op de datum van het praktijkexamen:
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel53
  - number: 53.3.a.1°
    text: ten minste twee jaar beschikt over een hem afgegeven rijbewijs voor de categorie A1, of
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel53
  - number: 53.3.a.2°
    text: |-
      ten minste twee jaar beschikt over een aan hem door het daartoe bevoegde gezag in een andere lidstaat van de
      Europese Unie of in een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte
      of Zwitserland afgegeven geldig rijbewijs voor de categorie A1;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel53
  - number: 53.3.b
    text: |-
      een praktijkexamen voertuigbeheersing en een praktijkexamen verkeersdeelneming, indien de aanvrager op de datum van
      het praktijkexamen voertuigbeheersing:
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel53
  - number: 53.3.b.1°
    text: nog geen twee jaar beschikt over een aan hem afgegeven rijbewijs voor de categorie A1, of
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel53
  - number: 53.3.b.2°
    text: |-
      nog geen twee jaar beschikt over een aan hem door het daartoe bevoegde gezag in een andere lidstaat van de Europese
      Unie of in een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of
      Zwitserland afgegeven geldig rijbewijs voor de categorie A1;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel53
  - number: 53.3.c
    text: |-
      een theorie-examen ten behoeve van de categorie A, een praktijkexamen voertuigbeheersing en een praktijkexamen
      verkeersdeelneming, indien de aanvrager op de datum van het praktijkexamen voertuigbeheersing niet voldoet aan de
      in de onderdelen a of b bedoelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel53
  - number: '53.4'
    text: 'Het onderzoek naar de rijvaardigheid voor de rijbewijscategorie A bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel53
  - number: 53.4.a
    text: |-
      een praktijkexamen waarbij wordt getoetst op zowel voertuigbeheersing als verkeersdeelneming, indien de aanvrager
      op de datum van het praktijkexamen:
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel53
  - number: 53.4.a.1°
    text: ten minste twee jaar beschikt over een aan hem afgegeven rijbewijs voor de categorie A2, of
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel53
  - number: 53.4.a.2°
    text: |-
      ten minste twee jaar beschikt over een aan hem door het daartoe bevoegde gezag in een andere lidstaat van de
      Europese Unie of in een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte
      of Zwitserland afgegeven geldig rijbewijs voor de categorie A2;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel53
  - number: 53.4.b
    text: |-
      een praktijkexamen voertuigbeheersing en een praktijkexamen verkeersdeelneming, indien de aanvrager 24 jaar of
      ouder is en op de datum van het praktijkexamen voertuigbeheersing:
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel53
  - number: 53.4.b.1°
    text: beschikt over een aan hem afgegeven rijbewijs voor de categorie A1,
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel53
  - number: 53.4.b.2°
    text: |-
      beschikt over een aan hem door het daartoe bevoegde gezag in een andere lidstaat van de Europese Unie of in een
      andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland afgegeven
      geldig rijbewijs voor de categorie A1,
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel53
  - number: 53.4.b.3°
    text: nog geen twee jaar beschikt over een aan hem afgegeven rijbewijs voor de categorie A2, of
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel53
  - number: 53.4.b.4°
    text: |-
      nog geen twee jaar beschikt over een aan hem door het daartoe bevoegde gezag in een andere lidstaat van de Europese
      Unie of in een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of
      Zwitserland afgegeven geldig rijbewijs voor de categorie A2;
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel53
  - number: 53.4.c
    text: |-
      een theorie-examen ten behoeve van de categorie A, een praktijkexamen voertuigbeheersing en een praktijkexamen
      verkeersdeelneming, indien de aanvrager 24 jaar of ouder is en op de datum van het praktijkexamen
      voertuigbeheersing niet voldoet aan de in de onderdelen a of b bedoelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel53
  - number: '53.5'
    text: |-
      Het onderzoek naar de rijvaardigheid voor de rijbewijscategorie B bestaat uit een theorie-examen en een
      praktijkexamen.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel53
  - number: '53.6'
    text: |-
      Het onderzoek naar de rijvaardigheid voor de rijbewijscategorie B die de bevoegdheid geeft tot het besturen van
      motorrijtuigen van de categorie B, waaraan een aanhangwagen of oplegger is gekoppeld waarvan de toegestane maximum
      massa meer bedraagt dan 750 kg en de toegestane maximum massa van het samenstel van trekkend motorrijtuig en
      aanhangwagen meer bedraagt dan 3500 kg, maar niet meer bedraagt dan 4250 kg, bestaat uit een praktijkexamen voor de
      rijbewijscategorie E bij B.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel53
  - number: '53.7'
    text: |-
      Het onderzoek naar de rijvaardigheid voor de rijbewijscategorieën C1 en D1 bestaat uit een theorie-examen,
      bestaande uit de onderdelen rijbewijs/vakbekwaamheid 1 en rijbewijs 2, en een praktijkexamen.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel53
  - number: '53.8'
    text: |-
      Het onderzoek naar de rijvaardigheid voor de rijbewijscategorieën C en D bestaat uit een theorie-examen, bestaande
      uit de onderdelen rijbewijs/vakbekwaamheid 1 en rijbewijs 2, en een praktijkexamen.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel53
  - number: '53.9'
    text: Het onderzoek naar de rijvaardigheid voor de rijbewijscategorie E bestaat uit een praktijkexamen.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel53
  - number: '53.10'
    text: |-
      In afwijking van het tweede, derde en vierde lid, bestaat het onderzoek naar de rijvaardigheid voor respectievelijk
      de categorieën A1, A2 en A uit een praktijkexamen verkeersdeelneming voor de desbetreffende categorie, indien de
      aanvrager beschikt over:
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel53
  - number: 53.10.a
    text: |-
      een geldig rijbewijs voor dezelfde categorie als waarop de aanvraag betrekking heeft, dat slechts geldig is voor
      het besturen van motorrijtuigen van deze categorie met automatische schakeling, of
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel53
  - number: 53.10.b
    text: |-
      een geldig rijbewijs voor dezelfde categorie als waarop de aanvraag betrekking heeft, afgegeven door het
      daartoe bevoegde gezag in een andere lidstaat van de Europese Unie of in een andere staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, dat slechts geldig is voor het besturen van
      motorrijtuigen van deze categorie met automatische schakeling.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel53
  - number: '53.11'
    text: |-
      De aanvrager die heeft aangetoond te beschikken over een aan hem afgegeven rijbewijs voor de categorie C1, met
      uitzondering van een rijbewijs voor de categorie C1 dat blijkens de daarop aangegeven codering niet de bevoegdheid
      geeft tot het besturen van een motorrijtuig van de categorie C1 dat onder Verordening (EEG) nr. 3821/85 valt,
      respectievelijk D1, dat hetzij nog geldig is hetzij zijn geldigheid heeft verloren door het verstrijken van de
      geldigheidsduur, verwerft het theorie-examen voor de rijbewijscategorie C of D door in aanvulling op dat rijbewijs
      met goed gevolg de bij ministeriële regeling vastgestelde additionele onderdelen van het theorie-examen voor de
      desbetreffende categorie af te leggen.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel53
  - number: '53.12'
    text: |-
      Voor de toepassing van het elfde lid wordt met een rijbewijs voor de categorie C1 respectievelijk D1 gelijkgesteld
      een geldig rijbewijs C1 respectievelijk een geldig rijbewijs D1, afgegeven door het daartoe bevoegde gezag in
      een andere lidstaat van de Europese Unie of in een andere staat die partij is bij de Overeenkomst betreffende de
      Europese Economische Ruimte of Zwitserland.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel53
  - number: '53.13'
    text: |-
      Het onderzoek naar de rijvaardigheid voor de rijbewijscategorie T bestaat uit een theorie-examen en een
      praktijkexamen.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel53
  - number: 53a.1
    text: |-
      Indien het een aanvraag betreft als bedoeld in [artikel 42a, eerste lid][ref1], en de zwaarste categorie waarop de
      aanvraag betrekking heeft categorie E bij C is, dan bestaat het onderzoek naar de rijvaardigheid uit een theorie-
      examen voor de categorie C en een praktijkexamen voor de categorie E bij C.


