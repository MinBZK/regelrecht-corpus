      aan de aanvrager afgegeven rijbewijs mede verstaan een rijbewijs, respectievelijk het rijbewijs, dat eerder aan de
      aanvrager is afgegeven door
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel42
