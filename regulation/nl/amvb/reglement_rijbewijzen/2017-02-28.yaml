  - number: '184.2'
    text: |-
      Voor de toepassing van [artikel 59, eerste lid, onderdeel e][ref1], wordt onder een aan de aanvrager afgegeven
      rijbewijs B dat zijn geldigheid heeft verloren door het verstrijken van de geldigheidsduur mede verstaan een op
      basis van de Wegenverkeerswet aan de aanvrager afgegeven rijbewijs B dat hetzij nog geldig is, hetzij na 30 juni
      1985 zijn geldigheid heeft verloren door het verstrijken van de geldigheidsduur.


