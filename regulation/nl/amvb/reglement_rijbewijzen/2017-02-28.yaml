      eisen:
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel67d
  - number: 67d.3.a
    text: 'de aanvrager dient een van de volgende documenten over te leggen:'
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel67d
  - number: 67d.3.a.1°
    text: |-
