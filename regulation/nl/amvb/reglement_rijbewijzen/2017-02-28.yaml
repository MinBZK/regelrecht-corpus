  - number: '15.2'
    text: |-
      Het eerste lid, aanhef en onder 3°, onder I, is niet van toepassing op de landbouw- en bosbouwtrekkers en
      motorrijtuigen met beperkte snelheid, bedoeld in het eerste lid, onderdeel j, aanhef en onder 2°, onder VII, mits
      aan dat voertuig geen aanhangwagen of verwisselbare getrokken machine is gekoppeld.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel15
  - number: '15.3'
    text: |-
      Voor de bepaling van het aantal wielen worden twee op dezelfde as gemonteerde wielen als een wiel beschouwd, indien
      de afstand tussen de middens van de contactvlakken van deze wielen met de grond kleiner is dan 460 mm.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel15
  - number: '15.4'
    text: |-
      In afwijking van het eerste lid worden motorrijtuigen, ingericht voor het vervoer van ten hoogste 8 personen,
      de bestuurder daaronder niet begrepen, waarvan de toegestane maximum massa als gevolg van een aan het voertuig
      aangebrachte bepantsering meer dan 3500 kg bedraagt, begrepen onder de rijbewijscategorie B.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel15
  - number: '15.5'
    text: |-
      In afwijking van het eerste lid, onderdeel k, onder I, wordt onder de rijbewijscategorie B mede begrepen het
      samenstel van een motorrijtuig van die categorie en een door dat motorrijtuig voortbewogen aanhangwagen of oplegger
      waarvan de toegestane maximum massa meer bedraagt dan 750 kg, waarbij de toegestane maximum massa van het samenstel
      van trekkend motorrijtuig en aanhangwagen of oplegger meer bedraagt dan 3.500 kg, maar niet meer bedraagt dan 4.250
      kg en het rijbewijs van de bestuurder is voorzien van een bij ministeriële regeling vastgestelde codering waaruit
      blijkt dat de houder is geslaagd voor het examen dat de bevoegdheid geeft tot het besturen van zo'n samenstel.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel15
  - number: '15.6'
    text: |-
      In afwijking van het eerste lid, onderdeel k, onder II, wordt onder de rijbewijscategorie E bij C1 mede begrepen
      een motorrijtuig van de rijbewijscategorie B met een aanhangwagen of oplegger waarvan de toegestane maximum massa
      meer bedraagt dan 3500 kg, mits de toegestane maximum massa van het samenstel niet meer bedraagt dan 12.000 kg.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel15
  - number: 15a
    text: |-
      Indien de aanvrager van een rijbewijs voor de categorie AM, die blijkens de ten behoeve van hem in het
      rijbewijzenregister geregistreerde verklaring van rijvaardigheid het praktijkexamen voor de categorie AM heeft
      afgelegd met een bromfiets op drie of vier wielen, wordt een rijbewijs AM afgegeven dat slechts geldig is voor
      het besturen van bromfietsen op drie of vier wielen. In het rijbewijs is deze beperking aangeduid met een bij
      ministeriële regeling vastgestelde codering.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel15a
  - number: '16'
    text: |-
      Aan de aanvrager van een rijbewijs, die blijkens de ten behoeve van hem in het rijbewijzenregister geregistreerde
      verklaring van geschiktheid slechts een motorrijtuig kan besturen dat aan bepaalde eisen voldoet dan wel slechts
      een motorrijtuig kan besturen indien hij gebruik maakt van kunst- of hulpmiddelen, wordt een rijbewijs afgegeven
      dat slechts geldig is voor het besturen van een motorrijtuig dat aan die eisen voldoet dan wel indien de aanvrager
      bij het besturen gebruik maakt van die kunst- of hulpmiddelen. In het rijbewijs is deze beperking aangeduid met een
      bij ministeriële regeling vastgestelde codering.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel16
  - number: '17.1'
    text: |-
      Aan de aanvrager van een rijbewijs, die blijkens de ten behoeve van hem in het rijbewijzenregister geregistreerde
      verklaring van rijvaardigheid het praktijkexamen heeft afgelegd in een motorrijtuig met automatische schakeling,
      dan wel blijkens de ten behoeve van hem in het rijbewijzenregister geregistreerde verklaring van geschiktheid
      slechts een motorrijtuig mag besturen met automatische schakeling, wordt een rijbewijs afgegeven dat slechts
      geldig is voor het besturen van motorrijtuigen van de in de verklaring van rijvaardigheid of de verklaring van
      geschiktheid genoemde rijbewijscategorie met automatische schakeling. In het rijbewijs is deze beperking aangeduid
      met een bij ministeriële regeling vastgestelde codering.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel17
  - number: '17.2'
    text: Het eerste lid is niet van toepassing op aanvragen voor de rijbewijscategorie AM.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel17
  - number: '17.3'
    text: |-
      Het eerste lid is niet van toepassing op de aanvrager van een rijbewijs voor de categorie T, voor zover het
      de vermelding op het rijbewijs betreft van de beperkende codering die aanduidt dat het praktijkexamen voor de
      rijbewijscategorie T is afgelegd in een motorrijtuig met automatische schakeling.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel17
  - number: '18.1'
    text: |-
      Onverminderd [artikel 17][ref1] wordt aan de aanvrager die in het bezit is van een rijbewijs voor de categorie A1,
      respectievelijk A2, dat is voorzien van een bij ministeriële regeling vastgestelde codering waaruit blijkt dat de
      houder van dat rijbewijs het praktijkexamen heeft afgelegd op een motorrijtuig van de desbetreffende categorie met
      automatische schakeling, en ten behoeve van wie in het rijbewijzenregister een verklaring van rijvaardigheid is
      geregistreerd voor de categorie A2, respectievelijk voor de categorie A, waaruit blijkt dat hij het praktijkexamen
      heeft afgelegd op een motorrijtuig van de categorie A2, respectievelijk van de categorie A, met handschakeling,
      tevens een rijbewijs voor de categorie A1, respectievelijk voor de categorieën A1 en A2, afgegeven zonder dat voor
      die categorie of categorieën een beperking tot motorrijtuigen met automatische schakeling geldt.


