      in een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland,
      dat slechts geldig is voor het besturen van motorrijtuigen van deze categorie met automatische schakeling.
    url: https://wetten.overheid.nl/BWBR0008074/2017-02-28#Artikel67a
